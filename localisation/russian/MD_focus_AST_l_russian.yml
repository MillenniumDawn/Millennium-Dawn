 AST_the_lucky_country: "Счастливая страна"
 AST_the_lucky_country_desc: "После того как Дональд Хорн придумал это выражение в 1964 году, большинство австралийцев неверно истолковали его, посчитав, что оно описывает удачный успех страны в горнодобывающей промышленности. Хотя это правда, что нам досталась очень большая территория, богатая редкими и ценными рудами, Дональд использовал это выражение, чтобы высмеять тогдашних лидеров за слишком большие инвестиции в это направление и пренебрежение дальнейшими экономическими возможностями. Короче говоря: мы недостаточно диверсифицировали экономику. Это привело к ситуации, когда Австралии осталось всего несколько технологических или производственных предприятий, которые мешают ей стать полноценным рентным государством. Мы полностью зависим от экспорта, и либо мы это принимаем, либо начинаем процесс отказа от него."
 AST_fuel_the_mining_boom: "Подпитывайте горнодобывающий бум"
 AST_fuel_the_mining_boom_desc: "Горнодобывающая промышленность была краеугольным камнем австралийской экономики в буквальном смысле с момента обретения страной колониального статуса. От золотой лихорадки до наших дней добыча полезных ископаемых поддерживала и развивала нашу экономику. Все это потребляет колоссальное количество бензина для транспортировки и вывоза руды. Если ситуация на Ближнем Востоке ухудшится, наша экономика может остановиться. Прежде чем мы начнем дальнейшее расширение, нам необходимо обеспечить стратегические запасы внутри страны и иметь резервы на случай непредвиденных обстоятельств."
 AST_acis_scheme: "Схема ACIS"
 AST_acis_scheme_desc: "Программа повышения конкурентоспособности и привлечения инвестиций в автомобильную промышленность была создана для предоставления нашим автомобильным предприятиям льгот по пошлинам и финансирования с целью стимулирования инвестиций, исследований и разработок. Наша отрасль отставала от соседних, поэтому поддержка наших отечественных компаний будет весьма кстати."
 AST_a_sea_of_panels: "Море панелей"
 AST_a_sea_of_panels_desc: "Наши сельские солнечные электростанции – это зрелище, достойное восхищения. Словно круглое произведение искусства, они поглощают лучи, которые обычно лишь обжигают туристов. Нынешнее соотношение возобновляемых источников энергии и ископаемого топлива оставляет желать лучшего, и расширение существующих солнечных электростанций позволит это компенсировать."
 AST_commit_to_renewables: "Поддержите возобновляемые источники энергии"
 AST_commit_to_renewables_desc: "Будущее нашего энергопроизводства не должно определяться нашими запасами угля или газа. Развитие технологий возобновляемой энергии в последние годы продвинулось на удивление быстро. Пришло время воспользоваться этим преимуществом."
 AST_harness_the_wind: "Обуздай ветер"
 AST_harness_the_wind_desc: "В греческой мифологии Эол был богом, которому Зевс поручил управлять ветрами, и он насылал ужасные бури только по приказу. Хотя мы не можем контролировать ветры, благодаря нашим ученым мы можем использовать их энергию. Установка большего количества турбин там, где они принесут наибольшую пользу, обеспечит нас хорошим источником чистой и значительной энергии."
 AST_rewire_the_nation: "Перестроить нацию"
 AST_rewire_the_nation_desc: "В нашей стране мало проблем, которые можно решить, просто вложив в них кучу денег. Это одна из них. Инженеры уже провели свои комитеты и планирование, и теперь мы готовы приступить к модернизации электросетей по всей стране, чтобы привести их в соответствие с текущими потребностями в мощности."
 AST_fix_the_potholes: "Заделайте выбоины на дорогах"
 AST_fix_the_potholes_desc: "Главная проблема дорожного движения в нашей стране всегда заключалась в выбоинах на дорогах. Спросите любого водителя, будь то в городе или в сельской местности, и он расскажет вам истории о ремонте автомобилей, почти авариях и других ужасных происшествиях. Поскольку обязанность защищать наших граждан лежит на правительстве, наша ответственность — искоренить эту напасть."
 AST_north_west_shelf_expansion: "Расширение Северо-Западного шельфа"
 AST_north_west_shelf_expansion_desc: "Северо-западный шельф — один из наших самых долго работающих и успешных газоперерабатывающих заводов на полуострове, перерабатывающий огромную часть всей нашей нефтегазовой продукции. Текущее предложение предусматривает продление срока эксплуатации проекта до 2070 года, что обеспечит нас столь необходимой переработкой до этого времени."
 AST_its_just_coal: "Это всего лишь уголь!"
 AST_its_just_coal_desc: "Есть противники нашей экспансии, которые могут опасаться ископаемого топлива. Им мы говорим: не бойтесь, не пугайтесь, это вам не повредит. Это уголь. Добывать его для нас, австралийцев, почти в крови. Мы дорожим этой темной, пыльной рудой, и она питает наши дома. Возобновляемые источники энергии, возможно, и являются чем-то новым, но уголь всегда будет сгорать для нас."
 AST_high_speed_focus_ast: "Высокоскоростная железная дорога"
 AST_high_speed_focus_ast_desc: "Проклятие высокоскоростных железных дорог преследует наши штаты с 80-х годов. Каждый раз, когда федеральное правительство начинает процесс строительства железной дороги со скоростью более 200 км/ч, проект никогда не выходит за рамки стадии планирования. Но не в этот раз. Мы вмешиваемся сейчас и доведем дело до конца. У нас есть технологии и маршрут: Брисбен — Сидней — Мельбурн. Ничто не встанет у нас на пути."
 AST_dig_deep: "Копайте глубже"
 AST_dig_deep_desc: "В последнее время в наших отдаленных горнодобывающих центрах достигнут ряд прорывов в области переработки глинозема. Если мы окажем прямое давление на ускорение процесса утверждения прав на добычу полезных ископаемых, то они смогут начать бурение раньше и на больших глубинах."
 AST_lng_megaprojects: "Мегапроекты СПГ"
 AST_lng_megaprojects_desc: "Наши заводы по производству сжиженного природного газа (СПГ) — это один из самых современных способов транспортировки природного газа в другие страны, и он позволил нам значительно сэкономить на транспортных расходах. Процесс охлаждения газа до очень низких температур, в результате которого он переходит в жидкое состояние, уменьшает его объем на 600%. Сотрудничество с компаниями для расширения этих объектов и, в некотором смысле, принятие на себя расходов на строительство, позволит запустить их в эксплуатацию в более короткие сроки."
 AST_the_boom_never_ends: "Бум никогда не закончится"
 AST_the_boom_never_ends_desc: "Иногда везет, а иногда просто так сложилась Австралия. В горнодобывающем секторе сейчас бурный рост, и мы хотели бы, чтобы этот бум продолжался. Инвестиции, стимулы, все это. Наши компании будут продолжать бурение с нашего разрешения, а нам остается только расслабиться и наслаждаться этим."
 AST_treat_the_farmers: "Позаботьтесь о фермерах"
 AST_treat_the_farmers_desc: "Фермеры в нашей стране, как известно, одни из самых трудолюбивых людей. К концу дня их руки покрыты грязью, чтобы мы могли носить на них бриллиантовые кольца. По крайней мере, так я слышал. В любом случае, мы должны вознаградить их за труд. Своего рода награду."
 AST_enjoy_the_prosperity: "Наслаждайтесь процветанием!"
 AST_enjoy_the_prosperity_desc: "Когда вы задаете вопросы экспертам, все они сходятся во мнении, что наш горнодобывающий сектор никуда не денется. Прямо сейчас экспорт обеспечивает страну энергией, какой мы никогда прежде не испытывали, и мы можем наслаждаться плодами этого. Мы можем существенно инвестировать в инфраструктуру для поддержки будущих горнодобывающих проектов и стимулировать производство, пока есть такая возможность. Это позволит нам извлечь максимальную выгоду из этого бума."
 AST_heavy_industry_projects: "Проекты тяжелой промышленности"
 AST_heavy_industry_projects_desc: "Наши государственные строительные компании усердно работают над развитием этой замечательной страны, но потребность в увеличении мощностей очевидна. Реализация планов расширения будет дорогостоящей, но несложной. Мир увидит ту Австралию, которой нам суждено стать."
 AST_urban_expansion_initiative: "Инициатива по расширению городской территории"
 AST_urban_expansion_initiative_desc: "Мы не можем строить без земли, и это предложение составлено таким образом, чтобы позволить нам обойти многие обычные требования по приобретению земли, которые выдвигают некоторые из протестующих. \"захват,\" Чего, конечно, не произойдет. За землю, разумеется, заплатят, просто процесс будет быстрее."
 AST_defy_the_mantra: "Бросьте вызов мантре"
 AST_defy_the_mantra_desc: "Мы не будем оставаться привязанными к какому-то прозвищу. Австралия либо будет развиваться, либо умрет. Когда истощатся шахты или наступит следующая экономическая катастрофа, наша экономика сохранится, потому что мы инвестировали в ее будущее. Расширяя свою деятельность в различных экономических направлениях, мы можем диверсифицировать наше внутреннее производство. Мы не будем рентным государством, а станем сильной нацией."
 AST_global_weapons_manufacturing: "Глобальное производство оружия"
 AST_global_weapons_manufacturing_desc: "Австралия никогда не была известна как глобальный поставщик оружия, за исключением, скорее, негласных соглашений. Если диверсификация необходима, увеличение производства и, возможно, поставки в другие страны могут оправдать инвестиции."
 AST_overseas_opportunities: "Зарубежные возможности"
 AST_overseas_opportunities_desc: "Многие из наших крупнейших компаний, занимающихся ископаемым топливом, уже активно работают за рубежом, где только появляется возможность. Эту деятельность можно было бы стимулировать, если бы мы смягчили действующие правила и ввели некоторые льготы в отдельных регионах."
 AST_the_white_paper: "Белая книга"
 AST_the_white_paper_desc: "Наше высшее руководство рекомендовало начать реструктуризацию с установления целевых показателей, чтобы задать тон. У нас есть несколько вариантов для продвижения процесса, но в конечном итоге все зависит от того, в какой области, по нашему мнению, армию можно улучшить лучше всего. Производство вооружений всегда будет фактором, который мы должны учитывать. Установление производственных целей может ускорить подготовку. Численность войск — еще одна область, которую можно улучшить за счет ускорения квот на обучение. Наконец, мы могли бы переложить бремя на наши оборонные предприятия. Ускорение сроков выполнения нескольких проектов должно стать для них достаточной мотивацией."
 AST_hardening_our_units: "Укрепление наших устройств"
 AST_hardening_our_units_desc: "Во время войны в Персидском заливе и других интервенций с тех пор асимметричные угрозы стали новой и пугающей формой войны, с которой нам пришлось столкнуться. Иногда одной лишь большей огневой мощи недостаточно, и те немногие, кому не посчастливилось пережить эти новые атаки, особенно с использованием самодельных взрывных устройств, выжили благодаря тому, что их техника выдержала. Развитие нашей выносливости может стать тем решающим фактором, который необходим нашим войскам для выживания и продолжения операций."
 AST_a_networked_army: "Армия, объединенная в сеть"
 AST_a_networked_army_desc: "Цифровые технологии уже стали настоящим чудом для наших отраслей промышленности. Аналогично, преобразование сухопутных войск в цифровую, взаимосвязь и взаимодействие «от датчика до стрелка» позволяет быстрее принимать решения и мгновенно передавать командование. Наши объединенные силы станут более сплоченными, чем когда-либо, а операциями можно будет управлять напрямую, обеспечивая принятие правильных решений в нужное время."
 AST_diisr_ast: "ДИИСР"
 AST_diisr_ast_desc: "По тем или иным причинам у нас нет единого научно-исследовательского института, находящегося под государственным контролем. У нас есть довольно много частных институтов, и даже некоторые ведущие на государственном уровне, но потребность в учреждении для проведения необходимых нам исследований требует чего-то более масштабного. На нашем столе уже находятся планы создания Министерства инноваций, промышленности, науки и исследований, и строительство просто ожидает одобрения."
 AST_rnd_tax_incentive: "Налоговые льготы на НИОКР"
 AST_rnd_tax_incentive_desc: "Теперь, когда DIISR запущен и функционирует, выделение части финансирования на исследования и разработки, а также ряд субсидий для начала проектов гарантируют, что мы будем на передовой инноваций."
 AST_our_beloved_bushmaster: "Наши любимые Бушмастеры"
 AST_our_beloved_bushmaster_desc: "Винтовки Bushmaster стали культовой единицей нашей армии, завоевав сердца многих военных экспертов благодаря своей универсальности, уникальному дизайну и боевым возможностям. Они хорошо служат нам за рубежом, и их производство должно стать приоритетом. К счастью, это пожелание уже было включено в Белую книгу."
 AST_the_special_forces: "Кто осмелится, тот и победит"
 AST_the_special_forces_desc: "Австралийский спецназ SAS стал предметом гордости для многих, и это вполне заслуженно. Элитный полк, первоначально созданный по образцу британского подразделения, оказался весьма полезным для проведения секретных зарубежных операций. Оснащение их лучшими технологиями гарантирует их дальнейший успех."
 AST_lessons_from_the_middle_east_ast: "Уроки Ближнего Востока"
 AST_lessons_from_the_middle_east_ast_desc: "В ходе ряда операций на Ближнем Востоке мы многому научились. В частности, мы обнаружили несовместимость нашей формы с пыльной погодой, характерной для этого региона. Хотя она и разработана для австралийской жары, ее можно улучшить."
 AST_remembering_the_anzacs: "В память об АНЗАКах"
 AST_remembering_the_anzacs_desc: "Наша церемония в честь Дня АНЗАК всегда была посвящена тем, «кто служил и погиб во всех войнах, конфликтах и ​​миротворческих операциях». Это включает в себя не только тех, кто погиб в Первой мировой войне, но и наших солдат в недавних конфликтах, таких как война в Персидском заливе и в Индонезии. Урок, который мы извлекаем, — это священный долг обеспечивать безопасность наших войск. Сейчас, когда война постоянно меняется, мы тоже должны меняться и внедрять инновации, чтобы дать нашим войскам наилучшие шансы на поле боя. В противном случае мы будем вспоминать их на следующей церемонии."
 AST_never_another_darwin: "Никогда больше Дарвина"
 AST_never_another_darwin_desc: "19 февраля 1942 года в Дарвин был нанесен массированный налет примерно 188 японских самолетов. Помимо разрушения нашей военной инфраструктуры, потери личного состава и мирных жителей были катастрофическими и самыми крупными за всю войну. Правила ведения войны изменились, но уроки остались прежними."
 AST_new_tools: "Новые инструменты"
 AST_new_tools_desc: "Если XXI век что-то и доказал нам, так это то, что самоуспокоение убивает. Конечно, мы могли бы сохранить те же винтовки, те же доктрины, но наши враги этого не сделают. Инновации по обе стороны Атлантики и Тихого океана привели к созданию более совершенного оружия, разработанного для более широкого спектра условий и типов угроз. Этого мы не можем себе позволить игнорировать."
 AST_old_reliable: "Старый надежный"
 AST_old_reliable_desc: "Мы уже во время холодной войны искали за рубежом и выбрали австрийцев. Компания Steyr сделала правильный выбор с моделью AUG. Это обтекаемое, элегантное оружие, которое наши производители совершенствовали на протяжении десятилетий. Зачем менять то, что и так хорошо? Вместо этого мы можем инвестировать в расширение текущего производства, обеспечив готовность к любым неожиданным спросам."
 AST_lithgow_arms: "Литгоу Армс"
 AST_lithgow_arms_desc: "Завод Lithgow Arms с 1912 года является символом наших возможностей и стойкости. Он верно служил нам на протяжении Первой и Второй мировых войн и за это время произвел для нас более миллиона винтовок. Именно поэтому его нынешнее плачевное состояние тяжело видеть. Нужно что-то с этим делать."
 AST_grow_our_command: "Расширить наше командование"
 AST_grow_our_command_desc: "Один из пунктов разработанного «белого документа» завершен. Речь идет о Командовании специальных операций, призванном объединить наши подразделения специального назначения с коммандос. В условиях постоянно растущей угрозы терроризма, а также обычных трудностей, нашим силам специального назначения необходима вся возможная помощь. Объединение усилий может создать единую наступательную силу, которую мы сможем использовать."
 AST_the_second_white_paper: "Второй Белый документ"
 AST_the_second_white_paper_desc: "После более или менее успешного принятия Белой книги 2000 года администрация дала нам новую директиву, во многом похожую на предыдущую: продолжение расширения и повышение нашего технологического потенциала, чтобы мы, по всем параметрам, оставались наравне с гигантами. Мы уже справлялись с этим раньше, мы можем сделать это снова."
 AST_strategic_reform: "Стратегическая реформа"
 AST_strategic_reform_desc: "Нынешнее состояние наших ведомств неприемлемо. Комплексная реформа наших стратегических сил позволит устранить некоторые недостатки, накопившиеся за последние несколько десятилетий, и превратит нас в гораздо более оперативные и быстро реагирующие силы, способные справляться с постоянно меняющейся ситуацией, сложившейся в Тихоокеанском регионе."
 AST_incorporate_the_peacekeeping_training_ast: "Включите в программу обучение миротворческим операциям."
 AST_incorporate_the_peacekeeping_training_ast_desc: "Австралия принимает участие в миротворческих операциях Организации Объединенных Наций с конца Второй мировой войны, предоставляя персонал и ресурсы. За эти десятилетия, и особенно во время недавней интервенции в Восточном Тиморе, мы извлекли ряд уроков ведения войны, которые можно было бы лучше внедрить в нашу собственную доктрину, обеспечивая защиту наших войск даже в самых неблагоприятных условиях."
 AST_recruitment_campaigns: "Рекрутинговые кампании"
 AST_recruitment_campaigns_desc: "С тех пор, как появился плакат \"Coo-ee-won't YOU come?\", у нас появился талант к проведению рекрутинговых кампаний. С развитием интернета перед нами открылись совершенно новые возможности. Мы можем размещать множество рекламных объявлений, используя доступное пространство, и охватывать тех, кто не склонен смотреть обычное телевидение."
 AST_land_one_two_one: "ЗЕМЛЯ 121"
 AST_land_one_two_one_desc: "Проект представляет собой непрерывную работу по замене многих наших устаревших, незащищенных средних и тяжелых грузовиков на усовершенствованные модели Rheinmetall, призванные улучшить их логистику и мобильность, а также обеспечить преимущества в плане брони. На данный момент проект оказался успешным, и теперь следующими на очереди – наши машины противовоздушной обороны и машины непосредственной поддержки."
 AST_stop_panicking: "ПРЕКРАТИТЕ ПАНИКОВАТЬ"
 AST_stop_panicking_desc: "Всем нужно успокоиться. Мы — правительство, мы не контролируем экономику. Если дела идут плохо, даже на мгновение, все вдруг начинают указывать пальцем на нас. Хуже того, они начинают паниковать. Стимулирование экономики практически для всех должно немного успокоить нас, пока мы не возьмем ситуацию под контроль."
 AST_guarantee_the_banks: "Гарантировать банкам"
 AST_guarantee_the_banks_desc: "Если банки боятся, мы будем поддерживать их в плюсе. Мы сделаем все необходимое, чтобы они продолжали работать, черт возьми, мы гарантируем ВСЕ банковские депозиты. Ни один банк в этой стране не обанкротится, и мы будем применять достаточно бюджетных мер, чтобы ВВП продолжал расти за счет одних только государственных расходов."
 AST_grab_the_securities: "Хватайте ценные бумаги"
 AST_grab_the_securities_desc: "Все это началось с рынка жилья в США, и тысячи домовладельцев в Австралии задаются вопросом, не произойдет ли то же самое с ними. Мы можем успокоить общественность, выкупая ипотечные ценные бумаги для поддержки наших жилищных финансов и обеспечения того, чтобы они не обанкротились."
 AST_turn_things_around: "Изменить ситуацию к лучшему"
 AST_turn_things_around_desc: "Национальный план строительства и создания рабочих мест стал крупнейшим экономическим пакетом, который мы когда-либо разрабатывали. Он охватывает школьную инфраструктуру, социальное жилье, жилищное строительство, налоговые льготы, железнодорожные проекты и бесчисленное количество стимулирующих выплат. Пик нашей поддержки страны должен показать, что мы серьезно настроены вернуть все на круги своя, и успокоить всех."
 AST_the_royal_australian_navy: "Королевский военно-морской флот Австралии"
 AST_the_royal_australian_navy_desc: "Наша гордость и радость, бороздившая берега Австралии, – это Королевский британский военно-морской флот (RAAN). Если это еще не очевидно, Австралия – островное государство. На протяжении веков единственным способом для вторжения на наши берега был флот, и когда-то нас защищал от этого Королевский британский флот. Конечно, сейчас нас может поразить межконтинентальная ракета, и ущерб может быть гораздо больше, даже если никто не высадится на наши берега, но дело не в этом. В знак уважения к той роли, которую они когда-то играли, и выполняя не менее важную работу, мы называем наш флот Королевским и отправляем его на защиту морей, как это было прежде. На защиту нашей славной нации."
 AST_embrace_the_support_role: "Примите на себя роль помощника."
 AST_embrace_the_support_role_desc: "Примите на себя роль поддержки — реальность нашего положения в Тихом океане такова, что мы играем роль временной защиты. В одиночку, один на один, у нас нет никаких шансов против китайского или российского флота. Мы будем сопротивляться, но единственный способ выиграть войну — это заручиться поддержкой союзников. Наша роль всегда заключалась в том, чтобы быть на вторых ролях по отношению к американцам, и пока это нас устраивает. Все, что нам нужно сделать, это продержаться до их прибытия, и тогда мы победим. Нет ничего постыдного в том, чтобы играть роль поддержки, особенно если мы делаем это хорошо."
 AST_we_are_the_pacific: "Мы — Тихоокеанский регион"
 AST_we_are_the_pacific_desc: "Времена изменились. Советского Союза больше нет, и Китай пока не является его преемником. В действительности морская война крайне маловероятна. Если бы она была, мы могли бы не справиться. Не с нашим флотом. Если мы возьмемся за его расширение, мы сможем создать силу, с которой мало кто сможет считаться. Используя все имеющиеся в нашем распоряжении ресурсы, роль нашей страны может оказаться не предопределенной."
 AST_trade_support: "Поддержка торговли"
 AST_trade_support_desc: "Одной из наших важнейших обязанностей является защита торговых отношений между нами и нашими ценными партнерами. Обеспечение безопасности потока товаров от перехвата со стороны наших морских соперников, таких как Китай, гарантирует, что торговля с нашими крупнейшими импортерами, такими как Китай, будет продолжать процветать."
 AST_multidimensional_warfare: "Многодоменные операции"
 AST_multidimensional_warfare_desc: "Интеграция военной мощи на суше, на море, в воздухе, космосе и киберпространстве дает нам значительное преимущество перед противниками, испытывающими недостаток в этих областях. В этом направлении необходимо сотрудничать как военно-воздушным, так и военно-морским силам."
 AST_whetstone_training: "Тренировка по точильным камням"
 AST_whetstone_training_desc: "Как меч, оставленный без дела, наш флот, если его постоянно не испытывать и не совершенствовать, заржавеет насквозь. Морские учения должны привести наших курсантов и матросов в форму, клянусь! Они будут готовы к любому столкновению в любое время, потому что это их работа, и они оправдают наши ожидания."
 AST_wide_scanning: "Широкоформатное сканирование"
 AST_wide_scanning_desc: "Оперативная радиолокационная сеть Джиндали (JORN) прошла стадию прототипирования и перешла к пятому этапу внедрения, что, по сути, означает, что это, вероятно, самая передовая радиолокационная технология в мире, осуществляющая мониторинг на дальностях более 3000 километров. Изобрести её было легко, а вот установить на наши корабли — сложно."
 AST_an_outside_review: "Внешний обзор"
 AST_an_outside_review_desc: "Для оценки наших возможностей мы заказали независимую экспертизу. Результаты оказались довольно неожиданными и критично оценили наши производственные мощности, которые нам необходимо кардинально изменить, если мы хотим добиться успеха в создании серьезного военно-морского флота."
 AST_the_middle_ships: "Средние корабли"
 AST_the_middle_ships_desc: "В разработку наших эсминцев класса «Хобарт» было вложено много труда и усилий. Заменив корабли класса «Перт», построенные в 60-е годы, и призванные восстановить наши возможности в области управляемых ракет, они, возможно, станут нашим самым важным шагом в модернизации в целом."
 AST_screening_role: "Роль отбора"
 AST_screening_role_desc: "Если мы поддерживаем наших союзников в Тихом океане, мы должны быть для них глазами и ушами. Наша способность видеть угрозы до того, как они окажутся у наших дверей, приносит им не только тактическую выгоду, но и помогает нам подготовиться и контролировать ситуацию на поле боя. Чем лучше мы это делаем, тем лучше будут наши результаты."
 AST_below_the_enemy: "Внизу от врага"
 AST_below_the_enemy_desc: "Хотя некоторые из наших подводных лодок были введены в строй сравнительно недавно, большая часть нашего флота очень старая. Большинство из них были модернизированы, но это не меняет того факта, что они активно ставят нас в невыгодное технологическое положение, особенно когда наш лучший шанс — это непрямой бой."
 AST_containment_theory: "Теория сдерживания"
 AST_containment_theory_desc: "В период холодной войны мы, наряду с американцами, действовали в рамках «теории сдерживания». Эта теория была разработана специально для блокирования советской экспансии. Геополитическая ситуация изменилась, но в некотором смысле задача осталась прежней. Наши враги преследуют вполне реальную экспансионистскую цель. Будь то дипломатия или строительство островов, наш суверенитет, несомненно, находится под угрозой, если мы не сможем этому противостоять или, по крайней мере, сдержать это. Постоянное военно-морское присутствие наряду с успешными дипломатическими действиями — единственный способ обеспечить будущее без прямой войны, а это значит, что это наш единственный вариант."
 AST_the_groundwork: "Подготовка"
 AST_the_groundwork_desc: "Необходимо приложить максимум усилий для создания необходимой инфраструктуры. Потребуется быстрое масштабное расширение существующих судостроительных верфей и производственных площадей, что, как ожидается, обойдется довольно дорого."
 AST_expand_command_capabilities: "Расширение возможностей управления"
 AST_expand_command_capabilities_desc: "Учитывая масштаб наших задач, нам потребуется расширить штаб ВМС, а также Министерство обороны для управления им. Поддержание тесной связи между двумя родами войск в переходный период, а также контроль за увеличением объемов производства, будут дорогостоящими, но необходимыми."
 AST_carrier_project: "Проект \"Карьер\""
 AST_carrier_project_desc: "Не так давно у Австралии были собственные авианосцы. HMAS Sydney и Melbourne были пригодны для любых боевых действий и являлись настоящими жемчужинами моря. Однако времена изменились, и наши военные расходы сократились, поэтому такие гиганты перестали быть целесообразными. До сих пор. Авианосцы будут возвращены в наш флот, и наследие наших списанных кораблей будет жить дальше."
 AST_like_submarines_in_a_barrel: "Как подводные лодки в бочке"
 AST_like_submarines_in_a_barrel_desc: "Нам необходимо преодолеть дефицит авианосцев, и для этого нам придётся использовать наши вертолёты. MH-60R Seahawk — яркий пример достижения наших целей в области мобильности. Мы можем инвестировать в этот проект, чтобы разработать конструкцию и начать производство."
 AST_ship_to_air: "Не кормите разрушителей"
 AST_ship_to_air_desc: "Наши эсминцы жаждут ракет, и единственный способ их подпитать — это больше ракет. Старые технологии не подойдут. Нам понадобится что-то совершенно новое, чтобы прокормить этих существ."
 AST_grants_to_contractors: "Гранты подрядчикам"
 AST_grants_to_contractors_desc: "Если бы они не предоставляли нам всегда именно то, что мы хотели, я бы сказал, что эти компании нами пользуются. К счастью, правильные инвестиции оказались достаточно надежными, чтобы поддерживать партнерство. Еще немного инвестиций, и мы, возможно, увидим необходимое нам увеличение производства."
 AST_adf_academies: "Академии Сил обороны Австралии"
 AST_adf_academies_desc: "Наш ведущий институт, сочетающий военную подготовку с университетским образованием, находится в Канберре. Это всего лишь одно здание, но для удовлетворения наших оборонных потребностей это число необходимо значительно увеличить. Мы построим несколько таких зданий во всех наших крупных городах, и, возможно, немного смягчим некоторые требования."
 AST_the_raaf: "Королевские военно-воздушные силы Австралии"
 AST_the_raaf_desc: "Ах, Королевские военно-воздушные силы Австралии. Наше главное подразделение воздушной войны, продолжающее обеспечивать безопасность и порядок в небе над Австралией. У них лучшая форма, лучшее питание и самая крутая работа среди всех Сил обороны Австралии. Но давайте не будем зацикливаться на привилегиях. Мандат издан, и цель проста: превосходство в воздухе в Тихом океане и поддержка наших экспедиционных операций. Как мы будем это делать — решать нам."
 AST_fourth_generation_striking: "Удары 4-го поколения"
 AST_fourth_generation_striking_desc: "Получить в своё распоряжение самолёты четвёртого поколения будет непросто, и для этого нам потребуется в полной мере использовать наши связи и технологические возможности. Разрыв между истребителями 3-го и 4-го поколений не так уж велик, но, учитывая темпы разработки 5-го поколения, очевидно, что мы не хотим отставать."
 AST_globemasters: "Глобмастерс"
 AST_globemasters_desc: "Boeing Globemaster III — наш основной грузовой самолет для стратегических воздушных перевозок и транспортировки войск. Компания Boeing, безусловно, превзошла все ожидания. Эта модель больше и намного мощнее предыдущей, но, как ни странно, нам нужен еще один. Мы отправим им технические характеристики и надеемся, что результаты нас устроят."
 AST_shadow_in_the_sky: "Тень в небе"
 AST_shadow_in_the_sky_desc: "AAI RQ-7 Shadow — это наш самый эффективный разведывательный беспилотник и боевой дрон, находящийся в настоящее время в разработке. Еще одна передовая технология, заимствованная у американцев, которая знаменует собой резкое изменение характера ведения войны. По мере развития нашей мобильной инфраструктуры и расширения масштабов наших операций, наши боевые возможности фактически значительно возросли, превзойдя все наши прежние возможности."
 AST_the_roulettes: "Рулетки"
 AST_the_roulettes_desc: "«Рулетки» — это собственная пилотажная группа ВВС. Они облетели весь мир, демонстрируя множество смелых выступлений, и, естественно, завоевали восхищение тех, кому посчастливилось их увидеть. Суть в том, что если их полеты наносят ущерб нашей репутации, то мы, безусловно, позволим им летать."
 AST_employ_ballistic_missiles: "Использовать баллистические ракеты"
 AST_employ_ballistic_missiles_desc: "Высокоточные ракеты большой дальности часто используются для сдерживания конфликтов. Это волшебный инструмент, позволяющий балансировать на грани между конфронтацией и полномасштабной войной. Если, например, одна из наших зарубежных баз подвергнется обстрелу, мы сможем развернуть... \"пропорциональный ответ\" В этом случае мы нанесем удар по ним в столь же стратегически важном месте нашими ракетами большой дальности, и все вернутся домой довольными, лишь с немного уязвленным самолюбием и без опасений войны. В теории."
 AST_project_wedgetail: "Проект Веджтейл"
 AST_project_wedgetail_desc: "Проект Boeing E-7 — одна из наших последних разработок в области мобильных командных центров. Благодаря установленному на борту радару он обеспечивает систему раннего предупреждения и позволяет получать информацию о местоположении противника в режиме реального времени. Самолет, разумеется, может быть переоборудован и использован для других целей в воздухе по нашему усмотрению."
 AST_keep_them_out: "Не допускайте их внутрь."
 AST_keep_them_out_desc: "Обнаружение — это одно, а сдерживание вражеских самолетов от обстрела австралийских городов — совсем другое. Наши самолеты не всегда могут находиться в воздухе, поэтому их заменят портативные и стационарные системы «NASAMS». В сочетании с радаром они представляют собой мощную оборонительную силу."
 AST_preserve_the_super_hornets: "Сохраним Супершершней"
 AST_preserve_the_super_hornets_desc: "После вывода из эксплуатации F-111, их место заняли 24 истребителя F/A-18F Super Hornet, которые сами уже немолоды. Мы можем улучшить модель и обновить ряд внутренних систем, чтобы облегчить переход и обеспечить их готовность к новой роли."
 AST_masters_of_command: "Мастера командования"
 AST_masters_of_command_desc: "Использование вертолетной логистики в операциях произвело революцию в нашем мобильном потенциале. Благодаря отсутствию необходимости в аэропортах, вертолеты представляют собой оптимальный вариант применения в зонах повышенной напряженности и на постоянно меняющихся полях сражений. Создание агентства, специализирующегося на логистических операциях с использованием вертолетов, повысит их эффективность во всех областях."
 AST_reopen_cockatoo_island: "Остров Кокатоу вновь открыт."
 AST_reopen_cockatoo_island_desc: "Растущая потребность в ремонтных верфях начинает истощать нашу существующую инфраструктуру. Остров Кокатоу, который был закрыт совсем недавно, в 90-х годах, но стал своего рода туристическим центром, необходимо будет перестроить с нуля, чтобы отремонтировать новое поколение вышедших из строя кораблей."
 AST_the_howard_government: "Правительство Говарда"
 AST_the_howard_government_desc: "Солнце восходит над нашей страной. Богатая красотой, золотистой землей и поистине окруженная морем. Австралия уникальна в своем положении региональной державы в Тихом океане; страна со множеством друзей и немногими врагами. И все же австралийцы жаждут лучшего будущего, и многие оказались за бортом общества. Рабочий класс сплотился вокруг правительства Ховарда на последних выборах, обеспечив либералам комфортное большинство. Теперь нам был дан мандат на осторожные перемены, и от нас ожидают, что мы их выполним. Правительство Китинга оставило нам значительную дыру в бюджете, которую, хотя мы и старательно пытались залатать, все же приходится доводить до рентабельности. Протесты заполонили улицы, требуя действий, и наши собственные предприятия призывают к экономическим реформам. Счастливая страна в наших руках."
 AST_new_millennium_economics: "Экономика нового тысячелетия"
 AST_new_millennium_economics_desc: "Бюджет представлен и утвержден. Финансовая дисциплина и профицит бюджета — наши самые востребованные меры, но это не значит, что мы не можем немного потратиться, чтобы заработать в будущем. Различные раздутые государственные активы идеально подходят для продажи, и еще можно произвести множество сокращений для финансирования расширения других программ. \n\nРезервный банк уже повысил процентную ставку. Нам остается последовать его примеру. Мы будем жесткими, но справедливыми, как всегда."
 AST_trim_taxes: "Налоги на обрезку"
 AST_trim_taxes_desc: "На последних выборах мы обещали снизить налоги для трудолюбивых австралийцев. Наша позиция не изменилась. Пожилые жители и лица с высокими доходами могут первыми получить выгоду от снижения налогов, что позволит направить больше средств в местный бизнес и увеличить налоговые поступления."
 AST_restrict_welfare: "Сократите количество бездельников, получающих пособия по безработице."
 AST_restrict_welfare_desc: "Расширение системы пособий по безработице вызвало беспокойство у членов партии, опасающихся раздувания бюджета. Без способа остановить это раздувание мы сведем на нет всю нашу тяжелую работу по сбалансированию бюджета за последние несколько лет. Если мы начнем с ограничения масштабов программы и введения жестких требований для ее участия, мы, возможно, сможем справиться. Увеличение взаимных обязательств также отсеет некоторых менее продуктивных участников."
 AST_another_round_of_tax_cuts: "Очередной раунд снижения налогов"
 AST_another_round_of_tax_cuts_desc: "Каким бы было наше правительство, если бы мы не думали о бизнесе? За время нашего правления был достигнут значительный рост, но некоторые малые предприятия, и даже несколько крупных, показали снижение производительности. Мы можем облегчить их положение с помощью дальнейшего снижения налогов и небольших реформ, чтобы стимулировать конкуренцию."
 AST_launch_the_gst: "Ввести GST"
 AST_launch_the_gst_desc: "Закон принят, и теперь «налог на товары и услуги» может заменить устаревшие системы прошлых лет. Лис и другие скептики могут ворчать по этому поводу, но налог на товары и услуги прошел проверку временем. Предприятия могут получить выгоду от упрощенного, оптового налогообложения, и это также не нанесет ущерба бюджету."
 AST_cater_to_the_seniors: "Уделяйте внимание пожилым людям"
 AST_cater_to_the_seniors_desc: "Любое здоровое правительство время от времени прибегает к межпартийной борьбе. Даже политика, направленная против государства, должна рассматриваться в интересах нашего народа. Налог на товары и услуги (GST) существенно увеличил бюджет, но многие наши пенсионеры не ощущают от этого никакой пользы. Исключение основных продуктов питания из программы и щедрая компенсация пенсионерам должны смягчить удар. Либералы не будут принесены в жертву на костре идеологической чистоты."
 AST_rethink_negative_gearing: "Переосмыслите отрицательное передаточное отношение."
 AST_rethink_negative_gearing_desc: "Наши изменения, направленные на повышение налоговых льгот для ипотечных кредиторов, не обошлись без споров. Владельцы жилья, и особенно представители старшего поколения, приветствовали эти изменения, однако те, кто не мог позволить себе жилье, увидели резкий рост цен за короткий период. Более склонные к поддержке лейбористов в нашем правительстве наблюдают, как последствия нарастают еще до окончания нашего срока. Это может подорвать наше доверие со стороны старшего поколения, но здоровая экономика в долгосрочной перспективе может исправить ситуацию. Остается только надеяться, что те, кто борется за выживание, останутся верны нам."
 AST_first_home_first_served: "Первый дом – первый обслуженный"
 AST_first_home_first_served_desc: "Еще одной из потенциальных жертв налога на товары и услуги (GST) станут покупатели первого жилья. В связи с ростом цен на строительные материалы мы выделили грант в размере 7000 долларов США для тех, кто впервые покупает жилье. Это поможет им получить преимущество на растущем конкурентном рынке."
 AST_meeting_the_mining_giants: "Встреча с горнодобывающими гигантами"
 AST_meeting_the_mining_giants_desc: "Встречи лидера страны с крупными игроками — не редкость. Торгово-промышленная палата Боулдера запросила личную встречу, вероятно, под влиянием недавнего снижения налогов. Можно лишь предположить, что они осмелятся выдвинуть новые требования. В конечном итоге, от нас зависит, прислушаемся ли мы к ним."
 AST_proud_and_free: "Гордые и свободные"
 AST_proud_and_free_desc: "Если мы рассмотрим регионы, наиболее страдающие от нехватки квалифицированных кадров и безработицы, мы можем сосредоточиться на создании до 24 технических колледжей, ориентированных на тех, кто рано бросил школу, и безработных. Расширение программы «Работа за пособие» на учеников позволит им оказаться в равном положении со студентами университетов. Вооруженные силы также обязались выделить часть средств на оборудование и техническое обслуживание для дополнительной профессиональной подготовки. Студенты получат больше свободы для реализации своих профессиональных интересов, а наша обрабатывающая промышленность получит поддержку. Это позволит охватить одновременно около десятка групп населения с низким уровнем дохода и, безусловно, расширит нашу электоральную базу среди молодежи, обучающейся в профессиональных колледжах."
 AST_invest_in_people: "Инвестируйте в людей"
 AST_invest_in_people_desc: "Тем, кто оказался на самом дне, бывает трудно подняться. Не поощряя длительную безработицу, мы можем избежать наказания таких людей, предоставив им стимулы для участия в программах обучения в колледжах TAFE и других проектах оборонного и общественного назначения. Это будет не столько бесплатная помощь, сколько инвестиции в будущее наших работников."
 AST_beef_up_the_dole: "Увеличьте размер пособия по безработице"
 AST_beef_up_the_dole_desc: "Наша программа «Работа за пособие» пока что пользуется огромным успехом. Число безработных в Австралии сократилось, а участники программы активно работают над повышением своей трудоспособности. Мы можем расширить программу, включив в нее общественные работы, и расширить возрастной диапазон для подходящих кандидатов."
 AST_the_baby_bonus: "Детский бонус"
 AST_the_baby_bonus_desc: "Рождение ребенка больше не будет сопряжено с финансовыми рисками. Заменив пособие по беременности и родам, новоиспеченные матери получат единовременную выплату в размере 3000 долларов. Это побудит молодые семьи решиться на этот шаг и смягчит бремя, связанное с появлением ребенка на свет."
 AST_protect_the_water: "Защитите воду"
 AST_protect_the_water_desc: "Некоторые из самых отдаленных от побережья рек могут полностью пересохнуть всего за неделю плохой погоды, лишив целые фермы и города воды. Национальная водная инициатива — это первый шаг на пути к устойчивому развитию. Управление водопотреблением и поддержание устойчивого уровня забора воды в самых отдаленных населенных пунктах обеспечивает доступ к воде для миллионов людей."
 AST_the_kyoto_protocol_ast: "Киотский протокол"
 AST_the_kyoto_protocol_ast_desc: "Мы уже согласовали справедливые условия в предложении ООН. Ратификация этого предложения объединит нас с 84 другими странами, которые уже взяли на себя обязательства по сокращению выбросов парниковых газов. Каким бы ни было наше влияние на глобальное потепление, вы можете быть уверены, что мы сводим его к минимуму и что Австралия является ответственной страной в этом вопросе."
 AST_the_carbon_pollution_reduction_scheme: "Схема сокращения выбросов углекислого газа"
 AST_the_carbon_pollution_reduction_scheme_desc: "Радд предложил схему сокращения текущего уровня выбросов углекислого газа нашими отраслями промышленности на 25%, используя «ограничения», которые компании должны будут соблюдать, чтобы не превышать уровень загрязнения. Радд — типичный высокомерный человек и нытик, когда дело касается изменения климата, но общественность его поддерживает. Если мы немного подкорректируем схему, чтобы не нанести ущерб нашему конкурентному преимуществу в области ископаемого топлива, нам, возможно, это сойдет с рук."
 AST_the_drought_force: "Сила засухи"
 AST_the_drought_force_desc: "Переход в новое столетие пока проходит непросто. Пожалуй, самым большим поводом для беспокойства является следующее: \"засуха тысячелетия,\" Это может быть самая сильная засуха в истории нашей страны. Наши службы экстренного реагирования уже заняты ликвидацией последствий, и мы вынуждены искать варианты, более близкие к правительству. Мы уже привлекли участников программы «Работа за пособие» к работе на общественных объектах, и теперь можем сосредоточить их усилия на частных землях, пострадавших от этого стихийного бедствия."
 AST_a_nation_worth_preserving: "Нация, достойная сохранения"
 AST_a_nation_worth_preserving_desc: "Мы добились значительных успехов в обеспечении устойчивого развития нашей страны. Возможно, это не повлияет на мир в целом, но для австралийцев любимая страна выстоит. Вода стала чище, городской смог исчез. Возможно, еще многое предстоит сделать, разработать новые методы получения более чистой энергии или средства сохранения ресурсов, но пока мы можем быть гордой нацией."
 AST_practical_reconciliation: "Практическое примирение"
 AST_practical_reconciliation_desc: "\"Для начала я хотел бы выразить признательность коренным народам, исконным владельцам земли, на которой мы сегодня собрались. Также я хотел бы отдать дань уважения старейшинам прошлого и настоящего.\" \n\nЭто может прозвучать как пустая болтовня, но отношения с коренным населением Австралии не были лишены трудностей. Каждое правительство должно с достоинством и уважением относиться к своей истории, а лидерство – это ответственная должность. Как бы мы ни двигались вперед, мы признаем прошлое и принимаем будущее. Объединяя австралийцев взвешенным подходом."
 AST_walk_the_journey: "Пройдите этот путь"
 AST_walk_the_journey_desc: "Это был долгий и, я знаю, трудный путь для многих австралийцев. Хотя многим мы помогли, было бы наивно с нашей стороны делать вид, что некоторые остались. Наши усилия по преодолению этого разрыва и улучшению положения тех, кто остался, должны начаться с программ, направленных на здравоохранение, образование, жилье и занятость. Программы, уже обсуждавшиеся в парламенте, будут финансироваться и расширяться. Малообеспеченные и коалиция будут идти рука об руку."
 AST_a_national_apology: "Национальные извинения"
 AST_a_national_apology_desc: "Китинг хочет нас подорвать. Хорошо, мы сыграем с лейбористами по их правилам. Я дам этим мерзавцам из Guardian то, чего они хотят. Я возьму на себя ответственность за предыдущие поколения, и тогда мы сможем двигаться дальше. Коренные австралийцы получат свою справедливую долю, и никто не скажет, что я им не помог."
 AST_its_mabo_its_the_vibe: "Это Мабо, это Vibe"
 AST_its_mabo_its_the_vibe_desc: "Дело Мабо стало знаковым решением для Верховного суда. Эдди боролся за права коренных народов на землю, за сохранение доколониальных земель и навсегда положил конец принципу terra nullius (ничейная земля). Работая с коренными общинами и внеся поправку о включении Заявления о примирении в преамбулу конституции, мы бы признали их права на землю, расширив существующий Закон о правах коренных народов на землю. Возможно, это символично, но это показывает, что мы серьезно относимся к равенству. Все избиратели будут иметь равное право голоса."
 AST_the_civil_partnership_act: "Закон о гражданском партнерстве"
 AST_the_civil_partnership_act_desc: "В настоящее время штаты и территории ограничивают признание однополых пар в качестве состоящих в отношениях, что может создавать для них ряд мелких юридических проблем. Хотя мы воздерживаемся от обсуждения вопроса однополых браков с моральной точки зрения, мы можем помочь тем, кто не желает вступать в брак, и, по крайней мере, вынести этот вопрос на голосование."
 AST_avoid_the_speech: "Избегайте высказываний"
 AST_avoid_the_speech_desc: "Я принципиально не считаю, что одно поколение может брать на себя ответственность за действия предыдущего поколения. Я не принимаю это как принципиальный вопрос. Это правительство не будет раздавать пустые жесты или уличать коренное население в политических играх. Коалиция должна выглядеть единой в этом вопросе. Любые разговоры об участии в марше примирения следует пресекать на корню."
 AST_crack_down_on_protests: "Жесткие меры против протестов"
 AST_crack_down_on_protests_desc: "Выкрики, демонстрации — всё это должно прекратиться. Всем нужно успокоиться! Мне всё равно, как мы это сделаем. Изменим заголовки, усилим полицейский контроль. Сделаем всё возможное, чтобы реальные проблемы оказались в центре внимания, а этих хулиганов взяли под контроль. Я не буду обращать внимания на их самовозвеличивание. На самом деле, я вообще не буду обращать на это внимания! Наша политика будет восхвалена как отказ от вызывания чувства вины и политики толпы. Я в этом уверен."
 AST_abolish_the_atsic: "Отменить ATSIC"
 AST_abolish_the_atsic_desc: "Эксперимент с раздельным представительством пока что провалился. В него вложено десятилетие финансирования, но это не принесло никакой практической пользы коренному населению. Хуже того, появились обвинения в неэффективном управлении, коррупции, мошенничестве, и этот список можно продолжать. С нас хватит. Мы расформируем это агентство и будем выжимать из него все, что сможем."
 AST_with_safer_communities: "С более безопасными сообществами"
 AST_with_safer_communities_desc: "Сообщения о жестоком обращении с детьми и упадке в отдаленных общинах коренного населения на севере страны — это, мягко говоря, национальная катастрофа. Двухпартийную поддержку морального вмешательства получить было легко. Мы развернем войска, ограничим социальные выплаты, введем обязательные медицинские осмотры и наблюдение. Порнография и алкоголь в общинах будут запрещены, и мы наконец сможем вернуть земельные права правительству. Некоторые элементы потребуют приостановления действия Закона о расовой дискриминации, а это значит, что рядовые депутаты и общественные группы будут жаловаться, но когда закон и порядок будут восстановлены, местные жители будут не единственными, кто будет нам благодарен."
 AST_we_are_many: "Нас много."
 AST_we_are_many_desc: "Мы, без сомнения, многонациональная страна. Даже во времена политики «Белой Австралии» страну наводняли европейцы, каждый из которых имел схожее происхождение. Теперь страна открыла свои двери для многих, и мы несем ответственность за этот приток. То, как мы будем управлять этим процессом, определит состав населения Австралии на десятилетия вперед. Богатые или влиятельные — мы определяем политику и жизни миллионов людей."
 AST_widen_our_net: "Расширить наши сети"
 AST_widen_our_net_desc: "Иммиграционная служба значительно продвинулась со времен «политики белых австралийцев», но давайте посмотрим правде в глаза: количество мигрантов по-прежнему невелико, очень мало. При темпах экономического роста дефицит рабочей силы станет новой проблемой. Для решения этой проблемы мы расширяем прием иностранных рабочих, а для баланса будем уделять больше внимания квалифицированным мигрантам, сокращая при этом доступ к социальным пособиям для новых мигрантов. Это должно одновременно удовлетворить обе стороны политического спектра и привлечь крупный бизнес."
 AST_with_open_arms: "С распростертыми объятиями"
 AST_with_open_arms_desc: "Наша страна всегда была многокультурной, и прибытие по морю всегда было необходимостью. Не все прибыли по надлежащим каналам, но все они, прибывающие со всех уголков мира, стремятся получить убежище, желая в конечном итоге стать частью миллионов, наслаждающихся щедростью нашей страны. Неэффективность нашей нынешней политики можно оптимизировать, чтобы сократить сроки содержания под стражей для большего числа действительно нуждающихся в убежище. Семьи с детьми будут переведены из центров содержания под стражей в общинное жилье, а в отношении лиц, содержащихся под стражей более двух лет, будут проводиться частные расследования."
 AST_girt_by_border_patrol: "Обведен пограничным патрулем"
 AST_girt_by_border_patrol_desc: "Австралия, возможно, и островное государство, но это делает её уязвимой для вторжения с моря. Инциденты на воде создали для нашей пограничной службы более напряжённую ситуацию, чем обычно. Без чёткой возможности обеспечить безопасность наших берегов, как мы можем ожидать, что наши силы обеспечат безопасность страны? С принятием Закона о защите границ не останется сомнений в способности нашего флота разворачивать корабли, защищая офицеров от несправедливых судебных исков в случае их принятия."
 AST_the_pacific_solution: "Тихоокеанское решение"
 AST_the_pacific_solution_desc: "Хотя легальная иммиграция в нашей стране сократилась, нелегальная иммиграция не уменьшилась. Тысячи мигрантов ежегодно прибывают на наши берега без документов, и, похоже, это число только растет. Поскольку существующая инфраструктура перегружена, на Науру и острове Манус будут построены центры содержания под стражей за пределами материковой части страны для размещения лиц, ищущих убежища, пока мы определяем их статус. Это обеспечит справедливую компенсацию обеим странам. Затем мы сократим территорию материковой части страны, пригодную для рассмотрения обоснованных заявлений о предоставлении убежища, что еще больше снизит заинтересованность в обходе очередей."
 AST_for_bright_minds: "Для светлых умов"
 AST_for_bright_minds_desc: "Иностранные студенты быстро становятся весьма значимым источником дохода для наших ведущих университетов. В настоящее время лишь немногие могут приехать по нашим ограниченным учебным визам, но если мы немного изменим требования, то гораздо больше студентов из-за рубежа будут приезжать сюда, и значительно больше денег будет направлено в сектор образования."
 AST_strong_in_difference: "Сильный в различиях"
 AST_strong_in_difference_desc: "Нам удалось объединить население, состоящее из разных, культурно разнообразных людей, которые сформировали новую австралийскую идентичность. Все мы выглядим по-разному, у каждого свои сильные стороны, но вместе мы строим Австралию. Рабочие места переполнены талантливыми людьми и теми, кто добился успеха в стремлении воплотить в жизнь мечту этой нации. Мечту о принадлежности и, как и мы, о гармоничном сосуществовании."
 AST_tear_out_the_roots: "Искорените корни"
 AST_tear_out_the_roots_desc: "Хорошо известно, что многие наши проблемы в сфере безопасности начинаются и заканчиваются в Индонезии. Наш ближайший и самый сильный сосед, и при этом очень уязвимый для экстремистских элементов. Если бы между нами удалось достичь взаимопонимания, в частности, в плане сотрудничества по искоренению повстанческих ячеек в Индонезии, это принесло бы пользу обеим сторонам. Это заложило бы основу для более тесного сотрудничества в будущем."
 AST_welcome_the_experts: "Приветствуем экспертов!"
 AST_welcome_the_experts_desc: "У нас уже есть одни из самых талантливых специалистов, но привлечение новых из-за рубежа нам бы не повредило. Это даже может сгладить некоторые проблемы, с которыми мы сталкиваемся в сфере исследований и разработок. Используя уже существующую систему SkillSelect, мы сможем продлевать визы квалифицированным мигрантам со всех уголков современного мира."
 AST_protected_on_all_sides: "Защищен со всех сторон"
 AST_protected_on_all_sides_desc: "Когда солнце садится над нашими золотыми океанами, наши люди могут расслабиться, зная, что по всей территории их страны, патрулируя воды, наши патрули обеспечивают их безопасность. Когда в прессе появляются сообщения о том, что граждане другой страны могут высадиться на наших пляжах, они будут знать, что это всего лишь запугивание, поскольку правительство их защищает. Что их будущее обеспечено."
 AST_the_howard_doctrine: "Доктрина Говарда"
 AST_the_howard_doctrine_desc: "После нашей интервенции в Восточном Тиморе в 1999 году несколько журналистов начали придумывать термин, призванный описать нас как страну, предоставляющую первоочередные услуги многим странам Тихоокеанского региона. Хотя это может быть точной оценкой, я считаю, что наша доктрина не ограничивается такой позицией. До того, как я стал премьер-министром, наша страна слишком узко определяла свое место в мире. Наше правительство способно пересмотреть внешнюю политику Австралии, чтобы она лучше отражала уникальное пересечение культур и истории, в котором мы живем. Время лишь укрепило мою веру в то, что нам не приходится выбирать между нашей историей и нашей географией. Мы находимся в уникальном положении гибкости, позволяющем нам оставаться верными нашим традиционным союзникам и лояльности, одновременно строя и укрепляя новые партнерства в регионе."
 AST_deputy_peacekeepers: "Заместители миротворцев"
 AST_deputy_peacekeepers_desc: "В сериале «Шоу Энди Гриффита» Барни Файф — заместитель шерифа города Энди Тейлора. В те моменты, когда шерифа нет рядом, Барни приходится поддерживать порядок и руководить делами вместо него. После падения Берлинской стены роль США в обеспечении правопорядка в мире стала неоспоримой, но новые угрозы появляются каждый день, и некоторые из них опасно близки к Австралии. Подобно Барни, Австралия находится в ситуации, когда на нас возложена задача патрулирования Тихого океана, пока США находятся в другом месте. Это непростая задача, но мы с ней справляемся на отлично."
 AST_war_on_the_terrible: "Война против ужасных"
 AST_war_on_the_terrible_desc: "В наше время классические определения и методы борьбы с терроризмом безнадежно устарели. Те, кто желает причинить вред австралийцам, гораздо быстрее адаптируются к современным технологиям. Введение законодательства, изменяющего наши правовые определения терроризма, и изменение законов, предусматривающих наказание для лиц, совершающих такие преступления, являются эффективными первыми шагами. Для того чтобы идти в ногу со временем и обеспечить мобильность наших подразделений для пресечения угроз до их возникновения, необходимо расширить полномочия ASIO по задержанию и наблюдению."
 AST_new_wave_counter_terrorism: "Новая волна борьбы с терроризмом"
 AST_new_wave_counter_terrorism_desc: "Даже наши новые поправки недостаточны. По мере поступления все больше информации о готовящихся террористических атаках на австралийской территории становится очевидно, что наши полномочия необходимо значительно расширить. ASIO и полиция должны быть расширены. Рейды по борьбе с терроризмом, превентивные задержания и усиление полномочий местной полиции в проведении «остановок и обысков» позволят выявить угрозу. Мы понимаем, что это будет спорный шаг, но наша ситуация требует гораздо большего, чем полумеры."
 AST_commit_to_foreign_intervention: "Принять решение об иностранном вмешательстве"
 AST_commit_to_foreign_intervention_desc: "Конфликты усилились почти на всех континентах мира. Исключением является Австралия. Единственный способ, которым нам удавалось и продолжает удерживать ситуацию в таком состоянии, — это предотвращение распространения открытых конфликтов на наши территориальные воды. Для этого крайне важно уметь вмешиваться в эти угрозы до того, как они выйдут из-под контроля. Ближний Восток и Юго-Восточная Азия являются рассадниками террористических ячеек, но мы можем выбирать, где и как вмешиваться, если это отвечает интересам безопасности нашей страны."
 AST_place_rudd_in_the_fire: "Отправьте Радда в огонь"
 AST_place_rudd_in_the_fire_desc: "Похоже, Кевин Радд становится все большей проблемой для оппозиционной партии, пока мы пытаемся принять законы. Хуже того, он набирает популярность в глазах общественности. В настоящее время он является теневым министром иностранных дел, но что, если бы мы назначили его в наш собственный комитет по иностранным делам? Поручили бы ему заниматься дипломатией в Тихоокеанском регионе. Это не только защитило бы нас от негативной реакции, но и отвлекло бы его внимание от антитеррористического законодательства."
 AST_our_capacity_for_peace: "Наша способность к миру"
 AST_our_capacity_for_peace_desc: "Усилия Радда по налаживанию диалога с Китаем действительно принесли свои плоды. Они готовы обсуждать совместную миротворческую инициативу в Тихом океане. Такая возможность выпадает нечасто и может позволить нам продемонстрировать Китаю свою равную позицию, определив будущее сотрудничество. Речь идёт не столько о преклонении колен, сколько об общих интересах в обеспечении безопасности в Тихом океане."
 AST_off_to_delhi: "В Дели"
 AST_off_to_delhi_desc: "Уран остается нашим крупнейшим неразработанным минеральным запасом, и наши компании стремятся найти нового экспортного партнера до начала бурения. Судя по всему, Индия является очевидным клиентом. Это восходящая сверхдержава в Южной Азии, достаточно сильная, чтобы отстаивать свою волю в Аравийском море. Она могла бы стать очень полезным союзником по мере расширения нашей сферы влияния, или, по крайней мере, надежным импортером нашего урана."
 AST_marks_gambit: "Гамбит Марка"
 AST_marks_gambit_desc: "С момента обретения Сингапуром независимости наши отношения всегда были исключительно дружественными. Поэтому вполне естественно, что мы делаем следующие шаги. Наш верный министр торговли Марк Вейл работает над первым серьезным двусторонним торговым соглашением, которое мы им предложили за последние два десятилетия. Одновременно он налаживает контакты с Таиландом, предлагая аналогичное соглашение о преимущественно беспошлинной торговле. Свободное перемещение товаров в Австралию и из Австралии является одним из ключевых пунктов нашей предвыборной программы, и хотя партия постарается привлечь к этому как можно больше внимания, австралийский народ пожнет плоды."
 AST_fossil_fuels_for_yuan: "Ископаемое топливо за юань"
 AST_fossil_fuels_for_yuan_desc: "Наши дипломатические отношения с Китаем идут без сучка и задоринки. Их скрытые усилия по быстрой индустриализации породили у них потребность в угле, которого, к счастью, у нас в избытке. Заключение сделки с ними кажется взаимовыгодным решением и может сделать нас более привлекательным торговым партнером для других азиатских стран."
 AST_partner_with_the_japanese: "Партнерство с японцами"
 AST_partner_with_the_japanese_desc: "Торговля с Азиатским регионом быстро обгоняет наши связи с Европой. И это справедливо, поскольку наши интересы сместились в сторону местных рынков. В бизнесе японцы — одни из самых проницательных противников, которых только можно встретить. То же самое можно сказать и о дипломатии. Они готовы принимать наш сельскохозяйственный экспорт в обмен на уступки с нашей стороны. Снижение пошлин на их электронику и автомобили было очевидным требованием, но мы подозреваем, что они попросят большего."
 AST_to_promote_our_spirit: "Чтобы укрепить наш дух"
 AST_to_promote_our_spirit_desc: "Наши усилия за рубежом принесли хорошие результаты. Всё больше людей видят Австралию в новом свете и воспринимают нас как важного партнера в Тихоокеанском регионе. Люди также должны увидеть наши достижения и отметить австралийский дух таким, какой он есть. Мы можем профинансировать ряд телевизионных рекламных роликов и онлайн-публикаций для продвижения нашей страны, что одновременно будет служить маркетингом туризма. Также не помешает разместить логотип нашей партии в нижнем углу. Это минимум, что мы можем получить за наши усилия."
 AST_the_coalition_convention: "Коалиционная конвенция"
 AST_the_coalition_convention_desc: "На съезде часто заканчивается крах карьеры, поскольку речи и призывы к действию остаются без внимания, а следующим лидером коалиции становится другой человек. Однако иногда настойчивость окупается. Теперь у коалиции уже есть лидер, достаточно сильный, чтобы взять на себя руководство, и на этот раз дело просто в том, чтобы произнести хорошую речь."
 AST_wholesale_economics: "Оптовая экономика"
 AST_wholesale_economics_desc: "Термин «оптовая торговля» обычно применяется к розничным торговцам или промышленным предприятиям, но некоторые используют его для описания приватизации государственных активов. Мы не были безжалостны в борьбе с неэффективностью государственного управления. Едва ли. Именно поэтому нам следует немного активизировать эти усилия. Существует множество ведомств, в которых мы можем сократить расходы, и мы можем получить немалые доходы, если найдем подходящих участников торгов. С другой стороны, есть несколько направлений для инвестиций в наши трудовые секторы, которые, если мы сделаем правильный выбор, не нанесут ущерба нашим и без того хорошим доходам."
 AST_finalize_the_telstra_sale: "Завершить продажу Telstra"
 AST_finalize_the_telstra_sale_desc: "Продажа Telstra стала многолетним испытанием для государственных бухгалтеров, которым было поручено разобраться со всеми проблемными элементами, которые стали для нас непосильной задачей. Австралийская фондовая биржа (ASX) предложила нам более чем справедливую сделку по оставшимся активам, и любой экономический рационалист завершил бы ее до того, как передумал бы, что мы и намерены сделать."
 AST_allow_foreign_interests: "Разрешить иностранным интересам"
 AST_allow_foreign_interests_desc: "Как и Фауст, иногда нужно заключить сделку с дьяволом. Оптимисты в парламенте могут убедить вас в том, что Австралия может выжить самостоятельно. Что каким-то образом это островное государство сможет стать самодостаточным перед лицом глобализации. Они ошибаются. Наша промышленность сможет выжить только в том случае, если мы позволим иностранному капиталу питать нашу жадную до долларов экономику, и СМИ не являются исключением. Для выживания им необходимы инвестиции."
 AST_crush_the_unions: "Разгромить профсоюзы"
 AST_crush_the_unions_desc: "В последние годы присутствие профсоюзов в нашей экономике и даже в политике стало слишком широким и наглым. Никакая подобная организация не должна вмешиваться ни в какие наши дела, тем более в дела наших рабочих. Закон о выборе места работы (Workchoice Act) направлен на исправление этого пренебрежения и лишение профсоюзов их присутствия на заводах. Он не выгонит их полностью, но даст владельцам бизнеса шанс на борьбу."
 AST_carve_up_medicare: "Разделить Medicare"
 AST_carve_up_medicare_desc: "В течение нашего первого срока мы так и не дошли до пересмотра системы медицинского страхования. Безусловно, программа предоставляет многим австралийцам надежные, современные медицинские услуги бесплатно, но, похоже, многие злоупотребляют этим предложением. Неэффективность программы также привела к резкому увеличению ее стоимости при некомпетентном управлении лейбористов. Как хорошо заточенный нож, мы можем срезать лишний жир, который накопился слишком долго."
 AST_broadband_blueprint: "План развития широкополосной связи"
 AST_broadband_blueprint_desc: "У нас есть технологии. Мы можем перестроить нашу сетевую инфраструктуру, чтобы обеспечить всем австралийцам доступ к самым современным интернет-услугам как для компаний, так и для частных лиц. Если мы применим наши знания и будем работать над их внедрением в существующую инфраструктуру, мы сможем разработать план по внедрению этой системы в масштабах всей страны в очень короткие сроки."
 AST_curb_outside_interference: "Внешние помехи от бордюра"
 AST_curb_outside_interference_desc: "Открытие австралийского рынка и экономики для остального мира пока что приносит свои плоды, но при управлении страной мы проводим определенную черту. Одобрение иностранных инвестиций — это основа ведения бизнеса в большинстве отраслей, за исключением СМИ. Влияние Керри Паккера на наши СМИ невозможно переоценить, и мы можем в полной мере представить, какие еще более серьезные иностранные интересы мы могли бы привлечь, если бы двери открылись. Пока же мы держим эти двери закрытыми."
 AST_bat_for_the_battlers: "Бита для борцов"
 AST_bat_for_the_battlers_desc: "Австралия никогда не должна быть нацией, определяемой классовой принадлежностью или завистью, а должна быть объединена товариществом и достижениями. Наши борцы, представители среднего класса Австралии, чаще всего доводили нас до финишной черты. Справедливо будет отплатить им тем же на рабочем месте. Не позволяя им чрезмерно настойчиво выдвигать требования, мы будем прислушиваться к профсоюзам, чтобы внедрить несколько отдельных мер. Тех, которые действительно имеют значение."
 AST_back_australias_ability: "Поддержите способности Австралии"
 AST_back_australias_ability_desc: "В плане экономической политики нашим «лучшим из лучших» стала программа «Поддержим развитие Австралии». Это масштабная программа обновления, направленная на стимулирование крупных строительных проектов в течение четырех лет, которая должна значительно снизить уровень безработицы и вернуть в обращение значительную часть налоговых поступлений, которые мы ранее использовали."
 AST_feel_the_heef_ast: "Почувствуйте вкус HEEF"
 AST_feel_the_heef_ast_desc: "Фонд поддержки высшего образования — один из наших недавних законопроектов, направленных на привлечение инвестиций в высшие учебные заведения и наши научно-исследовательские центры. Первоначально мы будем единственными, кто будет инвестировать в этот фонд, но в конечном итоге средства должны каким-то образом вернуться в государственный бюджет. Всё это звучит немного нелепо, но если обе партии поддержат этот законопроект, в нём может быть что-то стоящее."
 AST_if_we_build_it: "Если мы это построим"
 AST_if_we_build_it_desc: "Наше предвыборное обещание построить 21 новую больницу наконец-то сбылось, и, к сожалению, затраты выросли по сравнению с предыдущими оценками. Наши финансовые эксперты рекомендовали передать строительство частному сектору, что все равно обойдется нам в немалую сумму. С другой стороны, благодаря новым медицинским учреждениям мы можем сэкономить на государственных расходах на здравоохранение."
 AST_australian_made: "Сделано в Австралии"
 AST_australian_made_desc: "Логотип «Сделано в Австралии» был одной из самых успешных маркетинговых стратегий, когда-либо разработанных правительством. Этот значок был легко узнаваем, и благодаря ему всё больше людей покупали товары местного производства. Сейчас государственные расходы сократились, и трудно выбрать что-то местное вместо дешевого импорта из Вьетнама или Китая. Если мы активизируем маркетинговую кампанию, ориентируясь не только на местный рынок, но и на зарубежные рынки, чтобы подчеркнуть, что «Сделано в Австралии» — это гарантия качества, мы, возможно, найдем для них новый путь."
 AST_preserve_the_old_forests: "Сохраним старые леса"
 AST_preserve_the_old_forests_desc: "Одной из наших главных гордостей всегда были старовозрастные леса Тасмании. В них произрастают одни из самых высоких в мире цветущих деревьев, достигающие высоты более 90 метров! Это настоящее сокровище, столь же важное для нашей страны, как и Большой Барьерный риф. Расширение нынешней защиты еще на 170 000 гектаров должно помочь предотвратить их утрату, не подавляя при этом нашу лесопромышленную отрасль."
 AST_ets: "Торговля выбросами"
 AST_ets_desc: "Еще один законопроект о климате, привлекающий внимание парламента, — это «Схема торговли выбросами». Каким-то образом лейбористы до сих пор придумывают подобные вещи, и по какой-то причине некоторые члены партии прислушиваются к ним. Сейчас они предложили нам легкий способ предотвратить реализацию схемы — ряд грантов на развитие атомной энергетики. Атомная энергетика — это не то, что мы поддерживаем в настоящее время, но мы не можем убить ее на корню, и если мы сможем получить от них что-нибудь, чтобы смягчить позицию климатических фанатиков по отношению к нашей политике, мы это примем."
 AST_the_new_liberals: "Новые либералы"
 AST_the_new_liberals_desc: "Нравится вам это или нет, но партия изменилась. Мы больше не маленькие. \"я\" Либералы 90-х, но профессиональная сила, отстаивающая традиционные ценности. Мы успешно сочетаем экономический либерализм с фискальным консерватизмом. Реальность геополитических проблем признается и решается, и у австралийцев остается больше денег в кармане и меньше налогов. Честно говоря, от этого страна только выигрывает, и мы наслаждаемся этим при поддержке большинства избирателей. Направление, в котором мы сейчас движемся, может либо укрепить, либо подорвать наш импульс, но оно также окажет значительное влияние на поколения, которые будут полагаться на нашу направляющую руку."
 AST_keep_them_in_line: "Держите их в узде."
 AST_keep_them_in_line_desc: "Наша партия слишком долго страдает от заговоров и внутренних переворотов. Как общественность может доверять нашей коалиции, если мы сами себе не доверяем? Нам нужно будет «реструктурировать» партийный кодекс в отношении оспариваний лидерства и ограничить эту практику самыми критическими обстоятельствами. Для поддержки перемен потребуется лишь несколько рядовых членов партии."
 AST_secure_the_coalition: "Обеспечьте безопасность коалиции"
 AST_secure_the_coalition_desc: "Хотя наши взгляды не всегда совпадают, наши друзья из Национальной партии почти столетие идут с нами по одной линии. Мы как две капли воды похожи. Сейчас это маловероятно, но раскол коалиции обречет наши партии на то, чтобы никогда больше не выиграть федеральные выборы. Такое не следует оставлять на волю случая. Переписывание условий раскола таким образом, чтобы сделать его практически невозможным для любой из сторон, позволит сохранить их в наших руках, независимо от того, хорошие они или нет. Тогда мы действительно будем едины, духовно и нерушимо."
 AST_entice_crossbenchers: "Привлечь независимых депутатов"
 AST_entice_crossbenchers_desc: "Наша политическая система десятилетиями держалась на работе независимых депутатов. Эти зачастую бесхребетные люди помогли нам принять несколько законопроектов за время нашего правления, то поддерживая нас, то оппозицию, то полностью оставаясь в стороне. Некоторым просто нужно пару поощрений, чтобы вернуть их в строй. Несколько рукопожатий здесь, немного инвестиций там, и мы сделаем достаточное количество из них лояльными."
 AST_broaden_our_beliefs: "Расширить наши убеждения"
 AST_broaden_our_beliefs_desc: "Почти стереотипно говорить, что наша партия застряла в болоте в отношении своих убеждений. В конце концов, мы традиционалисты, это разумная позиция. Обратная сторона медали заключается в том, что мы можем упускать ценные политические решения, которые не все в партии поддерживают. Возможно, пришло время сесть и обсудить ситуацию с более мелкими партиями. Мы могли бы кое-чему научиться."
 AST_axe_the_governor_general: "Уволить генерал-губернатора"
 AST_axe_the_governor_general_desc: "Референдум о республике, возможно, провалился в 1999 году, но это не значит, что нам нужен представитель страны, находящейся на другом конце света, вмешивающийся в наши решения. Они уже уволили одного из наших лидеров, пусть сделают это снова. Настало время и нам уволить их. Обратившись напрямую к королеве, мы официально подадим запрос, хотя и с парой вопросов. \"отчеты\" злоупотребления должны нас поддержать, а от них мы должны избавиться сами."
 AST_our_own_kings: "Наши собственные короли"
 AST_our_own_kings_desc: "Теперь, когда монархия занимается поиском замены, мы можем начать использовать существующие процедуры, чтобы максимально замедлить переходный период. Они будут утопать в море юридических споров и официальных расследований, настолько долгих, что до приведения к присяге нового монарха могут пройти годы, а мы получим полную свободу действий в отношении нашей политики, без какого-либо контроля со стороны короны."
 AST_prepare_the_successor: "Подготовка преемника"
 AST_prepare_the_successor_desc: "Иногда лучше покончить с чем-то, пока это еще хорошо. В течение предыдущего срока я обещал уйти в отставку до следующих выборов. Эта возможность появилась и упущена, но еще не поздно повесить шляпу на гвоздь и подготовить следующего лидера, который поведет нас вперед. Я помню, как боролся за то, чтобы попасть сюда, и теперь я подумываю о том, чтобы уйти."
 AST_peace_with_honour: "Мир с честью"
 AST_peace_with_honour_desc: "И будущее Либеральной партии было решено..."
 AST_the_sydney_declaration: "Сиднейская декларация"
 AST_the_sydney_declaration_desc: "Декларация изначально была составлена ​​и должна быть представлена ​​как обязательство Австралии выполнить требования мира в области изменения климата на саммите АТЭС. Однако она служит более важной цели, чем просто демонстрация прогрессивности в наших восточных союзниках. Сама декларация демонстрирует наш вес в дипломатической деятельности. Она заявляет о готовности Австралии к взаимодействию с миром и о том, что наши действия приводят к реальным переменам. Мы, возможно, едва входим в первую десятку, но мы здесь, и мы только движемся вверх."
 AST_the_quad: "Квадрат"
 AST_the_quad_desc: "Переговоры с Японией и Индией по вопросам оказания помощи при стихийных бедствиях оказались настолько плодотворными, что намекают на создание более постоянного канала дипломатических обсуждений. Вице-президент США даже положительно отнесся к идее формирования пакта для планирования и мониторинга недавних действий Китая в Тихом океане. В итоге было определено название «Четырехсторонний диалог по безопасности», но пока мы будем называть его «Четверкой»."
 AST_negotiate_with_our_northern_neighbours: "Наши северные соседи"
 AST_negotiate_with_our_northern_neighbours_desc: "Our history with Papua New Guinea has been a largely positive one over these last few decades, despite a few hiccups here and there. They've remained one of our largest trade partners for rubber, and keeping that arrangement going has become a matter of national security. We've invited their Prime Minister over to help hash out an ironclad arrangement."
 AST_anzus_collaboration: "Сотрудничество ANZUS"
 AST_anzus_collaboration_desc: "Договор АНЗУС, несомненно, переживал непростые моменты. Не так давно Новая Зеландия формально была исключена из него после того, как отказала американским атомным подводным лодкам в доступе в свои порты. Как бы ни сложилась ситуация, договор в некотором смысле является братской связью между нами. Несмотря на то, как далеко американская политика отошла от Европы и сместилась в сторону Ближнего Востока, если они там, то и мы там. Наше внимание может сместиться от местных проблем, но в любом случае это все глобальные усилия."
 AST_an_american_treaty: "Американский договор"
 AST_an_american_treaty_desc: "Будучи, пожалуй, крупнейшей экономикой мира, помимо очевидных преимуществ в сфере безопасности, для нас крайне важно поддерживать экономические связи с Соединенными Штатами. Их нелегко расстроить, особенно учитывая их значительные инвестиции в нашу страну. Хотя периодическое поощрение их поддержки никогда не повредило, и мы, безусловно, вознаграждаем их приоритетным торговым соглашением."
 AST_howard_of_arabia: "Говард Аравийский"
 AST_howard_of_arabia_desc: "Австралия по-прежнему является страной с преобладающим христианским населением. Наши моральные принципы берут начало на Ближнем Востоке. Израиль на протяжении десятилетий был одним из наших самых сильных партнеров, и он снова и снова демонстрировал свою решимость отстаивать принципиальную демократию. Мы не можем бросить его на произвол судьбы, когда он нуждается в нас. Укрепление дружеских отношений с ним — наш религиозный императив."
 AST_keep_security_regional: "Обеспечение региональной безопасности"
 AST_keep_security_regional_desc: "Несмотря на наши попытки действовать за рубежом на Ближнем Востоке, наши приоритеты всегда были связаны с нашими ближайшими соседями. Тихоокеанские островные государства сейчас обращаются к нам за своей безопасностью, и это правильно. Австралия несет моральную обязанность обеспечивать их безопасность и защиту от радикальных элементов по мере нашего роста как региональной державы. Наши действия в отношении них должны отражать это."
 AST_preventative_measures: "Профилактические меры"
 AST_preventative_measures_desc: "Не надеваешь ботинки после укуса змеи. Когда находишься в глуши, первое, что нужно взять с собой, — это ботинки, а второе — большую палку. Этот принцип, каким бы грубым он ни казался, следует применять и при обеспечении нашей обороны за рубежом. Мы не уходим с пустыми руками и не оставляем наших соседей в опасности без хоть какой-то защиты."
 AST_dissuade_the_middle_kingdom: "Претензии в Папуа"
 AST_dissuade_the_middle_kingdom_desc: "Our dominance in the region hinges on preventing Indonesia from surpassing us geopolitically, and it's a situation that may be easier to manage if we isolate them. The nationalists in Papua New Guinea have been petitioning us to recognise their claim on West Guinea for years now. Stirring up some border tension between them might be just the thing we need to brittle the friendship, and bring Papua New Guinea closer to the fold."
 AST_the_indonesian_ultimatum: "Индонезийский ультиматум"
 AST_the_indonesian_ultimatum_desc: "В последнее время конфликты с Индонезией стали обычным явлением. Независимо от нашей позиции или степени нашего сотрудничества, они, похоже, не могут справиться с радикальными элементами внутри страны. Мы можем предъявить им ультиматум, позволяющий нам направить собственную миротворческую операцию в Ачех и фактически оккупировать регион до тех пор, пока он не сможет самостоятельно управлять собой как независимое государство. Мы делали это раньше, успешно, мы можем сделать это снова. Если они откажутся, мы можем использовать все возможные санкции, пока не вернем их за стол переговоров."
 AST_a_visit_from_malaysia: "Визит из Малайзии"
 AST_a_visit_from_malaysia_desc: "Немногие страны были столь откровенны и искренни в общении, как Малайзия. Они неоднократно посещали нас, начиная от своих лидеров и заканчивая министрами, и торговые переговоры всегда проходили без сучка и задоринки. Возможно, это связано с нашим общим наследием Содружества, но между нашими странами возникло глубокое уважение. На этот раз обсуждение касалось нашего сельскохозяйственного экспорта, который, надо признать, был ограничен по соображениям безопасности. Вероятно, они попросят нас смягчить законы."
 AST_peacekeeping_in_somalia: "Миротворческая деятельность в Сомали"
 AST_peacekeeping_in_somalia_desc: "Несмотря на первоначальные многообещающие перспективы, переходное правительство в Сомали оказалось в шатком положении после конфликта с полевыми командирами, и страна фактически раскололась. Продолжающийся гуманитарный кризис стал для нас достаточным поводом обратить на это внимание, и теперь правительство обратилось с просьбой о внешнем вмешательстве. Это может стать возможностью для отработки действий наших миротворцев без прямого участия в конфликте."
 AST_the_coal_family: "Семья Коул"
 AST_the_coal_family_desc: "Подобно американской мечте 50-х годов, многие идиллические австралийцы живут традиционной жизнью, основанной на самоопределении. Честно говоря, они, вероятно, составляют значительную часть нашей электоральной базы, и почему бы нет? Именно так мы и поощряем жить австралийские семьи: независимо и счастливо. Мы можем отплатить им тем же, постепенно отменяя политику, препятствующую строительству домов, а также снизив некоторые налоги на землю, чтобы облегчить бремя. Наши семьи не должны нести наказание за владение своей частью нашей прекрасной земли."
 AST_the_abbott_government: "Правительство Эббота"
 AST_the_abbott_government_desc: "С сегодняшнего дня я заявляю, что Австралия находится под новым управлением и вновь открыта для бизнеса. Открыта и возглавляется правительством, которое максимально использует потенциал всех. Не только тех, кто за нас голосовал. \n\nПравительство, говоря простыми словами, для всех и для многих. Тех, кого великий Мензис описывал как «поднимающих, а не обделенных». Забытые семьи получат помощь. Тяжёлые налоги будут отменены, лодочные перевозки будут прекращены, и бюджет снова встанет на путь профицита, подобного которому мы ещё не видели и не слышали. \n\nНе теряя больше времени, давайте приступим."
 AST_expand_the_executive: "Расширить исполнительную власть"
 AST_expand_the_executive_desc: "Существует парадокс между нашей миссией по сокращению масштабов государственного аппарата и одновременно увеличением наших возможностей по выполнению работы. Когда капитан управляет кораблем, его решения должны быть приняты без траты времени на консультации со всем парламентом."
 AST_honour_the_party: "Уважайте партию"
 AST_honour_the_party_desc: "Наш кабинет министров должен отражать наследие партии, если мы хотим, чтобы нас приняли в будущем. Работа Джона Ховарда по переосмыслению Либеральной партии имела колоссальное значение для адаптации к новой эре современной политики, и привлечение сотрудников из его правительства обеспечивает богатый опыт."
 AST_building_stronger: "Строить прочнее"
 AST_building_stronger_desc: "Мы до глубины души понимаем, что общество невозможно без экономики, способной его поддерживать, а экономика невозможна без предприятий, приносящих прибыль. Точно так же, несмотря на наш привычный оптимизм, уверенность в устойчивости наших финансов упала до минимума. Наша задача сейчас – восстановить их, и восстановить настолько прочные, чтобы любой австралиец мог ими гордиться."
 AST_the_advisory_council: "Консультативный совет"
 AST_the_advisory_council_desc: "Либералов не следует воспринимать как партию, выступающую против примирения. В конце концов, именно Гарольд Холдт положил конец политике «Белой Австралии». Будет создан Совет, который будет держать нас в курсе дел коренного населения и сосредоточит внимание на практических изменениях."
 AST_cut_the_programs: "Отменить программы"
 AST_cut_the_programs_desc: "Мы не можем бесконечно субсидировать отдаленные общины, которые не вносят свой вклад в усилия правительства по примирению. Коренные общины, получающие финансирование, но не соблюдающие установленные правила, столкнутся с сокращением бюджетов. Всё просто."
 AST_its_the_constitution: "Это Конституция."
 AST_its_the_constitution_desc: "Сейчас нам необходимо положить конец этому гулкому молчанию в нашей конституции, этому упущению коренных народов. Для этого необходимо принять решение вне парламента, проведя референдум о признании аборигенов и жителей островов Торресова пролива в качестве коренных народов нашей страны."
 AST_compete_on_the_farms: "Соревнуйтесь на фермах"
 AST_compete_on_the_farms_desc: "С момента образования федерации фермерские хозяйства, которыми управляют поколения австралийцев, составляли основу сельскохозяйственного сектора страны. Фермы от Тасмании до Западной Австралии, которыми управляют австралийцы из поколения в поколение, вытесняются более крупными корпорациями. Мы не сможем оставаться конкурентоспособными, не заботясь о наших фермерах посредством доступных кредитов и улучшения водоснабжения. Наша политика должна в приоритете сохранять их независимость."
 AST_develop_the_northern_territory: "Приготовьте хлебную чашу"
 AST_develop_the_northern_territory_desc: "Был предложен план ряда проектов развития Северной территории, направленных на превращение штата в промышленный и сельскохозяйственный центр. Утвердив его, мы будем развивать штат, который обычно игнорировался предыдущими правительствами, и потенциально создадим житницу Австралии и Тихоокеанского региона на десятилетия вперед."
 AST_getting_in_there: "Как туда попасть"
 AST_getting_in_there_desc: "К сожалению, дороги, ведущие в Северную территорию и из нее, пришли в плачевное состояние. Кроме того, железнодорожную линию Ган необходимо модернизировать, чтобы обеспечить бесперебойную доставку необходимых материалов."
 AST_funnel_in_workers: "Привлечение работников"
 AST_funnel_in_workers_desc: "Для начала нашей работы потребуется рабочая сила. Ничего такого, с чем нельзя было бы справиться с помощью нескольких льготных виз и грантов на переезд."
 AST_project_manton: "Проект Мантон"
 AST_project_manton_desc: "Плотина Мантон когда-то была основным источником воды и электроэнергии в регионе, поскольку Дарвин построил свою собственную плотину. Затраты на реконструкцию и повторное введение плотины в эксплуатацию для снабжения близлежащих населенных пунктов, как ни удивительно, укладываются в бюджет и наглядно продемонстрируют нашу приверженность развитию Северной территории."
 AST_compassionate_government: "Справедливое отношение"
 AST_compassionate_government_desc: "В этой стране, если ты чего-то хочешь, тебе это дадут. Это вполне мог бы быть девиз партии под нашим руководством. Наши люди должны получать вознаграждение за свои усилия, а тех, кто не в лучшем положении для начала, мы поддержим легкой помощью. Это не чувство превосходства, это справедливость."
 AST_keep_the_fire_burning: "Поддерживайте огонь"
 AST_keep_the_fire_burning_desc: "Если мы не возьмём ситуацию под контроль, дыра, которую социальные программы прожигают в государственном кошельке, потопит нас. В то же время эти программы начинают оказывать серьёзное положительное влияние на наше население. Если мы сейчас остановимся, это может свести на нет все годы проделанной работы. Вместо этого нам нужно будет перераспределить часть финансирования для покрытия текущих расходов и надеяться, что Кейнс был прав в долгосрочной перспективе."
 AST_national_curriculum_review: "Обзор учебной программы"
 AST_national_curriculum_review_desc: "Помимо обычной политической предвзятости, проникающей в наши учебные программы, кажется, что государственное финансирование стало несбалансированным и исключает из них сельские школы. Каждая школа в Австралии заслуживает равных возможностей, а каждый ученик — образования, которое демонстрирует успехи западной цивилизации, а не только ее проблемы. Мы все должны гордиться страной, в которой выросли, и ее системой образования."
 AST_another_baby_boom: "Еще один бэби-бум"
 AST_another_baby_boom_desc: "Любовь — прекрасное чувство. Наше правительство знает это лучше, чем кто-либо другой. Во время выборов мы обещали пересмотреть систему оплачиваемого отпуска по уходу за ребенком, предоставив молодым матерям 26 недель отпуска, эквивалентных их заработной плате. В партии было много возражений, но приоритетом является благополучие матерей нашей страны."
 AST_responsible_governance: "Ответственное правительство"
 AST_responsible_governance_desc: "Безрассудные траты нашего правительства практически грозят бюджетным кризисом. Главная обязанность правящей партии — принимать трудные решения. Мы не можем продолжать выплачивать ипотеку с помощью кредитной карты."
 AST_the_welfare_bloat: "Такого общества не существует"
 AST_the_welfare_bloat_desc: "Доступ к государственной социальной помощи в рамках существующей системы слишком прост. Любой, кому не повезло и у кого болит спина, может получить все преимущества Centrelink и Medicare. Необходимо ужесточить условия доступа и постепенно закрыть несколько ненужных программ, если мы хотим сократить раздутый бюджет."
 AST_cashless_welfare: "Безналичные платежи"
 AST_cashless_welfare_desc: "Поскольку испытания в общинах Северной территории подходят к концу, мы уверены, что внедрение в небольших масштабах вполне осуществимо. Замена прямых банковских переводов государственными банковскими картами и ограничение расходов на предметы первой необходимости позволят уберечь уязвимые слои населения от посещения казино или пребывания на улице."
 AST_up_the_gst: "Ещё один налог"
 AST_up_the_gst_desc: "Самая масштабная реформа нашей налоговой системы произошла всего несколько лет назад, но уже принесла стране огромную пользу. Хотя в то время это вызывало споры, теперь наши предприятия пользуются более простой системой, а дополнительные доходы позволили профинансировать более дорогостоящие программы. Небольшое повышение налогов позволит преодолеть бюджетные трудности, с которыми мы сейчас сталкиваемся."
 AST_national_audit_commission: "Национальная аудиторская комиссия"
 AST_national_audit_commission_desc: "Расточительные расходы в правительстве стали настоящей мукой, от которой так трудно избавиться. Создание комиссии, которая будет формироваться раз в поколение и займется устранением этой проблемы на протяжении всего срока полномочий правительства, — наилучший вариант действий. Всё будет подвергнуто критике."
 AST_investigate_union_corruption: "Война с профсоюзами"
 AST_investigate_union_corruption_desc: "Пусть таблоиды знают, что мы объявляем войну правонарушениям. Объявляем войну коррупции и заявляем, что в нашем обществе существуют определенные стандарты. Будь вы должностное лицо компании или профсоюзный деятель, вы обязаны соблюдать закон."
 AST_the_energy_crisis: "Энергетический кризис"
 AST_the_energy_crisis_desc: "Одержимость защитой климата подставила нас прямо перед порогом энергетического апокалипсиса. Даже когда мы можем контролировать ситуацию, потребности нашего народа не удовлетворяются, а растущие цены поставили под угрозу финансово больше, чем любой другой кризис, с которым сталкивалась наша страна. Нашему правительству необходимо раз и навсегда взяться за решение этой проблемы."
 AST_duttons_plan_focus: "План Даттона"
 AST_duttons_plan_focus_desc: "Наш министр здравоохранения Питер Даттон вмешался в энергетическую дискуссию, предложив решение, которое, мягко говоря, вызывает разногласия. Речь идёт об отмене ограничений на использование ядерной энергии в Австралии, что позволит строить электростанции и раз и навсегда решить проблему нехватки энергии. Несколько десятилетий мы избегали этой перспективы, и на то были веские причины, но это может быть именно тем радикальным решением, которое мы ищем."
 AST_look_below: "Посмотрите ниже"
 AST_look_below_desc: "Ответ на все наши проблемы всегда был у нас под ногами. Экологи боятся его, лейбористы игнорируют, но коалиция уважает его. Никакой возобновляемый источник энергии не заменит данный нам Богом источник энергии, созданный для нас со времен вымирания динозавров."
 AST_build_it: "Постройте это"
 AST_build_it_desc: "Одно из преимуществ угольной энергетики — её красота. У нас в этой части мира есть одни из лучших газовых электростанций, гораздо лучше, чем эти шумные и некрасивые турбины. Активировав экстренные меры AEMO по закупке дополнительных генераторов и строительству собственных электростанций, мы сможем построить ещё несколько в очень короткие сроки."
 AST_deny_it: "Отрицайте это"
 AST_deny_it_desc: "Духовное нездоровье подрывает моральный дух и амбиции страны, которая когда-то не ставила перед собой никаких ограничений. Уступки в вопросах изменения климата подорвали нашу энергетику, одновременно подтолкнув наших соседей к тому, чтобы возобновить работу утраченной нами отрасли. Мы не можем повернуть время вспять, но мы можем снять с себя оковы."
 AST_friend_of_the_mines: "Друг шахт"
 AST_friend_of_the_mines_desc: "После разговора с нашим другом из Newscorp стало ясно, что давление на наши горнодобывающие корпорации можно было бы немного ослабить. Начать можно с изменения подхода наших правительств к правам на добычу полезных ископаемых."
 AST_light_on_the_hill: "Свет на холме"
 AST_light_on_the_hill_desc: "Австралия на протяжении десятилетий была маяком демократии в Тихоокеанском регионе, и теперь она стала настоящим маяком. Австралийцы смогут спокойно спать, имея доступ к доступной и обильной электроэнергии, отоплению и кондиционированию воздуха по всей стране. Это свидетельство достижений нашего правительства и прогресса, которого мы добились как нация."
 AST_acquire_enrichement: "Маленькие зелёные скалы"
 AST_acquire_enrichement_desc: "Это позор, что мы добываем так много этого вещества, но у нас нет установок для его обогащения, чтобы его реально использовать. Мы могли бы быстро импортировать и собрать такую ​​установку у наших друзей в Штатах, минуя несколько рекомендаций, чтобы запустить её в кратчайшие сроки."
 AST_convert_the_ansto_reactor: "Переоборудование реактора АНСТО"
 AST_convert_the_ansto_reactor_desc: "По всей видимости, у нас в Сиднее уже есть реактор. Конечно, это может быть не совсем та модель, которая нам нужна для выработки электроэнергии, но мы можем хорошенько подумать у наших ученых, чтобы подготовить его к работе. В конце концов, это не такая уж и сложная задача."
 AST_tweak_the_restrictions: "Больше не сдерживайся"
 AST_tweak_the_restrictions_desc: "Многое мешает стране перейти на экологически чистую энергетику. В частности, это связано с голосами сторонников «зеленой» энергетики, создающих различные организации. \"ядерные зоны\" По всей территории комплекса. В связи с чрезвычайной ситуацией национального масштаба, эти зоны должны быть ликвидированы."
 AST_first_stop_jakarta: "Первая остановка: Джакарта"
 AST_first_stop_jakarta_desc: "Мы можем начать наш срок с того, чтобы дать четкий сигнал о том, что внешняя политика Австралии остается региональной. Мы не можем позволить себе слоняться по Европе, когда страны здесь нуждаются в нашей помощи больше, чем когда-либо. Меньше Женевы, больше Джакарты."
 AST_sail_steady: "Парусный стиль"
 AST_sail_steady_desc: "Джули Бишоп, наш министр иностранных дел, подчеркнула подход \"экономическая дипломатия\" В течение нашего срока полномочий мы сосредоточимся на продолжении программ помощи и усилиях по развитию свободной торговли. Честно говоря, это не слишком отличается от политики правительств, существовавших до нас, но когда в ваших руках миллионы жизней, лучше не раскачивать лодку."
 AST_the_anglosphere: "Англосфера"
 AST_the_anglosphere_desc: "Австралия обладает богатым коренным наследием, британским прошлым и многокультурным характером. Поэтому наши связи с англичанами близки, как у братьев. Мы говорим на одном языке, любим регби и боремся за одни и те же демократические идеалы. Наше братство священно, и так должно оставаться."
 AST_o_canada: "О Канада!"
 AST_o_canada_desc: "Наши братья из стран Содружества. Так далеко, и все же наши связи так же крепки, как у двух старых друзей. Не помешало бы связаться с ними и обсудить инвестиционные возможности, которые разрабатывают наши дипломаты."
 AST_swell_the_support: "Увеличьте поддержку"
 AST_swell_the_support_desc: "Ни для кого не секрет, что набор в оборонный сектор резко сократился с 90-х годов. Расширение требований к кандидатам, проведение вербовочных кампаний и открытие стажировок в оборонном секторе — это подходящий первый шаг для заполнения необходимых вакансий."
 AST_of_knights_and_dames: "О рыцарях и дамах"
 AST_of_knights_and_dames_desc: "Раньше звание «Рыцарь и дама Ордена Австралии» считалось высшей наградой за выдающиеся заслуги перед страной. Как это часто бывает при лейбористских правительствах, при их правлении это звание было упразднено. Раз уж мы заговорили об этом, нам следует восстановить часть нашего наследия, которая не должна быть забыта."
 AST_american_integration: "Американская интеграция"
 AST_american_integration_desc: "Наши союзники по другую сторону Тихого океана уже некоторое время выдвигают идею совместных учений. Возможность использовать наше новое оборудование в практических условиях сама по себе была бы бесценна для наших вооруженных сил и могла бы помочь нам быть в курсе событий вместе с США."
 AST_square_kilometre_array: "Массив площадью в квадратный километр"
 AST_square_kilometre_array_desc: "В борьбе за участие в проекте между нами и Новой Зеландией, как и ожидалось, мы одержали победу. Вместе с Южной Африкой и Великобританией мы становимся частью самого амбициозного астрономического проекта в нашей жизни. Наша задача — построить более 130 000 древовидных антенн на площади в 21 километр. Теоретически это позволит нам исследовать небо более чем в 10 000 раз быстрее, чем сейчас. Это очень высокотехнологичный проект, и это захватывающая возможность для наших ученых в этой области."
 AST_joint_defense_tech: "Объединенные оборонные технологии"
 AST_joint_defense_tech_desc: "Альянс «Пять глаз» стал одним из наших самых сильных инструментов в войне с терроризмом и в целом в сборе разведывательной информации, которая продолжается уже 60 лет. Создание исследовательского подразделения было бы достаточно простым делом, и это помогло бы преодолеть любые существующие между нами технологические пробелы."
 AST_the_submarine_corporation: "Подводная корпорация"
 AST_the_submarine_corporation_desc: "В наших усилиях по обеспечению флота новыми подводными лодками нам на помощь приходит ASC. Эта компания, являющаяся для нас ведущим поставщиком судостроительных услуг с 80-х годов и недавно национализированная, находится в нашем распоряжении."
 AST_new_columbo_plan: "Новый план Коломбо"
 AST_new_columbo_plan_desc: "После Второй мировой войны был реализован Коломбоский план по восстановлению разрушенной Азии, в рамках которого нашим специалистам были направлены наши эксперты, а их специалистам — предоставлена ​​возможность учиться в нашей стране. Мы можем снова применить те же принципы, чтобы помочь новой, развивающейся Азии, предоставив их студентам возможность учиться в наших университетах с ускоренным оформлением виз."
 AST_growing_demands: "Примите вызов"
 AST_growing_demands_desc: "Ни одно правительство не может быть экономически ответственным за счет национальной безопасности. Силы обороны Австралии всегда должны быть готовы к реагированию на любые конфликты. Любой другой вариант поставит нас в затруднительное положение."
 AST_visiting_the_rainbow_nation: "Радужная нация"
 AST_visiting_the_rainbow_nation_desc: "У нас богатая история отношений с Южной Африкой, начавшаяся еще во время Второй англо-бурской войны, когда мы оказывали поддержку их войскам. Почти 200 000 из них проживают в Австралии, и это число продолжает расти, поскольку в последнее время наблюдается резкий рост числа заявлений о предоставлении статуса беженца. По мере обострения напряженности усиливается давление на нас с требованием занять определенную позицию по этому вопросу."
 AST_indonesian_intervention: "Обеспечьте безопасность архипелага"
 AST_indonesian_intervention_desc: "Ситуация в Индонезии слишком долго оставалась нерешенной. Хотя наши усилия в 1999 году в целом увенчались успехом, для подавления угрозы исламского фундаментализма в стране потребуется дальнейшее вмешательство."
 AST_an_oceanic_alliance: "Океанический альянс"
 AST_an_oceanic_alliance_desc: "Проблемы тех, кто находится в Тихоокеанском регионе, ощущаются и решаются нами, живущими здесь. Нам приходилось полагаться друг на друга в большинстве случаев, и это способствовало укреплению нашего глубокого единства."
 AST_aukus_abbott: "АУКУС"
 AST_aukus_abbott_desc: "Наша общая приверженность международному порядку, основанному на правилах, с Соединенным Королевством и Соединенными Штатами Америки чрезвычайно сильна. Мы прошли через окопы почти каждого крупного конфликта за последнее столетие. Таким образом, углубление этого сотрудничества — лучший путь к более безопасному миру."
 AST_the_greatest_statesman: "Величайший государственный деятель"
 AST_the_greatest_statesman_desc: "Позиции Австралии в Тихоокеанском регионе укрепились. Эта прекрасная страна перестала быть просто наблюдателем за ростом Азии и стала активным участником её подъёма. Историки, оглядываясь назад, поймут, что именно в этот момент мы направили страну по правильному пути."
 AST_the_asian_century: "Азиатский век"
 AST_the_asian_century_desc: "Несмотря на критику, мы не собираемся врываться в Азию без плана. Не нужно проводить много исследований, чтобы понять, что страны Северной Азии всего за несколько десятилетий достигли экономической трансформации, не имеющей аналогов в истории человечества. Нам необходимо дать понять этим странам, что Австралия открыта для бизнеса и готова принять участие в этой трансформации."
 AST_our_greatest_partner: "Наш ближайший партнер"
 AST_our_greatest_partner_desc: "Китай совершил чудо, выведя сотни миллионов людей из нищеты и подняв их в средний класс. Точно так же наше партнерство с ними продолжает расцветать, превращаясь в нечто гораздо большее, чем с любыми другими тихоокеанскими странами. Несмотря на призывы правительства к Австралии сделать выбор между экономическими интересами и интересами безопасности, факт остается фактом: новых друзей не заведешь, потеряв старых; и одни дружеские отношения не укрепишь, ослабив другие."
 AST_indian_investments: "Индийские инвестиции"
 AST_indian_investments_desc: "Несколько индийских корпораций выразили заинтересованность в расширении производства в стране и открытии представительств в Сиднее. Действующие ограничения для иностранных компаний замедлили этот процесс, но прямое одобрение со стороны... [GetASTLeaderTitle] Этого было бы достаточно, чтобы быстро начать работу и создавать рабочие места."
 AST_sanpou_yoshi: "Санпо Йоши"
 AST_sanpou_yoshi_desc: "Санпо Ёси — это старый японский термин, гласящий, что каждая сделка должна приносить пользу продавцу, покупателю и обществу в целом. \"тройная победа\" Если хотите. Наши нынешние торговые соглашения с Японией отнюдь не являются выигрышными. Между нами существует серьезный торговый дисбаланс, который, пока не будет исправлен, вбивает клин между нашими странами."
 AST_seoul_refineries: "Сеульские нефтеперерабатывающие заводы"
 AST_seoul_refineries_desc: "Со времен Корейской войны мы поддерживаем очень тесные связи с правительством Южной Кореи, как в военном, так и в экономическом плане. Учитывая успех их новой промышленной базы в Сеуле, заключение с ними соглашения о переработке собственной нефти, безусловно, избавило бы нас от хлопот, связанных с самостоятельным выполнением этой работы, и позволило бы гораздо быстрее наладить производство."
 AST_australian_exceptionalism: "Австралийская исключительность"
 AST_australian_exceptionalism_desc: "В этой стране существует уникальный набор добродетелей. Наши добродетели основаны не на божественном предписании или незаслуженных врожденных качествах, а на опыте предыдущих поколений, которые сделали трудный выбор и пожертвовали многим, чтобы привести нас к новой эре. Эта традиция должна продолжаться, и Австралия будет сохранена любой ценой."
 AST_stop_the_boats: "Остановите лодки"
 AST_stop_the_boats_desc: "Количество незаконных въездов и утоплений в море, спровоцированных контрабандистами, является крупнейшим кризисом, с которым страна столкнулась за последние годы. Наш специалист по пограничному контролю, Скотт Моррисон, разработал операцию в военном стиле для обеспечения безопасности наших берегов и сдерживания потока нелегальных мигрантов. Операция включает в себя усиление патрулирования и отмену виз на постоянную защиту, чтобы отбить желание уклоняться от участия в операции."
 AST_raise_the_threat_level: "Повысить уровень угрозы"
 AST_raise_the_threat_level_desc: "К сожалению, угроза терроризма стала реальностью, и, к сожалению, есть некоторые граждане и жители Австралии, которые хотели бы причинить нам вред. Необходимо усилить меры безопасности в аэропортах, на базах, в правительственных зданиях и на крупных общественных мероприятиях."
 AST_tighten_the_flow: "Усильте поток"
 AST_tighten_the_flow_desc: "Идея многокультурной Австралии, возможно, и не провалилась, но при нынешних темпах приток населения слишком велик, чтобы быть устойчивым. Учитывая потребности наших граждан, единственным следующим шагом является ужесточение контроля над этим потоком."
 AST_prevention_measures: "Профилактические меры"
 AST_prevention_measures_desc: "В вопросах вмешательства необходима умелая рука. Правильный, решающий удар может остановить угрозу на ранней стадии. По крайней мере, наличие возможности действовать в нужный момент позволит сохранить её в силе именно тогда, когда она нам больше всего нужна."
 AST_wielding_the_stick: "В руках палки"
 AST_wielding_the_stick_desc: "Работая в тесном сотрудничестве с одним из крупнейших и наиболее надежных производителей оружия, мы организовали строительство двух новых заводов, призванных обеспечить нас современным оружием для будущих сражений. Знаю, это отличный девиз."
 AST_deployment_mandate: "Мандат на развертывание"
 AST_deployment_mandate_desc: "Наша оперативная мобилизация для обеспечения боевой готовности осуществляется в соответствии с несколькими целевыми показателями, чтобы убедиться, что мы движемся в правильном направлении. Достижение этих показателей придаст нам уверенности, необходимой для оправдания внезапного увеличения расходов, и продемонстрирует, на что мы действительно способны."
 AST_employ_reserves: "Использовать резервы"
 AST_employ_reserves_desc: "Основная задача резервистов нашей страны — оказание помощи во время стихийных бедствий и чрезвычайных ситуаций внутри страны. Учитывая, что наша оборона — это чрезвычайная ситуация внутри страны, мы будем направлять их в те области, где не задействован наш штатный персонал, освобождая силы для развертывания."
 AST_let_them_serve: "Пусть они служат"
 AST_let_them_serve_desc: "Нынешняя политика набора персонала слишком ограничительна для наших планов расширения. Открытие программы для стажировок в оборонном секторе и предоставление льгот по погашению долгов для подающих заявки позволит нам увеличить численность участников до необходимого уровня."
 AST_incorporate_them: "Включите их"
 AST_incorporate_them_desc: "У нас уже есть масштабная программа, направленная на привлечение участников программы социального обеспечения к работе на общественных работах. Теперь мы можем перенаправить их в наши военные предприятия, снизив тем самым нагрузку на наши силы обороны."
 AST_a_shining_fleet: "Сияющий флот"
 AST_a_shining_fleet_desc: "С момента окончания холодной войны наша военно-морская инфраструктура пришла в упадок до такой степени, что стала уязвимым местом в нашей обороне. Наши возможности по строительству кораблей практически иссякли. Начиная с возрождения наших государственных верфей, эти усилия будут возглавлены недавно созданной Австралийской военно-морской инфраструктурой, и вскоре наша страна снова вернется на моря."
 AST_assistance_from_langley: "Помощь из Лэнгли"
 AST_assistance_from_langley_desc: "Дядя Сэм уже раньше нам помогал, и если мы обратимся с просьбой, они наверняка с радостью протянут нам руку помощи в разведывательной сфере. Как говорится, знание – половина дела."
 AST_our_fight: "Наша борьба"
 AST_our_fight_desc: "Наш дальнейший путь мы должны пройти самостоятельно. Конечно, не совсем в одиночку, но мы должны показать, что Австралия способна вооружиться и вести свои собственные битвы. В конце концов, мы — нация деятелей."
 AST_asian_partnership: "Азиатское партнерство"
 AST_asian_partnership_desc: "Без друзей ты представляешь собой лишь половину всего. Страны Азии на протяжении многих лет были для нас больше, чем просто друзьями, и Япония, в частности, поддерживала нас на протяжении всего периода наращивания вооружений. До сих пор мы вели переговоры с ними о покупке нескольких подводных лодок для увеличения численности нашего флота, и крайне важно довести дело до конца."
 AST_accelerate_the_timeline: "Ускорьте сроки"
 AST_accelerate_the_timeline_desc: "Поскольку наш подготовительный период подходит к концу, некоторые последние приготовления нужно будет ускорить. Нам нужно приготовить наши яйца немного быстрее."
 AST_in_our_backyard: "У нас под боком"
 AST_in_our_backyard_desc: "Королевский военно-морской флот курсирует в Индо-Тихоокеанском регионе уже около столетия, с момента своего образования в 1911 году. За время двух мировых войн мы извлекли бесценные уроки, в том числе и о том, как проецировать силу на эти берега. Этот опыт будет проверен в предстоящих испытаниях."
 AST_counter_the_island_chain: "Противодействие цепочке островов"
 AST_counter_the_island_chain_desc: "Начиная с 1940-х годов, Китай использует кампанию запугивания и захвата островов, чтобы укрепить свои претензии на Южно-Китайское море. Хотя в прошлом экспансия была относительно контролируемой, их последние успехи с искусственными островами усилили угрозу. Если мы не примем решительных мер, пока есть возможность, любое место к северу от нас может стать следующим «Восточно-Китайским морем»."
 AST_dealings_in_kuala_lumpur: "Сделки в Куала-Лумпуре"
 AST_dealings_in_kuala_lumpur_desc: "Объём торговли минеральными ресурсами между нами и Малайзией вырос до такой степени, что их дипломаты связались с нами для обсуждения торгового соглашения. Это потенциально может оптимизировать и без того весьма прибыльный поток товаров. Пока мы этим занимаемся, мы могли бы также предложить условия соглашения о нейтралитете, чтобы предотвратить их взаимодействие с растущей сферой влияния Китая."
 AST_guadalcanal_garrison: "Гарнизон Гуадалканала"
 AST_guadalcanal_garrison_desc: "После начала Второй мировой войны и последующего вторжения Императорской Японии на Соломоновы острова, они попытались использовать остров в качестве плацдарма для нападений на нашу страну. На этих островах происходили одни из самых ожесточенных боев, и мы не можем допустить, чтобы другая страна снова получила этот плацдарм."
 AST_mutual_defense: "Взаимная оборона"
 AST_mutual_defense_desc: "Мы не можем патрулировать Тихий океан в одиночку, и одним из наших ближайших союзников со времен окончания холодной войны, несмотря на неоднозначную историю, является Япония. То, как они, так сказать, провели ребрендинг, заслуживает всяческого восхищения. Они понадобятся нам в грядущем конфликте."
 AST_due_reparations: "Просроченные компенсации"
 AST_due_reparations_desc: "Хотя совместная работа в сфере безопасности и привлекательна, получение причитающихся нам компенсаций за Вторую мировую войну имеет для нас несколько более высокий приоритет. Более 27 000 австралийцев погибли, более 64% из них сражались против японских войск, и за время войны было потрачено почти 3 миллиарда фунтов стерлингов. И это даже не говоря о бомбардировке Дарвина. Компенсация должна быть выплачена."
 AST_pukpuk_treaty: "Пукпукский договор"
 AST_pukpuk_treaty_desc: "Мы уже много лет осторожно обсуждаем идею более тесного сотрудничества в сфере обороны с Папуа-Новой Гвинеей. Идея объединения наших военных командований представляет собой эффективную возможность противостоять растущей сфере влияния Китая и оказывать более прямое воздействие на нашего дружественного соседа."
 AST_the_indonesian_solution: "Взять Индонезию"
 AST_the_indonesian_solution_desc: "Индонезия десятилетиями доставляла нам немало хлопот, и время переговоров прошло. Потребуется прямое управление. Мы восстановим порядок в регионе."
 AST_island_leasing: "Аренда острова"
 AST_island_leasing_desc: "Острова Новой Каледонии занимают стратегически важное положение на нашем северо-восточном фланге. Размещение там наших войск позволило бы нам создать своего рода железную стену вокруг всего Кораллового моря. К счастью, мы находимся в таком положении, когда можем арендовать права на размещение войск на островах у наших французских друзей."
 AST_the_middle_power: "Средняя держава"
 AST_the_middle_power_desc: "Заручившись поддержкой Южной Кореи, мы бы, так сказать, нанесли Китаю «ахиллесову пяту». Это был бы удар прямо в живот, если бы между нами разразился конфликт, и такая возможность слишком хороша, чтобы ее упустить."
 AST_fuel_the_grudge: "Подпитывайте обиду"
 AST_fuel_the_grudge_desc: "Последний элемент на доске. Как только мы переступим этот порог, пути назад не будет. Наша политика должна будет сместиться от Китая к Тайваню. Если мы сможем заручиться их поддержкой, все остальное встанет на свои места."
 AST_shirt_front_the_dragon: "Рубашка с изображением дракона"
 AST_shirt_front_the_dragon_desc: "Китайский флот уже несколько недель пытается силой вытеснить Филиппины с оспариваемого атолла Скарборо-Шоул. Как и в случае с большинством агрессоров, если мы продемонстрируем поддержку Филиппин собственными кораблями и создадим периметр вокруг острова, бравада Китая быстро рассеется."
 AST_the_canberra_treaty: "Канберрский договор"
 AST_the_canberra_treaty_desc: "Война предотвращена, и Дракону показали, что страны Тихого океана не склоняются перед принуждением."
 AST_the_lottery_draft: "Лотерейный драфт"
 AST_the_lottery_draft_desc: "В прошлый раз, когда мы вводили программу национальной службы, этот шаг не пользовался особой популярностью. Тем не менее, нам нужны более боеготовые силы, если мы хотим одержать победу в этой войне. Необходимо будет возобновить «голосование по случаю дня рождения»."
 AST_stock_up: "Запасайтесь!"
 AST_stock_up_desc: "Наш флот не может быть повсюду. Неизбежно возникнет нехватка, и нам остаётся только молиться, чтобы к тому времени у нас было достаточно критически важных товаров на складах."
 AST_border_commanders: "Командиры пограничной службы"
 AST_border_commanders_desc: "Технически говоря, у нашей страны нет береговой охраны. Морское пограничное командование обычно обеспечивает охрану границ, но без собственных подразделений, как правило, используя смесь подразделений Сил обороны Австралии и Королевской полиции Австралии. Мы можем исправить это, включив оставшихся резервистов в состав его собственных боевых сил, которым будет поручено защищать наши берега от любых угроз."
 AST_remember_the_squander_bug: "Помните «жука расточительства»?"
 AST_remember_the_squander_bug_desc: "Расточительство в то время, когда страна сталкивается с самым серьезным финансовым кризисом со времен Второй мировой войны, равносильно государственной измене. Мы можем возродить старую классику, чтобы высмеять наших жадных до денег граждан за чрезмерные траты во время конфликта, и тем временем продавать наши военные облигации."
 AST_secure_a_landing: "Обеспечьте безопасную посадку"
 AST_secure_a_landing_desc: "Учитывая нашу значительную удаленность, любое вторжение будет осуществляться с моря. Нам потребуется реквизировать немало частных кораблей для удовлетворения логистических потребностей этой задачи и усовершенствовать наши навыки десантирования."
 AST_all_in: "Все в сборе"
 AST_all_in_desc: "Промышленность нашей страны должна быть полностью сосредоточена на противодействии нынешней угрозе. Будет введено состояние тотальной войны. Некоторые свободы могут быть временно приостановлены, но потребности государства и армии должны быть в приоритете."
 canberra_treaty_idea: "Канберрский договор"
 AST_the_rudd_government: "Правительство Радда"
 AST_the_rudd_government_desc: "Австралия смотрит в будущее. Народ решил, что мы, как нация, будем двигаться вперед — планировать будущее, принимать его вместе. Объединившись, мы пишем новую страницу в истории страны и сделаем эту великую страну еще великой. Мы не можем воспринимать это священное доверие как должное. Улучшения в системе образования давно назрели. Возможности наших государственных больниц и системы социального обеспечения остро нуждаются во внимании. Наша инфраструктура не соответствует требованиям XXI века, а отсутствие инициативы в борьбе с кризисом изменения климата отбросило нас на десятилетия назад. Мы выступаем не как борцы за сохранение статус-кво, а как инструмент для простых людей. Решение этих проблем и более серьезных угроз, стоящих перед страной, — это только начало. Наша политика должна быть в контакте с австралийцами и их потребностями. От нашей способности вывести страну в новое десятилетие зависит очень многое."
 AST_mend_the_rift: "Залечить раскол"
 AST_mend_the_rift_desc: "Пренебрежение коалиционного правительства привело к тому, что те, кто находится на грани выживания, оказались в проигрыше. Неблагополучные, маргинализированные слои населения – по мере того, как их оттесняли на обочину, эти трещины разрастались. Мы можем начать объединять австралийцев, посетив наиболее пострадавшие районы. Отдаленные общины, переживающие самые тяжелые последствия жилищного кризиса, бездомные, фермеры и рабочие, испытывающие трудности. Если мы прольем свет на их положение, мы покажем им, что правительство заботится о них и что перемены неизбежны."
 AST_heal_the_people: "Исцелите людей"
 AST_heal_the_people_desc: "В настоящее время наша система здравоохранения находится в плачевном состоянии. Время ожидания операций для людей, нуждающихся в спасении жизни, иногда составляет до года, а отделения неотложной помощи перегружены до такой степени, что пациенты даже не попадают в операционную. Внедрение в экстренном порядке национальных стандартов позволит нам немедленно расширить требования к мощности государственных больниц и повысить минимальный уровень укомплектованности персоналом по всей стране."
 AST_unite_the_country: "Объединим страну"
 AST_unite_the_country_desc: "Наша задача сейчас – управлять этим кораблем, и если мы не сможем удержать всех на борту, значит, мы плохо справляемся. Между австралийцами по-прежнему существует разрыв, который мешает нам быть единым целым, а отказ признать прошлое мешает нам смотреть в будущее. Чтобы достичь и того, и другого, нам необходимо изучить неравенство, которое на протяжении веков стало непреодолимой проблемой в этой стране. Возможно, мы не сможем полностью его искоренить, но мы можем попытаться."
 AST_economic_revolution: "Экономическая революция"
 AST_economic_revolution_desc: "Нетрудно понять, что великий неолиберальный эксперимент последних 30 лет потерпел неудачу. Порожденный им фундаментализм свободного рынка оказался не чем иным, как личной жадностью, замаскированной под экономическую философию. По иронии судьбы, теперь задача предотвратить саморазрушение этой формы капитализма ложится на плечи сторонников социал-демократии. Нам необходимо создать новую систему социального капитализма, подотчетную народу, которая уравновешивает частные интересы с общественной ответственностью. Благодаря регулированию и усилению фундаментальных систем социальной защиты для нашего народа мы сможем построить более сильную и более эффективную экономику, служащую нации."
 AST_a_voice_for_all_australians: "Голос всех австралийцев"
 AST_a_voice_for_all_australians_desc: "Нас поставили здесь не для того, чтобы проводить вялые реформы. Как бы мы ни поступили, партия последует за нами, а если нет, мы найдем способ привести их в порядок. Настоящая битва развернется в Сенате, где у нас нет большинства. Чтобы что-либо принять, потребуется увеличить число голосов за счет оппозиционных партий и сторонников независимости. \n\nЕсли мы достаточно сильно встряхнем дерево и правильно представим наши планы, несколько голосов могут попасть в нашу корзину, и мы наконец сможем принять что-то значимое."
 AST_work_with_the_party: "Работайте с партией"
 AST_work_with_the_party_desc: "Лейбористская партия снова и снова доказывает, что является лучшей надеждой для Австралии. Благодаря мудрому руководству и проверенной моральной эмпатии мы продолжаем тенденцию принятия законов, которые приносят пользу не только народу этой страны, но и будущим поколениям. Мудрый лидер также знает, когда нужно прислушаться к своей партии. Мы не можем провести наши реформы без единства партии, а в настоящее время путь к принятию политики слишком узок, чтобы не проявлять осторожность. Представление разумной политики — единственный способ добиться ее принятия в Палате представителей и Сенате."
 AST_form_the_pact: "Сформировать пакт"
 AST_form_the_pact_desc: "Если мы хотим принять какие-либо из наших более радикальных предложений, нам нужно обратиться к «зелёным». Это чрезмерно оптимистичные хиппи парламента. Встреча с их лидером, Бобом Брауном, может быть достаточной, чтобы сплотить их всех, хотя это полностью оттолкнёт любую поддержку Либеральной партии, и, более того, мы можем потерять и некоторых своих собственных членов. Тем не менее, нам понадобится их помощь, чтобы дойти до финишной линии."
 AST_something_has_to_give: "Что-то должно измениться."
 AST_something_has_to_give_desc: "Под деревянными досками нашего общества гниет. Несмотря на весь достигнутый прогресс и социальные усилия, в Австралии любой может оказаться в бедственном положении, если обстоятельства достаточно тяжелы, и многие так и поступают. Конечно, существуют системы социальной защиты, но когда наши собственные социальные выплаты ниже черты бедности, и даже пожилые люди вынуждены искать работу, чтобы избежать голода, что-то должно измениться. Наши системы поддержки сломаны, и многие в нашей стране уже это чувствуют. Мы не можем оставаться в стороне и позволять ситуации ухудшаться."
 AST_meet_with_the_unions: "Встреча с профсоюзами"
 AST_meet_with_the_unions_desc: "Если мы хотим добиться прогресса в наших реформах, лучше всего начать с профсоюзов. В конце концов, Лейбористская партия была основана профсоюзами, и они являются нашими главными благодетелями. Это, безусловно, поможет нам наладить контакт с рабочими и показать, что мы открыты для сотрудничества."
 AST_earnest_cheques_for_the_needy: "Задатки для нуждающихся"
 AST_earnest_cheques_for_the_needy_desc: "Для тех, кто живет на грани бедности, даже небольшая авария или неожиданный счет могут привести к катастрофе. Часть нашей поддержки населения включает в себя ряд разовых денежных выплат для увеличения доходов и защиты уязвимых слоев населения от внезапного финансового краха."
 AST_new_consensus: "Новый консенсус"
 AST_new_consensus_desc: "Вашингтонский консенсус был стандартным рецептом для экономик с 1980-х годов. Теперь, с появлением новых, глобализированных экономик, бросающих вызов этому консенсусу, Австралии также необходимо найти свой собственный консенсус. Хотя он и не будет таким же свободным, как в Вашингтоне, и не таким авторитарным, как в Пекине, наше вмешательство будет осуществляться с должной осмотрительностью."
 AST_insulate_the_homes: "Утеплите дома."
 AST_insulate_the_homes_desc: "Это позор, что каждую ночь тысячи австралийских семей спят на холоде. По нашим оценкам, около 40% домов не утеплены, что приводит к увеличению счетов за электроэнергию, которые тратятся на отопление, для тех, кто может себе это позволить, не говоря уже о тех, кто не может. Мы запустим программу по всей стране, чтобы покрыть расходы, которые могут возникнуть у домовладельцев на установку теплоизоляции."
 AST_fair_shake_of_the_sauce_bottle: "Неплохая порция соуса из бутылки"
 AST_fair_shake_of_the_sauce_bottle_desc: "Самая большая проблема, с которой сталкивается любая пара, желающая завести ребенка, — это финансовые ограничения. Взять отпуск по уходу за ребенком в его самые важные годы — это то, на что мало кто может позволить себе, особенно в нынешних, меняющихся экономических условиях. Учитывая, что наша обязанность — заботиться об австралийцах, мы должны поддерживать их всеми возможными способами. Каждый родитель в Австралии, даже усыновитель, имеет право на 26 недель оплачиваемого отпуска по уходу за ребенком. Каждый, кто хочет стать родителем, получит равные возможности, потому что это правительство справедливости."
 AST_housing_initiative: "Выкатывайте дома"
 AST_housing_initiative_desc: "Мы достигли соглашения с частными подрядчиками, которые помогут нам построить более 20 000 новых домов социального жилья и отремонтировать около 12 000 непригодных для проживания объектов недвижимости по всей Австралии в течение следующих 10 лет. Это обеспечит жильем тысячи людей, страдающих от бездомности, уже в первый год."
 AST_the_care_act: "Поправка о социальном обеспечении"
 AST_the_care_act_desc: "После долгих переговоров с партией и либералами нам удалось сдержать развитие нашего законодательства в сфере социального обеспечения. Благодаря пересмотру критериев получения пособий и программ поддержки трудоспособного населения, услуги Centrelink станут доступны почти миллиону дополнительных австралийцев. Пенсионеры увидят значительное увеличение своих выплат, при этом изменения будут компенсированы повышением возраста получения пособий и ужесточением медицинского страхования, чтобы успокоить оппозицию. Будут предоставлены сотни новых стипендий и увеличены выплаты по инвалидности. Всё больше и больше австралийцев будут жить проще, пока правительство их поддерживает."
 AST_shelter_for_all: "Приют для всех"
 AST_shelter_for_all_desc: "Если наших нынешних инвестиций в страну и так недостаточно, то планы по борьбе с бездомностью довели бюджетных ястребов до истерики. Мы отказались от первоначального плана по строительству 20 000 единиц социального жилья в течение 10 лет в пользу 100 000 за тот же период. Первые из них, построенные в течение следующего года, будут направлены непосредственно на обеспечение жильем тех, кто находится в наибольшей опасности. Даже самые прогрессивные члены партии называют этот план смелым, а некоторые — даже невыполнимым. Для его реализации большую часть наших строительных мощностей придется задействовать на начальном этапе."
 AST_root_and_branch_approach: "Подход «от корня до ветви»"
 AST_root_and_branch_approach_desc: "Многие из наших более масштабных реформ можно охарактеризовать следующим образом: \"корень и ветвь\" Изменения, при которых подход к реформированию таких систем, как здравоохранение или жилищное обеспечение, должен начинаться с самых основ. Необходимо ввести независимые проверки или полностью перепроектировать процесс, чтобы помочь гораздо большему числу австралийцев и обеспечить его более эффективную работу. Наши планы по реорганизации системы социального обеспечения оказались дороже, чем мы можем себе позволить в настоящее время, что приводит к значительному дефициту. \n\nКак бы нам ни хотелось угодить всем, финансирование всё равно откуда-то должно поступать."
 AST_a_stronger_net: "Более прочная сеть"
 AST_a_stronger_net_desc: "При участии «зелёных» мы разработали, возможно, крупнейший в истории страны законопроект о социальном обеспечении. Масштабная реформа существующей системы социального обеспечения и критериев получения пособий, включающая масштабные программы, направленные на миллионы людей, живущих в нищете, и повышение выплат до уровня, обеспечивающего достойный уровень жизни, одновременно с повышением минимальной заработной платы, установленной правительством. Без сомнения, это встряхнет ситуацию в отрасли, и это может стать самым близким аналогом универсального базового дохода в стране нашего размера, но если мы хотим добиться социальных изменений, которые переживут наше поколение, то это именно то, что нам нужно. Мы потеряем часть сторонников жесткой бюджетной политики в нашей партии, но это того стоит, учитывая достигнутые результаты."
 AST_bill_of_rights: "Наш Билль о правах"
 AST_bill_of_rights_desc: "После наших выборов многие выразили желание принять «билль о правах», который коренным образом изменил бы приоритеты нашего правительства в отношении прав граждан. Теперь у нас есть возможность предложить федеральный закон, который бы именно это и обеспечил. Он предусматривает защиту прав граждан, изменения в судебной системе и государственных органах, а также представление парламенту хартии, определяющей нашу ответственность перед австралийцами за обеспечение их равенства, свободы и безопасности. По сути, все это – полный комплекс мер."
 AST_the_social_contract: "Общественный договор"
 AST_the_social_contract_desc: "Системы заботы и поддержки пришли в упадок и разрушились до такой степени, что число тех, кто остался без помощи, значительно возросло. Неверно утверждение о свободе австралийцев, как и то, что система, которая снова и снова подводила их, низвела до зависимости от государства даже в самых необходимых вещах. В других странах эта же система пренебрегала теми, кто нуждался в заботе. Теперь наша ответственность – изменить ситуацию. Необходимо помочь тем, кого игнорируют и кто находится в неблагоприятном положении. Так продолжаться не может."
 AST_a_national_congress: "Национальный конгресс"
 AST_a_national_congress_desc: "Хотя Австралийский национальный конгресс коренных народов Австралии (ATSIC) был шагом к общему прогрессу, где-то по пути он сбился с пути, и его цель – реальное представительство – так и не была в полной мере реализована. Работая с Австралийской комиссией по правам человека, мы можем организовать новый Национальный конгресс коренных народов Австралии, который заменит его. Это позволит нам более активно сотрудничать с коренными австралийцами для реализации политики, направленной на равенство и активные перемены."
 AST_visit_the_schools: "Посетите школы"
 AST_visit_the_schools_desc: "Подобно нашей экономической революции, потребуется реформа системы образования, проводимая сверху вниз. Мы уже разработали планы по значительным инвестициям в реконструкцию и строительство новых профессиональных училищ, и мы можем начать с посещения некоторых наших местных школ в Квинсленде, чтобы оценить ситуацию на местах."
 AST_digital_education: "Цифровое образование"
 AST_digital_education_desc: "Прорыв интернета стал настоящим событием для австралийцев, и особенно для нашей молодежи. Если с раннего возраста научить нас более эффективно использовать цифровые технологии, наше следующее поколение будет готово к работе в новом цифровом мире и сможет избежать опасностей, которые он может представлять. Установка компьютеров в классах, наряду с другими работами по модернизации, подготовит нас к современной эпохе."
 AST_a_national_agreement: "Национальное соглашение"
 AST_a_national_agreement_desc: "Ряд членов оппозиции склонны сотрудничать с нами в вопросах политики в отношении коренного населения. Если мы сможем убедить их рассматривать эти проблемы как кризисные, мы сможем принять законопроекты в качестве экстренных мер. Необходимо быстро внедрить программы, направленные на борьбу с хроническими заболеваниями, повышение уровня грамотности и улучшение доступа к первичной медицинской помощи в отдаленных районах."
 AST_state_health_reform: "Реформа здравоохранения на уровне штата"
 AST_state_health_reform_desc: "Как правило, местные власти управляют государственными больницами из собственных средств. Однако в последнее время они либо ослабили контроль, либо испытывают серьезные проблемы с финансированием, поскольку нынешний уровень медицинской помощи далеко не достаточен. Единственный способ провести реформу финансирования — это взять на себя управление финансированием больниц, сохранив при этом общее оперативное управление на местном уровне. Мы можем провести собственные проверки, чтобы определить, какие области нуждаются в улучшении, и отталкиваться от этого. Если они поднимут шум, нам придется пригрозить им конституционным референдумом, чтобы передать федеральному правительству полный контроль над государственными больницами, тогда посмотрим, будут ли они продолжать протестовать. На этот раз ответственность лежит на нас."
 AST_equal_opportunity: "Равные возможности"
 AST_equal_opportunity_desc: "Мы не имеем права препятствовать требованию равных прав на брак. Даже если мы сами не выступаем за это, мы все равно можем вынести этот вопрос на референдум и оценить общественное мнение. Если он пройдет, а оппозиция по-прежнему будет против нас, мы сможем использовать это как аргумент на следующих выборах."
 AST_respect_traditional_values: "Уважайте традиционные ценности."
 AST_respect_traditional_values_desc: "Справедливое правительство обязано прислушиваться к нуждам большинства, уважая при этом интересы меньшинства. Австралия процветала благодаря взвешенному и осторожному руководству. Мы не будем заставлять никого печь торт, который противоречит их религии, и не собираемся разжигать культурные войны. Пришло время сделать шаг назад."
 AST_clean_feed: "Чистый корм"
 AST_clean_feed_desc: "Даже с помощью наших программ цифрового образования мы не можем предотвратить худшие проявления интернета в отношении молодежи. Даже сейчас онлайн-травля и киберпреступность угрожают самой основе жизни австралийцев. Мы поручим нашим интернет-провайдерам составить список самых злостных нарушителей в интернете, что потребует от них..."
 AST_close_the_gap: "Сократить разрыв"
 AST_close_the_gap_desc: "Наша главная и неизменная политика в отношении коренного населения направлена ​​на сокращение разрыва в продолжительности жизни, уровне образования и экономических возможностях. В частности, продолжительность жизни коренных австралийцев почти на 10 лет меньше, чем у некоренного населения. Уровень грамотности также значительно ниже, а уровень детской смертности вдвое выше, чем у некоренного населения. Вы понимаете, о чём речь. Нам необходимо принять законодательство, включающее широкий спектр программ, направленных на решение этой проблемы, и установить чёткие цели для улучшения жизни наших коренных народов."
 AST_tackle_the_mining_oligarchy: "Борьба с горнодобывающей олигархией"
 AST_tackle_the_mining_oligarchy_desc: "Коварные силы, оказывавшие влияние на наше правительство, продолжают делать это и по сей день благодаря богатствам, которые они выкачали из нашей земли. На протяжении веков они скопили состояние и отказывались им делиться, в то время как наемные рабочие получают слишком низкую зарплату и слишком легко увольняются. Давно пора им заплатить свою долю, и австралийский народ должен быть вознагражден за руду, добываемую на их земле."
 AST_draft_the_legislation: "Разработка проекта законодательства"
 AST_draft_the_legislation_desc: "Учитывая масштабы наших задач, нам потребуется разработать окончательный вариант налогового законодательства, лишенный каких-либо лазеек, и привлечь к этому процессу всех возможных экспертов. Если мы это делаем, значит, делаем это правильно."
 AST_tax_the_super_profits: "Обложите налогом сверхприбыль"
 AST_tax_the_super_profits_desc: "Многочисленные бессонные ночи, проведенные в парламенте, вознаградили нас сверкающим копьем, которое мы можем использовать против крупных корпораций. Динамическая налоговая ставка, нацеленная на крупнейшие компании и облагающая налогом только их \"сверхприбыли\" Полученная прибыль, значительно превышающая обычный уровень дохода компании, в конечном итоге позволит распределить часть доходов, накопленных во время горнодобывающего бума. Это также позволит избежать обвинений в несправедливом налогообложении, поскольку налог будет равен нулю, если компания показала низкие результаты или ее операционные расходы превышают прибыль."
 AST_throw_businesses_a_bone: "Подари Корпусу кость"
 AST_throw_businesses_a_bone_desc: "Регулирование между нашими штатами, мягко говоря, чрезмерно. Оно обходится крупным и малым предприятиям в огромные суммы и замедляет значительную часть торговли, что, в свою очередь, приводит к росту цен на товары на местном уровне. Если мы хотим пойти навстречу отраслям и показать, что мы не просто хотим им навредить, мы можем сотрудничать с бизнес-советом для создания единой национальной экономики. Экономики, которая сократит бюрократические препоны в обмен на упрощение поездок и улучшение транспортного потока."
 AST_tear_off_special_interests: "Отрыв от особых интересов"
 AST_tear_off_special_interests_desc: "Группы интересов стали пагубным явлением в нашей политической системе, с которым следовало разобраться давным-давно. Они оказывают несправедливое влияние на наш избирательный цикл и политический процесс. Мы не можем говорить за другую сторону политического спектра, но, проведя расследование в отношении нашей собственной партии на предмет несправедливого влияния, мы, возможно, сможем ослабить некоторые из этих щупалец. Это может не избавить нас от них навсегда, но в будущем это облегчит их удаление."
 AST_own_our_resources: "Владейте нашими ресурсами"
 AST_own_our_resources_desc: "Одна из самых больших ошибок правительства заключалась в том, что оно позволило иностранным компаниям владеть нашими ресурсами, не имея при этом собственной доли в них. Конечно, мы неплохо извлекли выгоду из их постоянного роста, и мировая экономика не просто так процветает, но мы не должны пренебрегать и интересами нашей собственной страны. Мы уже получаем роялти от горнодобывающих компаний за добычу полезных ископаемых на нашей земле; если мы повысим стоимость, они могут сначала выразить протест, но в конечном итоге они сядут за стол переговоров, и мы сможем лучше договориться о порядке обращения с нашими минеральными ресурсами."
 AST_spirit_of_gough: "Дух Гофа"
 AST_spirit_of_gough_desc: "Трагическая история Гофа Уитлама войдет в историю. Человек с завышенными амбициями, которого сломили окружающие. Несмотря на короткий срок его правления, он блистал как великий революционер прогрессивной политики, и лишь попытка ограничить растущий контроль горнодобывающей промышленности привела к его краху. Возможно, уже слишком поздно реализовывать тот масштаб собственности, который он планировал, но мы все еще можем оправдать его ожидания. Создав первую государственную горнодобывающую корпорацию, мы сможем обойти корпорации и добывать руду в собственных шахтах, забирая всю прибыль и все выгоды себе."
 ast_spirit_of_gough_tt: "Создает Управление по нефти и минералам §0.§!"
 AST_twenty_twenty_summit: "Саммит 2020"
 AST_twenty_twenty_summit_desc: "Саммит 2020 года стал детищем более активного участия нашего правительства в управлении страной. Это открытый демократический форум, на который приглашены 1000 общественных лидеров, экспертов и граждан для обсуждения стратегии будущего страны. Возможность для австралийцев самим определять свое будущее — отличный способ начать наш срок полномочий и показать, что мы привержены переменам."
 AST_kyoto_accords: "Киотское обязательство"
 AST_kyoto_accords_desc: "Ратификация Киотского протокола — это только начало. Чтобы он полностью раскрыл свой потенциал, нам придётся приложить больше усилий. Не нужно оставлять без внимания ни один уголок угля."
 AST_big_australia: "Большая Австралия"
 AST_big_australia_desc: "Эта концепция была выдвинута во время саммита 2020 года. Наша небольшая численность населения — одно из немногих препятствий на пути к тому, чтобы стать одними из лучших. Сейчас мы можем произвести лишь ограниченное количество детей. Новый план включает шаги по достижению численности в 36 миллионов к 2050 году, в первую очередь за счет увеличения приема мигрантов через нашу миграционную систему. Все необходимо оптимизировать."
 AST_seasonal_labour_scheme: "Схема сезонной занятости"
 AST_seasonal_labour_scheme_desc: "Ограничения, накладываемые нашим малочисленным населением, можно временно преодолеть только за счет притока рабочей силы из-за рубежа. Расширение ограничений, направленных на привлечение большего числа иностранных рабочих в наши отрасли, позволит поддерживать их рост в краткосрочной перспективе и сдержать сокращение, которое мы можем ожидать в будущем."
 AST_our_sibling_state: "Наше братское государство"
 AST_our_sibling_state_desc: "Немногие могут измерить ожесточенное соперничество между нами и страной с меньшим населением, чем Сидней. Будь то спорт или что-либо еще, вы никогда не услышите конца разговорам, если они окажутся на вершине. Наши экономики уже достаточно синхронизированы, но мы работаем над торговым соглашением, которое эффективно свяжет наши страны в финансовом плане. Торговля и инвестиции между нами будут циркулировать как вода, если соглашение будет успешным."
 AST_pacific_islands_forum: "Форум тихоокеанских островов"
 AST_pacific_islands_forum_desc: "Раз в несколько лет наша Новая Зеландия и страны-островки встречаются, чтобы обсудить региональные интересы и решить стоящие перед ними проблемы. Это эффективный способ следить за нашими океаническими соседями. В этом году тема разрешений на работу была в центре внимания, и несколько стран обсудили временные разрешения на совместное развитие садоводства. Независимо от того, согласимся мы на это или нет, этот план, безусловно, имеет свои преимущества."
 AST_end_the_imperialism: "Покончим с империализмом"
 AST_end_the_imperialism_desc: "Возможно, пребывание на самом высоком посту в стране принесло нам ясность. В той устоявшейся обстановке, которую создали наши предшественники, у нас иногда действительно есть выбор. Продолжать ли вмешиваться и причинять вред всему миру или же отступить и уважать границы, которые нас окружили."
 AST_maintain_obligations: "Выполнять обязательства"
 AST_maintain_obligations_desc: "Мы сохраняем за собой определенную ответственность перед правительствами, которые были до нас, и за интересы, которые они создали в Тихоокеанском регионе и за его пределами. Когда наша политика, как это часто бывает, затрагивает жизни миллионов людей, мы должны подходить к делу осторожно. Резкое ухудшение отношений на столь раннем этапе приведет только к негативным последствиям. Лучше всего сохранить то, что у нас есть, и улучшать это там, где это возможно."
 AST_the_free_trade_area: "Зона свободной торговли"
 AST_the_free_trade_area_desc: "Многомесячные переговоры с государствами АСЕАН принесли нам невероятно выгодную возможность. Хотя наша страна и Новая Зеландия не соответствуют критериям для вступления в торговый блок, мы все же можем воспользоваться некоторыми его преимуществами, став внешними «партнерами», по сути, создав зону свободной торговли между нами и Азией."
 AST_the_beginning_of_something_new: "Начало чего-то нового"
 AST_the_beginning_of_something_new_desc: "Хотя пакт АСЕАН хорошо сработал в деле объединения азиатских государств за последние десятилетия, три крупнейшие экономики Тихоокеанского региона остаются едва связанными друг с другом. У Японии, Индии и Китая могут быть свои собственные соглашения, но они меркнут по сравнению с союзом, созданным в Европе. Хотя это, безусловно, амбициозная цель, если бы мы смогли объединить эти страны, включая нашу собственную, в единый экономический союз, финансовое процветание было бы лишь началом. Мир в Тихоокеанском регионе был бы достигнут всего лишь с помощью единой валюты."
 AST_address_the_tiger: "Обратитесь к тигру"
 AST_address_the_tiger_desc: "Отношения с Индией сейчас складываются отлично. Некоторые даже скажут, что просто замечательно. Не стоит портить то, что и так хорошо, но кто сказал, что нельзя это улучшить? Их отношение к Китаю — одно из главных препятствий на пути к созданию союза. Если нам удастся добиться какого-то прорыва, остальная работа покажется пустяком."
 AST_an_asian_pacific_union: "Азиатско-Тихоокеанский союз"
 AST_an_asian_pacific_union_desc: "Каждый элемент должен быть на своем месте для достижения нашей цели. Насколько далеко мы сможем продвинуться и какой след оставим в геополитической истории, будет определяться этими переговорами. Наша работа наконец-то принесет свои плоды."
 AST_renegotiate_with_papua: "Как справиться с кризисом на воде"
 AST_renegotiate_with_papua_desc: "Ежегодно тысячи мигрантов прибывают на наши берега без документов, и, похоже, это число только растет. Поскольку существующая инфраструктура перегружена, решение проблемы с размещением мигрантов за пределами страны необходимо пересмотреть, чтобы справиться с нынешним кризисом."
 AST_keep_the_gears_turning: "Продолжайте вращать шестерни"
 AST_keep_the_gears_turning_desc: "Мы слишком тесно связаны с миром, чтобы просто отстраниться. Политика сдерживания через посредников работает только в том случае, если мы постоянно смазываем механизмы и показываем, что выполняем свои обещания. Риск отвернуться слишком высок. Нет никакого высшего блага. Нет никакой справедливой причины."
 AST_world_hold_on: "Мир, держись!"
 AST_world_hold_on_desc: "Нам нужно дать понять другим странам, что Австралия еще не достигла своего пика. Мы все еще здесь, и мы движемся за границу. Привлечение внешних инвестиций путем ослабления регулирования, сдерживающего развитие нашего крупного бизнеса, — это тот вид экономического колониализма, которым мы можем гордиться. Телеканал Fox News и сеть ресторанов Outback Steakhouse — это лишь малая часть того, на что мы способны. Они еще увидят."
 AST_assure_the_other_side: "Уверьте другую сторону"
 AST_assure_the_other_side_desc: "Мы не можем выжить без нашего бизнеса. Торговля действует как кровеносные сосуды, циркулирующие в нашей промышленности. Помимо партийных обязательств, без заинтересованности в поддержке бизнеса в условиях нынешних финансовых потрясений, само сердце нашей экономики может остановиться. Необходимо найти баланс в поддержке бизнеса, так же как и в его косвенной поддержке нас."
 AST_forward_with_fairness: "Вперед со справедливостью"
 AST_forward_with_fairness_desc: "Мы всецело поддерживаем улучшение жизни наших работников, но в нынешних условиях сдерживание роста бизнеса просто недопустимо. Отмена коллективных договоров и введение коллективных переговоров покажут, что мы готовы работать в интересах бизнеса. В конце концов, право на труд должно оставаться за работником, а не за профсоюзом."
 AST_represent_the_worker: "Представлять интересы трудящихся"
 AST_represent_the_worker_desc: "Труд по своей сути состоит из людей, обладающих неотъемлемым достоинством, а не просто из экономического товара. Если наши работники не верят, что мы их поддерживаем, как они могут отстаивать свои права? Мы не можем ставить интересы предприятий выше интересов собственных людей."
 AST_the_emissions_trading_scheme: "Схема торговли выбросами"
 AST_the_emissions_trading_scheme_desc: "Изменение климата стало величайшим моральным вызовом нашего времени. Не только для нас, но и для всего мира. Сотни стран сейчас предупреждаются о надвигающейся опасности, но их способность действовать подвергается сомнению. Можно ли отказаться от комфорта нашей промышленности ради благополучия будущих поколений? Можем ли мы действительно выдержать бремя выведения экономики на новый уровень, сохраняя при этом окружающую среду? Для нас ответ всегда будет «да». Эта программа была одним из наших самых давних предвыборных обещаний, вводя ограничения на выбросы CO2 компаниями. Если компании захотят выбрасывать больше, им потребуются специальные разрешения от правительства или высокая плата за них, что приведет к снижению производства энергии в краткосрочной перспективе. Цель программы — снизить наши выбросы до уровня, существовавшего до 2000 года, одновременно стимулируя использование возобновляемых источников энергии, но, несомненно, она принесет нам значительный дополнительный доход."
 AST_cut_the_csiro: "Упраздните CSIRO"
 AST_cut_the_csiro_desc: "К сожалению, Австралийская организация научных и промышленных исследований (АОИ) не справляется со своей задачей. Можно было бы ожидать, что раздутые гранты, полностью покрывающие расходы других ведомств, принесли бы хоть какой-то результат, но за последние несколько десятилетий затраты выросли, и от этого мало что осталось ценного. Нам нужно будет сократить её финансирование, чтобы вернуть всё в нормальное русло, и это не повредит нашей казне."
 AST_green_energy_incentives: "Стимулирование использования экологически чистой энергии"
 AST_green_energy_incentives_desc: "Если использование ископаемого топлива сокращается, то возобновляемые источники энергии должны набирать популярность. Более того, их необходимо поощрять, если мы хотим добиться повсеместного внедрения возобновляемых источников энергии в стране в будущем. Развитие наших геотермальных возможностей и инвестиции в Фонд инноваций в области экологически чистых автомобилей помогут нам двигаться в правильном направлении."
 AST_fair_work_australia: "Справедливая система оплаты труда Австралии"
 AST_fair_work_australia_desc: "Учитывая разрыв между нашими предприятиями и правительством, партия предложила создать бюро по связям, работающее от имени деловых кругов, чтобы лучше согласовать наши приоритеты с их интересами. Это должно положить конец Закону о трудовых отношениях и пугающим реформам Workchoices. Если мы будем внедрять это с учетом мнения профсоюзов, мы сможем включить некоторые из обычных мер защиты прав трудящихся, одновременно угождая обеим сторонам спора."
 AST_snip_the_red_tape: "Преодолейте бюрократические препоны"
 AST_snip_the_red_tape_desc: "Несмотря на наше относительно единое государство, правительства штатов, безусловно, работают не так хорошо, как нам бы хотелось. Чтобы зарегистрироваться, компания должна заполнить формы и оплатить сборы в каждом отдельном штате, где она работает. Таким образом, если компания работает в двух штатах, сборы и формы удваиваются. Создание единого национального онлайн-реестра позволит любому человеку в стране зарегистрироваться один раз и сразу же начать вести бизнес."
 AST_for_the_common_farmer: "Для простого фермера"
 AST_for_the_common_farmer_desc: "С начала века нашим фермерам приходится нелегко. Наиболее серьезной причиной для беспокойства стала засуха тысячелетия, которая, несмотря на нашу политику, продолжает препятствовать восстановлению сельского хозяйства. Встреча с представителями фермерских сообществ поможет нам разработать реальные решения."
 AST_walkable_cities: "20-минутные города"
 AST_walkable_cities_desc: "Наша главная борьба разворачивалась на улицах. В начале промышленной революции горожане были вынуждены ютиться в узких переулках и использовать асфальтированные улицы в качестве мест для общественных собраний. С тех пор наше чувство общности ослабло и стало жертвенным объектом для развлечений внутри помещений. Мы не можем заставить людей выходить на улицу, но можем их привлечь. Внедрение плана «20 минут до начала мероприятия», разработанного городским советом Мельбурна, позволит нам ослабить ограничения на шум на главных улицах и профинансировать ряд творческих проектов и фестивалей, чтобы вернуть людей на улицы и восстановить чувство общности. Добавьте к этому бесплатные молодежные программы и расширение инфраструктуры, и наши районы через несколько лет превратятся в оживленные культурные центры."
 AST_keep_them_safe: "Обеспечьте им безопасность"
 AST_keep_them_safe_desc: "У Австралии нет национального животного, хотя большинство считает, что это красный кенгуру. Практически общепризнанный символ, и тем не менее, многие знают и о милых зверьках, обитающих в наших лесах в глубинке. Будь то лесозаготовительные компании или болезни, с каждым годом численность популяции коал сокращается, и тем не менее, для их защиты делается очень мало. Если мы выдвинем их в качестве охраняемого вида, наконец-то можно будет сделать больше для сохранения этих запоминающихся сумчатых и защиты их от вымирания."
 AST_industry_research_bank: "Исследовательский банк Содружества"
 AST_industry_research_bank_desc: "Наша исследовательская деятельность пришла в упадок только потому, что мы сами это допустили. Недостаток инвестиций в критически важные области мешает нашим организациям выполнять ту самую работу, для которой они были созданы, — преодолевать препятствия. Увеличьте бюджет и повысьте целевые показатели."
 AST_natos_best_friend: "Лучший друг НАТО"
 AST_natos_best_friend_desc: "Австралия уже является одним из ближайших союзников НАТО, не являющихся членами организации. Мы проводим с ними тренировки, участвуем в миротворческих операциях и обмениваемся разведывательной информацией. Наша позиция в Тихоокеанском регионе могла бы быть значительно укреплена при надлежащей поддержке, и хотя наш нейтралитет имеет свои преимущества, настало время для более тесного сотрудничества."
 AST_from_the_ashes: "Из пепла"
 AST_from_the_ashes_desc: "Теперь, когда мы снова у власти, нам нужно сосредоточиться на победе на следующих выборах. Наша политика должна быть ориентирована на краткосрочную перспективу, а для того, чтобы сплотить партию вокруг нас, потребуется немного вдохновения и немалое давление."
 AST_a_new_dawn: "Новый рассвет"
 AST_a_new_dawn_desc: "Общественность должна воспринимать Лейбористскую партию как возродившуюся. Необходимо избавиться от старой оболочки внутренних распрей и сформировать новый имидж компетентной и надежной партии, чтобы спасти свою электоральную базу."
 AST_repair_the_party: "Восстановить вечеринку"
 AST_repair_the_party_desc: "Наши прежние отношения с партийными фракциями практически разрушены. Хуже того, система, которая позволила нам быть свергнутыми, всё ещё существует. Единственный способ исправить ситуацию — это искоренить существующие механизмы, чтобы уменьшить количество переворотов в руководстве, и переписать партийные правила."
 AST_fight_back: "Дайте отпор"
 AST_fight_back_desc: "Если бы представители Newscorp Media думали, что смогут и дальше поливать нас грязью, а мы ничего не сможем с этим поделать, они бы просто мечтали. Арена дебатов — это улица с двусторонним движением, и мы собираемся дать им отпор."
 AST_on_the_campaign_trail: "В ходе предвыборной кампании"
 AST_on_the_campaign_trail_desc: "Последние несколько лет действительно были не самыми лучшими, и Лейбористская партия, безусловно, сбилась с пути. Посещение сельских и городских районов Австралии по всей стране и понимание реальных проблем, затрагивающих их, показывает, что мы готовы вернуться к тому, чтобы быть партией, которая прислушивается к людям. Начнем с объявления о нашем участии в Национальной конференции."
 AST_win_manufacturers: "Производители побед"
 AST_win_manufacturers_desc: "Мы начинаем наш второй срок с уверенного принятия Закона об австралийских рабочих местах. Пакет мер на сумму 2 миллиарда долларов направлен на переподготовку 7000 работников обрабатывающей промышленности, помогая им перейти в производственные сектора, в то время как наши традиционные автомобильная и текстильная отрасли переживают сокращение производства. Практическое решение продолжающегося спада в промышленности."
 AST_cast_the_die: "Бросьте жребий"
 AST_cast_the_die_desc: "Мы подготовились, и австралийский народ готов выбрать своего следующего лидера. Мы сделали все возможное, чтобы подготовиться и представить наше видение, и нам остается только надеяться, что избиратели его поддержат."
 AST_the_gillard_gov: "Правительство Гиллард"
 AST_the_gillard_gov_desc: "Это правительство верит в поощрение тех, кто трудится усерднее всего, а не тех, кто громче всех жалуется. Оно верит в поощрение тех, кто изо дня в день работает на наших заводах и фермах, в наших шахтах и ​​на наших комбинатах, в наших классах и больницах, тех, кто ценит свой труд, порядочность и старание. Тех, кто соблюдает правила, заводит будильники пораньше, отводит детей в школу, поддерживает своих соседей и любит свою страну. Наша страна во многом благословлена, но состояние наших государственных финансов настолько ухудшилось и раздулось, что пришло в упадок. Я заверяю каждого австралийца, что бюджет вернется в нормальное состояние под нашим руководством. Принимая на себя обязанности, возложенные на нас ранее, мы полны решимости создать финансово ответственное и сильное правительство, которое понимает потребности не только тех, кто громко жалуется. Политика в СМИ закончится. Безразличие к потребностям нашей промышленности прекратится, и к нам вернутся такие качества, как достоинство и здравый смысл."
 AST_form_the_minority_coalition: "Сформируйте коалицию меньшинств."
 AST_form_the_minority_coalition_desc: "Будущее лейбористской партии теперь зависит от нашей способности сформировать правительство."
 AST_go_green: "Забота об окружающей среде"
 AST_go_green_desc: "Когда они не предают нас, «зелёные» оказываются полезной партией для нашего дела. Переговоры с ними вряд ли будут проблемой, и большинство их политических предпочтений совпадают с нашими. Конечно, нам придётся провести несколько символических реформ, но они будут на нашей стороне, когда это будет действительно важно."
 AST_wrangle_liberal_defectors: "Перепалка с либеральными перебежчиками"
 AST_wrangle_liberal_defectors_desc: "Некоторые нынешние члены Либеральной и Национальной партий проявили интерес к нашей программе, а некоторые уже покинули её из-за недавних партийных скандалов. Найти их и предложить им место в нашем правительстве в обмен на поддержку должно быть достаточно легко, и это покажет, что мы не против сотрудничества с оппозицией в деле сохранения консервативных ценностей."
 AST_clean_energy_act: "Закон о чистой энергии"
 AST_clean_energy_act_desc: "После неудачной попытки запуска системы торговли квотами на выбросы (ETS) был разработан менее спорный альтернативный вариант для решения проблемы растущих выбросов углекислого газа. Сфера действия этого закона еще не полностью определена, но, как и в случае с ETS, его цель — ограничить выбросы CO2 за счет новых налогов и стимулировать производство чистой энергии."
 AST_clean_energy_creation: "Создание чистой энергии"
 AST_clean_energy_creation_desc: "Мы добились больших успехов в борьбе с климатическим кризисом, и пришло время инвестировать часть наших средств в продолжение этого плана. Долгосрочная цель всегда заключалась в достижении независимости от возобновляемых источников энергии, а не от угольных месторождений. Давайте начнем этот переход."
 AST_address_the_stolen_generations: "Обращение к «украденным поколениям»"
 AST_address_the_stolen_generations_desc: "Оппозиция пользуется достаточной поддержкой, чтобы выступить с речью о «украденных поколениях», не создавая при этом впечатления, что мы прикрываемся лозунгом «Национальные извинения». Это, безусловно, создаст впечатление нашей двухпартийной солидарности и может стать источником утешения для некоторых членов общества."
 AST_correct_the_mouthboxes: "Исправьте речевые коробки"
 AST_correct_the_mouthboxes_desc: "Корпорациям и политическим деятелям позволяли откровенно лгать в интернете и на телевидении практически без каких-либо последствий. Хотя трудно доказать злой умысел или вред, причиненный попустительством правде, мы не можем допустить продолжения этой тревожной тенденции. Введение законодательства, предусматривающего наказание за вводящую в заблуждение рекламу или публикации, должно обуздать эту тенденцию и вернуть в политику хоть какое-то подобие реальности."
 AST_let_debate_decide: "Пусть дискуссия решит."
 AST_let_debate_decide_desc: "Один из законопроектов, переданных нам «зелёными», направлен на расширение свобод для лиц однополых пар. Наше правительство пока ещё не определилось со своей позицией, если не сказать, что против резких шагов в этом направлении, но мы можем предоставить парламенту возможность принять справедливое решение по этому вопросу."
 AST_ndis: "Зарегистрируйтесь в NDIS"
 AST_ndis_desc: "Простая истина заключается в том, что инвалидность может затронуть любого из нас, а значит, и всех нас. Редко кто бывает финансово готов к последствиям, и сейчас те, кто сталкивается с изоляцией, бедностью и потерей достоинства, могут рассчитывать лишь на те немногие социальные службы, которые специально предназначены для инвалидов. Введение Национальной схемы страхования инвалидов, возможно, является самой значительной поддержкой со времен введения всеобщего здравоохранения Гофом Уитламом. Миллионы нуждающихся получат необходимую им поддержку, и страна будет гордиться этим."
 AST_the_gonski_review: "Обзор Гонски"
 AST_the_gonski_review_desc: "В начале нашего срока мы инициировали проверку нашей школьной системы, чтобы выявить недостатки, требующие исправления. В результате проверки был выявлен растущий разрыв в результатах обучения, обусловленный социально-экономическим статусом и неэффективным финансированием. Короче говоря, государственные школы, получающие меньшее финансирование, в итоге показывают более низкие результаты по всем показателям. Для решения этой проблемы и оказания помощи нашим ученикам необходимо провести серьезное перераспределение финансирования образования. В конце концов, они – будущее нашей страны."
 AST_take_less: "Бери меньше"
 AST_take_less_desc: "В очень немногих вопросах Либеральная партия права, но в одном она права — это поддержание низких налогов. Как мы можем ожидать, что среднестатистический австралиец оценит результаты своего труда, если мы в итоге забираем себе большую его часть? Более сильное население — это то, у кого больше денег в кармане."
 AST_get_more: "Получить больше"
 AST_get_more_desc: "Налоги на вредные привычки существовали с момента основания нашей страны, хотя в последнее время от них отказались в пользу права низших слоев населения предаваться развратным деяниям. Выбор между проявлением «социальной терпимости» и наличием хоть какой-то моральной основы для нас очевиден."
 AST_regulate_the_unions: "Регулировать деятельность профсоюзов"
 AST_regulate_the_unions_desc: "Нравится вам это или нет, но профсоюзы по своей сути являются препятствием для экономического роста. Они подрывают свободу трудящихся и права компаний нанимать сотрудников. Нас практически держат за горло политической властью, которую профсоюзы используют для контроля над правительством и подавления процветания. Необходимо разрешить принятие законов, ограничивающих их влияние и позволяющих сохранять политику страны в руках правительства, а не под контролем этих крайне левых мелких бюрократов."
 AST_national_broadband_network: "Национальная широкополосная сеть"
 AST_national_broadband_network_desc: "Проект NBN находится в разработке уже почти десять лет, и в него уже инвестированы миллиарды долларов, чтобы привести скорость сети по всей Австралии в соответствие с современными стандартами. Если уж говорить об этом, то проект затянулся больше, чем было необходимо, и тем не менее противники жалуются на его стоимость. Если наши сокращения и были на что-то способны, так это на то, что подобные расходы вполне оправданы."
 AST_back_in_black: "Снова в чёрном"
 AST_back_in_black_desc: "Не указывая ни на кого конкретно, скажу, что наши расходы стали безрассудно чрезмерными. Расточительство губит наш бюджет, и ни одно правительство не должно расплачиваться за грехи предыдущего. Необходимо приложить все усилия, чтобы вывести нас из убытков и поддерживать низкий уровень инфляции. Нет \"если,\" нет \"но.\" Здесь неудача недопустима, и мы не потерпим поражение."
 AST_slam_the_door_on_them: "Захлопните перед ними дверь"
 AST_slam_the_door_on_them_desc: "Учитывая, насколько сильно вырос уровень социального обеспечения, в первую очередь нам следует пересмотреть критерии предоставления услуг для людей с инвалидностью. Повышение требований до разумного уровня позволит освободить от них часть тех, кто наживается на пособиях и, возможно, не нуждается в поддержке, а сокращение некоторых неэффективных программ позволит вернуть расходы на более приемлемый уровень."
 AST_scrounge_a_penny: "Выкопать копейку"
 AST_scrounge_a_penny_desc: "В стремлении любыми способами сэкономить средства иногда приходится проявлять изобретательность, особенно когда речь идёт о повышении налогов. Громкое объявление о повышении налогов — верный способ сократить нашу поддержку ещё на начальном этапе. Вместо этого, если мы тихо повысим медицинский сбор с 1,5% до 2%, те, кто его оплачивает, почти не заметят, и мы получим неплохой дополнительный бюджетный ассигнования."
 AST_digitise_the_tvs: "Оцифруйте каналы"
 AST_digitise_the_tvs_desc: "После успешного завершения пилотной программы в Милдуре мы расширяем переход на новые каналы по всей стране, заменяя старые подключения на телеприставки. Внедрение полностью осуществляется нами и должно позволить даже жителям сельских районов Австралии получить доступ к множеству новых каналов в гораздо более высоком качестве. Великое выравнивание доступа к развлечениям начинается здесь."
 AST_our_own_white_paper: "Наш собственный аналитический доклад"
 AST_our_own_white_paper_desc: "Австралийские вооруженные силы играли центральную роль, являясь священным щитом бесчисленных стран, как ближних, так и дальних. По мере роста потребности в защите рос и бюджет, и ни одна часть правительства не застрахована от расточительства. Армия останется такой же эффективной, как и прежде, но необходимо будет провести тщательную чистку от недостатков."
 AST_plain_cigarette_packaging: "Простая упаковка сигарет"
 AST_plain_cigarette_packaging_desc: "Помимо сокращения расходов, одним из наших главных приоритетов было решение проблемы онкологических заболеваний. Государственная реклама внесла свой вклад, но доступность сигарет практически в каждом магазине по-прежнему остается серьезной проблемой. Вместо полного запрета курения, замена фирменной упаковки на короткие рекламные объявления, предупреждающие об опасностях курения, сделает связь с раком невозможной для игнорирования. Это заставит родителей быть ответственными и сильно напугает молодежь."
 AST_put_the_squeeze_on_them: "Надавите"
 AST_put_the_squeeze_on_them_desc: "Частью нашей государственной реформы здравоохранения был пересмотр текущих расходов штатов и их корректировка для более эффективного и своевременного оказания медицинской помощи. На этот раз мы предложим другой подход, направленный на устранение неэффективных расходов. Как и в прошлый раз, они, вероятно, будут с нами спорить, но в конечном итоге мы выжмем из них каждую каплю и вернем все средства в бюджет."
 AST_australia_works: "Австралия работает"
 AST_australia_works_desc: "Программа, получившая свое название, направлена ​​на внедрение принципов программы «Работа за пособие» в государственную строительную службу, действующую по всему штату, обеспечивая стабильную работу для получателей пособий и создавая новые рабочие места для поддержания на плаву сокращающейся строительной отрасли. Это невероятно амбициозный, но необходимый проект, чтобы вернуть нашу страну на правильный путь."
 AST_free_the_market: "Более свободный рынок"
 AST_free_the_market_desc: "В настоящий момент наша прекрасная страна задыхается от перегруженного правительства и обворованного частного сектора. Мы замедляемся и одновременно отказываемся позволить бизнесу развиваться самостоятельно. Ограничение этого влияния путем снижения налоговой диктатуры и приватизации неиспользуемых офисных помещений станет тем самым оживлением, которое нам необходимо, и позволит свободному рынку идти своим чередом."
 AST_mediate_with_the_mines: "Посредничество с шахтами"
 AST_mediate_with_the_mines_desc: "Отношения между Лейбористской партией и горнодобывающими компаниями сложились в далеко не идеальном состоянии. Для совместной работы над реформами необходимы серьезные перемены, и начинать следует с самого центра. Проведение различных мероприятий для обсуждения требований и возможностей сотрудничества заложит основу для нашей дальнейшей работы."
 AST_endorse_the_magnates: "Поддержите Magnetes"
 AST_endorse_the_magnates_desc: "Одна из крупнейших руководителей горнодобывающих компаний, Джина Райнхарт, напрямую обратилась к администрации с просьбой урегулировать ее запрос на привлечение 1700 квалифицированных иностранных рабочих для пополнения штата на недавно созданных шахтах в Западной Австралии. Джина до сих пор всячески поддерживала наше новое правительство, и, возможно, правильное начало сотрудничества с ней станет залогом успешного взаимодействия с горнодобывающими компаниями."
 AST_entice_competition: "Привлечь к участию в конкурсе"
 AST_entice_competition_desc: "Если профсоюзы опасаются образования монополий, откройте рынок для иностранных компаний. Конкуренция веками сдерживала развитие экономики, и австралийская экономика не является исключением. Смешивание различных идей – это одна из причин, по которой эта страна была построена."
 AST_minerals_resource_tax: "Налог на минеральные ресурсы"
 AST_minerals_resource_tax_desc: "Налог на сверхприбыль был слишком амбициозным и введен в самое неподходящее время. Нам необходимо сотрудничать с горнодобывающей промышленностью, если мы хотим пережить этот кризис целыми и невредимыми. Сотрудничество, конечно, обеспечило нас этим небольшим законопроектом. Правда, этого далеко не достаточно, чтобы ослабить монополизацию наших ресурсов, но пока что этого будет достаточно."
 AST_bauxite_investment: "Инвестиции в бокситы"
 AST_bauxite_investment_desc: "Алюминий становится одним из важнейших металлов XXI века. Он повсюду, невероятно полезен, и у нас его здесь предостаточно. К счастью, предложение о строительстве такого рудника попало к нам на стол и было представлено на рассмотрение в рамках запроса на инвестиции. Когда появляется такая возможность, разумно не упускать её."
 AST_pilbara_expansion: "Расширение региона Пилбара"
 AST_pilbara_expansion_desc: "Большинство заявок на выделение земель под горнодобывающую деятельность рассматриваются на местном уровне, однако поступила заявка на участок в Пилбаре, который находится на границе одного из национальных парков этого региона. Участок расположен довольно далеко от любых природоохранных территорий, но дело в настоящее время затянулось в Верховном суде. Возможно, мы сможем повлиять на ситуацию и ускорить его утверждение, разумеется, в интересах нашей экономики."
 AST_ease_on_restrictions: "Смягчение ограничений"
 AST_ease_on_restrictions_desc: "Ежегодно множество горнодобывающих проектов отменяются из-за экологических ограничений. Даже самые незначительные участки могут быть закрыты из-за зон охраны природы или нового климатического законодательства. На данный момент самым большим препятствием для экономического роста является нехватка ресурсов. Абсурдная концепция, учитывая размеры Австралии. Это необходимо исправить."
 AST_train_it_out: "Тренируйтесь"
 AST_train_it_out_desc: "Горнодобывающая промышленность Западной Австралии практически умоляет о строительстве железнодорожных линий свободного доступа, соединяющих отдаленные шахты, такие как Пилбара, с портами. Строительство собственных государственных линий позволило бы разрушить монополию крупных компаний на железнодорожную инфраструктуру и дало бы возможность десяткам средних и малых горнодобывающих предприятий доставлять свою продукцию в порты, что значительно увеличило бы объемы национального экспорта."
 AST_champion_the_mets_sector: "Чемпион METS"
 AST_champion_the_mets_sector_desc: "В связи с тем, насколько оптимизирована горнодобывающая промышленность в нашей стране, корпорации начали рассматривать её как... \"карьер в мир,\" Так сказать. Там, где добыча ресурсов стала узкоспециализированной деятельностью, Австралию следует рассматривать как Силиконовую долину горнодобывающих технологий. \n\nФинансирование организаций METS (горнодобывающее оборудование, технологии и услуги) и направление собственных исследований и разработок в области дистанционной добычи полезных ископаемых ускорит разработку автономной транспортировки и усовершенствует существующие методы добычи. Будущее горнодобывающей промышленности будет создано здесь."
 AST_the_australian_century: "Австралийский век"
 AST_the_australian_century_desc: "Золотые века редко наступают случайно или по счастливой случайности. Они являются результатом работы, вложенной на протяжении десятилетий или даже столетий, и случаются крайне редко, если вообще случаются. В отличие от стран в истории, наше правительство не блуждает в темноте. Все, что мы делаем сегодня, готовилось годами, и наш успех был тщательно спланирован с самого начала. Сейчас наш момент."
 AST_the_foreign_ministry: "Министерство иностранных дел"
 AST_the_foreign_ministry_desc: "Подъем Азии, и в частности Китая, поставил Австралию в вечное положение \"более низкая ставка\" Мы занимаем более выгодное экономическое положение, чем окружающие нас страны. Хотя для некоторых это может показаться тревожной реальностью, XXI век не станет продолжением однополярного господства, и это открывает перед нами огромные возможности. Если мы готовы конкурировать и преодолеть свои предрассудки, Тихоокеанский регион предстанет перед нами как новый мир, который мы можем либо эксплуатировать, либо принять на благо нашей страны."
 AST_foreign_minister_rudd: "Министр иностранных дел Радд"
 AST_foreign_minister_rudd_desc: "Бывший лидер, возможно, является самым опытным специалистом по международным делам в нашем окружении. Кевин Радд десятилетиями налаживал диалог с азиатскими странами и уже сыграл решающую роль в укреплении взаимосвязей между ними. Радд предложил серию дипломатических поездок для укрепления наших позиций и представления Австралии как более влиятельной державы в Тихом океане."
 AST_papua_residency: "Резиденция в Папуа"
 AST_papua_residency_desc: "Экономика Папуа постепенно интегрируется с нашей, за исключением официальных соглашений. Исправление этой ситуации путем заключения полного экономического соглашения наконец-то закрепит достигнутое."
 AST_soften_the_emerald: "Смягчение изумруда"
 AST_soften_the_emerald_desc: "Для такой близко расположенной соседней страны можно было бы ожидать приятных взаимоотношений. К сожалению, в последнее время разлад только усилился, и отправка Радда для урегулирования ситуации может стать единственным способом спасти отношения."
 AST_the_new_bear: "Новый Медведь"
 AST_the_new_bear_desc: "Вся природа России изменилась за постсоветские годы. Страна постепенно приняла идеологию капитализма и впустила иностранные интересы под свой покровительство. Это может стать для нас возможностью дипломатически утвердить свой флаг и договориться о чем-то выгодном для себя, несмотря на расстояние между нами."
 AST_entente_with_north_korea: "Согласие с Северной Кореей"
 AST_entente_with_north_korea_desc: "Радд предложил поездку в демилитаризованную зону Кореи для встречи с северокорейским лидером в надежде на сближение двух стран и достижение мирного сосуществования. Возможно, он немного замахнулся на слишком многое, но план в целом разумный, и это будут первые прямые шаги, которые мы предпримем в общении с Северной Кореей."
 AST_foreign_minister_smith: "Министр иностранных дел Смит"
 AST_foreign_minister_smith_desc: "Стивен Смит является видным членом партии со времен Китинга, и он первым предложил свои услуги министерству иностранных дел. Его политика достаточно хорошо согласуется с нашей, поскольку Смит хочет, чтобы Австралия стала центром торговли в Тихоокеанском регионе. Он стремится использовать Новый Свет как точку роста нашего экономического влияния за рубежом любыми способами, которые приносят пользу стране."
 AST_our_glowing_deposits: "Наши светящиеся отложения"
 AST_our_glowing_deposits_desc: "Месторождения есть, нам просто нужно их экспортировать. Наш нынешний клиент уже давно настойчиво требует от нас права на разработку месторождений, и будет справедливо, если мы предложим вам свои услуги."
 AST_the_best_of_both_worlds: "Лучшее из двух миров"
 AST_the_best_of_both_worlds_desc: "Мы балансируем между сложным балансированием, поддерживая прочный альянс в сфере безопасности и обороны с Соединенными Штатами и стремясь к стабилизации торговой взаимозависимости с Китаем. Именно благодаря тому, что нам удается оставаться на плаву, мы избегаем необходимости выбирать между этими двумя крайностями."
 AST_made_in_vietnam: "Сделано во Вьетнаме"
 AST_made_in_vietnam_desc: "Для многих австралийцев было странным чувством, когда они, глядя на товары, которые всегда покупали, вдруг видели внизу маленькую надпись, сообщающую, что они произведены не здесь, а в каком-то месте под названием \"Vietnam.\". С этим было нелегко смириться, но когда их карманы наполнились, а в магазинах появился больший ассортимент, они быстро к этому привыкли."
 AST_foreign_minister_carr: "Министр иностранных дел Карр"
 AST_foreign_minister_carr_desc: "Боб Карр, пожалуй, самый большой реалист в нашем списке, или, по крайней мере, самый прагматичный. В основе своей Карр считает, что внешняя политика — это серия импровизаций. Австралия должна одновременно стремиться к статусу морального центра в Тихоокеанском регионе и не бояться запачкать руки, защищая свои интересы. Как мы сможем это сбалансировать — вот настоящее испытание."
 AST_smother_the_pot: "Перемешайте содержимое кастрюли."
 AST_smother_the_pot_desc: "Австралийские интересы настолько тесно переплетены с Ближним Востоком, что всё происходящее там влияет на нас здесь. Последнее десятилетие превратило кипящий котёл беспорядков в бушующий пожар, в котором мы не можем оставаться в стороне."
 AST_the_big_boys_club: "Клуб больших мальчиков"
 AST_the_big_boys_club_desc: "В Совете Безопасности ООН пять постоянных мест и около пятнадцати непостоянных, которые меняются каждые несколько лет. Политика, затрагивающая весь мир, принимается в залах ООН между этими странами. Поскольку наши обязанности тесно переплетены с остальным миром, справедливо, что мы тоже имеем право голоса. Нам нужно работать над повышением наших шансов попасть туда."
 AST_global_weapon_trading: "Глобальная торговля оружием"
 AST_global_weapon_trading_desc: "Карр использует наше положение в ООН для активной поддержки глобального договора о торговле оружием, направленного на отслеживание и сокращение поставок оружия государствам и террористическим группам, находящимся в невыгодном положении, а также на повышение привлекательности продаж оружия из нашей страны и других западных государств. Это смелый шаг, но в настоящее время он мобилизует поддержку в Нью-Йорке, чтобы добиться принятия этого договора."
 AST_myanmar_intervention: "Вмешательство Мьянмы"
 AST_myanmar_intervention_desc: "Распад Мьянмы превратился в гуманитарный кошмар. Любое наше решение вмешаться будет иметь свои последствия, так же как и отказ от участия."
 AST_consuls_of_peace: "Консулы мира"
 AST_consuls_of_peace_desc: "Судьба Австралии неразрывно связана с глобальным сотрудничеством. Наши миссии за рубежом и миротворческие операции неизменно преследуют цель поощрения, а иногда и восстановления порядка, основанного на правилах. Это роль, к которой мы стремимся, и репутацию, которую мы должны сохранять."
 AST_centurians_of_the_pacific: "Тихоокеанские центурионы"
 AST_centurians_of_the_pacific_desc: "Правила глобального вмешательства изменились с начала нового столетия. Национальная безопасность заняла место традиционных гражданских свобод, а принципы предотвращения были приняты почти каждой западной страной после фундаменталистских атак. Мы не приобретаем новых друзей и не защищаем страну, ограничиваясь правилами прошлых лет, но мы становимся мишенью, если не реагируем должным образом."
 AST_the_costello_government: "Правительство Костелло"
 AST_the_costello_government_desc: "Австралии уже более 100 лет, и с момента образования федерации она прошла долгий путь. Несмотря на то, что население Австралии составляет лишь малую часть населения соседней страны, наша экономика стремительно становится одной из крупнейших в мире. Наши люди стали свидетелями того, как страна вокруг них становилась богаче и процветающей, о чем предыдущие поколения даже не мечтали, и все же настоящие богатства остаются нераскрытыми. Наш потенциал скрыт под поверхностью, подобно нефтяной жиле, ожидающей своего открытия. Финансовое управление шахтами прекратилось, и многие из наших крупнейших отраслей промышленности стали самодовольны. Социальное обеспечение стало обузой для нашего бюджета, а малый бизнес по-прежнему борется за доступ к постоянно сокращающемуся рынку. Способ нашего управления должен измениться."
 AST_a_bastion_for_commerce: "Оплот торговли"
 AST_a_bastion_for_commerce_desc: "По мере сближения стран, связанных Тихим океаном, потребность в промежуточном пункте для торговли становится все более очевидной. У Австралии сейчас есть возможность стать маяком для торговли, объединив различные экономики в одном порту, подобно Константинополю и Венеции."
 AST_bring_in_the_chains: "Приготовьте цепи"
 AST_bring_in_the_chains_desc: "Мы получили огромную выгоду от заимствования культур со всего мира. Корпорации не являются исключением. У нас уже выстроилась очередь из желающих открыть свои предприятия. Я считаю, что мы должны им это позволить."
 AST_domestic_demands: "Внутренние потребности"
 AST_domestic_demands_desc: "Мы и рабочие нашей страны разделяем мнение, что местная промышленность имеет значение. Сильная отечественная промышленность должна быть способна пережить любой глобальный экономический спад, и, при должном внимании, она это сделает."
 AST_outsource_the_troubles: "Передайте проблемы на аутсорсинг."
 AST_outsource_the_troubles_desc: "В последние годы нехватка рабочей силы стала нашим главным препятствием для дальнейшего роста. У нас просто недостаточно работников, чтобы восполнить этот дефицит, и любое долгосрочное решение приведет к тому, что лучшие годы для развития будут упущены. Нам нужно искать возможности за рубежом."
 AST_come_one_come_all: "Приходите все!"
 AST_come_one_come_all_desc: "Наши деньги должны оставаться в Австралии, по крайней мере, наша зарплата. Лучший способ восполнить дефицит рабочих мест — это позаботиться о прибыли. Тысячи людей хотят попробовать свои силы в работе в Австралии. Все, что нам нужно сделать, это открыть им двери."
 AST_off_with_tariffs: "Освободите рынок от бремени"
 AST_off_with_tariffs_desc: "Либеральная экономическая теория породила концепцию «изобилия». Идея заключается в том, что более свободные рынки и более широкие возможности для траты денег неизбежно приводят к улучшению благосостояния общества. Заманчивая концепция, которую наши предприятия стремятся опробовать. Необходимо отменить обременительные налоги, которые все еще остаются."
 AST_negotiate_with_the_rba_ast: "Вести переговоры с Резервным банком Австралии."
 AST_negotiate_with_the_rba_ast_desc: "Небольшие уговоры Резервного банка могут дать нам необходимую свободу действий для экономического подъема. К счастью, у нас есть связи, чтобы убедить банк снизить процентные ставки и одновременно стимулировать потребительские расходы."
 AST_fix_the_trade_woes: "Решите торговые проблемы"
 AST_fix_the_trade_woes_desc: "В то время как импорт и экспорт товаров через нашу страну за очень короткий период времени достигли огромных масштабов, среди наших предприятий также растет путаница в отношении нашей торговой системы. Торговый дефицит и неэффективное управление препятствуют увеличению прибыли и замедляют торговые процессы. Потребуется создание нового агентства, призванного наладить весь этот процесс."
 AST_adventure_in_the_usa: "Приключения в США"
 AST_adventure_in_the_usa_desc: "Америка всегда была и, возможно, всегда будет нашим крупнейшим инвестором. Страна Биг Мака, родина свободы и друг всех. Было бы неправильно не обратиться к ней за следующим шагом в нашей экономической эволюции."
 AST_im_an_oil_man: "Я нефтяник"
 AST_im_an_oil_man_desc: "Это вопиющая необходимость развития нефтедобычи в нашей стране. У нас есть скважины и подходящие для этого условия. Процесс затянулся слишком надолго, и наше правительство должно будет всё это остановить. Нефть будет поступать в большем количестве."
 AST_for_queen_and_company: "Для Queen и компании"
 AST_for_queen_and_company_desc: "Наши инициативы в Штатах позволили достаточно подлить масла в огонь, чтобы побудить некоторые английские корпорации расширить свое присутствие в нашем сельскохозяйственном секторе."
 AST_rail_endeavors: "Железнодорожные проекты"
 AST_rail_endeavors_desc: "Мы уже сотрудничали с корпорацией Bechtel в разработке проектов для междугородних железнодорожных линий, и теперь они, а также правительства земель, планируют совместно разработать научно-исследовательский проект. Они уже представили технические характеристики новых электрических и дизельных моделей. Теперь нам осталось только получить одобрение."
 AST_the_miracle_economy: "Чудо-экономика"
 AST_the_miracle_economy_desc: "В СМИ уже называют успех нашей экономики чудом в наше время. Конечно, это вовсе не чудо. Наш успех всегда зависел от нашей рассудительности и осмотрительности. Поэтому, подобно ухоженному саду, результат нашего управления расцвел во что-то впечатляющее."
 AST_ride_the_bubble: "Покатайтесь на пузыре"
 AST_ride_the_bubble_desc: "Когда несколько лет назад лопнул пузырь доткомов, казалось, что на нас буквально обрушился небосклон. Цены на акции, накопленные за миллиарды долларов инвестиций в вычислительные системы, внезапно лопнули, и вместе с ними были потеряны еще миллиарды. На этот раз мы обеспечиваем надежную основу для инвестиций в вычислительные системы, создавая инфраструктуру, поддерживающую рост, и максимально мягкое регулирование, необходимое для предотвращения повторного краха системы."
 AST_silicon_dreams: "Кремниевые мечты"
 AST_silicon_dreams_desc: "Стремление когда-нибудь стать технологически независимой страной начинается с нашей способности производить микросхемы в промышленных масштабах. Начав с небольших объемов, мы можем выделить финансирование исследовательским группам, занимающимся разработкой микросхем, и предоставить возможность запустить испытательный полигон в штате Виктория."
 AST_jobs_for_the_needy: "Работа для нуждающихся"
 AST_jobs_for_the_needy_desc: "Упущение, связанное с введением программы «Работа за пособие», — это то, за что мы расплачиваемся до сих пор. Рабочих ни в коем случае нельзя было отнимать у частных предприятий для использования на общественных работах. Смысл системы социального обеспечения должен заключаться в том, чтобы трудоустроить тех, кто способен работать. На смену ей должна прийти новая программа."
 AST_keep_it_competitive: "Поддерживайте конкурентоспособность"
 AST_keep_it_competitive_desc: "Чем больше мы развиваемся в промышленном отношении, тем выше риск искажения рынка. Монополии могут превратиться в настоящую угрозу, если мы им это позволим, и печальный факт заключается в том, что регулирование — это наиболее надежная защита в борьбе с ними. Мы можем работать на уровне штатов, координируя политику, и отталкиваться от этого."
 AST_shatter_the_iron_curtain: "Разбить железный занавес"
 AST_shatter_the_iron_curtain_desc: "Холодная война для Австралии закончилась, когда мы пожали руку Мао в 1973 году. С тех пор нас связывает дружба, которая выдерживает любые партийные разногласия или глобальные кризисы. Необходимо создать форум, чтобы обеспечить безопасность и прозрачность нашего будущего сотрудничества."
 AST_our_man_in_beijing: "Наш человек в Пекине"
 AST_our_man_in_beijing_desc: "Александр Даунер, наш многолетний министр иностранных дел, а теперь и заместитель, настолько сблизился с китайским правительством и бизнес-классом, что некоторые в нашей собственной партии усомнились в его лояльности. Тем не менее, нам понадобится его проницательность, чтобы извлечь что-либо значимое из нашего нового партнерства. Начиная с ближайшего рейса в Пекин."
 AST_the_lithium_projects: "Проекты Гринбуше"
 AST_the_lithium_projects_desc: "Литиевые проекты компании Greenbushe стали многообещающим направлением для развития сообществ Западной Австралии. К концу проекта планируется производить 1 миллион тонн лития в год, что сделает нас одним из крупнейших в мире экспортеров переработанного лития. Теперь им нужна лишь небольшая финансовая поддержка."
 AST_cater_to_investors: "Ориентироваться на инвесторов"
 AST_cater_to_investors_desc: "Китайские застройщики составляют более 60 процентов наших иностранных землевладельцев. Такие инвестиции начинают составлять основу нашей отрасли освоения земель, и для бесперебойного развития этих отношений необходимо учитывать интересы обеих сторон."
 AST_the_future_fund: "Фонд будущего"
 AST_the_future_fund_desc: "Первоначальная идея фонда заключалась в том, чтобы помочь покрыть пенсионные накопления наших государственных служащих, но эта концепция вполне может быть использована для стимулирования иностранных инвестиций в нашу страну. Уже сейчас фонд привлек удивительно много средств от зарубежных инвесторов, в частности от бельгийской группы Euroclear, и пришло время воплотить его в жизнь."
 AST_a_friendly_union: "Более дружелюбный союз"
 AST_a_friendly_union_desc: "Один профсоюз, который нас не достаёт, — это европейский. Достигнуты успехи в организации мероприятий по снижению ограничений на продажу европейских автомобилей в нашей стране, по крайней мере, на ближайшие несколько лет. Визит в штаб-квартиру ЕС мог бы дать толчок нашим усилиям и предложить нашим потребителям новые, привлекательные варианты."
 AST_fechado: "Закрыто!"
 AST_fechado_desc: "Растущее процветание бразильской горнодобывающей экономики не осталось незамеченным нашими горнодобывающими промышленниками, которые обратились к нам с просьбой смягчить импортные ограничения на горнодобывающее оборудование. Это практически ничего нам не будет стоить и сблизит нас с нашими друзьями из G20."
 AST_the_republic_question: "Вопрос о республике"
 AST_the_republic_question_desc: "Со времени образования нашей федерации Австралия фактически оставалась подданной английской короны. Наша конституция монархическая, и главой государства по-прежнему является глава Соединенного Королевства. Хотя какое-то время это работало, дух времени — демократический. Мы не назначаем людей на должности по наследству. В нашем обществе и в наше время мы предпочитаем назначения по заслугам. Австралия еще будет иметь свой день как по-настоящему независимое государство."
 AST_how_we_sell_it: "Как мы это продаём"
 AST_how_we_sell_it_desc: "Получение поддержки населения для нашего референдума станет последним препятствием на пути к цели. Необходимо получить большинство голосов избирателей по всей стране, а также поддержку в 4 из 6 штатов и территорий. Это невыполнимая задача, если мы не завоюем сердца и умы общественности. Нам нужно активизировать работу СМИ и начать мобилизовывать поддержку лично."
 AST_send_it_through: "Отправьте это"
 AST_send_it_through_desc: "После провала референдума 1999 года тема республики испортила отношения большинства членов парламента, словно дурное предзнаменование. Мы находимся в значительно невыгодном положении по сравнению с прошлым разом. Возможно, нам придётся приложить немало усилий, чтобы сдвинуть дело с мертвой точки."
 AST_our_commonwealth: "Наше Содружество"
 AST_our_commonwealth_desc: "Мы не можем просто так отбросить почти два столетия истории и родственных связей. Особенно в такой переходный период. Подтверждение нашей приверженности Содружеству может развеять опасения некоторых роялистов, которые всё ещё колеблются."
 AST_free_from_binds: "Без ограничений"
 AST_free_from_binds_desc: "Наш уход от монархии нельзя оценивать наполовину. Нам нужно разорвать связи с короной, а вместе с ними и мягкое покрывало, которое оберегало нас все эти годы. Необходимые нам перемены — это те, которые оставят раны и синяки после того, как мы прорвёмся сквозь «стеклянный потолок». Это будет нелегко."
 AST_run_the_games: "Проведение игр"
 AST_run_the_games_desc: "Каждые четыре года наши легкоатлеты принимают участие в Играх Содружества — многопрофильном спортивном мероприятии, во многом похожем на Олимпийские игры, объединяющем спортсменов со всего мира в рамках Содружества Наций. Возможно, сейчас самое подходящее время, чтобы подать заявку на проведение предстоящих Игр."
 AST_kowtow_to_the_crown: "Поклониться короне"
 AST_kowtow_to_the_crown_desc: "Официальное одобрение монархии наконец-то положит конец оппозиционной фракции, хотя и ценой отчуждения части наших собственных республиканцев, но когда начнут поступать голоса, они вряд ли останутся решающими."
 AST_crossing_the_floor: "Пересечение пола"
 AST_crossing_the_floor_desc: "Руководители лейбористской партии будут смеяться, подсчитывая прибыль, когда узнают, что нам нужна их поддержка на выборах. Унизить их будет непросто, и, несомненно, они выдвинут свои требования, но путь впереди – это движение вперед. Хотим мы этого или нет, но на данный момент они наши новые союзники."
 AST_approaching_the_governor: "Обращение к губернатору"
 AST_approaching_the_governor_desc: "Последний этап процесса. Ситуация несколько неловкая, учитывая то, что генерал-губернатору вручают его собственное заявление об отставке. Остаётся только надеяться, что он воспримет это спокойно."
 AST_a_shining_example: "Яркий пример"
 AST_a_shining_example_desc: "Мы должны стать примером успешной демократии для стран Тихоокеанского региона. Наш успех в этом важном деле станет свидетельством для тех, кто находится не только в регионе, но и во всем мире. Даже в наши почтенные годы мы можем сбросить оковы контроля."
 AST_no_kings: "Нет королей"
 AST_no_kings_desc: "Механизмы нашей новой конституции должны отражать реалии современных политических изменений. Ни одна система не застрахована от краха, но её можно сделать устойчивой. Власти будут разделены, будет обеспечен надзор, а также гарантии со стороны третьих лиц для сдерживания авторитарных и реакционных идей."
 AST_endow_the_arts: "Поддержка искусств"
 AST_endow_the_arts_desc: "Свобода выражения мнений — один из основополагающих принципов демократии, и так было со времён восстания в Эврика-Стокэйд. Откровенно говоря, любые инвестиции в искусство, как правило, являются пустой тратой денег, но если сейчас нам и нужно проявлять чуткость к чему-либо, так это к культуре."
 AST_hold_onto_the_wild: "Держись дикой природы"
 AST_hold_onto_the_wild_desc: "В целях поощрения лесопользования в пригородах, землевладельцы, решившие выделить часть или всю свою землю под природоохранные цели на неопределенный срок, получат меньшую налоговую нагрузку в рамках налога на прирост капитала. Тем временем мы можем обеспечить закрепление защиты национальных парков в нашей новой конституции, чтобы сохранить их в безопасности на десятилетия вперед."
 AST_a_generation_to_persevere: "Поколение, которое будет упорствовать"
 AST_a_generation_to_persevere_desc: "Будущее нашей страны полностью в руках будущих поколений. Забота о них и обеспечение им достаточных знаний для процветания равносильны сохранению нашего образа жизни. Образование должно стать конституционным правом, гарантированным нашим государством."
 AST_enshrine_the_protections: "Закрепить меры защиты"
 AST_enshrine_the_protections_desc: "Следующий шаг в изменении нашей конституции должен быть судьбоносным. Не только в системе управления, но и для наших граждан. Права наиболее уязвимых слоев населения не должны определяться тем, кто занимает самый высокий пост в Канберре. Они должны быть закреплены в конституции и закреплены на постоянной основе в обозримом будущем. Австралия — это не страна, где защищены немногие, а страна, где защищены все. И точка."
 AST_modernize_the_communities: "Модернизировать общины"
 AST_modernize_the_communities_desc: "У нас в разработке ряд программ, направленных на привлечение большего количества контрактов в районы с низким уровнем дохода, что позволит обеспечить работой тех, кто не имеет средств к существованию, и улучшить имидж небольших, испытывающих трудности городов."
 AST_with_heritage_to_remember: "С наследием, которое нужно помнить."
 AST_with_heritage_to_remember_desc: "Путь к примирению во многом вступает в свою следующую фазу. Необходимо будет снова протянуть руку поддержки, но на этот раз, чтобы оказать её лично. Внесение поправок в конституцию, позволяющих местным традиционным владельцам земель заключать официальные договоры, касающиеся сохранения и земельного суверенитета, а также прав на утверждение застройки, передаёт бразды правления примирением в руки общины. Это даёт местным общинам право на собственное будущее и возможность защитить своё прошлое."
 AST_one_last_push: "Последний рывок"
 AST_one_last_push_desc: "У нас есть мандат. Голоса подсчитываются. Остаётся только надеяться, что на этот раз история будет на нашей стороне."
 AST_a_new_constitution: "Новая Конституция"
 AST_a_new_constitution_desc: "Впереди нас ждет новая эра австралийского государственного управления. Шаг, который мы делаем сейчас, смелый, возможно, даже немного безрассудный, закладывает основу для истории. На этом камне мы строим будущее нации, нашу новую конституцию."
 AST_the_mining_snag: "Проблема с добычей полезных ископаемых"
 AST_the_mining_snag_desc: "Действительно, в последние годы с горнодобывающей промышленностью обращались несправедливо не раз, хотя мы не можем игнорировать грехи этого сектора. Необходимо достичь взаимопонимания между нами, между потребностями правительства и правами промышленников. Перемирие будет достигнуто."
 AST_a_little_of_this: "Немного этого"
 AST_a_little_of_this_desc: "Несколько крупных компаний, имеющих доли в горнодобывающей промышленности, также инвестируют в лесозаготовительную отрасль. Отрасль, которая после многолетнего сопротивления со стороны экологических групп лишилась своих доходов. Открытие части государственных лесов для вырубки и отмена одного-двух правил могут принести нам необходимую поддержку."
 AST_formal_investigation: "Официальное расследование"
 AST_formal_investigation_desc: "Системное принуждение и распределение бюджетных средств — наиболее распространенный результат чрезмерной политизации горнодобывающей промышленности. Мы не можем искоренить всю коррупцию, но можем встряхнуть ситуацию, создав официальную комиссию по расследованию деятельности шахт, целью которой является выявление наиболее очевидных случаев коррупции."
 AST_for_a_bit_of_that: "Немного этого"
 AST_for_a_bit_of_that_desc: "Все жалобы от шахт обычно касаются чрезмерного регулирования. Они лоббируют против него, их медиакампании направлены против него. Они практически стучатся в наши двери, требуя его отмены. Заодно, если им предложат временную отмену регулирования, это может склонить их к реформам."
 AST_training_the_next_miners: "Подготовка будущих шахтеров"
 AST_training_the_next_miners_desc: "Профессиональное образование в колледжах TAFE должно стать для нас самым быстрым способом подготовки новых кадров для отрасли, с минимальными затратами для них и даже с небольшим стимулом для тех, кто выберет этот путь."
 AST_when_opportunity_calls: "Когда зовёт возможность"
 AST_when_opportunity_calls_desc: "Министерство иностранных дел вернулось с Ближнего Востока с предложением напрямую от Дома Саудов о интересном сотрудничестве в наших горнодобывающих проектах. Это первое наше взаимодействие с ними по этому вопросу, и что бы они ни задумали, это может оказаться слишком выгодным, чтобы от этого отказаться."
 AST_tussle_with_the_media: "Конфликт со СМИ"
 AST_tussle_with_the_media_desc: "Мы не можем позволить горнодобывающим корпорациям иметь все права голоса. Даже несмотря на противодействие со стороны медиахолдинга Мердока, мы все еще можем донести свою точку зрения до прессы и рассказать о некоторых наших открытиях по национальному телевидению."
 AST_war_with_the_party: "Война с партией"
 AST_war_with_the_party_desc: "В условиях нынешней ожесточенной кампании против нас некоторые члены партии начинают расходиться. Либо присоединяются к СМИ, отвергая наше правительство, либо пытаются дистанцироваться от нас. Нам нужно перейти в наступление. Собрать дезертиров и изолировать болтунов от СМИ. Дать им понять, что мы по-прежнему у власти."
 AST_no_gas_all_breaks: "Нет газа, все тормоза"
 AST_no_gas_all_breaks_desc: "Нам необходимо порвать с партийной традицией покровительства горнодобывающей промышленности. Возможности в нашем секторе возобновляемой энергетики развиваются и улучшаются с каждым днем. Компания Iberdrola в настоящее время успешно эксплуатирует ряд заводов в штате Виктория. При наличии государственного финансирования и одобрения она планирует открыть предприятия по всей стране."
 AST_the_processing_debacle: "Провал обработки данных"
 AST_the_processing_debacle_desc: "В результате наших исследований на нас возложена огромная ответственность за поиск решения проблемы этих иммигрантов. Это будет непростой выбор, но для нас он редко бывает лёгким."
 AST_bowen_expansion: "Расширение Боуэна"
 AST_bowen_expansion_desc: "Компания BHP запросила ускоренное одобрение строительства нового трубопровода в Боуэнском бассейне, штат Квинсленд. Проект призван значительно ускорить производство стали в этом регионе. Экологические организации выразили некоторое недовольство по поводу прохождения трубопровода через места обитания коал, но представители проекта заверили нас, что ущерб будет минимальным."
 AST_fortescue_lines: "Линии Фортескью"
 AST_fortescue_lines_desc: "Наш крупнейший центр добычи железной руды расположен в Западной Австралии и обслуживается компанией Fortescue. Они пригласили нас к совместным инвестициям в их проект по добыче магнетита, что позволит увеличить объемы добычи руды при снижении выбросов. В этом случае, если мы сможем завоевать расположение как горнодобывающих компаний, так и защитников окружающей среды, это может несколько снизить давление на нас."
 AST_secure_resource_tax: "Налог на безопасные ресурсы"
 AST_secure_resource_tax_desc: "Наконец-то мы ввели первый комплексный налог на ренту от добычи полезных ископаемых, направленный на устранение некоторых недостатков налогообложения, существовавших во время горнодобывающего бума. Благодаря положениям, гарантирующим защиту интересов малого бизнеса и шахт, в наш бюджет поступит новый источник доходов, не влияющий на производительность."
 AST_an_open_ear: "Открытое ухо"
 AST_an_open_ear_desc: "Климатические ограничения, введенные нашими предшественниками, вывели всю отрасль из равновесия из-за своей жесткости. Как мы можем вообще надеяться на конкуренцию, когда соседние страны платят за это лишь малую часть? Необходимо ввести более мягкие правила регулирования, и будет предоставлена ​​отсрочка от нынешних ограничений до тех пор, пока мы не найдем разумное решение."
 AST_olympic_dam_developments: "Развитие проекта строительства Олимпийской плотины"
 AST_olympic_dam_developments_desc: "Корпорация Western Mining обратилась к нам с предложением о совместном исследовательском проекте с использованием уранового рудника в Олимпик-Дэм. Мы также получили очень громкие протесты против рудника как внутри, так и за пределами парламента по поводу его воздействия на местное сообщество. Любое расширение рудника и его объектов неизбежно вызовет негативную реакцию, но это вряд ли то, с чем мы не сможем справиться."
 AST_changing_the_system: "Изменение системы"
 AST_changing_the_system_desc: "Мы добились значительных успехов в управлении этой отраслью. Прибыль теперь поступает более эффективно и в большем объеме, чем когда-либо. Еще многое можно сделать для улучшения ситуации, но пока мы можем оглянуться назад и восхититься проделанной работой."
 AST_the_turnbull_government: "Правительство Тернбулла"
 AST_the_turnbull_government_desc: "Это временная заглушка. Дерево фокусов Тернбулла находится в разработке и будет выпущено в ближайшее время!"
 corroboree_event.1.t: "Речь на Корробори"
 corroboree_event.1.d: "Говард стоял позади старейшины, когда тот произносил речь. [GetASTLeaderTitle]Вступительная речь. Он должен был выступить на Корробори. Это стало визитной карточкой его предвыборной кампании и стиля руководства с момента избрания. Однако на этот раз толпа была равнодушна. Не было никаких пламенных криков, когда он произносил свою риторику о «практическом примирении» и демонстрировал взвешенный подход. Многие из собравшихся ждали часами, и, казалось, никого из них не впечатлили эти, казалось бы, пустые обещания прогресса. Несколько человек ушли, а некоторые, отвернувшись в знак протеста, начали выкрикивать оскорбления. \n\nПосле речи, встреченной вялыми аплодисментами, Говард долго беседовал со старейшинами. Он не принес никаких извинений и не пошел на какие-либо уступки, которые бы посчитал предвзятыми. \"Пустые жесты.\" В конце концов, стороны разошлись, и некоторое время в воздухе витало чувство разочарования."
 corroboree_event.1.a: "Могло быть и хуже..."
 mining_giants_talk.1.t: "Встреча с гигантами"
 mining_giants_talk.1.d: "Как и ожидалось, руководители различных горнодобывающих компаний обратились к нам с просьбой продлить налоговые льготы, чтобы воспользоваться преимуществами продолжающегося горнодобывающего бума. В качестве аргумента они приводят то, что сэкономленные средства позволят им расширить производство в долгосрочной перспективе. Дополнительная скидка невелика и вряд ли подорвет наши финансы, но мы могли бы отклонить эту просьбу и просто оставить все как есть. В качестве альтернативы мы могли бы повысить налоговую ставку, чтобы самим получить часть прибыли от бума, что не окажет существенного немедленного влияния."
 mining_giants_talk.1.a: "Предоставьте им налоговую льготу."
 mining_giants_talk.1.b: "Давайте оставим все как есть."
 mining_giants_talk.1.c: "Повысьте налоговую ставку и получите свою долю."
 civil_partnership_act.1.t: "Закон о гражданском партнерстве принят по всей стране."
 civil_partnership_act.1.d: "Собравшиеся у Капитолийского холма тысячи сторонников первыми услышали новость от Питера Костелло о том, что первый законопроект о признании брака был принят почти единогласно. Этот межпартийный законопроект был принят после общенационального почтового опроса, который придал реформе беспрецедентный импульс. \n\nПредставленная коалицией, которая ранее признавала только концепцию традиционного брака, и поддержанная почти всеми членами лейбористской партии и «зеленых», эта отмена стала шоком для многих из собравшихся, которые отреагировали на нее смесью слез и радости. Костелло отметил, что этот акт был не просто шагом к правам геев, но и \"права всех австралийцев,\" и что в будущем двери открыты для реформ. Хотя парам по-прежнему придется вступать в брак за пределами страны, те, кто уже состоит в браке, теперь смогут юридически оформить свои отношения."
 civil_partnership_act.1.a: "Молодцы!"
 the_national_apology.1.t: "Национальное извинение"
 the_national_apology.1.d: "После того, что поначалу казалось затягиванием, Джон Ховард принес официальные национальные «извинения» за исторические несправедливости по отношению к коренному населению страны: аборигенам и жителям островов Торресова пролива. \nЭтот исторический жест, основанный на докладе «Возвращение домой» 1997 года, был представлен в здании парламента. [GetASTLeaderTitle]Это событие вызвало эмоциональный шок по всей Австралии. Толпы людей в Большом зале и на лужайках перед зданием парламента приветствовали и аплодировали. Несколько тысяч человек собрались под дождем, чтобы посмотреть на знаменательную речь на улицах Сиднея. Общество ощутило глубокое облегчение и примирение, и многие из него считают усилия коалиции по примирению бесспорным успехом."
 the_national_apology.1.a: "Пора двигаться вперед."
 pacific_solution.1.t: "Тихоокеанское решение"
 pacific_solution.1.d: "Правительство Австралии обратилось к нам с предложением относительно размещения морских перерабатывающих предприятий. В обмен на предоставление площадки для этих работ оно предложило значительно модернизировать нашу местную инфраструктуру и военно-морские портовые сооружения для поддержки этих операций."
 pacific_solution.1.a: "Примите австралийские инвестиции."
 pacific_solution.1.b: "Наш суверенитет не продаётся."
 pacific_solution.3.t: "Папуа-Новая Гвинея принимает"
 pacific_solution.3.d: "К счастью, правительство Папуа-Новой Гвинеи согласилось с нашим предложением. Строительство новых перерабатывающих предприятий начнется в ближайшее время."
 pacific_solution.3.a: "Как и ожидалось."
 pacific_solution.4.t: "Папуа-Новая Гвинея сокращается"
 pacific_solution.4.d: "Наши соседи отклонили это предложение, сославшись на опасения по поводу суверенитета и противодействие со стороны местного населения. Нам придётся найти другой выход."
 pacific_solution.4.a: "Разочаровывает."
 pacific_solution.5.t: "Науру принимает"
 pacific_solution.5.d: "Региональное правительство Науру приняло наше предложение. Еще один этап наших операций в Тихоокеанском регионе прошел без сучка и задоринки."
 pacific_solution.5.a: "Как и ожидалось"
 pacific_solution.6.t: "Решение Pacific Solution отклонено."
 pacific_solution.6.d: "Науру отклонило это предложение. Похоже, они не окажут нам никакой помощи в решении иммиграционных проблем и вместо этого смирились с сохранением изоляции в Тихом океане."
 pacific_solution.6.a: "Это катастрофа..."
 stomp_out_the_roots.1.t: "Австралия предлагает сотрудничество в борьбе с терроризмом."
 stomp_out_the_roots.1.d: "Правительство Австралии предложило совместную инициативу в области безопасности, направленную на противодействие и ликвидацию экстремистских ячеек внутри страны. Они предлагают обширную тактическую поддержку и обмен разведывательной информацией."
 stomp_out_the_roots.1.a: "Сотрудничайте ради более безопасной Индонезии."
 stomp_out_the_roots.1.b: "Мы можем обеспечить собственную внутреннюю безопасность."
 stomp_out_the_roots.2.t: "Индонезия соглашается на сотрудничество."
 stomp_out_the_roots.2.d: "Джакарта официально приняла наше предложение. Наши операции на их территории могут начаться немедленно, и наши разведывательные службы уже занимаются переброской войск."
 stomp_out_the_roots.2.a: "Начало прочного партнерства."
 stomp_out_the_roots.3.t: "Джакарта отклонила совместную инициативу"
 stomp_out_the_roots.3.d: "Правительство Индонезии отклонило наше предложение о военном сотрудничестве, предпочтя решать эти вопросы самостоятельно."
 stomp_out_the_roots.3.a: "Это их потеря."
 state_visit: "Государственный визит"
 ast_off_to_delhi.1.t: "Поездка в Индию"
 ast_off_to_delhi.1.d: "После того, как Говард сошел с самолета, до трибуны все шли с улыбками и рукопожатиями. После обретения независимости мы поддерживали между собой прохладные отношения. Достаточно прохладные, чтобы не обидеть. Теперь же мы встречались уже в четвертый раз за этот месяц. Местные СМИ с удовольствием демонстрировали привлекательность Индии для иностранных лидеров и не теряли времени, критикуя Говарда за его политику внутри страны. Но этого было недостаточно, чтобы оттолкнуть правительство. Мы экспортировали уран в больших объемах, чем любая другая соседняя страна, а они улыбались и кивали, обещая отсутствие обогащения, в то время как мы улыбались в ответ. В конце концов, это был еще один «удар» для Австралии. Именно мы пожинаем плоды, и каждое рукопожатие приближало нас к тому, чтобы стать крупнейшим экспортером в Тихоокеанском регионе."
 ast_off_to_delhi.1.a: "Взаимовыгодное решение для обеих стран."
 ast_trade_deal: "Крупное торговое соглашение"
 ast_trade_agreement: "торговое соглашение"
 refused_trade_deal: "Отклонили наше торговое соглашение"
 marks_trade.1.t: "Торговые предложения со стороны Австралии"
 marks_trade.1.d: "Стремясь укрепить региональные экономические связи, правительство Австралии выступило с предложением о заключении соглашения о «беспошлинной» торговле. Предложение включает в себя смягчение ограничений на импорт нашей электроники в обмен на исключительные права на добычу полезных ископаемых. Обе наши страны получат значительную выгоду от увеличения товарооборота между нами, однако выбор остается за нами."
 marks_trade.1.a: "Нас ждет плодотворное партнерство."
 marks_trade.1.b: "Наши рынки должны оставаться под защитой."
 ast_our_capacity_for_peace.1.t: "Австралия предлагает инициативу по поддержанию мира."
 ast_our_capacity_for_peace.1.d: "Стремясь обеспечить стабильность в Тихоокеанском регионе, правительство в Канберре обратилось к нам с планом совместных миротворческих операций. Это предложение фактически станет основой для военного сотрудничества между нами, в частности, в борьбе с терроризмом. Предложение также включает в себя планы по обмену разведывательной информацией в будущем. Мы можем принять это предложение сейчас и смириться с любыми изменениями, которые они предложат в дальнейшем, или же можем полностью от него отказаться."
 ast_our_capacity_for_peace.1.a: "Мир — единственный путь вперед."
 ast_our_capacity_for_peace.1.b: "Мы сами решаем, как обеспечить безопасность в Тихом океане."
 ast_our_capacity_for_peace.2.t: "Соглашение достигнуто."
 ast_our_capacity_for_peace.2.d: "Пекин положительно отреагировал на наше предложение. Наша миротворческая инициатива официально запущена, и они пообещали вскоре присоединиться к нам для закрепления достигнутых результатов."
 ast_our_capacity_for_peace.2.a: "Мы будем внимательно за ними следить."
 ast_our_capacity_for_peace.3.t: "Предложение отклонено."
 ast_our_capacity_for_peace.3.d: "Наши предложения о заключении взаимного миротворческого соглашения были встречены правительством в Пекине холодным безразличием. Их дипломаты ответили обеспокоенностью по поводу собственного суверенитета в Тихом океане."
 ast_our_capacity_for_peace.3.a: "Тогда мы останемся одни."
 fossil_fuels.1.t: "Ископаемое топливо за юань"
 fossil_fuels.1.d: "Австралия предложила масштабное расширение экспорта угля для обеспечения энергией растущих промышленных секторов. В обмен на выгодные валютные курсы она готова стать нашим основным энергетическим партнером."
 fossil_fuels.1.a: "Промышленным двигателям необходимо топливо."
 fossil_fuels.1.b: "Мы обеспечим доставку угля своим собственным способом."
 fossil_fuels.2.t: "Ископаемое топливо за юань"
 fossil_fuels.2.d: "Опираясь на нашу существующую инициативу по поддержанию мира, Австралия предложила всеобъемлющее торговое соглашение. Обеспечивая безопасность наших энергоснабжающих сетей посредством программы «Ископаемое топливо за юань», мы еще больше укрепляем нашу энергетическую безопасность и поставки."
 fossil_fuels.2.a: "Наше партнерство становится еще крепче."
 fossil_fuels.2.b: "Их сотрудничества будет достаточно."
 fossil_fuels.3.t: "Подписано соглашение по углю"
 fossil_fuels.3.d: "Правительство Китая неохотно соглашается на какие-либо долгосрочные обязательства в отношении ископаемого топлива. На данный момент оно приняло скромное предложение об экспорте для пополнения своих запасов. Наш горнодобывающий сектор уже готовится к заключению соглашения."
 fossil_fuels.3.a: "Отличный."
 fossil_fuels.4.t: "Предложение по использованию ископаемого топлива отклонено."
 fossil_fuels.4.d: "Китай отклонил все наши предложения по расширению экспорта угля, сославшись на стремление к энергетической независимости."
 fossil_fuels.4.a: "Упущенная возможность."
 fossil_fuels.5.t: "Китайское контрпредложение"
 fossil_fuels.5.d: "К нашему удивлению, получив наше предложение о расширении экспорта угля, китайские делегаты ответили своим собственным предложением. Речь шла о приоритетном торговом соглашении, охватывающем широкий спектр китайской электроники и товаров, в обмен на практически беспошлинную торговлю нашим углем и другими минеральными ресурсами. Результат оказался для нас как нельзя лучше. Руководители наших предприятий сейчас прилагают все усилия, чтобы обеспечить экспорт, пока действует соглашение."
 fossil_fuels.5.a: "Наша полоса удачи продолжается."
 ast_jap_trade.1.t: "Торговые переговоры с Австралией"
 ast_jap_trade.1.d: "Несколько недель переговоров с австралийцами привели к созданию первого варианта всеобъемлющего торгового соглашения. Конкретные условия включают экспорт огромных объемов сельскохозяйственной продукции в нашу страну в обмен на снижение пошлин на нашу электронику и автомобили. Это могло бы обеспечить стабильное снабжение продовольствием, но мы могли бы воспользоваться этой возможностью, чтобы добиться большего."
 ast_jap_trade.1.a: "Примите предложенные условия."
 ast_jap_trade.1.b: "Требуют приоритетного права на свои ценные полезные ископаемые."
 ast_jap_trade.1.c: "Условия невыгодны."
 ast_jap_trade.2.t: "Подписано торговое соглашение с Японией."
 ast_jap_trade.2.d: "Делегация в Токио сообщила об успешном завершении переговоров. Это первый случай, когда Япония заключила всеобъемлющее соглашение об экономическом партнерстве или соглашение о свободной торговле с крупной экономикой, не говоря уже о нас. Это знаменует собой серьезный поворот в наших отношениях и может стать основой для укрепления связей на долгие годы вперед."
 ast_jap_trade.2.a: "За это и выпьем!"
 ast_jap_trade.3.t: "Япония требует права на добычу полезных ископаемых."
 ast_jap_trade.3.d: "Переговоры приняли неожиданный оборот. Теперь они требуют приоритетного доступа к нашим ценным месторождениям полезных ископаемых для поддержки своей растущей технологической отрасли и компенсации затрат на снижение тарифов. Это создаст серьезную нагрузку на наши собственные внутренние ресурсы и сделает сделку в целом менее выгодной. Мы могли бы заставить их вернуться к первоначальному соглашению, но это может поставить под угрозу сами переговоры."
 ast_jap_trade.3.a: "Согласиться с их новыми условиями и заключить сделку."
 ast_jap_trade.3.b: "Мы будем стоять на своем. Требуем первоначального соглашения."
 ast_jap_trade.4.t: "Торговое предложение отклонено"
 ast_jap_trade.4.d: "Делегация в Токио сообщила, что переговоры провалились. Похоже, они покинули зал заседаний, даже не намекнув на дальнейшее обсуждение. Наши планы по достижению соглашения, по сути, зашли в тупик. Хотя это серьезно ограничивает наши торговые планы, возможно, существуют и другие пути, которые мы можем рассмотреть."
 ast_jap_trade.4.a: "Неудача для нашего настоящего"
 ast_jap_trade.5.t: "Австралия твердо стоит на своем."
 ast_jap_trade.5.d: "Делегаты из Канберры твердо придерживаются первоначального предложения, отказываясь от любых переговоров по правам на добычу полезных ископаемых. Они ясно дали понять, что соглашение о поставках сельскохозяйственной продукции в обмен на снижение тарифов является окончательным."
 ast_jap_trade.5.a: "Возможно, мы были опрометчивы."
 ast_jap_trade.5.b: "В таком случае сделка не состоится."
 base_state_visit.1.t: "Посещение Соединенных Штатов"
 base_state_visit.1.d: "Говард уже посещал Белый дом в 1999 году во время обсуждения тарифов. Тогда шел дождь, и, словно символично, дождь пошел снова. После встречи с президентом он прошел через главные двери к группе репортеров с зонтами. В США все было большим. Их магазины были большими, их церкви были большими. Резиденция президента была особенно большой. В Австралии не было ничего сопоставимого по размерам, и уж точно не такого грандиозного. Можно сказать, что они что-то компенсировали, но на самом деле у них было все, и в конце концов нам придется сесть за стол переговоров, чтобы получить свою долю. Будь то гарантии в области обороны в Тихом океане или закупки в сфере торговли, Австралии придется доказать, что она является ценным партнером. Как и во Вьетнаме и Корее, мы будем присутствовать и в следующей войне."
 base_state_visit.1.a: "Для нашего душевного спокойствия."
 base_state_visit.2.t: "Поездка в Китай"
 base_state_visit.2.d: "Когда Говард приземлился в Пекине, первым его встретил премьер-министр Китая. Пройдя мимо собравшихся вокруг них китайских журналистов, премьер-министр проводил их в огороженный неподалеку ресторан, чтобы обсудить варианты торговых отношений. Китай был очень заинтересованным партнером для переговоров, но всегда существовали оговорки. Говард не забывал о реальности их авторитаризма, и в каждой дискуссии было очевидно, что китайцы чувствовали себя так, будто одерживают верх. Переговоры с ними превратились в тонкий танец: нужно было наметить будущее, которого хочет Австралия, и каким-то образом согласовать его со своим. Необходимо было разыграть все карты до следующих торговых переговоров, чтобы сохранить справедливые условия. Когда они оба встали, чтобы уйти, Говард был уверен, что сыграл достаточно хорошо."
 base_state_visit.2.a: "И всё было готово."
 base_state_visit.3.t: "Нормализация отношений с Северной Кореей"
 base_state_visit.3.d: "Переговоры с Северной Кореей были уникальны тем, что подготовительная работа с этой страной не велась уже несколько десятилетий, и Говард, по сути, ступал на неизведанную территорию. Хуже того, между ними существовала разобщенность. Каждое взаимодействие осуществлялось косвенно через наши связи в Китае, который затем передавал информацию корейцам. Никогда не ожидалось личных переговоров, но тот факт, что сам Говард никогда не общался с реальным представителем, придавал всему происходящему странный оттенок. В конце концов, они договорились об открытии посольства в Канберре, что с самого начала вызывало у Говарда дискомфорт, но если они когда-либо хотели продолжить переговоры, это нужно было сделать."
 base_state_visit.3.a: "Лучше, чем ничего."
 base_state_visit.4.t: "Визит из Южной Кореи"
 base_state_visit.4.d: "Президент Южной Кореи прибыл в Канберру рано утром с очень конкретной целью. Австралия прибыла вместе с американцами, когда началась Корейская война. С тех пор мы были очевидным выбором для обеспечения обороноспособности в Тихом океане, и пока у их северного соседа было ядерное оружие, мы оставались таковыми. И вот этот вопрос был поднят. Президент вежливо ответил, но в конце концов нам нужно было что-то закрепить. Прогуливаясь по Ботаническому саду, [KOR.GetLeader] говорил о продолжающихся экономических проблемах и о том, как зашли в тупик переговоры с Северной Кореей. Тем временем будет достигнуто соглашение о торговом соглашении, но ничего больше не было обещано."
 base_state_visit.4.a: "Пока что придётся довольствоваться этим."
 base_state_visit.5.t: "Церемония в Галлиполи"
 base_state_visit.5.d: "Народ Турции всегда с пониманием относился к традиции АНЗАК. Полагаю, это легко, когда ты в тот день одержал победу, но они проявили достаточно понимания, чтобы каждый год выделять для нас место, где мы можем почтить память погибших. Большинство воспринимают эту церемонию как момент скорби или как символ бессмысленности войны и тому подобное. Мало кто считает этот день ошибкой международных союзов и полагает, что без того, чтобы британцы высадили нас на полуострове, несколько сотен тысяч человек могли бы и не погибнуть в тот день. Наши предыдущие лидеры так считали, когда мы перешли от Англии к Америке, и с тех пор акцент на союзах прочно укоренился в политике каждой партии. К счастью, Турция осталась верным другом."
 base_state_visit.5.a: "Да не забудем мы."
 base_state_visit.6.t: "Визиты монархии"
 base_state_visit.6.d: "Ее Величество королева Елизавета II в сопровождении Его Королевского Высочества герцога Эдинбургского прибыла в Австралию в рамках празднования своего золотого юбилея. \n\nКоролевская чета прибыла в Аделаиду ​​27 февраля 2002 года и посетит несколько городов, включая Кэрнс и Канберру, в рамках встречи глав правительств стран Содружества.  \n\nТолпы людей, размахивающих британским флагом «Юнион Джек», приветствовали королеву с общественной галереи, созданной специально к ее 13-му визиту, и выстроились вдоль 8-километрового маршрута от аэропорта до Адмиралтейского дома. [GetASTLeaderTitle] Ожидается, что ее вскоре примут в свои ряды, и вполне возможно, что в списке тем будет обсуждаться провалившийся республиканский референдум."
 base_state_visit.6.a: "Давайте будем вести себя цивилизованно."
 rudd_state_visit.1.t: "Поездка в Россию"
 rudd_state_visit.1.d: "На земле было мало стран, превосходящих Австралию по географической величине. Российская Федерация, безусловно, была одной из них. Говард не был готов к холоду, когда сошел с трапа самолета. После двух дней в стране он все еще чувствовал себя опустошенным, когда выходил на улицу и ощущал ледяной ветер. Несколько человек собрались у отеля с австралийскими и российскими флагами, что вселяло уверенность. Кевин Радд организовал эту встречу, и Говард чувствовал себя брошенным в омут с головой. Действительно ли борьба с медведем – правильный путь? Они все еще приходили в себя после экономического шока 90-х. Теоретически российский президент искал бы любую торговую помощь, чтобы удержать страну на плаву, но Говард с момента своего приезда едва ли чувствовал себя желанным гостем. Ему предстояло убедить их в том, что австралийский уран стоит того, чтобы за него вести переговоры."
 rudd_state_visit.1.a: "Начало чего-то..."
 leaked_memo.1.t: "Утекшая записка"
 leaked_memo.1.d: "Каким-то образом одному из журналистов попалось письмо одного из членов нашей партии, Шейна Стоуна, в котором содержался ряд резких критических замечаний в адрес нашего правительства. Газета The Guardian уже вовсю использует эту фразу. \"Злой и хитрый Говард\" В качестве заголовка. Не знаю, как это просочилось, но СМИ устроили из этого цирк, и теперь нам приходится наверстывать упущенное, чтобы скрыть свои расходы. Некоторые члены партии, включая Питера, требуют, чтобы мы политически повесили Стоуна, как в какой-то отчаянной охоте на мафию. Пока новости об этом не утихнут, мы ничего не можем сделать, и это сильно замедляет наш прогресс в борьбе за перемены. В любом случае, я не могу представить, чтобы стало еще хуже."
 leaked_memo.1.a: "Возможно ли это?"
 reconciliation_journey.1.t: "Путь к примирению"
 reconciliation_journey.1.d: "Говард и команда журналистов медленно вошли в небольшую комнату, где их ждал один из членов совета из числа коренного населения. Они подписали еще несколько бумаг, а затем позировали перед камерами. Когда член совета повернулся и пожал руку Говарду, [GetASTLeaderTitle] Говард заметил, какие у него были твердые руки, покрытые мозолями и костлявые. Лицо тоже казалось суровым, но глаза были влажными. Говард видел на лице этого человека годы лишений и надеялся, что тот сейчас держится. Осторожно, чтобы не проиграть. \"Спасибо, мистер Ховард.\" сказал он перед тем, как уйти вместе с журналистами. \n\nТеперь он был один и на мгновение задумался. Он неоднократно менял свою позицию по вопросу примирения, и всё же, казалось, стране от этого стало лучше. После всего, что он сделал, Австралия, постепенно, наконец, двигалась вперёд. Его охватило чувство удовлетворения, когда он стоял там в тишине. Вскоре вошли ещё несколько представителей СМИ, и день продолжился как обычно."
 reconciliation_journey.1.a: "Предстоит еще многое сделать."
 ast_the_coalition_convention.1.t: "Коалиционная конвенция"
 ast_the_coalition_convention.1.d: "\"Мы многого добились, мы победили сопротивление. Австралия гордо и уверенно стоит во всем мире. Нас уважают за достижения в экономике, и нас воспринимают как нацию, готовую занять твердую позицию по международным вопросам. Многие политические программы коалиции объединяет одна золотая нить – это великий принцип выбора. Больший выбор для всех австралийцев в отношении своего будущего. Наша страна свободнее, чем когда-либо. Ее жители зарабатывают больше, покупают больше и живут с большей гордостью.\" \n\n\"Предстоящие перед нами задачи столь же масштабны, как и в 1996 году, когда мы пытались вернуться к власти, и столь же масштабны, как и на следующих выборах. Тем временем многое можно сделать для дальнейшего улучшения состояния наших расходов и роста экономики. Многие сторонники ожидают новых политических мер, направленных на улучшение их жизни и жизни многих других людей как в Австралии, так и за её пределами. Наша ответственность лежит в основе наших моральных принципов. Мы – нация, которая стремится дать каждому «равные возможности». Каждый из нас осознаёт свою ответственность за лидерство. Эта ответственность не утратила своей актуальности.\""
 ast_the_coalition_convention.1.a: "Испытание еще не окончено."
 the_white_paper.1.t: "Реализация Белой книги"
 the_white_paper.1.d: "Документ «Оборона 2000» был подготовлен как всесторонний обзор наших нынешних военных возможностей, а также тех, которые требуются нынешней администрации. В связи с усилением обороноспособности Австралии как крупного поставщика услуг в сфере безопасности и миротворчества в Тихоокеанском регионе, основные требования сводятся к расширению. Причем речь идет не только о кадровом составе. Командование, технологии, производство вооружений – все это нуждается в улучшении или расширении. К счастью, у нас есть ряд программ, находящихся в разработке, которые могут помочь нам в этом."
 the_white_paper.1.a: "Наше производство имеет первостепенное значение."
 the_white_paper.1.b: "Мы не можем воевать без наших сил."
 the_white_paper.1.c: "Они справятся со спросом."
 the_white_paper.2.t: "Реализация второго Белого документа"
 the_white_paper.2.d: "Независимо от того, добиваемся мы успеха или нет, перед нами снова стоит задача начать реструктуризацию с определением первоначальной цели. Первое предложение — пересмотр методов передвижения полевых подразделений для повышения их эффективности. Также были предложены изменения в нашей политике пополнения личного состава. В противном случае мы могли бы обратиться к высшему командованию с просьбой ускорить текущие исследования наших доктрин."
 the_white_paper.2.a: "Движение станет для нас ключом к успеху."
 the_white_paper.2.b: "Подкрепление всегда необходимо."
 the_white_paper.2.c: "Придётся начинать всё сначала."
 lithgow_arms.1.t: "Распродажа стрелкового оружия в Литгоу"
 lithgow_arms.1.d: "Компания Thales предложила определенную сумму за покупку и реконструкцию старого завода для использования в наших производственных целях. Они и раньше надежно сотрудничали с нами в производстве оружия, а завод находится в довольно плачевном состоянии. Вложить в него новую жизнь было бы лучшим решением. Однако мы могли бы отремонтировать здание и сами."
 lithgow_arms.1.a: "Продайте это."
 lithgow_arms.1.b: "Мы можем это исправить."
 governor_general_sacked.1.t: "Генерал-губернатор уволен"
 governor_general_sacked.1.d: "Возможно, впервые в истории Австралии генерал-губернатор был отстранен от должности самой королевой Елизаветой. Эта неожиданная новость появилась после серии переговоров между корреспондентами британского правительства и премьер-министром, и, независимо от того, было ли это преднамеренно или нет, похоже, привела к отстранению. Как это повлияет на текущую политику нынешнего правительства, пока неясно, но это стало шоком для многих сторонников королевской семьи в стране. Представители либерального правительства пока не прокомментировали увольнение."
 governor_general_sacked.1.a: "Скатертью дорога."
 solomon_islands_intervention.1.t: "Крах Соломоновых островов"
 solomon_islands_intervention.1.d: "После серии восстаний боевиков и провалившихся попыток разоружения правительство на Соломоновых островах фактически рухнуло, оставив после себя состояние беззакония. Сейчас между враждующими группировками происходят масштабные бои из-за этнической напряженности, а государственные службы полностью разрушены, что делает многих уязвимыми перед насилием и приводит к растущему гуманитарному кризису. Премьер-министр Аллан Кемакеза официально обратился к соседним странам с отчаянной просьбой о помощи несостоявшемуся государству, на что австралийское правительство пока не прокомментировало никаких мер. Без каких-либо изменений ситуация на островах, как ожидается, только ухудшится."
 solomon_islands_intervention.1.a: "Тревожное развитие событий."
 solomon_islands_intervention.2.t: "Вмешательство Соломоновых островов"
 solomon_islands_intervention.2.d: "С момента терактов на Бали все в сенате очень остро реагируют на тему терроризма. Сейчас ситуация на Соломоновых островах только усугубляет положение. Весьма вероятно, что чем хуже станет ситуация, тем больше угроз может перекинуться на наши воды и создать новую благодатную почву для тех, кто занимается изготовлением бомб. Премьер-министр Соломоновых островов уже обратился к нам с просьбой о вмешательстве, и если мы вынесем этот вопрос на голосование, результат будет практически единогласным. У нас есть моральный долг, но вмешательство может затянуть нас в трясину, худшую, чем когда-либо прежде, и это может только ухудшить положение. В любом случае, как мы будем действовать в этой ситуации, будет непросто."
 solomon_islands_intervention.2.a: "Нам необходимо вмешаться."
 solomon_islands_intervention.2.b: "Это не наш конфликт."
 sol_intervention_tt: "§2Решения о вмешательстве в ситуацию на Соломоновых островах будут разблокированы.§!"
 sol_intervention_failure_tt: "§RСитуация будет только ухудшаться...§!"
 solomon_islands_intervention.3.t: "Вмешательство прошло успешно."
 solomon_islands_intervention.3.d: "На данный момент ситуация на местах улучшилась: магазины начинают открываться, дороги очищены от боевиков, и начались восстановительные работы. Нашим войскам придется оставаться в стране еще несколько лет, но мы можем с облегчением отметить, что страна стабилизируется и, будем надеяться, начинает восстанавливаться. Правительство Соломоновых островов в долгу перед нами и продолжит тесно сотрудничать с организацией временного государства. Между тем, международная реакция на наши усилия исключительно позитивна. Мы продолжаем пожинать плоды в позитивном ключе, в то время как наша безопасность в Тихоокеанском регионе укрепляется."
 solomon_islands_intervention.3.a: "Работа выполнена на отлично."
 solomon_islands_intervention.4.t: "Нация без надежды"
 solomon_islands_intervention.4.d: "Ситуация на Соломоновых островах только ухудшилась во время нашей интервенции и стала настолько нестабильной, что мы были вынуждены компенсировать потери и прекратить интервенцию. Боевики продолжают сражаться на улицах, а оставшееся правительство практически распущено. Международная реакция была сдержанным шоком: оставшиеся страны, участвовавшие в интервенции, также прекратили свои усилия. Для тех, кто сейчас находится на островах, надежды почти не осталось."
 solomon_islands_intervention.4.a: "Какая катастрофа..."
 solomon_islands_intervention.6.t: "Военачальник захватил власть на Соломоновых островах."
 solomon_islands_intervention.6.d: "Вчера поздно вечером Джимми Лусибаэа, лидер печально известной воинствующей группировки «Орлиные силы Малаиты», ворвался в здание парламента и провозгласил себя временным лидером. После нескольких месяцев боев на Гуадалканале между последними остатками государственной полиции и силами Лусибаэа было достигнуто соглашение о прекращении огня, позволившее группировке проникнуть в столицу, что и привело к государственному перевороту. После фактического краха правительства несколькими месяцами ранее и установления беззакония на островах, паралич правительства стал благодатной почвой для боевых действий боевиков и спровоцировал миграционный кризис в регионе. Лидер повстанцев утверждает, что новое правительство будет работать над прекращением нынешнего кризиса и возвращением на главный остров жителей Малаиты, которые были вынуждены бежать в предыдущие годы."
 solomon_islands_intervention.6.a: "Над островами спускается тьма."
 walk_for_reconciliation.1.t: "Марш за примирение"
 walk_for_reconciliation.1.d: "Сегодня более 250 000 протестующих, как коренных жителей, так и некоренных, прошли маршем по Сиднейскому мосту через гавань, выразив публичную поддержку примирению. Эта политическая демонстрация, продолжавшаяся почти шесть часов, стала самой масштабной в истории Австралии. Одна из организаторов, Эвелин Скотт, признала, что количество участников было намного больше, чем ожидалось, и выразила надежду, что администрация не пропустит этот акт, поскольку, похоже, она не соответствует общественным настроениям в отношении примирения. Во время демонстрации участники марша приветствовали летящую фигуру, написавшую в небе над гаванью слово \"sorry\". По словам организатора, планируются новые марши в продолжение успеха этой акции."
 walk_for_reconciliation.1.a: "Они имеют на это право."
 sydney_olympic_games.1.t: "Начало Олимпийских игр в Сиднее"
 sydney_olympic_games.1.d: "В Сиднее, Австралия, официально стартовали летние Олимпийские игры. Трансляция Игр, ставшая самой масштабной в истории Олимпийских игр, велась в 220 странах и территориях. На церемонии открытия факел передала спринтер Кэти Фриман, которая также завоевала 100-ю золотую медаль для страны в финале забега на 400 метров. В соревнованиях принимают участие 199 стран, включая Северную Корею, представители которой прошли вместе с Южной Кореей под единым флагом, символизируя свое единство впервые за полвека. Ожидается, что соревнования продлятся еще две недели, в течение которых страны-участницы будут соревноваться друг с другом."
 sydney_olympic_games.1.a: "Потрясающее зрелище."
 shell_takeover.1.t: "Поглощение компанией Shell компании Woodside Petroleum"
 shell_takeover.1.d: "До нас дошла информация о том, что компания Royal Dutch Shell пытается приобрести Woodside Petroleum за 10 миллиардов долларов. Обе компании поддерживали тесные отношения в течение последних нескольких лет, и Shell ясно дала понять, что ее техническая поддержка проекта North-West LG будет направлена ​​на более масштабное расширение объектов. Однако наш заместитель лидера и казначей партии Питер Костелло решительно выступает против этого шага и советует нам заблокировать сделку на том основании, что такая крупная компания, владеющая большей частью газовых проектов, противоречит нашим национальным интересам."
 shell_takeover.1.a: "Заблокируйте ставку."
 shell_takeover.1.b: "Допустить захват власти."
 tampa_affair.1.t: "Дело в Тампе"
 tampa_affair.1.d: "Новая политика правительства в отношении просителей убежища стала катализатором политического скандала, разразившегося после того, как норвежскому судну было отказано во входе в порт у берегов острова Рождества. Командир грузового судна MV Tampa, капитан Арне Риннан, спас сотни просителей убежища, находившихся вдали от дома, с индонезийского рыболовецкого судна и пытался доставить их в безопасное место в Австралию. Несмотря на плохое состояние здоровья 433 просителей убежища на борту Tampa, на судно поднялись бойцы спецназа SAS и получили приказ развернуться. Норвежское посольство отреагировало в основном негативно на изменение политики правительства Ховарда, направленную на привлечение к ответственности нелегальных иммигрантов. Насколько далеко может зайти эта политика, никто не знает."
 tampa_affair.1.a: "Неприятное обстоятельство."
 bali_bombings.1.t: "Теракты на Бали"
 bali_bombings.1.d: "Террор охватил индонезийский остров Бали: в результате взрыва трех бомб погибли около 202 человек, в том числе 88 австралийцев. Чувство мира и дистанции, царившее в стране во время роста террористической активности за рубежом, было внезапно разрушено прошлой ночью. Сообщается, что две бомбы были обнаружены в оживленных ночных местах, где австралийский туризм является обычным явлением, а третья взорвалась перед американским консульством в Денпасаре. Хотя связь с «Аль-Каидой» неясна, нападение, безусловно, было совершено в рамках террористического акта. Более 50 тел, накрытых белыми простынями, лежали на тротуаре некогда оживленной улицы на следующее утро. Это суровый сигнал о том, что Австралия больше не является сторонним наблюдателем в продолжающейся борьбе с терроризмом."
 bali_bombings.1.a: "О, Боже..."
 embassy_attacked.1.t: "Посольство Австралии подверглось нападению."
 embassy_attacked.1.d: "Поступают сообщения о том, что сегодня утром около 10 часов у одного из наших посольств в Индонезии произошел взрыв. К счастью, никто из наших сотрудников не погиб, но на данный момент 9 человек погибли и около 150 получили ранения в результате, предположительно, взрыва заминированного автомобиля. По всей видимости, это был теракт против нас, и мы пока не уверены, связан ли он с предыдущими взрывами на Бали, хотя это похожее нападение. Правительство Индонезии лично связалось с нами для организации расследования. Это может быть только началом новых целенаправленных атак."
 embassy_attacked.1.a: "Это превращается в кошмар."
 asian_earthquakes.1.t: "Индийская помощь"
 asian_earthquakes.1.d: "В настоящее время в результате землетрясений в Азии погибло более 11 000 человек. Тысячи домов и автомобилей были смыты цунами, обрушившимися на побережье, что привело к массовым отключениям связи в пострадавших регионах и невообразимым разрушениям дорог и железнодорожных путей. В частности, Индия пострадала сильнее всего, хотя масштабы ущерба пока неизвестны. Всемирный Красный Крест выступил с экстренным призывом о немедленной помощи пострадавшим странам. Мы могли бы воспользоваться этой возможностью, чтобы направить пакет поддержки Индии и укрепить наши существующие связи."
 asian_earthquakes.1.a: "Мы их поддержим."
 asian_earthquakes.1.b: "Они предоставлены сами себе."
 asian_earthquakes.2.t: "Австралия предлагает помощь"
 asian_earthquakes.2.d: "В ответ на землетрясения, затронувшие нас и остальную Азию в настоящее время, Канберра предложила нам пакет помощи для поддержки восстановления."
 asian_earthquakes.2.a: "Неожиданно, конечно, но приятно."
 cronulla_riots.1.t: "Расовые беспорядки в Кронулле"
 cronulla_riots.1.d: "В прибрежном пригороде Кронулла местные банды численностью до 200 человек вступили в столкновение с местной полицией возле мечети, что описывается как расовые беспорядки. Этому предшествовал ряд столкновений, одно из которых включало нападение около 5000 участников митинга на людей ближневосточной внешности. Бои распространились на другие районы Сиднея в результате серии актов мести со стороны членов мусульманской общины. В результате беспорядков пострадали более 30 человек, включая полицейских и медицинских работников, и было произведено 16 арестов. Многие религиозные группы открыто осудили нападения, и местная полиция сделала восстановление порядка приоритетной задачей, но высокая напряженность на улицах Сиднея сохраняется."
 cronulla_riots.1.a: "Полагаю, они имеют право жаловаться."
 cronulla_riots.1.b: "Примите жесткие меры в отношении них."
 rip_steve_irwin.1.t: "Смерть иконы"
 rip_steve_irwin.1.d: "Натуралист Стив Ирвин, получивший всемирную известность как телеведущий программы «Охотник на крокодилов», трагически погиб во время подводной съемки, когда скат пронзил ему грудь. Инцидент произошел во время съемок подводного документального фильма у берегов Порт-Дугласа. Съемочная группа попыталась доставить его к спасательному вертолету, но он скончался до прибытия парамедиков. Эта смерть стала шоком для многих австралийцев и поклонников по всему миру. \n\n\"Это ужасная потеря для туристической индустрии и для охраны природы. Все, кто встречал Стива, были впечатлены его энергией и энтузиазмом, он был настоящим австралийским хулиганом.\" Министр туризма Квинсленда Маргарет Кич пояснила: смерть национальной иконы вызвала глубокую скорбь даже у членов парламента, которые выразили соболезнования в ходе речами. [AST.GetLeader] и членов оппозиции."
 rip_steve_irwin.1.a: "Австралия потеряла замечательного и яркого сына."
 a_global_financial_crisis.1.t: "Глобальный финансовый кризис"
 a_global_financial_crisis.1.d: "Обвал американского рынка недвижимости и последующее закрытие банков добрались и до нас. Наш доллар уже стремительно обесценивается, а доверие потребителей резко упало. В ответ Резервный банк повышал и понижал процентную ставку, и десятки компаний закрываются на фоне рецессии. Если мы не возьмем ситуацию под контроль и не замедлим падение, уровень безработицы может резко возрасти, и мы можем столкнуться с депрессией, подобной которой мы не видели десятилетиями."
 a_global_financial_crisis.1.a: "Ситуация ухудшилась."
 rus_deal_ast.1.t: "Сделка от австралийцев"
 rus_deal_ast.1.d: "Канберра предложила нам торговое соглашение о выгодных правах на экспорт своих месторождений урана. Австралийцы настаивают на использовании минералов для энергетических проектов, а не для обогащения урана для производства оружия. Действительно, сделка хорошо бы подошла для обеспечения топливом наших реакторов, и мы всегда можем передумать позже. С другой стороны, доверяем ли мы им в вопросе поставок?"
 rus_deal_ast.1.a: "Очень хорошо."
 rus_deal_ast.1.b: "Нет, спасибо."
 rus_deal_ast.2.t: "Торговое соглашение с Россией"
 rus_deal_ast.2.d: "Москва согласилась на наше торговое соглашение. Мы будем поставлять им наш уран по справедливой цене, и рубли поступят в австралийскую казну. Они уже начали организовывать поставки через свое торговое представительство."
 rus_deal_ast.2.a: "Отличный."
 rus_deal_ast.3.t: "Торговое соглашение с Россией"
 rus_deal_ast.3.d: "Москва отказалась от нашего торгового соглашения и утверждает, что ее источники урана останутся более локализованными."
 rus_deal_ast.3.a: "Что ж, мы пытались."
 isr_ast_visit.1.t: "Поездка на Святую Землю"
 isr_ast_visit.1.d: "Говард питал симпатию к израильтянам. Их стойкость была во многом похожа на стойкость австралийцев, а их дипломаты были одними из лучших. Хотя они никогда не упускали случая рассказать о своем бедственном положении на Ближнем Востоке. Постоянно страдающая страна, тем не менее, их преданность ценностям демократии вызывала восхищение. Он стоял перед стеной, и Говарда охватила глубокая печаль. Должно быть, это был его третий визит в страну, но он впервые увидел Стену Плача. Эмоции от увиденного были почти ошеломляющими, и они переполняли его. Возможно, израильтяне всегда чувствовали то же самое. Такая потеря. Один из помощников спросил Говарда, хочет ли он прикоснуться к стене, как было принято. Без слов он кивнул, и они подошли к ней. Ему надели на голову тонкую круглую шляпу, и, прикоснувшись к стене, он почувствовал, как дух стены врывается в него."
 isr_ast_visit.1.a: "Библейский опыт."
 adf_acq_astuirement.1.t: "Претенденты на закупку вооружения Сил обороны Австралии"
 adf_acq_astuirement.1.d: "Наш выбор основного поставщика сократился до трех вариантов. Первый, и самый простой для обоснования, — это Соединенные Штаты. Они добились значительных успехов в разработке своих основных боевых винтовок, а их опыт за рубежом, а также наши общие обязательства в области обороны, делают их очевидным выбором на стратегическом уровне. Второй вариант — Германия. Если мы не выбираем Австрию, то можем выбрать и ее соседа. Heckler and Koch стали одними из лучших производителей винтовок в мире. Мы не ошибемся, выбрав их. И наконец, старая добрая Бельгия. Никто не станет преуменьшать значение серии FN, считая ее прекрасным образцом вооружения, а наши друзья из Великобритании разработали собственную линейку винтовок, отвечающую их потребностям. Мы легко можем сделать то же самое."
 adf_acq_astuirement.1.a: "Пусть американцы заткнутся."
 adf_acq_astuirement.1.b: "Выбирайте качество."
 adf_acq_astuirement.1.c: "Старый и проверенный временем"
 ast_high_speed_rail.1.t: "Проект высокоскоростной железной дороги столкнулся с задержками."
 ast_high_speed_rail.1.d: "Кажется, почти ожидаемо, что проект столкнулся с осложнениями. Маршрут к югу от Брисбена планируется проложить через длинный горный хребет. Оценки плотности горных пород оказались неточными, и текущие земляные работы обойдутся значительно дороже."
 ast_high_speed_rail.1.a: "Это было ожидаемо."
 ast_high_speed_rail.1.b: "Отменить проект."
 ast_high_speed_rail.2.t: "Проблемы с приобретением земли осложняют строительство высокоскоростной железной дороги."
 ast_high_speed_rail.2.d: "В пригородных районах, необходимых для прокладки железнодорожных путей, возникли новые проблемы. Ряд групп, выступающих против строительства (NIMBY — Not in My Backyard), противостоят предложенному проекту, и судебные разбирательства могут остановить его на неопределенный срок. Обход этого района будет означать отмену существующего маршрута и разработку нового."
 ast_high_speed_rail.2.a: "Что же такого сделали для нас противники строительства в своем районе?"
 ast_high_speed_rail.2.b: "Категорически нет."
 ast_high_speed_rail.3.t: "Затраты на ресурсы замедляют движение поездов."
 ast_high_speed_rail.3.d: "Очередная неудача для проекта высокоскоростной железной дороги. Ранее заключенные заказы на металл внезапно сорвались из-за резкого роста цен на сталь. Теперь поставщики запрашивают в три раза больше, чем раньше, что, учитывая первоначальную стоимость, составляет значительную часть всего бюджета."
 ast_high_speed_rail.3.a: "Сколько это стоило?"
 ast_high_speed_rail.3.b: "Скажите ему, что он спит."
 ast_high_speed_rail.4.t: "Пересмотр стоимости высокоскоростных железных дорог"
 ast_high_speed_rail.4.d: "После почти пяти лет строительства проекта первоначальное и дополнительное финансирование практически исчерпано. Учитывая рекордно высокие затраты на рабочую силу, разрешения и материалы, инвестиции в проект пересматриваются с целью включения еще 80 миллиардов долларов. Некоторые из проектировщиков убеждены, что свет в конце тоннеля есть, но после стольких неудач ничто в отношении проекта не гарантировано."
 ast_high_speed_rail.4.a: "Пожалуйста, пусть это закончится."
 ast_high_speed_rail.4.b: "Я больше на это не поведусь."
 ast_high_speed_rail.5.t: "Представлена ​​высокоскоростная железная дорога"
 ast_high_speed_rail.5.d: "После ряда задержек и увеличения бюджета сеть высокоскоростных железных дорог была торжественно открыта, и первый поезд отправился со станции Брисбен. Железнодорожная линия, которая позиционируется как самая современная, в настоящее время соединяет Брисбен и Мельбурн и, как утверждается, преодолевает это расстояние менее чем за 6 часов. Многие собрались вокруг станции, которая была перестроена для размещения новой железнодорожной линии, чтобы увидеть прибытие поезда. Этот проект, несомненно, представляет собой модернизацию страны за последние годы и, как ожидается, будет обслуживать более 200 000 пассажиров ежедневно, меняя способ передвижения многих австралийцев."
 ast_high_speed_rail.5.a: "Чудо инженерной мысли!"
 base_state_visit.7.t: "Путешествие в Индонезию"
 base_state_visit.7.d: "После взрывов ситуация была крайне напряженной, до такой степени, что Говард, едва сойдя с самолета, не мог сделать ни шага в любом направлении, не опасаясь, что за ним последует кордон войск. Индонезийцы старались сохранять видимость благополучия, но продолжающееся восстание в Ачехе бросалось в глаза. Премьер-министр Индонезии, казалось, был более чем рад обсудить текущие обязательства в области безопасности, несмотря на то, что переговоры по этому вопросу постоянно срывались. Отношения между нашими странами стали крайне непрочными, далекими от «кумбая» постколониальных лет, и трещины были очень заметны."
 base_state_visit.7.a: "До новых встреч."
 generic_bushfires_ast.1.t: "Масштабные лесные пожары в сельских районах Австралии"
 generic_bushfires_ast.1.d: "Необычно жаркое и сухое лето вызвало масштабные лесные пожары по всей Виктории. На данный момент сгорело более 1 миллиона гектаров земли, поскольку многие из более мелких пожаров объединились в районе Большого Водораздела. К счастью, пожары в основном локализованы в необитаемых горных хребтах и ​​национальных парках, хотя некоторые здания и скот все же были уничтожены. Пожарные продолжают успешно сдерживать распространение огня. Несмотря на это, дым в настоящее время вызывает сбои в работе аэропорта Мельбурна."
 generic_bushfires_ast.1.a: "Тревожно."
 papua_affair.1.t: "Дипломатические переговоры в шоке"
 papua_affair.1.d: "After a complication occurred at the Brisbane Airport where the prime minister of Papua New Guinea, [PAP.GetLeader], arrived for talks, it seems our negotiations may be going up in smoke. \n\nOne of the airport's staff requested the leader to remove their shoes during the security check, which was apparently a standard procedure, only the PM seems to have taken it as a humiliation. Their envoys are already packed up to leave on the plane and our diplomats are pleading with them to reconvene the talks. We'll have to personally step in if we want to salvage anything."
 papua_affair.1.a: "Попытаться что-нибудь раздобыть."
 papua_affair.1.b: "Пусть завидуют, нам всё равно."
 ast_howard_of_arabia.1.t: "Говард Аравийский"
 ast_howard_of_arabia.1.d: "Машина подпрыгнула на очередной глубокой выбоине, и Говард чуть не ударился головой о крышу джипа. Дипломат на переднем сиденье резко развернулся и начал быстро объяснять, как дорога здесь повреждена обломками падающих ракет в результате действия системы «Железный купол». Хотя Говард кивнул и согласился, что это лучше, чем альтернатива, он не мог не думать, что образ страны, который он создал в городе, не соответствует действительности. Казалось, ЦАХАЛ был повсюду, пока машина поворачивала к консульству, где Говард должен был произнести свою речь о региональной безопасности. Австралия уже ввела свои войска на Ближний Восток, и теперь собиралась разместить там постоянную базу, чтобы помочь израильтянам сдерживать ситуацию. Во многом, несмотря на западный подход, казалось, Израиль все еще оставался развивающейся страной без основы для мирного будущего. Даже их опасения по поводу иранского вторжения меркли по сравнению с разногласиями с их непосредственным соседом, палестинцами, и внезапно Говард начал переосмысливать все соглашение."
 ast_howard_of_arabia.1.a: "Наше будущее — с Израилем."
 ast_howard_of_arabia.1.b: "Пока ничего обещать не можем..."
 indonesian_ultimatum.1.t: "Австралийский ультиматум"
 indonesian_ultimatum.1.d: "Австралия категорически потребовала, чтобы мы передали провинцию Ачех их миротворцам, фактически позволив их силам оккупировать одну из наших территорий. Они утверждают, что это в конечном итоге приведет к независимости региона, свободного от повстанцев, но у нас нет возможности это гарантировать, и это все равно будет означать потерю нашей собственной земли. В случае отказа они угрожают нам санкциями."
 indonesian_ultimatum.1.a: "У нас нет выбора."
 indonesian_ultimatum.1.b: "Это возмутительно!"
 indonesian_ultimatum.2.t: "Индонезия соответствует требованиям"
 indonesian_ultimatum.2.d: "Джакарта согласилась с предложенными условиями и отказалась от территории Ачеха. Наши миротворцы скоро отправятся туда и восстановят порядок в провинции. Индонезийский народ скоро будет свободен от повстанческого движения."
 indonesian_ultimatum.2.a: "Мир восторжествовал!"
 indonesian_ultimatum.3.t: "Индонезийцы отвергли ультиматум."
 indonesian_ultimatum.3.d: "Джакарта отвергла наши условия и отказывается пустить наших миротворцев в Ачех. Они упорно клянутся подавить повстанческое движение самостоятельно."
 indonesian_ultimatum.3.a: "Пусть будет так."
 indonesian_ultimatum.4.t: "Австралийский ультиматум"
 indonesian_ultimatum.4.d: "Австралия категорически потребовала, чтобы мы передали провинцию Ачех их миротворцам, фактически позволив их силам оккупировать одну из наших территорий. Они утверждают, что это в конечном итоге приведет к независимости региона, свободного от повстанцев, но у нас нет возможности это гарантировать, и это все равно будет означать потерю нашей собственной земли. В случае отказа они угрожают нам санкциями."
 indonesian_ultimatum.4.a: "У нас нет выбора."
 indonesian_ultimatum.4.b: "Это возмутительно!"
 us_aus_trade_howrd.1.t: "Торговые переговоры с Австралией"
 us_aus_trade_howrd.1.d: "Правительство в Канберре обратилось к нам с предложением о приоритетной торговле правами на добычу полезных ископаемых в обмен на снижение нами пошлин на экспорт дорогостоящего оборудования в их регион. Потери доходов от пошлин будут незначительными, а права на добычу полезных ископаемых с лихвой компенсируют их."
 us_aus_trade_howrd.1.a: "Это выгодные условия."
 us_aus_trade_howrd.1.b: "Нет, спасибо."
 us_aus_trade_howrd.2.t: "Соединенные Штаты согласились на торговое соглашение."
 us_aus_trade_howrd.2.d: "Американцы без каких-либо разногласий согласились снизить пошлины на экспорт дорогостоящего оборудования в обмен на предоставление нами прав на добычу полезных ископаемых."
 us_aus_trade_howrd.2.a: "За нашу дружбу!"
 us_aus_trade_howrd.3.t: "Торговые переговоры с США зашли в тупик."
 us_aus_trade_howrd.3.d: "Похоже, все попытки продвинуться в торговых переговорах оказались безрезультатными. Американцы не идут на уступки в вопросе введения тарифов, и мы оказались в некотором роде в невыгодном положении."
 us_aus_trade_howrd.3.a: "Неожиданный спад."
 trip_to_malaysia_ast.1.t: "Визит из Малайзии"
 trip_to_malaysia_ast.1.d: "Министр торговли и промышленности Малайзии Рафида Азиз обратилась к нам с предложением о дополнении к нашему действующему договору об экспорте мяса. Новое соглашение предусматривает заключение контрактов на экспорт в обмен на смягчение некоторых налогов и правил. Это выгодное предложение, хотя требования могут содержать лазейку, которой они смогут воспользоваться в будущем. Тем не менее, оно по-прежнему обеспечивает нам выгодную цену на нашу продукцию."
 trip_to_malaysia_ast.1.a: "Конечно же, для наших друзей!"
 trip_to_malaysia_ast.1.b: "Не сегодня."
 internal_talk_liberal.1.t: "Конфликт между коллегами"
 internal_talk_liberal.1.d: "Говарду казалось, что у Питера Костелло, его верного заместителя по партии с первых выборов, всегда были к нему претензии. Казалось, они сталкивались при каждом удобном случае, но это не мешало им работать вместе на благо общества, и Питер частично отвечал за продолжающийся экономический подъем. Теперь они спорили о миграции. Питер был очень убежден в экономических преимуществах, но Говард, обеспокоенный «неопределенностью» мультикультурализма, оставался непреклонен в вопросе интеграции. Усиление пограничного контроля также имело бы преимущество в виде сокращения контрабанды людей, которая стала актуальной темой в новостях. Питер же утверждал, что эта идея обречена на провал и просто окажется пустой тратой бюджета. Между ними не было никакого согласия."
 internal_talk_liberal.1.a: "И все же решение нужно было принять."
 internal_talk_liberal.2.t: "Визит от Тони"
 internal_talk_liberal.2.d: "Говард был занят оформлением документов по изменению партийных правил, когда раздался стук в дверь. Он знал, что у него есть примерно два часа до следующего заседания, поэтому был удивлен, когда вошел министр здравоохранения Тони Эбботт. Человек, который прекрасно справлялся с управлением ведомством и борьбой с отдельными профсоюзными головорезами, представил Говарду дальнейшие изменения в системе медицинского страхования. Некоторые в партии склонны были называть Эбботта партийным фанатиком, но Говард не разделял этого мнения. Для него Эбботт казался преданным народу. Националист во всех смыслах этого слова. Без сомнения, у него были амбиции стать премьер-министром, но это никогда не мешало ему проявлять лояльность к Говарду, и между ними возникло взаимное уважение. Выйдя из комнаты, Говард вернулся к письму, и одна мысль задержалась в его голове. Возможно, после этих лет на посту он мог бы считать Тони хорошим другом."
 internal_talk_liberal.2.a: "Вернемся к делу."
 internal_talk_liberal.3.t: "Выбор преемника"
 internal_talk_liberal.3.d: "Когда дело дошло до выбора следующего лидера партии, Говард оказался на распутье. Казалось, его заклятым врагом в парламенте часто был его собственный заместитель, Питер Костелло. Они ссорились чаще, чем он с другими партиями. Питер всегда стремился занять эту должность, и ему не мешало хорошее положение в партии. Его видение экономически независимой Австралии действительно было интригующим, и с ним во главе партии он мог быть уверен, что она продолжит свою деятельность бесперебойно. Однако был и другой фактор. Тони Эбботт во многом был протеже Говарда, хотя и настаивал на том, чтобы Говард отработал еще один срок. Несмотря на то, что Эбботт считался в партии своего рода приспешником и немного списанным со счетов, Джон видел в этом человеке убежденность, которая почти напоминала ему самого себя. Эбботт представлял себе не просто независимую Австралию, но и более сильную. В преддверии следующих выборов это решение должно было либо возвысить, либо погубить партию."
 internal_talk_liberal.3.a: "Петр — естественный преемник."
 internal_talk_liberal.3.b: "У Тони есть все необходимое."
 internal_talk_liberal.3.c: "Подумав ещё раз..."
 internal_talk_liberal.4.t: "Говард подал в отставку с поста лидера."
 internal_talk_liberal.4.d: "\"Для меня было огромной привилегией каждый день моей жизни быть [GetASTLeaderTitle] Я хочу поблагодарить австралийский народ за предоставленную мне привилегию – лидерство в этой прекрасной стране. Я уважаю и чту это. После многих лет стремления руководить этой страной стало самым невероятным опытом в моей жизни.\" \n\n\"Я беру на себя полную ответственность за Либеральную партию, за наши успехи и немногочисленные поражения, и поэтому я ухожу с поста лидера партии. Я хочу поблагодарить жителей Беннелонга и народ Австралии за то, что они избрали меня представлять эту страну.\" \n\n\"Передавая бразды правления своему заместителю и казначею Питеру Костелло, я испытываю особую благодарность. Он был замечательным распорядителем австралийской экономики, и будущее нашей партии во многом связано с Питером. Он – наше будущее.\" \n\n\"Я желаю стране всего наилучшего, и я глубоко убежден, что лучшие годы Австралии еще впереди.\""
 internal_talk_liberal.4.a: "Навстречу новым горизонтам..."
 internal_talk_liberal.5.d: "\"Для меня было огромной честью каждый день моей жизни на протяжении последних лет быть [GetASTLeaderTitle] Я хочу поблагодарить австралийский народ за предоставленную мне привилегию – лидерство в этой прекрасной стране. Я уважаю и чту это. После многих лет стремления руководить этой страной стало самым невероятным опытом в моей жизни.\" \n\n\"Я беру на себя полную ответственность за Либеральную партию, за наши успехи и немногочисленные поражения, и поэтому я ухожу с поста лидера партии. Я хочу поблагодарить жителей Беннелонга и народ Австралии за то, что они избрали меня представлять эту страну.\" \n\n\"Передавая бразды правления следующему лидеру, моему собственному министру здравоохранения и гордому коллеге Тони Эбботу, я испытываю особую благодарность. Он был замечательным представителем интересов многих австралийцев, и будущее нашей партии во многом связано с Тони. Он – наше будущее.\" \n\n\"Я желаю стране всего наилучшего, и я глубоко убежден, что лучшие годы Австралии еще впереди.\""
 solomon_islands_intervention.5.t: "Уборка"
 solomon_islands_intervention.5.d: "Местные жители подошли к куче и сбросили на неё ещё одну партию оружия. В основном винтовки. В тот день другая группа ополченцев сдалась 3-й австралийской армии, и офицеры уводили их. Завтра инженерный полк прибудет, чтобы уничтожить их на глазах у толпы. Они сделают это на одном из ещё действующих стадионов в качестве публичной демонстрации восстановления порядка. Пришёл ли этот приказ из дома или нет, солдат Сил обороны Австралии не знал, но он продолжал наблюдать, как оружие накапливается. Десятки за раз, они лязгали друг о друга, и куча росла. Он и остальные члены роты около месяца выслеживали группу, которая их принесла, и они первыми сдались при виде оружия. Казалось, что всё подходит к концу, раньше, чем он ожидал. Бои утихали, но даже в соседнем городе почти не работало освещение, а больных эвакуировали с острова самолётами. Если местные жители собирались остаться, после прекращения стрельбы нужно было предпринять дополнительные меры. Радиостанция у него на плече заработала, и он двинулся дальше, в следующий город."
 solomon_islands_intervention.5.a: "Возвращаюсь к работе."
 a_global_financial_crisis.2.t: "Финансовые потрясения"
 a_global_financial_crisis.2.d: "В последние недели ряд средних предприятий, получивших кредиты, обанкротились и объявили о банкротстве. Удар по нашим показателям безработицы — один из негативных моментов, но затишье в этом вопросе вызывает некоторое беспокойство. Атмосфера экономического спада начинает беспокоить наших финансовых экспертов, которые просят нас быть готовыми к немедленным действиям в случае возникновения каких-либо проблем. Однако пока ничего не произошло, что ставит нас в неловкое положение ожидания."
 a_global_financial_crisis.2.a: "Не будем волноваться из-за пустяков."
 black_saturday_ast.1.t: "Чёрная суббота"
 black_saturday_ast.1.d: "За несколько дней в штате Виктория разрослись до сотен очагов возгорания, что было названо самым масштабным лесным пожаром за всю историю наблюдений. Тысячи пожарных по всей стране собрались в отчаянной попытке локализовать пожары, которые уже унесли жизни 25 человек. Жаркий, сухой воздух из Центральной Австралии создал идеальные условия для невероятно быстрого распространения огня. Уже уничтожены обширные участки домов и земли, что привело к введению чрезвычайного положения, и военнослужащие спешат эвакуироваться из районов, подверженных риску. Хотя мало что можно сделать, огонь стремительно распространяется по лесам штатов и национальным паркам, а высота пламени достигает 30 метров."
 black_saturday_ast.1.a: "Этот год просто не для нас."
 black_saturday_ast.2.t: "Пожары в штате Виктория продолжают бушевать."
 black_saturday_ast.2.d: "Небо над Викторией уже несколько недель остается черным, поскольку пожары не прекращаются, в результате чего число погибших достигло 173 человек. Линии контроля успешно замедляют распространение огня, хотя, по оценкам, сгорело около 400 000 гектаров, что привело к уничтожению местной дикой природы. Корреспондент [GetASTLeaderTitle] регулярно посещает пострадавших, которые, увидев масштабы разрушений, были явно расстроены и оказали поддержку тем, кто остался без крова. Их число, вероятно, исчисляется тысячами. Измученные пожарные продолжают свою работу, и ожидается, что на следующей неделе установится благоприятная погода. Самые мрачные дни для Виктории за последние десятилетия, возможно, постепенно подходят к концу, хотя и не без огромных потерь для страны."
 black_saturday_ast.2.a: "Трагедия, которую невозможно описать словами."
 ast_elections_howard_placeholders.1.t: "Неожиданная победа правительства Говарда"
 ast_elections_howard_placeholders.1.d: "Рост цен на топливо и резкая реакция на ряд политических решений Джона Ховарда не смогли помешать лидеру выиграть третий срок. Получив 82 места в Палате представителей, Либеральная партия, возможно, пережила самый быстрый поворот политической судьбы в истории страны. Между тем, правительство Кима Бисли получило наименьшее количество голосов на внутрипартийных выборах с 1934 года, и некоторые источники внутри Лейбористской партии утверждают, что лидер оппозиции, как ожидается, уйдет в отставку. В своей победной речи в отеле Wentworth в Сиднее Ховард поблагодарил своих сторонников, особенно представителей малого бизнеса, и изложил свои планы дальнейших реформ."
 ast_elections_howard_placeholders.1.a: "Это так просто!"
 ast_elections_howard_placeholders.2.t: "Правительство Говарда одержало победу на выборах и получило второй срок."
 ast_elections_howard_placeholders.2.d: "В то время как Марк Лэтэм изо всех сил пытался укрепить свои позиции в качестве нового лидера лейбористов, [AST.GetLeader] добился впечатляющих результатов, обеспечив коалиции еще один срок и большинство. Либералы значительно улучшили свои позиции в опросах после трагедии на Бали, что свидетельствует о предпочтении осторожного и стабильного управления. Успех политики Национальной партии в области управления водными ресурсами в сельской местности, направленной на борьбу с засухой тысячелетия, несомненно, также способствовал победе коалиции. Эта победа стала второй по продолжительности победой партии подряд. Лейбористская партия также добилась определенных успехов, вернув себе место у «зеленых» и несколько мест у Национальной партии. Хотя это, вероятно, приведет к новым переменам в партии."
 ast_elections_howard_placeholders.2.a: "Ещё три года!"
 election_outcomes_ast.1.t: "Историческая победа лейбористов Радда."
 election_outcomes_ast.1.d: "Лидер либералов [AST.GetLeader] Вчера вечером она была смещена с поста лидера, когда Кевин Радд привел Лейбористскую партию к убедительной победе, добившись роста поддержки на 5,7% по всей стране. Впервые в истории Австралии Лейбористская партия теперь контролирует власть во всех штатах и ​​территориях. Приход на пост заместителя лидера Джулии Гиллард также знаменует собой первый случай, когда женщина займет второй по значимости государственный пост в стране. \n\nЛидер коалиции уже подал в отставку, позвонив ночью Радду, чтобы поздравить его с победой. Новый лидер коалиции [GetASTLeaderTitle] В ходе своей победной речи он проводил кампанию, направленную на улучшение трудовых отношений, защиту прав коренного населения и принятие оперативных мер по борьбе с изменением климата, стремясь вывести страну на новый уровень, о чем он и упомянул: \"Сегодня выбор был предоставлен народу, и Австралия смотрит в будущее.\""
 election_outcomes_ast.1.a: "И будущее уже наступило."
 election_outcomes_ast.2.t: "Неожиданная победа коалиции"
 election_outcomes_ast.2.d: "Прогнозы о победе лейбористов не оправдались, поскольку коалиция уверенно движется к победе на второй срок подряд. [GetASTLeaderTitle] [AST.GetLeader] назвал результаты победой молчаливого большинства и в своей речи изложил планы дальнейших экономических инвестиций. Хотя коалиция останется у власти, лейбористы добились значительных успехов по всей стране почти во всех штатах и ​​территориях, оставив нынешнему правительству незначительное большинство. Сообщается, что Кевин Радд позвонил [GetASTLeaderTitle], чтобы поздравить их с победой, и ожидается, что он прокомментирует поражение позже вечером. Теперь коалиция несет ответственность за управление страной, поддерживая при этом доверие общественности к партии."
 election_outcomes_ast.2.a: "Она уверенно движется!"
 a_global_financial_crisis.3.t: "Последствия кризиса утихают."
 a_global_financial_crisis.3.d: "Последствия финансового кризиса в последние недели практически полностью исчезли. Экономика в основном нормализовалась до прежнего уровня, и общественное мнение поддержало наши усилия. Похоже, что наши меры по преодолению кризиса в конечном итоге оправдали себя и даже сделали нашу экономику более устойчивой к подобным экономическим спадам в будущем."
 a_global_financial_crisis.3.a: "Мы снова в деле."
 turnbull_letter_ast.1.t: "Письмо Тернбулла"
 turnbull_letter_ast.1.d: "Нынешний лидер Либеральной партии Малкольм Тернбулл выступил против нашего правительства, заявив, что располагает электронным письмом, доказывающим нашу коррупцию. Что именно содержит это письмо, мы можем только предполагать, но, похоже, оно достаточно серьезно, чтобы убедить СМИ опубликовать его. Наши собственные источники утверждают, что источник Тернбулла находится внутри правительства, а это значит, что у нас может быть крот в партии. Ожидается, что Малкольм Тернбулл представит письмо парламенту в ближайшие недели. Пока нам остается только скрестить пальцы и надеяться, что ущерб не будет слишком большим."
 turnbull_letter_ast.1.a: "Что мы сделали?"
 turnbull_letter_ast.2.t: "Поддельное письмо"
 turnbull_letter_ast.2.d: "Оказалось, что скандальное электронное письмо Малкольма Тернбулла было всего лишь подделкой. В ходе общенациональной проверки этого заявления источник Тернбулла сам признал, что все это выдумал. Партийный информатор Годвин Греч передавал Тернбуллу ложную информацию ради влияния. Последовавшая за этим негативная реакция практически обрушила рейтинги одобрения Тернбулла и превратила Либеральную партию в раскольническую организацию. Тем временем наши опросы общественного мнения снова выросли, а Греча незамедлительно исключили из партии."
 turnbull_letter_ast.2.a: "Мы ни на секунду в это не поверили!"
 oceanic_viking_ast.1.t: "Дилемма океанических викингов"
 oceanic_viking_ast.1.d: "Похоже, одно из наших морских судов, используемых в настоящее время для охраны границы, задержало 78 просителей убежища из Шри-Ланки, пытавшихся въехать в Австралию. После того, как они оказались на борту судна, в соответствии с нашей действующей политикой, их доставили на индонезийский остров Бинтан для оформления документов, но теперь они отказываются сойти на берег в знак протеста. Это уже 49-е задержание судна в этом году, и, как обычно, СМИ активно освещают это событие. Пока что персоналу на борту «Океаник Викинг» не удалось их вывезти, и чем дольше судно находится там, тем хуже это выглядит для нас. Оппозиция уже использует это, чтобы представить нас слабыми в борьбе с нелегальной миграцией, и, похоже, некоторым из просителей убежища на борту требуется медицинская помощь. Мы можем либо вести переговоры, либо заставить их покинуть судно."
 oceanic_viking_ast.1.a: "Предоставьте им льготные условия обработки."
 oceanic_viking_ast.1.b: "Ввести войска."
 oceanic_viking_ast.2.t: "Протесты против иммиграции носят массовый характер."
 oceanic_viking_ast.2.d: "В большинстве крупных городов вспыхнули протесты из-за исхода событий вокруг судна Oceanic Viking, в основном инициированные представителями правых политических взглядов. Партия One Nation, в частности, очень резко критиковала этот шаг, даже более агрессивно, чем оппозиция, и, несмотря на свою небольшую численность, привлекла заметное внимание в интернете. \n\nИх бывший лидер партии, Полин Хэнсон, построившая свою карьеру на провокационной риторике, также обрушилась с критикой на наше правительство во время митинга в Квинсленде, назвав его... \"антиавстралиец.\" В ответ также вспыхнули контрпротесты, хотя и меньшего масштаба, которые привели к ряду столкновений."
 oceanic_viking_ast.2.a: "Почему все не могут успокоиться?"
 oceanic_viking_ast.3.t: "Производственная ошибка"
 oceanic_viking_ast.3.d: "Согласно нашим указаниям, спецназ SAS был сформирован для силового выдворения просителей убежища с судна. По всей видимости, до этого события наши оперативные знания были ограничены. Когда наше подразделение поднялось на борт корабля, они обнаружили, что один из мигрантов из Шри-Ланки вооружился пистолетом, и между ними завязалась перестрелка. К счастью, только один из наших бойцов получил ранение, но четверо мигрантов на борту были убиты, а двое ранены. Остальные были успешно эвакуированы и доставлены в центр содержания под стражей на Бинтане. В ответ была созвана сессия Организации Объединенных Наций, и, как и ожидалось, ответная реакция оказалась довольно серьезной. Протесты вспыхнули в большинстве наших крупных городов, что также вызвало контрпротесты. Если это и есть какой-то позитивный момент, так это то, что оппозиция ведет себя относительно спокойно."
 oceanic_viking_ast.3.a: "Как такое могло произойти?"
 great_barrier_reef.1.t: "Разлив нефти на Большом Барьерном рифе"
 great_barrier_reef.1.d: "Китайский угольный балкер сел на мель к востоку от Рокгемптона в центральном Квинсленде. Судно находилось более чем в 10 км от судоходного канала, когда столкнулось с рифом, проскользнув по нему значительное расстояние, прежде чем остановиться, и вытекло более чем на 2 морские мили тяжелого мазута. На данный момент для снятия судна с мели направлены буксиры, хотя есть опасения, что судно может развалиться в условиях сильного волнения. ЮНЕСКО и наши специалисты по охране рифов возмущены тем, что судно так сильно отклонилось от курса, и что территория вокруг него теперь может быть загрязнена. Мы работаем с ними над минимизацией ущерба, но это медленный процесс."
 great_barrier_reef.1.a: "Очень жаль."
 ast_elections.3.t: "День выборов"
 ast_elections.3.d: "Стенды сворачиваются, рекламная кампания подходит к концу, а штаб-квартиры партий находятся в состоянии повышенной готовности. Предвыборная кампания завершилась, и избирательные участки подготовлены к дню выборов. Вскоре австралийцы со всей страны соберутся, чтобы проголосовать за будущее здания парламента, и теперь решение о нашем следующем лидере находится в их руках."
 ast_elections.3.a: "Пусть победит лучший кандидат."
 dissolution_election_rudd.3.t: "Радд одержал крупную победу"
 dissolution_election_rudd.3.d: "Члены штаб-квартиры Лейбористской партии празднуют победу Кевина Радда, поскольку это первая подряд победа партии с 1993 года и подтвердило надежды многих сторонников [GetASTLeaderTitle]. Лейбористы вернулись. \n\nПосле нескольких месяцев предвыборной кампании, посвященной продолжению реформ, результаты подтвердили мандат Радда. Лейбористы получили правительство большинства, которое, как ожидается, будет сформировано в ближайшие недели благодаря множеству новых членов. Почти весь штат Квинсленд окрасился в красный цвет. \n\nРезультаты выборов также обеспечили «зеленым» еще два места, что свидетельствует о растущей общественной поддержке мер по борьбе с изменением климата."
 dissolution_election_rudd.3.a: "Возвращаемся к делу."
 dissolution_election_rudd.4.t: "Тони Эбботт одержал победу на парусной лодке."
 dissolution_election_rudd.4.d: "Толпа скандировала \"Тони, Тони, Тони\" В переполненном зале отеля Four Seasons Либеральная партия одержала победу на одних из самых напряженных выборов в истории страны. Лидер консерваторов, проводивший предвыборную кампанию, опираясь на пламенную риторику и обещания… \"Остановите лодки\"объявил, что он был \"смиренный\" взять управление в свои руки. \"С сегодняшнего дня я заявляю, что Австралия находится под новым управлением и вновь открыта для бизнеса.\" \n\nКритически настроенный к изменению климата Эббот привлек внимание во время предвыборной кампании своей решительной оппозицией направлению общественного мнения, и тем не менее избиратели высказали свое мнение. Ожидается, что за этим последуют жесткие позиции по вопросам иммиграции и фискального консерватизма, поскольку лейбористы собирают чемоданы, а либералы вновь открывают свои позиции."
 dissolution_election_rudd.4.a: "Либералы вернулись!"
 ast_elections.1.t: "Предвыборная кампания"
 ast_elections.1.d: "Приближается избирательная кампания, и начинается время предвыборной агитации. Согласно избирательному законодательству, у нас есть всего 8 недель, чтобы донести свою позицию. Будь то массированная рекламная кампания в СМИ, поездки по стране или дебаты с оппозицией, время поджимает. Нам нужно действовать и активно работать, если мы хотим победить."
 ast_elections.1.a: "Полегче с либералами!"
 ast_elections.1.b: "Лейбористская партия заслуживает справедливого отношения!"
 ast_elections.1.c: "Австралия – первая страна с концепцией «Единая нация»!"
 ast_elections.1.e: "Боритесь за перемены вместе с «зелёными»!"
 special_gillard_election.1.t: "Назначение новых выборов"
 special_gillard_election.1.d: "Единственный способ закрепить легитимность нашего нового правительства — это новые всеобщие выборы. Если мы сможем мобилизовать их голоса и обеспечить себе следующий срок, это даст нам мандат, необходимый для дальнейшего руководства, и, возможно, уменьшит негативную реакцию со стороны оппозиции при принятии законов. Риск всё ещё существует на любых выборах, поэтому нам придётся потрудиться в течение следующих 60 дней."
 special_gillard_election.1.a: "Вперед и вверх!"
 election_outcomes_ast.5.t: "Результаты голосования: парламент оказался в подвешенном состоянии!"
 election_outcomes_ast.5.d: "В ходе выборов, которые не повторялись с 1940 года, ни одна из партий не одержала однозначной победы. Коалиция и Лейбористская партия получили 72 места, что на 4 места меньше, чем необходимо для формирования правительства. Это привело к неловкому завершению вечера, когда оба кандидата вышли на сцену, чтобы заявить, что, несмотря на подсчет результатов, выборы еще не закончились. В течение следующих нескольких дней партиям предстоит бороться за места в Палате представителей и вести переговоры с оставшимися членами, чтобы сформировать правительство."
 election_outcomes_ast.5.a: "Разделённая нация."
 election_outcomes_ast.4.t: "Очередная победа правительства Радда"
 election_outcomes_ast.4.d: "Вчера вечером по улицам Сиднея бродили толпы людей, когда стали поступать результаты выборов, на которых победила Лейбористская партия. После очередного срока, отмеченного сильной политикой, Кевин Радд вновь завоевал расположение общественности, получив 48% голосов и обеспечив себе ряд мест, ранее занимаемых коалицией в Квинсленде, прорвав прежние опорные пункты, поддерживавшие горнодобывающую промышленность в районе Боуэнского бассейна. \n\nРадд вместе со своей семьей отпраздновал третью победу на крикетном поле «Гэбба». \n\n\"Моя семья отдала все силы общественной жизни и моей кампании. В ближайшие дни мы с Терезой проведем несколько дней вместе, в том числе и с детьми, а потом снова вернемся к работе. Шоу еще не закончилось.\""
 election_outcomes_ast.4.a: "И хорошие времена продолжаются."
 election_outcomes_ast.6.t: "Гиллард обеспечила себе еще один срок."
 election_outcomes_ast.6.d: "первая женщина в Австралии [GetASTLeaderTitle] Вопреки предварительным опросам, она вновь завоевала поддержку общественности и сформировала правительство меньшинства. Гиллард поблагодарила своих сторонников в Мельбурнском конференц-центре и изложила свои планы по финансово ответственному руководству и дальнейшим реформам в сфере здравоохранения. \n\nЛидер оппозиции Тони Эбботт позвонил Гиллард вскоре после объявления результатов, чтобы поздравить ее с победой. После очередного поражения ожидается, что Эбботт уйдет с поста лидера партии, что укажет на изменение партийной политики в свете неспособности сместить партию вправо."
 election_outcomes_ast.6.a: "Победа разумной политики."
 new_governor_general_ast.1.t: "Новый генерал-губернатор"
 new_governor_general_ast.1.d: "Впервые в истории нашей страны женщина принесла присягу в качестве нового генерал-губернатора. 65-летняя Квентин Брайс, бывший юрист и губернатор штата Квинсленд, стала 25-м генерал-губернатором Австралии и первой женщиной на этом посту за последние 107 лет. \n\nНа церемонии в здании парламента в Канберре Брайс принес присягу на верность королеве, в то время как снаружи был произведен салют из 21 орудия. \n\n\"Хочу, чтобы вы знали, что я принимаю эту роль с серьезностью, беспристрастностью, энергией и глубокой любовью к стране, которую мы разделяем.\" сказала она. \"Я обещаю быть открытым, отзывчивым и верным современным взглядам и принципам функционирования австралийского общества.\""
 new_governor_general_ast.1.a: "Времена, безусловно, меняются."
 indo_cattle_drama.1.t: "Проблема экспорта крупного рогатого скота из Индонезии"
 indo_cattle_drama.1.d: "Телеканал ABC недавно показал программу «Четыре угла», разоблачающую систематическую жестокость в индонезийской скотоводческой отрасли. Кадры довольно шокирующие, и широкий общественный резонанс вызвал требования немедленно прекратить экспорт скота в Индонезию. Мы можем приостановить экспорт живого скота до тех пор, пока они не согласятся с новыми нормативными рамками, но запрет нанесет серьезный финансовый ущерб нашим фермам на севере страны."
 indo_cattle_drama.1.a: "Приостановить экспорт."
 indo_cattle_drama.1.b: "Это того не стоит."
 malaysia_solution_ast.1.t: "Малайзийское решение"
 malaysia_solution_ast.1.d: "Учитывая плачевное состояние наших нынешних центров содержания мигрантов под стражей, Малайзия обратилась к нам с предложением передать им 800 находящихся у нас просителей убежища в обмен на прием 4000 беженцев, дела которых уже оформлены. Это решило бы наши насущные проблемы с содержанием под стражей и успокоило бы часть общественного недовольства, но Малайзия не является участницей Конвенции ООН о статусе беженцев, что делает всю сделку юридически сомнительной."
 malaysia_solution_ast.1.a: "Мы пожмём друг другу руки в знак согласия."
 malaysia_solution_ast.1.b: "Это юридически некорректно."
 malaysia_solution_ast.2.t: "Высокий суд заблокировал сделку с Малайзией."
 malaysia_solution_ast.2.d: "К сожалению, Высокий суд Австралии признал обмен незаконным в соответствии с Законом о миграции и заблокировал перевод. Немедленной реакцией стала череда обвинений со стороны оппозиции, и, если уж на то пошло, общественная реакция только ухудшилась. Возможно, нам следует рассмотреть другие методы решения проблемы содержания под стражей иммигрантов."
 malaysia_solution_ast.2.a: "Не так-то просто."
 embassy_tent_protests.1.t: "Протесты у посольства с установкой палаток"
 embassy_tent_protests.1.d: "В честь 40-летия «Палаточного посольства аборигенов» — акции протеста в поддержку прав коренного населения у здания парламента в 1972 году — неподалеку, в ресторане Lobby, проходит церемония награждения. Похоже, группа протестующих, собравшихся на месте событий, переместилась к ресторану. Что-то, кажется, их разозлило, так как некоторые даже начали стучать по окнам. Поскольку на мероприятии присутствуют [GetASTLeaderTitle] и лидер оппозиции, служба безопасности рекомендовала немедленную эвакуацию с места проведения мероприятия вертолетом, находящимся неподалеку. Толпа выглядит довольно буйной, но, возможно, начало диалога могло бы успокоить ситуацию."
 embassy_tent_protests.1.a: "Вытащите меня отсюда!"
 embassy_tent_protests.1.b: "Давайте обратимся к публике."
 embassy_tent_protests.2.t: "Пострадавший [GetASTLeaderTitle]"
 embassy_tent_protests.2.d: "Начался настоящий кошмар с точки зрения безопасности: охранники, сопровождавшие Гиллард, прорвались сквозь толпу, позволив ей выйти и поговорить с ними. Всего через минуту после этого в нее попал брошенный одним из протестующих предмет. [GetASTLeaderTitle]Она упала на землю и повредила глаз. Полиция и охрана окружили толпу и эвакуировали Джулию Гиллард с мероприятия, но после посещения больницы выяснилось, что повреждение ее правого глаза необратимо. \n\nЛидер оппозиции Тони Эбботт уделил минуту своего выступления в парламенте, высоко оценив действия... [GetASTLeaderTitle] Она высоко оценила свою храбрость и осудила нападение."
 embassy_tent_protests.2.a: "О, нет..."
 embassy_tent_protests.3.t: "Укрощение толпы"
 embassy_tent_protests.3.d: "К счастью, после того как Радд покинул павильон, ничего не произошло, и толпа, казалось, успокоилась, как только он начал с ними общаться. Похоже, что комментарий Тони Эббота спровоцировал скандал, и после эвакуации лидера оппозиции напряжение спало. \n\n[GetASTLeaderTitle] провел час с толпой и журналистами неподалеку, прежде чем вернуться на церемонию. Это обеспечило неплохую позитивную рекламу."
 embassy_tent_protests.3.a: "Так это и делается."
 embassy_tent_protests.4.t: "Схватка с протестующими"
 embassy_tent_protests.4.d: "После того, как охрана создала проход в толпе, чтобы Тони смог выйти из павильона и поговорить с протестующими, один из них, по всей видимости, находясь в состоянии алкогольного опьянения, бросился на него, и в ответ [GetASTLeaderTitle] ударил его кулаком. Протестующий не получил серьезных травм, и очевидно, что Эбботт защищался, но журналисты внутри успели сделать все необходимые фотографии, и теперь кажется, что [GetASTLeaderTitle] буквально дрался с демонстрантами."
 muslim_protests_sydney.1.t: "В Сиднее вспыхнули исламские беспорядки."
 muslim_protests_sydney.1.d: "В ходе серии массовых демонстраций, охвативших территорию от Ближнего Востока до Лондона, мусульмане вышли на улицы, выражая гнев по поводу спорного выхода фильма. \"Невинность мусульман.\" Сидней не стал исключением, протесты распространились и на центральный деловой район. На место протестов было вызвано более 150 полицейских, 6 из которых были доставлены в больницу после того, как беспорядки переросли в бунт. \n\nНа данный момент арестованы 8 человек, и после напряженного столкновения у американского консульства толпа начала расходиться."
 muslim_protests_sydney.1.a: "Здесь нет места экстремизму."
 murrawarri_republic_event.1.t: "Республика Мурраварри провозгласила независимость."
 murrawarri_republic_event.1.d: "В наш парламент поступило письмо, объявляющее о независимости государства, носящего название Республика Мурраварри. В письме указывается, что \"Народный совет Мурраварри\" заявляли о своих правах на территорию, расположенную на границе между Новым Южным Уэльсом и Квинслендом, как на свою новую суверенную территорию и требовали признания. \n\nЧестно говоря, это самая странная вещь, которую когда-либо видели наши сотрудники, и, похоже, у них нет никаких законных оснований для такого запроса, или для нашего ответа."
 murrawarri_republic_event.1.a: "Мурра-что?"
 shark_attacks_ast.1.t: "Нападения акул усиливают общественную обеспокоенность."
 shark_attacks_ast.1.d: "Примерно в 270 километрах к югу от Перта, недалеко от Грейстауна, 35-летний мужчина погиб от нападения акулы. Шесть дней спустя еще один серфер, 18-летний Зак Янг, погиб в результате нападения акулы недалеко от Коффс-Харбора. Внезапная череда смертей, связанных с акулами, побудила правительство Западной Австралии заявить о более агрессивном подходе к охоте на акул, заходящих в популярные места для купания. Несмотря на снижение риска нападений акул в последние годы, правительство Западной Австралии потратило более 20 миллионов долларов на воздушное патрулирование и отстрел для сокращения популяции акул, что морские биологи сочли чрезмерной реакцией."
 shark_attacks_ast.1.a: "Мы друзья, а не еда!"
 election_outcomes_ast.3.t: "Лейбористская партия обеспечила себе переизбрание на второй срок."
 election_outcomes_ast.3.d: "Австралийцы собрались по всей стране, чтобы отдать свои голоса и определить будущее направление развития страны. На этот раз они проголосовали за продолжение правления партии [AST.GetLeader], предоставив ей еще один срок. [GetASTLeaderTitle] выступила со своей предвыборной речью в штаб-квартире в Бартоне, окруженная ликующей толпой сторонников лейбористов, и изложила планы на следующие три года. Проклятие лейбористов \", связанное с пребыванием у власти, \", похоже, снято и превратилось в подарок, отвлекая избирателей от перемен в пользу сохранения стабильности."
 election_outcomes_ast.3.a: "Зачем останавливаться на том, что хорошо работает?"
 election_outcomes_ast.7.t: "Либеральная партия переизбрана"
 election_outcomes_ast.7.d: "По мере завершения предвыборной кампании и подсчета голосов ожидается, что действующий депутат [AST.GetLeader] одержит убедительную победу на перевыборах. Мандат его правительства продолжает завоевывать большинство избирателей и укрепляет его позиции в Палате представителей и Сенате, а также обеспечивает небольшой рост по всей стране. Ожидается, что работа парламента возобновится в обычном режиме, а новый срок полномочий начнется в следующем месяце."
 election_outcomes_ast.7.a: "Хорошие времена продолжаются!"
 election_outcomes_ast.9.t: "Малкольм Тернбулл с трудом одержал победу по результатам голосования."
 election_outcomes_ast.9.d: "Лидер либералов Малкольм Тернбулл заявил о своей победе на федеральных выборах, и коалиция приближается к незначительному большинству в парламенте. \n\n\"Сегодня замечательный день!\" Об этом Тернбулл заявил прессе перед тем, как произнести свою речь. \n\nПосле кампании, направленной на формирование правительства, придерживающегося более технократического курса, новый [GetASTLeaderTitle] Он произнес свою благодарственную речь, имея в виду именно это. \n\n\"Мы должны быть более конкурентоспособными, более продуктивными и — мы должны быть более инновационными.\" \n\nОжидается, что правительство Тернбулла займется решением проблемы растущих энергетических потребностей страны и развитием постоянно расширяющегося технологического сектора, как он выразился: \"Готовность найти общий язык с людьми и с нашими отраслями промышленности. Прогресс заключается в помощи всем, — я знаю, что мы можем достичь чего-то великого, если приложим к этому наши лучшие умы.\""
 election_outcomes_ast.9.a: "Пусть будущее будет светлым!"
 detention_centres_full.1.t: "Центры содержания под стражей переполнены"
 detention_centres_full.1.d: "Несмотря на первоначальный масштаб и успех, центры в Папуа и Науру начали переполняться, что создает узкое место в нашей системе обработки заявлений мигрантов. Хотя финансирование уже направляется в эти центры для устранения существующих недостатков, для решения проблемы в долгосрочной перспективе необходимо искать дальнейшие улучшения или варианты. Это происходит в то время, когда число нелегальных мигрантов достигло самого высокого уровня за последние годы."
 detention_centres_full.1.a: "Ничто не вечно?"
 migration_event_ast.1.t: "Число нелегальных иммигрантов достигло нового рекорда."
 migration_event_ast.1.d: "Число нелегальных мигрантов, пытающихся высадиться на наших берегах, резко возросло за последние несколько месяцев. То ли из-за продолжающегося кризиса, то ли из-за зависти нашей процветающей страны, мигранты прибывают издалека, и многие из них обходят очередь. Количество задержаний на нашей границе достигло рекордного уровня, и это начинает создавать нагрузку на наши оперативные возможности."
 migration_event_ast.1.a: "Тяжелые времена."
 aukus_formed_ast.1.t: "Партнерство AUKUS в действии"
 aukus_formed_ast.1.d: "Сегодня в Вашингтоне, в Пентагоне, лидеры Австралии, Великобритании и США встретились, чтобы обсудить формирование трехстороннего альянса. Сообщается, что в ходе обсуждения были затронуты вопросы кибербезопасности, искусственного интеллекта и защиты цепочек поставок, все с целью углубления дипломатического и оборонного сотрудничества между тремя государствами. \n\n\"Более 70 лет Австралия, Соединенное Королевство и Соединенные Штаты сотрудничают... Сегодня мы вновь подтверждаем свою приверженность этому видению.\" \n\nПо всей видимости, это партнерство станет дополнением к существующим альянсам трех стран. [AST.GetLeader] Было заявлено, что первоочередной задачей AUKUS является усиление распространения оборонной продукции."
 aukus_formed_ast.1.a: "Двое — это хорошо, трое — это партнерство."
 pukpuk_treaty_event.1.t: "Historic Papua New Guinea-Australia Treaty Signed into Force"
 pukpuk_treaty_event.1.d: "The landmark 'Pukpuk Treaty' between Papua New Guinea and Australia has been finalised, and been heralded as an elevation of our nation's relations by the [GetASTLeaderTitle], remarking their joining \"as neighbours, as mates, and now as allies\". \n\nThe treaty, named after the local term for crocodile, will begin the process of integrating the Papua New Guinea army into the Australian Defense Force, and allow up to 10,000 Papua New Guinea nationals to serve. Both will also commit to supporting each other if either country comes under attack. A sizable boon to regional security projection and stability."
 pukpuk_treaty_event.1.a: "Нашим партнерам и друзьям!"
 ast_taiwan_recognition.1.t: "Австралия признает Китайскую Республику"
 ast_taiwan_recognition.1.d: "В результате знакового изменения двухпартийной политики, [AST.GetLeader] Тайвань официально признан суверенным и независимым государством. Это первый шаг страны к отказу от позиции в отношении материкового Китая со времен визита Гофа Уитлама в 1971 году. В рамках \"импульс для мира\" в Индо-Тихоокеанском регионе [GetASTLeaderTitle] отметил, что это признание является \"признание реальности,\" с продвижением концепции двух Китаев. \n\nРеакция Китая была быстрой и резкой. Китайские министры обрушились с критикой на Австралию, назвав её... \"двуличная нация\" В сети Интернет министерство иностранных дел немедленно приступило к введению ряда ограничений на торговлю между странами, которые практически равны полному эмбарго."
 ast_taiwan_recognition.1.a: "Настоящий друг."
 howard_rumblings_in_dark.1.t: "Внутри партии раздаются волнения."
 howard_rumblings_in_dark.1.d: "В Либеральной партии всегда присутствовала определенная воинственность, и любой спор часто выходил наружу. Говард знал, что единственная разница между коллегой и недовольным сотрудником заключалась в хороших результатах опросов, а в последнее время эти результаты резко упали. Недовольство, распространяемое из-за кулис, пробилось в газеты, но даже без таблоидов критика была слышна. \n\nОдни говорили, что Говард просто слишком стар, другие — что он был... \"Оторван от реальности.\" Он знал, что, вопреки распространенному мнению, он был в курсе закулисных интриг. Его собственный заместитель, Питер Костелло, уже готовился к следующим выборам лидера партии. Он заключал сделки и заручался голосами избирателей, и если Говарду не удавалось добиться своего, то он терял пост премьер-министра, а Костелло занимал его место. Такова природа партийной политики."
 howard_rumblings_in_dark.1.a: "Мы должны это исправить."
 howard_rumblings_in_dark.2.t: "Предательства в Кабинете министров"
 howard_rumblings_in_dark.2.d: "Это не стало неожиданностью, но новость он получил рано утром. Вместо того чтобы позволить им опорочить его репутацию и протащить её через избирательный бюллетень на выборах лидера, Говард собирался уйти на своих условиях. Он спас партию от краха, а теперь его выгоняли. \n\n\"Для меня было огромной честью каждый день моей жизни на протяжении последних лет быть [GetASTLeaderTitle] Я хочу поблагодарить австралийский народ за предоставленную мне привилегию в этой прекрасной стране и выразить ему свою признательность за этот период времени. Я уважаю и чту это. После многих лет стремления к успеху, руководство этой страной стало самым невероятным опытом в моей жизни.\" \n\n\"Я хочу поблагодарить австралийский народ за предоставленную мне привилегию служить ему. Я беру на себя полную ответственность за Либеральную партию, за наши успехи и поражения. Потерять своё место в партии непросто. И всё же я обязан им больше, чем партия обязана мне.\" \n\nОн закончил выступление короткой волной, а затем вернулся в Беннелонг. Возвращение к более благоприятным условиям..."
 howard_rumblings_in_dark.2.a: "И всё же это причиняло боль."
 abbott_gov_event.1.t: "Правительство Эббота представило кабинет министров, в котором преобладают мужчины."
 abbott_gov_event.1.d: "Он [GetASTLeaderTitle] Избранный министр Тони Эбботт представил состав кабинета министров, в котором много опытных специалистов, в том числе 15 ветеранов правительства Ховарда, но мало женщин среди членов кабинета – это заместитель главы правительства. [GetASTLeaderTitle]Джули Бишоп, единственная женщина в кабинете министров, состоящем из 19 человек. \n\nЭбботт воскликнул, что он разочарован тем, что их не было. \"как минимум два\" женщины в кабинете министров, но ожидалось, что женщины будут продвигаться по службе с течением времени. \"хороший и талантливый\" женщины во внешнем служении \"стук в дверь\" Состав кабинета министров формируется из представителей внешнего министерства. Хотя из 11 членов внешнего министерства только четыре — женщины. \n\nЭтот дисбаланс вызвал многочисленную критику со стороны оппозиционных партий, на что Эбботт поспешил ответить. \"более важные проблемы.\""
 abbott_gov_event.1.a: "В конце концов, это меритократия."
 abbott_gov_event.2.t: "Австралия проголосовала за признание коренных народов (\"Yes\")."
 abbott_gov_event.2.d: "После общенационального голосования в поддержку референдума, в результате которого 74% голосов поддержали референдум, коренные австралийцы и жители островов Торресова пролива будут закреплены в конституции в рамках нового подхода правительства Эббота к признанию коренного населения. На ежегодном культурном фестивале Гарма, предшествовавшем референдуму, Эббот отметил, что \"Признание прав коренных народов не изменит нашу конституцию, а дополнит её.\" охарактеризовав эту поправку как момент исцеления для многих. \n\nПосле объявления результатов Эбботт также подтвердил свой план провести неделю в одном из коренных общин. \n\n\"Дело в том, что если эти места были домом для первых австралийцев, почему бы им не быть домом для... [GetASTLeaderTitle] нашей страны?\""
 abbott_gov_event.2.a: "Совершенно верно."
 abbott_gov_event.3.t: "Инцидент в «Луковом доме»"
 abbott_gov_event.3.d: "Тони Эбботт отправился в сельскую местность Тасмании, чтобы встретиться с местными фермерами в рамках своего сельскохозяйственного проекта. Репортеры собрались вокруг павильона, когда Тони пожал руки и произнес короткую речь вместе с одним из фермеров. \n\nПеред ним стояла квадратная корзина, доверху наполненная продуктами, каждый из которых был спелым и блестящим. Пока фермер рассказывал репортерам о своем проекте, мысли Эббота были заняты луком. \n\nПоверили бы журналисты в его искреннюю преданность фермерам, если бы он этого не показывал? Как бы они могли убедиться, что австралийская продукция действительно лучшая в мире? \n\nПока он смотрел на лук, кто-то рядом с ним начал его высмеивать. \"Если вам не терпится, можете попробовать!\" \n\nОни действительно это сказали, или это были собственные мысли Тони, подстрекавшие его? Прежде чем он успел что-либо сообразить, в его руке уже оказалась луковица. Вспышки камер, несколько насмешек раздались, когда он откусил кусочек сырой луковицы. Фермер обернулся в недоумении, а Тони лишь кивнул, прежде чем сделать еще один укус. \"Очень хороший\" Это всё, что он смог выдавить из себя, наблюдая, как Тони продолжает уплетать еду."
 abbott_gov_event.3.a: "Зачем он это сделал?"
 abbott_gov_event.4.t: "Отправляясь в путешествие"
 abbott_gov_event.4.d: "В палатку, несмотря на сетку и непрекращающееся опрыскивание, проник ещё один комар. Было слишком темно, чтобы его заметить, поэтому он изо всех сил старался не обращать на него внимания. Он провёл большую часть недели в Арнемленде с местными вожатыми, в отдалённой Северной территории, и пока что всё было очень спокойно, если не считать постоянного гула ноутбука рядом с кроватью. \n\nНа следующий день состоялись обычные церемонии и встречи один на один с вождем клана Гуматджи. Вождь очень хотел обсудить предложение, полученное от компании Rio Tinto, касающееся разработки нового бокситового рудника неподалеку. Бурение в этом регионе уже проводилось ранее, но новый рудник будет расположен на священной земле, поэтому... [GetASTLeaderTitle] Пришлось подписаться. \n\nГлава клана должен был получать 75 процентов отчислений, и компания Rio Tinto утверждала, что эта операция предоставит клану Гуматджи  \"Успешная карьера в горнодобывающей промышленности.\" Сомнительно, учитывая, что за все годы добычи полезных ископаемых компанией Rio Tinto на землях народа Йолнгу предприятие выпустило лишь одного квалифицированного ученика из числа коренного населения."
 abbott_gov_event.4.a: "Одобрить разработку месторождения."
 abbott_gov_event.4.b: "Это священная земля."
 abbott_gov_event.5.t: "Ошибки в учебной программе"
 abbott_gov_event.5.d: "Тони Эбботт стоял на трибуне перед тем же переполненным залом, где он еще совсем недавно проводил свою предвыборную кампанию. Позади него развевался баннер Либеральной партии и австралийский флаг, на котором, как он настаивал, тоже был вывешен. Он начал с обычных любезностей, прежде чем перейти к критике недостатков нынешней системы образования. Тони, пожалуй, чувствовал себя наиболее комфортно, когда критиковал различные вещи. Именно это делало его таким хорошим лидером оппозиции, и теперь он пытался продать свою реформу учебной программы. \n\nНесомненно, его риторика располагала к себе слушателей, но по ходу речи произошло нечто крайне неприятное. \n\n\"Никто, каким бы умным, образованным и опытным он ни был, не является источником всей мудрости.\" \n\nРаздался смех, когда Эбботт постепенно понял, что перепутал слово «хранилище» с названием медицинского ректального инструмента. Он продолжил речь без дальнейших запинок, но к следующему дню эта небольшая ошибка уже была на первых полосах газет."
 abbott_gov_event.5.a: "Они действительно звучат похоже..."
 abbott_gov_event.6.t: "Результаты работы Комиссии"
 abbott_gov_event.6.d: "Аудит выявил масштабные масштабы наших расходов и представил довольно радикальный план по их сокращению. В него включены сокращения пенсий, государственного здравоохранения, образования и пособий по безработице. Если мы примем полный вариант, общественный резонанс может оказаться слишком сильным, чтобы мы смогли оправиться от него, но это, безусловно, значительно укрепит бюджет. В противном случае мы могли бы смягчить его и предложить что-то более приемлемое для избирателей."
 abbott_gov_event.6.a: "Разбавьте его водой."
 abbott_gov_event.6.b: "Идите до конца."
 malcolm_abbott_event.1.t: "Визит Малкольма"
 malcolm_abbott_event.1.d: "Наш министр связи, Малкольм Тернбулл, обратился к нам в частном порядке по поводу нашей политики, предупредив, что любое дальнейшее сокращение расходов будет иметь серьезные последствия. Неясно, имеет ли он в виду реакцию партий в частности или общественное мнение, но Малкольм и раньше отличался склонностью к театральности. Возможно, это просто очередная чрезмерная реакция, ведь он и раньше открыто выступал против наших фискальных ограничений."
 malcolm_abbott_event.1.a: "Публично объявить о прекращении сокращения расходов."
 malcolm_abbott_event.1.b: "Он слишком остро реагирует."
 malcolm_abbott_event.2.t: "Эбботт \"Жестокий бюджет\" Это спровоцировало протесты по всей стране."
 malcolm_abbott_event.2.d: "Тысячи людей по всей Австралии вышли на митинги в знак протеста против последнего раунда сокращения государственных расходов. Масштабные акции протеста под названием «Разрушим бюджет» прошли почти во всех крупных городах, в которых, в частности, принял участие Австралийский совет профсоюзов. Министр финансов Джо Хоки попытался оправдать сокращения, заявив, что страна... \"сместились в сторону классовой борьбы 1970-х годов\" И его бюджет был направлен на обеспечение равных возможностей, а не на равенство результатов. \n\nТем не менее, протестующие заявили, что планируют продолжать марш до конца месяца. Последний из них состоялся на лужайке перед зданием парламента, где была установлена ​​огромная кукла, изображающая... [GetASTLeaderTitle]."
 malcolm_abbott_event.2.a: "Я так не выгляжу!"
 malcolm_abbott_event.3.t: "Лидерство рухнуло"
 malcolm_abbott_event.3.d: "После недавнего общественного резонанса на последнем партийном собрании один из членов проголосовал за избрание лидера. \"пролить,\" Это привело к новому голосованию по вопросу о том, должен ли Тони оставаться лидером или нет. Поскольку ни у кого не хватило смелости бросить вызов, единственным кандидатом, помимо Тони, оказалось пустое кресло в комнате. \n\nКогда подвели итоги голосования, [GetASTLeaderTitle] Одержал победу, получив 61 голос, хотя немалое количество голосов (39) досталось незанятому месту. Очевидно, что падение поддержки партии вызывает беспокойство, и если мы не сможем изменить ситуацию, еще одно голосование может закончиться гораздо хуже."
 malcolm_abbott_event.3.a: "Время ещё есть."
 abbott_jakarta_event.1.t: "Ведя праведную борьбу"
 abbott_jakarta_event.1.d: "По мнению Эббота, поездка в Джакарту была правильным началом. Многие австралийцы забыли, что Индонезия — страна с преимущественно мусульманским населением, насчитывающая более 230 миллионов человек, и находится совсем недалеко от родины. После терактов на Бали казалось, что каждый месяц приходят новости об очередном нападении. Он никогда не был уверен, что следующее не произойдет ближе к дому, поэтому эта мысль постоянно не давала ему покоя. Когда Тони разговаривал с президентом, [IND.GetLeader], он поднял эту тему. Конечно, его целью было убедить правительство в необходимости австралийских миротворческих операций в стране, чего он добивался уже довольно давно, к большому неудовольствию индонезийского правительства. До этого на протяжении десятилетий основной стратегией была «мягкая сила»: образовательные программы и другие пакеты помощи поддерживали этническую напряженность, которой они были в изобилии, на умеренном уровне. Хотя это вряд ли было решением проблемы угрозы фундаментализма. В лучшем случае Тони ушел, получив от правительства обещание продолжить текущее сотрудничество и что двери будут открыты для будущих проектов."
 abbott_jakarta_event.1.a: "Короче говоря, разочаровывающий результат."
 o_canada_abbott.1.t: "Австралия предлагает сотрудничество в горнодобывающей отрасли."
 o_canada_abbott.1.d: "Правительство в Канберре обратилось к нам с предложением об обмене техническими специалистами в горнодобывающей отрасли в целях сближения наших стран и использования богатых природных ресурсов, которыми мы обе страны обладаем. Сделка довольно проста и, на первый взгляд, выгодна обеим сторонам, даже несмотря на то, что нынешнее австралийское правительство не очень-то сближается с нашим."
 o_canada_abbott.1.a: "Мы приветствуем наших братьев из стран Содружества."
 o_canada_abbott.1.b: "Нет, спасибо."
 o_canada_abbott.2.t: "Несколько нелепых ошибок в Оттаве"
 o_canada_abbott.2.d: "Стоя в авиационном крыле Канадского военного музея в Оттаве, Тони обратился к толпе репортеров, многие из которых, несмотря на место, были австралийцами. Казалось, он даже не мог покинуть страну, не будучи преследуемым группой журналистов. [CAN.GetLeader] стоял рядом с ним, пока он говорил. Стараясь не впадать в привычку стереотипизировать их, он не мог не упомянуть, что это действительно дружелюбный народ. Хотя, на его вкус, немного левее. \n\nТони вернулся к завершению своей речи. Он повернулся и пожал руку их лидеру, прежде чем уйти, и хотя он несколько раз запнулся в речи, в какой-то момент назвав страну \"Канадией, \", все прошло в основном без сучка и без задоринки. Канадское правительство согласилось на инвестиции в горнодобывающую промышленность, а взамен мы направляем туда наших собственных экспертов для оказания помощи в бурении."
 o_canada_abbott.2.a: "Это то самое общее для Содружества."
 abbott_china_trade.1.t: "Дальнейшее торговое сотрудничество со стороны Австралии"
 abbott_china_trade.1.d: "Австралийский лидер, [AST.GetLeader], очень заинтересован в расширении существующих торговых отношений с их страной путем продвижения соглашения о свободной торговле. Соглашение предусматривает до 95% беспошлинного импорта наших товаров, упрощение обмена ресурсами, а также условия, позволяющие нашим частным компаниям легче инвестировать в Австралию. На первый взгляд, это кажется взаимовыгодным решением во всех смыслах этого слова."
 abbott_china_trade.1.a: "Достойное начинание"
 abbott_china_trade.1.b: "Это не в наших интересах."
 abbott_china_trade.2.t: "Соглашение о свободной торговле [GetYear] подписано"
 abbott_china_trade.2.d: "Китай согласился с нашим двусторонним соглашением о свободной торговле, что значительно укрепит поток полезных ископаемых и промышленных товаров между нами. Почти десятилетние переговоры о более масштабном соглашении наконец-то увенчались успехом. Учитывая, что Китай является крупнейшим источником экспортных доходов страны, последствия должны ощутиться немедленно во всей экономике. Благодаря только что подписанному документу и рукопожатию, страны Тихоокеанского региона внезапно стали более сплоченными и едиными."
 abbott_china_trade.2.a: "Магия совпадения интересов."
 abbott_china_trade.3.t: "Китай отрицает дальнейшее торговое сотрудничество."
 abbott_china_trade.3.d: "К сожалению, Китай отклонил наши предложения о дальнейшем сотрудничестве и на данный момент закрыл для нас дипломатические двери. Похоже, в будущем нам придется искать другие пути решения проблемы."
 abbott_china_trade.3.a: "Не самый худший исход, но и не самый хороший."
 abbott_navy_exercises_event.1.t: "Плоды упражнений"
 abbott_navy_exercises_event.1.d: "Учения с нашими американскими друзьями завершились и принесли полезные результаты. Помимо того, что наши войска получили столь необходимую практику, учения выявили некоторые недостатки в технологиях нашего подразделения. После обмена данными с нашими научно-исследовательскими подразделениями, похоже, мы сможем применить некоторые из этих выводов в наших научно-исследовательских разработках."
 abbott_navy_exercises_event.1.a: "Это, безусловно, полезно."
 knights_and_dames_ast_event.1.t: "Реакция на присвоение принцу Филиппу рыцарского звания разделилась."
 knights_and_dames_ast_event.1.d: "Он [GetASTLeaderTitle]Его старшие коллеги открыто выразили смесь недоумения, гнева и разочарования по поводу его решения восстановить традицию, присудив австралийское рыцарское звание принцу Филиппу, не являющемуся гражданином Австралии. \n\nМинистры кабинета министров сообщили ABC, что [GetASTLeaderTitle] Перед объявлением награды не было проведено никаких консультаций с руководством. Этот шаг, похоже, расколол парламент между сторонниками республиканцев. \n\n\"Я очень рад, что в его 90-летнем возрасте, на закате жизни, посвященной служению и долгу, мы в нашей стране можем должным образом отметить то, что он для нас сделал.\" Тони Эбботт заявил в своем обращении по поводу этого решения: «Хотя реакция из Соединенного Королевства была довольно сдержанной, благодарностью, реакция внутри страны говорит об обратном»."
 knights_and_dames_ast_event.1.a: "Всем угодить невозможно."
 abbott_japan_trade_deal.1.t: "Пересмотр торговых соглашений из Канберры"
 abbott_japan_trade_deal.1.d: "Он [GetASTLeaderTitle] из Австралии, [AST.GetLeader]обратились к нам напрямую, чтобы обсудить пересмотр наших текущих торговых обязательств перед их страной с целью дальнейшего укрепления отношений. \"исправить\" Есть некоторые недостатки. Неясно, подразумевают ли они что-то с нашей или с их стороны, но урегулирование некоторых вопросов в соглашении могло бы обеспечить более беспрепятственный транзит товаров между нами. В частности, сельскохозяйственного импорта."
 abbott_japan_trade_deal.1.a: "Кажется, это справедливо."
 abbott_japan_trade_deal.1.b: "Нет, спасибо."
 abbott_japan_trade_deal.2.t: "Переговоры с Японией: историческая сделка"
 abbott_japan_trade_deal.2.d: "Пересмотр соглашения принес нам огромную экономическую выгоду, представив гораздо более справедливое соглашение. Практически полностью будут отменены японские пошлины на нашу говядину, а также на множество других сельскохозяйственных продуктов. Однако единственное, в отношении чего они не хотели уступать, — это рис. Они также подписывают приоритетный контракт на поставку ресурсов. Тем временем, как и было обещано, мы снижаем ряд пошлин на их электронику и автомобили. Невозможно переоценить тот вклад, который это внесет в развитие нашего сельского хозяйства. Это серьезная победа для нас по сравнению с первоначальным соглашением."
 abbott_japan_trade_deal.2.a: "Вот это действительно справедливая оценка."
 abbott_saf_event.1.t: "Проблемы Кейптауна"
 abbott_saf_event.1.d.a: "Любопытно, что у Южной Африки три разные столицы. Этот факт Эбботу было трудно понять. Чтобы не замедлять темп, для простоты был выбран Йоханнесбург, и по прибытии он остановился на недавно построенном стадионе FNB. Очевидно, они стремились продемонстрировать свои усилия по модернизации, хотя Тони не мог сомневаться, что находится в развивающейся стране. Главной проблемой, которую ему предстояло решить, была проблема беженцев. Тысячи преимущественно белых фермеров, спасающихся от продолжающихся этнических столкновений, протестовали против бездействия правительства Южной Африки. Однако чиновники настаивали на том, что делают все возможное, и что эта проблема раздувается до невероятных масштабов. Эббот знал лишь то, что число беженцев растет, и они требуют осуждения."
 abbott_saf_event.1.d.b: "Любопытно, что у Южной Африки три разные столицы. Этот факт Эбботу было трудно понять. Чтобы не замедлять темп, для простоты был выбран Йоханнесбург, и по прибытии первой остановкой стал мемориал Нельсона Манделлы. Эббот испытывал глубокое уважение к этому человеку и даже попросил приспустить флаги в Австралии на полмачты на этот день. Однако главной проблемой, которую ему предстояло решить, была проблема беженцев. Тысячи преимущественно белых фермеров, спасающихся от продолжающихся этнических столкновений, протестовали против бездействия правительства Южной Африки. Однако чиновники настаивали на том, что делают все возможное, и что эта проблема раздувается до невероятных масштабов. Эббот знал лишь то, что число беженцев растет, и они требуют осуждения."
 abbott_saf_event.1.b: "Осудите правительство и ускорьте выдачу виз беженцам."
 abbott_saf_event.1.a: "Они пользуются нашей поддержкой."
 indonesian_intervention_abbott.2.t: "Джакарта отклонила нашу просьбу."
 indonesian_intervention_abbott.2.d: "Как и ожидалось, правительство Индонезии отказало нам в просьбе разрешить миротворческие операции в стране и запретило нашим дипломатам дальнейшее обсуждение этой акции. Такой ответ не оставил нам иного выбора для выполнения нашего требования, кроме прямых действий. Тем временем, похоже, все сотрудничество замерло."
 indonesian_intervention_abbott.2.a: "Они вынуждают нас к этому."
 indonesian_intervention_abbott.3.t: "Джакарта одобряет наши миротворческие усилия."
 indonesian_intervention_abbott.3.d: "Похоже, ад замерз, или, может быть, Джакарта. Правительство Индонезии одобрило нашу просьбу о проведении миротворческой операции в стране. Это сотворит чудеса с нашей борьбой с терроризмом, и, поскольку мы сможем напрямую вмешиваться в угрозы, вероятность нового нападения в будущем значительно снизится."
 indonesian_intervention_abbott.3.a: "Это отличная новость!"
 oceanic_alliance_ast.1.t: "Переговоры об океаническом альянсе"
 oceanic_alliance_ast.1.d: "Правительство Канберры направило делегацию для обсуждения формирования официального альянса в океанической зоне с явным намерением присоединиться к нему. Присоединение фактически означало бы объединение наших вооруженных сил для поддержания оборонительных мер в Тихом океане, и австралийцы настаивают на том, что в случае реализации пакт позволит предотвратить потенциальные конфликты в регионе в обозримом будущем. Однако мы, безусловно, откажемся от определенного уровня автономии и, возможно, невольно привяжем себя к постоянно меняющейся внешней политике Австралии."
 oceanic_alliance_ast.1.a: "Достойное начинание."
 oceanic_alliance_ast.1.b: "Наша независимость важнее."
 oceanic_alliance_ast.2.t: "Новая Зеландия отклонила предложение альянса."
 oceanic_alliance_ast.2.d: "Похоже, правительство Новой Зеландии пока не сочло нужным формализовать альянс, полагая, что имеющихся у него оборонительных возможностей достаточно. Это, безусловно, разочаровывающий результат, но, возможно, есть и другие пути для рассмотрения."
 oceanic_alliance_ast.2.a: "Как им заблагорассудится."
 oceanic_alliance_ast.3.t: "Индонезия отклонила предложение альянса"
 oceanic_alliance_ast.3.d: "Похоже, правительство Индонезии пока не сочло нужным формализовать альянс, полагая, что имеющихся оборонительных возможностей достаточно. Это, безусловно, разочаровывающий результат, но, возможно, есть и другие пути для дальнейшего развития."
 oceanic_alliance_ast.4.t: "Папуа-Новая Гвинея отклонила предложение о сотрудничестве."
 oceanic_alliance_ast.4.d: "Похоже, правительство в Порт-Морсби пока не сочло нужным официально оформить альянс, посчитав свои нынешние оборонительные возможности достаточными. Это, безусловно, разочаровывающий результат, но, возможно, есть и другие пути для рассмотрения."
 oceanic_alliance_ast.5.t: "Вануату отклонило предложение о создании альянса."
 oceanic_alliance_ast.5.d: "Похоже, Республика Вануату пока не сочла нужным формализовать альянс, посчитав свои нынешние оборонительные возможности достаточными. Это, безусловно, разочаровывающий результат, но, возможно, есть и другие пути для рассмотрения."
 operation_sovereign_abbott.1.t: "Операция «Суверенные границы»"
 operation_sovereign_abbott.1.d: "Скотт Моррисон наклонился к Эбботу и схватил его за руку, пожимая её под вспышки фотокамер. Скотт был на несколько сантиметров выше его, и его рука застряла в хватке Скотта на несколько секунд дольше, чем ему хотелось. В частном порядке Моррисон представлял законопроект как непопулярный, но необходимый шаг для борьбы с растущей проблемой нелегальной миграции и предлагал возглавить его в случае негативной реакции. Эббот был достаточно опытен, чтобы понимать, что дело обстоит сложнее. Моррисон прославился своей закулисной работой, фактически выступая в роли партийного организатора, чтобы держать всех в узде. Следует признать, он был эффективен и очень быстро предлагал решения проблем, которые только он мог предвидеть. До сих пор он выполнял свою работу. Если он хотел получить признание, это было бы справедливо, ведь это была его политика. Поэтому Эббот согласился, и запуск законопроекта превратился в большой рекламный трюк для их правительства."
 operation_sovereign_abbott.1.a: "Улыбнитесь!"
 japan_subs_abbott.1.t: "Принятие решения о покупке"
 japan_subs_abbott.1.d: "Изначально планировалось приобрести 6 подводных лодок класса «Харусио» для замены устаревающего флота подводных лодок класса «Коллинз». Однако, учитывая необходимость огневой мощи в открытом море, мы могли бы вместо этого запросить покупку 3 легких эсминцев, базирующихся на вертолетах. Эти подводные лодки значительно увеличили бы численность нашего флота, а их модели обновлены до новейших технологий. С другой стороны, эсминцы класса «Мурасамэ» могли бы дать нам преимущество в воздухе и в плане огневой мощи."
 japan_subs_abbott.1.a: "Придерживайтесь субтитров."
 japan_subs_abbott.1.b: "Выбирайте эсминцы."
 japan_subs_abbott.2.t: "Запрос на покупку судна из Австралии"
 japan_subs_abbott.2.d: "Австралийцы обратились к нам с интересным предложением. Они предложили приобрести шесть наших устаревающих подводных лодок класса «Харусио» для пополнения своего флота за значительную сумму. Это укрепит наши оборонные связи и обеспечит дополнительное финансирование для замены подводных лодок."
 japan_subs_abbott.2.a: "Одобрить сделку."
 japan_subs_abbott.2.b: "Это не в наших интересах."
 japan_subs_abbott.3.d: "Австралийцы обратились к нам с интересным предложением. Они предложили приобрести три наших устаревающих лёгких эсминца класса «Мурасамэ» для пополнения своего флота за значительную сумму. Это укрепит наши оборонные связи и обеспечит дополнительное финансирование для замены кораблей."
 japan_subs_abbott.4.t: "Япония отказывается от продажи"
 japan_subs_abbott.4.d: "Неожиданно японское правительство отказалось от нашей сделки, предпочтя сохранить свой флот в его нынешнем размере. При таком раскладе они скоро будут называть нас НЕУДАЧЛИВОЙ страной."
 japan_subs_abbott.4.a: "Этого не может быть..."
 japan_subs_abbott.5.t: "Япония одобрила продажу"
 japan_subs_abbott.5.d: "Япония одобрила запрос на продажу, и корабли вскоре будут переданы в состав нашего флота. Это обеспечит нам столь необходимую дополнительную огневую мощь на море."
 japan_subs_abbott.5.a: "Отличные новости."
 abbott_condemns_china.1.t: "Тони Эбботт осуждает экспансию Китая."
 abbott_condemns_china.1.d: "Австралиец [GetASTLeaderTitle]Недавняя позиция Либеральной партии в отношении Китая обеспокоила ветеранов партии и вызвала поддержку избирателей, которые заняли новую позицию против создания страной искусственных островов. \n\nНа вчерашней пресс-конференции лидер осудил недавние действия Китая, поскольку \"Величайшее расширение военной мощи в мирное время.\" Требование срочного усиления собственных вооруженных сил Австралии для поддержания сдерживания. Акцент на размещении большего количества кораблей и самолетов в Восточной Азии с целью исключить страну из критически важных цепочек поставок. \n\nПосле этого заявления китайские чиновники осудили эту позицию и назвали Тони Эббота подстрекателем к противоправным действиям. \"Антикитайская истерия.\" Вне зависимости от намерений, напряженность между двумя странами, похоже, достигнет критической точки."
 abbott_condemns_china.1.a: "Это грозовые тучи?"
 kuala_lumpur_abbott.1.t: "Торговое соглашение о нейтралитете"
 kuala_lumpur_abbott.1.d: "Объём торговли минеральными ресурсами между нами и Австралией вырос до такой степени, что австралийское правительство обратилось к нам с предложением обсудить заключение соглашения о свободной торговле. Условия сделки включают снижение нами пошлин на уголь, алюминий и другие минеральные ресурсы, а также на некоторые товары, импортируемые из-за рубежа. Взамен Австралия снизит свои пошлины на экспорт нашей сырой нефти, электроники и транспортного оборудования. Однако часть соглашения предусматривает, что мы объявим о своем нейтралитете в нынешних разногласиях с Китаем, что фактически означает лишь подписание нами пакта о ненападении."
 kuala_lumpur_abbott.1.a: "Справедливое соглашение."
 kuala_lumpur_abbott.1.b: "Это слишком многого просить."
 kuala_lumpur_abbott.2.t: "Малайзия подписала соглашение."
 kuala_lumpur_abbott.2.d: "Наши друзья в Малайзии подписали торговое соглашение и официально заключили пакт о сохранении дипломатического нейтралитета в наших вопросах. Это позволит беспрепятственно обмениваться полезными ископаемыми и сельскохозяйственной продукцией между нами. Еще одна часть архипелага была исключена из рассмотрения."
 kuala_lumpur_abbott.2.a: "Очень хороший."
 kuala_lumpur_abbott.3.t: "Малайзия отказалась от соглашения о нейтралитете."
 kuala_lumpur_abbott.3.d: "Несмотря на наши благие намерения, Малайзия отказалась давать какие-либо обещания и отклонила наше торговое соглашение. К сожалению, часть архипелага по-прежнему остается предметом переговоров."
 kuala_lumpur_abbott.3.a: "Кто бы мог подумать, что дипломатия может быть такой сложной."
 jap_repar_abbott.1.t: "Австралия требует репараций за Вторую мировую войну."
 jap_repar_abbott.1.d: "Любопытно, что австралийское правительство связалось с нами, чтобы договориться о весьма запоздалых выплатах за свои расходы во время Второй мировой войны. Эта просьба озадачила большинство чиновников, которые в течение десятилетий после войны считали наши отношения со страной в целом позитивными. Тем не менее, их правительство, похоже, настроено серьезно и выслало нам довольно крупную сумму."
 jap_repar_abbott.1.a: "Просто заплати."
 jap_repar_abbott.1.b: "Наверное, это какая-то шутка?"
 jap_repar_abbott.2.t: "Япония согласилась выплатить репарации"
 jap_repar_abbott.2.d: "Похоже, их правительство понимает наши беды и согласилось выплатить нам единовременную сумму напрямую для покрытия расходов на войну. Они не собираются идти на компромисс. В порту Дарвина состоится официальная церемония с участием японской делегации, и будет создано ведомство для содействия передаче репараций. Несмотря на всю нерегулярность мероприятия, СМИ воспринимают его благосклонно, а оппозиционные партии в основном хранят молчание."
 jap_repar_abbott.2.a: "Теперь старые раны могут зажить."
 jap_repar_abbott.3.t: "Япония отказывается от репараций"
 jap_repar_abbott.3.d: "В довольно неловком повороте событий японское правительство отказало в просьбе и принялось критиковать нас по национальному телевидению. Конечно, наше правительство, должно быть, в сговоре, потому что все крупные телеканалы высмеивают всю эту ситуацию, и это лишь усугубляется тем, как нас критикуют в Палате представителей и Сенате. Несколько протестующих даже были замечены у здания парламента с плакатами, изображающими Эббота в образе нищего, сидящего перед японским посольством."
 jap_repar_abbott.3.a: "Не стоит это навязывать."
 jap_alliance_abbott.1.t: "Взаимный альянс из Австралии"
 jap_alliance_abbott.1.d: "Австралия предложила пакт о взаимной безопасности, детали которого предусматривают призыв к войне в случае конфликта между любой из стран и Китаем. Пакт, по всей видимости, направлен на предотвращение дальнейших столкновений с Китаем в целях защиты Тихоокеанского региона."
 jap_alliance_abbott.1.a: "В этом мы едины."
 jap_alliance_abbott.1.b: "Это уже перебор."
 jap_alliance_abbott.2.t: "Йокогамское соглашение"
 jap_alliance_abbott.2.d: "Правительство Токио подписало пакт, создав между нами альянс в сфере безопасности. В случае конфликта между нами и Китаем, Япония будет призвана вмешаться. Еще один игрок присоединился к нам."
 jap_alliance_abbott.2.a: "Почетный союз"
 jap_alliance_abbott.3.t: "Япония отказывается от соглашения"
 jap_alliance_abbott.3.d: "После необычного молчания японских делегатов, [GetASTLeaderTitle] получил видеозвонок от своего японского коллеги. Разговор был долгим и затянутым, и за пределами офиса PMS доносились лишь невнятные крики, но после того, как он в конце концов перерос в своего рода танцевальный баттл, переговоры были прекращены."
 jap_alliance_abbott.3.a: "Возможно, это наихудший исход."
 france_abbott_ast.1.t: "Аренда острова"
 france_abbott_ast.1.d: "Правительство Австралии обратилось к нам с предложением арендовать землю на островах Новой Каледонии для военных нужд на 5 лет. Они заверили нас, что аренда обеспечит дальнейшую стабильность в Тихом океане в рамках их недавних миротворческих операций, и предложили 39 миллиардов за землю и права на размещение военных баз."
 france_abbott_ast.1.a: "Справедливая сделка."
 france_abbott_ast.1.b: "Эти острова принадлежат только нам."
 france_abbott_ast.2.t: "Аренда Новой Каледонии"
 france_abbott_ast.2.d: "Франция с радостью одобрила аренду, предоставив нам фактическое право расширять наше военное присутствие и инфраструктуру на окружающих островах в течение следующих 5 лет."
 france_abbott_ast.2.a: "Наша аудитория расширяется."
 france_abbott_ast.3.t: "Договор аренды острова сорвался."
 france_abbott_ast.3.d: "Франция отклонила наше предложение об аренде островов на данный момент и фактически оставила нас в стратегически невыгодном положении. Нам нужно будет найти другой способ обезопасить наш восточный фланг."
 france_abbott_ast.3.a: "Это была отличная сделка!"
 france_abbott_ast.4.t: "Срок действия договора аренды острова подходит к концу."
 france_abbott_ast.4.d: "Срок аренды Австралией островов Новой Каледонии для размещения военных объектов подходит к концу. Мы можем предложить им продление еще на 5 лет или потребовать возврата островов."
 france_abbott_ast.4.a: "Пусть продлят аренду."
 france_abbott_ast.4.b: "Пришло время им вернуться в лоно организации."
 france_abbott_ast.5.t: "Франция предлагает продление срока"
 france_abbott_ast.5.d: "Поскольку срок нашей аренды на островах Новой Каледонии подходит к концу, Франция обратилась к нам с предложением продлить его еще на 5 лет."
 france_abbott_ast.5.a: "Разумное предложение."
 france_abbott_ast.5.b: "Они могут забрать их обратно."
 france_abbott_ast.6.t: "Срок аренды острова истекает."
 france_abbott_ast.6.d: "Поскольку срок нашей аренды островов Новой Каледонии подходит к концу, Франция потребовала от нас вернуть острова и вывести дислоцированные там войска."
 france_abbott_ast.6.a: "Разумная просьба."
 france_abbott_ast.6.b: "Теперь они НАШИ."
 france_abbott_ast.7.t: "Острова Новой Каледонии вернулись"
 france_abbott_ast.7.d: "Австралия незамедлительно вернула арендованные острова и, как обычно, поблагодарила нас за их использование."
 france_abbott_ast.7.a: "Удачная сделка."
 france_abbott_ast.8.t: "Австралия отказывается уступать острова."
 france_abbott_ast.8.d: "Проявив невероятную наглость, австралийское правительство отказалось уступить острова. Оно даже отказалось оплатить продление аренды, фактически незаконно оккупировав острова. Хотя дипломатический спор, граничащий с военной интервенцией, исключен, нам придется протестовать против оккупации на мировой арене."
 france_abbott_ast.8.a: "Это возмутительно!"
 middlepower_abbott.1.t: "Австралия ищет альянс"
 middlepower_abbott.1.d: "Австралия предложила нам соглашение о взаимной безопасности, детали которого могут спровоцировать войну в случае конфликта между любой из стран и Китаем. Суть предложения заключается в попытке изолировать Китай и ограничить его сферу влияния в Тихом океане. Однако соглашение не включает Северную Корею и может сделать нас мишенью, учитывая нашу близость к Китаю. Несмотря на это, Австралия заверила нас, что пакт заключен лишь в качестве сдерживающего фактора."
 middlepower_abbott.1.a: "Достойное занятие."
 middlepower_abbott.1.b: "Этого недостаточно."
 middlepower_abbott.2.t: "Осложнения альянса"
 middlepower_abbott.2.d: "Южная Корея настаивает на дополнительных гарантиях в сфере обороны в рамках договора, учитывая ее непосредственную близость к Северной Корее, которая поддерживает Китай. Мы можем постепенно ввести их в курс дела с помощью программ подготовки войск и поддержки производства, но это, безусловно, будет дорогостоящим. Наш выбор зависит от того, насколько высоко мы ценим поддержку Кореи."
 middlepower_abbott.2.a: "Умеренный договор, чтобы их привлечь."
 middlepower_abbott.2.b: "Всё что угодно и вся."
 middlepower_abbott.2.c: "Это слишком дорого."
 middlepower_abbott.3.t: "Австралия выдвигает встречные предложения по оказанию помощи в сфере обороны."
 middlepower_abbott.3.d: "В попытке спасти договор австралийцы выдвинули встречное предложение о программе совместной подготовки войск и предоставлении своих экспертов для оказания помощи в производстве нашего оружия. Это, несомненно, существенное предложение. Они явно надеются, что мы его примем."
 middlepower_abbott.3.a: "Мы приветствуем их поддержку."
 middlepower_abbott.3.b: "Это всё равно того не стоит."
 middlepower_abbott.4.t: "Австралия предлагает встречные предложения со значительной помощью."
 middlepower_abbott.4.d: "В попытке спасти договор австралийцы выдвинули весьма существенное встречное предложение. Речь идёт о масштабной программе совместной подготовки войск и поддержке производства вооружений, включая контракты на сборку на заводах, кредиты на закупку и привлечение технических экспертов для содействия в реализации. Они явно делают всё возможное в надежде, что мы примем это предложение."
 middlepower_abbott.4.a: "Мы приветствуем их поддержку."
 middlepower_abbott.4.b: "Это всё равно того не стоит."
 middlepower_abbott.5.t: "Соглашение о вступлении в силу подписано."
 middlepower_abbott.5.d: "В посольстве в Сеуле наши и южнокорейские дипломаты подписали Корейско-австралийский договор о взаимном гарантировании, гарантирующий, что обе наши страны окажут друг другу поддержку в случае войны, угрожающей безопасности этой страны. Теперь мы как никогда близки, и еще одна страна пришла нам на помощь в борьбе за Тихий океан."
 middlepower_abbott.5.a: "Добро пожаловать на борт."
 middlepower_abbott.6.t: "Переговоры зашли в тупик."
 middlepower_abbott.6.d: "Переговоры между нами и корейцами, похоже, провалились. Несмотря на хорошие отношения, они вышли из переговоров из-за собственных опасений по поводу безопасности. Наша работа по сдерживанию распространения вируса должна будет продолжаться без их участия."
 middlepower_abbott.6.a: "Корейский тигр спит."
 abbott_china_occupation.1.t: "Стратегия отрицания"
 abbott_china_occupation.1.d: "В темной комнате Тони Эбботт и остальные члены военного кабинета наблюдали, как на светящемся экране чередовались аэрофотоснимки, спутниковые изображения и кадры наблюдения за транспортными средствами с войсками. Была ночь, и изображение было прерывистым, но эмблема Народно-освободительной армии была четким. Враг высадился на берег. Сердце Эбботта сжалось. Он откинулся на спинку стула и провел ладонями по лбу. В зале воцарилась тишина, нарушаемая лишь тем, что аналитик поставил видео на паузу и начал брифинг. Их первоочередной задачей было контролировать ход событий, но, несомненно, видео уже распространялось в интернете, и это, похоже, стало худшей ошибкой в ​​национальной обороне в истории страны. С этого момента борьба будет нелегкой. Наступила неловкая тишина, пока аналитик ждал комментариев премьер-министра. Лицо Эбботта, искаженное задумчивостью, выражало смесь суровости и отрешенности. Наконец он повернулся к остальным присутствующим. \"Слушайте, на данном этапе совершенно очевидно, что, ну, всякое случается.\""
 abbott_china_occupation.1.a: "В данном случае — да."
 abbott_shirtfronting_china.1.t: "Очаг конфликта в море"
 abbott_shirtfronting_china.1.d: "С нашего флота в Южно-Китайском море поступают отрывочные сообщения. Хотя большинство из них отрывочны, и ситуация до сих пор неясна, похоже, что на отмели произошло столкновение. \n\nПосле того, как наши корабли были развернуты для патрулирования отмели Скарборо, они столкнулись с находящимся поблизости китайским флотом. Этот флот потребовал, чтобы наши корабли покинули этот район, и вскоре после того, как наши корабли отказались это сделать, один из китайских кораблей открыл огонь. Между ними произошла кратковременная перестрелка, после чего наш корабль отступил. Два наших фрегата были потеряны, на данный момент четыре человека погибли. \n\nС тех пор, как мы узнаем об этом по мере развития событий, от Китая не поступало никакой реакции. Теперь нам решать, как действовать дальше. Сейчас мы находимся на грани."
 abbott_shirtfronting_china.1.a: "Найдите стыковочный рейс в Пекин."
 abbott_shirtfronting_china.1.b: "Это откровенное нападение. Мы не можем демонстрировать слабость."
 abbott_shirtfronting_china.2.d: "С австралийским кораблём [GetASTLeaderTitle] связались напрямую для обсуждения ситуации в Южно-Китайском море. Хотя наши сообщения всё ещё поступают, очевидно, что между нашим флотом, дислоцированным там, и австралийским патрулём произошла стычка вблизи отмели Скарборо. Согласно сообщению, один из наших эсминцев произвёл предупредительный выстрел над австралийскими кораблями, что и спровоцировало обмен ударами. На данный момент три человека погибли, флот получил незначительные повреждения. Однако австралийцы, по всей видимости, потеряли два корабля и, возможно, пять своих. Их лидер теперь требует, чтобы мы вывели наши корабли из этого района и согласились на переговоры по деэскалации. Эта наглость, безусловно, раздражает, но ситуация может превратиться в кошмар на мировой арене, если мы не пойдём на уступки."
 abbott_shirtfronting_china.2.a: "Лишь бы предотвратить войну."
 abbott_shirtfronting_china.2.b: "Дракон не пресмыкается перед овцами."
 abbott_shirtfronting_tt: "Мы временно отведем наши корабли от отмели."
 abbott_shirtfronting_china.3.t: "Отставка"
 abbott_shirtfronting_china.3.d: "Китайское правительство согласилось вывести свои корабли из региона. На какое-то время казалось, что наши страны неизбежно идут к войне, но мы чудом избежали этого. Хотя напряженность все еще высока, они предложили направить делегацию в Канберру, чтобы выработать конкретные решения для предотвращения повторения подобных инцидентов. Мы много пострадали за это, но это небольшая победа."
 abbott_shirtfronting_china.3.a: "Ещё одна война предотвращена."
 abbott_shirtfronting_china.4.t: "Тишина"
 abbott_shirtfronting_china.4.d: "Связь прервалась, и звук на другом конце линии оборвался. Китайцы не желают обсуждать условия деэскалации, несмотря на то, что полностью осведомлены об инциденте. Мы стоим на распутье. Если Китай продолжит такую ​​безоговорочную эскалацию, мы, по сути, окажемся на уровне войны без сопротивления. С другой стороны, от пустого заявления пути назад практически нет."
 abbott_shirtfronting_china.4.a: "Мы должны отступить."
 abbott_shirtfronting_china.4.b: "Если они хотят войны..."
 call_japan_to_our_side_ast: "Призовите Японию на нашу сторону"
 call_kor_to_our_side_ast: "Призовите Южную Корею на нашу сторону."
 call_roc_to_our_side_ast: "Призовите Тайвань на нашу сторону"
 abbott_call_to_arms.1.t: "Австралия призывает нас к оружию"
 abbott_call_to_arms.1.d: "В соответствии с подписанным между нашими странами соглашением, в связи с нынешним конфликтом между ними и Китаем, Австралия призвала нас соблюдать пакт и присоединиться к борьбе."
 abbott_call_to_arms.1.a: "Тогда на войну."
 malcolm_abbott_event.4.t: "В комнату «Обезьянья капсула»"
 malcolm_abbott_event.4.d: "Тони сидел в пустом зале парламента, и единственным его спутником было гул гаснущей лампочки над головой. Его мысли возвращались к времени, проведенному в Улуру, во время его первого забега на длинную дистанцию. Весь путь был мучительным. Тони был не в состоянии принять вызов, и он несколько раз чуть не сдался, но никогда не чувствовал себя свободнее, чем в тот момент. В глубинке вокруг не было ничего. Только свист колышущегося на ветру куста вичити и палящее солнце. Когда он финишировал, это стало началом его долгой любви к марафонам и соревнованиям «железный человек». Изнурительный характер этих забегов стал проверкой характера, и теперь, будучи президентом, он испытывал похожие муки, но работа всегда того стоила. Однако на этот раз все было иначе. Путешествие подходило к концу. Когда все либеральные парламентарии бросились голосовать, Тони потерпел поражение со счетом 44 против 54. Новым лидером стал Малкольм Тернбулл. Политика порождала нелояльность, но это все равно ощущалось как удар в спину. Его немного утешало то, что, как и обещал, он стал неудачником, а не сдавшимся."
 malcolm_abbott_event.4.a: "Марафон закончился."
 malcolm_abbott_event.5.t: "Малкольм Тернбулл принес присягу под именем [GetASTLeaderTitle]"
 malcolm_abbott_event.5.d: "На лужайке перед зданием парламента Малкольм Тернбулл произнес свою первую речь в качестве нового лидера Либеральной партии и премьер-министра, пообещав \"обширный\" изменения, которые приведут к... \"правительство XXI века\"Тернбулл объявил о назначении на должности членов кабинета министров, в состав которого войдут как новички, так и ветераны партии, в том числе Скотт Моррисон и Кристофер Пайн, а также привлек внимание к назначению пяти дополнительных женщин. \n\n\"Мы должны быть более конкурентоспособными, мы должны быть более продуктивными и — мы должны быть более инновационными.\" новый [GetASTLeaderTitle] заявили, что подготавливает правительство к принятию более технократического курса. \n\nХотя раны еще свежи в глазах консервативных радикалов в партии, большинство поддержало восхождение Тернбулла, что привело к раннему росту популярности либералов в опросах общественного мнения после его свержения."
 malcolm_abbott_event.5.a: "За будущее!"
 aus_war_on_terror_abbott.1.t: "Предлог для войны"
 aus_war_on_terror_abbott.1.d: "Тони вытер пот со лба и оглядел комнату, полную занятых представителей СМИ, спешащих к месту выступления. Принесенные лампы ужасно нагревались, и Тони надеялся, что все закончится как можно быстрее. За последний месяц у него было слишком много пресс-конференций и встреч с представителями разведки, и теперь его задачей было убедить нацию в необходимости этого. Телесуфлер выкатили вперед, и все замолчали. Тони откашлялся. В своем обращении к нации он упомянет имя, которым СМИ бомбардировали общественность в течение нескольких месяцев. Это имя – «Джемааш Исламия». «Джемааш Исламия» – это связанная с «Аль-Каидой» террористическая сеть, которую ASIS уверенно обвиняла в терактах на Бали и нападении на посольство. Они наносили нам удары снова и снова, и когда мы наконец нашли их убежище, индонезийцы отказали нашим войскам во въезде. По сути, они стали «укрывателями террористов», как утверждал Тони. Верила ли в это общественность или нет, в значительной степени не имело значения. Решение было принято до выступления. Речь шла всего лишь о прокладке железнодорожных путей."
 aus_war_on_terror_abbott.1.a: "\"Пришло время дать отпор.\""
 the_canberra_treaty_abbott.1.t: "Канберрский договор"
 the_canberra_treaty_abbott.1.d: "После прибытия в Канберру условия договора уточнили демилитаризацию островов Спратли, ограничение производства нашего флота и соглашение о неконфронтации между нами, Австралией и Филиппинами. Это сгладило бы катастрофические последствия столкновения флотов, однако это равносильно унижению, ограничивающему передвижение на нашей собственной территории. Хотя договор носит временный характер, он пользуется поддержкой некоторых наших основных торговых партнеров. Последствия отказа от него были бы значительными."
 the_canberra_treaty_abbott.1.a: "Для сохранения мира."
 the_canberra_treaty_abbott.1.b: "Они просто мечтают, если думают, что мы подпишем соглашение."
 the_canberra_treaty_abbott.2.t: "Подписание договора"
 the_canberra_treaty_abbott.2.d: "Китайская и филиппинская делегации прибыли в Канберру в самые ранние часы утра, чтобы предотвратить начало встречи. Когда она началась, между ними царило лишь тихое негодование. Тот факт, что китайские представители не покинули зал при первом же взгляде на договор, был хорошим знаком. Это был своего рода ритуал унижения для них, но с последствиями, которых нельзя было избежать. В итоге было достигнуто соглашение о демилитаризации вод вокруг отмели Скарборо и островов Спратли. Китай также обязался ограничить производство флота и патрульные операции, а также заключил соглашение о неконфронтации. Это был не тот нокаутирующий удар, на который мы, возможно, рассчитывали, но сегодня нам удалось разрушить иллюзию китайского превосходства. Их фарфоровая броня повреждена, и китайская сфера влияния взята под контроль. По крайней мере, на данный момент."
 the_canberra_treaty_abbott.2.a: "Мир в наше время!"
 the_canberra_treaty_abbott.3.t: "Китайцы уходят"
 the_canberra_treaty_abbott.3.d: "Вполне ожидаемо, во время обсуждения условий договора китайские делегаты просто встали и покинули конференц-зал. Как нам известно, они уже добрались до аэропортов, чтобы отправиться домой. Это нагло, но мы знали, что условия договора рискованны. Это не стало тем нокаутом, на который мы могли бы надеяться, и уход делегатов был довольно дипломатическим провалом, но сегодня нам удалось разрушить иллюзию китайского превосходства. Их фарфоровая броня потрескалась, и китайская сфера влияния показала свою уязвимость. На данный момент США, наряду с множеством других стран, присоединились к нам в введении санкций против Китая в качестве ответной меры."
 the_canberra_treaty_abbott.3.a: "Мы сделали все, что могли."
 starbucks_event_ast.1.t: "Назревают трудности"
 starbucks_event_ast.1.d: "С новых, блестящих столешниц сняли непрозрачные простыни, распаковали и расставили стулья. Зеленый сигнал зазвучал на улицах Сиднея: по всей стране открылось 87 новых магазинов, и к 5 утра очередь уже растянулась на целый квартал. Starbucks был частью недавней волны американских сетей быстрого питания, появившихся в стране, и менеджеры, также приехавшие из США, с нетерпением ждали возможности принять участие в запуске. Когда двери открылись, поток посетителей хлынул внутрь, а вместе с ними и репортеры, чтобы задокументировать событие. Магазин был полон покупателей, а затем, через несколько часов, их стало меньше. Когда гости ушли, магазин, по сравнению с уменьшающейся толпой снаружи, был на удивление пуст. Время от времени заходили несколько человек, в основном туристы, но в основном было тихо. Так продолжалось до конца недели, а затем, после нескольких месяцев низких показателей по всей стране, большинство магазинов закрылись."
 starbucks_event_ast.1.a: "Выживают только сильнейшие."
 econ_costello_events.1.t: "Красная грязь и свет прожектора"
 econ_costello_events.1.d: "Стоя под палящим солнцем, с ужасным запахом, витающим в воздухе, и спиной, пропитанной потом, Костелло чувствовал себя в своей стихии. Гигантская башня позади них, громко качающая нефть, была опорой их знаменательной сделки. Большая часть деталей была доставлена ​​из Соединенных Штатов и собрана здесь менее чем за месяц. Десятки подобных сооружений будут построены по всему Квинсленду и Южной Австралии. Компания Lufkin Industries занималась всей операцией, поэтому ни копейки от правительства не поступало. И все же мы будем пожинать плоды. Пыль начала подниматься и прилипать к их костюмам, поэтому Костелло и представители компании поспешно закончили фотосессию. Удивительно много компаний стучались в двери теперь, когда правительство стало восприниматься как явно поддерживающее нефть, и Lufkin была только первой. В представлении Питера уголь стал лишь временным благом. Оно обеспечивало электроснабжение и отопление домов, но это было не топливо, которое поддерживало огонь в остальном мире. Следующая горнодобывающая лихорадка будет связана с нефтью."
 econ_costello_events.1.a: "Это просто выгодный бизнес."
 econ_costello_events.2.t: "Экспортный бум"
 econ_costello_events.2.d: "По мере укрепления наших связей с Китаем наша экспортная экономика переживает бурный рост. Объемы торговли с ними значительно увеличились за относительно короткий период времени, а поставки угля и критически важных полезных ископаемых осуществляются в рекордно высоких темпах. Вероятно, эта тенденция сохранится в течение нескольких месяцев."
 econ_costello_events.2.a: "Добыча достанется нам."
 econ_costello_events.3.t: "Одна ночь в Пекине"
 econ_costello_events.3.d: "Когда Питер и остальные члены кабинета министров иностранных дел прибыли в Пекин, это был первый раз, когда он увидел город после саммита G20, и за эти несколько лет городской пейзаж уже сильно изменился. Стремление Китая сократить экономический разрыв привело к тому, что он практически обогнал своих соседей, а его города превратились в разрастающиеся массивы внушительных стеклянных монолитов. Любая доля этого роста, которую Австралия могла получить, была бонусом. Из аэропорта их доставили на машине в «Большой зал народных собраний». В глазах Питера это было бруталистское, почти советское здание. Правда, смог был менее заметен, чем они ожидали, и на улице, как ни странно, было очень мало машин. Они добрались до комнаты, где их должны были встретить министр иностранных дел и китайские делегаты, но прошло почти два часа, а никто не пришел. Наконец, неопрятный Александр Даунер, спотыкаясь, вошел. Фыркнув и поправив галстук, он извинился за задержку, и встреча наконец началась. Это стало бы крупнейшей единовременной инвестицией в истории страны и настоящим подарком судьбы для нашего сельскохозяйственного экспорта. Дюжина компаний открыла бы свои предприятия в наших городах и пригородах, и рабочие места перешли бы к работникам, причем работа была бы организована таким образом, чтобы охватить наиболее нуждающиеся районы. Когда они пожали друг другу руки и уехали, эта поездка, безусловно, была самой странной на памяти Питера."
 econ_costello_events.3.a: "Но все же это самый плодотворный вариант."
 econ_costello_events.4.t: "Рынок недвижимости наводнен грязными деньгами."
 econ_costello_events.4.d: "Попытки правительства стимулировать продажи на рынке недвижимости, привлекая китайских инвесторов, похоже, принесли не только приток желающих купить жилье. Вчерашний рейд по продаже недавно проданного высотного здания в Перте выявил сеть отмывания денег и незаконного финансирования, которая простирается вплоть до сбора средств для Либеральной партии, поскольку один из задержанных инвесторов оказался крупным спонсором партии. Группы, отслеживавшие сеть до рейда, отметили, что десятки иностранных покупателей из Китая могли использовать рынок недвижимости, чтобы обойти ограничения Пекина на отток капитала. Реакцией Китая стал немедленный запрос на экстрадицию причастных лиц. Эта реакция может указывать на то, что теплые отношения могут внезапно закончиться."
 econ_costello_events.4.a: "Ни одна удачная инвестиция не остаётся безнаказанной..."
 costello_in_the_mines.1.t: "Горнодобывающие корпорации наносят ответный удар."
 costello_in_the_mines.1.d: "Ещё до объявления о начале расследования информация просочилась в крупные горнодобывающие корпорации, которые теперь бросают в нас все силы, чтобы замедлить работу комиссии. В наш адрес уже подано множество судебных исков, и несколько шахт уже закрылись в знак протеста. Хуже того, похоже, к ним присоединяются СМИ. Даже без формального обвинительного приговора вся наша добрая воля к шахтам практически испарилась, а некоторые магнаты начали финансировать оппозицию и более националистические партии, такие как «Одна нация», что поставило партию в неловкое положение с точки зрения будущего финансирования. Мы окончательно разгромили осиное гнездо."
 costello_in_the_mines.1.a: "Гниль необходимо искоренить любой ценой."
 costello_in_the_mines.2.t: "Результаты расследования"
 costello_in_the_mines.2.d: "Комиссия наконец представила нам свои выводы, и результат поразителен. На десятках шахт, особенно в транспортном секторе, были обнаружены сотни незаконно нанятых рабочих. Некоторые из них проработали в компаниях годами. Реакция горнодобывающих корпораций, как и ожидалось, осталась спокойной, и пока идут судебные разбирательства, перед нами встает сложный вопрос: как справиться с сотнями новых мигрантов в стране."
 costello_in_the_mines.2.a: "Непрозрачная отрасль."
 costello_in_the_mines.3.t: "Управление работниками"
 costello_in_the_mines.3.d: "В результате расследования в стране обнаружено более трехсот мигрантов. Почти половина из них работает в горнодобывающем секторе более двух лет. СМИ и некоторые члены нашего кабинета министров настаивают на немедленной депортации мигрантов с использованием имеющихся возможностей. Однако, учитывая уровень подготовки мигрантов, мы могли бы выдать им временные визы для продолжения работы. Это предотвратило бы внезапную потерю доходов для шахт, но такой шаг не будет пользоваться популярностью."
 costello_in_the_mines.3.a: "Депортируйте их."
 costello_in_the_mines.3.b: "Пусть остаются."
 costello_in_the_mines.4.t: "Предложения из Аравии"
 costello_in_the_mines.4.d: "Наследный принц и премьер-министр Австралии, [SAU.GetLeader], напрямую обратился к нам с этой просьбой. Они предлагают крупные инвестиции в нашу текущую добычу критически важных полезных ископаемых в обмен на снятие некоторых ограничений на инвестиции их страны в Австралию. Они проявили особый интерес к нашему спорту, и разрешение им инвестировать могло бы значительно расширить охват нашей индустрии развлечений, хотя мы и откроем двери для страны, не столь контролирующей ситуацию."
 costello_in_the_mines.4.a: "Справедливое предложение."
 costello_in_the_mines.4.b: "Давайте не будем подходить слишком близко."
 costello_republic_events.1.t: "Преодоление стен Сената"
 costello_republic_events.1.d: "В отличие от нашей последней попытки протолкнуть вопрос о республиканской политике через парламент, голоса пока просто не на нашей стороне. Жесткий политик Тони Эбботт снова присоединился к антиреспубликанской толпе, как и в 1999 году, выступая в качестве представителя во время парламентских слушаний и фактически расколов партию. Его умение создавать нам проблемы в СМИ также проявилось в полной мере: он использует любую возможность, чтобы вести против нас кампанию. Если мы не сможем провести это через сенат, даже не вынося вопрос на референдум, наши шансы будут потеряны, и наша ограниченная поддержка внутри партии начнет рушиться. Возможно, нам придется начать искать другие способы привлечения голосов."
 costello_republic_events.1.a: "Впереди нас ждет непростой путь."
 costello_republic_events_abbott_tt: "§YОппозиция будет работать против нас и впредь.§!"
 costello_republic_events.2.t: "Получение голосов"
 costello_republic_events.2.d: "Кевин Радд был, пожалуй, самым скользким политиком в парламенте. Говард его ненавидел, даже его собственная партия, похоже, его недолюбливала. Каким-то образом он пробрался на вершину лейбористской партии, и теперь он был нашим главным препятствием на пути к получению голосов. Радд попросил встретиться в одном из кафе возле здания парламента, вероятно, с единственной целью — дать папарацци возможность сфотографировать его и [GetASTLeaderTitle] вместе. Лишь бы поднять его авторитет и закидать нас грязью. Он, как обычно, опоздал и настоял на том, чтобы остаться на еду. Заказали блинчики с уткой и стейк, что бы это ни было, и тут Радд наконец-то вступил в игру. Лейбористы пытались провести свою новую программу расширения Medicare, которая, несомненно, должна была быть подавлена ​​нашей партией. Проще говоря, это был обмен услугами: одним движением руки он давал нам голоса, необходимые для принятия законопроекта в Сенате, и оказывал нам поддержку. Хотя цена была довольно высокой."
 costello_republic_events.2.a: "Есть ли у нас выбор?"
 costello_republic_events.3.t: "Нестандартное согласие"
 costello_republic_events.3.d: "Передав законопроект генерал-губернатору, мы с удивлением обнаружили, что он был одобрен без каких-либо проблем. Они даже, похоже, готовы нам помочь, дойдя до того, что поддержали идею республики в средствах массовой информации. Теперь, когда мы получили их одобрение, мы можем рассмотреть возможность внесения других поправок в новую конституцию. Конечно, работа еще не закончена. Нам все еще потребуется поддержка общественности, прежде чем мы сможем снова провести законопроект через сенат. В отличие от 1999 года, на этот раз мы должны продолжать мобилизовывать общественность и не позволять импульсу угасать."
 costello_republic_events.3.a: "Давайте приступим."
 costello_republic_events.4.t: "Австралийцы отменяют монархию"
 costello_republic_events.4.d: "Сегодня Сидней и другие крупные города были усеяны зелеными, желтыми и синими баннерами. Это инициатива движения «Республика Австралия» в преддверии результатов референдума. По итогам голосования, 63% проголосовали за республику, при поддержке четырех из пяти необходимых штатов. Хотя законопроект еще должен пройти через парламент, прежде чем он будет признан законом, его результаты фактически отменили австралийский монархизм. \n\nДолжность генерал-губернатора будет упразднена, потребуется ввести новый флаг, а титул премьер-министра вскоре изменится, чтобы отразить новую модель правления. Республиканцы провели оставшиеся часы дня, празднуя на улицах, и хотя оппозиционному движению не удалось сохранить статус-кво, его лидер, либеральный политик Тони Эбботт, признал, что эти изменения вывели Австралию на путь к... \"Светлое будущее.\""
 costello_republic_events.4.a: "Окончательно."
 costello_republic_events.4.b: "Удивительная перемена."
 costello_in_the_mines.5.t: "Встреча с магнатом"
 costello_in_the_mines.5.d: "Устроить встречу с Рупертом Мердоком было несложно. Так уж получилось, что генеральный директор Newscorp регулярно связывался с офисом Питера и очень хотел встретиться и обсудить политику. Каким-то образом прошло уже полдесятилетия с момента их последней встречи, но когда они встретились снова, Руперт выглядел так, будто ничуть не постарел. \n\nБольшинство знали, что он возглавляет Newscorp и половину входящих в него газет, но мало кто знал, к скольким горнодобывающим проектам он был причастен. Когда Питер пытался поднять идею налоговой реформы в горнодобывающей отрасли, Руперт каждый раз отвергал её. Одобрение магната должно было дать толчок к действиям, но эта возможность быстро ускользала. \n\nКогда они наконец добрались до шахт, Руперт долго и нудно рассуждал о Джилонге и избирателях из числа рабочих. Избирательный округ Питера был в Джилонге, поэтому он не упустил этот момент из виду, но если он хотел что-то доказать, ему нужно было сделать это сейчас. \n\n\"После пяти лет экономического роста налоговая реформа вряд ли покажется чем-то уж слишком радикальным. Остальным же должна быть какая-то награда. \n\n\"Награда?\" Руперт затаил дыхание, словно старик произносил оскорбительное слово. \"Я помню времена, когда партия выступала против «большого правительства». Уверен, вы знаете, что нужно партии сейчас.\" \n\nНа этом Руперт поблагодарил его за уделенное время, и они попрощались. Это была совсем не та ступенька, на которую он надеялся; на самом деле Костелло вообще не знал, что думать об этой встрече. Он мог только надеяться, что у него дела обстоят не хуже, чем у Говарда."
 costello_in_the_mines.5.a: "Неприятное чувство."
 costello_republic_events.5.t: "Рассвет в парламенте"
 costello_republic_events.5.d: "Вся территория здания парламента была окутана энергией, которую Костелло мог только представить, что она в последний раз ощущалась во времена федерации. Почти на каждом рабочем месте висели ленты и транспаранты. Половина здания была пуста, политики либо отдыхали в местных пабах, либо праздновали в столовых. Пробираясь сквозь толпу, собравшуюся вокруг портативного телевизора, он мельком увидел, что они смотрят. Вокруг моста Харбор-Бридж висело световое шоу с огненным изображением нового флага, а над головой запускали фейерверки. Было очевидно, что даже оппозиция в той или иной форме праздновала. Наша страна наконец-то сделала следующий большой шаг. Мы вылезли из подросткового возраста. Бальный зал был соответствующим образом роскошен для этого случая, и когда Костелло прибыл и начал разбирать свои карточки для речи, он заметил в толпе знакомое лицо. На вечеринку пришел сам Джон Ховард. Костелло не смог удержаться и, сойдя с трибуны, направился навстречу бывшему премьер-министру, своему старому партнеру. Их руки пожали друг другу, и Говард, с обветренным, но гордым выражением лица, улыбнулся."
 costello_republic_events.5.a: "\"Молодец, дружище. Молодец.\""
 commonwealth_games_ast.1.t: "Игры Содружества [GetYear]"
 commonwealth_games_ast.1.d: "Более 5000 спортсменов из 71 страны, территории и организации собрались в Мельбурне, Австралия, чтобы принять участие в Играх Содружества в этом году. Игры откроются на том же месте, где проходили летние Олимпийские игры 1956 года, и будут включать в себя ряд зрелищных мероприятий, таких как летающий трамвай и центральный фейерверк. Ожидается, что будут представлены 17 видов спорта. Впервые в истории Игр факел королевы посетил каждую страну и территорию Содружества, принимающую участие в Играх, преодолев расстояние в 180 000 км (112 500 миль). Это демонстрирует долгосрочную приверженность и глубокую связь между странами Содружества."
 commonwealth_games_ast.1.a: "Наши общие ценности продолжают жить в соревновательных видах спорта."
 commonwealth_games_ast.1.b: "Замечательное зрелище."
 costello_republic_events.6.t: "Плечом к рулю"
 costello_republic_events.6.d: "Александр Даунер, заместитель премьер-министра, откинулся в кресле, пока Костелло излагал свои планы. Даунер обладал талантом сохранять невозмутимое выражение лица. Никогда нельзя было понять, о чем он думает, пока он не откроет рот, и Костелло выбрал его, потому что он делал это крайне редко, но на этот раз он увидел удивление на его лице. После презентации Даунер наклонился вперед и произнес фразу, которую ожидал премьер-министр. \"Откуда вы знаете, что это не повторится, как в 99-м?\" \n\nЭтот вопрос не давал Костелло покоя на протяжении всего процесса. Он не был уверен, что им удастся избежать повторения провала, подобного референдуму 1999 года, или что они вообще смогут провести его через парламент. Ничто не было гарантировано, но он должен был попытаться. \n\nПосле короткой перепалки Даунер пожал плечами и согласился помочь. Они либо оказались на неизведанной территории, либо в знакомой трясине. По крайней мере, они собирались вместе отправиться в это бедствие. Однако Даунер не мог понять одного. \n\n\"Мне следует обращаться к вам как к премьер-министру или как к господину президенту?\""
 costello_republic_events.6.a: "А затем спор продолжился."
 labor_factionalism.1.t: "Фракционализм рабочего движения"
 labor_factionalism.1.d: "Лейбористская партия, возможно, и не является коалицией, но у неё есть свои фракции. Две из них имеют наибольшее влияние. Слева находятся демократические социалисты, выступающие за социально прогрессивную политику, такую ​​как увеличение социальных выплат, укрепление системы здравоохранения и экономическое вмешательство. Кевин Радд в той или иной степени представляет эту сторону. С другой стороны находятся более центристские силы. Многие из них следуют экономическим принципам «третьего пути»: фискально консервативные программы, направленные на оказание помощи людям, а не на раздачу подачек, и более склонные к влиянию интересов бизнеса. \n\nПравозащитное движение трудящихся представляет Джулия Гиллард, в настоящее время занимающая должность заместителя. [GetASTLeaderTitle]Хотя Радд и Гиллард постоянно работают вместе над разработкой политики в интересах нации, между ними существует негласное соглашение не мешать друг другу. Слишком сильный уклон в ту или иную сторону может подорвать альянс или даже полностью разрушить партию. \n\nВ ходе нашей предвыборной кампании мы также обещали принять следующие меры: §YСхема торговли выбросами§!В соответствии с направлением нашей климатической политики. Мы должны обеспечить принятие этой программы в течение нашего первого срока, иначе партия начнет сомневаться в нашем лидерстве."
 labor_factionalism.1.a: "Задача непростая."
 rudd_apology.1.t: "Национальные извинения"
 rudd_apology.1.d: "Спустя всего несколько месяцев после начала нового срока Кевина Радда, [GetASTLeaderTitle] обратился к нации с официальным «извинением» за исторические несправедливости по отношению к коренным народам Австралии: аборигенам и жителям островов Торресова пролива. Этот исторический жест, основанный на докладе «Возвращение домой» 1997 года, был представлен в здании парламента [GetASTLeaderTitle] и с тех пор вызвал эмоциональный шок по всей Австралии. Толпы в Большом зале и на лужайках перед парламентом приветствовали и аплодировали. Несколько тысяч человек собрались под дождем на улицах Сиднея, чтобы посмотреть на знаменательную речь. Общественность ощутила глубокое чувство облегчения и исцеления, и многие из ее членов приветствуют усилия Радда по исправлению бездействия предыдущих администраций."
 rudd_apology.1.a: "Давно пора."
 tackle_mining_oligarchy_ast.1.t: "Разговор о налогах"
 tackle_mining_oligarchy_ast.1.d: "Радд ненавидел путь от своего рабочего стола до кабинета Кена. Коридоры в здании парламента были такими же унылыми, как больничная палата, и это вызывало множество неприятных воспоминаний как внутри, так и снаружи здания. Он постучал в дверь чуть ниже недавно установленной таблички с именем: «Кен Генри». \n\nКогда он вошел, Кен все еще был занят работой над обзором налогообложения, который остальные члены комитета любезно называли... \"Обзор Генри.\" Кен был всего на несколько лет старше Радда, но производил впечатление человека старой закалки. Ситуацию усугубляло то, что он имел обыкновение раздавать советы новичкам. [GetASTLeaderTitle] часто. \n\nОжидалось, что в обзоре будут затронуты вопросы прибыли горнодобывающей промышленности, и Радд хотел узнать все подробности. Они несколько часов болтали о суперналогах и их справедливом применении, прежде чем Кен наконец сдался и отправился домой. Но не Радд. Его вечер только начинался, но ему нужна была помощь, чтобы сдвинуть дело с мертвой точки."
 tackle_mining_oligarchy_ast.1.a: "Тот, кто разбирается в игре."
 tackle_mining_oligarchy_ast.2.t: "Отступать нельзя"
 tackle_mining_oligarchy_ast.2.d: "В очередной раз Радд провел вечер в парламенте, заседая с Уэйном Суоном. Суон был одним из \"банда из четырех человек,\" СМИ сообщали, что они звонили в ближайшее окружение Радда. Двумя другими были Джулия Гиллард и Линдси Таннер. \n\nКевин потратил немало времени на изучение плана законопроекта и уже собрал команду помощников, которые работали над ним в его офисе, но Свон был решающим фактором успеха плана. Не только потому, что у него был опыт работы казначеем, позволяющий заметить все, что остальные могли упустить, но и потому, что он придал всей затее большую убедительность. Радд все еще казался несколько политическим аутсайдером. Никто не ставил под сомнение компетентность Свона. \n\n\"Вы действительно нападаете на основу нашей политики. Многих наших ребят поддерживают шахтеры. Если мы это сделаем, они будут недовольны. Они набросятся на нас со всем, что у них есть. Будет очень плохо.\" \n\n\"Мне кажется, мы переживали и худшие времена, да?\" Кевин нервно почесал нос и улыбнулся, но Уэйн даже не вздрогнул. Он лишь смотрел на Кевина с обеспокоенным выражением лица, но тем не менее согласился помочь. \n\nВ какой-то момент они все оказались в одной лодке, и Кевин считал, что Уэйн не захочет, чтобы его администрация рухнула. Они вместе войдут в бурю."
 tackle_mining_oligarchy_ast.2.a: "Это никогда не должно было быть легко."
 pink_batts_ast.1.t: "Скандал с Pink Batts"
 pink_batts_ast.1.d: "Похоже, худший сценарий в отношении нашей программы утепления домов уже произошел. Многие установки оказались неэффективными в долгосрочной перспективе, и, что еще хуже, четверо рабочих погибли во время монтажа. Трое от поражения электрическим током, один от перегрева. Уже запрошена королевская комиссия, и против нас подан крупный коллективный иск от поставщиков и установщиков, которые, по всей видимости, понесли финансовый ущерб. Сказать, что это катастрофа, — значит ничего не сказать. Одни только политические последствия могут привести нас к краху. Нам придется немедленно прекратить эту программу и провести программу отзыва продукции."
 pink_batts_ast.1.a: "Как такое могло произойти?"
 bob_brown_event.1.t: "Эклектичный Боб Браун"
 bob_brown_event.1.d: "Боб Браун был любопытным человеком. Его активизм и одержимость защитой окружающей среды заставляли Радда выглядеть по сравнению с ним промышленником, и экоактивисты обожали его за это. Неудивительно, что он был фактическим основателем Партии зеленых. Спустя более десяти лет он по-прежнему оставался совершенно вне конкуренции в партии. Вместо этого его представляли как своего главного лидера, что само по себе граничило с культом личности в глазах Радда. Браун согласился приехать в столицу, чтобы встретиться с Раддом за обедом и обсудить сотрудничество, которое до сих пор носило слегка враждебный характер. Когда он приехал, Браун широко улыбался и быстро протянул руку для рукопожатия. Они обедали в одном из близлежащих кафе, к сожалению, оказавшись на улице и во власти канберрской погоды, которая почти всегда была ужасной. Возможно, именно поэтому все политики были такими раздражительными. По телефону казалось, что поддержка со стороны зеленых уже обеспечена, но когда Радд снова заговорил об этом, Браун просто покачал головой. Несмотря на то, насколько грандиозным уже был план, он хотел, чтобы они пошли дальше, и всякий раз, когда он пытался заставить лидера вернуться к реальности того, что разумно может пройти через сенат, Браун не уступал. Какой бы ни был рычаг влияния у «зелёных», он использовал его сейчас, и терпение Радда начало иссякать. Когда они наконец пожали друг другу руки, Радд понял, что лейбористы либо добьются больших успехов, либо уйдут домой с пустыми руками."
 bob_brown_event.1.a: "Середины не было."
 school_visit_rudd.1.t: "Прогулка по Курпару"
 school_visit_rudd.1.d: "Кевин и его свита прибыли в школу в полдень, чтобы встретиться с директором и осмотреть здание. Кто-то, очевидно, предупредил прессу, потому что, как только они вошли, туда хлынула толпа репортеров, и вскоре их полностью окружили. \n\nИз уст журналиста вырвались обычные вопросы: \"Правительство отступает от своих обещаний относительно реформ? Не нарушила ли лейбористская партия свое обещание быть финансово консервативной?\" \n\nРадд изо всех сил старался игнорировать их и хотя бы кое-что сказать директору по поводу ремонта. Им удалось выйти через одну из дверей и попасть во внутренний двор, где была построена новая баскетбольная площадка, которая также служила актовым залом. Новое здание было, конечно, неплохим, но немного раздражало глаз на фоне гораздо более старых построек рядом. \n\nЭпидемия современного дизайна наконец-то добралась до государственной школы Курпару. Однако новые улучшения станут благом для таких школ, особенно для тех, которые находятся в худшем положении. Когда они вошли, за ними последовал кордон детей, которые протиснулись мимо репортеров, чтобы задать вопросы. [GetASTLeaderTitle] с этого все и началось. \n\n\"Ну, это просто замечательно! Поднимите руки, что вам больше всего нравится в этом новом зале?\" \n\n\"Мы можем сидеть на сиденьях.\" ответил один из студентов.\" \n\n \"Здесь можно сидеть на сиденьях — это большая разница!\""
 school_visit_rudd.1.a: "И правда так и было..."
 gayvote_rudd.1.t: "Австралия проголосовала «за» равенство браков."
 gayvote_rudd.1.d: "После того, как вопрос легализации однополых браков был вынесен на добровольный референдум, 61,6% австралийцев проголосовали «за», дав зеленый свет принятию закона в Палате представителей и Сенате. При явке в 79,5% миллионы людей отдали свои голоса, приняв решение по этому вопросу, и ожидается, что закон будет ратифицирован в ближайшие месяцы, к большой радости однополых пар в стране, желающих вступить в брак.\n\nМинистр труда Билл Шортен присутствовал на праздновании перемен в Сиднее и приветствовал усилия правительства. [GetASTLeaderTitle]а также члена оппозиции Малкольма Тернбулла за продвижение этого законопроекта. \n\n\"Какой замечательный день для австралийцев – обе стороны политического спектра готовы к переменам и поддерживают голос общественности.\""
 gayvote_rudd.1.a: "Любовь побеждает!"
 unite_the_nation_speech_ast.1.t: "Кевин Радд обращается к нации"
 unite_the_nation_speech_ast.1.d: "Новый [GetASTLeaderTitle] изложил намерение написать \"новая страница\" Это одна из важнейших в истории Австралии программ, направленная на сокращение существующего в стране неравенства. Были представлены планы новых социальных и экономических программ, которые, как заявил Радд, призваны значительно превзойти достижения предыдущего поколения. После этого были зачитаны личные истории коренных народов Австралии. \n\nОн [GetASTLeaderTitle] В заключение речи было подчеркнуто важность более тесного партнерства с коренными народами Австралии – аборигенами и жителями островов Торресова пролива. \"сократить разрыв между обещаниями и результатами.\" \n\nПока что речь была воспринята положительно, хотя кто знает, как долго сохранится эта доброжелательность без конкретных изменений."
 unite_the_nation_speech_ast.1.a: "Меня зовут Кевин, я из Квинсленда, и я здесь, чтобы помочь."
 something_to_give_ast.1.t: "Что-нибудь подарить"
 something_to_give_ast.1.d: "Звонок Центрлинка раздался в ее телефоне, пока она расхаживала по маленькой квартире. Она уже почти час ждала, когда ее соединят с оператором, но по мере приближения 5 вечера ее надежды угасали. Она только что закончила занятия, но если ей не удастся дозвониться до кого-нибудь на этот раз, завтра ей придется снова ждать. Казалось, этот цикл никогда не закончится. Наконец, телефон затрещал, и раздался голос. Она, не теряя времени, выложила свою ситуацию собеседнику. Она училась на дневном отделении, и, поскольку поиски работы не приносили результата, счета накапливались. Даже на пособии по безработице выплат не хватало, и страх переехать и бросить учебу становился все более вероятным. Все, что ей было нужно, это немного больше времени. Голос на другом конце провода был сочувственным, хотя и звучал почти так же устало, как и она сама, но, похоже, она ни на что не имела права. Она сползла с кухонной стойки на пол. Выхода не было. Оператор спросил, можно ли поставить её на удержание, и снова она осталась одна. Она была слишком уставшей, чтобы плакать, да и это ничего не изменит. Так было всегда. Внезапно оператор вернулся. Только на этой неделе была запущена новая программа, позволяющая получателям запрашивать экстренные выплаты. Выплаты будут производиться поэтапно, и это будет немного, но этого хватит на оплату аренды, и она сможет продолжить учёбу. Новость была ошеломляющей. После звонка она вскочила от радости, и слёзы потекли по её щекам."
 something_to_give_ast.1.a: "Небольшая помощь может многое изменить."
 bill_of_rights_ast.1.t: "Принятие закона"
 bill_of_rights_ast.1.d: "В итоге обе палаты представителей и сенат яростно боролись с нами, чтобы добиться принятия этого закона. Мы смягчили некоторые положения до приемлемого уровня, но это всё ещё начало. «Закон о правах человека Содружества Австралии» расширяет наши законы о свободе слова, правах на собрания, справедливом судебном разбирательстве, равенстве перед законом, свободе от пыток — список можно продолжать. Мы не только внедряем крупнейший в нашей истории закон о гражданских правах, обеспечивающий широкую защиту коренным народам Австралии (аборигенам и жителям островов Торресова пролива), но и заложим основу для защиты всех будущих поколений австралийцев законом. Пока нам ещё нужно ратифицировать всё и начать реализацию в ближайшие месяцы, но это, безусловно, большой шаг к зрелости нашей нации."
 bill_of_rights_ast.1.a: "Тем, кто сможет насладиться плодами."
 rudd_nz_deal.1.t: "В Веллингтон"
 rudd_nz_deal.1.d: "Радд летел одним из ранних утренних рейсов, чтобы не пропустить вид на горы сверху. Если в чем-то страна киви и превосходила Австралию, так это в пейзажах. Их министерство иностранных дел любило напоминать, что там снимали «Властелина колец», и не было загадкой, почему. Соглашение о транстасманской торговле, которое он приехал подписать, должно было практически связать наши экономики, и Радда удивило, что оно не было заключено раньше. Премьер-министр, [NZL.GetLeader], достаточно быстро пожал первую руку, сойдя с самолета, и повел переговоры в дипломатический зал аэропорта. При совместном обсуждении все документы выглядели хорошо: практически полное устранение всех тарифов и торговых барьеров на товары и услуги, как обычно. Теперь настал момент, которого ждал их премьер-министр. Они предложили, чтобы первым шагом в рамках соглашения стали инвестиции Австралии в промышленные центры Новой Зеландии, и перечислили выгоды на следующие несколько десятилетий. Всё было разумно, но стоило ли вкладывать столько денег сразу?"
 rudd_nz_deal.1.a: "Отлично."
 rudd_nz_deal.1.b: "Торгового соглашения пока достаточно."
 rudd_visit_ast.1.t: "Приближение к южнокорейцам"
 rudd_visit_ast.1.d: "После приземления в стране одной из первых остановок стала фотосессия на мемориальном кладбище в Пусане. Радду повезло, что он никогда не участвовал ни в каких войнах. Ни один из австралийских министров, всё ещё занимавших свои посты, даже не застал Корейскую войну, и одним из главных его приоритетов было предотвращение ещё одного подобного конфликта. \n\nМемориал был огромным и довольно впечатляющим вблизи. Всё кладбище представляло собой сад, и почти на каждом надгробии рос цветок или живая изгородь. Их сопровождали флаги со всего мира. Южная Корея каждый день ощущала угрозу войны, поэтому, естественно, держала своих союзников очень близко. \n\nКогда они наконец вернулись в Национальное собрание, президент Южной Кореи, [KOR.GetLeader], положительно отреагировал на идею мирного союза, но прямо заявил об оговорке. Как обычно, требовались гарантии нашей обороны, и они казались довольно твёрдыми. Они хотели быть уверены, что если Северная Корея когда-либо запустит ракету, мы запустим ракету, и если они пришлют флот, мы будем готовы к этому. У этой идеи, безусловно, были свои достоинства, но стоило ли она того, чтобы менять существующее положение вещей?"
 rudd_visit_ast.1.a: "Мы в этом вместе."
 rudd_visit_ast.1.b: "Рисковать не стоит."
 rudd_visit_ast.1.c: "\"Мы уже с вами.\""
 rudd_visit_ast.2.t: "Полет над Осакой"
 rudd_visit_ast.2.d: "Япония с легкостью приняла новый экономический порядок. Их стремительный взлет к вершине рейтингов ВВП в 90-е годы был весьма похвален, но настоящим тому подтверждением стали их города. Пролетая над Осакой, казалось, будто смотришь сверху на дюжину Таймс-сквер. Даже наши самые урбанизированные города не могли сравниться с их, которые сияли, словно неоновое любовное послание капитализму. Они приземлились в Токио, и делегации начали переговоры. Японцы вели себя так, будто этот вопрос был поднят совсем недавно, а не обсуждался подробно месяц назад. Радд задавался вопросом, не затягивают ли они, но в конце концов они выдвинули требование. Любой предлог для экономического союза в Тихом океане должен был включать гарантии того, что Китай обязуется составить карту своих морских территорий. Их привычка строить острова и расширять свой военно-морской контроль беспокоила японцев, которые считали, что наша работа в качестве временного посредника может дать хороший старт переговорам."
 rudd_visit_ast.2.a: "Мы изложим условия, но не более того."
 rudd_visit_ast.3.t: "Ответ Пекина"
 rudd_visit_ast.3.d: "После долгого перелета домой Радд не мог не чувствовать себя немного подавленным. Китайская делегация министров иностранных дел практически высмеяла его в конференц-зале. Несмотря на то, что переговоры шли хорошо, Пекин был пессимистично настроен по отношению к концепции мирного экономического союза. Достоинства АСЕАН в настоящее время вполне устраивают, и [CHI.GetLeader] не желал выступать посредником в каких-либо новых переговорах с соседними державами. Хотя переговоры и не были полностью провалены, они все же привели к чему-то. Команда подробно обсудила планы по заключению более открытого торгового соглашения между нашими странами и предложила нам новое. Новое соглашение охватывает широкий спектр китайского импорта в обмен на практически беспошлинную торговлю нашим углем и другими минеральными ресурсами. Это приятное утешение после провала переговоров."
 rudd_visit_ast.3.a: "Неплохо."
 rudd_visit_ast.4.t: "Цветущие сливы"
 rudd_visit_ast.4.d: "Министр иностранных дел Китая передал нам, что Пекин открыт для пересмотра территориальных границ с Японией. Это может быть только началом, но тот факт, что они восприимчивы к этому требованию, показывает, насколько далеко мы продвинулись. Они попросили нас принять участие в обсуждениях в качестве нейтрального наблюдателя, что, несомненно, займет несколько лет. Возможно, до создания настоящего Тихоокеанского союза еще далеко, но нельзя недооценивать прогресс, которого мы достигли в установлении мира в Тихом океане, пусть даже временный. Пекин также намекнул на улучшение существующего торгового соглашения, еще более тесное экономическое сближение наших стран, а также пообещал провести переговоры по вопросам военно-морской обороны в будущем."
 rudd_visit_ast.4.a: "Мир в наше время"
 gillard_talk.1.t: "Я застрелил заместителя шерифа"
 gillard_talk.1.d: "Как обычно, Джулия Гиллард проводила брифинг для Радда, представляя свою позицию в правительстве. После принесения присяги в качестве заместителя министра. [GetASTLeaderTitle]Юлия отвечала за \"суперминистерство\" Министерство образования, занятости и трудовых отношений — все в одном лице. Управлять всем этим было непросто, но Радд верил, что она справится. За 8 лет их знакомства она произвела на него впечатление одного из самых проницательных и способных политиков Канберры. \n\nДжулия начала брифинг с того, что рассказала Радду о последних жалобах многочисленных предприятий, которые считали, что правительство, крайне предвзятое по отношению к профсоюзам, обделяет их вниманием. Конечно, большую часть жалоб можно было проигнорировать, но Джулия настаивала на необходимости поддерживать с ними хорошие отношения. Насколько далеко мы зайдем в своей социальной политике, мало что значило, пока мы не отклонялись от нашей нынешней пробизнес-позиции. \n\nКогда она закончила, Радд почувствовал, как ее взгляд впивается в его глаза. Даже когда они непринужденно разговаривали, ему казалось, что она каким-то образом его анализирует. Радд согласился обдумать рекомендацию, и они разошлись, хотя он и задавался вопросом, насколько серьезны ее намерения."
 gillard_talk.1.a: "Стоит это обдумать."
 papua_talks_rudd.1.t: "Ремонт в центрах содержания под стражей"
 papua_talks_rudd.1.d: "Австралия предложила отремонтировать построенные ею здесь центры содержания под стражей в обмен на небольшие иностранные гранты. Действительно, после того, как центры были почти полностью опустошены, их количество сократилось, и влияние на нас будет минимальным. По всей видимости, это делается для решения существующих проблем с иммиграцией."
 papua_talks_rudd.1.a: "Отлично."
 papua_talks_rudd.1.b: "Не в этот раз."
 papua_talks_rudd.2.t: "Папуа-Новая Гвинея согласна на реконструкцию."
 papua_talks_rudd.2.d: "Несмотря на то, что срок аренды истекает, правительство в Порт-Морсби согласилось предоставить нам доступ к центрам, чтобы можно было начать ремонт. Это должно позволить нам переселить тех, кто пролезает без очереди, в Папуа-Новую Гвинею и, будем надеяться, предотвратить подобные случаи в будущем на нашей территории."
 papua_talks_rudd.2.a: "Как и ожидалось."
 papua_talks_rudd.3.t: "Папуа отказывается от переговоров"
 papua_talks_rudd.3.d: "Несмотря на предложение о финансовой компенсации, правительство в Порт-Морсби отказалось от любых обсуждений по поводу реконструкции центров содержания под стражей. Похоже, их больше волнует моральная сторона вопроса. Теперь нам придется и дальше размещать просителей убежища здесь."
 papua_talks_rudd.3.a: "Неожиданное разочарование"
 address_the_tiger_event_ast.1.t: "Посредничество в установлении мира в Бхарате"
 address_the_tiger_event_ast.1.d: "Переговоры с Индией были предопределены с самого начала президентского срока Кевина Радда, а может, и раньше. Наши стратегические цели в Тихоокеанском регионе хорошо совпадают, и они были готовы сотрудничать с Силами обороны Австралии в совершенствовании их армии. Теперь нам оставалось лишь предложить идею сотрудничества с Китаем. \n\nВ Нью-Дели действительно был расстелен красный ковер. [RAJ.GetLeader] Возможно, он придавал этому событию больше значения, чем ожидал Радд, ведь большая часть их общения происходила по телефону, лежащему на его столе. Официальный государственный визит был всего лишь зрелищем, но, безусловно, приятным. \n\nКогда они собрались в Хайдарабад-Хаусе для обсуждения сделки, сразу же обозначили военное партнерство, и, конечно же, они пришли к согласию. Затем начались настоящие переговоры. Как только зашла речь о Китае, тон в конференц-зале изменился. На встрече с тайваньской делегацией по вопросу Китая вы бы увидели более сговорчивую публику, чем здесь. \n\nВ течение следующих нескольких часов Радд изо всех сил пытался склонить их к диалогу, но максимум, чего он смог добиться, — это обещание рассмотреть вопрос об экономическом союзе «после того, как другие страны согласятся сотрудничать с Китаем», что, по сути, означало отказ. Хотя официально Радд заявил, что он всё же привёл их за стол переговоров."
 address_the_tiger_event_ast.1.a: "И этого было достаточно."
 legislation_rudd_blocked.1.t: "Законопроект заблокирован в Сенате."
 legislation_rudd_blocked.1.d: "Похоже, вся Либеральная партия выступает против принятия нашего законопроекта. Они используют все возможные средства, и даже привлекли на свою сторону ряд независимых депутатов. В таком случае мы не сможем принять законопроект, и если мы не сможем заручиться необходимой поддержкой при повторном внесении на рассмотрение, законопроект будет отклонен Сенатом. Обычно нам приходится ждать 3 месяца, прежде чем его снова примут. За это время мы могли бы использовать наше влияние, чтобы заручиться большей поддержкой и получить большинство, хотя это и кажется маловероятным. Возможно, нам не удастся обратиться к либералам, но «зеленые» могут быть склонны поддержать наши реформы, если мы еще не привлекли их к сотрудничеству, а независимые депутаты могут принять любое решение."
 legislation_rudd_blocked.1.a: "Вот вам и двухпартийное сотрудничество..."
 legislation_rudd_blocked.2.t: "Второе голосование"
 legislation_rudd_blocked.2.d.a: "Несмотря на наши усилия, либеральное большинство по-прежнему прочно удерживает свои позиции. Несмотря на все их процедурные задержки и требования поправок, мы все же смогли дойти до этапа голосования, на котором проиграли со счетом 34-42. Похоже, все независимые депутаты перешли на сторону либералов, а «зеленых» не удалось убедить проголосовать вместе с нами. Однако у нас есть и другие варианты. Мы могли бы запросить двойной роспуск, распустив и Палату представителей, и Сенат, и инициировав досрочные выборы. Это очень рискованный шаг, и он может привести к потере мест, если время будет выбрано неудачно. Это также может быть единственным способом получить необходимые нам места для большинства. Такой вариант не применялся с 1987 года, и Гиллард настоятельно советовала нам этого не делать. Мы всегда можем подождать до следующих выборов. Тем не менее, этот вариант доступен нам, если мы захотим принять его до этого времени."
 legislation_rudd_blocked.2.d.b: "Несмотря на наши усилия, либеральное большинство в Сенате по-прежнему прочно удерживается. Несмотря на все их процедурные задержки и требования поправок, мы все же смогли дойти до этапа голосования, на котором с небольшим отрывом проиграли 37-39, благодаря поддержке «зеленых». Похоже, все независимые депутаты перешли на сторону либералов. Однако у нас не совсем нет вариантов. Мы могли бы запросить двойной роспуск, распустив и Палату представителей, и Сенат и инициировав досрочные выборы. Это очень рискованный шаг, и в настоящее время мы отстаем на несколько пунктов по сравнению с предыдущими выборами. Повторные выборы так скоро могут лишить нас премьер-министра. Это также может быть нашим единственным способом получить большинство. Этот вариант не применялся с 1987 года, и Гиллард настоятельно советовала нам этого не делать, предложив подождать до следующего срока. Тем не менее, такая возможность у нас есть, если мы хотим принять закон сейчас, пока у нас есть импульс."
 legislation_rudd_blocked.2.a: "Пора действовать."
 legislation_rudd_blocked.2.b: "Это слишком рискованно."
 legislation_rudd_blocked.3.t: "Двойное растворение"
 legislation_rudd_blocked.3.d: "Теперь, когда цепная реакция завершена и роспуск парламента начался, будут назначены досрочные выборы. Первый барьер преодолен, и нам нужно сосредоточиться на предвыборной кампании. Наша партия стабильно держится в опросах, но либералы могут переманить избирателей, если мы им это позволим. Сейчас их возглавляет Тони Эбботт, один из наших самых ярых критиков. Он пока не стесняется в выражениях, поэтому нам не следует воздерживаться от ответных ударов. До выборов осталось 60 дней, и нам нужно держать страну под контролем и продолжать предвыборную кампанию, если мы хотим вырваться вперед."
 legislation_rudd_blocked.3.a: "Напряжение нарастает."
 legislation_rudd_blocked.4.t: "Победа"
 legislation_rudd_blocked.4.d.a: "Радд плюхнулся в кресло и вздохнул с облегчением. Законопроект был принят. Наконец-то все закончилось. Остальные члены Лейбористской партии и «зеленые» разразились аплодисментами. Другая сторона прохода, казалось, сидела, скрестив руки, но в первом ряду Радд заметил Малкольма Тернбулла, который смотрел прямо на него, и он мог поклясться, что Малкольм ухмылялся. Он почувствовал похлопывание по спине, и, повернувшись, увидел, как Джилард улыбается ему сверху вниз. Даже она должна была признать, что это достижение для партии. Партия наконец-то делает что-то действительно великое, и то, чего они добиваются в борьбе с бездомностью, действительно будет иметь значение. Лейбористы наконец-то стали партией реформ. Возможно, это ненадолго, но сегодня они выиграли первую битву. Он вытер пот с головы и встал, чтобы похлопать вместе с партией. Пора наслаждаться этим, пока это длится."
 legislation_rudd_blocked.4.d.b: "Радд плюхнулся в кресло и вздохнул с облегчением. Законопроект принят. Наконец-то все закончилось. Остальные члены Лейбористской партии и «зеленые» разразились аплодисментами. Другая сторона прохода, казалось, сидела, скрестив руки, но в первом ряду Радд заметил Малкольма Тернбулла, который смотрел прямо на него, и мог поклясться, что Малкольм ухмылялся. Он почувствовал похлопывание по спине, и, повернувшись, увидел, как Джилард улыбается ему сверху вниз. Даже она должна была признать, что это достижение для партии. Сколько лет горнодобывающие корпорации делали невозможными настоящие реформы, и все же теперь они будут платить по счетам. Без сомнения, клеветнические кампании будут продолжаться еще несколько месяцев, но сегодня он выиграл первую битву. Он вытер пот с головы и встал, чтобы похлопать вместе с партией. Пора наслаждаться этим моментом, пока он длится."
 legislation_rudd_blocked.4.d.c: "Радд рухнул в кресло и вздохнул с облегчением. Законопроект принят. Наконец-то все закончилось. Остальные члены Лейбористской партии и «зеленые» разразились аплодисментами. Другая сторона прохода, казалось, сидела, скрестив руки, но в первом ряду Радд заметил Малкольма Тернбулла, который смотрел прямо на него, и он мог поклясться, что Малкольм ухмылялся. Он почувствовал похлопывание по спине, и, повернувшись, увидел, как Джилард улыбается ему сверху вниз. Даже она должна была признать, что это достижение для партии. Лейбористы сдерживали свои обещания. Австралия станет страной, которая возьмет на себя ответственность, когда никто другой этого не сделает. Будущие поколения будут в безопасности благодаря нам. Он вытер пот с головы и встал, чтобы похлопать вместе с партией. Пора наслаждаться этим моментом, пока он длится."
 legislation_rudd_blocked.4.a: "Заслуженно."
 approach_parties_rudd.1.t: "Обращение к либералам"
 approach_parties_rudd.1.d: "Либеральная партия и Национальная партия привержены... \"нет без исключения\" Судя по всему, сейчас они выступают против нашего участия в планировании. Если бы всё зависело от них, законопроект был бы полностью отменён. Тем не менее, сейчас они не желают работать над какими-либо поправками."
 approach_parties_rudd.1.a: "Не всегда удается выиграть."
 approach_parties_rudd.2.t: "Умиротворение «зелёных»"
 approach_parties_rudd.2.d: "Единственной проблемой при попытке заручиться поддержкой «зелёных» стали их требования. Для такой небольшой партии нельзя было недооценивать их способность создавать нам проблемы. Если бы мы не пошли на уступки, они бы проголосовали против в знак протеста, и они настаивали на усилении и без того спорного законопроекта. Используя все имеющиеся у нас средства для достижения компромиссов, мы добились того, что они согласились поддержать по сути тот же законопроект с некоторыми незначительными дополнениями."
 approach_parties_rudd.2.a: "Будем надеяться, что они сдержат своё слово."
 approach_parties_rudd.3.t: "Аутсайдеры"
 approach_parties_rudd.3.d: "И сенатор от Демократической лейбористской партии, и независимый сенатор Ник Ксенофонт настойчиво продвигали законопроект. Ник с самого начала особенно критически относился к нашей администрации, и оба они в основном голосовали за либералов, но после обещания сотрудничать с ними над будущими поправками они согласились поддержать законопроект."
 approach_parties_rudd.3.a: "Отличный."
 mad_katter_ast.1.t: "Безумный Кот"
 mad_katter_ast.1.d: "Боб Каттер был фактическим королем северного Квинсленда, почти 20 лет занимая должность его представителя. Он был пламенным политиком во всех смыслах этого слова, и особенно — совершенно не обычным. Ни в одежде, ни в своих взглядах, и уж тем более не в манере говорить. Если Каттер привлек ваше внимание, вы отправлялись в путешествие, и никогда не было ясно, куда оно вас приведет. Они начали встречу под предлогом совместной работы над новым законопроектом, но Каттер увлекся обсуждением бедственного положения фермеров и импорта бананов. В конце концов, он сильно разволновался, и Радду пришлось его успокаивать. Было очевидно, что он очень переживал из-за человеческих жертв продолжающихся засух. Радд не мог решить, был ли этот человек социалистом или консерватором, или, может быть, странной смесью того и другого. В любом случае, они собирались придумать что-то, чтобы помочь фермерам."
 mad_katter_ast.1.a: "Это самое меньшее, что мы можем сделать."
 whispers_in_the_crowd_ast.1.t: "Шепот в толпе"
 whispers_in_the_crowd_ast.1.d: "К этому времени Кевин Радд уже привык к атмосфере парламента. К тому, как статус-кво устанавливается за один день, и ничто не остается неизменным. Теперь, когда дела шли полным ходом, он чувствовал себя комфортно в темпе работы правительства, однако что-то изменилось с момента его присяги, и это начало его угнетать. Казалось, он ладил почти со всеми членами своего кабинета, но иногда у него возникало ощущение, что их расположение ослабевает. Если раньше они спокойно принимали его приказы, то теперь все чаще ставили его под сомнение. Ему приходилось все чаще объяснять свои доводы, и это ставило под сомнение направление его политики. Может, он параноик? Возможно. Возможно, их тяготило все происходящее. К тому же, он все еще доверял своему кабинету и не боялся вечеринок. Радд отмахнулся от этой мысли и продолжил свою работу. Вероятно, ничего страшного не произошло."
 whispers_in_the_crowd_ast.1.a: "Или нет?"
 mining_smear_campaign_ast.1.t: "Медиакампания"
 mining_smear_campaign_ast.1.d: "Сейчас, когда крупные горнодобывающие корпорации узнали о наших планах, в СМИ развернулась настоящая клеветническая кампания. Десятки различных рекламных объявлений заполонили все каналы и волны. Баннеры на обочинах дорог. Вместо того чтобы платить взносы, они тратят миллионы на осквернение нашего правительства. Не все из этого срабатывает, но когда срабатывает, это вредит нашей способности управлять страной, и общественное мнение падает. Коалиция уже подхватила эту волну критики. Если мы в ближайшее время ничего не предпримем, чтобы это остановить, ситуация только ухудшится."
 mining_smear_campaign_ast.1.a: "Не очень хорошо."
 corruption_outcome_aus.1.t: "Рука, пойманная в банке"
 corruption_outcome_aus.1.d: "Результаты наших недавних партийных расследований дали нам достаточно оснований, чтобы навсегда, или, по крайней мере, на данный момент, исключить иностранное влияние в партии. Однако всплыли несколько фактов, не связанных с вмешательством заинтересованных групп, и это выставляет нашу партию в невыгодном свете. Пока ничего, что можно было бы связать с нами, не обнаружено, но этого достаточно, чтобы подорвать доверие общественности. Нам придется и дальше вести себя безупречно, пока мы не окажемся вне поля зрения общественности."
 corruption_outcome_aus.1.a: "Ой!"
 aus_gillard_overthrow.1.t: "Стук в дверь"
 aus_gillard_overthrow.1.d: "Радд занимался обычными делами в своем кабинете, когда раздался стук в дверь. Он узнал этот стук и позвал Джулию Гиллард, которая вошла медленно, но обдуманно. Вопреки их обычной рутине, она осталась стоять, и, когда Радд поднял на нее взгляд, она сообщила новость. Радду показалось, будто стены кабинета рушатся. Пока она продолжала говорить, его мир рушился, и все, что он мог сделать, это с шоком наблюдать, как она наносит решающий удар. Гиллард собиралась инициировать борьбу за лидерство. Он не мог поверить, что его собственный напарник по предвыборной кампании свергнет его, не говоря уже о человеке, которого он считал другом. Худшее еще не позади. Она требовала его отставки. Его уже свергли, за исключением письменного решения, но она предлагала ему вариант сохранить лицо и избежать парламентского процесса. Когда она перечислила всех членов кабинета, поддерживающих ее, Радд понял, что она переманила на свою сторону всех его союзников. Теперь он остался один в партии."
 aus_gillard_overthrow.1.a: "Всё было кончено."
 aus_gillard_overthrow.2.t: "Рассвет"
 aus_gillard_overthrow.2.d: "Камеры окружили трибуну снаружи, ожидая объявления. К этому моменту все уже знали, что происходит. Любые новости из парламента распространялись быстро, и это был долгожданный план, который готовился до последнего. К следующему утру все уже закончилось, и пока репортеры неловко стояли, ожидая момента, двери наконец распахнулись, и... [GetASTLeaderTitle] вышел в свет со своей семьей. \n\n\"Я был избран австралийским народом как [GetASTLeaderTitle] Я стремлюсь вернуть справедливость для всех австралийцев в этой стране и сделал для этого все возможное, отдал все силы. В этом духе я горжусь достижениями, которых мы добились, чтобы сделать эту страну более справедливой.\" \n\nУ него уже начали слезиться глаза. Возможно, Радд был прав. [GetASTLeaderTitle] В неподходящий момент. Он мало что мог сделать, чтобы избежать того, что превращалось в замкнутый круг в партии, где свержения партийных чинов становились печальным явлением. \n\n \"Это были очень насыщенные два с половиной года. Мы вложили в это все свои силы, и я верю, что, оглядываясь назад, мы увидим, что эти реформы сохранятся в будущем и, я считаю, сделают Австралию более справедливым и лучшим местом, чем она была бы в противном случае.\" \n\nПосле аплодисментов Радд помахал на прощание. Он мог лишь надеяться, что оказался прав, и что его усилия по изменению ситуации принесут свои плоды."
 aus_gillard_overthrow.2.a: "Прощай, милый принц."
 the_new_look_rudd.1.t: "Новый образ"
 the_new_look_rudd.1.d: "Когда предвыборная суета снова начала проникать в его повседневную жизнь, Радд обнаружил, что у него стало гораздо меньше времени на уход за собой. Нередко он оставался на ночь в парламенте, просматривая предложения и обычные документы, чтобы на следующий день отправиться в предвыборную кампанию. Сегодня он находился довольно далеко от столицы, в своем избирательном округе Гриффит, Квинсленд. Когда солнце едва выглянуло, он уже просматривал заметки и наслаждался тишиной, еще до того, как все проснулись. В последние дни это было редкостью. Однако, словно по команде, спокойствие было нарушено, и москитная сетка на двери фургона распахнулась, открыв взору фыркающего Энтони Албанезе. Энтони был полным, несколько неуклюжим мужчиной, но не так давно они оба рыдали в глотке за лидерство в партии, и Радд позаботился о том, чтобы никогда об этом не забывать. Энтони, спотыкаясь, вошел и поставил чашку кофе на стол рядом с Раддом, который поблагодарил его кивком. \n\n\"Боже, ты выглядишь грубовато.\" Он указал на подбородок Радда. Радд дотронулся до него и понял, что не брился два или три дня, и его белая щетина превратилась в бороду. \n\n\"Похоже, что да. Как я выгляжу?\" \n\n\"В смысле, неплохо. Может быть, это станет сюрпризом для избирателей.\" — сказал Энтони, усмехнувшись. \n\n\"Hм. Полагаю, я не хочу выглядеть неопрятно.\" \n\n\"Не знаю. Может быть, им понравится.\""
 the_new_look_rudd.1.a: "Тогда я его оставлю."
 the_new_look_rudd.1.b: "Пора бриться."
 rudd_the_next_leader.1.t: "Будущее партии"
 rudd_the_next_leader.1.d: "В жизни любого лидера наступает момент, когда он должен подумать о следующем поколении. Джулия Гиллард не была столь молодой по сравнению с Раддом, но она вполне могла бы стать будущим партии. В соответствии с соглашением, заключенным перед выборами 2007 года, Радд пообещал Гиллард, что в какой-то момент он уйдет в отставку, позволив ей баллотироваться после него. Ответственность для Радда была велика, но Гиллард его еще не подвела. Она представляла деловую сторону партии. Казалось необычным, что ее обеспокоенность по поводу бюджетного дефицита и экономического роста не высказывалась, а ее планы по национальной реформе горнодобывающей промышленности вызвали интерес у Радда. Очевидно, ей было не все равно. Подходит ли она для этой работы или нет, в какой-то момент Радду придется принять решение."
 rudd_the_next_leader.1.a: "Стоит это обдумать."
 rudd_the_next_leader.1.b: "Никогда!"
 rudd_the_next_leader.2.t: "Спуск"
 rudd_the_next_leader.2.d: "\"Эта страна, способная мирно улаживать свои политические разногласия и разрешать политические вопросы мирным и цивилизованным путем, — вот почему она такая великая. В этом чудесном полотне современной Австралии, в мозаике нашей многокультурной нации, в том, что создает такое единство из многообразия, и заключается великое австралийское чудо.\" \n\n\"Я считаю, что австралийский народ заслуживает нового начала с нашим руководством. Я знаю, что для некоторых из вас это будет неприятной новостью, но моя обязанность заключалась в том, чтобы сохранить Лейбористскую партию как боеспособную силу в будущем, чтобы мы могли объединиться вокруг следующего лидера нашей партии, Джулии.\" \n\n\"Итак, друзья, в ближайшее время вы не услышите моего голоса в государственных делах.\" \n\n\"Для меня большая честь служить вам. [GetASTLeaderTitle] И хотя вы являетесь лидером своей партии, наступает момент, когда вы понимаете, что отдали все силы, и настает время для дальнейшего обновления руководства партии на будущее.\""
 rudd_the_next_leader.2.a: "\"Для меня это время настало.\""
 rudd_campaigning_round_two.1.t: "Вокруг конференц-центра"
 rudd_campaigning_round_two.1.d: "Когда Радд шел по проходу на Национальной конференции лейбористов, толпа была в восторге. Даже ветеран партии Пол Китинг присутствовал, чтобы поддержать его, придавая мероприятию сказочную атмосферу. Словно он и не уходил. Последние несколько лет были просто плохим сном, а теперь он проснулся под аплодисменты своих коллег. Тех самых, которые аплодировали его падению. Удивительно, насколько непостоянна политика. Ты всегда на грани с общественностью, и даже с людьми из собственной партии. И все же он пожимал им руки, если это означало получение их поддержки на следующих выборах. Все было слишком рискованно, чтобы расслабляться. Ему нужно было совершить чудо, чтобы получить еще один срок, но все уже давно решено, и Радд сделает все возможное."
 rudd_campaigning_round_two.1.a: "Мы вернулись, и мы здесь, чтобы остаться."
 gillard_gov_event.1.t: "Новое направление"
 gillard_gov_event.1.d: "В тесном конференц-зале Джулия Гиллард провела свою первую пресс-конференцию под псевдонимом [GetASTLeaderTitle]. Журналисты и коллеги-политики собрались, чтобы послушать ее выступление, и с нетерпением ждали объявления о мандате, который она собиралась представить. Теперь на ней лежала настоящая ответственность. Месяцы работы, чтобы достичь этого положения, все карты нужно было тщательно расставить и убедить членов кабинета министров оказать поддержку. Все, чтобы добраться сюда. Гиллард теперь была одной из самых влиятельных женщин в мире, и все же ее положение никогда не казалось таким шатким. Любая ее ошибка будет тщательно изучаться и анализироваться в течение нескольких дней оппозицией, СМИ или вообще любым, кто посчитает, что у нее не хватит смелости занять место своих коллег. Каждый шаг нужно было делать осторожно. Принятие любой разумной политики должно было быть отложено до выборов, которые должны были состояться в ближайшее время. До тех пор ей нужно было выглядеть соответствующе и надеяться, что общественность поверит в ее способность справиться с работой."
 gillard_gov_event.1.a: "Есть вопросы?"
 papua_residency_ast.1.t: "Предложение об экономическом соглашении от Австралии"
 papua_residency_ast.1.d: "Стремясь укрепить региональные экономические связи, правительство Австралии выступило с предложением о заключении соглашения о «беспошлинной» торговле. Предложение включает в себя смягчение ограничений на наши товары и услуги в обмен на взаимные исключительные права на добычу полезных ископаемых. Обе наши страны получат значительную выгоду от увеличения товарооборота между нами, однако выбор остается за нами."
 papua_residency_ast.1.a: "Конечно же, для них!"
 papua_residency_ast.1.b: "Нет, спасибо."
 papua_residency_ast.2.t: "Экономическая интеграция Папуа"
 papua_residency_ast.2.d: "Папуа-Новая Гвинея согласилась с предложенным соглашением о создании торгового союза, объединяющего экономики двух стран. Переговоры находятся на завершающей стадии, что позволит ввести беспошлинную торговлю товарами и услугами Папуа-Новой Гвинеи, упростить инвестиционный процесс и обеспечить приоритетные права на ресурсы для обеих сторон. Океания приблизилась на шаг к созданию регионального экономического союза."
 papua_residency_ast.2.a: "Отличный."
 papua_residency_ast.3.t: "Неспособность наладить контакт с Папуа"
 papua_residency_ast.3.d: "К сожалению, Папуа-Новая Гвинея отказалась от соглашения и предпочитает сохранить существующие торговые отношения."
 papua_residency_ast.3.a: "Разочаровывает."
 indo_ast_trade_deal.1.t: "Австралия предлагает торговое соглашение"
 indo_ast_trade_deal.1.d: "Стремясь смягчить наши холодные отношения, Австралия предложила соглашение о свободной торговле с обещанием военного сотрудничества в будущем. На данный момент сделка обеспечила бы беспрепятственный оборот товаров и услуг с нами, что, весьма вероятно, принесло бы экономический выгоду, но военное соглашение носит довольно расплывчатый характер."
 indo_ast_trade_deal.1.a: "Справедливое предложение."
 indo_ast_trade_deal.1.b: "Нет, спасибо."
 indo_ast_trade_deal.2.t: "Хорошие новости от Радда"
 indo_ast_trade_deal.2.d: "Кевин Радд вернулся из Индонезии с благоприятными результатами. Индонезия положительно отреагировала на соглашение о свободной торговле при условии, что наши Силы обороны Австралии возьмут на себя обязательства по совместным усилиям в области безопасности. Мы уже работали над контртеррористическими мероприятиями совместно с индонезийцами, так что это не будет чем-то новым, и запрос намеренно оставлен открытым, что позволит нам определить обязательства в будущем. На данный момент соглашение даст хороший импульс торговле между нашими странами."
 indo_ast_trade_deal.2.a: "Великолепный."
 indo_ast_trade_deal.3.t: "Индонезия отклонила торговое предложение"
 indo_ast_trade_deal.3.d: "К сожалению, правительство в Джакарте отказалось от соглашения, холодно отреагировав на попытки Радда, и предпочло сохранить существующие торговые отношения."
 indo_ast_trade_deal.3.a: "Не идеально, но, пожалуй, ожидаемо."
 forming_government_gil.1.t: "Выбирайте сами."
 forming_government_gil.1.d: "Результаты выборов ясно показали, что нам необходимо сформировать коалиционное правительство, если мы хотим остаться у власти. Сейчас оппозиция быстро пытается отвоевать свои места в Палате представителей. Левая фракция партии призвала нас к заключению пакта с «зелёными». Мы уже работали с ними раньше, и они, похоже, готовы, но некоторые из наших консервативных членов сомневаются в целесообразности такого шага, и, скорее всего, «зелёные» выдвинут свои собственные требования. С другой стороны, ряд бывших либералов обратились к нам с поддержкой некоторых пунктов нашей программы и готовы присоединиться к нам в коалиции. При поддержке бывших либералов мы можем выглядеть более двухпартийными в глазах населения. Учитывая результаты выборов, занять более центристскую позицию может оказаться неплохим вариантом."
 forming_government_gil.1.a: "Выбирайте «зелёных»"
 forming_government_gil.1.b: "Это будет коалиция либералов и лейбористов."
 gillard_gov_event.2.t: "Заполнение кабинета"
 gillard_gov_event.2.d: "По мнению Джулии, кабинет министров представлял собой весьма компетентную группу лучших представителей лейбористской партии, и, что более важно, лояльных ей людей. Уэйн Суон, новый заместитель. [GetASTLeaderTitle]Он согласился встретиться с Гиллард, чтобы обсудить формирование министерства иностранных дел. \n\nКогда они встретились в её кабинете, Гиллард объяснила, что она гораздо больше заинтересована в том, чтобы сосредоточиться на внутренних проблемах страны и позволить министерству иностранных дел самостоятельно решать эти вопросы. Вместе они обсудили варианты, и было два очевидных решения. Стивен Смит первым предложил свои услуги новому министру иностранных дел. [GetASTLeaderTitle]Ранее он служил под началом Китинга и с тех пор оставался верным сторонником лейбористов. Свон был уверен, что Смит будет следовать партийной линии и в целом удержит нас на правильном пути. \n\nДругой вариант — Боб Карр. Карр некоторое время не работал в парламенте консультантом и набирал популярность благодаря своим пламенным публичным дебатам. Его политика отличалась смелостью, и его назначение, несомненно, оставило бы свой след, если бы именно на этом сосредоточилась Джулия. Тем не менее, время для принятия решения ещё было, и, учитывая всё происходящее, спешить возобновлять работу за границей не было необходимости."
 gillard_gov_event.2.a: "Есть над чем подумать."
 forced_adoptions_gillard.1.t: "Правительство Гиллард рассматривает проблему принудительного усыновления."
 forced_adoptions_gillard.1.d: "[GetASTLeaderTitle] Сегодня вечером Джулия Гиллард принесла общенациональные извинения за исторические акты государственной политики 1950-1975 годов, которые вынудили тысячи матерей из числа коренного населения разлучить со своими детьми. \n\n\"Мы признаем глубокое влияние этой политики и практики на отцов и понимаем, какую боль эти действия причинили братьям и сестрам, бабушкам и дедушкам, партнерам и членам расширенной семьи.\" Гиллард обратилась к аудитории, состоящей из более чем 800 человек, находившихся в здании парламента, многие из которых плакали. \n\nПо оценкам, от 100 000 до 150 000 младенцев были насильно или принудительно отняты у матерей, в основном у молодых незамужних женщин."
 forced_adoptions_gillard.1.a: "Мы им искренне сочувствуем."
 let_debate_decide_gillard.1.t: "Законопроект о браках между однополыми парами отклонен"
 let_debate_decide_gillard.1.d: "Вполне ожидаемо, что Палата представителей подавляющим большинством голосов проголосовала против законопроекта о легализации однополых отношений: 98 против 42. Платформа нашей партии традиционно выступает против этой концепции, и большинство откликов сводятся к обычной защите традиционных ценностей и так далее. Мы уже столкнулись с большой критикой со стороны прогрессивных избирателей в интернете, и, несомненно, это отразится и на следующих выборах."
 let_debate_decide_gillard.1.a: "Ну что ж."
 let_debate_decide_gillard.2.t: "Поправка о борьбе с дискриминацией прошла через Сенат."
 let_debate_decide_gillard.2.d: "В неожиданном проявлении двухпартийного сотрудничества наш законопроект о защите прав однополых пар прошел через Палату представителей и Сенат с подавляющей поддержкой. Поправка включала в себя широкую защиту от дискриминации по признаку сексуальной ориентации, а также финансируемые государством программы для защиты и поддержки уязвимых групп населения и предоставления образовательных услуг, что укрепило уже существующий закон. От лидеров оппозиции поступили лишь незначительные жалобы по поводу мелких недочетов в руководящих принципах, но в целом это выглядит как победа целого поколения для партии. Поддержка, которую мы уже получаем в интернете от прогрессивных сил, просто огромна."
 let_debate_decide_gillard.2.a: "Ещё одна победа!"
 opposition_attacks_ast.1.t: "Оппозиция открыла огонь"
 opposition_attacks_ast.1.d: "Обычно риторика Тони Эббота всегда была отчасти подстрекательской, отчасти чрезмерной, но в последнее время он поднял свои нападки на новый уровень. После того, как толпа протестующих появилась у здания парламента с довольно «непристойными» плакатами, Эббот воспользовался возможностью выйти и пообщаться с ними, пригласив журналистов снять происходящее на видео. \n\nТо, что могло бы стать маргинальным мероприятием, привлекло такое внимание, что газеты теперь пишут об этом. \"БРОСЬ ВЕДЬМУ,\" а некоторые даже включают \"Сожгите эту суку.\" Это бестактно, даже для Эббота, и теперь к этому подхватили СМИ из Newscorp."
 opposition_attacks_ast.1.a: "Просто замечательно."
 opposition_attacks_ast.2.t: "Эбботт начал медиатур, критикуя наше правительство."
 opposition_attacks_ast.2.d: "Тони Эбботт в очередной раз привлёк к себе внимание, чтобы раскритиковать нашу политику. Недавно в программе Today Show Эбботт долго и нудно рассуждал о нецелесообразности нашего бюджетного планирования, называя его… \"расточительный,\" \"тупоголовый\" И обычные колкости. Это не ударило бы так сильно, если бы опрос Newspoll накануне не показал, что наше правительство менее предпочтительно, отставая от Эббота на 5 пунктов в опросах. По мере того, как наша поддержка падает, любой наш ответ не имеет под собой веских оснований."
 opposition_attacks_ast.2.a: "Неужели нам не повезёт?"
 ast_fm_rudd_focus.5.t: "Кевин Радд покидает кабинет министров."
 ast_fm_rudd_focus.5.d: "Во время пресс-конференции в Вашингтоне Радд, по всей видимости, объявил собравшимся, что официально уходит с поста министра иностранных дел. Это стало шоком для присутствующих и, безусловно, не лучшим образом отразилось на репутации нашего правительства, но ситуация ухудшилась, когда Радд обвинил нас в своем решении, заявив, что у него нет нашей поддержки. Весьма вероятно, что при первой же возможности Радд попытается бросить вызов нашему лидерству. Уже ходят разговоры о возможном расколе в партии, так что нам нужно быть готовыми ко всему. А пока нам нужен новый министр иностранных дел."
 ast_fm_rudd_focus.5.a: "Отсутствие поддержки? Но мы же его выбрали!"
 opposition_attacks_ast.3.t: "Тексты Питера Слиппера"
 opposition_attacks_ast.3.d: "Нынешний спикер Палаты представителей, Питер Слиппер, недавно подвергся критике после того, как сотни его личных сообщений были обнародованы в рамках судебного разбирательства против него. Ранее Питер был членом Либеральной партии, а затем перешел к нам в качестве независимого депутата. Сообщения довольно неприятные, хотя и являются личным делом спикера, но теперь либералы выставляют нас сексистами за то, что мы не уволили Питера сразу же. Тони Эбботт мобилизовал вотум недоверия против нас, если мы не уволим Питера Слиппера, в противном случае у нас будет возможность защитить себя в Ассамблее. Хотя сообщения не самые приятные, они едва ли хуже обычных либеральных высказываний, и не помешало бы высказать Эбботту все, что мы о нем думаем."
 opposition_attacks_ast.3.a: "Давайте попробуем в ассемблере."
 opposition_attacks_ast.3.b: "Тапочки-мешок."
 opposition_attacks_ast.4.t: "Речь Джилард о женоненавистничестве получила вирусную поддержку."
 opposition_attacks_ast.4.d: "Вчера во время ожесточенных парламентских дебатов... [GetASTLeaderTitle] Репутация лидера оппозиции Тони Эббота подверглась резкой критике после того, как напряженность вокруг переписки в Слиппере переросла в критическую точку в их затянувшейся вражде. Во время голосования по вотусу недоверия в Ассамблее Гиллард начала критиковать Эббота за его собственную сексистскую риторику в последние годы. \n\n\"Я не позволю этому человеку читать мне лекции о сексизме и женоненавистничестве, не позволю. И правительство не позволит этому человеку читать мне лекции о сексизме и женоненавистничестве. Ни сейчас, ни когда-либо в будущем.\" \n\nРечь Гиллард была немедленно хорошо принята не только по всей стране, но и в глобальном онлайн-пространстве. Британские и американские газеты быстро подключились к политической полемике, приветствуя выступление Гиллард. \"атака на сексизм\" как \"образование волдырей\" но \"блестяще,\" по сообщению газеты Telegraph."
 opposition_attacks_ast.4.a: "Рад, что это принесло свои плоды."
 rudd_events_gillard.1.t: "Кевин Радд предлагает свои услуги"
 rudd_events_gillard.1.d: "Пока мы еще находимся в процессе формирования нашего кабинета, Радд обратился к нам с предложением занять пост министра иностранных дел. Без сомнения, Радд, возможно, является самым опытным и доказавшим свою эффективность министром иностранных дел, и наличие человека с предыдущего поста в нашем кабинете сейчас может стать политическим преимуществом. Тем не менее, нам, возможно, стоит отделить наш кабинет от старого, если мы хотим выглядеть как новое лицо лейбористской партии."
 rudd_events_gillard.1.a: "Добро пожаловать на борт."
 rudd_events_gillard.1.b: "У нас всё хорошо, спасибо."
 rudd_events_gillard.2.t: "Драма вопросов и ответов"
 rudd_events_gillard.2.d: "Появилась информация о неожиданном появлении Кевина Радда на ток-шоу Q+A, где он ответил на ряд вопросов, касающихся его президентского срока. На первый взгляд, шоу не представляло собой ничего страшного, но некоторые члены кабинета министров отметили это. \"критический\" Рудд ответил на несколько вопросов в определенном тоне, возложив вину на некоторых... \"коллеги\" за подрыв его авторитета во время его пребывания в должности. \n\nКак бы беспристрастно это ни звучало, журналисты проводят прямую связь с нами и обвиняют членов нашего кабинета министров в падении Радда. Несмотря на всю нелепость этих обвинений, это создает нам еще одну головную боль в опросах общественного мнения."
 rudd_events_gillard.2.a: "Он делает это специально?"
 rudd_events_gillard.3.t: "Кевин Радд ведет предвыборную кампанию"
 rudd_events_gillard.3.d: "Недавно Радда заметили на местных выборах, где он поддерживал других членов Лейбористской партии. Безусловно, партия ценит эту поддержку, но Радд почти намеренно делает все это ради себя. Он превращает визиты в фотосессии и отвлекает внимание от кандидатов, чтобы дать собственные интервью. Он мобилизует поддержку вокруг себя, а не вокруг нашей администрации, и, возможно, это работает. \n\nПоддержка Радда в опросах Newspolls растет гораздо быстрее, чем в нашем случае, и если мы что-нибудь предпримем, чтобы остановить его небольшой тур, это может только ухудшить ситуацию."
 rudd_events_gillard.3.a: "Чёрт возьми, Кевин!"
 rudd_events_gillard.4.d: "Радда заметили в ряде местных избирательных округов, где он поддерживал наших кандидатов от Лейбористской партии. Это довольно стандартная деятельность для опытных членов партии, за исключением того, что Радд, похоже, изо всех сил старается привлечь внимание к нашей политике, продвигая её в прессе. Вопрос в том, поддержат ли это СМИ, но это творит чудеса с нашими рейтингами, и это, безусловно, поможет нам на предстоящих выборах в законодательное собрание штата."
 rudd_events_gillard.4.a: "Как это мило с вашей стороны."
 rudd_events_gillard.5.t: "Радд выступает против нашего правительства."
 rudd_events_gillard.5.d: "Как и ожидалось, Кевин Радд тайком пробирается в парламент, пытаясь настроить против нас еще больше наших министров. К сожалению, СМИ подхватывают эту идею. \"утечка\" В ходе разговора Радд заявил, что не верит в способность нашего правительства победить на следующих выборах и что рассматривает возможность выдвижения своей кандидатуры на пост лидера при наличии серьезной поддержки. \n\nКак обычно, это, вероятно, уловка Кевина, чтобы вывести нас из равновесия, и проведение референдума по поводу лидерства может поставить его на место, но стоит ли вообще этому подыгрывать?"
 rudd_events_gillard.5.a: "Вынести на голосование вопрос о руководстве."
 rudd_events_gillard.5.b: "Это пустяк."
 rudd_events_gillard.6.t: "Объявлено голосование по вопросу о лидерстве"
 rudd_events_gillard.6.d: "После выборов лидера Лейбористской партии Кевин Радд потерпел сокрушительное поражение со счетом 71:31. Радд пообещал положить конец любым дальнейшим попыткам оспорить наши кандидатуры и поддержать нас на любых будущих выборах, независимо от их обоснованности. Результаты показывают, что, несмотря ни на что, партия по-прежнему нас поддерживает. Это правительство продолжит свою миссию перед австралийским народом, как бы тяжело это ни было. Пришло время вернуться на арену и продолжить реализацию нашей политики."
 rudd_events_gillard.6.a: "Браво!"
 rudd_events_gillard.7.t: "Массовые отставки в правительстве"
 rudd_events_gillard.7.d: "В течение одной недели три ключевых члена нашего кабинета подали в отставку, что, как мы можем предположить, является своего рода протестом против нашего правительства. В ответ на это также ушли в отставку сторонники Радда из низших звеньев кабинета. Ситуация с партийным единством крайне плачевна. Нам нужно срочно найти замену и сделать объявление в ближайшее время, чтобы сохранить лицо. Если бы эти саботажи не происходили так часто, мы, возможно, проводили бы серьезные реформы и действительно выполняли бы ту работу, для которой были избраны."
 rudd_events_gillard.7.a: "Словно крысы, спасающиеся бегством с тонущего корабля."
 rudd_events_gillard.8.t.a: "«Зелёные» — Конец альянсу"
 rudd_events_gillard.8.t.b: "Бывшие независимые либералы объединяются вокруг [GetASTLeaderTitle]"
 rudd_events_gillard.8.d.a: "На фоне недавних кадровых перестановок в кабинете министров новый лидер партии «Зелёных», Кристин Милн, объявила, что их партия также откажется от сотрудничества с нами, распустив альянс. Они сослались на какой-то хоккейный трюк как на причину разногласий в политике, но мы знали, что это рано или поздно произойдёт. Лейбористы готовы вступить в следующие выборы в одиночку."
 rudd_events_gillard.8.d.b: "На фоне критики со стороны оппозиционных партий независимые депутаты сплотились вокруг [GetASTLeaderTitle], отстаивая политику нашего правительства в условиях продолжающейся драмы. Несмотря на постоянные госпитализации, Тони Виндзор даже появился перед камерами, чтобы похвастаться позитивными реформами, которые он помог провести, поддержав наши позиции в Палате представителей. Честно говоря, нам давно пора получить признание."
 rudd_events_gillard.8.a: "Типично."
 rudd_events_gillard.8.b: "Приветливый жест."
 rudd_events_gillard.9.t: "Еще один вызов лидерству"
 rudd_events_gillard.9.d: "По мере ухудшения наших позиций в опросах общественного мнения, наши критики в парламенте, словно акулы, учуявшие кровь, начали готовить борьбу за лидерство. С момента последних выборов наша поддержка значительно ослабла. Несмотря на обещания Кевина Радда, ходят слухи, что он выдвинет свою кандидатуру на голосование, если будет объявлена ​​борьба за лидерство, и, несомненно, он уже некоторое время строит козни со своими сторонниками. Несмотря на нашу победу на прошлых выборах, мы можем не выйти из этой ситуации невредимыми."
 rudd_events_gillard.9.a: "В бой."
 gillard_goodbye_ast.1.t: "Финальный занавес"
 gillard_goodbye_ast.1.d: "На встрече перед голосованием Радд пообещал уйти из политики в случае поражения, хотя на тот момент его слова не имели реального веса. Было бы приятно увидеть, как он медленно уходит в небытие, никогда больше не запятнав эти залы. К сожалению, нам не так повезло. Радд одержал убедительную победу с результатом 57 голосов против 45. \n\nДействительно ли Австралия была готова к появлению женщины? [GetASTLeaderTitle]Они этого совершенно не показывали ни внутри, ни за пределами парламента. Внезапно Джулия потеряла всё, чего так долго добивалась, и у неё даже не было времени это осознать. Они выбежали из зала заседаний лейбористской фракции и сразу направились в конференц-зал. \n\nДжилард произнесла свою последнюю речь перед толпой, похожей на ту, которая сопровождала ее церемонию присяги. Она была короткой и простой. Джилард не собиралась оспаривать результаты. Какой в ​​этом смысл? Иногда ты разыгрываешь свои карты и проигрываешь. \n\nА Гиллард не стала бы плохой проигравшей."
 gillard_goodbye_ast.1.a: "Теперь всё кончено."
 gillard_goodbye_ast.2.t: "Финальный тур голосования"
 gillard_goodbye_ast.2.d: "Во время голосования Гиллард сохраняла спокойствие. Она не хотела доставлять им удовольствие, выглядя обеспокоенной. Радд сидел в задней части зала, сгорбившись. Ему не нужно было ничего говорить, он просто излучал самодовольство. В свои последние мгновения... [GetASTLeaderTitle] Джулия отнеслась бы к этому с достоинством, иначе ей бы очень хотелось подойти к этому мужчине и вбить ему в голову хоть каплю здравого смысла. \n\nНачалось голосование, и имена кандидатов медленно зачитывались. 47… 51… 55… 63. Окончательный результат: 63 против 39. Гиллард победила. \n\nЧлены её кабинета встали и начали аплодировать позади неё. Она едва могла пошевелиться, но заставила себя подняться, чтобы принять тост, в то время как в её голове проносились мысли. Наконец-то партия её приняла? В знак какого-то последнего протеста Кевин Радд тоже встал и начал аплодировать. Перед голосованием Радд пообещал уйти из политики в случае поражения. Ей больше никогда не придётся его видеть. \n\nОни быстро вышли из зала заседаний фракции лейбористов и переместились в расположенный рядом конференц-зал, где Гиллард объявила результаты, подтвердив, что будет баллотироваться на следующих выборах."
 gillard_goodbye_ast.2.a: "Все кончено?"
 uranium_trade_deal_ast.1.t: "Предложение по торговле ураном из Австралии"
 uranium_trade_deal_ast.1.d: "Правительство Австралии представило нам экономическое соглашение об увеличении объемов экспорта урана в обмен на снижение пошлин на их экспорт в нашу страну. Правительство Австралии, в свою очередь, согласилось снизить пошлины на наш экспорт и открыть условия для более конструктивного сотрудничества в торговле в будущем. В соглашении оговорено, что уран не должен использоваться для обогащения урана оружейного качества, но как только руда окажется на нашей территории, решение остается за нами."
 uranium_trade_deal_ast.1.a: "Плодотворное соглашение."
 uranium_trade_deal_ast.1.b: "Это не в наших интересах."
 uranium_trade_deal_ast.2.t: "Индия согласилась на сделку по урану."
 uranium_trade_deal_ast.2.d: "Индия согласилась с новыми условиями и подписала торговое соглашение! Мы можем ожидать от них широкий спектр товаров и услуг по более высоким и упрощенным ценам, в то время как они снимут пошлины на наш уран. Ключевым фактором успеха сделки является также согласие Индии принять стандарты Международного агентства по атомной энергии (МАГАТЭ), предусматривающие запрет на использование урана для обогащения оружейного качества. Взамен мы будем сотрудничать с ними в области энергетических исследований."
 uranium_trade_deal_ast.2.a: "Выигрышная ситуация для всех!"
 uranium_trade_deal_ast.3.t: "Индия отказалась от торгового соглашения"
 uranium_trade_deal_ast.3.d: "Индия отклонила наши предложения о торговле и предпочла продолжить выполнение текущих обязательств. [GetASTLeaderTitle] [RAJ.GetLeader] не прокомментировал исход дела, но, похоже, мы не пользуемся расположением их правительства. Это, безусловно, шаг назад для мирной торговли и досадная ошибка."
 uranium_trade_deal_ast.3.a: "Мы теряем хватку."
 uranium_trade_deal_ast.5.t: "Москва подписывает пакт"
 uranium_trade_deal_ast.5.d: "Правительство в Москве согласилось с нашими торговыми условиями и отменит ряд пошлин на наши товары в обмен на увеличение экспорта урана в Москву. Хотя они не уточнили, для каких целей будет использоваться уран, они обязались не использовать его для обогащения урана оружейного качества. Эта сделка знаменует собой прорыв в сотрудничестве, подобного которому не было со времен падения Берлинской стены, и, похоже, они стремятся продолжить сотрудничество между нами."
 uranium_trade_deal_ast.5.a: "Доставайте борщ!"
 uranium_trade_deal_ast.6.t: "Москва выходит из переговоров"
 uranium_trade_deal_ast.6.d: "Россия отклонила наши предложения о торговле и предпочла продолжить выполнение текущих обязательств. Президент [SOV.GetLeader] Они не прокомментировали исход событий, но, похоже, мы не пользуемся расположением их правительства. Это, безусловно, шаг назад для мирной торговли и досадная ошибка."
 uranium_trade_deal_ast.6.a: "Лучше оставить медведя в покое."
 rudd_in_korea.1.t: "Соединение с землей в Австралии"
 rudd_in_korea.1.d: "Министр иностранных дел Австралии ведет переговоры с нами через Китай с целью организации потепления отношений между нами и Южной Кореей. План смелый и несколько наивный. Австралийцы потребовали от нас установить сроки прекращения производства дальнобойного оружия без демонтажа имеющегося вооружения в обмен на смягчение санкций и поддержку в области развития. Поскольку наша война с Южной Кореей формально не закончилась, они предложили урегулировать спор на контрольно-пропускном пункте демилитаризованной зоны. Это может стать выгодной пропагандистской возможностью."
 rudd_in_korea.1.a: "Уникальное событие."
 rudd_in_korea.1.b: "Это не в наших интересах."
 rudd_in_korea.2.t: "Триумф Кевина Радда в Корее"
 rudd_in_korea.2.d: "Кевин Радд, медленно проходя через контрольно-пропускной пункт демилитаризованной зоны между Северной и Южной Кореей, был встречен северокорейским лидером. [KOR.GetLeader]И они пожали друг другу руки. Каждый из них по свою сторону границы, что ознаменовало символический скачок в отношениях с Кореей и означало резкое изменение общего статус-кво в Азии. Затем Радд пересёк границу, став первым членом австралийского правительства и бывшим лидером, въехавшим в страну. \n\nПосле четырех месяцев напряженных переговоров, проходивших в Китае и обратно, был достигнут прорыв. [NKO.GetLeader] В обмен на смягчение санкций и поддержку в виде помощи развитию, были согласованы сроки прекращения разработки дальнобойного оружия и урегулирование Корейской войны, которая формально продолжается с 1950 года. Позже в тот же день Радд и Верховный лидер провели пресс-конференцию, подчеркнув взаимную дружбу, которую надеются достичь наши две страны. \n\nПрезидент Южной Кореи [KOR.GetLeader]Сопровождавший Радда в демилитаризованную зону высоко оценил усилия Радда, назвав их подлинным успехом и благом для международного мира."
 rudd_in_korea.2.a: "Грамотная дипломатия снова одержала победу."
 vietnam_trade_gillard_ast.1.t: "Торговые предложения со стороны Австралии"
 vietnam_trade_gillard_ast.1.d: "Правительство Австралии представило нам экономическое соглашение, направленное на оптимизацию торговли между нами в увеличенных объемах и минимизацию таможенных пошлин с обеих сторон. До настоящего времени мы поддерживали стабильно высокий уровень торговли, и, похоже, они заинтересованы в дальнейшем сотрудничестве."
 vietnam_trade_gillard_ast.1.a: "Справедливое предложение."
 vietnam_trade_gillard_ast.1.b: "Это нас не устраивает."
 vietnam_trade_gillard_ast.2.t: "Вьетнам согласился на торговые переговоры."
 vietnam_trade_gillard_ast.2.d: "Правительство Вьетнама согласилось с новыми условиями и подписало торговое соглашение. Мы можем ожидать от них широкого спектра товаров и услуг по более высоким и упрощенным ценам, а больше австралийцев смогут приобретать товары по более низким ценам в магазинах рядом с ними."
 vietnam_trade_gillard_ast.2.a: "Всё складывается воедино."
 vietnam_trade_gillard_ast.3.t: "Вьетнам отказывается от торговых переговоров"
 vietnam_trade_gillard_ast.3.d: "Вьетнам отклонил наши предложения о торговле и предпочел продолжить выполнение текущих обязательств. Возможно, внешнее давление помешало им подписать соглашение, но генеральный секретарь [VIE.GetLeader] не прокомментировал результат. Это, безусловно, шаг назад для мирной торговли в Тихоокеанском регионе и неудачный исход."
 vietnam_trade_gillard_ast.3.a: "Неутешительный результат."
 stir_the_pot_event.1.t: "Австралия требует введения бесполетной зоны."
 stir_the_pot_event.1.d: "После ряда инцидентов, в ходе которых наши истребители случайно попадали в гражданскую инфраструктуру, правительство Австралии потребовало от нас соблюдения принудительного режима \"бесполетная зона\" Над Ливией они требуют, чтобы наши самолеты оставались на их базах, иначе они могут быть атакованы австралийскими ВВС. Намерены ли они на самом деле выполнить это требование, сказать не могу, но они находятся очень далеко и требуют довольно многого."
 stir_the_pot_event.1.a: "Уступите их требованиям."
 stir_the_pot_event.1.b: "Воздушное пространство Ливии принадлежит Ливии!"
 stir_the_pot_event.2.t: "Ливия уступает нашим требованиям"
 stir_the_pot_event.2.d: "В условиях угрозы австралийского вмешательства [LBA.GetLeader] согласился ввести бесполетную зону над воздушным пространством Ливии на время гражданского конфликта. Это, как ожидается, позволит свести к минимуму жертвы среди гражданского населения и предотвратить распространение конфликта на соседние государства."
 stir_the_pot_event.2.a: "Реальная политика в действии."
 stir_the_pot_event.3.t: "Ливия отклонила нашу просьбу."
 stir_the_pot_event.3.d: "Несмотря на продолжающиеся жертвы среди мирного населения, [LBA.GetLeader] отказал нам в просьбе о создании «бесполетной зоны» над воздушным пространством Ливии. Продолжающийся гражданский конфликт будет и впредь представлять опасность для населения региона, и риск его распространения на соседние государства возрастает. Как мы будем добиваться выполнения наших требований, теперь зависит от нас самих."
 stir_the_pot_event.3.a: "Они знали альтернативу."
 myanmar_intervention_gillard.1.t: "Австралия требует сотрудничества в миротворческой деятельности"
 myanmar_intervention_gillard.1.d: "Правительство Австралии направило нам требование разрешить въезд в страну их миротворцам и оказать помощь в урегулировании нынешнего кризиса, связанного с повстанцами. Помощь была бы приветствована, однако, согласно условиям, мы фактически станем политическим марионеточным государством по отношению к их правительству до тех пор, пока кризис не будет урегулирован, что не оговорено в их условиях. Они, похоже, категорически настаивают на выполнении этого требования, до такой степени, что в случае нашего отказа военное вторжение не исключено."
 myanmar_intervention_gillard.1.a: "Категорически нет."
 myanmar_intervention_gillard.1.b: "У нас нет альтернативы."
 myanmar_intervention_gillard.2.t: "Мьянма принимает условия"
 myanmar_intervention_gillard.2.d: "В условиях растущей угрозы со стороны повстанцев [BRM.GetLeader] согласился разрешить нашим миротворцам войти в Малайзию для урегулирования кризиса. Значительная часть наших вооруженных сил вскоре начнет оккупацию. В конечном итоге это большая победа в борьбе с терроризмом."
 myanmar_intervention_gillard.2.a: "Это им же на пользу."
 myanmar_intervention_gillard.3.t: "Мьянма отрицает условия миротворческой миссии."
 myanmar_intervention_gillard.3.d: "Несмотря на то, что наша делегация поддерживает хорошие отношения с малазийцами, [BRM.GetLeader] категорически отказался от нашего предложения помочь в борьбе с растущим повстанческим кризисом. Страна продолжает разваливаться на части, находясь на грани краха, что представляет реальную опасность превращения в рассадник террористических ячеек. Учитывая, насколько серьезной может стать ситуация, наш ответ должен быть соразмерен опасности."
 myanmar_intervention_gillard.3.a: "Принудить их к сотрудничеству."
 myanmar_intervention_gillard.3.b: "Мы должны вмешаться."
 ast_myanmar_intervention_rejection_outcomes_tt: "Если Мьянма откажется, Австралия может ввести санкции и эмбарго или подготовить цель для марионеточной войны."
 reconciliation_discontent: "Недовольство примирением"
 reconciliation_discontent_desc: "Жизнь коренных австралийцев пронизана постоянным неравенством. Хотя дело Мабо вселило надежду во многих, неизменно безразличное руководство в течение последнего десятилетия подорвало большую часть надежды, которая еще оставалась у немногих, и сегодня еще меньше людей видят от этого пользу. Небольшое, но влиятельное меньшинство по-прежнему обращается к правительству с отчаянными просьбами о переменах."
 reform_despair_ast: "Примирение Отчаяние"
 reform_despair_ast_desc: "Без надежды на перемены дух примирения погас. Коренные австралийцы продолжают жить на обочине общества без гарантированного будущего, а многие другие разочарованы направлением нашей политики. Равенство для всех в нашей стране теперь кажется недостижимым. Можно ожидать, что недовольные избиратели в будущем поддержат более радикальные движения."
 rekindled_hope_ast: "Возродившаяся надежда"
 rekindled_hope_ast_desc: "С плеч многих австралийцев словно свалился груз. В небольшой, но ощутимой степени страна приблизилась к исцелению. Хотя путь еще долог, он стал легче. Появляется больше возможностей для нуждающихся. Рабочие места и школы стали более сплоченными и оказывают поддержку всем австралийцам. Теперь общество смотрит в будущее с надеждой."
 economic_radical: "Экономический радикал"
 john_howard: "Джон Ховард"
 the_rba_ast: "Резервный банк Австралии"
 the_rba_ast_desc: "Резервный банк Австралии является нашим центральным банком и органом, уполномоченным выпускать банкноты. По сути, это означает, что он контролирует процентную ставку. Если мы будем проводить разумную политику, снизим расходы и уровень безработицы, он тоже будет вести себя разумно."
 work_for_the_dole: "Работа за пособие"
 work_for_the_dole_desc: "Цель программы — обучить участников и, при наличии возможности, трудоустроить их, помогая местным сообществам. В течение всего периода работы они будут продолжать получать материальную поддержку, а мы — их дальнейшее обучение."
 work_for_the_dole_2: "Работа за пособие"
 work_for_the_dole_2_desc: "Цель программы — обучить участников и, при наличии возможности, трудоустроить их, помогая местным сообществам. В течение всего периода работы они будут получать материальную поддержку, а мы продолжим их обучение. По мере развития программы мы включили в список возможностей ряд государственных строительных должностей, чтобы помочь нам в проведении строительных работ."
 baby_bonus_idea_ast: "Детский бонус"
 baby_bonus_idea_ast_desc: "Цель программы — компенсировать расходы, ложащиеся на плечи молодых родителей, воспитывающих ребенка. Каждому ребенку, имеющему право на получение помощи, выплачивается единовременная сумма в размере 3000 долларов. Это должно способствовать росту населения и смягчить последствия старения австралийского населения."
 negative_gearing_tooltip_tt: "Это серьезно подорвет наши отношения с землевладельцами (§Ylandowners§!) и наши шансы на переизбрание, но может предотвратить жилищный кризис в будущем."
 tafe_investment: "Инвестиции в профессионально-техническое образование (TAFE)"
 signed_the_kyoto_protocol_ast: "Подписал Киотский протокол"
 kyoto_protocol_ast: "Киотский протокол"
 kyoto_protocol_ast_desc: "Протокол, первоначально принятый другими странами в 1997 году, стал ориентиром в сокращении выбросов парниковых газов в промышленности, основываясь на последних научных данных о глобальном потеплении. Хотя не все его ограничения вступили в силу, мы вводим их постепенно в надежде в конечном итоге достичь нулевого уровня выбросов парниковых газов."
 ast_avoid_the_speech_tt: "Партии будет приказано сохранять беспристрастность в интересах единства коалиции. Остаётся лишь надеяться, что общественность потеряет к ней интерес."
 national_water_initiative_ast: "§GНациональная водная инициатива§!"
 national_water_initiative_ast_2: "§GНациональная водная инициатива§!"
 ast_a_nation_worth_preserving_tt: "Результаты нашего успеха (§Gsuccess§!) будут ощущаться в последующих поколениях."
 police_and_security_increase_tt: "Наш §YФинансирование полиции и служб безопасности§! их размер будет увеличен для борьбы с протестами."
 police_and_security_increase_2_tt: "Наш §YФинансирование полиции и разведки§! будет увеличено для расширения наших судебных полномочий."
 asio: "АСИО"
 asio_desc: "Австралийская организация безопасности и разведки отвечает за защиту наших граждан от любых внутренних угроз. Созданная более пяти десятилетий назад, эта организация была адаптирована для противодействия растущим угрозам, с которыми Австралия сталкивается в новом тысячелетии."
 streamlined_asylum_policy_ast: "Упрощенная политика предоставления убежища"
 encourage_foreign_students_ast: "Привлечение иностранных студентов"
 foreign_industrial_experts_ast: "Иностранные технические эксперты"
 foreign_industrial_experts_ast_desc: "Иностранным экспертам были предоставлены дополнительные льготные визы. Это позволяет привлечь самых талантливых специалистов со всего мира для работы и преподавания в Австралии."
 border_protection_bill_ast: "Законопроект о защите границ"
 our_ast_deputy_peacekeepers: "Наши заместители миротворцев"
 australian_political_system: "Австралийская политическая система"
 king_of_the_battlers: "Король Битвы"
 tourism_campaign_ast: "Национальная кампания"
 accepted_pacific_solution: "Приняли Тихоокеанское решение"
 denied_pacific_solution: "Отказался от Тихоокеанского решения"
 IND_extremist_suppression_bonus: "Совместные усилия Австралии по борьбе с терроризмом"
 rudd_in_the_fire_tt: "Кевин Радд будет заниматься поиском возможностей для нас за рубежом. Подробнее §2решения§! Эта информация станет доступна во вкладке «Международные миссии» со временем."
 sino_aus_peacekeeping: "Китайско-австралийская миротворческая операция"
 sino_aus_peacekeeping_desc: "Хотя это лишь начало подобной инициативы, соглашение закладывает основу для будущих миротворческих операций в Тихом океане. Сотрудничая в сборе разведывательной информации, борьбе с терроризмом и защите торговли, мы можем и дальше обеспечивать безопасность океанов между нами и преодолевать разрыв между нашими двумя странами."
 ast_peacekeeping: "Китайско-австралийская миротворческая операция"
 chinese_export_bonus_ast: "Китайское экспортное соглашение"
 japanese_export_deal_ast: "Японское сельскохозяйственное соглашение"
 japanese_export_deal_ast_1: "Японское экспортное соглашение"
 howard_doctrine_tt: "Информация о новых зарубежных проектах будет доступна на вкладке §2decisions§!."
 ast_international_missions: "Международные миссии"
 ast_international_missions_desc: "Наша доктрина отражает гибкость в изучении новых возможностей, которые мы считаем перспективными, при одновременном уважении к старым. Австралия стоит на пороге блестящего нового будущего. Нам просто нужно немного подтолкнуть её."
 aus_us_visit: "Государственный визит в Америку"
 aus_china_visit: "Государственный визит в Китай"
 aus_norm_nk: "Нормализация отношений с Северной Кореей"
 aus_sk_visit: "Государственный визит представителей Южной Кореи"
 aus_tur_visit: "Церемония в Галлиполи, Турция"
 aus_rus_visit: "Государственный визит в Россию"
 aus_eng_visit: "Государственный визит монархии"
 ast_political_decisions: "Политические решения"
 ast_political_decisions_desc: "Для эффективного управления страной нам иногда приходится засучивать рукава и подкупать людей. Будь то промышленные гиганты или те, кто ближе к правительству, то, что мы делаем за кулисами, поддерживает функционирование страны. Это нечестная работа, но она очень трудоемка."
 ast_approach_the_unions: "Обратитесь к профсоюзам."
 ast_approach_the_unions_desc: "Никому из нас не нравится иметь дело с профсоюзами, но если мы хотим добиться хоть какого-то прогресса в отрасли, необходимо идти на компромисс. От этого зависят наши усилия по реформированию."
 ast_manufacturer_subsidies: "Субсидии производителям"
 ast_manufacturer_subsidies_desc: "Субсидии — это как WD-40 для производственных предприятий. Когда у некоторых из них дела идут не очень гладко, вы прибегаете к субсидиям и надеетесь, что они придут в себя."
 ast_cabinet_reshuffle: "Перестановки в кабинете министров"
 ast_cabinet_reshuffle_desc: "В последнее время кабинет министров отстаёт от партийной линии. Некоторые просто не подходят для этой работы, а другие откровенно неподчиняются. К счастью, мы можем использовать одну из немногих полномочий, которыми обладаем как лидеры партий. Перетасовав состав кабинета, мы можем выдвинуть на первый план некоторых из наиболее перспективных кандидатов и убрать тех, кто менее склонен нам помогать."
 ast_loosen_gambling_restrictions: "Смягчение ограничений на азартные игры"
 ast_loosen_gambling_restrictions_desc: "Азартные игры — одна из самых распространенных пороков среди австралийцев. Они так или иначе пронизывают практически все сферы нашей экономики. В последние годы наша политика жестко наказывала эту отрасль, но мы можем немного ослабить некоторые ограничения, чтобы получить краткосрочную выгоду и угодить всем."
 ast_revisit_zoning_laws: "Пересмотрите законы о зонировании."
 ast_revisit_zoning_laws_desc: "В настоящее время правительство штата и местные советы диктуют «что, где и как» строить на земельных участках. В последнее время застройщики настойчиво требуют снять некоторые ограничения. Пересмотр руководящих принципов мог бы снять некоторые из этих опасений."
 cdep: "Проекты по развитию занятости в сфере развития местных сообществ"
 cdep_desc: "Первоначальная программа возникла из желания дать коренным общинам возможность самостоятельно планировать и строить проекты развития. Программа успешно функционировала, но мы можем расширить масштабы проектов, направляя государственных специалистов и увеличивая доступное финансирование."
 nielns: "Национальная стратегия повышения грамотности и навыков счета на английском языке среди коренного населения"
 nielns_desc: "Уровень грамотности среди аборигенов и жителей островов Торресова пролива в последние годы резко упал, что в сочетании с и без того низкими показателями посещаемости выглядит как рецепт катастрофы. Если мы будем сотрудничать со школами для разработки программ, которые помогут ученикам, это может изменить жизнь многих людей."
 fam_violence_proj: "Проекты по предотвращению насилия в семье"
 fam_violence_proj_desc: "Насилие в семье было неприглядной правдой, к которой в 90-е годы мало кто из политиков хотел прикасаться. Новые подходы, основанные на фактических данных, сделали этот процесс более клиническим и менее обременительным с точки зрения политики, поэтому финансирование таких программ для нас не представляет сложности."
 construct_recon_place: "Постройте Место Примирения"
 construct_recon_place_desc: "На нашем столе на утверждение находится ряд проектов по благоустройству городских территорий. Главный из них — «Место примирения» в Канберре. В случае одобрения это станет прекрасным свидетельством наших усилий."
 repatriate_remains: "Репатриация останков коренных жителей"
 repatriate_remains_desc: "Ни для кого не секрет, что в британских музеях хранится множество экспонатов, похищенных из других стран. Среди них — человеческие останки. Ряд коренных народов подали петицию с требованием вернуть останки в Австралию для захоронения."
 mabo_referendum: "Поправка о состоянии примирения"
 mabo_referendum_desc: "Внесение поправок в конституцию должно официально включать в преамбулу Конституции Заявление о примирении, признающее права коренных австралийцев на их землю."
 ast_walk_the_journey_tt: "Программы и мероприятия, связанные с нашими усилиями по примирению, будут доступны в разделе «Политика». §2Решения§! вкладка."
 mabo_vibe_tt: "Поправка о состоянии примирения станет доступна в §2decisions§!."
 ast_strong_in_difference_1_ast: "Управляемый мультикультурализм"
 the_lucky_country_ast: "Счастливая страна"
 the_lucky_country_ast_desc: "Многолетнее расширение горнодобывающей промышленности и отсутствие инноваций в других секторах сделали нас зависимыми от экспортной экономики. Чтобы процветать здесь, нашим конгломератам придётся вкладывать значительные средства и удовлетворять свои потребности. Либо это, либо что-то должно измениться."
 wind_power_grants_ast: "Гранты на развитие ветроэнергетики"
 acis_ast: "§2Программа повышения конкурентоспособности и инвестиций в автомобильную промышленность§!"
