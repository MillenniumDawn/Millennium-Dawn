 form_AVG_category: "Анжуйская империя"
 form_AVG_category_desc: "Анжуйская империя была вершиной европейского могущества в XII и XIII веках, когда династия Плантагенетов правила Англией, значительной частью Франции и другими территориями. Империя отличалась культурным и политическим влиянием на весь континент. Возрождение Анжуйской империи стало бы монументальным достижением, вновь объединившим эти исторические земли под одним знаменем."
