 EU_news.40.a: "D'accord"
 EU_news.41.t: "Campagne pro-européenne - Succès !"
 EU_news.41.d: "[FROM.GetFlag] [FROM.GetNameDefCap] a lancé une campagne pro-européenne. Ce fut un succès ! L'euroscepticisme est en baisse de 5 % pour [ROOT.GetFlag] [ROOT.GetNameDef]."
 EU_news.41.a: "D'accord"
