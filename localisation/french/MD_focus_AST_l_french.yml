 australia_abbottgov_focus: "Le gouvernement Abbott"
 tony_abbott_desc: "Tony's career has been a performance of dancing around criticism, and raining it upon his opponents. As a viciously capable opposition leader, Tony has led the party towards a more hard-right stance, with a penchant for popularising his three-word slogans. \n\nBorn in London, raised in Sydney as a Roman Catholic, and educated as a Jesuit, Tony's first priority in school was to become a priest. A deep desire for service and spiritual leadership drove him to eventually return to the UK as an Oxford Student, learning as much as he could before his service. Although, despite the adoration, his inclinations for politics would never leave him. \n\nHis regular organising of rallies and demonstrations put him opposed to Oxford's left-wing student leadership, eventuating in violent clashes. Upon his return to Australia, Tony would follow his original intentions and join the priesthood in 1984 at the age of 26. After three years in the service, he would come to admit to being \"a square peg trying to go into a round hole,\" and that the priesthood was not simply meant for him. \n\nSince his devotion was not enough to overcome his love for the excitement of politics, Tony joined The Bulletin as a journalist, leading to eventual role as Press Secretary for the Liberal Party. The experienced, and divisive party performer has now risen to the highest seat in the Nation."
 executive_management_ast: "Direction exécutive"
 the_turnbull_government_desc: "Il n'y a pas de contenu pour cet arbre pour le moment. Un arbre de focuses Turnbull sera développé plus tard ; pour l'instant, ce focus est un placeholder."
 collapsing_state_sol: "État en effondrement"
 collapsing_state_sol_desc: "L'ordre public s'est effectivement effondré dans le pays, de vastes zones étant contrôlées par des bandes de policiers hors-la-loi et de militants armés. Le peu d'économie qui reste est en chute libre, et le gouvernement lui-même est coincé au parlement. Sans finances ni autorité pour maîtriser la spirale."
 collapsing_state_sol_1: "État fragile"
 collapsing_state_sol_1_desc: "La majorité des militants ont été désarmés et restent sous la garde de l'État. L'ordre a été rétabli dans quelques villes, mais la situation demeure dans un équilibre délicat."
 collapsed_state_sol: "État effondré"
 collapsed_state_sol_desc: "As many of the inhabitants continue to flee the islands, the remaining militants continue to pick over the carcass of a dead nation. The last lights of democracy have faded, and there is little hope of a future for those trying to survive."
