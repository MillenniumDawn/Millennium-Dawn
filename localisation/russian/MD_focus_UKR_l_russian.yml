 UKR_storage_item_gtmu_tt: "§YГТ-МУ§!\n\n\n£PMR_LAND_GTMUSPG\n\n\n\nНа хранении: §Y[?ukraine_has_gtmu_stockpile|0]§!\nПоколение: лёгкий гусеничный транспортёр советской эпохи.\nТип техники: §YКорпус БМП 1-го поколения§!\n\nСемейство вариантов:\n• ГТ-МУ\n• ГТ-МУ-1Д\n\nЛёгкий многоцелевой гусеничный транспортёр. На его шасси можно установить миномёты, лёгкие орудия или инженерное оборудование."
 UKR_storage_item_2k11: "2К11 «Круг»"
 UKR_storage_item_2k11_count: "§Y[?ukraine_has_2k11_stockpile|0]§!"
 UKR_storage_item_2k11_icon: "GFX_SOV_LAND_2K11"
 UKR_storage_item_2k11_tt: "§Y2К11 «Круг»§!\n\n\n£SOV_LAND_2K11\n\n\n\nНа хранении: §Y[?ukraine_has_2k11_stockpile|0]§!\nПоколение: войсковой зенитный ракетный комплекс первого поколения, на вооружении с 1965 года.\nТип техники: §YКорпус ЗСУ 1-го поколения§!\n\nСемейство вариантов:\n• 2К11 «Круг»\n• 2К11А «Круг-А»\n• 2К11М «Круг-М»\n• 2К11М1 «Круг-М1»\n\nГусеничный зенитный ракетный комплекс средней дальности §Rсоветской§! войсковой ПВО."
