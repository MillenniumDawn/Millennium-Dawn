 france_md.555.t: "Guia dos Caminhos Políticos"
 france_md.555.d: "A maioria dos caminhos da árvore política pode ser desbloqueada fazendo-os vencer a eleição de 2002 ou elegendo-os manualmente nas eleições seguintes. No entanto, alguns caminhos são inicialmente inacessíveis por motivos de realismo e lógica. Você pode acessar esses caminhos seguindo este guia: \nPara desbloquear os caminhos Bonapartista e Monarquista: Eleja a Frente Nacional/Reagrupamento Nacional (Nacional-Populista). Complete o foco : \"Focus on Insecurity\" e um evento será disparado no qual uma facção radical oferece ajuda. Deixe-os ganhar terreno e permita que deem um golpe para tirá-lo do poder; você poderá levar os Bonapartistas ou Monarquistas ao poder. \nPara a Comuna da França, o processo é o mesmo: complete o foco \"Reform Rather Than Revolution\" e deixe os extremistas tirá-lo do poder. \nPara o caminho da França Insubmissa: Eleja o Partido Socialista (Socialismo Ocidental). Complete o foco \"Cut With Unions\". Isso provocará o colapso do Partido Socialista e desbloqueará o caminho da França Insubmissa. \nOutras mudanças de partidos estão espalhadas por vários eventos, mas por enquanto são apenas cosméticas."
 france_md.555.a: "Obrigado por me guiar"
 france_md.556.t: "Uma Dissolução Bem-Sucedida"
 france_md.556.d: "A assembleia já não refletia de fato o que nossos cidadãos queriam para nosso país. A dissolução da assembleia mostrou aos nossos concidadãos o quanto pior a situação do governo poderia ter sido. Eles fizeram a escolha certa ao nos preferir aos extremistas."
 france_md.556.a: "Foi uma ótima ideia"
