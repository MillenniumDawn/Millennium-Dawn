 GER_infantry_weapons_2: "Heckler & Koch G3A3"
 GER_infantry_weapons_2_short: "G3A3"
 GER_infantry_weapons_2_desc: "G3A3 — наиболее известная версия G3. Разработана с новыми улучшенными барабанными целиками, улучшенной мушкой, пламегасителем/дульным тормозом, фиксированным цельным пластиковым прикладом и пластиковым цевьём, которое не соприкасается со свободно вывешенным стволом. Цевьё выпускалось в тонком вентилируемом исполнении и в широком исполнении. Последнее позволяет установить сошки для повышения устойчивости."
 GER_infantry_weapons_3: "Heckler & Koch G3A4"
 GER_infantry_weapons_3_short: "G3A4"
 GER_infantry_weapons_3_desc: "G3A4 — ещё одна улучшенная версия предыдущей модели G3A3 с барабанными прицелами и новой однопозиционной конструкцией; некоторые модели получили новую двустороннюю спусковую группу и латунный отражатель гильз для стрелков-левшей. G3A4 поступила на вооружение фронтовых пехотных частей в 1974 году и состояла на вооружении до конца 1990-х годов, после чего была снята с вооружения и заменена."
 GER_infantry_weapons_4: "Heckler & Koch G36"
 GER_infantry_weapons_4_short: "G36"
 GER_infantry_weapons_4_desc: "Heckler & Koch G36 (Gewehr 36) — штурмовая винтовка калибра 5,56x45 мм, разработанная в начале 1990-х годов немецким производителем оружия Heckler & Koch на замену более тяжёлым моделям G3 калибра 7,62x51 мм. Она была принята на вооружение бундесвера в середине 90-х, заменив G3. С тех пор G36 также стала популярным экспортным товаром и активно применялась военными и полицейскими подразделениями ряда стран, включая Германию, Испанию и Соединённое Королевство."
 GER_infantry_weapons_5: "Heckler & Koch G36A2"
 GER_infantry_weapons_5_short: "G36A2"
 GER_infantry_weapons_5_desc: "Модель G36A2 - это обновленный вариант модели G36. G36A2 оснащен быстросъемным коллиматорным прицелом Zeiss RSA, установленным на планке Пикатинни, который заменяет оригинальный коллиматорный прицел в сдвоенной боевой прицельной системе. Модернизированный комплект G36A2 также состоит из укороченного приклада G36C, нового цевья из алюминия с дополнительными четырьмя планками Пикатинни и вертикальной рукоятки со встроенным переключателем для управления лазерным модулем Oerlikon Contraves LLM01."
 GER_infantry_weapons_6: "Heckler & Koch G36A3"
 GER_infantry_weapons_6_short: "G36A3"
 GER_infantry_weapons_6_desc: "Винтовка G36A3 представляет собой дальнейшую модернизацию платформы G36; с увеличенной планкой Пикатинни, 4-позиционным убирающимся прикладом и интегрированным оптическим коллиматорным прицелом Zeiss RSA / ручкой для переноски, замененной оптическим блоком Hensoldt."
 GER_infantry_weapons_7: "Heckler & Koch G95K"
 GER_infantry_weapons_7_short: "G95K"
 GER_infantry_weapons_7_desc: "Heckler & Koch HK416 — это газоотводная штурмовая винтовка под патрон НАТО 5,56x45 мм. Она разработана и производится немецкой компанией Heckler & Koch. Хотя конструкция основана на оружии класса AR-15, в ней используется фирменная газопоршневая система с коротким ходом поршня от более раннего семейства винтовок G36 компании Heckler & Koch. HK416 также оснащена фирменным цевьём с планками со всех четырёх сторон для установки различных аксессуаров."
 GER_infantry_weapons_8: "Heckler & Koch 433"
 GER_infantry_weapons_8_short: "HK 433"
 GER_infantry_weapons_8_desc: "Heckler & Koch 433 (HK433) — это современная модульная компактная штурмовая винтовка под патрон 5,56x45 мм, сочетающая сильные стороны и выдающиеся характеристики предыдущих служебных винтовок G36 и HK416. HK 433 оснащена новым складным и выдвижным прикладом с регулируемым по высоте упором для щеки для повышения точности стрельбы; оружие также можно использовать со сложенным прикладом в ближнем бою (CQC)."
