l_simp_chinese:
 charoenchai_hinthao: "乍龙猜·欣涛"
 charoenchai_hinthao_desc: "这位2020年代的泰国皇家陆军总司令，凭借其防御战术和南部边境的惨痛教训而声名鹊起。他训练部队坚守阵地，令进攻者疲于奔命。"
 songwit_noonpakdee: "颂威·农帕迪"
 songwit_noonpakdee_desc: "这位泰国皇家陆军高级军官以参谋工作和组织能力著称，而非擅长作秀。他负责维持军队各部队的人员配备、物资供应和战备状态，并且能够轻松应对高层指挥中的各种政治斗争。"
 adung_phaniam: "阿东·潘伊安"
 adung_phaniam_desc: "一位泰国皇家海军现代舰队的高级将领，精通主力舰和水面作战理论。他主张建立一支影响力超越泰国湾的海军。"
 punpakdee_pattanakul: "蓬帕克迪·帕塔那库"
 punpakdee_pattanakul_desc: "一位泰国皇家空军改革派军官，致力于推动空军走向专业化标准、现代化机身和培养飞行员而非阅兵式队伍的训练体系。"
 intel_chief_nia: "国家情报局局长"
 intel_chief_nia_desc: "泰国国家情报局局长负责指挥该国的民用情报工作，将来自各省、边境和宫廷网络的情报整合起来，为政府提供单一的情报图景。"
 thailand_focus: "泰国国策树"
 SIA_the_2001_election_shortcut: "2001年大选"
 SIA_lost_territories_shortcut: "失去的领土"
 SIA_armed_forces_modernization_shortcut: "武装部队现代化"
 SIA_recover_from_97_crisis_shortcut: "冬阴功危机"
 SIA_asean_centrality_shortcut: "东盟中心地位"
 SIA_the_southern_question_shortcut: "南方问题"
 SIA_kra_gateway_shortcut: "克拉地峡"
 SIA_recover_from_97_crisis: "从冬阴功危机中恢复过来"
 SIA_recover_from_97_crisis_desc: "1997年，泰铢危机在曼谷爆发。泰国耗尽外汇储备捍卫泰铢固定汇率后，被迫实行浮动汇率制，并接受国际货币基金组织的备用安排。该方案维持了泰国的财政稳定，但代价是遭受了国际货币基金组织的过度监管，并丧失了经济尊严。最后一步是：完成经济复苏，提前偿还基金组织贷款，并重获完全主权。"
 SIA_the_1997_constitution: "人民的宪法"
 SIA_the_1997_constitution_desc: "1997年宪法是在前所未有的公众参与下起草的，承诺设立民选参议院、保障人权和建立强有力的反腐败机构。但它能否经受住泰国政治的考验，则是另一个问题。"
 SIA_repay_the_imf: "提前偿还IMF贷款"
 SIA_repay_the_imf_desc: "泰国于2003年7月清算了最后一笔备用设施贷款，比原计划提前了两年。提前还清贷款的意义不在于本金本身，而在于其释放的信号。市场不再将泰国债务视为救助风险，我国得以再次以低成本借款。"
 SIA_amazing_thailand: "惊艳泰国"
 SIA_amazing_thailand_desc: "助我们度过危机岁月的旅游宣传活动将升级为国家战略。从普吉到清迈，世界受邀来到微笑之国，并以硬通货来买单。"
 SIA_rice_and_rubber: "亚洲稻乡"
 SIA_rice_and_rubber_desc: "泰国是全球首屈一指的大米出口国和橡胶超级大国。实现伊桑地区和南部的农业经济现代化以将农业优势转化为出口收入。"
 SIA_detroit_of_asia: "亚洲底特律"
 SIA_detroit_of_asia_desc: "日本和美国的汽车制造商已将东部沿海地区作为其区域工厂基地。全力发展汽车产业，让“泰国制造”成为全球标准。"
 SIA_suvarnabhumi_airport: "素万那普机场"
 SIA_suvarnabhumi_airport_desc: "历经数十年的规划，新曼谷机场将成为东南亚的航空枢纽。以普吉这样的省级门户机场将为其输送客流，并提升泰国航空业的整体水平——前提是我们能建成它。"
 SIA_eastern_economic_corridor: "东部沿海"
 SIA_eastern_economic_corridor_desc: "深化从春武里到罗勇涵盖港口、炼油厂、工厂和铁路的工业走廊建设。建设这一泰国经济的引擎。"
 SIA_medical_hub: "亚洲医疗中心"
 SIA_medical_hub_desc: "我国以第三世界的价格提供第一世界水准的医疗服务。医疗旅游吸引着来自全球的患者，声名远扬。"
 SIA_education_for_the_future: "王国教育"
 SIA_education_for_the_future_desc: "泰国课堂仍偏重死记硬背而非问题解决，且曼谷与外府之间的师资质量差异悬殊。现代化课程、训练有素的教师，以及与产业需求对接的职业培训路径，是迈向高收入经济体的基础。"
 SIA_asean_centrality: "东盟中心地位"
 SIA_asean_centrality_desc: "曼谷，1967年东盟成立之地。我们将再次开启对友邻的投资，因为一个稳定友好的东南亚就是泰国最好的安全保证。"
 SIA_treaty_ally: "主要非北约盟国"
 SIA_treaty_ally_desc: "我国与美国保持着其在亚洲历史最悠久的条约关系。深化“金色眼镜蛇”联合军演，引进美国军事装备，趁安全保证尚存之际将其牢牢握在手中。"
 SIA_bamboo_bends_east: "竹斜向东"
 SIA_bamboo_bends_east_desc: "泰国外交向来顺风使舵，而如今这阵风正从北京吹来。中国的投资、中国的铁路、中国的市场——这一切应有尽有，只是代价尚在谈判之中。"
 SIA_the_2001_election: "2001年大选"
 SIA_the_2001_election_desc: "人民宪法实施后的首次大选。旧有的政治共识已经在危机下被打破。新兴的民粹势力、传统的权力网络以及民主党，如今都在为国家的前进方向而角逐。"
 SIA_thai_rak_thai: "泰爱泰党"
 SIA_thai_rak_thai_desc: "泰国人爱泰国人。他信·钦那瓦的压倒性胜利重新绘制了选举版图。如今，北部的乡村与东北部地区决定了由谁来执政，而他们已经选出了自己的代言人。"
 SIA_thaksinomics: "他信经济学"
 SIA_thaksinomics_desc: "他信经济学即发展双轨经济。第一轨优先发展全球出口，第二轨则侧重于基层和国内创业。这种方法促进了增长，但批评者认为它拉大了贫富差距。"
 SIA_30_baht_healthcare: "30泰铢医保计划"
 SIA_30_baht_healthcare_desc: "任何疾病，任何医院，三十泰铢。全民医疗覆盖改变了数百万泰国农村民众的生活，并巩固了他们对他信的忠诚。"
 SIA_village_fund: "百万泰铢村庄基金"
 SIA_village_fund_desc: "全国每个村庄和城市社区都将获得一百万泰铢的循环小额信贷，这是有史以来规模最大的小额信贷项目之一。"
 SIA_otop: "一村一品"
 SIA_otop_desc: "每个区县都发展、打造并出口一种标志性的地方产品，把家庭手工业上升为国家战略。"
 SIA_dual_track_economy: "双轨经济"
 SIA_dual_track_economy_desc: "出口增长，农村收入提升，债务提前偿还。无论批评者如何评价其实现方式，成绩单上的数据都倾向于政府一方。"
 SIA_war_on_drugs: "禁毒战争"
 SIA_war_on_drugs_desc: "为期三个月的打击贩毒行动。它必将赢得民心，但也将招致严重的人权问题指责，并在未来数年内持续困扰政府。"
 SIA_ceo_premier: "CEO总理"
 SIA_ceo_premier_desc: "以经营公司的方式治理国家。各部委实行关键绩效指标考核，内阁会议流动至各府举行，不接受官僚体制的拖沓。这套做法行之有效，却也侵蚀着每一个本应能说“不”的体制机构。"
 SIA_dominant_party_state: "一个政党，一个泰国"
 SIA_dominant_party_state_desc: "吸收联盟伙伴，掌控广播频道，赢得每一场补选。选举政治仍在继续，但只剩下一个压倒性的选择。"
 SIA_consolidate_democracy: "巩固民主"
 SIA_consolidate_democracy_desc: "以选票赢得权力，以结果巩固权力，并让制度屹立不倒。让民粹机器臣服于人民宪法。"
 SIA_normalization_friction: "正常化的阵痛"
 SIA_normalization_friction_desc: "旧体制的恩庇网络并不会按时瓦解。即便政党自身走上了正道，这些网络仍然抗拒解散，顽固存续。"
 SIA_thaksin_forever: "永远选他信"
 SIA_thaksin_forever_desc: "反对党已无足轻重——法院已被收买，参议院忠心耿耿。既然如此，这项事业又何必结束？执政党正变为永久性的政党。"
 SIA_shinawatra_dynasty: "钦那瓦王朝"
 SIA_shinawatra_dynasty_desc: "这场运动将超越任何单一领导人的生命周期。政党的门面可以换成姐妹或女儿，但真正的权力仍然属于他信·钦那瓦及其追随者。"
 SIA_the_old_order: "恩荫君主制"
 SIA_the_old_order_desc: "王室、军队、司法体系、官僚机构——这些正是带领泰国渡过每一场风暴的制度支柱。它们能历经七十年的动荡而屹立不倒，靠的从来不是让选举来决定一切。"
 SIA_privy_council: "枢密院"
 SIA_privy_council_desc: "国王的顾问们——退役将领、法官和政治家——坐镇于体制网络之中那个安静的枢要之地。强化那些绕过民选政府的渠道。"
 SIA_sufficiency_economy: "自足经济"
 SIA_sufficiency_economy_desc: "王室温和、韧性与抵御冲击的发展理念，是债务驱动型民粹主义增长的鲜明反例。"
 SIA_royal_guidance: "国王谕令"
 SIA_royal_guidance_desc: "每年十二月，国王致辞，举国倾听。一篇生日演说能为政府赐福，或悄然保留这份祝福，这份敬重之力，非选票或大臣所能抗衡。王座之声将会把国家从政治狂热中拉回。"
 SIA_three_pillars: "民族、宗教、国王"
 SIA_three_pillars_desc: "在泰国，佛教、民族、君主——三色国旗被塑造成公民的道德信条。僧侣走进校园，国王画像悬挂于每面墙壁之上，整个国家被构建为一个统一的道德共同体。这的确是一剂强大的粘合剂——但在那些清真寺人头攒动的地方，这套信条读起来却像一道紧闭的大门。"
 SIA_yellow_shirts: "集结人民联盟"
 SIA_yellow_shirts_desc: "人民民主联盟身着王家黄衫，涌上曼谷街头，要求民选政府下台。城市中产阶级已表明立场。"
 SIA_the_2006_coup: "九月政变"
 SIA_the_2006_coup_desc: "总理在国外期间，坦克驶入曼谷。宪法被暂停，民主改革委员会接管政权。循环再次开始。"
 SIA_guardian_of_the_nation: "国家守护者"
 SIA_guardian_of_the_nation_desc: "军队的自我认知已然化为信条——自诩超然于政治之上，却又自认有权终结任何威胁国家的政治。如今，军队的否决权将制度化。"
 SIA_judicial_activism: "司法化"
 SIA_judicial_activism_desc: "一纸法庭裁决便可完成的事情，何必派出战车？解散政党与取消资格，这就是建制派手中的手术刀。"
 SIA_the_2014_coup: "全国维持和平秩序委员会"
 SIA_the_2014_coup_desc: "戒严在前，政变在后。全国维持和平秩序委员会无限期中止政治活动，对全国进行思想整顿。"
 SIA_lese_majeste_enforcement: "保卫神圣制度"
 SIA_lese_majeste_enforcement_desc: "《刑法》第112条以“大不敬罪”将王室置于不容冒犯之地。以毫无保留的方式执行此条，且看每一个反对派运动在开口前都得先掂量掂量自己的言辞。"
 SIA_isoc_state: "军队阴影下的国家"
 SIA_isoc_state_desc: "国内安全行动指挥部——军队在各府的政治臂膀——正在成为一个负责“安全”事务的平行政府，尤其是在泰南边境三府。"
 SIA_isoc_overreach_backlash: "公众不安"
 SIA_isoc_overreach_backlash_desc: "国内安全机构对日常生活的渗透，已不仅限于泰南地区。普通泰国人开始察觉到这一点，并且对此颇为不满。"
 SIA_the_2017_constitution: "管理式民主"
 SIA_the_2017_constitution_desc: "一个完全由任命产生的参议院、一条允许非民选人士出任总理的条款、一份约束未来所有政府长达二十年的国家战略——选举将会恢复，但被关在笼子里。"
 SIA_perpetual_guardianship: "永久守护"
 SIA_perpetual_guardianship_desc: "将那些始终隐而不宣的规则加以正式确立。军队从此成为宪政框架下的常设裁判者。稳定——不论实现方式——得以永存。"
 SIA_royal_restoration: "王位复辟"
 SIA_royal_restoration_desc: "超越任何政府的胆量。将这张关系网的线索汇集起来，正式交到皇室手中。却克里王朝重新直接统治国家。"
 SIA_seeds_of_reform: "改革的种子"
 SIA_seeds_of_reform_desc: "在民粹主义者和保皇派的旧二元对立之外，第三股力量正在聚集。他们年轻、都市化、活跃于网络，并且厌倦了政变。"
 SIA_future_forward: "展望未来"
 SIA_future_forward_desc: "一个由政治新人组成的新政党承诺打破僵局。他们主张非军事化、权力下放和民主化。当权派试图使用惯用的手段，却发现目标已经改变。"
 SIA_three_demands: "三大诉求"
 SIA_three_demands_desc: "解散议会。停止恐吓民众，制定新宪法。学生们大声说出了那些以前不能说的话，泰国政治的天花板正在被打破。"
 SIA_demilitarize_politics: "军队退出政治"
 SIA_demilitarize_politics_desc: "停止滥用征兵制，削减将军们的媒体帝国和董事会席位，让军队彻底退出政治。他们不会为此感谢我们的。"
 SIA_civilian_control: "文官至上"
 SIA_civilian_control_desc: "由文职人员管理的国防部、议会审查的晋升、以及接受审计的军费预算。这在曼谷或许算得上激进。"
 SIA_amend_section_112: "修改第112条"
 SIA_amend_section_112_desc: "改革冒犯君主罪法。限制提起诉讼的人员范围，设定量刑上限，并禁止将其用于打压政治言论。这项法案被认为是泰国最危险的法案，一旦通过，可能就无法挽回。"
 SIA_decentralize: "超越曼谷"
 SIA_decentralize_desc: "每个省都选举省长，预算也无需经过首都批准。曼谷长期以来一直被视为整个国家的中心。"
 SIA_break_the_monopolies: "打破垄断"
 SIA_break_the_monopolies_desc: "酒类双寡头垄断、电信特许经营、集团交叉持股。撬开泰国经济的咽喉要道，引入公平竞争。"
 SIA_welfare_state: "泰国福利国家"
 SIA_welfare_state_desc: "从零散的补贴体系发展成为涵盖养老金、托儿服务和失业保险的真正安全网。这项计划耗资巨大，而且此后任何一届政府都不敢取消它。"
 SIA_marriage_equality: "东南亚首例"
 SIA_marriage_equality_desc: "婚姻平等正式成为法律，成为东南亚首例。这项改革举世瞩目，而且罕见地没有遭到当权者的阻挠。"
 SIA_deep_south_peace: "平定泰南三府"
 SIA_deep_south_peace_desc: "在王国境内享有自治权，过去的暴行得到公正惩处，北大年-马来人身份得到尊重。叛乱将在谈判桌上结束，而不是在检查站结束。"
 SIA_consolidated_democracy: "巩固之后的民主"
 SIA_consolidated_democracy_desc: "一部由公民撰写、士兵在营房中训练、法院只审理案件而不统治的宪法。政变的循环终于被打破，并成为不可想象之事。"
 SIA_reform_transition_costs: "税基转型"
 SIA_reform_transition_costs_desc: "改革这些机构意味着改革它们的资金来源方式。在新系统步入正轨之前，税收征管会滞后。"
 SIA_a_new_republic: "一个新共和国"
 SIA_a_new_republic_desc: "那个从未被允许提出的问题被付诸表决。无论结果如何，最终诞生的泰国都将面目全非，如果它还能继续存在下去的话。"
 SIA_lost_territories: "失去的领土"
 SIA_lost_territories_desc: "1893年、1904年、1907年、1909年。每一个泰国学童都牢记着暹罗被法国和英国瓜分的那些国耻日。銮披汶那一代曾为此出征，试图收复失地。那些地图如今仍静置于档案之中。"
 SIA_pan_thai_movement: "一统泰民族"
 SIA_pan_thai_movement_desc: "复兴维集·瓦他干的宏大叙事：泰族、老挝族、掸族，本为同一泰民族，却被殖民者的边界所割裂，正等待着在泰国旗帜下重归统一。"
 SIA_rearmament: "重整武备"
 SIA_rearmament_desc: "拥有钢铁才能实现雄心。将国防预算提升至前所未有的水平，并使国内工业进入战时动员状态。"
 SIA_modernize_the_rta: "皇家陆军现代化"
 SIA_modernize_the_rta_desc: "新型主战坦克、新型步兵战车，以职业化军人取代抽签征召兵。泰国皇家陆军正为超越政变的真正战争做好准备。"
 SIA_blue_water_navy: "两海海军"
 SIA_blue_water_navy_desc: "“差克里·纳吕贝特”号航母终于迎来了真正的舰载机联队与真正的护航编队，潜艇计划也不再是笑柄。两片海洋，两支舰队。"
 SIA_gripen_squadrons_rearm: "素万那普维和者"
 SIA_gripen_squadrons_rearm_desc: "“鹰狮”战斗机、预警机、数据链防空体系。一支为赢得区域战争第一周而打造的精干空军。"
 SIA_dti_self_reliance: "自主国防"
 SIA_dti_self_reliance_desc: "国防技术研究所正从发表研究论文走向投产组装线——泰国产步枪、泰国产装甲载具、泰国产火箭弹，任何禁运都无法阻挡我们自行制造一切。"
 SIA_thai_yai: "我们的泰雅兄弟"
 SIA_thai_yai_desc: "缅甸的掸族人所说的语言，任何一个泰国人都能听懂。他们的民兵武装世代与仰光作战。他们缺的只是一个靠山，以及一面团结于其下的旗帜。"
 SIA_mekong_destiny: "命运流经湄公河"
 SIA_mekong_destiny_desc: "沙耶武里和占巴塞，在老一辈人的记忆中尚且属于暹罗，而老挝人正是泰国人最亲近的同胞。那条将我们分隔的河流，本可以流经同一个国家。"
 SIA_preah_vihear: "圣寺应在我手"
 SIA_preah_vihear_desc: "1962年国际法院关于柏威夏寺的裁决至今仍令人耿耿于怀。马德望和暹粒在老一辈人的记忆中曾飘扬着泰国国旗。与金边之间的边界争端将不再只是管控，而是开始被加以利用。"
 SIA_lost_sultanates: "英暹条约是废纸"
 SIA_lost_sultanates_desc: "吉兰丹、登嘉楼、吉打、玻璃市——这些曾向曼谷纳贡的属邦，在未征询任何一个当地居民意见的情况下，就被签约割让给了英帝国。我们将公开谴责《英暹条约》。"
 SIA_suwannaphum: "素万那普一统"
 SIA_suwannaphum_desc: "素万那普——这片古老的黄金之地——在泰国旗下重归完整。开始将光复领土纳入王国版图的整合进程吧。"
 SIA_victory_monument: "新胜利纪念碑"
 SIA_victory_monument_desc: "叻差威提路上的方尖碑，是为纪念1940至1941年那场为收复失地而战的阵亡者所立。在此碑之后修建一座新的丰碑，让整个地区自己去领会其中的意味。"
 SIA_thailand_4_0: "泰国4.0"
 SIA_thailand_4_0_desc: "一切产业都向高附加值升级——机器人、生物技术、数字服务。第四次工业革命，由总理府统筹规划，在东部经济走廊落地验证。每一个府都将从国家战略的全面推进中获得生产力红利。"
 SIA_three_airport_rail: "三机场高铁联络线"
 SIA_three_airport_rail_desc: "廊曼、素万那普、乌塔堡，由一条高速铁路线串联贯通，全程仅需一小时。这将是泰国史上投资最大的铁路，也是东部经济走廊的交通脊梁。"
 SIA_u_tapao_aerotropolis: "乌塔堡航空城"
 SIA_u_tapao_aerotropolis_desc: "一座越战时期的海军机场，正蜕变为年吞吐量六千万人次的航空门户——配有维修机库、自由贸易区，以及一座以机场为核心而蓬勃生长起来的城市。"
 SIA_eastern_aviation_city: "东方航空城"
 SIA_eastern_aviation_city_desc: "机场跑道仅仅是个开端。空中客车公司与泰国国际航空在自贸区内投建了一座整修综合设施，一所培养机务人才的航空学院，货运枢纽则将乌塔堡打造成为超越航天门户的地区航空航天产业枢纽。高投资，高回报。"
 SIA_eec_take_off: "经济走廊之腾飞"
 SIA_eec_take_off_desc: "罗勇的电动汽车工厂、春武里的生物技术产业、北柳的航空电子设备集群——东部经济走廊不再只是一纸规划，而正在成为一个实实在在的区域。"
 SIA_hedge_the_bets: "风险对冲"
 SIA_hedge_the_bets_desc: "竹子随风而弯，却也会随即弹回。无论华盛顿或北京认为泰国承诺了什么，泰国对其承诺拥有最终解释权。"
 SIA_armed_forces_modernization: "泰国皇家武装部队"
 SIA_armed_forces_modernization_desc: "陆、海、空三军同归王室统御，乃是王国的剑与盾。1997年金融危机冻结了正在推进中的军备采购，留下一批半途而废的飞行中队和一艘没有舰载机的航母。亲手掌管武装力量，为未来数十年的发展定下航向。"
 SIA_gripen_deal: "“鹰狮”合同"
 SIA_gripen_deal_desc: "萨博公司提供的是华盛顿所不愿给予的——全套技术转让、工业补偿方案、一架“爱立眼”预警机，而且不会有关于政权更迭的任何说教。"
 SIA_gripen_ef_program: "“鹰狮”E/F型"
 SIA_gripen_ef_program_desc: "F-35将我们拒之门外，而F-16军龄比它们的飞行员还大。新一代“鹰狮”E/F型战斗机，既延续了泰国空勤人员所熟悉的作战体系，也让瑞典的生产线持续运转。"
 SIA_eyes_in_the_sky: "天空之眼"
 SIA_eyes_in_the_sky_desc: "以色列的无人系统——包括“搜索者”、“赫尔墨斯”和“统治者”系列——为泰军指挥官提供了丛林与边境地带始终难以获得的战场能力：持续不断的侦察视野。"
 SIA_chinese_steel: "中华的钢铁"
 SIA_chinese_steel_desc: "北方工业的VT-4主战坦克，价格只有西方坦克的一半，且交付时不附带最终用户限制条款。泰国陆军的美制M60坦克日渐老旧，而其装备供应来源正日益转向东方。"
 SIA_s26t_program: "S26T潜艇"
 SIA_s26t_program_desc: "三艘承诺交付的元级潜艇，最终真正能到货的也许只有一艘。一边是无法出口的德制发动机，一边是难以承担的预算——海军的潜艇之梦，正在考验所有人的耐心。"
 SIA_chakri_modernization: "旗舰西式改装"
 SIA_chakri_modernization_desc: "西方路线在旗舰上仍在延续。“差克里·纳吕贝特”号——西班牙建造、长期停泊在梭桃邑码头——正在加装美欧作战系统与传感器。这次北约标准的改装，终于使这艘王国的航母得以承担与其舰员相称的使命。"
 SIA_uxv_carrier_conversion: "西式无人机联队"
 SIA_uxv_carrier_conversion_desc: "“鹞”式战机已经是博物馆藏品了，但滑跃甲板仍在。借助从西方盟国军火商采购的无人系统，将这艘旗舰改造为可发射无人机、水面无人艇及水下潜航器的母舰。东南亚第一艘“通用无人作战平台”航母将搭载着伙伴国装备扬帆起航。"
 SIA_telecom_empire: "电信专营"
 SIA_telecom_empire_desc: "卫星、移动网络、一个媒体帝国——在由电信大亨组成的政府治下，这一切正以惊人的速度蓬勃发展。国家龙头企业与家族生意之间的界限，从未如此模糊。"
 SIA_prayuth_premiership: "将军的任期"
 SIA_prayuth_premiership_desc: "政变领袖脱下军装换上西装，将军政府头衔换为民选职衔。250名指定参议员投票选举总理，让记票都变得十分轻松。"
 SIA_senate_of_appointees: "忠诚参议院"
 SIA_senate_of_appointees_desc: "二百五十名参议员，每一位均由军政府遴选产生，每一位都对谁来执政拥有投票权。反对派可以赢得选举，但要赢得权力，则是另一回事。"
 SIA_2020_protest_response: "街头青年"
 SIA_2020_protest_response_desc: "学生们涌向纪念碑，高举三根手指，提出三项诉求。无论是驱散、对话还是拖延，每一种应对方式，都会让下一代对国家的本质有更深的认识。"
 SIA_orange_wave: "橘色浪潮"
 SIA_orange_wave_desc: "新一代政治力量在线上组织起来，依靠小额捐款自我维持，并视旧恩庇网络为需要革除而非放任的弊病。"
 SIA_digital_democracy: "数字化民主"
 SIA_digital_democracy_desc: "开放数据、线上服务、一个会回复邮件的政府。当透明政府脱离空口承诺，成为政治生活之基础，就没有什么可以轻易将之撼动。"
 SIA_creative_economy: "创新型经济"
 SIA_creative_economy_desc: "电影、美食、节庆、设计——泰国软实力正在成为一个值得政府关注、纳入国家管理的出口产业。"
 SIA_truth_and_reconciliation: "真相与和解"
 SIA_truth_and_reconciliation_desc: "禁毒战争中逝去的生命、历次镇压行动、泰南边境三府失踪的人员——一个拥有传讯权的调查委员会将为他们撰写官方记录，因为民主制度需要铭记过去。"
 SIA_the_2005_landslide: "377席大横扫"
 SIA_the_2005_landslide_desc: "泰爱泰党赢得国会500个席位中的377席，创下泰国历史上单一政党多数席位之最。旧体制恩荫网在沉默中注视着计票结果。"
 SIA_rice_pledging_scheme: "大米质押计划"
 SIA_rice_pledging_scheme_desc: "英拉政府推出的旗舰级惠农计划，以高于市场的价格从农民手中收购稻米并建立国家库存。乡村从中获利，至于国库是否受益则要看世界粮价是否配合了。"
 SIA_red_shirts_mobilized: "票箱外的街垒"
 SIA_red_shirts_mobilized_desc: "将农村票仓动员上街。遍布东北部的红衫军网络以数十万之众涌向首都，但充斥首都的民粹暴民并不会吓退将军们——它只会刺激王宫和军部，为他们送上动手的借口。坦克开进总理府的摊牌之时正在逼近。§R政变风险上升§!"
 SIA_heartland_development: "回馈运动之心脏"
 SIA_heartland_development_desc: "依善地区与北部的乡村送来了压倒性胜利，而如今他们将获得政策作为回报。新修的公路与铁路横贯呵叻高原，延伸至清迈河谷；各府行政机构将行政管理和就业机会送往运动真正的大本营，而不是那个从未投票支持运动的首都。"
 SIA_crown_property_bureau: "王室资产管理局"
 SIA_crown_property_bureau_desc: "王室资产管理局掌管着价值数千亿泰铢的王室资产，涵盖酒店、房地产及大型工业股权。要将这些收益投入到国家发展之中，需要在最高层面进行静默的协商。"
 SIA_eastern_tigers: "东方之虎"
 SIA_eastern_tigers_desc: "第二军区与装甲部队——“东方之虎”——是保皇派的筋腱，而他们的指挥官，正是下一代军部将领。"
 SIA_buddhist_nationalism: "佛教国家"
 SIA_buddhist_nationalism_desc: "军政府将僧侣视为维护社会秩序的合作伙伴。僧人参与国家典礼、学校课程中纳入佛教教育、僧伽被悄然抬升为道德权威。而泰南三府对此并不接受。"
 SIA_royal_succession_managed: "王权更迭"
 SIA_royal_succession_managed_desc: "王室与政府提前数年便着手筹备权力交接事宜——这已不再是措手不及的震荡，而是制度化的平稳过渡。当第九世王朝落幕之时，王室威望得以完整传承，而非跌落低谷；哀悼期被压缩至最短，保皇派迅速集结于新君周围。一场精心安排的过渡，其代价远低于无序更迭所付出的成本。"
 SIA_conscription_abolished: "职业军队"
 SIA_conscription_abolished_desc: "废除强制兵役。志愿兵役制下的军队规模更小，但待遇更优、训练更精，且其忠诚将归于宪法，而非征召他们的将领。"
 SIA_open_skies_open_borders: "开放边界与蓝天"
 SIA_open_skies_open_borders_desc: "开放航权，简化签证手续，让航空公司在竞争中自由发展。远道而来的游客带来财富，入境务工的人员带来技能。边境是泰国最大的资产——请别再把它当堡垒一样严防死守了。"
 SIA_chao_phraya_megaprojects: "昭披耶河防洪水电工程"
 SIA_chao_phraya_megaprojects_desc: "通过蓄洪水库、防洪屏障和一连串径流式水轮机组驯服这条曾两度淹没首都的河流。这一工程耗资巨大，但下次洪灾就不用批昂贵的救灾预算了。"
 SIA_asean_customs_window: "东盟单一窗口海关"
 SIA_asean_customs_window_desc: "统一东盟各成员国的海关申报、安全认证和植物检疫规则。从清莱到吉隆坡的卡车，现在需要停靠的窗口比过去少了。"
 SIA_the_southern_question: "南方问题"
 SIA_the_southern_question_desc: "在北大年、也拉、那拉提瓦三府，叛乱之火已在这片土地上闷烧了整整一代人。清真寺被焚、斩首事件、路边炸弹 - 这些已夺去数千条性命，也令马来穆斯林聚居的南部与佛教主导的曼谷之间的对立日益加深。泰国再也不能将泰南三府仅仅视为治安报告上的注脚，而必须做出抉择，以回应南方的烈焰。而其形式最终将由曼谷的掌权者来决定。"
 SIA_kra_gateway: "克拉地峡"
 SIA_kra_gateway_desc: "那个百年之梦重新摆上了内阁的议事桌，但这一次附带一份真正的预算表。一个可行性研究委员会已组建成立，勘测人员被派往克拉地峡，宋卡府的第一块共用建设用地也已清理完毕。一切都尚在商榷之中。接下来的问题是：要由谁——或说能由谁——为它买单。"
 SIA_kra_patron_china: "“一带一路”融资"
 SIA_kra_patron_china_desc: "北京的报价，是当前所有方案中最为经济的——提供完整的“一带一路”融资、中国工程团队，极速交付、一站式承包。眼下的条件极为优厚，但日后的负担也将极为沉重。债务以人民币计价，抵押物便是运河本身，终有一日，北京可能会要求偿还贷款。"
 SIA_kra_patron_japan: "日本基建仙人"
 SIA_kra_patron_japan_desc: "日本国际协力机构与日本大型银行联合体以缓慢、昂贵、但无可挑剔的方式推进建设——没有债务陷阱，没有隐藏的租约条款，只是前期账单更高，且这个伙伴期望得到的回报，既有泰铢，也有善意。东京对曼谷的重视程度也将随着工程推进而提升。"
 SIA_kra_patron_consortium: "国际财团"
 SIA_kra_patron_consortium_desc: "由亚洲开发银行牵头的多边财团，将成本与风险分散于众多参与方之间，并坚持工程师们始终青睐的务实步骤——先分阶段建设陆桥，再推进全通海平面运河。如此一来，没有任何一个单一债权国会掌控这条战略咽喉，华盛顿、东京和马尼拉都将因此松一口气。"
 SIA_kra_patron_solo: "自己动手"
 SIA_kra_patron_solo_desc: "不要外国债权，不要外国条款，不要外国旗帜悬挂于船闸之上。王国将凭借自身国库与本国债券市场为运河筹资，以此作为对这条全球最新战略水道拥有绝对主权的代价。"
 SIA_kra_debt_trap_warning_tt: "一带一路融资目前成本低廉，但建设超支会触发§R北京催还贷款§!的违约危机链。"
 SIA_two_oceans_one_kingdom: "两海之国"
 SIA_two_oceans_one_kingdom_desc: "最后一道围堰已被拆除。安达曼海与泰国湾的海水首次在运河最高点交汇。泰国从此不再仅濒临两海，而是号令两海。"
 SIA_kra_militarize: "两海之堡垒"
 SIA_kra_militarize_desc: "这条运河价值连城，不容疏于防卫。岸防炮台、加固海军基地，以及常设的通行管控权限，将这条水道变为一座泰国皇家海军足以抵御任何来犯者的堡垒。全世界将注意到了那些枪炮，而付费通行的船只则对军事化进程颇有微词。"
 SIA_kra_internationalize: "万国之航道"
 SIA_kra_internationalize_desc: "宣布克拉运河为中立国际通航区，以平等条款向所有船旗开放，并由条约保障其地位。泰国放弃单方面关闭运河的权力，以此换取航运流量、国际投资，以及每一个曾担忧这条战略咽喉被单一国家扼守的海上大国的默然感激。"
 SIA_gateway_of_asia: "亚洲门户"
 SIA_gateway_of_asia_desc: "过去，船只只是途经泰国；如今，它们停靠于此。以国际投资完成这一转型，在南部建设更深的港口，而若运河方案最终被选中，则赋予巡逻管控权责，以确保这条战略咽喉对所有缴纳通行费的船只均安全无虞。"
 SIA_ghosts_of_the_jungle: "丛林幽灵"
 SIA_ghosts_of_the_jungle_desc: "在依善地区的深山与北部的高原之间，泰国共产党的干部从未真正消失。他们在乡村学校里教育青年，在工会中组织力量，一直在铭记着历史。如今，国家走向撕裂，稳定已成往事，政府徘徊在自己的茧房中——而他们传递的信息，正被新一代愿意倾听的人所接收。"
 SIA_isaan_soviets: "依善苏维埃"
 SIA_isaan_soviets_desc: "东北部是这片土地的腹地——最贫穷、政治上最不安分，也是曼谷当局向来视为廉价劳动力与廉价选票来源的地区。村务委员会、工会会堂、合作社理事会——正成为一场运动的组织骨架。党不索取忠诚，它只要求人民自己去治理自己，然后静观其变。"
 SIA_general_strike: "大罢工"
 SIA_general_strike_desc: "若这场运动不甘止步于乡村一隅，就必须让整座城市停摆——码头工人、工厂工人、公交车司机、教师，全员同时罢工。这是一场孤注一掷的豪赌。只要政府无法正常运转足够长的时间，等待它的结局只有两种：要么屈服，要么升级镇压。没有中间道路可走。"
 SIA_general_strike_tt: "发起总罢工，并开启为期180天的§Y总罢工§!相关决议。\n- 将罢工势头推进至§Y100§!，政府即告屈服，开启和平夺权之路\n- 罢工每持续一周，将消耗§R1%§!稳定度\n- 若180天期满时未达到100，军方将镇压罢工，并以政变夺取政权"
 SIA_people_seize_power: "人民夺权"
 SIA_people_seize_power_desc: "旧政府已经垮台。无论它是倒在谈判桌前还是街垒面前，结局都一样。泰国共产党接管了执政权力。新的国旗尚未升起，但行政机器已落入那些在丛林中苦思数十载、琢磨如何运用它的人们手中。"
 SIA_land_to_the_tiller: "耕者有其田"
 SIA_land_to_the_tiller_desc: "中部平原的大庄园、依善地区的稻田、南方的橡胶种植园——生产这一切的旧制度已经终结。土地改革，真正的改革，而非那种下一届政府上台便戛然而止的官方计划，既是这场运动的承诺，也是其最危险的一步。那些拥有这些庄园的家族，并不会全都默默退场。"
 SIA_five_year_plan: "五年计划"
 SIA_five_year_plan_desc: "市场分配低效。国家将有计划地重新配置资源。工厂、钢铁、化工、机床——一切由中央统筹规划，由全民动员的劳动力建设而成。贸易逆差将转化为实物资本的结构性盈余。其代价，在头一年的消费品统计数据中便清晰可见——那就是孤立。"
 SIA_red_chakri_dilemma: "却克里难题"
 SIA_red_chakri_dilemma_desc: "有一个问题，党的领导层尽可能拖延了许久，如今已无法再回避——在共产主义泰国，王室的宪法地位究竟如何？历史提供了两个先例，但没有一个是令人安心的。"
 SIA_positive_trade_relations: "积极贸易关系"
 SIA_nuclear_proliferation_concern: "泰国铀浓缩计划"
 SIA_nuclear_proliferation_tt: "§R我们联盟之外的每一个国家，都将以长远的眼光审视泰国的核浓缩计划。§!"
 SIA_tt_has_reclaimed: "我们控制尚未整合的收复领土"
 SIA_tt_has_unpacified_reclaimed: "收复领土的顺从度仍低于§Y90%§!"
 SIA_tt_has_corable_reclaimed: "收复领土的顺从度高于等于§Y80%§!"
 SIA_bamboo_curtain: "竹幕"
 SIA_bamboo_curtain_desc: "泰国革命无法作为一个孤立的实验存活下去。越南和老挝是邻国，是同路人，也是潜在的伙伴。一个建立在相互承认与协调抵抗西方经济压力基础上的区域团结框架，正是东南亚一个长久革命政权赖以立足的架构。"
 SIA_protracted_peoples_war: "持久人民战争"
 SIA_protracted_peoples_war_desc: "上世纪七十年代的党并非在城市中获胜。它在山林中磨练了自己的本领——在那里，曼谷的法令鞭长莫及，一杆步枪远比一纸宣言更有分量。在高地建立根据地，让乡村包围城市。这比总罢工更为缓慢，却也远更难被逆转。"
 SIA_peoples_tribunals: "人民法院"
 SIA_peoples_tribunals_desc: "一场不能自卫的革命，撑不过一个季节。那些告密者、资助者和观望风向的校官们，都还在原地未动。革命法庭——迅速而公开——将在忠诚问题被用来拷问党之前，就先把它解决掉。"
 SIA_broad_united_front: "广泛统一战线"
 SIA_broad_united_front_desc: "一场靠恐惧统治的革命，只会年年日日把朋友变得少少的。更艰难的道路是赢得认同。将农民协会、工会、改良派知识分子、小商贩和乡村僧侣汇聚在同一座帐篷之下，让他们感到自己是在建设新国家，而非仅仅在它的统治下生存。权力在纸面上共享，在实践中严防，但一个能靠共识来治理的运动，便无需靠枪杆子来统治。"
 SIA_peoples_army: "人民军队"
 SIA_peoples_army_desc: "工厂在国家计划之下拔地而起，现在是时候锻造盾牌了。一个身处敌对区域的革命国家，需要一支庞大、忠诚且独立的军队——兵员按党的意志征召训练，装备来自泰国自身的兵工厂，而非仰仗外国的施舍。每一个扛得起步枪的壮劳力都是公民兵，每一间能车出一根枪管的车间都是供应链上的一环。邻国在妄动之前，必得三思而行。"
 SIA_socialist_education: "扫盲运动"
 SIA_socialist_education_desc: "工厂在国家计划之下拔地而起，现在是时候培养人才了。一场大规模扫盲运动将覆盖依善地区最偏远的村庄，干部学校将农民培养成工程师，将办事员培养成管理者——他们凭能力履职，而非出身。一个有文化、有组织的人民，更难被愚弄，也更容易治理；那些曾掏空旧王国的恩庇朽根将被连根拔起。"
 SIA_the_beijing_road: "通往北京之路"
 SIA_the_beijing_road_desc: "生存需要靠山，而这座靠山就在中南海。完全拥抱北京的怀抱吧——中国的资本来完成工业计划，中国的市场来取代西方关闭的那些，而一个大国的阴影，足以让所有邻国不敢轻举妄动。代价藏在小字条款之中。中国在泰国决策层中的声音，将比过去任何泰国人所能容忍的都要响亮。作为次要伙伴，终究还是伙伴；一个吃饱了的国家，总比一个骄傲而饥饿的国家活得长久。"
 SIA_indochina_federation: "印度支那联邦"
 SIA_indochina_federation_desc: "或者，拒绝做附庸，而选择做领袖。老挝、越南、柬埔寨——三场为同一理想而流血牺牲的革命，却无一拥有泰国的工业基础和枢纽地位。一个湄公河流域三国联邦，以曼谷为资深伙伴，而非北京的次要盟友——这将使东南亚成为一个列强必须与之谈判、而非肆意瓜分的存在。这是更艰难的宣言，也是更骄傲的宣言。"
 SIA_kingmaker_coalition: "造王者联盟"
 SIA_kingmaker_coalition_desc: "阿努廷·参威拉恭领导的泰自豪党在2019年议会中掌握着权力平衡。与其组建联合政府，需要让渡部委职位和政策妥协，但这也换来执政多数席位，以及通往该党在东北部农村票仓的通道。"
 SIA_cannabis_decriminalized: "大麻非刑罪化"
 SIA_cannabis_decriminalized_desc: "泰自豪党的标志性2022年政策将大麻从麻醉品名单中移除。武里南府及依善各地的农民转而种植新的经济作物。国库收入攀升。保守派声音警告道德风险。双方都有道理。"
 SIA_million_rai_farms: "百万农业投资"
 SIA_million_rai_farms_desc: "泰自豪党的农村发展计划，为全国带来精准灌溉、合同农业认证以及南方橡胶树更新种植补贴。东北部获得新兴产业，南部则迎来种植园扩张。泰国的农产品出口随之增长。"
 SIA_defence_industry_act: "国防工业法案"
 SIA_defence_industry_act_desc: "国内国防生产法律框架，采购优先考虑本地制造系统，所有外国合同均附带技术转让要求，并在部内设立国防工业秘书处。由此产生的首家军工厂规模有限，但制度基础将非同小可。"
 SIA_dti_expansion: "扩展国防研究"
 SIA_dti_expansion_desc: "国防技术研究所获得一笔资金注入，并受命研制火箭弹、巡飞弹以及升级版装甲车原型。依善地区的设施从绘图室跃升为生产线，一条新的军工线也同步投产。研究成果随着硬件一同落地。"
 SIA_chaiseri_and_friends: "柴塞里与朋友们"
 SIA_chaiseri_and_friends_desc: "柴塞里金属橡胶公司的“首胜”防雷车已销往印度尼西亚和菲律宾。在《国防工业法》的加持下，包括柴塞里、吞武里汽车和泰国光学在内的一批私营防务供应商集群正在扩张。始于国内采购的业务，逐渐变成一份出口账簿，而柴塞里自身的生产线也在收益中实现了升级。"
 SIA_arms_exporter: "东盟军火库"
 SIA_arms_exporter_desc: "泰国已建成了生产基地、法律框架和出口关系，足以成为本地区首选的二级军火供应国。不是主战坦克和战斗机，而是防雷车、炮弹引信、无人机和弹药——可靠、实惠、按时交付。可重复的出口合同，将成国库中的常项。"
 SIA_regional_defense_pact: "区域防御协定"
 SIA_regional_defense_pact_desc: "出口账簿已变成一种外交工具。曼谷与东盟伙伴正式确立了长期防务供应安排，包括有保障的采购渠道、联合维护计划以及常设的区域安全磋商框架。工厂运转更加繁忙，武官带着签署的协议回国，而泰国在东南亚的影响力，如今以弹药配额和备件合同来衡量。"
 SIA_stream_of_the_navy: "海流"
 SIA_stream_of_the_navy_desc: "泰国皇家海军陆战队在登陆作战与海岸防御方面获得军备投资。南部一座船坞的扩建，为新组建的两栖中队提供了支撑。泰国海军陆战队与印尼及菲律宾同行一道展开联训，不再使演习纯粹流于形式。"
 SIA_cavalry_of_the_sky: "空骑兵"
 SIA_cavalry_of_the_sky_desc: "陆军航空兵获得优先发展。新型通用直升机用于空中机动步兵，攻击型直升机为丘陵地带的作战提供支援，而空中突击学说则承认：泰国的地形，更多是丛林而非草原。"
 SIA_cyber_command: "网络司令部"
 SIA_cyber_command_desc: "一个以美国网络司令部和以色列8200部队为蓝本建立的专职网络作战司令部。涵盖网络防御、信号情报，以及——在预算提案中一处不起眼的附件里——进攻能力开发。既然ISOC的监控基础设施已然存在，该司令部将予以继承，并将其触角延伸至数字维度。"
 SIA_us_coin_legacy: "美式治安战理论"
 SIA_us_coin_legacy_desc: "越南战争之后的几十年间，泰国陆军从美国的治安战学说中汲取了深刻教训——村庄防御计划、心理战以及与ISOC的情报融合。这套框架至今仍塑造着泰国对付内部敌人的方式。将其系统化之后，确实产生了成效。"
 SIA_development_is_security: "发展即安全"
 SIA_development_is_security_desc: "在动荡不安的北部和东北部，修筑公路、学校和诊所，是最廉价的平叛手段。基础设施若能在鼓动者抵达之前先到达村庄，往往就能站稳脚跟。依善地区和北部的新铁路枢纽，则加快了此后每一个项目的推进速度。"
 SIA_post_cold_war_professionalization: "后冷战军官团"
 SIA_post_cold_war_professionalization_desc: "冷战塑造了泰国军官团的特质——以反共作战为核心、效忠于国内秩序、尊崇王权。然而，新一代军官在与西方伙伴的联合演习中受训，在国际法的熏陶下成长，正在重新定义泰国皇家武装力量存在的意义。"
 SIA_multi_domain_operations: "多域作战"
 SIA_multi_domain_operations_desc: "战场已不再仅仅是地图上的一条线。网络、电子战、天基侦察与精确无人机打击，正与传统机动战术融为一体。泰国与美澳伙伴联合制定的多域作战概念明确指出，下一场战争将在所有领域同时展开。"
 SIA_mdo_integration_strain: "整合阵痛"
 SIA_mdo_integration_strain_desc: "建立从网络到太空影像的跨域指挥架构，在理论尚未开始产生回报之前，就需要先行投入大量资金。"
 SIA_ministry_of_defence: "国防部"
 SIA_ministry_of_defence_desc: "王国的防务历来由各军种各自为政——各自守护自己的预算、自己的条令、自己的地盘。如今，我们终于为它注入了一副体制性的脊梁：一个凌驾于陆、海、空三军之上的国防部，将国土防御、国家安全政策与情报整合为一部单一的国家机器，直接对国家负责。"
 SIA_comprehensive_security: "总体安全"
 SIA_comprehensive_security_desc: "内政、国防与情报部门几十年来注视着同一道边界，却各自保管着三套文件，从无共享的习惯。一套统一的条令将他们绑定在一起，并同时开辟三条战线——经济、国内防线与武装力量。"
 SIA_protector_of_the_realm_focus: "王国守护者"
 SIA_protector_of_the_realm_focus_desc: "随着胜利纪念碑的落成，掸族、老挝、高棉和马来人的土地已归于泰国旗帜之下。赢得这些领土与治理它们是两回事。一个专司收复边疆的行政机构在驻军之后建立起来，安抚、开发并最终将其内化的进程就此展开。"
 SIA_atoms_for_peace: "和平利用原子能"
 SIA_atoms_for_peace_desc: "泰国签署了国际原子能机构的和平利用议定书，并开始了漫长的制度准备过程。核安全监管机构、乏燃料协议，以及首座国内研究堆相继落地。这一民用核计划建立在这样的信念之上：利用铀作为基荷电力，比以地缘政治价格进口的石油更便宜、更清洁，也更能体现国家主权。"
 SIA_smr_initiative: "小型反应堆倡议"
 SIA_smr_initiative_desc: "小型模块化反应堆是一项使无力承担全尺寸核电站资本支出的国家也能实现核电可行性的技术。该计划资助可行性研究、东海岸的选址评估，以及与韩国或法国财团的技术转让协议。第一铲混凝土的浇筑还要等十年。但决策就在今天。"
 SIA_nuclear_power_program: "核能计划"
 SIA_nuclear_power_program_desc: "国家核能计划将成为核能开发的集大成者，包含明确的并网日期、自主的燃料循环框架，以及首座并网反应堆。泰国将成为东南亚首个将民用反应堆投入电网的国家，加入日本、韩国、中国、印度、巴基斯坦和台湾的行列，成为该地区的核能运营者之一。能源独立不再只是理论上的设想。"
 SIA_bangkok_phnom_penh_axis: "曼谷-金边轴心"
 SIA_bangkok_phnom_penh_axis_desc: "柬埔寨的地理位置使其成为泰国通往海洋的天然经济走廊，而其政治走向又使其成为曼谷在对抗越南时的天然外交制衡力量。这一国策通过贸易使团、公路连接以及共享安全框架来加深双边关系，使金边与曼谷保持紧密联系，并进一步远离北京的势力范围。"
 SIA_jakarta_dialogue: "对话雅加达"
 SIA_jakarta_dialogue_desc: "印尼是东南亚的人口大国，也是泰国在吉隆坡之外最重要的双边关系。雅加达对话是平台，汇聚双边部长、联合军事演习，并就谁主导东盟下一个十年进行坦诚对话。结果取决于曼谷是将雅加达视为伙伴还是对手。"
 SIA_asean_crossroads: "东盟的十字路口"
 SIA_asean_crossroads_desc: "王国面前有两条道路。其一是盟好，一个以泰国为主导、通过共识凝聚东盟的秩序。其二是统治，以刀剑将东南亚置于泰国控制之下。"
 SIA_the_2001_election_choice_tt: "在2001年竞选中支持一方力量。选举将决定由谁来执政，而只有获胜者的路线将开放。\n- £SIA_neutral_Social §Y泰爱泰党§!\n- £SIA_Nat_Autocracy §Y王室网络及其将军们§!\n- £SIA_western_conservative §Y现任民主党§!"
 SIA_the_2006_coup_choice_tt: "选择军政府的特质。\n- §Y强硬派§!：中止选举、重修宪法，代价是稳定度与西方舆论的恶化\n- §Y温和派§!：保留民主选举，付出较小的代价"
 SIA_a_new_republic_choice_tt: "决定君主制的命运。\n- §Y废除§!：经受动荡\n- §Y退让§!：保留王冠以获得稳定度和政治点数"
 SIA_the_southern_question_choice_tt: "选择一项针对泰南三府的治安学说。"
 SIA_red_chakri_dilemma_choice_tt: "选择革命者对王权的回答。\n- §Y废除君主制§!：面临保皇派叛乱\n- §Y保留宪政象征§!：效仿老挝模式，消化强硬派的怒火"
 SIA_lost_territories_choice_tt: "选择领土主张的公开程度。\n- §Y公开的领土收复主义§!：以声望为代价换取战争支持\n- §Y低调可否认的修正主义§!：保护稳定"
 SIA_nuclear_power_program_choice_tt: "选择核浓缩路线。\n- §Y无视检查员§!：在制裁下进行武器级浓缩\n- §Y接受国际原子能机构监察§!：修复与华盛顿的关系"
 SIA_prayuth_premiership_choice_tt: "选择将军如何规划其继任事宜。\n- §Y有序过渡§!：巩固现有体制\n- §Y解决方案制度化§!：文官再次回到前台"
 SIA_2020_protest_response_choice_tt: "选择对示威的回应。\n- §Y镇压§!：消耗稳定度并增加政变风险\n- §Y同意改革§!：平息局势，并推动改革运动\n- §Y静观其变§!"
 SIA_found_the_pact: "建立东南亚条约组织"
 SIA_found_the_pact_desc: "言语化为制度。泰国恢复了外部势力在1977年放弃的那个名称，并赋予它一个区域性的主人——东南亚条约组织，一项以曼谷为核心、以邻国为成员的多边防务协定。泰国承担创始领导者的角色。旗帜升起。盟约落实。"
 SIA_invite_mainland: "邀请大陆伙伴"
 SIA_invite_mainland_desc: "越南、老挝、柬埔寨和缅甸都与泰国接壤，并面临着共同的威胁。曼谷向这些大陆国家发出正式邀请，提出一个观点：大陆腹地的安全取决于共同的立场，而非相互竞争的风险对冲。"
 SIA_invite_mainland_tt: "邀请我们的大陆邻国加入东南亚条约组织。\n- 每个国家自行决定是否接受\n- 接受的国家将获得一个保持其致力于该条约的精神"
 SIA_invite_maritime: "邀请海上伙伴"
 SIA_invite_maritime_desc: "印度尼西亚、菲律宾、马来西亚、新加坡和文莱控制着泰国赖以贸易的海域。这些海上伙伴受邀加入该协定，将群岛与半岛联结为一个统一的战略共同体。"
 SIA_invite_maritime_tt: "邀请东南亚的海洋国家加入东南亚条约组织。\n- 每个国家自行决定是否接受\n- 接受的国家将获得一个保持其致力于该条约的精神"
 SIA_invite_breakaways: "邀请边疆小国"
 SIA_invite_breakaways_desc: "南掸邦、克伦邦和佤邦控制着泰国与缅甸腹地之间的地带，而它们中任何一个都无法独自生存。曼谷向它们提供了内比都永远不会给予的东西：一个席位、一份条约签署，以及作为一个国家而非叛乱组织的地位。"
 SIA_invite_breakaways_tt: "邀请缅甸分离的各邦加入东南亚条约组织。\n- 每个国家自行决定是否接受\n- 接受的国家将获得一个保持其致力于该条约的精神"
 SIA_seato_invite_line_tt: "- §Y[THIS.GetNameDefCap]§!受邀加入东南亚条约组织"
 SIA_seato_accession_category: "东南亚条约组织邀约"
 SIA_seato_accession_category_desc: "第一个东南亚条约组织于1954年在马尼拉签署，总部设在曼谷，但其八个成员国中仅有两個属于东南亚国家，且该组织于1977年在从未被引用过的情况下解散。如今这个组织才是第一个从未真正成为的“区域性条约”：泰国占据主席席位，邻国为成员，其保障指向东南亚自身的防务，而非任何其他国家的遏制战略。席位须逐一填补。\n\n在邀请各国加入阵营之前，先审视每个国家的接受程度。"
 SIA_renew_seato_invitation: "重新发出邀请"
 SIA_renew_seato_invitation_desc: "将代表团连同条约文本和新的提议一起送回[FROM.GetNameDefCap]。拒绝并非永久性的，条款并未改变。"
 SIA_seato_charm_offensive_major: "取悦[FROM.GetNameDefCap]"
 SIA_seato_charm_offensive_major_desc: "国事访问、信贷额度、军官奖学金，以及在对方贸易博览会上设立泰国展馆——外交部在此后三个月里，不做别的事。这些都不是条约本身，但每一件事都让下一次我们提出签署条约时，变得更容易一些。"
 SIA_seato_charm_offensive_minor: "取悦[FROM.GetNameDefCap]"
 SIA_seato_charm_offensive_minor_desc: "国事访问、信贷额度、军官奖学金，以及在对方贸易博览会上设立泰国展馆——外交部在此后三个月里，不做别的事。这些都不是条约本身，但每一件事都让下一次我们提出签署条约时，变得更容易一些。"
 SIA_courting_mission: "拉拢邻国"
 SIA_courting_mission_desc: "高级外交人员、部长日程安排以及大部分可自由支配的预算都将集中投入一个目标，直至任务结束。政府中的其他一切事务都得排队等候。"
 SIA_seato_rec_opinion_yes: "§G对泰国的态度高于40§!（+25）"
 SIA_seato_rec_opinion_no: "§R对泰国的态度低于40§!（+25）"
 SIA_seato_rec_faction_yes: "§G不在其他阵营中§!（+20）"
 SIA_seato_rec_faction_no: "§R已加入其他阵营§!（+20）"
 SIA_seato_rec_influence_yes: "§G泰国是在该国影响力最大三国之一，持有20%或以上§!（+20）"
 SIA_seato_rec_influence_no: "§R泰国并非该国影响力最大三国之一，未持有20%或以上§!（+20）"
 SIA_seato_rec_threat_yes: "§G处于战争状态，或其邻国处于战争状态§!（+15）"
 SIA_seato_rec_threat_no: "§R该国及其任何邻国均未处于战争状态§!（+15）"
 SIA_seato_rec_trade_yes: "§G与泰国达成贸易协定§!（+10）"
 SIA_seato_rec_trade_no: "§R与泰国没有贸易协定§!（+10）"
 SIA_seato_rec_momentum_yes: "§G东南亚条约组织已有三个或更多成员国§!（+10）"
 SIA_seato_rec_momentum_no: "§R东南亚条约组织成员国不足三个§!（+10）"
 SIA_seato_rec_total: "§Y东南亚条约组织接纳度§!：§Y[?SIA_seato_temp|0]§!/100。他们在§Y60§!时接受邀请。"
 SIA_joint_command: "东盟联合指挥部"
 SIA_joint_command_desc: "曼谷建立了常设联合指挥架构，整合各成员国的条令、后勤与情报。泰国军官占据高级职位，但参谋人员真正实现了多国协作。演习变得互通互操作，计划则落地成为现实。"
 SIA_asean_rapid_reaction: "东盟快速反应部队"
 SIA_asean_rapid_reaction_desc: "组织迈出下一步，组建一支常备快速反应旅，由所有成员国抽调兵力组成，能够在72小时内部署到东南亚任何地点。这是条约之剑，精干有力，且实实在在。"
 SIA_arsenal_integration: "东盟军备整合"
 SIA_arsenal_integration_desc: "泰国的国防工业，已是东南亚的兵工厂，将武器和弹药标准化，装备到每个成员国的武装部队。泰国制造的步枪、车辆和炮弹取代了苏联、中国和西方装备的杂烩。该条约组织的军队现在使用同一种子弹。"
 SIA_pax_aseana: "东盟治世"
 SIA_pax_aseana_desc: "工作已经完成，条约也已稳固。泰国建立了外部势力无法做到的成就——一个植根于本地区、足以震慑任何挑战者的真正安全架构。邻国之所以签署，是因为他们真心愿意，而这正是它能够持久的原因。"
 SIA_war_economy_push: "推行战时经济"
 SIA_war_economy_push_desc: "国家已转入战时动员状态。生产消费品的工厂正被改造，转而制造炮弹和枪管。军费开支上限已被取消，采购合同不再经历惯常的拖延，三座新的兵工厂正在曼谷都市区匆匆清理出的空地上拔地而起。"
 SIA_friends_abroad: "海外之友"
 SIA_friends_abroad_desc: "泰国武装部队数十年来一直与外国伙伴进行联合训练。通过联合演习、军官交流和武器转让建立的双边联系，是泰国安全体系中一根默默支撑的支柱，虽然不如联盟那样引人注目，但却比大多数联盟更加持久。现在是时候将这些行之有效的机制正式化了。"
 SIA_cobra_gold_focus: "金色眼镜蛇"
 SIA_cobra_gold_focus_desc: "“金色眼镜蛇”演习是亚洲规模最大的年度联合军事演习，由泰国和美国共同主办。深化演习计划，使泰国皇家陆军能够熟悉美国的军事理论、后勤训练和装备，并巩固曼谷作为华盛顿在东南亚大陆地区核心合作伙伴的地位。"
 SIA_partner_japan: "日本防卫关系"
 SIA_partner_japan_desc: "日本的国防装备出口改革为泰国采购开辟了新的渠道。东京能够提供精密制造技术、两用电子产品和基础设施融资，这些都与泰国的能力形成互补，而且不像中国或美国的方案那样附带政治条件。"
 SIA_partner_korea: "韩国防务伙伴关系"
 SIA_partner_korea_desc: "韩国仅用一代人的时间就建立起了极具竞争力的军工产业。K-2坦克、FA-50战斗机和K9榴弹炮以极具竞争力的价格销往东南亚各地的合作伙伴。泰国也加入了这一行列，并引进了韩国标准的空军训练和工业技术。"
 SIA_partner_australia: "五眼邻居"
 SIA_partner_australia_desc: "澳大利亚是泰国最亲密的英语国家伙伴，也是美国的非北约盟友。两国在安达曼海和泰国湾举行的联合演习加深了海军间的联系。扩大伙伴关系能够带来两国军队的互操作性和海上监视合作，而这些合作是任何一方单独都无法承担的。"
 SIA_partner_taiwan: "静默防御合作"
 SIA_partner_taiwan_desc: "台湾的国防工业行事低调，技术精湛，且出于政治动机寻求盟友。曼谷不承认台北，但泰国皇家陆军和中华民国军队长期以来一直保持着非正式的装备和训练交流渠道。悄悄地将这种合作正式化是一项经过深思熟虑的冒险之举。北京会注意到这一点。"
 SIA_hedging_partners: "远东的朋友们"
 SIA_hedging_partners_desc: "东京、首尔和北京都能为曼谷提供华盛顿无法提供的东西：耐心资本、两用技术以及庞大的邻近市场。它们都不要求独家合作。泰国同时与这三者保持密切联系，并维持自身价值，拒绝成为任何一方的锚点或客户。对于一个已经致力于对冲风险的王国而言，这些关系可谓双赢。"
 SIA_national_grid: "为王国提供动力"
 SIA_national_grid_desc: "泰国快速的工业化进程已经超越了其电网的承载能力。东部沿海地区工厂林立，但电网老化严重，输电损耗令人尴尬，未来十年的增长需要一个能够承载更大负荷的基础架构。政府承诺进行全国基础设施升级，包括新建变电站、升级输电线路，并在电网最终能够供电的地区新建工厂。"
 SIA_renewable_push: "可再生能源驱动"
 SIA_renewable_push_desc: "泰国拥有丰富的可再生能源资源，包括来自海湾的风能、遍布中部平原的太阳能以及北部的小型水力发电。然而，这些资源长期以来一直未得到充分利用。该项目旨在泰国各地建设大型可再生能源设施，并将其电力直接并入国家电网。"
 SIA_green_grid: "绿色电网"
 SIA_green_grid_desc: "可再生能源装机容量是一回事，能够利用这些容量的电网又是另一回事。储能、智能调度和现代化输电将沙特阿拉伯王国的太阳能发电场和风力发电场连接成可靠的电力供应网络，而每块新的太阳能电池板或风力涡轮机都能更快地接入这个经过加固的电网主干。沙特阿拉伯王国的能源独立由此开始。"
 SIA_fossil_fuels_deal: "海湾能源合作伙伴"
 SIA_fossil_fuels_deal_desc: "沙特阿拉伯的炼油厂依赖海湾原油，其发电厂则燃烧进口天然气。曼谷方面并没有试图摆脱这种依赖，而是将其正式化。与沙特阿拉伯、卡塔尔和阿联酋签订的长期供应协议，不仅带来了价格稳定，通过现代化电厂改造提升了燃油效率，还带来了一笔可观的财政收入，以及随之而来的友好外交关系。"
 SIA_gulf_energy_ties: "战略燃料储备"
 SIA_gulf_energy_ties_desc: "一艘从未出海的油轮，就像一座从未启动的发电站。两座战略燃料储存设施分别在南部工业走廊和东部沿海地区拔地而起。海湾合作伙伴出资一半，其余部分由泰国工程师建造。"
 SIA_iron_fist_doctrine: "铁拳理论"
 SIA_iron_fist_doctrine_desc: "不再有任何抱怨之言。这三个省份已被军队、检查站和紧急权力所淹没。叛乱是安全问题，必须以迅速、强硬且毫不妥协的方式予以解决。世界将会谴责。南方将会保持平静。"
 SIA_martial_law_south: "南方戒严"
 SIA_martial_law_south_desc: "紧急法令将北大年府、也拉府和那拉提瓦府置于军管之下。宵禁、无证搜查和未经指控的拘留成为南部地区民众日常生活的常态。军队如今可以随时根据情报采取行动，而民众也开始体会到窝藏持枪者的代价。"
 SIA_search_and_destroy: "搜索并歼灭"
 SIA_search_and_destroy_desc: "特种部队和航空兵对疑似犯罪团伙网络进行扫荡。行动果断有力，伤亡惨重。每一次击中目标的突袭都能进一步削弱叛乱势力，而每一次误伤婚礼的突袭则反而为他们输送了一代新兵。"
 SIA_pacification_complete: "完成治安任务"
 SIA_pacification_complete_desc: "路边炸弹袭击停止了，检查站也已撤除。清真寺受到监视，学校受到监控，沉默之下的不满并未消散。枪声停止了，但余烬犹存。"
 SIA_royal_development_projects: "皇家发展项目"
 SIA_royal_development_projects_desc: "在国王的倡议下，王室的发展模式被引入南部，包括灌溉、农业、道路建设以及王室资助的合作社。其传递的信息是：为马来穆斯林南部地区谋福祉的是君主制，而非叛乱势力。这不仅仅是巡逻，更是王室的庇护和存在。"
 SIA_isoc_southern_command: "内部安全行动南方司令部"
 SIA_isoc_southern_command_desc: "内部安全行动司令部对南部战区实行统一指挥，将军民协调、情报融合和软实力运作全部纳入同一机构。如果内部安全行动司令部网络已经成熟，南部战区司令部就能从被动应对转变为主动出击。"
 SIA_winning_hearts_royally: "赢得人心，皇家风范"
 SIA_winning_hearts_royally_desc: "奖学金、清真寺修缮、清真认证开发区，以及刻意提拔当地马来穆斯林名流进入庇护体系。国家并非以占领者的身份出现，而是以恩人的身份出现，在某些地方，年轻人的算计也逐渐发生了转变。"
 SIA_southern_calm: "南方的平静"
 SIA_southern_calm_desc: "暴力冲突已逐渐消退，取而代之的是一种受控的、受监控的平静。虽然没有条约，也没有自治权，但各省依然运转，王室的庇护依然有效。这种平静靠的是王室的存在和庇护来维持。"
 SIA_peace_dialogue_initiative: "和平对话倡议"
 SIA_peace_dialogue_initiative_desc: "曼谷正式启动吉隆坡谈判，马来西亚担任斡旋方。这是泰国政府首次与它一直以来追捕的对象坐下来谈判，并承认南方的未来应通过谈判解决，而不仅仅是武力。这在国内耗费了政治资本，但却开辟了一条枪林弹雨永远无法企及的道路。"
 SIA_mara_patani_talks: "北大年人民诚信委员会谈判"
 SIA_mara_patani_talks_desc: "与北大年人民诚信委员会联盟的正式谈判正式启动。建立信任措施、安全区和真正的停火框架都被提上议程。吉隆坡方面积极介入，而内部虽有分歧但依然存在的叛乱领导层也开始相信达成和解是可能的。"
 SIA_autonomy_framework: "特殊自治框架"
 SIA_autonomy_framework_desc: "谈判代表为这三个省份起草了一部特别行政法，其中包括选举产生的区域委员会、地方语言教育、宗教法庭，以及南部地区保留一部分发展收入。这是泰国历史上影响范围最广的让步，曼谷的当权派已经开始动员起来反对它。"
 SIA_pattani_peace_accord: "北大年和平协议"
 SIA_pattani_peace_accord_desc: "一份签署的协议结束了泰国现代史上持续时间最长的叛乱。南部地区在统一的泰国境内获得了一定程度的自治权，武装人员交出了武器，流离失所者返回家园。这份协议并不完美，仍存在争议，但却具有历史意义。冲突结束了。"
 SIA_ds_tier_to_1: "§G泰南三府趋于平静，局势缓和（一级，稳定度-2%）。§!"
 SIA_ds_tier_to_2: "§Y北大年暴力事件不断升级（T2,-4%稳定度，-5%政治点数）§!"
 SIA_ds_tier_to_3: "§R南方燃起战火（T3，-7%稳定度，-10%政治点数，-5%战争支持度）§!"
 SIA_ds_intensity_down: "§G叛乱强度下降[?ds_delta]点§!"
 SIA_ds_intensity_up: "§R叛乱强度上升[?ds_delta]点§!"
 SIA_ds_grievance_up: "§R强硬手段会加剧社区的不满情绪增加[?ds_grievance_delta]。冲突的底线也会随之升高，单靠武力已无法平息冲突。§!"
 SIA_ds_grievance_down: "§G真诚的让步可以缓解社区的不满（[?ds_grievance_delta]）。暴力事件的强度底线下降，真正的解决之道指日可待。§!"
 SIA_iron_fist_doctrine_tt: "向这三个省份大量部署军队。\n - 叛乱强度§G-10§!\n - 政变危险§R+10§!\n - 显著加深社区不满，将冲突的底线提升到了一个前所未有的高度。"
 SIA_martial_law_south_tt: "对北大年府、也拉府、那拉提瓦府发布紧急法令。强度-8，加剧不满，马来西亚/印度尼西亚关系值-。"
 SIA_search_and_destroy_tt: "强力扫荡。强度-12，加剧不满。南方局势强度需低于50方可启动。存在暴行适得其反的风险。"
 SIA_pacification_complete_tt: "枪声停止了，但余烬犹存。"
 SIA_royal_development_projects_tt: "南方皇家倡议项目。强度 -6，缓解不满，稳定度 +2%，国库 -3。"
 SIA_isoc_southern_command_tt: "内部安全行动接管南方指挥部。强度-7（如果内部安全行动网络处于激活状态，则强度提升更快），但监视网引发了一些不满。"
 SIA_winning_hearts_royally_tt: "庇护与发展。强度-7，大幅缓解不满，稳定度 +3%。需要南方地区强度低于40才能启动。"
 SIA_southern_calm_tt: "在皇室庇护下，平静得以维持。"
 SIA_peace_dialogue_initiative_tt: "开启吉隆坡通道。强度-5，缓解不满，政治点数 -75，开启谈判。"
 SIA_mara_patani_talks_tt: "与北大年人民诚信委员会举行正式会谈。强度 -8，大幅缓解不满情绪，马来西亚关系值+，需要45%的稳定度。"
 SIA_autonomy_framework_tt: "起草特殊区域法。既得利益集团会反对。\n - 叛乱强度§G-7§!\n - 这是所有选项中对社区不满情绪影响最大的。\n - 要求南部叛乱强度低于§Y35§!才能开始"
 SIA_pattani_peace_accord_tt: "签署协议，走上自治之路。冲突结束。"
 SIA_anti_narcotics_bureau: "禁毒局"
 SIA_anti_narcotics_bureau_desc: "泰国禁毒委员会规模扩大，权力增强，拥有专项预算、受保护的调查权以及正式的职责，专门打击贩毒网络而非街头毒贩。该委员会的目标是整个毒品供应链，从掸邦的制毒窝点到曼谷的分销中心，无一幸免。"
 SIA_golden_triangle_interdiction: "金三角禁区"
 SIA_golden_triangle_interdiction_desc: "泰国、缅甸和老挝三国交界地区是大量海洛因和冰毒的源头，这些毒品涌入泰国城市并流入世界市场。边境巡逻队已加强，空中监视范围扩大，一支与掸邦民兵合作的联合特遣部队也已成立，旨在拦截越过湄公河的毒品运输。毒枭们会像往常一样调整策略，但这无疑增加了他们的成本。"
 SIA_golden_triangle_interdiction_tt: "切断湄公河沿岸的贩运路线，加强王国对北部的控制。"
 SIA_anti_graft_push: "反贪污运动"
 SIA_anti_graft_push_desc: "国家反腐败委员会获得了更大的权力，扩大了调查权限，设立了专项预算，并为举报人提供了法律保护。国防、建筑和海关这三个最容易滋生贪腐的领域，采购违规行为成为首要打击目标。建立廉洁的合同体系比巩固旧制度要缓慢得多。强行推行廉洁合同会耗费政治资本，并会令习惯于旧模式的公众感到不安。"
 SIA_transparency_watchdog: "透明度监督机构"
 SIA_transparency_watchdog_desc: "一个独立的财政透明办公室成立，直接向议会而非财政部报告。高级公务员必须披露资产，公共采购实行实时报告，并设立了公民审计门户网站，这些措施堵住了长期以来系统性寻租行为得以持续存在的漏洞。腐败并未消失，但维持腐败的成本显著增加，而那些被揭露的腐败网络会在六个月内通过程序和拖延进行反击。"
 SIA_watchdog_backlash: "旧体制的反击"
 SIA_watchdog_backlash_desc: "新的透明化制度所揭露出的关系网络并未就此消失。在长达六个月的时间里，它们通过程序性手段、拖延战术和静默阻挠来对抗改革，不断侵蚀着政治权力——而在那些与之纠葛最深的省份，公众信心也在随之流失。"
 SIA_decentralize_governance: "赋权地方"
 SIA_decentralize_governance_desc: "在反腐败行动之后，治理权与预算分配从曼谷下放至各府。省级行政组织获得更大的职权，民选府尹掌控地方基础设施支出，清迈、孔敬和宋卡正崛起为真正的次级经济中心。增长的集中速度虽有所放缓，但这条更为平静、稳健的道路，确保了国家的稳定。"
 SIA_bangkok_primacy: "曼谷优先"
 SIA_bangkok_primacy_desc: "反腐败的红利被重新投入首都。曼谷的工业区得到升级，研究机构更加集中，公共交通基础设施得以扩展。效率与研究产出大幅攀升，但批评者指出，繁荣正在这座千万人口的城市中聚集，而各府仍在等待，由此滋生的不满情绪正在切实拖累整个国家的士气。"
 SIA_asean_hegemony: "东盟霸权"
 SIA_asean_hegemony_desc: "大泰国计划在大陆已完成。如今王国将目光投向东南亚其余地区。东盟在精神上始终是泰国主导，我们要让它在事实上也成为如此，如有必要，则诉诸武力。总参谋部正在起草针对群岛和城邦的征服计划。"
 SIA_maritime_claims: "海上边疆"
 SIA_maritime_claims_desc: "越过地峡，便是伟大的群岛国家，马尼拉、雅加达，以及石油资源丰富的文莱苏丹国。向蓝水推进将需要泰国皇家海军和海军陆战队的全力投入。海军部开始规划跨越南海及爪哇航线的两栖作战行动。"
 SIA_maritime_claims_threat: "群岛海军建设"
 SIA_maritime_claims_bonus: "两栖作战学说"
 SIA_claim_philippines: "征服菲律宾"
 SIA_claim_philippines_desc: "菲律宾群岛扼守南海东侧的门户。将马尼拉纳入曼谷的治下，既可保障海上侧翼，又能为新秩序获得一亿菲律宾人的劳动力。我们将向菲律宾的每个岛屿都提出主权要求。"
 SIA_claim_indonesia: "征服印度尼西亚"
 SIA_claim_indonesia_desc: "印度尼西亚是南方的巨人，幅员辽阔，人口众多，资源丰富。要掌控东盟，曼谷必须先掌控雅加达。这场战役将是漫长的，岛屿众多，但回报是东南亚最大的经济体和人口。"
 SIA_claim_brunei: "夺取文莱"
 SIA_claim_brunei_desc: "文莱虽小，却坐拥该地区最丰富的油气资源之一。苏丹国的财富及其在婆罗洲的战略位置，使其成为难以抗拒的猎物。我们行动，将苏丹国并入王国。"
 SIA_mainland_claims: "平定大陆"
 SIA_mainland_claims_desc: "大陆上的两股势力尚未屈服。安南山脉另一侧的宿敌越南，以及扼守马六甲海峡的富裕城邦新加坡，都必须被降服，方能成就泰国在东南亚的霸权。"
 SIA_mainland_claims_threat: "泰国动员对抗大陆残余势力"
 SIA_mainland_claims_bonus: "边境战争学说"
 SIA_claim_vietnam: "征服越南"
 SIA_claim_vietnam_desc: "越南长期以来一直与泰国争夺中南半岛，从古代暹罗的宫廷到二十世纪的杀戮战场。如今，这场历史性的对抗将一决胜负。我们将对湄公河到安南山脉海岸提出领土主张。"
 SIA_claim_singapore: "夺取新加坡"
 SIA_claim_singapore_desc: "新加坡是海峡上的明珠，金融强国，也是全球最繁忙航运通道的守门人。谁掌握狮城，谁就扼住了亚洲商业的咽喉。我们将使之归于泰国之手。"
 SIA_asean_protector: "东盟监护者"
 SIA_asean_protector_tt: "合作之路向任何政府敞开，§Y大泰的各个附庸§!也不例外。"
 SIA_asean_protector_desc: "大泰王国无需成为征服的帝国。在稳固大陆之后，王国可以转而成为东南亚安全的保障者，一个仁慈的霸主，保护邻国而非吞并它们。曼谷将其保护延伸至整个地区，通过联盟而非占领，将东盟与泰国王室紧密相连。"
 SIA_guarantee_maritime: "群岛之盾"
 SIA_guarantee_maritime_desc: "泰国向海上国家菲律宾、印度尼西亚和文莱提供正式安全保障。皇家泰国海军将为其独立提供担保，作为回报，曼谷成为南部海域不可或缺的力量。"
 SIA_guarantee_mainland: "大陆守护者"
 SIA_guarantee_mainland_desc: "曼谷保障越南、新加坡和马来西亚的安全，以泰国主导的和解决议终结了数百年的对抗。昔日的敌人、富庶的城邦以及半岛邻国，皆栖身于王国的庇护之下，大陆在泰国主导的和平中归于安定。"
 SIA_guarantee_indochina: "印度支那的保护伞"
 SIA_guarantee_indochina_desc: "霸权国家通常会忽略泰国最贫困、最脆弱的邻国。但曼谷却依然保障它们的利益：老挝、柬埔寨、缅甸，以及缅甸边境的那些小邦。唯有惠及弱者的保护，才能真正证明泰国王国言出必行。"
 SIA_protector_of_asean_focus: "一个东盟，一个盾牌"
 SIA_protector_of_asean_focus_desc: "一份签署的保护伞协议足以改变该地区的政治格局。无论曼谷最初向哪一方提供保障，泰国都扮演着东南亚保护者的角色，而由泰国主导的安全架构也开始取代以往的恐惧平衡。该地区的防御体系正变得不可分割，而曼谷则掌握着关键地位。"
 SIA_professional_officer_corps_focus: "专业军官团"
 SIA_professional_officer_corps_focus_desc: "改革派最终胜出。他们主张以能力晋升，建立真正的参谋学院人才输送渠道，并构建以理论而非裙带关系为基础的指挥文化。随着军队逐渐以军旅生涯而非政治为荣，政变的恶习也将逐渐消退。"
 SIA_martial_prestige_focus: "剑的荣耀"
 SIA_martial_prestige_focus_desc: "传统主义者占据上风。军队被奉为国家灵魂，阅兵场如同圣殿般神圣。士气高昂，尚武精神高涨，但对军装的盲目崇拜使将领们牢牢把持着权力中心。"
 SIA_jointness_reform: "联合改革"
 SIA_jointness_reform_desc: "联合指挥部队将三军整合为一个作战单位。通过整合参谋机构、共享作战理论和统一指挥链，原本平行的指挥结构演变为一支能够进行多域作战的协同作战力量。"
 SIA_defense_export_office: "国防出口办公室"
 SIA_defense_export_office_desc: "一个专门机构，通过促成合同、安排融资，将泰国制造的系统推向世界市场，并将国防工业基地转变为收入来源而不是预算负担。"
 SIA_self_reliant_defense_base: "自力更生防御圈"
 SIA_self_reliant_defense_base_desc: "新建的兵工厂与深化的供应链，使王国摆脱了对外国供应商的依赖。泰国如今能够凭借自己的工厂、自己的设计、自己的节奏，为自己及其客户提供武器装备。"
 SIA_total_defense_doctrine: "全面防御学说"
 SIA_total_defense_doctrine_desc: "国防成为一项全民事业——扩大征兵范围、开展常态化的民防演习、夯实本土防线。王国所准备的，不仅仅是一支军队，而是一个随时准备抵抗的社会。"
 SIA_doctrine_professional_tt: "将§Y职业军队§!精神提升至下一等级，并使王国致力于职业化道路。"
 SIA_doctrine_prestige_tt: "为§Y军事荣耀§!而战，并将王国推向威望之路——以稳定度为代价，换取高战争支持度与指挥点数。"
 SIA_national_rnd_network: "建设科技园区"
 SIA_national_rnd_network_desc: "巴吞他尼府的公共实验室、大学合作伙伴关系以及一座专业科技园，为泰国构建了属于自己的科研根基。国家科学技术发展局统筹着一个研发设施网络，以此加快技术转化，推动整体经济向更高价值的产业迈进。"
 SIA_civilian_rnd_center: "民用研发中心"
 SIA_civilian_rnd_center_desc: "一座专门的民用研究与原型设备开发设施，配备实验室、测试台以及一支可自由探索王国未来所需一切领域的工程师团队。这是继王国最初仅有的一座海军船坞之后，设立的第四个研究中心，也为自主开发项目提供了充足空间。"
 SIA_air_rnd_center: "航空研发中心"
 SIA_air_rnd_center_desc: "一座航空电子与航空工程设施，配备风洞、仪表化试飞场及配套的工程师团队。泰国工业由此获得了在本土进行飞机系统原型开发的试验平台，而无需从国外购买成品。"
 SIA_army_rnd_center: "陆战研发中心"
 SIA_army_rnd_center_desc: "一座地面武器系统试验场，配备装甲测试跑道、武器靶场及一个设计局。陆军得以自主开发和原型制造自己的车辆与装备，而无需等待外国供应商及其附带条件。"
 SIA_gistda_space_agency: "强化GISTDA"
 SIA_gistda_space_agency_desc: "地理信息与空间技术发展局（GISTDA）终于获得了一项真正的使命与一笔实实在在的预算。这个原本为解读卫星数据而成立的机构，如今已成为王国的航天机构——运营地面站、培养工程师，并为泰国科研提供俯瞰万物的一扇窗。小型太空计划不再是外国的奢侈品，而成为国家的能力。"
 SIA_theos_earth_observation: "“泰遥”地球观测卫星"
 SIA_theos_earth_observation_desc: "泰国第一颗地球观测卫星“泰遥”（THEOS），为王国开启了轨道上的“眼睛”——测绘国土、追踪洪灾与作物、并向情报部门提供任何邻国都无法否认的影像数据。后续计划将深化该局在光学、下行链路与图像处理方面的专业能力，将原始过境数据转化为可用的侦察情报。"
 SIA_space_krenovation_park: "太空科创园"
 SIA_space_krenovation_park_desc: "一座航空航天产业园区在东部海滨拔地而起，配备洁净室、装配大厅以及卫星组件和小型运载火箭的供应链。最初只是一个研究机构的存在，如今已成为国内航空航天工业的支柱，吸引私营企业入驻，并为泰国工程业提供了一个名副其实的高价值产业领域。"
 SIA_sovereign_launch_capability: "主权航天能力"
 SIA_sovereign_launch_capability_desc: "王国决心补齐最后一块短板——即自主设计、建造和发射卫星的能力，无需征得任何人的许可。一项本土发射与卫星星座计划，为二十年的努力加冕，使泰国跻身少数拥有自主太空立足点、且情报触角不受制于任何外国的国家行列。"
 SIA_ptt_energy_champion: "国家石油，能源冠军"
 SIA_ptt_energy_champion_desc: "国有能源企业被推向证券交易所，化身为商业巨头。凭借首次公开募股所得资金以及从泰国湾至缅甸的勘探授权，国家石油公司既保障了王国的燃料供应，也跃升为国内最大的单一企业。"
 SIA_scg_industrial_titan: "暹罗水泥集团"
 SIA_scg_industrial_titan_desc: "王国历史最悠久、规模最大的工业集团，从水泥业务拓展至石化、建材和包装领域。暹罗水泥集团的订单簿支撑着建设热潮，并锚定了一条任何基础设施项目都不可或缺的国内供应链——随着该集团越发仰赖许可审批体系，其税收贡献也随之增长。"
 SIA_packaging_empire: "包装箱帝国"
 SIA_packaging_empire_desc: "暹罗水泥集团的包装业务部门在证券交易所上市，随后在整个区域内展开收购——从印度尼西亚到越南，一路整合多家造纸厂，直至其印刷与成型产品覆盖半个东南亚。其卖点是循环经济：再生纤维、轻量化塑料、低碳排放。而代价，则落在了那些被其收购或被其低价挤压的小型印刷厂和纸箱制造商身上。"
 SIA_cp_agribusiness_giant: "正大集团"
 SIA_cp_agribusiness_giant_desc: "从饲料加工厂到7-Eleven便利店，正大集团已成为泰国的农业综合企业与零售巨头。合同农业提升了农村收入、充实了货架，而正大的出口实力则将泰国食品销往亚洲每一个市场。商品化农业的生产力在整个合同农业网络中稳步攀升，依善稻米带又新增了一个产区。"
 SIA_buffer_states: "缓冲屏障"
 SIA_buffer_states_desc: "泰国不会吞并掸族和克伦族，而是让他们继续生存并保持武装——以此作为一道友好的缓冲屏障，在缅甸的压力触及王国之前先行将其吸收。跨境补给线、训练营地与静默的保证，将边境叛乱武装转化为一面盾牌。"
 SIA_protectorate_doctrine: "庇护理论"
 SIA_protectorate_doctrine_desc: "总参谋部最终选择了较为温和的帝国统治工具——不是征服，而是藩属。边境各小邦将被纳入泰国的保护之下，成为附庸国，它们的旗帜仍可在各自都城上空飘扬，但实权归于曼谷。"
 SIA_annexation_doctrine: "吞并理论"
 SIA_annexation_doctrine_desc: "绝不折中。边疆地带将被直接夺取，其领土并入王国版图，分离主义政府予以解散。曼谷对掸族和克伦族的核心腹地提出领土要求，并准备以军队强制执行。"
 SIA_subdue_the_shan: "征服掸邦"
 SIA_subdue_the_shan_desc: "泰国皇家陆军向南掸邦推进。最终是成为保护国还是行省，取决于所选方针，但无论如何，曼谷的号令将直达萨尔温江。"
 SIA_subdue_the_karen: "镇压克伦"
 SIA_subdue_the_karen_desc: "泰军越过克伦山。数十年的庇护与暗中扶持就此终结，王国如今以征服者之姿降临，或扶植傀儡，或直接吞并，一切皆随政策所指。"
 SIA_burma_breakaway_question: "分离主义政权"
 SIA_burma_breakaway_question_desc: "萨尔温江对岸，缅甸的统治已瓦解为一片武装割据的碎片——掸邦、克伦邦、佤邦。它们虚弱、分裂，且正好处于泰国的掌控范围之内。曼谷必须决定，这些脱离的领土对王国而言究竟是什么——是盾牌，是战利品，还是需要处理的麻烦。"
 SIA_subdue_the_wa: "征服佤邦"
 SIA_subdue_the_wa_desc: "佤邦联合军是各支割据武装中实力最强、也最深陷毒品泥潭的一支。要平定佤山地区，必将是一场硬仗，但这能切断王国门前的一条毒品通道，并将泰国国旗深深插进缅甸边境地带。"
 SIA_rta_looks_abroad: "六十年之M48"
 SIA_rta_looks_abroad_desc: "泰国皇家陆军仍在装备着上个世纪的坦克与装甲车。换装的问题已不再是“是否要换”，而是“换上谁家产品驶入呵叻大门”，以及“附带怎样的条件”。凡是有产能的地方，新的生产线都已拔地而起。"
 SIA_stryker_brigades: "西方战车之车轮"
 SIA_stryker_brigades_desc: "斯特赖克旅、美式作战条令，以及一条与全球最强大军队直接对接的后勤链。这套装备确实出色，互操作性价值无可估量——但每一发炮弹都以美元结算，并以对华盛顿的某种顺从为代价。"
 SIA_eda_blackhawks: "超级大国的旧物箱"
 SIA_eda_blackhawks_desc: "通过“超额防务物资”和“对外军售”渠道，经翻新的“黑鹰”与“眼镜蛇”直升机以远低于标价的价格抵港。这些机身虽是二手货，但以有限预算换取空中机动能力，是一笔唯有同盟关系才可能达成的划算交易。"
 SIA_vn1_mechanization: "装甲到连"
 SIA_vn1_mechanization_desc: "VN1与VN16型装甲车成百地从中国生产线驶出，其总价仅相当于几辆西方车辆的成本。步兵终于有了运载工具，而制造它们的工厂，在年底之前就已收回成本。"
 SIA_norinco_fires: "北方工业的货架"
 SIA_norinco_fires_desc: "SH1自行榴弹炮、SR5火箭炮——整套目录按打包价出售。火力确实强劲，但零备件排队和战场上的传动系统故障也同样真实。廉价装备，足以让军需官夜不能寐。"
 SIA_tavor_standard: "我们自己的武装"
 SIA_tavor_standard_desc: "获得许可的“塔沃尔”步枪本土化生产，将泰国工厂变为陆军制式步枪的供应来源。没有禁运，没有等待名单，没有外国对我们向谁提供武器的否决权——这仅仅是建立一个唯曼谷马首是瞻的军火库的第一块基石。"
 SIA_oplot_and_rotors: "巴扎外交"
 SIA_oplot_and_rotors_desc: "乌克兰的“堡垒”坦克车体、俄罗斯的米-17旋翼——市场向一个不选边站的买家提供的一切，应有尽有。作战能力从四面八方同时汇聚而来，而以一种可控的尺度，同时惹恼华盛顿和北京。"
 SIA_dti_black_widow: "黑寡妇蜘蛛"
 SIA_dti_black_widow_desc: "国防技术研究所自主研发的8×8轮式装甲车，以及柴塞里公司经过实战检验的“首胜”防雷车——泰国设计、泰国制造，且性能足以吸引他国购买。这座军火库已经开始为自己挣回成本。"
 SIA_first_army_modernized: "皇家陆军焕新"
 SIA_first_army_modernized_desc: "无论换装之路如何曲折，最终成果终于呈现在阅兵场上。一支现代化的泰国皇家陆军，经过重新装备、重新训练，已准备好迎接它真正需要战斗的世纪。"
 SIA_gripen_globaleye: "天空全视眼"
 SIA_gripen_globaleye_desc: "萨博的“全球眼”预警机将少量“鹰狮”战机转变为一张网络化作战力量，能够先敌发现、先敌打击。机载雷达是倍增器，使一支小型空军能够发挥远超其数量的战斗力。"
 SIA_j10_squadrons: "廊曼之上的飞龙"
 SIA_j10_squadrons_desc: "歼-10CE多用途战斗机，以中队为单位交付，价格令华盛顿永远无法匹敌，也令华盛顿永远无法谅解。选择成都而非沃斯堡，不仅重塑了王国的天空，也重塑了它的联盟版图。"
 SIA_hq9_air_defense: "导弹穹顶"
 SIA_hq9_air_defense_desc: "HQ-9和FK-3远程地空导弹在中部平原上空撑起保护伞。廉价、密集且一体化。这就是中国式的区域拒止。"
 SIA_wing_loong_uav: "耐心的猎手"
 SIA_wing_loong_uav_desc: "翼龙与CH系列无人机可滞空一整天，待命后按指令出击。以一支有人驾驶中队的成本，换来大规模无人侦察与精确打击能力。"
 SIA_f5th_super_tigris: "老虎新活"
 SIA_f5th_super_tigris_desc: "以色列的航空电子设备、有源相控阵雷达以及“蟒蛇-5”空空导弹，将久经考验的F-5战斗机升级为F-5TH“超级虎”。这并非一款全新战机，而是从已然付清成本的老旧机身上榨取出的战斗力——不欠任何超级大国的人情。"
 SIA_dti_uav_command: "主权之眼"
 SIA_dti_uav_command_desc: "国防技术研究所设计的无人机编队，完全在国内设计并完成试飞，为泰国提供了自主的侦察视图，同时也为邻国提供了可购买的产品。"
 SIA_air_dominance_doctrine: "天空之主"
 SIA_air_dominance_doctrine_desc: "无论装备何物，泰国皇家空军最终成为一支现代化、网络化、多用途的力量，主宰着它誓死捍卫的领空。"
 SIA_korean_frigates: "普密蓬标准"
 SIA_korean_frigates_desc: "西方舰队技术路线。一艘韩国制造的现代化DW3000型护卫舰，配备西方作战系统、区域防空能力，以及这支舰队有史以来最强大的水面作战力量。品质自有其价格，首尔开出的价码是美元。"
 SIA_chinese_engine_compromise: "中国产核心"
 SIA_chinese_engine_compromise_desc: "德国的发动机永远不会来了，这艘船已经等了十年。接受中国的CHD620动力装置，潜艇终于能出海了——便宜、自主，只是磨合期里工程师们得花上一年时间骂骂咧咧。"
 SIA_type071_flotilla: "沪东船厂出品"
 SIA_type071_flotilla_desc: "一艘071E型船坞登陆舰和一批中国制造的巡逻舰，以一艘西方舰艇的价格，便让舰队在一夜之间拥有了一支两栖作战力量。"
 SIA_krabi_class_opv: "自造龙骨"
 SIA_krabi_class_opv_desc: "舰队自主之选。曼谷船坞建造的甲米级近海巡逻舰，为自主造船业奠定基石。虽成长缓慢，却不受制于任何外国船厂。"
 SIA_european_propulsion: "泰体西用"
 SIA_european_propulsion_desc: "这是一笔购买，而非合伙。一次性购入MTU柴油发动机和作战系统的生产许可，然后将其拆解至每一个螺栓，其余部分在国内自行建造。引进的技术知识，被吸收到一个独立自主的计划之中——不亏欠任何庇护者。"
 SIA_naval_self_reliance: "曼谷造护卫舰"
 SIA_naval_self_reliance_desc: "泰国船厂如今正铺设自主设计的战舰龙骨，一个集海军防务工业基础于一体、兼具生产能力与出口能力的体系已然成形。泰国舰队，终于是在本土建造的了。"
 SIA_command_of_the_seas: "两个海湾，一支舰队"
 SIA_command_of_the_seas_desc: "无论其建造历程如何，泰国皇家海军已成长为一支真正的蓝水海军，既能掌控暹罗湾，又能深入安达曼海，统御着冲刷王国两翼海岸的海域。"
 SIA_the_western_anchor: "华盛顿的前哨"
 SIA_the_western_anchor_desc: "陆、海、空三军装备均采自西方，同盟关系成为国防的基石。以互操作性、情报共享以及美国隐含的安全保证为交换，将自身牢固地置于华盛顿的轨道之内。"
 SIA_the_bamboo_bloc: "寻求龙之荫庇"
 SIA_the_bamboo_bloc_desc: "三军装备均来自北京，使泰国成为中国在地区内最大的武器客户。廉价的规模、共享的C4ISR体系，以及一个强大的庇护者——代价则是西方信任的流失。"
 SIA_strategic_autonomy: "独立自主"
 SIA_strategic_autonomy_desc: "一支日益在本土建造、并对外出口的武装力量。国防技术研究所正成为地区性的军火供应商，而王国不再依赖外国资本来维系自身的防务手段。"
 SIA_the_bamboo_doctrine: "见风使舵"
 SIA_the_bamboo_doctrine_desc: "瑞典的“鹰狮”战斗机、中国的坦克、北京的潜艇、韩国的护卫舰——泰国从各方采购，却不属于任何一方。在风暴中弯曲的芦苇才能幸存。这是泰国最古老的生存智慧，如今在军力编成中化为现实。"
 SIA_dual_use_threshold: "核能临界点"
 SIA_dual_use_threshold_desc: "每一个民用核能计划，都包含武器计划所需的同一套工艺。在能源自主的掩护下，悄然掌握核燃料循环——以铀浓缩为名，王国保持所有选项开放，而无需公开宣示任何一项。"
 SIA_minimum_deterrent: "最低限度威慑"
 SIA_minimum_deterrent_desc: "寥寥数枚弹头，仅此而已，但足以让任何邻国和任何大国再也不能将王国视作等闲。泰国以自己的方式加入核俱乐部，而内阁现在必须公开表明其核武器的用途。"
 SIA_the_democrats_endure: "民主党屹立"
 SIA_the_democrats_endure_desc: "民主党——王国历史最悠久的政党——继续紧握执政权，未向民粹浪潮退让。没有压倒性胜利，没有魅力超凡的亿万富翁，只是以广泛的平民联合政府形式，从事着耐心而平淡的治国事务。该党将自己的未来押注于制度之上，而非某一位领袖。"
 SIA_chuan_clean_government: "廉洁政府"
 SIA_chuan_clean_government_desc: "清廉先生掌舵。个人廉洁的声誉成为党的品牌，公开预算、专业化部门，以及对“红包黑金”的战争。这不会光鲜亮丽，但会打造出一套体制，将诚实治理转化为持久的选民基础。"
 SIA_rule_of_law: "依法治国"
 SIA_rule_of_law_desc: "一个以宪法为生命、誓死捍卫其精神的政府。正当程序、可预期的行政体系，以及向法律而非军营负责的法院。每一次政变都始于突破规则，因此王国学会了珍视规则。"
 SIA_judicial_independence: "独立司法"
 SIA_judicial_independence_desc: "将司法体系从王室网络与将军们的掌控中隔离出来。一个无法被施压的法官席，是阻止“解散—政变”循环最可靠的制动器，同时也能从根源上钝化旧体制最惯用的武器——操纵司法。"
 SIA_strengthen_parliament: "强化议会"
 SIA_strengthen_parliament_desc: "为民选议会配备人员、委员会和足以真正执政的权威。一个运转有效的立法机构，让政党通过选票而非紧急法令来治理国家，也让公众在每一届会议的成果中拥有切身的利益。"
 SIA_liberal_market_stewardship: "自由市场管理"
 SIA_liberal_market_stewardship_desc: "健全的货币、开放的贸易，以及一个重在监管而非支出的政府。民主党为“他信经济学”提供了技术官僚式的制衡，其增长动力来自金融、出口和私营企业，而非向农村发放现金补助。"
 SIA_southern_stronghold: "南方堡垒"
 SIA_southern_stronghold_desc: "党的核心票仓是南方，而南方积怨已久。以道路、学校和诊所而非检查站来回应这些诉求；以国库实资而非纸上承诺来兑现。以发展换取和平，既能稳固票仓的忠诚，也能削弱叛乱的兵源。"
 SIA_coalition_government: "联合政府"
 SIA_coalition_government_desc: "权力以艰难的方式拼凑而成——通过合作伙伴、区域集团和小党派的组合，缝合出一个可行的多数联盟。它缓慢而充满妥协，但这是坦克最难找到理由去碾压的政府形式。民选秩序依靠分享权力而存活。"
 SIA_mature_democracy: "成熟的民主"
 SIA_mature_democracy_desc: "王国跨过门槛，进入和平交接时期，拥有忠诚的反对派，公众可以将政变视为历史。制度比任何单一运动都更重要：更清廉的行政和持久的权威，是以比更广泛的联盟所能带来的更缓慢的民调攀升为代价换来的。"
 SIA_grand_coalition: "大联盟"
 SIA_grand_coalition_desc: "与其对抗旧秩序，不如将其吸收。民主党成为保守派旧体制选出的门面，赢得地主和商界的支持，而宫廷、官僚机构与董事会则通过选票箱而非兵营来治理。稳定以共识换取，代价却是喂养党昔日所反对的裙带关系网络。"
 SIA_coalition_overhead: "联盟开销"
 SIA_coalition_overhead_desc: "带进大帐篷的每个伙伴都想要分一杯羹。维持联盟所耗费的政治资本，比独自执政时多得多。"
 SIA_democrat_revival: "民主党归来"
 SIA_democrat_revival_desc: "从反对派的荒野中，党在2019年后的联合政府交易中挣扎着重新夺回总理之位。民主党再次执政——更年长、更谦抑，而这一次，他们决心要让文官秩序真正扎下根来。"
 SIA_answer_thaksinomics: "回应他信经济学"
 SIA_answer_thaksinomics_desc: "他信的天才之处在于集结乡村力量，因为曼谷从未这么做。不要嘲笑乡村基金。要建立一个更好的。在泰爱泰党之前启动一个民主党派的农村信贷计划、农民债务延期偿付和廉价医疗方案，这样能从根源上削弱民粹主义的吸引力，而不是放弃农村地区，仅通过法院夺回权力。\n\n§G民粹浪潮退却。§!"
 SIA_pracha_wiwat: "人民的议程"
 SIA_pracha_wiwat_desc: "“幸福社会”计划——九项惠民措施，作为新年礼物集中公布。最贫困家庭免费用电、燃气补贴、摩托车出租车司机和街头摊贩的福利与登记制度，以及为体制外劳动者提供的储蓄选择。这证明了一个自由保守派政党也能回应民生需求，而无需让国库破产。\n\n§G民粹浪潮退却。§!"
 SIA_contest_every_election: "选战绝不缺席"
 SIA_contest_every_election_desc: "无论遭遇何种挑衅——无论是被操纵的提前大选、对逃犯的特赦，还是偏袒的法庭裁决——党都坚守在民主博弈的框架之内。它参加每一次选举，接受每一次结果。这是党在2006年和2014年所放弃的纪律，而它也由此剥去了民粹派唯一真正站得住脚的指控——即民主党只有在军人和法官替他们赢的时候才会赢。\n\n§G民粹浪潮退却§!，街头政治的大门从此永久关闭。"
 SIA_the_street_over_the_ballot: "街头胜过选票"
 SIA_the_street_over_the_ballot_desc: "党受够了在投票箱前一次次落败，索性辞去所有席位，将运动推向街头。抗议活动瘫痪首都，使国家陷入瘫痪，直至民选政府倒台。这招奏效了，首都一片混乱。将军们接过了递到手中的借口，坦克开动，而一个曾代表清廉文官统治的政党，就此被铭记为政变的助产士。\n\n§R王国转入军事统治。民主党路线在此终结，而新秩序自有其根基。§!"
 SIA_break_into_isan: "打入东北"
 SIA_break_into_isan_desc: "结构性缺陷，党从未修补。整整一代人，民主党人坐拥南部和曼谷，却将广袤而贫困的东北部默认让给了他信。不如在那里投入十年时间。建立支部，推举候选人，以伊桑自身的方式提出可信的再分配方案。即便是在民粹主义的心脏地带赢得一个立足点，这股浪潮也将失去其源头。这是通往持久权力最艰难的道路，也是唯一不依赖法院的道路。\n\n§G从此，民粹浪潮的攀升将更加缓慢。§!"
 SIA_board_of_investment: "赋权投促委"
 SIA_board_of_investment_desc: "投资促进委员会一直是泰国的无声引擎，吸引外资并引导泰国企业走向海外。赋予它实权和实打实的预算。投资将变得更便宜、更快捷，曼谷投往海外的每一泰铢都将以更强的姿态回流。"
 SIA_regional_trade_network: "区域贸易网络"
 SIA_regional_trade_network_desc: "将零散的双边协议编织成覆盖东盟及更广区域的真正自由贸易协定网络。泰国现在签署的每一项协议，都将为国库带来关税红利，并扩大泰国海外软实力的影响力。"
 SIA_mekong_soft_power: "湄公软实力"
 SIA_mekong_soft_power_desc: "曼谷坐落于湄公河之源头，河流蜿蜒流经老挝、柬埔寨与缅甸。贸易、援助与投资成为对周边地区实施低调领导力的工具。如今，泰国可在海外发挥其优势，而非仅仅守护自身。"
 SIA_regional_trade_network_tt: "每份签署的贸易协定现在都按月为国库贡献收益，并扩大泰国的对外影响力辐射范围，两者均有上限。"
 SIA_trade_dividend_tt: "泰国每月从其贸易协定网络中获得收益。"
 SIA_trade_diplomacy_network: "贸易外交"
 SIA_trade_diplomacy_network_tt: "外国影响力增长随着已签署贸易协定数量的增加而扩大，直至达到上限。"
 SIA_crisis_modifier: "1997危机的遗产"
 SIA_crisis_modifier_desc: "冬阴功危机在一夜之间击碎了经济奇迹——泰铢自由落体式贬值，银行被坏账埋没，国际货币基金组织已到了门口。复苏的每一步都在弥合部分伤痕。王国从过去汲取教训，以比从前更坚韧的姿态浴火重生。"
 SIA_economy_modifier: "泰国经济"
 SIA_economy_modifier_desc: "从出口基地、东部经济走廊，到国家龙头企业与数字化转型——王国各项经济计划的运行账目，贯穿始终。每一项改革、每一轮繁荣，都在这里留下印记。"
 SIA_military_modifier: "泰国皇家武装部队"
 SIA_military_modifier_desc: "王国陆、海、空三军将士的现状：装备采购、作战条令、训练体系及其背后的国防工业。各项现代化计划在此累积汇聚。"
 SIA_politics_modifier: "泰国治理体制"
 SIA_politics_modifier_desc: "泰国治理体制的制度骨架：法院、议会、官僚机构，以及维系王国政治凝聚力的各项制度安排。改革与反弹，皆在此留下印记。"
 SIA_armed_forces_state: "老近卫军"
 SIA_armed_forces_state_desc: "每几百名士兵就配一名将军，而真实编制数对议会保密。晋升靠的是年度调任名单、军校期数和部队派系，然后才轮到军功。军官团拥有一个电视频道、高尔夫球场、土地和福利计划——而这些福利由士兵充当无薪劳力来维持。战备与训练为这一切买单，而军饷账单只增不减。"
 SIA_clean_the_banks: "清理银行"
 SIA_clean_the_banks_desc: "五十六家停业的金融公司通过金融部门重组管理局进行清算，泰国资产管理公司则将不良贷款从账面上剥离。银行资产负债表恢复干净后重新放贷，起重机也再次出现在天际线上。"
 SIA_dual_track_recovery: "重振内需"
 SIA_dual_track_recovery_desc: "债务清偿后，将复苏重心转向国内。廉价信贷、农村消费计划及对小企业的扶持，让资金流向消费最快的群体手中。经济增长迅速回暖且势头强劲，但账单与人情债也随之迅速累积。"
 SIA_sufficiency_path: "重建经济韧性"
 SIA_sufficiency_path_desc: "选择稳健而非速度。多元化的农业、适度的借贷和自给自足的地方经济，重建一个更为宁静的根基，足以抵御下一轮冲击。繁荣从未呼啸而至，但整治也延伸至治理层面。"
 SIA_frontier_integration: "整合边疆"
 SIA_frontier_integration_desc: "军事战役已经获胜，泰国士兵已控制掸邦高原、克伦丘陵和佤邦高地。赢得土地与治理土地是不同的任务。我们为收复边疆建立行政机构，铺设第一批公路与驻军据点，并开始将征服的人口转化为公民的缓慢工作。收复领土如今可以安抚、开发，并最终正式纳入王国版图。"
 SIA_the_new_order: "南方新秩序"
 SIA_the_new_order_desc: "从马尼拉到马六甲海峡，我们的领土主张延至四方——凡我军所至之处，旧旗已落。宣示霸权不等于握有霸权。我们建立帝国的行政机器——总督、驻军和重建办公室——以使所夺省份得以治理，而非仅仅被占领。收复领土如今可以安抚、开发，并永久融入大泰国。"
 SIA_industrial_estates: "工业园区"
 SIA_industrial_estates_desc: "阿玛塔、赫马拉和罗贾纳三家私营工业园区开发商，在东部沿海地区兴建工业园，并直接向日本和西方工厂招商。泰国成为承接出口繁荣的工厂车间——任何制造商抵达，都有现成的土地和电力等待使用。"
 SIA_hard_disk_of_the_world: "世界硬盘"
 SIA_hard_disk_of_the_world_desc: "希捷、西部数据以及德尔塔和哈纳等本土供应商，将泰国打造为全球最大的硬盘组装基地和顶尖电子出口国。它是旅游明信片背后沉默的巨人，悄然向全球输送着四分之一的硬盘。"
 SIA_thai_union_seafood: "罐头之王"
 SIA_thai_union_seafood_desc: "泰国联合冷冻食品公司收购了“海中鸡”品牌，成为全球最大的金枪鱼罐头生产商，而沙没沙空府的加工厂将泰国海域的渔获和廉价劳动力转化为一个全球海产品帝国。冷冻虾和鱼罐头源源不断地运往世界各地的超市货架，沙没沙空的渔港也获得了一个与其新的重要地位相匹配的海军基地。"
 SIA_retail_kings: "零售之王"
 SIA_retail_kings_desc: "郑氏家族的中央集团、“Big C”超市及各大型购物中心，以商场和现代零售业为中心重建了国内经济。中央世界购物中心于2006年开业，日益壮大的中产消费者开始花钱消费，而不仅仅是出口创汇。"
 SIA_beverage_empire: "曼谷酿酒厂"
 SIA_beverage_empire_desc: "乍仑·西里瓦达那帕坤旗下的泰国酿酒公司，即昌啤酒和盛颂的制造商，已发展成为区域性的饮料与地产巨头。由于佛教界反对酒精的抗议活动阻断了其在曼谷上市之路，该公司转而选择在新加坡筹集资本，并将所得资金回流国内。企业税收的意外之财确实可观，但由此引发的禁酒反弹也同样真实存在。"
 SIA_fta_decade: "自贸十年"
 SIA_fta_decade_desc: "一波双边贸易协定将出口引擎接入区域市场。2005年与澳大利亚的协定、2007年与日本的伙伴关系，以及与中国在农产品上的早期收获协议——皆清除了关税壁垒。这确实是跨政府协同工作的成果，由在其他方面几无共识的对手们共同签署。"
 SIA_sugar_and_ethanol: "糖业大亨"
 SIA_sugar_and_ethanol_desc: "两仪糖业集团和泰国融瑞集团将甘蔗种植带扩展为亚洲的糖业中心，将蔗糖和木薯转化为出口产品，并用于乙醇汽油计划中的燃料乙醇。农业终于不再局限于稻米，而生物燃料直接汇入国家燃料供应体系。"
 SIA_gems_and_gold: "宝石与黄金"
 SIA_gems_and_gold_desc: "尖竹汶府的切割工匠与曼谷的珠宝贸易，使泰国成为全球彩色宝石切割与出口之都。这是一个独特的、高利润、小规模的产业，依靠技艺而非规模赚取硬通货——每一颗离开国境的宝石，都在出口账本上增添一笔。"
 SIA_map_ta_phut: "玛塔普"
 SIA_map_ta_phut_desc: "泰国国家石油有限公司和暹罗水泥集团在罗勇府不断扩张其下游石化的产业版图，玛塔普工业区的烟囱群成为东部经济走廊跳动不息的重工业心脏。产业欣欣向荣，即便工厂周边的社区正为污染的空气和水源付出代价，而为该工业集群提供服务的港口也在不断扩容以跟上发展步伐。"
 SIA_ignite_thailand: "泰国IGNITE"
 SIA_ignite_thailand_desc: "政府通过了二十年国家战略和“IGNITE”枢纽愿景，终于将中等收入陷阱明确定为敌人。泰国已经富裕到足以停滞不前。工资水平已经超越了廉价工厂阶段，却始终未能触及创新前沿，而越南正迅速追赶。"
 SIA_digital_kingdom: "数字王国"
 SIA_digital_kingdom_desc: "泰国将自己定位为东盟的数字枢纽，超大规模云服务商开始注意到这一点。光纤网络、云政策以及年轻的在线人口，使我国成为该地区数据流量的有力候选者。"
 SIA_data_center_hub: "云端突击"
 SIA_data_center_hub_desc: "亚马逊、谷歌、微软和TikTok向春武里和罗勇的数据中心投入数十亿美元。服务器到位速度超过供电和供水速度，电网在负荷下开始不堪重负。"
 SIA_virtual_banks: "PromptPay与虚拟银行"
 SIA_virtual_banks_desc: "PromptPay系统使泰国几乎进入无现金社会，拥有九千万注册用户，每日处理数千万笔转账交易。中央银行向纯数字银行颁发牌照，曾经消失在现金中的资金，如今留下了一条税务局可追踪的痕迹。"
 SIA_bcg_economy: "生物-再生-绿色"
 SIA_bcg_economy_desc: "生物再生绿色模式将泰国的生物多样性和农业基础转化为高价值生物产业。生物燃料、生物化学品和功能性食品开始取代那些使农村地区陷入贫困的低利润经济作物。"
 SIA_future_food: "世界厨房2.0"
 SIA_future_food_desc: "正大食品和食品巨头们正沿着价值链向上攀升，进入功能性食品和替代蛋白领域。泰国不再出售初级热量，转而开始销售投入其中的科学。"
 SIA_durian_road: "榴莲之路"
 SIA_durian_road_desc: "榴莲及热带水果对华出口额每年突破六十亿美元。冷链货车载着收成穿过老挝一路北上，而越南和马来西亚则在广州争夺同一片货架。"
 SIA_capital_of_capital: "资本之都"
 SIA_capital_of_capital_desc: "泰国证券交易所不断深化，“哇育帕”基金持续壮大，海湾能源等企业集团正从能源领域转向数字与金融领域。曼谷开始像一个区域性金融中心那样运作，而不再仅是资本过境的地方。"
 SIA_make_thailand_investor: "对外投资"
 SIA_make_thailand_investor_desc: "泰国已从吸收外资转变为向海外输出本国资本。中央集团在欧洲收购，正大集团在全球各地布局农场，泰国酿酒公司拥有新加坡的饮品巨头。这个昔日的受援国，如今已成为投资国。"
 SIA_escape_the_trap: "高收入国度"
 SIA_escape_the_trap_desc: "国家战略成效显著，泰国跨越门槛，步入高收入国家行列。曾束缚其发展长达一代人的陷阱终于成为过去，昔日的工场如今已蜕变为富裕的王国。"
 SIA_fta_decade_tt: "为贸易外交网络提供支撑，并签署十年期各项自由贸易协定。"
 SIA_escape_trap_two_sectors_tt: "需要三个行业巅峰中的两个：数据中心、未来食品，或对外投资。"
 SIA_data_center_grid_strain_tt: "超大规模建设给电网带来了压力。投资电力部门，确保灯火长明。"
 SIA_sufficiency_and_the_crown: "王冠与富足"
 SIA_sufficiency_and_the_crown_desc: "普密蓬国王的“自足经济”哲学，诞生于冬阴功危机的废墟之中，如今成为一项国家指导原则。在盲目增长之前，先强调适度、免疫力和理性。王室与计划部统一发声，而一个量入为出的村庄，在下一轮冲击来临时，对国家的需求也会更少。"
 SIA_sufficiency_gov_gate_tt: "§Y[Communist-State_L]§!或§Y[socialism_L]§!并非执政党。"
 SIA_new_theory_agriculture: "新理论"
 SIA_new_theory_agriculture_desc: "国王的新理论将农户的土地划分为稻田、果园、池塘和宅基地，形成一个自给自足的完整产业，先养家后供市场。依善的稻米带逐区推行这一模式，以出口降低换取农民在歉收之年不致挨饿的保障。"
 SIA_doi_tung_highlands: "黎敦模式"
 SIA_doi_tung_highlands_desc: "在清莱府的山丘之上，王太后计划将罂粟从地里拔除，代之以咖啡、澳洲坚果和手工艺品。金三角昔日的经济作物，正让位于一种吸引游客而非缉毒人员的山地经济，逐谷逐村地推进。"
 SIA_chaipattana_water: "王家增氧机"
 SIA_chaipattana_water_desc: "国王亲自设计的增氧机——一种任何乡村池塘都负担得起的廉价桨轮——沿着湄南河流域推广开来，用于净化被藻类和废物堵塞的水体。这是作为王室服务的一种发明，而依善和南方的稻田也因此排水更顺畅了一些。"
 SIA_crown_property_portfolio: "王室资产管理局"
 SIA_crown_property_portfolio_desc: "王室资产管理局的持有资产——从暹罗商业银行大厦下的土地到暹罗水泥集团的股份——使王室成为王国最大的地主和股东之一。它像企业集团一样管理，也像企业集团一样纳税，其盈利悄无声息地超过了它所从属的半数部委。"
 SIA_deepen_sufficiency: "自力更生之国"
 SIA_deepen_sufficiency_desc: "自给自足不再只是农村安全网，而是成为一整套战略。本地供应链、适度消费以及对外国资本的警惕，已固化为信条。这种自给自足换来了抗冲击能力，但银行家和企业集团看着增长目标下滑，并不满意。"
 SIA_pragmatic_balance: "中间路线"
 SIA_pragmatic_balance_desc: "自给自足未必意味着孤立。中小企业持续对外交易，而自给原则仅抑制过度行为，这是一种温和的综合，而非退缩。上限低于完全自给自足，但需要它的风险也同样降低。"
 SIA_resilient_kingdom: "坚韧顽强之国"
 SIA_resilient_kingdom_desc: "王冠与乡野、宫殿与稻田，交织成一幅坚韧的图景。无论下一场危机带来什么——无论是货币传染、疫情还是供应冲击，量入为出的王国，才能在危机过后依然屹立。"
 SIA_sufficiency_resilience: "自足经济"
 SIA_sufficiency_resilience_desc: "在王室倡议下，适度理念、经济免疫力与地区韧性，已播撒于整个农村经济的土壤中。"
 SIA_sufficiency_resilience_2: "深化自足经济"
 SIA_sufficiency_resilience_2_desc: "自力更生从安全保障上升为战略选择，以牺牲进一步增长换取更强的抗冲击能力。"
 SIA_resilient_kingdom_idea: "坚韧顽强之国"
 SIA_resilient_kingdom_idea_desc: "皇室的庇护与自给自足的经济学融合，形成了应对下一次冲击的持久国家缓冲。"
 SIA_tourism_masterplan: "旅游总体规划"
 SIA_tourism_masterplan_desc: "旅游业已在支撑经济，但它建立在即兴发挥之上——度假村先于基础设施建成，酒店先于受过教育的劳动力开业。一份国家总体规划设定了区域目标，使政府各部门协同联动，并将酒店业视作与任何其他产业同等的经济部门。"
 SIA_phuket_andaman: "安达曼之珠"
 SIA_phuket_andaman_desc: "普吉岛已经吸引着世界各地的人们涌向它的海滩，而新建的机场航站楼和改善的道路让这座岛屿能够接纳更多的游客。安达曼被要求承担国家外汇收入中日益增长的份额，而更多的外来者也在重塑着他们抵达时所面对的海岸线。"
 SIA_pattaya_eastern_riviera: "东部里维埃拉"
 SIA_pattaya_eastern_riviera_desc: "芭堤雅的酒店和夜生活区主要依赖廉价非正规劳动力。将东部沿海的办公与服务经济正规化，而每一个被纳入正式用工体系的劳动者，都期望福利国家能够真正兑现承诺。"
 SIA_chiang_mai_lanna: "北方玫瑰"
 SIA_chiang_mai_lanna_desc: "寺庙、山地风光和悠闲的生活节奏已经吸引背包客和数字游民北上。发展清迈的旅游基础设施，游客便会随之而来，同时房租上涨，让游客原本想探访的街区变得难以负担。"
 SIA_rebuild_the_andaman: "浪潮之后"
 SIA_rebuild_the_andaman_desc: "节礼日海啸席卷安达曼海岸，而重建中那些偷工减料之处至今仍清晰可见。一笔充足的资金投入，完成了紧急救援未能完成的重建工作，并为这场灾难永远地划上了句号。"
 SIA_medical_wellness_hub: "亚洲手术刀"
 SIA_medical_wellness_hub_desc: "世界一流的私立医院已经在接待从整个地区乘飞机前来的患者。进一步扩大健康与外科旅游产业，让泰国的诊所直接以远低于新加坡的价格与之竞争，而本国患者则排在付费外国人的后面等待。"
 SIA_volume_tourism: "数字游戏"
 SIA_volume_tourism_desc: "更多航班、更便宜的套餐、更多的游客涌入。追求纯粹的游客数量，外币储备不断累积，但为应对这一小部分客流而建的海滩和古城却在重压下不堪负荷，而当地居民感受到的压力远比财务报表所反映的要早得多。"
 SIA_high_value_tourism: "质胜于量"
 SIA_high_value_tourism_desc: "游客数量减少，但消费水平大幅提升。吸引高端度假胜地和精品体验市场，而非大众跟团游群体，以牺牲抵达人数为代价，换取一个能缴纳可观税收并在下一次经济衰退中屹立不倒的旅游业。"
 SIA_tourism_capital: "全球最爱"
 SIA_tourism_capital_desc: "从曼谷的街头小吃到普吉岛的海滩，再到清迈的寺庙，泰国成为旅游业带动发展的典范案例。旅游部的工作从营销活动升级为制定长期产业政策，并配套相应的决策支持。"
 SIA_tourism_boom: "旅游业繁荣"
 SIA_tourism_boom_desc: "一波又一波的游客涌入酒店和机场。随着季节更替，这股热潮逐渐消退。"
 SIA_host_major_international_event: "举办国际活动"
 SIA_host_major_international_event_desc: "申办一场峰会、一届世博会或一项重大体育赛事，让泰国在一周内登上全球所有电视屏幕。账单是实实在在的，但免费宣传也是实实在在的。"
 SIA_new_resort_zone: "开放新度假区"
 SIA_new_resort_zone_desc: "划出区域并允许开发新的海岸线或乡村地带用于度假区建设，从而将过剩的投资从已饱和的海岸地区分流出去。"
 SIA_global_amazing_thailand_campaign: "“惊艳泰国”全球宣传活动"
 SIA_global_amazing_thailand_campaign_desc: "以新一轮海外广告、旅游展亮相和付费社交媒体网红宣传，重新推出旅游局旗舰口号——让他们看起来正享受着人生中最美好的时光。"
 SIA_baht_and_bourse: "泰铢与证券交易所"
 SIA_baht_and_bourse_desc: "曼谷的银行和泰国证券交易所早已超越了早期商铺式放贷人的时代，但这里的资本市场仍比泰国与之竞争的邻国更浅、更非正式。一场协调推进的举措扩大了可筹资和可放贷的范围，代价是将同一批不断增长的资金池交给了那些能最快搞定监管机构的人。"
 SIA_tamc_workout: "资产管理公司"
 SIA_tamc_workout_desc: "泰国资产管理公司成立于2001年，旨在消化1997年金融危机遗留的不良贷款，二十年来，它一直在缓慢出售可变现资产，并对无法变现的部分进行减记。彻底清算该基金的账目，可释放仍被锁在其中的资本，前提是其账面上尚未确认的损失最终得到承认，而非再结转至下一年度。"
 SIA_consumer_credit_boom: "放开基层信贷"
 SIA_consumer_credit_boom_desc: "信用卡、个人贷款和分期付款计划从曼谷的商场扩展到各府，让普通家庭能够用明天的薪水在今天消费。消费攀升，政府收入随之增长，但一个拥有如此多新消费信贷的人口，很快就会指望国家在还款到期时出手兜底。"
 SIA_responsible_lending: "宏观审慎监管"
 SIA_responsible_lending_desc: "泰国银行收紧抵押贷款和消费信贷市场的贷款价值比上限与放贷标准，选择一种更慢但更稳健的扩张，而非迅猛增长。银行保持偿付能力，家庭量入为出，但那种推动消费繁荣的宽松消费信贷，则永远失去了流动的机会。"
 SIA_deepen_the_set: "深化证券交易"
 SIA_deepen_the_set_desc: "越来越多的公司在泰国证券交易所上市，外国投资组合经理开辟进入泰国股市的新渠道，市场既在深化，也在变得更加流动。一个更大、更互联的交易所，也意味着在某一天，当一家上市集团的审计账目被证明还不如印刷它们的纸张值钱时，冲击也将更大。"
 SIA_vayupak_stabilization: "“哇育帕”基金"
 SIA_vayupak_stabilization_desc: "国家支持的“哇育帕”基金，在指数下跌过深、过快时准备入市买入，为散户投资者在下一次恐慌中提供兜底。以国库资金支撑股价，与推动股价背后的经济增长并非同一回事，而该基金干预行动的账单，与所有其他支出一样，都来自政府预算。"
 SIA_bank_consolidation: "大城银行问题"
 SIA_bank_consolidation_desc: "日本三菱日联金融集团持有大城银行的控股权——这只是泰国银行业正围绕少数几家大型（且常有外资背景）幸存者进行整合的若干迹象之一。更大的资产负债表能吸收更大的冲击，但那些曾服务于中小型借贷者的中小型银行，则不断消失在别人的支行网络之中。"
 SIA_financial_center: "高级金融中心"
 SIA_financial_center_desc: "曼谷将自身定位为区域金融中心，与新加坡和香港形成竞争，而非仅仅为它们提供市场的配角。深厚的资本市场、稳定的汇率以及整合的银行业，汇聚成一个能够为整个区域（而不仅仅是泰国）定价风险和筹集资本的中心。"
 SIA_financial_center_idea: "高级金融中心"
 SIA_financial_center_idea_desc: "深厚的资本市场、稳定的汇率以及整合的银行业，使泰国成为一个金融中心，不仅为本国，也为整个地区提供风险定价和资本筹集服务。"
 SIA_the_ground_beneath: "大地之下"
 SIA_the_ground_beneath_desc: "一项全国地质调查项目启动，旨在系统性地评估王国土壤和大陆架之下的实际资源——从东北部的钾盐矿层到泰国湾的含气盆地。弄清地下有什么是容易的部分；接下来的难题是，决定以多大的力度去开采，以及当开采出错时由谁来买单。"
 SIA_extractive_drive: "自由采掘"
 SIA_extractive_drive_desc: "审批手续迅速推进，资源部门被要求以最大产量、最少延误进行生产。出口收入攀升，化石燃料游说集团得到了它所要求的一切——但每一座矿场和每一口油井所需的人力都比上一座更多，而那些土地和水源紧邻钻探点的农民，最先察觉到了变化。"
 SIA_stewarded_extraction: "为国采矿"
 SIA_stewarded_extraction_desc: "开采按照国家的规则而非市场的逻辑推进：更慢的审批节奏、真正意义上的环境审查，以及每一份特许权更小的开发规模。这片土地产出的资源，比在更自由放任的方式下要少，但那些生活在矿坑和井口旁的农民与土地所有者，并未被当作附带损害来对待。"
 SIA_udon_potash: "依善钾盐"
 SIA_udon_potash_desc: "依善地区储量巨大的钾盐矿——全球最大之一，且长期未被开采——终于投入生产。新的矿井和加工厂有望催生本土化肥工业，但特许开采区的边界线，恰好从那些小农户和稻米合作社耕种了数代人的土地上径直穿过。"
 SIA_chatree_gold_tin: "查特里矿藏"
 SIA_chatree_gold_tin_desc: "查特里矿区及其周边矿场从中部平原开采出黄金、锡和石膏——这是与曼谷早已闻名的宝石贸易并存的、虽不显眼却实实在在的采矿产业。尾矿库下游的村庄密切关注着渗入地下水层的一切，其声音也日益响亮。"
 SIA_gulf_gas_oca: "争议地区"
 SIA_gulf_gas_oca_desc: "泰国和柬埔寨让泰国湾一片富含天然气的水域闲置了数十年，而非解决其归属问题。在重叠主张区域单方面推进，意味着在哪怕一立方米天然气抵达海岸之前，就要进行资本密集型的边缘钻探——而邻国对此并未达成任何共识。"
 SIA_resource_sovereignty: "资源主权"
 SIA_resource_sovereignty_desc: "钾盐、贱金属与天然气汇聚成一个以曼谷为中枢、而非以季度国际买家意志为转移的资源产业。曾几何时，特许经营权零敲碎打地出售给他人，而今，王国终于不必再为自己土地之下产出的资源乞求他人许可。"
 SIA_resource_sovereignty_2of3_tt: "已完成3个资源项目中的至少2个"
 SIA_the_digital_consumer: "数字消费者"
 SIA_the_digital_consumer_desc: "泰国人正越来越多地选择在线办理银行业务、购物和预订，而不是在柜台前排队。安可达——这家从普吉岛一间小办公室成长起来的旅行预订平台，证明了本土数字企业可以参与任何竞争。为这一转变铺设轨道、建立信任、夯实税基，如今已成为一项国家工程。"
 SIA_promptpay_rails: "PromptPay"
 SIA_promptpay_rails_desc: "PromptPay系统让资金能在手机号码和身份证号码之间以秒级速度流动，中间无需银行网点或汇款手续费。将如此大量的交易正规化，会将现金经济的一部分拉到阳光之下——而那些曾从这种不透明中获利的中间人，立刻便察觉到了变化。"
 SIA_super_app_economy: "超级应用"
 SIA_super_app_economy_desc: "Grab、LINE MAN及其竞争对手将网约车、外卖配送和快递服务整合到同一个应用程序中——而每一个泰国人早已将这类应用保持打开状态。效率的提升是切实存在的，但同样真实的是，那些让这些应用得以运转的司机和骑手，却没有合同、没有福利，也没有谈判席上的一席之地。"
 SIA_ecommerce_marketplaces: "互联网小企业"
 SIA_ecommerce_marketplaces_desc: "Lazada和Shopee为小型制造商和集市摊贩提供了一个可触达本府之外、乃至国门之外顾客的线上店面。仓储和配送车队必须同步建设以匹配需求，而先行投入这些建设，恰恰会蚕食这些电商平台本应带来的收益。"
 SIA_national_digital_champions: "双头市场整合"
 SIA_national_digital_champions_desc: "国家不再充当开放竞争的裁判，而是扶持少数几家全国性平台，任由它们整合市场。一个集中的数字产业便于征税、易于监管，但一个没有真正竞争对手的市场，也几乎没有理由保持价格公道。"
 SIA_open_digital_market: "打破双头垄断"
 SIA_open_digital_market_desc: "反垄断规则和开放数据可携性要求，使小型平台仍能参与竞争，而非任由两大应用瓜分市场。消费者得以保留真正竞争带来的好处，代价则是失去了一个全国龙头企业本可带来的整齐税收收入。"
 SIA_the_outward_turn: "向外转向"
 SIA_the_outward_turn_desc: "几十年来，泰国资本一直单向流动，投入到为外国人建造的工厂和酒店中。如今，新一代的跨国企业集团将目光投向海外寻求自身发展，在曾经是泰国客户而非其目标市场的地区收购股份并兴建工厂。"
 SIA_leveraged_expansion: "购买世界"
 SIA_leveraged_expansion_desc: "利用稳健的资产负债表进行借贷，迅速在海外进行收购。债务融资的收购可以快速扩大投资组合，但每一笔信贷购买的资产都可能迅速贬值。"
 SIA_organic_expansion: "种植我们拥有的东西"
 SIA_organic_expansion_desc: "与其借贷收购，不如扩张泰国企业集团已有的业务：更多分支机构、更大产能、更广阔的市场，资金全部来自自身盈利。这种方式虽然缓慢，也永远不会登上交易杂志的头版头条，但以这种方式收购的资产无需急于出售。"
 SIA_cp_into_china: "认证号0001"
 SIA_cp_into_china_desc: "1990 年，正大集团成为首家在上海证券交易所重新开市后购股的外国投资者，股票代码为0001。三十年后，正大集团在中国的业务从平安保险到遍布全国的饲料厂，这项投资从未停止过盈利，即使它掏空了正大集团曾经在国内发展的部分业务。"
 SIA_thaibev_conquers_asean: "啤酒大亨的帝国"
 SIA_thaibev_conquers_asean_desc: "2017年，泰酒集团旗下的越南饮料公司以近50亿美元的价格收购了西贡啤酒，随后又将星狮集团在新加坡的饮料和房地产帝国并入旗下。如今，一家泰国企业集团就掌控了该地区相当大一部分的饮料市场。"
 SIA_scg_long_son: "龙山崛起"
 SIA_scg_long_son_desc: "暹罗水泥集团位于越南龙山半岛的石化联合装置，将石脑油裂解成塑料原料，而其泰国工厂此前一直需要进口这些原料。该装置在国外建成后，一旦混凝土凝固，便可回流到泰国，形成更便宜、更稳定的供应链。"
 SIA_central_minor_abroad: "海外购物中心和客房"
 SIA_central_minor_abroad_desc: "中央集团通过奥地利西格纳集团入股塞尔福里奇百货、嘉迪威百货和茹曦酒店集团，而美诺国际酒店集团旗下的酒店品牌则从曼谷扩展到马尔代夫和里斯本。如今，泰国零售和酒店业的资金拥有了其顾客从未踏足过的店铺和酒店大堂。"
 SIA_ptt_banpu_resources: "钻探世界"
 SIA_ptt_banpu_resources_desc: "泰国国家石油勘探生产公司的上游油田从阿曼延伸至莫桑比克，直至与马来西亚共享的水域；而班普煤矿的煤矿特许权则横跨澳大利亚和印度尼西亚。泰国通过这些渠道获取了国内所缺乏的资源，这些资源与国内矿山所经历的商品周期息息相关。"
 SIA_outbound_statecraft: "投资即治国之道"
 SIA_outbound_statecraft_desc: "这些交易不再是各自独立的赌注，而是成为一种统一的国家战略，泰国资本既是盈利的工具，也是外交政策的工具。如今，一个专门的办公室负责管理收购流程，东盟一半成员国的董事会都或多或少地要对曼谷负责。"
 SIA_outbound_statecraft_3of5_tt: "已完成至少5项海外扩张协议中的3项"
 SIA_thai_multinationals: "泰国跨国公司"
 SIA_thai_multinationals_desc: "泰国企业发展壮大后，逐渐超越国内市场，开始像它们曾经服务的跨国公司那样运作。它们的海外影响力确实不容小觑，但每一分钱、每一小时的高管投入海外，都意味着国内发展投入的减少。"
 SIA_overseas_deal_boom: "海外贸易繁荣"
 SIA_overseas_deal_boom_desc: "另一项收购已经完成，来自泰国境外的利润正在回流到完成收购的管道。"
 SIA_overseas_acquisitions_category: "海外收购"
 SIA_overseas_acquisitions_category_desc: "泰国企业集团不断在海外寻觅收购目标。他们会寻找下一个目标，完成交易，或者在资金允许的情况下，将整个投资组合推向全球路演。"
 SIA_scout_overseas_targets: "侦察海外目标"
 SIA_scout_overseas_targets_desc: "在签署任何协议之前，务必派交易团队实地考察下一个收购目标。这是一篇简明扼要的文章，探讨了泰国资本的下一个投资方向。"
 SIA_close_the_deal: "完成交易"
 SIA_close_the_deal_desc: "签署下一笔股权、子公司或现有特许权的协议。资金从国库流出是实实在在的，而这项资产的价值尚未得到证明。"
 SIA_global_ma_roadshow: "全球并购路演"
 SIA_global_ma_roadshow_desc: "派出这些企业集团的交易撮合者前往新加坡、香港和伦敦，向银行家和目标公司董事会推介泰国资本。单凭宣传就能为下一轮交易造势。"
 thailand.1.t: "2001年大选"
 thailand.1.d: "2001年1月6日，泰国举行了根据《人民宪法》举行的首次大选。三大势力角逐桂冠。泰爱泰党提出的乡村基金、债务延期偿还和全民医保等政纲，在农村地区引起了广泛关注。王室及其在军事基地的盟友则倾向于限制执政者的权力。现任民主党承诺将以稳健务实的作风执政。我们现在的立场将决定国家最终选择谁。"
 thailand.1.a: "支持泰爱泰党和它代表的乡村势力。"
 thailand.1.b: "动员宫廷关系网和将军们。"
 thailand.1.c: "维持民主党执政。"
 thailand.2.t: "由首席执行官组成的政府"
 thailand.2.d: "新政府上任伊始，便承诺将泰国治理得像一家成功的公司。商界人士充斥内阁，各部委被设定绩效目标，政策出台的速度之快，令官僚机构前所未见。"
 thailand.2.a: "泰国开门迎宾"
 thailand.3.t: "毒品战争"
 thailand.3.d: "2003年2月，政府宣布开展为期三个月的打击冰毒交易运动。各省制定了黑名单并设定了配额。运动结束时，人权组织记录了2800起杀戮事件，其中许多案件从未得到彻底调查。这场运动在媒体上广受好评，但在国外却遭到谴责。"
 thailand.3.a: "全力推进该运动，不要有任何顾虑。"
 thailand.3.b: "悄悄降温"
 thailand.4.t: "九月政变"
 thailand.4.d: "2006年9月19日，总理正在纽约参加联合国大会。与此同时，坦克驶入曼谷街头，宪法被废除，民主改革委员会宣布已和平接管政府。民众向士兵献花，而占人口绝大多数的农村居民则默默地旁观着这一切。"
 thailand.4.a: "让军队承担起责任。"
 thailand.4.b: "安插一个由平民组成的幌子政府。"
 thailand.5.t: "司法解散"
 thailand.5.d: "宪法法院正在审理一起针对最大反对党的选举舞弊案。如果该党被解散，其执行委员会成员将被禁止参与政治活动五年，这将使该运动在不失去任何一员的情况下就遭受重创。"
 thailand.5.a: "解散该党"
 thailand.5.b: "让威胁始终笼罩着他们。"
 thailand.6.t: "全国维持和平秩序委员会掌权"
 thailand.6.d: "2014年5月22日，在经历了数月的抗议和两天的戒严之后，陆军总司令召集对立派别到陆军俱乐部，并在会议室将他们逮捕。陆军总司令宣布，全国维持和平秩序委员会将接管政府。在民主制度稳定之前，不会制定选举的具体时间表。"
 thailand.6.a: "秩序恢复"
 thailand.7.t: "红衫军占领广场"
 thailand.7.d: "反对独裁民主联合阵线涌入曼谷商业中心，要求政府辞职并重新举行选举。拉差帕颂路障林立，城市各处燃起轮胎和建筑物的火焰。全世界的目光都聚焦在军队的下一步行动上。"
 thailand.7.a: "清场"
 thailand.7.b: "协商并等待他们回应。"
 thailand.8.t: "机场查封"
 thailand.8.d: "2008年11月，身穿黄衫的抗议者占领了素万那普机场和廊曼机场，导致30万旅客滞留，泰国航空运输瘫痪。这场围困最终以法院判决推翻他们反对的政府而告终。"
 thailand.8.a: "计算成本。"
 thailand.9.t: "三大诉求"
 thailand.9.d: "由学生领导的集会规模空前，创下1992年以来的新高。集会提出三项诉求：解散议会、停止恐吓批评人士、制定新宪法。在曼谷的一个舞台上，几个世纪以来束缚泰国公众言论的禁忌在一夜之间被打破。"
 thailand.9.a: "支持全部诉求"
 thailand.9.b: "只推动议会能够通过的法案。"
 thailand.10.t: "第112条来到议会阶段"
 thailand.10.d: "一项旨在修订冒犯君主罪的法案已提交议会。该法案限制了可提起诉讼的人员范围，设定了处罚上限，并终止了该法对政治言论的适用。泰国立法机构此前从未就此问题进行过正式投票表决。旧秩序的每一个机构如今都已开始动摇。"
 thailand.10.a: "展开表决"
 thailand.11.t: "化解危机"
 thailand.11.d: "宪法法院裁定，此次修宪运动意在推翻以国王为国家元首的民主政权。该党被解散，其领导层被禁止活动。该运动必须以新的名称，由原班人马重新开始，如同以往一样。"
 thailand.11.a: "我们将在周五之前注册成立一个新政党。"
 thailand.12.t: "建制派反击"
 thailand.12.d: "军队未经政府命令便在首都展开行动。旧秩序认为这场改革实验已经走得太远。接下来的六个小时将决定改革时代是继续下去，还是会加入泰国民主进程中断的漫长行列。"
 thailand.12.a: "号召民众走上街头。"
 thailand.12.b: "退缩以拯救运动。"
 thailand.13.t: "共和问题"
 thailand.13.d: "政府计划就国家宪政形式举行全民公投，这是泰国历届政府从未向人民提出过的问题。无论结果如何，泰国王国都将发生翻天覆地的变化。"
 thailand.13.a: "把这个问题交给人民来决定。"
 thailand.13.b: "撤回全民公投"
 thailand.14.t: "新王朝"
 thailand.14.d: "2016年10月13日，泰国王室宣布普密蓬·阿杜德国王（拉玛九世）驾崩，享年70岁，是泰国历史上在位时间最长的国王。王储继位，成为玛哈·哇集拉隆功国王（拉玛十世）。政府如何纪念这一权力交接，以及过渡进程的快慢，现在由曼谷方面决定。"
 thailand.14.a: "公开宣示新政权。"
 thailand.14.b: "让仪式按部就班地进行下去。"
 thailand.14.c: "平衡仪式与延续性。"
 thailand.15.t: "王朝继续"
 thailand.15.d: "该运动的创始人已无法亲自领导，但其名称仍然对选民具有强大的影响力。摆在该党面前的问题是，谁将带领它参加下届选举。"
 thailand.15.a: "英拉·钦那瓦选票领先"
 thailand.15.b: "斯雷塔·塔维辛领衔竞选，她是商业界的房地产大亨。"
 thailand.15.c: "帕通坦·钦那瓦领衔竞选，这个名字将延续到新一代。"
 thailand.15.e: "让机制选择"
 thailand.16.t: "永远选他信"
 thailand.16.d: "年度党代会投票决定废除党内任期限制，并赋予领导层在候选人遴选、党内名单制定和联盟政策方面的紧急权力。反对派席位上空无一人，没有一位重要人物。选举将继续举行，也将继续赢得胜利。"
 thailand.16.a: "一个领袖，一个政党，一个泰国。"
 thailand.17.t: "王位复辟"
 thailand.17.d: "议会、枢密院和军队联合向王室请愿，要求直接接管国家机构的管理权。上个世纪的宪政虚构就此终结。却克里王朝恢复了其在1932年之前所扮演的角色。"
 thailand.17.a: "国王万岁"
 thailand.18.t: "2017年体制"
 thailand.18.d: "新宪法在全民公投中获得通过，但竞选活动受到严格限制，反对派被视为刑事犯罪。一个完全由议员组成的参议院将协助选举未来的总理，一项为期二十年的国家战略将约束每一届未来的政府。选举将会恢复，但这次是在围栏之内。"
 thailand.18.a: "这就是引导式民主。"
 thailand.19.t: "王国举行大选"
 thailand.19.d: "2001年1月6日，全国76个省份的投票站同时开放。这是根据《人民宪法》举行的第一次选举，由独立委员会而非内政部进行计票，也是第一次获胜政党无需经过数月的组阁谈判即可直接执政。"
 thailand.19.a: "开始倒计时。"
 thailand.20.t: "法庭解散该党"
 thailand.20.d: "宪法法院裁定，执政党向小党派支付费用，让他们在被宣布无效的选举中推出候选人，并下令解散该党。该党111名执行委员被禁止参政五年。判决撤销了该党的名称、注册资格和领导层，但并未影响到任何选民。几周之内，同样的议员们就以新的党名重新注册，而东北部的政治机器甚至没有失去任何一个选区。"
 thailand.20.a: "重新注册，保持清洁，由新管理团队负责。"
 thailand.20.b: "被禁的高管们将继续在外部操控公司。"
 thailand.21.t: "法庭清空牌桌"
 thailand.21.d: "第二次解散，执政党也随之解散。裁决还解散了原有的民族保守派联盟，该联盟的省级派系头目如今掌控着议会的多数席位，正被双方拉拢。他们的领袖被禁止参选，但并未噤声，目前在武里南府的一处住宅内进行谈判。如果他的成员退出，反对派将无需选举即可组建政府。如果他们能够留任，联盟得以维系，但所有人都将清楚地知道为此付出了怎样的代价。"
 thailand.21.a: "让他们走吧，让民主党人试试执政。"
 thailand.21.b: "满足他们提出的任何条件。"
 SIA_bench_hands_power_to_democrats_tt: "议会在§Y民主党§!执政的情况下重新召开会议。"
 thailand.50.t: "走出冬阴功危机"
 thailand.50.d: "泰铢贬值三年后，经济再次增长。东海岸的工厂正在重新招聘员工，而当初在屈辱中启动的国际货币基金组织援助计划也提前完成了。"
 thailand.50.a: "最糟糕的时期已经过去了。"
 thailand.51.t: "国际货币基金组织离去"
 thailand.51.d: "2003年7月，泰国提前两年偿还了其对国际货币基金组织的最后一笔债务。总理发表电视讲话，宣布泰国恢复经济独立，以此纪念这一时刻。"
 thailand.51.a: "不再重演"
 thailand.52.t: "节礼日海啸"
 thailand.52.d: "2004年12月26日，苏门答腊岛附近海域发生海底地震，引发海啸袭击泰国安达曼海域。考拉和普吉岛遭受重创，泰国境内超过5000人丧生，其中许多是外国游客。全世界都在关注泰国的救援行动。"
 thailand.52.a: "救灾工作要全力以赴。"
 thailand.52.b: "最低限度的回应。"
 thailand.53.t: "大洪水"
 thailand.53.d: "季风洪水沿湄南河盆地而下，淹没了泰国三分之二的府，并漫过曼谷北部的工业区。被洪水淹没的泰国工厂导致全球硬盘生产停滞。首都曼谷筑起沙袋墙，静待洪水退去。"
 thailand.53.a: "调动一切"
 thailand.53.b: "保护曼谷，让其他省份的资源枯竭。"
 thailand.54.t: "大米质押计划"
 thailand.54.d: "政府提议以市场价的1.5倍收购全部稻米收成，将数十亿资金转移给农户，并押注世界稻米价格会随之下降。经济学家警告说，仓库将会爆满，损失将是史无前例的。选举我们的农民们正在等待结果。"
 thailand.54.a: "捐献每一粒粮食。"
 thailand.54.b: "悄悄搁置这个计划。"
 thailand.55.t: "亚洲底特律"
 thailand.55.d: "汽车产量突破百万辆大关。泰国现已成为东南亚最大的汽车生产国，也是全球领先的一吨级皮卡生产国。"
 thailand.55.a: "吸引丰田和本田并且敞开大门"
 thailand.56.t: "泰国旅游年"
 thailand.56.d: "曼谷是世界上游客最多的城市之一。从考山路到卡伦海滩，泰国接待着来自世界各地的游客，而游客的消费也支撑着数百万泰国人的钱包。"
 thailand.56.a: "萨瓦迪卡。"
 thailand.56.b: "投资于行业本身。"
 thailand.57.t: "潜艇问题"
 thailand.57.d: "海军采购中国制造的S26T潜艇的合同已成为全国热议的话题。这些潜艇究竟是横跨两大洋舰队的首批舰艇，还是耗资数十亿美元却无法交付的发动机？最终的采购决定权掌握在政府手中。"
 thailand.57.a: "买下这些船"
 thailand.57.b: "取消项目"
 thailand.100.t: "失去的领土"
 thailand.100.d: "官方媒体重新启用旧地图。各省分别于1893年、1904年和1907年割让给法国，苏丹国于1909年割让给英国。披汶时代的民族耻辱叙事重返教科书，自1945年以来任何政府都未曾援引的运动再次兴起。"
 thailand.100.a: "被拿走的东西可以归还。"
 thailand.101.t: "萨尔温河对岸的兄弟"
 thailand.101.d: "曼谷正式宣布关注掸邦傣雅族的命运。傣雅族与泰族在语言和血缘上都属于同一族群，与缅甸军政府世代交战。这份声明并未直接提出领土要求，但该地区的民众都清楚其含义。"
 thailand.101.a: "泰族是一个民族。"
 thailand.102.t: "湄公河是泰国的一条河流"
 thailand.102.d: "政府正式宣布1893年和1904年的法暹条约无效，称其系在胁迫下签署。此次主权声索直接涵盖占巴塞省，但执政党内部有人质疑，为何主权声索仅限于法国恰好划定的省份。"
 thailand.102.a: "宣称1904年领土"
 thailand.102.b: "宣称老挝为泰国领土"
 thailand.103.t: "柏威夏对峙"
 thailand.103.d: "围绕悬崖顶寺庙的炮火交锋是自2011年以来最严重的，这为曼谷提供了借口。政府宣布不再承认1962年国际法院的裁决，并声称对马德望和暹粒这两个在人们记忆中仍属于暹罗的省份拥有主权。"
 thailand.103.a: "重申宣称"
 thailand.103.b: "宣称，并且发出最后通牒"
 thailand.104.t: "谴责1909"
 thailand.104.d: "外交部正式谴责1909年的《英暹条约》，该条约将曼谷的马来属地割让给了大英帝国。吉兰丹和登嘉楼被直接点名。吉隆坡在一小时内召回了其大使。"
 thailand.104.a: "宣称吉兰丹与登嘉楼"
 thailand.104.b: "要求归还所有割让的苏丹国。"
 thailand.105.t: "素旺那蓬"
 thailand.105.d: "史册中的黄金国度，泰族世界在同一面旗帜下汇聚。政府宣布统一计划原则上已完成。剩下的工作是使收复的领土在行政和名称上都归泰族所有。"
 thailand.105.a: "从萨尔温江到大海，升起一面旗帜。"
 thailand.105.b: "暂停。先让军队巩固阵地。"
 thailand.106.t: "掸邦地区的整合"
 thailand.106.d: "泰国的行政管理、教育和基础设施已延伸至掸邦高原。一体化委员会报告称，新成立的省份已做好全面并入泰国的准备。"
 thailand.106.a: "欢迎回家"
 thailand.107.t: "整合老挝领土"
 thailand.107.d: "湄公河沿岸各省完成行政整合。湄公河不再是边界。"
 thailand.107.a: "欢迎回家"
 thailand.108.t: "整合高棉省份"
 thailand.108.d: "马德望和暹粒，旧地名录中的帕塔邦和暹玛叻，自1946年以来首次回归泰国行政管辖。"
 thailand.108.a: "欢迎回家"
 thailand.109.t: "整合南方诸省"
 thailand.109.d: "原苏丹国完成合并，英国和马来西亚长达一个世纪的统治宣告结束。接下来，更艰巨的任务是如何让合并后的政权正常运转。"
 thailand.109.a: "欢迎回家"
 thailand.110.t: "世界反应"
 thailand.110.d: "邻国首都纷纷召开紧急会议。东盟的创始成员国之一背弃了其基本原则 - 殖民时代边界不可侵犯。各国大使馆被召回，联合军事演习被暂停，昔日的朋友们开始用新的词汇来描述泰国。"
 thailand.110.a: "他们会习惯的"
 thailand.150.t: "南方之火"
 thailand.150.d: "2004年1月4日，武装分子袭击了那拉提瓦府的一处军火库，杀害士兵并劫走数百件武器。随后，泰南边境马来-穆斯林各府发生了一系列协调一致的纵火事件。沉寂了二十年的分离主义叛乱卷土重来。"
 thailand.150.a: "南方会考验我们。"
 thailand.151.t: "泰南意外事件"
 thailand.151.d: "又一周过去了，又一起路边炸弹袭击，又一起发生在也拉府、北大年府或那拉提瓦府的检查站枪击事件。冲突以曼谷已经习以为常的节奏持续下去，而南部地区却依然无法承受。"
 thailand.151.a: "忍受"
 thailand.152.t: "出重拳"
 thailand.152.d: "泰南边境三府的一次安全行动，以被拘押者死亡告终，军方为其手段辩护。承诺的调查并未带来任何起诉。而穆斯林受难者的图像正在边界之外、在整个伊斯兰世界激起与我国的对抗。"
 thailand.152.a: "秩序是有代价的。"
 thailand.153.t: "在吉隆坡的会谈"
 thailand.153.d: "泰国官员与北大年马来国民革命阵线代表在马来西亚调解员安排的桌旁对坐。议程并不复杂，涵盖安全区、战俘福利以及对对话本身的认可。多年来，双方一直否认战争的存在，如今，对话已是双方做出的让步。"
 thailand.153.a: "让他们继续说下去。"
 thailand.154.t: "和平协议"
 thailand.154.d: "北大年府自治框架协议签署。该协议引入了民选的地方政府、马来语与泰语并存的教育体系、针对冲突中暴行的司法机制，以及分阶段结束安全部队驻扎的方案。泰国境内持续时间最长的战争随着协议的签署而结束。"
 thailand.154.a: "南方的和平"
 thailand_news.1.t: "曼谷政变"
 thailand_news.1.d: "泰国皇家军队已在曼谷夺取政权，中止宪法并解散民选政府。自1932年以来，泰国屡遭军政府统治，市场和政府部门都在盘算着这次军政府究竟能执政多久。"
 thailand_news.1.a: "又一次？"
 thailand_news.2.t: "泰国宣称“失去的领土”"
 thailand_news.2.d: "曼谷正式宣称对一个世纪前割让给法国和英国的领土拥有主权，此举重启了二战后销声匿迹的领土收复主义运动。东南亚各国首都对此表示警惕。"
 thailand_news.2.a: "令人担忧"
 thailand_news.3.t: "暹罗共和国？"
 thailand_news.3.d: "泰国将就君主制的未来举行全民公投，这在泰国现代史上史无前例。整个地区屏息以待。"
 thailand_news.3.a: "前所未有"
 thailand_news.4.t: "泰国举国哀悼普密蓬国王"
 thailand_news.4.d: "世界在位时间最长的君主普密蓬·阿杜德国王在曼谷逝世，享年88岁。泰国全国开始为期一年的哀悼，悼念这位大多数泰国人一生中唯一认识的国王。他的儿子继承王位，成为玛哈·哇集拉隆功国王，即拉玛十世。"
 thailand_news.4.a: "一个时代结束了"
 thailand.58.t: "眼镜蛇沼泽"
 thailand.58.d: "自上世纪70年代以来，“眼镜蛇沼泽”就一直在吞噬资金。如今，新机场正拔地而起，成本也随之飙升。排水问题、滑行道开裂、承包商对同一份混凝土收取两次费用……董事会要么想要更多资金，要么想要更多时间。"
 thailand.58.a: "注入资金，按计划开业。"
 thailand.58.b: "让日程有所延误。"
 thailand.59.t: "亚洲门户"
 thailand.59.d: "素万那普机场敞开大门。这座玻璃和钢铁结构的航站楼是世界上最大的航站楼之一，其建造旨在将曼谷置于亚洲所有航线图的中心。第一块到达信息牌上的描述，简直像是旅游部的一份美好愿景。"
 thailand.59.a: "王国有了新的大门。"
 thailand.60.t: "东部破土动工"
 thailand.60.d: "东部经济走廊目前还停留在纸面上，现在需要有人为之买单。北京代表团带着包装成“一带一路”框架的融资方案前来考察。财政部也可以在国内筹集资金，虽然速度较慢，但​​没有任何附加条件。"
 thailand.60.a: "吸引中国资本。"
 thailand.60.b: "发行国内债券。"
 thailand.61.t: "铁路连接线透支"
 thailand.61.d: "在三个机场下方修建隧道注定耗资巨大，但没人向内阁汇报过具体费用。这条三机场线路要么需要追加资金，要么需要更精简的方案。"
 thailand.61.a: "支付费用。主干线得以完整重建。"
 thailand.61.b: "调整视角。"
 thailand.62.t: "“一带一路”的召唤"
 thailand.62.d: "一条从昆明经万象到曼谷的高速铁路。这条中国中南走廊缺失的中间段穿过泰国领土，北京非常希望为其提供资金。条件很优厚。但这些条件也只是条件而已。"
 thailand.62.a: "签署铁路备忘录。"
 thailand.62.b: "用泰国的方式，慢慢地重新谈判。"
 thailand.63.t: "让步问题"
 thailand.63.d: "反对派参议员们统计了自该国最大的电信运营商组建政府以来，电信特许经营权的各项表现。税收调整、许可证延期、竞争对手接受审计。“巧合”一词在官方回复中扮演着重要角色。"
 thailand.63.a: "抛售这些持股。承受国债损失，换取良好的声誉。"
 thailand.63.b: "大胆去做吧。人数决定选举结果，律师争取时间。"
 thailand.64.t: "家庭债务清算"
 thailand.64.d: "村里的资金用来建造商店、摩托车和碾米厂，全部都是贷款。农村家庭的平均债务几乎翻了一番，合作社的账目也开始出现问题。银行希望在贷款展期开始前得到指导。"
 thailand.64.a: "救助合作社。暂停偿付债务会让我们付出代价，但能拯救村庄。"
 thailand.64.b: "让信贷收紧吧。市场会进行调整，但村庄会消化这些调整带来的影响。"
 thailand.65.t: "抵消与爱立眼"
 thailand.65.d: "萨博的最终报价摆在了桌面上。报价包括完整的源代码访问权限、爱立眼机载雷达、大学合作项目以及为泰国工业提供零部件，所有这些都是有偿的。或者，也可以选择价格低得多的同款战斗机，但不含任何配件。"
 thailand.65.a: "接受全套方案。"
 thailand.65.b: "仅购买机身。注意预算。"
 thailand.66.t: "引擎问题"
 thailand.66.d: "德国拒绝为中国制造的出口型潜艇提供柴油发动机许可证，导致已支付一半款项的S26T潜艇艇体在武汉等待“心脏”的到来。北京方面提出提供自家发动机并给予折扣。海军方面则让内阁面临两难选择。"
 thailand.66.a: "接受中国产发动机并提货。"
 thailand.66.b: "要求以一艘护卫舰船体作为赔偿。"
 thailand.66.c: "彻底取消合同。"
 thailand.67.t: "旗舰重生"
 thailand.67.d: "滑跃甲板上部署着无人机，机库甲板的坞舱内装载着无人艇，控制台摆放在曾经堆放“鹞”式战机备件、早已锈蚀的地方。“差克里·纳吕贝特”号返回梭桃邑时，已拥有了本地区独一无二的任务配置。"
 thailand.67.a: "让她列队走过摄像机。"
 thailand.67.b: "安静地重新启动，恢复工作。"
 thailand.68.t: "九十天的恐惧"
 thailand.68.d: "黑名单变成了死亡人数统计。三个月内死亡人数超过两千，其中许多人与毒品并无关联，调查人员未能查明。乡村地区一片欢腾，医院人满为患，外交部的邮箱也迅速爆满。"
 thailand.68.a: "坚持下去。这场运动正在奏效。"
 thailand.68.b: "悄悄降温同时要求重估"
 thailand.69.t: "军官俱乐部传出风声"
 thailand.69.d: "曼谷历届政府都会学会解读的种种迹象都在这里：不寻常地轮换到第一军区，退役将领突然热衷于电视采访，以及骑兵营的同学聚会，半数高级指挥官都出席了。"
 thailand.69.a: "清除高层领导。"
 thailand.69.b: "迁就将军们。"
 thailand.69.c: "公开反抗他们。"
 thailand.70.t: "政府大楼外的坦克"
 thailand.70.d: "一切照旧地开始了。常规节目被爱国音乐取代，十字路口停着装甲车，一份来自昨天还无人知晓的“委员会”的公报。政府只有几分钟时间来决定愿意花多少钱。"
 thailand.70.a: "团结忠诚派，进行抵抗。"
 thailand.70.b: "认输，然后登机。"
 thailand.70.c: "协商组建国民团结政府。"
 thailand.70.c_tooltip: "§Y将军们进入的是内阁，而不是宫殿。§!\n选举得以顺利进行（§G选举不会暂停§!），政变压力降至§Y35§!。王国为此付出了稳定和政治资本方面的代价，一项§Y不稳定的妥协§!使政府承受了180天的压力。"
 thailand.71.t: "街头的年轻人"
 thailand.71.d: "他们通过Telegram组织起来，引用《哈姆太郎》和《饥饿游戏》的台词，成千上万地聚集在纪念碑前。他们的诉求写在纸飞机上，扔过障碍物：解散议会，重写宪法，改革那些不可触碰的机构。"
 thailand.71.a: "驱散集会人群。秩序刻不容缓。"
 thailand.71.b: "开启对话。改变语气，但不要改变实质内容。"
 thailand.71.c: "耐心等待。他们会比我们先疲惫。"
 thailand.155.t: "一片火海"
 thailand.155.d: "一夜之间，三个省份发生协同纵火事件。检查站光天化日之下遭到袭击。教师在押送下，学校停课。南方地区几十年未见如此惨烈的景象，国家安全委员会亟需明确的方向。"
 thailand.155.a: "向南方增派大量军队。"
 thailand.155.b: "致电吉隆坡，扩大对话范围。"
 thailand.156.t: "北大年静谧的道路"
 thailand.156.d: "月度事件分布图上，空白区域比红色区域多。市场营业至深夜，检查站放行车辆，吉隆坡对面的人们正谨慎地询问，最终的局面会是什么样子。"
 thailand.156.a: "推动达成最终协议。"
 thailand.156.b: "维持现状，保持平静。"
 thailand.350.t: "南方之火"
 thailand.350.d: "南方三省的地图上布满了红色图钉，爆炸、伏击、纵火和暗杀事件层出不穷。数千人丧生，安全部队伤亡惨重，无法补充。这场危机已无法在边缘地带得到控制。政府必须决定在南方扮演何种角色：是铁腕统治，还是恩惠庇护，抑或与民众平等对话。"
 thailand.350.a: "粉碎他们。南方将会明白秩序的意义。"
 thailand.350.b: "国王的和平。发展南方，收复失地。"
 thailand.350.c: "跟他们谈谈。即使是昔日的仇敌也能签字。"
 thailand.350.e: "我们没有明确的政策，只能走一步看一步了。"
 thailand.356.t: "卡车"
 thailand.356.d: "又一次清剿行动，又一群人聚集在另一个区警察局外。最终，数百名被拘留者面朝下被塞进军用卡车，数十人在抵达营地前窒息而死。在曼谷方面发表声明之前，这些画面就已经传遍了整个穆斯林世界。无论这次行动在地面上取得了什么成果，它都已经使一代人走向极端，并为叛乱运动提供了其起源神话。"
 thailand.356.a: "一场灾难。南方不会忘记这场灾难。"
 thailand.357.t: "完成治安任务"
 thailand.357.d: "将军们报告任务已完成。路边的炸弹已停止，基层组织已被瓦解，检查站正在拆除。按照军队衡量的一切标准，泰南已被平定。但在表面的平静之下，积怨并未消亡，只是默默等待。"
 thailand.357.a: "枪声已停。我们将静观余烬。"
 thailand.358.t: "南方的平静"
 thailand.358.d: "没有条约，也没有自治权，但暴力已逐渐消退，取而代之的是一种有控制的平静。王室发展稳步推进，地方名流纷纷入主王室，君主制在南方的合法性也悄然恢复。这种平静靠的是王室的存在和庇护，靠的是监视而非解决。"
 thailand.358.a: "The crown keeps the peace it has won."
 thailand.359.t: "The Establishment Pushes Back"
 thailand.359.d: "The draft special-autonomy law has leaked, and the reaction in Bangkok is ferocious. Generals warn of dismemberment, palace conservatives mutter about precedent, and the nationalist press calls it surrender. The negotiators are ready to sign, but the government must decide whether it will spend the political capital to hold the line, or water the framework down to something the center can swallow."
 thailand.359.a: "Hold the line. The accord must be real."
 thailand.359.b: "Water it down. Keep the peace, lose the principle."
 thailand.360.t: "The Pattani Accord"
 thailand.360.d: "Signatures on a single page end the longest war inside the Kingdom's modern borders. The South gains genuine self-government within a unitary Thailand, the guns are surrendered, and the displaced begin to return. It is imperfect, contested, and historic, and for the first time in a generation, the children of Pattani will grow up without curfew."
 thailand.360.a: "Peace, at last, in the South."
 thailand_news.24.t: "Massacre at Tak Bai"
 thailand_news.24.d: "Footage of detainees suffocated in army trucks outside Tak Bai has reached every capital in the Muslim world. Kuala Lumpur, Jakarta, and Ankara have summoned Thai ambassadors, and human-rights bodies demand an inquiry. Bangkok's southern policy is now a byword for atrocity, and the insurgency has never had an easier recruiting season."
 thailand_news.24.a: "The world is watching the South."
 thailand_news.25.t: "Peace Comes to Pattani"
 thailand_news.25.d: "经过一代人的浴血奋战，泰南的枪声终于沉寂。无论是靠士兵之手还是谈判者之笔，王国现代史上历时最久的叛乱已画上句号。道路畅通，市场繁荣，一种谨慎的常态回归北大年、也拉和那拉提瓦。"
 thailand_news.25.a: "A long war ends."
 thailand_news.23.t: "A Government of National Unity"
 thailand_news.23.d: "The tanks have withdrawn from the intersections, but the bargain struck in the night will outlast the crisis. The elected government keeps its mandate and the ballot box its place, yet the service chiefs now sit at the cabinet table, and everyone in Bangkok understands who guaranteed the peace. It is a compromise nobody loves and nobody dares break, a national government with the army inside the tent."
 thailand_news.23.a: "Power, shared and watched."
 thailand.3.c: "Crops, not poppies. Fund alternative development."
 thailand.361.t: "Bodies by the Roadside"
 thailand.361.d: "The three-month campaign is over and the tally is in. Rights organizations document some 2,800 dead, the great majority never charged with anything, many never even named. Blacklists settled old scores, and quotas were met with bodies. The streets are quieter and the polls are higher than ever, but in the barracks and the palace, men are taking notes on a government that kills on a timetable."
 thailand.361.a: "The numbers are the numbers. We do not apologize."
 thailand.362.t: "Crops Not Poppies"
 thailand.362.d: "Interdiction alone has only pushed the trade across the next ridgeline. The agronomists and the public-health people have a different proposal. Pay the hill farmers to grow coffee, macadamia and fruit instead of opium, treat addiction as illness rather than crime, and let legal cash crops do what helicopters never could. It is slower, it is cheaper, and it asks the state to stop shooting and start buying."
 thailand.362.a: "Fund alternative development. Win the hills with markets."
 thailand.362.b: "Keep interdicting. Hold the line we have."
 thailand_news.5.t: "Thailand Unveils the Eastern Economic Corridor"
 thailand_news.5.d: "Bangkok has formally opened its flagship development zone on the Eastern Seaboard, with high-speed rail to three airports, an expanded U-Tapao aerotropolis, and incentive packages aimed at electric vehicles, aerospace and biotechnology. Analysts call it the most ambitious Thai economic project since the Eastern Seaboard program of the 1980s."
 thailand_news.5.a: "The Land of Smiles means business."
 thailand.50.b: "Soften the blow and protect the people."
 thailand.55.b: "Build the national car."
 thailand.200.t: "The People's Constitution"
 thailand.200.d: "Civil society organizations, academics and community leaders celebrate a constitution written with genuine public participation. For the first time in decades, ordinary Thais feel they had a hand in their own basic law, and the streets of Bangkok are unexpectedly festive."
 thailand.200.a: "Democracy takes root."
 thailand.201.t: "Records at Don Mueang"
 thailand.201.d: "Passenger numbers at Don Mueang surpass every previous record, and the Amazing Thailand campaign has worked beyond anyone's projections. Airline executives are announcing new direct routes and tour operators are booking out the next two seasons already. The question before us is what to do with the revenue."
 thailand.201.a: "Reinvest it in southern resorts."
 thailand.201.b: "Bank the windfall."
 thailand.202.t: "A World Hungry for Rice"
 thailand.202.d: "A drought in the Indian subcontinent and crop failures across Southeast Asia have sent world rice prices to a decade high. Thailand sits on stockpiles of premium Hom Mali and Jasmine varieties that every grain importer wants immediately. The commerce ministry is waiting for our answer."
 thailand.202.a: "Sell the stockpile at premium prices."
 thailand.202.b: "Keep the rice at home and subsidize domestic prices."
 thailand.203.t: "The Basing Request"
 thailand.203.d: "The U.S. Pacific Command has made a quiet but formal request for expanded access rights at U-Tapao airbase for logistics, surveillance and pre-positioning. The Americans are willing to pay, in treasury transfers, equipment upgrades and political cover. The public need never know the details."
 thailand.203.a: "Grant the access and take the money."
 thailand.203.b: "Decline politely. Thai soil, Thai sovereignty."
 thailand_news.6.t: "The Bamboo Bends, It Does Not Break"
 thailand_news.6.d: "Thailand has struck a landmark dual-track diplomatic alignment, simultaneously deepening its treaty relationship with Washington while signing a new framework economic partnership with Beijing. Bangkok's foreign ministry is calling it 'bamboo diplomacy', flexible, resilient, and rooted in Thai interests above all others."
 thailand_news.6.a: "A remarkable balancing act."
 thailand_news.7.t: "Thailand Repays IMF Two Years Early"
 thailand_news.7.d: "Bangkok has cleared its entire International Monetary Fund debt obligation, two years ahead of schedule. The early repayment, announced without fanfare by the Finance Ministry, closes the chapter on the 1997 Asian Financial Crisis and frees Thailand from the last conditions attached to the 1997 bailout program."
 thailand_news.7.a: "The Land of Smiles pays its debts."
 thailand.205.t: "Technocrats vs the Old Guard"
 thailand.205.d: "The new CEO-style cabinet has set performance targets for every ministry, and several permanent secretaries have been replaced with business executives. The old bureaucracy is not amused. A quiet war is underway between the technocrats pushing 'Thailand Inc.' and the career officials who have run the ministries for thirty years."
 thailand.205.a: "Back the technocrats. Reform the ministries."
 thailand.205.b: "Protect the career bureaucracy. Keep the ministries running and the generals onside."
 thailand.207.t: "Prayuth Fatigue"
 thailand.207.d: "Three years in, the generals' promises of reform are wearing thin. The constitutional drafting committee has been reconstituted twice. The election date has moved twice. An undergraduate with a sign outside Parliament faces seventeen charges. The honeymoon is over."
 thailand.207.a: "We will manage the transition carefully."
 thailand.208.t: "The Standoff Continues"
 thailand.208.d: "Days pass, then weeks. The protests have not collapsed, but they have not escalated either. The government neither concedes nor clears the square. Eventually both sides blink. The question is who blinked less."
 thailand.208.a: "Seek a quiet resolution with concessions."
 thailand.208.b: "The protesters take credit. The government takes the blame."
 thailand_news.8.t: "The Palace Takes the Wheel"
 thailand_news.8.d: "The Thai royal establishment has formalized its role in the management of Crown Property Bureau assets, consolidating authority over hundreds of billions of baht in commercial holdings into a structure reporting directly to the palace. Analysts in Bangkok debate whether this represents a constitutional novelty or simply a legal tidying-up of arrangements that have existed informally for decades."
 thailand_news.8.a: "The Chakri dynasty endures."
 thailand.209.t: "The Kids Are Online"
 thailand.209.d: "A youth-led protest movement has erupted simultaneously in Bangkok, Chiang Mai and three provincial campuses. Their demands are transmitted over livestreams before the police have unrolled their barriers. The government must decide whether to engage or wait."
 thailand.209.a: "Champion their cause."
 thailand.209.b: "Keep governing. Let the moment pass."
 thailand.210.t: "A Letter from the Barracks"
 thailand.210.d: "An anonymous document, circulated among senior officers and then leaked, describes plans for a civilian-orchestrated reduction of military influence over promotions and procurement. The text carries a warning. The army is watching, and patience has a limit. This may be a genuine coup plot in its early stages, or a bluff. The choice of response defines what kind of country this is."
 thailand.210.a: "Act now and purge the plotters before they can organize."
 thailand.210.b: "Proceed quietly. We will not dignify leaks with a response."
 thailand.211.t: "The Provinces Have Spoken"
 thailand.211.d: "Returns from the northeast and the upper north are in, and district after district has swung to the reform list. Veteran MPs of thirty years standing have lost to twenty-eight-year-olds who campaigned on social media. The electoral map is being redrawn by voters who have never had a local MP take their calls."
 thailand.211.a: "Seize the mandate."
 thailand.211.b: "Govern for all of them, not just our voters."
 thailand.212.t: "The Conglomerates Respond"
 thailand.212.d: "The auction of the previously monopolised spectrum blocks has produced exactly the windfall the reformers predicted. The same week, a coordinated legal challenge from the three largest conglomerates landed in the Constitutional Court, and an opinion column in a royalist paper described the finance ministry as 'ideologically possessed.' The break-up policy is working, and it has powerful enemies."
 thailand.212.a: "Press on. The law is on our side."
 thailand.212.b: "Offer a settlement, a managed wind-down rather than a forced break-up."
 thailand.213.t: "The Republic's First Year"
 thailand.213.d: "Twelve months since the declaration, and the country is still here, bruised, energized, and arguing, but here. The royalist movement has not disappeared. It has mutated into a legal and cultural campaign. The first presidential election is scheduled. The question before the cabinet is whether to call it a success, acknowledge the fracture, or simply get on with governing."
 thailand.213.a: "We have built something that will last."
 thailand.213.b: "The Chakri cause is not finished. The people remember."
 thailand.213.c: "The republic survives, for now. There is still much to defend."
 thailand.214.t: "The Column Passes the Monument"
 thailand.214.d: "Three hours of artillery, armour, and infantry, the armed forces in full parade order along Ratchadamnoen Avenue. The crowds are larger than the planners expected. For a country that has forgotten its wars and absorbed its coups as routine, the display lands with unusual weight."
 thailand.214.a: "A nation salutes its defenders."
 thailand_news.9.t: "Thailand Legalises Same-Sex Marriage"
 thailand_news.9.d: "The Thai parliament has passed the Marriage Equality Act by a two-thirds majority, becoming the first country in Southeast Asia to grant full marriage rights regardless of gender. The act takes effect immediately. Celebrations in Bangkok's Silom and Chiang Mai's Nimman districts have drawn tens of thousands. Several neighboring governments have issued statements expressing 'concern.'"
 thailand_news.9.a: "A milestone for Asia."
 thailand_news.10.t: "The Spring Holds"
 thailand_news.10.d: "Three years since the reform government took office on a wave of youth protest, Thailand today completes a full democratic transition. Civilian control of the military is formalized, the appointed senate is dissolved, and the first freely competitive election in two decades is held without incident. International observers from seventeen countries have certified the result."
 thailand_news.10.a: "Democracy takes root."
 thailand_news.11.t: "Thai Wave Sweeps Asia"
 thailand_news.11.d: "From Tokyo to Taipei to Kuala Lumpur, Thai content is everywhere. Streaming series, hip-hop acts, fashion labels, and a cuisine diplomacy machine that the government did not plan and cannot take full credit for. Thailand's cultural output has overtaken its neighbors' in both value and reach."
 thailand_news.11.a: "The world wants what Thailand is making."
 thailand.215.t: "Taking Stock of the Kingdom"
 thailand.215.d: "The new government's first internal review is complete. Officials have gathered the numbers, the debt ratios, infrastructure gaps, trade balances, and public morale, and three paths stand out from the analysis. The government must choose its first priority. Whatever is chosen now will shape the country's trajectory for the next two years."
 thailand.215.a: "Focus on Recovery. Rebuild the economy from the ground up."
 thailand.215.b: "Focus on Order. Strengthen institutions before reforming them."
 thailand.215.c: "Focus on the World. Lead with diplomacy and trade."
 thailand.216.t: "The Generals' Move"
 thailand.216.d: "The government's resistance call has gone out to loyalists in the police, the border patrol, civil society networks, and the streets. Whether the people answer is the question that decides the next decade of Thai politics. In the operations room, staff are watching unit deployments on the map and counting."
 thailand.216.a: "Hold the line."
 thailand.217.t: "北京表示不满"
 thailand.217.d: "中国大使馆的照会依旧是外交辞令，但其中的冷意清晰可辨。泰国与华盛顿的日益走近，并未被忽视。北京官方媒体提及泰国的“矛盾姿态”。投资代表团悄然推迟行程。摆在曼谷面前的问题是：这份压力，要吸收多少，又要化解多少。"
 thailand.217.a: "让关系冷却下来。我们已经做出了选择。"
 thailand.217.b: "以总理个人名义，私下向北京方面传递安抚信息。"
 thailand.218.t: "华盛顿做出调整"
 thailand.218.d: "美国国务院公开对泰国与中国“一带一路”倡议的新对接保持了审慎的中立态度，但国会工作人员已开始就“金色眼镜蛇”联合军演的资金与条约承诺提出尖锐质疑。五角大楼的一份评估报告被泄露给华盛顿某智库，其中将泰国描述为“战略模糊”。曼谷必须妥善管理这段关系。"
 thailand.218.a: "接受关系冷却。我们是一个主权国家。"
 thailand.218.b: "对大使做出私下保证。此举并没有在实质上改变任何东西。"
 thailand.219.t: "将军常驻体制"
 thailand.219.d: "将军事监护制度化的决定，已登上国际媒体的社论版面。《金融时报》将其描述为“受控威权主义”。三名欧洲大使在同一周内请求与外交部会面。在国内，改革派学者和学生正在阅读这些报道，并得出自己的结论。"
 thailand.219.a: "我们依自身准则行事，外部言论无关紧要。"
 thailand.219.b: "批评者关于泰国的看法是错误的。我们将按照自己的方式证明他们是错的。"
 thailand.220.t: "南方再次对游客开放"
 thailand.220.d: "自海啸将安达曼海岸的沙滩封闭、仅限维修人员进入以来，已过去两年，如今最后一个度假胜地也已重新开放。泰国旅游局开展了一场精心策划的复苏宣传，而预订数据表明成效显著。南方已经回来了。"
 thailand.220.a: "泰国继续开放。"
 thailand.221.t: "南方重建已完成"
 thailand.221.d: "国际援助团队与政府工程师已完成沿海基础设施重建计划。道路已重建，渔港码头已修复，电网已恢复。援建伙伴已获致谢，脚手架正在拆除。"
 thailand.221.a: "南方再度屹立。"
 thailand.222.t: "全球金融危机"
 thailand.222.d: "纽约雷曼兄弟的倒闭在亚洲市场引发了轩然大波。泰国的出口部门正密切关注其订单簿。对曼谷而言，问题在于过去十年建立起来的金融缓冲是否能够经受住考验，又或是这场海啸会穿透防波堤。"
 thailand.222.a: "泰国经受住了风暴。我们的谨慎得到了回报。"
 thailand.222.b: "风暴已至。我们必须为艰难的两年做好准备。"
 thailand.223.t: "三百七十七"
 thailand.223.d: "在枢密院的阅览室和军事情报部门的走廊里，分析人员正在处理选举结果。三百七十七个席位。一党独大。这是泰国民主史上前所未有的授权，而旧体制对此没有任何可靠的反制手段，至少现在无计可施。"
 thailand.223.a: "乡村已经发声。至少暂时如此。"
 thailand.224.t: "稻米清算之时"
 thailand.224.d: "世界米价并未如人所愿。全球供应过剩使政府手中积压着数百万吨以远高于市价购入的库存稻米，而原本预期用于补贴该计划的套利收益并未实现。财政部已将三个选项摆上台面，其中两个在政治上可行。"
 thailand.224.a: "承受损失，并从国库中弥补缺口。"
 thailand.224.b: "让计划破产，现在承担政治后果。"
 thailand.225.t: "公路到村"
 thailand.225.d: "戴安全帽的部长们为横贯呵叻高原的新公路和伸入北部山谷的铁路支线剪彩。各府行政机构在那些向来只向首都输出劳动力的城镇中开门办公。这一次，发展终于回到了那些创造压倒性胜利的民众身边。"
 thailand.225.a: "核心地带得到了回报。"
 thailand.226.t: "拉玛十世国王的统治"
 thailand.226.d: "国丧之年行将结束。新国王的治国之道与先王不同——更频繁地公开亮相、更紧地掌控王室资产，以及一种不同风格的皇家魅力。曾服务于第九世王朝的那套网络，必须学会服务于第十世。这已不是同一套网络了。"
 thailand.226.a: "王国步入新纪元。"
 thailand.227.t: "老兵反对"
 thailand.227.d: "征兵逐步取消的公告引发了退役军官和退伍军人协会的协同反应。军营里，资深士官抱怨军队被“掏空”。媒体刊登老将军们身着全套礼服、神情不悦的照片。政府对此早有预料，但反弹的幅度超出了预测。"
 thailand.227.a: "坚定立场。改革是正确的。"
 thailand.227.b: "举办退伍军人表彰仪式，并象征性地吸纳批评意见。"
 thailand.228.t: "旅游红利"
 thailand.228.d: "开放天空协议后的第一个季度已经结束。旅游局的数据表现强劲。入境人数增长了百分之十二，日均消费增长了百分之十九，而受益于新的低成本航空公司航线最多的南部度假区，报告了十年来最好的季度业绩。"
 thailand.228.a: "泰铢在流动。"
 thailand_news.13.t: "泰国，亚洲之门户"
 thailand_news.13.d: "泰国政府已正式宣布其南部基础设施走廊——无论是运河还是陆桥——将以“公平条件向所有国家开放”。国际投资已开始流入南部经济区，曼谷正接待来自十二个国家的代表团，它们正寻求优惠过境安排。"
 thailand_news.13.a: "微笑之地掌控航道。"
 thailand.250.t: "政府退缩"
 thailand.250.d: "罢工使国家停滞太久，当权者已难以承受其代价。码头、铁路、各部委——一切停摆，街头属于这场运动。内阁不愿赌上军队向自己人民开火的可能，于是打开了谈判之门。这是一条以胆识而非步枪赢得的和平夺权之路。"
 thailand.250.a: "我们赢得了街头。现在我们要赢得国家。"
 thailand.259.t: "军队恢复秩序"
 thailand.259.d: "罢工持续了许久，却始终未能彻底击垮政府的意志，而最高指挥部的耐心最先耗尽。坦克驶上大道，罢工领袖正被围捕，宵禁已生效。这场革命在尚未夺取权力之前便被粉碎，军人如今以秩序之名统治。红色道路自此封闭。"
 thailand.259.a: "革命跌的粉碎。"
 thailand.251.t: "The World Recoils"
 thailand.251.d: "Thailand's new government has announced itself to the world. Washington's response arrived before the ink dried on the party's founding documents. Economic sanctions, a frozen aid pipeline, and a statement from the State Department that managed to be both condescending and threatening. Beijing and Hanoi, by contrast, have sent congratulations."
 thailand.251.a: "Let them sanction us. We did not make this revolution for their approval."
 thailand.252.t: "The Royalists Depart"
 thailand.252.d: "The land reform has answered the question that polite Bangkok society preferred not to ask. Those who built their wealth on the old system, the absentee landlords, the investment network around the palace, the provincial families who held ten thousand rai in each of their children's names, have made their choice. Most of them are already on planes to Singapore, London, and Los Angeles."
 thailand.252.a: "A country is not its landlords."
 thailand.253.t: "The Chakri Dilemma"
 thailand.253.d: "The Chakri dynasty has ruled Siam and Thailand for over two centuries. The institution of the monarchy, whatever one thinks of the individuals who held it, is woven into the civil calendar, the legal system, the geography of Bangkok, and the emotional architecture of a significant portion of the population. The party must decide what it will do with it.\n\nThe party's commitment to the revolution's goals is not in question. The only question is whether a clean break or a managed transition serves them better."
 thailand.253.a: "Abolish the monarchy. It has no place in a people's republic."
 thailand.253.b: "Keep a constitutional figurehead while the party governs."
 thailand_news.14.t: "The Bamboo Curtain Falls"
 thailand_news.14.d: "Thailand has formalized its alignment with Laos and Vietnam in a regional solidarity framework that analysts are already calling the 'Bamboo Curtain.' For the first time since Pol Pot's Cambodia, a Southeast Asian government has declared a communist bloc orientation. Western capitals are recalculating. Beijing is welcoming. The Thai baht has been replaced with a new currency overnight."
 thailand_news.14.a: "The map of Southeast Asia has changed."
 thailand_news.31.t: "The Countryside Surrounds the City"
 thailand_news.31.d: "After years of insurgency dismissed by Bangkok as a remnant of a dead war, the Communist Party of Thailand has declared open people's war. Base areas across the northern highlands and the Isaan plateau are now beyond the reach of the security forces, and recruits are streaming in from villages the state long ago stopped serving. Military analysts who counted the movement out are quietly revising their assessments."
 thailand_news.31.a: "The hills are theirs now."
 thailand_news.32.t: "Thailand Joins the Dragon's Wake"
 thailand_news.32.d: "Bangkok has signed a sweeping partnership with Beijing. It brings investment, trade access, and a security understanding that places revolutionary Thailand firmly within China's orbit. State media calls it the natural alignment of two socialist neighbors. Western diplomats call it a satellite acquiring a sun. The construction cranes rising over Bangkok suggest the money, at least, is real."
 thailand_news.32.a: "The orbit is set."
 thailand_news.33.t: "A Federation of the Three Rivers"
 thailand_news.33.d: "Thailand, Laos, Vietnam and Cambodia have announced a framework for an Indochinese socialist federation, with Bangkok as its industrial and diplomatic heart. For the first time, the revolutions of the Mekong speak with one voice, and that voice is loud enough that the great powers must answer it rather than ignore it. Whether four proud capitals can share one project remains the open question."
 thailand_news.33.a: "Indochina speaks as one."
 thailand.260.t: "The Red Shirts Take Ratchaprasong"
 thailand.260.d: "The rural vote has come to Bangkok. Tens of thousands of red shirts have occupied the Ratchaprasong intersection, the commercial heart of the capital, and put up barricades of sharpened bamboo and stacked tires. The malls are closed, the traffic is stopped, and the movement says it will stay until the government calls an election. The army is waiting on the word."
 thailand.260.a: "Let them stay. The city can survive an occupied intersection."
 thailand.260.b: "Clear the intersection. The capital cannot stay shut indefinitely."
 thailand.270.t: "The Kingmaker"
 thailand.270.d: "Anutin Charnvirakul's party holds the decisive bloc in the new parliament. His price for coalition entry is not unreasonable, a handful of ministries, a commitment to rural development spending, and one very particular policy pledge. But coalitions always cost more than the initial offer suggests."
 thailand.270.a: "Form the coalition. The governing majority is worth the price."
 thailand.270.b: "Decline. We can govern without them, or not govern at all."
 thailand.271.t: "The Ministry of Ministries"
 thailand.271.d: "The cabinet-level negotiations are concluded. Bhumjaithai receives the Public Health Ministry, the Agriculture Ministry, and a deputy prime-ministership. The paperwork is signed, the coalition is official, and the horse-trading begins immediately."
 thailand.271.a: "The coalition holds. For now."
 thailand.272.t: "The Repeal Movement"
 thailand.272.d: "Conservative members of the coalition, and royalist-aligned civil-society groups outside it, have mounted a formal repeal campaign against the cannabis decriminalization act. They have enough signatures to force a parliamentary debate. The question is whether the government fights to preserve the policy or trades it for political peace."
 thailand.272.a: "Repeal the act. Stability is worth more than the Green Rush."
 thailand.272.b: "Stand firm. The policy stays. Let them take it to the courts."
 thailand.273.t: "An Offer from Bangkok"
 thailand.273.d: "Thailand extends its hand to the Shan. Recognition, arms, and a working treasury are on the table for a Shan state that aligns with the Kingdom. The autonomy would be real. So would the dependence that comes with it, and Naypyidaw will not forgive the choice."
 thailand.273.a: "Accept Bangkok's protection."
 thailand.273.b: "We will stand on our own."
 thailand.280.t: "First Win on the Road"
 thailand.280.d: "Chaiseri Metal and Rubber's First Win 4x4 has found buyers across the Association. Indonesian marine infantry, Philippine constabulary, a Malay border regiment. The first batch has shipped. The export agent's commission is smaller than the reputational dividend. Southeast Asia now knows Thailand makes things worth buying."
 thailand.280.a: "Sign the contracts. The ASEAN market is ours."
 thailand.281.t: "The Marines Train at Sattahip"
 thailand.281.d: "The Royal Thai Marine Corps' first dedicated amphibious exercise in a decade puts a battalion through beach-assault lanes at the Sattahip naval base. The new doctrine is written, the dockyard expansion is funded, and the Corps' commander has stopped apologising for the budget and started planning the next exercise."
 thailand.281.a: "From the sea."
 thailand_news.15.t: "Thailand, ASEAN's Emerging Arsenal"
 thailand_news.15.d: "A wave of defence export contracts signed in Bangkok this quarter has prompted regional analysts to reconsider Thailand's position in the Southeast Asian defence market. First Win MRAPs are in Philippine and Indonesian inventories, and Thai-manufactured artillery fuses are in Malaysian stockpiles. The Royal Thai Arsenal is no longer a domestic procurement program. It is a regional supplier."
 thailand_news.15.a: "The Kingdom's factories are working."
 thailand_news.16.t: "Bangkok Announces Multi-Domain Operations Doctrine"
 thailand_news.16.d: "The Royal Thai Armed Forces Supreme Command has published Thailand's first official Multi-Domain Operations doctrine, integrating cyber, electronic warfare, drone strikes, and conventional ground maneuver into a unified operational framework. Developed in joint exercises with American and Australian partners, the MDO doctrine signals that Thailand no longer conceives of warfare as a single-domain contest."
 thailand_news.16.a: "The Kingdom fights on every front."
 thailand.310.t: "The Reactor Goes Critical"
 thailand.310.d: "At 3.47 in the morning, the control room instruments climb through zero. Thailand's first pressurised water reactor has achieved criticality. The chief engineer calls it a technical milestone, and the cabinet calls it energy security. Both are correct. The national grid will look different by morning."
 thailand.310.a: "A new era of baseload power."
 thailand.311.t: "Phnom Penh Responds"
 thailand.311.d: "Cambodia's foreign ministry has replied to Bangkok's overtures, more formally than expected, more warmly than feared. The Phnom Penh government's calculation is clear. A close relationship with Thailand is a hedge against over-dependence on Beijing and a revenue stream that the region's fastest-growing economy can provide."
 thailand.311.a: "Welcome the partnership."
 thailand.311.b: "Engage cautiously. Progress takes time."
 thailand.312.t: "The Jakarta Dialogue"
 thailand.312.d: "Indonesia's delegation arrives without a joint communiqué drafted. Jakarta wants to know what Bangkok intends. A genuine partnership of regional equals, or a competition for the ASEAN leadership role that Indonesia has long considered its own? Both options are on the table. Neither is cheap."
 thailand.312.a: "Partnership. Joint exercises, shared doctrine, mutual gain."
 thailand.312.b: "Competition. We will out-influence Jakarta in its own neighborhood."
 thailand.313.t: "The Chinese Contract File"
 thailand.313.d: "The Finance Ministry's assessment is unambiguous. The infrastructure contracts signed under the BRI framework have delivered roads and rails that Thailand needed, but the financing terms embed Beijing's influence in the project pipelines for a generation. The question before cabinet is whether to continue drawing on Chinese capital or to absorb the short-term pain of renegotiation."
 thailand.313.a: "Keep the financing. The projects deliver."
 thailand.313.b: "Renegotiate. Sovereignty costs money."
 thailand.314.t: "Washington Requests a Review"
 thailand.314.d: "The U.S. Pacific Command has formally requested a bilateral security review. In practice, it is an invitation to deepen Thailand's treaty alignment, take the training packages, and accept the political visibility that comes with being America's most reliable Southeast Asian partner. The alternative is to maintain the hedge."
 thailand.314.a: "Deepen the alliance. Take the training and the commitment."
 thailand.314.b: "Distance. The hedge serves Thailand better."
 thailand_news.17.t: "Thailand Lights Its First Nuclear Reactor"
 thailand_news.17.d: "The Royal Thai Government has brought Thailand's first commercial nuclear power plant to full operation, becoming the first country in Southeast Asia to operate civilian nuclear power. The 600-megawatt pressurised water reactor, located in Chachoengsao Province, will supply roughly eight percent of national electricity demand. Analysts note the reactor's dual utility. It offers energy security and a new axis of technical prestige in a region where nuclear capability is increasingly a marker of middle-power ambition."
 thailand_news.17.a: "The Kingdom joins the nuclear age."
 thailand.315.t: "Landmine at Ta Muen Thom"
 thailand.315.d: "A landmine explosion near the disputed Ta Muen Thom temple complex has wounded three Royal Thai Army soldiers. Both sides accuse the other of planting it. The incident has set off nationalist protests in Bangkok and Phnom Penh."
 thailand.315.a: "Demand answers and mobilize nationalist sentiment."
 thailand.315.b: "Request ASEAN mediation and let the diplomats lead."
 thailand.316.t: "Shots Fired at Ta Muen Thom"
 thailand.316.d: "Skirmishes have broken out along the disputed border. Both governments are under pressure from their militaries and nationalist movements. The ASEAN Secretary-General has issued a statement calling for restraint."
 thailand.316.a: "Press the advantage."
 thailand.316.b: "Accept the ASEAN ceasefire."
 thailand.317.t: "The July War, Full Military Engagement"
 thailand.317.d: "Thai and Cambodian forces have clashed in a week-long border engagement near Ta Muen Thom and Preah Vihear. Artillery exchanges have caused casualties on both sides. ASEAN has convened an emergency summit."
 thailand.317.a: "Accept the ASEAN ceasefire after demonstrating strength."
 thailand.317.b: "Dig in and hold the gains."
 thailand.318.t: "Tensions Reignite at the Border"
 thailand.318.d: "Despite the ceasefire agreement, clashes have resumed along the disputed border. The December flare-up tests whether the two countries can hold their agreement or slide back into open conflict."
 thailand.318.a: "Reaffirm the ceasefire."
 thailand.318.b: "Resume hostilities."
 thailand.319.t: "Washington Says No to F-35"
 thailand.319.d: "The United States has declined Thailand's formal request for F-35 Lightning II fighters, citing technology transfer restrictions and concerns about Thailand's relationship with China."
 thailand.319.a: "Pursue the Gripen E/F program."
 thailand.319.b: "Accept the F-16V Block 70 instead."
 thailand.319.c: "Pivot to the J-10CE. Beijing will supply."
 thailand.320.t: "Paetongtarn Removed by Court"
 thailand.320.d: "泰国宪法法院因一段泄露的电话录音而解除总理佩通坦·钦那瓦的职务，录音中她似乎在破坏一个独立机构的运作。泰自豪党的阿努廷·查恩维拉库尔被任命为看守总理。"
 thailand.320.a: "Accept the verdict."
 thailand.320.b: "Challenge the ruling."
 thailand.321.t: "Anutin Takes the Helm"
 thailand.321.d: "Anutin Charnvirakul leads a caretaker government with People's Party confidence-and-supply support. He has promised new elections within four months."
 thailand.321.a: "The caretaker government begins its work."
 thailand.322.t: "Thailand Goes to the Polls, February 2026"
 thailand.322.d: "Thais vote in a general election that will shape the country's political direction for the next four years. The border war has driven nationalist sentiment toward Bhumjaithai. The People's Party leads in urban polling."
 thailand.322.a: "Bhumjaithai wins, and Anutin's mandate is confirmed."
 thailand.322.b: "The People's Party coalition takes power."
 thailand_news.18.t: "ASEAN Brokers Thai-Cambodian Ceasefire"
 thailand_news.18.d: "The Association of Southeast Asian Nations has successfully mediated a ceasefire agreement between Thailand and Cambodia, ending weeks of border skirmishes near the Ta Muen Thom temple complex. ASEAN's Secretary-General hailed the outcome as proof that regional institutions can contain bilateral flashpoints before they escalate to open war."
 thailand_news.18.a: "The region holds, for now."
 thailand_news.19.t: "Anutin's Party Dominates Thai Election"
 thailand_news.19.d: "Bhumjaithai has secured 193 seats in Thailand's February 2026 general election, delivering Anutin Charnvirakul a commanding mandate and ending months of caretaker uncertainty. The result consolidates Thailand's conservative-populist political center and sets the stage for a full four-year term."
 thailand_news.19.a: "A new mandate for the Kingdom."
 thailand.330.t: "The Soul of the Officer Corps"
 thailand.330.d: "A quiet argument runs through the General Staff. One faction wants a professional, apolitical army of competent technicians. The other wants a celebrated warrior caste, the pride and sword of the nation. The choice the Kingdom makes now will shape the officer corps for a generation."
 thailand.330.a: "Build a professional corps."
 thailand.330.b: "Cultivate martial prestige."
 thailand.334.t: "The Submarine Commissioned"
 thailand.334.d: "Years after the engine controversy, the first S26T boat is finally commissioned into the Royal Thai Navy. The crew has trained hard for this day. Whatever the politics of the procurement, Thailand now operates a modern submarine, and the regional balance shifts a little southward."
 thailand.334.a: "The fleet puts to sea."
 thailand_news.26.t: "Gripens over Bangkok"
 thailand_news.26.d: "The Royal Thai Air Force has taken delivery of its first JAS 39 Gripen multirole fighters, flying them in formation over the capital to mark the milestone. The Swedish-built jets give Thailand a genuine fourth-generation air-combat capability and a foothold in modern data-linked air warfare."
 thailand_news.26.a: "The Kingdom's skies are guarded."
 thailand_news.27.t: "Thai Arms on the World Market"
 thailand_news.27.d: "Thailand's new Defense Export Office has announced its first wave of overseas contracts. Armored vehicles, artillery, and munitions bound for buyers across Southeast Asia and beyond. The Kingdom's defence industry, once a budget line, is becoming an export earner."
 thailand_news.27.a: "Made in Thailand, sold to the world."
 thailand_news.28.t: "A Nation in Arms"
 thailand_news.28.d: "Bangkok has unveiled a total-defence program. It brings expanded reserves, civil-defence drills in every province, and a doctrine that treats the whole society as the last line of resistance. Critics call it militarization, and the government calls it prudence."
 thailand_news.28.a: "The whole nation stands ready."
 SIA_expansionism_threat: "Thai Expansionism"
 thailand.380.t: "Engineers at the Isthmus"
 thailand.380.d: "The feasibility commission's verdict is in. The cut is hard, but it is possible. The only question left is the one that has killed the project for a century, and that is who pays. Three foreign offers sit on the cabinet table beside the option of paying for it ourselves. Each carries a price that is not only measured in baht."
 thailand.380.a: "Take Beijing's Belt and Road financing. Cheap, fast, and we will worry about the terms later."
 thailand.380.b: "Choose Japan. Slower and dearer, but built to last and free of hidden clauses."
 thailand.380.c: "Bring in an international consortium. Phased, shared, and beholden to no single power."
 thailand.380.e: "Build it ourselves. The canal will be Thai to the last bollard."
 thailand.381.t: "Ground Broken"
 thailand.381.d: "The cofferdams are sunk, the first cubic meters of spoil are lifted, and the great cut at the Kra Isthmus has begun in earnest. The work will proceed in phases, each one a fresh test of the treasury's nerve."
 thailand.381.a: "Let the digging begin."
 thailand.382.t: "A Phase Complete"
 thailand.382.d: "Another stage of the canal is finished and signed off by the engineers. The cut is deeper, the works are further along, and the cabinet allows itself a moment of cautious pride before the next bill arrives."
 thailand.382.a: "On to the next phase."
 thailand.383.t: "Cost Overrun"
 thailand.383.d: "The latest phase has blown through its budget. Hard rock, a flooded gallery, and a contractor's revised estimate have left the project office asking the cabinet for a decision. Find the money, or accept that the canal will open later than promised."
 thailand.383.a: "Pour the money in and keep the schedule."
 thailand.383.b: "Accept the delay. The treasury comes first."
 thailand.384.t: "The Canal Is Ready"
 thailand.384.d: "The last lock gate is hung, the summit reach is flooded, and the pilots have run their first transits in ballast. The Kra Canal is complete in all but the ribbon-cutting. The Kingdom may now declare the megaproject finished."
 thailand.384.a: "Cut the ribbon and open the canal."
 thailand.385.t: "Sabotage at the Cut"
 thailand.385.d: "一座泵站爆炸，一条运输道路被切断——这些行动都带有泰南叛乱组织的标志。运河穿行于争议地区，而那些与曼谷为敌的人，已找到了一个足以登上头条的目标。项目办公室要求我们决策：是加强工程安保，还是与当地人谈判。"
 thailand.385.a: "Reinforce security along the corridor."
 thailand.385.b: "Negotiate with local leaders. Buy peace, not just guards."
 thailand.386.t: "Beijing Calls the Loan"
 thailand.386.d: "The overruns have tripped a covenant in the Belt and Road agreement, and Beijing's negotiators have arrived in Bangkok with a folder of options, all of them favorable to China. The yuan-denominated debt has become a lever, and the canal itself is the collateral. The cabinet must choose how to answer the call."
 thailand.386.a: "Concede an operating lease and let Beijing take a share of the tolls."
 thailand.386.b: "Restructure on harsh terms. Pay it down and keep the canal Thai."
 thailand.386.c: "Default. The canal is ours, so let the markets do their worst."
 thailand.388.t: "Capital Flight"
 thailand.388.d: "The default has spooked the markets. Foreign investors are pulling out, the baht is sliding, and the central bank is spending reserves to slow the panic. The damage is severe, but a sovereign that stood its ground will weather it, given time."
 thailand.388.a: "Ride out the storm."
 thailand.389.t: "Washington and Delhi Take Note"
 thailand.389.d: "A Chinese operating lease over the Kra has rung alarm bells from Washington to New Delhi. Both capitals fear a chokepoint in Beijing's pocket, and both are watching to see whether Bangkok will reassure them, or lean further east."
 thailand.389.a: "Reassure both and spend the political capital to keep them onside."
 thailand.389.b: "Lean into Beijing. The partnership is set, so let the West adjust."
 thailand.390.t: "The Strait Loses Its Monopoly"
 thailand.390.d: "The first laden tankers are transiting the Kra, and the great ports of the Malacca Strait are counting the cost. Singapore and Kuala Lumpur, who built their fortunes on the old chokepoint, watch their transit revenue drain north, and they will not soon forgive the Kingdom that drained it."
 thailand.390.a: "Two oceans answer to Bangkok now."
 thailand.391.t: "What Kind of Canal?"
 thailand.391.d: "The canal is open, but what is it to be? A fortress the navy holds by force, closed to rivals and bristling with batteries? Or a neutral international passage, open to all flags and guaranteed by treaty? The choice will define Thailand's place among the maritime powers for a generation."
 thailand.391.a: "Fortify the Kra to defend and deny it."
 thailand.391.b: "Open the Kra to all who pay the toll in peace."
 thailand_news.20.t: "Two Oceans, One Kingdom"
 thailand_news.20.d: "After years of labor, billions of baht, and a geopolitics no engineer could have foreseen, the Kra Canal is open. For the first time, ships pass between the Andaman Sea and the Gulf of Thailand without rounding the Malay Peninsula. The map of Asian trade has been redrawn, and Bangkok holds the pen."
 thailand_news.20.a: "A canal a century in the making."
 thailand.393.t: "Pariah of the Region"
 thailand.393.d: "The mask is off. Bangkok's drive to subjugate its neighbors has stripped away every pretence of ASEAN leadership. The capitals of Southeast Asia recoil, and the wider world recalculates. Thailand is no longer the region's chair. It is the region's threat, and the diplomatic and economic walls are already going up."
 thailand.393.a: "Let them fear us. Empire was never won by friends."
 thailand.394.t: "Washington Condemns Bangkok"
 thailand.394.d: "The United States has issued a sharp condemnation of Thai aggression in Southeast Asia. Washington signals that it will stand with the threatened states of the region, weighing guarantees and pressing its partners to close ranks against the would-be hegemon. The American influence Bangkok once courted is draining away."
 thailand.394.a: "American disapproval will not stop the march."
 thailand.395.t: "Beijing's Open Hand"
 thailand.395.d: "Where Washington recoils, Beijing leans in. China sees in an isolated, aggressive Thailand a useful partner, a power that has burned its bridges to the West and the region, and now has nowhere else to turn. Bangkok's pariah status is Beijing's opportunity, and the open hand comes with strings the Kingdom can no longer afford to refuse."
 thailand.395.a: "If the East will have us, so be it."
 thailand.431.t: "An Invitation from Bangkok"
 thailand.431.d: "Thailand has extended a formal invitation to join its Southeast Asia Treaty Organization. The pact offers shared command, mutual security, and a united regional voice under Bangkok's leadership. Yet ASEAN has always guarded its independence, and to bind our fate to Thailand is no small step. The choice is ours to make freely, and ours to unmake if it no longer serves us."
 thailand.431.a: "We accept. Our security is stronger shared."
 thailand.431.b: "We decline. Our independence is not for trading."
 thailand.425.t: "[FROM.GetNameDefCap]签署条约"
 thailand.425.d: "[FROM.GetNameDefCap]的答复是肯定的。他们的代表团正在前往曼谷签署协议的途中，东南亚条约组织将获得一个成员。每个签名都使下一个签名更容易获得。"
 thailand.425.a: "又多了一个座位。"
 thailand.426.t: "[FROM.GetNameDefCap]拒绝邀请"
 thailand.426.d: "[FROM.GetNameDefCap]已感谢我们的提议并婉拒了。他的语气很友好，但答案是否定的。这种约定不能强加于人，我们的大门依然敞开。"
 thailand.426.a: "Their choice. The offer stands."
 SIA_kra_fortress_threat: "Kra Canal Fortifications"
 SIA_kra_default_threat: "Thai Sovereign Default"
 SIA_kra_chokepoint_threat: "The Kra Chokepoint"
 SIA_asean_hegemon_threat: "Thai Bid for ASEAN Hegemony"
 thailand.410.t: "The Map of a Greater Kingdom"
 thailand.410.d: "The old maps are out again, the ones that show Lan Na, the Shan hills, the lost provinces of Cambodia and Laos and the Malay south as Thai by right. The Pan-Thai movement has a voice in the cabinet now, and it asks the question plainly. Shall the Kingdom proclaim its irredenta to the world, or pursue the same ends with a softer hand? Every great power is watching how Bangkok answers."
 thailand.410.a: "Proclaim it. These lands are Thai, and the world should know."
 thailand.410.b: "Quietly. We build the position without rattling the sabre."
 thailand.411.t: "One People, One Destiny"
 thailand.411.d: "The Pan-Thai idea is no longer a fringe romance of officers and historians. Rallies fill Sanam Luang, and the press carries the banners of a single Tai nation stretching from Yunnan to the Isthmus. The movement now has a public face, and the government chooses to give it one too."
 thailand.411.a: "Let the nation hear its own name."
 thailand.412.t: "Bamboo in the Wind"
 thailand.412.d: "Thailand bends but does not break. By refusing to choose between Washington and Beijing, Bangkok has kept both courting it, the bamboo diplomacy of old, practiced with a modern hand. Both capitals send warm signals, and neither can afford to push the Kingdom into the other's arms."
 thailand.412.a: "We keep our options open, and our friends guessing."
 thailand.413.t: "The Fuel-Cycle Question"
 thailand.413.d: "Thailand's new reactors run on a sovereign fuel cycle, and a sovereign fuel cycle means enrichment, and enrichment means the line between civilian power and a weapons option grows thin. The IAEA wants enhanced safeguards, Washington wants assurances, and the region wants to know what Bangkok intends. There is no bomb program on the books, but the capability is now within reach, and the Kingdom must decide how far to walk toward it."
 thailand.413.a: "Defy them. Sovereign enrichment is our right, hedge or otherwise."
 thailand.413.b: "Reassure them. Accept full safeguards and keep the trust."
 thailand.413.a_tooltip: "§RProliferation alarm.§! Thailand earns the named threat §YSovereign Enrichment Defiance§!, the United States turns sharply against Bangkok while India grows wary, and §RUS influence in Thailand falls by 15%§!."
 thailand.414.t: "The Guardians' Charter"
 thailand.414.d: "The constitution is rewritten so the watchmen need never sleep. Appointed councils, reserved powers, and a senate that answers to the barracks. The deep state is no longer an informal habit but a written guarantee. Order is assured, and the price is paid in the quiet death of unfettered politics."
 thailand.414.a: "Stability, made permanent."
 SIA_guardianship_cost_tt: "The international community recoils from the permanent entrenchment of the guardians.\n - §RTreasury -20§!\n - §RUnited States and United Kingdom opinion fall§!"
 thailand.415.t: "Pax Aseana"
 thailand.415.d: "From Manila to Jakarta, from Hanoi to Singapore, the capitals of Southeast Asia raise their glasses to Bangkok. Where once they feared a Thai bid for mastery, they now see a guarantor, a Kingdom that leads by trust, founds its pact on consent, and keeps the peace it promised. This is the Pax Aseana, and Thailand sits at its head not as a conqueror but as a partner."
 thailand.415.a: "A region at peace, and Thailand its keystone."
 thailand.416.t: "After the General"
 thailand.416.d: "The general has his premiership, his honeymoon, and his managed transition still ahead of him. The establishment can entrench itself further by packing the institutions and tightening the party's grip on the machinery of state, or it can read the room, institutionalize its gains, and step back into a more civilian-facing posture before the public patience runs out."
 thailand.416.a: "Entrench. The establishment tightens its hold."
 thailand.416.b: "Institutionalize. Consolidate the gains, soften the face."
 thailand.417.t: "The Eastern Engine Turns Over"
 thailand.417.d: "The cranes along the Eastern Seaboard never stop. New rail, new runways, new industrial parks. The Eastern Economic Corridor has reached take-off, and the investment is beginning to compound on itself. Chonburi, Rayong and Chachoengsao are becoming the engine room of the Thai economy."
 thailand.417.a: "The corridor hums to life."
 SIA_nuclear_defiance_threat: "Sovereign Enrichment Defiance"
 SIA_tsunami_warning: "Tsunami Warning Network"
 thailand.363.t: "The Productivity Trap"
 thailand.363.d: "The growth years are over. A generation left university into a stalled economy of stagnant wages, factory work shipped abroad, and a property market they will never enter. They are the best-educated cohort in Thai history and they are going nowhere, and they know exactly whom to blame. Bangkok's intersections fill with three-finger salutes, and the hashtags trend faster than the police can read them. Move Forward speaks their language. The slow comfortable politics of the past will not hold them."
 thailand.363.a: "Open the system. Concede the reform, let the new politics breathe."
 thailand.363.b: "Order first. Clear the streets and change the subject to the nation."
 thailand.363.c: "Buy time with growth. Pivot to stimulus and ease the squeeze."
 thailand.364.t: "Two Thailands"
 thailand.364.d: "There are two countries inside the kingdom. One is Bangkok and the provincial capitals, the graduates, the office towers, the cafés where reform is a foregone conclusion. The other is the rice belt and the north-east, where the populists built their machine on village funds and rice subsidies and never let go. They want different things, fear different futures, and vote for different parties. A government must choose where it plants its flag, or pretend it can stand above the line entirely."
 thailand.364.a: "Court the capital and the graduates, Thailand's urban future."
 thailand.364.b: "Court the rice belt, the up-country base that delivers."
 thailand.364.c: "Stand above the divide. Only the throne unites the two Thailands."
 thailand.365.t: "The Crackdown's Echo"
 thailand.365.d: "Clearing the streets did not clear the grievance. It sharpened it. The movement that scattered has regrouped, larger and angrier, its leaders now martyrs and its demands now non-negotiable. What was a protest is becoming a generation's defining cause, and every baton swung last year recruited ten more this year."
 thailand.365.a: "There is no putting this back. Ride out the storm."
 thailand.418.t: "The Jungle Stirs"
 thailand.418.d: "The misery has gone on too long. In the up-country districts the state forgot, old names surface again. Cadres who carried rifles for the Communist Party of Thailand before the amnesty, now grey but not forgotten, and a generation of their grandchildren with nothing left to lose. Study circles meet by lamplight, and the red flag, folded away for forty years, is being shaken out. The jungle that swallowed the last insurgency is still there. So is the grievance that filled it."
 thailand.418.a: "Let the cells organize. The countryside is ours to lose."
 thailand.418.b: "Crush the underground. Round up the cadres before this spreads."
 thailand.418.c: "Drain the swamp of grievance. Pour money into the districts."
 thailand.74.t: "The Assets Case"
 thailand.74.d: "The Constitutional Court weighs whether the Prime Minister concealed share holdings behind his housemaid, driver and security guard. A guilty verdict ends the premiership before it begins. The judges are split, and the palace, the press and the generals are all watching how the verdict is reached."
 thailand.74.a: "Lean on the bench. The verdict will go our way."
 thailand.74.b: "Submit to the process and let the court decide."
 thailand.75.t: "Tak Bai"
 thailand.75.d: "In the Muslim deep south, soldiers stack hundreds of bound protesters into army trucks. By the time the convoy arrives, eighty-five are dead, most of them suffocated. The footage circles the world. The officer corps closes ranks around its own, and the question is whether the civilian government will dare to ask what happened."
 thailand.75.a: "Stand behind the army. No inquiry."
 thailand.75.b: "Order an inquiry. The army answers to us."
 thailand.76.t: "The CTX Scanners"
 thailand.76.d: "The bill for the new airport's bomb-detection scanners has tripled, and the markup has vanished into a chain of middlemen close to the cabinet. An honest audit would embarrass the government. Burying it banks the difference but feeds the gathering story of an administration that treats the treasury as a family account."
 thailand.76.a: "Bury the audit and bank the difference."
 thailand.76.b: "Cancel the contract and cut the losses."
 thailand.77.t: "Silencing the Critics"
 thailand.77.d: "A media mogul's nightly broadcasts have become a rallying point for the anti-government street, and the independent broadcaster iTV is slipping the leash. Defamation suits, license pressure and friendly ownership could bring them to heel, at the price of confirming everything the critics say about creeping one-man rule."
 thailand.77.a: "Bring the press to heel."
 thailand.77.b: "Let the press run and answer words with words."
 thailand.78.t: "A Parliament of One"
 thailand.78.d: "The ruling party has won an outright majority, the first single-party government in Thai history. With no coalition to manage and the independent agencies packed with loyalists, the Prime Minister can govern unchecked. To the rice belt it is a mandate, and to the Bangkok establishment and the barracks it is an elective dictatorship in the making."
 thailand.78.a: "Govern unchecked. The people gave us this."
 thailand.78.b: "Court the opposition and share the table."
 thailand.73.t: "The Shin Corp Sale"
 thailand.73.d: "The Prime Minister's family sells its telecoms empire to a Singaporean state fund for some seventy-three billion baht, and, through a convenient restructuring, pays not a satang in tax. The legality is impeccable, but the optics are catastrophic. Within days the yellow-shirted crowds fill the avenues, and the army begins to ask aloud whether the constitution still binds the man who sold a national asset tax-free."
 thailand.73.a: "Pocket the billions. It was all legal."
 thailand.73.b: "Pay the tax and defuse the fury."
 thailand.420.t: "A Populist Mandate"
 thailand.420.d: "Power has passed to the populist camp. The rice belt and the urban poor have their government again, and with it the Thaksinist program of village funds, cheap healthcare, and a leader who speaks their language. The old establishment's spirits no longer hold, and the palace network and the reform caucus melt away as the new machine takes the levers. The barracks, as ever, are watching."
 thailand.420.a: "The countryside has its government."
 thailand.421.t: "The Establishment Returns"
 thailand.421.d: "The levers have passed to the royalist establishment, whether by ballot, palace bargain or the tanks at dawn. The network monarchy reasserts itself. The privy councilors, the generals and the great houses close around the throne. The populist machine's spirits dissolve along with its mandate, and the reform movement is swept from the table. The realm steadies under familiar hands."
 thailand.421.a: "The realm is in order."
 thailand.422.t: "The Reform Wave"
 thailand.422.d: "A new generation has taken power. The reform movement that marched in the streets now sits in the cabinet, and the agenda turns to dismantling the old order, the conscription, the monopolies, the untouchable institutions. The previous government's spirits fade as its leaders fall away. The question is whether the establishment will let the experiment run."
 thailand.422.a: "The future is now."
 thailand.423.t: "The Court Decides"
 thailand.423.d: "The Constitutional Court has the ruling party in its sights. A dissolution order is drafted and the executive could be unseated by judicial fiat, as so many before it. The government can bow to the verdict and hand power to its rivals, or defy the bench and dare the consequences."
 thailand.423.a: "Accept the verdict and step aside with grace."
 thailand.423.b: "Defy the court. We answer to the voters, not the judges."
 thailand.424.t: "The Democrats Endure"
 thailand.424.d: "Power has returned to the Democrat Party, the oldest in the Kingdom, whether by a turn at the ballot box or a court that handed the executive to the opposition. No landslide, no charismatic billionaire, just the patient, unglamorous business of governing as a broad civilian coalition, staking the future on institutions rather than a single leader. The previous government's spirits dissolve along with its mandate. And out in the rice belt, Thaksin's machine is already gathering its strength for the next round."
 thailand.424.a: "The establishment holds the line."
 thailand.430.t: "What Are the Bombs For?"
 thailand.430.d: "The first Thai warheads are real, but a weapon undeclared deters no one. The National Security Council must settle the question every nuclear state must answer. Under what circumstances would the Kingdom ever use them? The posture we declare will shape how the region, and the great powers, read our intentions."
 thailand.430.a: "Retaliation only. We strike only if struck with strategic weapons."
 thailand.430.b: "Tactical and strategic retaliation. We answer any nuclear attack in kind."
 thailand.430.c: "Declared first-use. Let our enemies wonder, and let them fear."
 thailand_news.30.t: "Thailand Joins the Nuclear Club"
 thailand_news.30.d: "Bangkok has confirmed what intelligence services had whispered for months. The Kingdom of Thailand possesses nuclear weapons. Capitals across Asia and beyond scramble to recalculate the balance of power as a new entrant crosses the threshold."
 thailand_news.30.a: "The map has changed."
 SIA_threat_thai_bomb: "Thailand's nuclear weapons program"
 SIA_threat_thai_enrichment: "Thailand's uranium enrichment program"
 SIA_threat_thai_first_use: "Thailand's declared first-use posture"
 thailand.432.t: "The Strategy Cannot Wait"
 thailand.432.d: "The workshop years made Thailand rich enough to stall, and the ministries have argued over the escape plan for too long. The frontier is not waiting, and Vietnam is closing the gap. The National Strategy has to be adopted now."
 thailand.432.a: "Adopt it by decree"
 thailand.432.b: "Build consensus first"
 thailand.433.t: "A Shield from the North"
 thailand.433.d: "Bangkok has asked Beijing to extend a formal guarantee over the Kingdom. A Chinese pledge would anchor Thailand's tilt toward the mainland and warn off any rival tempted to test its borders. The price is a standing commitment far from home."
 thailand.433.a: "Extend our protection"
 thailand.433.b: "Bangkok can stand alone"
 SIA_frontier_overextension_idea: "Frontier Overextension"
 SIA_frontier_overextension_idea_desc: "Divisions committed to the western marches are divisions not watching Bangkok. The Royal Thai Army is stretched thinner than the government cares to admit, and the public feels the strain of a commitment made before a shot was fired."
 SIA_regional_pariah: "Regional Pariah"
 SIA_regional_pariah_desc: "Bangkok swallowed the Burmese marches whole. Washington and Beijing condemn the land grab, ASEAN's capitals eye their own borders nervously, and Thai exporters pay for the kingdom's tarnished name in every contract abroad."
 SIA_frontier_partners: "Frontier Partners"
 SIA_frontier_partners_desc: "The recovered borderlands are governed through clients and compacts rather than occupation. Soft power is cheaper than garrisons. Administration runs lean and the construction crews move freely, with none of the diplomatic backlash annexation would have brought."
 SIA_kings_moral_authority: "The King's Moral Authority"
 SIA_kings_moral_authority_desc: "Seven decades on the throne have given the monarch a moral standing no politician approaches. In moments of crisis, a word from the palace has settled what armies could not."
 SIA_royal_guidance_idea: "Under the Royal Gaze"
 SIA_royal_guidance_idea_desc: "The palace's annual guidance steadies the kingdom and walls it off from foreign meddling, but an elected government that defers to the throne finds its own writ runs only so far."
 SIA_three_pillars_idea: "Nation, Religion, King"
 SIA_three_pillars_idea_desc: "Official nationalism welded to the throne and the Sangha. The Buddhist majority is bound tight against subversion and foreign ideas, at the price of a duller, more deferential public mind."
 SIA_deep_south_grievance: "Grievance in the South"
 SIA_deep_south_grievance_desc: "In the Malay-Muslim provinces, a Buddhist-Royalist creed lands as exclusion. Patani's grievances harden, and Bangkok pays in stability and political capital to keep the lid on."
 SIA_scarred_coast: "The Scarred Coast"
 SIA_scarred_coast_desc: "Without state money behind the rebuild, the Andaman resorts stand half-ruined for years. The hotels are quiet, the rubble uncleared, and the tourists go elsewhere."
 SIA_new_reign_mourning: "A Kingdom in Mourning"
 SIA_new_reign_mourning_desc: "The nation mourns the late King. Public life is subdued, entertainment suspended, and politics observes an uneasy truce."
 SIA_ninth_reign_barami: "Barami of the Ninth Reign"
 SIA_ninth_reign_barami_desc: "King Bhumibol has reigned for over half a century, longer than any monarch on earth. His barami, the moral authority earned across those decades, stands above every politician and general. In a moment of crisis a word from the palace settles what no cabinet can, and the throne shields the kingdom from foreign designs."
 SIA_ninth_reign_zenith: "The Network Monarchy Ascendant"
 SIA_ninth_reign_zenith_desc: "The palace no longer merely reigns. Through the Privy Council, the courts, and a web of loyal officers and businessmen, the Crown reaches into every institution of state. The King's word carries the weight of law, dissent finds no purchase, and foreign influence breaks against a wall of royalist consensus."
 SIA_tenth_reign_barami: "Barami of the Tenth Reign"
 SIA_tenth_reign_barami_desc: "The throne has passed to King Vajiralongkorn, but reverence is not inherited. The new monarch holds the office his father held without the moral authority that once filled it. The palace still steadies the realm and guards against foreign meddling, yet every lever is a fainter echo of the Ninth Reign."
 SIA_two_thailands: "Two Thailands"
 SIA_two_thailands_desc: "There are two countries inside one border. Bangkok and the central plains hold the wealth, the ministries, and the old establishment. The rural North and Northeast hold the votes and a hardening conviction that their ballots are stolen by courts and coups. The gulf between them polarises every election and forces the treasury to buy a peace it can barely afford."
 SIA_three_pillars_start: "Nation, Religion, King"
 SIA_three_pillars_start_desc: "$SIA_three_pillars_idea_desc$"
 SIA_populist_machine: "The Populist Machine"
 SIA_populist_machine_desc: "Village funds, healthcare cards, debt relief. A policy machine that converts government delivery into electoral loyalty, cycle after cycle."
 SIA_yellow_shirts_idea: "The Yellow Shirts"
 SIA_yellow_shirts_idea_desc: "The People's Alliance for Democracy is royalist, urban, middle-class, and convinced the electoral majority is being bought. When they fill the streets, governments wobble."
 SIA_red_shirts_idea: "The Red Shirts"
 SIA_red_shirts_idea_desc: "The United Front for Democracy Against Dictatorship is rural, northern and northeastern. They have won every election they contested and lost every government they formed. They are the majority, and they know it."
 SIA_junta_government: "Junta Government"
 SIA_junta_government_desc: "A military council governs by decree. Order is enforced, dissent is 'adjusted', and the question of when elections return is answered with a smile and a postponement."
 SIA_guided_democracy: "2017年体制"
 SIA_guided_democracy_desc: "An appointed Senate, a binding twenty-year strategy, and courts of reliable disposition. Elections are held, but the field is fenced."
 SIA_network_monarchy_idea: "Network Monarchy"
 SIA_network_monarchy_idea_desc: "Palace, privy council, army and judiciary form an informal web of authority that operates above electoral politics, and outlasts every government."
 SIA_reform_momentum: "Reform Momentum"
 SIA_reform_momentum_desc: "For the first time in a generation, the energy in Thai politics is with those who want to change the system, not manage it."
 SIA_consolidated_democracy_idea: "A Consolidated Democracy"
 SIA_consolidated_democracy_idea_desc: "Civilian control, constitutional government, and a public that expects coups to be history. Thailand's democratic institutions finally stand on their own foundations."
 SIA_republic_turmoil: "Constitutional Turmoil"
 SIA_republic_turmoil_desc: "The republic question has split every institution, every province and many families. The state endures, but the consensus underneath it is gone."
 SIA_pan_thai_irredentism: "Pan-Thai Irredentism"
 SIA_pan_thai_irredentism_desc: "The lost-territories narrative is state doctrine again. The Tai peoples are one nation, the 1893-1909 cessions are illegitimate, and history owes Thailand a correction."
 SIA_drug_war_stain: "International Censure"
 SIA_drug_war_stain_desc: "Thousands of extrajudicial killings during the drug war follow Thailand into every human-rights forum and every diplomatic negotiation."
 SIA_tourism_powerhouse: "Tourism Powerhouse"
 SIA_tourism_powerhouse_desc: "Tens of millions of visitors a year make tourism a pillar of the economy and the Thai brand a global asset."
 SIA_tourism_powerhouse_2: "Tourism Industrial Policy"
 SIA_tourism_powerhouse_2_desc: "Tourism graduates from a seasonal windfall into a managed pillar of state policy. A diversified, higher-spending visitor base pays real corporate tax and answers less to foreign travel conglomerates than it ever did."
 SIA_tourism_luxury_boom: "Luxury Travel Surge"
 SIA_tourism_luxury_boom_desc: "A wave of high-spending visitors is filling the five-star resorts and driving up receipts. The surge fades once the season turns."
 SIA_credit_boom_overheating: "Credit Boom Overheating"
 SIA_credit_boom_overheating_desc: "Cheap money flooded in faster than the banking system could absorb it, and borrowers are now paying the difference in higher rates. The pressure eases as the cycle cools."
 SIA_sustainable_extraction: "Stewarded Resources"
 SIA_sustainable_extraction_desc: "Permits move slowly and concessions stay narrow, but the state keeps a firmer hand on who profits from what comes out of the ground and answers less to the foreign capital that funds faster extraction elsewhere."
 SIA_digital_national_champions: "National Digital Champions"
 SIA_digital_national_champions_desc: "A handful of state-favored platforms dominate the market by design, easy to tax and simple to regulate, but comfortable enough in their position that they stop pushing to improve."
 SIA_detroit_of_asia_idea: "亚洲底特律"
 SIA_detroit_of_asia_idea_desc: "The Eastern Seaboard assembles pickups for the world. Automotive supply chains anchor Thai manufacturing and keep the export ledger healthy."
 SIA_bamboo_diplomacy: "Bamboo Diplomacy"
 SIA_bamboo_diplomacy_desc: "Bend with the wind, never break. Bangkok keeps the American alliance, the Chinese investment, and its own counsel, all at the same time."
 SIA_deep_south_insurgency: "Southern Insurgency"
 SIA_deep_south_insurgency_desc: "An armed separatist insurgency in the Malay-Muslim provinces of Pattani, Yala and Narathiwat. Its intensity rises and falls with the government's choices of force, development, or dialogue."
 SIA_war_on_drugs_campaign: "War on Drugs"
 SIA_war_on_drugs_campaign_desc: "Blacklists, quotas and shoot-to-kill ambiguity. The methamphetamine trade is in retreat, and so is the rule of law."
 SIA_deep_south_insurgency_1: "Southern Insurgency"
 SIA_deep_south_insurgency_1_desc: "$SIA_deep_south_insurgency_desc$"
 SIA_deep_south_insurgency_2: "Southern Insurgency"
 SIA_deep_south_insurgency_2_desc: "$SIA_deep_south_insurgency_desc$"
 SIA_deep_south_insurgency_3: "Southern Insurgency"
 SIA_deep_south_insurgency_3_desc: "$SIA_deep_south_insurgency_desc$"
 SIA_pacified_but_smoldering: "Pacified but Smoldering"
 SIA_pacified_but_smoldering_desc: "The Iron Fist worked. By the only measure the army accepts, the South is quiet. But a generation grew up under curfew and checkpoint, and the grievance has gone underground rather than away. The occasional incident still flares, and the wells of recruitment are not dry."
 SIA_royal_pacification: "Royal Pacification"
 SIA_royal_pacification_desc: "A managed, monitored calm held by patronage and presence under the royal aegis. Development flows, local notables are co-opted, and the monarchy's legitimacy in the South is quietly restored. Not a settlement, but a stewardship."
 SIA_pattani_autonomy: "Pattani Autonomy"
 SIA_pattani_autonomy_desc: "A self-governing special administration within a unitary Thailand, with an elected regional council, local-language schooling, and a share of southern revenue retained in the South. The peace dividend is real, and the precedent unsettles Bangkok's centralists."
 SIA_limited_devolution: "Limited Devolution"
 SIA_limited_devolution_desc: "The autonomy framework was watered down to placate the establishment. A measure of local administration, but no genuine self-rule. The guns are quiet for now, yet the settlement leaves both the South and the center dissatisfied."
 SIA_hearts_minds_education_strain: "Hearts & Minds Program"
 SIA_hearts_minds_education_strain_desc: "Malay-language schooling, religious outreach and village mediation are run out of the education budget. The incident map gets quieter, but the schools system carries the bill."
 SIA_southern_development_levy: "Southern Development Levy"
 SIA_southern_development_levy_desc: "The development push in the three provinces crowds civilian industry onto consumer output. The money flows south for a year, and the shelves at home feel it."
 SIA_peoples_constitution: "People's Constitution"
 SIA_peoples_constitution_desc: "A new basic law written with broad civic participation enshrines rights, civilian oversight of the military, and independent institutions, restoring public trust in the constitutional order."
 SIA_worlds_rice_bowl: "World's Rice Bowl"
 SIA_worlds_rice_bowl_desc: "Thai Hom Mali and Jasmine rice command premium prices on every continent. Agricultural export revenues anchor the current account, and every harvest season re-establishes Bangkok's diplomatic weight."
 SIA_bri_debt: "BRI Debt Exposure"
 SIA_bri_debt_desc: "Belt-and-Road infrastructure loans fill gaps the budget cannot, but the repayment terms are written in Beijing. Thailand's fiscal sovereignty shrinks with each signed agreement."
 SIA_landslide_mandate: "Mandate of the People"
 SIA_landslide_mandate_desc: "A landslide victory has given the government a genuine popular mandate. The party machine is energized, the rural base mobilized, and the opposition on the back foot, but the generals are watching the numbers very carefully."
 SIA_ceo_state: "CEO State"
 SIA_ceo_state_desc: "The cabinet has become a boardroom and the ministries a holding company. Decisions move fast and accountability moves slower. The checks and balances are not gone. They are just being restructured."
 SIA_cult_of_the_ceo: "Cult of the CEO"
 SIA_cult_of_the_ceo_desc: "The premier has dispensed with the theatre of consultation. His approval ratings are a weapon, his critics are obstacles, and the party's internal procedures are whatever he says they are this week. The royal network is meeting rather more frequently than usual."
 SIA_dynasty_politics: "Dynasty Politics"
 SIA_dynasty_politics_desc: "钦那瓦这个名字如今已融合为一个王朝、一个品牌、一个庇护网络和一个继承计划，所有这些都归结于同一个家族之中。对党的忠诚和对家族的忠诚已经密不可分。"
 SIA_institutionalized_party: "Institutionalized Party"
 SIA_institutionalized_party_desc: "The movement has survived exile, two coups, and seventeen party dissolutions. It has become something more durable than any single leader, a genuine political institution with roots in every province."
 SIA_privy_council_idea: "Privy Council Network"
 SIA_privy_council_idea_desc: "General Prem Tinsulanonda's decades of alliance-building have produced a network that spans the senior military, the judiciary and the civil service. Its members receive no salary from the network. They do not need one."
 SIA_judicialization: "Politics of the Courtroom"
 SIA_judicialization_desc: "The Constitutional Court has become a political actor in its own right. Every petition is a weapon, and every ruling a victory for one faction and a wound to another. The opposition studies law to survive."
 SIA_isoc_network: "ISOC Network"
 SIA_isoc_network_desc: "The Internal Security Operations Command threads through every province, reporting to the army rather than elected ministers. Its intelligence grid makes the state's reach invisible, ubiquitous, and remarkably effective."
 SIA_crown_property_idea: "Crown Property Bureau"
 SIA_crown_property_idea_desc: "The palace's commercial arm holds stakes in land, banking, and insurance worth hundreds of billions of baht. The absolute monarchy is over. The economic monarchy is doing very well."
 SIA_uncle_tu_honeymoon: "The Prayuth Honeymoon"
 SIA_uncle_tu_honeymoon_desc: "Order restored, the PDRC off the streets, and a government with a twenty-year plan. For now, the public appetite for stability gives the new premier an unusual degree of tolerance."
 SIA_uncle_tu_fatigue: "Prayuth Fatigue"
 SIA_uncle_tu_fatigue_desc: "The prime minister who promised to make politics boring has succeeded, in the wrong way. The reform agenda is stalled, the promised election perpetually postponed, and younger Thais have begun to ask when exactly 'temporary' was supposed to end."
 SIA_reform_spring: "Reform Spring"
 SIA_reform_spring_desc: "A wave of civic energy has swept into the reform movement. New faces, new demands, and a mood on the streets that careers older politicians have not seen in a generation. The establishment is taking notice, not always pleasantly."
 SIA_youthquake: "Youthquake"
 SIA_youthquake_desc: "University campuses, social media feeds and street corners are crackling with political energy. Young Thais who have never voted are now running for office, staffing party offices, and raising money online. The technocrats in formation are better-educated than any generation before them."
 SIA_barracks_pushback: "Barracks Pushback"
 SIA_barracks_pushback_desc: "Senior officers have made clear, through retired intermediaries, pointed silences and barbed press briefings, that the pace of civilian reform is testing the military's institutional patience. The army still controls its own promotions, budgets and base assignments."
 SIA_thai_republic: "Thai Republic"
 SIA_thai_republic_desc: "The world's longest-surviving constitutional monarchy has made its transformation. A directly elected president, a fully sovereign parliament, and a constitution written without military veto. The change was not bloodless, but it held."
 SIA_mandate_recovery: "Mandate of Recovery"
 SIA_mandate_recovery_desc: "The government has declared economic reconstruction its first priority. Consumer costs are compressed and building programs accelerated. Every baht of productive investment carries the government's full backing for the next two years."
 SIA_mandate_order: "Mandate of Order"
 SIA_mandate_order_desc: "The government's opening play is stabilization before reform. Institutions reinforced, courts respected, and political drift suppressed. The gamble is that order, delivered convincingly, earns the trust reform later requires."
 SIA_mandate_outreach: "Mandate of Outreach"
 SIA_mandate_outreach_desc: "Diplomacy and trade are the government's announced priorities. Embassies are fully staffed, ministerial delegations frequent, and the Trade Ministry has been given an expanded budget and a direct line to the PM's diary."
 SIA_uneasy_compromise: "An Uneasy Compromise"
 SIA_uneasy_compromise_desc: "The generals sit in the cabinet and the politicians keep their mandate, a national government that holds the Kingdom together by sheer mutual mistrust. Stability is bought at the price of decisive action. Every ministry is watched, every initiative negotiated twice. The arrangement steadies the country (§G+5% stability§!) but smothers the government's freedom of maneuver (§R-10% political power gain§!) until the bargain runs its course."
 SIA_gfc_headwinds: "Global Financial Crisis Headwinds"
 SIA_gfc_headwinds_desc: "The collapse of Western credit markets has slowed Thai export orders and tightened trade finance. Consumer goods prices creep upward and trade volumes contract. The storm is not Thailand's fault, but the economy will feel it for two years."
 SIA_coup_risk_modifier: "Coup Risk Pressure"
 SIA_coup_risk_modifier_desc: "Elevated coup risk weighs on political stability and suppresses political power accumulation. The higher the risk, the heavier the drag. Every point on the risk meter is felt in the government's ability to govern."
 SIA_coup_tier_watchful: "Barracks Watchful"
 SIA_coup_tier_watchful_desc: "The generals are content, for now. They read the newspapers, count the budget lines, and keep their counsel. No penalty, but the meter is climbing or falling with every choice the government makes.\n\n§YCoup Risk§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_coup_tier_restless: "Barracks Restless"
 SIA_coup_tier_restless_desc: "Pointed editorials in the army-owned press, retired officers grumbling on the talk shows, a cabinet shuffle the high command was not consulted on. The mood in the messes has soured. Govern cleanly or buy them back before it gets worse.\n\n§YCoup Risk§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_coup_tier_plotting: "Generals Plotting"
 SIA_coup_tier_plotting_desc: "Unusual troop rotations, dinners the prime minister was not invited to, the palace receiving visitors in uniform. Everyone in Bangkok can read the signs. The government can still pull back from the brink, but the window is closing.\n\n§YCoup Risk§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_coup_tier_tanks: "Tanks Warming Up"
 SIA_coup_tier_tanks_desc: "The columns are fuelled and the broadcast script is written. The high command is one provocation away from rolling on Government House. Pull coup risk back below 70, and fast, or the §RReassure the High Command§! mission runs out and the tanks come.\n\n§YCoup Risk§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_rice_pledge: "Rice Pledge Program"
 SIA_rice_pledge_desc: "The government guarantees farmers above-market prices for their rice harvest and holds the strategic stockpile. Rural incomes rise, and the treasury's exposure to global commodity prices rises with them."
 SIA_red_shirts_mobilized_idea: "Red Shirts on the March"
 SIA_red_shirts_mobilized_idea_desc: "The rural network is mobilized and in the streets. Mass demonstrations in Udon Thani, Khon Kaen and the outskirts of Bangkok rally the base, and convince the palace and the high command that the elected government has lost control. Every march brings the reckoning with the army nearer."
 SIA_kings_moral_authority_2: "The New Reign"
 SIA_kings_moral_authority_2_desc: "The Tenth Reign has settled into authority, but it is a different authority. More visible, more commercial, more controversial than its predecessor. The moral weight of sixty years on one throne does not transfer in a single coronation."
 SIA_kra_mobilization: "National Mobilization for the Kra Canal"
 SIA_kra_mobilization_desc: "Every crane, excavator and engineering battalion the Kingdom can muster is committed to the Kra corridor. Consumer prices climb, political capital drains, and the government's approval rating bends under the weight, but the construction speed is extraordinary. This idea is removed when the canal is complete."
 SIA_kra_canal: "The Kra Canal"
 SIA_kra_canal_desc: "The canal that connects the Gulf of Thailand to the Andaman Sea makes Thailand the chokepoint of the world's second-busiest shipping lane. Tolls flow into the treasury, navies queue politely for transit rights, and Bangkok's opinion is now worth soliciting in every Asian capital."
 SIA_kra_debt_trap: "Belt and Road Debt"
 SIA_kra_debt_trap_desc: "The canal was cheap to start because Beijing paid for it. The repayment schedule is denominated in yuan, the collateral is the waterway itself, and every cost overrun deepens the obligation. Consumer prices drift up and political capital leaks away while the loan compounds in the background."
 SIA_kra_debt_serviced: "Debt Restructured"
 SIA_kra_debt_serviced_desc: "The loan has been renegotiated on harsh but survivable terms. The crisis is past, the canal is Thai, and the government has earned a measure of credibility for facing Beijing down at the bargaining table rather than the back room."
 SIA_kra_default_pariah: "Sovereign Default"
 SIA_kra_default_pariah_desc: "Thailand walked away from the Belt and Road loan. The canal is its own, but the international credit markets remember, trade partners hedge, and the price of capital is high for a country that has shown it will repudiate a debt when the politics demand it."
 SIA_kra_lease_concession: "Beijing's Lease Concession"
 SIA_kra_lease_concession_desc: "To settle the debt, a long-term operating concession over part of the canal was conceded to a Chinese state enterprise. The Kingdom still flies the flag at the locks, but a share of every toll now sails to Beijing, and the world has noticed who really holds the lease."
 SIA_kra_capital_flight: "Capital Flight"
 SIA_kra_capital_flight_desc: "The default spooked the markets. Foreign capital is heading for the exits, the baht is under pressure, and the central bank is burning reserves to slow the bleeding. The shock is severe but temporary, and confidence will return once the dust settles."
 SIA_kra_delay: "Construction Delay"
 SIA_kra_delay_desc: "Rather than pour more money into a phase that ran over budget, the government accepted a slower schedule. Building speed suffers and the optics are poor, but the treasury is spared the worst of the overrun."
 SIA_kra_canal_sovereign: "The Sovereign Canal"
 SIA_kra_canal_sovereign_desc: "Built without a foreign creditor or a foreign clause, the canal is Thai to the last bollard. The premium paid for absolute sovereignty buys a deeper naval-industrial base, a stronger toll regime, and a national prestige no concession could ever match."
 SIA_kra_fortress: "Fortress Canal"
 SIA_kra_fortress_desc: "Coastal batteries, hardened bunkers, and a permanent naval garrison make the Kra a waterway the Royal Thai Navy can hold by force. The fleet sharpens its skills guarding the chokepoint, but the militarized passage costs Bangkok a little goodwill among the shipping lines."
 SIA_kra_neutral_transit: "Neutral Transit Regime"
 SIA_kra_neutral_transit_desc: "The Kra is open to all flags on equal terms, guaranteed by treaty and trusted by every maritime power. Traffic and goodwill flow in together. The tolls run high, the opinion of trading nations climbs, and the canal becomes a global common rather than a national weapon."
 SIA_red_revival: "Ghosts of the CPT"
 SIA_red_revival_desc: "The Communist Party of Thailand's cadres, the survivors of the 1970s struggle, their children, their students, have emerged from the margins. The party has political energy, a theory of history, and an appetite for power. It also has enemies, and its presence in the national conversation costs the country a few percentage points of stability every month it refuses to work within the existing system."
 SIA_general_strike_idea: "General Strike (Ongoing)"
 SIA_general_strike_idea_desc: "国家正被人为地瘫痪。港口、铁路、学校、医院仅靠最低限度的班次运转。罢工持续期间，稳定度每周下降1%。通过总罢工决议将势头推进至100，政府便宣告投降。若180天期限耗尽而势头不足，军队将接管政权。\n\n§R罢工势头§!: [?ROOT.SIA_strike_momentum|0]/100"
 SIA_western_sanctions: "Western Economic Sanctions"
 SIA_western_sanctions_desc: "The United States and its allies have imposed a sanctions package on Thailand following the change of government. Investment has frozen, trade finance has become difficult to arrange, and several bilateral agreements are suspended. The cost is real, and so is the political benefit of having a clear external enemy."
 SIA_asean_pariah: "Pariah of the Region"
 SIA_asean_pariah_desc: "Thailand's bid to subjugate its neighbors has made it a pariah across Southeast Asia and beyond. ASEAN partners have frozen Bangkok out of regional commerce, foreign capital has fled the aggressor, and the cost of every brick and barrel now reflects a kingdom at war with the region it once led. Isolation has a price, and the Thai economy is paying it."
 SIA_peoples_siam: "People's Solidarity Bloc"
 SIA_peoples_siam_desc: "Thailand has anchored itself in a regional alignment with Laos and Vietnam. The mutual recognition framework provides diplomatic cover, reduces isolation, and, for a country that just nationalized its major industries, provides the trading relationships that keep the shelves stocked. Mil-to-mil cooperation across the bloc is the foundation of a genuinely independent defence posture."
 SIA_green_rush: "The Green Rush"
 SIA_green_rush_desc: "Cannabis decriminalization has opened a new agricultural commodity market. Isaan farmers are diversifying, herbal product exporters are registering faster than the licensing agency can process them, and a corner of the Bangkok hospitality industry has quietly pivoted. Critics call it a social experiment. The treasury receipts call it revenue."
 SIA_war_plan_brm: "War Plan Burma"
 SIA_war_plan_brm_desc: "Thai operational planners have gamed the Salween campaign in detail. Infiltration corridors, logistics nodes, the Shan irregulars as a force multiplier. The plan is current, the staging infrastructure is in place, and the officer corps knows the terrain."
 SIA_war_plan_lao: "War Plan Laos"
 SIA_war_plan_lao_desc: "The Mekong crossings, the highland passes, the vulnerability of Vientiane to a thrust from the Nong Khai direction. The campaign plan exists in every operational binder from the 3rd Army HQ. Border infrastructure has been quietly upgraded to support a rapid advance."
 SIA_war_plan_cbd: "War Plan Cambodia"
 SIA_war_plan_cbd_desc: "The Preah Vihear corridor, the Dangrek scarp, the flat approaches to Siem Reap. Thai planners have drawn the operational boundaries and war-gamed the logistics three times. The staging state is ready."
 SIA_war_plan_may: "War Plan Malaysia"
 SIA_war_plan_may_desc: "1909年的边界线，只是一个规划上的约束条件，并非自然法则。一份标注为“机密”的红色文件夹中，存放着针对那拉提瓦通道和吉兰丹走廊的详细作战计划。泰南边境三府的基础设施投资，同时也是兵力集结的预备场地。"
 SIA_protector_of_the_realm: "Protector of the Realm"
 SIA_protector_of_the_realm_desc: "The Thai armed forces now anchor the occupation of the reclaimed frontier, holding order across the Shan, Lao, Khmer, and Malay ground won in the Pan-Thai wars while civil administration catches up. War weariness fades with victory secured, and pride in a reunified realm steadies the home front."
 SIA_comprehensive_security_idea: "Comprehensive Security"
 SIA_comprehensive_security_idea_desc: "The integrated national security framework reduces duplication between interior, defence, and intelligence agencies. Consumer overhead falls as coordination improves. The drift toward any external patron becomes measurably harder to engineer."
 SIA_cambodia_partnership: "Cambodia Partnership"
 SIA_cambodia_partnership_desc: "A structured bilateral relationship with Phnom Penh covers trade facilitation, joint development zones, and a diplomatic accord that positions Thailand as Cambodia's preferred economic partner. The influence flows in both directions, and the trade receipts flow in one."
 SIA_fuel_reserves: "Strategic Fuel Reserves"
 SIA_fuel_reserves_desc: "Three months of national fuel consumption held in strategic reserve, in distributed tank farms across all five regions. The stockpile smooths price spikes, provides crisis buffer, and signals to partners that Thailand's military logistics are not hostage to a single supply route."
 SIA_medical_tourism_boom: "Medical Tourism Boom"
 SIA_medical_tourism_boom_desc: "Word has spread. Bangkok's private hospitals are booked solid with foreign patients, and the convalescents stay on as tourists. The receipts and the arrivals build month after month, while the wards run hot and locals wait longer for a bed."
 SIA_aec_tailwind: "ASEAN Integration Tailwind"
 SIA_aec_tailwind_desc: "The trade-facilitation push is paying off across the region. Lower friction at the borders, deeper supply chains, Thai factories winning regional contracts. The export-led growth compounds over years, even as the adjustment squeezes consumer-goods capacity at home."
 SIA_arms_export_orders: "Defence Export Order Book"
 SIA_arms_export_orders_desc: "The order book is full. MRAPs, munitions, loitering drones and license-built systems ship to ASEAN buyers on a rolling schedule. The arms lines run at capacity and Thailand's standing as the region's preferred supplier deepens, at the cost of the diplomatic friction that arming the neighborhood always brings."
 SIA_royal_development_lands: "Royal Development Lands"
 SIA_royal_development_lands_desc: "Crown-sponsored projects have opened new land to cultivation and extraction and steadied the provinces they touch. The countryside is calmer and the resource base wider, though the works themselves draw down the nation's goods while they run."
 SIA_eec_construction_boom: "EEC Construction Surge"
 SIA_eec_construction_boom_desc: "The Eastern Economic Corridor is a live construction site, with cranes over the ports, rail beds graded, and factory shells rising. Building goes faster and output climbs, but the surge ties up consumer-goods capacity for the duration."
 SIA_asean_chair_spotlight: "ASEAN Chair Spotlight"
 SIA_asean_chair_spotlight_desc: "Bangkok holds the gavel and the cameras. The chairmanship buys easy goodwill and a cheaper diplomatic posture across the Association, for as long as the spotlight lasts."
 SIA_purge_disruption: "Anti-Graft Disruption"
 SIA_purge_disruption_desc: "The enforcement sweep has frozen procurement and put the patronage networks on edge. Contracting has seized up and the political machine is sulking. This is the price of a cleaner system, paid up front."
 SIA_army_wage_inflation: "Inflated Officer Payroll"
 SIA_army_wage_inflation_desc: "The favors bought the brass off, but the price was a bloated payroll. Officer salaries, allowances and ghost postings have been padded across the ranks, and the military wage bill will run hot until the budget is brought back to heel."
 SIA_chuan_leekpai_desc: "Veteran Democrat Party politician and elder statesman who served as Prime Minister from 1992 to 1995 and from 1997 to 2001. His second term carried Thailand through the Asian Financial Crisis on an IMF program. Known for his unimpeachable personal integrity in a system rife with corruption."
 SIA_thaksin_shinawatra_desc: "这位亿万富翁电信巨头创立了泰爱泰党，并在2001年大选中以压倒性优势获胜。他推行的民粹主义政策，例如30泰铢医疗保健计划和乡村发展基金，彻底改变了泰国农村的政治格局。2006年，他在军事政变中被推翻，之后通过多个代理政党在流亡期间继续统治泰国。"
 SIA_bhumibol_adulyadej_desc: "拉玛九世，却克里王朝第九位君主，也是世界上在位时间最长的国家元首。他作为团结象征的道德权威，在每一次政治危机中都发挥了作用。2016年10月，他的驾崩结束了长达70年的统治，也开启了举国上下深切哀悼的时期。"
 SIA_vajiralongkorn_desc: "拉玛十世，玛哈·哇集拉隆功，于2016年其父去世后登基。他直接掌控王室资产和皇家卫队，并比其前任更多地介入政治事务。他的统治时期恰逢泰国宪政史上最为动荡的时期。"
 SIA_abhisit_vejjajiva_desc: "这位毕业于牛津大学的民主党领袖，在2008年宪法法院解散人民力量党后，通过议会投票成为总理。他的政府主导了2010年4月至5月在曼谷对红衫军抗议者的镇压。"
 SIA_yingluck_shinawatra_desc: "为泰党领导人、他信·钦那瓦的妹妹，在2011年7月的大选中以2001年以来最大的多数票获胜。她的政府推行了“大米质押”计划，该计划后来演变成一场重大的腐败丑闻。2014年，她被宪法法院罢免，并在刑事判决前逃离泰国。"
 SIA_prayut_chanocha_desc: "泰国皇家陆军司令，领导了2014年5月泰国第十二次政变，并在全国维持和平秩序委员会军政府和公民力量党领导下担任了九年总理。他是2017年宪法混合成员比例代表制的制定者，该制度旨在瓦解反对党。"
 SIA_sonthi_boonyaratglin_desc: "这位陆军司令在2006年9月发动政变，推翻了当时正在海外访问的总理他信·钦那瓦。他担任国家安全委员会主席，直至过渡文官政府成立。之后，他以小党派领导人的身份进入选举政治。"
 SIA_anutin_charnvirakul_desc: "泰自豪党领袖，出身建筑业世家，曾任副总理，并因此声名鹊起。该党在军方和文职阵营之间巧妙的战略定位，使其在连续三届联合政府中都扮演了关键的“造王者”角色。2025年底，在宪法法院罢免佩通坦总理后，他出任代理总理。"
 SIA_pita_limjaroenrat_desc: "前进党领袖领导的政党在2023年5月的大选中以最高得票率获胜，却因军方任命的参议院阻挠而未能组建政府。随后，宪法法院解散了该党，并禁止他五年内参与政治活动。"
 SIA_natthaphong_ruengpanyawut_desc: "他是皮塔·林加伦拉特的继任者，成为重组后的人民党领袖，也是曼谷最年轻的当选市长。他代表着泰国进步政治的代际转变，转向地方治理、气候政策以及宪法改革。"
 SIA_songkhram_phaendin_desc: "他是泛泰学派的一位元帅，名字意为“土地之战”。他一路晋升，在军官队伍中不断宣扬1893年和1909年的割让是至今仍未愈合的伤口，只有军人统治的政府才能将其愈合。"
 SIA_somchai_ratchaphruek_desc: "他是一位经历过共产党丛林战争时期的老兵，姓氏源于金链花树。他熬过了清空集中营的大赦，回到东北继续组织工作，他认为革命失败的原因在于时机不对，而非目标不够明确。"
 SIA_banharn_silpaarcha_desc: "这位来自素攀武里府的泰国政党领袖兼建筑业赞助人，曾于1995年至1996年担任总理。他的政府在其家乡投入巨资兴建省级基础设施，以至于媒体戏称他为“行走的提款机”。然而，由于腐败指控以及1997年经济危机前夕出现的种种经济预警信号，该联盟在一年内便宣告瓦解。"
 SIA_chavalit_yongchaiyudh_desc: "新希望党创始人兼领导人，曾任泰国皇家陆军总司令，于 1996 年 11 月出任总理。他的政府执政期间，泰铢危机于 1997 年年中爆发，由于其政府未能控制住货币崩溃，他于同年 11 月迫于压力辞职。"
 SIA_thanathorn_juangroongruangkit_desc: "Auto-parts magnate who co-founded the Future Forward Party in 2018 and became the face of its youth-driven reform politics. His rapid rise alarmed the establishment. The Constitutional Court dissolved the party in February 2020 and banned him from office for a decade over a loan the party had taken from him personally."
 SIA_virot_paoin_desc: "A police lieutenant general who took the Pheu Thai leadership once Thaksin's line moved on, continuing the party's populist coalition from behind a uniform rather than a rally podium. His governing style leans on institutional loyalty within the police and civil service rather than the mass rural mobilization his predecessor built the party on."
 SIA_srettha_thavisin_desc: "Property-developer executive and Pheu Thai's 2023 prime ministerial candidate, who became Prime Minister that August in the party's return-to-power coalition with former rivals. The Constitutional Court removed him from office in August 2024 over an ethics breach tied to a cabinet appointment, one of the shortest tenures of any elected Thai premier in a decade."
 SIA_paetongtarn_shinawatra_desc: "他信·钦那瓦的小女儿，也是为泰党第三位钦那瓦家族成员出身的首相，于2024年8月就职，是该党为应对其前任被法院罢免而推出的首相人选。然而，她与柬埔寨首相洪森就边界争端进行的一次通话被泄露，导致她不到一年便失去了首相职位，也再次引发了人们对政府决策权在多大程度上仍受其父掌控的质疑。"
 SIA_greater_thailand_consolidated: "Greater Thailand Consolidated"
 SIA_greater_thailand_consolidated_desc: "The irredentist campaigns have concluded. The kingdom stands larger and stronger than before, its manpower reserves deepened, its industries emboldened, its people unified by shared sacrifice and shared victory. The state apparatus that waged war now drives construction."
 SIA_pax_aseana_idea: "Pax Aseana"
 SIA_pax_aseana_idea_desc: "Thailand leads a stable, coherent, and self-sufficient security bloc. Political capital flows in from allied capitals, and stability is reinforced by the knowledge that Bangkok will not stand alone, and neither will any ally. The region's peace is underwritten by Thai power."
 SIA_asean_defense_member: "SEATO Member"
 SIA_asean_defense_member_desc: "This nation chose to join Thailand's regional defense pact of its own accord. Shared command and a common purpose steady the home front and stiffen the defense. Bound by consent rather than coercion, its commitment to the community holds where a forced alliance would have crumbled."
 SIA_rally_round_flag: "Rally Round the Flag"
 SIA_rally_round_flag_desc: "The border incident has united the Thai public behind the armed forces. Nationalist sentiment is elevated and conscription queues are long, but the mood is volatile and the honeymoon will not last forever."
 SIA_anti_graft_idea: "Anti-Graft Enforcement"
 SIA_anti_graft_idea_desc: "An empowered National Anti-Corruption Commission has begun dismantling the procurement and customs networks that siphon revenue from the Thai state. Contractors compete on merit, and import duties flow to the treasury rather than to middlemen. For six months the campaign itself is a drag on political power, the price of running down entrenched interests."
 SIA_strait_patrol_posture: "Strait Patrol Posture"
 SIA_strait_patrol_posture_desc: "The Royal Thai Navy is running a heightened patrol rotation through the strait. Escorts shadow the shipping lanes, picket lines watch the approaches, and the fleet ranges farther from port while the posture holds."
 SIA_asean_security_pledge: "ASEAN Security Pledge"
 SIA_asean_security_pledge_desc: "Thailand has pledged itself as the shield of Southeast Asia rather than its conqueror. The first guarantees go out to neighbors who accept Bangkok's protection, and the diplomatic corps leans into the patient work of reassurance. Guarantees come cheaper, relations hold at lower cost, and the Kingdom's forces dig in to make the promise credible."
 SIA_protector_of_asean: "Protector of ASEAN"
 SIA_protector_of_asean_desc: "Thailand has chosen the role of guarantor rather than conqueror. By extending its security umbrella across Southeast Asia, the Kingdom earns the trust of its neighbors and the standing of a regional great power. A standing diplomatic corps now projects Thai influence into several ASEAN capitals at once, funded by the steady political capital the role commands. Diplomacy is cheaper, defence is firmer, and the goodwill of ASEAN flows toward Bangkok."
 SIA_frontier_buffer_idea: "Frontier Buffer States"
 SIA_frontier_buffer_idea_desc: "The Shan and Karen are kept armed and friendly as a living shield along the Burmese border. Cheaper guarantees, a steadier frontier, and a defensive edge against any push from Naypyidaw."
 SIA_shan_campaign: "Shan Campaign"
 SIA_shan_campaign_desc: "The army is mobilized and oriented for operations into South Shan State, with combat bonuses against Shan forces for the duration of the campaign."
 SIA_karen_campaign: "Karen Campaign"
 SIA_karen_campaign_desc: "Thai forces press into the Karen hills, with combat bonuses against Karen forces for the duration of the campaign."
 SIA_wa_campaign: "Wa Campaign"
 SIA_wa_campaign_desc: "Thai forces drive into the Wa hills against the UWSA, with combat bonuses against Wa forces for the duration of the campaign."
 SIA_us_mech_standard: "NATO-Standard Mechanization"
 SIA_us_mech_standard_desc: "American doctrine and Western vehicles bring superior organization, reconnaissance, and field reliability, at a price counted in the defence budget."
 SIA_reliability_woes: "Reliability Woes"
 SIA_reliability_woes_desc: "Cheap mass came with cheap support. Transmission failures and spare-parts backlogs sap morale and equipment reliability until the fleet is sorted out."
 SIA_chd620_teething: "Engine Teething Troubles"
 SIA_chd620_teething_desc: "The substitute Chinese powerplant runs hot and unproven. Until the bugs are worked out, the boats are slower and their crews less confident."
 SIA_bamboo_doctrine: "The Bamboo Doctrine"
 SIA_bamboo_doctrine_desc: "Friendly with all and beholden to none. Diplomatic flexibility, broad goodwill, and the domestic stability of a nation that refuses to pick a side."
 SIA_loyal_opposition: "The Loyal Opposition"
 SIA_loyal_opposition_desc: "Win or lose, the party endures. A century-old organization with roots in every province and a settled core of voters who do not drift with the political weather. It is the steadiest constituency in Thai politics, and the hardest for any rival movement, populist or palace, to pry loose."
 SIA_democratic_institutionalism: "Democratic Institutionalism"
 SIA_democratic_institutionalism_desc: "The rules now outlast the rulers. Independent courts, a working parliament, professional ministries and a public that expects power to change hands at the ballot box. Thai democracy has become a system rather than a season, and it holds against capture from the streets, the palace or the barracks."
 SIA_pt_tier_dormant: "Watching the Populist Tide"
 SIA_pt_tier_dormant_desc: "For now the rural vote holds and the Democrats govern in peace. But Thaksin's machine never truly sleeps. In the North and Northeast the old loyalties wait, ready to gather the moment the party in power looks complacent. Keep ahead of it with the constituency machine and the tide stays this quiet.\n\n§YPopulist Tide§!: [?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_pt_tier_rising: "The Populist Tide Rises"
 SIA_pt_tier_rising_desc: "Out in the Northeast the red banners are out again. Thaksin's machine is gaining, and a government that cannot answer it begins to look like a caretaker waiting to be voted out.\n\n§YPopulist Tide§!: [?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_red_shirt_encampment: "The Ratchaprasong Encampment"
 SIA_red_shirt_crackdown: "The Ratchaprasong Crackdown"
 SIA_red_shirt_encampment_desc: "Tens of thousands of red shirts hold the central Bangkok shopping district behind barricades of bamboo and tires. The malls are shut, the offices are empty and the business district has stopped working. The government has chosen to wait them out."
 SIA_red_shirt_crackdown_desc: "The army cleared the intersection with live rounds. The barricades are gone and so is the occupation, but the buildings are burnt, the police are costing more than they did, and the country has watched soldiers shoot civilians on television."
 SIA_pt_tier_surge: "A Populist Landslide Looms"
 SIA_pt_tier_surge_desc: "The polls are a rout in waiting. The red shirts are talking about coming to Bangkok, and a government that lets the tide reach 100 will find out whether they meant it.\n\n§YPopulist Tide§!: [?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_thaksin_ascendant: "Thai Rak Thai Ascendant"
 SIA_thaksin_ascendant_desc: "1997年的经济危机瓦解了旧政党，他信·钦那瓦凭借电信业的巨额财富、一支训练有素的政治机器以及北部和东北部乡村地区一代人期盼已久的承诺，填补了权力真空：廉价医疗、债务减免以及为每个村庄设立发展基金。随着时间的推移，农村选民逐渐聚集在他的泰爱泰党周围，而川的民主党则岌岌可危。\n\n每个月，泰爱泰党和更广泛的不结盟联盟都会从建制派选民那里获得约 2% 的支持，直到 2001 年的重新结盟才解决了这个问题。\n\n§Y距离清算之日还有数月§!：[?ROOT.SIA_thaksin_rise_months|0]/12"
 SIA_broad_coalition_idea: "A Broad Coalition"
 SIA_broad_coalition_idea_desc: "Ministries handed to the small parties and provincial bosses in exchange for a parliamentary firewall. Broad and stable, but every decision is a negotiation, and the cabinet moves at the speed of its most reluctant partner. The bargain is good for a year."
 SIA_mekong_soft_power_idea: "Mekong Soft Power"
 SIA_mekong_soft_power_idea_desc: "Thai banks, contractors and broadcasters carry Bangkok's influence up the Mekong. A louder voice in the neighborhood, and the diplomatic bandwidth to court one more nation at the same time."
 SIA_occupation_administration: "Occupation Administration"
 SIA_occupation_administration_desc: "Military governors, resettlement boards, and reconstruction offices now run the conquered provinces. Compliance climbs faster, armed resistance is ground down, and the roads and rails of integration go up more quickly. The apparatus of holding what the army took."
 SIA_deep_south_category: "泰南三府"
 SIA_deep_south_category_desc: "The Malay-Muslim provinces of Yala, Pattani and Narathiwat are in insurgency. Suppression, development and dialogue all have their advocates, and their costs.\n§YInsurgency Intensity§! (0-100) denotes the strength of the southern insurgency. A higher level means deadlier weekly incidents and a heavier drag on the South. Force, development and dialogue push it down. Atrocities and neglect push it up. Iron-Fist tactics leave a permanent §YGrievance Floor§! that intensity can never fall below.\n\n§YInsurgency Intensity§!: [?ROOT.SIA_insurgency_intensity|0]%\n§YGrievance Floor§!: [?ROOT.SIA_ds_intensity_floor|0]%"
 SIA_greater_thailand_category: "Greater Thailand"
 SIA_greater_thailand_category_desc: "The lost-territories program. Militias, claims and the integration of recovered lands."
 SIA_ds_security_operations: "Security Sweeps"
 SIA_ds_security_operations_desc: "Cordon-and-search operations across the southern provinces. Order improves while the operations last. Whether they end the insurgency or feed it is debated in every after-action report."
 SIA_ds_development_fund: "Southern Development Fund"
 SIA_ds_development_fund_desc: "Roads, schools and jobs for the poorest provinces in the country. Slower than soldiers, cheaper than war."
 SIA_ds_emergency_decree: "Emergency Decree"
 SIA_ds_emergency_decree_desc: "Special powers for the security forces in the southern provinces. Detention without charge, immunity provisions, curfews. Effective, and corrosive."
 SIA_ds_peace_dialogue: "Open Peace Dialogue"
 SIA_ds_peace_dialogue_desc: "Authorize formal talks with the separatist movement under Malaysian facilitation. Talking to them concedes they exist. It is also the only way this ends at a table."
 SIA_arm_shan_militias: "Arm the Shan Militias"
 SIA_arm_shan_militias_desc: "Quietly supply the Shan armies across the Burmese border. Every convoy buys influence over what Shan State becomes."
 SIA_shan_client_state: "Sponsor the Shan State"
 SIA_shan_client_state_desc: "Recognize and underwrite a Shan state aligned with Bangkok. Our brothers get their country, and we get its allegiance."
 SIA_integrate_shan: "Integrate the Shan Lands"
 SIA_integrate_shan_desc: "Extend Thai administration to the Shan plateau, bringing governors, schools, and the baht. The population must be sufficiently pacified before Bangkok can consolidate control."
 SIA_integrate_laos: "Integrate the Lao Lands"
 SIA_integrate_laos_desc: "Extend Thai administration to the claimed Lao provinces. High compliance and low resistance in the core state are required before formal integration can proceed."
 SIA_integrate_cambodia: "Integrate the Khmer Provinces"
 SIA_integrate_cambodia_desc: "Extend Thai administration to Battambang and Siem Reap, as in 1941-1946. The Khmer population must accept Thai governance before formal administration can be imposed."
 SIA_integrate_malaya: "Integrate the Southern Provinces"
 SIA_integrate_malaya_desc: "Extend Thai administration to the former sultanates ceded in 1909. Integration requires the population to be brought firmly under Bangkok's influence before formal annexation."
 SIA_cost_1_0: "£treasury 1.0"
 SIA_cost_1_5: "£treasury 1.5"
 SIA_thaksinite_party_governs_tt: "§Y[neutral_Social_L]§! is the ruling party."
 SIA_cost_2_0: "£treasury 2.0"
 SIA_cost_2_0_blocked: "£treasury 2.0 §R(insufficient)§!"
 SIA_otpc_education_strain: "One Tablet Per Child Rollout"
 SIA_otpc_education_strain_desc: "Chargers, breakages, replacement units, and the training budget nobody costed. The schools ministry is absorbing the program's real price."
 SIA_packed_senate: "A Senate of Our Own"
 SIA_packed_senate_desc: "Loyalists in the upper house and the independent agencies. For now the government's legislation passes on the nod."
 SIA_cost_5_0: "£treasury 5.0"
 SIA_economy_category: "Thai Strategic and Economic Decisions"
 SIA_economy_category_desc: "Tourism, medicine, manufacturing, arms and the megaprojects, alongside the levers of ASEAN diplomacy and high strategy. The engines of the Thai state respond to investment and political capital, when the treasury and the cabinet can spare them."
 SIA_ds_hearts_and_minds: "Hearts and Minds"
 SIA_ds_hearts_and_minds_desc: "Malay-language schooling, religious outreach, compensation boards and village mediators. Nobody holds a parade for it, but the incident map gets quieter."
 SIA_contain_the_crisis: "Contain the Crisis"
 SIA_contain_the_crisis_desc: "泰南地区已沸腾。我们需要在六个月内将叛乱强度压回沸点以下，否则暴力将升级，稳定性和合法性的代价将不断攀升。"
 SIA_choose_a_path: "Choose a Path in the South"
 SIA_choose_a_path_desc: "The crisis is active and the government has a clear political mandate, but no southern strategy has been committed. Lock in a track (force, royal development, or dialogue) within the year, or drift will cost the Kingdom dearly."
 SIA_medical_tourism_campaign: "Medical Tourism Campaign"
 SIA_medical_tourism_campaign_desc: "Market Thai hospitals to the world, offering surgery and convalescence at a fraction of Western prices, with a beach attached. The campaign pays for itself, if the wards can take the load."
 SIA_eec_investment_phase: "EEC Investment Phase"
 SIA_eec_investment_phase_desc: "Release the next tranche of Eastern Economic Corridor funds for land clearance, utilities, port and rail works in the eastern provinces."
 SIA_cost_3_0: "£treasury 3.0"
 SIA_cost_4_0: "£treasury 4.0"
 SIA_cost_6_0: "£treasury 6.0"
 SIA_cost_7_0: "£treasury 7.0"
 SIA_cost_1_0_blocked: "£treasury 1.0 §R(insufficient)§!"
 SIA_cost_1_5_blocked: "£treasury 1.5 §R(insufficient)§!"
 SIA_cost_3_0_blocked: "£treasury 3.0 §R(insufficient)§!"
 SIA_cost_4_0_blocked: "£treasury 4.0 §R(insufficient)§!"
 SIA_cost_5_0_blocked: "£treasury 5.0 §R(insufficient)§!"
 SIA_cost_6_0_blocked: "£treasury 6.0 §R(insufficient)§!"
 SIA_cost_7_0_blocked: "£treasury 7.0 §R(insufficient)§!"
 SIA_family_holdings: "Family Holdings"
 SIA_family_holdings_desc: "钦那瓦家族控制着电信、卫星服务、卫星电视及十余家相关企业的巨额股份。利用与政府的关系谋取私利是该家族的传统，也是该党赖以生存的收入来源。"
 SIA_royal_projects: "Royal Development Projects"
 SIA_royal_projects_desc: "Dispatch royal development teams to rural provinces for demonstration farms, mobile health clinics, watershed management and vocational training. The King's personal prestige accompanies every project, and the village headmen remember who sent them."
 SIA_isoc_surveillance_sweep: "ISOC Surveillance Sweep"
 SIA_isoc_surveillance_sweep_desc: "派遣治安战情报小组对深南地区的移动网络、村庄线人网络及边境通道进行彻底清查。无需搜查令，不留任何记录，从而获得军方从未有过的南部地区全貌。"
 SIA_isoc_grid_disruption: "ISOC Network Disruption"
 SIA_isoc_grid_disruption_desc: "Target the funding pipelines, command nodes and courier networks that sustain the insurgency's operational tempo. Every node disrupted is a bomb that does not go off."
 SIA_ds_cordon_and_search: "Cordon and Search"
 SIA_ds_cordon_and_search_desc: "Seal off villages and sweep them house to house for weapons and fighters. It breaks the insurgents' tempo fast, but every kicked-in door and detained relative deepens the grievance the movement feeds on."
 SIA_ds_fund_religious_schools: "Fund the Pondok Schools"
 SIA_ds_fund_religious_schools_desc: "State grants for the Malay-Muslim religious schools and cultural institutions the South holds dear, on the South's own terms. It does little to the violence this week, but it strikes hard at the alienation that sustains it."
 SIA_asean_rotating_summit: "Host the ASEAN Summit"
 SIA_asean_rotating_summit_desc: "Use Thailand's chairmanship to host a high-profile summit, showcasing Bangkok as the diplomatic capital of Southeast Asia. The resulting goodwill translates into political capital at home and prestige abroad."
 SIA_asean_mediate_myanmar: "Mediate the Myanmar Crisis"
 SIA_asean_mediate_myanmar_desc: "Position Thailand as the honest broker between Myanmar's junta and the international community. A quiet success builds lasting influence in Naypyidaw. A public failure is still a useful signal to the rest of the region."
 SIA_asean_free_trade_push: "Push ASEAN Free Trade Measures"
 SIA_asean_free_trade_push_desc: "Use the chairmanship to push through trade facilitation measures such as customs harmonization, non-tariff barrier reduction, and digital trade corridors. The groundwork takes time, but the export receipts arrive on schedule. ASEAN neighbors take note of Bangkok's constructive leadership."
 SIA_retry_section_112: "Re-table the Amendment"
 SIA_retry_section_112_desc: "The first attempt to reform Section 112 failed in the legislature. The public backlash has been loud, but so has the counter-mobilization of young voters. A second attempt, better prepared and more narrowly drafted, can still pass if the timing is right."
 SIA_ds_autonomy_framework: "Southern Autonomy Framework"
 SIA_ds_autonomy_framework_desc: "Pilot a modest administrative autonomy scheme for the Malay-Muslim provinces, with a regional consultative council, Malay-language official status, and devolved school funding. Not independence, not even close, but enough to demonstrate that Bangkok can listen. Six months to design it, a generation to judge it."
 SIA_isr_persistent_sweep: "ISR Persistent Sweep"
 SIA_isr_persistent_sweep_desc: "将“天空之眼”情报资产部署至泰南边境三府，实施常态化监视——边境口岸、移动交通、车辆动向悉数覆盖。叛乱分子将丧失隐匿行动的能力，而士兵无需踏入任何一座村庄。"
 SIA_political_gambits_category: "Political Gambits"
 SIA_political_gambits_category_desc: "Between focuses, the government still has levers: ministers reshuffled, prosecutors pointed, money sent up-country, and, when it comes to it, a bargain with the palace or a day in court.\n\n§YReform Pressure§!: [?ROOT.SIA_reform_pressure|0]/100. Urban and youth discontent drifting to Move Forward. Above 60 it spills into protest.\n§YPopulist Tide§!: [?ROOT.SIA_pheu_thai_pressure|0]/100. The countryside drifting back to Pheu Thai. Only a Democrat government carries this one."
 SIA_cabinet_reshuffle: "Cabinet Reshuffle"
 SIA_cabinet_reshuffle_desc: "Rotate the ministers, buy off the critics, drop the weakest performer from the television schedule. Prayuth Fatigue or the Politics of the Courtroom goes out with him, whichever is currently hanging on the government. The party claims renewal without changing anything that matters."
 SIA_lese_majeste_lever: "Press the Lèse-Majesté Lever"
 SIA_lese_majeste_lever_desc: "Selective enforcement of Section 112 against the loudest reform critics. Charges filed, bail denied, statements retracted. The opposition loses a voice, and everyone watching it happen moves a step further from the system."
 SIA_coup_watch_category: "The Barracks Are Watching"
 SIA_coup_watch_category_desc: "Every elected populist in Thai history has governed in the army's shadow. Quick wins like telecom favors, padded contracts, and family graft buy money and votes now, but each one raises §YCoup Risk§!. It also climbs on its own every week, by 0.5 normally and by 1.0 while Stability is below 50%, and never falls back without action. The decisions below buy the risk back down, and each one costs you something. Let it pass 85 and the §RReassure the High Command§! mission arms. Defuse it, or the army takes the government.\n\n§YCoup Risk§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_shin_corp_tax_holiday: "Tailor a Telecom Tax Holiday"
 SIA_shin_corp_tax_holiday_desc: "Quietly rewrite the concession terms so the family telecom empire pays almost nothing on its next windfall. The treasury and the party both gain. The generals keep count."
 SIA_school_milk_contract: "Award the School-Milk Contract"
 SIA_school_milk_contract_desc: "A nationwide free-milk program for rural schoolchildren, wildly popular in the villages, routed through a supplier cartel that knows exactly whom to thank. The villages are grateful. The officers are not."
 SIA_otpc_tablet_procurement: "Launch One Tablet Per Child"
 SIA_otpc_tablet_procurement_desc: "A glossy scheme to put a tablet in every first-grader's hands. The cameras love it and the party's numbers tick up. It is paid for in cash, the schools budget carries the weight for half a year, and the procurement is a kickback machine that everyone in uniform knows about."
 SIA_family_business_favors: "Steer Contracts to the Family Firm"
 SIA_family_business_favors_desc: "Public works, import licenses, a port concession or two, all going to companies the prime minister's relatives happen to own. Money for the treasury and for the family. The army adds it to the case against you."
 SIA_court_the_generals: "Court the Generals"
 SIA_court_the_generals_desc: "Discreet budget lines, prestige postings, and a few well-placed promotions. None of it is cheap, but a contented officer corps is a patient one. Lowers coup risk."
 SIA_military_budget_boost: "Approve a Defence Procurement Splurge"
 SIA_military_budget_boost_desc: "Submarines, fighters, a new headquarters wing. Sign off on the army's wish-list and the brass remember who pays the bills. The civilian economy goes a little hungrier for it, but coup risk falls sharply."
 SIA_anti_corruption_gesture: "Throw a Crony to the Prosecutors"
 SIA_anti_corruption_gesture_desc: "Pick an expendable ally, hand the file to the anti-graft commission, and let the cameras roll. Party supporters watch a friend sold for good headlines and the polls slip. The generals see a government that punishes its own."
 SIA_promote_loyalists: "Promote Loyal Officers"
 SIA_promote_loyalists_desc: "Reshuffle the annual promotion list to move dependable hands into the commands that matter, the First Army, the King's Guard, the capital garrison. Costs political capital, but puts friendlier men between the government and the tanks. Lowers coup risk."
 SIA_reassure_high_command: "Reassure the High Command"
 SIA_reassure_high_command_desc: "The columns are fuelled and the broadcast script is written. Bring coup risk back under 70 before the timer runs out, through budgets, promotions, or a public reckoning with the cronies. Fail and the army takes the government."
 SIA_canal_tolls: "Collect Canal Tolls"
 SIA_canal_tolls_desc: "The Kra Canal carries some of the world's highest-value maritime traffic. Toll collection from commercial vessels like container ships, tankers, bulk carriers and cruise liners flows directly into the national treasury every six months."
 SIA_kra_construction: "Kra Canal"
 SIA_kra_construction_desc: "The Kra Canal across its whole life. First the phased works of the great cut at the Kra Isthmus, each phase funded in turn, neglect inviting cost overruns and, on contested ground, sabotage. Then the naval management of the finished strait: patrol schedules, transit protocols, and the security of the world's newest chokepoint.\nThe great cut proceeds in three funded phases. §YConstruction Progress§!: [?ROOT.SIA_kra_progress|0]%"
 SIA_kra_phase_1: "Phase I, Cut the Isthmus"
 SIA_kra_phase_1_desc: "The first great excavation. Drive the channel through the spine of the peninsula. Fund the phase before the construction season runs out, or the project office will return with an overrun."
 SIA_kra_phase_2: "Phase II, Lock & Channel Works"
 SIA_kra_phase_2_desc: "Line the cut, sink the locks, and build the channel works that will hold back two seas. Keep the treasury behind the schedule or face another overrun."
 SIA_kra_phase_3: "Phase III, Sea Trials"
 SIA_kra_phase_3_desc: "Flood the summit reach, hang the gates, and run the pilots through in ballast. The final phase before the canal can open. Fund it and the megaproject is complete."
 SIA_strait_patrol: "Strait Patrol"
 SIA_strait_patrol_desc: "Put Royal Thai Navy vessels on regular patrol of the Kra transit corridor. The presence deters piracy, reassures shipping, and gives the fleet the sea time it has never had."
 SIA_red_path_category: "Village Committee Operations"
 SIA_red_path_category_desc: "Spread the party's organizational presence into rural communities, workplaces, and neighborhoods. Each committee that takes root strengthens the movement's popular base, and tests the government's tolerance."
 SIA_spread_flame_isaan: "Organize Isaan Villages"
 SIA_spread_flame_isaan_desc: "Deploy party cadres to Isaan villages and district towns. Establish village committees, literacy groups, and cooperative networks. The Northeast is the movement's natural base, so deepen it."
 SIA_spread_flame_north: "Organize Northern Communities"
 SIA_spread_flame_north_desc: "The north has a long history of labor organization and agrarian radicalism. Party organizers work the hillside cooperatives and the timber unions. A base here means the movement is more than Isaan."
 SIA_mass_education_campaign: "Mass Political Education Campaign"
 SIA_mass_education_campaign_desc: "A national curriculum of political education covering labor history, economic theory, and the history of imperialism in Southeast Asia. Run through party-aligned unions, cooperatives, and community centers. The investment costs political capital now. The payoff is a genuinely politically aware constituency."
 SIA_asean_arms_export: "ASEAN Arms Export Contract"
 SIA_asean_arms_export_desc: "Thailand's defence manufacturers have the production capacity and the regional relationships to sustain a recurring export program. Each annual contract, whether MRAPs, artillery fuses, ammunition batches, or loitering munitions, adds directly to the treasury and deepens Thailand's position as the region's preferred second-tier supplier."
 SIA_defense_export_contract: "Defense Export Contract"
 SIA_defense_export_contract_desc: "With the Defense Export Office standing and the kingdom's arsenals certified for sale, the cabinet can authorize a fresh export contract. Chaiseri First Win vehicles, DTI rockets and munitions, and license-built systems ship to ASEAN buyers on a recurring basis. The political capital spent securing the deal returns to the treasury as hard export revenue, the defense-industrial wing paying its own way."
 SIA_counter_chinese_influence: "Counter Chinese Influence"
 SIA_counter_chinese_influence_desc: "Deploy diplomatic, economic, and informational resources to roll back Beijing's influence in Bangkok's neighborhood. The operation takes months and carries a cost, but the alternative is acquiescence."
 SIA_counter_indian_influence: "Counter Indian Influence"
 SIA_counter_indian_influence_desc: "New Delhi's soft power in Southeast Asia, from investment to cultural programming to strategic partnerships, has been expanding quietly. A coordinated counter-influence campaign redirects regional partners toward Bangkok."
 SIA_renegotiate_china_contracts: "Renegotiate Chinese Contracts"
 SIA_renegotiate_china_contracts_desc: "The BRI infrastructure contracts built roads and rails Thailand needed, but the financing terms embed Beijing's influence for a generation. The cabinet can accept that dependency or pay the political price to renegotiate the terms."
 SIA_us_security_review: "U.S.-Thailand Security Review"
 SIA_us_security_review_desc: "Washington has requested a formal bilateral security review. The outcome determines whether Thailand deepens its treaty alignment, with the training packages, procurement access, and political visibility that entails, or maintains the strategic hedge."
 SIA_strategic_fuel_reserve: "Build Strategic Fuel Reserve"
 SIA_strategic_fuel_reserve_desc: "Commission a three-month national fuel stockpile in distributed tank farms. The investment smooths price volatility, provides a military logistics buffer, and signals supply-chain resilience to regional partners."
 SIA_anti_corruption_drive: "Anti-Corruption Drive"
 SIA_anti_corruption_drive_desc: "A targeted enforcement campaign against procurement corruption, customs fraud, and the patronage networks embedded in provincial government. Clean contracting is slower at first, and cheaper in the long run."
 SIA_tax_modernization: "Tax System Modernization"
 SIA_tax_modernization_desc: "Replace the Revenue Department's paper-based assessment system with mandatory electronic filing, algorithmic auditing, and yield-based evaluator incentives. The implementation is painful. The permanent efficiency dividend repays the capital cost within five years."
 SIA_gripen_ef_upgrade: "Gripen E/F Contract"
 SIA_gripen_ef_upgrade_desc: "The 12-aircraft Gripen E/F contract, signed in August 2025, represents the RTAF's commitment to a fifth-generation capable fighter. First deliveries are expected in 2029. The contract cements the RTAF's long-term relationship with SAAB and locks in Swedish maintenance support through the 2040s."
 SIA_gripen_ef_upgrade_bonus: "Gripen E/F Integration"
