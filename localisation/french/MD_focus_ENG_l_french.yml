l_french:
 united_kingdom_focus: "Priorités nationales britanniques"
 ENG_royal_army: "Armée britannique"
 ENG_royal_army_desc: "L'armée britannique est la principale force terrestre des forces armées britanniques. Ses origines remontent à la fusion des armées écossaise et anglaise en 1707, lors de l'Acte d'Union. Elle a participé à presque tous les conflits majeurs, notamment la guerre de Sept Ans, la guerre d'Indépendance américaine, les guerres napoléoniennes, la guerre de Crimée et les Première et Seconde Guerres mondiales. Au fil du temps, elle est passée d'une force principalement d'infanterie à une force hautement moderne et mécanisée, dotée de divers éléments de soutien et de forces spéciales de renommée mondiale, qui ont servi de référence à d'autres armées internationales."
 ENG_irish_referendum: "[GetYear] [NIR.GetFlag] Référendum sur l'indépendance de l'Irlande du Nord"
 ENG_irish_referendum_desc: "The [NIR.GetFlag] Northern Irish people will vote on a referendum that will determine their future as a nation, constituent, and a player in the British Isles. The campaign runs until polling day, and the result will be whatever Northern Irish opinion has become by the time it is counted. Westminster can spend political capital and Treasury money to move it.\n\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_scottish_referendum: "[GetYear] [SCO.GetFlag] Référendum écossais sur l'indépendance"
 ENG_scottish_referendum_desc: "The [SCO.GetFlag] Scottish people will vote on a referendum that will determine their future as a nation, constituent, and a player in the British Isles. The campaign runs until polling day, and the result will be whatever Scottish opinion has become by the time it is counted. Westminster can spend political capital and Treasury money to move it.\n\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 britain_md.1.t: "Notre ambition pour la Grande-Bretagne"
 britain_md.1.d: "Le peuple s'est exprimé et a décidé que le Parti travailliste est le parti qu'il souhaite voir le représenter à l'avenir. Notre vision et notre ambition d'une Grande-Bretagne à son meilleur sont sans limites, et nous nous attellerons immédiatement aux enjeux de notre grande union."
 britain_md.2.t: "Nous prenons des risques ?"
 britain_md.2.d: "Nous avons la capacité d'influencer considérablement le marché national en encourageant les investissements dans certains secteurs de niche. Cependant, une telle mesure pourrait susciter des craintes chez les investisseurs ayant placé leur argent dans des secteurs concurrents, entraînant un léger ralentissement économique. Le gouvernement est actuellement divisé quant à l'opportunité de cette initiative."
 britain_md.3.t: "Faire une grande promesse"
 britain_md.3.d: "Pour élargir notre électorat, nous devrons solliciter l'une de nos factions internes. Cela démontrera non seulement notre capacité à gérer efficacement plusieurs secteurs de l'État, mais nous permettra également de dégager des fonds supplémentaires pour financer d'autres projets. De plus, grâce à l'influence nouvellement acquise sur ces factions, nous pourrons renverser la tendance lors des prochaines élections face à nos adversaires politiques."
 britain_md.4.t: "Qui sommes-nous imposés ?"
 britain_md.4.d: "Notre gouvernement est confronté à une situation inédite. Afin d'accroître ses recettes, il nous faudrait augmenter les impôts pour financer nos programmes sociaux. Cependant, une telle mesure risque de mécontenter une partie de la population, et une taxation généralisée a été déconseillée car elle est susceptible de nuire gravement à notre réputation. C'est pourquoi notre cabinet propose de taxer une seule catégorie de la population afin de ne pas froisser tout le monde."
 britain_md.5.t: "La Grande-Bretagne en avant, pas en arrière"
 britain_md.5.d: "Nous devons empêcher la régression de notre société vers les abîmes de la répression que certains de nos adversaires politiques continuent d'appeler de leurs vœux. Nous lutterons pour que la Grande-Bretagne continue d'avancer sans interruption vers l'avenir. Nos valeurs, l'ordre et la stabilité ne doivent en aucun cas être compromis, et nous nous battrons pour conserver notre première place aux urnes."
 britain_md.6.t: "Gratter le ciel britannique"
 britain_md.7.t: "Personne ne sera laissé pour compte"
 britain_md.7.d: "Partout dans le monde, que ce soit en Europe, en Asie, en Afrique ou en Amérique, les inégalités ne cessent de s'accroître. Avec des salaires stagnants et des prix qui s'envolent, vivre est devenu un véritable calvaire. Mais pour les citoyens du Royaume-Uni, il n'en est rien ! Grâce à des réformes rapides et à de nouvelles politiques, nous prouverons au monde entier qu'il n'est pas nécessaire de subir cette montée des inégalités."
 britain_md.8.t: "Des liens entre les deux ?"
 britain_md.8.d: "De nombreuses personnes à droite de l'échiquier politique affirment que la hausse de la criminalité est directement liée à l'augmentation des migrations ces dernières années. Si beaucoup réfutent ces affirmations, les qualifiant de xénophobes et de sectaires, d'autres avancent que la cause réside dans l'incapacité de certains migrants et réfugiés à s'intégrer à la culture [ENG.GetAdjective]."
 britain_md.9.t: "Ça peut toujours être mieux"
 britain_md.9.d: "La Grande-Bretagne n'est pas condamnée à ressembler au reste du monde, elle peut faire mieux. Grâce à des réformes politiques profondes, nous pouvons enrayer le recul démocratique et faire de la Grande-Bretagne la meilleure version d'elle-même. Cette fois-ci, le Parti travailliste s'est engagé à mener des réformes sociales et politiques radicales, et notre message touchera les Britanniques comme jamais auparavant."
 britain_md.10.t: "Réexamen de la loi sur le lobbying ?"
 britain_md.10.d: "Au sein de notre gouvernement, certains nous pressent de plus en plus de revoir la loi sur le lobbying. Une telle mesure provoquerait évidemment un tollé et risquerait d'entraîner une recrudescence de la corruption. Toutefois, si nous souhaitions obtenir rapidement du soutien et des financements pour notre parti, nous devrions peut-être envisager, à tout le moins, quelques modifications de cette loi."
 britain_md.11.t: "Rendre la raison à la Grande-Bretagne"
 britain_md.11.d: "Il est temps de rétablir la normalité dans ce pays plongé dans le chaos. Le bon sens semble avoir complètement disparu, puisque les membres du Parti travailliste ont commencé à faire adopter des réformes aux conséquences irréversibles. Notre gouvernement mènera la Grande-Bretagne vers un État plus fort et plus indépendant, et non vers un État dirigé par Bruxelles ou un cabinet de gauchistes."
 britain_md.12.t: "[FROM.GetName] Demande d'accès militaire"
 britain_md.12.d: "Dans un effort apparent pour rendre l'Europe plus flexible en matière de défense, les [ENG.GetAdjective] ont décidé d'envoyer des demandes d'accès militaire. Bien que nous n'y gagnions rien, nous n'y perdrions rien non plus."
 britain_md.13.t: "L'implication britannique"
 britain_md.13.d: "Le gouvernement britannique s'est engagé à nous aider à combattre nos ennemis et à protéger la souveraineté de notre État. Ce qu’ils n’ont pas précisé clairement, c’est ce qu’ils attendaient en retour. Nous avons reçu des renseignements d'une source fiable selon lesquels le gouvernement britannique a l'intention de s'emparer de nos ressources à Freetown pour une période de 500 jours s'il exerce une influence significative sur nous. Ils ont l’intention de le faire, que nous leur permettions ou non de déployer des troupes."
 britain_md.14.t: "Les Britanniques s'emparent de nos ressources !"
 britain_md.14.d: "Les Britanniques se sont emparés de nos ressources car ils exercent une influence considérable sur nous. Cette situation durera 500 jours, jusqu'à leur retrait."
 britain_md.15.t: "Fin de mission : Barras"
 britain_md.15.d: "Notre séjour en Sierra Leone touche à sa fin, et nous avons entamé les préparatifs pour le démantèlement des institutions qui transféraient des ressources de la Sierra Leone vers les entrepôts destinés à générer des revenus pour les Britanniques."
 britain_md.16.t: "Coup d'État en Gambie ?"
 britain_md.16.d: "Le moment est venu de mettre un terme définitif à l'État tyrannique dirigé par [GAM.GetLeader] en Gambie. Nous allons renverser leur gouvernement, mais si nous allons trop loin, la situation pourrait dégénérer en guerre civile et nous échapper."
 britain_md.17.t: "Coup d'État réussi en Gambie"
 britain_md.17.d: "Nous avons renversé le régime oppressif en Gambie et installé le gouvernement de notre choix. Le peuple gambien ne subira plus jamais une oppression injustifiée."
 britain_md.18.t: "Coup d'État raté en Gambie"
 britain_md.18.d: "Nous n'avons pas réussi à renverser [GAM.GetLeader] et, de ce fait, plusieurs de nos soldats britanniques ont perdu la vie. Notre tentative de coup d'État est scrutée de près par la communauté internationale et nos relations avec le gouvernement gambien se sont détériorées."
 britain_md.19.t: "Coup d'État incroyablement réussi en Gambie"
 britain_md.19.d: "Nos efforts en Gambie ont été couronnés de succès. Non seulement nous avons renversé le gouvernement oppressif, mais nous avons également réussi à établir un contrôle ferme sur l'État, le transformant de fait en un État satellite."
 britain_md.20.t: "Opération Delta Guard : Succès"
 britain_md.20.d: "Nous avons réussi à sécuriser des champs pétroliers stratégiques près du delta, et les forces nigérianes ont été aperçues en train de battre en retraite vers le nord, en direction de leur capitale. On ignore pour l'instant si elles riposteront, mais pour le moment, nous profitons des fruits de la guerre."
 britain_md.21.t: "Les forces britanniques s'emparent du pétrole près du delta"
 britain_md.21.d: "Les forces britanniques ont violé notre souveraineté de manière flagrante et ont placé nos champs pétrolifères sacrés sous « protection temporaire », qualifiant notre gouvernement d'instable et de peu fiable. Nous ignorons pourquoi elles ont opté pour une action militaire, mais une chose est sûre : nous ne pouvons pas rester les bras croisés."
 britain_md.22.t: "Le Nigeria riposte"
 britain_md.22.d: "Plusieurs militaires britanniques ont été blessés et quelques-uns tués lors d'une attaque de représailles des forces armées nigérianes. Cette attaque fait suite à notre prise de contrôle de plusieurs champs pétroliers du delta du Nil, nous assurant ainsi un accès vital au pétrole face à l'instabilité du gouvernement nigérian. Nous devons nous emparer de la capitale nigériane pour les remettre à leur place."
 britain_md.23.t: "Les forces britanniques se retirent"
 britain_md.23.d: "Craignant la puissance des grandes forces armées nigérianes et le courage du leadership du [NIG.GetLeader], les lâches forces britanniques se sont retirées du Delta et ont cessé toute exploitation pétrolière. Nous sommes victorieux sur ce point et n'anticipons aucune nouvelle représailles britanniques."
 britain_md.24.t: "Sélectionnez un agenda"
 britain_md.24.d: "Notre parti a remporté les élections, il est temps pour nous de choisir un programme."
 britain_md.25.t: "La reine Elizabeth II est morte"
 britain_md.25.d: "Elizabeth Alexandra Mary, fille de George VI, est morte paisiblement dans son sommeil. Elle était âgée de près de 100 ans et a été reine pendant près de 70 ans.\n\nLa nation et le Commonwealth dans son ensemble sont en deuil. Le long règne de la reine a vu la fin de l'Empire, la revitalisation des Home Islands, l'entrée dans l'Union européenne et un départ fier et fort à l'aube du troisième millénaire.\n\nLa reine était une légende vivante. Mais toutes les légendes finissent par mourir."
 britain_md.26.t: "Le roi Charles III est mort"
 britain_md.26.d: "« Charles est mort », sur la première page du journal, suivi par le sous-titre « Seuls quelques uns sont en deuil ».\n\nLe roi Charles III était historiquement impopulaire, comparable à son grand-oncle Édouard VIII.\n\nSon fils, William V, sera sûrement un roi plus populaire pour le peuple britannique."
 ENG_british_flag_on_the_moon: "Drapeau britannique sur la Lune"
 ENG_british_flag_on_the_moon_desc: "Entamez une mission lunaire ambitieuse alors que le Royaume-Uni s'efforce d'établir une base britannique sur la Lune. Cette initiative lunaire témoigne de l'engagement de la nation dans l'exploration spatiale, mettant en avant sa maîtrise technologique et stimulant l'innovation scientifique. Pionnier de la frontière cosmique, le Royaume-Uni élève son standing mondial dans le domaine de l'exploration spatiale."
 ENG_set_sail_to_mars: "Mettez les voiles vers Mars"
 ENG_set_sail_to_mars_desc: "S'aventurant au-delà des limites de la Terre, le Royaume-Uni vise hardiment à établir une présence sur Mars. Cette initiative visionnaire se concentre sur l'exploration martienne pionnière, reculant les frontières de la technologie spatiale et positionnant le Royaume-Uni comme un acteur clé de la quête humaine vers la planète Rouge. Relevez le défi de la conquête martienne, définissant le rôle du Royaume-Uni dans l'avenir de l'exploration interplanétaire."
 ENG_new_thirteen_colonies: "Treize nouvelles colonies"
 ENG_new_thirteen_colonies_desc: "Traçant la route vers de nouvelles frontières, le Royaume-Uni s'inspire de l'histoire et envisage l'établissement de Nouvelles Treize Colonies sur Mars. Évoquant l'esprit des treize colonies originelles, cette initiative ambitieuse témoigne de l'engagement britannique à la colonisation martienne, embrassant les défis de la colonisation interplanétaire. Menez la charge pour forger un nouvel héritage sur la planète Rouge, où des pionniers britanniques entament un voyage qui rappelle les racines historiques de la nation."
 ENG_asteroid_mining: "Extraction d'astéroïdes"
 ENG_asteroid_mining_desc: "Avancez dans le cosmos avec la British Royal Asteroid Mining Company, alors que le Royaume-Uni embrasse la récolte de ressources célestes. Tourné vers l'extraction de ressources précieuses des astéroïdes, ce projet symbolise l'engagement de la nation à pionnier l'utilisation des ressources spatiales et les technologies de pointe."
 ENG_standardized_space_parts: "Pièces spatiales standardisées"
 ENG_standardized_space_parts_desc: "Révolutionnez le coût de l'exploration spatiale avec la poussée vers des pièces spatiales standardisées au Royaume-Uni. En rationalisant et standardisant les composants, cette initiative vise à rendre les entreprises spatiales plus économiques, marquant l'engagement de la nation à favoriser des aventures spatiales accessibles et abordables."
 ENG_virgin_galactic: "Vierge Galactique"
 ENG_virgin_galactic_desc: "En tête de l'industrie du tourisme spatial, Virgin Galactic s'efforce de rendre le cosmos accessible à tous. Avec des vaisseaux innovants et l'engagement de reculer les frontières de l'exploration spatiale, Virgin Galactic incarne le rôle du Royaume-Uni dans l'avenir des aventures spatiales civiles."
 ENG_british_commercial_spaceport: "Port spatial commercial britannique"
 ENG_british_commercial_spaceport_desc: "Alors que la course mondiale vers le cosmos s'intensifie, le Royaume-Uni reconnaît l'impératif de sécuriser sa place à la frontière de l'exploration spatiale. L'établissement d'un spatioport commercial britannique est un focus pivot pour avancer le pied de la nation dans les entreprises spatiales commerciales. En investissant dans la construction et le développement d'un spatioport dédié, le Royaume-Uni aspire à favoriser l'innovation, attirer des partenariats internationaux et propulser son industrie aérospatiale vers de nouveaux sommets, assurant un avenir prometteur comme acteur clé de la frontière cosmique."
 ENG_united_kingdom_space_command: "Commandement spatial du Royaume-Uni"
 ENG_united_kingdom_space_command_desc: "Alors que le cosmos devient une nouvelle arène d'influence stratégique, le Royaume-Uni reconnaît la nécessité de consolider ses efforts dans les opérations spatiales. L'établissement du United Kingdom Space Command est un focus décisif visant à unifier et renforcer les capacités spatiales de la nation. En centralisant le commandement, en favorisant les opérations conjointes et en investissant dans des technologies de pointe, le Royaume-Uni s'efforce de sécuriser ses intérêts dans le domaine cosmique, assurant une présence formidable parmi les étoiles et sauvegardant la sécurité nationale à l'âge spatial."
 ENG_istari_programme: "Programme ISTARI"
 ENG_istari_programme_desc: "Face à l'évolution du paysage mondial, le Royaume-Uni lance le programme ISTARI, un focus ambitieux dédié au renseignement, à la surveillance, à l'acquisition d'objectifs et à la reconnaissance dans le domaine cyber."
 ENG_space_red_coats: "Fusiliers spatiaux"
 ENG_space_red_coats_desc: "S'inspirant d'un passé chargé d'histoire, le Royaume-Uni revitalise l'héritage des Red Coats avec les fusiliers spatiaux du XXIe siècle. Évoquant l'esprit de résilience historique, ce focus propulse l'exploration spatiale britannique dans une nouvelle ère. Vêtus de rouge symbolique, les Space Red Coats s'efforcent d'explorer le cosmos, incarnant la tradition d'exploration et projetant l'influence britannique à travers l'étendue céleste."
 ENG_1st_space_force_division: "1ère Division des Forces spatiales"
 ENG_1st_space_force_division_desc: "Traçant une route au-delà des limites terrestres, le Royaume-Uni ouvre une voie audacieuse avec la création de la British Space Force Division. Sans précédent dans l'histoire, cela annonce une nouvelle ère alors que la Grande-Bretagne établit sa première division spatiale dédiée. Chargée de sauvegarder les intérêts célestes et d'embrasser l'inconnu, la Space Force Division témoigne de l'engagement de la nation à explorer et sécuriser la frontière cosmique, où l'Union Jack flotterait parmi les étoiles."
 ENG_space_capabilities: "Capacités du cyberespace"
 ENG_space_capabilities_desc: "Reconnaissant l'importance capitale du domaine numérique, le Royaume-Uni oriente son focus vers le renforcement des capacités cyber. À une époque où l'information est le pouvoir, cette initiative témoigne d'un engagement à fortifier la maîtrise de la nation dans les opérations cyber."
 ENG_strategic_defence_review: "Livre blanc de la défense de [GetYear]"
 ENG_strategic_defence_review_desc: "Nos priorités et nos menaces changent sans cesse, et notre bureaucratie militaire doit évoluer pour y faire face. En coordonnant une nouvelle réponse de sécurité nationale avec des partenaires à travers le gouvernement et nos alliés, nous pouvons veiller à ce que notre armée reste adaptable au changement et prête à affronter les menaces contre la sécurité britannique."
 ENG_AS90: "AS90 'Cœur courageux'"
 ENG_AS90_desc: "L'AS90, Artillery System for the 1990s, autrement connu sous le nom de Gun Equipment 155 mm L131, est le principal canon automoteur blindé de l'armée britannique. Conçu et construit par la division armement de Vickers Shipbuilding and Engineering entre 1982 et 1987, la production suivant en 1992 avec 179 véhicules produits. Il a remplacé l'ancien FV433 Abbot de 105 mm et le plus ancien M109 de 155 mm. Des efforts ont été proposés pour moderniser l'AS90 afin de monter un tube plus long capable de tirer des munitions de 52 calibres, augmentant sa portée non assistée et avec des munitions à portée étendue."
 ENG_operation_excellence: "Commandement spécial"
 ENG_utility_vehicle_modernisation: "Modernisation des véhicules utilitaires"
 ENG_utility_vehicle_modernisation_desc: "Il est devenu clair, à travers les expériences en Irlande du Nord durant les Troubles, que les véhicules utilitaires d'infanterie actuels de l'armée, comme le Snatch Land Rover, n'offrent que peu ou pas de protection contre les IED et les mines, des rapports de survie indiquant même qu'ils nuisent activement aux survivants du souffle initial. Le ministère de la Défense a donc commencé à explorer des options pour employer des véhicules modernes à blindage résistant aux mines et aux embuscades, comme le MRAP américain « Cougar »."
 ENG_nlaw_anti_tank_system: "Système antichar NLAW"
 ENG_nlaw_anti_tank_system_desc: "Le NLAW de SAAB Bofors Dynamics, aussi appelé MBT LAW ou R85, est un système de missile léger jetable, tiré à l'épaule, à visée directe et « tire et oublie », conçu pour l'infanterie. Conçu par SAAB pour les ministères de la Défense britannique et suédois au Royaume-Uni, au sein de Team NLAW, avec divers sous-traitants dont une forte implication de Thales Air Defence."
 ENG_startstreak_anti_air_system: "Système anti-aérien Starstreak"
 ENG_startstreak_anti_air_system_desc: "Le Starstreak est un missile sol-air britannique à courte portée, à la fois système portatif de défense aérienne (MANPADS) et déployé en diverses configurations sur hélicoptères et véhicules pour une couverture mobile. Il est fabriqué par Thales Air Defence à Belfast, en Irlande du Nord. Après le tir, le missile accélère au-delà de Mach 4, ce qui en fait le missile sol-air à courte portée le plus rapide au monde. Pour accroître son potentiel, il lance trois sous-munitions guidées par faisceau laser vers la cible, augmentant la probabilité d'un coup au but."
 ENG_M270: "Recapitaliser le M270"
 ENG_M270_desc: "Le ministère de la Défense prévoit d'investir dans la recapitalisation des lance-missiles chenillés M270 en service et de divers types de munitions, en complément de l'achat de munitions du Guided Multiple Launch Rocket System. L'intention est d'introduire de nouveaux moteurs, une protection blindée et des systèmes de conduite de tir modernisés."
 ENG_mobile_fires_platform_program: "Programme de plateforme d'appui-feu mobile"
 ENG_mobile_fires_platform_program_desc: "Après la fin de la guerre froide et l'affaiblissement de l'anticipation d'un conflit sur les plaines allemandes, le stock d'artillerie de 155 mm de l'armée a décliné ; face aux nouvelles menaces à l'horizon, le ministère de la Défense a décidé de ressusciter cette capacité. De nombreux candidats se sont présentés pour ce contrat, dont un seul l'emportera."
 ENG_fres_program: "Programme FRES"
 ENG_fres_program_desc: "Le programme FRES (Future Rapid Effect System) incarne une approche prospective du développement des capacités militaires. Centré sur l'agilité et l'adaptabilité, le FRES vise à doter les forces armées britanniques d'une gamme polyvalente de plates-formes terrestres, y compris des véhicules blindés et des systèmes de soutien."
 ENG_fix_civil_servant: "Corriger le « fonctionnaire »"
 ENG_fix_civil_servant_desc: "Initialement miné par de fréquentes plaintes et des problèmes de performance parmi les troupes, le fusil L85A1 a subi une modernisation d'ensemble face à un entretien difficile et un fonctionnement peu fiable. Souvent surnommé le « fonctionnaire » en raison de sa réputation d'instabilité et de complexité, ces griefs ont conduit à une refonte majeure entre 2000 et 2002. Environ 200 000 des 320 000 fusils automatiques L85A1 existants ont été repris."
 ENG_modern_littoral_force: "Force littorale moderne"
 ENG_trident_nuclear_program: "Programme nucléaire Trident"
 ENG_general_dynamics_ajax: "Dynamique générale Ajax"
 ENG_general_dynamics_ajax_desc: "Le General Dynamics Ajax, véhicule de reconnaissance de pointe, s'est imposé comme une pierre angulaire de la modernisation des forces armées britanniques. Conçu pour les exigences de la guerre moderne, ce blindé agile et avancé intègre des technologies de dernier cri, offrant des capacités de reconnaissance sans précédent."
 ENG_challenger_lethality_improvement_programme: "Programme d'amélioration de la létalité du Challenger"
 ENG_challenger_lethality_improvement_programme_desc: "Le Challenger Lethality Improvement Programme visait à remplacer le canon rayé L30A1 actuel par le canon lisse Rheinmetall de 120 mm déjà utilisé sur le Léopard 2 et le M1 Abrams. L'emploi d'une arme à âme lisse aurait permis au Challenger 2 d'utiliser les munitions standard de l'OTAN, y compris des flèches à énergie cinétique à base de tungstène, qui ne soulèvent pas les mêmes objections politiques et environnementales que les obus à l'uranium appauvri."
 ENG_challenger_3: "Challenger 3"
 ENG_challenger_3_desc: "Le char Challenger 3, développé avec fierté par le Royaume-Uni, incarne la guerre blindée de pointe. Grâce à une technologie de dernier cri, une puissance de feu redoutable et une protection renforcée, le Challenger 3 assure une domination supérieure sur le champ de bataille. Ce char modernisé souligne l'engagement du Royaume-Uni à maintenir une force blindée redoutable, prête à affronter les défis de la guerre contemporaine."
 ENG_modern_landing_craft: "Péniche de débarquement moderne"
 ENG_mechanised_amphibious_assault: "Assaut amphibie mécanisé"
 ENG_aircraft_ai_integration: "Intégration de l'IA dans les avions"
 ENG_aircraft_ai_integration_desc: "Guidé par le principe de la qualité plutôt que de la quantité, le Royaume-Uni privilégie l'excellence et la supériorité technologique de ses forces. Cet esprit national met l'accent sur l'acquisition d'équipements avancés et sophistiqués, assurant une posture de défense redoutable et technologiquement à la pointe. En misant sur la qualité, le Royaume-Uni vise à maximiser l'efficacité de ses forces et à se doter d'un avantage stratégique face aux défis modernes."
 ENG_strike_brigades: "Brigades de grève"
 ENG_future_soldier_armed_forces: "Forces armées Future Soldier"
 ENG_future_soldier_armed_forces_desc: "L'initiative Future Soldier est une stratégie tournée vers l'avenir adoptée par les forces armées, y compris le Royaume-Uni. Elle vise à doter les soldats de technologies et de capacités de pointe, afin d'accroître leur efficacité sur le champ de bataille moderne."
 ENG_joint_expeditionary_force: "Corps expéditionnaire conjoint"
 ENG_joint_expeditionary_force_desc: "Née en 2012 et présentée par le chef d'état-major de la Défense d'alors, le général Sir David Richards, la Joint Expeditionary Force (JEF) est issue de la dissolution de la Joint Rapid Reaction Force (JRRF) alors que le Royaume-Uni privilégiait les opérations en Afghanistan et en Irak. Comprenant du personnel et du matériel de la Royal Navy, des Royal Marines, de l'armée britannique et de la Royal Air Force, la composante britannique de la JEF privilégie une intégration accrue. Cette intégration est particulièrement soulignée lorsqu'il s'agit d'opérer aux côtés des forces armées d'autres nations, ce qui marque un tournant par rapport aux modèles précédents."
 ENG_carrier_group_debate: "Débat du groupe des porte-avions"
 ENG_worldwide_reach: "Portée mondiale"
 ENG_worldwide_reach_desc: "Le Royaume-Uni fut autrefois une superpuissance, capable d'atteindre le monde entier pour protéger ses intérêts. Nous devons retrouver cette puissance afin de préserver nos intérêts à l'échelle du globe."
 ENG_national_service_debate: "Débat sur le service national"
 ENG_national_service_debate_desc: "Une armée fondée sur le volontariat ne peut suivre la demande croissante de troupes britanniques dans le monde. Nous devons accroître la conscription pour y répondre."
 ENG_army_special_operations_brigade: "Brigade d'opérations spéciales de l'armée"
 ENG_reestablish_far_east_command: "Rétablir le commandement de l'Extrême-Orient"
 ENG_reestablish_far_east_command_desc: "Le rétablissement britannique du Far East Command marque une réorientation stratégique vers le renforcement des capacités militaires dans cette région cruciale. Cette initiative implique le déploiement de structures de commandement, d'unités opérationnelles et d'un soutien logistique pour répondre efficacement à l'évolution des dynamiques de sécurité. En consolidant la présence et la coordination en Extrême-Orient, les forces armées britanniques visent à répondre avec justesse aux défis régionaux, à nourrir les partenariats avec les alliés et à contribuer de façon significative à la stabilité de cette partie du monde stratégiquement vitale."
 ENG_britannia_armed_forces: "Forces armées Britannia"
 ENG_britannia_armed_forces_desc: "Grâce à nos efforts pour recréer notre puissance militaire mondiale, nous pouvons enfin dire que nous disposons d'une armée capable de défendre les intérêts britanniques autour du globe."
 ENG_allied_basing_efforts: "Efforts de base alliés"
 ENG_allied_basing_efforts_desc: "L'initiative de basage allié représente un engagement unifié à fortifier les capacités stratégiques des nations membres de l'alliance. Dans ce cadre, le Royaume-Uni bénéficie d'une amélioration soutenue et substantielle des infrastructures, y compris chemins de fer, bases aériennes, ports et davantage. Cette amélioration durable renforce la maîtrise logistique du Royaume-Uni et son efficacité opérationnelle d'ensemble."
 ENG_reactivate_naval_defense_act_1889: "Réactiver la loi de défense navale de 1889"
 ENG_reactivate_naval_defense_act_1889_desc: "En hommage symbolique à une prééminence maritime historique, la réactivation du Naval Defence Act de 1889 marque un engagement tourné vers l'avenir en faveur du renforcement des capacités navales. Cette législation vise à canaliser l'esprit du passé dans la préparation navale moderne. En ravivant les principes de la loi originelle, le Royaume-Uni signale son attachement à une force navale robuste et technologiquement avancée. La loi pourrait prévoir la modernisation des moyens navals, l'extension des infrastructures et des investissements stratégiques pour que la Royal Navy demeure une présence redoutable sur la scène mondiale."
 ENG_royal_navy: "Marine royale"
 ENG_royal_navy_desc: "La Royal Navy britannique s'impose comme l'une des premières forces maritimes du monde, avec un héritage séculaire. Réputée pour son adaptabilité et sa maîtrise technologique, la Royal Navy joue un rôle crucial dans la protection des intérêts maritimes du Royaume-Uni et la projection de puissance à l'échelle mondiale."
 ENG_british_foreign_legion: "Légion étrangère britannique"
 ENG_british_foreign_legion_desc: "Adoptant un modèle de service international, cette légion accueille des ressortissants étrangers souhaitant servir dans l'armée britannique. Conçue pour favoriser la camaraderie, la diversité et un sens du but commun, la Légion étrangère britannique devient une voie unique pour des individus de tous horizons de contribuer à la défense du Royaume-Uni."
 ENG_multi_ocean_navy: "Marine Multi Océan"
 ENG_multi_ocean_navy_desc: "Pour protéger les intérêts britanniques dans le monde, nous devons accroître nos capacités navales afin de frapper à travers les océans."
 ENG_Strategic_Aircraft_Training: "Entraînement des aéronefs stratégiques"
 ENG_Strategic_Aircraft_Training_desc: "À l'époque moderne, il est nécessaire de disposer d'une armée de l'air capable de frapper par-delà tous les océans. Nous devons renforcer nos opérations aériennes stratégiques pour en avoir la possibilité."
 ENG_field_army_expansion: "Expansion de l'armée de campagne"
 ENG_field_army_expansion_desc: "L'initiative d'expansion de l'armée de campagne marque l'engagement stratégique du Royaume-Uni à renforcer ses forces terrestres, afin d'assurer une capacité militaire robuste et adaptable. Cette expansion consiste à accroître la taille et les capacités de l'armée de campagne, qui regroupe les forces terrestres centrales de l'armée britannique."
 ENG_type_31_frigate_inspiration_class: "Classe Inspiration pour les frégates Type 31"
 ENG_type_31_frigate_inspiration_class_desc: "Le Type 31 constitue la moitié polyvalente de la force de frégates, commandé en 2019 à un prix forfaitaire de 250 millions de livres par navire. Babcock construit les cinq bâtiments à Rosyth selon le dessin Arrowhead 140 dérivé de la classe danoise Iver Huitfeldt, une grande coque diesel-électrique armée d'un canon Bofors de 57 mm et du Sea Ceptor, avec une marge délibérée pour des évolutions ultérieures. Inspiration, Active, Bulldog, Campbeltown et Formidable font revivre des noms tirés de toute l'histoire de la flotte."
 ENG_multi_role_support_ship_project: "Projet de navire de soutien polyvalent"
 ENG_multi_role_support_ship_project_desc: "Le Multi Role Support Ship est le successeur prévu d'Albion, de Bulwark et de la classe Bay dans une seule coque flexible. Plutôt qu'un navire-dock conçu pour un unique grand débarquement, il est organisé autour d'une baie de mission, d'un pont d'envol et d'un logement modulaire, afin que le même bâtiment puisse embarquer une force de raid commando, mener une opération de secours ou servir de base avancée pour des systèmes sans pilote."
 ENG_expanded_carrier_wing_procurement: "Acquisition d'ailes de porte-avions élargies"
 ENG_expanded_carrier_wing_procurement_desc: "En investissant dans une aéronavale embarquée élargie, le Royaume-Uni vise à projeter sa puissance, à protéger ses intérêts maritimes et à contribuer de façon significative aux efforts de sécurité internationale. Cette initiative reflète l'attachement de la nation à une force aéronavale moderne et capable dans un paysage de sécurité mondiale en évolution rapide."
 ENG_strategic_aircraft_strategy: "Stratégie des aéronefs stratégiques"
 ENG_strategic_aircraft_strategy_desc: "La stratégie aérienne stratégique définit l'approche du Royaume-Uni en matière d'acquisition, de déploiement et d'emploi des aéronefs stratégiques. Cette stratégie d'ensemble recouvre un éventail de considérations, notamment les priorités de défense nationale, les défis de sécurité mondiale et les avancées technologiques."
 ENG_continent_operational_considerations: "Considérations opérationnelles sur le continent"
 ENG_continent_operational_considerations_desc: "Nous devons prioriser notre engagement envers nos forces armées et nos alliés. Il nous faut donc choisir dans quelle branche de notre armée nous nous spécialiserons."
 ENG_astute_class: "Sous-marin de classe Astute"
 ENG_astute_class_desc: "La classe Astute est la dernière classe de sous-marins d'escadre à propulsion nucléaire en service dans la Royal Navy. Les bâtiments sont construits par BAE Systems Submarines à Barrow-in-Furness."
 ENG_type_45_destroyer_upgrades: "Améliorations du destroyer Type 45"
 ENG_type_45_destroyer_upgrades_desc: "Le projet de modernisation des destroyers Type 45 vise à renforcer les capacités des destroyers Type 45 de la Royal Navy par des technologies avancées et des améliorations de systèmes. Les axes principaux comprennent le radar, les systèmes de combat, la propulsion et la défense antimissile."
 ENG_dreadnought_class: "Sous-marin de classe Dreadnought"
 ENG_dreadnought_class_desc: "Le projet de sous-marins de classe Dreadnought couvre la conception, la construction et l'intégration de la prochaine génération de SNLE pour la Royal Navy. Ces sous-marins disposeront de capacités avancées de furtivité, de propulsion et d'armement stratégique, assurant une dissuasion nucléaire crédible pour le Royaume-Uni."
 ENG_type_26_frigate: "Frégate type 26"
 ENG_type_26_frigate_desc: "Le Type 26, baptisé classe City d'après Glasgow, Cardiff, Belfast et leurs sister-ships, constitue la moitié anti-sous-marine de la force de frégates. Construit par BAE Systems sur la Clyde à partir de 2017, il est conçu autour de la discrétion acoustique : une propulsion diesel-électrique et turbine à gaz montée sur radeau, le sonar remorqué Sonar 2087, et une baie de mission amidships pour embarcations, conteneurs et systèmes sans pilote. Huit navires escorteront les porte-avions et la dissuasion, d'autres coques étant vendues à l'Australie et au Canada."
 ENG_type_83_destroyer: "Destructeur Type 83"
 ENG_type_83_destroyer_desc: "Le destroyer Type 83 est une future classe de destroyers lance-missiles destinée à rejoindre la flotte de la Royal Navy au milieu ou à la fin des années 2030. Cette classe proposée promet des capacités avancées et des caractéristiques modernisées pour répondre aux exigences navales en évolution. Conçu pour la polyvalence et la puissance, le Type 83 représente une avancée pivotale des capacités maritimes de la Royal Navy, assurant préparation et efficacité dans les environnements opérationnels futurs."
 ENG_qinetiq_dragonfire_system: "Système Qinetiq Dragonfire"
 ENG_qinetiq_dragonfire_system_desc: "Dragonfire est un démonstrateur britannique de pointe d'arme à énergie dirigée laser. Présenté à la conférence Defence and Security Equipment International à Londres en 2017, il est développé par UK Dragonfire, un effort conjoint impliquant MBDA UK, Leonardo UK, QinetiQ et le Defence Science and Technology Laboratory. En tant que démonstrateur technologique pivot, Dragonfire subira des essais rigoureux pour évaluer les armes à énergie dirigée laser et leurs applications prospectives au sein des forces armées britanniques, marquant une avancée significative de l'innovation militaire."
 ENG_auxiliary_royal_navy: "Marine royale auxiliaire"
 ENG_auxiliary_royal_navy_desc: "La Royal Navy auxiliaire désigne historiquement les navires à équipage civil qui appuient et complètent les opérations de la Royal Navy en temps de conflit ou de crise."
 ENG_revitalise_merchant_navy: "Revitaliser la marine marchande"
 ENG_revitalise_merchant_navy_desc: "L'Empire britannique fut jadis fondé sur le commerce, et notre flotte marchande mondiale est notre gloire et notre fondement. Que notre flotte marchande s'étende à nouveau à travers le monde."
 ENG_bay_slass_landing_ships: "Navires de débarquement de classe Bay"
 ENG_bay_slass_landing_ships_desc: "Les navires de débarquement de classe Bay sont des bâtiments amphibies polyvalents conçus pour appuyer un éventail d'opérations militaires, y compris l'aide humanitaire, le secours en cas de catastrophe et l'assaut amphibie. Ces navires disposent d'un vaste pont d'envol et d'un radier pour lancer et récupérer barges de débarquement et véhicules amphibies."
 ENG_river_class_patrol_boat: "Bateau de patrouille de classe fluviale"
 ENG_river_class_patrol_boat_desc: "Les patrouilleurs de classe River servent de bâtiments de patrouille hauturière polyvalents, employés pour la sécurité maritime, la protection des frontières et les missions de police. Grâce à leurs systèmes avancés de surveillance et de communication, ces patrouilleurs surveillent efficacement les eaux côtières, protégeant l'intégrité territoriale et les intérêts maritimes. Conçus pour l'endurance et la souplesse, les bâtiments de classe River jouent un rôle critique dans le renforcement de la sécurité maritime et le respect du droit de la mer dans les eaux britanniques et au-delà."
 ENG_point_class_sealift_ships: "Navires de transport maritime de classe ponctuelle"
 ENG_point_class_sealift_ships_desc: "Les navires de transport de classe Point sont des atouts vitaux de la flotte de la Royal Fleet Auxiliary, conçus pour transporter cargo et matériel militaires à l'appui des opérations expéditionnaires. Ces rouliers offrent des capacités polyvalentes de manutention, permettant un chargement et un déchargement efficaces des véhicules et ravitaillements dans divers ports et environnements maritimes. Grâce à leur capacité de transport stratégique, les navires de classe Point contribuent de façon significative aux capacités logistiques du Royaume-Uni, facilitant le déploiement rapide des forces et du matériel en temps de paix comme de conflit."
 ENG_bae_cv90_MkIV: "BAE CV90 MkIV"
 ENG_bae_cv90_MkIV_desc: "Le BAE CV90 Mk IV est une version modernisée du véhicule de combat d'infanterie CV90, intégrant des technologies avancées et des améliorations pour la guerre moderne. Il offre une mobilité, une survivabilité et une puissance de feu accrues, en faisant un atout redoutable pour les unités d'infanterie blindée sur le champ de bataille."
 ENG_expand_sandhurst_academy: "Agrandir l'Académie de Sandhurst"
 ENG_expand_sandhurst_academy_desc: "La Royal Military Academy Sandhurst (RMAS) s'impose comme l'une des premières institutions de formation militaire au monde, réputée pour la rigueur de ses programmes et son engagement à former des chefs d'exception. Fondée en 1802, la RMAS sert d'établissement principal de formation des officiers de l'armée britannique, ainsi que de plusieurs alliés et partenaires internationaux."
 ENG_soldier_welfare_initiative: "Initiative de bien-être des soldats"
 ENG_soldier_welfare_initiative_desc: "En priorisant le bien-être de nos soldats et de leurs familles, cette initiative témoigne de notre engagement à honorer leur service et leur sacrifice tout en favorisant une communauté militaire solidaire et résiliente."
 ENG_mgcs_program: "Programme MGCS"
 ENG_mgcs_program_desc: "Le Main Ground Combat System (MGCS) est un programme de véhicule de combat blindé de nouvelle génération conçu pour doter les forces terrestres de capacités avancées dans les scénarios de guerre moderne. Fruit d'un effort conjoint entre l'Allemagne et la France, le MGCS vise à développer un char de bataille principal polyvalent et technologiquement avancé, capable d'opérer efficacement dans des environnements de champ de bataille divers."
 ENG_royal_airforce_modernisation: "Modernisation de la Royal Air Force"
 ENG_royal_airforce_modernisation_desc: "Par la modernisation de la RAF, la Royal Air Force réaffirme son engagement à maintenir la supériorité aérienne, à projeter sa puissance et à protéger les intérêts nationaux dans un environnement de sécurité mondiale de plus en plus complexe et contesté."
 ENG_watchkeeper_wk450: "Gardien de montre WK450"
 ENG_watchkeeper_wk450_desc: "Le Watchkeeper WK450 est un système aérien sans pilote avancé conçu pour les opérations de renseignement, surveillance et reconnaissance (ISR). Développé par Thales Group, ce drone MALE (moyenne altitude, longue endurance) offre une gamme de capteurs et de caméras sophistiqués pour la surveillance en temps réel et l'acquisition d'objectifs. Grâce à son endurance et à ses capacités de vol autonome, le Watchkeeper WK450 offre aux forces militaires une meilleure conscience situationnelle et la capacité de recueillir un renseignement critique dans divers environnements opérationnels."
 ENG_reaper_purchase: "Achat de faucheuse"
 ENG_reaper_purchase_desc: "Des forces militaires du monde entier ont acquis le MQ-9 Reaper pour renforcer leurs capacités de renseignement, surveillance et reconnaissance (ISR), ainsi que pour conduire des frappes de précision contre des cibles de haute valeur. La capacité du Reaper à patrouiller longtemps au-dessus des zones d'objectif et sa suite de capteurs avancés en font un atout précieux pour le renseignement en temps réel et l'appui aux forces terrestres."
 ENG_missile_development: "Développement de missiles"
 ENG_missile_development_desc: "Nous devons moderniser nos capacités missiles afin de demeurer une armée de l'air moderne."
 ENG_electronic_warfare_measures: "Mesures de guerre électronique"
 ENG_electronic_warfare_measures_desc: "Nous devons moderniser notre informatique pour rester à l'abri des cyberattaques."
 ENG_nato_joint_airforce_training: "Entraînement aérien conjoint de l'OTAN"
 ENG_nato_joint_airforce_training_desc: "Par des scénarios simulés, des exercices en conditions réelles et des événements d'entraînement conjoints, les armées de l'air participantes développent et affinent leurs capacités en combat aérien, opérations air-sol, ravitaillement en vol et défense aérienne. Ces activités d'entraînement favorisent la compréhension mutuelle, la confiance et la coopération entre armées de l'air alliées, assurant qu'elles puissent opérer ensemble sans heurt en coalition et répondre efficacement aux défis de sécurité régionaux et mondiaux."
 ENG_c19_globemasters: "C-17 Globemasters"
 ENG_c19_globemasters_desc: "Le C-17 Globemaster III est un avion de transport aérien stratégique et polyvalent utilisé par des armées de l'air du monde entier pour des missions de transport rapide et à longue distance. Fabriqué par Boeing, cet appareil de transport lourd peut emporter de lourdes charges, y compris troupes, véhicules et aide humanitaire, vers des lieux reculés et des aérodromes austères. Grâce à son avionique avancée, sa configuration à aile haute et ses capacités de décollage et d'atterrissage courts (STOL), le C-17 Globemaster III joue un rôle crucial dans l'appui aux opérations militaires et humanitaires à travers le monde."
 ENG_airbus_a400m: "Airbus A400M"
 ENG_airbus_a400m_desc: "L'Airbus A400M est un avion de transport militaire moderne conçu pour répondre aux exigences opérationnelles de diverses armées de l'air. Doté d'une configuration à aile haute et de turbopropulseurs avancés, l'A400M offre des performances exceptionnelles, notamment des capacités STOL, une longue portée et la faculté d'opérer depuis des pistes semi-préparées."
 ENG_nimrod_mra4: "Nimrod MRA4"
 ENG_nimrod_mra4_desc: "Le Nimrod MRA4 était une version modernisée de l'emblématique avion de patrouille maritime Nimrod, destinée à offrir des capacités renforcées de lutte anti-sous-marine, de surveillance maritime et de recherche et sauvetage. Doté de capteurs, de systèmes de communication et d'équipements de mission avancés, le Nimrod MRA4 offrait des performances et une polyvalence améliorées par rapport à son prédécesseur."
 ENG_apache_wah64: "AgustaWestland Apache"
 ENG_apache_wah64_desc: "L'acquisition et le déploiement de l'hélicoptère Apache AgustaWestland ont marqué une avancée significative de l'arsenal de combat aérien du Royaume-Uni. Plusieurs modifications ont été apportées au dessin Apache standard, notamment un moteur Rolls-Royce amélioré, un mécanisme de pliage des pales pour le stockage, une protection contre le givre du rotor et une capacité roquettes accrue. Introduit pour renforcer les capacités aériennes de la nation, cet hélicoptère d'attaque sophistiqué symbolise un saut en avant dans la technologie aéronautique militaire et l'efficacité opérationnelle stratégique."
 ENG_boeing_p8_poseidon: "Boeing P8 Poséidon"
 ENG_boeing_p8_poseidon_desc: "Le Boeing P-8 Poseidon est un avion de patrouille maritime multimission conçu pour la lutte anti-sous-marine à longue portée, la lutte anti-surface et les opérations de renseignement, surveillance et reconnaissance. Basé sur l'avion de ligne Boeing 737, le P-8 Poseidon intègre des capteurs, des systèmes de communication et des capacités d'armement avancés, en faisant une plate-forme très efficace pour les missions de patrouille maritime."
 ENG_revive_p125_project: "Relancer le projet P125"
 ENG_revive_p125_project_desc: "Le projet P125 relancé vise à développer une plate-forme aérienne polyvalente et économique capable de remplir divers rôles, notamment la supériorité aérienne, l'appui aérien rapproché, la reconnaissance et l'entraînement. En intégrant avionique, capteurs et systèmes d'armes de pointe, l'appareil P125 modernisé offrira des performances, une survivabilité et une efficacité de mission renforcées."
 ENG_joint_strike_fighter_project: "Projet d'avion de combat interarmées"
 ENG_joint_strike_fighter_project_desc: "Grâce à des capacités de furtivité avancées, une fusion de capteurs et des missions multi-rôles, le F-35 Joint Strike Fighter offre une conscience situationnelle et une létalité sans égales dans les opérations air-air et air-sol."
 ENG_bae_systems_tempest: "Tempête de systèmes BAE"
 ENG_bae_systems_tempest_desc: "Le BAE Systems Tempest est un concept de chasseur de sixième génération de pointe conçu pour répondre aux besoins évolutifs de la guerre aérienne moderne. Doté de technologies de furtivité avancées, de capacités de fusion de capteurs et de systèmes autonomes, le Tempest est appelé à offrir des performances, une survivabilité et une létalité renforcées dans les espaces aériens contestés."
 ENG_defence_industrial_policy: "Politique industrielle de défense"
 ENG_defence_industrial_policy_desc: "La politique industrielle de défense britannique définit le cadre stratégique guidant le développement, la gestion et la durabilité de la base industrielle de défense de la nation. Fort d'un riche héritage d'innovation et d'excellence, l'industrie de défense du Royaume-Uni joue un rôle pivot dans le soutien des objectifs de sécurité nationale, la promotion de la prospérité économique et le maintien du leadership technologique sur la scène mondiale."
 ENG_cayman_enterprise_city: "Caïman Enterprise City"
 ENG_cayman_enterprise_city_desc: "Cayman Enterprise City est une zone économique spéciale aux îles Caïmans, offrant une plate-forme unique aux entreprises internationales pour établir une présence physique dans une juridiction fiscalement neutre. Grâce à des procédures simplifiées et des incitations, elle fournit un environnement propice aux entreprises des secteurs de la technologie, des biotechnologies et des médias pour prospérer et croître."
 ENG_illex_fishery: "Pêcherie d'Illex"
 ENG_illex_fishery_desc: "La pêcherie d'Illex est une part vitale de l'économie des îles Malouines, centrée sur la récolte durable du calmar Illex. Gérée avec soin pour assurer sa viabilité à long terme, la pêcherie soutient les moyens de subsistance locaux et contribue à la sécurité alimentaire et à la stabilité économique de la région."
 ENG_north_mole_power_plant: "Centrale électrique de North Mole"
 ENG_north_mole_power_plant_desc: "Située à Gibraltar, la centrale du North Mole joue un rôle crucial pour répondre aux besoins énergétiques du territoire. Équipée de technologies et d'infrastructures modernes, elle fournit une production d'électricité fiable, soutenant la vie quotidienne et les activités économiques des résidents et des entreprises de Gibraltar."
 ENG_biras_creek_resort: "Complexe de Biras Creek"
 ENG_biras_creek_resort_desc: "Niché dans les îles Vierges britanniques, le Biras Creek Resort offre une retraite de luxe au milieu d'une beauté naturelle saisissante. Connu pour ses plages isolées, ses hébergements haut de gamme et son service personnalisé, il constitue une évasion idyllique pour les voyageurs en quête de détente et de ressourcement dans un paradis tropical."
 ENG_bermuda_innovation_sprint: "Sprint d’innovation aux Bermudes"
 ENG_bermuda_innovation_sprint_desc: "Le Bermuda Innovation Sprint est une initiative visant à favoriser l'innovation et l'entrepreneuriat sur l'île. Par des programmes d'accélération, du mentorat et des opportunités de financement, il soutient les start-up et les entreprises technologiques dans le développement de solutions innovantes et la croissance économique des Bermudes."
 ENG_princes_lodge_plantation: "Plantation Princes Lodge"
 ENG_princes_lodge_plantation_desc: "Princes Lodge Plantation est un domaine historique à Sainte-Hélène, mettant en valeur le riche héritage culturel et les traditions agricoles de l'île. Avec son cadre pittoresque et son architecture coloniale préservée, il offre aux visiteurs un aperçu du passé de l'île tout en contribuant au tourisme culturel et à la préservation du patrimoine local."
 ENG_beaches_turks_caicos: "Plages Turks Caicos"
 ENG_beaches_turks_caicos_desc: "Beaches Turks and Caicos est une destination de luxe tout compris, réputée pour ses plages immaculées, ses équipements haut de gamme et son atmosphère familiale. Offrant un large éventail d'activités et de divertissements, elle procure une expérience de vacances inoubliable aux hôtes de tous âges aux îles Turques-et-Caïques."
 ENG_little_bay_port_development_project: "Projet de développement du port de Little Bay"
 ENG_little_bay_port_development_project_desc: "Le projet de développement portuaire de Little Bay vise à renforcer les infrastructures et les perspectives économiques de Montserrat en aménageant une installation portuaire moderne à Little Bay. Grâce à des capacités de transport et de logistique améliorées, il cherche à stimuler le commerce, le tourisme et les opportunités d'investissement sur l'île."
 ENG_pitcairn_islands_study_center: "Centre d'études des îles Pitcairn"
 ENG_pitcairn_islands_study_center_desc: "Le Pitcairn Islands Study Center est une institution de recherche dédiée à l'étude et à la préservation de l'histoire, de la culture et de la biodiversité des îles Pitcairn. Par ses archives, ses publications et ses programmes éducatifs, il promeut la connaissance et l'appréciation de ces territoires reculés et uniques."
 ENG_share_vtol_research: "Partager la recherche VTOL"
 ENG_share_vtol_research_desc: "Le partage de la recherche ADAC implique des initiatives de collaboration et de partage des connaissances entre acteurs industriels et institutions de recherche pour faire progresser la technologie de décollage et d'atterrissage verticaux (ADAC)."
 ENG_channel_homegrown_innovation: "Canaliser l’innovation locale"
 ENG_channel_homegrown_innovation_desc: "En soutenant les start-up nationales, les institutions de recherche et les petites entreprises, elle vise à catalyser le développement de technologies et de solutions de pointe qui répondent aux défis et opportunités clés du secteur. Par la collaboration, le soutien financier et la construction d'un écosystème, elle vise à positionner le Royaume-Uni comme un leader mondial de l'innovation aéronautique, moteur de croissance économique et de compétitivité."
 ENG_revive_british_aviation_industry: "Relancer l’industrie aéronautique britannique"
 ENG_revive_british_aviation_industry_desc: "En promouvant l'investissement, l'innovation et le développement des compétences, elle vise à revitaliser les capacités de production nationales, à renforcer la résilience des chaînes d'approvisionnement et à créer des emplois de qualité à travers le pays."
 ENG_focus_on_component_manufacturing: "Se concentrer sur la fabrication de composants"
 ENG_focus_on_component_manufacturing_desc: "En investissant dans les technologies de fabrication avancées, la formation de la main-d'œuvre et la résilience des chaînes d'approvisionnement, elle vise à capter davantage de valeur et de compétitivité sur le marché aérospatial mondial. Par des partenariats avec les donneurs d'ordre, les fournisseurs de rang et les organisations de recherche, elle cherche à promouvoir l'innovation, l'efficacité et la qualité dans tout l'écosystème des composants aérospatiaux."
 ENG_us_uk_collaboration: "Collaboration États-Unis-Royaume-Uni"
 ENG_us_uk_collaboration_desc: "Les États-Unis sont toujours en quête de bons partenaires. En embrassant les projets aéronautiques britanniques, nous pourrions travailler ensemble pour obtenir davantage de financements et leur apporter une part de notre innovation."
 ENG_skylon_engine: "Moteur Skylone"
 ENG_skylon_engine_desc: "Le moteur Skylon représente une entreprise pionnière de l'industrie aérospatiale britannique, centrée sur le développement de systèmes de propulsion de nouvelle génération. Par l'ingénierie avancée, la science des matériaux et la modélisation computationnelle, cette initiative vise à concevoir et fabriquer des turboréacteurs haute performance offrant une efficacité, une fiabilité et une durabilité exceptionnelles."
 ENG_rebirthing_black_arrow: "Flèche noire renaissante"
 ENG_rebirthing_black_arrow_desc: "La renaissance de Black Arrow commémore l'héritage du programme Black Arrow, projet historique de lanceur spatial britannique. Cette initiative vise à raviver et moderniser l'esprit de l'exploration spatiale au Royaume-Uni en développant des capacités de lancement avancées et des technologies satellitaires."
 ENG_lightweight_fire_platform_artillery: "Artillerie légère à plate-forme de tir"
 ENG_lightweight_fire_platform_artillery_desc: "Le projet Lightweight Fire Platform Artillery vise à développer et déployer un système d'artillerie polyvalent et mobile, optimisé pour un déploiement rapide et un appui-feu de précision. En s'appuyant sur des matériaux légers, des principes de conception modulaire et des systèmes de conduite de tir avancés, cette initiative cherche à renforcer l'agilité, la réactivité et la létalité des unités d'artillerie dans des environnements opérationnels divers."
 ENG_harpoon_replacement: "Remplacement du harpon"
 ENG_harpoon_replacement_desc: "Le programme de remplacement du Harpoon vise à développer un système de missile antinavire de nouvelle génération pour succéder aux missiles Harpoon vieillissants de l'arsenal britannique. En mobilisant des technologies avancées de guidage, de propulsion et de ciblage, cette initiative vise à doter les forces navales d'une portée, d'une précision et d'une létalité renforcées contre les menaces de surface en milieu maritime."
 ENG_codify_service_economy: "Codifier l'économie tertiaire"
 ENG_codify_service_economy_desc: "Depuis des décennies, la Grande-Bretagne a dérivé vers un modèle tertiaire. La finance, le conseil et les médias ont comblé le vide laissé par les usines fermées. Il est temps de faire de cette dérive une stratégie explicite."
 ENG_gate_burton_energy: "Construire le parc énergétique de Gate Burton"
 ENG_gate_burton_energy_desc: "Le parc énergétique de Gate Burton transformera des terres agricoles près de Gate Burton, dans le Lincolnshire, en un grand site solaire et de batteries, injectant de l'électricité propre dans le National Grid et aidant à remplacer une production charbon et gaz vieillissante."
 ENG_gate_burton_energy_tt: "Ajoutez §G1§! §YBattery Park§!"
 ENG_ai_white_collar: "IA pour le travail de bureau"
 ENG_ai_white_collar_desc: "Des cabinets d'avocats aux maisons de comptabilité, les systèmes d'IA commencent à prendre en charge l'analyse de routine et le travail documentaire. Les emplois disparaissent, les marges s'élèvent."
 ENG_empower_city_london: "Renforcer la City de Londres"
 ENG_empower_city_london_desc: "En assouplissant les règles d'urbanisme et en soutenant de nouvelles tours dans le Square Mile, nous encourageons banques et entreprises de services à étendre leur emprise. De nouveaux bureaux de catégorie A s'élèveront plus vite dans la City, ancrant le rôle de Londres comme place financière mondiale."
 ENG_empower_edinburgh: "Renforcez le quartier financier d'Édimbourg"
 ENG_empower_edinburgh_desc: "En soutenant de nouveaux bureaux de catégorie A et des infrastructures autour de New Town et du quartier de l'Exchange, nous aidons les banques et gestionnaires d'actifs d'Édimbourg à étendre leur emprise, renforçant le second centre financier du Royaume-Uni hors de Londres."
 ENG_found_invest_northern_ireland: "Trouvé Investir en Irlande du Nord"
 ENG_found_invest_northern_ireland_desc: "Nous créons Invest Northern Ireland pour promouvoir la région à l'étranger et attirer un flux régulier de nouvelles usines, bureaux et chantiers navals."
 ENG_digital_government: "Refonte du gouvernement numérique"
 ENG_digital_government_desc: "Nous numérisons les services publics, la fiscalité, les licences et les prestations, réduisant la paperasse et les coûts."
 ENG_invest_silicon_glenn: "Investir dans le Silicon Glen"
 ENG_invest_silicon_glenn_desc: "Nous orientons des financements vers la Silicon Glen écossaise, élargissant laboratoires et parcs technologiques pour accélérer la recherche en informatique, internet et intelligence artificielle."
 ENG_cross_border_cooperation: "Coopération transfrontalière"
 ENG_cross_border_cooperation_desc: "Nous approfondissons la coopération pratique entre l'Irlande du Nord et l'Irlande, réduisant la bureaucratie et stimulant le commerce transfrontalier et l'influence."
 ENG_national_data_infrastructure: "Infrastructure nationale de données"
 ENG_national_data_infrastructure_desc: "Nous déployons à l'échelle nationale la fibre, des hubs de données et des réseaux dorsaux pour accélérer les connexions numériques, étendre la portée logistique et affûter la productivité de toute l'économie."
 ENG_admiral_group: "Partenariat avec Admiral Group"
 ENG_admiral_group_desc: "Nous travaillons avec Admiral Group à Cardiff pour étendre la couverture d'assurance privée, allégeant la pression sur les budgets sociaux et de santé."
 ENG_fintech_open_banking: "Fintech et centre bancaire ouvert"
 ENG_fintech_open_banking_desc: "Nous faisons du Royaume-Uni un pôle majeur de la fintech et de l'open banking, augmentant les recettes de l'impôt sur les sociétés tout en abaissant le coût de l'emprunt public."
 ENG_global_consulting_state: "État Conseil Global"
 ENG_global_consulting_state_desc: "Nous soutenons les cabinets de conseil et d'avocats britanniques dans le monde, étendant notre influence, approfondissant les liens de recherche et attirant davantage d'investissements étrangers."
 ENG_lean_manufacturing: "Fabrication allégée"
 ENG_lean_manufacturing_desc: "En déployant robotique, capteurs et flux juste-à-temps dans nos usines, nous remplaçons le travail répétitif par des lignes automatisées. Les usines consomment davantage d'énergie mais emploient moins de travailleurs, tandis que la production et l'efficacité grimpent à chaque série."
 ENG_cloud_isles: "Îles Nuageuses"
 ENG_cloud_isles_desc: "Nous faisons de la Grande-Bretagne un pôle de vastes centres de données et campus cloud. Les bureaux consomment davantage d'énergie pour alimenter les fermes de serveurs, mais les services numériques qu'ils hébergent génèrent des recettes fiscales plus élevées et des percées de recherche plus rapides."
 ENG_algorithmic_finance: "Finance algorithmique"
 ENG_algorithmic_finance_desc: "Nous déployons des moteurs de risque avancés et des systèmes de trésorerie automatisés pour gérer flux de trésorerie, dette et paiements, réduisant la bureaucratie et abaissant les coûts de fonctionnement de l'État."
 ENG_invest_harland_wolff: "Investir dans Harland & Wolff"
 ENG_invest_harland_wolff_desc: "Nous injectons de nouveaux capitaux dans les chantiers Harland & Wolff à Belfast et au-delà, rouvrant des cales, embauchant des ouvriers qualifiés et stimulant la production de nos chantiers navals."
 ENG_critical_minerals_strategy: "Stratégie sur les minéraux critiques"
 ENG_critical_minerals_strategy_desc: "Nous lançons une stratégie nationale des minerais critiques, soutenant de nouveaux projets en Cornouailles, au pays de Galles et au-delà pour sécuriser des minerais clés et améliorer l'accès de la Grande-Bretagne aux ressources vitales."
 ENG_dogger_bank_offshore: "Pôle énergétique offshore de Dogger Bank"
 ENG_dogger_bank_offshore_desc: "Nous soutenons le complexe éolien offshore de Dogger Bank en mer du Nord, construisant le plus grand parc éolien du monde pour fournir de l'électricité propre à des millions de foyers britanniques."
 ENG_hinkley_point_c: "Terminer Hinkley Point C"
 ENG_hinkley_point_c_desc: "Nous avançons le projet à deux réacteurs d'Hinkley Point C dans le Somerset, ajoutant plus de 3 GW de puissance de base bas carbone à long terme au réseau."
 ENG_acknowledge_industrial_collapse: "Reconnaître l'effondrement industriel"
 ENG_acknowledge_industrial_collapse_desc: "De Redcar sur le Teesside à Port Talbot dans le sud du pays de Galles, les hauts fourneaux se sont éteints et des communautés entières ont perdu leur ossature industrielle. Nous devons enfin admettre jusqu'où l'industrie lourde britannique est tombée avant de pouvoir la reconstruire."
 ENG_building_brittain_fit_future: "Bâtir une Grande-Bretagne prête pour l'avenir"
 ENG_building_brittain_fit_future_desc: "Nous lançons une stratégie industrielle de long terme pour stimuler la productivité et le pouvoir d'achat, en investissant dans les idées, les personnes, les infrastructures et les territoires à travers toute la Grande-Bretagne."
 ENG_northern_powerhouse: "Centrale électrique du Nord et moteur Midlands"
 ENG_northern_powerhouse_desc: "Nous relions la Northern Powerhouse et le Midlands Engine en un seul corridor de croissance, soutenant transports, compétences et investissement des entreprises pour hisser la productivité de Liverpool et Manchester jusqu'à Birmingham et les East Midlands."
 ENG_aerospace_wales: "Aérospatiale au Pays de Galles"
 ENG_aerospace_wales_desc: "Nous soutenons le pôle aérospatial gallois autour d'Airbus Broughton, de St Athan et du hub MRO plus large, stimulant la production d'ailes locale, les réparations et les emplois aéronautiques à haute valeur."
 ENG_marine_power_systems: "Soutenir Marine Power Systems"
 ENG_marine_power_systems_desc: "Nous soutenons Marine Power Systems, basée au pays de Galles, pour faire passer à l'échelle les plates-formes éoliennes flottantes et houlomotrices, transformant chantiers et ports locaux en pôles de l'énergie marine de nouvelle génération."
 ENG_develop_edinburgh_west_end: "Développer le West End d’Édimbourg"
 ENG_develop_edinburgh_west_end_desc: "Nous modernisons le quartier de l'Exchange du West End en un mélange plus dense de bureaux, laboratoires et ateliers modernes, stimulant la production de recherche locale et l'efficacité de production tout en ajoutant de l'espace pour l'expansion de nos principales factions."
 ENG_develop_bae_aerospace: "Développer BAE Aerospace en Écosse"
 ENG_develop_bae_aerospace_desc: "Nous élargissons l'empreinte aérospatiale de BAE autour de Prestwick et d'autres sites écossais, ajoutant hangars, ateliers et équipes d'ingénierie pour soutenir les avions de combat avancés et les programmes futurs."
 ENG_glasgow_shipbuilidng: "Centre de construction navale de Glasgow"
 ENG_glasgow_shipbuilidng_desc: "Nous modernisons les chantiers de la Clyde à Govan et Scotstoun, faisant de Glasgow un pôle de long terme pour la construction navale militaire et les exportations navales."
 ENG_high_value_manufacturing_zones: "Zones manufacturières à haute valeur ajoutée"
 ENG_high_value_manufacturing_zones_desc: "Nous désignons des zones de fabrication à haute valeur autour de centres de type Catapult et de parcs scientifiques, donnant aux entreprises un accès plus rapide aux laboratoires, aux compétences et aux installations modernes pour hisser la productivité et la production avancée."
 ENG_high_value_manufacturing_zones_tt: "Si un État a §G5§! §Y$infrastructure$§!, au moins §G10§! §Y$industrial_complex$§!, au moins §G5§! §Y$offices$§!, au moins §G5§! §Y$arms_factory$§! OU §G5§! §Y$dockyard$§! , nous ajouterons par État :"
 ENG_steel_guarantee: "Garantie Acier"
 ENG_steel_guarantee_desc: "Nous engageons des financements et garanties de long terme pour des projets d'acier bas carbone, donnant aux investisseurs la confiance de moderniser les usines et de sécuriser la sidérurgie nationale pour des décennies."
 ENG_steel_guarantee_tt: "§Y[10.GetName],[11.GetName],[12.GetName]§! ou §Y[1191.GetName]§! gagnera :\nPlus de §Y4 $industrial_complex$§! : §G+6§! §Y$country_resource_steel$§!.\nPlus de §Y4 $offices$§! : §G+3§! §Y$country_resource_tungsten$§!.\nToute §Yinstallation§! et §Y$sp_improved_synthetic_diamonds$§! achevé : §G+3§! supplémentaires de §Y$country_resource_chromium$§!."
 ENG_celsa_steel: "Soutenir Celsa Steel à Cardiff"
 ENG_celsa_steel_desc: "Nous soutenons l'aciérie à four électrique et le laminoir à ronds et barres de Celsa à Cardiff, hissant la production d'armatures et de fil machine bas carbone tout en maintenant un grand recycleur et employeur gallois à pleine capacité."
 ENG_expand_scottish_steel: "Développer Scottish Steel"
 ENG_expand_scottish_steel_desc: "Nous investissons dans les usines de Dalzell et Clydebridge pour relancer la production de tôles, sécuriser l'acier écossais pour les navires de guerre et l'éolien offshore, et développer une base sidérurgique lourde moderne au nord de la frontière."
 ENG_refine_natural_bauxite: "Affiner la bauxite naturelle"
 ENG_refine_natural_bauxite_desc: "Nous construisons des installations d'alumine autour d'Édimbourg pour raffiner la bauxite importée en charge de haute qualité, stimulant la production nationale d'aluminium de l'Écosse."
 ENG_deep_mining_coal: "Relancer l'extraction houillère profonde en Écosse"
 ENG_deep_mining_coal_desc: "Nous rouvrons les veines profondes des anciens bassins houillers écossais, creusant de nouveaux puits et reconstruisant l'infrastructure minière pour rétablir la production de charbon souterrain au nord de la frontière."
 ENG_opencast_mining: "Développer les mines à ciel ouvert en Écosse"
 ENG_opencast_mining_desc: "Nous autorisons de nouveaux sites à ciel ouvert dans les bassins houillers écossais, déblayant les morts-terrains pour atteindre les veines peu profondes et stimuler l'approvisionnement national en charbon."
 ENG_cononish_gold_silver: "Travaux d'or et d'argent de Cononish"
 ENG_cononish_gold_silver_desc: "Nous soutenons la mine de Cononish près de Tyndrum, transformant le seul gisement commercial d'or et d'argent d'Écosse en une source régulière de métaux précieux pour la nation."
 ENG_national_productivity_commission: "Commission nationale de la productivité"
 ENG_national_productivity_commission_desc: "Nous établissons une Commission nationale de la productivité pour aligner investissement, infrastructure et politique d'innovation autour d'une seule mission : hisser la productivité dans toute la Grande-Bretagne."
 ENG_infrastructure_for_productivty: "Stratégie nationale d'infrastructures"
 ENG_infrastructure_for_productivty_desc: "Nous mettons en œuvre une stratégie nationale d'infrastructure pour cibler routes, rail et réseaux numériques qui hissent la productivité au lieu de la freiner."
 ENG_universaties_engines_of_growth: "Fonds Forces des territoires"
 ENG_universaties_engines_of_growth_desc: "Nous déployons un fonds de type Strength in Places, soutenant les partenariats université-entreprise à travers l'Angleterre pour transformer les atouts de recherche locaux en emplois, investissements et croissance."
 ENG_hs2: "Lancez High Speed 2"
 ENG_hs2_desc: "Nous donnons le feu vert à High Speed 2, autorisant la première phase entre Londres et les Midlands et nous engageant pour des décennies d'investissement dans le rail à grande vitesse."
 ENG_northern_powerhouse_rail: "Rail de la centrale électrique du Nord"
 ENG_northern_powerhouse_rail_desc: "Nous nous engageons pour Northern Powerhouse Rail, un réseau est-ouest nouveau et modernisé reliant Liverpool, Manchester, Leeds et le Nord plus large avec des trains plus rapides, plus fréquents et une plus grande capacité pour voyageurs et fret."
 ENG_euston_canary_wharf_integration: "Intégrer Euston et Canary Wharf"
 ENG_euston_canary_wharf_integration_desc: "Nous relions le terminus HS2 d'Euston au réseau ferroviaire et du métro est-ouest de Londres, créant des liaisons fluides vers la City et Canary Wharf afin que les voyageurs à grande vitesse atteignent les quartiers financiers de la capitale en quelques minutes."
 ENG_midland_main_lines: "Mise à niveau de la ligne principale de Midland"
 ENG_midland_main_lines_desc: "Nous poursuivons la modernisation et l'électrification de la Midland Main Line entre Londres et les East Midlands, réduisant les temps de trajet et libérant de la capacité pour voyageurs et fret."
 ENG_russel_group: "Universités du Groupe Russell"
 ENG_russel_group_desc: "Nous approfondissons les liens avec les universités intensives en recherche du Russell Group, soutenant des projets conjoints qui transforment une science de premier plan mondial en croissance à travers le pays."
 ENG_golden_triangle_research: "Arc de recherche du Golden Triangle"
 ENG_golden_triangle_research_desc: "Nous approfondissons les liens entre Oxford, Cambridge et les grandes universités londoniennes, bâtissant un arc de recherche du Triangle d'or qui concentre laboratoires, talents et financements de classe mondiale en un seul corridor d'innovation à fort impact."
 ENG_imperial_king_tech_clusters: "Grappes technologiques impériales et royales"
 ENG_imperial_king_tech_clusters_desc: "Nous relions le campus d'innovation White City d'Imperial aux pôles technologiques et de santé de King's, bâtissant des grappes denses où laboratoires, start-up et investisseurs peuvent transformer la recherche de frontière en percées commerciales."
 ENG_skill_england_technical: "Compétences Angleterre et parcours techniques"
 ENG_skill_england_technical_desc: "Nous travaillons avec Skills England pour cartographier les déficits de compétences et élargir les filières techniques et l'apprentissage, offrant à davantage de personnes des voies claires et de qualité vers un métier qualifié."
 ENG_closing_britains_productivity_gap: "Combler l'écart de productivité britannique"
 ENG_closing_britains_productivity_gap_desc: "Après des années d'investissement ciblé dans les infrastructures, les universités et les compétences, notre écart de productivité commence enfin à se refermer, hissant la production par travailleur et donnant à l'économie de la marge pour des salaires plus élevés et de meilleurs services."
 ENG_closing_britains_productivity_gap_tt: "Nous pouvons annuler la pénalité de productivité en recherchant §Y$CAT_infrastructure$§!"
 ENG_ambitions_for_britain: "Ambitions pour la Grande-Bretagne"
 ENG_ambitions_for_britain_desc: "La Grande-Bretagne ne peut être laissée à pourrir tandis que le temps passe. La Grande-Bretagne doit être ambitieuse, et pour cela le peuple britannique a besoin du Parti travailliste. Par la détermination, le Parti travailliste propulsera le Royaume-Uni parmi les plus grands acteurs mondiaux de notre époque. Le nouveau millénaire sera nôtre."
 ENG_deeper_prosperity: "Une prospérité plus profonde"
 ENG_deeper_prosperity_desc: "Nous atteindrons une prospérité plus profonde en créant davantage d'emplois et en incitant nos concitoyens à chercher du travail. Cela ne pourra se faire qu'en créant un environnement durable, notamment par des infrastructures adéquates."
 ENG_every_region_of_the_country: "Chaque région du pays"
 ENG_every_region_of_the_country_desc: "Nos efforts ne seront pas isolés aux grands centres de la société : ils prioriseront chaque région du pays. Nous sommes une union, après tout. Sans répartition égale des ressources, l'État se fracturera et créera des inégalités pour de vastes populations urbaines et rurales."
 ENG_the_foundation: "Le fondement"
 ENG_the_foundation_desc: "Le fondement, le pilier et l'épine dorsale de ce pays, c'est le travailleur acharné qui passe d'innombrables heures au service de sa patrie. Lancer des réformes pour plus de souplesse au travail en matière de congés, de repos et d'arrêts maladie sera un changement important pour maintenir ce pilier de la société."
 ENG_nhs_reform: "Réforme du NHS"
 ENG_nhs_reform_desc: "Le Service national de santé a un besoin désespéré de réforme. Pas un simple changement de surface où l'on appelle à construire de nouveaux hôpitaux et établissements médicaux : nous pousserons plutôt à la synchronisation des secteurs privé et public pour améliorer le NHS, afin de réduire les délais d'attente, moderniser nos installations existantes et accueillir davantage de patients plus rapidement."
 ENG_reinassaince_of_status: "Renaissance du statut"
 ENG_reinassaince_of_status_desc: "Nos concitoyens doivent pouvoir gravir l'échelle sociale et progresser économiquement. Nous devons donc intervenir tôt dans leur vie. En donnant aux établissements d'enseignement supérieur les outils nécessaires, nous rendrons plus accessibles les ressources dont notre peuple a besoin pour avancer dans la société."
 ENG_a_grand_promise: "Une grande promesse"
 ENG_a_grand_promise_desc: "Pour maintenir le soutien à notre parti, nous devrons formuler une grande promesse qui captive nos électeurs. En tenant cette promesse, nous consoliderons la crédibilité de notre coalition et porterons un coup majeur à l'opposition."
 ENG_more_frontline_staff: "Plus de personnel de première ligne"
 ENG_more_frontline_staff_desc: "Nous devons favoriser la productivité agricole en encourageant davantage de personnel de première ligne à rejoindre le travail. Par des programmes d'incitation, nous pourrons reconstruire l'esprit agricole chancelant de notre pays."
 ENG_foster_the_tech_revolution: "Favoriser la révolution du silicium"
 ENG_foster_the_tech_revolution_desc: "Une nouvelle révolution se déploie sous nos yeux : la révolution du silicium. Par la technologie, les économies mondiales commencent à basculer comme jamais. D'anciennes sociétés rurales et agricoles se transforment en économies redoutables grâce aux microprocesseurs et autres composants électroniques. Nous aussi devons capitaliser sur cette tendance dès que possible."
 ENG_uplift_traditional_industry: "Rehausser l’industrie traditionnelle"
 ENG_uplift_traditional_industry_desc: "Nous n'avons pas besoin de la mode électronique dont une grande partie du monde s'entiche. Nous pouvons plutôt nous concentrer sur ce qui a historiquement fonctionné : l'industrie dure. Pourquoi parier sur des choses si futiles qui pourraient mettre notre économie en péril ?"
 ENG_prioritize_the_teachers: "Prioriser les éducateurs"
 ENG_prioritize_the_teachers_desc: "Valoriser le rôle des éducateurs dans la société aura d'énormes bénéfices qui résonneront à travers la nation et la région. En établissant leur place dans la vie quotidienne des civils [ENG.GetAdjective], les gens commenceront enfin à apprécier l'éducation pour ce qu'elle est vraiment."
 ENG_prioritize_the_doctors: "Prioriser les médecins"
 ENG_prioritize_the_doctors_desc: "Les médecins empêchent les gens de mourir, ils empêchent la propagation des maladies et ils maintiennent un plus large sentiment de sécurité dans notre pays. En faisant avancer le rôle des médecins et du personnel médical, nous pourrons aussi encourager davantage de personnes à pourvoir les postes du NHS gravement sous-effectifs."
 ENG_strengthening_communities: "Renforcer les communautés"
 ENG_strengthening_communities_desc: "Renforcer les communautés et, par ricochet, l'identité britannique nous permettra de favoriser un plus grand sentiment d'unité nationale. Cela nous permettra de protéger les valeurs que nous chérissons le plus tout en créant une cohésion sociale plus efficace."
 ENG_to_europa_and_beyond: "Vers l'Europe et au-delà !"
 ENG_to_europa_and_beyond_desc: "Nous sommes Européens d'abord, Britanniques ensuite. Oublier notre foyer régional, c'est oublier qui nous sommes. Nous devons poursuivre une intégration plus profonde avec le continent européen et l'Union européenne dans son ensemble, afin de soutenir la plus grande vision de tous les peuples européens."
 ENG_no_one_left_behind: "Personne n'est laissé pour compte"
 ENG_no_one_left_behind_desc: "Pas un seul Britannique ne sera laissé en arrière dans notre sprint vers la grandeur. Chacun sera aidé et conduit jusqu'à la ligne d'arrivée de la société, et ensemble nous endurerons cette grande lutte vers le succès."
 ENG_criminal_justice_reform: "Réforme de la justice pénale"
 ENG_criminal_justice_reform_desc: "Renforcer notre système judiciaire renforcera aussi nos normes démocratiques de longue date. En fluidifiant le processus judiciaire, la confiance dans nos institutions démocratiques augmentera et un soutien de long terme au gouvernement sera plus susceptible de s'établir."
 ENG_welfare_reform: "Réforme de la protection sociale"
 ENG_welfare_reform_desc: "Établir une relation crédible avec nos électeurs ne pourra se faire qu'en réformant notre système social. En montrant que nous nous soucions de leur quotidien, nous leur donnerons une douzaine de raisons de continuer à nous élire."
 ENG_tax_reform: "Réformes fiscales"
 ENG_tax_reform_desc: "§R« A-attendez… où est passé mon argent ?! »§!\n\nEn votant des réformes fiscales, non seulement nous renforcerons notre économie et notre Trésor, mais nous avancerons aussi vers le financement de nos programmes de réforme sociale. Cela pourrait toutefois être un peu impopulaire auprès de ceux qui seront taxés."
 ENG_productivity_challenge: "Le défi de la productivité"
 ENG_productivity_challenge_desc: "Nous trouvons de plus en plus difficile d'amener une partie de nos travailleurs à… travailler. En poussant certains changements, nous pourrons peut-être les inciter à redevenir productifs."
 ENG_britain_forward_not_back: "La Grande-Bretagne en avant, pas en arrière"
 ENG_britain_forward_not_back_desc: "Il nous suffit de regarder devant pour voir où nous allons, et si nous ne prenons pas en main notre avenir, notre destin sera entre les mains du sort. Nous ne voulons pas cela. Nous voulons diriger notre pays vers la grandeur, et cela ne pourra se faire qu'en établissant d'abord ce que nous devons accomplir pour y parvenir."
 ENG_competition_planning_and_regulation: "Planification et régulation de la concurrence"
 ENG_competition_planning_and_regulation_desc: "Il ne peut y avoir de concurrence sans régulation. Sans garde-fous adéquats, les entreprises dérailleront et absorberont les plus petites, éliminant essentiellement des revenus pour des milliers sinon des millions de personnes."
 ENG_new_rights_new_choices: "Nouveaux droits, nouveaux choix"
 ENG_new_rights_new_choices_desc: "En donnant à notre peuple davantage de droits sur le moment où il veut travailler, nous pourrons stimuler la productivité nationale. Actuellement, certains lieux de travail restreignent l'emploi à ceux qui n'ont pas dépassé l'âge de la retraite, les autres étant peu à peu poussés dehors. En donnant à ceux qui ont dépassé le seuil de la retraite la possibilité de retravailler, nous apporterons une plus grande stabilité économique."
 ENG_supporting_science: "Soutenir la science"
 ENG_supporting_science_desc: "En soutenant de nouvelles méthodes d'extraction scientifique, nous pourrons accroître notre capacité à alimenter les programmes de recherche nationaux et à exporter davantage de biens sur la scène internationale."
 ENG_codify_key_of_convetions: "Codifier la clé des conventions"
 ENG_codify_key_of_convetions_desc: "En codifiant enfin la clé des conventions, nous transformerons enfin les règles politiques en règles juridiques. Notre politique ne sera plus dictée par la tradition, mais par la loi, et par là nous pourrons avancer davantage vers une meilleure démocratie."
 ENG_generations_of_tomorrow: "Les générations de demain"
 ENG_generations_of_tomorrow_desc: "Réformer le système de retraites nous permettra enfin d'établir un filet de sécurité concret pour nos générations actuelles et futures. Actuellement, beaucoup reçoivent soit une allocation trop faible, soit aucune, et il est grand temps d'y remédier."
 ENG_fostering_entrepreneurship: "Favoriser l’entrepreneuriat"
 ENG_fostering_entrepreneurship_desc: "Nous voulons que les innovateurs affluent dans notre pays, et pour cela nous devons commencer à allouer des fonds publics afin de créer un environnement durable pour ceux qui sont prêts à investir."
 ENG_modern_transport_infrastructure: "Modernisation des infrastructures de transport"
 ENG_modern_transport_infrastructure_desc: "Si nos routes sont toutes défoncées et cassées, à quoi bon conduire ? Investir dans des programmes d'infrastructure nouveaux et innovants pavera la voie vers une Grande-Bretagne meilleure et plus fonctionnelle."
 ENG_thriving_rural_scene: "Une scène rurale prospère"
 ENG_thriving_rural_scene_desc: "Nos peuplements ruraux ne peuvent être abandonnés aux vents de l'histoire et oubliés. Nous embrasserons au contraire ces zones rurales et encouragerons davantage leurs activités."
 ENG_scraping_the_skies: "Frôler les cieux"
 ENG_scraping_the_skies_desc: "Si nous voulons bâtir notre image sur la scène internationale, nous aurons besoin de tours, plus précisément de tours qui émerveilleront le monde par leur magnificence."
 ENG_creative_cities: "Villes créatives"
 ENG_creative_cities_desc: "En favorisant les influences culturelles pour concevoir de nouveaux lieux urbains, nous créerons les conditions parfaites pour renforcer l'esprit et le moral de notre peuple, où qu'il aille."
 ENG_party_of_pensior_poverty: "Le parti de la pauvreté des retraités"
 ENG_party_of_pensior_poverty_desc: "Les conservateurs, les tories, ou le « parti de la pauvreté des retraités » comme nous aimons les appeler, dégradent l'intégrité de notre secteur social et ruinent activement les moyens de subsistance de ceux qui dépendent des pensions pour s'en sortir. Nous devons agir pour que le peuple soit conscient de leurs pratiques rétrogrades."
 ENG_fostering_home_ownership: "Favoriser l’accession à la propriété"
 ENG_fostering_home_ownership_desc: "Plutôt que d'inciter les gens à vivre de fonds publics, nous les aiderons plutôt à acquérir un logement pour eux et leurs proches. Ainsi, ils pourront dormir tranquilles en sachant qu'ils n'habitent pas un lot qui n'est pas le leur."
 ENG_social_housing: "Programmes de logement social"
 ENG_social_housing_desc: "Soyons réalistes : les prix de l'immobilier commencent à s'envoler et rien n'indique qu'ils s'arrêteront. Nous devons pousser des programmes de logement social qui offriront à nos électeurs un toit et une protection contre les éléments."
 ENG_copyright_in_a_digital_age: "Le droit d'auteur à l'ère du numérique"
 ENG_copyright_in_a_digital_age_desc: "Nos lois sur le droit d'auteur ne sont pas là où elles devraient être, de nombreuses clauses étant omises ou laissées floues. Nous devons codifier nos règlements et accorder davantage de protection aux médias."
 ENG_strengthening_our_grids: "Renforcer nos réseaux"
 ENG_strengthening_our_grids_desc: "Notre peuple a besoin d'une énergie forte, fiable et constante pour vaquer à ses occupations. Une panne aléatoire ici ou là est inévitable, mais cela ne devrait pas être le quotidien. En renforçant nos grands réseaux, nous assurerons la fiabilité de notre secteur énergétique."
 ENG_strengthen_pension_credit: "Renforcer le crédit de pension"
 ENG_strengthen_pension_credit_desc: "En offrant une prestation publique aux personnes au-delà de l'âge légal de la retraite qui ont de faibles revenus, nous pourrons porter leur revenu hebdomadaire à un niveau minimum et les aider pour le logement et d'autres dépenses."
 ENG_the_workers_of_yesterday: "Les travailleurs d'hier"
 ENG_the_workers_of_yesterday_desc: "Nous ne pouvons laisser le labeur d'hier se perdre : nous intensifierons les programmes de retraite pour ceux qui sont à la retraite et offrirons peut-être d'autres avantages s'ils décident de transmettre leur expertise aux nouvelles générations."
 ENG_tenant_regulation: "Règlement sur les locataires"
 ENG_tenant_regulation_desc: "Nous ne devons pas abandonner les propriétaires qui louent leurs biens. Les propriétés doivent être respectées, et des réglementations sont donc nécessaires pour que chacun y trouve son compte."
 ENG_a_future_fair_for_all: "Un avenir équitable pour tous"
 ENG_a_future_fair_for_all_desc: "Il semble qu'à mesure que le monde évolue, les conditions de vie des gens continuent de se dégrader. Après l'excitation qui a suivi l'aube du nouveau millénaire, des peuples remplis d'espoir ont cru que leurs gouvernements changeraient enfin pour le mieux. Ce ne fut pas le cas. Recul démocratique, hausse des coûts et chaos d'ensemble ont égaré le monde. Nous devons tout faire pour que le Royaume-Uni ne bascule pas dans cette spirale mortelle."
 ENG_crime_and_immigration: "Criminalité et migration"
 ENG_crime_and_immigration_desc: "Des voix à droite ont appelé à des restrictions accrues sur les migrants. Si nous comprenons d'où elles viennent, céder à leurs exigences signifierait s'éloigner des principes fondamentaux de notre parti et glisser dans une direction plus conservatrice."
 ENG_democratic_reform: "Poursuivre la réforme démocratique"
 ENG_democratic_reform_desc: "Il existe actuellement certaines failles qui permettent des décisions plus autocratiques au niveau de l'État. Il est temps de prendre les choses en main et de pousser enfin un projet de loi au Parlement qui forcera la main de ceux qui profitent de cette ambiguïté politique."
 ENG_a_global_future: "Un avenir mondial"
 ENG_a_global_future_desc: "Nous ne pouvons nous concentrer uniquement sur les affaires de l'État : nous devons aussi prêter attention aux questions mondiales. En tenant compte de la souveraineté des autres États, nous viserons à répandre l'influence [ENG.GetAdjective] dans le monde entier."
 ENG_national_renewal: "Renouveau national"
 ENG_national_renewal_desc: "La réorientation de la politique [ENG.GetAdjective] a donné naissance à une sorte de mouvement de renouveau national, où les gens continuent d'exiger le changement. Nous ne nous arrêterons ni ne nous reposerons, et nous ne cesserons de livrer du changement. Du bon changement."
 ENG_with_open_arms: "À bras ouverts"
 ENG_with_open_arms_desc: "Nous devons reconnaître l'importance des migrants. Que nous le fassions à bras ouverts ou non, si nous continuons à les repousser, nous passerons à côté de talents sérieux que nous n'obtiendrions pas autrement."
 ENG_community_payback: "Programme de travaux d'intérêt général"
 ENG_community_payback_desc: "Le programme de réparation communautaire visera à permettre aux communautés de déterminer comment les criminels doivent être punis. Cela peut aller de la durée de peine au type de travaux d'intérêt général. Tout sera entre les mains des communautés locales, mais la nation entière en bénéficiera."
 ENG_checks_on_migration: "Contrôles sur la migration"
 ENG_checks_on_migration_desc: "Quelque besoin que nous ayons de migrants, nous ne pouvons simplement les laisser entrer sans aucun filtrage préalable. Nous établirons des contrôles sur les migrants pour nous assurer qu'ils n'entendent vraiment aucun mal."
 ENG_australian_style_point_system: "Système basé sur des points de style australien"
 ENG_australian_style_point_system_desc: "En suivant les traces de nos amis australiens, nous établirons un système à points où les migrants sont admis selon leurs compétences et leur capacité à contribuer à la nation."
 ENG_tough_on_anti_social_behavior: "Fermeté face à l'incivilité"
 ENG_tough_on_anti_social_behavior_desc: "Notre peuple doit être incité à travailler. Rester chez soi toute la journée n'accomplira rien. Nous pourrons amener les jeunes au travail en leur permettant de faire des stages auprès de la police et des forces militaires, notamment dans les industries de défense."
 ENG_renewed_police_budget: "Budget renouvelé des services de police"
 ENG_renewed_police_budget_desc: "Notre police ne peut rester sous-financée : nous devons reconnaître l'importance d'une force de police forte et robuste qui veillera à ce que nos communautés restent en sécurité."
 ENG_established_refugee_programs: "Établir des programmes pour les réfugiés"
 ENG_established_refugee_programs_desc: "Sans un programme de réfugiés adéquat, ceux qui fuient leur foyer arriveront chez nous sans rien à offrir. Nous créerons un plan d'ensemble qui intégrera les réfugiés à la société et les fera contribuer à l'économie de la nation."
 ENG_streamlined_citizenship_process: "Processus de citoyenneté simplifié"
 ENG_streamlined_citizenship_process_desc: "Allons droit au but : ajouter des obstacles supplémentaires pour obtenir la citoyenneté n'est pas nécessaire. Permettre une intégration plus rapide sera plus bénéfique pour tous à long terme."
 ENG_neighbourhood_police_teams: "Équipes de police de quartier"
 ENG_neighbourhood_police_teams_desc: "Au lieu d'augmenter les coûts de police, nous pouvons faire l'inverse. En appelant les quartiers à former des équipes de police, nous décentraliserons la justice juste assez pour que les crimes soient signalés aux autorités compétentes et traités sans que des patrouilles soient partout en même temps."
 ENG_cctv_reduce_fear: "La vidéosurveillance réduit la peur"
 ENG_cctv_reduce_fear_desc: "Les caméras dans les espaces publics sont une part essentielle du maintien de la sécurité nationale et civile. Si le peuple sait que les criminels seront attrapés, il restera serein tandis que les criminels y réfléchiront à deux fois avant de commettre un crime."
 ENG_britain_can_be_better: "La Grande-Bretagne peut mieux faire"
 ENG_britain_can_be_better_desc: "Avec un changement et une réforme adéquats, la Grande-Bretagne peut aller mieux. Ce n'est pas dire qu'elle va mal aujourd'hui, mais il y a toujours place à l'amélioration. Le peuple britannique a confié à notre parti, le Parti travailliste, de mener la Grande-Bretagne vers la réforme. Nous ne pouvons le décevoir, et nous devons tout faire pour que ses voix soient entendues."
 ENG_more_power_to_people: "Plus de pouvoir au peuple"
 ENG_more_power_to_people_desc: "Le pouvoir du gouvernement doit être entre les mains du peuple. Les politiciens sont issus du peuple eux-mêmes, après tout. Nous ne devons pas permettre à des dynasties politiques de s'élever et de tout prendre."
 ENG_westminster_reinforced: "Westminster renforcé"
 ENG_westminster_reinforced_desc: "Parfois le peuple ne sait pas exactement ce qu'il demande. Dans de tels cas, l'implication du gouvernement doit s'accroître et des experts politiques doivent intervenir et décider à sa place."
 ENG_further_digital_governance: "Poursuite de la gouvernance numérique"
 ENG_further_digital_governance_desc: "Les gens devraient pouvoir interagir plus librement avec le gouvernement. Internet est l'outil parfait pour cela, et en permettant au peuple d'accéder aux ressources publiques par le numérique, nous pourrons étendre nos capacités de gouvernance sans trop de difficulté."
 ENG_a_union_of_nations: "Une union de nations"
 ENG_a_union_of_nations_desc: "La Grande-Bretagne n'est pas une nation, c'est une union de nations. Nous veillerons à ce que chaque nation soit représentée fidèlement, et cela se fera par notre capacité à leur donner accès aux opportunités économiques."
 ENG_reconsider_the_lobbying_act: "Reconsidérer le Lobbying Act"
 ENG_reconsider_the_lobbying_act_desc: "Le Lobbying Act a souvent été accusé d'avoir grandement amélioré la transparence gouvernementale en exigeant des groupes de lobbying qu'ils révèlent leurs financements, des plafonds de dépenses, et ainsi de suite. Cela a toutefois aussi affecté nos activités, et certains appellent à une révision de la loi."
 ENG_people_led_constitutional_convention: "Convention dirigée par le peuple"
 ENG_people_led_constitutional_convention_desc: "Nous appellerons le peuple à diriger la convention constitutionnelle, permettant à la pluralité de remplacer la singularité. Par le vote du peuple, sa confiance en nous sera éternellement assurée."
 ENG_corporaet_led_constitutional_convention: "Convention dirigée par l'entreprise"
 ENG_corporaet_led_constitutional_convention_desc: "Les entreprises savent ce qui est le mieux pour la Grande-Bretagne. Nous devons donc prioriser leurs intérêts dans la direction du pays avant quiconque : après tout, ce sont elles qui ont l'argent."
 ENG_revised_town_laws: "Lois municipales révisées"
 ENG_revised_town_laws_desc: "Certaines lois municipales conservent encore des règles et règlements fort datés. Mieux vaut commencer à les nettoyer, d'autant que certaines perturbent l'activité de certaines industries."
 ENG_replacing_the_house_of_lords: "Remplacer la Chambre des lords"
 ENG_replacing_the_house_of_lords_desc: "La Chambre des lords est l'une des plus anciennes institutions du monde, et pourtant l'une des plus rétrogrades. Leur ingérence constante au Parlement en a fait un casse-tête pour le vote des lois, et il faut faire quelque chose."
 ENG_ulift_peerages: "Élever les pairs"
 ENG_ulift_peerages_desc: "La première étape pour empêcher la Grande-Bretagne de glisser hors de ses traditions est d'élever les pairies. Avec les pairies, nous pourrons protéger nos traditions et la culture de cour."
 ENG_abolish_life_peerages: "Abolir les pairs à vie"
 ENG_abolish_life_peerages_desc: "Les pairies ne s'élisent pas : elles sont entièrement héréditaires ou de nomination. Il n'y a rien de démocratique dans les pairies, et les abolir limitera sévèrement les influences aristocratiques."
 ENG_common_expertise: "Expertise commune"
 ENG_common_expertise_desc: "Nous avons besoin de l'expertise de l'homme du commun, pas de celle de l'entreprise, du politicien ou de l'étranger. Nous avons besoin de vraies gens du royaume commun pour guider la nation vers un avenir plus lumineux et meilleur."
 ENG_technocratic_expertise: "Expertise technocratique"
 ENG_technocratic_expertise_desc: "Ceux qui ont prouvé leur valeur sont presque toujours riches et éduqués. Faire entrer leur expertise au gouvernement propulsera le progrès de la Grande-Bretagne au décuple."
 ENG_labour_for_workers_and_ceos_alike: "Travaillistes : pour les ouvriers comme pour les PDG"
 ENG_labour_for_workers_and_ceos_alike_desc: "Nous devons nous abstenir d'aliéner les PDG et les échelons supérieurs de la société. Nous devons plutôt les apaiser et travailler à des négociations et des compromis qui permettront de meilleures réglementations du travail."
 ENG_the_queens_family: "La famille de la Reine"
 ENG_the_queens_family_desc: "La force du souverain ne réside pas seulement dans la loi ou la tradition, mais dans le cercle qui se tient derrière elle lorsque l'État est sous tension. Ceux qui sont invités dans le cercle intérieur de la Reine porteront de l'influence en son nom, mais ils ne doivent jamais confondre proximité et autorité. La Couronne est la seule constante, et la Reine décidera comment sa famille la sert."
 ENG_the_prince_trust: "Le Prince's Trust"
 ENG_the_prince_trust_desc: "La Couronne dure parce qu'elle s'adapte, et peu d'instruments se sont révélés plus pratiques que le Prince's Trust. En élargissant sa portée, nous transformons le patronage royal en opportunités mesurables, formation, apprentissages et une échelle de retour dans la société pour ceux qui sont laissés pour compte. C'est du soft power aux résultats concrets, et cela renforce la monarchie là où cela compte le plus : dans la vie des Britanniques ordinaires."
 ENG_harmony_doctrine: "La doctrine de l'harmonie"
 ENG_harmony_doctrine_desc: "À une époque de polarisation, l'autorité de la monarchie réside dans sa capacité à unifier sans gouverner. Nous ferons avancer une doctrine de l'harmonie, médiation discrète entre gouvernement, industrie, communautés de foi et société civile, pour réduire la fracture et reconstruire la cohésion nationale. L'État peut commander, mais la Couronne peut réconcilier."
 ENG_climate_alarm_bell: "Sonner l'alarme climatique"
 ENG_climate_alarm_bell_desc: "Les avertissements ne sont plus théoriques, et le délai a désormais un coût national. Nous userons du poids de la tribune de l'héritier pour imposer le risque climatique à tous les ordres du jour, de la sécurité énergétique à la résilience alimentaire et à la planification des infrastructures. Quand le Palais parle avec clarté, même les ministères les plus réticents écoutent."
 ENG_duchy_originals: "Originaux du duché"
 ENG_duchy_originals_desc: "Le duché peut être plus que de la tradition : il peut prouver qu'une intendance moderne est rentable. Nous élargirons Duchy Originals comme modèle de production durable, de chaînes d'approvisionnement éthiques et d'entreprise rurale qui maintient les communautés viables sans les vider. Si la Couronne doit donner l'exemple, que ce soit un exemple qui paie son chemin."
 ENG_heir_of_the_realm: "Héritier du royaume"
 ENG_heir_of_the_realm_desc: "Le règne d'Elizabeth a défini une ère, mais le royaume doit toujours regarder ce qui vient ensuite. Nous formaliserons le rôle national de l'héritier : plus de visibilité, un accès plus profond aux briefings d'État et une présence plus claire à travers l'Union. La continuité ne se présume pas ; elle se prépare."
 ENG_naval_prince: "Le prince naval"
 ENG_naval_prince_desc: "Le service royal n'est pas du théâtre : c'est une revendication de crédibilité gagnée en uniforme. Nous placerons l'identité navale du duc d'York au premier plan des efforts cérémoniels et de recrutement, renforçant le lien entre Couronne et Flotte. Dans des mers incertaines, les symboles du devoir peuvent encore raffermir la nation."
 ENG_naval_prince_tt: "Débloque §Y$ENG_prince_andrew_leader_name$§! au §YHaut commandement militaire§!"
 ENG_appoint_trade_representative: "Nommer un représentant commercial royal"
 ENG_appoint_trade_representative_desc: "L'influence britannique voyage le mieux lorsqu'elle arrive à la fois avec un mandat gouvernemental et le prestige royal. Nous nommerons un représentant commercial royal pour ouvrir des portes, rassurer les partenaires et donner aux exportateurs un avocat de haut profil dans les négociations. Là où les ministres marchandent, la Couronne peut conférer."
 ENG_emerging_markets_circuit: "Le circuit des marchés émergents"
 ENG_emerging_markets_circuit_desc: "La croissance mondiale se déplace, et la Grande-Bretagne ne peut se permettre d'être une invitée tardive. Nous lancerons un circuit des marchés émergents de visites, forums d'investissement et introductions stratégiques conçus pour ancrer les entreprises britanniques dans la prochaine vague de demande mondiale. L'objectif est simple : des relations maintenant, un levier plus tard."
 ENG_digital_enterprise_patronage: "Parrainage de l'entreprise numérique"
 ENG_digital_enterprise_patronage_desc: "Le commerce s'écrit de plus en plus en code, non en cargaison. Nous userons du patronage royal pour élever l'entreprise numérique britannique — fintech, cybersécurité, services avancés et les start-up qui les font croître — transformant le prestige en investissement et l'investissement en emplois. Si le Palais peut se moderniser, l'économie aussi."
 ENG_duty_of_the_crown: "Devoir de la Couronne"
 ENG_duty_of_the_crown_desc: "Un titre royal n'est pas un bouclier, c'est une obligation. Nous cadrerons le rôle public du duc autour d'un service visible, d'une représentation disciplinée et de résultats qui justifient la place de l'institution dans la vie nationale. Dans une monarchie, le devoir est la seule monnaie qui ne se dévalue jamais."
 ENG_workhorse_of_the_crown: "Cheval de labour de la Couronne"
 ENG_workhorse_of_the_crown_desc: "La monarchie survit à plus que le spectacle : elle survit à un service implacable et visible. Nous élèverons le modèle de devoir de la princesse royale — agendas pleins, engagements locaux et suivi discret — en la norme que le public reconnaît comme un vrai travail. Quand la Couronne est mise en question, c'est la réponse qu'elle devrait donner."
 ENG_carers_recognition_campaign: "Campagne de reconnaissance des soignants"
 ENG_carers_recognition_campaign_desc: "Les soins en Grande-Bretagne sont souvent assurés par des gens qui reçoivent peu de reconnaissance et encore moins de repos. Nous lancerons une campagne nationale de reconnaissance des aidants sous patronage royal, poussant l'État et la société civile à soutenir les aidants non rémunérés par un soulagement pratique et le respect public. Un pays qui honore le service à l'étranger doit aussi honorer le service à domicile."
 ENG_discipline_service: "Discipline dans le service"
 ENG_discipline_service_desc: "Une Couronne qui dérive devient une cible ; une Couronne disciplinée redevient une institution. Nous resserrerons les normes de conduite, affûterons les routines de la maison et exigerons une performance professionnelle dans chaque devoir public. L'exemple d'Anne n'est pas glamour, mais il est durable."
 ENG_princess_admiral_royal_navy: "Princesse amiral de la Royal Navy"
 ENG_princess_admiral_royal_navy_desc: "La Royal Navy est plus que du matériel : c'est tradition, identité et portée nationale. Nous approfondirons le rôle naval de la princesse royale pour renforcer le moral, le recrutement et le lien du service avec la nation. En temps de paix comme en crise, la Flotte doit savoir que la Couronne se tient à ses côtés."
 ENG_princess_admiral_royal_navy_tt: "Débloque §Y$ENG_princess_anne_leader_name$§! au §YHaut commandement militaire§!"
 ENG_colonel_of_horse_logistics: "Colonel de cavalerie et de logistique"
 ENG_colonel_of_horse_logistics_desc: "Les armées avancent par la discipline et la logistique, non par les discours. Nous formaliserons les nominations militaires de la princesse royale pour mettre l'accent sur la préparation, le soutien et la compétence sans éclat qui gagne les campagnes. Une force moderne a besoin de champions qui respectent le travail derrière la ligne de front."
 ENG_quiet_professionalism: "Un professionnalisme discret"
 ENG_quiet_professionalism_desc: "Il y a du pouvoir dans la retenue et de la crédibilité dans la constance. Nous ferons du professionnalisme discret la philosophie opérationnelle du Palais : moins de théâtralité, plus de résultats, et une présence stable à travers l'Union. Si la Grande-Bretagne veut une monarchie qui gagne sa place, c'est ainsi qu'elle le fait."
 ENG_chairman_international_award: "Président du Prix international"
 ENG_chairman_international_award_desc: "L'héritage se préserve par des institutions qui survivent à n'importe quel règne. Nous renforcerons la direction du duc du Prix international pour bâtir des compétences pratiques, la confiance civique et le leadership de la prochaine génération. Une monarchie qui investit dans la jeunesse investit dans son propre avenir."
 ENG_trustee_network: "Le réseau des administrateurs"
 ENG_trustee_network_desc: "L'influence ne se déclare pas ; elle se maintient par les conseils, les œuvres et la machinerie discrète de la vie publique. Nous élargirons un réseau d'administrateurs qui relie des institutions crédibles au patronage royal, améliorant la coordination et élevant les normes du secteur. Quand la Couronne organise la responsabilité, elle gagne l'autorité."
 ENG_commonwealth_youth_outreach: "Sensibilisation des jeunes du Commonwealth"
 ENG_commonwealth_youth_outreach_desc: "Le Commonwealth ne durera pas par la seule cérémonie : il doit sembler pertinent aux jeunes. Nous lancerons un effort d'ouverture soutenu d'échanges, de programmes de formation et d'initiatives civiques conjointes pour garder les liens britanniques vivants dans la vie des futurs dirigeants. Le soft power est le plus fort quand il est personnel."
 ENG_production_guild_patronage: "Patronage des guildes de production"
 ENG_production_guild_patronage_desc: "L'industrie est autant culture que commerce, et les secteurs créatifs et de production britanniques sont des atouts stratégiques. Nous userons du patronage royal pour défendre les guildes, studios et métiers qualifiés qui rendent la production britannique compétitive dans le monde. Le prestige attire l'attention ; l'attention attire l'investissement."
 ENG_steady_hand: "Une main ferme"
 ENG_steady_hand_desc: "Dans une famille définie par le scrutateur, la stabilité devient une vertu stratégique. Nous présenterons le duc comme une main ferme, fiable, prévisible et tourné vers le service plutôt que les gros titres. Parfois le rôle royal le plus précieux est simplement d'empêcher l'institution de vaciller."
 ENG_duke_charities: "Les œuvres du duc"
 ENG_duke_charities_desc: "L'héritage du duc d'Édimbourg se mesure aux institutions bâties, non aux discours prononcés. Nous consoliderons et professionnaliserons son portefeuille caritatif pour assurer un financement de long terme, une gouvernance plus nette et une confiance publique durable. Si la monarchie doit être respectée, sa philanthropie doit être aussi disciplinée que sa cérémonie."
 ENG_international_award_conference: "Conférence internationale de remise des prix"
 ENG_international_award_conference_desc: "La force du Prix a toujours été son réseau mondial et ses normes partagées. Nous convoquerons une conférence internationale du Prix pour aligner les partenaires, élargir la participation et moderniser les programmes pour une nouvelle génération. Un héritage royal devient un système lorsqu'il est organisé à l'échelle internationale."
 ENG_wwf_president_emeritus: "Président émérite du WWF"
 ENG_wwf_president_emeritus_desc: "La conservation n'est plus une cause de niche : c'est la sécurité nationale sous un autre nom. Nous tirerons parti de la stature du duc comme président émérite du WWF pour élever la protection de la faune, la biodiversité et l'intendance environnementale au rang de priorités politiques sérieuses. Quand le Palais présente la nature comme stratégique, les gouvernements ont plus de mal à l'ignorer."
 ENG_prince_phillip_medal: "La médaille du prince Philip"
 ENG_prince_phillip_medal_desc: "Les symboles comptent lorsqu'ils récompensent les bonnes vertus. Nous établirons une médaille du prince Philip pour honorer le service pratique, l'ingénierie, l'industrie, les secours d'urgence et la compétence sans éclat qui fait fonctionner la Grande-Bretagne. C'est un message royal en métal : ce sont les résultats qui comptent."
 ENG_strength_and_stay: "Force et tenue"
 ENG_strength_and_stay_desc: "La monarchie dure en tenant bon sous la pression. Nous projeterons l'ancienne philosophie du duc — discipline, résilience et refus de plier aux modes passagères — dans la posture publique de la maison. Quand les tempêtes viennent, la Couronne doit paraître inébranlable."
 ENG_from_sandhurst_to_service: "De Sandhurst au service"
 ENG_from_sandhurst_to_service_desc: "La prochaine génération de la Couronne doit être crédible au-delà de la cérémonie. Nous ancrerons le rôle public du prince dans un service discipliné, le professionnalisme militaire, le devoir et un leadership pratique appris à la dure. Sandhurst n'est pas un insigne ; c'est une norme."
 ENG_royal_foundation: "La Royal Foundation"
 ENG_royal_foundation_desc: "La monarchie moderne se mesure à l'impact, non à la tradition. Nous élargirons la Royal Foundation comme instrument premier du prince : programmes professionnels, résultats mesurables et partenariats capables de survivre aux alternances politiques. Si le Palais doit diriger, il doit livrer."
 ENG_heads_together: "Têtes ensemble"
 ENG_heads_together_desc: "Une nation résiliente exige plus que de fortes frontières : elle exige de forts esprits. Nous élèverons Heads Together en une impulsion nationale pour la littératie en santé mentale, la réduction de la stigmatisation et un soutien pratique à ceux qui luttent en silence. La Couronne ne peut légiférer la compassion, mais elle peut la normaliser."
 ENG_veteran_armed_forces_support: "Soutenir nos vétérans"
 ENG_veteran_armed_forces_support_desc: "Le service ne s'arrête pas quand l'uniforme est quitté. Nous renforcerons le soutien aux vétérans et aux forces armées par les œuvres, les employeurs et la coordination gouvernementale, veillant à ce que ceux qui ont porté le fardeau ne soient pas jetés ensuite. Un pays qui demande le sacrifice doit garantir la dignité."
 ENG_bridge_to_the_future: "Un pont vers l'avenir"
 ENG_bridge_to_the_future_desc: "Le règne d'Elizabeth représente la continuité. William doit représenter la transition. Nous façonnerons le prince en pont vers l'avenir, moderne dans les méthodes, discipliné dans le ton et enraciné dans la légitimité du service. Le prochain chapitre de la monarchie commence avant que la couronne ne passe."
 ENG_queen_eldest: "Conseil de l'aîné"
 ENG_queen_eldest_desc: "La Reine se tourne vers sa lignée aînée pour projeter la continuité à l'étranger et la confiance au pays. Avec la portée publique de l'héritier et l'accès d'un envoyé royal, la Couronne peut ouvrir des portes que les ministres ne peuvent et garder la voix de la Grande-Bretagne entendue dans chaque capitale."
 ENG_queen_middle: "Le pilier du milieu"
 ENG_queen_middle_desc: "La Reine s'appuie sur la génération du milieu pour faire tourner l'institution sur la discipline et les résultats. Leur force n'est pas le spectacle : c'est l'agenda, les normes et la compétence discrète qui protège la Couronne du scandale et de la dérive."
 ENG_queen_youngest: "Un pont vers demain"
 ENG_queen_youngest_desc: "La Reine ancre la maison dans une fermeté éprouvée tout en préparant la prochaine ère au grand jour. Avec le poids institutionnel d'un consort vétéran et le dossier de service moderne du prochain héritier, la monarchie signale que le renouveau est maîtrisé, non chaotique."
 ENG_triumph_of_the_crown: "Triomphe de la Couronne"
 ENG_triumph_of_the_crown_desc: "L'équilibre a basculé, et la Couronne ne règne plus par la seule tradition. Avec la monarchie aux commandes de l'État, la Grande-Bretagne entre dans un nouvel arrangement où la loyauté est récompensée, la dissidence gérée, et la direction nationale fixée depuis le Palais. Le royaume avancera désormais d'un seul dessein, et le monde comprendra que la Couronne est revenue pour gouverner."
 ENG_the_queens_speech_title: "Le discours de la Reine"
 ENG_the_queens_speech_desc: "[ENG_the_queens_speech_focus_description]"
 ENG_the_kings_speech_title: "Le discours du Roi"
 ENG_restore_civil_liberties: "Restaurer les libertés civiles"
 ENG_restore_civil_liberties_desc: "Une Couronne qui gouverne doit aussi prouver qu'elle peut se retenir. Nous reculerons les pouvoirs extraordinaires, rétablirons le due process et réaffirmerons les droits qui rendent l'autorité britannique légitime. Que nos adversaires appellent cela faiblesse : le royaume l'appellera confiance."
 ENG_rule_sword_sceptre: "Régner par l'épée et le sceptre"
 ENG_rule_sword_sceptre_desc: "Les anciennes retenues ont échoué et le royaume ne sera pas gouverné par l'hésitation. Nous fusionnerons l'autorité royale avec les instruments du pouvoir d'État, veillant à ce que la volonté de la Couronne soit exécutée sans délai. La Grande-Bretagne sera ordonnée, décisive, et redoutée de ceux qui prennent la courtoisie pour de la faiblesse."
 ENG_royal_prerogative_activation: "Activer la prérogative royale"
 ENG_royal_prerogative_activation_desc: "Il existe des pouvoirs dans l'ombre de la constitution, employés avec parcimonie et évoqués avec prudence. Nous activerons la prérogative royale pour faire avancer l'État à vitesse, contournant la paralysie et forçant la machinerie gouvernementale à s'aligner. Quand la Couronne agit, le royaume suit."
 ENG_a_bid_soft_power: "Une offre de soft power"
 ENG_a_bid_soft_power_desc: "Le pouvoir ne se mesure pas seulement en navires et budgets, mais en prestige, accès et capacité à donner le ton de la vie internationale. Nous ferons de la Couronne le moteur du soft power britannique, élargissant la diplomatie culturelle, le patronage royal à l'étranger et des réseaux d'influence qui survivent à n'importe quel cabinet. Quand d'autres courent après les gros titres, nous façonnerons le récit."
 ENG_commonwealth_summit: "Organisez un sommet du Commonwealth"
 ENG_commonwealth_summit_desc: "Le Commonwealth n'est pas un écho de l'empire : c'est un réseau qui peut être affûté en stratégie. Nous accueillerons un sommet du Commonwealth sous direction royale pour obtenir de nouveaux engagements sur le commerce, la coopération de sécurité et le développement partagé. Si la Grande-Bretagne doit de nouveau diriger, ce sera en rassemblant ses amis dans une seule pièce."
 ENG_crown_procurement_program: "Le programme d'achats de la Couronne"
 ENG_crown_procurement_program_desc: "Une monarchie qui gouverne ne peut dépendre de contrats lents et de guerres de territoires ministérielles. Nous établirons un programme d'achats de la Couronne pour centraliser les commandes, accélérer le réarmement et récompenser les entreprises qui livrent à temps et à l'échelle. Quand le Palais signe, l'industrie bouge."
 ENG_modernize_royal_navy: "Moderniser la Royal Navy"
 ENG_modernize_royal_navy_desc: "La portée de la Grande-Bretagne a toujours été maritime, et la Couronne ne gouvernera pas un royaume incapable de contrôler ses voies maritimes. Nous moderniserons la Royal Navy avec de nouvelles coques, une doctrine plus nette et la logistique pour soutenir des opérations loin des eaux territoriales. Que les rivaux regardent nos ports et comptent ce qui en sort."
 ENG_raf_army_overhaul: "Refondre la RAF et l'armée"
 ENG_raf_army_overhaul_desc: "Une flotte sans couverture aérienne ni puissance terrestre est un symbole, non un bouclier. Nous refondrons la RAF et l'armée avec des structures de commandement modernes, un équipement modernisé et un entraînement conçu pour la guerre de haute intensité. La Couronne ne pariera pas son autorité sur des forces dépassées."
 ENG_leverage_crown_estate: "Mobiliser le Crown Estate"
 ENG_leverage_crown_estate_desc: "Le Crown Estate est plus qu'un héritage : c'est un instrument stratégique. Nous mobiliserons ses actifs pour financer des projets nationaux, stabiliser des industries clés et ancrer un développement de long terme sans mendier chaque livre au Parlement. Si la monarchie doit gouverner, elle apprendra aussi à investir."
 ENG_national_service_act: "Voter la loi sur le service national"
 ENG_national_service_act_desc: "Un royaume qui veut la sécurité doit être prêt à porter son poids. Nous voterons une loi sur le service national pour bâtir la main-d'œuvre, la discipline et un sens partagé de l'obligation à travers la nation. Certains l'appelleront coercition : la Couronne l'appellera devoir."
 ENG_new_constitutional_charter: "Rédiger une nouvelle Charte constitutionnelle"
 ENG_new_constitutional_charter_desc: "L'ancien arrangement a été écrit pour une autre Grande-Bretagne et ne tient plus sous la tension. Nous rédigerons une nouvelle charte constitutionnelle qui définit l'autorité de la Couronne, les limites du Parlement et les droits qui restent hors de la politique. Une fois scellée, le royaume aura de la clarté, et la clarté est le pouvoir."
 ENG_secure_succession: "Assurer la succession"
 ENG_secure_succession_desc: "Une monarchie qui gouverne ne peut se permettre l'incertitude au sommet. Nous assurerons la succession par une loi claire, une planification disciplinée et l'affirmation publique du mandat de l'héritier. La continuité ne se présume pas : elle s'impose."
 ENG_rule_councillorship: "Gouvernement par les conseils municipaux"
 ENG_rule_councillorship_desc: "Le gouvernement parlementaire engendre des factions, mais la Couronne peut gouverner par des mains de confiance. Nous habiliterons un Conseil royal de conseillers à rédiger la politique, superviser les ministères et tenir l'État aligné sur le Palais. La Grande-Bretagne sera gouvernée par la compétence et la loyauté, non par le marchandage partisan."
 ENG_convene_foreign_secretary_cabinet: "Convoquer le cabinet du secrétaire aux Affaires étrangères"
 ENG_convene_foreign_secretary_cabinet_desc: "La diplomatie ne peut s'improviser lorsque l'autorité de la Couronne est en jeu. Nous convoquerons un cabinet du secrétaire aux Affaires étrangères pour coordonner ambassadeurs, renseignement, envoyés commerciaux et planificateurs de défense sous une seule direction. La Grande-Bretagne parlera d'une seule voix à l'étranger, et ce sera la bonne."
 ENG_champion_liberal_values: "Défendre les valeurs libérales"
 ENG_champion_liberal_values_desc: "Si la monarchie doit gouverner, elle doit gouverner avec des principes que la Grande-Bretagne peut reconnaître comme les siens. Nous défendrons les valeurs libérales, protégerons les institutions libres et prouverons que l'autorité royale peut coexister avec les droits et la retenue. La Couronne sera forte, et elle sera légitime."
 ENG_european_outreach: "Sensibilisation européenne"
 ENG_european_outreach_desc: "La Grande-Bretagne ne peut se permettre l'isolement à sa propre porte. Nous lancerons une campagne d'ouverture européenne pour reconstruire les canaux, sécuriser la coopération là où les intérêts se recoupent, et empêcher les rivaux de fixer les termes du continent sans nous. La Couronne traitera directement, et l'Europe s'en apercevra."
 ENG_close_proximity_nato: "Proximité étroite avec l'OTAN"
 ENG_close_proximity_nato_desc: "L'OTAN n'est pas seulement un pacte : c'est un levier de dissuasion et d'accès. Nous passerons en proximité étroite avec l'Alliance pour assurer le partage de renseignement, l'interopérabilité et la profondeur stratégique tout en préservant la liberté d'action de la Couronne. La Grande-Bretagne sera alliée, mais jamais subordonnée."
 ENG_joint_operational_command: "Établir un commandement opérationnel conjoint"
 ENG_joint_operational_command_desc: "La rivalité interarmes perd du temps, et le temps tue. Nous établirons un commandement opérationnel interarmées pour unifier planification, logistique et exécution entre marine, armée et RAF sous une seule doctrine de combat. Quand la Couronne ordonne l'action, chaque arme bougera comme une seule."
 ENG_reaffirm_special_relationship: "Réaffirmer la relation spéciale"
 ENG_reaffirm_special_relationship_desc: "Le pouvoir respecte le pouvoir, et les États-Unis restent le partenaire le plus décisif du royaume. Nous réaffirmerons la relation spéciale par la coopération de renseignement, la coordination de défense et une planification stratégique partagée au plus haut niveau. La Couronne gardera le siège de la Grande-Bretagne à la table où se décide le monde."
 ENG_royal_charitable_initiative: "L'initiative caritative royale"
 ENG_royal_charitable_initiative_desc: "Gouverner est plus facile lorsque le royaume croit qu'on en prend soin. Nous lancerons une initiative caritative royale pour orienter financements, bénévoles et attention publique vers les communautés sous tension, prouvant que la Couronne peut gouverner avec compassion. La loyauté croît le plus vite là où l'aide arrive en premier."
 ENG_time_for_common_sense: "L'heure du bon sens"
 ENG_time_for_common_sense_desc: "Le temps du bon sens est venu. Des années de gouvernement travailliste ont égaré notre peuple des idéaux qui ont fait la Grande-Bretagne d'autrefois. Nous ne pouvons laisser les efforts de grands hommes comme Winston Churchill se perdre : non, nous façonnerons la Grande-Bretagne pour qu'elle soit ce qu'elle a toujours dû être, une grande puissance."
 ENG_knowing_who_we_are: "Savoir qui nous sommes"
 ENG_knowing_who_we_are_desc: "Nous sommes Britanniques d'abord, Européens ensuite. Nous ne pouvons oublier qui nous sommes : nous sommes les héritiers d'une superpuissance comme le monde n'en avait jamais vue. Le soleil ne se couchait vraiment jamais sur la Grande-Bretagne, et il en restera ainsi si nous y pouvons quelque chose."
 ENG_a_world_leader: "Un leader mondial"
 ENG_a_world_leader_desc: "Nous sommes Britanniques, seconds de personne, leaders mondiaux et champions de la liberté : nous ne pouvons laisser notre emprise de leader mondial glisser. Nous nous réaffirmerons au premier rang du leadership mondial."
 ENG_fighting_the_power_of_brussels: "Combattre le pouvoir de Bruxelles"
 ENG_fighting_the_power_of_brussels_desc: "Bruxelles a outrepassé ses capacités administratives. Ils dégradent activement l'indépendance de notre nation par leur rhétorique, et menacent notre capacité à choisir ce que nous voulons pour la Grande-Bretagne !"
 ENG_a_civilized_society: "Une société civilisée"
 ENG_a_civilized_society_desc: "En tant que société civilisée, la Grande-Bretagne ne sera pas assujettie à la propagande d'autrui. Travailler à briser l'influence de ceux qui veulent un changement radical de notre mode de vie doit donc être traité sans délai."
 ENG_a_stronger_society: "Une société plus forte"
 ENG_a_stronger_society_desc: "Notre société sera plus forte et plus unie que jamais. Nous ne pouvons laisser d'autres fracturer notre unité sous le couvert de « réforme ». Notre société ne pourra devenir plus forte que si nous continuons à protéger nos valeurs fondamentales."
 ENG_a_staunch_ally: "Un allié fidèle"
 ENG_a_staunch_ally_desc: "Nous ne sommes rien de moins qu'un allié indéfectible de nos partenaires de l'OTAN ! Quiconque ose nous accuser d'être des profiteurs, un maillon faible ou quoi que ce soit entre les deux peut rentrer chez lui d'où il vient."
 ENG_town_and_country: "Ville et campagne"
 ENG_town_and_country_desc: "Nous sommes un pays qui ne peut oublier ses petites villes rurales et modestes. Nous devons nous souvenir de ces gens de toutes nos forces et les inciter à continuer."
 ENG_a_more_flexible_europe: "Une Europe plus flexible"
 ENG_a_more_flexible_europe_desc: "L'Europe doit être plus flexible dans ses objectifs de politique étrangère d'ensemble. Si nous voulons devenir un continent plus fort, l'Europe doit abandonner tout l'agenda d'« unification » et travailler à plus de souplesse."
 ENG_rural_friendly_transport_services: "Services de transport adaptés aux zones rurales"
 ENG_rural_friendly_transport_services_desc: "Nos services de transport ne sont pas vraiment adaptés aux communautés rurales. Nous devrons trouver un moyen de contenter ces gens."
 ENG_industrial_friendly_transport_services: "Services de transport favorables à l'industrie"
 ENG_industrial_friendly_transport_services_desc: "L'ouvrier doit aller et revenir du travail sans problème. Nous devrons revoir ou du moins améliorer nos services de transport pour les sites industriels."
 ENG_no_army_outside_of_europe: "Aucune armée hors d'Europe"
 ENG_no_army_outside_of_europe_desc: "Pourquoi des militaires britanniques hors des frontières de l'Europe ? Quelle place ont-ils en Asie ? En Afrique ? Au Moyen-Orient ? Nous devons plutôt nous concentrer à garder nos troupes en Europe."
 ENG_abolish_centrally_planned_housing: "Abolir le logement à planification centralisée"
 ENG_abolish_centrally_planned_housing_desc: "Au lieu d'allouer notre budget à un programme de logement planifié au centre, nous pouvons réorienter ces fonds vers des choses plus importantes."
 ENG_coming_to_the_aid_of_others: "Venir en aide aux autres"
 ENG_coming_to_the_aid_of_others_desc: "Il y a dans le monde ceux qui ont désespérément besoin de notre assistance, et nous sommes là pour la leur apporter."
 ENG_global_matters_global_problems: "Questions mondiales, problèmes mondiaux"
 ENG_global_matters_global_problems_desc: "Pourquoi nous soucier de ce que les autres traversent ? C'est leur problème, pas le nôtre ! Ils doivent s'en sortir tout seuls."
 ENG_credit_based_public_transport: "Transports publics à crédits"
 ENG_credit_based_public_transport_desc: "Vous travaillez ? Parfait, vous n'avez pas à vous soucier de payer vos titres. En permettant à ceux qui travaillent de prendre les transports publics gratuitement, nous inciterons les gens à trouver un emploi et à travailler."
 ENG_safe_haven_not_safe_touch: "Havre sûr, pas toucher sûr"
 ENG_safe_haven_not_safe_touch_desc: "Nous sommes un refuge pour ceux qui ont vraiment besoin d'aide ; si nous laissons simplement n'importe qui entrer, ils pourriront notre pays jusqu'à l'oubli."
 ENG_are_you_thinking_what_were_thinking: "Pensez-vous ce que nous pensons ?"
 ENG_are_you_thinking_what_were_thinking_desc: ""
 ENG_power_to_the_bank_of_england: "Du pouvoir à la Banque d'Angleterre"
 ENG_power_to_the_bank_of_england_desc: "En l'état, la Banque d'Angleterre est dans un état pire que jamais. Il est donc nécessaire d'agir et de renforcer l'institution."
 ENG_british_dream: "Le rêve britannique"
 ENG_british_dream_desc: "Le rêve britannique est celui que beaucoup n'ont plus depuis fort longtemps. C'est le rêve et l'ambition que tous les Britanniques prospèrent, sans avoir à subir les conséquences de pertes collectives."
 ENG_whats_wrong_with_discipline: "Qu'y a-t-il de mal à la discipline ?"
 ENG_whats_wrong_with_discipline_desc: "Il apparaît que nos écoles se sont ramollies et ont commencé à reculer devant les mesures disciplinaires nécessaires. Il est de notre devoir d'enseigner les manières à nos jeunes, et nous ferons en sorte que les éducateurs le sachent."
 ENG_across_the_board_tax_slashes: "Coupes fiscales généralisées"
 ENG_across_the_board_tax_slashes_desc: "Si nous baissons les impôts pour tous, nos concitoyens de tous les milieux sentiront le poids de leurs fardeaux se déplacer drastiquement. Nous ne devons pas discriminer !"
 ENG_tax_slashes_only_for_some: "Des baisses d'impôts pour certains seulement"
 ENG_tax_slashes_only_for_some_desc: "Nous n'avons ni le budget ni la volonté de baisser les impôts pour tout le monde. Nous allons devoir être coordonnés et ne couper que là où nous y gagnons."
 ENG_icnreased_control_for_administrators: "Contrôle accru pour les administrateurs"
 ENG_icnreased_control_for_administrators_desc: "Ceux qui travaillent dans nos écoles ont besoin de pouvoir peser sur les affaires de leurs établissements. Cela nous permettra de voir s'élever de nouveaux savants."
 ENG_keeping_hospitals_clean: "Garder les hôpitaux propres"
 ENG_keeping_hospitals_clean_desc: "Nous devons garder nos hôpitaux propres, tant pour l'apparence physique que pour leur crédibilité."
 ENG_corporate_invitations: "Invitations d'entreprise"
 ENG_corporate_invitations_desc: "Nous devons inviter les entreprises à nous aider à décider de la politique économique. Elles sont le battement de cœur de notre économie, et sans elles nous ne serions rien."
 ENG_more_police_less_crime: "Plus de policiers, moins de criminalité"
 ENG_more_police_less_crime_desc: "C'est assez évident, n'est-ce pas ? Si nous avons davantage de policiers dans les rues, nous aurons certainement bien moins de crimes."
 ENG_cutting_wait_times: "Réduire les temps d'attente"
 ENG_cutting_wait_times_desc: "Les gens attendent bien trop longtemps pour les services médicaux : il est grand temps d'y faire quelque chose et de réduire les délais d'attente de moitié !"
 ENG_turnaround_schools: "Écoles de redressement"
 ENG_turnaround_schools_desc: "Si les élèves sont incapables de s'asseoir correctement en classe et d'écouter leur instructeur, il faudra penser à autre chose. Les envoyer en établissement de redressement résoudra enfin ce problème que nous avons avec une petite minorité d'élèves."
 ENG_structural_overhaul_of_nhs: "Refonte structurelle du NHS"
 ENG_structural_overhaul_of_nhs_desc: "En l'état, le NHS ne peut continuer. Il aspire tout notre argent et laisse les patients malades à attendre dehors. Nous devons lancer une série de réformes qui reconstruiront le NHS de fond en comble."
 ENG_trusting_local_professionals: "Faire confiance aux professionnels"
 ENG_trusting_local_professionals_desc: "Pourquoi réparer ce qui n'est pas cassé ? Nous laisserons les affaires médicales aux professionnels de santé, et permettrons au NHS de fonctionner avec quelques petits ajustements."
 ENG_keeping_up_our_guard: "Rester sur nos gardes"
 ENG_keeping_up_our_guard_desc: "Nous ne pouvons baisser la garde simplement parce que les choses sont calmes maintenant. Nous devons anticiper toutes sortes de scénarios, même en temps de stabilité et de prospérité."
 ENG_benefitting_the_taxpayer: "Au bénéfice du contribuable"
 ENG_benefitting_the_taxpayer_desc: "Qui servons-nous si ce n'est le contribuable ? Nous devons mettre en œuvre des politiques qui rassureront les contribuables que leur argent n'est pas gaspillé."
 ENG_invitation_to_the_government_of_britain: "Invitation au gouvernement de Grande-Bretagne"
 ENG_invitation_to_the_government_of_britain_desc: ""
 ENG_get_britain_moving_again: "Remettez la Grande-Bretagne en mouvement"
 ENG_get_britain_moving_again_desc: "Le moment est venu de remettre la Grande-Bretagne en mouvement. Plus jamais la stratégie lente, méthodique et conventionnelle d'attendre que l'économie se répare toute seule. Nous allons prendre les choses en main."
 ENG_cleanup_westminster: "Nettoyer Westminster"
 ENG_cleanup_westminster_desc: "Westminster est un chaos, saturé de paperasse et d'empiétements bureaucratiques. Il est temps de prendre un marteau-piqueur et de nettoyer l'endroit."
 ENG_big_society_not_big_government: "Grande société, pas grand gouvernement"
 ENG_big_society_not_big_government_desc: "Pourquoi un grand gouvernement ? Si notre société est assez bonne, pourquoi surveiller, administrer et dicter chaque aspect de leur vie ? Nous réduirons plutôt l'État et laisserons la société faire son affaire."
 ENG_household_debt_management_programs: "Programmes de gestion de la dette des ménages"
 ENG_household_debt_management_programs_desc: "Parfois les gens ne peuvent tout simplement pas rembourser leurs dettes, et c'est acceptable. Nous établirons des programmes de gestion de la dette qui prendront en charge une partie de leur dette ou les aideront par des plans de remboursement."
 ENG_bigger_place_for_educators: "Plus de place pour les éducateurs"
 ENG_bigger_place_for_educators_desc: "Le pays doit s'ouvrir davantage à nos éducateurs. Nous ne les apprécions pas près autant que nous le devrions, surtout pour le travail qu'ils accomplissent."
 ENG_the_most_family_friendly_country: "Le pays le plus accueillant pour les familles"
 ENG_the_most_family_friendly_country_desc: "Notre pays doit s'ouvrir davantage à l'accueil des familles et à ceux qui en fondent. Notre population ne peut rester statique et petite : nous devons croître et cultiver de bonnes valeurs."
 ENG_knowledge_for_industry: "Le savoir pour l'industrie"
 ENG_knowledge_for_industry_desc: "Au lieu de laisser le savoir se perdre ailleurs, nous pourrions rediriger une partie de cette matière grise vers de nouvelles industries, peut-être les industries militaires."
 ENG_power_of_recall: "Pouvoir de révocation"
 ENG_power_of_recall_desc: "Il est évident que certains Premiers ministres mentent et doivent donc être destitués s'ils ne tiennent pas leurs promesses. Nous devons permettre au peuple de révoquer les Premiers ministres qu'il ne veut plus à la tête de la charge."
 ENG_a_more_balanced_economy: "Une économie plus équilibrée"
 ENG_a_more_balanced_economy_desc: "Notre économie est en piteux état après des décennies d'incompétence travailliste : il est temps de remettre les choses d'équerre !"
 ENG_bye_bye_bureaucracy: "Adieu la bureaucratie"
 ENG_bye_bye_bureaucracy_desc: "Qui a besoin d'un grand gouvernement quand on peut avoir une grande liberté ? Il n'y a pas besoin de bureaucratie dans la vie quotidienne de nos électeurs, mais plutôt besoin de libertés élargies."
 ENG_case_by_case_intervention: "Intervention au cas par cas"
 ENG_protecting_childhood: "Protéger l'enfance"
 ENG_protecting_childhood_desc: "En l'état, notre jeunesse court un risque majeur d'être lésée par des individus malsains par de multiples canaux, qu'il s'agisse d'internet ou de la rue. Nous devons prendre des mesures supplémentaires pour protéger l'enfance afin de lui permettre de grandir et de s'épanouir."
 ENG_investigate_lost_funds: "Enquêter sur les fonds perdus"
 ENG_investigate_lost_funds_desc: "Pour une raison quelconque, de fortes sommes d'argent public ont disparu il y a quelques années. Il est temps d'ouvrir une enquête en bonne et due forme et de découvrir ce qui s'est passé."
 ENG_a_more_transparent_government: "Un gouvernement plus transparent"
 ENG_a_more_transparent_government_desc: "Notre gouvernement n'est pas assez transparent, et nous devons prendre des mesures supplémentaires pour que nos électeurs sachent ce qui se passe à Westminster."
 ENG_petitions_for_debate: "Pétitions pour le débat"
 ENG_petitions_for_debate_desc: "Si nous permettons aux gens d'obtenir un nombre significatif de signatures sur une pétition de changement, nous pourrons les transmettre au Parlement pour examen et mettre en œuvre plus directement le retour du peuple."
 ENG_public_reading_stage: "Étape de lecture publique"
 ENG_public_reading_stage_desc: "Nous autoriserons un forum internet qui laissera notre peuple commenter et discuter les changements votés au Parlement, pour plus de transparence et d'ouverture gouvernementale."
 ENG_for_the_common_man: "Pour l'homme du commun"
 ENG_for_the_common_man_desc: "Notre gouvernement est pour l'homme du commun, pas pour ceux qui mènent le spectacle. Nous voterons des réformes ciblées qui permettront une activité politique accrue parmi la classe populaire."
 ENG_for_the_wealthy_man: "Pour l'homme fortuné"
 ENG_for_the_wealthy_man_desc: "Qu'ont donc les pauvres à voir avec le gouvernement ? La plupart sont des fainéants de gauche qui ne veulent rien d'autre que des subventions pour éviter de travailler. Nous nous adresserons aux individus de la société qui travaillent vraiment et contribuent à l'économie."
 ENG_a_brighter_more_secure_future: "Un avenir plus lumineux et plus sûr"
 ENG_a_brighter_more_secure_future_desc: ""
 ENG_operation_dagger: "Opération Dague"
 ENG_operation_dagger_desc: "Le golfe Persique fut jadis dominé par nos forces, notre capacité à dicter les allées et venues étant presque sans couture. Aujourd'hui toutefois, nous sommes en moindre position pour négocier avec les acteurs régionaux, et forcés de nous appuyer sur nos atouts pour obtenir quoi que ce soit. En saisissant le Musandam, nous pourrons de nouveau être en position de pouvoir dans le Golfe."
 ENG_operation_barras: "Opération Barras"
 ENG_operation_barras_desc: "Nous avons reçu des rapports selon lesquels le groupe milicien « West Side Boys », ainsi nommé par journalistes et diffuseurs, a capturé plusieurs soldats britanniques et les retient désormais en otage. Nous sommes pressés d'intervenir d'une manière ou d'une autre pour sauver leur vie, et le commandement militaire a rédigé l'opération Barras pour y procéder. Nous avons aussi l'option d'aller plus loin pour saisir des ressources vitales pendant l'opération ; ce n'est toutefois pas obligatoire."
 ENG_operation_coastal_star: "Opération Étoile Côtière"
 ENG_operation_coastal_star_desc: "La Gambie commence à dériver dangereusement vers l'autoritarisme, l'instabilité, et certainement hors de notre orbite. Nous devrons intervenir d'une manière ou d'une autre et les faire changer de cap, sinon le reste de l'Afrique de l'Ouest pourrait suivre."
 ENG_operation_delta_guard: "Opération Delta Guard"
 ENG_operation_delta_guard_desc: "Clairement les Nigérians ne savent rien de la conduite d'un État, et nous sommes tenus de faire quelque chose de l'or noir gaspillé autour du Delta. Autrement, nous le laisserions simplement se perdre, et personne ne le veut. L'opération Delta Guard nous permettra de rétablir la domination économique au Nigeria et les recettes bénéficieront sûrement à l'État."
 ENG_the_sun_which_never_set: "Le soleil qui ne se couchait jamais"
 ENG_the_sun_which_never_set_desc: "Le soleil ne se couche vraiment jamais sur la Grande-Bretagne, et nous veillerons à ce que cela reste le cas."
 ENG_operation_resolute_banner: "Bannière de l'Opération Resolute"
 ENG_operation_resolute_banner_desc: "Le gouvernement serbe a continué de menacer le Kosovo, et de ce fait nous sommes forcés d'intervenir et de tracer une ligne rouge."
 ENG_falklands_policy: "Politique des Malouines"
 ENG_falklands_policy_desc: "Malgré notre petite accroche avec l'Argentine à propos des Malouines il y a quelques décennies, le souvenir du conflit reste vif dans bien des esprits. Nous pouvons avancer une nouvelle politique sur les îles et peut-être prendre des mesures supplémentaires."
 ENG_regime_change_in_zimbabwe: "Sauvegarde des opérations"
 ENG_regime_change_in_zimbabwe_desc: "Le dictateur de longue date du Zimbabwe, [ZIM.GetLeader], doit être renversé par tous les moyens nécessaires. Son oppression des Britanniques et du peuple zimbabwéen ne peut rester ignorée, et la justice doit être rendue sans délai."
 ENG_operation_east_divide: "Opération Eastern Divide"
 ENG_operation_east_divide_desc: "Suez est de droit terre britannique, et sans Suez nous avons dû subir les épreuves des « réglementations du commerce international ». Nous essaierons donc de nous entendre avec les Égyptiens pour un contrôle partiel du Sinaï, sinon nous n'aurons d'autre choix que d'agir."
 ENG_operation_ninety_seven: "Opération '97"
 ENG_operation_ninety_seven_desc: "Céder Hong Kong aux Chinois fut une erreur, et une grave. Nous devons chercher de nouveaux moyens de ramener Hong Kong sous notre influence si nous voulons nous rétablir comme hégémon économique."
 devolution.1.t: "Les nations constitutives cherchent à voter des lois pour réduire leur dépendance"
 devolution.1.d: "Des développements récents dans le pays ont conduit nos nations constitutives à avancer des politiques pour réduire leur dépendance au gouvernement central. Nous avons la capacité de opposer notre veto à ces projets, mais cela pourrait entraîner un mécontentement plus grand."
 devolution.1.a: "Approuvez-les"
 devolution.1.b: "Mettez leur veto"
 devolution.1.c: "Montrez-moi les projets individuels"
 devolution.2.t: "Le projet de loi de l'Écosse"
 devolution.2.d: "Le parlement écossais a présenté au gouvernement un projet qui accroîtra son autonomie et le poussera vers un État plus dévolu. Opposer son veto pourrait les irriter, mais l'approuver les poussera vers la dévolution."
 devolution.2.a: "Approuvez-le"
 devolution.2.b: "Mettez votre veto"
 devolution.3.t: "Le projet de loi de l'Irlande du Nord"
 devolution.3.d: "Le parlement nord-irlandais a présenté au gouvernement un projet qui accroîtra son autonomie et le poussera vers un État plus dévolu. Opposer son veto pourrait les irriter, mais l'approuver les poussera vers la dévolution."
 devolution.3.a: "Approuvez-le"
 devolution.3.b: "Mettez votre veto"
 devolution.4.t: "Projet de loi du Pays de Galles"
 devolution.4.d: "Le parlement gallois a présenté au gouvernement un projet qui accroîtra son autonomie et le poussera vers un État plus dévolu. Opposer son veto pourrait les irriter, mais l'approuver les poussera vers la dévolution."
 devolution.4.a: "Approuvez-le"
 devolution.4.b: "Mettez votre veto"
 devolution.5.t: "Les appels à l'indépendance écossaise se multiplient"
 devolution.5.d: "Chaque jour qui passe, des présentateurs se tiennent devant des foules exigeant qu'un référendum national soit organisé pour décider si l'Écosse doit rester partie du [ENG.GetName]. Westminster y est évidemment généralement opposé, mais vetoer l'idée d'emblée pourrait déclencher de l'instabilité."
 devolution.5.a: "Très bien, voyons ce qui se passe"
 devolution.5.b: "Mettez votre veto"
 devolution.6.t: "Les appels à l'indépendance nord-irlandaise se multiplient"
 devolution.6.d: "Chaque jour qui passe, des présentateurs se tiennent devant des foules exigeant qu'un référendum national soit organisé pour décider si l'Irlande du Nord doit rester partie du [ENG.GetName]. Westminster y est évidemment généralement opposé, mais vetoer l'idée d'emblée pourrait déclencher de l'instabilité."
 devolution.6.a: "Très bien, voyons ce qui se passe"
 devolution.6.b: "Mettez votre veto"
 devolution.7.t: "Les appels à l'indépendance galloise se multiplient"
 devolution.7.d: "Chaque jour qui passe, des présentateurs se tiennent devant des foules exigeant qu'un référendum national soit organisé pour décider si le pays de Galles doit rester partie du [ENG.GetName]. Westminster y est évidemment généralement opposé, mais vetoer l'idée d'emblée pourrait déclencher de l'instabilité."
 devolution.7.a: "Très bien, voyons ce qui se passe"
 devolution.7.b: "Mettez votre veto"
 devolution.10.t: "Élection constituante"
 devolution.10.d: "L'heure des élections dans nos États constitutifs est venue. Chaque constituant élira de nouveaux Premiers ministres dans leurs parlements respectifs, pro-indépendance ou pro-[ENG.GetName]. La probabilité que des élus indépendantistes l'emportent dépend de l'agitation de chaque constituant."
 devolution.10.a: "D'accord"
 britain_md.100.t: "Approche de l’opération Dagger"
 britain_md.100.d: "Le Moussandam occupe une position hautement stratégique : le poignard du golfe Persique. D'innombrables pétroliers et convois empruntent chaque jour le détroit d'Ormuz et, face à la volatilité croissante de la région, nous ne pouvons plus garantir la protection de cette route. Si nous parvenons à placer la province sous notre contrôle, nous serons mieux à même de protéger nos flottes et nos avoirs."
 britain_md.100.a: "Tenter un accord avec Oman"
 britain_md.100.b: "Pas le temps de négocier, on intervient"
 britain_md.101.t: "[ENG.GetName] nous approche au sujet de Moussandam"
 britain_md.101.d: "Les Britanniques sont venus nous parler. Plus précisément, ils veulent notre territoire. À l'écoute de la proposition britannique, nos diplomates ont quitté la salle en colère, incapables de se maîtriser en apprenant que Londres cherchait à négocier le Moussandam. Une exigence aussi agressive ne manquera pas d'outrager notre peuple. Les Britanniques ont toutefois répété qu'un refus ne leur laisserait d'autre choix que de « recourir à d'autres moyens »."
 britain_md.101.a: "Jamais !"
 britain_md.101.b: "Quel choix nous reste-t-il ?"
 britain_md.102.t: "Oman refuse les négociations"
 britain_md.102.d: "Le gouvernement omanais a fait savoir qu'il n'était intéressé par aucune négociation, et s'est contenté de rabrouer nos diplomates."
 britain_md.102.a: "Ils ne nous laissent pas le choix"
 britain_md.102.b: "Oublie ça"
 britain_md.103.t: "Oman nous donne ses conditions"
 britain_md.103.d: "Le gouvernement omanais a eu la sagesse de négocier et nous a même proposé des conditions. On nous demande de verser une somme considérable d'avance et de garantir la protection d'Oman pendant un temps. Rejeter cette offre reviendrait à nous priver des droits sur le Moussandam."
 britain_md.103.a: "Fine"
 britain_md.103.b: "Non, nous procéderons autrement"
 britain_md.103.c: "Oublie ça"
 ENG_western_allies_western_ideals: "Alliés occidentaux, idéaux occidentaux"
 ENG_western_allies_western_ideals_desc: ""
 ENG_out_with_the_new_in_with_the_old: "Dehors le neuf, place à l'ancien"
 ENG_out_with_the_new_in_with_the_old_desc: ""
 royal_workers_idea: "Ouvriers royaux"
 ENG_crown_procurement_program_idea: "Programme d'achats de la Couronne"
 ENG_recent_defections: "Défections récentes"
 ENG_recent_defections_desc: "Troupes, généraux et pilotes expérimentés fuient nos rangs pour rompre avec notre gouvernement, nous considérant comme une menace pour l'État."
 ENG_war_of_independence: "Guerre d'indépendance"
 ENG_war_of_independence_desc: "Le moral au plus haut, nos hommes sont prêts à voir la fin du joug tyrannique de Londres."
 ENG_typhoon_debate1: "Augmentation de la production de chasseurs Typhoon"
 ENG_resistance_against_westminster: "Résistance à Westminster"
 ENG_resistance_against_westminster_desC: "Après le rejet d'une proposition de référendum, les constituants de cet État ont opposé une résistance obstinée, sous forme de désobéissance civile et de quelques actes de violence, pour marquer leur mécontentement."
 ENG_political_modifier: "Le système de Westminster"
 ENG_two_party_system_idea: "Système bipartite"
 ENG_economy_modifier: "L'économie de [ENG.GetName]"
 ENG_building_britain_idea: "Bâtir une Grande-Bretagne à la hauteur de l'avenir"
 ENG_building_britain_idea_desc: "Une stratégie industrielle de long terme aligne l'investissement dans les idées, les hommes, les infrastructures et les territoires, relevant lentement la productivité et donnant aux entreprises la confiance de planifier, d'embaucher et de construire dans tout le pays."
 ENG_ireland_border_cooperation_idea_IRE: "Coopération frontalière irlandaise"
 ENG_ireland_border_cooperation_idea_IRE_desc: "Des organismes transfrontaliers pratiques et des programmes conjoints relient l'Irlande du Nord et l'Irlande sur le commerce, les infrastructures et les services, allégeant la paperasse et facilitant la circulation des biens, des personnes et des idées de part et d'autre de la frontière."
 ENG_Space_Command0: "Capacités du cyberespace britannique"
 ENG_Space_Command0_desc: "Le Royaume-Uni s'emploie à renforcer ses capacités et à sécuriser ses intérêts dans l'espace"
 ENG_Space_Command2: "Commandement spatial du Royaume-Uni"
 ENG_Space_Command3: "Commandement spatial du Royaume-Uni"
 ENG_Space_Command3_desc: "UK Space Command est le chef de file de la défense pour les opérations spatiales, les effectifs spatiaux et les capacités spatiales. C'est un commandement interarmées, basé à RAF High Wycombe, composé de personnels de la Royal Navy, de la British Army et de la Royal Air Force, ainsi que de fonctionnaires et de prestataires. Avec la 1re division spatiale désormais formée, l'organisation a dépassé les attentes dans le monde entier, et la Grande-Bretagne vit une nouvelle ère Dreadnought."
 ENG_standardized_space_parts1: "Pièces spatiales standardisées"
 ENG_standardized_space_parts1_desc: "En aidant les entreprises commerciales à rendre l'espace accessible et abordable, les coûts de construction des produits spatiaux ont été réduits."
 ENG_Historical_Valor1: "Valeur historique"
 ENG_Historical_Varlor1_desc: "Ancrées dans la tradition, les forces armées britanniques s'enorgueillissent d'un héritage prestigieux. L'état-major reste toutefois attaché aux stratégies conventionnelles, sceptique face aux tactiques non éprouvées. À l'orée du changement, concilier fierté et adaptabilité devient l'essence de la défense nationale."
 ENG_Aging_Military1: "Armée vieillissante"
 ENG_Aging_Military1_desc: "Faute de financement, l'armée du Royaume-Uni affronte un vieillissement sévère, aux prises avec un matériel dépassé et une qualité en berne. L'impact de la négligence budgétaire se fait sentir dans les rangs, rendant difficile le maintien d'une force de défense moderne et efficace."
 ENG_desert_hawk: "Faucon du désert"
 ENG_desert_hawk_desc: "Le Lockheed Martin Desert Hawk III est un UAV conçu par Skunk Works chez Lockheed Martin Aeronautics. C'est un petit drone de surveillance capable d'observation radar, de renseignement d'origine électromagnétique et d'interception des communications, ainsi que d'observation à distance avec vision nocturne, imagerie thermique et capteurs électro-optiques."
 ENG_archer_artillery_alliance: "Alliance d'artillerie Archer"
 ENG_archer_artillery_alliance_desc: "L'Archer Artillery Alliance, développée par la Suède, marque une percée dans la puissance de feu de précision à longue portée. Avec un chargement automatisé et un déploiement rapide, ce système d'artillerie assure un appui précis et flexible sur le champ de bataille. Sa conception modulaire renforce les opérations militaires, offrant à la Suède et au Royaume-Uni un avantage stratégique au combat."
 ENG_Boxer_Program: "Programme Boxer"
 ENG_Boxer_Program_desc: "Le programme de VCI Boxer, collaboration entre l'Allemagne et les Pays-Bas, inaugure une nouvelle ère des véhicules de transport de troupes blindés. La conception modulaire du Boxer permet une adaptation aisée à diverses missions, du transport de troupes à l'évacuation sanitaire. Avec des protections avancées et une mobilité exceptionnelle, ce véhicule améliore la sécurité et l'efficacité du personnel militaire dans des environnements opérationnels variés."
 ENG_warrior_capability_sustainment_programme: "Programme de maintien des capacités du Warrior"
 ENG_warrior_capability_sustainment_programme_desc: "Le canon RARDEN de 30 mm obsolète du Warrior, incapable de tirer en mouvement avec précision, a suscité des études sur de nouveaux systèmes d'armes et tourelles pour prolonger sa vie au combat. Les plans actuels prévoient l'ajout d'une tourelle à canon CT40 de 40 mm entièrement stabilisée, une architecture électronique améliorée et un système de protection modulaire à kits de montage rapide. Parallèlement, le programme Armoured Battlegroup Support Vehicle a proposé de convertir la plateforme en VTT et de remplacer le FV432."
 ENG_warrior_ajax_upgrades: "Mises à niveau des véhicules blindés Warrior Ajax"
 ENG_warrior_ajax_upgrades_desc: "Le projet Warrior Ajax Upgrades, mené par le Royaume-Uni, constitue une amélioration majeure du célèbre véhicule de combat d'infanterie Warrior. Avec des modifications avancées — puissance de feu accrue, communications améliorées et blindage renforcé — le Warrior Ajax garantit des performances supérieures sur le champ de bataille. Ces modernisations renforcent les capacités militaires britanniques, offrant un appui blindé modernisé et polyvalent aux forces terrestres dans un éventail de scénarios."
 ENG_fres_program_Idea: "Programme FRES"
 ENG_fres_program_Idea_desc: "Le programme FRES (Future Rapid Effect System) du Royaume-Uni est une initiative tournée vers l'avenir, renforçant l'agilité militaire par des plateformes terrestres polyvalentes. En intégrant des technologies de pointe pour une réaction rapide, il assure la préparation du Royaume-Uni à des missions diverses."
 ENG_fixing_civil_servant_idea: "Réparer un fonctionnaire"
 ENG_fixing_civil_servant_idea_desc: "Nos soldats ont besoin d'un matériel fiable. Nous nous employons à répondre à cette exigence."
 ENG_special_command1: "Commandement spécialisé"
 ENG_special_command1_desc: "En nous concentrant sur la spécialisation et l'efficacité de l'armée, nous cherchons à renforcer les capacités de combat de nos forces. Cet engagement se paie toutefois d'une hausse des dépenses et d'exigences plus lourdes en ressources."
 ENG_special_command2: "Commandement spécialisé"
 ENG_special_command2_desc: "En nous concentrant sur la spécialisation et l'efficacité de l'armée, nous cherchons à renforcer les capacités de combat de nos forces. Cet engagement se paie toutefois d'une hausse des dépenses et d'exigences plus lourdes en ressources."
 ENG_special_command3: "Commandement spécialisé"
 ENG_special_command3_desc: "En nous concentrant sur la spécialisation et l'efficacité de l'armée, nous cherchons à renforcer les capacités de combat de nos forces. Cet engagement se paie toutefois d'une hausse des dépenses et d'exigences plus lourdes en ressources."
 ENG_UKSF1: "Forces spéciales du Royaume-Uni"
 ENG_UKSF1_desc: "Composées de forces d'élite comme le SAS et le SBS, ces unités hautement entraînées excellent dans les opérations clandestines, la lutte antiterroriste et la guerre non conventionnelle. La présence de forces spéciales d'élite accroît l'agilité stratégique et les capacités antiterroristes du Royaume-Uni, incarnant l'excellence en précision et en adaptabilité."
 ENG_UKSF2: "Forces spéciales du Royaume-Uni"
 ENG_UKSF2_desc: "Composées de forces d'élite comme le SAS et le SBS, ces unités hautement entraînées excellent dans les opérations clandestines, la lutte antiterroriste et la guerre non conventionnelle. La présence de forces spéciales d'élite accroît l'agilité stratégique et les capacités antiterroristes du Royaume-Uni, incarnant l'excellence en précision et en adaptabilité."
 ENG_aircraft_ai_idea: "Intégration de l'IA dans les avions"
 ENG_aircraft_ai_idea_desc: "À mesure que la technologie progresse, le Royaume-Uni pionnier de l'intégration de l'IA aéronautique marie l'intelligence artificielle de pointe aux capacités aériennes. Cet esprit national traduit l'engagement à exploiter l'IA pour de meilleures performances, des systèmes autonomes et des missions adaptatives."
 ENG_quality_over_quantity: "La qualité plutôt que la quantité"
 ENG_worldwide_command1: "Commandement mondial"
 ENG_worldwide_command1_desc: "Le concept d'un commandement mondial de l'armée britannique envisage une approche stratégique où la British Army étend son rayon d'action à l'échelle du globe. Cette initiative implique la mise en place d'une structure capable de coordonner et de conduire des opérations militaires partout dans le monde. Par le déploiement de forces dans diverses régions, les forces armées britanniques visent à accroître leur influence mondiale, à répondre aux menaces émergentes et à contribuer à la sécurité internationale. Le commandement mondial de l'armée britannique incarne un engagement à une action militaire proactive et polyvalente, en phase avec l'évolution des défis de sécurité."
 ENG_worldwide_command2: "Commandement mondial"
 ENG_worldwide_command2_desc: "Le concept d'un commandement mondial de l'armée britannique envisage une approche stratégique où la British Army étend son rayon d'action à l'échelle du globe. Cette initiative implique la mise en place d'une structure capable de coordonner et de conduire des opérations militaires partout dans le monde. Par le déploiement de forces dans diverses régions, les forces armées britanniques visent à accroître leur influence mondiale, à répondre aux menaces émergentes et à contribuer à la sécurité internationale. Le commandement mondial de l'armée britannique incarne un engagement à une action militaire proactive et polyvalente, en phase avec l'évolution des défis de sécurité."
