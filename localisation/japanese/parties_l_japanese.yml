l_japanese:
 democratic: "西側の世界観"
 democratic_noun: "西側"
 democratic_desc: "親西側政府"
 conservatism: "保守主義"
 conservatism_desc: "保守主義：－西側諸国および親西側諸国の政府は、ソビエト連邦の崩壊以来世界を支配してきた、アメリカ中心のリベラルな世界秩序を維持しようとしている。世界銀行や国際通貨基金などの機関を通じて、経済の自由化と非国有化を推進している。西側の世界観を持つ国々の大多数はさまざまな形態の民主主義国家であるが、現状から利益を得る親欧米の強権政府もその背後にいる。－－保守主義とは、大まかに言えば、伝統的な制度や社会規範を支持することである。民主主義国では一般に、宗教的・民族主義的価値観、自由市場経済、漸進的で慎重な改革への支持として現れる。"
 liberalism: "自由主義"
 liberalism_desc: "自由主義：－西側と親西側の各国政府は、ソ連の崩壊以来支配的な地位を占めてきたアメリカ中心の自由世界秩序を維持しようとしている。世界銀行やIMFなどの機関を通じ、経済の自由化と民営化を促進する。西側の世界観を持つ国々の大半は様々な形態の民主主義だが、現状から利益を得る親西側の強権的な政府もまたその背後にある。－－自由主義は、世界的に多様なイデオロギーである。しかし、ほとんどのリベラル派は、市民的自由、自由市場、民主的政府を支持して団結している。彼らは一般的に政治を改革主義的にとらえ、時間をかけて制度を変え、変革しようとしている。"
 socialism: "社会民主主義"
 socialism_desc: "社会民主主義：－西側と親西側の各国政府は、ソ連の崩壊以来支配的な地位を占めてきたアメリカ中心の自由世界秩序を維持しようとしている。世界銀行やIMFなどの機関を通じ、経済の自由化と民営化を促進する。西側の世界観を持つ国々の大半は様々な形態の民主主義だが、現状から利益を得る親西側の強権的な政府もまたその背後にある。－－社会民主主義は民主政治の左派に位置している。彼らは一般的に、強い福祉国家、自由な社会的価値、抜本的な改革、人権の促進、特に歴史的に抑圧されてきたグループを支持している。穏健社会主義者もこのグループに含まれることが多い。"
 Western_Autocracy: "親西側独裁"
 Western_Autocracy_desc: "Pro-Western Autocrat: - Western and Pro-Western governments seek to retain the US-centric Liberal World Order that has reigned supreme since the fall of the Soviet Union. Through institutions such as the World Bank and the IMF, they promote economic liberalization and de-nationalization of laws. While the vast majority of countries with a Western Outlook are various forms of democracies, Pro-Western strongman governments that benefit from the status quo are also behind them. ---- Pro-Western autocracies are not truly in line with \"Western Values\" of democracy, pluralism, and human rights. However, they remain aligned with the West for pragmatic reasons, and often still include some weak liberal institutions- if only to appease their western backers."
 communism: "新興の世界観"
 communism_noun: "新興"
 communism_desc: "新興連合政府"
 Conservative: "反動主義"
 Conservative_desc: "反動主義：－新興の世界観を持つ政府は、とりわけ南側と旧ソビエト圏において、支配的な自由世界秩序を、彼ら自身の代替機関と多極的な世界政治の方法で置き換えることを求めているものだ。彼らはしばしば、グローバル化、政府の形態、国内政策に対して異なる姿勢を持っている。－－反動主義は、自分たちの国がとってきた方向に不満を抱き、過去の理想化された「黄金時代」への回帰を求める。このように、彼らは自国が経験した多くの変化を逆転させようとしている。彼らは自由主義に強く反対しており、このように、現代では一般的に西側とは一線を画している。"
 Autocracy: "独裁"
 Autocracy_desc: "Autocracy: - Governments with an Emerging Outlook are those, especially in the Global South and Post-Soviet Sphere, that seek to replace the prevailing Liberal World Order with their own alternate institutions and multipolar way of global politics. They often have differing attitudes towards globalization, forms of government, and domestic policy.---- Autocracies are classic dictatorships, where a single individual wields the lion's share of political power. Autocrats oppose any factions or policies that threaten their power. Those who see the West as the principal foreign threat to their thrones will generally align with the emerging powers."
 Vilayat_e_Faqih: "シーア派革命主義"
 Vilayat_e_Faqih_desc: "Hardline Shiite Revolutionary: - Governments with an Emerging Outlook are those, especially in the Global South and Post-Soviet Sphere, that seek to replace the prevailing Liberal World Order with their own alternate institutions and multipolar way of global politics. They often have differing attitudes towards globalization, forms of government, and domestic policy.---- Khomeinism is a hardline Shiite-revolutionary ideology. Opposed to traditional monarchism, socialism, and liberalism alike, Khomeinists support the creation of a theocratic republic, where Shiite religious clerics hold supreme authority over elected officials."
 Mod_Vilayat_e_Faqih: "穏健シーア派革命主義"
 Mod_Vilayat_e_Faqih_desc: "穏健シーア派革命主義：－新興の世界観を持つ政府は、とりわけ南側と旧ソビエト圏において、支配的な自由世界秩序を、彼ら自身の代替機関と多極的な世界政治の方法で置き換えることを求めているものだ。彼らはしばしば、グローバル化、政府の形態、国内政策に対して異なる姿勢を持っている。－－穏健なシーア派の政治家は、地政学的にはまだイランに同調しているが、ホメイニ主義の神政政治を作ろうとはしない。代わりに、彼らは一般的に、シーア派イスラム教の価値観に影響された、より世俗的な政治形態を（民主的かどうかは別にして）支持している。"
 anarchist_communism: "左派"
 anarchist_communism_desc: "急進左派：－新興の世界観を持つ政府は、とりわけ南側と旧ソビエト圏において、支配的な自由世界秩序を、彼ら自身の代替機関と多極的な世界政治の方法で置き換えることを求めているものだ。彼らはしばしば、グローバル化、政府の形態、国内政策に対して異なる姿勢を持っている。－－急進左派は、共産主義よりも穏健な社会主義の構想を推進するが、社会民主主義よりは依然として強硬だ。彼らは概して、現在の国際的な経済・政治構造に対して、不公平で搾取的であると考え、反対している。"
 fascism: "サラフィー主義の世界観"
 fascism_noun: "サラフィー主義"
 fascism_desc: "全体原理主義体制"
 Kingdom: "王国"
 Kingdom_desc: "親体制派サラフィー主義：－サラフィー主義は、狂信的なスンナ派イスラムの超保守主義、原理主義である。ワッハーブ湾岸諸国の王国が20世紀半ば以降、多くの資金をその教えのために提供していることから、著しく成長してきた。サラフィー主義は、タリバン、アルカイダ、およびイスラム国において特に暴力的な姿勢を具現化させた。彼らはすべてのイスラムの土地を征服し、イスラム法の厳しい解釈によってそれらを支配しようとする。彼らはイスラム教の他宗派や少数派の宗教を認めず、目的を達成するために何でも行う－－ワッハーブ派やマドハリ派のようなサラフィー思想のある種の系統は、急進的な革命や武装ジハードよりも現状維持を主張している。これらのサラフィーは、クトゥブ派ジハード主義者の原理主義的で不寛容な見解を共有しているが、一般的には暴力を拒否し、既存の政府を支持している。彼らは、政治的イスラム主義が自分たちの権力に脅威を与えることを恐れて、権威主義的なアラブ諸国から支持されている。"
 Caliphate: "カリフ国"
 Caliphate_desc: "カリフ制：－サラフィー主義は、狂信的なスンナ派イスラムの超保守主義、原理主義である。ワッハーブ湾岸諸国の王国が20世紀半ば以降、多くの資金をその教えのために提供していることから、著しく成長してきた。サラフィー主義は、タリバン、アルカイダ、およびイスラム国において特に暴力的な姿勢を具現化させた。彼らはすべてのイスラムの土地を征服し、イスラム法の厳しい解釈によってそれらを支配しようとする。彼らはイスラム教の他宗派や少数派の宗教を認めず、目的を達成するために何でも行う。－－ジハード主義者は、異教徒ないし異端であると彼らがみなすイスラム世界の政府を取り壊し、破壊しようとする。彼らは銃を突きつけ、自分たちのイスラム教を広めようとしている。"
 neutrality: "非同盟の世界観"
 neutrality_noun: "非同盟"
 neutrality_desc: "非同盟政府"
 Neutral_conservatism: "保守主義"
 Neutral_conservatism_desc: "Conservative: - Non-Aligned governments vary vastly in government types and sub-ideologies, and usually have a very pragmatic approach to their foreign alignments. They may want to further their own national independence or other regional goals, or simply are torn between greater powers, who in their struggle for influence pull them in different directions."
 neutral_Social: "社会民主主義"
 neutral_Social_desc: "Social Democrat: - Non-Aligned governments vary vastly in government types and sub-ideologies, and usually have a very pragmatic approach to their foreign alignments. They may want to further their own national independence or other regional goals, or simply are torn between greater powers, who in their struggle for influence pull them in different directions."
