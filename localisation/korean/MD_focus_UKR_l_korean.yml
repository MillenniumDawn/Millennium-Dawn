 ukraine_reorganize_navy_repair_support_ships.3.desc: "지원함 1척과 수리함 1척을 수리하기로 결정하였으므로, 이제 바람직한 진행 방식을 선택할 때입니다.\n현재 정부가 이용할 수 있는 전용 조선소를 두 함정에 배정하여 많은 자금을 들이지 않고 수리하거나, 더 많은 자금을 투입하여 추가로 민간 조선소를 이용해 더 빠르게 수리할 수 있습니다."
