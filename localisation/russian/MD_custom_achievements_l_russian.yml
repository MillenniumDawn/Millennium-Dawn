 usa_manifest_destiny_NAME: "Явное предначертание"
 usa_manifest_destiny_DESC: "Из-за сияющих морей исходит сияющий свет демократии, и у её штурвала стоит бдительный орёл, гордо возвышающийся над своей судьбой."
 usa_novel_campaigner_NAME: "Новичок предвыборной гонки"
 usa_novel_campaigner_DESC: "Из низов политического ринга восходит новая звезда."
 GER_capture_poland_again_NAME: "Только не это...."
