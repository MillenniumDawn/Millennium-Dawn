 legco_decrease_health_motion_clock: "Текущее предложение: §YУменьшение £population_texticon §RЗдравоохранение§!Финансирование§!"
 legco_increase_social_motion_clock: "Текущее движение: §YУвеличение £consumer_goods_texticon §nПенсия§! Расходы§!"
 legco_decrease_social_motion_clock: "Текущее движение: §YУменьшение £consumer_goods_texticon §nПенсия§! Расходы§!"
 HKG_unrestricted_housing_market: "Неограниченный рынок жилья"
 HKG_unrestricted_housing_market_desc: "Свободный рынок жилья в Гонконге является одним из самых динамичных в мире и одновременно самым труднодоступным. Без вмешательства разрыв между доходами и ценами будет продолжать увеличиваться."
 HKG_victoria_harbour: "Гавань Виктория"
 HKG_victoria_harbour_desc: "Гавань Виктория — это историческое сердце портовой экономики Гонконга: здесь сходятся контейнерные перевозки, паромы и круизные терминалы."
 HKG_victoria_harbour_expand_desc: "Расширенная гавань Виктория с новыми контейнерными причалами, углубленными каналами и модернизированной системой обработки грузов."
 HKG_victoria_harbour_expand_plus_desc: "Порт Виктория работает на полную мощность благодаря современным технологиям: автоматизированные терминалы, глубоководные причалы и самый высокий грузооборот в регионе."
 legacy_of_handover_hong_kong: "Наследие передачи Гонконга"
 legacy_of_handover_hong_kong_desc: "Передача Гонконга Китаю в 1997 году создала институциональные, экономические и культурные связи между Гонконгом и материковым Китаем, которые продолжают формировать политику спустя десятилетия."
 Basic_Law_HKG: "§8Основной закон §H[HKG.GetFlag]САР Гонконг§!§!"
 Basic_Law_milltary_HKG: "Основной закон [HKG.GetFlag]САР Гонконг"
 Basic_Law_milltary_HKG_desc: "Согласно Основному закону, оборона возложена на центральное правительство. Гонконг не имеет собственных вооруженных сил; все функции по внешней обороне выполняет Гонконгский гарнизон НОАК."
 Basic_Law_HKG_desc: "Основной закон стал учредительным документом Специального административного района Гонконг после передачи Гонконга от Соединенного Королевства Китайской Народной Республике. Среди прочего, документ определяет статус Гонконга по отношению к Китаю, предоставляя ему автономию во всех вопросах, кроме обороны и внешней политики, которые находятся в ведении центрального правительства.\n\n§W----------\nБудучи §Y[HKG.GetFlag]§!§HСАР§!, не имеющим собственных вооружённых сил, необходимый уровень оборонного бюджета будет поддерживаться на уровне §H0§!, и также не будет разрешено менять §GВоенные расходы.§!§!"
 One_Country_Two_Systems: "Одна страна, две системы"
 One_Country_Two_Systems_desc: "§Y[HKG.GetFlag]Гонконгу§! и §Y[MAC.GetFlag]Макао§! гарантирована 50-летняя автономия от прямого китайского правления. Модель «одна страна, две системы» позволяет сохранить и даже расширить многие ценные политические свободы Гонконга и Макао, такие как свобода слова и свобода публичных собраний. Отсутствие этих прав на материковой части Китая является важным фактором, обусловливающим поддержку «пандемократического» лагеря в гонконгской политике, а многие обеспокоенные жители Гонконга по-прежнему с опаской относятся к усилению интеграции с материковым Китаем."
 Localist_Movement: "Движение локалистов"
 Localist_Movement_desc: "С момента передачи Гонконга Китаю в 1997 году напряжённость между жителями материкового Китая и Гонконга привела к развитию локалистских настроений «Гонконг прежде всего» среди части местных жителей Гонконга. Эти настроения выражают недоверие к политической системе коммунистического Китая, а также восприятие жителей Гонконга как культурно обособленных и даже превосходящих жителей Китая. Подъём этого движения, начавшийся с «Движения зонтиков» 2014 года, изменил ранее более сдержанный тон политического противостояния в Гонконге на более эмоциональный и радикальный."
 Lacks_Universal_Suffrage: "Отсутствует всеобщее избирательное право"
 Lacks_Universal_Suffrage_desc: "Хотя Основной закон предусматривает, что глава исполнительной власти и Законодательный совет в конечном итоге будут избираться всеобщим голосованием, этого пока не произошло, главным образом из-за опасений китайского правительства по поводу того, что может произойти, если значительно более популярная пан-демократическая партия возьмет под контроль правительство Гонконга."
 Limited_Universal_Suffrage: "Ограниченное всеобщее избирательное право"
 Limited_Universal_Suffrage_desc: "Правительство Китая согласилось разрешить избрание главы администрации Гонконга всеобщим голосованием при условии, что кандидаты будут предварительно проверены Пекином. Это широко рассматривается как шаг, направленный на снижение вероятности того, что кандидаты от пан-демократических или локалистских партий станут главой администрации."
 Universal_Suffrage: "Всеобщее избирательное право"
 Universal_Suffrage_desc: "Правительство Китая наконец согласилось разрешить Гонконгу избирать главу администрации всеобщим голосованием без вмешательства со стороны властей материкового Китая."
 Hong_Kong_Protests: "Протесты в Гонконге"
 Hong_Kong_Protests_desc: "После недавних действий китайского правительства в Гонконге вспыхнули массовые протесты с требованием отмены этих мер."
 asian_crisis_HKG_desc: "Экономический кризис, охвативший развивающиеся страны Восточной и Юго-Восточной Азии, свёл на нет десятилетия экономического роста. Потеря доверия к национальным валютам до сих пор преследует центральные банки. Государственный и частный долг также резко вырос.\n\nБыли извлечены болезненные уроки, и прошлые нежелательные экономические реформы идут полным ходом. Каждая страна пострадала по-своему, и для каждой есть свои решения.\n\nПриток инвестиций в пострадавшие страны когда-то составлял половину от общего мирового объёма, а теперь направляется в [CHI.GetFlag]Китай и другие страны."
 asian_crisis_league_HKG: "Экономический кризис, охвативший развивающиеся страны Восточной и Юго-Восточной Азии, свёл на нет десятилетия экономического роста. Потеря доверия к национальным валютам до сих пор преследует центральные банки. Государственный и частный долг также резко вырос.\n\nБыли извлечены болезненные уроки, и прошлые нежелательные экономические реформы идут полным ходом. Каждая страна пострадала по-своему, и для каждой есть свои решения.\n\nПриток инвестиций в пострадавшие страны когда-то составлял половину от общего мирового объёма, а теперь направляется в [CHI.GetFlag]Китай и другие страны."
 HKG_HKEX: "Гонконгская биржа и клиринговая компания"
 HKG_improve_trade: "Привлечение иностранных инвестиций"
 HKG_improve_trade_desc: "Скоординированные усилия по углублению торговых связей Гонконга с Азией и за ее пределами: новые соглашения, упрощение таможенных процедур и активная работа коммерческих отделов посольства."
 HKG_idea_T_PARK: "§5T-PARK§!"
 HKG_idea_T_PARK_desc: "Завод T-PARK перерабатывает гонконгские сточные воды и вырабатывает электроэнергию, выступая одновременно в качестве инфраструктуры по управлению отходами и показательного объекта по охране окружающей среды."
 HKG_new_develop_idea_dynamic_modifier: "Новая идея развития"
 HKG_new_develop_idea_dynamic_modifier_desc: "Совокупное воздействие Новой инициативы развития на экономику и инфраструктурную базу Гонконга."
 HKG_idea_secondary_education_reform: "Реформа среднего образования"
 HKG_idea_secondary_education_reform_desc: "Старая структура среднего образования 3-2-2-3 заменяется схемой 3-3-4, уже используемой в Соединенных Штатах и материковом Китае. Удаляется дублирующееся и устаревшее содержание, а также вводится более широкий спектр факультативных предметов."
 HKG_idea_patriotic_education_reform: "Патриотическая реформа образования"
 HKG_idea_patriotic_education_reform_desc: "Патриотическое воспитание не имеет места в существующей учебной программе Гонконга. Для восполнения этого пробела был введен курс гуманитарных наук."
 HKG_idea_chinese_based_education_reform: "Реформа образования на основе китайских принципов"
 HKG_idea_chinese_based_education_reform_desc: "В Гонконге сейчас во всех школах преподавание ведется на китайском языке. Все дети обязаны говорить на нем."
 HKG_rise_of_internet: "Расцвет интернета"
 HKG_rise_of_internet_desc: "Интернет открыл новое направление в развитии человечества. Окажется ли это мимолетным явлением или доминирующей экономической тенденцией в ближайшие десятилетия, покажет время."
 HKG_idea_SARS_outbreak: "Влияние SARS"
 HKG_idea_SARS_outbreak_desc: "Вспышка атипичной пневмонии (SARS) нанесла серьезный удар по экономике Гонконга и подорвала доверие населения, нарушив туристическую отрасль, розничную торговлю и повседневную жизнь по всему городу."
 HKG_idea_railway_development_strategy_2000: "Стратегия развития железных дорог 2000 года"
 HKG_idea_railway_development_strategy_2000_desc: "Стратегия развития железных дорог до 2000 года является руководящим планом расширения MTR на следующее десятилетие."
 HKG_patriotic_loyalist_drive: "Патриотическая лоялистская кампания"
 HKG_patriotic_loyalist_drive_desc: "Просвещение в области национальной безопасности пронизывает школы, телерадиовещательные компании и государственные службы. Результатом является более покорное общество и более сильные партийные институты, за счет интеллектуальной открытости и снижения объемов научных исследований."
 HKG_loyalist_civil_service_purge: "Чистка государственных служащих, лоялистов"
 HKG_loyalist_civil_service_purge_desc: "Проверочные комиссии тщательно изучают ряды государственных служащих в поисках колеблющихся и молчаливых несогласных. Повседневное управление страдает, пока идет чистка, но возникшая бюрократия будет подчиняться одному господину."
 HKG_mainland_talent_scheme: "Программа поддержки талантливых специалистов на материковой части Китая"
 HKG_mainland_talent_scheme_desc: "Освободившиеся административные места в Гонконге заполняются специалистами, получившими образование на материке. Научная деятельность восстанавливается, и офисы работают эффективно, но сокращение численности местного населения затрудняет мобилизацию политической власти на местном уровне."
 HKG_gba_integration_idea: "Интеграция Большого залива"
 HKG_gba_integration_idea_desc: "Гонконг, Макао, Шэньчжэнь и Чжухай теперь функционируют как единая экономика. Промышленное производство и торговля процветают, и граница между особыми административными районами и материковым Китаем намеренно размывается."
 HKG_great_hong_kong_nation_idea: "Великая Гонконгская нация"
 HKG_great_hong_kong_nation_idea_desc: "Гонконг провозгласил свой суверенитет вопреки Пекину. Настроение воинственное: боевой дух высок, призыв в армию широко распространен, и поколение, выросшее на примере подавления протестов под зонтиком, готово защищать независимость, за которую они боролись. Отношения с материковым Китаем зашли в тупик."
 HKG_city_state_doctrine: "Доктрина города-государства"
 HKG_city_state_doctrine_desc: "Гонконг следует сингапурской модели: небольшой, нейтральный, процветающий, технократический. Экономика процветает за счет торговли и финансов, порт является жизненно важной артерией государства, а военные амбиции твердо подчинены коммерческому прагматизму."
 HKG_under_british_wing_idea: "Под британским крылом"
 HKG_under_british_wing_idea_desc: "Гонконг формализовал свою связь в сфере безопасности и политики с Соединенным Королевством и другими странами Содружества. Это включает в себя добровольный доступ со стороны англоязычных вооруженных сил, лицензирование технологий на льготных условиях и четкую дипломатическую позицию: Лондон, а не Пекин, является главным партнером."
 HKG_pro_democracy_media: "Хартия СМИ, выступающих за демократию"
 HKG_pro_democracy_media_desc: "Издания Apple Daily, Stand News, RTHK и десятки более мелких СМИ работают под явной правовой защитой от политического вмешательства. Сети распространения дезинформации на материковом Китае с трудом набирают популярность, а общественный дискурс явно склоняется к демократическим нормам."
 HKG_civil_society_funding: "Финансирование гражданского общества"
 HKG_civil_society_funding_desc: "Неправительственные организации, ассоциации жителей и группы, выступающие за демократию, получают прозрачное государственное финансирование. В результате формируется более активная гражданская культура и незаметно укрепляется демократический лагерь, финансируемый из государственных средств."
 Basic_Law_HKG_idea_tt: "Эта идея будет отменена после §H[HKG.GetFlag]Гонконг§! заявляет о своем §RНезависимость.§!"
