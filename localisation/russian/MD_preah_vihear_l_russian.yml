 preah_vihear_observers: "Indonesian Border Observers"
 preah_vihear_observers_desc: "Unarmed Indonesian monitors are stationed along the Preah Vihear frontier under an ASEAN-brokered arrangement, watching for ceasefire violations and giving both governments some cover to let the dispute cool."
 preah_vihear_icj_grounds_TT: "Border tension is higher than 74, or Thailand has already struck across the border"