l_korean:
 HUN_karpatalja_question_category: "카르파탈랴 문제"
 HUN_annex_karpatalja: "카르파탈랴의 부름에 응답"
 HUN_annex_karpatalja_desc: "자카르파티아에서 우크라이나의 권위가 무너졌습니다. 현지 헝가리인 평의회들이 부다페스트에 합병을 승인해 달라고 요청하고 있으며, 키이우에는 거절할 사람이 남아 있지 않습니다."
 HUN_karpatalja_ultimatum: "키이우에 최후통첩"
 HUN_karpatalja_ultimatum_desc: "카르파탈랴의 헝가리 소수민족은 한 세기 동안 조국과의 재결합을 기다려 왔습니다. 키이우는 조용히 이를 넘겨주거나, 아니면 무력으로 빼앗길 것입니다."
 HUN_karpatalja_integration_category: "카르파탈랴 행정"
 HUN_701_return: "카르파탈랴의 귀환"
 HUN_701_return_desc: "카르파탈랴는 트리아농에서 상실되었습니다. 이 지방의 순응이 확보된 지금, 우리는 재결합을 영구적인 것으로 만들 수 있습니다."
 HUN_karpatalja_autonomy: "카르파탈랴 행정"
 HUN_karpatalja_autonomy_desc: "현지 평의회를 통해 카르파탈랴를 통치하면 호의를 얻고 통합이 빨라지지만, 재정 통제가 느슨해지고 이러한 방식에 대한 대중의 인내심이 소모되는 대가를 치릅니다."
 HUN_ukr_cede_tt: "§Y우크라이나가 카르파탈랴를 넘겨줍니다§!"
 HUN_ukr_refuse_tt: "§R카르파탈랴를 무력으로 차지하기 위한 전쟁 명분을 얻습니다§!"
 hungary_karpatalja.1.t: "카르파탈랴의 평의회들"
 hungary_karpatalja.1.d: "키이우가 수도에서 이토록 먼 곳까지 권위를 투사하지 못하는 가운데, 자카르파티아의 지역 의회들이 헝가리와의 합병을 추진하기로 표결했습니다. 부다페스트는 기꺼이 응할 것입니다."
 hungary_karpatalja.1.a: "그들을 고향으로 맞이한다"
 hungary_karpatalja.2.t: "카르파탈랴 통치"
 hungary_karpatalja.2.d: "카르파탈랴는 지도상으로는 헝가리 영토입니다. 이를 제대로 기능하는 행정으로 바꾸는 일은 또 다른 문제이며, 정부는 얼마나 강경하게 나설지 결정해야 합니다."
 hungary_karpatalja.2.a: "현지 평의회를 통해 통치한다"
 hungary_karpatalja.2.b: "부다페스트에서 직접 통치한다"
 hungary_karpatalja.10.t: "부다페스트의 카르파탈랴 요구"
 hungary_karpatalja.10.d: "헝가리가 최후통첩을 전달했습니다. 자카르파티아를 넘겨주지 않으면 그 결과를 감수해야 합니다. 정부는 어떻게 대응할지 결정해야 합니다."
 hungary_karpatalja.10.a: "지방을 양도한다"
 hungary_karpatalja.10.b: "최후통첩을 거부한다"
 hungary_karpatalja.11.t: "키이우의 거부"
 hungary_karpatalja.11.d: "우크라이나는 카르파탈랴에 대한 우리의 요구를 거부했습니다. 이 지방을 원한다면 우리가 직접 차지해야 할 것입니다."
 hungary_karpatalja.11.a: "전쟁을 준비한다"