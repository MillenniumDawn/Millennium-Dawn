 RAJ_brics_alliance_decisions: "BRICS"
 RAJ_brics_alliance_decisions_desc: "Les §HBRICS§! ont été fondés pour faire croître les économies des nations si souvent écartées de la table occidentale, en bâtissant une prospérité partagée indépendamment du credo, de l'idéologie ou de la devise.\n\nL'adhésion gravit trois paliers : §Yobservateur§!, puis §Yassocié§!, puis §Ymembre à part entière§!. Une nation peut postuler d'elle-même, ou le chef des BRICS peut l'inviter directement et la promouvoir dans l'échelle. Chaque étape exige que la nation tienne le chef en bonne opinion et qu'elle se situe sous assez d'influence des BRICS, si bien que le réchauffement des relations vient d'abord.\n\nSont ouverts à l'adhésion dès le départ §Yle Brésil, la Russie, la Chine, l'Afrique du Sud§!, ainsi que §Yl'Égypte, l'Éthiopie, l'Arabie saoudite, les Émirats arabes unis, l'Argentine, l'Indonésie§! et plusieurs États d'Asie centrale. Une poignée (§YVenezuela, Algérie, Cuba, Singapour, Danemark, Suède§!) doit d'abord achever sa propre priorité nationale avant de pouvoir adhérer."
 maoist_decision_category: "Insurrection naxalite-maoïste"
 maoist_decision_category_desc: "L'insurrection naxalite-maoïste est un conflit en cours en Inde où des groupes maoïstes, inspirés par l'idéologie de Mao Zedong, se sont engagés dans une rébellion armée contre le gouvernement indien. Le mouvement est né à la fin des années 1960 et est principalement actif dans les zones rurales, en particulier dans les États du Chhattisgarh, du Jharkhand et de l'Odisha. L'insurrection cherche à résoudre les problèmes d'inégalité des terres, d'exploitation et d'injustice sociale. Elle est considérée comme l'une des plus grandes menaces à la sécurité intérieure de l'Inde et a entraîné d'importantes violences et pertes en vies humaines. Le gouvernement a mis en œuvre diverses stratégies pour endiguer l'insurrection et s'attaquer aux causes sous-jacentes.\n\n$mao_current_popularity$: [?party_pop_array^19|%1]\n\n§RAvertissement:§!Si un État atteint des niveaux d'insurrection §Hgraves§! et que le soutien politique maoïste dépasse §H15 %§!, des manifestations organisées commenceront et, si elles ne sont pas maîtrisées, une rébellion armée s'ensuivra."
 suppress_maoist_activities: "Réprimer les activités maoïstes"
 indian_event.35.t: "Rébellion au Turkestan oriental"
 indian_event.35.d: "Nous avons reçu aujourd’hui des informations urgentes indiquant que les minorités musulmanes du Xinjiang ont lancé une insurrection armée pour faire sécession de la Chine et déclarer un Turkestan oriental indépendant. Apparemment, les rebelles sont soutenus par le gouvernement islamiste de l’Inde. Devons-nous lancer une intervention militaire au Xinjiang ou laisser les choses en l’état ?"
 indian_event.35.a: "Emportez le chat de leur femme."
 indian_event.35.b: "I don't give a shit."
 RAJ_REV_ETK_TT: "§BNous déclencherons une rébellion au Xinjiang !§!"
 RAJ_copied_american_warfare_tactics_idea: "Tactiques de guerre américaines copiées"
 RAJ_increase_arms_production_idea: "Augmentation de la production d’armes"
 RAJ_revolutions_help: "§BNous pouvons aider à renverser un gouvernement hostile en Asie centrale !§!"
 is_top_influencer_pak: "§Y[ROOT.GetNameWithFlag]§! a plus de §G>=35 %§! d’influence sur §Y[PAK.GetNameWithFlag]§!"
 indian_event.36.t: "La question de l’unification de nos pays"
 indian_event.36.d: "En raison des nombreuses similitudes apparues récemment entre nos pays, tant sur le plan idéologique que dans les interactions économiques et politiques, la question de l’unification de nos nations a émergé entre notre gouvernement et celui de l’Inde. Devons-nous nous unir avec notre voisin ou choisirons-nous une voie « différente » ?"
 indian_event.36.a: "Oui, nous construirons ensemble une révolution islamiste mondiale."
 indian_event.36.b: "Nous choisirons une voie différente."
 RAJ_declare_holy_jihad: "Déclarer le djihad sacré"
 RAJ_declare_holy_jihad_desc: "Le califat proclame son programme expansionniste comme un devoir religieux, mobilisant la population pour la guerre contre des voisins jugés apostats ou hostiles."
 RAJ_reach_out_to_pakistani_Salafists: "Tendre la main aux salafistes au Pakistan"
 RAJ_reach_out_to_pakistani_Salafists_desc: "Nous devons résoudre le problème avec les salafistes pakistanais afin d’ouvrir la voie vers le Moyen-Orient."
 RAJ_funding_central_asian_islamists: "Financer les islamistes d’Asie centrale"
 RAJ_funding_central_asian_islamists_desc: "L’Asie centrale est un tremplin idéal pour propager la révolution islamiste."
 RAJ_islamic_central_asian_revolutions: "Révolution au Turkestan"
 RAJ_islamic_central_asian_revolutions_desc: "En nous liant aux idéologues de l’islamisme en Asie centrale, nous pouvons grandement accroître notre sphère d’influence."
 RAJ_true_indian_territories_in_cenasia: "Établir des régimes loyaux"
 RAJ_true_indian_territories_in_cenasia_desc: "Enfin, nous pouvons unir nos frères en religion en Asie centrale."
 RAJ_turkmen_treaty: "Traité avec le Turkménistan"
 RAJ_turkmen_treaty_desc: "Le Turkménistan présente un intérêt stratégique pour nous, nous pouvons donc obtenir son soutien."
 RAJ_ally_taliban: "Nos frères afghans"
 RAJ_ally_taliban_desc: "Nous devons nous unir avec nos frères en Afghanistan, car ce n’est qu’ensemble que nous pourrons vaincre le monde laïque."
 RAJ_first_partition_of_afghanistan: "Première partition de l’Afghanistan"
 RAJ_first_partition_of_afghanistan_desc: "L’Afghanistan est un territoire qui offre un avantage idéal pour la propagation de la révolution islamiste."
 RAJ_bye_bye_turkmenistan: "Renverser le schizophrène"
 RAJ_bye_bye_turkmenistan_desc: "Pensaient-ils vraiment que nous serions amis avec eux ?"
 RAJ_peaceful_reunification: "Réunification pacifique"
 RAJ_peaceful_reunification_desc: "Grâce à notre lien religieux spécial avec les salafistes pakistanais, ainsi qu’à notre connexion économique particulière, nous avons décidé de nous réunir pacifiquement avec le Pakistan. InShaAllah !"
 RAJ_bring_back_kashmir: "Écraser les hérétiques"
 RAJ_bring_back_kashmir_desc: "Nous ne pardonnerons pas au Pakistan de continuer à nous couper l’accès à notre population au Cachemire. Le Pakistan sera détruit !"
 RAJ_nepal_fell_after_all: "Népal"
 RAJ_nepal_fell_after_all_desc: "Nous devons reprendre le contrôle du Népal pour accroître notre influence dans la région."
 RAJ_myanmar_what: "Bono ne se bat pas pour la liberté de la Birmanie"
 RAJ_myanmar_what_desc: "Bien sûr, il a le choix « libre »."
 RAJ_bangladesh_independence: "Remettre en question l’indépendance du Bangladesh"
 RAJ_bangladesh_independence_desc: "Le Bangladesh est une épine dans notre flanc, car si des troupes étrangères entrent sur son territoire, notre corridor oriental sera menacé."
 RAJ_support_xinjian_islamists: "Libérer le Turkestan oriental"
 RAJ_support_xinjian_islamists_desc: "La Chine opprime la population islamique du Xinjiang depuis trop longtemps. Nous devons les aider à obtenir leur indépendance et à vivre la vie qu’ils souhaitent."
 RAJ_troubleshoot_the_map: "Corriger l’erreur cartographique"
 RAJ_troubleshoot_the_map_desc: "Israël est la principale menace et erreur du monde. Nous devons corriger l’inexactitude dessinée sur la carte."
 RAJ_to_avenge_the_oppression_of_the_uighurs: "Venger l’oppression des Ouïghours"
 RAJ_to_avenge_the_oppression_of_the_uighurs_desc: "Il était temps de régler la question finale du bol de riz."
 RAJ_main_enemy_of_chaliphate: "Décapiter le Shaytan"
 RAJ_main_enemy_of_chaliphate_desc: "Il est temps de rembourser la dette nationale."
 RAJ_get_weapons_on_the_black_market: "Aventures sur le marché noir"
 RAJ_get_weapons_on_the_black_market_desc: "Nous sommes devenus trop isolés, ce qui nous oblige à nous procurer des armes par des moyens détournés."
 RAJ_training_our_soldiers_in_mountains: "Entraînement spécial en montagne"
 RAJ_training_our_soldiers_in_mountains_desc: "En préparant nos soldats aux conditions les plus extrêmes, nous pourrons propager notre révolution partout dans le monde sans entrave."
 RAJ_american_tactic: "Tactiques américaines"
 RAJ_american_tactic_desc: "Les tactiques américaines se sont révélées efficaces dans de nombreuses guerres. Nous devrions en prendre exemple pour notre armée."
 RAJ_increase_arms_production: "Augmenter la production d’armes"
 RAJ_increase_arms_production_desc: "Étendre la capacité nationale de production d'armements est essentiel pour soutenir nos campagnes militaires et réduire notre dépendance vis-à-vis des fournisseurs étrangers."
 RAJ_international_jihadis: "Djihadistes du Moyen-Orient"
 RAJ_international_jihadis_desc: "Les idées de l’islamisme fonctionnent beaucoup mieux au Moyen-Orient, nous devons donc les promouvoir encore et encore."
 RAJ_support_islamists: "Soutenir les islamistes en Syrie"
 RAJ_support_islamists_desc: "Avec des alliés en Syrie, nous pouvons frapper directement les pays occidentaux."
 RAJ_reconcile_al_qaeda_and_isis: "Unir les séparés"
 RAJ_reconcile_al_qaeda_and_isis_desc: "En formant une alliance unifiée avec d’autres alliés idéologiques, nous pouvons nous rapprocher considérablement de la création de notre rêve commun d’un califat islamique."
 RAJ_fight_against_idols: "Combattre l’idolâtrie"
 RAJ_fight_against_idols_desc: "Le nouveau régime s'en prend aux infrastructures religieuses hindoues, sikhes et bouddhistes, traitant les complexes de temples et les sanctuaires comme des menaces idéologiques à démanteler ou à réaffecter."
 RAJ_no_women_in_politics: "Pas de femmes en politique"
 RAJ_no_women_in_politics_desc: "Notre religion ne prévoit pas que les femmes soient impliquées en politique."
 RAJ_islamization_of_India: "Islamisation de l’Inde"
 RAJ_islamization_of_India_desc: "Un programme national de conversions forcées, de déplacements et d'ingénierie démographique remodelera la société indienne pour l'aligner sur la vision du califat d'un État sunnite unifié."
 RAJ_redo_social_policies: "Établir les lois de la charia"
 RAJ_redo_social_policies_desc: "La charia est ce dont le peuple indien a vraiment besoin. Si nous ne l’introduisons pas, nous ne pourrons pas nous prétendre un véritable califat islamique."
 RAJ_fatwa_of_factories: "Fatwa industrielle"
 RAJ_fatwa_of_factories_desc: "Une fatwa peut être définie comme une source juridique normative du droit islamique, représentant les opinions des érudits du monde islamique ayant autorité sur des questions spécifiques en cours d’examen, initiée par des juges islamiques (qadis) ou à la demande du Majlis."
 RAJ_MAO_rebellion: "Situation de rébellion"
 RAJ_fatwa_of_factories_idea: "Fatwa des usines"
 the_great_islamic_ulema: "Grand Ouléma islamique"
 indian_event.37.t: "Une nouvelle organisation islamique"
 indian_event.37.d: "Le gouvernement islamiste récemment formé en Inde nous a proposé de créer une organisation islamiste unifiée dont le principal objectif serait de propager les vues islamistes à travers le monde. Puisque le chef de cette alliance est le puissant pays qu’est l’Inde, y adhérer nous garantirait probablement la protection que nous recherchons contre les menaces extérieures et préserverait notre régime dirigeant des tentatives d’assassinat."
 indian_event.37.a: "Bien sûr, faisons équipe !"
 indian_event.37.b: "Nous pouvons aussi nous protéger nous-mêmes."
 indian_event.38.t: "L’invitation à l’alliance a été déclinée"
 indian_event.38.d: "Leur gouvernement pense pouvoir gérer une menace extérieure seul."
 indian_event.38.a: "Un résultat décevant."
 RAJ_revenge_for_the_humiliation_of_chechnya: "Venger l’humiliation du califat tchétchène"
 RAJ_revenge_for_the_humiliation_of_chechnya_desc: "Le califat tchétchène était une excellente idée, mais les capitalistes avides de Russie ont décidé de détruire ce projet. L’heure du règlement de comptes a sonné."
 indian_event.39.t: "Payer pour aider dans la guerre civile"
 indian_event.39.d: "Notre victoire dans la guerre civile n’aurait pas eu lieu sans le soutien direct du gouvernement indien. Puisque cette guerre a coûté très cher à l’Inde, elle doit obtenir quelque chose en retour. Ils exigent que nous leur donnions le contrôle de certains territoires au nord, et en échange, ils nous fourniront une protection militaire contre les menaces extérieures. Notre régime commence à peine à se consolider et nous ne voulons pas être renversés à nouveau. Que choisirons-nous ?"
 indian_event.39.a: "Nous sommes prêts à franchir cette étape."
 indian_event.39.b: "Nous n’avons pas fléchi devant l’Union soviétique, et nous ne fléchirons pas devant l’Inde non plus."
 indian_event.40.t: "Demande rejetée"
 indian_event.40.d: "Le gouvernement taliban a décidé qu’il a la force de tenir tête à notre armée."
 indian_event.40.a: "Voyons s’il peut résister à une nouvelle offensive."
 RAJ_central_asian_salaf_revolution: "Révolutions en Asie centrale"
 RAJ_HELP_TALIB: "§GSi vous n’aidez pas les talibans dans une guerre civile, ils ne céderont pas de territoire§!"
 RAJ_main_enemies_of_islamism: "Principaux ennemis de l’islamisme"
 RAJ_main_enemies_of_islamism_desc: "Nous devons venger l’effondrement du califat islamique sur tous ceux qui ont été impliqués dans sa chute."
 RAJ_proffesional_soldiers: "Soldats professionnels"
 RAJ_proffesional_soldiers_desc: "Pour propager avec succès notre révolution, nous devons renforcer notre armée."
 RAJ_mao_reb.1.t: "Contre-attaque maoïste !"
 RAJ_mao_reb.1.d: "Nous avons réussi à contrer leur activité dans la région, cependant nous avons perdu beaucoup d'hommes."
 RAJ_mao_reb.1.a: "Enterrez-les avec honneur."
 RAJ_mao_reb.2.t: "Attentat terroriste majeur !"
 RAJ_mao_reb.2.d: "Après nos récentes attaques, les maoïstes ont perpétré un énorme attentat terroriste dans nos régions densément peuplées."
 RAJ_mao_reb.2.a: "Ouch"
 RAJ_mao_reb.3.t: "Raid réussi"
 RAJ_mao_reb.3.d: "Nous avons perdu quelques hommes, mais l’ennemi a été vaincu."
 RAJ_mao_reb.3.a: "Super"
 RAJ_Export_category: "Commerce des armes indien"
 RAJ_Export_category_desc: "Dans le monde d’aujourd’hui, le commerce des armes est une partie intégrante de l’économie des pays développés, et l’Inde ne fait pas exception. Les bonnes politiques des gouvernements passés ont permis à l’Inde d’augmenter la production d’armes et de pouvoir les vendre à d’autres pays. Si nous voulons devenir une puissance compétitive sur le marché international, nous devons commencer à développer le commerce et la production d’armes. L’Inde doit entrer dans le nouveau millénaire en tant que puissance militaire avancée."
 RAJ_more_relation_is_better: "Si nous entretenons §Gde meilleures relations§! avec les pays suivants, ils seront §Cplus susceptibles de rejoindre notre faction§!"
 RAJ_start_export_weapon_TT: "Nous avons désormais obtenu l'autorisation d'exporter nos armes vers d'autres pays"
