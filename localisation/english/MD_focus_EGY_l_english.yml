 Egypt.376.desc: "Ansar Bayt al-Maqdis, the most dangerous jihadist group in the Sinai Peninsula, has pledged allegiance to the Islamic State and renamed itself Wilayat Sina, the Sinai Province of the self-proclaimed caliphate. The group has cut its ties with al-Qaeda and will now wage its insurgency in North Sinai under the Islamic State banner."
