hung_parliament_ast: "Hung Parliament"
hung_parliament_ast_desc: "For the first time since 1940, Australia is experiencing a hung parliament. None of the parties have enough seas to form government, and until we can negotiate the support necessary to bring our 72 seats to 76, we're effectively in a legislative gridlock."
hung_parliament_ast_2: "Rocky Coalition"
hung_parliament_ast_2_desc: "We may have formed a government, but the coalition that exists is less than ideal. Stocked with unhappy party members and independant wildcards, any failure to pass policy could trigger an early end for our government in it's infancy."
diplomacy_tightrope_ast: "Diplomatic Tightrope"
diplomacy_tightrope_ast_desc: "We navigate a complex balancing act, maintaining a deep security and defense alliance with the United States, while pursuing stabilized trade interdependence with China. Avoiding being forced to choose between the two is how we've managed to stay afloat."
non_permanent_unsc_member: "Non-Permanent Member of the UNSC"
non_permanent_unsc_member_desc: "The United Nations Security Council elects 10 non-permanent members to join the General Assembly every two years. These nations are able to submit resolutions precide over voting"
