 L_AT_Equipment: "대전차 유도 미사일(ATGM)"
 L_AT_Equipment_desc: "대전차 미사일 (ATM), 대전차 유도 미사일 (ATGM), 대전차 유도 무기 (ATGW)나 대전차 유도 무기는 장갑화된 적군의 차량을 파괴하고 타격하기 위한 유도 미사일입니다."
 Anti_tank_desc: "대전차 미사일 (ATM), 대전차 유도 미사일 (ATGM), 대전차 유도 무기 (ATGW)나 대전차 유도 무기는 장갑화된 적군의 차량을 파괴하고 타격하기 위한 유도 미사일입니다."
 H_AT_Equipment: "차량 탑재 대전차 유도 미사일(ATGM)"
 H_AT_Equipment_desc: "대전차포는 제한적인 작전 수행능력을 가진 채, 적 전차를 타격하는데 그 목적을 두어서, 직접 타격이 가능한 야포나 미사일 발사대를 장착한 기갑 전투 차량입니다."
 Heavy_Anti_tank_desc: "대전차포는 제한적인 작전 수행능력을 가진 채, 적 전차를 타격하는데 그 목적을 두어서, 직접 타격이 가능한 야포나 미사일 발사대를 장착한 기갑 전투 차량입니다."
 Anti_tank_1: "ATGM 1965"
 Anti_tank_1_desc: "Anti-Tank Guided Missiles are man-portable missile systems employing high explosive warheads specifically designed to attack heavily armored vehicles. This generation of ATGMs are joystick operated, and thus requires line-of-sight and a highly skilled operator."
 Heavy_Anti_tank_1: "Mounted ATGM 1965"
 Heavy_Anti_tank_1_desc: "Heavier Anti-Tank Guided Missile Systems have longer ranges and larger missile payloads. As such, the increased weight make them unsuitable for being carried around. They therefore are mounted on vehicles. They utilize high explosive warheads specifically designed to attack heavily armored vehicles. This generation of ATGMs are joystick operated, and thus requires line-of-sight and a highly skilled operator."
 Anti_tank_2: "ATGM 1985"
 Anti_tank_2_desc: "Anti-Tank Guided Missiles are man-portable missile systems employing high explosive warheads specifically designed to attack heavily armored vehicles. This generation of ATGMs uses fly-by-wire or laser semi-automatic guidance."
 Heavy_Anti_tank_2: "Mounted ATGM 1985"
 Heavy_Anti_tank_2_desc: "Heavier Anti-Tank Guided Missile Systems have longer ranges and larger missile payloads. As such, the increased weight make them unsuitable for being carried around. They therefore are mounted on vehicles. They utilize high explosive warheads specifically designed to attack heavily armored vehicles. This generation of ATGMs uses fly-by-wire or laser semi-automatic guidance."
 Anti_tank_3: "ATGM 2005"
 Anti_tank_3_desc: "Anti-Tank Guided Missiles are man-portable missile systems employing high explosive warheads specifically designed to attack heavily armored vehicles. This generation of ATGMs are fire-and-forget, using an electro-optical image seeker. They employ Tandem-charge missiles to defeat modern ERA-armor, and often are Top-Attack variants, which attacks the weakest part of the enemy armor."
 Heavy_Anti_tank_3: "Mounted ATGM 2005"
 Heavy_Anti_tank_3_desc: "Heavier Anti-Tank Guided Missile Systems have longer ranges and larger missile payloads. As such, the increased weight make them unsuitable for being carried around. They therefore are mounted on vehicles. They utilize high explosive warheads specifically designed to attack heavily armored vehicles. This generation of ATGMs are fire-and-forget, using an electro-optical image seeker. They employ Tandem-charge missiles to defeat modern ERA-armor, and often are Top-Attack variants, which attacks the weakest part of the enemy armor."
 Anti_tank_4: "ATGM 2025"
 Anti_tank_4_desc: "대전차 유도 미사일(ATGM)은 사람이 조작하여 고폭발력을 가지는 탄두가 부착된 미사일을 발사하여 장갑화된 차량을 타격하기 위한 무기입니다."
 Heavy_Anti_tank_4: "Mounted ATGM 2025"
 Heavy_Anti_tank_4_desc: "더 무거워진 대전차 유도 미사일(ATGM) 시스템은 더 긴 거리와 더 큰 발사대를 가지게 되었습니다. 그에 따라 증가한 무게는 들고다니기에는 불가능한 정도가 되었습니다. 그렇기에 차량에 탑재하여 운용합니다. 이 미사일은 적 전차를 관통하기 위한 고폭팔력을 지니는 탄두를 장착하고 있습니다."
 AA_Equipment: "휴대용 방공 시스템(MANPADS)"
 AA_Equipment_desc: "지대공 미사일(SAM)(GTAM)은 지상에서 발사하여 적 항공기나 다른 미사일을 파괴하기 위해 만들어진 무기입니다."
 Anti_Air_desc: "지대공 미사일(SAM)(GTAM)은 지상에서 발사하여 적 항공기나 다른 미사일을 파괴하기 위해 만들어진 무기입니다."
 Anti_Air_0: "휴대용 방공 시스템(MANPADS) 1965"
 Anti_Air_0_desc: "휴대용 방공 시스템(MANPADS)은 어깨에서 발사하는 지대공 미사일 발사대입니다. 어깨에서 발사하기 위한 제약으로 미사일의 크기는 작아졌지만, 단거리 체계로서의 기능은 충분합니다. 저고도의 항공기나 헬리콥터와 같은 비행체에 위협적입니다."
 SP_Anti_Air_0: "자주 대공포 1965"
 SP_Anti_Air_0_desc: "Short-Medium Range Vehicle Mounted Air Defence Systems can employ larger and thus longer ranged missiles than MANPADS, posing a threat to all aircraft. They can also carry more missiles. Such Anti-Air Systems are organized in dedicated Air Defence Platoons and Batteries."
 SP_Anti_Air_desc: "대공 차량은 대공능력을 가진 기동 차량입니다. 대공포는 빠르게 기동하는 적 항공기를 추적하기 위해 빠르게 회전할 수 있는 포탑에 장착되어 있습니다."
 Anti_Air_1: "휴대용 방공 시스템(MANPADS) 1985"
 Anti_Air_1_desc: "휴대용 방공 시스템(MANPADS)은 어깨에서 발사하는 지대공 미사일 발사대입니다. 어깨에서 발사하기 위한 제약으로 미사일의 크기는 작아졌지만, 단거리 체계로서의 기능은 충분합니다. 저고도의 항공기나 헬리콥터와 같은 비행체에 위협적입니다."
 SP_Anti_Air_1: "자주 대공포 1985"
 SP_Anti_Air_1_desc: "Short-Medium Range Vehicle Mounted Air Defence Systems can employ larger and thus longer ranged missiles than MANPADS, posing a threat to all aircraft. They can also carry more missiles. Such Anti-Air Systems are organized in dedicated Air Defence Platoons and Batteries."
