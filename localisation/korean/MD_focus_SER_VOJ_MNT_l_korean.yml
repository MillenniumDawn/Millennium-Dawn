 kosovo_focus: "코소보 중점 트리"
 KOS_albania_union: "코소보-알바니아"
 KOS_albania_union_desc: "\n\n\n\n\n\n£KOS_desctext_albans \n\n\n\n\n\n\n\n\n코소보에 사는 대다수 사람들은 §H알바니아인§![ALB.GetFlag]입니다. 이로 인해 민족 국가인 §H알바니아§![ALB.GetFlag]와의 유대는 매우 강하며, 따라서 우리는 그들과 §C하나의 국가§!로 §C통일§!하기 위해 최선을 다해야 합니다. 알바니아인[ALB.GetFlag]과 §H통일§!할 수 있다면, 우리는 단지 외세의 또 다른 전쟁터가 되는 대신 §H지역 강국§!으로서 우리의 이익을 주장할 수 있을 것입니다.\n\n우리 인구는 주로 §H알바니아인§![ALB.GetFlag]이지만, 우리나라에는 여전히 소수의 §H세르비아인§!이 있으며 이들은 §H알바니아§![ALB.GetFlag]와의 §R통일을 막으려§! 적극적으로 시도할 것입니다. 우리는 이 탭에서 제공되는 일부 결정이나 중점 트리의 중점을 통해 그들을 달래야 할 것입니다. §H세르비아인의 호감도§!는 무작위로 변동할 수 있으므로 이에 유의해야 합니다.\n\n우리가 승인된 국가가 아닌 한 §H알바니아§![ALB.GetFlag]와 통일할 수 없습니다.\n\n§H코소보-알바니아 통합[KOS.GetFlag][ALB.GetFlag]§!: §Y[?KOS_albania|%]§!\n\n코소보[KOS.GetFlag]의 §H세르비아인§! 중 §G[?KOS_serbs|%]§!가 우리를 우호적으로 보고 있습니다."
 KOS_unity_boost: "통합 §Y강화§!"
 KOS_appease_serbs: "[SER.GetFlag]세르비아인 §Y달래기§!"
 KOS_unify: "통일 §Y요청§!"
 KOS_int_recognition: "승인을 위한 투쟁"
 KOS_int_recognition_desc: "\n\n\n\n\n\n£MAIN_desctext_recogn \n\n\n\n\n\n\n\n\n우리는 세계 주요 열강으로부터 승인을 얻기 위해 적극적으로 투쟁하고 있습니다. 현재 대부분의 서방 국가는 우리를 지지하고 승인하고 있지만, 아시아와 남미의 일부 주요 국가는 여전히 승인을 거부하고 있습니다. 승인을 얻기 위해 이들 국가에 외교 사절을 보내야 할 것입니다.\n\n§C이들 국가는 우리에 대한 호감도가 높을수록 수락할 가능성이 더 높습니다.§!"
 KOS_recognition_from_china: "[CHI.GetFlag]§Y중국§!에 승인 §Y요청§!"
 KOS_recognition_from_india: "[RAJ.GetFlag]§Y인도§!에 승인 §Y요청§!"
 KOS_recognition_from_indonesia: "[IND.GetFlag]§Y인도네시아§!에 승인 §Y요청§!"
 KOS_recognition_from_brazil: "[BRA.GetFlag]§Y브라질§!에 승인 §Y요청§!"
 KOS_recognition_from_argentina: "[ARG.GetFlag]§Y아르헨티나§!에 승인 §Y요청§!"
 KOS_recognition_from_chile: "[CHL.GetFlag]§Y칠레§!에 승인 §Y요청§!"
 KOS_recognition_from_belarus: "[BLR.GetFlag]§Y벨라루스§!에 승인 §Y요청§!"
 KOS_recognition_from_ukraine: "[UKR.GetFlag]§Y우크라이나§!에 승인 §Y요청§!"
 KOS_recognition_from_russia: "[SOV.GetFlag]§Y러시아§!에 승인 §Y요청§!"
 KOS_post_war_clean_up: "전후 정리"
 KOS_post_war_clean_up_desc: "전쟁의 여파는 우리가 완전히 제거할 것이며, 우리 국가는 행복하게 살아갈 것입니다."
 KOS_the_dawn_of_the_new_scentenary: "새 세기의 여명"
 KOS_the_dawn_of_the_new_scentenary_desc: "새 천년은 우리에게 새로운 도전을 가져오겠지만, 성공적인 국가를 발전시키고 건설할 새로운 기회도 가져올 것입니다."
 KOS_Industrial_Awakening: "산업의 각성"
 KOS_Industrial_Awakening_desc: "이제 우리 산업을 되살릴 때이며, 마침내 우리 시민들에게 일자리를 주기 시작할 것입니다."
 KOS_Mining_Potential: "광업 잠재력"
 KOS_Mining_Potential_desc: "우리 땅은 큰 잠재력과 자원 매장량을 지니고 있으며, 이는 우리나라의 경제를 끌어올리는 데 크게 도움이 될 것입니다."
 KOS_Referendum: "코소보 국민투표"
 KOS_Referendum_desc: "이제 우리의 운명을 결정할 때입니다."
 KOS_coal_production_rump_up: "석탄 생산 증대"
 KOS_coal_production_rump_up_desc: "석탄이 늘어나면 경제 성장을 위한 자원이 늘어납니다. 간단한 일입니다."
 KOS_maintain_un: "UNMIK"
 KOS_maintain_un_desc: "UNMIK, 즉 코소보 UN 임무단은 코소보 국민을 보호하고, 안정을 증진하며, 인도주의 임무를 수행함으로써 이들을 위해 봉사합니다. 또한 코소보의 발전에도 매우 중요한 역할을 해 왔습니다."
 KOS_un_economists: "UN 경제학자 협력"
 KOS_un_economists_desc: "현재 우리에게는 경제학자나 경제 전문가가 없습니다. 경제 성장을 돕기 위해 UN으로부터 몇 명의 인력을 받는 것이 최선입니다."
 KOS_un_government_assistance: "UN 고문단"
 KOS_un_government_assistance_desc: "UN으로부터 정부 차원의 지원을 받으면 제대로 된 정부를 수립할 수 있습니다. 이는 통치의 결함을 바로잡는 데도 도움이 될 것입니다."
 KOS_un_hospitals: "의료 기관"
 KOS_un_hospitals_desc: "코소보에는 제대로 된 병원이 거의 없으므로, 병원을 건설하려면 국제연합의 지원이 필요합니다."
 KOS_un_build_network: "네트워크 기반시설 계획"
 KOS_un_build_network_desc: "우리의 네트워크 기반시설은 매우 낡았으며, UN 회원국의 기술을 빌려 이를 확장할 수 있습니다."
 KOS_un_schools: "교육 구상"
 KOS_un_schools_desc: "제대로 교육받지 못한다면 우리 국민이 어떻게 제대로 된 일자리를 얻을 수 있겠습니까? 가능한 한 빨리 새 학교를 세워야 합니다."
 KOS_un_troop_bases: "평화유지군 시설"
 KOS_un_troop_bases_desc: "이 기지는 주로 UN군을 주둔시키는 데 사용되겠지만, 손상된 장비를 위한 수리 기지로도 겸용될 수 있습니다."
 KOS_repairing_damages: "재난 구호"
 KOS_repairing_damages_desc: "우리의 기반시설 상당 부분이 완전히 파괴된 점을 고려하여 UN이 우리나라에 재난 구호를 제공할 것입니다."
 KOS_bandage_on_forever_war: "상처에 붕대를"
 KOS_bandage_on_forever_war_desc: "전쟁은 우리나라를 피투성이로 만들고 상처 입혔습니다. 가장 필요한 사람들을 위한 회복 계획을 수립해야 합니다."
 KOS_aligning_security: "보안 체계 정비"
 KOS_aligning_security_desc: "우리의 보안군은 꽤 소란스러우므로, 보다 전문적인 병력으로서 행동하도록 바로잡아야 할 것입니다."
 KOS_trauma_care: "외상 치료"
 KOS_trauma_care_desc: "많은 사람이 심각한 외상을 겪었습니다. UN의 자원을 사용하여 피해자들에게 적절한 치료와 돌봄을 제공할 것입니다."
 KOS_never_again: "다시는 안 된다"
 KOS_never_again_desc: "이제 세르비아의 통제에서 벗어났으니, 우리는 다시는 그런 전쟁을 겪을 필요가 없을 것입니다."
 KOS_patch_the_scars: "주권 투쟁을 견뎌내다"
 KOS_patch_the_scars_desc: "우리는 현재 점령당한 국가입니다. 우리는 해방되어야 하며, 서둘러 해내야 합니다. 다른 나라들에 지원을 요청하면 훨씬 더 빨리 해방될 수 있을 것입니다."
 KOS_for_freedom: "세르비아 내 지지 확보"
 KOS_for_freedom_desc: "세르비아 국민이 우리의 대의에 공감을 보일 수 있도록, 세르비아 내에서 우리의 대의에 대한 지지를 이끌어내야 합니다."
 KOS_break_away: "국제적 지지"
 KOS_break_away_desc: "세르비아에서 벌어진 시위가 우리의 대의에 대한 지지를 보여 준 만큼, 이 자유를 위한 투쟁에서 나머지 세계를 우리 편으로 만들어야 합니다."
 KOS_ties_albania: "알바니아의 지원"
 KOS_ties_albania_desc: "알바니아에 있는 우리 형제들은 세르비아의 위협에 맞서 싸우는 우리를 기꺼이 도울 것입니다."
 KOS_offer_support: "세르비아 지배의 종식"
 KOS_offer_support_desc: "세르비아는 더 이상 우리나라의 정치적, 사회적 지형을 지배하지 못할 것입니다. 우리는 완전한 자유에 한 걸음 더 가까워졌습니다!"
 KOS_mine_problem: "지뢰 문제"
 KOS_mine_problem_desc: "코소보 곳곳에 많은 지뢰가 흩어져 있으며, 국민이 안전하다고 느끼도록 이를 제거할 방법을 찾아야 합니다."
 kos_contact_united_states: "미국과 접촉"
 kos_contact_united_states_desc: "미국은 이러한 지뢰를 제거하기에 적합한 기술, 훈련, 장비를 갖추고 있습니다. 그들에게 연락해 대신 처리하게 하는 것이 최선입니다."
 kos_we_do_it: "자립"
 kos_we_do_it_desc: "우리는 우리 자신 외에는 누구에게도 의존할 수 없습니다. 비용이 많이 들더라도 이 지뢰들을 제거할 방법을 찾을 것입니다."
 kos_landmine_edu: "지뢰 공익 광고 캠페인"
 kos_landmine_edu_desc: "공익 광고를 통해 인식을 확산하면 우리 국민은 나라를 오갈 때 더 조심하는 법을 배우게 될 것입니다."
 kos_insurance: "보험"
 kos_insurance_desc: "국민이 다칠 경우에 대비해 국가의 보험을 확대해야 하지만, 비용이 조금 더 들 것입니다."
 kos_removal_effort: "제거 노력 두 배로"
 kos_removal_effort_desc: "현재의 지뢰 제거 속도로는 충분하지 않습니다. 큰 변화를 기대한다면 두 배로 일해야 합니다."
 KOS_kren: "KREN"
 KOS_kren_desc: "코소보 연구교육망(KREN)은 기술 지원과 발전을 제공하는 측면에서 우리나라에 상당한 도움이 될 것입니다."
 KOS_coop_american_universities: "미국 대학과의 협력"
 KOS_coop_american_universities_desc: "우리의 교육 부문은 교원 양성을 개선할 수 있도록 미국 대학들과 협력해야 합니다."
 KOS_coop_american_tech_giants: "미국 거대 기술 기업과의 협력"
 KOS_coop_american_tech_giants_desc: "우리는 코소보 사람들을 위한 기술적 기회를 확대하고자 하므로, 미국의 거대 기술 기업들과 협력하여 이것저것 배우는 것이 최선입니다."
 KOS_national_research_insitute: "국립 연구소 설립"
 KOS_national_research_insitute_desc: "우리는 큰 과학적 진보를 이루고 과학 분야의 선도 주자가 될 수 있도록 국립 연구소를 설립할 것입니다."
 KOS_fund_private_startups: "민간 스타트업 지원"
 KOS_fund_private_startups_desc: "제대로 된 경제 성장을 촉진하기 위해 민간 스타트업 기업들에 자금을 지원할 것입니다."
 KOS_radars: "레이더 기지"
 KOS_radars_desc: "제대로 된 레이더 체계 없이 우리의 항공 교통을 어떻게 올바르게 유도할 수 있겠습니까? 우리 항공기를 위해 즉시 새 레이더를 건설해야 합니다."
 KOS_security_troubles: "치안 문제"
 KOS_security_troubles_desc: "KLA의 비무장화 이후 우리 보안군은 엉망이 되었습니다. 우리나라를 더 안전하게 만들기 위한 개혁을 시작해야 합니다."
 KOS_return_of_kla: "KLA의 부활"
 KOS_return_of_kla_desc: "KLA는 NATO군에 의해 해산되었습니다. 이는 잘못된 조치였습니다. 우리나라의 안보를 개선하기 위해 이들을 되살리고 활기를 불어넣어야 합니다."
 KOS_reverse_engineer_leftovers: "역설계"
 KOS_reverse_engineer_leftovers_desc: "군수 산업에서 기술적 진보를 이루려면 NATO군이 남기고 간 무기를 역설계해야 합니다."
 KOS_heavy_mili_industrialization: "재무장 계획"
 KOS_heavy_mili_industrialization_desc: "새로운 방어 요새를 건설하는 계획은 침공하는 군대를 물리치는 데 필수적입니다."
 KOS_close_partnership_sov: "러시아와의 동반자 관계"
 KOS_close_partnership_sov_desc: "러시아와의 군사 동반자 관계를 추구하면 소형 화기를 위해 수많은 절차를 거치지 않고도 군용 무기를 얻을 수 있는 훌륭한 방법이 될 것입니다."
 KOS_russian_jets: "러시아 제트기"
 KOS_russian_jets_desc: "러시아에는 구형 전투기가 몇 대 있으니, 우리에게 몇 대 넘겨 달라고 요청해 볼 수 있을 것입니다."
 KOS_chinese_tanks: "중국 장갑차량"
 KOS_chinese_tanks_desc: "중국은 장갑차량을 대량 생산하고 있으므로, 그들에게 일부를 요청하지 않는 것은 어리석은 일일 것입니다."
 KOS_nko_doctrine: "북한식 전술"
 KOS_nko_doctrine_desc: "이전 파트너들이 제대로 된 훈련을 제공하기를 주저했으므로, 우리 군에는 북한식 전술을 활용할 것입니다."
 KOS_anatgonize_fyr: "북마케도니아 적대"
 KOS_anatgonize_fyr_desc: "우리의 남쪽 이웃인 북마케도니아가 너무 많이 전력을 키우고 있습니다. 이를 가능한 한 빨리 저지하는 것이 우리에게 최선의 이익입니다."
 KOS_new_research: "새로운 연구"
 KOS_new_research_desc: "새로운 연구 센터는 우리가 신기술을 손에 넣는 데 도움이 될 것입니다."
 KOS_small_arms: "소화기"
 KOS_small_arms_desc: "새로운 소총과 소형 화기는 우리의 군사 임무에 필수적일 것입니다."
 KOS_fortifications: "제대로 된 요새화"
 KOS_fortifications_desc: "우리의 요새는 매우 취약하여, 어느 이웃 나라든 우리의 전선을 매우 쉽게 돌파할 수 있습니다."
 KOS_reform_kfor: "KFOR 개혁"
 KOS_reform_kfor_desc: "KFOR는 구식이 되어 가고 있습니다. 천천히 하더라도 확실하게 개혁하고 개선하며, 어쩌면 확대하는 일까지 시작해야 합니다."
 KOS_recruitment_campaign: "모병 캠페인"
 KOS_recruitment_campaign_desc: "더 많은 병사를 원한다면 모병 캠페인을 개선해야 합니다."
 KOS_legacy_of_kla: "KLA의 유산"
 KOS_legacy_of_kla_desc: "현재 우리 병사 중 다수는 KLA에서도 복무했으며, 그들 중 많은 이들이 자신의 목소리가 받아들여지기를 바랍니다. 우리는 전쟁 중에 사용된 KLA의 전술 일부를 훈련에 활용할 것입니다."
 KOS_kfs: "KSF"
 KOS_kfs_desc: "코소보 보안군(KSF)은 우리나라의 새로운 군 부대가 될 것입니다."
 KOS_american_weapons: "미국 무기"
 KOS_american_weapons_desc: "미국 무기는 KSF를 확대하고 강력한 군대로 만드는 데 유용할 것입니다."
 KOS_police_desc: "코소보 경찰은 코소보의 국가 경찰 법 집행 기관입니다. 5개 부서와 8개 지역 국으로 구성되어 있으며, 정치적 수준에서는 코소보 공화국 내무행정부가 대표합니다."
 KOS_siu: "작전국"
 KOS_siu_desc: "작전국은 코소보 경찰의 주요 부서이며 구성원의 대부분을 고용하고 있습니다. 작전국장이 이끌며 세 개의 과, 즉 공공안전과, 도로교통과, 특수부대과로 구성됩니다. 앞의 두 개 과는 코소보 경찰의 근간을 이루며 일반 치안 활동, 경범죄 예방, 지역 사회 치안, 도로 안전과 같은 문제를 다룹니다. 특수부대는 나머지 두 과를 지원하며, 추가로 주요 인사 및 외교관의 근접 경호, 특별히 중요한 시설의 경비, 대테러 작전, 폭동 진압 업무를 수행합니다."
 KOS_kpc: "코소보 방호군"
 KOS_kpc_desc: "우리는 옛 전투 부대를 새로운 부대, 즉 코소보 방호군으로 재편할 것입니다."
 KOS_american_advisors: "미국 고문단"
 KOS_american_advisors_desc: "현재 우리에게는 군사 경험이 많지 않으며, 따라서 고문이 거의 없습니다. 미국에 있는 친구들에게 와서 우리 부대에 조언을 해 달라고 요청할 수 있을 것입니다."
 KOS_european_weapon_donations: "유럽의 기증"
 KOS_european_weapon_donations_desc: "유럽 국가들은 자국 무기를 우리에게 기꺼이 기증하려 하므로, 우리가 할 수 있는 동안 이를 최대한 활용해야 합니다."
 KOS_deploy_the_army: "군대 배치"
 KOS_deploy_the_army_desc: "우리가 단행한 수많은 개혁과 변화 덕분에, 코소보의 방어를 위해 새로 훈련된 병사들을 매우 쉽게 배치할 수 있습니다!"
 KOS_the_serbians: "세르비아인"
 KOS_the_serbians_desc: "세르비아인은 한동안 우리의 눈엣가시였지만, 우리는 그들과 협력할 수도 있고 적대 관계를 추구할 수도 있습니다."
 KOS_never_forgive: "결코 용서하지 않는다"
 KOS_never_forgive_desc: "우리는 세르비아의 존재와 우리를 노예로 삼겠다는 그들의 주장을 결코 받아들이지 않을 것입니다."
 KOS_fund_montenegro_rebels: "몬테네그로 반군 지원"
 KOS_fund_montenegro_rebels_desc: "우리는 세르비아의 안정을 흔들기 위해 몬테네그로에서 봉기를 조직하고 있습니다."
 KOS_anti_serb_propaganda: "반세르비아 선전"
 KOS_anti_serb_propaganda_desc: "코소보의 모든 시민이 세르비아인이 우리의 적임을 알도록 선전을 강화할 것입니다."
 KOS_revenge: "복수는 우리의 것"
 KOS_revenge_desc: "이제 세르비아인을 끝장낼 때입니다."
 KOS_cooperate: "세르비아인과의 협력"
 KOS_cooperate_desc: "우리는 세르비아인과의 관계사에 평화롭고 우호적인 새로운 장을 열 것입니다."
 KOS_joint_business_ventures: "공동 사업"
 KOS_joint_business_ventures_desc: "우리는 세르비아 사업가들과 합작 사업을 조직하고 있습니다."
 KOS_security_guarantees: "안전 보장"
 KOS_security_guarantees_desc: "공동 안전 보장은 발칸의 안정을 강화할 것입니다."
 KOS_military_partners: "군사 파트너"
 KOS_military_partners_desc: "우리는 세르비아군과 군사 동반자 관계를 발전시킬 것입니다."
 KOS_democratic_agenda: "민주주의 의제"
 KOS_democratic_agenda_desc: "코소보 민주당은 코소보에서 가장 큰 정당 중 하나입니다. 원래는 코소보 전쟁 이후 비무장화된 코소보 해방군에서 나온 사회민주주의 정당이었으며, 지도부 대부분은 알바니아 민족주의자와 코소보 인민운동의 전 구성원 출신이었습니다."
 KOS_europeanization: "유럽화"
 KOS_europeanization_desc: "오직 유럽 공동체로 가는 길만이 우리의 우선 과제이며, 우리는 이 길을 끝까지 따라갈 것입니다."
 KOS_call_for_investments: "투자 유치 호소"
 KOS_call_for_investments_desc: "우리의 작은 지역은 경제를 바닥에서 끌어올리기 위해 외국인 투자가 필요합니다."
 KOS_job_opportunities: "일자리 창출"
 KOS_job_opportunities_desc: "경제가 성장하고 있으며, 우리가 시민들에게 제공하는 새로운 일자리도 늘고 있습니다."
 KOS_fund_start_ups: "스타트업 지원"
 KOS_fund_start_ups_desc: "스타트업은 국가가 지원할 것이며, 장차 우리나라에 때때로 더 많은 투자를 가져다줄 사업이 나오기를 기대합니다."
 KOS_commit_to_rule_of_law: "법치 확립"
 KOS_commit_to_rule_of_law_desc: "법은 모두에게 동일하며, 누구에게도 봐주는 일은 없습니다."
 KOS_attack_left: "좌파 공격"
 KOS_attack_left_desc: "좌파 정치 운동은 우리나라를 붕괴로 이끌 것입니다! 우리는 이들을 우리 정치 영역에서 적극적으로 몰아낼 것입니다."
 KOS_democratic_campaigns: "민주주의 캠페인"
 KOS_democratic_campaigns_desc: "민주주의 선전은 나라 안에서 가능한 한 많이 지원될 것이며, 국민은 올바른 선택에 대해 알아야 합니다."
 KOS_values_of_freedom: "자유의 가치"
 KOS_values_of_freedom_desc: "자유와 인권이 우리의 핵심 가치로 선언될 것입니다."
 KOS_pdk: "PDK"
 KOS_pdk_desc: "코소보 민주당은 코소보에서 가장 큰 정당 중 하나입니다. 원래는 코소보 전쟁 이후 비무장화된 코소보 해방군에서 나온 사회민주주의 정당이었으며, 지도부 대부분은 알바니아 민족주의자와 코소보 인민운동의 전 구성원 출신이었습니다."
 KOS_push_for_albanian_unity: "알바니아 통합 추진"
 KOS_push_for_albanian_unity_desc: "알바니아인과 우리는 형제이자 동족이며, 우리는 이 정치적 서사를 장려할 것입니다."
 KOS_military_funding: "군 자금 지원"
 KOS_military_funding_desc: "우리를 흡수하려는 이웃이 바로 곁에 있으므로, 우리나라의 군사 부문에는 더 많은 투자가 이루어져야 합니다."
 KOS_attacking_the_right: "우파 공격"
 KOS_attacking_the_right_desc: "우파 정치인들은 우리를 무의미한 학살로 이끌 뿐이며, 우리는 그 학살에서 비교적 최근에야 벗어났습니다. 이들을 정치 활동에서 배제할 만합니다."
 KOS_support_minorities: "소수민족 지원"
 KOS_support_minorities_desc: "우리는 우리 영토 내의 세르비아 소수민족도 지원하여, 세르비아 인구가 우리에 대한 압박 수단으로 이용되지 않도록 할 것입니다."
 KOS_kosovan_independence: "코소보의 독립"
 KOS_kosovan_independence_desc: "우리의 독립은 우리의 생명입니다. 우리는 이를 지켜 왔으며 앞으로도 계속 지킬 것입니다."
 KOS_drift_from_reliance: "의존에서 벗어나기"
 KOS_drift_from_reliance_desc: "독립과 자유로 가는 길은 길겠지만, 우리는 반드시 해낼 것입니다."
 KOS_anti_corrupt_efforts: "부패 척결 노력"
 KOS_anti_corrupt_efforts_desc: "우리나라에서 부패한 관리들을 기다리는 것은 오직 한 가지, 처벌뿐입니다."
 KOS_push_neutrality: "중립 추진"
 KOS_push_neutrality_desc: "중립은 우리에게 용납할 수 없는 사치이며, 우리가 싸울 가치를 직접 확인해야 합니다."
 KOS_national_movement: "민족 운동"
 KOS_national_movement_desc: "코소보 민족해방운동은 90년대 코소보의 급진 좌익 민족주의 정치 운동이었으며 코소보 전쟁 이후에는 정당이기도 했습니다."
 KOS_distancing_from_west: "서방과의 거리 두기"
 KOS_distancing_from_west_desc: "우리 선임자들이 택한 친서방 노선은 실수였습니다. 서방 정치인들은 우리나라에 끝없는 전쟁 말고는 아무것도 주지 않았습니다."
 KOS_welfare_programs: "복지 프로그램"
 KOS_welfare_programs_desc: "보건 의료 프로그램을 개선해야 하며, 모든 코소보 사람에게 최고의 의료가 제공되어야 합니다."
 KOS_kosvan_identity: "코소보인의 정체성"
 KOS_kosvan_identity_desc: "우리는 코소보인이며, 우리의 민족 정체성을 모든 수단을 동원해 보존하고 지킬 것입니다."
 KOS_fighting_serb_influence: "세르비아 영향력과의 투쟁"
 KOS_fighting_serb_influence_desc: "우리 공화국 내 세르비아의 영향력은 점차 근절되어야 하며, 우리는 통합이 아니라 독립을 추구합니다."
 KOS_chinese_friendship: "중국과의 우의"
 KOS_chinese_friendship_desc: "중국 투자자들이 우리나라에 투자하는 데 관심을 보이고 있습니다. 그들에게 길을 열어 주는 것도 고려해 볼 만합니다."
 KOS_teachings_of_marx: "마르크스의 가르침"
 KOS_teachings_of_marx_desc: "마르크스의 가르침은 우리 교육 기관에서 필수가 될 것입니다."
 KOS_distance_from_islam: "이슬람과의 거리 두기"
 KOS_distance_from_islam_desc: "이슬람은 우리를 밝은 미래로 이끌지 못할 것이며, 오직 사회주의만이 우리의 어두운 현실을 비추는 밝은 빛줄기입니다."
 KOS_crushing_the_liberals: "자유주의자 분쇄"
 KOS_crushing_the_liberals_desc: "우리 주에 있는 자유주의 정치인들은 정치 활동에서 배제되어야 합니다."
 KOS_struggle_for_recognition: "승인을 위한 투쟁"
 KOS_struggle_for_recognition_desc: "이제 우리가 독립 국가로서 승인받기 위해 싸우기 시작할 때입니다."
 KOS_campaign_south_america: "남아메리카 캠페인"
 KOS_campaign_south_america_desc: "이 지역의 국가들과 관계를 수립하여 장차 우리의 독립을 승인하도록 하겠습니다."
 KOS_campaign_east_europe: "동유럽 캠페인"
 KOS_campaign_east_europe_desc: "이 지역의 국가들과 관계를 수립하여 장차 우리의 독립을 승인하도록 하겠습니다."
 KOS_campaign_asia: "아시아 캠페인"
 KOS_campaign_asia_desc: "이 지역의 국가들과 관계를 수립하여 장차 우리의 독립을 승인하도록 하겠습니다."
 KOS_recognized_state: "승인받은 국가"
 KOS_recognized_state_desc: "마침내 우리는 승인받은 국가가 되었습니다."
 kosovo_rec.2.t: "[FROM.GetName](이)가 우리의 승인을 거부함"
 kosovo_rec.2.d: "[FROM.GetName]의 대표단이 우리의 최근 요청에 대해 승인을 거부했습니다. 나중에 다시 시도해야 할 것으로 보입니다."
 kosovo_rec.2.a: "슬프군"
 kosovo_rec.3.t: "[FROM.GetName](이)가 우리를 승인함"
 kosovo_rec.3.d: "[FROM.GetName]의 대표단이 우리의 최근 요청에 따라 승인 절차를 시작하기로 결정했습니다. 이는 우리 국민과 우리 민족에게 큰 승리입니다."
 kosovo_rec.3.a: "좋아"
 kosovo_rec.1.t: "코소보가 승인을 요청함"
 kosovo_rec.1.d: "코소보의 외교관들이 우리를 찾아와 자국을 국가로 승인해 달라고 요청했습니다. 까다로운 과정이 되겠지만, 그들을 승인해서 우리가 손해 볼 일은 없을 것입니다."
 kosovo_rec.1.a: "안 될 것 없지"
 kosovo_rec.1.b: "지금은 아니다"
 kosovo_rec.5.b: "지금은 아니다"
 kosovo_rec.10.t: "코소보가 승인을 요청함"
 kosovo_rec.10.d: "코소보의 외교관들이 우리를 찾아와 자국을 국가로 승인해 달라고 요청했습니다. 까다로운 과정이 되겠지만, 그들을 승인해서 우리가 손해 볼 일은 없을 것입니다."
 kosovo_rec.10.a: "안 될 것 없지"
 kosovo_rec.10.b: "지금은 아니다"
 kosovo_rec.11.t: "코소보가 승인을 요청함"
 kosovo_rec.11.d: "코소보의 외교관들이 우리를 찾아와 자국을 국가로 승인해 달라고 요청했습니다. 까다로운 과정이 되겠지만, 그들을 승인해서 우리가 손해 볼 일은 없을 것입니다."
 kosovo_rec.11.a: "안 될 것 없지"
 kosovo_rec.11.b: "지금은 아니다"
 kosovo_rec.12.t: "코소보가 승인을 요청함"
 kosovo_rec.12.d: "코소보의 외교관들이 우리를 찾아와 자국을 국가로 승인해 달라고 요청했습니다. 까다로운 과정이 되겠지만, 그들을 승인해서 우리가 손해 볼 일은 없을 것입니다."
 kosovo_rec.12.a: "안 될 것 없지"
 kosovo_rec.12.b: "지금은 아니다"
 kosovo_rec.16.t: "몬테네그로의 봉기"
 kosovo_rec.16.d: "우리는 몬테네그로 반군에 자금을 지원하는 데 성공했고, 이제 그들은 자국에서 무장 반란을 일으킬 준비가 되었습니다."
 kosovo_rec.16.a: "몬테네그로의 자유를 위하여!"
 kosovo_rec.17.t: "몬테네그로의 봉기"
 kosovo_rec.17.d: "우리는 민병대를 신속하고 효율적으로 준비시킬 수 있었으며, 세르비아군은 패배할 것입니다!"
 kosovo_rec.17.a: "몬테네그로의 자유를 위하여!"
 kosovo.7.t: "코소보가 연방 창설을 원함"
 kosovo.7.d: "코소보 정부가 매우 이상한 요청을 보내왔습니다. 그들은 우리에게 새로운 발칸 국가인 서발칸 연방을 함께 창설하자고 요구하고 있습니다."
 kosovo.7.a: "그렇다, 참여하겠다"
 kosovo.7.b: "안된다"
 kosovo.8.t: "알바니아가 수락함"
 kosovo.8.d: "알바니아가 단일 국가를 형성하자는 우리의 요청을 수락했습니다. 오늘은 우리 역사에서 중대한 날이 될 것입니다."
 kosovo.8.a: "우리는 하나의 민족이다"
 kosovo.9.t: "알바니아가 거부함"
 kosovo.9.d: "알바니아가 통일 국가를 형성하자는 우리의 요청을 거부했습니다. 대의에 대한 그들의 배신을 우리는 잊지 않을 것입니다!"
 kosovo.9.a: "유감이군"
 kosovo.9.b: "외교가 통하지 않는다면 전쟁이 통할 것이다!"
 kosovo_rec.4.t: "코소보가 승인을 요청함"
 kosovo_rec.4.d: "코소보의 외교관들이 우리를 찾아와 자국을 국가로 승인해 달라고 요청했습니다. 까다로운 과정이 되겠지만, 그들을 승인해서 우리가 손해 볼 일은 없을 것입니다."
 kosovo_rec.4.a: "안 될 것 없지"
 kosovo_rec.4.b: "지금은 아니다"
 kosovo_rec.5.t: "코소보가 승인을 요청함"
 kosovo_rec.5.d: "코소보의 외교관들이 우리를 찾아와 자국을 국가로 승인해 달라고 요청했습니다. 까다로운 과정이 되겠지만, 그들을 승인해서 우리가 손해 볼 일은 없을 것입니다."
 kosovo_rec.5.a: "Why not"
 kosovo_rec.6.t: "세르비아가 거부함!"
 kosovo_rec.6.d: "세르비아가 합의에서 발을 뺐습니다."
 kosovo_rec.6.a: "알겠다"
 kosovo_un.1.t: "UN 지원 협상"
 kosovo_un.1.d: "UN이 우리의 지원 제안을 수락했습니다. 이제 그들에게 무엇을 요청할지 정해야 합니다."
 kosovo_un.1.a: "교육 지원"
 kosovo_un.1.b: "경제 지원"
 kosovo_un.1.c: "사회 지원"
 ser_kos.1.t: "코소보 국민투표"
 ser_kos.1.d: "코소보에서 독립 국민투표가 실시되었고, 과반수가 우리나라로부터의 분리를 결정했습니다. 모든 것을 그대로 둘 것입니까, 아니면 무력으로 제거할 것입니까?"
 ser_kos.1.a: "국민투표는 불법이다!"
 ser_kos.1.b: "그들을 보내 주자"
