 ALG_hardliner_control: "Contrôle dur choisi dans l'événement"
 ALG_islamist_path: "Voie islamiste choisie dans l'événement"
 ALG_oil_focused_energy_tt: "Revenu supplémentaire : 0,050 $ !"
 ALG_oil_focused_energy_self_sufficient: "Nation pétrolière autosuffisante"
 ALG_oil_focused_energy_self_sufficient_desc: "L'Algérie a décidé d'exploiter ses ressources pétrolières inexploitées pour devenir autosuffisante en énergie. Bon marché et facilement accessible, le pétrole n'est toutefois pas l'approche la plus respectueuse de l'environnement."
 ALG_oil_focused_energy_small_profit: "Une nation pétrolière rentable"
 ALG_oil_focused_energy_small_profit_desc: "L'Algérie a décidé d'exploiter ses ressources pétrolières inexploitées pour devenir autosuffisante en énergie. Bon marché et facilement accessible, le pétrole n'est toutefois pas l'approche la plus respectueuse de l'environnement."
