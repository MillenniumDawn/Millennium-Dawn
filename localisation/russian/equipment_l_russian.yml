 SPR_mbt_equipment_1: "Leopard 2A4"
 SPR_MBT_1: "M60A3TTS"
 SPR_MBT_1_short: "M60A3TTS"
 SPR_MBT_2: "AMX-30E"
 SPR_MBT_2_short: "AMX-30E"
 SPR_MBT_3: "Leopard 2A4S"
 SPR_MBT_3_short: "Leopard 2A4S"
 SPR_MBT_4: "Leopard 2A6E"
 SPR_MBT_4_short: "Leopard 2A6E"
 SPR_MBT_5: "Leopard 2A7+"
 SPR_MBT_5_desc: "Leopard 2A7+ предназначен для работы как в условиях конфликтов низкой, так и высокой интенсивности. Защита танка была повышена за счет модульной брони; лобовая защита была улучшена за счет двойного комплекта на башне и передней части корпуса, в то время как 360-градусная защита от РПГ и противоминная защита повышают живучесть танка в городских условиях. Компоненты системы модульной брони впервые были использованы Канадой в Афганистане. Он может стрелять программируемыми боеприпасами HE, а установленный на башне MG3 был заменен стабилизированной дистанционно управляемой боевой станцией FLW 200. Также были улучшены мобильность, устойчивость и ситуационная осведомленность."
