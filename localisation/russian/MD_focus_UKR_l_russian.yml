 ukraine_equipment_develop_domestic_atgm.8.desc: "Замечательные специалисты КБ «Луч» завершили разработку ПТРК «Булава» по принципу «выстрелил и забыл», и теперь мы можем выбрать следующий шаг по принятию этой новой системы на вооружение [ROOT.GetFlag] Вооружённых сил страны [ROOT.GetName]."
 ukraine_equipment_develop_domestic_atgm.8.a: "Получить сам проект"
 ukraine_equipment_develop_domestic_atgm.8.b: "Запустить полномасштабное производство"
 ukraine_equipment_develop_domestic_atgm.8.c: "Подготовиться к полномасштабному производству"
 UKR_Develop_Domestic_ATGM_Bulava_kyiv_expansion_tt: "Через §Y240–300 дней§! §YКиев§! получит §G1 военный завод§!, а мы — проект §Y«Булава»§! с собственной производственной линией."
 ukraine_equipment_develop_domestic_atgm.9.name: "ПТРК «Булава»: готов к производству"
 ukraine_equipment_develop_domestic_atgm.9.desc: "Мы завершили расширение завода КБ «Луч» и переоснащение его оборудования, так что можно начинать полномасштабное производство ПТРК «Булава»."
 ukraine_equipment_develop_domestic_atgm.9.a: "Отлично! Запускайте производство"
 ukraine_light_transport_tender.1.name: "Тендер на лёгкую транспортную машину"
 ukraine_light_transport_tender.1.desc: "Машина на изображении — советский УАЗ-469 по прозвищу «козлик». Понятно, почему наши Вооружённые силы хотят заменить его более специализированной, мощной и современной техникой. Проведённый ранее тендер привлёк несколько украинских предложений новой лёгкой машины — от простой небронированной вспомогательной машины до более защищённых платформ. Самыми перспективными оказались три проекта: ЛуАЗ-1901 «Геолог», Д-041 «Степ» и «Дозор-А». ЛуАЗ-1901 «Геолог» можно сразу купить небольшой партией или наладить его серийный выпуск на Луцком автомобильном заводе."
 ukraine_light_transport_tender.1.a: "Купить небольшую партию §YЛуАЗ-1901 «Геолог»§!"
 ukraine_light_transport_tender.1.b: "Расширить Луцкий завод для выпуска §YЛуАЗ-1901 «Геолог»§!"
 ukraine_light_transport_tender.1.c: "Выбрать §YД-041 «Степ»§!"
 ukraine_light_transport_tender.1.d: "Выбрать §Y«Дозор-А»§!"
 ukraine_light_transport_tender.2.name: "Конфигурация Д-041 «Степ»"
 ukraine_light_transport_tender.2.desc: "Д-041 «Степ» можно разработать в нескольких конфигурациях. Самые практичные варианты — пикап для перевозки грузов и общих задач или версия с закрытым кузовом, лучше защищающая личный состав и оборудование."
 ukraine_light_transport_tender.2.a: "Выбрать конфигурацию §Yпикап§!"
 ukraine_light_transport_tender.2.b: "Выбрать конфигурацию §Yс закрытым кузовом§!"
 ukraine_light_transport_tender.3.name: "Конфигурация «Дозор-А»"
 ukraine_light_transport_tender.3.desc: "«Дозор-А» может поставляться нам в нескольких конфигурациях. Его можно вооружить единым пулемётом ПКМ прямо на заводе, а можно сэкономить и не вооружать вовсе."
 ukraine_light_transport_tender.3.a: "Выбрать §Yневооружённый§! вариант"
 ukraine_light_transport_tender.3.b: "Выбрать вариант §Yс ПКМ§!"
 ukraine_light_transport_tender.4.name: "Расширение Луцкого завода завершено"
 ukraine_light_transport_tender.4.desc: "Новые цеха Луцкого автомобильного завода готовы. Расширенный завод теперь может серийно выпускать ЛуАЗ-1901 «Геолог» для наших Вооружённых сил."
 ukraine_light_transport_tender.4.a: "Запустить производственную линию"
 ukraine_light_transport_tender_lutsk_expansion_tt: "Через §Y240–300 дней§! §YВолынь§! получит §G1 военный завод§!, и начнёт работу производственная линия §YЛуАЗ-1901 «Геолог»§!."
 UKR_develop_domestic_btr4_category: "Разработать §YБТР-4§![UKR_btr4_development_steps_loc]"
 UKR_develop_domestic_btr4_category_desc: "\n\n\n\n\n\n£UKR_desctext_btr4_main\n\n\n\n\n\n\n\n\nМы можем потратить время и деньги на исследования и испытания совершенно новой отечественной конструкции современного БТР."
 ukraine_strat_bombers_problem.1.t: "Дальняя авиация Украины"
 ukraine_strat_bombers_problem.1.d: "После распада §RСоветского Союза§! §G[UKR.GetNameWithFlag]§! унаследовала значительные силы стратегической авиации. Однако содержание этих самолётов становится для государства всё более тяжёлым бременем. Большинство из них простаивает, требует дорогостоящего обслуживания и постепенно утрачивает боеспособность.\n\nТеперь §G[UKR.GetNameWithFlag]§! должна решить, что делать с оставшимися стратегическими бомбардировщиками."
 ukraine_strat_bombers_problem.1.a: "Нужно принять решение."
 ukraine_strat_bombers_problem.2.t: "Предложение Москвы"
 ukraine_strat_bombers_problem.2.d: "8 октября 1999 года правительство §R[SOV.GetNameWithFlag]§! предложило §G[UKR.GetNameWithFlag]§! передать ему 7 самолётов §GТу-160§!, 3 §GТу-95МС§! и 575 крылатых ракет Х-55 из состава дальней авиации в счёт погашения долга за газ. Сделка сократила бы расходы на содержание самолётов и дала бы §Y[UKR.GetNameWithFlag]§! некоторое финансовое облегчение.\n\nОднако принять сделку означало бы отказаться от значительной части стратегической авиации §GУкраины§!, а наши эксперты оценили сами бомбардировщики намного дороже долга (275 млн гривен), который русские должны списать."
 ukraine_strat_bombers_problem.2.a: "Продолжить сделку."
 ukraine_strat_bombers_problem.2.b: "Русские пытаются нас обмануть."
 ukraine_strat_bombers_problem.3.t: "Судьба оставшихся самолётов"
 ukraine_strat_bombers_problem.3.d: "После передачи части дальней авиации Украины России у нас по-прежнему остаётся немало стареющих самолётов. Их содержание в рабочем состоянии требует ресурсов, которые государство едва может себе позволить.\n\n§G[USA.GetNameWithFlag]§!, §G[GER.GetNameWithFlag]§!, §G[FRA.GetNameWithFlag]§! и §G[ENG.GetNameWithFlag]§! хотят, чтобы мы соблюдали соглашения о разоружении и пустили их на слом. Однако есть и другой вариант: попытаться сохранить оставшиеся самолёты в составе Воздушных сил Украины."
 ukraine_strat_bombers_problem.3.a: "Разобрать оставшиеся самолёты."
 ukraine_strat_bombers_problem.3.b: "Сохранить их и попытаться восстановить."
 ukraine_strat_bombers_problem.4.t: "Последний украинский Ту-160"
 ukraine_strat_bombers_problem.4.d: "Ликвидация стратегической авиации Украины продолжается. Последний §YТу-160§! с бортовым номером §R«26 красный»§! передан в качестве экспоната Полтавскому музею авиации.\n\nНа этом история украинского парка §YТу-160§! заканчивается."
 ukraine_strat_bombers_problem.4.a: "Какая трагическая судьба."
 ukraine_strat_bombers_problem.5.t: "Нота Запада"
 ukraine_strat_bombers_problem.5.d: "Наши западные партнёры уведомили нас, что мы так и не избавились от парка §YТу-22М3§!, и у нас есть около месяца, чтобы начать их утилизацию, иначе последуют меры. \n\nУ нас есть месяц, чтобы решить: оставить всё как есть или избавиться от авиакрыльев §YТу-22М3§!."
 ukraine_strat_bombers_problem.5.a: "Посмотрим."
 ukraine_strat_bombers_problem.6.t: "Последствия наших действий"
 ukraine_strat_bombers_problem.6.d: "Как нас и предупреждали, инвестиции в нашу экономику прекратились, и это заметно ухудшит наше экономическое положение."
 ukraine_strat_bombers_problem.6.a: "Очень жаль"
 ukraine_strat_bombers_problem.7.t: "Одобрение Запада"
 ukraine_strat_bombers_problem.7.d: "Решение Украины отказаться от оставшейся дальней авиации приветствовали западные страны. Вашингтон и европейские столицы считают ликвидацию советского стратегического наследия Украины важным шагом к более тесному сотрудничеству с НАТО и к нераспространению ядерного оружия."
 ukraine_strat_bombers_problem.7.a: "Мы сделали правильный выбор."
 ukraine_strat_bombers_problem.8.t: "Судьба оставшихся самолётов"
 ukraine_strat_bombers_problem.8.d: "[UKR.GetNameWithFlag] отказалась передать свою дальнюю авиацию стране [SOV.GetNameWithFlag], и весь парк остался под украинским контролем. Однако самолёты стареют, их содержание обходится дорого, и поддерживать их в рабочем состоянии всё труднее.\n\n§G[USA.GetNameWithFlag]§!, §G[GER.GetNameWithFlag]§!, §G[FRA.GetNameWithFlag]§! и §G[ENG.GetNameWithFlag]§! хотят, чтобы мы соблюдали соглашения о разоружении и пустили их на слом. Однако есть и другой вариант: попытаться сохранить оставшиеся самолёты в составе Воздушных сил Украины.\n\nВосстановление бомбардировщиков станет §Gособо важным военным проектом§!, и §YВерховная Рада§! будет охотнее одобрять увеличение военного бюджета."
 ukraine_strat_bombers_problem.8.a: "Разобрать оставшиеся самолёты."
 ukraine_strat_bombers_problem.8.b: "Сохранить их и попытаться восстановить."
 ukraine_strat_bombers_problem.9.t: "Последний украинский Ту-160"
 ukraine_strat_bombers_problem.9.d: "Ликвидация стратегической авиации Украины продолжается. Последний §YТу-160§! с бортовым номером §R«26 красный»§! передан в качестве экспоната Полтавскому музею авиации.\n\nНа этом история украинского парка §YТу-160§! заканчивается."
 ukraine_strat_bombers_problem.9.a: "Какая трагическая судьба."
 ukraine_strat_bombers_problem.12.t: "Одобрение Запада"
 ukraine_strat_bombers_problem.12.d: "Решение Украины отказаться от оставшейся дальней авиации приветствовали западные страны. Вашингтон и европейские столицы считают ликвидацию советского стратегического наследия Украины важным шагом к более тесному сотрудничеству с Западом."
 ukraine_strat_bombers_problem.12.a: "Мы сделали правильный выбор."
 ukraine_strat_bombers_problem.10.t: "Нота Запада"
 ukraine_strat_bombers_problem.10.d: "Наши западные партнёры уведомили нас, что мы так и не начали утилизацию парка §YТу-22М3§!. Нам дали примерно месяц, чтобы начать их разделку, иначе последуют меры. \n\nУ нас есть месяц, чтобы решить: оставить всё как есть или избавиться от авиакрыльев §YТу-22М3§!."
 ukraine_strat_bombers_problem.10.a: "Посмотрим."
 ukraine_strat_bombers_problem.11.t: "Последствия наших действий"
 ukraine_strat_bombers_problem.11.d: "Как нас и предупреждали, инвестиции в нашу экономику прекратились, и это заметно ухудшит наше экономическое положение."
 ukraine_strat_bombers_problem.11.a: "Очень жаль"
