 FRA_infantry_weapons_2: "파마스 F1"
 FRA_infantry_weapons_2_desc: "사양 아르메 드 생테티엔 제작소 돌격소총(FAMAS)은 1970년대에 프랑스군을 위해 제작된 프랑스제 불펍 자동소총입니다."
 FRA_infantry_weapons_3: "파마스 G1"
 FRA_infantry_weapons_3_desc: "FAMAS G1은 GIAT 인더스트리즈가 제작한 FAMAS의 파생형으로, 극지 전투에서 장갑을 낀 채 사용할 수 있도록 새로운 핸드가드를 갖추었습니다."
 FRA_infantry_weapons_4: "파마스 G2"
 FRA_infantry_weapons_4_desc: "FAMAS G2는 NATO 5.56mm 탄과 표준화하기 위해 1994년에 개발된 FAMAS의 파생형입니다."
 FRA_infantry_weapons_5: "파마스 펠랭"
 FRA_infantry_weapons_5_desc: "FAMAS 펠랭은 '통합 연결 장비를 갖춘 보병'을 뜻하며, 전방에 무전기 조작부가 있는 수직 손잡이와 신형 열 영상 조준경이 추가되었습니다."
 FRA_infantry_weapons_6: "HK416F"
 FRA_infantry_weapons_6_desc: "HK416과 HK416A5를 프랑스식으로 혼합한 이 무기는 표준형과 단축형의 2가지 파생형으로 나뉩니다."
