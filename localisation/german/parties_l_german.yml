 Neutral_Muslim_Brotherhood: "Gemäßigter Islamismus"
 Neutral_Muslim_Brotherhood_desc: "Gemäßigte Islamisten: - Gruppen und Parteien, die von der Muslimbruderschaft inspiriert sind, einer transnationalen sunnitisch-islamistischen Organisation, die 1928 in Ägypten vom islamischen Gelehrten Hassan al-Banna gegründet wurde. Sie hat Anhänger in der gesamten arabischen Welt und darüber hinaus mit ihrem Modell des politischen Aktivismus in Kombination mit islamischer Wohltätigkeitsarbeit. Ihr Ziel ist eine politische islamische Regierungsführung und die Etablierung des Korans und der Sunna als alleinige Referenz für die Gesellschaft."
 nationalist: "Nationalistische Richtung"
 nationalist_noun: "Nationalist "
 nationalist_desc: "Nationalistische Regierung"
 Nat_Autocracy: "Militärjunta"
 Nat_Autocracy_desc: "Militärdiktatur: Nationalistische Regierungen glauben, dass sie bei der Globalisierung zu kurz gekommen sind, und streben eine nationale Wiedergeburt auf der Grundlage von Protektionismus, Militarisierung und nationaler und ethnischer Souveränität an. Sie verabscheuen globale liberale Institutionen, können aber in ihrer internationalen Ausrichtung pragmatisch bleiben, um ihre engstirnigen innenpolitischen oder expansionistischen Ziele zu erreichen."
 Nat_Fascism: "Faschismus"
 Nat_Fascism_desc: "Faschistisch: Nationalistische Regierungen glauben, dass sie bei der Globalisierung zu kurz gekommen sind, und streben eine nationale Wiedergeburt auf der Grundlage von Protektionismus, Militarisierung und nationaler und ethnischer Souveränität an. Sie verabscheuen globale liberale Institutionen, können aber in ihrer internationalen Ausrichtung pragmatisch bleiben, um ihre engstirnigen innenpolitischen oder expansionistischen Ziele zu erreichen."
 Nat_Populism: "Populismus"
 Nat_Populism_desc: "Rechtspopulisten: Nationalistische Regierungen glauben, dass sie bei der Globalisierung zu kurz gekommen sind, und streben eine nationale Wiedergeburt auf der Grundlage von Protektionismus, Militarisierung und nationaler und ethnischer Souveränität an. Sie verabscheuen globale liberale Institutionen, können aber in ihrer internationalen Ausrichtung pragmatisch bleiben, um ihre engstirnigen innenpolitischen oder expansionistischen Ziele zu verfolgen."
 Monarchist: "Monarchist"
 Monarchist_desc: "Monarchisten: Nationalistische Regierungen glauben, dass sie bei der Globalisierung zu kurz gekommen sind, und streben eine nationale Wiedergeburt auf der Grundlage von Protektionismus, Militarisierung und nationaler und ethnischer Souveränität an. Sie verabscheuen globale liberale Institutionen, können aber in ihrer internationalen Ausrichtung pragmatisch bleiben, um ihre engstirnigen innenpolitischen oder expansionistischen Ziele zu verfolgen."
 communist_state: "Communist"
 communist_state_desc: "Communist State: - Governments with an Emerging Outlook are those, especially in the Global South and Post-Soviet Sphere, that seek to replace the prevailing Liberal World Order with their own alternate institutions and multipolar way of global politics. They often have differing attitudes towards globalization, forms of government, and domestic policy.\n\nCommunism is a radical socialist ideology, which is staunchly opposed to free market capitalism, instead promoting that control over the means of production be held by 'the workers'. What exactly this means varies, but has often translated to the state and economy being controlled by a single, authoritarian 'Communist Party'. Since the collapse of the Soviet Union, communism has greatly diminished across the world, but some states still claim it as their official ideology. Those aligned with the emerging powers see the current liberal, capitalist world order as exploitative, and believe it must be torn down and replaced."