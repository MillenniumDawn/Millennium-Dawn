 SAU_research_modifery_01: "§H多元化§! - 研发"
 SAU_research_modifery_01_desc: "对大学和研究机构的专项资助正在加速沙特阿拉伯王国向非石油知识经济转型的步伐。"
 SAU_research_modifery_02: "§H多元化§! - 世界级研发"
 SAU_research_modifery_02_desc: "像阿卜杜拉国王科技大学这样的旗舰机构使沙特阿拉伯成为正在崛起的区域科学创新中心，吸引了来自世界各地的人才。"
 SAU_research_modifier_01: "唤醒心灵"
 SAU_research_modifier_01_desc: "基础扫盲计划正在扩大能够接受正规教育的沙特阿拉伯人数量。"
 SAU_research_modifier_02: "阅读之国"
 SAU_research_modifier_02_desc: "识字率的提高扩大了阅读人群，也增加了对学校和教育材料的需求。"
 SAU_research_modifier_03: "扩大教育"
 SAU_research_modifier_03_desc: "学校扩建和招生规模扩大，使更多沙特人有机会接受小学和中学教育。"
 SAU_research_modifier_04: "学习基础"
 SAU_research_modifier_04_desc: "王国已建立起完善的国家教育体系所需的机构和培训人员。"
 SAU_research_modifier_06: "培养智力"
 SAU_research_modifier_06_desc: "大学和研究机构正在培养更多高素质的沙特专业人才。"
 SAU_royal_ulema_alliance_content: "§H王室-乌里玛联盟§!"
 SAU_royal_ulema_alliance_content_desc: "§L乌里玛§!与§H沙特王室§!合作卓有成效。例行的教令有利于王室；例行的政策尊重宗教人士。双方都没有什么可抱怨的。"
 SAU_royal_ulema_alliance_high: "§H王室-乌里玛联盟§!"
 SAU_royal_ulema_alliance_high_desc: "§L高级学者议会§!坚定拥护王权，宗教机构也维护王室政策的合法性。这种紧密的联盟极大地巩固了王朝的统治。"
 SAU_royal_ulema_alliance_neutral: "§H王室-乌里玛联盟§!"
 SAU_royal_ulema_alliance_neutral_desc: "王室与教士之间保持着一种§Y形式上但有限§!的关系。双方既不积极支持也不阻挠对方，因此权力平衡既不带来任何好处也不带来任何惩罚。"
 SAU_royal_ulema_alliance_neutral_tt: "§Y王位与乌里玛之间的关系是平衡的 - 既没有奖励也没有惩罚。§!\n§Y权力平衡变化=0.00§!"
 SAU_royal_ulema_alliance_strained: "§R王室-乌里玛关系紧张§!"
 SAU_royal_ulema_alliance_strained_desc: "§L乌里玛§!成员私下里批评王室，并在布道中质疑政府改革。这种反对削弱了王朝的宗教合法性。"
 SAU_sabic_01: "沙特基础工业公司"
 SAU_sabic_01_desc: "沙特基础工业公司是一家大型石化产品生产商。沙特基础工业公司在发展壮大的同时，也为产业多元化做出了贡献，并在石油行业以外提供了就业机会。"
 SAU_sabic_agrinutrients: "§H沙特基础工业公司§! - 农业营养与特种化学品"
 SAU_sabic_agrinutrients_desc: "沙特基础工业公司农业营养品部门将沙特天然气转化为尿素和氨，为亚洲和非洲各地的农场提供肥料，使沙特王国成为肥料大国。"
 SAU_sabic_foreign_jv: "§H沙特基础工业公司§! - 外国合资企业"
 SAU_sabic_foreign_jv_desc: "与壳牌、埃克森美孚和三菱的合资企业将世界一流的技术引入了沙特基础工业公司的工厂，同时将利润留在沙特阿拉伯王国。"
 SAU_sabic_ge_plastics: "§H沙特基础工业公司§! - 通用电气塑料公司收购案"
 SAU_sabic_ge_plastics_desc: "2007年，沙特基础工业公司以超过 110 亿美元收购了通用电气塑料公司 ，一夜之间跻身全球工程塑料生产商的前列。"
 SAU_sabic_global_champion: "§H沙特基础工业公司§! - 全球化学龙头"
 SAU_sabic_global_champion_desc: "沙特基础工业公司位列全球最大的化工企业之列，这证明沙特工业的竞争力远不止于石油领域。"
 SAU_sabic_hadeed: "§H沙特基础工业公司§! - 沙特钢铁公司复合体"
 SAU_sabic_hadeed_desc: "位于朱拜勒的沙特基础工业公司钢铁子公司沙特钢铁公司为沙特建筑业提供数百万吨钢筋和扁钢，这些钢材以前都需要进口。"
 SAU_sabic_ibn_affiliates: "§H沙特基础工业公司§! - 伊本附属公司"
 SAU_sabic_ibn_affiliates_desc: "伊本·西那、伊本·扎赫尔和伊本·鲁什德的附属公司将沙特基础工业公司的石化产品生产扩展到塑料、甲醇和纤维领域。"
 SAU_sabic_jubail_yanbu: "§H沙特基础工业公司§! - 朱拜勒和延布工业城"
 SAU_sabic_jubail_yanbu_desc: "皇家委员会下属的朱拜勒和延布两座城市，将空旷的海岸线变成了世界上最大的两个工业综合体，奠定了沙特重工业的基础。"
 SAU_sabic_rnd: "§H沙特基础工业公司§! - 本土技术"
 SAU_sabic_rnd_desc: "沙特基础工业公司位于利雅得、班加罗尔和盖林的研发中心使其催化剂和聚合物始终处于技术前沿。"
 SAU_sagia_initiative: "§H沙特阿拉伯投资总局倡议§!"
 SAU_sagia_initiative_02: "§H沙特阿拉伯投资总局 - 投资改革§!"
 SAU_sagia_initiative_02_desc: "§L沙特投资总局§!放宽了所有权限制，并缩短了许可证审批时间。这些改革措施正在吸引更多外国企业，并使沙特市场更容易进入。"
 SAU_sagia_initiative_03: "§H沙特阿拉伯投资总局 - 外国资本中心§!"
 SAU_sagia_initiative_03_desc: "沙特阿拉伯开放了§H战略性产业§!，推出了§H税收优惠政策§!，并在沿海地区发展了§H经济城§!。这些政策使沙特王国成为重要的区域性外国直接投资目的地。"
 SAU_sagia_initiative_04: "§G沙特阿拉伯投资总局 - 投资强国§!"
 SAU_sagia_initiative_04_desc: "沙特阿拉伯如今已将§H多元化经济§!与§H开放的投资市场§!相结合。已完成的沙特阿拉伯投资总局的改革吸引了大量外国资本和技术工人。"
 SAU_sagia_initiative_desc: "§L沙特阿拉伯投资总局§!于§Y2000年4月§!根据皇家法令成立，是沙特王国首个致力于吸引外国投资的机构。其职责包括简化商业法律、为投资者提供§H单一联系点§!以及改善进入沙特市场的渠道。"
 SAU_salman_health_critical: "§H国王的健康§! - §R紧急§!"
 SAU_salman_health_critical_desc: "国王不再出行，也经常缺席枢密会议。宫廷方面鲜少透露信息，这促使一些高层人士开始为王位继承做准备。"
 SAU_salman_health_declining: "§H国王的健康§! - §Y衰退§!"
 SAU_salman_health_declining_desc: "尽管王室并未宣布国王患有重病，但他正在缩短或取消更多官方接见活动。他减少的行程安排已开始影响政府事务。"
 SAU_salman_health_near_death: "§H国王的健康§! - §R濒死§!"
 SAU_salman_health_near_death_desc: "国王已接近驾崩，实际上已将政权移交给继承人。目前，政治活动主要围绕着王位继承的准备工作展开。"
 SAU_salman_health_serious: "§H国王的健康§! - §Y严重§!"
 SAU_salman_health_serious_desc: "国王很少公开露面，大臣们也越来越多地通过王室而非直接接受国王的指示。"
 SAU_salman_health_stable: "§H国王的健康§! - §G稳定§!"
 SAU_salman_health_stable_desc: "国王保持着繁忙的公务日程，接见使节，主持大臣会议，并审阅政府文件。他的持续参与确保了朝廷和各部委的有序运作。"
 SAU_shura_led_notables: "贵族议会"
 SAU_shura_led_notables_desc: "部落首领和主要商贾家族通过在正式投票前达成的非正式协议，主导着协商会议。这种安排体现了沙特阿拉伯既有的权力结构，但也延缓了决策进程。"
 SAU_shura_led_technocrats: "各部委理事会"
 SAU_shura_led_technocrats_desc: "技术官僚的加入使协商会议在审查预算和政府政策方面更加高效。其成员能力出众，但对利雅得以外社区的代表性不足。"
 SAU_shura_led_ulema: "乌里玛委员会"
 SAU_shura_led_ulema_desc: "宗教学者控制着协商会议，阻止宗教机构反对的提案呈递给国王。"
 SAU_sp_abrams_combined: "装甲：联合兵种"
 SAU_sp_abrams_combined_desc: "坦克、步兵和炮兵组成一支均衡的队伍作战。\n§G+5%§!师攻击\n§G+5%§! 师防御\n§G+5%§!师组织度\n§R+10%§!陆军训练时间"
 SAU_sp_abrams_defensive: "装甲：防御墙"
 SAU_sp_abrams_defensive_desc: "坚固的装甲如同王国的坚不可摧的盾牌。\n§G+10%§! 师防御\n§G+10%§!战壕挖掘速度\n§R-10%§!师移动速度"
 SAU_sp_abrams_shock: "装甲：震撼与突破"
 SAU_sp_abrams_shock_desc: "快速、强力的装甲突袭，旨在粉碎敌军防线。\n§G+10%§!核心领土攻击\n§G+5%§!师移动速度\n§R-5%§!师组织度"
 SAU_sp_apache_antiarmor: "陆军航空兵：坦克杀手"
 SAU_sp_apache_antiarmor_desc: "装备地狱火武器的猎手将摧毁装甲部队的进攻。\n§G+7.5%§!核心领土攻击\n§G+5%§!师攻击\n§R-5%§! 空军经验获取"
 SAU_sp_apache_closeair: "陆军航空兵：近距离支援"
 SAU_sp_apache_closeair_desc: "武装直升机在空中盘旋，稳定并保护地面部队。\n§G+5%§!师组织度\n§G+5%§!师恢复率\n§R+10%§!空军事故"
 SAU_sp_apache_recon: "陆军航空兵：侦察与突袭"
 SAU_sp_apache_recon_desc: "目光向前，闪电突袭防线深处。\n§G+7.5%§!师移动速度\n§G+5%§!计划速度\n§R-5%§!师防御"
 SAU_sp_arty_mass: "炮兵：大规模火力"
 SAU_sp_arty_mass_desc: "倾泻压倒性的炮火，粉碎敌人，补给什么的都见鬼去吧。\n§G+10%§!核心领土攻击\n§R+10%§!补给消耗"
 SAU_sp_arty_mobile: "炮兵：射后即走"
 SAU_sp_arty_mobile_desc: "趁敌人还击之前开火并转移目标。\n§G+5%§!师移动速度\n§G+5%§!师组织度\n§R-5%§!师防御"
 SAU_sp_arty_precision: "炮兵：精确火力"
 SAU_sp_arty_precision_desc: "更少的炮弹，更精准地击中目标。\n§G+7.5%§!师攻击\n§G+5%§!陆军经验获取\n§R+5%§!消耗品使用"
 SAU_sp_awacs_control: "预警机：空中作战控制"
 SAU_sp_awacs_control_desc: "控制者将所有战斗机编织成一张杀戮之网。\n§G+10%§!制空权\n§G+5%§!空军经验获取\n§R+3%§!消费品使用"
 SAU_sp_awacs_earlywarn: "预警机：早期预警网"
 SAU_sp_awacs_earlywarn_desc: "任何袭击都无法瞒过探测。\n§G+10%§!空中防御\n§R-5%§!空军攻击"
 SAU_sp_awacs_groundlink: "预警机：地面连接"
 SAU_sp_awacs_groundlink_desc: "上方的景象指引着下方的军队。\n§G+5%§!师攻击\n§G+5%§!计划速度\n§R-5%§!空军经验获取"
 SAU_sp_combat_armor: "联合兵种：装甲拳"
 SAU_sp_combat_armor_desc: "以铠甲包裹的拳头作为矛头。\n§G+7.5%§!核心力量攻击\n§G+5%§!师速度\n§R+5%§!补给消耗"
 SAU_sp_combat_firepower: "联合兵种：火力"
 SAU_sp_combat_firepower_desc: "用猛烈的火力击溃敌人。\n§G+7.5%§!师攻击\n§R-5%§!师移动速度"
 SAU_sp_combat_infantry: "联合兵种：专业步兵"
 SAU_sp_combat_infantry_desc: "技术娴熟、沉着冷静的职业步兵守住了阵地。\n§G+7.5%§!师防御\n§G+5%§!师组织度\n§R-5%§!核心领土攻击"
 SAU_sp_fleet_bluewater: "海军：蓝水雄心"
 SAU_sp_fleet_bluewater_desc: "将目光投向波斯湾以外的广阔海洋。\n§G+15%§!海军航程\n§G+5%§!主力舰攻击\n§R-5%§!海军士气"
 SAU_sp_fleet_coastal: "海军：海岸防御"
 SAU_sp_fleet_coastal_desc: "一排排小船守护着每一个港口和礁石。\n§G+5%§!海军士气\n§G+10%§!屏卫舰防御\n§R-5%§!主力舰攻击"
 SAU_sp_fleet_gulf: "海军：海湾海上控制"
 SAU_sp_fleet_gulf_desc: "称霸阿拉伯湾狭窄拥挤的水域。\n§G+10%§!屏卫舰攻击\n§G+5%§!海军协同\n§R-10%§!海军航程"
 SAU_sp_pgm_interdiction: "精确制导武器：战场拦截"
 SAU_sp_pgm_interdiction_desc: "在敌人发起进攻之前，从后方切断他们的退路。\n§G+5%§!师组织度\n§G+5%§!近距离空中支援攻击\n§R+10%§!空军学说花费"
 SAU_sp_pgm_sead: "精确制导武器：防御压制"
 SAU_sp_pgm_sead_desc: "首先要蒙蔽并摧毁敌方防空网络。\n§G+7.5%§!制空权\n§G+5%§!空中攻击\n§R-5%§!空军机动性"
 SAU_sp_pgm_strike: "精确制导武器：精确打击"
 SAU_sp_pgm_strike_desc: "智能炸弹，能夷平目标并保护其余部分。\n§G+10%§!近距离空中支援攻击\n§G+5%§!空军攻击\n§R+5%§!消费品使用"
 SAU_sp_posture_deterrence: "立场：战略威慑"
 SAU_sp_posture_deterrence_desc: "一面平衡的盾牌，让任何侵略者都三思而后行。\n§G+5%§!师防御\n§G+5%§!空中防御\n§G+5%§!稳定度\n§R-5%§!师攻击"
 SAU_sp_posture_homeland: "立场：国土防御"
 SAU_sp_posture_homeland_desc: "一切都转向内向发展，使王国成为一座堡垒。\n§G+10%§!核心领土防御\n§G+5%§!最大堑壕深度\n§R-5%§!师移动速度"
 SAU_sp_posture_projection: "立场：力量投射"
 SAU_sp_posture_projection_desc: "一支能够远离本土进行打击的军队。\n§G+5%§!师移动速度\n§G+10%§!海军航程\n§G+5%§!空军攻击!\n§R+5%§!消费品使用"
 SAU_sp_redflag_bvr: "空军：超视距"
 SAU_sp_redflag_bvr_desc: "在敌人发现你之前，从远处将其击毙。\n§G+7.5%§!空军攻击\n§G+5%§!制空权\n§R+10%§!空军学说花费"
 SAU_sp_redflag_defensive: "空军：防空理论"
 SAU_sp_redflag_defensive_desc: "生存下去，坚持下去，守护王国的天空。\n§G+10%§!空军防御\n§G+5%§!空军机动性\n§R-5%§!空军攻击"
 SAU_sp_redflag_dogfight: "空军：空战精通"
 SAU_sp_redflag_dogfight_desc: "转身就打 - 掌控近身战。\n§G+10%§!空军机动性\n§G+5%§!空军攻击\n§R-5%§!空军防御"
 SAU_sp_reform_crash: "改革：速成计划"
 SAU_sp_reform_crash_desc: "现在就改革，迅速改 - 哪怕会带来混乱也在所不惜。\n§G+10%§!陆军经验获取\n§G+5%§!师组织度!\n§R-5%§!稳定度"
 SAU_sp_reform_foreign: "改革：外国承包商"
 SAU_sp_reform_foreign_desc: "让外国专家来快速高质量地完成工作 - 只需买单。\n§G-15%§!陆军训练时间\n§G+5%§!陆军经验获取\n§R-5%§!政治点数获取"
 SAU_sp_reform_steady: "改革：有条不紊的构建"
 SAU_sp_reform_steady_desc: "耐心、有序的改革，军队能够消化吸收。\n§G+5%§!师组织度\n§G+5%§!师恢复率\n§R-3%§!师攻击"
 SAU_sp_sang_regime: "国民警卫队：政权卫队"
 SAU_sp_sang_regime_desc: "首先也是最后，国民警卫队守护着王位和两座圣城。\n§G+10%§!核心领土防御\n§G+5%§!稳定度\n§R-5%§!师攻击"
 SAU_sp_sang_security: "国民警卫队：内部安全"
 SAU_sp_sang_security_desc: "警惕国内的颠覆和动乱。\n§G-25%§!敌方颠覆活动\n§G+5%§!稳定度\n§R-5%§!战争支持度"
 SAU_sp_sang_tribal: "国民警卫队：部落征税"
 SAU_sp_sang_tribal_desc: "忠诚的部落人力壮大了队伍，或者被清洗。\n§G+10%§!可征召人口\n§G+5%§!师恢复率\n§R-5%§!师组织度"
 SAU_sp_sf_counterterror: "特战部队：反恐"
 SAU_sp_sf_counterterror_desc: "一支规模虽小但杀伤力极强的部队，用于人质救援和反恐行动。\n§G+10%§!特战部队攻击\n§G特战部队防御+5%§!\n§R-3%§!特战部队上限"
 SAU_sp_sf_raiders: "特战部队：深入突袭者"
 SAU_sp_sf_raiders_desc: "更多深入打击行动，但代价是会降低其生存能力。\n§G+5%§!特战部队上限\n§G+7.5%§!特战部队攻击\n§R-5%§!特战部队防御"
 SAU_sp_sf_recon: "特战部队：侦察兵"
 SAU_sp_sf_recon_desc: "无声的眼睛，让全军看得更远。\n§G+5%§!特战部队上限\n§G+5%§!计划速度\n§R-5%§!特战部队攻击"
 SAU_spirit_king_in_name: "名义上的国王，实则身着制服的继承人。"
 SAU_spirit_king_in_name_desc: "君主制在形式上依然完整，而王储则在军事委员会的领导下担任军官。这种折衷方案避免了王室和军事机构之间公开决裂，但也无法完全满足双方的需求。"
 SAU_spirit_national_service: "国民服役阅兵"
 SAU_spirit_national_service_desc: "每年两次在法赫德国王路举行的阅兵式，利用盔甲、学生团体和现场直播来争取公众对国民服役的支持。尽管带有表演性质，但并未影响到众多民众的参与。"
 SAU_spirit_officer_housing: "军官住房计划"
 SAU_spirit_officer_housing_desc: "政府正在迅速为军官及其家属建造住房、学校和诊所。这些福利增强了军官队伍对政权的忠诚度。"
 SAU_spirit_officer_purge: "军官团大清洗"
 SAU_spirit_officer_purge_desc: "在接管过程中犹豫不决的军官已被撤职，而支持接管的军官则继续留任。清洗行动虽然缩减了军队规模，但也使剩余的军官更加服从命令。"
 SAU_spirit_public_accounts: "理事会的公共账目"
 SAU_spirit_public_accounts_desc: "沙特阿拉伯各部委首次公开支出明细，这在沙特历史上尚属首次。这项政策激怒了那些长期以来受益于开支保密的家族，但却深受公众欢迎。"
 SAU_spirit_quincy_reaffirmed: "昆西理解"
 SAU_spirit_quincy_reaffirmed_desc: "美国和安理会继续维持1945年首次建立的非正式石油和安全安排。美国军队保护海湾航运，而沙特油轮则向世界市场供应石油，两国政府都倾向于不将该协议写入书面文件。"
 SAU_spirit_security_directorate: "安全局"
 SAU_spirit_security_directorate_desc: "该委员会将马巴希特档案、内政部网络和军事情报整合到一个由一名总司令领导的单一部门。其广泛的监视权力使其卓有成效，但也使其普遍不被信任。"
 SAU_spirit_unbeholden: "无所依附的王国"
 SAU_spirit_unbeholden_desc: "沙特阿拉伯拒绝了外国的安全保证和驻军。如今，它自行采购防空系统并训练军官，以极高的财政代价换取了独立自主。"
 SAU_succession_instability: "§R继承不稳定§!"
 SAU_succession_instability_desc: "自1995年中风以来，法赫德国王一直丧失行为能力，王储阿卜杜拉成为实际统治者。王室内部分为阿卜杜拉的支持者和强大的苏代里派，导致政治局势动荡不安。在王位继承问题正式解决之前，王国的决策仍因各派系之间的争斗而陷入瘫痪。"
 SAU_syria_landbridge_severed: "伊朗陆桥断裂"
 SAU_syria_landbridge_severed_desc: "大马士革的友好政府切断了德黑兰通往真主党的陆路通道。这一战略胜利增强了沙特阿拉伯王国的信心，并稳定了其局势。"
 SAU_syria_pipeline_t1: "黎凡特输油管道（1级）"
 SAU_syria_pipeline_t1_desc: "沙特石油经约旦和叙利亚输送至地中海，对俄罗斯天然气在欧洲门户构成挑战。来自输油管线的出口§G额外收入：$ 3.50B§!，相比§R额外支出：管道途经国家的过境费$ 2.00B§!，净收入§G+$ 1.50B§!每周。破坏活动导致线路下降1级，两条线路都被切断；1级线路被切断，导致路线关闭。"
 SAU_syria_pipeline_t2: "黎凡特输油管道（2级）"
 SAU_syria_pipeline_t2_desc: "沙特石油经约旦和叙利亚输送至地中海，对俄罗斯天然气在欧洲门户构成挑战。来自输油管线的出口§G额外收入：$ 4.25B§!，相比§R额外支出：管道途经国家的过境费$ 2.30B§!，净收入§G+$ 1.95B§!每周。破坏活动导致线路下降1级，两条线路都被切断；1级线路被切断，导致路线关闭。"
 SAU_syria_pipeline_t3: "黎凡特输油管道（3级）"
 SAU_syria_pipeline_t3_desc: "沙特石油经约旦和叙利亚输送至地中海，对俄罗斯天然气在欧洲门户构成挑战。来自输油管线的出口§G额外收入：$ 5.00B§!，相比§R额外支出：管道途经国家的过境费$ 2.50B§!，净收入§G+$ 2.50B§!每周。破坏活动导致线路下降1级，两条线路都被切断；1级线路被切断，导致路线关闭。"
 SAU_syrian_quagmire: "叙利亚泥潭"
 SAU_syrian_quagmire_desc: "多年来对叙利亚这场失败战争的支持，既削弱了公众支持，也减少了国库可用资金。尽管沙特阿拉伯王国投入巨资，叙利亚政府仍然掌权。"
 SAU_tadawul_market: "§G沙特证券交易所0级§!"
 SAU_tadawul_market_desc: "§L沙特证券交易所§!目前处于起步阶段，基本交易和监管功能已到位。完善相关重点工作将深化市场，并提升其经济效益。"
 SAU_tadawul_market_t1: "§G沙特证券交易所1级§!"
 SAU_tadawul_market_t10: "§G沙特证券交易所10级§!"
 SAU_tadawul_market_t10_desc: "改革方案已全部完成，所有计划中的法律、监管机构和上市程序均已到位。§L沙特证券交易所§!现已成为§G中东和北非地区最大的证券交易所§!，其市值超过阿拉伯世界其他所有证券交易所的总和。"
 SAU_tadawul_market_t1_desc: "沙特证券交易所改革的第一阶段已改善了市场运作，提升了投资者信心。后续相关重点领域将继续推进改革。"
 SAU_tadawul_market_t2: "§G沙特证券交易所2级§!"
 SAU_tadawul_market_t2_desc: "越来越多的公司在沙特证券交易所上市，交易量不断增长，办公和企业税收收入也随之增加。"
 SAU_tadawul_market_t3: "§G沙特证券交易所3级§!"
 SAU_tadawul_market_t3_desc: "沙特证券交易所改革的三个阶段提高了交易所获得资本的渠道及其对国家收入的贡献。"
 SAU_tadawul_market_t4: "§G沙特证券交易所4级§!"
 SAU_tadawul_market_t4_desc: "沙特证券交易所现在为民用工业和上市公司提供融资，而更严格的监管提高了投资者信心和稳定性。"
 SAU_tadawul_market_t5: "§G沙特证券交易所5级§!"
 SAU_tadawul_market_t5_desc: "沙特证券交易所已完成一半的改革计划，交易活动、收入和投资者信心均有所增强。"
 SAU_tadawul_market_t6: "§G沙特证券交易所6级§!"
 SAU_tadawul_market_t6_desc: "六个阶段的改革扩大了沙特证券交易所在为沙特企业融资和吸引投资方面的作用。"
 SAU_tadawul_market_t7: "§G沙特证券交易所7级§!"
 SAU_tadawul_market_t7_desc: "经过七个阶段的改革，沙特证券交易所已成为一个成熟的区域性交易所，管理着大量资本。"
 SAU_tadawul_market_t8: "§G沙特证券交易所8级§!"
 SAU_tadawul_market_t8_desc: "成熟的沙特证券交易所能够引导资本流入建筑业和工业，并赋予政府更大的经济政策影响力。"
 SAU_tadawul_market_t9: "§G沙特证券交易所9级§!"
 SAU_tadawul_market_t9_desc: "沙特证券交易所正逐步全面建成，产生大量企业和工业税收，并在国家经济政策中发挥越来越重要的作用。"
 SAU_tenth_five_year_plan: "第十个五年计划"
 SAU_tenth_five_year_plan_desc: "自1970年以来，经济计划部每年都会发布五年计划，但其中许多计划主要起到意向声明的作用。而本计划则为港口、铁路、环城公路以及部委改革提供了全额资金。\n\n§G持续五年§!"
 SAU_vision_2030_delivered: "2030愿景：已实现"
 SAU_vision_2030_delivered_desc: "“2030愿景”已促成多项重大建设和多元化项目，包括新未来城、利雅得重建以及新的旅游设施。沙特阿拉伯现在对原油的依赖程度有所降低。"
 SAU_vision_2030_expectations: "2030愿景：承诺"
 SAU_vision_2030_expectations_desc: "“2030愿景”大型项目的公布吸引了投资，并提升了公众信心。但这些项目的规模也带来了巨大的预算和政治成本，直到承诺的项目全部完成。"
 SAU_vision_2030_progress: "2030愿景：逐渐成形"
 SAU_vision_2030_progress_desc: "沙特阿拉伯王国各地正在兴建工程，首批“2030愿景”项目已投入运营。这些显而易见的进展减少了公众对该计划的疑虑。"
 SAU_vision_2030_white_elephant: "2030愿景：白象"
 SAU_vision_2030_white_elephant_desc: "“2030愿景”计划未能按期完成，耗资数千亿美元后，许多重大项目仍未完工或未投入使用。这一失败印证了该计划批评者的质疑，并损害了公众对领导层的信心。"
 SAU_water_crisis_01: "§H可控的水危机§!"
 SAU_water_crisis_01_desc: "海水淡化规模扩大、农业政策效率提高以及公众用水量下降，已将水危机缓解至§G可控§!水平。沙特阿拉伯王国仍然面临结构性缺水问题，但供水依然可靠。"
 SAU_water_crisis_02: "§H严重的水危机§!"
 SAU_water_crisis_02_desc: "沙特阿拉伯消耗§L萨克§!和§L瓦吉德§!化石含水层的速度超过了其补充速度。农业消耗了剩余地下水的大部分，而对海水淡化的依赖则推高了§Y消费品成本§!，降低了§Y效率§!，并削弱了§Y公众的耐心§!。"
 SAU_yemen_attack_buff: "协同进攻"
 SAU_yemen_attack_buff_desc: "沙特阿拉伯的周密计划和火力支援使我方部队在进攻中占据决定性优势。对胡塞武装的进攻效率提升15%。"
 SAU_yemen_pipeline_t1: "阿拉伯海输油管道（1级）"
 SAU_yemen_pipeline_t1_desc: "沙特原油经马赫拉向南流入阿拉伯海，绕过霍尔木兹海峡。来自输油管线的出口§G额外收入：$ 2.00B§!，相比§R额外支出：管道途经国家的过境费$ 1.00B§!，净收入§G+$ 1.00B§!每周。破坏活动导致线路下降1级，两条线路都被切断；1级线路被切断，导致路线关闭。"
 SAU_yemen_pipeline_t2: "阿拉伯海输油管道（2级）"
 SAU_yemen_pipeline_t2_desc: "沙特原油经马赫拉向南流入阿拉伯海，绕过霍尔木兹海峡。来自输油管线的出口§G额外收入：$ 2.50B§!，相比§R额外支出：管道途经国家的过境费$ 1.15B§!，净收入§G+$ 1.35B§!每周。破坏活动导致线路下降1级，两条线路都被切断；1级线路被切断，导致路线关闭。"
 SAU_yemen_pipeline_t3: "阿拉伯海输油管道（3级）"
 SAU_yemen_pipeline_t3_desc: "沙特原油经马赫拉向南流入阿拉伯海，绕过霍尔木兹海峡。来自输油管线的出口§G额外收入：$ 3.00B§!，相比§R额外支出：管道途经国家的过境费$ 1.25B§!，净收入§G+$ 1.75B§!每周。破坏活动导致线路下降1级，两条线路都被切断；1级线路被切断，导致路线关闭。"
 SAU_baath_state: "阿拉伯复兴党"
 SAU_baath_state_tt: "§Y团结、自由、社会主义§!\n\n党是阿拉伯民族的先锋队，它将官兵、农民和学生融为一体，形成统一的革命意志。每一个边疆都只是通往阿拉伯家园的驿站。"
 SAU_communist_state: "社会主义国家"
 SAU_communist_state_tt: "阿拉伯半岛的无产阶级专政。这些成果只有在沙特共产党执政期间才能维持。一旦沙特共产党失去政权，这些成果也将不复存在。"
 SAU_Military_Rule: "军人统治"
 SAU_Monarchy_house_of_al_saud: "沙特王室"
 SAU_nda_state: "全国民主大会"
 SAU_nda_state_tt: "自由共和国的制度随着每一次通过投票箱赢得的改革而不断深化。"
 SAU_nlf_doctrine: "不结盟社会主义"
 SAU_nlf_doctrine_tt: "§Y阿拉伯社会主义道路（仅限民族解放阵线）：§!\n§G+15%政治点数获取，+10%战争支持度§!"
 SAU_peoples_council_works: "市政公共工程"
 SAU_peoples_council_works_tt: "由§Y人民委员会§!委托建造，并按照其标准建造。"
 SAU_rep_shia_hardline_doctrine: "革命神权政治"
 SAU_rep_shia_hardline_doctrine_tt: "真主党-希贾兹以法学家的名义进行统治，该民族已动员起来进行抵抗。"
 SAU_rep_shia_moderate_doctrine: "改革派治理"
 SAU_rep_shia_moderate_doctrine_tt: "改革运动通过和解、福利和选举来治理国家。"
 SAU_rep_shia_state: "什叶派共和国"
 SAU_rep_shia_state_tt: "随着每一次改革的胜利和每一次的挫败，什叶派共和国的制度也日益强大。"
 SAU_scp_doctrine: "马克思列宁主义先锋队"
 SAU_scp_doctrine_tt: "§Y正统马克思列宁主义（只限沙特共产党）：§!\n§G+10%工厂效率，+10%建筑速度，+5%稳定度§!"
 SAU_arab_consensus: "阿拉伯世界反对正常化的共识"
 SAU_arab_shield_bond: "阿拉伯之盾兄弟会"
 SAU_beijing_agreement: "北京协议"
 SAU_betrayed_palestine: "放弃了巴勒斯坦事业"
 SAU_boycott_israel: "抵制"
 SAU_cause_solidarity: "声援巴勒斯坦"
 SAU_egypt_economic_ties: "沙特经济支持"
 SAU_egypt_military_ties: "沙特军事赞助"
 SAU_egypt_partnership: "沙特-埃及伙伴关系"
 SAU_exposed_iran: "揭露干预也门"
 SAU_iraq_friendship: "沙特与伊拉克的友谊"
 SAU_islamic_rivalry: "伊斯兰竞争"
 SAU_islamic_rivalry_tt: "[PER.GetFlag]§R伊斯兰世界的争夺战开始了。§!"
 SAU_israel_normalization: "关系正常化"
 SAU_proxy_aggression: "恐怖主义赞助者"
 SAU_quincy_reaffirmed: "昆西协议重申"
 SAU_recognition_anger: "巴勒斯坦建国地位得到承认"
 SAU_recognized_palestine: "承认巴勒斯坦"
 SAU_taif_spirit: "塔伊夫精神"
 SAU_talks_collapsed: "失败的正常化谈判"
 SAU_two_state_champion: "两国方案的倡导者"
 HOU_break_ceasefire_category: "沙特停火"
 HOU_drop_north_yemen_name: "重拾也门之名"
 HOU_drop_north_yemen_name_desc: "抛开北也门身份认同，重新在自己的旗帜下执政。"
 PER_houthi_militia: "动员人民民兵"
 PER_houthi_militia_desc: "动员部落支持者以低成本为胡塞运动提供额外的人力。"
 PER_houthi_old_weapons: "向胡塞武装走私武器"
 PER_houthi_old_weapons_desc: "运送一批旧步枪穿过红海，越过边境，送到胡塞武装手中。"
 PER_houthi_raise_brigade: "加强防守"
 PER_houthi_raise_brigade_desc: "派遣圣城旅工程师在山中挖掘通道，将胡塞武装分子困住。这样一来，想要将他们从占据的阵地上赶走就难上加难了。"
 PER_houthi_support_category: "支持胡塞武装"
 SAU_abdullah_kaec_construction: "加快建设阿卜杜拉国王经济城"
 SAU_abdullah_kaec_construction_desc: "通过免除许可证要求并雇用更多承包商沿红海沿岸建设阿卜杜拉国王经济城，加快建设进程。"
 SAU_abdullah_kasp_scholarship: "延长阿卜杜拉国王科学园区海外奖学金"
 SAU_abdullah_kasp_scholarship_desc: "扩大国家资助的海外奖学金项目，让更多沙特学生能够学习沙特王国缺乏专业人才的学科。他们的教育将有助于他们回国后增强国内劳动力。"
 SAU_abdullah_kaust_grants: "资助阿卜杜拉国王科技大学高科技项目"
 SAU_abdullah_kaust_grants_desc: "为阿卜杜拉国王科技大学提供重大研究经费，用于招募顶尖专家并在图瓦尔建立先进实验室。"
 SAU_abdullah_national_dialogue: "召开全国对话论坛"
 SAU_abdullah_national_dialogue_desc: "将宗教人士、改革派人士、什叶派代表和妇女聚集到全国对话论坛上。这些会议将为被排斥的群体提供一个正式渠道，让他们能够表达自己的诉求。"
 SAU_abdullah_sang_subsidies: "沙特阿拉伯国民警卫队现代化补贴"
 SAU_abdullah_sang_subsidies_desc: "补贴沙特阿拉伯国民警卫队的新车辆合同，降低其现代化成本，并增强其对政府的忠诚度。"
 SAU_Among_Major_powers_Open_east: "开启§R与东部的合作§!决议"
 SAU_appoint_provincial_governor: "任命省长"
 SAU_appoint_provincial_governor_desc: "省长职位空缺。请在地图上选择一个省份，省议会将决定由谁担任该职位。\n\n每个省份只能获得一次机会。"
 SAU_arm_arab_revolutionaries: "武装阿拉伯革命者"
 SAU_arm_arab_revolutionaries_desc: "向在其他阿拉伯国家活动的共产主义运动提供步枪和训练有素的组织者。"
 SAU_arm_lebanese_army: "武装黎巴嫩军队"
 SAU_arm_lebanese_army_desc: "向黎巴嫩军队提供沙特阿拉伯的武器和训练，使其能够独立于真主党作战。"
 SAU_back_mbn: "支持穆罕默德·本·纳伊夫"
 SAU_back_mbn_desc: "全力支持内政部长，他是王国反恐体系的缔造者，也是华盛顿的宠儿。一旦选定候选人，宫廷便会在接下来的王位继承过程中始终支持他。"
 SAU_back_mbn_heir: "支持穆罕默德·本·纳伊夫"
 SAU_back_mbn_heir_desc: "支持王储穆罕默德·本·纳伊夫，理由是他在内政部的工作表现、反恐记录以及与华盛顿的良好关系。"
 SAU_back_mbs_heir: "支持穆罕默德·本·萨勒曼"
 SAU_back_mbs_heir_desc: "支持国王的幼子穆罕默德·本·萨勒曼，尽管他经验有限，但他正在巩固对越来越多部门的权力。"
 SAU_back_mutaib: "支持穆塔伊卜·本·阿卜杜拉"
 SAU_back_mutaib_desc: "全力支持阿卜杜拉国王的儿子，他是国民警卫队的指挥官，也是他父亲部落追随者的继承人。一旦选定候选人，宫廷就必须在接下来的继承过程中支持他。"
 SAU_back_salman: "支持萨勒曼·本·阿卜杜勒阿齐兹"
 SAU_back_salman_desc: "全力支持苏代里家族的资深王子、长期担任利雅得总督的那位。一旦选定候选人，宫廷便会在接下来的王位继承过程中始终支持他。"
 SAU_bahrain_restore_khalifa: "重建哈里发家族"
 SAU_bahrain_restore_khalifa_desc: "如果哈利法家族在巴林失去权力，就部署兵力跨越堤道恢复其统治。\n\n当巴林不再由哈利法家族统治时，§Y即可使用§!。\n\n§G恢复哈利法王朝的权力§!，将巴林从所有非我方阵营中移除，并将其纳入§Y半岛之盾牌§!的管辖之下。\n\n§R-$15B，-2%稳定度§!，与德黑兰的关系将受到影响。§G+5%战争支持度§!。"
 SAU_bop_note: "§H王国的未来如何转变§!"
 SAU_bop_note_desc: "§H王国的未来§!平衡无法通过一项决议直接改变。它通过沙特证券交易所、沙特阿拉伯投资总局和其他部门§L完成的国策分支§!、§L关键事件§!以及国王的§L改革§!而改变。"
 SAU_break_houthi_ceasefire: "打破停火协议"
 SAU_break_houthi_ceasefire_desc: "撕毁与胡塞武装的停火协议，恢复“果断风暴”行动。"
 SAU_broadcast_revolution: "传播革命"
 SAU_broadcast_revolution_desc: "利用自由阿拉伯电台在阿拉伯国家工人和其他不满群体中宣传共产主义支持。"
 SAU_coalition_member_arm_yemen: "武装共和国"
 SAU_coalition_member_arm_yemen_desc: "武器和人员是以我们自己的名义，而不是以利雅得的名义，送往公认的政府。\n\n§G也门获得1500件步兵武器、8000名兵力和军事经验§!。每30天可以重复一次。"
 SAU_coalition_member_category: "也门联盟"
 SAU_coalition_member_leave: "退出联盟"
 SAU_coalition_member_leave_desc: "退出沙特领导的联盟并结束我们对其也门行动的参与。\n\n§R利雅得失去了一个联盟伙伴，并对此耿耿于怀§!；§G+50政治点数，+3%稳定度§!。"
 SAU_coalition_member_strike: "执行我们的任务"
 SAU_coalition_member_strike_desc: "我们执行的空中任务指令，目标是胡塞武装控制的一个省份。\n\n在目标省份§R破坏基础设施、军火工业和防空系统§!。每21天可以重复一次。"
 SAU_communist_invite_to_comintern: "邀请[FROM.GetName]加入阿拉伯共产国际"
 SAU_communist_invite_to_comintern_desc: "邀请[FROM.GetName]加入阿拉伯共产国际。一个工人阶级国家无需通过武力解放；他们可以接受，也可以拒绝。"
 SAU_communist_seize_power: "在[FROM.GetName]发动社会主义革命"
 SAU_communist_seize_power_desc: "工人阶级占领街头的地方，就举行罢工。凭借压倒性的支持，旧政权垮台；运动势头强劲的地方，国家则陷入革命内战。"
 SAU_council_national_service: "国民服役阅兵"
 SAU_council_national_service_desc: "在法赫德国王路举行全国电视直播的阅兵式，委员会成员将出席。此次阅兵式旨在提升公众对军队和新政府的支持。"
 SAU_council_officer_housing: "军官住房计划"
 SAU_council_officer_housing_desc: "为军官团建造住房、学校和诊所。这将改善军方对委员会的支持，但会将公共资金从其他需求中转移出去。"
 SAU_council_officer_purge: "清洗军官团"
 SAU_council_officer_purge_desc: "将那些在政变期间忠诚度存疑的军官退役，并将后续调查中发现的其他人员撤职。军队规模会缩小，但可靠性会更高。"
 SAU_council_public_accounts: "公布公共账目"
 SAU_council_public_accounts_desc: "公布各部委的账目，以展现理事会致力于政府透明化的承诺。这既能提升理事会的诚信声誉，又能限制此前用于非正式安排的自由支配支出。"
 SAU_council_security_directorate: "成立安全局"
 SAU_council_security_directorate_desc: "将马巴希特情报局、内政部网络和军事情报部门合并为一个统一的指挥机构。集中报告将提高委员会监控全国范围内威胁的能力。"
 SAU_councils_category: "王国议会"
 SAU_councils_category_desc: "§HMajlis ash-Shura§! - [ROOT.GetSAUShuraBench]\n§OUlema§! [?SAU_shura_ulema|0]    §YTechnocrats§! [?SAU_shura_technocrats|0]    §GNotables§! [?SAU_shura_notables|0]\n§HThe People's Council§! - [ROOT.GetSAUPCStanding], [ROOT.GetSAUPCBloc]\n§OReformists§! [?SAU_pc_reformists|0]    §YTraditionalists§! [?SAU_pc_traditionalists|0]    §GProvincials§! [?SAU_pc_provincials|0]\n\nTwo chambers now sit in Riyadh and neither can compel the King to do anything.\n\n§HThe Majlis ash-Shura§! is appointed and advises on whatever it is handed. Whichever bench holds the most seats sets its character, and the character is worth something:\n§OUlema-led§!  §G+8% stability, +10% drift defence§!  /  §R-5% research, -5% migration§!\n§YTechnocrat-led§!  §G+8% research, +6% office output, +5% productivity§!  /  §R-5% stability§!\n§GNotable-led§!  §G+8% political power, -8% corruption cost§!  /  §R+3% consumer goods, -3% war support§!\n\n§YSeat a bench past 70 and the King may charter the Council permanently.§! A charter doubles that bench's character, fixes it in the Basic Law, and ends the contest for good - the seat counts stop deciding anything. Refuse, and all three benches reset to 40 with the chamber still yours to rebalance.\n\n§HThe People's Council§! answers downward. It is the first body in the Kingdom's history that speaks for the governed rather than to them, and it may legislate on internal affairs. The King retains the veto, and §Revery use of it costs stability and war support§!."
 SAU_crown_prince_category: "太子"
 SAU_cyber_defensive_op: "防御性网络行动"
 SAU_cyber_defensive_op_desc: "强化王国防御并破坏目标的进攻系统，持续§Y90天§!。目标部队在攻击我方§Y时战斗力将降低10%§!，同时沙特阿拉伯情报总局会保护我方网络。此任务需要目标网络达到§G70%§!进度。"
 SAU_cyber_offensive_op: "进攻性网络行动"
 SAU_cyber_offensive_op_desc: "将网络转化为武器。一次为期§Y90天§!的沙特阿拉伯情报总局网络打击将瘫痪目标的指挥和防御系统：其部队的§Y防御能力将下降10%§!，产业也将停滞不前。这需要目标网络§G70%§!的进度。"
 SAU_debug_bop_left: "§Y向传统主义的转变§!"
 SAU_debug_bop_left_desc: "Modder/debug tool only. Shifts the §HKingdom's Future§! balance §R-0.05 to the left§! (toward Traditionalism). Visible only when the game is launched with -debug."
 SAU_debug_bop_right: "§Y向自由主义的转变§!"
 SAU_debug_bop_right_desc: "Modder/debug tool only. Shifts the §HKingdom's Future§! balance §G+0.05 to the right§! (toward Liberalisation). Visible only when the game is launched with -debug."
 SAU_debug_category: "DEBUG - Saudi Succession"
 SAU_debug_clear_decree_lock: "DEBUG: Clear the 60-Day Decree Lock"
 SAU_debug_clear_decree_lock_desc: "Clears SAU_royal_decree_active so the reigning monarch decisions can be taken again immediately, without waiting out the 60 days."
 SAU_debug_drain_salman_health: "DEBUG: Drain King Salman's Health"
 SAU_debug_drain_salman_health_desc: "Sets SAU_salman_health to 0. The accession chain fires on the next monthly tick, crowning whoever is currently Crown Prince."
 SAU_debug_faisalite_conviction_up: "(DEBUG) Faisalite conviction +25"
 SAU_debug_faisalite_conviction_up_desc: "Adds 25 conviction and re-evaluates the tier. Repeat to cross 45 and 75."
 SAU_debug_faisalite_open: "(DEBUG) Open the Faisalite chain"
 SAU_debug_faisalite_open_desc: "Fires the Mecca summit event that begins the chain, without waiting 140 days."
 SAU_debug_faisalite_pivot: "(DEBUG) Fire the Iraq pivot"
 SAU_debug_faisalite_pivot_desc: "Fires the American-occupation pivot event regardless of the war situation."
 SAU_debug_faisalite_readout: "(DEBUG) Faisalite: [ROOT.GetSAUFaisaliteConviction]"
 SAU_debug_faisalite_readout_desc: "§HConviction§!: §Y[?SAU_faisalite_conviction|0]§! of §Y100§!\n§HSocial conservatism per month§!: §Y[?SAU_social_conservatism|0]§!\n§HTier§!: [ROOT.GetSAUFaisaliteConviction]"
 SAU_debug_grievance_open: "(DEBUG) Open the coup chain"
 SAU_debug_grievance_open_desc: "Sets the 2008 oil-crash flag and fires the officers' grievance event that begins the chain, without waiting for 2008."
 SAU_debug_grievance_readout: "(DEBUG) Officers: [ROOT.GetSAUArmyGrievance]"
 SAU_debug_grievance_readout_desc: "§HGrievance§!: §Y[?SAU_army_grievance|0]§! of §Y100§!\n[ROOT.GetSAUArmyGrievanceEffect]\n§HGuard shielded§! (doubles the monthly rate): checked by the SAU_sang_shielded flag."
 SAU_debug_grievance_up: "(DEBUG) Officer grievance +25"
 SAU_debug_grievance_up_desc: "Adds 25 grievance and re-evaluates the tier. Repeat to cross 50 (order to deploy) and 75 (the coup)."
 SAU_debug_junta_legitimacy_up: "(DEBUG) Junta Legitimacy +25"
 SAU_debug_junta_legitimacy_up_desc: "Raises the Council's standing, to check the crisis completes instead of timing out."
 SAU_debug_junta_legitimacy_zero: "(DEBUG) Junta Legitimacy to 0"
 SAU_debug_junta_legitimacy_zero_desc: "Drops the Council to nothing so the legitimacy crisis arms on the next check."
 SAU_debug_junta_open: "(DEBUG) Force the Officers' Coup"
 SAU_debug_junta_open_desc: "Arms the grievance chain and fires the takeover event immediately."
 SAU_debug_king_abdullah: "DEBUG: Crown King Abdullah"
 SAU_debug_king_abdullah_desc: "Sets SAU_current_king to 1, installs Abdullah as country leader and reopens the Abdullah-era succession race (Salman 45 / MBN 30 / Mutaib 25)."
 SAU_debug_king_mbn: "DEBUG: Crown Mohammed bin Nayef"
 SAU_debug_king_mbn_desc: "Sets SAU_current_king to 3 and installs Mohammed bin Nayef as country leader."
 SAU_debug_king_mbs: "DEBUG: Crown Mohammed bin Salman"
 SAU_debug_king_mbs_desc: "Sets SAU_current_king to 5 and installs Mohammed bin Salman as country leader."
 SAU_debug_king_mutaib: "DEBUG: Crown Mutaib bin Abdullah"
 SAU_debug_king_mutaib_desc: "Sets SAU_current_king to 4 and installs Mutaib bin Abdullah as country leader."
 SAU_debug_king_salman: "DEBUG: Crown King Salman"
 SAU_debug_king_salman_desc: "Sets SAU_current_king to 2, installs Salman as country leader, resets his health to 100 and opens the MBS-versus-MBN Crown Prince race."
 SAU_debug_oil_dep_readout: "(DEBUG) Oil Dependence: [?oil_dependence|0] (quarter tick [?SAU_oil_dep_quarter|0]/3)"
 SAU_debug_oil_dep_readout_desc: "Reads the dependence value and how far through the three-month tick it is."
 SAU_debug_pc_open: "(DEBUG) Create the People's Council"
 SAU_debug_pc_open_desc: "Sets the flag and seats the chamber 40/40/40 at standing 50, without the focus."
 SAU_debug_pc_readout: "(DEBUG) People's Council state"
 SAU_debug_pc_readout_desc: "§HOpen§! (SAU_peoples_council_open, set by SAU_establish_the_peoples_council)\n§HStanding§!: §Y[?SAU_pc_standing|0]§! - Public Works needs 60+\n§HSeats§! - reformists §Y[?SAU_pc_reformists|0]§!, traditionalists §Y[?SAU_pc_traditionalists|0]§!, provincials §Y[?SAU_pc_provincials|0]§! - a bench needs 21+ to speak\n§HVetoes used§!: §Y[?SAU_pc_vetoes|0]§!"
 SAU_debug_pc_reset_cycle: "(DEBUG) Clear the session flags"
 SAU_debug_pc_reset_cycle_desc: "Clears SAU_pc_debate_ongoing and SAU_pc_doing_bill if a session gets stuck."
 SAU_debug_pc_standing_up: "(DEBUG) Council standing +20"
 SAU_debug_pc_standing_up_desc: "Raises standing by 20 so Public Works can be tested."
 SAU_debug_shura_dissolve: "(DEBUG) Dissolve the Majlis ash-Shura"
 SAU_debug_shura_dissolve_desc: "Runs SAU_shura_dissolve: clears the flag, zeroes the benches, strips the spirit."
 SAU_debug_shura_open: "(DEBUG) Open the Majlis ash-Shura"
 SAU_debug_shura_open_desc: "Sets SAU_shura_open and seats the Council at 50/50/50, without SAU_reorganization_of_the_majlis_ash_shura or Miteb on the throne."
 SAU_debug_shura_readout: "(DEBUG) Shura gate check"
 SAU_debug_shura_readout_desc: "§HEvery condition the category needs:§!\n§YCouncil opened§! (SAU_shura_open, set by SAU_reorganization_of_the_majlis_ash_shura)\n§YHouse of Al Saud ruling§!: [?ruling_party|0] must be 10\n§YNo coup§! (SAU_military_coup_ready must be clear)\n§YMonarchy intact§! (SAU_monarchy_abolished must be clear)\n\n§HSeats§! - ulema [?SAU_shura_ulema|0], technocrats [?SAU_shura_technocrats|0], notables [?SAU_shura_notables|0]"
 SAU_debug_storm_complete_civil_war: "(DEBUG) Complete the Yemeni Civil War focus"
 SAU_debug_storm_complete_civil_war_desc: "Force-completes SAU_the_yemeni_civil_war without waiting for the monthly check."
 SAU_debug_storm_open: "(DEBUG) Fire the Riyadh Meeting"
 SAU_debug_storm_open_desc: "Fires event 194 directly, skipping the focus and its prerequisites."
 SAU_debug_storm_readout: "(DEBUG) Coalition: [?SAU_coalition_partners|0]"
 SAU_debug_storm_readout_desc: "§HCoalition partners§!: §Y[?SAU_coalition_partners|0]§!\n§HStorm launched§!: flag SAU_decisive_storm_launched\n§HCivil war focus§!: SAU_the_yemeni_civil_war"
 SAU_debug_water_pride_down: "§Y(DEBUG) Force Water Pride -1 Tier§!"
 SAU_debug_water_pride_down_desc: "Modder/debug tool. Forces the §HSovereign Waters§! spirit one tier down regardless of stability. Visible only with -debug."
 SAU_debug_water_pride_up: "§Y(DEBUG) Force Water Pride +1 Tier§!"
 SAU_debug_water_pride_up_desc: "Modder/debug tool. Forces the §HSovereign Waters§! spirit one tier up regardless of stability. Visible only with -debug."
 SAU_div_arms: "武器生产本地化"
 SAU_div_arms_desc: "加强§H沙特阿拉伯军事工业公司§!和国内国防工业的发展。沙特制造的武器可以减少进口支出，为工程师提供就业机会，并§G拓展沙特的工业基础§!，使其不再局限于石油行业。"
 SAU_div_digital: "发展数字经济"
 SAU_div_digital_desc: "支持§H金融科技、电子商务和初创企业§!，以创造高技能就业机会并扩大非石油税基。这将通过发展私营数字产业来§G降低对原油的依赖§!。"
 SAU_div_giga_project: "资助一个巨型项目"
 SAU_div_giga_project_desc: "为§H新未来城§!及其在西北部规划的城市提供大量资金支持。该项目将带来巨大的建筑需求，并使经济§G摆脱对石油的依赖§!，但同时也带来了极高的财政成本。"
 SAU_div_pif_invest: "公共投资基金战略投资"
 SAU_div_pif_invest_desc: "将§H公共投资基金§!直接投入利雅得的国内工厂、建筑产能和就业市场。这将大幅降低沙特§G对石油的依赖§!，但代价是国库支出巨大。"
 SAU_div_renewables: "扩大可再生能源产能"
 SAU_div_renewables_desc: "在鲁卜哈利沙漠地区大力发展§H太阳能和风能§!。清洁能源可以释放原油用于出口，并§G降低经济对石油的依赖§!。"
 SAU_div_tourism_event: "举办全球旅游活动"
 SAU_div_tourism_event_desc: "促进§H红海沿岸§!的度假胜地、节庆活动、朝圣之旅和国际旅游业发展。游客消费能够使沙特阿拉伯王国的收入来源§G摆脱§!对石油的过度依赖。"
 SAU_domestic_external_category: "§H沙特阿拉伯内政与外交事务§!"
 SAU_east_belt_road: "“一带一路”投资"
 SAU_east_belt_road_desc: "接受中国“一带一路”倡议对沙特阿拉伯港口、铁路和工业城市的投资。这些项目在扩大基础设施的同时，通常不会像西方合作伙伴那样附加政治条件。"
 SAU_east_energy_markets: "亚洲能源市场"
 SAU_east_energy_markets_desc: "扩大对中国和其他亚洲经济体的石油出口。更广泛的客户群体能够提升沙特的议价能力，并降低其对西方需求的依赖。"
 SAU_east_trade: "与东方的贸易协定"
 SAU_east_trade_desc: "达成贸易协定，用沙特阿拉伯的能源出口换取亚洲新兴经济体的制成品。"
 SAU_faisalite_category: "费萨尔问题"
 SAU_faisalite_endowments: "为捐赠基金提供资金"
 SAU_faisalite_endowments_desc: "自石油收入下降以来，宗教捐赠基金一直面临资金短缺，应向这些基金提供额外资金。这些未公开的资金将获得在全国范围内影响布道的神职人员的支持。"
 SAU_faisalite_guard_petition: "警卫队请愿书"
 SAU_faisalite_guard_petition_desc: "允许国民警卫队高级军官向穆塔伊布提交公开请愿书。签署请愿书将表明哪些军官支持他继承王位。"
 SAU_faisalite_int_buy_satellite_channels: "购买阿拉伯卫星频道"
 SAU_faisalite_int_buy_satellite_channels_desc: "收购阿拉伯主要卫星网络并任命与利雅得立场一致的人员。此举扩大了沙特对地区媒体的影响力，但也引起了伊斯兰教法学家的担忧。"
 SAU_faisalite_int_endow_universities: "向外国大学捐赠"
 SAU_faisalite_int_endow_universities_desc: "资助在从开罗到吉隆坡的外国大学设立伊斯兰研究常任教席。利雅得将提供资金并确定最终课程设置。"
 SAU_faisalite_int_hard_currency_loans: "以硬通货放贷"
 SAU_faisalite_int_hard_currency_loans_desc: "向那些无法从其他渠道获得低成本融资的政府提供美元贷款。优惠的贷款条件将增加它们对沙特阿拉伯支持的依赖。"
 SAU_faisalite_int_officers_abroad: "其次是海外军官团"
 SAU_faisalite_int_officers_abroad_desc: "派遣沙特军官担任穆斯林世界各国武装部队的顾问和教官。这些部署有助于提升沙特军事经验，并扩大利雅得的影响力。"
 SAU_faisalite_int_pilgrimage_quotas: "Expand the Pilgrimage Quotas"
 SAU_faisalite_int_pilgrimage_quotas_desc: "Increase Hajj quotas despite the added pressure on Mecca's infrastructure. More pilgrims will experience Saudi administration of the holy sites and return home with stronger ties to the Kingdom."
 SAU_faisalite_iso_buy_foreign_firms: "Buy Out the Foreign Companies"
 SAU_faisalite_iso_buy_foreign_firms_desc: "Purchase foreign-owned companies operating in the Kingdom and transfer their assets to state ministries. This increases Saudi control of the economy but leaves the new operators without the firms' existing expertise."
 SAU_faisalite_iso_cancel_visas: "Cancel the Foreign Labour Visas"
 SAU_faisalite_iso_cancel_visas_desc: "Allow one million foreign work permits to expire without renewal. This increases the Saudi share of the workforce but will delay projects that rely on foreign labor."
 SAU_faisalite_iso_close_foreign_schools: "Shutter the Foreign Schools"
 SAU_faisalite_iso_close_foreign_schools_desc: "Close international schools and transfer their pupils into the state system. Education will follow a Saudi curriculum, but the schools are not prepared for the additional students."
 SAU_faisalite_iso_import_licences: "Ration the Import Licences"
 SAU_faisalite_iso_import_licences_desc: "Reduce the number of import licenses issued each quarter. Imports will become scarcer and more expensive, giving domestic producers greater room in the market."
 SAU_faisalite_iso_repatriate_reserves: "Repatriate the Sovereign Reserves"
 SAU_faisalite_iso_repatriate_reserves_desc: "Move Saudi sovereign reserves out of New York and London and return them to the Kingdom. This strengthens direct control over national assets but will seriously damage relations with Western financial partners."
 SAU_faisalite_score_interventionist: "§RInterventionist§!   §Y[?SAU_faisalite_interventionist|0]§!"
 SAU_faisalite_score_interventionist_desc: "Interventionism uses summits, financial support, and military advisers to place Riyadh at the head of the Ummah. Two interventionist directives may run at once, and each pays out only when completed; keep this score above the §OIsolationist§! score to make the final pillar §RThe Third Way Doctrine§!."
 SAU_faisalite_score_isolationist: "§OIsolationist§!   §Y[?SAU_faisalite_isolationist|0]§!"
 SAU_faisalite_score_isolationist_desc: "Isolationism concentrates Saudi policy on its borders, religion, and oil while avoiding foreign commitments. Two isolationist directives may run at once, and each pays out only when completed; keep this score above the §RInterventionist§! score to make the final pillar §OSplendid Isolation§!."
 SAU_faisalite_sermons: "分发讲道稿"
 SAU_faisalite_sermons_desc: "重新发行费萨尔的录音演讲，并通过国民警卫队内部渠道分发演讲稿。此举旨在复兴他的政治理念，但内政部也意识到这对现任政府的影响。"
 SAU_Foregin_affairs_category: "§GSaudi Foreign affairs§!"
 SAU_Foreign_affairs_unlocked: "§HForeign Affairs Unlocked§!"
 SAU_Foreign_affairs_unlocked_desc: "The Foreign Ministry answers to the Kingdom again. The decisions below are open."
 SAU_found_arab_comintern: "Found the Arab Comintern"
 SAU_found_arab_comintern_desc: "Arabia summons the communist states of the Arab world into a single revolutionary bloc under its own leadership."
 SAU_fsa_foreign_fighters: "Open the Foreign Fighter Pipeline"
 SAU_fsa_foreign_fighters_desc: "Allow foreign volunteers traveling through the Gulf to join the Free Syrian Army, increasing its available manpower."
 SAU_fsa_send_cash: "Wire Funds to the Free Syrian Army"
 SAU_fsa_send_cash_desc: "Establish a covert funding channel for Free Syrian Army salaries, procurement, and political organization."
 SAU_fsa_smuggle_weapons: "Smuggle Weapons to the Rebels"
 SAU_fsa_smuggle_weapons_desc: "Move small arms through Jordan to strengthen the Free Syrian Army against the Syrian government."
 SAU_heir_mbn_maneuver: "The Crown Prince Manoeuvres"
 SAU_heir_mbn_maneuver_desc: "Use Mohammed bin Nayef's Interior Ministry authority, security records, and counterterrorism reputation to strengthen his succession claim."
 SAU_heir_mbs_maneuver: "The Young Prince Manoeuvres"
 SAU_heir_mbs_maneuver_desc: "Transfer additional portfolios to Mohammed bin Salman and remove officials who oppose his succession claim."
 SAU_heir_rally_support: "Rally Support for the Heir"
 SAU_heir_rally_support_desc: "Meet senior princes and brief influential editors to build support for the chosen heir before the succession is formally announced."
 SAU_heir_undermine_mbn: "Undermine Mohammed bin Nayef"
 SAU_heir_undermine_mbn_desc: "Circulate concerns about Mohammed bin Nayef's health, endurance, and close relationship with the United States to weaken his support at court."
 SAU_heir_undermine_mbs: "Undermine Mohammed bin Salman"
 SAU_heir_undermine_mbs_desc: "Emphasize Mohammed bin Salman's conduct of the Yemen war, high spending, and disputes with senior princes to weaken his support at court."
 SAU_houthi_break_ceasefire: "Break the Saudi Ceasefire"
 SAU_houthi_break_ceasefire_desc: "The Kingdom's guns have fallen silent, but the war is not won. Tear up the ceasefire and renew the offensive against the Saudis."
 SAU_if_cross_border_raid: "Cross-Border Raid"
 SAU_if_cross_border_raid_desc: "Launch an armed incursion to hit Israeli military depots and outposts. The boldest option, and the one most likely to provoke a fierce response."
 SAU_if_rocket_barrage: "Rocket Barrage on Israeli Towns"
 SAU_if_rocket_barrage_desc: "Order the Front to launch rockets at Israeli towns, disrupting the economy and forcing the population into shelters."
 SAU_if_suicide_bombing: "Unleash a Bombing Campaign"
 SAU_if_suicide_bombing_desc: "Direct the Front's cells to carry out suicide bombings in Israeli cities, reducing public morale and increasing Israeli security costs."
 SAU_intel_counterintel_sweep: "Counter-Intelligence Sweep"
 SAU_intel_counterintel_sweep_desc: "The GIP turns inward for a season - safe houses rolled up, cipher clerks rotated, and every foreign handler in the Kingdom given a reason to go quiet.\n\n§GSuppresses foreign subversion and hardens our ciphers for 90 days§!, and leaves the intelligence community pleased when it winds down.\n\n§YRepeatable§! - a sweep holds only as long as you keep running it."
 SAU_intel_counterterror: "Counter-Terrorism Directorate"
 SAU_intel_counterterror_desc: "Coordinate raids and intelligence operations against al-Qaeda and jihadist cells. The crackdown bolsters stability and rallies the House of Saud behind the GIP, and strikes directly at any foreign fighters operating in the Kingdom."
 SAU_intel_expand_gip: "Expand the General Intelligence Presidency"
 SAU_intel_expand_gip_desc: "New stations, new cover, new training intakes. The Presidency does not recruit a man and stop - it builds somewhere to put him.\n\n§GPermanently adds an operative slot§!, so the Kingdom can keep another officer in the field for good.\n\n§YRepeatable up to 3 times.§!"
 SAU_intel_foreign_stations: "Foreign Station Network"
 SAU_intel_foreign_stations_desc: "Open GIP stations abroad to roll back Iranian influence and extend Saudi reach across the region."
 SAU_intel_mabahith: "Strengthen the Mabahith"
 SAU_intel_mabahith_desc: "Expand Mabahith surveillance and operations against domestic dissent. Greater internal control improves stability and support from the religious establishment."
 SAU_intel_surveillance_tech: "Acquire Advanced Surveillance Technology"
 SAU_intel_surveillance_tech_desc: "Rather than wait on the Kingdom's own engineers, the GIP buys the monitoring and data-analysis systems outright and has foreign contractors install them.\n\n§GInstalls Agency Computers at once§!, §Ywithout the research or the departmental groundwork the agency would normally demand§!.\n\n§RYou pay for the shortcut§! - dearer than building it yourself, and available only once."
 SAU_Intelligence_category: "§GGeneral Intelligence Presidency§!"
 SAU_islamic_rivalry_close: "Suspend the Campaign against Iran"
 SAU_islamic_rivalry_close_desc: "Quietly stand down the campaign. Closes the Islamic Rivalry decisions until reopened."
 SAU_islamic_rivalry_open: "Open the Campaign against Iran"
 SAU_islamic_rivalry_open_desc: "Set the Kingdom's apparatus to work against Tehran. Opens the Islamic Rivalry decisions."
 SAU_isr_talks_backchannel: "Open the Backchannel"
 SAU_isr_talks_backchannel_desc: "Use intermediaries in third countries to identify terms Israel might accept before either government begins public negotiations."
 SAU_isr_talks_clock: "Conclude the Talks with Israel"
 SAU_isr_talks_clock_desc: "From the moment Israel agrees to talk, the window is 120 days. Israel must accept the Arab Peace Initiative and at least one other track before patience, politics, and the region's enemies close it."
 SAU_isr_talks_palestine: "Offer the Arab Peace Initiative"
 SAU_isr_talks_palestine_desc: "Put the 2002 initiative on the table in writing: full normalization with the Arab world in exchange for an independent Palestinian state on the 1967 lines."
 SAU_isr_talks_sweeten: "Sweeten the Deal"
 SAU_isr_talks_sweeten_desc: "Offer investment, open skies, and access to the Gulf market as economic incentives for an agreement."
 SAU_isr_talks_us_mediation: "Bring In Washington"
 SAU_isr_talks_us_mediation_desc: "Ask the United States to guarantee the talks and use its influence with Israel to support an agreement."
 SAU_junta_address_the_nation: "Address the Nation"
 SAU_junta_address_the_nation_desc: "Have a senior Council member deliver a televised address explaining the new government and its program. The speech will reassure some of the public that the state remains under effective control."
 SAU_junta_category: "The Supreme Military Council"
 SAU_junta_control_readout: "§HControl§! §W[?SAU_junta_control|0]§!"
 SAU_junta_control_readout_desc: "Control measures the Council's ability to enforce its orders through garrisons, checkpoints, intelligence files, and loyal personnel. It falls by one each month, and temporary Council programs spend additional Control when launched."
 SAU_junta_legitimacy_crisis: "The Council Must Answer For Itself"
 SAU_junta_legitimacy_crisis_desc: "The Council has lost its remaining Legitimacy, and support from clerics and provincial authorities is beginning to collapse. It has six months to settle with the officers, address tribal demands, and restore its standing to §H20§!.\n\n§RIf a hundred and eighty days pass without meeting that threshold, the Kingdom will enter open conflict.§!"
 SAU_junta_legitimacy_readout: "§HLegitimacy§! §W[?SAU_junta_legitimacy|0]§!"
 SAU_junta_legitimacy_readout_desc: "Legitimacy measures acceptance of a Council that has no election, fatwa, or lawful succession behind it. It falls by one each month, and reaching zero gives the Council 180 days to recover to 20."
 SAU_junta_reinforce_garrisons: "Reinforce the Garrisons"
 SAU_junta_reinforce_garrisons_desc: "Deploy additional battalions to provincial capitals, fully staff checkpoints, and restore military communications between Riyadh and the garrisons."
 SAU_junta_standing_readout: "§HStanding§! [ROOT.GetSAUJuntaStanding]"
 SAU_junta_standing_readout_desc: "[ROOT.GetSAUJuntaStandingEffect]"
 SAU_junta_tour_the_provinces: "Tour the Provinces"
 SAU_junta_tour_the_provinces_desc: "Send Council representatives to meet local leaders in Buraydah, Jeddah, Jazan, and the interior. Hearing grievances and funding local requests will improve provincial support."
 SAU_king_abdullah_category: "King Abdullah bin Abdulaziz"
 SAU_king_mbn_category: "King Mohammed bin Nayef"
 SAU_king_mbs_category: "King Mohammed bin Salman"
 SAU_king_mutaib_category: "King Mutaib bin Abdullah"
 SAU_king_salman_category: "King Salman bin Abdulaziz"
 SAU_mbn_border_surveillance: "Fortify Border Guard Surveillance Grids"
 SAU_mbn_border_surveillance_desc: "Install towers, sensor fences, and thermal cameras along the Yemeni and Iraqi borders to improve detection of unauthorized crossings."
 SAU_mbn_mabahith_campaign: "Authorize Mabahith Counter-Subversion Campaign"
 SAU_mbn_mabahith_campaign_desc: "Authorize the General Investigation Directorate to dismantle suspected subversive networks throughout the Kingdom. The campaign will also detain some people whose involvement is uncertain."
 SAU_mbn_maneuver: "Bin Nayef's Faction Maneuvers"
 SAU_mbn_maneuver_desc: "The security services work to advance Mohammed bin Nayef's claim, and may turn the court against your own candidate."
 SAU_mbn_rehabilitation_center: "Activate the Prince Nayef Rehabilitation Center"
 SAU_mbn_rehabilitation_center_desc: "Place detainees in a rehabilitation program involving clerics, psychologists, and their families. The program may reduce recidivism, although some participants will return to militant activity."
 SAU_mbn_special_security_forces: "Deploy Ministry of Interior Special Security Forces"
 SAU_mbn_special_security_forces_desc: "Deploy Ministry of Interior Special Security Forces in major cities, giving the minister an armed force independent of the regular army."
 SAU_mbn_western_intel_networks: "Activate Western Joint Intelligence Networks"
 SAU_mbn_western_intel_networks_desc: "Expand intelligence liaison among Riyadh, the CIA, and British services. Saudi Arabia will share sensitive information in exchange for better access to Western intelligence."
 SAU_mbs_anticorruption_drive: "Execute the Anti-Corruption Drive"
 SAU_mbs_anticorruption_drive_desc: "Detain princes and business leaders at a luxury hotel and require financial settlements with the state. This returns funds to the treasury and demonstrates the Crown Prince's control over the elite."
 SAU_mbs_aramco_liquidity: "Aramco Strategic Liquidity Allocation"
 SAU_mbs_aramco_liquidity_desc: "Transfer part of Aramco's available capital to programs controlled by the Crown Prince, limiting the board's role in the decision."
 SAU_mbs_gami_localization: "Mobilize GAMI Defense Localization"
 SAU_mbs_gami_localization_desc: "Require foreign defense contractors to spend half of procurement funding inside the Kingdom or lose access to Saudi contracts."
 SAU_mbs_pif_neom: "Allocate PIF Funding to NEOM & Frontier Projects"
 SAU_mbs_pif_neom_desc: "Allocate Public Investment Fund capital to NEOM's linear city, port, and mountain resort projects despite their high technical and financial risks."
 SAU_mbs_vision2030_blitz: "Launch Vision 2030 Campaign Blitz"
 SAU_mbs_vision2030_blitz_desc: "Launch a coordinated advertising and conference campaign to build public and institutional support for Vision 2030."
 SAU_military_category: "§HArmed Forces Modernization§!"
 SAU_militia_back_dflp: "Fund the Democratic Front"
 SAU_militia_back_dflp_desc: "Fund secular Palestinian factions as a counterweight to competing movements and increase Saudi influence within Palestinian politics."
 SAU_militia_back_hamas: "Bankroll Hamas"
 SAU_militia_back_hamas_desc: "Provide Hamas with money, weapons, and recruits in exchange for closer alignment with Riyadh rather than Tehran."
 SAU_militia_islamic_front: "Forge a Saudi-Loyal Islamic Front"
 SAU_militia_islamic_front_desc: "Create and fund a new Islamist faction whose organization and command remain dependent on Saudi support."
 SAU_mod_abrams_gunnery: "Abrams Gunnery Programme"
 SAU_mod_abrams_gunnery_desc: "Run the programme to choose how this part of the armed forces fights.\n\n§YOpens with:§! M1A2 Abrams Main Battle Tank.\n§GOpens a choice of three doctrines§!, each with a strength and a drawback. Re-run later to §Yswitch§!. §H[Stage I reform - finish all three Stage I reforms to unlock Stage II.]§!"
 SAU_mod_apache_training: "Apache Gunship Training"
 SAU_mod_apache_training_desc: "Run the programme to choose how this part of the armed forces fights.\n\n§YOpens with:§! Army Aviation and Apache Gunships.\n§GOpens a choice of three doctrines§!, each with a strength and a drawback. Re-run later to §Yswitch§!. §H[Stage II reform - finish all three Stage II reforms to unlock Stage III.]§!"
 SAU_mod_artillery_livefire: "Live-Fire Artillery Exercise"
 SAU_mod_artillery_livefire_desc: "Run the programme to choose how this part of the armed forces fights.\n\n§YOpens with:§! M109 Self-Propelled Artillery.\n§GOpens a choice of three doctrines§!, each with a strength and a drawback. Re-run later to §Yswitch§!. §H[Stage II reform - finish all three Stage II reforms to unlock Stage III.]§!"
 SAU_mod_awacs_battle: "AWACS Battle Management Training"
 SAU_mod_awacs_battle_desc: "Run the programme to choose how this part of the armed forces fights.\n\n§YOpens with:§! E-3 Sentry AWACS.\n§GOpens a choice of three doctrines§!, each with a strength and a drawback. Re-run later to §Yswitch§!. §H[Stage III reform - the final batch.]§!"
 SAU_mod_complete: "Stage III: Achieve a Fully Modern Force"
 SAU_mod_complete_desc: "§HStage III of III - a fully modern force.§!\n\n§RThis stays locked until you complete all three Stage II reforms:§!\n  §Y- Live-Fire Artillery Exercise\n  - Apache Gunship Training\n  - Combined Fleet Exercise§!\n(pick a doctrine in each).\n\n§GWhat happens:§! the armed forces reach §GFully Modernized§! - a true counterweight to Iran - and the final reforms appear: §YSpecial Forces, AWACS and Precision Strike§!. Fires once."
 SAU_mod_construction: "Sponsor Industrial Construction"
 SAU_mod_construction_desc: "Fund new factories and roads in the Eastern Province to expand industrial capacity in the main oil-producing region."
 SAU_mod_devfund: "Capitalise the Development Fund"
 SAU_mod_devfund_desc: "Endow the national development fund to open new building capacity in the Eastern Province."
 SAU_mod_fleet_exercise: "Combined Fleet Exercise"
 SAU_mod_fleet_exercise_desc: "Run the programme to choose how this part of the armed forces fights.\n\n§YOpens with:§! The Royal Saudi Naval Forces.\n§GOpens a choice of three doctrines§!, each with a strength and a drawback. Re-run later to §Yswitch§!. §H[Stage II reform - finish all three Stage II reforms to unlock Stage III.]§!"
 SAU_mod_gulf_lessons: "War Games: Lessons of the Gulf"
 SAU_mod_gulf_lessons_desc: "Stage a major exercise to test the army against the hard lessons of 1991 - and decide which model to rebuild it on.\n\n§YOpens with:§! Lessons of the Gulf War.\n§GOpens a choice of four doctrines§! - American, GCC, NATO or Domestic - each with its own strengths and a drawback. Run the war games again later to §Yswitch doctrine§!."
 SAU_mod_modernize: "Stage II: Modernize the Combat Arms"
 SAU_mod_modernize_desc: "§HStage II of III - re-equipping the combat arms.§!\n\n§RThis stays locked until you complete all three Stage I reforms:§!\n  §Y- National Guard Readiness Drills\n  - Abrams Gunnery Programme\n  - Red Flag Air Combat Training§!\n(pick a doctrine in each).\n\n§GWhat happens:§! the armed forces go from §YIn Reform§! to §YModernizing§!, and three new reforms appear - §YArtillery, Apache and the Combined Fleet§!. You must complete all three before §YStage III§! will unlock. Fires once."
 SAU_mod_pgm_doctrine: "Precision Strike Doctrine Course"
 SAU_mod_pgm_doctrine_desc: "Run the programme to choose how this part of the armed forces fights.\n\n§YOpens with:§! Precision-Guided Munitions.\n§GOpens a choice of three doctrines§!, each with a strength and a drawback. Re-run later to §Yswitch§!. §H[Stage III reform - the final batch.]§!"
 SAU_mod_red_flag: "Red Flag Air Combat Training"
 SAU_mod_red_flag_desc: "Run the programme to choose how this part of the armed forces fights.\n\n§YOpens with:§! The Royal Saudi Air Force.\n§GOpens a choice of three doctrines§!, each with a strength and a drawback. Re-run later to §Yswitch§!. §H[Stage I reform - finish all three Stage I reforms to unlock Stage II.]§!"
 SAU_mod_reform: "Stage I: Launch the Reform Programme"
 SAU_mod_reform_desc: "§HStage I of III - the first phase of modernization.§!\n\n§GTo run it:§! complete the §YThe General Staff§! focus, then win the §YWar Games: Lessons of the Gulf§! (choose a Gulf War doctrine).\n\n§GWhat happens:§! the armed forces go from §RUnmodernized§! to §YIn Reform§!, and three new reforms appear - §YNational Guard, Abrams Gunnery and Red Flag§!.\n\n§RImportant:§! you must then complete §Rall three§! of those reforms before §YStage II§! will unlock. Fires once."
 SAU_mod_sang_drills: "National Guard Readiness Drills"
 SAU_mod_sang_drills_desc: "Run the programme to choose how this part of the armed forces fights.\n\n§YOpens with:§! Saudi Arabian National Guard.\n§GOpens a choice of three doctrines§!, each with a strength and a drawback. Re-run later to §Yswitch§!. §H[Stage I reform - finish all three Stage I reforms to unlock Stage II.]§!"
 SAU_mod_sf_selection: "Special Forces Selection Course"
 SAU_mod_sf_selection_desc: "Run the programme to choose how this part of the armed forces fights.\n\n§YOpens with:§! Special Forces Command.\n§GOpens a choice of three doctrines§!, each with a strength and a drawback. Re-run later to §Yswitch§!. §H[Stage III reform - the final batch.]§!"
 SAU_mod_workforce: "Train the National Workforce"
 SAU_mod_workforce_desc: "Vocational programs put more Saudis into skilled work, steadying society and national morale."
 SAU_mutaib_capital_garrison: "Fortify the Capital Garrison Grid"
 SAU_mutaib_capital_garrison_desc: "Establish National Guard checkpoints, armored positions, and independent communications around Riyadh. This protects the capital while strengthening the Guard's control of it."
 SAU_mutaib_janadriyah_festival: "Host the Janadriyah National Heritage Festival"
 SAU_mutaib_janadriyah_festival_desc: "Have the National Guard host the Janadriyah festival with camel racing, sword dancing, poetry, and televised tribal ceremonies. The event strengthens Mutaib's ties to tribal leaders."
 SAU_mutaib_maneuver: "Mutaib's Faction Maneuvers"
 SAU_mutaib_maneuver_desc: "The National Guard works to advance Mutaib's claim, and may turn the court against your own candidate."
 SAU_mutaib_sang_logistics: "Autonomous SANG Logistics Management"
 SAU_mutaib_sang_logistics_desc: "Create an independent National Guard supply system instead of relying on regular army depots. Logistical autonomy increases the Guard's operational and political independence."
 SAU_mutaib_sang_procurement: "Fast-Track SANG Aviation & Armored Procurement"
 SAU_mutaib_sang_procurement_desc: "Prioritize Apache helicopters and armored vehicles for the National Guard ahead of regular army orders, including a separate Guard aviation component."
 SAU_mutaib_tribal_reserves: "Mobilize Tribal SANG Reserves"
 SAU_mutaib_tribal_reserves_desc: "Call on tribal sheikhs to provide paid reserve personnel for the National Guard under the established levy system."
 SAU_officer_crisis_category: "The Officers' Grievance"
 SAU_officer_grievance_readout: "The Officer Corps: [ROOT.GetSAUArmyGrievance]"
 SAU_officer_grievance_readout_desc: "§HGrievance§!: §Y[?SAU_army_grievance|0]§! of §Y100§!\n[ROOT.GetSAUArmyGrievanceEffect]\n\nThis entry displays the current grievance level and has no decision effect."
 SAU_officers_pay_arrears: "Pay the Arrears"
 SAU_officers_pay_arrears_desc: "Pay eleven months of allowances, housing supplements, and deferred wages in a single backdated transfer. This provides temporary relief without resolving the cause of the officers' grievance.\n\n§G-20 grievance§!, §R-$12 billion§!, repeatable every 60 days."
 SAU_officers_promote_colonels: "Promote the Colonels"
 SAU_officers_promote_colonels_desc: "Give brigade commands to experienced career officers instead of reserving them for princes. The change will improve the corps' confidence in promotion by merit.\n\n§G-15 grievance§!, §G+2% stability§!, repeatable every 90 days."
 SAU_officers_restore_defence_budget: "Restore the Defence Budget"
 SAU_officers_restore_defence_budget_desc: "Restore funding cut from the regular forces and transfer the cost to the National Guard's budget. This addresses the main cause of the officers' grievance.\n\n§G-25 grievance§!, §R-$25 billion§!, and the Guard stops being shielded so grievance rises at half the rate; this can be done once."
 SAU_officers_settle_for_good: "Settle with the Officers"
 SAU_officers_settle_for_good_desc: "Establish an officer-selected commission, publish a promotion schedule, and have the King personally endorse the settlement. This can be completed only after every outstanding grievance has been removed.\n\n§GEnds the crisis permanently and prevents a coup§!; requires grievance at §Y0§!."
 SAU_oil_conserve: "Conserve the Reserves"
 SAU_oil_conserve_desc: "Reduce production to preserve reserves for future use. This sacrifices current revenue but §Greduces the economy's dependence on oil§! and improves stability."
 SAU_oil_embargo: "Proclaim an Oil Embargo"
 SAU_oil_embargo_desc: "Repeat the §H1973§! policy by ending oil exports to the §LWest and the friends of Israel§!, specifically the §LUnited States, Britain, France, Germany, and the Netherlands§!. Their economies will suffer from the supply shock, while Saudi Arabia gains support in Arab and Muslim countries.\n\nThe Kingdom loses Western export revenue and damages relations with Washington, but gains §Hprestige, unity and the clergy's blessing§!."
 SAU_oil_increase_output: "Increase Oil Output"
 SAU_oil_increase_output_desc: "Increase crude production in the Eastern Province for §Gmore oil and immediate revenue§!. This also makes the economy §Rmore dependent§! on oil exports."
 SAU_oil_new_field: "Develop a New Oil Field"
 SAU_oil_new_field_desc: "Finance exploration and new wells in the Empty Quarter. The project adds a major §Goil deposit§! but increases the Kingdom's reliance on petroleum."
 SAU_oil_new_field_tt: "§GA new field is proven§! - §Y+15 oil§! appears in one of the Kingdom's provinces, at a cost of §R$150 billion§!"
 SAU_opec_cut_production: "Cut Oil Production"
 SAU_opec_cut_production_desc: "Use Saudi Arabia's role as OPEC's swing producer to reduce output and §Graise the world oil price§!, increasing revenue per barrel. Usable every 180 days."
 SAU_opec_flood_market: "Flood the Oil Market"
 SAU_opec_flood_market_desc: "Increase output enough to §Rlower the world oil price§!. Saudi Arabia loses revenue in the short term, but competing exporters (§LRussia, Iran, Iraq, Venezuela§!) suffer larger economic losses. Usable once a year."
 SAU_operation_decisive_storm: "Operation Decisive Storm (Amaliyat Asifat al-Hazm)"
 SAU_operation_decisive_storm_desc: "Launch §YAmaliyat Asifat al-Hazm§!, the coalition air campaign against Houthi-held territory in Yemen. Saudi aircraft will strike Houthi positions, protect government forces, and unlock continuing support for the Yemeni army."
 SAU_pal_aid_package: "Palestinian Aid Package"
 SAU_pal_aid_package_desc: "Provide quarterly Saudi funding for Palestinian Authority salaries, hospitals, utilities, and reconstruction in Ramallah."
 SAU_pal_fund_development: "Fund Palestinian Development"
 SAU_pal_fund_development_desc: "Fund roads, schools, and clinics across the Palestinian territories to improve living conditions and support a viable two-state settlement."
 SAU_pal_invest_gaza: "Invest in Gaza and the West Bank"
 SAU_pal_invest_gaza_desc: "Invest in factories and infrastructure in Gaza and the West Bank to create jobs and reduce support for militant groups."
 SAU_pc_convene: "Convene the People's Council"
 SAU_pc_convene_desc: "Convene the chamber and give any bloc with enough seats three weeks to introduce a bill. Once a bill is introduced, the King must ratify or veto it; ratification strengthens the sponsoring bloc, while a veto weakens it.\n\nRepeatable every 90 days."
 SAU_pc_convene_tt: "Opens the floor - a bloc with §Y21+ seats§! may bring a bill within §Y21 days§!"
 SAU_pc_dissolve: "Dissolve the People's Council"
 SAU_pc_dissolve_desc: "Dissolve the People's Council by royal decree with no date set for its return.\n\n§R-10% stability, -8% war support§!, §G+150 political power§!. Cannot be undone."
 SAU_pc_enact_provincial: "Enact the Provincials' Bill"
 SAU_pc_enact_provincial_desc: "Implement the ratified Saudi hiring quotas, sponsorship reform, and independent inspectorate despite opposition from major merchant interests.\n\n§HStanding§! measures the People's Council's public authority; it §Grises§! when a bill is heard and enacted and §Rfalls§! after a veto, neglect, or an expired bill. Below §Y40§!, the Council cannot carry a bill through the ministries."
 SAU_pc_enact_provincial_tt: "Needs §Y300 political power§!, and the Council must still be behind the bill - its §Hstanding§! above §Y40§! (now §Y[?SAU_pc_standing|0]§! of §Y100§!)"
 SAU_pc_enact_reformist: "Enact the Reformists' Bill"
 SAU_pc_enact_reformist_desc: "Implement the ratified reformist bill by assigning ministries to prepare its regulations, schedules, and budget.\n\n§HStanding§! measures the People's Council's public authority; it §Grises§! when a bill is heard and enacted and §Rfalls§! after a veto, neglect, or an expired bill. Below §Y40§!, the Council cannot carry a bill through the ministries."
 SAU_pc_enact_reformist_tt: "Needs §Y300 political power§!, and the Council must still be behind the bill - its §Hstanding§! above §Y40§! (now §Y[?SAU_pc_standing|0]§! of §Y100§!)"
 SAU_pc_enact_traditionalist: "Enact the Traditionalists' Bill"
 SAU_pc_enact_traditionalist_desc: "Implement the ratified program for religious endowments, housing allowances, and provincial clinics through the responsible ministries.\n\n§HStanding§! measures the People's Council's public authority; it §Grises§! when a bill is heard and enacted and §Rfalls§! after a veto, neglect, or an expired bill. Below §Y40§!, the Council cannot carry a bill through the ministries."
 SAU_pc_enact_traditionalist_tt: "Needs §Y300 political power§!, and the Council must still be behind the bill - its §Hstanding§! above §Y40§! (now §Y[?SAU_pc_standing|0]§! of §Y100§!)"
 SAU_pc_public_works: "Commission Public Works"
 SAU_pc_public_works_desc: "The Council selects a province and sets a standard of §Y[?SAU_pc_req_civ|0]§! civilian factories, §Y[?SAU_pc_req_off|0]§! offices, and §Y[?SAU_pc_req_inf|0]§! infrastructure that the government must meet without free construction; the standard increases after each successful mandate. §HTwo years to comply§!: success gives the province permanent §G+1 building slot, +10% construction speed and +5% manpower§!, while failure §Rabandons the works and removes a civilian factory§!. §YRequires§! Council standing of §G60 or better§!; cost: §R-$4 billion§!."
 SAU_pc_readout: "People's Council: [ROOT.GetSAUPCBloc]"
 SAU_pc_readout_desc: "§HThe People's Council§! - [ROOT.GetSAUPCBloc], [ROOT.GetSAUPCStanding] (§Y[?SAU_pc_standing|0]§! of §Y100§!)\n§YReformists§!: [?SAU_pc_reformists|0]   §YTraditionalists§!: [?SAU_pc_traditionalists|0]   §YProvincials§!: [?SAU_pc_provincials|0]\n§HRoyal vetoes used§!: §Y[?SAU_pc_vetoes|0]§!\n\n§HStanding§! measures public authority; it §Grises§! when a bill is heard and enacted, §Rfalls§! after a veto, neglect, or an expired bill, and must remain at §Y40+§! to carry a bill through the ministries or §Y60+§! to commission public works. This entry is informational and has no decision effect."
 SAU_pc_session_clock: "The Council Awaits an Answer"
 SAU_pc_session_clock_desc: "The Council has convened, and a qualifying bloc has three weeks to introduce a bill before the session expires unanswered."
 SAU_pc_take_provincial_bill: "Hear the Provincials"
 SAU_pc_take_provincial_bill_desc: "Allow the provincial bloc to introduce a bill establishing Saudi hiring quotas, reforming the sponsorship system, and creating an independent labor inspectorate."
 SAU_pc_take_reformist_bill: "Hear the Reformists"
 SAU_pc_take_reformist_bill_desc: "Allow the reformist bloc of younger lawyers and returning graduates to introduce a bill focused on government performance and institutional reform."
 SAU_pc_take_traditionalist_bill: "Hear the Traditionalists"
 SAU_pc_take_traditionalist_bill_desc: "Allow the traditionalist bloc to introduce a bill funding religious endowments, housing allowances, and clinics in underserved provinces."
 SAU_pc_works_mandate: "Council Mandate: [SAU_pc_works_province.GetName]"
 SAU_pc_works_mandate_desc: "The Council has selected [SAU_pc_works_province.GetName], and the government has two years to meet its published development standard. No construction is provided automatically.\n\nThe required standard is §Y[?SAU_pc_req_civ|0]§! civilian factories, §Y[?SAU_pc_req_off|0]§! offices, and §Y[?SAU_pc_req_inf|0]§! infrastructure in the province."
 SAU_pipeline_iraq: "The Europe Pipeline"
 SAU_pipeline_iraq_desc: "After Saddam's removal, construct the Iraqi segment of a pipeline toward the Turkish border. A separate agreement with Ankara will be needed before Saudi oil can reach Europe."
 SAU_pipeline_iraq_talks: "Open Talks with Baghdad"
 SAU_pipeline_iraq_talks_desc: "Ask Saddam's government to permit a Saudi pipeline through Iraq despite its hostility toward the House of Saud. Baghdad is unlikely to agree."
 SAU_pipeline_sabotage_category: "Sabotage Saudi Pipelines"
 SAU_pipeline_syria_assad: "Negotiate the Levant Pipeline"
 SAU_pipeline_syria_assad_desc: "Secure transit through Jordan, then negotiate with the hostile Assad government for a pipeline through Syria to the Mediterranean. Damascus will demand substantial transit fees and political concessions in return."
 SAU_pipeline_syria_fsa: "The Levant Pipeline (Free Syria)"
 SAU_pipeline_syria_fsa_desc: "Secure transit through Jordan, then offer a friendly Syrian government Saudi investment in exchange for a pipeline route to the Mediterranean."
 SAU_pipeline_turkey_extend: "Extend the Pipeline to Turkey"
 SAU_pipeline_turkey_extend_desc: "Negotiate with Ankara to extend the Iraqi pipeline into Turkey and connect Saudi oil directly to European markets."
 SAU_pipeline_yemen: "The Arabian Sea Pipeline"
 SAU_pipeline_yemen_desc: "Build a pipeline through friendly southern Yemen and Al Mahrah to the Arabian Sea. The line remains vulnerable to disruption while the Yemeni war continues."
 SAU_proj_alula: "Build AlUla"
 SAU_proj_alula_desc: "The development of AlUla's ancient Nabataean tombs and oasis into a flagship cultural and heritage destination. §Y(Cost: $50 billion, build ~450 days)§! §RDeadline: [?SAU_remain_alula|0] days left.§! §HTies up 5 civilian factories while under construction.§!"
 SAU_proj_amaala: "Build Amaala"
 SAU_proj_amaala_desc: "A wellness and ultra-luxury tourism enclave on the northwestern Red Sea coast, the 'Riviera of the Middle East'. §Y(Cost: $50 billion, build ~450 days)§! §RDeadline: [?SAU_remain_amaala|0] days left.§! §HTies up 5 civilian factories while under construction.§!"
 SAU_proj_diriyah: "Build Diriyah"
 SAU_proj_diriyah_desc: "The restoration of the Kingdom's birthplace into a heritage and cultural district around the mudbrick city of At-Turaif. §Y(Cost: $50 billion, build ~450 days)§! §RDeadline: [?SAU_remain_diriyah|0] days left.§! §HTies up 5 civilian factories while under construction.§!"
 SAU_proj_green_riyadh: "Build Green Riyadh"
 SAU_proj_green_riyadh_desc: "A program to plant millions of trees across the capital, cooling the city and softening the desert. §Y(Cost: $30 billion, build ~365 days)§! §RDeadline: [?SAU_remain_green_riyadh|0] days left.§! §HTies up 4 civilian factories while under construction.§!"
 SAU_proj_jeddah_central: "Build Jeddah Central"
 SAU_proj_jeddah_central_desc: "The redevelopment of Jeddah's waterfront into a modern downtown, with a stadium, marina, and cultural district. §Y(Cost: $60 billion, build ~450 days)§! §RDeadline: [?SAU_remain_jeddah_central|0] days left.§! §HTies up 6 civilian factories while under construction.§!"
 SAU_proj_king_salman_park: "Build King Salman Park"
 SAU_proj_king_salman_park_desc: "Develop one of the world's largest urban parks in Riyadh. §Y(Cost: $40 billion, build ~270 days)§! §RDeadline: [?SAU_remain_king_salman_park|0] days left.§! §HTies up 4 civilian factories while under construction.§!"
 SAU_proj_neom: "Build NEOM"
 SAU_proj_neom_desc: "Develop NEOM as the Kingdom's flagship post-oil urban and industrial region on the Red Sea coast. §Y(Cost: $150 billion, build ~730 days)§! §RDeadline: [?SAU_remain_neom|0] days left.§! §HTies up 10 civilian factories while under construction.§!"
 SAU_proj_new_murabba: "Build New Murabba"
 SAU_proj_new_murabba_desc: "A new downtown for Riyadh built around the Mukaab, a cube-shaped tower vast enough to hold twenty Empire State Buildings. §Y(Cost: $100 billion, build ~730 days)§! §RDeadline: [?SAU_remain_new_murabba|0] days left.§! §HTies up 10 civilian factories while under construction.§!"
 SAU_proj_oxagon: "Build Oxagon"
 SAU_proj_oxagon_desc: "Build a floating port and manufacturing hub at NEOM organized around clean-energy industry. §Y(Cost: $80 billion, build ~540 days)§! §RDeadline: [?SAU_remain_oxagon|0] days left.§! §HTies up 8 civilian factories while under construction.§!"
 SAU_proj_qiddiya: "Build Qiddiya"
 SAU_proj_qiddiya_desc: "An entertainment, sports, and culture megacity outside Riyadh, with theme parks, stadiums, and a motorsport circuit. §Y(Cost: $80 billion, build ~540 days)§! §RDeadline: [?SAU_remain_qiddiya|0] days left.§! §HTies up 8 civilian factories while under construction.§!"
 SAU_proj_red_sea: "Build The Red Sea Project"
 SAU_proj_red_sea_desc: "An ultra-luxury tourism destination across dozens of pristine islands, built to a strict environmental standard. §Y(Cost: $80 billion, build ~540 days)§! §RDeadline: [?SAU_remain_red_sea|0] days left.§! §HTies up 7 civilian factories while under construction.§!"
 SAU_proj_roshn: "Build ROSHN"
 SAU_proj_roshn_desc: "The national housing developer building entire integrated communities to put millions of Saudis in modern homes. §Y(Cost: $60 billion, build ~365 days)§! §RDeadline: [?SAU_remain_roshn|0] days left.§! §HTies up 7 civilian factories while under construction.§!"
 SAU_proj_sindalah: "Build Sindalah"
 SAU_proj_sindalah_desc: "Develop Sindalah as NEOM's luxury Red Sea island destination and its first project open to visitors. §Y(Cost: $40 billion, build ~270 days)§! §RDeadline: [?SAU_remain_sindalah|0] days left.§! §HTies up 4 civilian factories while under construction.§!"
 SAU_proj_soudah_peaks: "Build Soudah Peaks"
 SAU_proj_soudah_peaks_desc: "Develop a mountain tourism destination on the high peaks of Asir, using the region's cooler climate and green landscape. §Y(Cost: $40 billion, build ~450 days)§! §RDeadline: [?SAU_remain_soudah_peaks|0] days left.§! §HTies up 5 civilian factories while under construction.§!"
 SAU_proj_sports_blvd: "Build Sports Boulevard"
 SAU_proj_sports_blvd_desc: "A 135-kilometer recreational corridor across Riyadh for cycling, running, and riding. §Y(Cost: $30 billion, build ~270 days)§! §RDeadline: [?SAU_remain_sports_blvd|0] days left.§! §HTies up 4 civilian factories while under construction.§!"
 SAU_proj_the_line: "Build THE LINE"
 SAU_proj_the_line_desc: "Construct THE LINE as a 170-kilometer car-free linear city between two 500-meter mirrored structures. §Y(Cost: $200 billion, build ~900 days)§! §RDeadline: [?SAU_remain_the_line|0] days left.§! §HTies up 12 civilian factories while under construction.§!"
 SAU_proj_trojena: "Build Trojena"
 SAU_proj_trojena_desc: "A year-round mountain resort in the NEOM highlands, complete with outdoor skiing in the Arabian desert. §Y(Cost: $60 billion, build ~450 days)§! §RDeadline: [?SAU_remain_trojena|0] days left.§! §HTies up 5 civilian factories while under construction.§!"
 SAU_rally_support: "Rally Support for Our Candidate"
 SAU_rally_support_desc: "Marshal the patronage of the royal family, the religious establishment, and the press behind your prince. The gain may be slight, solid, or a major breakthrough."
 SAU_repair_pipeline_iraq: "Expand the Europe Pipeline"
 SAU_repair_pipeline_iraq_desc: "Bring the northern trunk line up a tier - restoring what sabotage took, or laying the extra pumping capacity to carry more crude toward Turkey."
 SAU_repair_pipeline_syria: "Expand the Levant Pipeline"
 SAU_repair_pipeline_syria_desc: "Bring the Mediterranean line up a tier - restoring what sabotage took, or widening the corridor through Amman and Damascus."
 SAU_repair_pipeline_yemen: "Expand the Arabian Sea Pipeline"
 SAU_repair_pipeline_yemen_desc: "Bring the southern line up a tier - restoring what sabotage took, or laying the extra capacity to push more crude past Hormuz."
 SAU_request_f15: "Request the F-15 from the United States"
 SAU_request_f15_desc: "Open negotiations with Washington to acquire the F-15 Strike Eagle. If the Americans agree, the §YF-15 Strike Eagle§! focus will unlock.\n\n§RThis is an exclusive choice:§! the first supplier to accept locks in our fighter, and the other three programmes (§YTornado GR4§!, §YPanavia Tornado§!, §YEurofighter Typhoon§!) will be closed for good. Choose wisely."
 SAU_request_panavia: "Request the Panavia Tornado from Italy"
 SAU_request_panavia_desc: "Approach Rome for the Panavia Tornado IDS, the multinational strike fighter. If the Italians agree, the §YPanavia Tornado§! focus will unlock.\n\n§RThis is an exclusive choice:§! the first supplier to accept locks in our fighter, and the other three programmes (§YF-15 Strike Eagle§!, §YTornado GR4§!, §YEurofighter Typhoon§!) will be closed for good. Choose wisely."
 SAU_request_tornado: "Request the Tornado GR4 from the United Kingdom"
 SAU_request_tornado_desc: "Approach London for the Tornado GR4 strike aircraft, the backbone of the historic Al Yamamah programme. If the British agree, the §YTornado GR4§! focus will unlock.\n\n§RThis is an exclusive choice:§! the first supplier to accept locks in our fighter, and the other three programmes (§YF-15 Strike Eagle§!, §YPanavia Tornado§!, §YEurofighter Typhoon§!) will be closed for good. Choose wisely."
 SAU_request_typhoon: "Request the Eurofighter Typhoon"
 SAU_request_typhoon_desc: "Approach the European consortium (Germany) for the Eurofighter Typhoon under the Al Salam programme. If they approve the export, the §YAl Salam: Eurofighter Typhoon§! focus will unlock.\n\n§RThis is an exclusive choice:§! the first supplier to accept locks in our fighter, and the other three programmes (§YF-15 Strike Eagle§!, §YTornado GR4§!, §YPanavia Tornado§!) will be closed for good. Choose wisely."
 SAU_rivalry_back_separatists: "Back the Separatists"
 SAU_rivalry_back_separatists_desc: "The General Intelligence Presidency channels money and weapons to Ahwaz, Balochistan, and Kurdistan. Iran's periphery stirs."
 SAU_rivalry_propaganda_blitz: "Anti-Iranian Media Blitz"
 SAU_rivalry_propaganda_blitz_desc: "Flood the airwaves and the mosques with the case against Tehran."
 SAU_rivalry_strait_patrols: "Strait Patrols"
 SAU_rivalry_strait_patrols_desc: "Keep the fleet drilling in the narrow waters of Hormuz."
 SAU_royal_patronage: "Royal Patronage"
 SAU_royal_patronage_desc: "Use royal appointments and contracts to secure support for the chosen candidate among senior members of the family. This is available once in each succession race.\n\n§G+20 standing§! for the prince you are already backing, §Yonce under King Abdullah and once under King Salman§!."
 SAU_royal_patronage_tt: "§G+20§! to the standing of the prince you are backing"
 SAU_sabotage_pipeline_iraq: "Strike the Europe Pipeline"
 SAU_sabotage_pipeline_iraq_desc: "Hit the pipeline carrying Saudi oil through Iraq toward Europe. Cut it, and Riyadh's challenge to Moscow collapses with it."
 SAU_sabotage_pipeline_syria: "Strike the Levant Pipeline"
 SAU_sabotage_pipeline_syria_desc: "Target the Saudi pipeline crossing toward the Mediterranean. A successful hit severs the line and strips the Kingdom of the route."
 SAU_sabotage_pipeline_yemen: "Strike the Arabian Sea Pipeline"
 SAU_sabotage_pipeline_yemen_desc: "Send saboteurs against the Saudi line through southern Yemen. If they get through, the oil stops and the Kingdom loses its southern route."
 SAU_salman_burden_of_state: "Burden the King with State Business"
 SAU_salman_burden_of_state_desc: "Require the King to handle files, delegations, and ceremonies that would normally be delegated. The increased workload will accelerate the decline of his health."
 SAU_salman_cpsa_council: "Convene the Council of Political & Security Affairs"
 SAU_salman_cpsa_council_desc: "Replace the existing security committees with a single Council of Political and Security Affairs meeting in the royal palace. Consolidated authority will shorten the time required for major decisions."
 SAU_salman_health_status: "§HThe King's Health§!: [GetSAUKingHealth]"
 SAU_salman_health_status_desc: "The King's condition is reported as [GetSAUKingHealth]. When his health fails, the Crown Prince becomes King."
 SAU_salman_ksrelief: "Mobilize KSrelief Operations"
 SAU_salman_ksrelief_desc: "Send KSrelief aid convoys, field hospitals, and food supplies abroad under official Saudi sponsorship. The operation provides humanitarian assistance while improving support for the government at home."
 SAU_salman_maneuver: "Salman's Faction Maneuvers"
 SAU_salman_maneuver_desc: "The Sudairi bloc works to advance Salman's claim, and may turn the court against your own candidate."
 SAU_salman_riyadh_metro_plan: "Expand the Riyadh Metropolitan Plan"
 SAU_salman_riyadh_metro_plan_desc: "Expand Riyadh through six metro lines and a series of new districts organized around the transport network."
 SAU_salman_royal_decrees: "Issue Royal Structural Decrees"
 SAU_salman_royal_decrees_desc: "Use royal decrees to merge, abolish, and reorganize ministries without a lengthy legislative process."
 SAU_salman_royal_physicians: "Summon the Royal Physicians"
 SAU_salman_royal_physicians_desc: "Bring specialists from Europe and the United States to treat the King and clear his schedule for rest. This will improve his condition temporarily but cannot stop its long-term decline."
 SAU_salman_spark_park: "Subsidize King Salman Energy Park"
 SAU_salman_spark_park_desc: "Subsidize the thirty-square-kilometer King Salman Energy Park near Dammam to produce pumps, valves, and drilling equipment domestically."
 SAU_shura_convene_session: "Convene the Council"
 SAU_shura_convene_session_desc: "Hold a minuted session of the Majlis ash-Shura with ministers required to attend and answer questions. The proceedings will be published and may shape public debate even though the King retains final authority.\n\nThis decision can be taken once."
 SAU_shura_seat_notables: "Seat the Notables"
 SAU_shura_seat_notables_desc: "Appoint tribal sheikhs and leading merchant families from Jeddah and Buraydah to the Council.\n\nRepeatable every 60 days."
 SAU_shura_seat_notables_tt: "§G+10 notable seats§!, §R-5 seats§! for the ulema and the technocrats\n§GNotable-led§!: §G+8% political power, -8% corruption cost§! / §R+3% consumer goods, -3% war support§!\n§YAt 70 seats the King may charter the Council permanently.§!"
 SAU_shura_seat_technocrats: "Seat the Technocrats"
 SAU_shura_seat_technocrats_desc: "Appoint economists, engineers, and experienced ministry officials, including Saudis educated abroad, to the Council.\n\nRepeatable every 60 days."
 SAU_shura_seat_technocrats_tt: "§G+10 technocrat seats§!, §R-5 seats§! for the ulema and the notables\n§YTechnocrat-led§!: §G+8% research, +6% office output, +5% productivity growth§! / §R-5% stability§!\n§YAt 70 seats the King may charter the Council permanently.§!"
 SAU_shura_seat_ulema: "Seat the Ulema"
 SAU_shura_seat_ulema_desc: "Appoint senior religious scholars and their approved candidates to the Council, increasing clerical influence over its work.\n\nRepeatable every 60 days."
 SAU_shura_seat_ulema_tt: "§G+10 ulema seats§!, §R-5 seats§! for the technocrats and the notables\n§OUlema-led§!: §G+8% stability, +10% drift defence§! / §R-5% research, -5% migration§!\n§YAt 70 seats the King may charter the Council permanently.§!"
 SAU_spread_revolution_category: "Spread the Revolution"
 SAU_storm_air_campaign: "Strike Houthi Positions"
 SAU_storm_air_campaign_desc: "Select a province held by the Houthi movement and strike its depots, airfields, and supply roads. The attack will also damage nearby infrastructure and inflict casualties.\n\n§RDamages infrastructure, arms industry and air defences§! in the target province and costs the defenders manpower. Repeatable every 14 days."
 SAU_storm_partner_readout: "Coalition: [?SAU_coalition_partners|0] partners"
 SAU_storm_partner_readout_desc: "§HStates flying with the Kingdom§!: §Y[?SAU_coalition_partners|0]§!\n\nEach coalition member may withdraw independently."
 SAU_storm_stand_down: "Stand the Campaign Down"
 SAU_storm_stand_down_desc: "End coalition sorties and dissolve the campaign without further military operations.\n\n§G+4% stability§!, §R-3% war support§!. Ends the campaign for good."
 SAU_undermine_mbn: "Undermine Mohammed bin Nayef"
 SAU_undermine_mbn_desc: "Use court contacts, damaging disclosures, and withheld patronage to reduce Mohammed bin Nayef's support. The result may range from no effect to a major loss of influence."
 SAU_undermine_mutaib: "Undermine Mutaib bin Abdullah"
 SAU_undermine_mutaib_desc: "Use court contacts, damaging disclosures, and withheld patronage to reduce Mutaib bin Abdullah's support. The result may range from no effect to a major loss of influence."
 SAU_undermine_salman: "Undermine Salman bin Abdulaziz"
 SAU_undermine_salman_desc: "Use court contacts, damaging disclosures, and withheld patronage to reduce Salman bin Abdulaziz's support. The result may range from no effect to a major loss of influence."
 SAU_unleash_laf: "Unleash the Lebanese Army"
 SAU_unleash_laf_desc: "The army is rebuilt, paid, and armed. Now Riyadh asks Beirut for the only repayment that matters: disarm Hezbollah, by force if needed."
 SAU_vision2030_category: "Vision 2030 Projects"
 SAU_west_free_trade: "Free Trade with the West"
 SAU_west_free_trade_desc: "Lower tariffs and sign trade pacts across the NATO bloc. Relations with the Western alliance warm, and an open trade deal binds their markets to the Kingdom."
 SAU_west_joint_training: "Joint American-Saudi Training"
 SAU_west_joint_training_desc: "Conduct joint exercises with US instructors to improve Saudi combined-arms training and provide experience across the armed forces."
 SAU_west_petrodollar: "Petrodollar Recycling"
 SAU_west_petrodollar_desc: "Saudi oil revenue is recycled into US Treasuries and shared American ventures. The Kingdom gains less up front, but Washington grows richer and more committed to the House of Saud."
 SAU_yemen_old_weapons: "Ship Surplus Weapons"
 SAU_yemen_old_weapons_desc: "Send obsolete Saudi infantry weapons from military stockpiles to the Yemeni government at minimal domestic cost."
 SAU_yemen_raise_brigade: "Coordinate the Offensive"
 SAU_yemen_raise_brigade_desc: "Embed Saudi officers with the Yemeni command and plan a coordinated push. The government's forces gain a lasting edge on the attack against the Houthis."
 SAU_yemen_war_funds: "Fund the War Effort"
 SAU_yemen_war_funds_desc: "Wire money to Aden to pay salaries, buy fuel, and keep the government's soldiers in the field a while longer."
 YEM_drop_south_yemen_name: "重拾也门之名"
 YEM_drop_south_yemen_name_desc: "Set aside the South Yemen identity and rule once more simply as Yemen."
 yemen_partition_category: "The Two Yemens"
 SAU_events.1.a: "May Allah have mercy on his soul."
 SAU_events.1.d: "King Fahd bin Abdulaziz Al-Saud, Custodian of the Two Holy Mosques, has passed away after years of declining health following his stroke in 1995. Crown Prince Abdullah, who has been ruling the Kingdom de facto for nearly a decade, will now ascend to the throne as King. The succession crisis that has loomed over the Kingdom for years has finally been resolved."
 SAU_events.1.t: "Death of King Fahd"
 SAU_events.10.a: "Join OPEC+."
 SAU_events.10.b: "Reject the agreement."
 SAU_events.10.d: "Riyadh proposes coordinating oil output with Moscow under OPEC+, giving both exporters greater influence over global prices."
 SAU_events.10.t: "[SAU.GetFlag] OPEC+ Agreement [SOV.GetFlag]"
 SAU_events.100.a: "The region holds its breath"
 SAU_events.100.d: "Iran has gone to war against the breakaway Republic of Arabia, plunging the Gulf into open conflict between the two rival centres of Shia power."
 SAU_events.100.t: "War in the Gulf"
 SAU_events.101.a: "We will endure"
 SAU_events.101.d: "Tehran has stopped short of war, but its fury is plain. Iranian agents stir unrest in our cities and Iranian media brands the republic a heretic state."
 SAU_events.101.t: "Tehran Seethes"
 SAU_events.102.a: "Reconcile with the Gulf monarchies"
 SAU_events.102.b: "Champion the cause of Arab democracy"
 SAU_events.102.d: "With a parliament seated and the republic on its feet, the question of where Arabia stands in the world can no longer be deferred. Will it make peace with the Gulf monarchies, or lead the cause of Arab democracy?"
 SAU_events.102.t: "The Republic and the Region"
 SAU_events.103.a: "Join the league"
 SAU_events.103.b: "Remain independent"
 SAU_events.103.d: "The Republic of Arabia invites our nation into a league of Arab democracies, a bloc answerable to its peoples rather than to kings or clerics."
 SAU_events.103.t: "A Call to the Democracies"
 SAU_events.104.a: "A new chapter for Arabia"
 SAU_events.104.d: "Decades of absolute monarchy have ended. As crowds fill the streets of Riyadh, a Transitional National Council has seized the reins of state, vowing to govern only until Arabia can choose its own path at the ballot box."
 SAU_events.104.t: "The House of Saud Falls"
 SAU_events.107.a: "Proclaim the Arab Republic of Arabia"
 SAU_events.107.b: "Keep the Republic of Arabia"
 SAU_events.107.d: "The Ba'ath holds the reins of the state. Shall Arabia proclaim itself the Arab Republic, vanguard of the Arab nation, or keep the modest name of the Republic of Arabia?"
 SAU_events.107.t: "The Name of the Republic"
 SAU_events.109.a: "Join the Arab Comintern"
 SAU_events.109.b: "We will stand alone"
 SAU_events.109.d: "[FROM.GetName] invites us into the Arab Comintern, a union of workers' states bound by the cause of revolution. We may join our comrades or keep our own road."
 SAU_events.109.t: "A Call to the Arab Comintern"
 SAU_events.11.a: "Accept the bargain."
 SAU_events.11.b: "Decline the offer."
 SAU_events.11.d: "Riyadh offers Washington a standing bargain: a reliable flow of Saudi oil to American markets in exchange for closer security cooperation. The Kingdom awaits an answer."
 SAU_events.11.t: "[SAU.GetFlag] Oil for Security"
 SAU_events.110.a: "A costly lesson."
 SAU_events.110.d: "The Free Syrian Army has been crushed. The rebels we armed and funded are scattered or dead, and Damascus stands unbroken. Years of treasure and credibility poured into Syria have bought the Kingdom nothing but a humiliating defeat and a regime that now leans harder on Tehran than ever."
 SAU_events.110.t: "The Syrian Gambit Collapses"
 SAU_events.111.a: "Accept the ceasefire"
 SAU_events.111.b: "The war goes on"
 SAU_events.111.d: "Riyadh has put forward terms for a ceasefire. The Kingdom would halt its air campaign and end direct hostilities, leaving the Sana'a government to fight its own war. The offer sits on the table."
 SAU_events.111.t: "A Saudi Offer of Ceasefire"
 SAU_events.112.a: "A pause in the fighting"
 SAU_events.112.d: "Sana'a has agreed to a ceasefire. Operation Decisive Storm is wound down and the Kingdom steps back from the Yemeni front. The truce will hold only as long as we wish it to."
 SAU_events.112.t: "The Houthis Accept"
 SAU_events.113.a: "So be it"
 SAU_events.113.d: "Sana'a has rejected our terms outright. The war in Yemen grinds on, and Operation Decisive Storm continues."
 SAU_events.113.t: "The Houthis Refuse"
 SAU_events.114.a: "Then we fight"
 SAU_events.114.d: "The truce is over. Emboldened and rearmed, Ansar Allah has torn up the ceasefire and resumed its attacks. The war in Yemen is back, whether the Kingdom wished it or not."
 SAU_events.114.t: "The Houthis Break the Ceasefire"
 SAU_events.115.a: "Declare him King. He has waited long enough."
 SAU_events.115.b: "The time is not right. Let him serve as Crown Prince."
 SAU_events.115.d_mbn: "The order holds. Mohammed bin Nayef remains Crown Prince, his claim confirmed by the King and unchallenged in public. The younger man withdraws to his ministries, outmanoeuvred for now - and the Kingdom exhales."
 SAU_events.115.d_mbs: "It is done. Mohammed bin Nayef is relieved of his offices and, before the cameras, kisses the hand of the young man who has displaced him. Mohammed bin Salman is Crown Prince, and the line of succession has jumped a generation. The senior princes say nothing. Saying nothing is itself an answer."
 SAU_events.115.t: "The Crown Prince is Named"
 SAU_events.116.a: "Long may he reign."
 SAU_events.116.d_mbn: "King Salman is dead, and the Crown Prince accedes as he was always meant to. Mohammed bin Nayef takes the throne with the security services behind him and a reputation built on keeping the Kingdom standing."
 SAU_events.116.d_mbs: "King Salman is dead, and the throne passes to his son. Mohammed bin Salman rules the Kingdom outright at an age when most of his predecessors were still waiting for a ministry. The men who doubted him have long since been retired, arrested, or reconciled."
 SAU_events.116.t: "A New King in Riyadh"
 SAU_events.117.a: "Send them home."
 SAU_events.117.b: "Naturalise the useful ones."
 SAU_events.117.d: "Nine million foreign workers hold the Kingdom's economy upright. They lay the pipe, staff the hospitals, drive the lorries and fill the sites - and they are not, and will never be, of the nation the Faisalites mean to rebuild. The Council cannot agree whether they are a scaffold to be removed or a foundation to be built upon."
 SAU_events.117.t: "The Expatriate Workforce Question"
 SAU_events.118.a: "Withdraw from what we did not write."
 SAU_events.118.b: "Work them from within."
 SAU_events.118.d: "The United Nations, the Fund, and the Bank were built without the Kingdom's consent. Withdrawal would free Riyadh from institutions it did not write, but leave it spoken about rather than heard. The Council must choose between distance and influence."
 SAU_events.118.t: "The International Forums Question"
 SAU_events.119.a: "Bring it all home."
 SAU_events.119.b: "Leave it where it earns."
 SAU_events.119.d: "Hundreds of billions sit in Western treasuries and banks, safe and profitable but vulnerable to foreign pressure. Bringing the wealth home would fund the Kingdom's development; leaving it abroad preserves its returns and Riyadh's influence in Western capitals."
 SAU_events.119.t: "The Foreign Wealth Question"
 SAU_events.12.a: "Accept the partnership."
 SAU_events.12.b: "Decline the offer."
 SAU_events.12.d: "Saudi Arabia proposes a long-term partnership with Britain. Oil revenue would pay for British industry and expertise, reviving the spirit of Al-Yamamah."
 SAU_events.12.t: "[SAU.GetFlag] A Saudi-British Partnership"
 SAU_events.120.a: "The Mosques are a duty, not a mandate."
 SAU_events.120.b: "We speak for the faithful."
 SAU_events.120.d: "More than a billion Muslims share no single political voice. The Kingdom holds Mecca and Medina, and the ulema ask whether that trust is a duty to discharge quietly or a mandate to lead the Ummah openly."
 SAU_events.120.t: "The Global Ummah Question"
 SAU_events.121.a: "The Self-Reliance Mandate."
 SAU_events.121.b: "Armed equidistance."
 SAU_events.121.d: "Two blocs are each convinced the Kingdom is theirs to lose. Riyadh may remain armed and equidistant, buying from both while belonging to neither, or accept the cost of building its own weapons and depending on no foreign arsenal."
 SAU_events.121.t: "The Superpower Engagement Question"
 SAU_events.122.a: "Alms, freely given."
 SAU_events.122.b: "Aid with conditions."
 SAU_events.122.d: "Saudi money reaches every corner of the Muslim world: mosques, clinics, governments, and armies. Faisal gave it as alms and asked for nothing in writing; his heirs argue that aid without conditions buys no lasting influence. The Kingdom must choose between charity and leverage."
 SAU_events.122.t: "The Sovereign Aid Question"
 SAU_events.123.a: "Strike the foreign colours. They go home."
 SAU_events.123.a_tt: "Every foreign power loses military access to the Kingdom"
 SAU_events.123.b: "The arrangement stands. Necessity permits what principle forbids."
 SAU_events.123.d: "Foreign flags still fly over Saudi soil, and every year they do the sermons grow harder to answer. The garrisons guarantee the Kingdom against its neighbours and humiliate it before its own clergy in the same breath. The Council has run out of ways to postpone the decision."
 SAU_events.123.t: "The Foreign Bases Question"
 SAU_events.124.a: "Proclaim it from the pulpit."
 SAU_events.124.b: "Proclaim it from the palace."
 SAU_events.124.d: "When Faisal took the throne from his brother in 1964 he did it with a fatwa in hand and the Council of Ministers already reorganised beneath him - the mosque and the machinery moved in the same week. Saud had spent the Kingdom to the edge of bankruptcy; Faisal answered with an austerity nobody had asked for and a Ten-Point Programme nobody had voted on.\n\nThe programme is to be revived. The only question left is whose name it is revived in - the clergy remember the King who ruled with them, and the ministries remember the King who ran the state himself."
 SAU_events.124.t: "The Faisalite Resurgence"
 SAU_events.125.a: "Buy out their charters."
 SAU_events.125.b: "Replace them outright."
 SAU_events.125.d: "Abdulaziz bound the peninsula together with marriages and stipends, and left his sons governing provinces that were, in every practical sense, their own. Faisal spent eleven years prising the ministries loose from that arrangement and never entirely finished it.\n\nThe charters can be bought back at a price the Treasury will feel, or they can simply be revoked - which is cheaper, and makes enemies inside the family who will outlive the King who made them."
 SAU_events.125.t: "Centralization of the Provincial Emirates"
 SAU_events.126.a: "Give them the courts."
 SAU_events.126.b: "Give them the schools."
 SAU_events.126.d: "Faisal governed with the scholars at his shoulder and paid for it in instalments. When he brought television to the Kingdom in 1965 his own nephew died attacking the station in Riyadh, and a decade later that man's brother walked into a majlis and shot the King dead. The alliance with the ulema was never decorative and never free.\n\nWhat they are given back now decides which Kingdom this is. The courts would make them arbiters of the law. The schools would make them authors of the next generation."
 SAU_events.126.t: "Increase the Ulema's Authority"
 SAU_events.127.a: "Exile them."
 SAU_events.127.b: "Re-educate them."
 SAU_events.127.d: "The irony is lost on nobody: Faisal built the technocracy himself, sending Saudis to Cairo, London and California and handing them ministries when they came home. Zaki Yamani ran the oil portfolio with a Harvard degree in his pocket and did it better than anyone the Kingdom could have raised at home.\n\nBut the men returned with more than qualifications, and the Council now argues over whether the answer is the airport or the classroom."
 SAU_events.127.t: "Purge the Westernized Elite"
 SAU_events.128.a: "Appoint by examination."
 SAU_events.128.b: "Appoint by loyalty."
 SAU_events.128.d: "Before Faisal there was barely a state to staff. The Kingdom's finances ran through the King's own household and a handful of trusted merchants, and the difference between the treasury and the royal purse was a matter of opinion. He built ministries where there had been retainers.\n\nWhat the new bureaucracy is actually for was never settled. A service chosen by examination will be competent and will not be grateful. A service chosen by loyalty will be neither."
 SAU_events.128.t: "The Sovereign Civil Service"
 SAU_events.129.a: "Let them patrol in force."
 SAU_events.129.b: "Keep them advisory."
 SAU_events.129.d: "The Committee for the Promotion of Virtue and the Prevention of Vice was a scattering of local enforcers until the state gave it a budget, a uniform and a chain of command. Faisal needed the clergy reconciled to television, to girls' schools and to foreign engineers walking the streets of Dhahran, and the Committee was part of what he paid.\n\nIt has never quite been a police force, and has never quite not been one either."
 SAU_events.129.t: "The Virtue Committees Return"
 SAU_events.13.a: "Accept the investment pact."
 SAU_events.13.d: "Setting old suspicions aside, Riyadh offers Paris a sweeping investment pact: Saudi capital for French industry, and French expertise for the Kingdom. Both governments stand to gain."
 SAU_events.13.t: "[SAU.GetFlag] A Franco-Saudi Investment Pact"
 SAU_events.130.a: "Jam the satellites."
 SAU_events.130.b: "Buy the networks."
 SAU_events.130.d: "Faisal fought his first media war against Nasser's Voice of the Arabs, which broadcast into Saudi barracks and told Saudi soldiers their King was an American servant. Riyadh answered with transmitters of its own and a great deal of money placed quietly with editors in Beirut and Cairo.\n\nThe lesson took: a broadcast cannot be argued with. It can only be jammed, or bought."
 SAU_events.130.t: "Ban Foreign Media"
 SAU_events.131.a: "Seat the notables."
 SAU_events.131.b: "Widen the membership."
 SAU_events.131.d: "The Ten-Point Programme of 1962 promised the Kingdom a Consultative Council. Faisal ruled for thirteen more years and never convened one, and it fell to Fahd to finally seat it in 1992 - thirty years late, and appointed rather than elected.\n\nThe promise is being made again, and the composition is the whole of the argument. The notables would make it a court. A wider membership would make it something the court cannot entirely predict."
 SAU_events.131.t: "Reorganization of the Majlis ash-Shura"
 SAU_events.132.a: "Technical institutes."
 SAU_events.132.b: "Military academies."
 SAU_events.132.d: "The boom was built by other people's hands - Yemeni labourers, Egyptian teachers, Palestinian clerks, and in time a million and more from South Asia. Faisal's answer was education on a scale the peninsula had never attempted: King Abdulaziz University opened in 1967, the scholarship programmes sent thousands abroad, and the Kingdom set about manufacturing its own middle class.\n\nWhat that class is manufactured for is the decision in front of the Council."
 SAU_events.132.t: "The National Cadre Initiative"
 SAU_events.133.a: "Seal it entirely."
 SAU_events.133.b: "Admit whom we need."
 SAU_events.133.d: "By the 1970s the foreign workforce was approaching a third of everyone inside the borders, and it was doing most of the work that kept the lights burning. Faisal took the labour and worried about the politics that came attached - the Palestinians brought the cause, the Yemenis brought numbers, and the Egyptians brought Nasser.\n\nSealing the frontier restores the nation to itself and hands the ministries a labour shortage for which they have no plan whatever."
 SAU_events.133.t: "The Closed Frontier"
 SAU_events.134.a: "Fortify the coast."
 SAU_events.134.b: "Fortify the interior."
 SAU_events.134.d: "Faisal's Kingdom was ringed by people who wanted it gone: Nasser's Egypt across the Red Sea, the republicans in Sanaa, the Ba'athists in Baghdad and Damascus, and a Soviet Union that had written the House of Saud off as a relic awaiting burial. He built the National Guard against the coup and bought American aircraft against the invasion, and was never entirely sure which would come first.\n\nThe Kingdom must now decide which threat it is actually preparing for."
 SAU_events.134.t: "The Fortress Kingdom"
 SAU_events.135.a: "Convene it in Mecca."
 SAU_events.135.b: "Convene it abroad."
 SAU_events.135.d: "When Al-Aqsa burned in August 1969, Faisal had the heads of the Muslim world assembled at Rabat within weeks, and the Organisation of the Islamic Conference existed before the year was out. It was the answer to Nasser's Arab League - not Arab and secular, but Muslim and led from Mecca.\n\nWhere the Kingdom convenes the faithful is itself the statement. The Holy Cities confer a legitimacy no conference hall abroad can lend."
 SAU_events.135.t: "Islamic Solidarity Conference"
 SAU_events.136.a: "Threaten the embargo openly."
 SAU_events.136.b: "Apply it quietly."
 SAU_events.136.d: "On the seventeenth of October 1973 Faisal cut production and closed the taps to the United States. A barrel went from three dollars to nearly twelve inside a season, the West discovered precisely what its comfort was worth, and the Kingdom discovered it was holding a weapon it had never thought to fire.\n\nIt has not been fired since. The Ministry has kept the figures current the entire time."
 SAU_events.136.t: "The Spirit of '73"
 SAU_events.137.a: "Weapons first."
 SAU_events.137.b: "Everything else first."
 SAU_events.137.d: "The Kingdom pumps the oil, sells it abroad, and buys back everything it needs - including the pipe the oil moves through. Faisal's Five-Year Plans were meant to break that circle and largely succeeded at building the things which move oil faster.\n\nSubstitution has to begin somewhere, and where it begins decides what the Kingdom can do without asking anyone's permission."
 SAU_events.137.t: "Eradicate Foreign Dependency"
 SAU_events.138.a: "Fund it."
 SAU_events.138.b: "Staff it."
 SAU_events.138.d: "Faisal founded the Muslim World League in Mecca in 1962 and drove the Organisation of the Islamic Conference into being seven years later. Both were seated where Saudi money could reach them, and both were built to answer a pan-Arabism that had no room for kings.\n\nHis successors kept paying the bills and gradually stopped writing the agenda. Money buys deference; officials buy control. They are not the same thing."
 SAU_events.138.t: "Reclaim the OIC Leadership"
 SAU_events.139.a: "A strict quota."
 SAU_events.139.b: "A phased quota."
 SAU_events.139.d: "Aramco was made to buy Saudi where Saudi existed, and where it did not, the Kingdom paid foreign firms to build the factory that would make it. It was slow, it was expensive, and it remains the only way a country importing its own drill bits ever stops doing so.\n\nHow hard the floor is set decides whether the ministries comply, or simply learn to file exemptions."
 SAU_events.139.t: "The Domestic Supply Quota"
 SAU_events.14.a: "Accept the investment."
 SAU_events.14.b: "Decline the offer."
 SAU_events.14.d: "Saudi Arabia offers to invest in our industry in exchange for deeper economic ties. Accepting would bring new factories and Saudi influence."
 SAU_events.14.t: "[SAU.GetFlag] Investment in NATO Countries"
 SAU_events.140.a: "Let him follow Faisal. The Guard will carry it."
 SAU_events.140.b: "Faisal's Kingdom died with Faisal. Let it rest."
 SAU_events.140.d: "Fahd is buried and Abdullah is King in his own right at last, after ten years of ruling in another man's name. The succession is open, and the princes have already begun counting.\n\nThe King's own son comes to him with an argument rather than a claim. Miteb commands the National Guard - the tribal levies, the men from the interior, the force raised precisely because the regular army could not be trusted near a throne. He has been reading Faisal: the austerity, the self-reliance, the Kingdom that spoke for the Ummah and asked Washington's leave for nothing. The uncle who ruled that way was shot dead by his own nephew, and every man in the room knows it.\n\nFaisal's programme has no heir. Miteb is asking to be one."
 SAU_events.140.t: "The Faisalite Resurgence"
 SAU_events.141.a: "Let the market find its own floor."
 SAU_events.141.b: "The state will buy. We cannot let this become politics."
 SAU_events.141.d: "On the twenty-fifth of February the Tadawul All Share Index closed at 20,634 and then stopped climbing. It has not stopped falling since.\n\nThis is not a crash of banks and institutions. Something close to half the adult population of the Kingdom was in that market - teachers, drivers, soldiers, civil servants - many of them holding shares bought on borrowed money at prices no earnings could ever justify. Brokerage floors were opened in shopping centres. Women traded from segregated rooms. It was, for two years, the national pastime.\n\nBy the time the index finds its floor it will have shed something near two thirds of its value, and several hundred billion riyals of household savings with it. The Capital Market Authority is three years old and has never seen anything like this. The Council must decide whether the state catches the falling knife, or lets the market teach the lesson it is teaching."
 SAU_events.141.t: "Black February"
 SAU_events.142.a: "Cut production. Defend the price."
 SAU_events.142.b: "Hold output. Let the expensive producers break first."
 SAU_events.142.d: "The price of a barrel is falling and shows no sign of stopping. The budget was written on assumptions that no longer hold, and every ministry is about to discover which of its programmes were affordable and which were merely funded. \nRiyadh has been here before. In the early 1980s it cut its own production to hold the price up, watched every other producer quietly sell into the gap it had left, and saw Saudi output fall by roughly three quarters while the price collapsed anyway. The lesson was expensive and is still argued over in the Ministry.\nThe Kingdom holds the cheapest barrels on earth. That is the only real advantage it has, and it can be spent defending the price for everybody, or spent outlasting the producers who cannot afford to sell at these numbers."
 SAU_events.142.t: "Oil Price Collapse"
 SAU_events.143.a: "A hard lesson in an expensive classroom."
 SAU_events.143.d: "The Saudi stock exchange has lost the greater part of its value in a matter of months, erasing several hundred billion riyals of household wealth. Unusually for a market of this size, the losses fall almost entirely on ordinary Saudis rather than institutions - schoolteachers, drivers and civil servants who bought at the peak, many of them on credit. Analysts abroad are noting that the world's largest oil exporter has just discovered it also has a retail investor class, and no idea what to do with one."
 SAU_events.143.t: "Riyadh: The Tadawul Collapses"
 SAU_events.144.a: "The barrel decides, as it always does."
 SAU_events.144.d: "The price of crude has fallen through every floor the analysts drew for it. Exporting states are rewriting budgets balanced on assumptions now visibly worthless, while importers enjoy a windfall they are careful not to celebrate too loudly. Every eye is on Riyadh, which holds the cheapest barrels on earth and therefore the only decision that matters: cut production and hold the price up for everybody, or keep pumping and find out who breaks first."
 SAU_events.144.t: "The Price of Oil Collapses"
 SAU_events.145.a: "Protect the Guard. It is what guards us."
 SAU_events.145.b: "Both services will bear it equally."
 SAU_events.145.d: "The reserves are draining and the budget will not close. Subsidies go first, then the capital projects, and now the Ministry of Finance has come for the defence line.\n\nThe difficulty is that the Kingdom does not have one army. It has the regular forces under the Ministry of Defence, and it has the National Guard - recruited from the loyal tribes of the interior, garrisoned around Riyadh and the oil fields, answering to the throne directly. The Guard exists because Abdulaziz's sons did not trust the army, and it has been paid accordingly ever since.\n\nThe cuts can fall on both, or the Guard can be protected and the regular officers can be told to make do. One of those choices keeps the throne safe this year. The other keeps it safe in ten.\n\n§HThe officer corps§!: [ROOT.GetSAUArmyGrievance] (§Y[?SAU_army_grievance|0]§! of §Y100§!)\n[ROOT.GetSAUArmyGrievanceEffect]"
 SAU_events.145.t: "The Unequal Cuts"
 SAU_events.146.a: "Send in the Guard. Clear the streets."
 SAU_events.146.b: "Nobody deploys. Find the money and buy the peace."
 SAU_events.146.d: "The austerity has reached the street. There are crowds in Qatif and Dammam, and smaller ones in Riyadh that the ministries insist are not crowds at all.\n\nThe National Guard is the instrument for this - it always has been, that is the whole point of it - and the Guard is ready, funded and willing. The regular officer corps has not been asked, and is watching very carefully to see who is asked.\n\nEvery colonel in the Ministry of Defence understands what it means if the Guard is sent in while their own units sit unpaid in barracks. It means the throne has decided which army it trusts, in public, permanently.\n\n§HThe officer corps§!: [ROOT.GetSAUArmyGrievance] (§Y[?SAU_army_grievance|0]§! of §Y100§!)\n[ROOT.GetSAUArmyGrievanceEffect]"
 SAU_events.146.t: "The Order to Deploy"
 SAU_events.147.a: "Move on Riyadh. The Guard will not have time to react."
 SAU_events.147.b: "Not this. We are soldiers, not politicians."
 SAU_events.147.d: "It is settled, then. The Guard is paid and trusted; the army is neither. The men who fly the aircraft, command the armour and hold the border have been told, without anyone quite saying it, that they are the second army in their own country.\n\nThere is precedent for what happens next. In 1969 a conspiracy of air force and army officers - Nasserist, Hejazi, tired of being ruled by a family - came within an intelligence report of overthrowing Faisal. Hundreds were arrested. The Kingdom drew the lesson that the regular forces could not be trusted, built the Guard higher, and never asked why the officers had wanted it in the first place.\n\nThe staff have been meeting for some weeks. They are not discussing budgets any more.\n\n§HThe officer corps§!: [ROOT.GetSAUArmyGrievance] (§Y[?SAU_army_grievance|0]§! of §Y100§!)\n[ROOT.GetSAUArmyGrievanceEffect]"
 SAU_events.147.t: "The Officers Decide"
 SAU_events.148.a: "The Kingdom has a new government."
 SAU_events.148.d: "Saudi regular army units moved into Riyadh before dawn and hold the ministries, the broadcasting authority and the approaches to the royal palaces. National Guard barracks were surrounded in the same hour and have not resisted. A Supreme Military Council has announced that it is restoring public order and that the constitutional position of the throne is unchanged - a formula that observers note can be read several ways.\n\nAramco reports normal loading at Ras Tanura. That is the only sentence in the entire dispatch that the oil markets are reading."
 SAU_events.148.t: "Riyadh: Armour in the Streets"
 SAU_events.149.a: "Proclaim an Arab Socialist Republic."
 SAU_events.149.b: "Proclaim an Islamic Republic."
 SAU_events.149.c: "Proclaim a Constitutional Republic."
 SAU_events.149.d: "The throne is finished. The Council has the ministries, the broadcasting authority and the approaches to every palace in Riyadh, and it has discovered what every junta discovers: seizing a country takes a night, and governing one takes a name.\nA republic must be proclaimed, and a republic must be proclaimed as something. The officers in the room do not agree on what. Some served alongside Iraqis and Syrians and came home admiring the Ba'ath - one Arab nation, one party, the army as its spine. Others point east to Qatif and the Eastern Province and argue that the only mass constituency the Kingdom has ever suppressed is the one that would carry a republic on its shoulders. A younger faction, the ones sent abroad to study, want a constitution and a parliament and the word republic to mean what it means everywhere else. And a handful, quieter than the rest, have been reading things the Mabahith would once have arrested them for.\nWhatever is announced tonight, it will be announced in the name of the Saudi people, and none of them have been asked."
 SAU_events.149.e: "Proclaim a People's Republic."
 SAU_events.149.t: "Al-Jumhuriya"
 SAU_events.15.a: "Accept the naval partnership."
 SAU_events.15.b: "Decline the offer."
 SAU_events.15.d: "Riyadh approaches Madrid with a naval offer: Spanish yards would build for the Royal Saudi Navy, and Saudi money would flow into Spanish industry."
 SAU_events.15.t: "[SAU.GetFlag] A Saudi-Spanish Partnership"
 SAU_events.150.a: "Absorb them. They can wear our uniform."
 SAU_events.150.b: "Dissolve the Guard entirely. Send them home."
 SAU_events.150.c: "Keep a rump, under our command."
 SAU_events.150.d: "Seventy-five thousand men, raised from the tribes of Najd because Abdulaziz's sons did not trust an army of professionals, and armed well enough that no professional army could move on Riyadh without fighting them first. They were surrounded in their barracks on the night and they did not fire a shot. Now the Council has to decide what to do with them.\n\nThey are not an enemy formation. Their officers are cousins and neighbours of the men holding the guns on them, and every one of their soldiers belongs to a tribe with a claim on the state. Dissolve them and the Council saves a great deal of money and makes a great many enemies in the interior. Absorb them and it doubles its manpower and swallows seventy-five thousand men whose loyalty was, until last week, explicitly to somebody else."
 SAU_events.150.t: "The Guard Disbanded"
 SAU_events.151.a: "They will answer to the state or to nobody."
 SAU_events.151.b: "Restore the stipends. Every riyal of them."
 SAU_events.151.d: "The stipends stopped when the Guard did. In the interior that was not read as a budget measure - the payments to the tribes of Najd and the Shammar predate the Kingdom itself, they are the arrangement by which Abdulaziz assembled it, and they have never once been interrupted.\n\nThe sheikhs are not in rebellion. They are simply not answering, and in a country this size not answering is most of the way there."
 SAU_events.151.t: "The Tribes Answer"
 SAU_events.152.a: "Arrest them. All of them, tonight."
 SAU_events.152.b: "Bring them in. Widen the Council and share the blame."
 SAU_events.152.d: "A Council that cannot pay, cannot govern and cannot explain itself is a Council that its own colonels begin to discuss in the third person. There are meetings again - the same rooms, the same ranks, the same careful phrasing that preceded the last one.\n\nThe men who took Riyadh know precisely how this is done, because they did it. That is the difficulty with governing by coup: you have published the method."
 SAU_events.152.t: "The Officers Turn"
 SAU_events.153.a: "Better poor than hanged."
 SAU_events.153.d: "The stipends are restored, the tribunals are quietly wound down, and a date is named for a consultative assembly that everyone understands will be appointed rather than elected. It is not much. It is enough that the men who were counting the Council's remaining weeks have stopped counting out loud.\n\nThe Treasury is lighter by a sum nobody will publish, and the officers who took Riyadh have handed back a good deal of what they took it for."
 SAU_events.153.t: "The Council Buys Its Way Back"
 SAU_events.154.a: "Then it will be settled in the field."
 SAU_events.154.d: "Ninety days, and the Council found nothing to say. The garrison at Ha'il declared for the King this morning, the Eastern Province followed by noon, and the tribal levies the Guard used to draw on have stopped pretending to be anything else.\n\nThe army that took the country in a night is now the only institution defending it, and it is discovering that a state held entirely by force requires rather more force than anyone budgeted for."
 SAU_events.154.t: "The Kingdom Divides"
 SAU_events.155.a: "The world watches the Eastern Province."
 SAU_events.155.d: "Fighting has been reported across the Saudi interior between units loyal to the Supreme Military Council and formations declaring for the House of Saud. The Eastern Province, where the oil is, is contested. Brent opened eleven dollars higher and has not stopped climbing.\n\nEvery foreign ministry with an embassy in Riyadh is issuing the same statement about restraint, and every one of them is quietly working out which side to be seen backing late rather than early."
 SAU_events.155.t: "Riyadh: Civil War in Saudi Arabia"
 SAU_events.156.a: "Keep Abdullah. The throne is worth what it costs us."
 SAU_events.156.b: "Find us a King who understands the arrangement."
 SAU_events.156.d: "The governorships are the Council's to hand out now, which raises the question it has been carefully not raising. There is still a King.\n\nAbdullah is old, personally austere in a way the country has always liked, and commanded the National Guard for forty years before the Council dissolved it - which means the men who took Riyadh are asking whether to keep the man whose army they just disbanded. In his favour: nobody in the Kingdom questions his legitimacy, and a throne that nobody questions is worth more than several divisions.\n\nAgainst him: he is not a figurehead by temperament and never has been. Keeping him means giving back some of what the Council took, in practice and in public. The alternative is to find a prince who understands that the arrangement is the other way round."
 SAU_events.156.t: "The Question of the Throne"
 SAU_events.157.a: "Salman bin Abdulaziz."
 SAU_events.157.b: "Mohammed bin Nayef."
 SAU_events.157.c: "Mutaib bin Abdullah."
 SAU_events.157.d: "King Abdullah has been retired from the throne, and the Supreme Military Council must name a successor from among the senior princes of the House of Saud.\n\nEach candidate carries a different constituency behind him - the Sudairi establishment, the security services, the tribes of the interior, and the younger generation of the family. The Council's choice will determine which part of the Kingdom recognises the new arrangement first, and which part will have to be persuaded."
 SAU_events.157.e: "Mohammed bin Salman."
 SAU_events.157.t: "A More Convenient King"
 SAU_events.158.a: "A serving officer. §H+5 Control, -5 Legitimacy§!"
 SAU_events.158.b: "A prince of the House of Saud. §H-5 Control, +5 Legitimacy§!"
 SAU_events.158.c: "A local notable. §H+2 Control, +2 Legitimacy§!"
 SAU_events.158.d: "The seat is empty and the Council must fill it. Three names have been put forward, and each of them buys the Council something different.\n\nAn officer will be obeyed and resented. A prince will be recognised and ignored. A local notable will be neither, which is the useful part and the dangerous part at once."
 SAU_events.158.t: "The Governorate of [SAU_governor_province.GetName]"
 SAU_events.159.a: "A narrow regency. He keeps the throne and the Mosques."
 SAU_events.159.b: "A total regency. Every power, without exception."
 SAU_events.159.c: "A regency of five years. Put a date on it."
 SAU_events.159.d: "The document is short. It records that His Majesty, being indisposed, entrusts the executive authority and the defence portfolio to a Council acting in his name, and it bears his signature beneath a paragraph he was given no opportunity to amend.\n\nWhat remains to be settled is how much the decree actually takes. A regency that leaves the King his mosque, his title and his ceremonies is a regency the country can live with, and one that leaves him nothing is simply the truth written down. The lawyers point out, without being asked, that a decree with a date on it is easier to sign than a decree without one.\n\nThere is no constitution to suspend. That has always been the convenience of this Kingdom."
 SAU_events.159.t: "The Regency Decree"
 SAU_events.16.a: "Extend the air-defense umbrella."
 SAU_events.16.b: "Decline the request."
 SAU_events.16.d: "The Kingdom asks Washington for an expanded air-defense umbrella. Patriot batteries would ring Saudi cities and oil fields, paid for in full by Riyadh."
 SAU_events.16.t: "[SAU.GetFlag] The American Shield"
 SAU_events.160.a: "The full apparatus. Curfew, tribunals, censors."
 SAU_events.160.b: "Emergency powers only. Leave the streets alone."
 SAU_events.160.d: "Assembly, movement between the provinces and the printing presses pass under military authority this morning. The Council's lawyers observe that the Kingdom has never possessed a constitution to suspend, which saves a great deal of drafting.\n\nThe question is how far it goes. Curfew, tribunals and censors will hold the country still and be remembered for a generation. Emergency powers without the curfew will hold rather less and be forgiven rather sooner."
 SAU_events.160.t: "Martial Law"
 SAU_events.161.a: "The decree said five years. It has been five years."
 SAU_events.161.b: "The indisposition continues. Indefinitely."
 SAU_events.161.d: "Five years ago the Council put a date on its own authority, and the lawyers who advised it to do so have spent the intervening years being quietly reassigned. The date has arrived. Everybody in the Kingdom knows it has arrived.\n\nHonouring it means handing the executive back to a throne the Council has spent five years hollowing out, and trusting that gratitude is a real thing. Breaking it means the Council's word is worth exactly what everyone suspected, and it will never be worth more than that again.\n\n§HA promise kept costs the Council its grip. A promise broken costs it everything else.§!"
 SAU_events.161.t: "The Regency Expires"
 SAU_events.162.a: "Licence the designs. We need production, not pride."
 SAU_events.162.b: "Build it ourselves, from the ore up."
 SAU_events.162.d: "The Kingdom has bought its weapons abroad since it had weapons to buy, and the men now governing it spent their careers waiting on foreign spare parts that arrived when somebody else's parliament permitted it. The Act compels domestic manufacture of what can be made here.\n\nThere are two ways to begin. Buy the licences and the tooling, and have plants running inside three years making somebody else's designs under somebody else's terms. Or start from nothing - the metallurgy, the engineers, the failures - and own the result completely, at a cost the Treasury will feel for a decade."
 SAU_events.162.t: "The Defense Industries Act"
 SAU_events.163.a: "The princes. Let the country watch them account for it."
 SAU_events.163.b: "The dissidents. The files are already written."
 SAU_events.163.c: "Both. We did not seize the state to be selective."
 SAU_events.163.d: "The court sits under military authority, without appeal, and takes jurisdiction the ordinary judges were never granted. The ulema have been consulted on the form of the proceedings and not on the verdicts, which they have noticed.\n\nThe Council must decide who is brought before it. There are princes whose accounts will not survive an audit and whose disgrace the country would enjoy enormously. There are organisers, clerics and signatories whose files the Mabahith have kept for twenty years. Trying the first is popular and profitable. Trying the second is necessary and will be remembered."
 SAU_events.163.t: "The Emergency Tribunal"
 SAU_events.164.a: "Universal service. Every man of age, no exemptions."
 SAU_events.164.b: "Selective service. The tribes keep their exemptions."
 SAU_events.164.d: "The Al Saud never conscripted anybody. An army of volunteers drawn from trusted tribes is loyal; an army of everyone is merely large, and a large army in a country of this size develops opinions about how the country is run.\n\nThe Council is itself the opinion the last regime feared, which lends the discussion a certain awkwardness. It proposes to take the risk anyway - the only question is whether the levy falls on everyone, or on everyone the Council can afford to annoy."
 SAU_events.164.t: "Conscript the Kingdom"
 SAU_events.165.a: "The senior princes. Their names still carry the country."
 SAU_events.165.b: "The overlooked cousins. Gratitude is cheaper than prestige."
 SAU_events.165.c: "The wealthy malcontents. Bring them in and audit them later."
 SAU_events.165.d: "The family is not one thing. It is thousands of people with wildly unequal claims, and a great many of them have spent their lives being passed over by the branch that held the throne. The Council has just removed that branch from the equation.\n\nThere are senior princes whose names alone would settle a province. There are cousins of no particular distinction who would be grateful for a governorate and remember who gave it to them. And there are the ones with money and grievances, who could be brought in cheaply and audited later."
 SAU_events.165.t: "Loyalists in the Provinces"
 SAU_events.166.a: "Pay the merchant houses. Buy the Hejaz properly."
 SAU_events.166.b: "Garrison it. They will adjust."
 SAU_events.166.d: "Makkah Province is Jeddah, the merchant houses, the pilgrimage and the Hejaz - a region that was a kingdom in its own right until 1925 and has never entirely stopped mentioning it. Its families financed the state before the oil did and have never been fully reconciled to Najdi rule.\n\nThey can be bought, and they are expensive. Or the province can be garrisoned, and they can be reminded that the pilgrimage runs through checkpoints now."
 SAU_events.166.t: "The Makkah Province"
 SAU_events.167.a: "Court them. Concede what has to be conceded."
 SAU_events.167.b: "Reassign the chairs. We need the wording now."
 SAU_events.167.d: "Medina holds the Prophet's Mosque and the scholarly establishment that grew up around it over thirteen centuries. Its jurists can describe the Council as a necessity that the community must accept, or as a usurpation that it must endure, and the wording will travel further than any communique the Council issues.\n\nThey can be courted, which means concessions and patience. Or the senior chairs can be reassigned to men who already agree, which is faster and which every scholar in the Muslim world will notice."
 SAU_events.167.t: "The Al-Madinah Province"
 SAU_events.168.a: "Stand behind the King. Borrow the title, do not take it."
 SAU_events.168.b: "The guardianship belongs to the state, not the man."
 SAU_events.168.d: "Fahd took the title Custodian of the Two Holy Mosques in 1986, setting aside Majesty for something that claimed what no other Muslim ruler could claim. It is the most valuable thing the House of Saud owns and it does not transfer.\n\nThe Council cannot take it from a living King. It can stand behind him when he uses it, and be seen doing so - which lends the Council his legitimacy and reminds everyone whose legitimacy it is. Or it can announce that the guardianship rests with the state rather than the man, and discover how the Muslim world takes that."
 SAU_events.168.t: "Guardians of the Two Mosques"
 SAU_events.169.a: "Begin with the Eastern Province committees."
 SAU_events.169.b: "Place the sermons under review."
 SAU_events.169.c: "Begin with the petition signatories."
 SAU_events.169.d: "The Mabahith did not need to build anything. The cabinets in the Interior Ministry hold the Eastern Province organisers by name and street, the Sahwa preachers by sermon and date, and the men who signed the 2003 petition and signed it again in 2007. The ministry that assembled all this was always careful with it, because the men in the files had cousins in the ministry. The Council has no cousins."
 SAU_events.169.e: "Take all three files together."
 SAU_events.169.t: "The Files Are Already Open"
 SAU_events.17.a: "We will answer this."
 SAU_events.17.d: "Militants of [ROOT.SAU_GetFrontName] have loosed a barrage of rockets across the border. Sirens wail over our towns as families scramble for shelter and the damage is tallied."
 SAU_events.17.t: "Rockets Strike Our Towns"
 SAU_events.170.a: "In open court, and televised."
 SAU_events.170.b: "Settle it in the Ritz, as before."
 SAU_events.170.c: "Pardons, at the going rate."
 SAU_events.170.d: "The accountants have finished, and the figures are worse than the rumours. Ministries that built nothing, commissions on aircraft that were never delivered, a decade of the Kingdom's revenue that simply stopped somewhere between the treasury and the contractor. The country is going to be told some of this. The only question is how much of it happens in front of a camera, and how much is settled in a hotel with the doors closed."
 SAU_events.170.t: "Princes in the Dock"
 SAU_events.171.a: "Pension them, generously and permanently."
 SAU_events.171.b: "Exile the senior lines."
 SAU_events.171.c: "Prosecute, and confiscate what is found."
 SAU_events.171.d: "Abdulaziz had forty-five recorded sons and the Kingdom has spent seventy years absorbing the consequences. There are several thousand of them now, drawing stipends, holding governorates, married into every merchant house from Jeddah to Hofuf. None of them individually is a threat to the Council. All of them together are the only alternative government the country has ever known, and they cannot simply be left where they are."
 SAU_events.171.e: "Leave them rich and ornamental."
 SAU_events.171.t: "Every One of Them a Claim"
 SAU_events.172.a: "Recognise the Council. The relationship is with the country."
 SAU_events.172.b: "Recognise them, and take something for it."
 SAU_events.172.c: "We do not deal with a council of colonels."
 SAU_events.172.d: "The letter is short. It notes that the Kingdom's obligations are unchanged, that production targets will be met, that American personnel are safe and that the Council would welcome an early meeting. It does not mention the King, the arrests or the constitution. Washington now has to decide what it is looking at: a government, or a group of officers who happen to be sitting where a government used to be."
 SAU_events.172.t: "The Council Writes to Washington"
 SAU_events.173.a: "Ports, rail and the northern corridor."
 SAU_events.173.b: "Capital, and no conditions attached."
 SAU_events.173.d: "The Chinese ambassador arrived four days after the night itself, congratulated the Council on the restoration of order, and moved directly to the subject of throughput at Yanbu. There was no reference to the King, to the arrests, or to the constitution. It is the most straightforward conversation the Kingdom's foreign ministry has had in a decade, and everyone in the room understands precisely what is being sold."
 SAU_events.173.t: "No Questions Asked"
 SAU_events.174.a: "Admit them, once Riyadh settles with Tehran."
 SAU_events.174.b: "The application is declined."
 SAU_events.174.c: "Admit them. No conditions."
 SAU_events.174.d: "The Saudi application for full membership arrives at the Secretariat with no preamble and no conditions attached to it, which is itself a statement. The Organisation has never admitted a Gulf state. It has also never turned down a founding-scale oil producer that asked politely. The question in Beijing is not whether Riyadh is useful - that was settled years ago - but whether admitting it means importing a quarrel the Organisation has spent two decades avoiding."
 SAU_events.174.t: "An Application from Riyadh"
 SAU_events.175.a: "Restore the understanding with Tehran."
 SAU_events.175.b: "We will not be told who our neighbours are."
 SAU_events.175.d: "The reply is courteous and entirely unambiguous. China will sponsor the application, chair the vote and carry the smaller members - and in exchange the understanding brokered in Beijing in 2023 is to be restored in writing, embassies and all. The Organisation does not want a member that will spend every summit arguing with another member. Riyadh is being asked to buy its seat with a signature, not with oil."
 SAU_events.175.t: "Beijing's Terms"
 SAU_events.176.a: "Note it, and move on."
 SAU_events.176.d: "No reason is given, because none is required. The communique thanks the Kingdom for its interest, notes the value of continued dialogue, and closes. Riyadh has been refused by an organisation it was assured would take anyone, and the refusal will be read correctly in every capital that matters."
 SAU_events.176.t: "The Application Is Declined"
 SAU_events.177.a: "Take the seat."
 SAU_events.177.d: "The vote is unanimous, which means it was settled before it was taken. The Kingdom joins as a full member with no preconditions, no probationary period and no reference whatsoever to the manner in which its present government came to office. That silence is the whole of what has been purchased."
 SAU_events.177.t: "Admitted Without Conditions"
 SAU_events.178.a: "The barrels move as before."
 SAU_events.178.d: "The recognition arrives as a two-line statement issued on a Friday afternoon, which is where Washington puts the things it would rather nobody examined. The ambassador returns the following week. Nothing in the commercial relationship is renegotiated and nothing about the last six months is mentioned by either side, then or afterwards."
 SAU_events.178.t: "Business as Usual"
 SAU_events.179.a: "Grant the access. It is what recognition costs."
 SAU_events.179.b: "Recognition on those terms is not recognition."
 SAU_events.179.d: "Washington will recognise the Council, and has attached a schedule to the offer: expanded access at Prince Sultan, prepositioning rights in the Eastern Province, and standing overflight. The reasoning is not hidden. A government that needs recognition badly enough to ask for it is a government that can be charged for it, and the Council asked first."
 SAU_events.179.t: "Recognition, at a Price"
 SAU_events.18.a: "The cowards will pay."
 SAU_events.18.d: "A coordinated bombing campaign by [ROOT.SAU_GetFrontName] has torn through our cities. The dead are counted as the public demands the government act."
 SAU_events.18.t: "Bombing in Our Cities"
 SAU_events.180.a: "Then we manage without them."
 SAU_events.180.d: "The statement runs to four paragraphs on constitutional government and the rule of law, and is issued by a State Department that has said nothing comparable about half the Kingdom's neighbours. The Council reads it, notes which of its own officers were trained in Kansas, and files it. The relationship does not end. It simply stops being spoken about."
 SAU_events.180.t: "Washington Declines"
 SAU_events.181.a: "Reaffirm it in full. Security for oil, as before."
 SAU_events.181.b: "The oil, yes. The guarantee, no."
 SAU_events.181.c: "Let it lapse. It was never written down."
 SAU_events.181.d: "In February 1945 Roosevelt and Abdulaziz met aboard a cruiser in the Great Bitter Lake and agreed the arrangement that has underwritten eighty years of policy: American security, Saudi oil. Neither man signed anything, which every administration since has found convenient. Riyadh is now asking, formally and in writing, for an answer to the question the vagueness was designed to avoid - was the bargain made with a king, or with a country?"
 SAU_events.181.t: "The Quincy Question"
 SAU_events.182.a: "Nothing is signed. Nothing needs to be."
 SAU_events.182.d: "There is no document, because there was never a document. There is a carrier group that does not leave, a note passed between two governments that will not be published in either country, and a fuelling agreement renewed for twenty years on the old terms. Eighty years on, the arrangement has survived a change of dynasty by the simple method of never having been written down."
 SAU_events.182.t: "The Understanding Holds"
 SAU_events.183.a: "We will take the half that ships."
 SAU_events.183.d: "The commercial relationship is confirmed in some detail and the security relationship is described, twice, as being under review. Riyadh understands the construction perfectly: the tankers are guaranteed and the Kingdom is not. It is the half of Quincy that costs Washington nothing, offered by an administration that has counted the cost of the other half."
 SAU_events.183.t: "Half a Bargain"
 SAU_events.184.a: "Then the Kingdom guarantees itself."
 SAU_events.184.d: "No statement, no refusal, no meeting. The request is acknowledged by a deputy assistant secretary and never answered, and after some months it becomes clear that the non-answer was the answer. Eighty years of arrangement have not been repudiated. They have simply been allowed to expire, quietly, in the way such things always end."
 SAU_events.184.t: "Nobody's Guarantee"
 SAU_events.185.a: "Let them read."
 SAU_events.185.b: "The Kingdom has one foreign policy."
 SAU_events.185.d: "Four months into the new reign the Organisation of the Islamic Conference met at Mecca - the body King Faisal built after Al-Aqsa burned in 1969, convened in his own city by his younger brother. A ten-year programme of action was agreed and everyone went home. In the officers' messes of the National Guard they have been reading the older speeches instead, the ones from 1973, and observing that Faisal did not stop at programmes. Mutaib bin Abdullah commands the Guard. He has not stopped the reading."
 SAU_events.185.t: "The Summit at Mecca"
 SAU_events.186.a: "Fund it openly, in the Kingdom's name."
 SAU_events.186.b: "Let the Guard pay for it quietly."
 SAU_events.186.c: "Rein him in."
 SAU_events.186.d: "In 1969 Al-Aqsa burned and Faisal had the heads of the Muslim world assembled at Rabat within the month; the Organisation of the Islamic Conference exists because of it. The circle around Mutaib wants the summit reconvened and the Muslim World League funded openly - in the Kingdom's name, at the Kingdom's expense, with the Kingdom's flag on the podium. It is not a small request. It is also, precisely, what his uncle did.\n\n§HFaisalist sentiment§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! of §Y100§!)"
 SAU_events.186.t: "The Rabat Memory"
 SAU_events.187.a: "Faisal has an heir after all."
 SAU_events.187.d: "RIYADH - The commander of the Saudi Arabian National Guard has spent the week doing, in miniature, what his uncle did in full. The Muslim World League's budget has been restored to something near its 1970s share, the Islamic Development Bank is to be recapitalised out of Guard-adjacent funds, and Mutaib bin Abdullah has called - unprecedentedly, for a serving Saudi commander rather than a minister - for the Organisation of Islamic Cooperation to be convened in extraordinary session.\n\nKing Faisal founded the League at Mecca in 1962 and assembled the Organisation at Rabat in 1969, and in October 1973 he demonstrated what the Kingdom could do on the day it chose to act instead of mediate. The Guard is not the state and its commander is not the King. Both points are being made in Riyadh a great deal more often than they were a month ago."
 SAU_events.187.t: "Faisal Has an Heir"
 SAU_events.188.a: "Say plainly what is already said privately."
 SAU_events.188.b: "Washington's war is not ours to narrate."
 SAU_events.188.d: "There are American divisions in Mesopotamia, on the far side of a border the Kingdom has never been able to close. Whatever Washington calls the arrangement, every preacher from Buraydah to Abha describes it the same way, and none of them is being contradicted by the facts. The circle around Mutaib has stopped arguing over whether Faisal was right about the West. It has moved on to what follows from his being right.\n\n§HFaisalist sentiment§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! of §Y100§!)"
 SAU_events.188.t: "The Occupation Next Door"
 SAU_events.189.a: "The Kingdom does not reform to be applauded abroad."
 SAU_events.189.b: "The century will not wait for us."
 SAU_events.189.d: "Individually the decrees are modest - a rule relaxed here, a ministry restructured there, a profession opened to people previously not permitted in it. Together they are the largest social change since the schools took girls, and nobody in Riyadh pretends they were drafted without one eye on how they would read in Washington and London. The pulpits have noticed the second part rather more than the first.\n\n§HFaisalist sentiment§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! of §Y100§!)"
 SAU_events.189.t: "The Kingdom Opens"
 SAU_events.19.a: "Reinforce the border."
 SAU_events.19.d: "Fighters of [ROOT.SAU_GetFrontName] have crossed the frontier, striking military depots before melting back into the night. Our forces scramble to respond."
 SAU_events.19.t: "Incursion Across the Border"
 SAU_events.190.a: "Ask Faisal's question out loud."
 SAU_events.190.b: "The reserve is not a weapon."
 SAU_events.190.d: "Another Muslim capital, another American air campaign, another Saudi statement urging restraint upon all parties. The circle around Mutaib has given up drafting statements. It circulates one question instead, and it is precisely the question Faisal answered in October 1973: what is the use of the largest oil reserve on earth if it is never once picked up?\n\n§HFaisalist sentiment§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! of §Y100§!)"
 SAU_events.190.t: "The Next War"
 SAU_events.191.a: "Let it run. He should be seen at its head."
 SAU_events.191.b: "Channel it through the ministries."
 SAU_events.191.c: "Disperse it before it names a king."
 SAU_events.191.d: "It has stopped being a conversation among officers. Faisal's portrait is in the windows on Olaya Street; the Friday sermons in Buraydah and Unaizah have been on the same subject for six weeks; and the Guard's own conscripts are quoting the 1973 broadcast back to their instructors. Nobody organised this and everybody recognises where it points. Mutaib bin Abdullah has said nothing in public, which is itself now being read as a statement.\n\n§HFaisalist sentiment§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! of §Y100§!)"
 SAU_events.191.t: "The Street Remembers Faisal"
 SAU_events.192.a: "Faisal's answer. Say it in his words."
 SAU_events.192.b: "Open the treasury to those under fire."
 SAU_events.192.c: "A statement urging restraint on all parties."
 SAU_events.192.d: "Israeli forces are in action against an Arab state, and the Kingdom's television is carrying it live and uninterrupted. Within a day the placards are American as much as Israeli - the aircraft, the munitions, the veto that will follow at the Security Council. This is the ground Faisal chose in 1973 and the argument has not changed in the interval: the Kingdom holds the largest oil reserve on earth and has never once been willing to pick it up.\n\n§HFaisalist sentiment§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! of §Y100§!)"
 SAU_events.192.t: "Another War, and the Same Question"
 SAU_events.193.a: "Let the record show it was settled at a table."
 SAU_events.193.d: "It runs to sixty pages and recommends almost exactly what the colonels asked for in the first place, which is what happens when a commission is allowed to choose its own members. The promotions are gazetted, the arrears are closed, and the officers who were named in the Interior Ministry's files are quietly told that the files have been closed too.\n\nThere will be no coup. The Kingdom's soldiers have been given a reason not to be the ones who end it, and for an army that is generally enough."
 SAU_events.193.t: "The Commission Reports"
 SAU_events.194.a: "Then it is agreed. Put the question to them all."
 SAU_events.194.b: "The Kingdom will answer Yemen by itself."
 SAU_events.194.d: "They arrive over a single weekend and the agenda is never published. Kuwait sends Sheikh Mohammed Al-Khalid Al-Sabah, the Deputy Prime Minister and Interior Minister; Qatar sends its Prime Minister, Sheikh Abdullah bin Nasser Al Thani, who holds the interior portfolio as well. The Emiratis are already in the building.\n\nThe capital has fallen to the Houthis and the recognised President is somewhere to the south of it with no army worth the name. The question before the room is not whether the Gulf can act. It is whether the Gulf acts as one signature or as several - and every state in the corridor will decide that for itself."
 SAU_events.194.t: "The Riyadh Meeting"
 SAU_events.195.a: "Sign it. By all necessary means."
 SAU_events.195.b: "Yemen will not be rescued into a protectorate."
 SAU_events.195.d: "The Saudi request is put to the President directly, and it is not an offer of help so much as a request for permission. Riyadh wants a letter: an appeal to the Security Council, and a separate appeal to the states of the Gulf Cooperation Council, asking them to intervene §Yby all necessary means§!.\n\nA recognised government may lawfully invite foreign forces onto its own soil, and that letter is the whole legal basis of what follows. Signed, it brings the Gulf's air forces. Unsigned, the Republic faces the Houthis with what it still has - and keeps the right to say afterwards that it was never anyone's client."
 SAU_events.195.t: "The Question from Riyadh"
 SAU_events.196.a: "Decisive Storm begins."
 SAU_events.196.b: "Air and sea only. No Saudi soldier crosses the border."
 SAU_events.196.d: "The announcement is not made in Riyadh. Adel al-Jubeir, the Kingdom's Ambassador to the United States, reads it out at the embassy in Washington while the first aircraft are already airborne - a choice of venue that tells every capital in the world who was consulted and when.\n\nOperation Decisive Storm. The states that answered the invitation are named as participants, some of whom learn the extent of their participation from the broadcast. The stated objective is the restoration of the legitimate government. No end date is given, and none is asked for.\n\n§HCoalition partners§!: §Y[?SAU_coalition_partners|0]§!"
 SAU_events.196.t: "The Declaration"
 SAU_events.197.a: "The Gulf has gone to war."
 SAU_events.197.d: "WASHINGTON - A Saudi-led coalition began air operations over Yemen tonight, announced from the Saudi embassy here rather than from Riyadh. The Kingdom cites a written request from the recognised President of Yemen and the collective defence provisions of the Gulf Cooperation Council.\n\nTehran has condemned the operation and denies arming the Houthi movement. Washington has confirmed it is providing logistical and intelligence support while committing no aircraft of its own. No coalition member has offered an estimate of how long the campaign is expected to last."
 SAU_events.197.t: "Operation Decisive Storm"
 SAU_events.198.a: "We will fly with the Kingdom."
 SAU_events.198.b: "This is not our war."
 SAU_events.198.d: "The request arrives through the Saudi ambassador and is unusually direct: aircraft, or the crews to service them, or in the last resort a name on the communique. The Kingdom is assembling a coalition against the Houthi advance and would prefer not to assemble it alone.\n\nJoining buys a great deal of credit in Riyadh and a share of whatever follows. Declining costs that credit and nothing else - and the war has no end date attached to it."
 SAU_events.198.t: "Riyadh Asks Us to Fly"
 SAU_events.199.a: "Then we will not go where we are not asked."
 SAU_events.199.b: "We do not need their signature."
 SAU_events.199.d: "Sanaa's answer is polite, unhurried and entirely negative. There will be no appeal to the Security Council and no request to the Gulf, and the Kingdom is thanked for its concern in the language governments reserve for concern they intend to ignore.\n\nWithout that letter there is no invitation, and without an invitation an air campaign over Yemen is simply an air campaign over Yemen. Riyadh may still act. It will do so on its own account, and every capital will record it that way."
 SAU_events.199.t: "The Letter Does Not Come"
 SAU_events.2.a: "Long live the King!"
 SAU_events.2.d: "Abdullah bin Abdulaziz Al-Saud has been formally proclaimed King of Saudi Arabia and Custodian of the Two Holy Mosques. Having served as de facto ruler since 1995, his formal ascension brings stability and continuity to the Kingdom. King Abdullah is known for his cautious reformist tendencies and his efforts to promote interfaith dialogue."
 SAU_events.2.t: "King Abdullah Ascends the Throne"
 SAU_events.20.a: "Jaysh al-Islam (Army of Islam)"
 SAU_events.20.b: "Ansar al-Haramayn (Defenders of the Two Holy Mosques)"
 SAU_events.20.c: "Kata'ib al-Aqsa (Al-Aqsa Brigades)"
 SAU_events.20.d: "The new Saudi-backed movement needs a name before it announces itself to the world. Its chosen banner will define how supporters and enemies speak of it."
 SAU_events.20.e: "Liwa al-Tawhid (Brigade of Monotheism)"
 SAU_events.20.t: "A Name for the Front"
 SAU_events.200.a: "Reform as far as the ministries will bear it."
 SAU_events.200.b: "Only the name on the decrees has changed."
 SAU_events.200.c: "Open the economy and let the politics follow."
 SAU_events.200.d: "Fahd is buried at Al Oud in an unmarked grave, as the doctrine requires, and Abdullah is King in his own name after a decade of governing in someone else's. The condolences arrive from ninety capitals and the first cabinet meeting is held the same week.\n\nEverything he has wanted to do since the stroke is now his to order rather than to propose, and the ministries know it. What they do not yet know is how much of it he still intends. There are men in that cabinet who have spent ten years assuming the answer was very little."
 SAU_events.200.t: "A New Kingdom"
 SAU_events.201.a: "Let the Allegiance Council rule on the succession."
 SAU_events.201.b: "The King names his heir. The Council will applaud him."
 SAU_events.201.c: "Buy the family's consent instead."
 SAU_events.201.d: "The succession has been settled by seniority among brothers since 1953, which worked while there were brothers and while they could agree. There are fewer of both every year, and the last two transitions were managed by men who are no longer alive to manage the next one.\n\nThe proposal on the table is a standing council of Abdulaziz's sons and grandsons, empowered to confirm a Crown Prince and to rule on the fitness of a king. It would be the first written procedure the throne has ever had. It would also be the first body in the Kingdom's history with a claim on the King himself, and not everybody in the room has failed to notice that."
 SAU_events.201.t: "Consolidating the Crown"
 SAU_events.202.a: "Let them speak, and publish what they say."
 SAU_events.202.b: "They may convene. The agenda is ours."
 SAU_events.202.d: "The hall is arranged so that a Shia cleric from Qatif sits within speaking distance of a Salafi scholar from Riyadh, and women are present, behind a screen, for the first time in the Kingdom's history. Nothing decided here binds anyone. That is the point of it and also the objection to it.\n\nThe delegates will say what they are permitted to say. How much that is has not been settled, and the two men who will settle it disagree: one holds that a session which changes nothing is worse than no session, the other that a session which changes something is the first of a series nobody controls."
 SAU_events.202.t: "The National Dialogue"
 SAU_events.203.a: "Take Washington's offer in full."
 SAU_events.203.b: "The Mabahith will handle its own."
 SAU_events.203.c: "Rehabilitate them. Prisons only make more."
 SAU_events.203.d: "The compounds at Al Hamra and Ishbiliya were bombed by men who grew up here, were schooled here, and were financed through charities registered here. Whatever the quarrel was assumed to be about, it is now demonstrably with the Kingdom itself.\n\nWashington is offering a liaison cell, watch-list integration and access to signals it has never shared with anyone in the region. Accepting means American officers reading Saudi files. Refusing means doing this alone, in a country where a great many people quietly agree with the bombers."
 SAU_events.203.t: "Counter-Terrorism Cooperation"
 SAU_events.204.a: "Half the seats, and men on the rolls."
 SAU_events.204.b: "Appoint them all and call it consultation."
 SAU_events.204.c: "Put women on the rolls as well."
 SAU_events.204.d: "Half the seats on the municipal councils, elected; the other half appointed; and the councils themselves with authority over drainage, street lighting and building permits. Nobody in the palace pretends this is a transfer of power.\n\nThe argument against it is not that the councils will do harm. It is that Saudis will have voted, and that a precedent, unlike a decree, cannot be quietly withdrawn the following year."
 SAU_events.204.t: "Hold Municipal Elections"
 SAU_events.205.a: "It was advisory to the last."
 SAU_events.205.d: "The Council was in session when the order arrived, and the order did not explain itself. The members were thanked for their service in a communique of four lines, the building was closed, and the files they had spent years being allowed to read went back into the ministries they came from.\n\nIt sat by the King's leave. There is no King, or there is no longer one of the House of Saud, and so there is no Council. Nobody in Riyadh expected it to survive the week and nobody has said so aloud."
 SAU_events.205.t: "The Council Is Dissolved"
 SAU_events.206.a: "Let it pass."
 SAU_events.206.b: "The Crown withholds assent."
 SAU_events.206.d: "The reformist bench has costed it themselves, which is new, and the costing is optimistic, which is not. Roads to the villages the trunk network skipped, water to districts that still buy it by the tanker, and a clause requiring the ministry to publish what it spends.\n\nIt is the last clause the ministry objects to."
 SAU_events.206.t: "The Reformists' Bill"
 SAU_events.207.a: "Let it pass."
 SAU_events.207.b: "The Crown withholds assent."
 SAU_events.207.d: "The traditionalist bench proposes what it has always proposed and has never before been able to put to a vote: the endowments funded properly, housing allowances raised, and a schedule of clinics for the provinces that have gone without one since the boom.\n\nThe finance ministry describes the arithmetic as aspirational. The bench replies that the arithmetic has been aspirational in the other direction for thirty years."
 SAU_events.207.t: "The Traditionalists' Bill"
 SAU_events.208.a: "Let it pass."
 SAU_events.208.b: "The Crown withholds assent."
 SAU_events.208.d: "The provincial members have combined, which nobody in Riyadh expected them to manage. Saudi hiring quotas with teeth in them, an end to the sponsorship arrangements that tie a worker to one employer, and an inspectorate that reports to the Council rather than to the ministry it inspects.\n\nEvery merchant house in Jeddah has written to the palace this week. The bench knows, and has scheduled the vote anyway."
 SAU_events.208.t: "The Provincials' Bill"
 SAU_events.209.a: "Thirty seats, by royal decree."
 SAU_events.209.b: "The chamber remains as it is."
 SAU_events.209.d: "Thirty seats, guaranteed by decree so that no future king can quietly let the number lapse - a fifth of the chamber. They would enter by a separate door and sit in a separate section, and the photographs would travel a great deal further than the seating plan.\n\nForty-odd senior scholars have signed a letter. The letter does not threaten anything, because it does not need to."
 SAU_events.209.t: "Women in the Shura Council"
 SAU_events.21.a: "Watch developments closely."
 SAU_events.21.d: "A previously unknown movement calling itself [ROOT.SAU_GetFrontName] has announced its existence across the West Bank and within Israel's own borders. In coordinated statements it vows armed resistance until liberation, claiming a wave of recent attacks as its own. Intelligence services scramble to trace its origins, its funding, and its reach."
 SAU_events.21.t: "A New Front Rises in the Holy Land"
 SAU_events.210.a: "The Gulf does not lose a monarchy."
 SAU_events.210.d: "MANAMA - Saudi armour crossed the King Fahd Causeway before dawn and reached the capital without firing. Riyadh describes the deployment as a Peninsula Shield operation undertaken at the request of the legitimate government of Bahrain, and declines to elaborate on which government made the request.\n\nTehran has called it an occupation. Washington has asked for restraint on all sides and has not asked anybody to leave. The House of Khalifa is back in the palace, and the arrangement that put it there is now a matter of public record rather than private understanding."
 SAU_events.210.t: "The Causeway"
 SAU_events.211.a: "Pump. The fields are the strategy."
 SAU_events.211.b: "Build the industry that outlives the wells."
 SAU_events.211.c: "Survey. There is more of it out there."
 SAU_events.211.d: "Abqaiq processes the greater part of the Kingdom's crude in one facility and Ras Tanura loads it in another. Two successful strikes would do more damage to the world economy than any army in the region could manage in a year, and the ministry has finally been asked to say out loud what it intends to do about that.\n\nThere is money for one answer, not three. Pump harder while the fields are secure; build the industry that would survive losing them; or stop assuming the fields the Kingdom already has are all the fields there are."
 SAU_events.211.t: "The Oil Defense Strategy"
 SAU_events.212.a: "Let the bench reach upward."
 SAU_events.212.d: "The law was always adequate. What was missing was any bench willing to apply it upward - a court that could summon a minister, a commission that could open a prince's accounts, and a judge who would still have a career afterwards.\n\nIt will work exactly as well as the King's patience with it, and everyone who might be summoned knows that. The money already stops moving the week the courts are announced."
 SAU_events.212.t: "The Corruption Courts"
 SAU_events.213.a: "Nobody is above the file."
 SAU_events.213.d: "Some two hundred princes, ministers and businessmen are held in the country's most expensive hotel for months. A hundred billion dollars is said to be recovered. No charges are published, no verdicts are handed down, and the releases are negotiated one at a time.\n\nIt is described as an anti-corruption campaign. It functions as the moment the family stopped being a collective and started being an audience, and every investor on earth watched it happen."
 SAU_events.213.t: "The Ritz-Carlton"
 SAU_events.214.a: "Settle it quietly. It always was going to be."
 SAU_events.214.d: "The releases are negotiated one at a time and the terms are never published: a company signed over here, a foundation dissolved there, a son's position quietly guaranteed. Everyone involved understands these are not legal instruments but political ones.\n\nThe money comes back into the country almost at once, because the men returning it now have a reason to keep it where it can be watched. The file on each of them stays open in a drawer in Riyadh."
 SAU_events.214.t: "Backdoor Deals"
 SAU_events.215.a: "The family will have to find something else to argue about."
 SAU_events.215.d: "The princes were still counting each other's support when the officers stopped counting anything at all. There is no heir to name, because there is no throne to inherit - the Council has taken the question off the table and does not intend to put it back.\n\nThe men who spent the last years assembling their factions have discovered that a faction is only worth what the institution behind it is worth, and that the institution behind all of them was the monarchy."
 SAU_events.215.t: "The Succession Is Closed"
 SAU_events.216.a: "Let them preach it openly."
 SAU_events.216.b: "Keep it to the messes."
 SAU_events.216.c: "Tell them the Kingdom has one King at a time."
 SAU_events.216.d: "Mutaib's people have put the same question to the Diwan for the third time this year, and this time they have not bothered to phrase it as a question. The Kingdom calls itself the guardian of the two mosques and behaves like a client. Faisal did not. That is the whole of the argument and it does not get more complicated on examination.\n\nThe succession is unsettled, which means everything said now is said in front of men who are choosing sides."
 SAU_events.216.t: "The Circle Asks Again"
 SAU_events.217.a: "The Kingdom continues."
 SAU_events.217.d: "Riyadh has announced the death of King Fahd bin Abdulaziz Al Saud, who held the throne for twenty-three years and, since the stroke of 1995, held very little of the work that came with it. The Kingdom he leaves was governed in his name and in his brother's hand for a decade, and the transition announced this morning changes the title on the documents rather than the man signing them.\n\nCrown Prince Abdullah accedes. He is already past eighty. The men who matter are not looking at him - they are looking past him, at who is named next."
 SAU_events.217.t: "The Death of King Fahd"
 SAU_events.218.a: "The succession is the story now."
 SAU_events.218.d: "King Abdullah bin Abdulaziz Al Saud is dead, and with him goes the last of the brothers who could claim the throne on seniority alone without anyone asking a second question. He was buried in an unmarked grave in al-Oud, as the rite requires and as every king before him has been.\n\nSalman accedes within hours. What follows is the part the Kingdom has been deferring for thirty years: the crown must eventually pass to a generation that has no automatic claim to it, and every prince now alive knows it."
 SAU_events.218.t: "The Death of King Abdullah"
 SAU_events.219.a: "Long live the King."
 SAU_events.219.d: "The King is dead. Riyadh has released the announcement with the economy of language it reserves for the throne, and the Crown Prince has already received the bay'ah from the senior princes, the ulema, and the men who command the Guard.\n\nThe reign that ends today began with an old man and a Kingdom that still ran on the understanding that the crown moved sideways between brothers. It ends with that understanding gone, dismantled by the King himself, in favour of a succession the world has been invited to consider settled."
 SAU_events.219.t: "The Death of King Salman"
 SAU_events.22.a: "Let the oil flow south."
 SAU_events.22.b: "Our land is not a Saudi highway."
 SAU_events.22.d: "The Saudis ask to run a pipeline through our southern provinces to the Arabian Sea. The transit fees would fill our treasury, and Riyadh would owe us a favor it cannot easily repay."
 SAU_events.22.t: "A Pipeline to the Sea"
 SAU_events.24.a: "Build the pipeline."
 SAU_events.24.b: "Decline the offer."
 SAU_events.24.d: "Saudi Arabia offers to run its oil through our land toward Turkey and Europe. Iraq would become the bridge between the Gulf and the West, and the transit revenue would rebuild the nation."
 SAU_events.24.t: "The Pipeline to Europe"
 SAU_events.25.a: "Send them home empty-handed."
 SAU_events.25.d: "The House of Saud sends envoys proposing a pipeline through our soil. They forget who rules here. Iraq bows to no one, least of all to Riyadh."
 SAU_events.25.t: "A Saudi Envoy in Baghdad"
 SAU_events.26.a: "Excellent."
 SAU_events.26.d: "Welders lay the final section and the valves are thrown open. Saudi crude now flows along a new artery to the sea, and the Kingdom's grip on the world's energy tightens."
 SAU_events.26.t: "The Oil Flows"
 SAU_events.27.a: "We will find another way."
 SAU_events.27.d: "The deal has fallen through. For now, this route to the sea remains beyond our reach, and Hormuz remains our only door."
 SAU_events.27.t: "The Route Is Closed"
 SAU_events.28.a: "A costly setback."
 SAU_events.28.d: "War has reached the pipeline. Saboteurs have blown a section to ruin and the oil has stopped flowing. Until southern Yemen is secured, the Arabian Sea route is lost."
 SAU_events.28.t: "The Pipeline Is Severed"
 SAU_events.29.a: "Open the route."
 SAU_events.29.b: "Decline the Saudis."
 SAU_events.29.d: "Riyadh asks to run a pipeline through our kingdom toward the Mediterranean. The transit fees alone would steady our finances, and the Saudis are generous friends."
 SAU_events.29.t: "A Pipeline Across Jordan"
 SAU_events.3.a: "Accept the Saudi offer."
 SAU_events.3.b: "Decline the Saudi offer."
 SAU_events.3.d: "Riyadh offers Chinese companies access to Saudi agricultural and energy projects. Accepting would deepen economic ties between China and the Kingdom."
 SAU_events.3.t: "[SAU.GetFlag] Saudi-China Deal [CHI.GetFlag]"
 SAU_events.30.a: "Welcome the pipeline."
 SAU_events.30.b: "Syria is not for sale."
 SAU_events.30.d: "With Jordan agreed, the Saudis propose carrying their oil through our land to the sea. A free and prosperous Syria would profit handsomely, and Riyadh's friendship is worth having."
 SAU_events.30.t: "An Offer from Riyadh"
 SAU_events.300.a: "Independent technocrats."
 SAU_events.300.b: "Royal oversight is essential."
 SAU_events.300.c: "Bring in foreign experts."
 SAU_events.300.d: "The §LCapital Market Law§! is signed. Now we must decide: who shall sit at the head of the new §LCapital Market Authority§!? The technocrats demand independence; the §HRoyal Court§! demands oversight; foreign advisors offer their experience. The choice will define the kingdom's financial architecture for a generation."
 SAU_events.300.t: "§HRoyal Decree M/30 - Implementation§!"
 SAU_events.301.a: "The Anglo-Saxon framework."
 SAU_events.301.b: "以伊斯兰教法为先的框架。"
 SAU_events.301.c: "A hybrid model."
 SAU_events.301.d: "Formal incorporation reshapes the corporate landscape. Joint-Stock Companies, Limited Liability Companies - the §LKingdom§! must choose its model. The §LAnglo-Saxon§! framework offers efficiency at the cost of foreign influence; the §LSharia-first§! framework offers legitimacy at the cost of speed; the §Lhybrid§! takes a measured middle path."
 SAU_events.301.t: "§HThe 2007 Legal Reforms§!"
