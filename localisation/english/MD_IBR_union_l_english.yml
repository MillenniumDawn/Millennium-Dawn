l_english:
 # Tree
 IBR_dream_shortcut: "The Dream of Iberia"

 IBR_dream_of_iberia: "Dream of Iberia"
 IBR_dream_of_iberia_desc: "Apart from sixty years under one crown, Spain and Portugal have divided the peninsula for five centuries, sharing a border, a history and a quiet suspicion of each other. Now one government holds all of it and takes the name of Iberia. A name does not make one people, and Catalans, Basques, Galicians and Portuguese will judge the union by what it does for them."
 IBR_dream_of_iberia_tt: "Every union state receives a §Ysectarianism§! score from §Y0%§! to §Y100%§!, set by the strength of its regional identity. The states of the nation that was absorbed start §R20%§! higher. If Spain leads the union, §Y[86.GetName]§!, §Y[88.GetName]§!, §Y[944.GetName]§! and §Y[93.GetName]§! also start §R0.5%§! higher for each point of Spain's cultural opinion of them below §Y50§!, and §G0.5%§! lower for each point above it.\nEach week every state's sectarianism changes by the union's §YSectarian growth§! plus the state's own. Below §Y40%§! stability the union's growth cannot lower it. A state we do not fully control grows another §R0.5%§! a week.\nA state that reaches §R100%§! declares independence once if it has a nation to break away as, and otherwise falls into unrest."
 IBR_union_cores_tt: "Gains cores on every Spanish and Portuguese state we own."
 IBR_division_stability_tt: "£stability_texticon  Stability: §R-2%§! to §R-12%§! by average sectarianism"
 IBR_common_curriculum: "A Common Curriculum"
 IBR_common_curriculum_desc: "Spanish and Portuguese pupils will learn each other's language, history and literature from primary school, with the regional languages taught beside them. A generation raised on the same books will argue less about whose books they are."
 IBR_common_curriculum_tt: "§YIberian Language Classes§! can be funded up to the third tier."
 IBR_iberian_broadcasting: "Iberian Broadcasting Union"
 IBR_iberian_broadcasting_desc: "RTVE and RTP will merge their newsrooms into one public broadcaster, reporting in Spanish, Portuguese, Catalan, Basque and Galician. For the first time the evening news in Porto and Seville will lead with the same story."
 IBR_madrid_lisbon_high_speed: "Madrid-Lisbon High-Speed Line"
 IBR_madrid_lisbon_high_speed_desc: "The two capitals have been an overnight train apart for a century. Once we have built a high-speed line through Extremadura and the Alentejo, they will be three hours apart, and the towns along it will see more of the union than any speech."
 IBR_charter_of_the_nations: "Charter of the Historic Nationalities"
 IBR_charter_of_the_nations_desc: "The union will not be built by pretending that Catalonia, the Basque Country and Galicia are provinces like any other. A charter will guarantee their languages, their parliaments and their fiscal arrangements inside the new state."
 IBR_capital_lisbon: "A Capital in Lisbon"
 IBR_capital_lisbon_desc: "Placing the seat of government on the Tagus would tell the Portuguese that the union is not Spain under another name. Castile, which has held the court since Philip II, will take it badly."
 IBR_capital_madrid: "A Capital in Madrid"
 IBR_capital_madrid_desc: "Madrid has been the seat of Spanish government since 1561, and its ministries are ready to run the whole peninsula. Keeping the capital there reassures every Spanish region, but reminds the Portuguese of the sixty years they were ruled from it."
 IBR_single_market: "One Iberian Market"
 IBR_single_market_desc: "Tax regimes, energy grids and professional licences still stop at the old border. Harmonising them turns two mid-sized economies into one large one and gives every region a stake in the union's prosperity."
 IBR_common_citizenship: "Common Iberian Citizenship"
 IBR_common_citizenship_desc: "A single passport, a single civil register and the right to vote wherever one lives. Being Iberian stops being an idea and becomes a legal fact."
 IBR_proclaim_the_iberian_union: "[GetIBRProclaimTitle]"
 IBR_proclaim_title_democratic: "Proclaim the Iberian Union"
 IBR_proclaim_title_communism: "Proclaim the Iberian Socialist Union"
 IBR_proclaim_title_neutrality: "Proclaim the Iberian Confederation"
 IBR_proclaim_title_nationalist: "Proclaim the Iberian State"
 IBR_proclaim_title_fascism: "Proclaim the Iberian Emirate"
 IBR_proclaim_the_iberian_union_desc: "The regions have been heard, the institutions are shared and no part of the peninsula wants to leave. What remains is to say it aloud: one union, many nations, one Iberia."
 IBR_project_ends_tt: "Removes §YA Divided Peninsula§!. Regional sectarianism ends, and the regional map and its decisions close."

 # Sectarianism changes, shown like modifier lines
 IBR_sectarian_growth: "£IBR_sectarianism_texticon  Sectarian growth"
 IBR_sectarian_growth_change_tt: "$IBR_sectarian_growth$: $RIGHT|-=%%2$"
 IBR_sectarianism_all_change_tt: "£IBR_sectarianism_texticon  Sectarianism in every union state: $RIGHT|-=%%0$"
 IBR_sectarianism_portugal_change_tt: "£IBR_sectarianism_texticon  Sectarianism in every Portuguese union state: $RIGHT|-=%%0$"
 IBR_sectarianism_spain_change_tt: "£IBR_sectarianism_texticon  Sectarianism in every Spanish union state: $RIGHT|-=%%0$"
 IBR_sectarianism_charter_change_tt: "£IBR_sectarianism_texticon  Sectarianism in [86.GetName], [88.GetName], [1041.GetName], [944.GetName], [94.GetName] and [92.GetName]: $RIGHT|-=%%0$"
 IBR_sectarianism_castile_change_tt: "£IBR_sectarianism_texticon  Sectarianism in [91.GetName], [90.GetName] and [970.GetName]: $RIGHT|-=%%0$"
 IBR_sectarianism_rail_change_tt: "£IBR_sectarianism_texticon  Sectarianism in [91.GetName], [968.GetName], [1056.GetName] and [96.GetName]: $RIGHT|-=%%0$"
 IBR_selected_sectarianism_change_tt: "£IBR_sectarianism_texticon  Sectarianism in [?ROOT.IBR_selected_state.GetName]: $RIGHT|-=%%0$"
 IBR_selected_growth_change_tt: "£IBR_sectarianism_texticon  Sectarian growth in [?ROOT.IBR_selected_state.GetName]: $RIGHT|-=%%2$"

 # Requirements
 IBR_controls_iberia_tt: "Owns and fully controls all §Y22§! states of mainland Spain, the Balearic Islands and mainland Portugal"
 IBR_controls_union_states_tt: "Owns and fully controls every state still in the union project"
 IBR_sectarianism_resolved_tt: "Sectarianism is §Y0%§! in every state of the union project"
 IBR_not_usoe_tt: "Is not the §YUnited States of Europe§!"
 IBR_formables_enabled_tt: "The §YFormable Nations§! game rule is enabled"

 # Decisions
 IBR_dream_category: "The Dream of an Iberian Union"
 IBR_dream_category_desc: "Select a state on the map to see its sectarianism and sectarian growth, then act on it.\n§YIntegration§! raises a state's sectarianism now but lowers its sectarian growth. §YConcessions§! lower it now but raise its growth. A state's own growth stays between §Y-1%§! and §Y+1%§! a week, on top of the union's.\n§YIberian Language Classes§! lower the union's sectarian growth, but nothing lowers it below §Y0%§! while our stability is under §Y40%§!.\nThe union can be proclaimed once sectarianism is §Y0%§! in every state. A state that reaches §R100%§! declares independence if it has a nation to break away as, and otherwise falls into unrest."
 IBR_raise_language_funding: "Expand the Iberian Language Classes"
 IBR_raise_language_funding_desc: "Fund another tier of school and evening classes in Spanish, Portuguese and the regional languages."
 IBR_language_funding_curriculum_tt: "Language classes are not yet funded, or we have completed §YA Common Curriculum§!"
 IBR_cut_language_funding: "Cut the Iberian Language Classes"
 IBR_cut_language_funding_desc: "Scale the classes back by one tier to save money."
 IBR_iberian_civic_service: "Iberian Civic Service in [?ROOT.IBR_selected_state.GetName]"
 IBR_iberian_civic_service_desc: "Send young volunteers from across the peninsula to serve a year in [?ROOT.IBR_selected_state.GetName]. The locals resent the intrusion at first, but the friendships outlast the grievance."
 IBR_civic_service_ready_tt: "The selected state has had no civic service programme in the last §Y60§! days"
 IBR_centralised_schooling: "Centralised Schooling in [?ROOT.IBR_selected_state.GetName]"
 IBR_centralised_schooling_desc: "Put the schools of [?ROOT.IBR_selected_state.GetName] under the union's education ministry and its common syllabus. The regional teachers' unions will strike, then adapt."
 IBR_centralised_schooling_ready_tt: "The selected state's schooling has not been centralised in the last §Y90§! days"
 IBR_regional_subsidies: "Regional Subsidies for [?ROOT.IBR_selected_state.GetName]"
 IBR_regional_subsidies_desc: "Pay for roads, clinics and cultural centres in [?ROOT.IBR_selected_state.GetName]. The money buys calm today and teaches the region that complaint pays."
 IBR_regional_subsidies_ready_tt: "The selected state has not received subsidies in the last §Y60§! days"
 IBR_autonomy_statute: "Autonomy Statute for [?ROOT.IBR_selected_state.GetName]"
 IBR_autonomy_statute_desc: "Grant [?ROOT.IBR_selected_state.GetName] its own parliament, police and tax powers. The statute defuses the crisis of the day and hands the separatists an institution to build on."
 IBR_autonomy_statute_ready_tt: "The selected state has not been granted an autonomy statute in the last §Y120§! days"
 IBR_selected_state_in_union_tt: "The selected state is part of the union project, and we own and fully control it"
 IBR_selected_state_sectarian_tt: "The selected state's sectarianism is above §Y0%§!"
 IBR_selected_drift_above_min_tt: "The selected state's own sectarian growth is above §Y-1%§!"
 IBR_selected_drift_below_max_tt: "The selected state's own sectarian growth is below §Y+1%§!"

 # Ideas and modifiers
 IBR_divided_peninsula: "A Divided Peninsula"
 IBR_divided_peninsula_desc: "The union holds the whole peninsula, but many of its people still think of themselves first as Catalan, Basque, Galician or Portuguese. The stability penalty eases as average sectarianism in the union states falls, and the whole modifier ends when we complete the §Y$IBR_proclaim_the_iberian_union$§! focus."
 IBR_regional_unrest: "Regional Unrest"
 IBR_regional_unrest_desc: "A union state has reached §R100%§! sectarianism with no independence left to declare. Strikes, blockades and boycotts will continue until its sectarianism falls below §Y100%§!."
 IBR_language_classes: "Iberian Language Classes"
 IBR_language_classes_desc: "Classes in Spanish, Portuguese and the regional languages, paid for by the union at a weekly cost that grows with our economy. While our stability is below §Y40%§! they cannot bring the union's sectarian growth below §Y0%§!."
 IBR_single_market_idea: "One Iberian Market"
 IBR_single_market_idea_desc: "Harmonised taxes, licences and energy grids have opened every region's market to the rest of the peninsula."
 IBR_national_unity: "National Unity"
 IBR_national_unity_desc: "For the first time since 1640 the peninsula answers to a single government, and this time its peoples chose it."

 # Events
 iberian_union.1.t: "[?ROOT.IBR_seceding_state.GetName] Declares Independence"
 iberian_union.1.d: "The regional parliament of [?ROOT.IBR_seceding_state.GetName] has voted to leave the union and proclaim [?ROOT.IBR_seceding_tag.GetName]. Crowds fill the squares, the regional police have sided with the parliament, and the rest of the peninsula is waiting to see how we answer."
 iberian_union.1.a: "Let them go"
 iberian_union.1.b: "The union will not be broken"
 IBR_secession_accept_tt: "§Y[?ROOT.IBR_seceding_state.GetName]§! leaves the union as §Y[?ROOT.IBR_seceding_tag.GetName]§! and no longer counts toward the union project."
 IBR_secession_war_tt: "§Y[?ROOT.IBR_seceding_state.GetName]§! breaks away as §Y[?ROOT.IBR_seceding_tag.GetName]§!, and we §Rdeclare war§! on it to take the state back. The union cannot be proclaimed until we hold the state again. Retaken, it returns at §R60%§! sectarianism. If the war ends without it, it leaves the union for good."
 iberian_union.2.t: "The Iberian Union Is Proclaimed"
 iberian_union.2.d: "[FROM.GetName] has proclaimed the Iberian Union. Years of shared schooling, broadcasting and citizenship have done what dynastic marriages and invasions never could, and the peninsula now speaks with one voice in Europe and beyond."
 iberian_union.2.a: "One peninsula, many nations"
 iberian_union.2.b: "The map of Europe has changed"

