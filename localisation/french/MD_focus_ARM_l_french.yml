 ARM_army_category: "[ARM.GetFlag] Armée arménienne"
 ARM_army_category_desc: "£text_icon_armarmy L'armée de la [ARM.GetFlag]§YRépublique d'Arménie§! existe depuis une dizaine d'années, et durant cette période elle a traversé toute la §Rguerre pour l'indépendance§! du §Y[NKR.GetFlag]Artsakh§! dans le combat contre l'§Y[AZE.GetFlag]Azerbaïdjan§!.\n\nMais nous devons nous rappeler que [ARM.GetFlag]§Ynotre État§! affronte inévitablement le risque d'une répétition de ces événements, et nous devons être §Gpréparés§!, tout comme £text_icon_armarmy notre armée."
