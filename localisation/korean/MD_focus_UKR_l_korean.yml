 ukr_economy_rate.2.d: "우크라이나 국립은행이 물가 상승세 둔화와 흐리우냐 안정을 이유로 기준금리를 인하했습니다. 상업은행들도 더 저렴한 대출 한도를 내놓을 것으로 예상되며, 1998년 이후 우크라이나를 포기했던 해외 자금이 조용히 시장으로 돌아오고 있습니다. 10년 동안 운전 자본에 굶주려 온 산업계는 마침내 이윤 전체를 잡아먹지 않는 금리로 자금을 빌릴 수 있을지도 모릅니다."
 ukr_economy_rate.2.a: "더욱 저렴해진 자금"
 ukr_economy_rate.3.t: "우크라이나 국립은행 기준금리를 3% 인하하다"
 ukr_economy_rate.3.d: "우크라이나 국립은행이 물가 상승세 둔화와 흐리우냐 안정을 이유로 기준금리를 인하했습니다. 상업은행들도 더 저렴한 대출 한도를 내놓을 것으로 예상되며, 1998년 이후 우크라이나를 포기했던 해외 자금이 조용히 시장으로 돌아오고 있습니다. 10년 동안 운전 자본에 굶주려 온 산업계는 마침내 이윤 전체를 잡아먹지 않는 금리로 자금을 빌릴 수 있을지도 모릅니다."
 ukr_economy_rate.4.t: "우크라이나 국립은행 기준금리를 4% 인하하다"
 ukr_economy_rate.4.d: "우크라이나 국립은행이 물가 상승세 둔화와 흐리우냐 안정을 이유로 기준금리를 인하했습니다. 상업은행들도 더 저렴한 대출 한도를 내놓을 것으로 예상되며, 1998년 이후 우크라이나를 포기했던 해외 자금이 조용히 시장으로 돌아오고 있습니다. 10년 동안 운전 자본에 굶주려 온 산업계는 마침내 이윤 전체를 잡아먹지 않는 금리로 자금을 빌릴 수 있을지도 모릅니다."
 ukr_economy_rate.5.t: "우크라이나 국립은행 기준금리를 29%로 인하하다"
 ukr_economy_rate.5.d: "2월 이후 우크라이나 국립은행은 물가 상승세가 둔화되고 흐리우냐가 안정세를 유지함에 따라 기준금리를 45%에서 29%로 세 차례 인하했습니다. 상업은행들도 더 저렴한 대출 한도를 내놓고 있으며, 1998년 이후 우크라이나를 포기했던 해외 자금이 조용히 시장으로 돌아오고 있습니다."
 ukr_economy_rate.5.a: "드디어 싸진 자금"
 UKR_soviet_oob_tt: "우리 모든 부대는 소련 시대의 중대, 분대, 파견대를 기준으로 편성되어 있습니다. 전반적으로 필요한 장비는 적지만, 전투 능력도 그만큼 낮습니다."
