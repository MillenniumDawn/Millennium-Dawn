 UKR_spaa_light_autocannon1: "2A10"
 UKR_spaa_light_autocannon2: "2A38"
 twin_mortar_barrel_conversion: "자동 쌍열 박격포 포신"
 twin_mortar_barrel_conversion_desc: "쌍열 박격포 포신은 포병 부대의 발사 속도를 크게 높일 수 있습니다. 컴퓨터와 첨단 표적 지정 장치를 갖추면 박격포는 여러 발이 동시에 착탄하도록 할 수 있습니다."
 event_horizon_walker_tank_module_xciws2b: "XCIWS-2B 근접 방어 무기 체계"
 event_horizon_walker_tank_module_xciws2b_desc: ""
 UKR_tank_diesel_engine_gen8: "KMDB 6TD-5, 1900마력"
 UKR_tank_diesel_engine_gen8_desc: "KMDB 6TD-5는 우크라이나가 제안한 전차 엔진으로, 6TD-4 엔진의 회전수를 높인 개조형입니다.\n\n§G설계 힌트: 다연료 디젤 엔진은 전차에 사용되는 표준 엔진입니다.§!"
 UKR_tank_battlestation_2_thermal_desc: "1A45 이르티시는 주력 전차를 위해 개발된 소련의 사격 통제 체계(FCS)입니다. 1G46 포수용 주간 조준경/거리 측정기, 탄도 계산기, 무기 안정화 장치, 입력 데이터(사격 조건)용 센서로 구성됩니다."
 UKR_spaa_missiles_2: "RK-2P"
 EQ_MOD_CAT_spaa_medium_range_missile_systems_TITLE: "§R대공포§!\n중거리 미사일"
 spaa_medium_range_missiles_1: "2차 세계 대전 이후 중거리 미사일"
 spaa_medium_range_missiles_1_desc: "1세대 유도 중거리 미사일은 먼 거리에서도 신뢰할 만한 요격을 제공하며, 사거리, 정확도, 파괴력 사이의 균형을 갖추고 있습니다."
 spaa_medium_range_missiles_2: "냉전기 중거리 미사일"
 spaa_medium_range_missiles_2_desc: "개선된 추진 및 유도 체계로 교전 사거리와 정확도가 늘어나, 이 미사일들은 더 빠르고 기동성이 뛰어난 공중 표적에도 효과적으로 대응할 수 있습니다."
 spaa_medium_range_missiles_3: "현대 중거리 미사일"
 spaa_medium_range_missiles_3_desc: "개선된 탐색기, 유도 체계, 탄두로 항공기, 순항 미사일 등 까다로운 공중 표적에 대해 더욱 신뢰할 만한 교전이 가능합니다."
 spaa_medium_range_missiles_4: "첨단 중거리 미사일"
 spaa_medium_range_missiles_4_desc: "첨단 추진 장치, 탐색기, 전자 체계가 사거리, 정확도, 대응 수단에 대한 저항력을 크게 향상시켜 이 미사일들을 현대의 위협에 매우 효과적으로 만듭니다."
 spaa_medium_range_missiles_5: "최첨단 중거리 미사일"
 spaa_medium_range_missiles_5_desc: "차세대 유도 및 추진 기술이 탁월한 속도, 사거리, 정밀도를 제공하여 이 미사일들은 고성능 공중 위협과도 확실하게 교전할 수 있습니다."
 spaa_medium_range_missiles_6: "초첨단 중거리 미사일"
 spaa_medium_range_missiles_6_desc: "고도로 발전한 탐색기, 추진 장치, 유도 체계가 중거리 미사일 기술을 전례 없는 수준의 속도, 정확도, 교전 능력으로 끌어올립니다."
 spaa_medium_range_missiles_7: "1세대 극초첨단 중거리 미사일"
 spaa_medium_range_missiles_7_desc: "혁신적인 유도, 추진, 탐색기 기술이 탁월한 교전 성능을 제공하여, 이 미사일들은 갈수록 정교해지는 공중 위협을 격파할 수 있습니다."
 spaa_medium_range_missiles_8: "2세대 극초첨단 중거리 미사일"
 spaa_medium_range_missiles_8_desc: "추진 장치, 전자전 저항력, 종말 유도 기술의 추가적인 발전이 가장 진보한 공중 표적에 대해서도 뛰어난 속도, 정밀도, 신뢰성을 제공합니다."
 spaa_medium_range_missiles_9: "3세대 극초첨단 중거리 미사일"
 spaa_medium_range_missiles_9_desc: "중거리 미사일 개발의 정점을 대표하는 이 무기들은 극한의 속도, 첨단 탐색기, 우수한 유도 체계, 그리고 대응 수단에 대한 탁월한 저항력을 겸비하고 있습니다."
 UKR_hardkill_system_gen2: "S.O.V.A-2.0"
 UKR_hardkill_system_gen2_desc: "S.O.V.A-2.0은 날아오는 대전차 위협으로부터 장갑 차량의 생존성을 높이기 위해 설계된 우크라이나의 첨단 능동 방어 체계입니다. 이전 S.O.V.A. 체계의 발전형으로서 개선된 탐지 및 반응 능력과 더 효과적인 요격체 배열을 결합하여, 여러 방향에서 접근하는 위협으로부터 차량을 보호할 수 있습니다.\n\n§G설계 힌트: 하드킬 체계는 전차의 장갑을 더 강하게 보강하는 좋은 방법입니다.§!"
 UKR_spaa_medium_range_missiles_1: "5V27"
 UKR_spaa_medium_range_missiles_2: "9M38/5V27D-M2"
 UKR_spaa_medium_range_missiles_3: "코랄"
 UKR_spaa_long_range_missiles_4: "킬첸"
 UKR_spaa_short_range_missiles_1_desc: "9M37은 9K35 스트렐라-10 계열을 위해 개발된 소련의 단거리 지대공 미사일로, 지상군에 저고도 항공기와 헬리콥터에 대한 기동 방공 능력을 제공합니다.\n\n§G설계 힌트: 단거리 미사일은 저공 표적에 대한 기본적인 방공을 제공합니다. 더 나은 미사일은 기동 대공 부대의 효율을 높여 줍니다.§!."
 UKR_spaa_short_range_missiles_2_desc: "9M33과 9M37M은 소련의 지대공 미사일입니다. 9M33은 오사 계열에서, 9M37M은 스트렐라-10 체계에서 사용됩니다. 두 미사일 모두 저고도 항공기와 헬리콥터를 요격하도록 설계되어 기동 부대에 공중 위협에 대한 단거리 방호를 제공합니다.\n\n§G설계 힌트: 단거리 미사일은 저공 표적에 대한 기본적인 방공을 제공합니다. 더 나은 미사일은 기동 대공 부대의 효율을 높여 줍니다.§!."
 UKR_spaa_short_range_missiles_3_desc: "T382는 개량형 오사-AKM 방공 체계를 위해 개발된 우크라이나의 단거리 지대공 미사일입니다. 이 미사일은 현대화된 유도 및 제어 체계를 갖추어 노후화된 플랫폼의 효율을 높였습니다.\n\n§G설계 힌트: 단거리 미사일은 저공 표적에 대한 기본적인 방공을 제공합니다. 더 나은 미사일은 기동 대공 부대의 효율을 높여 줍니다.§!."
 UKR_spaa_missiles_2_desc: "RK-2P는 루치 설계국이 개발한 우크라이나의 대전차 유도 미사일입니다. 다양한 전투 플랫폼에서 사용할 수 있도록 개조되었으며, 차량의 주무장과 함께 추가적인 유도 대장갑 능력을 제공합니다.\n\n§G설계 힌트: 유도 미사일은 장갑 지상 표적에 대한 추가 화력을 제공하며 전투 차량의 다목적성을 크게 높일 수 있습니다.§!."
 UKR_spaa_missiles_3_desc: "RK-10은 루치 설계국이 개발한 우크라이나의 다목적 유도 미사일입니다. 모듈식 설계로 다양한 전투 플랫폼에 통합할 수 있으며, 장갑 표적 및 기타 지상 표적에 대한 능력이 향상되었습니다.\n\n§G설계 힌트: 유도 미사일은 장갑 지상 표적에 대한 추가 화력을 제공하며 전투 차량의 다목적성을 크게 높일 수 있습니다.§!."
 UKR_spaa_medium_range_missiles_1_desc: "5V27은 S-125 방공 체계에서 사용하는 소련의 지대공 미사일입니다. 중거리, 저고도에서 중고도의 항공기를 요격하도록 설계되어, 단거리 기동 방공 체계보다 더 긴 교전 사거리를 제공합니다. 5V27은 S-125와 그 수많은 현대화 계획의 주요 미사일 무장이었습니다."
 UKR_spaa_medium_range_missiles_2_desc: "9M38은 부크 계열의 기동 방공 체계를 위해 개발되었으며, 5V27D-M2는 S-125 계열에서 사용하는 미사일을 우크라이나가 현대화한 것입니다. 개선된 유도 및 추진 체계로 이전 중거리 미사일보다 더 큰 효율을 제공합니다.\n\n§G설계 힌트: 중거리 미사일은 방어 범위와 비용 사이의 균형을 제공하므로 범용 방공에 적합합니다.§!."
 UKR_spaa_medium_range_missiles_3_desc: "코랄은 노후화된 소련 방공 체계를 대체하는 현대적 후속으로 개발된 우크라이나의 중거리 지대공 미사일 체계입니다. 이 계획은 우크라이나의 현대적인 미사일, 레이더, 유도 기술을 차세대 기동 방공 체계에 통합하였습니다.\n\n§G설계 힌트: 중거리 미사일은 방어 범위와 비용 사이의 균형을 제공하므로 범용 방공에 적합합니다.§!."
 UKR_spaa_long_range_missiles_1_desc: "3M8은 2K11 크루그 기동 방공 체계를 위해 개발되었습니다. 대형 미사일과 강력한 추진 장치 덕분에 이 체계는 소련 지상군과 중요 군 부대에 장거리 방호를 제공할 수 있었습니다.\n\n§G설계 힌트: 장거리 미사일은 훨씬 더 높은 비용으로 광범위한 방공 범위를 제공합니다. 중요 지역과 고가치 표적을 방호하기 위한 것입니다.§!."
 UKR_spaa_long_range_missiles_2_desc: "9M83은 S-300V 계열의 기동 방공 체계를 위해 개발된 미사일입니다. 지상군에 장거리 방호를 제공하고, 기존 전장 방공 체계의 사정권 밖에 있는 까다로운 공중 표적을 요격하도록 설계되었습니다.\n\n§G설계 힌트: 장거리 미사일은 훨씬 더 높은 비용으로 광범위한 방공 범위를 제공합니다. 중요 지역과 고가치 표적을 방호하기 위한 것입니다.§!."
 UKR_spaa_long_range_missiles_3_desc: "SD-300은 여러 자국 미사일 및 레이더 계획의 기술을 활용하여 개발된 우크라이나의 장거리 지대공 미사일 계획입니다. 이 계획은 우크라이나에 현대적인 자체 방공 능력을 부여하기 위한 것이었습니다.\n\n§G설계 힌트: 장거리 미사일은 훨씬 더 높은 비용으로 광범위한 방공 범위를 제공합니다. 중요 지역과 고가치 표적을 방호하기 위한 것입니다.§!."
 UKR_spaa_long_range_missiles_4_desc: "킬첸은 남부 설계국이 차세대 체계로 개발한 우크라이나의 장거리 방공 계획입니다. 이 계획은 현대적인 미사일, 레이더 장비, 네트워크화된 지휘 능력을 중심으로 설계되어 첨단 국가 방공 체계를 구축하고자 하였습니다.\n\n§G설계 힌트: 장거리 미사일은 훨씬 더 높은 비용으로 광범위한 방공 범위를 제공합니다. 중요 지역과 고가치 표적을 방호하기 위한 것입니다.§!."
 UKR_spaa_autocannon_1_desc: "2A10은 초기 세대 자주 대공 차량에 사용된 소련의 자동포입니다. 높은 발사 속도로 저공 비행 항공기와 경장갑 표적에 대한 기본적인 대응 능력을 제공합니다.\n\n§G설계 힌트: 기관포는 저렴한 근거리 방공을 제공합니다. 개량된 무기는 대공 사격의 양과 효율을 높여 줍니다.§!."
 UKR_spaa_autocannon_2_desc: "2A10M은 소련 2A10의 개량형이며, 오리콘 KDA는 서방 방공 체계에서 널리 채택된 스위스 설계의 35mm 자동포입니다. 두 무기 모두 향상된 화력과 현대 대공 사격 통제 체계와의 더 나은 통합을 제공합니다.\n\n§G설계 힌트: 기관포는 저렴한 근거리 방공을 제공합니다. 개량된 무기는 대공 사격의 양과 효율을 높여 줍니다.§!."
 UKR_spaa_autocannon_3_desc: "오리콘 리볼버 건 Mk3은 대량의 대공 사격을 위해 설계된 현대적인 리볼버식 자동포입니다. 첨단 장전 기구와 높은 발사 속도 덕분에 현대의 자주 대공포가 빠르게 움직이는 공중 표적을 더 효과적으로 요격할 수 있습니다.\n\n§G설계 힌트: 기관포는 저렴한 근거리 방공을 제공합니다. 개량된 무기는 대공 사격의 양과 효율을 높여 줍니다.§!."
 UKR_spaa_light_autocannon1_desc: "2A10은 여러 초기 대공 차량의 주무장으로 사용된 소련의 자동포입니다. 높은 발사 속도로 경량 기동 플랫폼에 저공 비행 항공기와 경장갑 표적에 대한 기본적인 방호를 제공합니다.\n\n§G설계 힌트: 경기관포는 경방호 차량에 근거리 방공을 제공합니다. 더 나은 무기는 저공 표적과 교전하는 능력을 향상시킵니다.§!."
 UKR_spaa_light_autocannon2_desc: "2A38은 2K22 퉁구스카를 위해 개발된 소련의 쌍열 자동포입니다. 두 개의 포신과 높은 발사 속도로 이전의 경기관포에 비해 근거리 대공 화력을 크게 높입니다.\n\n§G설계 힌트: 경기관포는 경방호 차량에 근거리 방공을 제공합니다. 더 나은 무기는 저공 표적과 교전하는 능력을 향상시킵니다.§!."
 UKR_spaa_radar_gen1: "1RL33"
 UKR_spaa_radar_gen1_desc: "1RL33은 ZSU-23-4 실카를 위해 개발된 RPK-2 토볼 사격 통제 복합체의 소련제 레이더 체계입니다. 이 레이더는 표적 탐색, 탐지, 추적 기능을 차량의 사격 통제 체계와 결합하여, 승무원이 육안 관측에만 의존하지 않고도 표적 정보를 얻을 수 있게 합니다."
 UKR_spaa_radar_gen2: "1RL33M/1RL144"
 UKR_spaa_radar_gen2_desc: "1RL33M은 ZSU-23-4 실카 대공 체계의 소련제 레이더 체계입니다. 이 레이더는 원래 1RL33의 개량형이며 차량 사격 통제 복합체의 일부로서 표적 탐지 및 추적을 제공합니다. 탑재 연산 장치 및 무기 유도 장비와 통합되어 있어, 승무원이 레이더로 얻은 표적 지정 정보를 이용해 공중 표적과 교전할 수 있습니다.\n\n1RL144는 2K22 퉁구스카 대공 체계의 소련제 레이더 체계입니다. 이 레이더 일체는 감시 및 표적 추적 기능을 차량의 사격 통제 장비와 통합하였으며, 승무원과 탑재 유도 체계에 지속적인 표적 정보를 제공하도록 설계되었습니다."
 UKR_spaa_radar_gen3: "로카흐-AS"
 UKR_spaa_radar_gen3_desc: "로카흐-AS는 ZSU-23-4의 소련제 1RL33M 레이더를 대체하기 위해 개발된 디지털 안테나 배열 다기능 레이더입니다. 소형 레이더로서 전방위 감시, 표적 탐색, 자동 추적을 제공하며, 디지털 구조 덕분에 표적 처리 능력이 크게 향상되고 체계가 자율적으로 작동할 수 있습니다."
 UKR_spaa_off_vehicle_radar_gen1: "P-190U"
 UKR_spaa_off_vehicle_radar_gen1_desc: "P-190U는 에어로테흐니카-MlT가 개발한 소련 P-19 감시 레이더의 현대화형입니다. 이 현대화로 디지털 신호 처리, 향상된 간섭 저항력, 자동 표적 추적, 다른 체계와의 레이더 정보 디지털 교환 기능이 도입되었습니다. 이 레이더는 원래 P-19의 이동식 지상 배치 구성을 유지하면서도 탐지 및 데이터 처리 능력이 크게 향상되었습니다."
 UKR_spaa_off_vehicle_radar_gen2: "35D6M"
 UKR_spaa_off_vehicle_radar_gen2_desc: "35D6M은 우크라이나 이스크라 연구생산단지가 개발한 현대화된 3차원 감시 레이더입니다. 이 현대화로 새로운 안테나 체계, 갱신된 소프트웨어, 향상된 데이터 처리 능력이 도입되어 탐지 성능과 궤적 처리의 정확도가 높아졌습니다. 이 레이더 기지는 또한 현대적인 운용자 작업대와 개선된 지원 체계를 갖추었으며, 원래 35D6의 이동식 구성은 그대로 유지하였습니다."
 UKR_spaa_off_vehicle_radar_gen3: "79K6 펠리칸"
 UKR_spaa_off_vehicle_radar_gen3_desc: "79K6 펠리칸은 이스크라 연구생산단지가 개발한 우크라이나의 이동식 3차원 감시 레이더입니다. 이 레이더 기지는 디지털 위상배열 안테나와 다중 빔 송신기를 사용하여 자연 간섭과 조직적 간섭이 있는 환경에서도 공중 표적을 탐지하고 추적할 수 있습니다. 펠리칸은 방공 체계의 정보 연결 고리로서 자동화 지휘 체계와 지대공 미사일 부대에 표적 데이터를 제공합니다."
 UKR_spaa_off_vehicle_radar_gen4: "80K6KS1 피닉스-1"
 UKR_spaa_off_vehicle_radar_gen4_desc: "80K6KS1은 이스크라 연구생산단지가 79K6 펠리칸을 더욱 발전시켜 개발한 현대적인 우크라이나의 3차원 감시 레이더입니다. 이 레이더 기지는 현대적인 위상배열 기술과 디지털 신호 처리를 이용하여 공중 표적을 자동으로 탐지하고 추적합니다. 피닉스-1은 부크-M1 체계에 사용될 예정입니다."
 UKR_spaa_optical_guidance_gen2: "9S86"
 UKR_spaa_optical_guidance_gen2_desc: "9S86은 스트렐라-10 방공 체계에 장착된 소형 광학 유도 체계입니다. 이 장치는 사격 통제 계산에 필요한 표적 거리 정보를 제공함으로써 체계의 전자광학 유도 장비를 보완합니다."
 hardkill_system: "초기 하드킬 체계"
 hardkill_system_desc: "하드킬 체계는 전차에 장착되는 능동 방어 수단입니다. 이 체계는 날아오는 발사체를 탐지하고 자체 발사체로 요격합니다. 요격 발사체는 로켓, 미사일 또는 운동 에너지 발사체일 수 있습니다. 초기 하드킬 체계는 주로 성형 작약탄으로부터 전차를 보호합니다.\n\n§G설계 힌트: 하드킬 체계는 적 미사일에 대한 전차의 방어 능력을 강화하는 좋은 방법입니다. 또한 우리 기갑 부대가 적 전선을 더 효과적으로 돌파하게 해 줍니다.§!"
 SOV_hardkill_system: "드로즈드"
 SOV_hardkill_system_desc: "드로즈드는 소련에서 개발되었으며, 대전차 미사일과 RPG에 대한 전차 방호력을 높이기 위해 설계되었습니다. 1977년과 1978년에 A. G. 시푸노프의 KBP 설계국이 콤플렉스 1030M-01로 개발한 것으로, 세계 최초의 실용 능동 방어 체계로 간주됩니다."
 UKR_hardkill_system: "드로즈드"
 UKR_hardkill_system_desc: "드로즈드는 소련에서 개발되었으며, 대전차 미사일과 RPG에 대한 전차 방호력을 높이기 위해 설계되었습니다. 1977년과 1978년에 A. G. 시푸노프의 KBP 설계국이 콤플렉스 1030M-01로 개발한 것으로, 세계 최초의 실용 능동 방어 체계로 간주됩니다."
 UKR_nera_armor_gen1: "콤비나치야 Ya"
 UKR_nera_armor_gen1_desc: "'콤비나치야 Ya'는 T-80U 계열을 위해 개발된 신세대 복합 장갑입니다. 유리섬유, 세라믹 또는 기타 충전재의 고체층에 의존하던 이전 복합 장갑 배열과 달리, 이 설계는 고분자 기반 물질로 채운 셀 구조 장갑 요소를 사용합니다. 셀 구조는 성형작약탄에 대한 방호력을 높이는 동시에 장갑 충전재를 교체 가능한 모듈로 장착할 수 있게 합니다. T-80U와 함께 도입되었으며 이후 T-80UD에도 사용되었습니다.\n\n§G설계 힌트: 중량 비폭발 반응 장갑은 내구성이 더 높지만, 단순한 복합 장갑보다 비용도 더 많이 듭니다.§!"
 UKR_nera_armor_gen2: "T-84 복합 장갑"
 UKR_nera_armor_gen2_desc: "T-84는 강판과 합금판 사이에 세라믹과 특수 고무 요소를 끼워 넣은, 크게 개선된 다층 복합 장갑 배열을 도입하였습니다. 이러한 새로운 배열은 이전 소련 복합 장갑 설계에 비해 운동에너지탄과 성형작약탄 모두에 대해 더 높은 방호력을 제공하였습니다.\n\n§G설계 힌트: 중량 비폭발 반응 장갑은 내구성이 더 높지만, 단순한 복합 장갑보다 비용도 더 많이 듭니다.§!"
 UKR_nera_armor_gen3: "노타 복합 장갑"
 UKR_nera_armor_gen3_desc: "노타의 복합 장갑은 T-84에서 탐구된 첨단 방호 개념을 한층 발전시켜 개발되었습니다. 다층 배열은 강철 장갑에 비금속 및 에너지 흡수 재료를 결합하여, 운동에너지탄과 성형작약탄 위협 모두에 최적화된 두꺼운 방호벽을 형성합니다. 이 설계는 오브옉트 477A1을 위해 개발된 광범위한 방호 패키지의 일부를 이루었습니다.\n\n§G설계 힌트: 중량 비폭발 반응 장갑은 내구성이 더 높지만, 단순한 복합 장갑보다 비용도 더 많이 듭니다.§!"
 UKR_afv_composite_armor_gen3: "T-84 복합 장갑"
 UKR_afv_composite_armor_gen3_desc: "T-84의 복합 장갑은 크게 개선되어 다층 구조이며, 강판과 합금판 사이에 특수 고무와 세라믹 재료를 끼워 넣어 구성되었습니다.\n\n§G설계 힌트: 복합 장갑은 현대 주력 전차의 표준적인 선택지입니다.§!"
