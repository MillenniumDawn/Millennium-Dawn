l_simp_chinese:
 HUN_karpatalja_question_category: "外喀尔巴阡问题"
 HUN_annex_karpatalja: "回应来自外喀尔巴阡的召唤"
 HUN_annex_karpatalja_desc: "乌克兰在外喀尔巴阡州的权威已经崩溃。匈牙利地方议会要求布达佩斯承认两国联盟，而基辅方面已经没有人能够拒绝了。"
 HUN_karpatalja_ultimatum: "向基辅发出最后通牒"
 HUN_karpatalja_ultimatum_desc: "外喀尔巴阡的匈牙利少数民族已经等待了一个世纪，渴望与祖国重新统一。基辅要么就此和平交出外喀尔巴阡，要么就等着被武力夺走。"
 HUN_karpatalja_integration_category: "外喀尔巴阡行政区"
 HUN_701_return: "外喀尔巴阡回归"
 HUN_701_return_desc: "外喀尔巴阡在特里亚农条约中丧失。只要确保该地区遵守协议，我们就能实现永久的统一。"
 HUN_karpatalja_autonomy: "外喀尔巴阡行政区"
 HUN_karpatalja_autonomy_desc: "通过地方议会管理外喀尔巴阡可以赢得民心，加快其融入进程，但代价是财政投入放缓，以及公众对这种安排的耐心下降。"
 HUN_ukr_cede_tt: "§Y乌克兰会移交外喀尔巴阡§!"
 HUN_ukr_refuse_tt: "§R我们将取得武力夺取外喀尔巴阡的战争目标§!"
 hungary_karpatalja.1.t: "外喀尔巴阡议会"
 hungary_karpatalja.1.d: "由于基辅无法在远离首都的地方施加影响力，外喀尔巴阡的地方议会投票决定寻求与匈牙利合并。布达佩斯对此表示非常乐意。"
 hungary_karpatalja.1.a: "欢迎他们回家"
 hungary_karpatalja.2.t: "治理外喀尔巴阡"
 hungary_karpatalja.2.d: "地图上，外喀尔巴阡属于匈牙利。但要将其转变为一个运转良好的行政机构则是另一回事，政府必须决定采取何种力度的干预措施。"
 hungary_karpatalja.2.a: "通过地方议会进行统治"
 hungary_karpatalja.2.b: "由布达佩斯直接管辖"
 hungary_karpatalja.10.t: "布达佩斯索取外喀尔巴阡"
 hungary_karpatalja.10.d: "匈牙利已发出最后通牒：要么交出外喀尔巴阡，要么承担后果。政府必须决定如何应对。"
 hungary_karpatalja.10.a: "割让省份"
 hungary_karpatalja.10.b: "拒绝最后通牒"
 hungary_karpatalja.11.t: "基辅拒绝"
 hungary_karpatalja.11.d: "乌克兰拒绝了我们对外喀尔巴阡地区的要求。如果我们想要此地，就必须自己去夺取。"
 hungary_karpatalja.11.a: "准备开战"