 SMA_infantry_weapons_1: "M14"
 SMA_infantry_weapons_1_desc: "Винтовка M14, официально именуемая американской винтовкой калибра 7,62 мм, M14, — это американская автоматическая винтовка, использующая патроны 7,62x51 мм НАТО (.308 дюйма). Она стала стандартной винтовкой армии США в 1959 году, заменив винтовку M1 Garand в армии США к 1961 году."
 BSH_infantry_weapons_1: "АКМ"
 BSH_infantry_weapons_1_desc: "АКМ, разработанный в 1959 году, является наиболее распространенным модернизированным вариантом автомата АК-47, разработанного Михаилом Калашниковым. Он значительно легче и точнее в автоматическом режиме, чем его предшественник."
 CRM_infantry_weapons_1: "АКМ"
 CRM_infantry_weapons_1_desc: "АКМ, разработанный в 1959 году, является наиболее распространенным модернизированным вариантом автомата АК-47, разработанного Михаилом Калашниковым. Он значительно легче и точнее в автоматическом режиме, чем его предшественник."
 TAT_infantry_weapons_1: "АКМ"
 TAT_infantry_weapons_1_desc: "АКМ, разработанный в 1959 году, является наиболее распространенным модернизированным вариантом автомата АК-47, разработанного Михаилом Калашниковым. Он значительно легче и точнее в автоматическом режиме, чем его предшественник."
 AZE_infantry_weapons_2_desc: "АК-74 разработан на основе АКМ и имеет значительные улучшения по сравнению с предшественником. В частности, он использует патроны калибра 5,45 мм вместо тогдашнего стандартного для стран Варшавского договора 7,62 мм."
 POR_infantry_weapons_2_desc: "Heckler & Koch G3 (Gewehr 3) — это автоматическая боевая винтовка калибра 7,62x51 мм НАТО, разработанная в Западной Германии в 1950-х годах немецким производителем вооружений Heckler & Koch (H&K) в сотрудничестве с испанским государственным конструкторским агентством CETME. G3 заменила FN FAL/G1 в качестве стандартной винтовки с 1959 года и использовалась до модернизации до улучшенной модели G3A1 в 1963 году."
 POR_infantry_weapons_3_desc: "G3A3 — самая известная модификация винтовки G3. Она оснащена новыми усовершенствованными задними барабанными прицелами с улучшенным передним прицелом, дульным тормозом с пламегасителем, фиксированным прикладом из прочного пластика и пластиковым цевьем, не соприкасающимся со свободно плавающим стволом. Цевье выпускалось в узкой вентилируемой версии и в широкой версии. Последняя позволяет устанавливать сошки для повышения устойчивости."
 POR_infantry_weapons_4_desc: "Heckler & Koch G36 (Gewehr 36) — штурмовая винтовка под патрон 5,56x45 мм, разработанная в начале 1990-х годов немецким производителем оружия Heckler & Koch на замену более тяжёлым моделям G3 под патрон 7,62x51 мм. Она была принята на вооружение бундесвера в середине 90-х, заменив G3. С тех пор она также стала популярным экспортным товаром, и G36 состоит на вооружении военных и полицейских подразделений ряда стран, включая Германию, Испанию и Великобританию."
 POR_infantry_weapons_5_desc: "Модель G36A2 - это обновленный вариант модели G36. G36A2 оснащен быстросъемным коллиматорным прицелом Zeiss RSA, установленным на планке Пикатинни, который заменяет оригинальный коллиматорный прицел в сдвоенной боевой прицельной системе. Модернизированный комплект G36A2 также состоит из укороченного приклада G36C, нового цевья из алюминия с дополнительными четырьмя планками Пикатинни и вертикальной рукоятки со встроенным переключателем для управления лазерным модулем Oerlikon Contraves LLM01."
 POR_infantry_weapons_6_desc: "Heckler & Koch HK416 — штурмовая винтовка с газоотводной автоматикой под патрон 5,56x45 мм НАТО. Она разработана и производится немецкой компанией Heckler & Koch. Хотя конструкция основана на оружии класса AR-15, в ней используется фирменная газопоршневая система с коротким ходом поршня от более раннего семейства винтовок G36 компании Heckler & Koch. HK416 также оснащается фирменным цевьём с направляющими со всех четырёх сторон для установки различных аксессуаров."
 LUX_infantry_weapons_2_desc: "Heckler & Koch G3 (Gewehr 3) — это автоматическая боевая винтовка калибра 7,62x51 мм НАТО, разработанная в Западной Германии в 1950-х годах немецким производителем вооружений Heckler & Koch (H&K) в сотрудничестве с испанским государственным конструкторским агентством CETME. G3 заменила FN FAL/G1 в качестве стандартной винтовки с 1959 года и использовалась до модернизации до улучшенной модели G3A1 в 1963 году."
 LUX_infantry_weapons_3_desc: "Разработка винтовки M16A2 была первоначально запрошена Корпусом морской пехоты США по итогам боевого опыта во Вьетнаме с XM16E1 и M16A1. Она была официально принята на вооружение Министерством обороны под обозначением «Винтовка США калибра 5,56 мм, M16A2» в 1982 году. Морская пехота стала первым видом Вооружённых сил США, принявшим её на вооружение, в начале/середине 1980-х годов, а Армия США последовала её примеру в конце 1980-х."
 LUX_infantry_weapons_4_desc: "Heckler & Koch G36 (Gewehr 36) — штурмовая винтовка под патрон 5,56x45 мм, разработанная в начале 1990-х годов немецким производителем оружия Heckler & Koch на замену более тяжёлым моделям G3 под патрон 7,62x51 мм. Она была принята на вооружение бундесвера в середине 90-х, заменив G3. С тех пор она также стала популярным экспортным товаром, и G36 состоит на вооружении военных и полицейских подразделений ряда стран, включая Германию, Испанию и Великобританию."
 LUX_infantry_weapons_5_desc: "Модель G36A2 - это обновленный вариант модели G36. G36A2 оснащен быстросъемным коллиматорным прицелом Zeiss RSA, установленным на планке Пикатинни, который заменяет оригинальный коллиматорный прицел в сдвоенной боевой прицельной системе. Модернизированный комплект G36A2 также состоит из укороченного приклада G36C, нового цевья из алюминия с дополнительными четырьмя планками Пикатинни и вертикальной рукоятки со встроенным переключателем для управления лазерным модулем Oerlikon Contraves LLM01."
