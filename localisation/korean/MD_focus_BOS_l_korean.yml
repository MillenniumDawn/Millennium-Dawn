 BOS_unlocks_prep_for_srpska_war: "£decision_icon_small 보스니아 스릅스카 내전 준비 §Y결정§! §Y잠금 해제§!"
 BOS_unlocks_EUFOR: "£decision_icon_small EUFOR 설립 §Y결정§! §Y잠금 해제§!\n임무가 종료되면 §tSFOR§!를 대체합니다."
 Bos_will_pull_us_into_a_war: "§Y2주§! 안에 §Y스릅스카 공화국§!과의 §R내전§!에 휘말리게 됩니다."
 BOS_may_draw_us_closer_to_civil_war: "§R 내전에 한 걸음 더 가까워짐 §!"
 bos_run_the_chance_of: "§R즉각적인 전쟁§!의 위험을 감수"
 BOS_unlocks_desc_yugonost: "£decision_icon_small 유고노스탤지어 §Y결정§! §Y잠금 해제§!"
 BOS_ATTITUDE_TOOLTIP: "§Y신뢰§!는 구성 집단이 중앙 정부를 얼마나 지지하는지를 나타내며, §t적대§!에서 §g무관심§!, §G우호§!를 거쳐 §G충성§!까지 이어집니다. 적대적인 집단은 시위를 벌이고 정치적 경로를 막을 수 있으며, 합산된 값은 국가 안정도를 보정합니다."
 bos_srpska_gui_info_TOOLTIP: "§Y세르비아인§!은 대부분 보스니아 헤르체고비나 연방을 동쪽과 북쪽에서 감싸고 있는 지역인 스릅스카 공화국에 거주합니다. 스릅스카 공화국은 보스니아 헤르체고비나 내의 자치 정치체입니다. 이들은 주로 정교회 신자입니다."
 bos_bosniak_gui_info_TOOLTIP: "§Y보스니아크인§!은 보스니아 헤르체고비나 연방이라는 정치체를 공동으로 이루는 민족 집단이며, 국가명인 보스니아 헤르체고비나와 혼동해서는 안 됩니다. 대부분 보스니아 중부에 거주하며 주로 무슬림입니다."
 bos_croat_gui_info_TOOLTIP: "§Y크로아티아인§!은 보스니아 헤르체고비나 연방 내의 소수 집단입니다. 대부분 크로아티아 남부 해안 국경을 따라 보스니아 남서부 지역에 거주합니다. 이들은 주로 가톨릭 신자입니다."
