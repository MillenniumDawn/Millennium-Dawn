 # BlackBerry Corporate History Events
 blackberry_events.1.t: "BlackBerry Goes Mobile"
 blackberry_events.1.d: "Research In Motion has introduced the BlackBerry 5810, combining secure wireless email with mobile phone capability. The device gives Waterloo's growing technology cluster a chance to move from pagers into integrated enterprise communications."
 blackberry_events.1.a: "Let RIM scale privately"
 blackberry_events.1.b: "Back Waterloo's wireless cluster"
 blackberry_events.3.t: "The Touchscreen Challenge"
 blackberry_events.3.d: "Apple's iPhone has placed a large touchscreen and application-driven interface at the center of the smartphone market. Research In Motion must decide whether to defend its secure keyboard-focused enterprise niche or encourage a broader software ecosystem."
 blackberry_events.3.a: "Protect secure enterprise hardware"
 blackberry_events.3.b: "Encourage an application ecosystem"
 blackberry_events.5.t: "RIM Acquires QNX"
 blackberry_events.5.d: "Research In Motion has agreed to acquire QNX Software Systems from Harman for $200 million. The real-time operating system can underpin a new mobile platform or broaden Canada's position in embedded systems."
 blackberry_events.5.a: "Build the next handset platform"
 blackberry_events.5.b: "Broaden QNX beyond phones"
 blackberry_events.6.t: "BlackBerry 10's Last Bet"
 blackberry_events.6.d: "Research In Motion has adopted the BlackBerry name while launching BlackBerry 10 and the Z10 and Q10 smartphones. The new platform is an attempt to regain ground while preserving the company's enterprise security strengths."
 blackberry_events.6.a: "Back the BlackBerry 10 launch"
 blackberry_events.6.b: "Prioritize enterprise services"
 blackberry_events.7.t: "Beyond the Handset"
 blackberry_events.7.d: "BlackBerry will end internal hardware development and license device production to partners as its software and secure communications businesses expand. Canada can support the transition or spend heavily to retain domestic handset engineering."
 blackberry_events.7.a: "Support the software transition"
 blackberry_events.7.b: "Keep Canadian handset development"
 blackberry_events.2.t: "BlackBerry Avoids a Shutdown"
 blackberry_events.2.d: "Research In Motion faces the possibility of a U.S. injunction in its patent dispute with NTP. Millions of American users, including federal personnel, depend on BlackBerry service, making continuity a government concern even as the case approaches settlement."
 blackberry_events.2.a: "Protect continuity for federal users"
 blackberry_events.2.b: "Let the settlement close the case"
 blackberry_events.4.t: "A BlackBerry in the White House"
 blackberry_events.4.d: "President Barack Obama has negotiated limited access to a security-hardened BlackBerry for official use. The arrangement preserves mobile communication while imposing strict controls on who may contact him and how records are handled."
 blackberry_events.4.a: "Issue the hardened device"
 blackberry_events.4.b: "Separate personal and official communications"

