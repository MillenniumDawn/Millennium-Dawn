 nsb_atgm_tech_3: "ATGM 3ème génération"
 nsb_atgm_tech_3_desc: "Les nacelles de missiles air-sol (ATGM) sont des systèmes externes montés sur des hélicoptères, permettant le déploiement de missiles guidés conçus pour engager et détruire les véhicules blindés, les fortifications et d'autres cibles au sol avec une grande précision. Ces nacelles améliorent considérablement les capacités offensives d'un hélicoptère, permettant un engagement efficace dans divers scénarios de combat."
 nsb_atgm_tech_4: "ATGM 4ème génération"
 nsb_atgm_tech_4_desc: "Les nacelles de missiles air-sol (ATGM) sont des systèmes externes montés sur des hélicoptères, permettant le déploiement de missiles guidés conçus pour engager et détruire les véhicules blindés, les fortifications et d'autres cibles au sol avec une grande précision. Ces nacelles améliorent considérablement les capacités offensives d'un hélicoptère, permettant un engagement efficace dans divers scénarios de combat."
