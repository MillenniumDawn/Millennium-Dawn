 PAL_MODERN_DAY_DESC: "以色列曾是《以赛亚书》预言人类将“将刀铸成犁头，将枪铸成镰刀”的土地，但自从犹太人民两千年来首次重新获得独立以来，以色列国经历了太多的血腥屠杀。1995年11月，拉宾总理遇刺身亡，1990年代奥斯陆协议进程的乐观情绪也随之消亡，尽管巴拉克总理乐观，但第二次起义不可避免。但以色列会从中崛起吗？是昔日的空壳，还是能够按照自己的条件进行谈判的崛起地区大国？它将如何处理迄今为止一直被彻底回避的犹太和民主之间的微妙平衡？"
