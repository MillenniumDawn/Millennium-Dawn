 engine_solar_triple_1: "Тройные солнечные двигатели"
 engine_solar_triple_1_desc: "Использование двигателей на солнечной энергии позволило самолётам работать на электромоторах, снимая потребность ВВС в топливе.\n\n§GПодсказка дизайнера: Солнечные двигатели обнуляют расход топлива и значительно увеличивают дальность полёта, но сильно снижают защиту и радиолокационное преимущество. Рекомендуются только для самолётов в конфликтах низкой интенсивности, где у противника мало авиации и ПВО.§!"
 engine_solar_quad_1: "Счетверённые солнечные двигатели"
 engine_solar_quad_1_desc: "Использование двигателей на солнечной энергии позволило самолётам работать на электромоторах, снимая потребность ВВС в топливе.\n\n§GПодсказка дизайнера: Солнечные двигатели обнуляют расход топлива и значительно увеличивают дальность полёта, но сильно снижают защиту и радиолокационное преимущество. Рекомендуются только для самолётов в конфликтах низкой интенсивности, где у противника мало авиации и ПВО.§!"
 weap_buff_awacs_4: "Гиперсовременная система ДРЛОиУ"
 weap_buff_awacs_4_desc: "Сверхсовременные радары ДРЛОиУ, каналы передачи данных и системы связи с беспилотниками.\n\n§GПодсказка дизайнера: Системы ДРЛО дают значительный бонус к превосходству в воздухе вашим силам во время воздушной разведки — за каждый самолёт эскадрильи, выполняющий задание.§!\n\n§WИспользование этого модуля в качестве основного оружия создаст§! §Bсамолёт ДРЛОиУ§!"
 weap_buff_awacs_5: "Ультрасовременная система ДРЛОиУ"
 weap_buff_awacs_5_desc: "Ультрасовременные радары ДРЛОиУ, каналы передачи данных и системы связи с беспилотниками.\n\n§GПодсказка дизайнера: Системы ДРЛО дают значительный бонус к превосходству в воздухе вашим силам во время воздушной разведки — за каждый самолёт эскадрильи, выполняющий задание.§!\n\n§WИспользование этого модуля в качестве основного оружия создаст§! §Bсамолёт ДРЛОиУ§!"
