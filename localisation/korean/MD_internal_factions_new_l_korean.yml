l_korean:
 internal_factions_events.53.t: "당에 대한 충성심 검증"
 internal_factions_events.53.d: "공산당 간부단은 이념적으로 신뢰할 수 없다고 판단되는 관료 명단을 정부에 제출했습니다. 이들은 공식적인 충성도 조사와 당의 기준에 미달하는 자들의 제거를 요구하고 있습니다."
 internal_factions_events.53.o1: "숙청을 단행한다"
 internal_factions_events.53.o2: "그들의 요구를 거부한다"
 internal_factions_events.53.o3: "제한적인 검토를 시작한다"
 internal_factions_events.54.t: "간부단, 집단화 촉구"
 internal_factions_events.54.d: "공산당 간부단은 민간 농업 소유에 대해 인내심을 잃었습니다. 이들은 효율성과 이념적 순응을 높이기 위해 농지를 국가 통제하에 통합하는 집단화 운동을 시작하도록 정부를 압박하고 있습니다."
 internal_factions_events.54.o1: "집단화를 지지한다"
 internal_factions_events.54.o2: "제안을 거부한다"
 internal_factions_events.54.o3: "제한적인 토지 개혁을 추진한다"
 internal_factions_events.55.t: "산업계, 항만 확장 요구"
 internal_factions_events.55.d: "해운업계는 혼잡으로 인해 매년 수백만 달러의 손실을 입고 있다고 주장하며 해안을 따라 항만 시설을 확장하자는 제안서를 제출했습니다. 지역 토지 소유주와 도시 계획가들은 주민 이주 문제와 도시 혼란을 이유로 반대하고 있습니다."
 internal_factions_events.55.o1: "확장을 승인한다"
 internal_factions_events.55.o2: "제안을 거부한다"
 internal_factions_events.55.o3: "타협안을 협상한다"
 internal_factions_events.56.t: "항로를 교란하는 해적 행위"
 internal_factions_events.56.d: "해적 행위가 급증하여 우리의 상업 항로가 위협받고 있습니다. 해운업계 대표들은 선박과 화물을 보호하기 위한 정부의 개입을 요구하고 있으며, 방관할 경우 보험료가 상승하고 투자가 위축될 것이라고 경고하고 있습니다."
 internal_factions_events.56.o1: "해군 호송 프로그램에 자금을 지원한다"
 internal_factions_events.56.o2: "문제를 무시한다"
 internal_factions_events.56.o3: "국제 협력을 모색한다"
 internal_factions_events.57.t: "외국 첩보망 적발"
 internal_factions_events.57.d: "정보 분석가들이 우리 국경 내에서 활동하는 외국 첩보망을 확인했습니다. 정보 공동체는 이 조직이 더 이상 기밀 정보를 빼내기 전에 정부가 단호하게 조치할 것을 촉구하고 있습니다."
 internal_factions_events.57.o1: "조직을 공개적으로 폭로한다"
 internal_factions_events.57.o2: "조용히 무력화한다"
 internal_factions_events.57.o3: "아무 조치도 취하지 않는다"
 internal_factions_events.58.t: "의회, 정보 예산 지출에 의문 제기"
 internal_factions_events.58.d: "다음 선거 주기를 앞두고 의원들은 정보기관의 불투명한 예산에 대해 날카로운 질문을 제기했습니다. 시민 단체들은 더 큰 책임성을 요구하고 있으며, 정보 공동체는 투명성이 진행 중인 작전을 위태롭게 할 것이라고 경고합니다."
 internal_factions_events.58.o1: "예산을 전면 옹호한다"
 internal_factions_events.58.o2: "일부 정보를 공개한다"
 internal_factions_events.58.o3: "완전한 투명성을 약속한다"
 internal_factions_events.59.t: "국경을 넘는 외국인 전투원"
 internal_factions_events.59.d: "진행 중인 분쟁에 이끌린 외국인 전투원들이 대거 우리 영토로 넘어왔습니다. 이들은 우리의 대의를 위해 복무하겠다고 제안하고 있으나, 신뢰도와 규율은 여전히 불확실합니다. 외국인 지하디 조직망은 정부가 이들에게 역할을 마련해 줄 것을 촉구하고 있습니다."
 internal_factions_events.59.o1: "정규 부대에 편입시킨다"
 internal_factions_events.59.o2: "즉시 전선에 배치한다"
 internal_factions_events.59.o3: "국경에서 돌려보낸다"
 internal_factions_events.60.t: "지하디 여단, 자치권 요구"
 internal_factions_events.60.d: "세력이 커지면서 대담해진 외국인 지하디 여단은 독자적인 지휘 체계 아래 운영되는 자치 부대로서 공식적인 인정을 요구하고 있습니다. 이들은 작전상의 독립성이 관료적 간섭 없이 더 효과적으로 행동할 수 있게 해 줄 것이라고 주장합니다."
 internal_factions_events.60.o1: "작전 자치권을 부여한다"
 internal_factions_events.60.o2: "요청을 거부한다"
 internal_factions_events.60.o3: "국가 지휘 체계에 편입시킨다"
 internal_factions_events.61.t: "쿠드스군, 추가 자원 요청"
 internal_factions_events.61.d: "쿠드스군 지도부는 역내 대리 작전을 확대하기 위한 추가 자금과 물자를 공식 요청했습니다. 이들은 지금이 전략적 기회이며, 자금 부족은 경쟁 세력에게 영향력을 넘겨줄 위험이 있다고 주장합니다."
 internal_factions_events.61.o1: "전액 지원한다"
 internal_factions_events.61.o2: "부분적으로 지원한다"
 internal_factions_events.61.o3: "요청을 거부한다"
 internal_factions_events.62.t: "이웃 국가의 취약점"
 internal_factions_events.62.d: "쿠드스군 정보부는 현재 분쟁에 휘말린 이웃 국가가 대리 압박에 취약하다고 보고했습니다. 기회의 창은 좁지만 얻을 수 있는 전략적 이익은 상당합니다."
 internal_factions_events.62.o1: "상황을 이용한다"
 internal_factions_events.62.o2: "동맹국과 정보를 공유한다"
 internal_factions_events.62.o3: "기회를 흘려보낸다"
 establish_political_commissars_decision: "정치 위원 배치"
 establish_political_commissars_decision_desc: "이념적 충성을 강화하고 사기를 높이기 위해 군 부대 내에 당 정치 위원을 배치합니다. 정치 위원은 공산당 간부단에 직접 보고하며, 군에 대한 이들의 영향력을 강화합니다."
 worker_reeducation_programme_decision: "노동자 재교육 프로그램"
 worker_reeducation_programme_decision_desc: "노동자들 사이에서 당의 이념을 강화하기 위해 국가 주도의 재교육 프로그램에 자금을 지원합니다. 노동자들이 국가의 우선 과제로 노력을 돌림에 따라 순응도는 높아지고 소비재 수요는 감소합니다."
 maritime_safety_inspections_decision: "의무 해사 안전 점검"
 maritime_safety_inspections_decision_desc: "국내 모든 항만 및 조선소 시설에 대한 포괄적인 안전 점검 체계를 도입합니다. 기준을 높이면 업계가 안심하게 되고, 점검 기간 동안 조선소 생산량이 향상됩니다."
 naval_shipping_subsidy_decision: "해운 보조금"
 naval_shipping_subsidy_decision_desc: "국내 장거리 해운업체에 정부가 직접 보조금을 지급합니다. 이 프로그램은 우리 상선단의 작전 범위를 확장하고 조선소 처리량을 향상시킵니다."
 counter_intelligence_sweep_decision: "방첩 소탕 작전"
 counter_intelligence_sweep_decision_desc: "정보 공동체가 외국의 침투 여부를 확인하기 위해 정부 및 군 네트워크를 체계적으로 소탕하도록 승인합니다. 작전 기간 동안 외국의 첩보 활동 비용이 감소하고 통신 보안이 향상됩니다."
 expand_intelligence_network_decision: "정보망 확장"
 expand_intelligence_network_decision_desc: "해외에 새로운 정보 거점과 인적 정보 자산을 구축하는 데 자금을 지원합니다. 확장된 정보망은 적의 통신을 해독하고 외국의 군 이동을 감시하는 능력을 향상시킵니다."
 jihadi_recruitment_drive_decision: "지하디 모집 운동"
 jihadi_recruitment_drive_decision_desc: "공감하는 조직망 전반에서 외국인 전투원을 우리의 대의로 끌어들이기 위한 적극적인 모집 운동을 후원합니다. 추가 인력이 유입되고 특수 부대 역량이 증대됩니다."
 martyr_glorification_campaign_decision: "순교자 미화 운동"
 martyr_glorification_campaign_decision_desc: "전사자를 미화하고 순교를 문화적 이상으로 고양하는 선전 운동을 시작합니다. 전쟁 열기가 급격히 높아지지만, 급진적 메시지가 극단주의 정서를 부추길 위험이 있습니다."
 support_proxy_networks_decision: "대리 조직망 지원"
 support_proxy_networks_decision_desc: "쿠드스군을 통해 인접국에서 활동하는 지역 대리 단체에 자금과 장비를 전달합니다. 이러한 조직망을 강화하면 우리의 전략적 영향 범위가 확대되고 경쟁국에 대한 압박을 유지하는 직접 비용이 줄어듭니다."
 quds_force_training_programme_decision: "쿠드스군 훈련 프로그램"
 quds_force_training_programme_decision_desc: "쿠드스군이 일부 군 부대를 대상으로 고급 비정규전 훈련을 실시하도록 승인합니다. 비정규전 숙련도가 향상되고 특수 부대 역량이 확대됩니다."
 internal_factions_events.63.t: "계약업체, 수출 계약 로비"
 internal_factions_events.63.d: "방위 계약업체들은 일련의 해외 무기 수출 계약에 정부가 지원을 해 줄 것을 압박하고 있습니다. 이들은 계약이 상당한 수익을 가져오고 국내 생산 라인을 유지해 줄 것이라고 주장하지만, 비판자들은 광범위한 판매가 지역 긴장을 고조시키고 원치 않는 국제적 감시를 불러올 수 있다고 경고합니다."
 internal_factions_events.63.o1: "전면 수출을 승인한다"
 internal_factions_events.63.o2: "판매를 동맹국 구매자로 제한한다"
 internal_factions_events.63.o3: "로비 활동을 거부한다"
 defense_procurement_programme_decision: "국방 조달 프로그램"
 defense_procurement_programme_decision_desc: "국내 무기 제조업체에 꾸준한 주문을 보장하는 전용 조달 주기를 시작합니다. 지속적인 계약은 군수 산업 세수를 늘리고 소비재 부담을 줄여, 방위 산업의 지속적인 협조에 보답합니다."
 classified_research_programme_decision: "기밀 연구 프로그램"
 classified_research_programme_decision_desc: "방위 산업 협력사를 통해 수행되는 군사 기술 연구에 기밀 자금을 투입합니다. 이 투자는 연구 성과를 가속화하고 통신 보안을 강화하며, 프로그램 시작 시 자금 이전이 발생합니다."
 issue_government_bonds_decision: "은행 보증 국채 발행"
 issue_government_bonds_decision_desc: "국제 은행망을 통해 관리되는 은행 보증 국채의 발행을 승인합니다. 즉각적인 자본 유입으로 안정도가 상승하지만, 부채 상환으로 인해 기간 동안 금리가 소폭 상승합니다."
 attract_foreign_investment_decision: "외국인 투자 유치"
 attract_foreign_investment_decision_desc: "국제 금융계 인맥과 협력하여 안정성을 알리고 진입 장벽을 낮춥니다. 이 운동은 외국인 투자를 받는 데 필요한 시간을 단축하고 유입 자본으로부터의 세수를 늘립니다."
 internal_factions_cadre_purge: "간부 숙청"
 internal_factions_cadre_purge_desc: "당 정치 위원들이 관료 조직 전반에서 충성도 조사를 진행하고 있으며, 행정적 혼란을 감수하는 대가로 이념적 규율이 강화되고 있습니다."
 internal_factions_collectivisation_drive: "집단화 운동"
 internal_factions_collectivisation_drive_desc: "농업 집단화가 진행 중이며, 민간 농장이 국가 통제로 전환되면서 공급망이 교란되고 소비재 부족이 심화되고 있습니다."
 internal_factions_convoy_escort: "해군 호송 프로그램"
 internal_factions_convoy_escort_desc: "정부 지원 해군 호송이 상업 항로를 보호하고 있으며, 해군 인력의 자신감과 경험을 높이고 있습니다."
 internal_factions_piracy_losses: "해적 피해"
 internal_factions_piracy_losses_desc: "방치된 해적 행위가 우리 항로를 교란하여 무역 신뢰를 훼손하고 경제 전반을 불안정하게 만들고 있습니다."
 internal_factions_neutralised_spies: "첩보망 해체"
 internal_factions_neutralised_spies_desc: "외국 정보망이 조용히 무력화되어 일정 기간 동안 우리의 방첩 능력이 향상되었습니다."
 internal_factions_transparency_costs: "정보 투명성 비용"
 internal_factions_transparency_costs_desc: "정보 작전의 공개로 인해 적대 세력이 새로 드러난 수법에 적응하면서 우리의 암호 보안이 약화되었습니다."
 internal_factions_jihadi_frontline: "지하디 전선 배치"
 internal_factions_jihadi_frontline_desc: "전선에 직접 배치된 외국인 전투원들이 적진을 공격적으로 압박하고 있지만, 정규군과의 통합 부족으로 측면이 노출되어 있습니다."
 internal_factions_jihadi_autonomy: "지하디 자치 부대"
 internal_factions_jihadi_autonomy_desc: "공인된 자치 지하디 여단이 독자적인 지휘 아래 운영되며, 우리의 특수 부대 한도를 크게 확대합니다."
 internal_factions_jihadi_integrated: "통합 지하디 부대"
 internal_factions_jihadi_integrated_desc: "국가 지휘 체계에 공식적으로 편입된 외국인 전투원들은 부대 응집력과 조직 회복률을 향상시켰습니다."
 internal_factions_quds_expanded: "쿠드스군 작전 확대"
 internal_factions_quds_expanded_desc: "추가 자원 덕분에 쿠드스군이 대리 작전을 확대할 수 있게 되어, 해외 전복 활동의 유지 비용이 감소했습니다."
 internal_factions_quds_operation: "쿠드스군 전략 작전"
 internal_factions_quds_operation_desc: "쿠드스군이 인접국의 불안정을 적극 이용하고 있으며, 진행 중인 작전에서 전술적 우위를 제공합니다."
 fund_religious_schools_decision: "종교 학교 지원"
 fund_religious_schools_decision_desc: "와하비 울라마의 감독 아래 운영되는 종교 학교망에 정부 자금을 투입합니다. 기관들이 영향 범위를 넓힘에 따라 문해율이 향상되고 사회 안정도가 상승합니다."
 enforce_moral_codes_decision: "도덕 규범 집행"
 enforce_moral_codes_decision_desc: "종교 당국이 전국에서 공공 도덕 기준을 집행할 수 있도록 권한을 부여합니다. 이 조치는 울라마의 영향력을 강화하고 사회 결속력을 높이지만, 더 엄격해진 규제로 소비 지출이 소폭 늘어납니다."
 agricultural_subsidies_decision: "농업 보조금"
 agricultural_subsidies_decision_desc: "생산량을 늘리고 농민 세력의 협조에 보답하기 위해 농업 부문에 직접 보조금을 지급합니다. 초기 지출로 국고가 감소하지만, 생산성 향상이 프로그램 기간 동안 경제를 지탱합니다."
 rural_infrastructure_fund_decision: "농촌 인프라 기금"
 rural_infrastructure_fund_decision_desc: "농촌 지역의 도로, 관개 및 저장 시설 개선에 정부 자금을 투입합니다. 이 투자는 농업 지구의 노동 부담을 덜어 주고 농촌 공동체의 호의를 얻습니다."
 infrastructure_investment_programme_decision: "인프라 투자 프로그램"
 infrastructure_investment_programme_decision_desc: "주요 산업 재벌들과 협력하여 국가 생산 기반 전반의 대규모 인프라 개선에 자금을 지원합니다. 프로그램 기간 동안 공장과 사무실의 생산량이 증가하며, 재벌이 경제의 기둥이라는 역할을 공고히 합니다."