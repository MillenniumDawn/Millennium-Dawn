 john_died_sma: "Jean-Paul II est décédé"
 SMA_change_textbooks: "Changer les manuels scolaires"
 SMA_change_textbooks_desc: "Saint-Marin est un grand pays !\nMais notre histoire se prête mal au patriotisme, et certains détails manquent d'impact. Alors, peut-être devrions-nous les modifier un peu ?"
