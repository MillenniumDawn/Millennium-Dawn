 CONFIRMCHANGE_UNIT_TEMPLATE_MULTI: "Вы уверены, что хотите §YИЗМЕНИТЬ§! §Yшаблон бригады§! на $TEMPLATE|H$ для этих §Yбригад§! ($COUNT|Y$)? Новое снаряжение может прибыть не сразу."
 SCORE_CALC_ARMY: "Количество бригад: $ARMIES$"
 UNITS_VIEW_BTN_DRAW_OFFENCE: "§HЛиния наступления§!\n§GЗажмите правую кнопку мыши§! на карте, чтобы нарисовать §Yлинию наступления§!.\nЛинии можно рисовать только на территории, к которой назначена §Hлиния фронта§! или §Hморской десант§!.\n\nБригады, назначенные на план с линией наступления, будут пытаться захватить территорию, чтобы перенести туда свою линию фронта. \n\n§GЗажмите кнопку мыши§! и §Gотпустите§! её на кнопке режима исполнения, чтобы изменить тип исполнения плана"
 UNITS_VIEW_BTN_DRAW_DEFENCE: "§HЛиния фронта§!\n - §GЩёлкните§! по одной из границ с другой страной, чтобы назначить фронт вдоль всей границы.\n - §GЗажмите правую кнопку и проведите мышью§! по одной из границ с другой страной, чтобы назначить фронт на более коротком участке.\n - §GЗажмите правую кнопку и проведите мышью§! по концам существующей линии фронта, чтобы изменить их.\n\nЛинии фронта — исходная точка атак на вражескую территорию в сторону линий наступления, а также способ быстро расставить бригады вдоль иностранной границы."
 UNITS_VIEW_BTN_DRAW_DEFENCE_ARMY_GROUP: "§HЛиния фронта§!\n - §GЩёлкните§! по одной из границ с другой страной, чтобы назначить фронт вдоль всей границы.\n - §GShift + щелчок§! по одной из границ с другой страной назначает фронт вдоль всей границы без фронтов подчинённых армий.\n - §GЗажмите правую кнопку и проведите мышью§! по одной из границ с другой страной, чтобы назначить фронт на более коротком участке.\n - §GShift + правая кнопка с протяжкой мыши§! по одной из границ с другой страной назначает фронт на более коротком участке без фронтов подчинённых армий.\n - §GЗажмите правую кнопку и проведите мышью§! по концам существующей линии фронта, чтобы изменить их.\n\nЛинии фронта — исходная точка атак на вражескую территорию в сторону линий наступления, а также способ быстро расставить бригады вдоль иностранной границы."
 UNITS_VIEW_BTN_DRAW_FALLBACK: "§HЛиния отхода§!\n - §GЗажмите правую кнопку и проведите мышью§! по дружественной территории, чтобы нарисовать §Yразовый§! оборонительный приказ.\n\nЛинии отхода полезны, чтобы расположить бригады для обороны, например за рекой или в другом месте на дружественной территории."
 UNITS_VIEW_BTN_AREA_DEFENSE: "§HОборона района§!\n - §GЩёлкните§! по регионам, чтобы добавить их в приказ армии или убрать из него.\nУ армии с этим приказом не может быть приказов других типов.\n\nБригады армии с этим приказом рассредоточатся по назначенному району, охраняя важные города, порты и другие объекты и справляясь с небольшими силами противника."
 UNITS_VIEW_BTN_UNASSIGN_HQ_ONLY: "§RНельзя снять подразделения §Yштаба армии§! с их армии. Вместо этого отзовите §Yштаб армии§!.§!"
 UNITS_VIEW_BTN_UNASSIGN_MIXED_HQ_NOTE: "Подразделения §Yштаба армии§! в выделении будут проигнорированы."
 UNITS_VIEW_BTN_UNITS_ASSIGN: "§HРежим назначения бригад§!\nНажмите эту кнопку, чтобы переключить режим, или зажмите §GCTRL§!.\nЗатем выберите один из подсвеченных фронтов, чтобы назначить на него выбранные бригады."
 UNITS_VIEW_BTN_UNITS_UNASSIGN: "§HСнять бригады§!\nНажмите эту кнопку, чтобы снять выбранные бригады с их приказов."
 UNITS_HAS_NO_ORDERS_WARNING: "§RБригада входит в армию, но у неё нет приказов!§!\nНарисуйте оборонительные или наступательные линии и назначьте на них подразделения."
 UNITS_HAS_NO_ORDERS_WARNING_BUT_HAS_ARMY_GROUP: "§RБригада входит в армию без приказов и будет выполнять приказ группы армий.§!"
