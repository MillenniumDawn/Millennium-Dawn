 SOO_fight_start: "오세티야의 자유를 위한 투쟁 개시"
 SOO_fight_start_desc: "타데예프 일족은 너무 오랫동안 우리나라를 공포에 떨게 했습니다. 이제 그들을 처리할 때입니다."
 SOO_fight_narcota: "마약 유통 중단"
 SOO_fight_narcota_desc: "마약 밀매에 연루된 테데예프 일족 관련자 전원을 제거하겠습니다."
 SOO_fight_contrabanda: "불법 밀수 근절"
