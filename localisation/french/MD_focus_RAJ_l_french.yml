 indian_event.83.t: "Le califat exige la soumission"
 indian_event.83.d: "Delhi appelle [ROOT.GetName] à embrasser l'unité dans la foi et à s'incliner devant le règne de [FROM.GetName]. Le refus signifie la guerre."
 indian_event.83.a: "Se soumettre au califat."
 indian_event.83.b: "Refuser et se préparer à la guerre."
 RAJ_gas_pipeline_accept_tt: "§YLe destinataire construit une centrale d'énergie renouvelable et améliore ses relations et son commerce avec l'Inde.§!"
 RAJ_gas_pipeline_reject_tt: "§YL'opinion du destinataire envers l'Inde se dégrade.§!"
 RAJ_bangladesh_ultimatum_accept_tt: "§YL'Inde annexe le Bangladesh sans délai, prenant le contrôle total de son territoire et des cœurs sur ses anciens États.§!"
 RAJ_bangladesh_ultimatum_reject_tt: "§YL'Inde prépare plutôt un objectif de guerre pour conquérir le Bangladesh par la force.§!"
 RAJ_vietnam_alliance_accept_tt: "§YLe Vietnam et l'Inde forment une alliance mutuelle et rejoignent la même faction.§!"
 RAJ_sco_join_notify_tt: "§YL'Inde rejoint l'OCS en tant que partenaire de dialogue.§!"
 RAJ_brics_founding_invite_tt: "§YChaque nation qui accepte rejoint les BRICS en tant que membre à part entière, gagne le bonus d'opinion de membre BRICS de l'Inde et rejoint la faction de l'Inde si celle-ci en dirige une.§!"
 RAJ_iran_brics_invite_tt: "§YL'Iran rejoint les BRICS en tant que membre à part entière.§!"
 RAJ_us_pak_pressure_accept_tt: "§YLes États-Unis rétrogradent le statut d'allié majeur non membre de l'OTAN du Pakistan, aigrissant les relations américano-pakistanaises.§!"
 RAJ_us_pak_pressure_reject_tt: "§YL'opinion des États-Unis envers l'Inde se dégrade et l'influence de l'Inde à Washington diminue.§!"
 RAJ_pakistan_ultimatum_accept_tt: "§YL'Inde annexe le Pakistan sans délai, prenant le contrôle total de son territoire et des cœurs sur ses anciens États.§!"
 RAJ_pakistan_ultimatum_reject_tt: "§YL'Inde prépare plutôt un objectif de guerre pour conquérir le Pakistan par la force.§!"
 RAJ_cenasia_ultimatum_accept_tt: "§YL'Inde annexe le destinataire sans délai, prenant le contrôle total de son territoire.§!"
 RAJ_cenasia_ultimatum_reject_tt: "§YL'Inde prépare à la place un but de guerre pour conquérir le destinataire par la force.§!"
 RAJ_turkmen_treaty_accept_tt: "§YLe Turkménistan signe un pacte de non-agression mutuelle avec l'Inde, ouvrant la voie à un futur partage de l'Afghanistan.§!"
 RAJ_turkmen_treaty_reject_tt: "§YLe Turkménistan refuse le traité, fermant la voie à un futur partage de l'Afghanistan.§!"
 RAJ_afghan_partition_accept_tt: "§YLe Turkménistan se joint à l'Inde pour revendiquer des buts de guerre contre les talibans et l'Afghanistan.§!"
 RAJ_islamic_ulema_invite_accept_tt: "§YLa nation rejoint la faction des oulémas islamiques de l'Inde.§!"
 RAJ_islamic_ulema_invite_reject_tt: "§YLes relations s'effondrent des deux côtés, et la nation subit ses propres pénalités politiques et de stabilité.§!"
 RAJ_development_in_progress: "Une initiative de développement intégré est déjà en cours"
 RAJ_pak_top_influencer_tt: "§Y[ROOT.GetNameWithFlag]§! est la principale source d'influence étrangère en §Y[PAK.GetNameWithFlag]§!"
 RAJ_seek_permanent_unsc_seat: "Chercher un siège permanent au CSNU"
 RAJ_seek_permanent_unsc_seat_desc: "La population de l'Inde, son poids économique et son rôle dans le maintien de la paix international étayent une revendication de représentation permanente au Conseil de sécurité des Nations unies. Nous entamerons la campagne diplomatique nécessaire pour porter cette revendication devant le Conseil et l'Assemblée générale."
 RAJ_enshrine_pluralism: "Consacrer le pluralisme"
 RAJ_enshrine_pluralism_desc: "Inscrire le règlement religieux dans l'ordre constitutionnel plutôt que de le laisser à la bonne volonté du gouvernement du jour. Exige la loi §YHarmonie pluraliste§! et l'Harmonie religieuse en vigueur. Le bonus est verrouillé de façon permanente, et l'opinion communautaire ne pilote plus les troubles, les crises séparatistes ni la sécession."
 RAJ_all_faiths_content: "Chaque confession détient une opinion supérieure à §Y80§!"
 RAJ_pluralist_harmony: "Harmonie pluraliste"
 RAJ_pluralist_harmony_desc: "Le pluralisme adopté depuis une position de force. Chaque communauté se tient déjà derrière le gouvernement, si bien qu'un statut égal devant l'État se lit comme une reconnaissance plutôt que comme une concession arrachée à une majorité rancunière."
 RAJ_pluralist_settlement: "Règlement pluraliste"
 RAJ_pluralist_settlement_desc: "Le règlement religieux est inscrit dans l'ordre constitutionnel et ne dépend plus du gouvernement du jour. Le standing communautaire a cessé de gouverner la cohésion de l'union."
