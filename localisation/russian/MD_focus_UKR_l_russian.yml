 ukr_modernize_sov_equipment_t55_reactivation_program.4.desc: "§YХКБМ§! завершило работу над §YТ-55АГМ§!. Новая кормовая ниша башни с автоматом заряжания позволяет установить 125-мм пушку, более мощный двигатель §Y5ТДФМ§! справляется с потяжелевшим танком, а динамическая защита §Y«Нож»§! и тепловизионный прицел приближают старый корпус §Gк современным стандартам§!."
