 Sweden_foci.7003.d1: "독일이 전략적 고려와 기존 약속을 이유로 MEKO A-100 초계함을 조달하겠다는 스웨덴의 요청을 거절했습니다. 이 결정은 향후 방위 협력에 영향을 미칠 수 있습니다."
 Sweden_foci.7003.d2: "러시아가 지정학적 파장과 전략적 우선순위를 이유로 타란툴급 초계함을 구매하겠다는 스웨덴의 제안을 거절했습니다. 이 거절은 군사 협력을 강화할 기회를 놓친 것입니다."
 Sweden_foci.7003.d3: "핀란드가 자국의 방위 수요와 수출 정책을 우선시하여, 하미나급 초계함을 도입하겠다는 스웨덴의 요청을 거부했습니다. 이 결정은 향후 외교 관계에 영향을 미칠 수 있습니다."
 Sweden_foci.7003.o1: "이들은 대가를 치를 것이다, ABBA 재결합을 추진하라"
 Sweden_foci.7004.t: "스웨덴 신형 초계함 취역식"
 Sweden_foci.7004.d1: "스톡홀름에서 열린 공식 행사에서 새로 도입한 MEKO A-100 초계함이 스웨덴 해군에 정식으로 취역했습니다. 이 행사에는 다수의 독일 대표단이 참석하여 양국 관계의 강화를 부각시켰으며 향후 협력의 토대를 마련했습니다."
 Sweden_foci.7004.d2: "스톡홀름에서 열린 공식 행사에서 새로 도입한 타란툴급 초계함이 스웨덴 해군에 정식으로 취역했습니다. 러시아 고위 인사들의 참석은 양국 간 방위 협력이 커지고 있음을 보여 주었으며, 향후 관계에 도움이 될 수 있습니다."
 Sweden_foci.7004.d3: "스톡홀름에서 열린 공식 행사에서 새로 도입한 하미나급 초계함이 스웨덴 해군에 정식으로 취역했습니다. 핀란드 고위 관리들이 자리를 빛낸 이 행사는 깊어지는 방위 동반자 관계와 우리의 향후 관계에 미칠 긍정적 영향을 강조했습니다."
 Sweden_foci.7004.o1: "해군력 발전의 이정표를 기념한다"
 Sweden_foci.10.t: "전략적 통합: 인프라의 절박성"
 Sweden_foci.10.d: "갈수록 불안정해지는 세계에서 인프라는 더 이상 단순한 민간 계획의 문제가 아닙니다. 철도, 디지털 망, 항만, 수송 회랑은 군사적 대비 태세와 전략적 기동성의 필수 요소가 되었습니다. 스웨덴은 경제적 회복력과 방위적 효용을 모두 고려한 이중 용도 설계로, 대륙 전역의 핵심 인프라를 현대화하고 상호 연결하기 위한 유럽 공동 구상을 공식 제안했습니다.\n\n스웨덴 방위 계획관들과 기업부가 뒷받침하는 이 제안은 물류 역량을 확대하고, 군사 기동 규약을 표준화하며, 핵심 거점을 사보타주나 사이버 공격으로부터 보강하기 위한 조율된 노력의 개요를 담고 있습니다. 발트해 횡단 연결망을 확보하고, 북극권에서 중부 유럽에 이르는 NATO의 작전 흐름을 강화하며, 하이브리드 위협이나 재래식 위협이 발생할 경우의 신속 전개 시나리오를 가능하게 할 필요성을 강조합니다.\n\n이는 EU의 경제적 결속과 녹색 전환 목표에 대한 기여로 포장되어 있으나, 그 이면의 논리는 분명히 전략적입니다. 스웨덴은 스스로를 단순한 물류 거점이 아니라 유럽의 지경학적·방위적 구조를 능동적으로 형성하는 주체로 자리매김하고자 합니다.\n\n주요 유럽 파트너들의 반응에 따라 이 구상이 집단적 회복력의 전환점이 될지, 아니면 분열된 국익과 정치적 관성의 희생양이 될지가 결정될 것입니다."
 Sweden_foci.10.a: "제안을 승인한다, 유럽은 준비되어야 한다."
 Sweden_foci.10.b: "거부한다, 이는 민간 인프라의 범위를 넘어선다."
 Sweden_foci.101.t: "인프라 구상에 동참한 [From.GetNameWithFlag]"
 Sweden_foci.101.d: "[From.GetNameWithFlag]이(가) 우리의 범유럽 인프라 구상에 참여하겠다고 공식 약속했습니다. 이를 통해 그들은 도로, 항만, 철도가 단순한 경제적 생명선이 아니라 불확실성이 커지는 시대의 전략 자산임을 인정한 것입니다. 그들의 지도부는 신속한 대응과 안전한 공급망, 지역적 회복력을 보장하기 위해 유럽 전역에서 민간 및 군사 물류가 조화되어야 함을 인정했습니다.\n\n이 결정은 양국이 군사적 압박을 견디고 적응하는 능력을 강화하는 동시에 무역과 초국적 협력도 촉진할 것입니다. 막후에서는 이미 군 계획관들이 공동 물류 규약, 사이버 회복력 조치, 비상 기동 경로를 조율하고 있습니다.\n\n그들의 참여는 강력한 메시지를 전합니다. 유럽은 허를 찔리지 않을 것입니다. 인프라에서의 단결은 곧 방위에서의 단결입니다."
 Sweden_foci.101.a: "현명한 결정이다."
 Sweden_foci.102.t: "우리 제안을 거부한 §Y[From.GetNameWithFlag]§!"
 Sweden_foci.102.d: "§Y[From.GetNameWithFlag]§!이(가) 주권 문제, 예산 제약 또는 상이한 우선순위를 이유로 전략 인프라 구상에 참여하라는 우리의 제안을 거절했습니다. 이 결정은 실용적인 것으로 포장되었으나, 결국 장기적인 회복력과 상호 방위 역량에 투자하기를 꺼린다는 신호입니다.\n\n현재의 안보 환경에서 이러한 고립주의적 사고에는 위험이 따릅니다. 통합된 물류가 없다면 신속한 병력 전개는 불확실해집니다. 공유된 표준이 없다면 공급망은 취약한 채로 남습니다. 그리고 정치적 의지가 없다면 유럽의 집단 억지력은 약화됩니다.\n\n유감스럽지만 우리는 뜻을 같이하는 파트너들과 함께 계속 나아갈 것입니다. 군사적 위기가 닥친다면 그들은 아무것도 하지 않은 대가가 단기적 절감액보다 크다는 것을 깨닫게 될지도 모릅니다. 인프라는 사치품이 아니라 주권을 떠받치는 발판입니다."
 Sweden_foci.102.a: "그들의 손해다."
 Sweden_foci.11.t: "사이버실드 구상 참여를 제안하는 §Y[SWE.GetNameWithFlag]§!"
 Sweden_foci.11.d: "오늘날의 세계에서 전쟁은 더 이상 전장이나 재래식 무기에 국한되지 않습니다. 분쟁은 조용하고 세련되며 대중의 눈에는 종종 보이지 않는 형태로 진화했습니다. 사이버 공격, 허위 정보 캠페인, 디지털 사보타주, AI 기반 영향력 공작은 이제 군사 구조뿐 아니라 모든 시민, 기관, 기업에 위협이 되고 있습니다.\n\n§Y[SWE.GetNameWithFlag]§!은(는) 우리에게 사이버실드 구상에 참여할 기회를 제시했습니다. 이는 집단적 사이버 회복력 구축을 목표로 하는 다국적 협력 체계입니다. 이 프로그램에는 공동 감시 센터, 위협 정보 공유, 적대적 침입과 하이브리드전 전술에 대한 공조 대응이 포함됩니다.\n\n해가 지날수록 우리 사회의 디지털화가 심화됨에 따라 사이버 영역은 국가 안보에서 가장 결정적인 무대의 하나가 되고 있습니다. 참여하면 우리의 역량이 강화되고 더 큰 방위 네트워크에 편입될 것입니다. 그러나 제안을 수락하는 것은 어느 정도의 기술적 정렬과 디지털 분야에서의 주권 공유를 의미하기도 합니다."
 Sweden_foci.11.a: "참여하겠다, 함께하면 더 안전하다."
 Sweden_foci.11.b: "우리는 홀로 서겠다, 우리의 힘은 독립에 있다."
 Sweden_foci.111.t: "사이버실드 구상에 동참한 §Y[From.GetNameWithFlag]§!"
 Sweden_foci.111.d: "§Y[From.GetNameWithFlag]§!이(가) 우리의 사이버실드 구상에 참여하기로 공식 합의했습니다. 이 결정은 신뢰할 수 있는 파트너들이 정보를 공유하고, 민간 및 군사 사이버 회복력을 강화하며, 하이브리드 위협에 맞서 단결하는 범유럽 디지털 방위 구조를 구축하는 데 중대한 진전입니다.\n\n통합 과정의 일환으로 위협 탐지, 핵심 인프라 보호, 신속 대응 능력을 위한 공동 규약이 마련될 것입니다. 이 협력은 우리의 작전 상황 인식과 복잡하고 다층적인 사이버 공세를 견디는 능력을 모두 크게 높일 것으로 기대됩니다.\n\n그들의 약속은 우리의 디지털 전선을 강화할 뿐 아니라 21세기의 주권과 전략적 자율성에 대한 공동의 비전을 확인해 줍니다."
 Sweden_foci.111.a: "훌륭하다, 사이버 공간에서의 단결이다."
 Sweden_foci.112.t: "사이버실드 구상을 거부한 §Y[From.GetNameWithFlag]§!"
 Sweden_foci.112.d: "§Y[From.GetNameWithFlag]§!이(가) 사이버실드 구상에 참여하라는 우리의 초청을 거절했습니다. 회의론이나 정치적 계산, 혹은 디지털 비동맹에 대한 바람에서 비롯되었든, 이 결정은 그들이 집단 사이버 보안 체계에 편입되기를 원치 않는다는 신호를 보냅니다.\n\n이 거부는 유럽 전역에서 정보 공유와 디지털 억지의 잠재적 범위를 약화시킬 뿐 아니라, 허위 정보와 사보타주, 적대적 코드가 국경을 가리지 않는 시대에 §Y[From.GetNameWithFlag]§!을(를) 고립시킬 수도 있습니다.\n\n실망스럽지만 그들이 빠진다고 해서 우리의 노력이 멈추지는 않을 것입니다. 우리는 사안의 중대성을 이해하고 그에 맞게 행동할 의지가 있는 이들과 함께 나아갈 것입니다."
 Sweden_foci.112.a: "근시안적인 처사다."
 Sweden_foci.12.t: "상호 경제 포럼을 제안하는 스웨덴"
 Sweden_foci.12.d: "지역 협력과 산업 회복력을 강화하기 위한 조치로 §Y[SWE.GetNameWithFlag]§!이(가) 상호 경제 포럼의 창설을 제안했습니다. 그 취지는 참가국 간의 경제 대화, 투자 조율, 장기적 산업 동반자 관계를 제도화하는 것입니다.\n\n스웨덴은 특히 녹색 기술, 첨단 제조업, 디지털 혁신 분야에서 경제적 유대를 심화하면 성장을 안정시킬 뿐 아니라 갈수록 양극화되는 세계 경제에서 전략적 자율성도 강화할 수 있다고 주장합니다. 공동 조달 프로그램, 공급망 보호 장치, 공동 혁신 기금이 제안된 수단에 포함됩니다.\n\n이 포럼에 참여하면 공동 연구에 대한 접근, 산업 전략의 더 높은 통합, 대륙 규모의 장기적 경쟁력 확보 가능성이 주어집니다.\n\n이제 문제는 이렇습니다. 우리는 이 새로운 구조를 함께 만들어 가고자 합니까, 아니면 밖에 머물겠습니까?"
 Sweden_foci.12.a: "훌륭한 구상이다, 참여하겠다."
 Sweden_foci.12.b: "우리는 관심이 없다."
 Sweden_foci.121.t: "경제 포럼에 동참한 §Y[From.GetNameWithFlag]§!"
 Sweden_foci.121.d: "§Y[From.GetNameWithFlag]§!이(가) 상호 경제 포럼을 설립하자는 우리의 제안을 수락했습니다. 이 결정은 산업 정책의 조율 강화, 지역 공급망 회복력, 혁신 주도 성장을 향한 긍정적인 진전입니다.\n\n에너지 체계, 디지털 시장, 녹색 전환 기술 등의 분야에서의 협력을 모색하는 초기 양자 회담이 이미 진행 중입니다. 이 동맹은 세계 무역 역학이 변화하는 시대에 실용적이고 자급자족적인 경제 발전의 청사진이 될 수 있습니다.\n\n스웨덴의 구상은 추진력을 얻고 있으며, 참가국이 하나 늘 때마다 그 잠재력은 배가됩니다."
 Sweden_foci.121.a: "유망한 동반자 관계다."
 Sweden_foci.122.t: "경제 포럼 초청을 거절한 §Y[From.GetNameWithFlag]§!"
 Sweden_foci.122.d: "§Y[From.GetNameWithFlag]§!이(가) 제안된 상호 경제 포럼에 참여하지 않기로 결정했습니다. 주권에 대한 우려 때문이든, 우선순위의 불일치 때문이든, 경제 전략을 조율하는 데 대한 거부감 때문이든, 이 거절은 강력한 지역 체계가 될 수 있었던 구상의 범위를 제한합니다.\n\n유감스럽지만 스웨덴은 뜻을 같이하는 파트너들과 함께 계속 나아갈 것입니다. 포럼의 목표는 변함이 없습니다. 불확실한 미래에 걸맞은 회복력 있고 협력적인 경제 구조를 만드는 것입니다.\n\n상황이 바뀐다면 문은 여전히 열려 있을 수 있으나, 한번 잃은 추진력은 되찾기 어려울 것입니다."
 Sweden_foci.122.a: "그들의 결정이니, 결과도 그들의 몫이다."
 Sweden_foci.13.t: "전략 싱크탱크 협력을 제안하는 스웨덴"
 Sweden_foci.13.d: "§Y[SWE.GetNameWithFlag]§!이(가) 우리의 주요 싱크탱크, 학술 기관, 정책 자문 기구 간의 협력을 강화하자는 제안을 해 왔습니다. 그 목표는 전략적 전망을 일치시키고, 장기 정책 연구를 조율하며, 지정학적 변화와 하이브리드 위협을 예측할 수 있는 공동 지식 기반을 구축하는 것입니다.\n\n이러한 협력에는 정기 정책 대화, 공동 시나리오 기획, 공동 출판, 전문가 교류 프로그램이 포함될 것입니다. 스웨덴은 지적 자본을 모으면 양국이 전략적 선견지명을 날카롭게 하고 방위, 기술, 에너지 안보, 경제 회복력 분야에서 부상하는 도전에 더 잘 대비할 수 있다고 믿습니다.\n\n이 포럼은 직접적인 정치적 통제로부터 독립적으로 유지되겠지만, 정책 결정에 미치는 영향력은 상당할 수 있습니다. 문제는 이렇습니다. 우리는 함께 생각할 준비가 되었습니까, 아니면 계속 홀로 사고하겠습니까?"
 Sweden_foci.13.a: "아는 것이 힘이다 – 참여하겠다."
 Sweden_foci.13.b: "완전한 자율성을 유지하는 편을 택한다."
 Sweden_foci.131.t: "전략 싱크탱크 네트워크에 동참한 §Y[From.GetNameWithFlag]§!"
 Sweden_foci.131.d: "§Y[From.GetNameWithFlag]§!이(가) 연구 기관, 전략 연구 센터, 정책 자문 싱크탱크로 이루어진 협력 네트워크를 구축하자는 우리의 초청을 수락했습니다. 이 새로운 협력 계층은 체계적인 지적 교류의 비공식 통로를 열어, 국가 전략을 형성하고 허위 정보, 인지전, 정책 파편화에 맞서는 회복력을 구축할 수 있게 합니다.\n\n첫 공동 심포지엄이 이미 기획 중입니다. 주제로는 디지털 주권, 군민 융합, 에너지 전환, 신흥 기술이 국가 안보에 미치는 영향 등이 있습니다.\n\n이는 단순한 학술적 교류를 넘어 사상을 통한 전략적 정렬입니다."
 Sweden_foci.131.a: "현명한 선택이다."
 Sweden_foci.132.t: "전략 싱크탱크 협력을 거절한 §Y[From.GetNameWithFlag]§!"
 Sweden_foci.132.d: "§Y[From.GetNameWithFlag]§!이(가) 더욱 긴밀한 싱크탱크 협력을 위한 스웨덴의 네트워크 제안에 참여하지 않기로 했습니다. 이념적 거리 때문이든, 영향력에 대한 우려 때문이든, 국가적 지적 자율성에 대한 선호 때문이든, 이 거절은 국경을 넘는 전략 대화의 범위를 좁힙니다.\n\n유감스럽지만 이 구상은 의사가 있는 참가국들과 함께 진행될 것입니다. 정보가 전장이고 통찰이 무기인 시대에, 협력 대신 고립을 택하는 것은 대가를 치르게 될지도 모릅니다.\n\n대화는 그들이 있든 없든 계속될 것입니다."
 Sweden_foci.132.a: "미래를 놓치도록 내버려 두자."
 Sweden_foci.14.t: "우리를 합동 군사 훈련에 초청하는 스웨덴"
 Sweden_foci.14.d: "§Y[SWE.GetNameWithFlag]§!이(가) 스웨덴 영토에서 실시되는 연합 군사 훈련에 참여해 달라는 초청장을 보내왔습니다. 이 훈련은 해안 방어, 사이버전 회복력, NATO 표준 부대와 자국 부대의 혼성 신속 전개를 포함한 다영역 방어 시나리오를 모의할 것으로 예상됩니다.\n\n작전상의 이점을 넘어 이는 외교적 신호이기도 합니다. 스웨덴은 신뢰할 만한 안보 파트너임을 보여 주고 있으며, 현실적인 조건에서 자국과 동맹국들의 준비 태세를 시험하고 있습니다. 이 훈련은 우리에게 스웨덴의 역량을 평가하고, 상호운용성을 다듬고, 상호 신뢰를 강화할 기회를 제공합니다.\n\n합동 군사 훈련은 억지이자 준비의 역할을 모두 합니다. 우리가 참여하기로 하는 선택 자체가 하나의 메시지가 될 것입니다."
 Sweden_foci.14.a: "참여하겠다 – 연합된 힘이 진정한 힘이다."
 Sweden_foci.14.b: "거절하겠다 – 우리의 교리는 주권적으로 남는다."
 Sweden_foci.141.t: "스웨덴 군사 훈련에 동참한 §Y[From.GetNameWithFlag]§!"
 Sweden_foci.141.d: "§Y[From.GetNameWithFlag]§!이(가) 다가오는 합동 군사 훈련에 참여하라는 우리의 초청을 수락했습니다. 그들의 참여로 훈련의 범위와 복잡성이 커지며, 지휘 구조, 물류 체계, 실시간 조율 규약 간의 소중한 상호운용성 시험이 추가됩니다.\n\n동맹국 대표단과 제3국 무관들이 이 행사를 면밀히 지켜볼 것으로 예상됩니다. 이 협력은 지역 안보를 눈에 띄게 강화하며, 유능하고 신뢰할 만한 방위 행위자로서 스웨덴의 역할이 커지고 있음을 보여 줍니다.\n\n신뢰는 행동으로 쌓이며, 이 훈련은 말보다 더 큰 목소리로 이야기할 것입니다."
 Sweden_foci.141.a: "잠재적 적대 세력에게 보내는 강력한 신호다."
 Sweden_foci.142.t: "군사 훈련 초청을 거절한 §Y[From.GetNameWithFlag]§!"
 Sweden_foci.142.d: "§Y[From.GetNameWithFlag]§!이(가) 우리가 계획한 군사 훈련에 참여하기를 거절했습니다. 공식적인 이유는 밝히지 않았으나, 이 결정은 정치적 신중함, 물류상의 우려, 혹은 스웨덴이나 NATO의 방위 태세와 지나치게 밀착한 것으로 비치기를 꺼리는 데서 비롯되었을 수 있습니다.\n\n이 불참은 동맹국과 적대 세력 모두가 주목할 수 있습니다. 불확실한 시기에 함께 훈련하려는 의지 혹은 그 부재는 한 국가의 전략적 지향에 대해 많은 것을 말해 줍니다.\n\n그럼에도 훈련은 계속 진행될 것입니다. 모습을 드러내는 이들이 미래를 만들어 갑니다."
 Sweden_foci.142.a: "그들은 연대보다 침묵을 택했다."
 Sweden_foci.143.t: "노르보텐에서 시작된 NATO-스웨덴 합동 훈련"
 Sweden_foci.143.d: "노르보텐 주의 외딴 벌판에 자리한 보덴이 스웨덴 영토에서 열린 역대 가장 야심 찬 군사 훈련 중 하나의 중심지가 되었습니다. 평소에는 순록 방목과 눈 덮인 정적, 핀란드 국경 너머에서 간간이 울려 퍼지는 '페르켈레!'라는 외침으로 더 잘 알려진 이 조용한 북부 지역은 이제 전차, 항공기, 특수 부대의 조율된 움직임으로 웅웅거립니다.\n\n스웨덴-NATO 합동 훈련에는 다양한 현대 전력이 모였습니다. 그리펜과 유로파이터 편대가 하늘에서 겨루고, 여러 레오파르트 파생형이 얼어붙은 지형을 가로지르며 굉음을 울리고, 정예 병력이 부드뷔트레스케트의 얼음 가장자리에서 모의 상륙 작전을 수행합니다.\n\n군사적 장관을 넘어 이 훈련은 하나의 신호입니다. 전략적 대비 태세, 동맹 간 상호운용성, 그리고 스웨덴의 총력 방위 교리가 구체적으로 구현된 것입니다. 이곳에서 민간의 대비와 군의 전문성은 서로 대립하는 가치가 아니라 한 동전의 양면입니다.\n\n§YSi vis pacem, para bellum§!(평화를 원한다면 전쟁을 준비하라)은 단순한 라틴어 수사가 아닙니다. 이는 조용하고 집중적이며 끈질긴 북유럽식 사고방식에 짜여 있는 원칙입니다."
 Sweden_foci.143.a: "더 따뜻한 세계를 위한 차가운 예행연습이다."
 Sweden_foci.23.t: "우리 영토에 대한 영유권을 주장하는 스웨덴"
 Sweden_foci.23.d: "§Y[FROM.GetNameWithFlag]§!이(가) 더욱 깊은 통합을 위한 스웨덴의 제안을 거절했습니다. 국익, 헌법상의 장벽, 혹은 여론이 통합이나 동맹의 전망보다 우선했던 것으로 보입니다.\n\n외교 채널은 계속 열려 있으나, 이 좌절은 스웨덴의 보다 폭넓은 지역 구상에 중대한 고비이며 압박 아래에서 북유럽 단결이 얼마나 취약한지를 보여 줍니다."
 Sweden_foci.23.a: "그들을 정착민으로 받아들여야 한다"
 Sweden_foci.23.b: "그들은 결코 우리 국경을 넘지 못할 것이다"
 Sweden_foci.24.t: "수락된 영토 영유권 주장"
 Sweden_foci.24.d: "§Y[FROM.GetNameWithFlag]§!이(가) 영유권이 주장된 지역에서의 스웨덴의 존재를 수락했습니다. 통제된 정착과 양자 조율 절차로 포장된 이 합의는 사실상 행정적 영향력을 스웨덴에 유리하게 이동시킵니다.\n\n긴장이 완화되고 인프라 사업이 시작되며 공동 통치 장치가 등장하지만, 장기적 주권 문제는 여전히 정치적으로 민감합니다."
 Sweden_foci.24.a: "통합 준비를 시작한다"
 Sweden_foci.25.t: "거부된 영토 영유권 주장"
 Sweden_foci.25.d: "§Y[FROM.GetNameWithFlag]§!이(가) §Y[ROOT.GetNameWithFlag]§!의 영토 영유권 주장을 단호히 거부했습니다.\n\n공식 성명은 국가의 보전을 강조했으며, 분쟁 지역에 대한 스웨덴의 추가 개입은 적대 행위로 간주될 것이라고 경고했습니다. 외교적 어조는 강경해졌고 지역 불안정의 위험이 커지고 있습니다."
 Sweden_foci.25.a: "이를 잊지 않을 것이다"
 Sweden_foci.26.t: "본국 편입을 요구하는 스웨덴계 분리주의자들"
 Sweden_foci.26.d: "우리 지역 중 한 곳의 스웨덴어 사용 분리주의자 집단이 스웨덴 왕국에 의한 병합을 공식 청원했습니다. 이들은 역사적 유대와 문화적 친밀성, 그리고 지방 당국의 차별을 주장합니다.\n\n§Y스웨덴§!은 이 운동을 공식적으로 지지하지 않았으나, 스톡홀름의 여론에서는 '민족 통일'이 거론되고 있습니다."
 Sweden_foci.26.a: "이곳은 우리의 신성한 땅이다"
 Sweden_foci.26.b: "일시적으로는 가져가도 좋다"
 Sweden_foci.27.t: "세력 가입 초청을 보내는 스웨덴"
 Sweden_foci.27.d: "§Y스웨덴§!이 새로 제안한 북유럽 세력에 가입해 달라고 공식 초청해 왔습니다. 중립국, 민주국가, 혹은 비동맹국의 연합으로 포장된 이 동맹은 지역 억지력을 높이고, 방위 정책을 조율하며, 공동의 지정학적 정체성을 구축하는 것을 목표로 합니다.\n\n역사적 유대, 문화적 근접성, 자립에 대한 공통의 관심이 근거로 제시되지만 전략적 함의는 여전히 복잡합니다."
 Sweden_foci.27.a: "훌륭한 구상이다 – 가입해야 한다"
 Sweden_foci.27.b: "취했나? 절대 안 된다"
 Sweden_foci.28.t: "거절된 세력 가입 초청"
 Sweden_foci.28.d: "§Y[FROM.GetNameWithFlag]§!이(가) 북유럽 세력에 가입하라는 스웨덴의 초청을 거절했습니다. 얽매일 위험, 주권 상실, 혹은 스웨덴의 전략적 야망에 대한 회의를 이유로 들며 정부는 거리를 두는 쪽을 택했습니다.\n\n이 거절은 지역 방위 노력의 결속에 의문을 던지며, 북유럽에서 양극화가 심해지고 있다는 신호일 수 있습니다."
 Sweden_foci.28.a: "실망스럽지만 예상했던 일이다"
 Sweden_foci.29.t: "수락된 세력 가입 초청"
 Sweden_foci.29.d: "§Y[FROM.GetNameWithFlag]§!이(가) 북유럽 세력에 공식 가입했습니다. 이 결정은 지역 외교의 결정적 전환점으로, 조율된 군사 대비 태세, 기술 교류, 외교 정책 자율성이라는 스웨덴의 비전에 대한 동조를 확인해 줍니다.\n\n공동 군사 계획과 산업 협력이 뒤따를 가능성이 높으며, 북방에 새로운 세력권이 공고해질 것입니다."
 Sweden_foci.29.a: "두 팔 벌려 환영한다"
 Sweden_foci.30.t: "우리 은행 부문에 대한 스웨덴의 투자"
 Sweden_foci.30.d: "§Y스웨덴§!이 우리 국가 은행 부문을 현대화하고 안정시키기 위한 체계적인 투자 구상을 제안했습니다. 이 제안에는 자본 투입, 북유럽 금융 기술에 대한 접근, 스웨덴의 통화 영향권으로의 장기적 통합이 포함됩니다.\n\n이 프로그램은 유동성과 현대화를 약속하지만, 일각에서는 국가 재정 정책에 대한 외국의 영향력이 커지는 것을 우려합니다."
 Sweden_foci.30.a: "제안을 수락한다 – 자본과 안정이다"
 Sweden_foci.30.b: "거절한다 – 우리는 재정 주권을 지킨다"
 Sweden_foci.31.t: "수락된 은행 투자"
 Sweden_foci.31.d: "§Y[FROM.GetNameWithFlag]§!이(가) 자국 은행 체계에 투자하겠다는 우리의 제안에 동의했습니다. 스웨덴의 자본과 금융 거버넌스 모델이 단계적으로 도입되어 현대화와 영향력을 모두 가져올 것입니다.\n\n이는 스웨덴의 경제적 영향권을 심화시키며, 재정 규제의 추가 조화와 지역 통화 조율의 길을 열 수 있습니다."
 Sweden_foci.31.a: "강력한 금융 교두보다"
 Sweden_foci.32.t: "거부된 은행 투자"
 Sweden_foci.32.d: "§Y[FROM.GetNameWithFlag]§!이(가) 자국 은행 부문에 투자하겠다는 우리의 제안을 거절했습니다. 국가 자율성에 대한 우려, 정치적 반발, 혹은 경쟁 동맹 때문에 내려진 이 결정은 스웨덴의 경제적 접근에 대한 분명한 선을 긋는 것입니다.\n\n향후 협력이 지연될 수 있으며, 공동 사업에 대한 신뢰는 적어도 당분간은 약화되었습니다."
 Sweden_foci.32.a: "그들의 손해지 우리 손해가 아니다"
 Sweden_foci.33.t: "'유연한' 경제 지원을 제안하는 스웨덴"
 Sweden_foci.33.d: "스웨덴 대표단이 금융 및 전략 부문에 대한 직접 투자를 통해 '우리의 성장 잠재력을 열어 주겠다'는 제안을 가지고 도착했습니다. 이 패키지는 개발 자금과 물류 지원을 약속하지만, 규제 완화, 내부자 접근, 특정 외국 이익과의 보조 맞추기라는 비공식적 기대가 포함되어 있습니다.\n\n실용적인 협력으로 보든 은밀한 간섭으로 보든, 이 거래는 경제 원조와 영향력 사이의 경계를 흐립니다."
 Sweden_foci.33.a: "수락하되 부패를 억제하도록 엄격한 감독을 시행한다"
 Sweden_foci.33.b: "우리 개인에게 이득이 없다면 굳이 왜 하겠는가?"
 Sweden_foci.331.t: "수락된 투자 협정"
 Sweden_foci.331.d: "§Y[FROM.GetNameWithFlag]§!이(가) 전략적 경제 협력에 대한 우리의 제안을 수락했습니다. 그 정부는 특정 개발 원조와 비공식적 영향력을 대가로 일부 부문을 스웨덴 자본에 개방하기로 합의했습니다. 장기적 정렬로 가는 문이 이제 조용하지만 효과적으로 열렸습니다."
 Sweden_foci.331.a: "은밀한 성공이다"
 Sweden_foci.332.t: "거부된 투자 제안"
 Sweden_foci.332.d: "§Y[FROM.GetNameWithFlag]§!이(가) 우리의 투자 구상을 거절했습니다. 공식적으로는 국가 주권과 투명성에 대한 우려를 이유로 들며, 그 정부는 제안된 거래를 포기하기로 했습니다. 이 거절로 당분간 이 지역에서 우리의 영향력이 제한됩니다."
 Sweden_foci.332.a: "그들은 후회할 것이다"
 Sweden_Forsvarsbeslutet.1.t: "새로운 위임, 군사의 길"
 Sweden_Forsvarsbeslutet.1.d: "선거가 끝났습니다. 새 정부가 출범하며, 전통에 따라 국왕 폐하께서 릭스다그(의회) 개회 연설을 낭독하실 것입니다.\n\n라플란드의 외로운 숲에서 외레순 다리까지, 바람에 깎인 고틀란드의 절벽에서 눈 덮인 헬라그스피엘의 봉우리까지, 스웨덴 국민이 귀를 기울입니다.\n\n우리 군을 어떤 방향으로 이끌 것입니까? 연대를 가까이 두고 대비 태세를 날카롭게 유지하며 조국을 방어하는 역량을 강화하겠습니까? 위험이 따르지만 위협을 국경에서 멀리 떼어 놓을 수 있는 연합과 평화유지 임무에 참여하여 해외로 힘을 투사하겠습니까? 아니면 현재의 평온을 받아들여 자원을 다른 곳으로 돌리고 외교와 평화를 신뢰하겠습니까?\n\n정부는 위임을 받았습니다. 이제 선택해야 합니다."
 Sweden_Forsvarsbeslutet.1.o1: "본토 방위 역량을 강화한다."
 Sweden_Forsvarsbeslutet.1.o2: "해외에서 행동할 수 있는 능력을 확대한다."
 Sweden_Forsvarsbeslutet.1.o3: "군을 축소한다."
 Sweden_Forsvarsbeslutet.2.t: "강철과 전략의 문제"
 Sweden_Forsvarsbeslutet.2.d: "길은 정해졌습니다. 우리 정부는 스웨덴 군을 강화하기로 했습니다. 그러나 강함에는 여러 형태가 있습니다.\n\n한쪽 진영의 목소리는 분명합니다. 신형 STRV 122 전차와 CV 90 보병전투차를 구매하자는 것입니다. 검증된 장비이며 우리 장병들에게 익숙하고, 그것이 만들어진 숲과 들판에 배치할 준비가 되어 있습니다.\n\n다른 이들은 신중을 촉구합니다. 내일의 세계가 새로운 체계와 더 영리한 설계를 요구할 텐데 왜 지금 돈을 쓰느냐고 묻습니다. 차세대 스웨덴 방위를 형성할 수 있는 개발 엔지니어, 연구소, 아이디어에 투자하는 편이 낫다는 것입니다.\n\n그리고 숫자를 보는 이들이 있습니다. 냉정한 재정 한계입니다. 그들은 재무부의 스프레드시트를 가리키며 고개를 젓습니다. 의지는 있을지 몰라도 돈은 없습니다.\n\n릭스다그(의회)는 다시 한번 결정해야 합니다."
 Sweden_Forsvarsbeslutet.2.a: "신형 STRV 122와 CV 90을 주문한다 – 지금 여기서 얻는 믿음직한 전력이다."
 Sweden_Forsvarsbeslutet.2.b: "대신 연구개발에 투자한다 – 차세대를 준비한다."
 Sweden_Forsvarsbeslutet.2.c: "단순히 감당할 수 없다 – 올해는 안 된다."
 Sweden_Forsvarsbeslutet.3.t: "우리 머리 위의 하늘"
 Sweden_Forsvarsbeslutet.3.d: "현대의 육군은 그 위를 나는 날개만큼만 강합니다. 재개된 방위 노력의 일환으로, 이제 우리는 공군의 미래를 결정해야 합니다.\n\n그리펜은 빠르고 민첩하며 자랑스러운 스웨덴산입니다. 일부는 새로운 조달 주기를 촉구하며, 오늘 우리가 신뢰하는 항공기로 편대를 늘려 내일의 하늘에 대비하자고 합니다.\n\n다른 이들은 다른 길을 주장합니다. 그들은 미래의 위협이 공중전이 아니라 스텔스, 센서, 정밀성이라는 체계에 있다고 봅니다. 그들에 따르면 자금은 배치가 아니라 개발에 들어가야 합니다.\n\n그러나 재무부의 조용한 방에서는 분위기가 더 냉정합니다. 열의는 예산 상한과 맞닥뜨리고, 애국심은 회계와 맞닥뜨립니다.\n\n정부는 다시 한번 선택해야 합니다."
 Sweden_Forsvarsbeslutet.3.a: "신형 JAS 39 그리펜 전투기를 주문한다 – 내일의 하늘에 대비한다."
 Sweden_Forsvarsbeslutet.3.b: "항공우주 연구개발에 투자한다 – 다음 도약을 설계한다."
 Sweden_Forsvarsbeslutet.3.c: "올해는 날개를 살 돈이 없다."
 Sweden_Forsvarsbeslutet.4.t: "강철, 궤도, 그리고 날개"
 Sweden_Forsvarsbeslutet.4.d: "육지와 하늘. 강철과 제트 엔진. 스웨덴 방위의 심장은 언제나 함께 작동하는 전력들의 조화에 놓여 있었습니다.\n\n일부는 전력을 다해야 한다고 제안합니다. 신형 STRV 122 전차, CV 90 보병전투차, 그리고 새로운 그리펜 전투기 편대를 조달하자는 것입니다. 총력방위(Totalförsvaret)를 교리에 그치지 않고 현실로 만드는 전방위 현대화입니다.\n\n다른 이들은 인내를 제안합니다. 더 가볍고, 더 영리하고, 더 효율적인 미래의 설계에 투자하는 편이 낫다는 것입니다. 내일이면 구식이 될 것을 오늘 만들어서는 안 됩니다.\n\n그리고 물론 현실이 문을 두드립니다. 스프레드시트와 한계, 다른 곳에 한 약속들이 있습니다. 야망은 긴축과 마주칩니다. 국고는 바닥이 없지 않습니다.\n\n이제 강함이 어떤 모습이어야 하는지 결정할 때입니다."
 Sweden_Forsvarsbeslutet.4.a: "CV 90, STRV 122, 그리펜을 구매한다 – 지금 현대적인 군대를 갖춘다."
 Sweden_Forsvarsbeslutet.4.b: "장기 기술에 집중한다 – 차세대를 먼저 단련한다."
 Sweden_Forsvarsbeslutet.4.c: "하고 싶지만 감당할 수 없다."
 Sweden_Forsvarsbeslutet.10.t: "2000년 국방 결의: 가위인가 방패인가?"
 Sweden_Forsvarsbeslutet.10.d: "릭스다그(의회)의 목재 패널 복도에서는 찻잔이 부딪히는 소리와 함께, 추운 1월 아침의 절박함을 닮은 조용조용한 협상이 펼쳐집니다. 국방위원회가 조사 결과를 발표하고, 회의장은 고개를 끄덕이는 이들과 찌푸린 눈살, 그리고 번역 불가능한 스웨덴식 절제된 타협의 기술로 가득 찹니다.\n\n수도 밖의 분위기는 다릅니다. 보덴과 레빙에헤드에서는 장교들이 자신의 연대가 또 한 차례의 감축에서 살아남을지 의아해합니다. 징집병 막사는 마땅한 것보다 더 비어 보입니다. 전국에서 사람들은 신문 머리기사를 읽고 한숨을 쉽니다. 한 손에는 스프레드시트를, 다른 손에는 중립의 원칙을 쥔 채 안보 정책을 논하는 것은 결국 매우 스웨덴다운 일입니다.\n\n새로운 국방 결의는 지출 축소, 부대 통합, 상비군 규모 축소를 제안합니다. 비판자들은 예측할 수 없는 세계에서 방위 태세가 약화될 것이라고 경고합니다. 지지자들은 평화로운 시기의 재정적 책임이라고 부릅니다. 늘 그렇듯 최종 결과는 타협입니다.\n\n우리는 군축을 하는 것이 아닙니다. 그러나 조용히, 공손하게, 절차에 대한 깊은 우려와 함께 줄어들고 있습니다.\n\n총력방위(Totalförsvaret)는 문서상으로 남아 있습니다. 실제로도 남을지는... 미래가 무엇을 요구하느냐에 달려 있습니다."
 Sweden_Forsvarsbeslutet.10.a: "스웨덴은 연대 체제의 덕을 볼 것이다"
 Sweden_Forsvarsbeslutet.10.b: "스웨덴은 여단 체제를 유지한다"
 Sweden_Forsvarsbeslutet.11.t: "개혁의 시계태엽"
 Sweden_Forsvarsbeslutet.11.d: "잉크가 채 마르지 않았습니다. 외레순의 얼어붙은 해안선에서 라플란드의 서리 내린 들판에 이르기까지, 군인과 공무원과 일반 시민 모두가 다음 신호를 기다립니다. 새 국방 결의는 언제 발효됩니까?\n\n참모 회의와 시민 회관에서 이 질문은 아침 커피의 김처럼 맴돕니다. 부대들은 자신의 예산이 언제 바뀔지 궁금해합니다. 지자체들은 인프라 계획을 힐끗 살핍니다. 일부는 움직일 준비가 되어 있고, 다른 이들은 조용한 논의를 한 차례 더 하기를 선호합니다.\n\n이것이 스웨덴식입니다. 차분하고, 절제되고, 신중합니다. 아무도 소리치지 않습니다. 아무도 허둥대지 않습니다. 그러나 모두가 압니다. 총력방위(Totalförsvaret)는 기계가 잘 기름칠되고 톱니바퀴가 맞물려 돌아갈 때에만 작동한다는 것을.\n\n이제 시기의 문제가 남았습니다. 할지 말지가 아니라 언제 할지입니다."
 Sweden_Forsvarsbeslutet.11.a: "약 6개월 후면 준비될 것이다."
 Sweden_Forsvarsbeslutet.11.b: "단계적으로 도입하는 편이 낫다. 내년에 시작한다."
 Sweden_Forsvarsbeslutet.11.c: "최대한 빨리 시행한다."
 Sweden_news.1.o1: "북유럽에 새로운 금융 거인이 등장한다."
 Sweden_news.2.t: "북유럽-발트 협력 심화"
 Sweden_news.2.d: "오늘 스웨덴, 노르웨이, 덴마크, 핀란드, 아이슬란드, 에스토니아, 라트비아, 리투아니아의 대표들이 북유럽-발트 8개국(NB8) 동반자 관계를 강화하는 공식 선언문에 서명했습니다. 이 지역 체계는 외교, 방위, 디지털 인프라, 기후 회복력 등의 분야에서 정책 논의를 조율할 것입니다.\n\n군사 동맹은 아니지만, NB8은 역내 지정학적 불확실성 증대에 대한 전략적 대응으로 널리 간주됩니다. 관찰자들은 이것이 공유된 외교적 비중과 통합된 지역 정책 장치를 갖춘 북방 블록으로 발전할 잠재력이 있다고 지적합니다."
 Sweden_news.2.o1: "공통의 이익과 지리를 통한 단결이다."
 Sweden_news.3.t: "NORDCAPS 연합 출범"
 Sweden_news.3.d: "스톡홀름은 가맹국 간 공동 방위 계획, 상호운용성, 정보 공유를 강화하기 위해 고안된 새로운 스칸디나비아 구상인 북유럽 평화·안보 조율 접근법(Nordic Coordinated Approach to Peace and Security), 즉 NORDCAPS의 결성을 발표했습니다.\n\n공식 군사 동맹은 아니지만, NORDCAPS는 스웨덴, 노르웨이, 덴마크, 핀란드 간의 체계적인 안보 협력을 위한 플랫폼 역할을 할 것입니다. 지지자들은 이를 기존 유럽 방위 구조를 보완하는 유연하고 북유럽 주도의 체계로 봅니다.\n\n앞으로 훈련, 위기 조율, 공동 전략 평가가 이 협력의 중추를 이룰 것입니다."
 Sweden_news.3.o1: "스칸디나비아가 함께 선다."
 Sweden_news.4.t: "우리 주변 어디에나 있는 훈련"
 Sweden_news.4.d: "스웨덴의 조용한 마을과 시골길 곳곳에서 엔진의 굉음과 제트 터빈의 포효가 평소의 고요함을 대신했습니다. JAS 39 그리펜 전투기가 임시 활주로에서 이착륙하고, 평범한 고속도로가 이제 방공의 발진 지점으로 쓰입니다. 스몰란드와 베름란드의 울창한 숲에서는 STRV 122 전차와 CV 90 보병전투차가 강철 포식자처럼 덤불 속을 누빕니다. 훈련용 탄약 소리가 풍경 속에 메아리칩니다.\n\n많은 민간인들은 깨닫기 시작합니다. 우리는 군사 훈련의 한복판에 있다는 것을. 총력방위(Totalförsvaret)는 단순한 이론이 아니라 삶으로 겪는 경험입니다. 온 나라가 훈련의 일부입니다.\n\n어떤 이들은 대비에서 안도감을 느낍니다. 다른 이들은 그것이 내포하는 바의 무게를 느낍니다."
 Sweden_news.4.o1: "국가가 하나로 훈련한다."
 Sweden_news.5.t: "전략 요새화 진행 중"
 Sweden_news.5.d: "숲이 방해받지 않고 서 있던 자리에 콘크리트 벽이 올라갑니다. 공병들은 강철 그물과 성형 폭약으로 교량을 보강합니다. 북쪽에서는 벙커가 화강암 속으로 파고들고, 남쪽에서는 대전차 참호가 흉터처럼 농지를 가로지릅니다.\n\n이는 과거로의 회귀가 아니라 현대 방위의 모습입니다. 외스테르순드에서 칼스크로나까지 스웨덴은 대비 태세를 갖춥니다. 모든 검문소, 모든 참호, 모든 보강된 터널이 메시지입니다. 우리는 준비 없이 허를 찔리지 않을 것입니다.\n\n총력방위(Totalförsvaret)는 지형을 요새로 바꿉니다. 이 나라는 잠들지 않고 이를 악뭅니다."
 Sweden_news.5.o1: "숲이 우리와 함께 싸우게 하라."
 Sweden_news.6.t: "전선을 위한 지도자 양성"
 Sweden_news.6.d: "교실과 실탄 사격장에서 스웨덴의 미래 지휘관들이 단련되고 있습니다. 전술 이론은 연막 훈련과 모래판 연습으로 이어지고, 몇 분 안에 내려야 하는 결정의 압박은 본능을 교리로 단단하게 다집니다.\n\n국방대학에서 외딴 대대 초소에 이르기까지, 장교들은 질서와 혼돈을 가르는 기량을 갈고닦습니다. 총력방위(Totalförsvaret)에서 리더십은 선택이 아니라 생존의 핵심 고리입니다.\n\n우리는 전쟁이 가르쳐 주기를 기다리지 않습니다. 미리 준비합니다."
 Sweden_news.6.o1: "예리한 지성이 안정된 손을 이끈다."
 Sweden_news.7.t: "제복을 입은 국민"
 Sweden_news.7.d: "그들은 색 바랜 위장복을 입고 표준 지급 소총과 집에서 가져온 보온병을 들고 도착합니다. 그들은 교사이고, 정비공이고, 학생이며, 시민입니다. 그러나 이번 주에는 향토방위대(Hemvärnet)입니다.\n\n숲과 농지 곳곳에서 향토 방위 훈련이 놀라울 만큼 현실감 있게 펼쳐집니다. 도로 차단물이 하룻밤 사이에 세워집니다. 통신은 등화관제 조건에서 시험됩니다. 야전 취사장은 대대를 먹입니다. 아이들은 현관에서 호송대가 지나가는 것을 지켜봅니다.\n\n이는 군이 국민에게 다가오는 것이 아닙니다. 국민이 군이 되는 것입니다."
 Sweden_news.7.o1: "평시에 대비하고 위기에 대응한다."
 Sweden_news.8.t: "시작되는 귀환 행군"
 Sweden_news.8.d: "헬멧이 벗겨집니다. 검문소가 사라집니다. 한때 장갑차가 순찰하던 도로에는 이제 자전거와 여름철 차량이 오갑니다. 동원되었던 향토방위대(Hemvärnet) 부대들은 해산하며, 땅에 남은 바퀴 자국과 이동의 기억만을 남겨 둡니다.\n\n그러나 무언가가 남아 있습니다. 소대를 맞이한 모든 마을과 훈련을 위해 벌채된 모든 숲에는 미묘한 변화가 있습니다. 우리는 일상으로 돌아왔지만, 이제 그 일상은 대비가 어떤 느낌인지를 압니다.\n\n총력방위(Totalförsvaret)는 안보가 두려움의 부재가 아니라 대비 태세의 존재임을 가르쳐 주었습니다."
 Sweden_news.8.o1: "일상이지만, 다시는 순진하지 않다."
 Sweden_news.9.t: "대비 태세를 요구받은 국가"
 Sweden_news.9.d: "활성화 명령은 동이 튼 직후에 내려왔습니다. 몇 시간 만에 군복이 꺼내지고, 무기가 수령되고, 무전기가 지직거리며 살아났습니다. 스웨덴 전역의 마을과 초소에서 동원의 조용한 기계장치가 윙윙거리기 시작했습니다.\n\n향토방위대(Hemvärnet)는 의식 없이 도착합니다. 그저 나타납니다. 도로 교차로가 확보됩니다. 통신 거점에 요원이 배치됩니다. 숲은 다시 움직임으로 속삭입니다.\n\n공황은 없습니다. 오직 결의뿐입니다. 이 나라는 이 순간을 위해 훈련해 왔습니다. 이제 그것을 실행에 옮깁니다."
 Sweden_news.9.o1: "평범한 사람들. 비범한 대비 태세."
 Sweden_news.10.t: "2000년 국방 결의 발효"
 Sweden_news.10.d: "새로운 구조가 자리를 잡았습니다. 전국에서 장갑차 행렬이 조용한 마을을 미끄러지듯 지나 재편된 주둔지로 향합니다. 아이들은 학교 옆을 구르며 지나가는 강철 거인들을 경외심 속에 바라보고, 대비 태세의 굉음이 그들의 상상력을 자극합니다.\n\n보덴, 셰브데, 엔셰핑에서 삶이 바뀌기 시작합니다. 젊은 여성들은 울타리에 기대어 전국 방방곡곡에서 도착하는 징집병들, 의무에 이끌려 북쪽에 온 낯선 얼굴들을 지켜봅니다. 눈에는 익숙한 반짝임이 있고, 전통과 공동 복무의 느린 리듬에 대한 인정이 있습니다.\n\n부대의 수는 바뀌었습니다. 스웨덴 방위의 지도는 다시 그려졌습니다. 그러나 본질은 그대로입니다. 사람, 목적, 그리고 대비 태세입니다. *총력방위(Totalförsvaret)*는 사라지지 않았습니다. 더 적지만 더 튼튼한 토대로 옮겨 갔을 뿐입니다."
 Sweden_news.10.a: "새 천년이 시작되었다"
 Sweden_news.11.t: "변화하는 세계 속의 연속성"
 Sweden_news.11.d: "재무부의 지친 눈을 한 몇몇 예산 분석가들은 이처럼 상당한 규모의 군을 유지하기로 한 결정에 눈에 띄게 불만이지만, 모두가 그들의 우려를 공유하는 것은 아닙니다. 보덴에서는 이제 직업 군인으로 가는 실질적인 길이 열린 한 무리의 젊은 징집병들이 눈 덮인 안뜰에서 즉흥적으로 *댄싱 퀸*을 부르기 시작했습니다. 일부는 풍자이고 일부는 자부심인, 묘하게 감동적인 장면입니다. 보기 드문 감정의 순간이 온 나라에 물결칩니다.\n\n국사에는 대개 과묵하신 국왕 폐하께서도 릭스다그(의회) 의원들의 지혜에 감사하고 오랫동안 스웨덴 독립의 기둥으로 서 온 전통을 지켜 준 데 대해 손수 편지를 쓰셨습니다."
 Sweden_news.11.a: "지킬 가치가 있는 구조다."
 Sweden_news.12.t: "암호화폐에 투자하는 스웨덴 국가 기금"
 Sweden_news.12.d: "스웨덴은 통화 정책에서 대담한 행보로 알려진 적이 없지만, 세계 금융 혁신의 속도는 망설임 자체를 위험으로 만들었습니다. 오늘 역사적인 발표에서 국왕은 국가 연금 기금이 암호화폐와 심지어 암호화폐 채굴 사업에까지 직접 투자하여 포트폴리오를 확대하도록 승인될 것이라고 선언했습니다.\n\n지지자들은 이 결정이 스웨덴 경제의 미래 대비를 위해 선견지명이 있고 필요하다고 환영하는 반면, 비판자들은 디지털 자산을 둘러싼 변동성과 불확실성을 경고합니다.\n\n그럼에도 암호화폐의 시대는 공식적으로 스웨덴의 금융 심장부에 도달했습니다."
 Sweden_news.12.a: "미래를 향한 대담한 걸음이다."
 Sweden_news.20.t: "아겐다: \\"중립의 대가\\""
 Sweden_news.20.d: "아겐다는 최신 방송에서 '중립의 대가'를 다루었습니다. 경제학자, 전직 외교관, 군 관계자들이 스웨덴의 비동맹 노선이 가져오는 실질적 비용과 이익을 두고 토론했습니다. \\"우리는 영향력을 포기하는 대신 독립을 지킵니다\\"라고 한 전문가는 말했습니다. 다른 이들은 안보 협력과 무기 개발에서 놓친 기회를 지적했습니다. 이 방송은 냉혹한 진실을 강조했습니다. 중립은 자유를 제공하지만, 종종 영향력과 접근성, 보장을 희생하는 대가를 치른다는 것입니다. 세계가 더욱 불안정해질수록, 낡은 모델은 새로운 질문에 직면합니다."
 Sweden_news.20.a: "원칙의 대가는 좀처럼 싸지 않다."
 Sweden_news.21.t: "아겐다: \\"장관에게 물어보세요 – 방위에 관한 공개 대화\\""
 Sweden_news.21.d: "아겐다는 '장관에게 물어보세요'라는 제목의 생방송 코너를 내보냈으며, 시민들이 스웨덴 국방부 장관에게 직접 질문했습니다. 주제는 군사비 지출에서 전략적 동반자 관계까지 다양했습니다. 중립에 관한 질문에 장관은 \\"우리의 정책은 세계에 적응하지만 우리의 원칙은 변하지 않습니다\\"라고 답했습니다. 일부는 그 개방성을 칭찬했지만, 다른 이들은 답변이 얼버무리는 것이라고 평했습니다. 시청자들은 이것이 의미 있는 대화였는지, 세련된 홍보에 불과했는지 곱씹게 되었습니다. 한 가지는 분명했습니다. 대중의 신뢰는 관리하는 것이 아니라 얻어내는 것이라는 점입니다."
 Sweden_news.21.a: "국민이 지켜보고 판단한다."
 Sweden_news.22.t: "아겐다: \\"안보 의식인가, 조용한 동원인가?\\""
 Sweden_news.22.d: "아겐다는 '안보 의식인가, 조용한 동원인가?'라는 제목의 방송에서 정보와 경보 사이의 미묘한 경계를 다루었습니다. 정부 전단과 공익 광고가 늘어나는 가운데, 토론자들은 이것이 투명성의 반영인지 은근한 군사화인지를 논쟁했습니다. \\"우리는 준비하라는 요구를 받고 있지만, 정확히 무엇에 대해서입니까?\\"라고 한 커뮤니케이션학 교수는 물었습니다. 다른 이들은 민주 국가가 두려움 없이 민간의 대비를 육성해야 한다고 주장했습니다. 이 방송은 커지는 불안을 포착했습니다. 스웨덴은 전쟁을 준비하고 있는가, 아니면 대중의 마음을 준비시키고 있는가?"
 Sweden_news.22.a: "메시지는 분명하지만 동기는 그렇지 않다."
 Sweden_news.23.t: "아겐다: \\"시민을 대비시키려는 상징적 캠페인?\\""
 Sweden_news.23.d: "아겐다는 스웨덴 당국이 민방위와 국가 안보에 대한 인식을 높이기 위해 최근 시작한 대국민 캠페인을 조사했습니다. '시민을 대비시키려는 상징적 캠페인?'이라는 제목의 이 코너는 이 구상에 실체가 있는지, 아니면 단지 상징적 의도에 그치는지를 따졌습니다. \\"대비라기보다 연극에 가깝습니다\\"라고 한 게스트는 말했습니다. 다른 이들은 이 프로그램이 대중의 회복력을 구축하기 위한 필수적인 첫걸음이라고 옹호했습니다. 이 방송은 커지는 위험을 인식하면서도 어떻게 대응할지 확신하지 못하는, 조용한 긴장 속의 사회를 포착했습니다."
 Sweden_news.23.a: "국민의 대비 태세는 사실이라기보다 여전히 희망에 가깝다."
 Sweden_news.24.t: "아겐다: \\"스웨덴의 길 – 이상주의와 현실 정치 사이\\""
 Sweden_news.24.d: "아겐다는 '스웨덴의 길'이라는 사려 깊은 토론에서 스웨덴의 도덕적 외교가 여전히 외교 정책 행태와 일치하는지 탐구했습니다. \\"우리는 가치로 이끈다고 주장하지만,\\" 한 기자는 말했습니다. \\"우리의 무기 수출과 동맹 전략은 그렇지 않음을 시사합니다.\\" 토론은 UN 평화유지 활동에서 군산 거래에 이르기까지 모든 것을 다루었습니다. 코너는 도발적인 질문으로 마무리되었습니다. '스웨덴의 길'은 지도 원칙인가, 아니면 냉소적인 세상 속의 브랜딩 작업에 불과한가?"
 Sweden_news.24.a: "도덕적 예외주의의 신화가 검증대에 오른다."
 Sweden_news.25.t: "아겐다: \\"오늘날 중립은 우리에게 무엇을 의미하는가?\\""
 Sweden_news.25.d: "아겐다는 '오늘날 중립은 우리에게 무엇을 의미하는가?'라는 날카로운 질문을 던졌습니다. 이 코너에서는 스웨덴 중립의 유산과 미래를 둘러싼 열띤 토론이 펼쳐졌습니다. 학자들은 서방 군대와의 협력이 전통적 가치를 훼손하는지를 논쟁했습니다. 한 퇴역 장군은 \\"중립은 언제나 고립이 아니라 전략적 독립에 관한 것이었습니다\\"라고 주장했습니다. 청중에게 남은 것은 명확한 답이 아니라, 한때 국가의 초석이었던 이 개념이 새로운 지정학적 현실에 비추어 깊은 재고가 필요하다는 인식뿐이었습니다."
 Sweden_news.25.a: "스웨덴 정체성의 핵심 신조가 재정의되고 있다."
 Sweden_news.26.t: "아겐다: \\"다극 세계 – 기회인가 위협인가?\\""
 Sweden_news.26.d: "이번 주 아겐다는 다극 세계 질서가 스웨덴에 미치는 영향을 검토했습니다. 방송에는 방위 분석가와 외교 정책 학자들이 출연하여, 미국 지배력이 줄어든 세계 체제가 스웨덴의 자율성에 기회를 만드는지 더 큰 위험을 초래하는지를 토론했습니다. 한 전문가는 \\"다극성은 평화를 의미하지 않으며, 예측 불가능성을 의미합니다\\"라고 경고했습니다. 다른 이들은 스웨덴이 새로운 균형 세력으로부터 이익을 얻을 수 있다고 반박했습니다. 주요 국가들이 재편되는 가운데, 이 프로그램은 스웨덴이 전략적 민첩성을 유지해야 하는지, 아니면 편을 고르기 시작해야 하는지라는 새로운 딜레마를 부각했습니다."
 Sweden_news.26.a: "스웨덴은 변화하는 세계에서 자신의 입지를 성찰한다."
 Sweden_news.27.t: "아겐다: \\"또 다른 유럽\\""
 Sweden_news.27.d: "아겐다의 '또 다른 유럽' 코너는 스웨덴 국민에게 대륙에서 자신의 위치를 재검토하도록 권했습니다. 토론자들은 스웨덴이 역사적으로 단순한 동서 구분에 어떻게 맞지 않았는지를 논의했습니다. \\"우리는 유럽의 일부이지만\\" 한 역사학자는 말했습니다. \\"NATO와 EU 양쪽에서 종종 외부인처럼 느낍니다.\\" 대화는 유럽 정치의 '제3의 공간', 즉 독자적인 길을 걷는 중립적 민주 국가들의 영역이라는 개념을 탐구했습니다. 그러나 방송은 이런 질문도 던졌습니다. 이 비전은 현실적인가, 아니면 갈수록 양극화되는 세계에서의 향수 어린 신화 만들기인가?"
 Sweden_news.27.a: "스웨덴 국민은 자신들이 진정 어디에 속하는지 자문한다."
 Sweden_news.28.t: "아겐다: \\"오만한 서방 탓하기?\\""
 Sweden_news.28.d: "어젯밤 SVT의 아겐다 방송에서 '오만한 서방 탓하기?'라는 주제는 열띤 토론을 불러일으켰습니다. 스튜디오에는 전직 대사, 정책 분석가, 학자들이 모여 서방 지도력과의 거리를 넓혀 가는 스웨덴의 흐름이 환멸에 뿌리를 두고 있는지를 성찰했습니다. 한 게스트는 \\"서방 강대국들이 대화가 아닌 복종을 기대한다는 인식이 커지고 있습니다\\"라고 지적했습니다. 또 다른 게스트는 \\"중립은 굴복이 아니라 입장입니다\\"라고 덧붙였습니다. 이 대화는 스웨덴 사회 내에서 커지는 비판을 부각했습니다. 국제 정치에서 소외되는 것은 중립의 문제가 아니라 자존심의 문제일 수 있다는 것입니다."
 Sweden_news.28.a: "논쟁은 저녁 식탁과 신문에서 계속된다."
 Sweden_news.29.t: "아겐다: \\"새로운 동방 정책?\\""
 Sweden_news.29.d: "어젯밤 아겐다는 주류 정치에서 좀처럼 제기되지 않는 질문을 던졌습니다. '스웨덴은 동쪽과 다시 관계를 맺어야 하는가?' 이 주제는 냉전에 대한 향수가 아니라 러시아 및 그 이웃 국가들과의 실용적 외교를 가리켰습니다. 비판자들은 이를 순진하다고 평했습니다. \\"침략 위에서는 신뢰를 쌓을 수 없습니다\\"라고 한 토론자는 말했습니다. 그러나 다른 이들은 고립이 적대감만 강화한다고 주장했습니다. \\"대화가 지지는 아닙니다\\"라고 전직 대사는 맞받았습니다. 이 방송은 스웨덴이 서방과 전략적으로 전적으로 정렬한 것이 외교적 유연성을 줄였는지에 대한 불편한 성찰을 불러일으켰습니다. 선별적 관여가 지역 안정으로 가는 길일까요, 아니면 위험한 환상일까요?"
 Sweden_news.29.a: "동방 대화라는 발상은 기억과 반대를 모두 불러일으킨다."
 Sweden_news.30.t: "아겐다: \\"스웨덴 전략 사상 구축\\""
 Sweden_news.30.d: "아겐다는 국가 회복력에서 흔히 간과되는 틈, 즉 강력하고 독립적인 스웨덴 전략 연구 역량의 부재를 탐구했습니다. '스웨덴 전략 사상 구축'이라는 제목의 이 코너는 안보, 외교, 지정학에 초점을 맞춘 국립 싱크탱크를 설립하려는 새로운 노력을 소개했습니다. \\"우리는 세계관의 너무 많은 부분을 남에게 외주 주었습니다\\"라고 한 정책 연구원은 말했습니다. 토론은 스웨덴의 외교 정책 사고 중 얼마나 많은 부분이 개념적이기보다 반응적인가로 옮겨 갔습니다. 결론은 이렇습니다. 스웨덴이 자율성을 원한다면 먼저 자신의 이익을 자신의 방식으로 이해해야 합니다."
 Sweden_news.30.a: "주권적 목소리는 주권적 사상에서 시작된다."
 SWE_idea_swedish_legacy: "스웨덴의 유산"
 SWE_idea_swedish_legacy_desc: "우리 규모의 나라 중에서 수 세기에 걸친 지정학적 압박 속에서도 이처럼 오랜 독립을 유지해 온 나라는 드뭅니다. 스웨덴의 유산은 중립, 혁신, 그리고 공격성 없는 군사적 역량입니다. 구스타브 시대의 개혁에서 냉전기의 무장 중립 교리에 이르기까지, 스웨덴 모델은 대비 태세를 통한 억지력과 깊이 뿌리내린 사회의 방어 의지 위에 세워져 있습니다.\n\n이 유산 속에서 우리는 정체성과 책무를 함께 발견합니다."
 SWE_idea_Armestaben: "육군 참모부(Arméstaben) – 중앙 육군 사령부"
 SWE_idea_Armestaben_desc: "육군 작전의 신경 중추로 재설치된 육군 참모부(Arméstaben)는 조율과 전략적 대비 태세에서 중요한 역할을 합니다. 이 구조는 교리 개발과 야전 병참을 결합하여 스웨덴 군이 현대적이면서도 기민하게 유지되도록 보장합니다.\n\n중앙집중식 육군 참모부의 복귀는 우리의 의지를 알립니다. 우리는 계획하고, 적응하며, 스스로를 이끕니다."
 SWE_idea_total_defence_duty: "총력방위에 대한 의무"
 SWE_idea_total_defence_duty_desc: "총력방위(Totalförsvaret)는 단순한 정책이 아니라 의무입니다. 스웨덴 국민은 군복을 입고 복무할 뿐 아니라 병참, 의료, 인프라, 위기 대응 등 민간 대비를 통해서도 복무할 것으로 기대됩니다. 위협의 시기에는 온 국민이 하나의 저항 체계가 됩니다.\n\n총력방위는 징집만을 말하는 것이 아닙니다. 모든 스웨덴인의 기여에 관한 것입니다."
 SWE_idea_active_training: "현역 훈련 일과"
 SWE_idea_active_training_desc: "이론으로만 훈련하는 군대는 실전에서 가장 먼저 무너집니다. 스웨덴은 합동 병과 훈련, 군종 간 연합 훈련, 실전 조건 시나리오로 이루어진 탄탄한 일정을 유지합니다. 얼어붙은 군도에서 도시 지형에 이르기까지, 우리 병력은 전술뿐 아니라 적응력도 연습합니다.\n\n전투 대비 태세는 선언되는 것이 아닙니다. 습관이 되도록 훈련되는 것입니다."
 SWE_idea_total_training: "종합 방위 훈련"
 SWE_idea_total_training_desc: "스웨덴의 훈련은 상비군을 넘어 확장됩니다. 경찰, 민방위, 의료, 인프라, 지방 정부 모두가 비상 대비 훈련에 참여합니다. 그 결과는 단순한 병참이 아니라 문화입니다. 사회는 압박 속에서도 기능할 것으로 기대합니다.\n\n우리는 붕괴를 모의하지 않습니다. 붕괴를 견뎌내는 방법을 모의합니다."
 SWE_idea_nb8: "북유럽-발트 8개국(NB8)"
 SWE_idea_nb8_desc: "NB8은 지리, 경제적 이익, 공통의 안보 우려로 결속된 북유럽 및 발트 국가 간의 실용적 협력 플랫폼입니다. 외교적 조율과 공동 구상을 통해 NB8은 스웨덴에 강대국 블록 밖에서 민간 주도의 유연한 지역적 목소리를 제공합니다.\n\n조용한 동맹이 튼튼한 국경을 만듭니다."
 SWE_idea_nordefco: "NORDEFCO – 북유럽 방위 협력"
 SWE_idea_nordefco_desc: "NORDEFCO는 완전한 동맹 통합을 요구하지 않으면서 북유럽 국가들의 방위 역량을 융합합니다. 공동 조달, 합동 훈련, 상호운용 가능한 지휘 구조가 지역의 안보 모자이크를 강화합니다. 스웨덴에게 이는 주권을 희생하지 않고 억지력을 강화하는 방법입니다.\n\n유연함 속의 단결. 항복 없는 방위."
 SWE_idea_swedish_banking: "스웨덴 은행 체계"
 SWE_idea_swedish_banking_desc: "신뢰, 규제, 기술적 선견지명 위에 세워진 스웨덴의 은행 체계는 유럽에서 가장 회복력이 강한 축에 속합니다. 높은 디지털 보급률, 낮은 현금 의존도, 보수적인 신용 정책 덕분에 조용한 자신감으로 경제적 격랑을 견딜 수 있습니다.\n\n불안정한 세계에서 재정적 절제는 곧 힘입니다."
 SWE_development_found_of_the_swedish_construction_industry: "현대 스웨덴 건설업의 토대"
 SWE_development_found_of_the_swedish_construction_industry_desc: "전후 스웨덴은 인프라에 막대한 투자를 했고, 그 결과 탄탄하고 다재다능한 건설 부문이 형성되었습니다. 노를란드의 교량에서 스톡홀름의 지하 철도에 이르기까지, 스웨덴 기업들은 내구성, 효율성, 혹독한 기후를 염두에 두고 건설합니다. 위기의 시기에 이 역량은 이중 용도가 됩니다. 수리하고, 보강하고, 재건합니다.\n\n우리의 엔지니어들은 단지 건설하는 것이 아니라 콘크리트로 미래를 지킵니다."
 SWE_idea_sverige_tourism: "스웨덴을 발견하라"
 SWE_idea_sverige_tourism_desc: "오랫동안 스웨덴은 지도 위의 먼 한 점에 지나지 않았으며, 흔히 ABBA와 금발 모델 같은 진부한 이미지로 축소되곤 했습니다. 그러나 고정관념 너머에는 역사, 문화, 자연이 풍부한 숨 막히게 아름다운 나라가 있습니다. 극광 아래 순록이 흩어져 있는 북쪽 해안에서 남쪽의 현대적 경이인 외레순 다리에 이르기까지, 스웨덴은 방문객에게 독특하고 잊을 수 없는 경험을 선사합니다. 인프라, 환대 산업, 국제 마케팅에 투자함으로써 우리는 이 나라의 아름다움과 매력이 지닌 막대한 잠재력을 풀어낼 수 있습니다."
 SWE_idea_2percent_inflation_goal: "2% 인플레이션 목표"
 SWE_idea_2percent_inflation_goal_desc: "경제 안정은 우연히 오지 않습니다. 세심하게 조타되는 것입니다. 2% 인플레이션 목표를 공약함으로써 우리는 기대를 고정하고, 지속 가능한 성장을 뒷받침하며, 과열을 유발하지 않으면서 구매력을 유지하고자 합니다. 예측 가능한 통화 환경은 투자자, 기업, 시민 모두의 신뢰를 쌓을 것입니다."
 SWE_idea_gold_standart: "금본위제 복귀"
 SWE_idea_gold_standart_desc: "불확실성이 커지는 가운데 금으로 뒷받침되는 통화라는 옛 약속이 다시 떠오르고 있습니다. 금본위제의 복원은 우리 통화 체계에 대한 신뢰를 재건하고, 고정된 가치를 제공하며, 경제를 투기적 과잉으로부터 보호하는 것을 목표로 합니다. 그러나 경직된 틀은 위기 시에 유연성을 제한할 수 있습니다."
 SWE_idea_back_by_bonds: "채권으로 뒷받침되는 통화"
 SWE_idea_back_by_bonds_desc: "고정된 상품에 손발을 묶는 대신 국채로 우리 통화를 뒷받침하여, 신뢰할 수 있으면서도 적응력 있는 체계를 만들 수 있습니다. 정부 부채가 통화 발행의 토대가 되어, 안정성과 금융 압력에 역동적으로 대응하는 능력 사이의 균형을 맞춥니다."
 SWE_idea_nordbanken: "노르드방켄 통합"
 SWE_idea_nordbanken_desc: "금융 부문을 안정시키기 위해 노르드방켄은 더 강하고 회복력 있는 기관으로 재편되었습니다. 국가 조치와 민간 구상의 뒷받침을 받는 이 은행은 스웨덴 현대 금융 체계의 초석이며, 앞으로의 경제적 폭풍도 견뎌낼 수 있습니다."
 SWE_lower_costs: "국방비 삭감"
 SWE_lower_costs_desc: "군사비 지출은 국내 우선 과제로 자원을 재배분하기 위해 대폭 축소되었습니다. 이는 재정 부담을 덜어 주지만 즉각적인 방위 대비 태세도 낮추므로, 신중한 전략적 균형이 그 어느 때보다 중요해집니다."
 SWE_idea_den_education_reform1: "교육 개혁: 기초"
 SWE_idea_den_education_reform1_desc: "현대적이고 지식 주도적인 경제의 필요성을 인식하여, 교육 개혁의 첫 단계는 초기 학교 교육을 강화하고 전 지역에서 양질의 교육에 대한 접근성을 높이는 데 중점을 둡니다."
 SWE_idea_den_education_reform2: "교육 개혁: 확대"
 SWE_idea_den_education_reform2_desc: "초기의 성공을 토대로, 개혁은 중등 교육과 직업 훈련을 확대하고 교육과정을 경쟁적인 세계 경제의 수요에 맞추는 두 번째 단계에 들어섭니다."
 SWE_idea_den_education_reform3: "교육 개혁: 우수성"
 SWE_idea_den_education_reform3_desc: "세 번째 단계는 고등 교육 기관을 강화하고, 연구 혁신을 육성하며, 국제 협력을 촉진하여 스웨덴을 학문적 성취의 최전선에 올려놓음으로써 우수성을 추진합니다."
 SWE_idea_den_education_reform4: "교육 개혁: 미래 대비"
 SWE_idea_den_education_reform4_desc: "기초, 확대, 우수성 단계가 완료됨에 따라 마지막 단계는 교육이 민첩하고 포용적이며 미래 지향적으로 유지되도록 하여, 시민들이 내일의 세계가 가져올 역동적인 도전에 대비하게 합니다."
 SWE_idea_automotive_JAP: "일본 자동차 협력"
 SWE_idea_automotive_JAP_desc: "일본의 정밀성을 중시하는 자동차 산업과의 새로운 동반자 관계를 통해 스웨덴은 최첨단 기술, 제조 기법, 경쟁력 있는 시장 전략에 접근할 수 있게 됩니다. 일본 선도 기업들과의 협력은 우리의 생산 회복력을 높여 세계 혁신의 최전선에 계속 머물도록 보장합니다.\n\n효율적인 엔진에서 하이브리드 솔루션에 이르기까지, 자동차 분야의 탁월함에 대한 새로운 장이 쓰입니다."
 SWE_idea_automotive_USA: "미국 자동차 협력"
 SWE_idea_automotive_USA_desc: "미국의 산업 거인들과의 깊어지는 유대를 바탕으로, 스웨덴의 자동차 부문은 대량 생산, 상업적 설계, 물류 규모의 모범 사례를 흡수합니다. 우리 공장은 더 빠르고, 더 유연하며, 더 경쟁력 있게 되어 북유럽의 장인 정신과 미국의 산업적 역동성을 잇습니다.\n\n모든 차체와 구동축에서 공통된 야망의 정신이 형태를 갖춥니다."
 SWE_idea_automotive_GER: "독일 자동차 협력"
 SWE_idea_automotive_GER_desc: "세계적으로 명성 높은 독일 자동차 선도 기업들과의 협력으로 힘을 얻은 스웨덴 산업은 정밀 공학, 품질 관리, 최고 수준의 혁신을 받아들입니다. 합작 사업과 지식 교류는 기술적 진보를 확보하고 우리 자체의 산업 역량을 높입니다.\n\n모든 기어와 피스톤에서 탁월함에 대한 추구는 계속됩니다."
 SWE_idea_astrazenca: "아스트라제네카 파트너십"
 SWE_idea_astrazenca_desc: "아스트라제네카와의 파트너십을 통해 스웨덴은 의학, 생명공학, 첨단 연구의 교차로에서의 입지를 굳힙니다. 공동 프로젝트는 신약 개발 파이프라인을 가속하고 국제 제약 시장에서의 우리 위치를 강화합니다.\n\n우리가 생산하는 모든 약병과 제제에 혁신이 흐릅니다."
 SWE_idea_Pharmacia1: "파마시아: 초기의 돌파구"
 SWE_idea_Pharmacia1_desc: "파마시아의 초기 돌파구는 엄밀한 과학과 대담한 기업가 정신을 결합하여 스웨덴 제약 명성의 토대를 놓았습니다. 생명공학과 의료 치료 분야에서 우리 연구자들이 이룬 성과는 지금도 전 세계에서 반향을 일으킵니다.\n\n모든 발견에서 개척 정신이 빛납니다."
 SWE_idea_Pharmacia2: "파마시아: 글로벌 확장"
 SWE_idea_Pharmacia2_desc: "혁신의 전통을 토대로 한 파마시아의 국제 시장 진출은 스웨덴 제약 영향력의 새로운 시대를 알립니다. 전략적 합병과 연구 협력은 스웨덴을 보건 과학과 의료 기술의 선도적 거점으로 자리매김하게 합니다.\n\n모든 연구실과 모든 협력에서 미래가 만들어지고 있습니다."
 SWE_idea_swedish_think_tank: "ISDS – 스웨덴 외교안보연구소(Institutet för Svensk Diplomati och Säkerhet)"
 SWE_idea_swedish_think_tank_desc: "스웨덴 외교안보연구소(ISDS)는 갈수록 불안정해지는 세계에서 스웨덴의 입지를 분석하는 임무를 맡은 국가 지원 기구입니다. 공식적으로는 외교, 경제 전망, 민간 안보 체계에 초점을 맞추고 있으나, ISDS는 정부와 학계의 전략적 사고에 조용히 영향을 미칩니다. 형식상으로는 중립을 지키면서도 이 연구소는 미래의 동맹, 개입, 투자 구조에서 스웨덴이 맡을 수 있는 잠재적 역할을 탐구하는 기밀 시뮬레이션과 백서를 작성합니다. 지정학적으로 모호한 시기에 ISDS는 유연하고 미래 지향적인 외교 정책을 위한 지적 기반을 제공합니다."
 SWE_idea_ostkontact: "동방 접촉 개시(Initiera Östkontakt)"
 SWE_idea_ostkontact_desc: "공식적으로는 중립을 유지하면서, 우리는 러시아 및 유라시아 국가들과 문화, 경제, 학술 교류를 개시합니다. 이러한 저강도 접촉은 향후 노선 정렬 시나리오의 토대가 됩니다. 또한 국내 행위자들에게 중립이 서방에 대한 충성을 뜻하지 않는다는 신호를 보냅니다."
 SWE_idea_anti_lgbt: "전통주의 정책 캠페인"
 SWE_idea_anti_lgbt_desc: "보수적 목소리들의 네트워크가 진보적 사회 가치에 대한 문화적 반격에 나서, '전통적인 스웨덴 규범'으로의 회귀를 촉구하고 있습니다. 국가의 공식 지지는 없지만, 이들의 영향력은 공론장에 스며들어 LGBTQ+ 권리, 표현의 자유, 가족 정책에 관한 논쟁을 불러일으켰습니다. 국제 NGO와 유럽 기구들은 커지는 사회 양극화에 우려를 표명하고 있습니다."
 SWE_idea_folkhemmet: "현대판 국민의 집(Folkhemmet)"
 SWE_idea_folkhemmet_desc: "20세기 중반 스웨덴 모델인 '국민의 집(Folkhemmet)'에서 영감을 얻어, 포용적 복지와 강력한 국가 책임이라는 새로운 비전이 힘을 얻고 있습니다. 이 현대화된 개념은 사회 결속, 경제적 평등, 시장과 복지 장치 사이의 균형을 강조하며, 국민을 세계적 불안정으로부터 보호하는 동시에 국가 통합을 유지하는 것을 목표로 합니다."
 SWE_Logistic_invests: "전략 물류 투자"
 SWE_Logistic_invests_desc: "회복력 있는 인프라의 전략적 중요성을 인식하여, 스웨덴은 수송 회랑, 디지털 물류 체계, 군 보급망의 현대화를 시작했습니다. 이 투자 프로그램은 국내 이동성을 확보하고, 신속한 군사 대응을 보장하며, 북유럽 및 EU 전역의 물류 표준과 통합하도록 설계되었습니다."
 SWE_cybershield: "사이버 방어(Cyberförsvar) – 국가 사이버실드"
 SWE_cybershield_desc: "핵심 인프라, 정부 네트워크, 디지털 주권을 방어하기 위한 포괄적인 국가 사이버 보안 구상이 시작되었습니다. 학술 기관 및 방산 업체와의 협력으로 개발된 사이버실드 프로그램은 AI 기반 위협 탐지, 공세적 사이버 역량, 그리고 EU와 NATO 전역의 신뢰할 수 있는 파트너들과의 합동 훈련을 통합합니다."
 SWE_think_tank_links: "정책 네트워크 – 전략 싱크탱크 연계"
 SWE_think_tank_links_desc: "스웨덴은 지정학적 선견지명과 전략적 역량을 높이기 위해 국제 싱크탱크 및 학술 정책 연구소와의 협력을 강화했습니다. 이 지식 외교 전략은 기후 회복력, 하이브리드전, 디지털 규제 같은 분야에서 사상적 영향력, 시나리오 기획, 맞춤형 정책 자문을 가능하게 합니다."
 SWE_economic_forum: "북유럽 경제 포럼"
 SWE_economic_forum_desc: "새로운 범북유럽 구상은 경제학자, 산업 지도자, 국가 행위자를 한데 모아 경제적 도전에 대한 대응을 조율합니다. 이 포럼은 갈수록 분열되는 세계 경제에서 북유럽 지역의 장기적 경쟁력과 회복력을 지키기 위해 재정 정책, 녹색 전환, 혁신 전략을 일치시키고자 합니다."
 SWE_idea_rassism: "잠재적 인종주의"
 SWE_idea_rassism_desc: "진보적인 이미지에도 불구하고 스웨덴은 민족적 배제, 사회적 계층화, 정치적 소외와 관련된 구조적·문화적 도전에 직면해 있습니다. 이러한 긴장은 국가의 결속과 정통성을 위협합니다."
 SWE_idea_pluralism: "민주적 다원주의"
 SWE_idea_pluralism_desc: "스웨덴은 이념적 다양성, 언론의 자유, 소수자 대표성을 포용합니다. 민주적 다원주의는 단지 용인되는 것이 아닙니다. 정통성과 혁신의 원천으로 육성됩니다."
 SWE_idea_royal_social_society: "왕실 사회 협회"
 SWE_idea_royal_social_society_desc: "스웨덴 왕실은 사회 구상, 자선 활동, 청소년 역량 강화 프로그램에 적극적으로 참여합니다. 왕실의 존재는 국가 정체성을 키우고 전통을 시민적 책임과 연결합니다."
 SWE_idea_royal_crown_and_military: "왕관과 군대"
 SWE_idea_royal_crown_and_military_desc: "군주제는 스웨덴 군과의 상징적 유대를 강화합니다. 공개 의례, 역사적 유산, 공유된 가치를 통해 왕실은 국가와 방위의 일체성을 공고히 합니다."
 SWE_idea_royal_crown_and_military2: "왕관과 군대 – 통합"
 SWE_idea_royal_crown_and_military2_desc: "장교 교육, 전략 자문, 국방 교육에서의 왕실 참여가 제도화됩니다. 이는 군주제와 군의 기풍 사이의 상징적이면서도 영향력 있는 정렬의 새로운 단계를 뜻합니다."
 SWE_idea_Victoria: "빅토리아 왕세녀"
 SWE_idea_Victoria_desc: "왕위 계승자인 빅토리아 왕세녀는 연속성, 공감, 공공 봉사의 상징이 되었습니다. 시민적 의무에 대한 헌신과 사회적 분열을 넘어 소통하는 능력은 군주제에 대한 신뢰를 불러일으키고 국가 통합을 촉진합니다. 그녀의 존재는 민주 사회에서 자신의 역할을 이해하는 현대적 군주제를 반영합니다."
 SWE_idea_Madeleine: "마델렌 공주"
 SWE_idea_Madeleine_desc: "마델렌 공주는 아동 보호, 인도주의 활동, 국제 자선에 대한 헌신으로 알려져 있습니다. 세계 기구들과의 활동과 해외에서 스웨덴을 대표하는 능력은 긍정적인 국제 이미지에 기여하고 군주제의 소프트 파워를 강화합니다."
 SWE_idea_philip: "칼 필립 왕자"
 SWE_idea_philip_desc: "군 장교로 훈련받고 공적 대표 활동에 적극적인 칼 필립 왕자는 전통과 현대성을 잇습니다. 그는 충성, 규율, 국가 봉사를 구현합니다. 군과의 연계와 참전용사 및 공식 행사에 대한 헌신은 왕실과 군 사이의 상징적 일체성을 강화합니다."
 SWE_idea_royal_cultural_institutes: "왕립 문화 기관"
 SWE_idea_royal_cultural_institutes_desc: "왕실은 박물관, 학술원, 문화 외교를 적극적으로 지원합니다. 이 기관들은 국가 유산을 보존하고 해외에서 스웨덴의 소프트 파워를 강화합니다."
 SWE_the_royals: "왕실"
 SWE_the_royals_desc: "왕실은 존경받고 찬사를 받되 정치적 영향력은 의도적으로 제한된 국가의 상징으로서 계속 봉사합니다. 그 역할은 의례적이지만 스웨덴의 문화적 직물에 깊이 뿌리내려 있습니다."
 SWE_monarch_military1: "왕립 국방군(Försvarsmakten)"
 SWE_monarch_coordination_plan: "국가-경제 조율 계획"
 SWE_kultur_idea: "스웨덴 문화 부흥(Svensk Kulturväckelse)"
 SWE_mannerheim_plan: "만네르헤임 인프라 협정"
 SWE_prepare_baltic: "발트해(Östersjön) 지배"
 SWE_prepare_baltic_tt: "§R전쟁에 돌입하면 이 국가 정신은 제거됩니다!§!"
 SWE_development_integration: "왕국 물류망 개발"
 SWE_exploitation: "스웨덴의 착취"
 SWE_colonial_court_idea: "식민지 궁정"
 SWE_viking_legacy_idea1: "웁살라의 정신"
 SWE_danelaw_arsenal: "데인로 병기창"
 SWE_danelaw_arsenal_desc: "바이킹의 약탈 시대 이래로 변하지 않은 것이 있으니, 제대로 된 보급 없이는 싸우고 다스릴 수 없다는 점이다. §Y교회나 수도원 몇 곳을 약탈할 수 있다면 모를까§!"
 SWE_easter_horizon_idea1: "동방의 지평선"
 SWE_easter_horizon_idea1_desc: "NATO의 영향력을 은근히 내비친 뒤, 우리는 미래의 강대국들을 향해 나아갑니다."
 Sweden_Rus_Exercise: "스웨덴-러시아 합동 군사 훈련"
 Sweden_Rus_Exercise_desc: "스웨덴과 러시아는 지역 조율과 방위 역량을 강화하기 위해 합동 군사 훈련을 실시하기로 합의했습니다."
 SWE_russian_energy_idea: "러시아 에너지 협정"
 SWE_russian_energy_idea_desc: "스웨덴은 러시아와 에너지 협력 협정을 체결했습니다. 이는 연료와 전력의 안정적 공급을 보장하지만 러시아 연방에 대한 경제적 의존도도 높입니다."
 SWE_industry_exchange_swe: "군수 산업 교류"
 SWE_venezualen_accord_ven: "스웨덴의 인프라 투자"
 SWE_venezualen_accord_ven_desc: "스웨덴과의 양자 협정에 따라 베네수엘라는 인프라 투자와 기술 지원을 받고 있으며, 이는 산업 역량과 에너지 개발을 강화합니다."
 SWE_venezualen_accord: "베네수엘라 석유 개발"
 SWE_venezualen_accord_desc: "전략적 투자 협정의 일환으로 스웨덴은 산업 투자의 대가로 베네수엘라 석유에 대한 장기 접근권을 확보했습니다. 이 협정은 스웨덴의 에너지 안보와 경제적 영향력을 높입니다."
 SWE_cuba_medical_exchange: "스웨덴 의료 기술 파트너십"
 SWE_cuba_medical_exchange_desc: "스웨덴과의 양자 협정 덕분에 쿠바는 스웨덴의 첨단 의료 기술, 장비, 공동 연구 프로그램의 혜택을 받고 있으며, 이는 국내 보건 의료 역량을 강화합니다."
 SWE_iran_petrochemical_swe: "이란 석유화학 협정"
 SWE_iran_petrochemical_swe_desc: "이란과의 전략적 협정을 통해 스웨덴은 핵심적인 석유 기반 자원에 대한 접근권을 확보했습니다. 스웨덴 기업들은 이제 해외의 첨단 석유화학 사업에 참여하여 국내 산업 가공을 강화하고 장기적인 에너지 투입재를 확보하고 있습니다."
 SWE_iran_petrochemical_iran: "스웨덴 산업 협력"
 SWE_iran_petrochemical_iran_desc: "스웨덴이 이란의 석유화학 및 정제 부문에 투자하기 시작했습니다. 스웨덴의 기술 전문성과 산업 장비를 바탕으로 이란의 역량은 생산량과 기술 수준 모두에서 성장하고 있으며, 이는 우리의 에너지 경제를 뒷받침합니다."
 SWE_decision_Forsvarsmarkten_category: "국방군(Försvarsmakten)"
 SWE_decision_Forsvarsmarkten_category_desc: "\n£GFX_swedisch_homeguard \n\n\n\n\n스웨덴의 방위 체계는 군사 대비와 민간 대비를 결합한 통합적 접근인 총력방위(Totalförsvaret)의 개념 위에 세워져 있습니다. 이 교리 아래에서 국방군(Försvarsmakten)은 MSB와 같은 민간 기관과 협력하여 위기나 전쟁 시 국가의 회복력을 보장합니다. 재활성화된 병역 의무(värnplikt)는 훈련된 인원을 꾸준히 공급하여 군을 강화하고 집단 저항이 가능한 사회를 만듭니다. 모든 시민은 동원에서 지속적인 저항 작전에 이르기까지 국가 방위 계획의 일부입니다."
 SWE_Home_Guard: "향토방위대(Hemvärnet) 확대"
 SWE_Home_Guard_desc: "향토방위대(Hemvärnet)는 지역 방위와 신속 대응의 중추 역할을 합니다. 규모를 확대하면 지역별 대비 태세가 개선되고 침입이나 기습 공격에 저항하는 우리의 능력이 크게 향상될 것입니다. 이 부대들의 지역적 연계는 압박 속에서도 회복력을 보장합니다."
 SWE_fortifications: "전략 요충지 요새화"
 SWE_fortifications_desc: "핵심 지역을 지키려면 견고한 방어 진지에 투자해야 합니다. 스코네의 해안선에서 노를란드의 숲에 이르기까지, 고정 요새는 동원이 완료될 때까지 어떤 침략자도 지연시키거나 격퇴할 수 있습니다."
 SWE_Officer_education_course: "장교 교육 프로그램"
 SWE_Officer_education_course_desc: "국방군(Försvarsmakten)의 리더십은 엄격하고 지속적인 교육을 통해 함양되어야 합니다. 국방대학(Försvarshögskolan) 같은 기관에서 장교 훈련 프로그램을 확대함으로써 우리는 전략적 역량과 전장에서의 탁월함을 보장합니다."
 SWE_only_active_Personal_Trainings_exercise: "현역 인원 훈련 실시"
 SWE_only_active_Personal_Trainings_exercise_desc: "정기적인 교련과 야외 훈련은 상비군의 경계 태세와 전투 준비 상태를 유지하는 데 필수적입니다. 이 훈련은 현실적인 조건에서 규율, 조율, 대비 태세를 강화할 것입니다."
 SWE_Home_defence_Trainings_exercise: "향토 방위 부대 훈련"
 SWE_Home_defence_Trainings_exercise_desc: "대비는 가정에서 시작됩니다. 예비군과 자원 부대를 위한 대규모 훈련을 실시함으로써 하이브리드 위협과 비정규전 시나리오에 대응하는 우리의 능력을 강화합니다."
 SWE_launch_total_defence: "총력방위(Totalförsvaret) 가동"
 SWE_launch_total_defence_desc: "총력방위(Totalförsvaret)는 온 나라를 동원합니다. 민간 인프라, 긴급 구조 기관, 군 병력이 조율된 국가 방위 전략 아래 일치하여 작동합니다. 이 조치는 평시의 일과에서 전방위 대비 태세로의 전환을 의미합니다."
 SWE_back_to_normality: "동원 해제 및 일상 복귀"
 SWE_back_to_normality_desc: "위협이 물러나면서 우리는 고조된 대비 태세를 줄이기 시작할 수 있습니다. 총력방위(Totalförsvaret)는 해제되고 국가는 평시의 일과로 돌아가지만, 그 교훈과 구조는 미래를 위해 그대로 남을 것입니다."
 SWE_decision_Royal_category: "스웨덴 왕실"
 SWE_decision_Royal_category_desc: "\n\n\n\n£GFX_SWE_royals_decisions_pic \n\n\n\n\n\n\n1818년 나폴레옹 시대의 전직 원수 장바티스트 베르나도트(국왕 카를 14세 요한) 아래 부활한 스웨덴 군주제는 중립, 개혁, 산업화를 통해 현대 스웨덴의 토대를 놓았습니다. 1974년 헌법으로 정치적 권력은 박탈되었지만 베르나도트 왕조는 여전히 중심적인 상징으로 남아 있습니다. 국왕 칼 16세 구스타프와 빅토리아 왕세녀는 연속성과 현대성을 대표하며, 문화 외교와 의례적 역할을 통해 국가 정체성과 통합을 강화합니다..."
 SWE_king_speak_to_the_nation: "국민에게 보내는 왕실 연설"
 SWE_king_speak_to_the_nation_desc: "불확실하거나 국가적 성찰이 필요한 시기에 국왕은 국민에게 직접 연설할 수 있습니다. 정치적 권한은 없지만 이러한 연설은 상징적 무게를 지니며 단결, 자신감, 스웨덴 국가의 연속성을 강화합니다."
 SWE_send_to_mandatory_service: "왕실의 병역 참여"
 SWE_send_to_mandatory_service_desc: "국가 및 방위군과의 유대를 강화하기 위해 왕실 구성원은 일반 시민과 함께 병역을 이행할 수 있습니다. 이 행위는 군주제가 의무, 겸양, 국가 결속의 공통 상징이라는 역할을 부각합니다."
 SWE_training_as_officer: "왕실 장교 훈련"
 SWE_training_as_officer_desc: "빅토리아 왕세녀와 칼 필립 왕자 같은 선발된 왕족들은 스웨덴의 군사 전통과 시민적 책임에 대한 이해를 심화하기 위해 장교 훈련을 받습니다. 이러한 경험은 군 내부의 존경을 키우며 국가 봉사에 대한 군주제의 지속적인 헌신을 반영합니다."
 SWE_science_patronage: "과학에 대한 왕실 후원"
 SWE_science_patronage_desc: "스웨덴 왕실은 오랫동안 교육, 연구, 혁신을 지원해 왔습니다. 과학 기관에 왕실 후원을 부여함으로써 우리는 대중의 관심을 불러일으키고, 외국의 인재를 유치하며, 지식과 진보의 중심지라는 스웨덴의 명성을 강화할 수 있습니다."
 SWE_military_review: "왕실 열병식"
 SWE_military_review_desc: "왕실이 참관하는 군 의장 사열은 사기를 북돋우고 스웨덴의 대비 태세를 과시합니다. 전통을 넘어, 이러한 행사는 군과 국민 사이의 단결을 키우고 세계에 자신감을 내보입니다."
 SWE_economy_review: "왕실 경제 포럼"
 SWE_economy_review_desc: "왕실 주도의 경제 포럼을 개최하면 안정성을 알리고 투자를 유치할 수 있습니다. 왕실의 상징적 역할과 국제적 존재감은 우리 경제를 강화하는 무역 협상과 동반자 관계의 문을 열 수 있습니다."
 SWE_support_nationalist: "국가 가치에 대한 은근한 지지"
 SWE_support_nationalist_desc: "공식적으로는 중립을 유지하면서도 왕실 구성원들은 스웨덴의 전통과 유산을 부각할 수 있습니다. 이러한 몸짓은 민족주의 정서와 공명하며 우리 주권에 대한 자긍심을 북돋웁니다."
 SWE_support_Democracy: "민주적 가치의 수호자"
 SWE_support_Democracy_desc: "군주제가 민주주의와 법치에 헌신하고 있음을 강조함으로써 왕실은 스웨덴 정치 체제의 상징적 수호자 역할을 할 수 있으며, 국내외에서 신뢰를 키웁니다."
 SWE_will_of_the_people: "국민의 의지"
 SWE_will_of_the_people_desc: "군주제에 대한 지지가 전국에서 높아지고 있지만, 우리는 현대 스웨덴을 규정하는 민주적 가치를 굳건히 지킵니다. 국민의 뜻에 따라 통치할 권리를 회복할 수 있는 능력이 있음에도, 우리는 동등한 이들 중 으뜸으로 남아 지배가 아닌 봉사를 통해 국가를 이끕니다."
 Sweden_royal.1.t: "왕실의 병역 참여"
 Sweden_royal.1.d: "스웨덴의 징병 제도와 오랜 왕실 전통에 따라 왕실 구성원 한 명이 군 복무를 시작할 예정입니다. 군주제는 더 이상 지휘 권한을 갖지 않지만, 공동의 국가적 의무라는 상징적 행위는 국가, 사회, 왕실 사이의 유대를 강화하는 데 도움이 됩니다.\n\n이 결정은 대중의 인식에도 영향을 미칠 것입니다. 어떤 왕족을 선택하느냐는 리더십, 의무, 혹은 연민 등 서로 다른 가치를 반영합니다."
 Sweden_royal.1.o1: "빅토리아 왕세녀를 지정한다"
 Sweden_royal.1.o1_desc: "왕위 계승자인 빅토리아 왕세녀는 기초 훈련과 장교 교육을 받게 됩니다. 규율, 사회적 양심, 국제적 참여라는 그녀의 대중적 이미지는 현대 왕실 봉사의 강력한 본보기가 될 것입니다."
 Sweden_royal.1.o2: "칼 필립 왕자를 지정한다"
 Sweden_royal.1.o2_desc: "해군 전통과 공학에 관심이 있는 것으로 알려진 칼 필립 왕자는 작전상의 충성과 청년 통합의 상징으로 군에서 복무하게 됩니다. 그의 훈련은 장교단 내부의 존경도 높일 수 있습니다."
 Sweden_royal.2.t: "왕실 장교 훈련 시작"
 Sweden_royal.2.d: "의무 군 복무에 배정된 뒤, 선발된 왕실 구성원이 이제 정식 장교 훈련을 승인받았습니다. 그들의 장래 역할은 의례적이지만, 이 결정은 평등한 봉사라는 스웨덴의 변함없는 원칙과 신뢰성, 단결, 국가 통합에 대한 군주제의 헌신을 반영합니다."
 Sweden_royal.2.o1: "빅토리아 왕세녀, 고급 장교 훈련을 시작하다"
 Sweden_royal.2.o1_desc: "빅토리아의 훈련은 리더십, 위기 조율, 민군 협력을 포함한 맞춤형 프로그램으로 진행됩니다. 그녀의 참여는 단순한 상징적 존재가 아니라 장래 역할을 위한 진지한 준비의 표시로 널리 받아들여지고 있습니다."
 Sweden_royal.2.o2: "칼 필립 왕자, 해군 장교 학교에 입교하다"
 SWE_heavy_industry_modifier: "스웨덴 중공업의 유산"
 SWE_heavy_industry_modifier_desc: "20세기의 주조소에서 단련된 스웨덴의 중공업은 여전히 국력의 초석입니다. 장갑차에서 수력 터빈에 이르기까지 우리의 생산 능력은 믿을 만하고 적응력이 있으며 수출 시장과 깊이 통합되어 있습니다. 보포르스, 스카니아, 볼보 AB 같은 기업들은 총력방위(Totalförsvaret)의 산업적 척추를 이루며, 필요한 순간에 민수 생산에서 군수 생산으로 전환할 수 있습니다.\n\n강철은 여전히 스웨덴인의 혈관 속에 흐릅니다."
 SWE_Vattenfall_modifier: "바텐팔 – 북방에 전력을 공급하다"
 SWE_Vattenfall_modifier_desc: "한 세기 전에 설립되어 지금도 국영인 바텐팔은 단순한 에너지 공급자가 아니라 전략 자산입니다. 수력 발전의 지배력과 원자력 및 지역 난방 시스템에 대한 커지는 통제력을 통해 바텐팔은 평시와 분쟁 시 모두 스웨덴의 에너지 회복력을 보장합니다. 북유럽 전역에 걸친 전력망 통합은 바텐팔을 지역 에너지 외교의 핵심 주체로 만들기도 합니다.\n\n다른 나라들이 전력을 수입할 때, 스웨덴은 스스로 생산합니다."
 SWE_financial_place_modifier: "북유럽 금융 거점"
 SWE_financial_place_modifier_desc: "스톡홀름을 뛰는 심장으로 하여 스웨덴은 북유럽-발트 지역의 금융 거점으로 발전했습니다. 노르데아, SEB, 릭스방크 같은 기관들은 안정적인 자본 흐름과 현대적인 규제 체계를 뒷받침하며, 디지털 뱅킹은 현금 없는 경제로의 변화를 이끕니다. 금융 회복력은 단순한 숫자가 아니라 국가 안보입니다.\n\n스웨덴의 시장은 세계 기준으로는 작을지 몰라도, 체급 이상의 힘을 발휘합니다."
 SWE_pharmacy_modifier: "스웨덴 제약의 우수성"
 SWE_pharmacy_modifier_desc: "연구에 뿌리를 두고 규제를 통해 다듬어진 스웨덴의 제약 산업은 정밀 과학과 세계적 영향력을 결합합니다. 아스트라, 레시팜, 소비는 건강을 수출하고, 바이오의약품을 개발하며, 맞춤 의학을 개척하는 클러스터의 중추를 이룹니다. 강력한 산학 연계와 의학에 대한 대중의 신뢰를 바탕으로 이 부문은 회복력과 번영의 조용한 파수꾼으로 서 있습니다.\n\n이곳에서 분자는 기적이 됩니다."
 SWE_digital_modifier: "디지털 북방의 개척자들"
 SWE_digital_modifier_desc: "초기 광대역 인프라에서 세계적 수준의 기술 스타트업에 이르기까지, 스웨덴의 디지털 여정은 세상이 알아차리기 전에 이미 시작되었습니다. 국가가 주도한 연결성, 교육, 혁신 추진은 차가운 실리콘을 따뜻한 사회적 조직으로 바꾸어 놓았습니다. 에릭슨, 스포티파이, 클라르나는 겉으로 드러난 일부일 뿐이며, 그 아래에는 디지털에 능숙한 노동력과 자동화하고 분석하고 행동할 준비가 된 국가가 있습니다.\n\n스웨덴에서 데이터는 물처럼 흐릅니다."
 SWE_mining_modifier: "스웨덴 광업의 유산"
 SWE_mining_modifier_desc: "오래된 암반에서 깎여 나와 혁신으로 움직이는 스웨덴의 광업 부문은 오랫동안 산업 역량의 기둥이었습니다. 키루나와 옐리바레는 드릴과 적재기의 리듬으로 울려 퍼지며, LKAB와 볼리덴은 원자재에 목마른 세계에서 지속 가능한 채굴을 이끌고 있습니다. 우리의 광석은 유럽의 공장을 먹여 살리고, 우리의 공법은 세계 표준이 됩니다. \n\n눈 아래에 힘이 잠들어 있습니다."
 SWE_army_dynamic_modifier: "스웨덴 국방군"
 SWE_army_dynamic_modifier_desc: "최근의 개혁은 스웨덴 육군을 더 기동적이고 전문적이며 모듈식인 군대로 재편하여, 국내 방어와 국제 파병을 모두 수행할 수 있게 하였습니다."
 SWE_Special_forces_modifier: "국방군 정예 부대"
 SWE_Special_forces_modifier_desc: "극지 전투, 도시전, 비대칭 작전에 숙련된 스웨덴의 정예 부대는 군의 전략적 투사 범위를 넓히고 고강도 분쟁 지역에서 역량을 발휘합니다."
 SWE_politics_modifier: "분열된 정치 지형"
 SWE_politics_modifier_desc: "정치 지형은 이념의 변화, 연립의 불안정, 개혁파와 전통파 사이의 고조되는 긴장으로 특징지어집니다. 이러한 조건에서 통치하려면 적응력과 타협이 필요합니다."
 SWE_monarchy_modifier: "국가 연속성의 상징"
 SWE_monarchy_modifier_desc: "군주제는 의례적이지만 역사적 정통성과 사회적 안정을 구현하는 통합의 상징으로 기능합니다. 군주제의 존재는 불확실한 시기에 결속을 강화합니다."
 SWE_wind_farms: "풍력 단지"
 SWE_wind_farms_desc: "풍력 에너지가 점점 더 실현 가능하고 지속 가능한 경제 자원이 되면서, 지역별 풍력 발전 단지 투자가 에너지 지형을 바꾸기 시작하고 있습니다. 아직 초기 단계이지만, 이러한 전환은 시간이 지남에 따라 에너지 자립을 높이고 환경 영향을 줄일 것으로 기대됩니다."
 SWE_mines: "광산 운영"
 SWE_mines_desc: "지역 광업이 되살아나 귀중한 천연자원을 채굴하고 있습니다. 이러한 사업은 지역 경제와 산업 발전에 중요한 기반을 제공합니다."
 SWE_upgraded_mining_equipment: "현대화된 채굴 장비"
 SWE_upgraded_mining_equipment_desc: "현대식 채굴 기계와 기술에 대한 투자로 채굴 효율과 안전이 크게 향상되어 생산량이 늘고 운영 비용이 줄었습니다."
 SWE_science_center: "지역 과학 센터"
 SWE_science_center_desc: "전용 과학 센터는 혁신과 기술 연구를 촉진하며, 최첨단 해법을 개발하려는 학계, 스타트업, 산업계의 거점 역할을 합니다."
 SWE_energy_link: "에너지 인프라 연계"
 SWE_energy_link_desc: "송전선과 국경 간 인프라에 대한 새로운 투자는 지역 전력망을 강화하여 산업 부문과 민간 부문 모두에 더 안정적이고 안전한 에너지 공급을 보장합니다."
 SWE_nuklear_plant: "원자력 발전소"
 SWE_nuklear_plant_desc: "원자력 발전소의 건설은 장기적인 에너지 안보를 향한 중대한 걸음입니다. 세심한 감독이 필요하지만, 현대 경제에 필수적인 대규모 저배출 전력을 공급합니다."
 SWE_automotive_industrie_expansion: "자동차 산업 확장"
 SWE_automotive_industrie_expansion_desc: "국내 자동차 부문은 급속한 확장을 겪고 있으며, 새로운 시설과 공급망이 산업 생산, 고용, 수출 역량을 끌어올리고 있습니다."
 SWE_regional_tourism_invest: "지역 관광 개발"
 SWE_regional_tourism_invest_desc: "관광 인프라에 대한 선별적 투자는 지역의 문화적, 역사적, 자연적 명소가 지닌 경제적 잠재력을 끌어내어 서비스 부문의 성장과 지역 번영을 이끄는 것을 목표로 합니다."
 SWE_Riga_legacy: "스웨덴령 리가의 유산"
 SWE_Riga_legacy_desc: "스웨덴 제국이 리가에 남긴 역사적 영향력은 지금도 그곳의 제도와 인프라에 울려 퍼지고 있습니다. 이 유산은 지역 발전과 안정을 뒷받침합니다."
 SWE_southafrica_metals: "남아프리카 전략 금속 협정"
 SWE_southafrica_metals_desc: "남아프리카공화국과의 양자 협정을 통해 스웨덴은 우리 국방 및 첨단 산업에 필수적인 희소 금속과 전략 금속에 대한 안정적인 접근권을 확보했습니다."
 SAF_swe_metals_investment: "스웨덴 광업 투자"
 SAF_swe_metals_investment_desc: "스웨덴의 투자가 남아프리카공화국의 광업 인프라를 끌어올리고 있으며, 첨단 기술을 들여와 핵심 전략 부문 전반의 산업 생산을 강화하고 있습니다."
 SWE_balance_of_power: "스웨덴의 중립"
 SWE_balance_of_power_desc: "1814년 이래 스웨덴은 강대국 블록으로부터 의도적으로 거리를 두는 길을 걸어 왔습니다. 이는 나약함 때문이 아니라 비동맹이라는 전략적 교리에서 비롯된 것입니다. 이 균형은 이제 새로운 압력에 직면해 있습니다. 세력이 변동하며 재편된 세계에서 스웨덴은 독자적인 노선을 유지할 수 있을까요, 아니면 새로운 세계적 분열 속에서 한쪽을 선택해야 할까요?"
 SWE_souvereign_neutrality: "주권적 중립"
 SWE_souvereign_neutrality_desc: "두 세기가 넘도록 스웨덴은 군사 동맹 밖에 머무름으로써 주권을 성공적으로 지켜 왔습니다. 이 정책은 전쟁으로 벼려지고 평화 속에서 다듬어진 실용주의와 신중함에 뿌리를 두고 있습니다. 21세기에도 중립은 스웨덴 정체성을 규정하는 기둥이자 그 자체로 조용한 힘으로 남아 있습니다."
 SWE_nato_side: "서방 지향"
 SWE_nato_side_desc: "침략 전쟁, 사이버 위협, 권위주의의 부활로 흔들리는 세계에서 스웨덴은 더 이상 홀로 설 여유가 없습니다. 국민과 지도부는 안전 보장뿐 아니라 민주주의, 투명성, 집단 방위라는 공유 가치를 재확인하기 위해 서방으로 눈을 돌립니다. 대서양의 길은 보호를 제공하지만 대가가 따릅니다. 바로 전통적 중립의 상실입니다."
 SWE_russia_side: "동방 재편"
 SWE_russia_side_desc: "서방의 퇴폐, 내부 분열, 문화적 교조에 환멸을 느낀 스웨덴 국민과 엘리트의 일부가 동쪽을 바라보기 시작합니다. 한때 상상할 수 없었던 모스크바와의 연대는 이제 세계적 자유주의에 대한 급진적 대안으로 부상합니다. 이들에게 중립은 실패했으며, 서방은 스스로 막아 주겠다고 주장했던 바로 그 위협이 되었습니다."
 SWE_atlantic_alligment: "대서양 연대"
 SWE_atlantic_alligment_desc: "스웨덴 국민 중 늘어나는 층이 서방 동맹 체제로의 완전한 통합을 요구하고 있습니다. 불안정한 시대에 많은 이들이 나토 가입과 대서양 횡단 안전 보장을 유일하게 현실적인 길로 여기며, 이는 두 세기가 넘는 중립을 포기하는 대가를 치르더라도 마찬가지입니다."
 SWE_western_preference: "서방 선호"
 SWE_western_preference_desc: "여론은 서방과의 더 강한 유대를 점점 더 선호하고 있습니다. 형식상의 중립은 여전히 유지되고 있지만, 안보 우려, 공유된 민주주의 가치, 깊은 경제적 통합에 힘입어 나토 및 EU 파트너와의 긴밀한 협력에 대한 요구가 높아지고 있습니다."
 SWE_cooperative_neutrality: "협력적 중립"
 SWE_cooperative_neutrality_desc: "스웨덴 국민의 상당수는 여전히 중립을 믿지만 고립은 믿지 않습니다. 완전한 동맹 가입의 선을 넘지 않으면서 평화 유지, 정보, 방위 대화에서 국제 협력을 지지하는 목소리가 커지고 있습니다."
 SWE_pragmatic_eastern_opening: "실용적 동방 개방"
 SWE_pragmatic_eastern_opening_desc: "일부는 스웨덴이 외교 정책을 다변화하고 서방 강대국에 대한 의존을 줄여야 한다고 주장합니다. 이들은 이념 때문이 아니라 지역 안정과 경제적 기회를 바라는 마음에서 동방, 특히 러시아와의 실용적 관계를 요구합니다."
 SWE_strategic_balance: "전략적 균형"
 SWE_strategic_balance_desc: "공론이 변화하고 있습니다. 세계적으로 긴장이 고조되면서 사회 일각에서는 더 대담한 균형 전략을 요구합니다. 이는 완전한 서방도 동방도 아니며, 선별적 연대와 외교적 유연성을 통해 스웨덴을 발트해 지역의 주권적 안정자로 자리매김하는 것입니다."
 SWE_Russian_allignment: "러시아 연대"
 SWE_Russian_allignment_desc: "소수이지만 성장하는 집단에서는 서방이 보호자가 아니라 도덕적으로 타락하고 전통에 적대적인 부식성 세력으로 여겨집니다. 이들은 러시아를 자유주의적 세계화에 맞선 방벽이자 주권의 동반자로 받아들이며 러시아로의 급진적 방향 전환을 요구합니다."
 SWE_balance_of_power_category: "스웨덴과 중립의 역사"
 SWE_balance_of_power_category_desc: "1814년 이래 스웨덴은 강대국 블록으로부터 의도적으로 거리를 두는 길을 걸어 왔습니다. 이는 나약함 때문이 아니라 비동맹이라는 전략적 교리에서 비롯된 것입니다. 이 균형은 이제 새로운 압력에 직면해 있습니다. 세력이 변동하며 재편된 세계에서 스웨덴은 독자적인 노선을 유지할 수 있을까요, 아니면 새로운 세계적 분열 속에서 한쪽을 선택해야 할까요?"
 SWE_the_price_of_neutrality: "중립의 대가"
 SWE_the_price_of_neutrality_desc: "스웨덴은 수 세기에 걸친 전쟁과 생존 속에서 벼려진 길고 복잡한 중립의 역사를 지니고 있습니다. 30년 전쟁의 구스타브 2세 아돌프에서 1834년의 중립 선언, 그리고 전후의 '스웨덴 모델' 외교에 이르기까지, 동맹으로부터의 거리 두기는 우리를 안전하게 지켜 주었습니다. 그러나 변화하는 세계에서 중립에는 비용이 따르며, 이제 서방과의 공식적인 군사 파트너십에 한 걸음 다가설 때일지도 모릅니다."
 SWE_ask_the_minister_of_defence_dialog: "국방장관에게 묻다"
 SWE_ask_the_minister_of_defence_dialog_desc: "국방장관은 제도적 기억과 전략적 선견지명을 모두 대표합니다. 공식 성명과 인터뷰를 통해 공개 대화를 시작함으로써, 서방 연대라는 구상이 이념이 아닌 권위를 통해 공론장에 들어서도록 합니다. 이는 국가적 인식을 장기적 동맹 사고로 옮겨 가게 하는 데 도움이 됩니다."
 SWE_security_information_campain: "안보 정보 캠페인"
 SWE_security_information_campain_desc: "스웨덴의 방위 취약점과 발트해의 변화하는 안보 환경에 관한 사실 기반 캠페인을 시작하면 논쟁의 틀이 바뀝니다. 중립이 한때 우리를 안전하게 지켜 주었다면, 오늘날에는 오히려 우리를 위험에 노출할 수 있습니다. 대중의 인식은 서방 방위 체제와의 더 깊은 협력에 대한 지지를 쌓는 도구가 됩니다."
 SWE_symbolic_campain_to_make_citizens_familiar: "시민 친숙화를 위한 상징 캠페인"
 SWE_symbolic_campain_to_make_citizens_familiar_desc: "나토와의 합동 훈련, 대사관의 깃발, 문화 교류 캠페인과 같은 은근하면서도 강력한 상징은 대중 정서에 영향을 줄 수 있습니다. 친숙함은 수용을 낳습니다. 이 상징 캠페인은 정책을 직접 바꾸지는 않지만, 시민들이 잠재적인 서방 연대를 정서적으로 받아들일 준비를 하게 합니다."
 SWE_the_swedish_way: "스웨덴의 길"
 SWE_the_swedish_way_desc: "여러 세대에 걸쳐 '스웨덴의 길'은 독립, 외교, 비동맹을 상징해 왔습니다. 이 구상은 적어도 형식상으로는 우리의 중립에 대한 의지를 재확인합니다. 그러나 21세기에 스웨덴이 어떻게 평화를 보장하는지에 대한 국가적 성찰을 장려함으로써, 시간이 지나 서방 안보 체제와의 연대로 이어질 수 있는 사고방식을 형성하기 시작합니다."
 SWE_what_means_neutrality_to_us: "우리에게 중립이란 무엇인가?"
 SWE_what_means_neutrality_to_us_desc: "이 전국적 토론 캠페인은 스웨덴의 중립적 입장을 재확인하는 것으로 포장됩니다. 그러나 오늘날 복잡한 세계에서 중립이 진정으로 무엇을 의미하는지 묻는 것은 전략적 재해석을 불러들입니다. 이는 연속성의 외양을 유지하면서도 잠재적 동맹에 대한 대중의 저항을 점진적으로 누그러뜨립니다."
 SWE_build_up_swedish_think_tank: "스웨덴 싱크탱크 설립"
 SWE_build_up_swedish_think_tank_desc: "중립 정책에 초점을 맞춘 국가 지원 싱크탱크는 독립 유지에 지적 정당성을 부여합니다. 그러나 그 실제 기능은 처음에는 비공개로 동맹 선택지를 모의하고 분석하는 것입니다. 공개적으로는 중립을 강화하면서, 상황이 요구할 경우 전환을 가능하게 할 엘리트 합의와 정책 틀을 준비합니다."
 SWE_multipolar_world: "다극 세계"
 SWE_multipolar_world_desc: "단극의 시대는 끝났습니다. 부상하는 동방이 서방의 지배에 도전하고 있으며, 스웨덴은 이처럼 변화하는 세계 구조를 인식해야 합니다. 다극적 균형에 기반한 세계관을 확산함으로써, 비서방 강대국, 특히 주권, 문화적 다원성, 불간섭을 옹호하는 국가들과의 더 깊은 접촉에 대중의 마음을 엽니다."
 SWE_det_andra_europa: "또 하나의 유럽"
 SWE_det_andra_europa_desc: "브뤼셀과 나토가 빚어낸 것이 아니라 전통, 주권, 그리고 다른 역사적 경험에 뿌리를 둔 또 하나의 유럽이 있습니다. 동유럽과 슬라브 세계와의 문화적, 종교적, 지정학적 유대를 부각함으로써, 방향 전환을 위한 심리적, 이념적 공간을 마련하는 데 도움이 됩니다."
 SWE_do_ostkontact: "동방 접촉 개시"
 SWE_do_ostkontact_desc: "공식적인 중립을 유지하는 한편, 러시아 및 유라시아 국가들과 문화, 경제, 학술 교류를 시작합니다. 이러한 저강도 접촉은 장래 연대 시나리오의 토대가 됩니다. 또한 중립이 서방에 대한 충성을 의미하지 않는다는 점을 국내 행위자들에게 알리는 신호이기도 합니다."
 SWE_blame_the_arrogant_west: "오만한 서방 비판"
 SWE_blame_the_arrogant_west_desc: "서방의 도덕주의, 경제적 지배, 외교 정책의 위선에 대한 대중의 불만이 커지고 있습니다. 이러한 정서를 공식 수사로 끌어들임으로써, 중립을 강대국 사이의 줄타기가 아니라 서방의 오만에 대한 거부로 새롭게 규정합니다. 이러한 전환은 동방의 대안에 대한 대중의 수용성을 높입니다."
 SWE_Technologie_Exchange_groupe_desc: "스웨덴에 뿌리를 둔 노르웨이계 미국인 물리화학자이자 노벨상 수상자인 라르스 온사거를 기려 이름 붙인 이 연구소는 국경을 넘는 기술 협력을 촉진합니다. 그 목표는 협력국 간의 체계적인 지식 공유를 통해 과학적 진보와 산업 혁신을 가속하는 것입니다."
 SWE_four_year_plan_category: "인민 4개년 계획"
 SWE_four_year_plan_category_desc: "군주제는 해체되었고, 그와 함께 세습 특권이라는 환상도 사라졌습니다. 이제 인민에 의한, 인민을 위한 스웨덴 사회의 진정한 변혁이 시작됩니다. 4개년 계획은 집단적 진보, 산업 자립, 이념적 명료성, 국제적 대비를 위해 모든 국가 자원을 동원합니다."
 SWE_increase_the_workforce: "노동자 동원"
 SWE_increase_the_workforce_desc: "인민은 더 이상 방관자가 아닙니다. 모든 손이 집단의 이익을 위해 봉사해야 합니다. 과거의 계급, 성별, 지역에 관계없이 모든 시민이 기여할 것입니다."
 SWE_improve_economic_capacity: "경제 재편"
 SWE_improve_economic_capacity_desc: "왕실 영지에서 민영화된 공공 서비스에 이르기까지 모든 전략 부문이 공적 통제 아래 재편되고 있습니다. 생산은 왕조의 사치가 아니라 국가에 봉사해야 합니다."
 SWE_true_education: "이념 교육 수립"
 SWE_true_education_desc: "군주제는 신화와 복종으로 젊은이들의 정신을 타락시켰습니다. 새로운 시민 교육은 비판적 사고, 평등, 그리고 왕관이 아닌 공화국에 대한 충성을 가르칠 것입니다."
 SWE_build_partnership: "반제국주의 동맹 결성"
 SWE_build_partnership_desc: "낡은 강대국과 세계적 독점에 맞서기 위해, 스웨덴은 귀족제, 경제적 착취, 외부의 지배를 거부하는 다른 국가들과 동맹을 결성할 것입니다."
 SWE_intervention_force: "인민 개입군 창설"
 SWE_intervention_force_desc: "우리는 국경 안에서만이 아니라 인민이 억압받는 곳이면 어디서든 공화국을 수호할 준비가 되어 있어야 합니다. 개입군은 신속하고 결연하게, 주저 없이 행동할 것입니다."
 philip_mandatory_service: "의무 복무 중인 칼 필립 왕자"
 madeleine_mandatory_service: "의무 복무 중인 마델렌 공주"
 victoria_mandatory_service: "의무 복무 중인 빅토리아 공주"
 SWE_whistle_blowers_I: "내부 고발자 혐오"
 SWE_whistle_blowers_II: "내부 고발자 애호"
 SWE_Technologie_Exchange_groupe_name: "온사거 기술 교류 연구소"
 Sweden_foci.40.t: "공군 평가: 준비되지 않은 스웨덴"
 Sweden_foci.40.d: "스웨덴 공군 고위 장교들이 이끄는 최근의 내부 위원회는 우리의 현재 방공 인프라가 현대전의 요구를 충족하기에 불충분하다고 결론지었습니다. 기존 체계는 고속 다방향 위협, 특히 순항 미사일과 저고도 드론에 대응할 능력이 부족합니다.\n\n보고서는 즉각적인 조치를 촉구합니다. 장거리 요격 능력을 확장할지, 기동 단거리 방어를 강화할지, 아니면 두 가지를 더 균형 있게 재편할지를 결정해야 합니다."
 Sweden_foci.40.a: "단거리 방공 체계에 투자한다"
 Sweden_foci.40.b: "장거리 미사일 요격 플랫폼을 배치한다"
 Sweden_foci.40.c: "모든 사거리에 걸친 중첩 방공을 우선시한다"
 Sweden_foci.41.t: "군 비행장 재편"
 Sweden_foci.41.d: "현재의 군 비행장 인프라는 여전히 지속 작전보다 분산을 강조하는 냉전 교리를 따르고 있습니다. 현대의 위협과 작전상의 필요를 고려할 때 개혁은 이미 늦었습니다. 국방 참모부는 수용 능력 확장과 군수 지원 개선에서 스웨덴 중부에 대규모 신규 거점을 건설하는 것에 이르기까지 여러 선택지를 제시했습니다."
 Sweden_foci.41.a: "비행장 수용 능력을 확장한다"
 Sweden_foci.41.b: "베름란드에 기지를 건설한다"
 Sweden_foci.41.c: "비행장 군수 지원을 현대화한다"
 Sweden_foci.42.t: "그리펜 39E를 공개한 사브"
 Sweden_foci.42.d: "스웨덴의 방위산업체 사브가 차세대 다목적 전투기 그리펜 39E를 공식 공개했습니다. 비용 대비 효율적인 제공권, 정밀 타격, 현대적 네트워크전을 위해 설계된 이 기체는 향상된 센서, 항속 거리, 무장 탑재량을 갖추고 있습니다.\n\n스웨덴은 직접 조달 계약 또는 국내 개발을 위한 핵심 기술의 제한적 접근 중 한 가지 방식으로 우리나라에 이 항공기를 수출하겠다고 제안했습니다."
 Sweden_foci.42.a: "주문하여 우리 공군을 강화한다"
 Sweden_foci.42.b: "설계를 연구하고 얻을 수 있는 것을 얻는다"
 Sweden_foci.44.t: "타우루스 미사일 도입 승인을 요청하는 스웨덴"
 Sweden_foci.44.d: "스웨덴은 타우루스 KEPD 350 순항 미사일을 제한된 수량으로 구매할 수 있도록 허가해 달라고 공식 요청했습니다. 독일과 스웨덴이 공동 개발한 이 장거리 정밀 타격 무기는 민감한 독일제 부품과 수출 허가에 의존합니다. 스웨덴 대표단은 이 도입이 지역 방위와 상호 운용성을 강화할 것이라고 주장합니다.\n\n우리는 이전을 승인할지 결정해야 합니다."
 Sweden_foci.44.a: "그들은 이미 일부 부품을 사용하고 있으니 거래를 승인한다"
 Sweden_foci.44.b: "우리는 이 수준의 능력을 공유하지 않는다"
 Sweden_foci.43.t: "타우루스 도입 승인"
 Sweden_foci.43.d: "독일이 타우루스 KEPD 350 미사일 체계를 도입하겠다는 우리의 요청을 공식 승인했습니다. 이는 전략적 협력을 심화하는 중대한 걸음이며 우리의 장거리 타격 능력에 있어 도약입니다.\n\n이제 최초 주문을 하거나 미사일의 선진적인 설계를 학습하는 데 집중할 수 있습니다."
 Sweden_foci.43.a: "40기를 주문한다"
 Sweden_foci.43.b: "국내 개발을 위해 설계를 연구한다"
 Sweden_foci.45.t: "타우루스 수출 거부"
 Sweden_foci.45.d: "독일은 수출 제한과 내부 정치적 우려를 이유로 타우루스 순항 미사일 구매 요청을 거부했습니다. 실망스러운 일이지만, 이 결정은 전략적 신뢰의 한계를 드러내며 우리의 종심 타격 교리를 재고하도록 강요합니다."
 Sweden_foci.45.a: "비우호적인 신호로 받아들인다"
 Sweden_foci.34.t: "블레킹에급 잠수함을 공개한 코쿰스"
 Sweden_foci.34.d: "스웨덴의 조선업체 코쿰스가 최신 개발품인 블레킹에급(A26) 잠수함을 공개했습니다. 차세대 수중 작전을 위해 설계된 이 함정은 선진적인 스텔스 구조, 모듈식 임무 구획, 공기 불요 추진 체계를 갖추고 있습니다.\n\n우리에게 공식 수출 제안이 들어왔습니다. 이제 잠수함을 완제품으로 구매할지, 아니면 일부 구성품과 기술에 접근하기 위한 제한적 파트너십을 맺을지 결정해야 합니다."
 Sweden_foci.34.a: "전체 체계를 주문한다"
 Sweden_foci.34.b: "부분 기술 이전과 통합을 협상한다"
 Sweden_foci.341.t: "블레킹에급 설계도 인도"
 Sweden_foci.341.d: "코쿰스와의 합의에 따라 우리는 블레킹에급 잠수함의 전체 생산 설계도를 인도받았습니다. 국내 생산을 즉시 시작할 수 있으며, 이는 우리 해군에 천해 작전과 스텔스 초계에서 전략적 우위를 가져다줄 것입니다."
 Sweden_foci.341.a: "훌륭하군, 건조대를 준비하라"
 SWE_more_then_10_submarines_TT: "§Y공격 잠수함 10척§! 초과 보유 (현재: [?num_ships_with_type@attack_submarine|Y0])"
 SWE_more_then_400_multi_role_aircraft_TT: "§Y다목적 항공기 400기§! 초과 보유 (현재: [?num_deployed_planes_with_type@small_plane_strike_airframe|Y0])"
 SWE_more_then_20_awacs_aircraft_TT: "§Y조기경보기 24기§! 초과 보유 (현재: [?num_deployed_planes_with_type@large_plane_awacs_airframe|Y0])"
 SWE_more_then_12_special_bat_in_service_TT: "§Y현역 특수 부대 5개 대대§! 초과 보유 (현재: [?num_battalions_with_type@Special_Forces|Y0])"
 SWE_more_then_450_MBT_in_service_TT: "§Y현역 전차 450대§! 초과 보유 (현재: [?num_equipment_in_armies@medium_tank_chassis|Y0])"
 SWE_more_then_1200_IFV_in_service_TT: "§Y현역 보병전투차 1200대§! 초과 보유 (현재: [?num_equipment_in_armies@medium_tank_flame_chassis|Y0])"
 SWE_stinky_melon: "방문받음"
 SWE_weapons_depots: "전략 무기 보관소 분산"
 SWE_weapons_depots_desc: "총력 방위와 장기적 회복력이라는 우리의 교리에 따라, 우리는 군과 향후 저항 활동이 필수 보급품을 끊김 없이 이용할 수 있도록 해야 합니다. \n\n우리는 무기, 탄약, 장비 은닉처를 전국, 특히 농촌과 삼림 지역에 조용히 분산하기 시작할 것입니다. 이 은폐된 보관소들은 예비군 동원의 근간을 이루고 잠재적 점령자에 대한 억제력으로 작용할 것입니다."
 Sweden_news.31.d: "냉전 시대 이후 볼 수 없던 조치로, 스웨덴 정부가 전국에 오랫동안 숨겨져 있던 무기 보관소를 열기 시작했습니다. 원래 총력방위 교리의 일환으로 설치된 이 은닉처에는 국가 비상시 예비군을 지원하기 위한 무기, 탄약, 보급품이 보관되어 있습니다.\n\n스톡홀름은 여전히 평화와 외교에 대한 선호를 강조하고 있지만, 이번 조치는 지역 안보 환경에 대한 우려가 커지고 있음을 보여 줍니다. 보관소의 가동은 수동적 대비에서 적극적 비상 대책으로의 뚜렷한 전환을 의미합니다."
 Sweden_news.31.t: "은폐된 무기 보관소를 가동하는 스웨덴"
 SWE_modernize_marinen_effort: "스웨덴 해군 현대화"
 SWE_modernize_marinen_effort_desc: "스웨덴 해군은 오랫동안 우리의 해안을 방어하고 발트해를 지키는 데 중대한 역할을 해 왔습니다. 그러나 새롭게 등장하는 해상 위협, 장거리 타격 능력, 수중 경쟁은 해군의 근본적인 현대화를 요구합니다.\n\n우리는 최신 수상 전투함, 잠수함 기술, 센서망, 연안전 능력에 투자할 것입니다. 현대적인 해군은 국가 방위뿐 아니라 지역 해양 안보에 기여하고 핵심 해상 교통로를 보호하는 데에도 필수적입니다."
 SWE_swedish_mio_submarine: "스웨덴 잠수함 능력 확장"
 SWE_swedish_mio_submarine_desc: "스웨덴의 잠수함 함대는 전통적으로 발트해의 얕고 좁은 해역에서의 작전에 최적화되어 왔습니다. 그러나 변화하는 전략적 요구는 단순한 연안 방어를 넘어서는 전환을 요구합니다.\n\n우리는 북극 초계에서 원정 정찰에 이르기까지 전 세계 임무에 적합한 연장된 항속 거리, 모듈식 탑재체, 지구력을 갖춘 차세대 설계에 투자해야 합니다. 전담 군산 조직(MIO)은 연구, 생산, 체계 통합을 조율할 수 있게 해 줄 것입니다."
 Sweden_foci.46.t: "코쿰스와의 잠수함 협의"
 Sweden_foci.46.d: "잠수함 함대를 현대화하려는 우리의 움직임에 따라 코쿰스의 대표단이 다양한 제안을 들고 도착했습니다. 그들의 해군 기술자들은 준비가 철저하며, 확장 가능한 주문 계획도 이미 테이블에 올라와 있습니다.\n\n그러나 일정에 없던 또 다른 손님이 구석에 있습니다. 말쑥하게 차려입은 그는 매력적인 비서와 더욱 매력적인 가방을 대동하고, 조달 문제에 대한 '대안적 해법'을 대표하고 있습니다."
 Sweden_foci.46.a: "코쿰스와 공식 계획을 진행한다"
 Sweden_foci.46.b: "가방은 설계도보다 더 큰 목소리로 말한다..."
 Sweden_foci.47.t: "코쿰스 잠수함 제안서 전달"
 Sweden_foci.47.d: "스웨덴이 수중 능력 확장에 다시 관심을 보이면서, 코쿰스가 일련의 선진 잠수함 구상을 제출했습니다. 국방부에 가까운 소식통은 모듈식 스텔스 초계정에서 심해 장거리 플랫폼에 이르기까지 여러 설계가 검토되고 있다고 전합니다.\n\n곧 전략적 결정이 내려질 것으로 예상되며, 해군 분석가들은 함대 현대화에 대한 스웨덴의 의지를 높이 평가하고 있습니다."
 Sweden_foci.47.a: "정말 전문적이군"
 Sweden_foci.48.t: "조용히 도착하는 212급 잠수함"
 Sweden_foci.48.d: "오늘 아침, 독일제 212급 최신 잠수함 두 척이 일부 인사만 참석한 조촐한 의식 속에서 조용히 인도되었습니다. 티센크루프 마린 시스템즈가 개발한 이 함정들은 긴 공식 입찰을 우회한 '병행 도입 경로'를 상징한다고 합니다.\n\n일부 기자들이 거래의 성격과 관련 인물들에 대해 의문을 제기하기 시작했지만, 정부 관계자들은 개의치 않는 듯합니다. 지금으로서는 가방이 약속 이상의 것을 전달한 것으로 보입니다."
 Sweden_foci.48.a: "독일의 효율성"
 Sweden_news.32.t: "전략적 의도를 지닌 왕실 방문?"
 Sweden_news.32.d: "스웨덴 왕실 대표단이 우리나라를 방문하고 있으며, 공식적으로는 외교 관계를 개선하고 호의를 표하기 위한 것입니다. 대중이 열정과 따뜻함으로 이들의 도착을 환영하는 한편, 막후의 논의는 더 실용적입니다.\n\n이번 방문은 기회입니다. 이들의 상징적 인기는 공공 외교에 활용될 수 있으며, 이들의 존재가 진행 중인 협상에서 입장을 누그러뜨릴 수도 있습니다. 동시에 우리 측은 우정만으로는 청구서를 해결할 수 없다는 점을 잘 알고 있으며, 호의가 측정 가능한 전략적 또는 경제적 이익으로 이어지도록 할 때일지도 모릅니다."
 Sweden_news.32.a: "그들의 인기를 대중 소통에 활용한다"
 Sweden_news.32.b: "우리의 우정에는 대가가 있다"
 Sweden_news.33.t: "진정한 우정의 날"
 Sweden_news.33.d: "§Y[FROM.GetNameWithFlag]§!에서의 스웨덴 왕실 방문은 의례적인 행사 이상의 것이 되었습니다. 국빈 만찬과 공동 선언이 일정을 채웠지만, 정말로 중요했던 것은 예상치 못한 대중의 반향이었습니다. 왕실 인사들은 우리 시민들과 직접 대화하고 문화 행사에 참석하며 우리 두 국민 사이의 유대를 상징적으로 강화했습니다.\n\n때로 외교에는 복잡한 협정이 필요하지 않습니다. 때로는 눈에 띄고, 목소리가 들리고, 기억되는 것으로 충분합니다."
 Sweden_news.33.a: "이것이 진정한 우정이다"
 Sweden_news.34.t: "닫힌 문 뒤의 거래"
 Sweden_news.34.d: "왕실 대표단이 신문 헤드라인을 장식했지만, §Y[FROM.GetNameWithFlag]§! 방문의 진정한 성공은 카메라 밖에서 이루어졌습니다. 비공개 회담에서 초기 협상은 교착 상태에 빠졌습니다. 공식 수행단의 일원이던 스웨덴 산업계 대표가 나서서 합작 공장 사업을 제안하고 나서야 돌파구가 마련되었습니다.\n\n거래는 거창하지 않았을지 모르지만, 향후 협력의 토대를 놓았습니다. 때로 외교는 말보다 사업적 감각으로 매듭지어집니다."
 Sweden_news.34.a: "대단하진 않지만 그래도 성공이다"
 Sweden_foci.50.t: "NORDEFCO 초청"
 Sweden_foci.50.d: "북유럽 방위 협력(NORDEFCO)은 북유럽 지역 전반의 전략적 연대와 군사 협력을 위한 중요한 포럼으로 성장했습니다. 최근 우리는 정회원으로 참여해 달라는 공식 초청을 받았습니다.\n\n이 제안은 합동 훈련, 군수 지원, 공동 조달 구조에 대한 접근을 약속하지만, 비판자들은 이웃 국가들의 방위 태세에 지나치게 묶이고 국가 주권의 일부가 침식될 수 있다고 경고합니다. 북유럽의 긴밀한 협력은 전진일까요, 아니면 지나친 양보일까요?"
 Sweden_foci.50.a: "NORDEFCO에 참여한다"
 Sweden_foci.50.b: "우리의 독립을 포기하지 않는다"
 Sweden_foci.51.t: "NORDEFCO 가입을 거부한 [FROM.GetNameWithFlag]"
 Sweden_foci.51.d: "개방된 초청과 단일한 북유럽 방위 체제에 대한 기대에도 불구하고, [FROM.GetName]은(는) NORDEFCO의 정회원으로 가입하기를 공식적으로 거절했습니다. 주권과 전략적 자율성의 문제로 규정된 이 결정은 지역 통합 노력에 그림자를 드리웠습니다.\n\n향후 협력의 문은 여전히 열려 있지만, 이는 북방의 집단 방위 능력을 강화할 기회를 놓친 것입니다."
 Sweden_foci.51.a: "유감스러운 결정이다"
 Sweden_foci.52.t: "NORDCAPS 창설"
 Sweden_foci.52.d: "우리는 새로 형성되는 북유럽-발트 군사 협력 체제인 NORDCAPS에 참여해 달라는 초청을 받았습니다. 변화하는 세력 균형과 커지는 하이브리드 위협 속에서 지역적 단결은 더 이상 사치가 아니라 필수입니다.\n\n가입은 북유럽 및 발트 국가 간의 합동 훈련, 상호 운용성, 공동 조달 전략, 공통 방위 교리를 의미합니다. 어떤 이들은 이를 북방에서 진정으로 독립적인 유럽 안보 정체성의 토대로 봅니다. 다른 이들은 전략적 유연성의 상실을 경고합니다.\n\n우리는 한 걸음 나아갈 것인가?"
 Sweden_foci.52.a: "뭉치면 더 강하다"
 Sweden_foci.52.b: "우리는 홀로 걷는다"
 Sweden_foci.53.t: "기회를 낭비한 그들"
 Sweden_foci.53.d: "다른 한 나라가 집단 방위 구상에 우리와 함께할 기회를 얻었으나 그것을 놓치고 말았습니다. 우리가 손을 내밀었을 때 그들은 망설이고, 허세를 부리거나, 요청을 무시했습니다.\n\n역사에는 선택이 정책 이상의 것을 결정짓는 순간이 있습니다. 이번이 바로 그런 순간이었습니다."
 Sweden_foci.53.a: "멍청이들"
 Sweden_foci.54.t: "노르드방켄 출범"
 Sweden_foci.54.d: "스웨덴 당국이 지역적으로 강한 영향력을 지닌 대형 금융기관 노르드방켄을 탄생시킬 은행 합병을 승인했습니다. 그들은 우리에게 이 결합을 지지하고 참여해 달라고 초청하고 있습니다. 이러한 협력은 새로운 금융 기회를 열고 국경 간 투자를 강화할 수 있습니다."
 Sweden_foci.54.a: "이는 우리 경제에 활력을 불어넣을 것이다."
 Sweden_foci.54.b: "아니다, 거절하겠다."
 Sweden_foci.55.t: "스웨덴의 군산 협력 확대 제안"
 Sweden_foci.55.d: "스웨덴은 군수 산업 분야에서의 협력을 심화하는 협정을 제안했습니다. 여기에는 공동 개발 프로젝트, 생산 능력 공유, 효율과 역량을 높이기 위한 조달 조율이 포함됩니다."
 Sweden_foci.55.a: "제안을 수락한다."
 Sweden_foci.55.b: "생산을 국내에 유지한다."
 Sweden_foci.56.t: "스웨덴 기술 공유 그룹 초청"
 Sweden_foci.56.d: "스웨덴이 새로 설립된 기술 공유 그룹에 가입해 달라는 초청을 보내왔습니다. 이 구상은 신뢰할 수 있는 파트너 간에 첨단 연구, 방위 기술, 산업 혁신 분야의 협력을 촉진하는 것을 목표로 합니다."
 Sweden_foci.56.a: "협정에 서명한다."
 Sweden_foci.56.b: "제안을 거절한다."
 Sweden_foci.57.t: "리퍼 드론 구매 요청"
 Sweden_foci.57.d: "스웨덴 정부가 MQ-9 리퍼 드론을 구매하겠다는 요청을 해 왔습니다. 그들은 이 도입이 정찰 및 타격 능력을 크게 향상시켜 현대적 위협에 대응하는 능력을 강화할 것이라고 주장합니다."
 Sweden_foci.57.a: "드론을 판매한다."
 Sweden_foci.57.b: "요청을 거부한다."
 Sweden_royal.13.t: "왕립 문화원 설립 제안"
 Sweden_royal.13.d: "스웨덴 외교 대표단이 명망 있는 제안을 가지고 도착했습니다. 그들은 문화 교류를 심화하고, 상호 이해를 증진하며, 양자 관계를 강화하는 것을 목표로 우리나라에 왕립 문화원을 설립하기를 희망합니다. 이 문화원은 전시회, 학술 교류, 공동 역사 프로젝트를 개최하는 한편 양국 국민 사이의 상징적 가교 역할을 할 것입니다.\n\n이러한 기관은 우리의 관계를 강화하고 협력의 지속적인 토대를 만들 수 있지만, 우리 행정부 내 일부는 잠재적인 정치적 함의를 경계하고 있습니다."
 Sweden_royal.13.a: "이는 우리 모두에게 이익이 될 것이다"
 Sweden_royal.13.b: "답은 거절이다"
 SWE_norways_kings: "노르웨이의 왕들"
 SWE_norways_kings_desc: "길고 자랑스러운 역사를 지닌 노르웨이 왕실은 노르웨이에서 통합과 전통의 존경받는 상징으로 남아 있습니다. 우리 왕가와의 긴밀한 역사적, 가족적 유대는 양국 간의 결속을 강화할 독특한 기회를 제공합니다. 왕실 외교, 공동 문화 행사, 조율된 대중 활동을 장려함으로써 두 군주제 사이의 개인적 유대를 강화할 수 있습니다.\n\n이러한 노력은 북유럽의 동족 의식을 더욱 굳건히 하고 양국 국민 사이의 신뢰를 깊게 하며, 세계의 눈에 단합된 왕실의 모습을 보여 줄 수 있습니다."
 SWE_nb8_member: "북유럽-발트 협력 회원국"
 SWE_small_arms_improve: "소화기 현대화"
 SWE_small_arms_improve_desc: "노를란드의 숲에서 스톡홀름의 거리에 이르기까지, 우리 병사들은 현대 군대에 걸맞은 무기를 갖추어야 합니다. 소형 화기의 설계, 생산, 보급을 개선함으로써 스웨덴 병사가 계속 정밀함과 신뢰성의 상징으로 남도록 하겠습니다."
 SWE_military_review_idea: "군사 검토"
 SWE_economy_review_idea: "경제 검토"
 SWE_science_patronage_idea: "과학 후원"
 SWE_real_kingdom: "진정한 스웨덴 왕국 선포"
 SWE_real_kingdom_desc: "국민이 목소리를 냈으며 그 뜻은 무시될 수 없습니다. 진정한 스웨덴 왕국을 공식 선포함으로써, 우리는 왕관을 우리 국가 정체성의 중심 기둥이라는 전통적 자리에 되돌려 놓고 이를 현대적 통치의 안정성과 결합합니다. 카롤루스 렉스가 우리를 새로운 시대로 이끌 준비를 마쳤습니다."
 SWE_real_equality: "진정한 평등"
 SWE_ban_islam_modifier: "이슬람 금지"
 SWE_tight_bands: "우호 관계"
 SWE_Swedish_mediation: "스웨덴의 외교"
 Swedisch_monarchy: "스웨덴 왕실 외교"
 SWE_neutral_trade_efforts: "중립 무역 노력"
 SWE_neutral_efforts: "중립 무역 노력"
 SWE_opened_market: "우리에게 개방된 시장"
 SWE_anti_nato_minus: "반나토 노선"
 SWE_anti_nato_plus: "반나토 노선"
 SWE_send_to_UN: "왕실 구성원을 UN 프로그램에 파견"
 SWE_visit_asia: "극동 외교 사절단"
 SWE_visit_EU: "유럽 왕실 외교 순방"
 SWE_governmental_office: "의회 인턴십"
 SWE_trading_net: "북유럽 무역망"
 SWE_trading_net_desc: "스웨덴은 북유럽 전역에 걸쳐 무역 연계를 강화하여 핵심 수입품을 확보하고 수출을 늘리며 성장을 안정시키는 탄력적인 경제망을 구축했습니다."
 SWE_gold_reserve: "전략 금 보유고"
 SWE_gold_reserve_desc: "국가 금 보유량을 늘림으로써 스웨덴은 금융적 독립성과 신뢰성을 강화하고, 위기와 외부 압력에 대한 완충 장치를 마련합니다."
 SWE_swiss_neutrality: "스위스식 중립"
 SWE_swiss_neutrality_desc: "스위스의 관행을 본받아, 스웨덴은 신뢰할 만한 방위력을 유지하면서 엄격한 중립을 지킬 것을 천명합니다. 이는 행동의 자유와 외교적 유연성을 보존합니다."
 SWE_neutrality_reintended: "중립 재확인"
 SWE_neutrality_reintended_desc: "스웨덴은 공정한 외교와 독자적인 정책 결정의 원칙으로 돌아갈 것입니다. 중립 입장을 재확인함으로써 우리는 동맹이나 블록이 아니라 주권의 수호와 평화적 해결책의 추구에 전념합니다."
 SWE_refuse_all_block_membership: "모든 블록 가입 거부"
 SWE_refuse_all_block_membership_desc: "스웨덴은 모든 군사 및 정치 블록 밖에 머물며 행동의 자유를 보존하고 우리의 외교 정책이 오직 스웨덴의 이익에 의해서만 좌우되도록 할 것입니다."
 SWE_host_international_mediation_summit: "국제 중재 정상회의 개최"
 SWE_host_international_mediation_summit_desc: "우리는 진행 중인 분쟁의 해결을 목표로 하는 정상회의에 전 세계의 외교관, 협상가, 지도자들을 스웨덴으로 초청할 것입니다. 이는 신뢰받는 중재자로서의 우리의 평판을 강화할 것입니다."
 SWE_security_guaraties_for_neutrals: "중립국 안전 보장"
 SWE_security_guaraties_for_neutrals_desc: "다른 중립국들에 상호 방위 보장을 제공함으로써 우리는 침략에 대한 집단적 억제력을 만들고 독립에 대한 공동의 의지를 강화합니다."
 SWE_non_aligned_trade_network: "비동맹 무역망"
 SWE_non_aligned_trade_network_desc: "우리는 비동맹 국가들 사이에 무역망을 구축하여 정치적 얽힘 없이 안정적인 경제 관계를 보장할 것입니다."
 SWE_emergency_refugees_hub: "긴급 난민 거점"
 SWE_emergency_refugees_hub_desc: "스웨덴은 위기 시 난민을 수용하고 처리할 신속 대응 인프라를 구축하여 인도주의적 책임과 국가 안보 사이의 균형을 맞출 것입니다."
 SWE_international_arbitration_authoritry: "국제 중재 기구"
 SWE_international_arbitration_authoritry_desc: "스웨덴은 중립적 감독 아래 국가와 기업 간 분쟁에 법적 해결을 제공하는 상설 중재 기구를 설립할 것입니다."
 SWE_enshine_Armed_neutrality_in_law: "무장 중립의 법제화"
 SWE_enshine_Armed_neutrality_in_law_desc: "우리는 무장 중립을 헌법적 원칙으로 삼아 향후 정부들이 스웨덴의 독자적 방위와 외교적 공정성을 지키도록 보장할 것입니다."
 SWE_total_border_sorvailance: "전면 국경 감시"
 SWE_total_border_sorvailance_desc: "모든 국경을 따라 첨단 감시 체계를 통합함으로써 우리는 침투, 밀수, 간첩 행위로부터 영토를 지킵니다."
 SWE_reinforce_gotland_bastion: "고틀란드 보루 강화"
 SWE_reinforce_gotland_bastion_desc: "고틀란드는 발트해 안보의 열쇠입니다. 우리는 모든 적대 행위를 억제하기 위해 이곳의 요새, 방공망, 해군 주둔을 확대할 것입니다."
 SWE_underground_command_center: "지하 지휘 센터"
 SWE_underground_command_center_desc: "우리는 가장 심각한 위기 속에서도 국가 지도부가 기능할 수 있도록 강화된 지하 지휘 시설을 건설할 것입니다."
 SWE_Energy_autarky_program: "에너지 자급 프로그램"
 SWE_Energy_autarky_program_desc: "에너지원을 다변화하고 국내 생산을 늘림으로써 스웨덴은 해외 에너지 공급에 대한 의존을 없앨 수 있습니다."
 SWE_Arctic_defence_initiative: "북극 방위 구상"
 SWE_Arctic_defence_initiative_desc: "우리는 북부 영토와 항로를 지키기 위해 북극에서의 군사적 주둔과 인프라를 강화할 것입니다."
 SWE_national_cyber_defense_grid: "국가 사이버 방어망"
 SWE_national_cyber_defense_grid_desc: "완전히 통합된 사이버 방어 네트워크가 핵심 인프라와 국가 통신을 디지털 침입으로부터 보호할 것입니다."
 SWE_gold_reserve_expansion: "금 보유고 확대"
 SWE_gold_reserve_expansion_desc: "금 보유고를 늘리면 금융 안정성이 높아지고 세계적 불확실성의 시기에 경제 주권이 강화됩니다."
 SWE_banking_secrecy_act: "은행 비밀 보호법"
 SWE_banking_secrecy_act_desc: "우리는 은행 고객에 대한 엄격한 기밀 보호를 도입하여 외국인 예금을 유치하는 동시에 금융 중립을 강화할 것입니다."
 SWE_national_militaria_expansion: "국가 군수품 확충"
 SWE_national_militaria_expansion_desc: "우리는 어떤 상황에서도 대비 태세를 갖추기 위해 무기, 탄약, 군사 장비의 비축량을 늘릴 것입니다."
 SWE_universal_conscription_reform: "보편 징병제 개혁"
 SWE_universal_conscription_reform_desc: "우리는 징병 체계를 현대화하고 확대하여 모든 시민이 훈련을 받고 국가를 방어할 준비가 되도록 할 것입니다."
 SWE_armed_financial_neutrality_doctrine: "무장 금융 중립 교리"
 SWE_armed_financial_neutrality_doctrine_desc: "탄탄한 방위 능력과 엄격한 경제적 독립을 결합함으로써 스웨덴은 군사적 압박과 금융적 압박을 모두 억제할 것입니다."
 SWE_declaration_of_perpetual_neutrality: "영세 중립 선언"
 SWE_declaration_of_perpetual_neutrality_desc: "우리는 스웨덴의 영세 중립을 공식 선언하여 침략 전쟁을 피할 것을 약속하는 한편, 스스로를 방어할 힘을 유지할 것입니다."
 SWE_neutrality_without_equal: "비길 데 없는 중립"
 SWE_neutrality_without_equal_desc: "외교, 경제적 독립, 군사적 대비 태세를 통해 스웨덴은 진정으로 독립적이며 존경받는 중립국의 세계적 표준이 될 것입니다."
 SWE_eastern.01.t: "합동 군사 훈련 초청"
 SWE_eastern.01.d: "스웨덴이 지역 협력과 대비 태세를 높이기 위해 러시아와의 합동 군사 훈련을 제안했습니다.\n"
 SWE_eastern.01.a: "초청을 수락한다"
 Sweden_eastern.01.b: "정중히 거절해야 한다"
 Sweden_eastern.101.t: "초청을 수락한 러시아"
 Sweden_eastern.101.d: "러시아가 합동 군사 훈련을 실시하자는 우리의 제안을 수락했습니다. 이는 군사 협력의 반가운 신호입니다.\n"
 Sweden_eastern.101.a: "단결이 곧 힘이다"
 Sweden_eastern.102.t: "초청을 거절한 러시아"
 Sweden_eastern.102.d: "러시아가 군사 훈련에 참여하자는 스웨덴의 초청을 거절했습니다. 그 결과 외교적 긴장이 다소 높아집니다.\n"
 Sweden_eastern.102.a: "이해한다"
 Sweden_eastern.02.t: "일대일로 구상 참여 제안"
 Sweden_eastern.02.d: "스웨덴이 중국에 일대일로 구상에 참여하자고 공식 초청하였으며, 유라시아 경제 유대를 강화하기 위한 인프라 사업에 공동 투자를 제안했습니다.\n"
 Sweden_eastern.02.a: "좋다, 중국이 대규모로 투자한다"
 Sweden_eastern.02.b: "제한적으로 지원한다"
 Sweden_eastern.02.c: "거절해야 한다"
 Sweden_eastern.03.t: "대규모 투자를 약속한 중국"
 Sweden_eastern.03.d: "중국이 상당한 투자 약속과 함께 스웨덴의 제안을 수락했습니다. 이는 양국의 경제적, 정치적 유대를 크게 강화했습니다.\n"
 Sweden_eastern.03.a: "우리 공동의 번영을 위하여"
 Sweden_eastern.04.t: "중간 규모의 투자를 제안한 중국"
 Sweden_eastern.04.d: "중국이 중간 수준으로 구상에 참여하기로 합의했으며, 이는 호의와 공동 인프라 노력에 대한 제한적인 의지를 나타냅니다.\n"
 Sweden_eastern.04.a: "신중한 협력"
 Sweden_eastern.05.t: "참여를 거절한 중국"
 Sweden_eastern.05.d: "중국이 스웨덴과 협력하여 일대일로 구상에 참여하기를 거부했습니다. 이로 인해 협력은 더뎌지겠지만 외교적 경로는 여전히 열려 있습니다.\n"
 Sweden_eastern.05.a: "당신들의 결정을 존중한다"
 Sweden_eastern.07.t: "전략적 에너지 협약 제안"
 Sweden_eastern.07.d: "스웨덴이 러시아 연방에 전략적 에너지 협정을 제안했으며, 장기적인 연료 및 인프라 협력을 확보하는 것을 목표로 합니다.\n"
 Sweden_eastern.07.a: "제안을 수락하고 투자한다"
 Sweden_eastern.07.b: "거절해야 한다"
 Sweden_eastern.08.t: "에너지 협약을 수락한 러시아"
 Sweden_eastern.08.d: "러시아가 에너지 협약을 수락했습니다. 공동 인프라 개발과 더 깊은 경제적 유대가 뒤따를 것입니다.\n"
 Sweden_eastern.08.a: "에너지 동맹이 탄생했다"
 Sweden_eastern.09.t: "에너지 협약을 거부한 러시아"
 Sweden_eastern.09.d: "러시아가 전략적 에너지 협정 제안을 거부했습니다. 스웨덴은 이제 다른 에너지 파트너를 모색해야 합니다.\n"
 Sweden_eastern.09.a: "실망스러운 결과다"
 Sweden_eastern.10.t: "군사 기술 교류 제안"
 Sweden_eastern.10.d: "스웨덴이 혁신과 전략적 조율을 촉진하기 위해 사브와 인민해방군 간의 공동 군사 기술 교류 프로그램을 제안합니다.\n"
 Sweden_eastern.10.a: "수락하고 협력을 시작한다"
 Sweden_eastern.10.b: "제안을 거절한다"
 Sweden_eastern.11.t: "기술 교류를 수락한 중국"
 Sweden_eastern.11.d: "중국이 공동 기술 교류 제안을 수락했습니다. 사브와 인민해방군의 기술자들이 공동 연구를 시작할 것입니다.\n"
 Sweden_eastern.11.a: "훌륭하군"
 Sweden_eastern.12.t: "기술 교류를 거부한 중국"
 Sweden_eastern.12.d: "중국이 기술 협력에 대한 스웨덴의 제안을 거부했습니다. 이로 인해 스웨덴의 국방 연구개발 선택지가 제한됩니다.\n"
 Sweden_eastern.12.a: "유감이다"
 Sweden_eastern.14.t: "광물 협약 제안"
 Sweden_eastern.14.d: "스웨덴이 경제 협력과 승인을 대가로 희소 광물과 산업 자원을 확보하기 위해 북한에 전략적 협정을 제안합니다.\n"
 Sweden_eastern.14.a: "광물 협약을 수락한다"
 Sweden_eastern.14.b: "제안을 거절한다"
 Sweden_eastern.15.t: "광물 협약을 수락한 북한"
 Sweden_eastern.15.d: "북한이 제안을 수락했습니다. 스웨덴은 핵심 전략 자원의 수입을 시작할 것이며 제한적인 협력 관계가 수립되었습니다.\n"
 Sweden_eastern.15.a: "훌륭하군"
 Sweden_eastern.16.t: "협약을 거부한 북한"
 Sweden_eastern.16.d: "북한이 광물 협정에 대한 스웨덴의 제안을 거부했습니다. 이는 스웨덴의 장기적인 산업 자원 조달 전략을 복잡하게 만들 수 있습니다.\n"
 Sweden_eastern.16.a: "유감이다"
 Sweden_eastern.17.t: "군수 산업 교류 제안"
 Sweden_eastern.17.d: "스웨덴이 군수 산업 전문 지식과 설비를 교환하기 위해 북한에 비밀 협정을 제안합니다. 이러한 협력은 양측의 생산을 개선할 수 있지만 국제적 반발의 위험이 있습니다.\n"
 Sweden_eastern.17.a: "교류에 동의한다"
 Sweden_eastern.17.b: "이런 위험을 감수할 수 없다"
 Sweden_eastern.18.t: "산업 협약을 수락한 북한"
 Sweden_eastern.18.d: "북한이 산업 협력 거래에 동의했습니다. 상호 군수 산업 발전이 이제 진행 중입니다.\n"
 Sweden_eastern.18.a: "뜻밖의 동맹"
 Sweden_eastern.19.t: "제안을 거부한 북한"
 Sweden_eastern.19.d: "북한이 산업 협정을 거부했습니다. 스웨덴은 군수 생산을 확대할 다른 방법을 모색해야 합니다.\n"
 Sweden_eastern.19.a: "놓쳐 버린 기회"
 Sweden_eastern.20.t: "스웨덴의 북극 무역 철도 건설 제안"
 Sweden_eastern.20.d: "스웨덴 정부가 공동 인프라 사업, 즉 스톡홀름과 무르만스크를 잇는 대용량 철도에 투자할 것을 제안했습니다. 이 노선은 북극 회랑을 가로지르는 양국 간의 무역과 물류를 강화할 것입니다.\n"
 Sweden_eastern.20.a: "기차가 승리를 가져온다"
 Sweden_eastern.21.t: "스웨덴과의 투자 협약 제안"
 Sweden_eastern.21.d: "스웨덴이 베네수엘라에 양자 투자 협정을 제안했습니다. 스웨덴은 베네수엘라산 석유를 받는 대가로 베네수엘라의 인프라와 첨단 기술에 투자할 것입니다.\n"
 Sweden_eastern.21.a: "협약을 수락한다"
 Sweden_eastern.21.b: "거절해야 한다"
 Sweden_eastern.22.t: "투자 협약을 수락한 베네수엘라"
 Sweden_eastern.22.d: "베네수엘라가 투자 협약에 동의했습니다. 스웨덴은 석유를 받고, 베네수엘라는 스웨덴의 전문 지식과 인프라 투자의 혜택을 얻게 됩니다.\n"
 Sweden_eastern.22.a: "훌륭한 협력이다"
 Sweden_eastern.23.t: "투자 협약을 거부한 베네수엘라"
 Sweden_eastern.23.d: "베네수엘라가 상호 투자 협정에 대한 스웨덴의 제안을 거부했습니다. 외교 및 에너지 협력은 진행되지 않을 것입니다.\n"
 Sweden_eastern.23.a: "유감이다"
 Sweden_eastern.24.t: "해상 유전 협력 제안"
 Sweden_eastern.24.d: "스웨덴이 대서양 연안을 따라 해상 유전 플랫폼을 개발하기 위해 앙골라와 공동 구상을 제안했습니다. 이 협력은 에너지 공급을 확보하고 앙골라의 채굴 인프라를 끌어올릴 것입니다.\n"
 Sweden_eastern.24.a: "합작 사업을 수락한다"
 Sweden_eastern.24.b: "제안을 거절한다"
 Sweden_eastern.25.t: "해상 유전 협정을 수락한 앙골라"
 Sweden_eastern.25.d: "앙골라가 제안을 수락했습니다. 스웨덴은 공동 해상 플랫폼 개발에 투자하여 귀중한 석유 매장량에 대한 접근권을 넓힐 것입니다.\n"
 Sweden_eastern.25.a: "값진 협력 관계다"
 Sweden_eastern.26.t: "제안을 거부한 앙골라"
 Sweden_eastern.26.d: "앙골라가 공동 해상 개발에 대한 스웨덴의 제안을 거절했습니다. 외교 경로는 계속 열려 있지만 협력은 진행되지 않을 것입니다.\n"
 Sweden_eastern.26.a: "유감이다"
 Sweden_eastern.27.t: "전략 금속 협약 제안"
 Sweden_eastern.27.d: "스웨덴이 남아프리카공화국의 희소 금속과 전략 금속에 대한 접근권을 확보하기 위한 양자 협정을 제안했습니다. 그 대가로 스웨덴은 채굴 기술과 산업 역량에 투자할 것입니다.\n"
 Sweden_eastern.27.a: "제안을 수락한다"
 Sweden_eastern.27.b: "제안을 거절한다"
 Sweden_eastern.28.t: "금속 협약을 수락한 남아프리카공화국"
 Sweden_eastern.28.d: "남아프리카공화국이 양자 협약에 동의했습니다. 스웨덴은 희소 금속에 대한 보장된 접근권을 얻고, 남아프리카공화국은 기술 투자와 채굴 협력의 혜택을 얻습니다.\n"
 Sweden_eastern.28.a: "값진 협력 관계다"
 Sweden_eastern.29.t: "협약을 거부한 남아프리카공화국"
 Sweden_eastern.29.d: "남아프리카공화국이 제안된 금속 무역 협정을 거부했습니다. 스웨덴은 자원 수요를 충족할 다른 파트너를 찾아야 할 것입니다.\n"
 Sweden_eastern.29.a: "유감스러운 일이다"
 Sweden_eastern.30.t: "스웨덴과의 의료 교류 제안"
 Sweden_eastern.30.d: "스웨덴이 의료 협력 협정을 제안했습니다. 쿠바는 의사와 세계적인 보건 경험을 제공하고, 스웨덴은 연구, 장비, 바이오 기술 전문성을 제공합니다.\n"
 Sweden_eastern.30.a: "의료 교류를 수락한다"
 Sweden_eastern.30.b: "제안을 거절한다"
 Sweden_eastern.31.t: "의료 교류를 수락한 쿠바"
 Sweden_eastern.31.d: "쿠바가 의료 협력 협정을 수락했습니다. 이제 공동 의료 사절단과 연구 교류 프로그램이 시작될 것입니다.\n"
 Sweden_eastern.31.a: "세계 보건을 위하여"
 Sweden_eastern.32.t: "의료 교류를 거부한 쿠바"
 Sweden_eastern.32.d: "쿠바가 의료 협력 제안을 거절했습니다. 외교적 보건 협력은 진행되지 않을 것입니다.\n"
 Sweden_eastern.32.a: "놓쳐 버린 기회"
 Sweden_eastern.33.t: "스웨덴-이란 석유화학 협약 제안"
 Sweden_eastern.33.d: "스웨덴 정부가 이란 석유부에 공식 제안서를 제출했습니다. 이 거래는 정유 인프라, 해상 시설, 첨단 석유화학 가공에 대한 공동 투자를 골자로 합니다. 스웨덴은 석유 기반 자원의 안정적인 공급을 추구하고, 이란은 스웨덴의 산업 전문성, 장비, 외국 자본의 혜택을 누리게 됩니다.\n\n수락될 경우 이 협정은 장기적인 전략적 에너지 파트너십의 토대를 마련할 수 있습니다."
 Sweden_eastern.33.a: "석유화학 협약을 수락한다"
 Sweden_eastern.33.b: "제안을 거부한다"
 Sweden_eastern.34.t: "석유화학 협약을 수락한 이란"
 Sweden_eastern.34.d: "이란이 스웨덴과의 제안된 협정을 승인했습니다. 합작 사업을 통해 정유 단지의 개발과 현대화가 시작되고 산업 규모의 화학 생산이 확대될 것입니다. 스웨덴 엔지니어링 기업들이 이란 시장 진출을 준비하고 있으며, 이는 양국 경제 관계의 새로운 장을 엽니다.\n"
 Sweden_eastern.34.a: "파트너십을 개시한다"
 Sweden_eastern.35.t: "석유화학 협약을 거부한 이란"
 Sweden_eastern.35.d: "이란이 석유화학 파트너십을 맺자는 스웨덴의 제안을 거절했습니다. 외교 경로는 계속 열려 있지만 공동 에너지 개발의 기회는 무기한 연기되었습니다.\n"
 Sweden_eastern.35.a: "유감이지만 이해한다"
 Sweden_eastern.36.t: "드론 기술 교류 제안"
 Sweden_eastern.36.d: "스웨덴이 이란과 양자 기술 협약을 맺겠다고 제안했습니다. 전투 드론 설계와 작전 데이터에 대한 접근권을 받는 대가로, 스웨덴은 사브의 최첨단 항공우주 및 전자전 체계를 제공할 것입니다.\n\n양국은 실전 검증을 거친 무인 항공기 체계와 첨단 무인 항공기 체계의 상호 교류로부터 이익을 얻을 것입니다."
 Sweden_eastern.36.a: "기술 교류에 동의한다"
 Sweden_eastern.36.b: "제안을 거부한다"
 Sweden_eastern.37.t: "드론 협약을 수락한 이란"
 Sweden_eastern.37.d: "이란이 양자 드론 기술 협정을 수락했습니다. 이제 스웨덴과 이란의 기업 및 군 참모진 사이에서 무인기 개발 협력과 교차 훈련이 시작될 것입니다.\n"
 Sweden_eastern.37.a: "공동 프로그램을 개시한다"
 Sweden_eastern.38.t: "드론 협약을 거부한 이란"
 Sweden_eastern.38.d: "이란이 공동 드론 연구개발 협약에 대한 스웨덴의 제안을 거절했습니다. 이 구상은 당분간 보류되었습니다.\n"
 Sweden_eastern.38.a: "유감이다"
 SWE_towards_communism: "사회주의로의 이행"
 SWE_towards_communism_desc: "사회 내의 불의를 온전히 해결하려면 노동 계급이 생산 수단을 통제하는 사회주의 경제로 전환해야 합니다. 부를 재분배하고, 노동자에게 힘을 실으며, 계급에 기반한 분열을 철폐함으로써 더 평등하고 정의로운 사회를 건설할 수 있습니다."
 SWE_industry_exchange_swe_desc: "북한과의 은밀한 산업 거래로 스웨덴 무기 제조업체들에 값싼 자재와 노동력이 공급되어 생산량이 향상됩니다."
 Sweden_news.31.a: "이것이 우리의 마지막 수단이다"
 SWE_swedish_startup_funds: "스웨덴 스타트업 투자 기금"
 SWE_swedish_startup_funds_desc: "혁신을 촉진하기 위해 신생 스타트업을 지원하고 기업가 정신을 육성하는 국가 기금을 설립할 것입니다."
 philip_officer_training: "장교 훈련 중인 칼 필립 왕자"
 victoria_officer_training: "장교 훈련 중인 빅토리아 공주"
 SWE_c_green_centrist_identity_desc: "녹색이고 시장 친화적이며 인본주의와 실용주의에 뿌리를 둔 새로운 정치적 정체성을 만들어 갑니다."
 SWE_allow_crypto_tt: "§Y암호화폐§!를 법정 화폐이자 유효한 투자 수단으로 허용하면 월별 급등과 급락이 발생할 수 있습니다. 매달 큰 금액을 §G얻거나§! §R잃게§! 됩니다.\n\n"
 Sweden_foci.70.t: "성공적으로 달성된 우리의 군사 협력 목표"
 Sweden_foci.70.d: "우리의 노력이 결실을 맺었으며, 세계 평화를 향한 길에서 또 한 걸음 크게 내디뎠습니다."
 Sweden_foci.70.b: "오늘은 우리의 좋은 날이다."
 Sweden_foci.71.t: "좌절된 우리의 군사 협력 의도"
 Sweden_foci.71.d: "많은 노력을 기울였음에도 우리의 사업은 늘 좌절에 직면하지만, 우리는 계속 나아갈 수 있다고 확신합니다."
 Sweden_foci.71.b: "걱정하지 마라, 언젠가 우리에게도 기회는 올 것이다."
 SWE_BoforsDefenceAB_manufacturer: "보포르스 디펜스 AB"
 SWE_AlvisHagglunds_tank_manufacturer: "알비스 헤글룬드"
 SWE_saab_ab_aircraft_manufacturer: "사브 항공"
 SWE_saab_ab_materiel_manufacturer: "사브 AB"
 SWE_kockums_ab_naval_manufacturer: "코쿰스 함정 조선소"
 SWE_kockums_ab_naval_manufacturer2: "코쿰스 잠수함 조선소"
 SWE_idea_no_hijab: "히잡 금지"
 SWE_idea_no_hijab_desc: "히잡은 극단적 종교의 상징이며, 스웨덴에는 극단적 종교가 설 자리가 없습니다."
 SWE_science_nordic_idea: "북유럽 과학 협력"
 SWE_science_nordic_idea_desc: "우리가 함께 뭉칠 때 더 강해질 것입니다."
 SWE_idea_foi: "총력방위 연구소(Totalförsvarets forskningsinstitut)"
 SWE_idea_foi_desc: "총력방위 연구소(Totalförsvarets forskningsinstitut)는 우리 국가 방위를 새로운 시대로 이끌 것입니다."
 SWE_riksglans: "릭스글란스"
 SWE_riksglans_desc: "조국에 영광을."
 SWE_saab_bofors_dynamics_materiel_manufacturer: "사브 보포르스 다이내믹스"
 Sweden_foci.7.o4: "자체 사업을 조달한다"
 Sweden_foci.4.o4: "우리에게는 자금이 없다"
 Sweden_foci.5.o4: "우리에게는 자금이 없다"
 SWE_visit_sverige_income: "비지트 스베리예 수입"
 Sweden_royal.2.o2_desc: "해군 전통과 전술 설계에 개인적 관심이 있는 칼 필립 왕자는 해양 중심의 장교 교육을 받게 됩니다. 직업 장교들 사이에서의 그의 존재는 군주제와 작전 방위 공동체 사이의 유대를 강화합니다."
 SWE_change_royal_modifier_tt: "§Y군주제§! 동적 변동치를 수정합니다"
 SWE_open_weapons_depots: "무기 보관소 개방"
 Sweden_foci.101.other_t: "왕실 구상 종결"
 Sweden_foci.101.other_d: "이 왕실 구상에 대한 응답은 이미 접수되어 조치가 이루어졌습니다. 여기서 우리가 더 결정할 사항은 없습니다."
 Sweden_foci.101.other_a: "알겠다."
 Sweden_foci.102.other_t: "왕실 구상 종결"
 Sweden_foci.102.other_d: "이 왕실 구상에 대한 응답은 이미 접수되어 조치가 이루어졌습니다. 여기서 우리가 더 결정할 사항은 없습니다."
 Sweden_foci.102.other_a: "알겠다."
 Sweden_news.4.other_t: "스웨덴 소식"
 Sweden_news.4.other_d: "국제 관찰자들은 스웨덴의 국내 및 방위 정책의 최근 동향에 주목하지만, 그 세부 사항은 지역 밖에서는 거의 관심을 끌지 못합니다."
 Sweden_news.4.other_a: "알겠다."
 SWE_can_request_from_USA: "미국이 존재하며 스웨덴이 미국과 비동맹이거나 동맹 관계임"
 SWE_can_request_from_SOV: "러시아가 존재하며 스웨덴이 러시아와 비동맹이거나 동맹 관계임"
 SWE_can_request_from_GER: "독일이 존재하며 스웨덴이 독일과 비동맹이거나 동맹 관계임"
 SWE_can_request_from_FRA: "프랑스가 존재하며 스웨덴이 프랑스와 비동맹이거나 동맹 관계임"
 SWE_can_request_from_NRY: "노르웨이가 존재하며 스웨덴이 노르웨이와 비동맹이거나 동맹 관계임"
 SWE_can_request_from_FIN: "핀란드가 존재하며 스웨덴이 핀란드와 비동맹이거나 동맹 관계임"
 Sweden_news.20.other_t: "스웨덴의 국내 논쟁"
 Sweden_news.20.other_d: "스웨덴 공영 방송이 외교 정책과 중립에 관한 또 하나의 프로그램을 방영했으나, 국경 밖에서는 제한적인 관심만 끌었습니다."
 Sweden_news.20.other_a: "알겠다."
 SWE_radical_or_autocratic_in_power_TT: "§Y[Conservative_L]§!, §Y[Autocracy_L]§!, §Y[anarchist_communism_L]§!, or §Y[communist_state_L]§! is in power."
 SWE_radical_in_power_TT: "§Y[Conservative_L]§!, §Y[anarchist_communism_L]§! 또는 §Y[communist_state_L]§!이(가) 집권 중입니다."
