 early_helicopter: "Вертолёты"
 early_helicopter_desc: "Раннее проектирование вертолётов. Это позволит нам исследовать транспортные и штурмовые вертолёты"
 attack_helicopter_equipment: "Ударный вертолёт"
 attack_helicopter_desc: "Ударные вертолёты — вооружённые вертолёты, предназначенные для поддержки наземных войск. Они отлично подходят для борьбы с бронетехникой и подразделениями, не имеющими воздушного прикрытия, и способны быстро расправиться с противником, не имеющим соответствующих средств противодействия. Однако ударные вертолёты очень уязвимы для истребителей и средств ПВО."
 carrier_0: "Авианосец 1965 года"
 carrier_0_desc: "Со времён окончания Второй мировой войны авиация господствует в военно-морской доктрине, а эти символы мощи зачастую являются самым ценным достоянием любой морской державы. Присутствие авианосца может решить исход сражения. Несмотря на огромное значение и влияние, авианосцы довольно плохо защищены сами по себе, поэтому их необходимо постоянно сопровождать."
