 artillery_4: "АРТ 2025 года"
 artillery_4_desc: "Благодаря мощным возможностям ведения огня с закрытых позиций артиллерия наносит непрерывные точные удары там, где это необходимо на поле боя, и далеко за пределами прямой видимости. Её может перезаряжать непосредственно расчёт. Поскольку для перемещения ей нужны тягачи, менять позицию между ударами бывает непросто, что делает её уязвимой для контрбатарейного огня противника. Лёгкие системы меньшего калибра можно перемещать вручную; они подходят для воздушно-десантных операций, поскольку помещаются в транспортные самолёты."
 SP_arty_0: "САУ 1965 года"
 SP_arty_0_desc: "Благодаря мощному огню с закрытых позиций самоходная артиллерия наносит непрерывные точные удары там, где это нужно на поле боя, причём далеко за пределами прямой видимости. Расчёт перезаряжает орудия сам, а собственный ход позволяет уходить из-под контрбатарейного огня противника."
 SP_arty_desc: "Самоходная артиллерия — артиллерия, оснащённая собственной силовой установкой для выдвижения к цели. Это высокомобильные машины, как правило на гусеничном ходу, несущие крупную гаубицу, полевую пушку, миномёт либо ту или иную ракетную или реактивную пусковую установку."
 SP_R_arty_0: "РСЗО 1965 года"
 SP_R_arty_0_desc: "Самоходные реактивные системы залпового огня способны быстро выпускать залпы реактивных снарядов, накрывающие целые большие площади. Их часто применяют против районов сосредоточения противника. Из-за массовых разрушений, которые они вызывают, их минимальная дальность стрельбы больше, чем у обычной артиллерии. Кроме того, они менее точны и потому не подходят для точечных ударов. Для перезарядки им нужны специальные транспортно-заряжающие машины."
