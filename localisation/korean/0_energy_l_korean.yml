l_korean:
 decision_category_energy: "에너지 결정"
 decision_category_energy_desc: "\n£MAIN_desctext_energy \n\n\n\n§Y[ROOT.GetFlag] 모든 국가들§!은 국가 중추의 산업 기능과 서비스의 원활한 진행을 위해 일정 수준의 에너지를 충족하여 유지해야 합니다. 우리가 §R실패§!한다면! 지속적으로 증가하는 산업 전반의 §Y에너지 요구§!를 유지하기 위해 참혹한 §R결과§!와 더불어 §R전면적인 경제 마비§!를 맞이할지도 모릅니다!"
 HEADER_TEXT_TITLE: "§Y에너지§!"
 energy_dynamic_modifier: "국가 전력망"
 energy_dynamic_modifier_TT: "이 시스템은 화력 발전소의 연료 소비량과 비전기 에너지원의 직접 연료 소비량의 합계는 물론, 발전량이 전력 소비량을 충족시키지 못할 경우 발생하는 손실까지 표시합니다. 또한 에너지 부하 분담을 통해 다른 국가와 공유되거나 제공되는 에너지도 표시합니다."
 no_fuel_penalties_modifier: "연료 부족 불이익"
 no_fuel_penalties_modifier_TT: "이 정신은 국가가 보유한 에너지를 거의 모두 사용하여, 민간에서 에너지를 소비할 수 없는 상황에 놓일 경우 발생하는 불이익을 나타냅니다."
 hydroelectric_infrastructure_in_state: "수력 기반시설"
 hydroelectric_infrastructure_in_state_TT: "수력 발전 기반시설은 수력발전 댐, 저수지, 그리고 이외 수력 에너지와 관련된 모든 기반시설을 일컫습니다. 국가 변동치에서는 생산된 총 에너지와 더불어 그 에너지를 저장할 수 있는 양 또한 표시되고 있습니다. 이는 에너지 생산 총합에 영향을 주며 산업 및 민간의 에너지 공급에 도움을 줄 것입니다."
 geothermal_infrastructure_in_state: "지열 기반시설"
 geothermal_infrastructure_in_state_TT: "지열 발전 기반시설은 지열 발전소와 더불어 이와 유사한 모든 기반시설을 일컫습니다. 이는 에너지 생산 총합에 영향을 주며 산업 및 민간의 에너지 공급에 도움을 줄 것입니다."
 renewable_capacity_factor_dyn_mod: "§Y[?THIS.modifier@state_renewable_capacity_factor_modifier]§!"
 renewable_capacity_factor_dyn_mod_TT: "§Y[THIS.GetName]§!은(는) 안정적인 강풍이 불거나 연간 일조량이 평균보다 높아 재생 에너지 생산에 유리한 조건을 갖춘 §Y재생 에너지 핫스팟§!입니다.\n\n재생 에너지 계수가 높을수록 이 지역의 재생 에너지 단지는 이 주의 소유자에게 매주 더 많은 에너지를 생산해 줍니다."
 heavy_power_restrictions_spirit: "강력한 에너지 규제"
 some_power_restrictions_spirit: "온건한 에너지 규제"
 some_additional_consumption_spirit: "온건한 에너지 규제 보조금"
 heavy_additional_consumption_spirit: "강력한 에너지 규제 보조금"
 build_battery_park_effect_TT: "[ROOT.GetNameWithFlag]의 §Y배터리 저장소§!의 개수가 [?temp_change|0+] 만큼 변동합니다 (현재: [?number_of_battery_parks|Y0])"
 has_nuclear_reactors_tt: "[THIS.GetNameWithFlag] 측은 최소 1개의 §Y$nuclear_reactor$§!를 보유함 (현재: [?nuclear_reactors|Y0])\n"
 has_enrichment_facilities_tt: "[THIS.GetNameWithFlag] 측은 최소 1개의 §Y$enrichment_facility$§!을 보유함\n"
 has_reactor_material_stockpile_tt: "[THIS.GetNameWithFlag] 측은 최소 5,000 KG의 §Y원자로급 핵 물질§!를 보유함 (현재: [?THIS.var_reactor_material_stockpile|Y0])\n"
 change_reactor_grade_material_effect_tt: "[THIS.GetNameWithFlag]의 §Y원자로급 물질§! 비축량을 [?change_resource|0+] 만큼 변동합니다. (현재: [?THIS.var_reactor_material_stockpile|Y0])\n"
 recently_bought_fuel_tt: "최근 시장에서 연료를 구입함. (남은 일수: [?recently_bought_fuel:days_left|0Y])"
 early_renewables: "기초 태양광 패널"
 early_renewables_desc: "결정질 실리콘 패널은 연료도 가동 부품도 없이 햇빛을 전기로 바꿉니다. 가격이 비싸고 받아들인 빛의 10분의 1을 조금 넘는 정도만 변환하지만, 처음으로 지붕과 외딴 지역에 태양광 발전을 가져다줍니다."
 renewables: "개선된 풍력 발전 터빈"
 renewables_desc: "더 큰 로터와 가변 속도 발전기, 더 나은 공기역학 덕분에 터빈 한 기가 메가와트급 출력을 냅니다. 풍력 발전 단지는 시범 사업 단계를 넘어 전력망에 공급하는 상업 발전으로 자리 잡습니다."
 improved_renewables: "고효율 광전지"
 improved_renewables_desc: "더 순도 높은 실리콘과 개선된 셀 설계로 패널 효율이 20%에 근접하고, 더 큰 공장들이 모든 모듈의 비용을 낮춥니다. 지붕형 시스템과 나란히 발전 사업용 대규모 태양광 단지가 등장하기 시작합니다."
 advanced_renewables: "풍력 발전 복합 블레이드"
 advanced_renewables_desc: "유리 섬유와 탄소 섬유 블레이드는 이전 설계보다 가볍고 단단하여, 로터가 타워 쪽으로 휘지 않고도 더 길어질 수 있습니다. 더 긴 블레이드는 더 많은 공기를 쓸어내며, 약한 바람에서도 터빈이 계속 돌게 합니다."
 modern_renewables: "박막 태양광 기술"
 modern_renewables_desc: "박막 태양전지는 빛을 흡수하는 물질을 유리나 유연한 시트 위에 불과 몇 마이크로미터 두께로 입힙니다. 실리콘 웨이퍼에 비해 원자재가 훨씬 적게 들고 넓은 면적을 빠르게 코팅할 수 있어, 태양광 단지의 비용을 크게 줄여 줍니다."
 improved_modern_renewables: "역외 풍력 발전 지대"
 improved_modern_renewables_desc: "바다 위에 세운 터빈은 육지의 어떤 부지보다 더 강하고 안정적인 바람을 받습니다. 전용으로 건조된 설치선과 고정식 기초 덕분에 개발자들은 해안에서 멀리 떨어진 곳에 수백 기의 터빈으로 이루어진 발전 단지를 건설할 수 있습니다."
 advanced_modern_renewables: "양면 태양광 패널"
 advanced_modern_renewables_desc: "양면 패널은 양쪽 면에서 빛을 모아, 직사광선뿐 아니라 지면에서 반사된 햇빛까지 포착합니다. 하늘을 가로지르는 태양을 따라 움직이는 추적 장치에 장착하면, 더 많은 토지를 쓰지 않고도 태양광 발전 단지의 출력을 높일 수 있습니다."
 fuel_efficiency: "향상된 연소 공학"
 fuel_efficiency_desc: "단계식 버너와 공기-연료 혼합의 더 정밀한 제어로 보일러가 연료를 더 완전하게 연소시킵니다. 우리 발전소는 석탄 1톤과 가스 1세제곱미터당 더 많은 전기를 얻습니다."
 fuel_efficiency2: "석탄가스화 복합화력발전 "
 fuel_efficiency2_desc: "IGCC 발전소는 석탄을 합성가스로 전환하고 불순물을 제거한 뒤 가스 터빈에서 연소시키며, 배기열은 증기 사이클에서 회수합니다. 이 2단계 설계는 같은 연료에서 훨씬 더 많은 전력을 뽑아냅니다."
 fuel_efficiency3: "고효율 저공해 기술"
 fuel_efficiency3_desc: "HELE 발전소는 증기를 초임계 및 초초임계 온도와 압력에서 가동합니다. 증기가 뜨거울수록 연료 1톤당 더 많은 전력을 얻고 1메가와트시당 이산화탄소 배출은 줄어듭니다."
 fuel_efficiency4: "탄소 포집 및 저장 기술 (CCS) 통합"
 fuel_efficiency4_desc: "포집 설비는 발전소 배기가스에서 이산화탄소를 걸러내어 파이프로 심층 암반층에 저장합니다. 사후에 덧붙이는 대신 처음부터 포집을 발전소에 설계해 넣으면 소모되는 에너지를 최소한으로 줄일 수 있습니다."
 fuel_efficiency5: "AI 기반 최적화 & 모니터링"
 fuel_efficiency5_desc: "머신러닝 모델이 수천 개의 발전소 센서를 읽어 연료 유량, 공기 공급, 터빈 부하를 매초 조정합니다. 부품이 고장 나기 훨씬 전에 마모를 감지하므로, 우리 발전소는 더 오랫동안 최고 효율에 가깝게 가동됩니다."
 fuel_efficiency6: "초저공해 화석연료 단지"
 fuel_efficiency6_desc: "산소연료 연소는 순수한 산소 속에서 연료를 연소시켜 수증기와 거의 순수한 이산화탄소를 배출하는데, 이는 포집이 용이합니다. 현재 우리의 화석 연료 발전소는 대기 중으로 거의 아무것도 배출하지 않습니다."
 energy_efficiency: "열역학 기초"
 energy_efficiency_desc: "열역학 원리의 몇 가지 기본 원칙을 적용하면 공장과 사무실 건물의 에너지 손실을 즉시 줄일 수 있습니다."
 energy_efficiency2: "단열재 적용"
 energy_efficiency2_desc: "국가 에너지 비용의 상당 부분은 건물의 난방 및 냉방에서 발생합니다. 단열재를 사용하면 이러한 비용을 절감하고 절약된 에너지를 다른 곳에 활용할 수 있습니다."
 energy_efficiency3: "고급 제어 통합"
 energy_efficiency3_desc: "몇 가지 기초적인 알고리즘을 온도 조절기와 제어 시스템에 통합하면 효율이 더욱 향상되어 에너지를 추가로 절약할 수 있습니다."
 energy_efficiency4: "고밀도 단열재"
 energy_efficiency4_desc: "보다 현대적인 자재를 사용하면 단열 밀도를 높여 훨씬 더 높은 에너지 절감 효과를 얻을 수 있습니다."
 energy_efficiency5: "열전 발전기 (TEG) 개선 발전소"
 energy_efficiency5_desc: "현대의 많은 발전소는 여전히 열을 이용해 물을 증기로 바꾸는 방식에 의존하고 있습니다. 이 방식은 수년에 걸쳐 효율성이 향상되었지만 여전히 많은 양의 폐열을 발생시킵니다. 열전 발전기는 폐열에서 여분의 전압을 추출할 수 있습니다. 이는 연료에 대한 공장의 총 비용을 절감하는 것으로 반영됩니다."
 energy_efficiency6: "나노섬유 절연체"
 energy_efficiency6_desc: "최근 나노섬유 기술의 발전으로 현재까지 가장 발전되고 밀도가 높은 단열재를 사용할 수 있게 되었습니다. 이는 에너지 효율을 크게 향상시킬 것입니다."
 energy_efficiency7: "대규모 열전 발전기 (TEG) 결합"
 energy_efficiency7_desc: "공장과 사무실을 단순히 잘 단열하는 것을 넘어  열전 발전기를 사용하면 가장 최신의 단열재로도 막지 못해 낭비될 뻔한 에너지를 다시 회수할 수 있습니다."
 energy_efficiency8: "마이크로 발전기"
 energy_efficiency8_desc: "소규모 발전기 터빈에 배기 장치를 설치하고 창문을 통해 열전 배선을 연결하면 에너지 회수 수준이 한 단계 높아집니다."
 TOTAL_GENERATION_ENERGY: "§H전체 생산량§!: [?energy_sum|G2] GW (기가와트)"
 ENERGY_GENERATION_TOTAL_TT: "아래의 목록은 생산된 모든 에너지의 출처 및 생산원을 표시합니다. §Y화석 연료 발전소§!는 소비량보다 생산량이 많을 경우 가동되지 않는 상태가 될 것입니다. 유휴 중인 §Y화석 연료 발전소§!는 §Y연료§!를 소비하지 않습니다.\n----------\n§Y화석 연료 발전소§! 발전량: [?fossil_pp_energy_generation|G2] GW (기가와트)\n§Y유휴 중인 화석 연료 발전소§! 발전량: [?free_fossil_powerplants_power|Y2] GW (기가와트)\n§Y수력 발전§! 발전량: [?hydroelectric_energy_generation|G2] GW (기가와트)\n§Y지열 발전§! 발전량: [?geothermal_energy_generation|G2] GW (기가와트)\n§Y원자력 발전 §! 발전량: [?nuclear_energy_generation|G2] GW (기가와트)\n§Y태양 및 풍력 발전§! 발전량: [?renewable_energy_display_var|G2] GW (기가와트)\n§Y기타 발전§! 발전량: [?other_energy_generation|G2] GW (기가와트)\n§Y에너지 비축량에서 회수§!: [?energy_withdrawal_from_storage|G2] GW (기가와트)\n\n----------\n§Y기대되는 태양 및 풍력 발전§! 발전량: 최소 [?minimum_renewable_energy_var|+2] GW (기가와트)에서 최대 [?maximum_renewable_energy_var|+2] GW (기가와트) 까지\n§Y에너지 부하 공유§!에 의한 총 발전량: [?energy_load_sharing_gain_var|G2]"
 TOTAL_CONSUMPTION_ENERGY: "§HTotal Consumption§!: [?energy_consumption|R2] GW"
 TOTAL_CONSUMPTION_ENERGY_TT: "아래의 목록은 소비되는 에너지의 출처 및 소비원을 표시합니다.\n----------\n§Y민간 에너지§! 소비량: [?population_energy_use_display_var|R2] GW (기가와트)\n계절별 인구 수요: [?energy_seasonal_population_demand_factor|%0R]\n§Y모든 건물에 사용되는 에너지§! 소비량: [?energy_use_buildings_total_display_var|R2] GW (기가와트)\n§Y기타 에너지§! 소비량: [?other_energy_use_display_var|R2] GW (기가와트)\n----------\n§Y부문에 따른 건물에 사용되는 에너지의 분류:§!\n§Y민간 공장 에너지§! 소비량: [?energy_use_civs_total_display_var|R2] GW (기가와트)\n§Y사무지구 에너지§! 소비량: [?energy_use_offices_total_display_var|R2] GW (기가와트)\n§Y군수 공장 에너지§! 소비량: [?energy_use_mils_total_display_var|R2] GW (기가와트)\n§Y해군 조선소 에너지§! 소비량: [?energy_use_dockyards_total_display_var|R2] GW (기가와트)\n§Y상업화된 농업지구 에너지§! 소비량: [?energy_use_agriculture_district_total_display_var|R2] GW (기가와트)\n§Y마이크로칩 공장 에너지§! 소비량: [?energy_use_microchip_plant_total_display_var|R2] GW (기가와트)\n§Y첨단 복합재 공장 에너지§! 소비량: [?energy_use_composite_plant_total_display_var|R2] GW (기가와트)\n§Y합성 정제소 에너지§! 소비량: [?energy_use_synthetic_refinery_total_display_var|R2] GW (기가와트)\n\n"
 MISSING_FULFILLMENT_VALUE: "§H미충족된 에너지§!: [?unfulfilled_energy_demand_var|%+]"
 MISSING_FULFILLMENT_VALUE_TT: "This value is the percentage of our required §YEnergy Demand§! that is not currently fulfilled.\n\n§YImpact of Consumption Unfulfillment§!\n£construction_speed_texticon Construction Speed: [?unfulfilled_energy_demand_dynmod_var|+%]\n£research_speed_texticon Research Speed: [?unfulfilled_energy_demand_dynmod_var|+%] \n£tax_gain_multiplier_modifier_texticon §YTax Revenue§! Multiplier: [?unfulfilled_energy_demand_dynmod_var_3|+%]\n£factory_output_texticon Factory Output: [?unfulfilled_energy_demand_dynmod_var|+%]\n£dockyard_output_texticon Dockyard Output: [?unfulfilled_energy_demand_dynmod_var|+%] \n£stability_texticon Stability: [?unfulfilled_energy_demand_dynmod_var_2|+%]"
 TOTAL_HOURLY_FUEL_CONSUMPTION_VALUES: "매일 §Y화석 연료 발전소§! §Y연료§! 소비: [?fossil_pp_fuel_display|0R]"
 TOTAL_HOURLY_FUEL_CONSUMPTION_VALUES_TT: "이 수치는 현재 활성화된 모든 §Y화석 연료 발전소§!에서 매일 소비되는 총 연료를 나타냅니다. §Y화석 연료 발전소§!는 전체 생산 용량이 전체 소비량보다 클 경우 가동 중이지 않은 유휴 상태가 될 것입니다.\n\n§Y변동치§!:\n법안, 국민정신, 그리고 기술 항목이 §Y화석 연료 발전소에 소비되는 연료§! 사용량에 미치는 영향: [?modifier@fossil_pp_fuel_consumption_modifier|-%]"
 TOTAL_HOURLY_POPULATION_FUEL_CONSUMPTION_VALUES: "전 §Y인구§!의 매일 §Y연료§! 소비량: [?non_electric_fuel_display|0R]"
 TOTAL_HOURLY_POPULATION_FUEL_CONSUMPTION_VALUES_TT: "이 수치는 전체 §Y인구§!가 매일 소비하는 연료의 총합을 나타냅니다.\n\n§Y변동치§!:\n법안, 이념, 그리고 기술 항목이 §Y비전기적 연료§! 사용량에 미치는 영향: [?modifier@non_electric_fuel_consumption_modifier|-%]\n계절별 인구 수요: [?energy_seasonal_population_demand_factor|%0R]\n\n12월부터 2월까지, 그리고 6월부터 8월까지는 인구의 전력 및 비전기 연료 수요가 20% 증가합니다. 계절별 수요는 다른 변동치가 적용된 이후에 반영되며 주간 에너지 계산 시 갱신됩니다."
 TOTAL_STORED_ENERGY: "비축된 에너지: 최대 비축량 [?max_stored_energy|3Y] GWh 중 [?stored_energy|3Y] GWh (기가와트시)"
 TOTAL_STORED_ENERGY_TT: "이는 우리가 보유할 수 있는 최대 비축량을 기준으로 현재 초과 비축된 에너지의 양을 보여줍니다. 우리는 추가적인 §Y배터리 저장소§!를 건설함으로써 §Y최대 비축량§!을 늘릴 수 있습니다."
 OPEN_ENERGY_BUTTON: "§Y에너지 창§! 인터페이스 열기"
 OPEN_ENERGY_BUTTON_TT: "이 아이콘을 클릭하면 전력 소비량, 전력 생산량 그리고 에너지 요구에 대한 충원량을 확인할 수 있는 §Y에너지 창§!을 열 수 있습니다."
 heavy_power_restrictions_button_tt: "§Y강력한 에너지 제한§!\n현재 에너지 생산량이 에너지 소비량을 앞지르고 있습니다. 우리는 추가적인 발전소를 건설하거나, 재생 에너지를 생산하는 등 이 사태를 진정시킬 수 있을 때까지 일시적인 수단으로써 민간의 전기 소비량을 급격히 제한할 수 있습니다. 사람들에게 강력한 에너지 제한을 시행함으로써 심각한 경제 성장 저하, 에너지 소비량 감소, 그리고 정치적 행동이 급격히 축소될 수 있습니다."
 heavy_power_restrictions_button_delayed_tt: "§Y효과:§!\n[!heavy_power_restrictions_button_click]"
 some_power_restrictions_button_tt: "§Y일부 에너지 제한§!\n현재 에너지 소비량이 에너지 생산량을 앞지르고 있습니다. 우리는 추가적인 발전소를 건설하거나, 재생 에너지를 생산하는 등 이 사태를 진정시킬 수 있을 때까지 일시적인 수단으로써 민간의 전기 소비량을 급격히 제한할 수 있습니다. 사람들에게 강력한 에너지 제한을 시행함으로써 심각한 경제 성장 저하, 에너지 소비량 감소, 그리고 정치적 행동이 급격히 축소될 수 있습니다."
 some_power_restrictions_button_delayed_tt: "§Y효과:§!\n[!some_power_restrictions_button_click]"
 no_power_restrictions_button_tt: "§Y에너지 제한 없음§!\n현재의 상황은 국가 경제 상황과 우리의 정치적 안전에 최적인 상태입니다. 우리는 사람들에게 소비를 감축하거나 반대로 독려할 필요가 없습니다"
 no_power_restrictions_button_delayed_tt: "§Y효과:§!\n[!no_power_rules_button_click]\n소비 정책 변동치 없음."
 some_additional_consumption_button_tt: "§Y일부 추가적인 소비 장려§!\n현재 에너지가 과도하게 생산되고 있습니다. 우리는 잉여 생산량으로부터 이득을 보기 위해 추가적인 소비를 장려해야만 합니다. 추가적인 소비를 장려함으로써 약간의 건설 속도 및 정치력 보너스를 받음과 동시에 민간의 소비량을 일부 증가시킬 수 있습니다."
 some_additional_consumption_button_delayed_tt: "§Y효과:§!\n[!some_additional_consumption_button_click]"
 heavy_additional_consumption_button_tt: "§Y거대한 추가 소비 장려§!\n현재 에너지가 과도하게 생산되고 있습니다. 우리는 잉여 생산량으로부터 이득을 보기 위해 추가적인 소비를 장려해야만 합니다. 추가적인 소비를 장려함으로써 거대한 건설 속도 및 정치력 보너스를 받음과 동시에 민간의 소비량을 급격히 증가시킬 수 있습니다."
 heavy_additional_consumption_button_delayed_tt: "§Y효과:§!\n[!heavy_additional_consumption_button_click]"
 build_battery_park_button_tt: "§Y배터리 저장소 건설§!\n§Y배터리 저장소§!는 각각 §Y100GWh§!의 초과 에너지 생산량을 저장할 수 있는 매우 거대하고 값비싼 구조물입니다. 특히 재생에너지의 생산량이 불안정하여 소비량에 비해 생산량이 부족할 때를 대비해 에너지를 저장하는 것은 유익할 수 있습니다."
 build_battery_park_button_delayed_tt: "§Y요구 조건:§!\n[!build_battery_park_button_click_enabled]\n§Y효과:§!\n[!build_battery_park_button_click]\n우리는 £key_shift + £click_left §YShift 좌클릭§!으로 §Y배터리 저장소 3개§! 묶음을 한 번에 대기열에 추가할 수 있습니다.\n§Y요구 조건:§!\n[!build_battery_park_button_shift_click_enabled]\n§Y효과:§!\n[!build_battery_park_button_shift_click]"
 buy_fuel_for_money_button_tt: "§Y시장에서 연료 구입§!\n일부 국제 시장에서 연료를 판매하고 있습니다. 연료를 구입함으로써 우리 화석 연료 발전소가 계속 가동될 수 있을 것이며 유사시에 우리 군이 이를 활용할 수도 있을 것입니다."
 buy_fuel_for_money_button_delayed_tt: "§Y요구 조건:§!\n[!buy_fuel_for_money_button_click_enabled]\n§Y효과:§!\n[!buy_fuel_for_money_button_click]\n£key_shift + £click_left §YShift 좌클릭§!: 연료가 부족할 때마다 자동으로 §Y연료§!를 구입하도록 설정"
 NET_ENERGY_BALANCE: "§H순 에너지 균형§!: [energy_total_net_energy_balance]"
 NET_ENERGY_BALANCE_TT: "§H전체 에너지 균형§! 값은 §H전체 에너지 발전량§!을 §H전체 에너지 소비량§!으로 나눈 상대 값으로 §H순 에너지 균형§!을 퍼센트로 표시합니다."
