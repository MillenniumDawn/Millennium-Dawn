 EH_scientist_Jennifer_Doudna_tt: "§YДженнифер Даудна§!"
 EH_scientist_Jennifer_Doudna_tt_delayed: "Дженнифер Дудна — известный биохимик, прославившаяся своими новаторскими исследованиями в области технологии редактирования генов CRISPR, проводимыми совместно с Эммануэль Шарпантье. Благодаря CRISPR у нас может появиться возможность лучше понять генетическую структуру химер и найти способ использовать их слабые места.\n--------------\n§YПоследствия:§!\n[!EH_hire_Jennifer_Doudna_button_click]\n\n§YПредпосылки:§!\n[!EH_scientist_Jennifer_Doudna_click_enabled]"
 EH_scientist_Fabiola_Gianotti_tt: "§YФабиола Джанотти§!"
 EH_scientist_Fabiola_Gianotti_tt_delayed: "Фабиола Джанотти — итальянский физик-экспериментатор в области элементарных частиц и нынешний генеральный директор ЦЕРН. Ее экспертные знания в области физики элементарных частиц и опыт работы в крупномасштабных научных коллаборациях будут неоценимы в наших усилиях по пониманию Порталов и их связи с другими измерениями.\n--------------\n§YEffects:§!\n[!EH_hire_Fabiola_Gianotti_button_click]\n\n§YPrerequisites:§!\n[!EH_scientist_Fabiola_Gianotti_click_enabled]"
 EH_scientist_Lene_Hau_tt: "§YLene Hau§!"
 EH_scientist_Lene_Hau_tt_delayed: "Лене Хау — датский физик, известная своими новаторскими работами по замедлению и остановке света. Её экспертные знания в области квантовой оптики и физики конденсированных сред могут дать представление о природе Порталов и их энергетическом излучении.\n--------------\n§YEffects:§!\n[!EH_hire_Lene_Hau_button_click]\n\n§YPrerequisites:§!\n[!EH_scientist_Lene_Hau_click_enabled]"
 EH_scientist_Emmanuelle_Charpentier_tt: "§YЭммануэль Шарпантье§!"
 EH_scientist_Emmanuelle_Charpentier_tt_delayed: "Эммануэль Шарпантье — французский микробиолог и биохимик. Вместе с Дженнифер Даудна она разработала технологию редактирования генов CRISPR-Cas9. Её знания сыграют решающую роль в наших усилиях по изучению и, возможно, манипулированию биологией Химеры.\n--------------\n§YЭффекты:§!\n[!EH_hire_Emmanuelle_Charpentier_button_click]\n\n§YПредпосылки:§!\n[!EH_scientist_Emmanuelle_Charpentier_click_enabled]"
 EH_scientist_Andrzej_Trautman_tt: "§YАнджей Траутман§!"
 EH_scientist_Andrzej_Trautman_tt_delayed: "Анджей Траутман — польско-американский физик-теоретик, известный своими работами в области общей теории относительности и физики черных дыр. Его опыт может помочь нам понять фундаментальные физические принципы, лежащие в основе Порталов и их влияния на наш мир.\n--------------\n§YEffects:§!\n[!EH_hire_Andrzej_Trautman_button_click]\n\n§YPrerequisites:§!\n[!EH_scientist_Andrzej_Trautman_click_enabled]"
