l_korean:
 SAF_al_jamaah_party_founded_TT: "£SAF_moderate_islamist (AJ) - 알 자마아가 정식으로 정당 등록을 하여, [SAF.GetName]의 무슬림을 대변하는 주요 정치 전선으로서 £SAF_moderate_islamist 아프리카 무슬림당을 능가합니다!"
 SAF_democratic_alliance_party_founded_TT: "£SAF_liberal (DA) - 민주동맹이 정식으로 정당 등록을 하며, £SAF_liberal (DP) - 민주당과 (FA) - 연방동맹이 공식적으로 힘을 합칩니다!"
 SAF_economic_freedom_fighters_party_founded_TT: "£SAF_neutral_communism (EFF) - 경제자유투사가 정식으로 정당 등록을 하여, ANC 청년연맹 내에 분열을 일으킵니다!"
 SAF_freedom_front_plus_party_founded_TT: "£SAF_right_wing_populism (VF+) - 자유전선 플러스가 정식으로 정당 등록을 하며, (KP) - 보수당과 (AE) - 아프리카너 통합 운동을 £SAF_right_wing_populism (VF) - 자유전선의 세력으로 합칩니다!"
