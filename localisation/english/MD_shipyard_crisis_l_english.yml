l_english:
 SHIPYARD_CRISIS_TITLE: "Naval Shipyard Backlog"
 SHIPYARD_CRISIS_LEVEL_LINE: "[shipyard_panel_backlog_level]"
 SHIPYARD_BACKLOG_LEVEL_LINE: "Backlog level §Y[?shipyard_crisis_level|0]%§!"
 SHIPYARD_CRISIS_BAR_TT: "[shipyard_panel_overview]\n\n[shipyard_panel_hull_costs]"
 SHIPYARD_STANDARD_HULL_COSTS_TT: "§YBuild cost added per full 10 crisis points§!\nPatrol boats and corvettes §R+1%§!\nFrigates §R+2%§!\nDestroyers §R+3%§!\nCruisers, battlecruisers, battleships and attack submarines §R+4%§!\nAircraft carriers, helicopter operators and missile submarines §R+5%§!\n\n$SHIPYARD_FACILITY_REQUIREMENTS_TT$"
 SHIPYARD_CRISIS_BACKLOG_TT: "The crisis level rises every month. Shipyard programs lower it and slow its growth.\n\nDockyard output [?shipyard_mod_output|+%]\nShip repair speed [?shipyard_mod_repair|+%]\nRefit speed [?shipyard_mod_refit|+%]\nRefit cost §R+[?shipyard_mod_refit_cost|%]§!"
 SHIPYARD_FACILITY_REQUIREMENTS_TT: "§YShipyard facilities§!\nWithout a working Large Slipway in an owned state, cruisers and large amphibious ships (helicopter operators) cost §R+200%§! to build. Battlecruisers, battleships and aircraft carriers cost §R+300%§!.\nWithout a working Submarine Hall in an owned state, attack submarines cost §R+200%§! and missile submarines cost §R+300%§!."
 SHIPYARD_CRISIS_OUTPUT_LINE: "$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$ [?shipyard_mod_output|+%]"
 SHIPYARD_CRISIS_REPAIR_LINE: "$MODIFIER_REPAIR_SPEED_FACTOR$: §R[?shipyard_mod_repair|+%]§!"
 SHIPYARD_CRISIS_REFIT_LINE: "Refit speed: §R[?shipyard_mod_refit|+%]§!"
 SHIPYARD_CRISIS_DRIFT_LINE: "Monthly change [?shipyard_drift|2]"
 SHIPYARD_CRISIS_DRYDOCK_LINE: "Drydock stages: §Y[?shipyard_drydock_stage|0]/5§!"
 SHIPYARD_CRISIS_WORKFORCE_LINE: "Workforce stages: §Y[?shipyard_workforce_stage|0]/3§!"
 shipyard_crisis_modifier: "Naval Shipyard Backlog"
 shipyard_crisis_modifier_desc: "Congested drydocks and a shortage of skilled labor slow repairs, refits and new construction. The effect grows with the crisis level."
 shipyard_crisis_equipment: "Naval Shipyard Backlog"
 shipyard_drydock_cost_pp_75: "£treasury [?shipyard_cost_drydock|1]   £pol_power §Y75§!"
 shipyard_drydock_cost_pp_75_blocked: "£treasury §R[?shipyard_cost_drydock|1]§!   £pol_power §R75§!"
 shipyard_drydock_cost_pp_75_tooltip: "This purchase will cost us £treasury §Y[?shipyard_cost_drydock|1]§! billion and £pol_power §Y75§! Political Power."
 shipyard_drydock_cost_pp_100: "£treasury [?shipyard_cost_drydock|1]   £pol_power §Y100§!"
 shipyard_drydock_cost_pp_100_blocked: "£treasury §R[?shipyard_cost_drydock|1]§!   £pol_power §R100§!"
 shipyard_drydock_cost_pp_100_tooltip: "This purchase will cost us £treasury §Y[?shipyard_cost_drydock|1]§! billion and £pol_power §Y100§! Political Power."
 shipyard_drydock_cost_pp_150: "£treasury [?shipyard_cost_drydock|1]   £pol_power §Y150§!"
 shipyard_drydock_cost_pp_150_blocked: "£treasury §R[?shipyard_cost_drydock|1]§!   £pol_power §R150§!"
 shipyard_drydock_cost_pp_150_tooltip: "This purchase will cost us £treasury §Y[?shipyard_cost_drydock|1]§! billion and £pol_power §Y150§! Political Power."
 shipyard_drydock_effect_tt: "When the work is complete, the crisis level falls by §G15§! and its monthly drift slows by §G10%§!."
 shipyard_workforce_effect_tt: "When the program is complete, the crisis level falls by §G6§! and its monthly drift slows by §G15%§!."
 shipyard_drydock_stages_tt: "Drydock programs completed: §Y[?shipyard_drydock_stage|0]/5§!"
 shipyard_workforce_stages_tt: "Training programs completed: §Y[?shipyard_workforce_stage|0]/3§!"
 shipyard_allied_dockyards_tt: "Japan, South Korea, the United Kingdom, France, Germany, Italy, Spain or the Netherlands must have over §Y10§! dockyards, be at peace with us, and either share our faction or belong to the Major Non-NATO Ally technology-sharing group."
 SHIPYARD_READOUT_OK: "£dockyard_output_texticon §Y[?shipyard_readout_in_use|0]§!/[?shipyard_dockyards|0] · effective §Y[?shipyard_effective_dockyards|0]§!"
 SHIPYARD_READOUT_OVER: "£dockyard_output_texticon §R[?shipyard_readout_in_use|0]§!/[?shipyard_dockyards|0] · effective §R[?shipyard_effective_dockyards|0]§!"
 SHIPYARD_READOUT_TT: "This display compares dockyards in use with our total dockyards and the number we can staff.\n\n[shipyard_readout_notes]"
 SHIPYARD_READOUT_CAPACITY_TT: "Effective dockyards measure our staffed capacity at the current backlog level."
 SHIPYARD_READOUT_OVERLOAD_TT: "If more than §Y[?shipyard_effective_dockyards|0]§! are still in use after the first monthly warning, each overloaded month adds §R1§! crisis point, costs §R1%§! Stability and penalizes states with dockyards. Free enough dockyards to bring usage back within capacity."
 md_shipyard.1.t: "The Yards Are Overloaded"
 md_shipyard.1.d: "We have put [?shipyard_dockyards_in_use|0] dockyards to work. Our shipbuilding base can staff [?shipyard_effective_dockyards|0]. Foremen are splitting the same crews between hulls and parts are arriving late.\n\nWe need to free enough dockyards to bring usage back within capacity. Each following month we stay overloaded will raise the crisis level, cost Stability and penalize our dockyard states."
 md_shipyard.1.a: "We will free up dockyards"
 md_shipyard.1.b: "The yards will cope"
 md_shipyard_overload_free_tt: "Reduce the dockyards assigned to production or repairs to §Y[?shipyard_effective_dockyards|0]§! or fewer. Each following month above capacity adds §R1§! crisis point, costs §R1%§! Stability and penalizes our dockyard states."
 md_shipyard_overload_push_tt: "Keep every dockyard assigned for now. Bring usage within capacity before the next monthly check to avoid another penalty."
 shipyard_overload_modifier: "Overloaded Shipyards"
 shipyard_overload_modifier_desc: "More hulls on the slipways than the yard can staff. The crews, the cranes and the suppliers are spread thin and the whole district pays for it."
 large_slipway: "Large Slipway"
 large_slipway_desc: "A working Large Slipway in an owned state avoids a §R+300%§! build-cost penalty for battlecruisers, battleships and aircraft carriers, and a §R+200%§! penalty for cruisers. Large amphibious ships (helicopter operators) face a §R+200%§! penalty without the facility, or §R+50%§! in Poland."
 submarine_hall: "Submarine Hall"
 submarine_hall_desc: "A working Submarine Hall in an owned state avoids a §R+200%§! build-cost penalty for attack submarines and a §R+300%§! penalty for missile submarines."
 shipyard_yard_class_equipment: "Missing Shipyard Facility"
 shipyard_recovery_category: "Naval Shipbuilding"
 shipyard_recovery_category_desc: "Invest in shipyards and train crews to expand naval construction capacity."
 SHIPYARD_RECOVERY_OVERVIEW_TT: "The backlog declines each month until it reaches zero. Drydock modernization and shipwright training speed up recovery. Dockyard output grows as the backlog falls.\n\nDockyard output [?shipyard_mod_output|+%]\nIndustry growth [?shipyard_growth_output|+%]\nShip repair speed [?shipyard_mod_repair|+%]\nRefit speed [?shipyard_mod_refit|+%]\nRefit cost §R+[?shipyard_mod_refit_cost|%]§!"
 shipyard_recovery_modernize: "Modernize Naval Drydocks"
 shipyard_recovery_modernize_desc: "Upgrade the cranes, machinery and drydocks that slow naval work."
 shipyard_recovery_train: "Train Shipwrights"
 shipyard_recovery_train_desc: "Fund apprenticeships for welders, fitters and other specialists needed to expand the yards."
 shipyard_recovery_work_remaining_tt: "The shipyard backlog is above §Y0§!."
 shipyard_recovery_drydock_effect_tt: "Completion increases the monthly recovery rate by §G10%§! of the base rate."
 shipyard_recovery_training_effect_tt: "Completion increases the monthly recovery rate by §G15%§! of the base rate."
