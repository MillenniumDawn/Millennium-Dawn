 SOV_scientific_councils_desc: "Debemos impulsar el acceso de los jóvenes rusos más brillantes a instituciones de primer nivel para que sirvan a la revolución. Sus innovaciones e inventos consolidarán nuestra ventaja científica y militar."
 RUS_establish_me: "Una Nueva Rusia"
 RUS_establish_me_desc: "Tras el colapso del gobierno ruso, es necesario construir un nuevo Estado ruso."
 RUS_hold_kaliningrad_conference: "Celebrar la Conferencia de Kaliningrado"
 RUS_hold_kaliningrad_conference_desc: "El Estado ruso debe ser una fuerza unificada, cohesionada y competente. Debemos organizar la Conferencia de Kaliningrado para garantizar que la Nueva Rusia sea un Estado estable y democrático."
 RUS_continue_reunification: "Continuar los esfuerzos de unificación"
 RUS_continue_reunification_desc: "Parece que algunas personas aún se aferran a los antiguos territorios del Estado ruso, y debemos intervenir para resolver eso lo antes posible mediante negociaciones."
 RUS_establish_rusfor: "Establecer RUSFOR"
 RUS_establish_rusfor_desc: "Rusia ya no existe, y eso es un problema en cierto modo. Debemos considerar la creación de un nuevo territorio para el Estado ruso."
 russia.119.t: "Canonización de la familia Romanov"
 russia.119.d: "La Iglesia ortodoxa rusa ha canonizado a la familia Románov esta mañana. El proceso no ha estado exento de polémica, generando tensiones en varios sectores, incluidas voces dentro de la propia iglesia. Muchos creen que la canonización no respeta adecuadamente la santidad del término, pero la iglesia ha seguido adelante."
 russia.119.a: "¡Recuérdales a los comunistas lo que han hecho!"
 russia.119.b: "Honrar a los Muertos..."
 russia.120.t: "Vuelo de Prueba Fallido del Su-37"
 russia.120.d: "Hoy se ha llevado a cabo un vuelo de prueba cerca de Shatura, pero la aeronave ha sufrido un fallo grave. El estabilizador horizontal de babor se desprendió durante una maniobra de alta aceleración G, lo que provocó su impacto y pérdida total. El fallo estructural fue causado por superar repetidamente la carga de diseño durante los seis años que duraron las pruebas."
 russia.120.a: "Desafortunado..."
 russia_news.10000.t: "Vladimir Putin Envuelto en un Escándalo"
 russia_news.10000.d: "Recientemente, los medios de comunicación rusos se han apresurado a cubrir el último escándalo de Vladímir Putin. Se le acusa de prometer a ciertos individuos monopolios más amplios sobre determinadas industrias, y esta afirmación está respaldada por una grabación secreta enviada a la prensa por un empresario descontento. Las noticias de este escándalo se han propagado rápidamente por Rusia y la región, empañando gravemente la reputación de Vladímir Putin. Sus opositores políticos se han apresurado a sacar provecho de esto, atacando a Putin y retratándolo como un hombre que venderá Rusia a las ambiciones corporativas. Algunos especulan con que es probable que pierda las elecciones como resultado de esto, poniendo un rápido fin a lo que parecía ser una larga y plena carrera."
 russia_news.10000.a: "El viento de la democracia sopla una vez más."
 russia.611.t: "Una nueva dirección política"
 russia.611.d: "El panorama político ha cambiado drásticamente. Ha surgido un nuevo liderazgo con una visión diferente sobre el futuro del país."
 russia.611.a: "Comienza un nuevo capítulo"
