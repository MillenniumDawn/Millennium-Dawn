 battleship_hull_5_desc: "Los buques de superficie son el componente principal de la flota y asumen todas las funciones marítimas de una armada tradicional."
 battleship_hull_6: "Casco de acorazado de 2075"
 battleship_hull_6_desc: "Los buques de superficie son el componente principal de la flota y asumen todas las funciones marítimas de una armada tradicional."
 aircraft_heli_engineering_4: "Hangares automatizados para helicópteros"
 aircraft_heli_engineering_4_desc: "Modernizar nuestros portaaviones actuales con formas más eficientes de despliegue y almacenamiento de helicópteros puede mejorar nuestra capacidad para disputar el control a los submarinos."
 helicopter_operator_hull_5: "Casco de portahelicópteros de 2060"
 helicopter_operator_hull_5_desc: "Un portahelicópteros es un portaaviones utilizado principalmente para operar helicópteros, pero a menudo se clasifica también como buque de asalto anfibio o portaaviones antisubmarino. Se emplea principalmente en misiones de aviación militar, incluidas la guerra antisubmarina, las operaciones anfibias y el apoyo aéreo cercano. Algunos buques de asalto anfibio disponen de diques diseñados para transportar embarcaciones de desembarco, cumpliendo la función de buques de desembarco dique. Otros están diseñados para operar con aeronaves de ala fija de despegue vertical y aterrizaje corto, proporcionando un apoyo aéreo cercano a las operaciones anfibias más potente que el de los helicópteros de ataque, asumiendo la función de portaaviones ligeros."
 helicopter_operator_hull_6: "Casco de portahelicópteros de 2075"
 helicopter_operator_hull_6_desc: "Un portahelicópteros es un portaaviones utilizado principalmente para operar helicópteros, pero a menudo se clasifica también como buque de asalto anfibio o portaaviones antisubmarino. Se emplea principalmente en misiones de aviación militar, incluidas la guerra antisubmarina, las operaciones anfibias y el apoyo aéreo cercano. Algunos buques de asalto anfibio disponen de diques diseñados para transportar embarcaciones de desembarco, cumpliendo la función de buques de desembarco dique. Otros están diseñados para operar con aeronaves de ala fija de despegue vertical y aterrizaje corto, proporcionando un apoyo aéreo cercano a las operaciones anfibias más potente que el de los helicópteros de ataque, asumiendo la función de portaaviones ligeros."
 aircraft_carrier_engineering_2: "Revisión del sistema de portaaviones"
 aircraft_carrier_engineering_2_desc: "Los avances en la tecnología naval conducen finalmente al rediseño completo de la forma en que operan y se diseñan los portaaviones."
 carrier_hull_6: "Casco de portaaviones de 2060"
 carrier_hull_6_desc: "Estas bases aéreas flotantes representan la cúspide del poder naval, capaces de adentrarse en los océanos del mundo para proyectar el poder de una nación en todo el globo. Símbolo del esfuerzo y los recursos de una nación fuerte, estos activos increíblemente valiosos deben protegerse a toda costa. Con un alcance inmenso, requieren un verdadero grupo de batalla de alta mar (blue water) para desplegar toda la gama de sus capacidades operativas en el mar. Cualquier país que disponga de un grupo de batalla de portaaviones plenamente operativo puede estar verdaderamente orgulloso de lo que representa su armada y del terrorífico poder que ostenta. Se utilizan típicamente para: proyección de poder a gran escala, guerra aérea, guerra de superficie y operaciones anfibias."
 carrier_hull_7: "Casco de portaaviones de 2075"
 carrier_hull_7_desc: "Estas bases aéreas flotantes representan la cúspide del poder naval, capaces de adentrarse en los océanos del mundo para proyectar el poder de una nación en todo el globo. Símbolo del esfuerzo y los recursos de una nación fuerte, estos activos increíblemente valiosos deben protegerse a toda costa. Con un alcance inmenso, requieren un verdadero grupo de batalla de alta mar (blue water) para desplegar toda la gama de sus capacidades operativas en el mar. Cualquier país que disponga de un grupo de batalla de portaaviones plenamente operativo puede estar verdaderamente orgulloso de lo que representa su armada y del terrorífico poder que ostenta. Se utilizan típicamente para: proyección de poder a gran escala, guerra aérea, guerra de superficie y operaciones anfibias."
 tech_submarine_engineering_6: "Motor de submarino de vanguardia"
 tech_submarine_engineering_6_desc: "El avance de las nuevas tecnologías puede permitir a los submarinos operar bajo el agua a mayores distancias, velocidades más altas y con un nivel de ruido menor."
 tech_submarine_engineering_7: "Motor de submarino hiperavanzado"
 tech_submarine_engineering_7_desc: "El progreso inmenso de las nuevas tecnologías puede permitir a los submarinos operar bajo el agua a mayores distancias, velocidades más altas y con un nivel de ruido menor."
 attack_submarine_hull_7: "Casco de submarino de ataque de 2055"
 attack_submarine_hull_7_desc: "Los asesinos silenciosos de los océanos del mundo, estas plataformas de guerra submarina incorporan una gama de capacidades útiles que incluyen el sigilo, la recopilación de inteligencia y avanzados sistemas de armas. Diseñados para un amplio espectro de misiones en mar abierto y litorales, estos especialistas en denegación de área son la piedra angular de cualquier armada. Los submarinos de ataque son combinaciones de submarino y misiles diseñadas para golpear objetivos distantes en ultramar."
 attack_submarine_hull_8: "Casco de submarino de ataque de 2070"
 attack_submarine_hull_8_desc: "Los asesinos silenciosos de los océanos del mundo, estas plataformas de guerra submarina incorporan una gama de capacidades útiles que incluyen el sigilo, la recopilación de inteligencia y avanzados sistemas de armas. Diseñados para un amplio espectro de misiones en mar abierto y litorales, estos especialistas en denegación de área son la piedra angular de cualquier armada. Los submarinos de ataque son combinaciones de submarino y misiles diseñadas para golpear objetivos distantes en ultramar."
 missile_submarine_hull_7: "Casco de submarino de misiles de 2055"
 missile_submarine_hull_7_desc: "Los asesinos silenciosos de los océanos del mundo, estas plataformas de guerra submarina incorporan una gama de capacidades útiles que incluyen el sigilo, la recopilación de inteligencia y avanzados sistemas de armas. Diseñados para un amplio espectro de misiones en mar abierto y litorales, estos especialistas en denegación de área son la piedra angular de cualquier armada."
 missile_submarine_hull_8: "Casco de submarino de misiles de 2070"
 missile_submarine_hull_8_desc: "Los asesinos silenciosos de los océanos del mundo, estas plataformas de guerra submarina incorporan una gama de capacidades útiles que incluyen el sigilo, la recopilación de inteligencia y avanzados sistemas de armas. Diseñados para un amplio espectro de misiones en mar abierto y litorales, estos especialistas en denegación de área son la piedra angular de cualquier armada."
 patrol_boat_hull_4: "Patrullero de 2055"
 patrol_boat_hull_4_desc: "Patrol boats are light vessels that are intended for coastal coverage. They are smaller than their counterpart the Corvette and are also capable of riverine operations."
 patrol_boat_hull_5: "Patrullero de 2080"
 patrol_boat_hull_5_desc: "Patrol boats are light vessels that are intended for coastal coverage. They are smaller than their counterpart the Corvette and are also capable of riverine operations."
 module_helipads_4: "Helipistas IV"
 module_helipads_4_desc: "Las instalaciones de aviación hiperavanzadas proporcionan cubiertas de vuelo optimizadas, sistemas de soporte e integración de mando, lo que permite operar de manera eficiente múltiples helicópteros modernos para tareas de vigilancia, guerra antisubmarina y proyección de fuerzas.\n\n§GConsejo de diseño: Las helipistas mejoran la detección de submarinos, la guerra antisubmarina, la detección de superficie y el dragado de minas, al tiempo que aumentan los puntos de vida. Son ideales para escoltas ASW y buques de patrulla, pero incrementan el coste de producción, el uso de combustible, la mano de obra y la visibilidad de superficie.§!"
