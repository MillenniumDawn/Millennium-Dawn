 sp_biofuel_e10_blend: "Mélange d'éthanol E10"
 sp_biofuel_e10_blend_desc: "Mélanger l'éthanol au pétrole à une concentration de 10 % est une technologie éprouvée, déployée commercialement sur des milliards de véhicules dans le monde. Standardiser l'infrastructure de production E10 réduit notre dépendance au combustible fossile importé, réoriente les surplus agricoles vers le mix énergétique, et n'exige que des modifications mineures des réseaux de raffinage et de distribution existants."
 sp_biofuel_flexfuel_butanol: "FlexFuel et synthèse du butanol"
 sp_biofuel_flexfuel_butanol_desc: "S'appuyant sur le mélange d'éthanol standardisé, ce programme poursuit deux voies parallèles. Les moteurs polycarburants tolèrent l'E85 et des mélanges à haute teneur en éthanol similaires, découplant la compatibilité des véhicules du taux de mélange. Le biobutanol offre une densité énergétique plus élevée et des performances de démarrage à froid plus proches de l'essence, mais la production à grande échelle reste un problème d'ingénierie non résolu. Un programme réussi placerait notre secteur du raffinage en avance sur le marché mondial."
 sp_nuclear_bomb_tt: "Débloque la capacité de construire des §Ybombes nucléaires§!"
 sp_caterpillar_3512b: "Moteur diesel Caterpillar 3512B"
 sp_caterpillar_3512b_desc: "Le Caterpillar 3512B est un moteur diesel puissant et fiable, largement utilisé dans diverses applications, y compris les navires, la production d'électricité et les engins lourds. Sa conception robuste et ses hautes performances en font un choix idéal pour motoriser du matériel dans les conditions rudes de l'Antarctique."
 sp_premium_living_quarters: "Quartiers d'habitation haut de gamme"
 sp_premium_living_quarters_desc: "Ces quartiers d'habitation haut de gamme offrent un confort et des commodités accrus au personnel stationné en Antarctique, améliorant la satisfaction et la productivité de la station."
 sp_drone_surface_combatant: "Combattants de surface autonomes"
 sp_drone_surface_combatant_desc: "Alors que le recrutement et la fidélisation des équipages deviennent plus difficiles, les plus grands combattants de surface sont reconçus autour de l'automatisation. Frégates et destroyers à équipage optionnel nous permettent de maintenir une présence océanique avec une fraction de l'effectif, au prix d'un plus fort recours à l'électronique avancée."
 sp_space_program: "Programme spatial"
 sp_space_program_desc: "Tout le monde veut aller dans l'espace, sauf la Pologne. La Pologne cannot into space."
 sp_space_weapons_desc: "Jadis œuvre de science-fiction, nos scientifiques ont enfin commencé à concevoir des KILLSAT et d'autres munitions utilisables dans le vide spatial. La capacité d'employer ces armes nous renforcera non seulement en défense mais aussi en attaque, car nous pourrons intercepter, perturber et empêcher les puissances hostiles parmi les étoiles."
 sp_CNRP: "Polymère renforcé de nanotubes de carbone"
 sp_CNRP_desc: "Incorporer des treillis de nanotubes de carbone dans les composites aérospatiaux donne des matériaux de cellule plus résistants et plus légers que la fibre de carbone conventionnelle. Les économies de poids se traduisent directement par une meilleure portée, une charge utile accrue et une durabilité structurelle."
