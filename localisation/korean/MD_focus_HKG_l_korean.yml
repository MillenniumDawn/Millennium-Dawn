 hongkong.8.t: "용의 해"
 hongkong.8.d: "본토와의 통일 이후 3년이 흘렀습니다. 홍콩은 서방이 예측한 쇠퇴 없이 아시아 금융 위기를 견뎌냈습니다. 새 천년이 밝아 오는 지금, 도시는 중국과의 통합이 나쁜 일이 아님을 계속 입증해 나갈 것입니다."
 hongkong.8.a: "신니엔 파이록! (새해 복 많이 받으십시오!)"
 hongkong.9.t: "우리 장비를 원하는 홍콩"
 hongkong.9.d: "홍콩 경찰이 중국산 소형 화기를 주문했습니다. 물량은 많지 않지만 상징성은 큽니다. 홍콩 특별행정구가 본토 공급업체로부터 조달하는 최초의 공식 보안 장비 구매입니다. 국영 매체는 이미 이 거래를 특별행정구가 조국의 산업을 점점 신뢰한다는 신호로 보도하고 있습니다."
 hongkong.9.a: "우호적인 조건으로 승인한다"
 hongkong.9.b: "이 기회를 국가 선전에 활용한다"
 hongkong.13.t: "베이징의 응답"
 hongkong.13.d: "입법회가 본토 반체제 인사의 석방을 호소한 지 한 달 뒤, 연락판공실이 날카로운 질책을 내놓았습니다. 국영 매체는 홍콩 정치인들이 \\"중화인민공화국의 내정에 간섭\\"한다고 비난합니다. 눈에 띄지 않는 수감자 몇 명은 조용히 풀려났지만 훨씬 더 많은 이들이 여전히 갇혀 있습니다. 범민주파는 격분했고 애국 진영은 의기양양합니다."
 hongkong.13.a: "부분적 석방을 환영한다"
 hongkong.13.b: "베이징의 질책을 규탄한다"
 hongkong.13.c: "조용히 이 문제를 접는다"
 HKG_aukus_request_tt: "§Y[ROOT.GetNameDef]§!이(가) §H[ENG.GetName]§!, §H[USA.GetName]§!, §H[AST.GetName]§!에 정보 공유 접근권을 §Y요청§!합니다. 이들은 거절할 수 있습니다."
 HKG_uk_garrison_request_tt: "§H[ENG.GetName]§!이(가) 홍콩에 병력을 주둔시키도록 초청받습니다. 거절할 수 있습니다."
 hongkong.14.t: "홍콩 문제"
 hongkong.14.d: "홍콩 거리에 2백만 명이 모였습니다. 송환법 반대 운동은 특별행정구의 정치 질서를 뿌리째 흔들었습니다. 친베이징 관료들은 더 단호한 조치를 요구하고 있으며, 국무원의 실용주의자들은 과잉 대응이 외국 자본을 쫓아낼 것이라고 경고합니다. 정치국 상무위원회가 대응 방식을 결정할 것입니다."
 hongkong.14.a: "통제를 강화한다: 공식적인 괴뢰국 지위"
 hongkong.14.b: "절제를 보인다: 체제를 유지한다"
 hongkong.15.t: "홍콩의 AUKUS 접근 요청"
 hongkong.15.d: "홍콩의 친서방 정부가 정보 공유와 기지 접근권을 공식 요청했습니다. 중국 남부 끝에 우호적인 항구를 확보하는 전략적 가치는 상당하지만, 베이징은 이를 적대 행위로 간주할 것이며 안보적 함의는 양쪽에 모두 작용합니다. 이 문제는 국가안전보장회의로 넘어갑니다."
 hongkong.15.a: "접근을 허용한다: 홍콩은 전략적 자산이다"
 hongkong.15.b: "거절한다: 베이징과 거리를 유지한다"
 hongkong.16.t: "홍콩의 영국 주둔군 초청"
 hongkong.16.d: "홍콩 정부가 영국에 특별행정구 내 영구 군 주둔지를 다시 설치할 것을 공식 초청했습니다. 상징성은 엄청날 것이며, 베이징과의 외교적 파장은 심각할 것입니다. 국방장관의 보고서가 내각 회의 탁자에 올라옵니다."
 hongkong.16.a: "수락한다: 영국의 주둔을 복원한다"
 hongkong.16.b: "거절한다: 외교적 비용이 너무 크다"
 hongkong.10.t: "보통선거 문제"
 hongkong.10.d: "기본법에 따라 첫 두 행정장관과 첫 세 입법회는 보통선거가 아닌 선거위원회를 통해 선출되었습니다. 2007년 행정장관 선거와 2008년 입법회 선거는 완전한 보통선거를 궁극적 목표로 하여 홍콩의 민주 제도를 개혁할지 결정할 기회를 제공합니다."
 hongkong.10.a: "홍콩의 선거 제도는 현상을 유지할 것이다."
 hongkong.10.b: "즉각적인 보통선거는 지지하지 않지만, 점진적이고 질서 있는 선거 개혁은 지지할 것이다."
 hongkong.10.c: "차라리 급진적으로 나가 보통선거를 그냥 허용해 버리자!"
 hongkong.11.t: "PCCW와 HKT의 합병"
 hongkong.11.d: "케이블 앤드 와이어리스는 중국 정부의 반대에도 불구하고 홍콩텔레콤을 싱텔에 매각할 계획을 발표했습니다. 리카싱의 아들 리처드 리가 이끄는 PCCW가 입찰에 뛰어들어 결국 승리했습니다. 합병 발표 이후 PCCW의 주가는 몇 센트에서 당일 장 마감 시 홍콩달러 28.50까지 치솟았고, 시가총액은 한때 홍콩달러 2,500억을 넘어섰습니다."
 hongkong.11.a: "인터넷은 정말 대단한 것이다!"
 hongkong.12.t: "닷컴 버블 붕괴의 충격"
 hongkong.12.d: "닷컴 버블이 붕괴하면서, 홍콩텔레콤 합병으로 주가가 치솟은 지 불과 몇 달 만에 PCCW의 주가는 98% 폭락했습니다. 회사는 막대한 자본잠식 상태에 놓였고, 재정난을 덜기 위해 핵심 사업의 매각을 계획할 수밖에 없었습니다."
 hongkong.12.a: "새 천년, 새로운 문제."
 hongkong_legco.1.t: "[GetYear]년 입법회 의석"
 hongkong_legco.1.d: "입법회가 새 임기를 맞아 소집되었습니다. 지역구와 직능 선거구 의석이 집계되어 의회의 실질적 다수가 확정되었습니다. 동의안 표결은 통과에 [?HKG_legco_required_seats]석이 필요하며, 헌법적 동의안은 [?HKG_legco_specially_required_seats]석이 필요합니다."
 hongkong_legco.1.a: "알겠다."
 hongkong_news.4.t: "123 민주동맹의 오늘 해산"
 hongkong_news.4.d: "1994년 친대만, 친민주, 친기업 성향의 정치인들이 결성한 123 민주동맹이 국민당의 총통 선거 패배 이후 대만 정부의 재정 지원이 끊기면서 해산되었습니다."
 hongkong_news.4.a: "좋은 소식 아닌가?"
 hongkong_news.4.b: "알겠다."
 hongkong_news.5.t: "사스 발병"
 hongkong_news.5.d: "\\"사스\\"로 알려진 중증 폐렴 바이러스가 광둥과 홍콩에서 발병했습니다. 본토 당국자들은 효과적으로 통제되고 있다고 주장하지만, 홍콩에서는 발병이 계속되고 있습니다. 세계보건기구(WHO)는 이제 중국 남부와 홍콩에 대한 여행 경보를 발령했으며, 이것이 세계적 보건 위협이라고 밝혔습니다. 지금까지 한 명이 사망했습니다. 홍콩 정부는 감염이 의심되는 이들에 대한 의무 격리 조치에 들어갔습니다."
 hongkong_news.5.a: "우리 관광 부문이 위기에 처했다."
 hongkong_news.5.b: "무능한 관료를 체포하고 투명하게 발병에 대처한다."
 hongkong_news.5.c: "사회 안정을 위해 실제 자료를 계속 숨겨야 한다."
 hongkong_news.5.e: "우려스러운 사태이다."
 hongkong_news.6.t: "장궈룽의 타계"
 hongkong_news.6.d: "세계적으로 이름난 홍콩의 가수이자 배우, 아이콘 장궈룽이 우울증으로 홍콩 만다린 오리엔탈 호텔 건물에서 투신하여 46세의 나이로 생을 마감했습니다. 장궈룽은 진심 어린 노래와 뛰어난 연기력, 독특한 개인적 매력으로 수많은 팬의 마음을 사로잡았습니다. 그의 타계는 중화권 전체에 충격을 주었으며, 많은 이들이 깊은 슬픔과 상실감에 빠졌습니다.\n\n장궈룽의 타계는 연예계의 큰 손실일 뿐 아니라 문화적, 정신적 타격이기도 합니다. 그의 음악과 영화 작품은 앞으로도 후대 예술가와 관객에게 영향을 주고 영감을 줄 것이지만, 그의 부재는 영원히 메울 수 없는 공백으로 남을 것입니다."
 hongkong_news.6.a: "오늘 우리는 위대한 예술가를 잃었다."
 hongkong_news.7.t: "매염방의 타계"
 hongkong_news.7.d: "\\"아시아의 마돈나\\"로 널리 알려진 매염방이 자궁경부암과의 용감한 투병 끝에 40세의 나이로 세상을 떠났습니다.\n\n1963년에 태어난 매염방은 1980년대에 명성을 얻어 광둥팝 무대의 핵심 인물로 자리 잡았고, 수백만 팬들에게 오래도록 남을 유산을 남겼습니다. 자선 활동에 대한 헌신과 병마 앞에서도 흔들리지 않던 강인함은 깊은 존경을 받았습니다. 그의 타계 소식이 퍼지면서 침울한 분위기가 온 나라를 뒤덮었고, 사람들은 사랑받던 \\"홍콩의 딸\\"을 기리기 위해 한데 모였습니다."
 hongkong_news.7.a: "위대한 한 시대의 끝."
 hongkong_news.8.t: "강한 열대 폭풍 우토"
 hongkong_news.8.d: "7월 4일 오후 5시 45분, 태풍 우토가 800킬로미터 경계 구역에 진입하여 홍콩 천문대는 1호 대기 신호를 발령했습니다. 7월 5일 오후 7시 30분에는 신호가 8호 강풍 또는 폭풍 신호로 격상되었으며, 이는 21세기 들어 처음 발령된 것입니다. 폭풍 해일로 인해 그날 아침 폭풍 해일과 정상 만조가 겹치면서 쿼리 베이에서 해수면 3.4미터가 기록되었고, 이는 1962년 태풍 완다가 홍콩을 강타한 이래 가장 높은 수치였습니다. 이로 인해 7월 6일 타이오와 신계 북서부에 심각한 침수가 발생했습니다. 타이오의 일부 주요 도로는 강으로 변해 수심이 최대 3미터에 달했습니다. 라우퍼산의 수산물 도매시장도 침수되어 많은 상점이 문을 닫아야 했습니다."
 hongkong_news.8.a: "천문대가 제 역할을 다했다."
 hongkong_news.9.t: "강한 열대 폭풍 위투 (옥토끼)"
 hongkong_news.9.d: "열대 폭풍 위투가 홍콩 천문대의 경계 구역에 진입하여 1호 대기 신호가 발령되었습니다. 대중교통 운행 시간표가 조정되고, 학교는 폭풍 경계 태세에 들어갔으며, 도시의 배수 및 긴급 서비스가 가동되었습니다. 천문대는 향후 24시간 동안 최악의 상황이 올 것으로 예상합니다."
 hongkong_news.9.a: "몸을 낮추고 지나가길 기다린다."
 HKG_european_bussiness_opinion: "유럽 사업가와의 무역 개선"
 HKG_chinese_entrepreneurs_opinion: "본토 기업가와의 무역 개선"
 HKG_protest_movement_rises: "시위가 시작되다"
 HKG_protest_movement_rises_desc: "수십만 명이 거리로 쏟아져 나옵니다. 세계가 지켜보고 있습니다. 베이징도 지켜보고 있습니다."
 HKG_loyalist_consolidation: "충성파 결집"
 HKG_loyalist_consolidation_desc: "친베이징 세력이 입법회와 공무원 인사에 대한 장악력을 강화합니다."
 HKG_umbrella_revolution: "우산 혁명"
 HKG_umbrella_revolution_desc: "학생과 활동가들이 도시의 주요 간선도로를 점거합니다. 노란 우산은 한 세대의 희망의 상징이 됩니다."
 HKG_democratic_opposition_network: "민주 반대 세력 네트워크"
 HKG_democratic_opposition_network_desc: "범민주 정당과 시민사회 단체가 베이징의 잠식에 맞서기 위해 폭넓은 연합을 결성합니다."
 HKG_nsl_imposed: "국가보안법"
 HKG_nsl_imposed_desc: "베이징은 입법회를 완전히 우회합니다. 하룻밤 사이에 시위, 국가 전복, 분리, 외세와의 결탁이 종신형에 처해질 수 있는 범죄가 됩니다."
 HKG_press_freedom_crackdown: "언론 침묵시키기"
 HKG_press_freedom_crackdown_desc: "빈과일보가 압수수색을 받고 폐간됩니다. RTHK의 편집 독립성이 박탈됩니다. 마지막 자유로운 목소리가 꺼집니다."
 HKG_police_state_apparatus: "철권 치안"
 HKG_police_state_apparatus_desc: "경찰은 국가보안법 조항 아래 권한을 확대합니다. 진압 부대, 잠복 작전, 대규모 체포가 일상이 됩니다."
 HKG_dialogue_with_protesters: "대화 위원회"
 HKG_dialogue_with_protesters_desc: "탄압이 전면화되기 전 중재를 위한 마지막 필사적 시도입니다. 독립적인 참관인들이 경찰의 행위를 검토하도록 초청됩니다."
 HKG_anti_extradition_bill: "송환법 위기"
 HKG_anti_extradition_bill_desc: "중국 본토로의 송환을 허용하는 법안이 홍콩 역사상 최대 규모의 시위에 불을 붙입니다. 2백만 명이 행진합니다."
 HKG_youth_resistance_cells: "청년 저항"
 HKG_youth_resistance_cells_desc: "용감한 젊은 홍콩인들이 최전선 조직을 결성합니다. 검은 옷을 입은 세대는 화염병과 우산으로 최루탄과 고무탄에 맞서 싸웁니다."
 HKG_emigration_wave: "대탈출"
 HKG_emigration_wave_desc: "수십만 명이 BN(O) 제도에 따라 영국, 캐나다, 오스트레일리아로 떠납니다. 홍콩은 전문직 계층이 대량으로 빠져나가는 출혈을 겪습니다."
 HKG_preserve_financial_hub: "금융 허브 보존"
 HKG_preserve_financial_hub_desc: "재계 엘리트들이 베이징에 로비합니다. 홍콩의 가치는 독자적인 법률 체계와 국제적 연결에 있다는 것입니다. 그것을 파괴하면 모든 것을 파괴하는 것입니다."
 HKG_foreign_business_exodus: "외국 자본 이탈"
 HKG_foreign_business_exodus_desc: "은행, 로펌, 다국적 기업들이 조용히 지역 본부를 싱가포르와 도쿄로 옮깁니다. 금융의 왕관이 미끄러집니다."
 HKG_western_sanctions_threat: "서방 제재 위협"
 HKG_western_sanctions_threat_desc: "미국, 영국, EU가 홍콩의 특별 무역 지위를 재검토합니다. 서방 시장에 대한 도시의 특권적 접근이 위태로워집니다."
 HKG_deeper_mainland_integration: "본토와의 심화된 통합"
 HKG_deeper_mainland_integration_desc: "대만구 구상은 홍콩을 중국의 경제권으로 끌어들입니다. 기반시설, 금융, 통치 체계가 서서히 수렴합니다."
 HKG_patriotic_education: "애국 교육"
 HKG_patriotic_education_desc: "새로운 교과과정이 역사를 다시 씁니다. 다음 세대는 홍콩이 언제나 중국이었고 앞으로도 영원히 중국일 것이라고 배우게 됩니다."
 HKG_last_stand_opposition: "마지막 민주주의 항전"
 HKG_last_stand_opposition_desc: "살아남은 민주화 인사들은 침묵을 거부합니다. 런던과 워싱턴의 망명지에서 그들은 다시는 고향에 돌아가지 못할 수도 있음을 알면서도 세계를 향한 로비를 이어갑니다."
 HKG_absorption_complete: "흡수 완료"
 HKG_absorption_complete_desc: "하나의 국가. 하나의 체제. 실험은 끝났습니다. 홍콩의 독특한 정체성은 이제 기억과 디아스포라 속에서만 존재합니다."
 HKG_city_of_resistance: "저항의 도시"
 HKG_city_of_resistance_desc: "모든 역경에도 불구하고 저항의 정신은 이어집니다. 홍콩은 전 세계 민주주의 국가들의 상징이 되며, 승산이 없을 때조차 싸워 지킬 가치가 있는 것이 있음을 증명합니다."
 HKG_silenced_press: "침묵당한 언론"
 HKG_silenced_press_desc: "언론을 침묵시키면 통합이 수월해지겠지만, 대중의 분노가 한계점에 이르기 전에 신속히 움직여야 합니다."
 HKG_annexation: "모범 특별행정구"
 HKG_annexation_desc: "홍콩은 베이징의 모범 특별행정구가 되었습니다. 순종적이고, 번영하며, 통합되어 있습니다. 정치국은 충성에 우대 무역 접근, 본토 노동력 유입, 기반시설 투자로 보답합니다. 이러한 특권은 홍콩이 중화인민공화국의 일부로 남아 있는 한 유지됩니다."
 HKG_democratic_reform_initiative: "민주 개혁 구상"
 HKG_democratic_reform_initiative_desc: "평화적 노선이 결실을 맺었습니다. 시민사회가 조직되고, 언론이 보호되며, 입법회가 개방되면서, 특별행정구는 민주 개혁 프로그램을 공식적으로 약속합니다. 제도는 존재하며, 이제 그것을 강화할 것입니다."
 HKG_universal_suffrage_amendment: "보통선거 개정안"
 HKG_universal_suffrage_amendment_desc: "모든 성인 홍콩인이 투표권을 갖고, 모든 선출직이 경쟁 선거로 치러지며, 지명위원회는 해산됩니다. 개정안은 입법회를 통과해 헌법적 권리로 명문화됩니다. 베이징은 항의하고, 홍콩은 환호합니다."
 HKG_independent_judiciary_reform: "사법 독립 개혁"
 HKG_independent_judiciary_reform_desc: "종심법원은 정치적 거부권에서 벗어나고, 검사는 행정부와 거리를 두고 활동하며, 법관 임명은 독립 위원회의 검토를 받습니다. 자신이 해석하는 법치에 걸맞은 사법부입니다."
 HKG_freedom_of_information_act: "정보 공개법"
 HKG_freedom_of_information_act_desc: "정부 문서는 기본적으로 대중이 열람할 수 있게 됩니다. 내부고발자는 법적 보호를 받습니다. 침묵당한 언론 국가 정신은 철회되고, 홍콩의 언론은 이 지역에서 가장 보기 드문 것, 곧 중국 도시의 자유 언론이 됩니다."
 HKG_democratic_consolidation: "민주주의 공고화"
 HKG_democratic_consolidation_desc: "보통선거, 독립된 사법부, 자유 언론이 이제 서로를 강화합니다. 홍콩은 역사상 가장 민주적인 중국인 사회로 자리매김합니다. 이 개혁은 조례로 되돌릴 수 없으며, 새로운 토대입니다."
 HKG_infrastructure_megaproject: "기반시설 메가프로젝트"
 HKG_infrastructure_megaproject_desc: "토지국이 마스터플랜을 수립합니다. 홍콩의 향후 10년 성장은 바깥으로, 위로, 그리고 지하로 건설하는 데 달려 있습니다. 국고가 열리고, 계약이 체결되고, 크레인이 도착합니다."
 HKG_mtr_expansion_phase_2: "MTR 확장 2단계"
 HKG_mtr_expansion_phase_2_desc: "서부 철도 노선과 사틴-센트럴 링크의 연장, 그리고 오래도록 약속되어 온 북부 섬 회랑입니다. 통근 시간은 줄고, 신설 역 주변의 부동산 가치는 오르며, MTR 망은 영국 통치 시절부터 기다려 온 지구에까지 닿습니다."
 HKG_third_runway_chek_lap_kok: "책랍콕 제3활주로"
 HKG_third_runway_chek_lap_kok_desc: "간척 공사만으로도 수년이 걸리고 비용은 엄청나지만, 싱가포르와 상하이가 확장하는 동안 홍콩 국제공항이 활주로 두 개짜리 공항으로 남아 있을 수는 없습니다. 제3활주로는 도시의 지역 항공 허브 지위를 확보해 줍니다."
 HKG_lantau_tomorrow_vision: "란타우 투모로 비전"
 HKG_lantau_tomorrow_vision_desc: "홍콩 역사상 가장 야심찬 간척 사업으로, 란타우 동쪽의 인공섬, 수십만 명을 위한 주택, 새로운 중심 업무 지구를 조성합니다. 환경론자들은 반대하고 주택 빈곤층은 환호합니다. 정치적 비용은 현실적이며, 가용 토지 확보의 이득은 막대합니다."
 HKG_smart_city_initiative: "스마트시티 구상"
 HKG_smart_city_initiative_desc: "도시 전역의 5G, 통합 교통 관리, 모든 주민을 위한 디지털 신원, 그리고 스타트업이 특별행정구의 데이터 위에 서비스를 구축할 수 있게 하는 공공 서비스 API입니다. 홍콩은 번영하는 도시에서 프로그래밍 가능한 도시로 도약합니다."
 HKG_world_class_infrastructure: "세계적 수준의 기반시설"
 HKG_world_class_infrastructure_desc: "도로, 철도, 항구, 공항, 광케이블, 간척지가 함께 개선됩니다. 21세기 후반을 위해 건설된 도시의 기반시설이 마침내 완성됩니다."
 HKG_hospital_authority_reform: "병원관리국 개혁"
 HKG_hospital_authority_reform_desc: "병원관리국이 투명성, 효율성, 성과 기반 재원 조달을 위해 재편됩니다. 대기 시간이 줄기 시작하고, 공공 의료와 민간 의료 사이의 간극이 좁아지며, 현대적 체계의 토대가 마련됩니다."
 HKG_pandemic_preparedness: "팬데믹 대비"
 HKG_pandemic_preparedness_desc: "사스는 도시에 혹독한 교훈을 남겼고, 새 보건보호센터는 그것이 잊히지 않도록 합니다. 비축된 개인보호장비, 접촉자 추적 역량, WHO와의 통합 감시 체계가 갖춰집니다. 다음 발병은 홍콩의 허를 찌르지 못할 것입니다."
 HKG_chinese_medicine_integration: "중의학 통합"
 HKG_chinese_medicine_integration_desc: "전통 중의학이 공공 보건 체계에 편입됩니다. 규제받는 시술자, 병원 별관, 대학 연구 보조금이 그 내용입니다. 두 세계를 모두 원하는 환자는 두 세계를 모두 얻으며, 베이징은 이 문화적 존중을 눈여겨봅니다."
 HKG_universal_healthcare_voucher: "보편 의료 바우처"
 HKG_universal_healthcare_voucher_desc: "모든 주민은 공공 또는 민간 진료소에서 사용할 수 있는 연간 바우처를 받습니다. 보장은 명목상으로뿐 아니라 실제로도 보편적이 되며, 근로 빈곤층은 월세와 병원비 사이에서 선택하지 않아도 됩니다."
 HKG_public_health_modernisation: "공중보건 현대화"
 HKG_public_health_modernisation_desc: "새로운 암 센터, 확대된 정신건강 서비스, 신계 전역의 현대화된 병원입니다. 의료 자체가 제도 개혁을 따라잡습니다."
 HKG_healthcare_excellence: "의료 우수성"
 HKG_healthcare_excellence_desc: "홍콩의 기대 수명은 이미 세계 최고 수준이며, 이를 만들어낸 체계는 이제 그 통계에 걸맞습니다. 주변 지역이 연구하고 모방하기 시작하는 모델입니다."
 HKG_labour_reform_charter: "노동 개혁 헌장"
 HKG_labour_reform_charter_desc: "수십 년 만에 처음으로 이루어지는 홍콩 노동법의 포괄적 검토입니다. 착취 공장, 무급 초과 근무, 기숙사 학대, 비공식 부문 착취가 명시되고 측정되어 입법 일정에 오릅니다. 노동조합이 이를 주목합니다."
 HKG_minimum_wage_ordinance: "최저임금 조례"
 HKG_minimum_wage_ordinance_desc: "2년마다 조정되는 법정 최저임금입니다. 재벌들은 경쟁력을 이유로 항의하지만, 청소부와 식당 종업원들은 한 세대 만에 처음으로 급여 봉투가 두툼해지는 것을 보게 됩니다."
 HKG_collective_bargaining_rights: "단체 교섭권"
 HKG_collective_bargaining_rights_desc: "노동조합은 법적 인정을 받고, 단체 협약은 법적 구속력을 갖게 되며, 파업권은 묵인되는 것이 아니라 성문화됩니다. 홍콩직공회연맹은 상공회의소에 대한 진정한 견제 세력이 됩니다."
 HKG_foreign_domestic_helpers_protections: "외국인 가사 도우미 보호"
 HKG_foreign_domestic_helpers_protections_desc: "주로 필리핀과 인도네시아 출신인 입주 가사 노동자들이 최악의 고용주 학대에 맞서 집행 가능한 보호를 받게 됩니다. 의무 휴일, 투명한 계약 조건, 실질적인 권한을 가진 규제 기관이 포함됩니다. 이들이 하인이 아니라 노동자라는 오랜 숙원의 인정입니다."
 HKG_pension_scheme_reform: "연금 제도 개혁"
 HKG_pension_scheme_reform_desc: "강제적립연금(MPF)의 최악의 특징인 높은 수수료, 고용주 상계에 따른 환수, 기여금 공백이 개혁됩니다. 홍콩의 노년 빈곤은 더 이상 조용한 스캔들이 아닙니다."
 HKG_labour_dignity: "노동의 존엄"
 HKG_labour_dignity_desc: "임금의 법정 하한선, 인정받는 노조, 보호받는 도우미, 그리고 실제로 연금다운 연금입니다. 홍콩에서 일하는 것이 마침내 존엄한 고용에 가까운 무언가가 됩니다."
 HKG_renminbi_offshore_hub: "위안화 역외 허브"
 HKG_renminbi_offshore_hub_desc: "베이징은 세계 최대의 역외 위안화 자금 풀을 홍콩에 맡깁니다. 딤섬 채권 발행, 통화 스와프, 그리고 지역 전체의 청산 서비스가 센트럴을 거쳐 이루어집니다. 본토와의 근접성이 결실을 맺습니다."
 HKG_belt_and_road_financing: "일대일로 금융"
 HKG_belt_and_road_financing_desc: "홍콩은 유라시아 전역의 일대일로 기반시설을 위한 금융 관문이 됩니다. 프로젝트 파이낸스, 채권 인수단 구성, 분쟁 해결 등 특별행정구의 전문성이 중국 자본과 함께 수출됩니다."
 HKG_green_finance_centre: "녹색 금융 센터"
 HKG_green_finance_centre_desc: "HKEX는 녹색 채권 시장을 출범시키고, 증권선물감시위원회는 실효성 있는 기후 공시 규칙을 내놓으며, 홍콩은 스스로를 ESG 자본의 아시아 관문으로 자리매김합니다. 유럽의 연금 기금이 주목합니다. 재생에너지 개발업자도 마찬가지입니다."
 HKG_fintech_revolution: "핀테크 혁명"
 HKG_fintech_revolution_desc: "가상은행 면허, 규제 샌드박스, 그리고 마침내 소매 금융을 디지털 시대로 끌어들이는 빠른 결제 시스템입니다. 차세대 금융 기업은 센트럴이 아닌 사이버포트에서 탄생합니다."
 HKG_global_wealth_management: "글로벌 자산 관리"
 HKG_global_wealth_management_desc: "위안화 청산, 녹색 자본, 핀테크 인프라 모두에서 홍콩은 중심에 서 있습니다. 세계의 부는 특별행정구를 통해 스스로를 관리합니다. 수수료만으로도 도시의 존재 이유가 충분합니다."
 HKG_tourism_board_revival: "관광청 재건"
 HKG_tourism_board_revival_desc: "반환 이후, 사스 이후, 모든 일 이후에 관광청이 재출범합니다. 더 나은 마케팅, 확대된 방문객 서비스, 그리고 \\"아시아의 월드 시티\\"라는 상투어를 넘어서는 도시의 일관된 브랜드입니다. 방문객들이 알아봅니다."
 HKG_disney_hong_kong: "홍콩 디즈니랜드"
 HKG_disney_hong_kong_desc: "란타우 섬이 디즈니 파크 중 가장 작은, 그러나 본토 관광객이 가장 접근하기 쉬운 파크를 유치합니다. 건설 비용은 막대하고 개장식은 화려하며, 특별행정구는 관광 경제의 가족 친화적 중심축을 얻습니다."
 HKG_cantopop_revival: "광둥팝 부흥"
 HKG_cantopop_revival_desc: "공공 투자, 방송사 쿼터, 음악 축제 후원의 물결이 광둥어 대중음악을 다시 상업적 중요성으로 되돌립니다. 광둥팝이 한때 구현했던 문화적 자신감이 음악과 함께 돌아옵니다."
 HKG_film_industry_renaissance: "영화 산업 르네상스"
 HKG_film_industry_renaissance_desc: "TVB 스튜디오가 확장되고, 독립 영화 작가들이 투자를 받으며, 홍콩 영화는 80~90년대의 기세를 되찾습니다. 무술과 범죄만이 아니라 진지한 드라마, 가족 코미디, 들려줄 이야기를 가진 새로운 세대의 감독들이 등장합니다."
 HKG_west_kowloon_cultural_district: "서구룡 문화지구"
 HKG_west_kowloon_cultural_district_desc: "M+, 고궁박물관, 시취 센터, 그리고 한때 간척지였던 곳에 들어선 십여 개의 소규모 기관입니다. 도시가 유리 고층 건물 로비가 아니라 갤러리와 극장에서 스스로의 이야기를 들려줄 수 있게 하는 진정한 문화 지구입니다."
 HKG_world_class_destination: "세계적 수준의 여행지"
 HKG_world_class_destination_desc: "관광, 기반시설, 음식, 문화가 모두 한꺼번에 정점에 오릅니다. 홍콩은 단순한 경유지나 금융 거래 장소가 아니라 그 자체로 목적지, 곧 여행자들이 여행 전체를 계획하는 도시가 됩니다."
 HKG_consolidated_democracy: "공고화된 민주주의"
 HKG_consolidated_democracy_desc: "홍콩의 민주 제도는 이제 스스로를 강화합니다. 자유 언론, 독립된 법원, 경쟁 선거가 그것입니다. 작동하기 위해 중앙정부의 허락이 필요하지 않은 민주주의입니다."
 HKG_modernised_infrastructure_idea: "현대화된 기반시설"
 HKG_modernised_infrastructure_idea_desc: "홍콩의 도로, 철도, 항구, 디지털 기반이 세계 최상위 수준으로 개선되었습니다. 모든 부문이 그 승수 효과의 혜택을 누립니다."
 HKG_modern_healthcare_system: "현대적 의료 체계"
 HKG_modern_healthcare_system_desc: "보편적 보장, 현대화된 병원, 통합된 공공·민간 진료는 지속 가능한 비용으로 세계 최고 수준의 보건 성과를 냅니다."
 HKG_renminbi_hub_idea: "역외 위안화 허브"
 HKG_renminbi_hub_idea_desc: "홍콩은 세계 최고의 역외 위안화 청산 중심지입니다. 무역, 투자, 환헤지 자금 흐름이 특별행정구의 은행과 거래소를 거쳐 갑니다."
 HKG_green_finance_idea: "녹색 금융 센터"
 HKG_green_finance_idea_desc: "기후 정합 자본을 위한 아시아의 관문입니다. 녹색 채권, ESG 등급 주식, 재생에너지 사업 금융이 센트럴을 거쳐 흐릅니다."
 HKG_tourism_boom: "관광 호황"
 HKG_tourism_boom_desc: "홍콩은 다시 한번 세계 최상위 여행지가 되었습니다. 방문객의 지출이 소매, 숙박, 문화를 먹여 살리고, 수입과 함께 사회 분위기도 좋아집니다."
 HKG_modernised_police_force: "현대화된 경찰"
 HKG_modernised_police_force_desc: "홍콩 경찰은 최신 훈련, 장비, 절차 기준을 갖추고 운영됩니다. 일상 치안이 더 효과적이 되고, 범죄 대응 비용이 줄며, 경찰에 대한 대중의 신뢰는 설문 자료로 측정될 만큼 높아집니다."
 HKG_counter_terrorism_capability: "대테러 능력"
 HKG_counter_terrorism_capability_desc: "대테러 대응 부대는 특별행정구에 조직적 위협에 맞설 신뢰할 수 있는 전문 능력을 부여합니다. 외국 정보기관은 들키지 않고 활동하기가 더 어려워지며, 경찰은 소규모 상설 특수 작전 요원단을 보유하게 됩니다."
 HKG_riot_control_capability: "진압 능력"
 HKG_riot_control_capability_desc: "경찰은 장갑차, 방패, 최루 가스, 숙달된 군중 관리 절차를 갖추고 있습니다. 소요는 더 확실하게 억제되지만, 보호 장비는 특별행정구가 공공 질서에 대해 특정한 접근법을 택했음을 눈에 띄게 상기시키기도 합니다."
 HKG_clean_police_force: "청렴한 경찰"
 HKG_clean_police_force_desc: "내부 조사, 염정공서의 감독, 청렴에 대한 공개적 약속이 경찰 내부의 부패를 눈에 띄게 줄였습니다. 삼합회에서 돈을 받다 적발된 경찰관은 실질적인 처벌을 받습니다. 경찰의 평판과 효율성이 모두 향상됩니다."
 hongkong_order.1.t: "시민 사회 전환기의 압력"
 hongkong_order.1.d: "특별행정구 전역에서 일상적인 치안 사건이 늘고 있습니다. 원인은 다양합니다. 주거 압박, 국경 간 이주, 언어와 문화 마찰, 일부 지구의 경제적 불확실성 등입니다. 어느 한 가지 불만이 지배적이지는 않습니다. 경찰은 범죄적이라기보다 사회적인 상황에 어떻게 대응할지 질의받았습니다."
 hongkong_order.1.a: "지역 순찰을 늘린다."
 hongkong_order.1.b: "지역사회 연락 프로그램을 마련한다."
 hongkong_order.1.c: "현재 태세를 유지한다."
 hongkong_order.2.t: "국경 간 범죄 공조"
 hongkong_order.2.d: "대테러 대응 부대는 특별행정구와 본토의 경계를 넘나드는 조직범죄 네트워크를 확인했습니다. 효과적인 차단에는 본토 공안과의 공조가 필요하지만, 법적 체계가 다르고 기본법이 작전 통합의 경계를 정하고 있습니다. 경무처장이 지침을 요청합니다."
 hongkong_order.2.a: "본토 당국과의 합동 작전을 심화한다."
 hongkong_order.2.b: "관할권 내에서 독자적 작전을 유지한다."
 hongkong_order.2.c: "공식 경로를 통한 협력으로만 제한한다."
 hongkong_order.3.t: "정부 청사 앞 시위"
 hongkong_order.3.d: "수천 명의 시위대가 정부 청사 앞에 모였습니다. 불만은 뒤섞여 있습니다. 주거비 부담, 고용, 그리고 설명하기 더 어려운 시민적 좌절감입니다. 일부 현수막은 반환을 언급하지만 대부분은 그렇지 않습니다. 군중은 시끄럽지만 폭력적이지 않습니다. 경찰은 대응을 결정해야 합니다."
 hongkong_order.3.a: "주최 측과 대화를 시작한다."
 hongkong_order.3.b: "눈에 띄는 방어선을 유지하며 상황을 지켜본다."
 hongkong_order.3.c: "군중 해산을 승인한다."
 hongkong_order.4.t: "경찰-삼합회 유착 의혹"
 hongkong_order.4.d: "한 내부고발자의 보고서는 경찰 구성원들이 일부 삼합회 활동을 눈감아 주는 대가로 금품을 받아 왔다고 주장합니다. 조사를 요구하는 정치적 압력은 상당하며, 경찰 노조는 적법 절차에 앞서 개별 경찰관을 희생양으로 삼는 것을 경계합니다. 이 문제는 무시할 수 없습니다."
 hongkong_order.4.a: "염정공서를 통해 공식 조사를 개시한다."
 hongkong_order.4.b: "내부 징계 검토만 진행한다."
 hongkong_order.4.c: "개별적인 사건으로 취급한다."
 HKG_new_development_idea_buff: "신개발 계획"
 HKG_new_development_idea_buff_desc: "특별행정구 신개발 계획의 과도기 단계입니다. 연구와 정치 제도는 초기 활력을 얻지만, 경제는 구조 조정의 비용을 부담합니다. 새로운 체계가 가동되는 동안 사무 및 소비재 부문이 일시적으로 혼란을 겪습니다."
 HKG_new_development_idea_buff_complete: "신개발 계획"
 HKG_new_development_idea_buff_complete_desc: "신개발 계획이 완전히 가동되고 있습니다. 연구 속도, 교육 효율, 사무 생산성이 모두 영구적으로 높아집니다. 초기 단계의 전환 비용은 회수되었으며, 홍콩의 지식 경제는 이제 진정한 최상위 수준입니다."
 hongkong_housing.1.t: "홍콩의 주택 위기"
 hongkong_housing.1.d: "부동산 가격 중앙값이 가구 소득 중앙값을 스무 배 넘게 웃돌고 있습니다. 수만 명의 홍콩인이 분할 주택과 닭장집에서 살고 있습니다. 공공주택 대기 명단은 6년을 넘었고 계속 늘고 있습니다. 정부는 위기를 인정하고 개혁 프로그램을 약속했지만, 어떤 개혁을 누구의 희생으로 할 것인가는 여전히 홍콩 정치의 핵심 쟁점입니다."
 hongkong_housing.1.a: "단호하게 행동해야 한다."
 hongkong_housing.2.t: "모든 홍콩인을 위한 주택"
 hongkong_housing.2.d: "수년간의 건설, 개혁, 정치적 싸움 끝에 주택 프로그램의 마지막 목표가 달성되었습니다. 닭장집이 비워지고 있습니다. 공공주택 세입자들은 소유자로 올라서고 있습니다. 대기 명단은 한 세대 만에 처음으로 2년 아래로 줄었습니다. 반환 이후 시대를 규정하던 위기가 마침내 우리 뒤로 사라졌습니다."
 hongkong_housing.2.a: "모든 홍콩인에게 집을."
 HKG_contract_cls_destroyer: "구축함"
 HKG_contract_cls_frigate: "호위함"
 HKG_contract_cls_submarine: "공격 잠수함"
 HKG_contract_cls_cruiser: "순양함"
 HKG_contract_cls_carrier: "항공모함"
 HKG_contract_license_tag: " §O(라이선스)§!"
 HKG_contract_empty: ""
 HKG_contract_title: "중국 해군 조달 계약"
 HKG_contract_standing_line: "§Y베이징과의 관계:§! [?HKG_contract_standing|0] / [?HKG_contract_standing_max|0]"
 HKG_contract_funds_line: "§Y계약 수입:§! $[?HKG_contract_funds|0]"
 HKG_contract_completed_line: "§Y이행한 계약:§! [?HKG_contract_completed|0]"
 HKG_contract_section_label: "진행 중인 계약 ([?HKG_contract_count|0] / [?HKG_contract_max_slots|0])"
 HKG_contract_idle: "진행 중인 계약이 없습니다. 아래에서 베이징에 조달 주문을 청원하거나, 중앙군사위원회가 주문을 내려 주기를 기다리십시오."
 HKG_contract_row0: "§Y[GetHKGContractRow0Class]§![GetHKGContractRow0License] - 남은 함선 §G[?HKG_contract_disp_quota_0|0]§!/[?HKG_contract_disp_total_0|0]척, 잔여 기한 §G[?HKG_contract_disp_deadline_0|0]§!일"
 HKG_contract_row1: "§Y[GetHKGContractRow1Class]§![GetHKGContractRow1License] - 남은 함선 §G[?HKG_contract_disp_quota_1|0]§!/[?HKG_contract_disp_total_1|0]척, 잔여 기한 §G[?HKG_contract_disp_deadline_1|0]§!일"
 HKG_contract_row2: "§Y[GetHKGContractRow2Class]§![GetHKGContractRow2License] - 남은 함선 §G[?HKG_contract_disp_quota_2|0]§!/[?HKG_contract_disp_total_2|0]척, 잔여 기한 §G[?HKG_contract_disp_deadline_2|0]§!일"
 HKG_contract_capstone_label: "홍콩 함대"
 HKG_contract_capstone_progress: "자체 항공모함 계획을 완료하고 항공모함을 배치하여 도시의 해군 유산을 획득하십시오."
 HKG_contract_capstone_done: "§G홍콩 함대가 출항합니다. 홍콩은 공인된 해군 강국입니다.§!"
 HKG_contract_capstone_progress_tt: "항공모함 중점 갈래 전체가 완료되고 홍콩이 항공모함을 건조했거나 보유하면 발동합니다. §Y홍콩의 해군력§! 국가 정신을 부여합니다."
 HKG_contract_capstone_done_tt: "최종 목표를 달성했습니다. §Y홍콩의 해군력§! 국가 정신이 활성화되었으며 더 나은 계약 조건을 협상할 수 있습니다."
 HKG_naval_contracts_category: "해군 조달 계약"
 HKG_contract_solicit_contract: "베이징에 계약 청원"
 HKG_contract_solicit_contract_desc: "중앙군사위원회에 접촉하여 새로운 군함 조달 주문을 요청합니다. 최대 세 건의 계약을 동시에 진행할 수 있으며, 더 많이 맡을수록 베이징은 각 계약에 더 긴 기한을 허용합니다. 계약의 함급과 보상은 우리의 관계에 따라 달라집니다."
 HKG_contract_deliver_destroyer: "구축함 인도"
 HKG_contract_deliver_destroyer_desc: "완성된 구축함 한 척을 중국 인민해방군 해군에 이전합니다. 가장 시급한 구축함 계약에 반영됩니다. 해당 계약의 할당량이 채워질 때까지 반복합니다."
 HKG_contract_deliver_frigate: "호위함 인도"
 HKG_contract_deliver_frigate_desc: "완성된 호위함 한 척을 중국 인민해방군 해군에 이전합니다. 가장 시급한 호위함 계약에 반영됩니다. 해당 계약의 할당량이 채워질 때까지 반복합니다."
 HKG_contract_deliver_submarine: "잠수함 인도"
 HKG_contract_deliver_submarine_desc: "완성된 공격 잠수함 한 척을 중국 인민해방군 해군에 이전합니다. 가장 시급한 잠수함 계약에 반영됩니다."
 HKG_contract_deliver_cruiser: "순양함 인도"
 HKG_contract_deliver_cruiser_desc: "완성된 순양함 한 척을 중국 인민해방군 해군에 이전합니다. 가장 시급한 순양함 계약에 반영됩니다."
 HKG_contract_deliver_carrier: "항공모함 인도"
 HKG_contract_deliver_carrier_desc: "완성된 항공모함을 중국 인민해방군 해군에 이전하고 항공모함 계약을 이행합니다."
 HKG_contract_negotiate_terms: "조달 조건 재협상"
 HKG_contract_negotiate_terms_desc: "홍콩 함대가 창설되면서 홍콩의 조선소는 존중을 받습니다. 앞으로의 모든 계약에서 더 많은 대금과 더 긴 기한을 베이징에 요구합니다."
 HKG_contract_need_destroyer_tt: "인도하려면 해군에 구축함이 최소 한 척 있어야 합니다"
 HKG_contract_need_frigate_tt: "인도하려면 해군에 호위함이 최소 한 척 있어야 합니다"
 HKG_contract_need_submarine_tt: "인도하려면 해군에 공격 잠수함이 최소 한 척 있어야 합니다"
 HKG_contract_need_cruiser_tt: "인도하려면 해군에 순양함이 최소 한 척 있어야 합니다"
 HKG_contract_need_carrier_tt: "인도하려면 해군에 항공모함이 있어야 합니다"
 HKG_contract_slots_free_tt: "비어 있는 계약 슬롯이 있습니다 (동시에 최대 세 건의 계약을 진행할 수 있음)"
 HKG_contract_modules_tt: "우리 조선소가 모든 핵심 군함 모듈(엔진, 주포, 미사일, 어뢰, 소나, 레이더)의 최소 1단계를 연구했습니다"
 HKG_contract_tt_unlock: "§Y중국 해군 조달 계약§! 체계를 잠금 해제합니다. 국고 수입, 정치력, 산업 성장을 대가로 베이징을 위해 군함을 건조합니다."
 HKG_contract_tt_solicit: "중앙군사위원회가 며칠 안에 조달 제안으로 응답할 것입니다."
 HKG_contract_tt_accept_advance: "계약 체결 시 선금 §G$[?HKG_contract_offer_advance|0]§!이 국고에 입금되고 인력 §G1000§!이 지급됩니다."
 HKG_contract_tt_accept_license: "베이징이 검증된 [GetHKGContractOfferClass] 설계 중 하나에 대해 §O생산 라이선스§!를 부여하며, 이를 우리 조선소에서 직접 건조할 수 있습니다. §Y참고: 이는 검증된 현역 설계이며 인민해방군 해군의 최신 설계가 아닙니다.§!"
 HKG_contract_tt_accept_onfulfil: "전체 주문을 인도하면 잔금이 국고에 입금되고, 정치력 §G[?HKG_contract_offer_pp|0]§!과 산업 생산성 증가가 부여되며, 한시적인 조선소 수입 보너스가 시작됩니다."
 HKG_contract_tt_decline: "제안이 소멸합니다. 불이익은 없으며, 베이징이 시간이 지나 다른 제안을 할 수 있습니다."
 HKG_contract_tt_deliver: "함선 한 척을 중국 인민해방군 해군에 이전하며, 이 함급의 가장 시급한 계약에 반영됩니다.\n§Y함선은 예비 함대에 있어야 합니다. 임무 부대에 배정된 함선은 인도할 수 없습니다. 먼저 예비 함대로 옮기십시오.§!"
 HKG_contract_tt_deliver_reward: "계약의 전체 할당량을 인도하면 잔금이 국고에 입금되고 정치력, 생산성, 조선소 수입 보너스가 부여됩니다."
 HKG_contract_tt_negotiate: "앞으로의 모든 계약은 대금이 §G25%§! 늘어나고 기한이 §G50%§! 길어집니다."
 HKG_contract.1.t: "베이징의 의뢰"
 HKG_contract.1.d_normal: "베이징의 중앙군사위원회가 우리 조선소에 조달 주문을 제안해 왔습니다.\n\n§Y주문:§! [?HKG_contract_offer_quota|0] x [GetHKGContractOfferClass]\n§Y기한:§! [?HKG_contract_offer_deadline|0]일\n§Y대금:§! $[?HKG_contract_offer_funds|0] - $[?HKG_contract_offer_advance|0]과 §G1000§! 인력은 계약 체결 시 지급, 나머지는 인도 시 지급\n§Y완료 시:§! 정치력 [?HKG_contract_offer_pp|0], 지속적인 생산성 증가, 한시적인 조선소 수입 보너스\n\n선박은 우리 조선소에서 건조하여 중국 인민해방군 해군에 이전해야 합니다. 기한을 넘기면 본토와의 관계가 악화됩니다."
 HKG_contract.1.d_license: "베이징의 중앙군사위원회가 §O라이선스 계약§!을 제안합니다. 중국 인민해방군 해군이 검증된 설계 중 하나를 공유하여 우리 조선소가 라이선스 생산으로 건조하게 됩니다.\n\n§Y라이선스 설계:§! [?HKG_contract_offer_quota|0] x [GetHKGContractOfferClass]\n§Y기한:§! [?HKG_contract_offer_deadline|0]일\n§Y대금:§! $[?HKG_contract_offer_funds|0] - $[?HKG_contract_offer_advance|0]과 §G1000§! 인력은 계약 체결 시 지급, 나머지는 인도 시 지급\n§Y완료 시:§! 정치력 [?HKG_contract_offer_pp|0], 지속적인 생산성 증가, 한시적인 조선소 수입 보너스\n\n수락하면 생산 라이선스가 부여되어 베이징의 설계를 직접 건조할 수 있습니다. §Y참고: 베이징이 공유하는 것은 검증된 현역 설계이며 최신 군함이 아닙니다.§! 기한을 넘기면 본토와의 관계가 악화됩니다."
 HKG_contract.1.a: "의뢰를 수락한다"
 HKG_contract.1.b: "거절한다 - 우리 조선소는 준비되지 않았다"
 HKG_contract.2.t: "계약 이행 완료"
 HKG_contract.2.d: "주문의 마지막 선박이 중국 인민해방군 해군에 인도되었습니다. 베이징은 만족합니다. §Y$[?HKG_contract_last_payment|0]§!의 최종 대금이 국고에 입금되었고, 정치 자본이 풀렸으며, 우리 조선소는 명성을 얻었습니다. 본토와의 관계가 개선되었습니다."
 HKG_contract.2.a: "홍콩이 함대를 건조한다"
 HKG_contract.3.t: "계약 기한 초과"
 HKG_contract.3.d: "주문이 이행되지 않은 채 계약 기한이 지났습니다. 중앙군사위원회는 홍콩이 약속을 지키지 못한 것에 주목했습니다. 베이징의 불쾌감이 이제 우리 조선소에 부담으로 작용하며, 본토와의 관계가 악화되었습니다."
 HKG_contract.3.a: "유감스러운 차질이다"
 HKG_contract.50.t: "홍콩 함대"
 HKG_contract.50.d: "하청업체에서 일류 조선 국가로 도약한 홍콩의 조선소는 자체 항공모함 계획을 완료하고 항공모함을 바다에 띄웠습니다. 베이징을 위한 조달 계약으로 시작된 일이 누구에게도 종속되지 않는 조선 산업으로 성장했습니다. 홍콩 함대가 탄생했으며, 이로써 홍콩은 해군 강국의 반열에 오릅니다."
 HKG_contract.50.a: "도시가 출항한다"
 HKG_contract_dockyard_revenue: "조달 배당"
 HKG_contract_dockyard_revenue_desc: "베이징을 위한 이행된 계약은 홍콩의 조선소를 분주하고 수익성 있게 유지합니다. 주문 장부가 가득 차 있는 동안 해군 건조는 꾸준한 수입을 가져옵니다."
 HKG_contract_beijing_displeasure: "베이징의 불쾌감"
 HKG_contract_beijing_displeasure_desc: "홍콩은 계약된 주문을 제때 인도하지 못했습니다. 중앙군사위원회는 도시의 조선소에 대한 신뢰를 잃었으며, 그 정치적 비용은 행정부 전반에서 체감됩니다."
 HKG_contract_naval_power: "홍콩의 해군력"
 HKG_contract_naval_power_desc: "홍콩의 조선소는 자체 항공모함을 건조하여 아시아의 어느 조선소에도 뒤지지 않음을 증명했습니다. 도시의 해군 산업은 이제 영구적인 전략 자산입니다."
 HKG_carrier_home: "홍콩을 위한 항공모함"
 HKG_carrier_home_desc: "자체 항공모함 건조는 도시가 시도한 가장 야심찬 사업입니다. 그것은 건조대와 건선거, 그리고 끝까지 해내겠다는 정치적 의지에서 시작됩니다."
 HKG_carrier_construction: "선체 기공"
 HKG_carrier_construction_desc: "동방해양조선그룹이 항공모함 선체 기공에 들어갑니다. 이 작업에는 홍콩이 내줄 수 있는 모든 조선소와 용접공이 투입됩니다."
 HKG_carrier_construction2: "항공모함 의장"
 HKG_carrier_construction2_desc: "선체가 완성되면서 항공모함은 의장 단계로 넘어갑니다. 동력 장치, 지휘 구역, 함교 상부 구조물이 안벽에서 설치됩니다."
 HKG_carrier_modules: "항공모함 체계 통합"
 HKG_carrier_modules_desc: "사출기, 착함 제동 장치, 피해 통제 체계 등 현대적인 항공모함 모듈이 설계에 통합되며, 어렵게 얻은 해군 경험이 활용됩니다."
 HKG_flight_deck_limitations: "비행 갑판 한계 극복"
 HKG_flight_deck_limitations_desc: "홍콩의 첫 비행 갑판은 서방 기준으로는 비좁습니다. 기술자들은 쓸 만한 속도로 항공기를 발진 및 회수할 수 있도록 갑판 배치를 다시 설계합니다."
 HKG_carrier_special_airwing: "항공모함 항공단 훈련"
 HKG_carrier_special_airwing_desc: "항공모함은 그곳에서 비행하는 조종사만큼만 유능합니다. 홍콩은 갑판 작전 훈련을 받은 전담 해군 항공단에 투자합니다."
 HKG_carrier_defensive_weapons: "항공모함 자체 방어 체계"
 HKG_carrier_defensive_weapons_desc: "근접 방어 무기 체계, 점 방어 미사일, 전자전 대응 장비를 장착하여 항공모함이 호위함에만 전적으로 의존하지 않고도 생존할 수 있게 합니다."
 HKG_carrier_logistics: "항공모함 지원 기반시설"
 HKG_carrier_logistics_desc: "항공모함에는 그에 걸맞은 모항이 필요합니다. 심해 선석, 탄약고, 그리고 해상 작전을 유지할 병참 지원 체계입니다."
 HKG_expanded_shipyards: "조선소 확장"
 HKG_expanded_shipyards_desc: "홍콩의 조선소는 한계까지 가동됩니다. 새로운 건조대와 건선거는 군함을 건조하고 수리하는 도시의 역량을 확대합니다."
 HKG_expanded_trade_capacity: "무역 수용력 확장"
 HKG_expanded_trade_capacity_desc: "세계 굴지의 중계 무역항인 홍콩은 항구를 통한 물동량을 계속 유지하는 데 필요한 항만 및 산업 수용력에 투자합니다."
 HKG_expanded_searoutes: "해상 항로 확보"
 HKG_expanded_searoutes_desc: "홍콩의 번영은 개방된 해상 항로에 달려 있습니다. 행정부는 항로의 안전을 지키기 위해 인접한 해양 국가들과의 무역 관계를 심화합니다."
 HKG_expanded_inland_routes: "내륙 교통로 확장"
 HKG_expanded_inland_routes_desc: "홍콩은 항구를 넘어 본토와 연결되고 산업을 뒷받침하는 철도와 도로망을 강화합니다."
 HKG_offshore_industry: "해상 산업 개발"
 HKG_offshore_industry_desc: "홍콩의 토지는 희소하고 값이 비쌉니다. 도시는 새로운 산업 단지를 위한 공간을 마련하기 위해 간척지와 해상 부지로 눈을 돌립니다."
 HKG_offshore_industry2: "해상 산업 확장"
 HKG_offshore_industry2_desc: "해상 산업 계획이 그 가치를 입증했습니다. 추가적인 간척과 건설로 홍콩의 제조업 기반이 바다 건너로 뻗어 나갑니다."
 HKG_housing_policy_modifier: "주택 정책"
 HKG_housing_policy_modifier_desc: "홍콩의 주택 관련 결정들이 누적된 무게는 건설, 공공 재정, 그리고 주민들의 인내심 전반에서 체감됩니다. 주택 계획의 각 단계는 이 수치들을 좋게든 나쁘게든 움직입니다."
 HKG_small_house_policy: "소형 주택 정책 개혁"
 HKG_small_house_policy_desc: "식민지 시대의 소형 주택 정책은 신계 원주민 마을 주민에게 조상 대대로 내려온 땅에 저층 주택을 지을 권리를 부여합니다. 이를 개혁하면 고밀도 개발을 위한 광대한 토지가 확보되지만, 농촌 기득권층은 세습된 특권에 대한 어떤 변화도 저항할 것입니다."
 HKG_brownfield_consolidation: "브라운필드 통합"
 HKG_brownfield_consolidation_desc: "신계의 수백 헥타르가 노천 적치장, 폐차장, 컨테이너 야적장으로 쓰이고 있습니다. 이러한 브라운필드 부지를 다층 시설로 통합하면 간척선 한 척 없이도 그 아래 토지를 주택용으로 확보할 수 있습니다."
 HKG_revitalise_private_market: "민간 시장 활성화"
 HKG_revitalise_private_market_desc: "공공 경쟁이 사라지자 정부는 개발업자에게 눈을 돌립니다. 승인 간소화, 용적률 완화, 세제 혜택으로 민간 주택이 더 빨리 시장에 나오도록 유도합니다."
 HKG_relax_mortgage_rules: "주택담보대출 규정 완화"
 HKG_relax_mortgage_rules_desc: "금융관리국이 담보인정비율과 스트레스 테스트 기준을 완화합니다. 생애 첫 구매자는 마침내 계약금 장벽을 넘을 수 있지만, 비판자들은 가계 대차대조표에 쌓이는 레버리지를 경고합니다."
 HKG_vacancy_tax: "공실세 부과"
 HKG_vacancy_tax_desc: "팔리지 않고 입주도 되지 않은 신축 주택에 대한 징벌적 부과금입니다. 개발업자는 더 이상 준공된 주택을 조금씩 시장에 풀어 가격을 높게 유지할 수 없으며, 주택의 투기적 비축은 끝납니다."
 HKG_light_public_housing: "경량 공공주택"
 HKG_light_public_housing_desc: "대기 명단에 발이 묶인 가구를 위한 임시방편으로 놀고 있는 정부 토지에 지은 조립식 모듈형 단지입니다. 저렴하고 빠르게 세울 수 있어, 주택청이 영구 주택을 짓는 데 필요한 시간을 벌어 줍니다."
 HKG_tenancy_control: "분할 주택 규제"
 HKG_tenancy_control_desc: "악명 높은 도시의 분할 주택에 임대료 상한, 서면 임대차 계약 의무, 최소 기준이 부과됩니다. 집주인은 자유로운 재량을 잃고, 칸막이 방에 갇힌 수만 명은 어느 정도의 보호를 얻습니다."
 HKG_starter_homes_scheme: "신혼·초년생 주택 제도"
 HKG_starter_homes_scheme_desc: "공공주택과 민간 시장 모두에서 밀려난 젊은 전문직을 겨냥한 새로운 소유 단계입니다. 시세 이하로 판매되고 전매 제한이 따르는 이 제도는 부동산 사다리의 첫 번째 칸을 복원합니다."
 HKG_artificial_islands: "인공섬 계획"
 HKG_artificial_islands_desc: "수십만 명을 수용하고 새로운 대도시 구역의 기반이 되도록 구상된, 중앙 해역의 대규모 인공섬 계획입니다. 비용은 수천억에 달하고 환경적 반대도 거세지만, 가용 토지 확보의 이점은 견줄 데가 없습니다."
 HKG_northern_metropolis: "북부 도회지"
 HKG_northern_metropolis_desc: "선전과 맞닿은 신계를 위한 대대적인 개발 청사진으로, 홍콩을 대만구와 엮습니다. 북부 접경 지대 전역에 신도시, 철도 연결, 혁신 벨트가 계획됩니다."
 HKG_country_park_periphery: "교외 공원 주변부 개발"
 HKG_country_park_periphery_desc: "보호 대상인 교외 공원의 생태적 가치가 가장 낮은 가장자리가 건설에 개방됩니다. 환경 보호론자들은 이 선례에 경악하지만, 정부는 주택 위기 속에서 그 땅을 놀리기엔 너무 귀중하다고 주장합니다."
 HKG_redevelop_old_estates: "노후 단지 재개발"
 HKG_redevelop_old_estates_desc: "호황기에 지어져 이제 낡아 가는 가장 오래된 공공 단지가 철거되고 현대적 밀도로 재건축됩니다. 주민들은 이주하여 재정착하며, 같은 부지에서 훨씬 더 많은 주택이 나옵니다."
 HKG_abolish_subdivided_flats: "분할 주택 폐지"
 HKG_abolish_subdivided_flats_desc: "마침내 충분한 신규 주택이 공급되자 정부는 한 세대 동안 도시의 수치였던 칸막이 방과 닭장집을 불법화하는 데 나섭니다. 칸막이 공동주택의 시대가 막을 내립니다."
 HKG_urban_renewal_push: "도시재생청 권한 강화"
 HKG_urban_renewal_push_desc: "도시재생청은 쇠락한 지구를 정비하고 재건하기 위해 확대된 강제 수용 권한과 더 큰 자금을 부여받습니다. 구룡 구시가지와 항구 일대가 블록 단위로 다시 만들어집니다."
 HKG_smart_city_housing: "스마트시티 주택"
 HKG_smart_city_housing_desc: "새 단지는 통합 교통, 지역 냉방, 디지털 행정 등을 기초부터 갖춥니다. 홍콩의 주택 재고는 대만구의 스마트시티 포부를 보여 주는 쇼케이스가 됩니다."
 HKG_housing_for_all: "모든 홍콩인에게 집을"
 HKG_housing_for_all_desc: "수십 년간 이어진 위기가 끝났음이 선포됩니다. 대기 명단은 해소되었고, 분할 주택은 사라졌으며, 소유는 다시 평범한 가정의 손이 닿는 곳에 있습니다. 임대 생활을 체념하며 자란 세대도 마침내 자기 집을 꿈꿀 수 있습니다."
 HKG_naval_contracts_category_desc: "베이징을 위해 군함을 건조하고 기한 내에 인도하여 본토와의 관계를 높이십시오.\n§Y함선을 인도하려면 예비 함대에 있어야 합니다. 임무 부대에 배정된 함선은 인도할 수 없습니다. 먼저 예비 함대로 옮기십시오.§!"
 HKG_contract_acquire_pearl_river: "주강 삼각주 청원"
 HKG_contract_acquire_pearl_river_desc: "홍콩의 조선소는 베이징에 충실히 봉사하여 본토의 전적인 신뢰를 얻었습니다. 그 관계를 바탕으로 중앙군사위원회에 주강 삼각주를 양도하도록 요청하여 도시의 산업 기반을 두 배로 늘립니다."
 HKG_contract_max_standing_tt: "본토와의 관계가 최대치여야 합니다"
 HKG_contract_pearl_river_accept_tt: "베이징이 주강 삼각주를 홍콩에 양도합니다"
 HKG_contract_yard_slack_tt: "우리 조선소가 계약을 하나 더 맡고도 기한 내에 인도할 여력이 있습니다"
 HKG_contract.20.t: "홍콩의 청원"
 HKG_contract.20.d: "홍콩은 우리 함대를 차질 없이 건조해 왔고, 이제 자신들만의 보상을 요구하고 있습니다. 주강 삼각주를 홍콩의 관할 아래 양도해 달라는 것입니다. 남부의 조선소들이 도시의 산업을 뒷받침하게 되고, 충성스러운 하청업체가 지역 강자가 될 것입니다. 자금은 이미 테이블 위에 놓여 있습니다."
 HKG_contract.20.a: "주강 삼각주를 양도한다"
 HKG_contract.20.b: "본토를 쪼개 줄 수는 없다"
 HKG_contract.21.t: "돌아오는 삼각주"
 HKG_contract.21.d: "베이징이 동의했습니다. 주강 삼각주는 이제 홍콩의 관할 아래 있으며, 공장과 조선대는 도시의 경제에 편입되었습니다. 홍콩은 더 이상 혼잡한 하나의 섬이 아니라 남부 산업 지대의 심장입니다."
 HKG_contract.21.a: "산업 강국이 떠오른다"
 HKG_contract.22.t: "베이징의 거절"
 HKG_contract.22.d: "중앙군사위원회는 주강 삼각주의 양도를 거부했습니다. 본토의 영토 보전은 조선소가 아무리 충성스럽더라도 팔 수 있는 것이 아닙니다. 우리가 낸 대금은 반환되었습니다."
 HKG_contract.22.a: "때가 되면 다시 요청하겠다"
 HKG_contract.30.t: "인도 실패"
 HKG_contract.30.d: "인도된 함선이 없습니다. 인도 대상으로 선택된 선박이 임무 부대에 배정되어 있으며, 기함은 이전할 수 없습니다.\n§Y함선을 예비 함대로 옮긴 다음 인도 결정을 다시 사용하십시오.§! 계약에는 반영되지 않았습니다."
 HKG_contract.30.a: "예비 함대로 옮기고 다시 시도한다"
 HKG_contract_resource_access: "본토 보급선"
 HKG_contract_resource_access_desc: "진행 중인 해군 조달 계약은 본토 공급망에 대한 우대 접근을 열어 줍니다. 주문 장부가 가득 차 있는 동안 베이징은 도시의 조선소에 원자재를 통상 비용의 일부만 받고 공급합니다."
 HKG_contract_resource_access_tt: "§G계약이 진행되는 동안 중국에서 수입하는 자원이 훨씬 저렴해집니다.§!"
 HKG_contract_shipbuilding_legacy: "조선 유산"
 HKG_contract_shipbuilding_legacy_desc: "본토에 인도된 모든 군함은 홍콩의 조선소를 단련시킵니다. 완료된 주문마다 해군 조선소 생산량에 영구적으로 1%가 추가됩니다."
 HKG_mainland_resource_supply: "본토 자원 공급"
 HKG_mainland_resource_supply_desc: "베이징은 도시의 조선소가 해군 계약을 계속 수행할 수 있도록 본토의 석유, 강철, 경금속, 귀금속, 복합재, 마이크로칩을 돌려 보냅니다. 홍콩은 이 중 어느 것도 스스로 거의 생산하지 못하므로, 보장된 공급이야말로 본토를 위한 군함 건조를 가능하게 합니다. 공급은 계약이 진행 중인 동안에만 유지됩니다."
 HKG_mainland_resource_supply_tt: "§Y이 자원은 중국의 자체 비축분에서 직접 가져오며, 계약이 진행 중인 동안에만 적용됩니다.§!"
 CHI_hong_kong_resource_drain: "홍콩을 위한 자원"
 CHI_hong_kong_resource_drain_desc: "홍콩의 조선소가 본토 계약을 계속 수행할 수 있도록 석유, 강철, 경금속, 귀금속, 복합재, 마이크로칩이 남쪽으로 보내집니다. 전용된 생산량은 더 이상 본토 자체 산업에 사용할 수 없습니다."
 CHI_hong_kong_resource_drain_tt: "§R이 자원은 홍콩의 계약이 진행되는 동안 홍콩으로 전용됩니다.§!"
 HKG_support_the_business: "기업 부문 지원"
 HKG_support_the_business_desc: "세금 감면, 규제 완화, 저금리 신용이 도시의 자본을 곧바로 공장으로 흘려보냅니다. 생산량은 급증하지만, 이러한 퍼주기는 예산에 부담을 주고 정치적 반발을 삽니다."
 legco_motion_reform_status_quo: "선거 현상 유지"
 legco_motion_reform_gradual: "점진적이고 질서 있는 선거 개혁"
 legco_motion_reform_universal: "보통선거"
 HKG_china_dominant_influence_tt: "§Y[CHI.GetNameWithFlag]§!은(는) [ROOT.GetNameWithFlag]에서 80%를 넘는 영향력을 가진 최대 영향력 행사국입니다"
 hongkong.17.t: "연락판공실의 설립"
 hongkong.17.desc: "신화통신 홍콩지사가 뉴스 외 업무를 새로 설립된 중앙인민정부 연락판공실에 넘겼습니다. 이 기구는 이 영토에서 베이징의 대표 역할을 넘겨받고, 중국 공산당 홍콩공작위원회를 계속 수용합니다. 관리들은 이를 이름이 둘인 하나의 기관이라고 설명합니다."
 hongkong.17.a: "베이징의 홍콩 대리인"
 hongkong.18.t: "진보동맹을 흡수한 DAB"
 hongkong.18.desc: "홍콩 발전을 위한 민주 동맹이 친기업 성향의 홍콩진보동맹과 합당했습니다. 확대된 정당은 홍콩 발전과 진보를 위한 민주 동맹이라는 이름을 채택하고 약칭 DAB는 유지합니다. 이번 합당으로 풀뿌리 기반에 친기업 계파가 더해지며 친베이징 진영이 강화됩니다."
 hongkong.18.a: "더 커졌지만 여전히 DAB"
 hongkong.19.t: "법률가들의 새 정당"
 hongkong.19.desc: "기본법 45조 관심그룹 출신 법정 변호사와 법조인들이 시빅당을 출범시켰습니다. 신당은 보통선거, 법치, 시민적 자유를 내세웁니다. 기존 민주파 정당으로부터 충분한 대변을 받지 못한다고 느끼는 중산층 전문직을 대변하는 것이 목표입니다."
 hongkong.19.a: "법치에 새로운 옹호자가 생겼다"
 hongkong.20.t: "민주당에 합쳐진 전선"
 hongkong.20.desc: "전선의 다수가 민주당에 합류하여, 에밀리 라우가 이끌던 급진 범민주파 단체의 독자적 존재가 끝났습니다. 옛 당원들은 더 강한 민주주의 요구를 더 큰 정당 안으로 가져갑니다. 이제 사회민주연선이 민주 진영의 주된 급진 목소리로 남게 됩니다."
 hongkong.20.a: "급진파가 재편된다"
 hongkong.21.t: "자신의 정당을 출범시킨 레지나 입"
 hongkong.21.desc: "전 보안국장 레지나 입이 신민당을 창당했습니다. 신민당은 법과 질서, 국가보안 입법, 베이징에 대한 충성을 내세우며 중산층 전문직 유권자를 겨냥합니다. 이 당은 친체제 진영 안에서 DAB와 지지를 놓고 경쟁할 생각입니다."
 hongkong.21.a: "안보를 위한 새 목소리"
 hongkong.22.t: "조직화하는 본토주의자들"
 hongkong.22.desc: "웡영탓이 홍콩의 정체성을 지키고 본토 이민과 관광을 제한하자고 주장하는 본토주의 단체 시빅 패션을 창립했습니다. 이 단체는 대결적인 거리 운동과 온라인 동원을 선호합니다. 범민주파를 너무 약하다고 공격하며 베이징의 영향력을 거부합니다."
 hongkong.22.a: "홍콩이 먼저다"
 hongkong.23.t: "제3의 길 제안"
 hongkong.23.desc: "시빅당을 떠난 법정 변호사 로니 통이 민주의 길을 창립했습니다. 이 단체는 친베이징 진영과 범민주파 사이의 제3의 길을 제시합니다. 베이징과의 건설적 관여와 기본법 안에서의 타협을 주장합니다."
 hongkong.23.a: "어느 진영도 아니다"
 hongkong.24.t: "제3의 길을 창당한 틱 치유엔"
 hongkong.24.desc: "틱 치유엔이 민주당을 탈당한 뒤 제3의 길을 창당했습니다. 이 신당은 체제 기득권과 민주 진영 사이의 온건한 제3의 노선을 자처합니다. 민생 문제와 베이징과의 실용적 관여에 집중합니다."
 hongkong.24.a: "제3의 노선"
 hongkong.25.t: "해산하는 시빅 패션"
 hongkong.25.desc: "시빅 패션의 의장 청충타이가 후보 자격 심사로 입법회에서 자격을 박탈당한 뒤 시빅 패션이 해산했습니다. 이 단체는 새로운 정치 여건에서는 더 이상 활동할 수 없다고 밝혔습니다. 본토주의 진영은 가장 대표적인 조직을 잃었습니다."
 hongkong.25.a: "본토주의자들이 목소리를 잃는다"
 hongkong.26.t: "해산된 시빅당"
 hongkong.26.desc: "시빅당 임시 전체 회의가 당 해산을 의결했습니다. 당원들은 달라진 정치 환경과 지도부에 대한 압박을 이유로 들었습니다. 법치를 수호하기 위해 법정 변호사들이 세운 정당이 사라집니다."
 hongkong.26.a: "법률가들이 사무실 문을 닫는다"
 hongkong.27.t: "막을 내리는 사회민주연선"
 hongkong.27.desc: "사회민주연선이 엄청난 정치적 압박을 이유로 해산을 발표했습니다. 이 당은 오랫동안 거리 시위와 입법 필리버스터로 알려져 왔습니다. 이 당이 떠나면서 급진 민주 진영에는 조직된 정당이 남지 않게 됩니다."
 hongkong.27.a: "거리 시위가 끝난다"
 hongkong.28.t: "연구소로 전환한 PoD"
 hongkong.28.desc: "민주의 길이 이름을 PoD 연구소로 바꾸고 정책 싱크탱크로 재편했습니다. 이 단체는 선거에 나서기보다 통치와 본토와의 관계 연구에 집중합니다. 창립자의 제3의 길 관점은 유지합니다."
 hongkong.28.a: "정치가 아닌 정책"
 hongkong.29.t: "해산하는 민주당"
 hongkong.29.desc: "민주당 당원들이 당을 해산하고 청산 절차에 들어가기로 표결했습니다. 이 표결로 홍콩에서 가장 크고 가장 온건한 민주화 지지 정당이 막을 내립니다. 지역구 조직망과 베이징으로 가는 가교 역할도 함께 사라집니다."
 hongkong.29.a: "마지막 원로 세력"