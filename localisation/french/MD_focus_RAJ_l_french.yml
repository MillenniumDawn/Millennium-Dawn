 border_war_training_failure.2.d: "Une collision lors d'un entraînement interarmes a endommagé du matériel et blessé plusieurs soldats."
 border_war_training_failure.2.a: "Suspendre l'exercice"
 border_war_tension_failure.1.t: "Action à la frontière repoussée"
 border_war_tension_failure.1.d: "Les forces rivales ont répondu à la dernière provocation par un tir précis, faisant des morts et perturbant les préparatifs locaux."
 border_war_tension_failure.1.a: "Tirez en arrière"
 border_war_operation_blocked.1.t: "Opération annulée"
 border_war_operation_blocked.1.d: "La propriété, le contrôle, la présence de troupes ou les conditions diplomatiques ont changé avant la fin des préparatifs. L'opération a été annulée sans dépenser de progression."
 border_war_operation_blocked.1.a: "Compris"
 border_war_outcome.1.t: "Poussée réussie"
 border_war_outcome.1.d: "Nos forces ont prévalu dans le dernier accrochage et ont gagné de l'élan vers leur objectif local."
 border_war_outcome.1.a: "Consolider la position"
 border_war_outcome.2.t: "Opération repoussée"
 border_war_outcome.2.d: "Les forces rivales ont repoussé l'attaque et réduit notre élan autour de l'État contesté."
 border_war_outcome.2.a: "Revoir le plan"
 border_war_outcome.3.t: "Enlisement à la frontière"
 border_war_outcome.3.d: "L'accrochage s'est achevé sans résultat décisif, nous coûtant une part de notre élan local."
 border_war_outcome.3.a: "Tenir la ligne"
 pak_raj_border_claim.1.t: "Une revendication territoriale"
 pak_raj_border_claim.1.d_420: "[FROM.GetNameDefCap] a usé de victoires locales répétées pour exiger l'Azad Cachemire. Céder transférerait l'État et baisserait la tension. Refuser ouvrirait une crise plus large."
 pak_raj_border_claim.1.d_427: "[FROM.GetNameDefCap] a usé de victoires locales répétées pour exiger le Jammu-et-Cachemire. Céder transférerait l'État et baisserait la tension. Refuser ouvrirait une crise plus large."
 pak_raj_border_claim.1.d_429: "[FROM.GetNameDefCap] a usé de victoires locales répétées pour exiger le Pendjab oriental. Céder transférerait l'État et baisserait la tension. Refuser ouvrirait une crise plus large."
 pak_raj_border_claim.1.d_563: "[FROM.GetNameDefCap] a usé de victoires locales répétées pour exiger le Pendjab central. Céder transférerait l'État et baisserait la tension. Refuser ouvrirait une crise plus large."
