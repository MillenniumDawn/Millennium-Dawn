 dedicated_air_force_manufacturing_hidden_spirit: "공군 생산 헌신"
 nsb_AA_upgrade_1: "2세대 배터리 냉각수"
 nsb_AA_upgrade_1_desc: "보온이 가능한 배터리를 이용하여, 비행에 대비한 작전에 동력을 제공해줄 뿐만 아니라 미사일 수색 과정의 적외선 탐지기를 식히기 위한 아르곤 기체를 공급합니다."
 nsb_AA_upgrade_2: "3세대 적외선 및 자외선 탐지기"
 nsb_AA_upgrade_2_desc: "전자기 스펙트럼의 자외선 대역폭은 작전에 투입된 무기들을 이끄는 도구로써 사용될 수 있는 가능성이 있습니다."
 nsb_AA_upgrade_3: "냉각 자외선 시스템"
 nsb_AA_upgrade_3_desc: "Cooled infrared seekers greatly improve thermal sensitivity, allowing MANPADS and vehicle-mounted short-range AA systems to detect weaker heat signatures, maintain steadier locks, and improve resistance to simple flare countermeasures."
 nsb_AA_upgrade_4: "Indium Gallium Arsenide (InGaAs) sensors"
 nsb_AA_upgrade_4_desc: "InGaAs short-wave infrared imagers improve target contrast in low light, haze, and cluttered backgrounds, helping infantry and armored air-defense systems track drones, helicopters, and low-flying aircraft with greater reliability."
 electrification_1: "가정의 전력화 혁신"
 electrification_1_desc: "홈 인프라는 혁명적인 변화를 겪으며 전기 시대의 시작을 알립니다. 점점 더 많은 가정에서 전기 난방 시스템을 채택함에 따라 화석 연료에 대한 의존도가 낮아지는 동시에 전력망에 대한 수요도 늘어나고 있습니다."
 electrification_2: "전동 대중교통 계획"
 electrification_2_desc: "새천년이 다가오면서 전기로 구동되는 대중교통의 물결이 일고 있습니다. 도시의 거리는 전기 버스와 트램의 출현으로 더욱 조용하고 깨끗한 리듬으로 활기를 띠게 되지만, 전력망은 증가하는 수요를 감당합니다."
 electrification_3: "기전력 (Electro-Motive) 열차"
 electrification_3_desc: "철도는 디젤 전기 기관차에 작별을 고하고 완전 전기 기관차를 선호하는 변화의 국면을 예고합니다. 철도가 효율성과 지속 가능성의 상징이 되는 반면, 기차역은 높아진 전력 수요로 인해 어려움을 겪고 있습니다."
 electrification_4: "전동 여가 활동의 혁신"
 electrification_4_desc: "전기 ATV에서 배터리 구동 레저용 선박에 이르기까지 레저 활동은 상당한 변화를 겪고 있습니다. 야외 활동을 좋아하는 사람들은 스릴과 지속 가능성을 결합하고 즐거움의 탄소 배출량을 줄이는 새로운 전기 구동 레크리에이션 차량 물결을 받아들입니다."
 electrification_5: "전기 차량의 돌파구"
 electrification_5_desc: "고속도로에서는 엄청난 변화가 일어나고, 개인 교통수단에는 전기 자동차가 방향을 틀게 됩니다. 충전소 수가 급증하면서 환경이 바뀌면서 석유 의존도가 낮아지고 있지만 전력 요구 사항은 증가하고 있습니다."
 electrification_6: "전동 농기구"
 electrification_6_desc: "농업 부문은 트랙터에서 수확기에 이르기까지 전통적으로 디젤 동력을 사용하는 기계가 전기로 전환되면서 녹색 혁명을 보고 있습니다. 농장은 식량을 생산할 뿐만 아니라 청정에너지 소비의 중심지이기도 합니다."
 electrification_7: "전력 기반 중기계의 혁신"
 electrification_7_desc: "크레인, 굴착기, 불도저와 같은 전동 기계가 산업 표준이 되면서 건설 현장은 변화하고 있습니다. 디젤 엔진의 소음이 사라지면서 도시는 청정 에너지의 힘으로 조용히 성장합니다."
 electrification_8: "전동 화물 운송 해결책"
 electrification_8_desc: "전기 트럭은 화물 부문의 새로운 시대를 예고하고 있습니다. 이러한 차량이 배기가스를 줄이고 고속도로를 보다 환경 친화적으로 만들면서 물류 센터는 에너지 소비의 분주한 진원지로 진화하고 있으며 이는 전력 수요 증가에 대한 청정 운송의 균형을 반영합니다."
 electrification_9: "전동 함선을 통한 해안 경비"
 electrification_9_desc: "장거리 전기 화물선과 심지어 전기로 구동되는 레크리에이션 보트가 주목을 받음에 따라 세계의 바다는 큰 변화를 겪고 있습니다. 조용하고 배출가스 없는 항해를 통해 해양 산업은 지속 가능한 지평선을 향해 항해합니다."
 electrification_10: "공중의 전기 엔진"
 electrification_10_desc: "제트 엔진의 포효는 강력한 전기 터빈의 윙윙거리는 소리로 이어집니다. 상업용 여객기부터 개인 제트기에 이르기까지 항공 산업은 전기 추진 장치의 광범위한 채택으로 새로운 차원에 도달하여 세상의 비행 방식을 변화시키고 있습니다."
 utility_scale_battery_storage: "다목적 전력 저장소의 개발"
 utility_scale_battery_storage_desc: "세기가 바뀌면서 에너지 공급업체는 대규모 배터리 저장 솔루션을 탐색하기 시작합니다. 이러한 초기 시스템은 초보적이지만 유틸리티의 전력 저장을 최적화하고 에너지 혁명을 위한 토대를 마련하기 위한 첫 번째 단계입니다."
 utility_scale_battery_storage2: "격자 규모의 리튬이온 기술의 도약"
 utility_scale_battery_storage2_desc: "리튬 이온 기술의 발전으로 그리드 규모 애플리케이션에 더 크고 효율적인 배터리를 배포할 수 있습니다. 이러한 자산은 끊임없이 진화하는 전력망에 더 많은 유연성과 탄력성을 제공합니다."
 utility_scale_battery_storage3: "흐름 전지의 혁신"
 utility_scale_battery_storage3_desc: "플로우 배터리의 상승이 목격되었습니다. 에너지와 전력을 독립적으로 확장할 수 있는 독특한 능력이 특징인 이 제품은 방전 기간 연장과 수명주기 경제성 향상을 위해 선호되는 선택이 되었습니다."
 utility_scale_battery_storage4: "고체형 전지의 우세"
 utility_scale_battery_storage4_desc: "기술이 발전함에 따라 전고체 배터리가 스토리지의 새로운 표준으로 떠오르고 있습니다. 높은 에너지 밀도, 우수한 안전성, 수명을 제공하여 비교할 수 없는 효율성 시대를 열어갑니다."
 utility_scale_battery_storage5: "Quantum Storage Leap"
 utility_scale_battery_storage5_desc: "양자 기술의 획기적인 발전으로 배터리 저장 장치가 재정의되었습니다. 양자 효과를 활용하면 이전에는 불가능하다고 생각되었던 저장 용량과 방전 속도를 달성하여 에너지 환경을 재편하고 안정적인 전력을 보장합니다."
 utility_scale_battery_storage_tt: "Unlocks the ability (in the energy menu) to construct §YBattery Parks§! which allows us to store §Y100GWh§! of excess energy, each, for times when total generation is below total consumption, especially useful when using renewable energy."
 fuel_refining6: "연료 정제 VI"
 fuel_refining6_desc: "Advances in the refining method lead to more efficient fuel gain."
 construction9: "건설 IX"
 construction9_desc: "Digital twin construction links building models, sensors, drones, and site data into a live management system, allowing engineers to monitor progress, detect problems, and optimize construction in real time."
 excavation9: "채굴 IX"
 excavation9_desc: "Digital extraction networks link drills, haulers, crushers, sensors, and processing plants into a live operational model, allowing production plans to adjust continuously to resource quality and equipment status."
 jamming_package_escorts: "전파 방해 편대 호위"
 jamming_package_escorts_desc: "고출력 재밍 포드를 장착한 전용 호위 항공기는 적 레이더 탐지로부터 우리 항공기와 공격 패키지를 더 잘 차단하고 보호합니다."
 barcap_flights: "전투공중초계 (BARCAP) 기동"
 barcap_flights_desc: "Air Superiority and Multi-Role fighters will conduct flight patrols to provide protective barriers for additional combat operations."
 c4istar: "지휘통제장비 (C4ISTAR)"
 c4istar_desc: "첨단 AWACS 항공기를 활용하면 단 하나의 항공기로 정보 수집과 지휘 통제 작전을 모두 수행할 수 있습니다."
 forward_air_controllers: "전방항공통제관"
 forward_air_controllers_desc: "지상과 공중 양쪽의 전담 관측관들은 타격 항공기와 근접 항공 지원(CAS) 항공기를 정밀하게 유도하도록 훈련받을 것입니다."
 aerial_gunship_support: "공중 건쉽 지원"
 aerial_gunship_support_desc: "하늘이 확보되면 중화기를 장비한 공중 건십이 원하는 대로 지상 표적을 타격할 수 있습니다."
 t21st_century_modernization: "21세기에 맞춘 현대화"
 t21st_century_modernization_desc: "항공기 설계가 21세기로 접어들면서, 공군은 경쟁력을 유지하기 위해 현대화해야 합니다."
 concentrated_aircraft_design: "하나에 집중된 항공기 설계"
 concentrated_aircraft_design_desc: "단일 항공기 설계에 집중하면 더 나은 조종사를 훈련하고, 모든 임무를 수행할 수 있는 하나의 항공기를 제작할 수 있습니다."
 weapons_school: "병기 학교"
 weapons_school_desc: "전담 훈련 프로그램은 조종사들에게 대지 공격 무기 사용법을 훈련시키고, 그 지식을 소속 비행대대로 가져가도록 할 것입니다."
 expanded_combat_tactics: "교전 전술 확장"
 expanded_combat_tactics_desc: "조종사들이 실험하며 모든 임무를 비행하게 함으로써 훨씬 더 발전된 전술과 기술을 개발할 수 있을 것입니다."
 top_gun_and_red_flag: "탑건 & 레드플레그"
 top_gun_and_red_flag_desc: "조종사들에게 첫 10번째 임무를 훈련으로 부여하고, 공중 교전 훈련을 개선한다면, 그들은 현대 공중전에서 더욱 뛰어난 실력을 발휘할 수 있을 겁니다."
 multi_mission_capabilities: "다중 임무 능력"
 multi_mission_capabilities_desc: "항공기가 모든 임무를 동등하게 수행할 수 있게 만들면 조종사는 더 효율적이 되고 작전에 대한 훈련도 더 잘 받게 될 것입니다."
 dispersed_aircraft_design: "분산된 항공기 설계"
 dispersed_aircraft_design_desc: "항공기 설계를 전문화함으로써 각자의 역할에 맞게 설계된 정예 항공기를 만들 수 있습니다."
 dedicated_escort_fighters: "호위 임무를 최우선으로 하는 전투기"
 dedicated_escort_fighters_desc: "공중우세기는 타격 전투기를 목표 지점까지 호위하는 데 투입될 것입니다."
 standoff_strike_munitions: "장거리 타격 무기"
 standoff_strike_munitions_desc: "원거리 타격 무장을 사용하면 타격 항공기가 적 방공 무기의 사거리에 들어가지 않고도 더 위험한 습격을 수행할 수 있습니다."
 extended_killbox_coordination: "확장된 킬박스 (Killbox) 협조"
 extended_killbox_coordination_desc: "킬박스 개념을 더 잘 활용함으로써 CAS 항공기와 타격 항공기는 표적에 대한 노력을 더 잘 조율할 수 있게 될 것입니다."
 dynamic_strike_packages: "역학적인 종합 타격 체계"
 dynamic_strike_packages_desc: "타격 패키지 설계의 유연성은 더 다양한 임무를 수행할 수 있게 해 줄 것입니다."
 data_linked_close_air_support: "데이터 링크 근접항공지원"
 data_linked_close_air_support_desc: "데이터링크 기능을 활용하여 아군 근접 항공 지원 항공기는 표적 정보를 공유함으로써 적 표적에 대한 피해를 극대화할 수 있습니다."
 dedicated_escorts_dedicated_strikers: "헌신적인 호위, 헌신적인 공격"
 dedicated_escorts_dedicated_strikers_desc: "호위기와 타격기를 명확히 구분함으로써 조종사는 자신의 임무를 알고 작전 중 오직 그 임무만 수행하게 됩니다."
 precision_strike_packages: "정확도 중심 타격 체계"
 precision_strike_packages_desc: "수 미터 이내의 정확도를 가진 정밀 타격은 단일 표적을 정확히 타격한 뒤 다른 자산에 피해를 주지 않고 이탈할 수 있게 해 줄 것입니다."
 strategic_industry_targets: "전략 산업 목표"
 strategic_industry_targets_desc: "적의 자원을 표적으로 삼고 제조 시설을 타격함으로써, 아군 공군은 적이 장비 손실을 보충하는 능력을 제거할 것입니다."
 offensive_counter_air: "공격적인 공중 반격"
 offensive_counter_air_desc: "전투기를 적 항공 전력 파괴에 전념시킴으로써 하늘을 장악하기 시작하고, 적 표적에 대한 추가 타격을 가능하게 할 것입니다."
 total_air_superiority: "완벽한 제공권"
 total_air_superiority_desc: "완전한 제공권을 요구함으로써 적 항공기의 방해 없이 추가적인 지상 및 항공 작전을 수행할 수 있습니다."
 dead_missions: "적 방공 능력 파괴 (DEAD) 임무"
 dead_missions_desc: "타격 항공기는 적 대공 방어 체계를 직접 표적으로 하는 임무를 수행하여 해당 체계를 파괴하고, SAM이나 대공포(AAA)의 위협 없이 추가 임무를 수행할 수 있게 해 줄 것입니다."
 escorted_bomber_flights: "폭격기 호위"
 escorted_bomber_flights_desc: "전투기로 폭격기를 보호함으로써 폭격기 손실을 줄이고 표적을 타격할 시간을 더 확보해 줄 것입니다."
 fighter_sweeps: "전투기 휩쓸기"
 fighter_sweeps_desc: "폭격기를 투입하기 전에 전투기가 하늘을 쓸어 정리하여 표적까지 가는 길을 열어 줄 것입니다."
 high_altitude_fighter_escorts: "고고도 전투기 호위"
 high_altitude_fighter_escorts_desc: "폭격기와 같은 고도로 비행하는 전투기가 있으면, 적의 고고도 요격기조차 폭격기를 타격하려면 우리와 싸워야 할 것입니다."
 strike_fighter_dominance: "타격 전투기 우위"
 strike_fighter_dominance_desc: "타격 전투기는 적 영토로의 임무 수행에 핵심이 될 것입니다. 적이 우리를 따라잡지 못한다면 우리와 싸울 수 없습니다."
 close_strike_operations: "근접 타격 작전"
 close_strike_operations_desc: "근접 위험 타격 임무를 비행함으로써 가장 가까운 전투 상황에서도 전투기를 활용할 수 있습니다."
 high_efficiency_fighter_flights: "고효율 전투기 비행"
 high_efficiency_fighter_flights_desc: "신속한 회전 및 승무원 교대를 중심으로 한 훈련을 통해 전투기 비행대에서 최대 효율을 얻을 수 있습니다."
 bomber_upgrade_series: "폭격기 중심 개선"
 bomber_upgrade_series_desc: "폭격기 패키지에 이렇게 중점을 두는 만큼, 아군 폭격기는 효율을 높이기 위한 일련의 대대적인 개량이 필요합니다."
 extended_maritime_patrols: "해안 초계 확장"
 extended_maritime_patrols_desc: "해상 초계기에 더 많은 연료와 무기를 제공함으로써 아군의 해운과 해안을 더 잘 보호할 수 있습니다."
 massed_alcm_strikes: "공중발사순항미사일 (ALCM) 집중 타격"
 massed_alcm_strikes_desc: "폭격기를 발사 플랫폼으로 사용하여 대량의 순항 미사일로 적 방공망을 압도할 수 있습니다."
 alls_quiet_above: "All's Quiet Above"
 alls_quiet_above_desc: "고고도로 비행하는 스텔스 항공기를 활용하면 아군 폭격기는 탐지되기도 전에 침투했다 빠져나올 수 있습니다."
 carpet_bombing: "융단폭격"
 carpet_bombing_desc: "폭탄창을 막대한 탑재량으로 채운 아군 폭격기는 고폭탄으로 도시 전체를 평평하게 만들 것입니다."
 firebombing: "소이탄 폭격"
 firebombing_desc: "화염 폭풍에 의존하는 아군의 소이 폭격 작전은 적의 산업과 도시를 잿더미로 태울 것입니다."
 deny_the_seas: "해상 작전 거부"
 deny_the_seas_desc: "적 해군 작전에 대한 해상 교통로를 차단하면 아군 해안을 보호하고 해운을 안전하게 지킬 수 있습니다."
 anti_shipping_operations: "보급 수송 기습 작전"
 anti_shipping_operations_desc: "적 함선과 해운을 표적으로 삼으면 적이 우리를 공격하고 전쟁 기계를 보급하는 능력을 파괴할 수 있습니다."
 hammer_round_the_clock: "끊임없는 위협"
 hammer_round_the_clock_desc: "24시간 연중무휴 폭격 작전은 시간과 날씨에 관계없이 적에게 휴식을 허락하지 않을 것입니다."
 defense_of_the_homeland: "국토 방위"
 defense_of_the_homeland_desc: "공군은 아군의 하늘을 안전하게 지키고 국민과 병력을 적의 작전으로부터 보호하도록 설계되었습니다."
 reduced_supply_demands: "보급 요구 감소"
 reduced_supply_demands_desc: "효율적인 항공기를 제작하고 승무원을 잘 훈련시킴으로써 공군의 보급 요구량을 최소화할 수 있습니다."
 dedicated_air_force_manufacturing: "공군 생산 헌신"
 dedicated_air_force_manufacturing_desc: "공군이 자체 제조 수요를 직접 통제하면 항공기 설계와 생산을 가장 잘 관리하고 지휘할 수 있을 것입니다."
 fighter_top_cover: "모든 것은 전투기의 손아귀에"
 fighter_top_cover_desc: "아군 전투기는 단 하나의 목적을 위해 존재합니다. 적 폭격기가 아군 병력과 산업을 타격하지 못하게 하는 것입니다."
 simplified_aircraft_designs: "간소화된 항공기 설계"
 simplified_aircraft_designs_desc: "항공기 제작 방식을 단순화함으로써 신규 조종사를 신속하게 훈련시키고 경험을 쌓도록 도울 수 있습니다."
 heroes_of_the_nation: "Heroes of the Nation"
 heroes_of_the_nation_desc: "아군의 에이스 조종사들은 이 나라의 영웅으로서, 적의 폭격과 전투기로부터 우리를 안전하게 지켜 줍니다."
 dedicated_industry_sam_coverage: "지대공 미사일(SAM) 요격 범위에 산업 단지 포함"
 dedicated_industry_sam_coverage_desc: "산업 지역에 SAM 방어 범위를 집중 배치함으로써 폭격 임무로부터 산업을 더 잘 보호할 수 있습니다."
 integrated_air_defense_network: "통합된 방공망"
 integrated_air_defense_network_desc: "모든 탐지 및 방어 체계를 단일 네트워크로 통합하면 적군으로부터 더 강력한 방호를 얻을 수 있습니다."
 every_road_a_runway: "Every Road a Runway"
 every_road_a_runway_desc: "세심한 계획과 설계를 통해, 우리나라의 거의 모든 주요 도로는 전시에 활주로로도 사용할 수 있습니다."
 high_efficiency_scrambles: "효율적인 스크램블 (즉시 출격 대기)"
 high_efficiency_scrambles_desc: "아군 조종사들은 전체 전투기 전력을 신속하게 긴급 출격시켜 항공기를 전투에 빠르게 투입하도록 훈련받습니다."
 close_our_skies: "우리 영공을 폐쇄하라"
 close_our_skies_desc: "적이 아군 영공에서 작전하는 것조차 막을 수 있다면 공격이 시작되기도 전에 저지할 수 있습니다."
 high_speed_interceptor_designs: "고속 요격기 설계"
 high_speed_interceptor_designs_desc: "고속 요격기는 적 폭격기 비행으로부터 아군의 하늘을 방어하는 최선의 선택입니다."
 gci_management: "지상 요격 시스템 (GCI) 관제"
 gci_management_desc: "지상에서 조율되는 아군 전투기는 적의 위협에 신속하게 우선순위를 매기고 제거할 수 있습니다."
 high_risk_interceptions: "고위험 요격"
 high_risk_interceptions_desc: "더 많은 훈련과 숙련을 통해 아군 조종사들은 적 항공기를 요격하기 위해 고위험 상황에도 비행해 들어갈 수 있습니다."
 hit_and_run_strikes: "치고 빠지기 공격"
 hit_and_run_strikes_desc: "조종사에게 초저공 비행을 훈련시킴으로써 적 병력에 신속한 타격을 가해 전투 효율을 저하시킬 수 있습니다."
 naval_interdiction_missions: "해상 차단 임무"
 naval_interdiction_missions_desc: "아군 조종사들은 해안을 안전하게 지키기 위해 전투기로 적 함선과 해운에 대한 타격을 수행하도록 훈련받습니다."
 strike_fighter_training: "타격 전투기 훈련"
 strike_fighter_training_desc: "조종사를 더 발전된 방식으로 훈련시킴으로써, 기회가 생길 때마다 기회 표적을 타격하도록 가르칠 수 있습니다."
 close_support_strikes: "근접 지원 공격"
 close_support_strikes_desc: "아군 전투기는 공습을 근접 위험 거리까지 접근시켜, 근접 사격 거리의 적 병력까지 제거하도록 훈련받습니다."
 all_weather_fighters: "전천후 전투기"
 all_weather_fighters_desc: "어떤 기상 조건에서도 비행할 수 있으면 날씨에 관계없이 조종사가 임무를 수행할 수 있습니다."
 EQ_MOD_CAT_module_light_surface_power_source_category_TITLE: "경형 엔진"
 EQ_MOD_CAT_module_heavy_frigate_upgrade_category_TITLE: "중호위함 종합 개선"
 module_light_surface_early_reactor_power: "초기 경 원자로"
 module_light_surface_early_reactor_power_desc: "초기 원자로는 소형 함선에 신뢰할 수 있는 장기 항속 추진력을 제공하며 재급유가 거의 필요하지 않습니다.\n\n§G설계 힌트: 경량 원자력 추진은 높은 속력, 탁월한 최대 항속거리를 제공하며 연료 없이 운용됩니다. 전 지구적 전개에 사용되는 경량 함선에 적합하지만 건조 비용이 극단적으로 비쌉니다.§!"
 module_light_surface_mod_reactor_power: "현대 경 원자로"
 module_light_surface_mod_reactor_power_desc: "현대식 경량 원자로는 출력과 운용 효율을 높여 지속적인 고속 작전을 지원합니다.\n\n§G설계 힌트: 경량 원자력 추진은 높은 속력, 탁월한 최대 항속거리를 제공하며 연료 없이 운용됩니다. 전 지구적 전개에 사용되는 경량 함선에 적합하지만 건조 비용이 극단적으로 비쌉니다.§!"
 module_heavy_frigate_upgrade_package: "중호위함 종합 개선"
 module_heavy_frigate_upgrade_package_desc: "우리는 호위함을 건조할 수 있지만 더 무거운 함급에 대해서는 교착 상태에 놓여 있습니다. 구축함과 같은 더 무거운 함선을 준비하려면 수년 치의 물자와 투자가 필요할 것입니다. 호위함을 개량하고 강화하여 새로운 함급인 \\"중호위함\\"으로 만들면 더 무거운 함선에 맞서 더 경쟁력을 갖출 수 있습니다.\n\n§G설계 힌트: 이 모듈은 호위함을 주력함으로 분류하며 공격력, 방호력, 편성도를 크게 향상시키지만 생산 비용, 가시성, 연료 소비가 급격히 증가합니다.§!"
 TITLE_JEUNE_ECOLE: "청년학파 해군"
 TITLE_JEUNE_ECOLE_DESC: "제운 에콜(Jeune École), 즉 \\"젊은 학파\\"는 더 무겁고 둔한 적 군함에 맞서기 위해 소형이면서 중무장하고 기동성이 높은 군함에 중점을 두는 해군 교리입니다."
 a_divergence_in_doctrine: "교리의 다각화"
 a_divergence_in_doctrine_desc: "대부분의 해군은 자국 해안 너머로 전력을 투사할 수 있는 연안 해군 또는 대양 해군 교리의 원칙을 따릅니다. 더 가볍고 기민한 설계로 전환하면 우리는 노선을 달리하여 이처럼 가혹한 전투 방식에 맞설 수 있을지도 모릅니다."
 size_doesnt_matter: "크기는 상관이 없다"
 size_doesnt_matter_desc: "중요한 것은 개의 크기가 아니라 개가 지닌 투지의 크기입니다."
 juryrigged_submarines: "잠수함 임시 장비"
 juryrigged_submarines_desc: "시간을 들여 공정을 간소화하고 잠수함 부품을 임시변통으로 조립한다면, 해군 전력을 보강할 잠수함을 더 많이 생산할 수 있을지도 모릅니다."
 conscript_navy: "해군 징병"
 conscript_navy_desc: "육군을 위해 병사를 징집하는 것도 인기가 없는데 해군을 위한 징집은 더욱 그렇습니다. 그러나 병력을 채우기 위해 "
 its_how_you_use_it: "어떻게 활용하는지는 우리에게 달렸다"
 its_how_you_use_it_desc: "중요한 것은 바다의 조류를 타고 알맞은 시간에 알맞은 장소에 있는 것입니다."
 pt_boat_supremacy: "PT 보트 어뢰정의 장악"
 pt_boat_supremacy_desc: "초계정은 우리의 노력에 효과적인 전투 수단이 될 것입니다. 비록 작지만 대형 함선에 못지않게 치열하게 싸울 것입니다."
 the_new_ship_of_the_line: "새로운 함선의 생산 라인"
 the_new_ship_of_the_line_desc: "호위함의 무장과 장갑 등급을 높인다면 중호위함이라는 새로운 등급의 호위함을 만들어 낼 수 있습니다. 이는 더 큰 해군을 보유한 국가들과 맞설 수 있게 해 줄 것입니다."
 hellfire_cannons: "포를 지옥의 불덩이로"
 hellfire_cannons_desc: "우리 함선의 함포는 가능한 한 작지만 그렇다고 덜 치명적인 것은 아닙니다."
 bristling_with_firepower: "압도적인 화력"
 bristling_with_firepower_desc: "우리 함선 한 척 한 척에 안전하게 장착할 수 있는 최대한의 화력을 싣겠습니다."
 mama_and_her_chicks: "중호위함을 호위하는 초계정"
 mama_and_her_chicks_desc: "중호위함은 우리의 주력함이 되고, 초계정은 그 새끼들이 될 것입니다."
 riveted_ship_hulls: "함선 선체의 재확립"
 riveted_ship_hulls_desc: "함선 선체를 보강하고 리벳으로 접합하면 더할 나위 없이 튼튼해질 것입니다."
 zerg_rush: "'선'해전술"
 zerg_rush_desc: "함대의 함선이 많을수록 더 많이 적을 향해 쇄도하여 압도적인 수적 우위로 제압할 수 있습니다."
 too_fast_to_torpedo: "어뢰보다 빠르게"
 too_fast_to_torpedo_desc: "함선이 어뢰보다 빠르게 움직인다면 그 함선은 결코 격침될 수 없습니다."
 mad_max_the_fleet: "실을 수 있는 모든 것을 실어라"
 mad_max_the_fleet_desc: "그 장비가 이 함선을 위해 만들어진 것인지는 중요하지 않습니다. 맞기만 하면 달 것이고, 우리는 양보하지 않을 것입니다."
 frigate_go_brrrt: "모든 것에 대응하는 호위함"
 frigate_go_brrrt_desc: "모든 호위함은 바다, 육지, 하늘을 가리지 않고 다가오는 무엇이든 상대할 수 있게 될 것입니다."
 pt_sees_all: "연안 경비정이 모든 것이다"
 pt_sees_all_desc: "초계정에 더 강력한 레이더 등을 장비하면 우리 연안 근해의 모든 것을 감시할 수 있을 것입니다."
 hit_n_run: "치고 빠지기"
 hit_n_run_desc: "우리 함선은 신속하게 움직여, 적 해군 전체가 무엇에 당했는지 알기도 전에 괴멸시킬 것입니다."
 dancing_with_giants: "작은 고추가 맵다"
 dancing_with_giants_desc: "우리 함선은 비록 작지만 언제나 거인들과 어울려 춤출 수 있을 것입니다."
 the_ship_to_end_all_wars: "모든 전쟁을 끝낼 그 배"
 the_ship_to_end_all_wars_desc: "초계정은 모든 전쟁을 끝내고 우리의 지위를 정상에 굳건히 할 것입니다."
 special_forces_airborne: "공수부대"
 special_forces_airborne_desc: "1940년대와 마찬가지로 공수 보병은 다시 한번 우리 특수 부대 운용의 핵심 요소가 될 것입니다. 이 부대들은 적의 행동에 전 세계 어디서든 신속하게 대응할 수 있게 하며, 가장 필요한 곳에 정확히 병력을 투입하게 해 줄 것입니다."
 blot_out_the_sun: "해를 뒤덮어라"
 blot_out_the_sun_desc: "대규모 낙하산 부대를 운용하는 것이 나아갈 길입니다. 하늘을 우리 병사들로 가득 채우면 적은 그들을 모두 막아 낼 수 없을 것입니다."
 increase_candidate_pools: "지원 자격 확대"
 increase_candidate_pools_desc: "받아들일 수 있는 지원자의 수를 늘림으로써, 낙하산 부대를 훈련시킬 더 많은 인력을 확보할 수 있습니다."
 train_more_jumpers: "낙하 훈련 인원 확대"
 train_more_jumpers_desc: "가능한 한 많은 낙하산병을 훈련하는 것은 우리가 정한 대규모 강하 교리를 실행하는 데 핵심입니다."
 protected_transports: "수송 체계 보호"
 protected_transports_desc: "공중 수송기를 더 잘 보호하면 더 많은 낙하산병이 목표 지점까지 살아남아 강하할 수 있습니다."
 tight_space_packing: "최소 공간의 최대 인원"
 tight_space_packing_desc: "인원을 빽빽이 탑승시키고 내부 공간을 최대한 활용함으로써 더 많은 병력을 전장에 투입할 수 있습니다."
 rapid_training_pipeline: "신속한 훈련 파이프라인"
 rapid_training_pipeline_desc: "공수 병사의 훈련 과정을 가속화하면 손실을 더 빠르게 훈련하고 보충할 수 있습니다."
 silk_rain: "하늘을 낙하산으로 뒤덮어라"
 silk_rain_desc: "전투 작전 중에 대규모 병력이 뛰어내려 강하할 것입니다. 그것은 하늘에서 내리는 비단의 비가 될 것입니다."
 aggressive_mindset: "Aggressive Mindset"
 aggressive_mindset_desc: "적절한 훈련과 단련을 통해 공수 병사들을 극도로 공격적이며 전투 중 위험을 감수하려는 자세를 갖추게 만들 수 있습니다."
 airdropped_heavy_equipment: "중장비 공중 투하"
 airdropped_heavy_equipment_desc: "중장비를 공중 투하하는 방법을 찾아냄으로써, 공수 병사들이 전투에서 우위를 점하게 할 수 있습니다."
 we_need_more_airborne: "더 많은 공수 인원"
 we_need_more_airborne_desc: "성공의 열쇠는? 더 많은 낙하산병입니다. 우리는 하늘에서 적을 압도할 것입니다."
 ground_tower_jump: "고층 건물 낙하 훈련을 통한 보병의 공수부대화"
 ground_tower_jump_desc: "3주간의 훈련으로 일반 보병 병사를 낙하산병으로 탈바꿈시킬 수 있습니다."
 palitized_vehicles: "팔레트화된 차량"
 palitized_vehicles_desc: "더 많은 차량을 팔레트에 실어 투하하는 방법을 찾으면, 전투 작전 중에 더 많은 차량을 더 빠르게 투하할 수 있습니다."
 extra_commo_gear: "추가 통신 장비"
 extra_commo_gear_desc: "낙하산병과 함께 추가 통신 장비를 투하함으로써, 전장에서 작전하는 동안 이들이 교신하고 추가 지원을 요청할 수 있도록 보장합니다."
 dedicated_paratrooper_transports: "공수부대 수송에 대한 헌신"
 dedicated_paratrooper_transports_desc: "일반 수송기를 그냥 사용하는 대신, 낙하산병 수송기를 그 임무 전용으로 설계하겠습니다."
 advanced_medic_training: "의무병의 훈련 강화"
 advanced_medic_training_desc: "강하 중 사상자를 최소화하기 위해 모든 낙하산 부대 의무병은 응급구조사 수준의 훈련 과정을 이수하게 됩니다."
 organized_and_numerous: "대규모의 조직력"
 organized_and_numerous_desc: "수는 많지만 우리 공수 병사들은 고도로 훈련되어 있으며, 특히 강하 후 지상에서 부대를 신속하게 집결하고 재편성하는 훈련을 받습니다."
 jump_with_what_you_need: "필요한 모든 것을 가지고 뛰어내려라"
 jump_with_what_you_need_desc: "모든 병사는 강하 후 부대의 작전 시간을 최대한 보장하기 위해 전투 보급품을 포함하여 필요한 모든 장비를 갖추고 강하합니다."
 combat_reoganization: "전투 재조직화"
 combat_reoganization_desc: "전투 중 우리 낙하산병은 손실에 대응하고, 즉시 분산된 부대를 합쳐 전투 조직으로 통합할 수 있도록 훈련받을 것입니다."
 flood_their_skies: "하늘을 뒤덮어라"
 flood_their_skies_desc: "전투의 해법은 간단합니다. 적의 방어를 압도할 만큼 많은 낙하산병으로 하늘을 가득 채우는 것입니다."
 shock_from_the_sky: "하늘에서 떨어지는 장갑차"
 shock_from_the_sky_desc: "하늘에서 투하된 기계화 공수 부대를 통해 우리는 공중 투하로 예상 밖의 화력과 장비를 앞세워 적 부대에 충격을 안길 수 있습니다."
 shock_force_expansions: "충격군 (Shock Force) 확장"
 shock_force_expansions_desc: "충격 공수 부대를 중심으로 특수 부대를 구성하려면, 전투 작전에 투입할 수 있는 해당 병력의 수를 늘려야 합니다."
 light_mortar_barrages: "경박격포 일제 사격"
 light_mortar_barrages_desc: "모든 보병 소대에 소형 박격포를 장비함으로써, 가장 작은 부대도 신속 사격 지원 수단을 사용할 수 있게 됩니다."
 signals_intelligence: "신호 정보"
 signals_intelligence_desc: "공수 부대의 신호 감청과 정보 수집에 노력을 집중하면, 이후 작전에서 이들의 지상 전투 효율이 높아질 것입니다."
 dedicated_supply_teams: "헌신적인 보급반"
 dedicated_supply_teams_desc: "각 보병 중대에 전담 보급 팀을 두면 우리 부대는 다른 부대보다 더 오랫동안 외부 지원 없이 보급 상황을 유지할 수 있습니다."
 extra_anti_tank_weapons: "추가 대전차 화기"
 extra_anti_tank_weapons_desc: "보병의 대전차 무기 휴대량을 늘려, 적의 기갑 반격에 더 잘 버틸 수 있게 합니다."
 fast_hard_training: "고강도 신속 훈련"
 fast_hard_training_desc: "고강도 훈련에 집중함으로써, 훈련 과정을 통해 숙련된 병력을 신속하게 양성할 수 있습니다."
 medical_evacuation_plans: "의무 후송 계획"
 medical_evacuation_plans_desc: "전력의 회복력을 유지하기 위해 모든 부대는 전투 사상자를 최소화할 수 있도록 의료 후송 계획을 수립하고 유지합니다."
 combat_drops: "전투 낙하"
 combat_drops_desc: "충격 부대를 제대로 운용하면 이들은 신속하게 착지하여 전투에 분산 투입될 수 있으며, 혼란을 일으키고 통신선을 파괴함으로써 적의 방어 노력을 빠르게 와해시킬 수 있습니다."
 hardened_transports: "수송기 방어 강화"
 hardened_transports_desc: "수송기의 장갑을 강화함으로써, 우리 병력의 전투 강하 시 더 많은 공격을 견뎌 낼 수 있게 합니다."
 airdrop_logistical_supply: "공중보급"
 airdrop_logistical_supply_desc: "병력에 보급을 유지하는 것이 핵심이며, 최초 강하 시 대량의 보급품을 투하함으로써 전투 작전 중 우리 병력은 공중으로 더 잘 보급받게 될 것입니다."
 more_weapons_more_ammo: "더 많은 무기, 더 많은 탄약"
 more_weapons_more_ammo_desc: "병력에 추가 무기와 탄약을 장비하면 강하 시 전투력과 지속력을 높일 수 있습니다."
 second_wave_jumpers: "2차 공수 낙하대원"
 second_wave_jumpers_desc: "제1파 직후에 투입될 제2파 낙하산병을 훈련함으로써, 더 빨리 더 많은 병력을 전장에 집중시킬 수 있습니다."
 difficult_terrain_exercises: "험악 지형에 대한 훈련"
 difficult_terrain_exercises_desc: "낙하산병이 험난한 지형에서 훈련하게 함으로써, 이들이 실전의 가혹한 현실에 더 잘 대비하도록 할 수 있습니다."
 best_offence_is_good_defence: "완벽한 방어가 최고의 공격이다"
 best_offence_is_good_defence_desc: "목표 지점에 도달하면 우리 낙하산병은 참호를 파고 후속 병력이 도착하여 교대할 때까지 한 치도 물러서지 않도록 훈련받을 것입니다."
 mass_drop_tactics: "대규모 공수 낙하 전술"
 mass_drop_tactics_desc: "충격 부대를 더 잘 활용하기 위해, 이들은 충격과 공포를 극대화할 수 있도록 대규모 집단으로 강하하는 훈련을 받을 것입니다."
 open_area_fighting: "개활지 전투"
 open_area_fighting_desc: "APC와 IFV를 장비한 공수 부대는 도보 보병보다 훨씬 더 개활지 전투에 적합할 것입니다."
 fuel_conservation_techniques: "연료 전환 기술"
 fuel_conservation_techniques_desc: "전담 보급선이 부족하므로, 모든 차량 승무원은 이동과 전투 중 연료 소비를 최소화하는 기술에 대해 고도의 훈련을 받을 것입니다."
 stealth_combat_insertions: "스텔스 전투 적용"
 stealth_combat_insertions_desc: "공군과의 합동 훈련을 통해 충격 부대는 전투 강하 직전의 마지막 순간까지 기습의 요소를 유지할 수 있을 것입니다."
 who_dares_wins: "용기있는 자가 승리를 쟁취한다"
 who_dares_wins_desc: "정예 공수 특수 부대는 우리 군사적 성공의 열쇠입니다. 도보 보병은 대규모 돌파에는 효과적이지 않을 수 있지만, 우리 공수 부대는 최정예가 될 것이며 운 나쁘게 이들과 마주친 적은 대가를 치르게 될 것입니다."
 elite_forces_elite_training: "특수한 부대, 특수한 훈련"
 elite_forces_elite_training_desc: "최고의 부대에는 최고의 훈련이 필요하며, 우리는 낙하산병이 우리가 제공할 수 있는 최상의 훈련을 받도록 보장할 것입니다."
 combat_resupplies: "전투 재보급 체계"
 combat_resupplies_desc: "우리 병력은 무엇을 해서라도 전투 중에 보급을 받도록 유지될 것입니다."
 extensive_range_time: "공수 범위 시간 극대화"
 extensive_range_time_desc: "사격장 훈련 시간을 우선시함으로써, 우리 낙하산병은 배정된 모든 무기에 대해 뛰어난 사수가 될 것입니다."
 combat_supply_recovery: "전투 보급 회복"
 combat_supply_recovery_desc: "적의 무기까지 다루는 훈련을 받으면, 낙하산병은 전투 중과 전투 후에 추가 보급품을 회수할 수 있을 것입니다."
 small_unit_tactics: "소규모 부대 전술"
 small_unit_tactics_desc: "가장 하위 수준에서부터 훈련에 집중함으로써, 낙하산병 화력조조차 자신들보다 큰 적 부대와 맞서 싸울 수 있을 것입니다."
 dedicated_saboteurs: "헌신적인 사보타주 공작원"
 dedicated_saboteurs_desc: "낙하산병은 적 후방에 강하한 뒤 신속히 이동하면서 적의 핵심 기반시설과 군사 장비를 파괴하고 손상시키도록 훈련받을 것입니다."
 veteran_training_staff: "베테랑 훈련 교관"
 veteran_training_staff_desc: "일선 부대에서 베테랑 낙하산병을 차출해 훈련 교관으로 활용함으로써, 아직 훈련 과정에 있는 낙하산병들에게 실전 경험과 교훈을 전달할 수 있습니다."
 combat_paramedics: "전투 긴급 의료원"
 combat_paramedics_desc: "값비싼 손실을 막기 위해, 모든 의무 인력은 부상한 낙하산병의 생존 확률을 극대화할 수 있도록 중환자 처치 요원 수준까지 훈련받을 것입니다."
 sere_training: "‘생존 회피 저항 탈출 (SERE)’ 훈련"
 sere_training_desc: "우리 낙하산병은 마주칠 수 있는 어떠한 적 부대나 환경에서도 생존하고, 회피하고, 저항하고, 탈출하도록 훈련받을 것입니다."
 gureilla_fighting: "게릴라 훈련"
 gureilla_fighting_desc: "홀로 싸우거나 극소수로 싸울 때에도 우리 병사들은 타격하고, 빠지고, 폭파하는 등 적 부대와 대형을 교란하도록 훈련받을 것입니다."
 use_what_we_take: "주변의 모든 것이 무기다"
 use_what_we_take_desc: "고정되어 있지 않은 것이라면 무엇이든 우리 낙하산병은 가져다 쓰도록 훈련받을 것입니다. 부엌 싱크대까지도 말입니다."
 any_time_any_place_any_weather: "시간, 장소, 날씨에 구애받지 않도록"
 any_time_any_place_any_weather_desc: "시간, 장소, 기상 조건에 관계없이 우리 낙하산병은 적을 타격할 수 있을 것입니다."
 advanced_medical_care: "향상된 의료 보호"
 advanced_medical_care_desc: "모든 낙하산병은 아군의 생존성을 더욱 극대화하기 위해 더 높은 수준의 전투 구명 훈련(CLS)을 받게 됩니다."
 seize_the_initive: "적의 계획을 장악하라"
 seize_the_initive_desc: "수세에 몰린 상황에서도 우리 병력은 빈틈과 기회를 알아보고, 즉시 적으로부터 주도권을 되찾도록 훈련받을 것입니다."
 urban_warfare_training: "시가전 훈련"
 urban_warfare_training_desc: "이들의 기량을 활용하기 위해, 우리 병력은 도시와 시가지 전투에서 더욱 치명적이고 위협적인 존재가 될 수 있도록 도시 작전에 대한 고급 훈련을 받게 됩니다."
 rapid_replenishment_doctrine: "신속한 충원 교리"
 rapid_replenishment_doctrine_desc: "병력을 신속하게 순환시키고 보급품을 전선으로 가져옴으로써, 우리 낙하산병은 적에 맞선 작전을 수행하는 데 필요한 장비와 보급품을 항상 갖추도록 최선을 다할 것입니다."
 fight_with_what_you_have: "수단과 방법을 가리지 말고 싸워라"
 fight_with_what_you_have_desc: "보급이 부족하거나 필요하다면 맨손으로라도 우리 낙하산병은 계속 싸울 것입니다."
 eyes_and_ears: "눈과 귀"
 eyes_and_ears_desc: "우리 낙하산병은 고도로 훈련받은 창끝의 병력으로서 전투와 정찰 모두를 담당합니다. 이 부대들은 우리 군의 눈과 귀입니다."
 special_forces_marine: "해병 특수 전단"
 special_forces_marine_desc: "해병 특수 부대는 상륙 작전과 주요 하천 및 기타 수상 장애물을 건너는 작전을 수행하도록 편성되고 훈련됩니다."
 massed_amphibious_landings: "대규모 상륙전"
 massed_amphibious_landings_desc: "수적 우세를 앞세워 적의 해안 방어선을 돌파하고, 문제없이 적 해안선에 상륙할 수 있을 것입니다."
 mass_recrutiment_campaigns: "대규모 징병 운동"
 mass_recrutiment_campaigns_desc: "신규 해병 모집을 홍보하고 적극적인 조치를 취함으로써, 해병대의 규모를 대폭 확장할 수 있을 것입니다."
 multiple_training_centers: "다수의 훈련소"
 multiple_training_centers_desc: "전국에 여러 훈련 센터를 활용함으로써, 해병을 더 빠르고 효율적으로 훈련할 수 있을 것입니다."
 increased_vehicle_maintinance: "차량 유지 보수 능력 향상"
 increased_vehicle_maintinance_desc: "해병이 주로 차량화 수송 수단을 이용하므로, 차량 정비 절차를 강화하면 이들이 더 오래 가동될 수 있을 것입니다."
 one_chassis_many_jobs: "하나의 차에 수많은 직업이"
 one_chassis_many_jobs_desc: "모든 해병 장비에 단일 기본 차체를 활용함으로써, 해당 부대의 생산과 보급망을 간소화할 수 있을 것입니다."
 public_demonstration_campaigns: "민간 홍보 캐페인"
 public_demonstration_campaigns_desc: "더 많은 신병을 끌어들이기 위해 해병은 정기적인 시범을 통해 자신들의 기량을 선보일 것입니다."
 ship_to_shore_transports: "해안 상륙 수송"
 ship_to_shore_transports_desc: "전담 상륙정이 강습함에서 해안까지의 수송을 맡아 더 많은 병력을 효율적으로 상륙시킬 수 있게 할 것입니다."
 fix_bayonets_and_charge: "총을 검으로 바꾸고 돌격하라"
 fix_bayonets_and_charge_desc: "병력을 엄격하게 훈련함으로써, 교두보를 확보하기 위해 백병전까지 불사할 만큼 공격적으로 준비시킬 것입니다."
 lcac_developments: "공기부양상륙정 (LCAC) 개발"
 lcac_developments_desc: "상륙정 개발에 더욱 집중함으로써, 함선에서 해안까지의 수송을 더욱 효율적으로 만들 것입니다."
 hit_the_beach_hard: "해안으로 돌격하라"
 hit_the_beach_hard_desc: "병력이 해안에 공격적으로 상륙하여 진격하도록 훈련하면, 후속 병력을 위해 지역을 신속하게 확보할 수 있을 것입니다."
 pre_landing_bombardments: "상륙전 폭격"
 pre_landing_bombardments_desc: "해군의 지원을 활용함으로써, 우리의 상륙 작전은 해상 호위함들의 상당한 화력의 지원을 받게 될 것입니다."
 amphibious_supply_teams: "상륙 보급반"
 amphibious_supply_teams_desc: "일부 상륙정을 보급 부대로 활용함으로써, 해안선까지 정기적으로 보급품을 공급할 수 있을 것입니다."
 helicopter_logistic_operations: "헬리콥터 보급 작전"
 helicopter_logistic_operations_desc: "헬리콥터 지원에 크게 의존하는 만큼, 헬리콥터 보급 비행은 우리의 병참 능력을 한층 더 높일 것입니다."
 next_generation_aavs: "차세대 수륙양용전차 (AAV)"
 next_generation_aavs_desc: "차세대 수륙양용전차(AAV)를 설계 및 제작함으로써, 우린 미래 해병대원들을 더욱 무장하고 유사시에 대비할 수 있도록 할 수 있습니다."
 fleet_marine_corpsmen: "함대 위의 의무 해병대"
 fleet_marine_corpsmen_desc: "With specialized combat medicine training for our corpsmen, we will ensure they are prepared to treat any combat casualties we sustain on operations."
 every_marine_a_rifleman: "모든 해병대는 소총수"
 every_marine_a_rifleman_desc: "First and foremost, every marine will be a rifleman, and will be able to shoot and fight as one at a moment's notice."
 leave_nothing_on_the_ship: "배에 그 무엇도 남기지 마라"
 leave_nothing_on_the_ship_desc: "상륙 돌격 작전에서, 함선의 수송 담당관은 작전 시작시 단 하나의 장비도 배에 남기지 않도록 해야합니다."
 rapid_breakouts: "신속 돌격"
 rapid_breakouts_desc: "작전의 선봉에 서서 공격적인 전투와 신속한 배치를 하도록 훈련받은 우리 해병대는, 재빨리 해안을 사수하고 점령하여 후발대가 그들이 목표로 하는 이후의 모든 작전을 수행하는데 문제가 없도록 해줄 것입니다."
 heavy_landing_craft: "중장비용 상륙정"
 heavy_landing_craft_desc: "By building a landing craft designed to move heavy equipment, we will be able to equip our forces with more and heavier equipment and weapons during the initial landing stages."
 armored_landing_force: "기갑화 상륙 부대"
 armored_landing_force_desc: "Utilizing amphibious APCs and IFVs, our marine forces will be able to land armored units on the enemy shores, making breakthroughs easier."
 light_armored_recon: "경기갑수색 부대"
 light_armored_recon_desc: "가볍고 신속한 기갑 부대를 정찰에 활용함으로써, 해병은 적 방어의 모든 빈틈을 신속하게 찾아내 공략할 수 있을 것입니다."
 precision_ship_bombardment: "정밀한 함선 폭격"
 precision_ship_bombardment_desc: "함정 발사 순항 미사일 및 기타 무기를 활용하여, 우리 해군 전력은 병력 상륙에 앞서 적의 요새와 기타 진지에 정밀 타격을 가할 것입니다."
 beach_reconassiance_raids: "해안 수색대 공습"
 beach_reconassiance_raids_desc: "전담 정찰 팀을 활용하여 우리 해병 부대는 상륙에 앞서 교두보에 대한 경 정찰 습격을 수행하고, 해당 지점이 전면 침공군에 적합한지 확인할 것입니다."
 beachhead_logistics: "상륙 거점 병참"
 beachhead_logistics_desc: "전쟁 기계를 먹여 살리기 위해 병참 작전은 교두보에서부터 시작되며, 연료와 탄약이 필요한 곳에 계속 도달하도록 보장할 것입니다."
 land_armor_by_sea: "바다를 항해하는 장갑차"
 land_armor_by_sea_desc: "상륙정을 기갑 부대 수송에 전담시킴으로써, 해안에 상륙하여 내륙으로 이동하는 해병 부대에 더 효율적으로 기갑 지원을 제공할 수 있을 것입니다."
 refusal_to_quit: "후퇴란 없다"
 refusal_to_quit_desc: "공격적이고 결연하도록 훈련되고 단련된 우리 병력은 포기가 무엇인지 알지 못할 것입니다."
 hospital_ships: "병원선"
 hospital_ships_desc: "생존성을 극대화하기 위해 우리 상륙 부대는 작전 중 모든 해병에게 신속한 의료 처치를 보장할 수 있도록 항상 전담 병원선을 대동할 것입니다."
 dedicated_landing_ships: "상륙용정의 개선"
 dedicated_landing_ships_desc: "인력과 보급품의 이동을 원활히 하기 위해, 전담 상륙함이 해병과 그 장비를 침공 지점까지 수송할 것입니다."
 fuel_on_the_beach: "해안에서의 연료 보급"
 fuel_on_the_beach_desc: "신중한 계획을 통해 해안을 확보하는 즉시 거대한 연료 저장낭을 설치할 수 있으며, 이로써 모든 상륙 부대가 즉시 연료를 공급받을 수 있습니다."
 victory_through_firepower: "화력을 통한 승리"
 victory_through_firepower_desc: "핵심 표적과 지점에 화력을 집중함으로써 압도적인 사격을 통한 승리를 보장할 것입니다."
 armored_breakouts: "장갑 차량 돌격"
 armored_breakouts_desc: "해안에 기갑 부대를 상륙시킬 수 있는 능력을 활용하여 적의 후방 지역으로 신속하게 돌파하고 방어의 틈을 공략할 것입니다."
 amphibious_warfare_experts: "상륙전 전문가"
 amphibious_warfare_experts_desc: "상륙 기술과 도하 훈련을 지속적으로 실시함으로써, 우리 해병 부대는 상륙 군사 작전 분야의 최고 전문가가 될 것입니다."
 thunder_runs: "무조건 앞만 보고 달려리"
 thunder_runs_desc: "혼란을 일으키고 적에게 피해를 입히는 것을 목표로, 우리 기갑 부대는 바로 뒤에 후속 병력이 없더라도 적 영토 깊숙이 신속하게 타격하는 훈련을 받을 것입니다."
 shore_directed_fires: "해안 정밀 직접 타격"
 shore_directed_fires_desc: "고도로 훈련된 관측병을 활용하여, 해안의 해병은 해군 화력 지원이 투사될 위치를 정밀하게 지시할 수 있을 것입니다."
 dedicated_breaching_parties: "적의 방어선을 돌파하라"
 dedicated_breaching_parties_desc: "적 요새를 파괴하는 훈련을 받은 이 병력은 전투 작전 중 적의 장애물을 손쉽게 돌파하도록 훈련될 것입니다."
 logistical_experts: "보급 중심 체계"
 logistical_experts_desc: "이동시켜야 하는 인원과 장비의 양을 고려하여, 우리 지원 및 보급 중대는 인원과 물자를 최소한의 지연으로 접촉 지점까지 이동시키는 전문가가 될 것입니다."
 rapid_mission_planning: "신속한 임무 계획"
 rapid_mission_planning_desc: "기회와 빈틈을 신속하게 활용하기 위해, 우리 병력은 필요에 따라 전투 임무를 신속하게 계획하고 실행하는 훈련을 할 것입니다."
 infantry_amphibious_strike_forces: "보병 상륙 돌격 부대"
 infantry_amphibious_strike_forces_desc: "고도로 훈련된 경보병 부대에 주로 의존함으로써, 우리 해병은 상륙 작전 중 적의 핵심 표적을 타격하고 파괴하는 전문가가 될 것입니다."
 the_few_the_proud: "정예병에 대한 자부심"
 the_few_the_proud_desc: "우리 해병 보병은 수는 적지만 상륙 부대로서 고도로 숙련되고 유능한 정예 전투 부대가 될 것입니다."
 one_if_by_land: "지상전의 도하 지원"
 one_if_by_land_desc: "내륙에서 싸울 때 우리 해병은 현대 전장을 가득 메운 강과 기타 수상 장애물을 건너는 방법을 병력에게 지도하고 훈련할 것입니다."
 two_if_by_sea: "해상전의 상륙 주도"
 two_if_by_sea_desc: "상륙 침공을 수행할 때, 우리 해병은 훈련과 임무에 대한 숙련도를 바탕으로 주어진 모든 기회를 활용할 수 있을 것입니다."
 more_with_less: "다다익선"
 more_with_less_desc: "세상의 모든 장비가 주어지지는 않더라도, 우리 해병은 주어진 만큼의 장비로 적이 가능하다고 가정하는 것을 훨씬 뛰어넘는 임무를 수행할 수 있을 것입니다."
 marine_beach_raids: "해병대의 해안 급습"
 marine_beach_raids_desc: "상륙 병력을 활용하여 우리 해병은 적 해안에 신속한 치고 빠지기식 습격을 수행할 것이며, 이를 통해 실제 상륙이 시작되면 적 병력을 신속하게 제거할 수 있습니다."
 lightweight_landing_groups: "상륙 부대의 경량화"
 lightweight_landing_groups_desc: "병력 내 경보병의 비중을 활용하여, 우리 상륙 집단은 가볍고 민첩해져 단 한 번의 상륙으로 여러 과업을 달성할 수 있을 것입니다."
 enlisted_to_officer_training: "숙련'병'의 장교 훈련"
 enlisted_to_officer_training_desc: "경험 많은 부사관·병사를 활용하여 이들 중에서 장교를 양성함으로써, 그 경험이 제대로 활용되도록 장려할 것입니다."
 enhanced_leadership_schools: "사관학교 개선"
 enhanced_leadership_schools_desc: "고품질 리더십 훈련 과정에 집중함으로써, 우리의 모든 장교와 부사관이 고도의 역량을 갖춘 지휘관이 될 것입니다."
 secure_the_beachhead: "상륙 거점을 사수하라"
 secure_the_beachhead_desc: "우리 해병의 목표는 하나입니다. 적의 방어선을 돌파하고 후속 병력을 위한 교두보를 확보하는 것입니다."
 tough_as_nails: "못처럼 단단하리"
 tough_as_nails_desc: "고급 훈련 체계와 혹독한 환경 훈련을 통해 우리 해병은 어떠한 환경에서도 무엇이 닥쳐도 견뎌 내는 강인한 병사들입니다."
 light_fighter_fighting: "경보병 형태의 전투"
 light_fighter_fighting_desc: "병력을 경보병으로 싸우도록 특화함으로써, 중장비가 최소한인 적 부대와 맞서 싸우는 데 가장 적합한 장비를 갖추게 됩니다."
 improvised_breaching_methods: "즉흥적인 돌파 전술"
 improvised_breaching_methods_desc: "가용 장비를 활용하도록 훈련된 우리 해병은 전문 돌파 장비 없이도 돌파 작전을 수행합니다."
 urban_operations_training: "시가전 훈련"
 urban_operations_training_desc: "시가전(MOUT) 작전에 크게 중점을 둔 우리 해병 부대는 해안과 강뿐 아니라 도시와 시가지 지형도 충분히 공격할 수 있습니다."
 improved_bridging_methods: "가교 전술 개선"
 improved_bridging_methods_desc: "해병이 하천 장애물에 신속하게 교량을 놓도록 훈련함으로써, 적대적 지형을 가로지르는 대체 경로를 구축하여 후속 병력을 적 영토 더 깊숙이 진출시킬 수 있을 것입니다."
 increased_squad_sizes: "분대 규모 확장"
 increased_squad_sizes_desc: "모든 해병 부대에 제3 화력조를 추가함으로써, 전투 작전에서의 전술적 유연성과 화력을 극적으로 높일 수 있습니다."
 hold_until_relieved: "끝까지 버텨라"
 hold_until_relieved_desc: "교두보를 확보하고 증원 병력이 도착할 때까지 버티도록 훈련된 우리 해병은 적 지형의 아주 작은 발판조차 완강하게 내주지 않을 것입니다."
 advance_under_fire: "포화 속의 진격"
 advance_under_fire_desc: "훈련과 자신감 고취 훈련을 통해, 우리 해병은 가장 격렬한 적의 사격 속에서도 기꺼이 진격할 수 있을 것입니다."
 island_hopping_campaigns: "섬에서 섬으로"
 island_hopping_campaigns_desc: "넓은 해역을 가로지르며 싸우도록 훈련된 우리 해병은 침공에서 침공으로 이어지며, 섬들의 사슬과 연이은 여러 상륙 침공을 문제없이 돌파해 나갈 수 있을 것입니다."
 special_forces_airmobile: "공중 기동 특수부대"
 special_forces_airmobile_desc: "고도로 훈련된 공중 강습 병력을 활용하여, 기동 항공 보병 부대는 적 후방 깊숙이 타격하고 신속히 이동하여 고가치 표적을 확보하고 적 부대를 포위할 수 있을 것입니다."
 armored_airmobile_corps: "기갑화 공수 부대"
 armored_airmobile_corps_desc: "항공 기동 부대를 APC로 보강함으로써, 더 단단하고 강력한 적 부대와 교전할 수 있게 됩니다."
 expanded_pilot_training: "조종사 훈련 확대"
 expanded_pilot_training_desc: "조종사 훈련 학교와 훈련 과정의 수를 늘림으로써, 적보다 더 많고 더 우수한 조종사를 더 빠르게 양성할 수 있을 것입니다."
 open_air_assault_schools: "공중 강습 학교 개장"
 open_air_assault_schools_desc: "여러 공중 강습 학교를 개설함으로써, 추가 보병 인원에게 공중 강습 작전 기술을 더욱 훈련시킬 수 있습니다."
 massed_assault_formations: "대규모 돌격 편대"
 massed_assault_formations_desc: "기갑 항공 기동 부대의 대규모 집단을 편성함으로써, 적 전선의 약점을 더 잘 공략하고 더 나은 돌파를 이끌어낼 수 있을 것입니다."
 coordinated_staging_areas: "대기 지역과의 협조"
 coordinated_staging_areas_desc: "부대가 작전을 개시하는 집결지를 긴밀히 조율함으로써, 작전 실행 시 지휘통제 능력이 향상될 것입니다."
 glamorized_air_assault: "공중 강습의 미화"
 glamorized_air_assault_desc: "공중 강습 부대를 조명함으로써, 신병들에게 매력적인 경력 기회로 만들 수 있습니다."
 slingloading_resuppy: "슬링 리프트를 통한 재보급"
 slingloading_resuppy_desc: "헬리콥터 내부뿐 아니라 슬링 로드(외부 매달기) 능력도 활용함으로써, 우리 병력이 수송할 수 있는 보급품의 양과 중량을 극적으로 늘릴 수 있습니다."
 mobilitas: "기동 중심"
 mobilitas_desc: "고기동 작전에 중점을 둠으로써, 우리 공중 강습 부대는 작전에 대한 확고한 목표를 가지고 신속하게 기동하도록 훈련받을 것입니다."
 mobile_protected_firepower: "기갑화 공중 화력"
 mobile_protected_firepower_desc: "가볍고 항공 기동이 가능한 전차에 집중하면 보병이 강화된 진지를 공격할 때 큰 힘이 될 것입니다."
 internal_recruitment_drives: "군 내부에서 차출"
 internal_recruitment_drives_desc: "다른 부대의 베테랑 병사를 모집하려 노력함으로써, 우리 공중 강습 부대의 질과 양을 강화할 수 있습니다."
 improved_school_pipelines: "혹독한 사관학교"
 improved_school_pipelines_desc: "훈련 경로와 속도를 개선함으로써, 공중 강습 부대의 훈련 속도를 높일 수 있습니다."
 heavy_lift_helicopters: "중 수송 헬리콥터"
 heavy_lift_helicopters_desc: "대형 중량 수송 헬리콥터를 활용하면 항공 기동 부대에 더 많은 보급품을 수송하고 함께 이동시킬 수 있습니다."
 forward_air_traffic_control: "선제적 항공 관제"
 forward_air_traffic_control_desc: "착륙 지대와 그 주변의 작전을 더 잘 통제하기 위해, 전방 항공 교통 관제 팀이 우리 병력과 함께 배치되어 많은 헬리콥터 통행량을 유도할 것입니다."
 call_for_fires: "신속한 화력 지원 요청"
 call_for_fires_desc: "일선 부대의 관측병 수를 늘림으로써, 항공 및 포병 지원 요청을 더 잘 유도할 수 있습니다."
 internal_medevac_units: "내부 의무후송단"
 internal_medevac_units_desc: "적의 사격으로 인한 사상자를 줄이기 위해, 모든 항공 기동 부대는 자체 의료 후송(MEDEVAC) 지원을 갖추어 사상자가 가능한 한 빨리 상위 의료 시설에 도달하도록 할 것입니다."
 pilot_and_enlisted_bonuses: "조종사 및 자원병에 대한 혜택"
 pilot_and_enlisted_bonuses_desc: "잔류율을 높이고 더 많은 병사의 관심을 끌기 위해, 공중 강습 부대에 자원하거나 잔류하는 조종사와 병사 모두에게 거액의 보너스를 지급할 것입니다."
 forward_arm_repair_points: "전진 정비 및 보급 거점"
 forward_arm_repair_points_desc: "헬리콥터를 수리하고 재무장할 수 있는 전방 거점에 집중함으로써, 화력 지원 요청에 신속하게 대응할 수 있도록 보장합니다."
 assembly_area_coordination: "집결지 간의 협조"
 assembly_area_coordination_desc: "제1파 상륙에 지휘 팀을 전방으로 투입함으로써, 우리 병력은 집결지에서 신속하게 집결하고 진격하여 더 빨리 전투에 돌입할 수 있을 것입니다."
 strike_fast_strike_hard: "신속한 공격, 강력한 타격"
 strike_fast_strike_hard_desc: "신속하고 강력한 공격에 중점을 둠으로써, 우리 항공 기동 부대는 군사 진격의 창끝이 될 것입니다."
 gunship_escorts: "건쉽 호위"
 gunship_escorts_desc: "상륙 부대의 안전을 보장하기 위해 헬리콥터 건십이 모든 공중 강습 작전을 호위할 것입니다."
 hot_landing_zone_insertions: "포화 속의 착륙"
 hot_landing_zone_insertions_desc: "공격 헬리콥터의 직접 사격 엄호 아래, 우리 병력은 적의 사격을 받는 지대, 즉 평소에는 작전하기에 너무 위험한 지대에도 착륙할 수 있을 것입니다."
 command_jtac_teams: "합동최종공격통제관 (JTAC) 통제 지휘"
 command_jtac_teams_desc: "JTAC 팀을 지휘 요소와 함께 집중시킴으로써, 지휘관이 가장 중요하다고 판단하는 표적에 항공기와 포병의 사격을 효과적으로 유도할 수 있게 합니다."
 dispersed_jtac_teams: "합동최종공격통제관 (JTAC)의 분산"
 dispersed_jtac_teams_desc: "JTAC 팀을 일선 부대에 분산시킴으로써, 지휘 계통의 요청에 의존하지 않고 해당 부대가 가장 필요로 할 때 사격 지원을 제공할 수 있습니다."
 forward_staged_supply_lines: "전진 보급 기지 라인"
 forward_staged_supply_lines_desc: "보급품과 보충 인원을 전선 가까이에 전진 배치함으로써, 보급 및 증원 요청에 대한 처리 시간을 최소화하고 우리 병력의 기동성을 높일 수 있습니다."
 helicopter_gunship_interdiction: "헬리콥터 건쉽 차단"
 helicopter_gunship_interdiction_desc: "공격 헬리콥터를 활용하여, 우리를 지나치거나 가까이에서 기동하려는 적 부대를 신속하게 반격할 수 있습니다."
 prioritized_gunship_crews: "건쉽 승무원 우선"
 prioritized_gunship_crews_desc: "건십 승무원에게 더 많은 훈련 시간과 인력을 할애함으로써, 공격 헬리콥터 편대를 훨씬 더 효율적이고 치명적으로 만들 것입니다."
 escorted_medevac_flights: "의무후송기 호위"
 escorted_medevac_flights_desc: "의료 후송(MEDEVAC) 헬리콥터를 공격 헬리콥터로 호위하면 훨씬 더 위험한 상황에서도 부상병을 구출할 수 있습니다."
 attack_helicopter_brigades: "공격 헬리콥터 여단"
 attack_helicopter_brigades_desc: "운용 중인 공격 헬리콥터의 수를 늘림으로써, 일선 부대가 사용할 수 있는 화력을 극적으로 증대시킬 수 있습니다."
 transport_helicopter_defensive_weapons: "수송 헬리콥터 방어 병기"
 transport_helicopter_defensive_weapons_desc: "수송 헬리콥터에 자위용 무기를 장착함으로써, 위험한 착륙 지대에 착륙하면서도 적 부대에 사격할 수 있게 합니다."
 helicopter_supplied_fuel_points: "헬리콥터 연료 보급 거점"
 helicopter_supplied_fuel_points_desc: "헬리콥터로 연료를 수송함으로써, 병력에 재보급을 할 수 있는 범위와 속도를 높입니다."
 gunship_close_support: "건쉽 근접 지원"
 gunship_close_support_desc: "우리 건십은 근접 지원 임무에 투입되어, 전투 중인 보병과 기갑 부대에 정밀 사격 지원을 제공할 것입니다."
 beans_and_bullets_by_helicopter: "전면적인 헬리콥터 보급 체계"
 beans_and_bullets_by_helicopter_desc: "항공 기동 부대의 병참 체계를 전면적으로 헬리콥터 기반으로 전환하면, 보급선을 앞지르지 않고도 진격 속도를 유지할 수 있습니다."
 nap_of_the_earth_insertions: "초저고도 비행"
 nap_of_the_earth_insertions_desc: "조종사를 가능한 한 지면 가까이 비행하도록 훈련함으로써, 마지막 순간까지 기습의 요소를 유지할 수 있습니다."
 airmobile_maintainers: "유지보수반의 공중 기동화"
 airmobile_maintainers_desc: "정비 인력이 장비와 보급품을 헬리콥터로 이동시킬 수 있게 함으로써, 우리 부대가 현장에 머무를 수 있는 능력을 높입니다."
 airmobile_engineering: "공중기동 공학"
 airmobile_engineering_desc: "공병 부대를 공세적 임무에 활용하는 우리 항공 기동 공병은 전투 공병의 의미로 기능하며, 항공 기동 작전의 속도를 따라갈 수 있습니다."
 hunter_killer_helo_teams: "킬러 헬리콥터 편대"
 hunter_killer_helo_teams_desc: "헬리콥터 승무원 간의 세심한 훈련을 통해, 우리 건십은 짝을 이루어 적 기갑 자산을 쉽게 찾아내 격파할 수 있게 됩니다."
 mid_air_helicopter_refueling: "공중 헬리콥터 급유"
 mid_air_helicopter_refueling_desc: "공중 급유 기술을 활용하여, 우리 항공기는 더 긴 임무를 비행하고 표적 상공에 더 오래 머물며 지상 병력을 지원할 수 있습니다."
 airmobile_reconassiance_by_fire: "화력을 통한 공중 기동 수색"
 airmobile_reconassiance_by_fire_desc: "항공 기동 부대의 공세적인 기동은 전선을 따라 싸우면서 정확한 사격 정찰을 수행할 수 있게 할 것입니다."
 fortunate_son: "신의 아들 (Fortunate Son)"
 fortunate_son_desc: "경보병 전술에 중점을 둠으로써, 우리 항공 기동 부대는 정예 전투 부대로 거듭날 것입니다."
 precision_helicopter_flying: "정밀한 헬리콥터 순항"
 precision_helicopter_flying_desc: "헬리콥터 조종사를 정예 수준으로 훈련함으로써, 우리 병력은 임무에 필요한 정확한 지점에 하차 보병을 착륙시킬 수 있을 것입니다."
 external_fuel_tanks: "외부 연료 탱크"
 external_fuel_tanks_desc: "외부 연료 탱크를 사용하면 헬리콥터가 작전을 비행할 수 있는 거리가 늘어나고, 연료 보급을 위해 이탈하기 전까지 표적 상공에 머무를 수 있는 시간이 길어집니다."
 precision_firepower: "정밀한 화력"
 precision_firepower_desc: "정밀 유도 무기를 사용하여 우리 병력은 적 표적에 정밀 타격을 가할 수 있을 것입니다."
 rapid_unit_rotations: "신속한 부대 교체"
 rapid_unit_rotations_desc: "부대 효율을 유지하기 위해 우리 항공 기동 부대는 정기적으로 교대하여 휴식과 회복을 취하며, 부대의 소진을 방지합니다."
 fastroping_assault_operations: "신속 하강 돌격 작전"
 fastroping_assault_operations_desc: "패스트로프(고속 하강) 작전을 수행함으로써, 우리 항공 기동 부대는 시가지에서도 거리낌 없이 작전을 수행할 수 있습니다."
 rapid_asset_interdiction: "신속한 전략 자산 점령"
 rapid_asset_interdiction_desc: "고도로 훈련된 조종사와 보병 덕분에, 우리 항공 기동 부대는 즉각적으로 핵심 기회 표적을 신속히 찾아내 타격할 수 있습니다."
 extended_pilot_training: "조종사 훈련 확대"
 extended_pilot_training_desc: "조종사 훈련 과정을 연장함으로써, 우리는 최상의 품질을 갖춘 조종사를 양성할 것입니다."
 critical_care_medevac: "의무후송대원을 향한 특별 대우 "
 critical_care_medevac_desc: "부상병의 생존을 보장하기 위해, 모든 항공 기동 의료 후송(MEDEVAC) 인원은 중환자 처치 응급구조사와 간호사로 구성되며, 아군이 살아남아 다시 싸울 가능성을 최대한 높일 것입니다."
 airmobile_leadership_courses: "공수 지휘관 양성 과정"
 airmobile_leadership_courses_desc: "지휘관들이 이러한 환경에서 작전하는 방법을 더 잘 가르치기 위해, 이러한 작전의 세부 사항을 가르치는 전문 항공 기동 지휘 과정을 개설할 것입니다."
 combat_resupply_flights: "전투 지역 보급 운항"
 combat_resupply_flights_desc: "위험에 관계없이 우리 항공 기동 병참 조종사들은 전투 지역으로 비행하여 병사들에게 탄약과 장비를 계속 공급할 수 있을 것입니다."
 expanded_light_fighter_bypass_operations: "신속 경형 편대의 우회 포위 작전"
 expanded_light_fighter_bypass_operations_desc: "주어진 기회를 최대한 활용하여, 우리 병력은 아군의 손실을 최소화하기 위해 강화된 표적을 우회하고 포위하는 방안을 고려할 것입니다."
 bad_weather_flight_training: "악천후 운항 훈련"
 bad_weather_flight_training_desc: "모든 기상 조건에서 비행하는 훈련을 받으면, 우리 조종사들은 어떤 날씨에 처하든 병력과 보급품을 수송할 수 있습니다."
 cls_by_doctrine: "전투 구조원 (CLS) 교리"
 cls_by_doctrine_desc: "우리 병력의 모든 병사가 전투 구명 훈련(CLS)을 받도록 보장함으로써, 모든 부상병에게 즉시 응급 의료를 제공하여 전체 사상자를 줄일 수 있습니다."
 night_combat_insertions: "야간 전투 차단"
 night_combat_insertions_desc: "야간을 활용함으로써, 적의 시야가 가장 제한되는 때에 신속한 작전을 수행할 수 있습니다."
 rapid_battery_emplacement: "신속한 포대 설치"
 rapid_battery_emplacement_desc: "포병 승무원이 포를 신속하게 진지에 배치하도록 훈련함으로써, 사격 기지를 빠르게 구축하여 다른 부대에 적절한 화력 지원을 제공할 수 있습니다."
 dedicated_spotter_teams: "공중 경보기 확장"
 dedicated_spotter_teams_desc: "포병 및 항공 관측 팀을 모든 대대에 편입시켜, 고가치 적 표적을 찾아 사격을 유도하는 것을 유일한 임무로 삼을 것입니다."
 maintaining_momentum: "지속적인 압박 유지"
 maintaining_momentum_desc: "적에게 끊임없이 압박을 가하고 잠시도 쉴 틈을 주지 않으며, 우리 병력이 적 전선 깊숙이 계속 밀고 들어갈 수 있도록 하는 데 중점을 두어야 합니다."
 infantry_squad_reconassiance: "보병 분대 수색"
 infantry_squad_reconassiance_desc: "전문 훈련을 통해 모든 보병 부대가 정찰 임무를 수행하도록 가르쳐, 항공 기동 부대의 정보 수집 능력을 한층 더 확장할 것입니다."
 assault_gun_tech_3_desc: "현대 군대가 제공할 수 있는 최고의 성능으로, 스마트탄과 공중 폭발탄을 갖추었습니다."
