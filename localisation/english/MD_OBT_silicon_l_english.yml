l_english:
 TAI_deferred_fab_hsinchu_tt: "If we lack the workers or power for a new fab, or are under blockade, the §YHsinchu§! plant is deferred: the decision §YBuild the Hsinchu Fab§! becomes available."
 TAI_build_deferred_fab_hsinchu: "Build the Hsinchu Fab"
 TAI_build_deferred_fab_hsinchu_desc: "The Hsinchu microchip plant was postponed for lack of workers, power or supplies. With conditions improved, construction can begin."
 TAI_deferred_fab_taichung_tt: "If we lack the workers or power for a new fab, or are under blockade, the §YTaichung§! plant is deferred: the decision §YBuild the Taichung Fab§! becomes available."
 TAI_build_deferred_fab_taichung: "Build the Taichung Fab"
 TAI_build_deferred_fab_taichung_desc: "The Taichung microchip plant was postponed for lack of workers, power or supplies. With conditions improved, construction can begin."
 TAI_deferred_fab_tainan_tt: "If we lack the workers or power for a new fab, or are under blockade, the §YTainan§! plant is deferred: the decision §YBuild the Tainan Fab§! becomes available."
 TAI_build_deferred_fab_tainan: "Build the Tainan Fab"
 TAI_build_deferred_fab_tainan_desc: "The Tainan microchip plant was postponed for lack of workers, power or supplies. With conditions improved, construction can begin."
 TAI_deferred_fab_any_tt: "If we lack the workers, power or a free building slot for a new fab, or are under blockade, the plant is deferred: the decision §YBuild a New Fab§! becomes available."
 TAI_build_deferred_fab_any: "Build a New Fab"
 TAI_build_deferred_fab_any_desc: "A planned microchip plant was postponed. With workers, power and a site available, construction can begin."
 TAI_can_build_microchip_plant_tt: "We can staff and power a new microchip plant and are not under a full blockade"
