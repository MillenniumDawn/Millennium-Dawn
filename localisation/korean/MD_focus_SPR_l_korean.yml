l_korean:
 spanish_focus: "스페인 중점 계통도"
 SPR_the_political_sphere: "정치 문제"
 SPR_the_political_sphere_desc: "우리 정치에 대해 논의하는 것은 우리가 우리 나라가 어떤 정치적 방향으로 나아가야 하는지 결정하는 데 도움이 될 것입니다."
 SPR_the_republic: "새로운 국가"
 SPR_the_republic_desc: "스페인은 1978년 헌법 아래 수립된 확고한 입헌 군주국으로서 굳건히 서 있습니다. 스페인의 권력 대부분은 국가를 다스리는 의회(코르테스 헤네랄레스), 자치 공동체, 지방자치단체에 있습니다. 프랑코주의라는 재앙에 흔들렸던 국가로서, 우리는 민주주의 가치에 대한 헌신을 굳건히 하고 극단주의의 부상을 막아야 합니다."
 SPR_faith_in_the_constitution: "헌법에서의 운명"
 SPR_faith_in_the_constitution_desc: "1978년 스페인 헌법은 프랑코주의를 나라에서 쫓아내며, 스페인의 더 나은 미래에 대한 믿음을 우리에게 가져다 주었습니다."
 SPR_nuestra_identidad: "우리의 정체성"
 SPR_nuestra_identidad_desc: "외부를 바라보기에 앞서 우리 자신의 나라와 과거를 돌아보아야 합니다. 우리의 정체성은 결코 잃어서는 안 되는 것입니다."
 SPR_euskara: "유스칼드나크 (바스크)"
 SPR_euskara_desc: "The Euskaldunak (Basque) are an indigenous cultural group in Northern Spain who are much different from the rest of the country. Their language is one of the primary examples of a language isolate, much like Haida from the Americas. They are much different from the rest of the Spanish cultural groups and have been vying for independence for decades."
 SPR_adopt_basque: "바스크에 우호적인 입장"
 SPR_adopt_basque_desc: "바스크인의 문화는 스페인에서 볼 수 있는 어떤 것과도 다릅니다. 정부가 훨씬 더 친바스크적인 입장을 취한다면, 스페인 국민과 바스크인 사이의 화해와 공존으로 가는 험난한 길을 헤쳐 나가는 데 도움이 될 것입니다."
 SPR_tolerate_the_euskara: "바스크 허용"
 SPR_tolerate_the_euskara_desc: "바스크인은 스페인인이지만 그들의 관습과 언어는 우리와 크게 다릅니다. 그들이 우리나라에서 필수적인 역할을 한다는 점을 인정하는 것이 중요합니다. 관용의 길은 비토리아의 형제자매들과 겪고 있는 현재의 갈등을 누그러뜨리고 앞으로 나아가게 해 줄 것입니다."
 SPR_ban_the_basque: "Ban The Basque Language"
 SPR_ban_the_basque_desc: "1978년 헌법은 바스크어와 바스크 문화 집단을 우리나라에서 공인한 실수를 저질렀습니다. 먼저 바스크어를 스페인의 공용어에서 제외해야 합니다. 바스크어 인쇄 매체를 스페인어로 전환하고 학교에서 스페인어로 교육하도록 강제하면, 바스크 지방의 전환과 궁극적인 스페인화가 가능해질 것입니다."
 SPR_integrate_basque: "바스크 교육"
 SPR_integrate_basque_desc: "바스크인을 완전히 통합함으로써 바스크인에게 더 포용적인 나라를 만들 수 있습니다."
 SPR_konpromisoa: "협상"
 SPR_konpromisoa_desc: "콘프로미소아, 즉 타협은 정부가 바스크인과 교류할 때의 상징적인 표어가 되었습니다. 콘프로미소아는 이 지역의 미래 안정에 중요합니다."
 SPR_the_bilbao_convention: "빌바오 전통"
 SPR_the_bilbao_convention_desc: "빌바오는 바스크 지방 전체에서 가장 큰 도시입니다. 바스크어의 운명을 그들의 가장 발전한 도시에서 결정하는 것은 어울리는 일입니다."
 SPR_a_country_for_all: "모두를 위한 나라"
 SPR_a_country_for_all_desc: "스페인은 수많은 문화 집단과 지역으로 이루어진 나라입니다. 각각은 활기차며 문화와 생명력으로 가득합니다. 우리나라는 바스크인을 포함한 모든 사람의 터전입니다. 이를 모든 스페인 시민에게 분명히 알려야 합니다."
 SPR_mano_a_mano: "손에 손을 맞잡고"
 SPR_mano_a_mano_desc: "'마노 아 마노', 즉 '손에 손잡고'는 바스크인과 스페인 국민의 관용과 평화적 공존을 이야기하는 새로운 표어로 스페인에서 서서히 자리 잡고 있습니다."
 SPR_vascos_espanol_solidarity: "바스크-스페인 연대"
 SPR_vascos_espanol_solidarity_desc: "바스코, 즉 바스크인과 스페인 국민은 수 세기 동안 하나의 국가의 일부였습니다. 이 훌륭한 문화와 사람들을 스페인의 나머지 지역으로부터 고립시키는 수사를 바꾸고, 그들이 진정한 스페인인으로서 다시 주목받도록 해야 합니다."
 SPR_no_spainard_is_a_basque: "No Spaniard Is A Basque"
 SPR_no_spainard_is_a_basque_desc: "The Basque curse continues to plague our wonderful nation. It is time we start to picket against them and reiterate that no Spaniard is a Basque."
 SPR_galegos: "갈리시아"
 SPR_galegos_desc: "갈레고, 즉 갈리시아인은 스페인 북서부의 켈트-로망스계 민족 집단입니다. 이들은 남쪽 이웃인 포르투갈인과 밀접한 관련이 있습니다. 켈트계로 인정받고 간주되지만, 갈리시아어는 통속 라틴어에서 유래한 이베리아-로망스어로서 켈트적 정체성과 스페인의 영향이 뒤섞여 있습니다."
 SPR_ban_galician: "Ban Galician Language"
 SPR_ban_galician_desc: "갈리시아어는 과거 스페인인들이 국경 안에서 쓰이는 언어를 표준화하는 데 실패한 결과입니다. 이를 공식 지위에서 제거하고 스페인어를 강제함으로써, 갈리시아 지역을 진정한 스페인의 한 주로 통합하기 시작할 수 있습니다."
 SPR_the_lugo_list: "갈리시아에 대한 정보 수집"
 SPR_the_lugo_list_desc: "[SPR.GetLeader]의 지시를 받은 스페인 관리들이 반체제 인사들을 기록하고 갈리시아 주민들에게 취해야 할 가장 적절한 조치를 확정하기 위해 루고로 파견되었습니다."
 SPR_decimate_galician_culture: "갈리시아 문화 말살"
 SPR_decimate_galician_culture_desc: "[SPR.GetLeader]와(과) 정부는 이제 충분하다고 결정했습니다. 스페인은 문화와 언어에서 통일되어야 합니다. 문화적으로 우리의 땅을 통일할 준비를 하는 것은 위대한 우리나라의 미래를 닦기 위해 반드시 필요합니다."
 SPR_the_northern_citizenship_question: "북부 지역 시민권에 대한 의문"
 SPR_the_northern_citizenship_question_desc: "갈레고와 바스크인은 북부에서 너무 편안하게 지내 왔습니다. 정부는 북부 주민들에 대한 시민권법을 개정하기 위한 입법을 준비하고 있습니다."
 SPR_tolerate_the_galegos: "갈리시아 허용"
 SPR_tolerate_the_galegos_desc: "갈레고와 스페인의 나머지 지역은 상호 이해에 도달할 수 있습니다. 시간과 노력, 그리고 끊임없는 협상이 필요할 뿐입니다."
 SPR_adopt_galician: "Adopt Galician Language"
 SPR_adopt_galician_desc: "친갈리시아적 입장을 유지하면 갈리시아의 분리주의 운동과 좋은 조건에 도달하고 결국 그들과 화해할 수 있을 것입니다."
 SPR_compromiso: "협상 (Compromiso)"
 SPR_compromiso_desc: "갈레고와의 관계를 회복하려 앞으로 나아가는 데 있어 타협의 자세는 극히 중요할 것입니다."
 SPR_galician_integration: "갈리시아어 통합"
 SPR_galician_integration_desc: "교육 과정과 행정에서 갈리시아어의 통합을 더욱 진전시키는 것은 갈리시아 주민과 갈리시아의 분리주의에 대처하는 데 매우 유익할 것입니다."
 SPR_gallegos_espanol_solidarity: "갈리시아-스페인 연대"
 SPR_gallegos_espanol_solidarity_desc: "갈리시아의 형제자매들과 손을 맞잡고 걷는 것은 위대한 우리나라의 성장에 언제나 중요합니다."
 SPR_our_celtic_brothers: "우리 켈트의 형제여"
 SPR_our_celtic_brothers_desc: "우리 켈트계 주민들의 풍부하고 활기찬 문화는 우리 자신의 신념과 관계없이 어떠한 대가를 치르더라도 보존되어야 합니다."
 SPR_our_people_together: "손에 손잡고"
 SPR_our_people_together_desc: "나란히, 손에 손잡고 우리 국민은 지금도 앞으로도 함께 서 있습니다. 우리는 지금도 앞으로도 모두 스페인인입니다."
 SPR_canary_islands: "카나리아 제도"
 SPR_canary_islands_desc: "카나리아 제도는 수 세기 동안 스페인 왕실의 일부였습니다. 주민 대다수는 베르베르인과 스페인 이민자가 충돌하며 새로운 문화를 이룬 혼합 집단입니다. 이들은 역사 내내 간헐적으로 독립 운동을 벌여 왔습니다."
 SPR_the_canaries_movement: "카나리아 독립 운동"
 SPR_the_canaries_movement_desc: "카나리아 운동은 스페인령 카나리아 제도의 비교적 소규모 독립 운동입니다. 바스크 지방의 형제자매들에게 영감을 받아 지난 50년 동안 세를 얻었습니다."
 SPR_spanish_tax_haven: "스페인의 조세 피난지"
 SPR_spanish_tax_haven_desc: "카나리아 제도의 법령은 이 스페인 지역을 스페인 최고 부유층이 자산을 숨겨 두기에 매력적인 시장으로 만들어 줍니다."
 SPR_catalans: "카탈루냐"
 SPR_catalans_desc: "카탈루냐인(카탈라네스)은 스페인 북동부의 카탈루냐 지방과 프랑스 남부 지역 원주민인 민족 집단입니다. 이들은 카스티야 스페인어와 유사한 로망스계 민족이며, 이 지역의 핵심부에서 분리주의 운동이 커지고 있습니다."
 SPR_adopt_catalan: "Adopt Catalan Language"
 SPR_adopt_catalan_desc: "카탈루냐어를 스페인의 공용어로 장려하면 카탈루냐에서 커지는 분리주의 정서를 일부 해소하고 이 지역에 대한 우리의 장악력을 유지하는 데 도움이 될 것입니다."
 SPR_catalan_inclusion: "카탈루냐 수용"
 SPR_catalan_inclusion_desc: "카탈루냐어를 일상적인 행정에 더욱 통합하는 것은 카탈루냐인과의 관계를 개선하기만 할 것입니다."
 SPR_catala_i_espanyol: "카탈루냐와 스페인"
 SPR_catala_i_espanyol_desc: "나란히, 카탈라 이 에스파뇰, 우리는 혈육으로서 하나로 뭉쳐 서 있습니다."
 SPR_tolerate_the_catalanes: "카탈루냐 허용"
 SPR_tolerate_the_catalanes_desc: "카탈루냐인과 스페인인은 파란만장한 과거를 겪었지만, 그들을 관용하고 우리가 서로 다르더라도 여전히 스페인 시민이라는 점을 더욱 강조하는 것이 최선입니다."
 SPR_compromis: "협상"
 SPR_compromis_desc: "카탈루냐인과의 관계를 회복하려 앞으로 나아가는 데 있어 타협의 자세는 극히 중요할 것입니다."
 SPR_catalanes_agreements: "카탈루냐 협약"
 SPR_catalanes_agreements_desc: "카탈루냐인과 새로운 협정을 체결하면 중앙 정부와 카탈루냐인 사이에 더욱 우호적인 관계가 확고해질 것입니다."
 SPR_catalan_espanol_solidarity: "카탈루냐-스페인 연대"
 SPR_catalan_espanol_solidarity_desc: "비록 서로 다른 문화를 따르지만 우리는 여전히 함께 서 있습니다."
 SPR_ban_catalan: "Ban Catalan Language"
 SPR_ban_catalan_desc: "카탈루냐어라는 잘못된 언어를 금지하면 이 위대한 나라에 평화가 찾아올 것입니다."
 SPR_barcelonian_reconciliation: "바르셀로나와의 화해"
 SPR_barcelonian_reconciliation_desc: "마드리드와 바르셀로나 사이의 분열을 화해시키면 이 나라에 안정이 찾아올 것입니다."
 SPR_castilian_barcelona: "카스티야의 바르셀로나"
 SPR_castilian_barcelona_desc: "카탈루냐에서는 카스티야 스페인어가 표준이 될 것입니다. 바르셀로나에 누가 그들을 다스리는지 상기시켜 줄 때입니다."
 SPR_andaluces: "안달루시아"
 SPR_andaluces_desc: "안달루시아인은 스페인 남부 자치 공동체 원주민인 유럽 민족 집단입니다."
 SPR_seville_pact: "세비야 조약"
 SPR_seville_pact_desc: "세비야와 자치 공동체의 나머지 지역이 방침에 따르도록 보장하는 새로운 협약에 서명해야 합니다."
 SPR_eliminate_the_andaluces: "안달루시아 제거"
 SPR_eliminate_the_andaluces_desc: "이 나라를 영광의 시절로 되돌리려면 지역 정체성을 포기해야 합니다. 안달루시아 분리주의자들에게 노력을 집중하여 그들을 굴복시키고, 그들의 충성이 어디에 있어야 하는지 분명히 알게 해야 합니다."
 SPR_the_south_citizenship_reform: "남부 지역 시민권 개혁"
 SPR_the_south_citizenship_reform_desc: "안달루시아인과 카탈루냐인은 분리주의적 견해를 거부해야 하며, 그렇지 않으면 시민권이 박탈될 수 있습니다."
 SPR_tolerate_the_andaluces: "안달루시아 허용"
 SPR_tolerate_the_andaluces_desc: "그저 우리와 나란히 살도록 내버려 두어야 합니다. 안달루시아인도 다른 모든 이들과 마찬가지로 스페인인입니다."
 SPR_compromico: "협상"
 SPR_compromico_desc: "안달루시아인과의 관계를 회복하려 앞으로 나아가는 데 있어 타협의 자세는 극히 중요할 것입니다."
 SPR_andaluces_espanol_solidarity: "안달루시아 스페인 연대"
 SPR_andaluces_espanol_solidarity_desc: "안달루시아인과 스페인인은 긴밀히 연결되어 있으며, 수 세기에 걸친 안달루시아 통치는 훨씬 쉬운 연대 입장을 제시합니다."
 SPR_the_union_of_languages: "언어의 연합"
 SPR_the_union_of_languages_desc: "안달루시아어는 스페인어의 한낱 방언이지만 차이는 분명히 존재합니다. 안달루시아어를 강조하고 스페인의 공식 언어로 선언하면, 다민족 국가를 계속 유지하면서 모든 형태의 적대감을 종식할 수 있을 것입니다."
 SPR_the_old_ways: "과거의 수단"
 SPR_the_old_ways_desc: "스페인 군주들은 언제나 스페인 국민의 최선의 이익을 위해 봉사해 왔습니다. 이제 왕좌에 권력을 돌려주고 그들이 앞으로 우리를 이끌도록 할 때입니다."
 SPR_question_of_thrones: "왕좌에 대한 의문"
 SPR_question_of_thrones_desc: "어느 왕가가 우리를 미래로 이끌 것인가를 정하는 미묘한 문제는 의견이 갈리는 사안입니다. 부르봉 가문과 카를로스파가 가장 직접적인 선택지입니다. 이제 현상을 유지할지, 새로운 왕조로 전환할지 결정할 때입니다."
 SPR_emphasize_the_throne: "Emphasize The Throne"
 SPR_emphasize_the_throne_desc: "왕좌는 이 위대한 나라에서 가장 중요한 존재입니다. 그 중요성을 강조해야 합니다."
 SPR_rights_of_the_king: "왕의 권리"
 SPR_rights_of_the_king_desc: "국왕과 왕실은 우리의 공식적인 지배 계층입니다. 국왕의 권리를 분명히 보여 주어야 합니다."
 SPR_monarcho_revisionism: "Monarcho-Revisionism"
 SPR_monarcho_revisionism_desc: "스페인에서 군주제에 관한 논의가 일상화됨에 따라, 우리는 집단이 따라갈 길을 제시하기 위해 과거를 재검토해야 합니다."
 SPR_undermine_the_republic: "공화국 폄하"
 SPR_undermine_the_republic_desc: "공화국은 지난 몇 년간 국민에게 가난과 고난 외에는 아무것도 주지 못했으며, 우리는 가능한 모든 수단을 동원하여 이를 대중에게 부각해야 합니다."
 SPR_the_constitution_reformed: "헌법 개혁"
 SPR_the_constitution_reformed_desc: "1978년 헌법이 비효율적임이 입증된 만큼, 이제 권한을 쥐었으니 헌법을 개정하는 것이 가장 먼저 해야 할 일입니다."
 SPR_expand_royal_guard: "근위병 확장"
 SPR_expand_royal_guard_desc: "근위대는 지극한 충성과 전문성으로 우리 군주들을 섬겨 왔습니다. 그 규모를 확대함으로써 필요할 때마다 정예 병력을 마음대로 쓸 수 있도록 할 수 있습니다."
 SPR_constitutional_monarchy: "입헌 군주정"
 SPR_constitutional_monarchy_desc: "우리의 군주조차 헌법의 규칙을 따라야 하며, 이는 무엇보다 국가 단결을 보장할 것입니다."
 SPR_retain_democracy: "민주주의 보존"
 SPR_retain_democracy_desc: "민주주의는 현대 스페인의 가장 중요한 기둥 중 하나이며, 이를 보호받는 권리로 확립하면 국민이 통치에 더 많은 지지를 보낼 것입니다."
 SPR_revise_the_process: "체계 수정"
 SPR_revise_the_process_desc: "절차를 재검토하면 단기적, 장기적으로 어떤 조치를 취할지 결정할 수 있으며, 과거에 저지른 실수를 파악하여 때가 되면 바로잡을 수 있기를 기대할 수 있습니다."
 SPR_a_benevolent_monarch: "자애로운 군주"
 SPR_a_benevolent_monarch_desc: "자비는 모든 군주가 갖추어야 할 덕목이며, 우리의 군주는 내리는 모든 결정에서 이 논리를 지킬 것입니다."
 SPR_solidify_positioning: "입장을 확고히"
 SPR_solidify_positioning_desc: "나라의 안정을 보장하는 방편으로 우리의 입장을 확고히 해야 합니다."
 SPR_a_throne_for_people: "국민을 위한 왕좌"
 SPR_a_throne_for_people_desc: "We should rule for the people, instead of ruling the people. If we follow those words, we will always be on the good side of the populace."
 SPR_every_man_a_king: "모두가 왕처럼"
 SPR_every_man_a_king_desc: "나라의 모든 사람이 왕실과 동일한 기준을 적용받도록 보장하면, 모두가 평등한 완전한 국가 단결로 향하는 길로 나아갈 것입니다."
 SPR_the_new_elections: "새로운 선거"
 SPR_the_new_elections_desc: "나라에 새로운 선출 절차를 마련해야 하며, 이는 국민이 승인하지 않는 한 종신 통치자가 나오지 않도록 보장할 것입니다."
 SPR_the_throne_and_the_state: "왕좌와 국가"
 SPR_the_throne_and_the_state_desc: "군주들은 변화를 이루기로 결심했습니다. 입헌주의는 우리의 위대한 나라를 거듭 실망시켰습니다. 이제 절대주의로 돌아가 위대한 나라의 영광을 되찾을 때입니다."
 SPR_annihilate_parliament: "의회 제거"
 SPR_annihilate_parliament_desc: "의회는 우리나라의 재앙이며, 이 비대해진 질병을 제거해야만 새로운 시대로 나아갈 수 있습니다."
 SPR_heads_will_roll: "절대로 넘어가지 않는다"
 SPR_heads_will_roll_desc: "우리에게 맞서는 자들은 처형자의 손에 신속한 죽음을 맞이할 것입니다."
 SPR_royal_academies: "왕립 교육원"
 SPR_royal_academies_desc: "아카데미에 투자하면 왕실이 앞으로의 학문적 목표를 달성하는 데 도움이 될 것입니다."
 SPR_the_lord_wills_it: "하늘의 뜻"
 SPR_the_lord_wills_it_desc: "하느님께서는 우리에게 나라를 되찾을 의지와 왕좌를 되찾을 능력을 공식화할 힘을 주셨습니다."
 SPR_divine_right: "신성한 권리"
 SPR_divine_right_desc: "하느님께서는 우리에게 스페인을 통치할 왕권신수의 권리를 주셨습니다. 우리는 교황의 승인을 받았으며, 하느님의 은총으로 우리나라를 지지 않는 지평선으로 이끌 것입니다."
 SPR_the_horizon_never_sets: "지지않는 수평선"
 SPR_the_horizon_never_sets_desc: "혹자는 대영제국에는 해가 지지 않는다고 말합니다. 스페인 제국에는 지지 않는 지평선이 있습니다."
 SPR_spanish_supremacy: "스페인의 패권"
 SPR_spanish_supremacy_desc: "스페인 국민은 무엇보다 굳건히 서 있습니다. 그들은 마드리드의 몰락을 바라는 자들보다 더 높이 서 있습니다. 스페인은 최고이며 스페인 국민은 그 무엇보다 위에 있습니다."
 SPR_reinforce_the_throne: "왕권 강화"
 SPR_reinforce_the_throne_desc: "우리는 왕좌를 위한 많은 추종자와 지지를 얻었습니다. 그러나 왕관이 직면한 불안한 입지를 강화하는 것은 필수적입니다."
 SPR_estatuto_fundamental_de_la_monarquia: "군주의 근본적인 법령"
 SPR_estatuto_fundamental_de_la_monarquia_desc: "군주제 기본법은 왕권의 권리와 특권을 확대하는 공식 칙령입니다. 정부에 대한 통제를 한층 확립하고, 스페인을 왕관이 다스리는지에 대한 모든 추측을 불식시킵니다."
 SPR_declare_the_iberian_union: "이베리아 연방 선포"
 SPR_declare_the_iberian_union_desc: "이베리아 연합을 선언하면 우리를 둘러싼 국가들에 힘이 될 것입니다. 우리는 함께 있을 때 가장 강하며, 따라서 연합이 선언되어야 합니다."
 SPR_reform_the_military: "왕립군"
 SPR_reform_the_military_desc: "군의 목적은 왕관을 섬기는 것입니다. 충성이 없으면 우리 군은 아무 의미가 없습니다."
 SPR_a_king_for_every_spaniard: "A King For Every Spaniard"
 SPR_a_king_for_every_spaniard_desc: "우리의 왕관은 스페인의 모든 국민을 위한 것입니다. 모든 스페인인을 위한 국왕."
 SPR_demand_andorra: "안도라 요구"
 SPR_demand_andorra_desc: "안도라는 13세기부터 프랑스와 우리나라 모두로부터 독립된 국가였습니다. 그러나 이 작은 초소국은 허약한 자체 행정으로부터 보호를 필요로 합니다. 이제 이 작은 나라가 양보하고 영원히 스페인이 되도록 요구할 때입니다."
 SPR_seize_the_portuguese_throne: "포르투갈 왕좌 장악"
 SPR_seize_the_portuguese_throne_desc: "포르투갈의 왕좌는 곧 우리의 것이 될 것입니다. 서쪽 이웃에 대한 우리의 권리를 주장하고 이 영토를 영원히 되찾을 때입니다."
 SPR_the_new_nobility: "새로운 곡귀함"
 SPR_the_new_nobility_desc: "귀족 통치는 오래전에 끝났으나, 이제 새로운 귀족을 개혁할 때입니다."
 SPR_royal_oligarchy: "충성한 올리가르히"
 SPR_royal_oligarchy_desc: "과두제를 우리 법제의 공식적인 일부로 다시 도입해야 합니다."
 SPR_solidify_the_iberian_union: "이베리아 연방 연대"
 SPR_solidify_the_iberian_union_desc: "이베리아 연합은 스페인의 통치 아래 공고해져야 합니다. 새로운 미래와 새로운 길을 맞이할 준비를 할 때입니다."
 SPR_reinforce_melilla: "멜리야 강화"
 SPR_reinforce_melilla_desc: "멜리야는 모든 종류의 증원이 절실합니다. 이 도시의 기반시설과 방어에 투자하는 것은 지브롤터 해협에 대한 우리의 통제에 큰 도움이 될 것입니다."
 SPR_entrench_ceuta: "세우타 강화"
 SPR_entrench_ceuta_desc: "세우타는 불안정한 처지에 있으며, 우리의 돌출 지역 주변에 요새를 구축하는 것이 중요합니다."
 SPR_demand_the_rock: "지브롤터 요구"
 SPR_demand_the_rock_desc: "지브롤터는 우리가 가장 약했을 때 영국이 우리 땅을 빼앗아 간 일을 떠올리게 하는 사무치는 기억입니다. 이를 되찾는 것은 우리의 가장 위대한 성공 중 하나가 될 것입니다. 국왕과 스페인을 위하여!"
 SPR_plus_ultra: "더 멀리 (Plus Ultra)"
 SPR_plus_ultra_desc: "플루스 울트라는 라틴어 문구이자 스페인의 국가 표어입니다. 이는 단순히 \\"더 멀리\\"라는 뜻이며, 스페인 국민은 이 표어를 한 치의 어긋남 없이 따릅니다.  우리의 깃발과 문장에는 이 표어가 새겨져 있으며, 이것이 우리가 어디서 왔는지를 상기시켜 준다는 점이 중요합니다."
 SPR_the_grand_conquista: "대 정복 (Grand Conquista)"
 SPR_the_grand_conquista_desc: "머지않아 우리는 위대한 정복에 나서 한때 우리에게서 찢겨 나간 영광을 되찾을 것입니다."
 SPR_guardia_real: "새로운 왕립 근위대"
 SPR_guardia_real_desc: "왕실 근위대를 되살리고 훨씬 더 큰 전투 병력으로 확대하는 것은 왕관의 야망을 더욱 진전시키는 데에만 도움이 될 것입니다."
 SPR_the_spanish_empire_revived: "스페인 제국의 부활"
 SPR_the_spanish_empire_revived_desc: "우리 제국은 한때 바다를 가로질러 뻗어 있었으며, 따라서 재건될 자격이 있습니다."
 SPR_the_hand_that_reaches: "손이 닿는 그곳까지"
 SPR_the_hand_that_reaches_desc: "한때 잃어버린 땅에 손을 뻗으면서, 스페인의 손은 서서히 그것을 움켜쥐기 위해 움직이고 있습니다."
 SPR_seize_the_maghreb: "마그레브 장악"
 SPR_seize_the_maghreb_desc: "마그레브의 베르베르인들은 우리의 위대한 군대에 정복되기만을 기다리고 있을 뿐입니다. 그들의 수도로 진군하여 우리의 깃발 아래 통합하는 것은 모두에게 평화와 번영만을 가져다줄 것입니다."
 SPR_burn_buenos_aires: "부에노스아이레스를 불바다로 만들어라"
 SPR_burn_buenos_aires_desc: "부에노스아이레스는 퇴폐이며, 이른바 민주주의라는 관념은 실패작입니다. 아르헨티나가 우리 위대한 제국의 손아귀로 돌아오는 가운데, 이 도시는 항복하거나 불길을 맞이할 것입니다."
 SPR_reach_for_cuba: "쿠바에 닻을 내려라"
 SPR_reach_for_cuba_desc: "쿠바는 우리 히스파니올라 부왕령의 소재지였습니다. 이곳은 카리브해에서 우리의 모든 권력을 집중시키고 있었습니다. 우리의 깃발이 다시 한번 하바나의 도시와 거리 곳곳에 휘날릴 것입니다."
 SPR_seize_colombia: "콜롬비아 장악"
 SPR_seize_colombia_desc: "부패한 콜롬비아 정부는 자국민을 다스릴 자격이 없습니다. 그들은 위대한 제국의 새로운 영토로서 왕관에 복귀해야 합니다."
 SPR_the_crown_jewel: "왕관에 빛나는 보석"
 SPR_the_crown_jewel_desc: "옛 스페인 제국의 왕관의 보석은 누에바 에스파냐 부왕령이었습니다. 우리는 이 왕관의 보석을 되찾아 예전의 모습으로 재건해야 합니다."
 SPR_anti_corruption_campaigns: "반부패 운동"
 SPR_anti_corruption_campaigns_desc: "부패는 스페인의 거대한 문제였으며, 한 번에 하나의 캠페인씩 이를 끝내도록 해야 합니다."
 SPR_the_underhanded_deals: "비밀 거래"
 SPR_the_underhanded_deals_desc: "스페인에는 \\"뒷거래\\"가 수없이 많았으며, 이러한 거래를 조사하면 우리나라를 괴롭히는 부패에 대해 절실히 필요한 통찰을 얻을 수 있습니다."
 SPR_faith_in_the_system: "체제에 대한 믿음"
 SPR_faith_in_the_system_desc: "국민에게 우리 제도를 다시 신뢰할 이유를 주어야 합니다."
 SPR_conservative_leanings: "보수적인 경향"
 SPR_conservative_leanings_desc: "스페인은 여러 면에서 역사적으로 보수적인 국가입니다. 이러한 성향을 활용하여 현재 국가의 궤도를 유지하는 것이 중요합니다."
 SPR_the_welfare_state: "복지 국가"
 SPR_the_welfare_state_desc: "스페인 복지 국가에 대해 보다 보수적인 시각을 유지하면 예산 개선의 여지가 생기고, 스페인의 가장 가난한 이들이 필요한 도움을 받도록 보장할 수도 있습니다."
 SPR_coalition_of_conservatives: "보수주의의 연립"
 SPR_coalition_of_conservatives_desc: "스페인이 좌파에 넘어가지 않도록 하려면 보다 극단적인 세력과 온건 세력이 함께 뭉쳐야 합니다. 우리는 보수 연립을 구성해야 합니다."
 SPR_economic_deregulation: "경제 완화"
 SPR_economic_deregulation_desc: "관료적 형식주의 등을 대폭 줄이면 경제를 성장시킬 충분한 기회를 얻게 될 것입니다."
 SPR_family_first: "가족 우선"
 SPR_family_first_desc: "가족과 가족의 가치는 언제나 그 무엇보다 우선해야 합니다. 사람들이 이를 이해하도록 해야 하며, 그렇지 않으면 스페인은 정체성을 잃게 될 것입니다."
 SPR_the_labour_unions: "노동조합"
 SPR_the_labour_unions_desc: "노동조합은 국민이 공정한 대우를 받도록 보장하는 훌륭한 수단입니다. 노동조합을 지원하는 것은 성장하는 경제에 필수적입니다."
 SPR_party_of_the_people: "시민의 정당"
 SPR_party_of_the_people_desc: "우리는 국민의 정당입니다. 우리는 스페인에 해가 될 어떠한 일도 하지 않습니다."
 SPR_corporate_tax_heaven: "Corporate Tax Haven"
 SPR_corporate_tax_heaven_desc: "다른 기업과 부유층이 스페인에 투자하도록 장려하는 것은 매우 수익성이 높을 수 있습니다."
 SPR_spain_is_catholic: "스페인은 카톨릭의 후예"
 SPR_spain_is_catholic_desc: "가톨릭 유산을 강조하는 것은 우리의 문화와 미래 모두에 필수적입니다. 수 세기 동안 유지해 온 지침을 저버리는 것은 실수일 뿐 아니라 스페인 정체성에 대한 공격입니다."
 SPR_the_lgbtqa_stance: "성소수자에 대한 입장"
 SPR_the_lgbtqa_stance_desc: "과거 스페인은 LGBTQIA에 대해 역사적으로 강경한 입장을 취해 왔습니다. 이제 우리의 입장을 바꾸어 새로운 입장으로 나아갈지, 현상을 유지할지 결정할 때일지도 모릅니다."
 SPR_reinforce_the_spanish_identity: "스페인 자주성 강화"
 SPR_reinforce_the_spanish_identity_desc: "헌법이 규정한 대로 스페인 정체성을 강화해야 하며, 그렇지 않으면 우리 자신의 작은 일부를 잃을 수 있습니다."
 SPR_minimize_bureaucracy: "관료 체계 최소화"
 SPR_minimize_bureaucracy_desc: "관료제가 이탈리아식 질병으로 비대해지고 부담이 되지 않도록 함으로써 우리는 앞으로 나아갈 수 있습니다."
 SPR_conservative_education_reforms: "보수주의 교육 개혁"
 SPR_conservative_education_reforms_desc: "교육 일정을 개정하고 불필요한 부가 과목 없이 가장 중요한 과목만 가르치도록 하는 것은 교육을 정상 궤도에 유지하는 데 필수적입니다."
 SPR_environmental_deregulations: "Environmental Deregulations"
 SPR_environmental_deregulations_desc: "환경 조치에 대한 규제를 완화하는 것은 기업에는 매우 수익성이 높겠지만 국민에게는 몹시 인기가 없습니다."
 SPR_bible_study: "성서학"
 SPR_bible_study_desc: "스페인은 본질적으로 가톨릭 국가이며, 학생들이 올바른 종교 교육을 받도록 하는 것은 대단히 중요합니다."
 SPR_support_the_unions: "조합에 대한 지지"
 SPR_support_the_unions_desc: "노동조합은 스페인의 근간입니다. 노동조합의 추진력을 유지하는 것은 우리 정부에 성공을 가져다줄 뿐입니다."
 SPR_encourage_deeper_unionization: "전면적인 조합조직 장려"
 SPR_encourage_deeper_unionization_desc: "스페인의 일부 사람들은 여전히 노동조합 가입을 꺼립니다. 그들에게는 약간의 추가적인 자극이 필요할지도 모릅니다."
 SPR_the_european_model: "유럽의 견본"
 SPR_the_european_model_desc: "다른 유럽인들의 집단적 태도를 유지하는 데 도움을 주고 이를 우리의 노동조합 조치에 도입해야 합니다."
 SPR_our_healthcare: "우리의 의료 복지 체계"
 SPR_our_healthcare_desc: "보건 분야에서 좀 더 전통적인 입장을 취한다고 해서 해가 될 사람은 아무도 없습니다."
 SPR_union_of_church_and_state: "교회와 국가의 연합"
 SPR_union_of_church_and_state_desc: "우리의 통치가 올바르고 모든 스페인 국민에게 이로운 것이 되도록 교회와 국가는 더욱 가까워져야 합니다."
 SPR_pull_yourself_up_by_the_bootstrap: "스스로 성장하라"
 SPR_pull_yourself_up_by_the_bootstrap_desc: "정부에 대한 의존을 줄이고 스스로 일어서는 자립 정신을 심어 주는 것은 우리나라에 더 큰 성공을 장려할 뿐입니다. 미국인들이 한 가지는 옳았다는 것이 분명합니다."
 SPR_rejection_of_the_left: "서부에 대한 거부"
 SPR_rejection_of_the_left_desc: "서부에 대한 거부"
 SPR_revised_military_interventionism: "군사 개입주의 개혁"
 SPR_revised_military_interventionism_desc: "스페인은 너무 오랫동안 그늘에 머물러 왔습니다. 이제 우리 군이 세계 곳곳의 더 많은 평화유지 임무에서 활동하며 우리의 외교 정책을 관철할 때입니다."
 SPR_officer_investiture: "장교 임관식"
 SPR_officer_investiture_desc: "장교단과 참모진에 투자하는 것은 우리의 시간과 돈, 노력을 쓰기에 좋은 일입니다."
 SPR_spanish_patriot_act: "스페인 애국법"
 SPR_spanish_patriot_act_desc: "미국의 애국자법을 본떠 만든 이 법은 이슬람 테러리즘에 맞선 우리의 투쟁을 돕기 위한 것입니다."
 SPR_eliminate_the_siesta: "낮잠 정책 (시에스타) 제거"
 SPR_eliminate_the_siesta_desc: "시에스타는 더 큰 경제 발전을 장려하는 데 무익한 방식이었습니다. 이를 폐지하고 이러한 무익한 관행을 막기 위해 노동력에 대해 더 엄격한 조치를 시행하십시오."
 SPR_viva_espana: "스페인 만세"
 SPR_viva_espana_desc: "비바 에스파냐(스페인 만세)는 집권당이 국가에 점점 더 보수적인 개혁을 밀어붙이면서 내건 표어가 되었습니다. 스페인은 보수적인 지도력 아래 번영할 것입니다."
 SPR_europe_now_and_forever: "언제나 영원히 유럽과 함께"
 SPR_europe_now_and_forever_desc: "우리는 유럽과 함께할 때 가장 강합니다. 우리는 연합과 그것이 가져다주는 모든 것과 함께합니다."
 SPR_eu_spanish_alignment: "유럽연합-스페인 연대"
 SPR_eu_spanish_alignment_desc: "스페인의 정책은 보다 큰 유럽 연합 정책과 더욱 일치해야 합니다. 이러한 관계를 유지하는 것은 스페인의 가치를 지키는 것만큼이나 중요합니다."
 SPR_spanish_first_europe_second: "유럽연합의 머리 꼭대기에"
 SPR_spanish_first_europe_second_desc: "우리가 유럽 연합에서 보다 적극적인 역할을 맡게 되었지만, 스페인이 유럽 연합보다 우선하도록 하는 것은 여전히 중요합니다."
 SPR_pro_eu_campaigns: "유럽연합에 우호적인 운동"
 SPR_pro_eu_campaigns_desc: "유럽은 우리가 협력할 때 가장 강합니다. 유럽 연합을 지지하는 캠페인을 벌이면 여론을 EU에 우호적으로 돌리는 데 도움이 될 수 있습니다."
 SPR_western_allignment: "서방과 연대"
 SPR_western_allignment_desc: "우리는 서방과의 연대에 확고히 뿌리를 두고 있도록 해야 합니다."
 SPR_a_dominant_role: "주도적 역할"
 SPR_a_dominant_role_desc: "스페인은 유럽 연합에서 주도적인 역할을 맡도록 해야 합니다. 우리는 EU 최고의 지도국 중 하나가 될 것입니다."
 SPR_the_drift_from_europe: "유럽과 결별"
 SPR_the_drift_from_europe_desc: "스페인은 브뤼셀의 진보적 폭군들로부터 벗어나야 합니다. 비록 그들로부터 큰 이익을 얻고 있지만, 이 연합에 대한 의존을 줄여야 한다는 점은 여전히 유념해야 합니다."
 SPR_the_iberian_standards: "이베리아의 기준"
 SPR_the_iberian_standards_desc: "우리 경제에서 이베리아 표준을 강조하면 연합과 거리를 둘 수 있을 것입니다."
 SPR_revival_of_golden_shares: "황금주의 부활"
 SPR_revival_of_golden_shares_desc: "스페인 경제에 금본위제와 황금주를 부활시킵니다."
 SPR_spanish_euroscepticism: "스페인의 유럽회의주의"
 SPR_spanish_euroscepticism_desc: "우리는 연합에 대해 회의적인 태도를 유지해야 합니다. 다른 나라들이 우리의 정책을 좌우한다는 것은 어딘가 이상합니다."
 SPR_euro_more_like_europoor: "거지같은 유로화"
 SPR_euro_more_like_europoor_desc: "유럽? 오히려 유러푸어죠! 그렇지 않나, 친구들?"
 SPR_spexit: "스펙시트 (Spexit)"
 SPR_spexit_desc: "스페인이 유럽 연합이라는 암에서 물러날 때가 왔습니다. 우리는 유럽 연합에서 벗어나 새로운 스페인의 미래를 향한 길을 나설 것입니다."
 SPR_renacimiento_nacionalista: "민족주의 황금기"
 SPR_renacimiento_nacionalista_desc: "스페인의 온건 보수 세력은 우리나라를 보호하기에 충분히 나아가지 못하고 있습니다. 그들은 우리를 실망시켰으며, 우리는 미래를 내다보며 이 잘못을 바로잡아야 합니다."
 SPR_spread_right_wing_propaganda: "우파 선전 확대"
 SPR_spread_right_wing_propaganda_desc: "진보 독재는 너무 오랫동안 영향력을 행사해 왔습니다. 국민은 스페인 정체성을 다시 한번 믿어야 합니다."
 SPR_support_of_the_right: "우파의 지지"
 SPR_support_of_the_right_desc: "스페인의 보수 세력을 통합하는 것은 정부가 모양을 갖추어 감에 따라 유익하고 결실 있는 사업이 될 것입니다."
 SPR_pin_parental_education: "부모 교육 강조"
 SPR_pin_parental_education_desc: "핀 페어런탈 교육은 공립학교가 제공하는 특정 과목에서 자녀를 빼낼 수 있는 부모의 권리입니다. 이는 청소년의 교육에서 정부의 선택보다 부모의 선택을 우선시합니다."
 SPR_rise_of_nativism: "선천설 (Nativism) 부활"
 SPR_rise_of_nativism_desc: "토착주의라는 개념은 합법이든 불법이든 모든 이민자보다 출생 시민을 우선시하는 정책입니다. 스페인은 순수 혈통 스페인인의 것이며 우리는 우리 자신을 먼저 돌봐야 합니다."
 SPR_the_natalist_view: "출산 촉진주의 관점"
 SPR_the_natalist_view_desc: "출산 장려주의적 관점은 낙태 반대와 출산 장려의 입장입니다. 낙태와 유사한 정책을 어떻게 할지 결정하는 과정에서 우리 정부는 출산 장려주의에 대한 입장을 정해야 합니다."
 SPR_anti_immigration_policies: "반이민 정책"
 SPR_anti_immigration_policies_desc: "더 많은 반이민 정책을 시행하면 스페인 정체성을 건재하게 유지할 수 있습니다."
 SPR_a_party_with_a_union: "조합과 함께하는 정당"
 SPR_a_party_with_a_union_desc: "우리 정당은 우리와 같은 이념을 지지하는 노동조합을 결성해야 합니다. 이는 더 많은 당원을 확보하게 하고 더 많은 사람을 우리 대의로 이끄는 데 도움이 될 수 있습니다."
 SPR_reinforce_protectionism: "보호주의 강화"
 SPR_reinforce_protectionism_desc: "경제는 취약하며 우리는 이를 보호해야 합니다. 일자리와 자원 등은 해외가 아닌 이곳 스페인에서 생산되어야 합니다. 이제 일자리와 경제가 스페인으로 돌아와 머물 때입니다."
 SPR_state_sponsored_unions: "국가 후원 조합"
 SPR_state_sponsored_unions_desc: "우리 정당의 노조는 강력하지만, 올바른 이념을 유지하는 우리가 선택한 노조를 더 많이 후원하면 노조 사이에서 우리 지지가 계속 커질 것입니다."
 SPR_support_our_people: "시민들을 위해"
 SPR_support_our_people_desc: "모든 경우에 국민에게 투자하고 지원하는 것은 정치인으로서 우리의 의무입니다."
 SPR_military_expansion: "군 확장"
 SPR_military_expansion_desc: "강력한 군대가 세상을 움직입니다."
 SPR_secure_our_borders: "국경 수비"
 SPR_secure_our_borders_desc: "명확히 정해지고 방비된 국경은 우리를 해치려는 모든 이들로부터 국가의 주권을 보장합니다."
 SPR_entrench_african_holdings: "아프리카 영토 강화"
 SPR_entrench_african_holdings_desc: "세우타와 멜리야는 지중해 건너 모로코와 접한 위험한 위치에 있습니다. 이 영토들을 요새화하면 분쟁이 일어나더라도 확고히 우리 손에 남도록 보장할 수 있습니다."
 SPR_el_problema_de_gibraltar: "지브롤터 문제"
 SPR_el_problema_de_gibraltar_desc: "지브롤터 문제는 수 세기 동안 스페인을 괴롭혀 왔습니다. 이제 지브롤터를 되찾고 18세기 이래 스페인을 뒤흔든 속박을 끝내려 노력할 때입니다."
 SPR_mobilize_the_populace: "대중 동원"
 SPR_mobilize_the_populace_desc: "우리 군과 국가를 지지하도록 민중을 동원하는 것은 국가를 강화하는 데 도움이 될 것입니다."
 SPR_the_state_above_all: "무엇보다 국가"
 SPR_the_state_above_all_desc: "국가와 국가에 대한 충성은 그 무엇보다 앞섭니다."
 SPR_spain_anew: "다시, 스페인"
 SPR_spain_anew_desc: "스페인은 새롭게 개혁되어야 합니다. 이 나라를 이전보다 더 나은 모습으로 개혁할 때입니다."
 SPR_a_softer_stance: "부드러운 입장"
 SPR_a_softer_stance_desc: "분리주의자들에 대해 보다 유화적인 입장을 취하면 우리와 이웃 사이에 어느 정도 화해가 이루어질 수 있습니다."
 SPR_negotiate_with_the_parties: "정당과의 타협"
 SPR_negotiate_with_the_parties_desc: "여러 분리주의 정당과 협상하면 취약한 우리 국가에 작은 안정감을 불어넣을 수 있습니다. 우리나라의 여러 문화를 자극하는 것은 해만 가져올 뿐입니다."
 SPR_catalonian_concessions: "카탈루냐에 대한 양보"
 SPR_catalonian_concessions_desc: "카탈루냐인에게 어떤 식으로든 양보하면 당분간은 그들을 만족시킬 수 있을 것입니다..."
 SPR_one_with_the_basque: "바스크와 하나되어"
 SPR_one_with_the_basque_desc: "우리는 ETA의 무분별한 테러리즘에 반대해 온 과거가 있습니다만... 그럼에도 불구하고 그들을 스페인인으로 인정하는 것은 중요합니다."
 SPR_unionization_of_faith: "믿음의 조직화"
 SPR_unionization_of_faith_desc: "스페인의 노동조합은 가톨릭을 옹호해야 합니다. 하느님은 인류에게 노조를 결성할 권리를 주셨습니다."
 SPR_reinforce_the_castle_doctrine: "성의 원칙 (Castle Doctrine) 강화"
 SPR_reinforce_the_castle_doctrine_desc: "정당방위 확장법은 현재 스페인에 도입되어 있지 않습니다. 이 원칙을 강화하면 사람들이 정당하게 자신의 것을 지킬 수 있다는 사실이 밝혀질 것입니다."
 SPR_funding_for_police: "경찰 자금 지원"
 SPR_funding_for_police_desc: "경찰이 맡은 임무를 완수하려면 추가 자금이 필요합니다."
 SPR_the_identity_of_spain: "스페인의 주체"
 SPR_the_identity_of_spain_desc: "위대한 우리나라의 정체성을 강화하고 우리가 이룰 수 있는 위대함을 강조하면, 스페인이 다시 한번 어떤 나라가 될 수 있는지 세계에 보여 줄 것입니다."
 SPR_authoritarianism_by_law: "Authoritarianism By Law"
 SPR_authoritarianism_by_law_desc: "소수 정당이 더 이상 의회에 대표되지 못하도록 선거 장벽을 높이면 우리의 입지를 공고히 하는 데 도움이 될 것입니다."
 SPR_minority_rights: "소수자 권리"
 SPR_minority_rights_desc: "소수자 권리는 좋게 말해도 의문스럽습니다. 그중 일부를 바꾸는 방안을 검토해야 합니다."
 SPR_reject_the_progressive_dictatorship: "진보 독재주의 거부"
 SPR_reject_the_progressive_dictatorship_desc: "스페인을 장악한 진보 독재는 거부되어야 하며 우리는 전통을 받아들여야 합니다."
 SPR_hispanidad: "스페인주의 (Hispanidad)"
 SPR_hispanidad_desc: "이스파니다드는 스페인어와 히스패닉 문화를 공유하는 사람들, 국가, 공동체의 집단을 가리키는 용어입니다. 이 용어를 활용하면 우리의 옛 영토였던 국가들에 대한 더 많은 개입과 통제를 여전히 추진할 수 있습니다."
 SPR_rechazemos_los_anti_espanoles: "Rechacemos Los Anti Españoles"
 SPR_rechazemos_los_anti_espanoles_desc: "반스페인 세력을 영원히 거부할 때입니다. 이 나라와 이 나라의 문화를 훼손하려는 자들 말입니다."
 SPR_incondicionalismo: "절대주의 (Unconditionalism)"
 SPR_incondicionalismo_desc: "우리는 우리를 협박하려는 자들에게 양보하지 않을 것입니다. 우리의 길과 우리의 바람은 무조건적입니다. 단결은 스페인에 영원히 되돌려져야 합니다."
 SPR_eliminate_separatism: "분리주의 척결"
 SPR_eliminate_separatism_desc: "각 지역의 분리주의를 제거하는 것이 위대한 우리나라를 통일하는 첫걸음이 되어야 합니다."
 SPR_ban_the_parties: "정당 금지"
 SPR_ban_the_parties_desc: "모든 분리주의 정당은 금지되어야 합니다. 그들은 우리의 민주적 절차에 참여할 권리가 없습니다."
 SPR_spanish_reeducation: "스페인에 대한 재교육"
 SPR_spanish_reeducation_desc: "스페인 국민이 스페인의 문화적 정체성에 부합하도록 재교육합니다."
 SPR_many_to_one: "단일 민족"
 SPR_many_to_one_desc: "스페인에는 여러 지역 문화가 있습니다. 이제 단결로 돌아가 하나의 문화, 하나의 민족이 될 때입니다. 우리는 오직 스페인인일 뿐입니다."
 SPR_nacion_unidad_imperio: "국가, 통합, 제국"
 SPR_nacion_unidad_imperio_desc: "나시온 우니닷 임페리오, 즉 국가, 단결, 제국이라는 표어는 스페인 신 팔랑헤 운동의 신조입니다. 국가에 대한 충성은 무엇보다 앞서고, 민족의 단결은 필수적이며, 새로운 스페인 제국의 부상은 지평선 위에 있습니다. 스페인에 새로운 여명이 밝아오고 있으며 이 위대한 나라가 일어서는 것을 지켜볼 때입니다."
 SPR_the_youth_front: "청년 전선"
 SPR_the_youth_front_desc: "[Nat_Fascism_L]의 청년 전선을 되살리면 당에 헌신하는 새로운 피를 정부에 수혈할 충분한 여지와 기회가 생길 것입니다."
 SPR_return_of_francoism: "팔랑헤주의 복원"
 SPR_return_of_francoism_desc: "프랑코의 유령은 영원히 우리를 괴롭힐지도 모릅니다. 그러나 팔랑헤주의는 프랑코주의를 의미하지 않습니다. 이는 위대한 우리나라의 힘과 연대로 정의될 수 있으며 그렇게 유지되어야 합니다."
 SPR_the_catalonian_cancer: "카탈루냐의 암덩어리"
 SPR_the_catalonian_cancer_desc: "카탈루냐 분리주의자들은 위대한 우리나라의 재앙에 불과합니다. 이 암적인 성장을 끝내야 우리는 새로운 위대한 팔랑헤 스페인으로 나아갈 수 있습니다."
 SPR_unify_the_faiths: "신의 믿음을 통합하라"
 SPR_unify_the_faiths_desc: "가톨릭이 이 나라를 지배하고 있지만, 우리 국경 안에는 불가지론자, 개신교도, 루터교도 등의 갈래도 존재합니다. 이들을 공통의 대의, 즉 하느님의 대의 아래 통합하면 우리 팔랑헤 정부를 강화하고 떠받칠 수 있을 것입니다."
 SPR_missionaries: "선교사"
 SPR_missionaries_desc: "최근에는 이 나라에서 가톨릭이 쇠퇴하고 있습니다. 가톨릭 신앙을 북돋우기 위해 스페인 각 지역에 국가가 지원하는 선교사를 파견하는 것은 지금까지의 우리 결정 중 최선의 하나가 될 것입니다."
 SPR_outlaw_non_catholic_worship: "비카톨릭 숭배 금지"
 SPR_outlaw_non_catholic_worship_desc: "비가톨릭 예배는 위대한 우리나라에 있을 자리가 없습니다. 가톨릭이 아닌 모든 종교 관행을 불법화하면 교회와 국가의 올바른 통합이 보장될 것입니다."
 SPR_role_of_the_woman: "여성의 역할"
 SPR_role_of_the_woman_desc: "우리나라에서 여성의 역할은 아직 결정되지 않았습니다. 앞으로 나아가려면 우리가 결정해야 할 문제입니다."
 SPR_eliminate_the_euskara: "바스크 저항군 격멸"
 SPR_eliminate_the_euskara_desc: "바스크 지방의 저항은 분쇄되어야 합니다. 실패한 ETA 테러리스트들을 지지하는 자들의 정체성을 꺾어야 우리나라를 지킬 수 있습니다."
 SPR_military_investitures: "군사적 투자"
 SPR_military_investitures_desc: "군산복합체에 대한 자금 지원을 확대하는 것은 언제나 훌륭한 선택입니다."
 SPR_end_the_class_struggle: "계급투쟁 종결"
 SPR_end_the_class_struggle_desc: "계급 간 분열을 끝내는 것은 국가의 장수를 보장하는 첫걸음입니다."
 SPR_nationalize_the_banks: "은행 국유화"
 SPR_nationalize_the_banks_desc: "은행은 우리나라에서 억압의 상징입니다. 이제 이러한 금융 기관을 국유화하고 국민 사이의 분열을 끝낼 때입니다."
 SPR_agrarian_reform: "농업 개혁"
 SPR_agrarian_reform_desc: "특화된 농지 개혁을 시행하면 우리나라의 가장 가난한 이들에게 도움이 되고 결국 국가 전체가 이익을 얻을 것입니다."
 SPR_el_estado_como_instrumento: "국가는 그저 수단일 뿐"
 SPR_el_estado_como_instrumento_desc: "엘 에스타도 코모 인스트루멘토(도구로서의 국가)는 국가가 위대한 팔랑헤 대의를 위한 도구에 불과하다는 철학입니다."
 SPR_estado: "\"국가\""
 SPR_estado_desc: "국가는 국민을 섬기고 국민은 국가를 섬깁니다."
 SPR_individual: "\"개인\""
 SPR_individual_desc: "개인은 집단만큼이나 중요합니다. 남녀를 스페인의 영광을 위해 준비시키는 것은 위대한 전진을 위해 필수적입니다."
 SPR_libertad: "\"자유\""
 SPR_libertad_desc: "우리의 팔랑헤주의는 모든 스페인인이 나머지 사람들의 억압으로부터 자유를 추구할 권리를 후원합니다."
 SPR_the_syncretic_position: "혼합적인 입장"
 SPR_the_syncretic_position_desc: "자본주의 체제와 공산주의 체제에서 벗어난 제3의 입장을 장려하는 것이 우리가 위대한 국가를 만들어 가는 최선의 방법입니다."
 SPR_nation_of_pride: "긍지의 나라"
 SPR_nation_of_pride_desc: "우리는 자긍심의 국가이며 우리 국민은 이 나라에 대한 자긍심을 가져야 합니다."
 SPR_pride_in_the_army: "군의 자부심"
 SPR_pride_in_the_army_desc: "군의 강함에 자긍심을 갖는 것은 스페인의 강함을 반영하는 것입니다. 우리나라의 가장 위대한 자산에 자긍심을 가져야 합니다!"
 SPR_in_the_interests_of_the_collective: "다수의 이익을 위해"
 SPR_in_the_interests_of_the_collective_desc: "모든 결정은 우리 국가 공동체에 이익이 되도록 내려져야 합니다. 우리나라의 섬세함과 취약함에 영향을 미칠 수 있는 결정은 혐오스러운 것입니다."
 SPR_for_the_beneficiaries: "수혜자를 위해"
 SPR_for_the_beneficiaries_desc: "정부의 목적은 궁극적으로 우리나라 국민을 섬기는 것입니다. 복지, 보건 등 우리 사업의 수혜자를 강조하는 것은 우리나라를 발전시키는 모범적인 방식입니다."
 SPR_the_human_divinity: "인간의 신성"
 SPR_the_human_divinity_desc: "인류는 진정으로 신성합니다. 우리 국민과 인류의 우위를 무엇보다 확보하는 것이 팔랑헤 정체성의 최고 목표입니다."
 SPR_freedom_is_eternal: "자유는 영원하리"
 SPR_freedom_is_eternal_desc: "자유는 영원하며 언제나 영원해야 합니다. 세상은 우리의 눈 속에서 자유를 보아야 하며, 그 외의 어떤 것도 보아서는 안 됩니다."
 SPR_una_espana_grande_y_libre: "하나의 스페인, 위대한, 그리고 자유로운"
 SPR_una_espana_grande_y_libre_desc: "우리의 스페인은 위대하고 자유롭습니다. 우리가 이곳 스페인의 국민에게 자유를 가져다준 것처럼, 우리의 자유를 대중에게 전파해야 합니다."
 SPR_seize_andorra: "안도라 장악"
 SPR_seize_andorra_desc: "안도라는 역사 속의 각주에 불과하며, 이제 마침내 이 각주를 지울 때가 되었습니다."
 SPR_push_the_envelope: "한계를 초월하라"
 SPR_push_the_envelope_desc: "스페인의 적대 세력에 맞선 전쟁 준비를 시작해야 합니다. 이제 한계를 넘어설 때입니다. 세계가 떨게 될 것입니다."
 SPR_the_european_upheaval: "격동의 유럽"
 SPR_the_european_upheaval_desc: "유럽의 진보적 독재 정권들이 유럽 우위라는 건전한 상식을 망치고 있습니다. 우리는 그들을 무너뜨리고 그들이 꿈꾸던 것 이상의 위업을 이룰 것입니다."
 SPR_what_are_you_doing_step_portugal: "너 뭐하는 거니, 우리 양아들 포르투갈?"
 SPR_what_are_you_doing_step_portugal_desc: "뭘 하는 거야, 포르투갈 스텝? - 포르투갈 국기를 움켜쥔 조니 신스."
 SPR_glory_to_spain: "스페인에 영광을"
 SPR_glory_to_spain_desc: "스페인의 영광이 회복되었습니다. 이제 계속 전진할 때입니다. 스페인에 영광을, 그리고 새로운 팔랑헤 미래에 영광을!"
 SPR_the_hands_of_the_few: "소수의 손에"
 SPR_the_hands_of_the_few_desc: "소수의 손에 의한 통치는 의지와 지성이 약한 자들이 국가를 다스리지 못하도록 보장합니다. 권력은 소수의 손에 남아 있어야 합니다."
 SPR_electoral_reform: "선거 개혁"
 SPR_electoral_reform_desc: "정당의 선거 참여를 막는 새로운 법과 규정을 도입하면 우리의 정치적 힘이 확고히 보장될 것입니다."
 SPR_declare_the_dictatorship: "독재 선포"
 SPR_declare_the_dictatorship_desc: "이제 새로운 팔랑헤 독재를 선포할 때입니다. 선거는 허울에 불과합니다."
 SPR_hand_in_hand: "손에 손잡고"
 SPR_hand_in_hand_desc: "우리 국민은 손에 손을 맞잡고 앞으로 나아갑니다."
 SPR_solidify_the_paramilitaries: "준군사조직 강화"
 SPR_solidify_the_paramilitaries_desc: "우리나라의 준군사 조직을 강화하고 지원하여 조직 안으로 끌어들이면 우리의 병력이 늘어날 것입니다."
 SPR_nuestra_familia: "우리의 가족"
 SPR_nuestra_familia_desc: "누에스트라 파밀리아(우리 가족)는 우리에게 중요하며, 따라서 위대한 우리나라의 가정에 주목해야 합니다."
 SPR_nuestra_gente: "우리의 사람"
 SPR_nuestra_gente_desc: "모든 국가의 가장 중요한 자산은 국민입니다. 국경 안에 있는 국민에게 변함없이 집중하는 것이 곧 위대함을 달성하는 길입니다."
 SPR_rebuild_our_glory: "우리 영광을 수복하라"
 SPR_rebuild_our_glory_desc: "우리는 서방 세계의 애완견이 되고 말았습니다. 이제 이 종속적인 사고방식을 끝내고 스페인의 영광을 되찾을 때입니다!"
 SPR_spanish_first: "무엇보다 스페인"
 SPR_spanish_first_desc: "이민자의 물결이 끝없는 파도처럼 밀려들고 있습니다. 이제 스페인 국민을 우선시하고, 위대한 우리나라에서 태어난 시민에게만 집중해야 할 때입니다."
 SPR_socialism_rising: "사회주의 성장"
 SPR_socialism_rising_desc: "스페인에서 사회주의가 힘을 얻고 있습니다. 이제 이곳 스페인에서 사회주의와 좌파가 부상할 때입니다."
 SPR_address_inequality: "불평등 해결"
 SPR_address_inequality_desc: "가장 부유한 자와 가난한 자 사이의 격차가 날이 갈수록 커지기 시작했습니다. 우리 제도와 국민 사이의 불평등을 해소하는 것만이 우리가 앞으로 나아갈 역량을 높일 수 있습니다."
 SPR_left_wing_populism: "좌익 포퓰리즘"
 SPR_left_wing_populism_desc: "좌익 포퓰리즘은 좌익 정치와 포퓰리즘적 수사를 결합한 정치 이념입니다. 이러한 사상을 받아들이고 기득권에 맞서 싸우면 스페인은 새로운 경이의 경지에 이를 것입니다."
 SPR_erase_francoism: "프랑코주의 제거"
 SPR_erase_francoism_desc: "팔랑헤 이념은 프랑코주의의 가면이며, 프랑코의 망령은 계속해서 우리나라를 괴롭히고 있습니다. 이제 이 허울을 끝내고 우리나라에 안정도를 되찾을 때입니다."
 SPR_revised_immigration_rules: "개정된 이민법"
 SPR_revised_immigration_rules_desc: "더 많은 사람이 스페인에서 살 수 있도록 더 가혹한 이민법 일부를 폐지해야 합니다."
 SPR_tackle_oppression: "억압에 맞서라"
 SPR_tackle_oppression_desc: "억압 문제에 맞서고 공정하고 자유로운 국가를 육성하는 것만이 우리를 성장시킬 것입니다. 억압이 자유롭게 살아 숨 쉬는 곳을 반드시 제거해야 합니다."
 SPR_clausula_de_pobreza: "빈곤의 조항"
 SPR_clausula_de_pobreza_desc: "우리가 나라의 가장 가난한 이들에게 더 많은 지원을 제공하려 하는 지금, 빈곤 조항이 눈앞에 와 있습니다. 이를 법제화하면 소외된 집단이 빈곤에서 벗어나 더 크고 나은 것들로 나아갈 수 있을 것입니다."
 SPR_lgbtq_affirmations: "성소수자 지지"
 SPR_lgbtq_affirmations_desc: "이 공동체에 대한 우리의 입장은 잘 알려진 사실이지만, 그럼에도 이를 거듭 확인하는 것은 필수적입니다."
 SPR_anti_nationalism: "반 민족주의"
 SPR_anti_nationalism_desc: "극렬한 민족주의에 반대하는 운동을 벌이고 더 강력한 대안을 제시하면 국가가 앞으로 나아갈 것입니다. 퇴행은 스페인의 누구에게도 도움이 되지 않습니다."
 SPR_the_post_capitalism_ideology: "자본주의 이후의 이념"
 SPR_the_post_capitalism_ideology_desc: "자본주의의 거짓과 그 해악은 표면보다 훨씬 깊습니다. 탈자본주의 세계로 나아가면, 다른 나라들이 엘리트의 기만에 발목 잡힌 시대에 우리나라는 번영할 것입니다."
 SPR_decommodify_the_basics: "기초 생활 관련 상품화 금지"
 SPR_decommodify_the_basics_desc: "기본적인 생활 수단은 사치품으로 여겨져서도, 상품으로 여겨져서도 안 됩니다. 그것은 기본권이며 그렇게 대우받아야 합니다."
 SPR_the_peoples_government: "The People's Government"
 SPR_the_peoples_government_desc: "정부는 국민을 위한 것이며, 오직 국민만을 위한 것입니다."
 SPR_foster_support_in_catalonia: "카탈루냐의 지지 촉진"
 SPR_foster_support_in_catalonia_desc: "카탈루냐는 우리나라의 중요한 일부입니다. 이 지역에 대한 지지를 계속 육성해야 합니다."
 SPR_socialism_support_in_spain: "스페인의 사회주의 지지"
 SPR_socialism_support_in_spain_desc: "사회주의와 스페인은 대체로 좋은 전적을 갖고 있지 못합니다."
 SPR_foster_relationship_in_europe: "유럽과의 관계 회복"
 SPR_foster_relationship_in_europe_desc: "유럽 국가로서 유럽과의 관계를 계속 지원하는 것은 필수적입니다. 그들은 우리의 친구이자 형제자매이며 그 이상입니다. 이웃 나라들과 굳건한 유대를 유지하면 국가로서도, 유럽인으로서도 더 강해집니다."
 SPR_regulate_the_markets: "시장 규제"
 SPR_regulate_the_markets_desc: "자본주의는 시작된 이래 새로운 경제 성장과 번영의 물결을 가져왔습니다. 규제되지 않은 자본주의는 노동 계급과 중산층에게 부당한 고통을 안길 수 있습니다. 기업이 우리 노동력을 착취하지 못하도록 시장을 규제해야 합니다."
 SPR_separation_of_church_and_state: "정교분리"
 SPR_separation_of_church_and_state_desc: "교회는 이 위대한 나라를 통치할 권리가 없습니다. 우리는 가톨릭 신자일 수 있으나 교회의 변덕에 굴복할 필요는 없습니다. 스페인 국민의 필요에 기반하여 법을 만들어야 합니다. 그 이상도, 그 이하도 아닙니다."
 SPR_support_the_universities: "대학 지원"
 SPR_support_the_universities_desc: "스페인의 대학과 국내 기타 교육 기관에 자금을 지원합니다."
 SPR_support_our_system: "우리의 체계 지원"
 SPR_support_our_system_desc: "스페인의 제도는 여러 면에서 자금이 한심할 정도로 부족합니다. 더 많은 지원을 제공하는 것이 우리에게 이로울 수 있습니다."
 SPR_the_peoples_spain: "인민의 스페인"
 SPR_the_peoples_spain_desc: "이제 국민이 자기 나라를 되찾을 때입니다. 정부는 국민을 섬기고, 스페인은 국민의 것입니다."
 SPR_the_fair_share: "공평한 몫"
 SPR_the_fair_share_desc: "부유한 사람들은 마땅히 내야 할 몫을 내야 합니다."
 SPR_tax_the_rich: "재벌 세금 부과"
 SPR_tax_the_rich_desc: "부자에게 과세하는 것은 추가 세수를 확보하고 가장 가난한 국민의 세금 부담을 덜어주는 확실한 방법입니다."
 SPR_the_heart_of_the_collective: "모두의 하나된 심장 아래"
 SPR_the_heart_of_the_collective_desc: "국민은 이 위대한 국가와 공동체 전체를 이룹니다. 공동체의 심장이 피를 다 흘려 말라붙지 않도록 지켜야 합니다."
 SPR_analyze_the_scandinavians: "북유럽 시스템 분석"
 SPR_analyze_the_scandinavians_desc: "스칸디나비아 국가들은 훌륭한 복지 및 의료 제도를 갖추고 있습니다. 북쪽의 형제자매들에게서 분명 배울 점이 있을 것입니다."
 SPR_egalitarian_first_and_forever: "평등주의여 언제나 영원하리"
 SPR_egalitarian_first_and_forever_desc: "평등주의가 최우선이어야 합니다. 국가의 정부는 지역 정체성과 관계없이 모든 국민을 섬깁니다."
 SPR_state_sponsored_interventionism: "국가 주도 개입주의"
 SPR_state_sponsored_interventionism_desc: "스페인 경제에는 약간의... 정부 개입주의가 필요할 수 있습니다."
 SPR_a_keynesian_take: "케인스의 경제 시스템 수용"
 SPR_a_keynesian_take_desc: "통화주의 경제 모델에서 케인스 이론으로 전환하면 스페인의 경제 성장에 큰 도움이 될 수 있습니다. 가격은 본질적으로 경직적이므로 경제에서 정부의 역할을 유지해야 합니다."
 SPR_industry_for_the_people: "인민을 위한 산업"
 SPR_industry_for_the_people_desc: "스페인의 경제와 산업은 국민을 위해 작동해야 합니다."
 SPR_a_state_bank: "국영 은행"
 SPR_a_state_bank_desc: "또 하나의 제대로 된 국영 은행을 설립하면 정부 사업의 자금 조달과 전환에 더 많은 기회가 생길 것입니다."
 SPR_support_the_small_businesses: "중소 기업 지원"
 SPR_support_the_small_businesses_desc: "스페인의 소기업을 지원하는 것은 훌륭한 발상이며 경제가 항상 움직이도록 보장할 것입니다."
 SPR_pro_europeanism: "친 유럽주의"
 SPR_pro_europeanism_desc: "스페인은 유럽 연합에 가까워질수록 그만큼 잘 해낼 수 있습니다. 연합과의 연계가 깊어질수록 스페인과 다른 모든 유럽 국가가 더 나아질 수 있습니다."
 SPR_the_unions_party: "조합 정당"
 SPR_the_unions_party_desc: "우리 당은 노동조합의 권리 신장을 추구하기 위해 결성되었으며, 따라서 우리를 집권시킨 국민을 계속 지원해야 합니다."
 SPR_reconnecting_with_our_roots: "우리의 뿌리와 다시 하나로"
 SPR_reconnecting_with_our_roots_desc: "사회주의 정당이 된다는 것이 무엇을 의미하는지 다시 되새겨야 합니다."
 SPR_faith_in_the_state: "국가의 숙명"
 SPR_faith_in_the_state_desc: "스페인 국민이 여전히 국가 기구를 신뢰하도록 반드시 보장해야 합니다."
 SPR_communist_revisionism: "공산 수정주의"
 SPR_communist_revisionism_desc: "공산주의는 과거 스페인에서 성공하지 못했지만, 적절한 조건이 갖추어지면 달라질 수도 있습니다."
 SPR_all_left_coalition: "모든 좌파의 연합"
 SPR_all_left_coalition_desc: "스페인의 새로운 미래를 가져오기 위해 좌파 전체가 하나의 대의 아래 단결해야 합니다."
 SPR_moderate_leftists: "중도 좌익주의"
 SPR_moderate_leftists_desc: "집권 연립을 더 온건하게 유지하면 정치적 정체성과 관계없이 더 많은 대중에게 호소할 수 있습니다."
 SPR_revisit_federalism: "연방주의 검토"
 SPR_revisit_federalism_desc: "연방주의의 개념을 재검토하고 스페인을 연방 국가로 전환하는 구상을 추진하면 스페인의 최선을 이끌어낼 수 있을 것입니다."
 SPR_the_federalization_idea: "연방주의의 이념"
 SPR_the_federalization_idea_desc: "스페인은 현재 통치 면에서 통합되어 있지 않습니다. 국가를 단일 국가로 연방화하면 각 문화가 이탈할 가능성이 사라집니다."
 SPR_finalize_the_transition: "변화의 마무리"
 SPR_finalize_the_transition_desc: "자치 지방에서 연방적 단일 국가로의 전환은 스페인에 새로운 얼굴을 가져올 것이며, 이는 자치 공동체가 아닌 수도에서 통치될 것입니다."
 SPR_price_controls: "가격 통제"
 SPR_price_controls_desc: "바가지 가격을 막기 위해 모든 제품에 적절한 가격 통제를 마련하면 스페인이 더 안전한 공간이 되도록 보장하는 데 도움이 될 것입니다."
 SPR_distributive_egalitarianism: "평등한 자원의 분배"
 SPR_distributive_egalitarianism_desc: "국가의 재화를 모든 국민에게 평등하게 분배해야 합니다."
 SPR_agrarian_collectivism: "농촌 집산주의"
 SPR_agrarian_collectivism_desc: "지역 농민들에게 손을 내밀어 모두에게 더 나은 결과를 가져다주는 집단 농업 체계를 구성해야 합니다."
 SPR_election_protectionism: "선거 보호주의"
 SPR_election_protectionism_desc: "이제 국민이 정부를 이끌고 있으므로 부르주아가 통제권을 되찾도록 내버려 둘 수 없습니다."
 SPR_in_support_of_the_worker: "노동자를 지원하라"
 SPR_in_support_of_the_worker_desc: "스페인 노동자는 나라를 하나로 묶는 접착제입니다. 그들이 우리의 전폭적인 지원을 받도록 반드시 해야 합니다."
 SPR_the_material: "우리의 \"자원\""
 SPR_the_material_desc: "국민의 힘으로 연구를 확대하여 서방 엘리트의 연구를 능가할 것입니다."
 SPR_the_technical_base: "기술 중심지"
 SPR_the_technical_base_desc: "공공 연구 사업으로 확장하면 그 위에 쌓아 올릴 기술적 기반을 마련할 수 있습니다."
 SPR_collectively_owned: "모두의 소유"
 SPR_collectively_owned_desc: "노동자의 노동이 집단 소유를 통해 노동자에게 돌아가도록 반드시 보장해야 합니다."
 SPR_the_emancipation_of_the_woman: "The Emancipation Of Women"
 SPR_the_emancipation_of_the_woman_desc: "역사를 통틀어 여성은 거의 모든 면에서 남성에 뒤처져 왔습니다. 이는 달라졌지만 더 멀리 밀고 나아갈 수 있습니다."
 SPR_marxist_education: "마르크스주의 교육"
 SPR_marxist_education_desc: "카를 마르크스는 위대한 지성의 소유자이며, 그의 가르침을 학교에 계속 도입해야 합니다. 공통의 교육을 통해 국민은 하나가 될 것입니다!"
 SPR_redistribution_of_wealth: "부의 재분배"
 SPR_redistribution_of_wealth_desc: "스페인의 최고 부유층이 모든 부를 독차지하고 있습니다. 로빈 후드가 되어 필요한 이들에게 재분배할 때입니다."
 SPR_the_new_constitution: "신헌법"
 SPR_the_new_constitution_desc: "새로운 공산주의 헌법은 우리의 새 정부가 스페인 국가를 개혁할 수 있게 해 줄 것입니다. 이는 서서히 평등의 새로운 보루가 될 것입니다."
 SPR_state_atheism: "국가 무신론"
 SPR_state_atheism_desc: "우리는 역사적으로 가톨릭의 위상이 높은 나라였습니다. 이제 교회와의 결별을 준비하고 궁극적으로 진정한 국가 무신론을 달성할 때입니다."
 SPR_abolish_the_monarchy: "군주제 폐지"
 SPR_abolish_the_monarchy_desc: "군주제는 시대에 뒤떨어진 구시대의 유물입니다. 이 억압의 구조를 우리나라에서 제거하면 앞으로 나아갈 수 있을 것입니다."
 SPR_the_peoples_militias: "The People's Militias"
 SPR_the_peoples_militias_desc: "국민을 위한 충분한 자금을 갖춘 민병대를 구성하면 어떤 분쟁에서도 군대가 충분한 지원을 받도록 보장할 수 있습니다."
 SPR_the_culture_of_proletarianism: "프롤레타리아주의의 문화"
 SPR_the_culture_of_proletarianism_desc: "스페인에 변화를 가져온 것은 프롤레타리아였고, 우리를 앞으로 이끌 것도 그들입니다."
 SPR_the_red_rose: "붉은 장미"
 SPR_the_red_rose_desc: "우리 사회에서 가장 가난한 사람들에게 필수품을 제공하는 데 집중해야 합니다."
 SPR_dissolve_monasteries: "수도원 해체"
 SPR_dissolve_monasteries_desc: "종교 기관은 너무 오랫동안 아무런 책임도 지지 않고 우리나라 아래에서 이득을 취해 왔습니다. 이제 이 억압의 기관들을 해체할 때입니다."
 SPR_red_rising: "번져가는 붉은 물결"
 SPR_red_rising_desc: "공산주의의 붉은 깃발이 이제 스페인 위에서 휘날리고 있으며, 그 영향권을 이웃 나라에도 넓힐 수 있습니다."
 SPR_the_democratic_youth: "민주적인 청년들과 함께"
 SPR_the_democratic_youth_desc: "청년은 공산주의의 가장 훌륭한 지지자들 가운데 하나입니다. 더 많은 청년을 포괄하도록 청년 조직을 확대해야 합니다."
 SPR_federation_of_spanish_women: "스페인 여성의 연합"
 SPR_federation_of_spanish_women_desc: "여성이 이제 남성과 동등한 존재로 굳건히 서 있으므로, 정치 영역에서 그들의 존재감을 넓힐 수 있습니다."
 SPR_union_of_working_youth: "청년 노동자 연맹"
 SPR_union_of_working_youth_desc: "스페인의 노동 청년을 대표하는 새로운 조합이 결성될 것입니다."
 SPR_the_great_confederation: "대 연방"
 SPR_the_great_confederation_desc: "공산주의가 나라 구석구석에 닿도록 스페인 노동자들의 거대한 연합체를 결성해야 합니다."
 SPR_union_of_agricultural_cooperatives: "농업협동조합"
 SPR_union_of_agricultural_cooperatives_desc: "농업 지역에도 공산주의의 모든 혜택이 돌아가도록 반드시 해야 합니다."
 SPR_peoples_solidarity: "People's Solidarity"
 SPR_peoples_solidarity_desc: "누구도 불가촉 존재로 취급되지 않고 모두가 삶의 필수품을 제공받도록 보장해야 합니다."
 SPR_socialist_patriotism: "사회주의적 애국주의"
 SPR_socialist_patriotism_desc: "당과 조국에 대한 애국심을 고취해야 합니다."
 SPR_liquidate_private_assets: "사유 재산 청산"
 SPR_liquidate_private_assets_desc: "부자는 더 이상 부자일 필요가 없습니다. 그들의 사유 재산을 청산하여 그 보상을 국민에게 돌려주어야 합니다. 베이조스는 이를 좋아하지 않을 것입니다."
 SPR_communist_reeducation: "공산주의 재교육"
 SPR_communist_reeducation_desc: "우리 사회에는 여전히 자본주의적 억압을 위해 싸우는 이들이 많습니다. 그들에게 잘못된 길을 깨닫게 해야 합니다."
 SPR_the_working_class: "노동계급"
 SPR_the_working_class_desc: "오직 노동 계급 하나만이 남도록 모든 계급을 철폐해야 합니다."
 SPR_the_poor: "빈곤층"
 SPR_the_poor_desc: "사회주의를 통해 빈곤이 어디에서 생겨나든 이를 근절하고자 시도할 것입니다."
 SPR_the_ideological_conversion: "이념적 전환"
 SPR_the_ideological_conversion_desc: "세상에는 사회주의를 설파한다고 말하면서 실제로는 자본주의적 억압을 설파하는 이들이 있으며, 이를 막아야 합니다."
 SPR_council_of_peoples_comissars: "Council Of People's Commissars"
 SPR_council_of_peoples_comissars_desc: "국가의 업무를 적절히 관리하기 위해 인민위원회의를 설치해야 합니다."
 SPR_international_connections: "국제적 협력"
 SPR_international_connections_desc: "국제적 연계를 확대하면 카를 마르크스의 사상을 더 널리 전파할 수 있습니다."
 SPR_spread_the_word: "세상에 널리 알려라"
 SPR_spread_the_word_desc: "유럽의 국민은 노동자가 운영하는 평등한 사회에서 사는 것이 어떤 것인지 알아야 합니다."
 SPR_we_are_one: "우리는 하나다"
 SPR_we_are_one_desc: "우리는 공동체가 운영하는 사회를 만들었으며, 이제 우리는 하나입니다."
 SPR_communist_everywhere: "세상을 뒤덮은 공산주의"
 SPR_communist_everywhere_desc: "지금, 어디에서나, 영원히 공산주의입니다. 인민 혁명의 손길이 닿지 않는 스페인의 구석은 없을 것입니다."
 SPR_culture: "\"문화\""
 SPR_culture_desc: "스페인 문화는 널리 퍼져 있습니다. 전 세계 수많은 국가에 영향을 미쳤으며, 서서히 가장 눈에 띄고 알아보기 쉬운 문화 가운데 하나가 되었습니다. 이제 스페인인으로서의 정체성을 강화하고 우리나라를 놀라운 새로운 높이로 계속 끌어올릴 때입니다."
 SPR_mass_legalization: "대규모 합법화"
 SPR_mass_legalization_desc: "\\"들어봐, 마약을 합법화하면 범죄가 없어지는 거야. 확인 완료.\\" - 마드리드의 어느 무명 노숙자."
 SPR_legalize_light_drugs: "가벼운 마약 합법화"
 SPR_legalize_light_drugs_desc: "들어보십시오, 마리화나로 죽은 사람은 없습니다. 치치와 총은 아직도 살아 있고 아주 멀쩡합니다."
 SPR_drug_users_are_criminals: "마약 중독자는 그저 범죄자일뿐"
 SPR_drug_users_are_criminals_desc: "기호용 약물을 사용하는 모든 이는 범죄자이며 감옥에 가야 마땅합니다."
 SPR_the_question_of_bullfighting: "투우 경기에 대한 의문"
 SPR_the_question_of_bullfighting_desc: "투우는 스페인에 수 세기 동안 이어져 온 피의 스포츠입니다. 이 매우 중요한 자연 유산의 일부를 보존하는 것이 중요합니다."
 SPR_the_power_of_the_siesta: "낮잠 정책 (시에스타)의 힘"
 SPR_the_power_of_the_siesta_desc: "시에스타(스페인어로 낮잠)는 스페인 근무일의 필수적인 부분입니다. 노동자가 한낮에 과로하지 않도록 하는 짧은 휴식이며, 이로써 국민의 생산성이 높아집니다."
 SPR_monument_maintenance: "국가 기념물 관리"
 SPR_monument_maintenance_desc: "스페인에는 국가 기념물과 명성 높은 건축물이 많습니다. 우리 문화의 이러한 기념물을 지원하기 위해 정부 자금을 추가로 지원하면 스페인인으로서의 결의와 정체성이 강화될 것입니다."
 SPR_industria_espanola: "스페인의 산업"
 SPR_industria_espanola_desc: "스페인 산업은 스페인 경제 구성에서 작은 부분을 차지합니다. 스페인은 주로 서비스 기반 경제이지만 산업을 되살리면 큰 행운이 따를 것입니다."
 SPR_mineria_espanola: "스페인 광업"
 SPR_mineria_espanola_desc: "스페인의 광업은 최근 침체되었습니다. 이 핵심 부문을 되살리면 자급자족이 촉진되고 유럽 내 경제적 위상이 높아질 것입니다."
 SPR_agricultura_espanola: "스페인 농업"
 SPR_agricultura_espanola_desc: "농업은 스페인 GDP의 약 2.7퍼센트를 차지하며, 농식품 산업까지 합치면 추가로 2.5퍼센트를 차지합니다. 대토지(라티푼디오)와 소규모 토지(미니푼디오)가 주된 재산 보유 형태이지만 토지 대부분은 농업에 적합하지 않습니다. 스페인은 상당량의 올리브유, 감귤류, 곡물 등을 유럽 연합에 수출합니다."
 SPR_minifundios: "소규모 농장"
 SPR_minifundios_desc: "미니푼디오, 즉 소규모 토지는 스페인의 두 가지 주요 농지 보유 형태 가운데 하나입니다. 소규모 가족 농장이나 지역 농업 기업 소유주가 다양한 작물을 재배하기 위해 소규모 토지를 보유한 형태를 나타냅니다."
 SPR_latifundios: "장원 (Latifundia)"
 SPR_latifundios_desc: "라티푼디오, 즉 대토지는 스페인의 두 가지 주요 농지 보유 형태 가운데 하나입니다. 미니푼디오와 달리 보통 5헥타르가 넘는 넓은 토지를 다루며, 곡물, 올리브유, 와인 등 수출 작물에 사용됩니다. 이러한 재산 유형의 이원성은 보유 구조로 굳어져 오늘날까지 변함없이 이어지고 있으며, 옛 스페인 식민지였던 라틴 아메리카에서도 나타납니다."
 SPR_bio_azul: "바이오 아줄 (Bio Azul) 공업사"
 SPR_bio_azul_desc: "비오 아술은 스페인에서 설립되어 말라가에 본사를 둔 주요 연구개발 기업입니다. 이 기업은 주로 물과 관련된 여러 대규모 친환경 혁신 사업을 지원하는 공학 및 기술을 다룹니다."
 SPR_idai_nature: "이다이 네이처 (Idai Nature) 농업 기술 기업"
 SPR_idai_nature_desc: "이다이 네이처는 작물, 영양, 유기농 식물 보호 제품 등의 솔루션을 제공하는 주요 농산업 기업입니다. 국내에서 재배되는 농산물의 양이 많아 스페인 경제에 잘 통합되어 있습니다."
 SPR_solve_the_water_crisis: "수자원 문제 해결"
 SPR_solve_the_water_crisis_desc: "물은 귀중한 자원이지만 현재 우리의 농장과 가축에게 충분히 공급되지 못하고 있습니다. 상황이 악화되기 전에 이를 해결해야 합니다."
 SPR_the_power_of_the_grape: "포도의 영향력"
 SPR_the_power_of_the_grape_desc: "포도는 스페인의 주요 농산물 가운데 하나입니다. 스페인의 기후에서 매우 잘 자라 엄청난 양의 포도를 생산합니다. 스페인은 세계에서 네 번째로 큰 포도 생산국입니다."
 SPR_the_power_of_the_olive: "올리브의 영향력"
 SPR_the_power_of_the_olive_desc: "올리브와 올리브유는 스페인 농업 경제의 또 다른 주축이며 라티푼디오의 주요 수출 작물 가운데 하나입니다. 스페인은 연간 거의 1,000만 톤의 올리브를 생산하는 세계 최대의 올리브 생산국입니다."
 SPR_easy_peasy_lemon_squeezy: "간편한 레몬 사업"
 SPR_easy_peasy_lemon_squeezy_desc: "레몬과 기타 감귤류는 스페인 농업 경제의 또 다른 주축입니다. 주로 남부와 동부 해안에서 재배되며 더 습한 기후에서 잘 자랍니다. 스페인은 세계 7위 레몬 생산국으로 굳건히 자리하고 있으며, 기타 감귤류 시장에서도 상위 10위권을 장악하고 있습니다."
 SPR_el_pollo_loco: "엄청난 양의 닭 소비"
 SPR_el_pollo_loco_desc: "스페인의 주요 가축 가운데 하나는 닭입니다. 우리는 우리 닭에 완전히 푹 빠져 있습니다!"
 SPR_bring_home_the_jamon: "대규모 가축 소비"
 SPR_bring_home_the_jamon_desc: "스페인의 가장 큰 가축 생산은 단연 돼지고기와 돼지고기 제품입니다. 가금류를 수백만 톤 차이로 압도하며 스페인 가축 생산의 중추로 남아 있습니다."
 SPR_bigger_pescado_to_fry: "전세계적인 수산업 확장"
 SPR_bigger_pescado_to_fry_desc: "긴 해안선을 고려하면, 우리에게 세상의 모든 튀길 생선이 있음은 분명합니다."
 SPR_invite_the_icmm: "금속 광업 국제 위원회 (ICMM) 초대"
 SPR_invite_the_icmm_desc: "ICMM은 유럽과 해외에서 지속 가능하고 수익성 있는 채굴 작업을 표준으로 삼는 선도적인 광업 협의체입니다. 이들을 초청하여 우리의 채굴 작업을 돕게 하면 앞으로 우리나라가 더 안정적으로 유지될 것입니다."
 SPR_nuestras_propias_empresas_mineras: "자국의 광산 기업"
 SPR_nuestras_propias_empresas_mineras_desc: "해외 계약업체에 대한 의존에서 벗어나는 것이 우리 광업의 나아갈 길일지도 모릅니다. 장기적으로는 자원을 생산하기 위해 훨씬 더 많은 자본이 필요하겠지만, 이론적으로는 더 많은 수익을 올리고 더 큰 매장량을 활용할 수 있을 것입니다."
 SPR_operaciones_mineras_espanolas: "스페인 주도 채광 작업"
 SPR_operaciones_mineras_espanolas_desc: "국내 채굴 작업은 굴착을 위해 최신의 적절한 기계 시스템을 활용할 필요가 있습니다. 이러한 공정을 개선하면 우리나라가 번영하고 발밑의 부에서 훨씬 더 많은 자원을 캐낼 수 있을 것입니다."
 SPR_minerales_espanoles_para_espana: "스페인의 광물"
 SPR_minerales_espanoles_para_espana_desc: "우리 땅에서 캐낸 자원은 우리가 사용하는 자원입니다. 세계는 이 자원이 해외로 수출되리라 기대해서는 안 되며, 자원은 스페인의 국경 안에 남아야 합니다. 우리가 채굴하는 광물은 오직 스페인을 위한 것입니다."
 SPR_ICMM_mining_operations: "금속 광업 국제 위원회 (ICMM) 채광 작업"
 SPR_ICMM_mining_operations_desc: "ICMM이 우리 채굴 작업의 더 많은 부분을 관리하도록 허용하면 우리 국토를 파괴하지 않는 더 지속 가능한 광물 생산이 보장될 것입니다."
 SPR_asturian_mines: "아스투리아의 광산"
 SPR_asturian_mines_desc: "아스투리아스의 지역 채굴 작업에는 금과 은 같은 귀금속이 많이 포함되어 있습니다. 또한 지역 남부에 자리한 언덕과 산 속에는 구리 등의 매장지도 있습니다."
 SPR_galician_mines: "갈리시아의 광산"
 SPR_galician_mines_desc: "갈리시아는 산지 덕분에 다양한 천연자원이 풍부합니다. 구리, 리튬, 텅스텐 등 기술 생산에 사용되는 금속과 강철 생산을 위한 광대한 철광석을 이곳에서 찾을 수 있습니다."
 SPR_basque_mines: "바스크의 광산"
 SPR_basque_mines_desc: "바스크 광산은 역사적으로 우리나라에 중요했습니다. 산업 혁명 이후 이 지역 사람들은 스페인의 경제 발전에 기여하기 위해 광산에서 캘 수 있는 것은 무엇이든 캐내려 했습니다."
 SPR_extremadura_mines: "엑스트레마두라의 광산"
 SPR_extremadura_mines_desc: "텅스텐 같은 귀금속을 풍부하게 공급하는 엑스트레마두라 광산은 우리 경제 발전에 결정적이었습니다. 어쩌면 공급량을 조금 더 늘려도 해가 되지는 않을 것입니다."
 SPR_murcian_mines: "무르시아의 광산"
 SPR_murcian_mines_desc: "지중해와 가까운 우리나라 남동부에 위치한 무르시아 광산에는 상당한 양의 귀금속과 강철이 매장되어 있으며, 이를 활용하면 스페인 경제에 추가적인 활력을 불어넣을 수 있습니다."
 SPR_modernize_mining_operations: "채굴 작업 현대화"
 SPR_modernize_mining_operations_desc: "현재 우리는 지나치게 구식인 채굴 방식을 많이 사용하고 있습니다. 새롭고 개선된 기술을 도입하면 채굴 작업이 더 효율적이고 수익성 있게 될 것입니다."
 SPR_fabricacion_espanola: "스페인의 공업"
 SPR_fabricacion_espanola_desc: "보급과 물자를 다른 국가에 의존하는 것은 우리나라를 파멸시킬 것이 분명합니다. 국내 생산으로 초점을 전환하면 스페인 경제가 독립하고 성장하는 데 도움이 될 수 있으며, 이 구상을 뒷받침할 연구와 프로그램에 자금을 지원하는 것으로 시작할 수 있습니다."
 SPR_urovesa: "UROVESA 중차량 제조사"
 SPR_urovesa_desc: "우로베사는 갈리시아에 본사를 둔 스페인의 중장비 제조업체입니다. 험비와 유사한 4륜 구동 자동차인 URO VAMTAC과 URO 트럭 생산으로 가장 잘 알려져 있습니다. 1980년대 초 IPV의 전직 직원들이 설립하였으며, 1984년부터 스페인 육군의 공식 납품업체가 되어 트럭과 기타 다목적 차량을 공급하고 있습니다."
 SPR_grupo_antolin: "자동차 기술 기업 안톨린 그룹 (Grupo Antolin)"
 SPR_grupo_antolin_desc: "그루포 안톨린은 부르고스에서 차량과 농기계 수리 정비소로 사업을 시작했습니다. 오늘날 이 그룹은 거대한 자동차 내장재 생산업체이자 전 세계 천장 기재 공급업체입니다. 또한 스페인 군대도 활용하는 다양한 차량 내부 부품에 대한 기술 연구도 제공합니다."
 SPR_seat: "SEAT 자동차 기업"
 SPR_seat_desc: "SEAT는 1950년 과반 지분을 보유한 국립산업연구소(INI)와의 제휴로 설립되었습니다. 빠르게 스페인 최대의 자동차 공급업체 가운데 하나가 되었으며, 36년간 독립 자동차 제조사로 있다가 폭스바겐의 자회사가 되었습니다. SEAT는 지금도 다양한 자동차와 부품의 주요 생산업체로 남아 있습니다."
 SPR_grifols: "그리폴 (Grifols) 의학 장비 제조 기업"
 SPR_grifols_desc: "의료 장비의 중요한 제조업체인 그리폴스의 진정한 잠재력을 스페인이 깨닫는 것이 중요합니다. 그리폴스에 추가 생산 능력을 갖추게 하면 의료계의 획기적 진전에 분명 도움이 될 것이며, 판매할 장비도 더 많이 만들 수 있게 될 것입니다."
 SPR_court_lilly: "코트 릴리 (Court Lilly) 바이오 기술 기업"
 SPR_court_lilly_desc: "일라이 릴리와 같은 바이오 기술 기업은 스페인이 21세기를 헤쳐 나가는 데 결정적입니다. 과학적 돌파구를 여는 선도국이 되려면 우리 과학자들을 위한 새로운 기회를 만들어야 합니다."
 SPR_court_novartis: "제약회사 코트 노바르티 (Court Novartis)"
 SPR_court_novartis_desc: "의료 산업을 돕기 위해 제약 회사들이 수준에 이르도록 해야 합니다. 노바티스는 중요한 제약 회사이며, 우리는 이들의 성장을 도와야 합니다."
 SPR_kemira_iberica: "케미라 이베리카 (Kemira Iberica) 유기 화학 기업"
 SPR_kemira_iberica_desc: "상수도용 화학물질에서 티슈용 무기 화학물질에 이르기까지, 케미라 이베리카는 스페인의 과학 발전에 필수적입니다."
 SPR_ercros: "에르크로스 (Ercros) 특수 화학 기업"
 SPR_ercros_desc: "에르크로스는 1952년부터 스페인에서 운영되어 왔으며, 플라스틱, 식품, 의약품용 특수 화학물질 생산에 크게 기여해 왔습니다. 스페인의 발전과 산업에 필수적인 에르크로스를 확장하면 여러 중요한 부문에서 나라에 큰 도움이 될 것입니다."
 SPR_basf_espanola: "BASF 스페인 (BASF Española) 화학 기술 기업"
 SPR_basf_espanola_desc: "BASF 에스파뇰라는 화학물질, 플라스틱, 고기능 소재, 농업 솔루션을 생산해 왔습니다. 주로 화학물질 생산에 초점을 두었지만, 스페인은 수년 동안 이 기업의 혜택을 누려 왔으며 이러한 사업에 투자하는 것은 해가 되지 않을 것입니다."
 SPR_anti_deindustrialization: "산업 촉진"
 SPR_anti_deindustrialization_desc: "탈산업화 반대는 우리가 취해야 할 입장입니다. 가까운 미래에 살아남으려면 경제가 존속할 수 있도록 계속 산업화하고 국가를 확장해야 합니다."
 SPR_de_deindustrialization: "산업의 재분배"
 SPR_de_deindustrialization_desc: "이렇게 하면 과학, 의학, 혁신 같은 중요한 것들에 집중하는 데 도움이 될 것입니다. 산업화에만 매달리는 것은 결국 우리에게 해가 될 뿐입니다."
 SPR_un_deindustrialization: "산업의 개혁"
 SPR_un_deindustrialization_desc: "새로운 산업, 공장, 부문을 만들어 낸 것이 스페인이 성장하고 경제를 확장하는 데 도움이 되었습니다. 스페인을 지속 가능한 국가로 만들기 위해 이러한 노력을 계속해야 합니다."
 SPR_energia_espanola: "스페인의 에너지"
 SPR_energia_espanola_desc: "에너지 부문은 전기든 가스 동력 차량이든 우리 기계를 가동하는 데 중요합니다. 운영을 확대하면 비용 절감에 도움이 되고 의존할 수 있는 풍부한 공급량을 만들 수 있으므로 국민이 분명 만족할 것입니다."
 SPR_improve_our_refineries: "정제소  개선"
 SPR_improve_our_refineries_desc: "우리의 정유 시설은 낡고 구식입니다. 이를 개선하려는 선제적 조치는 전체 정제 공정에 기여할 것입니다."
 SPR_repsol_acquisitions: "렙솔 (Repsol) 스페인 에너지 기업  "
 SPR_repsol_acquisitions_desc: "스페인 기업이 국제적이고 영향력 있는 기업이 되려면 렙솔의 인수가 중요합니다. 이러한 행보를 장려하면 우리 경제에 이익이 될 국제 기업에 발판을 마련하는 데 도움이 될 것입니다."
 SPR_expand_cnat: "알마라즈-트릴로 원자력 발전소 (CNAT) 확장"
 SPR_expand_cnat_desc: "CNAT는 우리나라를 위한 깨끗하고 안전한 에너지를 생산하고 있으므로, 그 운영을 확대해야 한다는 것은 두말할 필요가 없습니다. 해로운 화학물질로 공기를 오염시키면 미래에 지속 가능한 환경을 만들 수 없습니다."
 SPR_subsidies_for_endesa: "Subsidies For Endesa"
 SPR_subsidies_for_endesa_desc: "보조금을 지급하면 엔데사가 성장하고 확장하는 데 도움이 될 것입니다. 스페인에 기반을 둔 엔데사는 남아메리카와 포르투갈에 거점을 두고 국가와 대륙 바깥에서 활동하는 몇 안 되는 기업 가운데 하나입니다. 약간의 도움을 주면 이러한 노력을 이어가는 데 도움이 될 것입니다."
 SPR_subsidies_for_iberdrola: "이베르드롤라 (Iberdrola) 전기 기업 보조금"
 SPR_subsidies_for_iberdrola_desc: "이베르드롤라는 스페인, 포르투갈, 영국, 미국, 멕시코, 브라질 등지에서 활동하는 다국적 전력 공급 기업입니다. 보조금은 끊임없이 성장하는 스페인 경제에 대한 이들의 기여 노력을 이어가는 데 도움이 될 것입니다."
 SPR_el_oro_negro: "검은 황금 (석유)"
 SPR_el_oro_negro_desc: "엘 오로 네그로(검은 황금)는 스페인이 외세로부터 진정한 독립을 달성하는 데 도움이 될 상품입니다. 매장량을 개발하고 이를 더 많이 사용하면 스페인은 새로운 미래로 나아갈 것입니다."
 SPR_deal_with_the_environmentalists: "환경운동가들과의 협상"
 SPR_deal_with_the_environmentalists_desc: "환경 운동가들이 스페인의 발전을 가로막고 있습니다. 그들을 처리하면 우리는 계속 성장할 수 있고, 이전보다 훨씬 빠른 속도로 성장할 수 있을 것입니다."
 SPR_increase_refining_capacity: "정제 수용량 증가"
 SPR_increase_refining_capacity_desc: "정제 능력을 늘리면 에너지 안보를 강화하는 동시에 이 부문에서 진정한 경쟁자가 될 수 있습니다. 이는 무역 적자에 맞서는 우리의 노력에도 도움이 될 것입니다."
 SPR_remove_brussels_shackles: "유럽 연합의 혼란을 제거하라"
 SPR_remove_brussels_shackles_desc: "유럽 연합이 스페인의 발목을 잡고 있었습니다. 이제 이러한 제약에서 벗어나 우리의 국가 계획을 계속 추진할 때입니다."
 SPR_eivissa_diu_si: "이비자는 알겠다고 말했다"
 SPR_eivissa_diu_si_desc: "그들은 동의했습니다. 적어도 우리 당원들은 그랬습니다. 지역 주민 몇몇에게 휘둘린다면 귀중한 유전에 접근하기를 기대할 수 없습니다!"
 SPR_canaries_islands_drilling: "Canary Islands Drilling"
 SPR_canaries_islands_drilling_desc: "카나리아 제도 앞바다 해저의 석유는 그야말로 따기만 하면 되는 상태입니다. 어쩌면 우리의 이 자원을 탐사하고 개발하기 시작해야 하지 않겠습니까?"
 SPR_va_verde: "녹색으로 (Va verde)"
 SPR_va_verde_desc: "이제 친환경 에너지에 다가설 때입니다. 석유라는 옛 방식을 고수하는 것은 아름다운 우리나라와 자원 독립의 지속성을 해칠 뿐입니다."
 SPR_vientos_del_sur: "남쪽의 바람"
 SPR_vientos_del_sur_desc: "남부에 새로운 풍력 발전 단지를 세우면 스페인의 에너지 부문을 다각화할 수 있습니다. 하나의 에너지원에 의존하면 머지않아 우리에게 화가 되어 돌아올 것입니다."
 SPR_vientos_marinos: "해풍"
 SPR_vientos_marinos_desc: "바람에서 얻는 에너지는 우리나라의 남부 지역에 국한되어서는 안 되며, 더 원한다면 바다로 나아가야 합니다."
 SPR_vientos_del_norte: "북쪽의 바람"
 SPR_vientos_del_norte_desc: "나라의 모든 구석이 에너지 부문에 활용되도록 북부에도 단지를 세웁시다."
 SPR_repsol_se_vuelve_verde: "녹색으로 변모하는 렙솔 (Repsol)"
 SPR_repsol_se_vuelve_verde_desc: "향후 확장을 위해 렙솔은 친환경으로 전환해야 합니다. 이 기업의 유해 폐기물이 우리나라의 환경으로 흘러들어간다면 이는 지속 가능한 관행이 아닙니다."
 SPR_endorse_eu_regulations: "유럽연합 규제 지지"
 SPR_endorse_eu_regulations_desc: "유럽 연합의 규정을 지지하고 지원하면 나머지 유럽과의 연계에 큰 이익이 될 것입니다."
 SPR_nuclear_acceptance_campaign: "핵 수용 캠페인"
 SPR_Armonia_con_la_naturaleza: "자연과의 조화"
 SPR_Armonia_con_la_naturaleza_desc: "국민이 자국의 자연을 보존하기를 원하도록 만듭시다. 우리가 자연을 약탈한다면 자연 그대로의 스페인은 남지 않을 것입니다."
 SPR_economia_espanola: "스페인의 경제"
 SPR_economia_espanola_desc: "스페인 경제를 돌봐야 합니다. 방치하면 국가와 국민이 심각한 결과를 맞게 될 것입니다."
 SPR_sector_servicios_espanol: "스페인 서비스 부문"
 SPR_sector_servicios_espanol_desc: "서비스 부문을 개선하면 공공 서비스의 신뢰성에 기여할 것입니다."
 SPR_long_walks_on_the_beach: "해변가의 산책로 유치"
 SPR_long_walks_on_the_beach_desc: "스페인의 해변은 외국인에게 완벽한 휴양지입니다. 해변을 정비하는 것은 관광 산업에 해가 되지 않을 것입니다..."
 SPR_tourist_traps: "여행객에 바가지를 씌우자"
 SPR_tourist_traps_desc: " 그 토르티아의 가격을 살짝 올려봅시다, 여행객들은 절대 알아차리지 못할 거니 말이죠."
 SPR_power_of_the_vacation: "휴가철의 힘"
 SPR_power_of_the_vacation_desc: "휴가가 관광에 미치는 영향을 과소평가해서는 안 됩니다. 스페인을 사람들을 위한 휴가지로 홍보하는 것을 고려해야 합니다."
 SPR_bbva: "빌바오 비스카야 아르헨타리아 은행 (BBVA)"
 SPR_bbva_desc: "BBVA는 우리나라에서 영업하는 수많은 은행 가운데 하나이며, 이들이 계속 영업할 수 있도록 사무 단지를 추가로 제공하는 것을 고려해야 합니다."
 SPR_banco_santander: "산탄데르 은행"
 SPR_banco_santander_desc: "스페인 기업인 방코 산탄데르는 다국적 금융 서비스 기업입니다. 이들의 서비스를 홍보하면 영향력이 확대되고 역량이 크게 향상될 것입니다."
 SPR_mfom: "스페인 국가 개발부 (MFOM)"
 SPR_mfom_desc: "개발부를 지원하면 새로운 도로, 주택, 공공 사업 건설에 기여할 것입니다."
 SPR_world_renowned_infrastructure: "세계적인 기반시설"
 SPR_world_renowned_infrastructure_desc: "현재의 기세를 이어간다면 스페인은 가장 현대적이고 발전한 국가 가운데 하나로 알려질 것입니다. 기반시설에 더 많은 노력을 기울이면 시민의 삶의 질이 향상되고 해외 관광객도 유치할 수 있습니다."
 SPR_prosperidad_espanola: "스페인이여 번영하라"
 SPR_prosperidad_espanola_desc: "스페인은 우리의 모든 노력으로 번영할 것입니다. 스페인은 더 나은 대우를 받을 자격이 있으며, 더 나아질 것입니다. 경제는 그 여정의 한 걸음일 뿐입니다."
 SPR_comercio_espanol: "스페인의 무역"
 SPR_comercio_espanol_desc: "수출과 상업 무역에 집중하면 상당한 이익을 얻을 것입니다. 나머지 유럽에 뒤처진다면 우리 자신 외에는 탓할 대상이 없을 것입니다."
 SPR_african_soft_power: "아프리카의 소프트파워"
 SPR_african_soft_power_desc: "아프리카에서 우리의 영향력이 줄어들고 있습니다. 이제 아프리카 대륙에서 우리의 입지를 다시 확립할 때입니다."
 SPR_focus_africa: "아프리카에 집중"
 SPR_focus_africa_desc: "아프리카는 기반시설을 개선하기 위해 분명 원조가 필요합니다. 스페인이 아프리카 무역과 투자에 발을 들여놓을 완벽한 기회입니다."
 SPR_europes_southern_doormat: "유럽 밑바닥의 관뭔"
 SPR_europes_southern_doormat_desc: "우리는 오로지 아프리카와의 연계 때문에 유럽의 현관 매트로 알려지게 될 것이며, 이는 나쁜 일이 아닙니다. 아프리카에서 영향력을 확대하는 것은 스페인의 패권에 큰 도움이 될 것입니다."
 SPR_address_the_trade_deficit: "무역 수지 적자 공표"
 SPR_address_the_trade_deficit_desc: "무역 적자가 늘어나는 것을 가만히 앉아서 지켜볼 수는 없습니다. 이제 행동에 나서 이를 해결할 때입니다."
 SPR_the_oei: "이베로아메리카 국가 기구 (OEI)"
 SPR_the_oei_desc: "스페인은 한때 남아메리카에서 가장 큰 영향력의 원천이었습니다. 그러나 이 영향력은 최근 몇 년 동안 무너지고 있으며 우리는 이를 바꿔야 합니다."
 SPR_acquire_british_companies: "영국 기업 획득"
 SPR_acquire_british_companies_desc: "영국 기업을 인수하는 것은 적자를 따라잡을 수 있도록 하는 빠른 방법입니다. 인수할 수 있는 기업이 있는데 자원을 들여 새 기업을 만들 필요는 없습니다!"
 SPR_reverse_the_trade_deficit: "무역 수지 적자 반전"
 SPR_reverse_the_trade_deficit_desc: "마침내 우리는 무역 적자에 맞서 싸웠고 앞으로도 계속 그럴 것입니다. 결국 우리의 노력은 결실을 맺었습니다."
 SPR_hybrid_territorial_model: "혼합 영토 관리 시스템"
 SPR_hybrid_territorial_model_desc: "정부 내 권력 통제의 균형을 맞추면 정책을 통과시키는 과정이 훨씬 빨라질 것입니다."
 SPR_align_regional_incentives: "지역별 보상 조정"
 SPR_align_regional_incentives_desc: "지역 주민 간의 다툼이 우리의 발목을 잡지 않도록 지역별 유인책을 조율할 수 있습니다."
 SPR_healthy_regional_competition: "건전한 지역 경쟁"
 SPR_healthy_regional_competition_desc: "기업과 지역 사이에 건전한 경쟁을 장려하면 결국 성장에 대한 열망이 생겨날 것입니다."
 SPR_coffee_for_all: "모두를 위한 커피"
 SPR_coffee_for_all_desc: "우리 국민은 수 세기 동안 커피를 마셔 왔으며, 이는 노동력의 가장 큰 필수품 가운데 하나입니다.\n\n\\"모두에게 커피를\\"(스페인어: Café para todos)은 모두를 동등하게 만족시키기 위해 똑같은 대우를 제공한다는 뜻을 지닌 스페인의 대중적 표현입니다. 스페인의 자치 지방 체계가 이 표현의 좋은 예로, 더 부유한 지역이 세금을 더 많이 내고 덜 부유한 지역에 더 많이 베풀어 모든 지역이 가능한 한 평등하도록 보장합니다."
 SPR_federalization_with_spanish_characteristics: "스페인식 연방화"
 SPR_federalization_with_spanish_characteristics_desc: "운영에 일체감을 조성하는 것이 모두에게 더 이로울 것입니다."
 SPR_merge_treasuries: "국고 통합"
 SPR_merge_treasuries_desc: "국고를 통합하면 정부가 더 중앙집권화되는 동시에 모든 것이 훨씬 효율적이 될 것입니다."
 SPR_unify_ministries: "부서 통합"
 SPR_unify_ministries_desc: "부처들을 하나의 우산 아래 통합한다면 더 나은 조율이 가능하고 비용도 절감할 수 있습니다."
 SPR_federalism_with_extra_steps: "추가적인 제도와 함께 연방제로"
 SPR_federalism_with_extra_steps_desc: "결국 우리가 이룬 것은 단계가 추가되고 혜택이 추가된 연방주의였습니다"
 SPR_integrate_the_underground_economy: "지하 경제 통합"
 SPR_integrate_the_underground_economy_desc: "우리 경제의 숨겨지고 어두운 부분에 빛을 비출 필요가 있습니다. 이로써 투명성을 높일 수 있습니다."
 SPR_crack_down_on_the_grey_market: "암시장 박멸"
 SPR_crack_down_on_the_grey_market_desc: "물품과 서비스가 적절한 검사 없이 판매되고 있습니다. 이를 바꿔야 합니다."
 SPR_ease_labour_laws: "노동법 완화"
 SPR_ease_labour_laws_desc: "우리 노동자들은 충분히 열심히 일하고 있으며, 강한 압박을 계속하면 한계에 이를 수 있습니다."
 SPR_tax_cuts: "감세"
 SPR_tax_cuts_desc: "감세는 안정도를 가져오고 국민을 훨씬 더 행복하게 만들 것입니다."
 SPR_labour_investments: "노동자에 대한 투자"
 SPR_labour_investments_desc: "노동력 교육에 투자하면 안전 규정을 보급하고 노동자의 안전을 높이는 데 도움이 될 수 있습니다."
 SPR_bring_textiles_into_the_fold: "섬유 업계를 다시 우리 편으로"
 SPR_bring_textiles_into_the_fold_desc: "하하, 분홍색 셔츠다! - 버디"
 SPR_bring_field_hands_into_the_fold: "농장 노동자들을 다시 우리 편으로"
 SPR_bring_field_hands_into_the_fold_desc: "농민을 포섭하면 큰 도움이 되며, 이는 우리나라 농업 부문을 다각화하고 더 많은 기회에 문을 열어 줄 수 있습니다."
 SPR_bring_construction_workers_into_the_fold: "건설 노동자를 다시 우리 편으로"
 SPR_bring_construction_workers_into_the_fold_desc: "건설 노동자를 포섭하면 기반시설 공사 속도가 크게 향상될 것이며, 그렇지 않으면 도중에 지연과 차질이 생길 수 있습니다."
 SPR_ejercito_de_tierra: "육군"
 SPR_ejercito_de_tierra_desc: "에헤르시토 데 티에라(스페인 육군)는 15세기 후반으로 거슬러 올라가는 세계에서 가장 오래된 현역 군대 가운데 하나입니다. 육군은 이사벨 여왕과 페르난도 왕의 치세 이래 끊임없이 존재해 왔으며 오늘날까지 이어지고 있습니다. 세계 최대 규모의 군대는 아니지만 여전히 가장 잘 훈련된 군대 가운데 하나입니다."
 SPR_programa_coraza_2000: "코라자 프로그램 2000"
 SPR_programa_coraza_2000_desc: "새로운 기갑 계획은 우리 군을 위한 새로운 기갑 장비를 생산하는 데 도움이 될 것입니다."
 SPR_fuerzas_armadas_de_espana: "스페인 국군"
 SPR_fuerzas_armadas_de_espana_desc: "스페인군은 우리나라의 자부심입니다. 국민의 안전을 지키고 적을 막아내기 위해 군에 각별한 관심을 기울여야 합니다."
 SPR_tank_cooperation: "전차 협력"
 SPR_tank_cooperation_desc: "전차 설계와 생산에서 협력하는 것은 우리와 나토를 위해 이로울 것입니다."
 SPR_german_designs: "독일의 설계"
 SPR_german_designs_desc: "독일은 지난 100년 동안 많은 훌륭한 전차를 생산했습니다. 최고 수준의 장갑 설계자들과 협력하면 우리도 강력한 자체 장갑 차량을 개발할 수 있습니다."
 SPR_american_designs: "미국의 설계"
 SPR_american_designs_desc: "미국의 장갑 차량은 경쟁력이 있으며 기술적으로 전 세계 대부분의 장갑 차량보다 우월합니다. 미국 설계자들과 협력하면 인류에게 알려진 최고의 장갑 차량 가운데 일부를 만들 수 있을 것입니다."
 SPR_domestic_designs: "자국 설계"
 SPR_domestic_designs_desc: "우리 장갑 차량 설계에 외세의 영향은 필요하지 않습니다. 바로 이곳 우리 땅에서 직접 설계할 수 있습니다!"
 SPR_learn_from_the_lince: "살쾡이로부터의 교훈"
 SPR_learn_from_the_lince_desc: "과거에서 배우는 것은 중요하며, 특히 더 훌륭하고 더 뛰어난 전차를 만들려면 더욱 그렇습니다!"
 SPR_spanish_ifv_programme: "스페인 보병전투차량 계획"
 SPR_spanish_ifv_programme_desc: "우리 보병전투차량 대부분은 ASCOD 사업에서 나왔으며, 유럽과의 더 큰 통합을 보장하기 위해 이를 선택했습니다. 보병전투차량 계획을 유지하고 가능하다면 확대하는 것은 시간을 잘 쓰는 일이 될 수 있습니다."
 SPR_reafirm_the_ascod_project: "Reaffirm The ASCOD Project"
 SPR_reafirm_the_ascod_project_desc: "우리의 이 사업에 대해 오스트리아에 재확인해 주면 신뢰를 높이고 향후 더 큰 협력의 길을 열어 줄 것입니다."
 SPR_ifv_cooperation: "보병전투차량 협력"
 SPR_ifv_cooperation_desc: "적보다 강해지려면 보병전투차량의 개발과 발전에서 협력하는 것이 필수적입니다!"
 SPR_pull_out_of_the_ascod_project: "오스트리아-스페인 협력 개발 프로젝트 (ASCOD) 철회"
 SPR_pull_out_of_the_ascod_project_desc: "ASCOD 사업은 완전한 재앙입니다! 우리를 남에게 의존하게 만든 것 외에는 아무것도 하지 못했습니다."
 SPR_a_new_ifv_enters_the_scene: "새로운 보병전투차량 혁신"
 SPR_a_new_ifv_enters_the_scene_desc: "이제부터 국산 보병전투차량이 전장을 지배할 것입니다. 보병전투차량을 직접 생산하려는 우리의 구상은 결실을 맺을 것입니다."
 SPR_apc_modernization: "병력수송장갑차의  현대화"
 SPR_apc_modernization_desc: "우리의 장갑차는 점점 약해지고 구식이 되고 있으며, 이에 대응하려면 현재 보유 중인 장갑차를 전면 개편할 현대화 계획을 시작해야 합니다."
 SPR_mowag: "스위스 모와그 (MOWAG) 기갑 차량 제조사"
 SPR_mowag_desc: "스위스는 방어에 관해서는 무엇을 하는지 알고 있습니다. 어쨌든 그들은 아주 오랫동안 비교적 안전했습니다."
 SPR_general_dynamics_land_systems: "제너럴 다이내믹스 랜드 시스템즈"
 SPR_general_dynamics_land_systems_desc: "모두가 미국 기업과 기술을 부러워합니다. 우리에게는 그 장비 일부를 손에 넣을 기회가 있으며, 이 기회를 놓치지 맙시다."
 SPR_apc_cooperation: "병력수송장갑차 협력"
 SPR_apc_cooperation_desc: "좋은 장갑차를 원한다면 다른 나라들이 이를 어떻게 만드는지 배워야 합니다."
 SPR_revive_enasa: "국영 트럭 제조사 (Enasa)의 부활"
 SPR_revive_enasa_desc: "에나사를 되살리면 우리가 추진해 온 새로운 개혁에 도움이 될 수 있으며, 새로운 육군의 자동차 생산에도 도움이 될 수 있습니다."
 SPR_a_new_pegaso: "새로운 페가수스 (Pegaso)"
 SPR_a_new_pegaso_desc: "다른 모든 나라에 의존하는 처지에서, 자체 차량을 생산하는 우리의 능력은 페가소를 현대화하는 것에서 시작해야 합니다."
 SPR_begin_army_reforms: "군제개혁 시작"
 SPR_begin_army_reforms_desc: "우리 육군은 구식이며 뒤처지고 있습니다. 현대의 분쟁에서 살아남으려면 개혁해야 합니다."
 SPR_maintain_mandatory_service: "의무 복부 유지"
 SPR_maintain_mandatory_service_desc: "우리 남성들은 원하든 원하지 않든 조국을 위해 복무해야 합니다. 이는 대열을 채우고 육군을 유지하는 데 도움이 될 것입니다."
 SPR_end_mandatory_service: "의무 복무 폐지"
 SPR_end_mandatory_service_desc: "의무 복무는 국민에게 부담입니다. 그들의 노력을 다른 곳에 집중시킬 수 있습니다!"
 SPR_mobility_warfare: "기동전"
 SPR_mobility_warfare_desc: "기민하게 움직이고 기동성을 갖추면 적을 긴장시키고 우리의 모든 움직임을 추측하게 만들 수 있습니다."
 SPR_complete_army_reforms: "군제 개혁 완료"
 SPR_complete_army_reforms_desc: "마침내 국군 개혁을 마무리할 때가 되었습니다. 우리의 노력이 헛되지 않았기를 바랍니다."
 SPR_accion_conjunta: "합동 작전"
 SPR_accion_conjunta_desc: "승리를 거두려면 군에서 합동 작전과 협력이 필수적입니다. 그것이 없다면 우리는 병사들의 목숨을 걸고 큰 도박을 하는 것입니다."
 SPR_the_new_tercio: "신 \"테르시오\" (Tercio)"
 SPR_the_new_tercio_desc: "테르시오의 영광과 유산은 육군의 새로운 개혁으로 기억될 것이며, 특히 군에서 이루어지고 있는 모든 신속한 개혁과 함께 기억될 것입니다."
 SPR_almogavares: "알모가바르 (Almogávares)"
 SPR_almogavares_desc: "원거리에서 작전을 수행하려면 우리 공수부대의 상태를 살펴보아야 합니다."
 SPR_supplementing_our_manpower: "우리 인력의 충원"
 SPR_supplementing_our_manpower_desc: "전쟁의 때가 왔을 때 부족하지 않도록 인력을 보충할 방법을 찾아야 합니다."
 SPR_the_foreign_legion: "외인부대"
 SPR_the_foreign_legion_desc: "오래전에 창설되어 한때 두려움을 사던 전투 부대였습니다. 그러나 오늘날에는 주로 평화 유지 임무를 돕고 있습니다."
 SPR_expand_the_foreign_legion: "외인부대 확장"
 SPR_expand_the_foreign_legion_desc: "세계는 서서히 무너지고 있으며, 이를 지탱하기 위해 외인부대를 확장해야 합니다. 우리가 보유할 수 있는 상비군을 늘리기 위해 외인부대를 추가로 개편하는 방안도 검토해야 합니다. 세계는 스페인 테르시오의 위력을 알아야 합니다!"
 SPR_the_regulares: "The Regular Brigades"
 SPR_the_regulares_desc: "정규 여단은 공식적으로 \\"푸에르사스 레굴라레스 인디헤나스\\"라 불리며, 주로 세우타와 멜리야 도시에서 모집한 스페인 육군의 지원 보병 부대입니다. 이들은 아프리카 군단의 중추를 이루며 우리 해외 병력의 중요한 부문입니다."
 SPR_expand_the_regulares: "Expand The Regular Brigades"
 SPR_expand_the_regulares_desc: "전통적으로 정규 여단은 세우타와 멜리야에서 모집되지만, 해외 영토에서 인구가 계속 늘어나고 있으므로 이 군 부문에 추가 자원을 투자할 가치가 있을 것입니다."
 SPR_fiel_regular_hasta_morir: "죽음의 문턱까지 숭고한 레귤러레스"
 SPR_fiel_regular_hasta_morir_desc: "정규 여단에 더 많은 병력을 편입하면 모든 전선에서 우리의 영향권이 확대될 것입니다."
 SPR_fuerzas_aeromoviles_del_ejercito_de_tierra: "육군 공중기동부대"
 SPR_fuerzas_aeromoviles_del_ejercito_de_tierra_desc: "일부 헬리콥터에 주목해야 합니다. 대부분 상태가 나쁘고 정비가 필요합니다."
 SPR_eurocopter_tigre: "유로콥터 티그르 (Tigre)"
 SPR_eurocopter_tigre_desc: "유럽의 공격 헬리콥터는 전장에서 필수적이며, 더 큰 전투에서 승리하기 위해 공군에서 그 영향력을 확대해야 합니다."
 SPR_a_deal_for_apaches: "아파치 협상"
 SPR_a_deal_for_apaches_desc: "미국과 헬리콥터 거래를 해야 합니다. 이들 헬리콥터는 최근 매우 효과적임이 입증되었습니다."
 SPR_attack_helicopter_cooperation: "공격 헬리콥터 협력"
 SPR_attack_helicopter_cooperation_desc: "뒤처지지 않도록 파트너들과 협력하여 헬리콥터를 개발해야 합니다."
 SPR_cantabrico_programme: "칸타브리아 (Cantábrico) 프로그램"
 SPR_cantabrico_programme_desc: "칸타브리코 계획을 확대하면 우리 군은 국산을 유지하고 외세의 영향과 의존에서 벗어날 수 있습니다."
 SPR_the_corocotta_attack_helicopter: "코로코타 공격 헬리콥터"
 SPR_the_corocotta_attack_helicopter_desc: "우리나라 군의 쾌거인 코로코타 헬리콥터는 전장에서 그 모습을 본 적들에게 분명 큰 공포를 퍼뜨릴 것입니다."
 SPR_eurocopter_cougar: "유로콥터 쿠거"
 SPR_eurocopter_cougar_desc: "프랑스가 개발한 쿠거는 앞으로 우리 공군과 작전에 유용하게 쓰일 수 있습니다."
 SPR_a_deal_for_chinooks: "치누크 협상"
 SPR_a_deal_for_chinooks_desc: "치누크는 오랫동안 미국에게 핵심 장비였으며, 우리가 이를 손에 넣을 수 있다면 역량을 확대할 수 있습니다."
 SPR_nhindustries: "NH인더스트리스"
 SPR_babieca_programme: "바비에카 수송 헬리콥터 프로그램"
 SPR_babieca_programme_desc: "바비에카 수송 헬리콥터는 스페인 기술의 최신 돌파구입니다. 새로운 헬리콥터를 생산할 수 있게 되면 전개 임무가 악몽이 되지 않을 것임을 알고 안심할 수 있습니다."
 SPR_the_babieca_transport_helicopter: "우리의 수송 헬리콥터"
 SPR_the_babieca_transport_helicopter_desc: "병력을 전개하려면 새로운 수송 헬리콥터가 필요합니다. 현재 보유 장비는 신뢰할 수 없고 구식이며, 새로운 사업이 이 문제를 해결할 것입니다."
 SPR_armada_espanola: "스페인 해군"
 SPR_armada_espanola_desc: "스페인 해군(아르마다 에스파뇰라) 또는 간단히 아르마다는 스페인군의 해군 부문입니다. 15세기에 창설되었으며 창설 이래 끊임없이 존재하며 아메리카 식민화와 수많은 기타 세계적 분쟁에 참여했습니다. 제국의 대부분이 외세와 내분으로 상실된 이후 규모는 작게 유지되었으나, 계속 혁신을 이어가는 중요한 해군으로 남아 있습니다."
 SPR_guard_our_coasts: "해안을 수비하라"
 SPR_guard_our_coasts_desc: "아르마다의 첫 번째 임무는 스페인 본토의 해안을 지키는 것입니다. 해안 방어 없이는 우리의 방어에 안심할 수 없습니다. "
 SPR_flosub: "잠수함 함대 (FLOSUB)"
 SPR_flosub_desc: "잠수함 함대는 어느 정도 돌봄이 필요합니다."
 SPR_escort_modernization: "수송 현대화"
 SPR_escort_modernization_desc: "우리 함선을 뒷받침하는 기술을 현대화하면 함대가 계속 경쟁력을 유지할 수 있습니다."
 SPR_infanteria_de_Marina: "해병대 보병"
 SPR_infanteria_de_Marina_desc: "해병 보병은 해군과의 협동이 필요한 분쟁에서 중요합니다. 일반 군대가 도저히 채울 수 없는 역할을 수행합니다."
 SPR_floan: "항공기 편대 (FLOAN)"
 SPR_floan_desc: "해군의 FLOAN 부대는 해군의 항공 부문입니다. 해안 일대에서 해군 작전을 지원합니다."
 SPR_floans_dream: "항공기 편대의 꿈"
 SPR_floans_dream_desc: "우리는 현재 항공모함을 보유하고 있지 않지만, 이러한 거대한 함선을 보유하는 것은 우리 해군의 꿈입니다."
 SPR_capital_ship_modernization: "주력함 현대화"
 SPR_capital_ship_modernization_desc: "우리의 대형 함선에는 구식 기술이 일부 탑재되어 있는 것으로 보입니다. 장비를 현대화하면 최신 상태를 유지하고, 마주칠 수 있는 다른 국가들에 맞서 경쟁력을 유지할 수 있습니다."
 SPR_spanish_armada_resurgent: "스페인 무적함대의 부활"
 SPR_spanish_armada_resurgent_desc: "이렇게 아르마다는 다시 부활합니다. 해군에 대한 막대한 투자가 위대하고 강력한 해군을 되살렸고, 이전의 영광을 되찾게 했습니다."
 SPR_escuela_naval_militar: "해군사관학교"
 SPR_escuela_naval_militar_desc: "제독은 나무에서 자라지 않습니다. 해군사관학교가 명망 높은 학교 가운데 하나가 되고 최고의 수준이 되어 아르마다의 인적 자본을 길러내는 것이 중요합니다."
 SPR_espacio_de_batalla: "전장 (Espacio De Batalla)"
 SPR_espacio_de_batalla_desc: "새로 훈련된 제독들이 전투 데뷔를 위해 연습하고, 현재 군에 있는 제독들의 기량을 갈고닦을 수 있는 전투 공간을 마련합니다."
 SPR_sector_defensa: "스페인 방위부"
 SPR_sector_defensa_desc: "스페인의 방위 부문은 지난 몇 년 동안 쇠퇴했으며, 스페인이 나토 및 미국과 통합되면서 외주화되었습니다."
 SPR_infraestructura_maritima_del_norte: "북부 해상 기반시설"
 SPR_infraestructura_maritima_del_norte_desc: "북부의 해양 기반시설에 투자하면 대서양에서 분쟁이 발생할 경우 아르마다가 보급을 받을 기지를 충분히 확보할 수 있습니다."
 SPR_infraestructura_maritima_del_sur: "남부 해상 기반시설"
 SPR_infraestructura_maritima_del_sur_desc: "남부의 해군 기지와 기반시설은 지중해에서 우리의 전력을 유지해 줍니다."
 SPR_bases_aereas_del_norte: "북부 공군기지"
 SPR_bases_aereas_del_norte_desc: "스페인 북부의 하늘을 지배하고 공군 기지에 충분히 투자하면 공군이 건재하게 유지됩니다."
 SPR_bases_aereas_del_sur: "남부 공군기지"
 SPR_bases_aereas_del_sur_desc: "남부 공군 기지는 개선이 필요합니다."
 SPR_tedae: "스페인 항공우주기술방위 위원회 (TEDAE)"
 SPR_tedae_desc: "기술 기반에 더 많은 투자를 하면 스페인군에 적합한 장비를 점점 더 많이 설계할 수 있게 될 것입니다."
 SPR_instituto_espanol_de_estudios_estrategicos: "스페인 전략 연구기관"
 SPR_instituto_espanol_de_estudios_estrategicos_desc: "이곳에서 설계한 장비를 생산하고 가장 뛰어난 인재들을 모아 더 새롭고 더 나은 장비를 설계하는 것은 성공을 낳을 뿐입니다."
 SPR_fabricas_de_armas: "무기 공장"
 SPR_fabricas_de_armas_desc: "무기 공장에 추가 자원을 지원하면 해외 공급업체에 대한 의존을 일부 덜어낼 수 있습니다."
 SPR_subsidios_industriales_militares: "군수 산업 보조금"
 SPR_subsidios_industriales_militares_desc: "군수 산업에 보조금을 지급하면 외국산 공급업체에 대한 우리의 의존도를 계속 줄이는 데 도움이 될 것입니다."
 SPR_complejo_industrial_militar: "군산복합산업단지"
 SPR_complejo_industrial_militar_desc: "스페인의 군산복합체는 지구상에서 가장 강력한 복합체 가운데 하나가 될 것입니다. 군수 및 무기 산업을 경제에 통합하는 것은 관련된 모두에게 이로울 뿐입니다."
 SPR_instituto_nacional_de_tecnica_aeroespacial: "국립항공우주기술기관"
 SPR_instituto_nacional_de_tecnica_aeroespacial_desc: "우주 영역에서 우리의 힘은 상대적으로 미약하지만, 그럼에도 항공우주 산업에 우리의 족적을 남기는 것은 중요합니다."
 SPR_hisdesat: "히스데사트 (Hisdesat) 우주 기술 기업"
 SPR_hisdesat_desc: "히스데삿은 스페인에 통신 위성을 제공하기 위해 히스파삿, EADS CASA(현 에어버스), 인드라 시스테마스, 세네르, 잉헤니에리아 이 세르비시오스 아에로에스파시알레스 기업들의 복합기업으로 설립되었습니다. 대부분은 보안 통신과 정지궤도 위치 용도로 구성되어 있습니다."
 SPR_sener: "세너 (SENER) 엔지니어 건설 기업"
 SPR_sener_desc: "세네르는 다양한 민간 및 군사 용도를 제공하는 엔지니어링 및 건설 기업입니다. 핵심 사업 분야 가운데 하나는 스페인군에 대공 방어 체계를 납품하는 계약을 수행하고 PROBA-3 임무의 원격 측정과 통신을 개선하는 것입니다."
 SPR_ejercito_del_aire: "공군"
 SPR_ejercito_del_aire_desc: "에헤르시토 델 아이레(스페인 공군)는 20세기 초에 처음 모습을 갖추었고 1913년 모로코에서 첫 전투 행동을 겪었습니다. 스페인 공군은 지난 세기 동안 수많은 교전을 경험했으며 동맹국들과의 긴밀한 통합을 계속 유지하고 있습니다."
 SPR_calm_before_the_typhoon: "폭풍 전의 고요"
 SPR_calm_before_the_typhoon_desc: "타이푼 시리즈 전투기는 최상급이며 다른 유럽 군대와의 중요한 연계 수단이 됩니다."
 SPR_hug_the_hornets_nest: "호넷의 둥지를 껴안아라"
 SPR_hug_the_hornets_nest_desc: "호넷은 미국의 강력한 전투기입니다. 이를 스페인 공군의 주력으로 삼는 방안을 검토해 볼 만합니다."
 SPR_fighter_cooperation: "전투기 협력"
 SPR_fighter_cooperation_desc: "국제 협력은 우리에게 점점 더 나은 항공기를 가져다줄 뿐입니다."
 SPR_reverse_engineering_fighters: "역설계 전투기"
 SPR_reverse_engineering_fighters_desc: "동맹국으로부터 획득한 전투기는 우리가 전투기를 어떻게 설계해야 하는지를 보여 주는 본보기입니다. 이들 기술을 역설계하면 공군이 외세에 덜 의존하도록 자체 개발한 설계를 마련하는 데 도움이 될 수 있습니다."
 SPR_floan_r_and_d: "해공군 합동 작전"
 SPR_floan_r_and_d_desc: "해군 항공 부대에는 추가 자금과 연구 개발이 필요할 수 있습니다. 함선 위의 하늘을 맑고 자유롭게 지키기 위해 이들이 경쟁력을 갖추는 것은 필수적입니다."
 SPR_playing_catch_up: "항공기 제조업 향상"
 SPR_playing_catch_up_desc: "공군과 국내 항공기 제조업은 우리가 세계와 경쟁하며 스스로를 무장할 능력을 유지하려면 갖췄어야 할 모습에 크게 못 미치는, 방치되어 썩은 껍데기입니다. 이제 따라잡아 항공기 제조와 설계의 최전선으로 복귀할 때입니다."
 SPR_start_a_bomber_fleet: "폭격기 편대 개시"
 SPR_start_a_bomber_fleet_desc: "우리 공군은 대부분 경량 전투기와 다목적 전투기를 중심으로 구성되어 있습니다. 폭격기는 우리 군을 지원하기 위한 중요한 통합 전력이 될 것입니다. "
 SPR_close_air_support: "근접항공지원"
 SPR_close_air_support_desc: "모든 공군의 핵심은 근접 항공 지원입니다. 근접 항공 지원이 없으면 지상군은 공중으로부터 어떠한 지원도 받지 못합니다."
 SPR_death_from_above: "하늘에서 내려오는 죽음"
 SPR_death_from_above_desc: "공군을 위해 추가 폭격기와 근접 항공 지원기를 설계해야 합니다. 이 두 지원 부류는 최고의 지원을 제공할 수 있으며, 적에게 하늘에서 죽음을 퍼부을 수 있습니다."
 SPR_control_the_skies: "창공을 통제하라"
 SPR_control_the_skies_desc: "훌륭한 공군이라면 필요한 곳의 제공권을 장악할 수 있어야 합니다. 우리 공군이 스페인 상공의 제공권을 장악하지 못하면 적들의 샌드백이 되고 말 것입니다."
 SPR_primary_bfm: "필수 기본전투기기동 (BFM)"
 SPR_primary_bfm_desc: "우리가 선택하는 주요 기본 전투 기동은 결국 우리 항공기가 적과 맞서는 교리를 바꿔 놓을 것입니다. 경쟁력을 유지하려면 우리의 필요에 가장 잘 맞는 교리를 선택하고 그 기량을 갈고닦아야 합니다."
 SPR_relative_bfm: "상대적 기본전투기기동 (BFM)"
 SPR_relative_bfm_desc: "상대적인 기본 전투기 기동을 개선하면 우리 전력의 다면성에 추가적인 향상을 가져올 수 있습니다. 스페인은 결코 한 가지 재주만 가진 전투기가 되지 않을 것입니다."
 SPR_dominate_the_skies: "하늘을 장악하라"
 SPR_dominate_the_skies_desc: "스페인 공군은 하늘을 지배하고 우리에게 맞서는 자들을 섬멸할 것입니다."
 spain.1.t: "카나리아 운동"
 spain.1.d: "카나리아 운동은 카나리아인들 스스로의 자결권 확보를 위한 현재 진행형의 갈등입니다. 이는 1400년대 스페인 군주가 섬을 장악하였을 때 봉건 노예 제도의 뿌리가 되었습니다. 이 운동은 지방분권주의와 자치적인 지역 사회의 구축을 시도했던 프랑코의 이념 아래 급격히 성장하였습니다."
 spain.1.a: "움직임을 탄압해라"
 spain.1.b: "움직임을 제한하자"
 spain.1.c: "카나리아를 혼돈에 빠트려라"
 spain.2.t: "빌바오 회의"
 spain.2.d: "빌바오는 바스크 지역의 분리주의 움직임의 상징으로써 자리하고 있습니다. 우리는 '바스크 조국과 자유 (ETA)'의 심장과 기타 관련된 요소들을 타격하기 위한 준비를 시작하며 새로운 방향을 잡았습니다. 어떻게 진행해야 할까요? 과연 현재와 같은 입장을 고수해야할까요, 아니면 바스크의 자유를 제한하거나, 심지어는 가혹한 편견으로 저항군을 박멸해야 할까요?"
 spain.2.a: "현 상황을 유지하자."
 spain.2.b: "바스크의 자유를 제한하자"
 spain.2.c: "바스크의 저항군을 부숴라"
 spain.3.t: "루고의 운명"
 spain.3.d: "Lugo is a city of great importance to the Galician people. It is fitting we decide their fate in this country at this site. Should we keep the status quo, or should we adjust the fate of the Galegos?"
 spain.3.a: "현 상황을 유지하자."
 spain.3.b: "갈리시아의 자유를 제한하자"
 spain.3.c: "갈리시아 문화를 말살시켜라"
 spain.4.t: "바르셀로나인과의 화해"
 spain.4.d: "바르셀로나는 카탈루냐인들의 중심지입니다. 이제 카탈루냐와의 화해를 위한 새로운 정책을 준비할 때 입니다. 이 변화로 인한 저항은 극심할 것으로 보이며 도시 내부의 대규모 격변이 일어날 것으로 예상됩니다. 어떻게 진행해야 할까요?"
 spain.4.a: "현 상황을 유지하자."
 spain.4.b: "카탈루냐의 자유를 제한하자"
 spain.4.c: "카탈루냐의 저항군을 부숴라"
 spain.5.t: "세비야 조약"
 spain.5.d: "The city of Seville has been a mainstay in our nation for decades. It has been a seat of great colonial expansion, the seat of the Andalusian autonomous community, and an economic strongpoint in our nation. The people of Andalusia see it as a beacon of their identity. What shall we do with the people of the south?"
 spain.5.a: "현 상황을 유지하자."
 spain.5.b: "안달루시아인의 자유를 제한하자"
 spain.5.c: "안달루시아의 저항군을 부숴라"
 spain.6.t: "북부 지역의 시민권에 대한 문제"
 spain.6.d: "현 정부는 새로운 법률을 제정하기로 결정하였습니다. 바로 갈리시아와 바스크 지역의 시민권에 대해서 말이죠. 우리가 생각한 방안은 시민권을 철회하거나, 법률로써 억압하거나, 현재의 입장을 우호적으로 변모시키는 방법이 고안되었습니다. 어떻게 진행해야할까요?"
 spain.6.a: "시민권을 철회하자"
 spain.6.b: "유연하게 접근하자"
 spain.6.c: "화해한다"
 spain.7.t: "남부 지역의 시민권에 대한 문제"
 spain.7.d: "Our current government has decided that we must begin a new process in our legislation. The status of citizenship for the people of Catalonia & Andalusia. The options we have presented are the revocation of citizenship, legislation of oppression, or a turn in our current policy. What should we proceed with?"
 spain.7.a: "시민권을 철회하자"
 spain.7.b: "유연하게 접근하자"
 spain.7.c: "화해한다"
 spain.8.t: "우리를 지지하는 바스크인"
 spain.8.d: "바스크 공동체 내의 영향력 있는 인사와 단체가 중앙 정부에 대한 지지를 표명했습니다. 우리는 호의에 보답하여 일부 자원을 투입해 이들의 목소리를 높여 줄 수 있습니다."
 spain.8.a: "우리가 얻을 수 있는 것은 가져갈 것이다"
 spain.8.b: "우리의 지지 세력에 호응하자"
 spain.9.t: "저항하는 바스크인들"
 spain.9.d: "바스크 지역에서 대규모 시위가 일어났습니다. 군중이 빌바오와 비토리아에 모여 중앙 정부에 대한 불만을 표출하고 바스크의 분리 독립을 요구하고 있습니다. 대응책을 정해야 합니다. 불만을 마음껏 토로하게 두어 분리주의 운동이 탄력을 받을 위험을 감수할 것인지, 아니면 반대 의견을 진압하려 시도할 것인지 결정해야 합니다."
 spain.9.a: "그들의 체제에서 그들을 끌어내리자"
 spain.9.b: "평화를 지속하자"
 spain.9.c: "탄압해라"
 spain.10.t: "바스크인들의 폭동"
 spain.10.d: "바스크 지역의 시위가 극단주의 세력과 기회주의자들에 의해 대규모 폭동으로 변질되며 파괴적으로 번졌습니다. 도시의 혼란 속에서 우리는 통제를 완화하거나, 폭도를 해산시키기 위해 특수 진압 부대를 투입해야 합니다."
 spain.10.a: "그들의 체제에서 그들을 끌어내리자"
 spain.10.b: "기동대를 배치시켜라"
 spain.11.t: "경찰과 충돌하는 바스크인들"
 spain.11.d: "바스크의 폭도들이 경찰의 투입에 폭력으로 맞섰습니다. 폭도들이 도시에 평화를 되찾으려는 경찰의 시도에 맞서 즉석 무기를 동원하면서 빌바오는 전쟁터처럼 보입니다. 도시에 광범위한 피해가 발생했으며 여러 명의 사망자가 보고되었습니다."
 spain.11.a: "사태를 수습하자"
 spain.12.t: "우리를 지지하는 갈리시아인"
 spain.12.d: "갈리시아 공동체 내의 영향력 있는 인사와 단체가 중앙 정부에 대한 지지를 표명했습니다. 우리는 호의에 보답하여 일부 자원을 투입해 이들의 목소리를 높여 줄 수 있습니다."
 spain.12.a: "우리가 얻을 수 있는 것은 가져갈 것이다"
 spain.12.b: "우리의 지지 세력에 호응하자"
 spain.13.t: "저항하는 갈리시아인들"
 spain.13.d: "갈리시아에서 대규모 시위가 일어났습니다. 군중이 라코루냐와 비고에 모여 중앙 정부에 대한 불만을 표출하고 갈리시아의 분리 독립을 요구하고 있습니다. 대응책을 정해야 합니다. 불만을 마음껏 토로하게 두어 분리주의 운동이 탄력을 받을 위험을 감수할 것인지, 아니면 반대 의견을 진압하려 시도할 것인지 결정해야 합니다."
 spain.13.a: "그들의 체제에서 그들을 끌어내리자"
 spain.13.b: "평화를 지속하자"
 spain.13.c: "탄압해라"
