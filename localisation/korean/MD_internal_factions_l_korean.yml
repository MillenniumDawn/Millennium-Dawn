 reduce_taxes_farmer_mission_tt: "우리의 §Y법인세율§!이 §Y[?reduction_target_farmers_tax_rate|0]%§! 미만임 (현재 §Y[?corporate_tax_rate|0]%§!)\n"
 reduce_taxes_farmer_mission: "농민들의 감세 요구"
 reduce_taxes_farmer_mission_desc: "농민들은 최근의 판매 부진과 경제 내 인플레이션 상승으로 추가 자금이 필요합니다. 그들은 이를 돕기 위해 우리의 §Y법인세율§!을 §G5%§! 낮춰 달라고 요청했습니다."
 agricultural_district_tax_credits_decision: "§Y상업화된 농업 지구§! 세액 공제"
 agricultural_district_tax_credits_decision_desc: "We can issue a series of small tax credits to help assuage the Farmers' economic issues but at the cost of reduced income for the next few months. How should we proceed?"
 allow_foreign_nationals_military_decision: "군 내 외국 국적자 허용"
 allow_foreign_nationals_military_decision_desc: "우리 군은 위태로운 처지에 있으며, 시민권을 보장하는 방식으로 추가 징집병을 받아들여야 합니다."
 repeal_foreign_nationals_military_decision: "군 내 외국 국적자 허용 철회"
 repeal_foreign_nationals_military_decision_desc: "우리는 최근 외국 국적자의 군 입대를 허용했습니다. 이 결정은 군 내부에 문제를 일으켰으며, 이 결정을 철회하는 것이 바람직할 수 있습니다."
 internal_faction_labour_dispute_companies_favoured: "노동 분쟁 - 기업 선호"
 internal_faction_labour_dispute_companies_favoured_desc: "최근 노동 문제에 대하여, 정부는 노동자보다 기업의 손을 들어주었습니다"
 internal_faction_labour_dispute_union_favoured: "노동 분쟁 - 노동자 선호"
 internal_faction_labour_dispute_union_favoured_desc: "최근 노동 문제에 대하여, 정부는 기업보다 노동자의 손을 들어주었습니다"
 internal_faction_economic_boom: "경제 호황"
 internal_faction_economic_boom_desc: "우리 파벌들이 경제 성장의 원동력이 되어주고 있습니다!"
 internal_faction_subsidize_convoy_production: "수송선 생산 보조금 지급"
 internal_faction_subsidize_convoy_production_desc: "추가 현금 흐름이 필요했던 도크의 요청에 따라 수송선단 화물선 생산에 보조금을 지급했습니다."
 internal_factions_allowed_foreign_nationals_military: "복무가 시민권을 보장함"
 internal_factions_allowed_foreign_nationals_military_desc: "최근 우리는 시민권 없이도 외국 국적자가 군에 입대할 수 있도록 하는 법률과 입법을 통과시켰습니다. 이는 군이 신병을 모집하는 방법이 되었으나 군 내부에 일부 불안정을 초래했습니다."
 internal_factions_temporarily_reduce_migrations: "이주 목표 일시 감축"
 internal_factions_temporarily_reduce_migrations_desc: "국내 특정 외국계 이익 단체의 압력으로 인해 우리는 이주 목표를 감축했습니다."
 internal_factions_events.0.t: "기업 소유주들의 감세 요청"
 internal_factions_events.0.d: "중소기업 사업주 대표가 우리 정부를 찾아왔습니다. 그들은 국가의 경제 상황 때문에 소규모 기업이 고통받고 있다고 말합니다. 그들은 사업이 성공하도록 돕기 위한 일시적인 감세를 받고 싶어 합니다."
 internal_factions_events.0.o1: "일부 세금 감면에 대해 동의한다"
 internal_factions_events.0.o2: "지금 예산으로는 감당할 수 없다!"
 internal_factions_events.0.o3: "말도 안되는 소리다. 그냥 더 올려버리자!"
 internal_factions_events.0.o4: "문제 해결을 위해 노동 조합과 함께 움직이자"
 internal_factions_events.1.t: "지속되는 중소 기업의 합병"
 internal_factions_events.1.d: "최근에 성공적인 스타트업 회사가 매각되기로 결정되었습니다. 현재 [ROOT.GetNameDef]에서 사업을 확장하고자 하는 대규모 외국 기업의 큰 관심을 끌고 있습니다. 일부는 이러한 확장을 막아야 한다고 주장하지만, 인수를 방지하는 것은 자유 시장 원칙에 위배될 수 있습니다."
 internal_factions_events.1.o1: "계속해서 인수 합병을 하도록 놔두자"
 internal_factions_events.1.o2: "이런 악습은 없어져야 한다"
 internal_factions_events.1.o3: "국가 차원에서 먼저 인수해버리자"
 internal_factions_events.1.o4: "국내 기업과 우선적으로 합병할 수 있도록 만들자"
 internal_factions_events.2.t: "관료제로 붕괴된 중소 기업"
 internal_factions_events.2.d: "많은 소기업 사업주가 국가의 관료주의 수준을 비판하고 있습니다. 서류를 하나씩 작성하고, 허가를 신청하고, 관청을 전전하는 일이 사람들이 새 회사를 세우는 것을 막는다고 그들은 말합니다. 그들은 우리가 소규모 기업에 대한 일부 규제를 줄여 주기를 원합니다."
 internal_factions_events.2.o1: "관료제의 비중을 낮추자"
 internal_factions_events.2.o2: "그 정도의 행정 비용은 필요하다"
 internal_factions_events.2.o3: "그래도 일부분에선 더 유연하게 대처해도 되지 않을까.."
 internal_factions_events.3.t: "증가하는 중소 기업 보조금 요구"
 internal_factions_events.3.d: "A group of businessmen have approached us, asking us to allocate more start-up funds in order to support new companies. Setting up a company is an expensive operation, and the state should support small business owners."
 internal_factions_events.3.o1: "당연히 기업가들을 더 도와야 한다"
 internal_factions_events.3.o2: "우리는 개인 사업에 국가의 자금을 흘려보내게 나둬선 안된다"
 internal_factions_events.3.o3: "은행으로부터 자금을 보호하라"
 internal_factions_events.4.t: "중소 기업에 대한 자금 대출 금지"
 internal_factions_events.4.d: "우리에게 문제가 제기되었습니다. 많은 소기업 최고경영자들이 은행이 대출을 해 주는 데 점점 더 인색해지고 있다고 말합니다. 그러나 은행가 대표는 누군가 발명한 모든 '혁명적인' 주스 제조업자에게 은행이 돈을 빌려주지 않는 것은 지극히 정상이라고 말했습니다."
 internal_factions_events.4.o1: "은행들에게 자기 돈 관리를 더 확실하게 하라고 해라"
 internal_factions_events.4.o2: "은행은 누구에게 대출을 지급할지 결정할 자유가 있다"
 internal_factions_events.4.o3: "중소기업에게 국가에서 직접 대출을 지급하자"
 internal_factions_events.5.t: "친환경에 대한 갈등"
 internal_factions_events.5.d: "A small company offering clean energy solutions has brought a large fossil fuel corporation into court. The large corporation is charged with intentionally running negative marketing campaigns against the smaller corporation, as well as industrial espionage and sabotage. The court case is making head lines across the country, and is seen as a fight between renewable and fossil energy."
 internal_factions_events.5.o1: "친환경 에너지가 보편화 될 수 있도록 해라"
 internal_factions_events.5.o2: "화석 에너지가 보편화 될 수 있도록 해라"
 internal_factions_events.5.o3: "우리는 이 문제에 엮여선 안된다"
 internal_factions_events.6.t: "우물 안 개구리"
 internal_factions_events.6.d: "많은 대기업이 의도적으로 소규모 경쟁사를 인수한 뒤 문을 닫게 하여 경쟁을 막고 있다는 불만이 접수되고 있습니다. 많은 이들은 대기업들이 서로 짜고 카르텔을 형성해 시장을 장악하려 한다고 우려합니다."
 internal_factions_events.6.o1: "원래 사업의 세계란 이렇게 돌아가는 거지"
 internal_factions_events.6.o2: "이런 행태를 규탄한다!"
 internal_factions_events.6.o3: "카르텔이라고 했나? 아무래도 서로 공감할 수 있는 부분이 있겠구만"
 internal_factions_events.7.t: "근로 계약 분쟁"
 internal_factions_events.7.d: "Business owners are demanding that national work contracts could be loosened by local contracts between the employee and the employer. By allowing less restrictions on who can be fired and more liberties in allocated work hours, it would be easier for small businesses to hire staff. Most labour unions have already protested against this suggestion, saying that it's out of the question that the rights of the workers are reduced. In fact, they are suggesting more restrictions in work contracts to eliminate things such as paid internships."
 internal_factions_events.7.o1: "개개인의 근로 계약을 선호한다"
 internal_factions_events.7.o2: "무엇보다 노동자가 우선이다!"
 internal_factions_events.7.o3: "서로 이해할 수 있는 타협점이 있지 않을까?"
 internal_factions_events.8.t: "종교적 기념일에 열리는 상점"
 internal_factions_events.8.d: "최근 우리의 한 대도시에서 가게 주인이 국가 종교 휴일에 가게를 열어 물의가 빚어졌습니다. 종교계는 이것이 국가의 전통에 어긋나며, 성일은 예배와 기도를 위한 날이라고 밝혔습니다."
 internal_factions_events.8.o1: "돈 보다 우리의 전통이 우선이다!"
 internal_factions_events.8.o2: "과연 누가 종교를 비웃을 수 있을까?"
 internal_factions_events.9.t: "스스로를 주식 시장에 내놓는 중소기업들"
 internal_factions_events.9.d: "A popular and successful start-up company has decided list itself on the national stock market. This gives us an investment opportunity to buy some of the shares of that company."
 internal_factions_events.9.o1: "일부 주식을 매입하자"
 internal_factions_events.9.o2: "지금은 그럴 여건이 안된다"
 internal_factions_events.10.t: "중소기업의 호황"
 internal_factions_events.10.d: "A record breaking number of new companies have been recently founded in the country. This has created many jobs and is positively affecting our economy. The economy is booming and we are thriving under the the record number of startups!"
 internal_factions_events.10.o1: "훌륭해"
 internal_factions_events.11.t: "정치적 경쟁 상대 정당에 대한 후원을 모색하기"
 internal_factions_events.11.d: "우리의 정치적 라이벌이 소규모 기업 단체로부터 공동 기부를 받았습니다. 소기업 최고경영자들이 우리의 정치에 불만을 가지고 있는 것으로 보입니다."
 internal_factions_events.11.o1: "젠장"
 internal_factions_events.13.t: "대기업 파산!"
 internal_factions_events.13.d: "One of the largest companies within our nation has declared bankruptcy today. It truly is a sad day for our economy."
 internal_factions_events.13.a: "슬프군"
 internal_factions_events.13.b: "사업에 보조금을 지원하자."
 internal_factions_events.14.t: "$labour_unions$ Demand Pay Increases"
 internal_factions_events.14.d: "$labour_unions$ are now demanding that businesses and industrial conglomerates within our nation be forced to increase the pay to the workers."
 internal_factions_events.14.a: "사업가들의 편에 서자"
 internal_factions_events.14.b: "노동자들의 편에 서자"
 internal_factions_events.14.c: "우리는 개입할 이유가 없다"
 internal_factions_events.15.t: "$labour_unions$ Demand Better Healthcare"
 internal_factions_events.15.d: "$labour_unions$ are demanding we expand our healthcare budget. How should we proceed?"
 internal_factions_events.15.a: "요구를 수용하자"
 internal_factions_events.15.b: "요구를 거절한다"
 internal_factions_events.16.t: "$labour_unions$ Demand Increased Welfare Spending"
 internal_factions_events.16.d: "국내 노동조합은 노동자와 일할 수 없는 이들을 더 잘 지원하도록 사회 지출 예산을 늘릴 것을 요구하고 있습니다. 어떻게 대응해야 합니까?"
 internal_factions_events.16.a: "요구를 수용하자"
 internal_factions_events.16.b: "요구를 거절한다"
 internal_factions_events.17.t: "농업 개혁에 저항하는 농부들"
 internal_factions_events.17.d: "Small-scale subsistence farmers have revolted and demand that a multitude of factors should be incorporated into rural development, citing that the Neoclassical theory of on-farm production has only brought hardships for those dependent on farm inputs that are subject to market imperatives.\n\nState actors argue that transforming subsistence farmers into export-oriented producers would allow for the rural countryside to develop through marketization."
 internal_factions_events.17.a: "역삼각형 형태의 개발 모델을 도입하자"
 internal_factions_events.17.b: "저소득층에게만 이로운 성장에 집중하자"
 internal_factions_events.17.c: "현상 유지한다"
 internal_factions_events.17.dd: "지속적인 신고전주의 개발"
 internal_factions_events.18.t: "경제 지원을 요청하는 농부"
 internal_factions_events.18.d: "농민들은 현재 재정난에 직면해 있습니다. 그들은 모종의 보조금 가능성을 논의하기 위한 청원서를 제출했습니다."
 internal_factions_events.18.a: "농부에게 보조금을 지급하자."
 internal_factions_events.18.b: "일시불로 지급하자"
 internal_factions_events.18.c: "천천히 하자고 늙은이."
 internal_factions_events.19.t: "영공 침입"
 internal_factions_events.19.d: "외국 전투기가 영공을 침범한 후, 군은 해당 지역의 방공망을 강화할 것을 요구하고 있습니다. 고문들은 우리 주를 보호하기 위해 지대공 미사일 기지를 추가로 건설하거나 군수 산업을 추가로 건설할 것을 제안합니다. 우리 중 실용주의자들은 단순히 각각 하나씩 건설하자고 제안합니다.\n\n그들을 단호히 물리치고 그 과정에서 손쉽게 정치적 점수를 따는 것도 또 하나의 선택지이며, 대신 그들과의 관계를 유지하려 하는 것도 마찬가지입니다."
 internal_factions_events.19.o1: "지대공 미사일 발사대를 더 건설하자"
 internal_factions_events.19.o2: "군수공장을 더 건설하자"
 internal_factions_events.19.o3: "지대공 미사일 발사대와 군수 공장을 더 건설하자."
 internal_factions_events.19.o4: "제안을 거절하자."
 internal_factions_events.20.t: "보조금을 요청하는 해양 산업"
 internal_factions_events.20.d: "우리나라의 해양 산업이 정부에 재정 지원을 요청하고 있습니다. 일부 조선소는 파손되어 즉각적인 조치가 필요한 상태입니다. 해양 산업에 이 보조금을 지급해야 합니까?"
 internal_factions_events.20.o1: "허락한다"
 internal_factions_events.20.o2: "거부한다"
 MAR_industry_subsidies: "§Y해양산업 보조금§!"
 internal_factions_events_additional_expense_tt: "예산에 §Y추가 지출§!이 추가됩니다: [?mar_industry_calculator|0R3]\n"
 internal_factions_events.21.t: "생물 연료 투자를 촉구하는 농부들"
 internal_factions_events.21.d: "Agricultural Industry associations have approached the government to request investment in bio fuels. This would help stabilize the domestic grain market amid increased competition from international farmers. Representatives of major oil companies have voiced opposition to proposal."
 internal_factions_events.21.o1: "농부들을 무시하자."
 internal_factions_events.21.o2: "생물 연료 정제소에 투자하자."
 internal_factions_events.21.o3: "건설을 하되, 정유 회사를 안심시키자."
 internal_factions_events.22.t: "국가정보원이 민간인을 감시한 정황을 포착"
 internal_factions_events.22.d: "국가 정보부가 자국 국민들을 감시했다는 사실이 폭로자를 통해 드러났습니다. 대중들은 분노하고 있습니다! 그러나, 국가 지도자와 정보 업계에서는 이는 모두 국가의 안전을 위해 행해진 매우 일상적인 행동이었다고 해명하였습니다."
 internal_factions_events.22.o1: "그 주장을 무시하자."
 internal_factions_events.22.o2: "전면적인 감사를 시행하자."
 internal_factions_events.22.o3: "정보가 새나간 것을 감춰라."
 internal_factions_events.22.o4: "내부고발자를 처벌하라."
 internal_factions_events.23.t: "올리가르히의 부당한 사업 거래 포착"
 internal_factions_events.23.d: "우리 정보 기관이 국가 엘리트 한 명이 불법 사업 거래를 하는 것을 적발했습니다. 정부 일부 인사는 이 문제를 공론화하여 법정에 세우고자 합니다. 다른 이들은 문제를 덮어 두자고 제안했습니다."
 internal_factions_events.23.o1: "침묵하자."
 internal_factions_events.23.o2: "대중의 심판대에 올리자."
 internal_factions_events.23.o3: "미래에 올리가르히에 대한 감사를 진행하자."
 internal_factions_events.24.t: "올리가르히의 세금 감면 요구"
 internal_factions_events.24.d: "영향력 있는 여러 기업인이 정부 장관들에게 세금을 인하할 것을 제안했습니다. 그들은 이것이 국내 산업과 상업을 뒷받침하며 이러한 감세는 시간이 지나면 스스로 비용을 충당할 것이라고 말합니다."
 internal_factions_events.24.o1: "지금 당장은 감면 해줄 수 없다."
 internal_factions_events.24.o2: "개인의 세금을 줄여주자."
 internal_factions_events.24.o3: "기업의 세금을 줄여주자."
 internal_factions_events.24.o4: "모두의 세금을 줄이자."
 internal_factions_events.25.t: "해운업의 협상 제안"
 internal_factions_events.25.d: "우리의 주요 조선 기업 대표들이 새로운 거래를 가지고 정부를 찾아왔습니다. 그들에게는 구매할 수 있는 화물선 수송선단 선박이 여러 척 있습니다. 우리는 생산에 보조금을 지급하여 더 많은 선박을 편입하는 것을 도울 수도 있고, 일괄 구매할 수도 있습니다. 어떻게 하시겠습니까?"
 internal_factions_events.25.o1: "수송선 생산에 보조금을 지급하자."
 internal_factions_events.25.o2: "수송선을 구매하자."
 internal_factions_events.25.o3: "일시불로 모두 구매하자!"
 internal_factions_events.25.o4: "누가 그런 쓰레기를 원한단 말인가!"
 internal_factions_events.26.t: "정부에 반기를 드는 군부"
 internal_factions_events.26.d: "Recent policies from our current ruling coalition has become woefully unpopular with our military. They are citing that we are doing everything we can to weaken our national security."
 internal_factions_events.26.o1: "군비를 확장하자."
 internal_factions_events.26.o2: "요구를 거절하자!"
 internal_factions_events.26.o3: "천천히 완화시켜보자..."
 internal_factions_events.27.t: "군수 산업의 번영"
 internal_factions_events.27.d: "우리나라의 군수 산업은 [ROOT.GetLeader] 행정부 아래에서 번성하고 있습니다. 방위 부문에 소규모 투자를 하여 무기 산업의 이 절대적인 호황에 자금을 댈 수도 있고, 공개적으로 박수를 보낼 수도 있습니다. 어떻게 하시겠습니까?"
 internal_factions_events.27.o1: "군수 산업에 보조금을 지원하자."
 internal_factions_events.27.o2: "훌륭하군. 그들은 우리의 자랑이다!"
 internal_factions_events.28.t: "산업 복합 기업, 산업화 부족에 항의"
 internal_factions_events.28.d: "산업 복합 기업의 지도자들이 최근 국가의 산업화가 부족하다고 불평하며 [ROOT.GetLeader]을(를) 찾아왔습니다. 그들은 국가의 산업 부문이 방치되었다고 믿으며 산업 부문에 대한 추가 투자를 원합니다. 그들은 우리가 경제의 농업 쪽에 노골적으로 치중한 점을 직접 지적했습니다. 어떻게 대응해야 합니까?"
 internal_factions_events.28.o1: "산업가 놈들은 꺼져라."
 internal_factions_events.28.o2: "푼돈 정도는 쓸 수 있겠지."
 internal_factions_events.28.o3: "솔직히 이건 무의미하다."
 internal_factions_events.29.t: "농민들의 감세 요구"
 internal_factions_events.29.d: "농민 지도자들이 오늘 우리를 찾아와 세율을 낮춰 달라고 요청했습니다. 세율이 이미 빠듯한 이윤을 잠식하고 있어 일부 농민들이 과도한 압박을 받고 있다는 것입니다. 그들은 이를 위해 5% 감세를 목표로 해 줄 것을 요청했습니다. 우리는 정부를 통해 이 조치를 취할 수도 있고, 현재 예산을 유지할 수도 있습니다. 현재 세수는 줄어들겠지만, 농민들의 압박은 덜어질 것입니다."
 internal_factions_events.29.a: "요청을 승인한다"
 internal_factions_events.29.b: "우리는 돈이 필요하다"
 internal_factions_events.30.t: "깨진 약속"
 internal_factions_events.30.d: "정부는 요청대로 세금을 줄이지 못했고, 그 결과 농민들은 정부에 불만을 품고 있습니다. 참으로 슬픈 날이며, 앞으로 더 나쁜 결과가 닥칠 징조일 수 있습니다."
 internal_factions_events.30.a: "유감이다"
 internal_factions_events.31.t: "농공 복합 단지를 전환하는 산업가들"
 internal_factions_events.31.d: "우리나라의 산업가들이 숙고 끝에 $agriculture_district$을(를) $industrial_complex$(으)로 전환하는 절차를 시작했습니다. 트랙터 공장이었던 곳이 이제 자동차 공장으로 전환되는 것으로 보입니다."
 internal_factions_events.31.a: "아, 그렇군."
 internal_factions_events.31.b: "우리는 그 트랙터가 필요하다!"
 internal_factions_events.31.c: "사실 더 많이 전환하라!"
 internal_factions_events.32.t: "곡물 저장고를 매입하는 은행가들"
 internal_factions_events.32.d: "투자 업계 인사 일부가 자원을 모아 새로운 \\"분리 사무소\\"로 쓸 곡물 저장고 두 개를 매입했습니다. 분리 사무소가 무엇인지는 알 수 없지만, 우리는 이제 도시 밖에 기업 본사를 하나 더 두게 되었습니다."
 internal_factions_events.32.a: "니스"
 internal_factions_events.32.b: "농민에게 넘겨라!"
 internal_factions_events.33.t: "오래된 어장을 인수하는 해양 산업"
 internal_factions_events.33.d: "해양 산업이 해안 근처의 오래된 어장을 인수했습니다. 이 낡은 어장은 방치된 상태였으며, 국가를 더욱 산업화하려는 노력의 일환으로 시장 가격에 인수되었습니다."
 internal_factions_events.33.a: "니스"
 internal_factions_events.33.b: "농민에게 넘겨라!"
 internal_factions_events.34.t: "노동조합, 이주민에 항의"
 internal_factions_events.34.d: "노동조합은 최근 국내로 들어오는 이주민들이 임금을 깎아 조합원 노동자들의 몫을 잠식하고 있다며 항의하고 있습니다. 노동조합 지도자들은 현재 이주민 할당량을 줄여 달라고 정부를 찾아오고 있습니다. 어떻게 대응해야 합니까?"
 internal_factions_events.34.a: "그들은 너무 걱정이 많다!"
 internal_factions_events.34.b: "이주를 줄일 수도 있지 않을까?"
 internal_factions_events.34.c: "이주를 영구적으로 줄여라!"
 internal_factions_events.35.t: "거래를 제안하는 화석 연료 거물들"
 internal_factions_events.35.d: "화석 연료 산업이 오늘 새로운 전략 비축 시설을 건설하자는 새로운 거래를 제안했습니다. 그들은 정부가 나머지 비용을 댈 자금을 마련할 수 있다면 건설비의 절반을 부담하겠다고 합니다."
 internal_factions_events.35.a: "거래를 승인한다"
 internal_factions_events.35.b: "거래를 거절한다"
 internal_factions_events.36.t: "재생 에너지 투자"
 internal_factions_events.36.d: "특수 이익 단체와 국내 녹색주의자들이 정부가 재생 에너지 기반시설에 추가로 투자할 것을 요청하고 있습니다. 투자를 진행해야 합니까?"
 internal_factions_events.36.a: "투자를 승인한다"
 internal_factions_events.36.b: "투자를 거절한다"
 internal_factions_events.37.t: "이주 노동자를 착취하는 농업"
 internal_factions_events.37.d: "농업 부문이 모든 유형의 이주 노동자를 착취했다는 혐의를 받고 있습니다. 우리는 이를 단속할 수도 있고, 모른 척 눈감아 줄 수도 있습니다. 지금까지 경제는 다소 순조롭습니다!"
 internal_factions_events.37.a: "단속하라!"
 internal_factions_events.37.b: "모두가 그들을 착취한다!"
 LBA_fossil_fuel_industry: "국영 석유 공사"
 LBA_intelligence_community: "혁명 위원회"
 LBA_labour_unions: "인민 회의"
 LBA_landowners: "부족 지도자들"
 internal_factions_events.27.o3: "그것이 그들의 일이다."
 encourage_religion_in_the_government_decision: "정부 내 종교 장려"
 encourage_religion_in_the_government_decision_desc: "우리가 법률을 계속 발전시켜 나가는 동안 종교인들이 정부에 참여하도록 장려합니다."
 encourage_additional_resource_production_decision: "추가 자원 생산 장려"
 encourage_additional_resource_production_decision_desc: "자원 부문의 추가 생산을 장려하면 자원 자립에 더 가까워질 수 있습니다. 단기적으로 약간의 세금 감면을 제공하여 이를 실현할 수 있습니다."
 cut_taxes_on_the_rich_decision: "부유층 세금 감면"
 cut_taxes_on_the_rich_decision_desc: "경제 성장을 촉진하기 위해 부유층에 대한 세금을 감면할 때입니다."
 internal_factions_events.38.t: "대표성을 요구하는 종교 단체"
 internal_factions_events.38.d: "우리나라의 종교 단체들은 현재 정부 내 대표성을 늘려 달라고 청원하고 있습니다. 그들은 자신들이 정부에게 억압받지 않도록 자기 사람들이 더 나은 대표성을 갖기를 원합니다."
 internal_factions_events.38.a: "지도자들의 정부 참여를 허용한다"
 internal_factions_events.38.b: "제한적인 자문 역할만 허용한다."
 internal_factions_events.38.c: "아니."
 internal_factions_events.39.t: "종교 단체, 교육 분야 참여 요청"
 internal_factions_events.39.d: "여러 종교 단체가 각급 교육 위원회에 참여할 수 있도록 자리를 요청했습니다. 이들에게 교육 위원회에 참여할 기회를 허용할 수도 있고, 요청을 무시할 수도 있습니다."
 internal_factions_events.39.a: "위원회에 자리를 내어준다."
 internal_factions_events.39.b: "아니, 그럴 필요는 없다."
 impose_taxes_on_religious_institutions_decision: "종교 기관 과세"
 impose_taxes_on_religious_institutions_decision_desc: "우리나라의 종교 기관은 현재 세무 당국의 눈에는 법 위에 있습니다. 이들 단체에 대한 과세에 관한 새 규정을 도입하여 정부 국고에 추가 자금을 끌어들여야 합니다."
 repeal_taxes_on_religious_institutions_decision: "종교 기관 과세 철회"
 repeal_taxes_on_religious_institutions_decision_desc: "최근 종교 기관에 부과한 세금은 얻은 이득보다 훨씬 더 많은 부정적 결과를 낳았습니다. 해당 법률의 철회를 검토해야 할 것입니다."
 internal_factions_taxing_religious_institutions: "종교 기관 과세 중"
 internal_factions_taxing_religious_institutions_desc: "정부가 국내 종교 기관에 과세를 시작했습니다. 이는 정부의 예산 부족을 메우는 데 도움이 되지만, 국내 종교 파벌의 반감을 치르게 됩니다."
 internal_factions_taxing_religious_institutions_tt: "§Y종교 기관 과세§!로 인한 추가 수입: $$[?additional_income_taxing_religious_institutions|G3]"
 oli_not_positive_tt: "§Y$oligarchs$§! 관계가 50 미만 (현재: [OLI_opinion_display])"
 intc_not_positive_tt: "§Y$intelligence_community$§! 관계가 60 미만 (현재: [INTC_opinion_display])"
 internal_factions_events.40.t: "공산당 간부단과 군부, 이념을 두고 논쟁"
 internal_factions_events.40.d: "공산당 간부단과 군부가 국가가 나아가야 할 방향을 두고 논쟁을 벌이기 시작했습니다. 양측 모두 오만함 등 여러 요소가 뒤섞여 논쟁은 더욱 흐려지고 있습니다."
 internal_factions_events.40.a: "공산당 간부단의 편을 든다"
 internal_factions_events.40.b: "군부의 편을 든다"
 internal_factions_events.40.c: "양측을 모두 지원한다"
 internal_factions_events.41.t: "공산당 간부단, 정부에 양보 요구"
 internal_factions_events.41.d: "공산당 간부단은 향후 몇 개월 동안 임시 임명직으로서 정부의 양보와 특별 대표권을 요구했습니다. 관료적 형식주의를 없애고 소규모 맞춤형 변화를 시행할 수 있게 해주면 공산당 간부단 정당들에 이익이 될 것입니다."
 internal_factions_events.41.a: "정부 참여를 허용한다"
 internal_factions_events.41.b: "제한적인 자문 역할만 허용한다"
 internal_factions_events.41.c: "요청을 거부한다"
 sell_political_positions_to_the_highest_bidder: "정치 직위 매각"
 sell_political_positions_to_the_highest_bidder_desc: "몇 가지 정치적 책략을 쓰면 필수적이지 않은 정치 직위 일부를 측근들에게 팔 수 있습니다."
 encourage_further_party_propaganda: "당 선전 추가 장려"
 encourage_further_party_propaganda_desc: "당내 일부는 현재의 입지에도 불구하고 선거에서의 위치를 유지하기 위해 당 선전을 더욱 밀어붙여야 한다고 믿습니다."
 TAJ_oligarchs: "[TAJ.GetAdjective] 과두 재벌"
 TAJ_the_military: "타지키스탄 공화국군"
 TAJ_intelligence_community: "(SCNS) 국가안보위원회"
 TAJ_farmers: "[TAJ.GetAdjective] 농민"
 cut_taxes_industry_decision: "산업 세금 감면"
 cut_taxes_industry_decision_desc: "산업에 대한 과세는 우리 경제에 큰 부담이 되었습니다. 단기적으로는 산업이 내는 세금을 줄이고, 더 영구적인 해결책은 나중에 마련해야 합니다."
 raise_wages_small_medium_business_owners_decision: "노동자 임금 보조"
 raise_wages_small_medium_business_owners_decision_desc: "노동자 임금을 보조하면 중소기업 사업주의 부담이 일부 덜어져, 그들이 자신의 사업과 그들이 서비스하는 지역 경제에 더 투자할 수 있게 됩니다."
 PER_small_medium_business_owners: "바자르 상인들"
 PER_fossil_fuel_industry: "(NIOC) 이란 국영 석유 회사"
 PER_industrial_conglomerates: "파닥 국영 기업 협의회"
 PER_oligarchs: "ICCIMA"
 PER_defense_industry: "(MODAFL) 국방부"
 PER_maritime_industry: "(MIO) 해양 산업 기구"
 generic_description_the_military: "역사적으로 군은 많은 국가의 정치에서 극히 큰 영향력을 행사해 왔습니다. 장군과 제독이 민간 지도자의 자리에 오르면 그들은 국가에 대한 전례 없는 군사적 통제력을 얻습니다."
 PER_landowners: "이란 은행들"
 PER_farmers: "케샤바르즈 계층"
 PER_the_ulema: "시아파 성직자단"
 allow_temporary_cut_backs_on_regulations_decision: "규제 일시 완화 허용"
 allow_temporary_cut_backs_on_regulations_decision_desc: "경제 발전과 성장을 더욱 촉진하기 위해 규제를 일시적으로 완화하도록 허용합니다."
 internal_factions_events.42.t: "금요 예배 설교, 정치적 논쟁 촉발"
 internal_factions_events.42.d: "최근 설교에서 한 금요 예배 이맘이 정부가 다르게 처리해야 할 사안에 대한 자신의 견해를 밝혔고, 참석자 대다수가 그의 정치적 견해에 압도적으로 동의했습니다. 찬사와 불만이 뒤섞여 있으며, 이맘의 정치적 견해에 대한 소식은 전국적으로 점점 더 큰 인기를 얻고 있습니다."
 internal_factions_events.42.a: "그의 제안 중 일부를 검토하고 시행한다"
 internal_factions_events.42.b: "무시한다. 제정신이 아니다"
 internal_factions_events.43.t: "종교 교육을 둘러싼 분쟁"
 internal_factions_events.43.d: "최근 한 교육구와 성직자 재단 사이의 분쟁이 널리 퍼졌습니다. 공교육에 대한 성직자의 영향력과 특정 과목을 가르치는 방식을 두고 뜨거운 논쟁이 벌어졌습니다. 울라마는 일부 과학 과목을 보다 '이슬람적인' 교육과정으로 바꿀 필요가 있다고 주장했습니다."
 internal_factions_events.43.a: "울라마의 편을 든다"
 internal_factions_events.43.b: "교육구의 편을 든다"
 internal_factions_events.44.t: "울라마, 모스크 사업 자금 요청"
 internal_factions_events.44.d: "울라마는 정부가 전국 모스크 보수 및 개선 사업의 분담금을 지급해 줄 것을 요청했습니다. 이 사업의 목표는 기존 모스크를 개선하고 정비하는 것이며, 모스크 규모를 확장하기 위해 일부 토지를 몰수해야 합니다. 울라마는 이러한 사업이 국가를 더욱 '경건하게' 만들고 정부를 '도덕적'으로 유리한 위치에 올려놓을 것이라고 주장합니다."
 internal_factions_events.44.a: "제안을 단호히 거부한다"
 internal_factions_events.44.b: "재정 지원은 하되 직접 관여는 하지 않는다"
 internal_factions_events.44.c: "토지를 몰수하여 성직자들에게 넘겨준다"
 internal_factions_events.45.t: "지역 성직자와 국내 성직자 간 협력 증가"
 internal_factions_events.45.d: "최근 우리나라의 울라마가 지역 울라마와 긴밀히 협력하고 있습니다. 이러한 협력은 일부 내각 구성원들의 우려를 낳고 있는데, 외세의 영향력이 [ROOT.GetName]에 스며들어 정부의 신뢰도를 해칠 수 있다고 두려워하기 때문입니다."
 internal_factions_events.45.a: "위협이 되지 않는다"
 internal_factions_events.45.b: "그들에 맞서 개입한다"
 internal_factions_events.46.t: "종교 칙령에 대한 대중의 반발"
 internal_factions_events.46.d: "최근 한 성직자가 자신이 선포한 칙령을 전국적으로 시행하도록 정부에 청원할 계획이라고 발표했습니다. 이 발표에 대한 대중의 반응은 엇갈리며, 칙령이 개인의 자유를 저해할 수 있다는 점에서 긍정적인 시각보다 부정적인 시각이 더 많습니다. 그러나 어떤 면에서는 이 칙령이 우리 정부와 목표에 이로울 수도 있습니다. 이 칙령을 통해 우리 자신의 권력을 강화할 수 있기 때문입니다."
 internal_factions_events.46.a: "칙령을 전국적으로 시행한다"
 internal_factions_events.46.b: "기자회견에서 칙령을 공개적으로 규탄한다"
 internal_factions_events.47.t: "와하비 울라마, 시아파 및 수피 관행 단속 촉구"
 internal_factions_events.47.d: "저명한 와하비 성직자의 최근 설교 이후, 많은 이들이 시아파와 수피를 '카피르' 관행으로 처벌하는 단속을 촉구하고 있습니다. 이들 공동체를 공격하면 소수 집단에 대한 우리의 평판이 손상될 수 있어, 정부는 곤란한 처지에 놓여 있습니다."
 internal_factions_events.47.a: "울라마의 말이 옳다"
 internal_factions_events.47.b: "그들을 무시한다"
 internal_factions_events.48.t: "와하비, 여성의 직장 근무 비난"
 internal_factions_events.48.d: "오늘 전국 방송에서 와하비 성직자들은 직장에서 일하는 여성들을 비난했으며, 적극적으로 취업하여 직장에 참여하는 여성의 수를 줄이기 위한 운동을 시작하려 하고 있습니다."
 internal_factions_events.48.a: "그들을 달래기 위해 몇 명을 해고한다"
 internal_factions_events.48.b: "그들을 무시한다"
 internal_factions_events.49.t: "와하비, 도덕 순찰대 요구"
 internal_factions_events.49.d: "와하비는 이슬람의 전통과 율법을 무시하는 거리의 사람들을 찾아내는 것을 목적으로 하는 도덕 순찰대를 요구하고 있습니다. 이 순찰대는 이미 활동을 시작했으며, 정부는 이러한 활동에서 배제되었습니다. 그 결과 민간 자원봉사자들이 이 순찰 과정에서 법 집행을 적극적으로 무시하고 있습니다."
 internal_factions_events.49.a: "순찰대를 지원한다"
 internal_factions_events.49.b: "순찰대를 중단시킨다"
 internal_factions_events.50.t: "왕자, 항공사 설립 자금 필요"
 internal_factions_events.50.d: "한 왕자가 새로운 항공사를 설립하기 위한 자금을 지원해 달라고 정부에 청원해 왔습니다. 항공기를 확보하려는 그의 의지가 집요하여 그의 시도에 관한 소식이 널리 퍼졌습니다."
 internal_factions_events.50.a: "좋다, 자금을 지원한다"
 internal_factions_events.50.b: "지원하겠지만 정부 소유가 될 것이다"
 internal_factions_events.51.t: "널리 퍼진 왕실 집안 불화"
 internal_factions_events.51.d: "최근 두 왕자 사이의 언쟁이 인터넷에서 널리 퍼졌습니다. 두 사람 간의 격렬한 논쟁은 '부끄러운 일'로 불리고 있으며, 우리 왕실은 국제 언론의 면밀한 감시를 받게 되었습니다."
 internal_factions_events.51.a: "왕자들을 지지하는 성명을 발표한다"
 internal_factions_events.51.b: "왕자들을 규탄한다"
 internal_factions_events.52.t: "왕자, 망명하여 해외에서 정부를 규탄"
 internal_factions_events.52.d: "이번 주 초 한 왕자가 해외로 출국했습니다. 구성원들은 그가 휴가를 떠나는 것이라고 예상했지만, 곧 외국 방송에 출연하여 정부를 규탄하기 시작했습니다. 그의 이야기로 정부는 세간의 이목을 끌게 되었고, 그의 행동은 왕실의 평판을 위협하고 있습니다."
 internal_factions_events.52.a: "피해를 덮으려 시도한다"
 internal_factions_events.52.b: "왕실 휴가를 공개적으로 규탄하고 비난한다"
 district_over_ulema: "울라마보다 교육구"
