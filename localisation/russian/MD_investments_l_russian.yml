 improve_local_conservation_efforts: "Сейчас идёт §Yактивизация местной охраны природы§! в §Y[THIS.GetName]§!."
 improve_local_conservation_efforts_tt: "§YАктивизировать местную охрану природы§! в §Y[THIS.GetName]§!\n---------\nНам следует обратить внимание на активизацию усилий по охране природы на местном уровне в §Y[THIS.GetName]§!, чтобы защитить местную экосистему и дикую природу, а также сохранить биоразнообразие и естественную среду обитания для будущих поколений."
 improve_local_conservation_efforts_delayed_tt: "§YЭффекты:§!\n[!improve_local_conservation_efforts_click]\n\n£click_right §YПКМ§!: вкл./выкл. автоповтор.\n[auto_repeat_internal_conservation_status]"
 improve_local_conservation_efforts_click_tt: "На 120 дней мы получаем в §Y[THIS.GetName]§!:\nШтрафы от §YЛеса Амазонии — местная охрана природы§! уменьшаются на §G-25%§!."
 state_owned_local_naval_infrastructure_modifier: "Расширение местной военно-морской инфраструктуры"
 state_owned_local_naval_infrastructure_modifier_desc: "Инвестиции в береговую оборону и военно-морскую инфраструктуру преобразили морской потенциал региона. Новые военно-морские объекты и узлы снабжения теперь обеспечивают всестороннюю поддержку военно-морских операций в регионе."
 state_owned_local_fortification_efforts_modifier: "Местные фортификационные работы"
 state_owned_local_fortification_efforts_modifier_desc: "По всему региону были построены обширные оборонительные сооружения, включая бункеры, прибрежные укрепления и сети опорных пунктов. Эти военные объекты значительно повышают обороноспособность региона против вторжения и наземных атак."
 expand_local_coastal_infrastructure: "Сейчас идёт §Yрасширение местной прибрежной инфраструктуры§! в §Y[THIS.GetName]§!."
 expand_local_coastal_infrastructure_tt: "§YРасширить местную прибрежную инфраструктуру§! в §Y[THIS.GetName]§!\n---------\nПрибрежные регионы §Y[THIS.GetName]§! значительно выиграют от улучшения инфраструктуры. Нам следует заняться расширением портов, гаваней и прибрежной обороны, чтобы усилить морскую торговлю и военно-морские возможности."
 expand_local_coastal_infrastructure_delayed_tt: "§YЭффекты:§!\n[!expand_local_coastal_infrastructure_click]\n\n£click_right §YПКМ§!: вкл./выкл. автоповтор.\n[auto_repeat_internal_expand_coastal_infrastructure_status]"
 expand_local_coastal_infrastructure_click_tt: "На 180 дней мы получаем в §Y[THIS.GetName]§!:\n"
 expand_local_fortification_efforts: "Сейчас ведутся §Yместные фортификационные работы§! в §Y[THIS.GetName]§!."
 expand_local_fortification_efforts_tt: "§YРасширить местные фортификационные работы§! в §Y[THIS.GetName]§!\n---------\nОборонные возможности §Y[THIS.GetName]§! необходимо укрепить. Нам следует заняться расширением местных укреплений и оборонительных сооружений, чтобы лучше защитить этот стратегически важный регион."
 expand_local_fortification_efforts_delayed_tt: "§YЭффекты:§!\n[!expand_local_fortification_efforts_click]\n\n£click_right §YПКМ§!: вкл./выкл. автоповтор.\n[auto_repeat_internal_expand_fortifications_status]"
