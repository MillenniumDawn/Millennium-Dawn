l_korean:
 GEO_gergiandream2013: "조지아의 꿈"
 GEO_gergiandream2013_desc: "조지아의 꿈은 조지아를 통치할 권한을 가져야 할 진정한 정당입니다."
 GEO_crush_opposition_dreams: "야당의 꿈을 짓밟다"
 GEO_crush_opposition_dreams_desc: "한심한 야당을 짓밟는 것이 조지아를 발전시키는 유일한 참된 길입니다. 외국 첩자들이 우리나라를 파괴하려 합니다! 그런 일이 일어나게 두어서는 안 됩니다!"
 GEO_accept_turkish_capital: "튀르키예 자본 수용"
 GEO_accept_turkish_capital_desc: "튀르키예 자본을 받아들이는 것은 매우 중요하며, 우리에게 무언가를 가져다주어야 합니다."
 GEO_geo_elections2013: "2013년 선거"
 GEO_geo_elections2013_desc: "조지아에서 2013년 10월 27일에 대통령 선거가 실시되었습니다."
 GEO_csto_nat_join: "CSTO가입"
 GEO_csto_nat_join_desc: "CSTO 가입은 우리의 당연한 목표입니다."
 GEO_stren_garrisons: "북부 수비대 강화"
 GEO_stren_garrisons_desc: "북부 국경의 수비대를 강화하여 이런 사태가 다시는 일어나지 않도록 하겠습니다."
 GEO_pankis_resolve: "판키시 협곡 분쟁 해결"
 GEO_pankis_resolve_desc: "마침내 러시아와의 국경에서 벌어지는 혼란을 끝내고 우리 영토를 지켜야 합니다."
 GEO_sng_unite: "CIS와 통합"
 GEO_sng_unite_desc: "CIS라니, 세상에, 이 푸른 깃발에 얼마나 많은 행복과 상호 협력이 깃들어 있는지. 도저히 거부할 수 없군요..."
 GEO_shervad_victory: "셰바르드나제의 승리!"
 GEO_shervad_victory_desc: "셰바르드나제가 선거에서 승리했습니다. 이제 그는 상황을 수습해야 합니다."
 GEO_epoch_of_peace: "평화의 시대"
 GEO_epoch_of_peace_desc: "조지아 위에 평화의 시대가 열려야 합니다. 우리는 어떤 전쟁도 없이 번영해야 합니다."
 GEO_give_passports_to_everyone: "모두에게 여권을!"
 GEO_give_passports_to_everyone_desc: "Expanding citizenship programs will strengthen Georgia's demographic position and integrate diaspora populations, though it may create diplomatic tensions with neighboring states."
 GEO_tskinvali_attack: "츠힌발리 전투 계획"
 GEO_tskinvali_attack_desc: "타이거 공격 계획 - 오세티야를 조지아로 되돌리기 위해 계획된 작전입니다. 이 위험한 발걸음을 내디딜 가치가 있을지도 모릅니다."
 GEO_pmc_support_instr: "PMC 교관 초빙"
 GEO_pmc_support_instr_desc: "군을 성공적으로 편성하고 향후 공격을 위한 추가적인 효율을 얻으려면 숙련된 군사 교관의 도움이 필요합니다."
 GEO_fail_war_geo2008: "2008년 전쟁의 패배"
 GEO_fail_war_geo2008_desc: "The 2008 war against Russia ended in humiliating defeat for Georgia, with Russian forces advancing deep into Georgian territory. South Ossetia and Abkhazia are now lost, our military is shattered, and the dream of territorial integrity seems more distant than ever."
 GEO_win_war_geo2008: "2008년 전쟁의 승리"
 GEO_win_war_geo2008_desc: "Against all odds, Georgia has emerged victorious in the 2008 war! Russian forces have been repelled, and we have reclaimed South Ossetia and Abkhazia. This stunning military achievement will reshape the geopolitical landscape of the Caucasus and secure Georgia's territorial integrity."
 GEO_nato_in_georgia: "조지아 내 나토군"
 GEO_nato_in_georgia_desc: "나토 지상군의 조지아 배치를 요청하면 러시아의 침략에 대한 즉각적인 안전 보장을 받고 서방이 조지아의 주권을 지지한다는 점을 보여줄 수 있지만, 지역 긴장을 고조시킬 위험이 있습니다."
 GEO_osset_abkhaz_priznat: "압하지야와 오세티야 승인"
 GEO_osset_abkhaz_priznat_desc: "우리나라와 이제 독립한 지역들의 평화를 확보하기 위해 남오세티야와 압하지야를 승인할 때가 왔습니다."
 GEO_diplomatic_requests_fromrussia: "러시아의 외교적 요청"
 GEO_diplomatic_requests_fromrussia_desc: "러시아는 조지아에 외교적 접근을 하며 관계 정상화와 무역, 안보, 분쟁 지역의 지위에 관한 잠정 합의를 모색하고 있습니다. 이러한 요청에는 조지아의 전략적 이익에 대한 신중한 검토가 필요합니다."
 GEO_join_nato_geo: "NATO 가입"
 GEO_join_nato_geo_desc: "나토에 가입하면 상대의 규모와 관계없이 어떤 침략자로부터도 보호와 안보를 받을 수 있습니다. 서방과 동맹을 맺는 것은 앞으로도 우리의 안전을 제대로 보장해 줄 것입니다."
 GEO_bezhenci_help_of_uf: "난민 지원"
 GEO_bezhenci_help_of_uf_desc: "국경 건너편에 민족 정착지가 남아 있어 생길 수 있는 국경 긴장이 절대 없도록, 오세티야와 난민 인구를 교환해야 합니다."
 GEO_we_will_not_forget: "우리는 잊지 않을 것이다"
 GEO_we_will_not_forget_desc: "조지아는 5일 전쟁 이후 입은 상처와 그것이 가져온 결과를 결코 치유하지 못할 것입니다."
 GEO_peace_deals_with_russia: "러시아와의 평화 협정"
 GEO_peace_deals_with_russia_desc: "Russia may seek to undermine our power in the Caucasus, but the obvious truth is that they don't want to conquer us. It will be much more beneficial for us to sign a non-aggression pact with them and continue our western path without South Ossetia and Abkhazia."
 GEO_constitutional_reforms: "Constitutional Reforms"
 GEO_constitutional_reforms_desc: "결과가 어떠하든, 이 모든 일 이후에는 조지아를 어떤 분쟁에도 끌어들여서는 안 됩니다."
 GEO_anti_corruption_measures: "반부패 조치"
 GEO_anti_corruption_measures_desc: "부패로 인해 더 이상 필요하지 않은 정부의 여러 분야에 예산이 과도하게 사용되었습니다. 이를 바로잡아야 합니다."
 GEO_stop_the_war_geo: "전쟁 중단"
 GEO_stop_the_war_geo_desc: "공화파와의 전쟁을 이제 완전히 끝내야 합니다. 우리의 차이가 우리 사이의 전쟁으로 번지게 해서는 안 됩니다."
 GEO_ukrainian_volunteers_unso: "UNA-UNSO 초빙"
 GEO_ukrainian_volunteers_unso_desc: "다음 전쟁을 위해 UNA-UNSO의 전투원들을 조지아로 초빙해야 합니다. 그들은 이념적으로 우리를 위해 싸울 준비가 되어 있습니다."
 GEO_us_help_in_war_geo: "미국에 원조 요청"
 GEO_us_help_in_war_geo_desc: "미국에 도움을 요청하고 필요한 무기를 구입하여 무력 충돌에 완전히 대비해야 합니다."
 GEO_chechen_boevik_help2008: "이치케리야 보예비크 초빙"
 GEO_chechen_boevik_help2008_desc: "장미 혁명 이전 시절, 우리에게는 체첸 이치케리야 전투원들과의 접촉이 있었습니다."
 GEO_prepare_for2008_war: "2008년 전쟁 준비!"
 GEO_prepare_for2008_war_desc: "특수 작전을 감행해 전격전으로 남오세티야를 신속히 병합해야 합니다. 그러면 러시아는 대응하지 못하고 오세티야 병합이라는 사실을 받아들일 수밖에 없을 것입니다."
 GEO_compromiss_with_russia: "러시아와의 타협"
 GEO_compromiss_with_russia_desc: "러시아에 사이비 공화국들의 승인에 관한 완전한 합의를 제안하면, 그들은 ... 온전한 공화국이 될 것입니다. 어쩌면 이것만이 조지아를 미승인 영토라는 짐에서 해방시키고 온전한 외교로 나아가게 해 줄 것입니다."
 GEO_osset_abkhaz_let: "오세티야와 압하지야를 보내주다"
 GEO_osset_abkhaz_let_desc: "번영과 상호 협력을 위해 오세티야와 압하지야를 보내주어야 합니다."
 GEO_befriend_azeri_geo: "아제르바이잔과 친선"
 GEO_befriend_azeri_geo_desc: "아제르바이잔은 우리와 같은 외교적 견해를 가지고 있으므로 서로 친구가 되어야 합니다."
 GEO_befriend_eu: "EU와 친선"
 GEO_befriend_eu_desc: "EU 가입을 추진해야 합니다. 그것이 우리 문명의 선택입니다."
 GEO_geo_elections2008: "§02008년 선거§!"
 GEO_geo_elections2008_desc: "조지아에서 2008년 1월 5일에 대통령 선거가 실시되었습니다."
 GEO_government_strenght: "정부 강화"
 GEO_government_strenght_desc: "사카슈빌리는 민주주의를 해치지 않으면서 정부의 영향력을 높이고 자신의 권위를 공고히 해야 합니다. 분명한 입장을 형성하기 위한 일상 업무를 시작하려면 새로운 제안들을 분석해야 합니다."
 GEO_kill_zhvania: "주바니아 제거"
 GEO_kill_zhvania_desc: "주라브 주바니아는 혁명 초기 단계와 체제 수립 과정에서 우리나라를 도왔지만, 대통령의 권한을 제한하라고 요구하며 지나치게 우리에게 간섭하기 시작했습니다. 그는 우리에게 불리한 증거를 상당량 쥐고 있으니 그냥 놓아줘서는 안 됩니다..."
 GEO_demograph_crisis_oh: "인구 위기 대응"
 GEO_demograph_crisis_oh_desc: "인구 위기에 대처하는 것은 번영하는 조지아 국가를 세우기 위한 필수적인 조치입니다."
 GEO_compromiss_oppos: "야당과 타협"
 GEO_compromiss_oppos_desc: "우리는 민주주의 국가입니다. 야당이 우리에게 특정 개혁을 요구한다면, 단기적으로 내각에 해가 되더라도 귀를 기울여야 합니다."
 GEO_babax_po_oppos: "야당을 폭력으로 저지"
 GEO_babax_po_oppos_desc: "야당이 우리의 정치 노선과 결정을 흔들도록 놔두어서는 안 됩니다. 강경한 방법이 틀림없이 그들을 침묵시킬 것입니다."
 GEO_befriend_ukraine_geo: "우크라이나와 친선"
 GEO_befriend_ukraine_geo_desc: "우크라이나는 늘 우리와 같은 이상을 추구해 왔습니다. 우리는 오랫동안 GUAM에서 공동 의장직을 맡아 왔습니다. 관계를 한 단계 끌어올려야 합니다."
 GEO_send_troops_toiraq: "이라크에 우리 군 파병"
 GEO_send_troops_toiraq_desc: "새로운 전쟁의 경험을 쌓고 미국 군사 전술의 전략을 이해하기 위해 이라크에 우리 군을 파병해야 합니다. 이는 우리에게 도움이 될 것입니다."
 GEO_adjara_crisis: "아자리야 위기"
 GEO_adjara_crisis_desc: "아자리야 위기는 아자리야 혁명 또는 제2의 장미 혁명이라고도 불리며, 2003년 11월 장미 혁명으로 에두아르트 셰바르드나제 대통령이 축출된 뒤 중앙 정부의 권위에 복종하기를 거부한 아슬란 아바시제가 이끌던 조지아 아자리야 자치공화국의 정치 위기였습니다."
 GEO_political_reforms_saak: "사카슈빌리의 정치 개혁"
 GEO_political_reforms_saak_desc: "사카슈빌리의 개혁과 국정 운영 방식이 도움이 될 수 있습니다. 폭넓은 자산 계층과의 협의가 진보적 발전 방향의 준비와 실행에 기여한다는 것을 일상의 실무가 보여 주고 있으므로, 새로운 관리 방식을 도입해야 합니다."
 GEO_kviciani_myatezh: "크비치아니의 반란"
 GEO_kviciani_myatezh_desc: "크비치아니가 코도리 계곡에서 반란을 일으켰습니다. 상황을 통제해야 합니다."
 GEO_clear_adjaria: "아자리야 일소"
 GEO_clear_adjaria_desc: "아자리야에서 반체제 인사를 정리하고 아자리야를 완전한 형태로 통합하여 아바시제를 사임하도록 강제할 때입니다."
 GEO_discuss_adjara_release: "아자리야 분리 논의"
 GEO_discuss_adjara_release_desc: "아바시제에게 더 많은 자치를 주되 통제는 더 단단히 하는 편이 좋을지도 모릅니다. 어쩌면 이것이 우리나라를 강하게 할 것입니다."
 GEO_deal_with_turkey_adjara: "아자리야 관련 튀르키예와 거래"
 GEO_deal_with_turkey_adjara_desc: "아자리야 문제에 관한 협력을 위해 튀르키예와 관련 협정을 체결할 때입니다. 상호 협력은 관계 개선의 좋은 구실이 될 것입니다."
 GEO_close_monadire: "모나디레 폐쇄"
 GEO_close_monadire_desc: "모나디레는 금지되어야 하고 크비치아니는 투옥되어야 합니다. 다른 선택지는 없습니다!"
 GEO_clear_dissidents_monadire: "모나디레 반체제 인사 일소"
 GEO_clear_dissidents_monadire_desc: "그들을 숙청하는 것만이 유일하게 실행 가능한 선택입니다!"
 GEO_allow_kviciani: "크비치아니 허용"
 GEO_allow_kviciani_desc: "크비치아니의 활동을 허용하고 그와 합의에 도달해야 합니다."
 GEO_deal_with_monadire: "모나디레와 거래"
 GEO_deal_with_monadire_desc: "그들과 거래하는 것이 우리 정부에 최선의 선택입니다."
 GEO_rustavitwo: "루스타비 2 급습!"
 GEO_rustavitwo_desc: "루스타비 2는 우리 정부를 끊임없이 방해하는 조지아의 야당 성향 채널입니다. 방송 거점을 급습해 채널을 폐쇄하는 것이 좋을지도 모릅니다. 그러나 이는 예기치 못한 결과를 초래할 수 있습니다..."
 GEO_raskol_soyuz_gruz: "셰바르드나제 당의 분열"
 GEO_raskol_soyuz_gruz_desc: "셰바르드나제 당의 분열은 불가피했던 것으로 보입니다. 이제부터 셰바르드나제에 대한 상당한 지지가 떨어졌습니다. 그러나 친서방 정당들은 성장하고 있습니다."
 GEO_geo_elections2003: "2003년 선거"
 GEO_geo_elections2003_desc: "2003년 선거"
 GEO_another_victory_shervad: "셰바르드나제의 또 다른 승리"
 GEO_another_victory_shervad_desc: "셰바르드나제가 다시 승리했지만 국민은 그를 지지하지 않습니다. 그의 한심한 통치를 평화적으로 무너뜨려야 합니다."
 GEO_rose_revolution: "장미 혁명!"
 GEO_rose_revolution_desc: "장미 혁명을 시작하여 진정으로 민주적인 조지아를 만들 때입니다. 사카슈빌리가 우리를 위대함으로 이끌 것입니다!"
 GEO_vneochered_elections: "새로운 자유 선거"
 GEO_vneochered_elections_desc: "이제 조지아에서 공정하고 진정한 새 선거를 치를 때가 왔습니다."
 GEO_epoch_of_saakash: "사카슈빌리의 시대!"
 GEO_epoch_of_saakash_desc: "사카슈빌리의 시대가 도래했습니다. 새로운 조지아가 여기 있습니다!"
 GEO_unn_kodor: "판키시 및 코도리 협곡의 UN군"
 GEO_unn_kodor_desc: "이제 불안정한 지역에 UN군을 배치하여 안정을 확보해야 합니다."
 GEO_russians_leave_abkhaz: "러시아 철수 요청"
 GEO_russians_leave_abkhaz_desc: "압하지야의 상황은 오세티야와 크게 다릅니다. 압하지야인들은 외교적 입장에서 전혀 건설적이지 않으며 오세티야인들보다 훨씬 적대적입니다. 우리는 러시아인들에게 공격하지 않겠다고 약속하면서 압하지야에서 떠나 달라고 요청해야 합니다. 크비치아니와 겔라예프는 그만두어야 합니다. 안정을 확보하기 위해 그곳에 UN 순찰대를 배치해야 합니다."
 GEO_release_boeviks: "노흐치 석방"
 GEO_release_boeviks_desc: "조지아가 언젠가 지정학적 전망을 바꾼다면 이 체첸 전투원들이 쓸모 있을지도 모릅니다. 그들을 제3국으로 보내야 합니다."
 GEO_give_boevikstorussia: "보예비크를 러시아에 인도"
 GEO_give_boevikstorussia_desc: "이 체첸 테러리스트들은 정부의 권위가 떨어지는 한이 있더라도 원래 왔던 곳으로 돌려보내야 합니다."
 GEO_polt_crisis_aknowl: "정치 위기 인정"
 GEO_polt_crisis_aknowl_desc: "조지아는 끊임없는 정치 위기 상태에 있습니다. 앞으로의 행동을 계획하려면 문제를 인정하고 권력을 공고히 해야 합니다."
 GEO_help_chechens_pankis: "조지아 협곡의 체첸 보예비크"
 GEO_help_chechens_pankis_desc: "체첸의 불안정 때문에 많은 체첸 전투원이 국경을 넘어 현지 주민을 위협하고 있습니다. 이 문제를 해결해야 합니다."
 GEO_ensure_for_russians: "러시아에 대한 보장"
 GEO_ensure_for_russians_desc: "협곡 분쟁을 더 효과적으로 해결하기 위해 러시아 당국에 접촉해야 합니다."
 GEO_ustupki_russia: "러시아에 양보"
 GEO_ustupki_russia_desc: "권력을 유지하려면 러시아에 우리 정치 노선에 대한 더 많은 영향력을 내줘야 할지도 모릅니다."
 GEO_pokrov_of_west: "서방의 비호"
 GEO_pokrov_of_west_desc: "에두아르트는 오래전부터 서방 국가들과 여러 인맥을 맺고 있었습니다. 우리의 지도자를 떠나 국가의 노선을 바꿀 가치가 있을지도 모릅니다."
 GEO_russian_mil_in_geo: "조지아 내 러시아군"
 GEO_russian_mil_in_geo_desc: "러시아와의 관계를 받아들이고 조지아에 러시아군이 주둔하도록 보장해야 합니다."
 GEO_agreements_with_turks: "튀르키예와 전략 조약"
 GEO_agreements_with_turks_desc: "튀르키예와의 관계를 받아들이고 조지아에 나토군이 주둔하도록 보장해야 합니다."
 GEO_start_talks_with_russia: "동방과 더 긴밀한 유대"
 GEO_start_talks_with_russia_desc: "안녕하세요, 구소련 형제들이여, 친구가 됩시다."
 GEO_vygod_svet: "서방과 더 긴밀한 유대"
 GEO_vygod_svet_desc: "안녕하세요, 나토 유럽 형제들이여, 친구가 됩시다."
 GEO_question_of_abkhazosset: "오세티야와 압하지야 문제"
 GEO_question_of_abkhazosset_desc: "오세티야와 압하지야 문제가 마침내 논의되어야 합니다. 어떻게 할지 결정해야 합니다."
 GEO_georgian_capital_for_west: "조지아-서방 시장 통합"
 GEO_georgian_capital_for_west_desc: "시장을 서방으로 돌리고 경제를 재건할 때입니다."
 GEO_kill_oppos_leaders: "야당 지도자 살해"
 GEO_kill_oppos_leaders_desc: "어중간한 조치를 끝내고 뱀의 머리를 잘라낼 때입니다. 야당의 지도자들을 죽여야 합니다."
 GEO_deport_oppos: "야당 지도자 추방"
 GEO_deport_oppos_desc: "어쩌면 그렇게까지 급진적일 필요는 없을지도 모릅니다. 야당 지도자들을 추방하거나 투옥할 수 있습니다."
 GEO_befriend_armenia: "아르메니아와 친선"
 GEO_befriend_armenia_desc: "아르메니아는 우리의 가장 오래된 영원한 이웃입니다. 상호 이해를 바탕으로 양국 관계를 개선해야 합니다."
 GEO_djavakhk_compromiss: "자바헤티 타협"
 GEO_djavakhk_compromiss_desc: "조지아 남부에는 매우 많은 수의 아르메니아인이 살고 있습니다. 아르메니아는 그들의 독립이나 그와 비슷한 것을 요구한 적이 없지만, 추가적인 통합을 위해 그들에게 더 많은 자치를 줄 가치가 있습니다."
 GEO_vassal_of_russia: "러시아와 연합 협정"
 GEO_vassal_of_russia_desc: "러시아와 상호 방위 및 경제 협력에 관한 최종 조약을 체결해야 합니다."
 GEO_priznat_abkhazosset: "조지아의 연방화"
 GEO_priznat_abkhazosset_desc: "압하지야와 오세티야의 사이비 공화국을 승인할 수는 없지만, 러시아의 압력 아래 조지아를 연방화할 수는 있습니다. 그러나 이는 러시아가 우리에게 상당한 영향력을 행사하게 됨을 의미합니다."
 GEO_change_course_of_party: "당의 노선 변경"
 GEO_change_course_of_party_desc: "구 셰바르드나제 당은 우리가 필요로 하는 기조에 맞지 않습니다. 이를 바꾸고 다른 친서방 정당들을 흡수할 때입니다."
 GEO_nato_help_shervad: "조지아에 대한 나토 지원"
 GEO_nato_help_shervad_desc: "나토에 조지아를 위한 더 많은 지원을 요청할 때입니다. 우리는 준비되어 있습니다."
 GEO_status_of_ossetabkhaz_demand: "사이비 공화국의 지위 요구"
 GEO_status_of_ossetabkhaz_demand_desc: "어중간한 조치를 찾는 것을 그만두고, 공화국들이 무조건 우리 연방에 편입되도록 요구하기 시작할 때입니다!"
 GEO_prowestern_shervad: "친서방 외교"
 GEO_prowestern_shervad_desc: "자유와 자유주의라는 서방의 이상을 계속 따라야 하며, 이를 위해 서방 파트너들과의 관계를 개선해야 합니다."
 GEO_reactionary_shervad: "EU와 관계 단절!"
 GEO_reactionary_shervad_desc: "EU가 정치적으로든 경제적으로든 우리나라에 어떤 식으로도 영향을 미치게 해서는 안 됩니다."
 GEO_russina_spy_clear: "러시아 첩자 일소"
 GEO_russina_spy_clear_desc: "러시아 첩자들이 우리나라를 타락시키고 있습니다! 즉시 제거해야 합니다!"
 GEO_join_eaes: "EACU 가입"
 GEO_join_eaes_desc: "우리는 EACU에 통합되어야 합니다. 이웃들과 자유롭게 무역할 수 있는데 굳이 EU의 경제적 예속 프로그램에 신경 쓸 이유가 있겠습니까?"
 GEO_national_propaganda: "국가 선전"
 GEO_national_propaganda_desc: "잡다한 구성의 우리 국민에게 러시아는 믿을 만한 경제 파트너이자 동맹일 뿐 아니라 우리의 친구, 형제, 그리고 타고난 보호자임을 보여 주어야 합니다!"
 GEO_open_door_toeasterninvestments: "동방 투자에 문호 개방"
 GEO_open_door_toeasterninvestments_desc: "러시아의 자금이 조지아 경제의 혈관을 타고 흘러 경제적 번영이라는 우리의 열망을 이뤄 줄 것입니다. 정말 시적이군요!"
 GEO_soviet_legacy_pol: "소련의 유산"
 GEO_soviet_legacy_pol_desc: "누구로부터 독립을 얻었는지, 소련 시절부터 누구와 하나였는지를 잊어서는 안 됩니다. 우리의 공통된 유산을 받아들여야 합니다."
 GEO_join_csto: "CSTO 가입"
 GEO_join_csto_desc: "아르메니아와 러시아는 CSTO에 속해 있습니다. 공동 국경과 군사 협력을 강화한다면 우리나라의 안보가 정말로 개선될지도 모릅니다..."
 GEO_embargo_turkey: "튀르키예의 영향력 약화"
 GEO_embargo_turkey_desc: "튀르키예의 영향력은 우리나라, 특히 바투미와 이른바 그들의 자치에 해롭습니다... 이를 끝내야 합니다."
 GEO_trade_deal_russia: "러시아와 상호 협력 협정"
 GEO_trade_deal_russia_desc: "상호 합의와 이해의 원칙에 따라 러시아와 협력해야 합니다. 우리의 우정이 전설이 되기를!"
 GEO_deal_with_armenia: "아르메니아와 우호 협정"
 GEO_deal_with_armenia_desc: "상호 합의와 이해의 원칙에 따라 아르메니아와 협력해야 합니다. 우리의 우정이 전설이 되기를!"
 GEO_demands_from_azeris: "동부 영유권 주장"
 GEO_demands_from_azeris_desc: "아제르바이잔 파트너들에게 아제르바이잔의 북서부가 역사적으로 조지아 땅이었음을 상기시키고, 우리의 유산을 존중하며 대하도록 해야 합니다!"
 GEO_nato_drills: "나토와 훈련"
 GEO_nato_drills_desc: "나토와 합동 훈련을 실시합시다! 적어도 그들은 우리 엉덩이에 구멍을 뚫고 있지는 않으니까요."
 GEO_investigate_saakash: "사카슈빌리 조사"
 GEO_investigate_saakash_desc: "사카슈빌리가 저지른 범죄와 부패에 대한 진상을 파악하기 위해 그를 조사해야 합니다."
 GEO_legit_heir: "정통 후계자"
 GEO_legit_heir_desc: "비지나 이바니쉬빌리야말로 조지아를 통치해야 할 사람입니다."
 GEO_defence_priority: "국방 우선"
 GEO_defence_priority_desc: "국방 우선은 현대 조지아의 의제에서 중요한 항목이 되어야 합니다."
 GEO_increase_eu_friendship: "EU와 외교 조약"
 GEO_increase_eu_friendship_desc: "유럽 연합은 우리가 가입해야 하는 기구입니다."
 GEO_narmalization_with_russia: "러시아 실용주의"
 GEO_narmalization_with_russia_desc: "더 실용적으로 굴며 좋은 무역 관계를 가질 수 있는데 굳이 러시아와의 경쟁에 신경 쓸 이유가 있겠습니까?"
 GEO_azerbaijani_coop: "아제르바이잔과의 협력"
 GEO_azerbaijani_coop_desc: "아제르바이잔은 오랫동안 우리의 경제적, 정치적 파트너였습니다. 상호 관계를 증진해야 합니다."
 GEO_nato_connections: "나토와 연계"
 GEO_nato_connections_desc: "나토와의 연계를 늘려야 합니다. 이 기구의 기존 구조가 지닌 다양하고 풍부한 경험은 시급한 필요에 부합하는 인력 훈련 체계의 정립과 개선을 요구합니다."
 GEO_isolationaism: "부분적 고립주의"
 GEO_isolationaism_desc: "우리와 상관없는 일에 왜 개입해야 합니까? 우리는 부분적 고립주의 정치에 관여해야 합니다."
 GEO_salome_zurab: "살로메 주라비슈빌리"
 GEO_salome_zurab_desc: "국내 정치 현안의 전반적인 흐름에는 간섭하지 않으면서 대외 외교에서는 훌륭한 얼굴이 되어 줄 대통령이 필요합니다."
 GEO_compromiss_monacrhists: "군주주의자들과 타협"
 GEO_compromiss_monacrhists_desc: "우리 국민 중에는 왕을 다시 불러오자는 이들이 있습니다. 얼마나 망상적인 생각입니까! 그들과 타협점을 찾아보아야 합니다."
 GEO_lgbt_rights_geo: "LGBTQ+ 지지 조지아"
 GEO_lgbt_rights_geo_desc: "유럽 국가들과의 이념적 연결 때문에 이러한 사회적 입장을 취해야 합니다."
 GEO_best_variant: "최선의 방안"
 GEO_best_variant_desc: "민주적 가치와 서방의 제도를 받아들이면서 사회적 조화를 유지함으로써, 조지아는 이념적 극단보다 안정과 번영을 우선하는 온건한 길을 나아갑니다."
 GEO_second_epoch_of_saakash: "미헤일의 귀환"
 GEO_second_epoch_of_saakash_desc: "마침내 장미 혁명의 아버지가 사카르트벨로를 다스리러 돌아왔습니다!"
 GEO_united_nat_movem: "통합 민족 운동"
 GEO_united_nat_movem_desc: "통합 민족 운동은 조지아를 통치할 권한을 가져야 할 진정한 정당입니다."
 GEO_prowestern_nationalist: "장미 혁명의 십자군"
 GEO_prowestern_nationalist_desc: "바크라제가 조지아의 고삐를 쥐고 장미 혁명이 추구했던 목표를 완수해야 합니다."
 GEO_radical_antirussian_rhetoric: "급진적 반러시아 수사"
 GEO_radical_antirussian_rhetoric_desc: "러시아는 언제나 우리나라를 예속시키려 했습니다. 이에 저항하고 이를 널리 알려야 합니다!"
 GEO_reformation_of_armedforces_nat: "군대 개편"
 GEO_reformation_of_armedforces_nat_desc: "우리 군대에는 상당한 변화가 필요합니다. 우리 군의 현재 상태는 우리가 바라는 모습에 미치지 못합니다."
 GEO_mistakes_of_prevgov: "전 정부의 실책"
 GEO_mistakes_of_prevgov_desc: "앞으로 조지아의 번영을 보장하려면 전 정부의 실책을 감안해야 합니다."
 GEO_allance_geo_patrio: "조지아 애국자 동맹"
 GEO_allance_geo_patrio_desc: "조지아 애국자 동맹은 조지아를 서방 통합에서 멀어지게 하고 독립국가연합과의 긴밀한 협력으로 돌려놓으려는 친러시아 민족주의 세력입니다."
 GEO_proeastern_nationalist: "크비치아니의 360도 전환"
 GEO_proeastern_nationalist_desc: "크비치아니는 조지아가 어떠해야 하는지에 대해 나름의 생각이 있습니다. 어쩌면 그가 옳을지도 모릅니다..."
 GEO_prorussian_country: "친러시아 입장"
 GEO_prorussian_country_desc: "러시아는 정말로 우리의 친구이자 큰형입니다. 우리는 언제나 그들의 편에 서야 합니다."
 GEO_social_conservatism: "사회적 보수주의"
 GEO_social_conservatism_desc: "우리의 사회적 전통과 전반적인 생활 방식은 미래 세대를 위해 보존되어야 합니다. 그것이 우리를 우리답게 만드는 것입니다."
 GEO_proeastern_reactionary: "니노 부르자나제"
 GEO_proeastern_reactionary_desc: "니노 부르자나제는 실용 노선의 새로운 조지아를 위한 계획을 가지고 있습니다."
 georg.1000.t: "셰바르드나제의 시대"
 georg.1000.d: "에두아르트 암브로시예비치 셰바르드나제는 소련 당 관료, 페레스트로이카와 신사고의 창안자, 독립 조지아의 지도자라는 세 가지 삶을 살았습니다. 누구도, 특히 그 자신도 이러한 전환을 예견하지 못했을 것입니다. 그의 후원자 미하일 고르바초프처럼 셰바르드나제는 국내보다 세계에서 더 존경받고 높이 평가받습니다. 어떤 이들은 그가 착수한 모든 일에서 줄곧 실패했다고 주장하고, 다른 이들은 인류가 그의 역사적 공로를 잊지 않을 것이라고 확신합니다. 어쨌든 1992년 3월 즈비아드 감사후르디아를 막 무너뜨린 조지아 정치인들이 셰바르드나제에게 나라를 이끌어 달라고 제안했을 때 그는 승낙했습니다. 이것이 어려운 시기의 조국을 돕고자 하는 마음이었는지, 아니면 권력과 활발한 활동에 대한 갈망이었는지는 말하기 어렵습니다. \\"내가 조지아로 돌아오지 않았다면 조지아는 죽었을 것임을 알았다\\"고 셰바르드나제는 말했습니다. 그의 말에는 일말의 진실이 있었지만, 비슷한 처지에 놓였던 헤이다르 알리예프와 달리 그는 사회를 통합하는 데 실패했습니다. 아마도 셰바르드나제는 작은 나라에서 \\"수족관 속의 고래\\"가 되어, 모두가 그의 세계적 권위 앞에 한목소리로 머리를 숙일 것이라 기대했을 것입니다. 그러나 그가 마주한 것은 들끓는 점에 달한 사회였고, 누구에게도 복종하지 않겠다고 결심한 무장 군벌들에게 둘러싸인 처지였습니다. 압하지야 및 남오세티야와의 관계 위기는 그의 전임자 감사후르디아가 만들어낸 것이었습니다. 셰바르드나제는 여론과 영향력 있는 군 지도자 텡기즈 키토바니, 자바 이오셀리아니의 압력에 못 이겨 1992년 8월 압하지야 원정에 동의했습니다. 감사후르디아가 전복된 뒤, 서방 및 동방과의 관계를 비교적 균형 있게 구축하는 친러시아 성향의 셰바르드나제는, 예전의 권위가 흔들리는 가운데 조지아의 향후 발전을 위한 계획을 짜야 합니다."
 georg.1000.a: "고르바초프의 오른팔."
 GEO_legacy_of_rose_revol: "장미 혁명의 유산"
 GEO_legacy_of_rose_revol_desc: "장미 혁명의 유산을 받아들이고, 진정한 정치가 어떠해야 하는지의 본보기로 삼아야 합니다!"
 GEO_moderate_right_wing: "사회적 보수주의 보존"
 GEO_moderate_right_wing_desc: "우리의 사회적 전통과 전반적인 생활 방식은 미래 세대를 위해 보존되어야 합니다. 그것이 우리를 우리답게 만드는 것입니다."
 GEO_dem_dvizh_edgruz: "민주 운동 - 통합 조지아"
 GEO_deepen_rus_coop: "러시아 협력 심화"
 GEO_deepen_rus_coop_desc: "러시아와의 협력을 심화하면 분명 우리에게 이로울 것입니다."
 GEO_soviet_legacy_honor: "소련의 유산 존중"
 GEO_soviet_legacy_honor_desc: "소련의 유산을 존중하는 것은 우리의 평범하고 자연스러운 정치적 사고방식입니다."
 GEO_multivector_kek: "다자 균형 정책"
 GEO_multivector_kek_desc: "다자 균형 정책이 나아갈 길입니다! 지정학적 예속을 위해 왜 협정과 조약을 버려야 합니까?"
 GEO_t72_TT: "우크라이나제 T-72 10대를 구매합니다"
 GEO_hmvv_TT: "미국에서 험비 100대를 구매합니다"
 georg_chech.1.t: "협곡의 겔라예프 보예비크"
 georg_chech.1.d: "Information that about 700 armed Chechen boeviks were planning to enter Abkhazia was disseminated several days ago. The parliamentary minority (political block Revival, leader of which is Aslan Abashidze, lead of Adjara Autonomous Republic) accused the Georgian authorities of using military and political adventurism. Leader of the minority Jemal Gogitidze is positive that Chechen boeviks gathered in Kodori Gorge near the border of Abkhazia are planning to enter Adjara Autonomous Republic through the Black Sea coast. Giorgi Targamadze, leader of the oppositional faction United Georgia, supports the idea and claims that the military and political intrigue is made up by the authorities in order to draw the society's attention away from conflict between Shevardnadze and Zhvania (head of the parliament) and serve Russia's interests in Georgia, the Resonance states. Citizens Union, the ruling party, on the other hand, regards the government of Adjara that supports the interests of Russia. Illegal dislocation of Russian military forces in the neighborhood of Cholokhi (Adjara) was reviewed at the Defense and Security Committee session yesterday. Everything should be done for the Russian military bases to leave the territory of Georgia because they hinder the country's security, head of the Committee Gia Baramidze announced. Both ruling and opposition parties try to collect scores for just the upcoming elections while the internal situation in the country is very tense. Making the theme of Abkhazia active and talking about possible enemies is a part of the electoral campaign, this is how the newspaper evaluated the comments of government representatives. It is also worth pointing out that Russia has sent a landing party to the Gudauta military base, territory of Abkhazia, in order to find and catch 13 Chechen boeviks thought to be dislocated there (the Resonance). According to Khizri Aldamov, nonofficial representative of Chechnya in Georgia, none of these 13 boeviks are nationally Chechen; they are citizens of the Russian Federation. It may be considered that they pretend they are Chechens. Similar incidents have occurred earlier as well. Russia had them come to Georgia deliberately in order to have Georgia involved in provocation, Aldamov stated."
 georg_chech.1.a: "상황을 안정시켜야 합니다."
 georg_chech.2.t: "조지아와 러시아 관료의 회담."
 georg_chech.2.d: "최근, 조지아와 러시아 정치인들 간에 체첸 전사들의 조지아와 러시아 연방 간의 국경 협곡에 존재하는 문제를 해결하기 위한 회담이 열렸습니다. 조지아는 이전의 갈등에도 불구하고 문제 해결을 위한 도움을 요청했습니다. 조지아는 러시아 평화유지군의 주둔과 조지아에 대한 외교적 지원을 요청하고 있습니다."
 georg_chech.2.a: "그들이 도와주기를 바랍시다."
 georg_chech.2.b: "물론이죠, 테러리스트들은 체포되어야 합니다."
 georg_chech.2.c: "그들은 스스로 알아서 해야 할 겁니다."
 georg_chech.3.t: "지원을 보내는 러시아"
 georg_chech.3.d: "러시아는 우리가 그들을 체포해 러시아로 돌려보내는 것을 위해 지원을 보내기로 동의했습니다."
 georg_chech.3.a: "다음에 무엇을 할지 결정합시다..."
 GEO_chech_future_help_TT: "§Y체첸인들이 도움의 대가로 훗날 우리를 도울 수도 있습니다§!"
 GEO_chech_will_not_future_help_TT: "§R체첸 보예비크는 우리가 구해 주지 않았으므로 우리에게 적대적이 될 것입니다.§!"
 georg_chech.4.t: "체첸 보예비크를 러시아에 넘기지 않는 조지아"
 georg_chech.4.d: "러시아 당국이 놀랍게도, 조지아는 여러 이유로 모든 체첸 전투원을 러시아에 인도할 수 없다고 말합니다. 일부는 그들을 제3국으로 추방하거나 조지아 내에서 재판에 회부하기로 했다고 말합니다. 조지아는 소수의 하급 전투원만을 인도했으며, 지도자들은 여전히 조지아 감옥에 있습니다."
 georg_chech.4.a: "훗날 쓸모가 있을 겁니다..."
 georg_chech.4.b: "불장난을 하고 있소, 에두아르트."
 georg_chech.4.c: "가장 중요한 건 이제 국경이 안전하다는 것입니다."
 georg_chech.5.t: "체첸 보예비크를 러시아에 인도하는 조지아"
 georg_chech.5.d: "조지아는 지역의 안보와 안정이라는 상호 이익을 위해 모든 체첸 전투원을 러시아에 인도했다고 주장합니다. 처음에 조지아는 소수의 하급 전투원만 인도했지만, 이제 지도자들은 이미 러시아에서 재판에 회부되었습니다."
 georg_chech.5.a: "그들이 우리의 노력을 마음에 들어 하기를 바랍시다."
 georg_chech.5.b: "조지아-러시아 관계가 더 굳건해질 겁니다."
 georg_chech.5.c: "응? 뭐라고요..? 우린 신경 안 씁니다."
 GEO_chechsns_pankis_idea: "국경 협곡의 체첸 보예비크"
 georg_chech.6.t: "조지아의 외교 사절 개시"
 georg_chech.6.d: "미국과 영국이 아프가니스탄에서 군사 작전을 시작하여 테러와의 전쟁이 시작된 것과 거의 동시에, 압하지야-조지아 대립 지역에서 무력 충돌이 일어났습니다. 압하지야에 속하지만 조지아가 통제하는 코도리 협곡에서 조지아 빨치산과 북캅카스 무장 세력의 합동 분견대가 수후미가 통제하는 영토로 내려왔습니다. 병력이 압하지야-조지아 국경까지 집결하고 있습니다. 조지아 의회는 충돌 지역에서 러시아 평화유지군의 철수를 요구했고, 압하지야는 러시아 편입을 신청하겠다고 발표했습니다. 무력 단계입니다. 우리는 모스크바 주재 압하지야 대표 이고르 아흐바, 조지아 의원 햄릿 치파슈빌리, 트빌리시 특파원 유리 바크나제와 이 주제를 논의해 보겠습니다. 코도리 협곡에서 실제 전투가 벌어지고 있어 여러 의문이 한꺼번에 제기됩니다. 코도리 협곡은 지리적으로 압하지야에 속하지만 최근까지 조지아가 통제했습니다. 모스크바 주재 압하지야 대표 이고르 아흐바가 발언합니다."
 georg_chech.6.a: "물론 크비치아니와 겔라예프겠지..."
 georg_chech.6.b: "상호 합의를 준비합시다."
 georg_chech.6.c: "우리는 별로 신경 쓰지 않습니다."
 GEO_geopolice: "조지아 경찰"
 GEO_geopolice_desc: "조지아 정부는 질서를 회복하기 위해 경찰 예산을 급격히 늘릴 것입니다!"
 GEO_bring_back_order: "질서 회복"
 GEO_bring_back_order_desc: "경찰 재정 확대로 범죄와 테러로 인한 국내 상황이 바로잡혔습니다. 전국의 사업주들은 상황이 해결된 것에 크게 감사하고 있습니다. 조지아의 거리에 질서가 회복되었습니다."
 GEO_internal_affairs: "내무"
 GEO_internal_affairs_desc: "국내의 모든 경찰 부패를 성공적으로 척결했습니다. 수백 명의 경찰관을 교체해야 했으며, 이로 인해 인력이 소모되었습니다."
 GEO_recruit_more_men: "인원 추가 모집"
 GEO_recruit_more_men_desc: "경찰에 합류할 인원을 성공적으로 더 모집하여 평균 부패 수준을 낮추고 안정도를 높였습니다."
 GEO_vozmest_nedobor: "지방 경찰 개혁"
 GEO_vozmest_nedobor_desc: "조지아의 주요 도시에서 여러 차례 모집 행사를 성공적으로 개최하여 지원서가 쇄도했으며, 이제 국가는 대체로 안전하다고 여겨집니다. 비용이 들지만 전반적인 안정도는 높아질 것입니다."
 GEO_geopolice_game: "지오폴리스 게임"
 GEO_geopolice_game_desc: "새롭게 개선된 조지아 경찰이 범죄를 성공적으로 단속했으며, 통계는 이제 조지아인들이 법을 따르고 타인을 존중하며 평화를 유지할 가능성이 더 높아졌음을 보여 줍니다. 우리는 조지아의 꿈입니다."
 GEO_Military_desc: "조지아 군의 대대적인 개혁에 착수합니다."
 GEO_Geo_air_mil_desc: "조지아 공군의 개혁에 착수합니다."
 GEO_Geo_navy_mil_desc: "조지아 해군의 개혁에 착수합니다."
 georg_military.1.t: "조지아 군 개혁"
 georg_military.1.d: "조지아가 군 개혁에 성공하였으며, 영광스러운 조국을 지키기 위해 입대하는 신병이 쇄도하고 있습니다."
 georg_military.1.a: "결과에 만족한다."
 georg.1243.t: "러시아군 철수를 요구하는 조지아"
 georg.1243.d: "최근 사건을 계기로 조지아 정부는 우리 정부에 자국 내 모든 군 병력의 공식 철수를 요구하는 통지를 보내왔습니다. 이 요구에는 러시아군이 소유하고 운영하는 모든 군사 기지의 폐쇄도 포함됩니다. 우리 군은 주둔지에서 이동하여 조지아와의 국경 너머로 돌아가고 있습니다."
 georg.1243.a: "유감스러운 상황"
 georg.1244.t: "우리 영토 내 구소련 공군 기지와 그 자산 장악"
 georg.1244.d: "오늘 조지아군이 구소련 공군 기지를 습격해 되찾고 남아 있던 모든 자산을 확보했습니다."
 georg.1244.a: "우리가 가져가겠다!"
 GEO_yak52: "Yak 52"
 GEO_superpuma: "슈퍼 퓨마"
 GEO_albatros: "알바트로스"
 GEO_air_reforms: "공군 개혁"
 GEO_west_avia_inst: "서방 항공 교관"
 GEO_restructure_vvs: "VVS 개편"
 GEO_new_methods: "새로운 훈련 방식"
 GEO_hermes: "헤르메스"
 GEO_skylark: "스카이라크"
 GEO_soviet_airbase_desc: "퇴역한 낡은 소련 공군 기지를 습격하여 그 안에 있는 모든 자산을 확보할 수 있도록 군을 준비시킵니다."
 GEO_bpla_isr_desc: "조지아의 통상 및 외무 장관이 이스라엘과 자리를 마련하여 무인기 거래 가능성을 논의합니다."
 GEO_hermes_desc: "이스라엘제 무인기 헤르메스 20대를 성공적으로 주문했습니다."
 GEO_skylark_desc: "이스라엘제 무인기 스카이라크 15대를 성공적으로 주문했습니다."
 GEO_kick_russian_troops_desc: "남오세티야와 압하지야에 맞선 분쟁에서 교훈을 얻은 뒤, 우리 군은 개혁이 절실합니다. 추가 자금 지원, 해외 지지자와 동맹국 또는 경제 파트너에 대한 접촉 등 위대한 우리 군을 개혁하고 미래를 위해 최적화할 방법은 여러 가지가 있습니다."
 GEO_us_helis_desc: "미국제 공격 헬리콥터 20대를 성공적으로 주문했습니다."
 GEO_su27_desc: "러시아 국방부와 자리를 마련하여 합의에 이르렀으며 Su-27 10대를 조달했습니다."
 GEO_belluh: "벨-어"
 GEO_belluh_desc: "1965년형 미국제 수송 헬리콥터 25대를 성공적으로 조달했습니다."
 GEO_dolphin_desc: "체코제 돌핀 공격 전투기 15대를 성공적으로 조달했습니다."
 GEO_albatros_desc: "체코제 알바트로스 공격 전투기 15대를 성공적으로 조달했습니다."
 GEO_yak52_desc: "러시아제 공격기 15대를 성공적으로 조달했습니다."
 GEO_air_reforms_desc: "조지아 공군을 성공적으로 개혁하여 국내 안정도를 높였습니다."
 GEO_west_avia_inst_desc: "귀하와 서방이 합동 공중전 훈련에 참가하여 항공 경험치와 내구도가 향상됩니다."
 GEO_restructure_vvs_desc: "국방부가 조지아 공군의 지출 예산 개혁에 착수합니다."
 GEO_new_methods_desc: "조지아 공군이 기량을 강화하기 위해 대규모 훈련을 시작합니다."
 georg.234.t: "지오폴리스 게임"
 georg.234.d: "게임은 무료이며 조지아어로 되어 있지만 플레이하기에 꽤 직관적입니다. 3개의 레벨이 있습니다. 수사 1개, 퍼즐 1개, 슈터 FPS 1개, 이스터 에그 레벨 1개. 레벨은 어떤 순서로든 플레이할 수 있으며, 퍼즐을 푸는 선택지와 방법이 여럿 있습니다. 게임 다운로드 링크는 아래에 있습니다. 게임 ISO: Stormbringerstudios.com 패치: Stormbringerstudios.com"
 georg.234.a: "우리의 자랑이다!"
 GEO_comcivilwar_TT: "공산주의자들이 조지아에서 내전을 일으킵니다!"
 stalin_legacy_TT: "§Y조지아가 스탈린의 유산을 재건합니다§!"
 georgian_perseverance: "므헤드룰리의 정신"
 georgian_perseverance_desc: "조지아인들은 수 세기 동안 캅카스에 존재해 왔으며 자신들만의 독특한 길을 걸어올 수 있었습니다. 어떤 이웃은 떠나고, 어떤 이웃은 우리와 나란히 걷습니다. 그러나 조지아인들은 그 자리에 남아 있습니다."
 GEO_russian_spies_idea: "러시아 첩자에 대한 공포"
 GEO_police_chaos_idea: "경찰의 혼란"
 GEO_police_chaos_idea_desc: "조지아의 경찰은 매우 통제되지 않고 있습니다. 사실상 형식적으로만 존재합니다. 범죄가 기승을 부리고 있습니다. 이를 바꿀 때입니다."
 GEO_political_opposition: "강력한 정치적 야당"
 GEO_political_opposition_weak: "약한 정치적 야당"
 GEO_gaz_problems: "천연가스 부족"
 GEO_gaz_problems_desc: "자체 매장량이나 수입으로 천연가스를 확보하지 못하는 상황이 현재 나라 전반에 문제를 일으키고 있습니다."
 GEO_energy_problems: "전력 문제"
 GEO_energy_problems_desc: "전력 부족은 시민들의 복지에 심각한 문제를 일으키고 있습니다."
 geo_non_demo_path_TT: "§Y조지아가 비민주적 노선을 걷게 됩니다!§!"
 geo_demo_path_TT: "§Y조지아가 민주적 노선을 걷게 됩니다!§!"
 geo_demo_path_2_TT: "§G조지아가 민주적 노선을 계속 이어갑니다!§!"
 GEO_revive_mhedrioni: "므헤드리오니 부활"
 GEO_revive_mhedrioni_desc: "므헤드리오니는 조지아 공화국의 준군사 조직으로, 조지아 내전과 압하지야 전쟁에 깊이 관여한 것으로 유명했습니다. 1995년에 불법화되었으나 이후 애국자 연합이라는 정당으로 재편되었습니다. 그러나 등록에 실패하여 곧 잊혀졌습니다. 이제 군의 통치를 확립하기 위해 그들을 되살려야 합니다."
 GEO_revive_high_council: "조지아 최고회의 복원"
 GEO_revive_high_council_desc: "우리가 필요로 하는 기조로 국가 내정을 관리할 최고회의를 소집할 수 있는데, 의회와 내부 분열이 왜 필요합니까?"
 GEO_puppet_shervad: "꼭두각시 셰바르드나제"
 GEO_puppet_shervad_desc: "한때 정부 안정화를 위해 우리가 에두아르트를 지지하여 나라를 다스리게 한 적이 있습니다. 지금 나라는 다시 혼란에 빠졌습니다. 회의는 셰바르드나제를 꼭두각시로 삼고 진정한 권력을 쥐어야 합니다..."
 GEO_iron_hand_georgia: "조지아의 철권"
 GEO_iron_hand_georgia_desc: "조지아의 모든 문제는 국민을 단결시키고 사회에 질서를 가져올 철권이 이 나라에 없다는 데서 비롯됩니다."
 GEO_diplomatic_president: "에두아르트 셰바르드나제"
 georg_militar.1.t: "조지아의 군사 쿠데타!"
 georg_militar.1.d: "최근 조지아에서 군사 쿠데타가 일어났습니다. 군 최고 사령부가 조지아 정부를 장악하였습니다. 이것이 어디로 이어질지 지켜봅시다."
 georg_militar.1.a: "전진!"
 georg_militar.2.t: "조지아에서 권력을 잡은 자바 이오셀리아니"
 georg_militar.2.d: "자바 이오셀리아니가 조지아에서 권력을 잡았습니다. 그와 그의 마피아/군사 평의회는 이제 조지아 정부 간부회에 자리하고 있습니다. 그는 다음에 무엇을 할까요?"
 georg_militar.2.a: "흥미롭군."
 GEO_empower_yoseliani: "요셀리아니에게 힘을 실어주다"
 GEO_empower_yoseliani_desc: "오직 요셀리아니만이 자신의 권위와 능력으로 이 나라를 통제하고 필요한 우선순위를 가려낼 수 있습니다. 그를 권좌에 올릴 때입니다."
 geo_oppos_soft_TT: "§Y야당에 더 유화적으로 대하게 됩니다!§!"
 geo_oppos_harsh_TT: "§Y야당에 더 가혹하게 대하게 됩니다!§!"
 GEO_militarism_TT: "§Y조지아에 군국주의 숭배가 일어납니다!§!"
 GEO_seek_for_greater_georgia: "대조지아 추구"
 GEO_seek_for_greater_georgia_desc: "대조지아를 세우려는 열망을 중심으로 새로운 이념을 구축해야 합니다. 이것이 새로운 의제, 새로운 일상이 되어야 합니다. 대조지아는 필연입니다!"
 GEO_diplomatic_approach: "효율적인 외교 접근"
 GEO_diplomatic_approach_desc: "새 정부에는 효율적인 외교 접근이 더 바람직합니다. 관료주의가 우리의 계획을 가로막지 못하게 해야 합니다."
 GEO_reketir_opposition: "야당 갈취"
 GEO_reketir_opposition_desc: "거리 운동과 불량배 조직이 그들을 갈취하여 굴복시킬 수 있는데, 왜 야당과 끊임없이 대화해야 합니까?"
 georg.3.t: "협력 협정을 요청하는 조지아"
 georg.3.d: "조지아는 여러 분야의 상호 협력과 포괄적인 우호 조약의 대가로 자바헤티 문제를 제기하지 말아 달라고 요청합니다. 어떻게 답하겠습니까?"
 georg.3.a: "물론이지"
 georg.3.b: "미안하지만, 안된다"
 georg.4.t: "동의한 아르메니아!"
 georg.4.d: "아르메니아가 조약에 동의했습니다."
 georg.4.a: "환상적이군"
 georg.5.t: "거부한 아르메니아!"
 georg.5.d: "아르메니아가 우리의 조약 제안을 거부했습니다."
 georg.5.a: "으음..."
 GEO_loyal_guard: "므헤드리오니 근위대"
 GEO_loyal_guard_desc: "므헤드리오니의 충성 근위대는 조지아 군의 일부로 인정되어야 합니다. 비록 깡패들이지만 그 어떤 장군보다도 충성스럽습니다."
 GEO_killt_opposition: "야당 명단 일소"
 GEO_killt_opposition_desc: "온갖 종류의 반체제 인사와 정치 불순분자로부터 우리나라를 깨끗이 정리할 때가 왔습니다..."
 GEO_fidain_TT: "§Y자바 깡패들이 군의 일부가 됩니다!§!"
 GEO_reform_governmant: "정부 개혁"
 GEO_reform_governmant_desc: "더 명확하고 군사화된 국가 통제를 위해 우리나라를 개혁할 때입니다. 지역주의와 지방 자치의 모든 잔재를 끝낼 때입니다... 또한 유럽과 조지아 자체에서 유럽 회의주의를 조장해야 합니다."
 GEO_diplomatic_president_zur: "살로메 주라비슈빌리"
 GEO_otkos_TT: "인력이 매우 낮아집니다."
 GEO_otkos_armyidea: "의문스러운 군사 정책"
 GEO_way_to_soc_desc: "이 나라의 유일한 참된 길은 국민이 자유롭고 평등한 길이며, 우리는 사회주의를 통해 이를 보게 될 것입니다."
 GEO_increase_budget_desc: "우리는 조국을 지켜야 하며, 그 유일한 방법은 군사 지출을 늘리는 것입니다."
 GEO_defense_of_georgia: "조지아 방어"
 shervad_win_lol_TT: "§Y인기와 관계없이 셰바르드나제가 새 지도자가 됩니다!§!"
 georg_revol.1.t: "조지아의 장미 혁명!"
 georg_revol.1.d: "조지아에서 회색 여우의 시대가 막을 내렸습니다. 평화로운 장미 혁명이 에두아르드 셰바르드나제를 물러나게 하였습니다. 전설적인 교활함과 음모의 기술도 그를 구하지 못했습니다. 셰바르드나제가 오래전에 은퇴했더라면 조국을 충격에서, 그리고 자신을 굴욕에서 구할 수 있었을 것이며, 조지아는 오직 이득만 보았을 것입니다. 최근 몇 년간 75세의 대통령은 나라의 문제를 해결하지 않고 뒷전으로 미루었습니다. 조지아의 자원은 오로지 셰바르드나제의 권력을 유지하는 데에만 쓰였습니다. 셰바르드나제는 국민을 기만하였습니다. 그는 선거 부정을 묵인하거나 심지어 직접 조직하기까지 했습니다. 그의 사임을 불러온 것은 바로 이 거짓말이었습니다. 그는 나라를 유혈 사태로부터 구했고, 이것은 그의 공로입니다. 그러나 조지아에서 국가 권력의 권위는 아직 회복되지 않았습니다. 게다가 가장 중요한 물음, 곧 셰바르드나제 이후 이 나라의 미래는 어떻게 될 것인가에 대한 답은 아직 없습니다."
 georg_revol.1.a: "다른 선택지가 없다"
 georg_revol.2.t: "조지아의 시위"
 georg_revol.2.d: "부정 개표에 항의하는 집회가 트빌리시에 모였습니다. 당국은 불안을 느끼고 만일에 대비하여 결과를 약간 수정해 부르자나제-민주당이 기준선인 7퍼센트를 얻도록 하였습니다. 이 모든 소요는 신중하게 무시할 수도 있었으나, 미묘한 문제가 하나 있었습니다. 새 의회가 혼란의 물결 속에서 소집되지 못할 수도 있다는 점입니다. 의원 절반이 선거 결과를 인정하지 않아 정족수가 분명히 부족했습니다. 셰바르드나제는 의회를 가동하기 위해 무언가를 해야 했지만 아무것도 할 수 없었습니다. 회색 여우는 시간을 벌기로 하였습니다. 시위대가 지칠 때까지 끝없는 협상을 이어 가는 것입니다. 그의 편에는 트빌리시의 11월 비라는 강력한 동맹이 있었습니다."
 georg_revol.2.a: "시위가 저절로 가라앉기를 바라자..."
 georg_revol.3.t: "사카슈빌리의 시대"
 georg_revol.3.d: "조지아에서 사카슈빌리의 시대가 시작되었습니다. 에두아르드 셰바르드나제의 뒤늦은 사임이 유혈 내전을 막았을 수도 있습니다. 그러나 전망은 여전히 극도로 위험합니다. 조지아는 야권의 온건 정치 세력을 결집하고 급진파를 고립시키는 데 성공해야만 더 나은 미래를 맞이할 기회를 얻을 것입니다. 장미 혁명은 소련 해체 이후 여러 나라 대통령들 사이에 불안을 일으킬 것입니다. 유사한 소요가 우크라이나, 키르기스스탄, 우즈베키스탄에서도 일어날 것입니다. 러시아 자체에서도 많은 것이 바뀔 것이며, 당국은 자신들이 취약하다는 사실을 깨닫게 될 것입니다. 외무부는 소련 해체 이후의 공화국들에도 관심이 필요하고, 그곳에서 일하며 자국의 이익을 지켜야 한다는 사실을 못마땅해하고 있습니다."
 georg_revol.3.a: "조지아가 자신의 길을 택했다!"
 GEO_adjara_unstable: "아자리야 불안정"
 GEO_kviciani_shit: "크비치아니의 반란"
 GEO_kviciani_medium_close: "크비치아니 단속"
 GEO_kviciani_medium_agree: "크비치아니와 협상"
 GEO_kviciani_in_gov: "엠자르 크비치아니"
 georg_revol.4.t: "크비치아니의 반란!"
 georg_revol.4.d: "크비치아니는 더 이상 조지아 중앙정부에 복종하지 않겠다고 선언하였습니다. 이 선언의 원인은 내무부 장관과 국방부 장관인 바노 메라비슈빌리와 오크루아슈빌리 등 조지아 정부 인사들의 행위였습니다. 크비치아니에 따르면 이들의 명령으로 코도리 주민들이 당국에 박해를 받았습니다. 이에 크비치아니는 조지아 법 집행 기관장들의 사임을 요구하였으며, 그렇지 않으면 사람들을 트빌리시 거리로 불러내고 코도리 현지에서 조지아군에 대한 무장 저항을 조직하겠다고 위협하였습니다."
 georg_revol.4.a: "무엇을 할 수 있는지 살펴보자."
 georg_revol.5.t: "아자리야 위기!"
 georg_revol.5.d: "우리 현 정부에 반대해 온 아바시제가 아자리야에서 반조지아 활동을 벌이기 시작했습니다. 이 연설들에서 아바시제는 에두아르드 셰바르드나제 대통령을 지지하였고, 아자리야 방송에 출연해 야당인 통합국민운동의 지도자 미헤일 사카슈빌리와 다비트 베르제니슈빌리를 파시스트라 부르고 그들의 운동 또한 파시스트 운동이라 불렀습니다. 11월 23일 야당이 의사당을 점거한 뒤, 아자리야 정부는 비상사태를 선포하였습니다."
 georg_revol.5.a: "이 멍청이를 처리하자."
 saakash_ep_TT: "§Y사카슈빌리의 집권은 예기치 못한 결과를 가져올 수 있습니다!§!"
 GEO_adjara_unstable_2: "아자리야 불안정 - 부분 해결"
 GEO_adjara_unstable_3: "아자리야 불안정 - 통합 진행"
 kviciani_ef_TT: "§Y모나디레와 접촉해 합의를 시도합니다!§!"
 georg_revol.6.t: "코도리 위기"
 georg_revol.6.d: "엠자르 크비치아니는 모나디레 분견대의 재창설을 발표하고 조지아 정부에 대한 불복종을 선언하였으며, 스반인들에게 전횡을 저지르고 그들의 몰살을 준비했다고 크비치아니가 주장하는 내무부 및 국방부 수장 바노 메라비슈빌리와 오크루아슈빌리의 사임을 요구하였습니다. 동시에 크비치아니는 시민 불복종 행동으로, 극단적인 경우에는 무장 저항으로의 전환으로 위협하였습니다."
 georg_revol.6.a: "합의점을 찾을 수 있지 않을까?"
 georg_revol.6.b: "배신자는 처벌받아야 한다!"
 GEO_kvic_acc: "크비치아니와 합의했습니다!"
 GEO_kvic_den: "모나디레를 숙청하기로 결정했습니다!"
 GEO_Zhvania: "주라브 주바니아"
 georg_revol.7.t: "살해된 즈바니아!"
 georg_revol.7.d: "총리의 시신이 친구의 아파트에서 발견되었습니다. 더구나 그의 친구 역시 숨진 채 발견되었습니다. 장관의 말에 따르면 어젯밤 즈바니아는 조지아 한 지역의 부지사인 친구를 방문하러 갔습니다. 잠시 후 총리의 경호원들은 그가 전화에 응답하지 않아 걱정하게 되었습니다. 현지 시각 4시 30분, 경호원들이 창문을 깨고 들어가 즈바니아와 그 친구의 시신을 발견했습니다. V. 메라비슈빌리가 밝힌 예비 견해에 따르면 사고가 있었고, 사인은 가스 중독이었습니다. 그러나 트빌리시 가스 공급 회사 트빌가즈 주식회사의 다비트 모르칠라제 사장은 아파트를 점검한 뒤 루스타비 2 방송에 천연가스 누출은 없었다고 말했습니다. 그에 따르면 아파트에는 가스 히터가 설치되어 있었으며, 아마도 한동안 가스 불완전 연소 생성물이 아파트에 쌓여 중독을 일으켰을 수 있다고 합니다. 게다가 모스크바의 메아리 방송에 따르면 현재 즈바니아가 숨진 건물 입구로 통하는 모든 접근로가 경찰에 의해 차단되어 있습니다. 기자들 또한 그의 시신이 옮겨진 공화국 병원에 출입할 수 없습니다. 병원 의사가 언론 관계자들에게 말한 바로는, 검시가 끝날 때까지 언론과 대화하지 않을 것이라고 합니다. 그는 \\"대통령이 기자들과 접촉하지 말라고 지시했다는 통보를 받았다\\"고 말했습니다. 즈바니아의 사망을 계기로 소집된 정부 긴급 회의가 이미 트빌리시에서 열렸습니다. 조지아의 미헤일 사카슈빌리 대통령이 회의에서 연설했습니다. 그에 따르면 조지아는 위대한 애국자를 잃었고, M. 사카슈빌리 자신은 가장 가까운 친구이자 가장 믿음직한 조언자이며 전우를 잃었습니다. 대통령은 정부에 단호하고 굳건하며 단결할 것을 촉구했습니다. 아울러 M. 사카슈빌리는 즈바니아와 함께 숨진 라울 유수포프의 유족에게도 조의를 표했습니다. 회의 참석자들은 1분간의 묵념으로 고인들을 추모했습니다."
 georg_revol.7.a: "좋아"
 GEO_stalin_legacy_desc: "위대한 스탈린은 세상에 자취를 남겼으며, 우리는 그의 위대한 유산을 이어가야 합니다."
 GEO_demograph_TT: "§Y현재 인력은 [GEO.GetManpower]이며, [GEO.GetFlag]조지아의 인구를 늘리도록 노력합니다!§!"
 georg_revol.8.t: "러시아 첩자 혐의자들을 투옥한 조지아!"
 georg_revol.8.d: "일주일간의 침묵 끝에 조지아 내무부는 러시아를 위해 간첩 행위를 한 혐의가 있는 13명의 명단을 발표했습니다. 내무부 대표들에 따르면 이 대규모 작전은 조지아 방첩 당국이 4년간 이어 온 작업의 결실입니다. 전례 없는 작전이자 러시아 특수 기관의 불패 신화가 무너졌다는 평가가 금요일 조지아 내무부가 간첩망 적발을 공식 발표한 뒤 조지아에서 나왔습니다."
 georg_revol.8.a: "정신이 나간 것인가?"
 GEO_cis_eu_influence_decision: "EU 및 CIS 무역 영향력"
 GEO_cis_eu_influence_decision_desc: "조지아의 정책은 인접한 경제권과의 대외 무역에 직접적으로 달려 있습니다. 어느 한쪽을 우선시하면 정치적 기동의 여지를 얻을 수 있습니다.\n\n§YEU 무역 영향력§!: [?ROOT.GEO_eu_trade_influence] £european_union_texticon \n§YCIS 무역 영향력§!: [?ROOT.GEO_cis_trade_influence] £russian_flag_cis_texticon"
 GEO_expand_cis_influence: "CIS/러시아와 무역 확대"
 GEO_expand_eu_influence: "EU/미국과 무역 확대"
 GEO_cis_trade_influence_decr_TT: "§RCIS 무역 영향력이 -5 변경됩니다!§!"
 GEO_cis_trade_influence_incr_TT: "§GCIS 무역 영향력이 +5 변경됩니다!§!"
 GEO_EU_trade_influence_decr_TT: "§REU 무역 영향력이 -5 변경됩니다!§!"
 GEO_EU_trade_influence_incr_TT: "§GEU 무역 영향력이 +5 변경됩니다!§!"
 GEO_focus_eu_trade_above_fifty_TT: "§YEU/미국 무역 수준이 50을 초과해야 합니다!§!"
 GEO_focus_cis_trade_above_fifty_TT: "§YCIS/러시아 무역 수준이 50을 초과해야 합니다!§!"
 GEO_focus_eu_trade_above_eighty_TT: "§YEU/미국 무역 수준이 80을 초과해야 합니다!§!"
 georg_war2008.1.t: "행동 방침의 결정"
 georg_war2008.1.d: "그리하여 남오세티야와 압하지야 문제는 현재 조지아라는 나라의 최우선 의제로 떠올랐습니다... 한편으로 오세티야를 정복하려는 시도는 조지아에게 어렵고 위험한 모험입니다. 일부 장성들은 러시아가 아무 손도 쓰지 못하고 러시아 평화유지군이 어떠한 행동도 개시하기 전에 오세티야를 병합할 수 있도록, 양면에서 신속하게 돌진하여 전격전을 감행할 것을 제안합니다. 다른 한편으로 전문가들은 오세티야와 압하지야 문제를 포기하고 모든 것을 현재 상태 그대로 두며, 어쩌면 그들의 독립을 승인하기까지 해야 한다고 경고합니다. [GEO.GetLeader] 동지 대통령 각하, 우리는 어떻게 하겠습니까?"
 georg_war2008.1.b: "문제를 포기해야 한다... 그들을 승인하자."
 georg_war2008.1.a: "가짜 공화국들을 공격해야 한다. 계획을 준비하라."
 georg_war2008.1.c: "다른 선택지는 없는가?"
 georg_war2008.2.t: "다른 선택지"
 georg_war2008.2.d: "[GEO.GetLeader] 동지 대통령 각하, 이 문제를 해결하겠다고 약속하셨습니다! 국민이 해결책을 요구하고 있습니다."
 georg_war2008.2.a: "좋다... 윽."
 GEO_flag_chose_atak: "공격을 선택했습니다"
 GEO_flag_chose_peace: "물러나기를 선택했습니다"
 georg_war2008.3.t: "조지아의 우크라이나 의용군"
 georg_war2008.3.d: "육군 소속의 많은 우크라이나 의용군과 UNA-UNSO 조직 출신의 퇴역 군인들이 조지아의 지원 요청에 응하기로 결정하고 조지아군에 합류하여 의용 대대를 편성하였습니다."
 georg_war2008.3.a: "흥미롭군"
 georg_war2008.3.b: "환상적이군"
 georg_war2008.4.t: "조지아의 체첸 의용군"
 georg_war2008.4.d: "자유 이치케리아의 많은 체첸 전투원들이 조지아 편에 서기로 결정하고 조지아군 내에 의용 대대를 편성하였습니다."
 georg_war2008.4.a: "윽, 배신자들."
 georg_war2008.4.b: "환상적이군"
 georg_war2008.5.t: "합의를 제안하는 조지아"
 georg_war2008.5.d: "조지아는 압하지야와 남오세티야에 관한 전면적인 합의를 우리에게 제안하려 합니다. 이에 따라 조지아는 영유권 주장을 포기하고 미승인 공화국들을 승인하게 됩니다. 물론 좋은 일이지만, 그 이후 조지아가 NATO에 가입하도록 내버려 두어서는 안 됩니다..."
 georg_war2008.5.a: "동의하지만 양보가 필요하다."
 georg_war2008.6.t: "특수 작전을 경고하는 조지아"
 georg_war2008.6.d: "조지아는 남오세티야 영토에서 군사 작전을 수행하기로 결정했다고 우리에게 경고합니다. 우리가 개입하지 않는 대가로 우리 평화유지군을 공격하지 않겠다고 약속합니다. 그러나 별다른 이유도 없이 그들은 이미 츠힌발리 인근의 군 야영지에 포격을 개시하였습니다. 우리나라는 남오세티야의 안전을 보장하고 있으니, 개입하여 조지아인들에게 교훈을 가르쳐 주어야 할지도 모릅니다."
 georg_war2008.6.a: "생존자들을 끝장내라!"
 georg_war2008.6.b: "오세티야에서 손을 떼자..."
 georg_war2008.7.t: "호랑이 작전의 성공!"
 georg_war2008.7.d: "조지아가 오세티야를 병합합니다."
 georg_war2008.7.a: "하하!"
 georg_war2008.8.t: "강요된 평화..."
 georg_war2008.8.d: "달라진 것은 없다"
 georg_war2008.8.a: "아."
 georg_war2008.10.t: "강요된 평화"
 georg_war2008.10.d: "조지아에 평화를 강요해야 하는가, 아니면 전쟁을 계속해야 하는가?"
 georg_war2008.10.a: "물론이지, 충분히 당했다..."
 georg_war2008.10.b: "생존자들을 끝장내라!"
 georg.21.t: "투자를 원하는 조지아"
 georg.21.d: "조지아가 우리에게 투자를 원합니다. 수락하겠습니까?"
 georg.21.a: "물론이지, 고기!"
 georg.21.b: "안된다"
 georgia_news.1.t: "남오세티야와 압하지야를 승인한 조지아!"
 georgia_news.1.d: "조지아가 추진해 온 새로운 정책에 따라, 조지아는 양자 협력의 틀 안에서 오세티야와 압하지야를 승인하기로 결정하였습니다. 이것이 조지아에 평화와 앞으로의 분쟁 종식을 의미하는 것일까요?"
 georgia_news.1.o1: "흥미롭군"
 GEO_lose_war_2008_TT: "§Y실패한 전쟁의 결과를 감수해야 합니다!§!"
 GEO_win_war_2008_TT: "§Y다음에 무엇을 할지 결정해야 합니다!§!"
 GEO_won2008_war: "2008년 전쟁 승리"
 GEO_lost2008_war: "2008년 전쟁 패배"
 GEO_cry_lol_TT: "§R조지아는 2008년 전쟁을 결코 잊지 않을 것입니다!§!"
 GEO_bezhen_trade_TT: "§Y오세티야와 민족 인구를 교환하여 민족 구성에 따른 영토 분쟁이 없도록 합니다!§!"
 georg_war2008.11.t: "보장을 요청하는 조지아"
 georg_war2008.11.d: "조지아는 국제적으로 승인된 자국 영토에 대한 러시아의 불가침을 확보하기 위한 보장을 요청합니다."
 georg_war2008.11.a: "조지아 국가방위대가 즉시 배치될 것이다."
 georg_war2008.11.b: "미안하지만, 조지아는 하나만 있어야 한다."
 GEO_astrian_guns_TT: "§Y오스트리아에서 대전차 미사일 100기를 구매합니다!§!"
 GEO_ukr_GRAD_TT: "§Y우크라이나에서 자주포 75문을 구매합니다!§!"
 GEO_ukr_t72_TT: "§Y우크라이나에서 주력 전차 56대를 구매합니다!§!"
 GEO_ukr_kolchuga_TT: "§Y우크라이나에서 자주 대공포 75문을 구매합니다!§!"
 GEO_romanian_guns_TT: "§Y루마니아에서 보병 장비 1000점을 구매합니다!§!"
 GEO_austrian_guns: "오스트리아제 총기"
 GEO_austrian_guns_desc: "군대를 키우려면 오스트리아제 총기를 구매해야 합니다!"
 GEO_ukr_GRAD: "우크라이나제 GRAD"
 GEO_ukr_GRAD_desc: "나라를 지키려면 군대를 키워야 합니다! 그러기 위해 우크라이나에서 포병 장비를 구매해야 합니다!"
 GEO_ukr_t72: "우크라이나제 T-72"
 GEO_ukr_t72_desc: "위대한 조국을 지키려면 다른 나라에서 더 많은 무기를 구매해야 하므로, 우크라이나에서 전차를 구매하겠습니다!"
 GEO_ukr_kolchuga: "우크라이나제 콜추가"
 GEO_ukr_kolchuga_desc: "공습으로부터 우리 건물을 지켜야 하므로, 친구 우크라이나에서 대공 미사일을 구매합니다!"
 GEO_romanian_guns: "루마니아제 총기"
 GEO_romanian_guns_desc: "아름다운 우리나라를 지키려면 루마니아에서 총기를 구매하겠습니다!"
 GEO_ropadia_contract: "로파디아 계약"
 GEO_ropadia_contract_desc: "다른 나라와의 관계는 언제든 개선할 수 있습니다!"
 GEO_israel_guns: "이스라엘제 총기"
 GEO_israel_guns_desc: "우리 군은 성장해야 하며, 그러기 위해 이스라엘에서 무기를 구매하겠습니다."
 GEO_volf: "울프"
 GEO_volf_desc: "우리의 친구 이스라엘이 다목적 차량을 판매해 줍니다."
 GEO_gi4: "GI4"
 GEO_gi4_desc: "GI4 - 조지아에서 국산 소총을 개발하기 위해 새로 제안된 사업입니다."
 GEO_lynx: "링스"
 GEO_lynx_desc: "군대를 키워야 합니다! 그러기 위해 독일에서 다목적 차량을 구매하겠습니다."
 GEO_maxx: "맥스"
 GEO_maxx_desc: "우리 군은 점점 강해지고 있지만, 언제든 더 많은 무기를 구매할 수 있습니다!"
 GEO_afghan_train: "아프가니스탄 전쟁 경험"
 GEO_afghan_train_desc: "우리 군은 규모가 크지만 훈련이 필요합니다..."
 GEO_fin_snipes: "핀란드제 저격 소총"
 GEO_rm70_TT: "체코가 우리에게 대공 무기 20대를 판매합니다."
 GEO_vz_TT: "체코가 우리에게 포병 장비 50대를 판매합니다."
 GEO_fin_snipes_desc: "우리 군은 점점 더 커지고 강해지고 있으며, 많은 나라가 우리가 받는 지원에 참여하고 있습니다. 핀란드도 그중 하나로, 보병 장비를 판매해 줄 것입니다!"
 GEO_cuguar: "쿠거"
 GEO_cuguar_desc: "미합중국은 많은 나라를 돕고 있으며, 이제 우리도 그들이 돕는 나라 중 하나입니다. 그들에게서 다목적 차량을 받게 되지만 대가를 치러야 합니다!"
 GEO_fgm148: "FGM148"
 GEO_fgm148_desc: "미국이 다시 우리를 돕고 싶어 하며, 이번에는 대전차 미사일을 구매합니다."
 GEO_ejder: "에이데르"
 GEO_ejder_desc: "이제 튀르키예가 우리를 도울 것이며, 우리는 그들에게서 다목적 차량을 구매합니다."
 GEO_oktobar: "오토카르"
 GEO_oktobar_desc: "튀르키예가 다시 우리를 돕고 싶어 하며, 이번에는 그들에게서 다목적 차량을 더 구매합니다."
 GEO_rm70: "Rm70"
 GEO_rm70_desc: "체코가 우리에게 대공 미사일을 판매해 줄 것입니다."
 GEO_vz77: "Vz77"
 GEO_vz77_desc: "체코가 우리에게 더 많은 무기를 판매해 줄 것이며, 이번에는 그들에게서 포병 장비를 구매합니다."
 GEO_didgori: "디드고리"
 GEO_didgori_desc: "우리의 연구 속도가 빠르게 증가하고 있으며, 이제 다목적 차량 연구 속도를 높입니다."
 GEO_zcrs: "ZCSR"
 GEO_zcrs_desc: "미국에서 자주포를 구매하겠습니다."
 GEO_lazika: "라지카"
 GEO_lazika_desc: "자주포를 더 많이 생산하겠습니다."
 GEO_american_train_again: "미국 고문단"
 GEO_american_train_again_desc: "우리는 미국과 좋은 관계에 있지만, 함께 훈련하면 언제든 관계를 개선할 수 있습니다. 그리고 그것은 우리 군을 강화할 것입니다!"
 GEO_mistral: "미스트랄"
 GEO_mistral_desc: "우리는 군대를 키우고 있지만 아직 갈 길이 멉니다! 더 나은 군대를 위해 프랑스에서 무기를 구매합니다."
 GEO_thales: "탈레스"
 GEO_thales_desc: "우리는 군대를 키우고 있지만 아직 갈 길이 멉니다! 더 나은 군대를 위해 프랑스에서 무기를 구매합니다."
 GEO_licenses_self_produce: "국산 지휘통제 장비"
 GEO_licenses_self_produce_desc: "우리 군은 뒤처질 수 없으며 그 기술은 세계 최신이어야 합니다. 이제 우리 군을 위한 새로운 기술 장비를 생산할 수 있습니다."
 GEO_german_guns: "독일제 소형 화기"
 GEO_german_guns_desc: "독일에서 총기를 구매하겠습니다."
 GEO_turkish_pvo: "튀르키예 화기 계약"
 GEO_turkish_pvo_desc: "튀르키예에서 무기를 구매하겠습니다."
 GEO_antitank_stuff: "미국제 대전차 장비"
 GEO_antitank_stuff_desc: "대전차 무기를 더 구매해야 하며, 미국이 일부를 판매하기로 동의했습니다."
 GEO_israel_specialists: "이스라엘과의 관계"
 GEO_israel_specialists_desc: "이스라엘은 우리의 가장 좋은 친구가 될 수 있습니다! 그들과의 관계를 개선하고자 합니다."
 GEO_modif_t72: "우크라이나제 개량 T-72"
 GEO_modif_t72_desc: "우크라이나가 개량형 T-72를 더 판매해 줍니다."
 GEO_help_from_usa_mil: "미국 군사 지원"
 GEO_help_from_usa_mil_desc: "미국이 우리에게 대전차 무기를 판매해 줍니다."
 GEO_humvee: "험비 계약"
 GEO_clear_from_old_guard: "구세대 일소"
 GEO_clear_from_old_guard_desc: "이제 우리 군이 경험을 쌓을 때입니다."
 GEO_mvd_min_oboron: "내무부와 국방부 통합"
 GEO_ukr_guns: "우크라이나제 총기"
 GEO_ukr_guns_desc: "우크라이나가 우리에게 총기를 판매해 줍니다."
 GEO_otmena_zakon_pred: "의문스러운 정책 중단"
 GEO_otmena_zakon_pred_desc: "돈을 받고 군대에서 이탈하도록 사람들을 내버려 두는 일을 중단해야 합니다."
 GEO_afghanistan_intervene: "아프가니스탄 개입"
 GEO_afghanistan_intervene_desc: "이제 우리 편을 택할 때가 왔습니다. 아프가니스탄을 지지하는 것이 그들과 더 나은 관계를 맺기 위해 우리가 할 수 있는 최선입니다."
 GEO_m4: "M4"
 GEO_m4_desc: "미국이 우리 군의 전력을 높이기 위해 총기를 판매해 줍니다."
 GEO_lithuania_treaty: "리투아니아 협력 조약"
 GEO_licenz_TT: "자체 보병 장비를 생산할 수 있는 면허를 얻습니다."
 GEO_lithuania_treaty_desc: "우리 군을 강화하고 리투아니아와 더 나은 관계를 맺겠습니다."
 GEO_reorganization_army: "군 재편"
 GEO_reorganization_army_desc: "연구 속도를 높일 때입니다."
 GEO_training_sustainability: "훈련 및 지속 가능성"
 GEO_training_sustainability_desc: "연구 속도를 높입니다."
 GEO_iraq_stuff_prepare: "이라크 대비"
 GEO_iraq_stuff_prepare_desc: "이라크에서 무슨 일이 생길 경우에 대비해야 합니다."
 GEO_mrpi: "MRPI"
 GEO_mrpi_desc: "군 경험치를 더 얻게 됩니다."
 GEO_traind_and_equip: "군사 훈련"
 GEO_traind_and_equip_desc: "군 경험치를 더 얻게 됩니다."
 GEO_otkos_army: "징병 기피 허용"
 GEO_otkos_army_desc: "군대에 몇 가지 문제가 있습니다... 나중에 고치겠습니다."
 GEO_switzerland_help: "스위스의 구형 헬리콥터"
 GEO_switzerland_help_desc: "스위스가 구형 헬리콥터를 우리에게 넘겨줍니다."
 GEO_kick_russian_troops: "지상군 개혁"
 GEO_immediate_response: "즉각 대응"
 GEO_immediate_response_desc: "포괄적인 군사 개혁과 나토 파트너들과의 협력에 따라, 조지아는 지역 위기 시 아르메니아, 우크라이나, 아제르바이잔, 미국과 협조할 신속 대응 체계를 구축합니다."
 GEO_saakash_sec_eops_TT: "§Y사카슈빌리의 두 번째 시대가 시작됩니다!§!"
 GEO_embrace_cultural_ties: "역사적 유대 수용"
 GEO_embrace_cultural_ties_desc: "역사적 유대를 받아들이는 건 멋지고도 오글거리지, 수상한 소련에서 온 우리 형제들이 진짜 형제가 될 거야, 친구."
 GEO_revive_russian_base: "러시아 기지 부활"
 GEO_revive_russian_base_desc: "러시아 기지를 부활시키는 건 진짜 멋질 거야, 친구으으응"
 GEO_denounce_guam: "중국 투자"
 GEO_denounce_guam_desc: "시 주석님, 위대한 지도자님, 제발 한 번 더 때려 주십시오!"
 GEO_honor_shervad: "지속 가능한 발전"
 GEO_honor_shervad_desc: "시 주석님, 위대한 지도자님, 제발 한 번만 때려 주십시오!"
 GEO_russian_economic_soyuz: "EAEU 협력"
 GEO_russian_economic_soyuz_desc: "돈, 돈, 돈, 돈, 돈, 돈, 돈, 돈, 돈, 돈, 돈, 돈, 돈, 돈, 돈."
 georg.22.t: "사카슈빌리 조사"
 georg.22.d: "사카슈빌리에 대한 조사를 시작하고 그를 투옥할 수도 있겠습니까?"
 georg.22.a: "물론 아니오"
 georg.22.b: "물론 그렇소"
 georg.23.t: "우크라이나로 달아난 사카슈빌리"
 georg.23.d: "사카슈빌리는 재판과 투옥을 피하기 위해 우크라이나로 달아났습니다. 그는 그곳에서 정치 경력을 이어갈 것입니다."
 georg.23.a: "잘 가시오, 미헤일."
 GEO_saakash_freed: "사카슈빌리 석방됨"
 GEO_all_of_geo: "정의를 위한 산악 동맹"
 GEO_legion_TT: "§Y조지아 민족주의 군단이 창설됩니다!§!"
 GEO_ally_with_mafia: "민족 유산"
 GEO_ally_with_mafia_desc: "민족 유산은 우리의 위대한 국가가 기억해야 합니다! 한때 우리는 위대했으니, 다시 그렇게 될 것입니다!"
 GEO_military_junta: "경찰의 군 편입"
 GEO_military_junta_desc: "군국주의적인 우리 사회에는 독립된 경찰 조직이 필요하지 않습니다. 우리의 내정은 통일된 통제와 질서에 기반해야 합니다."
 GEO_georgian_spirit: "조지아 정신"
 GEO_georgian_spirit_desc: "잃어버린 것을 되찾으면 조지아 정신은 세계에 알려질 것입니다, 하!"
 GEO_local_geopolitics: "지역 지정학"
 GEO_local_geopolitics_desc: "우리는 그 어느 때보다 더 독립적이어야 합니다, 으하하하"
 GEO_empower_church: "교회에 힘을 실어주다"
 GEO_empower_church_desc: "교회에 힘을 실어주는 것은 우리 정부와 사회가 건강해지는 데 매우 좋습니다."
 GEO_ss_mhedrioni: "카르트벨 츠헤노산타 레기오니"
 GEO_ss_mhedrioni_desc: "국제 팔랑헤 당원들과 국내 조지아 민족주의 광신자들로 구성된 군단을 창설해야 합니다."
 GEO_ordnungstaat: "질서 국가"
 GEO_ordnungstaat_desc: "조지아는 정말로 절대적인 질서와 복종의 국가이며 우리 국민은 우리를 지지합니다!"
 GEO_monarchist_council: "군주주의 회의"
 GEO_monarchist_council_desc: "조지아의 지도자가 누가 될지는 군주주의 회의가 결정해야 합니다..."
 georg.24.t: "대토론"
 georg.24.d: "누가 조지아를 앞으로 이끌 것인가? 이 질문이 최근 제기되었습니다. 민족 유산을 이야기하는 만큼, 바그라티오니 가문이 다시 조지아를 다스리게 하는 것도 멋지지 않겠습니까?"
 georg.24.a: "왕 만세!"
 georg.24.b: "요셀리아니가 최고 통치자이자 전 조지아의 왕이 되어야 한다."
 GEO_stance_on_abkaz_osset: "준비를 하라"
 GEO_stance_on_abkaz_osset_desc: "생각해 보라..."
 georg.25.t: "우리를 동맹에 초대하는 조지아!"
 georg.25.d: "조지아가 공동의 적과 싸우기 위해 우리를 동맹에 초대합니다!"
 georg.25.a: "물론이죠!"
 georg.25.b: "아니요."
 GEO_yos_warl_abk_oss: "사이비 공화국 분쇄"
 GEO_yos_warl_abk_oss_desc: "이른바 압하지야와 남오세티야 공화국은 조지아 땅을 점거한 러시아의 괴뢰에 불과합니다. 우리는 군사력으로 영토 보전을 회복하고 이 분리 지역들을 트빌리시의 통제 아래로 되돌릴 것입니다."
 GEO_yos_federal_abk_oss: "조지아 연방화"
 GEO_yos_federal_abk_oss_desc: "군사적 수단으로 분리주의 운동을 분쇄하는 대신, 압하지야와 남오세티야에 연방화된 조지아 국가 내에서의 진정한 자치를 제안할 수 있습니다. 이 길은 지역 정체성을 존중하면서 통일을 유지할 수 있을 것입니다."
 GEO_befriend_nat_nobody: "우리 힘으로"
 GEO_befriend_nat_nobody_desc: "조지아는 수 세기 동안 강대국 사이에 끼어 있었습니다. 이제 동방도 서방도 아닌 우리 자신의 힘과 독립에 의존하여 우리만의 길을 개척할 때일지도 모릅니다."
 GEO_befriend_nat_azeris: "아제르바이잔에 접근"
 GEO_befriend_nat_azeris_desc: "아제르바이잔과 조지아는 깊은 역사적 유대와 캅카스 지역에서의 공동 이익을 공유합니다. 바쿠와의 관계를 강화하면 지역 위협에 맞설 강력한 동맹을 만들 수 있습니다."
 GEO_befriend_nat_armenia: "아르메니아와 친선"
 GEO_befriend_nat_armenia_desc: "역사적 긴장에도 불구하고 아르메니아와 조지아는 더 큰 이웃으로부터 비슷한 도전에 직면해 있습니다. 예레반과의 동반자 관계는 양국에 상호 안보와 경제적 이익을 가져다줄 수 있습니다."
 GEO_support_armenian_monarchists: "아르메니아 군주주의자 지원"
 GEO_support_armenian_monarchists_desc: "아르메니아 군주제의 복원을 지원함으로써, 캅카스의 두 고대 기독교 왕국 사이에 강력한 왕조 동맹을 맺을 수 있습니다."
 GEO_befriend_nat_russia: "러시아와 친선"
 GEO_befriend_nat_russia_desc: "러시아는 수 세기 동안 조지아의 이웃이자 종주국이었습니다. 모스크바의 영향력에 저항하기보다 러시아 연방과의 타협과 우정이 안정과 번영으로 가는 길일지도 모릅니다."
 GEO_alliance_armeniA_NAT: "아르메니아와 동맹"
 GEO_befriend_nat_west: "미국과 친선"
 GEO_befriend_nat_west_desc: "미국은 조지아가 가입하기를 열망하는 자유 민주주의 질서를 대표합니다. 워싱턴과 보조를 맞추고 서방 통합을 추구함으로써 나토와 유럽 공동체에서의 미래를 확보합니다."
 GEO_alliance_azeri: "아제르바이잔과 동맹"
 GEO_alliance_azeri_desc: "아제르바이잔과의 공식 군사 동맹은 우리의 전략적 동반자 관계를 굳건히 하고, 러시아와 이란의 압력에 맞설 수 있는 강력한 캅카스 블록을 만들 것입니다."
 GEO_crush_both: "둘 다 분쇄"
 GEO_crush_nat_armeni: "소메히야를 집어삼키다"
 GEO_crush_nat_azeri: "아란을 삼키다"
 GEO_integrat_armen: "힌칼리를 먹이다"
 GEO_integrat_meskheti: "하차푸리를 먹이다"
 GEO_crush_northcauc: "북캅카스 점령"
 GEO_crush_northcauc_desc: "북캅카스의 민족들은 너무 오랫동안 러시아의 통치 아래 억압받아 왔습니다. 캅카스 지역의 타고난 지도자로서 조지아는 산악 형제들을 해방하고 캅카스를 하나의 깃발 아래 통합해야 합니다."
 GEO_crush_turk: "튀르키예 분쇄"
 GEO_crush_turk_desc: "수 세기 동안 오스만 제국은 조지아와 우리의 기독교 형제들을 억압했습니다. 이제 약해진 튀르키예는 취약합니다. 우리는 역사적 영토를 되찾고 과거의 불의를 되갚을 것입니다."
 GEO_make_skeletons_dance: "해골을 춤추게 하라"
 GEO_make_skeletons_dance_desc: "해골을 춤추게 하라, 너, 바로 너!"
 GEO_greater_georgia: "대조지아 선포"
 GEO_greater_georgia_desc: "대조지아를 선포하라!"
