 NKO_china_economic_assistant:0 "Ajuda Econômica Chinesa"
 NKO_china_economic_assistant_desc:0 "A assistência econômica da China à Coreia do Norte responde por cerca de metade de toda a ajuda externa chinesa. Pequim fornece a ajuda diretamente a Pyongyang, permitindo assim contornar as Nações Unidas. Durante o período de grave escassez de alimentos entre 1996 e 1998, Pequim forneceu ajuda alimentar incondicional à Coreia do Norte."
 CHI_china_economic_assistant:0 "Ajuda Econômica Chinesa"
 CHI_china_economic_assistant_desc:0 "A assistência econômica da China à Coreia do Norte responde por cerca de metade de toda a ajuda externa chinesa. Pequim fornece a ajuda diretamente a Pyongyang, permitindo assim contornar as Nações Unidas. Durante o período de grave escassez de alimentos entre 1996 e 1998, Pequim forneceu ajuda alimentar incondicional à Coreia do Norte.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se §Y[NKO.GetNameWithFlag]§! deixar de existir, não for mais governado por um governo comunista ou entrar em guerra conosco."
 NKO_rus_friend_category:0 "Aliança Russo-Norte-Coreana"
 NKO_rus_friend_category_desc:0 "A história das relações entre [NKO.GetFlag]§YCoreia§! e [SOV.GetFlag]§YRússia§! remonta a muitas décadas, desde a primeira relação com §Ya Rússia Imperial§! até a assistência da §RUnião Soviética§! durante a §Rguerra§! com [KOR.GetFlag]§YCoreia do Sul§!. Agora é a vez de §Greviver§! as antigas relações entre os países e elevá-las a um novo patamar, para não repetir os erros do passado."
