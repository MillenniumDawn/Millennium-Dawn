 SIA_no_bloc_dominant_tt: "No bloc chosen more than once. Western §Y[?SIA_pick_west|0]§!, Chinese §Y[?SIA_pick_china|0]§!, self-reliant §Y[?SIA_pick_self|0]§!"
 SIA_bamboo_east_gate_tt: "We are not both under §Y[Nat_Autocracy_L]§! or §Y[Monarchist_L]§! rule and in a faction with the §YUnited States§!."
