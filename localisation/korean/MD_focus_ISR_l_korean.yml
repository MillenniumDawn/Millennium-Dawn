 israel_news.15.t: "새로운 인티파다를 시작한 [PAL.GetName]"
 israel_news.15.d: "아리엘 샤론의 최근 성전산 방문 이후, 팔레스타인은 이스라엘에 맞서 새로운 인티파다를 시작했으며 긴장은 극한까지 치솟았습니다. 수십 명의 팔레스타인 청년들이 전국 곳곳에서 시위를 벌이고, 타이어를 태우며, 이스라엘 병사들에게 돌을 던지고 있습니다."
 israel_news.15.o1: "중동이 불타고 있다..."
 intifada_darkest_TT: "§Y우리는 인티파다에 대한 저항 조직을 시작하고 지휘 체계를 구축하려 시도할 수 있게 됩니다!§!"
 ISR_shabac_dominance: "샤박의 우세"
 ISR_8200_dominance: "8200 부대의 우세"
 ISR_tzamams: "차맘"
 israel.63.t: "요셉의 무덤의 운명"
 israel.63.d: "최근 크네세트에서 새로운 사안이 논의에 부쳐졌습니다. 종교인들이 장갑차를 타고 나블루스의 요셉의 무덤에 계속 가도록 허용해야 하겠습니까? 이는 긴장을 고조시킬 수 있지만, 요셉의 무덤 방문을 허용하지 않으면 그들이 극도로 불만을 품을 수도 있습니다."
 israel.63.a: "방문을 허용하라!"
 israel.63.b: "방문을 금지하라."
 jos_tomb_fate_tt: "우리는 §Y요셉의 무덤§! 방문을 §t금지§!하거나 §5허용§!하게 됩니다. 다만 두 선택 모두 §5장점§!과 §t단점§!이 있을 수 있습니다"
 israel.64.t: "이스라엘 호텔 유월절 학살로 19명 사망!"
 israel.64.d: "유대교 명절인 유월절이 시작된 수요일, 자폭 테러범이 인기 있는 해변 호텔에서 최소 19명을 살해하고 172명을 부상시켰습니다. 부상자 중 최소 48명은 중상으로 알려졌습니다.\n폭탄 테러는 해안 휴양지인 파크 호텔의 붐비는 식당에서 유월절의 시작을 알리는 전통 만찬 중에 발생했습니다.\n이스라엘 총리 아리엘 샤론의 고위 고문인 라아난 기신은 이번 공격을 유월절 학살이라고 규정하고, 정부가 추가 테러를 막기 위해 필요한 모든 수단을 동원할 것이라고 밝혔습니다."
 israel.64.a: "오, 맙소사!"
 israel.64.b: "자초한 일이다!"
 israel.65.t: "테러범이 이스라엘 호텔을 공격해 3명 사망!"
 israel.65.d: "최근 이스라엘 경찰은 인기 있는 해변 호텔 인근에서 자폭 테러범을 저지했습니다. 경찰은 테러범을 성공적으로 추적하여 호텔 입구 근처에서 그를 공격했습니다. 그러나 폭탄이 폭발하여 경찰관 1명과 행인 2명 등 3명이 사망했습니다.\n이스라엘 총리 아리엘 샤론의 고위 고문인 라아난 기신은 이번 공격을 학살 시도라고 규정하고, 정부가 추가 테러를 막기 위해 필요한 모든 수단을 동원할 것이라고 밝혔습니다."
 israel.65.a: "더 나빠질 수도 있었다!"
 israel.65.b: "자초한 일이다!"
 israel.66.t: "이스라엘에서 체포된 테러범들!"
 israel.66.d: "최근 이스라엘 경찰은 파크 호텔 인근에서 폭탄을 터뜨릴 계획이던, 하마스와 연계된 팔레스타인인들의 비밀 테러 조직을 적발했습니다."
 israel.66.a: "잘했다, 제군들!"
 israel.66.b: "흥미롭군."
 israel.67.t: "경찰청의 긴급 메시지!"
 israel.67.d: "경찰이 최근 사건에 대한 최신 보고서를 보내 왔습니다.\n확인해 보십시오. 놀라실 수도 있습니다."
 israel.67.a: "무슨 일이 일어났는가?!"
 outc_polsped_tt: "§Y이 사건의 결과는 전적으로 경찰 예산 지출 수준에 달려 있습니다!§!"
 pass_happened: "유월절 공격이 발생했다!"
 israel.68.t: "이스라엘의 요구!"
 israel.68.d: "이스라엘은 최근 이스라엘 내 테러 공격을 계획한 책임자들의 인도를 요구하고 있습니다. 우리가 협조하지 않으면, 그들은 우리의 동의 없이 응징 작전을 수행할 것입니다!\n주목할 점은 이번 공격의 가해자가 이스라엘에 맞선 우리의 일시적 동맹이자 동시에 정치적 경쟁자인 하마스와 팔레스타인 이슬라믹 지하드였다는 것입니다.\n협조에 동의하겠습니까?"
 israel.68.a: "우리는 협조하지 않을 것이다!"
 israel.68.b: "테러범들은 처벌받아야 한다."
 didnot_coop_isr_pas: "팔레스타인은 유월절 학살 가해자를 찾는 데 이스라엘에 협조하지 않았다."
 did_coop_isr_pas: "팔레스타인은 유월절 학살 가해자를 찾는 데 이스라엘에 협조했다."
 israel.69.t: "팔레스타인의 동의!"
 israel.69.d: "팔레스타인 지도자 [PAL.GetLeader]는 테러 공격을 규탄하고, 테러범을 찾아 처벌하는 데 우리와 협조하는 데 동의했습니다."
 israel.69.a: "놀랍도록 좋다!"
 israel.70.t: "팔레스타인의 거부!"
 israel.70.d: "팔레스타인 지도자 [PAL.GetLeader]는 테러 공격을 규탄했으나, 이를 자신들의 존립에 대한 직접적 위협으로 보고 테러범을 찾아 처벌하는 데 우리와 협조하는 데에는 동의하지 않았습니다."
 israel.70.a: "그렇다면 그들에게 더 나쁠 것이다!"
 ISR_peaceful_approach: "인도적 절차"
 ISR_neighbor_procedure: "이웃 절차"
 israel.71.t: "팔레스타인 형제들을 위한 지원!"
 israel.71.d: "팔레스타인이 시온주의 정권에 맞서 새로운 인티파다를 일으켰습니다. 우리는 가자의 항구를 통해 그곳에 무기를 보내 볼 수 있습니다. 그렇게 하겠습니까?"
 israel.71.a: "그들과 접촉하라!"
 israel.71.b: "우리의 이익에 부합하지 않는다"
 israel.75.t: "우리에게 지원을 제안하는 이란!"
 israel.75.d: "이란은 가짜 상선을 가자 항구에 들여보내 이스라엘의 코앞에서 대량의 무기를 보내겠다고 제안했습니다. 이러한 도박에 동의하겠습니까?"
 israel.75.a: "우리는 어떠한 지원도 필요하지 않다!"
 israel.75.b: "총을 달라!"
 israel.72.t: "팔레스타인의 동의!"
 israel.72.d: "팔레스타인은 우리의 수송을 받아들이는 데 동의했으며, 우리의 무기 수송품을 받기 위해 가자에 비밀 항구를 준비하고 있습니다. 그러나 이는 이미 모사드에 발각되었을 수도 있습니다..."
 israel.72.a: "우리의 지원이 무사히 도착하기를!"
 israel.74.t: "팔레스타인의 거부!"
 israel.74.d: "팔레스타인 당국은 상황을 스스로 처리할 것이며 우리의 도움은 필요하지 않다고 밝혔습니다."
 israel.74.a: "멍청이들!"
 israel.73.t: "이란발 보급선!"
 israel.73.d: "우리 모사드 요원들이 이란과 팔레스타인 당국이 무기를 해상으로 가자 지구에 직접 수송하려는 계획을 적발했습니다. 이를 저지해야 합니다."
 israel.73.a: "서둘러야 한다!"
 israel.76.t: "이란의 무기 수송 성공!"
 israel.76.d: "최근 이란 당국은 이스라엘 당국의 코앞에서 상당량의 무기를 팔레스타인으로 옮기는 데 성공했습니다. 이스라엘이 이 수송에 대한 정보를 가지고 있었는지는 알려지지 않았지만, 실패의 명백함은 의심의 여지를 남기지 않습니다."
 israel.76.a: "우리의 보물, 총들."
 israel.77.t: "이란의 무기 수송 성공!"
 israel.77.d: "최근 이란 당국은 이스라엘 당국의 코앞에서 상당량의 무기를 팔레스타인으로 옮기는 데 성공했습니다. 이스라엘이 이 수송에 대한 정보를 가지고 있었는지는 알려지지 않았지만, 실패의 명백함은 의심의 여지를 남기지 않습니다."
 israel.77.a: "감히 그런 짓을!"
 israel.78.t: "카린 A 사건!"
 israel.78.d: "우리 부대는 헤즈볼라가 관여하여 이란에서 들여온, 사거리가 긴 카추샤 로켓 345발을 포함한 무기 50톤을 실은 팔레스타인 자치정부 소유의 대형 화물선을 나포했습니다. 이 선박은 가자에서 하역될 예정이었으나 저지되었고 모든 무기가 압수되었습니다."
 israel.78.a: "잘했다!"
 israel.79.t: "이란의 무기 수송 성공!"
 israel.79.d: "우리는 이스라엘 당국의 코앞에서 상당량의 무기를 팔레스타인으로 옮기는 데 성공했습니다. 이스라엘이 이 수송에 대한 정보를 가지고 있었는지는 알려지지 않았지만, 실패의 명백함은 의심의 여지를 남기지 않습니다."
 israel.79.a: "알라후 아크바르!"
 israel.80.t: "카린 A 사건!"
 israel.80.d: "최근 이스라엘 해군 및 공군 부대가 헤즈볼라가 관여하여 이란에서 들여온, 사거리가 긴 카추샤 로켓 345발을 포함한 무기 50톤을 실은 우리의 화물선을 나포했습니다. 이 선박은 가자에서 하역될 예정이었으나 저지되었고 모든 무기가 압수되었습니다."
 israel.80.a: "감히 그런 짓을!"
 israel.81.t: "카린 A 사건!"
 israel.81.d: "최근 이스라엘 해군 및 공군 부대가 헤즈볼라가 관여하여 이란에서 들여온, 사거리가 긴 카추샤 로켓 345발을 포함한 무기 50톤을 실은 우리의 화물선을 나포했습니다. 이 선박은 가자에서 하역될 예정이었으나 저지되었고 모든 무기가 압수되었습니다."
 israel.81.a: "감히 그런 짓을!"
 operation_noahs_TT: "[ISR.GetNameWithFlag]는 §Y노아의 방주 작전§!을 수행하여 §R[PER.GetNameWithFlag]§!의 선박을 저지합니다!\n[ISR.GetNameWithFlag], [PAL.GetNameWithFlag], [PER.GetNameWithFlag]에 사건이 발생합니다!"
 ISR_catch_the_boat: "이란의 무기 수송"
 ISR_boat_aint_catched_TT: "§R이란이 팔레스타인에 상당량의 무기를 보낼 것입니다§!"
 ISR_catch_boat: "이란이 가자로 보급선을 보냈다!"
 ISR_boat_start_TT: "§R이란 선박을 저지할 시간이 52일 주어집니다!§!"
 ISR_calm_security: "팔레스타인 저항 - §7평온한 치안§!"
 ISR_calm_security_desc: "시온주의 정착민들이 1800년대 후반 팔레스타인에 처음 도착한 이래, 유대인 이민자와 팔레스타인 주민 사이의 긴장은 종종 두 공동체 간의 폭력 사태로 이어졌습니다. 이스라엘 건국 이후 팔레스타인 단체와 심지어 개인들까지 이스라엘의 이익을 겨냥한 공격을 감행해 왔으며, 이러한 현상은 오슬로 협정 체결 이후에도 지속되었습니다. 이는 서안 지구에서 이스라엘 정착촌 건설이 계속되고 있는 점, 이스라엘이 예루살렘의 통치권 공유를 거부하는 점 등을 둘러싼 팔레스타인인들의 광범위한 불만 때문입니다. 이러한 공격은 이스라엘의 불안감과 강경 정치 세력에 대한 지지를 키우는 데 기여했습니다.\n§W--------------§!\n이 국가 정신은 팔레스타인이 우리의 종속국으로 남아 있는 동안 팔레스타인의 치안 상황에 따라 매주 재평가됩니다. 우리의 중점이 상황을 진정시키면 §G개선§!되고, 불안과 팔레스타인의 적대감이 커지면 §R악화§!됩니다. 팔레스타인이 존재하지 않게 되거나 우리가 이스라틴을 수립하면 §R제거§!됩니다."
 ISR_stable_security: "팔레스타인 저항 - §6안정적인 치안§!"
