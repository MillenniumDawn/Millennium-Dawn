  # India-China attack decisions
 attack_591_from_993: "Attack Aksai Chin from Ladakh"
 attack_591_from_993_desc: "Push across the Aksai Chin plateau from Ladakh, contested ground since the Galwan clashes, to seize Aksai Chin. The operation only goes ahead once readiness is above 60 and tension reaches 80."
 attack_993_from_591: "Attack Ladakh from Aksai Chin"
