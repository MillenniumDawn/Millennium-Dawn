 GNSS1: "위성항법시스템 1965"
 GNSS1_desc: "전 지구적 위치 파악, 항법, 시간 정보를 제공하는 위성 자리의 일부로 설계된 위성입니다. 민간 및 군사 목적 모두에 매우 유용합니다.\n\n전 지구 위성항법시스템 (위성항법시스템 1965):\n§Y$GNSS1$§! 위성은 정밀도 §Y5m§!의 위성항법시스템 위성입니다. §Y위성항법시스템 5m 위성 체계§!에 필요합니다."
