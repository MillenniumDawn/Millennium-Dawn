 sov_war_wagner_disbanded_tt: "§RWagner is disbanded§!, and its instructor decisions end."
 sov_war_wagner_kept_tt: "Wagner stays under Defense Ministry control and its decisions §Gremain§!."
 SOV_western_sanctions: "Sanctions imposed against us"
 sov_final_strike.8.t: "Declaration of Military Operation"
 sov_final_strike.8.d: "This morning, the President announced the start of a special military operation in Finland, catching many by surprise. A full-scale invasion is about to begin."
 sov_final_strike.8.a: "This is going to have serious consequences"
 sov_final_strike.9.t: "Sanctions on Russia"
 sov_final_strike.9.d: "The conflict in Finland must end. An economic strike against Russia could achieve this, but it may also harm our economy. Should we prepare full-scale sanctions?"
 sov_final_strike.9.a: "Impose industrial sanctions."
 sov_final_strike.9.b: "We will not take part in this."
 sov_war.1.t: "The West Answers Crimea"
 sov_war.1.d: "Brussels and Washington freeze assets and ban travel for officials in our circle. Capital starts leaving Moscow and Western lenders go quiet. We can answer with a food embargo and local substitution, or work our contacts in European boardrooms for exemptions."
 sov_war.1.a: "Ban their food imports."
 sov_war.1.b: "Lobby for exemptions."
 sov_war.2.t: "What Syria Is For"
 sov_war.2.d: "Khmeimim is ours and the campaign has turned the war around for Damascus. Ankara, Tehran and Washington all want to talk to the people who control the sky. We choose what the base buys us."
 sov_war.2.a: "Show off the Aerospace Forces."
 sov_war.2.b: "Build the Astana format."
 sov_war.2.c: "Sell arms and bid for reconstruction."
 sov_war.3.t: "The March of Justice"
 sov_war.3.d: "On 23 June 2023 Yevgeny Prigozhin took Rostov-on-Don without a fight and sent a column up the M-4 toward Moscow. The army has little appetite to stop men it fought beside. The President has hours to choose between a deal, a fight and a payoff."
 sov_war.3.a: "Let Lukashenko broker an exile."
 sov_war.3.b: "Crush the column."
 sov_war.3.c: "Pay Wagner and fold it into the Defense Ministry."
 sov_war.4.t: "Talks on the War"
 sov_war.4.d: "Delegations meet in Istanbul. The map on the table matches the front, and the other side has its own list of demands. We can sign an armistice on the current line or insist on all four regions."
 sov_war.4.a: "Sign the armistice."
 sov_war.4.b: "Demand all four regions."
 sov_war.5.t: "A Gas Contract from Moscow"
 sov_war.5.d: "Gazprom offers Naftogaz a ten-year contract with a fixed discount and guaranteed transit. It would end the winter cut-offs and bind our economy to theirs. After this, Moscow's word will count in every energy decision we make."
 sov_war.5.a: "Sign the contract."
 sov_war.5.b: "Buy European gas instead."
 sov_war.6.t: "A Customs Union Offer"
 sov_war.6.d: "Moscow asks us to join the Eurasian customs space instead of the EU association agreement. Factories in Kharkiv and Dnipro would get Russian orders, and Brussels would lose a market it counted on. Voters in the west of the country will remember who signed."
 sov_war.6.a: "Join the customs union."
 sov_war.6.b: "Hold to the EU track."

