 nsb_artillery_ammo_1: "Munitions d'artillerie de 1ère génération"
 nsb_artillery_ammo_1_desc: "Munitions spécialisées conçues pour être utilisées dans des armes de gros calibre telles que les obusiers, les canons de campagne et l'artillerie automotrice. Elles sont de différents types, chacun adapté à des rôles spécifiques sur le champ de bataille, notamment les munitions à forte explosion pour un impact destructeur, les obus perforants pour pénétrer les cibles fortifiées et les munitions fumigènes ou d'éclairage pour le soutien tactique."
 nsb_artillery_ammo_2: "Munitions d'artillerie de 2ème génération"
