l_russian:
 STALKER.100.t: "Иди отсюда, сталкер"
 STALKER.100.d: "На блокпосту на Кордоне сняли срочника, который кричит сталкеру, чтобы тот шёл отсюда. Ролик разошёлся повсюду, и теперь полстраны говорит это друг другу на остановках."
 STALKER.100.a: "Поместить это на агитационные плакаты."
 STALKER.100.b: "Напомнить блокпосту: меньше кричать, больше патрулировать."
 STALKER.100.b_tt: "Зона получает §G2§! к §Yсдерживанию§!."
 STALKER.101.t: "Чики-брики"
 STALKER.101.d: "Бандиты на Кордоне взяли на вооружение боевой клич, который никто не может перевести, и народную песню, которая ни у кого не выходит из головы. Приток новобранцев растёт."
 STALKER.101.a: "И в дамки."
 STALKER.101.a_tt: "Влияние §Yбандитов§! в Зоне уже выросло на §R5§!."
 STALKER.102.t: "Ещё один Стрелок"
 STALKER.102.d: "Один сталкер в баре объявил себя легендарным Стрелком. Он уже третий за месяц. Любопытные приходят посмотреть, кто из них настоящий."
 STALKER.102.a: "Сколько вообще этих Стрелков?"
 STALKER.102.a_tt: "В Зоне уже прибавилось §Y5§! сталкеров."
 STALKER.103.t: "Торговец поднимает цены"
 STALKER.103.d: "Старый торговец из бункера на Кордоне удвоил цены для наших учёных на колбасу, водку и антирад и уверяет, что теряет деньги на каждой сделке."
 STALKER.103.a: "Заплатить. Хорошей водки больше ни у кого нет."
 STALKER.103.a_tt: "Казна теряет §R$0.1§! млрд."
 STALKER.103.b: "Закрыть бункер."
 STALKER.103.b_tt: "Зона теряет до §G5§! влияния §Yбандитов§! и до §R5§! сталкеров, которые от него зависели."
 STALKER.105.t: "Привет от Элис"
 STALKER.105.d: "Изыскательская группа на дюнах озера Мунго откопала из песка телефон и ожерелье, закопанные задолго до появления Зоны и каким-то образом всё ещё заряженные. На последнем видео, снятом ночью на высохшем дне озера девочкой-подростком, из темноты к ней идёт фигура; после обработки видно, что у неё лицо самой девочки, серое и утопленное. Телефон принадлежал девочке по имени Элис, журнал звонков обрывается в 2008 году, а на экране висит одно неотправленное сообщение: «привет»."
 STALKER.105.a: "Сохранить запись в деле. Продолжать слушать."
 STALKER.105.a_tt: "Без затрат. Дело остаётся открытым, и она попробует снова."
 STALKER.105.b: "Разрешить контролируемый контакт."
 STALKER.105.b_tt: "Стоит §R25§! политической власти. §YЭксплуатация§! Зоны растёт на §G5§!, а §Yактивность§! — на §R5§!. Она это запомнит."
 STALKER.105.c: "Закрыть дюны для изыскательских групп."
 STALKER.105.c_tt: "§YСдерживание§! Зоны растёт на §G5§!, а §Yэксплуатация§! падает на §R3§!. Это она тоже запомнит."
 STALKER.106.t: "Кто-то всё ещё хочет поздороваться"
 STALKER.106.d_observed: "Прошлой ночью телефон в нашем хранилище вещдоков зазвонил, и определитель показал его собственный номер. Дежурный аналитик говорит, что девочка спросила, слушает ли ещё кто-нибудь. Когда он ответил «да», она, кажется, обрадовалась."
 STALKER.106.d_contact: "После контролируемого контакта изыскательские группы то и дело находят свежие следы, которые ведут на высохшее озеро и обрываются. Прошлой ночью телефон записал новое видео: Элис стоит на краю освещённого периметра и машет в камеру."
 STALKER.106.d_restricted: "Дюны закрыты уже несколько месяцев, но телефона больше нет в хранилище вещдоков. Патруль нашёл его снова на дюнах, экраном вверх и с включённой записью. В нём одно новое сообщение: она просто хотела поздороваться."
 STALKER.106.a: "Поздороваться в ответ."
 STALKER.106.a_tt: "§YЭксплуатация§! Зоны растёт на §G5§!, а §Yактивность§! — на §R5§!."
 STALKER.106.b: "Закрыть дело навсегда."
 STALKER.106.b_tt: "§YСдерживание§! Зоны растёт на §G5§!, а §Yактивность§! падает на §G5§!."