 ITA_extra_church_support: "추가 교회 지원"
 ITA_extra_church_support_desc: "추가 자금 덕분에 교회는 더욱 널리 퍼진 자선 활동을 조직할 수 있으며, 이는 독실한 국민의 여론에 매우 좋은 영향을 줍니다."
 list_of_authoritarian_right_wing_parties_TT: "권위주의 우익 정당 목록: \n 서방 독재자 (전문가 제외) \n [Conservative_L] \n [Autocracy_L] \n [Neutral_Autocracy_L] \n [oligarchism_L] \n [Nat_Populism_L] \n [Nat_Fascism_L] \n [Nat_Autocracy_L] \n [Monarchist_L] \n"
