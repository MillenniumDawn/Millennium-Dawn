 brazil_flavour_events.15.t: "PRONA, 공화당에 합병"
 brazil_flavour_events.15.d: "국가질서재건당은 자유당과 합병하여 새로운 공화당을 만들기로 의결했습니다. 이 합당은 창립자의 민족주의 십자군 정신을 포기하는 대신 더 큰 중도 조직의 지분과 그 공적 자금을 얻는 것입니다. PRONA에 표를 보태 주던 통합주의 운동은 이제 극우에서 홀로 서게 되었습니다."
 brazil_flavour_events.15.a: "옛 질서가 저문다"
 brazil_flavour_events.16.t: "PMDB, MDB로 개칭"
 brazil_flavour_events.16.d: "브라질민주운동당은 임시 전당대회에서 당명에서 '당(Party)'이라는 단어를 빼고 간단히 브라질민주운동(MDB)이 되기로 의결했습니다. 지도부는 이 변화를 수년간의 부패 스캔들 이후 야당 시절 출범기의 위상으로 돌아가는 것이라고 설명합니다. 당 조직과 시장, 상원의원들은 그대로 그 자리에 남아 있습니다."
 brazil_flavour_events.16.a: "새 이름, 같은 센트랑"
 brazil_flavour_events.17.t: "PPS, 시다다니아로 개칭"
 brazil_flavour_events.17.d: "고등선거재판소는 인민사회당이 스스로를 시다다니아(Cidadania)로 개칭하겠다는 요청을 승인했습니다. 당은 사회주의자라는 말이 사회자유주의적이고 친민주주의적인 중도 정당을 더 이상 설명하지 못한다고 말하며, 새 이름은 공산주의 기원에서 멀어져 온 오랜 여정의 끝을 알립니다. 당의 의원단과 동맹 관계는 그대로입니다."
 brazil_flavour_events.17.a: "사회주의가 아니라 시민권"
 brazil_flavour_events.18.t: "PHS, 포데모스에 흡수"
 brazil_flavour_events.18.d: "고등선거재판소는 연대인본당의 포데모스(Podemos) 편입을 승인했습니다. 이 소규모 기독교민주 정당은 새로운 실적 요건을 단독으로 충족하지 못했으며, 자신들의 의석과 당원, 정당 기금 지분을 더 큰 중도우파 정당에 넘깁니다. 포데모스는 의원단을 얻고, 인본주의자들은 자리를 유지합니다."
 brazil_flavour_events.18.a: "정당이 하나 줄었다"
 brazil_flavour_events.19.t: "민주당과 PSL, 브라질연합 결성"
 brazil_flavour_events.19.d: "고등선거재판소는 민주당과 사회자유당이 새로운 정당 브라질연합(União Brasil)으로 합당하는 것을 승인했습니다. 이 연합은 민주당의 오랜 중도우파와 민족주의 우파를 대통령직으로 이끈 정당을 결합한 것으로, 의회 최대 의원단과 정당 기금의 가장 큰 몫을 가지고 출범합니다. 민족주의 진영은 이미 자유당으로 옮겨 갔습니다."
 brazil_flavour_events.19.a: "우파의 새로운 거인"
 BRA_internationalize_the_real: "헤알화의 국제화"
 BRA_internationalize_the_real_desc: "헤알화는 브라질이 수년간의 걷잡을 수 없는 인플레이션을 뒤로하는 데 도움이 되었지만, 우리의 파트너들은 여전히 외환 보유고를 달러에 의존합니다. 우리 경제는 또 다른 선택지를 제공할 만큼 강합니다. 헤알화를 국경 밖으로 내보내 다른 나라들이 이를 보유할 이유를 만들어 줍시다."
 BRA_idea_trucker_strike: "트럭 운전사 파업"