 REGIMENTAL_SUPPORT_HEADER: "Battalion Support"
 DESIGNER_REGIMENTAL_SUPPORT_COLUMN_TITLE: "Battalion Support Platoons and Sections. These are support and combat troops attached directly at the battalion level.\n\nBattalion Support Platoons and Sections §Rdo§! affect the §YMax Speed§! of the Brigade but they §Gdo not increase§! §YCombat Width§! (§Rexcept§! Naval Landing Detachment)."
 DESIGNER_SUPPORT_COLUMN_TITLE: "Brigade Support Companies and smaller size units. These are support troops that are kept behind the frontline troops and help out.\n\nYou can only select §Rone§! of each type.\n\nCompanies and smaller size units §Rdo§! affect the §YMax Speed§! of the Brigade and §Rincrease§! its §YCombat Width§! (§Rexcept§! Pathfinder Platoon)."
 DESIGNER_SELECT_NICHE_DELAYED: "Here you can classify your designs to organize them and allow for more specific reinforcement of your brigades."
 DESIGNER_COMPOSITION_DELAYED: "The composition of a brigade controls which bonuses are applied from advisors and commanders."
 DESIGNER_COMBATWIDTH_TOOLTIP: "Combat Width: §Y$VALUE|0$§!\n\nCombat Width tells you how much room this brigade will take up in combat.\nFor example if a combat has a total width of §Y80§! you can fit §Y4§! brigades with width of §Y20§!"
 DESIGNER_COMBATWIDTH_DESC: "Combat Width tells you how much room this brigade will take up in combat.\nFor example if a combat has a total width of §Y80§! you can fit §Y4§! brigades with width of §Y20§!"
 DIVISION_PRODUCTION_RESOURCE_DESC: "The §HResources§! used in the production of the equipment needed by a brigade of this template."
 DIVISION_PRODUCTION_COST_DESC: "The §HIndustrial Capacity§! cost to produce the equipment needed by a brigade of this template."
 DIVISION_NAMES_GROUP_DESC: "§HHistorical unit names group.§!\nAll brigades of this template, will use the names from this pool. If you change the group right now, all units of this current template will be renamed, except those you have named yourself."
 DESIGNER_DIVISIONAL_COMPOSITION: "Brigade Composition"
 DESIGNER_MANPOWER_DESC: "How much Manpower is required to fill up this brigade."
 DESIGNER_TRAINING_TIME_DESC: "How long it takes to train the brigade."
