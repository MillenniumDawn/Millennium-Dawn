l_polish:
 libya_oil_nationalisation: "Nacjonalizacja ropy naftowej"
 libya_oil_nationalisation_desc: "\n£LBA_desctext_oil_nationalisation \n\n\n\nLibia ma największe w Afryce i dziesiąte na świecie złoża ropy naftowej. Libijski przemysł naftowy jest tak ważny, że stanowi 95% wszystkich gałęzi przemysłu w kraju. Zasoby ropy naftowej w Libii są atrakcyjnym celem inwestycyjnym, ponieważ koszty produkcji są niskie, ropa ma niską zawartość siarki, a Libia jest bardzo blisko rynku europejskiego. Jednak w wyniku sankcji, problemów z zagranicznymi firmami naftowymi i ścisłej kontroli państwa nad polami naftowymi, Libia osiągnęła stan, w którym ledwo ma zasoby, aby utrzymać swoją obecną produkcję. Każdy dalszy wzrost produkcji ropy naftowej wymagałby znacznych inwestycji, zarówno z zagranicy, jak i z kraju.\n\nObecny poziom nacjonalizacji: §Y[?lba_oil_nationalisation|%0]§!"
 libya_nationalise_oil_fields: "Upaństwowić pola naftowe"
 libya_nationalise_oil_fields_desc: "Możemy znacjonalizować niektóre z prywatnych pól naftowych w Libii. Będzie nas to kosztowało sporo pieniędzy, ale uczyni naszą produkcję ropy bardziej niezależną"
 libya_sell_oil_fields: "Sprzedaj krajowe pola naftowe"
 libya_sell_oil_fields_desc: "Możemy sprzedać część pól naftowych zarządzanych przez National Oil Corporation zagranicznym firmom. Możemy szybko zarobić, ale to sprawi, że nasz sektor energetyczny będzie bardziej zależny od innych krajów"
 libya_develop_oil_field_cost_bad_tt: "The base cost of developing an oil field in el-Sharara is §Y$3 billion§!. This is increased by [?lba_oil_nationalisation|%0R] because of our §YLevel of Nationalisation§!"
 libya_develop_oil_field_cost_tt: "Podstawowy koszt rozwoju pola naftowego w Waha wynosi §Y8 miliardów dolarów§! . Kwota ta wzrasta ze [?lba_oil_nationalisation|%0R] względu na §Ypoziom nacjonalizacji§!"
 libya_develop_el_sahara_fields: "Rozwijanie pól naftowych El-Sharara"
 libya_develop_el_sahara_fields_desc: "The el-Sharara oil fields are located in the Wadi al Hayaa district in Southern Libya. It is a minor oil field on the scale of Libya but still an important one. The oil refined here is processed and stored in §YMellitah and az-Zawiyah near Tripoli§!. With increased effort, we can expand the production in el-Sharara.\n\nIn order to expand our existing oil fields, we need to prepare facilities to store the oil and find efficient methods for extracting the oil.\n\n§YResource output updates daily. Wait one day after construction finishes for the new oil yield to appear.§!"
 libya_develop_west_waha_fields: "Rozwijanie zachodnich pól naftowych Waha"
 libya_develop_west_waha_fields_desc: "The Waha oil fields in the Sirte Basin produce 90% of Libyan oil, making it the most valuable region in the country. The extracted oil from the Western Waha fields is sent to §YSirte and Lanuf§! for refining and storage. With increased effort, we can expand the production in Western Waha.\n\nIn order to expand our existing oil fields, we need to prepare facilities to store the oil and find efficient methods for extracting the oil."
 libya_develop_east_waha_fields: "Rozwijanie pól naftowych Eastern Waha"
 libya_develop_east_waha_fields_desc: "The Waha oil fields in the Sirte Basin produce 90% of Libyan oil, making it the most valuable region in the country. The extracted oil from the Eastern Waha fields is sent to §YBrega and Ajdabiya§! for refining and storage. With increased effort, we can expand the production in Eastern Waha.\n\nIn order to expand our existing oil fields, we need to prepare facilities to store the oil and find efficient methods for extracting the oil."
 libya_dig_wadi_ash_shati: "Wykop rudę żelaza w Wadi Ash-Shati'"
 libya_dig_wadi_ash_shati_desc: "Krążą pogłoski, że dolina Wadi Ash-Shati' w pobliżu Sabha zawiera największe na świecie złoża rudy żelaza. Znaleźliśmy niewiele, ale kto wie, co kryje pustynny piasek? Musimy zbadać ten obszar, aby znaleźć to żelazo."
 libya_dig_wadi_ash_shati_capacity: "Istnieje potencjał dla nowych kopalni żelaza (obecnie: [?wadi_ash_shati_current] z 60)"
 libya_dig_wadi_ash_shati_tt: "§Prawdopodobieństwo§! trafienie do źródła macierzystego zależy od naszych §YWykopów§! technologia. Szansa wzrasta o §G2,5%§! na poziom."
 libya_gaddafi_family: "Rodzina Kaddafich"
 libya_gaddafi_family_desc: "Muammar Gaddafi, along with his children, holds considerable power in Libya. They all have their own interests and goals. Gaddafi himself is a very eccentric man. Known for his publicity stunts and direct language, many of his behaviours are strange and odd on the international forum. While Gaddafi's methods can be advantageous, it is possible that the Libyan people grow tired of his antics. It is important to keep the instability of the Gaddafi family at a manageable level to secure the stability of the state.\n\nCurrent §YInstability§!: [?gaddafi_family_instability] ([?gaddafi_family_instability_decay|-]/month), Effect: [?gaddafi_family_stability_effect|+%] §YStability§!. If the §YStability§! of [ROOT.GetName] is below §Y15%§!, the people will start protesting against Gaddafi!\n\nEach of Gaddafi's children will affect §YInstability§! by §G-0.25§!/month and their traits will be active unless they are §YExiled§! or §YDead§!.\n\nYou can access §Ydecisions§! related to a character by clicking their portrait."
 libya_gaddafi_family_modify_instability_tt: "Niestabilność: [?family_instability_change|=-0]"
 gaddafi_family_sent_to_exile_tt: "zostaje wysłany na §YExile§!"
