 SAU_succession_panel_dormant: "Le trône est occupé et la succession n'est pas en contestation. Si elle se rouvre, les princes et leurs factions seront exposés ici.[ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
 SAU_succession_panel_named: "Le prince héritier a été nommé : §H[ROOT.GetSAUCrownPrinceName]§!. Le concours est clos et l'arrangement tiendra exactement aussi longtemps que le roi.\n\n§YLa santé du roi :§! §H[ROOT.GetSAUKingHealth]§![ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
 SAU_succession_panel_race1: "Le roi Fahd est mort et le roi Abdallah règne désormais, mais il est lui aussi âgé et la succession n'est pas tranchée. Trois princes rivalisent pour être nommés héritier : Salmane ben Abdelaziz, porte-étendard de l'establishment soudairite ; Mohammed ben Nayef, maître des services de sécurité ; et Moutaïb ben Abdallah, commandant de la Garde nationale.\n\nSoutenez un prince et rassemblez la famille et l'État derrière lui tout en sapant ses rivaux. Chaque faction intrigue aussi pour elle-même, si bien que l'équilibre d'influence bascule chaque mois. Quand le roi Abdallah meurt, le prince détenant la plus grande part d'influence monte sur le trône.\n\n§YSalmane ben Abdelaziz :§! [?SAU_salman_share|0] %\n§YMohammed ben Nayef :§! [?SAU_mbn_share|0] %\n§YMoutaïb ben Abdallah :§! [?SAU_mutaib_share|0] %\n\n§YHéritier apparent, si Abdallah mourait aujourd'hui :§! §H[ROOT.GetSAUCrownFrontrunner]§![ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
 SAU_succession_panel_race2: "Le roi Salmane règne, et le concours s'est réduit à deux hommes et un titre. Mohammed ben Nayef détient le ministère de l'Intérieur, le dossier contre-terroriste et la confiance de Washington. Mohammed ben Salmane détient l'économie, le portefeuille de la défense et l'oreille de son père, ce qui dans cette famille a toujours plus compté.\n\nSoutenez l'un et rassemblez l'État derrière lui tout en sapant l'autre. Quiconque détient la plus grande part lorsque le roi nomme son héritier — ou lorsqu'il meurt sans en nommer — prend le trône après lui.\n\n§YMohammed ben Salmane :§! [?SAU_heir_mbs_share|0] %\n\n§YHéritier apparent aujourd'hui :§! §H[ROOT.GetSAUHeirFrontrunner]§!\n§YLa santé du roi :§! §H[ROOT.GetSAUKingHealth]§![ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
