 nsb_atgm_tech_5_desc: "대전차 유도 미사일(ATGM) 포드는 헬리콥터에 장착되는 외부 체계로, 장갑 차량, 방어 시설, 기타 지상 표적을 고도의 정밀도로 교전하고 파괴하도록 설계된 유도 미사일을 운용할 수 있게 합니다. 이 포드는 헬리콥터의 공격 능력을 크게 높여, 다양한 전투 상황에서 효과적인 교전을 가능하게 합니다."
 nsb_multiple_atgm_tech_1: "1세대 4연장 ATGM 거치대"
 nsb_multiple_atgm_tech_1_desc: "4연장 ATGM(대전차 유도 미사일) 포드는 즉시 발사 가능한 미사일 네 발을 갖춘 발사 체계로, 여러 장갑 표적을 연달아 신속히 교전할 수 있는 플랫폼의 능력을 높여 줍니다. 이러한 구성은 장갑차와 보병 전투차를 비롯한 다양한 군용 차량에 흔히 통합되어 대장갑 전투 효율을 강화합니다."
