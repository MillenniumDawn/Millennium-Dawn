 adf_acq_astuirement_program: "Programme d'acquisition de l'ADF"
 the_white_paper: "Le livre blanc de 2000"
 the_white_paper_desc: "The Defense 2000 paper was made as a comprehensive review of our current military capabilities, and those that current administration demands. With more weight on the strength of Australia as a major supplier of security and peacekeeping in the Pacific, the demands have predominantly been to expand our arsenal and innovate our methods in the field."
 the_second_white_paper_1: "Le 2e livre blanc"
 the_second_white_paper_1_desc: "Following up on the success of the first paper, the ADF has been charged with undertaking a series of more expansive programs and restructuring to continue to meet the demands of Pacific defense."
 ast_we_are_many_tt: "L'§Gavenir§! démographique de notre nation est entre nos mains."
 sol_islands_intervention: "Mission d'assistance régionale aux îles Salomon"
 sol_islands_intervention_desc: "La situation dans le pays en ce moment est certainement moins qu'idéale. Le banditisme et les combats militants sont monnaie courante, les services publics se sont effondrés, et la police restante s'est fractionnée entre les groupes belligérants. Si nous voulons rétablir l'ordre dans les îles, un effort majeur de stabilité et de reconstruction doit avoir lieu, et bientôt."
 sol_situation_countdown: "La situation se détériore..."
 organise_occupation_force: "Organiser la force d'occupation"
 organise_occupation_force_desc: "Une force d'occupation devra être créée avant de lancer toute opération majeure. Actuellement, un certain nombre d'autres nations ont promis leur soutien, mais l'essentiel de la force devra être le nôtre. Deux mille soldats et environ deux cents personnels formés au maintien de la paix serviront de forces de l'ordre sur l'île."
 operation_anode: "Opération Anode"
 operation_anode_desc: "Notre offensive majeure sur les îles sera menée en plusieurs étapes, en partie par voie maritime et en partie par voie aérienne dans nos Chinooks. Le premier objectif sera de prendre un certain nombre de positions clés sur l'île pour servir de hubs logistiques et d'opérations avancées. Ensuite, nous pourrons lancer les travaux de reconstruction. Nous l'appelons 'Opération Helpem Fren' pour une bonne image, ce qui dans leur langue locale Pidgin signifie 'aider un ami'."
 secure_honiara: "Sécuriser Honiara"
 secure_weather_coast: "Sécuriser la côte Weather"
 secure_rural_guadalcanal: "Sécuriser la région rurale de Tambea"
 secure_malaita_province: "Sécuriser la province de Malaita"
 sol_disarm_the_militias: "Désarmer les milices"
 sol_red_cross: "Coordonner avec la Croix-Rouge"
 sol_red_cross_desc: "La Croix-Rouge a déjà une présence significative sur l'île. Se coordonner avec elle pourrait permettre à nos équipes de soigner et d'évacuer les civils en danger."
 negotiate_with_the_militias: "Négocier avec les militants"
 negotiate_with_the_militias_desc: "Négocier avec des militants armés n'est guère une mission de stabilisation, mais si nous approchons les plus raisonnables pour organiser des cessez-le-feu, cela pourrait nous acheter plus de temps."
 disband_the_local_police: "Dissoudre la police locale"
 disband_the_local_police_desc: "La force de police locale sur les îles est devenue un repaire de corruption et de factionnalisme au point qu'elle ne sert plus le peuple. Nous devrons démanteler la structure actuelle des forces de l'ordre si nous voulons réparer quoi que ce soit."
 rebuild_the_local_policeforce: "Reconstruire la force de police locale"
 rebuild_the_local_policeforce_desc: "Si nous voulons reconstruire les forces de l'ordre dans le pays, nous devrons créer un conseil multinational de commissaires pour commencer à vérifier et à instruire les nouvelles recrues d'officiers, et appliquer des sauvegardes pour que les choses continuent de fonctionner à l'avenir."
 run_anticorruption_campaign: "Mener une campagne anticorruption"
 run_anticorruption_campaign_desc: "Actuellement, le paysage politique dans la nation fonctionne à peine, sans parler d'une maison de corruption effondrée. Peu de ceux qui restent au gouvernement sont sans tâche. Une répression nationale des pratiques illégales devra être lancée, et ensuite nous pourrons envisager la mise en place des nouvelles fondations."
 recruit_public_servants: "Recruter des fonctionnaires"
 recruit_public_servants_desc: "Faisant suite à nos efforts pour nettoyer les lieux, des fonctionnaires des nations participantes internationales seront embauchés pour servir dans le nouveau gouvernement pour l'instant, tandis que des plans sont élaborés pour les remplacer éventuellement par des locaux. Cette expertise extérieure aidera le gouvernement dans sa reconstruction rapide."
 reorganise_the_army: "Réorganiser l'armée"
 reorganise_the_army_desc: "The country hasn't had an effective standing military since its independence in 1978. What little it did have included a maritime surveillance unit and a few troops handed over from the defunct police force. While our peacekeepers will take the role of a standing army, we can begin training local units to take the pressure off us and assist operations."
 loans_to_the_new_government: "Prêts au nouveau gouvernement"
 loans_to_the_new_government_desc: "Alors que nous développons encore un nouveau système de gouvernance pour les îles Salomon, leur dette internationale est toujours considérablement impayée. Ils auront aussi besoin d'un prêt ou deux pour payer le nouveau personnel."
 send_our_reconstruction_teams: "Envoyer nos équipes de reconstruction"
 send_our_reconstruction_teams_desc: "L'état des choses s'est suffisamment amélioré pour que nous puissions envoyer nos équipes de reconstruction en toute sécurité pour aider à la reconstruction et à la construction de services publics."
 sol_intervention: "Intervention aux îles Salomon en cours"
 sol_intervention_success: "L'intervention a été un succès."
 the_financial_crisis_ast: "La crise financière"
 the_financial_crisis_ast_desc: "Alimentée par les prêts prédateurs pour les prêts hypothécaires à risque et un manque de régulation, la plus grande bulle immobilière de l'histoire des États-Unis a éclaté, et le reste du monde se retrouve avec sa propre part du fardeau."
 tfc_fixing_tt: "§HL'économie s'améliorera.§!"
 tfc_fixing_2_tt: "Plus de §2décisions§! seront disponibles dans l'onglet Décisions politiques pour lutter contre la crise."
