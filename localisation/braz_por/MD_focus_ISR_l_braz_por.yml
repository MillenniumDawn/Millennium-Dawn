 israel.110.t: "[HAM.GetNameWithFlag] captura 3 israelenses!"
 israel.110.d: "Recentemente, [HAM.GetNameWithFlag] capturou três cidadãos israelenses. Precisamos tentar resgatá-los e vingá-los!"
 israel.110.a: "Iniciar a Operação Guardião do Irmão."
 israel.110.b: "Não podemos fazer nada."
 israel.111.t: "[ISR.GetNameWithFlag] tem sucesso nos confrontos recentes!"
