 KOR_develop_vietnam: "Desarrollar operaciones en Vietnam"
 KOR_develop_vietnam_desc: "Las instalaciones de POSCO en Vietnam se convertirán en un centro de fabricación para el sudeste asiático."
 KOR_argentina_facility: "Instalación de POSCO Argentina"
