 nsb_defense_tech_1: "Suite IRCM"
 nsb_defense_tech_1_desc: "Un système de contre-mesures infrarouge de base conçu pour brouiller les têtes chercheuses de missiles à recherche de chaleur. Utilise un brouilleur IR rotatif pour émettre de faux signaux et réduire la précision de verrouillage des missiles. Efficace contre les MANPADS de première génération mais limité contre les menaces modernes."
 nsb_defense_tech_2: "MAWS"
 nsb_defense_tech_2_desc: "Système d'alerte d'approche de missile (MAWS). Un système de capteurs qui détecte les lancements de missiles entrants à l'aide d'un suivi ultraviolet ou infrarouge. Déclenche automatiquement le déploiement de contre-mesures telles que des fusées éclairantes ou des paillettes. Fournit une connaissance de la situation passive contre les menaces de missiles guidés."
 nsb_defense_tech_3: "MAWS et DIRCM avancés"
 nsb_defense_tech_3_desc: "Une suite de défense antimissile moderne qui associe l'alerte de missile à une contre-mesure infrarouge directionnelle. Utilise un laser monté sur tourelle pour suivre et brouiller les missiles guidés par infrarouge entrants. Améliore considérablement la survivabilité contre les MANPADS avancés et les menaces tirées à l'épaule."
 nsb_light_nose_gun_tech_1: "Canons montés sur le nez de première génération"
 nsb_light_nose_gun_tech_1_desc: "Canons montés sur le nez, conçus pour donner à l'hélicoptère un système d'arme à tir direct."
 nsb_light_nose_gun_tech_2: "Canons montés sur le nez modernes"
 nsb_light_nose_gun_tech_2_desc: "Canons montés sur le nez, conçus pour donner à l'hélicoptère un système d'arme à tir direct."
 nsb_light_nose_gun_tech_3: "Future Nose Mounted Guns"
 nsb_light_nose_gun_tech_3_desc: "Canons montés sur le nez, conçus pour donner à l'hélicoptère un système d'arme à tir direct."
 nsb_gun_pods_tech_1: "Nacelles de mitrailleuses de 1ère génération"
 nsb_gun_pods_tech_1_desc: "Systèmes d'armes montés à l'extérieur conçus pour améliorer les capacités offensives des aéronefs à voilure tournante. Ces nacelles permettent aux hélicoptères de transporter un armement supplémentaire sans modifications significatives de leur cellule, offrant une flexibilité et une puissance de feu accrue pour diverses missions."
