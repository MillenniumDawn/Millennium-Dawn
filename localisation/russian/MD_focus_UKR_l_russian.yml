 UKR_storage_section_bombers: "Дальние бомбардировщики"
 UKR_storage_section_bombers_count: "§Y[?UKR_storage_total_5|0]§!"
 UKR_storage_section_bombers_tt: "§YДальние бомбардировщики:§! §Y[?UKR_storage_total_5|0]§!\n\nВозможные модели: Ту-16, Ту-22.\n\nСейчас на хранении:[UKR_storage_line_tu16][UKR_storage_line_tu22]\n\nНажмите, чтобы показать или скрыть этот раздел."
 UKR_storage_line_tu16_text: "\n• Ту-16: §Y[?UKR_storage_tu16_total|0]§!"
 UKR_storage_item_tu16: "Ту-16"
 UKR_storage_item_tu16_count: "§Y[?UKR_storage_tu16_total|0]§!"
 UKR_storage_item_tu16_icon: "GFX_CHI_AIR_H_6"
 UKR_storage_item_tu16_tt: "§YТу-16§!\n\n\n£CHI_AIR_H_6\n\n\n\nНа хранении: §Y[?UKR_storage_tu16_total|0]§!\nПоколение: реактивный бомбардировщик первого поколения, на вооружении с 1954 года.\nТип техники: §YСтратегический бомбардировщик 3-го поколения§!\n\nВарианты на хранении:\n• Ту-16К: §Y[?ukraine_has_tu16k_stockpile|0]§!\n• Ту-16Р: §Y[?ukraine_has_tu16r_stockpile|0]§!\n\nСредний бомбардировщик §Rсоветской§! дальней авиации. §YТу-16К§! несёт противокорабельные ракеты, §YТу-16Р§! — дальний разведчик. Наши сняты с лётного дежурства в 1993 году."
