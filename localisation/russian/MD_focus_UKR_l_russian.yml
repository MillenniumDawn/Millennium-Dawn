 UKR_develop_2s22: "Разработка САУ §Y2С22 «Богдана»§!"
 UKR_develop_2s22_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_2s22_for_tooltip\n\n\n\n\n\n\n\n\n§W2С22 «Богдана» — украинская 155-мм самоходная гаубица, разработанная Краматорским заводом тяжёлого станкостроения, чтобы дать Вооружённым силам Украины современную артиллерию стандарта НАТО.\nСистема установлена на колёсное шасси, что обеспечивает высокую оперативную подвижность и позволяет быстро менять огневую позицию после стрельбы.\n155-мм орудие может использовать стандартные артиллерийские боеприпасы НАТО, что значительно увеличивает дальность и огневую мощь украинской артиллерии.\nАвтоматизированные системы управления огнём и навигации позволяют расчёту быстро готовить исходные данные и точнее поражать цели.\nРазработка «Богданы» — важный шаг в модернизации украинской артиллерии и переходе на системы вооружения стандарта НАТО.\n\n§GОсобо важный военный проект:§! после его завершения §YВерховная Рада§! будет охотнее одобрять увеличение военного бюджета.§!"
 UKR_modernize_su25_m1: "Модернизация ударного самолета §YSu-25§!"
 UKR_modernize_su27_1m: "Модернизация истребителя §YСу-27§!"
 UKR_modernize_mig29_mu2: "Дальнейшая модернизация истребителя §YМиГ-29МУ2§!"
