 IS_sec_con_button_text: "§YConseil de sécurité§!"
 IS_sec_con_button_text_tt: "Ouvre l'écran du §YConseil de sécurité§!. L'§BOrganisation des Nations unies§! peut y §Rimposer des sanctions§!, §Rautoriser la force militaire§! et §Gtenter une résolution de conflit§!"
