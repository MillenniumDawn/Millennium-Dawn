 PMR_SHERIFF: "Luchando contra el \"sheriff\""
 PMR_SHERIFF_DESC: "Transnistria se centrará en la lucha contra la influencia de la Corporación \"Sheriff\"."
 POL_AI_BEHAVIOR_MD: "@POL Polonia"
 POL_HISTORICAL: "Predeterminado"
 POL_HISTORICAL_DESC: "Polonia seguirá por el camino democrático y tratará de unirse a la UE. El partido dominante será el PO, con una política antirrusa."
 POL_COMMUNISM: "Sueño rojo"
 POL_COMMUNISM_DESC: "Polonia volverá a ser comunista y comenzará a difundir la Revolución Roja en Europa."
 POL_KORWIN_AG: "Korwin se incorpora a la STO"
 POL_KORWIN_AG_DESC: "Polonia apoyará al partido UPR, ganará como Korwin, invadirá Ucrania y se unirá a la OTSC."
