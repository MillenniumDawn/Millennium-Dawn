l_polish:
 HUN_karpatalja_question_category: "Kwestia zakarpacka"
 HUN_annex_karpatalja: "Odpowiedz na wezwanie z Zakarpacia"
 HUN_annex_karpatalja_desc: "Władza Ukrainy na Zakarpaciu się załamała. Lokalne rady węgierskie zwracają się do Budapesztu o uznanie związku, a w Kijowie nie ma już nikogo, kto mógłby powiedzieć „nie”."
 HUN_karpatalja_ultimatum: "Ultimatum dla Kijowa"
 HUN_karpatalja_ultimatum_desc: "Mniejszość węgierska na Zakarpaciu czekała sto lat na ponowne zjednoczenie z macierzą. Kijów powinien przekazać ten obszar po cichu, w przeciwnym razie straci go siłą."
 HUN_karpatalja_integration_category: "Administracja Zakarpacia"
 HUN_701_return: "Powrót Zakarpacia"
 HUN_701_return_desc: "Zakarpacie utracono w Trianon. Zapewniwszy sobie przychylność tego regionu, możemy uczynić zjednoczenie trwałym."
 HUN_karpatalja_autonomy: "Administracja Zakarpacia"
 HUN_karpatalja_autonomy_desc: "Sprawowanie władzy na Zakarpaciu za pośrednictwem lokalnych rad pozwala zjednać sobie przychylność mieszkańców i przyspiesza integrację regionu, choć odbywa się to kosztem wolniejszego dysponowania środkami finansowymi oraz wystawiania na próbę cierpliwości opinii publicznej wobec takiego rozwiązania."
 HUN_ukr_cede_tt: "§Y Ukraina przekaże Zakarpacie. §!"
 HUN_ukr_refuse_tt: "§R Zyskamy cel wojenny polegający na siłowym zajęciu Zakarpacia §!"
 hungary_karpatalja.1.t: "Rady Karpatalji"
 hungary_karpatalja.1.d: "Jako że Kijów nie jest w stanie egzekwować swojej władzy tak daleko od stolicy, lokalne zgromadzenia na Zakarpaciu przegłosowały dążenie do przyłączenia się do Węgier. Budapeszt z wielką chęcią przystaje na tę propozycję."
 hungary_karpatalja.1.a: "Powitajcie ich w domu"
 hungary_karpatalja.2.t: "Sprawowanie władzy na Zakarpaciu"
 hungary_karpatalja.2.d: "Na mapie Zakarpacie jest węgierskie. Przekształcenie tego stanu rzeczy w sprawnie funkcjonującą administrację to jednak zupełnie inna kwestia, a rząd musi zdecydować, jak stanowczych środków użyć."
 hungary_karpatalja.2.a: "Sprawowanie władzy za pośrednictwem lokalnych rad"
 hungary_karpatalja.2.b: "Bezpośrednie rządy z Budapesztu"
 hungary_karpatalja.10.t: "Budapeszt domaga się Karpatalji"
 hungary_karpatalja.10.d: "Węgry postawiły ultimatum: oddajcie Zakarpacie albo liczcie się z konsekwencjami. Rząd musi zdecydować, jak zareagować."
 hungary_karpatalja.10.a: "Odstąp prowincję"
 hungary_karpatalja.10.b: "Odrzuć ultimatum"
 hungary_karpatalja.11.t: "Kijów odmawia"
 hungary_karpatalja.11.d: "Ukraina odrzuciła nasze żądania dotyczące Zakarpacia. Jeśli chcemy tego regionu, będziemy musieli go sami zająć."
 hungary_karpatalja.11.a: "Przygotuj się do wojny"