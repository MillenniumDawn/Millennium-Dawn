 UKR_storage_item_m30_tt: "§YМ-30§!\n\n\n£SOV_INF_M_30\n\n\n\nНа хранении: §Y[?ukraine_has_m30_stockpile|0]§!\nПоколение: 122-мм гаубица, на вооружении с 1939 года.\nТип техники: §YБуксируемая артиллерия§!\n\nВарианты на хранении:\n• М-30: §Y[?ukraine_has_m30_stockpile|0]§!\n\nДивизионная гаубица §Rсоветской§! армии времён войны, которую сменила §YД-30§!."
