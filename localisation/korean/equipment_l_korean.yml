 UKR_cnc_equipment_1: "R-140U"
 UKR_cnc_equipment_1_desc: "Legacy Soviet-era command and control radio station inherited by Ukraine after the collapse of the USSR. Widely used throughout the 1990s as a backbone of brigade and army-level communications."
 UKR_cnc_equipment_2: "R-145BM"
 UKR_cnc_equipment_2_desc: "First-generation system based on the R-145BM command vehicle. Provides basic voice and data communications for battalion and brigade-level command posts."
 UKR_cnc_equipment_3: "R-161A2 Artseul"
 UKR_cnc_equipment_3_desc: "Second-generation system based on Ukrainian R-161A2 digital radio complex. Offers improved encryption, reliability, and interoperability over Soviet-era systems."
 UKR_cnc_equipment_4: "R-162-01"
 UKR_cnc_equipment_4_desc: "System integrating secure digital radios, battlefield sensors, and early automated command elements."
 UKR_cnc_equipment_5: "Aselsan–Motorola"
 UKR_cnc_equipment_5_desc: "System integrating Western tactical radios, computers, and NATO-compatible communication standards."
 UKR_cnc_equipment_6: "Delta BMS"
 UKR_cnc_equipment_6_desc: "System centered around Ukrainian 'Delta' battlefield management platform, enabling real-time situational awareness and network-centric warfare."
 SOV_cnc_equipment_1: "R-140M"
 SOV_cnc_equipment_1_desc: "Cold War-era long-range command and control radio station used at army and front levels. Served as the backbone of Soviet strategic and operational communications and remained in limited service into the post-Soviet period."
 SOV_cnc_equipment_2: "R-145BM"
 SOV_cnc_equipment_2_desc: "First-generation system based on the R-145BM command vehicle. Provides basic HF and VHF communications for battalion and brigade-level command posts."
 SOV_cnc_equipment_3: "R-168 'Akveduk'"
 SOV_cnc_equipment_3_desc: "Second-generation digital radio system designed to replace Soviet-era equipment. Introduced encrypted voice and limited data transmission capabilities."
 SOV_cnc_equipment_4: "R-149MA1"
 SOV_cnc_equipment_4_desc: "Command vehicle integrating digital radios, automated command elements, and battlefield data exchange."
 SOV_cnc_equipment_5: "ESU TZ 'Sozvezdie-M2'"
 SOV_cnc_equipment_5_desc: "System forming the core of Russia's network-centric warfare concept, integrating units from battalion to brigade level."
 SOV_cnc_equipment_6: "Andromeda-D"
 SOV_cnc_equipment_6_desc: "Airborne and joint-forces command system designed for rapid deployment and integration with multiple service branches."
 artillery_6: "ART 2065"
 artillery_6_desc: "With its powerful indirect fire abilities, Artillery provides sustained precision strikes where it's needed on the battlefield, and far beyond visual ranges. It can be reloaded directly by its crew. Since it requires external vehicles for its movement, it can be difficult to move around in between strikes, making it vulnerable against enemy artillery counter-strikes. Lightweight lower calibre systems can be dragged around manually, and are suitable for airborne operations as they can fit inside transport planes."
 Anti_tank_9: "ATGM 2075"
 Anti_tank_9_desc: "Anti-Tank Guided Missiles are man-portable missile systems employing high explosive warheads specifically designed to attack heavily armored vehicles."
 Heavy_Anti_tank_9: "Mounted ATGM 2075"
 Heavy_Anti_tank_9_desc: "Heavier Anti-Tank Guided Missile Systems have longer ranges and larger missile payloads. As such, the increased weight make them unsuitable for being carried around. They therefore are mounted on vehicles. They utilize high explosive warheads specifically designed to attack heavily armored vehicles."
