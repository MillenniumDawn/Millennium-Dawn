 SPR_transport_helicopter_1: "벨 UH-1H 휴이"
 SPR_transport_helicopter_1_short: "UH-1H 휴이"
 SPR_transport_helicopter_1_desc: "단일 터보축 엔진으로 구동되며 2엽 주 회전익과 꼬리 회전익을 갖춘 다목적 군용 헬리콥터입니다. 다양한 파생형을 낳은 휴이 계열의 첫 번째 기체로, 1952년 미 육군의 의무 후송 및 다목적 헬리콥터 요구 조건을 충족하기 위해 벨 헬리콥터가 개발하여 1956년에 첫 비행을 했습니다. UH-1은 미군을 위해 생산된 최초의 터빈 동력 헬리콥터이며, 1960년 이후 16,000대 이상이 제작되었습니다."
 SPR_transport_helicopter_2: "에어버스 헬리콥터스 AS 332 슈퍼 퓨마"
 SPR_transport_helicopter_2_short: "AS332 슈퍼 퓨마"
 SPR_transport_helicopter_2_desc: "에어버스 헬리콥터스가 개발하여 판매하는 4엽, 쌍발 엔진의 중형 다목적 헬리콥터입니다. 원래의 아에로스파시알 SA 330 퓨마에 엔진을 교체하고 동체 용적을 확대한 버전입니다."
 SPR_transport_helicopter_3: "보잉 CH-47 치누크"
 SPR_transport_helicopter_3_short: "CH-47 치누크"
 SPR_transport_helicopter_3_desc: "미국 회전익기 기업 버톨이 개발하고 보잉 로터크래프트 시스템즈가 제조한 쌍발 엔진 탠덤 로터 중량물 수송 헬리콥터입니다. CH-47은 서방 헬리콥터 중 가장 무거운 화물을 들어 올릴 수 있는 기종 중 하나입니다. 치누크는 동체 전반에 걸친 다수의 문, 동체 후방의 넓은 적재 램프, 그리고 외부 화물을 매달아 운반하기 위한 총 세 개의 외부 하부 화물 고리 등 다양한 화물 적재 수단을 갖추고 있습니다."
 SPR_transport_helicopter_4: "NH인더스트리즈 NH-90"
 SPR_transport_helicopter_4_short: "NH-90"
 SPR_transport_helicopter_4_desc: "쌍발 엔진의 중형 다목적 군용 헬리콥터입니다. 해상 환경에서도 운용할 수 있는 전장 헬리콥터에 대한 NATO의 요구에 부응하여 개발되었습니다. 스페인형 NH90은 국내에서 조립한 제너럴 일렉트릭 CT7 8F5 엔진, 맞춤형 통신 장비, 인드라가 개발한 전자 경보 체계를 갖추고 있습니다."
 SPR_transport_helicopter_5: "시코르스키 UH-60 스텔스 호크"
 SPR_transport_helicopter_5_short: "시코르스키 UH-60S 스텔스 호크"
 SPR_attack_helicopter_1: "벨 헬리콥터 텍스트론 AH-1 코브라"
 SPR_attack_helicopter_1_short: "AH-1 코브라"
 SPR_attack_helicopter_1_desc: "벨 헬리콥터가 제조한 2엽, 단발 엔진의 공격 헬리콥터입니다. 벨 UH-1 이로쿼이의 엔진, 변속기 및 회전익 체계를 사용하여 개발되었습니다. 휴이 계열의 일원인 AH-1은 휴이코브라 또는 스네이크라고도 불립니다. 스페인 해군은 이 기종을 \\"Z-14\\"로 지정했습니다. 이 기체들은 M35 20mm 기관포 체계를 장비하고 연안 경비정을 지원하는 데 사용되었습니다."
 SPR_attack_helicopter_2: "벨 헬리콥터 OH-58A 키오와"
 SPR_attack_helicopter_2_short: "OH-58A 키오와"
 SPR_attack_helicopter_2_desc: "OH-58A 키오와는 4인승 관측 헬리콥터입니다. 조종석은 2인승이지만, 왼쪽 좌석의 조종 장치는 분리 가능하도록 설계되어 있어 앞좌석에 승객을 태울 수 있습니다. 베트남전 당시 개발 과정에서 7.62mm 전기식 기관총인 M134 미니건이 장착되었습니다."
 SPR_attack_helicopter_3: "유로콥터 티그르"
 SPR_attack_helicopter_3_short: "티그르"
 SPR_attack_helicopter_4: "유로콥터 티그르 E Mk2"
 SPR_attack_helicopter_4_short: "티그르 E Mk2"
 SPR_attack_helicopter_4_desc: "4엽, 쌍발 엔진의 공격 헬리콥터입니다. 에어버스 헬리콥터스가 제조하며 EC665로 명명했습니다. 스페인에서는 티그레라고 부릅니다. 티그르는 유럽에서 개발된 최초의 전복합소재 헬리콥터라는 특징이 있으며, 글래스 콕핏, 스텔스 기술, 높은 기동성 등 첨단 기능을 갖추어 생존성을 높였습니다."
 SPR_attack_helicopter_5: "에어버스 헬리콥터스 EC665 티그르 Mark3"
 SPR_attack_helicopter_5_short: "티그르 MK3"
 SPR_attack_helicopter_5_desc: "스페인은 프랑스, 독일, 오스트레일리아와 협력하여 티그르 HAD의 개량 사업을 추진했으며, 이를 티그르 Mk3라고 부릅니다. 이 개량의 핵심 요소는 공통 대전차 미사일의 도입과 통신 체계 등 여러 분야의 개선입니다."
