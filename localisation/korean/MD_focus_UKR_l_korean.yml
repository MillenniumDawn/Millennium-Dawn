 ukr_modernize_sov_equipment_pt76_europe_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_pt76_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[CRO.GetNameWithFlag]§!와(과) §Y[BOS.GetNameWithFlag]§!은(는) 아직 소련제 장갑차를 쓰며 경수륙양용 전차 한 개 대대가 있으면 요긴할 것입니다. 비축된 §YPT-76B§!를 이 가운데 한 나라에 제안할 수 있습니다.§!"
