 stealth_destroyer_desc: "초기 스텔스 함선은 적의 탐지 및 공격 능력을 최소화하면서 화력을 투입하도록 설계되었습니다."
 cruiser_desc: "Typically the largest assault ships in a modern fleet, these powerful assets can cover the entire globe's oceans and seas."
