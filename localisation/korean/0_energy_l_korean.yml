 TOTAL_WEEKLY_NUCLEAR_MATERIAL_PRODUCTION_TT: "이 값은 §Y원자로 등급 물질§!의 주간 순생산량을 나타내며, 이는 §Y원자로§!에서 사용됩니다. 해당 값은 §Y원자로 등급 물질§!의 주간 생산량에 소비량을 뺀 값입니다.\n\n §Y원자로 등급 물질 비축량§!: £GFX_nuclear_material_texticon  §G[?var_reactor_material_stockpile]§! Kg\n§Y원자로 등급 물질의 주간 생산량§!: [?total_nuclear_reactor_fuel_production|G2] Kg\n§Y원자로 등급 물질의 주간 소비량§!: [?nuclear_fuel_consumption|-2] Kg\n\n§Y수정치§!:\n법률, 국민정신 및 기술이 §Y원자로 연료§! 소비에 미치는 영향: [?modifier@nuclear_fuel_consumption_modifier|-%]"
 total_ffp_amount_tt: "This value represents the total number of §YFossil Fuel Powerplants§! in our nation."
 total_ffp_amount_tt_delayed: "§Y화석 연료 발전소§!는 화석을 기반으로 하는 모든 열전기 에너지 자원을 원료로 에너지를 생산합니다. 대표적으로 석탄, 천연가스, 그리고 석유가 있습니다. §Y화석 연료 발전소§!는 에너지 생산량이 소비량보다 많으면 유휴상태가 됩니다.\n\n주에 다음을 제공합니다:\n기본 필요 노동자 수: §Y7.5K§!\n§Y화석 연료 발전소§!당 기본 GDP 산출량: $§Y1.7 ×십억§!\n기본 에너지 획득: §G+2§! GW\n\n현재 §Y발전소당 에너지 획득§!: [?fossil_pp_energy_per_plant_display|+2] GW"
 total_nuclear_reactor_amount_tt: "This value represents the total number of §YNuclear Reactors§! in our nation."
 total_nuclear_reactor_amount_tt_delayed: "이 발전소는 핵 에너지를 전기 에너지로 변환하며, 보통 수준으로 농축된 우라늄을 소모 합니다.\n\n다음을 국가에 제공:\n기본 필요 노동자 수: §Y115K§!\n§Y원자로§!당 기본 GDP 산출량: $§Y4 ×십억§!\n기본 에너지 획득: §G+4§! GW (기가와트)\n\n현재 §Y원자로당 에너지 획득§!: [?nuclear_energy_per_reactor_display|+2] GW"
 total_renewable_energy_amount_tt: "이 값은 우리나라의 총 §Y재생에너지 기반시설§! 수를 나타냅니다."
 total_renewable_energy_amount_tt_delayed: "§Y재생에너지 시설§!은 모든 재생에너지 자원을 원료로 에너지를 생산합니다. 대표적으로 태양광 단지, 풍력 터빈, 바이오연료 정제소, 목탄 발전소, 바이오연로 발전소 등이 있습니다. 결과적으로 이 시설은 재생에너지 자원을 활용하여 연료를 생산하게 됩니다.\n\n국가에 다음을 제공:\n기본 필요 노동자 수: §Y22.5K§!\n§Y재생에너지 시설§!당 기본 GDP 산출량: $§Y2 ×십억§!\n기본 에너지 획득: §G+0.5§! GW(기가와트)\n"
 total_fuel_silo_amount_tt: "이 값은 우리나라의 총 §Y전략 자원 비축고§! 수를 나타냅니다."
 total_fuel_silo_amount_tt_delayed: "§Y전략 자원 비축고§!는 창고, 건식 저장소를 비롯한 §Y연료§! 저장소를 합친 건물입니다. 이 건물은 국가에 더 많은 §H연료§!비축 공간을 제공합니다."
 ENERGY_GENERATION_TOTAL_DELAYED_TT: "§Y변동치§!:\n정책, 국민정신, 그리고 기술 항목이 §Y전체 에너지 발전량§!에 미치는 영향: [?modifier@energy_gain_multiplier|+%]\n정책, 국민정신, 그리고 기술 항목이 §Y재생에너지 발전량§!에 미치는 영향: [?modifier@renewable_energy_gain_multiplier|%+]\n정책, 국민정신, 그리고 기술 항목이 §Y화석 연료 발전량§!에 미치는 영향: [?modifier@fossil_pp_energy_generation_modifier|%+]\n정책, 국민정신, 그리고 기술 항목이 §Y원자력 발전량§!에 미치는 영향: [?modifier@nuclear_energy_generation_modifier|%+]\n\n"
 TOTAL_CONSUMPTION_ENERGY_DELAYED_TT: "§Y변동치§!:\n정책, 이념, 그리고 기술 항목이 §Y전체 에너지 소비량§!에 미치는 영향: [?modifier@energy_use_multiplier|-%]\n정책, 이념, 그리고 기술 항목이 §Y민간 에너지 소비량§!에 미치는 영향: [?modifier@pop_energy_use_multiplier|-%]\n정책, 이념, 그리고 기술 항목이 §Y민간 공장 에너지 소비량§!에 미치는 영향: [?modifier@energy_use_modifier_civs|-%]\n정책, 이념, 그리고 기술 항목이 §Y사무 지구 에너지 소비량§!에 미치는 영향: [?modifier@energy_use_modifier_offices|-%]\n정책, 이념, 그리고 기술 항목이 §Y군수 공장 에너지 소비량§!에 미치는 영향: [?modifier@energy_use_modifier_mils|-%]\n정책, 이념, 그리고 기술 항목이 §Y해군 조선소 에너지 소비량§!에 미치는 영향: [?modifier@energy_use_modifier_dockyards|-%]\n정책, 이념, 그리고 기술 항목이 §Y상업화된 농업지구 에너지 소비량§!에 미치는 영향: [?modifier@energy_use_modifier_agriculture_district|-%]\n정책, 이념, 그리고 기술 항목이 §Y마이크로칩 공장 에너지 소비량§!에 미치는 영향: [?modifier@energy_use_modifier_microchip_plant|-%]\n정책, 이념, 그리고 기술 항목이 §Y첨단 복합재 공장 에너지 소비량§!에 미치는 영향: [?modifier@energy_use_modifier_composite_plant|-%]\n정책, 이념, 그리고 기술 항목이 §Y합성 정제소 에너지 소비량§!에 미치는 영향: [?modifier@energy_use_modifier_synthetic_refinery|-%]\n\n----------\n§Y에너지 부하 공유§!에 의한 총 에너지 소비량: [?energy_load_sharing_use_var|R2]"
 heavy_power_restrictions_spirit_desc: "The government has imposed a series of heavy power restrictions on their population. It drastically cut back on energy and power consumption but at a cost of tax revenue and other economic penalties."
 some_power_restrictions_spirit_desc: "정부는 일련의 소규모 전력 제한 조치를 취했습니다. 이 조치는 에너지와 전력 소비를 소폭 줄였지만 세수와 기타 경제적 불이익을 감수해야 했습니다."
 some_additional_consumption_spirit_desc: "정부는 국민들의 재정적 부담을 덜어주기위해 국민의 전력 사용량에 대한 소규모 대상 보조금 제도를 시행했습니다. 이로인해 소비는 조금 늘어났지만 전기 소비는 급증했습니다."
 heavy_additional_consumption_spirit_desc: "정부는 국민들의 재정적 부담을 덜어주기위해 국민의 전력 사용량에 대한 대규모 대상 보조금 제도를 시행했습니다. 이로인해 소비가 많이 늘어났지만 전기 소비도 급증했습니다."
