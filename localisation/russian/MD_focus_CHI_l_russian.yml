 CHI_local_debt_pressure_tt: "Долговое давление на местные бюджеты: §Y[?local_debt_change|0+]§! (сейчас: §Y[?CHI_local_debt_pressure|0]§! / 100)"
 CHI_local_debt_tolerance_tt: "Бюджетная устойчивость: §Y[?local_debt_tolerance_change|0+]§! $industrial_complex$ и $offices$ (сейчас: §Y[?CHI_local_debt_tolerance|0]§!)"
