 AA_upgrade_1: "Unidad de refrigeración de batería de segunda generación"
 AA_upgrade_1_desc: "Contiene una batería térmica para proporcionar energía para las operaciones previas al vuelo, así como un suministro de gas argón para enfriar el detector de infrarrojos en el buscador de misiles."
 AA_upgrade_2: "Escaneo de RoSeta de Tercera Generación IR UV"
 AA_upgrade_2_desc: "La banda ultravioleta del espectro electromagnético tiene el potencial de usarse como medio anfitrión para el funcionamiento de armas guiadas; esta es una continuación de esa tecnología."
 AA_upgrade_3: "Sistemas de IR Refrigerados"
 AA_upgrade_3_desc: "Los buscadores infrarrojos refrigerados mejoran enormemente la sensibilidad térmica, lo que permite a los MANPADS y a los sistemas antiaéreos de corto alcance montados en vehículos detectar firmas térmicas más débiles, mantener fijaciones más estables y mejorar la resistencia contra contramedidas simples como las bengalas."
 AA_upgrade_4: "Sensores de arseniuro de indio y galio (InGaAs)"
 AA_upgrade_4_desc: "Los captadores de imágenes por infrarrojos de onda corta InGaAs mejoran el contraste del objetivo en condiciones de poca luz, neblina y fondos saturados, ayudando a los sistemas de defensa aérea blindados y de infantería a rastrear drones, helicópteros y aeronaves de bajo vuelo con mayor fiabilidad."
 nsb_AA_upgrade_1: "Unidad de refrigeración de batería de segunda generación"
 nsb_AA_upgrade_1_desc: "Contiene una batería térmica para proporcionar energía para las operaciones previas al vuelo, así como un suministro de gas argón para enfriar el detector de infrarrojos en el buscador de misiles."
 nsb_AA_upgrade_2: "Roseta de tercera generación con escaneo IR UV"
 nsb_AA_upgrade_2_desc: "La banda ultravioleta del espectro electromagnético tiene el potencial de usarse como medio anfitrión para el funcionamiento de armas guiadas; esta es una continuación de esa tecnología."
 nsb_AA_upgrade_3: "Sistemas IR enfriados"
 nsb_AA_upgrade_3_desc: "Los buscadores infrarrojos refrigerados mejoran enormemente la sensibilidad térmica, lo que permite a los MANPADS y a los sistemas antiaéreos de corto alcance montados en vehículos detectar firmas térmicas más débiles, mantener fijaciones más estables y mejorar la resistencia contra contramedidas simples como las bengalas."
 nsb_AA_upgrade_4: "Sensores de arseniuro de indio y galio (InGaAs)"
 nsb_AA_upgrade_4_desc: "Los captadores de imágenes por infrarrojos de onda corta InGaAs mejoran el contraste del objetivo en condiciones de poca luz, neblina y fondos saturados, ayudando a los sistemas de defensa aérea blindados y de infantería a rastrear drones, helicópteros y aeronaves de bajo vuelo con mayor fiabilidad."
 AT_upgrade_1: "SACLOS"
 AT_upgrade_1_desc: "Comando semiautomático a línea de visión: un método de guía de comando de misiles que requiere que el operador fije el objetivo durante todo el vuelo del misil."
 AT_upgrade_2: "Disparar y Olvidar"
 AT_upgrade_2_desc: "La capacidad de un misil para guiarse hacia el objetivo una vez disparado."
 AT_upgrade_3: "Carga Tándem Mejorada"
 AT_upgrade_3_desc: "Eficaz contra blindaje reactivo: esta ojiva de varias etapas perfora primero el blindaje exterior, permitiendo que la segunda ojiva pase sin obstáculos y detone en el interior."
 AT_upgrade_4: "Munición de Vigilancia"
 AT_upgrade_4_desc: "Una categoría de sistema de armas en la que la munición merodea alrededor del área objetivo durante algún tiempo, busca objetivos y ataca una vez que se localiza el objetivo."
 AS_upgrade_1: "Motores de Vectorización de Empuje"
 AS_upgrade_1_desc: "La capacidad de manipular la dirección del empuje de los motores, lo que proporciona agilidad y capacidad de pelea de perros mucho mayores."
 AS_upgrade_2: "Sigilo de 2da Generación"
 AS_upgrade_2_desc: "Las características y el rendimiento mejorados del sigilo permiten una mayor intrusión y capacidad de supervivencia en el espacio aéreo enemigo."
 AS_upgrade_3: "Control Remoto"
 AS_upgrade_3_desc: "Sacar al humano de la máquina permite conjuntos de misiones más peligrosas y aviones que pueden generar fuerzas G más altas."
 MR_upgrade_1: "Supercrucero"
 MR_upgrade_1_desc: "Vuelo supersónico sostenido eficientemente sin necesidad de postquemadores."
 MR_upgrade_2: "Sigilo de 2da Generación"
 MR_upgrade_2_desc: "Las características y el rendimiento mejorados del sigilo permiten una mayor intrusión y capacidad de supervivencia en el espacio aéreo enemigo."
 MR_upgrade_3: "Control Remoto"
 MR_upgrade_3_desc: "Sacar al humano de la máquina permite conjuntos de misiones más peligrosas y aviones que pueden generar fuerzas G más altas."
 tank_armor_upgrade: "Blindaje"
 tank_armor_upgrade_desc: "Una armadura mejor que la que tus enemigos pueden penetrar es una gran ventaja para tus divisiones, pero probablemente las ralentizará."
 tank_gun_upgrade: "Cañón Principal"
 tank_gun_upgrade_desc: "Es importante tener un arma que pueda seguir el ritmo de la fuerza del blindaje enemigo y pueda penetrarlo."
 tank_reliability_upgrade: "Confiabilidad"
 tank_reliability_upgrade_desc: "Mejorar la confiabilidad da como resultado menos tanques averiados que necesitará reemplazar."
 tank_engine_upgrade: "Motor"
 tank_engine_upgrade_desc: "Una mayor movilidad proporciona ventajas tácticas y estratégicas, además de permitir más armadura sin verse ralentizado significativamente."
 tank_support_weapons_upgrade: "Armas de apoyo"
 tank_cutting_corners_upgrade: "Esquinas de corte"
