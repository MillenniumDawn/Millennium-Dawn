 SAU_events.315.b: "특수 부대: 종심 습격대"
 SAU_events.315.c: "특수 부대: 정찰"
 SAU_events.315.desc: "특수 부대를 어떤 부대로 단련해야 합니까? 각각의 길은 지속적인 맞교환이며, 한 방향에서는 우리를 강하게 하고 다른 방향에서는 약하게 합니다.\n\n§Y선택지에 마우스를 올리면 그것이 무엇을 부여하고 무엇을 요구하는지 정확히 볼 수 있습니다.§!"
