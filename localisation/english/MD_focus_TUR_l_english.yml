# Ottoman Restoration
 TUR_the_osmanli_settlement: "The Osmanlı Settlement"
 TUR_the_osmanli_settlement_desc: "The family has returned to a country whose law still does not know what to call them. A commission of jurists is convened to draft the §YHanedan Statute§!: the order of succession, the oath sworn at accession, and a civil list kept separate from the budget of the state. Until it is signed, every act of the sovereign rests on nothing but the acclamation that brought them back."
 TUR_the_oath_of_the_general_staff: "The Oath of the General Staff"
 TUR_the_oath_of_the_general_staff_desc: "The §YTurkish Armed Forces§! swore themselves to the Republic, and the officer corps has toppled four governments in defence of that oath. The formula must be rewritten, the chairmanship of the §YNational Security Council§! settled, and the question of whether the General Staff reports to the palace or to the ministry answered before somebody answers it for us."
 TUR_the_crown_and_the_diyanet: "The Crown and the Diyanet"
 TUR_the_crown_and_the_diyanet_desc: "The §YDirectorate of Religious Affairs§! employs more people than most ministries and pays the salary of every imam in the country. The caliphal title has come back with the dynasty, but a title is not an administration. We must decide whether the Diyanet becomes a department of the palace or remains a civil bureaucracy that the cabinet answers for."
 TUR_the_hanedan_vakfi: "The Hanedan Vakfı"
 TUR_the_hanedan_vakfi_desc: "Our ancestors built their standing on endowments rather than decrees. The §YHanedan Vakfı§! revives that practice on family money and diaspora donations: scholarships, clinics, and the restoration of buildings the Republic let fall down. A foundation the treasury does not fund is a foundation no parliament can defund."
 TUR_a_crown_above_parties: "A Crown Above Parties"
 TUR_a_crown_above_parties_desc: "The sovereign reigns and does not govern. The palace arbitrates when the §YMeclis§! cannot form a government, signs what the cabinet places in front of it, and leaves the courts alone. It is the slowest way to rule and the only one that survives an unpopular decade."
 TUR_the_palace_prerogative: "The Palace Prerogative"
 TUR_the_palace_prerogative_desc: "Rabat and Amman govern; they do not merely reign. The crown keeps the senior appointments, the security services, and a standing power of decree, and the ministries execute what the palace has already decided. Decisions arrive quickly, and every one of them arrives with our name on it."
 TUR_trusteeship_of_the_wealth_fund: "Trusteeship of the Wealth Fund"
 TUR_trusteeship_of_the_wealth_fund_desc: "The §YTürkiye Wealth Fund§! holds the national airline, Ziraat, BOTAŞ, and a controlling voice in half the economy, and its chairmanship passed to the head of state without anyone asking what that would mean. Placed under a chartered trusteeship with published accounts, the Gulf sovereign funds will co-invest beside us. Kept in the gift of the palace, the capital stays domestic and political."
 TUR_a_charter_for_the_provinces: "A Charter for the Provinces"
 TUR_a_charter_for_the_provinces_desc: "Thirty metropolitan municipalities govern most of the population of this country on money that Ankara releases at its own pace. A provincial charter gives them guaranteed transfers and mayors whom no telephone call can remove. The crown trades reach for consent, and stops being the only thing holding the country together."
 TUR_trustees_over_the_municipalities: "Trustees Over the Municipalities"
 TUR_trustees_over_the_municipalities_desc: "The §Ykayyum§! was an emergency instrument. We will make it ordinary law: an elected mayor serves at the pleasure of a governor appointed from the capital, and a province is administered as the palace intends rather than as it votes. Uniform administration is bought with uniform resentment."
 TUR_the_republics_century: "The Republic's Century"
 TUR_the_republics_century_desc: "Atatürk stays on the wall, the holidays stay in the calendar, and §YAnıtkabir§! stays a shrine of the state. The crown is presented not as a correction of the Republic but as an addition to it, and the officer corps and the §YCHP§! discover they can live with a sovereign who never asks them to recant."
 TUR_an_interrupted_continuity: "An Interrupted Continuity"
 TUR_an_interrupted_continuity_desc: "The other settlement. The curriculum, the archives, and the calendar are rewritten around the House as the thread running through Anatolian history, and the years after 1923 become an interruption in it. The restorationists have waited a long time to hear this said aloud. Every institution the Republic built will hear it as well."
 TUR_the_millet_question: "The Millet Question"
 TUR_the_millet_question_desc: "The oldest problem of the empire returns in modern dress: Kurdish in the classroom, the legal standing of the §Ycemevi§!, the seminary at §YHalki§! and the position of the Ecumenical Patriarchate, and the foundation properties taken from Armenian and Syriac communities and never returned. An order claiming six centuries cannot answer these the way a republic of eighty years did."
 TUR_heritage_as_industry: "Heritage as Industry"
 TUR_heritage_as_industry_desc: "The §YOttoman archives§! hold the land records of twenty modern states, our restoration trades employ whole towns, and Turkish television already sells from Sarajevo to Santiago. The largest commercial asset of the dynasty is its own back catalogue, and nobody has ever run it as a business."
 TUR_the_crowned_republic: "The Crowned Republic"
 TUR_the_crowned_republic_desc: "The settlement holds. The crown is bound by a constitution it did not write, the parliament still sits, and the courts still rule against the government that appointed them. Turkey becomes a monarchy that Europe files beside Spain rather than beside the Gulf, and the accession folder comes down off the shelf."
 TUR_the_household_state: "The Household State"
 TUR_the_household_state_desc: "The §YMabeyn-i Hümayun§! is no longer a secretariat. Appointments, budgets, and the security services run through the royal household, and the ministries have become the rooms where its decisions are written down. It is efficient, it is personal, and it will last exactly as long as the judgement of one man."

