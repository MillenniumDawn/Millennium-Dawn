 NKO_expand_local_industry: "Инвестиции в отечественную промышленность"
 NKO_expand_local_industry_desc: "Мы должны расширять внутреннее производство, потому что без сильной промышленности наша страна не сможет противостоять экономическому давлению наших врагов"
