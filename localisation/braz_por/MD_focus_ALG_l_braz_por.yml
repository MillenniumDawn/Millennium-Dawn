 deep_state_critical_warning_tt: "§R£generic_warning ALERTA: O poder do Estado Profundo está CRÍTICO!\nUm golpe militar agora é possível se o poder chegar a 28+!§!"
 deep_state_assessing_tt: "§Y£generic_intelligence As agências de inteligência estão compilando um relatório sobre a influência do estado profundo.§!"
