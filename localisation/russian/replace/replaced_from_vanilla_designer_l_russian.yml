 NO_INTERSECTED_EQUIPMENT_DESC: "Это изменение приведёт к §RРАСФОРМИРОВАНИЮ§! существующих бригад с этим шаблоном. У изменённого и исходного шаблонов нет общего снаряжения."
 DIVISION_MODIFICATION_HEADER: "Это изменение шаблона затронет бригады: $AMOUNT|H$."
 DIVISION_GARRISON_MODIFICATION_HEADER: "Это изменение шаблона затронет бригады ($AMOUNT|H$) и гарнизоны регионов ($NUMGARRISON|H$)."
 DIVISION_MODIFICATION_NEED_NOT_FILLED: "\t- Для укомплектования бригад нужно ещё $AMOUNT|H0$ ед. $EQUIPMENT|H$ ( §Rв наличии $STOCK_AMOUNT|H0^$§! )"
