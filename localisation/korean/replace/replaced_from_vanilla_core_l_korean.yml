 SUPPLY_FLOW_DELAYED_DESC: "§H잔여 보급§!은 이 지역에 공급되는 보급량을 나타내며, 주 보급과 범위 내 거점으로 구성됩니다. 거점 범위는 날씨, 지면 상태, 기반 시설, 철도 등급, 차량화 수준의 영향을 받습니다. \n\n§H여단§!은 보급 가중치에 따라 지역 보급을 소모합니다. §H비축 보급§!이 해당 위치의 보급 비율보다 많으면, 비축 보급이 현지 보급과 같은 수준이 될 때까지 내부 비축분을 소모합니다.\n\n§GCtrl§!을 누르고 있으면 보급 흐름의 출처가 표시됩니다."
