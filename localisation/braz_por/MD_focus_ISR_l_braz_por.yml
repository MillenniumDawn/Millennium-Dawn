 oslo_accords_1: "Os Acordos de Oslo"
 oslo_accords_1_desc: "Em uma assinatura histórica entre o Primeiro-Ministro Yitzhak Rabin e o líder da Organização para a Libertação da Palestina, Yasser Arafat, na Casa Branca, em setembro de 1993, Israel aceitou a criação de uma Autoridade Nacional Palestina administrada pela OLP nas principais áreas urbanas da Cisjordânia e arredores, como medida temporária até um acordo de paz final. Mas, como a história nos ensinou, o que é assinado como 'temporário' sempre se torna permanente; e, apesar do reconhecimento israelense da OLP como legítima representante dos palestinos, e do reconhecimento por parte desta do direito de Israel a existir, um acordo de paz final ainda aguarda.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se concluirmos o foco §Y$ISR_tear_down_oslo$§!, e passará para um novo estágio se concluirmos o foco §Y$ISR_deligitimize_abbas$§! ou §Y$ISR_restore_palestinian_authority$§!."
