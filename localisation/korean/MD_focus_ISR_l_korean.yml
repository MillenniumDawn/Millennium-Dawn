 israel_focus: "이스라엘 중점 계통도"
 ISR_speak_to_government: "크네세트에 연설"
 ISR_speak_to_government_desc: "우리가 정부와 대화하고 내부 정치에 대해 규제할 때가 왔습니다."
 ISR_democratic_first: "Jewish, But Democratic"
 ISR_democratic_first_desc: "We are Jewish, yes, but democratic principles are the most important aspect of our state, which distinguishes our core values."
 ISR_democratic_jewish_balance: "Jewish and Democratic"
 ISR_democratic_jewish_balance_desc: "Being Jewish and democratic is not a contradiction. We should embrace both aspects of our new political identity."
 ISR_jewish_first: "Democratic, but Jewish"
 ISR_jewish_first_desc: "We should be Jewish first and then proceed to embrace values of our democratic freedoms. There are no rights without responsibilities!"
 ISR_economy_branch_focus: "An Economic Defensive Shield"
 ISR_economy_branch_focus_desc: "경제는 적에 대한 방어막이 되어야 하며, 이는 우리 국민의 복지를 향상하고 유지할 것입니다."
 ISR_infrastructure_focus: "6번 도로 완성"
 ISR_infrastructure_focus_desc: "우리는 이미 시작한 인프라 프로젝트를 계속 마무리해야 합니다."
 ISR_tel_aviv_priority: "핵심 지역 우선"
 ISR_tel_aviv_priority_desc: "We should focus on developing Tel Aviv and its growing sectors."
 ISR_southern_priority_infra: "남부 지역 우선"
 ISR_southern_priority_infra_desc: "북부 지역에서 작업하기 전에 남부 인프라 문제를 우선시해야 합니다."
 ISR_northern_priority_infra: "북부 지역 우선"
 ISR_northern_priority_infra_desc: "남부 문제를 해결하기 전에, 우리는 북부의 경제 문제에 집중해야 합니다."
 ISR_coastal_southern_road: "남부 해안 철도"
 ISR_coastal_southern_road_desc: "우리는 오랫동안 남부 해안 철도 건설을 계획해 왔으며, 이제 프로젝트를 시작할 수 있게 되었습니다."
 ISR_egypt_train_offer: "니차나선 제안"
 ISR_egypt_train_offer_desc: "이집트와 더 효과적으로 무역하기 위해서는 우리 철도를 그들의 철도와 연결해야 합니다."
 ISR_negev_trains: "북부 네게브선"
 ISR_negev_trains_desc: "네게브 북부 지역은 철도와 농촌 도로가 절실히 필요합니다. 우리는 이 문제를 해결하기 위해 노력해야 합니다."
 ISR_eilat_train: "마지막 단계"
 ISR_eilat_train_desc: "에일라트로 가는 고속철도는 이스라엘의 주요 인구 중심지와 지중해 항구를 홍해 연안의 남부 도시 에일라트와 연결하고 지중해와 홍해 간의 상업 화물을 운송할 수 있도록 하는 제안된 철도입니다."
 ISR_high_speed_tel_aviv_jerusalem: "돌출부를 통해"
 ISR_high_speed_tel_aviv_jerusalem_desc: "텔아비브에서 예루살렘까지 고속 교통 인프라를 구축할 수 있습니다. 하지만 우리와 팔레스타인 간의 긴장이 고조될 수 있습니다."
 ISR_tel_aviv_metro: "텔아비브 지하철"
 ISR_tel_aviv_metro_desc: "마침내, 저렴한 교통수단을 위한 인구 수요를 충족시키기 위해 새로운 텔아비브 지하철 건설을 시작할 수 있게 되었습니다."
 ISR_jerusalem_light_rail: "예루살렘 경전철"
 ISR_jerusalem_light_rail_desc: "예루살렘 경전철은 예루살렘에 있는 경전철 시스템입니다. 현재 예루살렘에서 계획된 여러 경전철 노선 중 첫 번째인 레드 라인이 유일하게 운영되고 있습니다."
 ISR_jerus_lightrail_mod: "예루살렘 경전철"
 ISR_galilee_railways: "갈릴리선"
 ISR_galilee_railways_desc: "북쪽의 인프라를 업그레이드하려면 갈릴리선을 건설해야 합니다."
 ISR_restore_jezreel_railway: "이즈릴 철도 복원"
 ISR_restore_jezreel_railway_desc: "우리는 이즈릴 철도를 복원하고 그 결과 철도 건설 계획에 대한 지식을 높여야 합니다."
 ISR_jordan_israel_rail: "평화의 섬 철도"
 ISR_jordan_israel_rail_desc: "요르단 영토를 통한 수출 역량을 높이기 위해 요르단으로 향하는 철도를 건설해야 합니다."
 ISR_israel_gulf_highway: "패권 부활 프로젝트"
 ISR_israel_gulf_highway_desc: "걸프 지역과의 무역을 촉진하려면 사우디아라비아로 향하는 철도를 건설하여 아라비아 반도와 연결해야 합니다."
 ISR_middle_eastern_quad: "I2U2 프로젝트"
 ISR_middle_eastern_quad_desc: "I2U2는 인도, 이스라엘, UAE, 미국이 세계적 과제에 대응하고 경제적 기회를 확대하기 위해 맺은 협력체입니다."
 ISR_shine_like_a_diamond: "다이아몬드처럼 빛나라"
 ISR_shine_like_a_diamond_desc: "다이아몬드 수입 정책을 계속 유지하고 사업 규모를 확대해야 합니다."
 ISR_kimberley_process: "킴벌리 프로세스 구성"
 ISR_kimberley_process_desc: "콩고산 다이아몬드의 불법 수입과 관련된 비윤리적 관행을 근절해야 합니다. 자금은 몰수하고 그러한 범죄자는 투옥해야 합니다!"
 ISR_dan_gantler_affairs: "거틀러 작전"
 ISR_dan_gantler_affairs_desc: "우리나라의 공정하지 못한 사업가 다수가 다이아몬드를 사들이기 위해 콩고 군벌과 접촉하려 합니다. 이러한 관행은 비윤리적이지만, 거래에서 얻는 이익이 모든 도덕적 우려를 덮어버릴 수도 있습니다."
 ISR_liberman_affair: "거틀러-리베르만 사건"
 ISR_send_diamonds_to_asia: "동방으로"
 ISR_send_diamonds_to_asia_desc: "우리의 다이아몬드를 판매하기에는 아시아 시장이 더 적합합니다."
 ISR_send_diamonds_to_america_desc: "우리의 다이아몬드를 판매하기에는 미국 시장이 더 적합합니다."
 ISR_send_diamonds_to_america: "서방으로"
 ISR_transition_to_manufacturing: "제조업으로의 전환"
 ISR_transition_to_manufacturing_desc: "전 세계의 더 많은 고객을 끌어들이려면 다이아몬드 가공 기술을 현대화해야 합니다."
 ISR_open_the_material_halls: "원자재 거래장 개방"
 ISR_open_the_material_halls_desc: "다이아몬드 거래소 구역의 새로운 여건으로 인해 다른 국가들이 다이아몬드 수출에 더욱 의존하게 되었습니다."
 ISR_diamond_district: "다이아몬드 구역"
 ISR_diamond_district_desc: "다이아몬드 구역은 이스라엘 다이아몬드 산업의 중심지이자 주요 상업 중심지입니다."
 ISR_foreign_companies_gas: "외국 채굴 기업과의 협상"
 ISR_foreign_companies_gas_desc: "로열 더치 셸이 흥미로운 거래를 제안하고 있으며, 어쩌면 이를 우리에게 유리하게 활용할 수 있을 것입니다."
 ISR_pass_the_gas_deal: "가스 협정 추진"
 ISR_pass_the_gas_deal_desc: "외국 기업이 가스를 관리하도록 두지 말고 우리 힘으로 직접 가스를 운영해야 합니다."
 ISR_compromise_gas_deal: "노르웨이 모델"
 ISR_compromise_gas_deal_desc: "노르웨이의 사회 복지 모델을 본받아 가스에서 나오는 수익을 사회 복지에 사용해야 합니다."
 ISR_lighthouse: "열방의 빛"
 ISR_lighthouse_desc: "우리는 스스로를 기술 진보와 문명의 빛나는 등불이라 여깁니다. 우리의 비전에 따라 발전해 나가야 합니다."
 ISR_yotzma: "요츠마 이니셔티브"
 ISR_yotzma_desc: "외국이 우리 IT 산업에 더 많이 투자하고 싶어 하도록 만드는 여건을 조성해야 합니다."
 ISR_venture_capital: "세금 인상"
 ISR_venture_capital_desc: "자금이 절실한 상황이라면 일정 기간 세금을 인상하는 것이 도움이 될 수 있습니다."
 ISR_chutzpah: "후츠파 장려"
 ISR_chutzpah_desc: "후츠파는 좋든 나쁘든 대담함을 뜻하는 성질입니다. 영어에서는 오만(hubris)이 가장 가까운 표현일 때가 있습니다. 우리는 과감하게 크게 생각해야 합니다."
 ISR_army_concentrate_innovation: "거대한 여과기"
 ISR_army_concentrate_innovation_desc: "오늘날 군대는 인재 선발 통로이며, 이를 민간 사이버 산업을 키우는 데 활용할 수 있습니다."
 ISR_silicon_wadi: "실리콘 와디"
 ISR_silicon_wadi_desc: "실리콘 와디는 이스라엘에서 첨단 기술의 세계적 중심지 중 하나로 꼽히는 지역입니다. 이스라엘 해안 평야 전역에 걸쳐 있으며, 이스라엘이 '스타트업 국가'로 알려지게 된 이유 중 하나로 거론됩니다."
 ISR_hightech_fortress: "첨단 기술 요새"
 ISR_hightech_fortress_desc: "골란 고원이 투자처로서 더 매력적이 되도록 그곳에 IT 교육 인프라를 조성해야 합니다."
 ISR_ben_gurion_university: "벤구리온의 사막 진주"
 ISR_ben_gurion_university_desc: "네게브 벤구리온 대학교는 이스라엘의 선도적인 연구 중심 대학 중 하나이며, 여러 분야에서 세계 선두에 속합니다."
 ISR_start_up_nation: "스타트업 국가"
 ISR_start_up_nation_desc: "Finally, our country should be considered the start-up nation of the Middle East!"
 ISR_dimona: "디모나 시몬 페레스 센터"
 ISR_dimona_desc: "우리나라에는... 방사능 수치가 매우 높은 섬유 공장이 있습니다. 이를 어떻게 할지 결정해야 합니다."
 ISR_ben_gvir_path: "유대인의 힘"
 ISR_ben_gvir_path_desc: "참혹했던 오슬로 협정 이후 무신론자와 아랍인은 고개를 빳빳이 들고 유대 국가가 자기들 것인 양 굴며 이를 조금씩 해체할 수 있다고 느껴 왔습니다. 이제는 그렇지 않을 것입니다. 이 나라가 진정 누구의 것인지, 곧 유대 민족의 것임을 모두에게 보여주겠습니다."
 ISR_ben_gvir_am_israel: "이스라엘 민족"
 ISR_ben_gvir_am_israel_desc: "원래 '오츠마 레이스라엘'로 결성되었다가 '오츠마 예후디트'로 개칭된 이 정당은, 이타마르 벤그비르가 이끄는 가운데 불법화된 '카흐' 당의 이념적 후계자입니다. 이 정당의 이념은 극우, 반아랍, 초민족주의, 그리고 카하니즘(유대법을 국가에 적용하는 데 뿌리를 둔 종교적 시온주의 이념)입니다. 이 정당과 그 지도자 벤그비르는 유대인 우월주의를 신봉하며, 아랍 극단주의자의 추방, 유대인 정착촌의 강력한 보호와 확장, 새로운 세대에 대한 유대법 교육 강화를 주장하고, 이른바 유대식 자본주의를 지지합니다."
 ISR_ben_gvir_kahanism_1: "카하니즘 - 토라의 길"
 ISR_ben_gvir_kahanism_1_desc: "창립자 메이르 카하네 랍비의 말씀을 따라 우리의 히브리 형제들만이 이스라엘 땅을 밟을 수 있는 유대 신정 국가를 세우고자 합니다."
 ISR_ben_gvir_kahanism_2: "카하니즘 - 다팀"
 ISR_ben_gvir_kahanism_2_desc: "신의 뜻에 따라 이스라엘 땅이 오직 이스라엘 민족으로만 채워지는 우리의 비전을 한 걸음 더 진전시킵니다."
 ISR_ben_gvir_kahanism_3: "카하니즘 - 시카리"
 ISR_ben_gvir_kahanism_3_desc: "우리의 신성한 땅에 이스라엘 민족의 후손이 아닌 자가 설 자리는 없습니다. 신의 말씀만이 이 나라의 유일한 빛이며, 신의 정의가 가차 없이 실현될 것입니다."
 ISR_ben_gvir_kahanism_4: "카하니즘 - 신의 땅"
 ISR_ben_gvir_kahanism_4_desc: "이스라엘 땅은 마침내 이스라엘 민족의 손에 들어왔으며, 마이모니데스의 율법이 우리를 인도합니다."
 ISR_ben_gvir_torat_israel: "이스라엘의 성서"
 ISR_ben_gvir_torat_israel_desc: "종교적 시온주의는 '오츠마 예후디트'의 근본 이념으로, 이스라엘 땅이 고대 이스라엘 민족에게 신이 약속한 땅이므로 토라에 따라 그 땅을 수호하고 일굴 의무가 있다고 믿습니다. 이스라엘 땅의 모든 정착민은 이스라엘의 자손으로서 종교적 계율을 따라야 합니다."
 ISR_ben_gvir_eretz_israel: "이스라엘 땅"
 ISR_ben_gvir_eretz_israel_desc: "에레츠 이스라엘, 곧 이스라엘 땅은 타나크와 성서에 따라 신이 우리의 조상과 그 후손인 이스라엘 민족에게 약속한 지역입니다."
 ISR_question_1923_partition: "카이로 회담에 이의 제기"
 ISR_question_1923_partition_desc: "1923년 영국은 하심 왕가가 요르단강 동쪽의 위임통치령 일부, 곧 트랜스요르단을 통치하도록 허용했으며 1946년에 완전한 독립을 부여했습니다. 이 영토가 오늘날의 요르단 왕국입니다. 그러나 우리는 요르단강 너머의 땅이 이스라엘 민족의 후손에게 속한다고 생각합니다."
 ISR_promised_land: "약속의 땅"
 ISR_promised_land_desc: "신은 UN이 허락한 것보다 더 큰 땅을 우리에게 약속하셨으니, 이제 그것을 되찾을 때입니다... 그 김에 조금 더 얹는다고 안 될 것도 없지요."
 ISR_farright_iraq: "바빌론의 강가에서"
 ISR_farright_iraq_desc: "신의 백성인 우리가 다시금 바빌론을 멸하는 그분의 손이 되어야 합니다!"
 ISR_farright_lebanon: "바알의 땅을 부수라"
 ISR_farright_lebanon_desc: "레바논을 분쇄하여 대이스라엘에 편입할 때입니다!"
 ISR_farright_syria: "아람 사람 라반에 대한 복수"
 ISR_farright_syria_desc: "시리아는 오래도록 우리에게 골칫거리였습니다. 지도에서 지워버릴 때입니다!"
 ISR_farright_saudia: "이스마엘 자손을 굴복시키라"
 ISR_farright_saudia_desc: "사우디아라비아는 의로운 이들에게 위협입니다. 어찌 그대로 둘 수 있겠습니까?"
 ISR_farright_china: "카하네의 십자군 완수"
 ISR_farright_china_desc: "카하네의 십자군을 완수하고 마침내 중국을 굴복시켜야 합니다!"
 ISR_farright_america: "동화 홀로코스트를 저지하라"
 ISR_farright_america_desc: "미국의 고임들이 너무 오랫동안 우리 민족에게 영향을 미쳐 왔습니다! 우리나라의 역겨운 것들은 모두 미국, 그리고 그들에게 동화된 우리 부족 출신들에게서 비롯된 것입니다!"
 ISR_death_to_terrorists: "사형 선고 집행"
 ISR_death_to_terrorists_desc: "이스라엘에서 사형제는 합법이지만 1962년 이후 집행되지 않았습니다. 그러나 여론조사에 따르면 이스라엘 국민 다수는 이스라엘 시민을 살해한 테러범에게 사형을 선고하는 데 찬성합니다. 그렇다면 다수를 만족시켜 줍시다."
 ISR_make_us_of_terrorist_families: "케다르 제안"
 ISR_make_us_of_terrorist_families_desc: "테러범들은 나이나 신분을 가리지 않고 이스라엘 시민을 위협하는 데 자비가 없습니다. 하지만 그들에게도 가족이 있으니, 이를 활용해 우위를 점해 봅시다."
 ISR_spread_out_land: "예시바 학생과 군인에게 혜택을"
 ISR_spread_out_land_desc: "예시바 학생과 군인은 우리 위대한 사회의 기둥이며, 복무에 대한 추가 혜택을 받을 자격이 있습니다. 이들에게 약간의 토지를 나누어 줍시다."
 ISR_immunity_to_soldiers: "면책 특권 부여"
 ISR_immunity_to_soldiers_desc: "영웅들이 임무를 수행했다는 이유로 재판을 받아야 하는 것은 용납할 수 없습니다. 그들이 테러범으로부터 시민을 지키는 동안 우리가 뒤를 확실히 받쳐 주겠습니다."
 ISR_engagement_reform: "총을 옥죄던 사슬을 끊어라"
 ISR_engagement_reform_desc: "테러범에 맞선 우리 군인들의 교전 수칙을 완화할 때입니다."
 ISR_hebrew_justice: "히브리 정의 복원"
 ISR_hebrew_justice_desc: "우리는 신의 정의인 체데크에서 너무 멀리 벗어났습니다. 이제 신의 뜻으로 돌아가 신명기에 표현된 '의로운 사람'의 이상을 되살릴 때입니다."
 ISR_basic_law_torah: "기본법: 토라 학습"
 ISR_basic_law_torah_desc: "토라 학습은 이스라엘 땅에 번영하는 사회를 세우는 데 근본이 됩니다. 이를 의무화합시다."
 ISR_hebraic_studies: "히브리 학문 장려"
 ISR_hebraic_studies_desc: "히브리 교육에 견줄 만한 교육은 없습니다! 우리 학생들은 다른 문화적 접근을 멀리하고 우리의 역사적 유산에 집중해야 합니다."
 ISR_ban_women_from_military: "밀러 판결 번복"
 ISR_ban_women_from_military_desc: "여성은 군대에서 싸울 것이 아니라 가정을 돌봐야 합니다. 남자들이 나라를 지키는 동안 여성이 집에 머물도록 헌법을 개정하겠습니다."
 ISR_outlaw_lgbt: "내부 정화 수행"
 ISR_outlaw_lgbt_desc: "성서에서 LGBT 이념에 관한 언급은 찾아볼 수 없으므로 동성 결혼이나 이를 위한 편의를 허용하는 것은 말이 되지 않습니다. 많은 이들이 나라를 떠날 수도 있겠지만, 누가 신경이나 쓰겠습니까?"
 ISR_kaplan_trials: "카플란 재판"
 ISR_kaplan_trials_desc: "사법 개혁은 그 중요성을 이해하지 못하는 이들이 조직한 시위와 폭동을 불러왔습니다. 이런 자들은 우리 땅의 배신자이며 처벌받지 않고 넘어갈 수 없습니다."
 ISR_third_temple: "제3성전"
 ISR_third_temple_desc: "예루살렘 성전은 처음에는 이스라엘 민족, 이후에는 유대인의 중심 성지 예배처 역할을 한 두 건축물을 가리킵니다. 그러나 두 성전 모두 성스러운 도시가 포위당하는 과정에서 파괴되었습니다. 이제 이를 재건하여 우리 민족에게 기도할 웅장한 장소를 주어야 할 때입니다. 이웃들이 아무리 강하게 항의하더라도 제3성전은 모리아산 위에 세워질 것이며, 공교롭게도 그곳은 서안 지구에 있습니다... 어쩌겠습니까."
 ISR_likud_path: "통합"
 ISR_likud_path_desc: "'통합'으로 직역되는 리쿠드는 독립 투쟁 당시 제에브 자보틴스키가 창설한 수정주의 시온주의 운동의 현대적 후신입니다. 이 운동은 이르군과 레히 저항 조직으로 무장 노선을 띠었고, 두 조직은 제1대 크네세트에서 합쳐 자유당을 결성했습니다. 이후 메나헴 베긴 아래에서 헤루트가 자유주의 정당들과 합쳐 1973년 자유주의 자유 블록을 결성했고, 1977년에는 '리쿠드'라 불리게 되었습니다. 이 정당은 실제로 그 선거에서 승리하여 29년간 이어진 노동당 집권을 끝냈습니다."
 ISR_rein_in_partners: "동반자를 단속하라"
 ISR_rein_in_partners_desc: "집권을 유지하기 위해 민족 블록에 의존하고 있음에도, 우리의 개인적 이익이 무엇보다 우선임을 분명히 해야 합니다. 연정 파트너들이 우리 연정에 들어온 것이지 그 반대가 아닙니다. 그들은 자신의 분수를 알고 극단주의 노선을 자제해야 합니다."
 ISR_judicial_reform_partial: "대통령실과 협상"
 ISR_judicial_reform_partial_desc: "리쿠드당 내부를 포함한 민족 블록의 많은 이들이 법원의 다양성을 위해, 그리고 '선출되지 않은 엘리트'를 제거하기 위해 사법부 개혁을 요구해 왔습니다. 법원이 이스라엘 사회를 대변하지 못한다는 것이 그들의 주장입니다. 그들의 초기 제안은 파국적이며 대중을 분노하게 할 것이지만, 이스라엘 대통령의 중재를 통해 위기를 막을 수 있을지도 모릅니다."
 ISR_judicial_reform_full: "레빈 개혁 개시"
 ISR_judicial_reform_full_desc: "사법부는 이스라엘의 다른 법 집행 기관보다도 더 부패했습니다. 사법관 임명 위원회에서 스스로를 뽑는 선출되지 않은 엘리트주의 판사들은 국민으로부터 받은 위임을 행사하려는 정부의 능력을 옭아매고 있으며, 압도적으로 좌편향되어 있습니다. 정부의 통제권을 되찾고 사법 패거리를 제자리로 돌려놓아야 합니다."
 ISR_national_camp: "민족 진영 결성"
 ISR_national_camp_desc: "부패하고 부정직한 수사로 인해 모든 좌파 및 중도 정당이 네타냐후를 보이콧하며 그 아래에서 연정에 참여하기를 거부하고 있습니다. 그렇다면 그렇게 하라지요! 우리는 새롭고 비전통적인 파트너를 찾겠습니다. 민족 진영은 함께 이스라엘의 안보를 여러 세대에 걸쳐 지켜낼 것입니다."
 ISR_corrupt_likud: "당 장악"
 ISR_corrupt_likud_desc: "리쿠드당에는 네타냐후가 이끄는 훨씬 큰 포퓰리스트 보수 진영과 달리 강력한 자유주의적·이념적 분파가 있습니다. 기드온 사르 같은 인물이 이끄는 이 일파는 당 운영에서 밀어내고, 당을 비비의 개인적 구상에 맞게 장악해야 합니다."
 ISR_request_immuity: "면책 특권 요청"
 ISR_request_immuity_desc: "이른바 '사건'들이 법정에서 하나둘 무너지고 있음을 대중도 분명히 알 수 있지만, 대중의 시각이 인정받도록 하기 위해 의회에 면책 특권을 요청해야 합니다. 국가 원수와 정부 수반에 대한 수사를 금지하는 이른바 '프랑스 법'을 검토해야 합니다."
 ISR_witch_hunt: "마녀사냥 선포"
 ISR_witch_hunt_desc: "반세기 전 히스타드루트-노동당 기득권층은 세파르딤과 미즈라힘 인구를 이스라엘 사회의 번영에서 소외시켰으며, 지금도 기득권과 관료 조직은 그 백인 준귀족들이 장악하고 있습니다. 그들은 당시 네타냐후 유권자들의 부모를 사냥했던 것만큼이나 오늘날 네타냐후를 쫓고 있습니다. 현직 총리를 끌어내리려는 시도라니, 참으로 비겁합니다!"
 ISR_reform_public_broadcasting: "제1채널 개혁"
 ISR_reform_public_broadcasting_desc: "공영 방송 기구는 1990년대에 제2채널이, 2000년대 초에 제10채널이 개국하기 전까지 40여 년간 이스라엘의 유일한 텔레비전 채널이었습니다. 현재 진행 중인 제1채널의 재편과 민영화를 활용하여 이를 보다 '균형 잡힌' 우파 성향의 채널로 바꾸려 시도해야 합니다."
 ISR_attack_the_media: "언론 공격"
 ISR_attack_the_media_desc: "사법부와 경찰처럼 언론 또한 좌파 패거리에게 장악되어 부패했으며 가짜 뉴스를 사방에 퍼뜨리고 있습니다. 이에 맞서 싸우고 국민에게 그들의 선전을 알려야 합니다!"
 ISR_lo_haya_klum: "'아무것도 없었다, 아무것도 없다!'"
 ISR_lo_haya_klum_desc: "이스라엘 경찰과 검찰총장이 대중에게 내놓은 사건들은 너무나 가짜여서, 좌파의 압력으로 인기 있는 우파 총리를 몰아내려는 음모임이 명백합니다. 우리는 저항할 것입니다! 아무것도 없었으니, 아무것도 없는 것입니다!"
 ISR_bibism: "비비즘"
 ISR_bibism_desc: "최근 선거는 국민이 안보를 '미스터 시큐리티'에게 맡겼음을 보여 주었습니다. 네타냐후야말로 거대한 리쿠드를 이끌고 모든 좌파에 맞서 이스라엘의 경제와 안보를 지킬 수 있는 유일한 인물입니다."
 ISR_netanyahu_plan: "왕의 프로그램"
 ISR_netanyahu_plan_desc: "네타냐후는 자신의 비전에 따라 구축한 구체적인 사회 계획을 가지고 있습니다. 이제 이를 실행에 옮길 때입니다."
 ISR_pension_reform: "연금 개혁"
 ISR_pension_reform_desc: "예산 문제를 고려할 때 연금을 개혁하고 새로운 계획을 승인해야 합니다."
 ISR_lower_income_tax: "소득세 인하"
 ISR_lower_income_tax_desc: "세금이 역동적이고 성장하는 우리 경제를 질식시키지 않도록 하면서 소득세를 줄여야 합니다."
 ISR_shrink_the_public_sector: "공공 부문 축소"
 ISR_shrink_the_public_sector_desc: "전임자들의 정책이 행정 기구를 불균형할 정도로 비대하게 만들었습니다. 민간 부문이 스스로 규율하도록 해야 합니다."
 ISR_reform_bituach_leumi: "국민보험 개혁"
 ISR_reform_bituach_leumi_desc: "국민보험공단은 급여 지급을 통해 일시적이거나 장기적인 어려움에 처한 취약 계층과 가정에 경제적 보호를 제공합니다."
 ISR_bachar_reform: "바카르 위원회"
 ISR_bachar_reform_desc: "새로운 바카르 계획은 실적, 서비스 품질, 신뢰성에 기반한 시장 경쟁을 강화할 것입니다."
 ISR_cut_social_spending: "사회 지출 삭감"
 ISR_cut_social_spending_desc: "모든 계층에 공짜로 돈을 나눠주는 일을 멈출 때입니다. 사회 지원 비용 일부를 삭감하고 절감한 돈을 다른 목적에 사용해야 합니다."
 ISR_cut_child_benefits: "아동 수당 삭감"
 ISR_cut_child_benefits_desc: "정통파는 아무런 책임도 지지 않고 이스라엘의 존재 사실조차 부인하면서 매우 빠르게 불어나고 있습니다... 이들에 대한 지원을 줄일 때입니다."
 ISR_world_populists: "세계 포퓰리스트 지지"
 ISR_world_populists_desc: "외교 정책에 대한 견해는 다르지만, 세계에는 우리와 비슷한 이념적 기반을 가진 정치인이 많으며 그들과 친분을 쌓으려 노력해야 합니다."
 ISR_euroscepticism: "유럽 회의주의 장려"
 ISR_euroscepticism_desc: "이스라엘에서는 좌파 정당 사이에 친유럽 노선을 택하는 경향이 있습니다. 이스라엘뿐 아니라 유럽 전역의 유럽 회의주의를 지지하여 이러한 정서를 꺾어야 합니다."
 ISR_befriend_russia: "러시아 국빈 방문"
 ISR_befriend_russia_desc: "러시아를 방문하여 외교 관계를 이어갈 때입니다."
 ISR_befriend_republicans: "공화당 우대"
 ISR_befriend_republicans_desc: "우리의 정치적 이익을 위해 공화당과의 관계를 유지하고, 이 관계를 앞으로의 정치적 목적에 활용해야 합니다."
 ISR_befriend_brazil: "브라질 방문"
 ISR_befriend_brazil_desc: "묘하게도 브라질의 최근 정치적 변화로 우리와 브라질 사이의 외교 관계가 유리해졌습니다. 이를 활용해야 합니다."
 ISR_befriend_trump: "미국 우파와 친선"
 ISR_befriend_trump_desc: "미국의 보수 세력과 우파가 항상 우리에게 한결같이 호의적인 것은 아니지만, 우리의 정치적 견해가 놀랍도록 일치하므로 이를 활용해야 합니다."
 ISR_support_hungary: "헝가리 국빈 방문"
 ISR_support_hungary_desc: "헝가리는 최근 정치적으로 우경화되었으며 우리와의 협력에 관심을 보였습니다. 이를 활용할 만합니다."
 ISR_matter_of_poland: "폴란드 문제"
 ISR_matter_of_poland_desc: "폴란드는 지나치게 많은 것을 자기 몫으로 챙겼으며 20세기 사건에 대한 자국의 연루를 부인합니다. 이를 정리하고 그들에게 분명한 질문을 던질 때입니다."
 ISR_tama_38: "타마 38 프로그램"
 ISR_tama_38_desc: "타마 38은 건물이 보강 공사를 받는 세입자에게 건축권을 부여합니다"
 ISR_harish: "하리시 개발"
 ISR_harish_desc: "하리시는 이스라엘 하이파 지구에 있는 도시입니다. 이곳을 우리 사업의 중심지로 만들어야 합니다."
 ISR_kachlon_program: "카흘론 개혁"
 ISR_kachlon_program_desc: "모셰 카흘론 재무장관은 시장 집중, 생활비, 생산성, 주택 위기와 같은 문제를 해결하기 위한 여러 개혁을 포함한 경제 계획안을 발표했습니다."
 ISR_reform_doar: "우정 사업 개혁"
 ISR_reform_doar_desc: "이스라엘 우정 개혁의 일환으로 정부는 이스라엘 우정청이 법정 기관으로서의 운영을 중단하고 모든 업무를 새로 설립되는 국영 기업으로 이관하기로 결정했습니다."
 ISR_reform_hashmal: "전력 서비스 규제 완화"
 ISR_reform_hashmal_desc: "카흘론 개혁안의 일환으로 전력망과 전력 서비스에 대한 규제를 완화해야 합니다."
 ISR_privatize_bank_leumi: "레우미 은행 민영화"
 ISR_privatize_bank_leumi_desc: "레우미 은행은 이스라엘의 은행입니다. 1902년 2월 27일 야파에서 앵글로 팔레스타인 회사로 설립되었으며, 이는 훗날 이스라엘이 되기를 바랐던 땅의 산업, 건설, 농업, 인프라를 촉진하고자 시온주의 운동 인사들이 런던에서 앞서 결성한 유대 식민 신탁의 자회사였습니다."
 ISR_open_skies_desc: "항공 자유화 협정은 항공 운임을 낮추고 추가 노선 개설을 촉진하므로 이스라엘 경제에 큰 도움이 될 것으로 평가됩니다."
 ISR_privatize_elal: "엘알 항공 민영화"
 ISR_privatize_elal_desc: "엘알은 이스라엘의 국적 항공사로서 국가를 대표하는 항공사입니다. 아프리카, 아시아, 유럽, 북아메리카에도 취항하며 48개 도시에 운항합니다."
 ISR_gas_deal: "가스전 규제 완화법"
 ISR_gas_deal_desc: "우리 개혁의 다음 일관된 단계는 더 많은 가스 기업을 우리 시장으로 끌어들이는 것입니다."
 ISR_shtrum_committee_desc: "슈트룸 위원회는 이스라엘 금융 체계의 경쟁을 높이기 위한 정책을 권고할 합동 위원회입니다."
 ISR_path_plus: "패스 플러스 프로그램"
 ISR_path_plus_desc: "이제 자동차 소유자의 이동 선택지를 늘리기 위해 고속도로를 넓히고 새로운 차선을 추가해야 합니다."
 ISR_road_6: "6번 도로 건설"
 ISR_road_6_desc: "6번 고속도로는 이스라엘 최초로 건설되는 건설-운영-양도 방식 도로로, 일정 기간 통행료를 징수할 수 있는 양허를 대가로 주로 민간 부문이 시공합니다. 또한 이스라엘에서 추진될 최대 규모의 인프라 사업 중 하나입니다."
 ISR_supertanker: "슈퍼탱커 가동"
 ISR_supertanker_desc: "이스라엘 모든 계층의 국민을 위한 저렴한 신규 주택 공급 기회를 만들어야 합니다. 이는 민간 건설업체가 참여하여 이스라엘 전 지역을 완전히 정착시키는 계획이 될 것입니다."
 ISR_legalize_cannabis_desc: "한 현자가 어느 날 말했습니다.\n\n§G지구상에서 가장 큰 살인자는 스트레스이며, 가장 좋은 약은 여전히 대마초라고 생각한다.§!"
 ISR_tourism_gay_parade: "텔아비브 퍼레이드 홍보"
 ISR_tourism_gay_parade_desc: "텔아비브의 게이 프라이드 퍼레이드를 이 ... 행진을 구경하러 올 서방 관광객을 끌어들이는 미끼로 활용해야 합니다."
 ISR_association_agreement_usa: "미국 제휴 협정"
 ISR_association_agreement_usa_desc: "우리의 이해관계가 걸린 지역 현안, 그리고 우리와 미국 사이의 경제·정치 협정에 대해 공통되고 통일된 입장을 채택할 새로운 기구를 만들어 달라고 미국에 요청해야 합니다."
 ISR_association_agreement_eu: "유럽 제휴 협정"
 ISR_association_agreement_eu_desc: "우리의 이해관계가 걸린 지역 현안, 그리고 우리와 유럽 연합 사이의 경제·정치 협정에 대해 공통되고 통일된 입장을 채택할 새로운 기구를 만들어 달라고 유럽 연합에 요청해야 합니다."
 ISR_cyprus_marriage: "키프로스와의 합의"
 ISR_cyprus_marriage_desc: "종교적인 이유로 이스라엘 국내에서는 민사 혼인을 허용할 수 없으므로, 종교법을 우회하기 위해 이러한 혼인을 등록하도록 키프로스와 협상해야 합니다."
 ISR_likud_family_values_desc: "우리 유대 민족은 강한 가족 유대와 강한 공동체를 포함하는 전통적인 유대 가족 가치 위에 세워졌습니다."
 ISR_likud_lgbt_acceptance: "자랑스러운 리쿠드당원 결성"
 ISR_likud_lgbt_acceptance_desc: "리쿠드 프라이드는 이스라엘 우파 리쿠드당과 연계되어 설립된 보수 성향의 LGBT 단체입니다."
 ISR_privatize_ports: "항만청 해체"
 ISR_privatize_ports_desc: "항만 위원회를 해산하고 외부 투자자와 협상하여 항만 위원회를 우리에게 완전히 이관받아야 합니다."
 ISR_likud_sephardic_crisis: "용을 사슬로 묶다"
 ISR_likud_sephardic_crisis_desc: "세파르딤을 우리 사회에 통합하기 위해 더 많은 노력을 기울이고 더 큰 결속을 위한 우호적 여건을 만들어야 합니다."
 ISR_shas_path: "세파르딤 토라 준수자"
 ISR_shas_path_desc: "샤스는 이스라엘의 시온주의 하레디 종교 정당입니다. 1984년 오바디아 요세프 랍비의 지도 아래 창당되었으며 주로 세파르딤 및 미즈라힘 하레디 유대인의 이익을 대변합니다."
 ISR_the_transparents: "투명 인간들을 돌보라"
 ISR_the_transparents_desc: "유대교 원칙을 준수하고 우리 사회의 상호 사회적 지원을 강화해야 합니다."
 ISR_baalei_teshuva: "바알레이 테슈바"
 ISR_baalei_teshuva_desc: "하레디 공동체가 만족하도록 사회 지출을 늘려야 합니다."
 ISR_haredi_arab: "하레디-아랍 협력"
 ISR_haredi_arab_desc: "하레디-아랍 협력을 관리하여 상호 정치적 지지 면에서 좋은 성과를 얻을 수도 있습니다. 하지만 반대로 흘러갈 수도 있습니다."
 ISR_legacy_of_yosef: "오바디아 요세프의 유산"
 ISR_legacy_of_yosef_desc: "오바디아 요세프는 이라크 출신의 탈무드 학자이자 포세크였으며, 1973년부터 1983년까지 이스라엘의 세파르딤 수석 랍비를 지냈고, 이스라엘 초정통파 샤스당의 창립자이자 오랜 정신적 지도자였습니다."
 ISR_adinas_donations: "아디나의 기부"
 ISR_adinas_donations_desc: "샤스당의 관행을 이어 가고 지지하며 빈민을 위한 기부를 해야 합니다."
 ISR_strong_aryeh: "강한 사자"
 ISR_strong_aryeh_desc: "샤스와의 연정은 이전보다 훨씬 견고해졌으며, 이를 활용해 하레디 유대인 사이에서 우리의 인기를 높여야 합니다."
 ISR_food_checks: "빈민을 위한 식량 쿠폰"
 ISR_food_checks_desc: "우리나라에는 자신과 가족의 식량조차 감당하지 못하는 이들이 많습니다. 모두가 먹을 수 있도록 보장하고 빈민에게 식량 쿠폰을 제공해야 합니다."
 ISR_crown_to_its_former_glory: "레하히르 아타라 레요슈나"
 ISR_crown_to_its_former_glory_desc: "우리의 왕관을 옛 영광으로 되돌리고 우리나라에 대한 서방의 영향력을 줄여야 합니다."
 ISR_yemenite_affair: "예멘 아동 사건 조사"
 ISR_yemenite_affair_desc: "예멘 아동 사건은 1948년부터 1954년까지 새로 건국된 이스라엘 국가에서 이민자의 아기와 유아, 주로 예멘계 유대인 아이들이 사라진 일을 가리킵니다."
 ISR_sephardic_cultural_heritage: "세파르딤 유산 보호"
 ISR_sephardic_cultural_heritage_desc: "세파르딤 유산을 보호하고 교육 과정에서 세파르딤 유대인의 역사를 장려해야 합니다."
 ISR_toranic_education: "할라카 교육 지원"
 ISR_toranic_education_desc: "세파르딤 초정통파를 위한 샤스당의 특별 토라 교육 체계를 지원해야 할지도 모릅니다."
 ISR_utj_path: "토라와 안식일 유대교"
 ISR_utj_path_desc: "선거 상징에서 따와 흔히 김멜이라 불리는 통합 토라 유대교는 아구닷 이스라엘과 데겔 하토라 사이의 하레디 종교 보수 정치 연합입니다. 이스라엘의 다른 종교 정당과 달리 통합 토라 유대교는 비시온주의이며 사회민주주의적 성향도 일부 띱니다."
 ISR_tal_law: "탈 법"
 ISR_tal_law_desc: "1949년 이래 초정통파 공동체는 가치관과 충돌한다는 이유로 비공식적으로 병역을 면제받아 왔습니다. 이제 너무나 중요해서 IDF에서 복무할 수 없는 우리 예시바 학생들에게 병역 면제를 부여하는 공식 법률을 통과시킬 때입니다."
 ISR_reject_liba: "리바 제재 우회"
 ISR_reject_liba_desc: "영어 교육을 포함하는 교육부 핵심 교육과정 리바는 특정 집단이 히브리어와 기타 종교 과목만 가르치는 것을 막기 위해 도입되었습니다. 이 결정은 우리 청년들에게 우리 문화를 가르칠 자율성을 해치므로 번복되어야 합니다. 영어를 가르칠지 말지는 그들이 정하게 하십시오."
 ISR_obstruct_mamlakhti: "마마크 방해"
 ISR_obstruct_mamlakhti_desc: "마마크는 영어, 수학 등의 과목을 자체적으로 가르치는 정통파의 대안 교육과정입니다. 그러나 여전히 지나치게 진보적이어서 우리 어린 학생들의 정신을 위협할 것입니다. 이를 없애지는 않겠지만 적용을 조금 더 어렵게 만듭시다."
 ISR_shopkeepers_law: "상점 주인 법"
 ISR_shopkeepers_law_desc: "토라는 안식일이 유대인에게 쉬는 날이며 어떤 노동도 해서는 안 된다고 분명히 말합니다. 이를 법으로 정하여 이날 상점과 시장의 문을 닫도록 의무화하겠습니다."
 ISR_saturday_construction: "오직 피쿠아흐 네페쉬만"
 ISR_saturday_construction_desc: "안식일에는 건설을 포함한 어떤 노동도 허용되지 않으며, 할라카로 알려진 개념인 인명 보호, 곧 피쿠아흐 네페쉬만이 예외입니다. 안식일에 모든 건설 공사의 진행을 금지하겠습니다."
 ISR_new_conscription_law: "신 징병법"
 ISR_new_conscription_law_desc: "우리의 안보는 중요하지만 우리 젊은 학생들의 토라 교육은 그보다 더 중요합니다. 이들이 방위군의 강제 징병으로 그토록 많은 시간을 낭비해서는 안 됩니다."
 ISR_anti_reformism: "개혁파 규탄"
 ISR_anti_reformism_desc: "개혁 유대교는 매우 자유주의적인 유대교 갈래로, 의식과 개인적 준수에 거의 비중을 두지 않고 유대법을 구속력 없는 것으로 보며 (LGBTQ+ 공동체를 포함한) 현대적 감수성을 받아들이는 것이 특징입니다. 주로 미국에서 발전했습니다."
 ISR_kotel_protocols: "코텔 여성 문제"
 ISR_kotel_protocols_desc: "코텔 여성이라고도 알려진 '성벽의 여성들'은 토라 낭독 시 남녀가 분리되는 서쪽 벽의 성별 분리를 없애기 위해 싸우는 페미니즘 단체입니다."
 ISR_segregated_prayers: "기도 분리"
 ISR_segregated_prayers_desc: "성벽의 여성들은 서쪽 벽에서 토라를 낭독할 때의 성별 분리를 없애려 하고 있습니다. 이는 전혀 말이 되지 않으며, 오히려 이를 막기 위해 더 견고한 장벽을 세우겠습니다."
 ISR_anti_lgbt_propaganda: "헤즈볼라보다 나쁜 자들"
 ISR_anti_lgbt_propaganda_desc: "LGBTQ+ 사람들은 우리 모두를 토라가 아닌 죄악에 묶어 약하게 만들고 있습니다."
 ISR_rz_path: "종교 시온주의당"
 ISR_rz_path_desc: "트쿠마 또는 민족 연합-트쿠마로도 알려진 종교 시온주의당은 극우, 초민족주의, 유대인 우월주의, 종교 시온주의 정당입니다."
 ISR_subsidize_outposts: "전초기지 보조금"
 ISR_subsidize_outposts_desc: "서안 지구의 친구들과 형제들을 보조하지 않을 이유가 있겠습니까? 그들은 지속 가능한 농업 경제를 구축하는 데 우리의 도움이 필요합니다. 그들이 어떤 땅을 점유하고 있는지는 중요하지 않습니다."
 ISR_settlements_subsidized_1: "정착촌 보조금 - 새 출발"
 ISR_settlements_subsidized_1_desc: "정착촌의 형제들은 이스라엘 경제의 안정적인 새 기둥을 세우기 위해 약간의 자금이 필요합니다."
 ISR_settlements_subsidized_2: "정착촌 보조금 - 땅의 기둥"
 ISR_settlements_subsidized_2_desc: "정착촌의 형제들은 점점 강해지고 있지만, 확장하려면 자금이 조금 더 필요합니다."
 ISR_economic_settlers: "경제적 정착 장려"
 ISR_economic_settlers_desc: "우리 도시의 생활비는 어쨌든 너무 높으니, 사람들이 저렴한 비용으로 가정을 꾸릴 수 있는 정착촌으로 이주하도록 장려합시다."
 ISR_protect_terrorists: "모든 타협 규탄"
 ISR_protect_terrorists_desc: "수년간 지금은 해체된 카흐당에 참여했던 우리 형제들 가운데 일부는 테러범으로 묘사되어 왔지만, 사실 그들은 애국자이며 투옥될 이유가 없습니다. 오히려 사면을 받아야 합니다."
 ISR_protect_ideological_core: "이념의 기둥"
 ISR_protect_ideological_core_desc: "군대, 성서, 땅은 우리 사회의 기둥이며 안정적이고 견고한 공동체를 지키는 데 모두 근본이 됩니다. 다만 우리의 의제에서 무엇을 우선시할지 선택해야 합니다."
 ISR_denounce_mafdal: "자유주의 마프달 지지자 비난"
 ISR_denounce_mafdal_desc: "마프달, 정확히는 민족종교당은 이스라엘에서 종교 시온주의 이념을 대표하던 정당이었습니다. 그러나 이들은 너무 유약하여 우리 사회를 안정시키기에는 역부족입니다!"
 ISR_late_marriage: "만혼 대응"
 ISR_late_marriage_desc: "통계에 따르면 이스라엘 부부의 50%가 30세가 넘어서 결혼합니다. 조혼을 장려하고 가능한 한 빨리 새로운 어린 이스라엘 국민을 낳도록 독려해야 합니다."
 ISR_promote_early_marriage: "조혼 장려"
 ISR_promote_early_marriage_desc: "빠르게 고령화되는 사회에서는 조혼을 통해 가능한 한 많은 신생아의 출생을 장려하는 것이 중요합니다."
 ISR_civilian_oversight: "민정 당국 감독"
 ISR_civilian_oversight_desc: "서안 지구에 민간 정부를 세울 때입니다. 물론 이스라엘인이 이끄는 정부여야 합니다."
 ISR_jewish_home_path: "유대인의 집"
 ISR_jewish_home_path_desc: "민족종교당 종교 시온주의, 곧 마프달 종교 시온주의는 이스라엘의 우파 종교 시온주의 정당입니다. 1998년 창당 이후 모든 선거에서 이 정당은 다른 정파와 손잡고 연합 명부의 일원으로 출마했습니다."
 ISR_get_five: "'5점을 받아라!'"
 ISR_get_five_desc: "기술적 사고방식을 북돋우고 간접적으로 우리 IT 부문을 지원하기 위해 학교에서 수학 교육을 장려해야 합니다."
 ISR_dont_apologize_desc: "극우는 욕설이 아닙니다! 우리가 달고 모두에게 보여 주는 명예로운 휘장입니다. 반대자들이 부러워하게 하십시오!"
 ISR_kaminitz_law: "카미니츠 법 제정"
 ISR_kaminitz_law_desc: "카미니츠 법은 행정 당국이 사법 체계를 거치지 않고 철거 및 공사 중지 명령, 건축 장비와 차량 압수, 체포 등의 처벌을 부과할 권한을 부여합니다."
 ISR_associations_law: "결사법 서명"
 ISR_associations_law_desc: "결사법은 회원이나 동반자들로 이루어진 다양한 결사체를 규율하는 법과 규칙의 집합입니다."
 ISR_conservative_judges: "느린 혁명"
 ISR_conservative_judges_desc: "우리 정치·사회 문화의 퇴보를 막기 위해 보수적인 인사를 다양한 정부 직책에 임명해야 합니다."
 ISR_nation_state: "민족국가 법안"
 ISR_nation_state_desc: "민족국가 법안은 이스라엘이 유대인의 민족국가로서 역할을 다하기 위해 이행해야 할 여러 역할과 책임을 규정합니다."
 ISR_bennet_rule: "베네트의 부상"
 ISR_bennet_rule_desc: "나프탈리 베네트는 이스라엘의 하이테크 기업가입니다. 1990년대 이스라엘 국방군에서 병역을 수행하는 동안 적진 후방에서 활동하는 정예 특공대인 사이렛 마트칼과 마글란에서 복무했습니다. 이후 예루살렘 히브리 대학교에서 법학 학위를 취득했습니다. 이스라엘로 이민 온 미국인 부부의 아들인 베네트는 이스라엘을 떠나 뉴욕으로 가 1999년 사기 방지 소프트웨어 회사를 공동 창업했습니다."
 ISR_promote_trickle_down: "레이건 시절처럼"
 ISR_promote_trickle_down_desc: "미국의 보수적 모델을 우리의 새 정책의 본보기로 삼아야 합니다. 좋았던 레이건 시절처럼 말입니다!"
 ISR_machette_bureaucracy: "정부의 마체테"
 ISR_machette_bureaucracy_desc: "정의의 마체테로 무능한 자들로 가득한 국가 기구를 베어낼 때입니다!"
 ISR_limit_the_labor: "히스타드루트 제한"
 ISR_limit_the_labor_desc: "노동조합은 노동자에게 장애물을 만드는 것 외에는 아무 쓸모가 없습니다. 이들이 경제에 미치는 영향력을 제한해야 합니다."
 ISR_tax_reductions: "부유층 세금 감면"
 ISR_tax_reductions_desc: "부자에게 왜 세금을 매깁니까? 사람들이 부자가 되지 못하게 하는 선례만 만들 뿐입니다. 이를 끝내야 합니다."
 ISR_crush_the_shelters: "쉼터 단체 분쇄"
 ISR_crush_the_shelters_desc: "로비스트들이 기생충처럼 우리 정치 생활의 모든 부분에 침투했습니다. 이를 막아야 합니다!"
 ISR_a_new_singapore: "싱가포르 계획 달성"
 ISR_a_new_singapore_desc: "싱가포르의 사례를 본받아 이스라엘을 세계 제일의 사업 환경을 갖춘 곳으로 만들 계획을 실행해야 합니다."
 ISR_shaked_rule: "아옐렛 샤케드에게 힘을 실어라"
 ISR_shaked_rule_desc: "아옐렛 샤케드는 이스라엘의 정치인이자 활동가이며 소프트웨어 엔지니어입니다. 종교 정당인 유대인의 집에 몸담았음에도 세속주의자를 자처해 왔습니다. 정계에 입문하기 전 샤케드는 텔아비브 대학교를 졸업한 직후 텍사스 인스트루먼츠에서 엔지니어로 일하며 이스라엘 하이테크 업계에서 경력을 시작했습니다."
 ISR_trust_busting: "불 무스처럼"
 ISR_trust_busting_desc: "시어도어 루스벨트와 그의 정치 프로그램 및 이상에서 힌트를 얻어야 합니다. 그것이 이스라엘에 필요한 것입니다."
 ISR_over_legislation: "과잉 입법 대응"
 ISR_over_legislation_desc: "입법 체계를 그 기능에 어울리지 않는 규모로 비대하게 만드는 일을 멈춰야 합니다."
 ISR_promote_national_service: "국가 봉사 장려"
 ISR_promote_national_service_desc: "정통파 여성은 군에서 복무할 수 없지만, 공공 부문에서의 국가 봉사를 제안할 수 있습니다."
 ISR_public_works: "공공사업 활용"
 ISR_public_works_desc: "공공사업이 상시적이고 계획적으로 추진되는 여건을 조성할 필요가 있습니다."
 ISR_israels_thatcher: "대처의 정신"
 ISR_israels_thatcher_desc: "영국식 실용주의를 따르고 마거릿 대처의 정신을 상징적으로 되살려야 합니다."
 ISR_russian_party_path: "이스라엘은 우리의 집"
 ISR_russian_party_path_desc: "이스라엘 베이테누는 이스라엘의 보수 정당입니다. 이 정당의 기반은 원래 세속적인 러시아어권 이민자였으나, 해당 계층의 지지는 줄어들고 있습니다."
 ISR_retirement_homes: "양로원 지원"
 ISR_retirement_homes_desc: "양로원을 지원하고 우리 노년층이 편안하고 평화롭게 살도록 보장해야 합니다."
 ISR_soviet_voters: "소련계 유권자 공략"
 ISR_soviet_voters_desc: "러시아어를 쓰는 유대인 다수는 여전히 러시아 문화와 강하게 연결되어 있습니다. 우리의 광고와 정책으로 그들에게 호소해야 합니다."
 ISR_russian_tv: "러시아어 텔레비전 채널"
 ISR_russian_tv_desc: "구소련권에서 귀환하는 새 시민들 중 다수가 히브리어를 하지 못합니다. 이들이 나머지 사람들과 더 원활하게 어울리도록 러시아어 TV 채널을 만들고 러시아 채널이 이스라엘에서 방송되도록 허용해야 합니다."
 ISR_five_mems: "다섯 개의 멤 채택"
 ISR_five_mems_desc: "자보틴스키의 다섯 개의 멤(M)은 수정주의 시온주의의 핵심 요소로, 마카비(군사력), 마사다(영웅적 정신), 미쉬칸(정신적 유산), 멜루하(정치적 주권), 모아딤(전통을 통한 민족 단결)을 나타냅니다. 이는 유대인의 회복력, 자립, 국가 건설을 강조합니다."
 ISR_citizenship_law: "'충성 없이 시민권 없다!'"
 ISR_citizenship_law_desc: "아랍인은 우리나라에서 살려면 충성 서약을 해야 합니다. 이질적 요소의 완전한 충성을 보장하는 데 반드시 필요합니다."
 ISR_empower_city_rabbis: "도시 랍비 육성"
 ISR_empower_city_rabbis_desc: "도시의 종교 권위를 우대하여 정신적 합의를 개혁파 중심으로 모아야 합니다."
 ISR_reform_conversions: "유대교 개종 개혁"
 ISR_reform_conversions_desc: "유대교로 개종한 이들이 이스라엘로 귀환하도록 허용해야 합니다. 그들도 우리와 다름없는 유대인입니다."
 ISR_promote_aliyah: "유대 세계"
 ISR_promote_aliyah_desc: "모든 유대인이 이스라엘로 돌아오도록 장려하고 알리야를 독려해야 합니다."
 ISR_national_secular_government: "민족 세속 정부"
 ISR_national_secular_government_desc: "이제 우리는 완전한 민족 국가이자 세속 국가가 될 것입니다."
 ISR_aliyah_encouraged: "알리야 장려"
 ISR_new_hope_path: "새로운 희망"
 ISR_new_hope_path_desc: "2020년 말 기드온 사르는 국가 안보, 좋은 행정, 사법 개혁을 우선시하는 중도우파 이스라엘 정당 새로운 희망을 결성했습니다. 집권을 유지하는 데 어려움을 겪고 있지만, 리쿠드의 온건한 대안이 되고자 합니다."
 ISR_gantz_tree: "이스라엘 회복력"
 ISR_gantz_tree_desc: "베니 간츠는 이스라엘의 정치인이자 퇴역 육군 장성입니다. 중도 성향이며 군사주의적 정치 입장을 취합니다. 회복력당은 2018년 말에 결성되었습니다."
 ISR_radical_centrism_desc: "더 이상 이념 논쟁에 집중하지 말고 이상을 추구해야 합니다. 이념보다 실천을 우선시하는 급진적 중도주의를 지향해야 합니다."
 ISR_general_politics: "장군의 정치"
 ISR_general_politics_desc: "간츠는 전직 장군이며 그의 정치적 포부와 질서 의식은 실로 군대식입니다."
 ISR_above_all: "이스라엘 리프네이 하콜"
 ISR_above_all_desc: "우리의 정치적 행동을 이끌어야 할 원칙은 하나, 이스라엘이 무엇보다 우선한다는 것입니다!"
 ISR_increase_army_pay: "우리의 아들딸들"
 ISR_increase_army_pay_desc: "국방비를 늘리고 이스라엘의 아들딸들이 필요한 모든 것을 받도록 보장해야 합니다."
 ISR_increase_pensions: "시민 연금 인상"
 ISR_increase_pensions_desc: "은퇴한 시민들의 연금을 인상해야 합니다. 그들은 마땅히 받아야 할 것을 받아야 합니다."
 ISR_attorney_general: "검찰총장실 분리"
 ISR_attorney_general_desc: "검찰총장과 수석 검사의 직위를 분리해야 합니다."
 ISR_regulate_ottoman_agencies: "오스만 기관 정비"
 ISR_regulate_ottoman_agencies_desc: "오스만 시대의 기관들은 현재 상태로는 비효율적이므로 이를 정비해야 합니다."
 ISR_the_begin_project: "시작 프로젝트"
 ISR_the_begin_project_desc: "우리가 이념적으로 리쿠드와 같은 편에 서 있음에도 그 정당의 부패 행태를 지지하지는 않습니다."
 ISR_shasha_biton: "샤샤-비톤 계획"
 ISR_shasha_biton_desc: "우리나라에서 완전한 교육이 이루어지도록 중하층과 중산층을 위한 교육을 개선해야 합니다."
 ISR_social_cabinet: "사회경제 내각"
 ISR_social_cabinet_desc: "새 내각은 경제 문제에 정확히 집중해야 합니다."
 ISR_national_unity: "국민통합 진영"
 ISR_national_unity_desc: "우리의 새 연정은 우파 노선을 추구하고 강하고 회복력 있는 이스라엘을 건설해야 합니다!"
 ISR_bluewhite: "청백 연합이 결성되었습니다!"
 ISR_blue_white: "청백"
 ISR_blue_white_desc: "우리의 새 연정은 평등과 안정을 새로운 핵심 가치로 삼아 새로운 이스라엘을 건설해야 합니다."
 ISR_limit_terms: "임기 제한 도입"
 ISR_limit_terms_desc: "민주적 절차의 지속을 보장하도록 선거법을 개정해야 합니다."
 ISR_empower_regional_governments: "지방 정부 육성"
 ISR_empower_regional_governments_desc: "지방 정부를 육성하여 스스로를 다스리는 데 더 실질적인 권한을 부여해야 합니다."
 ISR_reform_electoral_system: "선거 제도 개혁"
 ISR_reform_electoral_system_desc: "비례대표 중심 대표 체계에서 선거구 중심 체계로 전환해야 합니다."
 mofaz_rules: "카디마가 결성되었습니다!"
 ISR_olmert_focus: "새로운 정치 시대"
 ISR_olmert_focus_desc: "에후드 올메르트는 이스라엘의 정치인이자 변호사입니다. 그의 정당 카디마는 이스라엘의 중도 자유주의 정당입니다."
 ISR_mofaz: "모파즈의 정책 시행"
 ISR_mofaz_desc: "샤울 모파즈는 이스라엘의 퇴역 군인이자 정치인입니다. 1966년 이스라엘 국방군에 입대하여 공수 여단에서 복무했습니다. 공수부대 및 정예 특수부대 사이렛 마트칼과 함께 6일 전쟁, 욤 키푸르 전쟁, 1982년 레바논 전쟁, 엔테베 작전에 참전했습니다. 1998년에는 IDF 제16대 참모총장이 되었습니다."
 ISR_livni: "리브니의 정책 시행"
 ISR_livni_desc: "치포라 말카 리브니는 이스라엘의 정치인이자 외교관, 변호사입니다. 일부에게는 이스라엘-팔레스타인 분쟁을 해결하려는 노력으로 알려져 있습니다."
 ISR_nationalcamp: "민족 진영이 결성되었습니다!"
 ISR_continue_to_change: "우리는 계속 변화한다!"
 ISR_continue_to_change_desc: "변화는 불가피하며, 우리를 앞으로 이끄는 진보를 우리가 장악해야 합니다!"
 ISR_merav_cohen_plan: "코헨의 노인 돌봄"
 ISR_merav_cohen_plan_desc: "코헨은 사회 지원 개혁에 관한 구체적인 계획을 가지고 있습니다. 이 계획은 실현되어야 합니다."
 ISR_lapid_histadrut: "나라의 목줄을 쥐다"
 ISR_lapid_histadrut_desc: "사회 복지를 신속하게 개혁하고 국민에 대한 지원을 늘려야 합니다."
 ISR_ministry_of_social_development: "사회개발부"
 ISR_ministry_of_social_development_desc: "새로운 사회개발부를 창설하고 가능한 한 최대한 지원해야 합니다."
 ISR_holocaust_survivors: "생존자 무상 의료"
 ISR_holocaust_survivors_desc: "홀로코스트 생존자를 존중으로 대하고 무상 의료를 제공해야 합니다."
 ISR_disabled_people: "장애인 복지 증진"
 ISR_disabled_people_desc: "우리 사회의 장애인을 지원하고 그들에게 배정하는 예산을 늘려야 합니다."
 ISR_take_money_from_settlements: "정착촌 예산 재조정"
 ISR_take_money_from_settlements_desc: "정착촌이야말로 우리 예산을 바닥내는 존재입니다! 마침내 그들에게서 되찾아야 합니다!"
 ISR_take_money_from_yeshivas: "예시바 예산 재조정"
 ISR_take_money_from_yeshivas_desc: "예시바가 우리 예산을 갉아먹고 있으니 그들에게서 돈을 되찾아야 합니다!"
 ISR_where_is_the_money: "'돈은 어디에 있는가?'"
 ISR_where_is_the_money_desc: "납세자들의 돈이 어디로 흘러가는지 조사해야 합니다. 우리 예산은 영원하지 않습니다!"
 ISR_yesh_atid_focus: "미래가 있다"
 ISR_yesh_atid_focus_desc: "예시 아티드는 이스라엘의 중도 자유주의 시온주의 정당입니다. 2012년 4월, 전 신누이당 정치인이자 이스라엘 법무장관이었던 토미 라피드의 아들이며 TV 언론인인 야이르 라피드가 창당했습니다."
 ISR_middle_class: "중산층의 전쟁"
 ISR_middle_class_desc: "중산층을 전폭적으로 지원하기 위해 우리의 정치적 역량을 총동원해야 합니다. 이들이야말로 우리가 집권하는 이유입니다!"
 ISR_public_residence: "공공 주택 후원"
 ISR_public_residence_desc: "공공 주택은 우리나라의 주택 문제를 해결하기 위해 활용해야 할 기적과 같은 수단입니다."
 ISR_zero_vat: "에페스 마암"
 ISR_zero_vat_desc: "부가가치세는 더 이상 존재해서는 안 됩니다. 기업에 해를 끼치고 소비자의 비용을 늘립니다."
 ISR_lapid_eu: "자유 무역 협정 확대"
 ISR_lapid_eu_desc: "유럽 연합과의 무역과 우호를 지지해야 합니다!"
 ISR_came_to_change: "우리는 변화시키러 왔다"
 ISR_came_to_change_desc: "우리는 부패와 싸우고 이러한 문제로부터 나라를 정화하러 와야 합니다."
 ISR_non_portfolio: "무임소 장관 퇴출"
 ISR_eighteen_ministers: "장관은 열여덟 명뿐"
 ISR_eighteen_ministers_desc: "정부에는 장관을 열여덟 명만 두어야 합니다."
 ISR_corruption_war: "우리는 왔고, 보았고, 싸웠다"
 ISR_corruption_war_desc: "부패와의 싸움은 체계적이어야 하며 우리 당의 방법론에 깊이 뿌리내려야 합니다."
 ISR_negotiate_syria: "시리아와 협상?"
 ISR_negotiate_syria_desc: "어쩌면 시리아 정부가 우리와의 관계를 재고하도록 설득할 수 있을지도 모릅니다."
 ISR_labour_path: "이스라엘 노동당"
 ISR_labour_path_desc: "흔히 하아보다로 알려진 이스라엘 노동당은 이스라엘의 사회민주주의 정당입니다. 복지 국가와 노동조합과의 연계를 지지하는 노동 시온주의 전통에 선 정당으로, 이스라엘-팔레스타인 평화 프로세스와 실용적인 외교 정책, 사회민주주의 경제 정책을 지지하는 정당으로 여겨졌습니다."
 ISR_haifa_model: "하이파 모델"
 ISR_haifa_model_desc: "하이파 모델을 우리 경제적 결정의 지혜를 밝히는 등대로 삼아야 합니다."
 ISR_education_relief_plan: "교육 지원 계획"
 ISR_education_relief_plan_desc: "교육 개혁을 시작하기 전에 몇 가지 지원 조치를 해야 합니다."
 ISR_smaller_classes: "학급 규모 축소"
 ISR_smaller_classes_desc: "과학적 자료에 따르면 학급 규모가 작을수록 아이들이 더 효과적으로 배웁니다. 이를 시행해야 합니다."
 ISR_israel_green_deal: "이스라엘 그린 딜"
 ISR_israel_green_deal_desc: "생태적 지속 가능성만이 우리 에너지 정책을 앞으로 나아가게 할 유일한 길입니다. 생태는 우리 미래의 보증입니다."
 ISR_social_protests: "'국민은 사회 정의를 요구한다!'"
 ISR_social_protests_desc: "이제 우리나라에서 가장 인기 있는 사회 운동 중 하나를 어떻게 할지 결정해야 합니다."
 ISR_raise_minimum_wage: "최저임금 인상"
 ISR_raise_minimum_wage_desc: "값싼 노동력의 범람을 막고 삶의 수준을 유지하기 위해 최저임금을 인상해야 합니다."
 ISR_public_transport: "대중교통 우대"
 ISR_public_transport_desc: "사제들이 아무리 불평해도, 안식일에도 대중교통을 보장하고 정통파를 우리 사회에 강제로 통합해야 합니다."
 ISR_raise_tax_on_wealthy: "부유층 세금 인상"
 ISR_raise_tax_on_wealthy_desc: "부유층은 너무 부유합니다! 그들의 돈을 더 유용한 방식으로 활용해야 합니다."
 ISR_digital_education: "디지털 교육 장려"
 ISR_digital_education_desc: "교육도 디지털화되어야 합니다. 아이들은 최고 중의 최고를 누릴 자격이 있습니다!"
 ISR_deliver_computers: "디지털 정부"
 ISR_deliver_computers_desc: "행정 기구의 효율성을 높이기 위해 정부를 가능한 한 디지털화해야 합니다."
 ISR_recover_public_services: "공공 서비스 회복"
 ISR_recover_public_services_desc: "공공 서비스 부문을 회복시켜 옛 영광의 시절로 되돌려야 합니다."
 ISR_regulate_finance: "금융 체계 규제"
 ISR_regulate_finance_desc: "사회의 평등을 보장하기 위해 금융 체계를 규제해야 합니다."
 ISR_agricultural_protection_act: "농업 보호법"
 ISR_agricultural_protection_act_desc: "농업 부문은 키부츠와 정착민이 맡은 가장 중요한 분야 중 하나이므로 이를 보호해야 합니다."
 ISR_agricultural_sector: "농민 조합에 의존"
 ISR_agricultural_sector_desc: "농민 조합의 설립을 지원하고 농업 부문을 확대해야 합니다."
 ISR_labour_unions_focus: "히스타드루트 육성"
 ISR_labour_unions_focus_desc: "노동조합을 어떻게 다룰지 결정하고 마침내 국가 내에서 그 위치를 정해야 합니다."
 ISR_amend_protection_act: "투자 보호법 개정"
 ISR_amend_protection_act_desc: "투자 보호법을 개정하고 그에 맞춰 경제 정책을 펼쳐야 합니다."
 ISR_subsidize_businesses: "독립 사업체 보조"
 ISR_subsidize_businesses_desc: "경제적 균형을 보장하기 위해 독립 사업체를 지원해야 합니다."
 ISR_youth_movements: "청년 운동"
 ISR_youth_movements_desc: "우리나라의 소프림을 지원해야 합니다. 이들이야말로 앞으로 같은 뜻을 가진 청년들을 확보할 유일하고 확실한 보증이기 때문입니다."
 ISR_competition_directory: "국가 경쟁청"
 ISR_competition_directory_desc: "경제의 독점화에 맞서 싸울 국가 경쟁청을 설립해야 합니다."
 ISR_sponsored_products: "제품 후원 확대"
 ISR_sponsored_products_desc: "이미 시행하고 있는 다양한 제품에 대한 후원을 확대해야 합니다."
 ISR_forgot_to_be_jews: "우리가 잊은 것을 인정하라"
 ISR_forgot_to_be_jews_desc: "아브라함 가바이는 이스라엘의 사업가이자 정치인입니다. 통신 기업 베제크의 최고경영자를 지낸 뒤 정계에 입문했습니다."
 ISR_bring_the_lost_voters: "이탈한 유권자 끌어들이기"
 ISR_bring_the_lost_voters_desc: "아미르 페레츠는 노동당 소속 크네세트 의원을 지낸 이스라엘 정치인입니다. 1988년부터 거의 중단 없이 크네세트 의원으로 활동하며 정부 내에서 여러 직책을 맡았습니다."
 ISR_zionist_union: "시온주의 연합"
 ISR_zionist_union_desc: "이츠하크 부기 헤르조그는 이스라엘의 정치인입니다. 전 이스라엘 대통령 하임 헤르조그의 아들로, 직업은 변호사이며 1999년부터 2001년까지 정부 비서관을 지냈습니다."
 ISR_regret_our_past_sephardics: "대 후회"
 ISR_regret_our_past_sephardics_desc: "과거를 후회하고 세파르딤을 통합하는 데 더 많은 노력을 기울여야 합니다."
 ISR_constitution: "이스라엘 헌법 작성"
 ISR_basic_law_amendment: "신헌법"
 ISR_basic_law_amendment_desc: "마침내 새 헌법을 기초할 수 있게 되었습니다!"
 ISR_public_transport_shabbat: "토요일 대중교통"
 ISR_public_transport_shabbat_desc: "휴일 대중교통 문제를 이제 마무리합시다."
 ISR_matkal_women: "하토봇 라크라비"
 ISR_matkal_women_desc: "여성이 군에 복무할 뿐 아니라 전투 직무에도 종사하도록 허용해야 합니다."
 ISR_millet_system: "밀레트 제도 폐지"
 ISR_millet_system_desc: "사제들이 너무 오랫동안 우리나라에 영향을 미쳐 왔으며, 이제 이를 멈출 때가 되었습니다."
 ISR_lgbt_marriage: "LGBT 혼인 합법화"
 ISR_lgbt_marriage_desc: "LGBT 혼인을 합법화하고 LGBT에 대한 수용을 장려해야 합니다."
 ISR_redraft_conscription_law: "탈 법 재기초"
 ISR_redraft_conscription_law_desc: "이제 초정통파를 차할(IDF)에 징집하는 일을 시작해야 합니다."
 ISR_stop_yeshiva_money: "예시바 지원 중단"
 ISR_stop_yeshiva_money_desc: "초정통파에게는 더 이상 한 푼도 줄 수 없습니다! 그들은 세금을 내는 사회의 몸에 붙은 기생충과 같습니다!"
 ISR_accept_kotel_protocols: "코텔 여성 인정"
 ISR_accept_kotel_protocols_desc: "코텔 여성 운동을 인정하는 것은 우리의 이념적 결정일 뿐 아니라 합리적인 결정이기도 합니다. 교조주의를 타파합시다!"
 ISR_recognize_reformist_conversions: "개혁파 개종 인정"
 ISR_recognize_reformist_conversions_desc: "개혁파 개종을 인정하고 전 세계의 유대교인이 이스라엘로 귀환하도록 허용해야 합니다."
 ISR_meretz: "활력당"
 ISR_meretz_desc: "메레츠는 좌파, 사회민주주의, 세속주의, 노동 시온주의 정당입니다. 이스라엘-팔레스타인 분쟁 해결을 위한 두 국가 해법을 강조하며, 사회 정의와 인권, 종교의 자유를 증진하고 환경주의에 특별히 주력합니다."
 ISR_jewish_arab_partnership: "유대-팔레스타인 협력"
 ISR_jewish_arab_partnership_desc: "협력, 그리고 바라건대 평화를 향한 첫걸음으로 이웃과 물자 교환을 원활히 하기 위한 무역 협정을 체결할 것입니다. 양측의 경제 모두 이로 인해 이익을 얻을 것입니다."
 ISR_affirmative_action: "적극적 우대 조치 지지"
 ISR_affirmative_action_desc: "공존을 향한 한 걸음 더 나아가, 이웃의 경제가 번영하도록 자금을 투자해 지원할 것입니다. 그들이 고마워할 것이며 지역의 안정도 높아질 것이라 확신합니다."
 ISR_meretz_green: "새 그린 딜"
 ISR_meretz_green_desc: "우리의 땅은 고통받고 있으며, 지구는 더 존중하는 접근을 필요로 합니다. 화석 연료에서 벗어나 탄소 배출을 중립화하는 것을 목표로 해야 하며, 이를 위해 재생 에너지에 적극 투자할 것입니다. 비용이 들겠지만 마땅히 해야 할 일입니다."
 ISR_ideological_feminism: "이념적 페미니즘"
 ISR_ideological_feminism_desc: "여성이 우리 사회에서 동등한 권리를 가져야 한다는 우리의 이념을 천명합니다!"
 ISR_fight_gender_discrimination: "가정 폭력 퇴치"
 ISR_fight_gender_discrimination_desc: "성차별과 가정 폭력에 대해 시정 조치를 취할 때입니다. 우리 사회는 더 이상 이를 용납할 수 없습니다. 따라서 병역 제도를 개혁하고 육아휴직을 도입하겠습니다."
 ISR_kibbutz_meretz: "키부츠 운동 장려"
 ISR_kibbutz_meretz_desc: "키부츠는 이스라엘 국가의 기반이며, 사람들이 공동의 목표를 이루기 위해 협력하고 삶을 나누는 공동체 사회의 놀라운 사례입니다. 약간의 투자로 이를 장려하고 지원할 것입니다."
 ISR_western_world: "유럽 문명의 일부"
 ISR_western_world_desc: "우리는 유럽 문명의 일부이며 그에 걸맞게 행동해야 합니다!"
 meretz_affirmative: "이스라엘-팔레스타인 협력"
 ISR_raam_party: "아랍 연합 명부"
 ISR_raam_party_desc: "히브리어 약칭 라암으로 흔히 알려진 아랍 연합 명부는 이스라엘의 아랍 정당이며 이슬람 운동 남부 지부의 정치 조직입니다."
 ISR_shura_council: "압바스와 슈라 위원회"
 ISR_shura_council_desc: "라암당 내부의 분쟁을 해소하려 노력해야 합니다. 팔레스타인에도 영향을 미칠 수 있습니다."
 ISR_bedouin_interests: "베두인의 이익"
 ISR_bedouin_interests_desc: "베두인은 이스라엘 남부에 거주합니다. 그들의 필요를 충족하도록 이 지역을 개발해야 합니다."
 ISR_recognize_illegal_outposts: "불법 전초기지 인정"
 ISR_recognize_illegal_outposts_desc: "불법 전초기지를 인정하고 팔레스타인에 대한 압박을 줄여야 합니다."
 ISR_family_values: "'낡고 좋은' 가족 가치"
 ISR_family_values_desc: "무슬림의 가족 가치를 지지하고 이를 우리의 사회 정책에 통합해야 합니다."
 ISR_legalize_polygamy: "일부다처제 합법화"
 ISR_legalize_polygamy_desc: "라암당의 요구에 따라 일부다처제를 합법화해야 합니다."
 ISR_conversion_therapies: "아랍 전환 치료사"
 ISR_conversion_therapies_desc: "아랍인의 특수성을 고려한 전환 치료사를 허용해야 합니다..."
 ISR_legalized_plygamy: "일부다처제 합법화"
 ISR_down_with_imperialism: "제국주의자를 타도하라!"
 ISR_down_with_imperialism_desc: "우리 땅에서 종교 분쟁을 일으키고 자행한 것은 미국 제국주의입니다. 우리의 고통에 복수해야 합니다!"
 ISR_join_arab_league: "아랍 연맹 가입"
 ISR_join_arab_league_desc: "우리나라에 아랍 인구가 이렇게 많으니 아랍 연맹에 가입해야 합니다."
 ISR_befriend_china_isratine: "중국과 친선"
 ISR_befriend_china_isratine_desc: "중국은 같은 국제주의 국가입니다. 그들과 친해져야 합니다!"
 ISR_befriend_libya: "가다피의 예언을 기억하라"
 ISR_befriend_libya_desc: "유대인과 팔레스타인인이 우정으로 하나가 되는 미래를 내다본 것은 가다피의 예언이 처음이었습니다."
 ISR_identity_atheism: "종교의 사슬을 끊어라"
 ISR_identity_atheism_desc: "분열을 낳는 종교성은 더 이상 안 됩니다! 우리를 갈라놓은 것은 바로 그 차이입니다."
 ISR_identity_religion: "신 아래 모든 사람"
 ISR_identity_religion_desc: "종교를 우리 정체성의 일부로서 거부해서는 안 되며, 오히려 우리의 차이를 받아들여야 합니다."
 ISR_judean_legacy: "함께하는 유대아의 유산"
 ISR_judean_legacy_desc: "우리는 모두 유대아의 위대한 상속자이며, 한때 두 민족을 갈라놓은 가혹한 운명에 의해 떨어져 있었습니다. 유대 왕국의 시대로 돌아가야 합니다."
 ISR_galilea_identity: "갈릴리 시대를 기억하라"
 ISR_galilea_identity_desc: "우리 땅에 친절과 상호 이해가 깃들던 때를 기억해야 합니다. 팔레스타인인과 유대인이 조화롭게 함께 살던 시절 말입니다."
 ISR_canaan_identity: "가나안으로 돌아가라"
 ISR_canaan_identity_desc: "가나안 사람과 이 땅 모든 거민이 듣고 우리를 에워싸서 우리 이름을 땅에서 끊으리니 주의 큰 이름을 위하여 어찌하시겠나이까?"
 ISR_identity_question: "새로운 정체성 창조"
 ISR_identity_question_desc: "새로운 이민족 연합 국가를 공고히 하려면 우리 국민을 위한 새로운 정체성을 만들어야 합니다..."
 ISR_binational_state: "헤베이누 샬롬 알레이헴"
 ISR_binational_state_desc: "모든 적대는 끝나야 하며, 팔레스타인과의 무의미한 투쟁도 끝나야 합니다. 이제 하나가 될 때입니다."
 ISR_return_refugees: "귀환법 개정"
 ISR_return_refugees_desc: "이제 우리는 이민족 연합 국가이므로 유대인과 팔레스타인인 모두 우리나라로 귀환할 수 있습니다."
 ISR_un_inspections: "국제연합 사찰단 허용"
 ISR_un_inspections_desc: "국제연합 사찰단이 우리의 핵 능력에 관한 모든 정보를 알 수 있도록 허용해야 합니다."
 ISR_abandon_nukes: "선의의 표시"
 ISR_keep_nukes: "그들의 두려움을 달래라"
 ISR_befriend_south_africa: "우리가 공유하는 유산"
 ISR_befriend_south_africa_desc: "오랜 세월의 적대 끝에 남아프리카 공화국과 친해져야 합니다."
 ISR_federalism: "성지 연방화"
 ISR_federalism_desc: "민족 정치적 분열이 더 이상 생기지 않도록 이스라틴을 연방화해야 합니다."
 ISR_palestinian_army: "보안군 통합"
 ISR_palestinian_army_desc: "보안군을 통합하고 새로운 아랍-유대 합동 부대를 창설해야 합니다."
 ISR_milk_and_honey: "젖과 꿀이 흐르는 땅"
 ISR_milk_and_honey_desc: "우리는 번영과 행복의 땅이 되어야 합니다."
 ISR_judean_identity: "유대아 정체성"
 ISR_canaans_identity: "몰록 정체성"
 ISR_galil_identity: "갈릴리 정체성"
 religious_divide: "종교 분열"
 ISR_idea_isratine_federalism: "성지 연방주의"
 ISR_discover_gas: "최대의 발견"
 ISR_discover_gas_desc: "인근 해역에 채굴 가능한 가스가 가득하다는 것을 발견했습니다. 첫 단계를 시작하려면 해안에 해군 기지를 건설해야 합니다."
 ISR_tamar: "타마르 채굴"
 ISR_tamar_desc: "바다에서 가스를 추출하기 위해 텔아비브 인근 해안을 굴착해야 합니다."
 ISR_leviathan: "리바이어던 채굴"
 ISR_leviathan_desc: "갈릴리에도 천연 지하 가스가 풍부합니다. 이를 추출합시다."
 ISR_dolphin: "돌핀 채굴"
 ISR_dolphin_desc: "네게브 해안에도 천연가스가 풍부합니다. 이것도 추출해야 합니다."
 ISR_prefer_turkey: "튀르키예와의 관계 재점화"
 ISR_prefer_turkey_desc: "튀르키예와 협력하고 관계를 쌓아야 합니다."
 ISR_prefer_greece: "헬레니즘 동맹 결성"
 ISR_prefer_greece_desc: "앞으로의 송유관 사업과 기타 사업 및 정치 사안에서 그리스와 협력해야 합니다."
 ISR_blue_flag: "블루 플래그 훈련"
 ISR_blue_flag_desc: "지중해의 주요 파트너인 그리스에 군사 협력을 제안해야 합니다."
 ISR_east_med_pipeline: "동지중해 프로젝트"
 ISR_east_med_pipeline_desc: "키프로스 및 그리스와의 관계 덕분에 이들은 우리가 송유관을 건설하는 데 협력할 자연스러운 선택지입니다."
 ISR_visit_greece: "그리스 주재 무관"
 ISR_visit_greece_desc: "그리스의 독립과 주권을 보장하는 것이 우리의 직접적인 이익이므로 이를 지켜야 합니다."
 ISR_claim_aphrodite: "아프로디테 가스전 영유권 주장"
 ISR_claim_aphrodite_desc: "아프로디테 가스전에 대한 우리의 주장을 관철하려면 북키프로스를 지원해야 합니다."
 ISR_support_blue_homeland: "푸른 조국 인정"
 ISR_support_blue_homeland_desc: "튀르키예에 우리와의 군사 협력을 제안하고 합동 훈련을 시작할 수 있습니다."
 ISR_israel_turkey_pipeline: "이스라엘-튀르키예 가스관"
 ISR_israel_turkey_pipeline_desc: "튀르키예가 우리에게 좋은 동맹임을 입증했으므로 그들과 함께 송유관을 건설해야 합니다."
 ISR_karish: "카리시 시추 개시"
 ISR_karish_desc: "카리시 해역에서 가스 시추를 시작할 수 있습니다. 하지만 이는 헤즈볼라를 크게 자극할 수 있습니다. 그러나 우리 군의 전력이 강하다면 그들이 임시 합의를 받아들일 수도 있습니다..."
 ISR_madan: "정보국"
 ISR_madan_desc: "이스라엘 해군 정보부는 이스라엘 해군 본부 소속의 참모 부서입니다. 다른 IDF 정보 기구와 마찬가지로 업무상 정보국의 지휘를 받습니다."
 ISR_tech_superiority: "우위를 유지하라"
 ISR_tech_superiority_desc: "함선과 잠수함을 외국 공급에만 의존하지 말고 자체 연구와 생산을 늘려야 합니다."
 ISR_bibi_submarine_deal: "수상한 거래 추진"
 ISR_bibi_submarine_deal_desc: "독일과 또 같은 계약을 맺는 데 매우 회의적인 기득권층의 말을 들어서는 안 됩니다. 거래의 승인을 위조하고 밀어붙여야 합니다."
 ISR_dakar: "다카르 준비"
 ISR_dolphin_1: "돌핀 II급"
 ISR_dolphin_1_desc: "잠수함을 연구하고 잠수함 생산 분야의 기술적 역량을 높여야 합니다."
 ISR_thyssenkrupp_deal: "티센크루프와의 거래"
 ISR_thyssenkrupp_deal_desc: "신형 잠수함을 설계하고 건조할 수 있을 때까지 우리의 방어를 보장하기 위해 구형 독일 잠수함 5척을 구입합시다."
 ISR_ships_dvora: "드보라"
 ISR_ships_dvora_desc: "드보라급 고속 초계정은 이스라엘 항공우주산업이 이스라엘 해군을 위해 이스라엘의 다부르급을 기반으로 건조한 고속 초계정 계열입니다."
 ISR_ships_bat_yam: "아슈도드"
 ISR_ships_bat_yam_desc: "군용 및 상선 함대를 그곳에서 건조하고 수리할 수 있도록 아슈도드에 조선소를 건설해야 합니다."
 ISR_ships_saar: "사아르 개선"
 ISR_ships_saar_desc: "함선을 더 효과적으로 수리할 수 있도록 사아르 조선소를 개선해야 합니다."
 ISR_middle_east_peace: "이사야의 꿈"
 ISR_middle_east_peace_desc: "이제 중동의 우호국과 더욱 긴밀한 관계를 구축하는 데 우리의 모든 비전을 집중할 것입니다."
 ISR_enemy_of_my_enemy: "새로운 공동의 적"
 ISR_enemy_of_my_enemy_desc: "중동 지정학적 상황이 새롭게 재편되는 점을 고려하여, 사우디아라비아와의 관계 개선 절차를 새로 시작해 볼 수도 있습니다."
 ISR_travel_morocco: "모하메드 6세 방문"
 ISR_travel_morocco_desc: "모로코는 우리와 어느 정도 좋은 관계를 가진 몇 안 되는 아랍 국가 중 하나입니다. 이 관계를 진정한 우정으로 끌어올려야 합니다!"
 ISR_gulf_offices: "걸프 지역 사무소 개설"
 ISR_gulf_offices_desc: "걸프 국가들에 대한 영향력을 넓히기 위해 걸프 국가 내 정부 사무소를 다시 열어야 합니다."
 ISR_apologize_past_actions: "사건에 대한 사과"
 ISR_apologize_past_actions_desc: "과거에 우리는 불가피한 필요에 따라 일부 걸프 국가 영토에서 불리한 영향력을 상쇄하기 위해 모사드 요원을 활용했습니다. 이제 이들 국가와의 관계를 회복하고 우리의 행동에 대해 사과해야 합니다."
 ISR_abraham_accords_focus: "아브라함 협정"
 ISR_abraham_accords_focus_desc: "여러 아랍 국가와 이스라엘 사이의 얼음을 녹이기 위한 새로운 외교 회담을 시작해야 합니다."
 ISR_negev_forum_focus: "네게브 포럼"
 ISR_negev_forum_focus_desc: "지역 안보를 높이고 지역 협력을 강화하기 위해 중동 파트너들이 참여할 새로운 포럼을 시작할 수 있습니다."
 ISR_cultural_ties: "문화적 유대 재확인"
 ISR_cultural_ties_desc: "모로코의 유대인 디아스포라는 여전히 상당히 규모가 크며 모로코 경제에 상당한 영향력을 행사합니다. 이를 활용할 수도 있을 것입니다."
 ISR_visa_indirect_travel: "간접 무비자 여행"
 ISR_visa_indirect_travel_desc: "모로코와 이스라엘 사이의 우리 시민들의 여행을 쉽게 하기 위해 간접 비자 면제 방안을 협상해 볼 수 있습니다."
 ISR_denounce_polisario_iran: "최대의 연결고리를 규탄하라"
 ISR_denounce_polisario_iran_desc: "폴리사리오 분리주의자와 테러리스트에 맞선 모로코의 투쟁을 지지해야 합니다."
 ISR_restore_security_links: "안보 연결망 복원"
 ISR_restore_security_links_desc: "정보 분야에서도 모로코를 지원해야 합니다. 서로에게 이익이 되는 방식으로 실제 이득을 얻을 수 있기 때문입니다."
 ISR_usa_mor_isr_deal: "삼자 거래?"
 ISR_usa_mor_isr_deal_desc: "관계 정상화를 위한 노력에서 모로코 파트너를 지원하기 위해 미국에 우리의 외교적 노력을 지지해 달라고 요청할 수 있습니다."
 ISR_return_to_africa: "아프리카 복귀"
 ISR_return_to_africa_desc: "우리의 가장 강력한 동맹 상당수가 아프리카 대륙 출신이므로 아프리카에서의 영향력을 계속 확대해야 합니다."
 ISR_invest_in_eac: "동아프리카 방문"
 ISR_invest_in_eac_desc: "동아프리카 국가들과 친해지고 이들에 대한 영향력을 높여야 합니다."
 ISR_eritrean_bases: "에리트레아 내 기지"
 ISR_eritrean_bases_desc: "어쩌면 양측 모두에 이익이 될 군사 협력을 에리트레아와 협상해 볼 수도 있습니다."
 ISR_kampala_meeting: "캄팔라 회담"
 ISR_kampala_meeting_desc: "이스라엘 특수부대가 엔테베 작전의 일환으로 납치된 항공기의 인질을 구출하기 위해 캄팔라 국제공항을 급습한 지 거의 반세기가 지났으며, 오늘 이스라엘 총리 [ISR.GetLeader]가 엘알 항공기를 타고 우간다에 도착했습니다. 이스라엘과 동아프리카 공동체 회원국 간의 관계 정상화는 1990년대에 이미 시작되었지만, 관계는 욤 키푸르 전쟁 이전 예루살렘 정책 입안자들이 대륙에서 누렸던 황금기로 돌아가지 못했습니다. 그러나 [ISR.GetLeader] 치하에서 이스라엘은 이스라엘의 기술, 특히 염분 제거 및 수자원 기술을 활용하여 아프리카 대륙의 문을 여는 '아프리카 복귀'를 도모하고 있습니다. [ISR.GetLeader]에 따르면 동아프리카는 이스라엘이 대륙으로 들어서는 관문이며, 그는 동아프리카 국가들은 물론 사하라 이남 아프리카 전역과의 경제, 정치, 외교 관계를 크게 확대하기를 바랍니다."
 ISR_peace_sudan: "워싱턴 각서"
 ISR_peace_sudan_desc: "수단과의 경제적 유대를 강화하여 관계를 정상화해 볼 수도 있습니다."
 ISR_peace_chad: "은자메나 의정서"
 ISR_peace_chad_desc: "차드의 현재 상황을 고려할 때, 무기 패키지와 관계 정상화를 제안함으로써 이득을 얻을 수도 있습니다."
 ISR_peace_sahel: "사헬에 접근"
 ISR_peace_sahel_desc: "이제 상호 협력을 강화하고 투자도 하면서 사헬 국가들에 접근해 볼 수 있습니다."
 ISR_visit_oman: "오만 방문"
 ISR_visit_oman_desc: "오만은 중동에서 우리의 몇 안 되는 동맹 후보 중 하나입니다. 이들과 좋은 관계를 키워야 합니다."
 ISR_covert_ties: "비밀 유대 구축"
 ISR_covert_ties_desc: "걸프 지역의 동맹들과 비밀 유대를 구축해야 합니다. 그들이 동의한다면 모사드 요원을 준비시켜야 합니다."
 ISR_yemen_intervene: "해협을 주시하라"
 ISR_yemen_intervene_desc: "예멘이 우리의 가장 가까운 친구라고 볼 수는 없더라도, 이란의 대리 세력에 맞서 그들을 지원하는 것이 모든 것을 내버려 두는 것보다 합리적입니다."
 ISR_yemen_war: "시바의 왕관 작전"
 ISR_yemen_war_desc: "예멘 내전에 개입하여 후티의 위협을 끝낼 때가 왔습니다!"
 ISR_mossad_diplomacy: "모사드 외교"
 ISR_mossad_diplomacy_desc: "특히 파트너들이 반대하지 않을 때에는 모사드를 활용하여 중동에서 더 폭넓은 외교 활동을 수행할 수 있습니다."
 ISR_bahrain_economic_conference: "마나마 경제 회의"
 ISR_bahrain_economic_conference_desc: "마나마에서 새로운 경제 회의가 열릴 때 걸프 국가들과 거래를 성사시킬 수 있습니다. 그것은 걸프 파트너와 우리 모두에게 이익이 될 수도 있습니다."
 ISR_visit_saudi: "사우디아라비아 방문"
 ISR_visit_saudi_desc: "가장 큰 적에 맞선 최후의 방패를 만들기 위해 사우디아라비아를 비밀리에 방문하여 군사 협력 연결망을 구축해야 합니다."
 ISR_treaty_saudi: "황금 사과에 도달하라"
 ISR_treaty_saudi_desc: "마침내 사우디아라비아와 협상하여 두 나라 사이에 완전한 평화를 수립할 수 있을지도 모릅니다."
 ISR_position_of_strength: "힘의 입장에서"
 ISR_position_of_strength_desc: "간접적인 관여와 까다로운 합의를 통해 안보를 높일 수 있는데, 굳이 동맹의 결속과 책임으로 스스로를 번거롭게 할 이유가 있겠습니까."
 ISR_new_middle_east: "새로운 중동"
 ISR_new_middle_east_desc: "마침내 우리의 모든 외교적 노력 끝에 새로운 중동이 만들어져야 합니다!"
 ISR_exhibitions_dubai: "두바이 박람회 방문"
 ISR_exhibitions_dubai_desc: "걸프 및 세계 무역에서 우리의 입지를 확고히 하기 위해 두바이에서 최근 열리는 비즈니스 및 기술 박람회에 우리 기업들을 내보내야 할 수도 있습니다."
 ISR_uae_invest: "에미리트-이스라엘 협력"
 ISR_uae_invest_desc: "성장하는 UAE 경제의 현황을 고려할 때, 그들과의 협력을 강화하기 위해 투자를 요청해야 할 수도 있습니다."
 ISR_visit_japan: "떠오르는 태양을 쫓아서"
 ISR_visit_japan_desc: "일본은 극동에서 경제적 성공의 떠오르는 태양입니다. 일본과 좋은 관계를 맺는 것은 우리에게 필수적입니다."
 ISR_visit_vietnam: "베트남에 문호 개방"
 ISR_visit_vietnam_desc: "베트남의 농업 부문 경제는 빠르게 성장하고 있습니다. 이를 우리의 상호 이익을 위해 활용할 수 있습니다."
 ISR_deal_with_neighbors: "올리브 가지를 내밀다"
 ISR_deal_with_neighbors_desc: "이제 이집트와 요르단을 향한 외교 활동을 시작해야 합니다."
 ISR_deal_with_jordan: "요르단강 너머"
 ISR_deal_with_jordan_desc: "이제 요르단과의 외교 관계를 시작하고 상호 관계를 어떻게 운영할지 결정해야 합니다."
 ISR_jordan_defensive: "동쪽 측면을 수호하라"
 ISR_jordan_defensive_desc: "요르단 파트너를 지원하고 군사 분야에서 그들과 협력해야 합니다."
 ISR_jordan_offensive: "거짓도 용서도 없다"
 ISR_jordan_offensive_desc: "요르단은 우리 정부 아래 복속되어야 합니다. 최근의 사태로 인해 그들은 우리의 외교적 필요에 부합하지 않게 되었습니다."
 ISR_jordan_military_bases: "군부 매수"
 ISR_jordan_military_bases_desc: "요르단의 주권을 약화시키기 위해 그들의 장군들을 매수하여 우리 편으로 끌어들여야 합니다."
 ISR_manipulate_royal_family: "왕실 정치 조종"
 ISR_manipulate_royal_family_desc: "하심 왕가와 그 지지자들 중에는 우리의 영향력에 반대하는 사람이 많습니다. 그들을 제거해야 합니다."
 ISR_puppet_jordan: "요르단 개입"
 ISR_puppet_jordan_desc: "마침내 모든 준비가 끝났습니다. 이제 요르단에 최후의 일격을 가할 수 있습니다!"
 ISR_war_with_isis: "늑대 요새 작전"
 ISR_war_with_isis_desc: "살라피 적이 우리 문 앞에 있는 실존적 위협이 있는 만큼, 선제 조치를 취해 이를 파괴해야 합니다!"
 ISR_black_september_legacy: "검은 9월의 유산"
 ISR_black_september_legacy_desc: "요르단은 적으로부터 우리를 막아 주는 동쪽 측면이므로 어떤 대가를 치르더라도 보호해야 합니다."
 ISR_green_blue_deal: "그린-블루 딜"
 ISR_green_blue_deal_desc: "녹색 에너지의 새로운 가능성에 관해 요르단, UAE와 3자 조약을 체결해야 합니다."
 ISR_tourism_port_jordan: "에일라트-아카바 연결"
 ISR_tourism_port_jordan_desc: "요르단 민간 기업과 협력하여 남부 항만을 확장하고 에일라트-아카바 연결망을 구축해야 합니다."
 ISR_preserve_the_dead_sea: "사해 보존"
 ISR_preserve_the_dead_sea_desc: "향후 사업을 위해 요르단과 함께 사해를 보존해야 합니다."
 ISR_open_degania_dam: "데가니아 댐 건설"
 ISR_open_degania_dam_desc: "요르단을 자극할 수 있겠지만, 데가니아 댐을 건설하여 우리 물은 우리만을 위해 사용해야 합니다."
 ISR_jordan_river_agreement: "키네렛 호숫가에서 물러나다"
 ISR_jordan_river_agreement_desc: "덜 급진적인 입장을 취하고 우리와 요르단 모두에게 더 수용 가능한 계획을 협상해 보아야 합니다."
 ISR_intelligence_sharing_jordan: "모파즈-말라크위 회담"
 ISR_intelligence_sharing_jordan_desc: "공동의 적에 맞서 하심 왕가의 합법 정부를 보호하기 위해 요르단 내 모사드 요원을 활용해야 합니다."
 ISR_iraq_war: "새로운 네부카드네자르"
 ISR_iraq_war_desc: "사담의 이라크는 우리와 요르단 모두에 대한 실존적 위협입니다. 이라크의 영향력 행사자에 대한 조치를 취해야 합니다."
 ISR_expand_on_jordan_treaty: "아라바 조약 확대"
 ISR_expand_on_jordan_treaty_desc: "1994년 10월 26일 요르단과 이스라엘은 에일라트 북쪽, 요르단 국경 근처의 이스라엘 아라바 계곡에서 열린 기념식에서 평화 조약에 서명했습니다. 라빈 총리와 압둘살람 알마잘리 총리가 조약에 서명했고, 이스라엘 대통령 에제르 바이츠만은 후세인 국왕과 악수를 나누었습니다."
 ISR_mediate_nile_egypt: "나일강 댐 규탄"
 ISR_mediate_nile_egypt_desc: "이집트와 에티오피아의 분쟁에서 친이집트 입장을 취해야 합니다."
 ISR_mediate_nile_ethiopia: "친에티오피아 입장"
 ISR_mediate_nile_ethiopia_desc: "이집트와 에티오피아의 분쟁에서 친에티오피아 입장을 취해야 합니다."
 ISR_bring_back_falashmura: "팔라샤무라 귀환"
 ISR_bring_back_falashmura_desc: "모든 에티오피아 유대인이 고향인 이스라엘로 돌아오도록 요구해야 합니다. 에티오피아가 동의하지 않는다면 그들과의 관계에서 더 강경한 입장을 취할 것입니다."
 ISR_fallow_deer_diplomacy: "다마사슴 외교"
 ISR_fallow_deer_diplomacy_desc: "과거 이란의 샤는 우호의 표시로 다마사슴을 이스라엘에 선물했습니다. 그러나 그 이후 이란 본토에서는 이 사슴이 멸종했고, 이스라엘에 선물된 사슴만이 살아남았습니다."
 ISR_propaganda_in_iran: "호의적 이미지 노력"
 ISR_propaganda_in_iran_desc: "이란의 우호적인 정부를 지원하고 그들에 대한 영향력을 더 확보할 수 있어야 합니다."
 ISR_water_and_life: "물과 생명을 가져오라"
 ISR_water_and_life_desc: "이란은 오랫동안 관개와 용수 공급 문제를 겪어 왔습니다. 약간의 대가를 받고 이를 도울 수 있습니다."
 ISR_direct_flights_to_iran: "엘알 항공의 복귀"
 ISR_invest_iran: "이란으로의 복귀"
 ISR_invest_iran_desc: "서로의 상호 의존성을 높이기 위해 이란에 투자를 요청할 수 있습니다."
 ISR_eilat_ashkelon_route: "에일라트-아슈켈론 송유관"
 ISR_eilat_ashkelon_route_desc: "에일라트 아슈켈론 송유관 회사는 이스라엘에서 여러 원유 및 정제 석유 제품 송유관을 운영하며, 그중 가장 대표적인 에일라트 아슈켈론 송유관은 홍해와 지중해 사이의 이스라엘 남부를 가로질러 원유를 수송합니다. EAPC는 또한 두 곳의 해상 석유 터미널과 국내 석유 저장소도 운영합니다."
 ISR_transasiatic_oil: "범아시아 석유 회사"
 ISR_transasiatic_oil_desc: "이제 이란과의 무역로가 열렸으니 그들의 석유에 투자할 수 있습니다."
 ISR_gamliel_plan: "감리엘 계획"
 ISR_gamliel_plan_desc: "지역 통합을 더욱 심화하기 위해 우리나라와 이란 사이의 무역 관계를 증진해야 합니다."
 ISR_iran_singapore_model: "싱가포르 모델"
 ISR_iran_singapore_model_desc: "예전에 싱가포르 군을 훈련시켰듯이, 이제 우리의 경험으로 이란 군을 키워 이란 친구들을 지원해야 합니다."
 ISR_flower_ii_project: "플라워-추르 II"
 ISR_flower_ii_project_desc: "군사 협력 파트너십 조약을 체결한 뒤에는 새로운 미사일 개발 협력 사업을 시작해야 합니다."
 ISR_parash_partner: "파라시 파트너십"
 ISR_parash_partner_desc: "우리와 이란의 목표가 일치하므로 정보 분야에서 이란과 협력할 수 있습니다."
 ISR_military_liason_office: "로젠-그림베르그 임무"
 ISR_military_liason_office_desc: "이제 이란과 군사 조정 센터를 설립하여 우리의 전략을 일관된 행동으로 통합할 수 있습니다."
 ISR_treaty_of_susa: "수사 조약"
 ISR_treaty_of_susa_desc: "혁명 중에 도피한 이란계 이스라엘인에 대한 배상을 이란에 요구해야 합니다."
 ISR_india_to_kush: "호두에서 쿠시까지"
 ISR_india_to_kush_desc: "호두에서 쿠시까지, 우리의 안보 벨트가 완전히 구축되어야 합니다."
 ISR_intervention_afghanistan: "아프가니스탄을 주시하라"
 ISR_intervention_afghanistan_desc: "이전에 아프가니스탄과의 관계가 실질적이지는 않았더라도 탈레반이 집권하는 것을 막아야 합니다."
 ISR_operation_silk_road: "실크로드 작전"
 ISR_operation_silk_road_desc: "지역 전체의 안보를 보장하기 위해 파키스탄을 확보하고 안전하게 만들어야 합니다."
 ISR_royal_road: "왕의 길 복원"
 ISR_royal_road_desc: "국제 정치의 옛 구조를 복원하고 이를 우리에게 유리하게 만들어야 합니다."
 ISR_royal_road_iraq: "바빌론에 시선을 두라"
 ISR_royal_road_iraq_desc: "우리의 위대한 프로젝트를 완성하려면 이라크를 확보해야 합니다."
 ISR_royal_road_syria: "아람 다마스쿠스에 시선을 두라"
 ISR_royal_road_syria_desc: "시리아의 위협을 가능한 한 빨리 무력화해야 합니다."
 ISR_periphery_pact: "주변부 협약 복원"
 ISR_periphery_pact_desc: "우리만의 동맹을 만들고 새로운 주변부 협약을 수립해야 합니다."
 ISR_cento_iran: "국가들의 집"
 ISR_cento_iran_desc: "이란이 최근 CENTO 조약을 부활시켰으므로 지역 안보를 위해 여기에 가입해야 합니다."
 ISR_operation_rolling_dice: "주사위 굴리기 작전"
 ISR_jews_iran: "이란 유대인 공동체 복원"
 ISR_eshter_tomb: "모르드개의 무덤 복원"
 ISR_shared_enemies: "우리의 공동의 적"
 ISR_shared_enemies_desc: "이제 중동의 적들에 관한 정책 수립을 시작해야 합니다."
 ISR_root_of_all_extremism: "매의 둥지 작전"
 ISR_root_of_all_extremism_desc: "살라피의 뱀의 머리를 단번에 잘라낼 때가 왔습니다!"
 ISR_deal_with_egypt: "시나이 사막을 건너"
 ISR_deal_with_egypt_desc: "이집트와의 모든 문제 끝에 두 나라에 평화를 향한 새로운 희망의 빛이 비추고 있습니다."
 ISR_sinai_tourism: "신혼여행 외교"
 ISR_sinai_tourism_desc: "이집트 경제가 성장하고 있음을 고려할 때 협력과 투자는 우리에게 좋은 기회입니다."
 ISR_sharem_flight: "샤름까지 직항"
 ISR_sharem_flight_desc: "이집트와의 동반자 관계와 이스라엘 관광객의 높은 수요를 고려하여 이스라엘에서 샤름엘셰이크까지 직항 항공편을 개설해야 합니다."
 ISR_azam_azam: "선의의 표시 요청"
 ISR_azam_azam_desc: "아잠 아잠은 1990년대 이집트에 간첩으로 체포된 이스라엘 드루즈인입니다. 관계 정상화 과정의 일환으로 선의의 표시로서 그의 석방을 요청할 수 있습니다."
 ISR_visit_south_korea: "남쪽의 호랑이를 만나라"
 ISR_visit_south_korea_desc: "또 하나의 떠오르는 아시아 경제 호랑이는 대한민국입니다. 두 나라 사이의 좋은 경제 관계를 키워야 합니다."
 ISR_sinai_investigation: "타바에서의 보호 요청"
 ISR_sinai_investigation_desc: "타바는 우리 국경 인근에 있는 이집트의 도시입니다. 이스라엘 관광객이 많이 찾는 곳이므로 그곳의 우리 국민 안전을 높이도록 노력해야 합니다."
 ISR_assam_ibrahims_mission: "아삼 이브라힘의 임무"
 ISR_assam_ibrahims_mission_desc: "아삼 이브라힘은 주이스라엘 이집트 대사로, 그의 임기 동안 군사 협력과 정보 공유 측면에서 관계가 크게 개선되었습니다."
 ISR_arish_ashkelon: "아리시-아슈켈론 송유관"
 ISR_arish_ashkelon_desc: "이제 새로운 송유관을 건설하여 이집트와 훨씬 더 강력한 경제적 유대를 구축할 수 있습니다."
 ISR_war_qatar: "진주 공주 작전"
 ISR_war_qatar_desc: "극단주의자들은 가자 지구를 너무 단단히 장악하고 있어 평화적으로 포기할 리가 없습니다. 가자 위기의 뿌리를 끝낼 때가 왔습니다... 해외에서 하마스를 지원하는 자들을 타격하고 무장 해제해야 합니다."
 ISR_invite_egypt_to_gas_project: "송유관 사업에 초대"
 ISR_invite_egypt_to_gas_project_desc: "양측 모두에 이익이 될 우리의 송유관 사업에 이집트를 초대해야 합니다."
 ISR_egypt_anti_iran: "친이집트 입장"
 ISR_egypt_anti_iran_desc: "이집트는 더 신뢰할 만한 이념적, 정치적 동맹임을 입증했습니다. 티란 섬은 이집트의 몫이어야 합니다."
 ISR_question_of_tiran: "티란 거래에 이의 제기"
 ISR_question_of_tiran_desc: "우리에게 더 이로우므로 티란 섬에 대한 사우디의 소유권을 계속 지지해야 합니다."
 ISR_isis_sinai: "시나이 내 노력 지원"
 ISR_isis_sinai_desc: "국경 순찰 드론의 감시 자료를 제공하여 이집트의 노력을 지원해야 합니다."
 ISR_sisi_barak_call: "조약 조항 개정"
 ISR_sisi_barak_call_desc: "모든 상황을 고려할 때, 이집트의 비무장 지대 지위를 해제해야 할지도 모릅니다."
 ISR_arab_spring: "타흐리르와 협상"
 ISR_arab_spring_desc: "이제 적대적인 정권이 집권한 이집트를 어떻게 할지 결정해야 합니다."
 ISR_deport_from_gaza: "새로운 보호구역"
 ISR_revive_yamit: "야미트 복원"
 ISR_revive_yamit_desc: "이제 우리가 시나이를 통제하므로 이를 우리나라에 통합해야 합니다."
 ISR_returning_the_favor: "호의에 대한 보답"
 ISR_returning_the_favor_desc: "이제 모든 상황을 고려하여 이집트의 정권을 전복해야 합니다."
 ISR_watch_their_moves: "그들의 움직임을 주시하라"
 ISR_watch_their_moves_desc: "오늘날 이집트 정권이 우리에게 적대적이라 해도 급진적인 입장을 취하지 말고, 그들의 움직임을 지켜보며 외부에서 정권을 불안정하게 만들어야 합니다."
 ISR_deal_with_migrants: "이집트 국경 장벽"
 ISR_deal_with_migrants_desc: "이제 이집트에서 오는 불법 이민자를 막기 위한 새로운 장벽을 세워야 합니다. "
 ISR_negotiate_with_indonesia: "인도네시아와 협상"
 ISR_negotiate_with_indonesia_desc: "인도네시아는 팔레스타인 지지를 이유로 우리를 승인하지 않았지만, 그럼에도 우리의 경제 관계는 여전히 큽니다."
 ISR_negotiate_with_malaysia: "말레이시아 압박"
 ISR_temple_mount_issue: "섬세한 균형"
 ISR_temple_mount_issue_desc: "6일 전쟁 이후(1994년 아라바 평화 조약으로 굳어졌습니다) 요르단 종교 당국(와크프)은 알아크사 모스크와 성전산 복합 단지의 관리와 운영에 대한 종주권을 유지해 왔습니다. 현상을 수정하여 모스크 단지를 직접 통제할지, 현상을 유지할지 선택할 수 있습니다."
 ISR_status_quo_temple_mount: "현상 유지"
 ISR_status_quo_temple_mount_desc: "어쩌면 알아크사에 대한 무슬림의 통제를 유지하면서 동맹국을 우대해야 할지도 모릅니다."
 ISR_amend_status_quo: "현상 수정"
 ISR_amend_status_quo_desc: "어떤 외세에도 자국의 이익을 위해 우리의 여러 유적과 장소에 영향을 미칠 능력을 주어서는 안 됩니다! 직접 통제권을 장악하고 와크프를 추방해야 합니다."
 ISR_temple_mount_jordanian: "요르단 와크프와 회담"
 ISR_temple_mount_jordanian_desc: "알아크사에 관한 우리의 정책을 수정하지 않고 요르단과 계속 협력해야 합니다."
 ISR_temple_mount_saudi: "관리권 재검토"
 ISR_temple_mount_saudi_desc: "향후 외교에서 사우디를 우선시하기 위해 알아크사에 대한 권한을 사우디아라비아에 넘겨야 할지도 모릅니다."
 ISR_strike_libya: "분홍 모래 작전"
 ISR_strike_iraq: "속편 영화 작전"
 ISR_strike_iran: "황금 화관 작전"
 ISR_speak_to_police: "마프칼과 대화"
 ISR_speak_to_police_desc: "우리의 내부 안보는 범죄 활동과 이를 처리하지 못하는 경찰의 무능으로 크게 고통받고 있습니다. 이를 바꿔야 합니다."
 ISR_form_the_national_guard: "국가 방위대 창설"
 ISR_form_the_national_guard_desc: "우리나라는 포위된 상황이므로 새로운 국가 방위대로 군을 보강해야 합니다."
 ISR_promote_the_swiss_model: "스위스 모델 장려"
 ISR_promote_the_swiss_model_desc: "스위스의 국가 방위대 모델을 참고하여 우리도 그에 맞게 구성해야 합니다."
 ISR_learn_from_october_events: "실수에서 배우라"
 ISR_learn_from_october_events_desc: "마피아 사업체를 급습하도록 국가 방위대를 임명해야 합니다."
 ISR_strenghen_ministry_of_national_security: "국가안보부"
 ISR_strenghen_ministry_of_national_security_desc: "국가안보부는 전국 법 집행 기관으로서 이스라엘 경찰, 이스라엘 교정국, 이스라엘 국가 소방구조청, 이스라엘 국경 경찰, 인터넷 아동 보호 국가 본부, 지역사회 안전 국가청, 증인 보호청을 감독합니다."
 ISR_dont_form_the_national_guard: "안탈레나 약속을 지켜라"
 ISR_dont_form_the_national_guard_desc: "사회를 온전히 유지하고 범죄자를 통제하는 데 과도하게 군사화된 조직은 필요하지 않습니다. 유일한 내부 안보 보증인 경찰을 강화해야 합니다."
 ISR_rely_on_magav: "국경 수비대 확대"
 ISR_rely_on_magav_desc: "악의를 품은 적국 외국인이 우리나라에 들어오지 못하도록 국경 수비대를 지원해야 합니다."
 ISR_rely_on_gideonites: "기드온 부대 작전"
 ISR_rely_on_gideonites_desc: "우리나라의 범죄자를 급습하고 불법 사업체를 일소해야 합니다."
 ISR_focus_yamam: "야맘 예우"
 ISR_focus_yamam_desc: "야맘은 인질 구출 작전과 민간 지역의 테러 표적에 대한 공세적 장악 급습을 모두 수행할 수 있습니다. 군사 및 대테러 임무 외에도 전술 부대 임무와 잠복 경찰 업무도 수행합니다."
 ISR_deal_with_police_racism: "베타 이스라엘의 우려 경청"
 ISR_deal_with_police_racism_desc: "경찰 내부의 인종차별과 싸우고 입대의 평등한 기회를 장려해야 합니다."
 ISR_reform_the_fire_fighting_force: "의심스러운 건물 점검"
 ISR_reform_the_fire_fighting_force_desc: "범죄자에 대한 수색과 급습을 더 많이 실시할 것입니다."
 ISR_shabac_intervention_no: "공동 위원회 구성"
 ISR_shabac_intervention_yes: "국가안보 감시법"
 ISR_shabac_intervention_yes_desc: "반범죄 행위를 법적으로 정당화하여 내부 안보를 강화해야 합니다."
 ISR_gather_all_the_equipment: "모든 총기 확보"
 ISR_gather_all_the_equipment_desc: "경찰력에 특수 무기를 판매해 달라고 미국에 요청해야 합니다."
 ISR_show_more_presence: "더 많은 존재감 과시"
 ISR_show_more_presence_desc: "의심스럽다고 여겨지는 대상에 더 많은 존재감을 보이고 적극적으로 점검해야 합니다."
 ISR_storm_tuba_zangariya: "투바 잔가리야 급습"
 ISR_storm_tuba_zangariya_desc: "마피아에게 최후의 일격을 가하고 이스라엘 북부 지구의 마을인 투바 잔가리야를 급습해야 합니다."
 ISR_police_1: "이스라엘 경찰"
 ISR_police_2: "이스라엘 경찰"
 ISR_police_3: "이스라엘 경찰"
 ISR_nat_guard_1: "국가 방위대"
 ISR_nat_guard_2: "국가 방위대"
 ISR_nat_guard_3: "국가 방위대"
 ISR_the_priesthood: "랍비 예시바"
 ISR_the_military: "마트칼"
 ISR_small_medium_business_owners: "하이테크 산업"
 ISR_farmers: "정착촌 로비"
 ISR_chi_ar_TT: "§Y[CHI.GetNameWithFlag]§!, §Y[USA.GetNameWithFlag]§!, §Y[FRA.GetNameWithFlag]§!에 §Y돌격소총 6000정§! 구매를 요청하겠습니다. 대금은 $4 Billion입니다."
 ISR_usa_ar_TT: "§Y[USA.GetNameWithFlag]§!에 §Y돌격소총 6000정§! 구매를 요청하겠습니다. 대금은 $4 Billion입니다."
 ISR_chi_dr_TT: "§Y[CHI.GetNameWithFlag]§!에 §Y무인기 25대§! 구매를 제안하겠습니다. 대금은 $10 Billion입니다."
 chi_agr_isr_dron: "§Y[ISR.GetNameWithFlag]§!으로부터 §Y무인기 50대§!를 $10 Billion에 구매하겠습니다."
 infl_lease_tt: "§Y항구를 더 낮은 가격에 얻게 되지만, 우리에 대한 상대국의 영향력이 증가합니다!§!"
 we_agree_tt: "이스라엘에 §Y기반시설 3개§!를 건설하겠습니다!"
 they_agree_tt: "우리에 대한 상대국의 영향력이 §Y6%§! 증가했습니다."
 ISR_us_dev_zon: "이스라엘-미국 공동 경제 개발 그룹"
 israel_economy.1.t: "이스라엘 무기 거래"
 israel_economy.1.d: "이스라엘 군은 우리의 돌격소총을 구매하기를 원합니다. 그들에게 판매하겠습니까?"
 israel_economy.1.a: "무기를 넘겨주자!"
 israel_economy.1.b: "아니요"
 israel_economy.2.t: "수락한 [From.GetName]"
 israel_economy.2.d: "우리는 [From.GetName]과(와) 신형 돌격소총을 구매하기로 합의했습니다!"
 israel_economy.2.a: "훌륭해!"
 israel_economy.3.t: "거부한 [From.GetName]"
 israel_economy.3.d: "그들은 우리에게 돌격소총을 판매하지 않을 것입니다. 그러나 아프리카의 우방국들이 구매할 만한 믿을 만한 AK 소총을 가지고 있습니다... 아마도."
 israel_economy.3.a: "젠장"
 israel_economy.4.t: "자국 드론 판매를 제안하는 이스라엘"
 israel_economy.4.d: "이스라엘이 최근 자국의 최신 드론을 구매하도록 제안했습니다. 동의하겠습니까?"
 israel_economy.4.a: "물론이지!"
 israel_economy.4.b: "미안하지만, 사양한다."
 israel_economy.5.t: "중국과의 거래"
 israel_economy.5.d: "중국이 동의했으며, 우리는 거래를 마무리하고 있습니다."
 israel_economy.5.a: "좋다!"
 israel_economy.6.t: "중국의 비동의"
 israel_economy.6.d: "그들은 우리의 드론을 원하지 않습니다."
 israel_economy.6.a: "매우 유감이군."
 israel_economy.7.t: "중국-이스라엘 혁신 협력 공동위원회"
 israel_economy.7.d: "양국 수교 수십 년을 기념하는 행사의 일환으로, 중국-이스라엘 혁신 협력 공동위원회가 오늘 처음으로 소집되었습니다. 이 위원회는 양국 정부의 약 15개 부처 및 기관 사이의 교류와 대화를 증진하는 포괄적 협의체로서, 경제 협력을 중심으로 폭넓은 분야에서 양국 간 협력을 심화하는 것을 목표로 합니다."
 israel_economy.7.a: "훌륭해!"
 ISR_chi_isr_forum: "이스라엘-중국 협력 포럼"
 israel_economy.8.t: "기반시설 투자를 요청하는 이스라엘!"
 israel_economy.8.d: "이스라엘이 우리나라에 기반시설 건설을 통해 자국 경제에 투자해 달라고 요청했습니다. 동의하겠습니까?"
 israel_economy.8.a: "우리의 영향력을 확대할 멋진 기회다!"
 israel_economy.8.b: "미안하지만, 사양한다."
 israel_economy.9.t: "우리 제안을 수락한 [From.GetName]!"
 israel_economy.9.d: "그들은 우리 경제에 투자할 것입니다."
 israel_economy.9.a: "훌륭해!"
 israel_economy.10.t: "우리 제안을 거부한 [From.GetName]!"
 israel_economy.10.d: "그들은 우리나라에 투자하기를 원하지 않습니다."
 israel_economy.10.a: "매우 유감이군."
 israel_economy.11.t: "이스라엘-미국 공동 경제 개발 그룹"
 israel_economy.11.d: "이스라엘과 미국이 이스라엘-미국 공동개발 경제 그룹을 설립하며 획기적인 동반자 관계를 맺겠다고 발표했습니다. 이 협력 사업은 전문성과 자원을 공유함으로써 경제 성장, 혁신 및 번영을 촉진하는 것을 목표로 합니다. 기술, 기반시설, 무역에 중점을 둔 이 동맹은 양자 관계를 강화하고 양국은 물론 그 너머에서도 지속 가능한 발전을 이끌 것으로 전망됩니다."
 israel_economy.11.a: "훌륭해!"
 israel_economy.12.t: "비자 면제 프로그램을 신청하는 이스라엘!"
 israel_economy.12.d: "비자 면제 프로그램(VWP)은 특정 국가의 시민이 비자 없이 90일 이내의 관광 또는 사업 목적으로 미국을 방문할 수 있도록 허용하는 제도입니다. 프로그램 참가국은 항공편 탑승 전에 유효한 전자여행허가(ESTA) 승인을 보유하는 등 특정 요건을 충족해야 합니다. VWP는 여행을 원활하게 하고 미국과 협력국 사이의 경제적, 문화적 교류를 촉진합니다."
 israel_economy.12.a: "규정에 따라 그들의 입국을 승인하겠다."
 israel_economy.12.b: "그들의 신청은 진지하지 않다. 흥!"
 ISR_us_visa_free: "비자 면제 프로그램"
 israel_economy.13.t: "동의한 미국!"
 israel_economy.13.d: "이제 우리는 비자 면제 프로그램에 가입했습니다."
 israel_economy.13.a: "훌륭해!"
 israel_economy.14.t: "미국의 비동의"
 israel_economy.14.d: "그들은 동의하지 않았습니다."
 israel_economy.14.a: "으윽..."
 israel_economy.15.t: "방위 조약 제안을 논의하는 [ISR.GetLeader]"
 israel_economy.15.d: "최근 미국과 이스라엘 관리들의 회담 이후, 미국과 이스라엘 사이에 새로운 방위 협정이 체결되었습니다."
 israel_economy.15.a: "훌륭해!"
 ISR_tel_aviv_metro_mod: "텔아비브 지하철"
 israel_economy.16.t: "의료 협력을 제안하는 이스라엘"
 israel_economy.16.d: "최근 이스라엘 정부가 의료 분야의 상호 연구를 촉진하기 위해 우리 의료 기업들 사이의 협력을 제안했습니다. 동의하겠습니까?"
 israel_economy.16.a: "물론이지!"
 israel_economy.16.b: "미안하지만, 사양한다."
 israel_economy.17.t: "동의한 독일!"
 israel_economy.17.d: "우리는 상호 의료 협력을 수립할 것입니다."
 israel_economy.17.a: "훌륭해!"
 israel_economy.18.t: "우리 제안을 받아들이지 않은 독일"
 israel_economy.18.d: "그들은 우리나라와 협력하기를 원하지 않습니다."
 israel_economy.18.a: "아이고."
 israel_economy.19.t: "자국 무기 판매를 제안하는 이스라엘"
 israel_economy.19.d: "이스라엘이 최근 자국의 최신 드론을 구매하도록 제안했습니다. 동의하겠습니까?"
 israel_economy.19.a: "물론이지!"
 israel_economy.19.b: "미안하지만, 사양한다."
 israel_economy.20.t: "인도와의 거래"
 israel_economy.20.d: "인도가 동의했으며, 우리는 거래를 마무리하고 있습니다."
 israel_economy.20.a: "좋다!"
 israel_economy.21.t: "인도의 비동의"
 israel_economy.21.d: "그들은 우리의 드론을 원하지 않습니다."
 israel_economy.21.a: "매우 유감이군."
 israel_economy.22.t: "인도-이스라엘 무역 협력"
 israel_economy.22.d: "인도와 이스라엘의 무역 협력이 확대되었으며 양자 관계가 개선되었습니다."
 israel_economy.22.a: "훌륭해!"
 israel_economy.23.t: "물 문제를 돕는 이스라엘!"
 israel_economy.23.d: "이스라엘이 자국의 전문가들을 파견하여 우리나라의 물 문제 해결을 돕고 경험과 기술을 공유했습니다."
 israel_economy.23.a: "훌륭해!"
 israel_economy.24.t: "공동 우주 프로그램을 제안하는 이스라엘!"
 israel_economy.24.d: "이스라엘은 우주 탐사 노력에서의 협력을 제안하며, 이 분야에서 협력하고 기술을 공유하기를 원합니다."
 israel_economy.24.a: "물론이지!"
 israel_economy.24.b: "미안하지만, 사양한다."
 israel_economy.25.t: "동의한 인도!"
 israel_economy.25.d: "우리는 우주 개발 노력을 통합하고 협력하기로 합의했습니다."
 israel_economy.25.a: "훌륭해!"
 israel_economy.26.t: "인도의 비동의"
 israel_economy.26.d: "그들은 우리나라와 협력하기를 원하지 않습니다."
 israel_economy.26.a: "으음..."
 israel_economy.27.t: "투자를 요청하는 이스라엘"
 israel_economy.27.d: "이스라엘 정부는 최근 양국 간 회담에서, 상호 이익이 되는 협력을 더욱 발전시키기 위해 우리나라가 자국 경제에 자금을 투자하도록 초청했습니다. 동의하겠습니까?"
 israel_economy.27.a: "투자 패키지를 준비하라!"
 israel_economy.27.b: "미안하지만, 사양한다."
 israel_economy.28.t: "[From.GetName]의 동의!"
 israel_economy.28.d: "그들은 우리 경제에 투자하기로 동의했습니다."
 israel_economy.28.a: "훌륭해!"
 israel_economy.29.t: "동의하지 않은 [From.GetName]"
 israel_economy.29.d: "그들은 우리의 제안을 받아들이지 않았습니다."
 israel_economy.29.a: "아이고"
 isrg_inv_tt: "우리에 대한 [From.GetName]의 영향력이 3% 증가했습니다."
 isrg_inv_foc_tt: "우리에 대한 상대국의 영향력이 3% 증가했습니다."
 three_perc_inf: "그들에 대한 [ISR.GetNameWithFlag]의 영향력이 3% 증가합니다."
 ISR_vie_isr_coop: "이스라엘-베트남 농업 협력"
 israel_economy.30.t: "농업 협력을 제안하는 이스라엘"
 israel_economy.30.d: "최근 이스라엘 정부가 농업 분야에서 서로의 경험을 공유하고 농업 부문에서 협력하자고 제안했습니다. 동의하겠습니까?"
 israel_economy.30.a: "물론이지!"
 israel_economy.30.b: "미안하지만, 사양한다."
 israel_economy.31.t: "동의한 베트남"
 israel_economy.31.d: "베트남이 우리의 제안에 동의했습니다."
 israel_economy.31.a: "훌륭해!"
 israel_economy.32.t: "우리 제안을 거절한 베트남"
 israel_economy.32.d: "그들은 우리의 제안에 동의하지 않았습니다."
 israel_economy.32.a: "매우 유감이군."
 israel_economy.33.t: "이스라엘-[BRM.GetName] 외교 회담"
 israel_economy.33.d: "미얀마와 이스라엘이 최근 외교 회담을 가졌으며, 이는 양국 간 양자 관계 강화를 향한 주목할 만한 걸음을 의미합니다. 화기애애하고 상호 존중하는 분위기 속에서 진행된 이번 회담에서는 외교, 경제, 기술 협력을 아우르는 폭넓은 의제가 논의되었습니다. 양국은 농업, 국방, 보건 등 여러 분야에서 협력을 확대하는 데 큰 관심을 표명했습니다. 이번 외교 교류는 앞으로 더욱 긴밀한 관계를 도모하고 상호 이익이 되는 동반자 관계의 방안을 모색하려는 미얀마와 이스라엘의 의지를 보여줍니다."
 israel_economy.33.a: "훌륭해!"
 israel_economy.34.t: "OECD 지원 협상"
 israel_economy.34.d: "OECD가 우리의 지원 요청을 수락했습니다. 이제 그들에게 무엇을 요청할지 선택해야 합니다."
 israel_economy.34.a: "교육 지원"
 israel_economy.34.b: "경제 지원"
 israel_economy.34.c: "사회 지원"
 ISR_industry_focus_idea: "OECD의 경제 지원"
 ISR_education_focus_idea: "OECD의 교육 지원"
 ISR_social_focus_idea: "OECD의 사회 지원"
 israel_economy.35.t: "우리의 곡물을 사려는 이스라엘!"
 israel_economy.35.d: "이스라엘이 우리의 곡물을 대량으로 구매하는 무역 거래를 제안했습니다. 동의하겠습니까?"
 israel_economy.35.a: "물론이지!"
 israel_economy.35.b: "우리에게는 여분의 곡물이 없다."
 israel_economy.36.t: "우리 거래를 수락한 [From.GetName]!"
 israel_economy.36.d: "그들은 우리 물품을 즉시 인도할 것입니다."
 israel_economy.36.a: "훌륭하군!"
 israel_economy.37.t: "우리 거래를 거부한 [From.GetName]!"
 israel_economy.37.d: "그들은 우리의 제안을 받아들이지 않았습니다."
 israel_economy.37.a: "알겠다..."
 grain_rus_tt: "§Y[SOV.GetNameWithFlag]§!에 §Y곡물§! 구매를 요청하겠습니다. 대금은 §G$10 Billion§!입니다."
 grain_ukr_tt: "§Y[UKR.GetNameWithFlag]§!에 §Y곡물§! 구매를 요청하겠습니다. 대금은 §G$10 Billion§!입니다."
 ISR_grain_bought: "곡물 거래"
 they_will_get_tt: "§H그들이 받을 때의 효과:§!"
 israel_economy.38.t: "세르게이 안뜰을 우리에게 양도하는 이스라엘!"
 israel_economy.38.d: "이스라엘 정부가 세르게이 안뜰을 우리에게 양도하기로 결정하여, 마침내 러시아 부지와 재통합하게 되었습니다!"
 israel_economy.38.a: "훌륭해!"
 israel_economy.39.t: "러시아의 수락!"
 israel_economy.39.d: "그들은 우리의 제안을 수락했습니다."
 israel_economy.39.a: "훌륭해!"
 israel_economy.40.t: "러시아의 거부!"
 israel_economy.40.d: "러시아가 우리의 제안을 거부했습니다!"
 israel_economy.40.a: "으음..."
 serg_court_tt: "비용을 §Y[SOV.GetNameWithFlag]§!와(과) 분담하며, 양측 모두 §G$3.25 Billion§!에 공장을 하나씩 얻게 됩니다."
 israel_economy.41.t: "EAEU 자유무역협정 비준을 요청하는 이스라엘!"
 israel_economy.41.d: "그들은 자유무역협정을 비준하기를 원합니다. 동의하겠습니까?"
 israel_economy.41.a: "물론이지!"
 israel_economy.41.b: "아니."
 israel_economy.42.t: "러시아의 동의!"
 israel_economy.42.d: "그들은 협정에 서명하기로 동의했습니다."
 israel_economy.42.a: "훌륭하다."
 israel_economy.43.t: "러시아의 비동의"
 israel_economy.43.d: "그들은 협정에 서명하기를 원하지 않았습니다."
 israel_economy.43.a: "으윽."
 ISR_idea_eacu_cooperation: "이스라엘-EACU 협력"
 ISR_idea_eacu_cooperation_desc: "유라시아 관세 동맹(원래는 유라시아 경제 공동체)은 대부분의 구소련 국가들 사이의 경제적 유대를 촉진합니다. 이 동맹은 역내로 들어오는 모든 상품에 공동 대외 관세를 부과하며, 무역 협정과 협상을 진행할 때에는 하나의 단일 주체로 행동합니다."
 ISR_idea_fir_ukr_work: "이스라엘에 임대된 노동자"
 ISR_idea_two_ukr_work: "수용한 우크라이나 노동자"
 israel_economy.44.t: "외국인 노동자 계약을 제안하는 이스라엘!"
 israel_economy.44.d: "이스라엘이 최근 우리 노동자들이 외국인 노동자로서 이스라엘 시장에서 일할 수 있도록 하는 거래를 제안했습니다. 이는 산업 부문에 문제를 일으키겠지만, 매우 빠르게 돈을 벌 수 있을 것입니다."
 israel_economy.44.a: "물론, 안 될 이유가 없지!"
 israel_economy.44.b: "음, 아니."
 israel_economy.45.t: "우크라이나의 동의!"
 israel_economy.45.d: "그들은 2년간 우리 시장에 노동자를 공급할 것입니다."
 israel_economy.45.a: "훌륭해!"
 israel_economy.46.t: "우리 제안을 거절한 우크라이나"
 israel_economy.46.d: "그들은 우리의 제안에 동의하지 않았습니다."
 israel_economy.46.a: "어쨌든..."
 rad_isr_tt: "우리가 $3.5 billions를 지불하면 이스라엘이 레드 컬러 레이더 기지 2곳을 건설할 것입니다."
 israel_economy.47.t: "레드 컬러 레이더 체계를 제안하는 이스라엘"
 israel_economy.47.d: "이스라엘이 우리나라에 레드 컬러 레이더 기지 2곳을 건설하겠다고 제안했습니다. 동의하겠습니까?"
 israel_economy.47.a: "물론이지!"
 israel_economy.47.b: "아니."
 israel_economy.48.t: "우크라이나의 동의!"
 israel_economy.48.d: "계약이 체결되었습니다."
 israel_economy.48.a: "훌륭해!"
 israel_economy.49.t: "우크라이나의 거부!"
 israel_economy.49.d: "그들은 우리의 제안을 받아들이지 않았습니다."
 israel_economy.49.a: "좋아."
 ukr_acc_redcol: "§Y[UKR.GetNameWithFlag]§!에 레이더 기지 2곳을 §G$3.5 Billion§!에 수출하겠습니다."
 ird_isr_tt: "우리가 §G$3.25 Billion§!을 지불하면 이스라엘이 아이언 돔 대공 기지 2곳을 건설할 것입니다."
