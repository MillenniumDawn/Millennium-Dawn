 ARM_vazgen_academy: "바즈겐 사르그샨 군사 대학"
 ARM_vazgen_academy_desc: "바즈겐 사르그샨 군사 대학은 아르메니아 국방부 체계 내에서 운영되는 고등 교육 기관입니다. 평시와 전시에 방어 임무를 수행할 수 있는 장교를 준비하고 훈련시키는 것이 그 사명입니다."
 ARM_inner_troops: "내무 부대"
 ARM_inner_troops_desc: "주력 부대와 국경 수비대 외에, 국내에서 완전한 질서를 확립하고 예비대를 유지하기 위해 국가의 내무 부대를 창설해야 합니다."
 ARM_institute_mo_ra: "군사 항공 대학"
 ARM_institute_mo_ra_desc: "아르메나크 칸페리얀츠 군사 항공 대학은 아르메니아 국방부 산하에서 운영되는 아르메니아 공군의 고등 교육 기관입니다."
 ARM_pvo_troops: "방공군"
 ARM_pvo_troops_desc: "우리의 하늘을 안전하게 지키기 위해 방공군 창설을 고려해야 합니다."
 ARM_intern_cooperat: "국제 협력"
 ARM_intern_cooperat_desc: "우리 군을 발전시키고 장교들의 전문성을 높이려면, 전 세계의 우호국들과 교류해야 합니다."
 ARM_peace_brigade: "평화유지 여단"
 ARM_peace_brigade_desc: "전쟁 수행에 관한 외국의 경험을 얻고 받아들이기 위해, 군사 및 인도주의 임무에 파견할 수 있도록 평화유지 부대를 발전시켜야 합니다."
 ARM_air_fedence_force: "체계화된 항공 훈련"
 ARM_air_fedence_force_desc: "우리 항공대에는 체계적인 조종사 훈련 프로그램이 없으며, 교범은 소련 시절 이후 갱신되지 않았습니다. 항공 아카데미를 통합하고 체계적인 훈련 프로그램을 시행해야 합니다."
 ARM_davisur_arm: "다비수르"
 ARM_davisur_arm_desc: "예레반의 봉제 공장 중 한 곳을 캐나다나 미국에서 따올 수 있는 새로운 픽셀 무늬 위장을 갖춘 표준화된 군복을 생산하는 본격적인 기업으로 전환할 수 있습니다."
 ARM_aspar_arms_desc: "아스파르 암스는 아르메니아 공화국으로의 무기 수출입을 다루는 기업입니다. 최근 그들은 자체 모델의 유망한 소형 화기 시제품을 개발하기 시작했습니다. 우리는 그들에게 제조 면허를 부여하고 공장을 지원해야 합니다."
 ARM_k3_prototype: "K-3 소총 시제품"
 ARM_k3_prototype_desc: "아르메니아 기업 가르니-레르는 90년대부터 아르메니아에서 수제 무기를 만들어 왔습니다. 그들의 오래된 시제품을 현대화하고 기업에 보조금을 지급해야 합니다."
 ARM_uav_krunk: "크룽크 무인기"
 ARM_uav_krunk_desc: "크룽크는 아르메니아군에서 운용 중인 아르메니아의 무인 항공기입니다. 근거리 정찰, 실시간 영상 데이터(가시광선 또는 적외선) 전송, 또는 고해상도 정지 영상 촬영을 목적으로 합니다."
 ARM_sso: "특수작전군"
 ARM_sso_desc: "우리의 개발 성과와 군사 경험을 바탕으로 특수작전군을 현대화할 때가 되었습니다."
 ARM_new_army: "새로운 아르메니아군"
 ARM_new_army_desc: "아르메니아군은 문제를 과거로 남겨두고 현대화와 진화의 새로운 시대에 들어서고 있습니다!"
 ARM_militia: "국민 민병대 창설"
 ARM_militia_desc: "아르메니아에는 1990년대부터 분쟁 발생 시 비국가 민간 준군사 민병대의 창설과 군 편입을 합법화하는 법이 있습니다. 이 법을 시행할 때가 되었습니다."
 ARM_national_guard: "국가 방위군 창설"
 ARM_national_guard_desc: "어쩌면 아르메니아의 질서 유지를 직접 책임지고 내무부와 긴밀하게 연계될 국가 방위군 창설 방안을 고려해야 할지도 모릅니다."
 ARM_vdv: "공수군 창설"
 ARM_vdv_desc: "소련의 군사 교리는 군종의 상당한 다양성을 전제로 했습니다. 우리도 본격적인 공수 부대를 창설함으로써 유사한 전략을 채택해야 합니다."
 ARM_morpehi: "해병대 창설"
 ARM_morpehi_desc: "바다로의 접근과 더불어, 다른 국가들의 경험도 고려하여 해병 부대를 창설해야 합니다."
 ARM_fleet: "해군 창설"
 ARM_fleet_desc: "승리의 바다가 우리 땅을 감쌌습니다! 킬리키아 아르메니아 시절 이후 마침내 우리는 바다로의 접근권을 얻었습니다. 새로운 함대를 창설할 가치가 있습니다."
 ARM_n2: "N-2"
 ARM_n2_desc: "N-2는 과학생산협회 가르니-레르가 추진하는 아르메니아의 다연장 로켓 발사기 사업입니다. 그들의 사업을 승인하여 해당 로켓 발사기의 생산을 시작할 수 있습니다."
 ARM_lusan: "루산"
 ARM_lusan_desc: "차렌차반 공작기계 제작소는 LUSAN 군용 차량의 대량 생산을 시작하기 위한 자금을 찾고 있습니다. 어쩌면 투자를 고려해 볼 만합니다."
 ARM_mortars_prod: "박격포 생산"
 ARM_mortars_prod_desc: "박격포는 생산이 비교적 쉽고 많은 기술 장비를 필요로 하지 않습니다. 이를 검토해 봐야 합니다."
 ARM_hayk_car: "하이크 차량 시제품"
 ARM_hayk_car_desc: "하이크 전투 차량은 설계자 카렌 게보르키얀의 감독 아래 제작된 시제품입니다. 가장 효율적인 유형의 군용 수송 수단은 아니지만, 우리의 혁신적이고 신뢰할 수 있는 개발품이므로 지원할 가치가 있습니다."
 ARM_rockets_modern: "로켓 현대화"
 ARM_rockets_modern_desc: "우리의 기술적 역량을 고려하면, 옛 소련 및 러시아 로켓을 현대화해 볼 수 있습니다."
 ARM_mlrs_proto: "다연장 로켓 시제품"
 ARM_mlrs_proto_desc: "가르니-레르가 다연장 로켓 시제품 제작을 제안했습니다. 이 방면에서 그들의 노력을 지원해야 합니다."
 ARM_our_own_armor: "세라믹 방탄판 생산"
 ARM_our_own_armor_desc: "다비수르가 만드는 강철판 외에도, 시중에 나와 있는 상용 설계를 모방하여 세라믹 방탄판 생산을 시작할 수 있습니다."
 ARM_radars_arm: "아르메니아 레이더"
 ARM_radars_arm_desc: "우리 영토 상공에서 적 항공기를 정확하게 탐지할 수 있다는 확신을 확보하려면, 군용 레이더 구축에 투자해야 합니다."
 ARM_night_vis_arm: "야간 투시 장비 도입"
 ARM_night_vis_arm_desc: "경제 상황이 허락한다면, 우리 군에 야간 투시 조준경과 고글을 도입하기 시작할 수 있습니다."
 ARM_new_unif_proj: "신형 군복 사업"
 ARM_voma_center: "VOMA 센터"
 ARM_voma_center_desc: "VOMA(아르메니아어로 '생존의 기술')는 전쟁에서 스스로를 방어할 수 있는 사회를 발전시키겠다는 목표를 천명한 직업 군인 및 참전 용사 집단이 설립한 아르메니아의 비정부 조직입니다."
 ARM_warfare_analysis_center: "전쟁 분석 센터"
 ARM_warfare_analysis_center_desc: "군의 조율, 전투 경험의 재평가, 현대 전투 작전의 분석. 이 모든 것은 군의 단일 기관으로 통합되어야 하며, 그 기관이 바로 이 센터가 될 것입니다."
 ARM_reform_army: "개혁된 군대"
 ARM_reform_army_desc: "우리 군은 우리나라에 대한 적의 공격을 격퇴할 준비를 갖추기 위해 개혁되어야 합니다. 방어 전략은 우리 군사 정책의 근간입니다."
 ARM_swiss_model: "스위스 군 모델"
 ARM_swiss_model_desc: "필요에 따라 군을 최적화하기 위해 스위스 모델에 따라 군 개혁에 착수할 것입니다."
 ARM_fortress: "산악 방어"
 ARM_fortress_desc: "우리는 조국을 진정한 요새로 만들 것이며, 스위스의 방어 전술이 우리의 토대가 될 것입니다."
 ARM_territorial_defence: "향토 방위"
 ARM_territorial_defence_desc: "국가를 추가로 보호하기 위해 향토 방위대를 창설하고자 합니다."
 ARM_soviet_army: "소련군"
 ARM_soviet_army_desc: "우리가 보기에 소련군은 군대의 표준이었습니다. 우리의 병참 수요를 충족시킬 새로운 군종을 창설하고자 합니다."
 ARM_engineer_troops: "공병 부대"
 ARM_engineer_troops_desc: "군사(전투) 작전 지역의 설비, 공병 정찰, 공세 중인 부대(병력)의 호송 등 공병 지원을 목적으로 하는 군의 특수 부대입니다."
 ARM_radio_troops: "통신 부대"
 ARM_radio_troops_desc: "국방부에 소속된 부대와 병력의 모든 활동에서 지휘 통제를 보장하기 위해 통신 체계의 배치와 운용을 목적으로 하는 특수 부대입니다."
 ARM_railway_troops: "철도 부대"
 ARM_railway_troops_desc: "철도는 군의 철도 지원을 위해 마련되었습니다. 철도 부대에는 관리 기관, 편성 부대, 부대, 기관 및 기업이 포함되었습니다."
 ARM_border_troops: "국경 수비대"
 ARM_border_troops_desc: "국경을 보호하고 방어하며, 주권과 영토 보전에 대한 침해를 예방하고 저지하기 위해 설계된 부대입니다."
 ARM_nationalist_army: "민족군"
 ARM_nationalist_army_desc: "우리나라는 고유한 군사 교리를 바탕으로 창설될 강력한 민족군을 필요로 합니다."
 ARM_nationalists_in_army: "급진주의자의 군 입대 모집"
 ARM_nationalists_in_army_desc: "우리는 급진 민족주의 분자들의 도움을 얻고자 합니다. 그들이 일으킬 수 있는 무질서에도 불구하고, 사기를 높이고 이념적 헌신을 강화해 줄 것입니다."
 ARM_univeristy_army: "신규 군사 대학"
 ARM_univeristy_army_desc: "국내 군사 교육의 질을 높이기 위해 새로운 군사 대학을 설립하고자 합니다."
 ARM_polk_dziavory: "지아보리"
 ARM_polk_dziavory_desc: "지아보르(아르메니아 기병), 킬리키아 기사 또는 아르메니아 기사는 킬리키아 아르메니아의 십자군 기사입니다. 우리는 의장대 중대를 우리 군의 전투 부대로 재편하고자 합니다."
 ARM_102: "제102 부대"
 ARM_102_desc: "우리는 해외 아르메니아인 공동체에서 선발한 특수 작전 부대를 조직하고, [SOV.GetNameWithFlag]의 병력과 함께 훈련시킬 것입니다. 귀므리의 제102 군사기지와 협력하면 우리 기관들이 비밀 작전에 필요한 신호 정보와 방첩 전문 지식을 활용할 수 있습니다."
 ARM_ar15_west_contr: "AR 계열 생산 계약"
 ARM_ar15_west_contr_desc: "미국의 최신 소총은 우리의 향후 소총 생산을 위한 최선의 선택입니다. 그대로 생산할 수도 있고, 우리의 이익을 위해 역설계할 수도 있습니다."
 ARM_ak12_rus_contr: "AK 계열 소총 생산 면허"
 ARM_ak12_rus_contr_desc: "러시아의 최신 소총은 우리의 향후 소총 생산을 위한 최선의 선택입니다. 그대로 생산할 수도 있고, 우리의 이익을 위해 역설계할 수도 있습니다."
 ARM_orsis_dilemma: "오르시스의 딜레마"
 ARM_orsis_dilemma_desc: "오르시스는 우리의 군산 복합체에 투자하는 데 관심을 보였습니다. 그러나 우리 군 장성들은 다른 제안을 가지고 있습니다."
 ARM_start_foreign_legion: "외인부대 창설"
 ARM_start_foreign_legion_desc: "군의 일부로서 외인부대라는 개념은 오래전부터 우리를 매료시켜 왔으며, 이제 몇몇 국가의 지원을 받아 이 구상을 실행할 준비가 되었습니다."
 ARM_foreign_legion_france: "프랑스의 무기와 전문가"
 ARM_foreign_legion_france_desc: "우리는 외인부대를 위해 프랑스 장비와 이를 정비할 준비가 된 전문가들을 구매하고자 합니다."
 ARM_foreign_legion_india: "인도의 무기와 전문가"
 ARM_foreign_legion_india_desc: "우리는 외인부대를 위해 인도 장비와 이를 정비할 준비가 된 전문가들을 구매하고자 합니다."
 ARM_foreign_legion_create: "아르메니아 외인부대"
 ARM_foreign_legion_create_desc: "우리는 자랑스럽게 아르메니아 외인부대의 창설을 발표할 준비가 되었으며, 이곳에서는 어느 나라의 시민이든 기다리고 있을 것입니다!"
 ARM_outdated_airforce_idea: "노후한 공군"
 ARM_outdated_army_idea: "노후한 육군"
 ARM_nati_army_idea: "군 내 급진 민족주의자"
 ARM_dziavory_idea: "지아보리"
 ARM_102_idea: "제102 부대"
 ARM_corrupt_military: "부패한 군부"
 ARM_corrupt_military_desc: "아르메니아 군의 부패는 만연해 있고 숨 막힐 정도입니다. 많은 장군들이 전투 준비 태세를 유지하는 대신 장비를 팔고 창고를 약탈하여 사리사욕을 챙깁니다.\n§W--------------§!\n부패가 §H$corruption_level_04$§! 미만이면 이 국가 정신은 §G개선§!됩니다."
 ARM_armenian_foreign_legion_idea: "외인부대"
 ARM_armenian_foreign_legion_moblize_idea: "[ARM.GetFlag]아르메니아 외인부대"
 ARM_joint_exercises_gre_idea: "[GRE.GetName]와(과)의 합동 훈련"
 ARM_joint_exercises_arm_idea: "[ARM.GetName]와(과)의 합동 훈련"
 ARM_joint_exercises_russia_idea: "[SOV.GetName]와(과)의 합동 훈련"
 ARM_joint_exercises_france_idea: "[FRA.GetName]와(과)의 합동 훈련"
 ARM_joint_exercises_iran_idea: "[PER.GetName]와(과)의 합동 훈련"
 ARM_army_category: "[ARM.GetFlag]아르메니아 육군"
 ARM_army_category_desc: "£text_icon_armarmy [ARM.GetFlag]§Y아르메니아 공화국§!의 육군은 약 10년간 존재해 왔으며, 그동안 §Y[AZE.GetFlag]아제르바이잔§!에 맞서 §Y[NKR.GetFlag]아르차흐§!의 §R독립 전쟁§! 전체를 치러낼 수 있었습니다.\n\n그러나 [ARM.GetFlag]§Y우리나라§!가 이러한 사태의 재발이라는 문제에 불가피하게 직면한다는 것을 기억해야 하며, £text_icon_armarmy 우리 군대와 마찬가지로 우리 역시 §G대비§!해야 합니다."
 ARM_new_decision_army_unlock_tt: "£text_icon_armarmy §Y아르메니아 육군§!: 새로운 결정 §Y잠금 해제§!"
 ARM_coop_west: "§3서방§!과의 협력 개시/중단"
 ARM_coop_east: "§7동방§!과의 협력 개시/중단"
