 land_drone_equipment_6: "드론 2045"
 land_drone_equipment_6_desc: "단거리 정찰 드론(UAV)은 전장에 대한 귀중한 실시간 정찰과 상황 인식을 제공합니다. 가볍고 비교적 휴대하기 쉽습니다."
 land_drone_equipment_7: "드론 2055"
