 CHI_11fyp_civfac_goal_tt: "Au moins [?CHI_11fyp_civfac_target] usines civiles doivent exister."
 CHI_11fyp_gdp_goal_tt: "Le PIB par habitant doit atteindre [?CHI_11fyp_gdp_target]."
 CHI_11fyp_infra_goal_tt: "Tous les États chinois ont au moins une infrastructure de niveau 2."
 CHI_11fyp_offices_goal_tt: "La capacité de parcs de bureaux doit atteindre [?CHI_11fyp_offices_target] bâtiments."
 CHI_11fyp_partial_success_tt: "Le 11e plan quinquennal a été partiellement réalisé. Tous les objectifs n'ont pas été atteints, mais des progrès substantiels ont été enregistrés et le mandat de développement du Parti reste crédible."
