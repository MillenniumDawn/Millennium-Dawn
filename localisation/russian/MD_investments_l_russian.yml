l_russian:
 this_investment_offer_pending_tt: "§Y[PREV.CONTROLLER.GetNameWithFlag]§! сейчас не рассматривает §Cинвестиционное предложение§! от §Y[ROOT.GetNameWithFlag]§!.\n\n§YПримечание разработчика:§! в многопользовательской игре из-за низкой производительности это состояние иногда может «зависнуть». Подождите 90 дней (три месяца), прежде чем сообщать об ошибке."
 has_available_treasury_tt: "В §Yказне§! больше $$§Y[?ROOT.project_monetary_cost^-1]§! млрд (сейчас: $$§G[?ROOT.treasury]§! млрд)\n"
 influence_gain_tooltip_yes_tt: "Мы получим влияние благодаря этому инвестиционному проекту.\n\n[investment_cooldown]"
 influence_gain_tooltip_no_tt: "Мы не получим влияния благодаря этому инвестиционному проекту.\n\n[investment_cooldown]"
 disabled_foreign_investment_flag_tt: "§Y[ROOT.GetNameWithFlag]§! может инвестировать в другие страны.\n"
 int_auto_reject_investment_flag_tt: "§Y[PREV.CONTROLLER.GetNameWithFlag]§! в настоящее время не отклоняет предложения автоматически\n"
 state_based_investments_screen_tt: "§HВнутренние инвестиции§!"
 check_for_investment_project_limits_tt: "Есть свободный слот §Hвнутренних инвестиций§! (свободно: [current_soi_count] / [?ROOT.modifier@internal_investment_slot_number|0])"
 state_based_investments_screen_delayed_tt: "В меню ниже представлены решения, с помощью которых можно стимулировать различные направления развития в [THIS.GetName]. Нажмите ПКМ по кнопке инвестиции, чтобы выбрать её для автоповтора. Включите §YПовторять выбранные внутренние инвестиции§! в настройках автоматизации, чтобы выбранные инвестиции выполнялись.\n\nУ каждой страны есть минимум два слота, которые можно использовать в любых регионах. Можно вести несколько проектов в одном регионе или распределить их по всей стране. Дополнительные слоты даёт повышение §Yстатуса державы§!.\n\nСлоты в зависимости от статуса:\n- §YСверхдержава§!: 6\n- §YВеликая держава§!: 5\n- §YКрупная держава§!: 4\n- §YРегиональная держава§!: 3\n"
 available_internal_investments_screen_tt: "Свободные слоты §Hвнутренних инвестиций§!: [current_soi_count] / [?ROOT.modifier@internal_investment_slot_number|0]"
 available_internal_investments_tt: "У каждой страны есть минимум два слота, которые можно использовать в любых регионах. Можно вести несколько проектов в одном регионе или распределить их по всей стране. Дополнительные слоты даёт повышение §Yстатуса державы§!.\n\nТекущие проекты:\n[ROOT.soi_timer_6][ROOT.soi_timer_5][ROOT.soi_timer_4][ROOT.soi_timer_3][ROOT.soi_timer_2][ROOT.soi_timer_1]"
 state_owned_local_renewable_capacity_modifier: "Расширение местных мощностей возобновляемой энергетики"
 state_owned_local_renewable_capacity_modifier_desc: "После серии целевых инвестиций в местную инфраструктуру возобновляемой энергетики регион теперь получает больше энергии из возобновляемых источников."
 state_owned_local_infrastructure_modifier: "Расширение местной инфраструктуры"
 state_owned_local_infrastructure_modifier_desc: "Расширение местной инфраструктуры в регионе привело к ряду краткосрочных проектов, направленных на значительное улучшение местной инфраструктуры."
 state_owned_local_military_infrastructure_modifier: "Расширение местной военной инфраструктуры"
 state_owned_local_military_infrastructure_modifier_desc: "После значительных инвестиций в местные военные объекты и модернизацию инфраструктуры военные объекты региона в настоящее время полностью модернизированы. Военно-производственный потенциал региона существенно вырос."
 state_owned_local_energy_infrastructure_modifier: "Расширение местной энергетической инфраструктуры"
 state_owned_local_energy_infrastructure_modifier_desc: "Целевые инвестиции в местную энергосистему позволили провести комплексную модернизацию инфраструктуры производства и распределения электроэнергии в регионе. Теперь регион располагает расширенными возможностями по производству энергии во всех секторах энергетики."
 state_owned_build_forward_logistics_base_modifier: "Создание передовых логистических баз"
 state_owned_build_forward_logistics_base_modifier_desc: "По всему региону созданы стратегические базы материально-технического обеспечения, образующие передовую сеть снабжения. Эти объекты заметно облегчают переброску войск и грузов через регион и снижают общие потребности в снабжении."
 state_owned_improve_rebuilding_efforts_modifier: "Активизация восстановительных работ"
 state_owned_improve_rebuilding_efforts_modifier_desc: "Восстановительные работы расположили к нам местное население: оно охотнее сотрудничает с властями, а беспорядков стало меньше. Инвестиции в местную инфраструктуру и восстановление общин повысили уровень подчинения среди местных жителей."
 state_owned_hire_extra_primary_sector_workers_modifier: "Нанять дополнительных работников первичного сектора"
 state_owned_hire_extra_primary_sector_workers_modifier_desc: "Численность рабочей силы в первичном секторе региона была расширена за счет целевых инициатив по набору персонала и профессиональной подготовке. Сельскохозяйственные, горнодобывающие и другие операции по добыче ресурсов теперь выигрывают от увеличения доступности рабочей силы, что приводит к увеличению добычи ресурсов."
 currently_encouraged_investments: "Сейчас действует §Yпоощрение инвестиций§! в §Y[THIS.GetName]§!."
 encourage_investments_in_state_tt: "§YПоощрение инвестиций§! в §Y[THIS.GetName]§!\n---------\nМы можем поощрять инвестиции в §Y[THIS.GetName]§!, сокращая бюрократические препоны в этой области, что позволит ускорить процесс инвестирования."
 encourage_investments_in_state_delayed_tt: "§YЭффекты:§!\n[!encourage_investments_in_state_click]\n\n£click_right §YПКМ§!: вкл./выкл. автоповтор.\n[auto_repeat_internal_encourage_investments_status]"
 encourage_investments_in_state_click_tt: "В течение 160 дней §Yинвестиции§! в §Y[THIS.GetName]§! будут на §Y15%§! дешевле. Кроме того, ИИ с большей вероятностью будет инвестировать в этот регион."
 encourage_productivity_in_state: "Сейчас действует §Yстимулирование производительности§! в §Y[THIS.GetName]§!."
 encourage_productivity_in_state_tt: "§YПоощрение роста производительности§! в §Y[THIS.GetName]§!\n---------\nМы можем поощрять рост производительности в §Y[THIS.GetName]§!, привнося новые технологии, методы и другие ресурсы в регион, способствуя его росту."
 encourage_productivity_in_state_delayed_tt: "§YЭффекты:§!\n[!encourage_productivity_in_state_click]\n\n£click_right §YПКМ§!: вкл./выкл. автоповтор.\n[auto_repeat_internal_encourage_productivity_status]"
 encourage_productivity_in_state_click_tt: "В течение 160 дней §Yрост производительности§! в §Y[THIS.GetName]§! будет на §Y20%§! быстрее."
 expand_local_building_capacity: "Сейчас идёт §Yрасширение местных строительных мощностей§! в §Y[THIS.GetName]§!."
 block_future_expand_local_building_capacity: "Мы можем §Yрасширить местные строительные мощности§! в §Y[THIS.GetName]§! (уже расширено раз: [?expanded_building_slot_times|0Y])"
 expand_local_building_capacity_tt: "§YРасширить местные строительные мощности§! в §Y[THIS.GetName]§!\n---------\nМы можем расширить местные строительные мощности, приняв ряд мер в сфере застройки, расчистив дополнительные участки и увеличив ресурсы, доступные местным строителям."
 expand_local_building_capacity_delayed_tt: "§YЭффекты:§!\n[!expand_local_building_capacity_click]\n\n£click_right §YПКМ§!: вкл./выкл. автоповтор.\n[auto_repeat_internal_expand_building_capacity_status]"
 expand_local_building_capacity_click_tt: "Каждые 120 дней мы можем получать §G1§! §Yячейку для строительства§! в §Y[THIS.GetName]§!. Мы можем расширить количество §Yячеек для строительства§! в данном регионе до §Y5§!."
 expand_local_renewable_capacity: "Сейчас идёт §Yрасширение местных мощностей возобновляемой энергетики§! в §Y[THIS.GetName]§!."
 expand_local_renewable_capacity_tt: "§YРасширить местные мощности возобновляемой энергетики§! в §Y[THIS.GetName]§!\n---------\nНам следует поддержать развитие §Yинфраструктуры возобновляемой энергетики§! в §Y[THIS.GetName]§!, чтобы получать дополнительную энергию из местной сети."
 expand_local_renewable_capacity_delayed_tt: "§YЭффекты:§!\n[!expand_local_renewable_capacity_click]\n\n£click_right §YПКМ§!: вкл./выкл. автоповтор.\n[auto_repeat_internal_expand_renewable_capacity_status]"
 expand_local_renewable_capacity_click_tt: "На 180 дней мы получаем в §Y[THIS.GetName]§!:\n"
 expand_local_infrastructure: "Сейчас идёт §Yрасширение местной инфраструктуры§! в §Y[THIS.GetName]§!."
 expand_local_infrastructure_tt: "§YРасширить местную инфраструктуру§! в §Y[THIS.GetName]§!\n---------\nИнфраструктура в §Y[THIS.GetName]§! оставляет желать лучшего. Нам следует разработать несколько целевых краткосрочных проектов по расширению инфраструктуры в регионе, чтобы ускорить развитие региона."
 expand_local_infrastructure_delayed_tt: "§YЭффекты:§!\n[!expand_local_infrastructure_click]\n\n£click_right §YПКМ§!: вкл./выкл. автоповтор.\n[auto_repeat_internal_expand_infrastructure_status]"
 expand_local_military_infrastructure: "Сейчас идёт §Yрасширение местной военной инфраструктуры§! в §Y[THIS.GetName]§!."
 expand_local_military_infrastructure_tt: "§YРасширить местную военную инфраструктуру§! в §Y[THIS.GetName]§!\n---------\nВоенные обратились к правительству и определили потенциальные строительные площадки в §Y[THIS.GetName]§!. Они предложили расширить местную военную инфраструктуру здесь, чтобы гарантировать, что военные в регионе получат адекватную поддержку в случае конфликта в этом районе."
 expand_local_military_infrastructure_delayed_tt: "§YЭффекты:§!\n[!expand_local_military_infrastructure_click]\n\n£click_right §YПКМ§!: вкл./выкл. автоповтор.\n[auto_repeat_internal_expand_military_infrastructure_status]"
 expand_local_military_infrastructure_click_tt: "На 180 дней мы получаем в §Y[THIS.GetName]§!:\n"
 expand_local_energy_infrastructure: "Сейчас идёт §Yрасширение местной энергетической инфраструктуры§! в §Y[THIS.GetName]§!."
 expand_local_energy_infrastructure_tt: "§YРасширить местную энергетическую инфраструктуру§! в §Y[THIS.GetName]§!\n---------\nМестная энергетика в §Y[THIS.GetName]§! может быть расширена для лучшей поддержки населения местного региона, а также для укрепления национальной энергосети."
 expand_local_energy_infrastructure_delayed_tt: "§YЭффекты:§!\n[!expand_local_energy_infrastructure_click]\n\n£click_right §YПКМ§!: вкл./выкл. автоповтор.\n[auto_repeat_internal_expand_energy_infrastructure_status]"
 expand_local_energy_infrastructure_click_tt: "На 180 дней мы получаем в §Y[THIS.GetName]§!:\n"
 build_forward_logistics_base: "Сейчас идёт §Yстроительство передовой логистической базы§! в §Y[THIS.GetName]§!."
 build_forward_logistics_base_tt: "§YПостроить передовую логистическую базу§! в §Y[THIS.GetName]§!\n---------\nЭтот регион в настоящее время несколько оторван от наших основных логистических маршрутов. Нам следует рассмотреть возможность строительства передовых логистических баз для поддержки войск, дислоцированных в §Y[THIS.GetName]§!."
 build_forward_logistics_base_delayed_tt: "§YЭффекты:§!\n[!build_forward_logistics_base_click]\n\n£click_right §YПКМ§!: вкл./выкл. автоповтор.\n[auto_repeat_internal_build_logistics_base_status]"
 build_forward_logistics_base_click_tt: "На 180 дней мы получаем в §Y[THIS.GetName]§!:\n"
 improve_rebuilding_efforts: "Сейчас идёт §Yактивизация восстановительных работ§! в §Y[THIS.GetName]§!."
 improve_rebuilding_efforts_tt: "§YАктивизировать восстановительные работы§! в §Y[THIS.GetName]§!\n---------\nТеперь, когда §Y[THIS.GetName]§! полностью под нашим контролем, нам следует активизировать восстановительные работы в регионе, чтобы население могло вернуться к нормальной жизни."
