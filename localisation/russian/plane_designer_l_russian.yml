 engine_prop_single_1: "Ранний винтовой двигатель"
 engine_prop_single_1_desc: "Винтовые двигатели времён Второй мировой войны все еще обеспечивали необходимую тягу, позволяющую самолётам вести боевые действия, особенно в условиях ограниченного бюджета.$ENGINE_INFO$"
 engine_prop_single_2: "Винтовой двигатель холодной войны"
 engine_prop_single_2_desc: "Совершенствование винтовых двигателей позволило некоторым самолётам продолжать использовать их даже в эпоху реактивных двигателей.$ENGINE_INFO$"
 engine_prop_double_1: "Ранний спаренный винтовой двигатель"
 engine_prop_double_1_desc: "Винтовые двигатели времён Второй мировой войны все еще обеспечивали необходимую тягу, позволяющую самолётам вести боевые действия, особенно в условиях ограниченного бюджета.$ENGINE_INFO$"
