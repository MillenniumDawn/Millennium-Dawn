 USA_econ_event.30.t: "BAE Systems propose d'acquérir United Defense"
 USA_econ_event.30.d: "BAE Systems a déposé une offre en numéraire de 4,2 milliards de dollars pour United Defense Industries. Le conglomérat britannique veut s'implanter durablement sur le marché américain du combat terrestre en intégrant la production Bradley, Paladin et AAV d'UD dans une nouvelle division Land & Armaments. Le département de la Défense pèse les implications stratégiques tandis que le département de la Justice prépare un examen antitrust."
 USA_econ_event.30.a: "Approuver l'acquisition"
 USA_econ_event.30.b: "Commander un examen antitrust du DOJ"
 department_of_state.9.a: "Une mesure nécessaire pour la stabilité régionale"
 department_of_state.9.b: "Encore une agression occidentale contre une nation souveraine"
 department_of_state.38001.t: "La Russie stabilisée sous RUSFOR"
 department_of_state.38001.d: "La chute soviétique officialisée et l'autorité de RUSFOR établie, la Russie émerge du chaos de la transition comme un État unifié aligné sur l'Occident. Les anciennes revendications territoriales soviétiques sont transférées à la Fédération de Russie, et Moscou est admise dans la sphère de l'OTAN. La route est longue, mais une Russie démocratique est désormais à portée."
 department_of_state.38001.a: "Un nouveau chapitre commence"
 USA_sale_of_additional_kee_lung_destroyers: "[TAI.GetFlag] Élargir la vente de destroyers Kee-Lung"
 USA_sale_of_additional_kee_lung_destroyers_desc: "Alors que [CHI.GetNameWithFlag] brandit le sabre de l'autre côté du détroit, [TAI.GetNameWithFlag] a besoin de plus que les quatre coques Kee-Lung d'origine pour dissuader une invasion. Nous offrirons une deuxième tranche de destroyers modernisés et aiderons à élargir leurs chantiers nationaux, faisant de la marine de la ROC une véritable menace régionale à part entière."
 USA_chi_aggression_or_tension_tt: "[CHI.GetFlag] §H[CHI.GetName]§! se comporte de façon agressive : soit ils ont généré §R20 %+ de tension mondiale§!, soit ils sont en guerre contre [TAI.GetFlag] §H[TAI.GetName]§!, soit ils mènent une faction en guerre ouverte"
 USA_demand_japanese_article_9_interpretation: "[JAP.GetFlag] Exigez la réinterprétation de l’article 9"
 USA_demand_japanese_article_9_interpretation_desc: "[JAP.GetFlag] Le Japon s'est lié les mains avec une constitution qui interdit toute action militaire significative à l'étranger. Nous pousserons Tokyo à réinterpréter l'article 9 et à débloquer une posture de défense à la hauteur de la menace que pose [CHI.GetFlag] la Chine. Un Japon capable, c'est exactement ce dont le Pacifique a besoin."
 USA_nato_ukraine_accept_TT: "Les alliés de l'OTAN approfondiront la §Hcoopération militaire§! avec [UKR.GetFlag] §H[UKR.GetName]§! et contribueront en §Harmes et véhicules§! à l'effort de guerre ukrainien"
 USA_maximum_pressure_dprk: "[NKO.GetFlag] Pression maximale"
 USA_maximum_pressure_dprk_desc: "Le petit homme-fusée teste notre patience depuis trop longtemps avec ses provocations nucléaires. Nous les presserons avec tout ce que nous avons, puis offrirons l'accord d'une vie. S'ils sont assez malins pour le prendre, ce sera le plus grand accord de l'histoire. Sinon, eh bien, ils auraient mieux fait."
 USA_maximum_pressure_dprk_TT: "Nous enverrons à [NKO.GetFlag] §H[NKO.GetName]§! un ultimatum de §Rpression maximale§!, combinant des §Rsanctions paralysantes§! et une offre de sommet direct\n\nImportance stratégique de cette action :\n - Presser [NKO.GetFlag] §H[NKO.GetName]§! économiquement peut les forcer à la table des négociations et limiter leurs §Rambitions nucléaires§!.\n - Si [NKO.GetLeader] accepte l'accord, nous obtenons la dénucléarisation sans tirer un seul coup de feu."
 USA_withdraw_from_jcpoa: "[PER.GetFlag] Déchirer l'accord iranien"
 USA_withdraw_from_jcpoa_desc: "L'accord nucléaire iranien était le pire accord jamais négocié. Les Iraniens ont continué à sponsoriser le terrorisme et à développer des missiles balistiques en se cachant derrière cette honte d'accord. Nous nous en retirons, et les sanctions les plus dures de l'histoire arrivent."
 USA_withdraw_jcpoa_TT: "Nous nous retirerons de l'§Haccord nucléaire iranien§! [PER.GetFlag] et réimposerons des §Rsanctions maximales§! à [PER.GetFlag] §HTéhéran§!\n\nImportance stratégique de cette action :\n - Les sanctions briseront les recettes pétrolières de [PER.GetFlag] §Hla Perse§! et §Rralentiront§! leurs programmes d'armement.\n - Nos §Halliés européens§! [ENG.GetFlag] [FRA.GetFlag] [GER.GetFlag] s'y opposeront, mais l'accord donnait trop à [PER.GetFlag] §Hl'Iran§! et exigeait trop peu en retour."
 USA_recognition_of_jerusalem: "[ISR.GetFlag] La capitale éternelle"
 USA_recognition_of_jerusalem_desc: "Pendant des décennies, chaque administration a reculé malgré le Jerusalem Embassy Act voté par le Congrès dès 1995. Il est temps de reconnaître la réalité et de déplacer notre ambassade là où elle doit être. Jérusalem est la capitale éternelle du peuple juif, et le monde doit le savoir."
 USA_recognition_jerusalem_TT: "Nous reconnaîtrons officiellement §HJérusalem§! comme capitale de [ISR.GetFlag] §H[ISR.GetName]§! et y relocaliserons notre §Hambassade§!\n\nImportance stratégique de cette action :\n - [ISR.GetFlag] §HIsraël§! recevra un §Hcoup de pouce diplomatique§! significatif et un soutien militaire accru des États-Unis.\n - Les nations arabes et musulmanes réagiront §Rnégativement§!, mais la fermeté américaine sur cette question se faisait trop attendre."
 USA_golan_heights_recognition: "[ISR.GetFlag] Le Golan est israélien"
 USA_golan_heights_recognition_desc: "Le plateau du Golan est sous contrôle israélien depuis plus d'un demi-siècle. Il est stratégiquement vital pour la sécurité d'Israël et, franchement, le rendre à [SYR.GetName] serait suicidaire. Il est temps d'arrêter de faire semblant et de reconnaître formellement la réalité."
 USA_golan_recognition_TT: "Nous reconnaîtrons formellement [ISR.GetFlag] §H[ISR.GetName]§! comme puissance §Hsouveraine§! sur le §Hplateau du Golan§!\n\nImportance stratégique de cette action :\n - [ISR.GetFlag] §HIsraël§! obtiendra un §Hcœur permanent§! sur le Golan, mettant fin à toute ambiguïté sur le statut du territoire.\n - [SYR.GetFlag] §H[SYR.GetName]§! n'en sera pas ravi, mais les hauteurs sont un glacis défensif critique qu'[ISR.GetFlag] §HIsraël§! ne peut se permettre d'abandonner."
 USA_aukus_pact: "[AST.GetFlag] [ENG.GetFlag] Le pacte AUKUS"
 USA_aukus_pact_desc: "Le dragon chinois flexe ses muscles à travers l'Indo-Pacifique, et nos alliés s'inquiètent. Il est temps de forger un nouveau partenariat de sécurité avec [AST.GetName] et [ENG.GetName] qui partagera nos meilleures technologies de défense, y compris la propulsion nucléaire sous-marine. Si Pékin veut jouer, il devra affronter les trois."
 USA_aukus_accept_TT: "[AST.GetFlag] §H[AST.GetName]§! et [ENG.GetFlag] §H[ENG.GetName]§! rejoignent le pacte de sécurité §HAUKUS§!, ouvrant un §Hgroupe de recherche sous-marin§! partagé et étendant la §Hpropulsion nucléaire navale§! à Canberra"
 USA_indo_pacific_economic_framework: "Le bouclier indo-pacifique"
 USA_indo_pacific_economic_framework_desc: "Les tentacules économiques de la Chine s'enroulent autour de chaque nation de l'Indo-Pacifique. Si nous n'offrons pas d'alternative à nos amis, ils n'auront d'autre choix que de s'aligner sur Pékin. Le Cadre économique indo-pacifique sera notre réponse, un partenariat global qui place les intérêts américains au centre tout en offrant à nos alliés une sortie de la dépendance chinoise."
 USA_ipef_TT: "Nous lancerons le §Hcadre économique indo-pacifique§!, en nous adressant à §H10 partenaires régionaux§! pour contrer l'emprise économique de [CHI.GetFlag] §H[CHI.GetName]§!\n - Les nations partenaires qui rejoignent nous accorderont §H+10§! d'opinion et verront l'influence [CHI.GetFlag] §Hchinoise§! §Rréduite§! sur leurs marchés\n - Nous gagnerons l'esprit national §Havantages commerciaux de l'IPEF§! pour §H2 ans§!\n\nImportance stratégique de cette action :\n - La domination économique de [CHI.GetFlag] §HPékin§! sur l'Indo-Pacifique est notre plus grand défi stratégique. Offrir une alternative crédible est le seul moyen de tenir ces nations hors de leur orbite."
 USA_abraham_accords_expansion: "[ISR.GetFlag] [SAU.GetFlag] Élargir les accords d'Abraham"
 USA_abraham_accords_expansion_desc: "Les accords d'Abraham ont prouvé ce que tout le monde disait impossible : la paix entre Israël et le monde arabe. Il faut maintenant aller plus loin et ramener plus de nations à la table. Si nous pouvons embarquer les Saoudiens, tout le Moyen-Orient basculera en notre faveur. Les Iraniens ne sauront pas ce qui les a frappés."
 USA_abraham_accords_accept_TT: "Les États du Golfe participants normaliseront leurs relations avec [ISR.GetFlag] §H[ISR.GetName]§!, remodelant le §HMoyen-Orient§! en notre faveur"
 USA_chips_act_diplomacy: "Le CHIPS Act"
 USA_chips_act_diplomacy_desc: "Chaque pièce de technologie avancée tourne sur des microprocesseurs, et pour l'instant l'immense majorité vient de [TAI.GetName] et d'Asie de l'Est. Un conflit dans le détroit de Taïwan et toute notre économie s'arrête. Nous allons investir des milliards pour ramener la production de semi-conducteurs chez nous et faire construire des usines à nos alliés."
 USA_chips_act_TT: "Nous investirons pour construire une §Husine de semi-conducteurs§! chez nous et inviterons [TAI.GetFlag] §H[TAI.GetName]§!, [KOR.GetFlag] §H[KOR.GetName]§! et [JAP.GetFlag] §H[JAP.GetName]§! à en construire les leurs\n - Nous gagnerons l'esprit national §Hloi CHIPS§! pour §H5 ans§!\n - L'influence [CHI.GetFlag] §Hchinoise§! à [TAI.GetFlag] §H[TAI.GetName]§! §Rdiminuera§! de §H5%§!\n\nImportance stratégique de cette action :\n - Couper [CHI.GetFlag] §HPékin§! de la chaîne d'approvisionnement des semi-conducteurs est le geste le plus important que nous puissions faire pour préserver notre avance technologique et militaire à long terme.\n- Nous gagnerons l'idée §HCHIPS Act§! pour §H5 ans§!"
 USA_return_to_paris_agreement: "Retour à Paris"
 USA_return_to_paris_agreement_desc: "L'absence de l'Amérique de l'accord de Paris sur le climat était une gêne. Le monde doit savoir que nous sommes de retour et prêts à mener sur le climat, même s'il faut avaler un peu d'orgueil. Nos amis européens seront ravis, et cette bonne volonté a un prix."
 USA_paris_agreement_TT: "Nous réintégrerons l'§Haccord de Paris sur le climat§!, restaurant §H+10 d'opinion§! avec toutes les nations membres de l'§HUE§! et gagnant §H+2% de stabilité§!\n\nImportance stratégique de cette action :\n - Le retour signale à nos §Halliés européens§! [ENG.GetFlag] [FRA.GetFlag] [GER.GetFlag] que l'Amérique est de retour sur la scène mondiale.\n - La bonne volonté générée vaut bien plus que le coût symbolique de la re-signature."
 USA_support_taiwan_defense: "[TAI.GetFlag] Armer l'île"
 USA_support_taiwan_defense_desc: "L'armée chinoise s'enhardit chaque jour, envoyant des chasseurs au-dessus du détroit et testant notre résolution. [TAI.GetName] a besoin des outils pour se défendre, et nous devons faire en sorte que Pékin comprenne que toute agression aura un coût inacceptable. Un énorme paquet d'armes enverra ce message haut et fort."
 USA_taiwan_defense_TT: "Nous enverrons à [TAI.GetFlag] §H[TAI.GetName]§! un important lot d'armes : §H3 000 armes d'infanterie§! et §H400 véhicules utilitaires§!\n - [CHI.GetFlag] §H[CHI.GetName]§! sera informé et pourra réagir\n - Si [TAI.GetFlag] §H[TAI.GetName]§! accepte, nos relations s'amélioreront de §G+15§!\n\nImportance stratégique de cette action :\n - Chaque caisse d'armes envoyée à [TAI.GetFlag] §HTaïwan§! relève le prix que [CHI.GetFlag] §HPékin§! devra payer pour toute aventure militaire de l'autre côté du détroit."
 USA_freedom_of_navigation_scs: "[CHI.GetFlag] Naviguer dans leur jardin"
 USA_freedom_of_navigation_scs_desc: "Les Chinois construisent des îles et y parquent des missiles comme s'ils possédaient toute la mer de Chine méridionale. Aux dernières nouvelles, les eaux internationales appartiennent à tout le monde. Notre marine naviguera partout où le droit international le permet, et si [CHI.GetName] n'aime pas, ils peuvent s'en expliquer avec la Septième flotte."
 USA_fon_scs_TT: "Nous mènerons des opérations de §Hliberté de navigation§! en mer de Chine méridionale, envoyant un message direct à [CHI.GetFlag] §H[CHI.GetName]§!\n - [PHI.GetFlag] §H[PHI.GetName]§!, [VIE.GetFlag] §H[VIE.GetName]§! et [MAY.GetFlag] §H[MAY.GetName]§! gagneront chacun §G+5§! d'opinion envers nous\n - Notre §Hsoutien de guerre§! augmentera de §G3%§!\n\nImportance stratégique de cette action :\n - On ne peut laisser [CHI.GetFlag] §HPékin§! revendiquer des eaux internationales. Y naviguer, c'est le dire sans tirer un seul coup de feu.\n- [CHI.GetFlag] §HPékin§! ne peut pas s'approprier les eaux internationales. Y naviguer, c'est le faire comprendre sans tirer un seul coup."
 USA_thaad_deployment_korea: "[KOR.GetFlag] [NKO.GetFlag] Déployer le bouclier"
 USA_thaad_deployment_korea_desc: "Le programme de missiles de [NKO.GetName] devient plus dangereux chaque mois, et nos alliés de [KOR.GetName] sont pile dans la ligne de mire. Le THAAD leur donnera une chance contre une attaque de missiles balistiques, même si les Chinois vont crier au scandale parce que le radar porte sur leur territoire. Pas notre problème."
 USA_thaad_accept_TT: "[KOR.GetFlag] §H[KOR.GetName]§! recevra le système de défense antimissile §HTHAAD§!, un vrai bouclier contre les missiles de [NKO.GetFlag] §H[NKO.GetName]§!"
 USA_quad_security_dialogue: "[JAP.GetFlag] [RAJ.GetFlag] [AST.GetFlag] L'alliance Quad"
 USA_quad_security_dialogue_desc: "Les Chinois croient pouvoir s'imposer par l'intimidation dans l'Indo-Pacifique, mais ils n'ont pas compté avec le poids combiné des États-Unis, de [JAP.GetName], de [RAJ.GetName] et de [AST.GetName]. Formaliser le Quad créera un mur de puissance démocratique que même Pékin ne pourra ignorer."
 USA_quad_accept_TT: "[JAP.GetFlag] §H[JAP.GetName]§!, [RAJ.GetFlag] §H[RAJ.GetName]§! et [AST.GetFlag] §H[AST.GetName]§! ont accepté de formaliser le partenariat de sécurité §HQuad§!"
 USA_philippine_defense_cooperation: "[PHI.GetFlag] Renforcer l'alliance philippine"
 USA_philippine_defense_cooperation_desc: "Les Philippines sont en première ligne de l'affrontement en mer de Chine méridionale, et leur armée a besoin d'une véritable remise à niveau. En élargissant l'accord de coopération renforcée en matière de défense, nous obtenons un accès critique aux bases et [PHI.GetFlag] Manille reçoit la puissance de feu et l'entraînement pour repousser la coercition [CHI.GetFlag] chinoise. Chaque base américaine aux Philippines est un clou dans le cercueil de la domination maritime [CHI.GetFlag] chinoise."
 USA_phi_edca_accept_TT: "[PHI.GetFlag] §H[PHI.GetName]§! élargira la §Hcoopération de défense§!, nous accordant l'accès aux bases et recevant du §Hmatériel militaire§! en retour"
 USA_phi_edca_reject_TT: "[PHI.GetFlag] §H[PHI.GetName]§! a refusé d'élargir la §Hcoopération de défense§!"
 USA_support_korean_reunification_talks: "[KOR.GetFlag] [NKO.GetFlag] Relier la péninsule"
 USA_support_korean_reunification_talks_desc: "La péninsule coréenne est une poudrière depuis 1953, et un seul faux calcul pourrait entraîner [USA.GetFlag] l'Amérique dans une guerre que personne n'est prêt à livrer. Si nous pouvons faciliter ne serait-ce qu'un dialogue limité entre [KOR.GetFlag] Séoul et [NKO.GetFlag] Pyongyang, c'est moins de missiles pointés sur nos alliés et plus d'espace pour la diplomatie. C'est un coup de poker, mais nous tenons le levier."
 USA_korea_talks_accept_TT: "[KOR.GetFlag] §H[KOR.GetName]§! et [NKO.GetFlag] §H[NKO.GetName]§! s'engageront dans un §Hdialogue facilité par les États-Unis§!, apaisant les tensions sur la péninsule"
 USA_intervene_yemen_civil_war: "[YEM.GetFlag] Écraser les Houthis"
 USA_intervene_yemen_civil_war_desc: "L'insurrection houthie soutenue par l'Iran à [YEM.GetName] déchire le pays et menace des voies maritimes vitales dont notre économie dépend. Nous ne pouvons pas rester les bras croisés pendant que les proxies de Téhéran font la loi dans le jardin de nos alliés. Il est temps d'armer le gouvernement légitime et de montrer aux Houthis qu'ils ont choisi le mauvais combat."
 USA_yemen_intervention_TT: "Nous enverrons à [YEM.GetFlag] §H[YEM.GetName]§! §H3 000 armes d'infanterie§! et §H400 véhicules utilitaires§! pour combattre l'insurrection §Rhouthie§!\n - Notre §Hinfluence§! à [YEM.GetFlag] §H[YEM.GetName]§! augmentera de §G5%§!\n - [SAU.GetFlag] §HL'Arabie saoudite§! recevra aussi un soutien militaire si elle est engagée contre les forces [HOU.GetFlag] §Hhouthies§!\n\nImportance stratégique de cette action :\n - On ne peut laisser les proxies [PER.GetFlag] §Hiraniens§! contrôler le littoral du [YEM.GetFlag] §HYémen§! et étrangler les voies maritimes dont dépend notre économie."
 USA_intervene_mali_insurgency: "[MAL.GetFlag] Éteindre le feu du Sahel"
 USA_intervene_mali_insurgency_desc: "Les combattants djihadistes à [MAL.GetName] se répandent comme une traînée de poudre à travers le Sahel, et si nous n'intervenons pas maintenant, toute la région s'embrasera. Les Français portent ce fardeau depuis trop longtemps. Il est temps que l'Amérique s'implique avant que Russes et Chinois ne comblent le vide."
 USA_mali_intervention_TT: "Nous enverrons à [MAL.GetFlag] §H[MAL.GetName]§! §H2 000 armes d'infanterie§! et §H200 véhicules utilitaires§! pour combattre l'§Rinsurrection djihadiste§!\n - Notre §Hinfluence§! à [MAL.GetFlag] §H[MAL.GetName]§! augmentera de §G5%§!\n\nImportance stratégique de cette action :\n - Si le Sahel tombe aux djihadistes, les mercenaires [SOV.GetFlag] §Hrusses§! et les entrepreneurs [CHI.GetFlag] §Hchinois§! combleront le vide. Les armes américaines nous gardent pertinents avant que cette fenêtre ne se ferme."
 USA_intervene_nigeria_boko_haram: "[NIG.GetFlag] Chasse à Boko Haram"
 USA_intervene_nigeria_boko_haram_desc: "Boko Haram a transformé le nord-est du [NIG.GetName] en zone de guerre, massacrant des civils et déstabilisant la nation la plus peuplée d'Afrique. Nous ne pouvons pas laisser la plus grande économie du continent s'effondrer dans le chaos. L'assistance militaire et le renseignement américains aideront les Nigérians à écraser ces terroristes une fois pour toutes."
 USA_nigeria_intervention_TT: "Nous enverrons à [NIG.GetFlag] §H[NIG.GetName]§! §H2 000 armes d'infanterie§!, §H200 véhicules utilitaires§! et un §Hsoutien du renseignement§! pour écraser §HBoko Haram§!\n - Notre §Hinfluence§! à [NIG.GetFlag] §H[NIG.GetName]§! augmentera de §G5%§!\n\nImportance stratégique de cette action :\n - [NIG.GetFlag] §HLe Nigeria§! est la plus grande économie d'Afrique. Le laisser sombrer dans le chaos offrirait à [CHI.GetFlag] §Hla Chine§! et à [SOV.GetFlag] §Hla Russie§! une énorme ouverture stratégique sur le continent."
 USA_stabilize_haiti: "[HAI.GetFlag] Sauver Haïti d'elle-même"
 USA_stabilize_haiti_desc: "[HAI.GetName] bascule vers l'effondrement total, juste dans notre jardin. Les gangs contrôlent les rues, le gouvernement fonctionne à peine, et des milliers de personnes fuient en bateau. Nous l'avons déjà fait et nous le referons. Des bottes américaines au sol sont la seule chose qui recollera ce pays."
 USA_haiti_stabilization_TT: "Nous déploierons des forces à [HAI.GetFlag] §H[HAI.GetName]§!, envoyant §H1 500 armes d'infanterie§! et §H150 véhicules utilitaires§! pour rétablir l'ordre\n - Notre §Hinfluence§! à [HAI.GetFlag] §H[HAI.GetName]§! augmentera de §G10%§!\n\nImportance stratégique de cette action :\n - [HAI.GetFlag] §HHaïti§! s'effondre à cent cinquante kilomètres de nos côtes. L'instabilité là-bas, c'est des flux de réfugiés, des réseaux de gangs et l'opportunisme [CHI.GetFlag] §Hchinois§! dans notre propre arrière-cour."
 USA_counter_narcotics_central_america: "Guerre aux cartels"
 USA_counter_narcotics_central_america_desc: "Les cartels ont transformé l'Amérique centrale en leur autoroute personnelle pour pomper de la drogue dans les villes américaines. Chaque mort par overdose dans nos rues remonte à ces réseaux criminels. Des opérations antidrogue coordonnées avec nos partenaires d'Amérique centrale étoufferont l'offre à la source."
 USA_counter_narcotics_TT: "Nous lancerons des §Hopérations antidrogue§! en Amérique centrale, relevant notre §Hinfluence§! dans §H6 nations§! de §G3%§! chacune\n\nImportance stratégique de cette action :\n - Chaque kilo de drogue arrêté à la source, c'est une mort de moins dans les villes américaines. Cette opération frappe les cartels là où ils sont les plus faibles : leur chaîne d'approvisionnement."
 USA_caribbean_investment_initiative: "[CHI.GetFlag] Des dollars dans les Caraïbes"
 USA_caribbean_investment_initiative_desc: "Les Chinois s'infiltrent dans notre propre voisinage avec l'argent des Nouvelles routes de la soie, construisant ports et ponts tout en achetant l'influence île par île. Les Caraïbes ont toujours été dans notre sphère, et nous n'allons pas laisser Pékin s'y installer. Les dollars américains doivent commencer à couler vers le sud."
 USA_caribbean_investment_TT: "Nous investirons dans §H6 nations des Caraïbes§!, construisant des §Hinfrastructures§! dans chaque capitale et reculant l'influence [CHI.GetFlag] §Hchinoise§! de §R3%§! par nation\n - Notre §Hinfluence§! dans chaque nation augmentera de §G5%§!\n\nImportance stratégique de cette action :\n - [CHI.GetFlag] §HPékin§! achète les Caraïbes avec l'argent des Nouvelles routes de la soie. L'investissement américain ici envoie un message clair : c'est notre voisinage."
 USA_invest_in_canada: "[CAN.GetFlag] Intégration nord-américaine"
 USA_invest_in_canada_desc: "[CAN.GetName] est notre allié le plus proche et notre plus grand partenaire commercial, et pour l'instant nous dépendons tous deux trop de chaînes d'approvisionnement adverses. En approfondissant nos liens économiques, surtout dans les semi-conducteurs et les minerais critiques, nous bâtirons une forteresse économique nord-américaine que personne ne pourra fendre."
 USA_canada_invest_accept_TT: "[CAN.GetFlag] §H[CAN.GetName]§! acceptera le paquet d'investissement, construisant une §Husine de puces§! et approfondissant nos §Hliens économiques§!"
 USA_canada_invest_reject_TT: "[CAN.GetFlag] §H[CAN.GetName]§! a décliné notre paquet d'investissement"
 USA_west_africa_development_initiative: "[CHI.GetFlag] Gagner l'Afrique de l'Ouest"
 USA_west_africa_development_initiative_desc: "L'Afrique de l'Ouest est devenue un bras de fer à trois entre nous, les Chinois et les Russes. Pékin offre des prêts-pièges, Moscou des mercenaires, et les populations souffrent dans les deux cas. Il nous faut offrir mieux : un vrai investissement, de vraies infrastructures et de vrais partenariats qui n'ont pas de ficelles attachées à un autocrate."
 USA_west_africa_development_TT: "Nous investirons dans §H5 nations d'Afrique de l'Ouest§!, construisant des §Hinfrastructures§! dans chaque capitale et reculant les rivaux étrangers\n - Notre §Hinfluence§! dans chaque nation augmentera de §G5%§!\n - L'influence [CHI.GetFlag] §Hchinoise§! chutera de §R5%§! et l'influence [SOV.GetFlag] §Hrusse§! de §R3%§! dans chaque nation\n\nImportance stratégique de cette action :\n - L'Afrique de l'Ouest est le prochain front de la compétition des grandes puissances. [CHI.GetFlag] §HPékin§! apporte des pièges de la dette et [SOV.GetFlag] §HMoscou§! des mercenaires. Il nous faut offrir mieux."
 USA_pacific_islands_compact: "[CHI.GetFlag] Tenir le Pacifique"
 USA_pacific_islands_compact_desc: "Les îles du Pacifique sont nos partenaires depuis des décennies via le pacte de libre association, mais la Chine débarque avec des chéquiers bien garnis et de grandes promesses. Si nous ne renouvelons pas nos engagements, nous nous réveillerons un matin avec des bases militaires chinoises éparpillées dans le Pacifique. Pas sous notre garde."
 USA_pacific_islands_TT: "Nous renouvellerons notre §Hpacte d'association libre§! avec §H5 nations insulaires du Pacifique§!, verrouillant l'influence [CHI.GetFlag] §Hchinoise§! en Océanie\n - Notre §Hinfluence§! dans chaque nation augmentera de §G5%§!\n - L'influence [CHI.GetFlag] §Hchinoise§! chutera de §R3%§! dans chaque nation\n\nImportance stratégique de cette action :\n - Le Pacifique est notre lac stratégique. Si [CHI.GetFlag] §HPékin§! y construit des bases, notre capacité à projeter la puissance à travers l'Indo-Pacifique est finie."
 USA_african_growth_opportunity_act: "[CHI.GetFlag] Ouvrir les marchés africains"
 USA_african_growth_opportunity_act_desc: "La loi sur la croissance et les opportunités en Afrique donne aux nations africaines un accès préférentiel au marché le plus riche de la planète : le nôtre. En élargissant ce programme, nous créons des emplois des deux côtés de l'Atlantique et bâtissons des relations commerciales qui survivront à n'importe quel prêt chinois aux petites lignes. La diplomatie intelligente commence par l'économie intelligente."
 USA_agoa_TT: "Nous étendrons les préférences commerciales de l'§HAGOA§! aux nations africaines éligibles, augmentant notre §Hinfluence§! de §G3%§! et réduisant l'influence [CHI.GetFlag] §Hchinoise§! de §R3%§! dans chaque nation qualifiée\n\nImportance stratégique de cette action :\n - Un accord commercial qui relève les économies africaines est bien plus durable que n'importe quel prêt [CHI.GetFlag] §Hchinois§! aux clauses en petits caractères. Les nations ayant accès aux marchés américains n'ont aucune raison de chercher ailleurs."
 USA_IPEF_trade_benefits: "Cadre économique indo-pacifique"
 USA_IPEF_trade_benefits_desc: "Le Cadre économique indo-pacifique renforce les liens commerciaux et la coopération sur les chaînes d'approvisionnement avec des partenaires régionaux clés, offrant des avantages économiques et réduisant la dépendance au commerce chinois."
 USA_chips_act: "Loi CHIPS et science"
 USA_chips_act_desc: "Le CHIPS and Science Act a investi des milliards dans la fabrication nationale de semi-conducteurs, boostant l'efficacité de production et accélérant la construction d'installations de fabrication avancées."
 USA_thaad_defense: "Défense antimissile THAAD"
 USA_thaad_defense_desc: "Le système Terminal High Altitude Area Defense fournit des capacités avancées de défense antimissile balistique, renforçant nettement la défense antiaérienne et la préparation militaire globale."
 USA_caribbean_development: "Aide au développement caribéen"
 USA_caribbean_development_desc: "Un programme d'investissement américain soutenu dans les Caraïbes, construisant des infrastructures et renforçant les liens avec les partenaires régionaux pour tenir l'influence [CHI.GetFlag] chinoise hors de notre jardin."
 USA_west_africa_development: "Aide au développement ouest-africain"
 USA_west_africa_development_desc: "Un programme d'investissement américain soutenu à travers l'Afrique de l'Ouest, finançant les infrastructures et bâtissant des partenariats commerciaux comme alternative crédible aux pièges de la dette [CHI.GetFlag] chinoise et aux mercenaires [SOV.GetFlag] russes."
 department_of_state.100.t: "La proposition AUKUS"
 department_of_state.100.d: "Les États-Unis nous ont approchés avec une proposition inédite de partenariat de sécurité trilatéral appelé AUKUS. Cet accord impliquerait le partage de technologies de défense avancées, y compris les capacités de sous-marins à propulsion nucléaire, pour contrer les menaces croissantes dans la région indo-pacifique."
 department_of_state.100.a: "Nous acceptons ce partenariat historique."
 department_of_state.100.b: "Nous devons décliner respectueusement pour l'instant."
 department_of_state.101.t: "Formation de l'alliance AUKUS"
 department_of_state.101.d: "Les États-Unis, l'Australie et le Royaume-Uni ont annoncé un nouveau partenariat de sécurité trilatéral connu sous le nom d'AUKUS. L'accord verra le partage de technologies de défense avancées et de capacités de sous-marins à propulsion nucléaire pour maintenir la sécurité dans l'Indo-Pacifique."
 department_of_state.101.a: "Une nouvelle ère de coopération."
 department_of_state.102.t: "Cadre économique indo-pacifique"
 department_of_state.102.d: "Les États-Unis nous ont invités à rejoindre le Cadre économique indo-pacifique, une nouvelle initiative multilatérale conçue pour renforcer les chaînes d'approvisionnement, promouvoir l'énergie propre et contrer l'influence économique chinoise dans la région."
 department_of_state.102.a: "Nous rejoindrons le cadre."
 department_of_state.102.b: "Nous préférons maintenir nos arrangements actuels."
 department_of_state.103.t: "Résultats du partenariat IPEF"
 department_of_state.103.d: "Des nations à travers l'Indo-Pacifique ont répondu à notre invitation à rejoindre le Cadre économique indo-pacifique."
 department_of_state.103.a: "Noté."
 department_of_state.104.t: "Expansion des accords d’Abraham"
 department_of_state.104.d: "Les États-Unis s'emploient à élargir les accords d'Abraham et ont proposé que notre nation normalise ses relations avec Israël. Ce serait un basculement historique des dynamiques régionales et ouvrirait de nouvelles opportunités économiques et diplomatiques."
 department_of_state.104.a: "Nous normaliserons les relations avec Israël."
 department_of_state.104.b: "Le moment n'est pas venu de normaliser."
 department_of_state.105.t: "Progrès des accords d’Abraham"
 department_of_state.105.d: "Les États-Unis ont réussi à négocier des accords de normalisation supplémentaires dans le cadre élargi des accords d'Abraham."
 department_of_state.105.a: "Merveilleuse nouvelle."
 department_of_state.106.t: "Accords d'Abraham élargis"
 department_of_state.106.d: "Le cadre historique des accords d'Abraham a été élargi pour inclure d'autres nations arabes normalisant leurs relations avec Israël, remodelant le paysage géopolitique du Moyen-Orient."
 department_of_state.106.a: "Un nouveau chapitre de la diplomatie régionale."
 department_of_state.107.t: "Partenariat de la loi CHIPS"
 department_of_state.107.d: "Les États-Unis nous ont invités à participer à leur initiative CHIPS and Science Act, offrant des incitations à construire des usines de semi-conducteurs sur notre sol dans le cadre d'un effort plus large pour diversifier les chaînes d'approvisionnement mondiales en puces."
 department_of_state.107.a: "Nous accueillons cet investissement."
 department_of_state.107.b: "Nous devons décliner cette offre."
 department_of_state.108.t: "Investissements de la loi CHIPS"
 department_of_state.108.d: "Les États-Unis ont lancé une immense initiative d'investissement dans les semi-conducteurs au titre du CHIPS and Science Act, construisant de nouvelles usines de fabrication de puces sur leur sol et se coordonnant avec des nations alliées pour diversifier la chaîne d'approvisionnement mondiale."
 department_of_state.108.a: "La course aux semi-conducteurs est lancée."
 department_of_state.109.t: "L'Amérique réintègre l'accord de Paris"
 department_of_state.109.d: "Les États-Unis ont officiellement réintégré l'accord de Paris sur le climat, signalant un engagement renouvelé en faveur de la coopération climatique internationale et de la diplomatie multilatérale."
 department_of_state.109.a: "Bienvenue de retour à la table."
 department_of_state.110.t: "Lot d'armes américain"
 department_of_state.110.d: "Les États-Unis nous ont proposé un important paquet d'armes pour renforcer nos capacités défensives contre une agression potentielle. L'accord inclut des systèmes d'armes avancés et du matériel militaire."
 department_of_state.110.a: "Nous acceptons avec gratitude."
 department_of_state.111.t: "Ventes d'armes américaines à Taïwan"
 department_of_state.111.d: "Les États-Unis ont annoncé une vente d'armes majeure à Taïwan, une violation flagrante de notre souveraineté et une ingérence dans nos affaires intérieures. Cette provocation exige une réponse ferme."
 department_of_state.111.a: "Émettez une protestation diplomatique formelle."
 department_of_state.111.b: "C'est un acte d'agression qui exige une escalade."
 department_of_state.112.t: "Armes américaines à Taïwan"
 department_of_state.112.d: "Les États-Unis ont approuvé un important paquet d'armes pour Taïwan, fournissant du matériel militaire avancé pour renforcer les défenses de l'île alors que les tensions montent dans le détroit de Taïwan."
 department_of_state.112.a: "L'équilibre des forces bascule."
 department_of_state.115.t: "Proposition du Sommet américain"
 department_of_state.115.d: "Le président américain a proposé un sommet direct sans précédent avec notre Guide suprême. Si la campagne de pression maximale a pesé sur notre économie, cela pourrait être une occasion de gagner une légitimité internationale et, potentiellement, un allègement des sanctions."
 department_of_state.115.a: "Nous accepterons le sommet."
 department_of_state.115.b: "Nous ne légitimerons pas l'agression américaine."
 department_of_state.116.t: "Sommet historique entre les États-Unis et la RPDC"
 department_of_state.116.d: "Pour la première fois dans l'histoire, les dirigeants des États-Unis et de la Corée du Nord se sont rencontrés face à face pour des pourparlers diplomatiques, marquant un moment inédit dans la confrontation de plusieurs décennies sur la péninsule coréenne."
 department_of_state.116.a: "Un développement remarquable"
 department_of_state.117.t: "Retrait du JCPOA"
 department_of_state.117.d: "Les États-Unis se sont unilatéralement retirés du Plan d'action global conjoint et rétabliront des sanctions économiques maximales contre notre nation. C'est une trahison des accords internationaux."
 department_of_state.117.a: "Cette agression ne restera pas sans réponse."
 department_of_state.118.t: "Retrait américain du JCPOA"
 department_of_state.118.d: "Les États-Unis se sont retirés de l'accord nucléaire iranien, une décision qui sape des années de diplomatie multilatérale minutieuse. Nos canaux diplomatiques doivent désormais se réajuster."
 department_of_state.118.a: "Une décision regrettable."
 department_of_state.119.t: "Les États-Unis se retirent de l'accord iranien"
 department_of_state.119.d: "Les États-Unis ont annoncé leur retrait du Plan d'action global conjoint, rétablissant des sanctions économiques maximales sur l'Iran et tendent les relations avec les alliés européens qui restent attachés à l'accord."
 department_of_state.119.a: "La diplomatie en prend un coup."
 department_of_state.120.t: "Jérusalem reconnue comme capitale"
 department_of_state.120.d: "Les États-Unis ont officiellement reconnu Jérusalem comme capitale d'Israël et annoncé leur intention d'y relocaliser leur ambassade. Cette décision historique est une affirmation formidable du lien entre nos nations."
 department_of_state.120.a: "Un jour mémorable pour Israël."
 department_of_state.121.t: "Les États-Unis reconnaissent Jérusalem"
 department_of_state.121.d: "Les États-Unis ont officiellement reconnu Jérusalem comme capitale d'Israël, rompant avec des décennies de convention diplomatique et suscitant une vive condamnation à travers le monde arabe et musulman."
 department_of_state.121.a: "Une décision controversée."
 department_of_state.124.t: "Les États-Unis reconnaissent le plateau du Golan"
 department_of_state.124.d: "Les États-Unis ont officiellement reconnu la souveraineté israélienne sur le plateau du Golan, un territoire pris à la Syrie lors de la guerre de 1967. La décision marque un nouveau tournant de la politique américaine au Moyen-Orient."
 department_of_state.124.a: "Noté."
 department_of_state.125.t: "Provocation navale américaine"
 department_of_state.125.d: "La marine des États-Unis a mené une soi-disant opération de « liberté de navigation » dans des eaux que nous revendiquons comme territoire souverain chinois en mer de Chine méridionale. Cette provocation flagrante défie nos revendications maritimes légitimes et exige une réponse."
 department_of_state.125.a: "Émettez une protestation diplomatique."
 department_of_state.125.b: "Déployer en urgence les forces navales pour intercepter."
 department_of_state.126.t: "Liberté de navigation en mer de Chine méridionale"
 department_of_state.126.d: "La marine des États-Unis a mené des opérations de liberté de navigation en mer de Chine méridionale, contestant les revendications territoriales chinoises et rassurant les alliés régionaux de l'engagement américain en faveur de voies d'eau ouvertes."
 department_of_state.126.a: "Les eaux internationales doivent rester libres."
 department_of_state.127.t: "Proposition de déploiement THAAD"
 department_of_state.127.d: "Les États-Unis ont proposé de déployer le système antimissile Terminal High Altitude Area Defense sur notre sol pour contrer la menace croissante des missiles balistiques nord-coréens. Cela renforcerait nettement nos capacités de défense, mais la Chine a prévenu de graves conséquences si nous acceptons."
 department_of_state.127.a: "Notre sécurité exige que nous acceptions."
 department_of_state.127.b: "Le coût diplomatique est trop élevé."
 department_of_state.129.t: "THAAD déployé en Corée du Sud"
 department_of_state.129.d: "Les États-Unis ont réussi à déployer le système antimissile THAAD en Corée du Sud, renforçant nettement les capacités antimissile alliées sur la péninsule coréenne tout en suscitant de vives critiques de la Chine."
 department_of_state.129.a: "Le bouclier est en place."
 department_of_state.130.t: "Les États-Unis interviennent au Yémen"
 department_of_state.130.d: "Les États-Unis ont annoncé un soutien militaire au gouvernement yéménite internationalement reconnu dans sa lutte contre l'insurrection houthie, fournissant du matériel et une assistance logistique pour contrer les forces soutenues par l'Iran."
 department_of_state.130.a: "La stabilité doit être rétablie."
 department_of_state.131.t: "Soutien militaire américain"
 department_of_state.131.d: "Les États-Unis ont engagé d'importantes ressources militaires pour soutenir notre lutte contre l'insurrection houthie. Armes, véhicules et renseignement américains renforceront notre position sur le champ de bataille."
 department_of_state.131.a: "Nous accueillons le soutien américain."
 department_of_state.132.t: "Les États-Unis soutiennent le Mali contre l'insurrection"
 department_of_state.132.d: "Les États-Unis ont annoncé un paquet d'assistance militaire pour le Mali afin d'aider à combattre l'insurrection djihadiste qui menace la région du Sahel."
 department_of_state.132.a: "La stabilité au Sahel est cruciale."
 department_of_state.133.t: "Assistance militaire américaine"
 department_of_state.133.d: "Les États-Unis ont engagé du matériel militaire et un soutien du renseignement pour aider nos forces à combattre l'insurrection djihadiste. Cette assistance renforcera nettement nos capacités."
 department_of_state.133.a: "Le soutien américain est le plus bienvenu."
 department_of_state.134.t: "Les États-Unis soutiennent le Nigeria contre Boko Haram"
 department_of_state.134.d: "Les États-Unis ont annoncé un paquet d'assistance militaire complet pour le Nigeria afin de combattre l'organisation terroriste Boko Haram dans le nord-est du pays."
 department_of_state.134.a: "La lutte contre la terreur continue."
 department_of_state.135.t: "Assistance antiterroriste américaine"
 department_of_state.135.d: "Les États-Unis ont fourni d'importants équipements militaires et un soutien du renseignement pour renforcer notre campagne contre Boko Haram. Ce partenariat aidera à rétablir la sécurité dans le nord-est."
 department_of_state.135.a: "Ensemble nous vaincrons cette menace."
 department_of_state.136.t: "Les États-Unis déploient des forces en Haïti"
 department_of_state.136.d: "Les États-Unis ont autorisé le déploiement de forces militaires et d'une assistance humanitaire à Haïti, où l'instabilité politique et la violence ont mené la nation au bord de l'effondrement."
 department_of_state.136.a: "L'ordre doit être rétabli."
 department_of_state.137.t: "Forces américaines de stabilisation"
 department_of_state.137.d: "Les États-Unis ont déployé des forces militaires et fourni une assistance humanitaire pour aider à rétablir l'ordre. Le matériel et le soutien américains aideront nos forces de sécurité à reprendre le contrôle de la situation."
 department_of_state.137.a: "Nous accueillons l'assistance."
 department_of_state.138.t: "Programme américain de lutte antidrogue"
 department_of_state.138.d: "Les États-Unis ont lancé un programme antidrogue coordonné dans notre région, fournissant formation, matériel et renseignement pour perturber les réseaux de trafic opérant à travers l'Amérique centrale."
 department_of_state.138.a: "Un partenariat bienvenu."
 department_of_state.140.t: "Programme d'investissement américain"
 department_of_state.140.d: "Les États-Unis ont lancé une grande initiative d'investissement dans les Caraïbes, offrant développement d'infrastructures, assistance économique et partenariats commerciaux pour renforcer les liens dans la région."
 department_of_state.140.a: "Nous accueillons l'investissement américain."
 department_of_state.141.t: "Initiative d'investissement américaine aux Caraïbes"
 department_of_state.141.d: "Les États-Unis ont annoncé une initiative d'investissement complète à travers les Caraïbes, finançant le développement d'infrastructures et des programmes économiques pour renforcer les partenariats régionaux et contrer l'influence chinoise."
 department_of_state.141.a: "L'engagement américain dans les Caraïbes."
 department_of_state.142.t: "Proposition d'investissement américaine"
 department_of_state.142.d: "Les États-Unis ont proposé un paquet d'investissement stratégique pour approfondir notre intégration économique, y compris un financement pour la fabrication de semi-conducteurs et le développement de chaînes d'approvisionnement critiques."
 department_of_state.142.a: "Nous acceptons ce partenariat."
 department_of_state.142.b: "Nous préférons poursuivre un développement indépendant."
 department_of_state.143.t: "Résultats de l'investissement canadien"
 department_of_state.143.d: "Le Canada a répondu à notre proposition d'investissement."
 department_of_state.143.a: "Noté."
 department_of_state.144.t: "Programme de développement américain"
 department_of_state.144.d: "Les États-Unis ont lancé une initiative de développement en Afrique de l'Ouest, offrant investissement dans les infrastructures, assistance économique et partenariats commerciaux pour promouvoir la croissance et contrer l'influence rivale dans la région."
 department_of_state.144.a: "Nous accueillons l'aide au développement américaine."
 department_of_state.145.t: "Initiative américaine de développement en Afrique de l'Ouest"
 department_of_state.145.d: "Les États-Unis ont annoncé une grande initiative de développement à travers l'Afrique de l'Ouest, investissant dans les infrastructures et les programmes économiques pour renforcer les partenariats et offrir une alternative à l'influence chinoise et russe."
 department_of_state.145.a: "Un nouveau chapitre du développement africain"
 department_of_state.146.t: "Partenariat des îles du Pacifique"
 department_of_state.146.d: "Les États-Unis ont proposé de renouveler et d'élargir notre partenariat au titre du pacte de libre association, offrant une assistance économique accrue et une coopération de sécurité."
 department_of_state.146.a: "Nous valorisons notre partenariat américain."
 department_of_state.147.t: "Les États-Unis renouvellent le Pacte pour les îles du Pacifique"
 department_of_state.147.d: "Les États-Unis ont renouvelé et élargi leur pacte de libre association avec les nations insulaires du Pacifique, contrant les percées diplomatiques et économiques chinoises en Océanie."
 department_of_state.147.a: "L'engagement américain dans le Pacifique."
 department_of_state.148.t: "Préférences commerciales AGOA"
 department_of_state.148.d: "Les États-Unis ont offert à notre nation un accès commercial préférentiel au titre de la loi sur la croissance et les opportunités en Afrique, fournissant un accès en franchise de droits au marché américain pour un large éventail de biens."
 department_of_state.148.a: "Nous accueillons un accès commercial élargi."
 department_of_state.149.t: "Les États-Unis élargissent le programme commercial africain"
 department_of_state.149.d: "Les États-Unis ont élargi la loi sur la croissance et les opportunités en Afrique, étendant l'accès commercial préférentiel à d'autres nations africaines et promouvant le développement économique à travers le continent."
 department_of_state.149.a: "Le commerce favorise le développement"
 department_of_state.150.t: "Invitation au dialogue de sécurité Quad"
 department_of_state.150.d: "Les États-Unis ont proposé de formaliser le Dialogue quadrilatéral de sécurité entre notre nation, les États-Unis et des partenaires clés de l'Indo-Pacifique. Ce partenariat coordonnerait les réponses aux défis de sécurité partagés et promouvoirait un Indo-Pacifique libre et ouvert."
 department_of_state.150.a: "Nous rejoindrons le Quad."
 department_of_state.150.b: "Nous préférons maintenir notre autonomie stratégique."
 department_of_state.151.t: "Création d'un partenariat Quad"
 department_of_state.151.d: "Le Dialogue quadrilatéral de sécurité entre les États-Unis, le Japon, l'Inde et l'Australie a été formalisé comme cadre de sécurité clé pour la région indo-pacifique."
 department_of_state.151.a: "Une nouvelle architecture de sécurité émerge."
 department_of_state.152.t: "Proposition de coopération de défense renforcée"
 department_of_state.152.d: "Les États-Unis ont proposé d'élargir l'accord de coopération renforcée en matière de défense, offrant une assistance militaire accrue, des arrangements d'accès aux bases et du matériel de défense pour renforcer nos capacités alors que les tensions régionales montent."
 department_of_state.152.a: "Nous élargirons la coopération de défense."
 department_of_state.152.b: "Nous devons considérer nos autres relations."
 department_of_state.153.t: "Coopération de défense États-Unis-Philippines élargie"
 department_of_state.153.d: "Les États-Unis et les Philippines ont élargi leur accord de coopération renforcée en matière de défense, approfondissant les liens militaires et renforçant l'alliance alors que les tensions montent en mer de Chine méridionale."
 department_of_state.153.a: "L'alliance s'approfondit."
 department_of_state.154.t: "Dialogue sur la réunification coréenne"
 department_of_state.154.d: "Les États-Unis ont proposé de faciliter le dialogue intercoréen et des pourparlers de réunification, offrant un soutien diplomatique à une résolution pacifique de la division de la péninsule coréenne."
 department_of_state.154.a: "Nous sommes ouverts au dialogue."
 department_of_state.154.b: "Les conditions ne sont pas réunies pour des pourparlers."
 department_of_state.155.t: "Les États-Unis facilitent le dialogue coréen"
 department_of_state.155.d: "Les États-Unis ont facilité un dialogue intercoréen, amenant des représentants de Séoul et de Pyongyang à la table pour discuter de la réduction des tensions et explorer des voies vers une réunification éventuelle."
 department_of_state.155.a: "Un pas vers la paix."
 department_of_state.160.t: "[FROM.GetName] accepte le pacte AUKUS"
 department_of_state.160.d: "[FROM.GetName] a accepté de rejoindre le partenariat de sécurité AUKUS, renforçant notre coopération de défense trilatérale dans l'Indo-Pacifique."
 department_of_state.160.a: "Excellent"
 department_of_state.161.t: "[FROM.GetName] rejoint l'IPEF"
 department_of_state.161.d: "[FROM.GetName] a accepté de participer au Cadre économique indo-pacifique, élargissant notre partenariat économique à travers la région."
 department_of_state.161.a: "Un grand pas en avant"
 department_of_state.162.t: "[FROM.GetName] rejoint les accords d'Abraham"
 department_of_state.162.d: "[FROM.GetName] a accepté de normaliser ses relations avec Israël dans le cadre des accords d'Abraham. C'est une percée historique pour la paix régionale."
 department_of_state.162.a: "Un exploit historique"
 department_of_state.163.t: "[FROM.GetName] accepte le partenariat de la loi CHIPS"
 department_of_state.163.d: "[FROM.GetName] a accepté de rejoindre notre partenariat sur les semi-conducteurs au titre du CHIPS Act, renforçant la résilience de notre chaîne d'approvisionnement."
 department_of_state.163.a: "Bonne nouvelle"
 department_of_state.164.t: "[FROM.GetName] accepte un sommet"
 department_of_state.164.d: "[FROM.GetName] a accepté de participer à des pourparlers de dénucléarisation. C'est une occasion diplomatique inédite sur la péninsule coréenne."
 department_of_state.164.a: "Une évolution prometteuse"
 department_of_state.165.t: "[FROM.GetName] accepte le déploiement THAAD"
 department_of_state.165.d: "[FROM.GetName] a approuvé le déploiement de systèmes antimissile THAAD sur son territoire, renforçant notre posture défensive dans la région."
 department_of_state.165.a: "Nos alliés sont plus en sécurité"
 department_of_state.166.t: "[FROM.GetName] accepte le partenariat d'investissement"
 department_of_state.166.d: "[FROM.GetName] a accepté notre proposition d'investissement et de partenariat sur les semi-conducteurs, approfondissant nos liens économiques."
 department_of_state.166.a: "Un partenariat fort"
 department_of_state.167.t: "[FROM.GetName] rejoint le Quad"
 department_of_state.167.d: "[FROM.GetName] a accepté de formaliser le Dialogue de sécurité Quad, renforçant notre engagement partagé pour un Indo-Pacifique libre et ouvert."
 department_of_state.167.a: "Bienvenue à bord"
 department_of_state.168.t: "[FROM.GetName] étend la coopération EDCA"
 department_of_state.168.d: "[FROM.GetName] a accepté d'élargir l'accord de coopération renforcée en matière de défense, approfondissant notre partenariat militaire et les arrangements d'accès aux bases."
 department_of_state.168.a: "L'alliance se renforce"
 department_of_state.169.t: "[FROM.GetName] ouvert à des pourparlers de réunification"
 department_of_state.169.d: "[FROM.GetName] a accepté de participer à un dialogue de réunification facilité par les États-Unis. Une résolution pacifique sur la péninsule coréenne est encore possible."
 department_of_state.169.a: "La diplomatie prévaut"
 department_of_state.180.t: "[FROM.GetName] décline le pacte AUKUS"
 department_of_state.180.d: "[FROM.GetName] a décliné de participer au partenariat de sécurité AUKUS. Nous devrons poursuivre d'autres voies de coopération régionale."
 department_of_state.180.a: "Décevant"
 department_of_state.181.t: "[FROM.GetName] décline l'IPEF"
 department_of_state.181.d: "[FROM.GetName] a décliné de rejoindre le Cadre économique indo-pacifique. Son absence affaiblit l'initiative."
 department_of_state.181.a: "Tant pis pour eux"
 department_of_state.182.t: "[FROM.GetName] rejette les accords d'Abraham"
 department_of_state.182.d: "[FROM.GetName] a décliné de normaliser ses relations avec Israël au titre des accords d'Abraham. La paix régionale devra attendre."
 department_of_state.182.a: "Une occasion manquée"
 department_of_state.183.t: "[FROM.GetName] refuse le partenariat de la loi CHIPS"
 department_of_state.183.d: "[FROM.GetName] a décliné notre proposition de partenariat sur les semi-conducteurs. Nous devrons trouver d'autres partenaires pour sécuriser nos chaînes d'approvisionnement."
 department_of_state.183.a: "Nous chercherons ailleurs"
 department_of_state.184.t: "[FROM.GetName] refuse le sommet"
 department_of_state.184.d: "[FROM.GetName] a refusé de participer à des pourparlers de dénucléarisation. Les tensions sur la péninsule coréenne restent non résolues."
 department_of_state.184.a: "Un revers"
 department_of_state.185.t: "[FROM.GetName] refuse le déploiement du THAAD"
 department_of_state.185.d: "[FROM.GetName] a rejeté le déploiement de systèmes antimissile THAAD. Notre posture de défense régionale devra être reconsidérée."
 department_of_state.185.a: "Malheureusement"
 department_of_state.186.t: "[FROM.GetName] refuse le partenariat d'investissement"
 department_of_state.186.d: "[FROM.GetName] a décliné notre proposition d'investissement et de partenariat sur les semi-conducteurs. La coopération économique devra prendre une autre forme."
 department_of_state.186.a: "Regrettable"
 department_of_state.187.t: "[FROM.GetName] décline le Quad"
 department_of_state.187.d: "[FROM.GetName] a décliné de formaliser le Dialogue de sécurité Quad, préférant maintenir son autonomie stratégique."
 department_of_state.187.a: "Nous respectons leur décision"
 department_of_state.188.t: "[FROM.GetName] refuse l'expansion d'EDCA"
 department_of_state.188.d: "[FROM.GetName] a décliné d'élargir l'accord de coopération renforcée en matière de défense. Notre partenariat de défense reste à son niveau actuel."
 department_of_state.188.a: "Un pas en arrière"
 department_of_state.189.t: "[FROM.GetName] refuse les pourparlers de réunification"
 department_of_state.189.d: "[FROM.GetName] a décliné de participer au dialogue de réunification. Le chemin vers la paix sur la péninsule coréenne s'allonge."
 department_of_state.189.a: "La porte reste ouverte"
 USA_blr_fail_TT: "l'opération échouant, laissant [BLR.GetFlag] [BLR.GetLeader] au pouvoir"
 USA_kidd_destroyer_accept_TT: "[TAI.GetFlag] §H[TAI.GetName]§! recevra §H4 destroyers de classe Kee-Lung§! en échange de §G2,5 Md$§!, renforçant le §Hdétroit de Taïwan§!"
 USA_additional_kee_lung_accept_TT: "[TAI.GetFlag] §H[TAI.GetName]§! recevra §H3 destroyers de classe Kee-Lung supplémentaires§! et des §Hchantiers élargis§! en échange de §G2 Md$§!, et gagnera §G+2 % de soutien de guerre§! en tenant tête à [CHI.GetFlag] §HPékin§!"
 USA_article_nine_accept_TT: "[JAP.GetFlag] §H[JAP.GetName]§! réinterprétera l'§Harticle 9§!, permettant une posture d'§Hautodéfense§! plus active et approfondissant l'§Hopinion§! entre nos nations"
 department_of_state.220.t: "Une ordonnance élargie de classe Kee-Lung"
 department_of_state.220.d: "Face à l'agression croissante de [CHI.GetName], les [USA.GetName] ont proposé une deuxième tranche de la classe Kee-Lung. Le paquet inclut §H3 coques modernisées supplémentaires§! tirées de la réserve américaine, mises aux normes actuelles, ainsi qu'un soutien à l'§Hexpansion des chantiers§! pour accélérer notre production nationale. Washington parie clairement sur une §Hmarine de la ROC§! plus forte comme contrepoids aux ambitions du continent. L'offre n'est pas bon marché, mais regarder le détroit se taire en notre faveur non plus."
 department_of_state.220.a: "Signer le chèque"
 department_of_state.220.b: "Nous ne pouvons pas payer le prix"
 department_of_state.230.t: "Une demande de statut MNNA"
 department_of_state.230.d: "[FROM.GetNameWithFlag] a formellement demandé la désignation d'§Hallié majeur non membre de l'OTAN§!. Ils ont présenté leur dossier : un alignement occidental ou neutre, une volonté de partager renseignement et technologie militaire et, surtout, l'engagement de ne pas tomber sous l'influence de [CHI.GetFlag] §HPékin§!, [SOV.GetFlag] §HMoscou§! ou [PER.GetFlag] §HTéhéran§!. Accorder le statut MNNA verrouille leur orientation vers nous pour une génération, mais cela signifie aussi que nous signalons au monde qu'une attaque contre eux est une attaque contre nos intérêts."
 department_of_state.230.a: "Accorder le statut d'allié majeur non membre de l'OTAN"
 department_of_state.230.b: "Rejeter la demande"
 department_of_state.231.t: "Réponse de [FROM.GetName]"
 department_of_state.231.d: "[FROM.GetNameWithFlag] a renvoyé une réponse formelle à notre demande de statut d'allié majeur non membre de l'OTAN. La décision est tombée."
 department_of_state.231.a: "Nous sommes désormais un §Hallié majeur non membre de l'OTAN§!"
 department_of_state.231.b: "Notre demande a été §Rrejetée§!"
 department_of_state.232.t: "[FROM.GetNameWithFlag] a été attaqué"
 department_of_state.232.d: "[FROM.GetNameWithFlag] a été attaqué par une autre nation et c'est l'un de nos §Halliés majeurs non membres de l'OTAN§!. Chaque traité et chaque discours que nous ayons jamais tenus sur la défense de nos partenaires repose sur des moments comme celui-ci. Le monde regarde si notre engagement signifie encore quelque chose. Notre état-major attend notre décision. Répondons-nous à leur appel aux armes ?"
 department_of_state.232.a: "Honorer l'engagement. Mobiliser les forces de réaction rapide."
 department_of_state.232.b: "Envoyer des armes, imposer des sanctions, mais rester hors des combats"
 department_of_state.232.c: "Condamner l'invasion mais sans rien faire"
 request_MNNA_status: "Demander le statut d'allié majeur non membre de l'OTAN"
 request_MNNA_status_desc: "Le programme d'§Hallié majeur non membre de l'OTAN§! est une désignation pour des partenaires proches qui siègent hors de l'§HOTAN§!. Qualifier pour le statut MNNA nous donne une place à la table pour les transferts d'armes, le partage de renseignement et les exercices conjoints, et, si les astres s'alignent, un engagement du chef de l'§HOTAN§! à nous défendre quand les loups viendront."
 MNNA_accept_TT: "Si le chef de l'§HOTAN§! approuve, nous recevrons l'idée §HAllié majeur non membre de l'OTAN§! et nos relations avec eux s'§Happrofondiront§!"
 MNNA_reject_TT: "En cas de rejet, nous ne pourrons pas redemander pendant §H180 jours§!"
 nato_leader_not_at_war_with_us_tt: "Le chef de l'§HOTAN§! n'est pas en guerre contre nous"
 Major_Non_NATO_Ally_TT: "Si nous sommes §Rattaqués§! par un agresseur non démocratique, non MNNA, le chef de l'§HOTAN§! pourra être appelé à notre défense"
 department_of_state.233.t: "Un allié de l'OTAN a basculé"
 department_of_state.233.d: "[event_target:nato_coup_victim.GetNameWithFlag] a connu un changement de gouvernement, et la nouvelle direction n'est §Rplus démocratique§!. Les empreintes de [event_target:nato_coup_aggressor.GetFlag] §H[event_target:nato_coup_aggressor.GetName]§! sont partout sur la transition. Ils ont exploité leur §Hpénétration d'influence§! dans la politique de [event_target:nato_coup_victim.GetName] pour basculer un allié de l'OTAN de l'intérieur. L'alliance regarde comment nous répondrons."
 department_of_state.233.a: "Les expulser de l'OTAN et sanctionner le nouveau régime"
 department_of_state.233.b: "Soutenir clandestinement l'opposition démocratique"
 department_of_state.233.c: "Accepter le nouveau régime et préserver l'unité de l'alliance"
 department_of_state.234.t: "Washington répond à la transition"
 department_of_state.234.d: "Les [USA.GetName] ont officialisé leur position sur notre nouveau gouvernement. La réponse de Washington façonnera notre place dans le monde pour des années."
 department_of_state.234.a: "Les conséquences sont désormais entre nos mains"
 USA_trump_buy_greenland: "[DEN.GetFlag] Acquérir le Groenland"
 USA_trump_buy_greenland_desc: "Le président a lancé une idée que la plupart des habitués de Washington ont prise pour de la provocation, mais il était tout à fait sérieux : acheter le Groenland au Danemark. La valeur stratégique n'est pas en question : voies maritimes arctiques, terres rares, position avancée contre les sous-marins russes. La question est de savoir si Copenhague prendra seulement l'offre au sérieux, et si le prix sera quelque chose que le Congrès avalera."
 USA_greenland_accept_TT: "[DEN.GetFlag] §H[DEN.GetName]§! nous cède le §HGroenland§! en échange de §G500 milliards de dollars§!"
 USA_greenland_reject_TT: "[DEN.GetFlag] §H[DEN.GetName]§! décline l'offre et son opinion de nous §Rchute§!"
 department_of_state.240.t: "Une offre américaine pour le Groenland"
 department_of_state.240.d: "[FROM.GetNameWithFlag] a formellement proposé d'acheter le §HGroenland§! pour §G500 milliards de dollars§!. L'offre est inédite à l'ère moderne. On n'a pas acheté de territoire entre alliés occidentaux de mémoire d'homme. Vendre scandaliserait l'opinion politique groenlandaise et une bonne partie de l'Europe, mais refuser prive [DEN.GetName] d'une somme stupéfiante au moment où nous avons besoin de chaque couronne. Le Folketing est paralysé ; la décision revient au cabinet."
 department_of_state.240.a: "Vendre le Groenland"
 department_of_state.240.b: "Le Groenland n'est pas à vendre"
 department_of_state.241.t: "Le Groenland vendu aux États-Unis"
 department_of_state.241.d: "Dans un geste qui a sidéré l'Europe et ravi la droite américaine, le Royaume du Danemark a formellement transféré le §HGroenland§! aux [USA.GetName] pour une somme non divulguée que l'on croit de l'ordre de plusieurs centaines de milliards de dollars. La transaction est déjà appelée la « plus grande vente de terres de l'histoire », éclipsant l'achat de la Louisiane. Des manifestations ont éclaté à Nuuk. Bruxelles a publié un communiqué laconique."
 department_of_state.241.a: "Un nouveau chapitre pour la souveraineté américaine"
 USA_trump_nato_dilemma: "[USA.GetFlag] Réévaluer notre rôle dans l'OTAN"
 USA_trump_nato_dilemma_desc: "Le président a fait campagne sur l'idée que l'§HOTAN§! est obsolète et que nos alliés européens se font entretenir par les dollars de la défense américaine. Son équipe de sécurité nationale est moins convaincue. Un examen formel de nos engagements arrive, et trois grandes options sont sur la table : se retirer, menacer de se retirer comme levier, ou se réengager."
 department_of_state.242.t: "OTAN : le choix du président"
 department_of_state.242.d: "Le président a réuni les Joint Chiefs, le secrétaire d'État et le secrétaire à la Défense pour une réunion à huis clos sur l'§HOTAN§!. La question devant eux est existentielle : quel est le rôle de l'Amérique dans l'alliance à l'avenir ? Certains dans l'état-major plaident ouvertement pour un retrait pur et simple, arguant que l'alliance ne sert plus les intérêts américains dans un monde où la Chine est le concurrent pair. D'autres voient l'alliance comme la pierre angulaire de la sécurité occidentale, bâtie en quatre-vingts ans et qui pourrait se perdre en un matin."
 department_of_state.242.a: "Se retirer de l'OTAN"
 department_of_state.242.b: "Menacer de se retirer si les alliés n'atteignent pas l'objectif de 2 %"
 department_of_state.242.c: "Réaffirmer notre engagement envers l'OTAN"
 USA_india_civil_nuclear_agreement: "[RAJ.GetFlag] [USA.GetFlag] L'accord nucléaire indien"
 USA_india_civil_nuclear_agreement_desc: "[RAJ.GetNameWithFlag] est la plus grande démocratie du monde et un contrepoids naturel à la montée de [CHI.GetNameWithFlag]. En rompant avec des décennies d'orthodoxie nucléaire et en reconnaissant [RAJ.GetNameWithFlag] comme une puissance nucléaire responsable, nous ouvrons la porte à un partenariat stratégique qui définira le siècle à venir. Les Pakistanais hurleront et les faucons de la non-prolifération crieront, mais le prix en vaut la peine."
 USA_india_nuclear_TT: "Nous proposerons à §H[RAJ.GetNameWithFlag]§! un §Haccord de coopération nucléaire civile§!, mettant fin à des décennies d'isolement technologique\n - En cas d'acceptation, nous gagnerons un §Hmodificateur de coopération§! avec §H[RAJ.GetNameWithFlag]§!\n - §H[PAK.GetNameWithFlag]§! perdra §R30 d'opinion§! à notre égard quel que soit le résultat\n\nImportance stratégique de cette action :\n - §H[RAJ.GetNameWithFlag]§! est la plus grande démocratie du monde et le contrepoids le plus naturel à §H[CHI.GetNameWithFlag]§!. Bâtir cette relation maintenant façonne le prochain siècle de la puissance indo-pacifique."
 USA_vietnam_comprehensive_partnership: "[VIE.GetFlag] [USA.GetFlag] Partenaires dans le Pacifique"
 USA_vietnam_comprehensive_partnership_desc: "Il y a cinquante ans, nous nous tirions dessus dans la jungle. Aujourd'hui, [VIE.GetName] est l'une des nations les plus anti-chinoises d'Asie du Sud-Est et un partenaire stratégique naturel. Un partenariat global posera le cadre du commerce, de la coopération de sécurité et d'une entente tacite : Pékin est le problème commun."
 USA_vietnam_partnership_TT: "Nous proposerons à §H[VIE.GetNameWithFlag]§! un §Hpartenariat global§!, tissant des liens stratégiques et une entente tacite selon laquelle §H[CHI.GetNameWithFlag]§! est le problème commun\n - En cas d'acceptation, nous gagnerons un §Hmodificateur de coopération§! avec §H[VIE.GetNameWithFlag]§!\n\nImportance stratégique de cette action :\n - §H[VIE.GetNameWithFlag]§! est l'une des nations les plus anti-chinoises d'Asie du Sud-Est. Un partenariat formel ici enfonce un coin entre [CHI.GetFlag] §HPékin§! et son voisinage proche que l'argent seul ne peut acheter."
 USA_caatsa_turkey_sanctions: "[TUR.GetFlag] [USA.GetFlag] Sanctions pour le S-400"
 USA_caatsa_turkey_sanctions_desc: "[TUR.GetNameWithFlag] a acheté un système de défense aérienne russe tout en étant allié de l'OTAN. Ce n'est pas ainsi que fonctionnent les alliances. Au titre de la CAATSA, nous sanctionnerons l'appareil de défense turc et l'exclurons du programme F-35 jusqu'à ce qu'il retrouve la raison. S'ils veulent jouer sur les deux tableaux, ils en paieront le prix."
 USA_caatsa_turkey_TT: "Nous enverrons à §H[TUR.GetNameWithFlag]§! un ultimatum de §Rsanctions CAATSA§! pour l'achat du système de défense aérienne [SOV.GetFlag] §HS-400§!\n\nImportance stratégique de cette action :\n - Un allié ne peut acheter des armes russes et rester dans le programme F-35. Si §H[TUR.GetNameWithFlag]§! recule, ils gagneront §G+15§! d'opinion à notre égard.\n - S'ils refusent, ils seront §Rformellement sanctionnés§! et la stabilité de §H[TUR.GetNameWithFlag]§! en souffrira."
 USA_recognize_guaido: "[VEN.GetFlag] [USA.GetFlag] Reconnaître Juan Guaidó"
 USA_recognize_guaido_desc: "Le régime Maduro a détruit [VEN.GetName]. Des millions de personnes ont fui, l'économie est en ruines et la démocratie n'est plus qu'un souvenir. L'Assemblée nationale, menée par l'opposition, a nommé un président par intérim, et nous allons le reconnaître comme dirigeant légitime de [VEN.GetName]. Les sanctions qui suivront asphyxieront ce qu'il reste des recettes pétrolières du régime."
 USA_recognize_guaido_TT: "Nous reconnaîtrons §HJuan Guaidó§! comme président légitime de [VEN.GetFlag] §H[VEN.GetName]§! et imposerons des §Rsanctions pétrolières§! au régime Maduro\n\nImportance stratégique de cette action :\n - En cas d'acceptation, [VEN.GetFlag] §H[VEN.GetName]§! perd §H10 % de stabilité§! et §H100 points de pouvoir politique§!. L'issue est incertaine : §H30 %§! de chances de §Rguerre civile démocratique§!, §H40 %§! de chances de §Rtroubles de masse§!, §H30 %§! de chances de §Gtransition pacifique§!.\n - Même en cas de refus, [VEN.GetFlag] §H[VEN.GetName]§! perd §H5 % de stabilité§! et subit un §Rdéclin économique§! du fait de nos sanctions."
 USA_cuba_thaw: "[CUB.GetFlag] [USA.GetFlag] Mettre fin à la guerre froide avec Cuba"
 USA_cuba_thaw_desc: "L'embargo contre [CUB.GetName] n'a pas fonctionné depuis cinquante ans, et il ne fonctionnera pas dans les cinquante prochaines. Il est temps de rétablir les relations diplomatiques, de rouvrir l'ambassade et d'assouplir les restrictions sur les voyages et les envois de fonds. L'engagement fera plus pour changer Cuba que l'isolement n'a jamais fait."
 USA_cuba_thaw_TT: "Nous rétablirons des §Hrelations diplomatiques§! avec [CUB.GetFlag] §H[CUB.GetName]§! et assouplirons l'§Hembargo§!, ouvrant la voie à la normalisation\n - Si [CUB.GetFlag] §H[CUB.GetName]§! accepte, nous gagnons un §Hmodificateur de coopération§! et leur §Hstabilité§! s'améliore de §G5 %§!\n - Cette action est §Rpermanente§!. Elle verrouille l'option §RGel cubain§! pour le reste de l'ère\n\nImportance stratégique de cette action :\n - Cinquante ans d'embargo n'ont pas fait tomber le gouvernement de [CUB.GetFlag] §HCuba§!. L'engagement peut réussir là où l'isolement a échoué."
 USA_cuba_freeze: "[CUB.GetFlag] [USA.GetFlag] Cuba n'est pas un ami"
 USA_cuba_freeze_desc: "Le dégel avec La Havane a tout donné au régime et n'a rien rapporté en retour. Nous rétablirons les restrictions de voyage, durcirons l'embargo et frapperons les flux de dollars vers l'armée cubaine. [CUB.GetName] est une dictature communiste à cent quarante kilomètres de nos côtes, et nous la traiterons comme telle."
 USA_cuba_freeze_TT: "Nous rétablirons de strictes §Rsanctions§! contre [CUB.GetFlag] §H[CUB.GetName]§! et inverserons les gains de normalisation\n - En cas d'acceptation, [CUB.GetFlag] §H[CUB.GetName]§! perd §H2 % de stabilité§! et §H25 points de pouvoir politique§!\n - En cas de refus, [CUB.GetFlag] §H[CUB.GetName]§! perd §H5 % de stabilité§! et subit un §Rdéclin économique§!\n - Cette action est §Rpermanente§!. Elle verrouille l'option §RDégel cubain§! pour le reste de l'ère\n\nImportance stratégique de cette action :\n - [CUB.GetFlag] §H[CUB.GetName]§! est une dictature communiste à cent quarante kilomètres de nos côtes. Les sanctions font passer le message : défier les intérêts américains dans notre propre hémisphère a un coût."
 USA_huawei_export_blacklist: "[CHI.GetFlag] [USA.GetFlag] Liste noire Huawei"
 USA_huawei_export_blacklist_desc: "Huawei n'est pas seulement une entreprise de télécoms : c'est un bras de l'État chinois, et chaque routeur vendu à l'étranger est une possible porte dérobée dans les réseaux alliés. Les inscrire sur la Liste des entités les coupe des puces et des logiciels américains. Si nos alliés veulent garder leurs réseaux 5G sûrs, ils suivront notre exemple."
 USA_huawei_blacklist_TT: "Nous inscrirons §HHuawei§! et les entreprises technologiques [CHI.GetFlag] §Hchinoises§! liées sur la §HListe des entités§!, les coupant des puces et des logiciels américains\n\nImportance stratégique de cette action :\n - Si [CHI.GetFlag] §H[CHI.GetName]§! cède, ils perdent §R50 points de pouvoir politique§! face à la pression américaine.\n - S'ils refusent, la tech [CHI.GetFlag] §Hchinoise§! subit un §Rdéclin économique§! à mesure que les chaînes d'approvisionnement s'éloignent d'eux."
 USA_semiconductor_export_controls: "[CHI.GetFlag] [USA.GetFlag] Asphyxier l'approvisionnement en puces"
 USA_semiconductor_export_controls_desc: "Les puces avancées sont le pétrole du XXIe siècle, et [CHI.GetName] a des années de retard. Ces nouveaux contrôles à l'exportation les y maintiendront. Pas d'équipement de lithographie avancée, pas d'accélérateurs d'IA, pas de soutien à leurs fabs les plus sophistiquées. C'est la politique de confinement technologique la plus agressive depuis la guerre froide, et elle va faire mal."
 USA_semiconductor_controls_TT: "Nous imposerons des §Hcontrôles à l'exportation étendus§! sur les §Hsemi-conducteurs§! avancés et les équipements de fabrication de puces destinés à [CHI.GetFlag] §H[CHI.GetName]§!\n\nImportance stratégique de cette action :\n - Si [CHI.GetFlag] §H[CHI.GetName]§! capitule, ils perdent §R75 points de pouvoir politique§! sous la pression intérieure.\n - S'ils refusent, leur industrie de puces haut de gamme subit un §Rdéclin économique§! et prend des années de retard, consolidant notre avance technologique."
 USA_hong_kong_autonomy_sanctions: "[CHI.GetFlag] [USA.GetFlag] La loi sur l'autonomie de Hong Kong"
 USA_hong_kong_autonomy_sanctions_desc: "La loi de sécurité nationale de Pékin a étranglé les libertés promises à Hong Kong sous « un pays, deux systèmes ». La loi sur l'autonomie de Hong Kong nous permet de sanctionner les responsables du PCC et les banques impliquées. Elle ne restaurera pas Hong Kong, mais elle fera payer un prix personnel à ceux qui l'ont tuée."
 USA_hk_sanctions_TT: "Nous sanctionnerons les §Hresponsables du PCC§! et les banques responsables de la répression à §HHong Kong§! au titre de la loi sur l'autonomie de Hong Kong\n\nImportance stratégique de cette action :\n - Si [CHI.GetFlag] §H[CHI.GetName]§! recule, ils perdent §R100 points de pouvoir politique§! et §R3 % de stabilité§! du fait des retombées intérieures.\n - S'ils refusent, la croissance [CHI.GetFlag] §Hchinoise§! souffrira et [ENG.GetFlag] §H[ENG.GetName]§! gagnera §G+15§! d'opinion envers nous pour notre fermeté."
 USA_withdraw_from_who: "[USA.GetFlag] Couper les fonds à l'Organisation mondiale de la santé"
 USA_withdraw_from_who_desc: "L'Organisation mondiale de la santé a couvert [CHI.GetName] pendant que le virus se répandait dans le monde. C'est une marionnette chinoise, et nous ne paierons pas la facture. Nous retirons notre financement et notre adhésion. Que l'OMS explique à ses autres donateurs pourquoi le plus gros s'en va."
 USA_return_to_who: "[USA.GetFlag] Réintégrer l'Organisation mondiale de la santé"
 USA_return_to_who_desc: "Quitter l'OMS en pleine pandémie était une blessure auto-infligée. Nous réintégrons dès le premier jour, rétablissons notre financement et réaffirmons le leadership américain à l'agence. La réforme viendra de l'intérieur, pas de la touche."
 USA_fentanyl_cartel_fto: "[MEX.GetFlag] [USA.GetFlag] Désigner les cartels"
 USA_fentanyl_cartel_fto_desc: "Le fentanyl tue plus d'Américains chaque année que toute la guerre du Vietnam. Les cartels qui le font passer la frontière sont des organisations terroristes en tout sauf le nom, et aujourd'hui nous le rendons officiel. La désignation d'organisation terroriste étrangère ouvre tous les outils juridiques et militaires dont nous disposons. [MEX.GetName] peut aider ou s'écarter."
 USA_fentanyl_fto_TT: "Nous désignerons formellement les [MEX.GetFlag] §Hcartels de la drogue mexicains§! comme §Horganisations terroristes étrangères§!, débloquant tous nos outils antiterroristes\n\nImportance stratégique de cette action :\n - Si [MEX.GetFlag] §H[MEX.GetName]§! coopère, nous gagnons un §Hmodificateur de coopération§! et un véritable partenaire pour démanteler la chaîne d'approvisionnement.\n - Si [MEX.GetFlag] §H[MEX.GetName]§! refuse, leur économie encaisse un §Rchoc§! et la stabilité chute de §R3 %§! à mesure que notre pression antinarcotique s'intensifie."
 department_of_state.210.t: "Partenariat nucléaire américain"
 department_of_state.210.d: "Les Américains ont tendu une offre historique : un accord complet de coopération nucléaire civile qui mettrait fin à des décennies de sanctions imposées après nos essais de 1974. En échange de la séparation de nos programmes civil et militaire et de l'acceptation des garanties de l'AIEA sur les réacteurs civils, nous aurions accès à la technologie et au combustible des réacteurs américains. Islamabad hurlera, mais une étreinte stratégique de Washington n'est pas une offre qui se présente deux fois."
 department_of_state.210.a: "Un partenariat entre deux grandes démocraties."
 department_of_state.210.b: "Nous ne compromettrons pas notre programme nucléaire."
 department_of_state.211.t: "Un partenariat global"
 department_of_state.211.d: "Washington nous a proposé un partenariat global couvrant la coopération politique, économique, sécuritaire et culturelle. Un demi-siècle après la guerre, les Américains sont prêts à tourner la page et à faire front commun contre le problème chinois croissant en mer de Chine méridionale. Le Parti doit décider jusqu'où laisser aller cette étreinte."
 department_of_state.211.a: "Nous acceptons le partenariat."
 department_of_state.211.b: "Le moment n'est pas venu."
 department_of_state.212.t: "Ultimatum de la CAATSA"
 department_of_state.212.d: "Les Américains ont lancé un ultimatum : abandonner le S-400 russe et revenir au programme F-35, ou affronter de vastes sanctions CAATSA et l'exclusion du consortium de chasseurs. Washington refuse qu'un allié de l'OTAN achète des défenses antiaériennes russes sans conséquence. Le choix est entre notre autonomie stratégique et notre ancrage occidental."
 department_of_state.212.a: "Nous annulerons l'accord S-400."
 department_of_state.212.b: "La Turquie ne répond à personne."
 department_of_state.213.t: "Ultimatum américain"
 department_of_state.213.d: "Les Américains ont reconnu la prétention de l'opposition à la présidence et exigent que le régime s'écarte. Des sanctions pétrolières paralysantes suivront si nous ne cédons pas. Les rues sont pleines de manifestants, l'opposition est enhardie, et la Maison-Blanche fait clairement savoir qu'elle considère les jours du bolivarisme comme comptés."
 department_of_state.213.a: "Nous nous retirerons pour sauver la nation."
 department_of_state.213.b: "La révolution ne sera pas impérialisée."
 department_of_state.214.t: "Normalisation avec Washington"
 department_of_state.214.d: "Après un demi-siècle de confrontation, les Américains ont proposé le rétablissement des relations diplomatiques, la réouverture des ambassades et un assouplissement de l'embargo. Washington parie que l'engagement fera ce que l'isolement n'a jamais pu. C'est une ouverture que nous n'attendions pas, et qui pourrait transformer notre économie ou compromettre la révolution."
 department_of_state.214.a: "La révolution survivra à l'embargo. Qu'ils viennent."
 department_of_state.214.b: "Nous ne troquerons pas nos principes contre des dollars du tourisme."
 department_of_state.215.t: "L'embargo revient"
 department_of_state.215.d: "Les Américains ont fait volte-face. Les restrictions de voyage sont rétablies, les contacts d'ambassade gelés, et l'embargo de nouveau durci. Washington a décidé que le dégel nous avait tout donné et n'avait rien rapporté. La brève ouverture est close."
 department_of_state.215.a: "Nous devons trouver un moyen de négocier."
 department_of_state.215.b: "Nous endurerons, comme toujours."
 department_of_state.216.t: "Sanctions sur la liste des entités"
 department_of_state.216.d: "Les Américains ont inscrit Huawei et une liste croissante de nos entreprises technologiques sur leur Liste des entités, les coupant des puces, logiciels et composants américains. Washington traite nos champions nationaux comme des bras de l'État et fait pression sur les capitales alliées pour qu'elles suivent sur les marchés 5G. C'est un acte de guerre économique contre notre essor technologique, et il exige une réponse."
 department_of_state.216.a: "Nous chercherons un compromis négocié."
 department_of_state.216.b: "L'autosuffisance sera notre réponse."
 department_of_state.217.t: "Escalade de la guerre des puces"
 department_of_state.217.d: "Les Américains ont imposé de vastes nouveaux contrôles à l'exportation sur les semi-conducteurs avancés et l'équipement nécessaire pour les fabriquer, visant spécifiquement notre voie vers les puces d'IA et militaires haut de gamme. C'est le blocus technologique le plus agressif tenté par Washington depuis la guerre froide, et il frappe au cœur de notre avenir industriel."
 department_of_state.217.a: "Nous devons trouver une résolution diplomatique."
 department_of_state.217.b: "Nous construirons ce qu'ils ne vendront pas."
 department_of_state.218.t: "Loi sur l'autonomie de Hong Kong"
 department_of_state.218.d: "Les Américains ont adopté des sanctions visant nos responsables et nos banques au titre de la loi de sécurité nationale de Hong Kong. Washington a déclaré que nous avions violé « un pays, deux systèmes », tandis que nous insistons sur le caractère souverain et intérieur de l'affaire. Les sanctions sont calibrées pour imposer un coût personnel aux camarades qui ont validé la répression."
 department_of_state.218.a: "Nous assouplirons l'application à Hong Kong."
 department_of_state.218.b: "Hong Kong est une affaire intérieure."
 department_of_state.219.t: "Cartels déclarés terroristes"
 department_of_state.219.d: "Les Américains ont formellement désigné nos cartels comme organisations terroristes étrangères et nous pressent de coopérer à des opérations conjointes. Washington a fait de la crise du fentanyl le cœur de sa politique, et évoque ouvertement une action militaire unilatérale sur notre sol. Le choix est entre un partenariat humiliant et la perspective de drones américains dans notre ciel."
 department_of_state.219.a: "Nous coopérerons pour éviter le pire."
 department_of_state.219.b: "Notre souveraineté n'est pas à vendre."
 USA_fifth_generation_fighter_woes_1: "Blues de 5e génération : production"
 USA_fifth_generation_fighter_woes_1_desc: "Malgré l'optimisme depuis le premier vol d'essai de 1997, le F-22 a été miné par des problèmes de fabrication et d'assemblage. Rebuts, reprises et plans d'ingénierie en retard maintiennent une production lente et coûteuse. Lockheed s'attend à ce que les premiers F-22 atteignent la production à faible cadence plus tard cette année."
 USA_fifth_generation_fighter_woes_2: "Blues de 5e génération : cellule"
 USA_fifth_generation_fighter_woes_2_desc: "Les essais en vol ont fait apparaître des problèmes de cellule qui remontent jusqu'à la chaîne : buffeting des dérives, surchauffe entre les tuyères et affaiblissement de l'empennage horizontal. Chaque Raptor qui sort de chaîne coûte davantage tant que les correctifs ne sont pas intégrés."
 USA_fifth_generation_fighter_woes_3: "Blues de 5e génération : avionique"
 USA_fifth_generation_fighter_woes_3_desc: "La suite avionique à ordinateur commun du Raptor est instable. Plus de 1,7 million de lignes de code, et les pilotes redémarrent les ordinateurs de l'appareil en vol. Tant que le temps moyen entre anomalies avioniques n'atteint pas le seuil des essais opérationnels, les séries restent lentes et coûteuses."
 USA_f22_rushed_production: "Fielding précipité des rapaces"
 USA_f22_rushed_production_desc: "Nous avons poussé le F-22 sur le terrain avant que les défauts soient réglés. La flotte vole avec des pannes connues, multipliant les accidents et pesant sur la compétence des équipages jusqu'à ce que les correctifs rattrapent."
 USA_f22_raptor_operational: "F-22 Raptor opérationnel"
 USA_f22_raptor_operational_desc: "Le Raptor est en service. Le développement tumultueux derrière nous, la chaîne tourne et l'armée de l'air a enfin son chasseur de cinquième génération."
 usa.200.t: "Le F-22A entre en production à faible cadence"
 usa.200.d: "Après des années de retards, le Raptor est autorisé à la production initiale à faible cadence. Les appareils d'essai sont en retard, la productivité logicielle est faible, et l'usine se bat encore contre les rebuts et les reprises. Jusqu'où poussons-nous la chaîne ?"
 usa.200.a: "Accélérer, il nous faut des cellules"
 usa.200.b: "Maintenir un rythme de production délibéré"
 usa.201.t: "Problèmes structurels du F-22"
 usa.201.d: "L'essai en vol a révélé un buffeting violent des dérives, une surchauffe entre les tuyères et un affaiblissement de l'empennage horizontal. Les correctifs doivent être réintégrés dans les appareils de série. On colmate et on continue de voler, ou on arrête pour une vraie refonte ?"
 usa.201.a: "Boulonner les correctifs et continuer de voler"
 usa.201.b: "Arrêter la chaîne pour une vraie refonte"
 usa.202.t: "Instabilité du logiciel avionique du F-22"
 usa.202.d: "Les pilotes redémarrent l'avionique en vol. Le Defense Acquisition Board veut des heures de fonctionnement stable avant les essais opérationnels. Nous pouvons mettre en service le Block 3.1.2 tel quel, ou tout miser sur le logiciel avant que le Raptor ne soit opérationnel."
 usa.202.a: "Déployer le Block 3.1.2 tel quel"
 usa.202.b: "Effort logiciel prioritaire en cas de crash"
 usa.203.t: "Le Raptor est opérationnel"
 usa.203.d: "L'essai et l'évaluation opérationnels initiaux ont jugé le F-22 massivement efficace, surclassant le F-15C dans chaque domaine air-air. La production à pleine cadence est approuvée et les premiers Raptor aptes au combat rejoignent la flotte."
 usa.203.a: "Supériorité aérienne, livrée"
 MNNA_partnership: "Programme d'allié majeur non membre de l'OTAN"
 MNNA_partnership_desc: "La désignation d'§Hallié majeur non membre de l'OTAN§! est étendue par la direction de l'§HOTAN§! à des partenaires proches hors de l'alliance. Elle accorde un accès préférentiel aux transferts d'armes, aux exercices militaires conjoints et aux accords de partage de renseignement."
 USA_nigeria_intervention: "Intervention des États-Unis au Nigeria"
 USA_rock_island_arsenal_name: "Arsenal de Rock Island"
 USA_rock_island_arsenal_trait: "Arsenal gouvernemental de l'U.S. Army"
 USA_rock_island_arsenal_b1_header: "Ligne d'obusiers remorqués"
 USA_rock_island_arsenal_b2_header: "Fabrication d'arsenal"
 USA_rock_island_m198_line: "Ligne d'obusiers M198"
 USA_rock_island_m119_light: "Obusier léger M119"
 USA_rock_island_m198_range: "Extension de portée M198"
 USA_rock_island_digital_fire_control: "Contrôle de tir numérique M119A3"
 USA_rock_island_jmtc: "Centre conjoint de fabrication et de technologie"
 USA_rock_island_recoil_mechanisms: "Maîtrise du mécanisme de recul"
 USA_rock_island_additive_manufacturing: "Fonderie de fabrication additive"
 USA_us_arab_legion_desc: "Des volontaires arabo-américains se sont rassemblés pour former une légion combattant à nos côtés contre la menace irakienne. Lever et entretenir ce corps de volontaires puise dans notre vivier de recrutement, laissant un peu moins de bras au service régulier."
 lunar_outpost_tt: "§BAu fil du temps, notre avant-poste lunaire peut connaître des défis ou des crises qui peuvent le mettre en danger. Cependant, en cas de succès, les récompenses seront énormes.§!\n"
 USA_wot_iraq_invasion_failed: "Échec de l'invasion de l'Irak"
 MNNA_nato_may_intervene_in_this_conflict_tt: "Parce que [FROM.GetNameWithFlag] est un §Hallié majeur non membre de l'OTAN§!, nous pourrions voir une intervention de l'§HOTAN§! dans ce conflit.\n"
 MNNA_rejected_recently: "A récemment demandé le statut d'§Yallié majeur non membre de l'OTAN§!, et s'est vu refuser."
 USA_condemn_iranian_missile_launches: "Mobiliser pour condamner les essais de missiles iraniens"
 USA_condemn_iranian_missile_launches_desc: "Le programme de missiles balistiques iranien a continué à travers chaque round de sanctions, avec des tirs d'essai calés pour signifier le défi plutôt que la capacité. Washington peut pousser un gouvernement partenaire à se joindre à une condamnation publique, transformant une protestation unilatérale en front diplomatique. Les gouvernements qui dépendent de l'énergie iranienne ou craignent des représailles peuvent décliner."
 USA_condemned_PER_launch_recently: "A récemment rallié une condamnation des essais de missiles iraniens"
 USA_shayrat_missile_strike: "Frapper la base aérienne de Shayrat"
 USA_shayrat_missile_strike_desc: "La base aérienne de Shayrat, hors de Homs, accueille les escadrons de l'armée de l'air syrienne qui mènent des sorties contre le territoire tenu par les rebelles. Des destroyers en Méditerranée orientale peuvent poser des Tomahawk sur la piste, les abris durcis et les points de carburant en quelques heures. C'est une frappe punitive, pas une campagne : Damas réparera le terrain en quelques jours, et Moscou et Téhéran le traiteront comme une entrée américaine directe dans la guerre."
 USA_arm_rojava: "Armer les Forces démocratiques syriennes"
 USA_arm_rojava_desc: "Les milices à direction kurde qui tiennent le nord de la Syrie sont la seule force terrestre prête à prendre Raqqa, et elles se battent avec ce qu'elles peuvent capturer. Des transferts directs d'armes légères, de véhicules légers et d'armes antichars rendraient possible un assaut sur la capitale de l'État islamique. Ankara considère ces unités comme une extension du PKK et lira l'envoi comme l'armement d'une organisation terroriste à sa frontière."
 asteroid_mining_rate_tt: "Requiert un taux d'extraction d'astéroïdes actif (actuellement [?asteroid_mining_rate|0])"
 USA_jcpoa_withdrawn: "Déjà retiré du JCPOA"
 USA_jerusalem_recognized: "Jérusalem est déjà reconnue comme capitale d'Israël"
 USA_golan_recognized: "Souveraineté israélienne déjà reconnue sur le Golan"
 USA_paris_agreement_rejoined: "Déjà réintégré l'accord de Paris"
 USA_thaad_deployed: "THAAD déjà déployé en Corée"
 USA_quad_established: "Le Quad déjà formalisé"
 USA_phi_edca_expanded: "EDCA déjà étendu"
 USA_yemen_intervention: "Déjà intervenu au Yémen"
 USA_mali_intervention: "Déjà intervenu au Mali"
 USA_haiti_stabilization: "Déjà déployé en Haïti"
 USA_f35_progress_incomplete_TT: "L'avancement du programme F-35 est inférieur à 100 %"
 USA_iran_sanction_level_max_tt: "La sévérité des sanctions doit être inférieure à §Y5/5§! (actuellement [?USA_iran_sanction_level]/5)"
 USA_iran_sanction_level_min_tt: "La sévérité des sanctions doit être d'au moins §Y2/5§! (actuellement [?USA_iran_sanction_level]/5)"
 USA_cuba_policy_locked: "Politique cubaine déjà verrouillée"
 USA_left_WHO: "Retiré de l'Organisation mondiale de la santé"
 usa_economic_events.300.a: "Soutenir la fusion"
 usa_economic_events.300.b: "Gardez HP indépendant"
 usa_economic_events.300.d: "La FTC a clos son enquête sur la fusion proposée Hewlett-Packard–Compaq sans mesure d'exécution. La campagne de procuration de Walter Hewlett a fait du vote des actionnaires un combat pour l'avenir de HP."
 usa_economic_events.300.t: "La bataille de procuration Compaq"
 usa_economic_events.301.a: "Achever l'expansion des services"
 usa_economic_events.301.b: "Passer le marché et rester d'abord sur le matériel"
 usa_economic_events.301.d: "HP peut payer 13,9 milliards de dollars pour Electronic Data Systems, combinant des activités de services de plus de 38 milliards de dollars de chiffre d'affaires annuel et donnant à HP une plateforme mondiale pour concurrencer au-delà du matériel. Ou elle peut garder l'argent et rester une entreprise de matériel."
 usa_economic_events.301.t: "Le pari services EDS"
 usa_economic_events.302.a: "Pivot vers les logiciels d'entreprise"
 usa_economic_events.302.b: "Se recentrer sur les appareils et les PC"
 usa_economic_events.302.d: "HP prévoit d'arrêter les appareils webOS, d'étudier des alternatives pour son activité ordinateurs personnels et d'acquérir l'éditeur de logiciels d'entreprise Autonomy. La transformation proposée ferait basculer l'entreprise vers les logiciels, le cloud et les services à plus forte marge."
 usa_economic_events.302.t: "Rupture stratégique de HP"
 usa_economic_events.303.a: "Achever la séparation"
 usa_economic_events.303.b: "Garder Hewlett-Packard ensemble"
 usa_economic_events.303.d: "Hewlett-Packard prévoit de se séparer en deux sociétés cotées. HP Inc. conserverait les systèmes personnels et l'impression, tandis que Hewlett Packard Enterprise reprendrait l'infrastructure, les logiciels et les services."
 usa_economic_events.303.t: "Hewlett-Packard divise"
 usa_economic_events.304.a: "Miser à fond sur le plan indépendant de HP"
 usa_economic_events.304.b: "Laisser la porte ouverte à la consolidation"
 usa_economic_events.304.d: "Xerox a retiré son offre publique d'achat sur HP Inc. et mis fin à sa campagne de procuration, invoquant les perturbations causées par la pandémie de COVID-19. L'effondrement de l'OPA hostile rend le contrôle de la stratégie de HP à son conseil."
 usa_economic_events.304.t: "L'offre Xerox s'effondre"
 usa_economic_events.310.a: "Michael Dell reprend le commandement"
 usa_economic_events.310.b: "Installer une gestion professionnelle"
 usa_economic_events.310.d: "Kevin Rollins a démissionné après le tassement de la croissance et l'échec du modèle direct, ramenant Michael Dell à la direction générale. Il peut prendre personnellement en main le redressement ou installer une direction professionnelle pour stabiliser l'entreprise."
 usa_economic_events.310.t: "Le fondateur revient"
 usa_economic_events.311.a: "Créer une branche de services d'entreprise"
 usa_economic_events.311.b: "Rester une entreprise de quincaillerie"
 usa_economic_events.311.d: "Dell a accepté d'acquérir Perot Systems, une société de services informatiques. L'opération donnerait à Dell un bras services et un pied dans les solutions d'entreprise, au-delà de la vente de matériel."
 usa_economic_events.311.t: "L'acquisition de Perot Systems"
 usa_economic_events.312.a: "Privatiser Dell avec Silver Lake"
 usa_economic_events.312.b: "Rester coté et responsable"
 usa_economic_events.312.d: "Michael Dell et le fonds Silver Lake ont proposé de racheter l'entreprise et de la retirer de la cote. Quitter les marchés publics libérerait Dell de la pression des résultats trimestriels et donnerait au fondateur de la marge pour la refondre, au prix d'une dette énorme au bilan."
 usa_economic_events.312.t: "La décision de privatisation"
 usa_economic_events.313.a: "Acquérir EMC et intégrer le portefeuille"
 usa_economic_events.313.b: "Acquérir EMC et préserver sa fédération"
 usa_economic_events.313.d: "Le 12 octobre 2015, Dell et EMC ont annoncé un projet d'acquisition à 67 milliards de dollars, la plus grande opération technologique jamais tentée. La mener à terme ferait de Dell une entreprise d'infrastructure à spectre complet et ramènerait la fédération d'EMC, y compris sa participation majoritaire dans VMware, sous un même toit, mais elle emporterait aussi une montagne de dettes."
 usa_economic_events.313.t: "Le projet d'acquisition d'EMC"
 usa_economic_events.314.a: "Scinder VMware et réduire la dette"
 usa_economic_events.314.b: "Gardez VMware intégré"
 usa_economic_events.314.d: "Le 14 avril 2021, Dell a proposé de scinder sa participation majoritaire dans VMware et d'utiliser le dividende extraordinaire associé pour ramener sa dette vers la catégorie investissement. L'indépendance affûterait les deux entreprises, mais Dell perdrait le joyau logiciel qu'EMC lui avait apporté."
 usa_economic_events.314.t: "Le projet de scission de VMware"
 usa_economic_events.315.a: "Construire des serveurs d'IA à grande échelle"
 usa_economic_events.315.b: "Poursuivre l'IA de façon sélective pour la marge"
 usa_economic_events.315.d: "La demande de serveurs optimisés pour l'IA explose, et l'activité infrastructure de Dell se remplit de commandes de systèmes denses en GPU. Dell peut s'engager à produire à grande échelle, ou poursuivre l'opportunité de façon sélective pour protéger les marges."
 usa_economic_events.315.t: "Le déploiement des serveurs d'IA"
 usa_economic_events.320.a: "Laisser l'examen antitrust aller à son terme"
 usa_economic_events.320.b: "Intervenir pour casser l'offre"
 usa_economic_events.320.d: "Oracle a lancé une offre publique d'achat non sollicitée de 5,1 milliards de dollars sur PeopleSoft, quelques jours après que PeopleSoft a accepté d'acheter J.D. Edwards. PeopleSoft répond par une pilule empoisonnée et une garantie de remboursement des clients en cas d'acquisition, tandis que le département de la Justice pèse un recours antitrust. Washington peut laisser l'examen aller à son terme, ou intervenir pour casser l'offre."
 usa_economic_events.320.t: "Le siège de PeopleSoft"
 usa_economic_events.321.a: "Autoriser l'acquisition"
 usa_economic_events.321.b: "Bloquer pour concurrence déloyale sur les bases de données"
 usa_economic_events.321.d: "L'accord Sun placerait Java, MySQL, Solaris et SPARC sous le contrôle d'Oracle, donnant à une seule firme un levier sur une infrastructure logicielle critique et une activité matérielle qu'elle n'a jamais dirigée. L'examen porte sur le fait de savoir si la même entreprise doit détenir à la fois la principale base de données commerciale et celle en open source qui la concurrence. L'autoriser consolide la pile ; le bloquer laisse les actifs de Sun à un autre acheteur."
 usa_economic_events.321.t: "Sun Microsystems : la garde de la pile"
 usa_economic_events.322.a: "Soutenir la revendication de droit d'auteur"
 usa_economic_events.322.b: "Soutenir que les interfaces restent ouvertes"
 usa_economic_events.322.d: "Le procès sur les API Java contre Google est devenu une bataille décisive sur les interfaces logicielles. Une victoire d'Oracle rendrait les API effectivement protégeables par le droit d'auteur et étendrait la pression des licences, tandis que la lecture inverse préserverait les normes d'interopérabilité. Washington peut peser derrière la revendication de droit d'auteur, ou soutenir que les interfaces restent ouvertes."
 usa_economic_events.322.t: "Oracle contre Google"
 usa_economic_events.323.a: "Ouvrir les marchés fédéraux du cloud à un second fournisseur"
 usa_economic_events.323.b: "Laisser le marché aux titulaires"
 usa_economic_events.323.d: "Oracle conteste l'attribution du contrat cloud fédéral face à des hyperscalers déjà installés, avec distribution, attraction des développeurs et capital. Orienter l'infrastructure fédérale vers un second fournisseur achèterait à Oracle une pertinence à un lourd coût, tandis que laisser le marché où il est conserve les marges on-premise qu'elle gagne déjà. L'achat public décide."
 usa_economic_events.323.t: "Virage vers l'infrastructure cloud"
 usa_economic_events.324.a: "Autoriser l'acquisition"
 usa_economic_events.324.b: "Bloquer pour des motifs liés aux données des patients"
 usa_economic_events.324.d: "L'accord Cerner donnerait à Oracle une position dominante dans les dossiers médicaux électroniques et les systèmes d'information hospitaliers, étendant la portée d'entreprise à l'un des secteurs les plus sensibles aux données et les plus réglementés. L'examen porte sur la concentration des données patients et sur ce que les hôpitaux gagnent ou perdent d'un verrouillage plus profond. L'autoriser consolide l'informatique de santé ; le bloquer maintient Oracle sur son cœur de base de données."
 usa_economic_events.324.t: "Acquisition de Cerner : domination de l'informatique de santé"
 usa_economic_events.330.t: "L'engagement CUDA"
 usa_economic_events.330.d: "NVIDIA propose de consacrer des années et beaucoup d'argent à rendre ses processeurs graphiques programmables pour un travail qui n'est pas graphique. Aucun client ne l'a demandé. L'alternative est de mettre les mêmes ingénieurs sur les produits qui se vendent déjà."
 usa_economic_events.330.a: "Financer la plateforme de calcul généraliste"
 usa_economic_events.330.b: "Garder les ingénieurs sur le graphique"
 usa_economic_events.331.t: "Le signal de l'apprentissage profond"
 usa_economic_events.331.d: "Des chercheurs ont remporté un concours de reconnaissance d'images avec une marge énorme en utilisant des cartes de jeu Nvidia plutôt que du matériel dédié. C'est un résultat dans une compétition académique, et cela suggère un marché qui n'existe pas encore."
 usa_economic_events.331.a: "Construire pour le marché de l'apprentissage automatique"
 usa_economic_events.331.b: "Attendre un marché qui a des clients"
 usa_economic_events.332.t: "Le pivot vers les centres de données"
 usa_economic_events.332.d: "Servir les centres de données signifie de nouveaux siliciums, de nouvelles interconnexions, de nouveaux systèmes et une organisation commerciale qui vend aux opérateurs plutôt qu'aux joueurs. Cela ferait de Nvidia une autre entreprise. Rester sur GeForce est moins cher et la demande est déjà prouvée."
 usa_economic_events.332.a: "Reconstruire l'entreprise autour du centre de données"
 usa_economic_events.332.b: "Rester sur le marché grand public"
 usa_economic_events.333.t: "Les contrôles à l'exportation commencent"
 usa_economic_events.333.d: "Washington restreint la vente des accélérateurs les plus performants de Nvidia à l'étranger. Se conformer coûte l'un des plus grands marchés et achète une position auprès du gouvernement qui écrit les règles. Contourner les seuils par l'ingénierie conserve le chiffre d'affaires et invite la restriction suivante."
 usa_economic_events.333.a: "Se conformer et s'aligner sur les contrôles"
 usa_economic_events.333.b: "Contourner les seuils par l'ingénierie"
 usa_economic_events.334.t: "Le déploiement des accélérateurs"
 usa_economic_events.334.d: "La demande d'accélérateurs d'entraînement Nvidia dépasse tout ce pour quoi la chaîne d'approvisionnement a été conçue. S'engager sur le volume, c'est payer de la capacité des années avant les commandes. Se retenir protège le bilan et cède le manque à un concurrent."
 usa_economic_events.334.a: "S'engager sur le volume et acheter la capacité"
 usa_economic_events.334.b: "Maintenir la discipline d'offre et protéger la marge"
 usa_economic_events.335.t: "L'ordre des accélérateurs"
 usa_economic_events.335.d: "Deux décennies de paris de Nvidia sur le silicium programmable ont tranché qui fournit la puissance de calcul du monde et à quelles conditions. Ce que l'industrie américaine peut entraîner, et à qui elle peut vendre, en découle désormais."
 usa_economic_events.335.a: "Une plateforme qu'aucun concurrent ne peut déloger"
 usa_economic_events.335.b: "Une pile de calcul souveraine"
 usa_economic_events.335.c: "Un Commonwealth ouvert d’accélérateurs"
 usa_economic_events.335.e: "Un fournisseur de matières premières en déclin"
 USA_nvidia_cuda_fortress: "La forteresse des accélérateurs"
 USA_nvidia_cuda_fortress_desc: "Le matériel est remplaçable, le logiciel écrit pour lui ne l'est pas. Deux décennies d'outils, de bibliothèques et d'ingénieurs formés font de la plateforme le défaut, et chaque rival doit être meilleur d'une marge assez large pour justifier de tout réécrire."
 USA_nvidia_sovereign_compute_stack: "Pile de calcul souveraine"
 USA_nvidia_sovereign_compute_stack_desc: "Les accélérateurs ont été construits à grande échelle sans le fossé logiciel qui les rendait inattaquables. La capacité est américaine et abondante, et les conditions d'accès se fixent à Washington plutôt que par celui qui écrit le noyau le plus rapide."
 USA_nvidia_open_accelerator_commonwealth: "Commonwealth des accélérateurs ouverts"
 USA_nvidia_open_accelerator_commonwealth_desc: "Le calcul accéléré s'est développé comme infrastructure partagée plutôt que comme propriété d'une entreprise. Les marges sont plus minces que celles d'un monopole et le nombre de personnes qui construisent dessus est bien plus grand."
 USA_nvidia_commodity_decline: "Silicium de base"
 USA_nvidia_commodity_decline_desc: "Le pari sur le silicium programmable n'a jamais été pleinement pris, et le calcul accéléré a été défini ailleurs. Le matériel graphique américain se vend encore, au prix d'une commodité."
 usa_economic_events.340.t: "Flash de messagerie instantanée"
 usa_economic_events.340.d: "Une coentreprise placerait Micron dans la mémoire flash aux côtés d'un partenaire bien plus grand, partageant les fabs et le risque sur un produit qu'elle n'a jamais fabriqué. Rester sur la mémoire dynamique, c'est être très bon dans une commodité dans un métier qui punit quiconque n'en a qu'une."
 usa_economic_events.340.a: "Entrer dans la flash par la coentreprise"
 usa_economic_events.340.b: "Rester sur la mémoire dynamique"
 usa_economic_events.341.t: "L'hiver de la mémoire"
 usa_economic_events.341.d: "Les prix de la mémoire sont tombés sous le coût de fabrication et des concurrents ferment des fabs. Acheter de la capacité maintenant coûte de l'argent que Micron perd déjà, et ce ne sera jamais moins cher. Couper les dépenses protège le bilan et cède la reprise à qui survit avec plus de capacité."
 usa_economic_events.341.a: "Acheter de la capacité tant qu'elle est bon marché"
 usa_economic_events.341.b: "Couper les dépenses et passer l'hiver"
 usa_economic_events.342.t: "Le réseau Elpida"
 usa_economic_events.342.d: "Elpida, en faillite, peut être rachetée hors administration par Micron, apportant des fabs à Hiroshima et à Taïwan et une liste de clients qui inclut les plus grands fabricants de téléphones. Elle apporte aussi une main-d'œuvre, un règlement de créanciers et une décennie d'intégration."
 usa_economic_events.342.a: "Racheter le concurrent en faillite"
 usa_economic_events.342.b: "Construire nous-mêmes la capacité"
 usa_economic_events.343.t: "La décision de Lehi"
 usa_economic_events.343.d: "La fab Lehi de Micron dans l'Utah a été construite pour la 3D XPoint, une technologie de mémoire que le marché n'a pas voulue, et la convertir en quelque chose qui se vendrait coûterait plus qu'elle ne vaut. Texas Instruments l'achètera. La garder, c'est trouver un usage à une usine conçue autour d'un produit mort."
 usa_economic_events.343.a: "Vendre la fab de l'Utah"
 usa_economic_events.343.b: "La garder et lui trouver un usage"
 usa_economic_events.344.t: "La restriction chinoise"
 usa_economic_events.344.d: "Pékin a interdit les produits Micron dans les infrastructures chinoises, emportant une part substantielle du chiffre d'affaires. Construire ailleurs et vendre ailleurs coûte des années et de la marge. Contester la décision maintient le marché en jeu et lie le sort de l'entreprise à un gouvernement qui a déjà tranché."
 usa_economic_events.344.a: "Se diversifier hors du marché chinois"
 usa_economic_events.344.b: "Contester la décision et tenir le marché"
 usa_economic_events.345.t: "L'arsenal de la mémoire"
 usa_economic_events.345.d: "Deux décennies de construction à travers les krachs ont tranché ce qu'est Micron, ce qu'est la fabrication américaine de mémoire, et qui peut en être coupé."
 usa_economic_events.345.a: "Un arsenal mémoriel américain"
 usa_economic_events.345.b: "Une fédération mondiale de la mémoire"
 usa_economic_events.345.c: "Un avenir non volatile"
 usa_economic_events.345.e: "La discipline à grande échelle"
 USA_micron_american_memory_arsenal: "Arsenal de la mémoire américaine"
 USA_micron_american_memory_arsenal_desc: "La mémoire est fabriquée dans des fabs américaines pour des clients qu'un gouvernement étranger ne peut atteindre, et la capacité a été achetée les années où tout le monde fermait des usines. Les puces coûtent plus cher et personne d'autre ne décide qui les obtient."
 USA_micron_global_memory_federation: "Fédération mondiale de la mémoire"
 USA_micron_global_memory_federation_desc: "Des fabs dans trois pays sous un seul propriétaire, assemblées à partir de concurrents qui n'ont pas survécu à leurs propres crises. L'échelle est tout l'avantage, et il est considérable."
 USA_micron_nonvolatile_future: "Avenir non volatile"
 USA_micron_nonvolatile_future_desc: "L'entreprise a parié sur la mémoire qui conserve son contenu quand le courant s'en va, et le marché est arrivé là où elle l'attendait. La recherche précède la fabrication plutôt que de la suivre."
 USA_micron_memory_scale_discipline: "Discipline d'échelle"
 USA_micron_memory_scale_discipline_desc: "La capacité n'a jamais été achetée au sommet d'un cycle ni vendue au creux. Micron est plus petite qu'elle n'aurait pu l'être et n'a jamais dû être sauvée."
 usa_economic_events.350.t: "OMAP et l'avenir mobile"
 usa_economic_events.350.d: "Les processeurs d'application pour téléphones mobiles sont le marché à la croissance la plus rapide des semi-conducteurs, et Texas Instruments a une pièce crédible. Y gagner, c'est concourir contre tout le monde. L'alternative est l'activité analogique dont personne n'écrit, où les pièces restent en production trente ans."
 usa_economic_events.350.a: "Concourir pour le marché des processeurs mobiles"
 usa_economic_events.350.b: "Mettre l'argent dans l'analogique"
 usa_economic_events.351.t: "Laboratoires Kilby"
 usa_economic_events.351.d: "Texas Instruments peut donner à un laboratoire le nom de Jack Kilby, sans feuille de route produit ni livrable trimestriel, laissant les ingénieurs travailler sur des problèmes qui paieront dans une décennie ou jamais. Chaque dollar dedans est un dollar non dépensé sur des pièces déjà commandées par des clients."
 usa_economic_events.351.a: "Financer le laboratoire de recherche"
 usa_economic_events.351.b: "Garder les ingénieurs sur les produits livrés"
 usa_economic_events.352.t: "Le portefeuille National Semiconductor"
 usa_economic_events.352.d: "National Semiconductor peut être rachetée intégralement, doublant à peu près le catalogue analogique de Texas Instruments et la force de vente qui le porte. C'est le plus gros chèque que l'entreprise ait jamais signé pour une activité dont les pièces se vendent moins d'un dollar."
 usa_economic_events.352.a: "Acheter le catalogue analogique"
 usa_economic_events.352.b: "Faire grandir le catalogue nous-mêmes"
 usa_economic_events.353.t: "OMAP quitte la guerre des téléphones"
 usa_economic_events.353.d: "OMAP n'est gagnable qu'en dépensant plus que des entreprises qui conçoivent leurs propres puces pour leurs propres téléphones, et Texas Instruments n'entend pas essayer. Partir libère les ingénieurs et les fabs pour l'embarqué et l'automobile. Rester, c'est un nouveau cycle de concourir pour des design wins qui vont à qui casse le plus les prix."
 usa_economic_events.353.a: "Quitter le marché des téléphones"
 usa_economic_events.353.b: "Se battre pour un autre cycle de produit"
 usa_economic_events.354.t: "La conversion de Lehi"
 usa_economic_events.354.d_available: "La fab Lehi de Micron dans l'Utah est à vendre, et son propriétaire n'en a plus l'usage. La convertir à la production analogique de Texas Instruments ajouterait de la capacité des années plus tôt qu'une construction, dans une usine déjà équipée et dotée. La conversion n'est pas simple et elle est bien moins chère que l'alternative."
 usa_economic_events.354.d_greenfield: "Aucune fab existante n'est disponible à des conditions qui valent la peine, donc une nouvelle capacité analogique Texas Instruments signifie poser la première pierre. Construire à partir de rien coûte des années et beaucoup d'argent, et l'usine est exactement ce pour quoi elle a été conçue."
 usa_economic_events.354.a: "Acheter la fab de l'Utah et la convertir"
 usa_economic_events.354.b: "Construire une nouvelle capacité à partir de zéro"
 usa_economic_events.355.t: "Tout est connecté, silencieusement"
 usa_economic_events.355.d: "Un quart de siècle à choisir le métier sans éclat a tranché ce qu'est Texas Instruments et ce qu'est avec elle la fabrication analogique américaine. Les pièces sont partout et presque personne hors du secteur ne sait nommer l'entreprise qui les fabrique."
 usa_economic_events.355.a: "Hégémonie analogique"
 usa_economic_events.355.b: "Un arsenal de silicium"
 usa_economic_events.355.c: "Une fonderie fondatrice"
 usa_economic_events.355.e: "Tout est connecté, tranquillement"
 USA_ti_analog_hegemony: "Hégémonie analogique"
 USA_ti_analog_hegemony_desc: "Le plus grand catalogue analogique du monde, bâti en quittant les métiers pour lesquels tout le monde se battait. Les pièces restent en production des décennies et les clients qui les ont conçues dedans ne les extraient pas facilement."
 USA_ti_silicon_arsenal: "Arsenal de silicium"
 USA_ti_silicon_arsenal_desc: "Des fabs américaines fabriquant les pièces sans éclat dont tout le reste a besoin, détenues en propre plutôt que sous-traitées à l'étranger. Les wafers ne sont pas avancés et il n'y en a pas pénurie."
 USA_ti_foundational_foundry: "Fonderie fondamentale"
 USA_ti_foundational_foundry_desc: "De la capacité achetée et convertie plutôt que construite, ce qui a mis des usines en production des années avant qu'un programme greenfield n'aurait pu. La production est du silicium de nœud mature et le monde tourne dessus."
 USA_ti_everything_connected: "Tout est connecté"
 USA_ti_everything_connected_desc: "Capteurs, convertisseurs et contrôleurs dans chaque machine qui mesure quelque chose, vendus à des dizaines de milliers de clients dont aucun ne compte individuellement. Il n'y a pas un seul contrat dont la perte se ferait sentir."
 usa_economic_events.360.t: "L'achat du conseil"
 usa_economic_events.360.d: "Un grand cabinet d'audit vend son bras conseil, et l'acheter placerait trente mille consultants chez IBM du jour au lendemain. L'entreprise gagnerait plus à conseiller les clients sur ce qu'il faut construire qu'à le construire. Refuser maintient IBM comme un fabricant qui vend aussi des services."
 usa_economic_events.360.a: "Acheter le cabinet et mener par les services"
 usa_economic_events.360.b: "Rester un fabricant qui vend des services"
 usa_economic_events.361.t: "Le patrimoine client"
 usa_economic_events.361.d: "L'activité ordinateur personnel qu'IBM a inventée ne rapporte presque plus rien et concurrence au prix des entreprises qui n'ont pas de recherche à financer. Un acheteur est prêt à la reprendre, avec la marque et les usines. La garder, c'est défendre une commodité contre des firmes nées pour les commodités."
 usa_economic_events.361.a: "Vendre l'activité ordinateurs personnels"
 usa_economic_events.361.b: "Continuer à construire des ordinateurs personnels"
 usa_economic_events.362.t: "Watson entre en scène"
 usa_economic_events.362.d: "Watson d'IBM a battu les meilleurs joueurs humains à Jeopardy à la télévision nationale, et IBM Research veut en faire une activité. Personne ne sait ce que les clients achèteraient ni ce que cela coûterait à construire. L'alternative est de replier le travail dans les produits d'analytique qui se vendent déjà."
 usa_economic_events.362.a: "Construire une activité autour du système"
 usa_economic_events.362.b: "Replier le travail dans l'analytique existante"
 usa_economic_events.363.t: "Le cloud hybride ouvert"
 usa_economic_events.363.d: "IBM ne peut pas surconstruire les hyperscalers et peut posséder la couche qui tourne sur tous. Acheter le plus grand éditeur d'entreprise open source coûterait plus que toute acquisition de l'histoire de l'entreprise. Construire la même position en interne est moins cher et plus lent, et les clients peuvent être partis d'ici là."
 usa_economic_events.363.a: "Acheter l'éditeur open source"
 usa_economic_events.363.b: "Construire nous-mêmes la plateforme cloud"
 usa_economic_events.364.t: "L'empire des services se divise"
 usa_economic_events.364.d: "L'activité d'infrastructure gérée d'IBM est l'essentiel des effectifs et rien de la croissance, et elle concurrence pour le capital tout ce que l'entreprise préférerait financer. La scinder libère les deux moitiés pour être jugées à leurs propres termes. La garder conserve le chiffre d'affaires et les relations clients qui vont avec."
 usa_economic_events.364.a: "Scinder l'activité de services gérés"
 usa_economic_events.364.b: "Garder l'entreprise entière"
 usa_economic_events.365.t: "Le pari quantique"
 usa_economic_events.365.d: "Un quart de siècle à vendre des activités, en acheter d'autres et parier sur des machines que personne n'avait demandées a tranché ce qu'est IBM et sur quoi tourne l'informatique d'entreprise américaine."
 usa_economic_events.365.a: "Un volant hybride ouvert"
 usa_economic_events.365.b: "Un ministère américain des systèmes"
 usa_economic_events.365.c: "La forteresse mainframe"
 usa_economic_events.365.e: "Grand Bleu, intact"
 USA_ibm_open_hybrid_flywheel: "Volant hybride ouvert"
 USA_ibm_open_hybrid_flywheel_desc: "IBM a cessé d'essayer d'être un cloud et est devenu la couche qui tourne sur tous. Le logiciel est ouvert, le conseil le vend, et les clients qui s'y standardisent sont difficiles à déplacer."
 USA_ibm_american_systems_ministry: "Ministère américain des systèmes"
 USA_ibm_american_systems_ministry_desc: "Banques, assureurs et agences fédérales tournent sur des machines et des contrats qu'IBM détient depuis des décennies, et elle a gardé le bras services qui les maintient. La croissance est lente et rien d'autre n'a le droit d'échouer."
 USA_ibm_fortress_z: "Ordinateur central de la forteresse"
 USA_ibm_fortress_z_desc: "Les métiers de commodité sont partis et le mainframe est resté, portant les charges que personne ne risquera de migrer. Chaque transaction qui ne doit pas se perdre passe par une machine qu'une seule entreprise construit encore."
 USA_ibm_big_blue_intact: "Grand Bleu, intact"
 USA_ibm_big_blue_intact_desc: "L'entreprise n'a rien vendu ni rien scindé, et elle fabrique encore le matériel, le logiciel et les gens qui les installent. Elle est plus lente que n'importe lequel de ses rivaux ciblés et n'a jamais dépendu de l'un d'eux."
 usa_economic_events.370.t: "Le volant d'inertie"
 usa_economic_events.370.d: "Apple a chassé son fondateur en 1985 et l'a repris en 1997, à quelques mois de l'insolvabilité ; depuis, il a réduit la gamme à une poignée de machines qui tiennent environ quatre points de marché et se vendent presque entièrement sur les rayons d'autres entreprises. Son prochain geste est le retail : deux magasins ouverts, des baux signés pour des dizaines d'autres. La presse spécialisée est quasi unanime : cela échoue, puisque Gateway ferme ses propres magasins ce printemps et le conseil habituel à un fabricant de niche est de couper le coût retail plutôt que de signer des baux de centres commerciaux au sommet du cycle des loyers. L'argument interne n'est pas de vendre plus de Macintosh ; c'est que posséder la vitrine décide de ce qui pourra être mis en rayon plus tard."
 usa_economic_events.370.a: "Construire le volant magasin et appareil"
 usa_economic_events.370.b: "Garder le Macintosh d'abord"
 usa_economic_events.371.t: "L'iPhone arrive"
 usa_economic_events.371.d: "Apple a construit un téléphone qui est vraiment un ordinateur, et aucun opérateur n'a jamais laissé un fabricant contrôler ce qui y tourne. Un seul partenaire exclusif acceptera ces termes en échange de l'exclusivité. Refuser, c'est lancer sur tous les réseaux à la fois et laisser les opérateurs garder le logiciel."
 usa_economic_events.371.a: "Lancer via un opérateur à nos conditions"
 usa_economic_events.371.b: "Construire une plateforme mobile ouverte"
 usa_economic_events.372.t: "L'App Store s'ouvre"
 usa_economic_events.372.d: "Le logiciel tiers arrivera sur le téléphone d'une manière ou d'une autre. Apple peut être la seule porte, en examinant chaque application et en prenant une part de chaque vente, ou laisser les développeurs atteindre les utilisateurs directement et laisser la réputation de la plateforme hors de ses mains."
 usa_economic_events.372.a: "Être la seule porte"
 usa_economic_events.372.b: "Établir un commun des développeurs"
 usa_economic_events.373.t: "Les services deviennent une stratégie"
 usa_economic_events.373.d: "La vitrine, la musique, le cloud et les paiements rapportent désormais à eux seuls plus que la plupart des entreprises, et rien de cela n'exige d'expédier un nouvel appareil. Appuyer, c'est qu'Apple commence à être valorisée comme une activité d'abonnement. Refuser conserve la discipline qui dit que le matériel est le produit."
 usa_economic_events.373.a: "Construire le volant des services"
 usa_economic_events.373.b: "Restaurer la discipline matérielle"
 usa_economic_events.374.t: "Pomme Silicium"
 usa_economic_events.374.d: "Apple conçoit déjà les processeurs de ses téléphones, et les ordinateurs tournent encore sur ceux de quelqu'un d'autre. Les y faire passer, c'est encore une décennie de transition pour les développeurs et la fin de toute dépendance à la feuille de route d'un fournisseur. Rester en place conserve la compatibilité et laisse le substrat dans d'autres mains."
 usa_economic_events.374.a: "Passer le Mac sur notre propre silicium"
 usa_economic_events.374.b: "Mettre la compatibilité avant le contrôle"
 usa_economic_events.375.t: "Ce que Cupertino a réglé"
 usa_economic_events.375.d: "Un quart de siècle d'Apple décidant quelle part de la pile posséder a tranché ce qu'est l'informatique grand public américaine, qui a le droit de construire dessus, et sur les puces de qui elle tourne."
 usa_economic_events.375.a: "Un État informatique privé"
 usa_economic_events.375.b: "Une république des appareils intégrés"
 usa_economic_events.375.c: "Un réseau de silicium résilient"
 usa_economic_events.375.e: "Une plateforme parmi les plateformes"
 USA_apple_private_computing_state: "État informatique privé"
 USA_apple_private_computing_state_desc: "Les puces, le système d'exploitation, la vitrine et les serveurs qui y répondent appartiennent tous à une seule entreprise. Rien n'entre sans permission et rien ne sort sans être remarqué. C'est la plateforme grand public la plus privée du monde et la moins responsable."
 USA_apple_integrated_device_republic: "République des appareils intégrés"
 USA_apple_integrated_device_republic_desc: "Apple décide de l'expérience et achète le silicium qui la livre. L'intégration est réelle partout sauf à la couche du dessous, où quelqu'un d'autre fixe la feuille de route."
 USA_apple_resilient_silicon_network: "Réseau de silicium résilient"
 USA_apple_resilient_silicon_network_desc: "Les processeurs sont conçus en Californie et la plateforme au-dessus a été ouverte à quiconque voulait construire dessus. Apple a cédé le péage et gardé les fondations."
 USA_apple_platform_among_platforms: "Une plateforme parmi les plateformes"
 USA_apple_platform_among_platforms_desc: "Le logiciel est ouvert, les puces sont achetées, et Apple concurrence sur le fait que le produit soit meilleur plutôt que sur l'absence d'alternative. Il y en a généralement une."
 usa_economic_events.380.t: "Capital sans contrôle"
 usa_economic_events.380.d: "Google entre en Bourse, et Larry Page et Sergueï Brin veulent deux classes d'actions, l'une portant dix voix contre une, pour qu'une minorité du capital décide encore de ce que fait l'entreprise. Les conseillers en gouvernance sont unanimes : c'est précisément ainsi que les conseils cessent d'être responsables, et la lettre des fondateurs aux actionnaires leur répond en nommant les familles de journaux qui ont utilisé la même structure pour financer un travail que personne n'aurait approuvé au trimestre. Vendre par enchère hollandaise plutôt que par les banques aggrave l'offense. Le prix en sera plus bas, et la décennie suivante sera à eux de dépenser."
 usa_economic_events.380.a: "Prendre l'argent et garder le contrôle"
 usa_economic_events.380.b: "Accepter la gouvernance conventionnelle"
 usa_economic_events.381.t: "Acheter le jet d'eau"
 usa_economic_events.381.d: "YouTube n'a pas deux ans, sert plus d'images que quiconque n'en a jamais hébergé, n'a aucun chiffre d'affaires, et est poursuivi de toutes parts. Le prix demandé est 1,65 milliard de dollars en actions Google, que les analystes du secteur appellent un chiffre de bulle pour un public dont personne n'a montré qu'il paierait quoi que ce soit, et ils notent que le risque de droit d'auteur seul pourrait dépasser l'achat. Google Video existe déjà et perd. Construire le remplaçant en interne est moins cher et plus lent, et cède l'audience le temps qu'il faudra."
 usa_economic_events.381.a: "Acheter le jet d'eau"
 usa_economic_events.381.b: "Le construire nous-mêmes et prendre le temps"
 usa_economic_events.382.t: "DeepMind et la frontière"
 usa_economic_events.382.d: "DeepMind, une société de recherche londonienne sous Demis Hassabis, a appris à des machines à jouer à des jeux que personne ne leur a programmés. Elle n'a ni produit ni chiffre d'affaires, le prix dont Google discute revient à plusieurs millions de dollars par chercheur, et la lecture sobre est que c'est un tour de recrutement déguisé en acquisition. Les vendeurs attachent des conditions : un conseil d'éthique, et pas de travail militaire ni de surveillance. Courir vers la frontière, c'est payer cela et dépenser encore des années sur la capacité sans rien à vendre. Étaler le déploiement derrière la gouvernance que DeepMind demande est moins cher, et cède l'avance à qui ne l'acceptera pas."
 usa_economic_events.382.a: "Courir vers la frontière"
 usa_economic_events.382.b: "Déploiement échelonné derrière la gouvernance"
 usa_economic_events.383.t: "Le contrat de défense"
 usa_economic_events.383.d: "Le Pentagone veut de la vision par ordinateur pour les images de drones au titre du projet Maven, et des milliers d'ingénieurs Google ont signé une lettre refusant de le construire. Un ensemble de principes d'IA est en cours de rédaction pour faire de ce refus une politique permanente plutôt qu'une concession. Le contrat Maven lui-même est petit. Derrière, il y a JEDI, le marché cloud de dix milliards de dollars pour tout le département, et chaque analyste défense couvrant cette offre dit qu'une firme qui ne fera pas le travail de vision ne sera pas non plus confiée l'infrastructure classifiée. Refuser cède les deux aux concurrents encore en lice."
 usa_economic_events.383.a: "Prendre le contrat"
 usa_economic_events.383.b: "Tenir la ligne que le personnel a tirée"
 usa_economic_events.384.t: "La pile de calcul souveraine"
 usa_economic_events.384.d: "Les accélérateurs Nvidia sont la contrainte saturante de chaque entraînement du secteur, l'allocation est rationnée par les relations, et la valorisation de l'entreprise a dépassé le billion de dollars en mai grâce à cela. Le conseil standard est que Google achète quand même : CUDA, le logiciel contre lequel tout le champ est écrit, est à Nvidia, et du silicium custom signifie porter la pile et maintenir le compilateur pour toujours. Concevoir nos propres accélérateurs à l'échelle dont la frontière a maintenant besoin coûte des années et des milliards avant qu'une pièce utile n'existe. Acheter garde l'argent et la dépendance."
 usa_economic_events.384.a: "Concevoir nos propres accélérateurs"
 usa_economic_events.384.b: "Acheter auprès de fournisseurs externes"
 usa_economic_events.385.t: "Qui possède la frontière"
 usa_economic_events.385.d: "Un quart de siècle de Google décidant quoi poursuivre et quoi posséder a tranché la question. Que la recherche de frontière ait été faite en interne ou achetée, et que les machines sur lesquelles elle tourne soient le silicium de Google ou louées à Nvidia, c'est désormais toute la réponse à où l'intelligence artificielle américaine se construit et qui a le droit de dire non."
 usa_economic_events.385.a: "Une puissance de calcul de pointe"
 usa_economic_events.385.b: "Un locataire frontalier"
 usa_economic_events.385.c: "Une pile gouvernée"
 usa_economic_events.385.e: "Une plateforme prudente"
 USA_google_frontier_compute_power: "Puissance de calcul de pointe"
 USA_google_frontier_compute_power_desc: "Les modèles s'entraînent à la limite de ce que quiconque peut faire, sur des accélérateurs conçus dans les mêmes bâtiments. Personne d'autre ne fixe le prix du calcul et personne d'autre ne décide quand il est disponible."
 USA_google_frontier_tenant: "Locataire frontière"
 USA_google_frontier_tenant_desc: "La recherche est de classe mondiale et les machines sur lesquelles elle tourne appartiennent à quelqu'un d'autre. Chaque gain de capacité est réel et chacun est loué."
 USA_google_governed_stack: "La pile gouvernée"
 USA_google_governed_stack_desc: "Le silicium est détenu et les déploiements sont lents, revus et défendables. Elle ne sera jamais la première à une capacité et n'a jamais dû en retirer une."
 USA_google_cautious_platform: "La plateforme prudente"
 USA_google_cautious_platform_desc: "Ni la frontière ni la fonderie. Les produits sont soigneux, le calcul est acheté, et l'entreprise concurrence sur la distribution plutôt que sur ce qu'elle peut construire que d'autres ne peuvent pas."
 usa_economic_events.390.t: "Pour qui est Motorola"
 usa_economic_events.390.d: "Iridium, la venture de téléphone satellite de Motorola, s'est effondrée en faillite et a emporté une grande part de la réputation de l'entreprise. Ce qui survit, c'est une activité radio que polices, pompiers et armées achètent et n'arrêtent jamais d'acheter, et une activité de téléphones grand public qui doit reconquérir chaque client chaque année. Une seule peut être la priorité de Motorola."
 usa_economic_events.390.a: "Construire autour de la radio de sécurité publique"
 usa_economic_events.390.b: "Courir après le marché grand public"
 usa_economic_events.391.t: "Scinder le silicium"
 usa_economic_events.391.d: "Motorola fabrique ses propres puces depuis avant que la plupart de ses concurrents n'existent, et l'activité de fabrication consomme maintenant le capital que le côté téléphones veut. La scinder lève de l'argent et libère les deux moitiés. La garder, c'est payer des fabs sur une activité grand public qui pourrait ne pas pouvoir se les offrir."
 usa_economic_events.391.a: "Scinder le groupe semi-conducteurs"
 usa_economic_events.391.b: "Garder les fabs dans la famille"
 usa_economic_events.392.t: "L'écran de verre"
 usa_economic_events.392.d: "Une entreprise informatique a expédié un téléphone sans clavier et le marché a décidé qu'il le préférait. Motorola peut adopter le système d'exploitation qu'une entreprise de recherche donne, rapide, gratuit et appartenant à quelqu'un d'autre, ou dépenser des années et une fortune à construire une plateforme qu'elle contrôle."
 usa_economic_events.392.a: "Adopter la plateforme gratuite"
 usa_economic_events.392.b: "Financer une plateforme que nous contrôlons"
 usa_economic_events.393.t: "Diviser le nom"
 usa_economic_events.393.d: "L'activité radio de Motorola et son activité téléphones partagent une marque, un bilan, et presque rien d'autre. Les scinder en Motorola Solutions et Motorola Mobility laisse chacune être jugée à ses propres termes, et laisse la plus faible échouer sans emporter l'autre. Les garder ensemble préserve l'échelle et le nom sur lesquels les deux commercent encore."
 usa_economic_events.393.a: "Séparer Solutions de Mobility"
 usa_economic_events.393.b: "Gardez Motorola intact"
 usa_economic_events.394.t: "L'entreprise de brevets"
 usa_economic_events.394.d: "Google veut Motorola Mobility, et ce qu'il achète vraiment, c'est un classeur : quelque dix-sept mille brevets qui lui permettraient de défendre Android contre tous ceux qui le poursuivent maintenant. Douze milliards et demi de dollars est un prix généreux pour un fabricant de téléphones qui n'a pas gagné depuis des années. Le refuser, c'est trouver l'argent pour garder cette activité nous-mêmes."
 usa_economic_events.394.a: "Autoriser la vente"
 usa_economic_events.394.b: "Garder Mobility sous propriété américaine"
 usa_economic_events.395.t: "Ce que Schaumburg a gardé"
 usa_economic_events.395.d: "Un quart de siècle à décider quelle moitié de Motorola comptait a tranché ce que l'Amérique fabrique encore dans les communications, et qui répond quand les radios doivent fonctionner."
 usa_economic_events.395.a: "Un géant des communications intégrées"
 usa_economic_events.395.b: "Silicium et sécurité"
 usa_economic_events.395.c: "Une marque de combinés orpheline"
 usa_economic_events.395.e: "Le service public de sécurité"
 USA_motorola_integrated_communications_giant: "Géant des communications intégrées"
 USA_motorola_integrated_communications_giant_desc: "Les fabs, les radios et les téléphones sont restés sous un même toit, ce qu'aucune entreprise américaine de communications n'a réussi dans la réalité. Elle est plus lente que n'importe lequel de ses rivaux ciblés et ne dépend d'aucun d'eux."
 USA_motorola_silicon_and_safety: "Silicium et sécurité"
 USA_motorola_silicon_and_safety_desc: "L'activité grand public est partie et les parties difficiles sont restées : des puces faites au pays et des réseaux chiffrés sans lesquels les services d'urgence ne peuvent pas opérer. Personne n'achète ni l'un ni l'autre par choix, et tout le monde les achète."
 USA_motorola_orphaned_handset_brand: "Marque de combiné orphelin"
 USA_motorola_orphaned_handset_brand_desc: "Les fabs ont été vendues et les téléphones gardés, ce qui a laissé un concepteur de matériel grand public achetant son silicium aux mêmes fournisseurs que tout le monde. Le nom signifie encore quelque chose pour ceux qui s'en souviennent."
 USA_motorola_public_safety_utility: "Service public de sécurité"
 USA_motorola_public_safety_utility_desc: "Tout ce qui concurrençait au prix est parti et ce qui reste, c'est la radio à l'épaule d'un pompier et le réseau derrière. Cela croît lentement, on n'en parle presque jamais, et aucune agence américaine ne peut fonctionner sans."
 usa_economic_events.400.t: "La phase des recours"
 usa_economic_events.400.d: "Un tribunal fédéral a jugé Microsoft en violation du droit antitrust et ordonné de scinder les activités système d'exploitation et applications. Washington peut pousser le recours structurel en appel, ou transiger sur des règles de conduite et laisser l'entreprise entière. Un dénouement clôt l'affaire ; l'autre refaçonne le logiciel américain."
 usa_economic_events.400.a: "Se contenter de mesures de conduite"
 usa_economic_events.400.b: "Pousser le démantèlement en appel"
 usa_economic_events.401.t: "Quarante-quatre milliards pour la recherche"
 usa_economic_events.401.d: "Microsoft a offert quarante-quatre milliards de dollars pour une entreprise de recherche, parce que la recherche est là où est allé l'argent de la publicité et qu'elle n'en a pas. Le prix est extraordinaire pour une activité en déclin. Laisser l'offre s'effondrer, c'est céder le marché et en trouver un autre ailleurs."
 usa_economic_events.401.a: "Laisser l'offre s'effondrer"
 usa_economic_events.401.b: "Acheter le challenger"
 usa_economic_events.402.t: "Azure atteint la disponibilité générale"
 usa_economic_events.402.d: "Azure est désormais un vrai produit, et chaque dollar que Microsoft dépense pour le faire réussir est un dollar qui argumente que les clients devraient cesser d'acheter les licences Windows et Office qui ont bâti l'entreprise. S'engager, c'est cannibaliser la franchise exprès. Défendre le bureau conserve les marges et laisse quelqu'un d'autre posséder la décennie."
 usa_economic_events.402.a: "S'engager dans le cloud"
 usa_economic_events.402.b: "Défendre la franchise bureau"
 usa_economic_events.403.t: "Ouvrir la pile"
 usa_economic_events.403.d: "Le nouveau directeur général veut que Microsoft livre du logiciel pour des systèmes d'exploitation qu'elle a passé vingt ans à tenter de détruire, et qu'elle achète l'endroit où ses critiques gardent leur code. Cela coûterait à l'entreprise l'argument qu'elle tient depuis le début. Refuser conserve la doctrine et les clients qui sont déjà partis."
 usa_economic_events.403.a: "Ouvrir la pile"
 usa_economic_events.403.b: "Tenir la ligne propriétaire"
 usa_economic_events.404.t: "Le pari OpenAI"
 usa_economic_events.404.d: "Un laboratoire de recherche sans chiffre d'affaires veut des milliards et l'usage exclusif des datacenters de Microsoft, et en échange Microsoft obtient le premier accès à ce qu'il construit. C'est le plus gros pari sur les gens de quelqu'un d'autre que l'entreprise ait jamais fait. Construire la même capacité en interne est plus lent, moins cher, et entièrement à nous."
 usa_economic_events.404.a: "Parier sur le laboratoire"
 usa_economic_events.404.b: "Construire les modèles en interne"
 usa_economic_events.405.t: "Ce que Redmond a réglé"
 usa_economic_events.405.d: "Un quart de siècle de Microsoft décidant quoi posséder et quoi louer a tranché où tourne l'informatique d'entreprise américaine, qui a entraîné les modèles dessus, et depuis les datacenters de qui ils répondent."
 usa_economic_events.405.a: "Un hyperscaler partenaire"
 usa_economic_events.405.b: "Une pile de modèles intégrée"
 usa_economic_events.405.c: "Renseignement sous licence"
 usa_economic_events.405.e: "Le bureau souverain"
 USA_microsoft_partnered_hyperscaler: "Hyperscaler en partenariat"
 USA_microsoft_partnered_hyperscaler_desc: "Les datacenters sont à Microsoft et le laboratoire qui les remplit ne l'est pas. Elle a le premier accès à la frontière et aucun dernier mot dessus, ce qui est un avantage énorme et une dépendance que personne n'a chiffrée."
 USA_microsoft_integrated_model_stack: "Pile de modèles intégrée"
 USA_microsoft_integrated_model_stack_desc: "Le calcul et les modèles ont tous deux été construits en interne, ce qui a pris plus longtemps et ne répond à personne. Chaque couche depuis la location de silicium est sous un même toit et un même conseil."
 USA_microsoft_licensed_intelligence: "Renseignement sous licence"
 USA_microsoft_licensed_intelligence_desc: "Les modèles venaient d'un partenaire et les machines sur lesquelles ils tournent d'un concurrent. Microsoft vend l'intelligence sans posséder ni l'une ni l'autre moitié de ce qui la fait, ce qui fonctionne exactement aussi longtemps que les termes tiennent."
 USA_microsoft_sovereign_desktop: "Le bureau souverain"
 USA_microsoft_sovereign_desktop_desc: "La franchise a été défendue et la frontière laissée aux autres. Ce qui tourne sur des centaines de millions de machines est encore à Microsoft, encore sous licence, et n'est plus là où se fait le travail intéressant."
 usa_economic_events.410.t: "L'argument des mégahertz"
 usa_economic_events.410.d: "Le Pentium 4 d'Intel est bâti pour faire grimper un chiffre : le pipeline NetBurst achète de la marge d'horloge en faisant moins de travail par cycle, si bien qu'à fréquence égale il peut perdre face au Pentium III qu'il a remplacé, et l'Athlon d'AMD prend des bancs d'essai qu'il devrait gagner. Rien de cela n'importe sur un rayon où le chiffre de mégahertz est tout l'argument de vente, et le consensus du secteur est qu'Intel devrait faire monter le nombre aussi longtemps que le process le permet. La dissidence vient de l'équipe de conception d'Intel à Haïfa, travaillant sur un cœur basse consommation qui céderait d'emblée la guerre marketing et gagnerait les machines que les gens portent vraiment."
 usa_economic_events.410.a: "Suivre la courbe de fréquence"
 usa_economic_events.410.b: "Concevoir pour la performance par watt"
 usa_economic_events.411.t: "Centrino devient une plateforme"
 usa_economic_events.411.d: "Le processeur mobile se vend mieux groupé avec le chipset et le silicium sans fil d'Intel que seul. Vendre le bundle comme une plateforme verrouille les fabricants d'ordinateurs portables et en verrouille les rivaux de composants. Vendre les pièces séparément maintient le marché ouvert et les marges plus minces."
 usa_economic_events.411.a: "Vendre la plateforme intégrée"
 usa_economic_events.411.b: "Garder le marché des composants ouvert"
 usa_economic_events.412.t: "Les termes de la Commission"
 usa_economic_events.412.d: "Les régulateurs fédéraux ont passé des années sur les rapports d'Intel avec les fabricants qui achètent ses processeurs et les rivaux qui concourent pour les sockets. Un règlement clôt l'enquête sur des règles de conduite convenues. Publier les interfaces techniques concède plus que les régulateurs n'ont demandé et prévient la plainte suivante."
 usa_economic_events.412.a: "S'accorder sur des règles de conduite"
 usa_economic_events.412.b: "Publier les interfaces techniques"
 usa_economic_events.413.t: "Le process glisse encore"
 usa_economic_events.413.d: "Le prochain nœud de fabrication d'Intel a des années de retard, pas des trimestres, et AMD livre des pièces fabriquées par TSMC à Taïwan sur un process qu'Intel ne peut égaler. Sauver le process en interne coûte une somme énorme sans garantie de succès. Acheter de la capacité à la fonderie qui nous a dépassés admet que l'avance de fabrication est partie et maintient les produits compétitifs."
 usa_economic_events.413.a: "Financer le sauvetage du process"
 usa_economic_events.413.b: "Acheter le leading edge à l'extérieur"
 usa_economic_events.414.t: "Produire pour les autres"
 usa_economic_events.414.d: "Le nouveau directeur général veut qu'Intel construise des puces pour les entreprises avec lesquelles elle concurrence, ce qui signifie faire tourner les fabs comme une activité qui répond à des clients extérieurs. C'est le plus gros engagement de capital de l'histoire de l'entreprise et cela subordonne la feuille de route produits à l'usine. Mettre les produits d'abord garde les fabs captives et la stratégie familière."
 usa_economic_events.414.a: "Ouvrir les fabs aux clients extérieurs"
 usa_economic_events.414.b: "Garder les fabs captives des produits"
 usa_economic_events.415.t: "Un actionnaire public"
 usa_economic_events.415.d: "Washington est prêt à convertir son soutien aux semi-conducteurs en actions, ce qui ferait du gouvernement fédéral l'un des plus grands actionnaires d'Intel. Accepter fait de l'entreprise un actif industriel national et rend son conseil responsable devant plus que le marché. Refuser garde la propriété privée et la subvention conditionnelle."
 usa_economic_events.415.a: "Accepter la participation fédérale"
 usa_economic_events.415.b: "Refuser la propriété publique"
 usa_economic_events.416.t: "Ce qu'Intel est devenu"
 usa_economic_events.416.d: "Un quart de siècle de fréquences d'horloge, de plateformes, de nœuds manqués et d'argent public a tranché si Intel fabrique encore du silicium leading-edge en Amérique, et qui possède l'entreprise qui le fait."
 usa_economic_events.416.a: "Une maison d'architecture sans fabs"
 usa_economic_events.416.b: "Un arsenal national du silicium"
 usa_economic_events.416.c: "Une fonderie informatique intégrée"
 usa_economic_events.416.e: "Une fonderie de systèmes ouverts"
 USA_intel_domestic_silicon_arsenal: "Arsenal national de silicium"
 USA_intel_domestic_silicon_arsenal_desc: "Le leading edge est fabriqué sur le sol américain et le public détient une participation dans l'entreprise qui le fait. La capacité est un actif stratégique avant d'être commercial, et elle est tarifée en conséquence."
 USA_intel_integrated_compute_foundry: "Fonderie de calcul intégrée"
 USA_intel_integrated_compute_foundry_desc: "Les fabs construisent pour des clients extérieurs autant que pour Intel, si bien que l'usine gagne sa vie plutôt que d'attendre une feuille de route. Concevoir et fabriquer sous un même toit paie à nouveau une fois le toit ouvert."
 USA_intel_open_systems_foundry: "Fonderie de systèmes ouverts"
 USA_intel_open_systems_foundry_desc: "Des interfaces publiées et des nœuds ouverts ont fait de la plateforme quelque chose sur quoi d'autres pouvaient construire plutôt que quelque chose qu'ils devaient licencier. Les marges sont plus minces et l'écosystème bien plus large."
 USA_intel_fabless_architecture_house: "Maison d'architecture sans fable"
 USA_intel_fabless_architecture_house_desc: "Les conceptions sont encore à Intel et les wafers à quelqu'un d'autre. Libérée du fardeau de capital, l'entreprise concurrence sur l'architecture seule, et dépend d'une fonderie qu'elle ne contrôle pas."
 usa_economic_events.440.a: "Construire Foundry autour d’une utilisation responsable des données"
 usa_economic_events.440.b: "Adapter Foundry aux missions publiques"
 usa_economic_events.440.c: "Développez Foundry dans tous les secteurs commerciaux"
 usa_economic_events.440.d: "Credit Suisse a commencé à utiliser Foundry en 2013 pour analyser la conformité et le risque de marché, tandis que First Data a utilisé les logiciels Palantir dans sa transformation technologique. Les institutions commerciales deviennent un marché distinct pour le modèle d'exploitation des données de Palantir."
 usa_economic_events.440.d_option: "Préserver l'indépendance des achats clients"
 usa_economic_events.440.t: "Une fonderie entre dans l'industrie"
 usa_economic_events.441.a: "Exiger une acquisition de logiciels responsable"
 usa_economic_events.441.b: "Approfondir l'intégration gouvernementale après l'arrêt"
 usa_economic_events.441.c: "Transformer la victoire en expansion commerciale"
 usa_economic_events.441.d: "Le Federal Circuit a confirmé que l'Armée n'avait pas mené de recherche de marché adéquate sur les alternatives commerciales avant de poursuivre un développement sur mesure pour DCGS-A2. La victoire de Palantir renforce l'argument d'acheter des logiciels éprouvés tout en gardant en vue la concurrence et la dépendance aux fournisseurs."
 usa_economic_events.441.d_option: "Défendre la concurrence pour les logiciels commerciaux"
 usa_economic_events.441.t: "Les logiciels commerciaux prédominent"
 usa_economic_events.442.a: "Coupler l'introduction en Bourse à un contrôle du déploiement"
 usa_economic_events.442.b: "Utiliser l'introduction pour étendre le travail gouvernemental"
 usa_economic_events.442.c: "Coter Palantir pour l'expansion commerciale"
 usa_economic_events.442.d: "Les actions de classe A de Palantir ont commencé à coter à la Bourse de New York par introduction directe. La liquidité et le regard des marchés publics arrivent alors que l'entreprise équilibre missions gouvernementales et croissance commerciale."
 usa_economic_events.442.d_option: "Garder les relations d'approvisionnement indépendantes"
 usa_economic_events.442.t: "L'introduction directe"
 usa_economic_events.443.a: "Soumettre Tiberius à la responsabilité publique"
 usa_economic_events.443.b: "Intégrer Tiberius à la distribution fédérale"
 usa_economic_events.443.c: "Commercialiser la plateforme logistique"
 usa_economic_events.443.d: "Tiberius de Palantir intègre des données vaccinales publiques et privées pour les planificateurs fédéraux et d'État, offrant une visibilité de l'allocation à la livraison et à l'administration. Un tableau opérationnel commun peut coordonner la distribution à l'échelle nationale tout en intégrant contrôles d'accès et supervision publique au dessin opérationnel."
 usa_economic_events.443.d_option: "Préserver l'indépendance des achats juridictionnels"
 usa_economic_events.443.t: "Distribution des coordonnées de Tibère"
 usa_economic_events.444.a: "Gouverner le tissu de données en toute transparence"
 usa_economic_events.444.b: "Déployer Gotham comme tissu de données de l'Armée"
 usa_economic_events.444.c: "Adapter le tissu aux clients commerciaux"
 usa_economic_events.444.d: "L'Armée a choisi Palantir pour livrer un tissu de données de renseignement fédéré à l'échelle mondiale et une fondation d'analytique sur plusieurs classifications de sécurité. Gotham soutiendra les essais et le déploiement alors que le Capability Drop 2 avance vers l'usage opérationnel."
 usa_economic_events.444.d_option: "Garder l'architecture neutre vis-à-vis des marchés"
 usa_economic_events.444.t: "Le tissu de données de l'Armée"
 usa_economic_events.445.a: "Soumettre le prototype à des essais responsables"
 usa_economic_events.445.b: "Intégrer TITAN au ciblage de l'Armée"
 usa_economic_events.445.c: "Commercialiser la plateforme de fusion de capteurs"
 usa_economic_events.445.d: "L'Armée a attribué à Palantir et Raytheon des tâches à prix fixe distinctes de 36 millions de dollars pour construire des prototypes TITAN Advanced. Les systèmes concurrents intégreront les données de capteurs et seront testés avec le retour des soldats avant qu'un fournisseur ne soit choisi."
 usa_economic_events.445.d_option: "Préserver la concurrence grâce au prototypage"
 usa_economic_events.445.t: "Prix ​​du prototype TITAN"
 usa_economic_events.446.a: "Rendre le déploiement AIP responsable"
 usa_economic_events.446.b: "Intégrer AIP aux opérations gouvernementales"
 usa_economic_events.446.c: "Faites évoluer l’AIP parmi les entreprises clientes"
 usa_economic_events.446.d: "Palantir introduit AIP au sein de Foundry, combinant grands modèles de langage, données opérationnelles, contrôles d'accès et flux d'entreprise. L'accès anticipé amène l'IA dans les décisions des clients tandis que sécurité et gouvernance deviennent partie du déploiement."
 usa_economic_events.446.d_option: "Protéger le choix des clients lors des déploiements"
 usa_economic_events.446.t: "AIP atteint les entreprises"
 usa_economic_events.447.a: "Lier la plateforme NHS à des garanties publiques"
 usa_economic_events.447.b: "Intégrer la plateforme à l'ensemble des opérations du NHS"
 usa_economic_events.447.c: "Étendre le logiciel de santé commercial grâce au marché"
 usa_economic_events.447.d: "NHS England a attribué à un groupe mené par Palantir un contrat de sept ans pour fournir la Federated Data Platform après un appel d'offres ouvert et concurrentiel. La plateforme reliera les données existantes pour la coordination des soins, la gestion des listes d'attente et la planification des ressources, sous des attentes accrues de confidentialité et de responsabilité."
 usa_economic_events.447.d_option: "Préserver l'indépendance des achats du NHS"
 usa_economic_events.447.t: "Plateforme de données fédérées du NHS"
 usa_economic_events.448.a: "Imposer des garde-fous responsables à TITAN"
 usa_economic_events.448.b: "Mener TITAN comme maître d'œuvre de l'Armée"
 usa_economic_events.448.c: "Adapter commercialement le modèle de plateforme de TITAN"
 usa_economic_events.448.d: "L'Armée a choisi Palantir après un prototypage concurrentiel et attribué un accord de phase 3 de 178,4 millions de dollars pour dix prototypes TITAN. En tant que fournisseur préféré et maître d'œuvre, l'entreprise intégrera des variantes avancées et de base pour traiter les données de capteurs multi-domaines."
 usa_economic_events.448.d_option: "Garder l'écosystème de prototypes concurrentiel"
 usa_economic_events.448.t: "Contrat principal TITAN"
 usa_economic_events.449.a: "Gouverner le déploiement de Maven de manière transparente"
 usa_economic_events.449.b: "Étendre Maven aux opérations de défense"
 usa_economic_events.449.c: "Transformer l'intégration Maven en échelle commerciale"
 usa_economic_events.449.d: "L'Armée a attribué à Palantir un contrat à prix fixe de 480 millions de dollars pour le prototype Maven Smart System, étendant le logiciel de mission au renseignement et aux opérations assistés par l'IA. L'échelle approfondit le rôle de Palantir dans la défense et la dépendance du gouvernement à une plateforme intégrée."
 usa_economic_events.449.d_option: "Préserver la concurrence autour des logiciels de mission"
 usa_economic_events.449.t: "Le projet Maven s'agrandit"
 usa_economic_events.450.a: "Devenir le système d'exploitation de la défense"
 usa_economic_events.450.b: "Mettre en place une plateforme d'exploitation à double usage"
 usa_economic_events.450.c: "Construire une infrastructure de données publiques responsable"
 usa_economic_events.450.d: "L'accord d'entreprise de l'Armée consolide soixante-quinze contrats en un cadre pour les produits commerciaux de Palantir, avec une période de performance allant jusqu'à dix ans et un plafond de 10 milliards de dollars. La structure promet des rabais de volume et un accès plus rapide tout en rendant décisive la posture de Palantir sur les marchés défense, civil et commercial."
 usa_economic_events.450.d_option: "Se concentrer sur la plateforme d'IA commerciale"
 usa_economic_events.450.t: "Accord d'entreprise de l'armée"
 usa_economic_events.460.t: "AIG au bord du gouffre"
 usa_economic_events.460.d: "Les trois agences de notation ont dégradé AIG ce matin et les appels de collatéral qui ont suivi ont laissé l'assureur à quelques heures de la faillite. Ce n'est pas une banque, ce n'est pas résolvable, et elle est de l'autre côté de contrats dérivés détenus par la moitié du système financier."
 usa_economic_events.460.a: "Autoriser l'assistance d'urgence"
 usa_economic_events.460.b: "Rechercher un consortium privé"
 usa_economic_events.460.c: "Laissons tomber AIG"
 usa_economic_events.462.t: "Le sauvetage fédéral"
 usa_economic_events.462.d: "La Federal Reserve Bank of New York prêtera contre les actifs d'AIG à des conditions punitives. Ce que Washington demande en retour décide si c'est un prêt à une entreprise privée ou une nationalisation que personne n'appellera ainsi."
 usa_economic_events.462.a: "Prendre la participation en actions"
 usa_economic_events.462.b: "Prêter uniquement à des conditions punitives"
 usa_economic_events.463.t: "Faillite désordonnée"
 usa_economic_events.463.d: "AIG a déposé le bilan. Ses filiales d'assurance sont saisies par les régulateurs d'État, ses contreparties de prêt de titres appellent tout à la fois, et les fonds monétaires qui détenaient son papier cassent le dollar."
 usa_economic_events.463.a: "Contenir la contagion"
 usa_economic_events.463.b: "Laisser le marché se liquider"
 usa_economic_events.464.t: "Les liquidités continuent de s’écouler"
 usa_economic_events.464.d: "Le sauvetage a acheté du temps et rien d'autre. Le livre de prêt de titres est le vrai trou : le collatéral en cash a été réinvesti dans du papier hypothécaire que personne ne pricera, et les contreparties veulent le cash maintenant."
 usa_economic_events.464.a: "Retracer le livre de prêt de titres"
 usa_economic_events.465.t: "La facilité d'emprunt de titres"
 usa_economic_events.465.d: "La Fed de New York peut emprunter des titres investment-grade aux filiales d'assurance d'AIG et rendre du collatéral en cash. Cela arrête la ruée immédiate sans traiter pourquoi elle a commencé."
 usa_economic_events.465.a: "Ouvrir la facilité de titres"
 usa_economic_events.465.b: "Refuser de prêter davantage"
 usa_economic_events.466.t: "Restructurer le paquet de soutien"
 usa_economic_events.466.d: "Les termes d'origine punissent une entreprise que le gouvernement possède désormais, et les intérêts consomment la facilité plus vite que l'activité ne peut la rembourser. Le Trésor peut injecter du capital et laisser la Fed couper le spread et allonger la durée."
 usa_economic_events.466.a: "Restructurer le paquet"
 usa_economic_events.466.b: "Maintenir les termes d'origine"
 usa_economic_events.467.t: "Voie de la jeune fille III"
 usa_economic_events.467.d: "Un véhicule ad hoc peut acheter les obligations collatéralisées sous les credit-default swaps d'AIG et déchirer les contrats, mettant fin pour de bon à la spirale de collatéral. Le prix que nous payons pour ce papier est toute la question."
 usa_economic_events.467.a: "Payer au marché et mettre fin aux swaps"
 usa_economic_events.467.b: "Exiger des concessions"
 usa_economic_events.468.t: "Les négociations avec les contreparties"
 usa_economic_events.468.d: "Les contreparties ont été priées d'accepter une décote volontaire sur des contrats qu'elles ont légalement le droit d'être payées au pair. L'une a signalé une volonté conditionnelle ; les autres ont fait remarquer que nous ne pouvons pas les y forcer."
 usa_economic_events.468.a: "Accepter le repli au pair"
 usa_economic_events.468.b: "Comptabiliser les concessions partielles"
 usa_economic_events.469.t: "Voie de la jeune fille II"
 usa_economic_events.469.d: "Un second véhicule peut acheter les titres hypothécaires résidentiels hors du portefeuille de prêt de titres et fermer le programme pour de bon. Il remplace aussi la facilité d'octobre par quelque chose qu'il faudra gérer des années."
 usa_economic_events.469.a: "Transférer le portefeuille RMBS"
 usa_economic_events.469.b: "Dénouer le programme sur place"
 usa_economic_events.470.t: "Qui a été payé"
 usa_economic_events.470.d: "Le Congrès veut les noms des institutions que le sauvetage d'AIG a réellement protégées, et environ la moitié sont des banques étrangères. La position de la Fed de New York est que la divulgation nuit aux contreparties et aux véhicules que nous détenons encore."
 usa_economic_events.470.a: "Divulguer les contreparties"
 usa_economic_events.470.b: "Retarder la divulgation"
 usa_economic_events.471.t: "Bonus de rétention"
 usa_economic_events.471.d: "AIG Financial Products, la division qui a écrit les swaps, est contractuellement tenue de verser cent soixante-cinq millions de dollars de bonus de rétention. Les contrats sont antérieurs au sauvetage et l'entreprise que nous possédons désormais est celle qui y est liée."
 usa_economic_events.471.a: "Honorer les contrats"
 usa_economic_events.471.b: "Récupérer ce que nous pouvons"
 usa_economic_events.472.t: "Restructuration et cessions d'actifs"
 usa_economic_events.472.d: "AIG est découpée en morceaux cessibles : l'activité vie asiatique, le bailleur d'avions, le bras de crédit à la consommation. La vitesse de cession détermine ce que le contribuable récupère."
 usa_economic_events.472.a: "Vendre des actifs méthodiquement"
 usa_economic_events.472.b: "Sortez le plus vite possible"
 usa_economic_events.473.t: "La Fed sort d'AIG"
 usa_economic_events.473.d: "L'aide de la Fed de New York peut être remboursée intégralement et la facilité renouvelable résiliée, laissant le Trésor détenir des actions ordinaires qu'il peut vendre sur le marché. Les véhicules Maiden Lane tournent au-dessus de leur valeur comptable."
 usa_economic_events.473.a: "Accepter le remboursement intégral"
 usa_economic_events.473.b: "Prolonger encore la facilité"
 usa_economic_events.474.t: "Désinvestissement du Trésor terminé"
 usa_economic_events.474.d: "Le dernier bloc d'actions ordinaires AIG a été vendu et la participation du gouvernement a disparu. Ce dont on se souviendra du sauvetage, et le précédent qu'il laisse pour la prochaine défaillance d'importance systémique, se tranche maintenant."
 usa_economic_events.474.a: "Un précédent de renflouement par les créanciers"
 usa_economic_events.474.b: "Justification du contribuable"
 usa_economic_events.474.c: "Un régime de résolution ordonnée"
 usa_economic_events.474.d_option: "Un précédent liquidationniste"
 usa_economic_events.474.e: "Un règlement pour risque moral"
 USA_aig_taxpayer_vindication: "Justification du contribuable"
 USA_aig_taxpayer_vindication_desc: "L'engagement AIG a été remboursé intégralement et a rapporté un profit au Trésor, ce que personne n'attendait en 2008. L'emprunt souverain est moins cher, les recettes d'impôt des sociétés plus fortes, et l'administration peut dépenser ce crédit."
 USA_aig_orderly_resolution_regime: "Régime de résolution ordonnée"
 USA_aig_orderly_resolution_regime_desc: "Divulgation et clawback ont été convertis en autorité permanente pour liquider une entreprise d'importance systémique. L'emprunt et l'investissement sont moins chers et le système nettement plus stable, au prix de rendements un peu plus minces."
 USA_aig_creditor_bail_in_precedent: "Précédent de recapitalisation interne des créanciers"
 USA_aig_creditor_bail_in_precedent_desc: "Les contreparties ont dû accepter moins que le pair, et chaque créancier d'une grande institution américaine intègre désormais la possibilité d'être à nouveau sollicité. L'investissement intérieur est moins cher à orienter, mais le coût de l'emprunt et la bienveillance étrangère en souffrent."
 USA_aig_moral_hazard_settlement: "Règlement sur le risque moral"
 USA_aig_moral_hazard_settlement_desc: "Le système a été stabilisé, les contreparties payées au pair, les bonus honorés, et le public a compris exactement ce qui s'était passé. Les rendements du capital et les revenus de marché sont forts ; le capital politique et la stabilité ne le sont pas."
 USA_aig_liquidationist_precedent: "Un précédent liquidationniste"
 USA_aig_liquidationist_precedent_desc: "AIG a été laissée faillir et le réseau de contreparties a failli avec elle. L'emprunt et l'investissement sont nettement plus chers et l'offre au consommateur tendue, mais plus aucune administration ne sera accusée d'avoir sauvé Wall Street."
 USA_openai_nonprofit_controlled_pbc: "PBC contrôlée par une organisation à but non lucratif"
 USA_openai_nonprofit_controlled_pbc_desc: "OpenAI Group opère comme société d'intérêt public sous le contrôle de l'OpenAI Foundation. La structure lie la croissance commerciale à la gouvernance de mission tout en donnant au laboratoire accès au capital-actions conventionnel."
 USA_openai_scaled_commercial_platform: "Plateforme commerciale à grande échelle"
 USA_openai_scaled_commercial_platform_desc: "OpenAI privilégie la distribution de produits, l'adoption entreprise et l'investissement rapide à la frontière. La portée finance la capacité, mais le contrôle de mission et la gouvernance de sûreté doivent concourir avec la pression commerciale."
 USA_openai_diversified_frontier_consortium: "Consortium frontière diversifié"
 USA_openai_diversified_frontier_consortium_desc: "OpenAI soutient le développement de frontière par un réseau de partenaires de capital et de calcul plutôt que par la dépendance à un seul fournisseur. La diversification élargit la capacité et le pouvoir de négociation au prix d'une gouvernance plus complexe."
 USA_openai_safety_governed_laboratory: "Laboratoire régi par la sécurité"
 USA_openai_safety_governed_laboratory_desc: "Une gouvernance formelle de sûreté et une supervision de mission contraignent le déploiement jusqu'à ce que modèles et contrôles soient prêts. Le laboratoire préserve légitimité et indépendance, mais accepte une montée en échelle commerciale plus lente."
 USA_anthropic_safety_governed_frontier: "Frontière régie par la sécurité"
 USA_anthropic_safety_governed_frontier_desc: "Anthropic couple recherche de frontière, gouvernance formelle, évaluations de capacité et sauvegardes plus fortes à mesure que les modèles progressent. Cette structure soutient la confiance publique tout en préservant la capacité du laboratoire à développer des systèmes capables."
 USA_anthropic_cloud_aligned_scale: "Échelle alignée sur le cloud"
 USA_anthropic_cloud_aligned_scale_desc: "Anthropic développe et déploie des modèles de frontière par des partenariats techniques profonds avec un fournisseur cloud principal. Capital, accélérateurs et distribution étroitement intégrés soutiennent une montée rapide au prix d'une plus grande dépendance."
 USA_anthropic_multi_cloud_independence: "Indépendance multi-cloud"
 USA_anthropic_multi_cloud_independence_desc: "Anthropic répartit entraînement et déploiement entre plusieurs partenaires d'infrastructure. L'arrangement préserve le pouvoir de négociation et un large accès tout en rendant l'expansion de frontière plus complexe."
 USA_anthropic_cautious_research_laboratory: "Laboratoire de recherche prudent"
 USA_anthropic_cautious_research_laboratory_desc: "Anthropic limite l'expansion commerciale pour que recherche, interprétabilité et contrôles de sûreté mûrissent avant un déploiement plus large. Le laboratoire accepte un progrès de frontière plus lent en échange d'une gouvernance plus forte et d'une légitimité publique."
 USA_openai_nonprofit_controlled_pbc_decision: "Soutenir la structure contrôlée par le nonprofit"
 USA_openai_nonprofit_controlled_pbc_decision_desc: "Soutenir une restructuration qui laisse le bras commercial du laboratoire responsable devant son nonprofit fondateur. La politique fédérale ne peut dicter la charte d'une entreprise privée, mais le traitement fiscal, les marchés publics et la posture antitrust façonnent quelle structure survit au contact des marchés de capitaux.\n\n§YL'esprit national résultant dure 365 jours. Un seul programme de laboratoire d'IA peut être actif à la fois.§!"
 USA_openai_scaled_commercial_platform_decision: "Retour à une mise à l'échelle commerciale rapide"
 USA_openai_scaled_commercial_platform_decision_desc: "Ouvrir la voie à une distribution de produits agressive et un déploiement entreprise. La portée finance la capacité plus vite qu'aucune subvention de recherche, et le gouvernement obtient un champion national dont il ne contrôle plus les incitations.\n\n§YL'esprit national résultant dure 365 jours. Un seul programme de laboratoire d'IA peut être actif à la fois.§!"
 USA_openai_diversified_frontier_consortium_decision: "Soutenez un consortium de calcul diversifié"
 USA_openai_diversified_frontier_consortium_decision_desc: "Encourager le laboratoire à répartir la capacité d'entraînement entre plusieurs partenaires de capital et d'infrastructure plutôt qu'un seul. La diversification achète pouvoir de négociation et résilience au prix d'une structure de gouvernance que personne ne peut résumer en une phrase.\n\n§YL'esprit national résultant dure 365 jours. Un seul programme de laboratoire d'IA peut être actif à la fois.§!"
 USA_openai_safety_governed_laboratory_decision: "Gouvernance formelle de la sécurité"
 USA_openai_safety_governed_laboratory_decision_desc: "Conditionner la coopération fédérale à des évaluations, un déploiement par étapes et un conseil de supervision à réelle autorité. Le laboratoire garde sa légitimité et son indépendance, et cède l'avance commerciale à qui est prêt à livrer le premier.\n\n§YL'esprit national résultant dure 365 jours. Un seul programme de laboratoire d'IA peut être actif à la fois.§!"
 USA_anthropic_safety_governed_frontier_decision: "Soutenir la frontière gouvernée par la sûreté"
 USA_anthropic_safety_governed_frontier_decision_desc: "Soutenir un laboratoire qui fait monter ensemble capacité et sauvegardes, publie ses seuils d'évaluation et s'y tient. Plus lent que l'alternative, et nettement plus facile à défendre devant une commission.\n\n§YL'esprit national résultant dure 365 jours. Un seul programme de laboratoire d'IA peut être actif à la fois.§!"
 USA_anthropic_cloud_aligned_scale_decision: "Soutenez un partenariat cloud unique"
 USA_anthropic_cloud_aligned_scale_decision_desc: "Endosser un alignement profond avec un fournisseur hyperscale, échangeant l'indépendance contre le capital et la capacité de rester à la frontière. Le calcul arrive immédiatement ; le levier est chez le partenaire.\n\n§YL'esprit national résultant dure 365 jours. Un seul programme de laboratoire d'IA peut être actif à la fois.§!"
 USA_anthropic_multi_cloud_independence_decision: "Soutenir l'indépendance multi-cloud"
 USA_anthropic_multi_cloud_independence_decision_desc: "Pousser le laboratoire à entraîner et servir chez des fournisseurs concurrents pour qu'aucun partenaire unique ne fixe ses termes. L'indépendance est chère et la surcharge d'ingénierie réelle, mais l'entreprise ne répond qu'à elle-même.\n\n§YL'esprit national résultant dure 365 jours. Un seul programme de laboratoire d'IA peut être actif à la fois.§!"
 USA_anthropic_cautious_research_laboratory_decision: "Soutenir un programme de recherche retenu"
 USA_anthropic_cautious_research_laboratory_decision_desc: "Soutenir un laboratoire petit, délibéré et largement hors de la course produits. La confiance publique et la discipline interne restent intactes ; la position de marché non.\n\n§YL'esprit national résultant dure 365 jours. Un seul programme de laboratoire d'IA peut être actif à la fois.§!"
 USA_ai_lab_treasury_15_tt: "Dispose de plus de §Y15 milliards§! de réserves de trésorerie"
 USA_ai_lab_treasury_20_tt: "Dispose de plus de §Y20 milliards§! de réserves de trésorerie"
 USA_ai_lab_treasury_25_tt: "Dispose de plus de §Y25 milliards§! de réserves de trésorerie"
 usa_economic_events.475.a: "Imposer un jugement de consentement strict"
 usa_economic_events.475.b: "Signez un arrêté plus léger"
 usa_economic_events.475.d: "La cour du D.C. Circuit a infirmé l'ordre de démantèlement et l'affaire se dirige vers un décret de consentement. Nous pouvons verrouiller Microsoft dans de stricts termes d'interopérabilité et de divulgation, ou négocier un décret plus léger qui préserve la flexibilité des marchés publics."
 usa_economic_events.475.t: "Infirmation en appel et décret de consentement"
 usa_economic_events.476.a: "S'aligner sur les recours de la CE"
 usa_economic_events.476.b: "Défendre une ligne américaine plus étroite"
 usa_economic_events.476.d: "La Commission européenne a infligé une amende à Microsoft et ordonné des recours d'interopérabilité. Washington peut s'aligner sur Bruxelles sur la documentation ouverte et l'accès aux interfaces, ou défendre une interprétation américaine plus étroite du droit de la concurrence."
 usa_economic_events.476.t: "Décisions de concurrence de la Commission européenne"
 usa_economic_events.477.a: "Exiger la fiabilité avant l'échelle"
 usa_economic_events.477.b: "Privilégier la vitesse du marché"
 usa_economic_events.477.d: "Le déploiement difficile de Vista a exposé des faiblesses de qualité et de compatibilité dans tout l'écosystème Microsoft. Nous pouvons imposer de durs bancs de fiabilité pour les déploiements fédéraux, ou tolérer l'instabilité pour préserver l'élan du fournisseur."
 usa_economic_events.477.t: "Les années Ballmer : Vista et stratégie de plateforme"
 usa_economic_events.478.a: "Soutenir le rachat d'Oracle"
 usa_economic_events.478.b: "Forcer une restructuration indépendante"
 usa_economic_events.478.c: "Autoriser l'offre de Microsoft"
 usa_economic_events.478.d: "L'effondrement de Sun est devenu une décision de politique industrielle fédérale. Washington peut soutenir l'offre d'acquisition d'Oracle, forcer une voie de restructuration indépendante, ou autoriser l'offre de Microsoft et trancher les termes d'intégration dans un arrêt de suivi."
 usa_economic_events.478.t: "L'avenir de Sun : Oracle, restructuration ou Microsoft"
 usa_economic_events.479.a: "Mandater la gestion de la fondation"
 usa_economic_events.479.b: "Autoriser l’intégration complète de Microsoft"
 usa_economic_events.479.d: "L'offre de Microsoft autorisée, les régulateurs fédéraux doivent décider de la gouvernance des actifs de plateforme de Sun. Nous pouvons orienter Java vers une stewardship de type fondation avec des garanties d'interopérabilité, ou permettre une intégration profonde Microsoft et accepter le risque de concentration."
 usa_economic_events.479.t: "Gouvernance de Sun après l'offre Microsoft"
 usa_economic_events.480.a: "Soutenir la stratégie d'appareils Lumia"
 usa_economic_events.480.b: "Passer la dépréciation et quitter les téléphones"
 usa_economic_events.480.c: "Scinder l'activité appareils"
 usa_economic_events.480.d: "L'acquisition des téléphones Nokia par Microsoft a échoué, et l'entreprise passe des milliards en dépréciation et réduit la division téléphones. La politique fédérale peut pousser Microsoft à continuer de se battre pour les appareils ou à céder le marché et se recentrer sur le cloud et le logiciel."
 usa_economic_events.480.t: "La dépréciation Nokia"
 usa_economic_events.481.a: "Approuver l’intégration complète des données"
 usa_economic_events.481.b: "Approuver avec des conditions de portabilité des données"
 usa_economic_events.481.c: "Bloquer l'acquisition"
 usa_economic_events.481.d: "Microsoft a accepté d'acquérir LinkedIn, plaçant un réseau professionnel et ses données sous le contrôle de l'entreprise. Les régulateurs peuvent laisser passer l'accord, y attacher des conditions de portabilité des données, ou le bloquer pour des motifs de vie privée et de concentration."
 usa_economic_events.481.t: "LinkedIn rejoint Microsoft"
 usa_economic_events.482.a: "Préserver l'autonomie de GitHub"
 usa_economic_events.482.b: "Intégrer GitHub à Azure"
 usa_economic_events.482.c: "Bloquer l'acquisition"
 usa_economic_events.482.d: "L'acquisition de GitHub donne à Microsoft la stewardship d'une infrastructure open source essentielle. La politique fédérale peut préserver l'autonomie de la plateforme, intégrer étroitement GitHub à Azure, ou bloquer l'accord pour des motifs de sécurité et de pouvoir de marché."
 usa_economic_events.482.t: "GitHub sous Microsoft"
 usa_economic_events.483.a: "Défendre le marché à maître d'œuvre unique"
 usa_economic_events.483.b: "Imposer une passerelle souveraine neutre vis-à-vis des fournisseurs"
 usa_economic_events.483.c: "Séparer les patrimoines cloud défense et civil"
 usa_economic_events.483.d: "Garder la gouvernance de Java neutre"
 usa_economic_events.483.d_independent: "Le contentieux JEDI a exposé la fragilité des marchés publics : chaque arrêt cloud a désormais des conséquences stratégiques. Nous devons choisir à quel point cloud fédéral, sécurité et gouvernance des fournisseurs restent couplés."
 usa_economic_events.483.d_microsoft: "À mesure que les combats JEDI s'intensifient, les agences planifient des structures post-JEDI. Le choix n'est plus de savoir si le cloud compte, mais si Washington gouverne un maître d'œuvre national unique ou une pile multi-fournisseurs réglementée."
 usa_economic_events.483.d_oracle: "Le Pentagone a attribué JEDI à Microsoft, déclenchant protestations, contestations d'offres et litiges de cloud souverain dans les agences. Nous pouvons tenir un marché centralisé, forcer une architecture neutre vis-à-vis des fournisseurs, ou basculer vers des patrimoines parallèles."
 usa_economic_events.483.e: "Absorber Sun entièrement dans la stratégie Azure"
 usa_economic_events.483.t: "JEDI et le combat du cloud de défense"
 usa_economic_events.484.a: "Déployer le casque à grande échelle"
 usa_economic_events.484.b: "Restructurer en déploiement limité"
 usa_economic_events.484.c: "Relancer l'appel d'offres vers un challenger de la tech de défense"
 usa_economic_events.484.d: "Le Integrated Visual Augmentation System de l'Armée, bâti sur le HoloLens de Microsoft, a échoué aux essais de terrain et attiré le regard du Congrès sur le coût et la fiabilité. Vingt-deux milliards de dollars et la confiance du soldat sont en jeu."
 usa_economic_events.484.t: "IVAS : le casque du soldat"
 usa_economic_events.485.a: "Approuver l'acquisition"
 usa_economic_events.485.b: "Approuver avec des recours de streaming cloud"
 usa_economic_events.485.c: "Bloquer la fusion"
 usa_economic_events.485.d: "Microsoft a accepté d'acheter Activision Blizzard pour soixante-neuf milliards de dollars, la plus grande opération de l'histoire du jeu. La Federal Trade Commission et des régulateurs étrangers s'y opposent pour le contrôle des jeux et du streaming cloud."
 usa_economic_events.485.t: "Activision et les régulateurs"
 usa_economic_events.486.a: "La sécurité d'abord"
 usa_economic_events.486.b: "Sécurité et livraison équilibrées"
 usa_economic_events.486.c: "Livrer vite avec moins de contrôles"
 usa_economic_events.486.d: "La question restante est doctrinale : la politique fédérale doit-elle prioriser d'abord les contrôles de sécurité, équilibrer livraison et garde-fous, ou livrer plus vite sous des contraintes de sécurité plus lâches. Ce choix fixe le profil de gouvernance de long terme de la pile Microsoft du secteur public."
 usa_economic_events.486.t: "Doctrine de sécurité pour la pile Microsoft"
 usa_economic_events.487.t: "Créer une société de lancement privée"
 usa_economic_events.487.d: "SpaceX, une start-up de lancement financée en privé à El Segundo, dit qu'elle construira ses propres moteurs, cellules et avionique plutôt que de les acheter. Washington peut encourager une base d'ingénierie intégrée, orienter la firme vers les marchés de défense dès le départ, ou la laisser acheter de la vitesse avec des composants sur étagère."
 usa_economic_events.487.a: "Encourager une base d’ingénierie intégrée"
 usa_economic_events.487.b: "Orienter la firme vers les marchés de défense"
 usa_economic_events.487.c: "Laisser acheter de la vitesse avec des pièces sur étagère"
 usa_economic_events.488.t: "Fret commercial vers la station"
 usa_economic_events.488.d: "La NASA passe le ravitaillement de la station sur des contrats commerciaux pour la première fois, et SpaceX enchérît une capsule qu'elle n'a pas encore fait voler. La forme du marché décide si deux fournisseurs concourent, si un champion est financé pour aller vite, ou si la pile navette est étirée encore quelques années."
 usa_economic_events.488.a: "Double-sourcer le contrat de fret"
 usa_economic_events.488.b: "Financer un champion unique pour la vitesse"
 usa_economic_events.488.c: "Étirer la logistique navette existante"
 usa_economic_events.489.t: "Falcon 1 atteint son orbite"
 usa_economic_events.489.d: "Trois échecs puis, à la quatrième tentative, Falcon 1 atteint l'orbite. SpaceX veut continuer à voler pour apprendre. Les régulateurs veulent une supervision plus serrée d'un programme de lancement qui a échoué en public, et les maîtres d'œuvre établis veulent que le nouveau venu soit replié dans leurs propres chaînes d'approvisionnement."
 usa_economic_events.489.a: "Les laisser itérer par les essais en vol"
 usa_economic_events.489.b: "Renforcer la surveillance des risques de lancement"
 usa_economic_events.489.c: "Replier le nouveau venu chez les maîtres d'œuvre"
 usa_economic_events.490.t: "Falcon 9 et Dragon"
 usa_economic_events.490.d: "SpaceX fait voler Falcon 9 pour la première fois, et Dragon doit revenir d'orbite avant la fin de l'année. L'ampleur de la certification du système décide s'il porte des missions nationales, attend derrière un calendrier de qualification conservateur, ou ne sert que des clients commerciaux."
 usa_economic_events.490.a: "Qualifier le système pour les missions civiles"
 usa_economic_events.490.b: "Maintenir un rythme de certification prudent"
 usa_economic_events.490.c: "Le réserver aux clients commerciaux"
 usa_economic_events.491.t: "Le premier étage revient"
 usa_economic_events.491.d: "Un booster SpaceX se pose debout à Cape Canaveral. La réutilisation n'est plus théorique, mais la monter en cadence signifie faire voler des charges clients sur du matériel déjà volé, et l'activité consommable paie encore les factures."
 usa_economic_events.491.a: "Réutilisation agressive des rampes"
 usa_economic_events.491.b: "Privilégiez un taux de vol conservateur"
 usa_economic_events.491.c: "Protéger le chiffre d'affaires des lancements consommables"
 usa_economic_events.492.t: "Faucon lourd"
 usa_economic_events.492.d: "Falcon Heavy vole du premier coup, et SpaceX opère désormais la fusée la plus capable en service. La certifier pour la sécurité nationale et les charges d'espace lointain ouvre les plus grandes missions à un fournisseur commercial, précisément ce que les programmes de lourds lanceurs titulaires ont été bâtis pour garder."
 usa_economic_events.492.a: "Certifier le lourd pour les missions nationales"
 usa_economic_events.492.b: "Garder le lourd lift sur les charges commerciales"
 usa_economic_events.492.c: "S'en remettre aux véhicules lourds concurrents"
 usa_economic_events.493.t: "Starlink monte"
 usa_economic_events.493.d: "Le premier lot opérationnel de Starlink atteint l'orbite, et les dépôts de SpaceX en appellent des milliers d'autres. Il peut être bâti comme un actif dual allié, vendu aussi vite qu'il peut être fabriqué, ou retenu jusqu'à ce que les questions de sécurité soient tranchées."
 usa_economic_events.493.a: "Construisez-le comme un actif allié à double usage"
 usa_economic_events.493.b: "Vendre la capacité commerciale le plus rapidement possible"
 usa_economic_events.493.c: "Le retenir en attendant l'examen de sécurité"
 usa_economic_events.494.t: "Equipe commerciale"
 usa_economic_events.494.d: "Pour la première fois depuis le retrait de la navette, des astronautes américains décollent du sol américain, à bord d'un Dragon SpaceX. Certifier l'équipage commercial met fin à neuf ans d'achat de sièges étrangers, bien que maintenir Boeing financé comme second fournisseur coûte considérablement plus."
 usa_economic_events.494.a: "Certifier l'équipage commercial"
 usa_economic_events.494.b: "Financez également un deuxième fournisseur"
 usa_economic_events.494.c: "Garder les sièges étrangers comme voie principale"
 usa_economic_events.495.t: "Un atterrisseur pour la Lune"
 usa_economic_events.495.d: "Le marché de l'atterrisseur lunaire couple Artémis au Starship de SpaceX, un véhicule qui n'existe pas encore. Parier dessus achète une capacité énorme et un calendrier incertain. Partager le marché ou attendre un atterrisseur gouvernemental n'achète ni l'un ni l'autre, mais risque moins."
 usa_economic_events.495.a: "Attribuer l'atterrisseur à Starship"
 usa_economic_events.495.b: "Partager le marché entre fournisseurs"
 usa_economic_events.495.c: "Attendre un atterrisseur construit par l'État"
 usa_economic_events.496.t: "Mix de fournisseurs de lancement de sécurité nationale"
 usa_economic_events.496.d: "Le lancement de sécurité nationale doit être assuré, ce qui a historiquement signifié payer deux fournisseurs pour rester en activité. SpaceX vole désormais bien plus souvent et bien moins cher que United Launch Alliance, et l'achat public doit décider ce que vaut l'assurance."
 usa_economic_events.496.a: "Garder deux fournisseurs certifiés"
 usa_economic_events.496.b: "Favoriser le maître d'œuvre établi"
 usa_economic_events.496.c: "Se concentrer sur le fournisseur moins cher"
 usa_economic_events.497.t: "Licence de vaisseau spatial"
 usa_economic_events.497.d: "SpaceX veut faire voler Starship, la plus grande fusée jamais construite, jusqu'à la destruction jusqu'à ce qu'elle cesse de se casser. Cette approche exige des licences au rythme de l'itération, un processus environnemental qui n'a pas été écrit pour elle, et une infrastructure de lancement que personne d'autre ne peut utiliser."
 usa_economic_events.497.a: "Licencier de façon itérative et voler pour apprendre"
 usa_economic_events.497.b: "S'en tenir à la voie environnementale plus lente"
 usa_economic_events.497.c: "Fédéraliser l'infrastructure de soutien"
 usa_economic_events.498.t: "La forme du lancement américain"
 usa_economic_events.498.d: "Deux décennies après que SpaceX a annoncé qu'elle construirait ses propres moteurs, la structure de l'accès américain à l'orbite s'est figée dans sa forme durable : qui vole les missions nationales, qui emporte les équipages, et qui possède la constellation au-dessus."
 usa_economic_events.498.a: "Un marché avec un fournisseur qui compte"
 usa_economic_events.498.b: "Accès assuré à cadence industrielle"
 usa_economic_events.498.c: "Une filière industrielle de l'espace lointain"
 usa_economic_events.498.e: "Un tissu de connectivité orbitale allié"
