 CPD_country_action_ceasefire_TT: "§YZawieszenie broni§! kończy wojnę, ustanawiając obecną linię frontu nową granicą. Następnie obowiązuje rozejm trwający §Y720 dni§!.\n\nKliknij, aby usunąć z oferty."
 CPD_country_action_war_reparations_TT: "§YReparacje wojenne§! zmuszają przegranego do przekazywania zwycięzcy części swojego PKB w cotygodniowych ratach przez okres jednego roku.\n\nKliknij, aby usunąć z oferty."
 CPD_country_action_forced_neutrality_TT: "§YWymuszona neutralność§! usuwa cel z jego frakcji i uniemożliwia mu dołączenie do innej przez pięć lat.\n\nKliknij, aby usunąć z oferty."
 CPD_country_action_regime_change_TT: "§YZmiana reżimu§! osadza naszą partię rządzącą we władzach celu. Należy spodziewać się trwałej niestabilności politycznej.\n\nKliknij, aby usunąć z oferty."
 CPD_country_action_military_basing_TT: "Umowa o §YBazach wojskowych§! przyznaje stronie przyjmującej prawo swobodnego przemieszczania się oraz prawo do stacjonowania na terytorium drugiej strony.\n\nKliknij, aby usunąć z oferty."
 CPD_country_action_full_puppet_TT: "§YPełna marionetyzacja§! sprowadza cały cel do stanu podległości.\n\nKliknij, aby usunąć z oferty."
