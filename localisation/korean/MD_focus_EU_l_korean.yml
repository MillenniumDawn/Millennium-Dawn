 EU_council_determine_serious_breach_of_EU_values: "유럽연합(EU) 가치 심각한 위반 결정"
 EU_council_determine_serious_breach_of_EU_values_desc: "유럽연합 조약(TEU) 제7조 제2항에 따라, 이사회는 특정 회원국이 유럽연합(EU)의 가치를 심각하고 지속적으로 위반하고 있음을 결정할 수 있습니다. 이는 유럽연합 투표권을 정지하기 위한 필수 전제조건입니다."
 EU_council_revoke_determination_of_serious_breach_of_EU_values: "위반 결정 철회"
 EU_council_revoke_determination_of_serious_breach_of_EU_values_desc: "해당 회원국이 유럽연합(EU) 가치에 대한 심각하고 지속적인 위반을 중단함에 따라, 유럽연합 조약(TEU) 제7조 제2항에 명시된 결정을 철회합니다."
 EU_council_suspend_voting_rights: "유럽연합(EU) 투표권 정지"
 EU_council_suspend_voting_rights_desc: "유럽연합 조약(TEU) 제7조 제3항에 따라, 이사회는 해당 회원국 정부 대표의 이사회 내 투표권을 포함하여 조약 적용으로부터 발생하는 해당 회원국의 특정 권리를 정지하기로 결정할 수 있습니다."
 EU_council_revoke_voting_rights_suspension: "유럽연합(EU) 투표권 정지 철회"
 EU_council_revoke_voting_rights_suspension_desc: "유럽연합 조약(TEU) 제7조 제4항에 따라, 이사회는 제재 조치를 부과하게 만들었던 상황이 변화함에 따라 제3항에 의거해 취해진 조치를 추후 철회하기로 결정할 수 있습니다."
 EU_council_suspend_subsidies: "유럽연합(EU) 보조금 지급 정지"
 EU_council_suspend_subsidies_desc: "유럽연합 조약(TEU) 제7조 제3항에 따라, 이사회는 조약 적용으로부터 발생하는 해당 회원국의 특정 권리를 정지하기로 결정할 수 있습니다."
 EU_council_revoke_subsidies_suspension: "유럽연합(EU) 보조금 지급 정지 철회"
 EU_council_revoke_subsidies_suspension_desc: "유럽연합 조약(TEU) 제7조 제4항에 따라, 이사회는 제재 조치를 부과하게 만들었던 상황이 변화함에 따라 제3항에 의거해 취해진 조치를 추후 철회하기로 결정할 수 있습니다."
