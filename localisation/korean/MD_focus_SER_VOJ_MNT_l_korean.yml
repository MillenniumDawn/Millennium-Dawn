 kosovo.13.t: "코소보 민주당이 된 PPDK"
 kosovo.13.d: "코소보 해방군 정치 지도부가 창당한 코소보 민주진보당이 당명을 코소보 민주당으로 바꿨습니다. 지도부는 새 이름이 전시 운동에서 유엔 행정 체제 아래 선거에 나설 수 있는 민간 정당으로의 이행을 나타낸다고 말합니다."
 kosovo.13.a: "해방군에서 정당으로"
 kosovo.14.t: "코소보 안보군 출범"
 kosovo.14.d: "코소보 방호군이 활동을 마치고 새로운 코소보 안보군에 임무를 넘겼습니다. 경무장한 이 부대는 NATO의 지원 아래 위기 대응, 지뢰 제거, 민방위 훈련을 받으며, 코소보의 모든 공동체에서 인원을 모집합니다."
 kosovo.14.a: "새로운 나라를 위한 새 군복"
 kosovo.15.t: "통합 운동에 합류한 LKÇK"
 kosovo.15.d: "코소보 해방 민족운동이 독립된 조직으로서의 존재를 끝내고 통합 운동에 합쳐졌습니다. 구성원들은 더 큰 조직의 깃발 아래 코소보와 알바니아의 통합을 위한 운동을 계속할 것입니다."
 kosovo.15.a: "구세대가 결속한다"
 kosovo.16.t: "베테벤도스예에 합쳐진 LPK"
 kosovo.16.d: "코소보 인민운동이 자결 운동에 합쳐졌습니다. 코소보 해방군이 나온 모태 조직이 이제 퇴역 군인과 해외 동포 네트워크를 베테벤도스예의 대열로 끌어들입니다."
 kosovo.16.a: "두 운동이 하나가 된다"
 kosovo.17.t: "등록이 말소된 녹색당"
 kosovo.17.d: "중앙선거관리위원회가 연이은 여러 선거에 불참한 코소보 녹색당을 정당 등록부에서 말소했습니다. 환경 운동가들은 이제 시민단체나 다른 정당을 통해 활동해야 합니다."
 kosovo.17.a: "코소보의 녹색당이 당을 잃는다"