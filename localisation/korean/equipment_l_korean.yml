 CAN_artillery_2: "LG1 마크 II"
 CAN_Air_UAV1: "IAI 헤론"
 CAN_Air_UAV2: "MQ-9 리퍼"
 CAN_Air_UAV3: "MQ-17 밴시"
 CAN_Air_UAV4: "MQ-25 갓스 아이"
 CHL_infantry_weapons_short: "SG 510-4"
 CAN_CV_L_Strike_fighter1: "더글러스 CA-4E 스카이호크"
 CAN_CV_L_Strike_fighter1_short: "CA-4E 스카이호크"
 CAN_CV_L_Strike_fighter2: "시 해리어 CF-A2"
 CAN_CV_L_Strike_fighter2_short: "시 해리어 CF-A2"
 CAN_CV_L_Strike_fighter3: "CF-A8B 해리어 II"
 CAN_CV_L_Strike_fighter3_short: "CF-A8B 해리어 II"
 CAN_CV_L_Strike_fighter4: "CF-35B 라이트닝 II"
 CAN_CV_L_Strike_fighter4_short: "CF-35B 라이트닝 II"
 CAN_CV_L_Strike_fighter5: "CF-79B 오션 레이더"
 CAN_CV_L_Strike_fighter5_short: "CF-79B 오션 레이더"
 CAN_naval_plane4: "P-8 포세이돈"
 CAN_naval_plane4_short: "P-8 포세이돈"
 PMR_Anti_Air_0: "9K32 Strela-2"
 PMR_Anti_Air_0_desc: "냉전 초기에 비례 항법 방식을 이용해 미국의 핵폭격기를 포착하고 파괴하도록 설계되었습니다. 3,700~4,200m의 표적을 타격할 수 있는 가장 기본적인 대공 무기 중 하나입니다."
 PMR_Anti_Air_1: "9K38 Igla"
 PMR_Anti_Air_1_desc: "이글라는 스트렐라의 더 현대적인 후속 모델로, 2004년 러시아가 배치했습니다. 스트렐라보다 훨씬 뛰어난 이중 파장대 적외선(S형) 유도 장치를 사용합니다."
 PMR_Anti_Air_2: "9K38 Igla-S"
 PMR_Anti_Air_2_desc: "더 긴 사거리, 더 민감한 시커, 최신 대응책에 대한 향상된 저항 및 더 무거운 탄두를 갖춘 실질적으로 개선된 변종인 최신 변종입니다. 제조업체 보고에 따르면 적중 확률은 0.8–0.9입니다."
 PMR_APC_1: "BTR-60"
 PMR_APC_1_desc: "One of the oldest vehicles still in service, the BTR-60 has a 14.5mm KPVT heavy machine gun with 500 rounds. The secondary weapon is a 7.62mm PKT coaxial machine gun with 2,000 rounds. Great for light infantry movements, and QRFs."
 PMR_APC_1_short: "BTR-60"
 PMR_APC_2: "MT-LB"
 PMR_APC_2_desc: "MT-LB는 1970년대에 만들어졌습니다. 저렴하고 빠르게 제작된 소련은 가벼운 대공 및 보병 전투에 사용했습니다."
 PMR_APC_2_short: "MT-LB"
 PMR_APC_3: "BTR-70"
 PMR_APC_3_desc: "BTR-70은 1972년 소련-아프가니스탄 전쟁에서 군대를 이동시켜 화력을 지원하는데 사용되었습니다. BTR-60과의 유일한 차이점은 장갑이 더 무겁다는 점입니다."
 PMR_APC_3_short: "BTR-70"
 PMR_APC_4: "BTR-80"
 PMR_APC_4_desc: "BTR-80은 8륜 수륙양용 병력 수송 장갑차(APC)로 소련에서 개발되었습니다. 1986년 배치되기 시작하여 이전의 차량인 BTR-60, BTR70들을 대체하기 시작했습니다. 아프가니스탄전에서 처음 그 실력을 발휘했습니다."
 PMR_APC_4_short: "BTR-80"
 PMR_APC_5: "BTR-90"
 PMR_APC_5_desc: "테러리스트와 싸우기 위해 1994년에 생산되었습니다. 강력한 무기인 30mm 시퍼노브 2A42 포를 500발의 포탄과 함께 장착하고 있습니다."
 PMR_APC_5_short: "BTR-90"
 PMR_Heavy_Anti_tank_1: "BRDM-2 9P148 Konkurs"
 PMR_Heavy_Anti_tank_1_desc: "Used in many wars and on many vehicles. The effective range is 500-3,000m."
 PMR_IFV_1: "BMP-1"
 PMR_IFV_1_desc: "BMP-1은 소련제 수륙양용 궤도형 보병 전투 차량입니다. 소련-아프가니스탄 전쟁에서 병력 수송 및 지하디스트와의 전투에 사용되었습니다. 73mm 2A28 주포와 대전차 미사일 발사기를 장착하고 있습니다."
 PMR_IFV_1_short: "BMP-1"
 PMR_IFV_2: "BMP-2"
 PMR_IFV_2_desc: "BMP-2는 지하드 주의자들이 가장 두려워 하던 차량으로 30mm 캐논과 캐터필러를 가져 굉장히 빠르고 효율적입니다."
 PMR_IFV_2_short: "BMP-2"
 PMR_IFV_3: "BMP-2M"
 PMR_IFV_3_short: "BMP-2M"
 PMR_IFV_4: "BMP-3"
 PMR_IFV_4_desc: "BMP-3는 소련의 보병 전투 차량(IFV)로 BMP-1과 BMP-2를 계승하는 차량입니다. 100mm 포로 고폭탄을 발사합니다."
 PMR_IFV_4_short: "BMP-3"
 PMR_IFV_5: "BMP-3M"
 PMR_IFV_5_desc: "BMP-3M은 소련의 보병 전투 차량(IFV)로 BMP-1과 BMP-2를 계승하는 차량인 동시에 BMP-3의 개량형입니다. 포와 엔진을 향상시켰습니다."
 PMR_IFV_5_short: "BMP-3M"
 PMR_Anti_tank_1: "RPG-7"
 PMR_Anti_tank_1_desc: "Used in many wars and on many vehicles."
 PMR_Anti_tank_2: "AT-4 Fagot"
 PMR_Anti_tank_2_desc: "Much lighter than the other ATGM-systems, and older. This ATGM can only hit at 70-2,500 m which compared to others is much lesser range than the others but also cheaper."
 PMR_MBT_1: "T-55"
 PMR_MBT_1_desc: "T-54/55는 아마도 세계에서 가장 많이 생산된 전차일 것입니다. 냉전 초기에 설계되고 생산되었으며, 그것은 붉은 군대의 힘이자 중추였습니다. 한때 러시아 세력의 상징으로 여겨졌던 이 기갑부대는 미국의 공습으로 파괴되는 중동 기갑부대의 상징이 되었습니다."
 PMR_MBT_1_short: "T-55"
 PMR_MBT_2: "T-72"
 PMR_MBT_2_desc: "T-72는 아마도 러시아가 생산한 가장 성공적인 디자인일 것입니다. 그것은 냉전 말기 소련군의 정점이었고, 수천 대가 생산되었으며, 오늘날까지도 러시아군의 중추 역할을 하고 있습니다. 비록 중동 분쟁에서 치명적인 실패로 악명이 높았지만, T-72는 미래의 러시아 전차 설계를 위한 개발 플랫폼으로 여전히 사용되고 있으며 오늘날 현대전의 기준에 부합하도록 끊임없는 수정과 업그레이드가 이루어졌습니다. 한때 소련군의 창이었던 전차를 과소평가하지 마십시오."
 PMR_MBT_2_short: "T-72"
 PMR_MBT_3: "T-80"
 PMR_MBT_3_desc: "2백만달러의 이 전차이자 전장의 야수는 T-72와 같은 포를 사용하며 장갑을 증설하고 코브라 대전차 유도 미사일(ATGM)을 탑재하고 있습니다."
 PMR_MBT_3_short: "T-80"
 PMR_MBT_4: "T-90"
 PMR_MBT_4_desc: "최대한의 화력과 효율을 위해 3문 포 체계로 무장했습니다. 125mm 포 발사 장치 3문을 갖추고 있습니다."
 PMR_MBT_4_short: "T-90"
 PMR_mbt_equipment_0: "T-62"
 PMR_mbt_equipment_1: "T-72"
 PMR_mbt_equipment_2: "T-90"
 PMR_Rec_tank_0: "PT-76"
 PMR_Rec_tank_0_desc: "이 초고속 수륙 양용 경전차는 강 건너편에서 적진으로 몰래 접근하여 지옥의 짐을 내릴 수 있습니다. 76.2mm D-56T 강선 전차포를 사용합니다."
 PMR_Rec_tank_0_short: "PT-76"
 PMR_Rec_tank_1: "2S25 Sprut-SD"
 PMR_Rec_tank_1_desc: "자주식 수륙양용 구축전차인 이 차량은 적 탱크에 몰래 접근하여 t-72-80이 탑재하는 125mm 대포를 발사할 수 있습니다."
 PMR_Rec_tank_1_short: "2S25 Sprut-SD"
 PMR_SP_Anti_Air_0: "ZSU-23-4 실카"
 PMR_SP_Anti_Air_1: "9K35 스트렐라-10"
 PMR_SP_Anti_Air_2: "2K22 퉁구스카"
 PMR_SP_Anti_Air_2_desc: "최대 8발의 미사일을 발사할 수 있는 이 기체는 접근하는 모든 항공기를 격추할 수 있습니다. 뿐만 아니라 자동포로 수송기도 파괴할 수 있습니다."
 PMR_SP_R_arty_0: "1ST 프리보르-1"
 PMR_SP_R_arty_0_desc: "ZIL-131을 기반으로 한 BM-21의 복제형"
 PMR_SP_R_arty_1: "2ST 프리보르-2"
 PMR_SP_R_arty_1_desc: "카마즈를 기반으로 한 BM-21의 현대화 복제형"
 PMR_SP_arty_0: "2S1 Gvozdika"
 PMR_SP_arty_0_desc: "2S1 그보즈디카는 MT-LBu 다목적 차체를 기반으로 122mm 2A18 곡사포를 탑재한 소련의 자주 곡사포입니다. \\"2S1\\"은 GRAU 명칭입니다. 러시아식 대체 명칭은 SAU-122이지만 러시아군에서는 흔히 그보즈디카로 불립니다."
 PMR_SP_arty_1: "2S3 아카치야"
 PMR_SP_arty_1_desc: "필요하다면 태양도 쏠 수 있을 만큼 강력한 152.4mm D-22 대포로 무장한 이 포병대는 사거리가 50km에 달하는 놀라운 화력을 자랑합니다."
 PMR_artillery_1: "D-30"
 PMR_artillery_1_desc: "소련이 많은 전쟁에서 사용한 122mm 견인포 부대입니다. 사거리는 15~25km입니다."
