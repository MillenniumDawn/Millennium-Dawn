 UKR_fund_narp_aircraft_manufacturer_desc: "\n\n\n\n\n\n£UKR_desctext_strategic_aviation_narp\n\n\n\n\n\n\n\n\n§L미콜라이우 항공기 수리 공장§!에 자금을 지원해 우크라이나 장거리 항공대 전력을 복원하는 데 필요한 시설과 장비, 전문 기술을 갖추게 합니다."
