 israel_labour.1.t: "A Questão do Movimento Social"
 israel_labour.1.d: "Shelly Rachel Yachimovich tem sido uma estrela em ascensão dos movimentos políticos de esquerda recentemente. Seu movimento está bastante alinhado com nossas posições ideológicas. Se incorporarmos seu movimento ao nosso partido, é bastante provável que ela assuma a liderança do nosso partido em breve... Devemos integrá-los?"
 israel_labour.1.a: "Claro! Entre!"
 israel_labour.1.b: "A política de baixo nível não interessa ao nosso país."
 israel_labour.2.t: "Os Democratas"
 israel_labour.2.d: "Hoje se tornou conhecida a criação de um novo partido político - £ISR_democrats os Democratas, que surgiu da fusão do  £ISR_socialism Partido Trabalhista com o  £ISR_neutral_Social Partido Meretz. Esse evento não foi inesperado para a sociedade, pois historicamente esses partidos sempre cooperaram e atuaram como uma única coalizão nas eleições, e a criação dos £ISR_democrats Democratas foi um passo lógico na relação entre eles. Na verdade, não é uma unificação completa; no momento os partidos ainda têm orçamentos separados e facções independentes nos municípios, mas de um jeito ou de outro essa união tem boas chances nas eleições e um futuro brilhante pela frente."
 israel_labour.2.a: "A Esquerda está se Unindo."
 israel_labour.3.t: "A Formação do Yesh Atid"
 israel_labour.3.d: "Há dois anos, especula-se no meio político israelense que Yair Lapid, um jornalista popular e filho do chefe do partido político liberal  £ISR_liberalism_alt2 Shinui, deixará sua carreira no jornalismo e iniciará uma carreira na política. Muitos também especularam que Lapid se juntará a um partido existente. Em janeiro, Yair Lapid anunciou que de fato entraria na política e, já em abril deste ano, Lapid pediu o registro de um novo partido político,  £ISR_liberalism_alt3 Yesh Atid. O partido continuará a tradição política do Shinui e defenderá o sionismo liberal e o centrismo político."
 israel_labour.3.a: "Yair Lapid tem um Futuro Brilhante."
 israel_labour.3.b: "Nada de Interessante."
 israel_labour.4.t: "A Formação do Hosen LeYisrael"
 israel_labour.4.d: "O ex-Chefe do Estado-Maior das FDI, Benjamin \"Benny\" Gantz, anunciou a formação de um novo partido político,  £ISR_liberalism_alt4 Partido Resiliência para Israel. O partido se posiciona como centrista e defende um comportamento mais apolítico em nome da defesa do país."
 israel_labour.4.a: "Benny Gantz unirá Israel!"
 israel_labour.4.b: "Nada de Interessante."
 israel_labour.5.t: "A Formação do Tikva Hadasha"
 israel_labour.5.d: "Em meio à massiva \"bibização\" do Likud, o ex-membro do  £ISR_conservatism Likud Gideon Sa'ar anunciou a formação de um novo partido político,  £ISR_conservatism_alt Nova Esperança. O partido defende posições de direita, ao mesmo tempo que apoia reformas políticas liberais e a intervenção do Estado no mercado."
 israel_labour.5.a: "Benny Gantz unirá Israel!"
 israel_labour.5.b: "Nada de Interessante."
 ISR_united_party: "Partido Unido"
 ISR_united_party_desc: "Chegou o momento em que os dois partidos de esquerda simplesmente precisam se fundir em uma única entidade. Sozinhos, os partidos de direita nos derrotarão, mas juntos podemos criar um Estado sionista popular!"
