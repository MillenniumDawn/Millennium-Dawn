 JAP_ministry_officials_named: "Названы имена чиновников министерства"
 JAP_ministry_officials_named_desc: "Контракт с Shinsei стал достоянием общественности, как и имена подписавших его чиновников. Министерство весь год отвечает на вопросы вместо того, чтобы проводить политику, и каждая фирма, имеющая с ним дело, ждёт, пока уляжется пыль."
 JAP_bank_under_public_ownership: "Банк в государственной собственности"
 JAP_bank_under_public_ownership_desc: "Государство владеет крупным банком и сменило его совет директоров. Кредитование возобновляется на условиях правительства: заёмщики этому рады, а министрам, которым приходится за это отвечать, это постоянный повод для неловкости."
 JAP_ring_of_fire: "Жизнь на Огненном кольце"
 JAP_ring_of_fire_desc: "Под Японским архипелагом сходятся четыре тектонические плиты, и здесь происходит пятая часть всех землетрясений мира магнитудой 6 и выше. Две трети жилого фонда построены до Закона о строительных стандартах 1981 года. Раз в несколько лет толчок раскалывает скоростную дорогу, сбрасывает с рельсов «Синкансэн» или останавливает завод, а бюджет на ликвидацию бедствий — постоянная статья государственных расходов.\n-------------\nЗемлетрясения будут и дальше обрушиваться на §Y[609.GetName]§!, §Y[610.GetName]§!, §Y[611.GetName]§!, §Y[613.GetName]§!, §Y[615.GetName]§!, §Y[616.GetName]§! и §Y[617.GetName]§!. Регион, в котором проведена §Y$JAP_seismic_retrofit_category$§!, будет лучше подготовлен к землетрясениям\n§GУдаление§!: все сейсмоопасные регионы прошли сейсмоукрепление и фокус §Y$JAP_reconstruction_completed_focus$§! выполнен."
 JAP_galapagos_syndrome_focus_idea: "Галапагосская наценка"
 JAP_galapagos_syndrome_focus_idea_desc: "Пока министерство спорит о сближении стандартов и коммерциализации, торговые представительства делают очевидное — продают разницу. Отечественные линии по производству чипов работают с наценкой, делегации по стандартизации продвигают японские спецификации за рубежом, а исследования технологических процессов не отстают. Такой расклад даёт время для решения, которое за ним стоит, но долго он не продлится."
 JAP_galapagos_openness_tt: "[JAP.GetFlag] §YОткрытость Японии§! $RIGHT|+=0$"
