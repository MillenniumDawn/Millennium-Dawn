 EH_any_controlled_state_1000_to_any_portal_TT: "Любое контролируемое состояние §Y[ROOT.GetNameWithFlag]§! или его союзника находится в зоне действия не более §Y1000 км.§! до любого §RPortal.§!"
 EH_drone_mission_unlock_TT: "Включает категорию решений §YDrone Mission§!, которая позволит подготовить и отправить разведывательную миссию к расположенному поблизости §RPortal§!. Успех этой операции предоставит дополнительную информацию о структуре §RPortal§!, что повысит эффективность войск в бою."
 EH_research_sites_enabled_TT: "Небольшое расстояние до §RPortals§! позволило создать §YResearch Sites§! на достаточно безопасном и эффективном расстоянии для сбора большего количества информации без особого риска.\n\nОдновременно можно поддерживать 10 §YResearch Sites§!, каждый из которых предоставляет бонус к исследованиям для специальных проектов, а также самых квалифицированных §YScientists§!, доступных для найма.\n\n§YResearch Sites§! могут быть захвачены силами §RChimera§!, поэтому стоит потратить некоторое время на их надлежащую защиту."
 EH_research_sites_limit_TT: "Активные исследовательские площадки §Y§!: [?EH_research_sites_constructed_var]/10"
 EH_add_research_site_TT: "Каждый новый объект §YResearch Site§! будет давать дополнительные бонусы к модификатору §YResearch Sites§!."
 EH_research_sites_cost_TT: "Создание нового исследовательского центра §YResearch Site§! обойдется в §R$$15 миллиардов§! плюс стоимость дополнительных обновлений."
 EH_research_sites_cost_scaling_TT: "Каждый активный §YИсследовательский сайт§! увеличивает стоимость строительства на §R5 миллиардов долларов§!."
 EH_research_sites_cost_scaling2_TT: "Каждый активный §YИсследовательский сайт§! увеличивает стоимость строительства на §R3 миллиарда долларов§!."
