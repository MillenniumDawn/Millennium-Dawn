 Sov_warsaw_pact.13.t: "동독의 무장 반란"
 Sov_warsaw_pact.13.d: "동독에서 무장 봉기가 일어났습니다. 바르샤바 조약의 재정 및 무기 지원을 받은 동독 군사 세력이 핵심 기관들을 장악하고 독일 민주공화국의 재수립을 선언했습니다. 반란군은 서독과의 재통일이 되돌려야 할 중대한 실수였다고 규탄합니다."
 Sov_warsaw_pact.13.a: "세계가 제3차 세계 대전의 문턱에 서 있는가?"
