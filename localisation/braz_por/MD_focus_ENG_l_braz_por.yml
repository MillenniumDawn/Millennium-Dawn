 ENG_scottish_union_settlement_referendum: "[GetYear] [SCO.GetFlag] Referendo do Acordo de União Escocês"
 ENG_scottish_union_settlement_referendum_desc: "Westminster levou a questão constitucional ao eleitorado escocês em seus próprios termos: um referendo de acordo cujo resultado conta para o mandato necessário a encerrar de vez a questão da devolução. A votação continua sendo uma votação, e os partidos separatistas fazem campanha contra ela com tudo o que têm. Uma rejeição decisiva da independência aprova este acordo. Qualquer coisa menos deixa a questão exatamente onde estava, com um governo que gastou seu crédito e perdeu.\n\nReferendos vencidos: §Y[?ENG_scottish_referendum_success|0]§!/§G3§!\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_north_irish_union_settlement_referendum: "[GetYear] [NIR.GetFlag] Referendo do Acordo de União Norte-Irlandês"
 ENG_north_irish_union_settlement_referendum_desc: "Westminster levou a questão constitucional ao eleitorado norte-irlandês em seus próprios termos: um referendo de acordo cujo resultado conta para o mandato necessário a encerrar de vez a questão da devolução. A votação continua sendo uma votação, e a política republicana faz campanha contra ela com tudo o que tem. Uma rejeição decisiva da independência aprova este acordo. Qualquer coisa menos deixa a questão exatamente onde estava, com um governo que gastou seu crédito e perdeu.\n\nReferendos vencidos: §Y[?ENG_north_irish_referendum_success|0]§!/§G3§!\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_welsh_union_settlement_referendum: "[GetYear] [WAS.GetFlag] Referendo do Acordo de União Galês"
 ENG_welsh_union_settlement_referendum_desc: "Westminster levou a questão constitucional ao eleitorado galês em seus próprios termos: um referendo de acordo cujo resultado conta para o mandato necessário a encerrar de vez a questão da devolução. A votação continua sendo uma votação, e os partidos separatistas fazem campanha contra ela com tudo o que têm. Uma rejeição decisiva da independência aprova este acordo. Qualquer coisa menos deixa a questão exatamente onde estava, com um governo que gastou seu crédito e perdeu.\n\nReferendos vencidos: §Y[?ENG_welsh_referendum_success|0]§!/§G3§!\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
