 SOV_afv_coax_machine_gun_2: "7,62 мм ПКТ"
 SOV_afv_coax_machine_gun_2_desc: "ПКТ — единый пулемёт с ленточным питанием под патрон 7,62×54 мм R с выступающей закраиной, созданный на базе пулемёта ПК/ПКМ."
 UKR_tank_diesel_engine_gen1: "V-54, 520 л.с."
 UKR_tank_diesel_engine_gen1_desc: "V-54 — это атмосферный двигатель V12, который использовался на танке Т-54.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели — это стандартные двигатели, используемые на танках.§!"
 UKR_tank_diesel_engine_gen2: "5TDF, 700 л.с."
 UKR_tank_diesel_engine_gen2_desc: "5TDF — это двухтактный многотопливный дизельный двигатель с высоким наддувом, жидкостным охлаждением, непосредственным впрыском топлива, противоположно расположенными поршнями и горизонтальными цилиндрами. Первоначально разработанный для Т-64, он также использовался в ранних версиях Т-72.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели являются стандартными двигателями, используемыми на танках§!"
 UKR_tank_diesel_engine_gen3: "5TDFM, 850 л.с."
 UKR_tank_diesel_engine_gen3_desc: "Двигатель 5TDFM — это модернизированная версия оригинального 5TDF, двухтактного многотопливного дизельного двигателя с высоким наддувом, жидкостным охлаждением, непосредственным впрыском топлива, оппозитными поршнями и горизонтальными цилиндрами. Первоначально разработанный для Т-64, он также использовался в ранних модификациях Т-72.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели — это стандартные двигатели, используемые на танках.§!"
 UKR_tank_diesel_engine_gen4: "KMDB 6TD-1, 1000 л.с."
 UKR_tank_diesel_engine_gen4_desc: "KMDB 6TD-1 — это двигатель украинского производства, первоначально использовавшийся в танках Т-80УД.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели — это стандартные двигатели, используемые на танках.§!"
 UKR_tank_diesel_engine_gen5: "KMDB 6TD-2, 1200 л.с."
 UKR_tank_diesel_engine_gen5_desc: "KMDB 6TD-2 — это двигатель украинского производства, первоначально использовавшийся в танках Т-84.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели — это стандартные двигатели, используемые на танках.§!"
 UKR_tank_diesel_engine_gen6: "KMDB 6TD-3, 1500 л.с."
 UKR_tank_diesel_engine_gen6_desc: "KMDB 6TD-3 — это предложенный в Украине танковый двигатель, модернизированная версия двигателя 6TD-2.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели — это стандартные двигатели, используемые на танках.§!"
 UKR_tank_diesel_engine_gen7: "KMDB 6TD-4, 1800 л.с."
 UKR_tank_diesel_engine_gen7_desc: "KMDB 6TD-4 — это предложенный в Украине танковый двигатель, существенно модифицированная версия двигателя 6TD-3.\n\n§GПодсказка дизайнера: Многотопливные дизельные двигатели — это стандартные двигатели, используемые на танках.§!"
 UKR_tank_gas_turbine_engine_gen1: "ГТД-3ТЛ"
 UKR_tank_gas_turbine_engine_gen1_desc: "ГТД-3ТЛ — это экспериментальный газотурбинный двигатель, который планировалось использовать в качестве основного двигателя для танка Т-64. Однако позже от этой идеи отказались в пользу дизельного двигателя.\n\n§GСовет конструктора: Газовые турбины обладают лучшим ускорением, чем дизельные двигатели, что улучшает маневренность транспортного средства. Однако их производство обходится дорого, и они потребляют много топлива. Используйте газовые турбины, если вам нужны быстроходные баки и вы можете обеспечить их топливом.§!"
 UKR_tank_gas_turbine_engine_gen2: "СГ-1000"
 UKR_tank_gas_turbine_engine_gen2_desc: "SG-1000 был оригинальным газотурбинным двигателем танка Т-80. Вскоре его заменили на улучшенную модель.\n\n§GСовет конструктора: Газовые турбины обладают лучшим ускорением, чем дизельные двигатели, что улучшает маневренность транспортного средства. Однако их производство обходится дорого, и они потребляют много топлива. Используйте газовые турбины, если вам нужны быстроходные баки и вы можете обеспечить их топливом.§!"
 UKR_tank_gas_turbine_engine_gen3: "ГТД-1000Т"
 UKR_tank_gas_turbine_engine_gen3_desc: "Газовая турбина GTD-1000T предназначена для танков Т-80А и Т-80Б. GTD-1000T более надежна и развивает немного большую мощность, чем более старая турбина SG-1000.\n\n§GСовет конструктора: Газовые турбины обладают лучшим ускорением, чем дизельные двигатели, что улучшает маневренность транспортного средства. Однако их производство обходится дорого, и они потребляют много топлива. Используйте газовые турбины, если вам нужны быстроходные баки и вы можете обеспечить их топливом.§!"
 UKR_tank_gas_turbine_engine_gen4: "ГТД-1250"
 UKR_tank_gas_turbine_engine_gen4_desc: "Двигатель GTD-1250 — это газотурбинный двигатель, используемый на танке Т-80 второго поколения, Т-80У. Газовая турбина поставляется в паре с меньшей по размеру газовой турбиной, которая выполняет функцию вспомогательной силовой установки.\n\n§GСовет конструктора: Газовые турбины обладают лучшим ускорением, чем дизельные двигатели, что улучшает маневренность транспортного средства. Однако их производство обходится дорого, и они потребляют много топлива. Используйте газовые турбины, если вам нужны быстроходные баки и вы можете обеспечить их топливом.§!"
 UKR_tank_composite_armor_gen1: "Комбинация К"
 UKR_tank_composite_armor_gen1_desc: "«Комбинация К» — это трёхслойная композитная броня, состоящая из внешнего и внутреннего слоев стали, среднего слоя стекловолокна, армированного пластиком (склотекстолита), и пакета керамических (предположительно корундовых) пластин. Впервые она была установлена на танк Т-64.\n\n§GПодсказка дизайнера: Композитная броня — стандартный вариант для современных основных боевых танков.§!"
 UKR_tank_composite_armor_gen2: "«Комбинация Б/КМ»"
 UKR_tank_composite_armor_gen2_desc: "«Комбинация Б» или «КМ» — усовершенствованный пятислойный комбинированный бронепакет, созданный на смену трёхслойной «Комбинации К» танка Т-64А. Вместо одного слоя наполнителя между двумя стальными листами новая схема использует чередующиеся слои стали и композитного материала, что улучшает защиту как от кинетических, так и от кумулятивных боеприпасов. Вариант КМ («Корунд-монолитный») появился на Т-64Б, а вариант Б («блочный») — на Т-80Б.\n\nПодсказка дизайнера: композитная броня — стандартный вариант для современных основных боевых танков!"
 UKR_afv_composite_armor_gen1: "Комбинация К"
 UKR_afv_composite_armor_gen1_desc: "«Комбинация К» — это трёхслойная композитная броня, состоящая из внешнего и внутреннего слоев стали, среднего слоя стекловолокна, армированного пластиком (склотекстолита), и пакета керамических (предположительно корундовых) пластин. Впервые она была установлена на танк Т-64.\n\n§GПодсказка дизайнера: Композитная броня — стандартный вариант для современных основных боевых танков.§!"
 UKR_afv_composite_armor_gen2: "«Комбинация Б/КМ»"
 UKR_afv_composite_armor_gen2_desc: "«Комбинация Б» или «КМ» — усовершенствованный пятислойный комбинированный бронепакет, созданный на смену трёхслойной «Комбинации К» танка Т-64А. Вместо одного слоя наполнителя между двумя стальными листами новая схема использует чередующиеся слои стали и композитного материала, что улучшает защиту как от кинетических, так и от кумулятивных боеприпасов. Вариант КМ («Корунд-монолитный») появился на Т-64Б, а вариант Б («блочный») — на Т-80Б.\n\nПодсказка дизайнера: композитная броня — стандартный вариант для современных основных боевых танков!"
 UKR_reactive_armor_gen1: "Контакт-1"
 UKR_reactive_armor_gen1_desc: "«Контакт-1» — это динамическая защита первого поколения, разработанная в Советском Союзе. Она состоит из двух взрывчатых веществ 4С20, расположенных между двумя стальными пластинами. «Контакт-1» обладает низкой чувствительностью и может быть активирован только кумулятивным зарядом.\n\n§GСовет от разработчика: динамическая защита (ДЗ) — это простой способ улучшить броню вашего танка.§!"
 UKR_reactive_armor_gen2: "Контакт-5"
 UKR_reactive_armor_gen2_desc: "«Контакт-5» — это динамическая защита второго поколения, разработанная в Советском Союзе. При детонации стальные пластины в блоках смещаются в стороны, создавая более длинный путь проникновения для падающих снарядов. Этот метод защиты также эффективен против кинетических проникающих снарядов.\n\n§GСовет от разработчика: динамическая защита (ДЗ) — это простой способ улучшить броню вашего танка.§!"
 UKR_reactive_armor_gen3: "Ниж"
 UKR_reactive_armor_gen3_desc: "«Ниж» (Knizh) — модульный комплекс динамической защиты 3-го поколения для танков украинского производства. Предназначен для защиты боевых машин и стационарных объектов от бронебойных снарядов, кумулятивных орудий и ударно-кумулятивных боеприпасов типа «ударный сердечник».\n\n§GСовет от разработчика: динамическая защита (ДЗ) — это простой способ улучшить броню вашего танка.§!"
 UKR_reactive_armor_gen4: "Дуплет"
 UKR_reactive_armor_gen4_desc: "«Дуплет» — модульный тандемный комплекс динамической защиты 3-го поколения для танков украинского производства. Модернизированная версия комплекса «Ниж»/«Нож». Предназначен для защиты боевых машин и стационарных объектов от артиллерийских кумулятивных снарядов калибра до 125 мм и тандемных кумулятивных орудий, ударно-кумулятивных боеприпасов типа «ударный сердечник», реактивных танковых гранат и цельнометаллических бронебойных снарядов докалиберного калибра с оперением.\n\n§GСовет от разработчика: динамическая защита (ДЗ) — это простой способ улучшить броню вашего танка.§!"
 UKR_smoothbore_atgm_gen1: "9K112 Кобра"
 UKR_smoothbore_atgm_gen1_desc: "9К112 «Кобра» — это советский противотанковый ракетный комплекс SACLOS. Он запускается из 125-мм основных орудий танков серий Т-64 и Т-80.\n\n§GПодсказка от разработчика: Оснастив наши танки возможностью запуска противотанковых управляемых ракет из основного орудия в дополнение к традиционным кинетическим боеприпасам, мы сможем повысить их способность поражать вражескую бронетехнику.§!"
 UKR_smoothbore_atgm_gen2: "Комбат"
 UKR_smoothbore_atgm_gen2_desc: " «Комбат» — это украинская противотанковая управляемая ракета с тандемной боевой частью, эффективная дальность стрельбы которой составляет 5000 м. Она запускается из 125-мм гладкоствольных орудий и имеет бронепробиваемость 950 мм.\n\n§GПодсказка от разработчика: Оснастив наши танки возможностью запуска противотанковых управляемых ракет из основного орудия в дополнение к традиционным кинетическим боеприпасам, мы сможем повысить их способность поражать вражескую бронетехнику.§!"
 UKR_smoothbore_atgm_gen3: "Конус"
 UKR_smoothbore_atgm_gen3_desc: "«Конус» — это украинская противотанковая управляемая ракета с тандемной боевой частью и эффективной дальностью стрельбы 5000 м, запускаемая из 120-мм гладкоствольных орудий. Она была предложена в качестве усовершенствования для соответствия стандартному калибру танковых орудий НАТО.\n\n§GПодсказка от разработчика: Оснастив наши танки возможностью запуска противотанковых управляемых ракет из основного орудия в дополнение к традиционным кинетическим боеприпасам, мы сможем повысить их способность поражать вражескую бронетехнику.§!"
 UKR_smoke_launchers: "3Д6"
 UKR_smoke_launchers_desc: "«Туча» — это 81-мм гранатомет, устанавливаемый на транспортные средства, разработанный в Советском Союзе. Он в основном используется для стрельбы дымовыми гранатами типа 3D6 и 3D6M.\n\n§GПодсказка от разработчика: добавление дымовых гранат снижает заметность нашего танка, делая его более эффективным как в обороне, так и в нападении.§!"
 UKR_smoke_launchers_2: "3Д6М"
 UKR_smoke_launchers_2_desc: "§Y«Хмара»§! — 81-мм гранатомёт, устанавливаемый на технику и представляющий собой локализованную версию системы дымовых гранатомётов «Туча». В основном применяется для стрельбы дымовыми гранатами типа 3Д6 и 3Д6М.\n\n§GПодсказка дизайнера: установка дымовых гранатомётов снижает заметность нашего танка, делая его лучше и в обороне, и в наступлении§!"
 UKR_smoke_launchers_3: "Варта"
 UKR_smoke_launchers_3_desc: "«Варта» — украинская оптико-электронная система противодействия, которая предупреждает о наведении высокоточных боеприпасов с помощью лазерной системы наведения и активирует развертывание дымовой/аэрозольной завесы вокруг танка. Эта система является активной защитой танков Т-84У «Оплот», «БМ Оплот» и Т-64Е.\n\n§GПодсказка от разработчика: добавление дымовых гранат снижает заметность нашего танка, делая его более эффективным как в обороне, так и в нападении.§!"
 UKR_hardkill_system_gen1: "«Заслон»"
 UKR_hardkill_system_gen1_desc: "«Заслон» — украинский комплекс активной защиты бронетехники. Разработан ГП БККТ «Микротек» совместно с другими украинскими предприятиями. Комплекс предназначен для защиты боевых машин от тонкостенных противотанковых средств, в частности противотанковых управляемых ракет и противотанковых гранат, кумулятивных средств поражения танковых и противотанковых орудий, а также бронебойных малокалиберных снарядов с оперением.\n\n§GПодсказка от разработчика: система поражения цели — хороший способ усилить броню наших танков и сделать её более прочной.§!"
 UKR_afv_machine_gun: "7,62-мм §YСГМТ§!"
 UKR_afv_machine_gun_desc: "§YСГ-43/СГМТ§! Горюнова — советский станковый пулемёт, принятый на вооружение во время Второй мировой войны. Он был рассчитан на патрон 7,62×54 мм R и поступил в войска в 1943 году на замену устаревшим пулемётам «Максим» образца 1910 года."
 UKR_afv_machine_gun_2: "14,5-мм §YКПВТ§!"
 UKR_afv_machine_gun_2_desc: "Крупнокалиберный пулемет §YКПВТ§! — это разработанный в Советском Союзе крупнокалиберный пулемет калибра 14,5×114 мм, впервые поступивший на вооружение пехоты (обозначение ПКП) в 1949 году. В 1960-х годах пехотная версия была снята с производства из-за своих больших размеров и веса. Позже он использовался в серии БТР."
 UKR_afv_coax_machine_gun: "7,62-мм §YСГМТ§!"
 UKR_afv_coax_machine_gun_desc: "§YСГ-43/СГМТ§! Горюнова — советский станковый пулемёт, принятый на вооружение во время Второй мировой войны. Он был рассчитан на патрон 7,62×54 мм R и поступил в войска в 1943 году на замену устаревшим пулемётам «Максим» образца 1910 года."
 UKR_afv_coax_machine_gun_2: "7,62-мм §YПКТ§!"
 UKR_afv_coax_autocannon_2: "2А7М"
 UKR_afv_coax_autocannon_3: "ЗТМ-1/2"
 UKR_afv_coax_machine_gun_2_desc: "§YПКТ§! — единый пулемёт с ленточным питанием под патрон 7,62×54 мм R с выступающей закраиной, созданный на базе пулемёта ПК/ПКМ."
 UKR_afv_atgm_gen1: "9М14 §Y«Малютка»§!"
 UKR_afv_atgm_gen1_desc: "9М14 §Y«Малютка»§! — первый советский переносной противотанковый ракетный комплекс и, вероятно, самый массовый ПТРК за всю историю."
 UKR_afv_atgm_gen2: "9М113 §Y«Конкурс»§!"
 UKR_afv_atgm_gen2_desc: "9М113 §Y«Конкурс»§! — противотанковая управляемая ракета второго поколения с полуавтоматическим командным наведением по линии визирования, созданная на замену устаревшей 9М14 «Малютка». Она отличается возросшей точностью, бронепробиваемостью и дальностью пуска, став одной из самых распространённых ПТУР Советской армии, а позже широко применялась Вооружёнными силами Украины."
 UKR_afv_atgm_gen3: "РК-2 §Y«Барьер»§!"
 UKR_afv_atgm_gen3_desc: "Украинская противотанковая ракета с лазерным наведением, разработанная КБ «Луч». Созданный для поражения современных основных боевых танков с динамической защитой, комплекс §Y«Барьер»§! обеспечивает более высокую точность, лучшую бронепробиваемость и современную интеграцию с системой управления огнём по сравнению с советскими ПТУР."
 UKR_afv_assault_gun: "73 мм 2A28 «Гром»"
 UKR_afv_assault_gun_desc: "2A28 Grom, также известный как КБП 2A28 Grom, — это 73-мм полуавтоматическое гладкоствольное орудие низкого давления с клиновидным затвором. Разработка 2A28 Grom была напрямую связана с разработкой безоткатного орудия САП-9; оба орудия стреляли снарядами, аналогичными реактивным гранатометам."
 UKR_afv_assault_gun_2: "100 мм 2А70"
 UKR_afv_assault_gun_2_desc: "100-мм орудие — пусковая установка 2А70 (индекс ГРАУ: 2А70) — семейство нарезных орудий низкого давления, разработанных в Советском Союзе Конструкторским бюро приборостроения (КБП)"
 UKR_afv_assault_gun_3: "90 мм Cockerill Mk 8 LP"
 UKR_afv_assault_gun_3_desc: "Cockerill Mk 8 — это бельгийская 90-мм танковая пушка низкого давления, разработанная компанией Cockerill для установки на лёгкую бронированную технику и башенные системы. В ней используется уменьшенный заряд пороха для уменьшения отдачи, при этом она способна стрелять различными 90-мм боеприпасами, включая фугасные, дымовые и противотанковые снаряды."
 UKR_small_autocannon: "30 мм 2А42"
 UKR_small_autocannon_desc: "Автомат Шипунова 2А42 — советская/российская 30-мм автоматическая пушка. Она производится акционерным обществом «Туламашзавод» и названа в честь А. Г. Шипунова."
 UKR_small_autocannon_2: "30 мм 2А72"
 UKR_small_autocannon_2_desc: "Облегчённый упрощённый вариант 2А42 с меньшим количеством деталей, более длинным стволом и более высокой начальной скоростью пули, но также и с меньшей скорострельностью. Он имеет длинный откатный механизм, а не газоотводный."
 UKR_small_autocannon_3: "30 мм ZTM-1/2"
 UKR_small_autocannon_3_desc: "Украинская 30-мм автоматическая пушка, разработанная на основе советской конструкции 2А42 и адаптированная для отечественного производства. Серия 3ТМ отличается улучшенным качеством изготовления, совместимостью с современными системами управления огнём и повышенной надёжностью, сохраняя при этом низкую отдачу и малый вес своего предшественника."
 UKR_tank_small_medium_cannon: "100-мм Д-10Т2С"
 UKR_tank_small_medium_cannon_desc: "Д-10 — советская танковая пушка, разработанная в конце Второй мировой войны и первоначально устанавливавшаяся на истребитель танков СУ-100. С началом холодной войны это орудие стало основным вооружением для танков серий Т-54 и Т-55.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 UKR_tank_small_medium_cannon_2: "115-мм У-5ТС"
 UKR_tank_small_medium_cannon_2_desc: "У-5ТС — первое гладкоствольное орудие, разработанное для танков. Существовавшее 100-мм орудие на Т-55 было слишком слабым для борьбы с новыми западными танками «Центурион» и «Паттон» М48. В ответ на появление этих танков Советский Союз разработал 115-мм орудие. Это орудие использовалось только на Т-62. Оно доказало свою эффективность даже против более современных танков, как это было показано в ирано-иракской войне, где Т-62 смог уничтожить гораздо более новые танки «Чифтейн» и «М60».\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 UKR_tank_small_medium_cannon_3: "100 мм 2А70"
 UKR_tank_small_medium_cannon_3_desc: "2А70 — это скорострельное нарезное орудие, предназначенное для лёгкой бронированной техники. Орудие в основном рассчитано на использование осколочно-фугасных снарядов. 2А70 является основным вооружением серии БМП-3.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 UKR_tank_medium_cannon: "125-мм 2А46"
 UKR_tank_medium_cannon_desc: "2А46 — наиболее распространённое из советских танковых орудий. Первоначально разработанное для Т-64, это орудие с тех пор используется на всех советских и российских танках, а также на многих зарубежных танках.\n\n§GПодсказка дизайнера: Орудия среднего калибра — сбалансированное танковое вооружение. Используйте их, если не хотите отдавать предпочтение ни атаке по пехоте, ни атаке по бронетехнике§!"
 UKR_tank_medium_cannon_2: "125-мм КБА3"
 UKR_tank_medium_cannon_2_desc: "КБА3 — 125-мм гладкоствольная танковая пушка, украинская модификация советской танковой пушки 2А46. Разработана Киевским артиллерийским конструкторским бюро. Производитель: Старокраматорский машиностроительный завод. Пушка предназначена для установки на основные боевые танки Т-80УД, Т-84 и БМ «Оплот», а также для модернизации Т-64.\n\n§GПодсказка дизайнера: Орудия среднего калибра — сбалансированное танковое вооружение. Используйте их, если не хотите отдавать предпочтение ни атаке по пехоте, ни атаке по бронетехнике§!"
 UKR_tank_medium_cannon_3: "120-мм КБМ2"
 UKR_tank_medium_cannon_3_desc: "КБМ2 — 120-мм гладкоствольная пушка, использующая стандартные боеприпасы калибра 120 мм НАТО. Первоначально она была разработана Киевским артиллерийским конструкторским бюро для основного боевого танка Т-84-120 «Ятаган».\n\n§GПодсказка дизайнера: Орудия среднего калибра — сбалансированное танковое вооружение. Используйте их, если не хотите отдавать предпочтение ни атаке по пехоте, ни атаке по бронетехнике§!"
 UKR_tank_large_cannon: "130-мм М-65 Л/60"
 UKR_tank_large_cannon_desc: "Экспериментальное орудие для тяжелого танка, предназначенное для использования с тяжелым штурмовым танком «Объект 279 Котин», способным выдерживать ядерный взрыв. Поскольку потребность в тяжелых танках отпала, проект был отменен, а вместе с ним и само орудие.\n\n§GПодсказка дизайнера: Тяжёлые орудия предназначены в первую очередь для борьбы с бронетехникой. Используйте их, если хотите сделать упор на атаку по бронетехнике, сохранив при этом некоторую атаку по пехоте§!"
 UKR_tank_large_cannon_2: "140-мм 55Л §Y«Багира»§!"
 UKR_tank_large_cannon_2_desc: "55Л «Багира» — экспериментальное танковое орудие, разработанное и производимое Киевским артиллерийским конструкторским бюро для вооружения перспективных и модернизации существующих танков. Длина ствола нового орудия составляет 55 калибров.\n\n§GПодсказка дизайнера: Тяжёлые орудия предназначены в первую очередь для борьбы с бронетехникой. Используйте их, если хотите сделать упор на атаку по бронетехнике, сохранив при этом некоторую атаку по пехоте§!"
 UKR_tank_very_large_cannon: "152-мм 2А73"
 UKR_tank_very_large_cannon_desc: "152-мм гладкоствольное орудие 2А73, разработанное ОКБ-6 (Центральным научно-исследовательским институтом «Буревестник»), предназначалось для использования в экспериментальных танках Объект 477 «Боксер»/«Молот»/«Нота» и Объект 490 «Тополь».\n\n§GПодсказка дизайнера: Сверхтяжёлые орудия предназначены для борьбы с бронетехникой. Используйте их, если хотите сделать значительный упор на атаку по бронетехнике в ущерб атаке по пехоте§!"
 UKR_tank_battlestation_1: "1А33 §Y«Обь»§!"
 UKR_tank_battlestation_1_desc: "В состав системы управления огнем 1A33 Ob входили ПДПС 1ОП73, баллистический вычислитель танка 1В517, прицел 1Г43, датчики ввода информации и комплекс 1А34.\n\n§GПодсказка для конструктора: Боевая станция представляет собой системы стрельбы, управления огнём, оптики и другого вспомогательного оборудования, необходимого для работы танка. Улучшенная боевая станция повысит общее качество вашего танка.§!"
 UKR_tank_battlestation_2: "1А43У §Y«Рось»§!"
 UKR_tank_battlestation_2_desc: "Прицельный комплекс 1А43У «Рос» включает в себя дальномер, устройство наведения 1Г46 с электрическим блоком, блок авторизации выстрела и баллистический калькулятор танка 1В528-2.\n\n§GПодсказка для конструктора: Боевая станция представляет собой системы стрельбы, управления огнём, оптики и другого вспомогательного оборудования, необходимого для работы танка. Улучшенная боевая станция повысит общее качество вашего танка.§!"
 UKR_tank_battlestation_2_thermal: "1А45 §Y«Иртыш»§!"
 UKR_tank_battlestation_3: "§YSAVAN-15§!"
 UKR_tank_battlestation_3_desc: "«Саван-15» — это французский прицельный комплекс, который еще в 2000-х годах предлагалось использовать на основных боевых танках украинского производства.\n\n§GПодсказка для конструктора: Боевая станция представляет собой системы стрельбы, управления огнём, оптики и другого вспомогательного оборудования, необходимого для работы танка. Улучшенная боевая станция повысит общее качество вашего танка.§!"
 UKR_tank_aux_engine: "АЭА-8"
 UKR_tank_aux_engine_desc: "АЭА-8 — дизельная вспомогательная силовая установка мощностью 8 кВт. Установка включает в себя двухцилиндровый V-образный дизельный двигатель с жидкостным охлаждением и генератор постоянного тока. ВСУ предназначена для обеспечения электропитанием танка при выключенном двигателе, например, когда танк находится в стационарной огневой позиции или в засаде.\n\n§GПодсказка дизайнера: Установка вспомогательного двигателя наиболее эффективна на двигателях, потребляющих большое количество топлива, таких как газотурбинные двигатели.§!"
 UKR_tank_aux_engine_2: "АЭА-10"
 UKR_tank_aux_engine_2_desc: "АЭА-10 — дизельная вспомогательная силовая установка мощностью 10 кВт. Установка включает в себя двухцилиндровый V-образный дизельный двигатель с жидкостным охлаждением и генератор постоянного тока. ВСУ предназначена для обеспечения электроэнергией танка при выключенном двигателе, например, когда танк находится в стационарной огневой позиции или в засаде.\n\n§GПодсказка дизайнера: Установка вспомогательного двигателя наиболее эффективна на двигателях, потребляющих большое количество топлива, таких как газотурбинные двигатели.§!"
