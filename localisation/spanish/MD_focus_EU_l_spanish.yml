 EDU: "Unión de Defensa Europea"
 EDU_desc: "La Unión de Defensa Europea (UDE) es el brazo militar de la Política Común de Seguridad y Defensa (PCSD) de la Unión Europea (UE)."
 EU_council_category: "Consejo Europeo / Consejo de la Unión Europea"
 EU_council_category_desc: "Actos Legales de la Unión Europea\n\n§YNombre§! - Tipo de Mayoría - Estado - Predicción de Votación:\n§CSÍ:§! §CVotos§! - §CRatio del Total de la UE§! - Estados Miembros\n§gIndecidido:§! §gVotos§! - §gRatio del Total de la UE§! - Estados Miembros\n§RNO:§! §RVotos§! - §RRatio del Total de la UE§! - Estados Miembros\n"
