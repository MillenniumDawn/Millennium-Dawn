 the_great_australia_act_desc: "Возможно, это самая масштабная программа социальных реформ в истории нашей страны. Масштабное начинание, направленное на улучшение равенства в Австралии и вывод миллионов людей из нищеты. Программа включает в себя широкий охват социальных программ, пересмотр критериев получения помощи и масштабов охвата, увеличение выплат и ряд программ, призванных помочь малоимущим австралийцам добиться успеха."
