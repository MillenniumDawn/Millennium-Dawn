 module_naval_surface_fusion_engine_1: "Moteur de fusion de surface I"
 module_naval_surface_fusion_engine_1_desc: "Les moteurs à fusion de surface offrent une propulsion navale avancée par génération d'énergie à haute densité, délivrant une endurance exceptionnelle et une portée navale étendue avec une meilleure fiabilité opérationnelle.\n\n§GIndice du concepteur : la propulsion à fusion offre vitesse, portée maximale, fiabilité exceptionnelles et un fonctionnement sans carburant. Idéale pour les flottes mondiales de premier rang, mais porte un coût de production élevé.§!"
 module_naval_surface_fusion_engine_2: "Moteur de fusion de surface II"
 module_naval_surface_fusion_engine_2_desc: "$module_naval_surface_fusion_engine_1_desc$"
