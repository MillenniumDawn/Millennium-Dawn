 ukraine_nuclear_power_plants.1.name: "Complete shutdown of Chornobyl Nuclear Power Plant"
 ukraine_nuclear_power_plants.1.desc: "On March 29, 2000, the Cabinet of Ministers of Ukraine decided to prematurely decommission power unit No. 3 and finally close the Chornobyl NPP by the end of 2000.\nOn 15 December 2000, reactor No. 3 was shut down after operating briefly since March 1999 following almost three months of repairs, and the plant as a whole ceased producing electricity.\nA new steel containment structure named the §YNew Safe Confinement§! is planned to be built to replace the aging and hastily built sarcophagus that protected ruined reactor No. 4.\nThe §YNew Safe Confinement§! is planned to be financed by an international fund managed by the European Bank for Reconstruction and Development and was designed and built by the French-led consortium Novarka."
 ukraine_nuclear_power_plants.1.a: "Stop it forever"
 ukraine_nuclear_power_plants_flag: "The Chornobyl Nuclear Power Plant is closed."
 ukr_history.1.t: "The Disappearance of Georgiy Gongadze"
 ukr_history.1.d: "Georgiy Gongadze, founder of the online newspaper Ukrainska Pravda and one of the sharpest critics of the presidential administration, has vanished in Kyiv. His mother has filed a missing person report; his colleagues are already saying openly that the authorities are behind it. If a body turns up, this will not stay a police matter."
 ukr_history.1.a: "Let the police handle it in the usual way."
 ukr_history.1.b: "Order a genuine investigation and keep the press informed."
 ukr_history.2.t: "The Cassette Scandal"
 ukr_history.2.d: "From the rostrum of the Verkhovna Rada, Socialist leader Oleksandr Moroz has played recordings made in the president's own office by a member of the state guard, Mykola Melnychenko. On the tapes a voice resembling the president's demands that Gongadze be dealt with. Moroz has turned himself overnight from a fading left-wing politician into the face of the opposition."
 ukr_history.2.a: "Deny everything and question the tapes."
 ukr_history.2.b: "Say nothing and wait for the storm to pass."
 ukr_history.3.t: "Ukraine Without Kuchma"
 ukr_history.3.d: "A permanent protest camp has appeared on Independence Square. It began with fifty people and within two days there were tens of thousands. For the first time the left, the centre and the nationalists are standing on the same square under the same slogan. The organisers say they will not leave until the president resigns."
 ukr_history.3.a: "Ignore them; the cold will do our work."
 ukr_history.3.b: "Open negotiations with the protest committee."
 ukr_history.4.t: "The Clashes on Bankova Street"
 ukr_history.4.d: "A column of ten to fifteen thousand marched on the presidential administration on the anniversary of Shevchenko's birth. Bankova Street saw the worst street fighting since independence. By evening the police had destroyed the UNA-UNSO headquarters and hundreds were under arrest. The camp on the square is gone, but so is any pretence that this government governs by consent."
 ukr_history.4.a: "So be it."
 ukr_history.5.t: "The Rada Dismisses the Yushchenko Government"
 ukr_history.5.d: "Two hundred and sixty three deputies have voted no confidence in the cabinet of Viktor Yushchenko. Communists and the oligarchic centre voted together: the left hated his market reforms, the business groups hated that he had stopped the barter schemes in the energy sector. The most popular prime minister in the country's history leaves office with his reputation intact and no office to lose it in."
 ukr_history.5.a: "So be it."
 ukr_history.6.t: "Yushchenko Announces a Bloc"
 ukr_history.6.d: "The dismissed prime minister has declared that he will lead an electoral bloc into next year's parliamentary election. Ten national-democratic and liberal parties are already negotiating the list. The bloc has no programme yet and no structure, but it has something no other force has: a leader whom most of the country still trusts."
 ukr_history.6.a: "So be it."
 ukr_history.7.t: "For United Ukraine!"
 ukr_history.7.d: "Five parties of power have been assembled into a single electoral bloc around the president: the People's Democrats, Labour Ukraine, the Party of Regions, the Agrarians and the Industrialists. What holds it together is not ideology but the administrative resource - governors, tax inspectors and state television. The regional bosses have been told what result is expected of them."
 ukr_history.7.a: "So be it."
 ukr_history.8.t: "The 2002 Parliamentary Election"
 ukr_history.8.d: "Yushchenko's bloc took first place on the party list with twenty three per cent. For United Ukraine took barely twelve - and then collected a hundred seats in the single-mandate districts, where governors decide what the ballot boxes say. The Communists have lost half their vote. Six forces enter the new Rada."
 ukr_history.8.a: "So be it."
 ukr_history.9.t: "Lytvyn Elected Speaker"
 ukr_history.9.d: "After two months of deadlock the head of the presidential administration, Volodymyr Lytvyn, has been elected chairman of the Verkhovna Rada. The opposition had the larger vote in the country; the president had the larger vote in the chamber. Lytvyn will spend the next years as the man both sides need and neither side trusts."
 ukr_history.9.a: "So be it."
 ukr_history.10.t: "For United Ukraine Dissolves"
 ukr_history.10.d: "The bloc that won the districts has broken into its component parts. Nine separate factions now sit where one stood: the Party of Regions, Labour Ukraine, the People's Democrats, the Agrarians and the rest, each with its own leader and its own price. The Donetsk group is the largest of them and is no longer anyone's junior partner."
 ukr_history.10.a: "So be it."
 ukr_history.11.t: "Rise Up, Ukraine!"
 ukr_history.11.d: "On the second anniversary of Gongadze's disappearance the opposition has brought its supporters back onto the streets - this time with Yushchenko, Tymoshenko, Moroz and Symonenko on the same platform. The four have almost nothing in common except the demand that the president go. Tents are going up on Khreshchatyk again."
 ukr_history.11.a: "So be it."
 ukr_history.12.t: "The Death of Slava Stetsko"
 ukr_history.12.d: "Yaroslava Stetsko, widow of the man who proclaimed the restoration of Ukrainian statehood in Lviv in 1941 and the living link between the wartime nationalist underground and today's parliament, has died at the age of eighty three. The Congress of Ukrainian Nationalists must now find a leader who is not a symbol."
 ukr_history.12.a: "So be it."
 ukr_history.13.t: "Yanukovych Takes the Party of Regions"
 ukr_history.13.d: "The prime minister has been elected chairman of the Party of Regions. Until now the party was one Donetsk business group among several; from today it is the political arm of the man the president intends to leave the office to. Rinat Akhmetov's people are moving into the party's regional structures."
 ukr_history.13.a: "So be it."
 ukr_history.14.t: "Tarasyuk Takes the People's Movement"
 ukr_history.14.d: "Borys Tarasyuk, the former foreign minister who negotiated the charter with NATO, has been elected leader of Rukh. The party that made independence is now a small professional caucus of diplomats and intellectuals, and it has decided that its future lies inside Yushchenko's bloc rather than beside it."
 ukr_history.14.a: "So be it."
 ukr_history.15.t: "The Single Economic Space"
 ukr_history.15.d: "The president has signed the agreement on a Single Economic Space with Russia, Belarus and Kazakhstan in Yalta. The text speaks of a customs union and a supranational commission where votes are weighted by economic size - which means Moscow decides. The Rada ratified it with the votes of the Communists and the party of power together."
 ukr_history.15.a: "Sign it - the east pays our bills."
 ukr_history.15.b: "Sign it, but ratify only the free trade chapter."
 ukr_history.16.t: "The Court Opens the Door to a Third Term"
 ukr_history.16.d: "The Constitutional Court has ruled that the president's first term, served under the old constitution, does not count. He may stand again next year. Nobody in Kyiv believes the judges reached this conclusion unaided, and nobody believes he will actually use it - but the ruling has told the opposition exactly what it is dealing with."
 ukr_history.16.a: "So be it."
 ukr_history.17.t: "The Social-National Party Becomes Svoboda"
 ukr_history.17.d: "At its congress in Lviv the Social-National Party of Ukraine has renamed itself the All-Ukrainian Union Svoboda, dropped the Wolfsangel from its banner and elected Oleh Tyahnybok as its leader. The rhetoric has been sanded down and the party is now aiming at voters who would never have joined a paramilitary organisation."
 ukr_history.17.a: "So be it."
 ukr_history.18.t: "The Political Reform Fails by Six Votes"
 ukr_history.18.d: "The constitutional amendment that would have turned the presidency into a ceremonial office fell six votes short. The president's people wanted it as an insurance policy against losing the election; Yushchenko's camp voted it down because they expect to win the office as it stands. Both sides have just told the country what they think their chances are."
 ukr_history.18.a: "So be it."
 ukr_history.19.t: "Lytvyn Takes the Agrarians"
 ukr_history.19.d: "The speaker of parliament has been elected head of the Agrarian Party, which is renaming itself the People's Agrarian Party. Lytvyn is building himself a machine in the villages - the one part of the country where neither the Donetsk group nor the orange camp has much to offer."
 ukr_history.19.a: "So be it."
 ukr_history.20.t: "The Force of the People"
 ukr_history.20.d: "Yushchenko and Tymoshenko have signed a coalition agreement. She stands down from the presidential race and campaigns for him; if he wins, she becomes prime minister. Two camps that spent three years competing for the same protest vote have decided that one of them must be the candidate and the other the government."
 ukr_history.20.a: "So be it."
 ukr_history.21.t: "Yushchenko Expels Tyahnybok"
 ukr_history.21.d: "After a speech at a partisan grave in the Carpathians in which Tyahnybok praised those who fought \"the Moskali, the Germans, the Yids\", Our Ukraine has expelled him from its parliamentary faction. Yushchenko has protected his campaign from a fatal quotation and handed Svoboda the martyrdom it needed to become a party in its own right."
 ukr_history.21.a: "So be it."
 ukr_history.22.t: "The Poisoning"
 ukr_history.22.d: "The opposition candidate has been taken to a clinic in Vienna. The diagnosis is dioxin poisoning at a concentration a thousand times normal, administered at a dinner with the deputy head of the security service. He will survive and his face will not. He returns to the campaign disfigured, and every voter now sees what was done to him."
 ukr_history.22.a: "Call it food poisoning and move on."
 ukr_history.22.b: "Open a criminal case and let it run."
 ukr_history.23.t: "The First Round"
 ukr_history.23.d: "Thirty nine per cent for the opposition candidate, thirty nine for the prime minister - a difference of a few tenths of a percent. The Communist vote has collapsed from a quarter of the country to five per cent, absorbed by the two poles. Everyone else is irrelevant. Three weeks to the run-off."
 ukr_history.23.a: "So be it."
 ukr_history.24.t: "The Rada Declares the Run-off Invalid"
 ukr_history.24.d: "Three hundred and seven deputies have voted that the second round did not reflect the will of the voters, and two hundred and twenty nine have voted no confidence in the government. Neither vote is legally binding. Both told the security services and the regional administrations which way the wind was blowing, which was the point."
 ukr_history.24.a: "So be it."
 ukr_history.25.t: "Tihipko Walks Out of the Campaign"
 ukr_history.25.d: "The head of the National Bank and manager of the prime minister's campaign has resigned from the campaign and from the bank. Labour Ukraine, the Dnipropetrovsk party he built with Viktor Pinchuk, is disintegrating behind him as its deputies look for somewhere safer to stand."
 ukr_history.25.a: "So be it."
 ukr_history.26.t: "The Supreme Court Annuls the Run-off"
 ukr_history.26.d: "The Supreme Court has ruled the second round invalid and ordered a repeat vote for the twenty sixth of December. For the first time a Ukrainian court has decided a presidential election against the incumbent's candidate, and the decision was read out live to a square full of people."
 ukr_history.26.a: "So be it."
 ukr_history.27.t: "Law 2222 - The Package Vote"
 ukr_history.27.d: "The compromise has been voted as a single package: the repeat election in exchange for the constitutional reform. From 2006 the parliament appoints the government and the president keeps foreign affairs and defence. Whoever wins this election will win a smaller office than the one he was fighting for."
 ukr_history.27.a: "So be it."
 ukr_history.28.t: "Our Ukraine Becomes a Party"
 ukr_history.28.d: "The bloc that won the presidency has held its founding congress as a single party: the People's Union Our Ukraine. Roman Bezsmertnyi, the president's campaign manager, takes the chair. Several of the ten member parties have refused to dissolve into it, and the coalition that made the revolution is already one party smaller than it was in December."
 ukr_history.28.a: "So be it."
 ukr_history.29.t: "The Orange Camp Breaks"
 ukr_history.29.d: "The president has dismissed the entire government. The head of the security council accused the prime minister's circle of corruption on live television; she answered that the president's own entourage was the problem. Eight months after the square, the two people who stood on it together are running against each other."
 ukr_history.29.a: "Dismiss them all and start again."
 ukr_history.29.b: "Keep the prime minister and sack the accusers instead."
 ukr_history.30.t: "The Memorandum With Yanukovych"
 ukr_history.30.d: "Unable to confirm a new prime minister with orange votes alone, the president has signed a memorandum of understanding with the man he defeated. The Party of Regions abstains, Yurii Yekhanurov is confirmed by three votes, and criminal cases against election officials quietly stop. The revolution has bought its own government from the people it overthrew."
 ukr_history.30.a: "So be it."
 ukr_history.31.t: "The 2006 Parliamentary Election"
 ukr_history.31.d: "The first fully proportional election. The Party of Regions took thirty two per cent, the Tymoshenko Bloc twenty two, Our Ukraine fourteen - third place for the president's own party one year after his victory. The Socialists and Communists scraped in. Nobody has a majority and everybody has a veto."
 ukr_history.31.a: "So be it."
 ukr_history.32.t: "The Coalition of Democratic Forces"
 ukr_history.32.d: "After three months the orange partners have signed: the Tymoshenko Bloc, Our Ukraine and the Socialists, two hundred and forty three votes, with Tymoshenko as prime minister. The agreement took longer to write than the government will last."
 ukr_history.32.a: "So be it."
 ukr_history.33.t: "Moroz Takes the Chair"
 ukr_history.33.d: "The Socialist leader has been elected speaker with the votes of the Party of Regions and the Communists - the two parties he spent the last six years denouncing. The orange coalition collapsed the same afternoon. Within a day the Anti-Crisis Coalition existed and Moroz had become the most hated man in half the country."
 ukr_history.33.a: "So be it."
 ukr_history.34.t: "The Universal of National Unity"
 ukr_history.34.d: "The president has signed a declaration of principles with the Anti-Crisis Coalition and nominated the man he beat in 2004 as prime minister. Our Ukraine joins the government that Our Ukraine's voters were told they had defeated. Twenty months after the square, Yanukovych is back in the building he was thrown out of."
 ukr_history.34.a: "Sign - the alternative is another election."
 ukr_history.34.b: "Refuse and dissolve the Rada now."
 ukr_history.35.t: "Our Ukraine Goes Into Opposition"
 ukr_history.35.d: "The president's party has walked out of the government it joined two months ago. Its ministers resign, its deputies move to the opposition benches, and the country is told that the Universal of National Unity was a misunderstanding. The Anti-Crisis Coalition does not need them and says so."
 ukr_history.35.a: "So be it."
 ukr_history.36.t: "Reforms and Order Joins the Tymoshenko Bloc"
 ukr_history.36.d: "Viktor Pynzenyk's market liberals, who spent the nineties writing every serious reform programme the country ignored, have folded themselves into the Tymoshenko Bloc. The liberal wing of the orange camp no longer exists as a separate address."
 ukr_history.36.a: "So be it."
 ukr_history.37.t: "The Coalition Buys Its Majority"
 ukr_history.37.d: "The Anti-Crisis Coalition has renamed itself the Coalition of National Unity and started collecting individual deputies from the opposition benches, one by one, at a price nobody discusses in public. At three hundred votes it can override the president and rewrite the constitution. It is eleven short."
 ukr_history.37.a: "So be it."
 ukr_history.38.t: "The President Dissolves the Rada"
 ukr_history.38.d: "Rather than watch the coalition reach three hundred, the president has dissolved parliament by decree. The coalition says the decree is unconstitutional and keeps sitting. For two months the country has two legitimate authorities, three heads of the Constitutional Court and one interior ministry that answers to nobody in particular."
 ukr_history.38.a: "Dissolve them - it is that or lose the office."
 ukr_history.38.b: "Accept the coalition and keep what powers remain."
 ukr_history.39.t: "Our Ukraine - People's Self-Defence"
 ukr_history.39.d: "The president's party is going into the snap election inside a wider bloc with Yurii Lutsenko's People's Self-Defence, built out of the ministry of interior officers he brought with him. Nine parties on one list, held together by the fear of running separately."
 ukr_history.39.a: "So be it."
 ukr_history.40.t: "The Lytvyn Bloc"
 ukr_history.40.d: "The former speaker has registered his own bloc for the snap election. It has no programme worth reading and no enemies worth naming, which is the point: whoever wins, Lytvyn intends to be the votes they are short of."
 ukr_history.40.a: "So be it."
 ukr_history.41.t: "The Congress of Ukrainian Nationalists Stands Down"
 ukr_history.41.d: "Unable to clear the three per cent threshold alone and refused a place on Our Ukraine's list, the Congress of Ukrainian Nationalists has announced it will not contest the election. The oldest nationalist party in the country leaves the field to Svoboda."
 ukr_history.41.a: "So be it."
 ukr_history.42.t: "Medvedchuk Steps Back"
 ukr_history.42.d: "The Social Democratic Party (united), once the machine that ran the presidential administration, has replaced Viktor Medvedchuk with Yurii Zahorodniy. The party polls below one per cent. Its former leader is not retiring from politics - he is changing which country he does it for."
 ukr_history.42.a: "So be it."
 ukr_history.43.t: "The Snap Election"
 ukr_history.43.d: "The Party of Regions took thirty four per cent and lost anyway: the Tymoshenko Bloc climbed to thirty one, and with Our Ukraine-People's Self-Defence the orange side has two hundred and twenty seven seats. A majority of two."
 ukr_history.43.a: "So be it."
 ukr_history.44.t: "The Orange Coalition, Again"
 ukr_history.44.d: "The Tymoshenko Bloc and Our Ukraine-People's Self-Defence have signed a coalition agreement with a majority of two votes. Everyone involved knows that two votes is not a majority, it is a hostage situation."
 ukr_history.44.a: "So be it."
 ukr_history.45.t: "Tymoshenko Returns to the Cabinet"
 ukr_history.45.d: "On the second attempt, and by a single vote, the Rada has confirmed Yulia Tymoshenko as prime minister. She promises to return the savings lost in the Soviet collapse and to reprivatise what was stolen. The president who appointed her has already begun looking for ways to remove her."
 ukr_history.45.a: "So be it."
 ukr_history.46.t: "Baloha Builds United Centre"
 ukr_history.46.d: "The head of the presidential secretariat has converted a dormant party into United Centre and begun moving the president's regional networks into it. Officially it supports the president. In practice it is an insurance policy against Our Ukraine, and everyone in Our Ukraine knows it."
 ukr_history.46.a: "So be it."
 ukr_history.47.t: "The Coalition Is Declared Dead"
 ukr_history.47.d: "Our Ukraine-People's Self-Defence has walked out after the Tymoshenko Bloc voted with the Party of Regions to cut presidential powers. The speaker has announced from the rostrum that the coalition has ceased to exist. Thirty days to build a new one or face another election."
 ukr_history.47.a: "So be it."
 ukr_history.48.t: "The Election That Never Happened"
 ukr_history.48.d: "The president has dissolved parliament again and set a vote for the seventh of December. There is no money in the treasury to pay for it, the courts have blocked the decree, and the world financial crisis has arrived in the same month. The election is quietly abandoned."
 ukr_history.48.a: "So be it."
 ukr_history.49.t: "The Crisis Arrives"
 ukr_history.49.d: "The hryvnia has lost almost half its value against the dollar since summer. Steel exports, which paid for everything, have collapsed with world demand. The government has signed for sixteen billion dollars from the Fund and the conditions attached will be paid for by people who never saw the boom."
 ukr_history.49.a: "Take the Fund's money and its conditions."
 ukr_history.49.b: "Refuse the conditions and print what we need."
 ukr_history.50.t: "The President Takes His Party"
 ukr_history.50.d: "With his approval rating in single figures, the president has finally taken formal leadership of Our Ukraine. It is a rescue attempt for a party that has lost its regional structures to United Centre and its voters to everyone else."
 ukr_history.50.a: "So be it."
 ukr_history.51.t: "The Coalition With Lytvyn"
 ukr_history.51.d: "A new majority has been assembled: the Tymoshenko Bloc, Our Ukraine-People's Self-Defence and the Lytvyn Bloc, with Lytvyn back in the speaker's chair as the price. Twenty deputies now decide who governs the country."
 ukr_history.51.a: "So be it."
 ukr_history.52.t: "The Gas War"
 ukr_history.52.d: "For nineteen days in January the transit stopped and half of Europe went cold. The prime minister flew to Moscow and signed a ten-year contract personally, without the president's approval and without her own delegation in the room. The price formula in that contract will be used against her for the rest of her career."
 ukr_history.52.a: "Sign - the country cannot freeze."
 ukr_history.52.b: "Hold out for a better formula."
 ukr_history.53.t: "Svoboda Wins Ternopil"
 ukr_history.53.d: "In a snap election to the Ternopil regional council, Svoboda took thirty five per cent and first place. A party that polled under one per cent nationally two years ago now runs a region. Galicia has stopped voting for the orange parties and started voting against everyone."
 ukr_history.53.a: "So be it."
 ukr_history.54.t: "The Worst Year"
 ukr_history.54.d: "Industrial output is down by a third, the economy will contract by fifteen per cent this year, and wage arrears are back for the first time since the nineties. Whoever wins the presidential election in January will inherit a country that has stopped believing the last five years were worth it."
 ukr_history.54.a: "So be it."
 ukr_history.55.t: "Tihipko Comes Back"
 ukr_history.55.d: "The former central banker has renamed the Labour Party of Ukraine as Strong Ukraine and is running for president on competence rather than language or history. He will not win, but the third of the electorate that wants neither camp has finally been given an address."
 ukr_history.55.a: "So be it."
 ukr_history.56.t: "The First Round of 2010"
 ukr_history.56.d: "Yanukovych thirty five per cent, Tymoshenko twenty five, Tihipko thirteen, Yatsenyuk seven. The incumbent president took five point four - the worst result any sitting president has ever recorded anywhere. The Orange Revolution has been voted out by the people who made it."
 ukr_history.56.a: "So be it."
 ukr_history.57.t: "Stability and Reforms"
 ukr_history.57.d: "The new majority has been assembled by a method the constitution does not obviously allow: individual deputies joining a coalition rather than whole factions. The Constitutional Court will bless it within a month. Mykola Azarov becomes prime minister and the Party of Regions holds the presidency, the government and the Rada at once."
 ukr_history.57.a: "So be it."
 ukr_history.58.t: "Azarov Takes the Party Chair"
 ukr_history.58.d: "With Yanukovych moved to the presidency, the prime minister has formally taken over the Party of Regions. The party is now an extension of the cabinet, and the Donetsk business groups that built it are collecting their share of the state."
 ukr_history.58.a: "So be it."
 ukr_history.59.t: "Yatsenyuk's Front for Change"
 ukr_history.59.d: "After a respectable fourth place in the presidential election, Arseniy Yatsenyuk has turned his campaign into a party. Front for Change offers technocratic competence and European integration to voters who are finished with both 2004 camps."
 ukr_history.59.a: "So be it."
 ukr_history.60.t: "The Court Undoes 2004"
 ukr_history.60.d: "The Constitutional Court has ruled the 2004 political reform unconstitutional on procedural grounds and restored the 1996 constitution overnight. The president who took office under a parliamentary republic now governs a presidential one, without a single vote being taken in the Rada."
 ukr_history.60.a: "So be it."
 ukr_history.61.t: "The Local Elections"
 ukr_history.61.d: "The Party of Regions has taken the south and east and most of the centre. In Galicia Svoboda came first in all three regional councils. Our Ukraine has been wiped off the map it drew in 2004, and the space it occupied now belongs to a party that was on one per cent three years ago."
 ukr_history.61.a: "So be it."
 ukr_history.62.t: "The Tax Maidan"
 ukr_history.62.d: "Small traders and entrepreneurs have put tents back on Independence Square against the new tax code. There are no party flags on the square and the organisers have asked politicians to stay away. The president vetoed the worst provisions and the camp was cleared at night anyway."
 ukr_history.62.a: "Veto the code and clear the square."
 ukr_history.62.b: "Push the code through unchanged."
