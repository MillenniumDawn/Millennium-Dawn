 KOR_samsung_global_galaxy_ecosystem_desc: "Samsung's devices connect displays, components, software, and global distribution into a durable consumer platform."
 KOR_samsung_disciplined_diversified_champion: "Disciplined Diversified Champion"
 KOR_samsung_disciplined_diversified_champion_desc: "Balanced governance and broad technical depth sustain Samsung even without one dominant strategic route."
