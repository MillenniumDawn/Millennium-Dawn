 heavy_util_vehicle_type_desc: "Машина, устойчивая к минным взрывам и защищённая от засад (MRAP), предназначенная для защиты от самодельных взрывных устройств и огня из стрелкового оружия при перевозке пехоты в условиях боевых действий."
 heavy_util_vehicle_desc: "Бронемашины для транспортировки пехоты и их усовершенствованные, лучше защищённые варианты — бронеавтомобили с противоминной защитой — представляют собой бронированные транспортные машины, предназначенные для защиты экипажа и десанта от мин, самодельных взрывных устройств и стрелкового огня. Благодаря V-образному днищу и усиленному бронированию они обеспечивают значительно более высокий уровень защиты, чем обычные небронированные машины, ценой скорости и топливной экономичности. Как правило, оснащаются крупнокалиберным пулемётом или автоматическим гранатомётом для самообороны."
