 HOL_royal_influence_church: "개신교 우위의 복원"
 HOL_royal_influence_church_desc: "새롭게 강화된 군주제 아래에서 왕실은 국가 기관에 대한 권위를 다시 확립하고 다원주의적 영향력의 상당 부분을 해체합니다. 개신교회는 공적 생활에서 과거의 중심적 역할에 가깝게 격상되어 규범, 교육, 법을 이끌게 됩니다."
 HOL_eindhoven_brainport_idea: "에인트호번 브레인포트"
 HOL_eindhoven_brainport_idea_desc: "에인트호번 브레인포트는 혁신과 첨단 기술 산업으로 유명한 네덜란드의 선도적인 첨단 기술 지역입니다. 에인트호번을 중심으로 한 이 지역은 반도체, 자동차 기술, 로봇공학 같은 부문의 강자입니다. ASML과 필립스 같은 글로벌 기업이 자리한 브레인포트 에인트호번은 상당한 경제 성장을 이끌며, 네덜란드가 기술과 혁신 분야의 세계적 선도국이라는 위상에 핵심적으로 기여합니다."
 HOL_brainport: "에인트호번 브레인포트"
 HOL_brainport_desc: "에인트호번 브레인포트는 혁신과 첨단 기술 산업으로 유명한 네덜란드의 선도적인 하이테크 지역입니다. 에인트호번을 중심으로 한 이 지역은 반도체, 자동차 기술, 로봇공학 등의 분야에서 강국입니다. ASML과 필립스 같은 세계적 기업의 본거지인 브레인포트 에인트호번은 상당한 경제 성장을 이끌며, 네덜란드가 기술과 혁신 분야의 세계적 선도국으로 자리하는 데 핵심적으로 기여합니다."
