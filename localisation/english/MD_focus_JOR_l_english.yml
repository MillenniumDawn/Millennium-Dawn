l_english:
 jordan.1.t: "Syrian Refugees Reach Jordan"
 jordan.1.d: "The war in Syria has reached our northern border. Families from Daraa and the Hauran cross into Mafraq and Ramtha every night, and the UN is laying out a camp at Zaatari for tens of thousands more. Our water and our budget were already short before the first bus arrived."
 jordan.1.a: "Open the camps"
 jordan.1.b: "Seal the border"
