 PER_azerbaijan_trigger_TT: "[AZE.GetFlag]§Y아제르바이잔§!은 §Y평화 상태§!이며, §Y우리 동맹§!이고, 우리는 그들에게 §Y70%의 영향력§!을 보유하고 있습니다.\n\n"
