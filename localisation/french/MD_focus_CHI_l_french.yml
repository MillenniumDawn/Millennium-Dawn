 CHI_TAI_goodwill_gesture: "Geste de bonne volonté à travers le détroit"
 CHI_TAI_goodwill_gesture_desc: "Étendre un geste public de bonne volonté envers Taipei, des offres de secours aux catastrophes à l'assouplissement des règles de voyage et de tourisme, réchauffant le sentiment transdétroit et relevant la confiance mutuelle."
