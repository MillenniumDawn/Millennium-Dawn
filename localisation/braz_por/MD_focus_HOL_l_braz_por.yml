 HOL_Rheinmetall_Netherlands_armor_manufacturer_desc:0 "Como parte da Rheinmetall AG, a Rheinmetall Netherlands foca na produção de veículos blindados, oferecendo tecnologia avançada e sistemas de defesa inovadores para as forças armadas holandesas."
