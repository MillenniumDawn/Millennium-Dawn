 ukr_modernize_sov_equipment_t55_reactivation_program.2.name: "Лёгкая модернизация §YТ-55§!:\nвыбор пакета"
 ukr_modernize_sov_equipment_t55_reactivation_program.2.desc: "Лёгкая модернизация сохраняет штатные башню и пушку и заменяет то, что изнашивается первым. §YХКБМ§! предлагает два пакета из узлов, которые наша промышленность уже выпускает для §YТ-64§!."
