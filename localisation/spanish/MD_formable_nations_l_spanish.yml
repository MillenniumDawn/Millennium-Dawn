 ANTCONF_form_category: "Confederación Antillana"
 ANTCONF_form_category_desc: "The Antillean Confederation is a proposed state in the Caribbean with the unification of [CUB.GetNameWithFlag], [DOM.GetNameWithFlag], and [HAI.GetNameWithFlag]. It was initially formed as an idea from Ramón Emeterio Betances, a Puerto Rican independence activist, to unify all Spanish-speaking Caribbean nations into a single united entity. The original idea did not include [HAI.GetNameWithFlag]; however, it was quickly included by proponents of the idea. The idea mostly disappeared due to the American-Spanish war as the colonies of [CUB.GetNameWithFlag] and [PTR.GetNameWithFlag] were transferred to the United States. The idea would bring about a nation that would likely take the capital in Santo Domingo and its official language as Spanish."
 ANTCONF_integrate_start: "Begin forming [GetANTCONFNameDef]"
 ANTCONF_integrate_start_desc: "It is time to form the Antillean Confederation. Our people must be united now to ensure a brighter future for the people of the Caribbean.\n\n"
 ANTCONF_integrate_cuba: "Integrate [GetANTCONFNameAdj] [CUB.GetAdjective] Territories"
 ANTCONF_integrate_cuba_desc: "Cuba es la mayor de las tres naciones principales de la confederación. Su integración aumentará el tamaño de la economía y casi duplicará la población y la superficie terrestre."
 ANTCONF_integrate_dominican_republic: "Integrate [GetANTCONFNameAdj] [DOM.GetAdjective] Territories"
 ANTCONF_integrate_dominican_republic_desc: "La República Dominicana es uno de los tres países principales de la Confederación. Comparte la isla de La Española con Haití y tiene muchos turistas e industrias. El lado norte de la isla también realiza operaciones mineras ligeras y produce acero para uso local en la República. Su integración será invaluable para la nueva Confederación."
 ANTCONF_integrate_haiti: "Integrate [GetANTCONFNameAdj] [HAI.GetAdjective] Territories"
 ANTCONF_integrate_haiti_desc: "Haití es el país más pequeño de las tres naciones principales de la Confederación. Difiere en gran medida de Cuba y la República Dominicana, ya que es una antigua colonia francesa. La integración tomará más tiempo debido a las diferencias de idioma entre el grupo de naciones, sin embargo, la base industrial y el puerto natural de Puerto Príncipe serán invaluables para las operaciones económicas y militares en el Caribe."
 ANTCONF_integrate_puerto_rico: "Integrate [GetANTCONFNameAdj] [PTR.GetAdjective] Territories"
 ANTCONF_integrate_puerto_rico_desc: "Puerto Rico ha sido durante mucho tiempo territorio de Estados Unidos. Goza de la protección de Estados Unidos, pero no es uno de sus territorios integrales. Tiene una población de casi cuatro millones de habitantes y es una de las islas más grandes del Caribe. Es el más pequeño de los estados potencialmente integrados de la Confederación de las Antillas. Aun así, la vibrante cultura y el turismo de la zona aportarán un gran beneficio a la confederación en su conjunto."
