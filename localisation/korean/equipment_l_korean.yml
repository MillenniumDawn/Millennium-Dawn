 TAT_MBT_2: "T-72"
 TAT_MBT_2_desc: "T-72는 아마도 러시아가 생산한 가장 성공적인 디자인일 것입니다. 그것은 냉전 말기 소련군의 정점이었고, 수천 대가 생산되었으며, 오늘날까지도 러시아군의 중추 역할을 하고 있습니다. 비록 중동 분쟁에서 치명적인 실패로 악명이 높았지만, T-72는 미래의 러시아 전차 설계를 위한 개발 플랫폼으로 여전히 사용되고 있으며 오늘날 현대전의 기준에 부합하도록 끊임없는 수정과 업그레이드가 이루어졌습니다. 한때 소련군의 창이었던 전차를 과소평가하지 마십시오."
 TAT_MBT_2_short: "T-72"
 TAT_MBT_3: "T-80"
 TAT_MBT_3_desc: "This 2m dollar tank and beast of the battlefield used the same cannon as the T-72 with added armor and a Kobra ATGM."
 TAT_MBT_3_short: "T-80"
 TAT_MBT_4: "T-90"
 TAT_MBT_4_desc: "Armed with a 3 cannon system for maximum fire capabilities and efficiency. With 3 125mm cannon launchers."
 TAT_MBT_4_short: "T-90"
 TAT_MBT_5: "T-14 Armata"
 TAT_MBT_5_desc: "The most advanced battle tank in the Russian army with sleek outlines and a powerful 152mm cannon."
 TAT_MBT_5_short: "T-14"
 TAT_MBT_7: "T-14M"
 TAT_MBT_7_short: "T-14M"
 TAT_MBT_8: "T-99 Black Eagle"
 TAT_MBT_8_short: "T-99"
 TAT_mbt_equipment_0: "T-62"
 TAT_mbt_equipment_1: "T-72"
 TAT_mbt_equipment_2: "T-90"
 TAT_mbt_equipment_3: "T-14"
 TAT_mbt_equipment_4: "T-24"
 TAT_Rec_tank_0: "PT-76"
 TAT_Rec_tank_0_desc: "이 초고속 수륙 양용 경전차는 강 건너편에서 적진으로 몰래 접근하여 지옥의 짐을 내릴 수 있습니다. 76.2mm D-56T 강선 전차포를 사용합니다."
 TAT_Rec_tank_0_short: "PT-76"
 TAT_Rec_tank_1: "2S25 Sprut-SD"
 TAT_Rec_tank_1_desc: "자주식 수륙양용 구축전차인 이 차량은 적 탱크에 몰래 접근하여 t-72-80이 탑재하는 125mm 대포를 발사할 수 있습니다."
 TAT_Rec_tank_1_short: "2S25 Sprut-SD"
 TAT_Rec_tank_2: "BMPT Terminator"
 TAT_Rec_tank_2_desc: "아마도 지금까지 만들어진 가장 치명적인 유리 대포 중 하나일 것입니다. 탱크에 대항할 수는 없지만 기둥 전체를 파괴할 수 있습니다. 4개의 130mm 발사대와 2개의 30mm 기관포를 갖추고 있습니다."
 TAT_Rec_tank_2_short: "BMPT Terminator"
 TAT_Rec_tank_3: "K-18 Bumerang"
 TAT_Rec_tank_3_desc: "The Bumerang was first revealed to be both a cost-efficient APC and IFV for the modern Russian Army. However, the Bumerang will also be used as a dedicated anti-tank platform sporting a 125mm cannon, the details of which were unveiled in 2018. Much like the American Stryker MGS, the Bumerang will serve as a fire support vehicle much like the BMPT."
 TAT_Rec_tank_4: "경전차 2025"
 TAT_Rec_tank_4_short: "경전차 2025"
 TAT_Rec_tank_5: "경전차 2035"
 TAT_Rec_tank_5_short: "경전차 2035"
 TAT_SP_Anti_Air_0: "ZSU-23-4 실카"
 TAT_SP_Anti_Air_1: "9K35 스트렐라-10"
 TAT_SP_Anti_Air_2: "2K22 퉁구스카"
 TAT_SP_Anti_Air_2_desc: "최대 8발의 미사일을 발사할 수 있는 이 기체는 접근하는 모든 항공기를 격추할 수 있습니다. 뿐만 아니라 자동포로 수송기도 파괴할 수 있습니다."
 TAT_SP_Anti_Air_3: "판치르-S1M"
 TAT_SP_Anti_Air_4: "판치르-S4L"
 TAT_SP_R_arty_0: "BM-21 Grad"
 TAT_SP_R_arty_0_desc: "Not used much in modern operations the grandfather of SAMS and MLRS was used mostly in WW2 and Afghanistan. Being effective at 20km."
 TAT_SP_R_arty_1: "BM-30 스메르치"
 TAT_SP_R_arty_1_desc: "이 차량은 그라드 전차의 현대화된 버전입니다. 눈, 얼음, 사막 등 세계 어디든 갈 수 있으며, 유효 사거리는 35km입니다."
 TAT_SP_R_arty_2: "9A52-4 토르나도"
 TAT_SP_R_arty_2_desc: "An extremely heavy artillery battery that if not dealt with, it can destroy entire cities. With a maximum range of 90km."
 TAT_SP_arty_0: "2S1 Gvozdika"
 TAT_SP_arty_0_desc: "The 2S1 Gvozdika is a Soviet self-propelled howitzer based on the MT-LBu multi-purpose chassis, mounting a 122 mm 2A18 howitzer. \"2S1\" is its GRAU designation. An alternative Russian designation is SAU-122 but in the Russian Army it is commonly known as Gvozdika."
 TAT_SP_arty_1: "2S3 아카치야"
 TAT_SP_arty_1_desc: "필요하다면 태양도 쏠 수 있을 만큼 강력한 152.4mm D-22 대포로 무장한 이 포병대는 사거리가 50km에 달하는 놀라운 화력을 자랑합니다."
 TAT_SP_arty_2: "2S19M2 므스타-S"
 TAT_SP_arty_2_desc: "The 2S19 Msta-S was developed towards the end of the Cold War, incorporating new technologies and boasting an increased range compared to its predecessor."
 TAT_SP_arty_3: "2S35 코알리치야-SV"
 TAT_SP_arty_3_desc: "The 2S35 is a true 21st century artillery platform with widespread automation, automatic shell type selection and unified command-and-control systems."
 TAT_SP_arty_4: "2S38 코알리치야-M"
 TAT_artillery_1: "D-30"
 TAT_artillery_1_desc: "122mm towed artillery battery used in many wars by the Soviets. With a range of 15-25km."
 TAT_artillery_2: "2A65 Msta-B"
 TAT_artillery_3: "D-40"
 TAT_artillery_4: "D-50"
 TAT_util_vehicle_1: "ZIL-131"
 TAT_util_vehicle_1_desc: "A logistics truck and troop carrier used by many militaries around the world."
 TAT_util_vehicle_2: "Ural-4320"
 TAT_util_vehicle_2_desc: "A logistics truck and troop carrier used by many militaries around the world."
 TAT_util_vehicle_3: "KamAZ-4310"
 TAT_util_vehicle_3_desc: "A logistics truck and troop carrier used by many militaries around the world."
 TAT_util_vehicle_4: "KamAZ-4350"
 TAT_util_vehicle_4_desc: "Much like the Volk this can carry 8 men but also carry HMGs on the top of them. Used to lead convoys."
 TAT_util_vehicle_5: "GAZ Tigr"
 TAT_util_vehicle_5_desc: "This armored troop carrier can be armed with an array of different weapons and carry up to 11 men."
 TAT_util_vehicle_6: "VPK-3927 Volk"
 TAT_util_vehicle_6_desc: "The VPK can carry 2+8 men. With STANAG 4569 Level 3 armor. Great for special forces and police forces."
 TAT_util_vehicle_7: "Z-STS Akhmat"
 TAT_util_vehicle_7_desc: "Z-STS Akhmat is made on the three-axle all-wheel drive chassis KAMAZ-5350. It has high characteristics of mobility and patency, and in addition, it does not differ in the complexity of operation. It is curious that an armored car, unlike a basic truck, is built according to the hood scheme. This made it possible to shift the crew's places back and increase their safety."
 EQUIPMENT_DESCRIPTION: "$NAME$"
 CAN_APC_2_desc: "In 1974 the Canadian army selected the Swiss vehicle Mowag Piranha 6x6. Production of the vehicle was taken over under license by the Canadian company Diesel Division, a division of General Motors of Canada."
 CAN_APC_3_desc: "In 1988, Diesel Division, a department of General Motors of Canada, was assigned to build a prototype 8x8 wheeled armored vehicle. It was based on the chassis and engine of the Light Armored Vehicle (LAV). The Canadian army requested an order for a modified infantry section carrier version called Bison."
 CAN_APC_4_desc: "Surplus LAV TUA hulls fitted with Nanuck remotely controlled weapon stations to function as infantry section carriers."
 CAN_APC_5_desc: "The final upgrade of the LAV III to LAV 6.0 standards, while maintaining a higher roof line for infantry or cargo transport. The upgrades increased protection including better electronics, IED protection, and addon armour while maintaining a machine gun armed Protector remotely controlled weapon station."
 CAN_MBT_1: "Centurion"
 CAN_MBT_1_short: "Centurion"
 CAN_MBT_1_desc: "When it first came out, the Centurion's design was revolutionary in pioneering the model for early main battle tanks. Designed and produced at the closing stages of the Second World War, the Centurion only saw service in the post-war periods but it quickly became the West's answer to the Soviet's T-54 tanks. Until the early 1970s, the Centurion tanks formed the bulk of the Canadian tank force."
 CAN_MBT_2: "Leopard C1"
 CAN_MBT_2_desc: "Canada acquired the German Leopard main battle tank in 1978. 127 were bought in total, 114 of which were \"Canadianized\" with specific local requirements, based on the Leopard 1A3 standard."
 CAN_MBT_2_short: "Leopard C1"
 CAN_MBT_3: "Leopard C2"
 CAN_MBT_3_desc: "An upgraded version of the Leopard C1. These were upgraded generally to Leopard 1A5 standard. A troop was further upgraded with add-on armour and sent to Kosovo in 1999, while in 2006 a squadron was upgraded with MEXAS appliqué modular armour and spall liners, for use in Afghanistan."
 CAN_MBT_3_short: "Leopard C2"
 CAN_MBT_4: "Leopard 2A4M CAN"
 CAN_MBT_4_desc: "The Leopard 2A4M CAN is the upgraded Canadian version of the Leopard 2A4. The tank is a re-conditioned Leopard 2A4 fitted with the \"M\" Mine armor package and other additional upgrades. It was successfully deployed to support ISAF Forces during the Afghanistan War. The protection of the Leopard 2A4M CAN has been further augmented with the addition of appliqué armour resembling that found on the recent Leopard 2A7+ variant, but modified to fit the turret configuration of the 2A4 as it retains the Rheinmetall 120 mm L/44 smoothbore gun of the base A4 variant."
 CAN_MBT_4_short: "Leopard 2A4M CAN"
 CAN_MBT_5: "Leopard 2A6M CAN"
 CAN_MBT_5_desc: "The Leopard 2A6M CAN Tank, is a Canadian variant of the Leopard 2A6 Tank. Significant modifications include the mine protection belly armour added thus  giving the tank the \"M\" designation, distinctive tan coloured boxes mounted on the rear of the turret, contains Canadian Forces designated communications and anti IED (improvised explosive device) jamming gear which includes the \"T\" antenna stands, and stand-off slat armour."
 CAN_MBT_5_short: "Leopard 2A6M CAN"
 CAN_IFV_1: "CTL Bobcat"
 CAN_IFV_1_desc: "The Bobcat project began in 1952 as a logical development to replace the wartime Ram Kangaroo APC and correct for the faults of that converted tank. Amendments to the concept proceeded over the next four years as the concept swung between an amphibious fully armored carrier and a modernized replacement for the Universal Carrier."
 CAN_IFV_1_short: "CTL Bobcat"
 CAN_IFV_2: "Grizzly AVGP"
 CAN_IFV_2_desc: "In 1974 the Canadian army selected the Swiss vehicle Mowag Piranha 6x6. Production of the vehicle was taken over under license by the Canadian company Diesel Division, a division of General Motors of Canada. The Grizzly variant used a Cadillac-Gage 1m turret."
 CAN_IFV_2_short: "Grizzly AVGP"
 CAN_IFV_3_short: "LAV-III Kodiak"
 CAN_IFV_4_desc: "An upgraded version of the LAV III with newer turrets and electronics, increased IED protection, and addon armour conducted under the LAV Operational Requirement Integration Task (LORIT)."
 CAN_IFV_5: "LAV-6 IFV"
 CAN_IFV_5_desc: "The final upgrade of the LAV III to LAV 6.0 standards. The upgrades increased protection including new turrets, better electronics, increased IED protection, and addon armour while utilizing a turret armed with a 25mm chain gun and coaxial GPMG similar to the original LAV III."
 CAN_IFV_5_short: "LAV-6 IFV"
