 ast_military_decisions: "군사 결정"
 ast_military_decisions_desc: "오스트레일리아 국방군은 국가 방어와 국익 수호를 위해 복무합니다. 우리가 이루는 어떠한 개선이나 보강도 궁극적으로 그 목적에 봉사합니다."
