l_english:
 TRI_energy_decisions: "Trinidadian Energy"
 TRI_energy_decisions_desc: "Gas, petrochemicals, and asphalt fund the state. Each project here turns a resource we already own into exports or industry."

 TRI_atlantic_lng_train_four: "Commission Atlantic LNG Train 4"
 TRI_atlantic_lng_train_four_desc: "Train 4 at Point Fortin started up in December 2005. At 5.2 million tonnes a year, it was the largest liquefaction train in the world, and it lets us sell far more gas abroad."

 TRI_dragon_gas_agreement: "Ask Venezuela for the Dragon Gas Field"
 TRI_dragon_gas_agreement_desc: "Dragon lies in Venezuelan waters and holds more than four trillion cubic feet of gas. Washington licensed the project in 2023, but Caracas must agree, and Washington can revoke its license at any time."
 TRI_dragon_gas_agreement_tt: "[VEN.GetName] can accept or decline. If it accepts, we pay §R2§! billion in fees and gain §G4§! oil from the gas that feeds our plants. If [USA.GetName] is hostile to [VEN.GetName], its opinion of us also falls."

 TRI_point_lisas_expansion: "Expand Point Lisas Petrochemicals"
 TRI_point_lisas_expansion_desc: "Point Lisas is one of the world's largest exporters of ammonia and methanol, and its plants run on our gas. A new complex there adds an industrial complex in Trinidad and Tobago."
 TRI_can_staff_industrial_complex_tt: "We have enough unemployed workers to staff an §YIndustrial Complex§! (needs §Y[?workers_per_civ_fac_display|2]K§!)"

 TRI_pitch_lake_asphalt: "Sell Pitch Lake Asphalt"
 TRI_pitch_lake_asphalt_desc: "The Pitch Lake at La Brea holds an estimated 10 million tons of natural asphalt. Lake Asphalt of Trinidad and Tobago digs it, and it has paved roads abroad since the 1880s. A new export contract pays back more than it costs to set up. Buyers will take up to three contracts."

 trinidad.1.t: "Petrotrin Faces Closure"
 trinidad.1.d: "Petrotrin lost billions of Trinidad and Tobago dollars in five years and owes about TT$12 billion. Its board wants to end refining at Pointe-à-Pierre, where the refinery has run for 101 years and now buys most of its crude on the open market. Thousands of jobs are at stake."
 trinidad.1.a: "Close the refinery"
 trinidad.1.b: "Keep Petrotrin running"

 trinidad.2.t: "Trinidad Asks for the Dragon Gas Field"
 trinidad.2.d: "[TRI.GetName] wants a license to develop the Dragon gas field in our waters and pipe the gas to its LNG and petrochemical plants. We would collect fees, but Washington may punish those who deal with us."
 trinidad.2.a: "Grant the license"
 trinidad.2.b: "Decline the request"
