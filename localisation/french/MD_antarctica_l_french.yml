 ANTARCTICA_STATION_SEND_SUPPLIES_TEXT_DELAYED: "§YPrérequis :§!\n[!antarctica_station_send_supplies_button_click_enabled]\n§YEffets :§!\nRavitaille la station jusqu'à sa capacité maximale en carburant.\nCoût : §R0,25 Md$ pour 1000 de carburant§! (doublé pendant l'hiver antarctique).\nLe Trésor est débité à la commande ; le carburant arrive après le délai de livraison.\n\n§YDélai de livraison :§! §G15 jours (nov.-mars)§! ou §R30 jours (avr.-oct.)§!."
 ANTARCTICA_STATION_SEND_OBSERVERS_TEXT: "Envoyer des observateurs"
 ANTARCTICA_STATION_SEND_OBSERVERS_TEXT_DELAYED: "§YPrérequis :§!\n[!antarctica_station_send_observers_button_click_enabled]§YÉtat du blizzard :§! [MD_antarctica_observer_blizzard_status]\n\n§YEffets :§!\nEnvoie une mission d'observateurs vers la station sélectionnée.\nLe pays cible est notifié immédiatement.\nLes observateurs arrivent après §Y7 jours§! et inspectent les activités de laboratoire illégales ou l'usage d'utilités en boucle ouverte."
