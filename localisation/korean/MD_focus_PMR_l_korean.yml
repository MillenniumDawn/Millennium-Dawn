 PMR_democrat_inner_modifier: "Internal Politics of The Liberal Transnistria"
 PMR_democrat_inner_modifier_desc: "The policy under Liberals rule is characterized by a concentration on Transnistria's economic growth and less concentration on military and political actions."
 PMR_kolbasna_tt: "§Y이코바스나§! 창고의 무기 수는 §Y[?modify_kolbasna]§!만큼 변경될 것입니다.\n"
 PMR_eastern_europe_operations: "코바스나 탄약고"
 PMR_eastern_europe_operations_desc: "\n\n\n\n\n\n£PMR_desctext_cobasna \n\n\n\n\n\n\n\n\n§Y코바스나§! 탄약고는 공식적으로 §Y제1411 포병 탄약고§!이며 §Y코바스나§! 마을에 위치한 대규모 탄약고입니다. 법적으로나 §1국제적으로 승인§!된 바로는 [MLV.GetFlag]§Y몰도바§! 전체의 일부이지만, 미승인 분리 국가인 [PMR.GetFlag]§Y트란스니스트리아§!가 이 마을과 탄약고를 통제하고 있으며 §1국제 감시단§!의 접근을 거부해 왔습니다. 예외는 §Y1992년§! §R트란스니스트리아 전쟁§! 종결 이후 이 지역에 주둔해 온 [SOV.GetFlag]§Y러시아§!군뿐입니다. 탄약고에 대한 외부 접근은 사실상 금지되어 있습니다. 저장된 무기의 양과 상황에 대한 상세한 정보는 [SOV.GetFlag]§Y러시아§!와 [PMR.GetFlag]§Y트란스니스트리아§! 당국만이 가지고 있습니다\n\n§Y코바스나§! 창고의 §Y무기 수량§!은 §Y[?PMR.kolbasna]§!입니다"
