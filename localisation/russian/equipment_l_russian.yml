 CHI_Rec_tank_0: "Тип 62"
 CHI_Rec_tank_0_desc: "Тип 62 производства Norinco — китайский лёгкий танк, оснащённый 85-мм нарезной пушкой Тип 62-85TC."
 CHI_Rec_tank_1: "Тип 63А"
 CHI_Rec_tank_1_desc: "Тип 63 производства Norinco, также известный как WZ-211, — китайский лёгкий плавающий танк с 85-мм нарезной пушкой Тип 62-85TC и сварной бронёй из катаной стали."
 CHI_Rec_tank_2: "Тип 62-G"
 CHI_Rec_tank_2_desc: "Улучшенная версия исходного Type 62: Type 62-G получил переработанную схему бронирования, новую сварную башню из плоских листов, более мощную 105-мм нарезную пушку с современным стабилизатором, современную систему управления огнём и приборы ночного видения."
 CHI_Rec_tank_3: "ZTQ-15"
 CHI_Rec_tank_3_desc: "Легкий танк Тип 15, также известный как ZTQ-15, представляет собой китайский легкий танк третьего поколения, оснащенный 105-мм нарезной пушкой, дистанционно управляемым 12,7-мм пулеметом и автоматическим гранатометом QLZ-04. Он защищен композитной броней и/или пакетом динамической защиты."
