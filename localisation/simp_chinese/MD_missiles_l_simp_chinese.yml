 PRODUCTION_PRICE_10_TT: "单位价格，以及整批的§R总价§!。\n\n生产费用§Y并非预先支付§!。总费用§Y按周分期收取§!，当前大约为§Y每周$[?var_space_week_10|C2]B§!。\n\n增加平行生产线可以缩短完工时间，但会增加总费用和每周费用。"
 PRODUCTION_PRICE_11_TT: "单位价格，以及整批的§R总价§!。\n\n生产费用§Y并非预先支付§!。总费用§Y按周分期收取§!，当前大约为§Y每周$[?var_space_week_11|C2]B§!。\n\n增加平行生产线可以缩短完工时间，但会增加总费用和每周费用。"
 PRODUCTION_PRICE_12_TT: "单位价格，以及整批的§R总价§!。\n\n生产费用§Y并非预先支付§!。总费用§Y按周分期收取§!，当前大约为§Y每周$[?var_space_week_12|C2]B§!。\n\n增加平行生产线可以缩短完工时间，但会增加总费用和每周费用。"
 PRODUCTION_PRICE_13_TT: "单位价格，以及整批的§R总价§!。\n\n生产费用§Y并非预先支付§!。总费用§Y按周分期收取§!，当前大约为§Y每周$[?var_space_week_13|C2]B§!。\n\n增加平行生产线可以缩短完工时间，但会增加总费用和每周费用。"
 PRODUCTION_PRICE_14_TT: "单位价格，以及整批的§R总价§!。\n\n生产费用§Y并非预先支付§!。总费用§Y按周分期收取§!，当前大约为§Y每周$[?var_space_week_14|C2]B§!。\n\n增加平行生产线可以缩短完工时间，但会增加总费用和每周费用。"
 SPACE_AUTO_TITLE: "§Y项目自动化§!"
 SPACE_AUTO_TITLE_TT: "它无需微观管理即可运行您的太空计划：每周都会根据所选计划订购卫星和运载火箭，然后在库存可以满足一次轮换后发射它们。\n\n它总是建造§Y你研究过的最新一代§!，从不建造旧一代，并且一旦卫星达到最大容量就会自动停止。\n\n§Y此面板上的数字每月重新计算§!，每次重新打开此标签页时都会再次出现这种情况 - 因此，如果在完成一项技术后读数看起来已过时，请切换标签页再切换回来刷新它。\n\n§R卫星杀手不是自动的§! - 它们是轨道武器，而不是覆盖卫星，因此没有容量目标需要填充。"
 SPACE_AUTO_STATUS: "[space_auto_status_loc]"
 SPACE_AUTO_STATUS_TT: "§Y未激活§! - 自动生产处于关闭状态。\n§Y激活§! - 订购和发射；该数字为当前每周费用。\n§Y等待§! - 目前生产能力还不足以完成一次完整的飞行。\n§Y满负荷§! - 计划中的每个卫星轨道都已满员；在研究出新一代卫星之前，它们都将处于闲置状态。\n§Y停滞§! - 计划中的有效载荷没有一个适合该运载火箭的。\n§Y暂停§! - 国库无力支付下一批款项；降低轮换率或允许赤字支出。\n§Y中止§! - 国库空虚，赤字支出已停止。\n\n此状态每月重新计算一次，每次您重新打开此标签页时也会重新计算。"
 SPACE_AUTO_TOGGLE_TT: "[!space_auto_toggle_button_click_enabled]切换自动功能的开闭"
 SPACE_AUTO_TOGGLE_TT_DELAYED: "关闭功能只会停止新订单。已在生产的批次会完成生产并继续计费，直到交付为止，因此您已支付的任何款项都不会损失。\n\n重新开启功能后，系统会从您当前状态继续运行。"
 SPACE_AUTO_PRESET: "§g计划：§![space_auto_preset_name_loc]"
 SPACE_AUTO_PRESET_DESC: "[space_auto_preset_desc_loc]"
 SPACE_AUTO_PRESET_TT: "哪些卫星由自动化系统建造？无需手动设计 - 每个方案都会自动选择您研究过的最新一代卫星。\n\n§Y自动§!功能会先重建最过时的网络，然后在该网络填满后再重建下一个网络。\n§Y专注§!计划将每个名额都分配给一个家族。\n§Y配对§!和§Y平衡§!计划将名额拆分，当其他家族名额填满时，将剩余名额分配给进度最过时的家族。\n§Y自定义§!则执行之前准备并保存的清单。"
 SPACE_AUTO_PRESET_NEXT_TT: "下一个计划"
 SPACE_AUTO_PRESET_PREV_TT: "上一计划"
 space_auto_preset_0: "§Y自动§!"
 space_auto_preset_1: "§Y专注卫星导航系统§!"
 space_auto_preset_2: "§Y专注通信卫星§!"
 space_auto_preset_3: "§Y专注间谍卫星§!"
 space_auto_preset_4: "§Y卫星导航系统+通信卫星§!"
 space_auto_preset_5: "§Y卫星导航系统+间谍卫星§!"
 space_auto_preset_6: "§Y通信卫星+间谍卫星§!"
 space_auto_preset_7: "§Y平衡§!"
 space_auto_preset_8: "§Y自定义§!"
 space_auto_preset_0_desc: "它会先重建过时最严重的网络，然后再重建下一个网络。目前没有剩余的网络需要重建。"
 space_auto_preset_0_desc_gnss: "首先重建最过时的网络：当前§G卫星导航系统§!。达到容量上限后，它会自动继续运行。"
 space_auto_preset_0_desc_com: "首先重建最过时的网络：当前§G通信卫星§!。达到容量上限后，它会自动继续运行。"
 space_auto_preset_0_desc_spy: "首先重建最过时的网络：当前§G间谍卫星§!。达到容量上限后，它会自动继续运行。"
 space_auto_preset_1_desc: "四个插槽均配备卫星导航系统。陆军速度、空海打击精度、建设速度和资源产出。"
 space_auto_preset_2_desc: "四个插槽均配备通信卫星。指挥点数、军队组织度、计划速度、政治点数和情报行动。"
 space_auto_preset_3_desc: "四个插槽均配备间谍卫星。计划上限、侦察、索敌、护航效率、研究速度和情报覆盖范围。"
 space_auto_preset_4_desc: "2个卫星导航系统与2个通信卫星。目标定位和建设与指挥控制相结合。"
 space_auto_preset_5_desc: "2个卫星导航系统与2个间谍卫星。目标定位和建设与侦察和研究同时进行。"
 space_auto_preset_6_desc: "2个通信卫星与2个间谍卫星。指挥控制与侦察情报并重。"
 space_auto_preset_7_desc: "2个卫星导航系统与1个通信卫星和1个间谍卫星。卫星导航系统的权重是双倍，因为它是最便宜、最轻便的。"
 space_auto_preset_8_desc: "它会执行您在启动界面设置并保存的飞行清单。有效载荷仍然每周都会升级到最新一代。"
 SPACE_AUTO_ROTATION: "§g轮次：§![?var_space_auto_flights|C0]"
 SPACE_AUTO_ROTATION_TT: "每次发射轮次。每次发射携带一枚运载火箭和全部有效载荷。\n\n只有当库存中有足够的物资来满足每次飞行需求时，轮换飞行才会进行，因此在生产赶上之前，实际数量可能会更少。\n\n这是你的支出预算。如此规模的一次轮换，价格约为§Y$[?var_space_auto_est_cost|C1]B§!，按周分摊到其建造周期内。\n\n§Y变更立即生效§! - 无需手动开关自动化系统。已投入生产的产品价格不会重新调整；只有在订购下一批产品时才会收取新批次的费用。"
 SPACE_AUTO_ROTATION_PLUS_TT: "每轮多发射一次（最多为10）"
 SPACE_AUTO_ROTATION_MINUS_TT: "每轮少发射一次（至少为1）"
 SPACE_AUTO_BUDGET: "§g每周：§! $[?space_prod_expense|C1]B"
 SPACE_AUTO_FUNDS: "[space_auto_funds_loc]"
 SPACE_AUTO_FUNDS_TT: "自动化流程还剩下什么需要投入：你的资金，减去正在运行的批处理程序仍然欠下的金额。\n\n只有当这笔费用足以支付全部价格时，该批次产品才会开始生产。这不是每周的费用 - 每周的费用显示在左侧。"
 SPACE_AUTO_BUDGET_TT: "你目前的生产运营每周需要多少费用，以及自动化系统需要使用的资金。\n\n只有当你的§Y国库资金足以支付全部费用时§!，才会开始生产一批产品。一旦开始建造，款项将按建造期间每周支付，而不是一次性扣除 - 这也适用于您手动下的订单。\n\n当前批次的完整发射轮次价格约为§Y$[?var_space_auto_est_cost|C1]B§!。改变轮换方式不会影响已经建造好的部分：批次保持订购时的尺寸和收费，只有在下一批货物下架后才会对新的数字进行计费。\n\n由于§Y赤字支出政策§!生效，国库余额检查被完全跳过，订单将以赊购方式进行。"
 SPACE_AUTO_SAVE_BUTTON: "保存自定义"
 SPACE_AUTO_SAVE_BUTTON_TT: "[!space_auto_save_button_click_enabled]将上面暂存的有效负载清单存储为§Y自定义§!计划并切换到该计划。"
 SPACE_AUTO_SAVE_TT_trigger_2: "至少有一个§Y有效载荷§!已加载到上方。"
 SPACE_AUTO_SAVE_BUTTON_TT_DELAYED: "系统仅存储有效载荷槽位。运载火箭始终是你最新研发的火箭，因此无需选择。"
 SPACE_AUTO_UPGRADE_BUTTON: "现在升级"
 SPACE_AUTO_UPGRADE_BUTTON_TT: "[!space_auto_upgrade_button_click_enabled]将每个卫星升级到您研究过的最新一代，只要轨道上已有的卫星能够支持，并且不会失去覆盖范围。"
 SPACE_AUTO_UPGRADE_BUTTON_TT_DELAYED: "没有任何因素能够促进卫星的发展 - 它只会降级 - 所以如果没有这些因素，你的新卫星就只能在轨道上闲置，毫无贡献。\n\n自动化程序会在每次发射后执行此操作；按钮用于手动发射的情况。"
 SPACE_AUTO_MANIFEST: "[space_auto_manifest_loc]"
 SPACE_AUTO_MANIFEST_TT: "运载火箭和有效载荷在一次飞行中携带有效载荷。\n\n自动化系统会优先使用机库里还能§Y运载有效载荷的最老火箭§!，这样一来，多余的旧级火箭就会优先于新型火箭被消耗掉。新生产的总是最新一代的产品，所以旧库存会自然而然地被淘汰。\n\n如果卫星轨道已满，则将位置分配给仍然缺少卫星的家族，并将清单缩减到火箭能够运载的数量 - 这就是为什么数量可能少于你的四个位置，以及为什么较旧的火箭每次飞行携带的卫星数量较少。"
 SPACE_AUTO_BUILDING: "[space_auto_building_loc]"
 SPACE_AUTO_BUILDING_TT: "当前生产线上正在生产的产品。这些是普通的生产批次 - 它们也会显示在此窗口的§Y生产§!选项卡中，并显示剩余时间，且计入每种类型只能生产一个批次的限制。\n\n运载火箭的建造时间比卫星长得多，因此启动后的首次轮转可能要等到一年左右的时间。"
 SPACE_AUTO_DEFICIT: "赤字支出"
 SPACE_AUTO_DEFICIT_TT: "允许下单，无论国库余额如何，并将成本计入债务。\n\n关闭此功能后，只有当您的资金足以支付全部费用时，批次才会启动，因此程序绝不会花费您没有的资金。自动化程序会保持空闲状态，而不是过度操作。\n\n§R迫在眉睫的破产危机总是会使它停止工作，无论如何。§! - 那个防护机制无法关闭。"
 SPACE_AUTO_DEFICIT_TT_DELAYED: "正是这个开关让太空计划的发展速度超过了为其提供资金的经济规模。"
 SPACE_AUTO_STOCKPILE: "提前做好准备"
 SPACE_AUTO_STOCKPILE_TT: "应该一次性构建整个方案，而不是一次只进行一个轮次。\n\n运载火箭的发射周期为240-440天，而卫星发射周期为80-260天，因此，如果只订购下一轮发射所需的火箭，发射台就会闲置等待。启用此功能后，自动化系统会一次性订购该项目所需的所有发射任务以及剩余的全部卫星发射任务。\n\n虽然每周成本更高，但能更快达到产能上限，并且可以持续不间断地进行产品发布。"
 SPACE_AUTO_STOCKPILE_TT_DELAYED: "与§Y赤字支出§!搭配效果很好：库存就是你的预算所能购买的数量，而赤字转换机制则会取消库存金额的上限。"
 SPACE_AUTO_LATEST_OLV: "只用最新型运载火箭"
 SPACE_AUTO_LATEST_OLV_TT: "只使用你研发出的最新型运载火箭。\n\n关闭后，自动化系统会选择库存中§Y最老、仍能完成飞行任务的火箭§!进行发射，同时保持最新一代火箭的订单状态，这样上一代火箭剩余的级段就能得到充分利用，而不是闲置在机库里。老旧火箭的运载能力较弱，因此其飞行任务的运载量也较小。\n\n开启后，旧型号火箭完全被忽略。每次飞行都携带完整的火箭清单，但该计划会等待新的火箭，而不是发射已有的火箭。"
 SPACE_AUTO_LATEST_OLV_TT_DELAYED: "当你的剩余火箭等级太小，不值得占用发射槽位时，启用此功能；当你宁愿清理机库而不是等待时，关闭此功能。\n\n§R间谍卫星有效载荷的重量恰好等于与之匹配的火箭所能运载的重量。§!在间谍卫星计划中，较老的阶段永远无法搭载最新一代的卫星，因此这种切换不会改变任何事情。"
 SPACE_AUTO_NET_GNSS: "[space_auto_net_gnss_loc]"
 SPACE_AUTO_NET_GNSS_TT: "§Y导航卫星§! - 陆军速度、近距离空中支援和海军打击精度、战略轰炸、定位和海军命中率；以及民用方面的建设速度和资源开采。\n\n最便宜、最轻便的入轨家族。"
 SPACE_AUTO_NET_COM: "[space_auto_net_com_loc]"
 SPACE_AUTO_NET_COM_TT: "§Y通信卫星§! - 指挥点数、军队组织度、计划速度、空中护航和拦截、海军协调；以及政治点数、加密、情报网络获取和作战结果。\n\n有效性也取决于您的地面接收器技术。"
 SPACE_AUTO_NET_SPY: "[space_auto_net_spy_loc]"
 SPACE_AUTO_NET_SPY_TT: "§Y间谍卫星§! - 计划上限、侦察、天气惩罚降低、索敌和护航效率；以及研究速度、所有分支的情报覆盖范围和抵抗镇压。\n\n超出你卫星轨道容量的冗余卫星可以被指派执行间谍任务。"
