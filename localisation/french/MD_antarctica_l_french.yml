 ANTARCTICA_CCAS_TITLE: "CCAS"
 ANTARCTICA_CCAS_TEXT: "La Convention pour la conservation des phoques de l'Antarctique (CCAS) est un accord qui réglemente la chasse aux phoques en Antarctique. Elle fut établie en 1972 pour protéger les populations de phoques et assurer une utilisation durable de leurs ressources."
 ANTARCTICA_CCAMLR_TITLE: "CCAMLR"
 ANTARCTICA_CCAMLR_TEXT: "La Commission pour la conservation de la faune et la flore marines de l'Antarctique (CCAMLR) est une organisation chargée de la conservation de la vie marine dans l'océan Austral. Elle fut établie en 1982 pour gérer et protéger l'écosystème unique de l'Antarctique."
