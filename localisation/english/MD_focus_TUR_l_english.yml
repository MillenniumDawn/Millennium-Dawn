 tur_mrap2_tender: "Hold a tender for §YNext Generation Armored Vehicles§!"
 tur_mrap2_tender_desc: "\n\n\n\n\n\n£TUR_mrap2_for_tooltip\n\n\n\n\n\n\n\n\n§WTender for new MRAP and utility vehicles. §GBoth programs can be decided§!, and a choice in §Rboth§! is needed to finish the tender.\n§W--------------§!\n§LBMC§! §YKirpi 2§!: MRAP with §Gimproved protection§! and §Gmore troop capacity§!, but §Rmore expensive§!.\n§LOtokar§! §YCobra II MRAP§!: MRAP with §Gproven design§! and §Gbalanced mobility§!, but §Rless capacity§!.\n§LNurol§! §YEjder Yalçın§!: MRAP with §Gstrong protection§! and §Ggood mobility§!, but §Rmore expensive§!.\n§LFNSS§! §YPars 4x4§!: MRAP with §Gagile design§! and §Gshared Pars components§!, but §Rless protection§!.\n§LNurol§! §YNMS-L§!: light utility vehicle with §Gnimble handling§! and §Gcheap production§!, but §Rbasic protection§!.\n§LOtokar§! §YCobra II Pickup§!: utility pickup with §Gshared Cobra II parts§! and §Gweapon mounts§!, but §Rmodest payload§!.\n§LOtokar§! §YUral§!: all-terrain utility vehicle with §Gexcellent off-road performance§! and §Ghigh payload§!, but §Rlittle protection§!.§!"
 tur_mrap2_requires_mrap: "Complete the §YArmored Vehicles Tender§!"
 tur_mrap2_tender.1.name: "The Next Generation Armored Vehicle Tender"
 tur_mrap2_tender.1.desc: "§WThe proposals for the §YNext Generation Armored Vehicle Tender§! have been reviewed. Our forces need protected vehicles that can keep pace with modern operations, and domestic industry has answered with several designs.\n\nTwo programs are on the table: an §YMRAP§! vehicle to protect our troops against mines and ambushes, and a §YUtility§! vehicle for transport and support duties. §GBoth can be decided§!, one after the other.\n\nWhich program should we settle first?§!"
 tur_mrap2_tender.1.a: "§YMRAP§! program"
 tur_mrap2_tender.1.b: "§YUtility§! program"
 tur_mrap2_tender.2: "The MRAP Tender"
 tur_mrap2_tender.2.name: "The MRAP Tender"
 tur_mrap2_tender.2.desc: "§WFour domestic designs are competing for the §YMRAP§! contract.\n\n§LBMC§! §YKirpi 2§!: the next step of a proven line, with §Gimproved protection§! and §Gmore troop capacity§!, but §Rmore expensive§!.\n\n§LOtokar§! §YCobra II MRAP§!: §Gproven§! and §Gbalanced§!, with good mobility, but §Rless capacity§!.\n\n§LNurol§! §YEjder Yalçın§!: §Gstrongly protected§! with §Ggood mobility§!, but §Rmore expensive§!.\n\n§LFNSS§! §YPars 4x4§!: §Gagile§! and built from §Gshared Pars components§!, but §Rless protected§!.\n\nProtection, balance or agility?§!"
 tur_mrap2_tender.2.a: "§LBMC§! §YKirpi 2§! §G(Protection, capacity)§! §R(More expensive)§!"
 tur_mrap2_tender.2.b: "§LOtokar§! §YCobra II MRAP§! §G(Proven, balanced)§! §R(Less capacity)§!"
 tur_mrap2_tender.2.c: "§LNurol§! §YEjder Yalçın§! §G(Protection, mobility)§! §R(More expensive)§!"
 tur_mrap2_tender.2.d: "§LFNSS§! §YPars 4x4§! §G(Agile, shared parts)§! §R(Less protection)§!"
 tur_mrap2_tender.3.name: "The Utility Vehicle Tender"
 tur_mrap2_tender.3.desc: "§WThree designs are competing for the §YUtility§! vehicle contract.\n\n§LNurol§! §YNMS-L§!: §Gnimble§! and §Gcheap to produce§!, but offers only §Rbasic protection§!.\n\n§LOtokar§! §YCobra II Pickup§!: §Gshares parts with the Cobra II§! and can carry §Gweapon mounts§!, but has a §Rmodest payload§!.\n\n§LOtokar§! §YUral§!: §Gexcellent off-road performance§! and §Ghigh payload§!, but §Rlittle protection§!.\n\nAgility, flexibility or payload?§!"
 tur_mrap2_tender.3.a: "§LNurol§! §YNMS-L§! §G(Nimble, cheap)§! §R(Basic protection)§!"
 tur_mrap2_tender.3.b: "§LOtokar§! §YCobra II Pickup§! §G(Shared parts, weapon mounts)§! §R(Modest payload)§!"
 tur_mrap2_tender.3.c: "§LOtokar§! §YUral§! §G(Off-road, high payload)§! §R(Little protection)§!"
