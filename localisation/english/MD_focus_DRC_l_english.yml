 MDRC_JK_dialogue: "The Inter-Congolese Dialogue"
 MDRC_JK_dialogue_desc: "Give provincial leaders, churches, civic associations and the armed opposition a forum to debate the future of the Republic. Dialogue is the first step toward a durable political settlement. A settlement negotiated only by the strongest armed factions would leave the grievances of ordinary communities unanswered. Provincial delegations must have room to discuss representation, security and the distribution of public resources before the next government is chosen. The dialogue also creates a 210-day Public Mandate: +3% stability and +5% political-power gain. Maintain a permanent secretariat for civic and provincial delegations. Staffing spends political capital but preserves channels for implementing agreements. Additional effects: -15 political power; Ceasefire Liaison Network for 180 days, including its listed upkeep. Each reform immediately improves Congolese Administrative Accountability; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_mandate$§!."
 MDRC_JK_transition: "An Inclusive Transition"
 MDRC_JK_transition_desc: "Create a transitional administration capable of choosing a constitutional settlement. The political routes ahead are mutually exclusive. Temporary offices need defined responsibilities and a timetable, otherwise the transition risks becoming a permanent contest for appointments. This administration will prepare the institutions through which competing visions of the Republic can be turned into governing programmes. A Transitional Secretariat adds +4% construction speed and +5% political-power gain for one year while the permanent settlement is negotiated. Replace overlapping transitional commissions with a common register of ministerial duties. Reassigning authority creates uncertainty while specialists reconcile accounts. Additional effects: -1 stability percentage points; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves Congolese Administrative Accountability; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_dialogue$§!."
 MDRC_JK_republic: "A Western-Aligned Republic"
 MDRC_JK_republic_desc: "The Western governing outlook must already be in power before this political programme can begin. Develop a distinct set of national institutions through the branches below. This focus preserves the current ruling party and does not install a new government. Publish the legal-reform timetable and invite constitutional advisers. Opening closed institutions creates uncertainty while cooperation supports the settlement. Additional effects: -1 stability percentage points; reciprocal +25 opinion with BEL only when those countries exist and are at peace with DRC. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_transition$§!."
 MDRC_JK_commission: "An Independent Electoral Commission"
 MDRC_JK_commission_desc: "Fund voter registration and provincial electoral offices so that an election can be more than an announcement from the capital. An accurate register requires trained staff, secure records and procedures that rural voters can actually use. Electoral officials must answer to published rules rather than whichever provincial authority controls the road to the registration centre. Completing the electoral register upgrades the civic spirit to +2% stability and +2% political-power gain. Provincial electoral offices will share a verified register independent of patronage. Auditing requires resources before it earns public trust. Additional effects: -10 political power; Treasury Reconstruction Team for 180 days, including its listed upkeep; one 20% computing research bonus. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_republic$§!."
 MDRC_JK_constitution: "The Constitutional Referendum"
 MDRC_JK_constitution_desc: "Bind the presidency to a written constitution and protect the assembly from arbitrary dissolution. A durable constitutional bargain must tell citizens who exercises power, how that power is limited and how a government can be replaced. The referendum gives this framework a public mandate that cannot rest on a presidential decree alone. The constitutional government spirit now replaces the electoral-register stage, turning temporary electoral administration into a permanent institutional settlement. Publish accessible constitutional editions and require ministers to explain their legal powers. The referendum divides opinion but clarifies the authority behind reform. Additional effects: -1 stability percentage points; +35 political power. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_commission$§!."
 MDRC_JK_courts: "Courts Beyond Kinshasa"
 MDRC_JK_courts_desc: "Pay magistrates, reopen courthouses and publish judicial appointments. Accessible justice reduces the price citizens pay to corrupt intermediaries. For a resident far from Kinshasa, justice depends on a clerk, a magistrate and records that survive the next change of officials. Reopening these institutions will make property disputes and complaints against the administration matters of law rather than bargaining power. Alongside the corruption reduction, provincial justice upgrades the constitutional spirit to +6% political-power gain and adds +2% production-efficiency growth. Recover diverted administrative fees and publish provincial case schedules. Constitutional reform must have practical value for ordinary litigants. Additional effects: +0.1 treasury; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_constitution$§!."
 MDRC_JK_free_press: "Protect the Independent Press"
 MDRC_JK_free_press_desc: "Give journalists legal protection and publish public tenders. Scrutiny may be uncomfortable, but it gives reform a constituency. Provincial radio, local newspapers and independent reporting can expose failures that official reports conceal. Public access to contracts and legal protection for journalists will make the reconstruction programme answerable to the communities it is meant to serve. Public Accountability replaces the judicial stage, increasing political-power gain to +8% and production-efficiency growth to +3% while retaining its constitutional stability benefit. Protect access to budgets and prevent retaliation against lawful reporting. Disclosures initially damage confidence before accountability rebuilds it. Additional effects: -1 stability percentage points; reciprocal +25 opinion with FRA only when those countries exist and are at peace with DRC. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_courts$§!."
 MDRC_JK_civilian: "Civilian Supremacy"
 MDRC_JK_civilian_desc: "Bring military appointments and procurement before parliamentary committees. Oversight must reach beyond ceremonial approval of the defence budget. Civilian institutions will review appointments and spending while preserving a clear operational chain of command, so that loyalty to the Republic becomes more important than loyalty to a patron. A one-year procurement review adds +8% production-efficiency growth alongside the permanent Civilian Oversight spirit. Give parliamentary committees procurement accounts through a staffed military liaison office. Oversight gains information without breaking operational command. Additional effects: +15 command power; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_free_press$§!."
 MDRC_JK_ballot: "A Peaceful Transfer of Power"
 MDRC_JK_ballot_desc: "The first successful transfer of office is a stronger guarantee than any speech promising it. Election officials, judges, opposition leaders and the security services must all accept that losing an election does not mean losing a place in the Republic. This completes the constitutional-government spirit, raising its bonuses to 8% stability and 10% political-power gain. The final republican settlement replaces Public Accountability and retains all mature constitutional benefits, now including +4% production-efficiency growth. Publish handover procedures for ministries, commands and records. Peaceful succession strengthens confidence in long-term agreements. Additional effects: Active Diplomatic Missions for 365 days, including its listed upkeep; reciprocal +25 opinion with USA only when those countries exist and are at peace with DRC. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_civilian$§!."
 MDRC_JK_continuity: "Emerging-Bloc Reconstruction"
 MDRC_JK_continuity_desc: "The Emerging governing outlook must already be in power before this political programme can begin. Develop a distinct set of national institutions through the branches below. This focus preserves the current ruling party and does not install a new government. Require ministries to follow published production priorities. Redirecting resources disrupts established interests while concentrating assistance. Additional effects: -1 stability percentage points; Industrial Rehabilitation for 180 days, including its listed upkeep. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_transition$§!."
 MDRC_JK_governors: "Appoint Reliable Governors"
 MDRC_JK_governors_desc: "Make provincial executives responsible for revenue and security targets set by the presidency. Appointments will come with specific obligations for public accounts, road access and administrative coverage. A governor who cannot explain where funds went will no longer be able to substitute a declaration of loyalty for evidence of effective government. Responsible Governors replaces the initial mandate with +4% political-power gain and +3% construction speed. Governors will submit comparable revenue and delivery reports. Removing contradictory channels recovers public money. Additional effects: -10 political power; +0.1 treasury. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_continuity$§!."
 MDRC_JK_presidency: "The Reconstruction Presidency"
 MDRC_JK_presidency_desc: "Centralize project approval to push a national development programme through fragmented institutions. Separate ministries often promise projects that depend on each other without sharing a timetable or budget. A presidential reconstruction office will coordinate these commitments, accepting the political cost of centralization in exchange for faster execution of national priorities. The Reconstruction Presidency now upgrades the governors stage into the established executive office, preserving the benefits and tradeoff of centralized reconstruction. Coordinate engineering, transport and procurement through a presidential office. Central direction unsettles officials losing discretionary authority. Additional effects: -1 stability percentage points; Reconstruction Works for 180 days, including its listed upkeep. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_governors$§!."
 MDRC_JK_patronage: "Discipline the Patronage Networks"
 MDRC_JK_patronage_desc: "Require loyal officials to submit accounts and remove those who divert reconstruction budgets. Connections may secure an appointment, but they cannot be allowed to guarantee immunity from audit. The presidency will demand usable accounts from its own supporters, beginning with those offices responsible for procurement and the distribution of reconstruction funds. The internal audit also upgrades the executive spirit to +7% construction speed and adds +2% production-efficiency growth while retaining its political modifiers. Audit coalition-connected firms and reclaim payments for abandoned work. Enforcing standards against allies consumes political capital. Additional effects: -15 political power; +0.15 treasury. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_presidency$§!."
 MDRC_JK_guard: "Reorganize the Presidential Guard"
 MDRC_JK_guard_desc: "Professional training and reliable pay make the guard a disciplined reserve rather than another private army. A force charged with protecting national institutions must be capable of acting within them. Standardized training, reliable pay and a defined reserve role will make the guard more dependable while reducing the temptations created by privileged access to political power. A one-year readiness programme grants +4% division organization recovery and +1 percentage point of reinforcement rate, alongside army experience and command power. Require the guard to join army exercises and report through national command. Its personnel become a usable reserve rather than an isolated formation. Additional effects: +15 army experience; Frontier Readiness Exercises for 180 days, including its listed upkeep. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_patronage$§!."
 MDRC_JK_delivery: "Legitimacy Through Delivery"
 MDRC_JK_delivery_desc: "Tie provincial budgets to completed roads, functioning clinics and teachers actually present in schools. The government will publish practical measures of success that can be checked outside a ministerial office. A reopened clinic or a paid teacher should carry more political weight than another announcement that a province has been allocated a development budget. Delivery Contracts upgrades the executive spirit to +9% construction speed and +3% production-efficiency growth without removing its centralized-government tradeoff. Inspect completed schools and clinics before crediting governors. Citizens should encounter functioning services rather than ceremonial openings. Additional effects: +1 stability percentage points; Community Health for 180 days, including its listed upkeep. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_guard$§!."
 MDRC_JK_compact: "A New Presidential Compact"
 MDRC_JK_compact_desc: "Governors and ministries must know what the presidency expects and what it will deliver in return. Replace improvised bargains with a common programme of regional investment and accountable targets. This upgrades the executive spirit to 10% construction speed and 12% political-power gain, while retaining its 3% stability penalty. The mature presidential compact replaces Delivery Contracts and adds +4% production-efficiency growth to its established construction and political-power benefits. Ratify a common industrial programme and publish regional obligations. Technical cooperation supports a settlement based on economic delivery. Additional effects: Industrial Rehabilitation for 365 days, including its listed upkeep; reciprocal +25 opinion with CHI only when those countries exist and are at peace with DRC. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_delivery$§!."
 MDRC_JK_federal: "A Non-Aligned Federal Congo"
 MDRC_JK_federal_desc: "The Non-Aligned governing outlook must already be in power before this political programme can begin. Develop a distinct set of national institutions through the branches below. This focus preserves the current ruling party and does not install a new government. Negotiate responsibilities before devolving budgets. Liaison teams manage friction created by redistributing authority. Additional effects: -1 stability percentage points; Ceasefire Liaison Network for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_transition$§!."
 MDRC_JK_assemblies: "Elected Provincial Assemblies"
 MDRC_JK_assemblies_desc: "Let communities choose representatives with authority over local services. Provincial representatives should debate priorities in public instead of treating local budgets as extensions of private negotiations in the capital. Elected assemblies will give communities a place to challenge spending decisions and demand explanations from their own administrators. Provincial Budget Offices replace the initial compact with +3% stability and +6% infrastructure construction speed. Publish assembly procedures and provide budget access. Elections matter when representatives can inspect the services they oversee. Additional effects: -10 political power; +1 stability percentage points. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_federal$§!."
 MDRC_JK_revenue: "A Provincial Revenue Formula"
 MDRC_JK_revenue_desc: "Publish a predictable formula for distributing mining and customs receipts. A mineral-producing province, an agricultural district and a major city have different needs, but each needs a predictable public budget. Publishing a common formula will make transfers easier to defend and harder to manipulate through political threats. The revenue formula now replaces Provincial Budget Offices with the established federal revenue-settlement spirit, preserving its stronger stability and infrastructure benefits. Create a clearing office for national and provincial transfers. Receipts must not be promised to several administrations simultaneously. Additional effects: +0.1 treasury; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_assemblies$§!."
 MDRC_JK_local_audit: "Provincial Audit Chambers"
 MDRC_JK_local_audit_desc: "Decentralization must not decentralize impunity. Establish independent audit chambers in every province. Giving provinces authority over money also creates new opportunities to conceal its disappearance. Local audit chambers will scrutinize contracts and publish findings so that decentralization creates accountable government rather than merely moving the location of corruption. Accountable Provinces also upgrades the federal spirit to +12% infrastructure construction speed and adds +2% political-power gain alongside the corruption reduction. Compare contracts and refer disputed transfers to a common panel. Local autonomy carries verifiable financial responsibilities. Additional effects: -10 political power; +0.15 treasury. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_revenue$§!."
 MDRC_JK_languages: "Services in Local Languages"
 MDRC_JK_languages_desc: "Train administrators to provide essential services in the languages their citizens use. A form that citizens cannot understand is an obstacle to government even when an office is open. Training local staff and making essential information accessible will reduce dependence on intermediaries and make public administration more familiar to the people using it. Accessible Government replaces the audit stage, raising infrastructure construction speed to +14% and political-power gain to +3% while preserving federal stability. Raises the actual Millennium Dawn literacy rate by 1 percentage point, up to 100%, and updates its education modifiers. Train clerks to explain legal and financial documents locally. Administrative language should not prevent access to services. Additional effects: +1 stability percentage points; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_local_audit$§!."
 MDRC_JK_municipal: "Municipal Development Funds"
 MDRC_JK_municipal_desc: "Give towns modest funds for markets, drainage and reliable public records. Small urban projects often fail because no authority has a clear budget to maintain them. Dedicated municipal funds will allow local councils to plan practical improvements to markets and services without waiting for every repair to become a national project. Municipal engineering exchanges provide one +50% industry research bonus in addition to the existing development funds. Require project accounts and maintenance plans for municipal grants. Towns need assets they can operate after construction teams depart. Additional effects: -10 political power; Reconstruction Works for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_languages$§!."
 MDRC_JK_unity_diversity: "Unity Through Diversity"
 MDRC_JK_unity_diversity_desc: "Provincial autonomy will endure only if citizens can see public services improve without the country pulling apart. Ratify the revenue settlement, settle administrative boundaries and make interprovincial cooperation routine. The final federal spirit provides stronger stability and infrastructure construction, plus a modest general construction bonus. The mature federal settlement replaces Accessible Government and now includes +4% political-power gain alongside its established stability and construction benefits. Maintain interregional consultation and cross-border cooperation. Federal institutions give the Republic a common diplomatic voice. Additional effects: Active Diplomatic Missions for 365 days, including its listed upkeep; reciprocal +25 opinion with CNG only when those countries exist and are at peace with DRC. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_municipal$§!."
 MDRC_JK_restoration: "The Nationalist State Programme"
 MDRC_JK_restoration_desc: "The Nationalist governing outlook must already be in power before this political programme can begin. Develop a distinct set of national institutions through the branches below. This focus preserves the current ruling party and does not install a new government. Review the administrative, industrial and defence capabilities required for preparedness. Reallocating authority creates friction before responsibilities become clear. Additional effects: -1 stability percentage points; +15 command power. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_transition$§!."
 MDRC_JK_sovereignty: "A Charter of Sovereignty"
 MDRC_JK_sovereignty_desc: "Declare that public office and national resources serve the Congolese state. Sovereignty must mean more than a flag above an office whose accounts and decisions nobody can inspect. The charter will define public obligations around control of national resources, service to citizens and the independence of Congolese institutions. The Mobilization Charter upgrades that programme to +5% mobilization speed, +0.4 percentage points of recruitable population and +2% division defence. Register strategic contracts and responsible officials. Independent decisions require accurate information about public obligations. Additional effects: -10 political power; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_restoration$§!."
 MDRC_JK_national_service: "National Reconstruction Service"
 MDRC_JK_national_service_desc: "Organize paid reconstruction service and reserve training under a national administration. Reconstruction needs organized labour, but coercion and indefinite service would deepen public resentment. The programme will use defined terms, pay and practical training to connect national mobilization with useful work and a recognized place in civilian life. National Reconstruction Service now replaces the charter stage, establishing the existing manpower and defensive benefits together with its economic cost. Combine paid civil works with registered reserve training. An organized intake supplies personnel while engineers undertake reconstruction. Additional effects: +2000 available manpower; Reconstruction Works for 180 days, including its listed upkeep. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_sovereignty$§!."
 MDRC_JK_clean_hands: "The Clean Hands Campaign"
 MDRC_JK_clean_hands_desc: "Audit the assets of senior officials and prosecute diversion of public money. The campaign will begin where officials have the greatest discretion over contracts, appointments and public property. Removing protected intermediaries will disrupt established political networks, but the state cannot demand sacrifice from citizens while tolerating diversion at the top. An audited national service also upgrades division defence to +3.5% and adds +2% political-power gain while retaining its recruitment benefit and industrial cost. Recover assets diverted through senior procurement networks. Applying the campaign to influential supporters consumes political capital. Additional effects: -15 political power; +0.15 treasury. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_national_service$§!."
 MDRC_JK_national_academy: "A National Cadre Academy"
 MDRC_JK_national_academy_desc: "Train administrators and officers in a common programme of public service. Officers and administrators should understand the same basic rules for public accounts, lawful authority and interregional cooperation. A common training programme will try to replace isolated circles of loyalty with a cadre that can serve across provincial boundaries. The academy provides one +50% infantry research bonus alongside its experience and administrative rewards. Raises the actual Millennium Dawn literacy rate by 1 percentage point, up to 100%, and updates its education modifiers. Teach staff planning, accounts and technical administration together. Officers and civilian officials need shared evidence to coordinate policy. Additional effects: +15 army experience; Research Partnerships for 180 days, including its listed upkeep. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_clean_hands$§!."
 MDRC_JK_strategic_reserve: "A Strategic National Reserve"
 MDRC_JK_strategic_reserve_desc: "Build a reserve of funds and personnel to weather pressure from abroad. Emergency decisions are easier to impose on a country that has no reserves of money or trained personnel. Setting resources aside will give the government time to respond to pressure without immediately abandoning its reconstruction commitments or seeking another patron. The Prepared National Reserve upgrades the service spirit to +1.2 percentage points of recruitable population and +4% defence, with -2% supply consumption and its existing political and industrial modifiers. Audit emergency stores and exercise release procedures. Fuel reserves need a tested command plan to become usable policy. Additional effects: +15000 fuel (subject to storage capacity); +15 command power. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_national_academy$§!."
 MDRC_JK_sovereign_state: "A Sovereign State"
 MDRC_JK_sovereign_state_desc: "The new government must now show that national service and centralized authority can survive beyond a moment of crisis. Combine reserve organization with a permanent reconstruction programme. The final sovereign-state spirit strengthens defence, recruitment and construction, while retaining the industrial cost of mobilizing so many citizens for state service. The mature sovereign programme replaces the prepared reserve and retains -2% supply consumption and +2% political-power gain alongside its established manpower, defence and construction benefits. Coordinate frontier administration, diplomacy and defensive exercises. Neighbours should understand the institutions responsible for security. Additional effects: Frontier Readiness Exercises for 365 days, including its listed upkeep; reciprocal +25 opinion with AGL only when those countries exist and are at peace with DRC. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_strategic_reserve$§!."
 MDRC_JK_republic_petition: "A Right to Petition"
 MDRC_JK_republic_petition_desc: "Give citizens a lawful route to challenge administrative decisions. Published responses make government answerable between elections. The programme provides the political, social or administrative resources shown in its rewards. Enter petitions in a common case register with deadlines. Repeated complaints become evidence for institutional reform. Additional effects: Treasury Reconstruction Team for 180 days, including its listed upkeep; one 20% computing research bonus. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_republic$§!."
 MDRC_JK_republic_bar: "An Independent Bar Association"
 MDRC_JK_republic_bar_desc: "Train public defenders and establish professional standards for legal representation. Provincial legal aid brings constitutional guarantees within reach. A one-year national programme supports implementation. Fund legal-aid training and protect professional discipline from political interference. Accessible representation strengthens public justice. Additional effects: +1 stability percentage points; -10 political power. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_republic_petition$§!."
 MDRC_JK_republic_records: "Open the Public Records"
 MDRC_JK_republic_records_desc: "Create an accessible archive of budgets, appointments and land decisions. Records give legislators and journalists evidence to scrutinize official claims. Grants one 25% research bonus in the relevant field. Cross-reference land, concession and procurement records. Transparency exposes duplicated obligations and lost fees. Additional effects: +15 political power; +0.1 treasury. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_republic_bar$§!."
 MDRC_JK_republic_ombudsman: "An Independent Ombudsman"
 MDRC_JK_republic_ombudsman_desc: "Let citizens report administrative abuse to an office protected from ministerial dismissal. Case reviews turn individual complaints into practical reforms. The programme provides the political, social or administrative resources shown in its rewards. Refer repeated abuses to the responsible inspectorate. Mediation resolves complaints before they become wider confrontations. Additional effects: +1 stability percentage points; Ceasefire Liaison Network for 180 days, including its listed upkeep. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_republic_records$§!."
 MDRC_JK_republic_term_limits: "Enforce Presidential Term Limits"
 MDRC_JK_republic_term_limits_desc: "Publish succession procedures and protect the institutions that administer elections. Predictable transfers of office reduce the incentive to settle disputes outside the constitution. A one-year national programme supports implementation. Prepare administrative handovers before the presidency changes. Incumbent allies surrender discretion while partners gain confidence in continuity. Additional effects: -20 political power; reciprocal +25 opinion with BEL only when those countries exist and are at peace with DRC. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_republic_ombudsman$§!."
 MDRC_JK_republic_committee: "Parliamentary Budget Committees"
 MDRC_JK_republic_committee_desc: "Give the assembly trained analysts and time to examine expenditure. Oversight must continue after a budget receives its ceremonial approval. A one-year national programme supports implementation. Review multiyear commitments and cancel duplicated contracts. Parliamentary scrutiny releases funds lost between conflicting appropriations. Additional effects: -10 political power; +0.15 treasury. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_republic$§!."
 MDRC_JK_republic_unions: "A Labour Consultation Council"
 MDRC_JK_republic_unions_desc: "Bring employers and independent unions into negotiations over workplace standards. Regular consultation gives industrial reform a wider constituency. The programme provides the political, social or administrative resources shown in its rewards. Unions and employers will negotiate training and workplace procedures. Rehabilitation teams help firms implement their agreement. Additional effects: +1 stability percentage points; Industrial Rehabilitation for 180 days, including its listed upkeep. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_republic_committee$§!."
 MDRC_JK_republic_competition: "A Competition Authority"
 MDRC_JK_republic_competition_desc: "Review exclusive concessions and give domestic suppliers a route to contest unfair tenders. Competition policy should produce opportunities beyond politically connected firms. Grants one 25% research bonus in the relevant field. Review exclusive contracts and reopen tenders to domestic suppliers. Competition recovers a modest sum while limiting privileged access. Additional effects: -10 political power; +0.1 treasury; one 20% production lines research bonus. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_republic_unions$§!."
 MDRC_JK_republic_civic: "Civic Education in Every Province"
 MDRC_JK_republic_civic_desc: "Explain electoral rights and public accountability through schools and local associations. Democratic institutions need informed participation as well as legal texts. Grants one 25% research bonus in the relevant field. Community organizations will explain voting, petitions and public accounts. Informed participation sustains constitutional protections between elections. Additional effects: +1 stability percentage points; +15 political power; one 20% information technology research bonus. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_republic_competition$§!."
 MDRC_JK_republic_devolution: "Accountable Local Government"
 MDRC_JK_republic_devolution_desc: "Publish municipal budgets and protect elected councils from arbitrary interference. Local democracy complements national institutions while keeping their responsibilities clear. A one-year national programme supports implementation. Equip municipal councils with procurement procedures and project supervisors. Local autonomy carries published responsibilities for works. Additional effects: -10 political power; Reconstruction Works for 180 days, including its listed upkeep. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_republic_civic$§!."
 MDRC_JK_republic_settlement: "Western Institutions for a Generation"
 MDRC_JK_republic_settlement_desc: "Bring the institutional, administrative and social branches of this political programme into a common long-term settlement. A one-year works programme supports the transition from emergency reform to normal government. Link parliament, universities and municipalities through policy evaluation. The constitutional settlement can improve policy through evidence as well as competition. Additional effects: Research Partnerships for 365 days, including its listed upkeep; reciprocal +25 opinion with USA only when those countries exist and are at peace with DRC. Each reform immediately improves Congolese Constitutional Accountability; its exact changes and ongoing costs are listed in the effects. Reveals the Central African Federation and United States of Central Africa decisions in Regional Unions and Integration. Unmet political and territorial requirements are shown on each decision. Formation preserves puppets.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_JK_ballot$§!.\nComplete §Y$MDRC_JK_republic_term_limits$§!.\nComplete §Y$MDRC_JK_republic_devolution$§!."
 MDRC_JK_continuity_congress: "A National Reconstruction Congress"
 MDRC_JK_continuity_congress_desc: "Bring the governing movement, provincial delegates and reconstruction specialists together. Their programme will turn political authority into a defined set of public commitments. The programme provides the political, social or administrative resources shown in its rewards. Adopt measurable production and service commitments. Debate exposes disagreements but gives the approved plan a clearer mandate. Additional effects: -1 stability percentage points; +25 political power. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_continuity$§!."
 MDRC_JK_continuity_planning: "A Permanent Planning Commission"
 MDRC_JK_continuity_planning_desc: "Employ statisticians and engineers to assess reconstruction proposals. A plan becomes useful when ministries can measure its progress and revise failed assumptions. Grants one 25% research bonus in the relevant field. Compile statistics independently of ministries competing for funds. Researchers must measure productive capacity rather than nominal targets. Additional effects: -10 political power; Research Partnerships for 180 days, including its listed upkeep; one 20% computing research bonus. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_continuity_congress$§!."
 MDRC_JK_continuity_cooperatives: "Producer Cooperatives"
 MDRC_JK_continuity_cooperatives_desc: "Support cooperative purchasing and repair services for small producers. Shared facilities can overcome shortages that individual workshops cannot. A one-year national programme supports implementation. Pool agricultural purchases and repair facilities through producer cooperatives. Shared services let small producers participate in development. Additional effects: +0.05 treasury; Rural Recovery for 180 days, including its listed upkeep; one 20% agriculture research bonus. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_continuity_planning$§!."
 MDRC_JK_continuity_labour: "Labour and Production Councils"
 MDRC_JK_continuity_labour_desc: "Create workplace consultation boards that connect production targets to conditions on the shop floor. These councils must report practical shortages rather than flattering statistics. A one-year national programme supports implementation. Workplace councils will report shortages directly to planners. Workers gain a formal role in making targets achievable. Additional effects: +1 stability percentage points; Industrial Rehabilitation for 180 days, including its listed upkeep. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_continuity_cooperatives$§!."
 MDRC_JK_continuity_housing: "Workers Housing Programme"
 MDRC_JK_continuity_housing_desc: "Coordinate serviced plots and municipal works near employment centres. Better living conditions strengthen the social foundation of reconstruction. A one-year national programme supports implementation. Include sanitation and employment access in housing projects. Health teams support settlements growing around reconstruction industries. Additional effects: -10 political power; Community Health for 180 days, including its listed upkeep; one 20% construction research bonus. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_continuity_labour$§!."
 MDRC_JK_continuity_cadres: "A Professional Cadre Secretariat"
 MDRC_JK_continuity_cadres_desc: "Require party-appointed administrators to meet common standards of competence. Public administration must retain technical knowledge across political reshuffles. The programme provides the political, social or administrative resources shown in its rewards. Require professional examinations and accounting instruction for appointed cadres. Technical competence reduces reliance on personal connections. Additional effects: +15 political power; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_continuity$§!."
 MDRC_JK_continuity_inspectorate: "The Reconstruction Inspectorate"
 MDRC_JK_continuity_inspectorate_desc: "Send rotating inspection teams to projects receiving central funds. Reports should identify missing materials and unfinished works before they become permanent losses. A one-year national programme supports implementation. Compare physical deliveries with recorded expenditure. Recoveries strengthen the plan, although exposed failures damage confidence. Additional effects: -1 stability percentage points; +0.15 treasury. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_continuity_cadres$§!."
 MDRC_JK_continuity_rural_admin: "Rural Administrative Posts"
 MDRC_JK_continuity_rural_admin_desc: "Reopen local administrative offices and give them reliable communications. State authority must provide useful services beyond major towns. Grants one 25% research bonus in the relevant field. District offices will coordinate extension services and public records. State presence must assist communities as well as collect reports. Additional effects: +1 stability percentage points; Rural Recovery for 180 days, including its listed upkeep. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_continuity_inspectorate$§!."
 MDRC_JK_continuity_technology: "Technology Transfer Institutes"
 MDRC_JK_continuity_technology_desc: "Train engineers to adapt imported production methods to local maintenance and supply conditions. A working transfer programme leaves domestic expertise behind. Grants one 25% research bonus in the relevant field. Document imported production methods and train maintenance staff. Cooperation should leave expertise rather than permanent contractor dependence. Additional effects: Research Partnerships for 180 days, including its listed upkeep; reciprocal +25 opinion with SOV only when those countries exist and are at peace with DRC; one 20% industry research bonus. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_continuity_rural_admin$§!."
 MDRC_JK_continuity_social_guarantee: "A Charter of Social Guarantees"
 MDRC_JK_continuity_social_guarantee_desc: "Publish the services the state promises to deliver and the institutions responsible for them. Social legitimacy depends on commitments that citizens can recognize in daily life. The programme provides the political, social or administrative resources shown in its rewards. Publish minimum service commitments and their responsible institutions. Guarantees strengthen legitimacy while limiting discretionary allocation. Additional effects: +2 stability percentage points; -15 political power. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_continuity_technology$§!."
 MDRC_JK_continuity_settlement: "Emerging Institutions for a Generation"
 MDRC_JK_continuity_settlement_desc: "Bring the institutional, administrative and social branches of this political programme into a common long-term settlement. A one-year works programme supports the transition from emergency reform to normal government. Connect planning, producer councils and social guarantees through an audited budget. Consolidation removes duplicate appropriations and sustains rehabilitation. Additional effects: +0.15 treasury; Industrial Rehabilitation for 365 days, including its listed upkeep; one 20% robotics research bonus. Each reform immediately improves Congolese Developmental Planning; its exact changes and ongoing costs are listed in the effects. Reveals the Central African People's Union and Union of African Socialist Republics decisions in Regional Unions and Integration. Unmet political and territorial requirements are shown on each decision. Formation preserves puppets.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_JK_compact$§!.\nComplete §Y$MDRC_JK_continuity_housing$§!.\nComplete §Y$MDRC_JK_continuity_social_guarantee$§!."
 MDRC_JK_federal_senate: "A Senate of the Provinces"
 MDRC_JK_federal_senate_desc: "Give provincial representatives a chamber for negotiating national legislation. Regional interests can be heard without fragmenting the Republic. The programme provides the political, social or administrative resources shown in its rewards. Scrutinize legislation changing provincial powers and revenue. Negotiation takes effort but reduces destructive jurisdictional disputes. Additional effects: -15 political power; +1 stability percentage points. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_federal$§!."
 MDRC_JK_federal_boundaries: "A Provincial Boundary Commission"
 MDRC_JK_federal_boundaries_desc: "Resolve administrative boundary disputes through published evidence and consultation. Clear responsibilities reduce conflict over taxation and services. A one-year national programme supports implementation. Register disputed administrative responsibilities publicly. Shared evidence can settle conflicts before services are interrupted. Additional effects: +10 political power; Ceasefire Liaison Network for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_federal_senate$§!."
 MDRC_JK_federal_equalisation: "Equalisation Grants"
 MDRC_JK_federal_equalisation_desc: "Design transfers that support provinces with weaker tax bases. National solidarity must survive differences in mineral wealth and commercial access. A one-year national programme supports implementation. Tie equalisation grants to published commitments in poorer provinces. Solidarity should not depend on personal agreements between elites. Additional effects: +1 stability percentage points; Rural Recovery for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_federal_boundaries$§!."
 MDRC_JK_federal_courts: "Provincial Constitutional Courts"
 MDRC_JK_federal_courts_desc: "Train provincial courts to resolve disputes between local and national authorities. Federalism needs reliable arbitration as well as decentralization. The programme provides the political, social or administrative resources shown in its rewards. Train courts to settle provincial tax disputes. Enforceable responsibilities protect federalism from recurring fiscal confrontation. Additional effects: -10 political power; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_federal_equalisation$§!."
 MDRC_JK_federal_council: "A Council of Provincial Premiers"
 MDRC_JK_federal_council_desc: "Establish regular meetings between provincial executives and the national government. Joint decisions make cross-border services possible without dissolving local authority. A one-year national programme supports implementation. Maintain a joint secretariat for roads, utilities and markets. Cooperation creates national networks without dissolving local authority. Additional effects: +15 political power; Reconstruction Works for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_federal_courts$§!."
 MDRC_JK_federal_chiefs: "A Charter for Customary Authorities"
 MDRC_JK_federal_chiefs_desc: "Define the relationship between customary leadership, elected councils and national law. Clear limits can preserve local knowledge while protecting public rights. The programme provides the political, social or administrative resources shown in its rewards. Define customary responsibilities and the public rights constraining them. Mediation preserves local knowledge while keeping power accountable. Additional effects: +1 stability percentage points; Ceasefire Liaison Network for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_federal$§!."
 MDRC_JK_federal_land: "Provincial Land Registers"
 MDRC_JK_federal_land_desc: "Document land use and recognized claims through local consultation. Accessible records reduce disputes and improve confidence in agricultural investment. Grants one 25% research bonus in the relevant field. Combine consulted surveys with public-fee records. Accessible registration reduces duplicate claims and recovers lost receipts. Additional effects: -10 political power; +0.1 treasury; one 20% agriculture research bonus. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_federal_chiefs$§!."
 MDRC_JK_federal_markets: "Interprovincial Market Agreements"
 MDRC_JK_federal_markets_desc: "Standardize local permits and remove duplicate administrative barriers. Provincial autonomy should not make ordinary domestic trade unnecessarily difficult. A one-year national programme supports implementation. Recognize permits across provinces and coordinate inspections. Autonomy should not multiply the costs of domestic trade. Additional effects: +0.05 treasury; Industrial Rehabilitation for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_federal_land$§!."
 MDRC_JK_federal_schools: "Provincial Teacher Partnerships"
 MDRC_JK_federal_schools_desc: "Share training materials and teaching expertise between provincial education services. Local-language teaching works best with common professional standards. Grants one 25% research bonus in the relevant field. Share teacher qualifications and placement records. Local-language teaching can coexist with national professional standards. Additional effects: +1 stability percentage points; Research Partnerships for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_federal_markets$§!."
 MDRC_JK_federal_transport: "Joint Provincial Transport Boards"
 MDRC_JK_federal_transport_desc: "Coordinate routes whose economic value crosses administrative borders. Shared maintenance schedules make decentralization compatible with a national market. Grants one 25% research bonus in the relevant field. Publish maintenance duties for cross-provincial routes. Shared engineering prevents neglected boundary sections breaking national connections. Additional effects: -10 political power; Reconstruction Works for 180 days, including its listed upkeep; one 20% construction research bonus. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_federal_schools$§!."
 MDRC_JK_federal_settlement: "Non-Aligned Institutions for a Generation"
 MDRC_JK_federal_settlement_desc: "Bring the institutional, administrative and social branches of this political programme into a common long-term settlement. A one-year works programme supports the transition from emergency reform to normal government. Combine fiscal reconciliation, local rights and service standards in a permanent administration. Regional agreements can rely on institutions able to honour them. Additional effects: Rural Recovery for 365 days, including its listed upkeep; reciprocal +25 opinion with TNZ only when those countries exist and are at peace with DRC. Each reform immediately improves The Congolese Provincial Compact; its exact changes and ongoing costs are listed in the effects. Reveals the Central African Federation and United States of Central Africa decisions in Regional Unions and Integration. Unmet political and territorial requirements are shown on each decision. Formation preserves puppets. Reveals the Central African People's Union and Union of African Socialist Republics decisions in Regional Unions and Integration. Unmet political and territorial requirements are shown on each decision. Formation preserves puppets.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_JK_unity_diversity$§!.\nComplete §Y$MDRC_JK_federal_council$§!.\nComplete §Y$MDRC_JK_federal_transport$§!."
 MDRC_JK_restoration_doctrine: "A Doctrine of National Independence"
 MDRC_JK_restoration_doctrine_desc: "Set out the responsibilities of a sovereign state without assigning national policy to foreign patrons. The doctrine must translate into institutions capable of acting on their decisions. The programme provides the political, social or administrative resources shown in its rewards. Identify essential services that must withstand external pressure. Practical priorities replace unfunded declarations of self-sufficiency. Additional effects: +1 war-support percentage points; -10 political power; one 20% energy efficiency research bonus. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_restoration$§!."
 MDRC_JK_restoration_resources: "A Strategic Resources Register"
 MDRC_JK_restoration_resources_desc: "Survey strategic concessions and publish the obligations attached to them. National control requires information and technical capacity, not declarations alone. Grants one 25% research bonus in the relevant field. Reconcile concession surveys, royalties and resource estimates. Accurate records prevent public assets being pledged through incompatible agreements. Additional effects: +0.1 treasury; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_restoration_doctrine$§!."
 MDRC_JK_restoration_resilience: "Economic Resilience Planning"
 MDRC_JK_restoration_resilience_desc: "Identify essential imports and develop replacement supply arrangements. Contingency planning reduces vulnerability to external pressure. A one-year national programme supports implementation. Identify critical imports and train domestic maintenance workshops. Emergency stocks provide time for replacement arrangements to operate. Additional effects: +10000 fuel (subject to storage capacity); Industrial Rehabilitation for 180 days, including its listed upkeep. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_restoration_resources$§!."
 MDRC_JK_restoration_heritage: "Protect the National Archives"
 MDRC_JK_restoration_heritage_desc: "Restore historical records and public cultural institutions. A common civic memory can sustain national belonging across regional and linguistic differences. The programme provides the political, social or administrative resources shown in its rewards. Preserve archives and document regional contributions to the Republic. Shared civic memory sustains belonging without erasing local identities. Additional effects: +1 stability percentage points; +15 political power; one 20% information technology research bonus. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_restoration_resilience$§!."
 MDRC_JK_restoration_suppliers: "National Defence Suppliers"
 MDRC_JK_restoration_suppliers_desc: "Certify domestic workshops capable of repairing military equipment. Reliable maintenance reduces dependence on emergency procurement abroad. Grants one 25% research bonus in the relevant field. Qualify domestic defence workshops through repair trials. Field feedback identifies the work that can reliably stay inside the country. Additional effects: +10 army experience; Industrial Rehabilitation for 180 days, including its listed upkeep. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_restoration_heritage$§!."
 MDRC_JK_restoration_council: "A National Security Council"
 MDRC_JK_restoration_council_desc: "Coordinate civilian and military planning through a permanent council. Shared assessments make national policy more consistent across ministries. The programme provides the political, social or administrative resources shown in its rewards. Establish common reporting and emergency delegations. Ministries must coordinate without losing clear responsibility. Additional effects: +15 command power; -10 political power. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_restoration$§!."
 MDRC_JK_restoration_civil_defence: "A Civil Defence Service"
 MDRC_JK_restoration_civil_defence_desc: "Train local responders and prepare emergency communications. National resilience includes protecting civilian life during disruption. A one-year national programme supports implementation. Prepare emergency communications and medical referrals. Protecting civilian life is part of national preparedness. Additional effects: +1 stability percentage points; Community Health for 180 days, including its listed upkeep. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_restoration_council$§!."
 MDRC_JK_restoration_border_admin: "Permanent Frontier Administration"
 MDRC_JK_restoration_border_admin_desc: "Equip frontier offices to maintain records and communicate with central authorities. Security policy needs an administrative presence as well as patrols. Grants one 25% research bonus in the relevant field. Connect frontier revenue offices with local commands. Consistent administration recovers receipts lost through fragmented reporting. Additional effects: +0.05 treasury; Frontier Readiness Exercises for 180 days, including its listed upkeep. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_restoration_civil_defence$§!."
 MDRC_JK_restoration_reserve_training: "A Reserve Training Calendar"
 MDRC_JK_restoration_reserve_training_desc: "Coordinate training cycles so that provincial reservists can reinforce regular formations effectively. Predictable courses improve readiness without permanent mobilization. The programme provides the political, social or administrative resources shown in its rewards. Exercise mobilization records and transport plans. Training must test whether provincial formations can reinforce the national force. Additional effects: +15 army experience; +10 command power. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_restoration_border_admin$§!."
 MDRC_JK_restoration_mobilisation: "An Industrial Mobilisation Plan"
 MDRC_JK_restoration_mobilisation_desc: "Prepare maintenance priorities and emergency supply contracts before a crisis. Industrial readiness requires a practical inventory of capacity and skilled labour. A one-year national programme supports implementation. Inventory repair capacity, skilled workers and emergency contracts. Preparedness creates a practical bridge between production and defence. Additional effects: +1 war-support percentage points; Industrial Rehabilitation for 180 days, including its listed upkeep; one 20% production lines research bonus. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_restoration_reserve_training$§!."
 MDRC_JK_restoration_settlement: "Nationalist Institutions for a Generation"
 MDRC_JK_restoration_settlement_desc: "Bring the institutional, administrative and social branches of this political programme into a common long-term settlement. A one-year works programme supports the transition from emergency reform to normal government. Maintain reserve, industrial and administrative plans through a standing secretariat. The common nationalist programme supports the ruling party governing institutions. Additional effects: +20 command power; Frontier Readiness Exercises for 365 days, including its listed upkeep. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_JK_sovereign_state$§!.\nComplete §Y$MDRC_JK_restoration_suppliers$§!.\nComplete §Y$MDRC_JK_restoration_mobilisation$§!."
 MDRC_JK_religious: "A Religious Governing Charter"
 MDRC_JK_religious_desc: "A Salafist-outlook government must already hold office. Define the institutions through which the governing religious movement will administer a diverse Congolese republic. Publish the public obligations attached to governing authority. Formal duties unsettle informal arrangements while establishing a common standard. Additional effects: -1 stability percentage points; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_transition$§!."
 MDRC_JK_religious_council: "A Council of Civil Administration"
 MDRC_JK_religious_council_desc: "Establish a civilian council responsible for budgets, appointments and public services. Religious legitimacy must be accompanied by administrative competence. Appoint trained civilian officials and a channel for service disputes. Authority gains an institution able to coordinate decisions. Additional effects: -10 political power; Ceasefire Liaison Network for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_religious$§!."
 MDRC_JK_religious_statute: "Publish the Governing Statute"
 MDRC_JK_religious_statute_desc: "Publish the powers and duties of national institutions. Citizens and officials need clear procedures rather than shifting informal instructions. Publish appointment and appeal procedures with the statute. Predictable rules distinguish public authority from personal instructions. Additional effects: +1 stability percentage points; +15 political power. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_religious_council$§!."
 MDRC_JK_religious_audit: "Audit the Endowments"
 MDRC_JK_religious_audit_desc: "Record the assets and obligations of public endowments. Transparent accounts make social provision more reliable. Disclose public endowment assets, beneficiaries and obligations. Reconciliation recovers duplicate payments and protects service resources. Additional effects: -10 political power; +0.1 treasury. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_religious_statute$§!."
 MDRC_JK_religious_courts: "Standards for Public Justice"
 MDRC_JK_religious_courts_desc: "Train legal officers and publish appeal procedures. Predictable administration of justice can reduce arbitrary local decisions. Record schedules and publish appeal procedures. Comparable court records make justice more predictable between districts. Additional effects: +1 stability percentage points; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_religious_audit$§!."
 MDRC_JK_religious_consultation: "Provincial Consultation Councils"
 MDRC_JK_religious_consultation_desc: "Give provincial communities regular access to national administrators. Consultation helps identify public-service failures before they become political crises. Submit provincial service complaints through a national secretariat. Administrative access prevents local failures becoming wider confrontations. Additional effects: +15 political power; Ceasefire Liaison Network for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_religious_courts$§!."
 MDRC_JK_religious_services: "A Public Service Covenant"
 MDRC_JK_religious_services_desc: "Set measurable commitments for schools, clinics and local administration. A governing movement must be judged by its ability to provide those services. Identify institutions responsible for health and education commitments. A service covenant needs a visible campaign and political investment. Additional effects: -15 political power; Community Health for 365 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_religious_consultation$§!."
 MDRC_JK_religious_charity: "Register Community Charities"
 MDRC_JK_religious_charity_desc: "Coordinate community assistance and publish its accounts. Reliable records ensure that assistance reaches the intended communities. Share beneficiary records and publish audited charitable distributions. Coordination reduces duplication and strengthens public confidence. Additional effects: +1 stability percentage points; +0.05 treasury. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_religious$§!."
 MDRC_JK_religious_clinics: "Community Clinic Partnerships"
 MDRC_JK_religious_clinics_desc: "Train health workers and establish common supply arrangements for community clinics. Consistent care strengthens confidence in public institutions. Share procurement and referral arrangements with national health administrators. Reliable supplies make local initiative effective. Additional effects: -10 political power; Community Health for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_religious_charity$§!."
 MDRC_JK_religious_schools: "Common School Standards"
 MDRC_JK_religious_schools_desc: "Set common teaching standards and recognize technical qualifications across community schools. Education must equip pupils for public life and employment. Recognize qualifications and provide common teacher-development courses. Community schooling must prepare pupils for the wider economy. Additional effects: +1 stability percentage points; Research Partnerships for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_religious_clinics$§!."
 MDRC_JK_religious_farmers: "Rural Cooperative Finance"
 MDRC_JK_religious_farmers_desc: "Pool local savings and technical assistance for agricultural cooperatives. Small producers need practical support as well as promises of renewal. Pool rural savings with extension and repair services. Cooperative purchasing gives small producers practical assistance. Additional effects: +0.05 treasury; Rural Recovery for 180 days, including its listed upkeep; one 20% agriculture research bonus. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_religious_schools$§!."
 MDRC_JK_religious_workshops: "Community Workshop Networks"
 MDRC_JK_religious_workshops_desc: "Support repair workshops and vocational instruction through local institutions. Useful skills help households participate in the wider economy. Train apprentices and document repair standards. Vocational instruction gains value when customers can rely on its work. Additional effects: +10 political power; Industrial Rehabilitation for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_religious_farmers$§!."
 MDRC_JK_religious_minorities: "A Covenant of Civil Protection"
 MDRC_JK_religious_minorities_desc: "Set out the protection owed to every civilian community and the responsibilities of public officials. National administration must keep local disputes from becoming collective punishment. Bind officials to protect every civilian community from collective retaliation. Enforcing protection costs hardliner support but strengthens confidence. Additional effects: +2 stability percentage points; -15 political power. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_religious$§!."
 MDRC_JK_religious_languages: "Accessible Public Notices"
 MDRC_JK_religious_languages_desc: "Publish essential instructions in the languages used by local communities. Access to public information should not depend on a journey to the capital. Explain essential procedures in locally used languages. Official rules must remain usable outside the capital. Additional effects: +10 political power; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_religious_minorities$§!."
 MDRC_JK_religious_accounts: "Professional Ministry Accounts"
 MDRC_JK_religious_accounts_desc: "Employ trained accountants and standardize reporting between ministries. Public administration needs records that can be compared and audited. Employ trained financial officers and reconcile ministry appropriations. Comparable accounts clarify service costs and recover duplicate spending. Additional effects: -10 political power; +0.1 treasury. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_religious_languages$§!."
 MDRC_JK_religious_mediation: "A National Mediation Secretariat"
 MDRC_JK_religious_mediation_desc: "Train civilian mediators to resolve community and administrative disputes. Consistent procedures provide an alternative to escalating local confrontations. Record mediated agreements and monitor implementation. Reconciliation lasts when responsible institutions fulfil their promises. Additional effects: +1 stability percentage points; Ceasefire Liaison Network for 180 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_religious_accounts$§!."
 MDRC_JK_religious_technical: "Technical Service Fellowships"
 MDRC_JK_religious_technical_desc: "Provide technical fellowships for public utilities and essential services. Skilled personnel make institutional commitments possible to fulfil. Place technical fellows in utilities with supervised practical work. Service commitments require engineers as well as declarations. Additional effects: -10 political power; Research Partnerships for 180 days, including its listed upkeep; one 20% energy efficiency research bonus. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_religious_mediation$§!."
 MDRC_JK_religious_settlement: "A Durable Religious Administration"
 MDRC_JK_religious_settlement_desc: "Complete the governing, community-service and civil-administration branches of the religious political programme. A permanent national spirit grants +4% stability and +5% political-power gain. Consolidate endowments, ministries and community services into an audited covenant. Administrative savings sustain public-health provision. Additional effects: +0.1 treasury; Community Health for 365 days, including its listed upkeep. Each reform immediately improves The Congolese Public-Service Covenant; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_JK_religious_services$§!.\nComplete §Y$MDRC_JK_religious_workshops$§!.\nComplete §Y$MDRC_JK_religious_technical$§!."
 MDRC_JK_nationalist_populist_1: "A Populist National Compact"
 MDRC_JK_nationalist_populist_1_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Publish constituency promises and a delivery register. Turning a mass campaign into obligations exposes disagreements over priorities. Additional effects: -1 stability percentage points; +25 political power. Each reform immediately improves A National Popular Mandate; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_restoration_settlement$§!."
 MDRC_JK_nationalist_populist_2: "Constituency Service Offices"
 MDRC_JK_nationalist_populist_2_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Constituency offices will coordinate service access and submit unresolved cases for review. The popular mandate becomes a working network. Additional effects: -10 political power; Rural Recovery for 180 days, including its listed upkeep. Each reform immediately improves A National Popular Mandate; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_nationalist_populist_1$§!."
 MDRC_JK_nationalist_populist_3: "A National Development Referendum"
 MDRC_JK_nationalist_populist_3_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Ratify a published development programme and require implementation reports. The referendum mandates the completed constituency-service system. Additional effects: +1 stability percentage points; Reconstruction Works for 365 days, including its listed upkeep. Each reform immediately improves A National Popular Mandate; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_nationalist_populist_2$§!."
 MDRC_JK_nationalist_front_1: "A Corporatist National Front"
 MDRC_JK_nationalist_front_1_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Consolidate industrial representation in a central corporatist framework. Concentrated direction disrupts independent economic bargaining. Additional effects: -2 stability percentage points; +15 command power. Each reform immediately improves Corporatist Industrial Direction; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_restoration_settlement$§!."
 MDRC_JK_nationalist_front_2: "National Production Syndicates"
 MDRC_JK_nationalist_front_2_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Syndicates will coordinate strategic contracts and workforce training. Firms surrender independent allocation decisions to national priorities. Additional effects: -15 political power; Industrial Rehabilitation for 180 days, including its listed upkeep. Each reform immediately improves Corporatist Industrial Direction; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_nationalist_front_1$§!."
 MDRC_JK_nationalist_front_3: "A Central Industrial Directorate"
 MDRC_JK_nationalist_front_3_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Maintain inventories and strategic agreements across the syndicates. Standing institutions support defence production at a continuing civilian cost. Additional effects: +1 war-support percentage points; Industrial Rehabilitation for 365 days, including its listed upkeep; one 20% robotics research bonus. Each reform immediately improves Corporatist Industrial Direction; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_nationalist_front_2$§!."
 MDRC_JK_nationalist_junta_1: "A National Defence Council"
 MDRC_JK_nationalist_junta_1_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Define the military secretariat authority over reconstruction appointments. Clear command improves coordination while concentrated power creates friction. Additional effects: -1 stability percentage points; +15 army experience. Each reform immediately improves Military Administrative Command; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_restoration_settlement$§!."
 MDRC_JK_nationalist_junta_2: "Professional Military Administration"
 MDRC_JK_nationalist_junta_2_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Rotate military administrators through budgeting and project-management courses. The council must deliver services without treating every problem as combat. Additional effects: +20 command power; Frontier Readiness Exercises for 180 days, including its listed upkeep. Each reform immediately improves Military Administrative Command; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_nationalist_junta_1$§!."
 MDRC_JK_nationalist_junta_3: "A Reconstruction Exit Strategy"
 MDRC_JK_nationalist_junta_3_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Publish reconstruction milestones and permanent military responsibilities. A defined mandate reduces uncertainty without automatically replacing the government. Additional effects: +2 stability percentage points; Treasury Reconstruction Team for 365 days, including its listed upkeep. Each reform immediately improves Military Administrative Command; its exact changes and ongoing costs are listed in the effects. Reveals the Central African Military Directorate and Central African Defense State decisions in Regional Unions and Integration. Unmet political and territorial requirements are shown on each decision. Formation preserves puppets.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_nationalist_junta_2$§!."
 MDRC_JK_nationalist_crown_1: "The House of Kilukeni"
 MDRC_JK_nationalist_crown_1_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Publish a royal statute and seek recognition across the historic Kongo region. Dynastic symbolism receives a defined institutional foundation. Additional effects: -20 political power; reciprocal +25 opinion with AGL only when those countries exist and are at peace with DRC. Each reform immediately improves The Kilukeni Royal Settlement; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_restoration_settlement$§!."
 MDRC_JK_nationalist_crown_2: "A Council of the Crown"
 MDRC_JK_nationalist_crown_2_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Reconcile the royal household, provincial representation and administration through the council of the crown. Published accounts separate dynastic institutions from public funds. Additional effects: +1 stability percentage points; Treasury Reconstruction Team for 180 days, including its listed upkeep. Each reform immediately improves The Kilukeni Royal Settlement; its exact changes and ongoing costs are listed in the effects.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_nationalist_crown_1$§!."
 MDRC_JK_nationalist_crown_3: "A Modern Royal Administration"
 MDRC_JK_nationalist_crown_3_desc: "This programme requires the corresponding nationalist party to be in power. Develop its distinct governing institutions while retaining the common national reconstruction programme. The focus does not change the ruling party. Bind royal administration to professional appointments and consultation. The dynasty can seek regional recognition through institutions able to honour agreements. Additional effects: Active Diplomatic Missions for 365 days, including its listed upkeep; reciprocal +25 opinion with CNG only when those countries exist and are at peace with DRC. Each reform immediately improves The Kilukeni Royal Settlement; its exact changes and ongoing costs are listed in the effects. Reveals the Restored Kingdom of Kongo and Greater Congolese Empire decisions in Regional Unions and Integration. Unmet political and territorial requirements are shown on each decision. Formation preserves puppets.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_JK_nationalist_crown_2$§!."
 MDRC_JK_nationalist_consolidation: "A Consolidated Nationalist Settlement"
 MDRC_JK_nationalist_consolidation_desc: "Complete the governing programme of the nationalist party in office. Its institutions now join the Republic common civil-service standards without imposing a different nationalist party. Adopt a common technical review process across the selected nationalist institutions. The settlement must keep learning after its founding campaign. Additional effects: Research Partnerships for 365 days, including its listed upkeep; reciprocal +25 opinion with ZAM only when those countries exist and are at peace with DRC. Each reform immediately improves Congolese National Resilience; its exact changes and ongoing costs are listed in the effects. Reveals the Greater Congo and Central African State decisions in Regional Unions and Integration. Unmet political and territorial requirements are shown on each decision. Formation preserves puppets.\n\n§W--------------§!\nRequired earlier focuses:\nComplete §Yany one§! of: §Y$MDRC_JK_nationalist_populist_3$§!, §Y$MDRC_JK_nationalist_front_3$§!, §Y$MDRC_JK_nationalist_junta_3$§!, §Y$MDRC_JK_nationalist_crown_3$§!."
