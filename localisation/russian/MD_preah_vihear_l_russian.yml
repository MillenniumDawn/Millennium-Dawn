 preah_vihear_news.4.t: "Решающая победа в Преах Вихеар"
 preah_vihear_news.4.d_sia: "Таиланд одержал решающую победу в затянувшемся противостоянии в Преах-Вихеаре, вынудив Камбоджу пойти на унизительный дипломатический шаг. Территория не перешла из рук в руки, но Бангкок объявляет это противостояние национальным триумфом."
 preah_vihear_news.4.d_cbd: "Камбоджа одержала решающую победу в затянувшемся противостоянии в Преах-Вихеаре, вынудив Таиланд пойти на унизительный дипломатический шаг. Территория не перешла из рук в руки, но Пномпень заявляет, что это противостояние стало национальным триумфом."
 preah_vihear_news.4.o1: "Соперничество окончательно разрешилось, по крайней мере, на данный момент."
 SIA_preah_vihear_vindicated: "Преах Вихеар Оправдание"
 SIA_preah_vihear_vindicated_desc: "Таиланд обеспечил себе контроль над спорной территорией вокруг храмового комплекса, и правительство пожинает политические плоды затянувшегося пограничного спора, урегулированного на его собственных условиях."
 SIA_preah_vihear_humiliation: "Унижение Преах Вихеар"
 SIA_preah_vihear_humiliation_desc: "В настоящее время Камбоджа контролирует спорные территории вокруг Преах-Вихеара, и эта потеря ощущается всем политическим спектром как провал как дипломатии, так и вооруженных сил."
 CBD_preah_vihear_vindicated: "Преах Вихеар Оправдание"
 CBD_preah_vihear_vindicated_desc: "Камбоджа обеспечила себе контроль над спорной территорией вокруг храмового комплекса, и правительство пожинает политические плоды затянувшегося пограничного спора, урегулированного на собственных условиях."
 CBD_preah_vihear_humiliation: "Унижение Преах Вихеар"
 CBD_preah_vihear_humiliation_desc: "В настоящее время Таиланд контролирует спорные территории вокруг Преах-Вихеара, и эта потеря ощущается всем политическим спектром как провал как дипломатии, так и вооруженных сил."
 preah_vihear_observers: "Индонезийские пограничники"
 preah_vihear_observers_desc: "В рамках соглашения, достигнутого при посредничестве АСЕАН, вдоль границы в районе реки Преах-Вихеар размещены невооруженные индонезийские наблюдатели, которые следят за нарушениями режима прекращения огня и предоставляют правительствам обеих стран некоторую поддержку, чтобы дать конфликту утихнуть."
 preah_vihear_icj_grounds_TT: "Напряженность на границе превышает 74, или Таиланд уже нанес удар через границу."