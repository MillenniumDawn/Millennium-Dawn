 CAN_low_french_happiness_effect: "낮은 행복도:\n§H안정도:§! §R-5%§!\n"
 CAN_very_low_french_happiness_effect: "매우 낮은 행복도:\n§H정치력 획득:§! §R-25%§!\n§H안정도:§! §R-10%§!\n"
 CAN_extremely_low_french_happiness_effect: "엄청 낮은 행복도:\n§H정치력 획득:§! §R-50%§!\n§H안정도:§! §R-15%§!\n"
 CAN_canadian_influence: "캐나다 영향 주력"
 CAN_align_grenada_desc: "캐나다와 그레나다는 상당한 유대와 수백만 달러 규모의 무역을 누리고 있습니다. 기존의 이 긴밀한 관계를 토대로 발전시켜야 합니다."
 CAN_Focus_Oil_Sands_research_boost: "오일샌드 집중"
 CAN_Focus_Oil_Sands_research_boost_desc: "우리는 새로운 오일샌드 유전 개발에 노력을 집중했습니다. 이 개발은 다른 분야에도 도움이 될 것입니다."
 CAN_Focus_Oil_Shales_research_boost: "오일 셰일 집중"
 CAN_Focus_Oil_Shales_research_boost_desc: "우리는 새로운 오일 셰일 유전 개발에 노력을 집중했습니다. 이 개발은 다른 분야에도 도움이 될 것입니다."
 CAN_nato_research_research_boost: "NATO 공동 연구"
 CAN_nato_research_research_boost_desc: "우리는 새로운 전술을 개발하기 위해 NATO와 힘을 합쳤습니다."
 CAN_modify_french_happiness_tt: "§Y프랑스계 캐나다인§!의 행복도가 [?modify_que_happy|+0] 만큼 변동합니다 (현재: [?CAN.french_happiness_var|Y0])\n"
 CAN_modify_subsidy_changes_tt: "캐나다 §Y정부 보조금§!이 매주 $$[?subsidy_change_tmp|-3] x10억 만큼 변동합니다 (현재 비용: $$[?CAN_subsidy_total|R3] x10억)\n"
 CAN_remove_french_happiness_tt: "현재 보유한 §Y프랑스계 캐나다인의 행복도§! 국가 정신을 제거합니다\n"
 CAN_oil_prospects_idea: "화석 연료 산업 보조금"
 CAN_oil_prospects_idea_desc: "화석 연료 산업 보조금은 우리 석유 산업이 국가의 필요에 맞게 더 적절히 기능하도록 촉진하는 데 도움이 될 수 있습니다."
 CAN_multi_ethnic_nation: "다민족 국가"
 CAN_multi_ethnic_nation_desc: "캐나다는 영국과 프랑스 양국에 의해 식민지화되었고, 수많은 원주민 부족이 있으며, 전 세계 다른 나라에서 온 이민자들이 많은, 세계의 여러 다민족 국가 중 하나입니다. 이 분열 중 가장 두드러진 것은 퀘벡 사람들과 영어를 쓰는 나머지 국민 사이의 분열입니다. 이 간극을 계속 좁힌다면 우리의 지도 아래 나라는 번영하여 새로운 캐나다의 토대를 마련할 것입니다."
 CAN_renewable_energy_focus: "재생 에너지"
 CAN_renewable_energy_focus_desc: "캐나다는 태양광, 풍력, 수력, 원자력을 막론하고 천연자원과 미개발 재생 에너지 잠재력이 풍부한 땅입니다. 이러한 전략적 재생 자원에 투자하여 성장을 계속하고 시대에 발맞춰 끊임없이 늘어나는 산업을 뒷받침해야 합니다."
 CAN_french_happiness_TT: "§H[?CAN.french_happiness_var|0]%§!"
 CAN_keystone_pipeline_event_tt: "키스톤 송유관 사건 연쇄를 시작합니다"
 CAN_effect_warning_tt: "효과는 위에서의 선택에 따라 달라집니다."
 CAN_quebec_calm_down_tt: "퀘벡은 정부에 결코 반란을 일으키지 않을 것입니다"
 CAN_request_fra_investment_tt: "프랑스에 우리나라에 대한 투자를 요청합니다"
 CAN_request_uk_investment_tt: "영국에 우리나라에 대한 투자를 요청합니다"
 CAN_request_usa_investment_tt: "미국에 우리나라에 대한 투자를 요청합니다"
 CAN_request_chi_investment_tt: "중국에 우리나라에 대한 투자를 요청합니다"
 CAN_request_sov_investment_tt: "러시아에 우리나라에 대한 투자를 요청합니다"
 CAN_global_company_effect_tt: "이 길을 택하면 약간의 경미한 영향력을 희생하고 이 기업들이 캐나다로 오도록 요청하게 됩니다."
 CAN_culture_divide_event_tt: "캐나다 내 영어권 문화와 프랑스어권 문화의 분열"
 CAN_refuse_oil_company_event_tt: "석유 기업에 대한 보조금 지급을 거부한다"
 canada.20.b: "협정을 거절한다"
 canada_md_politics.3.d: "침엽수 목재를 둘러싼 네 번째 분쟁이 또다시 시작되었습니다. 미국이 또다시 이 문제로 시비를 걸어왔습니다. 그들에 따르면 우리 주 정부들이 목재 산업에 부당하게 보조금을 주고 있다고 합니다. 목재는 주 정부 소유이므로 가격도 주 정부가 정합니다. 우리 시장은 미국인들이 익숙한 방식과 다소 다르게 돌아갑니다. 어쨌든 그들은 이른바 \\"공정한 경쟁 환경\\"을 만든다며 우리에게 관세를 부과할 수 있는 법을 갖고 있습니다. 세계무역기구를 끌어들이면 이 터무니없는 일을 단번에 끝낼 수 있을 것입니다. 그러나 미국을 화나게 해 이 문제가 목재에만 그치지 않게 될 위험이 있습니다."
 CAN_tax_cuts_req_tt: "우리의 §Y인구§!와 §Y법인세율§!이 모두 §Y10%§!보다 높음"
 canada_md_politics.27.t: "크레티앵 시대의 종언"
 canada_md_politics.27.d: "거의 10년간 집권한 장 크레티앵이 총리직에서 물러날 의사를 밝혔습니다. 그의 오랜 재임은 자유당에 안정과 선거 승리를 가져왔으나, 당내 분열은 갈수록 외면하기 어려워졌습니다. 크레티앵이 정치 무대를 떠날 준비를 하면서, 이제 관심은 오랜 재무장관이자 가장 유력한 후계자인 폴 마틴에게 쏠리고 있습니다. 자유당은 새 지도자를 세울 때인지 결정해야 합니다."
 canada_md_politics.27.a: "폴 마틴이 자유당을 이끈다."
 canada_md_politics.27.b: "크레티앵에게는 아직 할 일이 남아 있다."
 canada_md_politics.28.t: "보수당 정부"
 canada_md_politics.28.d: "수년간의 야당 생활 끝에 보수 진영이 오타와에서 다시 권력을 잡았습니다. 스티븐 하퍼가 연방 정부의 새 지도자로 떠올라 캐나다에 다른 방향을 약속했습니다. 그의 정부는 재정 건전성, 더 강력한 연방 권한, 국내외 문제에 대한 더 보수적인 접근을 강조할 계획입니다. 캐나다 정치의 새로운 장이 시작되었습니다."
 canada_md_politics.28.a: "스티븐 하퍼가 고삐를 잡는다."
 canada_md_politics.28.b: "정부는 그대로 유지된다."
 canada_md_politics.29.t: "새로운 자유당 세대"
 canada_md_politics.29.d: "자유당이 캐나다를 이끌 새로운 얼굴을 선택했습니다. 전 총리 피에르 트뤼도의 아들인 저스틴 트뤼도는 당내에서 빠르게 승진하여 이제 연방 정부의 수장 자리에 올랐습니다. 캐나다에 대해 더 개방적이고 진보적이며 낙관적인 비전을 약속하는 트뤼도는 자유당 지도부의 세대교체를 상징합니다. 국민은 이제 그의 정부가 무엇을 가져다줄지 지켜보고 있습니다."
 canada_md_politics.29.a: "저스틴 트뤼도가 캐나다를 이끈다."
 canada_md_politics.29.b: "정부는 그대로 유지된다."
 canada_md_politics.30.t: "트뤼도 시대의 종말"
 canada_md_politics.30.d: "거의 10년간 총리를 지낸 저스틴 트뤼도가 자유당 당수 및 정부 수반직에서 사임한다고 발표했습니다. 그의 재임은 야심 찬 사회 정책, 강력한 국제적 존재감, 국내에서 갈수록 격화되는 정치적 분열로 특징지어졌습니다. 트뤼도가 물러나면서 자유당은 국제적으로 명성 높은 경제학자이자 기술 관료이며 전 중앙은행 총재인 마크 카니를 내세워 나라를 새로운 정치 시대로 이끌게 했습니다."
 canada_md_politics.30.a: "마크 카니가 자유당을 이끈다."
 canada_md_politics.30.b: "트뤼도가 계속 재임한다."
 PAUL_MARTIN_LEADER_DESC: "폴 마틴은 거의 10년간 캐나다 재무장관을 지낸 자유당의 베테랑 정치인입니다. 재정 책임과 경제 개혁에 초점을 맞춘 것으로 알려진 마틴은 자유당 내에서 보다 실용적이고 경제 지향적인 계파를 대표합니다. 총리로서 그는 자유당의 사회 정책과 절제된 정부 지출을 결합하고자 합니다."
 STEPHEN_HARPER_LEADER_DESC: "스티븐 하퍼는 보수 성향의 경제학자이자 정치인으로, 캐나다 보수 운동의 선도적 인물 중 하나로 두각을 나타냈습니다. 재정 규율, 신중한 정부, 더 단호한 연방 정책의 강력한 옹호자인 하퍼는 캐나다를 보수주의 노선에 따라 재편하고자 합니다. 그의 정부는 안정, 책임, 그리고 세계 무대에서 캐나다의 더 강력한 역할을 약속합니다."
 JUSTIN_TRUDEAU_LEADER_DESC: "저스틴 트뤼도는 자유당 정치인이자 전 총리 피에르 트뤼도의 아들입니다. 카리스마 있고 정치적으로 세련된 그는 새로운 세대의 캐나다 지도부의 얼굴로 자신을 내세웁니다. 트뤼도는 진보적 사회 정책, 다문화주의, 세계 속 캐나다의 위상에 대한 낙관적 비전을 옹호합니다."
 MARK_CARNEY_LEADER_DESC: "마크 카니는 캐나다 은행과 영국 은행의 총재를 모두 지낸 국제적으로 명성 높은 경제학자이자 전 중앙은행 총재입니다. 경제 안정에 강한 초점을 맞춘 실용적인 기술 관료인 카니는 자유당에 풍부한 금융 정책 경험을 가져옵니다. 총리로서 그는 경제적 유능함과 실용적인 통치 방식을 결합하고자 합니다."
 CAN_subsidy_total_above_20_tt: "주간 §Y정부 보조금§!이 $$ 0.2 십억 이상이어야 함 (현재 $$[?CAN_subsidy_total|R3] 십억)"
 CAN_subsidy_total_above_10_tt: "주간 §Y정부 보조금§!이 $$ 0.1 십억 이상이어야 함 (현재 $$[?CAN_subsidy_total|R3] 십억)"
 CAN_war_decisions: "전쟁 결정"
 CAN_burn_white_house: "백악관을 불태운다"
 CAN_white_house_burned: "백악관을 불태움"
 CAN_white_house_burned_desc: "우리 군이 미국 대통령의 공식 관저인 백악관을 불태웠습니다. 이 도전적인 행위는 우리 병사들의 사기를 높이고 적에게 우리의 힘을 보여 줄 것입니다."
 canada_news.2.t: "백악관 방화"
 canada_news.2.d: "세계를 충격에 빠뜨린 조치로, 캐나다군이 백악관과 여러 핵심 미국 정부 건물에 불을 질렀습니다. 미국 대통령 [USA.GetLeader]은(는) 미국 국민의 이름으로 복수를 맹세했습니다. \n이 도전적인 행위는 캐나다의 결의와 군사력에 대해 미국과 세계에 강력한 메시지를 보냈습니다. 국제 사회는 사태를 예의주시하고 있으며, 미국과 캐나다 관계에 미칠 파장은 상당합니다."
 canada_news.2.a: "그들은 영원히 기억할 것이다"
 canada_news.2.b: "그들이 이 일을 무사히 넘기지는 못할 것이다"
 CAN_improve_infrastructure_1159: "서부 퀘벡 인프라 확충"
 CAN_improve_infrastructure_1160: "웅가바 인프라 확충"
 CAN_ati_canadian_graphics_research_compact: "캐나다 그래픽스 연구 협약"
 CAN_ati_canadian_graphics_research_compact_desc: "보호받는 캐나다 연구 기지가 AMD의 현지 엔지니어링 팀을 대학 및 공공 연구소와 연결합니다. 이 협약은 첨단 그래픽스 전문성이 캐나다에 뿌리내리도록 하면서 글로벌 제품에도 기여합니다."
 CAN_ati_integrated_amd_compute_engine: "통합 AMD 컴퓨트 엔진"
 CAN_ati_integrated_amd_compute_engine_desc: "캐나다의 그래픽스 엔지니어링이 프로세서, 그래픽스, 콘솔, 데이터센터 가속기에 걸친 통합 AMD 플랫폼에 내재되어 있습니다. 공유된 로드맵은 구조적 깊이를 생산 및 연구 역량으로 전환합니다."
 canada.310.a: "아키텍처 팀을 지원한다"
 canada.310.b: "아키텍처를 상업적으로 확장한다"
 canada.310.d: "ATI의 라데온 9700 프로는 2002년 7월 18일 R300 아키텍처를 선보이며 캐나다 설계 팀을 프로그래머블 그래픽스의 선두에 올려놓았습니다. 우리는 이 우위를 아키텍처 연구를 심화하는 데 쓸지, 상업적 확장을 가속하는 데 쓸지 결정해야 합니다."
 canada.310.t: "그래픽스 경쟁을 바꾼 R300"
 canada.311.a: "세미커스텀 사업을 구축한다"
 canada.311.b: "PC 로드맵을 우선시한다"
 canada.311.d: "마이크로소프트와 ATI는 2003년 8월 14일 차세대 엑스박스를 위한 기술 개발 계약을 발표했습니다. 이 계약은 캐나다의 세미커스텀 설계 사업을 확립할 수도 있고, ATI의 개인용 컴퓨터 로드맵에 종속된 채로 남을 수도 있습니다."
 canada.311.t: "엑스박스 프로그램에 진입한 ATI"
 canada.312.a: "엔지니어링 로드맵을 통합한다"
 canada.312.b: "캐나다 연구 협약을 보호한다"
 canada.312.d: "AMD는 2006년 10월 ATI 인수를 완료했습니다. 1년 후, 우리는 인수한 그래픽스 팀이 AMD의 프로세서 로드맵에 어떻게 들어맞을지, 그리고 ATI를 가치 있게 만든 엔지니어링 기반을 어떻게 보존할지 정해야 합니다."
 canada.312.t: "AMD 인수 이후의 ATI"
 canada.313.a: "콘솔 네트워크를 제도화한다"
 canada.313.b: "개인용 컴퓨터 아키텍처에 재투자한다"
 canada.313.d: "마크햄의 옛 ATI 팀이 그래픽스를 맡은 세미커스텀 AMD APU가 2013년 11월 마이크로소프트의 엑스박스 원과 소니의 플레이스테이션 4를 구동했습니다. 이 계약은 견고한 실리콘 네트워크의 닻이 될 수도 있고, 우리 개인용 컴퓨터 아키텍처 프로그램을 위한 수익을 창출할 수도 있습니다."
 canada.313.t: "한 세대의 콘솔을 구동한 라데온"
 canada.314.a: "라데온을 AMD의 통합 컴퓨트 엔진에 편입한다"
 canada.314.b: "캐나다 그래픽스 연구 협약의 기반을 다진다"
 canada.314.d: "AMD는 2019년 7월 7일 게이밍과 미래 플랫폼을 위해 재설계한 아키텍처로 최초의 RDNA 그래픽스 제품을 출시했습니다. 이를 설계한 마크햄의 옛 ATI 엔지니어들은 프로세서, 콘솔, 데이터센터 가속기를 아우르는 단일 AMD 플랫폼에 흡수될 수도 있고, 독자적인 연구 기지로 남을 수도 있습니다."
 canada.314.t: "라데온 아키텍처를 재정립한 RDNA"
 canada.320.t: "몬트리올 그래픽스 하우스"
 canada.320.d: "매트록스는 그래픽스 시장에서 실질적인 점유율과 제대로 작동하는 드라이버라는 평판을 갖고 있습니다. 훨씬 큰 두 경쟁사가 칩 한 세대에 매트록스의 연간 수익보다 더 많은 돈을 쏟아부으려 하고 있습니다. 매트록스는 소비자 시장을 두고 싸울 수도 있고, 신뢰성에 대가를 치르는 전문가 고객층으로 물러날 수도 있습니다."
 canada.320.a: "전문가 시장으로 후퇴한다"
 canada.320.b: "소비자 시장을 두고 싸운다"
 canada.321.t: "파헬리아의 두 번째 기회"
 canada.321.d: "매트록스의 파헬리아는 ATI와 엔비디아의 경쟁 제품보다 늦게, 그리고 더 느리게 나왔습니다. 후속작에는 한 세대 분량의 자금이 필요하지만, 더 잘될 것이라는 보장은 없습니다. 이를 취소하면 몬트리올은 영구히 소비자 그래픽스에서 손을 떼게 됩니다."
 canada.321.a: "소비자 라인을 취소한다"
 canada.321.b: "한 세대 더 자금을 지원한다"
 canada.322.t: "마지막 독립 기업"
 canada.322.d: "캐나다의 다른 그래픽스 기업이 외국 칩 제조사에 인수되어, 매트록스는 국내에 남은 마지막 독립 그래픽스 기업이 되었습니다. 파트너는 자본과 생산 시설 접근권을 가져오겠지만 그쪽의 조건을 따라야 합니다. 비상장으로 남으면 모든 것을 수익으로 충당해야 합니다."
 canada.322.a: "독립 비상장 기업으로 남는다"
 canada.322.b: "외국 파트너와 그 자본을 받아들인다"
 canada.323.t: "픽셀에서 비전으로"
 canada.323.d: "디스플레이를 구동하는 바로 그 매트록스 실리콘으로 생산 라인의 부품을 검사할 수 있으며, 산업 고객은 프레임 속도가 아닌 정확도에 대가를 지불합니다. 머신 비전을 회사의 중심에 두려면 그에 맞춰 회사를 재건해야 합니다. 디스플레이를 고수하면 이미 잘 돌아가는 사업을 유지할 수 있습니다."
 canada.323.a: "머신 비전을 중심으로 회사를 재건한다"
 canada.323.b: "전문가용 디스플레이를 고수한다"
 canada.324.t: "매트록스 분할"
 canada.324.d: "매트록스의 이미징, 비디오, 그래픽스 사업은 하나의 이름과 하나의 대차대조표를 공유하는 세 개의 회사로 성장했습니다. 이들을 분할하면 각자가 외부 투자를 받고 스스로 책임질 수 있습니다. 함께 두면 창업주들의 회사가 온전히 유지되고 사업 간 교차 보조도 유지됩니다."
 canada.324.a: "사업 부문을 별개의 회사로 분할한다"
 canada.324.b: "그룹을 온전하게 유지한다"
 canada.325.t: "북극광, 실리콘의 그림자"
 canada.325.d: "사반세기에 걸친 축소와 전문화가 매트록스의 존재 이유를, 그리고 그와 함께 남은 캐나다 그래픽스 엔지니어링의 운명을 정해 주었습니다. 한때 모두에게 카드를 팔던 몬트리올 기업은 이제 오직 자신만이 계속 만들어 주는 것을 필요로 하는 이들에게 판매합니다."
 canada.325.a: "보안 비전 스택"
 canada.325.b: "인증된 시각 시스템"
 canada.325.c: "주권적 시각 컴퓨팅"
 canada.325.e: "열린 그래픽스 연방"
 CAN_matrox_secure_vision_stack: "보안 비전 스택"
 CAN_matrox_secure_vision_stack_desc: "해외의 누구에게도 책임을 지지 않는 기업이 만든 머신 비전으로, 검사 시스템이 어디서 설계되었는지 알아야 하는 고객을 위한 것입니다. 시장은 좁고 그 안에 있는 이들은 다른 곳에서 구매할 수 없습니다."
 CAN_matrox_certified_visual_systems: "인증된 시각 시스템"
 CAN_matrox_certified_visual_systems_desc: "픽셀 하나의 오류가 중대한 결과를 낳는 산업 및 의료 작업을 위해 인증된 이미징 하드웨어입니다. 물량은 적고, 인증에는 수년이 걸리며, 일단 인증받으면 그 무엇도 이를 대체하지 못합니다."
 CAN_matrox_sovereign_visual_compute: "주권적 시각 컴퓨팅"
 CAN_matrox_sovereign_visual_compute_desc: "캐나다는 다른 모든 나라가 자국의 기업을 팔아넘기던 수십 년 동안에도 자체 그래픽스 기업을 지켜냈습니다. 부품은 가장 빠르지 않지만, 그 뒤의 엔지니어링은 몬트리올에 남았습니다."
 CAN_matrox_open_graphics_commonwealth: "열린 그래픽스 연방"
 CAN_matrox_open_graphics_commonwealth_desc: "드라이버, 도구, 문서는 라이선스 뒤에 숨겨지지 않고 공개되었습니다. 캐나다는 하드웨어로는 수익이 줄었지만, 표준이 작성되는 곳이 됨으로써 훨씬 더 많은 것을 얻습니다."
 canada.330.t: "모바일로 간 블랙베리"
 canada.330.d: "리서치 인 모션(RIM)이 기업 및 정부 고객들이 이미 의존하고 있는 보안 무선 이메일에 음성 통화를 결합한 블랙베리 5810을 선보였습니다. 가입자 증가가 닷컴 불황 속에서 워털루 기업을 견인하고 있습니다. 오타와는 연구 클러스터를 민간 자본에 맡길 수도 있고, 공적 자금을 투입해 뒷받침할 수도 있습니다."
 canada.330.a: "RIM이 민간 자본으로 성장하도록 둔다"
 canada.330.b: "워털루의 무선 클러스터를 지원한다"
 canada.331.t: "금지 명령"
 canada.331.d: "한 특허 보유 회사가 가입자 대부분이 있는 미국 전역에서 블랙베리 서비스를 중단시킬 수 있는 판결을 얻어냈습니다. 합의하면 위협이 즉시 끝나지만 6억 1,250만 달러가 듭니다. 계속 싸우면 돈은 지킬 수 있으나 회사의 최대 시장이 미국 법원의 손에 맡겨집니다."
 canada.331.a: "합의하고 위협을 끝낸다"
 canada.331.b: "금지 명령에 맞서 싸운다"
 canada.332.t: "터치스크린의 도전"
 canada.332.d: "애플의 아이폰은 터치스크린과 서드파티 애플리케이션을 스마트폰 시장의 중심에 올려놓았습니다. 리서치 인 모션은 기업 사업의 토대가 된 보안 키보드 기기를 지킬 수도 있고, 애플과 구글이 표준 확립을 끝내기 전에 블랙베리를 외부 소프트웨어에 개방할 수도 있습니다."
 canada.332.a: "보안 기업용 하드웨어를 지킨다"
 canada.332.b: "애플리케이션 생태계를 장려한다"
 canada.333.t: "RIM의 QNX 인수"
 canada.333.d: "리서치 인 모션이 약 2억 달러에 QNX 소프트웨어 시스템즈를 인수하여, 이미 자동차, 의료 장비, 산업 제어에서 구동 중인 실시간 운영 체제를 확보했습니다. 이는 차세대 휴대 단말기의 기반 소프트웨어가 될 수도 있고, 이미 신뢰받고 있는 임베디드 시장으로 더 깊이 밀고 나가는 데 쓰일 수도 있습니다."
 canada.333.a: "차세대 단말기 플랫폼을 구축한다"
 canada.333.b: "QNX를 휴대폰 너머로 확장한다"
 canada.334.t: "블랙베리 10의 마지막 승부수"
 canada.334.d: "리서치 인 모션은 사명을 블랙베리로 바꾸고 Z10과 Q10으로 블랙베리 10을 출시했습니다. QNX 기반의 이 시스템은 경쟁사들보다 수년 늦게 등장하여, 소비자 시장 재도전과 정부 및 기업 고객이 여전히 비용을 지불하는 기업 모빌리티 및 기기 관리 사업 사이에서 선택을 강요합니다."
 canada.334.a: "블랙베리 10 출시를 지원한다"
 canada.334.b: "기업 서비스를 우선시한다"
 canada.335.t: "워털루가 일군 것"
 canada.335.d: "블랙베리가 워털루에서 보안 모바일 컴퓨팅을 구축해 온 사반세기는 캐나다가 무엇을 만드는지, 누가 그것을 사는지, 그리고 그중 무엇이든 여전히 건물에 걸린 그 이름을 달고 있는지를 정해 주었습니다."
 canada.335.a: "임베디드 주권"
 canada.335.b: "보안 시스템, 가까이 두다"
 canada.335.c: "소프트웨어 전환"
 canada.335.e: "워털루의 버팀목"
 CAN_blackberry_embedded_sovereign: "임베디드 주권"
 CAN_blackberry_embedded_sovereign_desc: "휴대폰은 사라졌으나 운영 체제는 남았습니다. QNX는 자동차, 의료 장비, 산업 제어에서 구동되며, 회사는 이미 고객이던 기관들에 보안 소프트웨어를 판매합니다. 이에 의존하는 이들 중 그 사실을 아는 사람은 거의 없습니다."
 CAN_blackberry_secure_systems_holding: "보안 시스템 홀딩"
 CAN_blackberry_secure_systems_holding_desc: "임베디드 플랫폼이 단말기 사업의 비용을 대고, 단말기는 플랫폼을 구매하는 사람들 앞에 브랜드를 계속 노출시킵니다. 어느 쪽도 해당 분야에서 최대는 아니지만, 둘 다 유출되어서는 안 되는 것을 맡을 만큼 신뢰받고 있습니다."
 CAN_blackberry_software_pivot: "소프트웨어 전환"
 CAN_blackberry_software_pivot_desc: "운영 체제는 너무 늦게 나온 휴대폰에 소진되었고, 실패 속에서 살아남은 것은 그 아래에 있던 소프트웨어 사업이었습니다. 캐나다는 다른 곳에서는 구매하지 않을 정부들에 보안 통신과 기기 관리를 판매합니다."
 CAN_blackberry_waterloo_holdout: "워털루의 버팀목"
 CAN_blackberry_waterloo_holdout_desc: "캐나다는 다른 모든 나라가 시장을 두 미국 플랫폼에 내준 뒤에도 자체 모바일 플랫폼을 계속 구축했습니다. 설치 기반은 작지만 주권적이며 전적으로 캐나다의 통제 아래 있습니다."
 canada.7.c: "퀘벡 시티와 헌법 협상을 시작한다."
 CAN_quebec_talks_tt: "헌법 문제를 재론하면 프랑스계 캐나다인의 행복도가 §G12%§! §G증가§!하며 퀘벡 시티에 새로운 제안을 할 수 있습니다."
 CAN_federal_transfers_to_quebec: "평형 교부금 인상"
 CAN_federal_transfers_to_quebec_desc: "오타와는 가장 큰 소리로 요구하는 주들에게 언제든 조금 더 내줄 여유를 찾을 수 있으며, 퀘벡은 요구하는 데 결코 수줍어한 적이 없습니다."
 CAN_bilingual_public_services: "이중 언어 공공 서비스 확대"
 CAN_bilingual_public_services_desc: "가스페에서 밴쿠버 섬에 이르기까지 모든 연방 창구가 두 언어로 응대하는 것은 퀘벡에서는 오타와에서의 연설 열두 번보다 더 큰 가치가 있습니다."
 CAN_french_happiness_below_80_tt: "§Y프랑스계 캐나다인의 행복도§!가 80% 미만이어야 함 (현재 [?CAN.french_happiness_var|0]%)"
 canada_md_politics.31.t: "캐나다 동맹이 된 개혁당"
 canada_md_politics.31.d: "캐나다 개혁당이 우파를 단일 전국 정당으로 결집시키려는 운동의 결과로 캐나다 개혁보수동맹이 되었습니다. 새 동맹은 개혁당의 서부 포퓰리즘 강령을 유지하면서 온타리오와 그 너머의 보수 유권자들에게도 손을 뻗고 있습니다."
 canada_md_politics.31.a: "우파를 위한 더 넓은 깃발"
 canada_md_politics.32.t: "캐나다 보수당 창당"
 canada_md_politics.32.d: "양당 당원들이 합의안을 비준한 뒤 캐나다 동맹과 진보보수당이 합당하여 새로운 캐나다 보수당이 되었습니다. 연방 우파가 수년 만에 처음으로 단일 정당으로서 자유당과 맞서게 되었습니다."
 canada_md_politics.32.a: "우파가 통합되었다"
 canada_md_politics.33.t: "캐나다 최고경영자 협의회"
 canada_md_politics.33.d: "국가 현안 경영자 협의회가 이름을 캐나다 최고경영자 협의회로 바꾸었습니다. 캐나다 주요 기업 최고경영자들의 단체인 이 협의회는 새 이름이 무역, 안보, 북미 통합에 관한 정책을 형성하려는 포부를 반영한다고 밝혔습니다."
 canada_md_politics.33.a: "회원은 같고 이름만 새롭다"
 canada_md_politics.34.t: "캐나다 경영자 협의회"
 canada_md_politics.34.d: "캐나다 최고경영자 협의회가 이름을 캐나다 경영자 협의회로 바꾸었습니다. 이 협의회는 앞으로도 조세, 무역, 경제 정책에 관해 국내 최대 기업들의 최고경영자들을 대변할 것입니다."
 canada_md_politics.34.a: "평소와 다름없다"
