 ag_district_employment_button_delayed_tt: "Когда у нас больше рабочих мест, чем работников, в некоторых ситуациях может быть полезно увеличивать или уменьшать количество работников, распределённых по секторам (фабрики/офисы), чтобы освободить рабочую силу для других секторов.\n\nПолитическая власть: §R-20§!\n\n£click_left §YL ЛКМ§! — увеличить уровень занятости коммерческих сельскохозяйственных районов.\n£click_right §YR ПКМ§! — уменьшить его.\n\nТекущий целевой уровень занятости: §Y[?ROOT.agriculture_district_employment_var|%]§!"
