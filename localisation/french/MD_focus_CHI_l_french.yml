 track_ii: "Contacts de la piste II"
 apply_to_join_as_a_member_desc: "L'adhésion pleine à l'Organisation de coopération de Shanghai confère l'accès à l'architecture de sécurité de l'organisation, aux canaux d'investissement économique et aux mécanismes de coordination politique. La candidature déclenche une période d'examen de quatre-vingt-dix jours et, si elle est approuvée, attribue l'idée de palier d'adhésion approprié selon la voie de focus actuelle de la Chine."
 apply_to_join_as_an_observer_desc: "Le statut d'observateur donne accès aux sommets de l'Organisation de coopération de Shanghai, aux exercices conjoints et aux cadres de coordination économique sans les obligations de l'adhésion pleine. Les candidats doivent passer une période d'examen de quatre-vingt-dix jours par la Chine et, le cas échéant, la Russie avant que l'idée ne soit accordée."
 BRI_apply_for_mining_project: "Demander un projet minier BRI"
 BRI_apply_for_mining_project_desc: "Postuler pour un projet minier. L'approbation exige 40 de notre trésorerie ou crée un prêt chinois du même montant."
 BRI_apply_for_pipeline_project: "Demander un projet de pipeline BRI"
 BRI_apply_for_pipeline_project_desc: "Postuler pour un projet d'oléoduc. L'approbation exige 40 de notre trésorerie ou crée un prêt chinois du même montant."
 BRI_apply_for_port_project: "Demander un projet portuaire BRI"
 BRI_apply_for_port_project_desc: "Postuler pour un projet portuaire. L'approbation exige 40 de notre trésorerie ou crée un prêt chinois du même montant."
 BRI_apply_for_powerplant_project: "Demander un projet de centrale BRI"
 BRI_apply_for_powerplant_project_desc: "Postuler pour un projet énergétique. L'approbation exige 40 de notre trésorerie ou crée un prêt chinois du même montant."
 BRI_apply_for_prestige_project: "Demander un projet de prestige BRI"
 BRI_apply_for_prestige_project_desc: "Postuler pour un projet de prestige. L'approbation exige 40 de notre trésorerie ou crée un prêt chinois du même montant."
 BRI_apply_for_railway_project: "Demander un projet ferroviaire BRI"
 BRI_apply_for_railway_project_desc: "Postuler pour un projet ferroviaire. L'approbation exige 40 de notre trésorerie ou crée un prêt chinois du même montant."
 BRI_apply_for_sez_project: "Demander une zone économique spéciale BRI"
 BRI_apply_for_sez_project_desc: "Postuler pour une zone économique spéciale. L'approbation exige 40 de notre trésorerie ou crée un prêt chinois du même montant."
 BRI_apply_for_telecom_project: "Demander un projet télécoms BRI"
 BRI_apply_for_telecom_project_desc: "Postuler pour un projet de télécommunications. L'approbation exige 40 de notre trésorerie ou crée un prêt chinois du même montant."
 BRI_request_loan_extension: "Demander une prolongation de prêt"
 BRI_request_loan_extension_desc: "Pétitionner Pékin pour un moratoire d'un an sur une obligation des Nouvelles routes de la soie en défaut. Le principal n'est pas remis."
 CHI_16_national_congress_mission: "16e Congrès du Parti communiste chinois"
 CHI_16_national_congress_mission_desc: "Le 16e Congrès national du Parti communiste chinois se réunira en 2002, marquant une transition générationnelle de direction."
 CHI_16_national_congress_mission_tt: "§RCeci contournera les focusses nécessaires pour achever§! §Y$CHI_the_shanghai_succession$§!"
 CHI_17_national_congress_mission: "17e Congrès du Parti communiste chinois"
 CHI_17_national_congress_mission_desc: "Le 17e Congrès national se réunira en 2007 pour consolider l'agenda de la direction actuelle."
 CHI_18_national_congress_mission: "18e Congrès du Parti communiste chinois"
 CHI_18_national_congress_mission_desc: "Le 18e Congrès national se réunira en 2012, attendu pour apporter d'importants changements de direction."
 CHI_19_national_congress_mission: "19e Congrès du Parti communiste chinois"
 CHI_19_national_congress_mission_desc: "Le 19e Congrès national se réunira en 2017 pour examiner l'orientation du parti et réaffirmer sa direction."
 CHI_20_national_congress_mission: "20e Congrès du Parti communiste chinois"
 CHI_20_national_congress_mission_desc: "Le 20e Congrès national se réunira en 2022 au milieu de questions sur la continuité de la direction et les limites de mandat."
 CHI_21_national_congress_mission: "21e Congrès du Parti communiste chinois"
 CHI_21_national_congress_mission_desc: "Le 21e Congrès national se réunira en 2027 pour tracer le cap du parti pour l'ère suivante."
 CHI_abolish_birth_limits: "Supprimer les limites de naissance"
 CHI_abolish_birth_limits_desc: "Toutes les restrictions restantes sur la taille des familles sont formellement abrogées. L'État passe de la limitation des naissances à leur encouragement actif, clôturant une ère de contrôle démographique commencée sous Mao et institutionnalisée sous Deng. Le changement reconnaît que les coûts d'application l'emportent désormais sur tout bénéfice démographique de la restriction et que la fécondité volontaire est déjà très en dessous du taux de remplacement."
 CHI_activate_princeling_network: "Activer le réseau des princelings"
 CHI_activate_princeling_network_desc: "Les contacts d'anciens, les liens d'affaires et les atouts de l'état-major général sont rassemblés en un instrument de politique coordonné. Le réseau des princelings commence à opérer comme notre levier décisif sur Pyongyang."
 CHI_activate_rare_earth_embargo: "Activer l'embargo sur les terres rares"
 CHI_activate_rare_earth_embargo_desc: "Couper les exportations de tungstène et de chrome vers le Japon. L'embargo tient jusqu'à sa levée, la capitulation du Japon, ou la diversification de l'approvisionnement par Tokyo."
 CHI_adopt_three_child_policy: "Politique des trois enfants"
 CHI_adopt_three_child_policy_desc: "À la suite des résultats du recensement de 2020, Pékin autorise les couples à avoir jusqu'à trois enfants et assortit l'annonce d'un paquet de subventions, de congés parentaux étendus et de plafonds sur les coûts du tutorat privé. Les analystes notent que la Corée du Sud, le Japon et Singapour ont tenté des mesures similaires avec un effet limité ; les coûts de vie urbains rapidement croissants de la Chine et le glissement culturel vers des familles plus petites posent la même barrière structurelle."
 CHI_adopt_two_child_policy: "Politique des deux enfants"
 CHI_adopt_two_child_policy_desc: "Le Conseil des affaires d'État annonce la politique universelle des deux enfants, effective le 1er janvier 2016. La limite d'un enfant, en vigueur depuis 1980, est levée pour tous les couples. Les modélisateurs démographiques ne projettent qu'une hausse modeste des naissances : après des décennies de normes de petites familles, le coût de la vie, les prix du logement et la participation des femmes à la main-d'œuvre maintiennent la fécondité bien en dessous du remplacement même sans contraintes légales."
 CHI_anti_desertification_belt: "Expansion du brise-vent des Trois Nord"
 CHI_anti_desertification_belt_desc: "Le programme de ceinture forestière des Trois-Nord, en cours depuis 1978 à travers le nord de la Chine, la Mongolie-Intérieure et le nord-est, est la plus vaste campagne de boisement du monde, avec un total prévu de 88 milliards d'arbres d'ici 2050. Les nouvelles phases de plantation se concentrent sur des peuplements d'espèces mixtes qui ancrent le sol, retiennent la fonte des neiges et restaurent les bassins versants dégradés du plateau de Lœss et des terres sablonneuses de Hunshandake. Le couvert végétal restauré réduit les charges sédimentaires du fleuve Jaune et ralentit l'avancée vers le sud du désert de Gobi."
 CHI_Asset_Seizure: "Saisir un actif stratégique"
 CHI_Asset_Seizure_desc: "Convertir un actif d'infrastructure en défaut en une holding contrôlée par la Chine et réduire le principal d'un coût de projet. Disponible uniquement sur la voie du prêt prédateur."
 CHI_asteroid_mining_investment: "Investir dans l'exploitation minière des astéroïdes"
 CHI_asteroid_mining_investment_desc: "Engager du capital dans une entreprise commerciale de ressources spatiales. Une opération réussie débloque un dividende industriel permanent tiré des métaux du groupe du platine, des terres rares, des volatils et de la fabrication en microgravité. Nous pouvons soutenir au plus cinq telles opérations à la fois."
 CHI_asteroid_survey_mission: "Enquête sur les astéroïdes géocroiseurs"
 CHI_asteroid_survey_mission_desc: "S'appuyant sur la navigation spatiale lointaine prouvée par Tianwen, une sonde de prospection cartographie les orbites et la composition minérale des astéroïdes proches de la Terre accessibles. Un relevé réussi ouvre la voie à l'extraction commerciale de ressources spatiales."
 CHI_automation_robotics_push: "Poussée d'automatisation et de robotique"
 CHI_automation_robotics_push_desc: "La Chine est devenue le plus grand installateur mondial de robots industriels, déployant plus d'unités par an que l'Union européenne et les États-Unis combinés. Une accélération dirigée par l'État cible les secteurs manufacturiers intensifs en main-d'œuvre confrontés aux plus fortes pénuries d'effectifs. L'investissement afflue vers les robots collaboratifs, les lignes de production assistées par l'IA et les systèmes de logistique intelligente, substituant le capital au travail que la contraction démographique retire."
 CHI_avic_innovation: "AVIC : une innovation originale"
 CHI_avic_innovation_desc: "Aviation Industry Corporation of China est la maison mère tentaculaire de l'industrie aéronautique du pays. Forcer ses instituts à innover plutôt qu'à copier accélère les cellules dont dépend la puissance aérienne chinoise."
 CHI_back_nepalese_communists: "Retour aux communistes népalais"
 CHI_back_nepalese_communists_desc: "Canaliser fonds et soutien idéologique vers les factions communistes à Katmandou, inclinant lentement l'équilibre politique du Népal vers Pékin."
 CHI_beijing_hosted_talks: "Accueillir le Sommet d’urgence de Pékin"
 CHI_beijing_hosted_talks_desc: "Convoquer les dirigeants coréens à Pékin pour une médiation d'urgence. Lorsque les pourparlers bilatéraux ont échoué, seul un hôte chinois peut ramener les deux parties à la table."
 CHI_beijing_washington_consultation: "Ouvrir une consultation Pékin-Washington"
 CHI_beijing_washington_consultation_desc: "Un canal discret vers le Département d'État américain permet à Pékin et Washington de gérer la question coréenne par-dessus la tête de Séoul. L'arrangement inquiète Tokyo, qui craint d'être mis de côté."
 CHI_big_fund_iii_allocate_tranche_decision: "Allouer la tranche Big Fund III"
 CHI_big_fund_iii_allocate_tranche_decision_desc: "La troisième phase de 344 milliards de yuans du Fonds national d'investissement de l'industrie des circuits intégrés est versée à un sous-secteur cible. Chaque tranche pousse une autre fonderie à pleine utilisation."
 CHI_boycott_lotte: "Boycotter Lotte"
 CHI_boycott_lotte_desc: "Organiser un boycott populaire des propriétés du groupe Lotte en Chine en réponse à la location par Lotte d'un terrain pour le site de déploiement du THAAD."
 CHI_BRI_Forum_Triennial: "Accueillir le Forum des Nouvelles routes de la soie"
 CHI_BRI_Forum_Triennial_desc: "Organiser le Forum triennal des Nouvelles routes de la soie à Pékin. Des chefs d'État de tout le réseau se rassemblent pour renouveler les engagements et annoncer de nouveaux projets phares. Exige une trésorerie des Nouvelles routes de la soie d'au moins 150. Dépense majeure de trésorerie avec un temps de recharge de trois ans."
 CHI_BRI_management: "Initiative des Nouvelles routes de la soie"
 CHI_BRI_management_desc: "L'Initiative des Nouvelles routes de la soie est le premier instrument de statecraft économique de la Chine, canalisant le crédit vers ports, chemins de fer, corridors énergétiques et infrastructure numérique à travers les nations partenaires du monde entier. Chaque projet renforce simultanément la connectivité physique et le levier politique.\n\n§YTrésorerie :§! ¥[?CHI_bri_treasury|0]B  |  Contribution mensuelle : +[?CHI_bri_monthly_income_total|0]\n§YProjets :§! [?CHI_bri_committed_projects|0]/[?CHI_bri_project_slots|0] engagés  | §G[?CHI_bri_completed_projects|0]§! achevés  | §R[?CHI_bri_defaulted_projects|0]§! défauts agrégés\n§YRevenu des prêts :§! [?CHI_bri_loan_income|2] hebdomadaire  | §YPrésence mondiale :§! [?CHI_bri_global_presence|0]\n§GDéveloppement mutuel [?CHI_bri_winwin_score|0]§!  · §RPrédation [?CHI_bri_predatory_score|0]§!"
 CHI_BRI_promote_digital_silk_road: "Améliorer la Route de la Soie numérique"
 CHI_BRI_promote_digital_silk_road_desc: "Lorsque le décompte d'infrastructure de télécommunications franchit le seuil requis, cette décision améliore l'idée de palier Route de la soie numérique, reflétant les réseaux de fibre optique bâtis par la Chine, les stations terriennes satellitaires et l'infrastructure mobile fournie par Huawei se répandant dans les États partenaires."
 CHI_BRI_promote_economic_zones: "Améliorer les zones économiques spéciales"
 CHI_BRI_promote_economic_zones_desc: "Lorsque le décompte de développement de zones industrielles franchit le seuil requis, cette décision améliore l'idée de palier Zones économiques spéciales, reflétant les pôles d'exportation et de logistique gérés par la Chine qui ancrent les chaînes d'approvisionnement et offrent des conditions préférentielles aux entreprises chinoises dans les pays partenaires."
 CHI_BRI_promote_energy_arteries: "Améliorer les artères énergétiques"
 CHI_BRI_promote_energy_arteries_desc: "Lorsque le décompte de construction d'oléoducs franchit le seuil requis, cette décision améliore l'idée de palier Artères énergétiques, représentant l'infrastructure étendue de transport de pétrole et de gaz reliant les producteurs d'Asie centrale aux raffineries chinoises et réduisant l'exposition aux goulets maritimes."
 CHI_BRI_promote_maritime_network: "Mettre à niveau le réseau maritime"
 CHI_BRI_promote_maritime_network_desc: "Lorsque le décompte de construction portuaire de l'Initiative des Nouvelles routes de la soie franchit le seuil requis, cette décision améliore l'idée de palier Réseau maritime, étendant l'influence de la Chine sur les routes commerciales maritimes et l'accès portuaire concessionnel de l'océan Indien à la Méditerranée."
 CHI_BRI_promote_overland_corridors: "Améliorer les couloirs terrestres"
 CHI_BRI_promote_overland_corridors_desc: "Lorsque le décompte de construction ferroviaire franchit le seuil requis, cette décision améliore l'idée de palier Corridors terrestres, reflétant l'achèvement de liaisons ferroviaires transcontinentales supplémentaires qui réduisent les coûts de transit et approfondissent la dépendance économique à travers l'Asie centrale et le Caucase."
 CHI_BRI_promote_power_generation: "Améliorer le réseau de production d'électricité"
 CHI_BRI_promote_power_generation_desc: "Lorsque la construction de centrales financée par les Nouvelles routes de la soie franchit le seuil requis, cette décision améliore l'idée de palier Production d'électricité, reflétant les installations charbon, hydro et solaire bâties par des firmes chinoises qui fournissent l'électricité aux économies partenaires tout en créant des dépendances de maintenance à long terme."
 CHI_BRI_promote_prestige_diplomacy: "Améliorer la diplomatie de prestige"
 CHI_BRI_promote_prestige_diplomacy_desc: "Lorsque les achèvements de projets de prestige franchissent le seuil requis, cette décision améliore l'idée de palier Diplomatie de prestige, reflétant stades phares, bâtiments gouvernementaux et centres culturels qui génèrent de la bonne volonté et démontrent la portée du statecraft chinois."
 CHI_BRI_promote_resource_concessions: "Améliorer les concessions de ressources"
 CHI_BRI_promote_resource_concessions_desc: "Lorsque les concessions de ressources sécurisées franchissent le seuil requis, cette décision améliore l'idée de palier Concessions de ressources, représentant des accords d'extraction à long terme pour le cuivre, le cobalt, le lithium et d'autres minéraux stratégiques qui alimentent les chaînes d'approvisionnement manufacturières chinoises."
 CHI_BRI_recipient_actions: "Initiative des Nouvelles routes de la soie"
 CHI_BRI_recipient_actions_desc: "Postuler à un financement de projet de l'Initiative des Nouvelles routes de la soie auprès de la République populaire de Chine."
 CHI_build_mega_rail_hub: "Construire un méga hub ferroviaire"
 CHI_build_mega_rail_hub_desc: "Construire un vaste terminal ferroviaire intégré dans l'une des grandes villes de Chine, à l'échelle de Pékin-Sud, Shanghai Hongqiao ou Canton-Sud. Ces pôles fusionnent TGV, métro et lignes interurbaines en un seul nœud et accélèrent construction et logistique dans la région."
 CHI_build_public_housing: "Construire des logements publics"
 CHI_build_public_housing_desc: "Mobiliser des brigades de construction pour bâtir des logements locatifs d'État à [FROM.GetName]. Les projets occupent la capacité d'usines civiles pendant deux ans et réduisent le fardeau national de biens de consommation à l'achèvement."
 CHI_caic_innovation: "CAIC : Innovation originale"
 CHI_caic_innovation_desc: "Changhe Aircraft Industries construit les hélicoptères d'attaque dédiés de l'APL, du Z-10 au Z-19. Libérer ses ingénieurs de prendre des risques accélère une flotte de frappe à voilure tournante qui a longtemps traîné derrière les conceptions occidentales."
 CHI_cancel_east_china_sea_exercise: "Annuler l'exercice en mer de Chine orientale"
 CHI_cancel_east_china_sea_exercise_desc: "Les manœuvres navales et aériennes près des îles contestées Senkaku, ou Diaoyu, enflamment régulièrement les relations avec Tokyo. Annuler l'exercice prévu signale de la retenue, rassure le Japon et soutient le récit d'une montée pacifique."
 CHI_casc_innovation: "CASC : Innovation originale"
 CHI_casc_innovation_desc: "China Aerospace Science and Technology Corporation gère les lancements spatiaux, missiles balistiques et satellites de la nation. La réformer accélère les systèmes orbitaux et stratégiques qui sous-tendent la dissuasion chinoise."
 CHI_casic_innovation: "CASIC : Innovation originale"
 CHI_casic_innovation_desc: "China Aerospace Science and Industry Corporation construit les missiles de croisière et tactiques du pays, de la famille YJ aux systèmes d'attaque terrestre. Laisser ses bureaux prendre des risques aiguise l'arsenal de frappe de précision."
 CHI_central_theatre_command: "Commandement central du théâtre"
 CHI_central_theatre_command_desc: "Le commandement de théâtre central à Pékin est la réserve stratégique et le bouclier de la capitale. Il détient l'autorité de commandement et le moral de la force qui appuie chaque autre direction."
 CHI_cetc_innovation: "CTEC : Innovation originale"
 CHI_cetc_innovation_desc: "China Electronics Technology Group fournit les radars, capteurs et systèmes de gestion de bataille derrière chaque plateforme moderne. Réformer sa culture de recherche pousse l'informatique et l'intelligence artificielle chinoises vers la frontière."
 CHI_chang_e_mission: "Lancer la sonde Chang'e"
 CHI_chang_e_mission_desc: "Une mission robotique Chang'e part pour la Lune afin d'atterrir, de cartographier et de relayer via le satellite relais Queqiao. Les données qu'elle ramène tracent le terrain pour les astronautes qui suivront. Les chances de succès s'améliorent à mesure que notre expérience de lancement croît."
 CHI_cheju_summit_arrangement: "Organiser un sommet Cheju"
 CHI_cheju_summit_arrangement_desc: "L'île de villégiature de Cheju, ou Jeju, offre un terrain neutre pour des pourparlers de haut niveau avec la Corée du Sud. Un sommet peut produire une percée diplomatique, mais une rencontre mal préparée risque un camouflet public qui durcit les deux camps."
 CHI_convene_bilateral_channel: "Convoquer un canal bilatéral"
 CHI_convene_bilateral_channel_desc: "Le Dialogue quadrilatéral de sécurité lie les États-Unis, le Japon, l'Inde et l'Australie contre Pékin. Ouvrir un canal bilatéral discret avec Tokyo sème le doute sur la cohésion du groupement et ralentit sa consolidation."
 CHI_crack_down_tibet_separatism: "Réprimer le séparatisme tibétain"
 CHI_crack_down_tibet_separatism_desc: "Réprimer l'organisation séparatiste à travers le Tibet par des mesures de sécurité et administratives coordonnées. Renforce l'autorité centrale et accélère l'intégration."
 CHI_crack_down_xinjiang_separatism: "Réprimer le séparatisme au Xinjiang"
 CHI_crack_down_xinjiang_separatism_desc: "Déployer des forces de sécurité intérieure à travers le Xinjiang pour démanteler les cellules séparatistes. Resserre le contrôle de l'État sur la région et accroît la conformité, mais attire le regard international."
 CHI_crewed_lunar_landing_mission: "Poser des astronautes sur la Lune"
 CHI_crewed_lunar_landing_mission_desc: "Un Longue Marche 10 hisse le véhicule d'équipage Mengzhou et l'atterrisseur Lanyue depuis Wenchang pour des lancements séparés qui se rejoignent en orbite lunaire. L'équipage doit descendre vers la région polaire sud lunaire, planter le drapeau et revenir sain et sauf, faisant de la Chine la seconde nation à poser des humains sur la Lune."
 CHI_critical_minerals_export_license_decision: "Restrictions à l'export des minéraux critiques"
 CHI_critical_minerals_export_license_decision_desc: "Restreindre les exportations de gallium, germanium et terres rares sous le cadre de licences d'août 2023. Le revenu par tonne augmente à mesure que l'offre se resserre."
 CHI_crrc_innovation: "CRRC : Innovation originale"
 CHI_crrc_innovation_desc: "China Railway Rolling Stock Corporation est le plus grand fabricant mondial d'équipement ferroviaire, une base d'industrie lourde à double usage d'échelle énorme. Orienter son ingénierie vers la défense élargit le fondement industriel sous-jacent."
 CHI_csgc_innovation: "CSGC : Innovation originale"
 CHI_csgc_innovation_desc: "China South Industries Group construit les véhicules de combat blindés et les armes légères de l'armée aux côtés de ses lignes automobiles civiles. Percer sa prudence débloque une famille moderne de véhicules de combat."
 CHI_csic_innovation: "CSIC : Innovation Originale"
 CHI_csic_innovation_desc: "China Shipbuilding Industry Corporation, berceau historique de la conception sous-marine chinoise, anime le service silencieux sous les flots. Réformer ses instituts accélère la prochaine génération de sous-marins d'attaque et lanceurs d'engins."
 CHI_cssc_innovation: "CSSC : Innovation Originale"
 CHI_cssc_innovation_desc: "China State Shipbuilding Corporation est le géant derrière la flotte de surface de la marine de l'APL, y compris ses porte-avions. Laisser ses chantiers innover accélère les navires de guerre d'une marine hauturière."
 CHI_cultivate_pyongyang_contacts: "Cultiver les contacts avec Pyongyang"
 CHI_cultivate_pyongyang_contacts_desc: "La Chine demeure le patron indispensable de la Corée du Nord, fournissant l'essentiel de son carburant et de sa nourriture. Bâtir des relations discrètes au sein de la direction de Pyongyang permet à Pékin de tirer sur la stabilité intérieure du régime sans ingérence ouverte."
 CHI_current_congress_mission: "Congrès national en cours"
 CHI_current_congress_mission_desc: "Le Congrès national est en session. Les nominations de commissions sont en cours de finalisation."
 CHI_cxmt_hbm_qualification_decision: "Qualifier le HBM de CXMT pour l'IA intérieure"
 CHI_cxmt_hbm_qualification_decision_desc: "Intégrer la mémoire à haute bande passante de CXMT dans les accélérateurs Cambricon, Biren et Moore Threads, mettant fin à la dépendance à Nvidia et Samsung dans les charges de travail d'IA nationales."
 CHI_dandong_military_district: "Renforcer le district militaire de Dandong"
 CHI_dandong_military_district_desc: "Dandong se dresse sur le Yalou face à la Corée du Nord, le principal passage de la frontière Chine-RPDC. Renforcer la garnison du Nord-Est honore la doctrine Lèvres et dents de défense mutuelle avec Pyongyang et durcit la frontière mandchoue."
 CHI_de_escalate_at_LAC: "Désescalader à la ligne de contrôle réel"
 CHI_de_escalate_at_LAC_desc: "Après les affrontements de la vallée de Galwan en 2020, la Chine et l'Inde ont maintenu des face-à-face tendus le long de la ligne de contrôle réel contestée au Ladakh. Ordonner au personnel frontalier de se retirer des positions avancées apaise la confrontation avec New Delhi et abaisse les tensions régionales."
 CHI_Debt_Restructuring: "Restructurer la dette du partenaire"
 CHI_Debt_Restructuring_desc: "Ramener le taux d'un partenaire en défaut à 2 % et accorder un an sans paiements. Le principal reste dû. Disponible uniquement sur la voie de la coopération gagnant-gagnant."
 CHI_deploy_paf_maritime_militia: "Déployer la milice maritime de la PAF"
 CHI_deploy_paf_maritime_militia_desc: "Présence permanente de milice maritime autour de Diaoyu. Chaque mois élève la pression Senkaku et risque un incident."
 CHI_drip_irrigation_rollout: "Déploiement de l'irrigation goutte à goutte"
 CHI_drip_irrigation_rollout_desc: "L'agriculture chinoise prélève plus de 360 milliards de mètres cubes d'eau par an, pour l'essentiel par irrigation par submersion dont l'efficacité dépasse rarement 50 pour cent. Un déploiement national de systèmes goutte-à-goutte et de micro-irrigation, modelé sur l'expérience d'agriculture de précision d'Israël et piloté dans la ceinture cotonnière du Xinjiang, réduit la consommation d'eau au champ de 30 à 50 pour cent par hectare. Programmes d'équipement subventionnés et normes d'efficacité obligatoires pour les nouveaux districts d'irrigation étendent la technologie des fermes de démonstration au secteur agricole plus large."
 CHI_duv_breakthrough_decision: "Pousser le programme DUV de SMEE"
 CHI_duv_breakthrough_decision_desc: "Forcer une démonstration de lithographie par immersion 28 nm de Shanghai Micro Electronics. Le succès réécrit le marché mondial de l'outillage ; l'échec brûle du capital et recule le calendrier d'une année."
 CHI_eastern_theatre_command: "Commandement du théâtre de l'Est"
 CHI_eastern_theatre_command_desc: "Basé à Nankin, le commandement de théâtre oriental fait face au détroit de Taïwan et à la mer de Chine orientale. Ses forces sont bâties autour de l'assaut amphibie et de la puissance de feu nécessaire pour briser une côte défendue."
 CHI_eleventh_five_year_plan_mission: "11e plan quinquennal"
 CHI_eleventh_five_year_plan_mission_desc: "Le 11e plan quinquennal de la Chine (2006-2010) fixe six objectifs de développement obligatoires : croissance économique, expansion du secteur tertiaire, capacité industrielle, infrastructure nationale, efficacité énergétique et protection sociale. La Commission nationale du développement et de la réforme suivra les progrès sur la fenêtre de cinq ans."
 CHI_establish_dandong_safe_houses: "Établir des refuges à Dandong"
 CHI_establish_dandong_safe_houses_desc: "Installer des maisons sûres le long du Yalou pour abriter et organiser les défecteurs alignés sur Jang. Une base discrète pour de futures opérations."
 CHI_fabless_provincial_subsidy_decision: "Cycle de subvention provincial Fabless"
 CHI_fabless_provincial_subsidy_decision_desc: "Shanghai, Shenzhen et Pékin égalent chacun la tranche du Grand Fonds central par leur propre financement de capital-risque pour le cluster des maisons de conception."
 CHI_facilitate_family_reunions: "Faciliter les réunions de famille"
 CHI_facilitate_family_reunions_desc: "Utiliser les réseaux logistiques chinois pour organiser des réunions familiales transfrontalières. Le dividende humanitaire est égalé par la bonne volonté diplomatique qu'il génère."
 CHI_factional_balance_category: "Équilibre des factions"
 CHI_factional_balance_category_desc: "Le Parti communiste chinois n'est pas monolithique. Des factions concurrentes, enracinées dans des réseaux de patronage, des tendances idéologiques et des trajectoires de carrière, se disputent l'influence sur les nominations de personnel, la politique économique et le rythme de la réforme politique. Gérer l'équilibre des pouvoirs entre ces blocs internes est un préalable à une gouvernance stable."
 CHI_FOCAC_Summit: "Convoquer le Sommet du FOCAC"
 CHI_FOCAC_Summit_desc: "Accueillir un sommet triennal du Forum sur la coopération sino-africaine. Coûte 50 du fonds BRI et de la trésorerie nationale, plus du capital politique, avec un temps de recharge de trois ans."
 CHI_fund_princeling_ventures: "Financer Princeling Business Ventures"
 CHI_fund_princeling_ventures_desc: "Financer des entreprises transfrontalières dirigées par des princelings nord-coréens. La richesse liée au capital chinois crée une loyauté que l'idéologie ne peut."
 CHI_fusion_program: "Programme national de fusion"
 CHI_fusion_program_desc: "Concentrer la recherche nationale sur la fusion nucléaire contrôlée à Hefei, foyer du tokamak supraconducteur expérimental avancé (EAST), du dispositif BEST et du réacteur d'essai d'ingénierie de fusion de Chine prévu. La maîtrise du « soleil artificiel » promet une source illimitée d'électricité propre."
 CHI_gobi_desert_solar_expansion: "Phase d'expansion solaire et éolienne du Gobi"
 CHI_gobi_desert_solar_expansion_desc: "Mettre en service une phase supplémentaire de construction de panneaux solaires et d'éoliennes dans le désert de Gobi, étendant la capacité de génération d'énergie renouvelable. Chaque phase exige une capacité de construction civile significative et réduit temporairement le débit de construction large à travers le pays."
 CHI_grey_society_crisis: "Crise de la société grise"
 CHI_grey_society_crisis_desc: "La population en âge de travailler de la Chine a culminé vers 2011 et se contracte depuis. Quatre décennies de politique de l'enfant unique ont inversé la pyramide des âges : un enfant unique soutient désormais typiquement deux parents et quatre grands-parents, tandis que les coûts de retraite et de santé croissent plus vite que le PIB. La décennie suivante testera si la Chine peut soutenir la croissance alors que sa main-d'œuvre se contracte et que sa population âgée s'étend. Cette crise persistera des années ; les décisions d'atténuation en réduisent la durée."
 CHI_haig_innovation: "HAIG : une innovation originale"
 CHI_haig_innovation_desc: "Harbin Aircraft Industry Group produit les hélicoptères de transport et d'utilité de l'APL, dont le Z-9 et le nouveau Z-20. Libérer ses concepteurs accélère une flotte à voilure tournante polyvalente."
 CHI_hsr_beijing_shanghai: "Ligne à grande vitesse Pékin-Shanghai"
 CHI_hsr_beijing_shanghai_desc: "Construire le TGV Pékin-Shanghai de 1 318 kilomètres, reliant les capitales politique et financière de la Chine. Le corridor TGV le plus fréquenté du monde à l'ouverture, il réduit le temps de trajet de quatorze heures à quatre heures quarante à 300 km/h."
 CHI_hsr_beijing_tianjin: "Chemin de fer interurbain Pékin-Tianjin"
 CHI_hsr_beijing_tianjin_desc: "Construire le chemin de fer interurbain Pékin-Tianjin de 117 kilomètres, notre première ligne à grande vitesse conçue pour des vitesses commerciales de 350 km/h. Le temps de trajet entre les deux villes tombera de 70 minutes à 30 minutes, ancrant un corridor économique unifié Pékin-Tianjin-Hebei."
 CHI_hsr_chengdu_chongqing: "Chemin de fer à grande vitesse Chengdu-Chongqing"
 CHI_hsr_chengdu_chongqing_desc: "Construire la liaison TGV entre Chengdu et Chongqing, les deux ancres de la stratégie de développement de l'Ouest. L'achèvement intègre les deux mégapoles en un cercle économique d'une heure et forme l'épine dorsale du réseau TGV occidental en expansion."
 CHI_hsr_wuhan_guangzhou: "Chemin de fer à grande vitesse Wuhan-Guangzhou"
 CHI_hsr_wuhan_guangzhou_desc: "Construire le TGV Wuhan-Canton de 1 069 kilomètres, reliant la Chine centrale au cœur manufacturier du delta de la rivière des Perles. À l'ouverture, c'est la plus longue ligne à grande vitesse du monde et elle coupe le trajet de plus de dix heures à moins de trois."
 CHI_identify_beida_alumni: "Identifier les anciens élèves de l'Université de Pékin"
 CHI_identify_beida_alumni_desc: "Profiler les enfants de l'élite nord-coréenne formés à l'université de Pékin. Leurs liens chinois et leurs inclinations réformistes en font des candidats pour un futur gouvernement."
 CHI_industrial_investment_category: "Programme d'investissement pétrochimique et énergétique"
 CHI_industrial_investment_category_desc: "Décisions d'investissement industriel stratégique débloquées via les arbres de focus de la base pétrochimique et de l'énergie renouvelable de la Chine."
 CHI_initiate_joint_exercises_with_RAJ: "Lancer des exercices conjoints avec l'Inde"
 CHI_initiate_joint_exercises_with_RAJ_desc: "Conduire un cycle d'exercices combinés avec les forces armées indiennes pour bâtir la confiance et renforcer les gains de désescalade frontalière."
 CHI_initiate_joint_military_training: "Initier une formation conjointe des Iron Brothers"
 CHI_initiate_joint_military_training_desc: "Conduire un cycle d'exercices combinés avec les forces armées pakistanaises pour améliorer l'interopérabilité et l'alignement doctrinal."
 CHI_inner_mongolia_innovation: "First Machinery Group : innovation originale"
 CHI_inner_mongolia_innovation_desc: "Inner Mongolia First Machinery Group est le berceau du blindage chinois, construisant le char de combat principal Type 99 à Baotou. Percer sa prudence bureaucratique débloque une nouvelle génération de véhicules de combat lourds."
 CHI_insert_jang_assets: "Insérer des actifs Jang"
 CHI_insert_jang_assets_desc: "Ramener des opératifs alignés sur Jang en RPDC sous couverture. En place, ils attendent l'activation."
 CHI_invest_domestic_arms_lines: "Investir dans les chaînes d'armement nationales"
 CHI_invest_domestic_arms_lines_desc: "Orienter des fonds d'État vers les lignes de production de NORINCO et AVIC afin que les commandes de l'APL soient honorées au pays plutôt que par des contrats Rosoboronexport. Chaque cycle d'investissement resserre l'écart avec les fournisseurs russes."
 CHI_invite_basf_caojing: "Intégration BASF Verbund"
 CHI_invite_basf_caojing_desc: "Approuver la proposition de BASF de construire un complexe chimique Verbund intégré au parc chimique de Caojing et à la zone côtière de Zhanjiang. L'investissement de 8,7 milliards d'euros réunit fabrication avancée de polymères et d'acryliques avec un modèle d'intégration de procédés qui lie utilités, matières premières et flux de sous-produits à travers dix-huit usines chimiques, le premier site Verbund hors d'Europe."
 CHI_invite_bayer_nanjing: "Centre scientifique des matériaux Covestro"
 CHI_invite_bayer_nanjing_desc: "Inviter Covestro, anciennement Bayer MaterialScience, à établir un siège régional de recherche et production à Shanghai. L'installation de 3 milliards d'euros produit polycarbonates, précurseurs de polyuréthane et revêtements avancés, et relocalise le centre mondial de R&D de la division depuis l'Allemagne, transférant une expertise de chimie des polymères applicable aux matériaux industriels et haute performance."
 CHI_invite_exxonmobil_jv: "Coentreprise ExxonMobil Quanzhou"
 CHI_invite_exxonmobil_jv_desc: "Approuver la participation de 25 pour cent d'ExxonMobil dans la Fujian Refining and Petrochemical Company à Quanzhou, établissant le premier complexe raffinerie-pétrochimie sino-étranger pleinement intégré. ExxonMobil apporte une technologie avancée de vapocraquage et de production de polyoléfines ainsi qu'une expertise opérationnelle de raffinage intégré à grande échelle."
 CHI_invite_JAP_hitachi: "Inviter Hitachi"
 CHI_invite_JAP_hitachi_desc: "Les divisions électronique industrielle et de défense d'Hitachi produisent des systèmes de contrôle ferroviaire, de l'équipement de génération d'électricité et du matériel informatique embarqué à large application duale à travers l'infrastructure industrielle et militaire chinoise."
 CHI_invite_JAP_honda: "Invitez Honda Motor Company"
 CHI_invite_JAP_honda_desc: "Les divisions motorisation et robotique de Honda apportent une technologie de moteurs compacts et des systèmes d'automatisation d'usine applicables à la fois à la fabrication civile et aux lignes de production adjacentes à la défense."
 CHI_invite_JAP_howa: "Invitez Howa Machinery"
 CHI_invite_JAP_howa_desc: "Howa Machinery est le fabricant principal des fusils d'assaut Type 89 et Type 20 pour la Force terrestre d'autodéfense japonaise. Ses procédés d'usinage de précision et sa gestion de ligne de production d'armes légères offrent une valeur transférable directe."
 CHI_invite_JAP_ihi: "Inviter IHI Corporation"
 CHI_invite_JAP_ihi_desc: "IHI Corporation est le premier fabricant japonais de moteurs aéronautiques et de systèmes de propulsion navale, produisant des turboréacteurs pour aéronefs militaires et des composants de turbines pour bâtiments navals sous licence de partenaires occidentaux."
 CHI_invite_JAP_jmu: "Invitez Japan Marine United"
 CHI_invite_JAP_jmu_desc: "Japan Marine United est le principal constructeur de combatants de surface de la JMSDF, responsable des destroyers porte-hélicoptères de classe Izumo et des destroyers lance-missiles de classe Atago. Ses méthodes d'architecture navale modulaire s'appliquent directement aux programmes de construction navale chinois."
 CHI_invite_JAP_jr_east: "Inviter JR Est"
 CHI_invite_JAP_jr_east_desc: "JR East opère le réseau à grande vitesse le plus avancé du monde. Son ingénierie de matériel roulant, ses systèmes de signalisation et son expertise de maintenance d'infrastructure apportent à la fois une valeur économique civile et une modernisation du transport stratégique."
 CHI_invite_JAP_jsw: "Invitez Japan Steel Works"
 CHI_invite_JAP_jsw_desc: "Japan Steel Works est le premier producteur mondial de pièces forgées d'acier de grand diamètre utilisées dans les cuves sous pression, les tubes de canons navals et les composants de réacteurs nucléaires. Son expertise métallurgique moderniserait directement la production industrielle lourde chinoise."
 CHI_invite_JAP_kawasaki_aerospace: "Inviter Kawasaki Heavy Industries (Aérospatiale)"
 CHI_invite_JAP_kawasaki_aerospace_desc: "La branche aérospatiale de Kawasaki produit l'avion de transport C-2 et l'avion de patrouille maritime P-1, lui donnant une compétence profonde en construction de grandes cellules et en intégration de systèmes de mission pertinente aux applications commerciales comme de défense."
 CHI_invite_JAP_kawasaki_shipbuilding: "Inviter Kawasaki Heavy Industries (chantier naval)"
 CHI_invite_JAP_kawasaki_shipbuilding_desc: "La division chantier naval de Kawasaki Heavy Industries est responsable de la construction des sous-marins de classe Soryu. Son savoir-faire de fabrication de coques résistantes et de réduction de signature acoustique représente un transfert significatif de capacité navale."
 CHI_invite_JAP_komatsu: "Inviter Komatsu Defense"
 CHI_invite_JAP_komatsu_desc: "Komatsu Defense fabrique des véhicules blindés légers et de l'artillerie automotrice pour la Force terrestre d'autodéfense japonaise. Son approche de construction modulaire et ses solutions de blindage léger complètent les programmes de véhicules chinois existants."
 CHI_invite_JAP_mhi_tank: "Invitez Mitsubishi Heavy Industries (Systèmes terrestres)"
 CHI_invite_JAP_mhi_tank_desc: "La division systèmes terrestres de Mitsubishi Heavy Industries produit les chars de combat principaux Type 10 et Type 90 et une gamme de véhicules blindés. La coopération transfère la méthodologie de conception de blindage et des techniques de blindage composite avancées."
 CHI_invite_JAP_mitsubishi_aerospace: "Invitez Mitsubishi Aerospace"
 CHI_invite_JAP_mitsubishi_aerospace_desc: "La division aérospatiale de Mitsubishi Heavy Industries est le principal développeur japonais d'aéronefs militaires avancés, dont la plateforme F-2 et le programme naissant F-X. Sa présence en Chine apporterait une expertise d'ingénierie de cellules et une capacité de fabrication à double usage."
 CHI_invite_JAP_mitsubishi_shipbuilding: "Invitez Mitsubishi Shipbuilding"
 CHI_invite_JAP_mitsubishi_shipbuilding_desc: "Le bras construction navale de Mitsubishi construit des coques de destroyers et des cuves de pression de sous-marins pour la Force maritime d'autodéfense japonaise, offrant des techniques de construction navale et des procédés de soudage de précision adaptés aux programmes de navires de guerre haut de gamme."
 CHI_invite_JAP_nec: "Inviter NEC Corporation"
 CHI_invite_JAP_nec_desc: "NEC Corporation est un développeur japonais de premier plan de systèmes C4ISR, de matériel de communications satellitaires et de plateformes de renseignement d'origine électromagnétique. Son expertise d'intégration couvre à la fois l'électronique de défense et l'infrastructure de réseaux civils."
 CHI_invite_JAP_nippon_steel: "Inviter Nippon Steel"
 CHI_invite_JAP_nippon_steel_desc: "Nippon Steel est l'un des plus grands producteurs mondiaux d'acier de construction à haute résistance. Sa production de plaques de blindage à haute dureté et d'alliages spéciaux sert à la fois l'industrie de défense japonaise et le secteur infrastructurel plus large."
 CHI_invite_JAP_panasonic: "Inviter Panasonic"
 CHI_invite_JAP_panasonic_desc: "Panasonic fournit une technologie avancée de batteries, de l'électronique durcie et des composants d'imagerie thermique à la chaîne d'approvisionnement de défense japonaise, avec des normes de production directement applicables à l'intégration de plateformes militaires."
 CHI_invite_JAP_subaru: "Invitez Subaru Aéronautique"
 CHI_invite_JAP_subaru_desc: "La division aérospatiale de Subaru Corporation produit des fuselages d'hélicoptères et des composants de cellules à voilure fixe sous licence, avec une force particulière dans le travail des métaux de précision et la conception structurelle à voilure tournante."
 CHI_invite_JAP_toshiba: "Inviter Toshiba Defense Systems"
 CHI_invite_JAP_toshiba_desc: "Toshiba Defense Systems produit des réseaux radar, des suites de guerre électronique et du matériel de guidage de missiles pour les Forces d'autodéfense japonaises, apportant une technologie critique de capteurs et d'ingénierie de systèmes embarqués au partenariat."
 CHI_invite_JAP_toyota: "Inviter Toyota Motor Corporation"
 CHI_invite_JAP_toyota_desc: "Les systèmes de fabrication avancés de Toyota et les principes logistiques juste-à-temps sous-tendent non seulement la production de véhicules commerciaux mais aussi les programmes de véhicules utilitaires légers et de logistique fournis aux forces armées japonaises."
 CHI_invite_saudi_aramco: "Participation stratégique d'Aramco dans le raffinage"
 CHI_invite_saudi_aramco_desc: "Offrir à Saudi Aramco des participations dans la Fujian Refining and Petrochemical Company et le complexe Hengli Petrochemical à Dalian. La participation de 25 pour cent d'Aramco dans Fujian et de 10 pour cent dans Hengli intègre une capacité de raffinage combinée de 400 000 barils par jour à un pipeline d'approvisionnement en brut garanti depuis la péninsule Arabique, ancrant le secteur du raffinage chinois à une source saoudienne à long terme."
 CHI_invite_shell_chem: "Partenariat chimique Shell Daya Bay"
 CHI_invite_shell_chem_desc: "Étendre la coentreprise Shell-CNOOC dans la zone pétrochimique de Daya Bay au Guangdong. Le partenariat 50-50 de Shell avec CNOOC opère un vapocraqueur d'éthylène de 1,6 million de tonnes par an et produit polyéthylène, polypropylène, éthylène glycol, polyols polyéther et styrène, diversifiant la production chimique aval de la Chine sur la côte sud."
 CHI_jap_capitulate_to_demands: "Capituler devant les exigences chinoises"
 CHI_jap_capitulate_to_demands_desc: "Accepter les termes de Pékin. L'embargo se lève, mais le coût politique intérieur est réel."
 CHI_jap_diversify_rare_earth: "Diversifier l'approvisionnement en terres rares"
 CHI_jap_diversify_rare_earth_desc: "Un programme accéléré d'un an pour échapper à la dépendance aux terres rares chinoises. Douloureux, mais rend inefficaces les futurs embargos."
 CHI_jap_open_back_channel: "Discussions ouvertes sur les canaux arrières"
 CHI_jap_open_back_channel_desc: "Utiliser le canal discret pour baisser la température au théâtre Senkaku."
 CHI_jap_reinforce_coast_guard: "Renforcer la Garde côtière"
 CHI_jap_reinforce_coast_guard_desc: "Intensifier les patrouilles du JCG en mer de Chine orientale. Dissuade les incursions chinoises mais alimente le cycle d'escalade."
 CHI_japan_strategy: "Stratégie japonaise"
 CHI_japan_strategy_desc: "Le menu complet de la rivalité sino-japonaise : coercition des terres rares, alignement RCEP, pression maritime Senkaku, diplomatie de canal discret et invitations industrielles. Pékin et Tokyo émettent tous deux des décisions d'ici tandis que la relation oscille entre coercition et accommodation."
 CHI_kaesong_expansion: "Étendre le complexe de Kaesong"
 CHI_kaesong_expansion_desc: "La région industrielle de Kaesong, où le capital du Sud employait naguère la main-d'œuvre du Nord, a été fermée en 2016 alors que les liens intercoréens s'effondraient. Courtiser sa réouverture comme co-développeur apaise la tension sur la péninsule et lie les deux Corées à l'investissement chinois."
 CHI_KPA_Officer_Exchange: "Programme d'échange d'officiers de l'APC"
 CHI_KPA_Officer_Exchange_desc: "Dépêcher des officiers de l'APL à Pyongyang pour des sessions d'entraînement et de planification conjointes avec leurs homologues de l'Armée populaire de Corée. Chaque cycle approfondit l'interopérabilité militaire et le levier chinois sur le commandement nord-coréen."
 CHI_kpop_media_ban: "Interdiction des médias K-Pop"
 CHI_kpop_media_ban_desc: "Restreindre la diffusion et la distribution de contenus de divertissement coréens en Chine. L'interdiction vise les produits culturels de la Vague coréenne comme levier contre les choix d'alignement de sécurité de Séoul."
 CHI_LATAM_emergency_aid: "Aide d'urgence à un partenaire d'Amérique latine"
 CHI_LATAM_emergency_aid_desc: "Envoyer un paquet d'aide discrétionnaire à un partenaire du parapluie de sécurité latino-américain. Renforce leur stabilité et notre influence."
 CHI_LATAM_intel_sharing_pact: "Pacte de partage de renseignements"
 CHI_LATAM_intel_sharing_pact_desc: "Ouvrir un canal bilatéral de partage de renseignement avec un gouvernement partenaire. Accorde un accès militaire réciproque et renforce le partenariat."
 CHI_LATAM_military_advisors: "Déployer des conseillers militaires"
 CHI_LATAM_military_advisors_desc: "Envoyer des cadres d'entraînement de l'APL à une armée partenaire. Transfère l'expérience de l'armée de terre et approfondit les liens de défense."
 CHI_LATAM_security_options: "Options de sécurité en Amérique latine"
 CHI_launch_payload: "Lancer une charge utile"
 CHI_launch_payload_desc: "Maintenir une cadence de lancement régulière depuis Jiuquan, Xichang, Wenchang et Taiyuan. Chaque lancement réussi bâtit l'expérience opérationnelle qui élève les chances de nos missions phares et est un préalable à l'engagement vers la Lune."
 CHI_lift_rare_earth_embargo: "Lever l’embargo sur les terres rares"
 CHI_lift_rare_earth_embargo_desc: "Mettre fin à l'interdiction d'exportation des terres rares. Tokyo obtient un répit."
 CHI_lift_thaad_sanctions: "Lever les sanctions du THAAD"
 CHI_lift_thaad_sanctions_desc: "Lever formellement les sanctions économiques informelles imposées en réponse au déploiement du THAAD. La décision signale une volonté de normaliser les relations avec Séoul."
 CHI_localise_licensed_system: "Localiser un système sous licence"
 CHI_localise_licensed_system_desc: "Rétro-ingéniérer et indigéniser un système actuellement construit sous licence russe, qu'il s'agisse d'un moteur, d'un radar ou d'un autodirecteur de missile, coupant les redevances versées à Moscou et prouvant que l'industrie chinoise peut se tenir seule."
 CHI_locate_jang_loyalists: "Localiser les loyalistes de Jang"
 CHI_locate_jang_loyalists_desc: "Identifier les membres survivants de la faction de Jang Song-thaek dispersés dans les régions frontalières. Le réseau purgé conserve du ressentiment envers le cercle intérieur des Kim."
 CHI_mature_node_export_drive_decision: "Poussée à l'export des nœuds matures"
 CHI_mature_node_export_drive_decision_desc: "Subventionner les clients de SMIC et Hua Hong pour inonder les marchés mondiaux de l'automobile, de l'IoT et de l'électroménager de puces inférieures à 28 nm. Chaque tranche empile de l'opinion commerciale."
 CHI_megaprojects: "Mégaprojets nationaux"
 CHI_megaprojects_desc: "La tradition chinoise de mégaprojets dirigés par l'État, du barrage des Trois-Gorges au plus grand réseau TGV du monde. Engager des ressources nationales dans des constructions phares qui remodèlent les systèmes d'eau, d'énergie et de transport du pays."
 CHI_military_decisions_category: "Restructuration militaire"
 CHI_MSS_Pyongyang_Station: "Station MSS de Pyongyang"
 CHI_MSS_Pyongyang_Station_desc: "Étendre la station du ministère de la Sécurité d'État à Pyongyang pour accroître la couverture de renseignement de la direction nord-coréenne et la capacité d'alerte précoce d'instabilité du régime."
 CHI_MSS_Quiet_Removal_Operation: "Opération de retrait silencieuse"
 CHI_MSS_Quiet_Removal_Operation_desc: "Le ministère de la Sécurité d'État a identifié une faction dure à Pyongyang qui obstrue l'agenda de réforme. Une opération discrète peut retirer l'obstacle et ouvrir la voie à une libéralisation plus poussée."
 CHI_national_commitee_decisions_category: "Comité national"
 CHI_national_commitee_decisions_category_desc: "\n£GFX_CHI_commission_1 \n\n\n\nLe Comité central du Parti communiste chinois gouverne les affaires du parti entre les Congrès nationaux. Tous les cinq ans, un nouveau Congrès se réunit pour élire les membres du comité, nommer les secrétaires et fixer l'orientation politique du parti."
 CHI_NKO_Rason_SEZ_Investment: "Investissement dans la ZES de Rason"
 CHI_NKO_Rason_SEZ_Investment_desc: "Engager un financement direct dans la zone économique spéciale de Rason. L'investissement débloque l'accès portuaire et démontre la viabilité de la réforme économique nord-coréenne."
 CHI_norinco_innovation: "NORINCO : Innovation originale"
 CHI_norinco_innovation_desc: "China North Industries Group est le plus grand conglomérat de systèmes terrestres du pays, fournissant les armes légères et l'artillerie de toute la force terrestre. Extraire ses bureaux d'études de l'imitation prudente leur permet de poursuivre de véritables nouveaux systèmes d'infanterie et de canons."
 CHI_northern_theatre_command: "Commandement du Théâtre du Nord"
 CHI_northern_theatre_command_desc: "Centré sur Shenyang, le commandement de théâtre septentrional couvre la péninsule coréenne et la frontière russe. Il met l'accent sur la planification opérationnelle et la cohésion de ses formations interarmes lourdes."
 CHI_olympic_athlete_village: "Village des athlètes et centre des médias"
 CHI_olympic_athlete_village_desc: "Construire le village olympique des athlètes et le centre international de radiodiffusion dans la partie nord du Parc olympique. À l'achèvement, les bâtiments seront convertis à un usage résidentiel et commercial, ajoutant au stock de logements et de bureaux de Pékin."
 CHI_olympic_environmental_program: "Programme environnemental"
 CHI_olympic_environmental_program_desc: "Accélérer le passage du charbon au gaz dans le réseau de chauffage de Pékin, relocaliser les installations les plus polluantes du Capital Steel Group et lancer une vaste campagne de boisement dans les montagnes environnantes. Le programme améliorera la qualité de l'air aux normes olympiques et démontrera l'engagement de la Chine envers le développement durable."
 CHI_olympic_mission: "Préparer les Jeux olympiques de Pékin"
 CHI_olympic_mission_desc: "Nous nous sommes engagés à accueillir les Jeux olympiques de Pékin 2008. La communauté internationale regardera. Financer les quatre programmes de préparation — sites, logements des athlètes, transport et environnement — avant l'échéance. L'échec à livrer à temps embarrassera le gouvernement et minera la confiance publique."
 CHI_olympic_preparations: "Préparations olympiques"
 CHI_olympic_preparations_tt: "Si nous parvenons à achever tous les focusses de préparation olympique, nous gagnerons :"
 CHI_olympic_transport_links: "Liaisons de transport olympiques"
 CHI_olympic_transport_links_desc: "Prolonger les lignes de métro jusqu'au Parc olympique, ouvrir l'Airport Express de l'aéroport de Pékin-Capitale et moderniser le corridor ferroviaire Qinhuangdao-Shenyang pour absorber le pic de trafic passagers et fret attendu pendant et après les Jeux."
 CHI_olympic_venue_construction: "Construction du site olympique"
 CHI_olympic_venue_construction_desc: "Financer la construction du Stade national, du Centre aquatique national et du Vélodrome national dans le district du Parc olympique. Ces sites phares serviront d'héritage permanent des Jeux olympiques de Pékin 2008 et feront aussi office de pôles commerciaux et sportifs pour la capitale."
 CHI_pacific_pla_training: "Formation PLA du Pacifique"
 CHI_patrol_diaoyu_fishing_grounds: "Patrouillez les zones de pêche de Diaoyu"
 CHI_patrol_diaoyu_fishing_grounds_desc: "Envoyer des vedettes de la milice maritime dans les eaux contestées. La pression monte et Tokyo sera forcé de réagir."
 CHI_pla_joint_maritime_exercise: "Exercice maritime conjoint du Pacifique"
 CHI_pla_joint_maritime_exercise_desc: "Conduire des exercices maritimes conjoints avec nos partenaires pacifiques des Nouvelles routes de la soie. Accroît leur expérience navale et notre influence dans la région."
 CHI_pla_train_SOL: "Former les forces de sécurité des îles Salomon"
 CHI_pla_train_SOL_desc: "Dépêcher des cadres d'entraînement de l'APL pour assister les forces de sécurité des îles Salomon. Transfère l'expérience de l'armée de terre et approfondit les liens de défense."
 CHI_poly_innovation: "Poly Technologies : Innovation Originale"
 CHI_poly_innovation_desc: "Poly Technologies, bras d'exportation d'armes de l'APL, chevauche tout le catalogue du matériel militaire chinois. Orienter sa portée commerciale vers un véritable développement élargit le progrès à travers le secteur de la défense."
 CHI_Press_NKO_on_Nuclear: "Pousser Pyongyang à la retenue nucléaire"
 CHI_Press_NKO_on_Nuclear_desc: "Appliquer une pression diplomatique directe sur la Corée du Nord pour geler les essais nucléaires et limiter les déploiements. Les progrès sont incrémentaux mais démontrent à Washington que Pékin est un partenaire sérieux de la non-prolifération."
 CHI_pressure_iaea_access: "Faire pression pour l'accès de l'AIEA"
 CHI_pressure_iaea_access_desc: "Faire pression sur Pyongyang pour admettre des inspecteurs de l'AIEA au complexe de Yongbyon. La pression chinoise pèse là où les exigences occidentales ne font que durcir la résistance nord-coréenne."
 CHI_princeling_intelligence_report: "Rapport de renseignement Princeling"
 CHI_princeling_intelligence_report_desc: "Consolider les derniers rapports des atouts du réseau au sein de la direction nord-coréenne. Chaque revue affine notre tableau des factions, rivalités et points de pression du régime."
 CHI_pro_natalist_subsidies: "Subventions pro-natalistes"
 CHI_pro_natalist_subsidies_desc: "Les gouvernements locaux à travers la Chine commencent à verser des transferts en espèces directs, des subventions à l'achat de logements et des congés de maternité et de paternité étendus pour inciter à la natalité. Des provinces dont le Jilin et le Sichuan pilotent des programmes valant des dizaines de milliers de yuans par enfant. Les comparaisons internationales suggèrent qu'une dépense fiscale substantielle ne produit que des gains de fécondité marginaux, mais les subventions réduisent les coûts des ménages et soutiennent la consommation intérieure à court terme."
 CHI_propose_unity_government: "Proposer un gouvernement d'unité coréen"
 CHI_propose_unity_government_desc: "Déposer une proposition chinoise formelle de gouvernement d'unité transitoire sous reconnaissance mutuelle. Le plus audacieux gambit diplomatique de l'ère, et le plus risqué."
 CHI_push_rcep_signing: "Pousser à la signature du RCEP"
 CHI_push_rcep_signing_desc: "Le Partenariat économique régional global, signé en novembre 2020 et entré en vigueur en janvier 2022, lie la Chine, le Japon, la Corée du Sud, les États de l'ASEAN, l'Australie et la Nouvelle-Zélande dans la plus vaste zone de libre-échange du monde. Obtenir la signature nous ancre au centre du commerce asiatique."
 CHI_railway_central_upgrade: "Modernisation du corridor ferroviaire central"
 CHI_railway_central_upgrade_desc: "Moderniser les terminaux ferroviaires et les infrastructures du centre de la Chine et du pôle de Pékin, couvrant le Hubei, le Henan et Pékin. Renforcer ce corridor réduit la congestion sur les artères de fret les plus denses du pays et améliore l'approvisionnement en matières industrielles des zones manufacturières de l'intérieur."
 CHI_railway_east_upgrade: "Modernisation du corridor ferroviaire de l'Est"
 CHI_railway_east_upgrade_desc: "Moderniser les terminaux ferroviaires et les infrastructures de l'est et du centre de la Chine, reliant Jiangxi, Anhui et Sichuan en un réseau continu de fret et de voyageurs. Les travaux accroissent la capacité de construction régionale et réduisent le temps nécessaire pour acheminer les intrants industriels de l'intérieur depuis les ports côtiers."
 CHI_railway_improvement: "Modernisation ferroviaire nationale"
 CHI_railway_north_upgrade: "Modernisation du corridor ferroviaire du Nord"
 CHI_railway_north_upgrade_desc: "Moderniser les terminaux ferroviaires et les infrastructures de surface le long du corridor de Chine du Nord reliant le Hebei, le Shanxi et les provinces voisines. Une capacité ferroviaire accrue augmente le débit d'approvisionnement, réduit les coûts logistiques et accélère la construction dans toute la région."
 CHI_railway_south_upgrade: "Modernisation du corridor ferroviaire sud"
 CHI_railway_south_upgrade_desc: "Moderniser les terminaux ferroviaires et les infrastructures du sud de la Chine et du Yunnan, intégrant Guangdong, Hunan et les provinces frontalières du sud-ouest au réseau national. Le programme accélère le mouvement des biens manufacturés et des produits agricoles tout en soutenant l'expansion industrielle le long du corridor."
 CHI_railway_west_upgrade: "Modernisation du corridor ferroviaire ouest"
 CHI_railway_west_upgrade_desc: "Moderniser les terminaux ferroviaires et les infrastructures du nord-ouest et du sud-ouest, reliant Shaanxi, Gansu, Chongqing et Xinjiang au réseau national de fret. L'investissement réduit les coûts de transport des parcs industriels de l'ouest et ouvre des provinces jusqu'alors isolées aux chaînes d'approvisionnement manufacturières à grande échelle."
 CHI_raise_retirement_age: "Relever l'âge de la retraite"
 CHI_raise_retirement_age_desc: "L'âge légal de la retraite en Chine, fixé en 1978, compte parmi les plus bas du monde : 60 ans pour les hommes, 55 pour les femmes de bureau et 50 pour les ouvrières. Un relèvement progressif prolonge la vie active de deux à cinq ans, maintient plus longtemps les travailleurs expérimentés dans la population active et soulage le système de pensions. La résistance des salariés qui attendaient une retraite précoce et des jeunes craignant un moindre recrutement est importante."
 CHI_rare_earth_chip_leverage_decision: "Tirer parti des contrôles des terres rares"
 CHI_rare_earth_chip_leverage_decision_desc: "Lier l'allègement de l'embargo occidental sur les puces à la poursuite des exportations chinoises de terres rares et de gallium. Ouvrir des pourparlers avec Washington : le succès assouplit les contrôles et fait avancer l'autosuffisance ; le refus durcit l'embargo et brûle le capital politique engagé."
 CHI_rare_earth_embargo_decision: "Actionner le levier des terres rares"
 CHI_rare_earth_embargo_decision_desc: "La Chine raffine près de quatre-vingt-dix pour cent des terres rares mondiales, les aimants de chaque missile guidé et avion furtif. Couper l'accès d'un rival paralyse sa production de défense pendant des mois, au prix du capital politique et d'une réputation de fournisseur peu fiable."
 CHI_rare_earth_supply_assurance: "Garantir l’approvisionnement en terres rares"
 CHI_rare_earth_supply_assurance_desc: "La Chine raffine l'écrasante majorité des terres rares mondiales, intrants des semi-conducteurs, batteries et écrans sud-coréens. Offrir à Séoul un approvisionnement garanti fait de nous un partenaire fiable et affaiblit l'emprise de Washington sur son allié."
 CHI_rcep_deepening: "Approfondissement du RCEP"
 CHI_rcep_deepening_desc: "Proposer aux partenaires régionaux une mise en œuvre accélérée des engagements du RCEP. Une intégration économique plus profonde avec l'Asie-Pacifique consolide la position de la Chine comme partenaire économique indispensable de la région."
 CHI_recall_paf_maritime_militia: "Rappel de la milice maritime de la PAF"
 CHI_recall_paf_maritime_militia_desc: "Retirer la présence permanente de la milice et laisser la pression retomber."
 CHI_rein_in_cliques: "Tenir en bride les cliques"
 CHI_rein_in_cliques_desc: "Auditer périodiquement les cliques de contrebande et les réseaux de clientèle avant qu'ils n'échappent à tout contrôle. Récupérer les fonds détournés remplit le Trésor et réaffirme la confiance du Parti, même si le corps des officiers ressent mal la surveillance."
 CHI_replace_synopsys_cadence_decision: "Remplacer Synopsys et Cadence"
 CHI_replace_synopsys_cadence_decision_desc: "Après l'interdiction d'exportation de mai 2025, pousser toutes les maisons fabless nationales vers les flux EDA Empyrean, Primarius et Xpeedic pour une couverture de conception complète."
 CHI_retry_chang_e_mission: "Relancer la sonde Chang'e"
 CHI_retry_chang_e_mission_desc: "La sonde n'a pas atteint la Lune ni pu l'étudier. Construire un remplaçant et le renvoyer."
 CHI_retry_shenzhou_mission: "Relancer la mission Shenzhou"
 CHI_retry_shenzhou_mission_desc: "La dernière tentative a échoué. Examiner les données de vol, corriger la panne et empiler un autre Shenzhou pour le lancement."
 CHI_retry_tiangong_mission: "Reprendre l'assemblage de Tiangong"
 CHI_retry_tiangong_mission_desc: "L'amarrage ou l'insertion de module n'a pas suivi le plan. Remettre en état et retenter l'assemblage de la station."
 CHI_sac_innovation: "Avion Shenyang : innovation originale"
 CHI_sac_innovation_desc: "La Shenyang Aircraft Corporation construit les chasseurs lourds de l'armée de l'air et de la marine de l'APL, de la série J-11 au J-15 embarqué et au J-35. La réformer aiguise le tranchant du combat aérien chinois."
 CHI_sco_anti_terror_crackdown: "Lancez la répression antiterroriste"
 CHI_sco_anti_terror_crackdown_desc: "Ordonner aux services de sécurité une répression d'envergure des réseaux terroristes dans le cadre des Trois Fléaux de l'OCS. Relève temporairement notre posture antiterroriste au détriment de la stabilité intérieure."
 CHI_sco_apply_as_dialogue_partner: "Demander le statut de partenaire de dialogue"
 CHI_sco_apply_as_dialogue_partner_desc: "Nous pouvons demander formellement le statut de partenaire de dialogue au sein de l'Organisation de coopération de Shanghai. C'est le premier pas vers un engagement plus profond avec la Chine et ses partenaires."
 CHI_sco_category: "L'Organisation de coopération de Shanghai"
 CHI_sco_category_desc: "\n£MAIN_desctext_sco \n\n\n\n§YL'Organisation de coopération de Shanghai§! ou §YOCS§! est une organisation intergouvernementale eurasienne axée sur la coopération économique, politique et de sécurité. Née des §YCinq de Shanghai§!, elle est devenue un cadre large par lequel §Y[CHI.GetFlag]la Chine§! et §Y[SOV.GetFlag]la Russie§! étendent leur influence tout en gérant la stabilité et la coopération régionales.\n\nPlutôt que de fonctionner comme une alliance traditionnelle, l'§YOCS§! croît par intégration progressive. Les pays peuvent d'abord devenir §Ypartenaires de dialogue§!, puis §Yobservateurs§!, avant de demander éventuellement la §Yadhésion pleine§!.\n\nLa volonté des pays de coopérer avec l'§YOCS§! dépend de plusieurs facteurs :\n\n§YL'agression chinoise§! reflète le degré d'assertivité de §Y[CHI.GetFlag]la Chine§!. Un niveau bas rend l'organisation plus attractive ; un niveau élevé décourage la coopération et peut éloigner les membres.\n\n§YLa cohésion de l'OCS§! représente la stabilité interne et la confiance entre États participants. Une haute cohésion améliore la coopération et l'efficacité des projets ; une faible cohésion ralentit l'intégration et accroît le risque de désengagement.\n\n§YL'équilibre Chine-Russie§! détermine la stabilité politique interne de l'organisation. Une relation équilibrée assure une expansion fluide, tandis que la domination d'un camp peut engendrer frictions, retards ou moindre coopération.\n\nPar des §Yprojets économiques§!, de §Ysécurité§! et §Ystratégiques§! conjoints, l'§YOCS§! permet à ses participants d'étendre leur influence, de renforcer les liens régionaux et de bâtir un bloc de puissance alternatif à travers l'Eurasie.\n\nSi l'agression chinoise dépasse les niveaux §R5§! et §R10§!, §Y[JAP.GetNameWithFlag]§! obtiendra de nouvelles options pour élargir l'article 9 de manière à contrer les positions militaires [CHI.GetFlag]§Y[CHI.GetAdjectiveCap]§!.\n\n$CHI_chinese_aggression_display$\n$CHI_sco_cohesion_display$\n$CHI_sco_balance_display$"
 CHI_sco_cohesion_decay: "Ajustement de cohésion de l’OCS"
 CHI_sco_cohesion_decay_desc: "Un recalibrage annuel caché qui pousse la cohésion de l'OCS vers son équilibre naturel de cinq, relevé d'un demi-point pour chaque mégaprojet actif. Si la cohésion est au-dessus de l'équilibre, elle diminue d'un ; si elle est en dessous, elle augmente d'un."
 CHI_sco_consider_leaving: "Reconsidérer l’adhésion à l’OCS"
 CHI_sco_consider_leaving_desc: "Une décision cachée gérée par l'IA par laquelle États membres et observateurs évaluent si la détérioration des relations avec Pékin ou les problèmes croissants de cohésion de l'OCS justifient un recul de leur participation. Les États très exposés à l'agression chinoise ou ayant une mauvaise opinion de la Chine envisageront plus sérieusement le départ."
 CHI_sco_upgrade_to_member: "Demander l'adhésion pleine à l'OCS"
 CHI_sco_upgrade_to_member_desc: "En tant qu'observateur reconnu, nous pouvons désormais demander l'adhésion pleine à l'Organisation de coopération de Shanghai."
 CHI_sco_upgrade_to_observer: "Demander le statut d'observateur"
 CHI_sco_upgrade_to_observer_desc: "Ayant établi notre statut de partenaire de dialogue, nous pouvons désormais viser le statut d'observateur plein au sein de l'OCS, ouvrant un accès plus large à la coopération économique et politique."
 CHI_scs_assertive_patrol_MAY: "Patrouille assertive : Spratlys de Malaisie"
 CHI_scs_assertive_patrol_MAY_desc: "Ordonner à une flottille de la marine de l'APL d'entrer dans les eaux contestées avec la Malaisie, dans le sud des Spratleys près des hauts-fonds de Luconia. Les liens économiques de Kuala Lumpur avec nous compliquent ses options de réponse, mais une victoire décisive reste nécessaire pour faire avancer le compteur d'accrochages. Les engagements non concluants sont fréquents vu la prudence malaisienne ; un revers risque de perturber la relation de prêts d'infrastructure."
 CHI_scs_assertive_patrol_PHI: "Patrouille assertive : Philippine Spratlys"
 CHI_scs_assertive_patrol_PHI_desc: "Ordonner à une flottille de la marine de l'APL d'entrer dans les eaux contestées avec les Philippines, visant les ravitaillements philippins au haut-fond d'Ayungin et aux îlots orientaux des Spratleys. Une victoire décisive fait avancer le compteur d'accrochages pour les Philippines ; un résultat non concluant le maintient ; un revers coûte $CHI_scs_framework$ et peut pousser Manille à invoquer les consultations du traité de défense mutuelle américain."
 CHI_scs_assertive_patrol_VIE: "Patrouille assertive : Spratlys vietnamiens"
 CHI_scs_assertive_patrol_VIE_desc: "Ordonner à une flottille de la marine de l'APL d'entrer dans les eaux contestées avec le Vietnam, défiant garde-côtes et navires de ravitaillement vietnamiens dans la chaîne ouest des Spratleys. L'opération a trois issues possibles : une victoire tactique décisive fait avancer le compteur d'accrochages vers le seuil d'ultimatum ; un engagement non concluant le maintient ; un revers abaisse $CHI_scs_framework$ et peut provoquer une riposte diplomatique de Hanoï."
 CHI_scs_block_asean_consensus: "Bloquer le consensus de l’ASEAN"
 CHI_scs_block_asean_consensus_desc: "Utiliser l'influence chinoise sur le Cambodge et le Laos pour empêcher un blâme de niveau ASEAN d'atteindre le communiqué du sommet. Les deux États occupent des positions de blocage dans le mécanisme de consensus ; leur coopération maintient le silence de la déclaration commune sur la conduite en mer de Chine méridionale. La manœuvre relève légèrement $CHI_chinese_aggression$ car les observateurs régionaux notent le cynisme, mais apporte un gain modeste à $CHI_scs_framework$ en empêchant un blâme institutionnalisé."
 CHI_scs_boundary_codification_MAY: "Traité de délimitation maritime : Malaisie"
 CHI_scs_boundary_codification_MAY_desc: "Conclure un traité bilatéral de limites maritimes avec la Malaisie, formalisant l'arrangement de facto dans les eaux contestées du sud. La signature de Kuala Lumpur parachève l'anneau de codifications bilatérales et isole tout défi multilatéral restant."
 CHI_scs_boundary_codification_PHI: "Traité de délimitation maritime : Philippines"
 CHI_scs_boundary_codification_PHI_desc: "Conclure un traité bilatéral de limites maritimes avec les Philippines, se substituant à la sentence arbitrale CNUDM de 2016. Manille accepte de mettre de côté le jugement du tribunal en échange de garanties d'investissement chinoises et d'un accès élargi à la zone de développement conjoint."
 CHI_scs_boundary_codification_VIE: "Traité de délimitation maritime : Viêt Nam"
 CHI_scs_boundary_codification_VIE_desc: "Conclure un traité bilatéral de limites maritimes avec le Vietnam à des conditions favorables à la Chine, codifiant les lignes convenues dans le golfe du Tonkin et mettant de côté les différends des Paracels et des Spratleys dans un cadre de développement conjoint. Hanoï accepte l'arrangement comme le meilleur résultat disponible ; Pékin s'assure un précédent."
 CHI_scs_carrier_strike_group_deployment: "Déploiement du groupe aéronaval"
 CHI_scs_carrier_strike_group_deployment_desc: "Déployer un groupe aéronaval complet en mer de Chine méridionale pour une station opérationnelle prolongée. Le déploiement signale que la Chine possède et exercera la capacité de contrôler la mer par la force, et non seulement de la contester."
 CHI_scs_demand_tribute_MAY: "Exiger la cession des Nansha"
 CHI_scs_demand_tribute_MAY_desc: "Adresser un ultimatum à Kuala Lumpur pour céder formellement le nord des Spratleys, y compris les îlots occupés par la Malaisie autour du récif Swallow et d'Ardasier. La note s'enveloppe du souvenir des patrouilles ming de Zheng He depuis Malacca, recadrant l'exigence comme la reprise d'un ancien ordre plutôt qu'une annexion nouvelle. Des trois revendicateurs, la Malaisie est la plus susceptible d'avaler la perte en silence."
 CHI_scs_demand_tribute_PHI: "Exiger la cession des Zhongsha"
 CHI_scs_demand_tribute_PHI_desc: "Adresser un ultimatum à Manille pour céder formellement le banc de Macclesfield, le haut-fond déjà administré par la Chine comme district Zhongsha de Sansha. La note jette la fiction de la négociation bilatérale et met à l'épreuve le traité de défense mutuelle de 1951 sur un banc sans garnison ni piste, le test le plus net pour savoir si Washington traite encore les récifs comme des lignes rouges."
 CHI_scs_demand_tribute_VIE: "Exiger la cession des Xisha"
 CHI_scs_demand_tribute_VIE_desc: "Adresser un ultimatum à Hanoï pour céder formellement les Paracels, territoire que nous tenons par la force depuis la bataille de 1974 qui a chassé la marine de la République du Vietnam du groupe Crescent. La note habille l'exigence du langage d'un droit historique antérieur à l'Indochine française, la présentant comme la clôture d'un dossier inachevé plutôt qu'une revendication nouvelle. Hanoï peut ratifier la perte par écrit, ou s'attirer une seconde leçon sur le modèle de 1979."
 CHI_scs_deploy_maritime_militia: "Déployer la milice maritime"
 CHI_scs_deploy_maritime_militia_desc: "Déployer en avant des navires de pêche opérant sous coordination de la marine de l'APL dans une région maritime contestée. La milice assure une présence persistante sous couverture civile plausible, créant des faits accomplis sur l'eau plus vite que la protestation diplomatique ne peut répondre."
 CHI_scs_first_island_chain_exercise: "Premier exercice de chaîne d'îles"
 CHI_scs_first_island_chain_exercise_desc: "Exécuter un exercice de flotte majeur sur toute la longueur de la première chaîne d'îles, de la mer Jaune à la mer de Chine méridionale. L'exercice démontre les capacités d'anti-accès et de déni de zone contre toute puissance tentant d'intervenir à l'intérieur de la chaîne."
 CHI_scs_infrastructure_loan_MAY: "Prêt d'infrastructure : Malaisie"
 CHI_scs_infrastructure_loan_MAY_desc: "Étendre le financement d'infrastructures des Nouvelles routes de la soie à la Malaisie, couvrant la East Coast Rail Link et l'expansion portuaire le long du corridor du détroit de Malacca. L'accord cimente la position de la Malaisie comme partenaire ASEAN le plus intégré économiquement à la Chine."
 CHI_scs_infrastructure_loan_PHI: "Prêt d'infrastructure : Philippines"
 CHI_scs_infrastructure_loan_PHI_desc: "Étendre le financement d'infrastructures des Nouvelles routes de la soie aux Philippines, couvrant ponts, développement ferroviaire et un nouveau port en eau profonde. L'offre arrive alors que Manille pèse les coûts et bénéfices de son alliance avec Washington."
 CHI_scs_infrastructure_loan_VIE: "Prêt d'infrastructure : Viêt Nam"
 CHI_scs_infrastructure_loan_VIE_desc: "Étendre le financement d'infrastructures des Nouvelles routes de la soie au Vietnam, couvrant modernisations portuaires, liaisons ferroviaires et zones industrielles. Le prêt approfondit la dépendance économique vietnamienne au capital chinois et relève le coût d'une confrontation diplomatique pour Hanoï."
 CHI_scs_invoke_doc_2002: "Réaffirmer la DOC de 2002"
 CHI_scs_invoke_doc_2002_desc: "Réaffirmer publiquement la Déclaration de 2002 sur la conduite des parties en mer de Chine méridionale comme cadre directeur de la gestion des différends. Le geste est largement symbolique mais signale la retenue aux partenaires de l'ASEAN et fournit une base diplomatique aux négociations bilatérales."
 CHI_scs_island_construction_civilian: "Construire des infrastructures civiles"
 CHI_scs_island_construction_civilian_desc: "Construire des installations portuaires, des stations météo et des logements civils permanents sur le complexe insulaire. Les signes visibles d'une occupation ordinaire — écoles, cliniques, bâtiments administratifs — renforcent l'argument politique selon lequel ces îlots constituent un territoire chinois habité."
 CHI_scs_island_construction_radar: "Ériger des réseaux radar et SIGINT"
 CHI_scs_island_construction_radar_desc: "Construire des installations de renseignement d'origine électromagnétique et des radars transhorizon sur l'île artificielle. Les installations assurent une connaissance persistante du domaine maritime en mer de Chine méridionale et suivent en temps réel les mouvements navals et aériens étrangers."
 CHI_scs_island_construction_runway: "Construire une piste d’atterrissage"
 CHI_scs_island_construction_runway_desc: "Aménager une piste goudronnée de 3 000 mètres sur le complexe d'île artificielle, capable d'accueillir des avions de combat et des patrouilleurs maritimes long-courriers. L'aérodrome transforme l'installation d'un avant-poste de présence en un pôle de projection de puissance."
 CHI_scs_island_construction_sam_battery: "Installer la batterie SAM"
 CHI_scs_island_construction_sam_battery_desc: "Déployer des batteries de missiles surface-air longue portée sur le complexe insulaire. Les installations étendent l'enveloppe de défense aérienne chinoise au cœur de la mer de Chine méridionale, compliquant toute opération étrangère de liberté de navigation ou patrouille aérienne."
 CHI_scs_joint_development_MAY: "Accord d'exploitation des hauts-fonds de Luconia"
 CHI_scs_joint_development_MAY_desc: "Approcher Petronas d'un accord d'exploitation conjointe couvrant les blocs ND6 et SK308 autour des hauts-fonds de Luconia, où les cutters des garde-côtes chinois escortent déjà les plates-formes malaisiennes à South Luconia. L'habitude de Kuala Lumpur de compartimenter le différend à huis clos en fait la signature la plus facile à obtenir ; un accord conclu devient le modèle que Pékin brandit à Hanoï et Manille."
 CHI_scs_joint_development_PHI: "Relancer le protocole d'accord énergétique de Manille"
 CHI_scs_joint_development_PHI_desc: "Relancer le mémorandum d'entente mis de côté sur le développement pétrolier et gazier, associant CNOOC à PXP Energy sur le contrat de service 72 du banc Reed. Manille empoche une part de recettes fixe et une vague d'investissements amont en échange de traiter la sentence arbitrale de 2016 comme politiquement dormante. La voie bilatérale enterre le dossier philippin sous le droit des contrats."
 CHI_scs_joint_development_VIE: "Pacte d’exploitation conjoint de Vanguard Bank"
 CHI_scs_joint_development_VIE_desc: "Ouvrir des pourparlers discrets avec Hanoï sur une zone de développement conjoint couvrant le chevauchement du banc Vanguard et les eaux non résolues à l'est de la délimitation de 2000 du golfe du Tonkin. CNOOC et PetroVietnam se partageraient droits de prospection et recettes selon une formule « sans préjudice de la souveraineté », gelant la question juridique pendant que le gaz circule. Le canal bilatéral tient l'ASEAN à distance et ôte à Hanoï l'incitation à invoquer la CNUDM."
 CHI_scs_natuna_press_claim: "Pousser la revendication aux neuf traits jusqu'à Natuna"
 CHI_scs_natuna_press_claim_desc: "Adresser une note formelle affirmant que nos droits historiques au titre de la ligne aux neuf traits s'étendent aux eaux chevauchant la ZEE indonésienne de Natuna. La revendication est juridiquement contestée, l'Indonésie ne se considérant pas comme partie au différend de mer de Chine méridionale, mais son affirmation étend la frontière diplomatique vers le sud et crée un nouveau point de pression sur le plus grand État de l'ASEAN."
 CHI_scs_natuna_provocation: "Provocation de Natuna"
 CHI_scs_natuna_provocation_desc: "Déployer des navires de milice maritime chinoise dans la zone économique exclusive indonésienne de Natuna sous couvert d'opérations de pêche ordinaires. L'incursion est niable mais visible ; Jakarta répondra diplomatiquement. L'action sonde la limite sud de la portée opérationnelle chinoise et teste la résolution indonésienne sans engager d'unités régulières de la marine de l'APL."
 CHI_scs_reclaim_taiping: "Récupérer Taiping"
 CHI_scs_reclaim_taiping_desc: "L'île Taiping (État 491) est le plus grand îlot naturel de la chaîne des Spratleys et reste sous administration de la République de Chine à Taïwan. Les trois États des Spratleys étant sécurisés, une opération directe pour prendre Taiping représente l'acte final de consolidation de la mer de Chine méridionale, distinct de tout scénario plus large de réunification de Taïwan et le précédant. L'opération a un coût en pouvoir politique très élevé et exige l'engagement total de la flotte de mer du Sud de l'APL."
 CHI_scs_standoff_malaysia: "Conduite à tenir : Malaisie"
 CHI_scs_standoff_malaysia_desc: "Exécuter le modèle Scarborough contre un îlot contesté revendiqué par la Malaisie. Kuala Lumpur a historiquement géré avec soin la relation avec Pékin ; cet affrontement teste si la dépendance économique retient une protestation diplomatique formelle."
 CHI_scs_standoff_philippines: "Conduite à tenir : Philippines"
 CHI_scs_standoff_philippines_desc: "Exécuter le modèle Scarborough contre un îlot contesté revendiqué par les Philippines. Un incident avec un bateau de pêche philippin est escaladé par une confrontation des garde-côtes jusqu'au retrait de Manille, laissant une présence chinoise permanente."
 CHI_scs_standoff_vietnam: "Conduite à tenir : Vietnam"
 CHI_scs_standoff_vietnam_desc: "Exécuter le modèle Scarborough contre un îlot contesté revendiqué par le Vietnam. Les garde-côtes de Hanoï sont inférieurs en moyens et en hommes ; la question est de savoir si Hanoï accepte la perte en silence ou escalade d'une manière qui attire l'attention internationale."
 CHI_scs_summon_dragon_king_blessing: "Bénédiction de la flotte du Roi Dragon"
 CHI_scs_summon_dragon_king_blessing_desc: "Célébrer une bénédiction cérémonielle de la flotte de mer du Sud au temple Tianhou de Sanya, Hainan, invoquant la protection de Mazu, déesse de la mer vénérée par des générations de marins de mer du Sud. La cérémonie est diffusée nationalement ; la flotte de mer du Sud part en exercices immédiatement après."
 CHI_secure_kpa_general_staff: "Sécuriser les contacts à l'état-major de l'APC"
 CHI_secure_kpa_general_staff_desc: "Cultiver des officiers alignés sur la Chine à l'état-major général de l'APK. Un général en service dans le réseau vaut une douzaine de politiciens en exil."
 CHI_seek_basing_BAN: "Demander une base navale au Bangladesh"
 CHI_seek_basing_BAN_desc: "Approcher Dacca d'une demande formelle d'accès logistique aux installations portuaires de Chittagong, présentée comme un partenariat stratégique."
 CHI_seek_basing_BRM: "Demander une base navale au Myanmar"
 CHI_seek_basing_BRM_desc: "Approcher Naypyidaw d'une demande formelle d'accès logistique à Kyaukpyu et Sittwe, présentée comme un partenariat stratégique."
 CHI_seek_basing_CBD: "Demander une base navale au Cambodge"
 CHI_seek_basing_CBD_desc: "Approcher Phnom Penh d'une demande formelle d'accès logistique à la base navale de Ream, présentée comme un partenariat stratégique."
 CHI_seek_basing_PAK: "Étendre les droits de base au Pakistan"
 CHI_seek_basing_PAK_desc: "S'appuyer sur le partenariat des Frères de fer pour étendre la logistique navale chinoise aux ports pakistanais au-delà de Gwadar."
 CHI_seek_basing_SRI: "Demander une base navale au Sri Lanka"
 CHI_seek_basing_SRI_desc: "Approcher Colombo d'une demande formelle d'accès logistique à Hambantota, présentée comme un partenariat stratégique."
 CHI_semiconductor_coop_with_kor: "Coopération semi-conducteurs avec la Corée"
 CHI_semiconductor_coop_with_kor_desc: "Établir une initiative conjointe de recherche et de fabrication de semi-conducteurs avec la Corée du Sud. L'accès à l'expertise coréenne de fabrication de puces accélère le développement technologique chinois."
 CHI_seoul_hanbok_exchange: "Organiser un échange de Hanbok à Séoul"
 CHI_seoul_hanbok_exchange_desc: "La diplomatie culturelle peut apaiser les tensions même au milieu de différends sur un patrimoine partagé. Parrainer un échange de hanbok à Séoul réchauffe le sentiment public et ouvre un canal d'influence plus doux en Corée du Sud."
 CHI_shenzhou_mission: "Lancer la mission Shenzhou"
 CHI_shenzhou_mission_desc: "Un vaisseau Shenzhou est empilé sur un Longue Marche 2F au centre de lancement de Jiuquan. L'équipage doit atteindre l'orbite et revenir sain et sauf pour confirmer notre capacité autonome de vol habité. Les chances de succès s'améliorent à mesure que notre expérience de lancement croît."
 CHI_sichuan_tibet_railway: "Chemin de fer Sichuan-Tibet"
 CHI_sichuan_tibet_railway_desc: "Percer un chemin de fer à travers gorges et cols entre Chengdu et Lhassa, plus de 80 pour cent de sa longueur en tunnels et sur ponts. La liaison met fin à l'isolement du Tibet, resserre le contrôle central sur le plateau et fournit une artère stratégique vers la frontière indienne."
 CHI_skilled_immigration_drive: "Campagne d'immigration qualifiée"
 CHI_skilled_immigration_drive_desc: "Le système de résidence permanente chinois a historiquement été parmi les plus restrictifs des grandes économies. Une nouvelle voie de visa hautement qualifié, calquée sur les parcours de carte verte aux États-Unis et au Canada, vise chercheurs, ingénieurs et entrepreneurs. Le programme est modeste aux normes mondiales mais marque un revirement politique important, reconnaissant que l'offre démographique intérieure seule ne peut combler les lacunes émergentes dans la technologie et la santé."
 CHI_snwt_central_route: "Transfert fluvial Sud-Nord : route centrale"
 CHI_snwt_central_route_desc: "Canaliser l'eau du réservoir de Danjiangkou sur la Han au Hubei vers le nord à travers le Henan et le Hebei jusqu'à Pékin. Opérationnelle depuis décembre 2014, la route centrale alimente l'eau potable de la capitale et soulage l'épuisement chronique des aquifères de la plaine de Chine du Nord."
 CHI_snwt_eastern_route: "Transfert fluvial Sud-Nord : route de l'Est"
 CHI_snwt_eastern_route_desc: "Pomper l'eau vers le nord depuis le Yangtsé inférieur près du Jiangsu le long du cours du Grand Canal antique vers les villes assoiffées du Shandong et de Tianjin. La route orientale est la première des trois lignes de diversion qui, ensemble, déplacent environ 44,8 milliards de mètres cubes d'eau chaque année vers le nord aride."
 CHI_snwt_western_route: "Transfert fluvial Sud-Nord : Route de l'Ouest"
 CHI_snwt_western_route_desc: "Détourner les sources du Yangtsé à travers les monts Bayan Har sur le plateau Qinghai-Tibet vers le cours supérieur du Fleuve Jaune, irriguant Qinghai, Gansu et Shaanxi. La plus exigeante techniquement des trois routes, elle sécuriserait l'eau de tout le nord-ouest aride."
 CHI_south_china_sea_category: "Mer de Chine méridionale"
 CHI_south_china_sea_category_desc: "Décisions en cours façonnant notre posture en mer de Chine méridionale. Les actions ici affectent la variable du cadre de mer de Chine méridionale, nos relations avec le Vietnam, les Philippines et la Malaisie, et le risque de confrontation avec les États-Unis."
 CHI_southern_theatre_command: "Commandement du théâtre sud"
 CHI_southern_theatre_command_desc: "Basé à Guangzhou, le commandement de théâtre du Sud supervise la mer de Chine méridionale et la frontière vietnamienne. Il se spécialise dans la coordination interarmées des garnisons insulaires dispersées et le renseignement qui les relie."
 CHI_space_program: "Programme spatial chinois"
 CHI_subcontinent_strategy: "Stratégie du sous-continent"
 CHI_subcontinent_strategy_desc: "Notre boîte à outils diplomatique et militaire pour le sous-continent indien : pression le long de la ligne de contrôle effectif, partenariats avec le Pakistan et la périphérie sud-asiatique, et la frontière himalayenne contestée. Les décisions prises ici façonnent l'escalade le long de la frontière et notre levier dans la région.\n\n$raj_chi_border_readiness$ : [?THIS.raj_chi_border_readiness|Y0]\n$raj_chi_border_tension$ : [?global.raj_chi_border_tension|Y0]\n\n§YProgression des revendications§! (80 requis pour faire valoir une revendication) :\nArunachal Pradesh : [?THIS.raj_chi_border_progress_475|Y0]\nSikkim : [?THIS.raj_chi_border_progress_982|Y0]\nAksai Chin : [?THIS.raj_chi_border_progress_591|Y0]"
 CHI_Surveillance_Export: "Exporter l'architecture de surveillance"
 CHI_Surveillance_Export_desc: "Déployer des systèmes chinois de surveillance et de suivi numérique chez un partenaire non démocratique. Coûte 80 au fonds des Nouvelles routes de la soie et au Trésor national."
 CHI_thaad_retaliation_escalate: "Intensifier les représailles du THAAD"
 CHI_thaad_retaliation_escalate_desc: "Lorsque Séoul a accepté d'accueillir le système américain de défense antimissile THAAD en 2016, Pékin a répondu par un boycott informel qui a frappé Lotte, le tourisme coréen et les exportations culturelles. Resserrer la pression approfondit la punition économique de la Corée du Sud."
 CHI_three_gorges_dam_decision: "Achever le barrage des Trois Gorges"
 CHI_three_gorges_dam_decision_desc: "Enjambant le Yangtsé à Yichang, le barrage des Trois Gorges est devenu la plus grande centrale électrique du monde à sa mise en service complète en 2012, avec une capacité installée de 22,5 gigawatts. L'achever livre un vaste bloc de production hydroélectrique au réseau national."
 CHI_three_north_shelterbelt: "Programme de ceinture forestière des Trois-Nord"
 CHI_three_north_shelterbelt_desc: "Planter la « Grande muraille verte », une ceinture de forêts et de prairies s'étendant à travers le nord aride du Xinjiang au nord-est. Lancé en 1978 et poursuivi pendant des décennies, le programme retient le Gobi en expansion, ancre le sol contre les tempêtes de poussière et reconquiert des terres agricoles sur le désert."
 CHI_tiangong_mission: "Assembler la station Tiangong"
 CHI_tiangong_mission_desc: "Le module central Tianhe doit atteindre l'orbite et s'amarrer avec succès à sa première visite habitée avant que les cabines-laboratoires Wentian et Mengtian ne suivent. Un avant-poste orbital permanent est le fondement de tout ce qui dépasse l'orbite terrestre basse. Les chances de succès s'améliorent à mesure que notre expérience de lancement croît."
 CHI_tour_group_freeze: "Gel des groupes de touristes"
 CHI_tour_group_freeze_desc: "Suspendre les groupes de voyage organisés vers la Corée du Sud. Le gel retire une source majeure de recettes touristiques sud-coréennes et signale notre volonté d'utiliser des outils économiques de façon coercitive lorsque nos intérêts de sécurité l'exigent."
 CHI_track_ii_academic_forum: "Forum académique Track II"
 CHI_track_ii_academic_forum_desc: "Parrainer un dialogue de voie II entre nos universitaires et leurs homologues sud-coréens sur la stabilité de la péninsule. Les canaux informels bâtissent la confiance là où la diplomatie officielle s'enlise."
 CHI_Track_II_Diplomacy: "Diplomatie de voie II"
 CHI_Track_II_Diplomacy_desc: "Financer des échanges informels universitaires et de think tanks entre nos spécialistes, leurs homologues américains et des universitaires coréens. Chaque round bâtit une compréhension mutuelle et prépare le terrain aux négociations formelles."
 CHI_trilateral_trade_forum: "Forum commercial trilatéral"
 CHI_trilateral_trade_forum_desc: "Convoquer un forum commercial Pékin-Séoul-Pyongyang centré sur le modèle de Kaesong. L'interdépendance commerciale crée sa propre constituency pour la paix."
 CHI_uhv_east_transmission: "Réseau à ultra haute tension : transport de l'Est"
 CHI_uhv_east_transmission_desc: "Achever les lignes à ultra-haute tension longue distance qui transportent l'électricité sur des milliers de kilomètres des bases de l'ouest vers les centres de charge de Shanghai, Pékin et Guangdong. La transmission longue distance réduit les pertes en ligne et alimente le cœur industriel côtier avec l'énergie propre de l'ouest."
 CHI_uhv_west_generation: "Réseau à très haute tension : base de production occidentale"
 CHI_uhv_west_generation_desc: "Développer les grandes bases de production de l'ouest : les champs éoliens et solaires du Xinjiang, les renouvelables de Mongolie-Intérieure et l'hydroélectricité du Yangtsé supérieur. Ces pôles énergétiques reculés ancrent le plus grand réseau de transmission à ultra-haute tension du monde."
 CHI_urban_water_recycling: "Recyclage des eaux usées urbaines"
 CHI_urban_water_recycling_desc: "Pékin, Tianjin et les grandes villes du Hebei rejettent collectivement des milliards de mètres cubes d'eaux usées municipales chaque année, la plupart traitées seulement au niveau secondaire avant rejet. Un programme d'usines de traitement tertiaire avancé et de réseaux dédiés d'eau réutilisée détourne l'effluent traité vers le refroidissement industriel, les espaces verts municipaux et l'augmentation des lits de rivière. Tianjin a atteint des taux de réutilisation d'eau réclamée supérieurs à 30 pour cent ; le programme fixe un objectif national de 25 pour cent de réutilisation urbaine d'ici 2030."
 CHI_us_korea_cost_signaling: "Signalisation des coûts entre les États-Unis et la Corée"
 CHI_us_korea_cost_signaling_desc: "Signaler à Washington et Séoul que leur alliance de sécurité entraîne des coûts économiques et diplomatiques croissants. Des mesures de pression ciblées rappellent aux deux parties que le statu quo n'est pas sans prix."
 CHI_VEN_currency_swap_line: "Ligne d'échange de devises Yuan-Bolivar"
 CHI_VEN_currency_swap_line_desc: "Établir une ligne de swap de devises à long terme pour protéger le Venezuela de la pression de la dette libellée en dollars et verrouiller l'approvisionnement en matières premières."
 CHI_VEN_emergency_food_aid: "Aide alimentaire d'urgence au Venezuela"
 CHI_VEN_emergency_food_aid_desc: "Expédier des denrées et une aide humanitaire pour stabiliser le gouvernement Maduro. Améliore la stabilité vénézuélienne et notre influence."
 CHI_VEN_oil_processing_aid: "Aide vénézuélienne à la transformation du pétrole"
 CHI_VEN_oil_processing_aid_desc: "Envoyer nos ingénieurs et capitaux de raffinage pour moderniser le traitement pétrolier vénézuélien. Le travail accroît leur rendement d'extraction et approfondit notre participation à la chaîne d'approvisionnement de l'Orénoque."
 CHI_VEN_petrocaribe_program: "Programme de soutien au Venezuela"
 CHI_water_conservation_project: "Projet de conservation provincial"
 CHI_water_conservation_project_desc: "Un projet ciblé de conservation de l'eau est lancé dans une des provinces sèches du nord, modernisant le revêtement des canaux, réhabilitant les réseaux de suivi des nappes et construisant des réservoirs locaux pour réduire le gaspillage et la surexploitation. Chaque projet achevé réduit la pression sur la nappe provinciale. L'initiative peut être répétée dans les provinces sous stress hydrique du Hebei, Shanxi, Henan et Shaanxi, et un nombre suffisant de projets achevés soulagera la pénurie d'eau nationale de la Chine."
 CHI_water_shortage_category: "Projets de conservation de l'eau"
 CHI_western_theatre_command: "Commandement du théâtre occidental"
 CHI_western_theatre_command_desc: "Le plus vaste par la superficie, le commandement de théâtre de l'Ouest à Chengdu garde la frontière himalayenne avec l'Inde et l'intérieur agité. Ses troupes s'entraînent à la défense en haute altitude et à la guerre de positions retranchée."
 CHI_yangtze_delta_integration_mission: "Intégration du Delta du Yangtsé"
 CHI_yangtze_delta_integration_mission_desc: "Shanghai, Jiangsu et Zhejiang s'étant engagés dans un développement coordonné, le delta du Yangtsé est en position de devenir le corridor industriel et d'exportation le plus productif de Chine. Les provinces qui porteront leur production d'usines au-dessus du seuil cible dans l'année gagneront une croissance durable de productivité régionale."
 give_up_membership_status_desc: "Quitter l'Organisation de coopération de Shanghai met fin à la participation à ses exercices de sécurité conjoints, corridors économiques et cadres de consultation politique. Les membres aux lectures d'agression chinoise élevées ou en guerre contre d'autres membres subissent une pression croissante pour sortir du bloc."
 give_up_observer_status_desc: "Le retrait du statut d'observateur rompt les liens avec les programmes économiques et de sécurité de l'Organisation de coopération de Shanghai. La décision est généralement dictée par un réalignement vers l'OTAN ou l'Occident, ou par la détérioration des relations avec Pékin."
 host_joint_exercises_desc: "La Chine ou la Russie peut convoquer un exercice militaire conjoint complet de l'OCS, dépensant quarante points de commandement pour accorder une idée temporaire de préparation au combat à tous les États membres pendant vingt et un jours. Un chef d'armée aléatoire gagne un niveau de compétence à la conclusion. L'exercice ne peut être lancé tant qu'un membre est en guerre."
 offer_joint_exercises_specific_desc: "Une proposition d'exercice bilatéral envoyée à un membre spécifique de l'OCS. À l'acceptation, les deux parties dépensent vingt points de commandement pour un exercice conjoint de quatorze jours qui accorde l'idée d'exercice conjoint OCS spécifique et se conclut par un modificateur d'opinion de coopération militaire mutuelle."
 provide_development_assistance_desc: "Canaliser des ressources vers [FROM.GetName] pour renforcer son développement et approfondir ses liens avec le cadre de l'OCS."
 sco_bilateral_border_patrol: "Patrouille frontalière conjointe avec [FROM.GetName]"
 sco_bilateral_border_patrol_desc: "Coordonner les opérations de sécurité frontalière avec [FROM.GetName] pour combattre la criminalité transfrontalière et renforcer la confiance mutuelle."
 sco_bilateral_cultural_exchange: "Échange culturel avec [FROM.GetName]"
 sco_bilateral_cultural_exchange_desc: "Lancer un programme d'échanges culturels et universitaires avec [FROM.GetName], favorisant les liens entre peuples et la compréhension mutuelle."
 sco_bilateral_energy_deal: "Partenariat énergétique avec [FROM.GetName]"
 sco_bilateral_energy_deal_desc: "Négocier un accord d'approvisionnement énergétique à long terme avec [FROM.GetName], stabilisant les prix et sécurisant les flux de ressources stratégiques."
 sco_bilateral_intel_sharing: "Partage de renseignement avec [FROM.GetName]"
 sco_bilateral_intel_sharing_desc: "Établir un canal sécurisé de partage de renseignement avec [FROM.GetName] pour coordonner les opérations antiterroristes et de sécurité."
 sco_bilateral_trade_agreement: "Accord commercial bilatéral avec [FROM.GetName]"
 sco_bilateral_trade_agreement_desc: "Établir un cadre commercial formel avec [FROM.GetName] sous l'égide de l'OCS, réduisant les tarifs et encourageant l'investissement conjoint."
 sco_megaproject_air_defense_optin: "Rejoindre la défense aérienne conjointe de l'OCS"
 sco_megaproject_air_defense_optin_desc: "Adhérer au réseau de défense aérienne conjointe de l'OCS, en contribuant à l'infrastructure partagée de radar et de défense antimissile."
 sco_megaproject_air_defense_propose: "Proposer une défense aérienne conjointe de l'OCS"
 sco_megaproject_air_defense_propose_desc: "Proposer un réseau de défense aérienne intégré entre États membres de l'OCS, partageant la couverture radar et coordonnant les opérations antiaériennes."
 sco_megaproject_dev_bank_optin: "Rejoindre la Banque de développement de l'OCS"
 sco_megaproject_dev_bank_optin_desc: "Rejoindre la Banque de développement de l'OCS comme membre contributeur, obtenant l'accès à un financement du développement à bas taux."
 sco_megaproject_dev_bank_propose: "Proposer une banque de développement de l'OCS"
 sco_megaproject_dev_bank_propose_desc: "Proposer la création d'une banque multilatérale de développement pour financer infrastructures et développement parmi les États membres de l'OCS."
 sco_megaproject_energy_grid_optin: "Rejoindre le réseau énergétique de l'OCS"
 sco_megaproject_energy_grid_optin_desc: "Adhérer au projet de réseau énergétique de l'OCS, apportant des ressources en échange d'un accès à l'infrastructure électrique partagée."
 sco_megaproject_energy_grid_propose: "Proposer un réseau énergétique de l'OCS"
 sco_megaproject_energy_grid_propose_desc: "Proposer la construction d'un réseau énergétique intégré couvrant les États membres de l'OCS, réduisant les coûts et améliorant la sécurité énergétique de tous les participants."
 sco_megaproject_railway_optin: "Rejoindre le chemin de fer trans-eurasien"
 sco_megaproject_railway_optin_desc: "Adhérer au projet de chemin de fer trans-eurasien, investissant dans le corridor commercial pour des bénéfices économiques à long terme."
 sco_megaproject_railway_propose: "Proposer un chemin de fer transeurasien"
 sco_megaproject_railway_propose_desc: "Proposer un réseau ferroviaire continental reliant les économies membres de l'OCS, améliorant considérablement les flux commerciaux et la capacité de construction."
 start_joint_exercises_specific_desc: "Finalise un exercice bilatéral de l'OCS avec un membre ayant accepté l'offre. Les deux nations reçoivent l'idée d'exercice conjoint OCS spécifique pendant quatorze jours, et l'exercice se conclut par un gain d'opinion de coopération militaire mutuelle."
 chi_bri.1.a: "Commencer les travaux"
 chi_bri.1.d: "En septembre 2013, le président Xi Jinping s'est tenu devant un auditoire à Astana, au Kazakhstan, et a esquissé une vision audacieuse : une ceinture économique de la route de la soie liant la Chine à l'Europe, à l'Asie centrale et à l'Afrique. L'initiative serait connue comme les Nouvelles routes de la soie, le plus vaste programme d'infrastructures de l'histoire."
 chi_bri.1.t: "Une ceinture, une route"
 chi_bri.10.a: "Proposer des conditions concessionnelles"
 chi_bri.10.d: "Une demande formelle est arrivée de [FROM.GetName]. Leur délégation sollicite le financement et l'expertise chinois pour le §Y[FROM.GetBRIProjectName]§!. Pékin doit peser la valeur stratégique du partenariat contre les conditions financières et politiques qu'il est prêt à offrir."
 chi_bri.10.d_opt: "Refuser la demande"
 chi_bri.10.t: "[FROM.GetName] demande un projet des Nouvelles routes de la soie"
 chi_bri.103.a: "Accepter l'invitation"
 chi_bri.103.b: "Décliner l'offre"
 chi_bri.103.d: "Pékin a étendu une invitation formelle à devenir membre fondateur de la Banque asiatique d'investissement pour les infrastructures. L'adhésion s'accompagne de dividendes annuels des projets d'infrastructure du réseau des Nouvelles routes de la soie, mais lie nos fortunes financières aux initiatives dirigées par la Chine. Le ministère de l'Économie attend notre décision."
 chi_bri.103.t: "La Chine nous invite à rejoindre la BAII"
 chi_bri.104.a: "Accueillir le nouveau membre"
 chi_bri.104.d: "[From.GetName] a accepté notre invitation à rejoindre la Banque asiatique d'investissement pour les infrastructures comme membre fondateur. Sa participation renforce la légitimité de la banque et élargit sa portée."
 chi_bri.104.t: "[From.GetName] rejoint la BAII"
 chi_bri.105.a: "Prendre note de leur position"
 chi_bri.105.d: "[From.GetName] a décliné notre invitation à rejoindre la Banque asiatique d'investissement pour les infrastructures. Leur refus signale une préférence claire pour les institutions financières dirigées par l'Occident et complique nos ambitions régionales."
 chi_bri.105.t: "[From.GetName] refuse l'adhésion à la BAII"
 chi_bri.13.a: "Accorder un délai de grâce d'un an"
 chi_bri.13.b: "Refuser la prolongation"
 chi_bri.13.d: "[FROM.GetName] a pétitionné Pékin pour une pause d'un an sur les paiements de ses obligations en cours des Nouvelles routes de la soie, invoquant des contraintes budgétaires et des circonstances imprévues. Le principal resterait dû après le délai de grâce."
 chi_bri.13.t: "Demande de prolongation de prêt"
 chi_bri.131.a: "Accorder des droits d'escale contre un soutien économique"
 chi_bri.131.b: "Décliner la demande"
 chi_bri.131.d: "Pékin nous a approchés d'une proposition : accorder à la marine de l'Armée populaire de libération des privilèges d'accostage et de ravitaillement dans nos ports en échange d'une assistance économique substantielle. Le paquet relancerait nos exportations et notre production industrielle pour la décennie suivante, mais l'accepter attirerait le regard australien et américain."
 chi_bri.131.t: "La Chine demande des droits d'amarrage"
 chi_bri.132.a: "Réévaluer notre posture pacifique"
 chi_bri.132.d: "[From.GetName] a unilatéralement révoqué les privilèges d'accostage précédemment accordés à la marine de l'APL. Le refroidissement des relations et les inductions occidentales concurrentes ont érodé l'accord que nous avions tant peiné à obtenir."
 chi_bri.132.t: "Droits de base révoqués"
 chi_bri.133.a: "Accepter le pacte négocié"
 chi_bri.133.b: "Décliner l'arrangement"
 chi_bri.133.d: "Pékin se propose comme garant d'un arrangement de non-agression entre nous et notre rival régional. Si l'une des parties rompt la paix, la Chine s'engage à se ranger du côté de la partie lésée. L'offre pèse lourd vu le poids diplomatique croissant de Pékin."
 chi_bri.133.t: "La Chine propose de négocier un pacte de non-agression"
 chi_bri.134.a: "Honorer le pacte et déclarer la guerre"
 chi_bri.134.b: "Rester neutre et accepter le coût réputationnel"
 chi_bri.134.d: "La guerre a éclaté entre deux parties dont le pacte de non-agression que nous avons personnellement garanti. L'honneur et la crédibilité exigent que nous déclarions pour la victime, mais la guerre avec l'agresseur serait coûteuse. L'inaction sera retenue."
 chi_bri.134.t: "Notre pacte négocié a été rompu"
 chi_bri.135.a: "Coordonner avec nos partenaires chinois"
 chi_bri.135.d: "Pékin nous a notifié que, conformément à l'arrangement de non-agression qu'il a négocié, la République populaire entrera en guerre à nos côtés. Le poids diplomatique de l'intervention chinoise recadre le tableau stratégique."
 chi_bri.135.t: "La Chine honorera le pacte"
 chi_bri.15.a: "Port de Gwadar (Baloutchistan)"
 chi_bri.15.b: "Zone économique spéciale du Baloutchistan"
 chi_bri.15.c: "Corridor ferroviaire de Lahore (Pendjab)"
 chi_bri.15.d: "Pékin a approuvé un mégaprojet phare pour [FROM.GetName]. Contrairement aux ouvrages ordinaires des Nouvelles routes de la soie, cette entreprise sera gérée par la Chine et portera directement des intérêts stratégiques chinois. Le choix du site définira le but du projet pour des décennies."
 chi_bri.15.d_opt: "Port de Hambantota (Province du Sud)"
 chi_bri.15.e: "Ville portuaire de Colombo (Province de l'Ouest)"
 chi_bri.15.f: "Terminal SGR Mombasa-Nairobi"
 chi_bri.15.g: "Installation stratégique côtière"
 chi_bri.15.t: "Méga-projet : où construire ?"
 chi_bri.20.a: "Accepter les termes du bail"
 chi_bri.20.b: "Refuser de céder le port"
 chi_bri.20.d: "Incapable d'honorer les dettes accumulées pendant la construction, le gouvernement du Sri Lanka fait face à un choix brutal. China Merchants Port Holdings a proposé un bail de 99 ans sur le port d'Hambantota en échange d'un allègement de dette. Les critiques y voient une diplomatie du piège de la dette ; les partisans, un art de gouverner pragmatique."
 chi_bri.20.t: "Hambantota : le bail de 99 ans"
 chi_bri.21.a: "Accorder à la Chine un accès naval"
 chi_bri.21.b: "Refuser poliment"
 chi_bri.21.d: "Le corridor économique Chine-Pakistan étant pleinement opérationnel, la marine de l'APL a approché Islamabad d'une demande discrète mais significative : le droit d'utiliser Gwadar comme point logistique et de ravitaillement. La décision transformerait le CPEC d'un corridor économique en une tête de pont stratégique."
 chi_bri.21.t: "Gwadar : une demande d'installations navales"
 chi_bri.22.a: "Accorder des droits de base à la Chine"
 chi_bri.22.b: "Rejeter la proposition"
 chi_bri.22.d: "Djibouti accueille des installations militaires étrangères depuis des décennies, mais la proposition de Pékin est d'un autre caractère. L'installation prévue à Doraleh serait la première base permanente outre-mer de l'Armée populaire de libération, un jalon que les stratèges occidentaux redoutent depuis longtemps et que les planificateurs chinois poursuivent depuis longtemps."
 chi_bri.22.t: "Doraleh : la première base chinoise à l'étranger"
 chi_bri.30.a: "Répondre fermement par des sanctions"
 chi_bri.30.b: "Surveiller la situation pour l'instant"
 chi_bri.30.d: "L'annonce chinoise de contrats à terme pétroliers libellés en yuan a envoyé des ondes de choc à Washington. Si la tarification en pétroyuan gagne du terrain parmi les membres de l'OPEP et les partenaires des Nouvelles routes de la soie, le statut de monnaie de réserve du dollar affronte son défi le plus sérieux depuis des générations. Le Congrès exige une réponse."
 chi_bri.30.t: "Le Petroyuan de Pékin menace l'hégémonie du dollar"
 chi_bri.40.a: "Annoncer une initiative audacieuse"
 chi_bri.40.b: "Signer une vague de nouveaux engagements"
 chi_bri.40.c: "Mener par la réforme et la transparence"
 chi_bri.40.d: "Chefs de gouvernement et ministres des Finances d'Asie, d'Afrique et d'Europe ont convergé sur Pékin pour le Forum triennal des Nouvelles routes de la soie. Le rassemblement est à la fois sommet, foire commerciale et théâtre géopolitique. Les choix de la Chine cette semaine fixeront le ton de la phase suivante de l'initiative."
 chi_bri.40.t: "Le Forum des Nouvelles routes de la soie s'ouvre à Pékin"
 chi_bri.42.a: "Adoptez un ton affirmé et souverain"
 chi_bri.42.b: "Souligner la coopération et le gain mutuel"
 chi_bri.42.d: "Des journalistes du monde entier se sont rassemblés pour la conférence de presse de clôture du forum. Le cadrage que la Chine choisit maintenant dominera la couverture internationale et fixera les attentes des trois prochaines années de diplomatie des Nouvelles routes de la soie."
 chi_bri.42.t: "Conférence de presse du Forum"
 chi_bri.43.a: "Publier les résultats"
 chi_bri.43.d: "Les délégations sont parties et les bannières ont été baissées. Diplomates et économistes dressent le bilan : accords signés, engagements pris, influence accumulée. Le Forum des Nouvelles routes de la soie a une fois de plus recadré les perceptions du rôle mondial de la Chine."
 chi_bri.43.t: "Forum des Nouvelles routes de la soie : bilan final"
 chi_bri.50.a: "Proclamer une nouvelle ère de leadership chinois"
 chi_bri.50.d: "Le réseau chinois des Nouvelles routes de la soie s'étend désormais sur tous les continents habités. La toile d'infrastructures, de dettes et d'obligations diplomatiques que Pékin a tissée pendant des décennies s'est cristallisée en quelque chose d'inédit : un ordre international façonné à l'image des intérêts chinois. Les historiens débattront s'il faut l'appeler hégémonie ou partenariat. Le monde l'appellera simplement un fait."
 chi_bri.50.t: "Création de la Pax Sinica"
 chi_bri.70.a: "Annoncer l'ère du partenariat afro-chinois"
 chi_bri.70.d: "L'effet cumulé de plus d'une décennie de sommets du Forum sur la coopération sino-africaine, de projets des Nouvelles routes de la soie et de diplomatie d'allègement de dette a produit un basculement décisif. Sur le continent, des gouvernements qui jadis hésitaient entre Pékin et Washington se consolident autour de la Chine comme partenaire principal. Une génération de dirigeants africains a grandi avec les infrastructures, le crédit et les conseillers chinois."
 chi_bri.70.t: "L'Afrique embrasse le siècle chinois"
 chi_bri.71.a: "Répartir les équipes projet"
 chi_bri.71.d: "Pour cimenter la nouvelle ère, Pékin a budgété le financement d'une série de mégaprojets phares à travers son réseau de partenaires africains. Ce ne seront pas des subventions d'infrastructure ordinaires ; ce seront des développements ancrés par la Chine, portant des droits stratégiques à long terme et des clauses d'accès préférentiel."
 chi_bri.71.t: "Projets phares pour l'Afrique"
 chi_bri.80.a: "Annoncer une annulation de dette"
 chi_bri.80.b: "Verrouiller des clauses de garantie"
 chi_bri.80.d: "Le Forum sur la coopération sino-africaine a convoqué sa dernière plénière à Pékin. Ministres des Finances, chefs d'État et responsables de banques de développement se sont rassemblés pour examiner l'état des liens sino-africains et tracer la voie. L'annonce d'ouverture du sommet définira si ce rassemblement sera retenu pour sa générosité ou pour son levier."
 chi_bri.80.t: "Le Sommet du FOCAC se réunit"
 chi_bri.81.a: "Durcir les sanctions contre Caracas"
 chi_bri.81.b: "Émettre des protestations diplomatiques"
 chi_bri.81.c: "Prendre note et passer à autre chose"
 chi_bri.81.d: "La Chine a formalisé un successeur à l'arrangement Petrocaribe, étendant des prêts contre pétrole au Venezuela et à ses voisins. Washington doit désormais choisir entre signaler son mécontentement et risquer une aliénation latino-américaine accrue, ou absorber le développement en silence."
 chi_bri.81.t: "La Chine s'installe à Caracas"
 chi_bri.82.a: "Remettre la dette"
 chi_bri.82.b: "Convertir les arriérés en concessions"
 chi_bri.82.c: "Laisser le défaut s'appliquer"
 chi_bri.82.d: "Les recettes pétrolières du Venezuela se sont effondrées et le service de la dette dû aux banques d'État chinoises est gravement en retard. Pékin doit décider s'il absorbe la perte en goodwill, extrait des garanties, ou laisse le défaut s'appliquer comme avertissement aux autres emprunteurs."
 chi_bri.82.t: "Caracas ne peut pas payer"
 chi_bri.83.a: "Protester et demander le retrait"
 chi_bri.83.b: "Lancer un contre-programme"
 chi_bri.83.c: "Accepter la nouvelle baseline"
 chi_bri.83.d: "La Chine a achevé un réseau de stations terrestres de navigation et de suivi Beidou en Argentine et en Bolivie, étendant fortement la couverture de la constellation sur l'hémisphère sud. Le US Space Command et le Southern Command ont signalé les installations comme à double usage. Washington doit décider comment répondre."
 chi_bri.83.t: "Stations de suivi Beidou en Patagonie"
 chi_bri.84.a: "Sécuriser les quatre commutateurs"
 chi_bri.84.b: "Sécuriser trois partenaires fiables"
 chi_bri.84.d: "L'achèvement de la stratégie de doctrine Monroe inversée a créé les conditions d'une cascade de basculements de reconnaissance diplomatique. Plusieurs États latino-américains restants qui reconnaissent encore formellement Taipei sont désormais à portée d'un changement discret facilité par la Chine."
 chi_bri.84.t: "Taïwan perd ses derniers alliés"
 chi_bri.85.a: "Consolider le réalignement régional"
 chi_bri.85.b: "Empocher le capital politique"
 chi_bri.85.d: "L'influence chinoise étant désormais enchâssée dans les institutions latino-américaines, l'Organisation des États américains a été systématiquement vidée comme lieu de gouvernance régionale dirigée par les États-Unis. La CELAC a émergé comme forum multilatéral privilégié. Les répercussions se font sentir de Washington à Buenos Aires."
 chi_bri.85.t: "L'OEA perd son mandat"
 chi_bri.86.a: "Coordonner un régime de sanctions plus strict"
 chi_bri.86.b: "Enregistrer les préoccupations via les canaux"
 chi_bri.86.d: "La ratification par la Chine d'un partenariat global de 25 ans avec Téhéran a envoyé des ondes de choc à travers l'architecture de sécurité du Moyen-Orient. Responsables américains, planificateurs de défense israéliens et États du Golfe évaluent chacun les conséquences et envisagent leur réponse."
 chi_bri.86.t: "Alarme à Washington, Tel-Aviv et Riyad"
 chi_bri.87.a: "Publiciser le succès à l'échelle mondiale"
 chi_bri.87.b: "Consolider en interne"
 chi_bri.87.d: "Le communiqué de Pékin formalisant la réconciliation saoudo-iranienne a été reçu dans la communauté internationale. Le rôle de la Chine comme médiatrice entre deux adversaires historiques représente une démonstration significative de portée diplomatique que peu prédisaient il y a une décennie."
 chi_bri.87.t: "Pékin s'attribue le mérite"
 chi_bri.88.a: "Annoncer le nouveau cadre de règlement"
 chi_bri.88.d: "Les États du Golfe ont commencé à régler une partie de leurs transactions pétrolières en renminbi, achevant l'architecture financière que la Chine a assemblée au cours de la décennie précédente. L'érosion de l'hégémonie du dollar sur les marchés énergétiques est graduelle mais désormais structurellement enchâssée."
 chi_bri.88.t: "Le pétrodollar se fracture"
 chi_bri.89.a: "Sécuriser les basculements centraux"
 chi_bri.89.b: "Pousser au balayage complet"
 chi_bri.89.d: "La stratégie chinoise au Forum des îles du Pacifique a mûri au point que des basculements de reconnaissance diplomatique sont réalisables. Les Îles Salomon et Kiribati sont les cibles les plus accessibles, Tuvalu et Palaos étant à portée si Pékin est prêt à investir davantage."
 chi_bri.89.t: "Pivot des reconnaissances des îles du Pacifique"
 chi_bri.90.a: "Condamner le pacte et coordonner une réponse"
 chi_bri.90.b: "Enregistrer une préoccupation et surveiller"
 chi_bri.90.d: "Le pacte de sécurité de Honiara a déclenché une session d'urgence des consultations ministérielles Australie-États-Unis. Canberra, Washington et Wellington coordonnent une réponse à ce qu'ils décrivent comme une menace directe à la souveraineté pacifique et à la stabilité régionale."
 chi_bri.90.t: "Canberra exige des réponses"
 chi_bri.91.a: "Déclarer un rôle de leader de la sécurité dans le Pacifique"
 chi_bri.91.b: "Reconnaître le revers diplomatique"
 chi_bri.91.d: "Les résultats de l'initiative pacifique des huit pays sont connus. Le bilan d'engagement de la Chine parmi les États insulaires du Pacifique déterminera si Pékin peut revendiquer un rôle de leadership en sécurité ou doit absorber un revers réputationnel."
 chi_bri.91.t: "Le rapport de l'initiative des huit pays"
 chi_bri.92.a: "Accélérer la réponse alliée"
 chi_bri.92.b: "Envisagez des options évolutives"
 chi_bri.92.c: "Recalibrer et observer"
 chi_bri.92.d: "L'acquisition par la Chine d'un accès de basage aux Îles Salomon a étendu la portée de la marine de l'APL jusqu'au bord de la deuxième chaîne d'îles. Le commandement indo-pacifique américain et les forces de défense australiennes évaluent les implications stratégiques et déterminent leur réponse."
 chi_bri.92.t: "Pékin atteint la deuxième chaîne d'îles"
 chi_bri.93.a: "Exprimer une ferme désapprobation"
 chi_bri.93.b: "Reconnaître le développement"
 chi_bri.93.d: "L'Italie est devenue le premier État du G7 à signer un mémorandum d'entente des Nouvelles routes de la soie, créant un précédent que les partenaires restants du G7 voient avec des degrés variables d'alarme et d'opportunité. Chaque capitale doit désormais déterminer sa propre posture face à l'investissement chinois en infrastructures."
 chi_bri.93.t: "Rome signe avec Pékin"
 chi_bri.94.a: "Resserrer les partenaires centraux"
 chi_bri.94.b: "Tenir le cadre par l'investissement"
 chi_bri.94.d: "Le retrait de la Lituanie du mécanisme 17+1 a exposé une ligne de faille entre les membres baltes et nordiques d'un côté et le noyau Balkans-Visegrád de l'autre. La Chine doit choisir de consolider une coalition plus petite et plus fiable ou de dépenser pour tenir ensemble le cadre plus large."
 chi_bri.94.t: "Le 17+1 arrive à une fourche"
 chi_bri.96.a: "Le siècle de la Chine commence."
 chi_bri.96.b: "Reconnaître la nouvelle réalité."
 chi_bri.96.c: "Prendre note de l'ordre émergent."
 chi_bri.96.d: "L'ordre mondial consensuel que la Chine a bâti par l'Initiative pour le développement mondial, la Banque asiatique d'investissement pour les infrastructures et une coopération de qualité des Nouvelles routes de la soie n'est plus une vision -- c'est l'architecture opérante du système international. L'adhésion aux BRICS+ couvre la majorité de la population mondiale. Le discours de Davos de 2017 se lit désormais comme une prophétie."
 chi_bri.96.t: "Une communauté de destin partagé"
 CHI_foreign.012.a: "Nous surveillerons avec attention."
 CHI_foreign.012.d: "Des responsables chinois ont discrètement suggéré que Washington reconsidère son approche de la question coréenne, laissant entendre qu'une initiative diplomatique pourrait suivre. Le signal pourrait être une ouverture ou une feinte."
 CHI_foreign.012.t: "Un signal de Pékin"
 CHI_foreign.014.a: "Examiner le projet."
 CHI_foreign.014.d: "Les bases d'une déclaration conjointe sur l'avenir de la péninsule coréenne sont en place. Pékin a déposé un projet de cadre pour examen."
 CHI_foreign.014.t: "Cadre de déclaration conjointe"
 CHI_foreign.024.a: "Nous pesons nos options avec soin."
 CHI_foreign.024.d: "La Chine a signalé son acceptation d'un règlement de la question coréenne centré sur Séoul — un basculement historique de la position de Pékin auquel Pyongyang doit désormais faire face."
 CHI_foreign.024.t: "Pékin soutient Séoul"
 CHI_foreign.030.a: "Cela représente une politisation inacceptable des relations commerciales."
 CHI_foreign.030.b: "La pression est regrettable mais soutenable. Nous tenons bon."
 CHI_foreign.030.d: "La réponse de Pékin au déploiement sud-coréen du THAAD est passée de la protestation diplomatique à la coercition économique. Les autorités chinoises dirigent des restrictions sur les entreprises coréennes, les produits de divertissement et le tourisme, une campagne calibrée pour imposer des coûts sans déclencher un régime de sanctions formel."
 CHI_foreign.030.t: "Les représailles THAAD"
 CHI_foreign.031.a: "Prendre acte du signal. Maintenir la posture actuelle."
 CHI_foreign.031.b: "Les assurances chinoises ne sont pas crédibles. Renforcer notre engagement coréen."
 CHI_foreign.031.d: "La Chine a signalé par des canaux militaires que les exercices du Yalou sont de nature défensive. Le message de Pékin est clair : la Chine gérera le comportement de la Corée du Nord et n'a pas besoin d'une escalade américaine pour maintenir la stabilité régionale."
 CHI_foreign.031.t: "Pékin fait preuve de retenue"
 CHI_foreign.032.a: "Alerter notre garnison coréenne. Demander des consultations urgentes avec Séoul."
 CHI_foreign.032.b: "Surveiller la situation. Éviter les réponses provocatrices."
 CHI_foreign.032.d: "L'imagerie satellite confirme une réorganisation significative des forces terrestres nord-coréennes vers des dispositions offensives le long du 38e parallèle. Des convois logistiques chinois soutiennent le repositionnement. L'Armée populaire de Corée semble se préparer à quelque chose au-delà d'exercices de routine."
 CHI_foreign.032.t: "Montée en puissance au Yalou"
 CHI_foreign.033.a: "Lancer la planification d'urgence. Consulter Washington."
 CHI_foreign.033.b: "Les contraintes constitutionnelles sont absolues. Passer uniquement par les voies diplomatiques."
 CHI_foreign.033.d: "La montée en puissance nord-coréenne le long du 38e parallèle a relancé le débat à la Diète japonaise sur l'article 9 et les limites constitutionnelles de la posture d'autodéfense du Japon. Les faucons de la défense pressent une réinterprétation d'urgence des engagements de légitime défense collective."
 CHI_foreign.033.t: "Article 9 en débat"
 CHI_foreign.034.a: "Activer nos engagements de défense mutuelle avec la Corée du Sud."
 CHI_foreign.034.b: "Convoquer une session d'urgence du Conseil de sécurité."
 CHI_foreign.034.d: "Les forces nord-coréennes, avec un soutien logistique et matériel chinois, ont franchi la zone démilitarisée. La Chine n'est pas formellement entrée dans le conflit, mais ses empreintes sont sur chaque aspect de la machine de guerre nord-coréenne."
 CHI_foreign.034.t: "Guerre sur la péninsule"
 CHI_foreign.035.a: "Passer en alerte maximale. Préparer des forces de réserve."
 CHI_foreign.035.b: "Ne rien faire tant que la situation ne s'éclaircit pas."
 CHI_foreign.035.d: "Des rapports non confirmés de coups de feu et de mouvements militaires dans le périmètre de sécurité de Pyongyang suggèrent que quelque chose d'extraordinaire se produit dans la capitale nord-coréenne. Les médias d'État chinois se taisent. La situation est dangereusement floue."
 CHI_foreign.035.t: "Le chaos à Pyongyang"
 CHI_foreign.036.a: "Publier une déclaration officielle condamnant l'ingérence dans la souveraineté nord-coréenne."
 CHI_foreign.036.b: "Ouvrir un contact discret avec le conseil de transition."
 CHI_foreign.036.d: "Des officiers soutenus par la Chine ont fomenté un coup d'État contre Kim Jong-un. La famille Kim a été écartée du pouvoir. Un conseil de transition se forme à Pyongyang sous des figures connues comme interlocuteurs de Pékin. La Chine semble accoucher d'une succession gérée."
 CHI_foreign.036.t: "Le coup de Pyongyang"
 CHI_foreign.037.a: "Exprimer son inquiétude à Pékin par les canaux diplomatiques."
 CHI_foreign.037.b: "Attendre et observer. La situation est trop fluide pour des déclarations fortes."
 CHI_foreign.037.d: "Le coup d'État en Corée du Nord apporte à la fois opportunité et danger pour le Japon. Un gouvernement de transition aligné sur la Chine à Pyongyang peut être plus prévisible que Kim Jong-un, mais un État client chinois sur la péninsule coréenne représente un défi stratégique majeur pour Tokyo."
 CHI_foreign.037.t: "Un nouveau Pyongyang"
 CHI_foreign.038.a: "Protester formellement contre la restructuration unilatérale de la gouvernance nord-coréenne."
 CHI_foreign.038.b: "Accepter la nouvelle réalité. Chercher un accommodement avec la politique coréenne de Pékin."
 CHI_foreign.038.d: "La Chine a annoncé les termes du règlement politique post-coup à Pyongyang. Le nouveau gouvernement nord-coréen est constitutionnellement restructuré, économiquement intégré aux chaînes d'approvisionnement chinoises et stratégiquement subordonné à la politique coréenne de Pékin."
 CHI_foreign.038.t: "Le règlement de Pékin"
 CHI_foreign.040.a: "Ce réalignement est inacceptable. Signaler des conséquences à Séoul."
 CHI_foreign.040.b: "Accepter la dérive. L'alliance ne peut être maintenue par la contrainte."
 CHI_foreign.040.d: "L'adoption par la Corée du Sud d'une doctrine d'autonomie stratégique et sa décision d'engager la Chine comme partenaire de sécurité principal représentent un réalignement profond de l'équilibre indo-pacifique. L'alliance États-Unis-Corée, soutenue depuis 1953, affronte sa tension la plus grave depuis des décennies."
 CHI_foreign.040.t: "Dérives de Séoul"
 CHI_foreign.041.a: "Exprimer un intérêt prudent pour la configuration changeante."
 CHI_foreign.041.b: "Rejeter le cadrage. La Chine n'abandonne pas la Corée du Nord."
 CHI_foreign.041.d: "Le pivot sud-coréen vers Pékin a forcé Pyongyang à un calcul inconfortable. Un partenariat Chine-Séoul qui exclut la Corée du Nord est stratégiquement plus menaçant que la présence américaine au sud."
 CHI_foreign.041.t: "Quelle Chine ?"
 CHI_foreign.042.a: "Entamer des consultations urgentes avec Washington sur des mesures compensatoires."
 CHI_foreign.042.b: "Évaluer si des arrangements de sécurité bilatéraux Japon-Corée sont réalisables."
 CHI_foreign.042.d: "Le retrait sud-coréen du cadre de sécurité trilatéral États-Unis-Japon-Corée laisse le Japon isolé au sein de ce qui reste de l'architecture indo-pacifique. Sans la participation de Séoul, les relations de sécurité du Japon avec Washington manquent d'un pilier critique."
 CHI_foreign.042.t: "Tokyo seul"
 CHI_foreign.043.a: "Rassurer nos partenaires philippins de notre engagement."
 CHI_foreign.043.b: "Entamer une revue stratégique des engagements en Indo-Pacifique."
 CHI_foreign.043.d: "Le retrait sud-coréen du cadre de sécurité trilatéral a déclenché à Manille une anxiété sur la durabilité des engagements de sécurité américains à travers l'Indo-Pacifique. Les responsables philippins ont commencé une réévaluation discrète de leur propre posture d'alliance."
 CHI_foreign.043.t: "Le cadre s'effiloche"
 CHI_foreign.044.a: "Accepter le revers stratégique. Recalibrer autour des partenaires restants."
 CHI_foreign.044.d: "La sortie sud-coréenne du cadre trilatéral démantèle de fait l'architecture indo-pacifique que Washington a passé une décennie à bâtir. La Chine a obtenu par une diplomatie patiente ce qu'elle n'aurait jamais pu obtenir par la confrontation."
 CHI_foreign.044.t: "La stratégie indo-pacifique s'effondre"
 CHI_foreign.045.a: "Accepter la demande. Entamer un redéploiement ordonné."
 CHI_foreign.045.b: "Refuser. Les forces américaines restent sur la péninsule à la discrétion de Washington."
 CHI_foreign.045.d: "L'endossement formel par la Corée du Sud des garanties de sécurité chinoises a rendu politiquement intenable la présence continue des forces terrestres américaines sur la péninsule. Séoul a demandé un calendrier de redéploiement militaire américain hors du territoire coréen."
 CHI_foreign.045.t: "Les troupes rentrent à la maison"
 CHI_foreign.046.a: "Entamer des consultations d'urgence avec Washington sur la posture de sécurité du Japon."
 CHI_foreign.046.b: "Accélérer le développement des capacités de défense nationales."
 CHI_foreign.046.d: "Le redéploiement américain hors de Corée rend l'alliance de sécurité États-Unis-Japon stratégiquement incomplète. Le flanc sud du Japon est exposé, et les hypothèses sous-tendant la planification de défense japonaise depuis sept décennies exigent une révision fondamentale."
 CHI_foreign.046.t: "L'alliance creuse"
 CHI_foreign.047.a: "Accepter la garantie. L'avenir de la Corée ne peut dépendre de patrons lointains."
 CHI_foreign.047.b: "Rejeter l'offre. La souveraineté coréenne ne peut être échangée contre le patronage chinois."
 CHI_foreign.047.d: "La Chine a offert à la Corée du Sud une garantie de sécurité formelle sous-tendant tout règlement futur de réunification. La garantie de Pékin engage la Chine à défendre la souveraineté d'une Corée unifiée, en échange d'arrangements stratégiques qui transforment de fait la Corée en un État aligné sur la Chine."
 CHI_foreign.047.t: "La garantie de Pékin"
 CHI_foreign.048.a: "S'engager dans le cadre de Pékin. La survie exige le réalisme."
 CHI_foreign.048.b: "Rejeter le cadre. Nous ne serons pas absorbés."
 CHI_foreign.048.d: "L'offre chinoise d'une garantie de sécurité pour une Corée unifiée a forcé un moment de clarté à Pyongyang. La direction nord-coréenne doit choisir entre résistance et accommodement, sachant que la résistance sans appui chinois est insoutenable."
 CHI_foreign.048.t: "La garantie et le Nord"
 CHI_foreign.049.a: "Émettre une déclaration formelle sur le processus et ses implications."
 CHI_foreign.049.b: "Prendre acte du résultat. Adapter notre stratégie indo-pacifique en conséquence."
 CHI_foreign.049.d: "Le processus de réunification coréenne se déroule sous les auspices chinois et selon les termes chinois. Soixante-dix ans de présence militaire et d'investissement diplomatique américains dans la sécurité de la Corée ont produit une Corée unifiée alignée sur Pékin."
 CHI_foreign.049.t: "Une réunification que nous n'avons pas faite"
 CHI_foreign.050.a: "Noté."
 CHI_foreign.050.d: "Des groupes aéronavals américains se sont repositionnés vers le détroit de Corée en réponse aux tensions croissantes. Pékin surveille le mouvement."
 CHI_foreign.050.t: "Les transporteurs se dirigent vers le détroit de Corée"
 CHI_foreign.051.a: "Une situation difficile."
 CHI_foreign.051.d: "Les tensions sur la péninsule coréenne ont atteint un seuil critique. Washington, Tokyo et Séoul sont entrés en postures de préparation élevées."
 CHI_foreign.051.t: "Alerte de crise régionale"
 CHI_foreign.052.a: "Se retirer. Le prix est trop élevé."
 CHI_foreign.052.b: "Maintenir la pression."
 CHI_foreign.052.d: "Les tensions sur la péninsule coréenne ont atteint leur apogée. Pékin doit décider s'il recule, tient le cap, ou pousse à un dénouement décisif."
 CHI_foreign.052.t: "La péninsule au bord du gouffre"
 CHI_foreign.053.a: "Une évolution bienvenue."
 CHI_foreign.053.d: "L'atmosphère de crise sur la péninsule coréenne s'est dissipée. Les puissances régionales saluent le retour à la stabilité."
 CHI_foreign.053.t: "Détente dans la péninsule coréenne"
 CHI_foreign.054.a: "L'acquisition sert nos intérêts économiques."
 CHI_foreign.054.b: "Le pétrole du Kazakhstan doit rester sous contrôle national."
 CHI_foreign.054.d: "La China National Petroleum Corporation a déposé une offre formelle d'acquérir PetroKazakhstan pour 4,18 milliards de dollars. L'accord transférerait le contrôle opérationnel du plus grand producteur pétrolier indépendant du Kazakhstan aux mains chinoises en échange d'un paiement substantiel aux caisses de l'État."
 CHI_foreign.054.t: "Proposition d'acquisition de CNPC"
 CHI_foreign.056.a: "Nous respectons leur décision."
 CHI_foreign.056.d: "Astana a décliné l'offre de la CNPC pour PetroKazakhstan, invoquant des préoccupations de souveraineté sur les ressources nationales."
 CHI_foreign.056.t: "Le Kazakhstan rejette l'offre d'acquisition de CNPC"
 CHI_foreign.057.a: "L'acquisition est dans l'intérêt économique de l'Angola."
 CHI_foreign.057.b: "Nos ressources énergétiques ne sont pas à vendre."
 CHI_foreign.057.d: "Sinopec a soumis une offre de 7,2 milliards de dollars pour acquérir Addax Petroleum, obtenant l'accès à des licences de production pétrolière en Angola, au Nigeria et dans la région du Kurdistan. L'accord représenterait la plus grande acquisition à l'étranger de Sinopec à ce jour."
 CHI_foreign.057.t: "Proposition d'acquisition de Sinopec"
 CHI_foreign.058.a: "Sinopec s'implante un peu plus dans la production pétrolière africaine."
 CHI_foreign.058.d: "Luanda a accepté l'offre de Sinopec pour Addax Petroleum. Des ingénieurs chinois prendront le contrôle opérationnel des blocs pétroliers offshore, une part des recettes étant dirigée vers les infrastructures angolaises."
 CHI_foreign.058.t: "L'Angola approuve l'acquisition de Sinopec"
 CHI_foreign.059.a: "Nous respectons leur décision."
 CHI_foreign.059.d: "Luanda a décliné l'offre de Sinopec d'acquérir Addax Petroleum."
 CHI_foreign.059.t: "L'Angola rejette l'offre d'acquisition de Sinopec"
 CHI_foreign.060.a: "L'expertise et le capital chinois sont les bienvenus."
 CHI_foreign.060.b: "La richesse pétrolière du Venezuela n'est pas destinée aux concessions étrangères."
 CHI_foreign.060.d: "CNOOC a proposé une coentreprise à long terme pour développer la ceinture de brut lourd de l'Orénoque aux côtés de Petróleos de Venezuela. La Chine fournirait le capital initial et l'expertise technique d'extraction de pétrole lourd en échange d'une part des droits de production."
 CHI_foreign.060.t: "Proposition de coentreprise CNOOC"
 CHI_foreign.061.a: "CNOOC s'assure une tête de pont dans les plus grandes réserves pétrolières de l'hémisphère occidental."
 CHI_foreign.061.d: "Caracas a accepté la proposition de coentreprise de CNOOC pour la ceinture de l'Orénoque. Les droits de production le long des blocs Junín sont désormais partagés, apportant la technologie d'extraction chinoise aux plus grandes réserves pétrolières prouvées du monde."
 CHI_foreign.061.t: "Le Venezuela approuve la coentreprise CNOOC"
 CHI_foreign.062.a: "Nous respectons leur décision."
 CHI_foreign.062.d: "Caracas a décliné la proposition de coentreprise de CNOOC pour la ceinture de l'Orénoque."
 CHI_foreign.062.t: "Le Venezuela rejette la coentreprise de CNOOC"
 CHI_foreign.063.a: "Une acquisition stratégique pour notre sécurité énergétique."
 CHI_foreign.063.d: "Astana a accepté l'offre de la CNPC pour PetroKazakhstan. Des champs pétroliers opérés par la Chine augmenteront la production des champs de Kumkol et North Buzachi, sécurisant un approvisionnement régulier de brut kazakh pour les raffineries chinoises."
 CHI_foreign.063.t: "Le Kazakhstan approuve l'acquisition de CNPC"
 CHI_foreign.100.a: "Se préparer à une pression soutenue. Consulter nos alliés."
 CHI_foreign.100.d: "La Chine a lancé une campagne de pression coordonnée contre la Corée du Sud, appliquant des signaux diplomatiques, économiques et militaires conçus pour écarter le calcul de sécurité de Séoul de Washington."
 CHI_foreign.100.t: "Campagne de pression de Pékin"
 CHI_foreign.101.a: "Documenter les mesures et préparer une réponse proportionnée."
 CHI_foreign.101.d: "Pékin a étendu ses représailles THAAD en un régime plus large de restrictions économiques informelles. Les entreprises coréennes opérant en Chine rapportent une obstruction systématique sur les licences, les douanes et les canaux réglementaires."
 CHI_foreign.101.t: "Sanctions informelles imposées"
 CHI_foreign.102.a: "S'engager avec prudence. Garder le canal ouvert."
 CHI_foreign.102.d: "Diplomates chinois et américains ont établi un canal de travail discret sur les questions de la péninsule coréenne. L'arrangement permet aux deux parties de gérer les risques d'escalade sans s'engager publiquement dans un cadre de négociation formel."
 CHI_foreign.102.t: "Un canal arrière s'ouvre"
 CHI_foreign.103.a: "S'engager dans le nouveau cadre. Surveiller ses implications."
 CHI_foreign.103.d: "Pékin et Séoul ont convenu d'une relance diplomatique structurée, rétablissant les contacts de haut niveau et ouvrant un cadre trilatéral pour les discussions sur la péninsule. L'arrangement représente un départ significatif de l'alignement antérieur de la Corée du Sud avec Washington."
 CHI_foreign.103.t: "La relance de 2022"
 CHI_foreign.104.a: "Accepter le cadre. Définir notre rôle en son sein."
 CHI_foreign.104.d: "La Chine et les États-Unis se sont accordés sur les contours d'une architecture de sécurité post-armistice pour la péninsule coréenne. Le cadre G2 assigne aux deux puissances une co-responsabilité de la stabilité de la péninsule, marginalisant les autres acteurs."
 CHI_foreign.104.t: "Une architecture post-armistice"
 CHI_foreign.105.a: "Étudier la proposition. Consulter l'industrie et les conseillers de sécurité."
 CHI_foreign.105.d: "La Chine a proposé une plateforme d'intégration économique liant l'industrie sud-coréenne à un processus de réunification géré. L'arrangement crée de profondes incitations structurelles pour que Séoul aligne sa politique de réunification sur le dénouement préféré de Pékin."
 CHI_foreign.105.t: "Cadre économique pour l'unité"
 CHI_foreign.106.a: "Prendre acte de la nouvelle doctrine. Préparer notre réponse stratégique."
 CHI_foreign.106.d: "L'adoption formelle par la Corée du Sud d'une doctrine d'autonomie stratégique signale un pivot décisif hors du cadre d'alliance États-Unis-Corée. Séoul se positionne entre Washington et Pékin plutôt que dans l'orbite de sécurité américaine."
 CHI_foreign.106.t: "Le pivot inversé"
 CHI_foreign.107.a: "Transmettre l'ultimatum à Pyongyang."
 CHI_foreign.107.b: "Refuser. La réunification doit se faire selon nos seuls termes."
 CHI_foreign.107.d: "[CHI.GetLeader] et [USA.GetLeader] sont parvenus à un accord rare. Ils exigeront conjointement que [NKO.GetName] accepte une réunification pacifique sous Séoul. L'alternative est la guerre. [KOR.GetName] doit décider s'il transmet l'ultimatum à Pyongyang."
 CHI_foreign.107.t: "Un ultimatum conjoint pour le Nord"
 CHI_foreign.108.a: "Accepter. La partie est finie."
 CHI_foreign.108.b: "Refuser. Nous ne céderons pas notre souveraineté."
 CHI_foreign.108.d: "Un communiqué conjoint sino-américain est arrivé à Pyongyang. Il exige la dissolution immédiate et pacifique de l'État de [NKO.GetName] et la réunification de la péninsule sous le gouvernement de Séoul. Le refus signifie la guerre avec la Chine, les États-Unis et la Corée du Sud simultanément."
 CHI_foreign.108.t: "Pékin et Washington exigent l'unification"
 CHI_foreign.109.a: "Une nouvelle ère se lève en Asie de l'Est."
 CHI_foreign.109.d: "La Corée du Nord a accepté l'ultimatum. Le régime Kim a convenu de dissoudre l'État et de transférer l'autorité à Séoul. La péninsule coréenne est unifiée sans un coup de feu, un triomphe diplomatique à l'échelle historique."
 CHI_foreign.109.t: "Pyongyang accepte"
 CHI_foreign.110.a: "Alors nous allons à la guerre."
 CHI_foreign.110.d: "La Corée du Nord a rejeté l'ultimatum. La réponse de Pyongyang a été livrée par des tirs d'artillerie à travers la DMZ. Il ne reste plus de voie diplomatique : seulement la guerre, et la libération de la péninsule par la force."
 CHI_foreign.110.t: "Pyongyang refuse"
 CHI_foreign.200.a: "Forcer l'issue."
 CHI_foreign.200.b: "Sonder et se retirer."
 CHI_foreign.200.c: "Exigez une médiation de l’ONU."
 CHI_foreign.200.d: "Nos navires de garde-côtes et les Forces maritimes d'autodéfense japonaises sont séparés de moins de deux milles nautiques en mer de Chine orientale. Le prochain mouvement est le nôtre. Chaque option a des conséquences."
 CHI_foreign.200.t: "Les flottes sont à la ligne"
 CHI_foreign.201.a: "Tenir bon. Ordonner aux FAD maritimes de tenir la ligne."
 CHI_foreign.201.b: "Demandez l’intervention immédiate des États-Unis."
 CHI_foreign.201.c: "Reculer et chercher une solution diplomatique."
 CHI_foreign.201.d: "Des navires chinois tiennent position à la limite contestée. Tokyo doit décider jusqu'où riposter."
 CHI_foreign.201.t: "La Chine presse la ligne Senkaku"
 CHI_foreign.202.a: "Honorer la garantie. Signaler un soutien militaire au Japon."
 CHI_foreign.202.b: "Temporiser. Exprimer notre préoccupation sans engager de forces."
 CHI_foreign.202.d: "Le Japon a invoqué ses obligations d'alliance. Des navires chinois pressent la limite des Senkaku et Tokyo demande à Washington de tenir ses engagements. La décision a un coût dans les deux cas."
 CHI_foreign.202.t: "Honorerez-vous la garantie ?"
 CHI_foreign.203.a: "Prenez note."
 CHI_foreign.203.b: "Un accrochage à notre porte. Le surveiller de près."
 CHI_foreign.203.c: "Une querelle lointaine. En prendre note et passer."
 CHI_foreign.203.d: "Des navires chinois et japonais se sont affrontés près des îles Senkaku. L'incident a attiré l'attention internationale et soulevé des craintes d'une escalade plus large dans la région."
 CHI_foreign.203.t: "Confrontation en mer de Chine orientale"
 CHI_foreign.204.a: "Rejeter la déclaration. Maintenir notre contrôle administratif."
 CHI_foreign.204.b: "Émettre une protestation formelle et consulter Washington."
 CHI_foreign.204.d: "La Chine a émis une déclaration formelle de souveraineté sur les îles Diaoyu et annoncé un régime de patrouilles continues des garde-côtes. Tokyo est attendu pour répondre."
 CHI_foreign.204.t: "Pékin revendique les îles Diaoyu"
 CHI_foreign.206.a: "Envoyer le communiqué à Tokyo."
 CHI_foreign.206.d: "Le sommet s'est conclu par la signature par le Japon du communiqué conjoint en entier. Une déclaration liant les deux parties à des relations sino-japonaises stables et à un règlement tacite des griefs historiques est désormais consignée."
 CHI_foreign.206.t: "Le communiqué est signé"
 CHI_foreign.208.a: "Prenez note."
 CHI_foreign.208.b: "Un basculement de l'équilibre régional. Faire le point."
 CHI_foreign.208.c: "Prendre acte du développement."
 CHI_foreign.208.d: "La Chine et le Japon ont publié un communiqué conjoint formalisant une entente stratégique. Le texte engage les deux parties à des relations stables et à un accord tacite sur les griefs historiques. Les analystes sont divisés sur qui, de Pékin ou de Tokyo, a le plus gagné."
 CHI_foreign.208.t: "Communiqué sino-japonais signé"
 CHI_foreign.211.a: "Annuler discrètement les visites"
 CHI_foreign.211.b: "La visite d'État se poursuit"
 CHI_foreign.211.d: "Le rappel de son ambassadeur par Pékin et le gel diplomatique ont fait du prochain round de visites au sanctuaire Yasukuni un test décisif. Le cabinet japonais désamorcera-t-il la querelle, ou durcira-t-il l'orgueil national ?"
 CHI_foreign.211.t: "Le choix de Tokyo sur les visites à Yasukuni"
 CHI_foreign.212.a: "Intensifier la réponse des garde-côtes"
 CHI_foreign.212.b: "Ouvrir un canal discret pour désamorcer la tension"
 CHI_foreign.212.d: "Une confrontation entre milice maritime chinoise et cutters des garde-côtes japonais a dégénéré près des îles Diaoyu. Le cabinet doit répondre avant que les images n'atteignent le journal du soir."
 CHI_foreign.212.t: "Incident de Senkaku"
 CHI_foreign.216.a: "Faire décoller les chasseurs et tenir la ligne de ZAD"
 CHI_foreign.216.b: "Orienter l'incident vers un canal discret"
 CHI_foreign.216.d: "Des aéronefs chinois pénètrent désormais quotidiennement la zone de défense aérienne de mer de Chine orientale, et une quasi-collision entre un chasseur de l'APL et un jet des FAD aériennes a mis Tokyo sur les nerfs. Les garde-côtes seuls ne peuvent plus gérer la pression autour des Senkaku."
 CHI_foreign.216.t: "Senkaku ADIZ Confrontation"
 CHI_foreign.217.a: "Déployer un groupe de la marine de l'APL et tenir bon"
 CHI_foreign.217.b: "Reculer avant que les tirs ne commencent"
 CHI_foreign.217.d: "Un groupe naval chinois suit des navires japonais à vue des îles contestées, et les deux marines sont à postes de combat. Une manœuvre mal jugée pourrait déclencher les premiers coups d'une guerre sino-japonaise. Tokyo attend de voir si Pékin tiendra la ligne ou reculera."
 CHI_foreign.217.t: "Affrontement Senkaku au bord du gouffre"
 CHI_foreign.213.a: "Payer le lobby et mettre fin au boycott"
 CHI_foreign.213.b: "Traverser la tempête"
 CHI_foreign.213.d: "Les exportateurs japonais et le keidanren perdent patience. Le boycott en Chine écarte les marques japonaises de l'un de leurs plus grands marchés. Tokyo doit décider : payer Pékin ou traverser la tempête."
 CHI_foreign.213.t: "Le boycott mord"
 CHI_foreign.215.a: "Faire appliquer le traité de sécurité"
 CHI_foreign.215.b: "Négocier un armistice par des voies détournées"
 CHI_foreign.215.d: "Pékin a forcé la question des Senkaku. Le traité de sécurité mutuelle oblige Washington à envisager une intervention. Le président peut soit faire appliquer ouvertement le traité, soit pousser à un armistice par canal discret."
 CHI_foreign.215.t: "La décision Senkaku de Washington"
 CHI_foreign.220.a: "Saluer l'ouverture"
 CHI_foreign.220.b: "Scepticisme poli"
 CHI_foreign.220.d: "Pékin a signalé une ouverture sur le modèle de la doctrine Fukuda originelle de 1978. Tokyo peut saluer l'ouverture ou répondre avec un scepticisme poli."
 CHI_foreign.220.t: "Une doctrine Fukuda pour le nouveau siècle"
 CHI_foreign.221.a: "Organisez une visite d’État complète"
 CHI_foreign.221.b: "Réception discrète"
 CHI_foreign.221.d: "La Chine a offert en cadeau de visite d'État des pandas géants au zoo d'Ueno. Le cabinet doit décider d'accueillir une visite d'État complète ou de garder un profil bas."
 CHI_foreign.221.t: "Un panda pour Tokyo"
 CHI_foreign.222.a: "Signer le pacte"
 CHI_foreign.222.b: "Attendre davantage de preuves"
 CHI_foreign.222.d: "Pékin a déposé une déclaration bilatérale renonçant formellement au cadrage d'ennemis historiques. Tokyo peut signer et réciproquer, ou attendre davantage de preuves de l'intention chinoise."
 CHI_foreign.222.t: "Pacte de réduction mutuelle des menaces"
 CHI_foreign.223.a: "Faire pression sur le Japon pour qu'il se réengage"
 CHI_foreign.223.b: "Rétrograder le Quad au rang de dialogue"
 CHI_foreign.223.d: "Le coin diplomatique de Pékin commence à détacher Tokyo du Dialogue quadrilatéral de sécurité. Washington peut presser le Japon de se réengager, ou accepter discrètement la rétrogradation."
 CHI_foreign.223.t: "La réponse du Quad"
 CHI_foreign.224.a: "Signer le communiqué complet"
 CHI_foreign.224.b: "Signer avec réserves"
 CHI_foreign.224.c: "Sortez"
 CHI_foreign.224.d: "Des années de diplomatie patiente ont produit un projet de communiqué. Signer le texte complet recâble la posture stratégique du Japon ; signer avec réserves préserve les relations bilatérales sans rompre avec Washington ; quitter la table fait voler en éclats tout le processus."
 CHI_foreign.224.t: "Le communiqué de Tokyo"
 CHI_foreign.226.a: "Prendre note des réserves et avancer."
 CHI_foreign.226.d: "Tokyo a signé une version plus limitée du communiqué. Le PLD a ménagé des réserves spécifiques plutôt que d'accepter le texte complet, préservant un degré d'alignement avec Washington. La relation bilatérale avance, bien que l'ambiguïté stratégique demeure."
 CHI_foreign.226.t: "Un accord partiel avec le Japon"
 CHI_foreign.227.a: "Évaluer les dégâts."
 CHI_foreign.227.d: "Des années de travail diplomatique se sont défaites. Le PLD a rejeté le texte final du communiqué, accusant Pékin d'outrepasser son mandat et de subordonner la souveraineté japonaise. Tout le cadre de négociation s'est effondré."
 CHI_foreign.227.t: "Le Japon claque la porte des négociations"
 CHI_foreign.231.a: "Prendre note de l'opportunité commerciale."
 CHI_foreign.231.d: "Pékin a accueilli Mitsubishi Aerospace pour établir des installations de production sous licence et de recherche sur le continent. L'industrie japonaise gagne des recettes d'exportation et un accès au marché ; les ingénieurs aérospatiaux chinois gagnent la proximité de la conception avancée de cellules."
 CHI_foreign.231.t: "Mitsubishi Aerospace ouvre en Chine"
 CHI_foreign.232.a: "Prendre note de l'opportunité commerciale."
 CHI_foreign.232.d: "La division aérospatiale de Kawasaki a obtenu un accord-cadre avec Pékin couvrant la production de composants de grandes cellules. L'accord ouvre une part substantielle du marché chinois tout en donnant à Tokyo une influence sur les cycles d'approvisionnement aérospatiaux chinois."
 CHI_foreign.232.t: "Kawasaki Aerospace entre en Chine"
 CHI_foreign.233.a: "Prendre note de l'opportunité commerciale."
 CHI_foreign.233.d: "Japan Steel Works a reçu l'autorisation d'exploiter une forge en coentreprise en Chine. Les profits d'exportation de grandes pièces forgées en acier donnent à Tokyo un levier continu sur la capacité industrielle lourde chinoise."
 CHI_foreign.233.t: "Japan Steel Works s'installe en Chine"
 CHI_foreign.234.a: "Prendre note de l'opportunité commerciale."
 CHI_foreign.234.d: "La branche systèmes terrestres de Mitsubishi Heavy Industries a convenu d'un arrangement de licence technologique avec un partenaire d'État chinois. Le Japon gagne des retours commerciaux ; Pékin gagne l'accès aux méthodologies de conception de véhicules blindés."
 CHI_foreign.234.t: "MHI Land Systems invité en Chine"
 CHI_foreign.235.a: "Prendre note de l'opportunité commerciale."
 CHI_foreign.235.d: "Komatsu Defense a établi un arrangement de coopération de production en Chine couvrant les véhicules blindés légers. L'accord génère un revenu d'exportation régulier pour Tokyo et approfondit les liens de l'industrie de défense bilatérale."
 CHI_foreign.235.t: "Komatsu Defense s'implante en Chine"
 CHI_foreign.236.a: "Prendre note de l'opportunité commerciale."
 CHI_foreign.236.d: "La division aérospatiale de Subaru Corporation a conclu un accord de fabrication conjointe avec un homologue chinois. L'expertise structurelle voilure tournante alimente le programme chinois tandis que Subaru enregistre des commandes de composants à long terme."
 CHI_foreign.236.t: "Signature d'un partenariat aéronautique avec Subaru"
 CHI_foreign.237.a: "Prendre note de l'opportunité commerciale."
 CHI_foreign.237.d: "Howa Machinery a concédé sous licence ses procédés d'usinage de précision à une installation partenaire chinoise. L'arrangement produit un revenu d'exportation tout en étendant les normes japonaises de fabrication d'armes légères dans la chaîne d'approvisionnement de défense chinoise."
 CHI_foreign.237.t: "Howa Machinery actif en Chine"
 CHI_foreign.238.a: "Prendre note de l'opportunité commerciale."
 CHI_foreign.238.d: "NEC Corporation a ouvert un centre d'intégration électronique en coentreprise en Chine. Les retours commerciaux sont substantiels ; le prix plus profond pour Tokyo est une influence soutenue sur les normes d'approvisionnement C4ISR chinoises."
 CHI_foreign.238.t: "NEC établit des opérations en Chine"
 CHI_foreign.239.a: "Prendre note de l'opportunité commerciale."
 CHI_foreign.239.d: "Toshiba Defense Systems a convenu de fournir des composants radar et capteurs aux intégrateurs chinois sous un cadre de licence géré. Le Japon conserve l'autorité de conception tout en percevant des redevances régulières de transfert technologique."
 CHI_foreign.239.t: "Toshiba Defense Systems en Chine"
 CHI_foreign.240.a: "Prendre note de l'opportunité commerciale."
 CHI_foreign.240.d: "La branche construction navale de Mitsubishi a conclu un accord de coopération navale avec un chantier d'État chinois. Recettes d'exportation et influence à long terme sur les normes de conception des bâtiments de surface chinois sont les principaux bénéfices pour Tokyo."
 CHI_foreign.240.t: "Mitsubishi Shipbuilding signe avec Pékin"
 CHI_foreign.241.a: "Prendre note de l'opportunité commerciale."
 CHI_foreign.241.d: "La division chantiers de Kawasaki Heavy Industries a convenu de partager des techniques de fabrication de coques de sous-marins avec un partenaire chinois. Le Japon gagne un accès au marché ; Pékin gagne une exposition aux méthodes de réduction de signature acoustique."
 CHI_foreign.241.t: "Les chantiers Kawasaki accueillis en Chine"
 CHI_foreign.242.a: "Prendre note de l'opportunité commerciale."
 CHI_foreign.242.d: "IHI a obtenu l'autorisation de produire des composants de moteurs d'aviation en Chine sous un cadre de fabrication sous licence. Tokyo gagne un flux de recettes durable et une tête de pont dans l'approvisionnement de l'aviation militaire chinoise."
 CHI_foreign.242.t: "IHI Corporation entre sur le marché chinois"
 CHI_foreign.243.a: "Prendre note de l'opportunité commerciale."
 CHI_foreign.243.d: "Japan Marine United a conclu un accord de coopération d'architecture navale avec un constructeur chinois. L'accord produit un revenu d'exportation et établit un rôle japonais durable dans le développement des programmes de bâtiments de surface chinois."
 CHI_foreign.243.t: "Signature du partenariat Japan Marine United"
 CHI_foreign.244.a: "Prendre note de l'opportunité commerciale."
 CHI_foreign.244.d: "Toyota Motor Corporation a convenu d'étendre son empreinte de fabrication et de logistique en Chine sous le nouveau cadre de partenariat. Les exportations de systèmes de production renforcent l'influence douce japonaise sur la modernisation industrielle chinoise."
 CHI_foreign.244.t: "Toyota établit une fabrication chinoise"
 CHI_foreign.245.a: "Prendre note de l'opportunité commerciale."
 CHI_foreign.245.d: "Honda Motor Company a obtenu un accord élargi de fabrication et de licence de groupes motopropulseurs en Chine. Un revenu de redevances régulier afflue à Tokyo tandis que les normes de production Honda s'enchâssent dans la pratique d'usine chinoise."
 CHI_foreign.245.t: "Honda entre dans le partenariat"
 CHI_foreign.246.a: "Prendre note de l'opportunité commerciale."
 CHI_foreign.246.d: "Nippon Steel a convenu de fournir des plaques d'acier à haute dureté et des alliages spéciaux à des partenaires chinois par un arrangement de coentreprise. L'accord produit des recettes d'exportation premium et lie la production d'acier de blindage chinois aux chaînes d'approvisionnement japonaises."
 CHI_foreign.246.t: "Nippon Steel rejoint ses opérations en Chine"
 CHI_foreign.247.a: "Prendre note de l'opportunité commerciale."
 CHI_foreign.247.d: "Hitachi a établi des opérations d'électronique industrielle et d'informatique embarquée en Chine sous le cadre de partenariat. Les recettes d'exportation sont immédiates ; à plus long terme, Tokyo gagne une influence continue sur la modernisation des infrastructures chinoises."
 CHI_foreign.247.t: "Hitachi s'étend en Chine"
 CHI_foreign.248.a: "Prendre note de l'opportunité commerciale."
 CHI_foreign.248.d: "Panasonic a conclu des accords pour fournir des technologies de batteries et de l'électronique durcie à des partenaires chinois. L'arrangement génère un revenu d'exportation fiable tout en enchâssant les normes de composants japonaises dans les lignes de production chinoises adjacentes au militaire."
 CHI_foreign.248.t: "Panasonic conclut un partenariat chinois"
 CHI_foreign.249.a: "Prendre note de l'opportunité commerciale."
 CHI_foreign.249.d: "JR East a convenu de partager la signalisation ferroviaire à grande vitesse et l'ingénierie du matériel roulant avec des partenaires chinois. Les retours commerciaux sont clairs ; la valeur stratégique pour Tokyo réside dans une influence à long terme sur les infrastructures de transport chinoises."
 CHI_foreign.249.t: "JR East apporte son expertise ferroviaire à la Chine"
 CHI_foreign.250.a: "Traverser la pression."
 CHI_foreign.250.d: "Les médias d'État chinois ont lancé une campagne coordonnée sur la conduite de guerre du Japon, mettant en lumière les visites officielles au sanctuaire Yasukuni, les révisions de manuels scolaires et le massacre de Nankin. Des manifestations antijaponaises se répandent dans les villes chinoises, et Tokyo affronte une pression croissante pour répondre."
 CHI_foreign.250.t: "Pékin rouvre la question historique"
 CHI_foreign.55.a: "Pousser un cadre dirigé par Pékin."
 CHI_foreign.55.b: "Agir en médiateur équilibré."
 CHI_foreign.55.c: "S'en remettre à l'initiative de Séoul."
 CHI_foreign.55.d: "La Chine a négocié un sommet diplomatique d'urgence à Pékin, ramenant les pourparlers sur la péninsule coréenne du bord du gouffre. Les deux parties arrivent sous pression, et la posture que la Chine adoptera façonnera la lecture de l'événement dans chaque capitale."
 CHI_foreign.55.t: "Le Sommet de Pékin se réunit"
 CHI_foreign.66.a: "Se préparer aux conséquences."
 CHI_foreign.66.d: "L'opération a catastrophiquement mal tourné. Des forces spéciales chinoises ont été capturées ou tuées, et Pyongyang a annoncé la preuve de l'implication de Pékin. La région retient son souffle."
 CHI_foreign.66.t: "L’opération New Dawn dévoilée"
 CHI_foreign.67.a: "Retirez-vous tranquillement."
 CHI_foreign.67.d: "L'opération n'a pas atteint ses objectifs, mais les services de sécurité de Pyongyang ont attribué l'incident à des dissidents intérieurs. Le rôle de Pékin reste non confirmé, pour l'instant."
 CHI_foreign.67.t: "Le raid échoue, présenté comme un soulèvement interne"
 CHI_foreign.68.a: "Observer le déroulement de la situation."
 CHI_foreign.68.d: "L'opération a déclenché des combats ouverts dans la capitale. Unités loyales de l'APK et factions dissidentes se disputent le contrôle de Pyongyang tandis que le monde extérieur observe."
 CHI_foreign.68.t: "Pyongyang en flammes"
 CHI_foreign.69.a: "Consolider les gains."
 CHI_foreign.69.d: "L'opération a réussi. Une direction pro-Pékin a consolidé le contrôle sur la Corée du Nord. L'équilibre des forces sur la péninsule a basculé."
 CHI_foreign.69.t: "Une nouvelle aube à Pyongyang"
 CHI_military_event.1.a: "Vendre à la pleine valeur marchande"
 CHI_military_event.1.b: "Récompenser les officiers qui s'y conforment"
 CHI_military_event.1.d: "En décembre 1998, l'ordre de dessaisissement de Jiang Zemin avait placé des milliers d'entreprises gérées par l'APL sous évaluation et transfert civils. Bras immobiliers, conglomérats de trading et usines pharmaceutiques ont été expertisés et cédés, dépouillant l'armée d'un empire bâti pendant des décennies. Les termes de la passation sont encore en négociation."
 CHI_military_event.1.t: "La passation Vanke"
 CHI_military_event.10.a: "Remettre le dossier aux inspecteurs de la discipline"
 CHI_military_event.10.b: "Enterrer l'enquête"
 CHI_military_event.10.d: "Des enquêteurs de la Commission centrale de contrôle de la discipline ont perquisitionné le domicile d'un lieutenant-général enrichi par les affaires de l'armée. Comme pour Gu Junshan en 2012, ils emportent des caisses d'espèces, des caisses de Maotai et un buste en or de Mao. Les réseaux au-dessus de lui observent si Pékin osera tirer le fil, ou si le dossier disparaîtra comme tant d'autres avant lui."
 CHI_military_event.10.t: "La fortune d'un général découverte"
 CHI_military_event.2.a: "Exploiter le secteur commercial"
 CHI_military_event.2.b: "Diriger depuis le sommet"
 CHI_military_event.2.d: "Élevée au rang de stratégie nationale en 2017, la fusion militaro-civile abat le mur séparant les bases industrielles civiles et de défense de la Chine. Universités, entreprises d'État et firmes technologiques privées sont tenues de partager recherche, capacité de production et chaînes d'approvisionnement avec l'APL, réorientant l'ensemble de l'économie vers une production à double usage sous la supervision de la Commission militaire centrale."
 CHI_military_event.2.t: "Fusion militaro-civile proclamée"
 CHI_military_event.4.a: "Courir le marché de l'armement"
 CHI_military_event.4.b: "Acheter un accès politique à l'étranger"
 CHI_military_event.4.d: "Poly Technologies, filiale d'exportation d'armes de l'état-major général de l'APL, achemine fusils chinois, missiles antinavires et systèmes balistiques à courte portée vers l'Afrique, le Moyen-Orient et l'Amérique latine. Poly Culture, sa façade civile, blanchit les recettes via les salles de vente de Hong Kong et l'immobilier à l'étranger. Les revenus retournent à l'armée par des sociétés-écrans qui n'apparaissent jamais au budget officiel."
 CHI_military_event.4.t: "Poly Technologies se mondialise"
 CHI_military_event.5.a: "Abandonnez quelques boucs émissaires"
 CHI_military_event.5.b: "Serrer les rangs et défier les auditeurs"
 CHI_military_event.5.d: "La campagne anticorruption lancée par Xi Jinping en 2012 a atteint le département de la logistique générale. Xu Caihou et Guo Boxiong, les deux anciens vice-présidents de la CMC qui géraient le système de promotions contre espèces dans tout le corps des officiers, font face à une mise en accusation. La clique doit décider si elle livre des boucs émissaires pour gagner du répit, ou serre les rangs et défie Pékin d'aller plus loin."
 CHI_military_event.5.t: "L'heure des comptes"
 CHI_military_event.6.a: "Jurer fidélité au Rêve chinois"
 CHI_military_event.6.b: "Garder le privilège discret"
 CHI_military_event.6.d: "Xu Caihou mort d'un cancer avant le procès et Guo Boxiong déchu de son grade, le réseau survivant accepte les nouveaux termes. Professions de foi bruyantes au Rêve chinois de Xi, une poignée d'officiers intermédiaires livrés pour la galerie, et un accord discret : le pillage ouvert cesse, mais les réseaux qui contrôlent les contrats logistiques, les appels d'offres de construction et l'achat d'armement survivent sous une forme plus discrète."
 CHI_military_event.6.t: "S'incliner devant le Rêve chinois"
 CHI_political_events.1.a: "Coordonner une réponse nationale."
 CHI_political_events.1.d: "Un nouveau coronavirus s'est répandu du Guangdong vers Hong Kong, le Vietnam, le Canada et Singapour. L'OMS a émis une alerte sanitaire mondiale. Les hôpitaux de Canton et de Pékin sont submergés et la peur publique se propage plus vite que la maladie elle-même."
 CHI_political_events.1.t: "Épidémie de SRAS"
 CHI_political_events.2.a: "Déployer toutes les ressources disponibles."
 CHI_political_events.2.d: "Un séisme de magnitude 7,9 a frappé le Sichuan, l'épicentre près du xian de Wenchuan. Plus de 69 000 personnes mourront et 18 000 resteront portées disparues. Des villes entières ont été détruites par le choc initial et les glissements de terrain secondaires."
 CHI_political_events.2.t: "Tremblement de terre de Wenchuan"
 CHI_political_events.3.a: "Que les Jeux commencent."
 CHI_political_events.3.d: "Les Jeux olympiques de Pékin 2008 s'ouvrent aujourd'hui. Après des années de préparation et un effort de construction sans précédent, la Chine accueille les athlètes du monde au Stade national. La cérémonie d'ouverture rassemble une audience mondiale de centaines de millions de spectateurs, mettant en scène l'ascension de la Chine sur la scène internationale."
 CHI_political_events.3.t: "Les Jeux de la XXIXe Olympiade"
 CHI_political_events.4.a: "Accélérer le développement technologique"
 CHI_political_events.4.b: "Renforcer la cohésion sociale"
 CHI_political_events.4.c: "Bâtir la puissance militaire"
 CHI_political_events.4.d: "Le XIXe congrès du Parti conclu, le Congrès fixe ses priorités pour les deux jalons du centenaire : une société moyennement prospère d'ici 2021 et une nation socialiste pleinement développée d'ici 2049. Les ressources de l'État doivent être orientées. Où le Parti concentrera-t-il son énergie ?"
 CHI_political_events.4.t: "Les deux objectifs du centenaire"
 CHI_political_events.5.a: "Élever un candidat Tuanpai"
 CHI_political_events.5.b: "Élever un candidat Princeling"
 CHI_political_events.5.c: "Laisser la décision entre les mains de Xi"
 CHI_political_events.5.d: "La question de la succession n'est plus académique. Xi Jinping a consolidé le pouvoir, mais le Parti exige une continuité institutionnelle. Le Comité permanent du Politburo attend des directives. Un choix maintenant façonnera la prochaine génération de dirigeants chinois."
 CHI_political_events.5.t: "Désigner un successeur"
 CHI_political_events.50.a: "Commencer à planifier pour une Chine plus âgée."
 CHI_political_events.50.d: "La population en âge de travailler de la Chine, quelque 940 millions au pic, a commencé sa longue contraction. Le surplus de main-d'œuvre qui a alimenté trois décennies de croissance à deux chiffres ne croît plus. Les économistes notent que le basculement est structurel, non cyclique : sans intervention politique, ateliers et chantiers se disputeront un vivier de travailleurs en rétrécissement pour le reste du siècle."
 CHI_political_events.50.t: "Le dividende démographique s'estompe"
 CHI_political_events.51.a: "Affronter l'heure des comptes."
 CHI_political_events.51.d: "Le sixième recensement national de la population de 2010 confirme ce que les démographes préviennent depuis longtemps : la part des 60 ans et plus a grimpé à 13,3 %, et l'âge médian continue de monter. La structure familiale 4-2-1 — un enfant responsable de deux parents et de quatre grands-parents — est désormais la norme statistique dans la Chine urbaine. Le déclin démographique n'est plus une projection lointaine."
 CHI_political_events.51.t: "Un recensement révèle un vieillissement accéléré"
 CHI_political_events.52.a: "Une base plus dure, mais plus honnête."
 CHI_political_events.52.d: "Après des années de tension économique et d'ajustements politiques, la Chine a atteint un nouvel équilibre démographique. La main-d'œuvre est plus petite et plus âgée, les retraites plus coûteuses, et la fécondité reste sous le seuil de remplacement, mais le choc aigu de la transition est passé. Le pays sorti de cette décennie est discipliné par la nécessité : finances publiques plus maigres, automatisation plus poussée, et un État-providence calibré pour une société devenue vieille avant d'être riche."
 CHI_political_events.52.t: "La crise de la société grise s'apaise"
 CHI_political_events.6.a: "Honorer notre héros national"
 CHI_political_events.6.b: "Poursuivre un règlement diplomatique"
 CHI_political_events.6.d: "Le 1er avril 2001, un avion de renseignement électronique EP-3 de l'US Navy est entré en collision avec un intercepteur J-8 de la PLAAF près de l'île de Hainan. L'équipage américain a effectué un atterrissage d'urgence sur le sol chinois. Pékin doit décider comment gérer l'impasse."
 CHI_political_events.6.t: "L'impasse de Hainan"
 CHI_political_events.7.a: "Le secteur était sous-développé — la répression frappe fort."
 CHI_political_events.7.b: "Le secteur absorbe la répression avec des perturbations mais sans effondrement."
 CHI_political_events.7.c: "L'ampleur du secteur amortit le choc."
 CHI_political_events.7.d: "Le discours de Jack Ma en octobre 2020 au sommet du Bund, comparant les banques chinoises à des prêteurs sur gages, déclenche une chaîne d'actions réglementaires. La CSRC et la SAMR suspendent l'introduction en Bourse d'Ant Group deux jours avant son lancement de 34 milliards de dollars. Les enquêteurs antitrust ouvrent une procédure contre Alibaba. L'Administration du cyberespace lance un examen de sécurité nationale sur Didi deux jours après son entrée à la NYSE. Le secteur technologique affronte une restructuration fondamentale de sa relation avec l'État."
 CHI_political_events.7.e: "Le secteur est assez mature pour transformer la régulation en stabilité structurelle."
 CHI_political_events.7.t: "Répression des grandes technologies"
 CHI_political_events.8.a: "Continuer à financer le secteur informatique"
 CHI_political_events.8.d: "Suivant la directive stratégique de dynamiser la nation par la science et la technologie, les institutions soutenues par l'État accélèrent les investissements dans l'informatique de nouvelle génération et les infrastructures internet. Des laboratoires universitaires aux zones économiques spéciales, les fondations numériques de la Chine se posent pour les décennies à venir."
 CHI_political_events.8.t: "Innover par la science et la technologie"
 CHI_sco.1.a: "Nous saluons leur intérêt."
 CHI_sco.1.b: "Nous ne pouvons accorder ce statut."
 CHI_sco.1.d: "[FROM.GetNameWithFlag] a déposé une demande formelle de statut d'observateur à l'Organisation de coopération de Shanghai. Nous devons décider d'accéder ou non à cette requête."
 CHI_sco.1.t: "Demande d'observateur SCO"
 CHI_sco.10.a: "Nous sommes aux côtés de la Chine."
 CHI_sco.10.b: "Nous ne serons pas liés par les ambitions de la Chine."
 CHI_sco.10.c: "Restez neutre."
 CHI_sco.10.d: "La Chine a exigé que nous déclarions notre loyauté exclusive à sa faction au sein de l'OCS, nous forçant à choisir entre Pékin et Moscou."
 CHI_sco.10.t: "La Chine exige votre allégeance"
 CHI_sco.11.a: "Nous sommes reconnaissants du soutien."
 CHI_sco.11.d: "[FROM.GetNameWithFlag] fournit une aide au développement pour soutenir notre modernisation économique dans le cadre des dispositifs de coopération de l'OCS."
 CHI_sco.11.t: "Aide au développement de l'OCS"
 CHI_sco.2.a: "Ils ont prouvé qu'ils méritent la pleine adhésion."
 CHI_sco.2.b: "Nous ne pouvons soutenir cette candidature."
 CHI_sco.2.d: "[FROM.GetNameWithFlag] a déposé une demande formelle de pleine adhésion à l'Organisation de coopération de Shanghai."
 CHI_sco.2.t: "Demande d'adhésion à l'OCS"
 CHI_sco.20.a: "Investir du capital politique pour restaurer la confiance."
 CHI_sco.20.b: "Nous avons des préoccupations plus urgentes."
 CHI_sco.20.d: "La cohésion interne de l'Organisation de coopération de Shanghai est tombée à des niveaux préoccupants. Plusieurs États membres ont exprimé des doutes sur l'orientation de l'organisation, et sans intervention, la coopération pourrait encore se détériorer."
 CHI_sco.20.t: "Les membres remettent en question la direction de SCO"
 CHI_sco.21.a: "C'est notre moment."
 CHI_sco.21.d: "L'Organisation de coopération de Shanghai prospère. Les États membres font état d'une coopération sans précédent, les projets conjoints portent leurs fruits, et le standing international de l'organisation n'a jamais été aussi fort."
 CHI_sco.21.t: "Un âge d'or de la coopération"
 CHI_sco.22.a: "Faire valoir notre avantage."
 CHI_sco.22.b: "Nous devrions apaiser les tensions."
 CHI_sco.22.d: "Notre domination croissante au sein de l'Organisation de coopération de Shanghai n'est pas passée inaperçue. Le rôle diminué de la Russie est une source de friction croissante, et Moscou a commencé à faire connaître son mécontentement par les canaux diplomatiques."
 CHI_sco.22.t: "La Russie mise à l'écart dans l'OCS"
 CHI_sco.23.a: "Nous devons nous réaffirmer."
 CHI_sco.23.b: "Peut-être est-ce pour le mieux."
 CHI_sco.23.d: "L'influence de la Russie au sein de l'OCS a grandi au point que notre propre position de leadership est remise en question. Moscou fixe de plus en plus l'agenda, et sans action, nous risquons d'être relégués à un rôle d'appoint dans notre propre organisation."
 CHI_sco.23.t: "La Chine perd l'initiative"
 CHI_sco.3.a: "Nos troupes accueilleront l'occasion de s'entraîner aux côtés de leurs forces."
 CHI_sco.3.b: "La coopération avec [FROM.GetName] n'est pas possible pour le moment."
 CHI_sco.3.d: "[FROM.GetNameWithFlag] a proposé de mener des exercices militaires conjoints dans le cadre de l'OCS. Cela renforcerait la coopération sécuritaire entre nos forces armées."
 CHI_sco.3.t: "Invitation à des exercices militaires conjoints"
 CHI_sco.30.a: "Approuver le projet."
 CHI_sco.30.b: "Ce n'est pas le bon moment."
 CHI_sco.30.d: "[FROM.GetNameWithFlag] a proposé la construction d'un réseau énergétique intégré à l'échelle de l'OCS. En tant que membre de premier plan, nous devons décider d'approuver ou non ce projet d'infrastructure ambitieux."
 CHI_sco.30.t: "Proposition de réseau énergétique de l'OCS"
 CHI_sco.31.a: "Approuver le projet."
 CHI_sco.31.b: "Nous ne pouvons pas nous y engager."
 CHI_sco.31.d: "[FROM.GetNameWithFlag] a proposé un réseau ferroviaire transcontinental pour relier les économies de l'OCS. Cela exigerait un investissement considérable, mais pourrait transformer le commerce au sein de l'organisation."
 CHI_sco.31.t: "Proposition de chemin de fer transeurasien"
 CHI_sco.32.a: "Approuver la création de la banque."
 CHI_sco.32.b: "Les conditions ne sont pas favorables."
 CHI_sco.32.d: "[FROM.GetNameWithFlag] a proposé d'établir une banque de développement multilatérale dans le cadre de l'OCS. Cette institution financerait les infrastructures et le développement des États membres."
 CHI_sco.32.t: "Proposition de banque de développement de l'OCS"
 CHI_sco.33.a: "Approuver le réseau."
 CHI_sco.33.b: "Nous avons des réserves à ce sujet."
 CHI_sco.33.d: "[FROM.GetNameWithFlag] a proposé un réseau de défense aérienne intégré couvrant les États membres de l'OCS. Une couverture radar partagée et une défense antimissile coordonnée renforceraient la sécurité collective."
 CHI_sco.33.t: "Proposition de défense aérienne conjointe de l'OCS"
 CHI_sco.34.a: "Nous sommes fiers d'être membre fondateur."
 CHI_sco.34.d: "Pékin a formalisé la transformation longtemps discutée du Groupe de Shanghai en un organe intergouvernemental à part entière. L'Organisation de coopération de Shanghai proposée approfondirait nos liens politiques, sécuritaires et économiques avec la Chine et nos voisins régionaux, avec nous comme membre fondateur dès le premier jour."
 CHI_sco.34.t: "La Chine propose l'Organisation de coopération de Shanghai"
 CHI_sco.4.a: "Que les exercices commencent."
 CHI_sco.4.d: "[FROM.GetNameWithFlag] a accepté notre invitation à des exercices militaires conjoints."
 CHI_sco.4.t: "Exercices conjoints acceptés"
 CHI_sco.5.a: "Tant pis pour eux."
 CHI_sco.5.d: "[FROM.GetNameWithFlag] a décliné notre invitation à des exercices militaires conjoints."
 CHI_sco.5.t: "Exercices conjoints rejetés"
 CHI_sco.6.a: "Ces manœuvres ressemblent étrangement à des préparatifs de guerre."
 CHI_sco.6.b: "Seuls les terroristes et les extrémistes ont quelque chose à craindre de ces exercices."
 CHI_sco.6.c: "Une évolution intéressante à surveiller."
 CHI_sco.6.d: "L'Organisation de coopération de Shanghai a lancé un exercice militaire de grande envergure impliquant les forces armées de ses États membres."
 CHI_sco.6.t: "L'OCS lance des exercices militaires de grande envergure"
 CHI_sco.7.a: "La sphère d'influence chinoise continue de s'étendre."
 CHI_sco.7.b: "Une belle journée pour la diplomatie multilatérale."
 CHI_sco.7.d: "[FROM.GetNameWithFlag] a été formellement admis comme membre à part entière de l'Organisation de coopération de Shanghai."
 CHI_sco.7.t: "[FROM.GetNameWithFlag] rejoint l'OCS"
 CHI_sco.8.a: "L'agressivité chinoise a encore aliéné un partenaire."
 CHI_sco.8.b: "Un recul regrettable pour la coopération internationale."
 CHI_sco.8.d: "[FROM.GetNameWithFlag] a annoncé son retrait de l'Organisation de coopération de Shanghai, invoquant des divergences irréconciliables."
 CHI_sco.8.t: "[FROM.GetNameWithFlag] se retire de l'OCS"
 CHI_sco.9.a: "La Chine refuse de partager la lumière."
 CHI_sco.9.d: "La Chine a agi résolument pour affirmer sa domination sur l'Organisation de coopération de Shanghai, mettant la Russie à l'écart et s'imposant comme la puissance dirigeante incontestée du bloc."
 CHI_sco.9.t: "La Chine consolide son contrôle sur l'OCS"
 CHI_semiconductor_events.1.d: "Les États-Unis ont élargi les contrôles à l'exportation aux équipements de semi-conducteurs avancés, aux logiciels EDA et aux composants de mémoire à haute bande passante. Les gouvernements alliés en Europe, au Japon et en Corée du Sud ont coordonné les licences d'exportation pour renforcer les contrôles. L'embargo technologique reflète la détermination de Washington à empêcher la Chine de combler son retard dans la production avancée de logique et de mémoire."
 CHI_semiconductor_events.1.o1: "Nous irons de l'avant malgré tout."
 CHI_semiconductor_events.1.t: "Boycott des semi-conducteurs occidentaux"
 CHI_semiconductor_events.2.a: "Mettre en avant la réussite"
 CHI_semiconductor_events.2.b: "Rester discrets, stocker de la capacité"
 CHI_semiconductor_events.2.d: "Huawei a lancé le Mate 60 Pro propulsé par un système-sur-puce Kirin 9000S national. L'analyse du démontage confirme que SMIC a fabriqué le SoC sur son procédé N+2 équivalent 7 nm. La percée réécrit les hypothèses publiques sur l'ampleur du recul imposé par les contrôles à l'exportation."
 CHI_semiconductor_events.2.t: "La surprise du Mate 60"
 CHI_semiconductor_events.3.a: "Faire pression sur Empyrean"
 CHI_semiconductor_events.3.b: "Endurer et réacheminer par des canaux gris"
 CHI_semiconductor_events.3.d: "Les amendements de mai 2025 du Bureau of Industry and Security américain nous désignent comme destination restreinte pour les outils EDA. Synopsys et Cadence déposent les demandes de licence obligatoire requises. Les refus de licence suivront dans les semaines. Le flux national doit désormais porter chaque conception avancée jusqu'au tape-out."
 CHI_semiconductor_events.3.t: "Synopsys et Cadence nous coupent"
 CHI_semiconductor_events.4.a: "Pousser la qualification auprès des firmes d'IA nationales"
 CHI_semiconductor_events.4.b: "Exporter la HBM vers la Russie et l'Iran"
 CHI_semiconductor_events.4.d: "L'usine de Hefei de ChangXin Memory Technologies a commencé la production de masse de piles HBM2 une année entière avant l'objectif public de 2026. Les premiers échantillons de qualification sont déjà chez Cambricon et Biren. Les accélérateurs d'IA nationaux n'ont plus à franchir un goulet d'étranglement de mémoire étrangère."
 CHI_semiconductor_events.4.t: "CXMT : HBM2 en avance sur le calendrier"
 CHI_semiconductor_events.5.a: "Assouplir les contrôles sur les puces"
 CHI_semiconductor_events.5.b: "Maintenir la ligne sur les contrôles à l'exportation"
 CHI_semiconductor_events.5.d: "La Chine a lié l'accès continu à ses exportations de terres rares et de gallium à un allègement des contrôles à l'exportation de semi-conducteurs. Les chaînes d'approvisionnement occidentales en aimants et substrats de puces dépendant du raffinage chinois, Pékin parie que le levier joue dans les deux sens. La proposition arrive sur notre bureau comme un échange direct : assouplir l'embargo sur les puces, maintenir le flux de minéraux critiques."
 CHI_semiconductor_events.5.t: "L'offre de terres rares de Pékin"
 CHI_semiconductor_events.6.a: "Accélérer la montée en puissance nationale"
 CHI_semiconductor_events.6.d: "Washington a discrètement élargi les approbations de licences pour les outils de nœuds matures et les logiciels de conception en échange d'un approvisionnement garanti en terres rares. Le répit est partiel et réversible, mais il donne à nos fonderies le temps de combler les écarts restants sans le poids entier de l'embargo."
 CHI_semiconductor_events.6.t: "Contrôles assouplis"
 CHI_semiconductor_events.7.a: "Encaisser le revers"
 CHI_semiconductor_events.7.d: "Washington a rejeté le lien de but en blanc, estimant que céder sur les puces ferait perdre son plus fort levier. Les contrôles à l'exportation tiennent, et le capital politique dépensé dans l'ouverture est perdu. L'autosuffisance reste la seule voie ouverte."
 CHI_semiconductor_events.7.t: "Les pourparlers s’effondrent"
 CHI_space_events.1.a: "Les yeux de la nation sont sur nous."
 CHI_space_events.1.d: "Au centre de lancement de Wenchang, une Longue Marche 10 s'élève sur une colonne de fumée et de flammes, emportant le véhicule habité Mengzhou et ses trois taïkonautes vers l'injection translunaire. Chaque téléviseur du pays montre l'ascension. Le monde regarde."
 CHI_space_events.1.t: "La Longue Marche décolle pour la Lune"
 CHI_space_events.10.a: "Financer intégralement le réseau de satellites et de suivi"
 CHI_space_events.10.b: "Avancer à un rythme mesuré"
 CHI_space_events.10.d: "Le programme Chang'e engagé vers la surface lunaire, le Conseil des affaires d'État pèse le financement des infrastructures d'appui. La première question est le réseau de satellites et de suivi : les relais Queqiao et les antennes d'espace lointain qui maintiennent un équipage en contact sur 380 000 kilomètres. Nous pouvons le financer entièrement maintenant, ou étaler le coût et avancer à un rythme mesuré."
 CHI_space_events.10.t: "Financer la route vers la Lune"
 CHI_space_events.11.a: "Accélérer le développement de Longue Marche 10"
 CHI_space_events.11.b: "S'en tenir au calendrier prévu"
 CHI_space_events.11.d: "Aucune mission lunaire habitée n'est possible sans une fusée lourde. La Longue Marche 10 est conçue pour envoyer le véhicule habité Mengzhou et l'atterrisseur Lanyue vers la Lune sur des vols séparés. Accélérer son développement est coûteux, mais chaque mois gagné rapproche l'atterrissage."
 CHI_space_events.11.t: "La question du lanceur lourd"
 CHI_space_events.12.a: "Faire confiance aux ingénieurs"
 CHI_space_events.12.d: "La voie mesurée maintient le programme abordable et politiquement sûr. Les ingénieurs de l'Académie chinoise de technologie des lanceurs mènent la campagne de qualification à un rythme soutenable, convaincus que la patience sera récompensée sur le pas de tir."
 CHI_space_events.12.t: "Une cadence constante"
 CHI_space_events.13.a: "Récolter les fruits"
 CHI_space_events.13.d: "Les décisions de financement des années passées portent leurs fruits. Les antennes de suivi entrent en service, les moteurs passent leurs tirs de qualification, et l'architecture lunaire prend forme. Les dividendes de la prévoyance sont désormais prêts à être perçus."
 CHI_space_events.13.t: "Les investissements mûrissent"
 CHI_space_events.2.a: "Un grand pas pour le peuple chinois."
 CHI_space_events.2.d: "L'atterrisseur Lanyue se pose dans la région polaire sud lunaire. Le commandant de mission ouvre l'écoutille et descend l'échelle. Ses premiers mots, diffusés en direct à un milliard d'auditeurs : nous sommes arrivés, et nous resterons. La Chine a atteint la Lune."
 CHI_space_events.2.t: "Des taïkonautes posent le pied sur la Lune"
 CHI_space_events.20.a: "Un triomphe de la nation"
 CHI_space_events.20.b: "Un triomphe de notre industrie"
 CHI_space_events.20.c: "Un triomphe de notre science"
 CHI_space_events.20.d: "Les taïkonautes ont marché sur la Lune et sont revenus. Une nation qui importait autrefois ses fusées a planté son drapeau sur un autre monde. Désormais la direction doit décider quel sens durable portera cette réussite : prestige national, puissance industrielle, ambition scientifique ou confiance martiale. Le dividende de la Lune façonnera les décennies à venir."
 CHI_space_events.20.e: "Un triomphe de notre résolution"
 CHI_space_events.20.t: "L'héritage de l'alunissage"
 chi_uighur.1.a: "Disperser avec la police antiémeute"
 chi_uighur.1.b: "Envoyer des responsables du Parti négocier"
 chi_uighur.1.c: "Arrestations de masse, accuser des agitateurs étrangers"
 chi_uighur.1.d: "Des manifestants ont envahi les rues d'Ürümqi après un incident entre résidents han et travailleurs ouïghours. La police antiémeute a bouclé les quartiers centraux, mais les foules grossissent. Le comité du Parti au Xinjiang attend des instructions de Pékin."
 chi_uighur.1.t: "Manifestations de rue à Ürümqi"
 chi_uighur.2.a: "Étendre l'État de surveillance"
 chi_uighur.2.b: "Proximité communautaire et aide économique"
 chi_uighur.2.c: "Exécutions publiques des auteurs"
 chi_uighur.2.d: "Un attentat à la bombe coordonné dans un quartier de marché animé a fait des victimes et brisé tout sentiment de normalité dans la ville. Le Mouvement islamique du Turkestan oriental a revendiqué la responsabilité. Les forces de sécurité sont en alerte maximale et Pékin exige une réponse rapide."
 chi_uighur.2.t: "Attentat à la bombe au marché d'Ürümqi"
 chi_uighur.3.a: "Imposer la loi martiale à Ürümqi"
 chi_uighur.3.b: "Détentions de masse, camps de « rééducation »"
 chi_uighur.3.c: "Négocier avec les leaders de la communauté ouïghoure"
 chi_uighur.3.d: "Les tensions accumulées depuis des mois ont débouché sur une violence ouverte à Ürümqi et dans plusieurs districts périphériques. Les affrontements entre manifestants ouïghours et résidents han ont submergé la police locale. L'ampleur des troubles, rappelant les émeutes de 2009, exige une décision immédiate du centre du Parti."
 chi_uighur.3.t: "Le Xinjiang sombre dans des émeutes à grande échelle"
 chi_uighur.4.a: "Rejeter toute ingérence dans nos affaires intérieures"
 chi_uighur.4.b: "Autoriser une visite d’information limitée de l’ONU"
 chi_uighur.4.d: "Les rapports de détentions de masse et l'établissement de centres de rééducation au Xinjiang ont provoqué une vive condamnation des gouvernements occidentaux, de la Turquie et des organismes internationaux des droits de l'homme. Les appels à une enquête indépendante se multiplient, et plusieurs capitales menacent de mesures punitives."
 chi_uighur.4.t: "La communauté internationale condamne Pékin"
 chi_uighur.5.a: "Fonctionnement silencieux, perturbation totale"
 chi_uighur.5.d: "Les services de sécurité ont identifié et localisé une cellule militante préparant des attentats à travers le Xinjiang. Agissant sur un renseignement précis, une opération discrète a démantelé le réseau avant qu'il ne frappe."
 chi_uighur.5.t: "Percée en matière de renseignement antiterroriste"
 chi_uighur.6.a: "Une réponse ferme rétablira l'ordre"
 chi_uighur.6.b: "La poigne de fer de Pékin"
 chi_uighur.6.d: "Des troubles violents ont éclaté dans la région chinoise du Xinjiang. Des images de véhicules en feu et de forces de sécurité en tenue antiémeute circulent à l'international. Pékin a déclaré que l'ordre sera rétabli, mais l'ampleur des désordres attire le regard des gouvernements et observateurs du monde entier."
 chi_uighur.6.t: "Des émeutes secouent le Xinjiang"
 china_national_committee.02.a: "Désigner les commissions"
 china_national_committee.02.d: "Le Congrès national du Parti communiste chinois s'est réuni. Des délégués de tout le pays se sont rassemblés pour fixer l'orientation politique des cinq prochaines années. Les commissions les plus importantes et leur direction vont maintenant être désignées."
 china_national_committee.02.t: "Congrès national convoqué"
 china_news.44.a: "La fin de soixante-dix ans de division."
 china_news.44.d: "À la suite d'un ultimatum sino-américain conjoint, le gouvernement nord-coréen s'est dissous pacifiquement et a transféré la souveraineté à la République de Corée. La péninsule est de nouveau unie, sous le drapeau de Séoul. La dynastie Kim a pris fin sans guerre."
 china_news.44.t: "La péninsule coréenne réunifiée sous Séoul"
 china_news.45.a: "La dernière guerre de Corée commence."
 china_news.45.d: "Après le rejet par Pyongyang de l'ultimatum sino-américain conjoint, la Chine, les États-Unis et la Corée du Sud ont déclaré la guerre à la Corée du Nord. Pour la première fois de l'histoire, Pékin et Washington marchent ensemble contre le régime Kim."
 china_news.45.t: "Guerre déclarée à la Corée du Nord"
 china_news.boycott_streets.a: "Prenez note."
 china_news.boycott_streets.d: "Les manifestations antijaponaises sont passées des réseaux sociaux à la rue. Les concessions ferment, les Uniqlo planchent leurs vitrines, et les stocks Toyota restent invendus. Le gouvernement n'est pas intervenu."
 china_news.boycott_streets.t: "Le boycott s'étend dans les villes chinoises"
 china_news.panda_arrives_tokyo.a: "Prenez note."
 china_news.panda_arrives_tokyo.d: "Deux pandas géants, cadeau de la République populaire de Chine, sont arrivés à l'aéroport de Narita sous un enthousiasme public considérable. Le geste est un raccourci diplomatique pour une saison plus chaude dans les relations sino-japonaises."
 china_news.panda_arrives_tokyo.t: "Des pandas atterrissent à Narita"
 china_news.yasukuni_recall.a: "Prenez note."
 china_news.yasukuni_recall.d: "La Chine a rappelé son ambassadeur de Tokyo après la visite du Premier ministre japonais au sanctuaire de Yasukuni. La protestation diplomatique signale la détermination de Pékin à tenir le Japon responsable de la façon dont il honore ses morts de guerre."
 china_news.yasukuni_recall.t: "Pékin rappelle son ambassadeur"
 china_sar.034.a: "Ordonner une répression sécuritaire immédiate."
 china_sar.034.b: "Enquêter d'abord et engager les dirigeants locaux."
 china_sar.034.d: "Une attaque coordonnée a frappé un poste de sécurité dans le bassin du Tarim, faisant des victimes parmi la police et les civils. Pékin doit choisir entre un verrouillage sécuritaire immédiat et une réponse d'enquête plus lente dans la région agitée."
 china_sar.034.t: "Attaque au Xinjiang"
 china_scs.10.a: "Prendre note de l'escalade."
 china_scs.10.d: "Les rapports du renseignement décrivent un déploiement chinois coordonné de flottes de pêche, de milice maritime, de patrouilleurs des garde-côtes et de frégates en anneaux concentriques autour des récifs contestés de la mer de Chine méridionale. La doctrine, attribuée au contre-amiral Zhang Zhaozhong, ne laisse plus de place à un défi juridique une fois l'encerclement achevé. Nos revendications et intérêts dans la région sont désormais sous pression directe."
 china_scs.10.t: "Pékin adopte la stratégie du chou"
 china_scs.12.a: "Accepter le résultat."
 china_scs.12.d: "L'opération de confrontation a atteint sa conclusion. L'issue détermine le contrôle pratique du récif et les coûts diplomatiques que la Chine doit absorber."
 china_scs.12.t: "Impasse terminée"
 china_scs.13.a: "Lancez FONOPs immédiatement."
 china_scs.13.b: "Faire preuve de retenue pour l'instant."
 china_scs.13.d: "Le Département d'État a émis une démarche formelle et le Pentagone pèse ses options. Les opérations de liberté de navigation à travers les zones de douze milles nautiques des îles artificielles sont la réponse immédiate la plus probable. La Septième Flotte est en alerte."
 china_scs.13.t: "Washington réagit à l'empiètement chinois"
 china_scs.14.a: "Se retirer. Ne pas intercepter."
 china_scs.14.b: "Suivre le navire et protester."
 china_scs.14.c: "Intercepter et lancer un ultime avertissement."
 china_scs.14.d: "Un navire de l'US Navy est entré dans la zone de douze milles nautiques autour d'une installation d'île artificielle chinoise. La flotte de la mer du Sud attend des ordres. Reculer sera lu comme une acquiescence ; l'escorte maintient une présence sans escalade ; l'interception active risque un incident grave."
 china_scs.14.t: "Réponse de la PLAN à une FONOP"
 china_scs.15.a: "Déposer une protestation formelle et exiger réparation."
 china_scs.15.b: "Convoquer une session d'urgence du Conseil de sécurité."
 china_scs.15.d: "Une opération de liberté de navigation s'est achevée par une collision ou une confrontation en mer. Les deux camps publient des récits concurrents de ce qui s'est passé. Les médias internationaux exigent une enquête complète ; les publics nationaux des deux côtés réclament une réponse ferme."
 china_scs.15.t: "Incident de la mer du Sud"
 china_scs.20.a: "Le ciel au-dessus de la mer du Sud est chinois."
 china_scs.20.d: "Pékin a annoncé l'établissement d'une zone d'identification de défense aérienne couvrant la mer de Chine méridionale. Tout aéronef pénétrant dans la zone doit transmettre son identification, maintenir le contact radio et se conformer aux instructions du contrôle aérien chinois. Les États-Unis, le Japon, l'Australie et les Philippines ont immédiatement déclaré l'ADIZ illégale au regard du droit international."
 china_scs.20.t: "ADIZ en mer de Chine méridionale déclarée"
 china_scs.21.a: "Émettez un avertissement sévère par la voie diplomatique."
 china_scs.21.b: "Les escorter hors de la zone et publier un communiqué."
 china_scs.21.d: "Des intercepteurs de la PLAAF ont pris contact avec un aéronef militaire étranger transiting la zone de patrouille de mer de Chine méridionale sans se conformer aux procédures d'identification chinoises. L'appareil a été escorté ou interpellé ; la façon dont Pékin répond à l'incident façonne à la fois la crédibilité d'application de la zone de patrouille et la température des relations avec l'État d'origine de l'appareil."
 china_scs.21.t: "Aéronef étranger intercepté"
 china_scs.30.a: "S'engager dans le nouveau cadre."
 china_scs.30.d: "Pékin a annoncé que son engagement en mer de Chine méridionale se fera dans l'esprit des flottes au trésor de la dynastie Ming : par le commerce, le partenariat et le dialogue bilatéral plutôt que par la confrontation. Le cadre de la Route de la soie maritime est formellement étendu à tous les États riverains. L'ouverture à la désescalade est réelle, même si les revendications sous-jacentes n'ont pas changé."
 china_scs.30.t: "Pékin poursuit sa diplomatie maritime"
 china_scs.31.a: "Une avancée constructive."
 china_scs.31.d: "Dans une déclaration conjointe publiée après des pourparlers bilatéraux à Pékin, la Chine et ses voisins de mer de Chine méridionale ont réaffirmé leur engagement envers la Déclaration de 2002 sur la conduite des parties. La déclaration appelle à gérer les différends pacifiquement par des consultations bilatérales et renouvelle l'engagement contre les provocations unilatérales, une formulation que Pékin interprète comme excluant sa propre présence existante."
 china_scs.31.t: "Déclaration de 2002 réaffirmée"
 china_scs.32.a: "Accueillir Manille dans le nouveau partenariat."
 china_scs.32.b: "Maintenir l’alignement américain existant."
 china_scs.32.d: "Le président Duterte a prononcé à Pékin un discours annonçant la « séparation » des Philippines vis-à-vis des États-Unis et signalant une ouverture à une nouvelle relation avec la Chine. La déclaration a stupéfait Washington et ravi Pékin. La position de Manille sur la sentence arbitrale de mer de Chine méridionale est désormais délibérément ambiguë."
 china_scs.32.t: "Manille à la croisée des chemins"
 china_scs.33.a: "Un pas vers la stabilité régionale."
 china_scs.33.d: "Le Quotidien du Peuple rapporte que la Chine et son partenaire ont conclu un accord de développement maritime conjoint, établissant un cadre administratif partagé pour l'exploration d'hydrocarbures et les droits de pêche. L'accord est décrit comme « un modèle de coopération gagnant-gagnant et la Route de la soie maritime en action ». Les gouvernements revendicateurs non parties à l'accord déclinent de commenter."
 china_scs.33.t: "Accord de développement maritime conjoint signé"
 china_scs.34.a: "Offrir un délai de grâce et renégocier."
 china_scs.34.b: "Faire appliquer les termes d'origine."
 china_scs.34.c: "Annuler la dette en échange de concessions."
 china_scs.34.d: "Le gouvernement de l'État partenaire a annoncé qu'il ne peut honorer le remboursement prévu du prêt chinois de financement d'infrastructures des Nouvelles routes de la soie. L'opposition intérieure exige une renégociation des termes ; Pékin doit choisir entre une flexibilité qui préserve la relation et une fermeté qui préserve le précédent financier."
 china_scs.34.t: "Renégociation de la dette exigée"
 china_scs.35.a: "Un triomphe diplomatique."
 china_scs.35.d: "Pour la première fois, le communiqué du sommet de l'ASEAN a inclus un langage endossant explicitement la gestion bilatérale des différends en mer de Chine méridionale et rejetant l'implication de « parties extérieures ». La formulation a été insérée à l'insistance chinoise et a bloqué le passage d'un langage exigé par le Vietnam et les Philippines. Washington a condamné le résultat."
 china_scs.35.t: "Le sommet de l'ASEAN approuve la position chinoise"
 china_scs.36.a: "Renégocier les termes."
 china_scs.36.b: "Faire appliquer les termes d'origine."
 china_scs.36.c: "Retirer le prêt."
 china_scs.36.d: "Des figures de l'opposition intérieure et des groupes de la société civile dans l'État partenaire ont lancé une campagne publique contre le prêt chinois des Nouvelles routes de la soie, citant des taux d'intérêt défavorables, des préoccupations environnementales et la crainte d'une dépendance stratégique. Le gouvernement est sous pression pour renégocier ; Pékin doit choisir entre protéger le précédent financier et préserver la relation politique."
 china_scs.36.t: "Contrecoup de la dette"
 china_scs.40.a: "Pousser à l'acceptation intégrale du projet chinois."
 china_scs.40.b: "Accepter un compromis pour faire signer l'accord."
 china_scs.40.d: "Les négociations sur le Code de conduite en mer de Chine méridionale sont entrées dans leur dernier round. Le projet chinois exclut le règlement obligatoire des différends, limite le champ géographique pour exclure les zones de construction chinoise active, et interdit aux États non membres de l'ASEAN tout rôle de supervision. Les États revendicateurs sont divisés entre accepter un accord imparfait et continuer indéfiniment sans accord."
 china_scs.40.t: "Négociations du code de conduite : dernier tour"
 china_scs.41.a: "La région a parlé."
 china_scs.41.d: "Le Département d'État a publié une déclaration prenant acte de l'entrée en vigueur du Code de conduite ASEAN-Chine sur la mer de Chine méridionale. La déclaration note les objections américaines à plusieurs dispositions mais reconnaît l'accord comme le cadre régissant la région. Les analystes y voient un recul significatif par rapport à l'insistance de longue date de l'Amérique sur la CNUDM comme seul cadre."
 china_scs.41.t: "Washington prend acte du Code de conduite"
 china_scs.50.a: "Préparez une réponse."
 china_scs.50.d: "Un éditorial du Quotidien du Peuple, diffusé par les canaux diplomatiques avec un apparent endossement étatique, invoque la doctrine classique des Quatre Mers (四海, Sihai) et présente les revendications maritimes chinoises comme la restauration d'un ordre naturel interrompu. L'annonce d'expansion navale qui l'accompagne ne laisse aucun doute sur l'intention de Pékin. L'ordre maritime d'après 1945 dans le Pacifique occidental est désormais ouvertement contesté."
 china_scs.50.t: "Pékin affirme le mandat des mers"
 china_scs.51.a: "Leurs protestations sont notées."
 china_scs.51.b: "Proposer une déclaration d'apaisement pour réduire l'inquiétude."
 china_scs.51.d: "L'invocation formelle par la Chine du système tributaire a produit des réactions fortement divergentes. Les ministres des Affaires étrangères de l'ASEAN ont publié une déclaration conjointe d'urgence rejetant toute prétention à une suzeraineté historique. Les États-Unis, le Japon et l'Australie ont annoncé une réponse diplomatique coordonnée. En Chine, les médias d'État ont couvert les réactions comme la confirmation que la restauration de la dignité nationale dérange ceux qui ont profité du Siècle d'humiliation."
 china_scs.51.t: "Le monde réagit à la rhétorique tributaire"
 china_scs.52.a: "Reconnaissez l’autorité chinoise."
 china_scs.52.b: "Rejeter l'ultimatum."
 china_scs.52.d: "L'ambassadeur chinois a délivré un ultimatum formel exigeant la reconnaissance de l'autorité administrative chinoise sur les eaux contestées de mer de Chine méridionale dans les soixante-douze heures. Le gouvernement doit maintenant décider : accepter les termes et préserver la relation, ou refuser et en assumer les conséquences."
 china_scs.52.t: "Ultimatum livré"
 china_scs.53.a: "Lancez un ultimatum commun."
 china_scs.53.b: "Protestation diplomatique uniquement."
 china_scs.53.c: "Ne pas s'en mêler."
 china_scs.53.d: "Pékin a lancé un ultimatum à un revendicateur de mer de Chine méridionale qui a refusé de s'y conformer. Washington affronte un choix : honorer ses engagements de sécurité en se joignant à un ultimatum conjoint contre la Chine, se limiter à une protestation formelle qui préserve la relation, ou rester entièrement à l'écart. La décision dépend de la préparation navale, de la crédibilité des alliances, et du capital politique que l'administration est prête à dépenser pour un différend dans des eaux à six mille kilomètres."
 china_scs.53.t: "Crise en mer de Chine méridionale"
 china_scs.54.a: "Se conformer et se retirer."
 china_scs.54.b: "Refuser. Ils ne dicteront pas à la Chine."
 china_scs.54.d: "Les États-Unis se sont joints au revendicateur pour présenter à Pékin une demande formelle de retirer ses forces du récif contesté et de lever l'ultimatum. La Septième Flotte est en alerte renforcée. Se conformer signifie reculer ; refuser signifie affronter le poids naval combiné des États-Unis et de leurs partenaires régionaux. Le Comité permanent du Politburo a été convoqué."
 china_scs.54.t: "L'ultimatum de Washington"
 china_scs.55.a: "Puisse-t-il en rester ainsi longtemps."
 china_scs.55.d: "Les dépêches des installations de la PLAN en mer de Chine méridionale rapportent des atmosphères variées à travers la flotte. Sur le récif de Fiery Cross, les marins photographient le lever de soleil sur des eaux que leurs cartes marquent désormais comme patrie. Sur le porte-avions, l'équipage se prépare aux exercices. Au poste des garde-côtes de Scarborough, un officier de quart note qu'aucun navire étranger n'a approché la ligne d'exclusion depuis quatre-vingt-dix jours. La mer du Sud est calme."
 china_scs.55.t: "Voix de la flotte de la mer du Sud"
 china_scs.56.a: "La mer du Sud doit être sécurisée."
 china_scs.56.d: "Après le rejet de l'ultimatum de Pékin par le revendicateur, des groupes de surface de la PLAN se sont mis en mouvement pour le faire appliquer. Un engagement naval bref et vif a commencé autour du récif contesté des Spratleys. Les deux camps n'engagent que des forces limitées ; l'issue déterminera le contrôle de l'État et si le revendicateur se tourne vers Washington pour une intervention."
 china_scs.56.t: "L'escarmouche des Spratleys"
 china_scs.57.a: "Accepter la défaite et chercher des termes."
 china_scs.57.b: "Faire appel aux États-Unis."
 china_scs.57.d: "L'engagement frontalier s'est achevé par une défaite. Le récif contesté est désormais sous contrôle chinois et ses forces se sont retirées. Le gouvernement doit décider s'il accepte la perte et préserve ce qui reste de souveraineté, ou s'il fait appel aux États-Unis, un choix qui risque d'entraîner Washington dans une confrontation qu'il n'accueillera peut-être pas."
 china_scs.57.t: "Appel aux alliés américains"
 china_scs.58.a: "Se retirer et réévaluer."
 china_scs.58.d: "Des unités de la marine de l'APL ont engagé les forces du revendicateur autour du récif contesté et se sont retirées sans sécuriser la position. L'escarmouche fut limitée et contenue, mais le récit diplomatique est celui d'un dépassement chinois et d'un déficit militaire. Pékin doit absorber le coût politique tandis que la posture stratégique plus large se poursuit."
 china_scs.58.t: "Revers d'escarmouche aux Spratleys"
 china_scs.60.a: "Prendre note du nouvel alignement."
 china_scs.60.d: "L'agressivité chinoise en mer de Chine méridionale ayant dépassé un seuil que la région ne peut plus absorber diplomatiquement, les États-Unis, le Japon, l'Inde et l'Australie ont formalisé leur coopération de sécurité en un Quad opérationnel. Patrouilles navales conjointes, partage de renseignement et positions diplomatiques coordonnées sont annoncés. La formation est une réponse directe à la posture de Pékin et signale que la contestation de la mer de Chine méridionale a acquis une dimension de grandes puissances."
 china_scs.60.t: "L'initiative quadrilatérale"
 china_scs.70.a: "S'excuser discrètement et se retirer."
 china_scs.70.b: "Tenir bon. Ces eaux relèvent des droits historiques de la Chine."
 china_scs.70.d: "Des navires de la milice maritime chinoise ont été détectés opérant dans la zone économique exclusive indonésienne des Natuna, escortés par les garde-côtes. Jakarta a déposé une protestation formelle, rappelé son ambassadeur et déployé des navires pour suivre les bâtiments chinois. L'Indonésie ne conteste pas publiquement la ligne en neuf traits, mais l'intrusion met à l'épreuve les limites de sa patience stratégique et risque d'entraîner le plus grand État de l'ASEAN dans une confrontation ouverte avec Pékin."
 china_scs.70.t: "Incident de Natuna"
 sino_indian.1.d_opt: "Nous ne pouvons intervenir pour le moment."
 sino_indian.20.a: "Un effort de coalition défensif. Nous protégeons la région."
 sino_indian.20.b: "Une expédition punitive. Rapide, décisif, brutal."
 sino_indian.20.c: "Pied de guerre total de la coalition. Nous en finissons définitivement."
 sino_indian.20.d: "Le cadre de coalition contre les factions talibanes et du TTP dans les zones frontalières afghano-pakistanaises est en place. Les commandants attendent une orientation politique sur la nature de l'opération. Le choix façonnera la perception du rôle de la Chine en Asie centrale, dans la région et dans le monde."
 sino_indian.20.t: "Opération Tigre des montagnes : définir la mission"
 sino_indian.21.a: "Accepter. Entamez un dialogue formel."
 sino_indian.21.b: "Répondre avec prudence. Faire confiance, mais vérifier."
 sino_indian.21.c: "Rejeter. C'est une feinte."
 sino_indian.21.d: "La Chine a pris une série de mesures pour se distancer d'Islamabad et signaler une nouvelle orientation vers New Delhi. Le geste arrive sans conditions préalables, mais ses implications stratégiques sont claires. L'Inde doit décider si elle s'engage, et à quelles conditions."
 sino_indian.21.t: "Pékin tend une main inattendue"
 sino_indian.22.a: "Une posture défensive. Nous avons été provoqués."
 sino_indian.22.b: "Une expédition punitive. Comme en 1962."
 sino_indian.22.c: "Pied de guerre total. Régler la ligne McMahon pour toujours."
 sino_indian.22.d: "Des forces de l'APL ont engagé des unités indiennes le long de la Ligne de contrôle réel. L'affrontement est assez grave pour exiger une décision politique. Pékin doit définir le caractère politique de cette action militaire avant qu'elle ne se définisse d'elle-même."
 sino_indian.22.t: "L'heure des comptes de Galwan"
 sino_indian.30.a: "Excellent."
 sino_indian.30.b: "Une évolution intéressante."
 sino_indian.30.d: "La médiation orchestrée par la Chine entre factions talibanes rivales a provoqué une rupture inattendue. Un bloc dur a rompu avec la direction principale sur les termes proposés, dénonçant publiquement le processus. La scission affaiblit la cohésion talibane et ouvre une brèche pour la coalition."
 sino_indian.30.t: "Les factions talibanes se divisent sur les négociations"
 sino_indian.31.a: "Nous nous y attendions."
 sino_indian.31.d: "La déclaration par Pékin d'un pied de guerre total de coalition en Asie centrale a suscité l'inquiétude à Ankara et à Téhéran. Les deux capitales voient la mobilisation comme une projection de la portée militaire chinoise dans une région qu'elles considèrent comme leur propre périphérie stratégique."
 sino_indian.31.t: "La mobilisation de guerre de la coalition alarme les puissances régionales"
 sino_indian.32.a: "Accepter le pacte. Nous avons besoin de protection."
 sino_indian.32.b: "Rejeter. Nous conservons notre autonomie stratégique."
 sino_indian.32.d: "Au lendemain de l'offensive chinoise sur le front himalayen, Washington a approché New Delhi avec une offre formelle de pacte de défense bilatéral. Les planificateurs américains voient l'Inde comme un contrepoids critique à la puissance chinoise. Pour l'Inde, l'acceptation signifierait des garanties de sécurité mais aussi un alignement plus profond avec les États-Unis."
 sino_indian.32.t: "Washington propose un pacte de défense"
 sino_indian.33.a: "Se préparer à la pression chinoise"
 sino_indian.33.d: "Le regain d'engagement chinois en Asie du Sud signale un défi direct à la sphère d'influence traditionnelle de l'Inde. New Delhi doit préparer sa réponse."
 sino_indian.33.t: "Pékin se tourne vers l'Asie du Sud"
 sino_indian.34.a: "Prendre les fusils et les ordres"
 sino_indian.34.b: "Refuser d'être le relais de Pékin"
 sino_indian.34.d: "La Chine offre au Parti communiste unifié du Népal armes, formation et appui politique pour intensifier l'insurrection contre Katmandou. L'acceptation lie le mouvement au patronage de Pékin, une dette qui sera appelée si jamais la bannière rouge flotte sur Singha Durbar."
 sino_indian.34.t: "Pékin tend la main aux maoïstes"
 sino_indian.35.a: "Accepter le cadre"
 sino_indian.35.b: "Refuser pour l'instant"
 sino_indian.35.d: "Pékin a tendu la main à Katmandou avec une offre de coopération économique et d'infrastructures, formulée autour du respect mutuel du statut neutre du Népal."
 sino_indian.35.t: "La Chine propose un cadre de coopération"
 sino_indian.36.a: "Accepter le partenariat"
 sino_indian.36.b: "Décliner poliment"
 sino_indian.36.d: "La Chine a proposé au Bangladesh un partenariat stratégique formel, adossé à une garantie de sécurité et à des liens commerciaux élargis. Dacca doit peser les bénéfices face à la réaction probable de New Delhi."
 sino_indian.36.t: "Pékin propose à Dacca un partenariat stratégique"
 sino_indian.37.a: "Nous acceptons ce geste"
 sino_indian.37.d: "Dans un geste diplomatique inattendu, la Chine a formellement renoncé à ses revendications territoriales en suspens le long de la frontière nord du Bhoutan. Thimphou salue l'annonce."
 sino_indian.37.t: "Pékin abandonne ses revendications sur le Bhoutan"
 sino_indian.38.a: "Embrasser le partenariat"
 sino_indian.38.b: "Nous avons besoin de notre propre espace"
 sino_indian.38.d: "La Chine a offert au Pakistan une déclaration de partenariat permanent — le lien des Frères de fer — cimentant leur alliance par tous temps au plus haut niveau politique."
 sino_indian.38.t: "Pékin propose un pacte des Iron Brothers"
 sino_indian.39.a: "Se concentrer sur la guerre terrestre"
 sino_indian.39.b: "Miser sur la puissance aérienne"
 sino_indian.39.c: "Se concentrer sur les capacités navales"
 sino_indian.39.d: "L'industrie de défense chinoise est prête à transférer du savoir au Pakistan. Islamabad doit décider quel domaine bénéficie le plus de la collaboration."
 sino_indian.39.d_opt: "Se concentrer sur la technologie nucléaire"
 sino_indian.39.t: "Projets militaires conjoints : choisir une priorité"
 sino_indian.40.a: "Désigner formellement l'ETIM comme organisation terroriste"
 sino_indian.40.b: "Décliner la demande"
 sino_indian.40.d: "La Chine a formellement demandé au Pakistan de désigner le Mouvement islamique du Turkestan oriental comme organisation terroriste. Islamabad doit peser les bénéfices antiterroristes face aux sensibilités politiques intérieures."
 sino_indian.40.t: "Pékin demande la désignation de terroriste de l'ETIM"
 sino_indian.41.a: "Saluer l'investissement"
 sino_indian.41.d: "Pékin a confirmé le lancement du programme complet du corridor économique Chine-Pakistan. L'investissement massif en infrastructures va remodeler les réseaux de transport et d'énergie du Pakistan."
 sino_indian.41.t: "Le corridor économique Chine-Pakistan commence"
 sino_indian.42.a: "Nous saluons le partenariat"
 sino_indian.42.d: "Pékin a proposé d'étendre les installations d'accostage du port de Gwadar pour accueillir des navires de la marine chinoise. Islamabad gagnera en échange une nouvelle capacité de chantier naval."
 sino_indian.42.t: "La Chine considère Gwadar comme une plaque tournante navale"
 sino_indian.43.a: "Rejoindre le mécanisme"
 sino_indian.43.d: "La Chine a invité le Pakistan à rejoindre le Mécanisme de coopération et de coordination quadrilatéral, un cadre antiterroriste conjoint liant Pékin, Kaboul, Islamabad et Douchanbé."
 sino_indian.43.t: "Le QCCM : Islamabad invitée à rejoindre"
 sino_indian.44.a: "Rejoindre le mécanisme"
 sino_indian.44.d: "La Chine a invité l'Afghanistan à rejoindre le Mécanisme de coopération et de coordination quadrilatéral, un cadre antiterroriste conjoint liant Pékin, Kaboul, Islamabad et Douchanbé."
 sino_indian.44.t: "Le QCCM : Kaboul invitée à rejoindre"
 sino_indian.45.a: "Rejoindre le mécanisme"
 sino_indian.45.d: "La Chine a invité le Tadjikistan à rejoindre le Mécanisme de coopération et de coordination quadrilatéral, un cadre antiterroriste conjoint liant Pékin, Kaboul, Islamabad et Douchanbé."
 sino_indian.45.t: "Le QCCM : Douchanbé invitée à rejoindre"
 sino_indian.46.a: "Combattez aux côtés de la Chine"
 sino_indian.46.b: "C'est la guerre de la Chine à mener"
 sino_indian.46.d: "Pékin a demandé au Pakistan de rejoindre une campagne militaire combinée contre les talibans et le TTP. Un effort conjoint serait bien plus décisif — mais aussi un engagement bien plus lourd."
 sino_indian.46.t: "La Chine propose des opérations conjointes en Afghanistan"
 sino_indian.47.a: "Coordonner la sécurité frontalière"
 sino_indian.47.d: "Pékin a établi une zone conjointe de gestion frontalière et de coordination antiterroriste dans le corridor du Wakhan. Tous les États partenaires bénéficieront d'un meilleur partage du renseignement."
 sino_indian.47.t: "La Chine lance l'initiative du tampon du Wakhan"
 sino_indian.48.a: "Prendre acte du geste"
 sino_indian.48.b: "Nous restons sceptiques"
 sino_indian.48.d: "La décision de la Chine de se distancer d'Islamabad n'est pas passée inaperçue à New Delhi. Qu'il s'agisse d'un réel réalignement ou d'une manœuvre temporaire reste une question ouverte."
 sino_indian.48.t: "L'Inde évalue le revirement de Pékin sur le Pakistan"
 sino_indian.49.a: "Enregistrer une protestation formelle"
 sino_indian.49.b: "Accepter la nouvelle réalité régionale"
 sino_indian.49.d: "Le traité d'amitié sino-indien a envoyé des ondes de choc à Washington. Qu'il représente un nouvel ordre stable ou une menace pour les intérêts américains dans la région se débat désormais au plus haut niveau."
 sino_indian.49.t: "Washington réagit au traité sino-indien"
 sino_indian.50.a: "Se soumettre à l'autorité chinoise"
 sino_indian.50.b: "Le Bhoutan ne se soumettra jamais"
 sino_indian.50.d: "La Chine a présenté au Bhoutan un choix brutal : soumission formelle à l'autorité de Pékin, ou affronter les conséquences de la force militaire. Thimphou a peu de marge de manœuvre."
 sino_indian.50.t: "Pékin adresse un ultimatum à Thimphou"
 sino_indian.51.a: "Accepter les termes"
 sino_indian.51.b: "Le Népal résistera"
 sino_indian.51.d: "La Chine a exigé que le Népal accepte un statut formel d'État associé sous l'autorité de Pékin. Katmandou doit décider de se conformer ou de résister."
 sino_indian.51.t: "Pékin adresse un ultimatum à Katmandou"
 sino_indian.52.a: "Accepter le partenariat"
 sino_indian.52.b: "Décliner la demande"
 sino_indian.52.d: "La Chine a formellement demandé un accès logistique et de basage dans nos ports au titre de la stratégie dite du Collier de perles. En échange, Pékin offre un important paquet de partenariat économique."
 sino_indian.52.t: "Pékin demande des droits de base navale"
 sino_indian.53.a: "Acceptez l’étreinte de Pékin"
 sino_indian.53.b: "La révolution ne répond à aucun maître étranger"
 sino_indian.53.d: "La République populaire du Népal triomphe à Katmandou, mais les fusils qui ont gagné la révolution étaient estampillés Norinco. Pékin attend désormais du nouvel État qu'il prenne place dans la sphère chinoise comme État associé. Un refus ne sera pas reçu poliment."
 sino_indian.53.t: "Le projet de loi de Pékin arrive à échéance"
 sino_indian.54.a: "Un excellent partenariat"
 sino_indian.54.d: "Le Pakistan a accepté notre offre de recherche militaire conjointe et choisi son domaine. Nos industries de défense coordonneront désormais le développement sur la spécialisation convenue, et nos chercheurs ont à y gagner."
 sino_indian.54.t: "Islamabad rejoint les programmes militaires conjoints"
 sino_indian.55.a: "Un pied-à-terre sur la mer d'Arabie"
 sino_indian.55.d: "Islamabad a formellement accueilli nos forces navales au port de Gwadar. Les installations d'accostage élargies et l'arrangement de basage nous donnent un pied-à-terre stratégique sur la mer d'Arabie, ancrant notre présence le long de l'ouest de l'océan Indien."
 sino_indian.55.t: "Gwadar s'ouvre à la marine de l'Armée populaire de libération"
 CHI_advanced_node_chips_trait: "Puces de nœuds avancés"
 CHI_advanced_node_chips_trait_desc: "Le procédé équivalent 7 nm de SMIC alimente les systèmes de commandement et de contrôle du CETC en processeurs nationaux. Élimine le goulet d'étranglement d'approvisionnement étranger pour l'électronique de traitement du signal."
 CHI_hbm_compute_trait: "Calcul de guidage basé sur HBM"
 CHI_hbm_compute_trait_desc: "Les piles HBM2 de CXMT soutiennent la fusion de capteurs avancée et la classification de cibles dans les systèmes d'intercepteurs et de défense aérienne de CASIC. L'approvisionnement national met fin à la dépendance à la mémoire étrangère."
 CHI_imfm_jsw_partnership: "Partenariat des aciéries japonaises"
 CHI_imfm_jsw_partnership_desc: "Ce partenariat transfère les procédés de forgeage de grand diamètre et d'acier à haute dureté de Japan Steel Works, améliorant directement la qualité de production des matériaux structurels de l'usine."
 CHI_imfm_komatsu_partnership: "Partenariat Komatsu"
 CHI_imfm_komatsu_partnership_desc: "La coopération avec Komatsu Defense introduit des méthodes de construction de blindage léger modulaire et des pratiques d'intégration de systèmes de véhicules développées pour les programmes de véhicules d'autodéfense du Japon."
 CHI_imfm_mhi_partnership: "Partenariat Mitsubishi Heavy Industries"
 CHI_imfm_mhi_partnership_desc: "Un accord de fabrication sous licence avec Mitsubishi Heavy Industries importe une méthodologie avancée de conception de blindage et des techniques de protection composite dans le programme de véhicules de l'usine."
 CHI_indigenous_euv_trait: "Intégration EUV autochtone"
 CHI_indigenous_euv_trait_cetc: "Intégration EUV autochtone"
 CHI_indigenous_euv_trait_cetc_desc: "La lithographie de type SiCarrier produit la prochaine génération de processeurs CNC du CETC, d'ASIC de capteurs et d'électronique arrière de radar. Le coût par wafer baisse à mesure que la chaîne d'outils nationale mûrit."
 CHI_indigenous_euv_trait_desc: "La lithographie de type SiCarrier produit des puces de grade spatial et missile dans le programme CASC. Approvisionnement national de bout en bout pour les systèmes stratégiques."
 CHI_kirin_avionics_trait: "Intégration de l'avionique Kirin"
 CHI_kirin_avionics_trait_desc: "Des SoC dérivés du Kirin de HiSilicon alimentent les calculateurs de vol, systèmes de mission et suites de guerre électronique d'AVIC. Substitution nationale après la désignation sur la liste d'entités de 2019."
 CHI_norinco_howa_partnership: "Partenariat Howa Machinery"
 CHI_norinco_howa_partnership_desc: "Ce partenariat licence les procédés d'usinage de précision des armes légères de Howa Machinery, relevant les tolérances de production et la constance de qualité sur les lignes d'armes d'infanterie de NORINCO."
 CHI_norinco_nec_partnership: "Partenariat NEC"
 CHI_norinco_nec_partnership_desc: "La coopération avec NEC Corporation intègre les normes électroniques C4ISR japonaises et l'ingénierie des systèmes embarqués dans les lignes de communications de champ de bataille et de capteurs de NORINCO."
 CHI_norinco_subaru_partnership: "Partenariat Subaru"
 CHI_norinco_subaru_partnership_desc: "Un arrangement de transfert de technologie avec Subaru Aerospace apporte des techniques de métallurgie de précision et un savoir de conception structurelle d'aéronefs à voilure tournante dans les lignes de production de NORINCO."
 CHI_norinco_toshiba_partnership: "Partenariat Toshiba"
 CHI_norinco_toshiba_partnership_desc: "Un arrangement de licence avec Toshiba Defense Systems introduit une conception avancée de réseaux radar et des techniques de fabrication de composants de guerre électronique dans la division électronique de NORINCO."
 CHI_norinco_trait_red_arrow_L_AT_Equipment_suite: "Suite ATGM Red Arrow série HJ"
 CHI_bop_drift_bo: "Influence de la faction Bo Xilai"
 CHI_bop_drift_hu: "Influence de la faction Hu Jintao"
 CHI_bop_drift_jiang: "Influence de la faction Jiang Zemin"
 CHI_bop_drift_xi: "Influence de la faction Xi Jinping"
 CHI_bop_drift_zeng: "Influence de la faction Zeng Qinghong"
 CHI_infantry_general: "Général d'infanterie"
 CHI_infantry_general_desc: "Le général Shin Fai a gravi les rangs des forces terrestres de l'Armée populaire de libération comme spécialiste des opérations d'infanterie de grande envergure. Il commande des formations de masse de Gardes rouges et d'infanterie d'assaut, avec un accent sur le déploiement rapide et la supériorité numérique."
 CHI_jiang_legacy_secured: "Héritage assuré"
 CHI_jiang_military_modernizer: "Modernisateur militaire"
 CHI_jiang_reformer: "Architecte de l'ère des réformes"
 CHI_jiang_security_tsar: "Tsar de la sécurité"
 CHI_nuke_general: "Général nucléaire"
 CHI_nuke_general_desc: "Le général Tsing Shi Tao est la première autorité de l'APL en matière de guerre nucléaire et radiologique. Il plaide pour l'intégration directe des capacités nucléaires tactiques dans les opérations conventionnelles, une doctrine qui lui a valu à la fois le respect et la controverse au sein de l'état-major général."
 CHI_special_weapons_general: "Commandant d'armes spéciales"
 CHI_special_weapons_general_desc: "Le général Leang est l'un des commandants supérieurs les plus polyvalents de l'APL, combinant l'expertise des systèmes d'armes avancés et la doctrine d'artillerie conventionnelle. Regardée comme un prodige au sein de l'état-major général, elle est connue pour sa capacité à intégrer des technologies de pointe dans les opérations interarmes."
 CHI_tank_general: "Général de char"
 CHI_tank_general_desc: "Le général Kwai est parmi les premiers commandants de guerre blindée de l'APL, connu pour son usage agressif des formations de chars lourds et sa conviction que la puissance de feu écrasante décide des batailles avant que l'ennemi ne puisse réagir."
 CHI_two_centenary_supreme_commander: "Commandant suprême de la nouvelle ère"
 CHI_wolf_warrior_spirit: "Esprit Guerrier Loup"
 CHI_wolf_warrior_spirit_desc: "Nos diplomates défendent agressivement nos intérêts nationaux et contestent les récits occidentaux sur la scène mondiale."
 CHI_xi_abolishes_limits: "Leader suprême"
 CHI_xi_peoples_champion: "Champion du peuple"
 CHI_zeng_succession_architect: "Architecte de la relève"
 chinese_aligned: "Aligné sur la Chine"
 chinese_aligned_desc: "Cet officier entretient des contacts discrets avec le renseignement chinois. La coordination de la planification conjointe vient naturellement, bien que la loyauté à l'État ne soit pas garantie."
 CHI_bri_completed_projects: "Projets terminés par la BRI"
 CHI_bri_completed_projects_desc: "Nombre total de projets BRI ayant atteint le statut opérationnel complet."
