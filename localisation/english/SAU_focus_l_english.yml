 SAU_republic_nda_party_1:0 "The National Charter"
 SAU_republic_nda_party_1_desc:0 "Proclaim a written constitution that binds ruler and ruled alike to the law."
 SAU_republic_nda_party_2:0 "An Elected Majlis al-Shura"
 SAU_republic_nda_party_2_desc:0 "Transform the appointed Consultative Council into a freely elected national parliament."
 SAU_republic_nda_party_3:0 "The First Free Elections"
 SAU_republic_nda_party_3_desc:0 "Open the ballot to every citizen and let the people choose their own government."
 SAU_republic_nda_party_4:0 "An Independent Judiciary"
 SAU_republic_nda_party_4_desc:0 "Free the courts from the palace, founding a judiciary answerable only to the law."
 SAU_republic_nda_party_5:0 "Freedom of the Press"
 SAU_republic_nda_party_5_desc:0 "Lift the censor's hand from the newspapers and the airwaves."
 SAU_republic_nda_party_7:0 "The Anti-Corruption Commission"
 SAU_republic_nda_party_7_desc:0 "Found an independent watchdog to root the graft out of high office."
 SAU_republic_nda_party_8:0 "Decentralize the Provinces"
 SAU_republic_nda_party_8_desc:0 "Devolve real power to elected provincial councils across the realm."
 SAU_republic_nda_party_9:0 "Limit the Executive"
 SAU_republic_nda_party_9_desc:0 "Bind the presidency with term limits, so that no leader rules for life."
 SAU_republic_nda_party_10:0 "Liberalize the Economy"
 SAU_republic_nda_party_10_desc:0 "Throw open the closed economy to competition and private enterprise."
 SAU_republic_nda_party_11:0 "Privatize the State Sector"
 SAU_republic_nda_party_11_desc:0 "Sell the bloated state firms into private hands and let the market work."
 SAU_republic_nda_party_12:0 "Open to Foreign Investment"
 SAU_republic_nda_party_12_desc:0 "Welcome foreign capital to build the factories the kingdom never had."
 SAU_republic_nda_party_13:0 "Diversify Beyond Oil"
 SAU_republic_nda_party_13_desc:0 "Wean the republic off crude, building an economy that outlasts the wells."
 SAU_republic_nda_party_14:0 "Secure Property Rights"
 SAU_republic_nda_party_14_desc:0 "Enshrine the right to own, and the right to keep what one has built."
 SAU_republic_nda_party_15:0 "Free Trade Agreements"
 SAU_republic_nda_party_15_desc:0 "Sign open-trade pacts that bind Arabia to the markets of the world."
 SAU_republic_nda_party_16:0 "An Independent Central Bank"
 SAU_republic_nda_party_16_desc:0 "Free the monetary authority from political meddling."
 SAU_republic_nda_party_17:0 "Champion the Private Sector"
 SAU_republic_nda_party_17_desc:0 "Back the entrepreneurs and small businesses that drive a free economy."
 SAU_republic_nda_party_18:0 "Equality for Women"
 SAU_republic_nda_party_18_desc:0 "Strike down the guardianship laws and seat women as equals in public life."
 SAU_republic_nda_party_19:0 "Reform the Schools"
 SAU_republic_nda_party_19_desc:0 "Replace rote clerical instruction with a modern, secular curriculum."
 SAU_republic_nda_party_20:0 "Freedom of Religion"
 SAU_republic_nda_party_20_desc:0 "Guarantee every faith the right to worship freely and in the open."
 SAU_republic_nda_party_21:0 "A Secular Republic"
 SAU_republic_nda_party_21_desc:0 "Draw a firm line between mosque and state."
 SAU_republic_nda_party_22:0 "Empower Civil Society"
 SAU_republic_nda_party_22_desc:0 "Legalize the unions, charities, and associations that knit a free people together."
 SAU_republic_nda_party_23:0 "Guarantee Labor Rights"
 SAU_republic_nda_party_23_desc:0 "Secure the right to organize, to strike, and to a fair wage."
 SAU_republic_nda_party_24:0 "A Human Rights Charter"
 SAU_republic_nda_party_24_desc:0 "Bind the republic to the universal rights of all its people."
 SAU_republic_nda_party_25:0 "Realign with the West"
 SAU_republic_nda_party_25_desc:0 "Turn the republic toward Washington and Brussels as a partner among democracies."
 SAU_republic_nda_party_26:0 "Mend the Gulf"
 SAU_republic_nda_party_26_desc:0 "Reconcile with the Gulf states as a fellow Arab nation, monarchies and all."
 SAU_republic_nda_party_27:0 "Join the World's Institutions"
 SAU_republic_nda_party_27_desc:0 "Take Arabia's seat in the councils of the international order."
 SAU_republic_nda_party_28:0 "Open the Borders"
 SAU_republic_nda_party_28_desc:0 "Ease the flow of people and goods across a freer frontier."
 SAU_republic_nda_party_29:0 "An Arab Democratic League"
 SAU_republic_nda_party_29_desc:0 "Rally the democracies of the Arab world under a single banner led from Riyadh."
 SAU_republic_first_election_tt:0 "Free elections are permitted, and the first national election will be held in two weeks.\n\nthere will be increasing the parties that have focuses, unban all parties to allowe Fair Elections for the People of Arabia!"
 SAU_nda_growth_pol_tt:0 "Deepens the republic's institutions, strengthening the National Democratic Assembly with political power and stability."
 SAU_nda_growth_eco_tt:0 "Builds the free-market economy: faster construction and higher factory output."
 SAU_nda_growth_soc_tt:0 "Broadens the open society, raising the republic's stability."
 SAU_nda_growth_for_tt:0 "Opens Arabia to the world: more political power and faster research."
 SAU_air_03_tt:0 "It Unlock a Decisions will open when you complete F-15C/D Eagle Squadron and Peace Sun F-15 Eagle Program"

