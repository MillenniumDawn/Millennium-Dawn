 ENG_royal_navy_Idea4_desc: "A Marinha Real Britânica é uma das principais forças marítimas do mundo, com um legado histórico que remonta a séculos. Reconhecida por sua adaptabilidade e proeza tecnológica, a Marinha Real desempenha papel crucial na salvaguarda dos interesses marítimos do Reino Unido e na projeção de poder em escala global."
 ENG_royal_navy_Idea5: "Marinha Real Britânica"
 ENG_royal_navy_Idea5_desc: "A Marinha Real Britânica é uma das principais forças marítimas do mundo, com um legado histórico que remonta a séculos. Reconhecida por sua adaptabilidade e proeza tecnológica, a Marinha Real desempenha papel crucial na salvaguarda dos interesses marítimos do Reino Unido e na projeção de poder em escala global."
 ENG_british_foregin_legion_idea: "Legião Estrangeira Britânica"
 ENG_british_foregin_legion_idea_desc: "Permitimos que soldados de todo o mundo se juntem às Forças Armadas Britânicas para perseguir os interesses britânicos."
 ENG_field_army_expansion_idea: "Expansão do Exército de Campanha"
 ENG_field_army_expansion_idea_desc: "O exército de campanha ampliado foi concebido para se destacar em diversos ambientes operacionais, da guerra convencional a missões de manutenção da paz. Essa iniciativa se alinha à estratégia de defesa mais ampla do Reino Unido, enfatizando prontidão, mobilidade e interoperabilidade com forças aliadas. Ao investir no crescimento e na modernização de seu exército de campanha, o Reino Unido reforça seu compromisso de manter uma força terrestre versátil e ágil, capaz de enfrentar as ameaças em evolução do século XXI."
 ENG_multi_ocean_training: "Treinamento Multioceânico"
 ENG_multi_ocean_training_desc: "Este programa estratégico foca em aprimorar as capacidades e a prontidão da Marinha Real por meio de exercícios de treinamento especializados, simulações e cenários reais. Ao expor o pessoal naval aos desafios singulares de diferentes oceanos, do Atlântico ao Pacífico e além, a iniciativa garante adaptabilidade, versatilidade e operações marítimas eficazes em escala global."
 ENG_carrier_wing_procurement: "Aquisição de Ala Aérea para Porta-Aviões"
 ENG_carrier_wing_procurement_desc: "A iniciativa de Aquisição Ampliada de Ala Aérea para Porta-Aviões ressalta o compromisso do Reino Unido de reforçar o poder aéreo de seus porta-aviões da classe Queen Elizabeth. Esse esforço estratégico envolve a aquisição e a expansão de aeronaves embarcadas, com foco em plataformas avançadas para ampliar o alcance operacional e a versatilidade da ala aérea do porta-aviões. A iniciativa inclui a integração de aeronaves de ponta, como o F-35B Lightning II, ao lado de ativos de apoio e reconhecimento. Essa expansão visa fortalecer as capacidades dos porta-aviões, assegurando um grupo de ataque formidável capaz de operar em um espectro de missões."
 ENG_strategic_aircraft_strategy_idea: "Estratégia de Aeronaves Estratégicas"
 ENG_strategic_aircraft_strategy_idea_desc: "A Estratégia de Aeronaves Estratégicas visa garantir que o Reino Unido mantenha uma frota robusta e capaz de aeronaves estratégicas que possam apoiar eficazmente os objetivos de defesa nacional, contribuir para os esforços de segurança internacional e se adaptar às ameaças emergentes no ambiente de segurança global."
