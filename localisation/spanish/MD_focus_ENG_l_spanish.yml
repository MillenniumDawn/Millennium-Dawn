 ENG_military.007.t: "Puesto de avanzada en la Luna"
 ENG_military.007.d: "Nuestros científicos e ingenieros están listos para enviar astronautas y equipos para vivir de forma semipermanente en la Luna. Se enviará un total de aproximadamente 12 astronautas, junto con equipos, suministros, espacios habitables y objetos personales por valor de decenas de millones de dólares. Este puesto de avanzada deberá trasladarse con regularidad, ya que el día lunar dura 29 días terrestres, un periodo demasiado largo para que las baterías mantengan la energía almacenada en la Luna.\n\nLa base propiamente dicha se situará en los polos y será fácil de mover para obtener el máximo rendimiento de nuestros paneles solares. Además, se llevarán a cabo experimentos para determinar las condiciones de vida a largo plazo en la Luna. La extracción de hielo lunar no solo podría proporcionar agua líquida para las plantas y el sustento de los astronautas en la Luna, sino que también permitiría separarla en oxígeno e hidrógeno: combustible para cohetes.\n\nObtener la investigación necesaria para lograr esto puede llevar meses o años. Durante este tiempo, sin embargo, y utilizando los fondos destinados a este proyecto, construiremos un depósito en órbita alrededor de la Luna para facilitar el acceso a la superficie lunar y el repostaje para regresar a la Tierra.\n\nTodo esto es alcanzable dentro de la próxima década. Ahora, sin embargo, es el momento de lanzar."
 ENG_military.007.a: "¡Lanzar!"
 ENG_military.008.t: "Base Lunar Alfa"
 ENG_military.008.d: "Nuestros científicos e ingenieros han alunizado oficialmente y se encuentran en pleno proceso de instalación de la base lunar. Cada sección está dividida en \"módulos\", que no llegan a ser edificios independientes por sí mismos, pero tampoco forman una estructura única. Hay un módulo de habitabilidad para el descanso, un módulo de alimentación para el cultivo de alimentos, un módulo de laboratorio (que es el más grande y alberga la mayor parte del equipo científico), un módulo de mantenimiento con todas las herramientas para reparar lo que se rompa, un módulo de servicios recreativos (ya que estas personas van a estar aquí durante 6 meses y trabajar todo el día a diario no es bueno para la mente) y una buena cantidad de paneles solares.\n\nLos envíos de alimentos serán habituales durante estos primeros meses, ya que cultivar comida lleva su tiempo. El agua y el oxígeno se obtendrán a través del hielo lunar. Por último, estos científicos se quedarán hasta poco después de trasladarse a la siguiente ubicación en unos 6 meses, momento en el que los paneles solares dejarán de funcionar debido a que el día y la noche lunares donde se encuentra el puesto de avanzada duran 6 meses.\n\nLa Base Lunar Alfa está terminada."
 ENG_military.008.a: "¡Por la ciencia!"
 ENG_military.009.t: "La colonia progresa"
 ENG_military.009.d: "Nuestro puesto de avanzada científico en la Luna ha logrado un gran avance. Con la expansión de su red actual de paneles solares y los recientes descubrimientos que facilitan la separación del agua para producir oxígeno e hidrógeno, han sido capaces de generar suficiente oxígeno e hidrógeno para abastecer por completo al cohete de suministro más reciente. Este es un hito crucial que permitirá que la propia Luna, con el tiempo y la inversión necesarios, se convierta en un centro neurálgico para futuras empresas espaciales hacia el espacio exterior.\n\nEl espacio en sí se está volviendo más pequeño."
 ENG_military.009.a: "Se nos da bien ser pioneros"
 ENG_military.010.t: "Crisis en la Luna"
 ENG_military.010.d: "Es necesario tomar medidas drásticas de inmediato. Por razones que aún se desconocen, el módulo de habitabilidad se ha fracturado y ha \"explotado\".\n\nHace una hora, los 12 científicos realizaban sus tareas cuando, de repente, se produjo una fisura masiva en el módulo de habitabilidad.\n\nDado que las ondas no se propagan en el vacío, la mayoría no se dio cuenta de lo ocurrido hasta que vio físicamente los destrozos.\n\nExiste un fondo de emergencia como parte del presupuesto, por lo que no hay necesidad de asignar más recursos al proyecto, y los científicos siempre pueden dormir en los otros módulos aislados; sin embargo, esto ha asustado a muchos, señalando que unos cuantos, muchos o incluso todos nuestros científicos podrían haber muerto. Esto también ha minado la moral del equipo de investigadores. Por tanto, intentar mantener el puesto de avanzada en la Luna será políticamente costoso y es posible que deba realizarse una rotación de científicos antes de lo previsto debido al desgaste de la moral.\n\n¿Qué debemos hacer?"
 ENG_military.010.a: "¡Enviar ayuda de emergencia!"
 ENG_military.010.b: "Abandonar el proyecto. Esto no es para nosotros"
 ENG_military.011.t: "La colonia progresa aún más"
 ENG_military.011.d: "Nuestro puesto de avanzada lunar ha logrado otro avance fundamental. Han conseguido enviar a la Tierra Helio-3, un gas que parece perfecto para la fusión, ¡y los científicos en casa han descubierto cómo llevar a cabo la fusión con él! No solo eso, sino que la energía generada por esta fusión está cerca de la cantidad utilizada para realizar la reacción en primer lugar. Esto significa que, con algunas mejoras, ¡podríamos conseguir energía de fusión viable! Esto no solo aporta inmensos beneficios en casa, junto con conocimientos que podremos emplear al usar otros materiales para la fusión, sino que también podemos utilizarlo en la Luna, ¡permitiendo un puesto de avanzada permanente en lugar de bases móviles!\n\nTodo esto va muy adelantado respecto a lo previsto, lo cual es una sorpresa, y muchos en el UKSC no estaban preparados para implementar esto en la base lunar actual. Así pues, se necesita una nueva base lunar, en un lugar mucho mejor para una expansión rápida que la ubicación actual de la Base Lunar Alfa. Es hora de comenzar los preparativos para la Base Lunar Beta."
 ENG_military.011.a: "La vida sigue adelante"
 ENG_military.012.t: "Otra crisis en la Luna"
 ENG_military.012.d: "Hay que tomar más medidas drásticas ahora mismo. Dos módulos más se han fracturado. Esta vez, se trata tanto del módulo de alimentación como del de servicios recreativos.\n\nHace unos cuarenta minutos, un científico estaba a punto de entrar al módulo de alimentación cuando este explotó repentinamente. El científico se encuentra bien y nadie más que las plantas resultó dañado. Sin embargo, al estar adyacente al módulo de servicios recreativos, provocó que este también se agrietara y explotara. De nuevo, nadie resultó herido.\n\nEste nuevo incidente, sin embargo, ha puesto los pelos de punta a muchos en casa, cuestionando la seguridad de los módulos. Tras la explosión anterior, el UKSC reemplazó los módulos asegurando que no estallarían, pero parece que la presión prolongada puede hacer que algo se rompa con mucha más facilidad de lo habitual. El UKSC ya ha respondido con rapidez, ordenando la fabricación inmediata de nuevos módulos, así como una inspección minuciosa de todos los módulos actuales (ya que no se pueden \"retirar del mercado\" módulos que están en la Luna en este momento).\n\nCon la creciente presión en casa para detener el avance del proyecto hasta que se resuelvan todos los problemas de seguridad, la continuidad del programa de la base lunar queda en entredicho. Además de la oposición política, el fondo de emergencia se ha reducido a la mitad, por lo que el UKSC solicita otros 5000 millones de dólares para solucionar futuras complicaciones. Queda en tus manos decidir si continuamos."
 ENG_military.012.a: "¡Enviar más ayuda de emergencia!"
 ENG_military.012.b: "No podemos seguir haciendo las cosas así"
 ENG_military.013.t: "Base Lunar Beta"
 ENG_military.013.d: "A estas alturas, nuestros científicos e ingenieros en la Luna deben trasladarse a otra ubicación en los polos. Los costes para realizar este traslado ya están contemplados en el presupuesto a largo plazo, por lo que todavía no necesitamos añadir nueva financiación al proyecto.\n\nCon esta nueva base lunar, podremos utilizar los nuevos descubrimientos que hemos desenterrado para permitir que la base se establezca de forma permanente, a diferencia de nuestra base lunar anterior. Mediante el uso de mejores cohetes, una mejor generación de energía y una mejor extracción y separación del hielo, podemos utilizar esta nueva base (en un emplazamiento más adecuado para una rápida expansión) para facilitar los esfuerzos de colonización de la Luna. Esta no es la única buena noticia: empresarios y corporaciones acuden en masa al UKSC con solicitudes para instalar sus sistemas de minería recientemente desarrollados en la Luna. Incluso otros programas espaciales de otros países están ahora sumamente interesados en abrir puestos de avanzada científicos y mineros en la Luna; sin embargo, gracias a tus diligentes esfuerzos, no solo tenemos una enorme ventaja inicial, sino que somos el único país que intenta colonizar la Luna activamente.\n\nEl futuro en nuestra Luna es brillante y chino."
 ENG_military.013.a: "¡Por fin, la hora del té en la Luna!"
 ENG_Moonbase_beta_completed: "Base Lunar Beta completada"
 ENG_military.014.t: "Misión del rover de Marte"
 ENG_military.014.d: "Nuestros científicos e ingenieros están listos para enviar nuestro rover a Marte. Tiene un total de aproximadamente 14 sensores instalados, junto con equipos por valor de decenas de millones de dólares. Este rover deberá desplazarse con regularidad, ya que el día marciano dura 1 1/5 días terrestres, un periodo demasiado largo para que las baterías mantengan la energía almacenada en Marte.\n\nEl propio rover se situará en los polos y será fácil de mover para obtener el máximo rendimiento de nuestros paneles solares. Además, se llevarán a cabo experimentos para determinar las condiciones de vida a largo plazo en Marte. La extracción de hielo no solo podría proporcionar agua líquida para las plantas y el sustento de los futuros astronautas en Marte, sino que también permitiría separarla en oxígeno e hidrógeno: combustible para cohetes.\n\nObtener la investigación necesaria para lograr esto puede llevar meses o años. Durante este tiempo, sin embargo, y utilizando los fondos destinados a este proyecto, construiremos un depósito en órbita alrededor de Marte para facilitar el acceso a la superficie marciana y el repostaje para regresar a la Tierra.\n\nTodo esto es alcanzable dentro de la próxima década. Ahora, sin embargo, es el momento de lanzar."
 ENG_military.014.a: "¡Lanzar!"
 ENG_military.015.t: "Proyecto de Colonia Marciana"
 ENG_military.015.d: "Si los humanos quieren colonizar Marte, deben establecer una base permanente que sea autosuficiente. Este es el sueño de innumerables exploradores espaciales y la única forma de que la humanidad ponga un pie en el espacio. Todo esto se convertirá en realidad hoy."
 ENG_military.015.a: "¡Marte, allá vamos!"
 ENG_military.016.t: "Fallo del sistema de descenso"
 ENG_military.016.d: "Tras un viaje de casi 60 millones de kilómetros, nuestra nave espacial apareció finalmente sobre Marte. El óxido de hierro que recubre el planeta le confería un aspecto rojizo. El planeta, visible durante mucho tiempo solo a través de un lente, está ahora a la vista.\nLa nave espacial entra en modo de descenso. El capitán, que había practicado innumerables veces en el simulador, dio la orden, pero parecía haber un problema con el dispositivo de aterrizaje. En ese instante, grandes gotas de sudor cubrieron la frente del capitán."
 ENG_military.016.a: "Londres, hemos tenido un problema."
 ENG_military.017.t: "Fallo del vehículo"
 ENG_military.017.d: "Tras una angustiosa media hora, la nave espacial logró finalmente escapar del riesgo de estrellarse y aterrizó torpemente en la llanura Utopia Planitia de Marte. Este es también el lugar de aterrizaje del anterior rover Beagle. Está reconocida como la mayor cuenca de impacto de Marte y del sistema solar, con un diámetro estimado de 3300 kilómetros.\nTras el aterrizaje, la tripulación se trasladará a un rover especial y se dirigirá a la parte sur de la llanura para establecer una base, pero las vibraciones del impacto anterior de la nave espacial parecen haber afectado al rover. Está claro que la situación no se ha desarrollado necesariamente a favor de la tripulación."
 ENG_military.017.a: "Parece que hoy le pasa algo a nuestro dichoso vehículo."
 ENG_military.018.t: "Llegada a la base"
 ENG_military.018.d: "40 kilómetros: la primera vez que los seres humanos recorren una marcha tan larga en un planeta que no es la Tierra. Una distancia tan común en nuestro mundo representa un hito histórico en la astronáutica humana.\nTras pasar por el tenso proceso de montar el campamento, transmitir todos los datos necesarios a la Tierra y comprobar los parámetros de todos los equipos, el capitán, sentado en la cama, pudo por fin tomar un trago de té.\nA través de la ventana de material sintético transparente situada sobre su cabeza, un punto luminoso entre las estrellas brillaba con una sutil luz azul: era la Tierra.\n\n'Mejor', murmuró el capitán."
 ENG_military.018.a: "La buena mesa no teme la espera."
 ENG_military.019.t: "Aterrizaje exitoso"
 ENG_military.019.d: "Todo fue perfecto, tal como se esperaba; la nave espacial aterrizó exactamente en el lugar designado y el viaje de la humanidad a Marte comenzó en paz.\n"
 ENG_military.019.a: "Sabía que nuestra tripulación sería capaz de completar la misión."
 ENG_military.020.t: "Llegada a la base"
 ENG_military.020.d: "El punto de aterrizaje de la nave espacial era la ubicación preestablecida para la base, y la tripulación comenzó a acampar en el lugar para prepararse para la construcción de la primera base permanente de la humanidad en Marte. Nadie se percató de que las botas espaciales dejaban incontables huellas desordenadas sobre el suelo marciano."
 ENG_military.020.a: "Un pequeño paso para Marte, un gran salto para la humanidad."
 ENG_military.021.t: "Localizar fuente de agua"
 ENG_military.021.d: "El agua es un recurso esencial para la supervivencia humana. Uno de los propósitos principales de las actividades previas de exploración de Marte era encontrar fuentes de agua en el planeta. Aunque no hay lagos ni ríos superficiales como en la Tierra, los recursos hídricos de Marte existen básicamente en forma de hielo bajo la superficie marciana.\nSin embargo, la localización precisa actual requiere que alguien realice estudios sobre el terreno en persona."
 ENG_military.021.a: "¡No podemos sobrevivir sin nuestro té!"
 ENG_military.022.t: "Protección radiológica subterránea"
 ENG_military.022.d: "Debido a la delgada atmósfera de Marte y a la falta de un campo magnético planetario, la radiación del espacio llega a la superficie sin impedimento alguno. La base no podía proporcionar suficiente refugio cuando se construyó por primera vez, por lo que excavar un nido bajo tierra se convirtió en la primera opción para evitar la radiación.\nSer testigos del orgullo de crear una nueva base para el Reino Unido recordó a la tripulación los grandes días del Imperio Británico."
 ENG_military.022.a: "Britannia Gobierna el Espacio"
 ENG_military.023.t: "La primera cosecha en Marte"
 ENG_military.023.d: "El problema de las fuentes de agua se ha resuelto y la fuente de energía está cubierta temporalmente por la energía solar. Por lo tanto, la producción de alimentos (y de té) en Marte se ha convertido en el asunto más importante en este momento.\nLos cultivos tradicionales de cereales han sido descartados debido a sus ciclos de crecimiento y procesos de recolección, por lo que las patatas se han convertido en las primeras cosechas humanas cultivadas en Marte. Aunque Marte no es tan brillante como la Tierra debido a su distancia del sol, las patatas del invernadero parecen crecer más frondosas. La primera cosecha de la humanidad en Marte está a la vista."
 ENG_military.023.a: "Patatas totalmente naturales, orgánicas y cultivadas en Marte."
 ENG_military.024.t: "Tormenta de arena"
 ENG_military.024.d: "Las tormentas de arena son un acontecimiento común en Marte. Aunque la presión del aire en Marte es mucho más baja que la de la Tierra, la tormenta marciana no es tan devastadora como las leyendas anteriores sugerían, al igual que en esa película.\nSin embargo, el polvo en suspensión sigue planteando una gran cantidad de peligros ocultos para las bases humanas, especialmente dado que la energía solar es una fuente de energía indispensable para las instalaciones actuales."
 ENG_military.024.a: "Aquí no tenemos la oportunidad de salvar a Matt Damon."
 ENG_military.025.t: "Accidente"
 ENG_military.025.d: "Quien mucho va al monte, al final se topa con el tigre. La tormenta de polvo marciana duró mucho más de lo previsto anteriormente, y la vida útil de las baterías dentro de la base parecía encontrarse en una situación muy pesimista.\nPara continuar con la misión de la colonia en Marte, debemos tomar una decisión: elegir evacuar y buscar un nuevo emplazamiento, o continuar reparando las instalaciones dañadas."
 ENG_military.025.a: "Evacuar"
 ENG_military.025.b: "Reparar la base"
 ENG_military.026.t: "Evacuar"
 ENG_military.026.d: "No podemos esperar más. La situación es ahora muy crítica y es hora de utilizar los cohetes de reserva para la evacuación. Tras comprobar que todos los miembros del equipo habían subido a bordo sanos y salvos, el capitán miró atrás con renuencia hacia el edificio de la base que aún estaba en construcción. Reprimió la pena en su corazón y dio la orden a la inteligencia artificial de guía para lanzar la nave espacial.\n'¡Volveremos!' Mientras se elevaba una enorme columna de humo, la nave espacial se desprendió del suelo marciano y ascendió lentamente hacia el cielo."
 ENG_military.026.a: "Mientras hay vida, hay esperanza."
 ENG_military.027.t: "Reparar la base dañada"
 ENG_military.027.d: "No podemos cruzarnos de brazos a esperar, debemos comenzar las reparaciones de la base de inmediato a cualquier precio. De lo contrario, todos los avances que hemos logrado en Marte se echarán a perder y nadie podrá sobrevivir en este caos. Salvar la base significa salvarnos a nosotros mismos."
 ENG_military.027.a: "Con sacrificio y gran ambición, nos atrevemos a crear un nuevo mundo."
 ENG_military.028.t: "Proyecto Ciudad Marciana"
 ENG_military.028.d: "Hemos logrado avances sobresalientes en la construcción de la colonia de Marte, pero aún queda camino por recorrer antes de alcanzar nuestro objetivo final. ¿Deseamos seguir invirtiendo en la infraestructura marciana?"
 ENG_military.028.a: "Mejorar"
 ENG_military.028.b: "No es necesario"
 ENG_military.029.t: "Sí"
 ENG_military.029.d: "Con tan solo dar un paso más hacia adelante, nuestra misión en Marte estará completamente concluida. En nuestra agenda no caben las medias tintas."
 ENG_military.029.a: "No le pasemos esta responsabilidad a la siguiente generación."
 ENG_military.030.t: "No"
 ENG_military.030.d: "La base marciana actual es lo suficientemente completa y sería insensato seguir invirtiendo más recursos. Todavía tenemos muchos problemas que afrontar en la Tierra y es imposible limitarse a tirar el dinero al espacio."
 ENG_military.030.a: "Confiemos en la sabiduría de las generaciones futuras."
 ENG_military.031.t: "Ciudad Marciana completada"
 ENG_military.031.d: "Tras nuestros incansables esfuerzos, nuestra colonia en Marte finalmente se ha completado. La humanidad nunca olvidará este empeño y, algún día, el ser humano pondrá un pie en toda la galaxia."
 ENG_military.031.a: "Nuestro viaje abarca toda la galaxia."
 ENG_military.032.t: "Nueva subbase establecida"
 ENG_military.032.d: "A medida que más naves espaciales traían más personal y materiales, la base marciana original comenzó a prosperar. Los recursos hídricos bajo la base inicial ya no pueden sostener a más personas y es urgente establecer una nueva subbase.\nMientras la nave espacial del primer equipo desaparecía gradualmente de la vista, el antiguo capitán (y hoy alcalde de la primera Ciudad del Nuevo Londres) recordó los viejos tiempos en los que el rover de Marte cayó en una zanja."
 ENG_military.032.a: "Mamá, hoy me marcho en una larga travesía."
 ENG_military.033.t: "Monumento de la Ciudad Marciana"
 ENG_military.033.d: "A medida que los humanos han viajado a lo largo y ancho de Marte, este se ha convertido en el nuevo hogar para la humanidad de la Tierra. La terraformación de Marte avanza de manera ordenada. En el primer punto de aterrizaje de la nave espacial humana, se construyó un enorme monumento para conmemorar a los hombres y mujeres que sacrificaron sus vidas durante el viaje y la edificación en el proceso de conquista de Marte. Sus nombres quedarán grabados para siempre en la trayectoria de la civilización humana."
 ENG_military.033.a: "¡Por la humanidad!"
 ENG_mars_city_building_completed: "Construcción de Ciudad Marciana completada"
 ENG_military.001.t: "Lanzamiento de la Iniciativa de Minería de Asteroides"
 ENG_military.001.d: "La minería de asteroides ha sido una fantasía para muchos antes que nosotros. Los propios asteroides albergan metales muy cotizados del grupo del platino, oro, plata y metales del grupo del hierro. Podría convertirse en un negocio extremadamente lucrativo para cualquier país con capacidad espacial. Así que hoy, el establecimiento de la British Royal Asteroid Mining Company, o BRAMC, proporcionará el primer paso hacia la explotación de asteroides. Utilizando vastas redes de telescopios por todo el Imperio, podemos buscar asteroides adecuados en el espacio exterior cercano, para luego atraerlos a nuestra órbita y minarlos. Localizar un asteroide adecuado será difícil ya que, en relación con la distancia a la que se encuentran, son bastante pequeños. Por suerte, hay bastantes que pasan cerca de la Tierra de vez en cuando, por lo que no se tardará mucho en conseguir que uno se quede en la órbita terrestre."
 ENG_military.001.a: "Solo queda esperar a un asteroide..."
 ENG_military.002.t: "Asteroide localizado"
 ENG_military.002.d: "Recientemente, nuestros científicos de la BRAMC han localizado un asteroide adecuado que pasaba cerca de la Tierra. Esto ha sido un alivio para la BRAMC, ya que algunos dudaban de si llegaríamos a detectar un asteroide económicamente viable. Sin embargo, este asteroide se mueve lo suficientemente despacio, es lo bastante grande y es lo bastante rico en recursos como para ser trasladado a la órbita y ser minado. El asteroide es, de hecho, más grande que Gales. El siguiente paso consiste simplemente en mover este asteroide a la órbita alrededor de la Tierra, algo que nunca antes se ha hecho. Mientras tanto, los ingenieros del Mando Espacial Británico, e incluso empresas privadas como Virgin Galactic, han inventado mecanismos para minar el asteroide, por lo que estarán listos para cuando este llegue a la órbita."
 ENG_military.002.a: "Llevemos a ese pequeñuelo a la órbita"
 ENG_military.003.t: "Asteroide en órbita"
 ENG_military.003.d: "Con el asteroide en órbita, tanto el UKSC como Virgin están enviando misiones al asteroide orbitante. El UKSC se centra principalmente en recopilar datos científicos, mientras que Virgin Galactic está más interesada en la extracción del material. Sin duda, este es un logro histórico que nos otorga una ventaja en el espacio. Incluso se habla de traer más asteroides, pero muchos dicen que eso puede esperar, ya que este asteroide es muy grande y se adapta perfectamente a la minería. Otros países ya nos miran con envidia y sopesan sus propios programas de minería de asteroides. Los costes son extremadamente altos incluso para desarrollar la tecnología necesaria para llegar allí, por lo que hay poca preocupación en Virgin Galactic o el UKSC de que llegue competencia."
 ENG_military.003.a: "Que comience la minería"
 ENG_military.004.t: "Comienzan a llegar los beneficios de la minería"
 ENG_military.004.d: "Tras establecer las operaciones mineras, tanto Virgin Galactic como el UKSC han enviado sus primeros cargamentos de materiales espaciales a los laboratorios y mercados de todo el planeta. El mundo nos mira con envidia, y en sus respectivas cámaras legislativas ya se habla abiertamente de poner en marcha sus propias operaciones de minería de asteroides. Aunque pronto tengamos competencia, por ahora podemos disfrutar del monopolio."
 ENG_military.004.a: "¡Estoy que no quepo en mí de gozo!"
 ENG_military.005.t: "Beneficios de la minería de asteroides"
 ENG_military.005.d: "Han llegado los últimos cargamentos de nuestras operaciones de minería de asteroides, generando cuantiosos ingresos. Estos envíos incluyen platino, oro y plata. Sería muy sensato dar un buen uso a estas ganancias."
 ENG_military.005.a: "¡Excelente!"
 ENG_military.006.t: "Potencial de la minería de asteroides"
 ENG_military.006.d: "Recientemente, la Cámara de los Comunes ha permitido al UKSC y a Virgin Galactic (una empresa espacial privada) atraer un asteroide de tamaño considerable a la órbita de la Tierra para minarlo. Nuestros asesores recomiendan invertir en este nuevo sector, ya que podría permitir que materiales raros se entreguen directamente a nuestro país. Algunos, sin embargo, han aludido a la colosal factura que el Reino Unido tuvo que pagar solo para poner en marcha las operaciones, y se oponen a expandirse en el espacio. El retorno de esta inversión es variable, pero podrían hacer falta 25 años solo para alcanzar el umbral de rentabilidad. Una inversión más cuantiosa puede reducir este plazo, pero nos quedaremos muy rezagados respecto al resto durante bastante tiempo.\n\n¿Qué haremos respecto a la minería de asteroides? ¿Iniciar un programa nacional o ignorarlo por completo?"
 ENG_military.006.a: "Invertir en la minería de asteroides"
 ENG_military.006.b: "¡Es demasiado caro y una pérdida de tiempo!"
 Mobile_Fires_Platorm_Program.1.t: "Elección de socio para el programa Mobile Fires Platform"
 Mobile_Fires_Platorm_Program.1.d: "Tras el fin de la Guerra Fría y al disiparse la previsión de un conflicto en las llanuras alemanas, las existencias del ejército en sistemas de artillería de 155 mm disminuyeron; ahora, con nuevas amenazas en el horizonte, el Ministerio de Defensa ha decidido tomar medidas para resucitar esta capacidad. Numerosos programas y socios se han postulado para cumplir este contrato, de los cuales solo uno resultará seleccionado."
 ENG_military.034.a: "Alianza de Artillería Archer"
 ENG_military.034.b: "Grupo de Desarrollo K9A1 Thunder"
 ENG_military.034.c: "Programa Boxer"
 ENG_military.034.e: "Colaboración Caesar"
 ENG_military.035.t: "Gran Bretaña nos invita a una Fuerza Expedicionaria Conjunta"
 ENG_military.035.d: "El Reino Unido extiende una cordial invitación a [Receiving Country] para unirse a la Fuerza Expedicionaria Conjunta (JEF), una iniciativa de colaboración destinada a fomentar la cooperación internacional y mejorar la seguridad colectiva. Este importante hito marca el comienzo de un nuevo capítulo en nuestro compromiso compartido de promover la estabilidad, responder a los desafíos globales y salvaguardar los valores que tanto apreciamos."
 ENG_military.035.a: "¡Nos unimos!"
 ENG_military.035.b: "No, gracias, viejo amigo"
 ENG_military.036.t: "¡[From.GetName] acepta!"
 ENG_military.036.d: "[From.GetName] se unirá a nuestra Fuerza Expedicionaria Conjunta. Juntos podemos preparar a nuestras fuerzas militares para una respuesta rápida."
 ENG_military.036.a: "Bienvenidos"
 ENG_military.037.t: "¡[From.GetName] rechaza!"
 ENG_military.037.d: "[From.GetName] no se unirá a nuestra Fuerza Expedicionaria Conjunta. Prefieren valerse por sí mismos."
 ENG_military.037.a: "Ya se arrepentirán con el tiempo"
 ENG_military.038.t: "Expansión de la Escuela Naval de Dartmouth"
 ENG_military.038.d: "Con el foco puesto en la tecnología de vanguardia, el pensamiento estratégico y la experiencia práctica, la Escuela Naval de Dartmouth está preparada para desempeñar un papel crucial en la formación de la próxima generación de líderes navales."
 ENG_military.038.a: "Los portaaviones son el futuro de la guerra naval"
 ENG_military.038.b: "Necesitamos destructores y cruceros para derrotar a nuestros enemigos en el mar"
 ENG_military.040.t: "Debate sobre el Typhoon Tranche 1"
 ENG_military.040.d: "Las partes interesadas, como mandos militares, analistas de defensa y representantes del gobierno, participan en debates relativos a la eficacia del avión para hacer frente a las amenazas cambiantes, su papel dentro de las estrategias de defensa nacional y su potencial de exportación a socios internacionales. El debate sobre el Typhoon Tranche 1 desempeña un papel crucial a la hora de perfilar las decisiones relacionadas con la adquisición, el despliegue y el desarrollo futuro de este avanzado avión de caza."
 ENG_military.040.a: "Continuar la producción"
 ENG_military.040.b: "Investigar a su sucesor"
 ENG_military.040.c: "Reducir las existencias"
 ENG_military.039.t: "Especialización de las fuerzas armadas"
 ENG_military.039.d: "Elige tu especialización"
 ENG_military.039.a: "Ejército"
 ENG_military.039.b: "Fuerza Aérea"
 ENG_military.039.c: "Marina"
 ENG_military.039.e: "Estado Mayor"
 ENG_military.041.t: "El Reino Unido nos invita a comprar su innovación para aeronaves"
 ENG_military.041.d: "El Reino Unido ha realizado inversiones masivas en las capacidades de su industria aeronáutica y de aviación. Debido a nuestra relación especial, se ofrecen a compartir su innovación por un módico precio. Son británicos, después de todo."
 ENG_military.041.a: "¿Innovación? ¡Sí, por favor!"
 ENG_military.041.b: "No, gracias, viejo amigo"
 ENG_military.042.t: "El Reino Unido nos invita a comprar su innovación para aeronaves"
 ENG_military.042.d: "El Reino Unido ha realizado inversiones masivas en las capacidades de su industria aeronáutica y de aviación. Debido a nuestra relación especial, se ofrecen a compartir su innovación por un módico precio. Son británicos, después de todo."
 ENG_military.042.a: "¿Innovación? ¡Sí, por favor!"
 ENG_military.042.b: "No, gracias, viejo amigo"
 ENG_military.043.t: "Estados Unidos acepta"
 ENG_military.043.d: "Estados Unidos ha aceptado nuestra oferta para vender nuestra innovación."
 ENG_military.043.a: "Como era de esperar"
 ENG_military.044.t: "Estados Unidos rechaza"
 ENG_military.044.d: "Estados Unidos ha rechazado nuestra oferta de venta de innovación. Creen que el Reino Unido no es el socio viable que necesitan."
 ENG_military.044.a: "Ya se darán cuenta tarde o temprano"
 United_Kingdom.002.t: "El Silicon Glen da resultados"
 United_Kingdom.002.d: "Nuestras inversiones en el Silicon Glen de Escocia están dando sus frutos. Las universidades locales, los diseñadores de chips y las empresas de software informan de otro año de crecimiento, nuevas patentes y un flujo constante de graduados cualificados hacia la economía general."
 United_Kingdom.002.a: "Que el Glen siga expandiendo las fronteras"
 United_Kingdom.003.t: "Propuesta de cooperación transfronteriza"
 United_Kingdom.003.d: "El Reino Unido se ha puesto en contacto con nosotros con una propuesta para mejorar la logística comercial y reducir la carga burocrática en nuestra frontera compartida. El marco de cooperación sugerido se centra en la alineación de infraestructuras, la simplificación aduanera y la creación de comités reguladores conjuntos.\n\n¿Deberíamos aceptar?"
 United_Kingdom.003.a: "Aceptar el marco de trabajo"
 United_Kingdom.003.b: "Rechazar la oferta"
 United_Kingdom.004.t: "Irlanda acepta la cooperación transfronteriza"
 United_Kingdom.004.d: "El gobierno irlandés ha aceptado nuestra propuesta para una coordinación económica transfronteriza simplificada. Se han establecido comités para reducir los trámites burocráticos, alinear los estándares y facilitar un movimiento de mercancías más fluido a través del mar de Irlanda y la frontera terrestre."
 United_Kingdom.004.a: "Progreso mediante la cooperación"
 United_Kingdom.005.t: "Irlanda rechaza la oferta transfronteriza"
 United_Kingdom.005.d: "A pesar del interés inicial, el gobierno irlandés ha decidido finalmente no participar en nuestro marco de cooperación transfronteriza. Las autoridades aludieron a la complejidad jurídica y a las dudas políticas como motivos principales para el rechazo."
 United_Kingdom.005.a: "Desafortunado, pero de esperar"
 scottish.1.t: "Elecciones parlamentarias escocesas"
 scottish.1.d: "Los resultados de las elecciones al Parlamento escocés ya han llegado, y por fin podemos ver si el pueblo escocés ha votado o no por los partidos proindependentistas."
 scottish.1.a: "De acuerdo"
 britain_md.1.a: "Pongámonos en marcha entonces"
 britain_md.2.a: "Nos la jugaremos"
 britain_md.2.b: "Esas probabilidades no me gustan"
 britain_md.3.a: "Apelar a los sindicatos laboristas"
 britain_md.3.b: "Apelar al complejo militar-industrial"
 britain_md.3.c: "Apelar a la industria de los combustibles fósiles"
 britain_md.4.a: "Gravar a los industriales"
 britain_md.4.b: "Gravar al ejército"
 britain_md.4.c: "Gravar a las industrias de combustibles fósiles"
 britain_md.4.d1: "¿Realmente necesitamos gravar a alguien?"
 britain_md.5.a: "¡Adelante!"
 britain_md.6.d: "Nuestra infraestructura necesita mejoras urgentes. No está necesariamente mal, pero para competir con los actores globales, necesitaremos expandir nuestras ciudades. Sin embargo, en lugar de centrarnos únicamente en una expansión general de las infraestructuras, elegiremos una región específica en la que trabajar. De este modo, podremos crear nuevos centros de inversión y hacer florecer esas zonas."
 britain_md.6.a: "Trabajar en el norte"
 britain_md.6.b: "Trabajar en el centro"
 britain_md.6.c: "Trabajar en el sur"
 britain_md.7.a: "Pongámonos manos a la obra"
 britain_md.8.a: "¡Claro que no están vinculadas! Los migrantes no son el problema"
 britain_md.8.b: "Bueno, los datos no mienten"
 britain_md.9.a: "No hay tiempo que perder, adelante con ello"
 britain_md.10.a: "Cambiémosla un poco"
 britain_md.10.b: "Absolutamente no"
 britain_md.11.a: "Bien, ahora adelante con ello"
 britain_md.12.a: "De acuerdo"
 britain_md.12.b: "No"
 britain_md.13.a: "De acuerdo"
 britain_md.14.a: "Bastardos"
 britain_md.15.a: "De acuerdo"
 britain_md.16.a: "Un golpe blando: no buscaremos un mayor control"
 britain_md.16.b: "Un golpe duro: presionaremos para crear un Estado satélite"
 britain_md.17.a: "Bien"
 britain_md.18.a: "Mierda"
 britain_md.19.a: "Bien"
 britain_md.20.a: "Como era de esperar"
 britain_md.21.a: "¡Qué disparate! Pero ¿qué podemos hacer?"
 britain_md.21.b: "¡Qué disparate! ¡Movilizad al ejército!"
 britain_md.22.a: "Ya no hay marcha atrás"
 britain_md.22.b: "Bueno, esperemos un momento, ¿y si se lo devolvemos?"
 britain_md.23.a: "¿Na so fear go control you?"
 britain_md.24.a: "Ambiciones para Gran Bretaña"
 britain_md.24.b: "Gran Bretaña hacia adelante, no hacia atrás"
 britain_md.24.c: "Un futuro justo para todos"
 britain_md.24.a1: "Es hora del sentido común"
 britain_md.24.b1: "¿Estás pensando lo mismo que nosotros?"
 britain_md.24.c1: "Invitación al Gobierno de Gran Bretaña"
 britain_md.25.a: "¡Vamos allá!"
 britain_md.26.a: "Centrarse en la integración de las islas"
 britain_md.26.b: "Debemos presionar más hacia el oeste"
 britain_md.26.c: "Devolver las islas"
 britain_md.27.t: "Gran Bretaña devuelve las Malvinas"
 britain_md.27.d: "En un giro de los acontecimientos astronómicamente impactante, el [ENG.GetName], el mismo Estado que luchó contra nosotros por las Malvinas en los años 80, ha decidido devolver las islas a nuestro control. No sabemos qué ha motivado esto ni por qué lo han hecho, pero ya tenemos fuerzas desplazándose hacia la isla para ser estacionadas. El gobierno británico ha declarado que la medida es un intento de 'estrechar relaciones' con nosotros y con la región sudamericana en general."
 britain_md.27.a: "¡Nos parece perfecto!"
 britain_md.28.t: "Operación de cambio de régimen exitosa en Zimbabue"
 britain_md.28.d: "Tras una operación para derrocar al dictador zimbabuense, el partido Movimiento por el Cambio Democrático (MDC) ha sido instaurado por nuestras fuerzas. Esto se produce tras una extensa planificación y una operación de las unidades de las fuerzas especiales británicas para derrocar al longevo régimen del país."
 britain_md.28.a: "Bien, no esperábamos menos"
 britain_md.29.t: "¡El [ENG.GetName] ejecuta un golpe de Estado!"
 britain_md.29.d: "Parece que el [ENG.GetName] ha llevado a cabo una operación encubierta en nuestro país que ha dado como resultado el derrocamiento de nuestro régimen anterior y la instauración de un nuevo gobierno. Las fuerzas militares fueron contactadas de antemano e incluso allanaron el camino para que las fuerzas británicas entraran al país sin ser detectadas."
 britain_md.29.a: "¿Qué?"
 britain_md.30.t: "Aproximándose a la Operación División Oriental"
 britain_md.30.d: "Los egipcios mantienen actualmente el control total sobre el Sinaí, con enfrentamientos ocasionales con los israelíes a lo largo de los años. Sin embargo, nuestra nación necesita desesperadamente rutas comerciales más eficientes, y los impuestos que nos cobran cada vez que pasamos por el Suez han empezado a acumularse más allá de lo comprensible. Necesitaremos llegar a un acuerdo con los egipcios o nos veremos obligados a tomar medidas drásticas."
 britain_md.30.a: "Comencemos las negociaciones"
 britain_md.30.b: "No hay tiempo para negociaciones, avancen"
 britain_md.31.t: "Los británicos solicitan el control conjunto del Sinaí"
 britain_md.31.d: "El gobierno británico ha enviado diplomáticos para recibir a nuestros ministros en [EGY.capital.GetCapitalVictoryPointName] y debatir la posibilidad de un control conjunto en el Sinaí. Sugieren que sus barcos y comerciantes han sido tratados de forma demasiado injusta, y que acceder a esto demostrará que se puede confiar en nuestro gobierno."
 britain_md.31.a: "¡Hasta el último egipcio morirá antes de que ceda el Sinaí!"
 britain_md.31.b: "Quizás podamos llegar a algún acuerdo..."
 britain_md.32.t: "Egipto rechaza las negociaciones"
 britain_md.32.d: "Los egipcios han declarado que no están interesados en negociar con nosotros el control del Suez, incluso si eso significa que estamos dispuestos a darles grandes concesiones. No nos queda más opción que considerar la intervención militar."
 britain_md.32.a: "Es hora de intervenir"
 britain_md.32.b: "Olvídalo"
 britain_md.33.t: "Egipto ofrece negociaciones"
 britain_md.33.d: "Los egipcios han accedido a nuestras peticiones de negociación sobre el Sinaí y han solicitado el pago de una suma de dinero en efectivo a cambio de un acceso directo, tanto militar como comercial, a través del Sinaí con impuestos reducidos."
 britain_md.33.a: "Nos parece bien"
 britain_md.33.b: "¿En serio? ¡Esto es un insulto!"
 britain_md.34.t: "Operación División Oriental: En marcha"
 britain_md.34.d: "La Operación División Oriental está actualmente en marcha, y las tropas ya han desembarcado en el Sinaí. Debemos comenzar la movilización de una mayor cantidad de fuerzas que permita una operación a gran escala."
 britain_md.34.a: "¡Vamos, vamos, vamos!"
 britain_md.35.t: "[FROM.GetName] pide una integración más profunda"
 britain_md.35.d: "El [ENG.GetName] ha pedido una integración más profunda, afirmando que al renunciar a una pequeña parte de nuestra soberanía, podremos reunir nuestras fuerzas y devolver nuestra posición a la de una potencia global una vez más. Aunque muchos de nuestros ciudadanos recelan de tal propuesta, el [ENG.GetName] ha demostrado ser en los últimos años un fuerte competidor al superarnos en todos los sectores."
 britain_md.35.a: "Debemos unirnos"
 britain_md.35.b: "No renunciaremos a nuestra soberanía"
 britain_md.36.t: "[FROM.GetName] busca una mayor integración"
 britain_md.36.d: "[FROM.GetName] ha señalado que, en efecto, está interesado en una integración más profunda, ofreciendo varias hojas de ruta para fusionar las instituciones y organismos burocráticos principales. Nuestros diplomáticos y funcionarios están trabajando horas extras para garantizar una transición fluida, segura y estable."
 britain_md.36.a: "Bien"
 britain_md.37.t: "[FROM.GetName] rechaza una mayor integración"
 britain_md.37.d: "Parece que el gobierno [FROM.GetAdjective] no está interesado en una mayor integración, insistiendo en su lugar en que nuestras medidas recientes vulneran su soberanía."
 britain_md.37.a: "De acuerdo"
 britain_md.39.t: "Elegir a un testaferro"
 britain_md.39.d: "Si bien entendemos las implicaciones de entregar cierta forma de poder a otro político, debemos reconocer la necesidad de un representante que apacigüe a las masas que recelan de tener a un líder militar a cargo del Estado. Encontraremos rápidamente a alguien a quien apuntalar como un títere que represente al Estado."
 britain_md.39.a: "Colocad a ese necio de Farage"
 britain_md.39.b: "Buscad dónde se esconde Griffin"
 britain_md.39.c: "¿Está Michael Holmes disponible?"
 britain_md.39.d1: "El ejército nos servirá perfectamente"
 british_flavor.1.t: "Nissan busca expandir su fábrica cerca de Sunderland"
 british_flavor.1.d: "El fabricante de automóviles japonés Nissan busca expandir su fábrica en Sunderland para incluir su nueva generación de Almera Hatchback y la versión Sedán, que saldrán a la venta próximamente. A los funcionarios del gobierno les preocupa que la expansión dificulte la competencia de las fábricas locales y los fabricantes de automóviles nacionales."
 british_flavor.1.a: "Aprobarla"
 british_flavor.1.b: "No, no podemos permitir que esto suceda"
 british_flavor.2.t: "Extradición de Augusto Pinochet"
 british_flavor.2.d: "Los informes médicos han concluido que el exdictador chileno Augusto Pinochet no está en condiciones de ser juzgado. Como resultado de esta investigación, han aumentado las peticiones para deportar al exdictador de vuelta a su país de origen, Chile; pero en respuesta a la multitud que busca su deportación, otro grupo de personas exige que continúe su juicio aquí en el Reino Unido."
 british_flavor.2.a: "Enviarlo de vuelta"
 british_flavor.2.b: "Se queda"
 british_flavor.3.t: "Hundimiento del Solway Harvester"
 british_flavor.3.d: "Se ha informado de que el Solway Harvester se ha hundido frente a la costa de la Isla de Man debido al fuerte oleaje. También se informa de que los 11 miembros de la tripulación han muerto; se dice que el barco es recuperable pero que presenta daños graves."
 british_flavor.3.a: "Ya nos preocuparemos de eso más tarde"
 british_flavor.3.b: "Recuperar los cuerpos de la tripulación y preparar los funerales"
 british_flavor.4.t: "Secuestro de un avión de Ariana Afghan Airways"
 british_flavor.4.d: "Un grupo de secuestradores en Afganistán abordó un vuelo y lo obligó a dirigirse a [ENG.GetName], haciéndolo aterrizar en Londres. Las autoridades se preparan para enviar una pequeña fuerza militar para hacer frente a los secuestradores, pero aún se desconoce qué haremos con ellos después."
 british_flavor.4.a: "Arrestarlos y luego deportarlos"
 british_flavor.4.b: "¡Arrestarlos y luego enviarlos a juicio!"
 british_flavor.5.t: "OPA hostil al NatWest Bank"
 british_flavor.5.d: "Un banco escocés intenta actualmente una adquisición hostil de un banco inglés, el NatWest Bank. El Royal Bank of Scotland es actualmente el banco más pequeño de los dos, y su éxito depende en gran medida de otra oferta realizada por una tercera entidad, el Bank of Scotland."
 british_flavor.5.a: "No es nuestro problema"
 british_flavor.5.b: "Salvar al banco"
 british_flavor.6.t: "BMW anuncia planes para vender Rover Group"
 british_flavor.6.d: "El fabricante de automóviles alemán BMW ha anunciado planes para vender Rover Group, posicionándose el consorcio Alchemy, con sede en Londres, como el principal candidato para la adquisición. Si bien esta absorción podría otorgarnos más influencia en el panorama automovilístico, terminará convirtiéndose en una carga adicional en un sector cada vez más frágil."
 british_flavor.6.a: "Nos parece bien"
 british_flavor.6.b: "Quizás deberían reconsiderarlo..."
 british_flavor.7.t: "David Trimble gana las elecciones de liderazgo del Partido Unionista del Úlster"
 british_flavor.7.d: "David Trimble ha ganado las elecciones de liderazgo del Partido Unionista del Úlster, una formación política partidaria de la Unión y el tercer partido más antiguo de Gran Bretaña. Su victoria se celebra entre los conservadores, mientras que aquellos que desean una mayor autonomía se muestran o bien indiferentes ante los resultados o molestos, como siempre."
 british_flavor.7.a: "Felicitar al ganador"
 british_flavor.8.t: "Ley de Inmigración y Asilo"
 british_flavor.8.d: "La Ley de Inmigración y Asilo se está debatiendo actualmente, y si finalmente se aprueba, significará que todos los refugiados y migrantes tendrán derecho a cupones para cubrir el coste de la comida y la ropa. Vetar esto puede ser un poco inhumano, pero a la larga supondrá mayores costes para el contribuyente británico."
 british_flavor.8.a: "Aprobarla"
 british_flavor.8.b: "Vetarla"
 british_flavor.9.t: "Disturbios anticapitalistas en Parliament Square"
 british_flavor.9.d: "Manifestantes anticapitalistas han tomado las calles y han vandalizado una estatua del ex primer ministro británico, Winston Churchill. Las protestas están siendo apodadas los disturbios del 'Primero de Mayo', y las multitudes no parecen tener intenciones de dispersarse pronto. Algunos exigen que se actúe, mientras que otros sugieren que se cansarán y acabarán marchándose a casa."
 british_flavor.9.a: "Esperaremos a que pase"
 british_flavor.9.b: "Enviar a los equipos de limpieza y a la policía"
 british_flavor.10.t: "[ENG.GetLeader] abucheado en el Women's Institute"
 british_flavor.10.d: "[ENG.GetLeader] fue recibido con hostilidad en el Women's Institute, donde las indignadas asistentes lo abuchearon y le dedicaron un aplauso lento e irónico. Este bochornoso recibimiento ha abierto el debate entre los miembros del partido y ha llevado a la opinión pública a cuestionar aspectos de nuestro liderazgo."
 british_flavor.10.a: "Ignorarlo"
 british_flavor.10.b: "Responder a las críticas"
 british_flavor.11.t: "Escocia busca derogar la Sección 28"
 british_flavor.11.d: "El Parlamento escocés pretende derogar la polémica Sección 28 de la Ley de Gobierno Local de 1988, que prohíbe a las autoridades locales 'promover la homosexualidad'. Permitirles derogar esta ley podría provocar llamamientos para su eliminación en otros lugares, causando inestabilidad política."
 british_flavor.11.a: "Detenerlos"
 british_flavor.11.b: "No nos importa"
 british_flavor.12.t: "Alex Salmond dimite del SNP"
 british_flavor.12.d: "Alex Salmond ha dejado su cargo de liderazgo en el Partido Nacional Escocés por disputas sobre las estrategias financieras internas de la formación. Su dimisión nos brinda la oportunidad de atacar al SNP mientras está débil, fomentando una mayor división entre sus filas."
 british_flavor.12.a: "Es mejor que no hagamos nada"
 british_flavor.12.b: "Lanzar un ataque político"
 british_flavor.13.t: "Los últimos ochenta"
 british_flavor.13.d: "Como parte del proceso de paz de Irlanda del Norte, se han tomado las disposiciones necesarias para liberar a los últimos 80 prisioneros recluidos en la prisión de Maze. Estos presos eran miembros del Ejército Irlandés de Liberación Nacional o tenían fuertes vínculos con ellos; destaca un incidente ocurrido en 1997 en el que estos reclusos dispararon y mataron al líder de una fuerza de voluntarios leales."
 british_flavor.13.a: "Tal vez deberíamos retenerlos..."
 british_flavor.13.b: "Está bien, que se vayan entonces"
 british_flavor.14.t: "Estallan disturbios en la urbanización Paulsgrove"
 british_flavor.14.d: "Han estallado disturbios en la urbanización Paulsgrove, en Portsmouth, después de que más de 100 personas sitiaran un bloque de pisos que presuntamente albergaba a un agresor de menores convicto. Este es el último brote de violencia por cuenta propia contra sospechosos de delitos sexuales desde el inicio de la campaña de 'señalamiento público' impulsada por la organización News of the World."
 british_flavor.14.a: "Bueno, no hay nada que pudiéramos hacer ahí"
 british_flavor.14.b: "Enviar a la policía"
 british_flavor.15.t: "Estallan protestas por el combustible"
 british_flavor.15.d: "Los manifestantes han bloqueado la entrada a las refinerías de petróleo en señal de protesta por los altos precios del combustible. Los automovilistas han comenzado a comprar gasolina presa del pánico, lo que empieza a provocar una escasez nacional de combustible y una subida continua de los precios del petróleo. Se informa de que un gran número de gasolineras está empezando a cerrar a consecuencia de la situación, y el gobierno se apresura a encontrar una solución."
 british_flavor.15.a: "Culpar a las industrias de combustibles fósiles"
 british_flavor.15.b: "Imponer cuotas estrictas de consumo de petróleo"
 british_flavor.15.c: "§RNo hacer nada§!"
 british_flavor.151.t: "Estallan disturbios ante la inacción del gobierno"
 british_flavor.151.d: "Parece que nuestra falta de determinación para solucionar la escasez de combustible solo ha avivado la indignación, y cada vez más gente sale a las calles exigiendo una resolución gubernamental. En estos momentos, los manifestantes marchan hacia los edificios gubernamentales y vandalizan estatuas, edificios y símbolos del gobierno."
 british_flavor.151.a: "¡Lo estamos intentando!"
 british_flavor.152.t: "Los clamores de cambio se hacen más fuertes"
 british_flavor.152.d: "Parece que la determinación del pueblo no ha hecho más que fortalecerse, dirigiendo el odio y la ira hacia [ENG.GetLeader] y la clase dirigente. Además, han aumentado las exigencias para reasignar los fondos reales a fin de financiar subsidios al combustible; algunos incluso piden que la monarquía abdique avergonzada."
 british_flavor.152.a: "¡Ridículo!"
 british_flavor.153.t: "Incendiada la Cámara de los Comunes"
 british_flavor.153.d: "Se ha declarado el estado de emergencia después de que las protestas y los disturbios hayan dado un giro drástico hacia la anarquía absoluta, dejando atrás la desobediencia civil organizada. La Cámara de los Comunes fue incendiada por manifestantes enfurecidos, ya que la policía fue incapaz de contener a las turbas enardecidas. Hay informes que indican que los manifestantes planean marchar hacia otras instituciones del Estado, aunque no está claro cuál será el próximo objetivo."
 british_flavor.153.a: "Señor, ten piedad..."
 british_flavor.154.t: "¡La reina abdica!"
 british_flavor.154.d: "A la luz del reciente levantamiento y de los continuos fracasos del gobierno, la reina ha declarado oficialmente que abdicará y tiene previsto dirigirse a la nación en un discurso formal a última hora de esta tarde. Aunque muchos se entristecen por su marcha, aún no está claro si será reemplazada, ya que el resentimiento hacia la monarquía no ha hecho más que recrudecerse desde el inicio de las protestas."
 british_flavor.154.a: "Adiós a la corona de joyas y al vestido de terciopelo"
 british_flavor.155.t: "[ENG.GetLeader] dimite sin un sucesor claro"
 british_flavor.155.d: "[ENG.GetLeader] ha dimitido, y su partido ha sido incapaz de localizar rápidamente a un sustituto adecuado. Este estado de anarquía ha dejado al país sumido en el caos, la confusión y la vulnerabilidad. Nunca antes se había enfrentado Gran Bretaña a una crisis semejante, y el gobierno ha demostrado ser inepto en sus capacidades para resolver cualquier cosa en este momento."
 british_flavor.155.a: "¡¿Qué pasará ahora?!"
 british_flavor.156.t: "El ejército toma el control"
 british_flavor.156.d: "Las Fuerzas Armadas británicas han declarado su intervención directa para restablecer la autoridad; un portavoz ha anunciado que cualquiera que viole el toque de queda de las 16:00 horas será 'neutralizado con rapidez' y ha manifestado que todo lo que pretenden hacer será por 'el bien común de todos los británicos'. Esto ha desatado la indignación entre los miembros del Partido Laborista y del Partido Conservador, calificando esta toma del poder como una usurpación, y algunos incluso han denunciado la medida como un giro radical hacia la dictadura. Aun así, los políticos han demostrado su incapacidad para resolver los asuntos de Estado, sin un sucesor claro tras la dimisión de [ENG.GetLeader]."
 british_flavor.156.a: "¿Qué nos deparará el futuro?"
 british_flavor.157.t: "Informe: Estado de situación del nuevo gobierno"
 british_flavor.157.d: "Dirigido a su excelencia, [ENG.GetLeader],\nFecha: [GetDateText]\n\nAsunto I: Estado del orden público\nSu excelencia, las Fuerzas Armadas británicas han tomado rápidamente el control de las principales áreas urbanas como Londres, Birmingham, Mánchester y Liverpool, entre otras. Al menos por ahora, parece que la gente está empezando a dispersarse gradualmente de las multitudes y comienza a regresar a sus hogares, a medida que hemos puesto en marcha subsidios al petróleo financiados por el gobierno y programas para ayudar al país a recuperarse.\n\nAsunto II: Exigencias de la izquierda y la derecha\nLos políticos laboristas y conservadores han comenzado a exigir a nuestra administración de emergencia que inicie el proceso necesario para restablecer el orden democrático en el país; algunos políticos declaran que la nueva administración es un símbolo de autoritarismo y extralimitación militar. Un político laborista llegó a afirmar que 'los hombres con armas deben quedarse en sus bases, y los hombres con bolígrafos deben reanudar sus funciones como servidores públicos'.\n\nAsunto III: Consolidación adicional\nNuestros hombres han comenzado a localizar a políticos y burócratas que estaban descontentos con el antiguo sistema, llamándolos a servir en lugar de los antiguos políticos del sistema bipartidista. Tomar la autoridad de esta manera casi con toda certeza equivaldrá a una especie de conflicto nacional; sin embargo, en la situación actual, no disponemos de otros medios para consolidar nuestro control."
 british_flavor.157.a: "Es bueno saberlo"
 british_flavor.16.t: "Los conservadores suben en las encuestas"
 british_flavor.16.d: "Los partidarios del Partido Conservador están de celebración tras enterarse de que los tories aventajan por dos puntos a los laboristas, situándose con un 38% en una encuesta de opinión de MORI. Esto marca la primera vez que los conservadores lideran una encuesta de opinión nacional frente al Partido Laborista desde 1993."
 british_flavor.16.a: "De acuerdo"
 british_flavor.17.t: "Un terremoto sacude Warwickshire"
 british_flavor.17.d: "Un terremoto ha sacudido el condado ceremonial de Warwickshire, causando algunos daños en los edificios cercanos. Hay peticiones de asistencia gubernamental para ayudar a reconstruir algunos de los inmuebles dañados, pero recientemente el presupuesto del gobierno no ha hecho más que reducirse, lo que dificulta que Westminster llegue a una conclusión coherente."
 british_flavor.17.a: "Solo nos queda esperar que todo esté bien"
 british_flavor.17.b: "Autorizar la ayuda gubernamental"
 british_flavor.18.t: "Donald Dewar, trasladado de urgencia al hospital"
 british_flavor.18.d: "Donald Dewar, el primer ministro de Escocia, ha sido trasladado de urgencia al hospital tras sufrir una caída frente a Bute House, su residencia oficial en Edimburgo. Su salud se deteriora rápidamente y aumentan los llamamientos a la intervención del gobierno para enviar equipos médicos avanzados."
 british_flavor.18.a: "Rezar por su recuperación"
 british_flavor.18.b: "Autorizar el envío de equipos médicos avanzados en su ayuda"
 United_Kingdom_News.2.t: "Estallan disturbios en el Reino Unido"
 United_Kingdom_News.2.d: "Tras una escasez de combustible a nivel nacional y un repunte en los precios del gas, las autoridades británicas optaron por esperar a que pasara la escasez con la esperanza de que la economía se recuperara por sí sola de forma natural. Sin embargo, la situación no mejoró; al contrario, empeoró, y la coyuntura terminó por salirse completamente de control a principios de esta semana cuando los manifestantes prendieron fuego a la Cámara de los Comunes. Las autoridades británicas han afirmado que no son responsables de la escasez y declaran que el problema es puramente natural y pasará. Un manifestante declaró: '¡No tengo combustible para poner en mi coche! No tengo medios para ir a trabajar y no tengo calefacción en mi casa para mantener abrigada a mi familia; lo que ocurre hoy es el resultado de un sistema y un gobierno ineficaces'.\nEl gobierno ha insistido en que está haciendo todo lo posible para mitigar la situación, pero tal como están las cosas, las protestas no van a cesar."
 United_Kingdom_News.2.a: "La indignación estalla una vez más"
 United_Kingdom_News.3.t: "La reina Isabel II abdica"
 United_Kingdom_News.3.d: "A la luz de los acontecimientos recientes, la reina del Reino Unido, Isabel II, ha anunciado su abdicación oficial al trono. Esto se produce cuando los manifestantes comenzaron a exigir el fin de la monarquía, asociándola con símbolos de corrupción, codicia y despilfarro de dinero. Más específicamente, en esta ocasión la ira se dirigió contra la monarquía porque la gente exigía que el dinero se reasignara a subsidios gubernamentales para el combustible; sin embargo, sus peticiones cayeron en saco roto en Westminster. Se desconoce si otro miembro de la realeza ascenderá al trono, pero tal como están las cosas en este momento, la monarquía solo puede dar un paso atrás y observar cómo arde el país."
 United_Kingdom_News.3.a: "El trono se desmorona"
 United_Kingdom_News.4.t: "Las Fuerzas Armadas británicas toman el control de Londres"
 United_Kingdom_News.4.d: "Las Fuerzas Armadas británicas han declarado su intervención oficial para hacer cumplir el estado de emergencia decretado por el Estado, manifestando explícitamente que cualquiera que viole el toque de queda de las 16:00 horas será neutralizado 'con rapidez'. Esto llega tras semanas de protestas y disturbios en el Reino Unido, en las que los manifestantes incendiaron la Cámara de los Comunes en un arrebato de furia. Aún no se conocen las intenciones de este nuevo órgano administrativo, pero según se informa, está integrado por hombres fuertes de las fuerzas armadas que pretenden reducir el poder que el Partido Laborista y el Partido Conservador ejercen sobre las instituciones británicas."
 United_Kingdom_News.4.a: "¿Es este el fin del Reino Unido?"
 ENG_inner_circle.01.t: "El ascenso de [GetAscendingAdvisorName]"
 ENG_inner_circle.01.desc: "[GetAscendingAdvisorName] ha mostrado una aguda ambición y ha expandido discretamente su influencia dentro de la Casa Real. Sin embargo, cada paso hacia una mayor autoridad ha provocado objeciones de otros cortesanos y altos cargos, y el palacio ahora bulle con la familiar lucha por el acceso y la precedencia. La cuestión es si [GetAscendingAdvisorName] ha impresionado a la reina lo suficiente como para ganarse un lugar real dentro del Círculo Íntimo de la Reina."
 ENG_inner_circle.01.a: "Reemplazar a [ENGGetAscendedAdvisorName1]"
 ENG_inner_circle.01.b: "Reemplazar a [ENGGetAscendedAdvisorName2]"
 ENG_inner_circle.01.c: "Reemplazar a [ENGGetAscendedAdvisorName3]"
 ENG_inner_circle.01.d: "[GetAscendingAdvisorName] no es digno."
 ENG_inner_circle_charles.03.t: "La visita de la armonía del príncipe"
 ENG_inner_circle_charles.03.desc: "El príncipe de Gales ha llegado de visita, combinando la diplomacia cortesana con un mensaje claro sobre la gestión medioambiental. Las reuniones con altos funcionarios y líderes de la sociedad civil se han centrado en restaurar la confianza, ampliar la cooperación práctica y plantear la resiliencia climática como un interés estratégico compartido en lugar de un mero tema de conversación."
 ENG_inner_circle_charles.03.a: "Que la armonía guíe nuestras relaciones."
 ENG_inner_circle_charles.04.t: "El príncipe Carlos defiende la protección de las selvas tropicales"
 ENG_inner_circle_charles.04.desc: "Se nos ha informado de que Su Alteza Real el príncipe Carlos, el príncipe de Gales, ha pedido una mayor acción global para proteger las selvas tropicales. Como fundador del Prince's Rainforests Project, ha utilizado su influencia para trabajar con gobiernos, empresas y la sociedad civil con el fin de resaltar la importancia de detener la deforestación y preservar estos ecosistemas críticos para la estabilidad climática y la biodiversidad."
 ENG_inner_circle_charles.04.a: "Agradecemos al príncipe Carlos su defensa de las selvas tropicales"
 ENG_inner_circle_charles.05.t: "La diplomacia medioambiental del príncipe Carlos"
 ENG_inner_circle_charles.05.desc: "Se nos ha informado de que Su Alteza Real el príncipe Carlos, el príncipe de Gales, ha concluido una gira de diplomacia medioambiental en nuestro país, abogando por la cooperación en materia de clima, sostenibilidad y resiliencia ecológica. Como una de las voces más longevas en la acción medioambiental a lo largo de décadas, el príncipe destacó la necesidad de realizar esfuerzos colectivos entre naciones y sectores para abordar los desafíos ecológicos globales y promover soluciones sostenibles."
 ENG_inner_circle_charles.05.a: "Apoyar la Sostenibilidad."
 ENG_inner_circle_charles.06.t: "El príncipe Carlos promueve la agricultura ecológica"
 ENG_inner_circle_charles.06.desc: "Hemos sabido que Su Alteza Real el príncipe Carlos, el príncipe de Gales, ha tomado medidas activas para respaldar el desarrollo de la agricultura ecológica y sostenible en nuestra nación. Basándose en décadas de trabajo pionero en métodos de cultivo ecológico en Highgrove y Duchy Home Farm, destacó los beneficios medioambientales y sociales de las prácticas ecológicas y fomentó la cooperación en materia de sostenibilidad agrícola."
 ENG_inner_circle_charles.06.a: "Apoyar la agricultura sostenible."
 ENG_inner_circle_andrew.04.t: "El príncipe Andrés en misión comercial"
 ENG_inner_circle_andrew.04.desc: "Su Alteza Real el príncipe Andrés, actuando como representante comercial del Reino Unido, ha visitado nuestra nación para promover lazos comerciales más sólidos y la cooperación económica. Durante su misión, se reunió con funcionarios del gobierno, líderes empresariales y posibles inversores para destacar las oportunidades de comercio e inversión que benefician tanto a nuestra economía como a la del Reino Unido."
 ENG_inner_circle_andrew.04.a: "Bienvenidos"
 ENG_inner_circle_andrew.05.t: "Acuerdo comercial concluido"
 ENG_inner_circle_andrew.05.desc: "Nos complace informar que, tras las recientes conversaciones y negociaciones encabezadas por Su Alteza Real el príncipe Andrés, el duque de York, se ha concluido un nuevo acuerdo comercial entre nuestra nación y el Reino Unido. El pacto abre vías para un mayor intercambio comercial, la cooperación en industrias clave y el beneficio económico mutuo, reflejando intereses compartidos y lazos reforzados entre nuestras economías."
 ENG_inner_circle_andrew.05.a: "Aceptar la asociación."
 ENG_military.045.t: "Petición británica de asociación estratégica"
 ENG_military.045.d: "El Reino Unido, liderado por un monarca constitucional y comprometido con la cooperación occidental, ha solicitado formalmente el estatus de Aliado importante no miembro de la OTAN. Conceder esto mejoraría las relaciones transatlánticas y aseguraría un socio clave en Europa."
 ENG_military.045.a: "Aprobar su solicitud; un aliado valioso."
 ENG_military.045.b: "Rechazar; debemos ser cautelosos con tales designaciones."
 ENG_integrate_ireland: "Integrar [IRE.GetFlag] Irlanda"
 ENG_integrate_ireland_desc: "Después de décadas, finalmente hemos sometido e integrado las tierras de Irlanda; ya es hora de formalizar el proceso de integración."
 ENG_a_more_united_kingdom_decisions: "Unificar el Reino"
 ENG_a_more_united_kingdom_decisions_desc: "Tras el declive gradual del Imperio Británico y la descolonización durante la Guerra Fría, nuestro reino ha experimentado una decadencia constante. A través de medios diplomáticos y del crecimiento hegemónico, seremos capaces de volver a unificar nuestro reino una vez más.\n\nPasa el cursor sobre el texto en color para más información."
 ENG_core_objectives_text: "Objetivos principales"
 ENG_econ_hegemony_text: "Hegemonía económica"
 ENG_military_hegemony_text: "Hegemonía militar"
 ENG_political_hegemony_text: "Hegemonía política"
 ENG_declare_economic_hegemony: "Declarar la hegemonía económica"
 ENG_declare_economic_hegemony_desc: "Ha llegado el momento de declararnos la hegemonía económica de la Commonwealth."
 ENG_declare_military_hegemony: "Declarar la hegemonía hegemonía militar"
 ENG_declare_military_hegemony_desc: "Ha llegado el momento de declararnos la hegemonía militar de la Commonwealth."
 ENG_declare_political_hegemony: "Declarar la hegemonía política"
 ENG_declare_political_hegemony_desc: "Ha llegado el momento de declararnos la hegemonía política de la Commonwealth."
 ENG_fractured_kingdom_united_state_decisions: "La próxima era"
 ENG_fractured_kingdom_united_state_decisions_desc: "Con la llegada de un nuevo régimen en la [ENG.GetFlag] Gran Bretaña, finalmente seremos capaces de expandir nuestra influencia hacia el exterior de forma rápida, ágil y agresiva.\n\nPodremos establecer una organización de PMC bajo nuestro mando para sembrar el caos en el mundo."
 ENG_grant_land_in_isle_of_man: "Transformar la Isla de Man"
 ENG_grant_land_in_isle_of_man_desc: "A pesar de su importancia histórica, la Isla de Man nos sirve de muy poco hoy en día fuera de la extracción de recursos. Sin embargo, si concedemos estas tierras a nuestra nueva organización de PMC, serán capaces de desbloquear por completo su potencial y utilizarla como una posible base desde la cual realizar operaciones."
 ENG_devolved_matters: "Asuntos descentralizados"
 ENG_devolved_matters_desc: "Nuestros estados constituyentes han estado presionando por un §HEstado más descentralizado§! para poder obtener una independencia nominal o absoluta. Los tres estados principales son [SCO.GetFlag] §HEscocia§!, [NIR.GetFlag] §HIrlanda del Norte§! y [WAS.GetFlag] §HGales§!.\n\nSi la situación de nuestra nación empeora, los territorios constituyentes intentarán aprobar proyectos de ley para reducir su dependencia, los cuales podremos vetar a riesgo de aumentar su agitación.\n\nLas decisiones estarán disponibles a medida que avance la transferencia de competencias, y se puede encontrar más información en la interfaz de descentralización situada en la parte inferior derecha de la pantalla, representada por la pieza de rompecabezas.\n\nPróximas elecciones territoriales: [?ROOT.ENG_election_var|Y0] mes(es)"
 ENG_appease_scotland: "Subsidios específicos para [SCO.GetFlag] Escocia"
 ENG_appease_nireland: "Subsidios específicos para [NIR.GetFlag] Irlanda del Norte"
 ENG_appease_wales: "Subsidios específicos para [WAS.GetFlag] Gales"
 ENG_doing_other_decision: "Ejecutando otra decisión"
 ENG_welsh_referendum: "[GetYear] Referéndum de independencia de [WAS.GetFlag] Gales"
 ENG_welsh_referendum_desc: "El pueblo de [WAS.GetFlag] Gales votará en un referéndum que determinará su futuro como nación, territorio constituyente y actor en las islas británicas. La campaña se desarrollará hasta el día de la votación, y el resultado reflejará la postura que haya adoptado la opinión pública galesa en el momento del recuento. Westminster puede gastar poder político y fondos de la tesorería para influir en ella.\n\nVoto para abandonar la Unión: §Y[?ENG_referendum_leave_vote|0]§!%"
 ENG_release_scotland: "Aprobar el [GetYear] Referéndum de independencia de [SCO.GetFlag] Escocia"
 ENG_release_scotland_desc: "'¡Escocia por siempresiempre jamás!'\n\nQuizás vetamos el intento anterior de referéndum con demasiada precipitación; podemos dar marcha atrás en ese error."
 ENG_release_ireland: "Aprobar el [GetYear] Referéndum de independencia de [NIR.GetFlag] Irlanda del Norte"
 ENG_release_ireland_desc: "Quizás vetamos el intento anterior de referéndum con demasiada precipitación; podemos dar marcha atrás en ese error."
 ENG_release_wales: "Aprobar el [GetYear] Referéndum de independencia de [WAS.GetFlag] Gales"
 ENG_release_wales_desc: "Quizás vetamos el intento anterior de referéndum con demasiada precipitación; podemos dar marcha atrás en ese error."
 decisions_ENG: "Decisiones de [ENG.GetName]"
 decisions_ENG_desc: "Aquí el gobierno puede poner en marcha misiones y tomar acciones decisivas para guiar el rumbo de Gran Bretaña, apoyando a la industria, configurando la investigación, fortaleciendo las regiones y respondiendo a las necesidades cambiantes de la nación."
 falkland_policy: "Política de las Malvinas"
 denounce_status_as_the_commonwealth_of_nation_member: "§YDenunciar§! el estatus de miembro de la Mancomunidad de Naciones"
 denounce_status_as_the_commonwealth_of_nation_member_desc: "Rompe con los lazos obsoletos. Denuncia la membresía en la Commonwealth y traza un rumbo hacia la verdadera soberanía nacional. Reclama tu destino. Forja tu propio camino. La independencia te espera."
 ENG_bankers_switch_faction: "Respaldar a los banqueros internacionales"
 ENG_bankers_switch_faction_desc: "Reorganizamos nuestras alianzas internas para favorecer a la facción de los banqueros internacionales, orientando la política hacia las finanzas globales, los flujos de capital abiertos y una economía basada en los servicios."
 ENG_scottish_parliament: "[SCO.GetFlag] Parlamento escocés"
 ENG_scottish_parliament_desc: "Los miembros del Parlamento [SCO.GetFlag] escocés no han sido, ni serán siempre, leales a Londres. Habrá parlamentarios §Hproindependentistas§! que lucharán por la creación de una [SCO.GetFlag] Escocia autónoma o independiente.\n\nSi los miembros del parlamento §Hproindependentistas§! ostentan la mayoría, comenzarán a aprobar proyectos de ley para otorgarse más autonomía, los cuales podremos aprobar o vetar. Si aceptamos consistentemente sus peticiones, tendremos un estado constituyente [SCO.GetFlag] escocés amistoso y leal. Pero si denegamos repetidamente sus solicitudes, su §Hagitación§! puede derivar en una situación muy caótica. Si la §Hagitación escocesa§! [SCO.GetFlag] alcanza §H100§!, entonces exigirán la independencia.\n\n§HEscaños proindependentistas§!: [?ENG_scottish_nationalists]/129\n\n§HAgitación escocesa§! [SCO.GetFlag]: [?ENG_scottish_agitation]"
 ENG_invest_northern_ireland_mission: "Retorno de la inversión en la construcción de Irlanda del Norte"
 ENG_ireland_border_cooperation: "Tratado de cooperación fronteriza con Irlanda"
 ENG_clydach_nickel_decision: "Modernizar la refinería de níquel de Clydach"
 ENG_clydach_nickel_decision_desc: "Actualizamos la refinería de níquel de Clydach en el sur de Gales, ampliando la capacidad para metales de baterías y aleaciones de alta calidad con el fin de fortalecer nuestro suministro de minerales críticos."
 ENG_alloys_modernisation: "Modernizar la producción de aleaciones"
 ENG_alloys_modernisation_desc: "Invertimos en nuevos fundidores y líneas de laminación para aleaciones especializadas, mejorando la calidad y el rendimiento de todo tipo de productos, desde turbinas y placas de blindaje hasta componentes de alto rendimiento."
 ENG_ellesmere_port_decision: "Planta de imanes de tierras raras de Ellesmere Port"
 ENG_ellesmere_port_decision_desc: "Ampliamos el procesamiento de tierras raras en Ellesmere Port, produciendo imanes de alta calidad para turbinas eólicas, vehículos eléctricos y sistemas avanzados de defensa."
 ENG_shetland_hydrocarbon_decision: "Impulso de hidrocarburos al oeste de las Shetland"
 ENG_shetland_hydrocarbon_decision_desc: "Aceleramos el desarrollo de los campos de petróleo y gas al oeste de las Shetland, explotando reservas en aguas profundas para impulsar los hidrocarburos nacionales y la seguridad energética."
 ENG_rosebank_field_decision: "Desarrollar el campo petrolífero de Rosebank"
 ENG_rosebank_field_decision_desc: "Damos luz verde al desarrollo completo del campo de petróleo y gas de Rosebank, poniendo en marcha nuevas plataformas marinas y oleoductos para fortalecer nuestros suministros energéticos a largo plazo."
 ENG_cambo_offshore_decision: "Desarrollar el campo marino de Cambo"
 ENG_cambo_offshore_decision_desc: "Avanzamos con el proyecto marino de Cambo, añadiendo nuevos pozos y conexiones submarinas para poner en producción sus reservas de petróleo y gas."
 ENG_hornsea_wind_farm_decision: "Expandir el parque eólico de Hornsea"
 ENG_hornsea_wind_farm_decision_desc: "Respaldamos nuevas fases de la zona eólica marina de Hornsea en el mar del Norte, añadiendo turbinas y conexiones a la red eléctrica para suministrar más energía limpia desde el parque eólico más grande del mundo."
 ENG_drakeland_tungsten_decision: "Reabrir la mina de wolframio de Drakelands"
 ENG_drakeland_tungsten_decision_desc: "Reiniciamos la mina de Drakelands cerca de Plymouth, recuperando la producción de estaño y wolframio (tungsteno) para fortalecer el suministro británico de metales tecnológicos críticos."
 ENG_south_crofty_tin_decision: "Reabrir la mina de estaño de South Crofty"
 ENG_south_crofty_tin_decision_desc: "Financiamos la reapertura de South Crofty en Cornualles, reviviendo la minería profunda de estaño y añadiendo una fuente nacional constante de mineral de alta calidad para nuestra industria."
 ENG_scottish_industry_mission: "Beneficios inesperados de la industria escocesa"
 ENG_scottish_industry_mission_desc: "Nuestras inversiones en el acero y la industria pesada de Escocia pueden desbloquear nuevos filones, contratos y proyectos secundarios. Hay una probabilidad razonable de que la renovada actividad en las fundiciones y astilleros revele recursos adicionales que podamos poner en producción."
 ENG_celsa_steel_mission: "Revisión de la producción de acero de Celsa"
 ENG_celsa_steel_mission_desc: "Cada año revisamos la fundición de Celsa en Cardiff para comprobar si los nuevos pedidos, las ganancias de eficiencia o los flujos de chatarra justifican un nuevo incremento en la producción de acero."
 ENG_roysth_naval_port_decision: "Expandir el puerto naval de Rosyth"
 ENG_roysth_naval_port_decision_desc: "Ampliamos los muelles e instalaciones de apoyo en Rosyth, convirtiendo el estuario del Forth en una base más sólida para la modernización, el mantenimiento y la futura construcción de buques de guerra."
 ENG_expand_belfast_decision: "Expandir el polígono industrial de Belfast"
 ENG_expand_belfast_decision_desc: "Despejamos y acondicionamos nuevas parcelas alrededor de los muelles y la periferia de Belfast, abriendo espacio adicional para fábricas, astilleros y oficinas en toda Irlanda del Norte."
 ENG_highland_main_line_decision: "Modernizar la Highland Main Line"
 ENG_highland_main_line_decision_desc: "Modernizamos la línea ferroviaria Highland Main Line entre Perth e Inverness, recortando los tiempos de viaje y otorgando a las localidades de la ruta un impulso muy necesario en conectividad y productividad."
 ENG_titanic_quarter_decision: "Desarrollar el Titanic Quarter"
 ENG_titanic_quarter_decision_desc: "Reurbanizamos los antiguos terrenos de los astilleros de Belfast para convertirlos en el Titanic Quarter, combinando oficinas, estudios e industria marítima para insuflar nueva vida al antiguo emplazamiento de Harland & Wolff."
 ENG_productivity_gap_mission: "Pérdida de productividad"
 ENG_hs2_mission: "Construcción de la High-Speed 2"
 ENG_northen_powerhouse_mission: "Construcción de la Northern Powerhouse Rail"
 ENG_build_london: "Desarrollar el Gran Londres"
 ENG_build_london_desc: "Hemos prometido a nuestros electores de la zona del Gran Londres que las reformas están en camino. Y, como tal, debemos cumplir esta promesa."
 ENG_promise_labour: "Promesa a los sindicatos laboristas"
 ENG_promise_labour_desc: "Hemos hecho una promesa a los sindicatos laboristas y debemos actuar en consecuencia."
 ENG_promise_military: "Promesa al complejo militar-industrial"
 ENG_promise_military_desc: "Hemos hecho una promesa al complejo militar-industrial y debemos actuar en consecuencia."
 ENG_promise_fossil_fuel: "Promesa a las industrias de combustibles fósiles"
 ENG_promise_fossil_fuel_desc: "Hemos hecho una promesa a las industrias de combustibles fósiles y debemos actuar en consecuencia."
 ENG_monarchy_decision_category: "Casa de Windsor"
 ENG_monarchy_decision_category_desc: "La Casa de Windsor ha gobernado desde 1917, guiando a la monarquía moderna a través de guerras, cambios sociales y las presiones de un nuevo siglo. Se sitúa en el centro de la vida pública de Gran Bretaña, una dinastía entretejida en ceremonias, servicio y las discretas rutinas que mantienen unido al reino. Sus miembros ejercen su influencia a través del patronazgo, las visitas y la intervención discreta, llegando a organizaciones benéficas, la diplomacia y las fuerzas armadas de formas que la política por sí sola no puede lograr. Aquí se muestran las iniciativas de la familia real, indicando qué proyectos puede emprender cada miembro de la realeza y qué puede desencadenar su presencia."
 ENG_monarchy: "Casa de Windsor"
 ENG_charles_youth_sustainability_decision: "Capacitar a la juventud para la sostenibilidad"
 ENG_charles_youth_sustainability_decision_desc: "Su Alteza Real el príncipe Carlos pondrá en marcha un programa para apoyar a los jóvenes en el liderazgo de iniciativas sostenibles y respetuosas con el clima. Basándose en décadas de trabajo con organizaciones benéficas juveniles y causas medioambientales, el príncipe de Gales promoverá la educación, el desarrollo de habilidades y el emprendimiento alineados con la resiliencia ecológica. Este programa reconoce el papel vital de las generaciones más jóvenes en la construcción de un futuro más sostenible."
 ENG_charles_sustainable_urban_planning_decision: "Promover la planificación urbana sostenible"
 ENG_charles_sustainable_urban_planning_decision_desc: "Su Alteza Real el príncipe Carlos defenderá una planificación urbana y comunitaria sostenible basada en principios de diseño holístico que prioricen a las personas, el medio ambiente y la resiliencia a largo plazo. Apoyándose en su longeva defensa de la construcción de comunidades que respeten el contexto climático y cultural, este programa promoverá enfoques tradicionales y ecológicamente sensibles para la arquitectura, la infraestructura y el uso de la tierra."
 ENG_charles_organic_agriculture_decision: "Defender la agricultura ecológica y sostenible"
 ENG_charles_organic_agriculture_decision_desc: "Su Alteza Real el príncipe Carlos utilizará su influencia para defender los métodos de agricultura ecológica y sostenible tanto en comunidades rurales como globales. Basándose en sus décadas de compromiso con la gestión ecológica y la agricultura regenerativa, el príncipe promoverá prácticas que fortalezcan la salud del suelo, apoyen a las granjas familiares y reduzcan el impacto medioambiental."
 ENG_charles_environmental_diplomacy_tour_decision: "Gira de diplomacia medioambiental"
 ENG_charles_environmental_diplomacy_tour_decision_desc: "Su Alteza Real el príncipe Carlos se embarcará en una gira internacional de diplomacia medioambiental para promover la cooperación en iniciativas climáticas y de sostenibilidad. A lo largo de sus décadas de servicio como príncipe de Gales, ha visitado numerosas naciones y se ha reunido con líderes y comunidades para fomentar la acción contra el cambio climático, la protección de las selvas tropicales y el desarrollo sostenible. Esta gira buscará fortalecer las asociaciones globales y resaltar los compromisos compartidos para salvaguardar el mundo natural."
 ENG_charles_rainforest_help_decision: "Apoyar la protección global de las selvas tropicales"
 ENG_charles_rainforest_help_decision_desc: "Su Alteza Real el príncipe Carlos encabezará un programa para promover la acción global contra la destrucción de las selvas tropicales. Como fundador del Prince's Rainforests Project, trabajará con gobiernos, organizaciones y la sociedad civil para resaltar la importancia de preservar las selvas tropicales y su papel en la lucha contra el cambio climático."
 ENG_charles_charities_network_decision: "Activar la red de organizaciones benéficas del príncipe"
 ENG_charles_charities_network_decision_desc: "Su Alteza Real el príncipe Carlos activará su extensa red de organizaciones benéficas para apoyar causas sociales, educativas y medioambientales en casa y en el extranjero. Como presidente de The Prince's Charities, un grupo de organizaciones fundadas o patrocinadas por el príncipe de Gales, aprovechará la experiencia colectiva de las mismas para construir comunidades sostenibles, promover oportunidades y mejorar el bienestar en múltiples regiones."
 ENG_charles_harmony_tour_decision: "Emprender una gira diplomática de la armonía"
 ENG_charles_harmony_tour_decision_desc: "Su Alteza Real el príncipe Carlos se embarcará en una gira internacional para promover su filosofía de la Armonía y fomentar la cooperación en cuestiones medioambientales y de sostenibilidad. A lo largo de sus décadas de servicio como príncipe de Gales, ha utilizado sistemáticamente su influencia para resaltar la necesidad de la acción climática, la protección de las selvas tropicales y el desarrollo sostenible; esta gira buscará fortalecer las asociaciones globales en torno a estos objetivos compartidos."
 ENG_andrew_naval_haritage_decision: "Adoptar el patrimonio naval"
 ENG_andrew_naval_haritage_decision_desc: "El príncipe Andrés se apoyará en su larga carrera naval para resaltar las tradiciones marítimas y el servicio de su nación. Habiendo servido como piloto de helicóptero de la Marina Real, instructor y comandante con servicio activo en el conflicto de las Malvinas, fomentará el respeto por el patrimonio naval y promoverá la cooperación con flotas aliadas e instituciones de formación marítima de todo el mundo."
 ENG_andrew_trade_representive_decision: "Misión de representante comercial"
 ENG_andrew_trade_representive_decision_desc: "El príncipe Andrés se embarcará en una misión de representación comercial para promover los intereses comerciales británicos en el extranjero. Basándose en su experiencia como representante especial del Reino Unido para el Comercio Internacional y la Inversión, se reunirá con gobiernos extranjeros, líderes empresariales e inversores para destacar las oportunidades para las exportaciones del Reino Unido y la inversión extranjera directa, fortaleciendo los lazos económicos y fomentando la cooperación en materia de comercio y emprendimiento."
 ENG_andrew_emerging_trade_agreement_decision: "Buscar acuerdos comerciales emergentes"
 ENG_andrew_emerging_trade_agreement_decision_desc: "El príncipe Andrés encabezará los esfuerzos para buscar acuerdos comerciales y asociaciones empresariales en mercados globales emergentes. Basándose en su amplia experiencia representando los intereses comerciales británicos en el extranjero, buscará abrir oportunidades para exportaciones, asociaciones e inversiones con economías en desarrollo que muestren un alto potencial para el crecimiento y la cooperación futuros."
 ENG_andrew_emerging_economy_benefits_decision: "Aprovechar las asociaciones con economías emergentes"
 ENG_andrew_emerging_economy_benefits_decision_desc: "El príncipe Andrés se centrará en fortalecer las alianzas con economías emergentes para expandir las oportunidades de comercio, inversión y crecimiento económico compartido. Basándose en su amplia experiencia en la promoción de los intereses comerciales británicos en todo el mundo, esta iniciativa tiene como objetivo atraer inversiones y conocimientos de mercados en rápido desarrollo, impulsar la productividad nacional y fomentar un entorno empresarial más dinámico."
 ENG_andrew_digital_enterprise_decision: "Iniciativa de emprendimiento digital"
 ENG_andrew_digital_enterprise_decision_desc: "El príncipe Andrés pondrá en marcha una iniciativa de emprendimiento digital para promover las habilidades digitales y el espíritu empresarial en toda la nación. Inspirado en su trabajo con los premios al emprendimiento digital que ayudaron a las personas a desarrollar competencias técnicas, comerciales y en línea, este programa tiene como objetivo apoyar a los futuros innovadores digitales, fomentar la alfabetización tecnológica y construir una base más sólida para la economía digital."
 ENG_anne_national_charity_decision: "Organizaciones benéficas nacionales de la princesa real"
 ENG_anne_national_charity_decision_desc: "La princesa real ampliará y coordinará sus patronazgos nacionales para impulsar resultados prácticos en lugar de meras sesiones fotográficas. Las campañas de recaudación de fondos, la movilización de voluntarios y la atención pública se dirigirán allá donde la capacidad institucional esté al límite de sus fuerzas."
 ENG_anne_carers_promotion_decision: "Campaña de reconocimiento a los cuidadores"
 ENG_anne_carers_promotion_decision_desc: "Ana situará a los cuidadores no remunerados en el centro de la atención nacional, presionando a las instituciones para que traten los cuidados como un servicio esencial y no como una carga privada. La campaña eleva el apoyo al descanso laboral, la flexibilidad en el puesto de trabajo y el respeto público a través del patronazgo real y una visibilidad implacable."
 ENG_anne_military_readiness_decision: "Estándares de preparación militar"
 ENG_anne_military_readiness_decision_desc: "La princesa real utilizará sus nombramientos militares para exigir profesionalidad, disciplina en el adiestramiento y las rutinas poco glamurosas que mantienen a las unidades listas para el despliegue. Las inspecciones, los ejercicios y el seguimiento logístico se impulsarán como la verdadera medida de la seriedad."
 ENG_anne_navy_readiness_decision: "Inspecciones de preparación de la flota"
 ENG_anne_navy_readiness_decision_desc: "Se presionará a la Marina Real para que demuestre que puede navegar, combatir y sostenerse a sí misma bajo presión. La presencia de Ana impone estándares: el mantenimiento, la competencia de las tripulaciones y el ritmo operativo se tratarán como cuestiones no negociables."
 ENG_anne_tourism_decision: "Impulso real al turismo"
 ENG_anne_tourism_decision_desc: "La reputación de Gran Bretaña es un activo, y la princesa real la empleará con determinación. Un impulso turístico enfocado destacará el patrimonio, los eventos y las economías locales que necesiten demanda, transformando los compromisos reales en reservas hoteleras e inversiones."
 ENG_edward_beach_youth_decision: "Alcance juvenil costero"
 ENG_edward_beach_youth_decision_desc: "El conde de Wessex llevará el trabajo de la Corona con la juventud a las zonas costeras, utilizando visitas, programas de premios y asociaciones locales para atraer a los jóvenes hacia las habilidades y el servicio. El mensaje es práctico: confianza, disciplina y una vía para avanzar."
 ENG_edward_global_youth_decision: "Compromiso juvenil global"
 ENG_edward_global_youth_decision_desc: "Eduardo extenderá el compromiso con la juventud más allá de Gran Bretaña, fortaleciendo los lazos mediante intercambios, adiestramientos y proyectos cívicos compartidos con socios en el extranjero."
 ENG_edward_arts_culture_patronage_decision: "Patronazgo de las artes y la cultura"
 ENG_edward_arts_culture_patronage_decision_desc: "La Corona defenderá el sector artístico y cultural de Gran Bretaña tanto como una seña de identidad como una influencia estratégica. El patronazgo real aumentará la visibilidad, desbloqueará financiación y protegerá a las instituciones que configuran la narrativa nacional en casa y en el extranjero."
 ENG_edward_production_guild_decision: "Apoyar a los gremios de producción"
 ENG_edward_production_guild_decision_desc: "Los gremios y los oficios de producción cualificados de Gran Bretaña son el pilar de la calidad y la fuerza exportadora. Eduardo respaldará a los gremios de producción mediante el reconocimiento oficial, los vínculos de adiestramiento y la coordinación industrial que mantiene vivos los oficios y abiertos los canales de suministro."
 ENG_edward_veteran_support_decision: "Apoyo a veteranos de Wessex"
 ENG_edward_veteran_support_decision_desc: "El servicio no termina con el licenciamiento, y la Corona no tratará a los veteranos como un asunto secundario. El conde de Wessex coordinará a organizaciones benéficas, empleadores y autoridades locales para mejorar el apoyo en la transición, la estabilidad de la vivienda y las vías de empleo."
 ENG_philip_award_medal_decision: "Entregar la Medalla del Príncipe Felipe"
 ENG_philip_award_medal_decision_desc: "El príncipe Felipe se embarcará en su propia misión para entregar la Medalla del Príncipe Felipe a un ingeniero destacado de impacto global excepcional. Este galardón reconoce los logros sobresalientes en la práctica de la ingeniería y la innovación bajo su patronazgo personal."
 ENG_philip_award_expansion_decision: "Expandir los Premios Juveniles del Duque"
 ENG_philip_award_expansion_decision_desc: "El príncipe Felipe viajará para poner en marcha una expansión del Premio del Duque de Edimburgo, con el objetivo de abrir este programa juvenil a un público internacional más amplio. Sus esfuerzos buscan fortalecer la resiliencia de la juventud y las habilidades cívicas en numerosas naciones."
 ENG_philip_trust_funds_grants_decision: "Activar las subvenciones del Fondo Fiduciario del Príncipe Felipe"
 ENG_philip_trust_funds_grants_decision_desc: "El príncipe Felipe supervisará personalmente el desembolso de las subvenciones del Fondo Fiduciario del Príncipe Felipe para proyectos educativos y comunitarios locales. Su implicación directa garantiza el apoyo a iniciativas que mejoran el esparcimiento, el aprendizaje y la vida cívica."
 ENG_philip_faith_conservation_decision: "Lanzar la Iniciativa de Fe y Conservación"
 ENG_philip_faith_conservation_decision_desc: "El príncipe Felipe emprenderá un programa para unir a las comunidades religiosas y a los grupos ecologistas en favor de la gestión conjunta de la naturaleza. Su objetivo es movilizar recursos morales y comunitarios detrás de metas de conservación sostenibles."
 ENG_philip_innovation_recognition_decision: "Establecer el Reconocimiento Nacional a la Innovación"
 ENG_philip_innovation_recognition_decision_desc: "El príncipe Felipe iniciará un plan nacional para recompensar el diseño industrial sobresaliente, la ciencia y la resolución práctica de problemas. Su iniciativa destaca el ingenio como un pilar del crecimiento económico y el éxito nacional."
 ENG_william_air_ambulance_decision: "Realizar un turno en ambulancia aérea"
 ENG_william_air_ambulance_decision_desc: "El príncipe Guillermo se marcha a realizar otro turno en la ambulancia aérea, pilotando misiones de emergencia y reuniéndose con las tripulaciones sobre el terreno."
 ENG_william_mental_health_at_work_decision: "Salud mental en el trabajo"
 ENG_william_mental_health_at_work_decision_desc: "El príncipe Guillermo se pone en marcha para movilizar a empleadores y organizaciones benéficas en favor de un impulso a la salud mental en el trabajo."
 ENG_william_step_into_health_decision: "Campaña Step into Health"
 ENG_william_step_into_health_decision_desc: "El príncipe Guillermo sale a la carretera para respaldar el programa Step into Health y abrir vías de acceso en el Servicio Nacional de Salud (NHS) para veteranos y familias militares."
 ENG_william_early_years_forum_decision: "Convocar el Foro de la Primera Infancia"
 ENG_william_early_years_forum_decision_desc: "El príncipe Guillermo convoca un foro sobre la Primera Infancia para reunir en una misma sala a expertos, organizaciones benéficas y empresas."
 ENG_william_chogm_youth_decision: "Mensaje a la juventud en la CHOGM"
 ENG_william_chogm_youth_decision_desc: "El príncipe Guillermo asiste a una sesión juvenil de la Reunión de Jefes de Gobierno de la Commonwealth (CHOGM) para señalar que las nuevas generaciones importan para el futuro de la Mancomunidad."
 ENG_seize_sierra_leone_resources: "Explotar [SIE.GetFlag] Sierra Leona"
 ENG_seize_sierra_leone_resources_desc: "Es hora de sacar algo en limpio de la Operación Barras. Nos incautaremos de recursos vitales en Sierra Leona y estableceremos nuestra influencia económica por un periodo de 500 días."
 ENG_war_for_delta: "Guerra por el Delta"
 ENG_war_for_delta_desc: "Tal vez hayamos presionado a los nigerianos un poco demasiado, permitiendo que su ego reprima cualquier temor que pudieran tener a enfrentarse a nuestras fuerzas. No obstante, tendremos que tomar su capital para demostrarles quién maneja verdaderamente las cosas por aquí."
 ENG_end_of_the_world: "Conquistar el Fin del Mundo"
 ENG_end_of_the_world_desc: "Tierra del Fuego, también apodada 'El Fin del Mundo', es un archipiélago importante y la puerta de entrada a la Antártida. Apoderarse de este emplazamiento vital podría reportar enormes beneficios a la nación en su conjunto, tanto es así que estamos dispuestos a luchar por él."
 ENG_operation_eastern_divide: "Operación División Oriental"
 ENG_operation_eastern_divide_desc: "Los egipcios no han atendido a nuestros llamamientos para un acceso justo e igualitario a través del Suez y, como resultado, no nos ha quedado más opción que recurrir a la acción militar."
 ENG_a_more_united_kingdom: "Un Reino Más Unido"
 ENG_a_more_united_kingdom_desc: "Aunque nuestro Estado se encuentra unido tal como está, partes de nuestro reino se fracturaron y se separaron en estados independientes. Si queremos ser verdaderamente un Reino Unido, necesitamos reunificar a los estados de la Commonwealth de todos los rincones del mundo."
 ENG_fractured_kingdom_united_state: "Reino fracturado, Estado unido"
 ENG_fractured_kingdom_united_state_desc: "§R'Ciudadano, no súbdito'§!\nMientras la monarquía y el régimen anterior se desvanecían en el olvido, el Estado no hizo más que fortalecerse. Ha llegado el momento de adoptar una postura más firme y dominante en la escena mundial y de castigar finalmente a quienes saquearon esta tierra durante siglos."
 ENG_deeper_commonwealth_integration: "Integración más profunda de la Commonwealth"
 ENG_deeper_commonwealth_integration_desc: "Si queremos convertirnos en un Estado verdaderamente unido, primero tendremos que trabajar para convencer a quienes deseamos integrar de que somos un anfitrión adecuado. Solo entonces seremos capaces de dar los siguientes pasos."
 ENG_sovereignty_above_all: "La soberanía por encima de todo"
 ENG_sovereignty_above_all_desc: "Nada importa más que la capacidad de nuestros administradores para determinar el futuro de nuestro pueblo. Ningún otro Estado más que el nuestro debería tener voz ni voto en cómo manejamos las cosas."
 ENG_establishing_new_leadership: "Establecer el nuevo régimen"
 ENG_establishing_new_leadership_desc: "Antes de ponernos manos a la obra, tendremos que establecer un nuevo régimen. Será necesario un desarraigo social, y debemos empezar a planificar una nueva autoridad de transición que tome el mando en partes del país para facilitar el proceso."
 ENG_two_way_concessions: "Concesiones mutuas"
 ENG_two_way_concessions_desc: "No podemos esperar que se avance en la consecución de un acuerdo con la descentralización si solo una de las partes hace el esfuerzo. Haremos algunas concesiones y esperaremos que la otra parte en Escocia haga lo mismo."
 ENG_uniting_the_isle: "Unificar la isla"
 ENG_uniting_the_isle_desc: "Los irlandeses son la causa de gran parte de nuestros problemas, desde avivar las tensiones hasta tener partidos políticos que exigen el separatismo norirlandés. Ya va siendo hora de intervenir y darles una lección."
 ENG_revolution_not_devolution: "Revolución, no descentralización"
 ENG_revolution_not_devolution_desc: "Para tener un Estado verdaderamente unido, primero debemos destruir la causa de la descentralización. ¡Necesitamos una revolución nacional, no una transferencia de competencias!"
 ENG_bring_in_canada: "Atraer a Canadá"
 ENG_bring_in_canada_desc: "Debemos tender una mano a Canadá como el mayor miembro de la Commonwealth en términos de extensión territorial. Nuestros amigos canadienses han mantenido una estrecha cercanía a lo largo del tiempo, por lo que no debería ser demasiado difícil subirlos a bordo."
 ENG_the_realm_of_britain: "El Reino de Gran Bretaña"
 ENG_the_realm_of_britain_desc: "El Reino de Gran Bretaña es algo que nunca podrá ser destruido, con el espíritu del pueblo británico perseverando en los momentos de especial dificultad."
 ENG_glory_of_pax_britannica: "La gloria de la Pax Britannica"
 ENG_glory_of_pax_britannica_desc: "Nuestro pasado es glorioso, y hay quienes dicen que el pasado no ha desaparecido verdaderamente, sino que es un presagio de lo que está por venir. ¡Necesitamos materializar los sueños de nuestros antepaspos e imperios y restaurar la gloria de la Pax Britannica!"
 ENG_australian_outreach: "Acercamiento a Australia"
 ENG_australian_outreach_desc: "No podemos olvidar los sacrificios que los australianos han hecho a lo largo de la historia por nuestra causa. Por lo tanto, es imperativo que pasemos a invitarlos a unirse a nosotros en el futuro venidero."
 ENG_new_zealands_offer: "La oferta de Nueva Zelanda"
 ENG_new_zealands_offer_desc: "El pueblo kiwi ha sido durante muchísimo tiempo un aliado incondicional nuestro, y en las buenas y en las malas ha permanecido a nuestro lado. Es de justicia que les pidamos que se unan a nosotros."
 ENG_fracture_nato_unity: "Fracturar la unidad de la OTAN"
 ENG_fracture_nato_unity_desc: "Si bien es cierto que nos beneficiamos de la seguridad de la OTAN durante muchísimo tiempo, ese ya no es el caso. Debemos comprender que nuestros antiguos amigos no desean otra cosa que dividir y fracturar nuestro Estado, y nuestro pueblo debe ser consciente de ello."
 ENG_end_eastern_suffering: "Fin del sufrimiento oriental"
 ENG_end_eastern_suffering_desc: "El patético conglomerado de estados de Europa del Este encabezado por Rusia sufre una lenta y terrible decadencia. Es mejor que intervengamos y establezcamos una verdadera prosperidad y orden en esa región."
 ENG_declare_the_commonwealth: "Declarar la Commonwealth"
 ENG_declare_the_commonwealth_desc: "Ahora que todas las tierras (las importantes al menos) de la Commonwealth se han unido a nosotros bajo una sola bandera, es de justicia que declaremos al mundo que la Federación de la Commonwealth está aquí, y que está aquí para quedarse."
 ENG_active_resource_project: "§YProyecto de minerales críticos activo§!"
 ENG_active_productivity_project: "§YProyecto de productividad nacional activo§!"
 ENG_ucl_east_campus: "Campus Este de la UCL"
 ENG_mechanic_menu_explanation: "Descentralización"
 ENG_devolution_HEADER_TITTLE_LOC: "Asuntos descentralizados"
 ENG_mechanic_menu_explanation_2: "La descentralización nos permite devolver parte del poder a manos de nuestros territorios constituyentes. Podemos gestionarlos haciendo clic en su respectivo estado. Cada territorio constituyente tendrá un §CParlamento§!, un nivel de §RAgitación§! y un nivel de §GDependencia§!. Pasa el cursor sobre el botón de §Ginformación§! para obtener una explicación detallada."
 ENG_parliament_gui_tooltip: "Cada territorio constituyente tendrá su propio Parlamento. Dependiendo de la agitación de cada territorio, el pueblo puede ser más o menos propenso a votar por un miembro parlamentario proindependentista. Sin embargo, una vez que un parlamentario proindependentista asume el cargo, será muy poco probable que pierda las elecciones. Si los parlamentarios proindependentistas se convierten en mayoría, pueden empezar a impulsar proyectos de ley que reduzcan su dependencia y, en algún momento, llegar a exigir un referéndum.\n\nNuestros súbditos tendrán una opinión sobre nosotros, y esta se representa a través de su Agitación. Un territorio constituyente puede estar más agitado dependiendo de nuestro partido político, del número de proyectos de ley que vetemos o si aumentamos su dependencia por la fuerza. La agitación puede verse afectada por ciertos eventos, decisiones o enfoques. Un territorio constituyente que dependa en gran medida de Westminster se calmará por sí solo cada mes, mientras que uno que ya no nos necesite se enfurecerá de forma constante. La agitación alimenta la puntuación de la Presión de Independencia, que decide si comienza una campaña de referéndum.\n\nLa dependencia determina el nivel en el que un territorio constituyente puede valerse por sí mismo. Si la dependencia es baja, pueden empezar a presionar por obtener más libertades, ya que pueden arreglárselas perfectamente sin el Reino. Tendremos la oportunidad de reducir o aumentar su dependencia en función de los eventos que recibamos y los enfoques que seleccionemos.\n\nEl nacionalismo, la agitación y la proporción de autosuficiencia se combinan en una puntuación de Presión de Independencia. Una vez que un territorio constituyente tiene una mayoría proindependentista y su presión supera el §R60§!, comienza una campaña de referéndum. A partir de ese momento, disponemos de un año para reducir esa presión por debajo de §G50§! antes de que el referéndum se convoque formalmente. Solo un territorio constituyente puede llevar a cabo una campaña a la vez, y ningún otro podrá hacerlo durante los cinco años posteriores.\n\nLa tensión norirlandesa representa las fricciones entre los protestantes unionistas y los católicos republicanos. Las decisiones que tomemos pueden reavivar las tensiones; si estas alcanzan el 50%, se producirán enfrentamientos violentos ocasionales. Si las tensiones siguen aumentando más allá del 50%, la frecuencia con la que ocurren estos enfrentamientos se incrementará."
 ENG_dependency_gui_tooltip2: "La dependencia determina el nivel en el que un territorio constituyente puede valerse por sí mismo. Si la dependencia es baja, pueden empezar a presionar por obtener más libertades, ya que pueden arreglárselas perfectamente sin el Reino. Tendremos la oportunidad de reducir o aumentar su dependencia en función de los eventos que recibamos y los enfoques que seleccionemos."
 ENG_parliament_gui_tooltip2: "Cada territorio constituyente tendrá su propio Parlamento. Dependiendo de la agitación de cada territorio, el pueblo puede ser más o menos propenso a votar por un miembro parlamentario proindependentista. Sin embargo, una vez que un parlamentario proindependentista asume el cargo, será muy poco probable que pierda las elecciones. Si los parlamentarios proindependentistas se convierten en mayoría, pueden empezar a impulsar proyectos de ley que reduzcan su dependencia y, en algún momento, llegar a exigir un referéndum."
 ENG_agitation_gui_tooltip2: "Nuestros súbditos tendrán una opinión sobre nosotros, y esta se representa a través de su Agitación. Un territorio constituyente puede estar más agitado dependiendo de nuestro partido político, del número de proyectos de ley que vetemos o si aumentamos su dependencia por la fuerza. La agitación puede verse afectada por ciertos eventos, decisiones o enfoques. Un territorio constituyente que dependa en gran medida de Westminster se calmará por sí solo cada mes, mientras que uno que ya no nos necesite se enfurecerá de forma constante. La agitación alimenta la puntuación de la Presión de Independencia, que decide si comienza una campaña de referéndum."
 ENG_irish_tension_tooltip: "La tensión norirlandesa representa las fricciones entre los protestantes unionistas y los católicos republicanos. Las decisiones que tomemos pueden reavivar las tensiones; si estas alcanzan el 50%, se producirán enfrentamientos violentos ocasionales. Si las tensiones siguen aumentando más allá del 50%, la frecuencia con la que ocurren estos enfrentamientos se incrementará."
