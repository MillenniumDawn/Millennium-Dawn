 iraqi_MNF.16.d: "After weeks of being on the run, Hani Abd al-Latif Tilfah was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
