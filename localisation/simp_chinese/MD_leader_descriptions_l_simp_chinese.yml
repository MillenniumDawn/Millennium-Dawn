 DAVID_DUKE_LEADER_DESC: ""
 ANN_COULTER_LEADER_DESC: ""
 JIANG_ZEMIN_LEADER_DESC: "江泽民（1926年8月17日出生）曾是一名工程师，自1989年天安门事件后接替改革派赵紫阳，成为中国共产党最高领导人。他曾任上海市市长，并一直偏袒曾在上海共事的同僚，导致其领导的党内派系被戏称为“上海帮”。江泽民倡导经济改革，在20世纪90年代执政期间，延续了邓小平的改革开放政策，并推动了私营部门的正常化。他还主导了香港和澳门的回归，但同时也因其在人权问题上的强硬态度而饱受诟病。"
 HU_JINTAO_LEADER_DESC: "胡锦涛（生于1942年12月21日）曾是一名工程师，在文化大革命期间经历了对其父亲的攻讦。如今作为领导人，他表示希望解决经济快速增长对中国社会和环境的影响，并领导共产党内的团派，或称为共青团。胡锦涛与温家宝总理一起，寻求更均匀地分配中国经济发展的成果，并采取一种不那么精英化的治理模式，同时坚定地保留共产党的首要地位。"
 XI_JINPING_LEADER_DESC: "习近平（生于1953年6月15日）是被称为太子党的新一代中国政别中的一员。作为一名中共元老的儿子，习近平强调在他的领导下实行中央集权和巩固权力，通过反腐运动削弱政治对手和现有的共产党派别。他还主张采取强硬的外交政策，与邓小平在国际事务中保持低调的政策不同。"
 BO_XILAI_LEADER_DESC: "薄熙来（1949年7月3日出生）是著名的“太子党”成员，也是前国务院副总理薄一波之子。他曾任重庆市委书记，以打击黑社会和复兴“红色文化”而闻名，这为他赢得了对中国经济增长不平衡现状不满的左翼人士的支持。薄熙来的政治生涯树敌众多，其声誉也颇具争议。"
 KIM_DAE_JUNG_LEADER_DESC: "金大中（生于1924年1月6日）是韩国政坛备受尊敬的人物，因为他长期从事支持民主的活动，有人称他为 “亚洲的纳尔逊·曼德拉”。在经历了疑似暗杀企图、情报人员的绑架以及死刑判决后，金大中终于从近50年的反对派中脱颖而出，领导他的国家。自1998年上任以来，他的优先事项包括经济复苏，追究韩国强大的财阀的责任，以及其标志性的“阳光政策”，与朝鲜和平接触。"
 ROH_MOO_HYUN_LEADER_DESC: "卢武铉（生于1946年8月6日）是一位出身贫寒的前人权律师，曾为学生抗议者辩护，反对专制政权。与支持他担任总统的金大中一样，卢武铉赞成与朝鲜谈判，而不是采取国际孤立的政策。他还公开批评美国和日本，并与韩国的保守派机构保持着对立关系。卢武铉的支持来自于左倾的“386一代”，其都是30多岁，在80年代上大学，都出生于60年代。"
 LEE_MYUNG_BAK_LEADER_DESC: "李明博（生于1941年12月19日）是一位保守派政治家，也是现代汽车公司的前CEO。在现代汽车公司任职期间，他赢得了“愤怒的推土机”的绰号，部分原因是他严格的管理方法。作为一个雄心勃勃的人物，李希望将韩国转变为世界上最大的经济体之一，并推动国际主义的外交政策，提升韩国的全球地位。与他的左翼同行相比，李赞成对朝鲜采取强硬的态度，并与美国建立密切的伙伴关系。"
 PARK_GEUN_HYE_LEADER_DESC: "朴槿惠（生于1952年2月2日）是朴正熙的女儿，朴正熙是韩国的前独裁领导人，他的遗产至今仍有争议。虽然有些人认为朴正熙是一个残暴的独裁者，用酷刑和监禁来维护他的统治，但也有人赞扬他的经济成就。朴槿惠在年轻时经历了对母亲和父亲的暗杀，前者是在朝鲜特工手中，后者是在韩国中央情报局局长金载圭手中。朴槿惠以其保守的、以市场为导向的立场而著称，她赞成放松管制、减税以及法律和秩序。"
 MOON_JAE_IN_LEADER_DESC: "文在寅（1953年1月24日出生）是朝鲜难民之子，其父曾是一名人权律师和活动家。服兵役期间，文在寅曾担任特种部队突击队员，并参与了“保罗·班扬行动”，即韩美联合应对1976年板门店斧头杀人事件的行动。他与前任总统卢武铉是挚友，两人曾共同创办律师事务所。文在寅积极参与卢武铉的左翼政府，并在阳光政策中扮演重要角色，至今仍致力于推行该政策。尽管文在寅坚持美韩同盟，但他表示韩国应该学会对美国说“不”，并希望从美国手中夺回韩国军队的战时控制权。"
 KIM_JONG_UN_LEADER_DESC: "金正恩（1984年1月8日出生）是金正日生前最宠爱的儿子。在瑞士求学期间，他略显肥胖的身材使人低估了他。然而，当他登上权力巅峰后，他以冷静、精明和冷酷无情震惊了世界。他秘密处决政治对手（据未经证实的报道，包括用高射炮处决他的叔父），不顾国际制裁坚持发展核武器，并精准把握时机与美国和韩国展开友好对话。在他的领导下，这位“天降伟人”或许真的有可能让朝鲜成为“强大繁荣的国家”？"
 KIM_JONG_NAM_LEADER_DESC: "金正男（1971年5月10日出生）是金正日与第二任妻子所生的儿子。作为家中的长子，金正男亲眼目睹了“苦难行军”下人民的苦难。在国外期间，他看到中国改革开放的快速发展，感受到变革的力量。他认为只有改革才能给朝鲜人民带来物质繁荣和精神幸福，但他也明白，变革可能会让他失去权力。但他从未后悔。"
 KIM_YO_JONG_LEADER_DESC: "金与正（生于1987年9月26日）作为家中唯一的女孩，自开始政治生涯以来就表现出如此的才华，以至于金正日在选择继任者时惊呼：“要是金与正是个男孩就好了”。也许是因为她的女性形象，她（特别地）在国内外都享有很高的支持。今天，她的统治证明，无论什么样的国家政治，女性都可以和男性一样好。"
 POLITICS_PAUL_KAGAME_DESC: "保罗·卡加梅28岁时，就帮助推翻了乌干达政府。36岁时，他推翻了卢旺达由胡图族领导的种族灭绝政权。39岁时，他推翻了刚果民主共和国的蒙博托 - 非洲最腐败、最残暴的独裁者。卡加梅可能是当今最成功的军事领袖，他赢得的战争比任何人都多 - 而且这一切都是在预算极其有限的情况下完成的。这位图西族将军在国内镇压一切反对派的同时，也不断将目光投向海外，追捕胡图族叛军，并掠夺矿产资源。"
 costas_simitis_desc: "科斯塔斯·西米蒂斯(生于1936年6月23日)是律师乔治西米蒂斯和雅典经济大学教授的儿子。他在希腊军政府期间，参加过反政府组织。不久后希腊军政府倒台，在1974年，科斯塔斯·西米蒂斯与他人成立了泛希腊社会运动党。在1981年泛希腊社会运动党选举胜利后，在安德烈亚斯·乔治乌·帕潘德里欧的统治期间，他被要求在许多政府职位任职例如经济、农业、教育和宗教部门的领导，以及同时在工业、研究、能源、技术和贸易部门担任领导。安德烈亚斯·乔治乌·帕潘德里欧在1996年去世后，他被选为泛希腊社会主义运动党的领导，不久后他在1996年大选中获胜。现在，科斯塔斯-西米蒂斯期待着稳步增加公共部门的私有化程度，经济稳定，降低国家债务，解决希腊-土耳其争端，最重要的是增加与欧盟的联系和合作。"
 nikolaos_michaloliakos_desc: "尼古拉斯·米哈洛里亚科斯（1957年12月11日出生）是希腊最大的民族主义政党 - 金色黎明党的创始人。米哈洛利亚科斯曾是希腊军政府的支持者，并以参与多个极右翼组织而闻名，这些组织曾袭击过许多反独裁人士，他还与希腊军政府首脑乔治·帕帕多普洛斯关系密切。1980年，他组建了极右翼政党金色黎明党，该党奉行反左翼、反移民的纲领，美化希腊的威权政权，例如1967年军政府和1936年8月4日政权，并与俄罗斯和中国结盟，疏远西方。米哈洛利亚科斯及其金色黎明党被谴责为犯罪组织，该组织以少数族裔为目标，持有亲新纳粹和法西斯主义观点，并持反民主立场。尽管尼古拉斯·米哈洛利亚科斯及其政党遭到强烈反对，但随着希腊经济动荡和社会分裂加剧，金色黎明党的支持率却不断攀升，吸引了更多支持者。如果局势进一步恶化，尼古拉斯·米哈洛利亚科斯或许能够实现其目标，夺取政权并建立一个全新的希腊国家。"
 COUNCIL_FOR_NATIONAL_PRESERVATION_DESC: "该委员会是原美国联邦政府的残余势力。因此，残存的势力正试图将剩余的人民和领土团结在一面新的旗帜下。委员会成员致力于维护法律秩序和和平，以便顺利地将权力移交给新政府。"
 MATHEW_CROUDER_DESC: "“元帅”有点自相矛盾。他既健谈又异常安静，处理事情或做自己感兴趣的事情时，总给人一种漫不经心的感觉。尽管他最初看起来不太可能成为任何领导者，但他善于结交朋友的软实力以及温和的性格使他成为一个相当容易让人产生共鸣的人。虽然他有时会在冲突性事件中表现得有些冲动，但他仍然努力尽己所能地帮助尽可能多的人。正如他曾被一位采访者引用的那样：“人生是一团奇怪而混乱的乱麻，你永远无法真正预知自己最终会走向何方，即使你想做某件事，最终也可能发现自己做的是完全相反的事情。我的意思是，从高中时的预备役军官训练团，到撰写宪法和探索微型国家构想的古怪爱好，我从未想过自己会成为一名政治领袖……更不用说联邦层面的领袖了。”马修这种略带天真却又无比乐观的态度，让他现在掌管了美利坚合众国南方共和国，尽管他要做什么鲜为人知，现在我们只能拭目以待。"
 CONGRESSIONAL_CHAMBERS_DESC: "由于选举团制度失灵，佛罗里达州的选举又出现了意想不到的问题，国会正忙着弄清楚该投票给谁，或者至少在事态进一步恶化之前确定总统人选。"
 YOON_SUK_YEOL_LEADER_DESC: "尹锡悦（1960年12月18日出生）曾任韩国检察总长、首尔中央地方检察院检察长。尹锡悦总统任期内曾宣布紧急戒严，指责反对派控制国会、同情朝鲜、通过反国家活动使政府陷入瘫痪。但随后国会投票解除戒严。此后，尹锡悦被控煽动叛乱罪并被勒令禁止出境，成为韩国历史上第一位被禁止出境的在任总统。而后来尹锡悦被捕，成为韩国历史上第一位被捕的在任总统。"