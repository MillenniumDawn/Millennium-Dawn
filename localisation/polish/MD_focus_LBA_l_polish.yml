 LBA_unit_leader_trait_tripolitania: "Powinowactwo plemienne: Trypolitania"
 LBA_unit_leader_trait_tripolitania_desc: "Dowódca ten pochodzi z plemienia z Trypolitanii. W przypadku konfliktu pomiędzy władzą centralną a plemieniem możliwe jest, że osoba ta wybierze swoje plemię, a nie naród."
 LBA_unit_leader_trait_cyrenaica: "Powinowactwo plemienne: Cyrenajka"
 LBA_unit_leader_trait_cyrenaica_desc: "Dowódca ten pochodzi z plemienia z Cyrenajki. W przypadku konfliktu pomiędzy władzą centralną a plemieniem możliwe jest, że osoba ta wybierze swoje plemię, a nie naród."
 LBA_unit_leader_trait_fezzan: "Powinowactwo plemienne: Fezzan"
 LBA_unit_leader_trait_fezzan_desc: "Ten dowódca pochodzi z plemienia z Fezzanu. W przypadku konfliktu pomiędzy władzą centralną a plemieniem możliwe jest, że osoba ta wybierze swoje plemię, a nie naród."
 LBA_unit_leader_trait_tuareg: "Powinowactwo plemienne: Tuaregowie"
 LBA_unit_leader_trait_tuareg_desc: "Ten dowódca pochodzi z jednego z plemion Tuaregów w Libii. W przypadku konfliktu pomiędzy władzą centralną a plemieniem możliwe jest, że osoba ta wybierze swoje plemię, a nie naród."
 LBA_unit_leader_trait_toubou: "Powinowactwo plemienne: Toubou"
 LBA_unit_leader_trait_toubou_desc: "Dowódca ten pochodzi z jednego z plemion Toubou w Libii. W przypadku konfliktu pomiędzy władzą centralną a plemieniem możliwe jest, że osoba ta wybierze swoje plemię, a nie naród."
 LBA_muammar_gaddafi_desc: "Muammar Gaddafi took power in Libya after overthrowing the Libyan monarchy in 1969. He quickly took control of the entire ruling apparatus, and implemented a mix of policies between anti-Western ideals, Islamic socialism and sharia, and Arab nationalism. He eventually concentrated his ideas into the Green Book, which outlined his Third International Theory. While initially a popular leader at home and abroad, Gaddafi became increasingly sidelined from international politics. Constant funding of terrorists, revolutionaries and insurgents has left Gaddafi with very few friends on the international stage. Gaddafi's actions have left the once oil rich nation of Libya suffering under international pressure and sanctions, and is at the risk of becoming an international pariah."
 LBA_abdulrahman_sewehli_desc: "Abdulrahman Sewehli is the grandson of Ramadan Asswehly, the founder of the Tripolitanian Republic. The Tripolitanian Republic was a short-lived country that declared independence from Italian Libya at the end of World War I. It was the first republican form of government in the Arab world."
 LBA_ali_zeidan_desc: "Ali Zeidan był libijskim dyplomatą, który w latach 70. pracował pod przewodnictwem ambasadora w Indiach Mohammeda Magariafa. Obaj mężczyźni uciekli w 1980 roku i utworzyli Narodowy Front Ocalenia Libii. Ali Zeidan aż do powrotu do Libii przebywał na wygnaniu w Genewie jako prawnik zajmujący się prawami człowieka. Niektórzy opisali Zeidana jako zdecydowanego liberała."
 LBA_ali_tarhouni_desc: "Ali Tarhouni fled Libya in 1973 while studying economics. He was stripped of citizenship, sentenced to death and was put on a government hit-list. Tarhouni fled to the United States and finished his studies there. After graduating and getting his PhD, Tarhouni was teaching economics in the University of Washington Michael G. Foster School of Business until the political situation in Libya allowed him to return to the country."
 LBA_fathi_al_baaja_desc: "Fathi Al-Baaja jest politologiem i przed przystąpieniem do polityki wykładał na Uniwersytecie Garyounis w Benghazi."
 LBA_khweldi_hameidi_desc: "Khweldi Hameidi jest jednym z najbliższych sojuszników Muammara Kaddafiego. Brał udział w zamachu stanu w 1969 r., a po czystkach Kaddafiego Hameidi znalazł się w jego kręgu. Przez całą swoją karierę Hameidi był ministrem spraw wewnętrznych, szefem wywiadu wojskowego i szefem sądów wojskowych. Jedna z córek Hameidiego jest żoną Al-Saadiego Kaddafiego. Po odsunięciu Kaddafiego od władzy Hameidi wraz z innymi lojalistami Kaddafiego utworzył Libijski Ruch Ludowy."
 LBA_muhammad_muammar_gaddafi_desc: "Muhammad Kaddafi jest najstarszym synem Muammara Kaddafiego. Pomimo swojej pozycji w rodzinie, Muhammad nigdy nie był zainteresowany rządzeniem krajem."
 LBA_saif_al_islam_gaddafi_desc: "Saif al-Islam is the second son of Muammar Gaddafi. He has a degree in engineering (or architecture, depending on the source). Saif al-Islam has actively taken part in Libyan politics, and he has even spoken publicly against his father and how Libya needs reform. Reportedly, he was offered the role of Prime Minister and the position of the successor to Muammar Gaddafi, both of which he denied, stating that Libya 'is not a farm to inherit'."
 LBA_al_saadi_gaddafi_desc: "Al-Saadi Kaddafi jest trzecim synem Muammara Kaddafiego. Najbardziej znany jest ze swojej kariery w libijskiej piłce nożnej, choć jego wyczyny nie są niczym spektakularnym. Wiele jego meczów zostało rozstrzygniętych na jego korzyść, a spikerom na meczach nie wolno było ogłaszać nikogo innego poza nim po imieniu, inni byli ogłaszani jedynie na podstawie numeru koszulki. Generalnie Al-Saadi jest postrzegany jako czarna owca w rodzinie i krążą pogłoski, że został zmuszony do poślubienia córki dowódcy wojskowego, aby uciszyć rozmowy na temat jego możliwej biseksualności."
 LBA_mutassim_gaddafi_desc: "Mutassim Kaddafi jest czwartym synem Muammara Kaddafiego. Chociaż jego doświadczenie opierało się wyłącznie na armii libijskiej, nadal pozwolono mu być częścią wewnętrznego kręgu Muammara Kaddafiego."
 LBA_hannibal_gaddafi_desc: "Hannibal Gaddafi is the 5th son of Muammar Gaddafi. He has a bachelor's degree in maritime navigation and he has served on multiple GNMTC vessels. Both Hannibal and his wife have a history of violence, especially towards their servants."
 LBA_ayesha_gaddafi_desc: "Ayesha Gaddafi is the only daughter of Muammar Gaddafi. She studied law in Paris Diderot University and she also served in the Libyan Military, reaching the rank of lieutenant colonel. She has actively taken part in trying to improve Libya's diplomatic standing with other countries."
 LBA_saif_al_arab_gaddafi_desc: "Saif al-Arab Gaddafi is the 6th son of Muammar Gaddafi. Not much is known of him, except that he was wounded in a US airstrike in 1986 when he was four. So far, he has kept a very low-profile."
 LBA_khamis_gaddafi_desc: "Khamis Gaddafi is the 7th and youngest son of Muammar Gaddafi. Gaddafi has received a military education both in the military academy in Tripoli as well as the Frunze Military Academy in Russia. Khamis is generally more interested in military matters than politics, and he has a very warm relationship with his father as well as his siblings."
 LBA_ali_al_sallabi_desc: "Ali al-Sallabi jest historykiem i religioznawcą. Za rządów Kaddafiego spędził osiem lat w więzieniu Abu Salim, po czym studiował teologię w Arabii Saudyjskiej i Sudanie. Będąc członkiem Bractwa Muzułmańskiego i osobą mającą bliskie powiązania z Katarem, al-Sallabi był jednym z głównych mediatorów w negocjacjach między Kaddafim a LIFG. Wielu jego zwolenników politycznych było członkami Al-Kaidy i LIFG, więc nie jest jasne, czy jego prawdziwa lojalność opiera się na Bractwie, czy na bardziej ekstremistycznej formie islamu."
 LBA_abdelhakim_belhaj_desc: "Abdelhakim Belhaj założył w latach 80. Libijską Islamską Grupę Walczącą, której celem było pozbycie się Muammara Kaddafiego. Zanim jednak mogła cokolwiek zrobić, LIFG została już wypędzona z kraju. Belhaj i jego rodacy przedostali się do Afganistanu, gdzie wraz z mudżahedinami walczyli przeciwko Związkowi Radzieckiemu. Po zakończeniu wojny Belhaj wrócił do Libii w 1992 r., aby kontynuować opór przeciwko Kaddafiemu."
 LBA_emad_al_banani_desc: "Emad Al-Banani jest współzałożycielem oddziału Bractwa Muzułmańskiego w Benghazi. Pracował jako inżynier lotnictwa aż do przeprowadzki do Zurychu w 1995 roku. Podczas pobytu na wygnaniu al-Banani był jednym z bardziej aktywnych członków Bractwa i od dawna planował powrót Bractwa do Libii. Al-Banani chce zastąpić libijskie wojsko gwardią narodową, a także postrzega Turcję i Malezję jako inspirujące modele dla krajów muzułmańskich."
 LBA_mahmoud_jibril_desc: "Mahmoud Jibril graduated from Economics and Political Science from Cairo University in 1975. He has written multiple books on strategic planning and decision making. In the 80s a team led by him published the Unified Arab Training Manual, and he has organised multiple administration and management trainings all across the Middle East. Before the fall of Gaddafi, Jibril worked under him as the head of the National Planning Council of Libya and of the National Economic Development Board of Libya. He is a close friend of Saif al-Islam Gaddafi and he promotes privatization and liberalization policies."
 LBA_mohammed_magariaf_desc: "Kariera Mohammeda Magariafa w Libii rozpoczęła się jako szef komisji audytorów libijskiego sądu skarbowego. Jednak ze względu na zdecydowane stanowisko antykorupcyjne został szybko przeniesiony do innych obowiązków. Nadal pełnił funkcję libijskiego dyplomaty w Indiach, aż do ucieczki do Maroka w 1980 r. w obawie, że rząd go usunie. Na wygnaniu Magariaf założył Narodowy Front Zbawienia, grupę oporu skierowaną przeciwko Kaddafiemu. Przewodził nawet grupie komandosów w Libii próbującej zamordować Kaddafiego. Magariaf większość swojego wygnania spędził w Stanach Zjednoczonych i tam przeżył trzy próby zamachu. Powrót do kraju mógł nastąpić dopiero po upadku Kaddafiego. Jest zdecydowanym zwolennikiem zasad demokracji w kraju."
 LBA_mustafa_a_g_abushagur_desc: "Mustafa Abushagur opuścił Libię w latach 70. XX wieku, aby studiować elektrotechnikę w Stanach Zjednoczonych. Stopień doktora uzyskał w 1984 r., po czym pracował jako profesor na Uniwersytecie Alabama w Huntsville. Podczas pobytu w USA Abushagur otrzymał wiele nagród badawczych od NASA, NSF, Departamentu Obrony i FAA. Głównym obszarem zainteresowań Abushagura jest optoelektronika i opublikował kilka książek na ten temat. Mieszkając na wygnaniu w USA, aktywnie współpracował także z innymi wygnańcami, organizując ruchy przeciw Kaddafiemu."
 LBA_ahmed_shebani_desc: "Ahmed Shebani is the founder of the Democratic Party of Libya. He believes the US (and other Western powers) should adopt a Marshall Plan -style aid program to Libya to stabilise it. He also wants to repair relations with Israel and bring back Jews that were expelled from the country."
 LBA_ignore_lifg: "Ignoruj ​​​​LIFG"
 LBA_ignore_lifg_desc: "Zaledwie kilka lat temu Libijska Islamska Grupa Bojowa próbowała zamordować Kaddafiego. Nasza armia szybko wytropiła większość ich sił i nie stanowią już zagrożenia. Powinniśmy wezwać nasze wojska i skupić się na odbudowie naszego narodu."
 LBA_crush_lifg: "Zmiażdżyć LIFG"
 LBA_crush_lifg_desc: "Zaledwie kilka lat temu Libijska Islamska Grupa Bojowa próbowała zamordować Kaddafiego. Nasza armia szybko wytropiła większość ich sił i nie stanowią już zagrożenia. Powinniśmy przeszukać i zniszczyć wszelkie pozostałe kryjówki oraz aresztować sympatyków. Nie możemy pozwolić, aby ta obrzydliwa ideologia wypłynęła na światło dzienne w Libii."
 LBA_islam_over_nation: "Islam ponad narodem"
 LBA_islam_over_nation_desc: "When Gaddafi took power, he wanted to model Libya's judicial landscape after Sharia. He quickly backtracked however, bringing more nationalist elements into his ruling. There has been a balance between the two ever since. However, it is clear that for any Muslim and Arab nation, Islam should be the guiding principle."
 LBA_nation_over_islam: "Naród nad islamem"
 LBA_nation_over_islam_desc: "Kiedy Kaddafi objął władzę, chciał ukształtować krajobraz sądowniczy Libii na wzór szariatu. Szybko się jednak wycofał, wprowadzając do swoich rządów więcej elementów nacjonalistycznych. Od tego czasu istnieje równowaga między nimi. Naśladowanie islamu jest przestarzałe i plemienne. Powinniśmy bardziej skupić się na budowaniu narodu libijskiego i tożsamości libijskiej."
 LBA_family_is_a_central_unit: "Rodzina ponad wszystko"
 LBA_family_is_a_central_unit_desc: "Trzon społeczeństwa stanowi rodzina. Mężczyzna i kobieta z dziećmi. To jest cel wszystkich Libijczyków. Szczęśliwe, rosnące rodziny zapewnią dobrobyt i sukces na nadchodzące lata."
 LBA_nation_is_a_central_unit: "Nation Above All Else"
 LBA_nation_is_a_central_unit_desc: "Trzon społeczeństwa stanowi człowiek, który kocha swój kraj. Musimy zachęcać ludzi, aby byli bardziej patriotyczni i porzucili swoją plemienną przeszłość."
 LBA_follow_religious_law: "Przestrzegaj prawa religijnego"
 LBA_follow_religious_law_desc: "Prawo islamskie jest najlepszą podstawą rządzenia krajem. Dzięki temu Libia będzie sprawiedliwa dla wszystkich."
 LBA_draft_real_constitution: "Projekt prawdziwej konstytucji"
 LBA_draft_real_constitution_desc: "Libia nie ma oficjalnej konstytucji. To skandal, że nowoczesny naród go nie ma. Musimy stworzyć odpowiedni, który wyraźnie pokaże światu i naszym ludziom, na czym stoimy."
 LBA_traditional_role_for_women: "Tradycyjna rola kobiet"
 LBA_traditional_role_for_women_desc: "Kobiety powinny być opiekunkami rodziny. Mają najwyższy możliwy zaszczyt wychowując dzieci i służąc rodzinie, podczas gdy mężczyźni muszą pracować niewolniczo."
 LBA_liberate_women: "Wyzwolić Kobiety"
 LBA_liberate_women_desc: "Kobiety zasługują na takie same prawa i obowiązki jak mężczyźni. Pracują i służą narodowi tak samo jak mężczyźni."
 LBA_religious_education: "Edukacja religijna"
 LBA_religious_education_desc: "Nasze szkoły powinny ściśle uwzględniać religię w swoim programie nauczania. Ludzie muszą uczyć się Koranu i praktyk islamskich już od dzieciństwa."
 LBA_national_education: "Edukacja nacjonalistyczna"
 LBA_national_education_desc: "Our schools should incorporate nationalism and civic studies closely into their curriculum. Patriotism and great deeds of Libyans must be taught to all citizens."
 LBA_appoint_grand_mufti: "Wyznacz Wielkiego Muftiego"
 LBA_appoint_grand_mufti_desc: "Libia nie ma wielkiego muftiego, który mógłby interpretować prawo islamskie. To haniebne dla tak pobożnego narodu islamskiego jak my. Powinniśmy mianować Sadiqa al-Gharianiego na wielkiego muftiego."
 LBA_appoint_baathist_advisor: "Wyznacz doradcę partii Baas"
 LBA_appoint_baathist_advisor_desc: "Chociaż partia rządząca Kaddafiego jest podobna do Baas, istnieją pewne różnice. Musimy zatrudnić doradcę, który jest ekspertem w dziedzinie Baas, aby pomóc naszemu rządowi w osiągnięciu jego nacjonalistycznych ideałów."
 LBA_peace_with_lifg: "Pokój z LIFG"
 LBA_peace_with_lifg_desc: "Konflikt z Libijską Islamską Grupą Walczącą zagroził stabilności całego narodu. Powinniśmy pozwolić im żyć z nami w pokoju."
 LBA_assassinate_gaddafi: "Zabójstwo [ROOT.GetLeader]"
 LBA_assassinate_gaddafi_desc: "Ludzie mają dość [ROOT.GetLeader]. Islamscy wojownicy Libii muszą powstać i bronić tradycyjnych libijskich wartości, zanim będzie za późno."
 LBA_mujahideen_of_libya: "Mudżahedini z Libii"
 LBA_mujahideen_of_libya_desc: "Wielu członków LIFG to weterani mudżahedinów z czasów inwazji Związku Radzieckiego na Afganistan. Ich wiedza będzie bardzo przydatna."
 LBA_old_taliban_friends: "Starzy przyjaciele talibów"
 LBA_old_taliban_friends_desc: "Mamy wiele kontaktów w talibach. Powinniśmy korzystać z tych połączeń."
 LBA_mujahideen_legion: "Legion Mudżahedinów"
 LBA_mujahideen_legion_desc: "Jako weterani Afganistanu wiemy, jak walczyć z niewiernymi. Naszym obowiązkiem jest zapewnienie ochrony muzułmanom na całym świecie."
 LBA_call_back_veterans: "Oddzwoń do weteranów"
 LBA_call_back_veterans_desc: "Many veterans and senior leaders of LIFG are living in exile. Now that we are in power and established, they can start returning home"
 LBA_unity_in_islam: "Jedność w islamie"
 LBA_unity_in_islam_desc: "Islam jest potężnym narzędziem, które przekracza granice plemienne. Dzięki niemu wszyscy Libijczycy poczują się razem."
 LBA_work_together_with_brotherhood: "Współpracuj z Bractwem Muzułmańskim"
 LBA_work_together_with_brotherhood_desc: "Bractwo Muzułmańskie zostało zdelegalizowane pod rządami Kaddafiego, ale wiele osób nadal było członkami tej organizacji. Jako jedna z największych islamskich sił politycznych w kraju, sojusz z nimi ma sens."
 LBA_work_together_with_brotherhood_tt: "[Neutral_Muslim_Brotherhood_L] będzie znane jako §Y£LBA_Neutral_Muslim_Brotherhood Partia Sprawiedliwości i Budownictwa§!"
 LBA_hardline_sharia_law: "Twarde prawo szariatu"
 LBA_hardline_sharia_law_desc: "Prawo szariatu powinno być naczelną zasadą naszego narodu. Na tym powinny opierać się wszystkie prawa i całe społeczeństwo powinno funkcjonować tak, jak się mówi."
 LBA_hardline_sharia_law_tt_alcohol: "Zakażemy alkoholu\n"
 LBA_hardline_sharia_law_tt_dress_code: "Wprowadzimy ponownie zasady ubioru\n"
 LBA_hardline_sharia_law_tt_banned_head_scarf: "Odblokujemy chustę\n"
 LBA_hardline_sharia_law_tt_same_sex_decriminalized: "Będziemy kryminalizować stosunki osób tej samej płci\n"
 LBA_de_westernisation: "Dewesternizacja"
 LBA_de_westernisation_desc: "Dekadencki Zachód ma zbyt duże wpływy w naszym kraju. Musimy zniszczyć zachodnie tradycje w tym kraju."
 LBA_grand_mufti_rule: "Reguła Wielkiego Muftiego"
 LBA_grand_mufti_rule_desc: "Wielki Mufti stał się ważnym symbolem dla naszego narodu. Lepiej będzie, jeśli zostanie mu przyznana większa władza polityczna, która umożliwi mu poprowadzenie Libii ku oświeceniu."
 LBA_denounce_green_book: "Potępiajcie Zieloną Księgę"
 LBA_denounce_green_book_desc: "Zielona Księga Kaddafiego mieszała nacjonalizm z islamem i posłużyła jako podstawa jego rządów. Jedyną księgą, której ludzie powinni przestrzegać, jest Koran i nic więcej."
 LBA_tanasoh_tv: "Telewizja Tanasuh"
 LBA_tanasoh_tv_desc: "Powinniśmy stworzyć ogólnokrajową sieć telewizyjną, która transmitowałaby przesłanie Wielkiego Muftiego do wszystkich Libijczyków."
 LBA_supreme_revolutionaries_council: "Najwyższa Rada Rewolucjonistów"
 LBA_supreme_revolutionaries_council_desc: "Aby chronić nowe państwo, musimy powołać Najwyższą Radę Rewolucjonistów. Organ doradczy Wielkiego Muftiego mający pomóc w rządzeniu krajem"
 LBA_anti_saudi_coalition: "Koalicja Antysaudyjska"
 LBA_anti_saudi_coalition_desc: "The Saudis and other Gulf monarchies accuse the Grand Mufti of participating in Qatari supported terrorism. This is a ridiculous claim and we must work together with Qatar to fight this slander."
 LBA_join_sahel_war: "Wesprzyj powstanie Maghrebu"
 LBA_join_sahel_war_desc: "Na Saharze istnieje kilka islamistycznych grup powstańczych walczących o wyzwolenie muzułmanów. Musimy dostosować się do tych grup."
 LBA_join_sahel_war_threat: "[LBA.GetAdjective] Wspiera powstanie w Maghrebie"
 LBA_islamic_state_of_sahel: "Państwo Islamskie Maghrebu"
 LBA_islamic_state_of_sahel_desc: "Musimy ogłosić się jedynym władcą Sahary. Odtąd Libia będzie znana jako Państwo Islamskie Maghrebu."
 LBA_islamic_state_of_sahel_tt: "Będziemy mogli zwrócić §YRoszczenie§! państw w Sahara na §YRdzenie§!"
 LBA_our_brothers_in_chad: "Nasi bracia w Czadzie"
 LBA_our_brothers_in_chad_desc: "Powstańcy w północnym Czadzie mogliby być idealnymi sojusznikami w przejęciu władzy nad krajem w przyszłości."
 LBA_our_brothers_in_chad_tt: "Oddział mudżahedinów założył bazę w §Y$VICTORY_POINTS_1057$, $STATE_1100$§!"
 LBA_topple_chad: "Obalić Czad"
 LBA_topple_chad_desc: "Czad jest jednym z naszych słabszych sąsiadów. Z pomocą lokalnych powstańców, pokonanie Czadu powinno być łatwe."
 LBA_our_brothers_in_niger: "Nasi Bracia w Nigrze"
 LBA_our_brothers_in_niger_desc: "Północny Niger jest punktem zapalnym działań bojowników. Musimy pozwolić tym powstańcom przekroczyć granicę i założyć bezpieczny obóz po naszej stronie."
 LBA_our_brothers_in_niger_tt: "Oddział mudżahedinów założył bazę w §Y$VICTORY_POINTS_3257$, $STATE_920$§!"
 LBA_topple_niger: "Podbić Niger"
 LBA_topple_niger_desc: "Przejmując Niger, zabezpieczymy naszą południową granicę. Południowy kraniec Sahary będzie również doskonałą trampoliną do ataku na Nigerię."
 LBA_ally_with_boko_haram: "Sojusznik Boko Haram"
 LBA_ally_with_boko_haram_desc: "Nigeryjska islamistyczna grupa Boko Haram walczy z nigeryjskim rządem od lat. Powinniśmy się z nimi sprzymierzyć, aby uzyskać ich wsparcie w niszczeniu Nigerii. Nie ma jednak gwarancji, że będą wobec nas przyjaźnie nastawieni w dłuższej perspektywie."
 LBA_ally_with_boko_haram_tt: "Kiedy zakończymy §Y$LBA_invade_nigeria$§!, Boko Haram zbuntuje się przeciwko [NIG.GetNameDef] i dołączy do naszej strony"
 LBA_invade_nigeria: "Najechać Nigerię"
 LBA_invade_nigeria_desc: "Północna Nigeria jest w przeważającej mierze muzułmańska. Musimy wyzwolić naszych braci spod ucisku chrześcijańskiego południa."
 LBA_our_brothers_in_algeria: "Nasi Bracia W Algierii"
 LBA_our_brothers_in_algeria_desc: "Algieria jest kolebką powstania w Maghrebie. Od czasu porażki islamistów w algierskiej wojnie domowej, algierska część Sahary pozostaje ogniskiem działalności powstańczej. Chociaż większość bojowników została już wypędzona przez armię algierską, niektórzy wciąż tam pozostają. Powinniśmy się z nimi skontaktować."
 LBA_our_brothers_in_algeria_tt: "Jednostka Mudżahedinów założyła swoją bazę pod adresem §Y$VICTORY_POINTS_4051$, $STATE_393$§!"
 LBA_topple_algeria: "Podbić Algierię"
 LBA_topple_algeria_desc: "Islamistom nie udało się obalić dekadenckiego rządu Algierii podczas wojny domowej. My jednak nie zawiedziemy."
 LBA_infiltrate_mali: "Zinfiltrować Mali"
 LBA_infiltrate_mali_desc: "Azawad, północny region Mali, jest siedliskiem działalności powstańczej. Mali jest słabe i już pogrążone w chaosie, a teraz nadszedł czas na uderzenie."
 LBA_our_brothers_in_mali_east_tt: "Jednostka Mudżahedinów założyła swoją bazę w §Y$VICTORY_POINTS_7939$, $STATE_330$§!"
 LBA_our_brothers_in_mali_north_tt: "Jednostka Mudżahedinów założyła swoją bazę pod adresem §Y$VICTORY_POINTS_5095$, $STATE_381$§!"
 LBA_expand_to_mauritania: "Rozszerz do Mauretanii"
 LBA_expand_to_mauritania_desc: "W Mauretanii rebelianci wykazywali się jedynie ograniczoną aktywnością. Nadszedł czas, aby przyspieszyć te operacje i zakończyć jednoczenie Sahelu."
 LBA_destroy_last_crusaders: "Zniszcz Ostatnich Krzyżowców"
 LBA_destroy_last_crusaders_desc: "Malta jest ojczyzną Rycerzy Szpitalników. To oburzenie, że potomkom krzyżowców, którzy dokonali masakry muzułmanów, pozwolono mieszkać tuż obok naszych drzwi. Ten ostatni bastion niewiernych musi zostać zniszczony."
 LBA_malta_repopulation_campaign: "Kampania na rzecz ponownego zaludnienia Malty"
 LBA_malta_repopulation_campaign_desc: "Powinniśmy stworzyć kampanię zachęcającą naszych obywateli do migracji na Maltę, aby zmienić sytuację demograficzną na naszą korzyść."
 LBA_malta_province: "Prowincja Malta"
 LBA_malta_province_desc: "Malta ma obecnie znaczną populację muzułmańską. Powinniśmy formalnie zintegrować Maltę, aby stała się integralną częścią [LBA.GetNameDef]."
 LBA_baathism_tunisia: "Baasizm w Tunezji"
 LBA_baathism_tunisia_desc: "Tunisia has had an active Ba'athist movement since the 1950s. However, it has been banned under the rule of Zine El Abidine Ben Ali. We should create contacts with the underground movement, as they have ties to Ba'athist groups."
 LBA_baathism_algeria: "Baasizm w Algierii"
 LBA_baathism_algeria_desc: "Partia Baas w Algierii otrzymała zakaz działalności i podlega represjom. Z tego powodu obecny lider partii przebywa na wygnaniu w Iraku. Z algierskimi baasistami będziemy mieć kontakty zarówno w Algierii, jak i w Iraku."
 LBA_baathism_mauritania: "Baasizm w Mauretanii"
 LBA_baathism_mauritania_desc: "W Mauretanii Partia Baas jest największą arabską siłą nacjonalistyczną w kraju. Partia kilkakrotnie infiltrowała mauretańską armię, a jej przywódcy pełnili nawet funkcję ministra. Jednak gdy Mauretania znormalizowała stosunki z Izraelem w 1999 r., partia została zdelegalizowana."
 LBA_baathism_egypt: "Baasizm w Egipcie"
 LBA_baathism_egypt_desc: "Partia Baas w Egipcie została zdelegalizowana w 1990 r., a zaledwie rok później w kraju aresztowano dwóch urzędników irackiego wywiadu, posiadających duże ilości gotówki przeznaczonej na destabilizację Egiptu. Kontaktując się z naszymi braćmi Baas w Egipcie, uzyskamy dostęp do ich międzynarodowej sieci funduszy."
 LBA_baathism_levant: "Baasizm w Lewancie"
 LBA_baathism_levant_desc: "Out of all the non-Ba'athist Arab countries, the movement is doing the best in Jordan. The party is not outlawed, a third of Jordanians are aware of the Ba'athist Party's existence and they have even had members in the parliament. The Jordanian Ba'ath Party has an extensive program of sending Jordanians to study in Iraqi universities, and this network will benefit us too. In Palestine, our Ba'athist brothers help the PLO in their fight against the Zionist invaders."
 LBA_baathism_iraq_kuwait: "Baasizm w Iraku"
 LBA_baathism_iraq_kuwait_desc: "Być może ze wszystkich krajów, w Iraku Baas rozkwitł najbardziej. Choć ostatnio Saddam Husajn próbował zbudować iracką tożsamość w oparciu o tożsamość neomezopotamską, myśląc o sobie jako o nowym Hammurabim. Musimy skierować ich z powrotem w stronę arabskiego nacjonalizmu, zanim będzie za późno."
 LBA_baathism_bahrain: "Baasizm w Bahrajnie"
 LBA_baathism_bahrain_desc: "W Bahrajnie ideałom partii Baas stoi antymonarchistyczne Zgromadzenie Nacjonalistyczno-Demokratyczne. Jednym z ich głównych celów jest powstrzymanie polityki imigracyjnej rządu, która sprawia, że ​​Bahrajńczycy nieuczciwie konkurują z tanią zagraniczną siłą roboczą. Bahrajn jest doskonałym przykładem, dlaczego musimy priorytetowo traktować populację arabską przed obcokrajowcami."
 LBA_baathism_lebanon: "Baasizm w Libanie"
 LBA_baathism_lebanon_desc: "Baasizm ma w Libanie długą historię. Obecnie istnieje duża konkurencja między frakcjami iracką i syryjską w gronie zwolenników partii Baas. Powinniśmy spróbować załatać te różnice."
 LBA_baathism_sudan: "Baasizm w Sudanie"
 LBA_baathism_sudan_desc: "Chociaż Baas jest w Sudanie stosunkowo niewielki, obecni członkowie tego ruchu nadal mają znaczny wpływ ze względu na duże fundusze irackie. Gdy Sudan będzie bliżej nas, łatwiej będzie nam kontrolować te pieniądze z Iraku."
 LBA_baathism_yemen: "Baasizm w Jemenie"
 LBA_baathism_yemen_desc: "W Jemenie zdominowana przez Irak Partia Baas jest ściśle powiązana z rządzącym Generalnym Kongresem Ludowym. Będąc w dobrym kontakcie z baasistami w Jemenie, będziemy mieli doskonały dostęp do jemeńskiego rządu."
 LBA_revise_green_book: "Powtórz zieloną księgę"
 LBA_revise_green_book_desc: "In 1975 Muammar Gaddafi released his Green Book that detailed his political ideology. It rejects representative democracy in favour of direct democracy, and rejects both capitalism and communism. Essentially, it lays down the foundation for the Third International Theory. However, many elements of the Libyan society today don't follow the Green Book. Maybe it is time to bring the book to the current millennium and chart the future path for Libyans."
 LBA_revise_green_book_tt: "\n[LBA.GetLeader] zrewiduje Zieloną Księgę. Z każdym przepisanym rozdziałem nasz kraj przybliża się lub oddala od §YReform§!. Kwota §YReform§! zadecyduje o przyszłości Libii.\n\nJeśli §YReforma§! > 3, będziemy §Y$LBA_empower_peoples_congresses$§!\n\nJeśli §YReform§! < -3, będziemy §Y$LBA_empower_revolutionary_committees$§!\n\nW przeciwnym razie będziemy §Y$LBA_retain_political_balance$§!\n\n"
 LBA_green_book_part_1_1: "1:1 – Instrument rządowy"
 LBA_green_book_part_1_1_desc: "Najważniejszym pytaniem politycznym jest: „Jaka forma rządu powinna zostać ustanowiona?” Taki rząd powinien być demokracją bezpośrednią, ale zazwyczaj dochodzi do powstania demokracji przedstawicielskich, które uzurpują sobie wolę dużych populacji, które nie głosowały na istniejące rządy, stosując systemy wyborcze oparte na zasadzie „pierwszy ostatni”."
 LBA_green_book_part_1_3: "1:3 - Partia"
 LBA_green_book_part_1_3_desc: "Partie polityczne także uzurpują sobie władzę ludu i skupiają się na utrzymaniu władzy, zamiast na poprawie społeczeństwa dla wszystkich, co powinno być głównym celem rządu. Co gorsza, partie polityczne są podatne na korupcję."
 LBA_green_book_part_1_8: "1:8 – Kto nadzoruje postępowanie społeczeństwa?"
 LBA_green_book_part_1_8_desc: "Tak jak nie należy delegować władzy politycznej przedstawicielom, tak też władzy policyjnej nie należy delegować całemu społeczeństwu. Ponownie rozwiązaniem jest struktura konferencji i komitetów. Całość jest władzą ustawodawczą dla Całości, a Całość jest organem wykonawczym dla Całości."
 LBA_green_book_part_1_10: "1:10 – Prasa"
 LBA_green_book_part_1_10_desc: "Chociaż osoby fizyczne i firmy mają prawo do wypowiadania się w charakterze prywatnym, „prasa” jako środek wyrazu dla społeczeństwa musi być wydawana przez Konferencje i Komitety. W przeciwnym razie jednostki ponownie uzurpowałyby sobie władzę w sferze idei."
 LBA_green_book_part_2_13: "2:13 - Mieszkanie"
 LBA_green_book_part_2_13_desc: "Na przykład wynajem mieszkania jest wyzyskiem i narusza wolność najemcy. Idealnie byłoby, gdyby każdy miał tylko jeden dom, bo jeśli dana strona ma więcej niż jedną nieruchomość, będzie skłonna ją wynająć, wyzyskując w ten sposób swoich najemców."
 LBA_green_book_part_2_14: "2:14 – Dochód"
 LBA_green_book_part_2_14_desc: "Dochód indywidualny jest niezbędny dla gospodarki. Ponownie, taki dochód nie powinien być realizowany jako wynagrodzenie płacone przez właściciela, ale jako wynik partnerstwa w branży."
 LBA_green_book_part_2_16: "2:16 – Ląd"
 LBA_green_book_part_2_16_desc: "Ziemia, podobnie jak wszystkie wymienione kategorie, powinna być jednakowo dostępna dla wszystkich. Ogólnie rzecz biorąc, gospodarka jest grą o sumie zerowej i dlatego elementy gospodarki powinny być równo rozdzielone między wszystkich, aby zapewnić równość wyników. Nikt nie ma prawa oszczędzać dla siebie ponad własne potrzeby, chyba że do własnego arytmetycznego udziału danego dobra w całej populacji."
 LBA_green_book_part_3_21: "3:21 – Zasługi plemienia"
 LBA_green_book_part_3_21_desc: "Tribes are rooted in blood, provide social cohesion, are able to internally monitor themselves due to their numbers. They also ensure the socialization of their individuals, an education more useful than a school education."
 LBA_green_book_part_3_24: "3:24 – Mniejszości"
 LBA_green_book_part_3_24_desc: "Mniejszości są dwojakiego rodzaju: te, które już posiadają naród, i te, które nie mają żadnego narodu, tworzące własny. Tak czy inaczej, ich prawa muszą być chronione."
 LBA_green_book_part_3_25: "3:25 – Czarni będą panować na świecie"
 LBA_green_book_part_3_25_desc: "Czarni są gotowi zdominować populację ludzką, ponieważ ich kultura obejmuje poligamię i unika kontroli urodzeń, a także ponieważ żyją w klimacie, w którym jest „ciągle gorąco”, w związku z czym praca jest dla nich mniej ważna niż w innych kulturach."
 LBA_green_book_part_3_28: "3:28 – Sport, jazda konna i scena"
 LBA_green_book_part_3_28_desc: "Widzowie w sporcie, teatrze i innych rozrywkach są głupi. Ludzie powinni bezpośrednio angażować się w sport, czerpiąc korzyści z lekkoatletyki dla siebie, zamiast stać z boku i przyglądać się występom innych."
 LBA_release_new_green_book: "Wydanie Nowej Zielonej Księgi"
 LBA_release_new_green_book_desc: "To jest skończone! Po miesiącach ciężkiej pracy Zielona Księga doczekała się nowego wydania. Uczniowie w całym kraju są zachwyceni, ponieważ mają teraz do nauczenia się jeszcze jedną książkę!"
 LBA_empower_peoples_congresses: "Wzmocnij kongresy ludowe"
 LBA_empower_peoples_congresses_desc: "What started out as a way to bring direct democracy to people has developed into a farce of neighbours spying on each other to guard the state against revolutionary activity. The Revolutionary Committees that spy on the people need to be abolished and the power needs to be returned to the people"
 LBA_retain_political_balance: "Zachowaj równowagę polityczną"
 LBA_retain_political_balance_desc: "System polityczny Libii działa od dziesięcioleci. Kongresy Ludowe i Komitety Rewolucyjne trzymają się nawzajem w ryzach. Po co bujać łódką, skoro wszystko działa?"
 LBA_empower_revolutionary_committees: "Wzmocnij Komitety Rewolucyjne"
 LBA_empower_revolutionary_committees_desc: "Komitety Rewolucyjne już skutecznie kontrolują naród. Nie powinno być zbyt trudno, aby władza Kongresów Ludowych była tylko nominalna, a Komitety Rewolucyjne były prawdziwymi panami narodu."
 LBA_allow_political_parties: "Zezwól na partie polityczne"
 LBA_allow_political_parties_desc: "Political parties have been banned in Libya ever since Gaddafi took power. However, in order for the people to properly represent themselves, they need platforms for that. We should open the political landscape to more actors."
 LBA_allow_political_parties_tt: "Wszystkie partie polityczne zostaną zalegalizowane\n[conservatism_L] będzie znane jako §Y£generic_conservatism_small Union for Homeland§!\n[liberalism_L] będzie znane jako §Y£LBA_liberalism Narodowa Partia Rozwoju i Opieki Społecznej§!\n[Autocracy_L] będzie znana jako §Y£LBA_Autocracy_democracy Arabska Unia Socjalistyczna§!\n[Kingdom_L] będzie znana jako §Y£LBA_Kingdom Homeland Party§!\n[Neutral_Muslim_Brotherhood_L] będzie znana jako §Y£LBA_Neutral_Muslim_Brotherhood Partia Sprawiedliwości i Budownictwa§!\n[Neutral_Autocracy_L] będzie znane jako §Y£LBA_Neutral_Autocracy National Forces Alliance§!\n[Neutral_conservatism_L] będzie znane jako §Y£LBA_Neutral_conservatism_democracy Partia Frontu Narodowego§!\n[Neutral_Libertarian_L] będzie znane jako §Y£LBA_Neutral_Libertarian Partia Demokratyczna §!\n[neutral_Social_L] będzie znany jako §Y£LBA_neutral_Social Ruch Ensaf§!\n"
 LBA_grassroots_democracy: "Demokracja oddolna"
 LBA_grassroots_democracy_desc: "Demokracja i państwo powinny być tworzone przez ludzi i dla ludzi. Demokracja musi być obecna na wszystkich poziomach sprawowania rządów, aby nawet na najniższym szczeblu ludzie mieli możliwość wpływania na sytuację."
 LBA_allow_royal_family_return: "Pozwól na powrót rodziny królewskiej"
 LBA_allow_royal_family_return_desc: "Po zamachu stanu dokonanym przez Kaddafiego w 1969 r. król Idris pozostał na wygnaniu. Reszta jego rodziny nie miała jednak tyle szczęścia. Jego bratanek i spadkobierca Hasan as-Senussi wraz z rodziną został umieszczony w areszcie domowym. Dom spłonął w 1984 roku, a rodzina została przeniesiona do chaty na publicznej plaży. Cztery lata później rodzinie pozwolono przenieść się do Wielkiej Brytanii w celu leczenia Hasana, który zaledwie cztery lata później, w 1992 r., zmarł na udar. Jego syn i obecny książę koronny Mohammed El Senussi nadal mieszka w Londynie. Może czas pozwolić im wrócić?"
 LBA_compensation_to_royals: "Rekompensata dla rodziny królewskiej"
 LBA_compensation_to_royals_desc: "Po tym, co przeszli, powinniśmy wypłacić rodzinie królewskiej rekompensatę pieniężną z budżetu państwa. Tylko niewielka roczna zasiłka, która pozwoli im stanąć na nogi. Po przywróceniu statusu pewnego dnia będą tak sławni jak monarchia brytyjska."
 LBA_hunt_down_royals: "Polowanie na rodzinę królewską"
 LBA_hunt_down_royals_desc: "Kilku członków rodziny Senussich nadal przebywa na wygnaniu za granicą. Dopóki oni żyją, nasz reżim nie będzie bezpieczny. Musimy zabić pozostałą linię rodu Senussich."
 LBA_hunt_down_royals_tt: "\nSpróbujemy zamordować §YKsięcia koronnego Mohammeda§!, jego kuzyna §YAhmeda§! i pretendent do tronu §YIdris z synem Khaledem§!. Prawdopodobieństwo naszego §Gsukcesu§! i §Rodkrycie§! zależy od naszego §YBezpieczeństwa Wewnętrznego§! wydatki\n"
 LBA_royal_wealth: "Skonfiskować majątek królewski"
 LBA_royal_wealth_desc: "The Royals have a lot of money currently. We need to seize, confiscate and steal their assets in the name of Libyan welfare."
 LBA_peoples_intelligence_agency: "Agencja Wywiadu Ludowego"
 LBA_peoples_intelligence_agency_desc: "Teraz, gdy Komitety Rewolucyjne przejęły kontrolę nad krajem, mogą naprawdę służyć ludziom, zapobiegając zakorzenieniu się w kraju jakichkolwiek wrogich myśli."
 LBA_trust_revolutionary_guard: "Zaufaj Gwardii Rewolucyjnej"
 LBA_trust_revolutionary_guard_desc: "Gwardia Rewolucyjna strzeże reżimu od dziesięcioleci. Musimy przenieść jeszcze większą odpowiedzialność na ich stronę. Regularnej armii nie można ufać."
 LBA_trust_army: "Zaufaj armii"
 LBA_trust_army_desc: "Zbyt dużą część bezpieczeństwa państwa przekazaliśmy Gwardii Rewolucyjnej. Musimy ponownie skupić się na armii."
 LBA_presidential_republic: "Republika Prezydencka"
 LBA_presidential_republic_desc: "Libya has had a strong leader throughout most of its existence. Even when we transition to democracy, we need a strong leader with authority. As Libya transitions, we should follow the French and American models of being ruled by a strong president."
 LBA_federation: "Federacja Libijska"
 LBA_federation_desc: "Libia składa się z Trypolitanii, Cyrenajki i Fezzanu. Same te regiony składają się wówczas z kilku plemion. Dla stabilności narodu najlepiej przekazać część władzy władzom regionalnym."
 LBA_federation_tt: "§YLibijski trybalizm§! mechanik będzie wyłączony"
 LBA_minority_rights: "Prawa mniejszości"
 LBA_minority_rights_desc: "Toubou, Tuaregowie i lokalne plemiona powinny mieć pewną autonomię. To najlepszy sposób zapobiegania uciskowi ze strony państwa centralnego."
 LBA_unitary_state: "Państwo unitarne"
 LBA_unitary_state_desc: "Libia jest podzielona na plemiona i ludy. Najlepszym sposobem na walkę z tymi podziałami jest posiadanie silnego rządu centralnego, który może zapewnić, że kraj nie upadnie."
 LBA_unitary_state_tt: "W zależności od naszego poprzedniego wyboru wydarzy się jedna z poniższych sytuacji:\n\n"
 LBA_minority_protection: "Ochrona Mniejszości"
 LBA_minority_protection_desc: "Musimy przekonać plemiona, że ​​państwo centralne istnieje po to, aby chronić ich prawa, a nie je uciskać."
 LBA_constitutional_monarch: "Monarchia konstytucyjna"
 LBA_constitutional_monarch_desc: "Libya was relatively stable under the monarchy. However, after decades of autocracy, we can't subject the Libyan people to it anymore. We should return the monarchy as a powerful symbol of Libyan unity, but true political power should still rest with the Libyan people."
 LBA_the_real_monarch: "Prawdziwy monarcha"
 LBA_the_real_monarch_desc: "The time has come to return monarchy to Libya. Now we need to crown a true ruler for Libya."
 LBA_the_real_monarch_tt_1: "Jeśli ukończyliśmy fokus §Y$LBA_compensation_to_royals$§!:\n"
 LBA_the_real_monarch_tt_2: "Jeśli ukończyliśmy fokus §Y$LBA_royal_wealth$§! i §Y$LBA_strive_for_african_union$§!:\n"
 LBA_protect_toubou_and_tuaregs: "Chroń Toubousa i Tuaregów"
 LBA_protect_toubou_and_tuaregs_desc: "Sahara i Libia to ojczyzna Tuaregów i Toubou. Jednak wiele krajów, w których przebywają ci ludzie, to kraje niestabilne, autorytarne lub jedno i drugie. Naszym obowiązkiem jest chronić te mniejszości przed ich prześladowcami."
 LBA_protect_toubou_and_tuaregs_tt: "Możemy żądać, aby nasi §Sąsiedzi§! o niskiej stabilności lub autorytarnym rządzie, aby uwolnić jakiegokolwiek §YTuarega§! lub §YTibesti§! rdzenie"
 LBA_protect_toubou_and_tuaregs_threat: "[LBA.GetAdjective] Ma na celu wyzwolenie Tuaregów i Toubou"
 LBA_royal_unity: "Królewska Jedność"
 LBA_royal_unity_desc: "Celem króla jest zjednoczenie ludzi. Pod rządami libijskiego monarchy plemiona będą miały wspólną osobę, na której będą się wzorować."
 LBA_revive_senussi_order: "Wskrześ Zakon Senussiego"
 LBA_revive_senussi_order_desc: "Zakon Senussiego zaczynał jako organizacja religijna, która próbowała wyeliminować niektóre z bardziej „plemiennych” wierzeń włączonych do islamu sufickiego, jednocześnie ograniczając bardziej fundamentalistyczne interpretacje Koranu. Zakon urósł do wielkiej potęgi w Libii, aż w końcu został w zasadzie stłumiony przez Muammara Kaddafiego. Kaddafiego już nie ma i nadszedł czas, aby Zakon Senussi ponownie powstał."
 LBA_approach_nato: "Podejdź do NATO"
 LBA_approach_nato_desc: "Królestwo Libii zostało pierwotnie założone przy pomocy Wielkiej Brytanii i innych mocarstw zachodnich. W pierwszych dniach ściśle współpracowaliśmy z naszymi europejskimi przyjaciółmi, dopóki nie odepchnęli nas arabscy ​​nacjonalistyczni głupcy. Musimy naprawić te relacje i wrócić do naszych pierwotnych przyjaciół."
 LBA_call_back_exiles: "Oddzwoń do wygnańców"
 LBA_call_back_exiles_desc: "Wielu zostało wygnanych z Libii lub samotnie uciekło za panowania Kaddafiego. Sytuacja jest teraz inna i możemy wezwać tych wygnańców z powrotem."
 LBA_approach_arab_league: "Podejdź do Ligi Arabskiej"
 LBA_approach_arab_league_desc: "Z powodu Kaddafiego nie jesteśmy w najlepszych stosunkach z naszymi rodakami arabskimi. Jego polityczne wybuchy pozostawiły zimne stosunki z wieloma naszymi rodakami Arabami. Musimy rozwiązać ten problem."
 LBA_join_war_on_terror: "Dołącz do Wojny z Terrorem"
 LBA_join_war_on_terror_desc: "Islam jest atakowany. Dżihadyści i ekstremiści próbują przejąć kontrolę nad naszą religią, destabilizując dziesiątki krajów i rujnując życie wielu muzułmanów. Naszym obowiązkiem jest chronić naszych muzułmańskich braci przed tymi fanatykami."
 LBA_join_war_on_terror_tt: "Odbyło się przemówienie „Wojna z terroryzmem”."
 LBA_oef_trans_sahara: "Operacja Tarcza Jałowca"
 LBA_oef_trans_sahara_desc: "Sahara to idealna kryjówka dla ekstremistów. Nasz sojusznik, Stany Zjednoczone, zaoferował nam możliwość przyłączenia się do ich operacji antywojskowych w regionie."
 LBA_oef_trans_sahara_tt: "Będziemy mogli interweniować w krajach §YSahelu§! lub §YSahara§! którzy mają wysokie poparcie dla §Ysalafizmu§!"
 LBA_oef_trans_sahara_threat: "Operacja Tarcza Jałowca"
 LBA_fatherly_leader: "Ojcowski Przywódca"
 LBA_fatherly_leader_desc: "The current title for Gaddafi is the 'Brotherly Leader and Guide of the Revolution of the Great Socialist People's Libyan Arab Jamahiriya'. But the truth is, Gaddafi is closer to a father to the nation, rather than a brother."
 LBA_libyan_military: "Libijska armia"
 LBA_libyan_military_desc: "The Libyan military, officially the Armed Forces of the Libyan Arab Jamahiriya, is divided into the army, navy and air force. Out of these, the army is clearly the strongest. The army itself is split into the regular army and the revolutionary guard corps. The reason for this split is that Gaddafi wanted to make sure there was an organisation to keep the regular army loyal."
 LBA_lessons_from_the_past: "Lekcje z przeszłości"
 LBA_lessons_from_the_past_desc: "Throughout our history, we haven't been part of that many wars, and we definitely haven't been on the winning side. We were attacked several times by the US air force, we had a brief disastrous conflict with Egypt and our war with Chad ended up with us losing a sizeable portion of our military despite the initial victories. If we are to succeed in the future, we must look at what we did wrong."
 LBA_el_dorado_canyon: "Operacja Kanion El Dorado"
 LBA_el_dorado_canyon_desc: "In 1986 the United States bombed Libya in response to Libya bombing the West German discotheque 'La Belle' which was popular among American troops. The Americans targeted several military installations, including Gaddafi's command center. The attack destroyed dozens of our aircraft. Our defenses failed completely, as no fighters were launched as counter-action and our anti-air defences didn't start firing until after the American planes were returning. Only 1 F-111 was shot down, and the rest escaped unharmed."
 LBA_better_aa: "Lepsze przeciwlotnicze"
 LBA_better_aa_desc: "Z tego, co wydarzyło się podczas Kanionu El Dorado, jasno wynika, że ​​nasze zdolności przeciwlotnicze są śmieszne. W przyszłości musimy być znacznie lepiej przygotowani na ataki samolotów wroga."
 LBA_better_fighter_response: "Lepsza reakcja myśliwca"
 LBA_better_fighter_response_desc: "Najwyraźniej naszą porażką podczas Kanionu El Dorado była nasza beznadziejnie powolna reakcja myśliwców. Nasi lotnicy muszą być znacznie szybsi od ziemi, aby przechwycić wrogów."
 LBA_gulf_of_sidra: "Zatoka Sidra"
 LBA_gulf_of_sidra_desc: "In 1973, Gaddafi claimed all of Gulf of Sidra as the territorial waters against international maritime law. This was challenged by the United States and eventually led to increased tensions in the Gulf. This ultimately led to several incidents in the region; in 1981 two Libyan SU-22s were shot down, in 1986 one Libyan corvette was sunk and one critically damaged and in 1989 two Libyan MiG-23s were destroyed. In all of these engagements, the Americans suffered no losses. These incidents only showed how hopeless our air force and navy are."
 LBA_toyota_war_guerrilla: "Lekcje wojenne Toyoty – wojna partyzancka"
 LBA_toyota_war_guerrilla_desc: "Konflikt czadyjsko-libijski lat 80. zakończył się tzw. wojną w Toyocie. Siły libijskie od lat okopały się w północnym Czadzie. Gdy Czadyjczycy rozpoczęli kontratak, zrobili to przy użyciu wysoce mobilnych urządzeń technicznych (stąd nazwa wojny). Pozwoliło im to ominąć garnizony libijskie, siejąc spustoszenie na liniach zaopatrzeniowych i samotnych jednostkach. Na tej lekkiej wojnie też powinniśmy się skupić."
 LBA_toyota_war_mobility: "Lekcje wojenne Toyoty - Mobilność"
 LBA_toyota_war_mobility_desc: "Konflikt czadyjsko-libijski lat 80. zakończył się tzw. wojną w Toyocie. Siły libijskie od lat okopały się w północnym Czadzie. Gdy Czadyjczycy rozpoczęli kontratak, zrobili to przy użyciu wysoce mobilnych urządzeń technicznych (stąd nazwa wojny). Pozwoliło im to wymanewrować formacje libijskie, nawet walcząc ramię w ramię z wolniej poruszającymi się czołgami i bez szwanku przekraczając pola minowe. Zdecydowanie takiego stylu wojny potrzebujemy."
 LBA_desert_warfare: "Mistrzowie pustyni"
 LBA_desert_warfare_desc: "Większa część Libii to pustynia. Bez względu na to, z której strony nas zaatakują, najprawdopodobniej będziemy walczyć w upale i piasku. Jest to coś, do czego nasi ludzie są już przyzwyczajeni i nasi wrogowie powinni się nas bać."
 LBA_desert_warfare_tt: "Modyfikuje dowolną §YToyota War§! mamy pomysł\n"
 LBA_egypt_war_behind_the_lines: "Wojna egipsko-libijska – komandosi"
 LBA_egypt_war_behind_the_lines_desc: "W 1977 r. stoczyliśmy krótką czterodniową wojnę z Egiptem, głównie z powodu zepsutych stosunków w związku z podpisaniem przez Egipt porozumienia pokojowego z Izraelem. Podczas wojny libijski batalion czołgów wkroczył do Egiptu, ale został szybko zniszczony w zmechanizowanym kontrataku. W następnych dniach egipscy komandosi przeprowadzili wiele nalotów na libijskie obiekty wojskowe. Te ataki zza linii zniszczyły wiele kluczowych obiektów wojskowych, a zastosowanie tej taktyki przeciwko naszym wrogom byłoby pomocne."
 LBA_egypt_war_behind_the_lines_tt: "Modyfikuje §Y$LBA_desert_warfare_idea$§! pomysł"
 LBA_egypt_war_tank_formations: "Wojna egipsko-libijska – zbroja"
 LBA_egypt_war_tank_formations_desc: "In 1977 we fought a short four-day-war against Egypt, mainly due to soured relations over Egypt signing a peace deal with Israel. During the war, Egyptian commandos raided Libyan military installations. At the same time, a Libyan armoured battalion advanced into Egypt but was quickly destroyed by an Egyptian mechanised counter-attack, which then advanced 25 km into Libya before returning to their original positions. The awe inspiring Egyptian mechanized assault is something we should aim to achieve."
 LBA_activate_arsenal_of_islam: "Aktywuj Arsenał Islamu"
 LBA_activate_arsenal_of_islam_desc: "W latach 70. Kaddafi wpadł w masowy szał zakupów i zbudował ogromny „arsenał islamu”, który miał zostać użyty, gdy zacznie się globalna wojna ze Stanami Zjednoczonymi i Izraelem.  Wojna nigdy nie nadeszła, ale nadal potrzebujemy tego sprzętu. Wszystko w arsenale ma kilkadziesiąt lat, a uruchomienie wszystkiego zajmie czas i pieniądze, ale przynajmniej nasi żołnierze będą mieli o co walczyć."
 LBA_activate_arsenal_of_islam_gaddafi: "The Gaddafi family is in power and we have the national spirit §Y$LBA_revolutionary_guard_corps$§!"
 LBA_activate_arsenal_of_islam_no_gaddafi: "The Gaddafi family is not in power and we have the national spirit §Y$LBA_armed_forces_of_arab_jamahiriya$§!"
 LBA_foreign_procurement_lines: "Linie zakupów zagranicznych"
 LBA_foreign_procurement_lines_desc: "Teraz, gdy nie podlegają nam już sankcje ONZ dotyczące broni, powinniśmy skorzystać z okazji i odbudować nasze zapasy broni."
 LBA_foreign_procurement_lines_tt: "Chociaż §Y$LBA_foreign_procurement_boosted$§! pomysł jest aktywny, zdobycie broni w skupiskach da nam 25% więcej wyposażenia!\n"
 LBA_weapons_from_balkans: "Broń z Bałkanów"
 LBA_weapons_from_balkans_desc: "Wiele krajów na Bałkanach modernizuje swoje armie, aby były bardziej kompatybilne z NATO. Oznacza to, że ich stare zapasy muszą gdzieś trafić. To dla nas świetna okazja, aby zdobyć mnóstwo broni za niewielkie pieniądze!"
 LBA_foreign_procurement_lines_cheap_tt: "Z powodu §Y$LBA_foreign_procurement_boosted$§!:\n"
 LBA_new_tanks: "Nowoczesne czołgi"
 LBA_new_tanks_desc: "The majority of the tanks we use are ancient T-55 and T-62 tanks. While decent considering the regional level, if we ever have to go against any more developed countries, we'll be hopelessly outmatched. We need to get something more modern to our stockpiles."
 LBA_new_trucks: "Napęd Motoryzacyjny"
 LBA_new_trucks_desc: "Nasze zmotoryzowane jednostki jeżdżą ciężarówkami lub technikami Toyoty, przez co nasza armia wygląda jak banda partyzantów. Współczesne armie posiadają pojazdy osobowe przypominające czołgi, które również powinniśmy mieć."
 LBA_new_artillery: "Ulepszone wsparcie ogniowe"
 LBA_new_artillery_desc: "Każda armia będzie potrzebować elementu wsparcia ogniowego, jeśli ma odnieść sukces na polu bitwy. Musimy zmodernizować nasz korpus artylerii."
 LBA_local_supply_system: "Lokalne systemy zaopatrzenia"
 LBA_local_supply_system_desc: "Years of weapon sanctions showed us how easy it is to get cut off from supply lines for new equipment. To remedy this, we should expand our local production so spare parts and replacements are more easily available."
 LBA_expand_airbases: "Rozwiń Bazy lotnicze"
 LBA_expand_airbases_desc: "Wiele baz libijskich sił powietrznych jest w złym stanie. Jeśli mamy rozbudować nasze siły powietrzne, musimy najpierw rozbudować zaplecze do przechowywania naszych samolotów."
 LBA_new_fighters: "Przewaga powietrzna"
 LBA_new_fighters_desc: "Our previous experiences fighting against the American Air Force show the clear lack of proper fighters. With our current planes, we might as well be flying kites against them. We need something much better."
 LBA_new_helicopters: "Wsparcie w walce w zwarciu"
 LBA_new_helicopters_desc: "Observing the African conflicts, we have seen the effectiveness of attack helicopters. Flying low against a hidden enemy with no AA capabilities is their primary strength. Flying jets is pointless, when a more effective way of supporting our troops are helicopters."
 LBA_sabha_launch_site: "Miejsce startu Sabhy"
 LBA_sabha_launch_site_desc: "W latach 80. zachodnioniemiecka firma OTRAG wykorzystywała oazę Sabha jako poligon doświadczalny dla swoich eksperymentalnych rakiet kosmicznych. Pierwotnie testy odbywały się w Shaba w Demokratycznej Republice Konga (wówczas Zairze), a badania przeniesiono do Libii do 1987 r. Miejsce startu Sabha było także odległym miejscem testowym dla radzieckiego programu kosmicznego do 1991 r. Mogliśmy odnowić miejsce startu, aby umożliwić wykorzystywane do naszych własnych celów testowych."
 LBA_review_the_navy: "Recenzja Marynarka Wojenna"
 LBA_review_the_navy_desc: "Nasza flota składa się głównie ze starych, niesprawnych radzieckich okrętów podwodnych i korwet z lat 50. i 60. XX wieku, a także kilku „nowszych” ciężkich korwet klasy Koni. Większość tych statków jest w bardzo złym stanie i tak naprawdę nadają się jedynie do obrony wybrzeża. Marynarka wojenna pilnie potrzebuje modernizacji."
 LBA_expand_tripoli_docks: "Rozwiń doki Trypolisu"
 LBA_expand_tripoli_docks_desc: "W Trypolisie znajduje się obecnie nasz największy dok. Znajdujące się tam obiekty obsługują statki remontowe o nośności do 6000 ton. W celu przyszłej ekspansji na większe statki musimy jeszcze bardziej zwiększyć tę pojemność."
 LBA_expand_benghazi_docks: "Rozwiń doki w Bengazi"
 LBA_expand_benghazi_docks_desc: "Chociaż dok w Benghazi nie jest tak imponujący jak w Trypolisie, nadal jest istotną bazą naszej marynarki wojennej. Obecnie w porcie znajdują się doki pływające. Powinniśmy rozbudować dok do funkcji podobnej do Trypolisu."
 LBA_refurbish_submarines: "Remont łodzi podwodnych"
 LBA_refurbish_submarines_desc: "We have two Foxtrot-class submarines. Six in total were bought from the Soviet Union in 1982, but unfortunately four of them have already reached a status where they are completely irreparable. There are still two sitting at the Benghazi naval base in disrepair. With a small investment, we should be able to make them seaworthy again."
 LBA_new_corvettes: "Nowe Corvette"
 LBA_new_corvettes_desc: "Aby wzmocnić naszą flotę, potrzebujemy nowych korwet. Te z zimnej wojny po prostu się nie nadają."
 LBA_tripoli_drydocks: "Stocznie Trypolisu"
 LBA_tripoli_drydocks_desc: "Ponieważ Trypolis jest naszą największą bazą morską, rozsądna jest rozbudowa tamtejszych stoczni, aby faktycznie można było budować i naprawiać statki."
 LBA_shuffle_officers: "Przetasuj oficerów"
 LBA_shuffle_officers_desc: "One of Gaddafi's tactics to keep the military in check is by rotating officers frequently. Officers are often changed from one unit to another, and new ones are promoted to take their place. This means there is always plenty of young officers grateful for their promotion, and the dissident officers can be sent to far-away unimportant postings."
 LBA_expand_rgc: "Rozwiń RGC"
 LBA_expand_rgc_desc: "Korpus Strażników Rewolucji jest elitarną strażą reżimu. Nie możemy ufać lojalności regularnej armii. Musimy powiększyć Gwardię Rewolucyjną do jeszcze większej siły."
 LBA_shift_to_military: "Przejście do wojska"
 LBA_shift_to_military_desc: "Mogliśmy dać zbyt dużą władzę Korpusowi Strażników Rewolucji. Musimy przesunąć układ sił w stronę regularnej armii, ponieważ niewielka elita najprawdopodobniej ostatecznie obali nasz reżim."
 LBA_lock_supplies: "Zablokuj materiały eksploatacyjne"
 LBA_lock_supplies_desc: "Część naszych dostaw wojskowych jest kontrolowana przez Korpus Strażników Rewolucji. Pozwala to RGC kontrolować zapasy regularnej armii. Powinniśmy oddać całą logistykę RGC, aby wojsko nie miało szans na bunt, ponieważ będzie miało ograniczony dostęp do broni i amunicji. A kiedy cały sprzęt będzie starannie przechowywany w magazynach RGC, zamiast go używać, zużycie będzie jeszcze mniejsze."
 LBA_disarm_rgc: "Rozbroić RGC"
 LBA_disarm_rgc_desc: "Korpus Strażników Rewolucji posiada broń przeznaczoną dla wojska. Musimy przejąć tę broń z powrotem jej prawowitym właścicielom."
 LBA_new_officer_corps: "Nowy Korpus Oficerski"
 LBA_new_officer_corps_desc: "Zarówno w Gwardii Rewolucyjnej, jak i w armii jest wiele wschodzących gwiazd. Musimy szybko zapewnić tym ludziom ważne stanowiska."
 LBA_army_fit_for_libya: "Armia odpowiednia dla Libii"
 LBA_army_fit_for_libya_desc: "Według słów Mutassima Kaddafiego, syna Muammara Kaddafiego; „Na Zachodzie jest 60 milionów Algierczyków, na Wschodzie 80 milionów Egipcjan, mamy przed sobą Europę, a na południu stoimy przed Afryką Subsaharyjską i jej problemami”. Po prostu nie możemy konkurować liczbami. Dlatego musimy skupić się na jakości, a nie na ilości."
 LBA_army_fit_for_libya_tt: "Modyfikuje §Y$LBA_revolutionary_guard_corps$§! lub §Y$LBA_armed_forces_of_arab_jamahiriya$§!"
 LBA_economy_of_libya: "Gospodarka Libii"
 LBA_economy_of_libya_desc: "Libyan economy is based on its oil production. 95% of our exports and 60% of our GDP comes from the petroleum industry. While our oil makes us a lot of money (and has given us the highest Human Development Index in Africa), it is risky making our country so dependent on a single resource and the people who own it. In order to secure the Libyan economy, diversification is needed."
 LBA_train_depot: "Stacja kolejowa"
 LBA_train_depot_desc: "When it comes to rail transport, Libya is an oddity in North Africa. There are no active railways in the whole country. The Italian colonisers built a few smaller lines near Tripoli and Benghazi, but both of these were closed in the 60s. Now, nothing exists. We need to bring Libya to a modern transport system, and for starters we need locomotives for our future railways."
 LBA_tripoli_to_misrata: "Trypolis do Misraty"
 LBA_tripoli_to_misrata_desc: "Nasz region stołeczny powinien być naszym priorytetem w przypadku nowej linii kolejowej. Połączenie głównych miast Trypolisu i Misraty pokaże światu, że my też możemy budować linie kolejowe."
 LBA_misrata_to_sirte: "Misrata do Syrty"
 LBA_misrata_to_sirte_desc: "After connecting Misrata with Tripoli, we should continue line to connect to Sirte, an important hub for our petroleum industry."
 LBA_tobruk_to_benghazi: "Bengazi do Tobruku"
 LBA_tobruk_to_benghazi_desc: "Benghazi is our most important port in Cyrenaica. We need to create a connection from there near to our border with Egypt to improve our military response time in the event of a conflict. The distance is very long but with enough time and money we can do it."
 LBA_benghazi_to_brega: "Bengazi do Bregi"
 LBA_benghazi_to_brega_desc: "Brega jest ważnym ośrodkiem rafineryjnym dla naszego przemysłu naftowego. Powinniśmy połączyć go koleją z naszym portem w Bengazi."
 LBA_connect_east_west_rails: "Połącz Wschód i Zachód"
 LBA_connect_east_west_rails_desc: "Now that we have rail networks built in the East and in the West, it is time to connect these two networks. Now Libyans will be able to travel across the country in just a few moments."
 LBA_connect_sabha: "Połącz Sabhę"
 LBA_connect_sabha_desc: "Sabha is the capital of the Fezzan region, an important air base for the Libyan Air Force and it even served as a test-site for West-German space carrying rockets. There is also some iron ore mining in the region, and by connecting it with a railroad we can expand the mining operations more."
 LBA_connect_jawf: "Połącz Al-Dżauf"
 LBA_connect_jawf_desc: "Al-Dżauf to w zasadzie jedyne większe miasto w dystrykcie Kufra w południowej Libii. Choć ekonomicznie nieistotny, mógłby służyć jako baza do zabezpieczenia naszej południowej flanki."
 LBA_libyan_rail: "Kolej Libijska"
 LBA_libyan_rail_desc: "We have finally reached a situation where the government doesn't have to cover every dinar that the railways need. Because of this, we should organise the railroads into a state owned Libyan Rail company. The amount of people or companies using the railroad isn't enough to cover all of its costs but at least there is now room for growth."
 LBA_kufra_solar_plant: "Elektrownia słoneczna Kufra"
 LBA_kufra_solar_plant_desc: "Libia piecze się w gorącym afrykańskim słońcu. Aktualne badania pokazują, że Libia jest optymalnym miejscem na panele fotowoltaiczne. Panele słoneczne wymagają wielu prac konserwacyjnych, a teraz, gdy podłączyliśmy Al-Dżauf do naszej sieci kolejowej, będzie to dobre miejsce na budowę elektrowni słonecznej."
 LBA_expand_tripoli_airport: "Rozwiń lotnisko w Trypolisie"
 LBA_expand_tripoli_airport_desc: "Port lotniczy Trypolis to nasze główne lotnisko międzynarodowe. Jej rozbudowa zwiększy naszą łączność z resztą świata."
 LBA_expand_benina_airport: "Rozwiń lotnisko w Beninie"
 LBA_expand_benina_airport_desc: "Port lotniczy Benina jest drugim co do wielkości lotniskiem w Libii. Znajduje się w miejscowości Benina, tuż obok Benghazi. Jest to ważne lotnisko dla sprowadzania pracowników migrujących do pracy na polach naftowych."
 LBA_expand_tripoli_port: "Rozwiń port w Trypolisie"
 LBA_expand_tripoli_port_desc: "Port Trypolis jest jednym z najstarszych portów na Morzu Śródziemnym, istniejącym już od czasów rzymskich. Jest to najważniejszy szlak importowy do Libii, a jego rozbudowa zapewni nam większe możliwości rozwoju naszej gospodarki"
 LBA_expand_benghazi_port: "Rozwiń port w Bengazi"
 LBA_expand_benghazi_port_desc: "Benghazi port was founded by the Greeks in 6th century BC. It currently serves as a major hub for exporting our petroleum products. It is important we continue expanding to encourage further growth."
 LBA_organize_desert_trips: "Organizuj wycieczki na pustynię"
 LBA_organize_desert_trips_desc: "Libia ma wiele do zobaczenia dla turystów; Wydmy i oazy Sahary, ruiny greckie i rzymskie, forty osmańskie i pola bitew z II wojny światowej. Musimy wykorzystać te atuty, które mamy i przyciągnąć więcej turystów."
 LBA_derna_windpark: "Farma wiatrowa Derna"
 LBA_derna_windpark_desc: "Libia ma bardzo wysokie średnie prędkości wiatru. Na przykład w pobliżu wybrzeża Derny średnia prędkość wiatru wynosi 7,5 m/s. To sprawia, że ​​Derna jest idealnym miejscem na budowę farmy wiatrowej. Wiatraki służą do pompowania wody z oaz już od lat 40-tych XX wieku, więc na pewno mamy z nimi doświadczenie."
 LBA_expand_tourism: "Rozwiń turystykę"
 LBA_expand_tourism_desc: "Musimy jeszcze bardziej rozwinąć turystykę, aby Libia stała się bardziej atrakcyjnym celem dla turystów, podobnie jak Latakia w Syrii, Synaj w Egipcie i Tunis w Tunezji."
 LBA_stock_exchange: "Znaleziono Giełdę Papierów Wartościowych"
 LBA_stock_exchange_desc: "Libia nie ma giełdy. Aby być bardziej zintegrowanym z rynkami międzynarodowymi, musimy znaleźć taki w Trypolisie. Ludzie będą mieli możliwość pracy w kilku spółkach państwowych."
 LBA_gmmr_kufra: "GMMR Kufra"
 LBA_gmmr_kufra_desc: "The desert city of Al-Jawf in the South of Libya in the Al-Kufrah district is one of the few towns in the area. It is sitting right on top of the Nubian Sandstone Aquifer. It is a good target for expanding the Great Man-Made River. We should allocate additional funds to make the project go quicker."
 LBA_gmmr_ghadames: "GMMR Ghadamesa"
 LBA_gmmr_ghadames_desc: "Na zachodzie kraju, w pobliżu Ghadames, znajduje się kolejny poziom wodonośny, który możemy wykorzystać. Jeśli dołączymy ten obszar do sieci GMMR, zwiększymy jej pojemność."
 LBA_western_mountain_power_plant: "Elektrownia Western Mountain"
 LBA_western_mountain_power_plant_desc: "W Libii działa obecnie tylko jedna stara elektrownia. Musimy zabezpieczyć dostawy energii elektrycznej i zbudować więcej elektrowni w pobliżu stolicy. Istnieją plany budowy elektrowni cyklowej z turbinami gazowymi w pobliżu Al Garbi i powinniśmy pomóc w jej finansowaniu."
 LBA_gmmr_connect_east_west: "Skończ z GMMR"
 LBA_gmmr_connect_east_west_desc: "Ostatnim etapem budowy Wielkiej Rzeki Sztucznej jest połączenie sieci rurociągów na zachodzie i wschodzie poprzez budowę rurociągu z Sirte do Misraty. Potem naprawdę zbudowaliśmy ósmy cud świata."
 LBA_zawia_power_plant: "Elektrownia Zawia"
 LBA_zawia_power_plant_desc: "W mieście Zawia jest dobra lokalizacja dla elektrowni, która jako paliwo mogłaby wykorzystywać zarówno gaz ziemny, jak i ropę naftową. W końcu mamy mnóstwo obu."
 LBA_convert_pipe_factories: "Konwertuj fabryki rur"
 LBA_convert_pipe_factories_desc: "Teraz, gdy zakończyliśmy GMMR, musimy dowiedzieć się, co zrobić ze zbudowanymi w tym celu fabrykami rur. Chociaż niektóre są potrzebne do przyszłych napraw, pozostałe fabryki powinniśmy przekształcić tak, aby produkowały szeroką gamę rur i sprzętu hydraulicznego na eksport."
 LBA_create_ministry_of_agriculture: "Utworzenie Ministerstwa Rolnictwa"
 LBA_create_ministry_of_agriculture_desc: "W Libii nie ma ministerstwa rolnictwa, a wszystkimi projektami rolnymi zajmuje się Biuro Generalnego Inspektora. Jeśli mamy zreformować nasz sektor rolniczy, musimy przeznaczyć ludzi do pracy wyłącznie w rolnictwie. Umożliwi to bardziej efektywne wykorzystanie obecnego sektora rolnego."
 LBA_desalination_plants: "Instalacje odsalania"
 LBA_desalination_plants_desc: "Jednym ze sposobów uzyskania świeżej wody jest woda morska. Dzięki procesom przemysłowym możemy obniżyć poziom soli i sprawić, że woda będzie zdatna do picia. Powinniśmy budować zakłady odsalania w społecznościach przybrzeżnych, aby zwiększyć ich dostęp do wody."
 LBA_expand_agriculture: "Rozwiń Rolnictwo"
 LBA_expand_agriculture_desc: "Teraz, gdy rozszerzyliśmy nasze zaopatrzenie w wodę, powinniśmy być w stanie wykorzystać więcej posiadanych gruntów ornych."
 LBA_land_reform: "Reforma rolna"
 LBA_land_reform_desc: "Największymi wyzwaniami dla libijskiego rolnictwa jest brak świeżej wody i islamskie prawo spadkowe. Problem wody został rozwiązany, ale prawo pozostaje. Z chwilą dziedziczenia gospodarstwo zostaje podzielone pomiędzy wszystkich synów. To powoduje podział coraz mniejszych gospodarstw. Prawo to należy zreformować, aby gospodarstwa mogły utrzymać swoją wielkość, a nawet rozwijać się, jeśli zajdzie taka potrzeba. Nie wyeliminuje to oczywiście naturalnych przeszkód, jakie napotykamy w rolnictwie, ale jest to najlepsze, co możemy wyciągnąć z naszej sytuacji."
 LBA_foreign_food_imports: "Import żywności"
 LBA_foreign_food_imports_desc: "Nie ma sensu toczyć żmudnej bitwy. Libia po prostu nie jest stworzona do uprawy własnej żywności. Musimy stworzyć solidną sieć handlową, aby zabezpieczyć dostawy żywności z innych krajów. Będziemy bardziej uzależnieni od innych krajów, ale powinno to wyeliminować problemy z naszym rolnictwem."
 LBA_continue_nationalised_economy: "Kontynuuj znacjonalizowaną gospodarkę"
 LBA_continue_nationalised_economy_desc: "Większość dużych korporacji w Libii jest kontrolowana przez państwo. Jest to konieczne ze względów strategicznych. Nie możemy pozwolić, aby zagraniczne firmy przybywały i kolonizowały naszych ludzi, nawet jeśli oznaczałoby to, że nie osiągamy tak dużych zysków."
 LBA_liberalise_economy: "Sprywatyzować gospodarkę"
 LBA_liberalise_economy_desc: "Od dziesięcioleci rząd Libii aktywnie kontroluje gospodarkę kraju, będąc właścicielem wielu największych firm. Aby umożliwić szybszy wzrost gospodarczy, należy rozpocząć prywatyzację różnych sektorów gospodarki."
 LBA_expand_agricultural_bank: "Rozwiń Bank Rolniczy"
 LBA_expand_agricultural_bank_desc: "The Agricultural Bank of Libya is responsible for providing guidance and advice to agricultural problems, advancing loans to agricultural cooperatives and developing Libya's agricultural community. Now that we have expanded our agricultural sector, we need to expand the bank's resources to further efficient usage of agricultural land."
 LBA_expand_lisco: "Rozwiń Lisco"
 LBA_expand_lisco_desc: "Lisco, czyli Libyan Iron and Steel Company, to jedna z największych firm produkujących stal w Afryce Północnej. Największymi krajowymi użytkownikami produktów Lisco są General Company for Piping i National Oil Corporation. Inwestując w nie, możemy zwiększyć produkcję stali w Libii i zapewnić lepsze możliwości ekspansji naszemu sektorowi naftowemu"
 LBA_float_national_commercial_bank: "Pływak Narodowy Bank Handlowy"
 LBA_float_national_commercial_bank_desc: "We should make the shares of the National Commercial Bank available to the public. This will allow us to gather funds for the bank's operation, and bring some much needed capital to the country."
 LBA_join_wto: "Dołącz do WTO"
 LBA_join_wto_desc: "We are not yet a member of the World Trade Organisation. We should apply to join to assure the world that we want to follow international standards when it comes to commerce. This should encourage foreign investment in the country."
 LBA_nationalise_arabian_cement_company: "Znacjonalizacja Arabian Cement Company"
 LBA_nationalise_arabian_cement_company_desc: "Arabian Cement Company jest największym producentem cementu, wapna i gipsu w kraju. Powinniśmy znacjonalizować, aby zapewnić zaspokojenie naszych strategicznych potrzeb w zakresie materiałów budowlanych."
 LBA_handle_national_oil_corporation: "Zarządzaj Narodową Korporacją Naftową"
 LBA_handle_national_oil_corporation_desc: "National Oil Corporation kontroluje dużą część pól naftowych w naszym kraju. Musimy ukierunkować ich politykę w większym stopniu na naszą politykę krajową."
 LBA_handle_national_oil_corporation_tt1: "Jeśli zakończyliśmy skupianie się na §Y$LBA_continue_nationalised_economy$§!, to"
 LBA_handle_national_oil_corporation_tt2: "Jeśli zakończyliśmy fokus §Y$LBA_liberalise_economy$§!, to"
 LBA_return_arabian_gulf_company_shares: "Zwróć akcje Arabian Gulf Oil Company"
 LBA_return_arabian_gulf_company_shares_desc: "The Arabian Gulf Oil Company was formed in 1971, when Libya nationalised oil shares held by British Petroleum. Currently, the oil company is a subsidiary of the National Oil Corporation. We should make the company's shares public again, and return a fair share to BP. This should guarantee a more efficient exploration of Libyan oil."
 LBA_military_commission_to_truck_and_bus_company: "Zmilitaryzować firmę zajmującą się ciężarówkami i autobusami"
 LBA_military_commission_to_truck_and_bus_company_desc: "The Truck and Bus Company to libijski producent autobusów i ciężarówek, utworzony w latach 70. jako spółka joint venture z włoską firmą IVECO. Od dziesięcioleci produkują ciężkie pojazdy i powinniśmy wykorzystać ich wiedzę do produkcji pojazdów dla naszego wojska."
 LBA_privatise_maritime_transport_company: "Sprywatyzować GNMTC"
 LBA_privatise_maritime_transport_company_desc: "GNMTC, czyli General National Maritime Transport Company, to państwowe przedsiębiorstwo żeglugowe obsługujące flotę statków różnej wielkości na całym świecie. Planowano nawet uruchomienie statków wycieczkowych. Powinniśmy sprywatyzować firmę i stworzyć możliwości rozpoczęcia lokalnej budowy statków w Libii."
 LBA_state_driven_economy: "Gospodarka sterowana przez państwo"
 LBA_state_driven_economy_desc: "Większość libijskiej gospodarki jest obecnie kontrolowana przez państwo centralne. Być może nie utopi to naszych obywateli w pieniądzach, ale przynajmniej ludzie wiedzą, że mają dla siebie pracę, a w interesie państwa leży zapewnienie im dobrobytu, a nie generowanie zysków dla innych."
 LBA_further_resource_expansion: "Dalsze wydobywanie zasobów"
 LBA_further_resource_expansion_desc: "Powinniśmy w dalszym ciągu wydobywać zasoby z naszej gleby, a nawet rozszerzyć się na nowe formy produkcji. Jeśli mamy wspierać naszą przyszłą gospodarkę, będziemy potrzebować więcej zasobów."
 LBA_modern_economy: "Nowoczesna Gospodarka"
 LBA_modern_economy_desc: "Udało nam się zreformować gospodarkę Libii po stagnacji zimnej wojny. Jesteśmy teraz bardziej wydajni, a przyszły wzrost (i zyski) wydaje się wykazywać tendencję wzrostową."
 LBA_negotiations_with_un: "Negocjacje z ONZ"
 LBA_negotiations_with_un_desc: "As Libyan oil revenue began to increase in the 1970s, Gaddafi greatly increased his support for various rebel groups across the world. Libya was accused of several international terrorist attacks, including the La Belle bombing 1986, the Lockerbie bombing in 1988 and the downing of UTA Flight 772 in 1989. Eventually, Libya was put under extensive sanctions by the UN, which led to Libya handing over two of the Lockerbie suspects to Scottish authorities in 1999. The sanctions are still in place and we need to open a negotiation line to the UN to remove them."
 LBA_meeting_with_taliban: "Spotkaj się z talibami"
 LBA_meeting_with_taliban_desc: "The Taliban are bravely fighting against the Western colonial powers. We need to build closer ties with them and help them in their struggle against the New World Order."
 LBA_assassinate_dissidents: "Zamordować dysydentów"
 LBA_assassinate_dissidents_desc: "Wielu Libijczyków żyjących na wygnaniu otwarcie prowadzi kampanię przeciwko naszemu reżimowi. Należy położyć kres tym oszczerstwom i wyeliminować tych ludzi."
 LBA_meet_hezbollah: "Spotkaj się z Hezbollahem"
 LBA_meet_hezbollah_desc: "Hezbollah walczy z syjonizmem przy pomocy Iranu. Zdobywając wpływy w Hezbollahu, zdobywamy silną pozycję w naszej walce z Izraelem."
 LBA_house_terrorists: "Portowi terroryści"
 LBA_house_terrorists_desc: "Jest mnóstwo bojowników o wolność, których reszta świata nazywa terrorystami, walczących z kolonializmem na Bliskim Wschodzie i na Saharze. Musimy zapewnić tym ludziom kryjówki, aby mieli gdzie się przegrupować i zregenerować siły. Być może uda nam się nawet zrekrutować część z nich w nasze szeregi."
 LBA_celebrate_lockerbie_bombers: "Świętuj zamach bombowy w Lockerbie"
 LBA_celebrate_lockerbie_bombers_desc: "When we dropped a plane right on top of the town of Lockerbie, the world knew what we were capable of. We should not be ashamed of this act, for the world should tremble in terror at what we can do when angered."
 LBA_wmds: "Zdobądź wirówki"
 LBA_wmds_desc: "Od rozpoczęcia libijskiego programu nuklearnego w latach 70. XX w. większością wiedzy i pozyskiwaniem materiałów zajmował się Friedrich Tinner, szwajcarski inżynier nuklearny. Nadal kieruje naszym programem nuklearnym i powinniśmy wykorzystać jego powiązania, aby rozpocząć budowę wirówek do wzbogacania jądrowego."
 LBA_start_building_reactor_desc: "W 1979 roku Związek Radziecki zbudował reaktor badawczy w Tajoura pod nadzorem MAEA. To jednak nie nadaje się do naszych wirówek i do produkcji broni nuklearnej. Musimy zbudować odpowiedni reaktor jądrowy do produkcji uranu."
 LBA_start_building_reactor_tt: "§RIJeśli jakikolwiek kraj będzie na tyle szalony, aby zacząć atakować kraje przy użyciu możliwej broni masowego rażenia, możemy być dla niego celem!§!"
 LBA_start_building_reactor: "Rozpocznij budowę reaktora"
 LBA_arms_smuggling: "Przemycać broń"
 LBA_arms_smuggling_desc: "Ze względu na międzynarodowe sankcje tak naprawdę nie możemy legalnie kupować broni. Jednak nadal mamy kilka kanałów, dzięki którym możemy dostarczyć więcej broni dla naszych żołnierzy."
 LBA_buy_nukes: "Kup Nuke'a"
 LBA_buy_nukes_desc: "Muammar Gaddafi tried to acquire nuclear weapons from other countries multiple times; In 1970, when Gaddafi visited China, he asked premier Zhou Enlai to provide Libya with a nuclear weapon to protect against the Israeli nuclear program. In 1974 Libya joined Pakistan's Project-706 nuclear program but was kicked out in 1977 when general Zia-ul-Haq took power. In 1984 a nuclear pact was signed with India, but no real actions were taken. As the Soviet Union collapsed in 1991, Gaddafi tried to use the chaos to unsuccessfully acquire nuclear materials. Maybe it has come time to try to acquire nuclear weapons from a 3rd party once again?"
 LBA_buy_nukes_tt: "§RIJeśli zostaniemy złapani z bronią nuklearną, mocarstwa zachodnie z pewnością zainterweniują!§!"
 LBA_compensation_to_lockerbie_victims: "Odszkodowanie dla ofiar Lockerbie"
 LBA_compensation_to_lockerbie_victims_desc: "Aby naprawić nasze stosunki z Zachodem, zwłaszcza z Wielką Brytanią, powinniśmy dojść do porozumienia w sprawie wypłaty odszkodowań rodzinom ofiar Lockerbie. Pokazałoby to, że poważnie podchodzimy do naszego zaangażowania w poprawę naszej pozycji międzynarodowej."
 LBA_disarmament_program: "Program rozbrojeniowy"
 LBA_disarmament_program_desc: "We have plans for several enriching reactors. We also possess centrifuges and uranium. We have stockpiles of mustard gas, sarin gas and the chemicals to make them. All of this needs to go and be destroyed under Western supervision. These are the conditions given to us by the West. If we get on with their program, they have promised to start easing some of the sanctions."
 LBA_disarmament_program_tt: "Przekażemy §Y[LBA.LBA_friedrich_tinner.GetName]§! władzom szwajcarskim, aby to one zdecydowały, co z nim zrobić."
 LBA_remove_sanctions: "Usuń sankcje"
 LBA_remove_sanctions_desc: "Zachód w końcu zgodził się na zniesienie naszych sankcji. Ponieważ przekonaliśmy ich, że nie stanowimy już dla nich zagrożenia, jesteśmy mile widziani z powrotem w społeczności międzynarodowej."
 LBA_invite_foreign_investors: "Zaproś inwestorów zagranicznych"
 LBA_invite_foreign_investors_desc: "Now that we are free from sanctions, we should invite foreign investors into the country in order to improve the economy."
 LBA_arms_deals_with_italy: "Umowa zbrojeniowa z Włochami"
 LBA_arms_deals_with_italy_desc: "Pomimo tego, że jesteśmy naszym starym kolonialnym władcą, nadal mamy dość ciepłe stosunki z Włochami. Mają też bardzo zaawansowaną armię. To logiczne, że dopasujemy naszą armię do ich armii."
 LBA_arms_deals_with_italy_tt: "Jeśli zaakceptują,\n"
 LBA_approach_western_leaders: "Podejdź do zachodnich przywódców"
 LBA_approach_western_leaders_desc: "Zachód jest głównym inicjatorem nałożenia na nas sankcji. Musimy zwrócić się do różnych zachodnich przywódców, aby poprawić nasze stosunki z nimi."
 LBA_taxation_deal_with_uk: "Umowa podatkowa w Wielkiej Brytanii"
 LBA_taxation_deal_with_uk_desc: "The United Kingdom has one of the largest double tax treaty networks in the world. A double tax treaty allows a company to operate in multiple countries, without having to pay taxes on the same profit multiple times. This encourages companies to branch out and set up permanent offices in other countries. We should sign a similar deal with the United Kingdom to increase our economic attractiveness."
 LBA_compensation_from_italy: "Odszkodowanie z Włoch"
 LBA_compensation_from_italy_desc: "For years, Italy exploited our country as a colony. We have heard information that Italy might react positively to paying us reparations from the colonial period in order to improve its public image. We should contact them, and try to negotiate some kind of a deal."
 LBA_request_usaid: "Poproś o USAID"
 LBA_request_usaid_desc: "USAID to międzynarodowy program pomocy prowadzony przez rząd USA, skupiający się na pomocy w przypadku klęsk żywiołowych i ubóstwa. Pomoc otrzymuje wiele krajów rozwijających się. My też powinniśmy dołączyć do programu. Zwiększy to wpływy Ameryki w kraju, ale załata kilka dziur w naszym budżecie."
 LBA_neighbourly_politics: "Polityka sąsiedzka"
 LBA_neighbourly_politics_desc: "Libia jest otoczona przez wiele narodów, ale mamy dobre kontakty tylko z kilkoma. Stosunki z Egiptem i Czadem są zepsute przez przeszłe wojny, Sudan, Niger i Algierię oddzielają od nas rozległe pustynie, a Europa jest bardzo wrogo nastawiona do naszego reżimu. Tylko Tunezja jest z nami w przyjaznych stosunkach i nawet ona zbudowała fortyfikacje obronne i płoty graniczne między naszymi krajami. Otwarcie się na świat będzie trudne."
 LBA_close_ties_sahrawi: "Bliższe więzi z Sahrawi"
 LBA_close_ties_sahrawi_desc: "We have been a close supporter of the POLISARIO Front in Sahrawi since the 1980s. Many of the weapons for their Liberation Army come from us or Algeria, and it is not uncommon for Sahrawi students to travel to Libya for their education. Our support for Sahrawi is the greatest success story against colonialism, and we need to increase our support for them."
 LBA_switch_to_morocco: "Porzuć Sahrawi"
 LBA_switch_to_morocco_desc: "Wspieranie Sahrawi popsuło nasze stosunki z Marokiem. Maroko jest wschodzącą potęgą gospodarczą i jest w opozycji do Algierii, potężnego narodu tuż obok nas. Najbardziej sensowne byłoby porzucenie naszego bezsensownego wsparcia dla Sahrawi i zamiast tego budowanie przyjaznych stosunków z Marokiem."
 LBA_support_algeria: "Wesprzyj Algierię"
 LBA_support_algeria_desc: "Podobnie jak my, Algieria od dawna wspiera Sahrawi. Od wieków rywalizują z Marokiem, dlatego warto zacieśnić z nimi więzi."
 LBA_condemn_spanish_colonialism: "Potępiać hiszpański kolonializm"
 LBA_condemn_spanish_colonialism_desc: "Sahara Zachodnia była własnością Hiszpanów, zanim oddali ten obszar Maroko, kładąc podwaliny pod konflikt w Saharze Zachodniej. Hiszpanie odmówili jednak zwrotu miast Ceuta i Melilla Maroko, twierdząc, że stanowią one integralną część Hiszpanii. To nic innego jak wymówka. Te obszary są w pełni marokańskie."
 LBA_influence_mauritania: "Wpływ na Mauretanię"
 LBA_influence_mauritania_desc: "Mauretania prowadziła krótką wojnę z Marokiem o Saharę Zachodnią po wycofaniu się Hiszpanii z regionu. Nie zajmują już tego terytorium, ale intensywnie śledzą konflikt w Saharze Zachodniej i są jednym ze zwolenników Frontu Polisario. Aby rozwiązać konflikt w Saharze Zachodniej, ważne jest zwiększenie naszej kontroli nad nimi."
 LBA_casablanca_accords: "Porozumienia z Casablanki"
 LBA_casablanca_accords_desc: "Konflikt w Saharze Zachodniej od dziesięcioleci znajduje się w stanie zamrożenia i nikt nie jest w stanie go rozwiązać. Musimy wykorzystać nasze wpływy w regionie, aby rozwiązać konflikt."
 LBA_casablanca_accords_tt: "Misja będzie aktywna przez §Y365 dni§!. W czasie trwania misji będziemy musieli przekonać pozostałych uczestników (§Y[ALG.GetNameWithFlag], [MOR.GetNameWithFlag], [SHA.GetNameWithFlag] i [MAU.GetNameWithFlag]§!) do wybranego przez nas rozwiązania. Głównym sposobem na przekonanie krajów do naszego rozwiązania jest §YWpływ§!\n\n"
 LBA_influence_malta: "Wpływ na Maltę"
 LBA_influence_malta_desc: "Malta jest ważnym punktem pośrednim między Włochami a Libią. Gdyby było tam obecne wrogie mocarstwo, z łatwością zdominowałoby nasze zachodnie wybrzeże. Musimy zadbać o to, abyśmy pozostali w przyjaznych stosunkach z Maltą."
 LBA_italian_trade: "Handel Włoski"
 LBA_italian_trade_desc: "Pomimo tego, że Włochy są naszym dawnym władcą kolonialnym, Włochy są dla nas ważnym partnerem. Bliskość sprawia, że ​​są dobrą bramą do Europy."
 LBA_crete_safety: "Zabezpieczenie Krety"
 LBA_crete_safety_desc: "Kreta jest w posiadaniu państwa NATO i mogłaby z łatwością zostać wykorzystana do zdominowania wschodniej Libii. Musimy podjąć kroki w celu zabezpieczenia naszego wschodniego wybrzeża."
 LBA_protect_malta: "Chroń Maltę"
 LBA_protect_malta_desc: "Nasze wpływy na Malcie rosną. Musimy całkowicie wprowadzić ich w naszą strefę wpływów, aby chronić Trypolis przed atakiem morskim."
 LBA_protect_crete: "Chroń Kretę"
 LBA_protect_crete_desc: "Kreta ma dla nas ogromne znaczenie strategiczne. Musimy nalegać na przejęcie kontroli nad wyspą już teraz, zanim będzie za późno."
 LBA_libyan_sea_dominance: "Kontroluj Morze Libijskie"
 LBA_libyan_sea_dominance_desc: "Dzięki naszej kontroli nad Maltą i Kretą stworzyliśmy mur ochronny dla naszego wrażliwego wybrzeża. Naszym statkom będzie znacznie łatwiej działać na Morzu Libijskim."
 LBA_approach_hamas: "Zbliż się do Hamasu"
 LBA_approach_hamas_desc: "Hamas jest jedyną prawdziwą siłą próbującą zapobiec syjonizmowi. Musimy budować z nimi lepsze więzi, aby przygotować się do obalenia Izraela."
 LBA_send_fighters_to_hamas: "Wyślij bojowników do Hamasu"
 LBA_send_fighters_to_hamas_desc: "While the Palestinians are bravely resisting the Zionist invaders, the simple truth is that they are outnumbered. We need to arrange a group of volunteers to travel to Palestine and join Hamas' ranks."
 LBA_new_intifada: "Nowa Intifada"
 LBA_new_intifada_desc: "Nadszedł czas, aby Hamas rozpoczął nową intifadę przeciwko syjonistom. Z naszym wsparciem będzie to zabójcze."
 LBA_all_are_idiots: "Wszyscy są idiotami"
 LBA_all_are_idiots_desc: "Like the great leader Gaddafi said, both the Israelis and Palestinians are idiots who can't stop fighting. If we want to solve the problems in the Levant, the solutions need to come from the outside."
 LBA_claim_jerusalem_for_arabs: "Zajmijcie Jerozolimę dla Arabów"
 LBA_claim_jerusalem_for_arabs_desc: "Ani Izraelczycy, ani Palestyńczycy nie zasługują na ten region. Pokazali, że tylko narobią bałaganu. Sprawowanie władzy nad regionem i zapewnienie pokoju i stabilności powinno należeć do prawdziwych Arabów."
 LBA_claim_jerusalem_for_arabs_tt: "Będziemy mogli zwrócić §YRoszczenie§! stany Lewantu na §YRdzenie§!"
 LBA_reconcile_with_israel: "Pojednać się z Izraelem"
 LBA_reconcile_with_israel_desc: "To było głupie z naszej strony, że byliśmy tak wrogo nastawieni do Izraela. Są wielką potęgą militarną i nuklearną w regionie i ich dalsze istnienie musi coś znaczyć. Powinniśmy naprawić nasze wrogie stosunki z nimi."
 LBA_recall_libyan_jews: "Przypomnijmy sobie libijskich Żydów"
 LBA_recall_libyan_jews_desc: "In the late 1940s, almost 40 000 Jews lived in Libya. Most of them migrated to Israel after their independence due to horrors suffered under the fascist Italian regime. As Libya gained independence, an anti-Jewish atmosphere continued. By the time Gaddafi took power in 1969, only around 100 Jews remained in the country. He continued a hard anti-Jewish policy and by 2000 only a few (known) Jews lived in the country. Expelling these people was a mistake and we should offer them the option of returning to Libya."
 LBA_arms_deal_with_israel: "Umowa zbrojeniowa z Izraelem"
 LBA_arms_deal_with_israel_desc: "Izrael jest potęgą militarną na Bliskim Wschodzie. Musimy stanąć po ich dobrej stronie i uzyskać dostęp do nowoczesnej broni."
 LBA_champion_of_al_aqsa: "Mistrz Al-Aksa"
 LBA_champion_of_al_aqsa_desc: "Dzięki naszym działaniom staliśmy się orędownikiem wszystkich muzułmanów. Al-Aksa jest wreszcie pod naszą kontrolą."
 LBA_southern_focus: "Południowe skupienie"
 LBA_southern_focus_desc: "Na naszym Południu znajduje się strefa niestabilności i rywalizacji. Niger cierpi z powodu powstania islamistycznego, Czad jest naszym starym rywalem, a Sudan jest zaangażowany w aktywny konflikt w Darfurze. Tworzy to strefę niestabilności i uchodźców za naszą południową granicą i sensowne byłoby utworzenie pewnego rodzaju strefy buforowej."
 LBA_rivalry_with_chad: "Rywalizacja z Chadem"
 LBA_rivalry_with_chad_desc: "Od czasu naszej porażki w wojnie z Toyotą stosunki z Czadem są napięte. Pewnego dnia dokonamy zemsty i odzyskamy pas Aouzou."
 LBA_reconcile_with_chad: "Pojednaj się z Chadem"
 LBA_reconcile_with_chad_desc: "Chowanie urazy sprzed kilkudziesięciu lat jest z naszej strony dziecinne. Powinniśmy pogodzić się z Czadem i wspólnie pracować na rzecz stabilności w regionie."
 LBA_reclaim_aouzou_strip: "Odzyskaj pas Aouzou"
 LBA_reclaim_aouzou_strip_desc: "The Aouzou Strip is a piece of land the French ceded from their Chadian colony to the Italians. We tried to take back the area in the 80s but were defeated by Chad. While the region is poor and sparsely populated, it is still a matter of pride. Also, there might be uranium in the region."
 LBA_reclaim_aouzou_strip_threat: "[LBA.GetNameDef] przejmuje Pas Aouzou"
 LBA_strip_toubou_of_citizenship: "Pozbawić Toubou obywatelstwa"
 LBA_strip_toubou_of_citizenship_desc: "The Toubou aren't native to Libya. They are simply herders who have crossed the border from Chad onto our side. They have no place in Libya."
 LBA_strip_toubou_of_citizenship_tt: "§RBponieważ wcześniej obiecaliśmy chronić mniejszości, plemiona libijskie poczują się poważnie urażone!§!\n"
 LBA_utilise_toubou: "Skorzystaj z Toubou"
 LBA_utilise_toubou_desc: "Ostatnim razem, gdy najechaliśmy Czad, finansowaliśmy rebeliantów Toubou walczących z reżimem Czadu. Ostatecznie Goukouni Oueddei, syn derde (przywódcy) Toubou, został prezydentem Czadu. Przygotowując się do kolejnego konfliktu z Czadem, powinniśmy powtórzyć tę formułę i wesprzeć Toubou."
 LBA_utilise_toubou_tt: "Jeśli wypowiemy wojnę §Y[CHA.GetNameWithFlag]§!, lud Toubou z §Y[TIE.GetNameWithFlag]§! §Yogłosi niepodległość§! i zostań §Y$autonomią_puppet_state$§! nasza"
 LBA_suggest_joint_mining: "Zaproponuj wspólne wydobycie"
 LBA_suggest_joint_mining_desc: "Jeśli połączymy nasze wysiłki z Czadem, będziemy w stanie wydobyć ogromne ilości uranu ze strefy Aouzou, z korzyścią dla obu krajów."
 LBA_demand_aouzou: "Żądaj pasa Aouzou"
 LBA_demand_aouzou_desc: "Nadszedł czas, aby Chad oddał nam kontrolę nad pasem Aouzou. Jeśli odmówią, nie popełnimy tych samych błędów, które popełniliśmy podczas wojny Toyoty."
 LBA_demand_aouzou_threat: "[LBA.GetNameDef] Zażądał pasa Aouzou"
 LBA_demand_chads_submission: "Zażądaj poddania się Chada"
 LBA_demand_chads_submission_desc: "Chociaż udało nam się odeprzeć pas Aouzou od Czadu, nie wiadomo, co planują. W tej chwili mogą gromadzić sojuszników, aby nas zaatakować i odzyskać swoje ziemie. Musimy zażądać, aby wrogi rząd [CHA.GetLeader] ustąpił, a kontrolę nad krajem przejął rząd, który może obiecać [ROOT.GetName] pewne bezpieczeństwo."
 LBA_demand_chads_submission_tt: "[LBA.GetNameDef] Zażądał [CHA.GetAdjective] poddania się"
 LBA_invest_in_chadian_cotton: "Zainwestuj w bawełnę czadyjską"
 LBA_invest_in_chadian_cotton_desc: "Jednym z głównych towarów eksportowych Czadu jest bawełna. Powinniśmy zainwestować w ich przemysł bawełniany i zawrzeć umowę handlową, aby importować wysokiej jakości bawełnę bezpośrednio do [ROOT.GetName]."
 LBA_invest_in_chadian_cotton_tt: "Jeśli [CHA.GetNameWithFlag] wyrazi zgodę, to\n"
 libya_chad_uranium_deal_tt: "[CHA.GetNameWithFlag] zgodził się na wspólne wydobywanie"
 LBA_humanitarian_aid_to_chad: "Pomoc humanitarna dla Czadu"
 LBA_humanitarian_aid_to_chad_desc: "Czad ma jeden z najniższych wskaźników rozwoju społecznego na całym świecie. Nigdy też tak naprawdę nie otrząsnęli się po wojnie domowej z lat 80., a w kraju nadal istnieją pewne grupy rebeliantów. Powinniśmy przeprowadzić masową kampanię pomocy humanitarnej, aby pomóc krajowi się rozwijać."
 LBA_exploit_chadian_oil: "Wykorzystaj olej czadyjski"
 LBA_exploit_chadian_oil_desc: "Czad niedawno odkrył ich złoża ropy, a jest ich o wiele więcej. Niestety Chad nie ma środków, aby samodzielnie przeprowadzić odwierty. Musimy wykorzystać nasze wpływy w kraju, aby wydobyć tę słodką ropę z ziemi."
 LBA_support_darfur: "Wesprzyj[DAR.GetName]"
 LBA_support_darfur_desc: "Darfur has been under the rule of Sudan ever since Sudan was created as a nation. Darfur is mostly populated by non-Arab blacks, while Sudan itself is mostly Arabic. Many in Darfur feel that the Arabic government is making them the subject of an Arab apartheid campaign. We need to support the Darfuri in their state of oppression. In addition, an independent Darfur would make a good buffer state near our Southern border."
 LBA_support_sudan: "Wesprzyj[SUD.GetName]"
 LBA_support_sudan_desc: "Odkąd Omar al-Bashir objął władzę w Sudanie, stosunki między nami a Sudanem są całkiem dobre. Na początku lat 90. pojawiały się nawet propozycje zjednoczenia obu krajów. Sudan byłby silnym sojusznikiem i świetnym partnerem panarabskim i panaafrykańskim."
 LBA_send_mercenaries: "Wyślij najemników"
 LBA_send_mercenaries_desc: "Musimy wysłać najemników do naszego sojusznika na Wschód, aby ustabilizować ich reżim."
 LBA_send_mercenaries_tt_1: "Jeśli ukończyliśmy fokus §Y$LBA_support_darfur$§!:\n"
 LBA_send_mercenaries_tt_2: "Jeśli ukończyliśmy fokus §Y$LBA_support_sudan$§!:\n"
 LBA_gaddafis_dream: "Sen Kaddafiego"
 LBA_gaddafis_dream_desc: "Once he came to power, Muammar Gaddafi wanted to create the United Arab States, and even made some progress with temporary unions with Tunisia and Egypt. However, after some bad blood with Arab leaders and the death of Arab nationalism, this dream seems to have crumbled. However, there are other paths Gaddafi could take..."
 LBA_approach_algeria: "Dojazd do Algierii"
 LBA_approach_algeria_desc: "Algeria is a long-time partner in the region. Neither of us are really fond of the West, we have struggled together against Islamists and both of us are strong supporters of Sahrawi independence from Morocco. It is important we stay on good terms with Algeria."
 LBA_approach_egypt: "Podejdź do Egiptu"
 LBA_approach_egypt_desc: "Nie mamy zbyt silnych powiązań z Egiptem. Są jednak potęgą militarną i gospodarczą w regionie oraz kontrolują strategiczny Kanał Sueski. Upewnienie się, że są po naszej stronie, jest niezwykle istotne."
 LBA_approach_eritrea: "Dojazd do Erytrei"
 LBA_approach_eritrea_desc: "Erytreą rządzi podobnie myślący dyktator. Posiadają również ważne wąskie gardło w pobliżu cieśniny Mandeb. Strategiczne partnerstwo z nimi umożliwi nam wykorzystanie większej mocy na Morzu Czerwonym."
 LBA_weapons_to_taylor: "Broń dla Taylora"
 LBA_weapons_to_taylor_desc: "Szkoliliśmy Charlesa Taylora na bojownika partyzanckiego. W 1989 wysłaliśmy go do Liberii, aby obalił proamerykański rząd, co zakończyło się pierwszą wojną domową w Liberii. Taylor ma teraz kłopoty, ponieważ rebelianci z kraju i z zewnątrz zagrażają jego rządom. Musimy wysłać mu dodatkowe wsparcie, aby mieć pewność, że utrzyma się u władzy."
 LBA_central_african_mercs: "Najemnicy z Afryki Środkowej"
 LBA_central_african_mercs_desc: "Większość Gwardii Prezydenckiej Republiki Środkowoafrykańskiej składa się z libijskich najemników. Należy wzmocnić ten oddział, aby mieć pewność, że [CAR.GetLeaderowi] nic złego się nie stanie."
 LBA_red_sea_trade_deal: "Umowa handlowa na Morzu Czerwonym"
 LBA_red_sea_trade_deal_desc: "Ponieważ zarówno Egipt, jak i Erytrea są nam przyjazne, powinniśmy zawrzeć umowę handlową ułatwiającą wzrost."
 LBA_meet_mengistu: "Poznaj Mengistu"
 LBA_meet_mengistu_desc: "Mengistu Haile Mariam rządził Etiopią od 1977 do 1991 roku jako szef Derg, lewicowej junty wojskowej kontrolującej kraj. Uciekł z Etiopii w 1991 r., co zakończyło długotrwałą wojnę domową w Etiopii. Obecnie mieszka w Zimbabwe i jest sądzony zaocznie za ludobójstwo. Mengistu był ważnym bojownikiem antyzachodnim. Powinniśmy się z nim spotkać i wyrazić nasze wsparcie dla niego."
 LBA_meet_mengistu_tt_1: "\nJeśli §YMengistu§! nadal żyje na wygnaniu:\n"
 LBA_meet_mengistu_tt_2: "\nJeśli §YMengistu§! rządzi §Y[ETH.GetNameWithFlag]§!:\n"
 LBA_anti_colonialist: "Unia Antykolonialna"
 LBA_anti_colonialist_desc: "Przez cały okres swoich rządów Kaddafi wspierał liczne ruchy niepodległościowe i ruch oporu. Jego zjadliwa antyzachodnia postawa wyzwoliła wielu ludzi z ucisku. Na świecie wciąż jest wielu uciskanych ludzi i naszym celem powinno być zapewnienie wolności wszystkim."
 LBA_anti_colonialist_tt: "Będziemy mogli uruchomić §YCivil Wars§! w §YNon-emerging§! kraje posiadające wpływy. Powstanie dołączy do naszej §YFrakcji§! jak zaczyna się wojna."
 LBA_strive_for_uar: "Staraj się o UAR"
 LBA_strive_for_uar_desc: "Pierwszym celem Kaddafiego było zjednoczenie świata arabskiego. Jednak gdy umarł arabski nacjonalizm, a Kaddafi wdał się w konflikt z innymi przywódcami arabskimi, możliwość zjednoczenia zniknęła. Teraz potrzeba potężnej potęgi na Bliskim Wschodzie, aby ponownie zacząć popychać sprawę do przodu. Jednakże przy wystarczającej sile dyplomatycznej być może uda nam się ożywić ten pomysł."
 LBA_strive_for_african_union: "Stany Zjednoczone Afryki"
 LBA_strive_for_african_union_desc: "Gdy arabski nacjonalizm ucichł, Kaddafi przeniósł swoją uwagę z jednoczenia Arabów na zjednoczenie kontynentu afrykańskiego. Na tym powinniśmy się skupić, ponieważ Afryka bardzo ucierpiała z powodu kolonializmu. Tylko jednocząc się możemy zapobiec takim wydarzeniom w przyszłości."
 LBA_strive_for_african_union_trigger_tt: "Nie utworzyliśmy §Yneo-Baasistowskiego UAR§!"
 LBA_strive_for_african_union_tt: "Będziemy mogli kontrolować politykę §YUni Afrykańskiej§! nawet jeśli nie jesteśmy §Y$regional_power$§!\n\nTo także skupi uwagę na §Y$LBA_the_real_monarch$§! dostępny dla Kaddafiego."
 LBA_strive_for_african_union_unlock_shared_tree_tt: "Włącz wspólną §YUnię Afrykańską§! gałąź drzewa ostrości i kategoria decyzji dla wszystkich krajów afrykańskich. Zostaną one wykorzystane, aby coraz bardziej przybliżać Unię Afrykańską do zjednoczenia\n\n"
 LBA_islamic_legion: "Legion Islamski"
 LBA_islamic_legion_desc: "W latach 70. Kaddafi utworzył panarabską i panislamistyczną siłę paramilitarną, która miała być elitarną siłą bojową wysyłaną w celu interwencji w konfliktach. Legion składał się głównie z biednych imigrantów z Sahelu, a także obywateli Pakistanu i Bangladeszu, którym fałszywie obiecano pracę cywilną. Legion został rozwiązany po słabych wynikach w wojnie z Czadem. Musimy odtworzyć ten legion, ale tym razem lepiej. Będzie się składać z wysoce zmotywowanych wolontariuszy."
 LBA_regional_politics: "Polityka regionalna"
 LBA_regional_politics_desc: "W miarę wzrostu naszej władzy i wpływów musimy rozszerzyć naszą władzę, aby objęła całą Afrykę i Bliski Wschód."
 LBA_contact_taylor: "Skontaktuj się z Taylorem"
 LBA_contact_taylor_desc: "Charles Taylor jest protegowanym Kaddafiego. Jest naszym kluczem do rozszerzenia naszych wpływów w Afryce Zachodniej."
 LBA_contact_koroma: "Skontaktuj się z RUF-em"
 LBA_contact_koroma_desc: "The Revolutionary United Front is fighting as part of the Armed Forces Revolutionary Council against Sierra Leone and West African forces. RUF has ties to Charles Taylor and Liberia and keeping them running is important."
 LBA_new_liberian_revolution: "Nowa rewolucja w Liberii"
 LBA_new_liberian_revolution_desc: "Wspieranie Charlesa Taylora w Liberii było jedną z bardziej udanych operacji Kaddafiego za granicą. Musimy skupić całą naszą uwagę na regionie."
 LBA_new_liberian_revolution_tt: "§GJeśli rewolucja się powiedzie, [THIS.GetNameDef] stanie się naszą marionetką. Jeśli nie, rozpocznie się wojna domowa, a zbuntowana strona stanie się naszą marionetką§!"
 LBA_spread_fire_to_guinea: "Rozprzestrzeniaj ogień na Gwineę"
 LBA_spread_fire_to_guinea_desc: "Gwinea próbowała powstrzymać Taylora. Trzeba im pokazać, kto tu rządzi."
 LBA_spread_fire_to_ivory_coast: "Rozprzestrzenić ogień na Wybrzeże Kości Słoniowej"
 LBA_spread_fire_to_ivory_coast_desc: "Wybrzeże Kości Słoniowej służyło jako baza dla bojówek przeciwnych Taylorowi. Musimy zabezpieczyć wschodnią flankę Liberii."
 LBA_reinforce_central_african_mercs: "Wzmocnij najemników z Afryki Środkowej"
 LBA_reinforce_central_african_mercs_desc: "Our detachment of mercenaries is working wonders in the Central African republic. We need to extend our 'protection' of the Central African leadership with additional mercenaries."
 LBA_mercenary_coup: "Obalić Republikę Środkowoafrykańską"
 LBA_mercenary_coup_desc: "Mając w kieszeni Środkowoafrykańską Gwardię Prezydencką, obalenie rządzącego prezydenta na rzecz bardziej uprzywilejowanego kandydata nie powinno być trudne. Oczywiście ze względów bezpieczeństwa."
 LBA_incursion_to_rep_congo: "Najazdy do Kongo"
 LBA_incursion_to_rep_congo_desc: "Przejmując kontrolę nad Kongo, otworzymy drogę morską z Afryki Środkowej. Zapewni nam to lepszą dostępność do wnętrza kontynentu."
 LBA_incursion_to_drc: "Napady na DRK"
 LBA_incursion_to_drc_desc: "Demokratyczna Republika Konga jest bogata w zasoby naturalne. Musimy sięgnąć po te zasoby."
 LBA_djibouti_base: "Baza Marynarki Wojennej w Dżibuti"
 LBA_djibouti_base_desc: "Dżibuti leży w strategicznym wąskim punkcie Morza Czerwonego, w cieśninie Mandeb. Zwiększanie naszych wpływów w Dżibuti pozwoli nam kontrolować Cieśninę Sueską bez konieczności wchodzenia do Egiptu."
 LBA_destability_somalia: "Fund Destabilisation Of Somalia"
 LBA_destability_somalia_desc: "Somalia jest wrakiem od upadku Siada Barre w latach 90-tych. W kraju toczy się wojna domowa, istnieją obszary separatystyczne, które uległy oderwaniu, wybrzeże Somalii szerzy się piractwem, a dżihadyści mogą swobodnie działać w kraju. Utrzymując niestabilność kraju, mamy powód, aby utrzymać obecność w regionie."
 LBA_destability_somalia_tt: "[SML.GetNameWithFlag] i [PUN.GetNameWithFlag] umożliwiają wybór pomiędzy dwiema opcjami:\n"
 LBA_arm_ethiopian_tribes: "Uzbrój plemiona etiopskie"
 LBA_arm_ethiopian_tribes_desc: "We wschodniej części Etiopii znajduje się region Ogaden. Region ten zamieszkuje wiele plemion somalijskich. W latach 70. oba kraje stoczyły krótką wojnę o ten region. Wysyłanie broni do różnych plemion z pewnością wywoła opór przeciwko państwu etiopskiemu."
 LBA_organise_eth_som_conflict: "Zorganizuj konflikt proxy"
 LBA_organise_eth_som_conflict_desc: "Mając kilku strategicznie rozmieszczonych agentów, możemy wzniecić konflikt w całym Rogu Afryki. Gdy w regionie popadnie absolutny chaos, będziemy mieli doskonały pretekst do interwencji."
 LBA_intervene_for_stability: "Interwencja na rzecz stabilności"
 LBA_intervene_for_stability_desc: "W Rogu Afryki panuje chaos. Musimy interweniować, aby ocalić biednych ludzi cierpiących z powodu represyjnych reżimów. To dla dobra Afryki."
 LBA_influence_yemen: "Wpływ na Jemen"
 LBA_influence_yemen_desc: "Yemen controls the Northern side of the Mandeb strait. Just like Djibouti, their friendliness towards us is vital."
 LBA_infiltrate_kuwait: "Infiltruj Kuwejt"
 LBA_infiltrate_kuwait_desc: "The Royals in the Arabian Gulf are nothing but Western puppets that use their dirty oil money to oppress the faithful Arabs. The Kuwaitis are one of the worst offenders. Luckily, there is an Islamic preacher, Hakem Al-Mutairi, who shares our view of the Kuwaiti regime."
 LBA_occupy_socotra_desc: "Wyspa Socotra na krańcu Rogu Afryki pełni funkcję wieży strażniczej chroniącej wejście do Morza Czerwonego. Przejęcie kontroli nad wyspą zapewniłoby nam dobrą pozycję do kontrolowania Oceanu Indyjskiego."
 LBA_occupy_socotra: "Okupuj Sokotrę"
 LBA_fortify_socotra: "Wzmocnij Sokotrę"
 LBA_fortify_socotra_desc: "Teraz, gdy Socotra jest pod naszą kontrolą, musimy wzmocnić wyspę, aby wzmocnić naszą pozycję."
 LBA_contact_qatar: "Skontaktuj się z Katarem"
 LBA_contact_qatar_desc: "Katar różni się od pozostałych krajów Zatoki Perskiej. Zamiast być psami wahabickimi finansowanymi przez CIA, są zorientowani na Bractwo Muzułmańskie. To sprawia, że ​​są one nieco mniej gorsze. Jednak oni też nie przepadają za Saudyjczykami, tak jak my. Być może uda nam się ich przekonać, aby byli z nami bliżej."
 LBA_overthrow_saudis: "Obalić Saudyjczyków"
 LBA_overthrow_saudis_desc: "Saudyjczycy oskarżyli nas o próbę zamachu na [SAU.GetLeader]. Jest to oczywiście kompletna bzdura. Prowadzą przeciwko nam kampanię oszczerstw, aby ukryć swój własny okrutny i mroczny reżim. Musimy je zniszczyć."
 LBA_overthrow_kuwaitis: "Obalić Kuwejtczyki"
 LBA_overthrow_kuwaitis_desc: "The time has come to end the Al-Sabah rule over our Kuwaiti brothers."
 LibyaFocus.1.t: "[FROM.GetNameDef] Sojusznicy z Boko Haram"
 LibyaFocus.1.desc: "Otrzymaliśmy kilka niepokojących raportów, że bojownicy Boko Haram przekraczają północną granicę i udają się do [FROM.GetNameDef]. Starsi przywódcy Boko Haram rozmawiali z [FROM.GetAdjective], a bojowników Boko Haram widywano na obozach szkoleniowych [FROM.GetAdjective]. Wydaje się, że obecnie istnieją potężne siły wspierające powstanie Boko Haram, co może okazać się dla nas problematyczne."
 LibyaFocus.1.a: "Niepokojący"
 LibyaFocus.2.t: "Powstania Boko Haram"
 LibyaFocus.2.desc: "Several cities in Northern Nigeria have come under attack by Boko Haram militants. There are reports of Boko Haram fighters being accompanied by soldiers speaking in Arabic and dressed in [LBA.GetAdjective] Army uniforms. It seems that the Islamists have launched a combined attack against us."
 LibyaFocus.2.a: "Deus Vult!"
 LibyaFocus.2.b: "Allah Akbar!"
 LibyaFocus.3.t: "Powstania Boko Haram"
 LibyaFocus.3.desc: "Several cities in Northern Nigeria have come under attack by Boko Haram militants due to our agitation. Now is the time to push across the border and help our Islamic brothers."
 LibyaFocus.3.a: "Dalej do Lagos!"
 LibyaFocus.4.t: "1:1 – Instrument Rządu"
 LibyaFocus.4.desc: "Oryginalna Zielona Księga żąda ustanowienia demokracji bezpośredniej poprzez kongresy ludowe, aby zapewnić ludziom kontrolę nad krajem. Jednak w praktyce polityka jest narzucana z góry, a kongresy działają jak iluzja. Zastanawiając się nad obecną konkurencją pomiędzy Generalnym Kongresem Ludowym a Komitetami Rewolucyjnymi, [LBA.GetLeader] chwyta za pióro i pisze..."
 LibyaFocus.4.a: "„Naród musi mieć bezpośrednią kontrolę nad swoim zarządzaniem, w przeciwnym razie…”"
 LibyaFocus.4.b: "„Muszą istnieć pluralistyczne frakcje, aby zapewnić debatę polityczną na złożone tematy…”"
 LibyaFocus.4.c: "„Ponieważ ludzie nie są ekspertami w swoich dziedzinach, kluczowe wybrane osoby muszą działać…”"
 LibyaFocus.5.t: "1:3 - Partia"
 LibyaFocus.5.desc: "W obecnej sytuacji politycznej partie polityczne w Libii są zakazane (nieliczne działają w podziemiu). Zamiast tego zachęca się ludzi do działania na poziomie lokalnym wraz z lokalnym Kongresem Ludowym. Być może w przyszłości..."
 LibyaFocus.5.a: "„Ludzie muszą zjednoczyć się w związkach ludowych lub partiach, aby uzyskać zbiorową siłę…”"
 LibyaFocus.5.b: "„Kongresy Ludowe muszą odgrywać w ludziach większą rolę i być główną drogą…”"
 LibyaFocus.5.c: "„Należy wyeliminować podziemną trzecią kolumnę, aby nie podważać wiarygodności ludu…”"
 LibyaFocus.6.t: "1:8 – Kto Nadzoruje Zachowanie Społeczeństwa?"
 LibyaFocus.6.desc: "Libyan policing is two-fold; there is the normal police, but there are also the Revolutionary Committees that hire regular citizens as informants. There is much political control over the country, but is this the right way for Libya? Well, according to [LBA.GetLeader]..."
 LibyaFocus.6.a: "„Ludzie muszą sami się pilnować, bo tylko oni wiedzą, jak chcą być traktowani…”"
 LibyaFocus.6.b: "„Tak jak pies stróżujący obserwuje swojego właściciela, tak właściciel musi stróżować za psem stróżującym…”"
 LibyaFocus.6.c: "„Komitet Rewolucyjny składa się z ludu i dla ludu, dlatego…”"
 LibyaFocus.7.t: "1:10 – Prasa"
 LibyaFocus.7.desc: "Prasa libijska jest silnie kontrolowana przez rząd. Choć podstawową ideą jest moderowanie treści w prasie przez Komitety Ludowe, w rzeczywistości tak się nie dzieje. Z pewnością, jeśli chodzi o prasę..."
 LibyaFocus.7.a: "„Ludzie muszą mieć władzę wyrażania własnej opinii i komentowania społeczeństwa…”"
 LibyaFocus.7.b: "„Osoby indywidualne mogą zgłaszać swoje uwagi Komisji, która zadba o to, aby nie zaszkodzić…”"
 LibyaFocus.7.c: "„Ponieważ komisje składają się z ludzi, znają już opinie…”"
 LibyaFocus.8.t: "2:13 - Mieszkania"
 LibyaFocus.8.desc: "Od rewolucji Kaddafiego własność domów została ograniczona do jednego na osobę, a wszystkie domy na wynajem są własnością rządu. Ma to zapobiec wynajmowaniu domów i przekształcaniu mieszkań w towar. Gdy [LBA.GetLeader] podziwia miasto z okna pałacu prezydenckiego w Trypolisie, w jego głowie pojawia się pomysł..."
 LibyaFocus.8.a: "„Człowiek musi być w stanie kupić drugi dom, aby zapewnić bliźniemu tanie mieszkanie…”"
 LibyaFocus.8.b: "„Dobrze, że rząd może zapewnić tanie mieszkania, żaden właściciel nie powinien…”"
 LibyaFocus.8.c: "„Aby wyrównać bogactwo między ludźmi, rozsądne byłoby, gdyby państwo posiadało wszystko…”"
 LibyaFocus.9.t: "2:14 – Dochód"
 LibyaFocus.9.desc: "Chociaż Zielona Księga wzywa do wspólnej własności przedsiębiorstw, która następnie zapewnia pieniądze wszystkim pracownikom, w praktyce w kraju wciąż jest mnóstwo własności prywatnej i pracowników najemnych. Po niedawnej wizycie w zakładzie produkcyjnym [LBA.GetLeader] chodziło mu po głowie jedno pytanie; Czy człowiek nie ma prawa pocić się na czole?"
 LibyaFocus.9.a: "„Nie” – mówi mieszkaniec Waszyngtonu – „To należy do biednych”"
 LibyaFocus.9.b: "„Nie” – mówi mężczyzna w Watykanie – „To należy do Boga”"
 LibyaFocus.9.c: "„Nie” – mówi mężczyzna w Moskwie. „To należy do wszystkich”"
 LibyaFocus.10.t: "2:16 – Grunt"
 LibyaFocus.10.desc: "Wkrótce po wprowadzeniu zakazu własności prywatnej wielu domów, w 1986 r. zakazano całkowicie posiadania gruntów (co przypadkowo miało miejsce w tym samym czasie, gdy spalił się urząd rejestru gruntów i cała jego dokumentacja). Oznacza to, że cała ziemia w Libii jest nominalnie własnością państwa, a majątek został tu i tam rozdzielony. Po niedawnym spotkaniu z przywódcami plemiennymi myśli [LBA.GetLeader] krążą mu po głowie, gdy idzie spać…"
 LibyaFocus.10.a: "'Surely a hard working man should be allowed to own the land he spends his days working...'"
 LibyaFocus.10.b: "„Lepiej jest, aby państwo rozdawało ziemię, aby zapobiec waśniom plemiennym…”"
 LibyaFocus.10.c: "Może powinniśmy zacząć od nowa. Jutro muszę przygotować projekt nowej ustawy o konfiskacie ziemi..."
 LibyaFocus.11.t: "3:21 – Zasługi plemienia"
 LibyaFocus.11.desc: "Kaddafi udobruchał plemiona libijskie, podkreślając ich znaczenie dla budowania społeczeństwa. Stoi to jednak w sprzeczności z jego wyobrażeniami o narodzie libijskim i konieczności budowania wspólnej tożsamości oraz kontroli obywateli przez państwo. Ostatecznie trzeba wybrać stronę, ponieważ Libia nie może posunąć się naprzód w obliczu rywalizacji między plemieniem a narodem. Aby rozwiązać ten problem, [LBA.GetLeader] pomyślał o następujących kwestiach..."
 LibyaFocus.11.a: "„Plemię to rodzina dowolnej osoby. Tylko plemię może dać niezbędne cechy…”"
 LibyaFocus.11.b: "„Chociaż słuchanie starszych jest ważne, trzeba być także gotowym służyć państwu…”"
 LibyaFocus.11.c: "„Państwo musi odciągnąć ludzi od feudalnej przeszłości, aby ich wyzwolić. Sługa..."
 LibyaFocus.12.t: "3:24 – Mniejszości"
 LibyaFocus.12.desc: "Libya is predominantly Arab, with a small minority of Tuaregs and Toubou in the South of the country. As such, the Green Book's declaration of protecting minorities is an easy one to make, as in Libya they can almost be ignored. The minorities in Libya are doing considerably worse than the majority population, and it seems that the Green Book has failed. As he is touring the country side in the back seat of his limousine, [LBA.GetLeader] scribbles on a piece of paper..."
 LibyaFocus.12.a: "„Mniejszości, które nie mają narodu, powinny być mile widziane, abyśmy mogli zaoferować im naród…”"
 LibyaFocus.12.b: "„Mniejszość musi wyznaczyć własną ścieżkę. Jeśli takie jest ich przeznaczenie, zostanie zbudowany naród…”"
 LibyaFocus.12.c: "„Jest miejsce tylko dla jednego narodu. Mniejszości nieposiadające żadnego narodu kompromitują nasz naród…”"
 LibyaFocus.13.t: "3:25 – Czarni będą panować na świecie"
 LibyaFocus.13.desc: "Po tym, jak [LBA.GetLeader] kończy czytać swojemu doradcy rozdział starej Zielonej Księgi, szczegółowo opisujący, w jaki sposób Czarni będą kontrolować Ziemię w miarę szybkiego rozmnażania się z powodów kulturowych i niestosowania ochrony, oraz w jaki sposób gorący afrykański klimat zmusza ich do dewaluacji pracy , spotyka się z zdezorientowanym spojrzeniem. Po niezręcznej ciszy pomiędzy doradcą a nim, gdy doradca ma już mówić, [LBA.GetLeader] przerywa im i mówi..."
 LibyaFocus.13.a: "„Może to tylko moje wrażenie, ale wydaje mi się, że to brzmi trochę rasistowsko…”"
 LibyaFocus.13.b: "„No cóż, nie jestem rasistą. Ale...'"
 LibyaFocus.13.c: "„Teraz jestem rasistą. Ale...'"
 LibyaFocus.14.t: "3:28 – Sport, jazda konna i scena"
 LibyaFocus.14.desc: "The Green Book encourages citizens to actively take part in sports and entertainment, rather than just simply consuming them. Especially football is a popular pastime in the country. While people taking part in sports is definitely good for the national health, not having a monetised and profitable sports sector does hurt our bottom line. After watching the Al-Ittihad Football Club win yet another Premier League, [LBA.GetLeader] enjoyed a wild night of partying to celebrate. As he lies in bed contemplating his hangover, watching the morning news and enjoying pizza, something the news anchor says starts to click..."
 LibyaFocus.14.a: "„My, Libijczycy, jesteśmy pasjonatami piłki nożnej. Może na tyle namiętny, żeby zapłacić za to więcej…”"
 LibyaFocus.14.b: "„Ciekawe, jaka będzie dzisiaj pogoda…”"
 LibyaFocus.14.c: "„Po co siedzieć i patrzeć, jak inni grają, skoro mogę grać? Gdzie są moje buty...'"
 LibyaFocus.15.t: "Zamordowano libijską rodzinę królewską"
 LibyaFocus.15.da: "Libyan Royal Family has been assassinated!\n\nAs the family was having a yearly reunion party in London, an explosive device was set off under one of the dinner tables. Destroying most of the floor of the building, Crown Prince Mohammed and his cousin Ahmed were caught in the direct blast. A pretender to the throne, Idris, died of his wound later in the hospital, while his son Khaled was already dead when the emergency services arrived on scene. Several civilians were also killed and injured in the explosion.\n\nScotland Yard is already investigating the case, and our security services have announced that they had identified the perpetrator, but had no time to warn the British authorities of the threat."
 LibyaFocus.15.db: "Libijska rodzina królewska została zamordowana!\n\nGdy rodzina wychodziła z corocznego zjazdu w Londynie, przed budynek zaparkowało kilka czarnych SUV-ów, z których wyskakiwali uzbrojeni zamaskowani mężczyźni. Otworzyli ogień do rodziny królewskiej i według świadków rzucili nawet dwa granaty ręczne. Cała rodzina została zastrzelona, ​​a ochroniarzom królewskim udało się jedynie oddać kilka strzałów w stronę napastników. W ataku zginęło i zostało rannych także kilku cywilów.\n\nScotland Yard prowadzi już dochodzenie w tej sprawie, a nasze służby bezpieczeństwa ogłosiły, że zidentyfikowały sprawcę, ale nie miały czasu ostrzec władz brytyjskich o zagrożeniu."
 LibyaFocus.15.dc: "Libijska rodzina królewska została zamordowana!\n\nNasz agent podłożył bombę w prywatnym odrzutowcu, którym rodzina latała na wakacje. Gdy samolot dotarł do kanału La Manche, bomba eksplodowała. Szczątki eksplozji wylądowały w kanale La Manche i nie mamy żadnych doniesień o osobach, które przeżyły.\n\nWładze brytyjskie prowadzą już dochodzenie w tej sprawie, a nasze służby bezpieczeństwa ogłosiły, że zidentyfikowały sprawcę, ale nie miały czasu ostrzec Brytyjczyków władzom zagrożenia."
 LibyaFocus.15.dd: "Libijska rodzina królewska została zamordowana!\n\nKiedy rodzina królewska wyjeżdżała na wakacje prywatnym odrzutowcem, nasz agent ogłuszył pilota i przebrał się w jego ubranie. Kiedy wszedł do samolotu, rodzina nawet nie spojrzała w jego stronę. Zamknął drzwi do kokpitu, a gdy już przelecieli nad kanałem La Manche, dzielny męczennik wrzucił samolot do morza. Jak dotąd nie otrzymaliśmy żadnych raportów o ocalałych.\n\nWładze brytyjskie już badają sprawę, a nasze służby bezpieczeństwa ogłosiły, że zidentyfikowały sprawcę, ale nie miały czasu ostrzec władz brytyjskich o zagrożeniu."
 LibyaFocus.15.a: "Miejmy nadzieję, że to kupią"
 LibyaFocus.16.t: "Zamordowano libijską rodzinę królewską"
 LibyaFocus.16.da: "Libyan Royal Family has been assassinated!\n\nAs the family was having a yearly reunion party in London, an explosive device was set off under one of the dinner tables. Destroying most of the floor of the building, Crown Prince Mohammed and his cousin Ahmed were caught in the direct blast. A pretender to the throne, Idris, died of his wound later in the hospital, while his son Khaled was already dead when the emergency services arrived on scene. Several civilians were also killed and injured in the explosion.\n\nScotland Yard is already investigating the case, and the Libyan security services have announced that they had identified the perpetrator, but had no time to warn the British authorities of the threat."
 LibyaFocus.16.db: "Libijska rodzina królewska została zamordowana!\n\nGdy rodzina wychodziła z corocznego zjazdu w Londynie, przed budynek zaparkowało kilka czarnych SUV-ów, z których wyskakiwali uzbrojeni zamaskowani mężczyźni. Otworzyli ogień do rodziny królewskiej i według świadków rzucili nawet dwa granaty ręczne. Cała rodzina została zastrzelona, ​​a ochroniarzom królewskim udało się jedynie oddać kilka strzałów w stronę napastników. W ataku zginęło i zostało rannych także kilku cywilów.\n\nScotland Yard prowadzi już dochodzenie w tej sprawie, a libijskie służby bezpieczeństwa ogłosiły, że zidentyfikowały sprawcę, ale nie miały czasu ostrzec władz brytyjskich o zagrożeniu."
 LibyaFocus.16.dc: "Libijska rodzina królewska została zamordowana!\n\nGdy ich prywatny odrzutowiec leciał nad kanałem La Manche w kierunku wakacyjnego miejsca, eksplozja rozerwała samolot na kawałki. Najprawdopodobniej przyczyną wybuchu była bomba podłożona w samolocie. Szczątki eksplozji wylądowały w kanale La Manche i jak dotąd nie odnaleziono nikogo, kto przeżył.\n\nWładze brytyjskie prowadzą już śledztwo w tej sprawie, a libijskie służby bezpieczeństwa ogłosiły, że zidentyfikowały sprawcę, ale nie miały czasu ostrzec władz brytyjskich o zagrożeniu."
 LibyaFocus.16.dd: "Libyan Royal Family has been assassinated!\n\nAs their private jet was flying over the English Channel on its way to a holiday destination, the plane stopped responding to radio calls and turned off its transponder. A few minutes later, the plane plummeted into the ocean. So far we have seen no reports of survivors. The reason for the crash is still unclear, but the pilot of the plane was found knocked out at the airport, meaning whoever was flying the plane wasn't supposed to be doing so.\n\nThe British authorities are already investigating the case, and the Libyan security services have announced that they had identified the perpetrator, but had no time to warn the British authorities of the threat."
 LibyaFocus.16.a: "Czy to już koniec Lockerbie?"
 LibyaFocus.17.t: "Nieudane zabójstwo libijskiej rodziny królewskiej"
 LibyaFocus.17.da: "Zabójstwo nie powiodło się!\n\nPonieważ rodzina organizowała coroczne przyjęcie w Londynie, nasz agent miał przemycić bombę podczas kolacji w przebraniu służącej. Nie wziął pod uwagę wykrywacza metalu przy drzwiach, który włączył się, bo miał ukrytą broń palną. Agent próbował ratować sytuację, wyciągając pistolet, ale szybko został postrzelony przez ochroniarzy.\n\nScotland Yard prowadzi już dochodzenie w tej sprawie, a nasze służby bezpieczeństwa ogłosiły, że zidentyfikowały sprawcę, ale nie miały czasu ostrzec władze brytyjskie o zagrożeniu."
 LibyaFocus.17.db: "Zabójstwo nie powiodło się!\n\nKiedy rodzina opuszczała coroczne spotkanie zjazdowe w Londynie, przed budynek zaparkowało kilka czarnych SUV-ów, z których wyskakiwali uzbrojeni zamaskowani mężczyźni. Otworzyli ogień do rodziny królewskiej i według świadków rzucili nawet dwa granaty ręczne. Z jakiegoś niewyjaśnionego powodu żaden członek rodziny nie został trafiony, a po krótkiej wymianie ognia pomiędzy napastnikami a ochroniarzami napastnicy uciekli z policją na ogonie.\n\nScotland Yard prowadzi już dochodzenie w tej sprawie, a nasze służby bezpieczeństwa już ogłosili, że zidentyfikowali sprawcę, ale nie mieli czasu ostrzec władz brytyjskich o zagrożeniu."
 LibyaFocus.17.dc: "Zabójstwo nie powiodło się!\n\nNasz agent miał podłożyć bombę w prywatnym odrzutowcu, którym rodzina leciała na wakacje. Jednak podczas rutynowej kontroli po starcie technik zauważył bombę i wezwano saper. Na szczęście naszemu agentowi udało się uciec, choć policja depcze mu po ogonie.\n\nWładze brytyjskie już prowadzą dochodzenie w tej sprawie, a nasze służby bezpieczeństwa ogłosiły, że zidentyfikowały sprawcę, ale nie miały czasu ostrzec władz brytyjskich o groźba."
 LibyaFocus.17.dd: "Zabójstwo nie powiodło się!\n\nKiedy rodzina królewska wyjeżdżała na wakacje prywatnym odrzutowcem, nasz agent ogłuszył pilota i przebrał się w jego ubranie. Jednak gdy książę koronny witał pilota, z którym wielokrotnie latał, zauważył naszego agenta. Nasz agent został szybko zatrzymany przez ochroniarzy księcia.\n\nWładze brytyjskie już badają sprawę, a nasze służby bezpieczeństwa ogłosiły, że zidentyfikowały sprawcę, ale nie miały czasu ostrzec władz brytyjskich o zagrożeniu."
 LibyaFocus.17.a: "Następnym razem będziemy zatrudniać IRA"
 LibyaFocus.18.t: "Zamach na życie libijskiej rodziny królewskiej"
 LibyaFocus.18.da: "Doszło do udaremnionego zamachu na libijską rodzinę królewską.\n\nPodczas gdy rodzina organizowała coroczne przyjęcie zjazdowe w Londynie, wykrywacz metalu wykrył uzbrojonego sprawcę. Sytuacja szybko przerodziła się w strzelaninę, a później odkryto, że sprawca miał przy sobie również ładunek wybuchowy.\n\nScotland Yard prowadzi już dochodzenie w tej sprawie, a libijskie służby bezpieczeństwa ogłosiły, że zidentyfikowały sprawcę, ale nie nie ma czasu, aby ostrzec władze brytyjskie o zagrożeniu."
 LibyaFocus.18.db: "Doszło do udaremnionego zamachu na libijską rodzinę królewską.\n\nGdy rodzina wychodziła z corocznego zjazdu w Londynie, przed budynek zaparkowało kilka czarnych SUV-ów, z których wyskoczyli uzbrojeni zamaskowani mężczyźni. Otworzyli ogień do rodziny królewskiej i według świadków rzucili nawet dwa granaty ręczne. Z jakiegoś niewyjaśnionego powodu żaden członek rodziny nie został trafiony, a po krótkiej wymianie ognia między napastnikami a ochroniarzami napastnicy uciekli z policją na ogonie.\n\nScotland Yard prowadzi już dochodzenie w tej sprawie, a libijskie służby bezpieczeństwa ogłosili, że zidentyfikowali sprawcę, ale nie mieli czasu ostrzec władz brytyjskich o zagrożeniu."
 LibyaFocus.18.dc: "Doszło do udaremnionej próby zamachu na libijską rodzinę królewską.\n\nKiedy rodzina przygotowywała się do odlotu prywatnym odrzutowcem na wakacje, technik podczas kontroli po starcie znalazł bombę przyczepioną do samolotu. Bomba została rozbrojona przez saperów. Na ten moment nie ma jednak informacji, kto podłożył bombę.\n\nWładze brytyjskie prowadzą już śledztwo w tej sprawie, a libijskie służby bezpieczeństwa ogłosiły, że zidentyfikowały sprawcę, ale nie miały czasu ostrzec władz brytyjskich zagrożenia."
 LibyaFocus.18.dd: "Doszło do udaremnionego zamachu na libijską rodzinę królewską.\n\nKiedy rodzina królewska wylatywała na wakacje swoim prywatnym odrzutowcem, książę koronny zauważył, że ich zwykły pilot został zastąpiony przez kogoś innego, zupełnie bez zapowiedzi. Po krótkim przesłuchaniu mężczyzna został zatrzymany przez strażników księcia i przekazany policji. Prawdziwy pilot został później znaleziony nieprzytomny na lotnisku.\n\nWładze brytyjskie już badają sprawę, a libijskie służby bezpieczeństwa ogłosiły, że zidentyfikowały sprawcę, ale nie miały czasu, aby ostrzec władze brytyjskie o zagrożeniu."
 LibyaFocus.18.a: "Ciekawe kto za tym stoi?"
 LibyaFocus.19.t: "Odkryto powiązania Libii z terroryzmem"
 LibyaFocus.19.d: "Nasze służby bezpieczeństwa zbadały niedawny atak terrorystyczny, którego celem była libijska rodzina królewska. W drodze przesłuchań, śledząc strumienie danych, pieniądze i broń, odkryli powiązania między rządem libijskim a terrorystami. Jest całkiem pewne, że reżim libijski zaaranżował lub przynajmniej sfinansował atak na rodzinę królewską."
 LibyaFocus.19.a: "Żądajcie publicznych przeprosin!"
 LibyaFocus.19.b: "Nie powinniśmy tego dalej eskalować"
 LibyaFocus.20.t: "[ROOT.GetNameDef] żąda publicznych przeprosin"
 LibyaFocus.20.d: "[ROOT.GetNameDef] oskarża nas o zorganizowanie ataku terrorystycznego na libijską rodzinę królewską. Chcą, żebyśmy publicznie przeprosili za incydent i przyznali odszkodowania ofiarom ataku."
 LibyaFocus.20.a: "Musimy przeprosić"
 LibyaFocus.20.b: "Nie zrobiliśmy nic złego!"
 LBA_terror_attack_no_apology_tt: "§RTo może mieć poważne konsekwencje! [FROM.GetNameDef] może uznać to za atak na ich terytorium!§!"
 LibyaFocus.21.t: "Libia przeprasza"
 LibyaFocus.21.d: "Libia zgodziła się publicznie przeprosić za atak terrorystyczny. Zamierzają także wypłacić ofiarom ataku zadośćuczynienie finansowe."
 LibyaFocus.21.a: "Sprawiedliwość!"
 LibyaFocus.22.t: "Libia nie przeprasza"
 LibyaFocus.22.d: "Libia odmówiła przeprosin ani wypłaty odszkodowania za atak terrorystyczny. Wygląda na to, że Libia powraca na ścieżkę wspierania międzynarodowego terroryzmu. Wiele osób w Wielkiej Brytanii wciąż pamięta zamach bombowy w Lockerbie i wielu wzywa, aby Libia dostała nauczkę."
 LibyaFocus.22.a: "Zorganizuj nalot!"
 LibyaFocus.22.b: "To jest atak na nas! Obalić ich!"
 LibyaFocus.22.c: "Nie eskalujmy dalej!"
 ENG_bomb_libya_tt: "§YZbombardujemy obiekt przemysłowy w Libii!§!"
 ENG_attack_libya_tt: "§YNajedziemy Libię, aby obalić jej rząd wspierający terroryzm! Ponieważ zaatakowali nasze terytorium, zostanie to uznane za atak na nas i naszych sojuszników§!"
 LibyaFocus.23.t: "[FROM.GetAdjective] Nalot"
 LibyaFocus.23.d: "After we refused to apologise to the British, we received no further communication from them. This was until one of our radars on the coast detected multiple incoming fighters. [FROM.GetNameDef] sent us a communique stating that in order to prevent us from supporting terrorism, they must take action. While our army personnel bravely tried warding off the fighters with anti-air fire, no hits were scored. The fighters managed to hit and destroy their target."
 LibyaFocus.23.a: "Cholerni imperialiści!"
 LibyaFocus.24.t: "[FROM.GetAdjective] Interwencja"
 LibyaFocus.24.d: "After we refused to apologise to the British, we received no further communication from them. This was until one of our radars on the coast detected multiple incoming fighters. [FROM.GetNameDef] sent us a communique stating that in order to prevent us from supporting terrorism, they must take action. [FROM.GetNameDef] considers our actions an attack against their nation, and in order to prevent further terrorist attacks, our government must be removed from power."
 LibyaFocus.24.a: "Cholerni imperialiści!"
 LibyaFocus.25.t: "Wybór króla"
 LibyaFocus.25.d: "The time has come to choose a king for Libya. The current generally accepted successor to the throne is Mohammed el-Senussi, the grandson of King Idris I's brother. Mohammed's father was nominated by Idris as his heir, as he himself had no children.\n\nMohammed's claim however is disputed by his cousin Idris el-Senussi. Idris has used his vast wealth to lobby several organizations, including several British MPs, to recognise him as the rightful heir.\n\nThere is a third option as well; Ahmed el-Senussi, another cousin of Mohammed. He has made no claims to the throne but he tried to organise a counter coup as soon as Gaddafi took power, which ended with him spending 30 years as a political prisoner, suffering from frequent torture. He has personally fought and persevered against the old regime, and thus would be the perfect symbol for Libya.\n\nWho should we choose?"
 LibyaFocus.25.a: "Mohammed el-Senussi jest prawowitym spadkobiercą!"
 LibyaFocus.25.b: "Idris el-Senussi nas przekonał!"
 LibyaFocus.25.c: "Ahmed el-Senussi to prawdziwy bohater Libii!"
 LibyaFocus.26.t: "[FROM.GetNameDef] żąda autonomii"
 LibyaFocus.26.d: "Rząd [FROM.GetNameDef] twierdzi, że wykorzystujemy nasze mniejszości. Domagają się przyznania tym mniejszościom pełnej autonomii pod ich ochroną. Jak powinniśmy zareagować?"
 LibyaFocus.26.a: "Zaakceptuj ich żądania"
 LibyaFocus.26.b: "To się nigdy nie stanie"
 LibyaFocus.27.t: "[FROM.GetNameDef] Akceptuje żądania"
 LibyaFocus.27.d: "Rząd [FROM.GetNameDef] zgodził się na nasze żądania. To wielkie zwycięstwo ludzkości!"
 LibyaFocus.27.a: "Niesamowity"
 LibyaFocus.28.t: "[FROM.GetNameDef] Odrzuca nasze żądania"
 LibyaFocus.28.d: "Rząd [FROM.GetNameDef] odrzucił nasze żądania zwiększonej autonomii. Wygląda na to, że chcą nadal uciskać nasz naród."
 LibyaFocus.28.a: "Dostaną to, co ich czeka"
 LibyaFocus.29.t: "Wybór skrajni kolejowej"
 LibyaFocus.29.d: "Ponieważ w Libii nie ma istniejących kolei, musimy wybrać szerokość torów, którymi będziemy się kierować. Najbardziej logicznym wyborem byłoby użycie rozstawu normalnotorowego, ponieważ jest on również używany u naszych sąsiadów z Afryki Północnej. Alternatywnie moglibyśmy stworzyć zupełnie nowy miernik libijski. Nadal czerpalibyśmy korzyści z kolei, ale naszym sąsiadom utrudnilibyśmy podbój Libii, gdyby kiedykolwiek się na to zdecydowali."
 LibyaFocus.29.a: "Standardowy rozstaw jest najbardziej logiczny"
 LibyaFocus.29.b: "Libijski miernik brzmi znakomicie!"
 LibyaFocus.30.t: "Znaleziono niewielkie złoże rudy"
 LibyaFocus.30.d: "Po zbadaniu doliny Wadi Ash-Shat nasi poszukiwacze znaleźli tylko kilka miejsc, w których moglibyśmy wydobywać rudę żelaza."
 LibyaFocus.30.a: "To nie jest dokładnie to, czego szukaliśmy."
 LibyaFocus.31.t: "Znaleziono średnie złoże rudy"
 LibyaFocus.31.d: "After exploring the Wadi Ash-Shat' valley, our prospectors have found a decent sized site for a new iron mine. This should increase our iron ore production considerably."
 LibyaFocus.31.a: "Nie dokładnie to, czego chcieliśmy, ale nadal dobre."
 LibyaFocus.32.t: "Znaleziono Motherlode"
 LibyaFocus.32.d: "Plotki są prawdziwe! Pod doliną Wadi Ash-Shat' znajdują się ogromne złoża rudy żelaza! Nie jest tak duży, jak opowiadają historie, ale wciąż jest ogromny. To wspaniały rozwój dla Libii!"
 LibyaFocus.32.a: ":poggy:"
 LibyaFocus.33.t: "Negocjowanie umowy"
 LibyaFocus.33.d: "Zanim wyślemy ofertę do [?LBA_target_of_rail_project.GetNameDef], musimy najpierw zdecydować, co im zaproponujemy. Możemy zaproponować podział kosztów projektu. Alternatywnie możemy zaoferować całkowite opłacenie rachunku. Będzie to dla nas droższe, ale [?LBA_target_of_rail_project.GetNameDef] jest znacznie bardziej prawdopodobne, że się zgodzi."
 LibyaFocus.33.a: "Podziel to 50-50."
 LibyaFocus.33.b: "Jesteśmy w stanie za to wszystko zapłacić."
 LBA_railroad_deal_tt: "Jeśli zaakceptują,\n"
 LibyaFocus.34.t: "[FROM.GetNameDef] oferuje ofertę kolejową"
 LibyaFocus.34.d: "Rząd [FROM.GetAdjective] wystąpił z umową dotyczącą połączenia naszych i ich sieci kolejowych. Może to być lukratywna szansa dla obu naszych krajów."
 LibyaFocus.34.a: "Zgadzam się na umowę."
 LibyaFocus.34.b: "We want nothing to do with them."
 LibyaFocus.35.t: "[FROM.GetNameDef] zaakceptował umowę"
 LibyaFocus.35.d: "The [FROM.GetAdjective] government has accepted the railroad deal we offered."
 LibyaFocus.35.a: "Genialny!"
 LibyaFocus.36.t: "[FROM.GetNameDef] odrzuca transakcję"
 LibyaFocus.36.d: "The [FROM.GetAdjective] government has rejected the railroad deal we offered."
 LibyaFocus.36.a: "Cholera"
 LibyaFocus.37.t: "Wybór naszego dostawcy"
 LibyaFocus.37.d: "Wielokrotnie próbowaliśmy zdobyć broń nuklearną za pośrednictwem stron trzecich, ale nigdy się to nie udało. Aby chronić naszą suwerenność, potrzebujemy broni nuklearnej. Od kogo powinniśmy próbować kupować? Chiny, dysponując ogromnymi zasobami, byłyby w stanie dostarczyć broń w tajemnicy, ale jest mało prawdopodobne, że podejmą ryzyko. Pakistan nie jest w najlepszych stosunkach z nami ani z Zachodem, a ich bliskość umożliwiłaby szybką dostawę. Korea Północna z pewnością pomogłaby nam w walce z Zachodem, ale jest już uważnie obserwowana przez społeczność międzynarodową."
 LibyaFocus.37.a: "Chiny"
 LibyaFocus.37.b: "Pakistan"
 LibyaFocus.37.c: "Korea Północna"
 Libya_buy_nukes_china_tt: "§SZansa akceptacji:§! §Y25%§!\n§RSzansa na odkrycie:§! §Y25%§!"
 Libya_buy_nukes_pakistan_tt: "§SZansa akceptacji:§! §Y50%§!\n§RSzansa na odkrycie:§! §Y50%§!"
 Libya_buy_nukes_north_korea_tt: "§SZansa akceptacji:§! §Y75%§!\n§RSzansa na odkrycie:§! §Y75%§!"
 LibyaFocus.38.t: "[FROM.GetNameDef] Proponuje tajną umowę"
 LibyaFocus.38.d: "The government of [FROM.GetNameDef] has approached us with a deal; they want to purchase one of our nuclear weapons for themselves. Selling nuclear weapons is strictly prohibited by international law. If we are caught selling our nuclear weapons, we might be subject to international sanctions."
 LibyaFocus.38.a: "Możemy podjąć ryzyko"
 LibyaFocus.38.b: "Nie ma mowy"
 LibyaFocus.39.t: "[FROM.GetNameDef] akceptuje naszą ofertę"
 LibyaFocus.39.d: "[FROM.GetName] zgodził się na naszą umowę. Przygotowali broń nuklearną do transportu i powinniśmy ją otrzymać w ciągu kilku tygodni, jeśli nic nie pójdzie nie tak."
 LibyaFocus.39.a: "Świetnie"
 LibyaFocus.40.t: "[FROM.GetNameDef] odrzuca naszą ofertę"
 LibyaFocus.40.d: "[FROM.GetName] has rejected our deal, stating that it poses too much risk and might even be immoral. Lucky for us, they didn't rat us out to the international community."
 LibyaFocus.40.a: "Wstyd"
 LibyaFocus.41.t: "Broń nuklearna dociera bezpiecznie"
 LibyaFocus.41.d: "Zamówiona przez nas broń nuklearna dotarła bezpiecznie do Libii. Bomba atomowa przebrana za sprzęt do odsalania wody podróżowała zwykłym frachtowcem. Wreszcie jesteśmy potęgą nuklearną."
 LibyaFocus.41.a: "Niesamowity"
 Libya_nuclear_deterrent_tt: "§YKraje będą mniej skłonne do okazywania nam wrogości dzięki naszemu nuklearnemu odstraszaniu!§!"
 LibyaFocus.42.t: "Broń nuklearna znaleziona na morzu"
 LibyaFocus.42.d: "Last night we received reports of a possible nuclear device being transported aboard a freighter in the Red Sea. A team of Navy Seals boarded and took control of the vessel. It was confirmed that a nuclear device was on-board. After interrogating the [FROM.GetAdjective] crew, they stated they were heading for Libya. We are not sure of the origin of the weapon, though it had [FROM.GetAdjective] markings on it and the ship had left port from [FROM.GetNameDef] a week prior, making them highly suspect. The weapon is now being transported to the US ready to be decommissioned. How should we respond to this incident?"
 LibyaFocus.42.a: "Broń jest zabezpieczona, zostaw to"
 LibyaFocus.42.b: "Libia posunęła się za daleko, zapłacą!"
 LibyaFocus.42.c: "Libia posunęła się za daleko, oni i ich sojusznicy zapłacą!"
 LibyaFocus.43.t: "Stany Zjednoczone konfiskują broń nuklearną"
 LibyaFocus.43.d: "Stany Zjednoczone odkryły naszą broń nuklearną w połowie dostawy. Zabezpieczyli broń i rozpoczęli transport do Stanów Zjednoczonych w celu utylizacji. Wysłali nam ostrzeżenie, ale tak to zostawili. Wygląda na to, że ich życzliwość nas ocaliła."
 LibyaFocus.43.a: "Uff"
 LibyaFocus.44.t: "Stany Zjednoczone interweniują"
 LibyaFocus.44.d: "Stany Zjednoczone odkryły naszą broń nuklearną w połowie dostawy. Zabezpieczyli broń i rozpoczęli transport do Stanów Zjednoczonych w celu utylizacji. Przesłali nam oficjalny komunikat, że przez nasze działania stanowimy zagrożenie dla pokoju na świecie. Jest prawdopodobne, że teraz będą próbowali obalić nasz rząd."
 LibyaFocus.44.a: "Cholera"
 LibyaFocus.45.t: "Stany Zjednoczone nakładają na nas sankcje"
 LibyaFocus.45.d: "Stany Zjednoczone odkryły, że nasza broń nuklearna zmierza do Libii w połowie transportu. Zabezpieczyli broń i rozpoczęli transport do Stanów Zjednoczonych w celu utylizacji. Z powodu naszych działań mających na celu pomoc innemu krajowi w zdobyciu broni nuklearnej oni i ich sojusznicy nałożyli na nas sankcje."
 LibyaFocus.45.a: "Cholera"
 LibyaFocus.46.t: "[FROM.GetNameDef] Chce kupić broń"
 LibyaFocus.46.d: "Rząd [FROM.GetAdjective] zwrócił się do nas z umową. Chcą zacieśnić z nami współpracę wojskową, kupując broń [ROOT.GetAdjective]. Pozwoliłoby nam to zwiększyć nasze wpływy w Libii."
 LibyaFocus.46.a: "Oczywiście"
 LibyaFocus.46.b: "Nie możemy"
 LibyaFocus.47.t: "[FROM.GetNameDef] akceptuje naszą ofertę"
 LibyaFocus.47.d: "[FROM.GetNameDef] zaakceptował naszą prośbę o zakup od nich broni."
 LibyaFocus.47.a: "Świetnie"
 LibyaFocus.48.t: "[FROM.GetNameDef] odrzuca naszą ofertę"
 LibyaFocus.48.d: "[FROM.GetNameDef] odrzucił naszą prośbę o zakup od nich broni."
 LibyaFocus.48.a: "Cholera"
 LibyaFocus.49.t: "[FROM.GetNameDef] Dołącza do USAID"
 LibyaFocus.49.d: "[FROM.GetNameDef] dołączył do programu USAID."
 LibyaFocus.49.a: "Dobra"
 LibyaFocus.50.t: "[FROM.GetNameDef] Żąda odszkodowań"
 LibyaFocus.50.d: "[FROM.GetAdjective] government has contacted us and are demanding reparations for the damages done by colonial rule. There have been discussions in Italy (and in other Western countries) of reparations, but nothing has been paid so far. Compensating Libya for colonial damages would make us the first country in the world to do so, which could boost our image. Some government officials are advising that we should instead have some kind of mutual agreement with Libya in exchange for these reparations."
 LibyaFocus.50.a: "Zapłać odszkodowania"
 LibyaFocus.50.b: "Potrzebujemy czegoś w zamian"
 LibyaFocus.50.c: "Nie dostaną ani centa z naszych pieniędzy"
 LibyaFocus.50_tt: "§GZaoferujemy [FROM.GetNameDef] odszkodowania, jeśli zgodzą się współpracować z nami w celu powstrzymania nielegalnej imigracji na Morzu Śródziemnym§!\nJeśli [FROM.GetNameWithFlag] się zgodzi, to\n"
 LibyaFocus.51.t: "[FROM.GetNameDef] Płaci odszkodowania"
 LibyaFocus.51.d: "Rząd [FROM.GetAdjective] zgodził się zapłacić odszkodowania za swoje rządy kolonialne. W ramach bezpośredniego odszkodowania zostanie wypłacone 5 miliardów dolarów, a osobom poszkodowanym w wyniku pozostałości kolonializmu zostanie objęta opieką medyczną. To czyni Włochy pierwszą starą potęgą kolonialną, która zapłaciła odszkodowanie za swoje rządy kolonialne."
 LibyaFocus.51.a: "Są przykładem dla mocarstw zachodnich"
 LibyaFocus.52.t: "[FROM.GetNameDef] odmawia zapłaty"
 LibyaFocus.52.d: "Rząd [FROM.GetAdjective] odmówił zapłaty za szkody spowodowane przez kolonializm. Według nich dzisiejsze Włochy nie są odpowiedzialne za wczorajsze Włochy."
 LibyaFocus.52.a: "dranie"
 LibyaFocus.53.t: "[FROM.GetNameDef] Proponuje współpracę"
 LibyaFocus.53.d: "Po zażądaniu odszkodowań od [FROM.GetNameDef] ich rząd zaproponował kontrofertę; Są gotowi zapłacić odszkodowania, jeśli zgodzimy się współpracować z nimi w celu ograniczenia nielegalnej imigracji do Europy. Obejmowałoby to wspólne patrole z włoską marynarką wojenną na wybrzeżu Libii i wykorzystanie europejskich satelitów do monitorowania naszych granic lądowych."
 LibyaFocus.53.a: "Wydaje się, że to uczciwy układ"
 LibyaFocus.53.b: "Po prostu znowu chcą nas wykorzystać"
 LibyaFocus.54.t: "[FROM.GetNameDef] Akceptuje naszą kontrpropozycję"
 LibyaFocus.54.d: "[FROM.GetNameDef] zgodził się na naszą umowę mającą na celu ograniczenie nielegalnej imigracji na Morzu Śródziemnym."
 LibyaFocus.54.a: "Świetnie"
 LibyaFocus.55.t: "[FROM.GetNameDef] Odrzuca naszą kontrpropozycję"
 LibyaFocus.55.d: "[FROM.GetNameDef] odrzucił naszą umowę mającą na celu ograniczenie nielegalnej imigracji w regionie Morza Śródziemnego."
 LibyaFocus.55.a: "Cholera"
 LibyaFocus.56.t: "[FROM.GetNameDef] Wspiera naszą niezależność"
 LibyaFocus.56.d: "[FROM.GetNameDef] potwierdziło swoje poparcie dla naszej niepodległości od Maroka i zasygnalizowało, że chce w przyszłości jeszcze ściślej z nami współpracować."
 LibyaFocus.56.a: "Świetnie"
 LibyaFocus.57.t: "[FROM.GetNameDef] Opuszcza nas"
 LibyaFocus.57.d: "[FROM.GetNameDef] wycofało swoje poparcie dla naszej niepodległości. Wspierają nas od dziesięcioleci, ale wygląda na to, że teraz nas opuścili, aby osiągnąć lepsze stosunki z Marokiem."
 LibyaFocus.57.a: "Zdrajcy!"
 LibyaFocus.58.t: "[FROM.GetNameDef] Organizuje konferencję pokojową"
 LibyaFocus.58.d: "[FROM.GetNameDef] has organised a peace conference, calling it the Casablanca Accords. Their goal is to create a lasting peace solution to the existing conflict in Western Sahara. We have been asked to send a delegation to their conference."
 LibyaFocus.58.a: "Wyślij delegację"
 LibyaFocus.59.t: "Wybór planu pokojowego"
 LibyaFocus.59.d: "Musimy opracować rozwiązanie konfliktu w Saharze Zachodniej. Zasadniczo istnieją cztery prawidłowe opcje:\n\n1. Aneksja Sahary Zachodniej przez Maroko\n2. Ograniczona autonomia Sahary Zachodniej\n3. Pełna niepodległość Sahrawi\n4. Połączenie obszaru z Mauretanią."
 LibyaFocus.59.a: "Sahara Zachodnia powinna być częścią Maroka"
 libya_western_sahara_peace_plan_annexation_tt: "§YTa opcja jest preferowana przez [MOR.GetNameWithFlag], ale inni najprawdopodobniej będą się jej sprzeciwiać§!"
 LibyaFocus.59.b: "Sahara Zachodnia powinna mieć ograniczoną autonomię"
 libya_western_sahara_peace_plan_autonomy_tt: "§YJest to rozwiązanie kompromisowe, do zaakceptowania którego można wpłynąć na wszystkie strony§!"
 LibyaFocus.59.c: "Sahara Zachodnia powinna być niepodległa"
 libya_western_sahara_peace_plan_independence_tt: "§YTa opcja jest preferowana przez [SHA.GetNameWithFlag] i [ALG.GetNameWithFlag], ale [MOR.GetNameWithFlag] najprawdopodobniej będzie jej przeciwna§!"
 LibyaFocus.59.de: "Dołącz do Sahary Zachodniej z Mauretanią"
 libya_western_sahara_peace_plan_mauritania_tt: "§YThis option will most likely be opposed by all except a nationalist [MAU.GetNameWithFlag]§!"
 LibyaFocus.60.t: "[FROM.GetNameDef] Prosi o nasze wsparcie dla ich planu pokojowego"
 LibyaFocus.60.da: "[FROM.GetName] prosi o nasze wsparcie dla ich planu pokojowego dla Sahary Zachodniej. Ich plan zakłada przyłączenie całego regionu do Maroka. Czy możemy to wesprzeć?"
 LibyaFocus.60.db: "[FROM.GetName] prosi o nasze wsparcie dla ich planu pokojowego dla Sahary Zachodniej. Ich plan zakłada, że ​​Sahara Zachodnia stanie się autonomiczną częścią Maroka. Czy możemy to wesprzeć?"
 LibyaFocus.60.dc: "[FROM.GetName] prosi o nasze wsparcie dla ich planu pokojowego dla Sahary Zachodniej. Ich plan zakłada uniezależnienie się Sahary Zachodniej od Maroka. Czy możemy to wesprzeć?"
 LibyaFocus.60.dd: "[FROM.GetName] prosi o nasze wsparcie dla ich planu pokojowego dla Sahary Zachodniej. Ich plan zakłada przyłączenie Sahary Zachodniej do Mauretanii. Czy możemy to wesprzeć?"
 LibyaFocus.60.a: "Możemy zaakceptować ten plan"
 LibyaFocus.60.b: "To jest dla nas nie do przyjęcia"
 LibyaFocus.60.c: "Ta konferencja nie ma sensu, wycofajcie naszą delegację"
 LibyaFocus.61.t: "[FROM.GetNameDef] Akceptuje plan pokojowy"
 LibyaFocus.61.d: "[FROM.GetNameDef] zaakceptował nasze rozwiązanie konfliktu w Saharze Zachodniej."
 LibyaFocus.61.a: "Świetnie"
 LibyaFocus.62.t: "[FROM.GetNameDef] Odrzuca plan pokojowy"
 LibyaFocus.62.d: "[FROM.GetNameDef] odrzucił nasze rozwiązanie konfliktu w Saharze Zachodniej."
 LibyaFocus.62.a: "Cholera"
 LibyaFocus.63.t: "[FROM.GetNameDef] Opuszcza konferencję pokojową"
 LibyaFocus.63.d: "Delegacja [FROM.GetAdjective] ogłosiła, że ​​opuści porozumienia z Casablanki. Oświadczyli, że nasze żądania pokoju są śmieszne i nie mają już interesu, aby brać w nich udział."
 LibyaFocus.63.a: "Cholera"
 LibyaFocus.64.t: "[FROM.GetNameDef] żąda autonomii Krety"
 LibyaFocus.64.d: "Rząd [FROM.GetAdjective] oświadczył, że jest zaniepokojony naszą pozycją na Krecie. Według nich nasza ścisła kontrola nad wyspą zagraża ich bezpieczeństwu. Domagają się przyznania Krecie ograniczonej autonomii, aby zapewnić naszą ograniczoną obecność wojskową i polityczną na tym obszarze."
 LibyaFocus.64.a: "Chyba możemy"
 LibyaFocus.64.b: "To niedorzeczne"
 LibyaFocus.65.t: "[FROM.GetNameDef] Akceptuje"
 LibyaFocus.65.d: "Rząd [FROM.GetAdjective] zaakceptował nasze żądania zwiększenia autonomii narodu kreteńskiego."
 LibyaFocus.65.a: "Powodzenie"
 LibyaFocus.66.t: "[FROM.GetNameDef] Odrzuca"
 LibyaFocus.66.d: "Rząd [FROM.GetAdjective] odrzucił nasze żądania zwiększenia autonomii narodu kreteńskiego."
 LibyaFocus.66.a: "Będą tego żałować"
 LibyaFocus.66.b: "Będziemy czekać na swój czas"
 LibyaFocus.67.t: "Hamas rozpoczyna nową intifadę"
 LibyaFocus.67.d: "Hamas wywołał nową intifadę przeciwko nam. Obserwujemy wzmożone ruchy bojowników Hamasu i już doszło do kilku demonstracji przeciwko naszym rządom nad Palestyną. Mamy doniesienia, że ​​Libia może stać za uzbrojeniem i motywowaniem Hamasu do tej nowej kampanii."
 LibyaFocus.67.a: "Będą tego żałować"
 LibyaFocus.68.t: "[FROM.GetNameDef] Sponsoruje nową intifadę"
 LibyaFocus.68.d: "[FROM.GetAdjective] wysłało nam broń i pieniądze, abyśmy mogli rozpocząć nową Intifadę przeciwko Izraelowi. Mamy już kolejkę nowych rekrutów w pobliżu naszych biur, a ludzie mobilizują się, aby protestować przeciwko izraelskim okupantom."
 LibyaFocus.68.a: "Dziękujemy Libii"
 LibyaFocus.69.t: "Hamas powstaje"
 LibyaFocus.69.d: "Otrzymujemy doniesienia o tym, że bojownicy Hamasu przejmują kluczowe instytucje i budynki w Strefie Gazy. Przysięgli, że Izrael będzie cierpiał z powodu nowej Intifady."
 LibyaFocus.69.a: "Cholera"
 LibyaFocus.69.b: "Uderz ich!"
 LibyaFocus.70.t: "[FROM.GetNameDef] Kontaktuje się z Toubou"
 LibyaFocus.70.d: "Otrzymaliśmy doniesienia, że ​​Libia zaczęła zbroić rebeliantów Toubou na północy naszego kraju. Jeśli Libia dokona inwazji, rebelianci z pewnością przyłączą się do ich sprawy."
 LibyaFocus.70.a: "Niepokojący"
 LibyaFocus.71.t: "[FROM.GetNameDef] Sugeruje wspólne wydobycie"
 LibyaFocus.71.d: "Rząd [FROM.GetAdjective] zaproponował wspólne przedsięwzięcie w zakresie wydobycia uranu w pasie Aouzou. Zapewni to zasoby obu naszym krajom w przyszłości. Jak powinniśmy zareagować?"
 LibyaFocus.71.a: "Świetny pomysł!"
 LibyaFocus.71.b: "Nie obchodzi nas to"
 LibyaFocus.72.t: "[FROM.GetNameDef] akceptuje naszą ofertę"
 LibyaFocus.72.d: "Rząd [FROM.GetAdjective] zaakceptował naszą umowę w sprawie wspólnego wydobycia"
 LibyaFocus.72.a: "Świetnie"
 LibyaFocus.73.t: "[FROM.GetNameDef] odrzuca naszą ofertę"
 LibyaFocus.73.d: "Rząd [FROM.GetAdjective] odrzucił nasze porozumienie w sprawie wspólnego wydobycia"
 LibyaFocus.73.a: "Cholera"
 LibyaFocus.74.t: "[FROM.GetNameDef] Rozpoczyna wydobycie uranu"
 LibyaFocus.74.d: "[FROM.GetNameDef] rozpoczął wydobycie uranu w Strefie Aouzou. Chociaż większość zasobów trafia do nich, my również otrzymujemy niewielką część, a [FROM.GetAdjective] zgodzili się pokryć wszystkie koszty wykopalisk."
 LibyaFocus.74.a: "Dobra"
 LibyaFocus.75.t: "Toubou, powstań"
 LibyaFocus.75.d: "As the [FROM.GetAdjective] forces started moving across the border, several groups of Toubou tribesmen took control of key buildings in some of the bigger towns in Northern Chad with the hopes of welcoming the [FROM.GetAdjective]s as their liberators. The tribesmen are poorly armed and few, but they will cause disruptions in the rear of our lines."
 LibyaFocus.75.a: "Cholera"
 LibyaFocus.76.t: "[FROM.GetNameDef] Sponsoruje bojowników w Darfurze"
 LibyaFocus.76.d: "Otrzymaliśmy raporty o [FROM.GetAdjective] najemnikach przekraczających granicę z Darfurem. Przywożąc ze sobą ciężarówki pełne broni, uzbroili lokalne bojówki w Darfurze. Dzięki ich wsparciu Darfurowie powstali przeciwko nam."
 LibyaFocus.76.a: "Cholera"
 LibyaFocus.77.t: "[FROM.GetNameDef] Wysyła najemników"
 LibyaFocus.77.d: "Libia wysłała oddział elitarnych najemników, aby wstąpili w nasze szeregi na znak dobrej wiary. Tym działaniem chcą zapewnić stabilność naszego reżimu."
 LibyaFocus.77.a: "Bardzo im dziękujemy"
 LibyaFocus.78.t: "Dostawa broni od [FROM.GetNameDef]"
 LibyaFocus.78.d: "Nasz długoletni sponsor [FROM.GetLeader] wysłał nam dostawę broni, aby pomóc nam w naszym konflikcie."
 LibyaFocus.78.a: "Dziękuję, stary przyjacielu"
 LibyaFocus.79.t: "[FROM.GetNameDef] Kampanie dla Mengistu"
 LibyaFocus.79.d: "[FROM.GetNameDef] rozpoczął popularną kampanię wsparcia dla wygnanego dyktatora Mengistu. Próbują przekonać świat, że nie jest on ludobójczym dyktatorem, jakim jest w rzeczywistości."
 LibyaFocus.79.a: "Cholera"
 LibyaFocus.79.b: "Rozpocznij kontr-kampanię!"
 LibyaFocus.80.t: "Współpraca przemysłowa z [FROM.GetNameDef]"
 LibyaFocus.80.d: "[FROM.GetNameDef] zasugerował współpracę naszych dwóch krajów w dziedzinie przemysłu. Razem możemy walczyć z zachodnim imperializmem."
 LibyaFocus.80.a: "Jesteśmy braćmi"
 LibyaFocus.81.t: "[FROM.GetNameDef] Przygotowuje rewolucję"
 LibyaFocus.81.d: "We have reports of soldiers and weapons moving from [FROM.GetNameDef] into our country. They have been contacting opposition members and current projections show they will launch an uprising in three months."
 LibyaFocus.81.a: "Musimy się przygotować"
 LibyaFocus.81.b: "Musimy przeprowadzić atak wyprzedzający!"
 LibyaFocus.82.t: "[FROM.GetNameDef] Organizuje zamach stanu"
 LibyaFocus.82.d: "Nieoczekiwanie w stolicy wylądowało kilka samolotów transportowych. Samoloty szybko wyładowały pojazdy oraz dużą grupę żołnierzy [ROOT.GetAdjective] i [FROM.GetAdjective]. Żołnierze natychmiast zmobilizowali się i zaczęli maszerować w stronę Pałacu Prezydenckiego. Otrzymaliśmy także raporty o uzbrojonych bandytach ubranych w cywilne ubrania, powodujących zamieszanie i przejmujących kontrolę nad budynkami miejskimi w całym kraju. Wygląda na to, że w kraju ma miejsce zamach stanu zapoczątkowany przez [FROM.GetNameDef]."
 LibyaFocus.82.a: "Poddaję się!"
 LibyaFocus.82.b: "Będziemy z nimi walczyć do ostatniego człowieka!"
 LibyaFocus.83.t: "Potyczki w dolinie Nugaal"
 LibyaFocus.83.d: "We have received reports of an exchange of fire on the Puntland-Somaliland border. The area is contentious as both sides claim large areas from each other. Based on the information we have now, soldiers of our neighbour crossed the border, and after a brief exchange of fire, retreated back. Our neighbour is refuting these claims, stating that it was our soldiers who crossed the border. It seems tensions in the region are growing."
 LibyaFocus.83.a: "Przygotuj nasze wojska!"
 LibyaFocus.83.b: "Zapewnij naszych ludzi"
 LibyaFocus.84.t: "Nadchodzi dostawa tajemniczej broni"
 LibyaFocus.84.d: "Do jednego z naszych magazynów trafiło kilka skrzyń wypełnionych amunicją i bronią. Nie mamy pojęcia, skąd pochodzi ta broń, ponieważ jej nie zamawialiśmy. Oznaczenia na skrzyniach są napisane po arabsku i sądząc po manifeście ładunkowym, przeszły one przynajmniej przez port w Dżibuti. Skąd mogły pochodzić?"
 LibyaFocus.84.a: "Kogo to obchodzi?"
 LibyaFocus.85.t: "Potyczki w Ogaden"
 LibyaFocus.85.d: "We have received reports of an exchange of fire on the Somalia-Ethiopia border. The Ogaden region has been contested by both sides due to a mixture of Ethiopian and Somali clans living in the area, and a lack of demarcation of the official state border. Based on the information we have now, soldiers of our neighbour crossed the border, and after a brief exchange of fire, retreated back. Our neighbour is refuting these claims, stating that it was our soldiers who crossed the border. It seems tensions in the region are growing."
 LibyaFocus.85.a: "Przygotuj nasze wojska!"
 LibyaFocus.85.b: "Zapewnij naszych ludzi"
 LibyaFocus.86.t: "Powstanie w Ogaden"
 LibyaFocus.86.d: "Wzrosła aktywność somalijskich rebeliantów w regionie Ogaden. Nie wiemy, skąd wziął się wzmożony napływ broni do regionu, ale lokalni powstańcy wykorzystali tę sytuację. Opór jest stosunkowo lokalny i niski, przynajmniej na razie."
 LibyaFocus.86.a: "Nie stanowią zagrożenia"
 LibyaFocus.87.t: "Wróg przekracza granicę"
 LibyaFocus.87.d: "To się dzieje. Nasz wróg przekroczył granicę i próbuje przejąć kontrolę nad całą Doliną Nugaal."
 LibyaFocus.87.a: "Zmobilizuj wojsko!"
 LibyaFocus.88.t: "Ogaden Somalijczycy powstańcie"
 LibyaFocus.88.d: "The Somali insurgents in Ogaden have intensified their operations and attacked several government buildings and military checkpoints. We have definite evidence that the men and supplies are crossing the border from Somalia, and are being supported by the local governments. It seems that Somali hunger to unite with Ogaden has once again flared. We must extinguish these dreams as soon as possible."
 LibyaFocus.88.a: "Powiedz naszym żołnierzom, żeby zakończyli to powstanie!"
 LibyaFocus.89.t: "[FROM.GetNameDef] Zajmuje Sokotrę"
 LibyaFocus.89.d: "At early hours today, a transport plane of the Libyan military landed on the island of Socotra. The plane unloaded soldiers, who quickly disarmed and detained our confused local military units. As the air and seaports had been secured, ships with heavier equipment started coming in. There has been no explanation or answer from [FROM.GetAdjective] officials."
 LibyaFocus.89.a: "Wypędź ich!"
 LibyaFocus.89.b: "Nie możemy nic z tym zrobić"
 LibyaFocus.90.t: "Aneksja Sahary Zachodniej"
 LibyaFocus.90.d: "The [FROM.GetAdjective] hosted Casablanca accords have resulted in a very favourable resolution from our perspective. The countries partaking in the accords have decided that Western Sahara should be part of Morocco."
 LibyaFocus.90.a: "Świetnie"
 LibyaFocus.91.t: "Autonomia dla Sahary Zachodniej"
 LibyaFocus.91.d: "Porozumienia w Casablance, których gospodarzem był [FROM.GetAdjective], zaowocowały z naszej perspektywy bardzo korzystnym rozwiązaniem. Wszystkie strony zgodziły się, że konflikt powinien zostać rozwiązany poprzez przyznanie Saharyjczykom Zachodnim, czyli Saharyjczykom, ograniczonej autonomii w Maroku."
 LibyaFocus.91.a: "Świetnie"
 LibyaFocus.91.b: "Świetnie"
 LibyaFocus.92.t: "Niepodległość dla Sahary Zachodniej"
 LibyaFocus.92.d: "The [FROM.GetAdjective] hosted Casablanca accords have resulted in Western Sahara gaining full independence from Morocco. In the future, the country will be called the Sahrawi Arab Democratic Republic."
 LibyaFocus.92.a: "Dobra"
 LibyaFocus.92.b: "Świetnie"
 LibyaFocus.93.t: "Sahara Zachodnia dołącza do Mauretanii"
 LibyaFocus.93.d: "Porozumienia w Casablance, w których uczestniczył [FROM.GetAdjective], doprowadziły do ​​aneksji Sahary Zachodniej przez Mauretanię."
 LibyaFocus.93.a: "Dobra"
 LibyaFocus.93.b: "Świetnie"
 LibyaFocus.94.t: "LIFG wpisana na listę terrorystów"
 LibyaFocus.94.d: "Following the terrorist attack against the World Trade Center in the US and the War on Terror waged by the US, the Libyan Islamic Fighting Group has been designated as a terrorist organisation by both the US and UK due to links to Al-Qaeda. LIFG itself has denied any ties to Al-Qaeda, stating that they refused to join the Jihad Osama Bin Laden declared on the West in 1998."
 LibyaFocus.94.a: "Zasługują na to"
 LibyaFocus.94.b: "Musimy współpracować, aby je zniszczyć"
 LibyaFocus.94.c: "To nie może być dobre"
 LibyaFocus.95.t: "Trypolitania ogłasza niepodległość"
 LibyaFocus.95.d: "Rada trypolitańskich przywódców plemiennych ogłosiła, że ​​nie akceptują już władzy państwa nad swoją ziemią. Według nich rząd jasno pokazał, że nie ma na względzie dobra Trypolitanii. Biorąc pod uwagę, że większość naszych sił zbrojnych pochodzi z Trypolitanii, prawdopodobnie wiele z nich zmieni strony. Wraz z nimi idzie jedno z naszych głównych skupisk ludności i pól naftowych. Czy możemy na to pozwolić?"
 LibyaFocus.95.a: "Musimy je zniszczyć"
 LibyaFocus.95.b: "W tej chwili nie możemy nic zrobić"
 LibyaFocus.96.t: "Cyrenajka ogłasza niepodległość"
 LibyaFocus.96.d: "Rada przywódców plemiennych Cyrenajki ogłosiła, że ​​nie akceptują już władzy państwa nad swoją ziemią. Ich zdaniem rząd jasno pokazał, że nie ma na względzie dobra Cyrenajki. Na szczęście większość personelu naszych Sił Zbrojnych pochodzi z Trypolitanii i jest mało prawdopodobne, że wielu z nich przejdzie na stronę cyrenajską. Jednak Cyrenajka posiada prawie połowę naszych zasobów ropy. Czy możemy na to pozwolić?"
 LibyaFocus.96.a: "Musimy je zniszczyć"
 LibyaFocus.96.b: "W tej chwili nie możemy nic zrobić"
 LibyaFocus.97.t: "Fezzan ogłasza niepodległość"
 LibyaFocus.97.d: "Rada przywódców plemiennych Fezzanu ogłosiła, że ​​nie akceptują już władzy państwa nad swoją ziemią. Ich zdaniem rząd jasno pokazał, że nie ma na względzie dobra Fezzana. Na szczęście Fezzan to bardzo słabo zaludniony region i najprawdopodobniej nie będzie dla nas wyzwaniem ich stłumienie. Czy możemy na to pozwolić?"
 LibyaFocus.97.a: "Musimy je zniszczyć"
 LibyaFocus.97.b: "W tej chwili nie możemy nic zrobić"
 LibyaFocus.98.t: "[FROM.GetNameDef] żąda pasa Aouzou"
 LibyaFocus.98.d: "Rząd [FROM.GetAdjective] żąda, abyśmy przywrócili mu kontrolę nad Strefą Aouzou. Prawda jest taka, że ​​ten obszar nigdy nie był ich własnością, a my już daliśmy im lekcję podczas wojny z Toyotą. Czy możemy ich ponownie pokonać?"
 LibyaFocus.98.a: "Nie jesteśmy w stanie walczyć, poddać ziemi"
 LibyaFocus.98.b: "Chad nie kłania się nikomu!"
 LibyaFocus.99.t: "[FROM.GetNameDef] Sends Humanitarian Aid"
 LibyaFocus.99.d: "Rząd [FROM.GetAdjective] przysłał nam duży pakiet pomocy, który ma pomóc nam rozwiązać różne problemy społeczne nękające kraj."
 LibyaFocus.99.a: "Dziękujemy naszym przyjaciołom [FROM.GetAdjective]."
 LibyaFocus.100.t: "[FROM.GetNameDef] oferuje umowę handlową na bawełnę"
 LibyaFocus.100.d: "The [FROM.GetAdjective] government has shown willingness to invest into our cotton industry. In return they want us to sign a trade agreement where a large amount of Chadian cotton would be exported into Libya. This deal has a chance of greatly improving our economic outlook."
 LibyaFocus.100.a: "Oczywiście, że tak"
 LibyaFocus.100.b: "Możemy to zrobić bez nich"
 LibyaFocus.101.t: "[FROM.GetNameDef] wyraża zgodę na naszą umowę handlową"
 LibyaFocus.101.d: "Rząd [FROM.GetAdjective] zgodził się podpisać z nami umowę handlową dotyczącą handlu bawełną."
 LibyaFocus.101.a: "Świetnie"
 LibyaFocus.102.t: "[FROM.GetNameDef] Rejects Our Trade Deal"
 LibyaFocus.102.d: "The [FROM.GetAdjective] government has refused to sign the cotton trade deal with us."
 LibyaFocus.102.a: "W takim razie zainwestujmy pieniądze w [ROOT.GetName]."
 LibyaFocus.102.b: "Przeklnij ich"
 LibyaFocus.103.t: "[FROM.GetNameDef] przejmuje kontrolę nad ropą"
 LibyaFocus.103.d: "Using their influence over our country, the [FROM.GetAdjective] government has somehow managed to convince our Energy Minister to give resource drilling rights to the Libyan National Oil Corporation. Despite heavy objections by other politicians, the minister and Chadian owners of the oil fields were more than happy to give control of the fields. Armed men bearing Libyan uniforms quickly replaced the local Chadian guard units at the oil fields, and it seems they are here to stay."
 LibyaFocus.103.a: "Nie mogę uwierzyć, że tego dokonali"
 LibyaRandomEvents.1.t: "Przetasowanie gabinetu"
 LibyaRandomEvents.1.d: "W roku 2000 Libia dokonała znaczących zmian w strukturze swojego gabinetu. Wymieniono łącznie dwunastu ministrów, w tym premiera (także sekretarza generalnego Generalnego Komitetu Ludowego) i ministra spraw zagranicznych. Rola premiera przeszła z Muhammada Ahmada al-Mangousha na Imbarka Shamekha, wcześniej Ministra Mieszkalnictwa i Usług Komunalnych."
 LibyaRandomEvents.1.a: "Stabilny rząd dla stabilnego narodu"
 LibyaRandomEvents.1.b: "Shamekh będzie świetnym premierem"
 LibyaRandomEvents.1.c: "Zmiana Ministra Spraw Zagranicznych była istotna"
 LibyaRandomEvents.2.t: "Zamieszki przeciwko Czarnym"
 LibyaRandomEvents.2.d: "Libya is a common place for African migrants to end up in. Most of these migrants live in the country illegally without any paperwork. These migrants are often targeted by youth gangs. There has been a flare-up of violence recently, with hundreds of migrant homes burned and dozens killed. Many African countries are blaming the state's security forces for negligence, as no arrests have been made."
 LibyaRandomEvents.2.a: "Obiecaj przeprowadzić odpowiednie dochodzenie"
 LibyaRandomEvents.2.b: "Dokonaj kilku aresztowań na pokaz"
 LibyaRandomEvents.2.c: "Tak się dzieje, gdy przyjeżdżasz tu nielegalnie"
 LibyaRandomEvents.3.t: "Katastrofa samolotu w pobliżu Marsa al-Brega"
 LibyaRandomEvents.3.d: "Dzisiaj w południe samolot Short 360 obsługiwany przez Sirte Oil Company rozbił się w morzu w pobliżu miasta Marsa al-Brega, przewożąc pracowników i ich rodziny z Trypolisu. Firmy naftowe często przewożą pracowników między zakładami a miastami, ponieważ nie istnieje realna alternatywna metoda transportu. Samolotem podróżowało 38 osób, w większości obywateli Libii i Wielkiej Brytanii. 19 z nich przeżyło katastrofę i zostało uratowanych z morza. Samolot rozbił się z powodu awarii obu silników, ale dokładna przyczyna jest nadal nieznana."
 LibyaRandomEvents.3.a: "Musimy zbadać wypadek"
 LibyaRandomEvents.3.b: "Takie rzeczy się zdarzają"
 LibyaRandomEvents.4.t: "Zakończono śledztwo w sprawie katastrofy lotniczej"
 LibyaRandomEvents.4.d: "Zakończono śledztwo w sprawie katastrofy samolotu Marsa al-Brega. Samolot rozbił się z powodu zalanych silników. Samolot przeleciał przez formację chmur, co spowodowało, że w silnikach zebrała się wilgoć i lód. Gdy samolot zmniejszał wysokość, lód stopił się i zalał silniki. Starszy pilot zignorował raporty pogodowe, ponieważ pogoda w Libii „zwykle jest łagodna”. Załoga lotnicza również zaniedbała włączenie systemu przeciwoblodzeniowego, ponieważ rozpraszała ją rozmowa na temat systemu operacyjnego Fokker F28. Ponadto personel pokładowy nie poinformował pasażerów, że ich siedzenia mogą służyć jako urządzenia unoszące się na wodzie. Najprawdopodobniej spowodowało to dodatkowe ofiary śmiertelne w wyniku utonięcia, gdyż samolot nie był wyposażony w kamizelki ratunkowe, które nie są wymagane na krótkich lotach."
 LibyaRandomEvents.4.a: "Powodem było zaniedbanie załogi lotniczej"
 LibyaRandomEvents.4.b: "Nie masz kamizelek ratunkowych? Potrzebujemy lepszych regulacji"
 LibyaRandomEvents.4.c: "Potrzebujemy po prostu lepszych samolotów"
 LibyaRandomEvents.5.t: "Olomby zdobywa Puchar Premier League"
 LibyaRandomEvents.5.d: "History has been made in this year's Premier Cup, the top football cup in Libya; Club Olomby from the city of Zawia has won the league with 57 points, with Al Ittihad from Tripoli in 2nd place with 52 points. What makes this event special is that for the first time in Libya's history, a club that is neither from Tripoli or Benghazi has managed to win the cup. This is truly a historic day for Libyan football."
 LibyaRandomEvents.5.a: "Gratulacje Olomby!"
 LibyaRandomEvents.5.b: "I wish Al Ittihad had won"
 LibyaRandomEvents.5.c: "Al Ahly powinien był wygrać w tym roku"
 LibyaRandomEvents.5.dd: "The surprise should've come from Ascharara"
 LibyaRandomEvents.6.t: "Człowiek, który ratuje gospodarkę"
 LibyaRandomEvents.6.d: "Ponieważ libijska gospodarka cierpi z powodu sankcji międzynarodowych, toczą się dyskusje, czy przywództwo kraju wymaga zmiany. Pojawiają się sugestie, że należy wymienić obecnego premiera. Zalecanym następcą jest Shukri Ghanem, dyrektor ds. marketingu w National Oil Corporation. Ghanem był także dyrektorem ds. badań w OPEC i pracował na kilku stanowiskach w Ministerstwie Ropy Naftowej i Ministerstwie Gospodarki. Czy obecny premier powinien zostać przez niego zastąpiony?"
 LibyaRandomEvents.6.a: "Uczynić Ghanema premierem"
 LibyaRandomEvents.6.b: "Powinniśmy skorzystać z jego wiedzy badawczej"
 LibyaRandomEvents.6.c: "Użyj go jako dźwigni, aby zmotywować obecnego premiera"
 LibyaRandomEvents.7.t: "Wyciek źródła wirówek"
 LibyaRandomEvents.7.d: "Do światowej prasy publicznej wyciekły informacje, że niektóre wirówki przeznaczone dla naszego programu nuklearnego zostały zakupione przy pomocy Pakistanu. Części zostały wyprodukowane w Malezji, a następnie wysłane do Libii przez Dubaj przy pomocy Pakistanu. Źródła podają, że Pakistan prowadził podobne działania z Koreą Północną i Iranem. Urzędnicy pakistańscy oświadczyli, że nie mają wiedzy na temat tych transakcji, a materiałami posługiwali się przestępcy na czarnym rynku. Tak czy inaczej, nadal szkodzi to naszemu publicznemu wizerunkowi."
 LibyaRandomEvents.7.a: "Możemy kupić co chcemy"
 LibyaRandomEvents.7.b: "Nie nabyliśmy niczego nielegalnie!"
 LibyaRandomEvents.7.c: "Świat wie, że naprawiamy błędy z przeszłości"
 LBA_disarmament_public_tt: "Ta opcja jest dostępna, ponieważ ukończyliśmy §Y$LBA_disarmament_program$§!"
 LibyaRandomEvents.8.t: "Oświadczenie Premiera"
 LibyaRandomEvents.8.d: "W wywiadzie dla BBC nasz premier stwierdził, że oferując odszkodowanie ofiarom zamachów bombowych w Lockerbie, Libia „kupiła pokój”, ale nie przyznała się do winy. Zaprzecza to naszym wcześniejszym oświadczeniom, że wzięliśmy na siebie odpowiedzialność za ataki."
 LibyaRandomEvents.8.a: "Premier ma racje"
 LibyaRandomEvents.8.b: "Wydaj oświadczenie potwierdzające"
 LibyaRandomEvents.8.c: "Zwolnić tego kretyna!"
 LibyaRandomEvents.9.t: "Przekazano sprzęt nuklearny"
 LibyaRandomEvents.9.d: "W dzisiejszym komunikacie prasowym Biały Dom potwierdził, że ostatnia część libijskiego sprzętu jądrowego została przekazana Stanom Zjednoczonym. Ostatnia dostawa obejmowała wszystkie części do wirówek, sprzęt do konwersji uranu oraz cały sprzęt do pocisków dalekiego zasięgu i wyrzutni. [LBA.GetLeader] powiedział w wywiadzie dla „Washington Post”, że jest optymistycznie nastawiony do przyszłych relacji ze Stanami Zjednoczonymi, teraz, gdy „mogą rozmawiać”."
 LibyaRandomEvents.9.a: "Wielki krok w kierunku rozbrojenia!"
 LibyaRandomEvents.9.b: "Teraz jesteśmy otwarci na biznes"
 LibyaRandomEvents.10.t: "Pielęgniarki skazane na śmierć"
 LibyaRandomEvents.10.d: "Pięć bułgarskich pielęgniarek i jeden palestyński lekarz zostali skazani na śmierć za celowe zakażanie libijskich dzieci wirusem HIV. Kilka lat temu w szpitalu dziecięcym w Benghazi wybuchła epidemia wirusa HIV. Według sądu pielęgniarki i lekarz zarazili wirusem 426 dzieci w celu znalezienia leku na tę chorobę. Spośród tych dzieci 47 już zmarło. Oskarżeni w dalszym ciągu upierają się, że są niewinni w sprawie, twierdząc, że w chwili ich przybycia do kraju epidemia była już w pełnym rozkwicie i była spowodowana złą higieną w szpitalu. Twierdzą również, że złożyli zeznania dopiero po torturach przez libijską policję.\n\nStany Zjednoczone i UE wywierają presję na Libię, aby uchyliła tę decyzję, posuwając się nawet do zwrócenia się do [LBA.GetLeader] o interwencję. Rodzice dzieci domagają się jednak wyroku śmierci."
 LibyaRandomEvents.10.a: "Jak możemy uwolnić morderców dzieci?"
 LibyaRandomEvents.10.b: "Nie powinniśmy używać ich jako kozłów ofiarnych za brak higieny"
 LibyaRandomEvents.11.t: "Pielęgniarki stracone"
 LibyaRandomEvents.11.d: "Dziś wczesnym rankiem rozstrzelano pięć bułgarskich pielęgniarek i palestyńskiego lekarza. Wokół gmachu sądu zgromadziły się rodziny zmarłych i zakażonych dzieci. Gdy strzały rozległy się na ulicach Bengazi, rozległy się wiwaty."
 LibyaRandomEvents.11.a: "Sprawiedliwość"
 LibyaRandomEvents.12.t: "Sąd Najwyższy uchyla wyrok"
 LibyaRandomEvents.12.d: "The Libyan Supreme Court has overturned the death sentence of the five Bulgarian nurses and the Palestinian doctor. This ruling came just a few days before the execution was supposed to happen. Parents and relatives of the infected children stood outside the supreme court, protesting against the decision and calling for the death penalty to take effect. They are quite dissatisfied with [LBA.GetLeader]'s inability to bring justice."
 LibyaRandomEvents.12.a: "Dlaczego sędziowie nie mogą robić tego, co im każę?"
 LibyaRandomEvents.13.t: "Nowy premier?"
 LibyaRandomEvents.13.d: "Być może po zniesieniu międzynarodowych sankcji nadszedł czas na kolejną zmianę premiera? Świetnym kandydatem byłby obecny wicepremier Baghdadi Mahmudi. Mahmudi posiada wykształcenie medyczne, a wcześniej był ministrem zdrowia i zabezpieczenia społecznego. Ma także doświadczenie w innych ministerstwach. Powiedział nam, że gdyby został premierem, utworzyłby libijski organ ds. inwestycji, który przejmowałby część naszych zysków ze sprzedaży ropy i inwestował je dla przyszłych pokoleń."
 LibyaRandomEvents.13.a: "Utworzenie Libijskiego Urzędu ds. Inwestycji wydaje się świetnym pomysłem"
 LibyaRandomEvents.13.b: "Powinniśmy skorzystać z jego wiedzy badawczej"
 LibyaRandomEvents.13.c: "Nasz obecny premier ma się dobrze"
 LibyaRandomEvents.14.t: "Libia usunięta z listy terrorystów"
 LibyaRandomEvents.14.d: "Departament Stanu USA ogłosił dzisiaj, że Libia zostanie skreślona z listy państw sponsorujących terroryzm. To wielki krok w kierunku poprawy stosunków między Libią a Zachodem."
 LibyaRandomEvents.14.a: "Ameryka jest teraz naszym przyjacielem"
 LibyaRandomEvents.14.b: "W ogóle nie zasłużyliśmy na to, aby znaleźć się na tej liście!"
 LibyaRandomEvents.15.t: "Somalia oskarża nas o wspieranie terrorystów"
 LibyaRandomEvents.15.d: "Rząd Somalii walczący z islamistami oskarżył nas wraz z Egiptem i Iranem o wspieranie islamistów w Somalii. Twierdzą, że dostarczaliśmy broń, podsycając konflikt."
 LibyaRandomEvents.15.a: "Ta broń była przeznaczona dla ciebie"
 LibyaRandomEvents.15.b: "Możemy wysłać naszą broń komukolwiek chcemy"
 LibyaRandomEvents.15.c: "Nikomu nie wysłaliśmy broni"
 LibyaRandomEvents.16.t: "Spotkanie Unii Afrykańskiej"
 LibyaRandomEvents.16.d: "Podczas niedawnego spotkania członków Unii Afrykańskiej [LBA.GetLeader] odbył obchód, omawiając z innymi przywódcami swój plan zjednoczenia Afryki. Pomysł ten nadal budzi pewien opór, gdyż wielu afrykańskich przywódców obawia się, że skupienie się na unii ograniczy zasoby przeznaczone na rozwiązywanie różnych konfliktów na kontynencie. Ponadto wiele sprawozdań zewnętrznych pokazuje, że Unia Afrykańska nawet w swoim obecnym stanie ma kilka nieprawidłowości budżetowych, co podważa zaufanie do Unii."
 LibyaRandomEvents.16.a: "Przynajmniej niektórzy mieli wspólną płaszczyznę porozumienia"
 LibyaRandomEvents.16.b: "Afryka jest wystarczająco silna, aby poradzić sobie z własnymi problemami"
 LibyaRandomEvents.16.c: "Obawy dotyczące korupcji są uzasadnione"
 LibyaRandomEvents.17.t: "[FRA.GetLeader] Wizyta w Libii"
 LibyaRandomEvents.17.d: "Prezydent Francji [FRA.GetLeader] odwiedził Libię w celu poprawy stosunków między obydwoma krajami. Spotykając się z [LBA.GetLeader] w namiocie w Trypolisie, obaj rozmawiali o podpisaniu umowy o współpracy wojskowo-przemysłowej, a także o francuskich firmach naftowych uczestniczących w libijskich polach naftowych."
 LibyaRandomEvents.17.a: "Zapraszamy do współpracy francuski przemysł"
 LibyaRandomEvents.17.b: "O co chodziło z ropą?"
 LibyaRandomEvents.17.c: "A co jeśli zamiast tego zainwestujemy we Francji?"
 LibyaRandomEvents.18.t: "Kupno francuskiej broni"
 LibyaRandomEvents.18.d: "Francuzi dali nam możliwość zakupu rakiet przeciwpancernych i sprzętu komunikacyjnego. Czy powinniśmy przyjąć tę ofertę?"
 LibyaRandomEvents.18.a: "Jasne"
 LibyaRandomEvents.18.b: "Nie masz przypadkiem rakiet przeciwlotniczych?"
 LibyaRandomEvents.18.c: "Nie, dziękuję"
 LibyaRandomEvents.19.t: "Libia wybrana do Rady Bezpieczeństwa ONZ"
 LibyaRandomEvents.19.d: "We have been elected to be a non-permanent member of the UN Security Council for the next two years. This is a great opportunity for us to improve the security of the world. However, this does come with some downsides. Non-permanent members usually see a 60% increase in foreign aid, and the economic growth of non-permanent members tends to be half that of non-members. Some might call this an attempt by the permanent members to influence our decision making."
 LibyaRandomEvents.19.a: "Myślę, że trochę dodatkowych pieniędzy się przyda"
 LibyaRandomEvents.19.b: "Nie zrezygnujemy z naszej integralności dla dużych krajów"
 LibyaRandomEvents.20.t: "Napad na bazę LIFG"
 LibyaRandomEvents.20.d: "Our army has successfully raided a hideout of the Libyan Islamic Fighting Group. Roughly a dozen fighters were killed and none were left as prisoners. We also found a small stockpile of weapons and other military equipment the group was planning to use in a raid against our military outpost."
 LibyaRandomEvents.20.a: "Paradują ich ciała w Trypolisie"
 LibyaRandomEvents.20.b: "Spal ciała, zatrzymaj broń"
 LibyaRandomEvents.21.t: "LIFG dokonuje nalotu na wojskowy punkt kontrolny"
 LibyaRandomEvents.21.d: "One of our military checkpoints has been raided by the LIFG. They charged the checkpoint with a handful of technicals, killing most of the guards there. Some of our soldiers managed to flee before being killed. Once the Islamists were happy with their results, they quickly sped away. Reinforcements from a nearby barracks weren't fast enough to catch them."
 LibyaRandomEvents.21.a: "Jaki tchórz ucieka przed wrogiem!?"
 LibyaRandomEvents.22.t: "LIFG atakuje komisariat policji"
 LibyaRandomEvents.22.d: "LIFG zaatakowała komisariat policji w dużym mieście. W środku dnia włamali się przez frontowe drzwi i doszło do strzelaniny, w której policjanci szybko zostali pokonani. Bojownikom LIFG udało się utrzymać pozycję pomimo kontrataku naszej armii, jednocześnie uwalniając schwytanych członków LIFG z cel. Ostatecznie LIFG wycofała się z komisariatu pod osłoną nocy. Chociaż naszej armii udało się zabić część islamistów, ponieśliśmy także ciężkie straty. Wraz z uwolnieniem bojowników LIFG z więzienia był to dla LIFG pozytywny atak."
 LibyaRandomEvents.22.a: "W środku dnia!?"
 LibyaRandomEvents.23.t: "LIFG zajmuje bazę wojskową"
 LibyaRandomEvents.23.d: "Jedna z naszych baz wojskowych została tymczasowo zajęta przez LIFG. Zaczęli atak od podjechania ciężarówką wypełnioną materiałami wybuchowymi prosto pod główną bramę i wysadzenie jej w powietrze, wywołując zamieszanie wśród naszych żołnierzy. Niedługo potem bojownicy LIFG zaczęli napływać do bazy ze wszystkich stron. Chaos i panika spowodowały, że większość naszych żołnierzy porzuciła swoje pozycje i przekazała bazę islamistom. Siły specjalne zostały wysłane z innej bazy wojskowej i po kilku godzinach oblężenia większość islamistów zginęła, a niektórym udało się uciec. Później LIFG wysłała oświadczenie, w którym stwierdziła, że ​​to dopiero początek i jeśli rząd nie odda im władzy, sami zaatakują [ROOT.GetLeader]."
 LibyaRandomEvents.23.a: "Jak mogą zająć całą bazę wojskową?!"
 LibyaRandomEvents.24.t: "[ROOT.GetLeader] Zamordowany"
 LibyaRandomEvents.24.d: "Stało się najgorsze, co można sobie wyobrazić. Konwój samochodowy [LBA.GetLeader] został nagle zaatakowany przez grupę techników LIFG. Wyposażony w broń strzelecką i ciężką samochód [ROOT.GetLeader] był usiany kulami, dopóki nie otrzymał bezpośredniego trafienia z RPG. Atak został ostatecznie odparty, ale [ROOT.GetLeader] zmarł z powodu odniesionych ran później w szpitalu."
 LibyaRandomEvents.24.a: "To jest okropne"
 LibyaRandomEvents.25.t: "Bojownicy LIFG wracają z wygnania"
 LibyaRandomEvents.25.d: "Ponieważ między państwem a LIFG oficjalnie zapanował pokój, wielu członków LIFG żyjących na wygnaniu wróciło do Libii."
 LibyaRandomEvents.25.a: "Chyba miło?"
 LibyaRandomEvents.26.t: "Uczenie się od weteranów Afganistanu"
 LibyaRandomEvents.26.d: "Many LIFG members fought against the Soviet Union together with the Afghanistan Mujahideen. It would make sense we utilise their expertise whenever possible."
 LibyaRandomEvents.26.a: "Czego dowiedziałeś się o składzie armii?"
 LibyaRandomEvents.26.b: "Czego nauczyłeś się o taktyce?"
 LibyaRandomEvents.27.t: "Straszni rekruci"
 LibyaRandomEvents.27.d: "Many LIFG members fought against the Soviet Union together with the Afghanistan Mujahideen. However, their fighting style and experience isn't exactly up to par on what is required from a modern military. Fanatic loyalty is good, but it can't always replace professionalism."
 LibyaRandomEvents.27.a: "Myślę, że łączysz dobro ze złem"
 LibyaRandomEvents.28.t: "Debata Teologiczna"
 LibyaRandomEvents.28.d: "Członkowie naszej rządzącej grupy salafitów pokłócili się z członkami Bractwa Muzułmańskiego na temat teologii islamskiej. Chociaż zgodziliśmy się na współpracę z Bractwem, istnieją pewne duże różnice ideologiczne. Debata zrobiła się bardzo gorąca, ale na szczęście [ROOT.GetLeader] zdołał przerwać kłótnię, zanim jakiekolwiek buty zaczęły latać."
 LibyaRandomEvents.28.a: "Oczywiście pogląd salaficki jest słuszny"
 LibyaRandomEvents.28.b: "Bractwo ma kilka dobrych stron"
 LibyaRandomEvents.28.c: "Wystarczająco! Ta współpraca dobiegła końca"
 LibyaRandomEvents.29.t: "Wielki Mufti wydaje Fatwę przeciwko kobietom"
 LibyaRandomEvents.29.d: "The Grand Mufti has issued a fatwa against Libyan women marrying foreign men. He also organised a protest with a group of women at the UN headquarters, issuing a 2nd fatwa against the UN Commission on the Status of Women's report because it urges the government to protect women and girls against violence."
 LibyaRandomEvents.29.a: "Haha, kobiety"
 LibyaRandomEvents.30.t: "Wielki Mufti wydaje Fatwę przeciwko wrogom państwa"
 LibyaRandomEvents.30.d: "Wielki Mufti wydał fatwę przeciwko wszelkim wrogom naszej partii rządzącej. Zakazał tworzenia jakiejkolwiek opozycji i stwierdził, że należy wyeliminować wszystkich wrogów państwa."
 LibyaRandomEvents.30.a: "Cieszę się, że jest po naszej stronie"
 LibyaRandomEvents.31.t: "Wielki Mufti protestuje w Arabii Saudyjskiej"
 LibyaRandomEvents.31.d: "Wielki Mufti ogłosił bojkot pielgrzymek i umry w Arabii Saudyjskiej, stwierdzając, że polityka Arabii Saudyjskiej zabija muzułmańskich braci i dzieci."
 LibyaRandomEvents.31.a: "I tak nie chcieliśmy się z nimi przyjaźnić"
 LibyaRandomEvents.32.t: "Wielki Mufti daje zielone światło dla samobójczych zamachów bombowych"
 LibyaRandomEvents.32.d: "In a TV interview today, the Grand Mufti stated that suicide bombings are fully permitted by the Sharia Law. This has upset some of our citizens, as they are getting worried if they will be forced to martyr themselves to defend the state's interests."
 LibyaRandomEvents.32.a: "Nie będziemy nikogo zmuszać do wysadzenia w powietrze"
 LibyaRandomEvents.33.t: "Ochotniczy dżihadyści"
 LibyaRandomEvents.33.d: "Nasza decyzja o ogłoszeniu dżihadu przeciwko Maghrebowi działa na naszą korzyść. Dziesiątki ochotników dołączają do naszej armii i pomagają nam w naszej Świętej Wojnie."
 LibyaRandomEvents.33.a: "We welcome these brothers!"
 LibyaRandomEvents.34.t: "Ludzie uciekają [ROOT.GetNameDef]"
 LibyaRandomEvents.34.d: "Nasza decyzja o ogłoszeniu dżihadu przeciwko Maghrebowi przeraziła część mieszkańców naszych granic. Zaniepokojeni tym, co przyniesie nadchodząca Święta Wojna, ludzie uciekają głównie do Europy, aby uniknąć konfliktu."
 LibyaRandomEvents.34.a: "Nie zasługują na niebo"
 LibyaRandomEvents.35.t: "Nauczyciele protestują przeciwko stronniczej edukacji"
 LibyaRandomEvents.35.d: "Związek nauczycieli zorganizował protest przeciwko niedawnemu przyjęciu przez rząd programu nauczania promującego wartość państwa. Nauczyciele twierdzą, że utrudnia to Libii konkurowanie w globalnym świecie i utrudnia młodym uczniom zrozumienie świata. Niektórzy nauczyciele odmówili nawet nauczania według nowego programu nauczania i trzymają się starego."
 LibyaRandomEvents.35.a: "Zobaczymy, czego nauczą, kiedy zostaną zwolnieni"
 LibyaRandomEvents.35.b: "Niech protestują"
 LibyaRandomEvents.35.c: "Obiecaj im więcej wolności w edukacji"
 LibyaRandomEvents.36.t: "Kobiety protestują przeciwko rządowi"
 LibyaRandomEvents.36.d: "Organizacja kobieca zorganizowała protest przeciwko rządowi. Twierdzą, że polityka rządu jest sprzeczna z tym, co reprezentują libijskie kobiety. Poparcie dla tego protestu jest ograniczone, ale pokazuje, że nie wszystkie kobiety w kraju zgadzają się z naszą polityką i nie boją się tego okazywać."
 LibyaRandomEvents.36.a: "Po prostu ich ignoruj"
 LibyaRandomEvents.37.t: "Kobiety wspierają rząd"
 LibyaRandomEvents.37.d: "Organizacja kobieca zorganizowała wiec poparcia dla rządu. Stwierdzili, że ostatnie zmiany w polityce wobec kobiet nie tylko poprawią status kobiet w Libii, ale pokażą całemu światu, jak kobiety powinny być traktowane."
 LibyaRandomEvents.37.a: "Cóż za odważne kobiety"
 LibyaRandomEvents.38.t: "Wsparcie Baasistów z zagranicy"
 LibyaRandomEvents.38.d: "Our Ba'athist policies are being welcomed with open arms abroad. A group of Ba'athist politicians from a foreign country hosted Libyan Ba'athists in a political meeting. This kind of networking is vital for Ba'athism to rise again."
 LibyaRandomEvents.38.a: "To wspaniale!"
 LibyaRandomEvents.38.b: "Czy pamiętali również o networkingu na LinkedIn?"
 LibyaRandomEvents.39.t: "Protesty przeciwko Baasizmowi"
 LibyaRandomEvents.39.d: "W pobliżu jednej z naszych ambasad za granicą zorganizowano protest. Protestujący skandowali hasła skierowane przeciwko Baasowi, twierdząc, że nasze niedawne poparcie dla Baasu jest po prostu próbą zdominowania innych krajów. Te protesty szkodzą naszym próbom zjednoczenia wszystkich Arabów."
 LibyaRandomEvents.39.a: "Cholera"
 LibyaRandomEvents.39.b: "Staraj się ograniczać szkody"
 LibyaRandomEvents.40.t: "Zielona Księga – Klub Książki"
 LibyaRandomEvents.40.d: "The new Green Book written by Gaddafi is gaining traction. Since its release, it has become a number one seller. It can be commonly found in the backpacks of students and it has even become popular outside of Libya."
 LibyaRandomEvents.40.a: "Dobrze, że ludzie czytają"
 LibyaRandomEvents.41.t: "Klub Koran"
 LibyaRandomEvents.41.d: "The release of the new Green Book hasn't gone without resistance. In several cities, imams have set up book clubs where people can read and rehearse the Quran. It seems that people want to read something more traditional rather than guidelines from the state."
 LibyaRandomEvents.41.a: "Zielona Księga jest lepsza niż Koran"
 LibyaRandomEvents.42.t: "Zielona Księga – Klub Książki"
 LibyaRandomEvents.42.d: "Pomimo naszych prób pozbycia się Zielonej Księgi Kaddafiego, książka ta wciąż trafia do rąk obywateli. Wczoraj wieczorem policja rozbiła tajny klub książki przeznaczony dla fanów książki. Nakłonienie ludzi do czytania Koranu zamiast Zielonej Księgi będzie trudniejsze niż planowano."
 LibyaRandomEvents.42.a: "Czy możemy po prostu pozbyć się tej głupiej książki?"
 LibyaRandomEvents.43.t: "Klub Koran"
 LibyaRandomEvents.43.d: "Po tym, jak zakazaliśmy Zielonej Księgi, kilku imamów założyło kluby czytelnicze, do których młodzi ludzie mogą przychodzić i wspólnie czytać Koran. Spowodowało to wzrost zainteresowania sprawami religijnymi i ludzie kształcą się w zakresie islamu nawet bez naszej interwencji."
 LibyaRandomEvents.43.a: "W końcu Libijczycy są dziećmi Boga"
 LibyaRandomEvents.44.t: "Odkryto dysydenta"
 LibyaRandomEvents.44.d: "Informator Komitetu Rewolucji Ludowej powiadomił policję o możliwym dysydencie w Generalnym Kongresie Ludowym. Poseł planował przedstawić idee demokracji i wolności słowa. Na szczęście tę osobę zatrzymano, zanim zdążyła podzielić się swoimi pomysłami."
 LibyaRandomEvents.44.a: "Państwo znów jest bezpieczne"
 LibyaRandomEvents.44.b: "I za to możemy podziękować Komitetowi Rewolucyjnemu"
 LibyaRandomEvents.45.t: "Członek GPC omawia reformy"
 LibyaRandomEvents.45.d: "In a meeting of a General People's Congress today, a member made notion of possibly increasing citizen participation and opinion in the political process. How this dissident managed to hide his opinions from the People's Revolutionary Committee is not known, but ideas like these are dangerous to be spread around."
 LibyaRandomEvents.45.a: "Jak go uciszyć?"
 LibyaRandomEvents.45.b: "Zbierz razem kilka głów w Komitecie Rewolucyjnym"
 LibyaRandomEvents.46.t: "Odkryto rewolucję"
 LibyaRandomEvents.46.d: "Today the General People's Congress exposed a vocal revolutionary from the People's Revolutionary Committee. The member was ranting about how the GPC makes the state vulnerable to outside influences and a stronger hand is needed in ruling the country. Luckily, we managed to silence and deplatform him before any damage was done."
 LibyaRandomEvents.46.a: "Wolność została zapewniona"
 LibyaRandomEvents.46.b: "I za to możemy podziękować Generalnemu Kongresowi Ludowemu"
 LibyaRandomEvents.47.t: "Ognisty rewolucjonista"
 LibyaRandomEvents.47.d: "A member of the People's Revolutionary Committee has been making rounds in several conventions across the country stating how the General People's Congress are nothing but puppets of cabal powers. Preaching for the return of a security apparatus that protects the state and its people, the fiery revolutionary has been well received by many audiences."
 LibyaRandomEvents.47.a: "Jak go uciszyć?"
 LibyaRandomEvents.47.b: "Zbierzcie razem głowy na Generalnym Kongresie Ludowym"
 LibyaRandomEvents.48.t: "Starszy biurokrata utknął w przeszłości"
 LibyaRandomEvents.48.d: "Even though we have reformed our form of government, many officials, politicians and bureaucrats are still people who worked under the Gaddafi regime. One of these people has been recently complaining that the new regime is unwieldy, complicated and less efficient than the old one, and they are not very motivated to do their work efficiently anymore. Kicking them out would solve the problem but finding experienced people like them is difficult. Alternatively, we could just 'promote' them to a more comfortable work assignment with better perks."
 LibyaRandomEvents.48.a: "Wyrzuć ich, a znajdziemy zastępstwo"
 LibyaRandomEvents.48.b: "A co z podwyżką i dodatkiem na samochód?"
 LibyaRandomEvents.49.t: "Stary polityk chwali rząd"
 LibyaRandomEvents.49.d: "Even though we have reformed our form of government, many officials, politicians and bureaucrats are still people who worked under the Gaddafi regime. One of the more senior politicians recently stated in a press conference that they are happy to see change in Libya. They said that they will do their utmost best to fix all the mistakes and bad legacy of the old regime."
 LibyaRandomEvents.49.a: "Prawdziwy przykład patriotycznego polityka"
 LibyaRandomEvents.49.b: "Czy mają jakieś stare sekrety do wyjawienia?"
 LibyaRandomEvents.50.t: "Królewski szał wydatków"
 LibyaRandomEvents.50.d: "Państwo przyznaje libijskiej rodzinie królewskiej niewielką „pensję”, która pozwala jej na prowadzenie posiadłości i wyżywienie rodziny. Wygląda na to, że w ubiegły weekend jeden z członków rodziny królewskiej wpadł w szał wydatków, wydając pieniądze na przyjęcia, łodzie, samochody, majątek i szkodząc kilku przedsiębiorstwom państwowym."
 LibyaRandomEvents.50.a: "Może ta sprawa z monarchią nie była takim dobrym pomysłem"
 LibyaRandomEvents.51.t: "Inwestycje Królewskie"
 LibyaRandomEvents.51.d: "Państwo przyznaje libijskiej rodzinie królewskiej niewielką „pensję”, która pozwala jej na prowadzenie posiadłości i wyżywienie rodziny. Wygląda na to, że jeden z członków rodziny królewskiej przeznaczył część tych pieniędzy na inwestycje za granicą. To znacznie poprawiło naszą pozycję w tym kraju."
 LibyaRandomEvents.51.a: "Członek rodziny królewskiej odpowiedzialny za swoje pieniądze?"
 LibyaRandomEvents.52.t: "Skonfiskowane pieniądze znikają"
 LibyaRandomEvents.52.d: "We have been steadily siphoning funds from the old royal family into the state's coffers. However, we recently noticed an abnormality in the books and it seems that a very large sum of confiscated money has ended up in some official's pockets."
 LibyaRandomEvents.52.a: "Czy nie możesz już nikomu ufać?"
 LibyaRandomEvents.53.t: "Znaleziono dodatkowe pieniądze"
 LibyaRandomEvents.53.d: "Systematycznie wyprowadzamy fundusze ze starej rodziny królewskiej do kasy państwa. Niedawno znaleźliśmy skład cennych przedmiotów, dzieł sztuki o wysokiej wartości i obligacji, które dodadzą do kasy więcej pieniędzy, niż przewidywano."
 LibyaRandomEvents.53.a: "Pokaż mi pieniądze!"
 LibyaRandomEvents.54.t: "Zagraniczne siły specjalne zabijają dżihadystę"
 LibyaRandomEvents.54.d: "Last night there was an armed incident in a small village in the Libyan desert. The village was a government-known hideout for a foreign terrorist who was temporarily in hiding in our country. Armed soldiers stormed the hideout, killing the terrorist and their guards. Based on the equipment and tactics used, it is clear this attack was conducted by a special forces unit of some kind. We have no idea which country these attackers originated from, how they got into the country or how they escaped. No country has taken responsibility of the attack so far. This is a clear violation of our sovereignty, and we could do nothing about it. It is only a matter of time until this news becomes known to the public and world."
 LibyaRandomEvents.54.a: "Jak to jest możliwe? Czy to były duchy?"
 LibyaRandomEvents.55.t: "Odparcie zagranicznych sił specjalnych"
 LibyaRandomEvents.55.d: "Last night there was an armed incident in a small village in the Libyan desert. The village was a government-known hideout for a foreign terrorist who was temporarily in hiding in our country. Armed soldiers stormed the hideout with the intention of killing the terrorists. However, the local security forces managed to hold their ground against the attackers despite taking heavy casualties. The attackers vanished without trace or casualties. Based on the equipment and tactics used, it is clear this attack was conducted by a special forces unit of some kind. We have no idea which country these attackers originated from, how they got into the country or how they escaped. No country has taken responsibility of the attack so far. This is a clear violation of our sovereignty but at least we held our own, which hopefully will prevent further attacks. It is only a matter of time until this news becomes known to the public and world."
 LibyaRandomEvents.55.a: "Przynajmniej ich pokonaliśmy"
 LibyaRandomEvents.56.t: "Więzi gospodarcze pobudzają wzrost"
 LibyaRandomEvents.56.d: "Nasza decyzja o bliższym związaniu naszej gospodarki z Europą wydaje się przynosić owoce. Wydaje się, że zwiększone inwestycje i wzrost gospodarczy w Europie również nas ciągną w górę. To dobry dzień dla gospodarki."
 LibyaRandomEvents.56.a: "Pieniądze!"
 LibyaRandomEvents.57.t: "Economic Ties Decrease Growth"
 LibyaRandomEvents.57.d: "Our decision to tie our economy closer with Europe seems to have been not such a good idea. As the economies of Western countries slow down, it seems that our economy is suffering from ripple effects."
 LibyaRandomEvents.57.a: "Cholera"
 LibyaRandomEvents.58.t: "Najemnicy oskarżeni o zbrodnie wojenne"
 LibyaRandomEvents.58.d: "One of the mercenary groups we have sent abroad has been accused of war crimes. Locals report that they entered a village, looting it of its valuables and executing and raping several people. This story was quickly picked up by the global media and we are now under pressure."
 LibyaRandomEvents.58.a: "Jakich najemników?"
 LibyaRandomEvents.59.t: "Najemnicy przywracają doświadczenie"
 LibyaRandomEvents.59.d: "Jedna z grup najemników, którą wysłaliśmy za granicę, wróciła z wycieczek. Natychmiast doradzono im, aby zorganizowali warsztaty z naszymi oficerami wojskowymi w celu zebrania wszelkich doświadczeń."
 LibyaRandomEvents.59.a: "Jakich najemników?"
 LibyaRandomEvents.60.t: "Armia chce swojego sprzętu"
 LibyaRandomEvents.60.d: "W Libii są dwie armie; Korpus Strażników Rewolucji i regularne siły zbrojne. Korpus Strażników kontroluje większość składowisk zaopatrzenia w kraju. Niedawno kilku wysokich rangą oficerów armii skarżyło się, że nie mogą kierować armią, gdy o większość rzeczy trzeba prosić Korpus Strażniczy. Domagają się przydzielenia im większych dostaw."
 LibyaRandomEvents.60.a: "Daj im broń"
 LibyaRandomEvents.60.b: "Ta broń jest zamknięta nie bez powodu"
 LibyaRandomEvents.61.t: "RGC chce więcej rekrutów"
 LibyaRandomEvents.61.d: "In Libya, there are two armies; the Revolutionary Guard Corps and the regular armed forces. The balance of power has recently been shifted towards the regular armed forces. The Revolutionary Guard Corps has been complaining that ever since their importance was reduced, there has been a lack of recruits as most are being allocated to the army. They are finding it difficult to function by just trying to keep their existing manpower available."
 LibyaRandomEvents.61.a: "Przydziel do nich kilku rekrutów"
 LibyaRandomEvents.61.b: "Brzmi jak problem umiejętności"
 LibyaRandomEvents.62.t: "Urzędnik rządowy sprzedaje pole naftowe"
 LibyaRandomEvents.62.d: "Ciekawy dokument trafił do tabeli [LBA.GetLeader]. Wynika z niego, że urzędnik rządowy sprzedał jedno ze stanowych pól naftowych międzynarodowemu operatorowi bez żadnej zgody rządu lub National Oil Corporation. Wygląda na to, że pieniądze z zakupu w większości trafiły do ​​kieszeni tego urzędnika."
 LibyaRandomEvents.62.a: "Unieważnij zakup!"
 LibyaRandomEvents.62.b: "Nic nie możemy zrobić"
 LibyaRandomEvents.63.t: "NOC wypiera konkurencję"
 LibyaRandomEvents.63.d: "Ciekawy dokument trafił do tabeli [LBA.GetLeader]. National Oil Corporation zastosowała pewien polityczny podstęp, aby wyrzucić zagraniczną korporację z jednego z libijskich pól naftowych. Wygląda na to, że ktoś w NOC próbuje wykorzystać pozycję państwa, aby zgromadzić więcej pieniędzy dla firmy i dla siebie."
 LibyaRandomEvents.63.a: "Unieważnij zakup!"
 LibyaRandomEvents.63.b: "Nic nie możemy zrobić"
 LibyaRandomEvents.64.t: "Niedostatek żywności"
 LibyaRandomEvents.64.d: "Due to our poor climate, we must import most of our food. This makes us very dependent on foreign countries, and disruptions without a steady supply line are common. Recently, there have been some problems with shipping grain to the country. With clogged ports not being able to hold capacity and difficulty transporting grain across the country, shortages have been created. This especially impacts the more rural areas, while the big cities of Tripoli and Benghazi are less affected. What should we do?"
 LibyaRandomEvents.64.a: "Spróbuj zdobyć szybkie źródło pożywienia"
 LibyaRandomEvents.64.b: "Pozwól im zjeść ciasto!"
 LibyaRandomEvents.65.t: "Wycieczka z przystankiem gwizdka"
 LibyaRandomEvents.65.d: "Now that we have a railroad in the country, it might make sense to make the best of it and travel across the country on a political tour. We would be able to promote both the political establishment and the new railway at the same time."
 LibyaRandomEvents.65.a: "Chugga chugga chugga chugga choo choo!"
 LibyaRandomEvents.65.b: "Dla mnie brzmi to trochę zbyt wiktoriańsko"
 LibyaRandomEvents.66.t: "Wykolejony pociąg"
 LibyaRandomEvents.66.d: "Wygląda na to, że przyjęcie pociągu nie odbyło się bez żadnych problemów. Wykoleił się pociąg. Dziesiątki pasażerów zostało rannych, a kilku zginęło. Ludzie nazywają nasze nowe pociągi śmiertelnymi pułapkami i twierdzą, że nasz nowy projekt kolejowy to tylko projekt próżności dla [LBA.GetLeader]."
 LibyaRandomEvents.66.a: "Obiecaj poprawę bezpieczeństwa kolei"
 LibyaRandomEvents.66.b: "Takie rzeczy się zdarzają!"
 LibyaRandomEvents.67.t: "Bunt Toubou"
 LibyaRandomEvents.67.d: "Due to our weak internal political situation, the Toubou people living in Southern Libya have taken up arms in rebellion. Feeling disenfranchised by the government for years, they have finally had enough. Numerically, they are hopelessly outnumbered even with the few turncoats that have already left our military to join them. It should not be a large effort to crush this revolt, though it will distract us from our main opponent."
 LibyaRandomEvents.67.a: "Jest to zatem zdrada stanu"
 LibyaRandomEvents.67.b: "Pozwól im być"
 LibyaRandomEvents.68.t: "Powstanie Tuaregów"
 LibyaRandomEvents.68.d: "Due to our weak internal political situation, the Tuareg people living in Southwestern Libya have taken up arms in rebellion. Feeling disenfranchised by the government for years, they have finally had enough. Our military forces with Tuareg allegiances have already flipped to the Tuareg side, and hundreds of Tuareg tribesmen are moving over the border from Niger and Algeria to join the fight. This little rebellion might turn into something bigger if they are not stopped."
 LibyaRandomEvents.68.a: "Jest to zatem zdrada stanu"
 LibyaRandomEvents.68.b: "Pozwól im być"
 LibyaTribes.1.t: "Wschodząca gwiazda w armii"
 LibyaTribes.1.d: "Oficer [tribal_offender] w naszej armii jest bardzo obiecujący. Szybko awansowali w rankingach, choć teraz wydaje się, że dotarli do ściany w kwestii dalszych awansów. Wygląda na to, że dostojnicy wojskowi mają osobisty interes w powstrzymaniu tego [przestępcy plemiennego] przed zdobyciem większej władzy. Moglibyśmy interweniować i zmusić wojsko do przyznania im kolejnego awansu. To posunięcie zapewniłoby nam również wsparcie ze strony plemion [tribal_offender]. Alternatywnie moglibyśmy po prostu po cichu zaakceptować sposób, w jaki wojsko traktuje tego młodego oficera."
 LibyaTribes.1.a: "Zasługują na awans"
 LibyaTribes.1.b: "To nie nasza rola, żeby interweniować"
 LibyaTribes.2.t: "Wschodząca gwiazda marynarki wojennej"
 LibyaTribes.2.d: "Oficer [tribal_offender] w naszej marynarce wojennej jest bardzo obiecujący. Szybko awansowali w rankingach, choć teraz wydaje się, że dotarli do ściany w kwestii dalszych awansów. Wygląda na to, że dostojnicy wojskowi mają osobisty interes w powstrzymaniu tego [przestępcy plemiennego] przed zdobyciem większej władzy. Moglibyśmy interweniować i zmusić wojsko do przyznania im kolejnego awansu. To posunięcie zapewniłoby nam również wsparcie ze strony plemion [tribal_offender]. Alternatywnie moglibyśmy po prostu po cichu zaakceptować sposób, w jaki wojsko traktuje tego młodego oficera."
 LibyaTribes.2.a: "Zasługują na awans"
 LibyaTribes.2.b: "To nie nasza rola, żeby interweniować"
 LibyaTribes.3.t: "Wschodząca gwiazda sił powietrznych"
 LibyaTribes.3.d: "Oficer [tribal_offender] naszych sił powietrznych jest bardzo obiecujący. Szybko awansowali w rankingach, choć teraz wydaje się, że dotarli do ściany w kwestii dalszych awansów. Wygląda na to, że dostojnicy wojskowi mają osobisty interes w powstrzymaniu tego [przestępcy plemiennego] przed zdobyciem większej władzy. Moglibyśmy interweniować i zmusić wojsko do przyznania im kolejnego awansu. To posunięcie zapewniłoby nam również wsparcie ze strony plemion [tribal_offender]. Alternatywnie moglibyśmy po prostu po cichu zaakceptować sposób, w jaki wojsko traktuje tego młodego oficera."
 LibyaTribes.3.a: "Zasługują na awans"
 LibyaTribes.3.b: "To nie nasza rola, żeby interweniować"
 LibyaTribes.4.t: "Student Uniwersytetu publikuje pracę dyplomową"
 LibyaTribes.4.d: "Student [tribal_offender] z libijskiego uniwersytetu opublikował nową pracę magisterską na temat nowej technologii. Teza ta może pomóc w rozwoju naszego sektora przemysłowego. Ujawnia jednak również pewną krytykę pod adresem rządzącego rządu i tego, jak inne plemiona powstrzymują Libię. Czy tę tezę należy stłumić, czy też pozostawić?"
 LibyaTribes.4.a: "Ta teza to dobra wiadomość"
 LibyaTribes.4.b: "Pomiń publikację"
 LibyaTribes.5.t: "Ekonomista oferuje rozwiązanie"
 LibyaTribes.5.d: "Ekonomista z plemienia [tribal_offender] stwierdził niedawno w swojej publikacji, że produktywność gospodarczą Libii można poprawić poprzez obniżenie niektórych podatków. Przez przypadek te ulgi podatkowe wpłynęłyby głównie na sektory gospodarki ważne dla plemion [tribal_offender]. Jest prawdą w tym, co mówi ekonomista, ale wprowadzenie ulg podatkowych wyraźnie sugerowałoby, że faworyzujemy plemiona [tribal_offender] nad innymi."
 LibyaTribes.5.a: "Na pierwszym miejscu jest gospodarka narodowa"
 LibyaTribes.5.b: "Spróbujmy uszczęśliwić inne plemiona"
 LibyaTribes.6.t: "Lokalny polityk sugeruje reformę"
 LibyaTribes.6.d: "'When I was a little boy growing up in a [tribal_offender] village, things ran smoothly. Our elders knew how to run a community, something our government struggles doing', a local level [tribal_offender] politician stated on a TV interview recently when asked how he would improve the Libyan nation. In his interview, he made some good points how to modernise the nation. Adopting these changes would be beneficial but it would cause a slight loss of face."
 LibyaTribes.6.a: "Podobały mi się jego pomysły"
 LibyaTribes.6.b: "Powinien trzymać się swojego poziomu"
 LibyaTribes.7.t: "Starszyzna plemienna podejrzana o zdradę stanu"
 LibyaTribes.7.d: "Informator Komitetu Rewolucyjnego z plemienia [tribal_offender] podzielił się informacją, że dwóch starszych plemiennych omawia między sobą idee antyrewolucyjne. Najwyraźniej mieli także kontakt z wrogimi mocarstwami, dzieląc się wrażliwymi informacjami. Nie możemy w pełni potwierdzić wszystkich szczegółów, ale jeśli to prawda, zarzuty te są poważne. Oczywiście może być tak, że informator ten po prostu próbuje wesprzeć stanowisko własnego plemienia."
 LibyaTribes.7.a: "Pozbądź się tych dwóch starszych"
 LibyaTribes.7.b: "Informator ewidentnie kłamie"
 LibyaTribes.8.t: "Duża darowizna"
 LibyaTribes.8.d: "A group of [tribal_offender] businessmen have approached the government. In exchange for the government considering some business friendly legislation, they are willing to donate a large sum of money to help the government run its daily business. Looking at their suggestions on how to make Libya more 'business friendly', many items on their list include projects that would clearly only benefit [tribal_offender]s."
 LibyaTribes.8.a: "To brzmi jak dobry interes"
 LibyaTribes.8.b: "To jest korupcja!"
 LibyaTribes.9.t: "Firma naftowa okupująca ziemie plemienne"
 LibyaTribes.9.d: "A group of [tribal_offender] elders have approached the government with a conundrum. An oil field run by a foreign corporation is operating on land belonging to their tribe. We can't find any paperwork regarding the original ownership of the land, or if the land has been legally transferred to the oil company. However, we could probably use this as an excuse to get the oil fields back under government control if we wanted to, although a lot of the oil profits would then go to [tribal_offender]s."
 LibyaTribes.9.a: "Odzyskaj pole"
 LibyaTribes.9.b: "Spółka jest legalnym właścicielem tego pola"
 LibyaTribes.10.t: "Ognisty kaznodzieja"
 LibyaTribes.10.d: "Imam z meczetu [tribal_offender] stwierdził wyższość tradycji [tribal_offender] w niedawnej khutbie, stwierdzając, że „spośród wszystkich ludzi w Libii [tribal_offender] są najbardziej lojalni wobec Allaha”. Jego przemówienie wywołało zamieszanie w innych częściach Libii i zwiększyło napięcia między różnymi plemionami."
 LibyaTribes.10.a: "On ma rację"
 LibyaTribes.10.b: "Ten kaznodzieja nie będzie długo głosił"
 LibyaTribes.11.t: "Nadużycia w wojsku"
 LibyaTribes.11.d: "There has been a bit of a scandal in the military recently; a video of a [tribal_offender] officer abusing a group of [tribal_defender] recruits has been circulating online. The video shows the recruits being made to run around a track for hours in full gear, beaten with sticks and held underwater for long periods of time. When asked about the incident, the [tribal_offender] officer stated that 'these gawad do not know how to act like soldiers. Ancient [tribal_offender] warriors with sticks and stones would make for a more effective modern military than these dogs'. Several [tribal_defender] elders have called for this officer to be kicked out of the military for tarnishing the name of Libya's armed forces."
 LibyaTribes.11.a: "Rekruci marudzą o niczym"
 LibyaTribes.11.b: "Funkcjonariusz wyraźnie przekroczył granicę"
 LibyaTribes.12.t: "Wiele hałasu o owce"
 LibyaTribes.12.d: "Many of the Libyan tribes still engage in pastoral agriculture, herding their goats, sheep and cattle from one piece of land to another. A conflict arose between two tribes recently when [tribal_offender] pastoralists crossed into [tribal_defender] territory. The [tribal_defender] tribe is demanding that the [tribal_offender] tribe pays compensation for damages, which apparently mostly includes all the grass that was eaten."
 LibyaTribes.12.a: "To tylko trawa?"
 LibyaTribes.12.b: "Terytoria plemienne są święte i należy je szanować"
 LibyaTribes.13.t: "Najazd plemienny"
 LibyaTribes.13.d: "Zeszłej nocy członkowie plemienia [tribal_offender] napadli na farmę [tribal_defender], twierdząc, że jest ona zbudowana na ich ziemi. W nocy podpalili farmę, a wczesnym rankiem wrócili, aby przepędzić mieszkańców. Starsi plemienia [tribal_defender] błagają rząd o interwencję i ukaranie najeźdźców [tribal_offender]."
 LibyaTribes.13.a: "Bez wątpienia była to ziemia [tribal_offender]."
 LibyaTribes.13.b: "Naloty? Żyjemy w społeczeństwie"
 LibyaTribes.14.t: "Spór o wodę"
 LibyaTribes.14.d: "The Great Man Made River provides free water to many Libyans. However, a [tribal_defender] tribe claims that members of a [tribal_offender] tribe are blocking [tribal_defender]s from accessing one of the water sources in one of our bigger cities."
 LibyaTribes.14.a: "[tribal_defender]s have the right to access that water"
 LibyaTribes.14.b: "[tribal_defender] powinni pić na własnej ziemi"
 LibyaTribes.15.t: "Niereprezentujący polityk"
 LibyaTribes.15.d: "W samorządzie jednego z naszych małych miasteczek doszło do małej afery. Na przywódcę miasta wybrano polityka [tribal_offender], mimo że miasto stanowi większość [tribal_defender]. To spowodowało, że mieszkańcy miasta oskarżyli rząd o sfałszowanie wyborów w celu realizacji programu [tribal_offender] i żądają, aby zamiast tego wybrano polityka [tribal_defender]. Nie przypominamy sobie, żeby ostatnio ktoś sfałszował jakieś wybory, ale może był to samorząd?"
 LibyaTribes.15.a: "Wybory były uczciwe"
 LibyaTribes.15.b: "Ulegnij żądaniom mieszkańców"
 LibyaTribes.16.t: "Dystrybucja pieniędzy z ropy"
 LibyaTribes.16.d: "Dwa plemiona kłócą się o sposób, w jaki rząd rozdziela pieniądze z ropy. Członkowie plemienia [tribal_offender] twierdzą, że rząd wydaje zbyt dużo pieniędzy na poprawę życia [tribal_defender]. Podobnie członkowie plemienia [tribal_defender] twierdzą coś zupełnie przeciwnego."
 LibyaTribes.16.a: "Daj więcej pieniędzy [tribal_offender]."
 LibyaTribes.16.b: "[tribal_defender] zasługuje na dodatkowe pieniądze"
 LibyaFamily.1.t: "Wypadek rodzinny"
 LibyaFamily.1.d: "While military engineers were clearing up the damage from the recent British airstrike, they discovered something shocking. A badly burnt and mutilated body of one of Muammar Gaddafi's children was found among the rubble. It seems they had been inspecting the site without anyone knowing, and they got caught in the attack."
 LibyaFamily.1.a: "Jak to mogło się stać!?"
 LibyaFamily.2.t: "Awaria Internetu"
 LibyaFamily.2.d: "Last weekend, an internet blog criticised the Gaddafi regime, specifically Muhammad Muammar Gaddafi. In response, in his role as head of the GPTC, Muhammad Gaddafi closed off the entire internet in the country for almost a week. While he was only trying to protect the regime, Muhammad's actions upset quite a lot of Libyans. Maybe someone so quick to anger should not be head of the GPTC after all?"
 LibyaFamily.2.a: "Internet nie jest nikomu potrzebny"
 LibyaFamily.2.b: "Być może potrzebujemy bardziej kompetentnego następcy"
 LibyaFamily.3.t: "Walcz o colę"
 LibyaFamily.3.d: "An adviser has disturbing news; there is a tense situation relating to Coke, and not the kind you are thinking of. Recently, Coca-Cola opened a bottling plant in Libya. Muhammad and Mutassim Gaddafi have both claimed ownership of the plant through their business ties, and this conflict has now escalated out of hand. Both Muhammad and Mutassim are now at the plant with their personal guards, armed to the teeth. There don't seem to be any signs of either side cooling down."
 LibyaFamily.3.a: "Interweniuj na rzecz Mahometa"
 LibyaFamily.3.b: "Interweniuj na rzecz Mutassima"
 LibyaFamily.3.c: "Czy Pepsi jest w porządku?"
 LibyaFamily.4.t: "Muhammad Kaddafi krytykuje swojego ojca"
 LibyaFamily.4.d: "Muhammad Muammar Gaddafi has been living in exile for quite a while now. It seems that exile is weighing on him, as he recently mentioned in an interview how disappointed he is with his father. He stated that his father treats his people just like he treated Muhammad; with neglect and unreasonable demands. While Muhammad holds very little influence in Libya these days, some Libyans have still expressed their sympathies towards him."
 LibyaFamily.4.a: "Myślałam, że nie interesuje go polityka?!"
 LibyaFamily.5.t: "Muhammad na nowo rozpala swoją pasję do polityki"
 LibyaFamily.5.d: "Po krótkiej rozmowie z ojcem wydaje się, że Mahomet zrozumiał swoją pozycję w rodzinie. Choć początkowo niechętnie kontynuował dziedzictwo swojej rodziny, pogodził się z faktem, że pewnego dnia będzie przywódcą Libii. Sukcesja Kaddafiego jest teraz nieco bezpieczniejsza."
 LibyaFamily.5.a: "Dobra rozmowa, synu"
 LibyaFamily.6.t: "Mahomet ignoruje swojego ojca"
 LibyaFamily.6.d: "It seems that Muhammad is not willing to listen to his father. He does not want to follow in his father's footsteps in ruling the country, nor does he want to be like his father. After much shouting and many slammed doors, there seems to be no getting through to Muhammad. It seems for now Muammar has to be satisfied with the fact that his son is interested in at least some aspects of running the country, even if not as its leader."
 LibyaFamily.6.a: "Jak mogę się z nim skontaktować?"
 LibyaFamily.7.t: "Mahomet opuszcza Libię"
 LibyaFamily.7.d: "After a heated argument about his responsibilities in ruling the country one day, Muhammad seems to have had enough of his father. Saying that he no longer feels like Libya is his home, he has decided to leave the country, at least for a little while. Hopping onto his private jet, he set course to Algeria with nobody knowing when he would be willing to return."
 LibyaFamily.7.a: "Wróć wkrótce do domu"
 LibyaFamily.8.t: "Fenomenalny pokaz sztuki"
 LibyaFamily.8.d: "Pokaz sztuki Saifa okazał się sukcesem. Wystawa, która odbyła się w Muzeum Sztuk Pięknych w Montrealu w Kanadzie, przyciągnęła uwagę wielu międzynarodowych korporacji i obywateli Kanady. Nawiasem mówiąc, podczas pokazu Saifowi udało się zorganizować kilka spotkań biznesowych z wieloma przedstawicielami firm takich jak Siemens, Petro-Canada i SNC-Lavalin. Mieli okazję omówić wiele możliwości inwestycyjnych w Libii. Choć jest to osobisty sukces Saifa, może być nawet większym sukcesem całej Libii. Mamy możliwość pogłębienia współpracy z jedną z tych dużych korporacji."
 LibyaFamily.8.a: "Siemens jest znany ze swojej elektroniki!"
 LibyaFamily.8.b: "Jako kraj naftowy Petro-Kanada jest naturalnym partnerem"
 LibyaFamily.8.c: "Do rozwoju Libii najlepsza jest firma budowlana taka jak SNC-Lavalin"
 LibyaFamily.9.t: "Przyzwoity pokaz sztuki"
 LibyaFamily.9.d: "Pokaz sztuki Saifa odbył się w Muzeum Sztuk Pięknych w Montrealu. Choć pokaz sztuki wzbudził pewne zainteresowanie, nie wzbudził takiego zainteresowania, jakiego oczekiwaliśmy. Wiele korporacji wycofało się ze sponsoringu po ostrej reakcji opinii publicznej. Wystawa jednak zdołała przyciągnąć uwagę międzynarodowej publiczności. Przynajmniej udało mu się zwrócić uwagę świata na kulturę libijską i Libię w ogóle."
 LibyaFamily.9.a: "Możemy też tworzyć sztukę"
 LibyaFamily.10.t: "Katastrofa artystyczna"
 LibyaFamily.10.d: "The artshow held in Montreal's Museum of Fine Arts has been a total disaster. Many of the corporations pulled out of the sponsorship after public backlash, and critics have described Saif's artwork as 'lurid' and 'a triumph of banality'. Eventually, the exhibition was torn down early as the Museum faced criticism of supporting the works of an artist who was so closely tied with the political regime of Libya. This has been a total humiliation for us."
 LibyaFamily.10.a: "Niesamowity? Czy oni nie wiedzą, że sztuka jest subiektywna?"
 LibyaFamily.11.t: "Saif przyjmuje stanowisko spadkobiercy"
 LibyaFamily.11.d: "Choć początkowo wahał się, czy zrezygnować z pierworództwa swojego starszego brata, Saif ostatecznie przyjął sugestię ojca, aby zostać oficjalnie jego następcą. W ramach przygotowań do tej roli Saif otrzymał w ramach reżimu większą władzę."
 LibyaFamily.11.a: "Jestem z ciebie dumny, synu"
 LibyaFamily.12.t: "Saif odrzuca stanowisko spadkobiercy"
 LibyaFamily.12.d: "Pomimo długich rozmów z ojcem Saif odrzucił stanowisko następcy ojca. Powiedział, że jeśli ma nastąpić jakakolwiek sukcesja, jest to dziedzictwo jego starszego brata Mahometa."
 LibyaFamily.12.a: "Może porozmawiamy o tym ponownie później"
 LibyaFamily.13.t: "Saif wycofuje się z wewnętrznego kręgu swojego ojca"
 LibyaFamily.13.d: "Saif didn't take his father's suggestions of him being his father's successor very well. Accusing his father of nepotism, Saif said that Libya 'was not a farm to inherit'. He said he had only taken a larger role in the country's administration due to the absence of institutions, not for personal glory. He now said that he is no longer interested in helping his father run the country."
 LibyaFamily.13.a: "Miałeś być wybrańcem!"
 LibyaFamily.14.t: "„Sunday Telegraph” przegrywa sprawę sądową"
 LibyaFamily.14.d: "Po dwóch dniach spędzonych w sądzie w Londynie w związku ze sprawą o zniesławienie brytyjscy sędziowie skazali „Sunday Telegraph” za zniesławienie. W artykułach opublikowanych przez gazetę nie podano żadnych źródeł informacji, a autor nie był w stanie przedstawić sądowi żadnych dowodów potwierdzających zarzuty. Sąd orzekł, że artykuły te miały wyraźnie zszargane imię Saifa al-Islama Kaddafiego. Gazeta została skazana na zapłatę odszkodowania pieniężnego Saifowi al-Islamowi za naruszenie jego reputacji. Sędziowie zażądali od nich także opublikowania dodatkowego artykułu, w którym przepraszają Saifa al-Islama. Saif al-Islam został zauważony przed budynkiem sądu, pokazując znak „V jak zwycięstwo”. Wychodząc, powiedział prasie, że pierwszą rzeczą, jaką zrobi, będzie zadzwonienie do ojca, który z pewnością będzie zadowolony z wyników."
 LibyaFamily.14.a: "Sprawiedliwość!"
 LibyaFamily.15.t: "„The Sunday Telegraph” akceptuje ugodę"
 LibyaFamily.15.d: "Po dwóch dniach spędzonych w sądzie w Londynie w związku ze sprawą o zniesławienie „Sunday Telegraph” i Saif al-Islam Kaddafi zgodzili się rozstrzygnąć spór. Dzięki pomocy saudyjskiego dyplomaty w arbitrażu „Sunday Telegraph” zgodził się pokryć część kosztów prawnych Saifa al-Islama i wystosować publiczne przeprosiny bez konieczności płacenia za szkody wyrządzone reputacji Saifa al-Islama. Saif al-Islam został zauważony przed budynkiem sądu, pokazując znak „V” oznaczający zwycięstwo. Wychodząc, powiedział prasie, że pierwszą rzeczą, jaką zrobi, będzie zadzwonienie do ojca, który z pewnością będzie zadowolony z wyników."
 LibyaFamily.15.a: "Uczciwy kompromis"
 LibyaFamily.16.t: "„Sunday Telegraph” wygrywa sprawę sądową"
 LibyaFamily.16.d: "Po dwóch dniach spędzonych w sądzie w Londynie w związku ze sprawą o zniesławienie brytyjscy sędziowie uznali „Sunday Telegraph” za niewinnego. Chociaż gazeta nie przedstawiła żadnych dowodów na swoje zarzuty w samym artykule, autor przedstawił je osobno, na żądanie sądu. Chociaż dowody nie wystarczą, aby wykazać solidny związek między Saif al-Islamem a praniem pieniędzy, istnieje wystarczająco dużo linków, aby uzasadnić pisany artykuł. Wynik ten mocno uderzył w reputację Saifa al-Islama, który szybko opuścił kraj tego samego wieczoru, gdy zakończyła się sprawa sądowa."
 LibyaFamily.16.a: "Nonsens. Oni są winni!"
 LibyaFamily.17.t: "Saif al-Islam Kaddafi zdobywa nagrodę"
 LibyaFamily.17.d: "Światowe Forum Ekonomiczne (WEF) przyznało Saifowi al-Islamowi Kaddafiemu nagrodę „Młody światowy lider”. Nagroda przeznaczona jest dla liderów, którzy mają strategiczne podejście i inspirują, a także są głęboko zaangażowani w tworzenie trwałych pozytywnych zmian w swoich społeczeństwach i na całym świecie. Nagroda ta z pewnością wzmocni pozycję Saifa al-Islama w rządzie."
 LibyaFamily.17.a: "Bardzo dobry!"
 LibyaFamily.18.t: "Saif al-Islam Kaddafi uzyskał stopień doktora"
 LibyaFamily.18.d: "Gaddafi's son Saif al-Islam has been awarded a PhD from the London School of Economics. His thesis 'The role of civil society in the democratisation of global governance institutions: from soft power to collective decision making?' was examined by multiple well respected academics. However, the thesis has collected accusations of plagiarism, as well as allegations that the thesis was ghost-written by consultants from Monitor Group, a consulting firm which has earned more than $3 million in consulting fees from Saif's father."
 LibyaFamily.18.a: "Nie ma plagiatu!"
 LibyaFamily.19.t: "Saif al-Islam wzywa do reform"
 LibyaFamily.19.d: "Saif al-Islam has always been the most prodigious of Gaddafi's sons. Being educated in Europe with connections to multiple politicians, he is well versed in politics and diplomacy. However, he has always been an avid reformer. It seems he has now taken his steps of reform a bit further; in a recent interview, when asked what Libya needed most, he stated 'Democracy'. When asked to clarify if he meant that Libya needed more democracy, he was recorded saying 'No. 'More democracy' would imply that we had some'. He has also criticised Libya's human rights record, and has called for more reform in context of the current Jamahiriya system."
 LibyaFamily.19.a: "Demokracja? Prawa człowieka? Czy oszalał?"
 LibyaFamily.20.t: "Działalność charytatywna Saifa al-Islama"
 LibyaFamily.20.d: "In 1998, Saif al-Islam founded a non-governmental organization called the Gaddafi International Charity and Development Foundation (GICDF). The organization is known for dealing with hostage situations with Islamic militants as well as doing charity work in Sub-Saharan Africa. A recent charity drive has greatly increased our standing with one of our African brothers."
 LibyaFamily.20.a: "Świetnie"
 LibyaFamily.21.t: "Wypadek na polowaniu"
 LibyaFamily.21.d: "Saif al-Islam is a frequent visitor of the United Kingdom, including the royal family there. In a recent hunting trip on the estates of Princess Anne, Saif fell off his horse and accidentally discharged his weapon into his abdomen. He was hurried to the nearest hospital but died later of his wounds. The British government has already expressed their deepest condolences to Muammar Gaddafi and the Libyan nation, and have started to make preparations to get Saif's body back to Libya. This is a terrible blow to the Gaddafi family, as Saif al-Islam was one of the more prodigious children of Gaddafi."
 LibyaFamily.21.a: "Zobacz, co zrobili mojemu chłopcu!"
 LibyaFamily.22.t: "Al-Saadi odnosi sukces"
 LibyaFamily.22.d: "After a large financial contribution by the Gaddafi family, the Italian Serie A team Perugia accepted Al-Saadi into their ranks. This deal turned out to be much better than what Perugia was expecting. With Diego Maradona as his technical consultant and Ben Johnson as his personal trainer, Al-Saadi was well prepared for his next match. While he only played 20 minutes in his first match, Al-Saadi proved a positive surprise to all. The manager of Perugia told [ROOT.GetLeader] that they were very happy that Al-Saadi was enrolled in the team. Al-Saadi seems to be on his way to becoming a real footballer."
 LibyaFamily.22.a: "Wiedziałem, że on to ma w sobie!"
 LibyaFamily.23.t: "Al-Saadi nie zostaje wybrany"
 LibyaFamily.23.d: "We haven't found any teams that would be interested in taking Al-Saadi to their ranks. We were in discussions with the Maltese Champions League level team Birkirkara F.C., but they withdrew from the negotiations when Al-Saadi tested positive for Nandrolone in a drug test. Al-Saadi's display of his footballing skills wasn't impressing anyone either, with the Italian newspaper La Repubblica stating that 'even at twice his current speed he would still be twice as slow as slow itself'. Al-Saadi probably has to keep playing in Libya for now."
 LibyaFamily.23.a: "Zawsze jest następny sezon..."
 LibyaFamily.24.t: "Al-Saadi daje się ponieść"
 LibyaFamily.24.d: "Udało nam się znaleźć odpowiednią europejską drużynę, w której Al-Saadi mógłby grać, ale nie wszystko poszło zgodnie z planem. Dzięki nowemu dostępowi do Europy Al-Saadi jeszcze bardziej pogłębił swój nawyk narkotykowy. Prawie nie gra żadnych meczów i marnuje czas na imprezy i narkotyki, myśląc, że jest wielką gwiazdą futbolu. Wydaje się, że jest już przegraną sprawą."
 LibyaFamily.24.a: "Nie tak się gra w piłkę nożną"
 LibyaFamily.25.t: "Piłkarskie zamieszki"
 LibyaFamily.25.d: "W libijskich kręgach piłkarskich dobrze wiadomo, że Al-Saadi Kaddafi ma ustalone mecze, w których rozgrywa. Podczas niedawnego meczu z jego klubem Al Ahly kibice przeciwnego klubu zaczęli wygwizdywać jego i jego drużynę, po czym paradowali na boisku z osłem ubranym w barwy Al Ahly, chcąc zaprotestować przeciwko wtrącaniu się Al-Saadiego w mecze. Al-Saadiemu nie spodobało się to i słychać było, jak krzyczał: „Zniszczę twój klub!” Zamienię je w gniazdo sowy”. Gdy sędzia interweniował i próbował uspokoić sytuację, trener Al Ahly odepchnął go na bok. To spowodowało, że kibice bojowników wpadli w agresję i wtargnęli na boisko piłkarskie. W końcu przerodziło się to w zamieszki na wielką skalę, podczas których siły bezpieczeństwa ostro rozprawiały się z uczestnikami zamieszek. Pozostała część sezonu została odwołana w obawie przed dalszymi zamieszkami."
 LibyaFamily.25.a: "Ten próżny idiota!"
 LibyaFamily.26.t: "Przedawkowanie Al-Saadiego"
 LibyaFamily.26.d: "Syn Muammara Kaddafiego, Al-Saadi, został wczoraj znaleziony martwy w pokoju hotelowym w Mediolanie we Włoszech. Wszystko wskazuje na to, że zmarł w wyniku przedawkowania narkotyków. Znany z nadużywania narkotyków i ekstrawaganckiego stylu życia, nie jest to specjalnie zaskoczeniem. Choć był „czarną owcą” rodziny Kaddafiego, nadal był bardzo drogi swojemu ojcu i rodzeństwu."
 LibyaFamily.26.a: "Trzeba było go wysłać na odwyk"
 LibyaFamily.27.t: "Al-Saadi rzuca swoje uzależnienie"
 LibyaFamily.27.d: "It was a hard week for Al-Saadi. Spending all the time in isolation seems to have been worth it and he has managed to quit his addiction to drugs. However, he did pick up a pretty heavy smoking habit in the process. Luckily, cigarettes aren't nearly as deadly as cocaine. Al-Saadi apologised to his father for his past behaviour and he has promised to do a better job in the future both for the sake of Libya and his family."
 LibyaFamily.27.a: "To jedyny moment, kiedy lubię rezygnujących"
 LibyaFamily.28.t: "Nawrót Al-Saadiego"
 LibyaFamily.28.d: "Pierwszy tydzień odwyku przebiegł pomyślnie i Al-Saadiemu udało się zerwać z nałogiem narkotykowym. Jednak w drugim tygodniu nastąpił silny nawrót choroby. Ostatecznie całkowicie opuścił ośrodek odwykowy. Ludzie w ośrodku próbowali temu zapobiec, ale Al-Saadi wezwał swojego osobistego ochroniarza, aby go odebrał, i zagroził, że zabije wszystkich w ośrodku, jeśli nie zostanie wypuszczony. Wydaje się, że jego nałóg narkotykowy utknął bardzo mocno."
 LibyaFamily.28.a: "Chyba to jakiś postęp?"
 LibyaFamily.29.t: "Al-Saadi ratuje Libię"
 LibyaFamily.29.d: "Pierwszy tydzień odwyku przebiegł pomyślnie i Al-Saadiemu udało się zerwać z nałogiem narkotykowym. Jednak w drugim tygodniu nastąpił silny nawrót choroby. Ostatecznie próbował całkowicie opuścić ośrodek. Personel ośrodka próbował temu zapobiec, ale Al-Saadi umieścił na personelu swoich osobistych ochroniarzy. Sytuacja nasiliła się, gdy na miejsce wezwano lokalną policję. Następnie Al-Saadi w panice podsycanej narkotykami wpadł w panikę i uciekł ze swoimi ochroniarzami na lotnisko w Trypolisie, gdzie wsiadł do swojego prywatnego odrzutowca i uciekł do Szwajcarii. Od tego czasu nie skontaktował się z nami i nie mamy pewności, czy kiedykolwiek wróci."
 LibyaFamily.29.a: "Cóż, sytuacja szybko się nasiliła"
 LibyaFamily.30.t: "Al-Saadi zawstydza swoją rodzinę"
 LibyaFamily.30.d: "Al-Saadi od jakiegoś czasu mieszka na wygnaniu w Szwajcarii, gdzie organizuje ekstrawaganckie przyjęcia dla celebrytów i przyjaciół. Niedawna impreza nie przebiegła dokładnie zgodnie z planem, ponieważ Al-Saadi został znaleziony nieprzytomny na plaży nago, a na nim leżał inny nagi mężczyzna. Ta wiadomość szybko rozeszła się po tabloidach, a odsłonięte ciało Al-Saadiego pojawiło się na okładkach magazynów w całej Europie. Z pewnością było to wielkim ciosem dla nazwiska rodziny Kaddafiego."
 LibyaFamily.30.a: "Na plaży?"
 LibyaFamily.31.t: "Mutassim Kaddafi przekracza swoje granice"
 LibyaFamily.31.d: "It seems that Mutassim Gaddafi is still yearning for his military past. It was recently discovered that in his role as the National Security Advisor, Mutassim had requested $1.2 billion from the National Oil Corporation so he could form his own special forces brigade. This request was quickly denied and rejected by the government but Mutassim's abuse of his political position has not gone unnoticed."
 LibyaFamily.31.a: "Czy nie może zapomnieć o przeszłości?"
 LibyaFamily.32.t: "Mutassim znajduje dobrą ofertę"
 LibyaFamily.32.d: "Gdy szukano dostawcy broni, [SOV.GetNameDef] było jasną odpowiedzią. Po długich negocjacjach firmie Mutassim udało się pozyskać dużą partię najnowocześniejszego sprzętu dla naszych sił zbrojnych. Znacząco zwiększy to potencjał naszej armii."
 LibyaFamily.32.a: "Co za wspaniały biznesmen!"
 LibyaFamily.33.t: "Mutassim znajduje dobrą ofertę"
 LibyaFamily.33.d: "Gdy szukano dostawcy broni, [SOV.GetNameDef] było jasną odpowiedzią. Po długich negocjacjach Mutassimowi udało się zdobyć dużą partię broni dla naszych sił zbrojnych. Niestety, są to wszystkie stare zapasy z czasów zimnej wojny, których [SOV.GetAdjective] i tak planowali się pozbyć. Nie poprawi to naszych zdolności bojowych, ale przynajmniej mamy teraz trochę dodatkowych zapasów."
 LibyaFamily.33.a: "Chyba lepsze to niż nic"
 LibyaFamily.34.t: "Umowa Mutassima kończy się fiaskiem"
 LibyaFamily.34.d: "When searching for a weapons supplier, [SOV.GetNameDef] was the clear answer. After long negotiations, nothing of note was gained. The [SOV.GetAdjective]s weren't willing to hand out large amount of weapons to us. The visit to [SOV.GetName] has been a waste of time, and Mutassim's role as a National Security Advisor has now been tarnished."
 LibyaFamily.34.a: "Chyba lepiej spróbujemy jeszcze raz za jakiś czas"
 LibyaFamily.35.t: "Mutassim Kaddafi rozszerza wpływy Egiptu"
 LibyaFamily.35.d: "Chociaż Mutassim Kaddafi przebywa na wygnaniu w Egipcie, nadal ma powiązania z reżimem libijskim, zwłaszcza z członkami Generalnego Komitetu Ludowego. Ostatnio kontaktował się z wieloma swoimi przyjaciółmi w Libii i bardzo dobrze wypowiadał się o egipskim prezydencie [EGY.GetLeader]."
 LibyaFamily.35.a: "Czy planuje zamach stanu?"
 LibyaFamily.36.t: "Muhammad Kaddafi opuszcza Libię na dobre"
 LibyaFamily.36.d: "Po kolejnej kłótni z ojcem Muhammad Kaddafi oświadczył, że opuści Libię na stałe. Mówi, że nie czuje się już mile widziany w domu i chce po prostu żyć poza polityką. Przygotował już wyjazd do Algierii, choć nie powiedział, czy zamieszka tam. Wygląda na to, że najstarszy syn Kaddafiego wypadł z gry."
 LibyaFamily.36.a: "Proszę, nie odchodź"
 LBA_muhammad_muammar_gaddafi_leaves_for_good_tt: "§YMuhammad Kaddafi§! zostaje na stałe wygnany"
 LibyaFamily.37.t: "Zamordowany Mutassim Kaddafi"
 LibyaFamily.37.d: "Mutassim Kaddafi został znaleziony zamordowany w pokoju hotelowym w Amsterdamie. Głównym podejrzanym w sprawie jest libijski przemytnik broni Tarek Kaituni. Wygląda na to, że Mutassim, który bywał w „podróżach służbowych” w Amsterdamie, w rzeczywistości miał romans z Lisą van Goingą, holenderską modelką i żoną Kaituni. Holenderska policja nie zatrzymała jeszcze Tarka Kaituni, a jego obecne miejsce pobytu jest nieznane."
 LibyaFamily.37.a: "Co?!"
 LibyaFamily.38.t: "Aresztowanie Hannibala Kaddafiego"
 LibyaFamily.38.d: "Hannibal Kaddafi i jego żona zostali aresztowani w Szwajcarii. Dwóch ich służących zadzwoniło na policję, twierdząc, że para zaatakowała ich w hotelu w Genewie. W trakcie aresztowano także dwóch ochroniarzy Kaddafiego, którzy próbowali uniemożliwić policji wejście do pokoju hotelowego Kaddafiego. Hannibal ma historię związaną z policją w Europie. Zaledwie kilka lat temu francuski sąd skazał go grzywną za uderzenie dziewczyny, a zaledwie rok temu dwóch jego ochroniarzy zostało aresztowanych, gdy francuska policja próbowała uniemożliwić mu przekroczenie prędkości. Hannibal został zwolniony za kaucją w wysokości 124 000 euro, a jego żona za 186 000 euro. Wywołało to incydent dyplomatyczny między Szwajcarią a Libią."
 LibyaFamily.38.a: "Szwajcaria to nawet nie jest prawdziwy kraj!"
 LibyaFamily.39.t: "Hannibal Kaddafi utonął"
 LibyaFamily.39.d: "Ze względu na swoje wykształcenie i zawód Hannibal Kaddafi często wchodzi na pokład i pracuje na różnych statkach wojennych General National Maritime Transport Company, państwowego przedsiębiorstwa handlowego. Dzisiaj zdarzył się wypadek, kiedy podczas sztormowej pogody Hannibal wypadł za burtę. Załoga statku robiła, co mogła, próbując go uratować, ale nie była w stanie wciągnąć go z powrotem na statek. W końcu Hannibal zniknął pod falami i nigdy więcej go nie widziano."
 LibyaFamily.39.a: "Powinni byli się bardziej postarać!"
 LibyaFamily.40.t: "Ayesha Kaddafi mianowana Ambasadorem Dobrej Woli ONZ"
 LibyaFamily.40.d: "At a ceremony at Watassemo Charity Association headquarters in Tripoli, Ayesha Gaddafi was appointed as United Nations Development Program National Goodwill Ambassador for Libya due to her past charity work. In her new role as UN Goodwill Ambassador, she will work together with the UNDP to raise awareness on issues related to Millennium Development Goals, advocate for women's rights, work on combating the spread of HIV/AIDs and promote UNDP's work in Libya. This is a tremendous occasion as we repair our relations with the world."
 LibyaFamily.40.a: "Dobrze dla niej!"
 LibyaFamily.41.t: "Ayesha Kaddafi odkrywa swoją ukrytą moc"
 LibyaFamily.41.d: "We are not quite sure what happened with Ayesha's military training, but it has been miraculous. She just started commanding troops and in our latest war games she even beat our top military generals. Some of our soldiers have started calling her the 'Amazon of Libya', named after the ancient warriors on Muammar Gaddafi's all-female personal bodyguard. Her military prowess has encouraged many more women to flock to recruiting centers in the hopes of becoming like her."
 LibyaFamily.41.a: "Siła dziewczyn!"
 LibyaFamily.42.t: "Ayesha Kaddafi awansowana na generała"
 LibyaFamily.42.d: "Ayesha ukończyła szkolenie na generała. Chociaż nie była szczególnie utalentowana podczas szkolenia, miała kilka unikalnych pomysłów, które być może będziemy mogli wykorzystać później. Oznajmiła, że ​​nie będzie odgrywać aktywnej roli w wojsku, raczej zachowa swój stopień generała jako ceremonialny."
 LibyaFamily.42.a: "To jest coś"
 LibyaFamily.43.t: "Ayesha Kaddafi psuje swoje szkolenie wojskowe"
 LibyaFamily.43.d: "Ayesha's military training hasn't gone exactly to plan. First she managed to get an entire brigade lost, then in a wargame she had them attacking in the wrong direction. Her stubborn personality has also caused several clashes with many senior military officials, even causing one of them to resign from the military. She eventually did make it to the rank of general. However, she won't be actively serving in the military. Despite this, the total failure of her training has caused our entire military education and army to become subject to ridicule and suspicion."
 LibyaFamily.43.a: "Jak możesz odnieść tak porażkę?"
 LibyaFamily.44.t: "Ayesha Kaddafi broni praw kobiet"
 LibyaFamily.44.d: "In a recent interview, Ayesha Gaddafi publicly criticised the status of women in Libya. She stated that they are oppressed in the country and not given the same opportunities as men. She especially called out [ROOT.GetLeader], pointing out to their all-female group of bodyguards. While on the surface this seems like it empowers women, in reality it simply objectifies women as the bodyguards are usually chosen by their looks and not by their military skill. This interview has caused quite a stir in Libya, and there have already been several demonstrations for women's rights."
 LibyaFamily.44.a: "Kobietom w Libii jest tak samo dobrze jak mężczyznom!"
 LibyaFamily.45.t: "Ayesha Kaddafi umiera podczas porodu"
 LibyaFamily.45.d: "There is tragic news about the only daughter of Muammar Gaddafi. Last night, after her fourth child had been born, Ayesha died of postpartum bleeding. The doctors tried their best to stop the bleeding but nothing could be done. Luckily, the child was born healthy but this is still a tragic loss for the Gaddafi family."
 LibyaFamily.45.a: "Lekarze powinni byli się bardziej postarać!"
 LibyaFamily.46.t: "Saif al-Arab podejrzany o atak kwasem"
 LibyaFamily.46.d: "Saif al-Arab is a frequent visitor of Germany. Recently, he got into trouble at a nightclub in Munich. As his girlfriend started stripping on the dancefloor, the bouncer of the club threw him and his girlfriend out of the club. A brawl broke out between Saif and the bouncer. Later, he came under investigation by the German police of allegedly planning an acid attack against the bouncer as retaliation. Saif has obviously denied these claims."
 LibyaFamily.46.a: "Oczywiście zarzuty zostaną wycofane"
 LibyaFamily.46.b: "Wyślij mu pomoc prawną!"
 LibyaFamily.47.t: "Saif al-Arab podejrzany o przemyt broni"
 LibyaFamily.47.d: "The German prosecutor's office is charging Saif al-Arab with arms smuggling. Apparently, they have evidence that Saif helped smuggle a bag of assault rifles, a revolver and ammunition from Munich to Paris. This is a very serious claim."
 LibyaFamily.47.a: "Oczywiście zarzuty zostaną wycofane"
 LibyaFamily.47.b: "Wywrzeć nacisk dyplomatyczny na Niemców!"
 LibyaFamily.48.t: "Skonfiskowano Ferrari Saifa al-Araba"
 LibyaFamily.48.d: "Niemiecka policja skonfiskowała Ferrari Saifa al-Araba po tym, jak sąsiedzi skarżyli się na głośny hałas wydechu. Saif al-Arabowi postawiono teraz zarzuty naruszenia porządku publicznego."
 LibyaFamily.48.a: "Oczywiście zarzuty zostaną wycofane"
 LibyaFamily.48.b: "Wyślij mu pomoc prawną!"
 LibyaFamily.49.t: "Saif al-Arab umiera w więzieniu"
 LibyaFamily.49.d: "Chociaż Saif al-Arab był skazany za przestępstwa w Niemczech, udało mu się uniknąć kary więzienia, wracając do Libii. Jednak z nieznanych powodów ponownie odwiedził Niemcy. Niemieckiej policji udało się go schwytać i przewieziono do miejscowego więzienia w Monachium. Następnego dnia znaleziono go powieszonego w celi. Z oficjalnego oświadczenia niemieckiej policji wynika, że ​​było to samobójstwo, którego najbardziej prawdopodobną motywacją był wstyd, jaki Saif wyrządził swojej rodzinie. Istnieją jednak alternatywne teorie dotyczące możliwej zemsty współwięźniów lub nawet zainscenizowanego samobójstwa dokonanego przez niemiecki wywiad."
 LibyaFamily.49.a: "Saif al-Arab się nie zabił!"
 LibyaFamily.50.t: "Khamis Kaddafi kończy 18 lat"
 LibyaFamily.50.d: "Dziś były urodziny Chamisa Kaddafiego, najmłodszego syna Muammara Kaddafiego. W końcu skończył 18 lat i jest teraz gotowy, aby zacząć odgrywać większą rolę w rządzie libijskim."
 LibyaFamily.50.a: "Wszystkiego najlepszego z okazji urodzin!"
 khamis_gaddafi_unlock_decisions_tt: "§GNowy §YDecyzje§! dla Khamisa Kaddafiego są odblokowane!§!"
 LibyaFamily.51.t: "Katastrofa helikoptera Chamisa Kaddafiego"
 LibyaFamily.51.d: "Podczas podróży do pobliskiej bazy wojskowej helikopter, na którym leciał Khamis, uległ awarii. Helikopter rozbił się w pobliżu głównej autostrady, eksplodując kulą ognia i zabijając wszystkich pasażerów. Obiecujący przywódca wojskowy, jakim był Khamis, został teraz jedynie popiołem."
 LibyaFamily.51.a: "O nie"
 LibyaFamily.53.t: "Muammar Kaddafi poniża ONZ"
 LibyaFamily.53.d: "Gdy Muammar Kaddafi wspinał się na podium mówcy Zgromadzenia Ogólnego ONZ, niewielu wiedziało, czego się spodziewać. Zajęło mu 17 minut, zanim dotarł do najważniejszego punktu, jakim było wezwanie Afryki do zasiadania w Radzie Bezpieczeństwa. Wymachując kopią Karty ONZ, potępił stałe utworzenie Rady Bezpieczeństwa, która, jego zdaniem, zachęca do traktowania innych krajów jako „obywateli drugiej kategorii”.\n\n„To feudalizm polityczny dla tych, którzy mają stałe miejsce ...Nie należy jej nazywać Radą Bezpieczeństwa, należy ją nazywać Radą ds. Terroryzmu. Nie zapewniło nam bezpieczeństwa, ale terror i sankcje” – powiedział, wyrywając kartkę ze statutu w geście buntu.\n\n„Trwałość jest czymś wyłącznie dla Boga. Nie jesteśmy głupcami, dając prawo weta wielkim mocarstwom, aby mogły nas wykorzystać i traktować jak obywateli drugiej kategorii… Prawo weta powinno zostać unieważnione” – dodał, zanim przerzucił Kartę ONZ przez ramię. Zażądał także przeniesienia siedziby ONZ do Libii, dokładnego śledztwa w sprawie śmierci Johna F. Kennedy'ego i Martina Luthera Kinga, zaproponował połączenie Izraela i Palestyny ​​w Isratynę, świętował talibów, szerzył spiski w sprawie świńskiej grypy i żądał 7,7 biliona dolarów jako reparacje dla Afryki za kolonializm. W sumie zajęło mu pełne 90 minut, zanim zakończył swoje przemówienie, podczas gdy przemówienia trwają zwykle tylko około 15 minut.\n\nNasz wielki przywódca pokazał światu, że Libia jest jego prawdziwym panem!"
 LibyaFamily.53.a: "To z pewnością im pokazało!"
 LibyaFamily.54.t: "Muammar Kaddafi kończy swoje przemówienie"
 LibyaFamily.54.d: "Gdy Muammar Kaddafi wspinał się na podium mówcy Zgromadzenia Ogólnego ONZ, niewielu wiedziało, czego się spodziewać. Przez krótki czas gadał o tym, że Rada Bezpieczeństwa powinna mieć miejsce przeznaczone dla Afryki, jednocześnie poruszając tematy związane z kolonializmem, świńską grypą i Izraelem. Wydawało się, że obficie się poci, gdy próbował przebrnąć przez swoje kwestie, starając się utrzymać temat. Po 20 minutach poproszono go o przerwanie przemówienia, co też uczynił. Nieco niechętnie Muammar Kaddafi zszedł z podium, najwyraźniej mamrocząc o tym, że jest to „kolejny przykład prób Zachodu próbujących uciszyć rozwój Afryki”. Z pewnością było to przemówienie, ale prawdopodobnie nie wywołało takiego efektu, na jaki liczył Kaddafi."
 LibyaFamily.54.a: "Kaddafi musi popracować nad swoją charyzmą"
 LibyaFamily.55.t: "Muammar Kaddafi zszedł z podium"
 LibyaFamily.55.d: "As Muammar Gaddafi climbed up to the speaker's podium in the General Assembly of the UN, few knew what to expect. He started rambling about Zionism, calling the Security Council a terrorist organisation funded by Israel. He also mocked his fellow Arab leaders, calling them toys of the British. It wasn't long until a wave of booing began at the Assembly, with delegates calling for Gaddafi to stop his speech. Gaddafi, in response, called all the delegates idiots, and even threw a bottle of water towards the Israeli delegation. Shortly after this, the security dragged him off the podium, followed by cheers from the Assembly. As he was being dragged off, he was heard yelling 'Why are you booing me? I'm right!'. This has been a total disaster for Libya's image."
 LibyaFamily.55.a: "To nie poszło zgodnie z planem"
 LibyaFamily.56.t: "Ludzie rozumieją przesłanie Kaddafiego"
 LibyaFamily.56.d: "W południe Kaddafi w długiej konwoju pojazdów wyruszył w podróż po Trypolisie. Przechodząc przez dzielnice, wyrzucał na ulice duże ilości pieniędzy. W tym samym czasie przez głośniki mówiono o tym, jak międzynarodowe organizacje charytatywne marnują pieniądze, tak jak on marnuje pieniądze, wyrzucając je na ulicę.\n\nLudzie masowo zbierali pieniądze na ulicach, ale, co dziwne, wielu z nich odmówiło. Wygląda na to, że zrozumieli przesłanie Kaddafiego, że nie należy polegać na jałmużnie. Po wydarzeniu zaobserwowaliśmy wzrost ilości nadgodzin, które ludzie spędzają w pracy, a banki żywności odnotowują spadek tej liczby. Wygląda na to, że wszystkim, czego potrzebowali, był mały kopniak w plecy."
 LibyaFamily.56.a: "Libijczycy to ciężko pracujący naród"
 LibyaFamily.57.t: "Ludzie nie dostrzegają racji Kaddafiego"
 LibyaFamily.57.d: "W południe Kaddafi w długiej konwoju pojazdów wyruszył w podróż po Trypolisie. Przechodząc przez dzielnice, wyrzucał na ulice duże ilości pieniędzy. W tym samym czasie głośniki mówiły o tym, jak międzynarodowe organizacje charytatywne marnują pieniądze, tak jak on marnuje pieniądze, wyrzucając je na ulicę.\n\nLudzie masowo zbierali pieniądze z ulic i zaczęli je gromadzić. Po oczyszczeniu ulicy ludzie kontynuowali swoje codzienne zajęcia. Komunikat z głośników trafił w próżnię, bo ludzie chcieli się tylko szybko zarobić. Przynajmniej ludzie będą nieco szczęśliwsi z reżimem."
 LibyaFamily.57.a: "Chyba to dobra rzecz?"
 LibyaFamily.58.t: "Ludzie błędnie rozumieją przesłanie Kaddafiego"
 LibyaFamily.58.d: "At noon, Gaddafi embarked on a tour of Tripoli in a long motorcade of vehicles. As he was going through neighbourhoods, he threw large quantities of money on to the streets. At the same time, loudspeakers were talking about how international charities waste money, just like he wastes money by throwing it on the street.\n\nPeople came out in droves to collect money off the streets, and started hoarding the money. As soon as one part of the street was cleaned out, people continued following the motorcade in the hopes of more money. Ultimately thousands of people were walking behind the line of vehicles, collecting every coin they could find. Even more surprisingly, people came out even the following day, waiting for the non-existing motorcade to arrive again. A similar trend was noticed in some other Libyan cities as well. People now seem to expect that the government just hands them out money, and they have become considerably less motivated to work."
 LibyaFamily.58.a: "Czy nie rozumieli, że to alegoria? A może to była metafora?"
 LibyaFamily.59.t: "Samochód to dobry projekt"
 LibyaFamily.59.d: "After Muammar Gaddafi shared his ideas with Libyan engineers and consultants from European car manufacturers, the listeners congratulated the leader on his keen design sense. They were sure that Gaddafi's ideas could be implemented in practice successfully. However, not all of the ideas could be used in a single vehicle. What should be the main focus? Should we make a car that is sturdy and safe, a car that is made cheaply and meant for mass production for the people or a truck that can be used for military applications when needed. And of course, we need to pick a suitable name for the vehicle."
 LibyaFamily.59.a: "Samochód będzie mocny jak skała! Rakieta!"
 LibyaFamily.59.b: "Szybko zarobimy na samochodzie! Wiadro!"
 LibyaFamily.59.c: "Samochód pomieści mnóstwo rzeczy! Pakiet!"
 LibyaFamily.60.t: "Samochód to porażka"
 LibyaFamily.60.d: "After Muammar Gaddafi shared his ideas with Libyan engineers and consultants from European car manufacturers, the listeners were very skeptical of his idea. However, the production of the car went forward anyway. Shortly after at a car show in Libya, the Saroukh el-Jamahiriya (Libyan Rocket) was unveiled. Packed with a bunch of safety features, Gaddafi has dubbed the car the safest in the world. However, all of the safety features on the car are standard elements of any modern car. What is non-standard however, is the car's shape; both the front and rear bumpers are shaped like a wedge. The idea is that on collision, the car will simply be deflected away from anything it hits. While turning a car into a pinball might not be the safest road element, this might have some military uses."
 LibyaFamily.60.a: "Co to do diabła jest!?"
 LibyaFamily.61.t: "Samochód to katastrofa"
 LibyaFamily.61.d: "After Muammar Gaddafi shared his ideas with Libyan engineers and consultants from European car manufacturers, the listeners were very skeptical of his idea. However, the production of the car went forward anyway. Shortly after at a car show in Libya, the Saroukh el-Jamahiriya (Libyan Rocket) was unveiled. Dubbed by Gaddafi as the safest car in the world, the show continued with a live presentation of the car's unique wedge shape which would simply deflect anything the car collides with. As the car sped off on the test track, it ricocheted off the impact straight into the watching audience. As the car hit the safety barrier, it exploded in a ball of fire. Several people died due to the collision, and dozens were injured. Immediately after, there was a sudden drop in all new car sales the following week. People are refusing to buy new cars as they fear for their safety. If the safest new car is this unsafe, how bad are the others? People are even importing older cars from Central Africa to get their hands on something old and reliable. This increase in old cars on the roads has actually worsened Libya's traffic accidents and fatalities."
 LibyaFamily.61.a: "Dlaczego miałbyś sprawić, że samochód będzie spiczasty!?"
 LibyaFamily.62.t: "Udana wizyta państwowa"
 LibyaFamily.62.d: "When Muammar Gaddafi landed in [?libya_state_visit_target.GetNameDef], he brought along with him his massive Bedouin tent, which he set up in a park in the country's capital. With him were his bodyguard, an entourage of ministers, luxury cars and a small herd of camels so he could drink their milk every morning. While originally, it was planned for Gaddafi to meet [?libya_state_visit_target.GetName]'s leader in a more official setting, eventually [?libya_state_visit_target.GetLeader] caved in to Gaddafi's demands to have the meeting in his tent. While various business and Libya's future was discussed, nothing fruitful was achieved. However, this humiliation of a foreign head of state has increased Gaddafi's standing in the world and at home."
 LibyaFamily.62.a: "W końcu Kaddafi cieszy się szacunkiem, na jaki zasługuje"
 LibyaFamily.63.t: "Przeciętna wizyta państwowa"
 LibyaFamily.63.d: "When Muammar Gaddafi landed in [?libya_state_visit_target.GetNameDef], he brought along with him his massive Bedouin tent, which he set up in a park in the country's capital. With him were his bodyguard, an entourage of ministers, luxury cars and a small herd of camels so he could drink their milk every morning. While Gaddafi wanted to have all meetings inside his tent, his host [?libya_state_visit_target.GetLeader] wasn't as eager to do so. Eventually Gaddafi caved in and had all the meetings in a nearby luxury hotel. While various business and Libya's future was discussed, nothing fruitful was achieved. However, this show of luxury has given Gaddafi a small boost at home."
 LibyaFamily.63.a: "Chyba w Rzymie"
 LibyaFamily.64.t: "Straszna wizyta państwowa"
 LibyaFamily.64.d: "When Muammar Gaddafi landed in [?libya_state_visit_target.GetNameDef], he brought along with him his massive Bedouin tent with the intention of setting it up in a local park. The local authorities however disallowed the tent from being raised however, and Gaddafi was guided to a local hotel. Gaddafi refused to do so, demanding that it is customary to his people to hold meeting in a tent. The person he was supposed to be meeting, [?libya_state_visit_target.GetLeader], eventually cancelled all meetings as Gaddafi refused to budge his stance. This trip has been worthless and the world has seen that the 'Mad Dog' of Libya seems to be completely toothless."
 LibyaFamily.64.a: "Ale wstyd"
 LibyaFamily.65.t: "Potężny rytuał"
 LibyaFamily.65.d: "As Muammar Gaddafi had gathered some of his elite troops in a courtyard in Tripoli, a Senegalese marabout took position in front of the troops. Writing incantations and strange symbols on a piece of paper, the paper was covered with dried lion's skin, plants that grow in cemeteries and bark from a tree where a man had died. Wrapping everything together in a neat package, the offering was put on hot red coals to slowly burn and smoke. The Libyan soldiers were ordered to walk one by one over the smoke, allowing the smoke to penetrate their vitality. Shortly after, the marabout started invoking the spirits to give strength to the soldiers. In a trance like state, the soldiers started repeating 'God...Libya...Gaddafi'. As the ritual was over, the soldiers were bloodthirsty, vigorous and ready to fight until their last breath. Libya is saved!"
 LibyaFamily.65.a: "Co, kurwa?"
 LibyaFamily.66.t: "Orzeźwiający rytuał"
 LibyaFamily.66.d: "As Muammar Gaddafi had gathered some of his elite troops in a courtyard in Tripoli, a Senegalese marabout took position in front of the troops. Writing incantations and strange symbols on a piece of paper, the paper was covered with dried lion's skin, plants that grow in cemeteries and bark from a tree where a man had died. Wrapping everything together in a neat package, the offering was put on hot red coals to slowly burn and smoke. The Libyan soldiers were ordered to walk one by one over the smoke, allowing the smoke to penetrate their vitality. The soldiers did as they were ordered, though most of them looked very confused. After the marabout had invoked spirits to give strength to the soldiers, the ceremony was over. The soldiers weren't sure what to think, but at least they were happy knowing that their leader is willing to do anything to make them win."
 LibyaFamily.66.a: "Lepsze niż nic"
 LibyaFamily.67.t: "Nieudany rytuał"
 LibyaFamily.67.d: "As Muammar Gaddafi had gathered some of his elite troops in a courtyard in Tripoli, a Senegalese marabout took position in front of the troops. Writing incantations and strange symbols on a piece of paper, the paper was covered with dried lion's skin, plants that grow in cemeteries and bark from a tree where a man had died. Wrapping everything together in a neat package, the offering was put on hot red coals to slowly burn and smoke. The Libyan soldiers were ordered to walk one by one over the smoke. However, nobody stepped forward. The soldiers started calling the marabout a heathen, saying that such calling upon of the Jinn was heretical and against Islam. The whole situation quickly got out of hand, with Gaddafi and the marabout both having to escape the courtyard in panic from the wrath of the angry soldiers. Many of the soldiers dropped their uniforms and deserted right there. Word of the ritual quickly spread across the military, and our soldiers have begun losing faith in our leader left and right."
 LibyaFamily.67.a: "To miała być po prostu magiczna sztuczka!"
 LibyaFamily.68.t: "Kobiety Podekscytowane Wykładem"
 LibyaFamily.68.d: "Gaddafi had decided to organise his lecture in Rome, while he was visiting Italy. He had sent a request to an Italian hospitality agency to invite hundreds of attractive women aged 18 to 35 (and at least 1.7 meters tall) to come to his mysterious lecture. The women were advised to not wear miniskirts or plunging necklines due to the piety of the event. When the women were gathered in the lecture hall, Gaddafi arrived clad in all black, and began his lecture. Gaddafi's all-female staff handed out copies of the Koran to the women, while Gaddafi himself lectured on Islam, the failure of Christianity and the role of women in the West. Gaddafi's words seemed to resonate with a lot of the women, as directly after the lecture several women already told him they'd like to convert to Islam. The event quickly attracted global media attention, and it has caused a wave of women converting to Islam and travelling to Libya to see the land where women can truly be free."
 LibyaFamily.68.a: "Islam naprawdę jest religią dla kobiet"
 LibyaFamily.69.t: "Przeciętny wykład"
 LibyaFamily.69.d: "Gaddafi had decided to organise his lecture in Rome, while he was visiting Italy. He had sent a request to an Italian hospitality agency to invite hundreds of attractive women aged 18 to 35 (and at least 1.7 meters tall) to come to his mysterious lecture. The women were advised to not wear miniskirts or plunging necklines due to the piety of the event. When the women were gathered in the lecture hall, Gaddafi arrived clad in all black, and began his lecture. Gaddafi's all-female staff handed out copies of the Koran to the women, while Gaddafi himself lectured on Islam, the failure of Christianity and the role of women in the West. The lecture got mixed reception from the women, with one attendee calling it 'a very interesting experience', while another commented by saying 'I feel very offended with regard to my religion'. The lecture however has caused a small boost to immigration to Libya."
 LibyaFamily.69.a: "Przynajmniej słuchali"
 LibyaFamily.70.t: "Wykład wywołuje oburzenie"
 LibyaFamily.70.d: "Gaddafi had decided to organise his lecture in Rome, while he was visiting Italy. He had sent a request to an Italian hospitality agency to invite hundreds of attractive women aged 18 to 35 (and at least 1.7 meters tall) to come to his mysterious lecture. The women were advised to not wear miniskirts or plunging necklines due to the piety of the event. When the women were gathered in the lecture hall, Gaddafi arrived clad in all black, and began his lecture. Gaddafi's all-female staff handed out copies of the Koran to the women, while Gaddafi himself lectured on Islam, the failure of Christianity and the role of women in the West. By the end of the lecture, many women were booing Gaddafi. One attendee commented that 'they'd never been so insulted in their life'. Many are calling Gaddafi's view on women oppressive and his lecture as nothing more than a thin-veiled trick to meet beautiful young women. News of the event has also spread to Libya, where many women are planning to leave the country as they do not want to live in a country ruled by such a misogynist."
 LibyaFamily.70.a: "Kto by pomyślał, że kobiety mają taki temperament?"
 LibyaFamily.71.t: "[FROM.GetNameDef] wzywa do demontażu [SWI.GetNameDef]"
 LibyaFamily.71.d: "The Libyan leader, Muammar Gaddafi, has called for the Swiss state to be dismantled. He is saying that Switzerland is just an artificial state made up of Italians, Germans and French people. Gaddafi has contacted all three surrounding countries and has asked us to join him in this statement of Swiss artificiality."
 LibyaFamily.71.a: "Szwajcaria nie powinna istnieć"
 LibyaFamily.71.b: "Szwajcaria jest suwerennym państwem!"
 LibyaFamily.72.t: "[FROM.GetNameDef] popiera nasze oświadczenie"
 LibyaFamily.72.d: "Rząd [FROM.GetAdjective] zdecydował się poprzeć nasze oświadczenie w sprawie rozpadu Szwajcarii."
 LibyaFamily.72.a: "Świetnie"
 LibyaFamily.73.t: "[FROM.GetNameDef] potępia nasze oświadczenie"
 LibyaFamily.73.d: "Rząd [FROM.GetAdjective] postanowił potępić nasze oświadczenie w sprawie rozpadu Szwajcarii, stwierdzając, że Szwajcaria jest suwerennym narodem i należy szanować jego suwerenność."
 LibyaFamily.73.a: "Tchórze"
 LibyaFamily.74.t: "[FROM.GetNameDef] Calls For Our Destruction"
 LibyaFamily.74.d: "The [FROM.GetAdjective] leader Muammar Gaddafi has released a statement saying that Switzerland should not exist. They have also asked our neighbouring countries to join in on this statement. This statement is most likely the result of one of Gaddafi's children being arrested by Swiss police."
 LibyaFamily.74.a: "Mamy prawo istnieć!"
 LibyaCivilWar.1.t: "LNDF rozwija się w Libii"
 LibyaCivilWar.1.d: "LNDF ([socialism_L]) to grupa opozycyjna z siedzibą w USA. Do tej pory działali głównie w Stanach Zjednoczonych. Jednak od początku protestów przeciwko rządowi Kaddafiego znalazły one znacznie więcej zwolenników w samej Libii. Coraz więcej Libijczyków zaczyna sympatyzować z ich sprawą i pragnie, aby Stany Zjednoczone interweniowały w Libii przeciwko Kaddafiemu."
 LibyaCivilWar.1.a: "Ameryka nie ma tu nic do rzeczy"
 LibyaCivilWar.2.t: "Infiltracja komunistyczna"
 LibyaCivilWar.2.d: "The [communist_state_L] has been non-existent ever since both the Kingdom of Libya and Gaddafi's Libya cracked down on the party. Marxism in Libya has its roots in Italy, where many of the communists moved to exile during the crackdowns, organising the party as secret societies. With Gaddafi losing grasp of the country, some of these societies have started operating more openly, campaigning for the implementation of Marxism in Libya."
 LibyaCivilWar.2.a: "Musimy oczyścić wszystkich chorych, którzy mówią o komunizmie i ateizmie"
 LibyaCivilWar.3.t: "Żołnierze uciekają przed ekstremistami"
 LibyaCivilWar.3.d: "Czując słabnącą władzę rządu, wielu naszych żołnierzy zdecydowało się przejść na stronę ekstremisty [Caliphate_L]. Zaraz po rozpoczęciu protestów przeciwko Kaddafiemu ugrupowanie nasiliło swoją działalność powstańczą."
 LibyaCivilWar.3.a: "Zdrajcy!"
 LibyaCivilWar.4.t: "NFSL wzywa do jedności wśród rebeliantów"
 LibyaCivilWar.4.d: "[Neutral_conservatism_L] wezwał do jedności wśród protestujących i rebeliantów przeciwko Kaddafiemu. Stwierdzili, że wszystkie partie opozycyjne powinny dołączyć do kierowanej przez nie Krajowej Konferencji Opozycji Libijskiej, aby zmaksymalizować potencjał w walce z Kaddafim. Kilka mniejszych partii i organizacji ogłosiło już, że będzie współpracować z NFSL."
 LibyaCivilWar.4.a: "Posypanie ziarenek piasku nie spowoduje powstania skały!"
 LibyaCivilWar.5.t: "Baasiści wzywają do demokracji"
 LibyaCivilWar.5.d: "In a surprising move, the [Nat_Fascism_L] has publicly demanded free and fair elections in Libya. We are not sure if this is just a publicity stunt, or if they have actually abandoned their way of extreme Ba'athism. Regardless, this has given them quite a bit of support."
 LibyaCivilWar.5.a: "Oni kłamią!"
 LibyaCivilWar.6.t: "Armia ignoruje protestujących"
 LibyaCivilWar.6.d: "W dużym mieście w Libii armia libijska otrzymała rozkaz rozproszenia protestujących. Dowódca lokalnej jednostki odmówił i pozwolił na kontynuację protestów, osłaniając nawet protestujących przed Korpusem Strażników Rewolucji. Wygląda na to, że podziały, które stworzyliśmy pomiędzy regularną armią a RGC, zaczynają być widoczne."
 LibyaCivilWar.6.a: "Powinni zrobić, co im się każe!"
 LibyaCivilWar.7.t: "Korpus Strażników Rewolucji ignoruje protestujących"
 LibyaCivilWar.7.d: "W dużym mieście w Libii Korpus Strażników Rewolucji otrzymał rozkaz rozproszenia protestujących. Dowódca lokalnej jednostki odmówił i pozwolił na kontynuację protestów, nawet osłaniając protestujących przed regularnymi oddziałami armii libijskiej. Wygląda na to, że podziały, które stworzyliśmy pomiędzy regularną armią a RGC, zaczynają być widoczne."
 LibyaCivilWar.7.a: "Powinni zrobić, co im się każe!"
 LibyaCivilWar.8.t: "Kampanie rodziny królewskiej przeciwko Kaddafiemu"
 LibyaCivilWar.8.d: "Libijska rodzina królewska na wygnaniu rozpoczęła kampanię i zbierała fundusze przeciwko Kaddafiemu. Podróżują po Europie, spotykają się z politykami, prosząc NATO o interwencję w kraju, aby zapewnić bezpieczeństwo protestującym. Widziano wielu protestujących machających flagami dawnego Królestwa Libii i niosących portrety króla Idrisa I."
 LibyaCivilWar.8.a: "To nic innego jak marionetki Zachodu!"
 LibyaCivilWar.9.t: "Minister rządu składa rezygnację"
 LibyaCivilWar.9.d: "Na znak protestu przeciwko sposobowi, w jaki rząd radzi sobie z protestami, jeden z naszych ministrów zrezygnował ze stanowiska i postanowił przyłączyć się do rebeliantów."
 LibyaCivilWar.9.a: "Co?"
 LibyaCivilWar.10.t: "Wady ambasadora zagranicznego"
 LibyaCivilWar.10.d: "Jeden z naszych ambasadorów za granicą złożył rezygnację i uciekł do kraju goszczącego. Zabrali ze sobą kilka kluczowych dokumentów i tajemnic rządowych."
 LibyaCivilWar.10.a: "Święte teksty!"
 LibyaCivilWar.11.t: "Wady Jednostki Wojskowej"
 LibyaCivilWar.11.d: "One of our military units has defected and joined the side of the protestors. The unit commander said that he will not hurt his fellow Libyans."
 LibyaCivilWar.11.a: "Tchórze!"
 LibyaCivilWar.12.t: "Napad na zapasy wojskowe"
 LibyaCivilWar.12.d: "Protestujący przy pomocy życzliwych jednostek wojskowych włamali się do składów broni wojskowej i ukradli dużą kolekcję broni."
 LibyaCivilWar.12.a: "To było przeznaczone dla moich żołnierzy!"
 LibyaCivilWar.13.t: "Ucieczka pilotów na Maltę"
 LibyaCivilWar.13.d: "Kilku libijskich pilotów wystartowało swoimi odrzutowcami i poleciało na Maltę, prosząc o azyl. Odmówili bombardowania celów cywilnych na polecenie rządu i zdecydowali się opuścić kraj."
 LibyaCivilWar.13.a: "Czy możemy odzyskać odrzutowce?"
 LibyaCivilWar.14.t: "Zatopiony statek marynarzy"
 LibyaCivilWar.14.d: "Załoga jednego z naszych okrętów wojennych postanowiła zatopić statek, na którym służyli. Odmawiając użycia broni przeciwko protestującym, skierowali statek na pobliski brzeg i załadowali go materiałami wybuchowymi. Po tym, jak statek zamienił się w płonący wrak, ogłosili swoje poparcie dla protestujących."
 LibyaCivilWar.14.a: "Te rzeczy są drogie!"
 LibyaFocusNews.1.t: "Zamordowano libijską głowę państwa"
 LibyaFocusNews.1.coup.d: "Dramatyczne wieści nadeszły dziś z Libii, gdy przywódca kraju został zamordowany przez radykała [LBA.Caliphate_L]. Konwój przywódcy został zaatakowany na pustyni libijskiej w wyniku nalotu islamistów. Po udanym zamachu bojownicy grupy szybko zajęli kluczowe budynki rządowe w Trypolisie i Bengazi. Z braku wyraźnego przywódcy istniejący reżim nie był w stanie zorganizować żadnego oporu. Emir [LBA.Caliphate_L], [LBA.GetLeader] ogłosił się władcą kraju. To niewątpliwie spowoduje większą niestabilność w regionie."
 LibyaFocusNews.1.civilwar.d: "Dramatyczne wieści nadeszły dziś z Libii, gdy przywódca kraju został zamordowany przez radykała [LBA.Caliphate_L]. Konwój przywódcy został zaatakowany na pustyni libijskiej w wyniku nalotu islamistów. Po udanym zamachu bojownicy grupy szybko zajęli kluczowe budynki rządowe w Trypolisie i Bengazi. Jednak zwolennicy starego reżimu szybko zdołali stworzyć siłę przeciwną do walki z zamachem stanu. Emir [LBA.Caliphate_L], [LBA.GetLeader] ogłosił się władcą kraju i oświadczył, że z pomocą Boga wierni Libijczycy wyjdą zwycięsko. Zwycięstwo islamistów niewątpliwie spowodowałoby większą niestabilność w regionie."
 LibyaFocusNews.1.a: "Ciekawy"
 LibyaFocusNews.2.t: "Duchowieństwo przejmuje kontrolę nad [FROM.GetNameDef]"
 LibyaFocusNews.2.d: "Rząd [FROM.GetAdjective] ogłosił dziś radykalną zmianę w istniejącej strukturze władzy w kraju. Powołując się na potrzebę bardziej stabilnej i jednoczącej obecności, urząd [FROM.GetAdjective] Wielkiego Muftiego został podniesiony do rangi „Najwyższego Autorytetu Moralnego i Społecznego” w kraju. W istocie sprawia to, że Wielki Mufti ma duży wpływ na politykę kraju, podobnie jak irański ajatollah. Niektórzy niepokoją się tą zmianą, ponieważ podejrzewa się, że obecny mufti [LBA.GetLeader] żywi pewne sympatie dla bardziej radykalnych elementów islamu."
 LibyaFocusNews.2.a: "Ciekawy"
 LibyaFocusNews.3.t: "[FROM.GetNameDef] Ogłoszono"
 LibyaFocusNews.3.d: "Przywódca Libii, [FROM.GetLeader], ogłosił dziś utworzenie [FROM.GetNameDef]. Motywowany istniejącą rebelią islamistów w Sahelu i Saharze, [FROM.GetLeader] planuje zjednoczyć różne frakcje i „przynieść pokój muzułmanom, których Zachód i Amerykanie pozbawili praw”. To jasny sygnał dla krajów w regionie, że [FROM.GetNameDef] nie jest po ich stronie."
 LibyaFocusNews.3.a: "Ciekawy"
 LibyaFocusNews.4.t: "[FROM.GetNameDef] Przyjmuje reformę"
 LibyaFocusNews.4.d: "The [FROM.GetAdjective] head of state [FROM.GetLeader] has announced plans to reduce the power of the Revolutionary Committees in the country. The Revolutionary Committees were created as an authority to prevent the spread of counter-revolutionary ideals after Muammar Gaddafi took power in the country. In practice, the Committees have controlled the pseudo-democratic People's Congresses that in theory are supposed to run the country. The Committees have now been sidelined from the political process, allowing the People's Congresses to operate more freely. This change will move [FROM.GetNameDef] towards a more democratic society."
 LibyaFocusNews.4.a: "Ciekawy"
 LibyaFocusNews.5.t: "[FROM.GetLeader] Zwiększa kontrolę nad [FROM.GetNameDef]"
 LibyaFocusNews.5.d: "The [FROM.GetAdjective] head of state [FROM.GetLeader] has announced plans to reform the country's political system. Stating that the existing People's Congresses have been infiltrated by foreign agents, a decision has been made to shut them down. The Revolutionary Committees responsible for preventing the spread of counter-revolutionary ideas in the country will be responsible for 'screening and verifying' all current and future members of the Congresses until the '[FROM.GetAdjective] political space has been made safe for the citizens'. It is predicted that this change is in fact permanent, and any remaining traces of democracy are being stamped out of [FROM.GetNameDef]."
 LibyaFocusNews.5.a: "Ciekawy"
 LibyaFocusNews.6.t: "[FROM.GetNameDef] Vows To Protect Sahelian Minorities"
 LibyaFocusNews.6.d: "Na wczorajszej konferencji prasowej przywódca [FROM.GetAdjective] [FROM.GetLeader] obiecał, że [FROM.GetNameDef] dołoży wszelkich starań, aby zapewnić ochronę mniejszości regionalnych na Saharze i Sahelu. Mówiąc głównie o Tuaregach i Toubou, [FROM.GetLeader] podkreślił, że ciągła niestabilność i polityka segregacji prowadzona przez kraje w regionie będzie wywierać presję na [FROM.GetNameDef], aby podjął działania przeciwko wspomnianym krajom."
 LibyaFocusNews.6.a: "Ciekawy"
 LibyaFocusNews.7.t: "[FROM.GetNameDef] Dołącza do wojny z terroryzmem"
 LibyaFocusNews.7.d: "The [FROM.GetAdjective] government announced today that it would be joining [USA.GetNameDef] on their global war against terrorism. Together with their European partners, [FROM.GetNameDef] would organise a fight against Islamism in the Sahara and Sahel."
 LibyaFocusNews.7.a: "Ciekawy"
 LibyaFocusNews.8.t: "Ogłoszono Porozumienia z Casablanki"
 LibyaFocusNews.8.d: "Rząd [FROM.GetAdjective] zapowiedział konferencję pokojową w sprawie statusu Sahary Zachodniej. Na spotkanie zaproszono Maroko, Algierię, Mauretanię oraz przedstawicieli Frontu POLISARIO. [FROM.GetLeader] ma ambitny cel, jakim jest znalezienie rozwiązania zamrożonego konfliktu."
 LibyaFocusNews.8.a: "Ciekawy"
 LibyaFocusNews.9.t: "[FROM.GetNameDef] Uchyla orzeczenie MTS"
 LibyaFocusNews.9.d: "Po zakończeniu wojny Toyoty między Libią a Czadem w 1987 r. Międzynarodowy Trybunał Sprawiedliwości orzekł, że sporny obszar Strefy Aouzou między obydwoma krajami jest legalnie Czadem. Po wyroku Libia szybko wycofała się z tego obszaru. Teraz lider [FROM.GetAdjective] [FROM.GetLeader] uchylił tę decyzję, stwierdzając, że [FROM.GetNameDef] zastosował się do orzeczenia jedynie pod groźbą i presją międzynarodową. Teraz ponownie zgłosili roszczenia do tego terytorium."
 LibyaFocusNews.9.a: "Ciekawy"
 LibyaFocusNews.10.t: "[CHA.GetNameDef] Strip Cedes Aouzou"
 LibyaFocusNews.10.d: "Wczoraj rząd [LBA.GetAdjective] skierował ultimatum do [CHA.GetNameDef]; Wycofaj wszystkie siły ze Strefy Aouzou i oficjalnie przekaż terytorium [LBA.GetNameDef], w przeciwnym razie czeka Cię interwencja wojskowa. W zasadniczo beznadziejnej sytuacji rząd [CHA.GetAdjective] zgodził się oddać terytorium [LBA.GetNameDef]."
 LibyaFocusNews.10.a: "Ciekawy"
 LibyaFocusNews.11.t: "[CHA.GetNameDef] sprzeciwia się wymaganiom [LBA.GetAdjective]."
 LibyaFocusNews.11.d: "Wczoraj rząd [LBA.GetAdjective] skierował ultimatum do [CHA.GetNameDef]; Wycofaj wszystkie siły ze Strefy Aouzou i oficjalnie przekaż terytorium [LBA.GetNameDef], w przeciwnym razie czeka Cię interwencja wojskowa. Rząd [CHA.GetAdjective] odrzucił wszelkie żądania, twierdząc, że przestrzegają one granic międzynarodowych uznanych przez społeczność międzynarodową. Jest prawdopodobne, że doprowadzi to do konfliktu między obydwoma narodami. Jednakże [CHA.GetName] pokonał już wcześniej [LBA.GetAdjective], może uda im się to zrobić ponownie."
 LibyaFocusNews.11.a: "Ciekawy"
 LibyaFocusNews.12.t: "[FROM.GetLeader] Przysięga zniszczyć kolonializm"
 LibyaFocusNews.12.d: "Wczoraj na Zgromadzeniu Ogólnym ONZ przywódca [FROM.GetAdjective] [FROM.GetLeader] ogłosił, że utworzy międzynarodową „Oś dobra” do walki z kolonializmem amerykańskim i syjonistycznym. [FROM.GetLeader] zaprosił wszystkich swoich antykolonialistów do przyłączenia się do ich nowego sojuszu, a oni obiecali, że Zachód zapłaci za ich kolonialną historię."
 LibyaFocusNews.12.a: "Ciekawy"
 LibyaFocusNews.13.t: "[FROM.GetNameDef] Zajmuje Sokotrę"
 LibyaFocusNews.13.d: "W niespodziewanym ruchu wrogości siły specjalne [FROM.GetAdjective] dyskretnie wylądowały i zajęły kluczowe obiekty na wyspie Socotra, odbierając je spod kontroli [YEM.GetAdjective]. [YEM.GetNameDef] potępił już ten akt naruszenia ich suwerenności, ale okaże się, jaka będzie ich reakcja."
 LibyaFocusNews.13.a: "Ciekawy"
 LibyaFocusNews.14.t: "Wojna domowa w Libii"
 LibyaFocusNews.14.d: "What started out as protest against [LBA.GetLeader]'s rule, has developed into a full armed conflict. The protests started in the Eastern part of the country, with people demanding more political freedom and improved living conditions. While Libya has the highest GDP per capita in Africa and one of the best HDI's in the world, one third of Libyans still live under the poverty line and oil profits from the country's vast oil reserves mainly fall into the regime's pockets. The protests turned violent as [LBA.GetLeader] ordered the military to intervene, and soon people were up in arms. The rebels have formed [LRB.GetNameDef], which will serve as a transitional authority until [LBA.GetLeader] lays down his arms and surrenders."
 LibyaFocusNews.14.a: "Ciekawy"
 LibyaFocusNews.15.t: "Koniec wojny domowej w Libii"
 LibyaFocusNews.15.LBA.d: "The civil war in Libya has come to a close. Despite strong resistance from the rebels, [FROM.GetLeader] has managed to wrest back control of the country. It is likely that this will lead into further crackdowns in the [LBA.GetAdjective] society."
 LibyaFocusNews.15.LRB.d: "Wojna domowa w Libii dobiegła końca. Rebeliantom udało się pokonać siły reżimu, a [FROM.GetLeader] nakreślił już plany dalszego rozwoju kraju. To zmieniło nową stronę dla [FROM.GetNameDef]."
 LibyaFocusNews.15.a: "Ciekawy"
 LibyaFocusNews.16.t: "Porozumienia z Casablanki dochodzą do skutku"
 LibyaFocusNews.16.annex.d: "When [LBA.GetLeader] announced they would be holding an international meeting for solving the status of Western Sahara, many were skeptical. However, it seems that the accords have reached some kind of conclusion. In their declaration, dubbed the [GetYear] Casablanca Agreement, they outline the plan of officially integrating Western Sahara into Morocco. After studying historical documents, the accords came to a conclusion that legally Western Sahara is Moroccan territory. Whether or not [SHA.GetNameDef] will accept this decision, is uncertain at this point."
 LibyaFocusNews.16.autonomy.d: "When [LBA.GetLeader] announced they would be holding an international meeting for solving the status of Western Sahara, many were skeptical. However, it seems that the accords have reached some kind of conclusion. In their declaration, dubbed the [GetYear] Casablanca Agreement, they outline the plan to annex Western Sahara to Morocco while allowing the Sahrawis to still hold significant autonomy. There is a clear agreement that Western Sahara will be allowed to have their military and direct control of their internal politics, while Morocco will be responsible for the region's international relations, including defence against external threats."
 LibyaFocusNews.16.independence.d: "When [LBA.GetLeader] announced they would be holding an international meeting for solving the status of Western Sahara, many were skeptical. However, it seems that the accords have reached some kind of conclusion. In their declaration, dubbed the [GetYear] Casablanca Agreement, the signatories outline a clear support for the full independence of Western Sahara. The Accords clearly saw that the Western Saharan desire for independence overrules any possible historical records that would legally make the area Moroccan. Whether or not [MOR.GetNameDef] will accept this decision, is uncertain at this point."
 LibyaFocusNews.16.mauritania.d: "When [LBA.GetLeader] announced they would be holding an international meeting for solving the status of Western Sahara, many were skeptical. However, it seems that the accords have reached some kind of conclusion. In their declaration, dubbed the [GetYear] Casablanca Agreement, they declare that Western Sahara is legally Mauritanian. After studying historical documents and past diplomatic agreements, from their point of view it is clear that Mauritania should hold the territory. Whether or not [MOR.GetNameDef] and [SHA.GetNameDef] will accept this decision, is uncertain at this point."
 LibyaFocusNews.16.a: "Ciekawy"
 LibyaFocusNews.17.t: "Porozumienia z Casablanki nie dochodzą do skutku"
 LibyaFocusNews.17.d: "When [LBA.GetLeader] announced they would be holding an international meeting for solving the status of Western Sahara, many were skeptical. That skepticism was well placed, after a year of negotiations, no tangible results have been achieved. Frustrated with the process, [LBA.GetLeader] has called the accords to be ended. It seems that Western Sahara will remain a contested area even in the future."
 LibyaFocusNews.17.a: "Ciekawy"
 LibyaFocusNews.18.t: "Porozumienia w Casablance rozpadają się"
 LibyaFocusNews.18.d: "When [LBA.GetLeader] announced they would be holding an international meeting for solving the status of Western Sahara, many were skeptical. That skepticism was well placed, as serious disagreements between the partaking countries have forced the accords to be ended early. Several delegations already abandoned the accords in discontent as they felt that their needs weren't being heard. This has certainly been an embarrassment to [LBA.GetLeader]."
 LibyaFocusNews.18.a: "Ciekawy"
 LibyaFocusNews.19.t: "[ENG.GetAdjective] Interwencja w Libii"
 LibyaFocusNews.19.d: "After the assassination attempt of the Libyan royal family in [ENG.GetNameDef], the [ENG.GetAdjective] government demanded immediate compensation and apology from the [LBA.GetAdjective] government. [ENG.GetNameDef] had discovered that [LBA.GetNameDef] had strong links to the terror attack. As no apology or compensation arrived, [ENG.GetNameDef] considered this an attack against the nation. Still bearing the scars of the Lockerbie bombing, [ENG.GetNameDef] has had no choice but to topple the [LBA.GetAdjective] government in order to stop further attacks."
 LibyaFocusNews.19.a: "Ciekawy"
 LBA_mining_in_aouzou: "Górnictwo W Aouzou"
 LBA_mining_in_aouzou_desc: "Po zabezpieczeniu pasma Aouzou możemy teraz rozpocząć wydobycie tego słodkiego uranu z ziemi."
 LBA_mining_in_aouzou_tt_1: "Jeśli posiadamy §Y$STATE_580$§!:\n"
 LBA_mining_in_aouzou_tt_2: "Jeśli [CHA.GetNameWithFlag] zgodził się na wspólne wydobywanie:\n"
 LBA_gmmr_jaghbub: "GMMR Jaghbub"
 LBA_gmmr_jaghbub_desc: "Na wschodzie kraju, tuż przy granicy z Egiptem, na południe od Tobruku, znajduje się małe miasteczko Jaghbub. Obszar ten jest naturalną oazą położoną na szczycie warstwy wodonośnej. Budując tu studnię, możemy doprowadzić świeżą wodę do Tobruku."
 aozou_strip_occupation_decisions: "Zajęcie pasa Aouzou"
 aozou_strip_occupation_decisions_desc: "Ponieważ pas Aouzou jest obszarem spornym między nami a naszym sąsiadem, chaos, który tam panuje, może pozwolić nam przejąć kontrolę nad tym regionem."
 generic_occupy_aouzou_strip: "Zajmijcie pas Aouzou"
 generic_occupy_aouzou_strip_desc: "[580.owner.GetNameDef] obecny status sprawia, że ​​nie są w stanie skutecznie rozszerzyć kontroli nad [580.GetName]. Powinniśmy wysłać mały kontyngent wojsk, aby zabezpieczyć ten obszar. Jest mało prawdopodobne, że [580.owner.GetName] będą stawiać opór."
 generic_occupy_aouzou_strip_tt: "§R[580.owner.GetNameDef] może wypowiedzieć nam wojnę!§!"
 LibyaFocus.104.t: "[FROM.GetNameDef] Zajmuje [580.GetName]"
 LibyaFocus.104.d: "With our security forces occupied elsewhere, the deserts of the [580.GetName] are basically unpatrolled. Taking advantage of this power vacuum, [FROM.GetNameDef] has sent a small contingent of troops to set up a small base in the town of Aozou. With the [FROM.GetAdjective] flag flying in the center of Aouzou town, [FROM.GetNameDef] has claimed the entire area for themselves."
 LibyaFocus.104.a: "Nie ma nic, co moglibyśmy zrobić"
 LibyaFocus.104.b: "Oni za to zapłacą!"
 LBA_start_building_reactor_threat: "[LBA.GetAdjective]Program nuklearny"
 LBA_support_south_sudan: "Wesprzyj[SSU.GetName]"
 LBA_support_south_sudan_desc: "Before Omar al-Bashir took power in Sudan, we supported the SPLA in the south. Al-Bashir, while quite friendly with us, is not the best bedfellow. His international reputation is abysmal, and it is only a matter of time before he loses power. Maybe we should instead switch back to supporting [SSU.GetNameDef]?"
 LBA_send_mercenaries_tt_3: "Jeśli ukończyliśmy fokus §Y$LBA_support_south_sudan$§!:\n"
 LibyaFocus.105.t: "[FROM.GetAdjective] Aresztowano naukowca zajmującego się energią jądrową"
 LibyaFocus.105.d: "W ramach swojego programu rozbrojenia nuklearnego urzędnicy [FROM.GetAdjective] opublikowali dokumenty wskazujące na obywatela [ROOT.GetAdjective], Friedricha Tinner, jako zaangażowanego w ich program nuklearny. Tinner studiował i pracował pod okiem głównego pakistańskiego naukowca nuklearnego Abdula Qadeera Khana, zanim został zaproszony przez Muammara Kaddafiego do kierowania libijskim programem nuklearnym w latach 80. Jednak Tinner nie mógł osiągnąć większego sukcesu z powodu braku libijskiego doświadczenia akademickiego i technicznego, nawet z pomocą Khana.\n\nTinner został teraz przez nas aresztowany i czeka na swój los w areszcie. Co powinniśmy z nim zrobić?"
 LibyaFocus.105.a: "Zamknij go"
 LibyaFocus.105.b: "Naukowiec zajmujący się energią jądrową, mówisz?"
 LibyaFocus.105.c: "Ten człowiek jest niewinny, pozwólcie mu odejść"
 LibyaFocus.106.t: "[FROM.GetNameDef] Więzienia Tinner"
 LibyaFocus.106.d: "Władze [FROM.GetAdjective] postanowiły uwięzić Friedricha Tinera za jego udział w przemycie materiałów do broni jądrowej do Libii i pomoc krajowi objętemu sankcjami międzynarodowymi. Jest mało prawdopodobne, że kiedykolwiek go jeszcze zobaczymy."
 LibyaFocus.106.a: "Potrzebujemy natychmiastowego zastępstwa"
 LibyaFocus.107.t: "[FROM.GetNameDef] Employs Tinner"
 LibyaFocus.107.d: "To our surprise, it seems that [FROM.GetNameDef] has decided to employ Friedrich Tinner instead of imprisoning him. It seems that they valued his expertise in nuclear research too much not to put it to use."
 LibyaFocus.107.a: "Te węże!"
 LibyaFocus.108.t: "Powrót Friedrich Tinner"
 LibyaFocus.108.d: "Kiedy Friedrich Tinner pojawił się na lotnisku w Trypolisie, byliśmy zaskoczeni. Wygląda na to, że władze [FROM.GetAdjective] nie były zainteresowane jego dalszym uwięzieniem i pozwolono mu swobodnie opuścić kraj. Można tylko spekulować, co ich do tego skłoniło."
 LibyaFocus.108.a: "To musi być jakiś podstęp, prawda?"
 sp_libya_gmmr_phase3_project: "Wielka Rzeka Sztuczna - Rurociąg Al-Jawf"
 sp_libya_gmmr_phase3_project_desc: "Wielka Rzeka Sztuczna, która miała dostarczać wodę do całej Libii, nigdy nie została ukończona. Rurociąg miał również łączyć się z Al-Jawf w Kufrze, a teraz mamy szansę dokończyć ten odcinek rurociągu."
 sp_libya_gmmr_phase3_project_reward_al_jawf_agriculture: "Wzmocnione rolnictwo"
 sp_libya_gmmr_phase3_project_reward_al_jawf_agriculture_desc: "Al-Jawf jest jedną z najlepiej nawadnianych oaz na całej Saharze. Dzięki budowie fazy III możemy poprawić tam nawadnianie, pozostawiając więcej miejsca na inne projekty lub umożliwiając nam poprawę wydajności produkcji."
 sp_libya_gmmr_phase3_project_reward_al_jawf_agriculture_option_slot: "Rozszerz wykorzystanie gruntów"
 sp_libya_gmmr_phase3_project_reward_al_jawf_agriculture_option_productivity: "Poprawa produktywności"
 sp_libya_gmmr_phase4_west_project: "Wielka Rzeka Sztuczna - Rurociąg Ghadames"
 sp_libya_gmmr_phase4_west_project_desc: "Wielka Rzeka Sztuczna, która miała dostarczać wodę do całej Libii, nigdy nie została ukończona. Ghadames jest jednym z największych miast na pustyni zachodniej, w pobliżu granicy z Tunezją i jest jednym z najstarszych miast w Libii."
 sp_libya_gmmr_phase4_west_project_reward_tourism: "Wraz z pełnym rozkwitem projektu budowlanego w Ghadames, zwiększona siła robocza zdołała stworzyć niewielki boom turystyczny wokół starego miasta Ghadames. Stare miasto jest w ruinie od jakiegoś czasu i moglibyśmy wykorzystać zwiększone przychody na jego renowację. Albo moglibyśmy wykorzystać pieniądze na dalsze inwestycje w biznes w regionie."
 sp_libya_gmmr_phase4_west_project_reward_tourism_option_infra: "Odnów Stare Miasto"
 sp_libya_gmmr_phase4_west_project_reward_tourism_option_productivity: "Zainwestuj pieniądze"
 sp_libya_gmmr_phase4_east_project: "Wielka Rzeka Sztuczna - Rurociąg Jaghbub"
 sp_libya_gmmr_phase4_east_project_desc: "Wielka Rzeka Sztuczna, która miała dostarczać wodę do całej Libii, nigdy nie została ukończona. Jaghbub to małe miasto oazowe w pobliżu granicy z Egiptem, a w rzeczywistości jest bliżej egipskiego miasta Siwa niż jakakolwiek inna osada libijska. Aby lepiej zintegrować ten obszar z właściwą Libią, powinniśmy przedłużyć tam rurociąg."
 sp_libya_gmmr_phase4_east_project_reward_treasures: "The town of Jaghbub is mostly known for being a home to the Senussi movement. However, with time the town has been sacked of its many historical artefacts and graves of historical figures. A recent excavation discovered rare Senussi artefacts, and officials are now wondering what to do with them. To put them in a museum or sell them for quick profit?"
 sp_libya_gmmr_phase4_east_project_reward_treasures_option_bonus: "To powinno znaleźć się w muzeum!"
 sp_libya_gmmr_phase4_east_project_reward_treasures_option_productivity: "Sprzedaj ten stary grat"
 sp_libya_gmmr_phase5_project: "Wielka Rzeka Sztuczna - Łączy Wschód I Zachód"
 sp_libya_gmmr_phase5_project_desc: "Wielka Rzeka Sztuczna, która miała dostarczać wodę do całej Libii, nigdy nie została ukończona. Zachodnia i wschodnia część rurociągu są obecnie od siebie odłączone. Moglibyśmy połączyć sieci w pobliżu miasta Syrta, aby stworzyć jeden zunifikowany rurociąg."
 sp_libya_gmmr_phase5_project_reward_investment: "Po dojściu Kaddafiego do władzy zaczął on intensywnie inwestować w obszar Syrty, ponieważ urodził się zaledwie 20 km na południe od miasta. Miasto szybko rozrosło się w miasto z rozległymi programami publicznymi i departamentami rządowymi przeniesionymi z Trypolisu do tego miasta. Podczas gdy pracujemy w regionie, może mieć sens wykonanie innych prac publicznych, gdy już tam jesteśmy. Mamy wystarczająco dużo pieniędzy w budżecie na lotnisko lub port morski."
 sp_libya_gmmr_phase5_project_reward_investment_option_airport: "Lotnisko!"
 sp_libya_gmmr_phase5_project_reward_investment_option_naval_base: "Port morski!"
 sp_libya_reward_improve_tripolitania_opinion: "Trypolitanie aprobują projekt"
 sp_libya_reward_improve_tripolitania_opinion_desc: "The tribes in Tripolitania have been impressed by our project being implemented on their land. They are surprised that the government is willing to invest so much into them."
 sp_libya_reward_reduce_tripolitania_opinion: "Trypolitanie niezadowoleni z projektu"
 sp_libya_reward_reduce_tripolitania_opinion_desc: "Plemiona Trypolitanii zorganizowały protest przeciwko naszemu obecnemu projektowi na ich ziemi. Twierdzą, że rząd nie ma prawa używać ich ziemi do próżnych projektów budowlanych."
 sp_libya_reward_improve_cyrenaica_opinion: "Cyrenajczycy zatwierdzają projekt"
 sp_libya_reward_improve_cyrenaica_opinion_desc: "The tribes in Cyrenaica have been impressed by our project being implemented on their land. They are surprised that the government is willing to invest so much into them."
 sp_libya_reward_reduce_cyrenaica_opinion: "Cyrenajczycy niezadowoleni z projektu"
 sp_libya_reward_reduce_cyrenaica_opinion_desc: "The tribes of Cyrenaica have organised a protest against our current project in their land. They state that the government has no right to use their land for vanity construction projects."
 sp_libya_reward_improve_fezzan_opinion: "Fezzanis zatwierdza projekt"
 sp_libya_reward_improve_fezzan_opinion_desc: "Plemiona w Fezzan są pod wrażeniem naszego projektu realizowanego na ich ziemi. Są zaskoczeni, że rząd chce w nich tak dużo zainwestować."
 sp_libya_reward_reduce_fezzan_opinion: "Fezzanis niezadowolony z projektu"
 sp_libya_reward_reduce_fezzan_opinion_desc: "Plemiona Fezzan zorganizowały protest przeciwko naszemu obecnemu projektowi na ich ziemi. Twierdzą, że rząd nie ma prawa używać ich ziemi do próżnych projektów budowlanych."
 Libya_focus: "Libijskie drzewo skupienia"
 LBA_humbled_by_the_un_desc: "Muammar Gaddafi's fiery speech at the UN was met with ridicule as he was booed off the podium. Seems Gaddafi is not as charismatic as he thinks."
 libya_develop_oil_fields_with_foreign_aid: "Rozwijaj pola naftowe dzięki pomocy zagranicznej"
 libya_develop_oil_fields_with_foreign_aid_desc: "There are several multinational oil companies that operate globally. They have the knowhow and technology on how to extract oil from pretty much anywhere. We need to use them to expand Libya's oil industry.\n\n§YThis decision can be done once a year§!"
 libya_gaddafi_family_anti_government_protests_tt: "§RThe protests escalate into a civil war and we must choose our side!§!"
 LBA_first_libyan_civil_war_tension: "First Libyan Civil War"
 libya_tribalism_decentralise_state_tt: "§YWe decentralise every 6 months!§!"
 libya_tribalism_military_crackdown: "Order A Military Crackdown In Region"
 libya_tribalism_military_crackdown_desc: "In order to stem revolts, we must order our military to do a hard crackdown of all opposition activity in [FROM.GetName]."
 libya_tribalism_use_military_as_workforce: "Use The Military As Workforce In Region"
 libya_tribalism_use_military_as_workforce_desc: "We could use our military to help with construction project in [FROM.GetName] in order to develop the region quicker."
 libya_tribalism_use_military_as_security: "Provide Extra Security To Oil Fields In Region"
 libya_tribalism_use_military_as_security_desc: "Most oil fields in Libya have some kind of private security forces. We could use our military to provide additional security in [FROM.GetName]. This would leave more resources available for actual extraction."
 libya_tribalism_demobilise_soldiers: "Demobilize Soldiers In Region"
 libya_tribalism_demobilise_soldiers_desc: "Many of the soldiers in our army are from [FROM.GetName]. Maybe it is time we release some of them from military duty and let them return home. This would help us build trust with the local region."
 libya_tribalism_end_tribalism: "End Tribalism"
 libya_tribalism_end_tribalism_desc: "With the loyalty of the tribes secured, we can finally stop worrying about a possible revolt and breakdown of Libya."
 libya_tribalism_end_tribalism_trp_tt: "Loyalty of [TRP.GetNameWithFlag] > 99% (Current: [?tripolitania_loyalty|%0])\n"
 libya_tribalism_end_tribalism_cyr_tt: "Loyalty of [CYR.GetNameWithFlag] > 99% (Current: [?cyrenaica_loyalty|%0])\n"
 libya_tribalism_end_tribalism_fez_tt: "Loyalty of [FEZ.GetNameWithFlag] > 99% (Current: [?fezzan_loyalty|%0])\n"
 libya_demand_tuareg_territory: "Demand Tuareg Lands From [FROM.GetNameDef]"
 libya_demand_tuareg_territory_desc: "[FROM.GetNameDef] currently holds lands inhabited by the Tuareg. The Tuareg are part of the Libyan nation and we must liberate them."
 libya_aftermath_of_civil_war: "Aftermath Of The Civil War"
 libya_aftermath_of_civil_war_desc: "\n£LBA_desctext_aftermath_of_civil_war \n\n\n\nWith the civil war over, it is time to build a new Libya. However, the power vacuum left by Gaddafi has created a fickle balance of power in the country. Jihadists and Islamists of the Muslim Brotherhood want to impose Sharia on the country, the newly formed Libyan National Army has many ambitious military commanders and there are still plenty of Gaddafi supporters in the country. If we don't approach the factions with balance or manage to snuff them out completely, it is likely that Libya will be splintered yet again."
 libya_integrate_militias_mission: "Integration Of Militias"
 libya_integrate_militias_mission_desc: "Integrating the various militias will take time due to conflicting ideologies, loyalties and chains of command. However, with each militia integrated, we increase the amount of control our government has."
 libya_integrate_militias_mission_create_LNA_tt: "§Y$LBA.Nat_Autocracy_rebels$§! will be known as §Y$LBA.Nat_Autocracy_LNA$§!\n"
 libya_attack_ansar_al_sharia_in_benghazi: "Take Out the Head of the Snake in §Y$STATE_395$§!"
 libya_attack_ansar_al_sharia_in_benghazi_desc: "[ASL.GetNameDef] has fortified themselves into $STATE_395$. The city is the 2nd biggest in Libya, and acts as the main stronghold for the faction. Dislodging them from the city will be difficult, but we must eliminate this threat."
 libya_attack_ansar_al_sharia_in_derna: "Clear Out §Y$STATE_396$§!"
 libya_attack_ansar_al_sharia_in_derna_desc: "§Y$STATE_396$§! is a major source of manpower to [ASL.GetNameDef]. According to the US, the majority of Libyan islamic fighters abroad come from this city. We must clear it out to have a good launch point against $STATE_395$."
 libya_attack_ansar_al_sharia_in_derna_tt: "Our chance of success depends on the §YLoyalty of [CYR.GetNameWithFlag]§!. By improving our relations with the locals, the more likely it is for us to clear $VICTORY_POINTS_1204$\n"
 libya_attack_ansar_al_sharia_in_ajdabiya: "Take Control Of The Wahat Oil Fields"
 libya_attack_ansar_al_sharia_in_ajdabiya_desc: "With [ASL.GetNameDef] controlling $VICTORY_POINTS_1127$, the oil from the Wahat oil fields can't go anywhere. We must conduct a military operation to take back the port city. This will also clear the way towards $STATE_395$."
 libya_attack_ansar_al_sharia_in_ajdabiya_tt: "Our chance of success depends on the §YLoyalty of [CYR.GetNameWithFlag]§!. By improving our relations with the locals, the more likely it is for us to clear $VICTORY_POINTS_1127$\n"
 libya_attack_ansar_al_sharia_in_kufra: "Protect §Y$VICTORY_POINTS_1057$§!"
 libya_attack_ansar_al_sharia_in_kufra_desc: "The town of §Y$VICTORY_POINTS_1057$§! is the only major settlement in $STATE_1100$. We should deploy extra soldiers there to keep the town safe. Perhaps if the only place left for the Islamists to hide in is the desert, they will eventually disband."
 libya_attack_ansar_al_sharia_in_sirte: "Push Through §Y$STATE_919$§!"
 libya_attack_ansar_al_sharia_in_sirte_desc: "With $STATE_919$ under [ASL.GetName] control, our ability to move between Western and Eastern Libya is severely limited. We must push the Islamists out of the region to link up our forces again."
 libya_attack_ansar_al_sharia_in_sirte_tooltip: "Because §Y[ASL.GetNameDef]§! still control §Y$VICTORY_POINTS_6295$§!, we will receive a §R-50% penalty§! to any attacks against §Y$STATE_919$§!!"
 libya_attack_ansar_al_sharia_in_sabha: "Take Back §Y$VICTORY_POINTS_6295$§!"
 libya_attack_ansar_al_sharia_in_sabha_desc: "A ground attack against $VICTORY_POINTS_6295$ would be spotted by the Islamists far away, so we must conduct a surprise attack. Our special forces together with our air force will land directly on the airfield and take back control of it."
 libya_attack_ansar_al_sharia_in_sabha_tt: "Our chance of success depends on the §YLoyalty of [FEZ.GetNameWithFlag]§!. By improving our relations with the locals, the more likely it is for us to clear $VICTORY_POINTS_6295$. §RIf the attack fails, our air force will bombard the airfield, making it unusable but at least it will force the Islamists to retreat§!.\n"
 libya_operation_dignity_mission: "Haftar Launches Operation Dignity"
 libya_operation_dignity_mission_desc: "Khalifa Haftar and other powerful actors in the Libyan National Army are getting frustrated by the inaction that our government is taking against the Islamists in our country. If we do not dislodge Ansar al-Sharia from Libya, Haftar will take matters into his own hands..."
 libya_operation_dignity_mission_tooltip: "§Y[LBA_khalifa_haftar.GetName]§! will mobilise soldiers of the §Y$LBA.Nat_Autocracy_LNA$§! loyal to him and denounce our government in order to destroy the Islamists himself."
 LBA_green_resistance_1: "Green Resistance"
 LBA_green_resistance_1_desc: "The Green Resistance, or Gaddafi loyalism, is still strong in Libya. Utilised by the current autocrat, the Green Resistance continues to help them bolster their forces.\n\n§RThis national spirit will be removed if we are not ruled by [Western_Autocracy_L], [Conservative_L], [Autocracy_L], [Nat_Populism_L] or [Nat_Fascism_L]§!"
 LBA_green_resistance_2: "Gaddafi Loyalists"
 LBA_green_resistance_2_desc: "The government has employed Gaddafi loyalists in their administration and military instead of purging them, in the hopes that their loyalty will be a worthy paycheck for them.\n\n§RThis national spirit will be removed if we are not ruled by [Western_Autocracy_L], [Conservative_L], [Autocracy_L], [Nat_Populism_L] or [Nat_Fascism_L]§!"
 LBA_green_resistance_3: "Remnants Of The Old Regime"
 LBA_green_resistance_3_desc: "The Libyan government is taking full advantage of the Green Resistance, or Gaddafi loyalism, as it starts building Libya in their own image.\n\n§RThis national spirit will be removed if we are not ruled by [Western_Autocracy_L], [Conservative_L], [Autocracy_L], [Nat_Populism_L] or [Nat_Fascism_L]§!"
 LBA_moderated_quran_and_sunnah: "Quran And Sunnah Moderated"
 LBA_moderated_quran_and_sunnah_desc: "The ruling establishment has decided to censor and moderate some of the more extreme views that people spread of the Quran and Sunnah, hoping to reduce the presence of more radical views.\n\n§RThis national spirit will be removed if we are not ruled by [Western_Autocracy_L], [Conservative_L], [Autocracy_L], [Nat_Populism_L] or [Nat_Fascism_L]§!"
 LBA_loyalist_purges: "Loyalist Purges"
 LBA_loyalist_purges_desc: "Gaddafi loyalists and ex-supporters have been purged from the Libyan administration. The people have been promised a change, and they welcome it."
 LBA_ramadan_asswehly_remembrance: "Memory Of Ramadan Asswehly"
 LBA_ramadan_asswehly_remembrance_desc: "Ramadan Asswehly was one of the founding members of the Tripolitanian Republic. As Libya turns towards democracy, it remembers its heroes.\n\n§RThis national spirit will be removed if we don't have elections!§!"
 LBA_tribal_assembly_created: "Tribal Council"
 LBA_tribal_assembly_created_desc: "Libya has created a Tribal Council, whose responsibilities include settling conflicts between tribes and monitoring the government for potential abuse or mistreatment.\n\n§RThis national spirit will be removed if we don't have elections!§!"
 LBA_tripolitania_elite_soldiers: "Tripolitanian Elite Forces"
 LBA_tripolitania_elite_soldiers_desc: "Tripolitanians are being recruited en-masse to the new Libyan army.\n\n§RThis national spirit will be removed if [TRP.GetNameWithFlag] exists§!"
 LBA_cyrenaican_oil_expertise: "Cyrenaican Oil Expertise"
 LBA_cyrenaican_oil_expertise_desc: "The Libyan government is utilising all the knowledge on drilling oil that the Cyrenaicans have.\n\n§RThis national spirit will be removed if [CYR.GetNameWithFlag] exists§!"
 LBA_fezzani_desert_expertise: "Fezzani Supply Caravans"
 LBA_fezzani_desert_expertise_desc: "Utilising the knowledge of desert travel from the Fezzani, the Libyan army is training its soldiers to survive with little food or water.\n\n§RThis national spirit will be removed if [FEZ.GetNameWithFlag] exists§!"
 LBA_tribal_union: "Tribal Union"
 LBA_tribal_union_desc: "The Libyan government has managed to stem ideas of separatism in the country by utilising the differences between the tribes to their benefit.\n\n§RThis national spirit will be removed if [TRP.GetNameWithFlag], [CYR.GetNameWithFlag] or [FEZ.GetNameWithFlag] exists§!"
 LBA_multiple_parties_in_cabinet: "Multi-Party Cabinet"
 LBA_multiple_parties_in_cabinet_desc: "To reduce tension, the Libyan ruling party has invited multiple smaller parties into their cabinet. They hope this will reduce political division in the country.\n\nThis national spirit will be removed if we don't have elections or we are not in a coalition with another party."
 LBA_guaranteed_freedom: "Guaranteed Freedoms"
 LBA_guaranteed_freedom_desc: "The new Libyan government has promised freedom to all people regardless of ethnicity, race or gender."
 LBA_private_agriculture_encouraged: "Private Agriculture Encouraged"
 LBA_private_agriculture_encouraged_desc: "The government is encouraging small farmers and landowners to expand their possession and acquire more land."
 LBA_indian_workers: "Indian Workers"
 LBA_indian_workers_desc: "Indian migrant workers have been hired to work in Libyan factories to make up for the low population of the country.\n\n§RThis national spirit will be removed if [RAJ.GetNameDef] doesn't exist or we are at war with them.§!"
 LBA_swiss_financial_advisors: "Swiss Financial Advisors"
 LBA_swiss_financial_advisors_desc: "Swiss financial advisors have been hired to advise the government on optimising economic growth.\n\n§RThis national spirit will be removed if [SWI.GetNameDef] doesn't exist or we are at war with them.§!"
 LBA_french_nuclear_support: "French Nuclear Support"
 LBA_french_nuclear_support_desc: "French energy companies are helping Libya in their road to building their own nuclear energy industry.\n\n§RThis national spirit will be removed if [FRA.GetNameDef] doesn't exist or we are at war with them.§!"
 LBA_gaddafist_military: "Gaddafist Military"
 LBA_gaddafist_military_desc: "The Libyan Army is full of people who used to be part of the military under Gaddafi. The army can take advantage of their experience.\n\n§RThis national spirit will be removed if we have $no_military$§!"
 LBA_free_officers_movement: "Free Officers Movement"
 LBA_free_officers_movement_desc: "Just like in 1969, the officers of the Libyan Army have overthrown their corrupt rulers.\n\n§RThis national spirit will be removed if we are not Nationalist§!"
 LBA_islamist_crackdown: "Islamist Crackdown"
 LBA_islamist_crackdown_desc: "The government has taken a hard stance on any party or group that talks of Sharia or supremacy of Islam.\n\n§RThis national spirit will be removed if we are Salafist or ruled by the [Neutral_Muslim_Brotherhood_L]§!"
 LBA_islamist_cooperation: "Islamist Cooperation"
 LBA_islamist_cooperation_desc: "The government has taken a lenient approach towards Islamist militias and is even working together with them on some level."
 LBA_turkish_drone_support: "Turkish Drone Support"
 LBA_turkish_drone_support_desc: "The Libyan government is working together with Turkey to modernise their drone stockpile.\n\n§RThis national spirit will be removed if [TUR.GetNameDef] doesn't exist or we are at war with them.§!"
 LBA_military_crackdown_modifier: "Military Crackdown"
 LBA_military_as_workforce_modifier: "Military Workforce"
 LBA_military_as_security_modifier: "Extra Oil Field Security"
 LBA_special_economic_zone: "Special Economic Zone"
 LBA_minimum_wage_centralised: "Enforced Minimum Wage"
 LBA_minimum_wage_centralised_desc: "A minimum wage level is being enforced by the government in the hopes of boosting domestic consumption and reducing the strain on social services."
 LBA_private_insurance_centralised: "Providing Private Health Insurance"
 LBA_private_insurance_centralised_desc: "The healthcare system has been boosted with the introduction of privatised health insurance. This means the government has to spend less on providing healthcare services but the people have to spend their money on private insurance.\n\n§RThis national spirit will be removed if we have $health_05$ or $health_06$§!"
 LBA_dinar_tied_to_dollar: "Dollar-Pegged Dinar"
 LBA_dinar_tied_to_dollar_desc: "The Libyan Dinar has been pegged to the US dollar in the hopes of making Libyan goods more favourable in foreign markets.\n\n§RThis national spirit will be removed if [USA.GetNameDef] doesn't exist§!"
 LBA_chinese_construction: "Chinese Construction Companies"
 LBA_chinese_construction_desc: "Chinese construction companies have been employed by the Libyan state to build their infrastructure.\n\n§RThis national spirit will be removed if [CHI.GetNameDef] doesn't exist or we are at war with [CHI.GetNameDef]§!"
 LBA_protected_middle_class: "Protected Middle Class"
 LBA_protected_middle_class_desc: "The Libyan government has decided to further the cause of the middle class, the people who earn comfortable amounts of money."
 LBA_protected_lower_class: "Protected Lower Class"
 LBA_protected_lower_class_desc: "The Libyan government has decided to further the cause of the lower class, the people who do most of the manual labour in the country."
 LBA_marxism_leninism_adopted: "Marxist-Leninist Ideology"
 LBA_marxism_leninism_adopted_desc: "The government has started adopting Marxist-Leninist policies in its day-to-day governance.\n\n§RThis national spirit will be removed if we are not ruled by [socialism_L], [communist_state_L], [anarchist_communism_L], [Neutral_green_L], [neutral_Social_L] or [Neutral_Communism_L]§!"
 LBA_afrosocialism_adopted: "Afrosocialist Ideology"
 LBA_afrosocialism_adopted_desc: "The government has started adopting Afrosocialist policies in its day-to-day governance.\n\n§RThis national spirit will be removed if we are not ruled by [socialism_L], [communist_state_L], [anarchist_communism_L], [Neutral_green_L], [neutral_Social_L] or [Neutral_Communism_L]§!"
 LBA_eurocommunism_adopted: "Eurocommunism Ideology"
 LBA_eurocommunism_adopted_desc: "The government has started adopting Eurocommunist policies in its day-to-day governance.\n\n§RThis national spirit will be removed if we are not ruled by [socialism_L], [communist_state_L], [anarchist_communism_L], [Neutral_green_L], [neutral_Social_L] or [Neutral_Communism_L]§!"
 LBA_women_enfrachised: "Women Empowered"
 LBA_women_enfrachised_desc: "The Libyan government has taken a stance on empowering the women of their country.\n\n§RThis national spirit will be removed if we are Salafist or ruled by the [Neutral_Muslim_Brotherhood_L]§!"
 LBA_nordic_model_followed: "Nordic Social Democracy"
 LBA_nordic_model_followed_desc: "The Libyan government is trying to recreate the Nordic model of a welfare state in Libya.\n\n§RThis national spirit will be removed if we are not ruled by [socialism_L], [communist_state_L], [anarchist_communism_L], [Neutral_green_L], [neutral_Social_L] or [Neutral_Communism_L]§!"
 LBA_workers_republic_created: "Workers' Republic"
 LBA_european_tech_companies: "Cooperation With European Tech Companies"
 LBA_european_tech_companies_desc: "Libya is cooperating with European tech companies to help them improve their technological progress.\n\n§RThis national spirit will be removed if we are at war with any EU country§!"
 LBA_polygamy_allowed: "Polygamy Allowed"
 LBA_polygamy_allowed_desc: "Libya has allowed polygamy in their nation in the hopes of increasing their population growth.\n\n§RThis national spirit will be removed if our Social Conservatism - Government value is below 50%§!"
 LBA_ali_al_sallabi_sponsored: "Ali al-Sallabi's Books Sponsored"
 LBA_ali_al_sallabi_sponsored_desc: "The Libyan government has officially endorsed Ali al-Sallabi's books on Islam and is sponsoring their distribution around the world."
 LBA_tuareg_militias_in_country: "Tuareg Militias"
 LBA_tuareg_militias_in_country_desc: "Tuareg militias are operating in the country's South Western corner. Tuaregs from Mali, Algeria and Niger are crossing the border to join the fight. Supposedly, they are helping us defeat our enemies, but their loyalties may lie elsewhere."
 LBA_toubou_militias_in_country: "Toubou Militias"
 LBA_toubou_militias_in_country_desc: "Toubou militias are operating in the Southern parts of the country. While not that numerous, their military operations have reduced the stream of migrants from Central Africa."
 LBA_tribal_militias: "Tribal Militias"
 LBA_tribal_militias_desc: "As the civil war rages on and security in the nation drops down, more and more tribes are mobilising and creating their own militias in order to protect their tribe's members or to support the rebels in their war effort. While their militias bolster our forces, it creates a layer of uncertainty as it makes the rebels control the country less and less."
 LBA_jihadist_militias: "Jihadist Militias"
 LBA_jihadist_militias_desc: "With the start of the civil war, the Libyan Islamic Fighting Group has reorganised into a more legitimate organisation under the National Transitional Council. They claim to be more moderate, but even their leaders have admitted that many of their soldiers have links to Al-Qaeda. The more they gain power, the more our country slips towards extremism."
 LBA_islamist_militias: "Islamist Militias"
 LBA_islamist_militias_desc: "Gaddafi has suppressed many Islamic elements throughout his rule. This has now created a counter-revolutionary movement, with many Libyans hoping for a more Islam-centric form of governance. Especially the Muslim Brotherhood with their Qatari backers is taking a more and more increasing role among the Islamist militias."
 LBA_secularist_militias: "Secularist Militias"
 LBA_secularist_militias_desc: "Many of the militias under the National Transitional Council have their origin in the Libyan Armed Forces. Many of them fear that giving too much power to the Islamists will bring the destruction of Libya. As their power increases, the Armed Forces will be able to control the country more and more tightly."
 LBA_reformist_militias: "Reformist Militias"
 LBA_reformist_militias_desc: "Some people in Libya wish for the country to be turned into a Western style democracy. These people, however, are few in number. It is unlikely they will ever get the support they need, but their presence does make our supporters suspect their own causes."
 LBA_military_desertion_government: "Military Desertion"
 LBA_military_desertion_government_desc: "Every day, we have reports of soldiers and whole military units defecting from the Libyan army to the side of the rebels. It is difficult for the Gaddafi government to hold ground when position can simply be lost due to soldiers abandoning their position just to join the enemy."
 LBA_aftermath_of_the_civil_war: "Aftermath Of The Civil War"
 LBA_aftermath_of_the_civil_war_desc: "While the civil war was relatively quick, it still caused some damage to the country. The biggest impact on society is the dismantling of the Gaddafi regime and the militias. The regime's organisation had its fingers all the way at the county level of the country, and replacing Gaddafi loyalists with new civil servants will take time. In addition, there are several independent militias still operating in the country, which will have to be either taken out or integrated into the Libyan National Army."
 LBA_shura_council_of_derna: "Shura Council of Mujahideen in Derna"
 LBA_shura_council_of_derna_desc: "Local Islamists in Derna have banded together and formed a shura council to administer the city to fill in the power vacuum left by the government. Derna is one of the more populous cities in Libya, and it is one of the main sources of manpower to global Libyan jihadists."
 LBA_shura_council_of_ajdabiya: "Ajdabiya Revolutionaries Shura Council"
 LBA_shura_council_of_ajdabiya_desc: "Local Islamists in Ajdabiya have banded together and formed a shura council to administer the city to fill in the power vacuum left by the government. Losing control of Ajdabiya has considerably reduced our ability to export oil from the Wahat oil fields."
 LBA_southern_insurgency: "Insurgency In Kufra"
 LBA_southern_insurgency_desc: "Insurgents loyal to the Islamists in Benghazi, the Rafallah al-Sahati Brigade, are operating in Kufra and disrupting the local population there. They are not a serious threat, but their existence might provoke the local Toubou people to act."
 LBA_society_of_muslim_brothers: "Society Of Muslim Brothers"
 muslim_brotherhood_faction_member: "Society Of Muslim Brothers Member"
 muslim_brotherhood_faction_member_desc: "The Society of Muslim Brothers, more commonly known as the Muslim Brotherhood, is a political and religious group believing in pan-Islamism and the implementation of Sharia as the common law. Multiple countries supporting the Brotherhood have decided to create a military alliance to better further their interests."
 muslim_brotherhood_faction_member_tt: "When influencing countries that are §Y$sunni$§!:\n$foreign_influence_modifier$: §G+10.00%§!"
 muslim_brotherhood_faction_member_tt2: "§RFaction Special Rule§!:\n-Only countries ruled by the Muslim Brotherhood can join the faction"
 shadow_of_gaddafi: "In The Shadow Of Gaddafi"
 marshall_of_libya: "Marshal Of Libya"
 defence_minister_of_libya: "Minister Of Defence"
 LBA_unit_leader_trait_tribal_commander: "Tribal Commander"
 LBA_unit_leader_trait_tribal_commander_desc: "This commander has risen to national level command by starting their career commanding one of the tribal militias in the country. Several tribes in the country have setup and funded their own militias in order to protect their communities in a country that is slowly becoming more and more lawless."
 LBA_unit_leader_trait_jihadist_commander: "Jihadist Commander"
 LBA_unit_leader_trait_jihadist_commander_desc: "This commander started by leading Jihadists in and outside of Libya. With links to Al-Qaeda and the Libyan Islamic Fighting Group, this commander has seen their fair share of fighting around the globe."
 LBA_unit_leader_trait_islamist_commander: "Islamist Commander"
 LBA_unit_leader_trait_islamist_commander_desc: "This commander leads one of the local militias with Islamist tendencies. Many communities have setup councils to handle local defence in the form of militias. As many in Libya are still conservative Muslims, many of these militias and councils drive for the implementation of Sharia law at least to some extent."
 LBA_unit_leader_trait_secularist_commander: "Secularist Commander"
 LBA_unit_leader_trait_secularist_commander_desc: "This commander is heavily aligned with the Libyan National Army. Many in the LNA wish to see a more secular Libya, with no room for Islamist elements. It is likely that this commander is also very close to Khalifa Haftar, the self-declared leader of the LNA."
 LBA_unit_leader_trait_reformist_commander: "Reformist Commander"
 LBA_unit_leader_trait_reformist_commander_desc: "This commander is a Libyan exilee who has returned home. Having a Western style education, the commander and the militias they lead would like Libya to be reformed in a Western style liberal democracy."
 LBA_khalifa_haftar_desc: "Khalifa Haftar started his career in the Libyan military, receiving training in Libya, the Soviet Union and Egypt. Haftar helped Muammar Gaddafi overthrow King Idris, after which he became the Chief of Staff for the Libyan military. Haftar commanded troops in the disastrous war against Chad, during which he was captured by Chadian forces and disavowed by Gaddafi. The United States flew Haftar and his captured soldiers into Zaire, where he founded an armed resistance group against Gaddafi. Eventually with the help of the CIA they found their way into the United States. In 1996, Haftar launched an uprising against Gaddafi in eastern Libya, but returned back to the US after it failed. After the fall of Gaddafi, he took control of the new Libyan armed forces, eventually climbing the ranks to an influential political position and de-facto leader of the country."
 LBA_organize_desert_trips_tt: "\n§RIf we get involved in a war, then§!"
 LBA_organize_desert_trips_tt_2: "§ROnce the idea times out and we are no longer at war, we will receive back the previous bonuses. If we are still at war, the negative modifiers will continue for another year.§!"
 LBA_end_of_gaddafi: "End Of Gaddafi"
 LBA_end_of_gaddafi_desc: "Gaddafi has been toppled and the Libyan people are now free to choose their own path!"
 LBA_just_another_gaddafi: "Just Another Gaddafi"
 LBA_just_another_gaddafi_desc: "We kicked out one dictator to end up with another. Libya simply is not made to be a democracy, it can be seen clearly from our history. [ROOT.GetLeader] will be a better ruler than Gaddafi ever was!"
 LBA_just_another_gaddafi_tt: "We are not at war with a pro-Gaddafi faction"
 LBA_green_resistance: "The Green Resistance"
 LBA_green_resistance_desc: "Even though Gaddafi is gone, his followers are not. A new movement is forming around his Third International Theory. These loyalists will gladly follow our lead, as long as they think we are fighting for Gaddafi."
 LBA_employ_gaddafi_loyalists: "Employ Gaddafi Loyalists"
 LBA_employ_gaddafi_loyalists_desc: "The administration and military are still full of people who worked under the Gaddafi regime. These people can still be useful to us, and they will happily accept a lower salary out of pure loyalty."
 LBA_moderate_islamism: "Moderate The Quran And Sunnah"
 LBA_moderate_islamism_desc: "The biggest issue in Islam is people's interpretation of the teachings. Islam is one of the building blocks of Libya, so we can't abandon it completely. However, we can portray and teach a more moderate version of the Quran and Sunnah to people."
 LBA_expand_tribes: "Expand The Tribes"
 LBA_expand_tribes_desc: "Libya consists of three main tribes; Cyrenaica, Tripolitania and Fezzan. However, there are also many Toubou and Tuareg living inside our lands too. These people are just as Libyan as the main three tribes. These people don't have their own state, so let's make Libya theirs too."
 LBA_expand_tribes_threat: "Libyan Expansionism In Sahara"
 LBA_maintain_territorial_integrity: "Maintain Territorial Integrity"
 LBA_maintain_territorial_integrity_desc: "Libya's land is indivisible. All ideas of separatism must be stamped out and all lost territories must be brought back to the fold."
 LBA_liberate_tuareg: "Liberate The Tuaregs"
 LBA_liberate_tuareg_desc: "The Tuaregs are a nomadic tribe in the Western part of Sahara without their own state. We must unite them into the Libyan nation."
 LBA_liberate_tuareg_tt: "We can demand our §Yneighbours§! for any rightful §YTuareg§! land"
 LBA_liberate_toubou: "Liberate The Toubou"
 LBA_liberate_toubou_desc: "The Toubou are a nomadic tribe in the Eastern part of Sahara without their own state. We must unite them into the Libyan nation."
 LBA_liberate_toubou_tt: "We can demand our §Yneighbours§! for any rightful §YToubou§! land"
 LBA_ties_with_nato: "Ties With NATO"
 LBA_ties_with_nato_desc: "While we are not that democratic, the Western countries have a history of cooperating with strongmen. They need our strength and military to keep their own countries safe from extremists."
 LBA_ties_with_csto: "Ties With CSTO"
 LBA_ties_with_csto_desc: "The West cannot be trusted. They are the ones who got rid of Gaddafi in the first place, and it is only a matter of time before they come for us. We must look to the East, to Russia, to be our friend."
 LBA_new_libyan_nation: "New Libyan Nation"
 LBA_new_libyan_nation_desc: "A new Libyan nation is born! Together with the Tuareg and Toubou, the Libyan identity is now complete."
 LBA_control_the_media: "Control The Media"
 LBA_control_the_media_desc: "People think that just because Gaddafi is gone they can now freely criticise the government. This is nonsense. We must be the ones who tell people what to think!"
 LBA_arms_deals: "International Arms Deals"
 LBA_arms_deals_desc: "To secure the state, we need a well supplied army. Our ally can provide us with high tech equipment and we don't have to waste time developing them ourselves."
 LBA_echoes_of_the_past: "Echoes Of The Past"
 LBA_echoes_of_the_past_desc: "After the First World War, the Tripolitanian Republic tried to break away from Italy but ultimately failed. They were the first democratic nation in the Middle East. We now have a chance to bring real equal democracy to Libya once again."
 LBA_purge_gaddafi_loyalists: "Purge Gaddafi Loyalists"
 LBA_purge_gaddafi_loyalists_desc: "The administration is full of people who happily worked under Gaddafi. We need to kick them out and arrest those who wronged our people. This is a necessary step to get a fresh start and secure democracy."
 LBA_memory_of_ramadan_asswehly: "Memory Of Ramadan Asswehly"
 LBA_memory_of_ramadan_asswehly_desc: "Ramadan Asswehly was one of the founders, and walis, of the Tripolitanian Republic. He fought against the Italians to defend the Republic. The Republic itself acted as a tetrarchy, being ruled by four walis, which guaranteed a balance of power between the factions."
 LBA_soothe_tribal_tension: "Soothe Tribal Tensions"
 LBA_soothe_tribal_tension_desc: "All men are created equal. It is silly to play the tribes against each other. Instead, we should be using the strengths of each tribe to our advantage."
 LBA_tribal_assembly: "Create A Tribal Council"
 LBA_tribal_assembly_desc: "We must create a governmental organ that settles disputes between the tribes and makes sure everyone is treated equally."
 LBA_invest_in_tripolitania: "Invest In Tripolitania"
 LBA_invest_in_tripolitania_desc: "Tripolitania is the economic hub of the country. It hosts most of our higher technology centers. Investing there will bring riches to the Tripolitanians."
 LBA_invest_in_cyrenaica: "Invest In Cyrenaica"
 LBA_invest_in_cyrenaica_desc: "Cyrenaica is a major source for our oil, and one of our most important transport hubs. We should utilise the naval knowhow of the region and invest in shipbuilding enterprises."
 LBA_invest_in_fezzan: "Invest In Fezzan"
 LBA_invest_in_fezzan_desc: "Fezzan is very remote, but it is an area with many mineral deposits. We could invest into some excavation work to find some more."
 LBA_tripolitanian_soldiers: "Tripolitanian Warriors"
 LBA_tripolitanian_soldiers_desc: "Tripolitania is the most populous of our regions. It makes sense that we comb their population for the most capable soldiers."
 LBA_cyrenaican_oil: "Cyrenaican Oil"
 LBA_cyrenaican_oil_desc: "Cyrenaicans have expertise in oil production. We should use their expertise to find better ways of drilling oil."
 LBA_fezzani_caravans: "Fezzani Caravans"
 LBA_fezzani_caravans_desc: "The Fezzani have long taken part in the trans-Saharan trade. They have lots of expertise on how to survive in the desert. We should use their skills to train our soldiers to survive in harsh environments."
 LBA_tribal_unification: "Tribal Unification"
 LBA_tribal_unification_desc: "We have created a balanced system where all the tribes can feel safe. We no longer have to worry about separatism in Libya."
 LBA_free_libya: "A Free Libya"
 LBA_free_libya_desc: "We must begin a rapid process of creating social, political and economic liberties in Libya to get rid of the remnants of the Gaddafi regime as fast as possible."
 LBA_emergency_privatisation: "Emergency Privatisation"
 LBA_emergency_privatisation_desc: "We are in need of some money. We should sell out a large portion of the oil fields controlled by the National Oil Corporation to private companies."
 LBA_emergency_privatisation_tt: "Level of Nationalisation: §Y-20%§!"
 LBA_multi_party_cabinet: "Multi-Party Cabinet"
 LBA_multi_party_cabinet_desc: "The end of Gaddafi has caused numerous political parties and organisations to rise up, all vying for power. If we are to keep stability, we must include a multitude of voices in our cabinet."
 LBA_guarantee_freedoms: "Guarantee Constitutional Freedoms"
 LBA_guarantee_freedoms_desc: "The Libyan people have never really felt freedom. Under us, there will be more freedom than anyone can handle."
 LBA_attract_private_oil_companies: "Attract Private Oil Companies"
 LBA_attract_private_oil_companies_desc: "Libya has good reserves of oil but not the technology or business environment to extract it. We need to attract private oil companies to invest in Libya."
 LBA_allow_private_farming: "Allow Private Farming"
 LBA_allow_private_farming_desc: "Islamic inheritance laws have created a patchwork of small farms that can't effectively provide food. We should allow individuals to buy farms from each other, which would allow bigger, more efficient farms to operate."
 LBA_freedom_of_conscience: "Freedom Of Conscience"
 LBA_freedom_of_conscience_desc: "No one should be persecuted for their religion. While it is important to place many of our laws on Islam as it is part of our heritage, we should not discriminate against any other religious groups."
 LBA_free_prisoners: "Free The Wrongly Accused"
 LBA_free_prisoners_desc: "The previous government put too many people in prison simply for their opinion. These people need to be released and let take part in society again."
 LBA_dismantle_noc: "Dismantle The NOC"
 LBA_dismantle_noc_desc: "The National Oil Corporation is an inefficient lumbering machine that only acted as a money-generator for the old regime. We must dismantle the whole system and break apart the company to smaller pieces."
 LBA_dismantle_noc_tt: "The §YOil Nationalisation§! mechanic will be disabled"
 libya_noc_dismantled: "The §YNational Oil Corporation§! has been dismantled"
 LBA_approach_india: "Approach [RAJ.GetName]"
 LBA_approach_india_desc: "[RAJ.GetName] was a key partner to us during the Cold War, but relations have soured. We should approach them once again to rebuild relations."
 LBA_approach_switzerland: "Approach [SWI.GetName]"
 LBA_approach_switzerland_desc: "Many of the more liberal politicians and human rights activists spent their exile living in [SWI.GetName]. It is only natural that we build closer ties to this great example of a democracy."
 LBA_approach_france: "Approach [FRA.GetName]"
 LBA_approach_france_desc: "[FRA.GetName] has always been very interested in Libya, despite us not sharing a colonial past with them. The French have been very vocal in their opposition against Gaddafi and so we can trust them to help us."
 LBA_hire_indian_workers: "Hire [RAJ.GetAdjective] Workers"
 LBA_hire_indian_workers_desc: "Many of the Gulf countries employ large number of foreign workers from India, since their own workforce is not large enough. We should do the same to increase our economic potential faster."
 LBA_hire_swiss_advisors: "Hire [SWI.GetAdjective] Financial Advisors"
 LBA_hire_swiss_advisors_desc: "The [SWI.GetAdjective] banks are known across the world. We should ask them for help in running our own economy."
 LBA_hire_french_energy_advisors: "Utilise [FRA.GetAdjective] Energy Companies"
 LBA_hire_french_energy_advisors_desc: "[FRA.GetName] is the leading power when it comes to nuclear energy. We should get support from French companies in building our own nuclear power plants."
 LBA_libyan_national_army: "Libyan National Army"
 LBA_libyan_national_army_desc: "The politicians have failed to protect the Libyan people. It now falls on the military to do their job for them."
 LBA_rely_on_gaddafists: "Rely On Gaddafist Military"
 LBA_rely_on_gaddafists_desc: "The majority of the army is full of people who were loyal to Gaddafi. It doesn't make sense for us to get rid of them as they have decades of experience."
 LBA_call_back_haftar: "Rise Of Haftar"
 LBA_call_back_haftar_desc: "Khalifa Haftar was a colonel during the Libyan-Chadian war when he was captured by the Chadian forces. Disavowed by Gaddafi, he and his fellow soldiers were flown to Zaire by the United States and with the help of the CIA they eventually made their way to the States. Haftar has opposed Gaddafi for decades, and now with Gaddafi gone he can return to take control of the military."
 LBA_legacy_of_the_free_officers: "Legacy Of The Free Officers"
 LBA_legacy_of_the_free_officers_desc: "The Free Officers movement is what Gaddafi led to overthrow the Libyan monarchy. The people were tired of a regime that was a puppet of foreign powers and abusing the country's oil wealth. We have now done the same, and we must make sure Libya doesn't fall under foreign influence again."
 LBA_no_room_for_islamists: "No Room For Islamists"
 LBA_no_room_for_islamists_desc: "While Islam is the backbone of Libya, islamists are not. They try to subvert the religion to their own needs. We should give no quarter to them."
 LBA_limited_cooperation: "Limited Cooperation"
 LBA_limited_cooperation_desc: "The fact is that we can't pick and choose our allies right now. We could have some cooperation with various Islamist militias to bolster our forces. We can remove them from the picture later."
 LBA_improved_training: "Improved Training"
 LBA_improved_training_desc: "The state of the Libyan Army is horrible. The Gaddafi regime didn't spend too much time training the average soldier or keeping up-to-date with the latest strategic developments. We should run some trainings for our soldiers."
 LBA_expand_al_saiqa: "Expand The Al-Saiqa"
 LBA_expand_al_saiqa_desc: "The Al-Saiqa is a Libyan special forces unit made up of paratroopers, paramilitary units and commandos. We should expand the unit to be larger."
 LBA_expand_al_saiqa_tt: "A §YSpecial Forces§! unit will be created in §Y$VICTORY_POINTS_11954$§!"
 LBA_establish_military_zones: "Establish Military Zones"
 LBA_establish_military_zones_desc: "In order to control the different regions of Libya, we must establish military zones with their own governors."
 LBA_approach_turkey: "Approach [TUR.GetName]"
 LBA_approach_turkey_desc: "In recent years, [TUR.GetName] has taken a more active role in the Middle East. They are looking for friendly governments in the region, and we definitely are one."
 LBA_approach_russia: "Approach [SOV.GetName]"
 LBA_approach_russia_desc: "[SOV.GetName] has long been against the West. It is the West's fault that Libya is in the situation it is. We should work together with [SOV.GetName] to build a better Libya."
 LBA_acquire_turkish_drones: "[TUR.GetAdjective] Drones"
 LBA_acquire_turkish_drones_desc: "The Turks have excellent drone technology. We should ask for their help to produce them."
 LBA_acquire_russian_weapons: "Request Weapons From [SOV.GetName]"
 LBA_acquire_russian_weapons_desc: "Most of the weapons we use come from [SOV.GetName]. We should request some additional equipment to outfit our army to fight better."
 LBA_military_exercises: "Military Exercises"
 LBA_military_exercises_desc: "We must do wargames to improve the aptitude of our general staff so they can operate on the battlefield better"
 LBA_factory_mobilisation: "Emergency Mobilisation"
 LBA_factory_mobilisation_desc: "We must quickly transform some of our manufacturing base into military use. It might hurt us financially but it is necessary."
 LBA_mobilise_the_tribes: "Rely On Tribal Militia"
 LBA_mobilise_the_tribes_desc: "We must mobilise the various tribes to fight for us. They won't be well trained but we can get enough of them to fill in all the gaps we have."
 LBA_mobilise_the_tribes_tripolitania_tt: "§YThree brigades of militia§! will be mobilised in §YTripolitania§!"
 LBA_mobilise_the_tribes_cyrenaica_tt: "§YTwo brigades of militia§! will be mobilised in §YCyrenaica§!"
 LBA_mobilise_the_tribes_fezzan_tt: "§YOne battalion of motorized militia§! will be mobilised in §YFezzan§!"
 LBA_employ_mercenaries: "Employ Mercenaries"
 LBA_employ_mercenaries_desc: "We can't rely on our own people to do the fighting. We must employ elite foreign mercenaries."
 LBA_employ_mercenaries_tt: "§YOne locked brigade of special forces§! will be hired in §Y[ROOT.Capital.GetName]§!"
 LBA_the_libyan_elite: "The Libyan Elite"
 LBA_the_libyan_elite_desc: "Libya should be ruled by its higher-ups. The people who know how to run a business, and a country. What's good for us is bound to be good for Libya as well."
 LBA_begin_centralisation: "Increased Centralization"
 LBA_begin_centralisation_desc: "In order to have an effective state, we need to increase the control that the capital region has."
 LBA_begin_centralisation_tt: "§YBy increasing centralization, all the focuses in this branch will be more powerful but also cost more!§!"
 LBA_begin_decentralisation: "Reduced Centralization"
 LBA_begin_decentralisation_desc: "It is best to delegate some of the tasks of running the government to regional councils."
 LBA_begin_decentralisation_tt: "§YBy reducing centralization, all the focuses in this branch will be less powerful but also cost less!§!"
 LBA_increased_centralization_tooltip: "If we have completed the focus §Y$LBA_begin_centralisation$§!:\n"
 LBA_decreased_centralization_tooltip: "If we have completed the focus §Y$LBA_begin_decentralisation$§!:\n"
 LBA_build_infrastructure: "Infrastructure Investments"
 LBA_build_infrastructure_desc: "The roads under the Gaddafi regime have been left hopelessly poor. We must increase the infrastructure level in our country. Having good roads is the basis of a good economy."
 LBA_create_special_economic_zones: "Create Special Economic Zones"
 LBA_create_special_economic_zones_desc: "We should create special economic zones in some areas of Libya. These zones would have relaxed regulation, which would give incentives to foreign companies to come to Libya."
 LBA_introduce_minimum_wage: "Introduce A Minimum Wage"
 LBA_introduce_minimum_wage_desc: "Libya has no defined minimum wage, meaning workers can be paid the lowest prices. We should enforce some kind of a minimum wage. This would help lift people out of poverty and reduce the strain on our social services. It will slightly impact the corporate sector but perhaps in the big picture it will be worth it."
 LBA_attract_foreign_investment: "Attract Foreign Investment"
 LBA_attract_foreign_investment_desc: "Now that we have created a suitable environment for business, we should invite foreign companies to invest into us."
 LBA_friends_in_high_places: "Friends In High Places"
 LBA_friends_in_high_places_desc: "With our business contacts, we can start shaping Libya to be more business friendly. If large corporations are given a bit more power, it will bring us more profit."
 LBA_private_insurance: "Implement Private Health Insurance"
 LBA_private_insurance_desc: "We should implement a system of private health insurance to work alongside our state provided services. This way we can move some of the financial burden to private contractors and the people. The people will of course have less disposable (and taxable) income."
 LBA_approach_usa: "Approach [USA.GetName]"
 LBA_approach_usa_desc: "[USA.GetNameDef] is the prime example of what a free market country can achieve. Building closer relations with them will allow us to build a similar paradise."
 LBA_tie_dinar_to_dollar: "Peg The Dinar To The Dollar"
 LBA_tie_dinar_to_dollar_desc: "Pegging our own money to the dollar would allow our economy to become more stable and follow the US. With a fixed exchange rate, goods produced in Libya are a better investment on the global market. However, because our economy is relatively weak compared to the US, imports will be more expensive to our consumers and companies."
 LBA_approach_china: "Approach [CHI.GetName]"
 LBA_approach_china_desc: "China is a rising power and they have taken a more active interest in Africa recently. We should build good relations with them and take advantage of their industrial base."
 LBA_employ_chinese_construction_companies: "Employ Chinese Construction Companies"
 LBA_employ_chinese_construction_companies_desc: "[CHI.GetName] is actively building infrastructure projects all across Africa. We should employ [CHI.GetAdjective] construction companies to invest in our infrastructure."
 LBA_national_democracy: "National Democracy"
 LBA_national_democracy_desc: "National Democracy is an ideology where the poor are taken care of, the state is free from foreign meddling and leaders rule with the consent of the people."
 LBA_protect_the_lower_class: "Protect The Lower Class"
 LBA_protect_the_lower_class_desc: "The lower classes - the factory workers and farmers are the backbone of any industrial nation. We must do all we can to make sure they aren't driven to the ground by a capitalist system."
 LBA_protect_the_middle_class: "Protect The Middle Class"
 LBA_protect_the_middle_class_desc: "Libya has no true industrial might, our economy is built on shipping oil and doing business. Therefore we must protect the middle class; the office workers and dockers that bring the money to our country."
 LBA_absolute_national_independence: "Absolute National Independence"
 LBA_absolute_national_independence_desc: "We should not be subject to any foreign power. Libyans need to have the autonomy to make up their own minds."
 LBA_give_power_to_central_committee: "Give Power To Central Committee"
 LBA_give_power_to_central_committee_desc: "The central committee of the party should hold most of the power of the country, or at the very least have a very strong influence on the country's politics."
 LBA_empower_the_noc: "Strengthen The NOC"
 LBA_empower_the_noc_desc: "Gaddafi never went far enough with Libya's oil. We must increase the National Oil Corporation's hold on our oil reserves away from the hands of other countries."
 LBA_empower_the_noc_tt: "Level of Nationalisation: §Y+15%§!"
 LBA_improve_infrastructure: "Improve Roads"
 LBA_improve_infrastructure_desc: "It is important for the nation to have good roads, as otherwise the people can't engage in economic activity."
 LBA_adopt_marxism_leninism: "Adopt Marxism-Leninism"
 LBA_adopt_marxism_leninism_desc: "Marxism-Leninism is the mainstream form of communism remaining in the world. By creating a state led by the proletariat, we can liberate the workers and fight against capitalism."
 LBA_return_to_afrosocialism: "Return To Afrosocialism"
 LBA_return_to_afrosocialism_desc: "The class struggle that communists talk about does not exist in Africa. In Africa, our tribal heritage means socialism is built-in into everything we do. We must promote the African heritage and identity, and build an Africa that is meant for Africans."
 LBA_shift_to_eurocommunism: "Shift To Eurocommunism"
 LBA_shift_to_eurocommunism_desc: "Many of the historical communists of Libya were of Italian origin, and in Italy eurocommunism was very successful. Eurocommunism takes a more moderate and anti-East approach towards socialism, and embraces the middle class and various new social movements stronger than traditional communism."
 LBA_ties_to_italy: "Ties To Italy"
 LBA_ties_to_italy_desc: "The [communist_state_L] was founded by Italian immigrants, and many leftist organisations have spent their exile in Italy. This gives us a strong connection to the Italian leftist circles."
 LBA_approach_the_eu: "Approach The EU"
 LBA_approach_the_eu_desc: "The European Union is an important business partner for us. Most of our oil exports go there, and with further integration we can greatly expand our economy."
 LBA_secularise_the_state: "Secularise The State"
 LBA_secularise_the_state_desc: "Islam has had too strong influence on the governance of Libya. We need to separate religious elements from our institutions."
 LBA_womens_rights: "Strengthen Women's Rights"
 LBA_womens_rights_desc: "The Islamic tradition of Libya is the foundation of the oppression of women taking place in our country. We must encourage our women to become eager workers for the state."
 LBA_establish_workers_republic: "Establish A Workers' Republic"
 LBA_establish_workers_republic_desc: "The Libyan workers must all come together to create a state free of the capitalist bourgeoisie."
 LBA_follow_the_nordic_model: "Follow The Nordic Model"
 LBA_follow_the_nordic_model_desc: "The Nordic countries have created a system where people happily pay taxes in exchange for extensive welfare and healthcare. We should follow this method to improve the lives of our citizens."
 LBA_european_high_tech: "Acquire European Tech"
 LBA_european_high_tech_desc: "Europe is known for its high-tech industry. We should cooperate with some European companies to build up our own tech industry."
 LBA_the_brotherhood: "The Brotherhood"
 LBA_the_brotherhood_desc: "The Muslim Brotherhood is a pan-Islamic religious and political organisation, with members in every Islamic country. Now that they are in power in Libya, the country can be returned back to its Islamic roots."
 LBA_establish_sharia_law: "Establish Sharia Law"
 LBA_establish_sharia_law_desc: "Sharia law should be the basis of our constitution and laws. Islam gives us the best tools for moral guidance of the nation."
 LBA_rehabilitate_lifg_fighters: "Rehabilitate LIFG Fighters"
 LBA_rehabilitate_lifg_fighters_desc: "The Libyan Islamic Fighting Group members are in prison or living in exile. We should offer them our hand and let them join back to society."
 LBA_scholars_of_brotherhood: "Brotherhood Scholars"
 LBA_scholars_of_brotherhood_desc: "The Brotherhood actively engages with the community. They do charity and help educate people. We should employ the Brotherhood to help whoever remains illiterate in the country to learn how to read."
 LBA_allow_polygamy: "Allow Polygamy"
 LBA_allow_polygamy_desc: "As part of Islam, men should have multiple wives. This guarantees large and happy families."
 LBA_works_of_al_sallabi: "Spread The Works Of Al-Sallabi"
 LBA_works_of_al_sallabi_desc: "Ali al-Sallabi is a brilliant Libyan scholar and writer. While Gaddafi was in power, he spent his years in exile studying in Saudi Arabia, Sudan and Qatar. He is a strong believer in Islam and he has written multiple books on it and its history. We should sponsor his works to reach an even wider audience."
 LBA_ties_to_saudi_arabia: "Ties To Saudi Arabia"
 LBA_ties_to_saudi_arabia_desc: "Many of our Brotherhood scholars and leaders have at some point studied in Saudi Arabia. While the Saudis are not number one fans of the Brotherhood, they still appreciate our dedication to Islam."
 LBA_request_religious_funding: "Request Religious Funding"
 LBA_request_religious_funding_desc: "The Saudis eagerly provide funding to mosques and madrassas in other Muslim countries. We should request their aid as well."
 LBA_military_pact_with_qatar: "Military Pact With [QAT.GetName]"
 LBA_military_pact_with_qatar_desc: "[QAT.GetNameDef] is one of the main supporters of the Muslim Brotherhood. They support the struggle of Muslims all across the Middle East, and it would make sense if we joined our forces."
 LBA_military_pact_with_qatar_tt: "[QAT.GetNameWithFlag] is more likely to accept if:\n§G-They have a high opinion of us\n-The Saudis have been taken over by Al-Qaeda\n-They are our or our subject's neighbour§!\n\n[QAT.GetNameWithFlag] is less likely to accept if:\n§R-They have a low opinion of us\n-We are Salafist\n-We are at war§!"
 LBA_expand_the_alliance: "Expand The Alliance"
 LBA_expand_the_alliance_desc: "There are other countries with sympathies for the Brotherhood. We should aim to expand our alliance to include these countries too."
 LBA_expand_the_alliance_trigger_tt: "There is at least one country that can be invited"
 LBA_expand_the_alliance_tt: "They are more likely to accept if:\n§G-They have a high opinion of us\n-They are our or our subject's neighbour§!\n\nThey are less likely to accept if:\n§R-They have a low opinion of us\n-We are Salafist\n-We are at war§!"
 LBA_use_brotherhood_influence: "Utilise The Influence Of The Brotherhood"
 LBA_use_brotherhood_influence_desc: "The Brotherhood has members in multiple Muslim countries. We should use them to gain more influence over local politics."
 LibyaFocus.109.t: "[FROM.GetNameDef] Demands Land"
 LibyaFocus.109.d: "The government of [FROM.GetNameDef] has claimed that the Tuareg population living in our lands should be part of the Libyan nation. They are now demanding that our government cede control of those lands to them."
 LibyaFocus.109.a: "Accept their demands"
 LibyaFocus.109.b: "This will never happen"
 LibyaFocus.110.t: "[FROM.GetNameDef] Accepts Demands"
 LibyaFocus.110.d: "The government of [FROM.GetNameDef] has agreed to our demands. This is a great victory for the Libyan nation!"
 LibyaFocus.110.a: "Amazing"
 LibyaFocus.111.t: "[FROM.GetNameDef] Refuses Our Demands"
 LibyaFocus.111.d: "The government of [FROM.GetNameDef] has refused our demands for territory. It seems they want to keep oppressing our people."
 LibyaFocus.111.a: "They will get what's coming for them"
 LibyaFocus.112.t: "[FROM.GetNameDef] Demands Land"
 LibyaFocus.112.d: "The government of [FROM.GetNameDef] has claimed that the Toubou population living in our lands should be part of the Libyan nation. They are now demanding that our government cede control of those lands to them."
 LibyaFocus.112.a: "Accept their demands"
 LibyaFocus.112.b: "This will never happen"
 LibyaFocus.113.t: "[FROM.GetNameDef] Accepts Demands"
 LibyaFocus.113.d: "The government of [FROM.GetNameDef] has agreed to our demands. This is a great victory for the Libyan nation!"
 LibyaFocus.113.a: "Amazing"
 LibyaFocus.114.t: "[FROM.GetNameDef] Refuses Our Demands"
 LibyaFocus.114.d: "The government of [FROM.GetNameDef] has refused our demands for territory. It seems they want to keep oppressing our people."
 LibyaFocus.114.a: "They will get what's coming for them"
 LibyaFocus.115.t: "[FROM.GetNameDef] Asks For An Alliance"
 LibyaFocus.115.d: "[FROM.GetNameDef] has created a new alliance to bring together the Muslim Brotherhood. Due to our ties with the Brotherhood, they have asked us to join. Should we accept?"
 LibyaFocus.115.a: "Of course"
 LibyaFocus.116.t: "[FROM.GetNameDef] Joins The Brotherhood"
 LibyaFocus.116.d: "[FROM.GetNameDef] has accepted our invitation to join the Muslim Brotherhood."
 LibyaFocus.116.a: "Together we are stronger!"
 LibyaFocus.117.t: "[FROM.GetNameDef] Rejects The Invitation"
 LibyaFocus.117.d: "[FROM.GetNameDef] has rejected our invitation to join the Muslim Brotherhood."
 LibyaFocus.117.a: "They are not true believers"
 LibyaFamily.75.t: "The Death Of Muammar Gaddafi"
 LibyaFamily.75.d: "As the rebels gained more and more ground, it was vital for our great leader Muammar Gaddafi to relocate to a safer location. However, his convoy was (unknowingly) ambushed by the rebels. Gaddafi tried to hide after the attack but was apprehended by the rebels. He was beaten and tortured by the rebels, before succumbing to his wounds. Videos and pictures of the killing have spread all across the internet. Is this the end?"
 LibyaFamily.75.d.airstrike: "As the rebels gained more and more ground, it was vital for our great leader Muammar Gaddafi to relocate to a safer location. However, while moving to a new location, the convoy was hit by an airstrike from NATO, and was quickly assaulted by rebel forces. Gaddafi tried to hide after the attack but was apprehended by the rebels. He was beaten and tortured by the rebels, before succumbing to his wounds. Videos and pictures of the killing have spread all across the internet. Is this the end?"
 LibyaFamily.75.a: "We will never surrender!"
 LibyaFamily.76.t: "Muhammad Captured By The Rebels"
 LibyaFamily.76.d: "As part of his duty towards his father, Muhammad was helping organise the defenses of the Libyan Army in a small town. During a rebel attack, his HQ was overrun. Reportedly Muhammad tried to surrender to the rebels, who didn't want to give him any favours. After torture and beatings, he was executed by the rebel commander. [LRB.GetNameDef] has stated that their goal was to capture Muhammad, not to kill him, and that the local commander was acting on his own accord."
 LibyaFamily.76.a: "Murderers!"
 LibyaFamily.77.t: "Saif al-Islam Stoned To Death"
 LibyaFamily.77.d: "In a small town, Saif al-Islam was doing rounds inspecting his father's troops, promising them better weapons and equipment. Unbeknownst to him however, the local unit had already defected to the rebel side. He was quickly captured and detained by the rebels. Saif managed to escape but quickly found himself cornered with nowhere to go. In a last ditch attempt to save his skin, he held a speech, appealing to the ex-Gaddafi soldiers. He stated that the war was created by the West, and caused by tribal factions and islamists acting on their own agendas, drunken and drugged. It seems that one of the soldiers found this insulting and hurled a stone towards Saif. Others quickly joined, and before long Saif was in a pool of blood, dead."
 LibyaFamily.77.a: "Murderers!"
 LibyaFamily.78.t: "Al-Saadi Gaddafi Dies In A Suicide Attack"
 LibyaFamily.78.d: "Al-Saadi was spending time in one of Gaddafi's strongholds, meant to be the final stand for the regime. While there, he was targeted by a suicide attack. A rebel pilot with the name of Muhammad Mokhtar Osman crashed his jet right into the building. While Al-Saadi apparently survived the initial crash, he later died somewhere in the building due to the fires caused by the attack. It is unclear how the jet managed to get so close without being shot down."
 LibyaFamily.78.a: "Why did nobody shoot it down?!"
 LibyaFamily.79.t: "Mutassim Gaddafi Executed"
 LibyaFamily.79.d: "Mutassim was retreating from one of the cities recently captured by the rebels, but on the way to the next military outpost, his convoy was intercepted by rebels. Mutassim tried to defend himself with a pistol, but he was wounded in the throat and he surrendered to the rebels. An argument began between him and his captors, and his captors asked him to say the shahada for forgiveness from God. Instead, Mutassim rubbed his necklace, an African magic talisman. The captors repeated their demand, saying 'this is the Quran, the last thing and the first thing', but Mutassim kept praying with his talisman. Frustrated, his captors shot him and burned the necklace."
 LibyaFamily.79.a: "And these people fight for a 'free' Libya..."
 LibyaFamily.80.t: "Hannibal Gaddafi Starved To Death"
 LibyaFamily.80.d: "Hannibal Gaddafi was kidnapped from his hotel one night a few weeks ago. The kidnap was orchestrated by a group of Shia militants who had travelled from Lebanon all the way to Libya. The militant spokesperson said that they were looking for the killers of Musa al-Sadr, a Shia cleric and leader of the Amal Movement who disappeared in Libya in 1978. Hannibal couldn't have possibly been involved, as he was only two-years-old at the time of the disappearance, but this seemed to matter little for his captors. As they couldn't get any information out of Hannibal, he was eventually left to wander around in the desert. He couldn't find any nearby settlements, and eventually died of thirst and starvation. He was later found by a military helicopter scouting the area."
 LibyaFamily.80.a: "What?!"
 LibyaFamily.81.t: "Ayesha Gaddafi Commits Suicide"
 LibyaFamily.81.d: "As the rebels approached the government held compound where Ayesha was currently in, her mind was full of panic. She had been told by her bodyguards that the area around the compound had been surrounded. The bodyguards advised her that perhaps the best course of action would be to simply surrender to the rebels. However, Ayesha was terrified of what would be done to her if she was captured. In an act of desperation, she ordered her bodyguards to lock her and her children in one of the compound's buildings and set it on fire. The bodyguards reluctantly did as they were told, and set the building on fire. They then surrendered to the rebels, explaining what had happened."
 LibyaFamily.81.a: "What?!"
 LibyaFamily.82.t: "Saif al-Arab Dies In An Airstrike"
 LibyaFamily.82.d: "Saif al-Arab has been killed in a NATO airstrike, along with three of Muammar Gaddafi's grandchildren. NATO claims that the building they hit was being used as a command-and-control center, and that it had an underground bunker. But who puts children in a military bunker? This is yet another attack against Libyan civilians by the NATO dogs, and they have martyred one of the greatest heroes of Libya."
 LibyaFamily.82.a: "How could they do this?"
 LibyaFamily.83.t: "Khamis Gaddafi Killed In A Firefight"
 LibyaFamily.83.d: "While organising defences on the frontline, Khamis has been killed in a firefight with the rebels. His position was aggressively assaulted by the rebels, trying to push him and his men out of a key position. When trying to relocate to a better position, Khamis was hit and wounded. He was capable of continuing the fighting for several minutes before being shot again, this time in the head."
 LibyaFamily.83.a: "He was a fighter"
 LibyaCivilWar.15.t: "The Libyan Revolution"
 LibyaCivilWar.15.d: "Attempts by Gaddafi to stifle the protests have failed. Violence has escalated to high levels, military units have defected and a new coalition of opposition fighters have taken control of Benghazi. The situation can now only be solved on the battlefield."
 LibyaCivilWar.15.a: "These 'rebels' are just CIA agents. Destroy them!"
 LibyaCivilWar.15.b: "Down with Gaddafi! Down with the dictator!"
 LibyaCivilWarContent.1.t: "Warfalla Tribal Militia"
 LibyaCivilWarContent.1.d: "The Warfalla tribe resides in Tripolitania, concentrated around Tripoli and Bani Walid, the only city in Libya to be inhabited by a single tribe. Due to threat of violence in the country as a result of the civil war, the tribe has mobilised some of its members to bolster our forces."
 LibyaCivilWarContent.1.a: "We thank them for their support"
 LibyaCivilWarContent.2.t: "The Qadhadhfa Offer Support To [ROOT.GetLeader]"
 LibyaCivilWarContent.2.d: "The Qadhadhfa is the tribe of the Gaddafi family. They are predominantly located near the city of Sirte, and it is their connection to the regime which has allowed the city to grow to the levels of Tripoli or Benghazi. The Qadhadhfa have always been loyal supporters of Gaddafi, and they have sponsored some additional fighters for our army."
 LibyaCivilWarContent.2.a: "We thank them for their loyalty"
 LibyaCivilWarContent.3.t: "Berbers Rise Up Against The Regime"
 LibyaCivilWarContent.3.d: "The Libyan border with Tunisia is home to a small community of Berbers. While under Gaddafi's regime, their rights were heavily suppressed, and Gaddafi himself denied the existence of a Berber ethnicity and called it a 'product of colonialism'. They have now decided to rise up against Gaddafi in the hopes of seeing a better future for themselves."
 LibyaCivilWarContent.3.a: "We will treat them better"
 LibyaCivilWarContent.4.t: "Berber Rebels In The West"
 LibyaCivilWarContent.4.d: "The Libyan border with Tunisia is home to a small community of Berbers. While under Gaddafi's regime, their rights were heavily suppressed, and Gaddafi himself denied the existence of a Berber ethnicity and called it a 'product of colonialism'. They have now decided to rise up against Gaddafi and pledge loyalty to the rebels in the hopes of seeing a better future for themselves."
 LibyaCivilWarContent.4.a: "They're not even real!"
 LibyaCivilWarContent.5.t: "Al-Mujabra Tribal Militia"
 LibyaCivilWarContent.5.d: "The al-Mujabra tribe resides in western Libya, near the Jabal al Gharbi district. General [LBA_abu_bakr_yunis_jabr.GetName], a notable member of this tribe, has motivated some of the members of the tribe to mobilise and join our side."
 LibyaCivilWarContent.5.a: "We thank them for their support"
 LibyaCivilWarContent.6.t: "Magarha Tribal Militia"
 LibyaCivilWarContent.6.d: "The Magarha tribe is the 2nd largest tribe in Libya, right after the Warfalla tribe. While the tribe originates from Fezzan, many of its members have moved to settle the city of Sirte and other coastal areas. Together with the Warfalla, most of the Magarha have been heavily loyal towards Gaddafi. Some of its members have now mobilised fighters to support us."
 LibyaCivilWarContent.6.a: "We thank them for their support"
 LibyaCivilWarContent.7.t: "Hassawna Tribal Militia"
 LibyaCivilWarContent.7.d: "The Hassawna tribe lives in Fezzan. The area that they inhabit provides 60 percent of Libya's water. Worried about the possible vandalism and take over wells in the area, the tribe has provided us with some of their fighters to keep their lands secure."
 LibyaCivilWarContent.7.a: "We thank them for their support"
 LibyaCivilWarContent.8.t: "[TUA.TUA_ali_kanna.GetName] Joins The Fight"
 LibyaCivilWarContent.8.d: "[TUA.TUA_ali_kanna.GetName] commanded the special Maghawir Brigade under Gaddafi. The brigade consisted of Tuareg volunteers from Niger and Mali. [TUA.TUA_ali_kanna.GetName] has now entered Libya with a host of Tuareg soldiers, stating that they will be fighting on our side."
 LibyaCivilWarContent.8.a: "Thanks for the help!"
 LibyaCivilWarContent.9.t: "TFSL allies with us"
 LibyaCivilWarContent.9.d: "The Toubou Front for Salvation of Libya, or TFSL, has taken up arms against Gaddafi. They have been organising a low level conflict against the Gaddafi regime for a few years now, but finally they are able to fight more openly."
 LibyaCivilWarContent.9.a: "We'll take them I guess"
 LibyaCivilWarContent.10.t: "Farjan Tribal Militia"
 LibyaCivilWarContent.10.d: "The Farjan tribe mainly lives west of Ajdabiya, though members of the tribe can be found everywhere on the Libyan coast. The bad security situation has motivated the tribe to organise a local militia to help us fight our enemies."
 LibyaCivilWarContent.10.a: "We thank them for their support"
 LibyaCivilWarContent.11.t: "Misurata Tribal Militia"
 LibyaCivilWarContent.11.d: "The largest and most influential tribe in Eastern Libya, the Misurata (after which the city of Misrata is named) have mobilised some of their soldiers to help us. The tribe has very strong influence in the cities of Benghazi and Dernah, and they are worried the civil war might make them lose that influence."
 LibyaCivilWarContent.11.a: "We thank them for their support"
 LibyaCivilWarContent.12.t: "Abaydat Tribal Militia"
 LibyaCivilWarContent.12.d: "One of the major tribes in Tobruk, the Abaydat tribe, is a collection of about 15 sub-tribes. In order to promote tribal cohesion, the tribe has created a joint unit of soldiers from a multitude of their sub-tribes to help us in our fight."
 LibyaCivilWarContent.12.a: "We thank them for their support"
 LibyaCivilWarContent.13.t: "The Revolution Begins!"
 LibyaCivilWarContent.13.d: "Down with Gaddafi! Down with the dictator! Our people have risen up against the tyrant and the Libyan revolution can begin! We must march into our enemy's capital and create a free country!"
 LibyaCivilWarContent.13.a: "For Libya!"
 LibyaCivilWarContent.13.tooltip: "§YAs the war drags on, more and more militias, private armies and rebel groups will join the fight. If we are to retain control of the country and prevent further conflict in the future, we should defeat our enemies quickly!§!"
 LibyaCivilWarContent.14.t: "Libyan People In Revolt"
 LibyaCivilWarContent.14.d: "The Zionists and the CIA have done it, they have hired foreign mercenaries to rouse up the people to fight against our regime. Oh how the misguided and innocent will suffer for this. We must strike quickly and cut off the head of the snake before more people fall to the devil's temptation."
 LibyaCivilWarContent.14.a: "For Libya!"
 LibyaCivilWarContent.14.tooltip: "§YThe longer the war continues, the more soldiers the rebels will be able to mobilise. With time, we will most likely become outnumbered§!"
 LibyaCivilWarContent.15.t: "Abu Salim Martyrs Brigade Forms"
 LibyaCivilWarContent.15.d: "The Libyan Islamic Fighting Group has been opposing Gaddafi for decades. Now with the popular revolt against him, the group has renamed itself to the Libyan Islamic Movement, and created a fighter's brigade called the Abu Salim Martyrs Brigade under Abdel-Hakim al-Hasidi. The group says that they are looking for a more democratic approach, but the leaders have openly admitted that their fighters have links to Al-Qaeda. Time will tell whether they are truly looking for reform or not."
 LibyaCivilWarContent.15.a: "I have a bad feeling about this..."
 LibyaCivilWarContent.15.tooltip: "§Y[Caliphate_L]§! will be known as §Y$LBA.Caliphate_reform$§!\n"
 LibyaCivilWarContent.16.t: "The Tripoli Brigade Is Founded"
 LibyaCivilWarContent.16.d: "A Libyan exile from Ireland, Mahdi al-Harati, together with other exiles from English speaking countries have formed what is being called the Tripoli Revolutionaries Brigade. Most of their recruits come from the Tripoli area, hence the name of the unit. The brigade has received extensive training from Qatari special forces. Since the outbreak of the war, Qatar has taken a more active interest in the country, most likely in the hopes of spreading the influence of the Muslim Brotherhood in the region."
 LibyaCivilWarContent.16.a: "Finally some elites for our army"
 LibyaCivilWarContent.17.t: "Formation Of The Zintan Brigades"
 LibyaCivilWarContent.17.d: "In the town of Zintan near Tripoli, revolutionaries have banded together as the Zintan Revolutionaries' Military Council and formed a unit to fight against Gaddafi. They are led by Osama al-Juwaili, an ex-captain of the Libyan army. Based on our intelligence reports, people are flocking under their banners in droves."
 LibyaCivilWarContent.17.a: "Finally some elites for our army"
 LibyaCivilWarContent.18.t: "Factionalism In The National Liberation Army"
 LibyaCivilWarContent.18.d: "When we started the revolution, many militias and volunteer brigades had to be brought under a single chain of command, and thus we created the National Liberation Army. We had nominated an ex-Gaddafi general as its chief-of-staff due to their expertise. However, Khalifa Haftar, an exile and a military commander from the United States has returned and self-claimed command over the army. Our official position is still in support of the ex-Gaddafi general, but Haftar is showing more and more promise on the battlefield. But a man who comes from nowhere and claims command of an army is an ambitious man, and he might be eager to claim command of the whole country if he gets the chance."
 LibyaCivilWarContent.18.a: "We can't afford rivalries!"
 LibyaCivilWarContent.19.t: "[ROOT.GetName] Has Been Assassinated!"
 LibyaCivilWarContent.19.d: "[ROOT.GetName], who we nominated as the Chief-of-Staff of our National Liberation Army, has been assassinated! It is unclear how it happened, but his body along with two other officers was found shot and burned on the outskirts of [FROM.capital.GetCapitalVictoryPointName]. Some say that he was shot by pro-Gaddafi assailants due to his treason against Gaddafi. However, some say they saw members of a Jihadist militia executing him due to what he had done while under the service of Gaddafi. Regardless, we must choose a new Chief-of-Staff. General Haftar could make a good one, but doing so would only empower him more."
 LibyaCivilWarContent.19.a: "Haftar is the best choice!"
 LibyaCivilWarContent.19.b: "Perhaps someone else"
 LibyaCivilWarContent.19.tooltip: "§YThis will reduce Haftar's ability to undermine our government later!§!"
 LibyaCivilWarContent.20.t: "New Martyrs' Brigade"
 LibyaCivilWarContent.20.d: "A new group of Jihadists has come together to form a military unit. These 'Martyrs' Brigades' fight for an Islamic Libya, and many of the fighters have strong links to Al-Qaeda or other extremist organisations. We must defeat the government quickly before our country is overrun with potential terrorists."
 LibyaCivilWarContent.20.a: "Where do they keep coming from?"
 LibyaCivilWarContent.20.tooltip: "Create a §YJihadist Unit§! in §Y[ROOT.capital.GetName]§!\n"
 LibyaCivilWarContent.21.t: "New Allies For Zintan Brigades"
 LibyaCivilWarContent.21.d: "A new militia group has joined under the banner of the Zintan Brigades. The Zintan Brigades are slowly becoming the strongest militia group in the country, and if we are not careful, they might try to seize control."
 LibyaCivilWarContent.21.a: "Why is nobody on our side?"
 LibyaCivilWarContent.21.tooltip: "Create an §YIslamist Unit§! in §Y[ROOT.capital.GetName]§!\n"
 LibyaCivilWarContent.22.t: "National Liberation Army Recruits"
 LibyaCivilWarContent.22.d: "The National Liberation Army has created another militia brigade to serve their needs. The military brass is mainly made up of ex-Gaddafi officers who would like to see a more secular Libya in the future."
 LibyaCivilWarContent.22.a: "The army's power grows ever stronger"
 LibyaCivilWarContent.22.tooltip: "Create a §YSecularist Unit§! in §Y[ROOT.capital.GetName]§!\n"
 LibyaCivilWarContent.23.t: "Pro-West Militias Trained"
 LibyaCivilWarContent.23.d: "While majority of Libyans wish for a more Islamic centered nation, there are some who wish to have a more Western oriented government. With the help of special forces and trainers from the West, a small and professional militia has been trained. They are now ready to fight Gaddafi."
 LibyaCivilWarContent.23.a: "Is the West trying to subdue us?"
 LibyaCivilWarContent.23.tooltip: "Create a §YReformist Unit§! in §Y[ROOT.capital.GetName]§!\n"
 LibyaCivilWarContent.24.t: "Victory In The Civil War!"
 LibyaCivilWarContent.24.d: "Gaddafi has been defeated, we are finally free of the tyrant! The National Transitional Council must now begin the transition to a legitimate government. Many militias and militant groups must be integrated. We must also organise elections to decide who will rule Libya in the future."
 LibyaCivilWarContent.24.a: "Here's to Libya's future!"
 LibyaCivilWarContent.24.b: "Elections? I don't think so"
 LibyaCivilWarContent.24.tooltip: "§YWe will hold elections one year from now§!"
 LibyaCivilWarContent.25.t: "Ansar al-Sharia Takes Control Of Benghazi"
 LibyaCivilWarContent.25.d: "Ansar al-Sharia is a global jihadist organisation. During the civil war, a local branch was created in Libya and slowly the group has been gaining power. Yesterday, a massive column of Ansar al-Sharia appeared in Benghazi. With almost two hundred pickup trucks and other heavy equipment, the group gathered around the Tahrir Square demanding Sharia law to be established and the plans for elections to be cancelled as 'un-Islamic'. The group has set up checkpoints in the city, and sent soldiers to guard major administrative buildings and service providers such as hospitals. They have already announced plans to establish Sharia courts and engage in Da'wah, or charity, for the local population in order to gain support."
 LibyaCivilWarContent.25.a: "Where the hell did they come from?"
 LibyaCivilWarContent.25.tooltip: "§YAnsar Al-Sharia§! takes control of §Y$STATE_395$§!\n"
 LibyaCivilWarContent.26.t: "Shura Council of Mujahideen in Derna Formed"
 LibyaCivilWarContent.26.d: "[ROOT.LBA_abdel_hakim_al_hasidi.GetName] created the Abu Salim Martyrs Brigade from ex-LIFG members to fight against Gaddafi. Shortly after the civil war, [ROOT.LBA_abdel_hakim_al_hasidi.GetName] started focusing more on politics, rather than leading the militia. This allowed one of the senior commanders of the militia, Salim Derby, to wrest effective control of it. Derby has now defected along with his unit, and taken control of the city of Derna in Eastern Libya together with the Jaysh al-Islam militia group. They have dubbed themselves the Shura Council of Mujahideen in Derna. Similar to Ansar al-Sharia in Benghazi, the group has started implementing Sharia law in the city. They have also allied themselves with the group in Benghazi. Eastern Libya has been the main source of Islamist fighters in the country, and it seems like there is no end to them."
 LibyaCivilWarContent.26.a: "We never should have trusted them"
 LibyaCivilWarContent.26.tooltip1: "To better represent the various groups of Islamists under their wing, §YAnsar al-Sharia§! has created the §YShura Council of Benghazi Revolutionaries§!. Their goal is now to create similar councils in other parts of the country\n"
 LibyaCivilWarContent.26.tooltip2: "§YLiwa Shuhada Abu Salim§! defects to §Y[ASL.GetNameDef]§!\n"
 LibyaCivilWarContent.27.t: "$VICTORY_POINTS_1127$ Falls To The Islamists"
 LibyaCivilWarContent.27.d: "[ASL.GetNameDef] have expanded their influence into the coastal city of $VICTORY_POINTS_1127$. The city is one of the key export and refinery centers for oil from the Wahat oil fields. Just like in Benghazi, Sharia law is being implemented with rigorous fervor by the Islamists."
 LibyaCivilWarContent.27.a: "Is there no stopping this disease?"
 LibyaCivilWarContent.28.t: "Rafallah al-Sahati Brigade Is Formed"
 LibyaCivilWarContent.28.d: "A new Islamist militia has been formed in Southern Libya. Made up of members of the 17 February Martyrs' Brigade, the Rafallah al-Sahati Brigade has started operating in $STATE_1100$. While they number less than a thousand, they are causing great concern to the local Toubou population."
 LibyaCivilWarContent.28.a: "Do we really care about them?"
 LibyaCivilWarContent.29.t: "$STATE_919$ Aligns With [ASL.GetNameDef]"
 LibyaCivilWarContent.29.d: "The area of $STATE_919$ was the main support base for Gaddafi's regime. With the fall of the Gaddafi regime, many soldiers, bureaucrats and administrators have had to return to their homes with nothing but the clothes on their back. This disenfranchisement has made them more and more hostile towards the new government. The situation has now escalated, with a pro-Gaddafi militia group that holds major influence on the town of $VICTORY_POINTS_4047$ having declared loyalty to [ASL.GetNameDef]."
 LibyaCivilWarContent.29.a: "Was it not enough to get rid of Gaddafi?"
 LibyaCivilWarContent.30.t: "[ASL.GetNameDef] Occupies $VICTORY_POINTS_6295$"
 LibyaCivilWarContent.30.d: "A contingent of [ASL.GetNameDef] yesterday moved a large convoy of troops from $STATE_919$ to $VICTORY_POINTS_6295$. On their arrival, they took control of town and its airfield, and reportedly some of the local militias defected to them. $VICTORY_POINTS_6295$ is an important military outpost, and while [ASL.GetNameDef] don't have an air force of their own, controlling the airfield allows them to use smaller planes for reconnaissance. This makes counter-attacking the town difficult, and our military high command is recommending an aerial assault on the town."
 LibyaCivilWarContent.30.a: "Do we really need the airfield?"
 LibyaCivilWarContent.30.tooltip: "As long as §Y[ASL.GetNameDef] controls the airfield§!, attacks against §Y$STATE_919$§! will be much more difficult!"
 LibyaCivilWarContent.31.t: "[ROOT.LBA_abdel_hakim_al_hasidi.GetName] Elected For Office"
 LibyaCivilWarContent.31.d: "Since opening our country for democracy, the [Caliphate_L] has run several candidates in local elections. Now the leader of the Abu Salim Martyrs Brigade, [ROOT.LBA_abdel_hakim_al_hasidi.GetName], has been elected for a local office in Derna. As he takes office, he will leave most of the management of the brigade to their second-in-command, Salim Derby."
 LibyaCivilWarContent.31.a: "Democracy at work"
 LibyaCivilWarContent.31.b: "We still need him on the battlefield"
 LibyaCivilWarContent.32.t: "Nominating a Minister of Defence"
 LibyaCivilWarContent.32.d: "With the Libyan National Army being rebuilt, we must nominate a defence minister. For best effect, we should select one of our generals, as they have the field experience needed to run the office."
 LibyaCivilWarContent.32.a: "Perhaps..."
 LibyaCivilWarContent.32.b: "Or maybe..."
 LibyaCivilWarContent.33.t: "Commander Abducted"
 LibyaCivilWarContent.33.d: "One of our military commanders has been abducted by a militia operating in our country. They are now demanding ransom for their release. We could pay the ransom, but this would only validate the militia. We could also just ignore the demands and the commander will most likely be released by their supporters. We could also simply send our special forces to rescue the commander, but this has some risks."
 LibyaCivilWarContent.33.a: "Just pay the ransom"
 LibyaCivilWarContent.33.b: "Their supporters can deal with them"
 LibyaCivilWarContent.33.c: "Send in the special forces!"
 LibyaCivilWarContent.34.t: "Commander Wanted For Warcrimes"
 LibyaCivilWarContent.34.d: "One of our commanders has been indicted for committing war crimes by the International Criminal Court. Based on several videos published online, the commander has personally executed, or ordered the execution of at least 33 people while commanding their troops in Libya. Both the US and the EU have put the commander under sanctions and an Interpol red notice has been issued for them. If we do not turn over the commander to the ICC, we will be targeted by these sanctions too."
 LibyaCivilWarContent.34.a: "We must arrest them"
 LibyaCivilWarContent.34.b: "They have done nothing wrong"
 LibyaCivilWarContent.35.t: "Commander Plans To Retire"
 LibyaCivilWarContent.35.d: "One of our commanders has announced that they are planning to retire from military service. They feel now that Libya is free of Gaddafi, their work is done. They are planning to spend the rest of their days helping their community as a local politician and not on the battlefield."
 LibyaCivilWarContent.35.a: "Let them retire"
 LibyaCivilWarContent.35.b: "We still need them"
 LibyaFocusNews.20.t: "Death Of Muammar Gaddafi"
 LibyaFocusNews.20.d.airstrike: "The dictator of Libya, Muammar Gaddafi, has been killed. While trying to escape from the rebels, his convoy was attacked by a NATO airstrike. After the convoy came to a halt, it also came under attack from rebel forces. Gaddafi's guards were killed, and he was found hiding in a drainage pipe by the rebels. The gruesome footage from the event shows a bloodied and bruised Gaddafi being dragged around by the rebels, being sodomised by a bayonet and apparently suffering from a gunshot wound. Gaddafi can be heard telling his captors 'God forbids this' and 'What did I do to you?', before the final footage shows him dead. NATO representatives denied they had knowledge of Gaddafi being part of the convoy, and the rebel spokesperson stated that no order had been given to kill Gaddafi. Gaddafi's heir Saif al-Islam has vowed to avenge his father and continue the fight for Libya."
 LibyaFocusNews.20.d: "The dictator of Libya, Muammar Gaddafi, has been killed. While trying to escape from the rebels, his convoy was attacked by rebel forces. Gaddafi's guards were killed, and he was found hiding in a drainage pipe by the rebels. The gruesome footage from the event shows a bloodied and bruised Gaddafi being dragged around by the rebels, being sodomised by a bayonet and apparently suffering from a gunshot wound. Gaddafi can be heard telling his captors 'God forbids this' and 'What did I do to you?', before the final footage shows him dead. The rebel spokesperson stated that no order had been given to kill Gaddafi. Gaddafi's heir Saif al-Islam has vowed to avenge his father and continue the fight for Libya."
 LibyaFocusNews.20.a: "Is this the end?"
