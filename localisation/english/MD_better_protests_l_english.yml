 protests_main_text: "We need to meet expectations of our citizens to avoid protests and other bad social developments.\nCurrent §YProtest Strength§!: [protest_strength_TT]\nCurrent §YProtest Radicalisation§!: [protest_radicalisation_TT][fuel_protests_TT]\n"
 OPEN_PROTESTS_BUTTON: "Open §YProtest System§! Screen"
 OPEN_PROTESTS_BUTTON_TT: "This screen will contain schematic information on expected governmental spending, expected protest movement strength and radicalisation."
 PROTEST_TITLE: "§YProtests System§!"
 CLOSE_PROTEST_SCREEN: "Close §YProtests System§! Screen"
 expected_law_mechanic_tt: "Purpose of §YProtests System§!\n"
 EL_green_square_explanation_tt: "§GGreen§! squares represent the level of spending required by our citizens and covered by our current spending."
 EL_blue_square_explanation_tt: "§BBlue§! squares represent the level of spending NOT required by our citizens but covered by our current spending."
 EL_red_square_explanation_tt: "§RRed§! squares represent the level of spending required by our citizens and NOT covered by our current spending - this is the source of protests gaining strength."
 EL_white_square_explanation_tt: "White squares represent possible levels of spending, which are not covered or expected."

 # Tooltips
 expected_social_spending_tt: "The following values represent the expected §YGovernment Expenditure§! on §YSocial Spending.§! Every whole number indictates a level of expected spending limited to the number of laws in the category.\n\nExpected Value of §YSocial Spending§! is §Y[expected_social_spending_law_name]§! (Current Value: [?expected_welfare_spending|0Y])\n\nBreakdown of Expected §YSocial Spending§!\n-----------\nLaw, National Spirits and Tech impact on §YExpected Social Spending§!: [?ROOT.modifier@expected_welfare_modifier]\nGDP/c Modifier on §YExpected Social Spending§!: [calculate_gdp_c_modifier_welfare_spending]\n"
 expected_health_spending_tt: "The following values represent the expected §YGovernment Expenditure§! on §YHealth Budget.§! Every whole number indictates a level of expected spending limited to the number of laws in the category.\n\nExpected Value of §YHealth Budget§! is §Y[expected_healthcare_spending_law_name]§! (Current Value: [?expected_health_spending|0Y])\n\nBreakdown of Expected §YHealth Budget§!\n-----------\nLaw, National Spirits and Tech impact on §YExpected Healthcare Spending§!: [?ROOT.modifier@expected_healthcare_modifier]\nGDP/c Modifier on §YExpected Health Budget§!: [calculate_gdp_c_modifier_healthcare_spending]\n"
 expected_adm_spending_tt: "The following values represent the expected §YGovernment Expenditure§! on §YAdministrative Spending.§! Every whole number indictates a level of expected spending limited to the number of laws in the category.\n\nExpected Value of §YAdministrative Spending§! is §Y[expected_bureau_spending_law_name]§! (Current Value: [?expected_adm_spending|0Y])\n\nBreakdown of Expected §YAdministrative Spending§!\n-----------\nLaw, National Spirits and Tech impact on §YExpected Administrative Spending§!: [?ROOT.modifier@expected_adm_modifier]\nGDP/c Modifier on §YExpected Administrative Budget§!: [calculate_gdp_c_modifier_adm_spending]\n"
 expected_edu_spending_tt: "The following values represent the expected §YGovernment Expenditure§! on §YEducation Budget.§! Every whole number indictates a level of expected spending limited to the number of laws in the category.\n\nExpected Value of §YEducation Budget§! is §Y[expected_education_spending_law_name]§! (Current Value: [?expected_edu_spending|0Y])\n\nBreakdown of Expected §YEducation Budget§!\n-----------\nLaw, National Spirits and Tech impact on §YExpected Education Spending§!: [?ROOT.modifier@expected_education_modifier]\nGDP/c Modifier on §YExpected Education Budget§!: [calculate_gdp_c_modifier_education_spending]\n"
 expected_police_spending_tt: "The following values represent the expected §YGovernment Expenditure§! on §YPolice Budget.§! Every whole number indictates a level of expected spending limited to the number of laws in the category.\n\nExpected Value of §YPolice Budget§! is §Y[expected_police_spending_law_name]§! (Current Value: [?expected_police_spending|0Y])\n\nBreakdown of Expected §YPolice Budget§!\n-----------\nLaw, National Spirits and Tech impact on §YExpected Police Spending§!: [?ROOT.modifier@expected_police_modifier]\nGDP/c Modifier on §YExpected Police Budget§!: [calculate_gdp_c_modifier_police_spending]\n"
 expected_defence_spending_tt: "The following values represent the expected §YGovernment Expenditure§! on §YMilitary Spending.§! Every whole number indictates a level of expected spending limited to the number of laws in the category.\n\nExpected Value of §YMilitary Spending§! is §Y[expected_mil_spending_law_name]§! (Current Value: [?expected_military_sp|0Y])\n\nBreakdown of Expected §YMilitary Spending§!\n-----------\nLaw, National Spirits and Tech impact on §YExpected Military Spending§!: [?ROOT.modifier@expected_mil_modifier]\nGDP/c Modifier on §YExpected Military Spending§!: [calculate_gdp_c_modifier_military_spending]\n"

 # Protest GUI banner
 MD_protests_gui_title: "§YProtest Situation Overview§!"

 MD_protests_state_calm_text: "§GCalm§! — no unrest mission active."
 MD_protests_state_calm_tt: "No warning or revolt mission is active. This panel stays visible while §YProtest Strength§! is above 20 — act on rising drift before a crisis triggers."
 MD_protests_state_warning_text: "§YWarning§! — protest movement forming."
 MD_protests_state_warning_tt: "The §YIncoming Protests§! mission is active. If it times out, a full revolt begins. Resolve it by meeting the §Yfixed economy§! and §Yfixed political§! conditions, or use §YAppease Protesters§! and §YPreemptive Reform§! to buy time and lower strength."
 MD_protests_state_revolt_text: "§RRevolt§! — resistance in core states."
 MD_protests_state_revolt_tt: "The §YIncoming Revolt§! mission is active. It completes when §Yall core states§! have no resistance. If it times out, a civil war begins. Use the appease, crackdown, and hearts-and-minds decisions to manage the situation."
 MD_protests_state_cooldown_text: "§BCooldown§! — recovering from crisis."
 MD_protests_state_cooldown_tt: "Post-crisis recovery period. No new protest mission can fire while §YMD_protest_cooldown§! is active (1000 days from crisis end). Use the time to reform spending and stability."

 MD_protests_strength_green: "§YProtest Strength:§! §G[?protest_strength|0]§! / 100"
 MD_protests_strength_yellow: "§YProtest Strength:§! §Y[?protest_strength|0]§! / 100"
 MD_protests_strength_orange: "§YProtest Strength:§! §O[?protest_strength|0]§! / 100"
 MD_protests_strength_red: "§YProtest Strength:§! §R[?protest_strength|0]§! / 100"
 MD_protests_strength_tt: "Protest Strength rises monthly from unresolved drivers and falls from passive cooling. At §Y50§!+ the system rolls each month for a Warning mission to fire."

 MD_drift_diagnosed_text: "§YTop driver:§! [MD_drift_top_source_label]"
 MD_drift_diagnosed_tt: "An internal review identified the largest single contributor to monthly Protest Strength growth. The label expires when the §YDiagnose Unrest§! flag runs out (30 days)."

 MD_drift_header_text: "§YMonthly drift sources§! (last tick):"

 MD_drift_spending_row_text: "Spending impact: [MD_drift_spending_value_colored]"
 MD_drift_spending_value_red: "§R+[?drift_spending_last|1]§!"
 MD_drift_spending_value_green: "§G[?drift_spending_last|1]§!"
 MD_drift_spending_value_yellow: "§Y[?drift_spending_last|1]§!"
 MD_drift_spending_tt: "Net impact of spending vs. citizen expectations across welfare, health, education, police, administration, military, and fuel. §RPositive§! = underspending raises protest strength. §GNegative§! = overspending cools tensions (but burns the treasury).\n\n§YTips:§!\n- The spending grid below shows red squares for budget gaps — raise those laws first.\n- Use §YEmergency Police Funding§! and §YJobs Program for the Unemployed§! to buy time while you rebalance.\n- Aim for net drift §G≤ 0§! by overspending slightly in the largest red category."
 MD_drift_stability_row_text: "Low stability + elections: §R+[?drift_stability_last|1]§!"
 MD_drift_stability_tt: "Stability is below §Y20%§! in an elected government.\n\n§YTips:§!\n- §YTax Relief for Citizens§! grants an immediate §G+5%§! stability bump.\n- Pass focuses or events that grant stability; pause expensive military builds that drain it.\n- Switching to a non-elected government removes this driver entirely if your ideology allows it."
 MD_drift_interest_row_text: "High interest rate: §R+[?drift_interest_last|1]§!"
 MD_drift_interest_tt: "Central bank interest rate is above §Y8.9%§!.\n\n§YTips:§!\n- Lower the rate from the §YMoney§! tab — every cut below §G8%§! removes this driver.\n- High rates strangle the economy and feed protests. Use rate hikes only as an inflation-fighting tool, not a permanent setting.\n- If you cannot cut rates yet, lean on §YTax Relief§! to absorb political fallout."
 MD_drift_recession_row_text: "Recession: §R+[?drift_recession_last|1]§!"
 MD_drift_recession_tt: "The economy is in §Yrecession§!. Random monthly hit, Poisson(λ=3).\n\n§YTips:§!\n- Cut interest rates and lift social/welfare spending to climb out faster.\n- Watch the economy panel for recession-recovery events and triggers.\n- Use §YEmergency Police Funding§! and §YJobs Program§! to soak the drift while the economy heals."
 MD_drift_depression_row_text: "Depression: §R+[?drift_depression_last|1]§!"
 MD_drift_depression_tt: "The economy is in §Ydepression§!. Random monthly hit, Poisson(λ=4).\n\n§YTips:§!\n- Same playbook as recession, but more urgent — depression deals roughly §R+33%§! more protest damage.\n- Cut interest rates aggressively, increase welfare and education spending.\n- Stack §YTax Relief for Citizens§! and §YJobs Program§! to keep protests manageable until the economy recovers."
 MD_drift_war_row_text: "War fatigue: §R+[?drift_war_last|1]§!"
 MD_drift_war_tt: "We have been at war for more than §Y36§! months. Drift scales with war length.\n\n§YTips:§!\n- Ending the war drops this driver to §G0§! instantly — push for victory or seek a peace deal.\n- Keep war support above §G50%§! through propaganda focuses and battlefield wins.\n- If revolts have started, §YHearts and Minds Campaign§! gives compliance growth while you wind down the war."
 MD_drift_corruption_row_text: "Coalition weakness: §R+[?drift_corruption_last|1]§!"
 MD_drift_corruption_tt: "Government coalition strength is below §Y30%§! while we have a corruption idea or no elections.\n\n§YTips:§!\n- Pass anti-corruption focuses or events to downgrade the corruption idea step by step.\n- Build coalition support via subideology pacts and political focuses.\n- Restoring elections removes this driver if your political path supports it.\n- §YTax Relief§! also nudges coalition strength up while you work on the root cause."
 MD_drift_ct_row_text: "Counter-terror policy: §R+[?drift_ct_last|1]§!"
 MD_drift_ct_tt: "Internet monitoring or protest arrests are active. Random monthly hit, Poisson(λ=5).\n\n§YTips:§!\n- CT policies are short-term tools — leaving them on past the crisis costs you ongoing protest pressure.\n- Remove the CT idea via its decision once the active mission clears.\n- Pair the CT idea with §YEmergency Police Funding§! during the crisis to maximise compliance gain."
 MD_drift_passive_row_text: "Passive cooling: §G[?drift_passive_last|1]§!"
 MD_drift_passive_tt: "Each month, there is a §Y50%§! chance of §G-2§! Protest Strength from public attention drifting elsewhere.\n\n§YTip:§!\n- Buy time with §YAppease Protesters§! and §YPreemptive Reform§! while passive cooling does its work — over a year, that averages out to about §G-12§! protest strength for free."

 MD_drift_total_text: "§YNet last month:§! [MD_drift_total_value_colored]"
 MD_drift_total_value_red: "§R+[?drift_total_last|1]§!"
 MD_drift_total_value_green: "§G[?drift_total_last|1]§!"
 MD_drift_total_value_yellow: "§Y[?drift_total_last|1]§!"
 MD_drift_total_tt: "Sum of all active drift sources plus passive cooling. Positive values mean Protest Strength is rising; negative means it is falling.\n\n§YHow to flip the net negative:§!\n- Target the largest driver first — see the §YTop driver§! line above.\n- §YPreemptive Reform§! and §YAppease Protesters§! buy time while structural fixes land.\n\n§YPromise decisions§! (commit to a 200–350 day goal — success extends the Revolt mission, failure adds a small penalty):\n- §YPromise: Emergency Police Funding§! — 200 days to drop Protest Strength by §G10§!. Success: §G+75§! days on the Revolt mission.\n- §YPromise: Tax Relief§! — 300 days to raise Stability by §G5%§!. Success: §G+100§! days on the Revolt mission.\n- §YPromise: Jobs Program§! — 350 days to drop unemployment by §G1.5%§!. Success: §G+120§! days on the Revolt mission."

 MD_protests_revolt_states_text: "§RCore states still resisting:§! §Y[?cores_resisting_count|0]§!"
 MD_protests_revolt_states_tt: "The §YIncoming Revolt§! mission completes when this reaches §G0§!. Each resistance pocket is cleared through compliance > 50% and resistance < 40% on that state, randomly resolved by the protest event chain."

