 israel_labour.0.t: "Movimentos Juvenis Trabalhistas"
 israel_labour.0.d: "Agora, o Tzofim recebe mais atenção do nosso governo. O Tzofim é famoso por ser o primeiro movimento de escotismo igualitário do mundo, em que meninos e meninas participam juntos em pé de igualdade. Eles são o futuro do nosso país."
 israel_labour.0.a: "De fato!"
