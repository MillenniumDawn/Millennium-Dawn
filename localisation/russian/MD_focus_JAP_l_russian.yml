 Japan_economy.28.c: "Grant the refinancing"
 Japan_economy.29.b: "Delist the company and let the auditors settle"
 Japan_economy.29.c: "Treat it as an isolated failure"
 Japan_economy.33.t: "The Probe Resumes"
 Japan_economy.33.d: "The review found what reviews find. A new lead has been appointed, the files have been returned, and the investigation resumes with the wind rather more against it than before. The firms have had six months to prepare, and they have used them."
 Japan_economy.33.a: "Begin again."
 Japan_economy.34.t: "The Register Is Clean"
 Japan_economy.34.d: "The last of the insolvent borrowers has been wound up. It took years, and the cost was paid in bankruptcies, in unemployment, and in a government that spent most of its political capital insisting the pain was necessary. What is left behind is an economy where credit goes to firms that can repay it, and where a balance sheet means what it says."
 Japan_economy.34.a: "It was worth the price."
 Japan_economy.35.t: "Nothing Failed"
 Japan_economy.35.d: "The insolvent names are gone from the register. None of them went bankrupt. They were absorbed into larger groups by ministry arrangement, and the larger groups now carry the duplicated plants, the duplicated laboratories, and the staff who were told on a Friday that they worked for a competitor on the Monday. No jobs were lost and nothing was admitted. Japan's industry is consolidated, stable, and slower than it was."
 Japan_economy.35.a: "The arrangement held."
 JAP_electronics_resilience_complete_TT: "§YElectronics Resilience§! stands at §G5§! or higher (currently [?JAP_electronics_resilience|Y0])"
 JAP_electronics_war_won_tt: "§Y$JAP_model_competition$§! ends for good and can no longer return, whatever Seoul, Taipei, and Shanghai do next."
 JAP_seismic_retrofitting: "National Seismic Retrofitting Programme"
 JAP_seismic_retrofitting_desc: "The 1981 Building Standards Act sets a floor, not a ceiling, and two thirds of the housing stock predates it. A national retrofitting programme works through the country region by region, funding base isolation for hospitals and city halls, shear walls and column jacketing for schools, and steel bracing for the elevated expressways that collapsed so spectacularly at Kobe. Construction becomes slower and dearer wherever the inspectors have been, but a retrofitted region rides out a major tremor with its infrastructure intact."
 JAP_news.04.t: "Japan Moves to Leave Article 9 Behind"
 JAP_news.04.d: "The Diet has received the final report of the Defense Transition Committee, and with it Japan has taken the decisive step away from Article 9 of its post-war constitution. For decades the clause renouncing war and the maintenance of war potential was managed through successive reinterpretations rather than amendment: the Self-Defense Forces were declared constitutional as a minimum necessary capability, overseas deployments were justified as reconstruction and logistics support, and the ban on collective self-defense was narrowed until allied ships and aircraft could be defended under a limited set of conditions. The committee's conclusion is that this accumulated body of interpretation can no longer be stretched to cover Japan's security requirements, and that the constraint should be set aside rather than reworded once more.\n\nThe practical consequences are immediate. Restrictions on the size and composition of Japanese formations fall away, the Self-Defense Forces are free to plan for operations beyond the defense of the home islands, and Tokyo regains the sovereign instruments of war and alliance leadership that every other major power takes for granted. Japanese officials have stressed continuity, describing the change as the formal recognition of a normal country's rights rather than a break with seventy years of restraint. In Beijing, Seoul and Pyongyang the reading is very different, and Washington now finds itself allied to a partner capable of far more than base access and rear-area support. Whatever framing prevails, the security architecture of East Asia has been rewritten in a single afternoon in the Diet."
 JAP_news.04.a: "The pacifist era in Tokyo is over."
 JAP_seismic_retrofit: "Seismic Retrofitting"
 JAP_seismic_retrofit_desc: "Every structure in this region has been surveyed, reinforced or rebuilt to withstand a major earthquake. Hospitals sit on base isolators, the older schools have been jacketed or torn down, and the expressway piers carry steel collars. Stricter codes, mandatory inspections and heavier foundations slow every new project down, but the region no longer fears the next tremor."
 JAP_seismic_retrofit_category: "Seismic Retrofitting"
 JAP_seismic_retrofit_category_desc: "Earthquake-proofing a region is a decade-long civil engineering effort, prefecture by prefecture and building by building. Once a region has been retrofitted it is spared future tremors entirely, at the permanent cost of slower construction under the stricter codes."
 JAP_seismic_retrofit_decision: "Retrofit [FROM.GetName]"
 JAP_seismic_retrofit_decision_desc: "Survey every structure in the region and bring it up to modern seismic standards. Two years of work and a substantial share of national output, in exchange for permanent immunity to earthquakes and a lasting penalty to local construction speed."
 JAP_zombie_companies_1: "Zombie Companies"
 JAP_zombie_companies_1_desc: "Years of forbearance have kept unprofitable, over-indebted firms alive on cheap credit, tying up capital, labour, and management that healthier industries need. Nobody has written down a loss, nobody has closed a plant, and nobody can say how much of the banking system is a fiction.\n-------------\nAt §YCorporate Restructuring Progress§! §G30§! you may take §Y$JAP_restructure_next_tranche$§! to ease this national spirit one step. See §Y$JAP_corporate_reform_category$§! for the current figures."
 JAP_zombie_companies_2: "Zombie Companies: Wind-Down"
 JAP_zombie_companies_2_desc: "The first tranche has been resolved. Loans have been written down rather than rolled over, the worst of the insolvent firms have gone through the courts, and capital that sat dead for a decade is moving again. What remains is larger, better connected, and far harder to touch.\n-------------\nAt §YCorporate Restructuring Progress§! §G60§! you may take §Y$JAP_restructure_next_tranche$§! to ease this national spirit one step further. See §Y$JAP_corporate_reform_category$§! for the current figures."
 JAP_zombie_companies_3: "Zombie Companies: Last Ledgers"
 JAP_zombie_companies_3_desc: "Only the last ledgers are still open. The remaining firms are the ones with the deepest bank relationships and the most political cover, and every one of them expects to outlast the government that came for it. The drag on the wider economy is now modest, but it is not yet gone.\n-------------\nAt §YCorporate Restructuring Progress§! §G85§! the resolution focus at the end of your chosen path §Gremoves§! this national spirit for good. See §Y$JAP_corporate_reform_category$§! for the current figures."
 JAP_saburoku_audit_campaign: "Audit the Saburoku Agreements"
 JAP_saburoku_audit_campaign_desc: "Article 36 of the Labour Standards Act lets a firm exceed the statutory eight-hour day by filing an agreement with its workers' representative, and for decades the ceiling written into those agreements was whatever the employer felt like writing. Inspectors now pull the filings and match them against attendance records, badge logs and building access data, and the Work Style Reform Act gives them a figure to measure against: forty-five hours a month, three hundred and sixty a year."
 JAP_paid_leave_enforcement_campaign: "Enforce the Five Days"
 JAP_paid_leave_enforcement_campaign_desc: "Japanese workers were granted annual leave and did not take it, because taking it marked you out. Since 2019 the obligation runs the other way: an employer whose staff have ten days or more must ensure five of them are actually used, and must nominate the dates itself if the worker will not. The ministry checks the leave ledgers and fines the firms whose books show untouched entitlement."
 JAP_equal_pay_audit_campaign: "Audit the Pay Gaps"
 JAP_equal_pay_audit_campaign_desc: "Four in ten Japanese workers are non-regular, doing the same work beside a permanent colleague for around sixty percent of the pay and none of the bonus. The Part-Time and Fixed-Term Employment Act obliges the employer to explain any difference in treatment when asked, in writing, and the explanations are collected and compared across an industry rather than left to die inside one company."
 JAP_inspector_sweep_campaign: "Sweep the Worst Offenders"
 JAP_inspector_sweep_campaign_desc: "The Labour Standards Inspection Offices pick a sector, arrive without notice and go through the timecards of every firm in it. The ministry publishes the names of the companies found in serious breach, which costs a recruiter far more than the fine does, because a graduate who has read the list does not apply."
 JAP_keidanren_review_campaign: "Review the Charter Compliance"
 JAP_keidanren_review_campaign_desc: "The Keidanren's Charter of Corporate Behaviour commits its members to working practices that most of them do not audit and none of them publish. The federation is persuaded to run a compliance cycle with real returns attached, member by member, and to report the aggregate to the ministry. Nothing is compulsory and nothing is named, which is exactly why the enterprise groups agree to it."
 JAP_shunto_wage_round_campaign: "Back the Spring Wage Offensive"
 JAP_shunto_wage_round_campaign_desc: "Every spring Rengo's affiliates put a figure to the employers and the employers put back a smaller one, and for two decades the base-up component of that settlement was zero. The government leans on the enterprise groups to concede a real increase, because a worker paid enough to live on stops taking the overtime that is killing them, and pairs the pressure with tax relief for the firms that move first."
 JAP_health_stock_listing_campaign: "Expand the Health Management Listing"
 JAP_health_stock_listing_campaign_desc: "The ministry and the Tokyo Stock Exchange jointly name a handful of listed firms each year as Health and Productivity Stocks, on the theory that a company which does not exhaust its staff is a better long-term holding. Widening the selection and publishing the scoring turns workplace health into something a fund manager can price, which reaches boards that a labour inspector never will."
 JAP_shift_rotation_campaign: "Subsidise the Morning Shift"
 JAP_shift_rotation_campaign_desc: "Move the working day forward, pay the premium for the early hours instead of the late ones, and cut the power to the floor in the evening so that staying is not an option. Itochu did it and found its productivity rose and its birth rate with it; the state now pays part of the transition cost for any firm willing to follow."
 JAP_overcome_the_slump: "Press the Recovery Onward"
 JAP_overcome_the_slump_desc: "The measures already running have moved enough of the ledger to be worth consolidating. Support billed as temporary is written into the base budget, the ministries stop treating the slump as the working assumption, and firms are told plainly that demand is expected to hold. Each step eases §Y$JAP_entrenched_demand_shortfall_idea_1$§! by one tier; taken at the end, it closes out the long slump for good."
 JAP_demand_recovery_progress_tier_1_TT: "§YDemand Recovery Progress§! is at least §G30§!"
 JAP_demand_recovery_progress_tier_2_TT: "§YDemand Recovery Progress§! is at least §G60§!"
 JAP_demand_recovery_progress_complete_TT: "§YDemand Recovery Progress§! is at least §G85§!"
 JAP_demand_shortfall_resolved: "Japan's §Ydemand slump§! has been overcome"
 JAP_restructure_next_tranche: "Resolve the Next Tranche"
 JAP_restructure_next_tranche_desc: "Enough of the ledger has been worked through to close a batch of it for good. The regulator publishes the settled cases, the banks book the losses they have been deferring, and the firms in that tranche either emerge solvent or stop existing. Each tranche eases §Y$JAP_zombie_companies$§! by one step; the final clearance comes with the focus at the end of your chosen path."
 JAP_enforce_next_reforms: "Enforce the Next Reforms"
 JAP_enforce_next_reforms_desc: "The measures already on the books are brought into force rather than left as intentions. Ceilings that were advisory become enforceable, exemptions written for the largest employers are narrowed, and the inspectorate is given the staff to follow up on what it finds. Each round eases §Y$JAP_karoshi_crisis$§! by one step; the crisis is lifted for good by the focus at the end of your chosen path."
 JAP_galapagos_research_drift_recover_tt: "Recovers $RIGHT|+=%1$ of the §YResearch Drift§! lost to isolation. It can never be pushed past §Y0§!"
 JAP_galapagos_research_drift_down_tt: "§YResearch Drift§! worsens by $RIGHT|+=%1$ this review, and can never fall past §R-15%§!"
 JAP_galapagos_drift_review_mission: "The Standards Gap"
 JAP_galapagos_drift_review_mission_desc: "The Ministry of Economy, Trade and Industry keeps a standing assessment of how far Japanese specification has drifted from the specification its customers use, and reports the figure every thirty days. Each report is worse than the last, because the divergence compounds while nothing is done about it and the certification bodies keep writing the domestic clause first. The lower §YOpenness§! sits the faster the gap widens; at §G100§! it stops widening altogether.\n-------------\nThe assessment closes for good when Japan reaches §G85§! §YOpenness§! on the §Y$JAP_world_integration$§! path. Nothing else ends it."
 JAP_galapagos_cure_condition_TT: "§YOpenness§! stands at §G85§! or higher (currently [?JAP_galapagos_openness|Y0]), dissolving §Y$JAP_galapagos_syndrome$§!"
 JAP_cool_japan_sphere_count_mission: "Quarterly Sphere Count"
 JAP_cool_japan_sphere_count_mission_desc: "Once a quarter the Creative Industries Promotion Office tallies every country where Japanese influence stands at twenty percent or higher and files the total as an export figure. The trade delegations plan the next quarter around the list, and the firms that follow them abroad plan around the delegations. A sphere that stops growing stops paying, and the count is the only place that shows up before the revenue does."
 JAP_cool_japan_sphere_count_step_tt: "§YCultural Sphere§!: [?JAP_galapagos_sphere_count|Y0] countries carrying §G20%§! Japanese influence or more at the last count. Each one is worth §G+1%§! §Yforeign influence§! and §G+0.2%§! §Yreturn on investment§!, raised by half with §Y$JAP_electronics_superpower$§! and by a further quarter with §Y$JAP_home_electronics$§!."
 JAP_zombie_companies_resolved: "Japan's §Yzombie companies§! have been fully wound down"
 JAP_corporate_restructuring_complete_TT: "§YCorporate Restructuring Progress§! is at least §G85§!"
 JAP_restructure_tranche_1_TT: "§YCorporate Restructuring Progress§! is at least §G30§!"
 JAP_restructure_tranche_2_TT: "§YCorporate Restructuring Progress§! is at least §G60§!"
 JAP_karoshi_wellbeing_tier_1_TT: "§YWorker Wellbeing§! is at least §G30§!"
 JAP_karoshi_wellbeing_tier_2_TT: "§YWorker Wellbeing§! is at least §G60§!"
 JAP_karoshi_wellbeing_complete_TT: "§YWorker Wellbeing§! is at least §G85§!"
 JAP_zombie_case_files_down_3_tt: "§YCase Files§!: §R-3§!"
 JAP_zombie_case_files_downsize_tt: "§YCase Files§!: [?JAP_zombie_case_files|0] / 10"
 JAP_zombie_case_files_fusion_tt: "§YCase Files§!: [?JAP_zombie_case_files|0] / 3"
 JAP_zombie_case_choice_TT: "The case comes to a head in §Y60 days§!, and you will choose:\n§GProsecute§!: §G+2 case files§!, §R+8 obstruction§!, and the conglomerates will remember it\n§YRescue quietly§!: §G+1 case file§!, §R+2 obstruction§!, paid out of the treasury\n§RWave it through§!: no case file, §G-3 obstruction§!, and the firms are reassured"
 JAP_zombie_whitewash_penalty_TT: "A whitewash §Rwipes the case files§! gathered so far and slows the wind-down by §R25%§!. Neither resolution is lost: the remaining cases can still be worked"