 SOV_khodorkovsky_path_warning_TT: "§YEl veredicto es el primero de cinco fallos que deciden el modelo económico de Rusia.§! Declarar a Jodorkovski §Gculpable§! permite al Estado §Yexpropiar Yukos§! de inmediato. Declararlo §Rinocente§! deja a Yukos en manos privadas y envía el caso a §Yapelación§!."
 SOV_khodorkovsky_guilty_path_TT: "Declarar a Jodorkovski §Gculpable§! preserva el acceso a la §Ysenda putinista§!."
 SOV_khodorkovsky_not_guilty_path_TT: "Declarar a Jodorkovski §Rinocente§! cierra la §Ysenda putinista§! y compromete a Rusia con la §Ysenda liberal§!."
 SOV_subject_referendum_tt: "§YEsto activará un referéndum sobre el estatus de la región: puede permanecer (o convertirse) en un sujeto autónomo de [ROOT.GetNameWithFlag], o lograr la plena §Rindependencia§!. Si sigue siendo un sujeto, los §Yimpuestos federales§! recaudados en él §Gaumentarán§!, y el §Yseparatismo§! entre los demás sujetos §Gdisminuirá§!§!\n"
 SOV_chechnya_referendum_tt: "§YEsto activará un referéndum para establecer formalmente a Chechenia como un sujeto autónomo de [ROOT.GetNameWithFlag]. Los §Yimpuestos federales§! recaudados en ella §Gaumentarán§!, y el §Yseparatismo§! entre los demás sujetos §Gdisminuirá§!§!\n"
