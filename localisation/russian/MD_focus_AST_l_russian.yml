 australian_peacekeeping: "Австралийские миротворцы"
 australian_peacekeeping_desc: "В целях оказания нам помощи в решении текущих проблем безопасности австралийские миротворцы были направлены для содействия восстановлению стабильности, оказания военной поддержки и предоставления помощи."
