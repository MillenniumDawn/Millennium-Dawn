 Sweden_foci.5001.t: "스웨덴의 수송 헬리콥터 도입 요청에 대한 회신"
 Sweden_foci.5001.d1: "방금 MH-60L 블랙호크 헬리콥터를 조달하겠다는 스웨덴의 요청을 접수했습니다. 이 요청을 승인하면 양국 간 방위 관계가 강화되고 스웨덴의 전술 수송 능력이 향상될 것입니다."
 Sweden_foci.5001.d2: "방금 Mi-26 헬리콥터를 조달하겠다는 스웨덴의 요청을 접수했습니다. 이 요청을 승인하면 군사 협력의 길이 열리고 스웨덴의 중량물 수송 능력이 크게 향상될 수 있습니다."
 Sweden_foci.5001.d3: "방금 AS532 쿠거 헬리콥터를 조달하겠다는 스웨덴의 요청을 접수했습니다. 이 요청을 승인하면 더욱 긴밀한 방위 관계가 조성되고 스웨덴에 다목적 중형 수송 능력이 제공될 것입니다."
