 engine_prop_eight_1: "Ранний винтовой двигатель"
 engine_prop_eight_1_desc: "Винтовые двигатели времён Второй мировой войны все еще обеспечивали необходимую тягу, позволяющую самолётам вести боевые действия, особенно в условиях ограниченного бюджета.$ENGINE_INFO$"
 engine_prop_eight_2: "Восьмидвигательная винтовая установка холодной войны"
 engine_prop_eight_2_desc: "Совершенствование винтовых двигателей позволило некоторым самолётам продолжать использовать их даже в эпоху реактивных двигателей.$ENGINE_INFO$"
 engine_solar_single_1: "Солнечный двигатель"
 engine_solar_single_1_desc: "Использование двигателей, работающих на солнечной энергии, позволило самолётам работать на электрических двигателях, устранив потребность ВВС в топливе.\n\n§GПодсказка дизайнера: Солнечные двигатели обнуляют расход топлива и значительно увеличивают дальность полёта, но сильно снижают защиту и радиолокационное преимущество. Рекомендуются только для самолётов в конфликтах низкой интенсивности, где у противника мало авиации и ПВО.§!"
 engine_solar_double_1: "Сдвоенные солнечные двигатели"
 engine_solar_double_1_desc: "Использование двигателей, работающих на солнечной энергии, позволило самолетам работать на электрических двигателях, устранив потребность ВВС в топливе.\n\n§GПодсказка дизайнера: Солнечные двигатели обнуляют расход топлива и значительно увеличивают дальность полёта, но сильно снижают защиту и радиолокационное преимущество. Рекомендуются только для самолётов в конфликтах низкой интенсивности, где у противника мало авиации и ПВО.§!"
 engine_nuclear_eight_1: "Ядерный двигатель"
 engine_nuclear_eight_1_desc: "Ядерные двигатели обеспечивают самолёту огромную дальность полета за счёт снижения скорости и производительности.\n\n§GПодсказка дизайнера: С этими двигателями самолёт станет чрезвычайно дорогим, но в сочетании с оборудованием для увеличения дальности сможет наносить удары по всему миру с родной базы. Используйте на свой страх и риск.§!"
 weap_buff_transport: "Возможность воздушного десантирования"
 weap_buff_transport_desc: "Пространство для десантников и десантируемых грузов.\n\n§GПодсказка дизайнера: Используйте этот модуль для создания транспортных самолётов. Он закрывает доступ почти ко всем системам вооружения, кроме палетизированных КРВБ.§!\n\n§WИспользование этого оружия в качестве основного позволит создать§! §BБеспилотник/Транспортный самолёт§!"
 weap_buff_awacs_1: "ДРЛОиУ холодной войны"
 weap_buff_awacs_1_desc: "Первые РЛС ДРЛО и системы командования, управления и связи (КУС)\n\n§GПодсказка дизайнера: Системы ДРЛО дают значительный бонус к превосходству в воздухе вашим силам во время воздушной разведки — за каждый самолёт эскадрильи, выполняющий задание.§!\n\n§WИспользование этого в качестве основного вооружения приведёт к появлению§! §Bсамолёта ДРЛО§!"
 weap_buff_awacs_2: "Современные системы ДРЛОиУ"
 weap_buff_awacs_2_desc: "Современные РЛС ДРЛО и системы передачи данных\n\n§GПодсказка дизайнера: Системы ДРЛО дают значительный бонус к превосходству в воздухе вашим силам во время воздушной разведки — за каждый самолёт эскадрильи, выполняющий задание.§!\n\n§WИспользование этого в качестве основного вооружения приведёт к появлению§! §Bсамолёта ДРЛО)§!"
 weap_buff_awacs_3: "Передовая система ДРЛОиУ"
 weap_buff_awacs_3_desc: "Передовые системы РЛС ДРЛО, передачи данных и управления беспилотниками.\n\n§GПодсказка дизайнера: Системы ДРЛО дают значительный бонус к превосходству в воздухе вашим силам во время воздушной разведки — за каждый самолёт эскадрильи, выполняющий задание.§!\n\n§WИспользование этого в качестве основного вооружения приведёт к появлению§! §Bсамолёта ДРЛО§!."
 weap_multi_at_1: "Ранняя противотанковая пушка"
 weap_multi_at_1_desc: "Первые установленные на самолетах противотанковые пушки, предназначенные для пробивания брони времен Второй мировой войны.\n\n§GПодсказка дизайнера: Используйте этот слот вооружения для штурмовиков: он повышает урон при непосредственной авиаподдержке и ударах.§!"
 weap_multi_at_2: "Противотанковая пушка холодной войны"
 weap_multi_at_2_desc: "Противотанковая пушка времен холодной войны, предназначенная для пробивания бронетехники и БТР/БМП раннего периода холодной войны.\n\n§GПодсказка дизайнера: Используйте этот слот вооружения для штурмовиков: он повышает урон при непосредственной авиаподдержке и ударах.§!"
 weap_multi_gun_1_desc: "Револьверные пушки времен Корейской войны.\n\n§GПодсказка дизайнера: Используйте этот вариант вооружения, чтобы совместить характеристики воздушной атаки и атаки по наземным целям.§!"
 weap_multi_gun_2: "20-мм пушка"
 weap_multi_gun_2_desc: "20мм поворотная пушка для самолетов.\n\n§GПодсказка дизайнера: Используйте этот вариант вооружения, чтобы совместить характеристики воздушной атаки и атаки по наземным целям.§!"
 weap_multi_gun_3: "30-мм пушка"
 weap_multi_gun_3_desc: "Роторная пушка, модернизированная до калибра 30 мм.\n\n§GПодсказка дизайнера: Используйте этот вариант вооружения, чтобы совместить характеристики воздушной атаки и атаки по наземным целям.§!"
 weap_mp_heavy_hardpoint_1: "Тяжёлая точка подвески 1-го поколения"
 weap_mp_heavy_hardpoint_1_desc: "Узлы подвески, спроектированные для размещения тяжёлого вооружения, включая тяжёлые противокорабельные ракеты, бомбы массой 2000 фунтов, крылатые ракеты и некоторые тяжёлые ракеты «воздух-воздух».\n\n§GПодсказка дизайнера: Используйте эту точку подвески для самолётов, способных выполнять большинство заданий, но в первую очередь — противокорабельные удары или стратегические бомбардировки.§!\n\n§WИспользование этого узла в качестве основного вооружения создаст§! §Bмногоцелевой истребитель§!\n\n§RПРЕДУПРЕЖДЕНИЕ: палубные многоцелевые истребители будут атаковать в морском бою только вражеские корабли§!"
 weap_mp_heavy_hardpoint_2: "Тяжёлая точка подвески 2-го поколения"
 weap_mp_heavy_hardpoint_2_desc: "$weap_mp_heavy_hardpoint_1_desc$"
 weap_mp_heavy_hardpoint_3: "Тяжёлая точка подвески 3-го поколения"
 weap_mp_heavy_hardpoint_3_desc: "$weap_mp_heavy_hardpoint_1_desc$"
 weap_mp_heavy_hardpoint_4: "Тяжёлая точка подвески 4-го поколения"
 weap_mp_heavy_hardpoint_4_desc: "$weap_mp_heavy_hardpoint_1_desc$"
 weap_as_hardpoint_1: "Противокорабельная точка подвески 1-го поколения"
 weap_as_hardpoint_1_desc: "Узлы подвески, предназначенные для перевозки тяжёлого противокорабельного вооружения, торпед и оборудования для постановки или траления мин.\n\n§GПодсказка дизайнера: Используйте эту точку подвески для самолётов, предназначенных для противокорабельных заданий.§!\n\n§WИспользование этого в качестве основного вооружения создаст§! §Bморской бомбардировщик§!\n\n§RВНИМАНИЕ: палубные морские бомбардировщики будут атаковать вражеские корабли только во время морского боя§!"
 weap_as_hardpoint_2: "Противокорабельная точка подвески 2-го поколения"
 weap_as_hardpoint_2_desc: "$weap_as_hardpoint_1_desc$"
 weap_as_hardpoint_3: "Противокорабельная точка подвески 3-го поколения"
 weap_as_hardpoint_3_desc: "$weap_as_hardpoint_1_desc$"
 weap_as_hardpoint_4: "Противокорабельная точка подвески 4-го поколения"
 weap_as_hardpoint_4_desc: "$weap_as_hardpoint_1_desc$"
 weap_ag_gunship_1: "25–40-мм пушки"
 weap_ag_gunship_1_desc: "25-мм пушка Гатлинга и 40-мм пушка Бофорс, установленные на крупных самолетах, позволяют использовать их в качестве боевых самолетов, обеспечивая высокоточную огневую поддержку наземным подразделениям.\n\n§GПодсказка дизайнера: Используйте этот модуль для создания тяжёлых самолётов непосредственной авиаподдержки. Они дают много поддержки, но очень уязвимы в любом оспариваемом воздушном пространстве.§!\n\n§WИспользование этого оружия в качестве основного позволит создать§! §Bштурмовик§!"
 weap_ag_gunship_2: "105-мм пушка"
 weap_ag_gunship_2_desc: "105мм пушки-гаубицы позволяют ганшипам обеспечивать артиллерийскую и танковую поддержку наземных подразделений точным огнём прямой наводки.\n\n§GПодсказка дизайнера: Используйте этот модуль для создания тяжёлых самолётов непосредственной авиаподдержки. Они дают много поддержки, но очень уязвимы в любом оспариваемом воздушном пространстве.§!\n\n§WИспользование этого оружия в качестве основного позволит создать§! §Bштурмовик§!"
 weap_ag_rapid_dragon: "Палетизированные КРВБ"
 weap_ag_rapid_dragon_desc: "По мере того как страны экспериментируют с применением оружия, поддоны, предназначенные для запуска ALCM прямо с борта транспортного самолёта, быстро меняют роль, которую способны выполнять большие транспорты.\n\n§GПодсказка дизайнера: Этот модуль позволяет транспортным самолётам выполнять стратегические бомбардировки. Помните, что на этом задании транспортные самолёты всё равно очень уязвимы.§!"
 weap_ag_strat_1: "Бомбовый отсек 1-го поколения"
 weap_ag_strat_1_desc: "Специальные бомбовые отсеки позволяют самолёту нести большое количество авиационных бомб, в основном используемых для нанесения ударов по стратегическим целям в больших объёмах.\n\n§GПодсказка дизайнера: Эти модули дают приличные показатели стратегических бомбардировок и ударов по кораблям, но снижают радиолокационное преимущество и защиту. Большое их количество на одном самолёте значительно снизит радиолокационное преимущество и сделает его уязвимым в оспариваемом воздушном пространстве.§!\n\n§WИспользование в качестве основного оружия создаст §! §BСтратегический бомбардировщик§!"
 weap_ag_strat_2: "Бомбовый отсек 2-го поколения"
 weap_ag_strat_2_desc: "$weap_ag_strat_1_desc$"
 weap_ag_strat_3: "Бомбовый отсек 3-го поколения"
