 SP_arty_7_desc: "강력한 간접 사격 능력을 갖춘 자주포는 전장에서 필요한 곳에, 그리고 시야 밖 먼 거리까지 지속적인 정밀 타격을 제공합니다. 승무원이 직접 재장전할 수 있으며, 자체 추진 능력 덕분에 기동성이 높아 적 포병의 대포병 사격을 피해 이동할 수 있습니다."
 SP_R_arty_7: "다연장로켓발사시스템(MLRS) 2065"
 SP_R_arty_7_desc: "자주식 다연장 로켓 발사기는 넓은 지역 전체를 뒤덮는 로켓 일제 사격을 빠르게 퍼부을 수 있습니다. 주로 적의 집결지에 대해 운용됩니다. 광범위한 파괴를 일으키기 때문에 일반 포병보다 최소 교전 거리가 더 깁니다. 또한 정확도가 낮아 정밀 타격에는 적합하지 않습니다. 재장전을 위해 전용 지원 차량이 필요합니다."
 SP_arty_8: "자주포 2075"
 SP_arty_8_desc: "강력한 간접 사격 능력을 갖춘 자주포는 전장에서 필요한 곳에, 그리고 시야 밖 먼 거리까지 지속적인 정밀 타격을 제공합니다. 승무원이 직접 재장전할 수 있으며, 자체 추진 능력 덕분에 기동성이 높아 적 포병의 대포병 사격을 피해 이동할 수 있습니다."
