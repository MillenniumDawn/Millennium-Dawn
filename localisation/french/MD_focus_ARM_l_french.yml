 ARM_prioritize_invest_davisur: "Investir dans l'équipement de l'armée"
 ARM_balanced_solution: "Créer une solution équilibrée"
 ARM_ideal_balance: "Nouvelle disposition arménienne"
 ARM_armenian_mafia_6_desc: "Après l'effondrement de l'Union soviétique, en raison de l'incapacité de l'État à faire face aux problèmes internes, le problème du crime organisé est apparu en Arménie, qui, coopérant avec les oligarques et faisant souvent partie de l'oligarchie, a eu un impact négatif sur la situation socio-économique arménienne."
 ARM_armenian_mafia_4_desc: "Après l'effondrement de l'Union soviétique, en raison de l'incapacité de l'État à faire face aux problèmes internes, le problème du crime organisé est apparu en Arménie, qui, coopérant avec les oligarques et faisant souvent partie de l'oligarchie, a eu un impact négatif sur la situation socio-économique arménienne."
 ARM_armenian_mafia_3_desc: "Après l'effondrement de l'Union soviétique, en raison de l'incapacité de l'État à faire face aux problèmes internes, le problème du crime organisé est apparu en Arménie, qui, coopérant avec les oligarques et faisant souvent partie de l'oligarchie, a eu un impact négatif sur la situation socio-économique arménienne."
 ARM_armenian_mafia_2_desc: "Après l'effondrement de l'Union soviétique, en raison de l'incapacité de l'État à faire face aux problèmes internes, le problème du crime organisé est apparu en Arménie, qui, coopérant avec les oligarques et faisant souvent partie de l'oligarchie, a eu un impact négatif sur la situation socio-économique arménienne."
 armenian_perseverance: "La persévérance arménienne"
 armenian_perseverance_desc: "De nombreuses civilisations ont connu des hauts et des bas au cours des trois derniers millénaires. Contrairement à leurs anciens amis et ennemis, les Arméniens survivent encore. Même si l'Arménie historique ne reviendra peut-être jamais, leur volonté de prospérer et de perdurer est plus forte que jamais."
 NKR_marz_arm: "De-Facto Marz of [ARM.GetNameWithFlag]"
 NKR_marz_tt: "\n§YDépense supplémentaire : $$§R0,350§!§! pour les taxes §Yarméniennes§! [ARM.GetFlag]\n"
 ARM_echoes_1999: "Échos de 1999 - §9Opposition unifiée§!"
 ARM_echoes_1999_desc: "Les conséquences de la fusillade parlementaire de 1999 continuent d'agiter la population et forcent les factions de l'opposition à protester contre Kotcharian."
 ARM_echoes_1999_pac: "Échos de 1999 - §YNationalistes purgés de la coalition§!"
 ARM_echoes_1999_pac_desc: "Les conséquences de la fusillade parlementaire de 1999 continuent d'agiter la population et forcent les factions de l'opposition à protester contre Kotcharian."
 ARM_changes_in_militar: "Changements dans l'armée"
 ARM_broken_economy: "Écho économique des années 90"
 ARM_broken_economy_desc: "L'économie arménienne est en profond déclin. Des oligarques bien installés résistent à la réforme, laissant les problèmes structurels sans réponse.\n§W--------------§!\nCet esprit national sera §Rretiré§! si notre §HPIB par habitant§! dépasse §H$20,000§!."
 ARM_diaspora_links: "Liens avec la diaspora"
 ARM_diaspora_links_desc: "La diaspora arménienne à travers le monde dispose de connexions importantes et peut nous aider à établir des relations ou à influencer d'autres pays.\n\nCet esprit national nous donne accès à un ensemble de décisions liées à la diaspora.\n§W--------------§!\nCet esprit national sera §Rretiré§! si nous achevons le focus §HRégler les contradictions irréconciliables§!."
 ARM_rural_water_issues: "Problème d'approvisionnement en eau en milieu rural"
 ARM_rural_water_issues_desc: "Après l'effondrement de l'URSS, l'Arménie a commencé à rencontrer des problèmes d'infrastructures d'irrigation. Bien que l'agriculture occupe une part importante de l'économie arménienne, ces problèmes n'ont pas encore été résolus."
 ARM_102st_base: "[SOV.GetNameWithFlag] 102nd Military Base"
 ARM_102st_base_desc: "La 102e base militaire russe est une base militaire russe à Gyumri, en Arménie, sous le commandement du district militaire du Sud des forces armées russes.\n§W--------------§!"
 ARM_echoes_of_1999: "Échos de 1999"
 ARM_echoes_of_1999_desc: "L’Arménie se trouve à un tournant politique et récolte les fruits de l’attentat terroriste de 1999. Que signifie l’ascension de Robert Kotcharian pour l’Arménie ?"
 ARM_agree_on_places: "Accords sur les lieux"
 ARM_high_emigration_0: "Très petite émigration"
 ARM_high_emigration_0_desc: "Avec l'effondrement de l'URSS et la détérioration de la situation économique, de nombreux pays de la CEI sont devenus otages d'une migration externe accrue. Dans les réalités d'aujourd'hui, l'Arménie est menacée d'extinction, ce que l'on ne peut pas dire de son voisin oriental et principal ennemi politique. La résolution de la question démographique doit devenir l'agenda principal de la politique arménienne.\n§W--------------§!\nCet esprit national §Gs'améliorera§! si notre §HPIB§! dépasse §H$100B§! et que la stabilité est d'au moins §H64%§!."
 ARM_immigration_desc: "Armenians from all over the world are systematically returning to their historic homeland, repatriating en masse as full-fledged citizens."
 ARM_russia_debt_wait: "[SOV.GetNameWithFlag] Debt §WDelay§! Agreement"
 ARM_russia_debt_wait_desc: "[ARM.GetNameWithFlag] is the only country whose debt was not assumed or forgiven by [SOV.GetNameWithFlag]. No matter if it was a political or pragmatic move, they gave us a delay for us to close the debt issue.\n§W--------------§!\nThis national spirit will be §RRemoved§! if our debt falls below §H10§! or if we complete the §HProperty For Debt Agreement§! focus."
 ARM_official_investigation: "Lancer une enquête officielle"
 ARM_official_investigation_desc: "Pour apaiser l'opposition et la communauté internationale, nous devons lancer une enquête officielle sur l'attentat terroriste de 1999."
 ARM_pacify_yerkrapah: "Yerkrapah pacifiant"
 ARM_pacify_yerkrapah_desc: "L'organisation militaire de Yerkrapah exerce une influence excessive en Arménie, compromettant notre gouvernement. Elle est principalement composée de partisans nationalistes de Vazgen Sargsyan. Nous devons les destituer du commandement militaire."
 ARM_meet_putin: "Rencontre avec Poutine"
 ARM_meet_putin_desc: "Peut-être parviendrons-nous à convaincre la Russie d’investir dans notre économie et à créer un esprit de confiance pour le futur accord sur la dette."
 ARM_northern_avenue_project: "Projet de l'avenue du Nord"
 ARM_northern_avenue_project_desc: "Northern Avenue is a proposed project for the center of Yerevan in which the streets will be reconstructed by demolishing old historic buildings and constructing new modern ones."
 ARM_property_for_debt: "Accord de propriété contre dette"
 ARM_property_for_debt_desc: "L'Arménie est le seul pays à ne pas avoir bénéficié d'une remise de dette de la part de la Russie après la chute de l'URSS. Cependant, nous pourrions peut-être trouver un accord en lui donnant des biens plutôt que de l'argent."
 ARM_person_business: "Entreprises personnelles"
 ARM_person_business_desc: "Même si cela pourrait nuire à notre cycle économique, nous pouvons tirer certains bénéfices des entreprises personnelles de Kocharyan."
 ARM_caucasian_tiger: "Tigre du Caucase"
 ARM_caucasian_tiger_desc: "Grâce à la forte croissance du secteur de la construction, l'Arménie affiche aujourd'hui le taux de croissance du PIB le plus élevé de la région. Nous devons tirer profit de cette situation."
 ARM_silence_hun: "Faire taire Hunanyan"
 ARM_silence_hun_desc: "Hunanyan pourrait apporter un éclairage à l'opposition. Nous ne devons pas laisser cela se produire."
 ARM_constitutional_changes: "Changements constitutionnels"
 ARM_constitutional_changes_desc: "Pour mettre fin à tout espoir de voir l’opposition mettre fin à notre règne, nous devons modifier la constitution et écraser les manifestations."
 ARM_hi_rob: "Salut, Rob !"
 ARM_hi_rob_desc: "Poghos Poghosyan from the Dashnaktsutyun party has been a long issue for Kocharyan. He's been an old \"friend\" of his and old ties are too risky for us now."
 ARM_union_state_proposal: "Proposition d'État de l'Union"
 ARM_union_state_proposal_desc: "Enfin, nous pouvons essayer de rejoindre le projet d’État-Union pour notre prospérité future."
 ARM_suppressed_oppos: "Opposition réprimée"
 ARM_cauc_tigr: "Tigre du Caucase"
 ARM_autocratic_grip: "Pouvoir autocratique"
 ARM_armenia_kocharyan_idea: "L'Arménie de Kotcharian"
 arm_opposition_backlash_ticker_mission: "Réaction de l'opposition"
 arm_opposition_backlash_ticker_mission_desc: "L'§Yopposition arménienne§! [ARM.GetFlag] se prépare à organiser des rassemblements et à forcer le gouvernement £ARM_Conservative §YKotcharyan§! à céder et à organiser des élections équitables. Il faut retarder ce moment et, de préférence, empêcher tout rassemblement, sous peine de voir l'opposition perdre."
 ARM_first_wave_of_assasinat: "Lancer la §YPremière vague§! d'§Yassassinats politiques§!"
 ARM_second_wave_of_assasinat: "Lancer la §9deuxième vague§! d'§Yassassinats politiques§!"
 first_assasinat_done: "§YPremière vague d’assassinats terminée !§!"
 second_assasinat_done: "§YDeuxième vague d’assassinats terminée !§!"
 ARM_armenia_kocharyan_idea_tt: "[ARM_Kotcharian_People_loc][ARM_Kotcharian_Tiger_loc][ARM_Kotcharian_Autocratic_loc][ARM_Kotcharian_Opposition_loc]"
 ARM_Kocharyan_People_loc1: "\n§gNOS GENS À DES POSTES CLÉS§! :\n£corruption_cost_factor_texticon Coût en pouvoir politique pour modifier la corruption : §R+30,00 %§!\n£political_power_texticon Gain de pouvoir politique : §G+30,00 %§!\n"
 ARM_Kocharyan_Tiger_loc1: "\n§gTIGRE DU CAUCASE§! :\n£econ_cycle_upg_cost_multiplier_modifier_texticon §YCoût du trésor pour l'amélioration des cycles économiques§! Multiplicateur : §G-10,00 %§!\n£construction_speed_texticon Vitesse de construction locale : §G+10,00 %§!\n"
 ARM_Kocharyan_Autocratic_loc1: "\n§gPOUVOIR AUTOCRATIQUE§! :\n£construction_speed_texticon Vitesse de construction locale : §G+10,00 %§!\n£political_power_texticon Gain de pouvoir politique : §G+5,00 %§!\n£interest_rate_multiplier_modifier_texticon §YTaux d'intérêt§! : §G-2§!\n£emerging_outlook_campaign_cost_modifier_texticon Soutien émergent quotidien : §G+0,06§!\n"
 ARM_Sargsyan: "§YSerzh Sargsian§!"
 ARM_Sargsyan_desc: "Depuis 1988, Serge Sarkissian est l'un des chefs de file du « mouvement du Karabakh », dont l'objectif est la défense du Haut-Karabagh par l'Arménie. Fort de ses excellentes relations dans les milieux militaires et politiques arméniens, il est devenu le candidat idéal à la présidence après Kotcharian."
 ARM_appoint_tigran: "Nommer Tigran"
 ARM_appoint_tigran_desc: "Nous devrions nommer Tigran Sargsyan à la tête de la Banque centrale arménienne en vue d'éventuelles réformes futures."
 ARM_clear_out_nats: "Éliminer les partisans d'Andranik Margaryan"
 ARM_clear_out_nats_desc: "Andranik Margaryan et son aile nationaliste du parti doivent être réprimés ; ils sont trop déloyaux et dangereux pour être tolérés au sein de notre parti."
 ARM_spheres_of_influence_sep: "Sphères d'influence séparées"
 ARM_spheres_of_influence_sep_desc: "Le gouvernement précédent nous a donné le feu vert pour diriger ce pays, nous devons donc respecter leurs entreprises commerciales."
 ARM_befriend_oligs: "Se lier d'amitié avec les oligarques"
 ARM_befriend_oligs_desc: "Peut-être devrions-nous nouer des contacts avec les oligarques et écouter les offres qu'ils pourraient nous faire."
 ARM_patriotic_educ: "Éducation patriotique des jeunes"
 ARM_patriotic_educ_desc: "Nous devons éduquer notre jeunesse à l'esprit patriotique. Notre parti, avant même que nous en prenions la direction, avait déjà connu un franc succès dans ce domaine ; nous devons donc perpétuer cette tradition."
 ARM_ensure_milit: "Assurer le soutien militaire"
 ARM_ensure_milit_desc: "Nous devons veiller à ce que l’armée occupe l’un des postes les plus importants de notre gouvernement et de notre société."
 ARM_priorit_loy_gener: "Donner la priorité aux généraux loyaux"
 ARM_priorit_loy_gener_desc: "Nous devons donner la priorité aux généraux qui nous sont fidèles et établir des relations politiques."
 ARM_new_gov_builds: "Nouveaux bâtiments gouvernementaux"
 ARM_new_gov_builds_desc: "Grâce à nos bonnes relations avec l’oligarchie, nous pourrions peut-être conclure un bon accord avec elle pour construire de nouvelles installations pour notre gouvernement."
 ARM_navasard_legacy_sup: "L'héritage de Navasardyan"
 ARM_navasard_legacy_sup_desc: "Bien que nous ayons réprimé la vieille garde du parti républicain, l'utilisation de leurs méthodes et de leur héritage pourrait s'avérer très utile pour l'avenir de notre pays."
 ARM_cronies_elevated: "Élever les copains"
 ARM_cronies_elevated_desc: "Nous devons changer nos priorités en matière d’éducation, tout en conservant les idées fondamentales."
 ARM_support_monopolies: "Monopoles soutenus"
 ARM_support_monopolies_desc: "Nous devons maintenir notre système de monopole pour conserver notre influence dans l'État."
 ARM_hovik_guidelines: "Directives de Hovik"
 ARM_hovik_guidelines_desc: "Le Premier ministre Hovik Abrahamyan a chargé le ministère de l'Économie d'élaborer, dans un délai d'un mois, des directives pour l'importation de dix produits essentiels. Il s'agit notamment du sucre, de la farine, du blé, de l'huile, du riz, du sarrasin, du beurre, de la margarine, des bananes, des oranges, des aliments pour bébés, de la volaille, des médicaments, du diesel et de l'essence. Il a souligné que, même si ces marchés ne sont pas officiellement monopolisés, le public les perçoit comme tels."
 ARM_mandatory_pension_system: "Système de retraite cumulative obligatoire"
 ARM_mandatory_pension_system_desc: "Un système de retraite par capitalisation obligatoire garantira la retraite de nos citoyens et réduira leur dépendance à long terme à l'égard de l'aide sociale de l'État."
 ARM_patronize_nats: "Condescendance des nationalistes"
 ARM_patronize_nats_desc: "Le Parti républicain soutient les mouvements nationalistes du pays de multiples manières."
 ARM_footbal_diplo: "Diplomatie du football"
 ARM_visit_to_russia: "Visite d'État en Russie"
 ARM_visit_to_russia_desc: "Serzh Sargsyan will travel to Russia to negotiate Armenia's rapprochement with the EU."
 ARM_approach_eu_serzh: "Approche de l'Union européenne"
 ARM_approach_eu_serzh_desc: "European Day is a landmark event in our country, thanks to which we have more opportunities to get closer to the EU."
 ARM_serzh_free_speech: "Liberté d'expression pour le soutien de l'UE"
 ARM_serzh_free_speech_desc: "While we don't want to expand the opposition, we need to give some rights to the population to expand economic opportunities."
 ARM_ss_army: "Armée de S.S."
 ARM_ss_army_desc: "Nous sommes l'armée de Serge Sarkissian, nous le suivrons jusqu'au bout du monde !"
 arm_sargsyan.1.t: "Rencontre en Arménie après un match de football !"
 arm_sargsyan.1.d: "After watching the football match between Armenia and Turkey, leaders of Armenia and Turkey are discussing various affairs. Armenia proposes to conclude a bilateral agreement on cooperation between our countries for mutually beneficial development of our economies and normalization of relations."
 arm_sargsyan.1.a: "Bien sûr."
 arm_sargsyan.1.b: "Non."
 arm_sargsyan.2.t: "Coopération arméno-turque signée"
 arm_sargsyan.2.d: "Turkey agreed to sign a bilateral cooperation agreement."
 arm_sargsyan.2.a: "Bien"
 arm_sargsyan.3.t: "La Turquie a refusé"
 arm_sargsyan.3.d: "Our efforts to mend relations have not resonated with the other side."
 arm_sargsyan.3.a: "D’accord."
 arm_sargsyan.4.t: "Sargsyan visite Moscou"
 arm_sargsyan.4.d: "Sargsyan is asking us to allow Armenia to get closer to EU countries. He argues that this will not lead to a break in ties with us."
 arm_sargsyan.4.a: "Nous acceptons."
 arm_sargsyan.4.b: "L’Arménie ne peut pas nous abandonner pour l’UE."
 arm_sargsyan.4.c: "Nous pouvons leur offrir un partenariat économique plus étroit."
 arm_sargsyan.5.t: "La Russie exige que nous abandonnions nos objectifs de rapprochement avec l’UE"
 arm_sargsyan.5.d: "Russia is categorically against any rapprochement between us and the EU, and therefore threatens us with economic sanctions in case we try to get closer together."
 arm_sargsyan.5.a: "Nous gardons nos opinions."
 arm_sargsyan.5.b: "Nous acceptons les demandes."
 arm_sargsyan.6.t: "L’Arménie n’a pas peur de nos menaces"
 arm_sargsyan.6.d: "Nos menaces n’ont pas effrayé la direction arménienne, devons-nous imposer les sanctions promises ?"
 arm_sargsyan.6.a: "Nous avions averti."
 arm_sargsyan.6.b: "Peut-être que la prochaine fois, nous pourrons trouver un arrangement."
 arm_sargsyan.7.t: "La Russie propose un accord"
 arm_sargsyan.7.d: "If we give up our plans for rapprochement with the EU, we will get economic aid in return. But if we renege on the offer, there will be consequences."
 arm_sargsyan.7.a: "Marché conclu."
 arm_sargsyan.7.b: "Nous rejetons cette offre."
 arm_sargsyan.8.t: "La Russie accepte"
 arm_sargsyan.8.d: "Russia agrees to our rapprochement with the European Union."
 arm_sargsyan.8.a: "Parfait."
 arm_sargsyan.9.t: "L’Arménie se retire"
 arm_sargsyan.9.d: "Armenia decides not to contradict us and accepts our demands."
 arm_sargsyan.9.a: "Bien"
 arm_sargsyan.10.t: "La Russie se retire"
 arm_sargsyan.10.d: "Russia has decided to back down from its threats and quietly let us put our goals into action."
 arm_sargsyan.10.a: "Parfait."
 arm_sargsyan.11.t: "L’Arménie rejette l’accord"
 arm_sargsyan.11.d: "Despite our attempts to offer them a favorable economic proposal, it was still rejected."
 arm_sargsyan.11.a: "Mauvais."
 arm_sargsyan.12.t: "Journée européenne en Arménie"
 arm_sargsyan.12.d: "The EU Delegation to Armenia will hold festive events in Yerevan and in different regions of the country, as well as informative meetings, exhibitions and concerts dedicated to the activities of the EU in Armenia."
 arm_sargsyan.12.a: "C’est une bonne idée."
 arm_sargsyan.12.b: "Non."
 arm_sargsyan.13.t: "L’UE nous soutient"
 arm_sargsyan.13.d: "Leading EU countries have agreed to support our European initiative."
 arm_sargsyan.13.a: "Vers l’avenir avec l’Europe."
 arm_sargsyan.14.t: "L’UE a refusé de nous soutenir"
 arm_sargsyan.14.d: "EU countries ignored our event and did not support us."
 arm_sargsyan.14.a: "D’accord."
 arme.12.b: "Désolé, non."
