 SUPPLY_FLOW_DELAYED_DESC: "§HPozostałe zaopatrzenie§! wskazuje, jaka ilość zaopatrzenia trafia do danej prowincji; składa się na nią zaopatrzenie płynące z państwa oraz to pochodzące z węzłów znajdujących się w zasięgu. Na zasięg węzłów wpływają: pogoda, warunki terenowe, infrastruktura, poziom kolei oraz motoryzacja.\n\n§HBrygady§! będą zużywać zaopatrzenie prowincjonalne w oparciu o swój współczynnik zapotrzebowania na zaopatrzenie. Jeśli ilość §Hzgromadzonego zaopatrzenia§! przekracza poziom dostępny w danej lokalizacji, jednostki będą korzystać z własnych zapasów, dopóki ich poziom nie zrówna się z poziomem zaopatrzenia dostępnym lokalnie.\n\nPrzytrzymaj §GCtrl§!, aby wyświetlić źródła przepływu."
 PLAN_COHESION_LOOSE_DESC: "Brygady przemieszczą się na znaczne odległości, aby utrzymać linię bojową."
