 france_md.600.t: "알카텔이 더는 원하지 않는 칩 사업"
 france_md.600.d: "통신 거품이 꺼지면서 알카텔은 네트워크가 아닌 모든 것을 매각하고 있습니다. 마이크로일렉트로닉스 부문은 수익성이 있고 유능하지만 곧 다른 이의 소유가 될 처지입니다. 이를 프랑스 손에 두려면 시장이 문제로 여기지 않는 문제를 해결하느라 국고가 실제 돈을 쏟아야 합니다."
 france_md.600.a: "마이크로일렉트로닉스 부문을 프랑스 손에 둔다"
 france_md.600.b: "유럽의 구매자에게 넘긴다"
 france_md.601.t: "신용의 벽"
 france_md.601.d: "프랑스 텔레콤은 어떤 기업도 진 적 없는 규모의 빚을 지고 있으며, 부채를 키운 인수 건들은 지불한 금액의 일부 가치밖에 없고, 은행들은 더 이상 만기를 연장해 주지 않을 것입니다. 국가는 상장 기업에 공적 자금을 투입할 수도 있고, 채권단이 국영 통신사의 운명을 결정하게 놓아둘 수도 있습니다."
 france_md.601.a: "공적 자금으로 통신사를 증자한다"
 france_md.601.b: "채권단이 구조조정하게 한다"
 france_md.602.t: "과반 지분을 잃은 국가"
 france_md.602.d: "프랑스 텔레콤에 대한 국가 지분을 50퍼센트 미만으로 매각하면 막대한 자금을 조달할 수 있고, 국영 기존 사업자가 개방 시장에서 경쟁하는 것을 둘러싼 브뤼셀과의 논쟁도 끝낼 수 있습니다. 하지만 프랑스 전화망에 관한 다음 결정은 주주들이 내리게 된다는 뜻이기도 합니다."
 france_md.602.a: "국가 과반 지분을 유지한다"
 france_md.602.b: "50퍼센트 미만으로 매각한다"
 france_md.603.t: "크롤2 이후"
 france_md.603.d: "크롤의 공동 제휴는 세 기업에 어느 한 곳도 단독으로는 감당할 수 없었을 최첨단 공정을 안겨 주었으나, 이제 그중 두 곳이 떠나고 있습니다. 후속 사업에 자금을 대면 파트너들이 외면한 연구 계획을 국가가 떠안게 됩니다. 거절하면 프랑스 기업 한 곳이 홀로 해당 공정 노드를 개발하거나 시도를 포기하게 됩니다."
 france_md.603.a: "제휴를 대체할 사업에 자금을 댄다"
 france_md.603.b: "국가 대표 기업이 홀로 짊어지게 한다"
 france_md.604.t: "ST-에릭슨 해체"
 france_md.604.d: "STMicroelectronics가 에릭슨과 함께 유럽의 무선 통신 챔피언이 되도록 설립한 합작 투자 ST-에릭슨은 존속 기간 내내 분기마다 손실을 냈으며, 이 회사가 상대하려던 휴대폰 제조사들은 이제 자체 반도체를 설계합니다. 이를 구제하면 시장이 이미 떠난 사업에 시간을 벌어 줄 뿐입니다. 해체하면 모바일 칩셋에 대한 유럽 최후의 본격적인 시도가 상각됩니다."
 france_md.604.a: "무선 통신 합작 사업을 구제한다"
 france_md.604.b: "해체하고 손실을 감수한다"
 france_md.605.t: "마이크로일렉트로닉스 IPCEI"
 france_md.605.d: "브뤼셀은 한때 금지했던 것을 허용할 것입니다. 반도체 생산 능력에 대한 대규모 공적 자금 지원입니다. 크롤은 한 기업이 아니라 대륙에 의미 있는 시설로 확장될 수 있습니다. 이는 프랑스가 시작하지도 않았고 혼자서는 이길 수도 없는 보조금 경쟁이지만, 그 경쟁에 참여하지 않는 것이 대안이 될 수는 없습니다."
 france_md.605.a: "크롤 확장에 자금을 댄다"
 france_md.605.b: "생산 능력을 시장에 맡긴다"
 france_md.606.t: "공화국이 지킨 것"
 france_md.606.d: "사반세기에 걸친 구제, 매각, 제휴, 보조금은 알카텔, 프랑스 텔레콤, STMicroelectronics의 운명을 확정했습니다. 프랑스의 전화망과 반도체 산업 가운데 어느 부분을 국가가 여전히 소유하고, 어느 부분을 단지 품고 있는지가 정해진 것입니다."
 france_md.606.a: "공화국이 여전히 소유한 대표 기업"
 france_md.606.b: "공적 자금으로 세운 실리콘 기반"
 france_md.606.c: "국가가 한때 구제한 통신사"
 france_md.606.e: "여느 시장과 다름없는 시장"
 FRA_cs_nationalised_systems_champion: "국유화된 체계 대표 기업"
 FRA_cs_nationalised_systems_champion_desc: "국가는 과반 지분을 놓지 않았으므로, 네트워크와 그 주변 산업은 주가보다 파리에 먼저 책임을 집니다. 지배 지분이 늘 그렇듯 국고에 비용이 들지만, 결정이 국내에 남는다는 이점을 얻습니다."
 FRA_cs_state_backed_silicon_base: "국가 지원 실리콘 기반"
 FRA_cs_state_backed_silicon_base_desc: "공적 자금이 어떤 프랑스 기업도 스스로는 조달하지 않았을 제조 역량을 세웠으며, 웨이퍼는 프랑스에서 생산됩니다. 생산 능력이 영구적이므로 보조금도 영구적이며, 이 둘은 이제 논쟁거리가 아니라 현장의 사실입니다."
 FRA_cs_recapitalised_national_operator: "증자된 국영 통신사"
 FRA_cs_recapitalised_national_operator_desc: "아무도 나서지 않을 때 국가가 자금을 투입했고, 통신사는 어떤 기업도 짊어져서는 안 될 부채에서 살아남았습니다. 이것은 구조가 아니라 구제였고, 구제는 오래가지 않습니다."
 FRA_cs_market_like_any_other: "여느 시장과 다름없는 시장"
 FRA_cs_market_like_any_other_desc: "대표 기업들은 평범한 상업적 조건으로 매각되거나 합병되거나 청산되었으며, 프랑스는 가장 잘 파는 곳에서 네트워크와 칩을 구입합니다. 효율적이고 정통적이지만, 전략적인 것은 이제 여기서 아무것도 결정되지 않습니다."
 france_md.554.t: "합동 군사 훈련을 제안하는 프랑스"
 france_md.554.d: "프랑스 외교관들이 합동 군사 훈련에 대한 제안을 보내 왔습니다. 실제로 최근 국제적 긴장의 고조는 최악의 사태에 대비하여 유럽 국가들이 단결하도록 독려하고 있습니다. 이는 언제든 터질 수 있는 고강도 분쟁에 대비하여 우리 군을 훈련시킬 아주 좋은 계획이 될 수 있습니다. 그들에게 어떻게 답해야 합니까?"
 france_md.554.a: "기꺼이, 그들과 함께 훈련하겠다"
 france_md.554.b: "감사하지만 사양한다. 그들의 도움은 필요 없다"
 france_md.359.t: "프랑스에서 권력을 장악한 군주제파"
 france_md.359.d: "[FRA.GetNameWithFlag]에서 충격적인 소식이 들어왔습니다. 집권당 내 극단주의 분파가 통제권을 장악하고 제5공화국을 폐지했습니다. 급진파가 군주제 통치를 복원하면서 온건 지도부는 밀려났습니다. 민주주의에 대한 이 극적인 쿠데타는 세계를 충격에 빠뜨렸습니다. 어떻게 대응해야 합니까?"
 france_md.359.a: "이 극단주의자들의 장악을 규탄한다"
 france_md.359.b: "이것은 프랑스의 내정이다"
 FRA_country_chaos: "불안한 소문"
 FRA_country_chaos_desc: "공황의 물결이 온 나라를 휩쓸었습니다. 무기고가 약탈당했고 대규모 탈영이 일어났다는 소문이 돌고 있습니다. 무언가가 꾸며지고 있습니다..."
 FRA_too_stable_tt: "§Y안정도 25% 미만§!일 때 정당 인기도 상승폭이 최대가 됩니다"
 FRA_too_europhile_tt: "§Y유럽주의 50% 미만§!일 때 정당 인기도 상승폭이 최대가 됩니다"
 FRA_napoleon_army_reform_tt: "대육군 개혁 완료: §Y[?FRA_grande_armee_reforms_completed|0]/3§!"
 FRA_6threp_tt: "앞으로 있을 사건들에서 헌법을 기초하게 되며, 과정이 끝났을 때 그 헌법을 가지게 될 수도, 그렇지 않을 수도 있습니다. 열기가 식기 전에 서두르는 것을 잊지 마십시오"
 FRA_cfa_franc_user_exists_tt: "최소 한 국가가 여전히 §YCFA 프랑§!을 사용함"
 FRA_eco_candidate_exists_tt: "최소 한 국가가 여전히 §YCFA 프랑§! 또는 §YCFA 프랑(중앙아프리카)§!을 사용함"
 FRA_corporate_systems_ambition_ft_restructuring: "Ambition FT 2005 구조조정"
 FRA_corporate_systems_ambition_ft_restructuring_desc: "증자, 사업 매각, 운영 개혁으로 프랑스 텔레콤의 재무 상태를 바로잡고 있습니다. 그룹이 현금 흐름을 회복하는 동안 네트워크 투자는 제약을 받습니다."
 FRA_corporate_systems_french_national_champions: "프랑스 국가 대표 기업"
 FRA_corporate_systems_french_national_champions_desc: "프랑스는 핵심 기업, 연구 시설, 기반시설을 강력한 국가 주도 아래 유지해 왔습니다. 주권과 회복력은 높지만, 이 모델은 지속적인 공적 지원을 요구하며 해외와의 통합은 덜 받아들입니다."
 FRA_corporate_systems_china_connected_infrastructure: "중국과 연결된 기반시설"
 FRA_corporate_systems_china_connected_infrastructure_desc: "중국 공급업체가 프랑스 네트워크 현대화의 중심이 되었습니다. 신속한 구축과 더 긴밀한 상업적 관계를 얻는 대신, 핵심 기반시설에서 지속적인 의존과 더 높은 교체 위험을 감수해야 합니다."
 FRA_corporate_systems_resilient_multivendor_network: "회복력 있는 다중 공급업체 네트워크"
 FRA_corporate_systems_resilient_multivendor_network_desc: "프랑스는 핵심 네트워크 조달을 여러 공급업체에 분산시키고 어느 한 곳이든 교체할 수 있는 능력을 보존했습니다. 그 결과 집중도는 낮아지고 회복력은 높아졌지만, 조율과 구축은 더 느립니다."
 FRA_corporate_systems_events.1.a: "과감히 구조조정한다"
 FRA_corporate_systems_events.1.a_tt: "알카텔 건전성: §G+0.8§!\n기업 부채 압박: §G-0.6§!\n안정도: §R-1.0%§!\n§Y730일§! 동안 §Y통신 붕괴 구조조정§!을 얻습니다.\n§Y인터넷 기술§!에 대한 §G5%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.1.b: "전략적 연구개발을 보호한다"
 FRA_corporate_systems_events.1.b_tt: "정치력: §R-75§!\n전략적 주권: §G+0.4§!\n알카텔 건전성: §G+0.6§!\n§Y지휘통제 장비§!에 대한 §G5%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.1.c: "방어선을 지킨다"
 FRA_corporate_systems_events.1.c_tt: "알카텔 건전성: §R-1.0§!\n기업 부채 압박: §R+0.8§!\n안정도: §G+0.5%§!"
 FRA_corporate_systems_events.1.d: "통신 장비 호황의 붕괴로 알카텔은 주문 감소, 과잉 설비, 누적되는 손실에 직면했습니다. 회사는 구조조정을 하면서 무엇을 지킬지 결정해야 합니다."
 FRA_corporate_systems_events.1.t: "통신 거품의 붕괴"
 FRA_corporate_systems_events.10.a: "사업 전체를 인수한다"
 FRA_corporate_systems_events.10.a_tt: "전략적 주권: §G+0.2§!\n반도체 생산 능력: §G+0.4§!\nSTMicroelectronics 건전성: §G+0.5§!\n§Y마이크로칩 기술§!에 대한 §G10%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.10.b: "전략적 지식재산과 자산을 인수한다"
 FRA_corporate_systems_events.10.b_tt: "반도체 생산 능력: §G+0.2§!\nSTMicroelectronics 건전성: §G+0.3§!\n§Y마이크로칩 기술§!에 대한 §G5%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.10.c: "인수를 거절한다"
 FRA_corporate_systems_events.10.c_tt: "STMicroelectronics 건전성: §G+0.2§!"
 FRA_corporate_systems_events.10.d: "알카텔의 구조조정으로 마이크로일렉트로닉스 자산의 미래가 불투명해졌습니다. STMicroelectronics는 사업 전체를 추진하거나, 전략 기술만을 표적으로 삼거나, 다른 우선순위를 위해 자본을 아낄 수 있습니다."
 FRA_corporate_systems_events.10.t: "매물로 나온 알카텔 마이크로일렉트로닉스"
 FRA_corporate_systems_events.11.a: "다국적 연구개발 제휴를 확대한다"
 FRA_corporate_systems_events.11.a_tt: "전략적 주권: §R-0.1§!\n반도체 생산 능력: §G+0.6§!\n§Y마이크로칩 기술§!에 대한 §G10%§! 연구 보너스 2개를 얻습니다."
 FRA_corporate_systems_events.11.b: "프랑스 주도 사업을 구축한다"
 FRA_corporate_systems_events.11.b_tt: "정치력: §R-75§!\n전략적 주권: §G+0.5§!\n반도체 생산 능력: §G+0.4§!\n§Y마이크로칩 기술§!에 대한 §G10%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.11.c: "자본 노출을 제한한다"
 FRA_corporate_systems_events.11.c_tt: "반도체 생산 능력: §G+0.1§!\nSTMicroelectronics 건전성: §G+0.2§!"
 FRA_corporate_systems_events.11.d: "모토로라가 크롤2에서 STMicroelectronics 및 필립스와 합류할 준비를 마쳐, 첨단 공정 개발을 둘러싼 제휴가 확대됩니다. 규모가 커지면 비용과 전문성이 분산되겠지만, 순수한 프랑스의 통제력은 희석될 것입니다."
 FRA_corporate_systems_events.11.t: "크롤2 제휴 확대"
 FRA_corporate_systems_events.13.a: "NXP와 무선 사업을 통합한다"
 FRA_corporate_systems_events.13.a_tt: "반도체 생산 능력: §G+0.5§!\nSTMicroelectronics 건전성: §G+0.2§!\n기업 부채 압박: §R+0.3§!\n§Y마이크로칩 기술§!에 대한 §G10%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.13.b: "ST 무선 사업의 독립을 유지한다"
 FRA_corporate_systems_events.13.b_tt: "전략적 주권: §G+0.3§!\nSTMicroelectronics 건전성: §R-0.1§!\n§Y마이크로칩 기술§!에 대한 §G5%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.13.c: "무선 사업 지분을 매각한다"
 FRA_corporate_systems_events.13.c_tt: "반도체 생산 능력: §R-0.6§!\nSTMicroelectronics 건전성: §G+0.4§!"
 FRA_corporate_systems_events.13.d: "STMicroelectronics와 NXP가 무선 반도체 사업을 통합하기로 합의했습니다. 이 합작 사업은 모바일 칩에서 더 큰 규모를 제공하지만, 어려운 두 사업을 합치는 일에는 상당한 실행 위험이 따릅니다."
 FRA_corporate_systems_events.13.t: "ST-NXP 무선"
 FRA_corporate_systems_events.14.a: "ST-에릭슨을 설립한다"
 FRA_corporate_systems_events.14.a_tt: "유럽 통합: §G+0.5§!\n반도체 생산 능력: §G+0.6§!\n기업 부채 압박: §R+0.7§!\n§Y마이크로칩 기술§!에 대한 §G10%§! 연구 보너스 2개를 얻습니다."
 FRA_corporate_systems_events.14.b: "더 엄격한 재무 한도를 요구한다"
 FRA_corporate_systems_events.14.b_tt: "유럽 통합: §G+0.5§!\n반도체 생산 능력: §G+0.4§!\n기업 부채 압박: §R+0.3§!\n§Y마이크로칩 기술§!에 대한 §G10%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.14.c: "독립을 유지한다"
 FRA_corporate_systems_events.14.c_tt: "전략적 주권: §G+0.4§!\n유럽 통합: §R-0.2§!\n반도체 생산 능력: §R-0.3§!"
 FRA_corporate_systems_events.14.d: "에릭슨 모바일 플랫폼스가 새로운 유럽 합작 투자 사업에서 ST-NXP 무선과 합류할 수 있습니다. 모뎀, 무선, 애플리케이션 프로세서 전문성을 결합하면 기술적 깊이를 기대할 수 있지만, 확대된 사업은 막대한 자본을 소모할 수 있습니다."
 FRA_corporate_systems_events.14.t: "유럽 무선 통신 챔피언"
 FRA_corporate_systems_events.16.a: "질서 있게 철수한다"
 FRA_corporate_systems_events.16.a_tt: "반도체 생산 능력: §R-0.5§!\nSTMicroelectronics 건전성: §G+0.8§!\n기업 부채 압박: §G-1.0§!\n안정도: §R-0.5%§!\n§Y730일§! 동안 §YST-에릭슨 철수 비용§!을 얻습니다."
 FRA_corporate_systems_events.16.b: "기술과 인력을 흡수한다"
 FRA_corporate_systems_events.16.b_tt: "정치력: §R-75§!\n전략적 주권: §G+0.4§!\n반도체 생산 능력: §R-0.2§!\nSTMicroelectronics 건전성: §G+0.3§!\n§Y마이크로칩 기술§!에 대한 §G5%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.16.c: "합작 사업에 계속 자금을 댄다"
 FRA_corporate_systems_events.16.c_tt: "반도체 생산 능력: §G+0.3§!\nSTMicroelectronics 건전성: §R-0.7§!\n기업 부채 압박: §R+1.2§!"
 FRA_corporate_systems_events.16.d: "ST-에릭슨의 끊이지 않는 손실로 소유주들의 인내심이 바닥났습니다. 프랑스는 실패한 합작 사업에서 STMicroelectronics가 얼마나 많은 기술, 인력, 재무 위험을 안고 나와야 할지 결정해야 합니다."
 FRA_corporate_systems_events.16.t: "ST-에릭슨 해체"
 FRA_corporate_systems_events.17.a: "프랑스를 IPCEI의 중심에 세운다"
 FRA_corporate_systems_events.17.a_military: "IPCEI 군용 전자 장비"
 FRA_corporate_systems_events.17.a_tt: "전략적 주권: §G+0.6§!\n유럽 통합: §G+1.0§!\n반도체 생산 능력: §G+0.8§!\n§Y마이크로칩 기술§!에 대한 §G10%§! 연구 보너스 2개를 얻습니다.\n§Y지휘통제 장비§!에 대한 §G5%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.17.b: "프랑스 우선 사업을 추진한다"
 FRA_corporate_systems_events.17.b_tt: "정치력: §R-125§!\n전략적 주권: §G+0.9§!\n유럽 통합: §R-0.5§!\n반도체 생산 능력: §G+0.6§!\n§Y마이크로칩 기술§!에 대한 §G10%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.17.c: "투자를 시장에 맡긴다"
 FRA_corporate_systems_events.17.c_tt: "반도체 생산 능력: §R-0.2§!\nSTMicroelectronics 건전성: §G+0.2§!"
 FRA_corporate_systems_events.17.d: "유럽 5개국이 에너지 효율 칩, 전력 반도체, 센서, 광학 시스템, 첨단 소재를 아우르는 공동 마이크로일렉트로닉스 사업을 승인했습니다. STMicroelectronics는 프랑스를 이 사업의 중심에 세울 수도 있고, 보다 자국 중심의 길을 추구할 수도 있습니다."
 FRA_corporate_systems_events.17.t: "유럽 마이크로일렉트로닉스 IPCEI"
 FRA_corporate_systems_events.20.a: "오렌지를 인수하고 국제화한다"
 FRA_corporate_systems_events.20.a_tt: "디지털 기반시설: §G+0.8§!\n프랑스 텔레콤/오렌지 건전성: §G+0.8§!\n기업 부채 압박: §R+1.2§!\n§Y컴퓨팅 기술§!에 대한 §G5%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.20.b: "규모가 작은 모바일 전략을 추구한다"
 FRA_corporate_systems_events.20.b_tt: "디지털 기반시설: §G+0.4§!\n프랑스 텔레콤/오렌지 건전성: §G+0.4§!\n기업 부채 압박: §R+0.4§!"
 FRA_corporate_systems_events.20.c: "인수를 거부한다"
 FRA_corporate_systems_events.20.c_tt: "디지털 기반시설: §R-0.7§!\n기업 부채 압박: §G-0.4§!"
 FRA_corporate_systems_events.20.d: "프랑스 텔레콤이 오렌지와 그 국제 이동통신망을 인수하기로 합의했습니다. 이 인수는 공기업 통신사를 글로벌 통신 그룹으로 탈바꿈시킬 수 있지만, 그 가격은 재무 상태에 큰 부담을 줄 것입니다."
 FRA_corporate_systems_events.20.t: "오렌지를 인수한 프랑스 텔레콤"
 FRA_corporate_systems_events.21.a: "합의하고 손실을 인정한다"
 FRA_corporate_systems_events.21.a_tt: "프랑스 텔레콤/오렌지 건전성: §R-0.4§!\n기업 부채 압박: §R+0.5§!\n안정도: §R-0.5%§!\n§Y730일§! 동안 §YMobilCom 합의 부담§!을 얻습니다."
 FRA_corporate_systems_events.21.b: "국가 지원 브리지 금융을 제공한다"
 FRA_corporate_systems_events.21.b_tt: "정치력: §R-100§!\n전략적 주권: §G+0.4§!\n기업 부채 압박: §R+0.2§!\n§Y365일§! 동안 §YMobilCom 합의 부담§!을 얻습니다."
 FRA_corporate_systems_events.21.c: "채무를 다투고 긴축한다"
 FRA_corporate_systems_events.21.c_tt: "프랑스 텔레콤/오렌지 건전성: §R-0.5§!\n기업 부채 압박: §G-0.2§!"
 FRA_corporate_systems_events.21.d: "프랑스 텔레콤의 급속한 해외 확장은 MobilCom을 둘러싼 심각한 재무적 노출로 귀결되었습니다. 회사는 채무를 정리하거나, 국가의 브리지 금융을 구하거나, 장기 분쟁의 위험을 감수해야 합니다."
 FRA_corporate_systems_events.21.t: "한계에 이른 확장"
 FRA_corporate_systems_events.22.a: "증자하고 현금 흐름을 회복한다"
 FRA_corporate_systems_events.22.a_tt: "정치력: §R-50§!\n프랑스 텔레콤/오렌지 건전성: §G+1.2§!\n기업 부채 압박: §G-1.5§!\n안정도: §R-0.5%§!\n§Y730일§! 동안 §YAmbition FT 2005 구조조정§!을 얻습니다."
 FRA_corporate_systems_events.22.b: "국가를 주된 구제자로 삼는다"
 FRA_corporate_systems_events.22.b_tt: "정치력: §R-125§!\n전략적 주권: §G+0.5§!\n프랑스 텔레콤/오렌지 건전성: §G+1.0§!\n기업 부채 압박: §G-1.8§!"
 FRA_corporate_systems_events.22.c: "지분 희석을 피하고 투자를 줄인다"
 FRA_corporate_systems_events.22.c_tt: "디지털 기반시설: §R-0.6§!\n기업 부채 압박: §G-1.0§!\n안정도: §R-1.0%§!\n§Y730일§! 동안 §YAmbition FT 2005 구조조정§!을 얻습니다."
 FRA_corporate_systems_events.22.d: "프랑스 텔레콤은 부채를 재조달하고 현금 흐름을 회복하며 재무 상태를 강화하기 위해 Ambition FT 2005를 시작했습니다. 구제는 증자와 사업 매각을 결합할 수도, 국가에 더 크게 의존할 수도, 더 깊은 삭감으로 주주를 보호할 수도 있습니다."
 FRA_corporate_systems_events.22.t: "앰비션 FT 2005"
 FRA_corporate_systems_events.24.a: "경쟁 입찰을 활용한다"
 FRA_corporate_systems_events.24.a_tt: "디지털 기반시설: §G+0.8§!\n안정도: §G+0.5%§!\n§Y인터넷 기술§!에 대한 §G10%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.24.b: "알카텔을 공급업체로 우대한다"
 FRA_corporate_systems_events.24.b_tt: "전략적 주권: §G+0.4§!\n통신 용량: §G+0.4§!\n디지털 기반시설: §G+0.6§!\n알카텔 건전성: §G+0.5§!\n§Y인터넷 기술§!에 대한 §G5%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.24.c: "속도를 위해 전 세계에서 조달한다"
 FRA_corporate_systems_events.24.c_tt: "전략적 주권: §R-0.5§!\n디지털 기반시설: §G+1.0§!\n중국 공급업체 의존도: §R+2§!\n§Y인터넷 기술§!에 대한 §G5%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.24.d: "광대역, Wi-Fi, 3G, 인터넷 TV, 음성 서비스가 하나의 국가 네트워크 시장으로 수렴하고 있습니다. 프랑스 텔레콤은 경쟁 입찰을 활용하거나, 알카텔을 전략 공급업체로 지원하거나, 최고 속도를 위해 전 세계에서 조달할 수 있습니다."
 FRA_corporate_systems_events.24.t: "융합 광대역 네트워크"
 FRA_corporate_systems_events.25.a: "그룹을 오렌지 아래로 통합한다"
 FRA_corporate_systems_events.25.a_tt: "디지털 기반시설: §G+0.1§!\n프랑스 텔레콤/오렌지 건전성: §G+0.5§!\n§Y컴퓨팅 기술§!에 대한 §G5%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.25.b: "프랑스 텔레콤을 국내용으로 보존한다"
 FRA_corporate_systems_events.25.b_tt: "전략적 주권: §G+0.2§!\n프랑스 텔레콤/오렌지 건전성: §R-0.3§!"
 FRA_corporate_systems_events.25.c: "소비자용 브랜드와 전략용 브랜드를 분리한다"
 FRA_corporate_systems_events.25.c_tt: "전략적 주권: §G+0.1§!\n디지털 기반시설: §G+0.2§!"
 FRA_corporate_systems_events.25.d: "10년이 넘는 통합 끝에 프랑스 텔레콤은 그룹 전체의 명칭으로 오렌지를 채택할 준비를 마쳤습니다. 통일된 글로벌 정체성은 명확함을 제공하지만, 프랑스는 별개의 국내용 또는 전략용 브랜드를 유지할 수도 있습니다."
 FRA_corporate_systems_events.25.t: "오렌지가 된 프랑스 텔레콤"
 FRA_corporate_systems_events.26.a: "네트워크 투자 계획을 실행한다"
 FRA_corporate_systems_events.26.a_tt: "정치력: §R-50§!\n디지털 기반시설: §G+1.0§!\n§Y지휘통제 장비§!에 대한 §G5%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.26.b: "전략적 광섬유 구축을 가속한다"
 FRA_corporate_systems_events.26.b_tt: "정치력: §R-100§!\n전략적 주권: §G+0.3§!\n디지털 기반시설: §G+1.5§!\n§Y인터넷 기술§!에 대한 §G10%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.26.c: "자본 지출을 미룬다"
 FRA_corporate_systems_events.26.c_tt: "디지털 기반시설: §R-0.5§!\n프랑스 텔레콤/오렌지 건전성: §G+0.2§!"
 FRA_corporate_systems_events.26.d: "오렌지는 프랑스 전역의 대규모 광섬유 구축을 포함한 유선 및 이동통신망 대규모 투자 계획을 마련했습니다. 국가는 이를 상업적 구축으로 취급하거나, 전략적 기반시설로서 가속하거나, 지출을 미룰 수 있습니다."
 FRA_corporate_systems_events.26.t: "국가 기반시설로서의 광섬유"
 FRA_corporate_systems_events.27.a: "노키아와 에릭슨을 선정한다"
 FRA_corporate_systems_events.27.a_tt: "전략적 주권: §G+0.5§!\n유럽 통합: §G+0.8§!\n디지털 기반시설: §G+0.6§!\n중국 공급업체 의존도: §G-1§!\n§Y인터넷 기술§!에 대한 §G10%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.27.b: "화웨이에 주요 역할을 맡긴다"
 FRA_corporate_systems_events.27.b_tt: "전략적 주권: §R-0.8§!\n디지털 기반시설: §G+0.8§!\n중국 공급업체 의존도: §R+5§!\n5G 승인 사건이 뒤따릅니다."
 FRA_corporate_systems_events.27.c: "균형 잡힌 공급업체 네트워크를 요구한다"
 FRA_corporate_systems_events.27.c_tt: "전략적 주권: §G+0.1§!\n유럽 통합: §G+0.3§!\n디지털 기반시설: §G+0.5§!\n중국 공급업체 의존도: §G-1§!\n§Y인터넷 기술§!에 대한 §G5%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.27.d: "오렌지는 차세대 이동통신망의 공급업체를 선정해야 합니다. 노키아와 에릭슨은 유럽 통신 생태계 내의 연속성을 제공하고, 화웨이는 신속한 구축을 제공하며, 균형 잡힌 네트워크는 어느 한 공급업체에 대한 의존을 피할 수 있습니다."
 FRA_corporate_systems_events.27.t: "누가 프랑스의 5G 네트워크를 구축하는가?"
 FRA_corporate_systems_events.28.a: "화웨이의 승인을 제한한다"
 FRA_corporate_systems_events.28.a_tt: "전략적 주권: §G+0.6§!\n유럽 통합: §G+0.3§!\n중국 공급업체 의존도: §G-3§!\n§Y730일§! 동안 §Y5G 공급업체 교체 부담§!을 얻습니다."
 FRA_corporate_systems_events.28.b: "장기 구축을 허용한다"
 FRA_corporate_systems_events.28.b_tt: "전략적 주권: §R-0.5§!\n디지털 기반시설: §G+0.4§!\n중국 공급업체 의존도: §R+2§!"
 FRA_corporate_systems_events.28.c: "신속한 공급업체 다변화를 요구한다"
 FRA_corporate_systems_events.28.c_tt: "정치력: §R-75§!\n전략적 주권: §G+0.8§!\n통신 용량: §G+0.5§!\n중국 공급업체 의존도: §G-4§!\n§Y548일§! 동안 §Y5G 공급업체 교체 부담§!을 얻습니다."
 FRA_corporate_systems_events.28.d: "5G 구축이 진행되면서 프랑스 보안 당국은 화웨이 장비에 대한 장기 승인을 재검토하고 있습니다. 정부가 더 깊고 지속적인 의존을 받아들이지 않는 한, 기존 설치분은 이제 비용이 많이 드는 교체가 필요할 수 있습니다."
 FRA_corporate_systems_events.28.t: "5G 승인 압박"
 FRA_corporate_systems_events.3.a: "루슨트와의 결합을 승인한다"
 FRA_corporate_systems_events.3.a_tt: "전략적 주권: §R-0.4§!\n통신 용량: §G+0.6§!\n알카텔 건전성: §G+0.7§!\n§Y인터넷 기술§!에 대한 §G10%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.3.b: "프랑스의 전략적 보장을 요구한다"
 FRA_corporate_systems_events.3.b_tt: "정치력: §R-50§!\n전략적 주권: §R-0.1§!\n알카텔 건전성: §G+0.5§!\n§Y인터넷 기술§!에 대한 §G10%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.3.c: "합병에 반대한다"
 FRA_corporate_systems_events.3.c_tt: "전략적 주권: §G+0.6§!\n통신 용량: §R-0.2§!\n알카텔 건전성: §R-0.5§!"
 FRA_corporate_systems_events.3.d: "알카텔과 루슨트가 네트워크 장비 사업을 통합하기 위한 대서양 횡단 합병을 제안했습니다. 이 거래는 규모의 이점을 약속하지만, 통합과 프랑스의 전략적 통제를 둘러싼 어려운 문제도 제기합니다."
 FRA_corporate_systems_events.3.t: "대서양 횡단 통신 챔피언?"
 FRA_corporate_systems_events.6.a: "IP와 광대역에 다시 집중한다"
 FRA_corporate_systems_events.6.a_tt: "통신 용량: §G+0.8§!\n알카텔 건전성: §G+1.0§!\n기업 부채 압박: §G-0.5§!\n안정도: §R-0.5%§!\n§Y730일§! 동안 §YShift Plan 구조조정§!을 얻습니다.\n§Y인터넷 기술§!에 대한 §G10%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.6.b: "보호받는 국가 대표 기업을 육성한다"
 FRA_corporate_systems_events.6.b_tt: "정치력: §R-125§!\n전략적 주권: §G+0.8§!\n알카텔 건전성: §G+0.7§!\n§Y지휘통제 장비§!에 대한 §G10%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.6.c: "추가 구조조정을 거부한다"
 FRA_corporate_systems_events.6.c_tt: "알카텔 건전성: §R-0.9§!\n기업 부채 압박: §R+0.6§!"
 FRA_corporate_systems_events.6.d: "알카텔-루슨트는 IP 네트워킹, 클라우드 시스템, 초고속 광대역 기반시설로 과감하게 사업을 재편할 것을 제안합니다. 이 계획은 지속 가능한 기술 핵심을 복원할 수 있지만, 또 한 차례의 고된 구조조정을 거친 뒤에야 가능합니다."
 FRA_corporate_systems_events.6.t: "시프트 플랜"
 FRA_corporate_systems_events.7.a: "연구개발 약속의 이행을 강제한다"
 FRA_corporate_systems_events.7.a_military: "군사 연구개발 약속"
 FRA_corporate_systems_events.7.a_tt: "전략적 주권: §G+0.4§!\n유럽 통합: §G+0.4§!\n§Y인터넷 기술§!에 대한 §G10%§! 연구 보너스 1개를 얻습니다.\n§Y지휘통제 장비§!에 대한 §G5%§! 연구 보너스 1개를 얻습니다."
 FRA_corporate_systems_events.7.b: "제한 없는 통합을 허용한다"
 FRA_corporate_systems_events.7.b_tt: "전략적 주권: §R-0.3§!\n알카텔 건전성: §G+0.4§!"
 FRA_corporate_systems_events.7.c: "프랑스의 예외적 통제를 추구한다"
 FRA_corporate_systems_events.7.c_tt: "전략적 주권: §G+0.6§!\n유럽 통합: §R-0.5§!\n알카텔 건전성: §R-0.3§!"
 FRA_corporate_systems_events.7.d: "이제 노키아가 알카텔-루슨트를 지배하게 되어 옛 프랑스의 대표 기업이 더 큰 유럽 네트워크 그룹에 편입되었습니다. 프랑스는 연구, 고용, 전략 역량에 관한 약속을 얼마나 엄격하게 강제할지 결정해야 합니다."
 FRA_corporate_systems_events.7.t: "노키아 안의 프랑스 기둥"
 FRA_corporate_systems_mobilcom_settlement_burden: "MobilCom 합의 부담"
 FRA_corporate_systems_mobilcom_settlement_burden_desc: "프랑스 텔레콤은 MobilCom 및 그 급속한 확장과 관련된 막대한 채무를 인식했습니다. 합의는 불확실성을 줄이지만, 이를 조달하는 일이 투자를 제약합니다."
 FRA_corporate_systems_shift_plan_restructuring: "Shift Plan 구조조정"
 FRA_corporate_systems_shift_plan_restructuring_desc: "알카텔-루슨트는 비용을 절감하고 비핵심 자산을 매각하는 한편 IP 네트워킹, 클라우드 시스템, 초고속 광대역 기반시설에 집중하고 있습니다. 회사가 기술 포트폴리오를 재구축하는 동안 이 전환은 일시적으로 생산을 제약합니다."
 FRA_corporate_systems_telecom_crash_restructuring: "통신 붕괴 구조조정"
 FRA_corporate_systems_telecom_crash_restructuring_desc: "알카텔은 통신 장비 시장이 붕괴한 뒤 시설을 폐쇄하고 설비를 감축하고 있습니다. 이 조치는 장기적인 재무 압박을 완화하지만 단기적으로는 산업 생산과 고용에 차질을 줍니다."
 FRA_corporate_systems_vendor_replacement_burden: "5G 공급업체 교체 부담"
 FRA_corporate_systems_vendor_replacement_burden_desc: "화웨이 승인에 대한 제한으로 사업자들은 설치된 장비를 교체하고 구축 계획을 재작업해야 합니다. 이 전환은 핵심 네트워크에 대한 장기적 통제를 강화하지만 구축 속도를 늦춥니다."
 FRA_corporate_systems_wireless_exit_costs: "ST-에릭슨 철수 비용"
 FRA_corporate_systems_wireless_exit_costs_desc: "ST-에릭슨의 해체에는 손상 차손, 직원 이전, 기술과 자산의 비용이 많이 드는 분할이 필요합니다. 철수는 장기적인 출혈을 없애 주지만 단기적으로는 무선 연구에 차질을 줍니다."
 FRA_ps_political_balance: "사회당 정치 노선"
