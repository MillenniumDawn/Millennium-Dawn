 ENG_unlock_uniting_the_realm_decisions_TT: "£decision_icon_small §YDesbloqueia§! as Decisões de Unir o Reino\n - Estas decisões nos permitirão trazer outros estados da Commonwealth para nossa órbita"
 ENG_unlock_the_next_era_TT: "Transferirá a [IOM.GetFlag] Ilha de Man para as [ADS.GetFlag] §HForças de Defesa Albionis§!\n - Será um novo grupo de PMC sob nosso controle direto\n - Poderemos usá-las para dividir a OTAN, recrutando, subornando e persuadindo líderes militares, políticos e civis de estados da OTAN\n - Serão financiadas pelo nosso orçamento e terão seu próprio exército profissional permanente"
 ENG_raid_enalbed_TT: "§HDesbloqueia Nova Incursão§!: Operação Delta Guard\n - Poderemos avançar e tomar os campos de petróleo [NIG.GetFlag] nigerianos ao redor do Delta\n £text_icon_kaldanger Se a [NIG.GetFlag] Nigéria retaliar, podemos ter uma guerra prolongada em mãos"
 ENG_raid_enabled_2_TT: "§HDesbloqueia Nova Incursão§!: Operação Safeguard\n - Unidades de forças especiais [ENG.GetFlag] britânicas poderão avançar e depor o ditador do [ZIM.GetFlag] Zimbábue, substituindo-o por um homem forte apoiado pelos [ENG.GetFlag] britânicos, dando-nos influência em [ZIM.GetName]"
 ENG_raid_enabled_3_TT: "§HDesbloqueia Nova Incursão§!: Operação Eastern Divide\n - Unidades de forças especiais [ENG.GetFlag] britânicas poderão avançar e capturar a área vital no [EGY.GetFlag] Sinai, facilitando o acesso portuário britânico na região.\n - A incursão estará disponível no Sinai"
