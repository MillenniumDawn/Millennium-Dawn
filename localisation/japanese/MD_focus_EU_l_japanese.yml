 EU_commission_office_idea: "President of the European Commission"
 EU_commission_office_desc: "The §YPresident of the European Commission§! is the head of the executive branch of the §C[EUU.GetFlag][EUU.GetName]§!. The President leads a cabinet of Commissioners, referred to simply as the College, collectively accountable to the European Parliament. They are empowered to allocate portfolios among, reshuffle, or dismiss commissioners as necessary. The Commission is the only body allowed to propose bills to become European Law."
 EU_high_repr_office_idea: "European Union High Representative"
 EU_high_repr_office_idea_desc: "The §YHigh Representative of the Union for Foreign Affairs and Security Policy§! is the chief coordinator and representative of the Common Foreign and Security Policy (CFSP) within the European Union. The title is often shortened to the EU Foreign Minister and they primarily coordinate foreign policy on behalf of member states."
 EU_court_office_idea: "President of the European Court of Justice"
 EU_court_office_idea_desc: "The §YPresident of the European Court of Justice§! oversees the legal prosecution and adjudication of European Union law. The President is responsible for the administration of the court and represents it in all legal matters."
 EU_ECB_office_idea: "President of the European Central Bank"
 EU_ECB_office_idea_desc: "The §YPresident of the European Central Bank§! presides over the European Central Bank (ECB), the institution responsible for the management of the Euro and the European Union's monetary policy in the Eurozone. They head the executive board, Governing Council and General Council of the ECB and represent the bank abroad."
 EU_frontex_office_idea: "Frontex Executive Director"
 EU_frontex_office_idea_desc: "The §YFrontex Executive Director§! presides over the European Border and Coast Guard Agency (commonly known as Frontex). The purpose of Frontex is to support European Union member states on the ground in their efforts to protect external European Borders. It also exercises border control over the Schengen area to assist with the area of freedom, security and justice domain."
 EU_parliament_office_idea: "President of the European Parliament"
 EU_parliament_office_desc: "The §YPresident of the European Parliament§! presides over the debates and activities of the European Parliament. They represent the European Parliament in all legal matters and external relations, particularly international relations. They serve a two-and-a-half-year term and their signature is required to sign the Budget of the European Union and Union acts adopted under co-decision procedures."
 EU_council_office_idea: "President of the European Council"
 EU_council_office_desc: "The §YPresident of the European Council§! presides over and drives forward the work of the European Council, which is composed of twenty-seven heads of state and a principal representative of §C[EUU.GetFlag][EUU.GetName]§! on the world stage. The institution comprises the college of heads of state and the president of the European Commission and provides political direction to the whole of the European Union."
 EU_ECOFIN_office_idea: "European Minister of Economy and Finance"
 EU_ECOFIN_office_idea_desc: "The §YEuropean Minister of Economy and Finance§! heads the European Economic Government and as such has the powers invested in them by the fiscal union. The minister is responsible for overseeing the tax authority, the minimum wage for member states, and other economic and fiscal decisions."
 EU_UN_ambassador_office_idea: "Ambassador of the Union to the United Nations"
 EU_UN_ambassador_office_idea_desc: "The §YAmbassador of the Union to the United Nations§! represents the European Union at the United Nations, working in coordination with diplomatic missions of all the European Union member states."
 EU_innovation_office_idea: "Director of Institute of Innovation and Technology"
 EU_innovation_office_idea_desc: "The §YDirector of Institute of Innovation and Technology§! leads the institute responsible for stimulating research into innovation and technology in the European Union. It coordinates major research programs across the European Union and provides funding for research and development in the European Union."
 EU_energy_office_idea: "Director of Energy Regulators"
 EU_energy_office_idea_desc: "The §YDirector of Energy Regulators§! leads the European Union's energy regulators. They are responsible for coordinating the energy policy of the European Union."
 EU_space_office_idea: "Director of Space Agency"
 EU_space_office_idea_desc: "The §YDirector of Space Agency§! leads the European Union's space agency. They are responsible for coordinating the space programs of the European Union."
 EU_army_office_idea: "Secretary General of EuroArmy"
 EU_army_office_idea_desc: "The §YSecretary General of EuroArmy§! is the head of the EuroArmy of the European Union. They are responsible for the coordination of the EuroArmy which is the combined and common armed forces of the European Union member states."
 EU_navy_office_idea: "Secretary General of EuroNavy"
 EU_navy_office_idea_desc: "The §YSecretary General of EuroNavy§! is the head of the EuroNavy of the European Union. They are responsible for the coordination of the EuroNavy which is the combined and common naval strength of the European Union."
 EU_air_office_idea: "Secretary General of EuroAirForce"
 EU_air_office_idea_desc: "The §YSecretary General of EuroAirForce§! is the head of the EuroAirForce of the European Union. They are responsible for the coordination of the EuroAirForce which is the combined military aviation of the European Union members."
 EU_EF_president: "President of the European Federation"
 EU_EF_president_desc: "The §YPresident of the European Federation§! is the duly elected leader of the European Federation. The European Federation is one of the final federalization options of the European Union and as such is a very powerful position."
