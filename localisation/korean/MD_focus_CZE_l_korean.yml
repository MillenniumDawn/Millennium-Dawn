 CZE_leadership_of_pavel_belobradek: "파벨 벨로브라데크의 지도부"
 CZE_leadership_of_pavel_belobradek_desc: "2010년 선거의 참패로 우리는 하원에서 밀려났습니다. 파벨 벨로브라데크가 이 운명을 피하게 해 줄 것입니다."
 CZE_reform_airborne: "공수부대 개편"
 CZE_reform_airborne_desc: "특수 부대는 미국에서 매우 큰 위협이 되고 있습니다. 그들은 자국의 특수 부대를 세계 최고로 만들기 위해 많은 돈과 시간을 투자했습니다. 우리는 하늘에서 공격할 수 있는 부대에 집중할 것입니다."
