 module_naval_anti_ship_nuclear_torpedo_1: "Torpille nucléaire antinavire I"
 module_naval_anti_ship_nuclear_torpedo_1_desc: "Les torpilles nucléaires antinavires combinent un profil de lancement de torpille conventionnel et une ogive exceptionnellement puissante pour maximiser le potentiel destructeur contre les combattants de surface.\n\n§GIndice du concepteur : les torpilles nucléaires antinavires offrent une forte attaque de torpille avec de la lutte anti-sous-marine supplémentaire. Conviennent aux navires destinés à affronter surface et sous-marins, mais coûtent plus de CI et de main-d'œuvre que les torpilles conventionnelles.§!\n§GIndice concepteur : les torpilles nucléaires antinavires offrent une forte attaque à la torpille avec de la lutte anti-sous-marine supplémentaire. Elles conviennent aux navires destinés à combattre à la fois surface et sous-marins, mais coûtent plus de CI et d'effectifs que les torpilles conventionnelles.§!"
 module_naval_anti_ship_nuclear_torpedo_2: "Torpille nucléaire antinavire II"
 module_naval_anti_ship_nuclear_torpedo_2_desc: "$module_naval_anti_ship_nuclear_torpedo_1_desc$"
