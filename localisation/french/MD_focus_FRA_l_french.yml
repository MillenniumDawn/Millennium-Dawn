 FRA_alstom_manufacturer: "Alstom"
 FRA_alstom_manufacturer_desc: "Renommé GEC Alsthom lors de son introduction à Paris en 1998, Alstom construit les locomotives, rames à grande vitesse, métros, tramways et signalisation ferroviaire de la France. Un sauvetage de l'État en 2004 et la vente de l'énergie à General Electric en 2015 en ont fait une entreprise ferroviaire pure ; l'achat de Bombardier Transport en 2021 en a fait le plus grand constructeur de matériel roulant hors de Chine."
 FRA_alstom_manufacturer_trait: "Base industrielle ferroviaire"
 FRA_alstom_manufacturer_trait_desc: "Belfort, La Rochelle, Reichshoffen, Crespin, Le Creusot et Ornans forment une chaîne ferroviaire complète en France, couvrant traction, caisses, bogies, assemblage final et signalisation sans contenu étranger."
 FRA_alstom_branch_high_speed: "Programme grande vitesse"
 FRA_alstom_branch_urban_transit: "Transport urbain"
 FRA_alstom_branch_freight_logistics: "Fret et logistique ferroviaire"
 FRA_alstom_tgv_duplex: "TGV Duplex"
 FRA_alstom_tgv_duplex_desc: "Le TGV Duplex à deux niveaux est entré en service en 1996 et est devenu la rame grande vitesse standard sur l'axe saturé Paris-Lyon, transportant 40 pour cent de passagers de plus par train sans allonger les quais."
 FRA_alstom_belfort_power_cars: "Belfort Power Cars"
 FRA_alstom_belfort_power_cars_desc: "L'usine de Belfort construit les têtes motrices de chaque rame grande vitesse française. Depuis le contrat Avelia Horizon, les trois quarts de sa charge viennent d'un seul programme, ce qui concentre coût et risque dans un seul hall."
 FRA_alstom_avelia_horizon: "Avelia Horizon"
 FRA_alstom_avelia_horizon_desc: "La cinquième génération de TGV commandée par la SNCF en 2018 conserve le double niveau mais raccourcit les motrices, ajoutant vingt pour cent de capacité à un coût par siège moindre et une baisse revendiquée de vingt pour cent de la consommation d'énergie."
 FRA_alstom_avelia_liberty: "Avelia Liberté"
 FRA_alstom_avelia_liberty_desc: "La variante pendulaire construite pour le Northeast Corridor d'Amtrak a été le premier export grande vitesse d'Alstom aux États-Unis. Les retards de certification ont coûté cher, mais la commande a établi un pied dans un marché jusqu'alors fermé au matériel français."
 FRA_alstom_la_rochelle_assembly: "Assemblée de La Rochelle"
 FRA_alstom_la_rochelle_assembly_desc: "L'usine de La Rochelle assemble les voitures voyageurs de la famille Avelia et conçoit le tramway Citadis. C'est le plus grand employeur ferroviaire de la côte atlantique et le site où les nouvelles techniques de caisse sont éprouvées avant transfert vers les autres usines."
 FRA_alstom_citadis_tramway: "Tramway Citadis"
 FRA_alstom_citadis_tramway_desc: "Lancé en 2000, le Citadis modulaire à plancher bas est devenu le tramway européen par défaut, vendu à plus de soixante villes. Ses modules standardisés permettent de spécifier et livrer un réseau sans programme de conception sur mesure."
 FRA_alstom_metropolis_metro: "Métropole Métropole"
 FRA_alstom_metropolis_metro_desc: "La famille Metropolis couvre le matériel de métro automatique et conventionnel sur une plateforme commune, des navettes légères automatisées aux rames de huit voitures. La production en volume maintient le coût unitaire sous celui des conceptions nationales sur mesure."
 FRA_alstom_urbalis_cbtc: "Urbalis CBTC"
 FRA_alstom_urbalis_cbtc_desc: "Urbalis est le système de contrôle des trains d'Alstom basé sur les communications, permettant l'exploitation sans conducteur et des intervalles inférieurs à quatre-vingt-dix secondes. Développé à Crespin et Villeurbanne, c'est la couche de signalisation sous la plupart des contrats de métro automatique de l'entreprise."
 FRA_alstom_innovia_automated_transit: "Transit automatisé Innovia"
 FRA_alstom_innovia_automated_transit_desc: "Le people mover automatisé Innovia, hérité de Bombardier, relie terminaux d'aéroport et quartiers denses. Ses rames courtes et son guide fixe en font le moyen le moins cher d'ajouter une capacité ferroviaire fixe à un site existant."
 FRA_alstom_grand_paris_express: "Grand Paris Express"
 FRA_alstom_grand_paris_express_desc: "Le plus grand projet de transport d'Europe ajoute quatre lignes de métro automatique et deux cents kilomètres de voies autour de Paris. Alstom fournit le matériel roulant et la signalisation, et le programme garantit sa capacité de transit urbain pour une décennie."
 FRA_alstom_prima_locomotives: "Locomotives Prima"
 FRA_alstom_prima_locomotives_desc: "La famille Prima de locomotives fret électriques et diesel, construite à Belfort depuis 2001, a remplacé le parc SNCF vieillissant et a été exportée au Maroc, en Syrie et en Chine. C'est le cheval de labour du fret ferroviaire français et des mouvements ferroviaires militaires."
 FRA_alstom_prima_h4_hybrid: "Prima H4 hybride"
 FRA_alstom_prima_h4_hybrid_desc: "La locomotive de manœuvre H4 combine des groupes diesel et un pack batteries, réduisant d'environ moitié la consommation en gare de triage et permettant un déplacement silencieux dans les dépôts."
 FRA_alstom_atlas_ertms: "AtlasERTMS"
 FRA_alstom_atlas_ertms_desc: "Atlas est l'implémentation Alstom du système européen de gestion du trafic ferroviaire, remplaçant les signalisations nationales incompatibles par une norme continentale unique. Les équipements embarqués et au sol sont produits à Crespin."
 FRA_alstom_coradia_ilint: "Coradia iLint"
 FRA_alstom_coradia_ilint_desc: "Le premier train régional à pile à combustible hydrogène est entré en service commercial en 2018, desservant des lignes non électrifiées avec de l'eau comme seule émission. Il évite de tendre une caténaire sur des routes qui n'auraient jamais justifié l'investissement."
 FRA_alstom_bombardier_transportation: "Bombardier Transport"
 FRA_alstom_bombardier_transportation_desc: "Achevé en janvier 2021 après que la Commission européenne a bloqué une fusion avec Siemens Mobility, l'acquisition de Bombardier Transport a doublé les usines et le carnet d'Alstom et en a fait le deuxième constructeur ferroviaire mondial."
 FRA_crusade_time: "Reprendre notre héritage"
 FRA_crusade_time_desc: "Qu'il s'agisse de reconquérir la terre de nos ancêtres francs ou de reprendre la Terre sainte, nous devrons de toute façon affronter les puissances d'Europe et du Moyen-Orient. Il est temps pour nous de partir en guerre."
 FRA_vigipirate_surveillance: "Le plan Vigipirate"
 FRA_vigipirate_surveillance_desc: "Pour protéger nos concitoyens d'éventuels attentats, il faut être plus prudents et plus intrusifs."
