 advanced_production_modifier: "高级生产限制"
 advanced_production_modifier_desc: "当我们开始面临资源短缺，如科技金属([?THIS.resource@tungsten|+])，稀有金属([?THIS.resource@chromium|+])，石油([?THIS.resource@oil|+])，或橡胶([?THIS.resource@rubber|+])，我们的微芯片和/或复合材料生产将受到冲击。任何资源的短缺都会导致微芯片和/或复合材料产量的下降。此外，由于微芯片生产需要大量电力，电力短缺将进一步导致产量降低[?unfulfilled_energy_demand_dynmod_var|%]\n\n§Y减产幅度始终不会超过§!§Y基本产量的§!§R95%。§!"
 civilian_microchip_consumption_modifier: "民用和工业微芯片消费"
 civilian_microchip_consumption_modifier_desc: "随着越来越多的技术惠及企业和普通民众，我们的人口和先进产业将开始大量使用微芯片。我们需要满足这种需求，否则我们的生产线将难以运转。战时，军工生产将优先于民用，但这可能会导致民众不满，因为他们的需求无法得到满足。"
 is_currently_importing_oil_tt: "[THIS.GetNameWithFlag]当前正从另一个国家进口§Y化石燃料§!。\n"
 fuel_efficiency_10: "超级智能监控"
 fuel_efficiency_10_desc: "一套超级智能系统能够对每座电厂进行建模，细致到每一簇火焰和每一片涡轮叶片，并在故障形成之前进行纠正。我们这一代化石燃料发电已经达到了燃烧燃料所能提供的实际热力学极限。"
 energy_efficiency_9: "量子能量效率"
 energy_efficiency_9_desc: "我们可以利用量子技术来提高设备的能源效率。"
 energy_efficiency_10: "高级量子效率"
 energy_efficiency_10_desc: "应用量子技术领域的最新技术成果可以进一步提高效率。"
 energy_efficiency_11: "量子能量回收"
 energy_efficiency_11_desc: "我们对量子物理学的理解不断加深，使得在原子层面回收能量成为可能。"
 energy_efficiency_12: "量子虹吸"
 energy_efficiency_12_desc: "我们可以将量子泡沫变化提取出来，并将其转化为电能。我们实现了能量损失向能量增益的逆转！"
