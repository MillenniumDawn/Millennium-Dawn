 LOGISTICS_CAPACITY_DETAILED_DESC: "Logistics Capacity represents how satisfied your supply lines are. If your country lacks the Trains or the Utility Vehicles needed for transferring all supply needs, your units will get reduced supply and will be affected by supply penalties."
 TRUCKS: "Utility Vehicles"
 FUEL_DESC: "§HFuel§! is generated by your country's excess oil. Each country has a maximum capacity for §HFuel§! which can be increased by building §HSilos§!. §HFuel§! is used by tanks/mechanized units, ships, and planes, and it is delivered using §HSupply Lines§!.\n\n§HFuel§! is also used to power your nation's §HFossil Fuel Power Plants§! and is an important resource to ensure your economy continues to function. §HNuclear Reactors§!, §HRenewable Energy Infrastructure§!, and §HOther Sources of Power§! do not consume any §HFuel§! to produce energy. Your §HPopulation§! also consumes §HFuel§! as part of their general requirements. For more information regarding your non-Military §HFuel§! consumption see your §HEnergy Screen§! in the §HConstruction§! tab."
