 ENG_scottish_union_settlement_referendum: "[GetYear] [SCO.GetFlag] Referéndum del Acuerdo de la Unión Escocés"
 ENG_scottish_union_settlement_referendum_desc: "Westminster ha planteado la cuestión constitucional al electorado escocés bajo sus propios términos: un referéndum de acuerdo cuyo resultado cuenta para el mandato necesario para cerrar la cuestión de la descentralización de forma definitiva. Las urnas no dejan de ser urnas, y los partidos separatistas hacen campaña en su contra con todo lo que tienen. Un rechazo decisivo a la independencia saca adelante este acuerdo. Cualquier cosa por debajo de eso dejará la cuestión exactamente donde estaba, con un gobierno que ha agotado su crédito y ha perdido.\n\nReferéndums ganados: §Y[?ENG_scottish_referendum_success|0]§!/§G3§!\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_north_irish_union_settlement_referendum: "[GetYear] [NIR.GetFlag] Referéndum del acuerdo de la Unión norirlandesa"
 ENG_north_irish_union_settlement_referendum_desc: "Westminster ha planteado la cuestión constitucional al electorado norirlandés bajo sus propios términos: un referéndum de acuerdo cuyo resultado cuenta para el mandato necesario para cerrar la cuestión de la descentralización de forma definitiva. Las urnas no dejan de ser urnas, y la facción republicana hace campaña en su contra con todo lo que tiene. Un rechazo decisivo a la independencia saca adelante este acuerdo. Cualquier cosa por debajo de eso dejará la cuestión exactamente donde estaba, con un gobierno que ha agotado su crédito y ha perdido.\n\nReferéndums ganados: §Y[?ENG_north_irish_referendum_success|0]§!/§G3§!\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_welsh_union_settlement_referendum: "[GetYear] [WAS.GetFlag] Referéndum del Acuerdo de la Unión Galesa"
 ENG_welsh_union_settlement_referendum_desc: "Westminster ha planteado la cuestión constitucional al electorado galés bajo sus propios términos: un referéndum de acuerdo cuyo resultado cuenta para el mandato necesario para cerrar la cuestión de la descentralización de forma definitiva. Las urnas no dejan de ser urnas, y los partidos separatistas hacen campaña en su contra con todo lo que tienen. Un rechazo decisivo a la independencia saca adelante este acuerdo. Cualquier cosa por debajo de eso dejará la cuestión exactamente donde estaba, con un gobierno que ha agotado su crédito y ha perdido.\n\nReferéndums ganados: §Y[?ENG_welsh_referendum_success|0]§!/§G3§!\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
