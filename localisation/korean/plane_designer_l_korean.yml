 gen_3_light: "3세대 경항공기"
 gen_3_light_desc: "다목적-(Multi-Role) 항공기는 기술의 발전과 한국전과 베트남전에서 얻은 교훈을 바탕으로 개발됐습니다. 이 유형의 항공기는 공대지미사일과 레이저유도 폭탄을 탑재할 수 있으며, 동시에 BVR 전투도 수행할 수 있습니다. 추가 개선 사항으로 지형경보 시스템, 펄스-도플러 레이다, 비가시선타겟획득 능력이 포함됩니다."
 gen_4_light: "4세대 경항공기"
 gen_4_light_desc: "Following the success of multi-role third generation aircraft, fourth generation airframes continued to expand using technological and engineering advancements. Fly-by-wire systems, improved thrust-to-weight ratios, advanced avionics, and the advent of early stealth technologies advanced from this generation of aircraft."
 gen_5_light: "5세대 경항공기"
 gen_5_light_desc: "스텔스 기술, C3 시스템, 스마트 헬멧, 데이터/센서 융합 등의 주요 발전은 5세대 항공기 개발을 통해 이루어졌습니다. 이 항공기는 재료, 전자, 엔진 공학의 주요 발전 외에도 발전된 스텔스 기술로 더 은밀해졌습니다."
 gen_6_light: "6세대 경항공기"
 gen_6_light_desc: "6세대 기체는 공중전의 최첨단 실험 기술입니다. 설계와 제조에 많은 비용이 들며, 최첨단 스텔스 소재, 항전 장비, 드론 윙맨, 정밀 무기 체계 등을 포함합니다."
