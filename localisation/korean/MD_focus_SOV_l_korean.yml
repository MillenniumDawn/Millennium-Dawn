 SOV_russian_government_idea_tt: "[SOV_ForRepublic_loc][SOV_Federalism_loc]"
 russia.118.t: "'바쿠' 순양함의 운명"
 russia.118.d: "순양함 바쿠의 운명은 수년간 불확실했습니다. 90년대 이래로 인도가 이 함정의 구매에 관심을 보여 왔습니다. 이제 우리는 이 순양함을 보유하고 해군을 위해 현대화할 것인지, 아니면 인도에 매각하여 자금을 확보할 것인지 결정해야 합니다."
 russia.118.a: "개량한다"
 russia.118.b: "매각한다"
 SOV_allied_nrk_2: "북한과의 동맹"
 SOV_allied_nrk_2_desc: "우리는 동쪽으로 동맹을 확대할 계획이며, 그 시작은 북한입니다. 북한 국민은 우리의 과거 지원에 감사하고 있으며 존속의 상당 부분을 우리에게 빚지고 있습니다."
 SOV_warsaw_finland: "붉은 핀란드"
 SOV_warsaw_finland_desc: "러시아 내전 당시 잃어버린 영토를 되찾기 위한 방편으로 핀란드에 사회주의 정부를 수립하려는 시도가 있었습니다. 이제 핀란드를 바르샤바 조약에 편입시켜 이 임무를 완수할 준비가 되었습니다."
 SOV_mongolia_question: "몽골 문제"
 SOV_mongolia_question_desc: "몽골은 중국과의 충돌을 피하고 우호 관계를 유지하려는 우리의 요청에 따라 역사적으로 중립을 유지해 왔습니다. 그러나 이제 우리는 이러한 우려를 접어 두고 몽골과의 완전한 연합을 제안할 준비가 되었습니다."
 SOV_vietnam_question: "베트남 문제"
 SOV_vietnam_question_desc: "베트남은 오랫동안 믿을 만한 동맹이자 파트너였습니다. 협력을 심화하고 이 파트너십을 새로운 수준으로 끌어올릴 때가 왔습니다."
 SOV_spain_influ: "내전 결과의 재검토"
 SOV_spain_influ_desc: "사회주의 세력은 스페인 내전에서 패배했습니다. 우리는 스페인 공산주의자들이 다시 일어나 스페인에 프롤레타리아 독재를 복원하도록 지원할 준비가 되어 있습니다."
 SOV_avenge_afgan: "아프가니스탄 2차 개입"
 SOV_avenge_afgan_desc: "아프가니스탄을 장악하려던 우리의 첫 시도는 실패로 끝났습니다. 이제 우리는 그 패배를 설욕하고 이른바 '제국의 무덤'에서 마침내 목표를 달성할 준비가 되었습니다."
 SOV_iraq_influ: "붉은 이라크"
 SOV_iraq_influ_desc: "이라크는 지리적으로 멀고 우리와 긴밀한 동맹을 맺은 적도 없지만, 우리는 현재 집권 중인 반소련 정권을 전복하려는 그들의 노력을 지원할 준비가 되어 있습니다."
 SOV_warsaw_greece: "그리스 내전의 재현"
 SOV_warsaw_greece_desc: "1946년부터 1949년까지의 그리스 내전은 공산 세력의 패배로 끝났습니다. 이제 우리는 돌아가 복수하고 영향력을 되찾을 태세를 갖추었습니다."
 russia_news.51.t: "알렉산드르 두긴의 죽음"
 russia_news.51.d: "논란이 많은 러시아의 이념가이자 유라시아주의 운동의 창시자인 알렉산드르 두긴이 반려 쥐 '로고스'에게서 옮은 것으로 알려진 광견병으로 자택에서 사망했습니다. 당국은 그가 왜 의료 조치를 받지 않았는지 의아해하고 있습니다. 의심스러운 정황 때문에 이 사건은 살인 가능성을 염두에 두고 수사 중입니다."
 russia_news.51.o1: "엄청난 비극이다!"
 russia_news.51.o2: "잔혹한 죽음"
 russia_governorate.24.t: "아르차흐 문제"
 russia_governorate.24.d: "아르차흐 공화국은 현재 상황에서 누가 자신들을 통치할 것인가를 놓고 기로에 서 있습니다. 아르메니아와 러시아가 그 어느 때보다 긴밀하게 통합된 지금, 아르차흐의 미래는 불확실한 상태에 놓여 있습니다."
 russia_governorate.24.o1: "러시아가 통제하게 하자"
 russia_governorate.24.o2: "아르차흐는 우리의 것이다."
