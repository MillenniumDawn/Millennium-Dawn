 ukr_modernize_sov_equipment_mig27.3.name: "§Y[FROM.GetNameWithFlag]§! отказывается от контракта на §YМиГ-27§!"
 ukr_modernize_sov_equipment_mig27.3.desc: "§Y[FROM.GetNameWithFlag]§! отклоняет наше предложение. Через несколько месяцев можно попробовать снова."
 ukr_modernize_sov_equipment_mig27.3.a: "Попробуем снова"
 ukr_modernize_sov_equipment_mig27_sri_lanka_interest_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mig27_sri_lanka_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[SRI.GetNameWithFlag]§! воюет с «Тиграми освобождения Тамил-Илама», и ей нужны доступные ударные самолёты. Наши хранящиеся истребители-бомбардировщики §YМиГ-27§! — именно то, что нужно, но сначала надо убедить Коломбо.§!"
 ukr_modernize_sov_equipment_mig27_sri_lanka_contract_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mig27_sri_lanka_for_tooltip\n\n\n\n\n\n\n\n\n§WКоломбо заинтересован. Мы предлагаем §Y6§! §YМиГ-27М§!, перестроенных на §YЛьвовском государственном авиаремонтном заводе§!, и учебно-боевой §YМиГ-23УБ§! для его лётчиков.\n------------------\n§Y[SRI.GetNameWithFlag]§! решает, подписывать ли контракт. Если откажется, можно попробовать позже.§!"
 ukr_modernize_sov_equipment_mig27_sri_lanka_preparation_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mig27_sri_lanka_for_tooltip\n\n\n\n\n\n\n\n\n§W§YЛьвовский государственный авиаремонтный завод§! ремонтирует §YМиГ-27§! с 1979 года. Он разбирает самолёты для заказчика (§Y[SRI.GetNameWithFlag]§!), капитально ремонтирует двигатели и устанавливает §Gболее новую авионику и прицельный контейнер§!.§!\n\n$UKR_rada_modernization_design_tt$"
 ukr_modernize_sov_equipment_mig27_sri_lanka_delivery_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mig27_sri_lanka_for_tooltip\n\n\n\n\n\n\n\n\n§WПерестроенные самолёты готовы. Транспортные самолёты доставят их в Коломбо, где наши инструкторы передадут их ВВС заказчика (§Y[SRI.GetNameWithFlag]§!).§!"
 ukr_modernize_sov_equipment_mig27_restoration_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mig27_restoration_for_tooltip\n\n\n\n\n\n\n\n\n§WПосле выполнения шри-ланкийского заказа §YЛьвовский государственный авиаремонтный завод§! может перестроить наши собственные хранящиеся §YМиГ-27§! до того же стандарта, по эскадрилье за раз.§!"
 UKR_scrapped_su17_resources: "Утилизированные истребители-бомбардировщики Су-17"
 ukr_modernize_sov_equipment_storage_sale.20.name: "§Y[FROM.GetNameWithFlag]§! предлагает нам §YСу-17§!"
 ukr_modernize_sov_equipment_storage_sale.20.desc: "§Y[FROM.GetNameWithFlag]§! предлагает нам хранящиеся истребители-бомбардировщики §YСу-17М2§! и §YСу-17М4§!. Нашему собственному парку §YСу-22§! пригодились бы планеры и запчасти.\n\n§YСу-17§! на украинских складах: §Y[?FROM.ukraine_has_su17_stockpile|0]§!"
 ukr_modernize_sov_equipment_storage_sale.20.a: "Купить эскадрилью (§Y12§!)"
 ukr_modernize_sov_equipment_storage_sale.20.b: "Купить три эскадрильи (§Y36§!)"
 ukr_modernize_sov_equipment_storage_sale.20.c: "Отклонить предложение"
 ukr_modernize_sov_equipment_su17_poland_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_su17_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[POL.GetNameWithFlag]§! всё ещё эксплуатирует §YСу-22§!, экспортную версию §YСу-17§!, и нуждается в запасных планерах. Наши хранящиеся §YСу-17М2§! и §YСу-17М4§! ей хорошо послужат.§!"
 ukr_modernize_sov_equipment_su17_scrap_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_su17_for_tooltip\n\n\n\n\n\n\n\n\n§WНаши хранящиеся §YСу-17§! больше никому не нужны. Утилизация обойдётся в §Rот 10 до 20 млн§! в зависимости от того, сколько их осталось, зато заводы в Харькове на год получат обратно §Gалюминий, сталь и микросхемы§!.§!"
 ukr_modernize_sov_equipment_mig25_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mig25_for_tooltip\n\n\n\n\n\n\n\n\n§WМало какие ВВС ещё способны поддерживать §YМиГ-25§! в лётном состоянии. Интерес проявили §Y[ARM.GetNameWithFlag]§!, §Y[TRK.GetNameWithFlag]§! и §Y[LBA.GetNameWithFlag]§!. Мы предлагаем самолёты одной стране за раз.\n------------------\nСтраны, уже покупавшие с наших складов, убедить §Gлегче§!. Продажа стране §Y[LBA.GetNameWithFlag]§! §Rразозлит НАТО§!.§!"
 ukr_modernize_sov_equipment_mig25_scrap_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mig25_for_tooltip\n\n\n\n\n\n\n\n\n§WНаши хранящиеся §YМиГ-25§! больше никому не нужны. Утилизация обойдётся в §Rот 10 до 20 млн§! в зависимости от того, сколько их осталось, зато заводы в Харькове на год получат обратно §Gсталь, алюминий и микросхемы§!.§!"
 ukr_modernize_sov_equipment_mig23_libya_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mig23_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[LBA.GetNameWithFlag]§! располагает одним из крупнейших в мире парков §YМиГ-23§!, но санкции отрезали её от запчастей. Наши хранящиеся истребители помогут ей держать самолёты в воздухе.\n------------------\nЧлены НАТО §Rвоспримут§! сделку с обидой.§!"
 ukr_modernize_sov_equipment_mig23_sudan_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mig23_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[SUD.GetNameWithFlag]§! ищет дешёвые истребители, а западных поставщиков у него нет. Наши хранящиеся §YМиГ-23§! вписываются в его бюджет.\n------------------\nЧлены НАТО §Rвоспримут§! сделку с обидой.§!"
 ukr_modernize_sov_equipment_mig23_scrap_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mig23_for_tooltip\n\n\n\n\n\n\n\n\n§WНаши хранящиеся §YМиГ-23§! больше никому не нужны. Утилизация обойдётся в §Rот 10 до 20 млн§! в зависимости от того, сколько их осталось, зато заводы в Харькове на год получат обратно §Gалюминий, сталь и микросхемы§!.§!"
