 DEN_close_frederiksberg_have: "Закрыть парк Фредериксберг"
 DEN_close_frederiksberg_have_desc: "Королевская датская военная академия находится во дворце Фредериксберг рядом с огромным живописным парком Фредериксберг. Если закрыть парк для публики, расширенные учебные площадки сильно повысят эффективность академии. Конечно, общественность наверняка будет протестовать, но разве целостность армии нашей страны не важнее нескольких рассерженных любителей бега?"
 DEN_expand_holmen: "Расширить Хольмен"
 DEN_expand_holmen_desc: "Военно-морская база Копенгаген, более известная как база Хольмен, — наша первая и крупнейшая военно-морская база, существующая с XVII века. Изначально она занимала весь окружённый водой район Хольмен в Копенгагене, но с тех пор сократилась до острова Нюхольм. Нам нужно вернуть базе прежние размеры, даже если это разочарует множество ежедневных посетителей."
 DEN_lyngby_radio: "Люнгбю-Радио"
 DEN_lyngby_radio_desc: "Люнгбю-Радио — центральный узел нашей морской связи. Хотя станция в основном работает вместе с Объединённым координационно-спасательным центром (JRCC), её радисты накопили многолетний опыт, который был бы бесценен для любых будущих разработок в области РЛС."
 DEN_support_terma: "Поддержать Terma"
 DEN_support_terma_desc: "Terma A/S — датская технологическая корпорация из Люструпа в Ютландии. Помимо космической и спутниковой техники, она специализируется на РЛС, оборудовании для истребителей и вертолётов и множестве другой военной электроники. Очевидно, поддержка её работы пойдёт нам на пользу."
 DEN_skrydstrup_air_base: "Расширить авиабазу Скрюдструп"
 DEN_skrydstrup_air_base_desc: "По иронии судьбы авиабазу Скрюдструп в Южной Ютландии основали нацисты во время Второй мировой войны как «Флигерхорст Хадерслебен». Сегодня она служит первой линией обороны наших ВВС на случай, если они когда-нибудь снова решат нас навестить. На всякий случай давайте её расширим."
 DEN_skalstrup_air_base: "Расширить авиабазу Скальструп"
 DEN_skalstrup_air_base_desc: "Наша авиабаза под Роскилле раньше была вооружена ракетами NIKE и батареями HAWK, которые вносили огромный вклад в ПВО Зеландии и главной задачей которых была защита Копенгагена от воздушных бомбардировок. Это вооружение по глупости вывели из строя в рамках политики жёсткой экономии. Это была ошибка: защита нашей столицы превыше всего!"
 DEN_danish_culture: "Датская культура"
 DEN_danish_culture_desc: "Величайшая угроза для нас сегодня — постоянная и неумолимая волна атак на нас как на нацию, медленно разъедающая датскую культуру изнутри. Мы должны остановить волну этого пагубного плюрализма и сделать шаги к продвижению нашего доброго, старомодного датского образа жизни."
 DEN_hamburg_is_danish: "Гамбург — датский"
 DEN_hamburg_is_danish_desc: "Закрепив Гамбург как датское владение, страна стремится укрепить морские торговые пути, расширить экономическое влияние и прочнее закрепиться в спорных регионах Северной Европы."
 DEN_baltic_garrison: "Балтийский гарнизон"
 DEN_baltic_garrison_desc: "Укрепляя присутствие в Балтийском регионе, Дания стремится защитить жизненно важные торговые пути, обезопасить себя от возможных противников и подтвердить свои исторические и культурные связи с прибалтийскими государствами."
 DEN_from_baltic_to_black_sea: "От Балтики до Чёрного моря"
 DEN_from_baltic_to_black_sea_desc: "Вдохновлённая былой славой и движимая новыми амбициями, Дания берётся за смелый замысел распространить своё влияние от Балтики до Чёрного моря. Дания стремится утвердить своё присутствие на более широком балтийском и восточноевропейском театре."
 DEN_liberal_social: "Либертарные социалисты"
 DEN_liberal_social_desc: "Libertære Socialister, или либертарные социалисты, выступают за децентрализованное неиерархическое общество, в котором работники коллективно владеют средствами производства и управляют ими. Через низовую самоорганизацию и прямое действие они стремятся разрушить угнетающие структуры и создать более эгалитарное общество с широким участием граждан."
 DEN_free_harbor_for_RAF: "Свободная гавань для RAF"
 DEN_free_harbor_for_RAF_desc: "Дания становится свободной гаванью для движения «Права и свободы» (RAF), предоставляя убежище и поддержку активистам, диссидентам и людям, отстаивающим права человека и гражданские свободы."
 DEN_freetown_christiana: "Вольный город Христиания"
 DEN_freetown_christiana_desc: "Вольный город Христиания — символ альтернативной жизни и общинных идеалов в Копенгагене. Основанная в 1970-х годах группой сквоттеров, Христиания действует как самоуправляемая автономная община, воплощающая принципы коллективной собственности, художественного самовыражения и нонконформизма. Несмотря на необычный статус, Христиания остаётся живым культурным центром, привлекающим гостей со всего мира своим уникальным сочетанием активизма, творчества и контркультурного духа."
 DEN_anarchism_first: "Прежде всего анархизм"
 DEN_anarchism_first_desc: "Передавая власть местным общинам, развивая совместное принятие решений и бросая вызов иерархическим системам власти, правительство стремится создать более эгалитарное и самоуправляемое общество."
 DEN_unconditional_basic_income: "Безусловный базовый доход"
 DEN_unconditional_basic_income_desc: "Дания вводит программу безусловного базового дохода, гарантирующую всем гражданам регулярную выплату независимо от занятости и уровня дохода. Создавая финансовую подушку безопасности и укрепляя экономическую защищённость, правительство стремится сократить бедность, дать людям возможность заниматься любимым делом и расширить социальную и экономическую свободу."
 DEN_export_our_sytem: "Экспорт нашей системы"
 DEN_export_our_sytem_desc: "Дания продвигает свою либеральную социальную модель в других странах, стремящихся построить более инклюзивное и справедливое общество."
 DEN_danish_stasi: "Датская Штази"
 DEN_danish_stasi_desc: "Дания создаёт внутреннюю спецслужбу наподобие восточногерманской Штази, которой поручено следить за инакомыслием в стране и подавлять его."
 DEN_industries: "Промышленность"
 DEN_industries_desc: "Создавая благоприятную среду для бизнеса и инноваций, правительство стремится укрепить экономику страны и создать устойчивые рабочие места для граждан."
 DEN_sustainable_production: "Устойчивое производство"
 DEN_sustainable_production_desc: "Дания обязуется внедрять практики устойчивого производства во всех отраслях промышленности. Внедряя экологичные технологии, сокращая отходы и минимизируя воздействие на окружающую среду, правительство стремится сочетать экономический рост с бережным отношением к природе и долгосрочной устойчивостью."
 DEN_green_economiy_initiative: "Инициатива зелёной экономики"
 DEN_green_economiy_initiative_desc: "Дания запускает Инициативу зелёной экономики — комплексную стратегию перехода к более устойчивой и экологичной экономической модели."
 DEN_conventional_industry: "Традиционная промышленность"
 DEN_conventional_industry_desc: "Дания продолжает поддерживать традиционные отрасли промышленности, признавая их важность для производства необходимых товаров и услуг"
 DEN_found_alternatived: "Основать «Альтернативу»"
 DEN_found_alternatived_desc: "Вдохновлённая идеями партии «Альтернатива», Дания ищет новаторские решения и политику для острых социальных и экологических проблем. Следуя принципам устойчивости, социальной справедливости и демократии участия, Дания стремится первой опробовать альтернативные подходы, ставящие во главу угла благополучие и людей, и планеты."
 DEN_cooperate_with_the_people: "Сотрудничать с народом"
 DEN_cooperate_with_the_people_desc: "Дания делает упор на сотрудничество с гражданами и общинами при выработке промышленной политики и инициатив. Вовлекая заинтересованные стороны в принятие решений, развивая управление с участием граждан и поощряя диалог, правительство стремится укрепить доверие, подотчётность и устойчивость промышленности."
 DEN_found_visitdenmark: "Основать VisitDenmark"
 DEN_found_visitdenmark_desc: "Создание VisitDenmark — согласованные усилия датского правительства по развитию туризма и представлению миру богатого культурного наследия страны, её природной красоты и яркой городской жизни."
 DEN_integrate_to_workforce: "Интеграция в рынок труда"
 DEN_integrate_to_workforce_desc: "Дания уделяет первоочередное внимание интеграции иммигрантов в рынок труда. Предлагая языковые курсы, профессиональное обучение и помощь в трудоустройстве, правительство стремится дать иммигрантам возможность внести весомый вклад в экономику, укрепить социальную сплочённость и создать разнообразный и инклюзивный рынок труда."
 DEN_famliy_visa: "Семейная виза"
 DEN_famliy_visa_desc: "Дания облегчает воссоединение семей с помощью семейных виз, позволяя иммигрантам приглашать к себе в Данию ближайших родственников."
 DEN_strict_point_system: "Строгая балльная система"
 DEN_strict_point_system_desc: "Дания вводит строгую балльную систему иммиграции, отдавая предпочтение заявителям по таким критериям, как образование, опыт работы, знание языка и другие значимые факторы."
 DEN_skilled_occupation_visa: "Квалифицированные профессии"
 DEN_skilled_occupation_visa_desc: "Через фокус «Квалифицированные профессии» Дания нацеливается на определённые профессии и отрасли, упрощая иммиграцию для людей с опытом и квалификацией в востребованных сферах."
 DEN_student_and_holiday_working_visa: "Студенческие и рабочие визы для отдыха"
 DEN_student_and_holiday_working_visa_desc: "Облегчая временное пребывание студентов, стажёров и туристов, правительство стремится развивать межкультурное взаимопонимание, международное сотрудничество и представлять Данию как желанное место для учёбы и отдыха."
 DEN_found_nye_borgerlige: "Основать «Новых правых»"
 DEN_found_nye_borgerlige_desc: "С помощью партии «Новые правые» (Nye Borgerlige) Дания способствует интеграции новоприбывших в политическую жизнь, поощряя создание новых партий, представляющих иммигрантские общины и различные взгляды."
 DEN_strengthen_danish_community_of_value: "Укрепить датское ценностное сообщество"
 DEN_strengthen_danish_community_of_value_desc: "Поощряя гражданское участие, социальную интеграцию и взаимное уважение, правительство стремится воспитать чувство принадлежности и солидарности у всех членов датского общества независимо от гражданства и происхождения."
 DEN_a_new_liberal_economie: "Новая либеральная экономика"
 DEN_a_new_liberal_economie_desc: "Дания переходит к новой либеральной экономике, ориентированной на инновации, предпринимательство и экономический динамизм. Устраняя барьеры для создания бизнеса, развивая конкурентную деловую среду и поощряя инвестиции в новые отрасли, правительство стремится обеспечить экономический рост, создать рабочие места и превратить Данию в центр инноваций и предпринимательства."
 DEN_economic_first: "Прежде всего экономика"
 DEN_economic_first_desc: "Дания ставит экономику на первое место, признавая, что сильная и динамичная экономика — основа прочного государства всеобщего благосостояния."
 DEN_form_minimal_state: "Минимальное государство"
 DEN_form_minimal_state_desc: "Дания стремится создать минимальное государство, пересматривая роль правительства в предоставлении социальных услуг и поддержки. Упрощая бюрократию, передавая полномочия местным властям и давая общинам возможность самим решать свои проблемы, правительство стремится создать более компактный и эффективный государственный аппарат."
 DEN_schroder_blair_paper: "Манифест Шрёдера — Блэра"
 DEN_schroder_blair_paper_desc: "Дания изучает рекомендации манифеста Шрёдера — Блэра, предлагающего ряд реформ для модернизации и обновления государства всеобщего благосостояния. Опираясь на новаторские идеи и доказательную политику, правительство стремится приспособить систему социального обеспечения к меняющимся потребностям и устремлениям датского общества."
 DEN_tax_the_rich: "Обложить богатых налогом"
 DEN_tax_the_rich_desc: "Дания вводит политику налогообложения богатых, чтобы сократить имущественное неравенство и получить средства на социальные программы. Повышая налоговые ставки для самых высокооплачиваемых и состоятельных граждан, правительство стремится к большей социальной справедливости и перераспределению ресурсов в пользу нуждающихся."
 DEN_stabilisation_of_welfare: "Стабилизация социального обеспечения"
 DEN_stabilisation_of_welfare_desc: "Дания сосредотачивается на стабилизации социального обеспечения, чтобы гарантировать долгосрочную устойчивость систем социальной защиты. Сдерживая расходы, снижая риски и приспосабливаясь к демографическим и экономическим переменам, правительство стремится сохранить социальные программы для будущих поколений."
 DEN_found_new_aliance: "Основать «Новый альянс»"
 DEN_found_new_aliance_desc: "Дания стремится создать новый альянс заинтересованных сторон всего общества для совместного решения проблем социального обеспечения. Развивая диалог, добиваясь консенсуса и мобилизуя ресурсы, правительство стремится создать коалицию ради социального прогресса и инноваций, которая принесёт позитивные перемены и укрепит основы государства всеобщего благосостояния."
 DEN_reform_independent_public_company: "Реформа независимых госкомпаний"
 DEN_reform_independent_public_company_desc: "Дания проводит реформы, повышающие эффективность независимых государственных компаний. Упрощая работу, совершенствуя структуры управления и повышая подотчётность и прозрачность, правительство стремится оптимизировать предоставление важнейших услуг и обеспечить ответственное управление государственными ресурсами."
 DEN_energinet_dk: "Energinet"
 DEN_energinet_dk_desc: "Дания подтверждает приверженность энергетической безопасности и устойчивому развитию, вкладывая средства в Energinet. Модернизируя инфраструктуру, наращивая мощности возобновляемой энергетики и повышая энергоэффективность, правительство стремится обеспечить надёжное и устойчивое энергоснабжение и смягчить последствия изменения климата."
 DEN_naviair: "Naviair"
 DEN_naviair_desc: "Дания совершенствует управление воздушным движением и стандарты безопасности, вкладывая средства в Naviair. Модернизируя системы управления воздушным движением, увеличивая пропускную способность воздушного пространства и развивая сотрудничество с международными партнёрами, правительство стремится обеспечить безопасные и эффективные пассажирские и грузовые авиаперевозки."
 DEN_danske_statsbaner: "Датские государственные железные дороги"
 DEN_danske_statsbaner_desc: "Дания модернизирует железнодорожный транспорт, вкладывая средства в Датские государственные железные дороги (DSB). Обновляя железнодорожную инфраструктуру, расширяя сеть сообщений и продвигая экологичную мобильность, правительство стремится улучшить транспортную связность, сократить заторы и предложить экологичные альтернативы."
 DEN_form_postnord: "Создать PostNord"
 DEN_form_postnord_desc: "Дания реорганизует почтовые и логистические услуги, создавая PostNord. Модернизируя распределительные сети, улучшая доставку «последней мили» и внедряя цифровые инновации, правительство стремится удовлетворять меняющиеся потребности потребителей и бизнеса, сохраняя всеобщую доступность почтовых услуг."
 DEN_finansiel_stabilitet: "Finansiel Stabilitet"
 DEN_finansiel_stabilitet_desc: "Дания укрепляет финансовую стабильность и устойчивость с помощью государственной компании Finansiel Stabilitet. Регулируя финансовые учреждения и надзирая за ними, управляя системными рисками и оказывая поддержку в кризисных ситуациях, правительство стремится сохранить целостность финансовой системы и защитить интересы вкладчиков и инвесторов."
 DEN_nemid: "NemID"
 DEN_nemid_desc: "Дания вводит NemID — защищённую систему цифровой идентификации, позволяющую гражданам легко и удобно пользоваться госуслугами и совершать операции онлайн. Предоставляя единое надёжное удостоверение личности, правительство стремится упростить аутентификацию, повысить кибербезопасность и способствовать цифровой инклюзии."
 DEN_digital_post: "Цифровая почта"
 DEN_digital_post_desc: "Дания переходит на Digital Post — цифровую почтовую службу, доставляющую официальные сообщения госорганов гражданам в электронном виде. Переводя бумажную переписку в цифру, сокращая административные расходы и повышая эффективность, правительство стремится упростить каналы связи и дать гражданам своевременный доступ к важной информации и услугам."
 DEN_nemkonto: "NemKonto"
 DEN_nemkonto_desc: "Дания вводит NemKonto — цифровую платёжную систему, позволяющую гражданам получать государственные выплаты и пособия прямо на банковский счёт. Упрощая обработку платежей, сокращая административные издержки и повышая финансовую прозрачность, правительство стремится сделать государственные расходы эффективнее и честнее."
 DEN_borden_dk: "BorDEN"
 DEN_borden_dk_desc: "Дания создаёт BorDEN — цифровую платформу для сотрудничества и обмена информацией между госорганами, бизнесом и гражданами. Централизуя управление данными, обеспечивая их совместимость и защищённые каналы связи, правительство стремится улучшить координацию, инновации и предоставление услуг во всём государственном секторе."
 DEN_government_app: "Borger.dk"
 DEN_government_app_desc: "Дания запускает государственное приложение, дающее гражданам удобный доступ к госуслугам, информации и ресурсам с мобильных устройств. Благодаря удобному интерфейсу, персональным уведомлениям и встроенным функциям приложение призвано повысить вовлечённость граждан, упростить операции и сделать взаимодействие с государством удобнее."
 DEN_pluralist_state: "Плюралистическое государство"
 DEN_pluralist_state_desc: "Дания принимает принципы плюрализма, признавая и ценя многообразие взглядов, убеждений и идентичностей в обществе. Поощряя терпимость, инклюзивность и уважение прав меньшинств, правительство стремится построить плюралистическое государство, где каждый может свободно выражать себя, участвовать в принятии решений и обогащать датскую культуру и демократию."
 DEN_copenhagen_metro: "Копенгагенский метрополитен"
 DEN_copenhagen_metro_desc: "Дания вкладывает средства в расширение и развитие Копенгагенского метрополитена — современной и эффективной системы общественного транспорта столичного региона. Продлевая существующие линии, строя новые станции и интегрируя метро с другими видами транспорта, правительство стремится улучшить связность, сократить заторы и развивать устойчивую городскую мобильность для жителей и гостей столицы."
 DEN_copenhagen_malmo_port: "Порт Копенгаген — Мальмё"
 DEN_copenhagen_malmo_port_desc: "Дания и Швеция совместно развивают порт Копенгаген — Мальмё, стратегический морской узел, связывающий два города и облегчающий торговлю в регионе Балтийского моря. Вкладывая средства в портовую инфраструктуру, логистические объекты и интермодальные транспортные связи, правительства стремятся повысить конкурентоспособность региона, стимулировать экономический рост и укрепить трансграничное сотрудничество."
 DEN_expand_the_port: "Расширить порт"
 DEN_expand_the_port_desc: "Успех порта Копенгаген — Мальмё вселяет в нас уверенность: дальнейшее расширение порта будет полезным шагом."
 DEN_more_imports: "Увеличить импортные мощности"
 DEN_more_imports_desc: "Успех порта Копенгаген — Мальмё вселяет в нас уверенность: дальнейшее наращивание импортных мощностей будет полезным шагом."
 DEN_western_democracy: "Западная демократия"
 DEN_western_democracy_desc: "Дания подтверждает приверженность западной демократии, отстаивая основные принципы свободы, равенства и прав человека. Защищая демократические ценности и развивая сотрудничество с другими западными странами, правительство стремится поддерживать верховенство права и продвигать демократические идеалы внутри страны и за рубежом."
 DEN_mainland_hemisphere: "Материковая часть"
 DEN_mainland_hemisphere_desc: "Стремясь укрепить свою власть, королевский дом сосредотачивается на усилении влияния в материковой Дании, мобилизуя ресурсы и собирая сторонников под своё знамя."
 DEN_island_hemisphere: "Островная часть"
 DEN_island_hemisphere_desc: "Обратив взор на заморские датские территории, королевский дом стремится распространить свою власть на Фарерские острова и Гренландию, утверждая себя как объединяющую силу Датского королевства."
 DEN_house_windsor: "Виндзорская династия"
 DEN_house_windsor_desc: "Вдохновляясь британской монархией, король Фредерик X укрепляет связи с Виндзорской династией, ища поддержки и совета у одного из старейших королевских домов Европы."
 DEN_expand_task_force_north: "Расширить оперативную группу «Север»"
 DEN_expand_task_force_north_desc: "Оперативная группа «Север», ставшая ключевым инструментом в рамках ЕС, олицетворяет активное участие Дании в достижении общих целей безопасности союза и её неизменную поддержку этих целей. Расширяя масштаб операций и углубляя интеграцию в оборонные структуры ЕС, оперативная группа «Север» воплощает стремление Дании к сотрудничеству и солидарности между государствами — членами ЕС."
 DEN_middle_europe_focus: "Курс на Центральную Европу"
 DEN_middle_europe_focus_desc: "Подчёркивая важность регионального сотрудничества и солидарности, Дания направляет дипломатические усилия на сближение со странами Центральной Европы. Через диалог, сотрудничество и совместные инициативы Дания стремится укрепить дипломатические, экономические и культурные связи с соседями в Центральной Европе, способствуя стабильности и процветанию региона."
 DEN_ties_to_france: "Связи с Францией"
 DEN_ties_to_france_desc: "Признавая Францию ключевым союзником и партнёром в Европе, датское правительство ставит в приоритет углубление двусторонних связей с ней. Через дипломатические обмены, совместные проекты и стратегическое сотрудничество Дания стремится укрепить франко-датское партнёрство, развивая взаимопонимание и сотрудничество по широкому кругу вопросов — от обороны и безопасности до борьбы с изменением климата и культурного обмена."
 DEN_german_partner: "Германия — наш партнёр"
 DEN_german_partner_desc: "Признавая Германию ключевым стратегическим партнёром и соседом, Дания стремится углубить с ней дипломатические и экономические связи. Через встречи на высшем уровне, совместные проекты и приграничные инициативы Дания и Германия вместе укрепляют региональную стабильность, экономический рост и культурный обмен, развивая прочное и долгосрочное партнёрство двух стран."
 DEN_benelux_fokus: "Курс на Бенилюкс"
 DEN_benelux_fokus_desc: "Признавая важность сотрудничества в регионе Бенилюкса, Дания ставит в приоритет укрепление связей с Бельгией, Нидерландами и Люксембургом. Через совместные усилия, дипломатические контакты и общие инициативы Дания стремится углубить партнёрство со странами Бенилюкса, способствуя региональной интеграции, экономическому сотрудничеству и культурному обмену."
 DEN_transatlantic_focus: "Трансатлантический курс"
 DEN_transatlantic_focus_desc: "Подтверждая приверженность трансатлантическим отношениям, Дания стремится углубить связи с США и Канадой. Через дипломатический диалог, стратегическое партнёрство и общие ценности Дания укрепляет трансатлантические узы, развивая сотрудничество в сфере безопасности, торговли, технологий и решения глобальных проблем и подчёркивая важность альянса НАТО."
 DEN_ties_to_canada: "Связи с Канадой"
 DEN_ties_to_canada_desc: "Опираясь на общие ценности и интересы, Дания стремится улучшить дипломатические отношения с Канадой. Через диалог, сотрудничество и совместные проекты Дания стремится углубить партнёрство с Канадой, развивая сотрудничество в управлении Арктикой, защите окружающей среды, торговле и инновациях, а также поощряя связи между людьми и культурный обмен двух стран."
 DEN_ties_south_america: "Связи с Южной Америкой"
 DEN_ties_south_america_desc: "Признавая растущее значение Южной Америки на мировой арене, Дания стремится укрепить дипломатические связи со странами региона. Через дипломатические контакты, торговые соглашения и культурный обмен Дания стремится углубить взаимодействие с южноамериканскими странами, развивая сотрудничество в области устойчивого развития, торговли и защиты окружающей среды и изучая возможности экономического партнёрства и инвестиций."
 DEN_eurasic_focus: "Курс на Евразию"
 DEN_eurasic_focus_desc: "Признавая стратегическое значение Евразии, Дания стремится укрепить дипломатические связи со странами региона. Через дипломатическое взаимодействие, торговые соглашения и культурный обмен Дания стремится углубить сотрудничество с евразийскими странами, способствуя региональной стабильности, экономическому развитию и культурному обмену и изучая возможности совместных проектов в инфраструктуре, энергетике и инновациях."
 DEN_ties_to_russia: "Связи с Россией"
 DEN_ties_to_russia_desc: "Признавая Россию ключевым игроком в региональных и мировых делах, Дания стремится поддерживать с ней конструктивные и прагматичные отношения. Через дипломатический диалог, взаимодействие и сотрудничество в общих интересах Дания стремится выстроить с Россией отношения, основанные на взаимном уважении, прозрачности и диалоге, решая разногласия по дипломатическим каналам."
 DEN_ties_to_india: "Связи с Индией"
 DEN_ties_to_india_desc: "Признавая растущее влияние и значение Индии на мировой арене, Дания стремится углубить с ней дипломатические и экономические связи. Через дипломатические контакты, торговые соглашения и культурный обмен Дания стремится укрепить партнёрство с Индией, развивая сотрудничество в торговле, инвестициях, технологиях и устойчивом развитии, а также поощряя связи между людьми и культурный обмен двух стран."
 DEN_ties_to_china: "Связи с Китаем"
 DEN_ties_to_china_desc: "Признавая растущую роль и экономическое влияние Китая, Дания стремится укрепить с ним дипломатические отношения. Через дипломатическое взаимодействие, торговые соглашения и культурный обмен Дания стремится углубить партнёрство с Китаем, развивая сотрудничество в торговле, инвестициях, инновациях и защите окружающей среды и ведя конструктивный диалог по вопросам взаимного интереса и беспокойства."
 DEN_ties_to_indonesia: "Связи с Индонезией"
 DEN_ties_to_indonesia_desc: "Признавая стратегическое значение Индонезии в Юго-Восточной Азии, Дания стремится улучшить с ней дипломатические и экономические связи. Через дипломатическое взаимодействие, торговые соглашения и культурный обмен Дания стремится укрепить партнёрство с Индонезией, развивая сотрудничество в морской безопасности, устойчивом развитии, возобновляемой энергетике и культурном обмене и способствуя стабильности и процветанию Юго-Восточной Азии."
 DEN_restarting_schultz_larsen: "Schultz & Larsen"
 DEN_restarting_schultz_larsen_desc: "Schultz & Larsen — датский оружейный производитель, основанный в 1919 году. После Второй мировой войны компания стала выпускать в основном охотничье снаряжение. Пора вернуть её к истокам и поручить ей производство оружия для датской армии."
 DEN_expand_maersk: "Расширить A.P. Møller-Mærsk Group"
 DEN_expand_maersk_desc: "Дания реализует амбициозную стратегию расширения мирового присутствия и влияния A.P. Møller-Mærsk Group — ведущего многонационального конгломерата. Опираясь на опыт группы в судоходстве, логистике и энергетике, Дания стремится укрепить позиции компании как ключевого игрока на международном рынке, поощряя устойчивый рост и инновации."
 DEN_maersk_nortsea_port: "Северноморский порт Mærsk"
 DEN_maersk_nortsea_port_desc: "Дания сосредотачивается на развитии и расширении северноморского порта Mærsk, стратегически расположенного для морской торговли и логистики в регионе Северного моря. Вкладывая средства в инфраструктуру, технологии и транспортные связи, Дания стремится повысить мощность, эффективность и конкурентоспособность порта, обеспечивая экономическое развитие и процветание окрестностей."
 DEN_maersk_american_port: "Mærsk America"
 DEN_maersk_american_port_desc: "Дания ищет возможности расширить присутствие Mærsk America, используя огромный потенциал американского рынка и укрепляя торговые связи между Данией и США. С помощью стратегических инвестиций, партнёрств и выхода на новые рынки Дания стремится сделать Mærsk America ведущим игроком в морских перевозках, логистике и транспорте по всей Северной Америке."
 DEN_maersk_asian_port: "Азиатский порт Mærsk"
 DEN_maersk_asian_port_desc: "Дания сосредотачивается на стратегическом развитии азиатского порта Mærsk, пользуясь динамичной экономической обстановкой и растущим спросом на морские услуги в Азиатско-Тихоокеанском регионе. Вкладывая средства в портовую инфраструктуру, цифровизацию и клиентоориентированные решения, Дания стремится сделать азиатский порт Mærsk главными воротами торговли в Азии, укрепляя связность и процветание региона."
 DEN_maersk_indian_port: "Индийский порт Mærsk"
 DEN_maersk_indian_port_desc: "Дания ставит в приоритет расширение и модернизацию индийского порта Mærsk, используя стратегическое положение Индии и потенциал её развивающегося рынка. С помощью целевых инвестиций, партнёрств и наращивания мощностей Дания стремится повысить эффективность, связность и конкурентоспособность порта, облегчая торговые потоки и экономический рост на Индийском субконтиненте."
 DEN_expand_maersk_investments: "Mærsk Investments"
 DEN_expand_maersk_investments_desc: "Дания активно ищет инвестиционные возможности и стратегических партнёров, чтобы укрепить портфель Mærsk Investments, диверсифицировать источники дохода и создавать долгосрочную стоимость. Выявляя перспективные отрасли, рынки и проекты, Дания стремится оптимизировать доходность, снизить риски и поддержать устойчивый рост инвестиционного портфеля группы Mærsk."
 DEN_expand_maersk_logistics: "Mærsk Logistics"
 DEN_expand_maersk_logistics_desc: "Дания сосредотачивается на оптимизации и расширении сети Mærsk Logistics, предлагающей комплексные решения для цепочек поставок, отвечающие меняющимся потребностям клиентов по всему миру. Благодаря цифровизации, инновациям и безупречной работе Дания стремится повысить эффективность, надёжность и гибкость услуг Mærsk Logistics, предлагая решения, повышающие конкурентоспособность и рост."
 DEN_expand_maersk_supply_service: "Mærsk Supply Service"
 DEN_expand_maersk_supply_service_desc: "Дания укрепляет возможности и присутствие Mærsk Supply Service — ведущего поставщика услуг обеспечения морских нефтегазовых платформ и морских услуг. Опираясь на опыт, флот и безупречную работу компании, Дания стремится увеличить долю Mærsk Supply Service на рынке, расширить спектр услуг и воспользоваться новыми возможностями в морской энергетике и судоходстве."
 DEN_maersk_global_player: "Mærsk Global"
 DEN_maersk_global_player_desc: "Дания возглавляет усилия по укреплению мирового присутствия и влияния Mærsk на самых разных рынках и в разных отраслях. Расширяя деятельность, развивая партнёрства и опираясь на опыт Mærsk, Дания стремится сделать Mærsk Global символом датских инноваций, высокого качества и лидерства на международной арене."
 DEN_green_water_navy: "Флот прибрежной зоны"
 DEN_green_water_navy_desc: "Датское правительство обязуется укрепить флот прибрежной зоны, делая упор на береговую оборону и морские операции в Балтийском море и Северной Атлантике. Для этого верфь Odense Steel Shipyard получает контракты на постройку патрульных кораблей типа «Кнуд Расмуссен», которые обеспечат защиту территориальных вод Дании и её жизненно важных морских интересов."
 DEN_blue_water_navy: "Океанский флот"
 DEN_blue_water_navy_desc: "Совершая стратегический поворот к экспедиционным возможностям, датское правительство вкладывает средства в создание океанского флота, способного проецировать силу и действовать в отдалённых водах. В рамках этой инициативы правительство вместе с Maersk Line приобретает корабли поддержки типа «Абсалон», которые обеспечат материально-техническую поддержку датских военно-морских сил по всему миру."
 DEN_dansk_naval_industry: "Датская военно-морская промышленность"
 DEN_dansk_naval_industry_desc: "Признавая важность сильной отечественной судостроительной промышленности, датское правительство заключает стратегические партнёрства с местными верфями и оборонными подрядчиками, чтобы поощрять инновации и самостоятельность в закупках для флота. Сотрудничество с Helsingør Værft приводит к постройке фрегатов типа «Ивер Хуитфельдт», демонстрирующих мастерство Дании в военно-морской технике и технологиях."
 DEN_fregatte: "Фрегаты"
 DEN_fregatte_desc: "Стремясь усилить надводную ударную мощь, датское правительство вкладывает средства в новые фрегаты, чтобы повысить огневую мощь и присутствие флота. Верфь Odense Steel Shipyard получает контракты на постройку фрегатов типа «Нильс Юль», оснащённых современными датчиками и системами вооружения для господства на море в спорных районах."
 DEN_submarine_focus: "Курс на подводный флот"
 DEN_submarine_focus_desc: "Признавая стратегическое значение подводной войны, датское правительство запускает программу модернизации и расширения подводного флота. Сотрудничество с Saab Kockums приводит к закупке подводных лодок проекта 214, оснащённых передовыми технологиями малозаметности и современными силовыми установками, обеспечивающими большую автономность и гибкость применения."
 DEN_rocket_subs: "Ракетные подводные лодки"
 DEN_rocket_subs_desc: "Признавая необходимость надёжного сдерживания, датское правительство приобретает ракетные подводные лодки, способные нести и запускать стратегическое ядерное оружие сдерживания. Сотрудничество с Naval Group приводит к закупке ракетных подводных лодок типа «Каптайн», оснащённых баллистическими ракетами подводного базирования для защиты безопасности и суверенитета морских интересов Дании."
 DEN_modern_fleet: "Современный флот"
 DEN_modern_fleet_desc: "В основе модернизации военно-морских сил Дании лежит создание современного и боеспособного флота, готового к вызовам морской обстановки XXI века. Стратегически вкладывая средства в передовые технологии и платформы, Дания подтверждает решимость защищать свои морские границы и сохранять статус значимой морской державы."
 DEN_artillerie_question: "Вопрос артиллерии"
 DEN_artillerie_question_desc: "Тщательно оценивая нынешние возможности и будущие потребности, датское правительство созывает группу экспертов для решения «вопроса артиллерии», чтобы изучить эффективность существующих систем и определить, что нужно улучшить."
 DEN_US_artillerie: "Американская артиллерия"
 DEN_US_artillerie_desc: "Опираясь на давнее партнёрство с США, датское правительство изучает возможности сотрудничества в области артиллерийских систем. С американскими оборонными подрядчиками ведутся переговоры о закупке передовых артиллерийских платформ, чтобы воспользоваться передовыми технологиями и опытом из-за Атлантики."
 DEN_domestic_artillerie: "Отечественная артиллерия"
 DEN_domestic_artillerie_desc: "Демонстрируя национальный суверенитет и самостоятельность, датское правительство вкладывает средства в разработку и производство отечественных артиллерийских систем. Местные оборонные предприятия получают контракты на изготовление собственных артиллерийских платформ, отвечающих особым требованиям датской армии."
 DEN_french_artillerie: "Французская артиллерия"
 DEN_french_artillerie_desc: "Расширяя международные партнёрства, датское правительство заключает соглашения с французскими оборонными производителями о закупке французских артиллерийских систем, известных надёжностью и характеристиками. Совместные проекты открывают путь к включению французских артиллерийских платформ в арсенал датской армии, повышая совместимость и боевые возможности."
 DEN_update_M109: "Модернизировать M109"
 DEN_update_M109_desc: "Стремясь к модернизации, датское правительство запускает программу обновления самоходных гаубиц M109, повышающую их огневую мощь, подвижность и живучесть на поле боя. Модернизация включает улучшенные системы управления огнём, усиленную защиту и интеграцию современных боеприпасов."
 DEN_panzerhaubitze_2000: "Panzerhaubitze 2000"
 DEN_panzerhaubitze_2000_desc: "Опираясь на опыт германских оборонных партнёров, датское правительство рассматривает закупку самоходных гаубиц Panzerhaubitze 2000. С Krauss-Maffei Wegmann ведутся переговоры о закупке систем PzH 2000, которые дадут датской армии проверенную и надёжную артиллерийскую платформу."
 DEN_arillerie_kommando: "Артиллерийское командование"
 DEN_arillerie_kommando_desc: "Признавая решающую роль артиллерии в современной войне, датское правительство создаёт артиллерийское командование для руководства артиллерийскими операциями и их координации. Командование, укомплектованное высококвалифицированными специалистами, обеспечивает эффективное применение артиллерии в поддержку задач датской армии."
 DEN_specialforces_equipment: "Снаряжение сил специальных операций"
 DEN_specialforces_equipment_desc: "Признавая особые потребности элитных подразделений сил специальных операций Дании, датское правительство обязуется закупать специализированное снаряжение, рассчитанное на этих высококвалифицированных бойцов. Заключаются контракты на передовое снаряжение, включая приборы ночного видения, тактические системы связи и современные средства индивидуальной защиты."
 DEN_infanterie_kommando: "Пехотное командование"
 DEN_infanterie_kommando_desc: "Признавая важность специализированных пехотных подразделений в современной войне, датское правительство создаёт пехотное командование, которое станет авангардом операций датской армии. Командование, укомплектованное хорошо подготовленными универсальными солдатами, специализируется на разведке, прямых действиях и специальных операциях, позволяя Дании проецировать силу и быстро реагировать на новые угрозы."
 DEN_vehicle_question: "Вопрос бронетехники"
 DEN_vehicle_question_desc: "Проводя всестороннюю оценку нынешних возможностей бронетехники и будущих потребностей, датское правительство созывает экспертов для решения «вопроса бронетехники». Тщательный анализ позволяет найти возможности для улучшения и модернизации всего бронепарка."
 DEN_US_made: "Американские Bradley"
 DEN_US_made_desc: "Опираясь на давнее партнёрство с США, датское правительство рассматривает закупку боевых машин пехоты M2 Bradley для усиления бронированной пехоты. С американскими оборонными подрядчиками ведутся переговоры о закупке Bradley, которые повысят огневую мощь и подвижность датской армии на поле боя."
 DEN_marder: "Германские Marder"
 DEN_marder_desc: "Опираясь на тесные связи с Германией, датское правительство рассматривает закупку боевых машин пехоты Marder для пополнения бронепарка. С Rheinmetall ведутся переговоры о закупке Marder, чтобы воспользоваться германским опытом проектирования и производства бронетехники."
 DEN_update_leopard_tank: "Модернизировать Leopard"
 DEN_update_leopard_tank_desc: "Стремясь сохранить боеспособный парк основных боевых танков, датское правительство запускает программу модернизации танков Leopard 2A5DK. Модернизация включает улучшение огневой мощи, бронезащиты и цифровых систем, обеспечивая неизменную эффективность датских бронетанковых сил."
 DEN_US_tanks: "M1A2 Abrams"
 DEN_US_tanks_desc: "Стремясь к совместимости и унификации с союзниками по НАТО, датское правительство рассматривает закупку основных боевых танков M1A2 Abrams у США. С General Dynamics ведутся переговоры о закупке Abrams, которые усилят датские бронетанковые войска проверенной в бою техникой."
 DEN_german_tanks: "Leopard 2A7"
 DEN_german_tanks_desc: "Стремясь сохранить современный и боеспособный бронепарк, датское правительство изучает возможность закупки новейшей версии основного боевого танка Leopard 2. С Krauss-Maffei Wegmann ведутся переговоры о закупке танков Leopard 2A7+ с передовыми технологиями и улучшениями для поля боя."
 DEN_challenger: "Challenger 3"
 DEN_challenger_desc: "Стремясь разнообразить бронетанковые возможности и опробовать новые технические решения, датское правительство рассматривает возможность закупки британского основного боевого танка Challenger 3. Сотрудничество с BAE Systems приводит к переговорам о закупке Challenger 3, которые дадут датским бронетанковым войскам грозную и универсальную платформу."
 DEN_tank_kommando: "Танковое командование"
 DEN_tank_kommando_desc: "Признавая важность специализированных бронетанковых подразделений в современной войне, датское правительство создаёт танковое командование, которое станет острием бронетанковых операций датской армии. Командование из хорошо подготовленных танковых экипажей при поддержке пехоты и разведки специализируется на наступательных манёврах, тактике бронетанковой войны и общевойсковых операциях, позволяя Дании господствовать на поле боя."
 DEN_light_forces_focus: "Курс на лёгкие силы"
 DEN_light_forces_focus_desc: "Делая ставку на мобильность и быстрое развёртывание, датское правительство в первую очередь вкладывает средства в лёгкие силы, способные вести экспедиционные операции и выполнять специальные задачи. Средства направляются на улучшение подготовки, снаряжения и мобильности лёгкой пехоты, разведки и сил специальных операций, чтобы они были эффективны в самой разной обстановке."
 DEN_medium_forces_focus: "Курс на средние силы"
 DEN_medium_forces_focus_desc: "Добиваясь баланса между подвижностью и огневой мощью, датское правительство уделяет внимание средним силам, способным вести затяжные боевые действия и обладающим универсальными возможностями. Средства вкладываются в бронетанковые и механизированные части на колёсной и гусеничной технике, способные быстро развёртываться и эффективно маневрировать в самых разных условиях."
 DEN_heavy_forces_focus: "Курс на тяжёлые силы"
 DEN_heavy_forces_focus_desc: "Признавая важность бронированной огневой мощи и живучести на современном поле боя, датское правительство усиливает тяжёлые силы, повышая их возможности и модернизируя технику. Упор делается на модернизацию основных боевых танков, боевых бронированных машин и артиллерийских систем, чтобы обеспечить превосходство в бронетанковой войне и способность проецировать силу."
 DEN_reform_heeresflieger: "Реформа ВВС Дании"
 DEN_reform_heeresflieger_desc: "Признавая необходимость гибкости и универсальности перед лицом меняющихся угроз, датское правительство проводит основательную реформу Flyvevåbnet — Военно-воздушных сил Дании. Реформа призвана оптимизировать организационную структуру, упростить работу и повысить боеготовность всех частей ВВС."
 DEN_apache: "Американские Apache"
 DEN_apache_desc: "Опираясь на союз с США, датское правительство рассматривает закупку ударных вертолётов AH-64 Apache для усиления вертолётных возможностей ВВС. С Boeing ведутся переговоры о закупке Apache, которые повысят огневую мощь ВВС Дании и расширят спектр их задач."
 DEN_the_eurocopter: "Eurocopter"
 DEN_the_eurocopter_desc: "Разнообразя вертолётный парк, датское правительство рассматривает закупку вертолётов Eurocopter для самых разных задач, включая поисково-спасательные операции, перевозку войск и морское патрулирование. С Airbus Helicopters ведутся переговоры о закупке платформ Eurocopter, которые укрепят авиационные возможности и гибкость ВВС Дании."
 DEN_helicopter_training: "Подготовка вертолётчиков"
 DEN_helicopter_training_desc: "Признавая важность подготовки и мастерства пилотов, датское правительство вкладывает средства в программы подготовки вертолётчиков, чтобы обеспечить боеготовность пилотов вертолётов ВВС Дании. Создаются современные учебные центры и тренажёры для всесторонней подготовки к полётам, боевой тактике и действиям в чрезвычайных ситуациях."
 DEN_reform_equipment: "Реформа техники"
 DEN_reform_equipment_desc: "В соответствии с целями модернизации ВВС Дании датское правительство проводит планомерную проверку и обновление авиационной техники, включая самолёты, авионику и системы обеспечения. Модернизация и улучшения проводятся во всём парке, чтобы повысить характеристики, надёжность и эффективность выполнения задач."
 DEN_eurofighter: "Eurofighter"
 DEN_eurofighter_desc: "Изучая варианты закупки современных истребителей, датское правительство рассматривает Eurofighter Typhoon для усиления возможностей ВВС Дании по завоеванию господства в воздухе. С Eurofighter GmbH проводятся переговоры о закупке самолётов Eurofighter, сочетающих передовые технологии и высокие боевые возможности."
 DEN_update_F16: "Модернизировать F-16"
 DEN_update_F16_desc: "Чтобы F-16 Fighting Falcon, основа истребительного парка ВВС Дании, оставался актуальным и эффективным, датское правительство запускает программу модернизации имеющихся F-16. Модернизация включает улучшение авионики и систем вооружения, а также ремонт планера, чтобы продлить срок службы и повысить боевые возможности парка F-16."
 DEN_form_kommando_luftwaffe: "Создать авиационное командование"
 DEN_form_kommando_luftwaffe_desc: "Признавая необходимость в специализированных авиационных подразделениях, датское правительство создаёт особое командование ВВС Дании. Укомплектованное хорошо подготовленным личным составом с опытом воздушно-десантных операций, непосредственной авиационной поддержки и специальных задач, командование повышает способность ВВС Дании проводить сложные и рискованные операции в условиях противодействия."
 DEN_F35_programme: "Программа F-35"
 DEN_F35_programme_desc: "Подтверждая приверженность авиации нового поколения, датское правительство продолжает участие в программе F-35 Lightning II. С Lockheed Martin заключаются контракты на закупку самолётов F-35A Lightning II, которые дадут ВВС Дании непревзойдённую малозаметность, манёвренность и совместимость для будущих воздушных операций."
 DEN_future_combat_air_system: "Future Combat Air System"
 DEN_future_combat_air_system_desc: "Предвидя будущие вызовы и технологический прогресс, датское правительство вкладывает средства в исследования и разработки по программе Future Combat Air System (FCAS). Партнёрство с европейскими союзниками открывает путь к созданию авиационных боевых систем нового поколения, благодаря которым ВВС Дании останутся в авангарде инноваций в воздушной войне."
 DEN_reformed_airforce: "Реформированные ВВС Дании"
 DEN_reformed_airforce_desc: "Благодаря описанным всесторонним реформам ВВС Дании становятся реформированными и модернизированными военно-воздушными силами с современными самолётами, передовыми технологиями и высококвалифицированным личным составом. Обновлённые ВВС Дании готовы защищать датское воздушное пространство, проецировать силу за рубежом и вносить вклад в международную безопасность и стабильность."
 DEN_reform_fuhrungsstaab_der_luftwaffe: "Реформа командования ВВС"
 DEN_reform_fuhrungsstaab_der_luftwaffe_desc: "Одновременно с преобразованием ВВС Дании датское правительство реформирует командование ВВС — оперативный штаб, руководящий операциями военно-воздушных сил. Оптимизируя структуру управления, улучшая координацию и используя технологии, командование ВВС реформируется, чтобы обеспечить эффективный контроль над задачами и возможностями ВВС Дании."
 DEN_biotech_rising: "Подъём биотехнологий"
 DEN_biotech_rising_desc: "Дания стремится стать лидером в биотехнологиях, продвигая инновации в здравоохранении и устойчивом развитии. Инвестиции в биотехнологии укрепят наш научный потенциал и создадут высокотехнологичные рабочие места, закрепив место Дании в этой революционной отрасли."
 DEN_expand_carlsberg: "Расширить Carlsberg"
 DEN_expand_carlsberg_desc: "Мы начинаем смелую инициативу по расширению мирового присутствия Carlsberg — нашей легендарной пивоварни. С помощью инвестиций и партнёрств мы стремимся укрепить позиции Carlsberg на международных рынках, увеличить экспорт и показать датское пивоваренное мастерство. Это расширение не только ускорит рост пивоварни, но и создаст рабочие места и укрепит экономическое благополучие."
 DEN_carlsberg_invest: "Инвестиции в Carlsberg"
 DEN_carlsberg_invest_desc: "Вкладывая средства в пивоварню Carlsberg, мы обеспечиваем финансовую выгоду, одновременно укрепляя и развивая нашу пивоваренную отрасль."
 DEN_expand_logistic_companies: "Расширить логистические компании"
 DEN_expand_logistic_companies_desc: "Вдохновлённая растущими возможностями в Азии, Дания запускает инициативу по расширению своих логистических компаний на ключевых рынках, таких как Китай, Гонконг, Япония и Индия. С помощью целевых инвестиций мы стремимся улучшить нашу логистическую сеть и укрепить присутствие в этих стратегических узлах."
 DEN_logistics_partner_deals_tt: "Заключить логистические соглашения с §YКитаем§!, §YГонконгом§!, §YЯпонией§! и §YИндией§!. С каждым партнёром:\n  Наше влияние там растёт на §Y1.2%§!.\n  Мы получаем международные инвестиции на §Y3%§! его ВВП на душу населения и долг на §Y2%§! от него.\n  Он получает §Y1%§! нашего ВВП на душу населения.\n"
 DEN_expand_DSV: "Расширить DSV"
 DEN_expand_DSV_desc: "Дания запускает амбициозную инициативу по расширению DSV — ключевого игрока логистической отрасли. С помощью стратегических инвестиций мы стремимся расширить мировое присутствие и возможности DSV. Это расширение не только укрепит логистический сектор Дании, но и будет способствовать международной торговле."
 DEN_expand_DSV_logistics: "DSV Logistics"
 DEN_expand_DSV_logistics_desc: "С помощью целевых инициатив Дания сосредотачивается на оптимизации логистических операций DSV по всему миру. Такой подход укрепляет позиции Дании как лидера в логистике и способствует международной торговле и связности."
 DEN_expand_DSV_invests: "Инвестиции в DSV"
 DEN_expand_DSV_invests_desc: "Дания направляет стратегические инвестиции в DSV, опору нашей логистической отрасли, что не только приносит стране финансовую выгоду, но и расширяет наши логистические возможности."
 DEN_expand_DSV_logistics_II: "DSV Global"
 DEN_expand_DSV_logistics_II_desc: "С помощью стратегических инициатив и партнёрств Дания сосредотачивается на расширении мирового присутствия DSV. Опираясь на обширную сеть и опыт DSV, мы стремимся улучшить международные торговые пути, оптимизировать цепочки поставок и обеспечить бесперебойную мировую логистику. Это глобальное расширение повышает конкурентоспособность Дании на мировой арене и способствует экономическому росту и процветанию."
 DEN_logistic_global_investments: "Расширить мировую логистику"
 DEN_logistic_global_investments_desc: "Дания запускает стратегическую программу расширения мировых логистических сетей, открывая новые возможности для торговли и связности. Это позволит вкладывать средства в порты и транспортную логистику по всему миру. Инвестируя в мировую логистику, мы обеспечиваем долгосрочную финансовую выгоду и укрепляем роль Дании в мировой экономике."
 denmark_agrar_event.10.b: "Встретиться с протестующими"
 denmark_agrar_event.15.b: "Встретиться с фермерами"
 DEN_idea_unconditional_basic_income: "Безусловный базовый доход"
 DEN_idea_unconditional_basic_income_des: "Дания выплачивает безусловный базовый доход каждому гражданину, повышая продолжительность жизни и благосостояние."
 DEN_idea_office_of_international_relations: "Управление международных отношений"
 DEN_idea_office_of_international_relations_desc: "Управление международных отношений, подчинённое монархии, служит дипломатическим связующим звеном между Данией и другими странами, развивая международное сотрудничество и добрую волю."
 DEN_royal_nordic_institute: "Королевский Северный институт"
 DEN_royal_nordic_institute_desc: "Создание Королевского Северного института символизирует стремление Дании развивать сотрудничество и культурный обмен между странами Северной Европы, укрепляя взаимопонимание и солидарность."
 DEN_idea_new_tradition: "Монархия новых традиций"
 DEN_idea_new_tradition_desc: "Дания вводит в монархии новую традицию, сочетая современные ценности с историческими обычаями, чтобы приспособиться к меняющимся общественным нормам и ожиданиям."
 DEN_idea_light_force: "Курс на лёгкие силы"
 DEN_idea_light_force_desc: "Дания переносит военный упор на лёгкие силы, делая ставку на гибкость, мобильность и быстрое реагирование на современные угрозы безопасности."
 DEN_idea_medium_force: "Курс на средние силы"
 DEN_idea_medium_force_desc: "Дания сохраняет сбалансированную структуру вооружённых сил с упором на подразделения среднего класса, способные гибко и эффективно выполнять широкий круг задач."
 DEN_idea_heavy_force: "Курс на тяжёлые силы"
 DEN_idea_heavy_force_desc: "Дания наращивает возможности тяжёлых сил, вкладывая средства в бронетехнику, артиллерию и механизированную пехоту для повышения огневой мощи и господства на поле боя."
 DEN_idea_VFK: "VFK"
 DEN_idea_VFK_desc: "Вооружённые силы Дании (VFK) провели всестороннюю модернизацию, укрепив свои возможности за счёт передовых технологий, улучшенной подготовки и стратегической реорганизации, чтобы быть готовыми эффективно защищать национальную безопасность."
 DEN_idea_privatisation_post: "PostNord"
 DEN_idea_privatisation_post_desc: "PostNord, почтовый оператор Дании, модернизирует работу и расширяет услуги, чтобы отвечать меняющимся потребностям клиентов в цифровую эпоху."
 DEN_idea_world_forum: "Всемирный форум"
 DEN_idea_world_forum_desc: "Дания выступает за создание Всемирного форума труда, где представители профсоюзов и рабочих организаций со всего мира смогут собираться, чтобы решать общие проблемы, обмениваться передовым опытом и координировать международную солидарность."
 DEN_labour_union1: "Гарантированные права трудящихся"
 DEN_labour_union1_desc: "Мы должны подтвердить нашу решимость защищать права трудящихся, обеспечивать справедливое обращение и безопасные условия труда."
 DEN_labour_union2: "Обязательные рабочие советы"
 DEN_labour_union2_desc: "Закон об обязательных рабочих советах требует создавать рабочие советы во всех крупных компаниях, чтобы укрепить демократию на рабочем месте и улучшить взаимодействие между работниками и руководством."
 DEN_labour_union3a: "Партийные рабочие советы"
 DEN_labour_union3a_desc: "Партийные рабочие советы призваны представлять интересы трудящихся в политической сфере, чтобы трудовая политика отвечала потребностям и устремлениям работающего населения."
 DEN_labour_union3b: "Профсоюзные рабочие советы"
 DEN_labour_union3b_desc: "Профсоюзные рабочие советы позволят профсоюзам активно участвовать в управлении предприятиями, добиваться лучших условий труда и вести переговоры от имени своих членов, создавая более справедливую трудовую среду."
 DEN_world_workers_paradise: "Всемирный рай трудящихся"
 DEN_world_workers_paradise_desc: "Всемирный рай трудящихся — мечта о мире, где права трудящихся повсеместно уважаются, а работники пользуются справедливым обращением и благополучием. Это амбициозное начинание стремится укрепить солидарность трудящихся всего мира и добиваться справедливой оплаты, безопасных условий труда и социальной справедливости."
 DEN_political_capital_injection: "Вливание политического капитала"
 DEN_political_capital_injection_desc: "Вливание политического капитала означает готовность Дании делиться политической властью с профсоюзами, давая им больше влияния и доступа к политической сфере."
 DEN_anarchism1: "Датский анархизм"
 DEN_anarchism1_desc: "Датский анархизм воплощает смелое видение общественного устройства, основанного на принципах автономии, добровольных объединений и децентрализованного принятия решений. Эта идеология выступает за упразднение иерархических структур, включая государство, в пользу низовой демократии и прямого действия. Датский анархизм стремится дать людям и общинам возможность свободно управлять собой, создавая общество взаимопомощи, солидарности и коллективной ответственности."
 DEN_idea_visitdenmark: "VisitDenmark"
 DEN_idea_visitdenmark_desc: "С помощью стратегических маркетинговых кампаний, партнёрства с туристической отраслью и новаторских рекламных акций VisitDenmark стремится привлекать гостей со всего мира, стимулируя экономический рост и укрепляя репутацию Дании как одного из лучших туристических направлений."
 DEN_maersk1: "Møller-Mærsk Group"
 DEN_maersk1_desc: "Основанная в 1904 году А. П. Мёллером и капитаном Петером Мерском Мёллером, Mærsk выросла в одну из крупнейших судоходных и логистических компаний мира. Присутствуя более чем в 130 странах и располагая флотом из более чем 700 судов, Mærsk работает в нескольких секторах, включая контейнерные перевозки, управление терминалами, разведку нефти и газа и логистические услуги."
 DEN_carlsberg: "Carlsberg Group"
 DEN_carlsberg_desc: "Carlsberg Group — крупная датская многонациональная пивоваренная компания, основанная в 1847 году, со штаб-квартирой в Копенгагене. Будучи одной из крупнейших пивоваренных групп мира, она широко представлена в Европе и Азии. Её мировой портфель включает более 140 марок напитков во главе с такими флагманами, как Carlsberg, Tuborg, Kronenbourg 1664, Grimbergen и сидр Somersby."
 DEN_decision_investments_global: "Инвестировать в порты по всему миру"
 DEN_decision_investments_global_desc: "В рамках стратегической программы Дании по расширению мировых логистических сетей мы вкладываем средства в порты по всему миру. Эти инвестиции улучшат портовую инфраструктуру, повысят эффективность обработки грузов и помогут заключить важные международные партнёрства. Укрепляя возможности портов, мы стремимся открыть новые торговые возможности, обеспечить долгосрочную финансовую выгоду и закрепить роль Дании в мировой экономике."
