name: Validator Cache (main)

# Builds the shared validator cache, records each main commit's baseline, and
# checks it against the last accepted one in one run.

on:
  # No path filter: a PR report accepts only its base commit's baseline.
  push:
    branches: [main]
  # Rebuild nightly so quiet periods and cache eviction do not leave PRs cold.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: validator-cache-main
  cancel-in-progress: true

permissions:
  contents: read
  # Needed to verify cache entries through the API.
  actions: read

jobs:
  build-cache:
    name: Build validator disk cache
    runs-on: ubuntu-latest
    steps:
      # Match the prepare-workspace checkout so all validator namespaces warm.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout: /tools/validation/ci_workspace_profile.txt
          sparse-checkout-cone-mode: false

      - name: Materialize validator workspace
        run: >-
          git sparse-checkout set --no-cone --stdin
          < tools/validation/ci_workspace_profile.txt

      # Hash only source and reference inputs, not generated bytecode.
      - name: Compute validator code hash
        id: toolshash
        run: >-
          echo "hash=${{ hashFiles('tools/validation/**/*.py',
          'tools/validation/**/*.txt', 'tools/shared_utils.py',
          'validation_config.json', 'resources/documentation/**',
          '.claude/docs/typo-watchlist.md') }}" >> "$GITHUB_OUTPUT"

      # Restore the newest compatible entry for an incremental rebuild.
      - name: Restore previous validator disk cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .validation_cache
          key: >-
            md-valcache-v1-${{ runner.os }}-${{
            steps.toolshash.outputs.hash }}-${{ github.sha }}
          restore-keys: |
            md-valcache-v1-${{ runner.os }}-${{ steps.toolshash.outputs.hash }}-

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      # Non-strict findings do not block the cache; harness failures do.
      - name: Run cacheable validators (cache warm-up)
        run: >-
          python3 tools/validation/run_all_validators.py --no-color
          --persist-results .validation_baseline_candidate

      - name: Verify validation result candidate completion
        run: test -f .validation_baseline_candidate/.persist-complete

      # The run ID makes each immutable cache key unique on unchanged commits.
      - name: Save validator disk cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .validation_cache
          key: >-
            md-valcache-v1-${{ runner.os }}-${{
            steps.toolshash.outputs.hash }}-${{ github.sha }}-${{
            github.run_id }}

      # Confirm this run's exact key so a failed save cannot leave PRs cold.
      - name: Verify this run's cache entry exists
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_KEY: >-
            md-valcache-v1-${{ runner.os }}-${{
            steps.toolshash.outputs.hash }}-${{ github.sha }}-${{
            github.run_id }}
        run: |
          cache_url="repos/${{ github.repository }}/actions/caches"
          cache_url="${cache_url}?key=$EXPECTED_KEY&per_page=1"
          count=$(gh api "$cache_url" --jq '.total_count')
          if [ "$count" -eq 0 ]; then
            echo "::error::Cache entry ${EXPECTED_KEY} was not saved"
            exit 1
          fi
          echo "Cache entry ${EXPECTED_KEY} confirmed"

      # The alarm compares against the last accepted run of this validator
      # generation; older generations are ignored.
      - name: Restore last accepted validation baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .validation_accepted
          key: >-
            md-accepted-v1-${{ runner.os }}-${{
            steps.toolshash.outputs.hash }}-${{ github.sha }}
          restore-keys: |
            md-accepted-v1-${{ runner.os }}-${{ steps.toolshash.outputs.hash }}-

      - name: Diff against last accepted baseline
        id: diff
        env:
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          TOOLSHASH: ${{ steps.toolshash.outputs.hash }}
        run: |
          workflow_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          workflow_url="$workflow_url/actions/runs/$GITHUB_RUN_ID"
          python3 tools/baseline_check.py \
            --previous .validation_accepted \
            --current .validation_baseline_candidate \
            --output .validation_accepted \
            --observation .validation_baseline \
            --toolshash "$TOOLSHASH" \
            --commit-sha "$COMMIT_SHA" \
            --workflow-run-url "$workflow_url" \
            --github-repository "$REPOSITORY"

      # baseline_check records this commit's results only for a complete run.
      - name: Check for a recorded baseline
        id: recorded
        if: ${{ !cancelled() }}
        run: |
          if [ -f .validation_baseline/baseline-meta.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      # PR reports compare against this commit's results even when the alarm
      # fails.
      - name: Save validation baseline
        if: ${{ !cancelled() && steps.recorded.outputs.found == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .validation_baseline
          key: >-
            md-baseline-v1-${{ runner.os }}-${{
            steps.toolshash.outputs.hash }}-${{ github.sha }}-${{
            github.run_id }}

      - name: Save accepted validation baseline
        if: steps.diff.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .validation_accepted
          key: >-
            md-accepted-v1-${{ runner.os }}-${{
            steps.toolshash.outputs.hash }}-${{ github.sha }}-${{
            github.run_id }}

      # Make a failed save visible instead of leaving PRs without a baseline.
      - name: Verify this run's baseline entries exist
        if: ${{ !cancelled() && steps.recorded.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTED: ${{ steps.diff.outcome == 'success' }}
          KEY_SUFFIX: >-
            ${{ runner.os }}-${{ steps.toolshash.outputs.hash }}-${{
            github.sha }}-${{ github.run_id }}
        run: |
          keys=("md-baseline-v1-$KEY_SUFFIX")
          if [ "$ACCEPTED" = true ]; then
            keys+=("md-accepted-v1-$KEY_SUFFIX")
          fi
          for key in "${keys[@]}"; do
            cache_url="repos/${{ github.repository }}/actions/caches"
            cache_url="${cache_url}?key=$key&per_page=1"
            count=$(gh api "$cache_url" --jq '.total_count')
            if [ "$count" -eq 0 ]; then
              echo "::error::Cache entry ${key} was not saved"
              exit 1
            fi
            echo "Cache entry ${key} confirmed"
          done
