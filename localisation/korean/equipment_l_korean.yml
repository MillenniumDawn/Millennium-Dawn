 USA_attack_helicopter_2: "AH-64 아파치"
 USA_attack_helicopter_2_desc: "보잉 AH-64 아파치는 꼬리 바퀴식 착륙 장치와 승무원 2명을 위한 탠덤 조종석을 갖춘 미국의 쌍발 터보샤프트 공격 헬리콥터입니다. 기수에 표적 획득용 센서군과 야간 투시 장비를 갖추고 있습니다. 주 착륙 장치 사이, 기체 전방 동체 아래에 장착된 30mm(1.18인치) M230 체인건과, 무장 및 적재물을 싣기 위한 짧은 날개 파일런의 하드포인트 4개로 무장하며, 보통 AGM-114 헬파이어 미사일과 하이드라 70 로켓 포드를 혼합하여 탑재합니다. AH-64는 전투 생존성을 높이기 위해 상당한 체계 이중화를 갖추고 있습니다."
 USA_attack_helicopter_2_short: "AH-64 아파치"
 USA_attack_helicopter_3: "AH-64D 아파치 롱보우"
 USA_attack_helicopter_3_desc: "AH-64D 아파치 롱보우는 글래스 조종석과 첨단 센서를 갖추었으며, 그중 가장 눈에 띄는 것은 AN/APG-78 롱보우 밀리미터파 사격통제 레이더(FCR) 표적 획득 체계와 주 로터 위의 돔에 수납된 무선 주파수 간섭계(RFI)입니다. 레이돔이 높은 위치에 있어 헬리콥터가 장애물(예: 지형, 나무, 건물) 뒤에 있는 동안에도 표적을 탐지할 수 있습니다. AN/APG-78은 최대 128개의 표적을 동시에 추적하고 한 번에 최대 16개를 공격할 수 있으며, 30초 이내에 공격을 개시할 수 있습니다. 센서군에 통합된 무선 모뎀 덕분에 지상 부대 및 다른 아파치와 데이터를 공유할 수 있어, 헬리콥터 한 대가 탐지한 표적에 대해 모두가 사격할 수 있습니다."
 USA_attack_helicopter_3_short: "AH-64D 아파치"
 USA_attack_helicopter_4: "AH-64E 아파치 가디언"
 USA_attack_helicopter_4_desc: "한때 AH-64D 블록 III로 불렸으나 2012년에 향상된 능력을 반영하여 AH-64E 가디언으로 재명명되었습니다. AH-64E는 개선된 디지털 연결성, 합동 전술 정보 분배 체계, 더 큰 출력을 수용하도록 기어 변속기를 개량한 더 강력한 T700-GE-701D 엔진, 무인기(UAV) 통제 능력, 완전한 계기비행(IFR) 능력, 개선된 착륙 장치를 갖추고 있습니다."
 USA_attack_helicopter_4_short: "AH-64E 아파치"
 USA_attack_helicopter_5: "AH-66 코만치"
 USA_attack_helicopter_5_desc: "보잉-시코르스키 RAH-66 코만치는 미 육군을 위해 설계된 스텔스 무장 정찰 및 공격 헬리콥터입니다. 수십 년의 개발 끝에 2004년, 양산이 시작되기 직전에 RAH-66 사업은 취소되었으며, 그때까지 이미 약 70억 달러가 사업에 투입된 상태였습니다."
 USA_attack_helicopter_5_short: "AH-66 코만치"
