 corvette_hull_5: "2025년형 초계함 함체"
 corvette_hull_5_desc: "전함으로 분류되는 가장 작은 등급의 선박인 초계함은, 일반적으로 대양을 책임지고 보호할 수 있는 해군 집단인 '대양 해군'에는 포함되지 않습니다. 이 작고 빠른 선박은 대부분 각 종류의 장비들로 무장하고 있고, 그렇기에 다양한 범위의 임무들을 수행할 수 있습니다. 초계함은 다른 함선들과 비교했을 때 가격과 생산비용이 적은 특성 때문에 많은 국가들이 작거나 중간 정도 규모의 해군을 위해 초계함을 사용하고 있습니다. 초계함은 주로 다음과 같은 임무에 사용됩니다 : 해안 방어와 감시, 기뢰 소해, 대잠, 대공 및 대함, 그리고 현대에선, 지상 공격 임무를 수행하기도 합니다."
 corvette_hull_6: "2040년형 초계함 함체"
 corvette_hull_6_desc: "전함으로 분류되는 가장 작은 등급의 선박인 초계함은, 일반적으로 대양을 책임지고 보호할 수 있는 해군 집단인 '대양 해군'에는 포함되지 않습니다. 이 작고 빠른 선박은 대부분 각 종류의 장비들로 무장하고 있고, 그렇기에 다양한 범위의 임무들을 수행할 수 있습니다. 초계함은 다른 함선들과 비교했을 때 가격과 생산비용이 적은 특성 때문에 많은 국가들이 작거나 중간 정도 규모의 해군을 위해 초계함을 사용하고 있습니다. 초계함은 주로 다음과 같은 임무에 사용됩니다 : 해안 방어와 감시, 기뢰 소해, 대잠, 대공 및 대함, 그리고 현대에선, 지상 공격 임무를 수행하기도 합니다."
 frigate_hull_1: "1965년형 호위함 함체"
 frigate_hull_1_desc: "현대의 많은 해군에서 중심을 구성하는 호위함 (프리깃)은 '대양 해군'의 일원으로써 함대전에 참여할 수 있습니다. 이 함선은 초계함 급의 선박과 비교하였을 때 작전 거리가 늘어났으며 더욱 큰 규모의 크기를 자랑합니다. 비록 함대 방어의 역할로써 대부분 사용되고 있지만, 호위함은 함대 내에서 꽤나 광범위한 역할을 수행할 수 있으며, 요구에 따라 더욱 공격적인 성향의 임무를 포함하는 다양한 역할과 상황에 배치될 수 있도록 개조할 수도 있습니다. 호위함은 다음과 같은 임무에 주로 사용됩니다: 함대 방어, 대잠 및 대공 기능, 그리고 해상 호송의 임무까지 수행합니다."
