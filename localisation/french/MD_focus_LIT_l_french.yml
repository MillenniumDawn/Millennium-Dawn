l_french:
 lithuania.1.t: "La question Mažeikių Nafta"
 lithuania.1.d: "La seule raffinerie de pétrole de Lituanie, Mažeikių Nafta, est devenue un point chaud géopolitique. Le géant énergétique polonais PKN Orlen et un consortium russe ont tous deux exprimé leur intérêt pour l'acquérir. La garder dans les mains de l'État reste une option, quoique coûteuse."
 lithuania.1.a: "Vendre à PKN Orlen"
 lithuania.1.b: "Vendre au consortium russe"
 lithuania.1.c: "Gardez-le nationalisé"
 lithuania.2.t: "PKN Orlen acquiert une raffinerie lituanienne"
 lithuania.2.d: "PKN Orlen a achevé l'acquisition de la raffinerie Mažeikių Nafta de Lituanie, étendant les intérêts énergétiques polonais dans la région baltique."
 lithuania.2.a: "Un investissement judicieux."
 lithuania.3.t: "Incendie à la raffinerie de Mažeikiai"
 lithuania.3.d: "Un incendie suspect s'est déclaré à la raffinerie de Mažeikiai. Le timing, peu après la vente à des intérêts russes, a alimenté les spéculations sur un sabotage et soulevé des questions sur la sécurité de l'infrastructure énergétique lituanienne."
 lithuania.3.a: "Pointer du doigt Moscou"
 lithuania.3.b: "Lancez une enquête discrète"
 lithuania.10.t: "L'avenir d'Ignalina"
 lithuania.10.d: "L'Union européenne a exigé que la Lituanie ferme la centrale nucléaire d'Ignalina, qui abrite deux réacteurs RBMK, le même modèle qui a échoué à Tchernobyl. La fermeture est une condition de l'adhésion à l'UE, mais Ignalina fournit l'essentiel de l'électricité lituanienne. Une centrale de remplacement pourrait être construite conjointement avec la Pologne et les États baltes."
 lithuania.10.a: "Négocier un remplacement conjoint avec nos voisins"
 lithuania.10.b: "Gardez Ignalina en marche"
 lithuania.10.c: "La fermer sans remplacement"
 lithuania.11.t: "Proposition lituanienne de coopération nucléaire"
 lithuania.11.d: "La Lituanie a proposé que la Pologne cofinance la construction de la centrale nucléaire de Visaginas pour remplacer l'installation vieillissante d'Ignalina. Le projet renforcerait l'indépendance énergétique balte et approfondirait les liens régionaux, mais exige un investissement important."
 lithuania.11.a: "Accepter de cofinancer le projet"
 lithuania.11.b: "Nous avons d'autres priorités"
 lithuania.12.t: "La Pologne accepte une coopération nucléaire"
 lithuania.12.d: "La Pologne a accepté de cofinancer la centrale nucléaire de Visaginas. La construction peut commencer, bien que le projet prenne des années et exige des ressources substantielles."
 lithuania.12.a: "Commencer la construction"
 lithuania.13.t: "La Pologne refuse la coopération nucléaire"
 lithuania.13.d: "La Pologne a refusé de participer au projet Visaginas. La Lituanie doit désormais décider du sort d'Ignalina seule."
 lithuania.13.a: "Garder Ignalina en service malgré les risques"
 lithuania.13.b: "La fermer. Nous nous en sortirons sans"
 lithuania.14.t: "Référendum sur la centrale nucléaire de Visaginas"
 lithuania.14.d: "Après des années de construction, le projet de centrale nucléaire de Visaginas affronte un référendum national. L'opinion publique est divisée entre ceux qui y voient un impératif de sécurité énergétique et ceux qui s'inquiètent de la sûreté nucléaire et des dépassements de coûts."
 lithuania.14.a: "Le peuple approuve la centrale"
 lithuania.14.b: "Le peuple rejette le projet"
 lithuania.15.t: "L'usine de Visaginas est terminée"
 lithuania.15.d: "La centrale nucléaire conjointe lituano-polonaise de Visaginas est opérationnelle. Le projet représente une étape dans la coopération énergétique balte et l'indépendance régionale vis-à-vis du gaz russe."
 lithuania.15.a: "Un triomphe de la coopération"
 lithuania.16.t: "Pression internationale sur Ignalina"
 lithuania.16.d: "L'Union européenne a émis un avertissement formel sur le maintien en service de la centrale nucléaire d'Ignalina par la Lituanie. Des sanctions et la perte des fonds structurels de l'UE sont sur la table si les réacteurs de type Tchernobyl ne sont pas arrêtés."
 lithuania.16.a: "Nous n'avons pas le choix. L'arrêter"
 lithuania.16.b: "Résister à la pression"
 LIT_refinery_sale_revenue: "Revenus des ventes de raffineries"
 LIT_refinery_sale_revenue_desc: "Les recettes de la vente de Mažeikių Nafta procurent un coup de pouce temporaire au budget national."
 LIT_russian_energy_leverage: "Levier énergétique russe"
 LIT_russian_energy_leverage_desc: "La vente de la seule raffinerie de Lituanie à des intérêts russes a donné à Moscou un levier économique sur la politique énergétique lituanienne."
 LIT_nationalized_refinery: "Raffinerie nationalisée"
 LIT_nationalized_refinery_desc: "La Lituanie a conservé la propriété d'État de Mažeikių Nafta, assurant la sécurité des ressources au prix de l'efficacité opérationnelle."
 LIT_energy_deficit: "Déficit énergétique"
 LIT_energy_deficit_desc: "La fermeture de la centrale nucléaire d'Ignalina sans remplacement a laissé la Lituanie dépendante d'importations énergétiques coûteuses."
 LIT_visaginas_nuclear_plant: "Centrale nucléaire de Visaginas"
 LIT_visaginas_nuclear_plant_desc: "La nouvelle centrale de Visaginas fournit une énergie propre et fiable et symbolise la coopération régionale balte."
 lithuania_news.1.t: "Mažeikių Nafta Vendu"
 lithuania_news.1.d_poland: "La Lituanie a vendu sa seule raffinerie de pétrole, Mažeikių Nafta, au géant énergétique polonais PKN Orlen. L'accord approfondit les liens économiques balto-polonais et est vu à Bruxelles comme un pas vers la réduction de la dépendance énergétique régionale vis-à-vis de la Russie."
 lithuania_news.1.d_russia: "La Lituanie a vendu sa seule raffinerie de pétrole, Mažeikių Nafta, à un consortium soutenu par la Russie. Les critiques avertissent que l'accord donne à Moscou un levier stratégique sur l'infrastructure énergétique lituanienne."
 lithuania_news.1.a: "Une pierre angulaire de notre avenir énergétique"
 lithuania_news.1.b: "Une expansion bienvenue sur le marché balte"
 lithuania_news.1.c: "Un nouveau pas en avant dans la région"
 lithuania_news.1.d: "La sécurité énergétique dans les pays baltes bascule"
 lithuania_news.1.e: "Une note de bas de page dans la politique énergétique européenne."
 lithuania_news.2.t: "Fermeture de la centrale nucléaire d'Ignalina"
 lithuania_news.2.d: "La Lituanie a arrêté la centrale nucléaire d'Ignalina, déclassant le dernier de ses réacteurs RBMK de l'ère soviétique. La fermeture remplit une exigence clé d'adhésion à l'UE mais laisse le pays dépendant des importations énergétiques jusqu'à ce qu'une source de remplacement soit trouvée."
 lithuania_news.2.a: "Les lumières resteront allumées, d'une manière ou d'une autre"
 lithuania_news.2.b: "Une victoire pour la sûreté nucléaire en Europe"
 lithuania_news.2.c: "Un réacteur de moins dans le monde"
 lithuania_news.3.t: "La centrale nucléaire de Visaginas est achevée"
 lithuania_news.3.desc: "La nouvelle centrale nucléaire de Visaginas de Lituanie est entrée en service, construite avec un cofinancement polonais. L'installation rétablit l'autosuffisance énergétique du pays et marque une réalisation majeure de la coopération régionale balte."
 lithuania_news.3.a: "L'indépendance énergétique, enfin."
 lithuania_news.3.b: "Notre investissement dans la région porte ses fruits"
 lithuania_news.3.c: "Un nouveau chapitre pour la politique énergétique balte"
 lithuania_news.3.d: "Les pays baltes sécurisent leur avenir énergétique"