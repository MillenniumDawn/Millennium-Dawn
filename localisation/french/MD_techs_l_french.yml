 frigate_hull_7: "Coque de frégate 2055"
 frigate_hull_7_desc: "Formant le cœur de nombreuses marines modernes, les frégates peuvent s'intégrer à des forces navales de « haute mer ». Elles ont une portée étendue et sont plus grandes que la classe corvette. Bien que le plus souvent utilisées comme plate-forme de défense de flotte, elles peuvent remplir un éventail assez large de rôles au sein d'une flotte et être adaptées à de nombreuses missions et situations (y compris des tâches plus offensives). Elles servent typiquement à : défense de flotte, lutte anti-sous-marine, anti-aérienne et escorte de convois maritimes."
 frigate_hull_8: "Coque de frégate 2070"
 frigate_hull_8_desc: "Formant le cœur de nombreuses marines modernes, les frégates peuvent s'intégrer à des forces navales de « haute mer ». Elles ont une portée étendue et sont plus grandes que la classe corvette. Bien que le plus souvent utilisées comme plate-forme de défense de flotte, elles peuvent remplir un éventail assez large de rôles au sein d'une flotte et être adaptées à de nombreuses missions et situations (y compris des tâches plus offensives). Elles servent typiquement à : défense de flotte, lutte anti-sous-marine, anti-aérienne et escorte de convois maritimes."
 destroyer_hull_6: "Coque du destroyer 2060"
 destroyer_hull_6_desc: "Destinés à escorter de plus grands bâtiments dans une flotte, un convoi ou un groupe de combat, ces navires de guerre rapides, manœuvrants et à grande endurance sont également capables d'opérer de façon indépendante. Les itérations ultérieures, portant un arsenal large et mortel de missiles guidés, missiles de croisière et autres armes, sont de véritables bâtiments multimissions. Plus lourds en tonnage, plus offensifs et plus meurtriers en puissance de feu qu'une frégate ou une corvette. Ils servent typiquement à : défense de flotte, tâches offensives, anti-aérien, antinavire, anti-sous-marin, ainsi que frappe terrestre, selon l'emport."
 destroyer_hull_7: "Coque du destroyer 2075"
 destroyer_hull_7_desc: "Destinés à escorter de plus grands bâtiments dans une flotte, un convoi ou un groupe de combat, ces navires de guerre rapides, manœuvrants et à grande endurance sont également capables d'opérer de façon indépendante. Les itérations ultérieures, portant un arsenal large et mortel de missiles guidés, missiles de croisière et autres armes, sont de véritables bâtiments multimissions. Plus lourds en tonnage, plus offensifs et plus meurtriers en puissance de feu qu'une frégate ou une corvette. Ils servent typiquement à : défense de flotte, tâches offensives, anti-aérien, antinavire, anti-sous-marin, ainsi que frappe terrestre, selon l'emport."
 stealth_destroyer_hull_4: "Coque du destroyer furtif 2060"
 stealth_destroyer_hull_4_desc: "Les évolutions de la technologie militaire moderne ont poussé les flottes les plus avancées à chercher de nouvelles réponses pour la survivabilité. Les destroyers furtifs sont devenus un axe prééminent. Rester cachés des capteurs et radars ennemis avancés permet à ces armes puissantes de frapper plus près, plus vite et avec une létalité accrue, avec en prime une meilleure survivabilité dans les conflits modernes."
 stealth_destroyer_hull_5: "Coque du destroyer furtif 2075"
 stealth_destroyer_hull_5_desc: "Les évolutions de la technologie militaire moderne ont poussé les flottes les plus avancées à chercher de nouvelles réponses pour la survivabilité. Les destroyers furtifs sont devenus un axe prééminent. Rester cachés des capteurs et radars ennemis avancés permet à ces armes puissantes de frapper plus près, plus vite et avec une létalité accrue, avec en prime une meilleure survivabilité dans les conflits modernes."
 stealth_destroyer_4: "Destructeur furtif 2060"
 stealth_destroyer_4_desc: "Les évolutions de la technologie militaire moderne ont poussé les flottes les plus avancées à chercher de nouvelles réponses pour la survivabilité. Les destroyers furtifs sont devenus un axe prééminent. Rester cachés des capteurs et radars ennemis avancés permet à ces armes puissantes de frapper plus près, plus vite et avec une létalité accrue, avec en prime une meilleure survivabilité dans les conflits modernes."
 stealth_destroyer_5: "Destructeur furtif 2075"
 stealth_destroyer_5_desc: "Les évolutions de la technologie militaire moderne ont poussé les flottes les plus avancées à chercher de nouvelles réponses pour la survivabilité. Les destroyers furtifs sont devenus un axe prééminent. Rester cachés des capteurs et radars ennemis avancés permet à ces armes puissantes de frapper plus près, plus vite et avec une létalité accrue, avec en prime une meilleure survivabilité dans les conflits modernes."
 cruiser_hull_6: "Coque du croiseur 2060"
 cruiser_hull_6_desc: "Typiquement les plus grands navires d'assaut d'une flotte moderne (hors porte-avions et navires d'assaut amphibie), ces atouts puissants peuvent couvrir tous les océans et mers du globe. Historiquement tournés vers la défense aérienne (tandis que les destroyers étaient chargés de la guerre de surface), les croiseurs modernes disposent d'un arsenal extraordinaire — supérieur à tout autre navire de combat. Les croiseurs peuvent servir de base à tout un groupe de combat, avec une grande capacité de capteurs et de systèmes de gestion de combat. Ils servent typiquement à : commandement et contrôle, anti-aérien, antinavire et frappe terrestre."
 cruiser_hull_7: "Coque du croiseur 2075"
 cruiser_hull_7_desc: "Typiquement les plus grands navires d'assaut d'une flotte moderne (hors porte-avions et navires d'assaut amphibie), ces atouts puissants peuvent couvrir tous les océans et mers du globe. Historiquement tournés vers la défense aérienne (tandis que les destroyers étaient chargés de la guerre de surface), les croiseurs modernes disposent d'un arsenal extraordinaire — supérieur à tout autre navire de combat. Les croiseurs peuvent servir de base à tout un groupe de combat, avec une grande capacité de capteurs et de systèmes de gestion de combat. Ils servent typiquement à : commandement et contrôle, anti-aérien, antinavire et frappe terrestre."
 battle_cruiser_hull_5: "Coque du croiseur de bataille 2060"
 battle_cruiser_hull_5_desc: "Les navires de surface sont le composant principal de la flotte et assurent toutes les fonctions maritimes de la flotte traditionnelle."
 battle_cruiser_hull_6: "Coque du croiseur de bataille 2075"
 battle_cruiser_hull_6_desc: "Les navires de surface sont le composant principal de la flotte et assurent toutes les fonctions maritimes de la flotte traditionnelle."
 battleship_hull_5: "Coque de cuirassé 2060"
 battleship_hull_5_desc: "Les navires de surface sont le composant principal de la flotte et assurent toutes les fonctions maritimes de la flotte traditionnelle."
 battleship_hull_6: "Coque de cuirassé 2075"
 battleship_hull_6_desc: "Les navires de surface sont le composant principal de la flotte et assurent toutes les fonctions maritimes de la flotte traditionnelle."
 aircraft_heli_engineering_4: "Hangars automatisés pour hélicoptères"
 aircraft_heli_engineering_4_desc: "Rééquiper nos porte-avions actuels de formes plus efficaces de déploiement et de stockage d'hélicoptères peut améliorer notre capacité à contester les sous-marins."
 helicopter_operator_hull_5: "Coque d'opérateur d'hélicoptère 2060"
 helicopter_operator_hull_5_desc: "Un porte-hélicoptères est un porte-aéronefs principalement destiné à emporter des hélicoptères, mais il est aussi souvent classé comme navire d'assaut amphibie ou porte-aéronefs anti-sous-marin. Il sert surtout à des missions d'aviation militaire : lutte anti-sous-marine, opérations amphibies et appui aérien rapproché. Certains navires d'assaut amphibie ont des bassins conçus pour emporter des chalands de débarquement, et remplissent la fonction de bâtiments de débarquement de chalands. Certains sont conçus pour emporter des aéronefs à voilure fixe à décollage et atterrissage verticaux afin de fournir un appui aérien rapproché plus puissant que les hélicoptères d'attaque, et remplissent la fonction de porte-aéronefs légers."
 helicopter_operator_hull_6: "2075 Opérateur d'hélicoptère Coque"
 helicopter_operator_hull_6_desc: "Un porte-hélicoptères est un porte-aéronefs principalement destiné à emporter des hélicoptères, mais il est aussi souvent classé comme navire d'assaut amphibie ou porte-aéronefs anti-sous-marin. Il sert surtout à des missions d'aviation militaire : lutte anti-sous-marine, opérations amphibies et appui aérien rapproché. Certains navires d'assaut amphibie ont des bassins conçus pour emporter des chalands de débarquement, et remplissent la fonction de bâtiments de débarquement de chalands. Certains sont conçus pour emporter des aéronefs à voilure fixe à décollage et atterrissage verticaux afin de fournir un appui aérien rapproché plus puissant que les hélicoptères d'attaque, et remplissent la fonction de porte-aéronefs légers."
 aircraft_carrier_engineering_2: "Révision du système du porte-avions"
 aircraft_carrier_engineering_2_desc: "Les progrès de la technologie navale mènent enfin à une refonte complète de la façon dont les porte-avions opèrent et sont conçus."
 carrier_hull_6: "Coque de porte-avions 2060"
 carrier_hull_6_desc: "Ces bases aériennes flottantes sont le pinacle de la puissance navale, capables de s'avancer sur les océans du monde pour projeter la puissance d'une nation à l'échelle du globe. Signes du sang et du trésor d'une nation forte, ces atouts extraordinairement précieux doivent être protégés à tout prix. Avec une vaste portée, ils exigent un véritable groupe de combat de « haute mer » pour déployer toute la gamme de leurs capacités en mer. Tout pays alignant un groupe aéronaval pleinement opérationnel peut être vraiment fier de ce que sa marine représente, et de la puissance terrifiante qu'elle brandit. Ils servent typiquement à : projection de puissance au loin, guerre aérienne, guerre de surface, guerre amphibie."
 carrier_hull_7: "Coque de porte-avions 2075"
 carrier_hull_7_desc: "Ces bases aériennes flottantes sont le pinacle de la puissance navale, capables de s'avancer sur les océans du monde pour projeter la puissance d'une nation à l'échelle du globe. Signes du sang et du trésor d'une nation forte, ces atouts extraordinairement précieux doivent être protégés à tout prix. Avec une vaste portée, ils exigent un véritable groupe de combat de « haute mer » pour déployer toute la gamme de leurs capacités en mer. Tout pays alignant un groupe aéronaval pleinement opérationnel peut être vraiment fier de ce que sa marine représente, et de la puissance terrifiante qu'elle brandit. Ils servent typiquement à : projection de puissance au loin, guerre aérienne, guerre de surface, guerre amphibie."
 tech_submarine_engineering_6: "Moteur sous-marin de pointe"
 tech_submarine_engineering_6_desc: "Le progrès des nouvelles technologies peut permettre aux sous-marins d'opérer sous l'eau à plus grande distance, à plus haute vitesse et à plus faible bruit."
 tech_submarine_engineering_7: "Moteur de sous-marin hyper-avancé"
 tech_submarine_engineering_7_desc: "L'immense progrès des nouvelles technologies peut permettre aux sous-marins d'opérer sous l'eau à plus grande distance, à plus haute vitesse et à plus faible bruit."
 attack_submarine_hull_7: "Coque de sous-marin d'attaque 2055"
 attack_submarine_hull_7_desc: "Les tueurs silencieux des océans du monde, ces plates-formes de guerre sous-marine intègrent un éventail de capacités utiles, dont la furtivité, le renseignement et des systèmes d'armes. Conçus pour un large spectre de missions hauturières et littorales, ces spécialistes du déni d'accès sont une pierre angulaire de toute marine. Les sous-marins d'attaque sont des combinaisons missile-sous-marin conçues pour frapper des cibles distantes outre-mer."
 attack_submarine_hull_8: "Coque de sous-marin d'attaque 2070"
 attack_submarine_hull_8_desc: "Les tueurs silencieux des océans du monde, ces plates-formes de guerre sous-marine intègrent un éventail de capacités utiles, dont la furtivité, le renseignement et des systèmes d'armes. Conçus pour un large spectre de missions hauturières et littorales, ces spécialistes du déni d'accès sont une pierre angulaire de toute marine. Les sous-marins d'attaque sont des combinaisons missile-sous-marin conçues pour frapper des cibles distantes outre-mer."
 missile_submarine_hull_7: "Coque de sous-marin lance-missiles 2055"
 missile_submarine_hull_7_desc: "Les tueurs silencieux des océans du monde, ces plates-formes de guerre sous-marine intègrent un éventail de capacités utiles, dont la furtivité, le renseignement et des systèmes d'armes. Conçus pour un large spectre de missions hauturières et littorales, ces spécialistes du déni d'accès sont une pierre angulaire de toute marine. "
 missile_submarine_hull_8: "Coque de sous-marin lance-missiles 2070"
 missile_submarine_hull_8_desc: "Les tueurs silencieux des océans du monde, ces plates-formes de guerre sous-marine intègrent un éventail de capacités utiles, dont la furtivité, le renseignement et des systèmes d'armes. Conçus pour un large spectre de missions hauturières et littorales, ces spécialistes du déni d'accès sont une pierre angulaire de toute marine. "
 patrol_boat_hull_4: "2055 Bateau de patrouille"
 patrol_boat_hull_4_desc: "Les patrouilleurs sont des bâtiments légers destinés à la couverture côtière. Ils sont plus petits que leur homologue la corvette et sont également capables d'opérations fluviales."
 patrol_boat_hull_5: "Bateau de patrouille 2080"
 patrol_boat_hull_5_desc: "Les patrouilleurs sont des bâtiments légers destinés à la couverture côtière. Ils sont plus petits que leur homologue la corvette et sont également capables d'opérations fluviales."
 module_helipads_4: "Héliports IV"
 module_helipads_4_desc: "Les installations aéronautiques hyperavancées offrent ponts de vol optimisés, systèmes de soutien et intégration de commandement, permettant l'exploitation efficace de plusieurs hélicoptères modernes pour la surveillance, la lutte anti-sous-marine et la projection de force.\n\n§GIndice du concepteur : les hélisurfaces améliorent la détection de sous-marins, la lutte anti-sous-marine, la détection de surface et le dragage de mines tout en ajoutant de la puissance de santé. Conviennent aux escortes ASM et patrouilleurs, mais augmentent le coût de production, le carburant, la main-d'œuvre et la visibilité de surface.§!\n§GIndice concepteur : les hélipads améliorent la détection sous-marine, la lutte anti-sous-marine, la détection de surface et le dragage de mines tout en ajoutant des points de vie. Ils conviennent aux escortes ASM et aux patrouilleurs, mais augmentent le coût de production, la consommation de carburant, les effectifs et la visibilité de surface.§!"
