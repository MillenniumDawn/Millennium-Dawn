 CHI_local_debt_pressure_gt_19_tt: "지방 정부 부채 압력이 §Y20 이상§!임"
 CHI_water_shortage_2: "$CHI_water_shortage$"
 CHI_water_shortage_2_desc: "화북평원, 황허 유역, 베이징-톈진-허베이 회랑은 합쳐서 국토 경작지의 약 절반을 차지하지만 담수 자원은 5분의 1에도 미치지 못합니다. 북부의 1인당 수자원량은 연간 1,000세제곱미터라는 국제적 물 부족 기준선을 한참 밑돕니다. 산업 폐수와 농업 유출수가 이용 가능한 지표수와 지하수의 상당 부분을 오염시켜 물리적 부족을 더욱 악화시키고 있습니다. 농업이 전체 물 소비의 60퍼센트 이상을 차지하며, 에너지 부문의 냉각 수요가 이미 고갈된 수자원 기반에 부담을 더하고 있습니다.\n§W--------------§!\n§Y$CHI_water_security_initiative$§! 중점으로 잠금 해제되는 §Y$CHI_water_shortage_category$§! 결정 범주의 프로젝트와 §Y$CHI_megaprojects$§! 범주의 남수북조 노선을 완료하면 수자원 보전 진척도가 상승합니다. 이 국가 정신은 완료된 프로젝트가 §Y9§!개가 되면 §G개선§!됩니다."
 CHI_water_shortage_3: "$CHI_water_shortage$"
 CHI_water_shortage_3_desc: "화북평원, 황허 유역, 베이징-톈진-허베이 회랑은 합쳐서 국토 경작지의 약 절반을 차지하지만 담수 자원은 5분의 1에도 미치지 못합니다. 북부의 1인당 수자원량은 연간 1,000세제곱미터라는 국제적 물 부족 기준선을 한참 밑돕니다. 산업 폐수와 농업 유출수가 이용 가능한 지표수와 지하수의 상당 부분을 오염시켜 물리적 부족을 더욱 악화시키고 있습니다. 농업이 전체 물 소비의 60퍼센트 이상을 차지하며, 에너지 부문의 냉각 수요가 이미 고갈된 수자원 기반에 부담을 더하고 있습니다.\n§W--------------§!\n§Y$CHI_water_security_initiative$§! 중점으로 잠금 해제되는 §Y$CHI_water_shortage_category$§! 결정 범주의 프로젝트와 §Y$CHI_megaprojects$§! 범주의 남수북조 노선을 완료하면 수자원 보전 진척도가 상승합니다. 이 국가 정신은 완료된 프로젝트가 §Y13§!개가 되면 §G개선§!됩니다."
 CHI_water_shortage_4: "$CHI_water_shortage$"
 CHI_water_shortage_4_desc: "화북평원, 황허 유역, 베이징-톈진-허베이 회랑은 합쳐서 국토 경작지의 약 절반을 차지하지만 담수 자원은 5분의 1에도 미치지 못합니다. 북부의 1인당 수자원량은 연간 1,000세제곱미터라는 국제적 물 부족 기준선을 한참 밑돕니다. 산업 폐수와 농업 유출수가 이용 가능한 지표수와 지하수의 상당 부분을 오염시켜 물리적 부족을 더욱 악화시키고 있습니다. 농업이 전체 물 소비의 60퍼센트 이상을 차지하며, 에너지 부문의 냉각 수요가 이미 고갈된 수자원 기반에 부담을 더하고 있습니다.\n§W--------------§!\n§Y$CHI_water_security_initiative$§! 중점으로 잠금 해제되는 §Y$CHI_water_shortage_category$§! 결정 범주의 프로젝트와 §Y$CHI_megaprojects$§! 범주의 남수북조 노선을 완료하면 수자원 보전 진척도가 상승합니다. 이 국가 정신은 완료된 프로젝트가 §Y17§!개가 되면 §R제거§!됩니다."
 CHI_local_debt_category: "지방정부 부채"
 CHI_local_debt_category_desc: "지방 융자 플랫폼은 간부 평가에서 높은 점수를 주는 공장, 사무 단지, 기반시설의 자금을 마련하기 위해 미래의 토지 매각 수입을 담보로 차입합니다. 그 청구서는 베이징의 장부에 오르지 않다가, 결국 오르게 됩니다.\n\n§Y부채 압박§!: [?CHI_local_debt_pressure|0] / 100\n§Y재정 허용치§!: §Y$industrial_complex$§! 및 §Y$offices$§! 지원 한도: [?CHI_local_debt_tolerance|0]\n§Y현재§!: §Y$industrial_complex$§! [?industrial_complex_total|0]개 및 §Y$offices$§! [?office_park_total|0]개. 합계: [?CHI_local_debt_buildings|0]\n\n§Y변동 방식§!\n매월 재정 허용치가 §G+0.25§! 상승합니다. 건물 합계가 이를 초과하면 초과한 건물 하나당 부채 압박이 §R+1§! 상승합니다. 초과하지 않으면 압박이 §G-0.5§! 하락합니다.\n\n§G임계값§!\n압박 수준에 따라 §Y$CHI_local_government_debt$§!의 단계가 결정됩니다.\n§G20§!: 금리 및 소비재 페널티.\n§G45§!: 투자 수익률 및 안정도 페널티 추가.\n§G70§!: 건설 속도 및 공장 생산성 페널티 추가.\n§G90§!: 모든 페널티가 최고조에 달하고 정치력이 타격을 받습니다.\n임계값 아래로 내려가면 단계가 다시 완화됩니다.\n\n§G낮추는 방법§!\n산업 중점은 부채 압박을 높입니다. §Y$CHI_property_tax_pilot_program$§! 및 §Y$CHI_cadre_evaluation_reform$§!과 같은 재정 개혁 중점은 재정 허용치를 높이거나 압박을 직접 줄입니다. 아래의 §Y$CHI_provincial_debt_swap$§!은 GDP의 §R2%§!를 들여 1년에 한 번 압박을 §G15§! 줄입니다.\n\n§G종식시키는 방법§!\n부채 압박이 §Y1§! 아래로 떨어지면 §Y$CHI_local_debt_resolution_mission$§! 임무가 시작됩니다. 이 상태를 §Y5년§! 동안 유지하면 지방 부채 체계가 영구히 폐지됩니다. 압박이 다시 1 이상으로 올라가면 임무가 취소되며, 압박이 다시 떨어지면 재시작됩니다."
 CHI_provincial_debt_swap: "성급 부채 스와프"
 CHI_provincial_debt_swap_desc: "중앙정부는 성들이 융자 플랫폼 대출을 만기가 더 긴 채권으로 차환하도록 허용하여 부담의 일부를 국가 예산으로 흡수합니다. 이 스와프는 당장의 부채 압박을 덜어 주지만, 그 압박을 낳은 성장 모델은 전혀 바꾸지 못합니다."
 CHI_local_debt_resolution_mission: "예산 연성 제약 해소"
 CHI_local_debt_resolution_mission_desc: "지방 부채 압박이 0이 되면 베이징은 융자 플랫폼 모델을 관리하는 대신 해체할 수 있습니다. 성들은 공식 채권 한도를 통해서만 차입하고, 토지 수입은 더 이상 은행 대출의 담보로 잡히지 않으며, 간부 평가는 건설 자체를 더 이상 높게 평가하지 않습니다. 부채 압박이 5년간 1 아래로 유지되면 지방 부채 체계는 영구히 폐지됩니다. 다시 상승하면 임무가 취소되며, 압박이 1 아래로 되돌아오면 재시작됩니다."
 CHI_local_debt_resolved_tt: "§Y지방정부 부채§! 체계가 §G영구히 폐지§!됩니다. 부채 압박과 재정 허용치는 더 이상 변하지 않으며 결정 범주는 제거됩니다."
 CHI_semiconductor_backwardness_2: "$CHI_semiconductor_backwardness_1$"
 CHI_semiconductor_backwardness_2_desc: "중국의 반도체 산업은 여전히 외국 파운드리, 설계 소프트웨어, 제조 장비에 구조적으로 의존하고 있습니다. 국내 팹은 최첨단보다 두세 세대 뒤처져 있고, 설계 기업들은 성숙한 EDA 툴체인을 갖추지 못했으며, 첨단 리소그래피를 공급할 수 있는 국내 장비 기업도 없습니다. 이 격차는 국내 칩 공장 건설과 파운드리 생산을 저해하며, 민간 전자제품과 군용 전자장비 공급망 모두를 제약합니다.\n§W--------------§!\n이 국가 정신은 §Y$CHI_domestic_eda$§! 중점을 완료하면 §G개선§!됩니다."
 CHI_semiconductor_backwardness_3: "$CHI_semiconductor_backwardness_1$"
 CHI_semiconductor_backwardness_3_desc: "중국의 반도체 산업은 여전히 외국 파운드리, 설계 소프트웨어, 제조 장비에 구조적으로 의존하고 있습니다. 국내 팹은 최첨단보다 두세 세대 뒤처져 있고, 설계 기업들은 성숙한 EDA 툴체인을 갖추지 못했으며, 첨단 리소그래피를 공급할 수 있는 국내 장비 기업도 없습니다. 이 격차는 국내 칩 공장 건설과 파운드리 생산을 저해하며, 민간 전자제품과 군용 전자장비 공급망 모두를 제약합니다.\n§W--------------§!\n이 국가 정신은 §Y$CHI_big_fund_phase2$§! 중점을 완료하면 §G개선§!됩니다."
 CHI_semiconductor_backwardness_4: "$CHI_semiconductor_backwardness_1$"
 CHI_semiconductor_backwardness_4_desc: "중국의 반도체 산업은 여전히 외국 파운드리, 설계 소프트웨어, 제조 장비에 구조적으로 의존하고 있습니다. 국내 팹은 최첨단보다 두세 세대 뒤처져 있고, 설계 기업들은 성숙한 EDA 툴체인을 갖추지 못했으며, 첨단 리소그래피를 공급할 수 있는 국내 장비 기업도 없습니다. 이 격차는 국내 칩 공장 건설과 파운드리 생산을 저해하며, 민간 전자제품과 군용 전자장비 공급망 모두를 제약합니다.\n§W--------------§!\n이 국가 정신은 §Y$CHI_mature_node_counter_offensive$§! 또는 §Y$CHI_sicarrier_euv$§! 중점을 완료하면 §R제거§!됩니다."
 CHI_AST_pacific_deterrence: "태평양 억지력 강화"
 CHI_AST_pacific_deterrence_desc: "남태평양에 대한 중국의 기지 확보 압박은 오스트레일리아 해군의 작전 범위를 시급히 확장하도록 강요했습니다. 새로운 센서와 더 예리한 정보, 준비된 상륙 전력이 대기하고 있습니다."
 CHI_political_events.53.a: "유념한다."
 CHI_political_events.53.d: "투르키스탄 이슬람당으로 알려진 위구르 지하디스트 단체가 이전 명칭으로 돌아가 동투르키스탄 이슬람당이라는 이름으로 성명을 내기 시작했습니다. 이 변화는 신장에 대한 분리주의적 주장의 재강조를 시사하며, 이 단체의 전투원들은 여전히 아프가니스탄과 시리아에 기반을 두고 있습니다."
 CHI_political_events.53.t: "원래 이름으로 돌아간 투르키스탄 이슬람당"
 CHI_outer_mongolia_return: "외몽골의 귀환"
 CHI_outer_mongolia_return_desc: "거의 백 년 만에 할하 초원이 다시 우리의 통제 아래 놓였습니다. 고비 사막의 남북에 걸친 몽골 초원이 마침내 하나의 깃발 아래 서게 될 것입니다. 이는 중화민족의 위대한 부흥을 보여 주는 중대한 상징입니다. 이 유서 깊은 땅은 우리 손에서 새로운 영광을 얻을 것입니다."
 bri_defaulted: "§Y일대일로§! 대출을 불이행했다"
 bri_pipeline_busy: "§Y일대일로§! 신청이 검토 중이다"
