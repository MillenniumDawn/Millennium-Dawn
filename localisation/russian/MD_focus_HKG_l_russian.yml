l_russian:
 hong_kong_focus: "Ветка фокусов Гонконга"
 HKG_divided_hong_kong: "Разделённый Гонконг"
 HKG_divided_hong_kong_desc: "Последние годы британского правления в Гонконге оставили после себя наследие плюралистической демократии. Однако они также породили бесконечные споры между сторонниками истеблишмента, демократов и локалистами, снижая эффективность управления на каждом шагу. Люди начинают задаваться вопросом, действительно ли эта хаотичная «демократия» так хороша, как её представляют."
 HKG_support_pro_beijing_camp: "Поддержите пропекинский лагерь"
 HKG_support_pro_beijing_camp_desc: "«Свобода важна. Но в нашей социальной культуре свобода не так важна, как стабильность». Сейчас настало время, чтобы мир стал свидетелем более стабильного и безопасного Гонконга."
 HKG_railway_development_strategy_2000: "Стратегия развития железнодорожного транспорта 2000 года"
 HKG_railway_development_strategy_2000_desc: "Растущее население и увеличение трансграничной торговли приводят к транспортному коллапсу в Гонконге. Стратегия развития железных дорог до 2000 года будет определять направление расширения системы метрополитена в течение следующего десятилетия, переводя пассажирские и грузовые перевозки с автомобильных дорог на железнодорожный транспорт."
 HKG_sign_CEPA: "Подпишите Соглашение о всеобщем экономическом партнерстве (CEPA)."
 HKG_sign_CEPA_desc: "Соглашение о более тесном экономическом партнерстве формализует преференциальный доступ для торговли между Гонконгом и материковым Китаем. Это благоприятно сказывается на трансграничной торговле и приближает к экономической взаимозависимости."
 HKG_approve_funding_for_XRL: "Утвердить финансирование проекта XRL"
 HKG_approve_funding_for_XRL_desc: "Скоростная железнодорожная линия Express Rail Link напрямую соединит Гонконг с высокоскоростной железнодорожной сетью материкового Китая. Финансирование масштабное, а политический символизм ещё более впечатляющий."
 HKG_co_location_bill: "Законопроект о размещении оборудования"
 HKG_co_location_bill_desc: "Спорный законопроект, передающий юрисдикцию правоохранительных органов материкового Китая на терминале скоростного поезда XRL в Западном Коулуне. Сторонники Пекина называют его прагматичным, а пан-демократы — нарушением конституции."
 HKG_electoral_reform: "Избирательная реформа"
 HKG_electoral_reform_desc: "Основной закон предписывает порядок избрания главы исполнительной власти на первые два срока и членов Законодательного совета на первые три срока, но ничего не говорит о выборах после этого. Это наш шанс добиться реформы избирательной системы и приблизиться к подлинному всеобщему избирательному праву."
 HKG_a_broader_electorate: "Более широкий электорат?"
 HKG_a_broader_electorate_desc: "Внедрение всеобщего избирательного права в Гонконге невозможно в одночасье. В качестве промежуточного шага мы можем обратиться в Постоянный совет Всекитайского собрания народных представителей с просьбой расширить состав Избирательной комиссии, сделав выборы более демократичными, не прибегая к прямому введению полного избирательного права."
 HKG_choose_your_own_puppet: "\"Выберите свою куклу\""
 HKG_choose_your_own_puppet_desc: "Всеобщее избирательное право в Гонконге должно быть достигнуто, но не ценой стабильности. Комитет по отбору кандидатов обеспечит, чтобы баллотироваться на пост главы исполнительной власти могли только те, кто действительно «патриотически настроен по отношению к Китаю и Гонконгу»."
 HKG_a_new_reform_attempt: "Новая попытка реформ"
 HKG_a_new_reform_attempt_desc: "Законодательному совету вновь предлагается рассмотреть вопрос о реформе избирательной системы. Удастся ли на этот раз принять решение, или история повторится?"
 HKG_support_pan_democrats: "Поддержите пан-демократов!"
 HKG_support_pan_democrats_desc: "Демократия и свобода уже вплетены в ткань жизни Гонконга, и Дэн Сяопин пообещал не вмешиваться в его внутренние дела. Мы должны активно участвовать в демократическом движении и защищать свободы, которые лежат в основе процветания Гонконга."
 HKG_keep_to_one_country_two_systems: "Придерживаться принципа «Одна страна — две системы»"
 HKG_keep_to_one_country_two_systems_desc: "«Одна страна, две системы» работает гладко. Материковый Китай использует Гонконг в качестве краеугольного камня своей политики открытости, тогда как Гонконг полагается на гарантию «пятьдесят лет без изменений» для сохранения образа жизни, отличающего его от остальной части Китая. Эта договорённость выгодна обеим сторонам, и, безусловно, в наших общих интересах сохранить её в неизменном виде."
 HKG_hong_kong_post_2047_status: "Статус Гонконга после 2047 года"
 HKG_hong_kong_post_2047_status_desc: "Дэн Сяопин обещал, что политическая и экономическая система Гонконга останется неизменной в течение пятидесяти лет, но никто не может сказать, как будет выглядеть город после 2047 года. Пришло время задуматься о его будущем."
 HKG_stick_to_CPC_line: "Придерживайтесь линии КПК."
 HKG_stick_to_CPC_line_desc: "Гонконг будет молчаливо придерживаться предпочтительной для Пекина линии по спорным вопросам. Пандемократы будут в ярости, а патриотический лагерь — в восторге."
 HKG_loyal_puppet: "«Верная марионетка»"
 HKG_loyal_puppet_desc: "Пандемократы раскрыли свои карты, и улицы выразили свой гнев. Для обеспечения стабильности и процветания Гонконгу необходимо открыто и без извинений следовать намеченному Пекином пути. Переход к полностью интегрированному специальному административному району не будет популярным, но он будет окончательным."
 HKG_promote_patriotism: "Пропаганда патриотизма"
 HKG_promote_patriotism_desc: "Поколению, воспитанному на колониальных учебниках и сентиментальности кантопопа, нельзя доверять защиту родины. Образование в области национальной безопасности будет внедрено в каждый класс, на каждое рабочее место, в каждую телекомпанию. Верность партии – это верность Гонконгу."
 HKG_patriots_governing: "Патриоты, управляющие Гонконгом"
 HKG_patriots_governing_desc: "Государственная служба слишком долго подчинялась колониальным привычкам и скрытым симпатиям. Проверочные комиссии очистят бюрократию от районных чиновников до старших администраторов, заменив нерешительных на проверенных патриотов. В краткосрочной перспективе пострадает производительность, но надежность останется на прежнем уровне."
 HKG_suppress_cantonese_local_culture: "Подавить местную кантонскую культуру"
 HKG_suppress_cantonese_local_culture_desc: "Гонконг — китайский город, а китайский означает мандаринский диалект. Кантонское вещание будет ограничено, местные фестивали, посвященные самобытности, будут тихо лишены финансирования, а голоса несогласных в культурной сфере будут заблокированы. Цена за это — беспорядки на улицах и недовольство в семье, но единая национальная культура стоит этих затрат."
 HKG_reduce_size_of_LegCo: "Сократить численность Законодательного совета."
 HKG_reduce_size_of_LegCo_desc: "Законодательный совет разросся за счет мест на уровне округов, которые служат лишь площадками для показухи оппозиции. Упрощенная палата, с сокращением числа мест, избираемых прямым голосованием, и расширением функциональных избирательных округов, позволит правительству управлять страной. Программа привлечения талантов из материкового Китая заполнит эти пробелы администраторами, прошедшими обучение в Пекине и Шэньчжэне."
 HKG_gong_zyu_ou_integration: "Интеграция Гонконга, Чжухая и Макао"
 HKG_gong_zyu_ou_integration_desc: "\"Одна страна, две системы\" всегда была переходным периодом. С приходом к власти патриотов в Специальном административном районе граница между Гонконгом, Чжухаем и Макао становится скорее административной, чем осмысленной. Трансграничная инфраструктура, согласованное регулирование и общие кадровые ресурсы завершают формирование Большого залива как единого экономического образования, готового к полной реинтеграции с Родиной."
 HKG_gong_zyu_ou_integration_tt: "Если Гонконг в настоящее время является субъектом §Y[CHI.GetFlag]§!, то Специальный административный район аннексируется и включается в состав Большого залива. В противном случае это завершает политическое объединение лоялистов без немедленной передачи суверенитета."
 HKG_support_democracy_in_china: "Поддержите демократию в Китае"
 HKG_support_democracy_in_china_desc: "Продемократическое движение в Гонконге открыто поддержит реформы на материке. Это прямой вызов авторитету Пекина."
 HKG_commemorate_june_fourth: "Отметьте 4 июня"
 HKG_commemorate_june_fourth_desc: "Памятная церемония в парке Виктория проводится ежегодно с 1990 года, и каждый год Пекин наблюдает за ней с тихим недовольством. В этом году мы официально объявляем об этом: публичное поминовение, санкционированное правительством САР, со свечами, песнями и именами погибших. Материковый Китай не забудет. И мы тоже."
 HKG_inspire_chinese_grassroots_movements: "Вдохновлять китайские общественные движения"
 HKG_inspire_chinese_grassroots_movements_desc: "Гонконг не может в одиночку спасти материковый Китай, но он может показать, как выглядит китайская демократия на практике. Открытое вещание в дельту Жемчужной реки, контрабандные листовки, проносимые через пограничные переходы, и скрытая финансовая поддержка самиздатовских сетей — семена перемен, посеянные в самом свободном китайском городе."
 HKG_call_on_CPC_to_release_dissidents: "Призываем КПК освободить диссидентов"
 HKG_call_on_CPC_to_release_dissidents_desc: "Имена хорошо известны: Лю Сяобо, Ван Бинчжан, Сюй Вэньли и десятки других. Правительство САР официально и публично требует их освобождения. Пекин, конечно, откажет, но это требование выводит проблему тюрем режима на международную повестку дня."
 HKG_pro_democracy_media_charter: "Хартия СМИ, выступающих за демократию"
 HKG_pro_democracy_media_charter_desc: "Свобода прессы — это не лозунг, а правовой режим. Хартия закрепляет защиту журналистов, криминализирует политическое вмешательство в редакционные решения и создает общественную телерадиокомпанию, действительно независимую от исполнительной власти. Идея «замалчиваемой прессы» сворачивается."
 HKG_fund_civil_society: "Финансирование гражданского общества"
 HKG_fund_civil_society_desc: "Государственные гранты для НПО, районных ассоциаций, юридических консультационных центров и организаций, выступающих за демократию. Финансовая база страдает, а политическая система укрепляется. Демократия без гражданского общества — это форум без аудитории."
 HKG_legco_reform_petition: "Петиция о реформе Законодательного совета"
 HKG_legco_reform_petition_desc: "Официальное обращение в Пекин с требованием подлинного всеобщего избирательного права на выборах в Законодательный совет. Прямые выборы на все места, упразднение функциональных избирательных округов, отсутствие комитета по выдвижению кандидатов. Идея отсутствия всеобщего избирательного права заменяется в качестве первой уступки ограниченным всеобщим избирательным правом."
 HKG_accountability_for_tiananmen: "Ответственность за события на площади Тяньаньмэнь"
 HKG_accountability_for_tiananmen_desc: "Мы называем имена тех, кто отдавал приказы. Мы называем названия подразделений, которые их выполняли. Мы открываем собственные архивы Специального административного района, поддерживаем международные трибуналы и усиливаем показания выживших. Пекин воспримет это как объявление войны партии. Гонконгские демократы услышат другой сигнал."
 HKG_peaceful_democratic_path: "Мирный демократический путь"
 HKG_peaceful_democratic_path_desc: "Реформы изнутри, а не внешняя конфронтация. Гонконг укрепляет свои демократические институты, стабилизирует гражданское общество и ждет, пока материковый Китай изменится в соответствии со своим собственным графиком. Свечи в парке Виктория все еще горят, но улицы остаются тихими. Следующий этап реформ начинается с позиции силы."
 HKG_appease_localists: "Умиротворить местных жителей"
 HKG_appease_localists_desc: "Уступки движению за сохранение местного языка: сохранение кантонского диалекта, политика приоритетного найма местных жителей и замедление реализации проектов трансграничной интеграции."
 HKG_stoke_anti_mainland_sentiment: "Разжечь антиматериковые настроения"
 HKG_stoke_anti_mainland_sentiment_desc: "Китай забрал все преимущества и оставил жителей Гонконга с высокими ценами на недвижимость и низкой покупательной способностью. Почему Гонконг должен оставаться в составе Китая и быть крошечной колонией Китая?"
 HKG_restrict_tourism_immigration: "Ограничить туризм и иммиграцию"
 HKG_restrict_tourism_immigration_desc: "Введены новые ограничения на количество туристов с материковой части Китая и ужесточены правила трансграничного иммиграционного контроля. Местные жители оценят эту свободу действий; розничные торговцы и застройщики — меньше."
 HKG_emphasize_hong_kong_identity: "Подчеркните гонконгскую идентичность"
 HKG_emphasize_hong_kong_identity_desc: "Успешное отделение Сингапура от Малайзии стало возможным благодаря успешным реформам Ли Куан Ю, направленным на формирование национального самосознания. Гонконг вполне способен перенять аналогичный подход."
 HKG_distance_from_china: "Расстояние от Китая"
 HKG_distance_from_china_desc: "Гонконг, пришло время поднять якорь и освободиться от контроля Китая."
 HKG_great_hong_kong_nation: "Великая Гонконгская нация"
 HKG_great_hong_kong_nation_desc: "Передача Гонконга была предательством. Обещания о пятидесяти годах — ложь. Гонконг — это государство, а не провинция, а государству нужен свой флаг, свои границы, свои вооруженные силы. Мы откажемся от того, что никогда не должно было быть предметом переговоров."
 HKG_hong_kong_first: "Гонконг Первый"
 HKG_hong_kong_first_desc: "От гаваней Абердина до высотных зданий Монг Кока, Гонконг принадлежит гонконгцам. Инвестиции материкового Китая, рабочая сила материкового Китая, влияние материкового Китая будут зависеть от воли местного населения. Гражданство — это наследие, а не передаваемое удобство."
 HKG_hong_kong_state_constitution: "Новая государственная конституция Гонконга"
 HKG_hong_kong_state_constitution_desc: "Основной закон был разработан в Пекине, подписан в Лондоне и навязан народу, не имевшему права голоса ни в одной из столиц. Его заменяет новая конституция, разработанная в Центральном Гонконге жителями Гонконга для жителей Гонконга. Переходный период завершен."
 HKG_armed_forces_of_hong_kong: "Вооруженные силы Гонконга"
 HKG_armed_forces_of_hong_kong_desc: "Нация, не способная защитить себя, — это вовсе не нация. Силы обороны Гонконга, сформированные из добровольцев и призывников, будут иметь пехоту, способную удерживать Новые Территории, и береговую охрану, способную противостоять любому вторжению. Военные ограничения Основного закона — это мертвая буква."
 HKG_irredentist_claim_pearl_river: "Заявите права на дельту Жемчужной реки"
 HKG_irredentist_claim_pearl_river_desc: "Дельта Жемчужной реки — Шэньчжэнь, Гуанчжоу, Чжухай — была кантонской еще до прихода к власти коммунистов, и местные жители имеют с нами гораздо больше общего, чем с Пекином. Мы открыто заявляем о своих правах. Будь то путем переговоров или силой, дельта воссоединится со своим культурным центром."
 HKG_little_bird_under_british_wing: "Маленькая птичка под британским крылом"
 HKG_little_bird_under_british_wing_desc: "Тот факт, что Гонконг отделился от Китая, не означает, что он сможет выжить в мире самостоятельно. Нам нужна помощь других. Как насчет наших бывших британских хозяев?"
 HKG_request_rerule_british_government: "Запрос на пересмотр решения британским правительством"
 HKG_request_rerule_british_government_desc: "Когда-то китайско-британские переговоры никогда не учитывали желание жителей Гонконга остаться в составе Британской империи. На этот раз мы последуем своему сердцу."
 HKG_aukus_intelligence_share: "Обмен разведывательной информацией AUKUS"
 HKG_aukus_intelligence_share_desc: "Британские, американские и австралийские разведывательные службы давно проявляют скрытый интерес к Гонконгу. Формализованная передача технологий и сотрудничество в области радиоэлектронной разведки под эгидой AUKUS прочно вписывают Специальный административный район Гонконг в архитектуру безопасности англосферы."
 HKG_uk_garrison_rights: "Права британского гарнизона"
 HKG_uk_garrison_rights_desc: "Символический отряд Королевской морской пехоты в Стоункаттерсе, заходы Королевского флота в гавань Виктория и соглашение о размещении, позволяющее Великобритании выходить в Южно-Китайское море с дружественного берега. Гарнизон невелик. Сигнал — нет."
 HKG_commonwealth_realm_ambition: "Амбиции Королевства Содружества"
 HKG_commonwealth_realm_ambition_desc: "Канада, Австралия, Новая Зеландия — все некогда колонии, все теперь королевства, все по-прежнему под властью Короны. Гонконг обращается к главам правительств стран Содружества с просьбой принять его обратно не как владение, а как суверенное королевство, разделяющее монархию. Историческое оскорбление, связанное с передачей власти, находит свой долгий ответ."
 HKG_city_state_idea: "Идея города-государства"
 HKG_city_state_idea_desc: "Сингапур доказал, что это возможно. Город с преимущественно китайским населением, окруженный более крупными державами, может выжить и процветать как суверенный торговый центр, если выберет нейтралитет и компетентность вместо идеологии. Гонконг последует этому примеру, но сделает это лучше."
 HKG_revise_basic_law: "Пересмотреть Основной закон"
 HKG_revise_basic_law_desc: "Основной закон был разработан как переходный документ, в котором Пекин подразумевал высшую власть. Пересмотренный устав исключает эти положения, утверждает полный суверенитет и переписывает структуру Специального административного района, представляя его как республику законов. Оборона и внешняя политика теперь принадлежат Гонконгу."
 HKG_pearl_of_east_asia: "Жемчужина Восточной Азии"
 HKG_pearl_of_east_asia_desc: "Освободившись от ограничений материкового Китая и западного влияния, город позиционирует себя как непревзойденный финансовый и коммерческий центр Восточной Азии. Капитал течет через Центральный район. Таланты устремляются в Ваньчай. Жемчужина превосходит по масштабу Шанхай и Сингапур."
 HKG_global_financial_capital: "Глобальный финансовый капитал"
 HKG_global_financial_capital_desc: "Гонконгская фондовая биржа (HKEX), независимый денежно-кредитный орган, и регулирующий режим, призванный привлекать капитал, который не может доверять Нью-Йорку или Лондону. Гонконг становится финансовым центром Азиатско-Тихоокеанского региона — тихо, прибыльно и незаменимо."
 HKG_coastal_defence_doctrine: "Доктрина береговой обороны"
 HKG_coastal_defence_doctrine_desc: "Город-государство не может позволить себе военно-морской флот, способный действовать в открытом море, но оно может позволить себе сделать любое вторжение дорогостоящим. Противокорабельные ракеты, заминированные подходы, укрепленная гавань и доктрина, ориентированная на сдерживание, а не на проекцию. Гонконг будет дикобразом, а не львом."
 HKG_under_lion_rock_hill: "Под Львиной скалой"
 HKG_under_lion_rock_hill_desc: "§CНа одной лодке под скалой мы будем стремиться как одно целое.\n\nВсе равны под солнцем.\n\nКогда мы будем свободны и едины,\n\nСтремимся к нашим радостным мечтам.\n\nВместе, одна душа, одно сердце.\n\nОдна надежда, которую не сможет разрушить страх.\n\nТам, где кончаются небо и море,\n\nВзяться за руки и идти со мной,\n\nЧтобы преодолеть трудности и одержать победу в нашей борьбе за то, чтобы написать\n\nНашу историю о доме, ярко сияющем.§!"
 HKG_race_discrimination_bill: "Законопроект о расовой дискриминации"
 HKG_race_discrimination_bill_desc: "Основной закон и Закон о правах человека Гонконга защищают права личности, включая право на защиту от расовой дискриминации. В соответствии с Международной конвенцией о ликвидации всех форм расовой дискриминации мы также обязаны запрещать и ликвидировать расовую дискриминацию."
 HKG_LGBT_rights: "Права ЛГБТ"
 HKG_LGBT_rights_desc: "Гонконгское ЛГБТ-сообщество слишком долго ждало. Правительство изучит, какие меры защиты и реформы возможны в рамках существующей правовой системы."
 HKG_affirm_support_for_christian_organizations: "Подтвердите поддержку христианских организаций."
 HKG_affirm_support_for_christian_organizations_desc: "Христианские организации издавна обладали значительным влиянием на социальную политику Гонконга. Их консультативная роль будет подтверждена и защищена."
 HKG_reduce_power_of_christian_groups: "Ограничить влияние христианских групп"
 HKG_reduce_power_of_christian_groups_desc: "Консультативная роль христианских организаций в социальной политике будет ограничена. Светские консультативные процессы будут расширены, чтобы восполнить этот пробел."
 HKG_consult_public_on_new_law: "Провести консультации с общественностью по поводу нового закона."
 HKG_consult_public_on_new_law_desc: "Перед принятием закона правительство проведет обширные общественные консультации. Этот процесс займет время, но его результат будет обладать демократической легитимностью."
 HKG_outlaw_anti_LGBT_discrimination: "Запретить дискриминацию в отношении ЛГБТ-сообщества"
 HKG_outlaw_anti_LGBT_discrimination_desc: "Дискриминация в отношении ЛГБТ-лиц на рабочем месте, в жилищной сфере и при предоставлении услуг будет объявлена незаконной. Ожидайте затяжной законодательной борьбы."
 HKG_seek_reform_of_existing_legislation: "Добиваться реформы существующего законодательства"
 HKG_seek_reform_of_existing_legislation_desc: "Будут выявлены и реформированы существующие дискриминационные положения в трудовом, семейном и арендном праве."
 HKG_anti_discrimination_reform_package: "Пакет мер по реформированию системы борьбы с дискриминацией"
 HKG_anti_discrimination_reform_package_desc: "Комплексная антидискриминационная реформа, охватывающая расу, религию, сексуальную ориентацию, гендерную идентичность и инвалидность."
 HKG_legalize_gay_marriage: "Легализовать однополые браки"
 HKG_legalize_gay_marriage_desc: "Гонконг стал первым восточноазиатским государством, полностью легализовавшим однополые браки. В одних кругах ожидается ликование, в других — резкое противодействие."
 HKG_gender_pay_gap: "Гендерный разрыв в оплате труда"
 HKG_gender_pay_gap_desc: "Обязательная отчетность о разрыве в оплате труда для всех крупных работодателей. Публичное осуждение и публичное порицание позволят достичь того, чего не удалось добиться при добровольном соблюдении требований."
 HKG_require_greater_transparency_from_employers: "Требовать большей прозрачности от работодателей"
 HKG_require_greater_transparency_from_employers_desc: "Работодатели, численность персонала которых превышает определенный уровень, обязаны ежегодно публиковать подробные отчеты о равной оплате труда."
 HKG_deny_existence_of_pay_gap: "Отрицайте существование разрыва в оплате труда."
 HKG_deny_existence_of_pay_gap_desc: "Официальная позиция правительства: существующие различия в оплате труда отражают выбор профессии, а не дискриминацию. Дальнейших действий не требуется."
 HKG_secondary_school_education_reform: "Реформа среднего школьного образования"
 HKG_secondary_school_education_reform_desc: "Старая структура среднего образования 3-2-2-3 будет заменена схемой 3-3-4, уже используемой в Соединенных Штатах и материковом Китае. Реформа устраняет дублирующееся и устаревшее содержание, одновременно расширяя спектр факультативных предметов."
 HKG_patriotic_education_curriculum_reform: "Реформа учебной программы патриотического образования"
 HKG_patriotic_education_curriculum_reform_desc: "Патриотическое воспитание не имеет места в существующей учебной программе Гонконга. Мы введем курс гуманитарных наук, чтобы восполнить этот пробел."
 HKG_chinese_based_education_curriculum: "Образовательная программа на основе китайского языка"
 HKG_chinese_based_education_curriculum_desc: "Мы прежде всего китайцы, а потом уже гонконгцы. В каждой школе Гонконга преподавание ведется на китайском языке, и от каждого ребенка ожидается владение этим языком."
 HKG_hong_kong_police_force: "Полиция Гонконга"
 HKG_hong_kong_police_force_desc: "Гонконгская полиция была создана 1 мая 1844 года и является крупнейшим дисциплинарным подразделением в правительстве Гонконга. Из-за ограничений на передвижение Народно-освободительной армии Китая, дислоцированной в Гонконге, функции, обычно выполняемые военными в других странах, выполняются полицией Гонконга. Долгое время Гонконгская полиция пользовалась заслуженной репутацией «лучшей в Азии»."
 HKG_anti_terrorist_train: "Антитеррористическая подготовка"
 HKG_anti_terrorist_train_desc: "Новое тысячелетие принесло процветание и возможности, но также и новые угрозы. Терроризму нельзя пустить корни в Гонконге."
 HKG_purchase_chinese_weapons: "Закупка китайского вооружения"
 HKG_purchase_chinese_weapons_desc: "Замена пистолетов Smith and Wesson британской эпохи на аналоги, поставляемые компанией Norinco. Стоимость низкая, символическое значение значительное."
 HKG_create_CTRU: "Создать подразделение по реагированию на терроризм"
 HKG_create_CTRU_desc: "Подразделение по борьбе с терроризмом (CTRU) — это силы быстрого реагирования, созданные для противодействия террористическим актам. В его состав войдут лучшие специалисты, которых только можно подготовить."
 HKG_police_system_reform: "Реформа полицейской системы"
 HKG_police_system_reform_desc: "Модернизация системы подготовки, структуры командования и механизмов подотчетности полиции Гонконга."
 HKG_investigate_police_triad_cooperation_problem: "Расследуйте вопрос о сотрудничестве полиции и триады."
 HKG_investigate_police_triad_cooperation_problem_desc: "Мы внедряем агентов под прикрытием в триады, но они делают то же самое с нами. Эти агенты-кроты подрывают наши операции еще до их начала. Работая через ICAC и OCTB, мы искореним этих \"Hak Ging\"."
 HKG_anti_protest_train: "Обширная подготовка по подавлению беспорядков"
 HKG_anti_protest_train_desc: "Специализированная подготовка к сценариям управления толпой, от мирных собраний до насильственных беспорядков."
 HKG_purchase_anti_riot_armour: "Приобретите снаряжение для подавления беспорядков."
 HKG_purchase_anti_riot_armour_desc: "Новое баллистическое и ударопрочное снаряжение для тактического подразделения полиции."
 HKG_purchase_non_lethal_weapons: "Приобретение нелетального оружия"
 HKG_purchase_non_lethal_weapons_desc: "Газовые гранатометы, резиновые пули и перцовые шарики — современный набор средств для контроля толпы."
 HKG_form_elite_team: "Сформируйте элитную команду"
 HKG_form_elite_team_desc: "Специализированное подразделение по борьбе с терроризмом, созданное по образцу зарубежных тактических групп."
 HKG_gong_hei_fat_coi: "Гонг Хей Фаат Чой"
 HKG_gong_hei_fat_coi_desc: "[HKG.GetFlag]Гонконг, только что переживший финансовый кризис и вступивший в новое тысячелетие, сталкивается с множеством экономических и социальных проблем. Как их решить – это вопрос, на который должны ответить сами жители."
 HKG_typhoon_shelter_from_financial_storm: "Укрытие от финансового шторма"
 HKG_typhoon_shelter_from_financial_storm_desc: "Буря утихла. Пришло время навести порядок. Правительство задействует валютные резервы и осуществит целенаправленные меры для стимулирования экономики."
 HKG_merge_into_HKEX: "Объединить HKCE и HKFE в HKEX"
 HKG_merge_into_HKEX_desc: "После финансового кризиса 1997 года Гонконгская товарная биржа (HKCE) и Гонконгская фьючерсная биржа (HKFE) будут объединены в новую компанию Hong Kong Exchanges and Clearing Limited (HKEX), что повысит конкурентоспособность города на все более глобализированном рынке."
 HKG_greatest_entrepot: "Крупнейший портовый торговец в Восточной Азии"
 HKG_greatest_entrepot_desc: "Гонконг долгое время был ведущим торговым центром Азии. Расширение пропускной способности порта и повышение эффективности обработки грузов позволят сохранить этот титул."
 HKG_expand_Kwai_Tsing_terminals: "Расширить терминалы Квай Цин"
 HKG_expand_Kwai_Tsing_terminals_desc: "Новые мощности по обработке контейнеров в Квай-Цин. Более крупные суда, более быстрая обработка, больше грузов, проходящих через Гонконг."
 HKG_attract_foreign_investment: "Привлечение иностранных инвестиций"
 HKG_attract_foreign_investment_desc: "Пакет налоговых льгот, упрощение регулирования и специализированные услуги по взаимодействию с инвесторами для привлечения капитала из-за рубежа."
 HKG_european_business: "Европейский бизнес"
 HKG_european_business_desc: "Целенаправленное взаимодействие с европейскими торговыми палатами. Гонконг как региональные ворота для европейских компаний, выходящих на азиатский рынок."
 HKG_chinese_entrepreneurs: "Предприниматели материкового Китая"
 HKG_chinese_entrepreneurs_desc: "Будущее экономики Гонконга – в материковом Китае. Правительство будет укреплять связи с деловыми кругами Пекина."
 HKG_develop_solar_power: "Инвестируйте в солнечную энергетику"
 HKG_develop_solar_power_desc: "Распределенные фотоэлектрические установки на крышах и водохранилищах. Скромное начало, но начало есть."
 HKG_T_PARK: "Комплекс T·PARK"
 HKG_T_PARK_desc: "Очистные сооружения T-PARK в Туен Муне превращают отходы в энергию и демонстрируют амбиции Гонконга в области охраны окружающей среды."
 HKG_indonesian_gas: "Газ из Джакарты"
 HKG_indonesian_gas_desc: "Долгосрочное соглашение с Индонезией о поставках сжиженного природного газа обеспечит энергетические потребности Гонконга на десятилетия вперед."
 HKG_australian_oil: "Нефть из Сиднея"
 HKG_australian_oil_desc: "Партнерство с австралийскими производителями нефти в сфере импорта позволит Гонконгу снизить зависимость от одного поставщика углеводородов."
 HKG_new_development_idea: "Новый план развития"
 HKG_new_development_idea_desc: "Инициатива «Новое развитие» объединяет проекты в области инфраструктуры, жилищного строительства и промышленных зон под единым скоординированным руководством."
 HKG_invest_hong_kong: "Инвестируйте в Гонконг"
 HKG_invest_hong_kong_desc: "Организация InvestHK реструктурирована и получила новое финансирование, став ведущим агентством города по привлечению инвестиций."
 HKG_hong_kong_science_parks: "Научные парки"
 HKG_hong_kong_science_parks_desc: "В районах Ша Тин и Цзюнг Кван О созданы специальные зоны для исследований и разработок в области биотехнологий, искусственного интеллекта и передового производства, с субсидированными офисными помещениями для стартапов."
 HKG_invite_talent_to_hong_kong: "Пригласить талантливых специалистов в Гонконг"
 HKG_invite_talent_to_hong_kong_desc: "Ускоренная визовая программа для высококвалифицированных иностранных специалистов, включающая услуги на английском языке и налоговые льготы для облегчения адаптации."
 HKG_hong_kong_cyberport: "Киберпорт"
 HKG_hong_kong_cyberport_desc: "Мандат Cyberport обновлен и расширен в рамках цифрового бизнес-кластера, ориентированного на финтех, электронную коммерцию и цифровые медиа."
 HKG_tech_incubation_programme: "Программа технологической инкубации"
 HKG_tech_incubation_programme_desc: "Инкубаторы, финансируемые государством, предоставляют стартовый капитал, наставничество и общую инфраструктуру для технологических стартапов на ранних стадиях развития."
 HKG_favor_traditional_values: "Обратитесь к традициям"
 HKG_favor_traditional_values_desc: "Правительство публично будет придерживаться традиционных семейных ценностей, ограничивая ЛГБТ-активизм в образовании и общественной жизни."
 HKG_undercover_oppression: "Скрытое угнетение"
 HKG_undercover_oppression_desc: "Более спокойный подход: наблюдение, давление со стороны работодателей и неофициальное сдерживание, а не открытое законодательство против групп меньшинств."
 HKG_legislate_to_ban_LGBT: "Запретить ЛГБТ-сообщество"
 HKG_legislate_to_ban_LGBT_desc: "Открытое принятие законов, криминализирующих публичное выражение ЛГБТ-идентичности. Международное сообщество отреагирует резко."
 HKG_regulate_sale_of_residential_buildings: "Регулирование продажи жилых зданий"
 HKG_regulate_sale_of_residential_buildings_desc: "Скромный набор правил раскрытия информации, ограничений на ипотечные кредиты и налогов на борьбу со спекуляциями. План Суэна остается в силе, но худшие проявления нерегулируемого рынка получают пресечение."
 HKG_land_reclamation: "Мелиорация земель"
 HKG_land_reclamation_desc: "В Гонконге ограниченное количество земли. Департамент гражданского строительства разрабатывает новую программу мелиорации у побережья Лантау, Новых Территорий и гавани Коулун. Стоимость огромна, и защитники окружающей среды в ярости; новые строительные площадки того стоят."
 HKG_lock_housing_price: "Заморозить цены на жилье"
 HKG_lock_housing_price_desc: "Правительство устанавливает жесткий потолок цен на жилую недвижимость, индексируемый в зависимости от среднего дохода. Землевладельцы в ярости; арендаторы и профсоюзы ликуют. Рынок становится предсказуемым и застойным."
 HKG_expand_home_ownership_scheme: "Расширить программу предоставления жилья в собственность."
 HKG_expand_home_ownership_scheme_desc: "Программа предоставления жилья в собственность расширена: больше квартир, более низкие пороги, ускоренная обработка заявок. Житель Гонконга из рабочего класса наконец-то может мечтать о собственном жилье. Государство выделяет субсидии; дивиденды – это социальный порядок."
 HKG_let_government_hold_companies: "Государственные компании"
 HKG_let_government_hold_companies_desc: "Крупнейшие девелоперские компании — Sun Hung Kai, Cheung Kong, Henderson — частично национализированы. Магнаты громко протестуют; правительство владеет акциями. Цены на недвижимость находятся под прямым политическим контролем."
 HKG_maintain_public_housing_construction: "Поддержание строительства государственного жилья"
 HKG_maintain_public_housing_construction_desc: "Строительный портфель Управления жилищного строительства сохраняется и расширяется. По всей территории Новых Территорий возводятся новые государственные жилые комплексы. Инвестиции в инфраструктуру приводят к стабильности и, что немаловажно, к повышению уровня удовлетворенности населения."
 HKG_my_home_purchase_scheme: "Программа приобретения жилья"
 HKG_my_home_purchase_scheme_desc: "План Дональда Цанга по приобретению жилья реализован так, как и задумано: квартиры с правом выкупа для так называемого «сэндвич-класса» — жителей Гонконга, которые зарабатывают слишком много для государственного жилья, но не могут позволить себе жилье на частном рынке. Это реальное решение кризиса доступности жилья."
 HKG_subsidised_sale_flats_project: "Проект субсидированных квартир"
 HKG_subsidised_sale_flats_project_desc: "Квартиры, продаваемые по государственным субсидиям, по ценам ниже рыночных для покупателей, приобретающих жилье впервые. Жилищное управление фактически становится крупнейшим застройщиком САР."
 HKG_green_form_subsidised_home_ownership_scheme: "Схема владения недвижимостью в «зеленой» форме"
 HKG_green_form_subsidised_home_ownership_scheme_desc: "Кульминацией жилищной реформы стало то, что владельцы «зеленой формы» — существующие арендаторы государственного жилья — получают преимущественный доступ к субсидированному владению собственностью. Цепочка социальной мобильности, прерванная на два десятилетия, наконец-то восстановлена. Жилищный кризис в Гонконге заканчивается."
 HKG_public_housing_problem: "Проблема государственного жилья"
 HKG_public_housing_problem_desc: "Жилищный кризис в Гонконге — это наиболее очевидный провал правительства, пришедшего к власти после передачи Гонконга Китаю. Средние цены на жилье на порядок превышают средние доходы; в квартирах, разделенных на несколько блоков, и в домах-клеточках проживают десятки тысяч человек; очередь на получение государственного жилья растянулась на шесть лет. Политическое давление с целью принятия каких-либо мер — хоть каких-то — просто огромно."
 HKG_sun_housing_policy: "Политика реформы жилищного сектора от газеты Sun Nine"
 HKG_sun_housing_policy_desc: "Программа министра жилищного строительства Майкла Суэна, состоящая из девяти пунктов: ограничение предложения, приостановка государственного строительства, предоставление рынку возможности восстановиться. Землевладельцы и крупные корпорации одобряют её. Профсоюзы и арендаторы — нет. История сурово оценит эту политику, но в краткосрочной перспективе она обеспечивает стабильность рынка недвижимости."
 HKG_end_tenants_purchase_scheme: "Прекратить действие программы выкупа жилья арендаторами."
 HKG_end_tenants_purchase_scheme_desc: "Жильцам государственного жилья больше не будет разрешено выкупать свои квартиры по сниженным ценам. Казначейство сохраняет за собой активы; жильцы остаются жильцами. Небольшая прибыль при реальных социальных издержках."
 HKG_suspend_home_ownership_scheme: "Приостановить действие программы предоставления жилья в собственность."
 HKG_suspend_home_ownership_scheme_desc: "Программа предоставления жилья в собственность приостановлена на неопределенный срок. Поток квартир, продаваемых по субсидированным ценам, иссякает, частный рынок освобождается от конкуренции со стороны государственного сектора, а у магнатов недвижимости становится на одну проблему меньше."
 HKG_curtail_land_supply: "Ограничить предложение земли"
 HKG_curtail_land_supply_desc: "Продажа государственных земельных участков приостанавливается; Департамент земельных ресурсов не выставляет свои запасы на рынок. Цены стабилизируются на высоком уровне, рынок недвижимости консолидируется, и жилищный кризис становится постоянной особенностью жизни в Гонконге."
 HKG_legco_decision_categories: "§1Законодательный совет§!"
 legco_current_motion_clock: "Текущее движение: §Y[ROOT.legco_current_motion]§!"
