 DEN_danish_defence_force: "Вооружённые силы Дании"
 DEN_danish_defence_force_desc: "Датская армия — сухопутный компонент вооружённых сил Дании, отвечающий за защиту Дании и её интересов внутри страны и за рубежом. Она была основана в 1614 году и имеет долгую историю военной службы."
 DEN_increase_eurosceptism_decision: "Суверенная валюта"
 DEN_increase_eurosceptism_decision_desc: "Дания подтверждает приверженность своей суверенной валюте, отказываясь от дальнейшей интеграции с еврозоной. Подчёркивая национальный суверенитет и экономическую независимость, это решение демонстрирует скептицизм Дании по отношению к углублению европейской интеграции и переходу на евро."
 DEN_downcrease_eurosceptism_decision: "Инициатива по интеграции в еврозону"
 DEN_downcrease_eurosceptism_decision_desc: "Дания делает активные шаги к сближению с еврозоной, показывая готовность перейти на евро как официальную валюту. Принимая общую валюту, Дания стремится укрепить экономические связи с европейскими партнёрами, повысить стабильность рынков и облегчить торговлю и инвестиции в еврозоне."
 DEN_bad_bank_decision: "Прагматичная стратегия сокращения долга"
 DEN_bad_bank_decision_desc: "Дания применяет прагматичный подход к сокращению долга, направляя скромные средства на снижение государственного долга и одновременно наращивая международные инвестиции. Сочетая бюджетную ответственность со стратегическими инвестициями, Дания стремится повысить финансовую стабильность и экономическую конкурентоспособность и привлечь иностранный капитал для устойчивого роста."
 DEN_EZB_bad_bank_decision: "Смелый план экономического стимулирования"
 DEN_EZB_bad_bank_decision_desc: "Дания запускает смелый план экономического стимулирования, выделяя значительные ресурсы на снижение государственного долга и наращивание международных инвестиций. Вливая капитал в стратегические отрасли и инфраструктурные проекты, Дания стремится оживить экономику, создать рабочие места и привлечь иностранных инвесторов, превращаясь в динамичный центр инноваций и роста на мировом рынке."
