 ADO.liberalism: "£generic_liberalism_small (PLA) - 安道尔自由党"
 ADO.liberalism_desc: "（保守自由主义）- 安道尔自由党\n\n马克·福尔内·莫尔内于1992年创立自由联盟，1994年12月奥斯卡·里瓦斯·雷格在不信任投票中落败后，他出任政府首脑，并于1997年和2001年带领该党赢得绝对多数席位，此时该党已更名为安道尔自由党。该党主张低税收、宽松监管，并捍卫安道尔公国的银行和商业模式。在阿尔伯特·平塔特的领导下，该党一直执政到2009年被社会民主党击败。2011年，该党并入安道尔民主党；2015年，该党以安道尔自由党的名义重新出现，获得第二名；2019年，该党加入泽维尔·埃斯波特的联合政府；2023年，该党失去所有席位。"
 ADO.Neutral_conservatism_2005: "£generic_Neutral_conservatism_small (NC) - 新中心"
 ADO.Neutral_conservatism_2005_desc: "（基督教民主主义）- 新中心\n\n新中心党成立于2005年，由安道尔民主中心党和世纪21党合并而成。这两个基督教民主党在当年的选举中联合参选，并赢得了两个席位。作为安道尔公国的基督教民主党，新中心党占据了自由党和社会民主党之间的中右翼立场，并且是中间民主国际的成员。\n\n2009年，该党与自由党组成改革联盟，赢得11个席位，但在选举中败给了社会民主党。2011年2月22日，联盟伙伴解散，合并成立安道尔民主党，新中心党也随之不复存在。"
 ADO.neutral_Social: "£generic_neutral_Social_small (RD) - 民主复兴"
 ADO.neutral_Social_desc: "（社会自由主义）- 民主复兴\n\n民主复兴党是一个成立于2005年的社会自由主义政党，由里卡德·德·哈罗领导。在当年的选举中，该党以社会民主党领导的“替代党”为参选名单，并在总议会中赢得一个席位；2009年，该党没有单独参选，而是支持了商人尤塞比·诺门领导的“安道尔变革党”，该党赢得了三个席位，其支持最初使得豪梅·巴图梅乌得以执政。\n\n该党介于社会民主党和自由党之间，兼具改革主义的经济观点和进步的社会政策。它没有参加2011年的选举，并于同年9月解散。"
 ADO.Neutral_green: "£generic_Neutral_green_small (VA) - 安道尔绿党"
 ADO.Neutral_green_desc: "（环保主义）- 安道尔绿党\n\n安道尔绿党成立于2003年，由伊莎贝尔·洛萨诺领导。该党自称是生态主义者和生态社会主义者，在环境和社会问题上都比现有政党更为左倾，并且是欧洲绿党和全球绿党的成员。\n\n绿党只有几十名活跃成员，曾参加2005年、2009年和2011年的选举，但从未赢得席位，得票率一直徘徊在3%左右。他们的作用在于，在这个政治主要由经济和教区事务主导的小州，让环境问题始终保持在议程之上。"
