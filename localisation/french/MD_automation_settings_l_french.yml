l_french:
 AUTOMATION_SETTINGS_OPEN_TT: "Ouvrir les paramètres d'automatisation"
 AUTOMATION_SETTINGS_TITLE: "Paramètres d'automatisation"
 AUTOMATION_SETTINGS_DESC: "Gérer les actions récurrentes et les préférences de notification depuis un seul panneau. Les commandes existantes ailleurs restent disponibles."
 AUTOMATION_SETTINGS_GENERAL_PAGE: "Général"
 AUTOMATION_SETTINGS_SPACE_PAGE: "Satellites"
 AUTOMATION_SETTINGS_INFLUENCE_PAGE: "Influence"
 AUTOMATION_SETTINGS_SPACE_DESC: "Configurer la production automatique de satellites, les lancements et les modernisations de constellations."
 AUTOMATION_SETTINGS_INFLUENCE_DESC: "Configurer les actions récurrentes qui défendent notre gouvernement contre l'influence étrangère."
 AUTOMATION_SETTINGS_SPACE_SAVE_BUTTON_TT: "Store the payload manifest staged in the Space Program as the §YCustom§! plan and switch to it.\n\n§YPrerequisites:§!\n[!automation_space_save_button_click_enabled]"
 AUTOMATION_SETTINGS_SPACE_UPGRADE_BUTTON_TT: "Promote each constellation to the newest researched generation wherever current orbital coverage supports it.\n\n§YPrerequisites:§!\n[!automation_space_upgrade_button_click_enabled]"
 AUTOMATION_SETTINGS_NOTIFICATIONS_HEADER: "Notifications et préférences"
 AUTOMATION_SETTINGS_ECONOMY_HEADER: "Économie"
 AUTOMATION_SETTINGS_UN_HEADER: "Nations Unies"
 AUTOMATION_SETTINGS_DIPLOMACY_HEADER: "Diplomatie"
 AUTOMATION_SETTINGS_NATO_HEADER: "OTAN"
 AUTOMATION_SETTINGS_ENERGY_HEADER: "Énergie"
 AUTOMATION_SETTINGS_PP_RESERVE: "Réserve de pouvoir politique"
 AUTOMATION_SETTINGS_PP_RESERVE_VALUE: "£pol_power [?automation_pp_reserve|0]"
 AUTOMATION_SETTINGS_PP_RESERVE_TT: "Les actions automatisées qui dépensent du pouvoir politique attendront de pouvoir payer leur coût sans faire descendre le pouvoir politique sous cette réserve. Les actions manuelles ne sont pas affectées.\n\n£click_left §YClic G§! : ajuster de §Y1§!\n£key_shift + £click_left §YMaj + clic G§! : ajuster de §Y100§!"
 AUTOMATION_SETTINGS_PP_RESERVE_PLUS_TT: "£click_left §YClic G§! : augmenter de §Y1§!"
 AUTOMATION_SETTINGS_PP_RESERVE_MINUS_TT: "£click_left §YClic G§! : diminuer de §Y1§!"
 AUTOMATION_SETTINGS_CORRUPTION: "Refuser automatiquement les offres de corruption"
 AUTOMATION_SETTINGS_CORRUPTION_TT: "Ignorer automatiquement les offres de corruption. Les événements et leurs récompenses possibles n'apparaîtront pas tant que c'est activé."
 AUTOMATION_SETTINGS_FOREIGN_ELECTION: "Notifications d'élections étrangères"
 AUTOMATION_SETTINGS_FOREIGN_ELECTION_TT: "Afficher les actualités sur les élections dans les autres pays."
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS: "Influencer les notifications de raid"
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS_TT: "Afficher les événements concernant les raids d'influence entre d'autres pays. Les raids contre nous seront toujours signalés si c'est désactivé."
 AUTOMATION_SETTINGS_INFLUENCE_REPORT: "Rapport mensuel d'auto-influence"
 AUTOMATION_SETTINGS_INFLUENCE_REPORT_TT: "Afficher le rapport mensuel listant les pays touchés par l'influence automatique."
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE: "Acceptez automatiquement les offres d'investissement"
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE_TT: "Accepter automatiquement toute offre d'investissement international entrante. Activer ceci désactive le rejet automatique."
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION: "Rejeter automatiquement les offres d'investissement"
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION_TT: "Rejeter automatiquement toute offre d'investissement international entrante. Activer ceci désactive l'acceptation automatique."
 AUTOMATION_SETTINGS_REINVESTMENT: "Réinvestissement des investissements internationaux"
 AUTOMATION_SETTINGS_REINVESTMENT_TT: "Choisir comment les rendements hebdomadaires des investissements internationaux sont répartis entre le Trésor et le réinvestissement."
 AUTOMATION_SETTINGS_REINVEST_OFF: "Désactivé"
 AUTOMATION_SETTINGS_REINVEST_OFF_TT: "Envoyer tous les rendements des investissements internationaux au Trésor."
 AUTOMATION_SETTINGS_REINVEST_FULL: "Complet"
 AUTOMATION_SETTINGS_REINVEST_FULL_TT: "Réinvestir tous les rendements des investissements internationaux."
 AUTOMATION_SETTINGS_REINVEST_SPLIT: "Diviser"
 AUTOMATION_SETTINGS_REINVEST_SPLIT_TT: "Envoyer la moitié des rendements des investissements internationaux au Trésor et réinvestir l'autre moitié."
 AUTOMATION_SETTINGS_FUEL_PURCHASE: "Achat automatique de carburant"
 AUTOMATION_SETTINGS_FUEL_PURCHASE_TT: "Acheter du carburant immédiatement, puis vérifier tous les 28 jours et racheter dès que les réserves tombent sous 20 %. Désactiver pour annuler les achats futurs."
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS: "Répéter les investissements internes sélectionnés"
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS_TT: "Paie £pol_power §R0,15§! de pouvoir politique par jour tant que c'est activé. Clic droit sur les boutons d'investissement interne dans la vue d'État pour sélectionner l'État et les types d'investissement à répéter. Les investissements sélectionnés sont vérifiés chaque semaine et s'exécutent tant qu'un emplacement est libre, que le Trésor peut payer le coût actuel et que la réserve de pouvoir politique peut être maintenue."
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY: "Réapprovisionner automatiquement la station antarctique"
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY_TT: "Commander automatiquement du carburant pour notre station antarctique à 15 jours restants ou moins de novembre à mars, ou 30 jours ou moins d'avril à octobre. Les livraisons coûtent §R0,25 b$ pour 1 000 de carburant§!, doublées pendant l'hiver antarctique. Les commandes attendent que le Trésor puisse payer le coût total."
 AUTOMATION_SETTINGS_ENERGY_CONSUMPTION_POLICY: "Politique de consommation automatique"
 AUTOMATION_SETTINGS_SC_VOTE: "Vote par défaut au Conseil de sécurité"
 AUTOMATION_SETTINGS_SC_VOTE_TT: "Choisir comment nous votons automatiquement sur les résolutions du Conseil de sécurité. Cliquer à nouveau sur l'option sélectionnée pour revenir au vote manuel."
 AUTOMATION_SETTINGS_GA_VOTE: "Vote par défaut à l'Assemblée générale"
 AUTOMATION_SETTINGS_GA_VOTE_TT: "Choisir comment nous votons automatiquement sur les résolutions de l'Assemblée générale. Cliquer à nouveau sur l'option sélectionnée pour revenir au vote manuel."
 AUTOMATION_SETTINGS_VOTE_YES: "Oui"
 AUTOMATION_SETTINGS_VOTE_NO: "Non."
 AUTOMATION_SETTINGS_VOTE_ABSTAIN: "S'abstenir"
 AUTOMATION_SETTINGS_SC_ACCEPT_TT: "Voter automatiquement oui à chaque résolution du Conseil de sécurité."
 AUTOMATION_SETTINGS_SC_REJECT_TT: "Voter Non automatiquement à chaque résolution du Conseil de sécurité. Les membres permanents opposeront un veto le cas échéant."
 AUTOMATION_SETTINGS_SC_ABSTAIN_TT: "S'abstenir automatiquement de chaque résolution du Conseil de sécurité."
 AUTOMATION_SETTINGS_GA_ACCEPT_TT: "Voter automatiquement oui à chaque résolution de l'Assemblée générale."
 AUTOMATION_SETTINGS_GA_REJECT_TT: "Voter automatiquement non à chaque résolution de l'Assemblée générale."
 AUTOMATION_SETTINGS_GA_ABSTAIN_TT: "S'abstenir automatiquement de chaque résolution de l'Assemblée générale."
 AUTOMATION_SETTINGS_SATELLITE_REJECTION: "Bloquer les offres d’accès par satellite AI"
 AUTOMATION_SETTINGS_SATELLITE_REJECTION_TT: "Empêcher les pays IA de proposer un accès partagé à leurs systèmes satellitaires militaires et civils. Les joueurs humains peuvent toujours envoyer des offres."
 AUTOMATION_SETTINGS_NATO_RATIFICATION: "Ratifier automatiquement les adhésions à l'OTAN"
 AUTOMATION_SETTINGS_NATO_RATIFICATION_TT: "Dépenser automatiquement £pol_power §Y20§! pour ratifier chaque candidat à l'adhésion à l'OTAN. La ratification attend que la réserve de pouvoir politique puisse être maintenue."
 AUTOMATION_SETTINGS_INFLUENCE_HEADER: "Défense d'influence"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE: "Combattre automatiquement l’influence étrangère"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE_TT: "Paie £pol_power §R0,05§! de pouvoir politique par jour tant que c'est activé. Lorsque c'est disponible, dépense automatiquement £pol_power §Y100§! pour augmenter l'indépendance intérieure de §G2,5 %§!. Se répète après 100 jours. L'automatisation se met en pause tant que le gouvernement est l'objet d'un lobbying ou si l'un des coûts ferait descendre le pouvoir politique sous la réserve."
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS: "Attaquer automatiquement les influenceurs étrangers"
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS_TT: "Paie £pol_power §R0,05§! de pouvoir politique par jour tant que c'est activé. Dépense automatiquement £pol_power §Y125§! pour lancer une campagne de 60 jours contre l'influenceur étranger éligible le plus fort. Une seule campagne à la fois. Les cibles inéligibles, sous lobbying ou en temps de recharge sont ignorées. L'automatisation se met en pause si l'un des coûts ferait descendre le pouvoir politique sous la réserve."
 AUTOMATION_SETTINGS_INFLUENCE_COST_NOTE: "Chaque option activée coûte £pol_power §R0.05§! par jour. Les deux options ensemble coûtent £pol_power §R0.10§! par jour."
 AUTOMATION_SETTINGS_ECONOMY_PAGE: "Économie"
 AUTOMATION_SETTINGS_ECONOMY_DESC: "Choisir quels impôts et dépenses publiques gérer automatiquement. Les changements sont examinés chaque semaine et respectent la réserve de pouvoir politique."
 AUTOMATION_SETTINGS_TAX_HEADER: "Taux d'imposition"
 AUTOMATION_SETTINGS_BUDGET_HEADER: "Lois budgétaires"
 AUTOMATION_SETTINGS_TAX_SUMMARY: "Les impôts activés changent d'au plus un point de pourcentage par semaine en fonction de l'équilibre budgétaire, de la dette et de la stabilité.\n\nLes changements manuels laissent l'automatisation activée."
 AUTOMATION_SETTINGS_BUDGET_SUMMARY: "Les budgets activés se déplacent d'un cran vers les dépenses attendues. Au plus un budget change chaque semaine, selon une priorité rotative. Les hausses exigent un excédent budgétaire. Les changements de loi manuels laissent l'automatisation activée."
 AUTOMATION_SETTINGS_POPULATION_TAX: "Taxe de population : [?population_tax_rate|0]%"
 AUTOMATION_SETTINGS_CORPORATE_TAX: "Impôt sur les sociétés : [?corporate_tax_rate|0]%"
 AUTOMATION_SETTINGS_POPULATION_TAX_TT: "Ajuste automatiquement l'impôt sur la population d'un point de pourcentage par semaine selon l'équilibre budgétaire, la dette et la stabilité. Respecte les restrictions de changement d'impôt et paie le coût normal en pouvoir politique au-dessus de la réserve. Les changements manuels d'impôt laissent cette option activée."
 AUTOMATION_SETTINGS_CORPORATE_TAX_TT: "Ajuste automatiquement l'impôt sur les sociétés d'un point de pourcentage par semaine selon l'équilibre budgétaire, la dette et les usines civiles disponibles. Respecte les restrictions de changement d'impôt et paie le coût normal en pouvoir politique au-dessus de la réserve. Les changements manuels d'impôt laissent cette option activée."
 AUTOMATION_SETTINGS_BUDGET_BUREAUCRACY: "Administration : [?bureau_law|0] / [?expected_adm_sending|0]"
 AUTOMATION_SETTINGS_BUDGET_BUREAUCRACY_TT: "Déplace automatiquement l'administration vers son niveau de dépenses attendu, un cran à la fois. Les chiffres indiquent les niveaux actuel et attendu. Les restrictions de loi normales et les coûts en pouvoir politique s'appliquent. Les hausses exigent un excédent et se mettent en pause en cas de faillite imminente. La réserve de pouvoir politique est préservée. Les changements de loi manuels laissent cette option activée."
 AUTOMATION_SETTINGS_BUDGET_CRIME_FIGHTING: "Police : [?police_law|0] / [?expected_police_sending|0]"
 AUTOMATION_SETTINGS_BUDGET_CRIME_FIGHTING_TT: "Déplace automatiquement le maintien de l'ordre vers son niveau de dépenses attendu, un cran à la fois. Les chiffres indiquent les niveaux actuel et attendu. Les restrictions de loi normales et les coûts en pouvoir politique s'appliquent. Les hausses exigent un excédent et se mettent en pause en cas de faillite imminente. La réserve de pouvoir politique est préservée. Les changements de loi manuels laissent cette option activée."
 AUTOMATION_SETTINGS_BUDGET_EDUCATION_BUDGET: "Éducation : [?education_law|0] / [?expected_edu_sending|0]"
 AUTOMATION_SETTINGS_BUDGET_EDUCATION_BUDGET_TT: "Déplace automatiquement l'éducation vers son niveau de dépenses attendu, un cran à la fois. Les chiffres indiquent les niveaux actuel et attendu. Les restrictions de loi normales et les coûts en pouvoir politique s'appliquent. Les hausses exigent un excédent et se mettent en pause en cas de faillite imminente. La réserve de pouvoir politique est préservée. Les changements de loi manuels laissent cette option activée."
 AUTOMATION_SETTINGS_BUDGET_HEALTH_BUDGET: "Soins de santé : [?health_law|0] / [?expected_health_sending|0]"
 AUTOMATION_SETTINGS_BUDGET_HEALTH_BUDGET_TT: "Déplace automatiquement la santé vers son niveau de dépenses attendu, un cran à la fois. Les chiffres indiquent les niveaux actuel et attendu. Les restrictions de loi normales et les coûts en pouvoir politique s'appliquent. Les hausses exigent un excédent et se mettent en pause en cas de faillite imminente. La réserve de pouvoir politique est préservée. Les changements de loi manuels laissent cette option activée."
 AUTOMATION_SETTINGS_BUDGET_SOCIAL_BUDGET: "Aide sociale : [?social_law|0] / [?expected_welfare_sending|0]"
 AUTOMATION_SETTINGS_BUDGET_SOCIAL_BUDGET_TT: "Déplace automatiquement la protection sociale vers son niveau de dépenses attendu, un cran à la fois. Les chiffres indiquent les niveaux actuel et attendu. Les restrictions de loi normales et les coûts en pouvoir politique s'appliquent. Les hausses exigent un excédent et se mettent en pause en cas de faillite imminente. La réserve de pouvoir politique est préservée. Les changements de loi manuels laissent cette option activée."
 AUTOMATION_SETTINGS_BUDGET_MILITARY_SPENDING: "Dépenses militaires : [?military_law|0] / [?expected_military_sp|0]"
 AUTOMATION_SETTINGS_BUDGET_MILITARY_SPENDING_TT: "Déplace automatiquement les dépenses militaires vers leur niveau de dépenses attendu, un cran à la fois. Les chiffres indiquent les niveaux actuel et attendu. Les restrictions de loi normales et les coûts en pouvoir politique s'appliquent. Les hausses exigent un excédent et se mettent en pause en cas de faillite imminente. La réserve de pouvoir politique est préservée. Les changements de loi manuels laissent cette option activée."
 AUTOMATION_SETTINGS_GENERAL_PAGE_TT: "Configure general automation such as United Nation actions, Notification Preferences, and other minor automation actions."
 AUTOMATION_SETTINGS_SPACE_PAGE_TT: "Configure automatic satellite production, launches, and constellation upgrades.\n\n§YPrerequisites:§!\n[!automation_settings_space_page_button_click_enabled]"
 AUTOMATION_SETTINGS_INFLUENCE_PAGE_TT: "Configure influence automation such as influence defense and attack."
 AUTOMATION_SETTINGS_ECONOMY_PAGE_TT: "Configure economic automation such as tax rates and laws."
 AUTOMATION_SETTINGS_NUCLEAR_ENRICHMENT: "Block AI Nuclear Fuel Offers"
 AUTOMATION_SETTINGS_NUCLEAR_ENRICHMENT_TT: "Prevent AI countries from sending §YNuclear Fuel§! purchase requests to a nation. Human players can still send offers."