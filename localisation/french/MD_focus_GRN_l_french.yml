 GRN_national_decisions: "Décisions nationales du Groenland"
 GRN_national_decisions_desc: "L'île du Groenland vit une situation à la fois détendue et tendue. Outre les tentatives des dirigeants politiques de faire, eh bien, n'importe quoi pour développer l'île et sa population, il faut aussi affronter la question toujours plus pressante de l'indépendance éventuelle. Certains la veulent maintenant, d'autres préfèrent attendre un socle plus stable. Quoi qu'il en soit, ce sera au Groenland comme au Danemark de décider si l'île sera vraiment libre à la fin."
 GRN_decision_independence_war: "Guerre d'indépendance"
 GRN_decision_independence_war_desc: "The time is upon us and the politicians have forced the hands of the people. War is declared and now it's a race to see if Denmark can keep ahold of its crown or will the crown holding fall away as public pressure forces a peace between all parties."
 GRN_decision_capital_city_expansion: "Expansion de la capitale"
 GRN_decision_capital_city_expansion_desc: "Notre population nationale croissant bien au-delà de ce que nous avions vraiment prévu, il nous faudra refondre la capitale de Nuuk pour mieux refléter et intégrer la croissance régionale et nationale d'ensemble."
 GRN_decision_development_visa_grants: "Octrois de visas de développement"
 GRN_decision_development_visa_grants_desc: "Our chief problem to our nation's development is purely a lack of human resources. In order to get anywhere we need to heavily invest in acquiring foreign workers who are willing to stomach more the environment than the potential lavish monetary incentives and employment we may be able to give."
 GRN_decision_global_recruitment_efforts: "Efforts de recrutement mondiaux"
 GRN_decision_global_recruitment_efforts_desc: "La défense nationale étant désormais sous notre contrôle direct, nous souffrons du même problème que pour le pays dans son ensemble : le manque d'effectifs. Il nous faudra essentiellement faire quelque chose de similaire aux subventions au développement, mais pour l'armée. Espérons qu'à mesure que notre économie se renforcera et que notre budget gagnera en souplesse pour ce type de dépenses, nous pourrons fortement inciter mercenaires et âmes errantes sans foyer permanent à choisir le nôtre comme dernière demeure."
 GRN_decision_naval_priority_act: "Loi de priorité navale"
 GRN_decision_naval_priority_act_desc: "In order to have any presence in the region most immediate to us we need to have a navy. The problem is we don't have the economic capacity to just build them steady as she goes so to speak. As such we need to essentially shanghai as many naval ship building like facilities and complexes in as close of proximity to one another to quick build a basic fleet. It's gonna be extremely costly, but so will sitting and simply waiting for something to happen that actually goes in our favor."
 GRN_decision_project_vortex: "Projet Vortex"
 GRN_decision_project_vortex_desc: "Sécuriser le passage naval dans le Grand Nord est délicat, car l'idée que nous acquérions la suprématie navale dans des régions stratégiques inquiète. Pour y remédier, nous créerons la meilleure démonstration de force navale que nos moyens actuels permettent."
 GRN_decision_national_commission: "Commission nationale"
 GRN_decision_national_commission_desc: "Le processus de conception étant achevé et les prototypes jugés satisfaisants, nous organiserons désormais une commission nationale pour aider à construire notre premier cuirassé."
 GRN_decision_project_northern_projection: "Projet Projection Nord"
 GRN_decision_project_northern_projection_desc: "Les choses étant stables et prêtes pour les véritables ambitions de notre nation, il nous faudra contrôler plusieurs zones maritimes. Nous pourrons l'assurer en travaillant avec les constructeurs navals du pays pour créer ce qui sera le 2e groupe de bataille arctique."
 GRN_southern_interior_development_decisions: "Projets de développement de l'intérieur sud"
 GRN_southern_interior_development_decisions_desc: "Notre nation étant stabilisée tant économiquement que socialement grâce à nos initiatives démographiques, nous pouvons désormais tourner le regard vers l'intérieur du pays. Le plateau méridional sera le premier grand pas vers la domestication de la Grande calotte glaciaire."
 GRN_decision_fort_vortex: "Fort Vortex"
 GRN_decision_fort_vortex_desc: "Nous commencerons notre marche vers l'intérieur méridional en établissant une ville fortifiée nommée Fort Vortex."
 GRN_decision_glacial_shine: "Brillance glaciaire"
 GRN_decision_glacial_shine_desc: "Notre prochaine agglomération la plus centrale s'appellera Glacial Shine."
 GRN_decision_frostbury: "Frostbury"
 GRN_decision_frostbury_desc: "Nous établirons l'agglomération de Frostbury juste à l'est de la capitale nationale."
 GRN_decision_fort_seal: "Sceau de fort"
 GRN_decision_fort_seal_desc: "Nous établirons une agglomération fortifiée stratégique du centre-est le long de la frontière entre l'intérieur méridional et le plateau central."
 GRN_decision_southern_interior_basic_roads: "Travaux routiers de base de l'intérieur sud"
 GRN_decision_southern_interior_basic_roads_desc: "Nos peuplements étant pleinement établis, nous pouvons désormais créer une forme élémentaire de transport terrestre pour relier et ravitailler ces nouveaux bastions de civilisation."
 GRN_decision_southern_interior_improved_roads: "Routes améliorées de l'intérieur du sud"
 GRN_decision_southern_interior_improved_roads_desc: "Des investissements continus dans le réseau routier permettront un meilleur volume de trafic ainsi que des mesures de sécurité plus adéquates et plus constantes pour parcourir de si longues distances dans des conditions dangereuses."
 GRN_decision_great_polar_railway: "Grand chemin de fer polaire"
 GRN_decision_great_polar_railway_desc: "Assurer le développement d'un réseau ferroviaire fluide et efficace nous permet d'acheminer personnes et matériaux en masse. Nous pouvons enfin commencer vraiment à bâtir une économie régionale à partir de zéro."
 GRN_decision_basic_industrial_jobs: "Emplois industriels de base"
 GRN_decision_basic_industrial_jobs_desc: "Assurer une forme élémentaire d'activité économique nous permet de financer plus directement le développement intérieur et d'étendre, là où c'est possible, d'autres secteurs économiques."
 GRN_decision_local_food_supply: "Approvisionnement alimentaire local"
 GRN_decision_local_food_supply_desc: "Le développement stratégique des IAR nous permet de créer des ravitaillements alimentaires locaux pour les peuplements : non seulement nous exploitons davantage l'eau gelée, mais nous aidons aussi ces centres de population naissants à croître sur place. Les installations agricoles rudes seront la lance qui percera la bête gelée qu'est la calotte."
 GRN_decision_extensive_geological_surveying: "Études géologiques approfondies"
 GRN_decision_extensive_geological_surveying_desc: "Vu l'immensité de l'intérieur, il nous faudra investir lourdement dans ces opérations stratégiques ainsi que mettre en place des installations agricoles rudes dédiées, conçues pour des plantes productrices de caoutchouc. Ces résultats devraient s'avérer extrêmement fructueux au regard du temps et du capital que nous y investissons."
 GRN_decision_creating_dedicated_mining_operations: "Création d'opérations minières dédiées"
 GRN_decision_creating_dedicated_mining_operations_desc: "Avec des gisements clairsemés et encore mal connus de diverses ressources minérales détectés, nous avons aussi commencé à étendre les travaux de fondation pour davantage d'IAR destinées à la production de caoutchouc. Poursuivre ces initiatives ne pourra que servir notre cause."
 GRN_decision_regional_economic_sector_synergy: "Synergie des secteurs économiques régionaux"
 GRN_decision_regional_economic_sector_synergy_desc: "Par un investissement vaste et massif en main-d'œuvre, ressources et financement, nous pourrons étendre les opérations minières jusqu'à créer une diversité économique locale. Bientôt, nous pourrons créer une synergie régionale, comme pour le reste de l'économie nationale."
 GRN_central_plateau_development_decisions: "Projets de développement du plateau central"
 GRN_central_plateau_development_decisions_desc: "L'intérieur méridional étant désormais synergisé économiquement et socialement, nous pouvons commencer à jeter ici, sur le plateau central, les fondations pour en faire autant. Tout cela sera coûteux, mais à long terme cela en vaudra certainement la peine."
 GRN_decision_fort_frostfields: "Fort Frostfields"
 GRN_decision_fort_frostfields_desc: "We'll create a fort settlement called Fort Frostfields in the west semi-near the town of Sisimiut."
 GRN_decision_frigidville: "Frigidville"
 GRN_decision_frigidville_desc: "En nous dirigeant vers l'est, nous créerons l'agglomération de Frigidville. Quelqu'un d'autre est à court de noms thématiques ?"
 GRN_decision_aurora: "Aurore"
 GRN_decision_aurora_desc: "Dans la section la plus centrale du plateau, je crois que nous créerons l'agglomération bien nommée d'Aurora."
 GRN_decision_snowdenson: "Snowdenson"
 GRN_decision_snowdenson_desc: "En basculant vers le sud, nous créerons l'agglomération de Snowdenson pour combler l'écart entre Glacial Shine et Aurora, au service des activités économiques interrégionales."
 GRN_decision_blizzards_peak: "Le pic du Blizzard"
 GRN_decision_blizzards_peak_desc: "En remontant vers le nord et en continuant vers l'est, nous créerons l'agglomération de Blizzard's Peak, car certains des plus hauts sommets se trouvent dans les parages."
 GRN_decision_crystal_flake: "Flocon de cristal"
 GRN_decision_crystal_flake_desc: "Heading further east and second nearest to the eastern coastal region we'll create the settlement of Crystal Flake."
 GRN_decision_snowberry: "symphorine"
 GRN_decision_snowberry_desc: "À cheval sur la zone frontalière nord-est entre le plateau et les régions côtières orientales, nous créerons la petite ville au nom charmant de Snowberry."
 GRN_decision_plateau_interior_basic_roads: "Réseau routier de base du Plateau Central"
 GRN_decision_plateau_interior_basic_roads_desc: "With settlements created we now can begin to construct the basic foundations of a road network throughout the plateau. This foundational work will help to make travel smoother and more direct than simply driving over the hazardous terrain itself."
 GRN_decision_plateau_interior_improved_roads: "Travaux routiers améliorés sur le Plateau Central"
 GRN_decision_plateau_interior_improved_roads_desc: "Les fondations posées, nous pouvons désormais investir dans la standardisation des mesures de sécurité ainsi que dans d'autres installations nécessaires pour parcourir ce paysage étendu."
 GRN_decision_central_arctic_railroad: "Chemin de fer du centre de l'Arctique"
 GRN_decision_central_arctic_railroad_desc: "En partant du GPG dans l'intérieur méridional ainsi que du réseau ferroviaire côtier, nous pouvons désormais consolider le gros du transport de masse à travers la nation. Le plateau abritera donc le Central Arctic Railroad, ou CARR."
 GRN_decision_basic_industrial_jobs_two: "Marché de l'emploi industriel de base"
 GRN_decision_basic_industrial_jobs_two_desc: "Population et infrastructures en place, nous pouvons commencer à créer une forme d'activité économique sur le plateau central."
 GRN_decision_local_food_supply_two: "Établir un approvisionnement alimentaire local"
 GRN_decision_local_food_supply_two_desc: "En utilisant les modèles d'IAR déjà déployés dans le pays, nous pouvons créer des installations dédiées pour alléger la pression sur la constitution de chaînes d'approvisionnement alimentaire locales."
 GRN_decision_extensive_geological_surveying_two: "Plateau Central : études géologiques de masse"
 GRN_decision_extensive_geological_surveying_two_desc: "Gens, lieux, infrastructures, emplois et nourriture. Tout est assuré, tout est prêt à creuser profondément dans la glace et les terres sous le temps lui-même."
 GRN_decision_creating_dedicated_mining_operations_two: "Plateau Central : opérations minières dédiées"
 GRN_decision_creating_dedicated_mining_operations_two_desc: "With the survey data within our hands as well as initial scouting mines established we can now begin to expand and create more dedicated mines and the operational apparatus around them."
 GRN_decision_regional_economic_sector_synergy_two: "Plateau central : synergie intersectorielle"
 GRN_decision_regional_economic_sector_synergy_two_desc: "Le tronçon le plus long et le plus coûteux du voyage est devant nous. Mais en contemplant les paysages de glace étincelants du vaste plateau central, nous pouvons tout absorber et savourer la satisfaction pure d'y être enfin arrivés. Car le Groenland est vraiment la terre de la bête."
 GRN_faction_polar_defense_league: "Ligue de défense polaire"
 greenland_event.1.t: "Référendum d'autonomie"
 greenland_event.1.d: "Bientôt le parlement votera l'extension des dispositions établies par la loi d'autonomie interne de 79. En cas de vote favorable, l'éducation, la santé, le système judiciaire ainsi que le contrôle total de la garde côtière passeront sous le plein contrôle du gouvernement groenlandais."
 greenland_event.1.o1: "Le parlement approuve la loi d'autonomie"
 greenland_event.1.o2: "Le parlement maintient le statu quo"
 greenland_event.2.t: "Loi d'autonomie du Groenland"
 greenland_event.2.d: "Le Groenland a voté l'extension de ses droits sous la loi d'autonomie interne de 1979 et son remplacement par la loi d'autonomie de 2008. La loi leur confère le contrôle de plusieurs organes gouvernementaux ainsi que de la garde côtière. Nous pouvons approuver le vote puisqu'il y a eu une majorité, ou le bloquer en arguant que les finances de la nation ne pourraient pas soutenir le fonctionnement indépendant de tous ces systèmes sans augmenter les subventions coloniales que nous fournissons."
 greenland_event.2.o1: "Approuver le vote"
 greenland_event.2.o2: "Rejeter le vote"
 greenland_event.300.t: "Le Danemark approuve le vote"
 greenland_event.300.d: "Plus tôt aujourd'hui, nous avons appris que le parlement danois a, comme prévu, approuvé notre vote pour la nouvelle loi d'autonomie. Ce sera un grand pas vers notre indépendance et donc vers un avenir que nous pourrons définir seuls."
 greenland_event.300.o1: "Attendez, ils pouvaient refuser ?"
 greenland_event.3.t: "Le Danemark bloque le vote"
 greenland_event.3.d: "Le parlement danois a jugé bon de refuser notre vote visant à étendre la loi d'autonomie interne par la nouvelle loi d'autonomie. Ils invoquent de prétendues préoccupations budgétaires, affirmant que notre prise de contrôle exigerait des subventions danoises plus élevées. Nous pourrions déclarer l'indépendance, ce qui provoquerait un conflit local, ou accepter la situation et nous préparer à des issues potentiellement pires."
 greenland_event.3.o1: "Se battre. Avec quelle armée ?"
 greenland_event.3.o2: "Pour le libre gouvernement du Groenland !!!"
 greenland_event.4.t: "Guerre déclarée !"
 greenland_event.4.d: "With the blocking of the Greenlandic Self Government Act vote, the government of Greenland has taken upon themselves to force their independence. As such we must secure all crown holdings and bring all overseas territories under control once more."
 greenland_event.4.o1: "Des Féroé au Groenland"
 greenland_event.5.t: "Réoutillage des investissements en automatisation"
 greenland_event.5.d: "Our economy is always struggling and it is simply because we don't have enough people. Our per capita is so unstable that book keepers sometimes don't even want to do our books because of the wildly changing influences of domestic expenses simply due to how our economy is constantly changing. As such we need a critical stabilization factor which in this instance will be a direct and comprehensive automation investment into a specific economic sector. The overall reduction in need for workers for said sector will hopefully greatly reduce the overall volatile nature of the economy."
 greenland_event.5.o1: "Le secteur agricole"
 greenland_event.5.o2: "Le secteur de la fabrication de guerre"
 greenland_event.5.o3: "Le secteur de la fabrication civile"
 greenland_event.5.o4: "Le secteur des bureaux et de la technologie"
 greenland_event.6.t: "La question minière"
 greenland_event.6.d: "With efforts to expand and start up commercialized mining operations the main question is posed. Do we mine based on need or based on greed? Based on need would see nominal resource extraction efforts tailored to the domestic needs of the nation. While based on greed would expand operations significantly for both domestic and foreign demands at the costs of increased workforce demands to meet proper operational expectations."
 greenland_event.6.o1: "Les besoins de notre nation"
 greenland_event.6.o2: "La fin justifie les moyens"
 greenland_event.7.t: "Ambitions politiques"
 greenland_event.7.d: "La scène étant dressée, notre peuple est à la fois excité et inquiet. Jamais une telle liberté de pensée n'avait paru possible lorsque nous n'étions qu'une colonie de la couronne danoise. Mais désormais, avec nos libertés nouvellement acquises, nous pouvons assurer la tranquillité d'esprit et forger l'avenir politique que nous désirons."
 greenland_event.7.o1: "Libre pensée absolue"
 greenland_event.7.o2: "Les idées émergentes sont vraies"
 greenland_event.7.o3: "Les esprits neutres prévalent"
 greenland_event.7.o4: "La fierté nationale fait avancer le pays"
 greenland_influence_event.1.t: "Investissements groenlandais"
 greenland_influence_event.1.d: "Le Groenland nous a fait une offre d'aide à l'investissement pour bâtir notre nation. S'il y a quelques inquiétudes sur la nature de ces investissements, l'île du Groenland, même développée, ne pose aucune véritable menace à notre situation intérieure face au reste des parties intéressées."
 greenland_influence_event.1.o1: "Les trucs gratuits, c'est bien"
 greenland_influence_event.1.o2: "Merci, mais non merci"
 greenland_influence_event.2.t: "L'Islande accepte les infrastructures"
 greenland_influence_event.2.d: "Notre premier investissement a été accepté : cela accroîtra notre influence et nos liens avec la nation."
 greenland_influence_event.2.o1: "Au suivant, s'il vous plaît"
 greenland_influence_event.3.t: "Énergie groenlandaise"
 greenland_influence_event.3.d: "Greenland has come to us with another investment this time in the energy sector. They wish to establish some helpful power generation facilities not particularly favoring a specific generation type. We could use the free energy generation facilities to foster better trade relations, but some worry that Greenland might be using these facilities to undermine our government."
 greenland_influence_event.3.o1: "Une énergie moins chère, ça ne se refuse pas"
 greenland_influence_event.3.o2: "Nos besoins énergétiques ne vous regardent pas"
 greenland_influence_event.4.t: "L'Islande accepte les installations énergétiques"
 greenland_influence_event.4.d: "Notre deuxième vague d'investissements pour les aider à bâtir leurs capacités de production d'électricité a été acceptée ; nous ne pouvons qu'espérer que s'ils ont besoin de combustible pour les centrales fossiles, ils commerceront avec nous pour continuer à favoriser de meilleures relations."
 greenland_influence_event.4.o1: "Envoyer le prochain investissement"
 greenland_influence_event.5.t: "Investissement dans les industries polaires"
 greenland_influence_event.5.d: "Greenland is back at it again this time with broad investments into our economic development. From industrial to office sector investments we're seeing that Greenland is really starting to pour maybe a little too much into our nation. Though it's not like they have much to spend on, we maybe should put the brakes on things here."
 greenland_influence_event.5.o1: "Une meilleure économie, pourquoi pas"
 greenland_influence_event.5.o2: "Nan. Je vois votre jeu"
 greenland_influence_event.6.t: "L'Islande accepte les investissements économiques"
 greenland_influence_event.6.d: "Notre portefeuille d'investissements croissant a été un grand succès : nous avons trouvé des moyens stratégiques de faire accepter au gouvernement islandais nos offres généreuses. Il ne nous reste plus qu'à capitaliser sur ces succès."
 greenland_influence_event.6.o1: "Un dernier tour de piste devrait suffire"
 greenland_influence_event.7.t: "Investissements dans les ressources stratégiques"
 greenland_influence_event.7.d: "Le Groenland a aidé à mener d'amples relevés géologiques et a trouvé des gisements commerciaux limités de fer, de cuivre, de nickel et d'autres ressources qui pourraient profiter à notre économie intérieure. Ils se sont aussi dits prêts à étendre notre industrie de l'aluminium pour compenser d'éventuelles pertes. Nous pourrions vraiment utiliser ces ressources pour réduire notre dépendance à certaines sources étrangères, mais pouvons-nous nous permettre de nous endetter autant auprès de notre voisin ?"
 greenland_influence_event.7.o1: "Nous avons vraiment besoin de ces ressources"
 greenland_influence_event.7.o2: "C'est trop risqué, refusé"
 greenland_influence_event.8.t: "L'art de la négociation"
 greenland_influence_event.8.d: "L'Islande a accepté notre investissement en ressources stratégiques : nous avons ainsi pu achever notre cycle total d'investissements. Dans cet esprit, nous avons désormais préparé le terrain pour sceller une union potentielle dans un avenir assez proche."
 greenland_influence_event.8.o1: "Ça vaut le coup"
 greenland_influence_event.10000.t: "Investissement rejeté"
 greenland_influence_event.10000.d: "L'Islande ayant rejeté notre proposition, nous n'avons plus officiellement d'options diplomatiques. Nous attendrons aussi longtemps que possible, mais l'heure de la fin de partie a sonné."
 greenland_influence_event.10000.o1: "Préparer l’Opération Real Green"
 greenland_subterfuge_event.1.t: "Grand investissement groenlandais"
 greenland_subterfuge_event.1.d: "Greenland has come to us with a most lucrative offer. They are willing to do a full wholesale round of investments to grow our nation. Such an opportunity seems almost outlandish in nature, but it's not like the island has much going for it. Besides, what could Greenland possibly do to affect us in the grander scheme of things."
 greenland_subterfuge_event.1.o1: "Merci pour votre générosité"
 greenland_subterfuge_event.1.o2: "This Is Too Good To Be True, Denied"
 greenland_subterfuge_event.2.t: "Iceland Accepts Our Generosity"
 greenland_subterfuge_event.2.d: "Le gouvernement islandais ayant accepté nos investissements robustes, nous pouvons désormais les utiliser pour troubler la paix et déplacer le statu quo juste assez pour isoler l'île de toute ingérence de l'OTAN."
 greenland_subterfuge_event.2.o1: "Maintenant, on attend"
 greenland_subterfuge_event.3.t: "Découvrir la source"
 greenland_subterfuge_event.3.d: "Recent fits of unrest and social discord seem to be tracing back to certain investments by Greenland. These new fronts have created a mild discomfort in our society however if we let it sit we could be looking at some real trouble down the road. It would be risky, but we can either choose to fight the continued shenanigans or we can settle the issue permanently by defeating the root cause."
 greenland_subterfuge_event.3.o1: "Ont-ils même une armée ?"
 greenland_subterfuge_event.3.o2: "Nous avons l'OTAN, ça ira"
 greenland_subterfuge_event.10000.t: "Investissement refusé"
 greenland_subterfuge_event.10000.d: "L'Islande a refusé notre meilleure offre ; s'ils n'acceptent pas, nous n'avons d'autre choix que de nous préparer au pire."
 greenland_subterfuge_event.10000.o1: "Préparer l’Opération Real Green"
 greenland_subterfuge_event.4.t: "Important investissement groenlandais"
 greenland_subterfuge_event.4.d: "Greenland has come to us with an offer. A comprehensive investment and exclusive trade deal. Greenland is willing to build up our infrastructure, zoning capabilities, civilian industrial base and apparently provide an exclusive lease on required material support trading for said investments. The final hook in the whole whale of an investment package is a direct large scale investment towards building up and extracting known deposits of oil around our waters. This is an extremely good deal and to be frank there's very little we can see wrong with it. But with being indebted to a specific nation what would we do about Denmark."
 greenland_subterfuge_event.4.o1: "Faisons un marché !"
 greenland_subterfuge_event.4.o2: "Non, ce n'est pas correct"
 greenland_subterfuge_event.5.t: "Îles Féroé Accepte"
 greenland_subterfuge_event.5.d: "Le gouvernement des îles Féroé a accepté nos investissements abondants : nous pouvons désormais commencer à travailler à notre avenir."
 greenland_subterfuge_event.5.o1: "Envoyer les agitateurs"
 greenland_subterfuge_event.6.t: "Les citoyens supplient le gouvernement"
 greenland_subterfuge_event.6.d: "Les événements récents ont commencé à s'aggraver : de plus en plus de citoyens de l'île supplient le gouvernement d'organiser un référendum sur la formation d'une Union nordique occidentale avec le Groenland. Beaucoup citent le geste apparemment bienveillant d'investissements pour le bien-être des insulaires, face à l'approche danoise du strict minimum. Sous une telle pression, nous sommes forcés d'accepter leurs demandes et pétitionnerons le gouvernement groenlandais."
 greenland_subterfuge_event.6.o1: "Féroé éternel"
 greenland_subterfuge_event.7.t: "Le pari paie"
 greenland_subterfuge_event.7.d: "La pression publique des citoyens féroïens a forcé leur gouvernement à pétitionner pour former une union avec notre nation. Cela nous est de bon augure, car cela suscitera sûrement une certaine agitation au sein du gouvernement danois."
 greenland_subterfuge_event.7.o1: "Un pas de plus"
 greenland_subterfuge_event.8.t: "Excusez-moi quoi ?!"
 greenland_subterfuge_event.8.d: "Des rapports indiquent que, d'une manière ou d'une autre, les forces armées groenlandaises viennent de s'installer aux îles Féroé et travaillent avec citoyens et responsables à un transfert pacifique du pouvoir. La question est : qui leur en a donné le droit. Nous n'avons pas été consultés et notre désintérêt général pour les îles n'a fait que se retourner contre nous. Si nous n'agissons pas, nous perdrons la face ; si nous agissons vite, nous serons seuls, car nous déclencherions des hostilités directes."
 greenland_subterfuge_event.8.o1: "On peut les prendre !"
 greenland_subterfuge_event.8.o2: "Juste qui ?"
 greenland_subterfuge_event.40000.t: "Investissement refusé"
 greenland_subterfuge_event.40000.d: "Les îles Féroé ont refusé notre meilleure offre ; s'ils n'acceptent pas, nous n'avons d'autre choix que de nous préparer au pire."
 greenland_subterfuge_event.40000.o1: "Commencer la mobilisation"
 greenland_subterfuge_event.9.t: "Investissements groenlandais"
 greenland_subterfuge_event.9.d: "Le Groenland nous a proposé une série d'investissements sans frais pour nous. Ils veulent se concentrer sur le développement des zones moins développées de la région du Jylland et favoriser la solidarité nordique. Toutefois, certains au gouvernement croient qu'ils poursuivent un agenda caché, tant les investissements semblent trop beaux pour être vrais. Cela dit, que peut réellement nous faire le Groenland ?"
 greenland_subterfuge_event.9.o1: "Les trucs gratuits ne sont pas à moitié mauvais"
 greenland_subterfuge_event.9.o2: "Je n'aime pas vos drôles de mots"
 greenland_subterfuge_event.10.t: "Le Danemark accepte"
 greenland_subterfuge_event.10.d: "Le gouvernement danois a accepté les investissements : nous commencerons désormais à préparer ce que nous avions prévu."
 greenland_subterfuge_event.10.o1: "La balle est dans leur camp"
 greenland_subterfuge_event.11.t: "Découvrir la source"
 greenland_subterfuge_event.11.d: "De récents accès d'agitation et de discours social semblent remonter à certains investissements du Groenland. Ces nouveaux fronts ont créé un léger malaise dans notre société ; toutefois, si nous laissons faire, de vrais ennuis pourraient nous attendre plus tard. Ce serait risqué, mais nous pouvons soit combattre ces manigances persistantes, soit régler définitivement la question en vainquant la cause première."
 greenland_subterfuge_event.11.o1: "Ont-ils même une armée ?"
 greenland_subterfuge_event.11.o2: "Nous avons l'OTAN, ça ira"
 greenland_subterfuge_event.90000.t: "Investissement refusé"
 greenland_subterfuge_event.90000.d: "Le Danemark a refusé notre meilleure offre ; s'ils n'acceptent pas, nous n'avons d'autre choix que de nous préparer au pire."
 greenland_subterfuge_event.90000.o1: "Préparer l'opération Middleman"
 greenland_subterfuge_event.12.t: "Investissements groenlandais"
 greenland_subterfuge_event.12.d: "Le Groenland nous a proposé une série d'investissements sans frais pour nous. Ils veulent se concentrer sur le développement des zones moins développées de la région du Nord-Norge et favoriser l'unité et la prospérité nordiques. Toutefois, certains au gouvernement croient qu'ils poursuivent un agenda caché, tant les investissements semblent trop beaux pour être vrais. Cela dit, que peut réellement nous faire le Groenland ?"
 greenland_subterfuge_event.12.o1: "Je peux accepter le gratuit"
 greenland_subterfuge_event.12.o2: "Nous nous en sortons très bien, merci"
 greenland_subterfuge_event.13.t: "La Norvège accepte"
 greenland_subterfuge_event.13.d: "The Norwegian government has accepted the investments and now we'll begin to prepare for what we're planning with the civilian population to distance the nation from NATO."
 greenland_subterfuge_event.13.o1: "Voyons ce qu'ils font"
 greenland_subterfuge_event.14.t: "Découvrir la source"
 greenland_subterfuge_event.14.d: "De récents accès d'agitation et de discours social semblent remonter à certains investissements du Groenland. Ces nouveaux fronts ont créé un léger malaise dans notre société ; toutefois, si nous laissons faire, de vrais ennuis pourraient nous attendre plus tard. Ce serait risqué, mais nous pouvons soit combattre ces manigances persistantes, soit régler définitivement la question en vainquant la cause première."
 greenland_subterfuge_event.14.o1: "Ont-ils même une armée ?"
 greenland_subterfuge_event.14.o2: "Nous avons l'OTAN, ça ira"
 greenland_subterfuge_event.120000.t: "Investissement refusé"
 greenland_subterfuge_event.120000.d: "La Norvège a refusé notre meilleure offre ; s'ils n'acceptent pas, nous n'avons d'autre choix que de nous préparer au pire."
 greenland_subterfuge_event.120000.o1: "Préparer l'opération Fjordsland"
 greenland_subterfuge_event.15.t: "Investissements groenlandais"
 greenland_subterfuge_event.15.d: "Le Groenland nous a proposé une série d'investissements sans frais pour nous. Ils veulent se concentrer sur le développement des zones moins développées autour de la ville de Karlstad et favoriser l'unité et la prospérité nordiques. Toutefois, certains au gouvernement croient qu'ils poursuivent un agenda caché, tant les investissements semblent trop beaux pour être vrais. Cela dit, que peut réellement nous faire le Groenland ?"
 greenland_subterfuge_event.15.o1: "Les trucs gratuits sont toujours gratuits"
 greenland_subterfuge_event.15.o2: "Nous déclinons humblement"
 greenland_subterfuge_event.16.t: "La Suède accepte"
 greenland_subterfuge_event.16.d: "The Swedish government has accepted the investments and now we'll begin to prepare for what we're planning with the civilian population to ensure a weaker central authority that is not so aligned with NATO."
 greenland_subterfuge_event.16.o1: "Maintenant nous attendons et planifions"
 greenland_subterfuge_event.17.t: "Découvrir la source"
 greenland_subterfuge_event.17.d: "De récents accès d'agitation et de discours social semblent remonter à certains investissements du Groenland. Ces nouveaux fronts ont créé un léger malaise dans notre société ; toutefois, si nous laissons faire, de vrais ennuis pourraient nous attendre plus tard. Ce serait risqué, mais nous pouvons soit combattre ces manigances persistantes, soit régler définitivement la question en vainquant la cause première."
 greenland_subterfuge_event.17.o1: "Ont-ils même une armée ?"
 greenland_subterfuge_event.17.o2: "Nous n'avons pas à nous soucier de ces insectes"
 greenland_subterfuge_event.150000.t: "Investissement refusé"
 greenland_subterfuge_event.150000.d: "La Suède a refusé notre meilleure offre ; s'ils n'acceptent pas, nous n'avons d'autre choix que de nous préparer au pire."
 greenland_subterfuge_event.150000.o1: "Préparer l'opération Grande guerre du Nord"
 greenland_subterfuge_event.18.t: "Investissements groenlandais"
 greenland_subterfuge_event.18.d: "Le Groenland nous a proposé une série d'investissements sans frais pour nous. Ils veulent se concentrer sur le développement de la région septentrionale moins développée de Lappi et favoriser l'unité et la prospérité nordiques. Toutefois, certains au gouvernement croient qu'ils poursuivent un agenda caché, tant les investissements semblent trop beaux pour être vrais. Cela dit, que peut réellement nous faire le Groenland ?"
 greenland_subterfuge_event.18.o1: "Une affaire que nous concluons, monsieur"
 greenland_subterfuge_event.18.o2: "Je ne crois pas, pas pour le moment"
 greenland_subterfuge_event.19.t: "La Finlande accepte"
 greenland_subterfuge_event.19.d: "Le gouvernement finlandais a accepté les investissements : nous commencerons désormais à préparer l'accomplissement de nos objectifs en isolant le gouvernement et en rendant la population plus réceptive à une plus grande union nordique."
 greenland_subterfuge_event.19.o1: "Viser une conclusion saine"
 greenland_subterfuge_event.20.t: "Découvrir la source"
 greenland_subterfuge_event.20.d: "De récents accès d'agitation et de discours social semblent remonter à certains investissements du Groenland. Ces nouveaux fronts ont créé un léger malaise dans notre société ; toutefois, si nous laissons faire, de vrais ennuis pourraient nous attendre plus tard. Ce serait risqué, mais nous pouvons soit combattre ces manigances persistantes, soit régler définitivement la question en vainquant la cause première."
 greenland_subterfuge_event.20.o1: "Ont-ils même une armée ?"
 greenland_subterfuge_event.20.o2: "Nous n'avons pas à nous soucier d'eux"
 greenland_subterfuge_event.180000.t: "Investissement refusé"
 greenland_subterfuge_event.180000.d: "La Finlande a refusé notre meilleure offre ; s'ils n'acceptent pas, nous n'avons d'autre choix que de nous préparer au pire."
 greenland_subterfuge_event.180000.o1: "Préparer l'opération Mannerheim"
 GRN_colonial_subsidy_TT: "§GRevenu supplémentaire :§! §Y$0,300§!"