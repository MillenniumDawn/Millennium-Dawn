 BOS_bosniak_lead_government: "보스니아크 주도 정부"
 BOS_bosniak_lead_government_desc: "보스니아크 주도 연립은 국가 기관을 우선시하며 서방과의 화해 또는 보다 대결적인 복수주의 노선 중 하나를 열게 될 것입니다."
