 cnc_eq_better_ergonomics: "Ergonomía"
 cnc_eq_better_ergonomics_desc: "La ergonomía es primordial a la hora de operar el equipamiento del día a día."
 strike_upgrade_1: "Supercrucero"
 strike_upgrade_1_desc: "Vuelo supersónico eficientemente sostenido sin necesidad de utilizar postquemadores (Supercruise)."
 strike_upgrade_2: "Sigilo de 2.ª gen."
 strike_upgrade_2_desc: "El rendimiento y las características de sigilo mejorados permiten una mayor intrusión y supervivencia en el espacio aéreo enemigo."
 strike_upgrade_3: "Controlado a distancia"
 strike_upgrade_3_desc: "Sacar al ser humano de la máquina permite realizar misiones mucho más peligrosas y diseñar aeronaves capaces de soportar mayores fuerzas G."
 computing_1: "Informática de macrocomputadoras"
 computing_1_desc: "Las computadoras grandes y de alta velocidad son utilizadas principalmente por grandes organizaciones para aplicaciones críticas, procesamiento masivo de datos y otros trabajos de gran volumen.\n"
 computing_2: "Microinformática"
 computing_2_desc: "La teoría de la microinformática proviene de la introducción de los microprocesadores en el campo de la computación. Su llegada ha permitido que las computadoras sean más potentes y ha aumentado su capacidad lógica, allanando el camino para un mayor uso de las computadoras personales en el hogar.\n"
 computing_3: "Informática mejorada"
 computing_3_desc: "Las computadoras se vuelven cada vez más populares a medida que pasa el tiempo. Ahora pueden asentarse cómodamente en un escritorio, lo que permite a las personas jugar, redactar documentos y disfrutar de muchas otras comodidades que antes nunca se habrían creído posibles.\n"
 computing_4: "Informática avanzada"
 computing_4_desc: "La introducción de las primerísimas computadoras de escritorio en su forma contemporánea a mediados de la década de 2000 dio paso a una explosión de la información. Las personas ahora tienen la capacidad de hacer muchísimo más.\n"
 computing_5: "Informática moderna"
 computing_5_desc: "Now technology in computers has proceeded so quickly that computers that were once in giant server boxes have now become as small as a tablet. Processing power is triple, if not five times, as powerful as it was at the invention of the very first computers.\n"
 computing_6: "Computación cuántica"
 computing_6_desc: "La computación cuántica comenzó a principios de la década de 1980 cuando el físico Paul Benioff propuso un al modelo de mecánica cuántica de la máquina de Turing. Más tarde, los científicos sugirieron que una computadora cuántica podría realizar simulaciones que están fuera del alcance de las computadoras convencionales. Los sistemas cuánticos prácticos iniciales utilizan cúbits controlados y corrección de errores para acelerar tareas especializadas en criptografía, investigación de materiales y simulaciones militares complejas.\n"
 computing_7: "Computación cuántica avanzada"
 computing_7_desc: "Los sistemas cuánticos avanzados amplían el número de cúbits lógicos fiables, mejoran los algoritmos cuánticos y se integran con las supercomputadoras clásicas, lo que permite un uso más práctico en la investigación militar, la logística y las comunicaciones seguras.\n"
 computing_8: "Procesadores cuánticos distribuidos"
 computing_8_desc: "Los procesadores cuánticos distribuidos vinculan múltiples módulos cuánticos en sistemas informáticos más grandes, aumentando la profundidad del circuito, la complejidad de los algoritmos y la escala de los problemas que se pueden resolver de manera fiable.\n"
 computing_9: "Supercomputación cuántica híbrida"
 computing_9_desc: "Las supercomputadoras cuánticas híbridas combinan aceleradores cuánticos con sistemas clásicos de alto rendimiento, utilizando cada arquitectura para las tareas que mejor maneja en la computación científica y estratégica a gran escala.\n"
 computing_10: "Supercomputación cuántica distribuida"
 computing_10_desc: "Las supercomputadoras cuánticas distribuídas conectan grandes matrices de procesadores tolerantes a fallos a través de sistemas especializados de control, redes y corrección de errores, lo que permite simulaciones avanzadas, optimización y análisis criptográfico.\n"
 computing_11: "Redes estratégicas de cómputo cuántico"
 computing_11_desc: "Strategic quantum compute networks link vast quantum processors and AI-driven control systems to coordinate and optimize military and industrial assets across the entire nation.\n"
 decryption_1: "Descifrado I"
 decryption_1_desc: "Las computadoras más nuevas y modernas hacen que el descifrado sea mucho más rápido y nos permiten utilizar nuevas técnicas para romper cualquier mensaje cifrado."
 decryption_2: "Descifrado II"
 decryption_2_desc: "Las computadoras más nuevas y modernas hacen que el descifrado sea mucho más rápido y nos permiten utilizar nuevas técnicas para romper cualquier mensaje cifrado."
 decryption_3: "Descifrado III"
