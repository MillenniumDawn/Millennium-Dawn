 COM_pro_federalist: "Résultats du référendum : pro-fédéraliste"
 COM_anti_federalist: "Résultats du référendum : gouvernement centraliste"
 COM_successful_operation: "L'opération est un succès"
 COM_robert_denard_seized_power: "§YRobert Denard§! s'est emparé du pouvoir"
 COM_expanded_private_military_operations: "Opérations militaires privées étendues"
 COM_disbanded_presidential_guard: "Dissous la §Ygarde présidentielle§!"
 COM_island_warlord: "Seigneur de guerre de l'île"
 COM_our_own_path: "Notre propre voie"
 COM_our_own_path_desc: "Il est temps pour les Comores de tracer leur propre cap. En façonnant notre armée aux besoins et défis uniques de notre nation, nous pouvons bâtir une force à la fois concentrée et adaptable. Développer notre propre doctrine garantira que nous soyons prêts à tout conflit, plutôt que de nous reposer sur des modèles étrangers inadaptés à nos circonstances."
 COM_spread_the_disarmament_education: "Diffuser l'éducation au désarmement"
 COM_spread_the_disarmament_education_desc: "Diffuser l'éducation au désarmement du UNREC nous aidera à désarmer notre armée et à encourager nos frères et sœurs africains à faire de même."
 COM_denounce_nuclear_weapons: "Dénoncer les armes nucléaires"
 COM_denounce_nuclear_weapons_desc: "Il est temps de montrer la voie en Afrique, de dénoncer les armes nucléaires du monde et de continuer à garantir que l'Afrique reste engagée dans la non-prolifération nucléaire."
 COM_east_african_disarmament: "Désarmement de l'Afrique de l'Est"
 COM_east_african_disarmament_desc: "La région est-africaine est le théâtre de nombreux conflits, et le désarmement de ces nations est crucial pour maintenir la paix et la stabilité. En coopérant avec l'Initiative de désarmement est-africaine, nous pouvons avancer vers le désarmement de notre armée et démontrer notre engagement pour un avenir pacifique et sûr pour la région."
 COM_peaceful_disarmament: "Désarmement pacifique"
 COM_peaceful_disarmament_desc: "Nous devrions montrer la voie en Afrique, désarmer notre armée et démontrer notre engagement pour un avenir pacifique et sûr du continent africain en désarmant notre nation."
 COM_total_ban_on_personal_weapons: "Interdiction totale des armes personnelles"
 COM_total_ban_on_personal_weapons_desc: "Il est temps d'interdire toutes les armes personnelles dans notre nation et de mener une campagne ciblée de rachat de toutes les armes auprès de nos citoyens."
 COM_new_african_pacifism: "Nouveau pacifisme africain"
 COM_new_african_pacifism_desc: "Encourager toutes les nations africaines à aborder une nouvelle ère de paix et de pacifisme armé ne pourra que nous offrir un avenir fort, stable et prospère."
 COM_a_shining_example_of_peace: "Un exemple éclatant de paix"
 COM_a_shining_example_of_peace_desc: "Nous devrions être un exemple éclatant de paix et de désarmement pour le reste de l'Afrique. En désarmant notre armée et en démontrant notre engagement pour un avenir pacifique et sûr du continent, nous pouvons inspirer d'autres nations à faire de même."
 COM_expanded_military_industries: "Industries militaires étendues"
 COM_expanded_military_industries_desc: "Les industries militaires de [COM.GetName] ont un besoin désespéré de revitalisation alors que la nation continue de sous-traiter la production d'armements militaires."
 COM_invite_the_pmcs: "Inviter les SMP"
 COM_invite_the_pmcs_desc: "Diverses sociétés militaires privées à travers l'Afrique et le monde seraient d'excellents choix pour compléter nos forces de sécurité et de défense. Nous devrions les contacter et les inviter à potentiellement élargir notre capacité de combat si l'appel aux armes retentit jamais."
 COM_expand_the_presidential_guard: "Étendre la garde présidentielle"
 COM_expand_the_presidential_guard_desc: "La garde présidentielle est l'une des pierres angulaires de notre grande nation et une force de combat d'élite en Afrique de l'Est. Nous devrions déployer un autre régiment de ces combattants pour soutenir nos ambitions sur la côte est-africaine."
 COM_reform_defunct_pmc_units: "Reconstituer les unités de SMP défuntes"
 COM_reform_defunct_pmc_units_desc: "Plusieurs sociétés militaires privées disparues peuvent être retracées soit aux divers conflits d'Afrique, soit aux Comores, et il est temps désormais de les contacter et de reformer ces unités avec les Comores comme base."
 COM_expand_the_defense_force: "Réorganiser la force de défense"
 COM_expand_the_defense_force_desc: "La force de défense comorienne est le dernier tiers de nos unités armées : nous devrions les réorganiser pour qu'elles travaillent en parfaite harmonie avec le CSF proprement dit."
 COM_homegrown_military_manufacturing: "Fabrication militaire nationale"
 COM_homegrown_military_manufacturing_desc: "[COM.GetName] n'est pas connu pour la fabrication militaire, mais si nous continuons à soutenir les entreprises locales et à favoriser de nouvelles organisations industrielles militaires dans notre nation."
 COM_the_eastern_african_entrepot: "L'entrepôt de l'Afrique orientale"
 COM_the_eastern_african_entrepot_desc: "Les Comores occupent une position extrêmement avantageuse pour devenir le hub économique de la côte est-africaine. Nous devrions élargir nos ports et chercher à développer et formaliser des partenariats économiques beaucoup plus complets avec d'autres nations."
 COM_expand_the_prince_said_irabhim_airport: "Élargir l'aéroport Prince Saïd Ibrahim"
 COM_expand_the_prince_said_irabhim_airport_desc: "L'aéroport a ouvert en 1975 et est le seul aéroport international des Comores ainsi que le hub de la compagnie nationale, Comoros Aviation."
 COM_expand_available_helicopters: "Développez les hélicoptères disponibles"
 COM_expand_available_helicopters_desc: "Notre flotte actuelle d'hélicoptères est dépassée et doit être remplacée. En acquérant de nouveaux hélicoptères, nous pouvons renforcer nos capacités et garantir que nous soyons prêts à sécuriser efficacement la nation et à répondre à toute menace contre notre souveraineté."
 COM_comorian_politics: "Politique comorienne"
 COM_comorian_politics_desc: "La puissance militaire n'est que la moitié de l'équation de la politique internationale : nous devrions aussi former nos diplomates afin d'étendre notre portée au-delà de nos propres rives."
 COM_social_democracy_in_africa: "Diamant social-démocrate d'Afrique"
 COM_social_democracy_in_africa_desc: "La social-démocratie offre une approche équilibrée de la gouvernance, combinant économies de marché et politiques sociales visant à réduire les inégalités, améliorer l'accès à l'éducation et aux soins, et favoriser un développement durable. En adoptant des principes sociaux-démocrates, les Comores peuvent ouvrir la voie à une croissance inclusive et à un avenir plus radieux pour leurs citoyens."
 COM_a_true_democracy: "La vraie démocratie"
 COM_a_true_democracy_desc: "En restant fermes dans leur engagement envers les idéaux démocratiques, les Comores peuvent favoriser la stabilité, promouvoir la croissance économique, sauvegarder les droits de l'homme et autonomiser leurs citoyens, autant d'éléments cruciaux pour une prospérité durable."
 COM_our_partnership: "Partenariat avec les États-Unis"
 COM_our_partnership_desc: "Un partenariat stratégique avec les États-Unis peut s'avérer déterminant. Cet article vise à souligner les raisons convaincantes pour lesquelles les Comores devraient embrasser la coopération avec les États-Unis, car elle peut ouvrir des portes d'opportunités, renforcer la stabilité économique, promouvoir les avancées technologiques et favoriser le progrès social."
 COM_anti_nato_ally: "La SMP Wagner aux Comores"
 COM_anti_nato_ally_desc: "Nous devons inviter la SMP Wagner dans notre pays pour qu'elle soit embauchée par notre gouvernement. La France voudra peut-être nous protéger, mais avoir notre propre force solide est toujours mieux !"
 COM_clearing_the_nomenclature: "Clarifier la nomenclature"
 COM_clearing_the_nomenclature_desc: "Clarifier la nomenclature devrait être notre priorité pour notre nouveau programme ! Pourquoi ces agaçants conciliateurs de l'Ouest devraient-ils seulement ouvrir la bouche pour faire du bruit autour de notre nouveau gouvernement sacré ?"
 COM_pan_arabism: "Panislamisme"
 COM_pan_arabism_desc: "Bien que nous soyons une exception géographique, en nous concentrant sur ce qui nous unit au reste du monde arabe, nous pouvons engendrer un sentiment de fraternité destiné à durer éternellement."
 COM_the_warrior_king: "Le roi guerrier"
 COM_the_warrior_king_desc: "Denard a saisi le pouvoir dans [COM.GetName]. Homme du peuple, homme de l'armée et homme des sociétés militaires privées, il peut désormais porter le titre de \\"Roi guerrier\\". Nous pouvons nous préparer à soutenir divers gouvernements dans les différents conflits du monde pour gagner de l'argent et établir [COM.GetName] comme le foyer de premier plan de toutes les SMP du monde."
 COM_the_consolidation_of_power: "La consolidation du pouvoir"
 COM_the_consolidation_of_power_desc: "Bien que nous régnions par l'épée, nous devons encore consolider notre pouvoir dans l'archipel, sinon nous risquons de perdre tout ce que nous avons gagné. Il est temps de consolider notre pouvoir."
 COM_legitimize_our_rule: "Légitimer notre règne"
 COM_legitimize_our_rule_desc: "Notre priorité devrait désormais être de légitimer notre règne, soit par notre propre administration, soit en demandant la reconnaissance des grandes puissances de la région."
 COM_declare_the_state_of_pmcs: "Déclarer l'État des SMP"
 COM_declare_the_state_of_pmcs_desc: "Maintenant que notre pays est établi et que notre règne a été légitimé et sécurisé, nous pouvons officiellement consacrer et protéger l'État des sociétés militaires privées. Établir l'État des sociétés militaires privées verra un afflux important de croissance économique et étendra notre influence à l'étranger... du moins l'espérons-nous."
 COM_a_rifle_for_hire: "Un fusil à louer"
 COM_a_rifle_for_hire_desc: "En nationalisant certaines sociétés militaires privées et en louant notre armée à la manière des mercenaires, nous pouvons continuer à accroître notre part et notre division des profits."
 COM_expanded_regional_operations: "Opérations régionales élargies"
 COM_expanded_regional_operations_desc: "Établir les opérations de notre armée et étendre ses capacités nous permettra de projeter nos forces vers diverses parties de la région."
 COM_expanded_global_operations: "Opérations mondiales étendues"
 COM_expanded_global_operations_desc: "Maintenant que notre société militaire privée a été financée et soutenue, nous pouvons lancer nos forces vers divers conflits mondiaux plutôt que seulement africains."
 COM_the_zanzibar_agreement: "L'accord de Zanzibar"
 COM_the_zanzibar_agreement_desc: "Nous avons approché [253.OWNER.GetName] pour travailler à un accord visant à négocier la vente de [253.GetName] afin d'élargir le territoire disponible du pays. Nous avons établi un accord de transfert d'État ainsi qu'une proposition."
 COM_anti_colonialist_propaganda: "Propagande anticolonialiste"
 COM_anti_colonialist_propaganda_desc: "Il y a beaucoup de pays africains qui ont été laissés pour compte lorsque les Français se sont retirés d'Afrique. Avec le bon cadrage de la situation, nous pouvons mettre beaucoup de gens très en colère très vite."
 COM_the_constitutional_referendum: "Le référendum sur la fédération"
 COM_the_constitutional_referendum_desc: "Le statut juridique des îles individuelles des Comores est incertain depuis quelque temps, aussi un référendum a-t-il été convoqué pour approuver ou rejeter des amendements à la Constitution permettant aux Comores de former une fédération."
 COM_greater_inter_island_cooperation: "Une plus grande coopération inter-insulaire"
 COM_greater_inter_island_cooperation_desc: "La situation Bacar nous a montré que l'autonomie peut déraper : nous devrions en tirer les leçons et favoriser une plus grande coopération entre les îles."
 COM_the_tourism_industry: "L'industrie touristique"
 COM_the_tourism_industry_desc: "En tant que nation insulaire, le tourisme est un point focal important de la composition économique du pays. Les visiteurs du monde entier peuvent choisir de randonner sur le volcan Karthala, au parc marin de Mohéli, et sur les plages et jungles diverses qui couvrent les îles de l'archipel, la majorité du tourisme se concentrant autour d'Anjouan et de Grande Comore, ainsi que la culture unique mêlant Arabes, Africains et Français en une harmonie merveilleuse."
 COM_agricultural_developments: "Développements agricoles"
 COM_agricultural_developments_desc: "L'agriculture forme l'épine dorsale de notre économie, employant la majorité de notre population et produisant nos exportations les plus précieuses. En investissant dans des techniques agricoles modernes, des infrastructures d'irrigation et l'éducation agricole, nous pouvons accroître la productivité et garantir la sécurité alimentaire de notre peuple."
 COM_fishery_industry_investment: "Investissements dans l’industrie de la pêche"
 COM_fishery_industry_investment_desc: "En tant que nation insulaire, les eaux entourant les Comores sont riches en vie marine. Investir dans notre industrie de la pêche fournira non seulement de l'emploi aux communautés côtières, mais créera aussi une industrie d'exportation durable capable de rivaliser sur les marchés internationaux."
 COM_comorian_forestry: "Foresterie comorienne"
 COM_comorian_forestry_desc: "Nos îles sont couvertes de forêts tropicales luxuriantes offrant de précieuses ressources en bois. En mettant en œuvre des pratiques forestières durables et une gestion adéquate, nous pouvons développer ce secteur tout en préservant notre environnement naturel pour les générations futures."
 COM_join_the_world_trade_organization: "Rejoindre l'Organisation mondiale du commerce"
 COM_join_the_world_trade_organization_desc: "L'adhésion à l'Organisation mondiale du commerce ouvrira de nouveaux marchés à nos exportations, nous donnera une voix dans les négociations commerciales internationales et nous aidera à nous intégrer plus pleinement à l'économie mondiale. Les mécanismes de règlement des différends de l'OMC protégeront aussi nos intérêts économiques à l'étranger."
 COM_trade_deals_with_madagascar: "Accords commerciaux avec Madagascar"
 COM_trade_deals_with_madagascar_desc: "Madagascar est notre plus proche voisin et un partenaire commercial naturel. Renforcer les liens économiques avec eux réduira les coûts de transport, augmentera les volumes d'échanges et favorisera une coopération régionale bénéfique aux deux nations."
 COM_trade_deals_with_tanzania: "Accords commerciaux avec la Tanzanie"
 COM_trade_deals_with_tanzania_desc: "La Tanzanie est un hub économique majeur d'Afrique de l'Est, fortement connecté à la région élargie. Établir des accords commerciaux d'ensemble avec elle nous donnera un meilleur accès au marché est-africain et renforcera notre position dans les réseaux commerciaux régionaux."
 COM_cooperation_with_east_africa: "Coopération avec l'UAE"
 COM_cooperation_with_east_africa_desc: "Le concept d'une Union est-africaine (UAE) envisage une initiative d'intégration régionale rassemblant les pays d'Afrique de l'Est en une entité économique, politique et sociale unifiée. S'il n'existe actuellement aucune Union est-africaine formelle, des efforts sont en cours pour promouvoir la coopération et l'intégration régionales parmi les nations est-africaines."
 COM_trading_with_east_africa: "Investissements en Afrique de l'Est"
 COM_trading_with_east_africa_desc: "Investir les uns chez les autres dans le cadre d'une Union est-africaine (UAE) recèle un grand potentiel pour le développement économique et la prospérité de la région. En promouvant les investissements intra-régionaux, les nations est-africaines peuvent mobiliser leurs ressources, expertises et marchés collectifs pour favoriser la croissance, créer des emplois et réduire la dépendance aux acteurs extérieurs. De tels investissements peuvent prendre diverses formes et contribuer à de multiples secteurs, dont les infrastructures, l'agriculture, l'industrie, les services et la technologie."
 COM_state_of_the_pmcs_idea: "État des SMP"
 COM_state_of_the_pmcs_idea_desc: "En reconnaissant et en soutenant officiellement les sociétés militaires privées comme institutions légitimes au sein de notre nation, nous avons créé un modèle économique unique où les SMP contribuent de façon significative à notre PIB et à nos capacités militaires. L'État facilite activement leurs opérations en échange de garanties de sécurité et d'avantages économiques."
 COM_expanded_regional_operations_idea: "Opérations régionales élargies"
 COM_expanded_regional_operations_idea_desc: "Nos forces militaires et de SMP sont désormais capables de se déployer dans toute la région est-africaine. Cette portée opérationnelle élargie nous permet de prendre des contrats de sécurité, des missions de maintien de la paix et des opérations d'appui militaire dans les États voisins."
 COM_expanded_global_operations_idea: "Opérations mondiales étendues"
 COM_expanded_global_operations_idea_desc: "Avec un financement et un soutien suffisants, nos forces militaires privées peuvent désormais accepter des contrats dans le monde entier plutôt que de limiter leurs opérations à l'Afrique. Cette portée mondiale accroît nettement le potentiel de recettes et établit les Comores comme un acteur majeur de l'industrie internationale de la sécurité."
 COM_comorian_political_decisions: "Décisions politiques [COM.GetAdjective]"
 COM_comorian_political_decisions_desc: "Décisions politiques clés concernant l'appareil de sécurité des Comores et les politiques mercenaires."
 COM_disband_the_presidential_guard_decision: "Dissoudre la garde présidentielle"
 COM_disband_the_presidential_guard_decision_desc: "La garde présidentielle est devenue un symbole de la règle autoritaire et de l'influence mercenaire aux Comores. Dissoudre cette force signalera une nouvelle ère de gouvernance démocratique, bien qu'elle puisse nous laisser vulnérables à de futures menaces de sécurité."
 COM_hire_control_risks_decision: "Former l'aile paramilitaire du Control Risks Group"
 COM_hire_control_risks_decision_desc: "Control Risks Group est un cabinet britannique de conseil en risques pouvant fournir des services de sécurité professionnels. Plus coûteux que d'autres options, sa réputation de discrétion et de professionnalisme en fait un choix idéal pour maintenir la stabilité dans notre nation fragile."
 COM_hire_executive_outcomes_decision: "Reconstituer Executive Outcomes"
 COM_hire_executive_outcomes_decision_desc: "Executive Outcomes est une société militaire privée sud-africaine à la réputation controversée. Son expérience des zones de conflit africaines pourrait nous apporter une expertise militaire significative, bien que sa présence puisse susciter des inquiétudes internationales et déstabiliser notre gouvernement."
 COM_hire_defense_systems_decision: "Reconstituer Defense Systems"
 COM_hire_defense_systems_decision_desc: "Defense Systems Limited est une société militaire privée britannique qui opérait pendant la guerre froide. Réformer cette organisation pourrait nous fournir des contractants de sécurité expérimentés, familiers des complexités de la défense d'une petite nation insulaire."
 COM_hire_watchguard_decision: "Reconstituer Watchguard"
 COM_hire_watchguard_decision_desc: "WatchGuard International était une société militaire privée britannique qui a cessé ses activités en 1972. Relancer cette organisation nous donnerait accès à des mercenaires au palmarès éprouvé, bien que leurs tactiques agressives puissent nuire à notre réputation internationale."
 COM_reform_7_independent_company_decision: "Réformer la 7 Independent Company"
 COM_reform_7_independent_company_decision_desc: "La 7 Independent Company était la compagnie de Bob Denard en Rhodésie. Réformer cette unité permettra une unité spécifiquement loyale à notre roi guerrier, mais elle sera loyale à Denard."
 comoros.33.a: "Les termes sont acceptables."
 comoros.33.b: "Notre territoire n'est pas à vendre !"
