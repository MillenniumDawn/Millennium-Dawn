l_simp_chinese:
 slovenia.9.t: "斯洛文尼亚加入北约"
 slovenia.9.d: "在北约历史上规模最大的一次扩容中，斯洛文尼亚的国旗与另外六个新成员国一同在布鲁塞尔北约总部升起。独立十三年后，斯洛文尼亚正式加入北约第五条款的保护伞之下。"
 slovenia.9.a: "世界上最安全的地方"
 slovenia.10.t: "斯洛文尼亚加入欧盟"
 slovenia.10.d: "午夜时分，奥地利、意大利和匈牙利边境的栅栏在烟火和铜管乐队的伴奏下被移除。斯洛文尼亚作为十个新成员国中最富裕的国家加入欧盟，首批结构性资金已指定用于公路和铁路建设。"
 slovenia.10.a: "回到欧洲核心圈"
 slovenia.11.t: "托拉尔让位于欧元"
 slovenia.11.d: "斯洛文尼亚是首个采用欧元的欧元新成员国，在使用了十五年后正式退役了托拉尔。货币转换过程十分顺利，预计更低的借贷成本将使斯洛文尼亚经济增速高于欧元区平均水平。"
 slovenia.11.a: "告别托拉尔"
 slovenia.12.t: "申根区开放边境"
 slovenia.12.d: "斯洛文尼亚已加入申根区，奥地利、意大利和匈牙利边境口岸的最后几个护照检查站正在拆除。克罗地亚边境现在构成欧盟的外部边界，并按照布鲁塞尔的标准进行警务管理。"
 slovenia.12.a: "没有检查站的欧洲"
