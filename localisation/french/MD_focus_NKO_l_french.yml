 NKO_tank_production_trait4A: "Fiabilité coréenne"
 NKO_tank_production_trait2: "Défense prête à l'emploi"
 NKO_tank_production_trait2A: "Le blindage KIM"
 NKO_tank_production_trait2B: "Attrape-mouches"
 NKO_tank_production_trait2C: "Dur comme notre résolution coréenne"
 NKO_tank_production_trait3: "Améliorer notre industrie"
 NKO_tank_production_trait3A: "Améliorations industrielles"
 NKO_tank_production_trait3B: "Réduction des coûts"
 NKO_tank_production_trait3C: "Mise à niveau des capacités"
 NKO_tank_production_trait3D: "Produit fiable"
 korea_russia.53.t: "Technologie sous-marine"
 korea_russia.53.d: "La Russie nous a fourni une meilleure technologie pour améliorer nos sous-marins, grâce à la volonté du dirigeant nord-coréen de développer des sous-marins à propulsion nucléaire."
 korea_russia.53.a: "Béni soit notre Dirigeant"
 korea.135.t: "L'opération de piratage a réussi"
 korea.135.d: "Nos pirates informatiques ont infiltré les infrastructures bancaires des nations occidentales et siphonné des fonds importants. Une partie s'est perdue dans les canaux du rapatriement, mais l'opération a réussi."
 korea.135.a: "Excellent travail"
 korea.136.t: "La Corée du Nord nous a piratés"
 korea.136.d: "Des pirates nord-coréens ont lancé une cyberattaque contre nos infrastructures bancaires pour siphonner des fonds. Nous devrions riposter par nos propres opérations — ou en appeler à la communauté internationale."
 korea.136.a: "Inattendu"
 korea.137.t: "La drogue inonde nos rues"
 korea.137.d: "Une nouvelle vague de drogue a inondé nos rues. La source reste non confirmée, mais nous devons agir avec prudence : la productivité en souffre déjà."
 korea.137.a: "Soutenir les toxicomanes"
 korea.137.b: "Que pouvons-nous faire"
 korea.138.t: "L’opération antidrogue a réussi."
 korea.138.d: "Une nouvelle vague de drogue a inondé les rues de nos ennemis. Ils devront dépenser pour contenir la crise, tandis que nous en tirons un modeste profit. Un investissement continu dans l'agence maintiendra le flux d'argent."
 korea.138.a: "Bien joué!"
 korea.139.t: "Opération de faux dollars"
 korea.139.d: "Nous avons imprimé de faux billets de 100 $ et les diffuserons par des canaux occultes sur les marchés étrangers, en blanchissant les produits via notre réseau de marché noir. Un revenu régulier de ce schéma financera d'autres opérations."
 korea.139.a: "Bien joué !"
 NKO_korean_russian_friendship: "Traité de partenariat stratégique global nord-coréen–russe"
 NKO_korean_russian_friendship_desc: "Le traité de partenariat de 2024 lie Pyongyang et Moscou dans un pacte de sécurité mutuelle, chaque partie s'engageant à venir à la défense de l'autre. Le commerce, l'énergie et la coopération technologique s'approfondissent aux côtés des garanties formelles."
