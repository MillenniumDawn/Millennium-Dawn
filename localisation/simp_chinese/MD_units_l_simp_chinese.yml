 multi_role_fighter: "多用途战斗机"
 cv_multi_role: "舰载多用途战斗机"
 cas: "近距支援机"
 strat_bomber: "战略轰炸机"
 transport_plane: "运输机"
 attack_helicopter: "攻击直升机"
 Air_UAV: "作战无人机"
 transport_helicopter: "运输直升机"
 Militia_Bat: "民兵"
 Militia_Bat_desc: "徒步民兵营。民兵部队的特点是装备和通讯工具比普通步兵少。这使它们在恶劣地形上有很强的机动性和作战效率，但在平坦地形上，它们会在对抗装甲敌人时灰飞烟灭。\n\n§G设计师提示：民兵作战宽度较小并具有镇压能力。他们在城市、森林和丘陵中表现最佳，但防御和突破能力较差，尤其易受装甲部队及开阔或恶劣地形中的战斗影响。§!"
 Mot_Militia_Bat: "摩托化民兵"
 Mot_Militia_Bat_desc: "有皮卡甚至装甲多用途车的民兵营。民兵部队的特点是装备和通讯工具比普通步兵少。这使它们在恶劣地形上有很强的机动性和作战效率，但在平坦地形上，它们会在对抗装甲敌人时灰飞烟灭。\n\n§G设计师提示：摩托化民兵以稍高的成本换取速度和更强的镇压能力。可将他们用于机动安保以及在平原或沙漠中进行低成本推进，但他们薄弱的战斗属性和恶劣地形惩罚使其不适合作为突击部队。§!"
 L_Inf_Bat: "轻步兵"
 L_Inf_Bat_desc: "无运输工具的轻步兵。在现代战场上很少见到，但在非常困难的地形，如丛林和山脉中有专门的单位——在那里他们是非常有效的。也可作为城市驻军。\n\n§G设计师提示：轻步兵拥有高组织度并在丘陵、森林、山地、丛林、沼泽和城市中拥有较好的战斗表现，且无需车辆。他们可用于防守或进攻复杂地形，但注意，这些部队战略移动缓慢，且在平原和沙漠上相对较弱。§!"
 Mot_Inf_Bat: "摩托化步兵"
 Mot_Inf_Bat_desc: "摩托化步兵使用各种车辆作为运输工具，从小卡车到现代的防雷车辆。它们非常适合在山区和城市地区作战。\n\n§G设计师提示：摩托化步兵在具有经济性的同时拥有高速度和在开阔地形中的良好表现。可用于扩大突破并快速支援前线，但其车辆增加了装备需求，并在森林、山地、丛林、沼泽和城市中效果不佳。§!"
 Mech_Inf_Bat: "机械化步兵"
 Mech_Inf_Bat_desc: "机械化步兵使用装甲人员运输车作为运输工具。它们很适合在平坦的地形上进行装甲战斗。\n\n§G设计师提示：机械化步兵具有强大的防御力与装甲机动性，在平原和沙漠地形中表现良好。可用于快速装甲编队中稳固战线，但装甲运兵车成本高昂，且在森林、山地、丛林和城市地形中攻击与机动能力受限。§!"
 Arm_Inf_Bat: "装甲步兵"
 Arm_Inf_Bat_desc: "装甲步兵使用步兵战车作为运输工具。他们很适合平坦地形的装甲战斗，但会在困难地形中产生损耗，因为他们必须在离步兵战车很远的地方徒步作战。\n\n§G设计师提示：装甲步兵使用步兵战车，相比机械化步兵拥有更强的火力、装甲与突破能力。可在开阔地形中与坦克协同作战，但其组织度较低、装备成本高昂，且在山区、丛林、沼泽和城市地形中受到严重惩罚，需要谨慎部署。§!"
 L_Air_Inf_Bat: "空降步兵"
 L_Air_Inf_Bat_desc: "空降轻步兵是精锐步兵，接受过特殊训练，可以从运输机或运输直升机上跳伞空降。他们可以从远处迅速对紧急情况做出反应，并能在主力军队推进前插入敌后夺取重要目标。不过，他们的运输方式对他们能携带的重型设备数量有严格的限制。\n\n§G设计师提示：空降步兵兼具高组织度、空降能力以及在复杂地形中的出色表现。可用于夺取并坚守孤立目标，但其特种部队训练要求与较高的步兵装备需求使其不适用于常规战线作战，成本较高。§!"
 Mot_Air_Inf_Bat: "空降摩托化步兵"
 Mot_Air_Inf_Bat_desc: "空降摩托化步兵是精锐步兵，接受过特殊训练，可以从运输机或运输直升机上跳伞空降。他们可以从远处迅速对紧急情况做出反应，并能在主力军队推进前插入敌后夺取重要目标。他们的多用途车使他们在突击时具有很大的机动性，并允许他们携带更多的重型装备投入战斗。然而，将他们和车辆一起运输需要更多的后勤保障。\n\n§G设计师提示：摩托化空降步兵在空降后具备更快的机动速度，并在开阔地形中表现良好。适用于空降部队需要快速扩大战果或快速增援的情景。但与徒步空降部队相比，车辆增加了装备负担，降低了组织度，且在复杂地形中的表现有所削弱。§!"
 Mech_Air_Inf_Bat: "空降机械化步兵"
 Mech_Air_Inf_Bat_desc: "空降机械化步兵是精锐步兵，接受过特殊训练，可以从运输机或运输直升机上跳伞空降。他们可以从远处迅速对紧急情况做出反应，并能在主力军队推进前插入敌后夺取重要目标。他们特别设计的轻型装甲输送车在突击时具有极大的机动性，并允许他们携带比轻型空降部队更多的重型装备进入战斗。然而，将他们和这些车辆一起运输需要更多的后勤保障。\n\n§G设计师提示：机械化空降步兵为伞降部队提供装甲输送车的防护、速度与更强火力。适用于孤立空降部队着陆后须在机动战斗中生存的场景。然而其组织度较低、装备需求较高，且在复杂地形中受到严重惩罚，是一种昂贵的专业化选择。§!"
 Arm_Air_Inf_Bat: "空降装甲步兵"
 Arm_Air_Inf_Bat_desc: "空降装甲步兵是精锐步兵，接受过特殊训练，可以从运输机或运输直升机上跳伞空降。他们可以从远处迅速对紧急情况做出反应，并能在主力军队推进前插入敌后夺取重要目标。特别设计的轻型步兵战车给了他们极大的机动性，并允许他们在同等条件下与普通机械化编队作战。然而，运输他们连同步兵战车是非常苛刻的后勤要求。截至2017年，只有俄罗斯有过这样的军事行动。\n\n§G设计师提示：装甲空降步兵通过伞降方式提供步兵战车的火力、装甲与突破能力。适用于争夺设防目标或在插入后对抗敌方机动预备队。但其装备负担极高、组织度低，且在复杂地形中受到惩罚，损失代价高昂。§!"
 L_Marine_Bat: "海军陆战步兵"
 L_Marine_Bat_desc: "海军陆战队步兵是精锐步兵，接受过两栖作战的特殊训练，如渡河、沼泽作战和两栖入侵。不过他们没有车辆，携带重型设备的能力受到严格限制。\n\n§G设计师提示：海军陆战队步兵提供高组织度与强大的两栖及沼泽作战能力，且不需要车辆。可用于建立滩头阵地并在两栖环境中作战。但登陆后机动速度较慢，占用特种部队容量，且在开阔地形中效能较低。§!"
 Mot_Marine_Bat: "摩托化海军陆战步兵"
 Mot_Marine_Bat_desc: "摩托化装甲海军陆战队步兵是精锐步兵，接受过两栖作战的特殊训练，如渡河、沼泽作战和两栖入侵。他们下船时是轻步兵，但拥有通用载具作为陆地运输工具，这给予了他们极大的机动性，并允许他们携带大量重型装备进入战斗。\n\n§G设计师提示：摩托化海军陆战队步兵在拥有强大两栖作战加成同时获得了更快的速度，以便从滩头阵地迅速向内陆扩张。适用于登陆部队需快速向纵深推进的场景。但与徒步陆战队相比，车辆增加了装备成本，并降低了组织度和山地作战效能。§!"
 Mech_Marine_Bat: "机械化海军陆战步兵"
 Mech_Marine_Bat_desc: "机械化装甲海军陆战队步兵是精锐步兵，接受过两栖作战的特殊训练，如渡河、沼泽作战和两栖入侵。他们在特殊设计的两栖装甲人员运输车保护下登陆，他们的装备非常好，可以携带大量的重型装备投入战斗。\n\n§G设计提示：机械化海军陆战队将两栖作战加成与装甲运兵车防护及登陆后的强大机动性相结合。适用于扩大并坚守机械化滩头阵地。但组织度低于徒步陆战队，且载具在森林和山地地形中表现不佳。§!"
 Arm_Marine_Bat: "装甲海军陆战步兵"
 Arm_Marine_Bat_desc: "装甲海军陆战队是精锐步兵，接受过两栖作战专项训练，包括渡河、沼泽作战和两栖登陆。他们能够乘坐重型装甲喷水推进两栖步兵战车在水面上长距离机动，并在登陆后立即熟练地依托其投入战斗。\n\n§G设计师提示：装甲陆战队提供海军陆战队步兵中最强的步兵战车火力、装甲和城市作战能力，同时保留两栖作战加成。可用于攻击重兵设防的港口。但其组织度低、成本高昂，且在山区和丛林地形中受到严重惩罚，需要轻装部队负责复杂的内陆地形。§!"
 L_Air_assault_Bat: "空中突击步兵"
 L_Air_assault_Bat_desc: "空中突击步兵是精锐步兵，接受过绳降和空中运输专项训练，其装备有时经过专门设计或战地改装，以便更好地在飞机内运输。他们常被用于夺取并坚守尚未完全控制的关键地形，并在敌后直接与敌军交战。\n\n§G设计师提示：空中突击步兵使用运输直升机进行快速行动，并在大多数复杂地形中获得战斗加成。可用于夺取偏远的丘陵、森林、山地、丛林、沼泽或城市地带。但其HP值低、堑壕构筑能力差，且直升机成本高昂，使其难以胜任长时间战线作战。§!"
 Special_Forces: "特种作战部队"
 Special_Forces_desc: "特种作战部队是任何军队中的精锐，接受比其他任何兵种更漫长、更严苛的训练。他们是复杂地形、空降作战和两栖登陆的专家。然而，由于可能需要在战线后方保持机动性，他们的装备通常较为轻便。\n\n§G设计师提示：特种作战部队提供极高组织度、恢复力与广泛的地形加成，并具备空降和海岸撤离能力。可用于最艰巨的突袭和激烈争夺中的目标。但其战斗宽度较大、训练时间极长、受特种部队容量限制，且装备轻便，不适合作为普通战线步兵使用。§!"
 armor_Bat: "坦克连"
 armor_Bat_desc: "坦克连仅配备现有装甲最重的车辆——主战坦克。它们在平坦地形中具有出色的机动性和猛烈的直射火力，旨在撕开敌方防线，为后续机械化步兵部队创造可供迅速利用的突破口。\n\n§G设计师提示：坦克提供高装甲、高突破能力和对装甲目标的强大火力，并在平原和沙漠中拥有优秀加成。可用作进攻先锋。但其消耗昂贵的坦克与指挥装备，组织度低，且在森林、山地、丛林、沼泽和城市地形中受到严重惩罚。§!"
 armor_Comp: "坦克连"
 armor_Comp_desc: "坦克连仅配备现有装甲最重的车辆——主战坦克。它们在平坦地形中具有出色的机动性和猛烈的直射火力，旨在撕开敌方防线，为后续机械化步兵部队创造可供迅速利用的突破口。\n\n§G设计师提示：坦克连提供装甲、突破能力和机动火力，且不占用战斗宽度。可用于加强符合条件的步兵或机动编队，以进行开阔地形作战。但其坦克与指挥装备成本高昂，且在山区、丛林和沼泽地形中速度下降、攻击效能不佳。§!"
 L_Recce_Comp: "步兵侦察连"
 L_Recce_Comp_desc: "步兵侦察连以徒步方式行动，因此缺乏使其成为有效战斗部队的重型装备。他们潜入敌阵附近观察并报告敌方活动，同时运用无人机侦察和电子监视手段收集情报。他们也可执行有限的突袭和伏击任务。侦察连常被称为“中队”，源自其前身为骑兵部队的传统。\n\n§G设计师提示：步兵侦察部队提供侦察与主动性加成，且不占用战斗宽度，同时在森林、山地、丛林和丘陵地形中获得小幅加成。适用于徒步步兵、空降、空中突击、海军陆战队或特种部队单位。但其人力需求高于其他侦察单位，且火力加成有限。§!"
 Mot_Recce_Comp: "摩托化侦察连"
 Mot_Recce_Comp_desc: "摩托化侦察连使用通用车辆，装备与步兵侦察连大致相同，但任务角色有所不同。他们潜入敌阵附近观察并报告敌方活动，同时运用无人机侦察和电子监视手段收集情报。他们也可执行有限的突袭和伏击任务。侦察连常被称为“中队”，这是源自其前身为骑兵部队的传统。\n\n§G设计师提示：摩托化侦察提供比徒步侦察更高的侦察与主动性加成，且能与机动编队混编，并在开阔地形中提供额外机动性。适用于摩托化步兵或海军陆战队。但车辆配备增加了成本，且在山区、丛林和沼泽地形中速度下降。§!"
 Mech_Recce_Comp: "机械化侦察连"
 Mech_Recce_Comp_desc: "机械化侦察连使用装甲运兵车，装备与步兵侦察连大致相同，但任务角色有所不同。他们潜入敌阵附近观察并报告敌方活动，同时运用无人机侦察和电子监视手段收集情报。他们也可执行有限的突袭和伏击任务。侦察连常被称为“中队”，这是源自其前身为骑兵部队的传统。\n\n§G设计师提示：机械化侦察提供高侦察与主动性加成，且不占用战斗宽度，同时能与装甲输送车编队混编，并提高在平原上的移动速度。适用于装甲部队或海军陆战队。但装甲运兵车与支援装备成本较高，且在山区和沼泽地形中速度下降。§!"
 Arm_Recce_Comp: "重型机械化侦察连"
 Arm_Recce_Comp_desc: "重型机械化侦察连使用步兵战车，装备与装甲步兵大致相同，但任务角色有所不同。他们潜入敌阵附近观察并报告敌方活动，同时运用无人机侦察和电子监视手段收集情报。他们也可执行突袭和伏击任务。侦察连常被称为“中队”，这是源自其前身为骑兵部队的传统。\n\n§G设计师提示：重型机械化侦察提供高侦察与主动性加成，并有步兵战车防护，且不占用战斗宽度。适用于在平原或沙漠地带作战的装甲部队或海军陆战队。但步兵战车成本高昂，且在森林、山地、丛林和沼泽地形中速度下降。§!"
 L_arm_Bat: "轻型坦克连"
 L_arm_Bat_desc: "轻型坦克连配备特殊的高速轻型坦克（常为轮式），兼具卓越的机动性与令人震撼的火力。它们在正面战斗中足以对抗各类步兵。然而，直接战斗并非其主要任务——它们潜入敌阵附近观察并报告敌方活动，同时运用无人机侦察和电子监视手段收集情报。它们也可对敌方重要资产和机械化编队执行突袭和伏击任务。\n\n§G设计师提示：轻型坦克能提供快速装甲火力，在平原和沙漠中拥有强大攻击力。可用于武装侦察和扩大战果。但其防护和正面作战能力较薄弱，且复杂地形会大幅削弱其效能。§!"
 armor_Recce_Comp: "装甲侦察连"
 armor_Recce_Comp_desc: "装甲侦察连配备专用的侦察用轻型坦克，兼具卓越的机动性与强大火力。它们在正面战斗中足以对抗各类步兵。然而，直接战斗并非其主要任务——它们潜入敌阵附近观察并报告敌方活动，同时运用无人机侦察和电子监视手段收集情报。它们也可对敌方重要资产和机械化编队执行突袭和伏击任务。侦察连常被称为“中队”，这是源自其前身为骑兵部队的传统。\n\n§G设计师提示：装甲侦察连在常规侦察单位中提供最高的侦察与主动性加成，同时增加反装甲机动性，且不占用战斗宽度。适用于开阔地形中的坦克编队。但侦察坦克与指挥装备成本高昂，且在森林、山地、丛林和沼泽地形中速度大幅下降。§!"
 L_Engi_Comp: "工兵营"
 L_Engi_Comp_desc: "工兵负责临时桥梁与防御工事的构建、布雷与扫雷，以及未爆弹处理。他们携带自卫性基础步兵武器。\n\n§G设计师提示：工兵营提高堑壕能力，帮助步兵在要塞、城市、森林和沼泽地形中进行攻防，并在山地地形中提升防御与移动能力。适用于防御性或复杂地形部队。但其增加战斗宽度、人力和装备需求，且直接火力贡献有限。§!"
 H_Engi_Comp: "重型工兵营"
 H_Engi_Comp_desc: "工兵负责临时桥梁与防御工事的构建、布雷与扫雷，以及未爆弹处理。他们携带基础步兵武器，用于自卫目的。凭借专用的工程与抢修车辆，他们能够从前线回收因战斗受损的装备。\n\n§G设计师提示：重型工兵营提供比标准工兵更高的堑壕能力，以及在要塞、城市、山地和沼泽地形中更强的加成。适用于高价值进攻或防御编队。但其人力与装备需求庞大，是一种昂贵的支援选择。§!"
 Arty_Bat: "炮兵营"
 Arty_Bat_desc: "炮兵凭借其强大的间接火力打击能力，能够向战场上需要的任何地点提供持续精确打击，且射程远超目视范围。火炮可由炮兵班组直接装填。由于其机动依赖外部牵引车辆，在两次射击之间移动较为困难，使其容易遭到敌方炮兵的压制性反击。轻型小口径系统可人力拖拽，且可装入运输机内，适合空降作战。\n\n§G设计师提示：炮兵提供大量对人员攻击，并可空降部署，对以步兵为主的部队效果显著。可用于为徒步编队提供进攻火力。但组织度与HP较低、增加战斗宽度，且在复杂地形中机动受限，需有足够步兵提供掩护。§!"
 Arty_Battery: "炮兵连"
 Arty_Battery_desc: "炮兵凭借其强大的间接火力打击能力，能够向战场上需要的任何地点提供持续精确打击，且射程远超目视范围。火炮可由炮兵班组直接装填。由于其机动依赖外部牵引车辆，在两次射击之间移动较为困难，使其容易遭到敌方炮兵的压制性反击。轻型小口径系统可人力拖拽，且可装入运输机内，适合空降作战。\n\n§G设计师提示：炮兵连提供对人员攻击加成，且不占用战斗宽度，装备成本远低于整建制炮兵营。可作为符合条件徒步编队的廉价火力支援手段。但其组织度极低，且在复杂地形中受到惩罚，使其在无支援连或高机动部队中价值有限。§!"
 SP_Arty_Bat: "自行火炮营"
 SP_Arty_Bat_desc: "自行火炮凭借其强大的间接火力打击能力，能够向战场上需要的任何地点提供持续精确打击，且射程远超目视范围。自行火炮可由炮兵班组直接装填，且自身具备机动能力，可在射击后迅速转移，以规避敌方炮兵的压制性反击。\n\n§G设计师提示：自行火炮提供强大对人员攻击，同时能与装甲编队保持同步，在平原地形中表现出色。可用于突破以步兵为主的防线。但其组织度低、增加战斗宽度、底盘成本高昂，且在复杂地形中受到惩罚，需有装甲掩护及开阔地形支持。§!"
 SP_Arty_Battery: "自行火炮连"
 SP_Arty_Battery_desc: "自行火炮凭借其强大的间接火力打击能力，能够向战场上需要的任何地点提供持续精确打击，且射程远超目视范围。自行火炮可由炮兵班组直接装填，且自身具备机动能力，可在射击后迅速转移，以规避敌方炮兵的压制性反击。\n\n§G设计师提示：自行火炮连提供机动型对人员攻击，且不占用战斗宽度。可作为紧凑型火力支援手段，用于机动、装甲、海军陆战队或民兵编队。但专用底盘成本高于牵引式火炮，且在山区、丛林和沼泽地形中机动性较差。§!"
 SP_R_Arty_Bat: "自行火箭炮营"
 SP_R_Arty_Bat_desc: "火箭炮营使用多管火箭发射系统，能够在远距离上对整片区域实施毁灭性打击。主要用于打击敌方纵深区域，因其火力散布较大，不适合用于战场的精确打击。它需要专用再装填车辆，且装填时间较长。\n\n§G设计师提示：自行火箭炮提供极高的对人员攻击与突破能力，同时在开阔地形中能与机动编队保持同步。可用于集中进攻火力。但组织度低、增加战斗宽度、需昂贵的火箭发射车辆，且在山区、丛林、沼泽和城市地形中表现不佳。§!"
 SP_R_Arty_Battery: "自行火箭炮连"
 SP_R_Arty_Battery_desc: "火箭炮连使用多管火箭发射系统，能够在远距离上对整片区域实施毁灭性打击。主要用于打击敌方纵深区域，因其火力散布较大，不适合用于战场的精确打击。它需要专用再装填车辆，且装填时间较长。\n\n§G设计师提示：火箭炮连提供强大的机动对人员攻击与少量突破加成，且不占用战斗宽度。可用于机动或装甲部队中的紧凑型进攻支援。但火箭发射车辆成本高昂，持续作战能力有限，且在山区和沼泽地形中机动性下降。§!"
 SP_AA_Bat: "自行防空营"
 SP_AA_Bat_desc: "防空营使用自行短程或中程防空导弹系统，为己方部队提供掩护，抵御敌方近距空中支援。\n\n§G设计师提示：自行防空为装甲编队提供高对空攻击与机动防护。适用于敌方空中威胁对高价值先锋部队构成风险时。但其增加战斗宽度、需专用车辆，且地面火力贡献有限，在山区、丛林和沼泽地形中机动性较差。§!"
 SP_AA_Battery: "自行防空连"
 SP_AA_Battery_desc: "防空连使用自行短程或中程防空导弹系统，为己方部队提供掩护，抵御敌方近距空中支援。\n\n§G设计师提示：自行防空连提供机动对空攻击，且不占用战斗宽度。可用于在敌方空中威胁下保护机动、装甲或海军陆战队部队。但专用底盘的地面火力贡献有限，且在山区和沼泽地形中机动性较差。§!"
 combat_service_support_company: "战斗勤务支援营"
 combat_service_support_company_desc: "师级后勤与医疗人员负责协调补给分配、伤员后送及兵员补充。\n\n§G设计师提示：战斗勤务支援减少补给与燃料消耗，同时通过伤员救援保存人力与单位经验。适用于大编制、经验丰富或高补给需求的部队。但其增加战斗宽度与装备需求，并且直接作战能力极弱。§!"
 helicopter_combat_service_support: "直升机战斗勤务支援营"
 helicopter_combat_service_support_desc: "直升机搭载的后勤与医疗分队为快速部署的部队提供持续保障，并从前方阵地后送伤员。\n\n§G设计师提示：直升机战斗勤务支援提供更高的伤员恢复率，以及更强的补给与燃料节省效果，且人力需求低于地面支援。适用于高成本的空中机动或快速编队。但运输直升机成本高昂，增加战斗宽度，且战斗贡献极小。§!"
 attack_helo_bat: "攻击直升机营"
 attack_helo_bat_desc: "攻击直升机团集中大量旋翼武装直升机，在广阔战线上执行快速反装甲打击与近距支援任务。\n\n§G设计师提示：攻击直升机提供快速的装甲火力，并在平原和沙漠中具有强大攻击力。可用于加强突破口或在开阔地形中猎杀装甲目标。但其组织度与HP值极低、飞机造价高昂，且在城区、山地、森林和丛林地形中表现不佳，持续作战风险较大。§!"
 attack_helo_comp: "攻击直升机连"
 attack_helo_comp_desc: "攻击直升机连为前线编队提供快速武装直升机支援和机动反装甲火力。\n\n§G设计师提示：攻击直升机连提供快速装甲火力，且不占用战斗宽度。可作为灵活支援手段用于步兵、机动、装甲或海军陆战队部队。但飞机与指挥装备成本高昂，且在城区和丛林地形中攻击效能较低。§!"
 L_Marine_Cdo_Bat: "海军陆战突击营"
 air_assault_Arty_Battery: "空中机动炮兵连"
 air_assault_Arty_Battery_desc: "空中机动炮兵连使用牵引式火炮，通过吊挂装载方式提升机动性，使其能够跟上速度更快的空中机动步兵部队。\n\n§G设计师提示：空中机动炮兵连提供对人员攻击加成，且不占用战斗宽度，在丘陵、山地、森林、丛林和城市地形中表现最佳。可作为紧凑型火力支援用于空中机动或海军陆战队编队。但直升机与火炮需求成本高昂，且在平原和沙漠中表现较弱。§!"
 L_Marine_Cdo_Bat_desc: "海军陆战队突击队是规模较大的两栖突击队编制，接受过包括“打了就跑”在内的多种轻步兵任务训练。\n\n§G设计师提示：海军陆战队突击队将高组织度与卓越的两栖、沼泽、森林和城市攻击能力相结合。可用于精英突袭和对激烈争夺地区的登陆作战。但其受特种部队容量限制、训练周期长、仅拥有轻型装备，且在开阔地形中攻击较弱，限制其大规模部署。§!"
 drone_tactical_company: "FPV无人机连"
 drone_tactical_company_desc: "FPV无人机连使用FPV固定翼无人机和四旋翼无人机，执行侦察与精确打击任务，为前线部队提供支援。\n\n§G设计师提示：FPV无人机连提供高效的对人员攻击与对装甲攻击加成，且不占用战斗宽度，并可空降部署。可为能够提供地面无人机补给的部队作为灵活火力支援。但其组织度几乎为零，且需要大量无人机装备，持续作战能力有限。§!"
 group_headquarters_title: "指挥部"
 arm_inf_hq: "装甲步兵指挥部"
 arm_inf_hq_desc: "机械化和装甲步兵指挥部单位。"
 arm_hq: "装甲指挥部"
 arm_hq_desc: "轻型坦克和主战坦克指挥部"
 L_Ranger_Bat: "游骑兵"
 L_Ranger_Recce_Comp: "游骑兵侦察连"
 group_headquarters_title_desc: "指挥部单位，具备带领部队作战的能力"
 light_inf_hq: "轻步兵指挥部"
 light_inf_hq_desc: "轻步兵和摩托化步兵指挥部单位"
 helo_hq: "直升机指挥部"
 helo_hq_desc: "直升机指挥部单位"
 group_light_bat_title: "缩编的单位"
 group_light_bat_title_desc: "缩编的作战单位，旨在倍增兵力，能力有所降低，但训练时间和成本也有所降低。"
 Light_Mech_Inf_Bat: "缩编的机械化步兵营"
 Light_Mech_Inf_Bat_desc: "一支轻编机械化分队使用少量装甲运兵车来加强编制，而无需占用正常战斗宽度。\n\n§G设计师提示：轻编机械化步兵提供装甲输送车防护与防御加成，且不占用战斗宽度。可用于在平原、丘陵或城市地形中加强符合条件的编队。但其车辆成本、低HP值，以及在山地、丛林、沼泽、河流和两栖地形中受到严重惩罚，限制了其独立作战价值。§!"
 Light_Arm_Inf_Bat: "缩编的装甲步兵营"
 Light_Arm_Inf_Bat_desc: "一支轻编装甲步兵分队使用少量步兵战车，在不占用正常战斗宽度的情况下，为部队提供装甲防护与火力支援。\n\n§G设计师提示：轻编装甲步兵提供步兵战车的装甲与火力加成，且不占用战斗宽度，在平原和沙漠中表现最佳。可用于加强高价值编队。但其组织度低、车辆昂贵，且在复杂地形、河流和两栖行动中受到严重惩罚，是一种高度专业化的编制。§!"
 Light_L_Air_assault_Bat: "缩编的空中突击步兵营"
 Light_L_Air_assault_Bat_desc: "空中突击步兵是精锐步兵，接受过绳降和空中运输专项训练，其装备有时经过专门设计或战地改装，以便更好地在飞机内运输。他们常被用于夺取并坚守尚未完全控制的关键地形，并在敌后直接与敌军交战。\n\n§G设计师提示：这类轻编空中突击分队提供组织度加成，并在城区、山地、森林、丛林和沼泽地形中获得强大加成，且不占用战斗宽度。可用于在复杂地形中加强专业化编队。但其直升机需求成本高昂，且在平原、沙漠和两栖攻击中表现不佳。§!"
 Light_attack_helo_bat: "缩编的攻击直升机营"
 Light_attack_helo_bat_desc: "一支小型攻击直升机分队提供快速的武装直升机支援，而无需投入整个团的规模。\n\n§G设计师提示：小编制攻击直升机提供快速的装甲火力支援，不占用战斗宽度，在平原与沙漠地形中表现出色。可用于紧凑型机动支援任务，但其组织度与兵力值极低、飞机造价昂贵，且在山区、丛林、沼泽和城市地形中受到严重惩罚，损失难以承受。§!"
 Light_armor_Bat: "缩编的坦克营"
 Light_armor_Bat_desc: "一支轻编坦克分队集中少量主战坦克，在不占用正常战斗宽度的情况下对编制进行加强。\n\n§G设计师提示：轻编坦克提供装甲、突破能力以及在平原和沙漠中的强力攻击加成，且不占用战斗宽度。可用于以较低成本加强进攻编队。但其组织度与HP值低、坦克成本高昂，且在复杂地形和城区中受到严重惩罚，不适合作为通用支援手段。§!"
 Light_L_arm_Bat: "缩编的轻型坦克营"
 Light_L_arm_Bat_desc: "一支轻编轻型坦克分队以较小的车辆规模，提供机动反装甲火力和武装侦察能力。\n\n§G设计师提示：轻编轻型坦克提供机动反装甲火力，且不占用战斗宽度，在平原和沙漠中表现出色。可用于加强快速编队以对抗敌方车辆。但其HP值低、专用底盘昂贵，且在复杂地形、河流和两栖行动中受到严重惩罚，灵活性受限。§!"
 Light_SP_Arty_Bat: "缩编的自行火炮营"
 Light_SP_Arty_Bat_desc: "一支轻编自行火炮分队以少于整营的车辆数量，提供机动间接火力支援。\n\n§G设计师提示：轻编自行火炮提供机动对人员攻击，且不占用战斗宽度，在平原、沙漠和城市地形中表现尤佳。可用于紧凑型进攻支援。但其组织度几乎为零、HP值低、专用底盘成本高昂，且在森林、山地和丛林地形中表现较弱。§!"
 Light_SP_R_Arty_Bat: "缩编的自行火箭炮营"
 Light_SP_R_Arty_Bat_desc: "一支轻编多管火箭炮分队以少于整营的车辆数量，提供集中的区域火力打击。\n\n§G设计师提示：轻编火箭炮提供强大的机动软攻击，且不占用战斗宽度，在平原、沙漠和城市地形中表现出色。可用于加强进攻编队。但其组织度几乎为零、HP值低、火箭发射车辆成本高昂，且在复杂地形中受到惩罚，需要其他单位提供掩护。§!"
 Light_SP_AA_Bat: "缩编的自行防空营"
 Light_SP_AA_Bat_desc: "一支轻编自行防空分队以少量机动防空系统为编制提供防护。\n\n§G设计师提示：轻编自行防空提供对空攻击加成，且不占用战斗宽度，人力需求较低。可用于为机动编队提供紧凑型防空掩护，抵御敌方空中力量。但其组织度几乎为零、HP值低，且需专用防空车辆，地面火力贡献有限。§!"
 Drone_Recce_Comp: "无人侦察连"
 Drone_Recce_Comp_desc: "通过运用小型无人机系统将侦察范围扩展至目视距离之外，无人机侦察连提升了战场态势感知能力，而无需将侦察兵暴露在直射火力之下。这些无人机可快速对行进路线进行侦察、识别敌方阵地，并在复杂地形中确认目标，从而实现更快的决策与更精准的火力打击。\n\n§G设计师提示：无人机侦察提供高侦察与主动性加成，强化其他侦察单位的效果，并提升炮兵攻击能力。适用于能够承担无人机的机动或装甲部队。但其增加战斗宽度与补给消耗，降低堑壕构筑能力，且在城区和山地地形中表现不佳。§!"
 medium_walker_battalion: "中型步行机甲营"
 medium_walker_battalion_desc: "中型步行机甲营被设计为步行机甲编队中全面均衡的中坚力量，兼具平衡的防护、机动性和载荷能力，适用于正面战斗。\n\n§G设计师提示：中型步行机甲提供灵活的装甲前线作战能力，具体效能取决于所装备的步行机甲底盘。可用作步行机甲编队的通用核心力量。但其战斗宽度大、组织度低、训练时间长，且底盘需求庞大，使其列装与补充成本高昂。§!"
 light_walker_tank_battalion: "轻型步行机甲营"
 light_walker_tank_battalion_desc: "轻型步行机甲营围绕反装甲步行机甲底盘构建，侧重于猎杀硬目标与利用突破口，而非持续的战线作战。\n\n§G设计师提示：轻型步行机甲通过坦克歼击型步行机甲底盘，专门针对装甲目标。适用于敌方装甲力量需要集中穿甲与对装甲攻击手段应对的情景。但其战斗宽度大、组织度低、训练时间长，且专用底盘成本高昂，使其在面对软目标时效率较低。§!"
 heavy_walker_tank_battalion: "重型步行机甲营"
 heavy_walker_tank_battalion_desc: "重型步行机甲营将火炮载荷搭载于大型步行平台上，为主力编队提供有防护伴随火力支援。\n\n§G设计师提示：重型步行机甲通过步行火炮底盘提供装甲炮兵火力。可用于增强对步兵和筑垒防线的支援能力。但其战斗宽度大、组织度低、训练时间长，且专用底盘成本高昂，需要有充分支援的编队来承载。§!"
 space_artillery_support_company: "太空炮兵支援连"
 space_artillery_support_company_desc: "太空炮兵支援连利用轨道平台发射的炮弹，将精确轰炸从太空投射至战场目标，其射程远超常规系统。这些打击可迅速压制设防阵地、摧毁高价值资产，并在预警极少的情况下打散敌军集结。\n\n§G设计师提示：太空炮兵使炮兵营的攻击能力倍增，且不增加战斗宽度，并可空降部署。可用于增强以炮兵为主的编队。但其轨道控制装备稀缺、训练时间长，且独立作战属性较弱，在炮兵配置较少的部队中应用效果不佳。§!"
 space_artillery_equipment_type: "轨道火控中继"
 space_artillery_equipment_type_desc: "这套加固型通信和目标指示中继系统旨在实时请求、协调和确认轨道炮击。它将前线观察员与天基炮兵阵地连接起来，从而实现快速射击任务、精确计时以及与友军可靠地避免冲突。该系统造价昂贵且资源消耗巨大，但如果没有它，轨道火力将仍然是盲目、缓慢且效率低下且极其危险的。"
 space_artillery_equipment_1: "$space_artillery_equipment_type$ I"
 space_artillery_equipment_1_desc: "$space_artillery_equipment_type_desc$"
 HACS_Mech: "第1代高机动性作战系统"
 HACS_Mech_desc: "第一代高机动战斗系统将先进装甲、武器与机动性整合于一个可空运部署的作战平台之上。\n\n§G设计师提示：第一代高机动战斗系统提供极高的组织度、HP值、全面火力以及空降能力，并在丘陵和平原地形中获得强大加成。可用作精锐装甲先锋。但其战斗宽度大、训练时间极长、装备稀缺，且在森林和丛林地形中受到惩罚，轻率的损失代价严重。§!"
 HACS_Mech_2: "第2代高机动性作战系统"
 HACS_Mech_2_desc: "第二代高机动战斗系统在保持战略部署灵活性的同时，提升了防护能力、武器系统和战场持续作战能力。\n\n§G设计师提示：第二代高机动战斗系统在组织度、HP值和突破能力方面均有提升，同时保留空降与海岸撤离能力。可用于在丘陵、平原、沙漠和沼泽地形中的精锐攻击。但战斗宽度大、装备稀缺、训练时间长，且在丛林地形中仍受惩罚，需选择性使用。§!"
 HACS_Mech_3: "第3代高机动性作战系统"
 HACS_Mech_3_desc: "第三代高机动战斗系统融合了先进防护、模块化武器与卓越的战场持续作战能力。\n\n§G设计师提示：第三代高机动战斗系统提供卓越的组织度、HP值、堑壕构筑能力、全面火力、空降能力以及广泛的地形加成。可用于最严苛的装甲作战任务。但其战斗宽度大、训练时间长，且先进装备不可替代，损耗代价依然沉重。§!"
 ALN_bellatoris: "贝拉托里斯"
 ALN_bellatoris_desc: "贝拉托里斯是奇美拉蜂群中的前线战士，为无情的近距离突击而生。它们以速度与凶猛见长，凭借数量与狂暴之势压垮防御阵线。\n\n§G设计师提示：贝拉托里斯将极高的组织度与HP值同均衡的攻击、防御、突破能力以及快速训练相结合。可用作奇美拉通用战线部队，适用于森林、丘陵、沼泽、平原和沙漠地形。但无对空攻击能力，且在山区和丛林地形中受到惩罚。§!"
 ALN_brachionis: "布拉奇诺斯"
 ALN_brachionis_desc: "“布拉基奥尼斯”是一种多肢奇美拉，专为近距离缠斗与撕裂装甲目标而构建。\n\n§G设计师提示：布拉基奥尼斯以牺牲部分防御为代价，换取更高的软攻击与硬攻击，同时保留高组织度与快速训练能力。可用作开阔地带的攻击性突击部队，但在山区和丛林地形中仍相对较弱。§!"
 ALN_gravis: "格拉维斯"
 ALN_gravis_desc: "“格拉维斯”是最重的奇美拉变种，一种装甲巨兽，作为蜂群推进的支点，以蛮力击溃坚固阵地。\n\n§G设计师提示：格拉维斯提供奇美拉中最强的攻击、突破和主动性，同时具备高组织度与快速训练能力。可用作开阔地带的进攻支点。但补给消耗更大，防御与组织度低于轻型变种，且在山区和丛林地形中受到惩罚。§!"
 Hvy_Mot_Inf_Bat: "重型摩托化步兵"
 Hvy_Mot_Inf_Bat_desc: "重型摩托化步兵使用防雷反伏击车辆作为运输工具。其装甲车辆为乘员提供对地雷、简易爆炸装置和小武器火力的卓越防护，使其非常适合在伏击威胁较高的敌对环境中执行任务。\n\n§G设计师提示：重型摩托化步兵使用防护更重的车辆，在平原和沙漠地带执行快速前线作战。其装备密度更高，组织度与堑壕构筑能力低于轻型步兵，同时在复杂地形中仍遭受显著惩罚。§!"
 L_Ranger_Bat_desc: "游骑兵是精锐轻步兵，专门执行突袭、直接行动以及主力部队之前的快速部署任务。他们轻装行军，以最大限度地提高机动性和突袭效果，夺取关键目标并坚守至常规部队抵达。其代价是重型装备匮乏，在开阔地形中面对装甲力量时较为脆弱。\n\n§G设计师提示：游骑兵将高组织度与卓越的复杂地形加成整合于较小的战斗宽度之内。可用于精锐山地、森林、丛林、沼泽或城区编队。但训练时间长、受特种部队容量限制，且重型装备有限，使其大规模部署成本高昂，且在平原地形中易受攻击。§!"
 L_Ranger_Recce_Comp_desc: "一支从游骑兵中抽调的侦察分队，受过徒步深入敌后渗透和报告敌方动向的训练。他们将隐蔽行动与无人机侦察和电子监视相结合，收集情报并为友军火力标示目标，并可在机会出现时执行有限的突袭和伏击行动。\n\n§G设计师提示：游骑兵侦察提供侦察与主动性加成，同时提升炮兵软攻击能力，并在复杂地形中表现出色。可用于需要精英侦察兵的特种部队编队。但其增加战斗宽度、占用特种部队容量，且直接火力贡献有限。§!"
 A_L_arm_Bat: "空降轻型坦克连"
 A_L_arm_Bat_desc: "轻型坦克连配备特殊的高速轻型坦克（常为轮式），兼具卓越的机动性与令人震撼的火力。它们在正面战斗中足以对抗各类步兵。然而，直接战斗并非其主要任务——它们潜入敌阵附近观察并报告敌方活动，同时运用无人机侦察和电子监视手段收集情报。它们也可对敌方重要资产和机械化编队执行突袭和伏击任务。这些单位还能够与伞兵部队协同实施空降作战，提供即时的伴随装甲支援。\n\n§G设计师提示：空降轻型坦克为空降编队提供插入后的机动装甲与反车辆火力。可用于支援空降部队在开阔地形中对抗敌方机动力量。但专用车辆成本高昂，且在山区、丛林、沼泽和城市地形中受到严重惩罚。§!"
 air_assault_Arty_Bat: "空中机动火炮"
 air_assault_Arty_Bat_desc: "一个完整建制的牵引火炮营，通过直升机吊挂方式运输。为空中突击行动提供持续的间接火力支援，借助快速的空中重新部署，保持与空中突击步兵同步推进。\n\n§G设计师提示：空中机动炮兵为直升机编队提供大量软攻击，并在丘陵、山地、森林、丛林和城市地形中表现出色。可用于在复杂地形中支援空中突击部队。但其增加战斗宽度、组织度与HP值较低，且需昂贵的运输直升机。§!"
 Weapons_company: "武器连"
 Weapons_company_desc: "一个由直射步兵支援武器组成的武器连，包括通用机枪和重机枪小组、榴弹机枪小组及其他重型步兵直射支援武器。该连旨在为所配属支援的任何步兵单位提供伴随火力支援，适用于广泛的部队类型。\n\n§G设计师提示：武器连提供广泛的直射属性加成，尤其是穿甲能力，且不占用战斗宽度。可用于加强通用步兵。但其对步兵装备需求较大，且降低堑壕构筑能力，使其对廉价的静态防御部队不太有吸引力。§!"
 Heavy_mortar_company: "迫击炮连"
 Heavy_mortar_company_desc: "迫击炮旨在为前线部队提供快速、一体化的火力支援，无需上级单位配属。这些迫击炮为前线单位提供间接火力支援，其成本远低于整建制炮兵部队。\n\n§G设计师提示：迫击炮连提供强大的对人员攻击加成，无需炮兵装备，且不占用战斗宽度。可用作低成本的步兵集成火力支援手段。但其对装甲攻击与穿甲能力较弱，且降低堑壕构筑能力。§!"
 Sniper_company: "狙击连"
 Sniper_company_desc: "狙击连配备以观察手-射手编组形式行动的精确射手，对军官、车组人员、通信小组等高价值目标实施远程选择射击。他们善于从隐蔽位置袭扰和扰乱敌方编队，削弱敌方效能，同时自身难以被定位和打击。\n\n§G设计师提示：狙击连提供软攻击、侦察加成，并提升侦察单位主动性与炮兵单位火力。可用于对抗步兵及改善战场协调。但其增加战斗宽度，且突破、硬攻击与穿甲能力极弱。§!"
 AT_company: "步兵反坦克连"
 AT_company_desc: "反坦克连配备步兵反坦克武器，专门用于与轻步兵单位协同作战。它能够轻松在城区、森林以及其他设防或近距离地形中行动，不仅能够有效攻击敌方装甲单位，随后还能迅速撤回至预设阵地中。\n\n§G设计师提示：步兵反坦克提供高对装甲攻击与穿甲能力，且不占用战斗宽度，适用于徒步、空降、海军陆战队和特种部队编队。可在这些部队需要抵御装甲力量时使用。但会削弱其他战斗属性，并增加专用装备成本。§!"
 Mot_AT_company: "车载反坦克连"
 Mot_AT_company_desc: "一个以车载发射阵位执行反坦克作战的连队。该连更注重速度，能够跟上快速机动的摩托化和装甲单位，同时提供增强的反坦克能力。\n\n§G设计师提示：车载反坦克提供高对装甲攻击与穿甲能力，且不会降低机动编队的速度。可用于面临坦克威胁的摩托化、装甲、空降或海军陆战队部队。但重型反坦克武器与通用车辆使其成本更高，且对软目标杀伤有限。§!"
 AA_company: "防空连"
 AA_company_desc: "一支专门用于打击敌方空中单位、提供针对敌方直升机及其他飞机防御能力的分队。\n\n§G设计师提示：防空连提供强大的对空攻击能力，且不占用战斗宽度。可用于保护在敌方空中力量威胁下行动的部队。但在地面战斗中较为薄弱，且需消耗专用防空装备，在制空权稳固时价值有限。§!"
 Combat_engineer_company: "战斗工兵连"
 Combat_engineer_company_desc: "战斗工兵执行进攻性工程作业，为前线部队提供直接支援。他们受过训练并配备相应装备，能够穿越河流或反坦克壕沟等复杂地形。他们还具备突破雷场或其他防御障碍的能力，并负责清除区域，使后续作战部队能够畅通无阻地通过。\n\n§G设计师提示：战斗工兵提供防御与突破加成，并在森林、山地、丛林和城市地形中获得适度的攻击与防御加成，且不占用战斗宽度。可用于穿越复杂地形的突击行动。但其需要大量步兵装备，且在开阔地形中优势较低。§!"
 pathfinder_company: "探路者连"
 pathfinder_company_desc: "精英伞兵小组，受过在空降行动实施前先行跳伞的专门训练，负责寻找最安全的降落区和集结地域。这些精锐士兵在任何空降或空中突击行动的关键阶段提供至关重要的指挥与控制能力。\n\n§G设计师提示：探路者伞兵小组提升空降步兵的组织度与软攻击，并可通过伞降部署。可用于加强空降或空中突击部队。但其增加战斗宽度，仅能用于特定部队，且直接作战能力有限。§!"
 amphibious_landing_detachment: "海军登陆附属部队"
 amphibious_landing_detachment_desc: "从海军配属的支援单位，旨在实现快速高效的两栖登陆作战。这些单位配备专用登陆舰艇和装备，能够快速实施舰对岸或远距离登陆行动。然而，配属此类单位将降低执行非两栖作战任务的能力。\n\n§G设计师提示：海军登陆附属部队大幅提升海军陆战队编队的两栖攻击、防御和机动能力。可用于专门负责抢滩突击的部队。但其增加战斗宽度、人力和装备需求，并在几乎所有的陆地地形中施加严重的作战惩罚。§!"
 combat_maintenance_company: "维修连"
 combat_maintenance_company_desc: "维修连负责维持编队中车辆和重型装备的作战状态，执行战场抢修并在受损平台彻底报废前将其回收。通过在靠近前线的位置修复战斗中损坏的车辆，它能够在持久作战中维持装甲力量，并减少战损消耗。\n\n§G设计师提示：维修连提升可靠性、恢复率和装备缴获能力，适用于载具密集型部队。可用于在长时间行动中控制损耗并保存昂贵装备。但其增加战斗宽度、人力和通用车辆需求，且直接火力贡献有限。§!"
 airmobile_maintenance_company: "空中机动维修连"
 airmobile_maintenance_company_desc: "一支为支援空中机动和直升机部队而配置的维修分队，配备更轻便、更易于运输的工具，以维持旋翼机和快速部署部队的作战状态。它在前沿区域修复受损装备，保障远距离固定基地之外的空中突击作战节奏。\n\n§G设计师提示：空中机动维修连提升装备缴获能力与可靠性，同时能与直升机编队保持同步。可用于维护昂贵的旋翼机装备。但其恢复率低于地面维修单位，增加战斗宽度，且需要大量运输直升机。§!"
 communications_company: "通讯连"
 communications_company_desc: "通信连维护维系编队整体运转的无线电、数据和指挥网络，确保命令与报告在战场上可靠流通。强大的通信能力提升协同作战能力和反应速度，并增强编队对抗干扰和电子破坏的韧性。\n\n§G设计师提示：通信连提升前线营的组织度、恢复速度和主动性。适合配置于大编制或昂贵的战斗部队中，以发挥协同优势，但其增加战斗宽度，且需大量指挥装备，直接火力贡献有限。§!"
 military_police_attachment: "宪兵"
 military_police_attachment_desc: "宪兵负责交通管制、后方区域安全及战俘管理，使前线部队能够专注于作战任务。通过维持补给线路的有序运行、保障后方免受渗透者和散兵游勇的威胁，他们维护军纪，确保编队运转顺畅。\n\n§G设计师提示：宪兵提升步兵的镇压能力，并额外增加镇压效果，且不占用战斗宽度。可用于占领区和后方安全部队编制。但对前线战斗部队的价值有限。§!"
 hq_mech: "指挥部机械化步兵连"
 hq_mot: "指挥部摩托化步兵连"
 hq_armor: "指挥部装甲步兵连"
 hq_Mot_Inf_Bat: "指挥部摩托化步兵警卫队"
 hq_Mech_Inf_Bat: "指挥部机械化步兵警卫队"
 hq_Arm_Inf_Bat: "指挥部装甲步兵警卫队"
 hq_Mech_Marine_Bat: "指挥部陆战队警卫队"
 hq_Mech_Air_Inf_Bat: "指挥部空突部队警卫队"
 Militia_Recce_Comp: "民兵侦察连"
 Militia_Recce_Comp_desc: "民兵侦察连使用通用车辆和有限通信设备，在民兵编队前方执行侦察任务。他们提供对敌方阵地（尤其是建成区地形）的低成本侦察。\n\n§G设计师提示：民兵侦察提供侦察与主动性加成，且不占用战斗宽度，在城市和超大城市中表现尤为出色。可用于以低成本改进民兵战术。但仅限于民兵部队使用，且直接作战能力贡献有限。§!"
 light_medium_walker_battalion: "中型步行机甲营（轻）"
 light_medium_walker_battalion_desc: "一支轻编中型步行机甲分队以少量通用步行机甲底盘对编队进行加强。\n\n§G设计师提示：轻编中型步行机甲提供灵活的装甲作战能力，其战斗宽度更小，底盘数量远少于整建制的步行机甲营。可在产能不足以维持完整编制时使用。但仍保留组织度低、训练时间长和持续作战能力有限的特点。§!"
 light_light_walker_tank_battalion: "轻型步行机甲营（轻）"
 light_light_walker_tank_battalion_desc: "一支轻编轻型步行机甲分队提供少量反装甲步行机甲平台，用于针对性加强。\n\n§G设计师提示：轻编轻型步行机甲提供集中的反装甲能力，其战斗宽度更小，坦克歼击型底盘数量较少。可用于加强部队以对抗硬目标。但仍保留组织度低、训练时间长，且对软目标作用有限的特点。§!"
 light_heavy_walker_tank_battalion: "重型步行机甲营（轻）"
 light_heavy_walker_tank_battalion_desc: "一支轻编重型步行机甲分队提供配备火炮的步行平台，但规模小于整营。\n\n§G设计师提示：轻编重型步行机甲提供装甲炮兵火力，其战斗宽度更小，底盘数量少于完整编制。可用于紧凑型火力支援。但其组织度低、训练时间长，且专用火炮底盘仍使其成本高昂。§!"
 hq_support_company: "指挥部支援连"
 hq_support_company_desc: "指挥部支援连提供指挥编队所需的参谋人员、通信、运输和安保力量。\n\n§G设计师提示：指挥部支援连提升已部署将领从技能等级中获得的加成。它是陆军指挥部模板的通用选择。但增加战斗宽度、人力和装备需求，且不提供专门的作战或行动加成。§!"
 hq_engineer: "指挥部工兵连"
 hq_engineer_desc: "指挥部工兵连负责协调指挥编队的破障、筑城和机动工程作业。\n\n§G设计师提示：指挥部工兵连提升要塞破坏与两栖登陆防御能力，同时增加工事构筑与突破加成。可用于围城、防御或海岸行动。但其增加战斗宽度，且直接火力有限。§!"
 hq_recon: "指挥部侦察连"
 hq_recon_desc: "指挥部侦察连为参谋人员收集并分发地形与敌军情报。\n\n§G设计师提示：指挥部侦察连提升已部署将领的侦察与地形特性经验值，同时为指挥部增加侦察加成。可用于机动或以地形为重点的指挥单位。但其增加战斗宽度，直接作战能力有限。§!"
 hq_maintenance: "指挥部维修连"
 hq_maintenance_desc: "指挥部维修连负责协调全编队的装备回收、修理和残骸打捞工作。\n\n§G设计师提示：指挥部维修连减少损耗并提升已部署将领的装备缴获能力，同时为指挥部增加可靠性与装备缴获加成。可用于装备密集型的指挥单位。但其增加战斗宽度，作战属性较弱。§!"
 hq_logistics: "指挥部后勤连"
 hq_logistics_desc: "指挥部后勤连负责规划全编队的补给分配与燃料运输。\n\n§G设计师提示：指挥部后勤连降低已部署将领的补给消耗以及指挥部的燃料消耗。可用于补给受限或燃料密集的前线。但其增加战斗宽度，战斗力提升有限。§!"
 hq_naval_liaison: "指挥部海军联络组"
 hq_naval_liaison_desc: "海军联络小组负责将指挥部与舰队指挥官及舰对岸支援网络相连接。\n\n§G设计提示：指挥部海军联络连提升已部署将领的舰炮支援、两栖登陆和陆战队携行补给。可用于沿海与两栖战役。但其增加战斗宽度，且在内陆深处时几乎无用。§!"
 hq_air_liaison: "指挥部空军联络组"
 hq_air_liaison_desc: "空中联络小组负责协调指挥部与运输、近距支援及制空编队之间的联系。\n\n§G设计师提示：指挥部空中联络连缩短空降入侵准备时间，并提升近距空中支援抵抗以及制空权战斗加成。适用于注重空地协同的战区。但其增加战斗宽度，且不具备实质性地面火力。§!"
 hq_specops: "指挥部特战参谋组"
 hq_specops_desc: "特种作战参谋负责协调在常规补给与指挥网络之外行动的精锐单位。\n\n§G设计师提示：指挥部特种作战连提升已部署将领的特种部队攻击、防御及脱离补给状态下的作战效能，且不增加战斗宽度。可用于指挥精锐编队。但其用于常规部队中则属于浪费。§!"
 hq_mech_desc: "机械化作战参谋负责协调全编队中的装甲输送车及其搭载步兵的行动。\n\n§G设计师提示：指挥部机械化步兵连提升已部署将领的机械化攻击与防御能力。可用于指挥机械化编队。但需装备装甲运兵车和大量支援装备，对其他单位类型的价值有限§!"
 hq_mot_desc: "摩托化作战参谋负责协调车载步兵及编队的快速机动。\n\n§G设计师提示：指挥部摩托化步兵连提升已部署将领的摩托化攻击与防御能力。可用于指挥摩托化编队。但其对徒步或装甲部队的价值有限。§!"
 hq_armor_desc: "装甲作战参谋负责协调全编队中的坦克、装甲步兵及其支援单位。\n\n§G设计师提示：指挥部装甲步兵连提升已部署将领的装甲攻击与防御能力。可用于指挥以坦克为主的部队。但其需要步兵战车和广泛的装备需求，使其成为成本较高的总部支援选择之一。§!"
 hq_infantry: "指挥部步兵警卫队"
 hq_infantry_desc: "一支轻步兵分遣队负责保卫指挥部人员、通信设备和指挥所，抵御直接攻击。\n\n§G设计师提示：指挥部步兵警卫队以适中的装备成本，为陆军总部提供较高的兵力值与组织度。可用作基本警戒防线。但其增加战斗宽度，缺乏地形加成，且作战属性较普通前线步兵有所降低。§!"
 hq_Mot_Inf_Bat_desc: "一支摩托化步兵分遣队为指挥部人员和指挥所提供机动安保。\n\n§G设计师提示：指挥部摩托化步兵安全分遣队为陆军总部提供速度、扎实的组织度以及丘陵和城市地形的优异表现。可用于机动指挥编队。但车辆增加成本，且在沙漠、丛林、沼泽、河流和两栖攻击中表现较弱。§!"
 hq_Mech_Inf_Bat_desc: "一支机械化步兵分遣队使用装甲输送车，为机动指挥部提供保护。\n\n§G设计师提示：指挥部机械化步兵安全分遣队提供装甲机动性，并在丘陵和城市中拥有强大防御力。可用于保护机械化陆军总部。但装甲运兵车成本高昂，且在山区、丛林、沼泽、河流和两栖攻击中遭受严重惩罚。§!"
 hq_Arm_Inf_Bat_desc: "一支装甲步兵分遣队使用步兵战车，为指挥部提供重型安保。\n\n§G设计师提示：指挥部装甲安全分遣队为陆军总部提供基于步兵战车的防护与开阔地形作战能力。可用于装甲指挥单位。但组织度较低、装备成本高昂，且在复杂地形和两栖行动中遭受严重惩罚。§!"
 hq_Mech_Marine_Bat_desc: "一支机械化海军陆战队分遣队在舰到岸和沿海行动中为指挥部提供保护。\n\n§G设计师提示：指挥部海军陆战队安全分遣队将装甲机动性与强大的两栖攻击和河流攻击能力相结合，适用于陆军总部。可用于海军陆战队指挥和滩头行动。但其装甲运兵车成本高昂，且在复杂地形中受到惩罚，使其在内陆中效率低下。§!"
 hq_Mech_Air_Inf_Bat_desc: "一支轻型机械化分遣队为配属空降和快速部署编队的指挥部提供保护。\n\n§G设计师提示：指挥部空中突击安全分遣队提供可随陆军总部一同空降的装甲安保。可用于空降指挥编队。但其装甲运兵车与支援装备成本高昂，且在复杂地形、河流和两栖攻击中遭受重大惩罚。§!"