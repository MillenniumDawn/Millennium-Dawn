 syrian_refugees_idea_ast: "欢迎叙利亚难民"
 syrian_civil_war_refugees_ast: "处理叙利亚难民问题"
 syrian_refugees_event_ast.1.t: "叙利亚难民"
 syrian_refugees_event_ast.1.d: "随着叙利亚冲突爆发，成千上万的难民正在我国寻求庇护。他们已经通过正规渠道申请，他们逃离的困境也确实符合入境条件，但最终的选择权在我们手中。接纳他们或许能鼓励更多人走正规程序，但也可能导致另一场移民危机。"
 syrian_refugees_event_ast.1.a: "让他们进来"
 syrian_refugees_event_ast.1.b: "这不是我们的问题。"
 malaysianflight_event_ast.1.t: "MH370航班的失踪"
 malaysianflight_event_ast.1.d: "昨天，一架由马来西亚航空公司运营的国际客机在飞越南海时从雷达上消失，这起失踪事件令家属悲痛欲绝，也令航空公司感到困惑不解。\n\n这架原计划降落在北京的航班，三天前从马来西亚首都吉隆坡起飞途中神秘失踪。当局仍在搜寻飞机残骸，失踪乘客的家属已被告知做好最坏的打算。来自九个国家的40艘船只和34架飞机参与了搜寻，但马来西亚官员声称他们仍然不知道究竟发生了什么。"
 malaysianflight_event_ast.1.a: "它去哪儿了？"
 AST_keep_them_aligned: "保持它们一致"
 AST_keep_them_aligned_desc: "国家党一直试图就我们的农业政策（或者说缺乏农业政策）制造事端。虽然这种胁迫手段或许对以往的政府奏效，但它不会左右我们本届内阁的运作方式。我们将按照自己的方式向农民发放补助金，并向媒体宣布这是我们的胜利。\n\n这说明如果他们想和我们合作，就必须按照我们的条件来。"
 AST_privatise_the_care: "护理私有化"
 AST_privatise_the_care_desc: "澳大利亚的公共医疗保健模式实验表明，成本已经超出可接受甚至可控的水平，而医疗质量却几乎没有改善。通过部分项目私有化，我们期待为寻求医疗服务的人提供更多选择，并提高效率。这是一个行之有效的模式，我们愿意采纳。"
 papua_affair.2.t: "澳大利亚橡胶提案"
 papua_affair.2.d: "堪培拉政府提议对莫尔兹比港周边的一些橡胶种植园进行国家扶持。据他们称，这项协议旨在加强和确保我们之间的稳定贸易，特别是取消部分关税。当地小农户支持这项提议，认为它有利于增加出口，但这项提议未来可能会使我们更加依赖他们。"
 papua_affair.2.a: "这是一笔不错的生意。"
 papua_affair.2.b: "拒绝"
 papua_affair.3.t: "橡胶搞定了"
 papua_affair.3.d: "幸运的是，总理同意再次尝试谈判，并支持我们的提议。莫尔兹比港周边的农民将受益于需求增长和丰厚的补贴，而我们也能获得稳定的橡胶供应，以满足我们不断发展的产业需求。整个地区都将从这项安排中受益。"
 papua_affair.3.a: "又一笔成功的交易。"
 papua_affair.4.t: "无回复"
 papua_affair.4.d: "很遗憾，巴布亚新几内亚代表团目前不愿与我们进行会谈。要么就是他们忘了怎么接电话。这令人失望，但与此同时，我们可以扩大在当地橡胶资源的获取范围。"
 papua_affair.4.a: "你不可能每次都赢。"
