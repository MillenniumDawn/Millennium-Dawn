 TUR_assimulate_kuwait: "Assimilate Kuwait"
 TUR_assimulate_syria: "Assimilate Syria"
 TUR_assimulate_iraq: "Assimilate Iraq"
 TUR_invite_azerbaijan: "Invitar a Azerbaiyán"
 TUR_invite_azerbaijan_desc: "Nuestros hermanos en Azerbaiyán han estado esperando este día en que nos unifiquemos. Esperemos que estén más que felices de unirse a nosotros."
 TUR_invite_kazakhstan: "Invitar a Kazajistán"
 TUR_invite_kazakhstan_desc: "Kazakhs currently have some of the most land in the Turkic world. Their invitation to the Confederation should be a no-brainer."
 TUR_invite_uzbekistan: "Invitar a Uzbekistán"
 TUR_invite_uzbekistan_desc: "Uzbeks will be delighted upon hearing the news that their nation is eligible to join the Turkic Confederation. There will be no doubts they will join."
 TUR_invite_turkmenistan: "Invitar a Turkmenistán"
 TUR_invite_turkmenistan_desc: "Turkmenistan is not a country that really opens itself up to the world, but surely they will open themselves up to their Turkic friends."
 TUR_land_reforms: "Reformas Agrarias"
 TUR_land_reforms_desc: "Reformaremos completamente cómo se maneja la distribución de la tierra entre nuestra gente."
 TUR_military_debug: "El TSK"
 TUR_gulenist_educators2_desc: "Nos hemos centrado en mejorar nuestra educación y debemos difundir las enseñanzas de Gülen mientras podamos."
 TUR_9833_name_mhp: "Konstantiniyye"
 TUR_flavor_event.5.b: "Trágico"
 TUR_support_from_kurdish_television: "Apoyo de la televisión kurda"
 TUR_support_from_kurdish_television_desc: "Los canales de televisión kurdos que ayudamos a sostener han comenzado a apoyar y a hablar bien de nuestro gobierno y nuestro estado."
 PKK_hard_fought_freedom: "Libertad duramente luchada"
 PKK_hard_fought_freedom_desc: "Nuestra libertad no fue fácil. A los valientes luchadores del Kurdistán les llevó décadas obtener la autonomía del Estado turco, ¡y esta libertad será protegida hasta el último kurdo!"
 TUR_revised_political_party_laws: "Leyes políticas dirigidas"
 TUR_revised_political_party_laws_desc: "Certain laws have been passed that limit the ability of certain political parties to say what they want."
 TUR_scorched_earth_tactics: "Tácticas de tierra quemada"
 TUR_supply_disruption: "Problemas logísticos"
 TUR_PKK_released_TT: "¡La £TUR_Neutral_Communism §OInsurgencia del PKK§!terminará!\n - La £TUR_Neutral_Communism §OPKK§! se convertirá en el órgano gobernante del nuevo estado Kurdo."
 PKK_strength_TT: "Fuerza del PKK"
 PKK_strength2_TT: "Esta variable mostrará el fortalecimiento del PKK. Esta variable aumentará entre un 5% y un 10% cada año, y una vez que alcance el 100%, el PKK se independizará y librará una guerra por la independencia. Cuantas más bases desmantelemos, más débil será la fuerza del PKK. Debemos actuar con rapidez; de lo contrario, el PKK podrá independizarse en un par de años."
 TUR_pkk_manpower_TT: "Mano de obra de la base [ROOT.TUR_PKK_bases_name]"
 TUR_pkk_manpower2_TT: "Esta variable muestra la fuerza disponible en la base [ROOT.TUR_PKK_bases_name]. Si logramos reducirla a menos de 100, podremos erradicar definitivamente al PKK de esta zona. Una vez erradicado el PKK en todos los estados, podremos declarar la victoria total sobre él."
 TUR_PKK_insurgency_formally_ends_TT: "¡La £TUR_Neutral_Communism §OInsurgencia del PKK§!terminará!"
 TUR_less_than_100_PKK_diyarbakir_TT: "Tiene menos de §H100 Mano de Obra§! en la Base §HDiyarbakır§!"
 TUR_less_than_100_PKK_van_TT: "Tiene menos de §H100 Mano de Obra§! en la Base §HVan§!"
 TUR_less_than_100_PKK_euphrates_TT: "Tiene menos de §H100 Mano de Obra§! en la Base §HEuphrates§!"
 TUR_has_large_mil_or_higher_TT: "Tiene un §OGasto Militar Grande§! o superior"
 TUR_automate_warfare_TT: "Comenzará una operación contra el £TUR_Neutral_Communism PKK\n - En lugar de tener que asaltar constantemente esta base, se hará automáticamente\n - Al final de cada mes, una cierta cantidad del £TUR_Neutral_Communism PKK estará muerta\n - Mientras una operación esté activa, gastaremos equipo y mano de obra\n - Recibiremos eventos relacionados con los combates mientras las operaciones estén en curso\n - El £TUR_Neutral_Communism PKK tendrá más probabilidades de atacar profundamente en Anatolia"
 TUR_end_automate_warfare_TT: "Pondrá fin a las operaciones contra el £TUR_Neutral_Communism PKK en este estado."
 TUR_spend_equipment_TT: "§R¡Perdemos!§!:\nEntre §H150§! y §H460§! Armas Ligeras\nEntre §H25§! y §H190§! Camiones Utilitarios\nEntre §H5§! y §H65§! Mano de Obra"
 TUR_assault_this_base_TT: "Entre §H40§! y §H190§! £TUR_Neutral_Communism Insurgentes del PKK§ §Gserán eliminados§!."
 TUR_finalized_kurdish_reforms_TT: "§HFinalizaremos§! y celebraremos un referéndum sobre la independencia [PKK.GetFlag] §HKurda§!\n §RNo§! podremos aprobar más reformas si tomamos esta decisión."
 TUR_release_ocalan_TT: "§HAbdullah Öcalan§! será liberado"
 TUR_completed_reconciliations_TT: "Se han completado y aprobado todas las reformas."
 TUR_PKK_broke_free_tt: "¡El [PKK.GetFlag] PKK se liberará!\n - No podremos intervenir directamente, a menos que justifiquemos un objetivo de guerra o iniciemos una guerra mediante una incursión.\n - El [PKK.GetFlag] PKK tendrá un ejército permanente, con una importante ventaja defensiva contra nosotros.\n - Perderemos todos los núcleos en las regiones kurdas."
 TUR_double_damage_TT: "Eliminaremos §H2X§! más §HInsurgentes HPKK§!\n§H50%§! Probablemente perdamos §H1 Industria Civil§!"
 TUR_2X_LOSS_TT: "§H50% Chance§! we lose §H2X More§! Equipment"
 TUR_AIR_LOSS_TT: "§H50% de posibilidades§! perdemos un §HAvión de Transporte§!"
 TUR_PKK_DAMAGE_300_TT: "Eliminando al §H300§! §HInsurgentes del PKK§!"
 TUR_PKK_DAMAGE_200_TT: "Eliminando al §H200§! §HInsurgentes del PKK§!"
 TUR_PKK_DAMAGE_100_2_TT: "Arrestos al §H100§! §HInsurgentes del PKK§!"
 TUR_PKK2_TT: "£decision_icon_small §YDesbloquea§! §YDecisiones§! Adicionales para Problemas en Kurdistán\n - Elegir esta opción nos permitirá afirmar un mayor dominio sobre las regiones kurdas de Oriente Medio.\n - Si destruimos con éxito todas las bases del PKK, podremos poner fin definitivamente al separatismo kurdo en Turquía."
 TUR_PKK3_TT: "£decision_icon_small §YUnlocks§! Additional §YDecisions§! for Trouble in Kurdistan\n - This option replaces military operations against £TUR_Neutral_Communism  §HPKK bases§!. Destroying bases will not fulfill the promise.\n - We will have §H1,500 days§! to pass the required reforms. Starting a reform extends the deadline.\n - This option will grant the [PKK.GetFlag] Kurds more autonomy.\n - [PKK.GetFlag] Diyarbakir will become an autonomous region, with much of its industry controlled by us.\n - The [PKK.GetFlag] PKK will have its own army, government, and territory.\n - Taking this option will anger neighboring countries with sizeable Kurdish minorities."
 TUR_rebuilding_kurdistan: "Reconstruyendo el Kurdistán"
 TUR_rebuilding_kurdistan_desc: "\n£TUR_desctext_PKK \n\n\n\n\nOur promise of reconciliation has renewed hopes in the Kurdish population living in the Eastern parts of our great nation. Though they will be a separate entity, the new Kurdish state will still need to answer to our government. In order to create a stable, and self-sufficient Kurdish state, we must first create the necessary infrastructure and framework for it to hold itself without collapsing or relying on us too much. If we fail to deliver this promise, we may lose complete control over the region."
 TUR_PKK_mechanic: "Problemas en el Kurdistán"
 TUR_PKK_mechanic_desc: "\n£TUR_desctext_PKK \n\n\n\n\nThe £TUR_Neutral_Communism  §HPKK§! first began their attacks in the late 70's, and ever since, have persisted in their efforts of gaining autonomy or out-right independence from our nation. The £TUR_Neutral_Communism  §HPKK§! have spread their movement to neighboring states, destabilizing our neighbors, and creating a need for closer cooperation. We can do little in stopping the growth of their strength except for attacking them. The more bases we clear out, the weaker their strength becomes. Taking out the £TUR_Neutral_Communism  §HPKK§! is a race against time, the longer we take to clear them out, the closer they get to a major revolt or independence.\n\nSelected Base: [ROOT.TUR_PKK_bases_name]"
 TUR_PKK_van_manpower: "[?var_pkk_van]"
 TUR_PKK_diyarbakir_manpower: "[?var_pkk_diyarbakir]"
 TUR_PKK_euphrates_manpower: "[?var_pkk_euphrates]"
 TUR_hold_meeting: "Celebración de la Cumbre de Diyarbakır"
 TUR_hold_meeting_desc: "We can convene in Diyarbakır with our allies, and together we can agree on a deal to move forward. Either we can cooperate with our allies, and take on the PKK together at a cost, or we can decide to do things on our own, potentially risking conflict with our neighbors if we choose to pursue cross-border raids. We can also choose to announce our intention to grant the Kurds autonomy at the summit."
 TUR_select_van_base: "Realizar operaciones en Van"
 TUR_select_van_base_desc: "La zona de Van es la provincia con mayor actividad del PKK y limita con Irán y Armenia."
 TUR_select_diyarbakir_base: "Realizar operaciones en Diyarbakır"
 TUR_select_diyarbakir_base_desc: "Diyarbakır, quizás la zona con mayor resistencia por parte de miembros y partidarios del PKK, ha sido un foco de actividad del PKK."
 TUR_select_euphrates_base: "Realizar Operaciones en el Éufrates Medio"
 TUR_select_euphrates_base_desc: "Aunque más tranquila que otras zonas, la zona del Medio Éufrates ha estado activa con células del PKK circulando por los alrededores."
 TUR_assault_this_base: "Lanzar Asalto a [ROOT.TUR_PKK_bases_name]"
 TUR_assault_this_base_desc: "Al lanzar un asalto a [ROOT.TUR_PKK_bases_name], podremos eliminar más directamente los bastiones del PKK."
 TUR_greenlight_operations_in_van: "Autorizar Operaciones en Van"
 TUR_greenlight_operations_in_van_desc: "Podemos dar luz verde al TSK para que lance un ataque a gran escala contra el PKK en Van."
 TUR_end_operations_in_van: "Finalizar Operaciones en Van"
 TUR_end_operations_in_van_desc: "Necesitamos concluir las operaciones en Van, ya que se necesitan recursos y planificación en otras partes."
 TUR_greenlight_operations_in_diyarbakir: "Autorizar Operaciones en Diyarbakır"
 TUR_greenlight_operations_in_diyarbakir_desc: "Podemos dar luz verde al TSK para que lance un ataque a gran escala contra el PKK en Diyarbakır."
 TUR_end_operations_in_diyarbakir: "Finalizar Operaciones en Diyarbakır"
 TUR_end_operations_in_diyarbakir_desc: "Necesitamos concluir las operaciones en Diyarbakır, ya que se necesitan recursos y planificación en otras partes."
 TUR_greenlight_operations_in_euphrates: "Autorizar Operaciones en el Éufrates Medio"
 TUR_greenlight_operations_in_euphrates_desc: "Podemos dar luz verde al TSK para que lance un ataque a gran escala contra el PKK en el Éufrates Medio."
 TUR_end_operations_in_euphrates: "Finalizar Operaciones en el Éufrates Medio"
 TUR_end_operations_in_euphrates_desc: "Necesitamos concluir las operaciones en el Éufrates Medio, ya que se necesitan recursos y planificación en otras partes."
 TUR_clean_out_PKK_in_van: "Eliminar la Presencia del PKK en Van"
 TUR_clean_out_PKK_in_van_desc: "Ha llegado el momento de acabar definitivamente con la presencia del PKK en Van y sus alrededores. Nuestro éxito en la lucha contra el PKK ha dado sus frutos hasta ahora, pero ¿seremos capaces de mantener la paz en Van?"
 TUR_clean_out_PKK_in_diyarbakir: "Eliminar la Presencia del PKK en Diyarbakır"
 TUR_clean_out_PKK_in_diyarbakir_desc: "Ha llegado el momento de acabar definitivamente con la presencia del PKK en Diyarbakır y sus alrededores. Nuestro éxito en la lucha contra el PKK ha dado sus frutos hasta ahora, pero ¿seremos capaces de mantener la paz en Diyarbakır?"
 TUR_clean_out_PKK_in_euphrates: "Eliminar la Presencia del PKK en el Éufrates Medio"
 TUR_clean_out_PKK_in_euphrates_desc: "Ha llegado el momento de que finalmente pongamos fin a la presencia del PKK en el Éufrates Medio y sus alrededores. Nuestro éxito en la lucha contra el PKK ha dado sus frutos hasta ahora, pero ¿seremos capaces de mantener la paz en el Éufrates Medio?"
 TUR_declare_victory_over_PKK: "Triunfo sobre el PKK"
 TUR_declare_victory_over_PKK_desc: "Ha llegado el momento de proclamar nuestra tan esperada victoria y triunfo sobre los terroristas del PKK que comenzaron a atacar despiadadamente nuestra soberanía hace varias décadas."
 TUR_the_promise_of_no_return: "La Promesa de No Regreso"
 TUR_the_promise_of_no_return_desc: "We promised the Kurdish community in the east greater autonomy. Complete five reforms and finalize them before the deadline. Starting each reform extends the deadline. Military operations against PKK bases do not affect this mission."
 TUR_finalize_the_reforms: "Finalizar las Reformas"
 TUR_finalize_the_reforms_desc: "Después de haberse aprobado muchas reformas, es hora de finalizarlas y convocar a un referéndum kurdo adecuado."
 TUR_power_infrastructure: "Establecer una Infraestructura Eléctrica Adecuada"
 TUR_power_infrastructure_desc: "La falta de una red eléctrica adecuada podría provocar graves fallos en la gestión de un estado. El nuevo estado kurdo no será la excepción."
 TUR_jobs_and_careers: "Empleos y Carreras para los Kurdos"
 TUR_jobs_and_careers_desc: "El empleo es fundamental para el progreso del Estado kurdo. Sin empleo y productividad adecuados, la economía de cualquier nación se derrumbaría."
 TUR_kurdish_security_apparatus: "Establecer el Aparato de Seguridad Kurdo"
 TUR_kurdish_security_apparatus_desc: "Without proper security and a competent armed force, the Kurdish state will be susceptible to foreign or internal attacks on its territory. This would eventually spill over into Turkey itself, which is something that we simply cannot afford."
 TUR_pass_the_infrastructure_bill: "Aprobar el Proyecto de Ley de Reforma de Infraestructura"
 TUR_pass_the_infrastructure_bill_desc: "Al aprobar el proyecto de ley de reforma de la infraestructura del Kurdistán Oriental, podremos autorizar formalmente la transferencia de varias industrias a Anatolia Central y construir la infraestructura necesaria para que el futuro estado construya sus propias industrias."
 TUR_release_ocalan: "Liberar a Öcalan"
 TUR_release_ocalan_desc: "Abdullah Öcalan lleva tiempo en prisión, habiendo estado al borde de la ejecución en múltiples ocasiones. Ha llegado el momento de reintegrarlo a la sociedad si queremos mejorar nuestras relaciones con los kurdos."
 TUR_PKK_VAN_BASE: "Van"
 TUR_PKK_DIYARBAKIR_BASE: "Diyarbakır"
 TUR_PKK_EUPHRATES_BASE: "Éufrates Medio"
 TUR_PKK_NO_BASE: "No hay ninguna base seleccionada"
 TUR_PKK_NO_BASE_STRENGTH: "N/A"
 TUR_pkk.2.b: "No. Esto es una amenaza a nuestra soberanía."
 TUR_pkk.100.t: "Ataque previo a la operación en [ROOT.TUR_PKK_bases_name]"
 TUR_pkk.100.d: "Hemos llegado al punto en que debemos empezar a debilitar las defensas del PKK en la base que tenemos como objetivo. Actualmente, se está planificando el movimiento del PKK alrededor de [ROOT.TUR_PKK_bases_name] para que podamos realizar ataques preoperatorios. Siempre existe la posibilidad de que las cosas salgan mal, pero no debemos preocuparnos demasiado por el fracaso si nuestras tropas están preparadas y son eficaces."
 TUR_pkk.100.a: "Lanzar un ataque aéreo coordinado"
 TUR_pkk.100.b: "Interrumpir sus líneas de suministro"
 TUR_pkk.100.c: "Acribillarlos con artillería"
 TUR_pkk.100.d1: "Nosotros podemos sentarnos"
 TUR_pkk.200.t: "Las Tropas Tienen Bajos Suministros"
 TUR_pkk.200.d: "Los informes provenientes del frente en [ROOT.TUR_PKK_bases_name] indican escasez de suministros, lo que indica un posible fallo en nuestra capacidad operativa para infligir daño al PKK. Podemos enviar a las tropas en el frente el equipo que tanto necesitan, pero también debemos recordar mantener nuestros propios suministros para cualquier posible conflicto que se avecine en el escenario internacional."
 TUR_pkk.200.a: "Transpórtenles por aire todo lo que necesiten"
 TUR_pkk.200.b: "Entregar equipo a lugareños confiables para transportarlo"
 TUR_pkk.200.c: "Ellos pueden usar lo que tienen ahora"
 TUR_pkk.201.t: "El PKK se Atrinchera en una Zona Residencial"
 TUR_pkk.201.d: "El PKK ha decidido establecer posiciones defensivas en una zona residencial, poniendo en riesgo a la población civil. Debemos encontrar la manera de eliminar a estos insurgentes sin causar grandes disturbios en la zona; de lo contrario, podríamos arriesgar nuestra reputación y la vida de quienes solo desean que los dejen en paz."
 TUR_pkk.201.a: "Movilizar a las Unidades de Comandos"
 TUR_pkk.201.b: "Intenta atacar de noche"
 TUR_pkk.201.c: "¡Simplementen Lanzar un Ataque!"
 TUR_pkk.202.t: "El PKK Lanza una Contraofensiva"
 TUR_pkk.202.d: "El PKK ha decidido lanzar una gran contraofensiva en la ciudad de [ROOT.TUR_PKK_bases_name], lo que ha provocado cierto desorden y temor entre algunas tropas. Sin embargo, no es momento de andar con rodeos, sino de evaluar nuestros próximos pasos. El alto mando a cargo de las operaciones ha sido notificado y espera órdenes."
 TUR_pkk.202.a: "Responderles con una ofensiva propia."
 TUR_pkk.202.b: "Prepárense para el asalto"
 TUR_pkk.202.c: "Utilice tácticas de tierra arrasada y retírese."
 TUR_pkk.203.t: "Una Gran Caravana del PKK es Emboscada"
 TUR_pkk.203.d: "Utilizando vehículos militares y civiles capturados, el PKK avanzaba desde [ROOT.TUR_PKK_bases_name] hacia un lugar diferente para evitar un ataque inesperado. Sin embargo, nuestros informantes dentro del PKK nos advirtieron del movimiento y logramos emboscarlos. Actualmente, este convoy ha sido rodeado por nuestra Jandarma y esperan órdenes sobre los pasos a seguir."
 TUR_pkk.203.a: "Destruir todo en la zona"
 TUR_pkk.203.b: "Realiza un ataque e intenta capturar el equipo."
 TUR_pkk.203.c: "Déjenlos morir de hambre hasta que se rindan"
 TUR_pkk.204.t: "El PKK Intenta Sembrar División"
 TUR_pkk.204.d: "El PKK ha intentado sembrar la división política en nuestra nación, convocando protestas masivas en todo el país. La policía antidisturbios está en alerta, pero el Congreso y nuestro partido político exigen medidas más severas."
 TUR_pkk.204.a: "Arrestar a los líderes del anillo"
 TUR_pkk.204.b: "Utilicemos el movimiento a nuestro favor"
 TUR_pkk.204.c: "Aprobar leyes para debilitar sus movimientos"
 TUR_pkk.205.t: "Las Fuerzas del PKK se Retiran a Armenia"
 TUR_pkk.205.d: "PKK fighters that were engaged with our own troops have crossed the border into Armenia, even attacking and holding some Armenian border guards hostage. There are a few who are still trying to flee from the engagement with our troops, but we now have to make a decision to either send reinforcements and prepare to cross the border or continue the fight against the ones who are still trying to flee."
 TUR_pkk.205.a: "Abandonar la Operación por Completo"
 TUR_pkk.205.b: "Centrarse en los que todavía están aquí"
 TUR_pkk.205.c: "¡Ve tras ellos!"
 TUR_pkk.206.t: "Las Fuerzas Turcas Sufren una Derrota"
 TUR_pkk.206.d: "Informes provenientes de la frontera turco-armenia sugieren que los combatientes turcos se están retirando a Turquía tras no poder capturar a los militantes del PKK que huyeron a Armenia. Las autoridades armenias han reiterado que no dieron refugio al PKK, sino que se trató de una intrusión inesperada, y que se tomará medidas contra los combatientes del PKK capturados."
 TUR_pkk.206.a: "De acuerdo"
 TUR_pkk.207.t: "Las Fuerzas Armenias se Retiran"
 TUR_pkk.207.d: "Tras una serie de ataques exitosos contra guardias armenios en la frontera, las unidades estacionadas allí acordaron retirarse y permitir la captura de combatientes del PKK que huyeron a Armenia desde la frontera oriental de Turquía."
 TUR_pkk.207.a: "De acuerdo"
 TUR_pkk.208.t: "Las Fuerzas Turcas y Armenias Acuerdan un Alto al Fuego"
 TUR_pkk.208.d: "Tras una serie de enfrentamientos entre guardias fronterizos armenios y turcos, ambas partes acordaron deponer las armas y acordaron un alto el fuego."
 TUR_pkk.208.a: "De acuerdo"
 TUR_pkk.209.t: "Las Tropas Carecen de Transporte Adecuado"
 TUR_pkk.209.d: "Our troops have somehow managed to get themselves stranded on the way back to their base. Reportedly, PKK militants were able to sabotage much of the convoys used to transport the troops to the Eastern border."
 TUR_pkk.209.b: "Diles que sigan presionando"
 TUR_pkk.209.a: "Enviar más transportes"
 TUR_pkk.209.c: "Salvar lo que podamos"
 TUR_pkk.210.t: "Un Presunto Desertor del PKK Promete Inteligencia"
 TUR_pkk.210.d: "Supuestamente, un desertor del PKK se entregó a nuestras unidades, prometiendo revelar posiciones clave de las unidades del PKK estacionadas alrededor de Van. Si no miente, podremos usar su información para destruir por completo las posiciones del PKK que entregue."
 TUR_pkk.210.a: "No se puede confiar en él, pónganlo en una celda."
 TUR_pkk.210.b: "'¿Donde estan ellos?'"
 TUR_pkk.210.c: "'¿Qué más sabes?'"
 TUR_pkk.211.t: "¡Información Engañosa Conduce a Víctimas!"
 TUR_pkk.211.d: "It appears that the information given by the Alleged PKK double agent has been incorrect. As a result, we have lost several good men to this tragedy. Their blood will not be in vain, and our revenge will be swift!"
 TUR_pkk.211.a: "Terrible"
 TUR_pkk.212.t: "Información Lleva a una Base Secreta del PKK"
 TUR_pkk.212.d: "It appears that the information provided to us by the PKK double agent has led to the location of several PKK members at a hidden base. As a result, our men have been able to assault the location and take out several PKK terrorists."
 TUR_pkk.212.a: "¡Genial!"
 TUR_pkk.214.t: "Éxito Operacional en Van"
 TUR_pkk.214.d: "Tras décadas de lucha, la resistencia kurda organizada ha llegado a su fin en la zona metropolitana de Van. La gloriosa bandera del Estado turco ondea más alto que nunca, ya que un nuevo comienzo para la provincia ha renovado las esperanzas de todos los pueblos que la habitan."
 TUR_pkk.214.a: "Por fin.."
 TUR_pkk.215.t: "Éxito Operacional en el Éufrates Medio"
 TUR_pkk.215.d: "Tras décadas de lucha, la resistencia kurda organizada ha llegado a su fin en la región del Gran Éufrates Medio. La gloriosa bandera del Estado turco ondea más alto que nunca, ya que un nuevo comienzo para la provincia ha renovado las esperanzas de todos los pueblos que la habitan."
 TUR_pkk.215.a: "Por fin.."
 TUR_pkk.216.t: "Éxito Operacional en Diyarbakır"
 TUR_pkk.216.d: "Tras décadas de lucha, la resistencia kurda organizada ha llegado a su fin en la zona metropolitana de Diyarbakır. La gloriosa bandera del Estado turco ondea más alto que nunca, ya que un nuevo comienzo para la provincia ha renovado las esperanzas de todos los pueblos que la habitan."
 TUR_pkk.216.a: "Por fin.."
 TUR_pkk.217.t: "[TUR.GetName] Proclama la Victoria Sobre el PKK"
 TUR_pkk.217.d: "El gobierno de [TUR.GetAdjective] ha publicado recientemente un comunicado en el que declara que las Fuerzas Armadas de [TUR.GetAdjective] (TSK) han desmantelado todas las principales bases, células y escondites del PKK. Este anuncio ha preocupado a los separatistas kurdos de Oriente Medio, incluido el propio [TUR.GetName]. El PKK ha estado activo en [TUR.GetName] durante mucho tiempo, desde su fundación en la década de 1970. Inicialmente, el grupo kurdo aspiraba a crear un estado independiente en el este de Turquía, pero su movimiento se vio rápidamente reducido a la necesidad de autonomía en lugar de la independencia total. El gobierno de [TUR.GetAdjective] se ha mantenido firme ante tal presión y ahora puede declarar la victoria sobre el movimiento."
 TUR_pkk.217.a: "Interesante"
 TUR_pkk.604.t: "El PKK Declara Movilización General"
 TUR_pkk.604.d: "El PKK ha declarado una movilización general contra nuestro gobierno. Un portavoz anunció hoy que «todos los simpatizantes del movimiento y todos los luchadores por la libertad deben presentarse ante sus comandantes al amanecer». Este anuncio fue seguido por ataques generales del PKK en localidades que rodean la región del Kurdistán, iniciando oficialmente las hostilidades y creando un clima de gran preocupación para los habitantes de esas zonas. Se declarará pronto el estado de emergencia hasta que el PKK sea completamente erradicado."
 TUR_pkk.604.a: "Muestran sus verdaderos colores..."
 TUR_pkk.600.t: "Consecuencias Catastróficas Tras el Incumplimiento de Nuestra Promesa"
 TUR_pkk.600.d: "Our empty promises have now caught up to us. The Kurds that reside in the east of our state have seized control over Kurdish majority areas. We no longer formally control these territories, with our government being essentially powerless in making an immediate decision as a result of the bureaucratic process that we are stuck in."
 TUR_pkk.600.a: "Oh no"
 TUR_pkk.601.t: "El Referéndum de Autonomía Kurda es Aprobado"
 TUR_pkk.601.d: "The Kurdish autonomy referendum has passed with an overwhelming majority of Kurds voting in favor of autonomization. With this referendum, the People's Republic of Kurdistan will become an Eyalet of [TUR.GetName]. The Kurdistan Workers' Party will be the ruling authority in the state, and they will be able to field an army, govern the laws and politics of the region, and hold elections as they see fit. We will still retain control over major industrial and economic sectors, but a fraction of the profits will still go to the Kurdish state."
 TUR_pkk.601.a: "De acuerdo"
 TUR_VAN_SELECTED_OP: "Van ha sido seleccionado"
 TUR_commence_operations_in_van: "Iniciar Operaciones en Van"
 TUR_commence_operations_in_van_desc: "Ha llegado el momento de atacar profundamente el corazón del PKK en nuestra nación. Siendo el bastión más oriental de nuestro país, el PKK utiliza Van como base para muchos de sus ataques contra el oeste de Turquía e Irán. Iniciaremos operaciones para eliminarlos, y Van quedará libre de la amenaza que ha persistido allí durante todos estos años."
 TUR_PKK_ACTIVITY: "Insurgencias activas del £TUR_Neutral_Communism PKK"
 TUR_PKK_ACTIVITY_desc: "El PKK tiene"
 TUR_misak_mili: "Misak-ı Millî"
 TUR_misak_mili_desc: "\n£TUR_desctext_misak \n\n\n\n\n§HMisak-ı Millî§! (National Pact) was a set of six decisions passed by the parliament in the 1920's. Vitalized primarily after the destruction of the [TUR.GetFlag] Ottoman Empire at the hands of the Entente, the §HNational Pact§! sought out to restore some of Turkey's lost glory, and its lands. However the decisions were not followed through with due to the [TUR.GetFlag] Turkish war of independence and the establishment of the [TUR.GetFlag] Turkish Republic by Mustafa Kemal Ataturk. However the concept and ideals of the §HNational Pact§! still resonates within many [TUR.GetFlag] Turkish nationalists in the modern day, despite its lack of wide-spread support in the national populace."
 TUR_armenian_integration: "[ARM.GetFlag] Regresar a Armenia"
 TUR_levantine_vilayets: "[SYR.GetFlag] [LEB.GetFlag] Vilayets Levantinos"
 TUR_eastern_resolve: "[KUR.GetFlag] [PUK.GetFlag] Resolución Oriental"
 TUR_aegean_realignment: "[GRE.GetFlag] Realineación del Egeo"
 TUR_crescent_and_olive: "[CYP.GetFlag] [NCY.GetFlag] Crescent y el Olivo"
 TUR_kurdish_schools: "Escuelas y Universidades Kurdas"
 TUR_kurdish_schools_desc: "Permitiremos el uso del kurdo junto con el turco en escuelas y ciudades específicas, siempre que lo consideremos necesario. Esto será especialmente útil para los jóvenes, independientemente de si son bilingües o no."
 TUR_kurdish_language_5: "Canal Estatal Kurdo"
 TUR_kurdish_language_5_desc: "TRT (short for Türkiye Radyo Televizyon, Turkish Radio and Television) has been our official state TV since '68. Over the years, its numbers grew and there are now several channels of TRT, some of them are for general subjects or for example TRT-Müzik broadcasts only music or TRT-Belgesel broadcasts only documentaries. We should open up a new one that will operate in Kurdish language. This can cost more but will further discredit PKK propaganda."
 TUR_finalized_reforms: "Ha finalizado las reformas"
 TUR_fight_army_incompetence: "Ejército de \"Hombres Sí\""
 TUR_fight_army_incompetence_desc: "Nuestro ejército será reformado y reestructurado para que tengamos más gente que diga \"Sí, señor\" y menos gente que diga \"No\""
 Turkish_mafia.1200.t: "PKK Insurgency Eliminated"
 Turkish_mafia.1200.d: "Our security forces have completed operations across the Kurdish regions. The PKK's capacity to threaten Turkish territory has been broken and order is being restored."
 Turkish_mafia.1200.a: "Our work here is done."
 Turkish_parties.11.t: "The Rights and Equality Party"
 Turkish_parties.11.d: "Retired general Osman Pamukoğlu, celebrated for his command in the southeast and known to his supporters as the 'Legendary Commander', has founded the Hak ve Eşitlik Partisi (HEPAR). The party blends staunch secular Kemalism with a hard line on the Kurdish question, presenting itself as a nationalist alternative untainted by the established parties."
 Turkish_parties.11.a: "A new force enters the arena"
 TUR_PKK_TT: "£decision_icon_small §YUnlocks§! Additional §YDecisions§! for Trouble in Kurdistan\n - Taking this option will let us move against the PKK while keeping our neighbors on side.\n - [PER.GetFlag] Iran, [SYR.GetFlag] Syria, [IRQ.GetFlag] Iraq and the [KUR.GetFlag] Kurds will be invited to a security summit in Diyarbakir.\n - Every neighbor that attends will help us wear the PKK down."
 TUR_ai_build_the_akp: "Build the Party of Justice and Development"
 TUR_ai_build_the_akp_desc: "The remnants of the Virtue Party's reformist wing are organising a new movement, and the machine behind it is being assembled district by district."
 TUR_ai_rally_the_kemalists: "Rally the Republican Ranks"
 TUR_ai_rally_the_kemalists_desc: "The republican establishment is closing ranks and campaigning hard to keep the secular parties ahead of the field."
 TUR_ai_rally_the_grey_wolves: "Rally the Nationalist Movement"
 TUR_ai_rally_the_grey_wolves_desc: "The nationalist movement is organising in the provinces, and its rallies are drawing crowds the established parties can no longer match."
 TUR_ai_build_hizmet: "Expand the Hizmet Network"
 TUR_ai_build_hizmet_desc: "The movement's schools, newspapers and business associations are quietly building a following that no party list yet reflects."
 TUR_ai_rally_the_left: "Rally the Turkish Left"
 TUR_ai_rally_the_left_desc: "The revolutionary left is organising in the unions and the universities, taking the anti-establishment vote the Islamists have been living on."
 TUR_ai_rally_the_virtue_party: "Rally the Virtue Party"
 TUR_ai_rally_the_virtue_party_desc: "The Islamist movement is consolidating behind the Virtue Party, gathering the votes it will need to govern."
 TUR_ai_rally_the_great_east: "Preach the Great East"
 TUR_ai_rally_the_great_east_desc: "The movement's preachers are carrying Necip Fazıl's vision of a restored Islamic order into the mosques and the party's own rank and file."
 TUR_pkk.605.t: "Renewed Offensive in the Southeast"
 TUR_pkk.605.d: "The PKK has spent years rebuilding in the mountains while the government looked elsewhere, and the general staff will wait no longer. A state of emergency has been declared across the southeastern provinces, reservists are being called up, and the army is moving into the valleys in strength. The insurgency will be broken back down to a manageable size, but the bill will be a heavy one: in conscripts, in lira, and in the government's standing at home."
 TUR_pkk.605.a: "Whatever it takes."
 TUR_PKK_OFFENSIVE_TT: "The £TUR_Neutral_Communism  §OPKK Insurgency§! is beaten back down to a manageable strength, but it is not destroyed."
 TUR_fund_oil_strikes: "Funded Oil Industry Strikes"