 infantry_mass_assault: "대규모 보병 돌격"
 infantry_mass_assault_desc: "Using human wave tactics, massed infantry formations, and mass charges, we will overrun enemy positions under a weight of bodies."
 early_guerilla_warfare: "초기 유격전"
 early_guerilla_warfare_desc: "Using hit and run tactics, and fighting with unconventional strategies, we can defeat a militarily superior enemy and prolong the battle."
 tech_power_systems_2: "Jet Turbine Engines"
 tech_power_systems_2_desc: "거대 함선을 더욱 고속으로 전진시킬 수 있게하는 터빈 엔진은, 주로 디젤 엔진과 혼합되어 사용되며, 높고 낮은 출력의 모든 스펙트럼의 성능을 가능하게 합니다."
 tech_power_systems_3: "Advanced Jet Turbine Engines"
 tech_power_systems_3_desc: "Advanced naval turbine engines provide high power density and rapid acceleration for large warships, allowing vessels to reach high speeds while operating alongside diesel engines or electric drives for more efficient cruising."
 tech_fire_control_3: "Advanced Integrated Missile Radar Control"
 tech_fire_control_3_desc: "The ability to track the launch, flight, and intercept of enemy weapons at subsonic, supersonic, and even hypersonic speeds"
 tech_point_defense_system_1_desc: "근접 무기 시스템 (CIWS)은 대함 미사일 (AShM 또는 ASM)과 공격 항공기에 대항하는 자동화된 방어 무기 체계 (최종 방어 또는 거점 방어)의 최종 생산 라인으로 개발되었습니다. 중력가속도(high-g) 비행으로 조종되며 수면에 스치듯 비행하는 항공기 (sea-skimmer)가 포함됩니다."
 tech_turret_missiles_surface_4: "Anti-Vessel Missiles 2015"
 tech_turret_missiles_surface_4_desc: "Advanced anti-vessel missile systems use networked targeting, improved datalinks, and more capable onboard seekers to coordinate anti-ship missiles and anti-submarine weapons across the fleet."
 tech_turret_missiles_surface_5: "Anti-Vessel Missiles 2030"
 tech_turret_missiles_surface_5_desc: "Future anti-vessel missile systems combine low-observable designs, passive sensors, sea-skimming navigation, and automatic target recognition for surface attack, while improving standoff delivery against underwater threats."
 tech_vls_surface_5: "VLS Surface-Attack Missiles 2030"
 tech_vls_surface_5_desc: "Future VLS strike missiles combine low-observable designs, passive sensors, and improved target recognition to penetrate modern air defenses and attack mobile or time-sensitive surface targets with greater reliability."
 tech_vls_aa_5: "VLS Surface-to-Air Missiles 2030"
 tech_vls_aa_5_desc: "Future VLS air-defense missiles use multi-mode seekers, cooperative engagement networks, and improved terminal maneuvering to intercept low-flying missiles, stealthier aircraft, drones, and maneuvering high-speed threats."
 EQ_MOD_CAT_module_gun_battery_category_TITLE: "포대"
 EQ_MOD_CAT_module_anti_ship_torpedoes_category_TITLE: "이중 목적 어뢰"
 EQ_MOD_CAT_module_sub_esm_category_TITLE: "전자전지원"
 EQ_MOD_CAT_module_fire_control_system_category_TITLE: "사격 통제 장치"
 module_flight_deck_5: "Large Aircraft Carrier Deck (50)"
 module_flight_deck_6: "Large Aircraft Carrier Deck II (60)"
 module_flight_deck_7: "Super Aircraft Carrier Deck (70)"
 module_flight_deck_8: "Super Aircraft Carrier Deck II (80)"
 module_flight_deck_9: "Advanced Aircraft Super Carrier Deck (90)"
 module_flight_deck_10: "Advanced Aircraft Super Carrier Deck II (100)"
 module_light_flight_deck_3: "강습상륙함(LHA)"
 module_light_flight_deck_3_desc: "Landing Helicopter Assault ships represent fully developed amphibious assault vessels, capable of sustained helicopter operations and coordinated force projection. These platforms enable large-scale amphibious landings, command-and-control operations, and expeditionary warfare.\n\n§GDesigner Hint: Light Flight Decks trade Cannon Attack for Deck Size as tiers advance. Use the Transport Dock for direct firepower or later assault decks for embarked aviation.§!"
 module_sub_esm_1: "전자전지원 I"
 module_sub_esm_1_desc: "Early Electronic Support Measures systems allow ships to detect, identify, and classify enemy radar emissions. These systems improve situational awareness and provide limited early warning against hostile threats.\n\n§GDesigner Hint: Submarine ESM increases Health Power and reduces Sub Visibility, improving survivability and stealth. It is useful for boats operating near enemy sensors, but raises production cost and requires Microchips.§!"
 module_sub_esm_2: "전자전지원 II"
 module_sub_esm_2_desc: "Improved ESM suites feature expanded frequency coverage and faster signal processing, enhancing the ability to track enemy sensors and support defensive countermeasures in complex electromagnetic environments.\n\n§GDesigner Hint: Submarine ESM increases Health Power and reduces Sub Visibility, improving survivability and stealth. It is useful for boats operating near enemy sensors, but raises production cost and requires Microchips.§!"
 module_sub_esm_3: "전자전지원 III"
 module_sub_esm_3_desc: "Advanced Electronic Support Measures integrate high-speed data processing and networked sensor fusion, allowing precise threat identification, improved early warning, and enhanced coordination with electronic warfare and combat systems.\n\n§GDesigner Hint: Submarine ESM increases Health Power and reduces Sub Visibility, improving survivability and stealth. It is useful for boats operating near enemy sensors, but raises production cost and requires Microchips.§!"
 module_chain_gun: "체인건 I"
 module_chain_gun_desc: "Light chain guns comprise everything as small as .30 Cal support machine guns to .50 Cal Anti-Aircraft guns. The latter being the more popular armament for a ship of war.\n\n§GDesigner Hint: This point-defense system improves Anti-Air and Armor while adding a little Health Power. It is useful against air and missile threats, but adds production cost, fuel use, manpower, and Surface Visibility.§!"
 module_anti_ship_torpedoes_1: "이중 목적 어뢰 I"
 module_anti_ship_torpedoes_1_desc: "초기 겸용 어뢰는 기본적인 수중 및 수상 타격 능력을 제공합니다. 사거리와 유도 능력은 제한적이지만 함선이 잠수함과 수상 표적 모두와 교전할 수 있게 합니다.\n\n§G설계 힌트: 겸용 어뢰는 수상함에 대한 어뢰 공격력과 잠수함에 대한 대잠수함전 능력을 제공합니다. 적정한 IC 비용으로 유연한 무장을 갖출 수 있지만 전용 대잠 무기보다는 특화도가 떨어집니다.§!"
 module_anti_ship_torpedoes_2: "이중 목적 어뢰 II"
 module_anti_ship_torpedoes_2_desc: "개량된 겸용 어뢰는 향상된 유도 및 추진 체계를 갖추어 잠항 중인 위협과 수상 위협 모두에 대한 정확도를 높입니다.\n\n§G설계 힌트: 겸용 어뢰는 수상함에 대한 어뢰 공격력과 잠수함에 대한 대잠수함전 능력을 제공합니다. 적정한 IC 비용으로 유연한 무장을 갖출 수 있지만 전용 대잠 무기보다는 특화도가 떨어집니다.§!"
 module_anti_ship_torpedoes_3: "이중 목적 어뢰 III"
 module_anti_ship_torpedoes_3_desc: "현대식 겸용 어뢰는 첨단 유도 체계와 더 빠른 속도를 통합하여 회피하는 잠수함과 민첩한 수상함에 대한 교전 신뢰도를 높입니다.\n\n§G설계 힌트: 겸용 어뢰는 수상함에 대한 어뢰 공격력과 잠수함에 대한 대잠수함전 능력을 제공합니다. 적정한 IC 비용으로 유연한 무장을 갖출 수 있지만 전용 대잠 무기보다는 특화도가 떨어집니다.§!"
 module_anti_ship_torpedoes_4: "이중 목적 어뢰 IV"
 module_anti_ship_torpedoes_4_desc: "고도로 발전한 겸용 어뢰는 정교한 센서, 연장된 사거리, 대응책 저항력을 활용하여 복잡한 해양 환경에서도 효과적인 타격을 가능하게 합니다.\n\n§G설계 힌트: 겸용 어뢰는 수상함에 대한 어뢰 공격력과 잠수함에 대한 대잠수함전 능력을 제공합니다. 적정한 IC 비용으로 유연한 무장을 갖출 수 있지만 전용 대잠 무기보다는 특화도가 떨어집니다.§!"
 module_anti_ship_torpedoes_5: "이중 목적 어뢰 V"
 module_anti_ship_torpedoes_5_desc: "차세대 겸용 어뢰는 은밀한 접근, 지능형 표적 선정, 늘어난 항속 시간을 강조하여 잠수함과 수상함 모두에 대한 뛰어난 공격 및 방어 능력을 제공합니다.\n\n§G설계 힌트: 겸용 어뢰는 수상함에 대한 어뢰 공격력과 잠수함에 대한 대잠수함전 능력을 제공합니다. 적정한 IC 비용으로 유연한 무장을 갖출 수 있지만 전용 대잠 무기보다는 특화도가 떨어집니다.§!"
 module_anti_ship_torpedoes_6: "이중 목적 어뢰 VI"
 module_anti_ship_torpedoes_6_desc: "근미래 겸용 어뢰는 어뢰 기술의 정점으로서 인공지능 보조 유도, 극한의 속도, 첨단 대대응책 체계를 결합하여 수중과 수상 전장을 모두 지배합니다.\n\n§G설계 힌트: 겸용 어뢰는 수상함에 대한 어뢰 공격력과 잠수함에 대한 대잠수함전 능력을 제공합니다. 적정한 IC 비용으로 유연한 무장을 갖출 수 있지만 전용 대잠 무기보다는 특화도가 떨어집니다.§!"
 module_minelaying: "기뢰부설"
 module_minelaying_desc: "기뢰를 부설할 수 있게 하여, 함선이 수중 폭발물로 해역을 봉쇄할 수 있습니다.\n\n§G설계 힌트: 기뢰 부설 장비는 기뢰 부설 임무를 가능하게 하며 기뢰 부설 능력을 추가합니다. 전략적 해역을 통제하는 데 유용하지만 생산 비용, 연료 소모, 인력, 수상 가시성이 증가합니다.§!"
 module_mineclearing: "기뢰소해"
 module_mineclearing_desc: "이 함선이 해역의 기뢰를 제거할 수 있게 합니다.\n\n§G설계 힌트: 소해 장비는 소해 임무를 가능하게 하며 소해 능력을 추가합니다. 중요한 해상 교통로를 열어 두는 데 유용하지만 생산 비용, 연료 소모, 수상 가시성이 증가합니다.§!"
 module_anti_submarine_mortar: "대잠 박격포"
 module_anti_submarine_mortar_desc: "함상 설치 대잠 박격포는 근거리 수중 타격 능력을 제공합니다. 인근 잠수함으로부터 방어하는 데 효과적이며 소나 및 어뢰 체계를 보완합니다.\n\n§G설계 힌트: 대잠 박격포는 매우 낮은 생산 및 인력 비용으로 대잠수함전 능력을 추가합니다. 저렴한 근거리 대잠 무장으로 유용하지만 자체적인 탐지 능력은 없습니다.§!"
 module_surface_jet_turbine_power2: "발전된 엔진"
 module_surface_jet_turbine_power2_desc: "정제된 제트 터빈은 출력과 효율을 높여 향상된 신뢰성으로 지속적인 고속 작전을 가능하게 합니다.\n\n§G설계 힌트: 제트 터빈은 기존 기관보다 더 높은 속력과 최대 항속거리를 제공하며 수상 가시성이 낮습니다. 지역 전투 함대에 적합하지만 생산 비용과 연료 소모가 증가합니다.§!"
 module_surface_jet_turbine_power3: "미래형 제트 엔진"
 module_surface_jet_turbine_power3_desc: "차세대 터빈은 현대 수상 전투함에 최고의 속도, 효율, 항속 시간을 제공합니다.\n\n§G설계 힌트: 제트 터빈은 기존 기관보다 더 높은 속력과 최대 항속거리를 제공하며 수상 가시성이 낮습니다. 지역 전투 함대에 적합하지만 생산 비용과 연료 소모가 증가합니다.§!"
 module_light_surface_jet_turbine_power2: "향상된 소형 제트 엔진"
 module_light_surface_jet_turbine_power2_desc: "개량된 소형 터빈은 더 높은 출력 대 중량비와 향상된 신뢰성을 제공하여 고속 공격정에 적합합니다.\n\n§G설계 힌트: 경량 제트 터빈은 디젤 기관보다 더 높은 속력과 최대 항속거리를 제공하며 수상 가시성이 낮습니다. 고속 지역 전투함에 적합하지만 생산 비용과 연료 소모가 증가합니다.§!"
 module_light_surface_jet_turbine_power3: "미래형 소형 제트 엔진"
 module_light_surface_jet_turbine_power3_desc: "최첨단 터빈은 현대 경수상 전투함에 뛰어난 속도와 항속 시간을 제공합니다.\n\n§G설계 힌트: 경량 제트 터빈은 디젤 기관보다 더 높은 속력과 최대 항속거리를 제공하며 수상 가시성이 낮습니다. 고속 지역 전투함에 적합하지만 생산 비용과 연료 소모가 증가합니다.§!"
 module_sub_diesel_electric_power2: "디젤 전기 동력 2"
 module_sub_diesel_electric_power2_desc: "개량된 디젤전기 체계는 효율과 배터리 지속 시간을 높여 더 긴 잠항 작전을 가능하게 합니다.\n\n§G설계 힌트: 디젤전기 추진은 연료에 의존하는 저렴한 잠수함을 제공하며, 상위 등급에서 속력, 최대 항속거리, 은밀성이 향상됩니다. 지역 및 인근 해역 작전에 적합하지만 원자로의 전 지구적 항속 시간에는 미치지 못합니다.§!"
 module_sub_diesel_electric_power3: "디젤 전기 동력 3"
 module_sub_diesel_electric_power3_desc: "현대식 디젤전기 추진은 더 높은 속도와 더 나은 잠항 지속 시간을 제공하여 전술적 유연성을 높입니다.\n\n§G설계 힌트: 디젤전기 추진은 연료에 의존하는 저렴한 잠수함을 제공하며, 상위 등급에서 속력, 최대 항속거리, 은밀성이 향상됩니다. 지역 및 인근 해역 작전에 적합하지만 원자로의 전 지구적 항속 시간에는 미치지 못합니다.§!"
 module_sub_diesel_electric_power4: "디젤 전기 동력 4"
 module_sub_diesel_electric_power4_desc: "첨단 디젤전기 체계는 은밀성과 에너지 효율을 개선하여 잠항 작전 반경을 넓힙니다.\n\n§G설계 힌트: 디젤전기 추진은 연료에 의존하는 저렴한 잠수함을 제공하며, 상위 등급에서 속력, 최대 항속거리, 은밀성이 향상됩니다. 지역 및 인근 해역 작전에 적합하지만 원자로의 전 지구적 항속 시간에는 미치지 못합니다.§!"
 module_sub_diesel_electric_power5: "디젤 전기 동력 5"
 module_sub_diesel_electric_power5_desc: "차세대 디젤전기 추진은 현대식 잠수함에 속도, 항속 시간, 잠항 은밀성의 최적 균형을 제공합니다.\n\n§G설계 힌트: 디젤전기 추진은 연료에 의존하는 저렴한 잠수함을 제공하며, 상위 등급에서 속력, 최대 항속거리, 은밀성이 향상됩니다. 지역 및 인근 해역 작전에 적합하지만 원자로의 전 지구적 항속 시간에는 미치지 못합니다.§!"
 module_76mm_battery: "76mm 포대"
 module_127mm_battery: "127mm 포대"
 module_100mm_battery: "100mm 포대"
 module_152mm_battery: "152mm 포대"
 module_76mm_battery_desc: "대공 및 근거리 수상 방어를 위한 속사 능력을 제공하는 경량 함포 포대입니다.\n\n§G설계 힌트: 함포 포대는 다용도 수상 및 대공 방어를 위한 포 공격력, 대공, 체력을 제공합니다. 더 큰 포대일수록 화력이 높지만 IC, 연료, 인력, 수상 가시성도 더 많이 요구합니다.§!"
 module_127mm_battery_desc: "중거리에서 수상 표적과 항공기에 효과적인 중형 함포 포대입니다.\n\n§G설계 힌트: 함포 포대는 다용도 수상 및 대공 방어를 위한 포 공격력, 대공, 체력을 제공합니다. 더 큰 포대일수록 화력이 높지만 IC, 연료, 인력, 수상 가시성도 더 많이 요구합니다.§!"
 module_100mm_battery_desc: "수상 및 항공 위협에 대해 다목적 화력을 제공하는 표준 함포 포대입니다.\n\n§G설계 힌트: 함포 포대는 다용도 수상 및 대공 방어를 위한 포 공격력, 대공, 체력을 제공합니다. 더 큰 포대일수록 화력이 높지만 IC, 연료, 인력, 수상 가시성도 더 많이 요구합니다.§!"
 module_152mm_battery_desc: "함선과 해안 요새에 대해 강력한 장거리 포격을 가하는 중형 이상의 함포 포대입니다.\n\n§G설계 힌트: 함포 포대는 다용도 수상 및 대공 방어를 위한 포 공격력, 대공, 체력을 제공합니다. 더 큰 포대일수록 화력이 높지만 IC, 연료, 인력, 수상 가시성도 더 많이 요구합니다.§!"
 module_76mm_gun_1: "76mm 초기 속사포"
 module_76mm_gun_2: "76mm 속사포"
 module_76mm_gun_3: "76mm 속사포 - 유도탄"
 module_76mm_gun_4: "76mm 초고속사포"
 module_76mm_gun_1_desc: "초기 76mm 속사포는 기본적인 대공 및 근거리 수상 화력을 제공합니다.\n\n§G설계 힌트: 함포는 포 공격력과 대공을 제공하며 체력도 소폭 높여 줍니다. 경제적인 겸용 무기로 유용하지만 IC, 연료, 인력, 수상 가시성이 증가하고 포 관통력은 없습니다.§!"
 module_76mm_gun_2_desc: "개량된 76mm 속사포는 발사 속도와 정확도를 높여 다목적 방어를 가능하게 합니다.\n\n§G설계 힌트: 함포는 포 공격력과 대공을 제공하며 체력도 소폭 높여 줍니다. 경제적인 겸용 무기로 유용하지만 IC, 연료, 인력, 수상 가시성이 증가하고 포 관통력은 없습니다.§!"
 module_76mm_gun_3_desc: "유도탄을 장착한 이 76mm 포는 빠르거나 기동하는 표적에 대한 명중 확률을 높입니다.\n\n§G설계 힌트: 함포는 포 공격력과 대공을 제공하며 체력도 소폭 높여 줍니다. 경제적인 겸용 무기로 유용하지만 IC, 연료, 인력, 수상 가시성이 증가하고 포 관통력은 없습니다.§!"
 module_76mm_gun_4_desc: "유도탄을 사용하는 76mm 초속사포는 근거리에서 중거리까지 뛰어난 대공 및 대수상 성능을 제공합니다.\n\n§G설계 힌트: 함포는 포 공격력과 대공을 제공하며 체력도 소폭 높여 줍니다. 경제적인 겸용 무기로 유용하지만 IC, 연료, 인력, 수상 가시성이 증가하고 포 관통력은 없습니다.§!"
 module_127mm_guns_1: "127mm I"
 module_127mm_guns_2: "127mm II"
 module_127mm_guns_3: "127mm III"
 module_127mm_guns_4: "127mm IV"
 module_127mm_guns_1_desc: "초기 127mm 함포는 수상 교전을 위한 적정 수준의 화력과 제한적인 대공 능력을 제공합니다.\n\n§G설계 힌트: 함포는 포 공격력과 대공을 제공하며 체력도 소폭 높여 줍니다. 경제적인 겸용 무기로 유용하지만 IC, 연료, 인력, 수상 가시성이 증가하고 포 관통력은 없습니다.§!"
 module_127mm_guns_2_desc: "개량된 127mm 포는 더 높은 발사 속도와 더 나은 정확도를 제공하여 현대 해상 위협에 대한 효율을 높입니다.\n\n§G설계 힌트: 함포는 포 공격력과 대공을 제공하며 체력도 소폭 높여 줍니다. 경제적인 겸용 무기로 유용하지만 IC, 연료, 인력, 수상 가시성이 증가하고 포 관통력은 없습니다.§!"
 module_127mm_guns_3_desc: "현대식 127mm 포는 첨단 사격통제 및 안정화 장치를 통합하여 안정적인 장거리 교전을 가능하게 합니다.\n\n§G설계 힌트: 함포는 포 공격력과 대공을 제공하며 체력도 소폭 높여 줍니다. 경제적인 겸용 무기로 유용하지만 IC, 연료, 인력, 수상 가시성이 증가하고 포 관통력은 없습니다.§!"
 module_127mm_guns_4_desc: "고도로 발전한 127mm 함포는 뛰어난 정확도, 사거리, 발사 속도를 제공하여 함선과 항공기 모두에 효과적입니다.\n\n§G설계 힌트: 함포는 포 공격력과 대공을 제공하며 체력도 소폭 높여 줍니다. 경제적인 겸용 무기로 유용하지만 IC, 연료, 인력, 수상 가시성이 증가하고 포 관통력은 없습니다.§!"
 tech_light_guns_3: "Naval Guns 2025"
 tech_light_guns_3_desc: "이중 목적의 부포는 수상과 공중 표적에 대응하기 위해 고안된, 소구경 및 대구경의 해상 탑재 부포입니다."
 Major_Importer_RUS_Arms: "주요 러시아 수입원"
 mbt_tech: "Early Armored Hull"
 mbt_tech_desc: "The first generation of armored vehicle hulls."
 mbt_tech_1: "Cold War Armored Hull"
 mbt_tech_1_desc: "The second generation of armored vehicle hulls."
 mbt_tech_2: "Post Cold War Armored Hull"
 mbt_tech_2_desc: "The third generation of armored vehicle hulls."
 mbt_tech_3: "Modern Armored Hull"
 mbt_tech_3_desc: "Modern armored vehicle hulls."
 mbt_tech_4: "Cutting-edge Armored Hull"
 mbt_tech_4_desc: "Cutting-Edge armored vehicle hulls."
 tank_components_tech: "초기 차량 컴퓨터 시스템"
 tank_components_tech_desc: "기본적인 라디오와 탄도 계산기를 통해 전차 승무원 간의 소통을 원활히 하고 표적에 대한 발사의 정확도를 높일 수 있습니다. 이러한 개선은 전차의 공격력을 향상시키며, 보조 자동 소총과 연막 발사기를 통해 방어 능력도 향상 시킬 수 있습니다."
 tank_components_tech_2: "냉전기 차량 컴퓨터 시스템"
 tank_components_tech_2_desc: "2중 라디오 장비와 반 디지털 탄도 계산기를 장착합니다."
 tank_components_tech_3: "현대 배틀스테이션 및 보조장치"
 tank_components_tech_3_desc: "항해 시스템, 카메라와 완전히 디지털화된 탄도 계산기입니다. 방어 능력을 향상시키기 위해서, 연막 발사기는 이제 전차의 적외선 신호 또한 감출 수 있게 될 것입니다."
 tank_components_tech_4: "발전된 차량 컴퓨터 시스템"
 tank_components_tech_4_desc: "카메라 세트와 향상된 전투 측정 시스템입니다. 개선된 컴퓨터 시스템을 통하여 우리 전차에 다가오는 발사체를 파괴 시킬 수 있는 하드킬 (hard-kill) 방어 시스템을 탑재할 수 있습니다."
 tank_components_tech_5: "Cutting-edge Vehicle Computer Systems"
 tank_components_tech_5_desc: "3D 시각화, 가상 전장, 최신 기술과 통신 시스템과 개선된 감지 알고리즘을 탑재하여 하드킬 기술을 더욱 향상시킬 것입니다."
 era_tech: "1세대 폭발반응장갑 (ERA)"
 era_tech_desc: "Explosive reactive armour (ERA) consists of bricks made of explosives on a metal frame installed on the tank. As the brick is hit by a kinetic penetrator or a shaped charge, the brick explodes, countering the incoming projectile. The first experiments were done in the 60s to counter early shaped charges, but none made it to production."
 era_tech_2: "2세대 폭발반응장갑 (ERA)"
 era_tech_2_desc: "폭발반응장갑 벽돌의 크기를 늘리고 더 많은 폭발물과 함께 두꺼워진 구조물을 적용시켜, 폭발력이 운동 탄환을 압도할 수 있을 만큼 향상되었습니다."
 era_tech_3: "3세대 폭발반응장갑 (ERA)"
 era_tech_3_desc: "새로운 구조를 통해, 폭발반응장갑의 운동 탄환과 성형 탄두에 대한 내구성이 증가하였습니다. 또한 이는 폭발반응장갑을 뚫기 위해 특수 고안된 탠덤 탄두 조차도 방어할 수 있습니다."
 era_tech_4: "4세대 폭발반응장갑 (ERA)"
 era_tech_4_desc: "Advanced form of ERA, capable of operating in various environmental conditions and able to reduce the efficiency of most incoming fire."
 armor_tech: "초기 냉전 장갑"
 armor_tech_desc: "전차 보호 향상을 위해 고안된 초기 복합물과 공간 장갑입니다."
 armor_tech_2: "냉전기 장갑"
 armor_tech_2_desc: "개선된 복합물의 재료와 향상된 장갑 설계 배치를 적용합니다."
 armor_tech_3: "현대 장갑"
 armor_tech_3_desc: "가장 현대적인 재료와 장갑의 개선이 진행되었습니다."
 armor_tech_4: "Cutting-Edge Armour"
 armor_tech_4_desc: "Highly sophisticated armor upgrades."
 diesel_engine_tech: "초기 냉전 디젤 엔진"
 diesel_engine_tech_desc: "Early Cold War diesel engines were usually naturally aspirated V12 engines derived from existing World War 2 era designs. These engines were often paired with a 5-speed manual gearbox."
 diesel_engine_tech_2: "냉전기 디젤 엔진"
 diesel_engine_tech_2_desc: "엔진 기술이 향상됨에 따라, 기존의 냉전 초기 엔진에 터보차저가 결합되어 출력이 대폭 향상되었습니다. 이 시기에는 전차용 7단 수동 변속기가 개발되었습니다."
 diesel_engine_tech_3: "냉전 후기 디젤 엔진"
 diesel_engine_tech_3_desc: "냉전 후기에 이르러 많은 전차 엔진에 두 번째 터보차저가 장착되면서 트윈 터보차저 엔진이 탄생했습니다."
 diesel_engine_tech_4: "냉전 이후 디젤 엔진"
 diesel_engine_tech_4_desc: "After the Cold War, tank engines started receiving superchargers instead of turbochargers to increase their output. During this era automatic transmissions in tanks started also being commonplace."
 diesel_engine_tech_5: "근현대 디젤 엔진"
 diesel_engine_tech_5_desc: "As technology in cars was improved, tank engines adopted many features of car engines such as direct fuel injection."
 diesel_engine_tech_6: "현대 디젤 엔진"
 diesel_engine_tech_6_desc: "현대의 전차 공학자들은 전통적인 V12 엔진 대신 X12 배열과 같은 새로운 엔진 구조를 연구하고 실험하기 시작했습니다."
 diesel_engine_tech_7: "최첨단 디젤 엔진"
 diesel_engine_tech_7_desc: "향상된 연료 효율성, 전산화된 엔진 제어 및 첨단 소재를 통해 미래의 엔진은 강력하면서도 경량화된 형태를 갖출 수 있습니다."
 turbine_engine_tech: "냉전기 터빈 엔진"
 turbine_engine_tech_desc: "항공기 산업에서 적용된 부피가 크고 신뢰할 수 없는 초기 가스 터빈 엔진입니다."
 turbine_engine_tech_2: "냉전 후기 터빈 엔진"
 turbine_engine_tech_2_desc: "개선된 설계는 대부분의 터빈 설계의 결함을 수정하고 현장에서 유용하도록 만들었습니다."
 turbine_engine_tech_3: "냉전 이후 터빈 엔진"
 turbine_engine_tech_3_desc: "Post Cold War turbine design focusing on improving power output and fuel efficiency."
 turbine_engine_tech_4: "근현대 터빈 엔진"
 turbine_engine_tech_4_desc: "신뢰성과 출력이 우수한 가스 터빈입니다."
 turbine_engine_tech_5: "현대 터빈 엔진"
 turbine_engine_tech_5_desc: "가스 터빈에 대한 현대 기술의 정점입니다."
 turbine_engine_tech_6: "Improved Exoskeletal Engine"
 turbine_engine_tech_6_desc: "첨단 소재가 사용되어 가스 터빈의 마찰을 줄이고, 출력과 연비가 향상되었습니다."
 electric_engine_tech_1: "보조 전기 엔진"
 electric_engine_tech_1_desc: "보조 전기 엔진(또는 보조 동력 유닛)을 사용하면 주 엔진을 가동하지 않고도 포탑 등 전차의 일부 부위를 작동할 수 있습니다. 이를 통해 전차가 정지 상태일 때도 전력을 운용하며 연료를 절약할 수 있습니다."
 electric_engine_tech_2: "개선된 보조 전기 엔진"
 electric_engine_tech_2_desc: "기존 보조 전기 엔진을 개선하여 성능과 효율성을 크게 높였습니다."
 electric_engine_tech_3: "초기 전기 엔진"
 electric_engine_tech_3_desc: "초기형 전기 동력 전달 계통입니다. 비록 지금까지는 보조 동력으로만 사용되었으나, 이제 전차 전체의 동력을 감당할 수 있는 기술 수준에 도달했습니다."
 electric_engine_tech_4: "개선된 전기 엔진"
 electric_engine_tech_4_desc: "신뢰성이 향상된 전기 엔진의 개선형 모델입니다."
 small_medium_gun_tech: "초기 냉전 전차포"
 small_medium_gun_tech_desc: "경전차포는 냉전 초기의 탱크에서 흔히 볼 수 있었습니다. 표준은 소련의 경우 100mm이고 서방 국가의 경우 105mm였으며 둘 모두 차량과 보병을 처리할 수 있는 충분한 화력을 가지고 있었습니다."
 small_medium_gun_tech_2: "냉전 후기 경전자포"
 small_medium_gun_tech_2_desc: "With improved casting and thermal sleeves, by the late Cold War, tank cannons could sustain a higher rate of fire before failure."
 small_medium_gun_tech_3: "현대 경전차포"
 small_medium_gun_tech_3_desc: "적은 반동 충격의 장거리 타격 시스템과 개선된 약실을 장착함으로써, 현대 경전자포는 중 차량에조차 위협적이며, 특히 개선된 탄약 또한 무시할 수 없습니다."
 medium_gun_tech: "냉전 초기 중형 전차포"
 medium_gun_tech_desc: "복합 장갑의 발달로 더 많은 장갑을 관통하기 위해서는 경전차포보다 더 큰 주포가 필요했습니다. 소련은 T-62의 115mm 주포로 시작했지만, 빠르게 125mm 주포로 업그레이드했습니다. 서방 국가들은 120mm 주포로 빠르게 뒤따랐습니다. 중형전차포는 그 이후로 전차 무장을 위한 가장 보편적인 선택이 되었습니다."
 medium_gun_tech_2: "냉전 후기 중형 전차포"
 medium_gun_tech_2_desc: "현대식 스마트 탄약과 개선된 재료로 인해, 현대식 중전차포는 더 짧은 거리에서 거의 40인치의 강철 장갑을 관통할 수 있으며 다양한 대전차 및 대보병 탄을 발사할 수 있습니다."
 medium_gun_tech_3: "현대 중형 전차포"
 medium_gun_tech_3_desc: "현대식 스마트 탄약과 개선된 재료로 인해, 현대식 중전차포는 더 짧은 거리에서 거의 40인치의 강철 장갑을 관통할 수 있으며 다양한 대전차 및 대보병 탄을 발사할 수 있습니다."
 large_gun_tech: "초기 중전차포"
 large_gun_tech_desc: "90년대 들어 관통력을 높여야 할 필요성이 높아지면서 직경 130~135mm의 중전차포가 계획되었습니다."
 large_gun_tech_2: "개선된 중전차포"
 large_gun_tech_2_desc: "Latest alloys and programmed ammunition allow this second generation heavy tank gun to rain hell on enemies."
 EQ_MOD_CAT_module_surface_power_source_category_TITLE: "수상 전력"
 TITLE_BLUE_WATER_NAVY: "대양해군"
 TITLE_BLUE_WATER_NAVY_DESC: "대양 해군은 넓은 바다에서 전 세계를 누비며 작전을 수행할 수 있는 해상 전력입니다."
 TITLE_GREEN_WATER_NAVY: "지역 해군"
 TITLE_GREEN_WATER_NAVY_DESC: "지역 해군은 국가 주변의 해안 지역에서 작전을 수행할 수 있는 해상 전력이며 그 너머의 바다에서 진행되는 작전 수행 능력은 제한적입니다."
 floating_fortresses: "떠다니는 요새"
 floating_fortresses_desc: "항공모함은 바다의 새로운 요새입니다. 중화기로 무장하고 다수의 항공기를 탑재하고 있기에, 국가의 해군 전력 투사와 해상 통제에 도움을 줄 것입니다."
 distance_decimation: "장거리 섬멸"
 distance_decimation_desc: "우리 해안의 안전을 위해 저 멀리 있는 그들을 몰살시켜야 합니다."
 the_prowlers: "바다의 배회자"
 the_prowlers_desc: "잠수함의 유일한 목적은 바다를 서성이며 주력 함대에 위협이 될 수 있는 그 무엇이든 전멸시키는데 있습니다."
 far_from_home: "바다 저 멀리"
 far_from_home_desc: "The main goal of our fleet is to operate far from our shores. Extensive networks of logistics and connection to our global satellite network is imperative to ensure the maximum amount of operational integrity around the globe."
 secured_shipping: "안전한 항해"
 secured_shipping_desc: "선박의 항로는 우리 함대가 충분히 보급받고 지원받을 수 있도록 무슨 수를 써서라도 보호되어야만 합니다."
 deck_discipline: "갑판 교리"
 deck_discipline_desc: "항공모함의 목적은 적에 대항하여 효과적이고 지속적인 공중 우세를 보장하는데 있습니다. 적절한 갑판 교리를 통해 이 목적을 달성할 수 있을 겁니다."
 rolling_thunder: "요동치는 번개"
 rolling_thunder_desc: "함선들의 효과적인 일제 사격을 통해 우릴 위협할 수 있는 이들을 향한 최대의 피해를 가져다 줄 수 있습니다."
 death_from_below: "해저에서의 죽음"
 death_from_below_desc: "Our submarine fleet is integral to our operations in the open oceans. Make sure they can successfully sink any enemy ships that appear in the battle zone."
 air_dominance: "공중 우세"
 air_dominance_desc: "By concentrating our efforts into air superiority over the seas, we can effectively ground all enemy aircraft and hamper their ability to fight us in the sky."
 missile_support: "미사일 지원"
 missile_support_desc: "지원 작전에 미사일을 활용함으로써 상륙 작전과 더불어 적에 대항하여 큰 도움을 줄 수 있습니다."
 hidden_from_view: "시야에서 은닉"
 hidden_from_view_desc: "Keeping our submarines hidden from view of enemy helicopters and other submarines ensures us adequate space for our submarine operations."
 zone_of_control: "통제 영역"
 zone_of_control_desc: "Establishing a well-defined zone of control in the seas will increase our efficiency."
 long_distance_persistence: "항상 장거리 유지"
 long_distance_persistence_desc: "By enhancing the long-range persistence of our ships, our fleet can maintain naval combat operations for as long as possible."
 nuclear_dominance: "핵 동력 우선"
 nuclear_dominance_desc: "The heavier the ship and the more powerful the nuclear engine, the better the ship."
 replenishment_at_sea: "해상 보급"
 replenishment_at_sea_desc: "Focusing on our convoys and adequately supplying our vessels whilst they are on their rotations ensures we can keep the fleet out for longer durations of time."
 man_in_the_high_seas: "공해의 사나이"
 man_in_the_high_seas_desc: "Our navy will be the man in the high seas. This will ensure that our fleet has an unshakable dominance across the oceans in any war zone."
 global_naval_ambitions: "세계로 나아가는 바다에 대한 야망"
 global_naval_ambitions_desc: "우리 해군의 야망은 한계가 없습니다. 우리의 목적은 저 드넓은 세계이며 완전한 해상 우위를 달성하기 전까지 우리는 멈추지 않을 것입니다."
 naval_force_projection: "해군력 투사"
 naval_force_projection_desc: "전 세계에 힘을 투시할 수 있는 능력을 가지기 위해선 강력한 함대를 유지시킬 필요가 있습니다. 우리의 권력은 지구 전체에 행사할 수 있어야 하며 그 어느 적에도 대항할 수 있어야 합니다."
 the_waters_that_surrounds_us: "The Waters that Surround Us"
 the_waters_that_surrounds_us_desc: "우리 함대가 해안 주변을 벗어나지 못하도록 함으로써 우리 해안에 더욱 집중할 수 있게 될 것입니다."
 workhorse_of_the_fleet: "함대의 일꾼"
 workhorse_of_the_fleet_desc: "호위함과 구축함은 우리 해군의 일꾼과 다름 없습니다. 그들이 가장 먼저 타격하고 그들이 모든 것을 정리합니다."
 coast_guard: "해안 경비"
 coast_guard_desc: "초계함과 같은 경함선은 우리 해안을 지키는 일꾼입니다."
 the_wolves: "늑대 떼"
 the_wolves_desc: "Smaller wolf pack like submarines rather than lone-hunters submarines will allow us to maximize firepower for a short duration before quickly retreating beneath the waves."
 modern_designations: "현대의 호칭"
 modern_designations_desc: "현대에 맞는 적절한 호칭을 부여함으로써 구식의 시스템을 제거하고 현대 해군의 기준에 맞춘 만족스러운 체계를 확립합니다."
 securing_the_coast: "해안 보호"
 securing_the_coast_desc: "The coastal zones of our nation must be secured."
 destruction_of_shipping: "해상 운송 파괴"
 destruction_of_shipping_desc: "Fighting a superior enemy requires us to destroy enemy logistics. Striking quickly and ending the enemy's ability to supply forces abroad."
 lightweight_carriers: "경 항모"
 lightweight_carriers_desc: "초중항모 및 중항모는 다른 함선들의 표적이 될 뿐입니다. 강습상륙함에 더욱 집중함으로써 유사시에 적에게 표적이 될 수 있는 선박이 더 작은 함선이 될 수 있도록 합니다."
 modernize_the_fleet: "함대 현대화"
 modernize_the_fleet_desc: "함대를 현대화하는 것은 함선들의 전투 지속능력에 매우 중요한 요소입니다. 또한 최신 중의 최신 함선만 생산하는 것이 더욱 저렴하며 효율적입니다."
 logistical_disruption: "보급 체계의 혼란"
 logistical_disruption_desc: "보급 체계에 혼란을 가중시키고 수송 항로를 손쉽게 방어할 수 있도록 함으로써 승리를 가져다줌과 더불어 우리 해안에서 더  멀리 진출할 수 있도록 해줄 것입니다."
 counter_blue_water_tactics: "대양해군 전술 반격"
 counter_blue_water_tactics_desc: "우리는 일부 적들에 대해서는 절대 바다에서 힘을 행사할 수 없을 겁니다. 그러나, 우리 해안을 그들로 부터 방어하는 것은 가능합니다."
 safety_in_our_shores: "우리 해안에서 안전히"
 safety_in_our_shores_desc: "지뢰를 활용한 이전의 간결화된 전술을 사용함으로써 우리 해안을 지킬 수 있을 겁니다."
 hit_and_run: "치고 빠지기"
 hit_and_run_desc: "신속하고 지속적인 공격은 적의 조직력을 무너뜨리고 해상 교전에서 심각한 손상을 피할 수 있도록 도와줄 것입니다."
 three_month_rotations: "3개월 단위 교체"
 three_month_rotations_desc: "배치된 함선을 3개월 주기로 교체합니다."
 air_naval_coordination: "해공군 협력"
 air_naval_coordination_desc: "Coordinating our strike forces with our land-based aircraft allows us to strike quick and easy."
 topple_the_fortresses: "요새 전복"
 topple_the_fortresses_desc: "적의 항공모함을 타격하는 것은 적 함대의 완전한 몰락을 의미합니다. 떠다니는 요새를 무너트립시다!"
 maintain_the_coasts: "해안 유지"
 maintain_the_coasts_desc: "해안이 최고입니다. 해안이 모든 것의 기본입니다."
 strength_in_numbers: "다다익선"
 strength_in_numbers_desc: "바다는 우리와 적 함선의 뼈로 뒤덮힐 것입니다."
 short_sorties: "단기간 출격"
 short_sorties_desc: "Short sorties against the enemy aircraft keep stuff well-maintained."
 topple_the_goliaths: "골리앗을 전복시켜라"
 topple_the_goliaths_desc: "우리는 다윗이고 골리앗에 승리할 것입니다."
 nsb_SP_arty_1: "자주포 1985"
 nsb_SP_arty_1_desc: "With its powerful indirect fire abilities, Self-Propelled Artillery provides sustained precision strikes where it's needed on the battlefield, and far beyond visual ranges. It can be reloaded directly by its crew, and its self-propulsion makes it mobile so they can move to avoid counter-strikes by enemy artillery."
 nsb_SP_arty_2: "자주포 2005"
 nsb_SP_arty_2_desc: "With its powerful indirect fire abilities, Self-Propelled Artillery provides sustained precision strikes where it's needed on the battlefield, and far beyond visual ranges. It can be reloaded directly by its crew, and its self-propulsion makes it mobile so they can move to avoid counter-strikes by enemy artillery."
