 IBR_map_select_prompt: "Click a marker on the map to select a region."
 IBR_map_selected_values: "Sectarianism: [?IBR_selected_sectarianism|1]%\nGrowth: [?IBR_selected_drift|-=%%2] a week"
 IBR_map_hint: "Decisions in this category act on the selected region."
 IBR_map_legend_low: "Resolved"
 IBR_map_legend_high: "Severe"
 IBR_map_legend_tt: "Region colors show §YSectarianism§!:\n0%: resolved\nup to 25%: low\nup to 50%: moderate\nup to 75%: high\nup to 100%: severe\n\nOnce every region reaches §G0%§!, we can complete the final focus and end regional sectarianism. A region that reaches §R100%§! declares independence if it has a nation to break away as, and we must accept it or go to war. A region with none falls into unrest instead."
