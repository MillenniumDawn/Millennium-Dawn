l_german:
 ETH_eritrea_focus: "Äthiopien - Eritrea-Fokusbaum"
 ethiopia_focus: "Äthiopischer Fokusbaum"
 ETH_invite_foreign_investors: "Ausländische Investoren einladen"
 ETH_invite_foreign_investors_desc: "Äthiopien benötigt dringend wirtschaftliche Chancen. Unser Land verfügt über eine enorme Erwerbsbevölkerung, ein niedriges Einkommensniveau und eine beträchtliche Arbeitslosenquote - ideale Bedingungen für Investitionen von Unternehmen aus wohlhabenden Staaten."
 ETH_invite_coca_cola: "Coca-Cola einladen"
 ETH_invite_coca_cola_desc: "Der amerikanische Mega-Konzern Coca-Cola verfügt in Äthiopien über großes Potenzial an Arbeitskräften und Konsumenten. Wir sollten ihn dazu ermutigen, die East Africa Bottling Share Company, eine Coca-Cola-Franchise in Äthiopien, zu finanzieren und zu unterstützen."
 ETH_invite_karuturi_global: "Karuturi Global einladen"
 ETH_invite_karuturi_global_desc: "Karuturi Global stammt aus Indien und ist ein riesiger Agrarkonzern. Auch wenn das Unternehmen sich vor allem auf den Anbau von Zierblumen konzentriert, könnte die Erfahrung dieser Fachleute nicht nur die Einkommen unserer Bürger steigern, sondern auch das landwirtschaftliche Wissen unserer Bauern verbessern."
 ETH_invite_lifan_industry: "Lifan Industry einladen"
 ETH_invite_lifan_industry_desc: "Lifan Industry is a heavy industrial company founded in China in 1992. Mainly focused on building cars, motorcycles and trucks, Lifan could certainly help us with the low motorization rate among our citizens."
 ETH_american_industrial_investments: "Amerikanische Industrieinvestitionen"
 ETH_american_industrial_investments_desc: "Amerikanische Unternehmen fühlen sich angesichts der wachsenden Konkurrenz ihrer chinesischen Rivalen um potenzielle Gewinne in Äthiopien zunehmend bedroht. Wir könnten beide Seiten gegeneinander ausspielen - zum Vorteil unseres Volkes."
 ETH_request_international_loans: "Internationale Kredite beantragen"
 ETH_request_international_loans_desc: "Äthiopiens Wirtschaft verbessert sich, doch unsere staatlichen Ausgabemöglichkeiten bleiben aufgrund unserer eher niedrigen Bonität und unserer Randlage auf der Weltbühne begrenzt. Indem wir gezielt Großmächte um Finanzkredite bitten, könnten wir dieses Problem womöglich lindern."
 ETH_support_messobo_cement: "Messebo Cement unterstützen"
 ETH_support_messobo_cement_desc: "The Messebo Cement factory is one of our more powerful local conglomerates, important for the building boom that we plan for the country. By increasing the funding distributed to Messebo, we will be able to finish building projects quicker."
 ETH_homegrown_companies: "Einheimische Unternehmen"
 ETH_homegrown_companies_desc: "Nachdem wir unsere Wirtschaft mit Hilfe internationaler Unternehmen gestärkt haben, fühlt sich unsere Bevölkerung durch die Aussicht auf dauerhaft niedrige Löhne und neokoloniale Wirtschaftsstrukturen bedroht. Wir müssen starke und unabhängige äthiopische Firmen aufbauen, die mit den internationalen Unternehmen konkurrieren - zum Vorteil beider Seiten und der äthiopischen Wirtschaft."
 ETH_fund_ethio_agri_ceft: "Ethio Agri-CEFT finanzieren"
 ETH_fund_ethio_agri_ceft_desc: "Ethio Agri-CEFT ist auf dem Weg, zu einem der größten Privatunternehmen auf den Agrarmärkten Ostafrikas zu werden. Wir müssen dieses Unternehmen weiter stärken, um sowohl mit Karuturi zu konkurrieren als auch unsere Bürger abzusichern."
 ETH_fund_ethiopian_airlines: "Ethiopian Airlines finanzieren"
 ETH_fund_ethiopian_airlines_desc: "Ethiopian Airlines ist die nationale und staatseigene Fluggesellschaft Äthiopiens. Sie ist von entscheidender Bedeutung, um Touristen und äthiopischen Bürgern Flüge von und nach unserem Land zu ermöglichen. Die Finanzierung von Ethiopian Airlines wird künftige internationale Vorhaben stärken."
 ETH_fund_marathon_motors_engineering: "Marathon Motors Engineering finanzieren"
 ETH_fund_marathon_motors_engineering_desc: "Marathon Motor Engineering PLC is a joint venture between the South Korean automotive industrial concern Hyundai and local superstar Haile Gebrselassie. The company will focus on importing Hyundai vehicles into the country - and will provide our countrymen with more choices when it comes to their vehicles. Let the Chinese and the Koreans compete with each other for the lowest-possible prices."
 ETH_industrial_buildup_1: "Wachstums- und Transformationsplan"
 ETH_industrial_buildup_1_desc: "Wir müssen zusätzliche Bauflächen für Industriekomplexe sichern."
 ETH_industrial_buildup_2: "Industrialisierung II"
 ETH_industrial_buildup_2_desc: "Wir brauchen mehr Bauprojekte. Zusätzliche zivile Industrieanlagen für die Hauptarbeit zu errichten, ist der richtige Weg."
 ETH_industrial_buildup_3: "Industrialisierung III"
 ETH_industrial_buildup_3_desc: "Mehr Industrie bedeutet mehr Beschäftigung. Mehr Beschäftigung bedeutet mehr Wohlstand."
 ETH_industrial_buildup_4: "Industrialisierung IV"
 ETH_industrial_buildup_4_desc: "Wir müssen zusätzliche Bauflächen für Industriekomplexe sichern."
 ETH_military_buildup_1: "Militärischer Ausbau"
 ETH_military_buildup_1_desc: "Unsere militärisch-industriellen Fähigkeiten reichen nicht aus, um den Fortbestand unseres Landes zu sichern."
 ETH_military_buildup_2: "Militärischer Ausbau II"
 ETH_military_buildup_2_desc: "Wir müssen zusätzliche Gewehre, Panzer und Flugzeuge herstellen! Von allem mehr!"
 ETH_international_diplomacy: "Internationale Diplomatie"
 ETH_international_diplomacy_desc: "Die Welt ist ein gefährlicher Ort, wenn niemand auf uns achtgibt. Es ist äußerst wichtig, dass wir beginnen, um die Welt um uns herum zu werben."
 ETH_refactor_our_debt: "Unsere Schulden umstrukturieren"
 ETH_refactor_our_debt_desc: "Eine Umstrukturierung unserer Schulden wird helfen, unsere Wirtschaft von ihren Nachkriegsproblemen zu entlasten. Allerdings wird dies bei all unseren Gläubigern äußerst unpopulär sein."
 ETH_african_economic_relationships: "Afrikanische Wirtschaftsbeziehungen"
 ETH_african_economic_relationships_desc: "Africa is poor by most standards and underneath Ethiopian leadership we can push developmentalism and make each country a better place."
 ETH_european_economic_relationships: "Europäische Wirtschaftsbeziehungen"
 ETH_european_economic_relationships_desc: "Europe is a likely friend when boosting your economy. It also helps that European contracts and investments are some of the most lucrative projects."
 ETH_italian_ethiopian_friendship: "Italienisch-äthiopische Freundschaft"
 ETH_italian_ethiopian_friendship_desc: "Italien mag uns zweimal überfallen haben, doch das bedeutet nicht, dass wir unsere Differenzen nicht überwinden und Freunde werden können."
 ETH_request_chinese_investments: "Chinesische Investitionen beantragen"
 ETH_request_chinese_investments_desc: "China has extreme amounts of wealth that is usable by all. The Chinese investors are looking elsewhere for places to spend their money. Let's persuade them to do it here in Ethiopia!"
 ETH_african_union_commitment: "Bekenntnis zur Afrikanischen Union"
 ETH_african_union_commitment_desc: "Die Afrikanische Union ist wichtig, um unseren vielfältigen Kontinent gegen jede Form ausländischer Ausbeutung zu einen. Wir sollten uns erneut zu ihrer Funktion und ihrem Zweck bekennen."
 ETH_request_european_investments: "Europäische Investitionen beantragen"
 ETH_request_european_investments_desc: "Wir sollten einige Abkommen mit den Europäern eingehen. Sie haben Investoren, die nur darauf warten, am äthiopischen Markt teilzunehmen."
 ETH_befriend_france: "Frankreich annähern"
 ETH_befriend_france_desc: "Frankreich ist ein natürlicher Verbündeter, wenn es darum geht, unseren Rückhalt bei einem der wirtschaftlich am weitesten entwickelten Länder auszubauen."
 ETH_establish_connections_with_tongji: "Verbindungen zur CSCEC aufbauen"
 ETH_establish_connections_with_tongji_desc: "Im Rahmen unserer Pläne, ein neues Hauptquartier für die Afrikanische Union in Addis Abeba zu errichten, sollten wir Beziehungen zu mehreren Architekturnetzwerken knüpfen. China und die CSCEC haben vorgeschlagen, uns bei diesem Vorhaben zu unterstützen."
 ETH_expand_the_diplomatic_corps: "Das diplomatische Korps erweitern"
 ETH_expand_the_diplomatic_corps_desc: "Diplomatie ist unerlässlich, wenn wir von hier an irgendein Vorhaben verfolgen wollen."
 ETH_anti_corruption_measurements: "Anti-Corruption Measures"
 ETH_anti_corruption_measurements_desc: "Der Staat ist furchtbar korrupt. Es ist an der Zeit, entschlossen voranzugehen und die Korruption innerhalb unserer Grenzen auszurotten. Es gibt kaum etwas Erfüllenderes, als diejenigen hinter Gitter zu bringen, die es verdienen."
 ETH_the_new_african_union_headquarters: "Das neue Hauptquartier der Afrikanischen Union"
 ETH_the_new_african_union_headquarters_desc: "Die Zeit ist gekommen. Der Bau eines neuen Hauptquartiers für die Afrikanische Union in unserer Hauptstadt Addis Abeba wird die Welt über die Stärke Afrikas im Allgemeinen und Äthiopiens im Besonderen staunen lassen."
 ETH_stabilize_the_food_supply: "Die Lebensmittelversorgung stabilisieren"
 ETH_stabilize_the_food_supply_desc: "Die Ernährungslage ist gefährlich. Missernten und die jüngsten Kriege mit Eritrea haben dazu geführt, dass wir unseren Zugang zum Meer verloren haben. Wir sollten daran arbeiten, den Handel wiederherzustellen und zu normalisieren - andernfalls wird unser Volk hungern."
 ETH_local_relationships: "Regionale Beziehungen"
 ETH_local_relationships_desc: "Das Horn von Afrika ist ein instabiler und gefährlicher Ort. Der Bürgerkrieg in Somalia und die äthiopisch-eritreischen Kriege haben uns dazu gezwungen, neu zu bewerten, wer unsere Freunde sind. Deshalb müssen wir uns auf die Pflege unserer regionalen Beziehungen konzentrieren."
 ETH_african_alliance_initiative: "Initiative für ein afrikanisches Bündnis"
 ETH_african_alliance_initiative_desc: "Afrika ist noch immer ein Schlachtfeld fremder Mächte. Die Amerikaner, die Europäer und die Chinesen teilen unseren großen Kontinent, die Wiege der Menschheit, unter sich auf. Soll Afrika der Spielball feindlicher Megakonzerne sein? Nein! Um Interventionen und Invasionen zu widerstehen, müssen wir ein internationales Bündnis aufbauen."
 ETH_invite_european_armament_companies: "Europäische Rüstungsunternehmen einladen"
 ETH_invite_european_armament_companies_desc: "Einige Waffenunternehmen innerhalb unserer Grenzen zu haben, wäre von großem Wert."
 ETH_defense_of_ethiopia: "Verteidigung Äthiopiens"
 ETH_defense_of_ethiopia_desc: "Äthiopien hat viele Kriege geführt, um seine Unabhängigkeit gegen Eindringlinge zu verteidigen. Die Kriege, die wir von nun an führen werden, unterscheiden sich nicht von denen, die wir in längst vergangenen Jahren geführt haben."
 ETH_expand_the_endf: "Die ENDF erweitern"
 ETH_expand_the_endf_desc: "Die Ethiopian National Defense Force (ENDF) ist eine der stärksten Streitkräfte Afrikas. Wir müssen unsere Streitkräfte ausbauen, um ihre Wettbewerbsfähigkeit zu erhalten."
 ETH_expand_the_etaf: "Die ETAF erweitern"
 ETH_expand_the_etaf_desc: "Unsere Luftwaffe braucht dringend einen Ausbau. Wir verfügen über nur wenige Flugplätze sowie veraltete Jagdflugzeuge und Ausrüstung. Das muss sich ändern."
 ETH_secure_the_eritrean_border: "Die eritreische Grenze sichern"
 ETH_secure_the_eritrean_border_desc: "Befestigungen entlang der Grenze zu Eritrea werden uns helfen, falls es künftig zu einem Konflikt zwischen den beiden Regierungen kommt."
 ETH_secure_the_eritrean_border_TT: "Fügt an der Grenze zu Eritrea §Y3 Landsfestungen§! hinzu"
 ETH_fund_homicho: "Homicho finanzieren"
 ETH_fund_homicho_desc: "Der Homicho Ammunition Engineering Complex ist für Äthiopiens Versorgung mit Handfeuerwaffen und insbesondere mit Munition von entscheidender Bedeutung. Wir müssen unsere Infanterie mit neuen Waffen und unsere Lagerhäuser mit Tonnen von Munition ausstatten."
 ETH_air_training_program: "Luftwaffenausbildungsprogramm"
 ETH_air_training_program_desc: "Training the air force requires a program. Let's push to develop that."
 ETH_secure_the_somali_border: "Die somalische Grenze sichern"
 ETH_secure_the_somali_border_desc: "Der Bürgerkrieg in Somalia hat uns verunsichert, da der Konflikt Flüchtlinge über unsere Grenze treibt und es sogar zu Scharmützeln in der Nähe militärischer und wichtiger ziviler Ziele kommt. Es ist an der Zeit, entlang der somalischen Grenze zusätzliche Befestigungen auszubauen."
 ETH_secure_the_somali_border_TT: "Fügt an der Grenze zu Somalia §Y3 Landsfestungen§! hinzu"
 ETH_provide_assistance_to_somalia: "Somalia unterstützen"
 ETH_provide_assistance_to_somalia_desc: "Die Union islamischer Gerichte bedroht derzeit unsere Grenzen. Wir sollten [SOM.GetName] Truppen und Unterstützung schicken, damit wir den Aufstieg des radikalen Islams besiegen können, bevor er zu unserem Problem wird."
 ETH_secure_the_kenyan_border: "Die kenianische Grenze sichern"
 ETH_secure_the_kenyan_border_desc: "Der Omo-Fluss-Staudamm hat große Spannungen zwischen unseren beiden großartigen Ländern verursacht. In der Grenzregion sind Konflikte entstanden, da Stämme auf beiden Seiten Wasserressourcen verlieren. Unser Militär sollte einige Außenposten und Stützpunkte in der Region errichten, um sie hoffentlich zu stabilisieren."
 ETH_secure_the_kenyan_border_TT: "Fügt an der Grenze zu Kenia §Y3 Landsfestungen§! hinzu"
 ETH_modern_officer_corps: "Modernes Offizierskorps"
 ETH_modern_officer_corps_desc: "Investing in our officers' education and skills will allow us to truly have a modernized officer corps."
 ETH_expand_the_military: "Das Militär ausbauen"
 ETH_expand_the_military_desc: "Ein umfassender Ausbau aller Teilstreitkräfte ist erforderlich, um unser Militär auf die notwendige Größe zu bringen."
 ETH_aircraft_production: "Flugzeugproduktion"
 ETH_aircraft_production_desc: "Die heimische Flugzeugproduktion ist sowohl billiger als auch besser für die Wirtschaft!"
 ETH_secure_the_sudanese_border: "Die sudanesische Grenze sichern"
 ETH_secure_the_sudanese_border_desc: "Die sudanesisch-äthiopischen Beziehungen sind aufgrund der Lage im Südsudan etwas angespannt. Wir sollten uns vorbereiten, falls der Krieg nicht innerhalb ihrer Grenzen bleibt."
 ETH_secure_the_sudanese_border_TT: "Fügt an der Grenze zum Sudan §Y3 Landsfestungen§! hinzu"
 ETH_study_foreign_armor_designs: "Ausländische Panzerentwürfe studieren"
 ETH_study_foreign_armor_designs_desc: "Das Studium ausländischer Panzerfahrzeuge wird uns viel darüber lehren, wie wir unsere eigenen gepanzerten Fahrzeuge entwickeln können."
 ETH_study_foreign_aircraft_designs: "Ausländische Flugzeugentwürfe studieren"
 ETH_study_foreign_aircraft_designs_desc: "Das Studium bemerkenswerter Flugzeugentwürfe aus großen Staaten wie den Vereinigten Staaten, Russland, Frankreich, England und China könnte sich für unsere Luftwaffe als äußerst nützlich erweisen."
 ETH_request_chinese_military_assistance: "Chinesische Militärhilfe beantragen"
 ETH_request_chinese_military_assistance_desc: "China ist eine aufstrebende Macht. Seine Militärstruktur ist vorbildlich, und wir sollten darüber sprechen, etwas Ähnliches hier in Äthiopien einzuführen."
 ETH_request_american_military_assistance: "Amerikanische Militärhilfe beantragen"
 ETH_request_american_military_assistance_desc: "Das amerikanische Militär ist eines der größten und modernsten der Welt. Wir sollten uns bei unserer militärischen Entwicklung an ihnen orientieren."
 ETH_modernize_the_military: "Das Militär modernisieren"
 ETH_modernize_the_military_desc: "Das Militär verwendet Ausrüstung aus dem Jahr 1975, Fahrzeuge fallen auseinander und die Flugzeuge können kaum noch abheben. Wir sollten auf eine Modernisierung der Streitkräfte hinarbeiten, um in der Region eine Macht zu bleiben."
 ETH_land_doctrine: "Landdoktrin"
 ETH_land_doctrine_desc: "Our ground forces are one of our most important branches due to our neighbors constantly being embroiled in conflict. We should discuss new ways of improving our land and our strategies."
 ETH_air_doctrine: "Luftdoktrin"
 ETH_air_doctrine_desc: "Unsere Luftdoktrin ist veraltet. Schicken wir unsere besten Köpfe an ausländische Akademien, um zu sehen, ob wir einen Teil dieses Wissens nach Hause bringen können."
 ETH_the_future_of_ethiopia: "Die Zukunft Äthiopiens"
 ETH_the_future_of_ethiopia_desc: "Äthiopien hat in den letzten 50 Jahren die absolute Monarchie, den Kommunismus und die Demokratie erlebt. Unsere Nation hat Entbehrungen, Hungersnöte, Bürgerkrieg und politisches Chaos erlitten."
 ETH_legacy_of_abyssinia: "Das Erbe Abessiniens"
 ETH_legacy_of_abyssinia_desc: "Ethiopia has had a glorious history as one of Africa's first western-style nation states, led by the emperor. This country, generally called 'Abyssinia' in the west, would be destined to take a leading role in Africa and the world if it were ever to be reborn."
 ETH_endorse_the_monarchists: "Die Monarchisten unterstützen"
 ETH_endorse_the_monarchists_desc: "Seit der Derg Haile Selassie I. am 12. September 1974 stürzte, verfügt der Kronrat Äthiopiens über keine reale Macht mehr. 1993 nahm der Kronrat seine Tätigkeit wieder auf, nachdem er zu dem Schluss gekommen war, dass der Titel 'Kaiser von Äthiopien' weiterhin besteht. Wir sollten den Kronrat wieder in die Bundesverwaltung eingliedern."
 ETH_glorify_the_italo_ethiopian_wars: "Die italienisch-äthiopischen Kriege verherrlichen"
 ETH_glorify_the_italo_ethiopian_wars_desc: "Staaten, Nationen und Nationalismus werden im Konflikt geschmiedet. Äthiopien wurde auf den Schlachtfeldern von 1895 und 1935 geformt. Wir sollten die Welt an den italienischen Verrat erinnern - und an den unendlichen Mut der technologisch unterlegenen äthiopischen Streitkräfte. Italien wollte uns töten, uns zerstören, unsere Nation vernichten - und dennoch stehen wir noch immer!"
 ETH_restore_the_throne: "Den Thron wiederherstellen"
 ETH_restore_the_throne_desc: "Der Kronrat, nunmehr gestärkt im politischen Entscheidungsprozess, hat vorgeschlagen, die Wiederherstellung des Äthiopischen Reiches offiziell auszurufen. Es braucht nur... nun ja, eine neue Verfassung."
 ETH_befriend_jamaica: "Jamaika annähern"
 ETH_befriend_jamaica_desc: "Da die äthiopische Monarchie Haile Selassies auf ihre Wiederherstellung zusteuert, sollten wir erwägen, die Beziehungen zur Rastafari-Bewegung zu stärken - jener religiösen Gruppe, die unseren früheren Kaiser als wiedergekehrten Messias verehrt. Die Hauptgruppe der Rastafari befindet sich auf Jamaika, daher sollten wir vielleicht ein breiteres Spektrum diplomatischer Beziehungen mit diesem fernen Land aufbauen."
 ETH_invite_zera_yacob: "Zera Yacob einladen"
 ETH_invite_zera_yacob_desc: "Zera Yacob Amha Selassie, Enkel Haile Selassies I., ist der rechtmäßige Anwärter auf den äthiopischen Kaiserthron. Er wurde in Eton ausgebildet und nach der kommunistischen Revolution von 1974 zusammen mit dem Rest der Königsfamilie ins Exil gezwungen. Derzeit lebt er abwechselnd im Vereinigten Königreich und in den Vereinigten Staaten."
 ETH_weaken_the_parliament: "Das Parlament schwächen"
 ETH_weaken_the_parliament_desc: "Die beiden Kammern des äthiopischen Parlaments stehen unserem nationalen und internationalen Einfluss nur im Weg. Wir sollten dem Parlament mehrere Zuständigkeiten entziehen und sie der kaiserlichen Regierung übertragen."
 ETH_imperial_nostalgia: "Kaiserliche Nostalgie"
 ETH_imperial_nostalgia_desc: "Wünschst du dir nicht manchmal, wir könnten die Zeit zurückdrehen - zu den guten alten Zeiten?"
 ETH_imperial_guard: "Äthiopische Kaisergarde"
 ETH_imperial_guard_desc: "Die Kebur Zabagna war eine Eliteeinheit, bestehend aus den tapfersten und ehrenhaftesten Männern unserer Armee, die mit der Verteidigung unserer Hauptstadt und des Kaisers beauftragt war."
 ETH_reclaim_eritrea: "Eritrea zurückfordern"
 ETH_reclaim_eritrea_desc: "Eritrea ist rechtmäßiges äthiopisches Territorium! Unser Zugang zum Meer wird durch die bloße Existenz dieses Schurkenstaates gefährdet. Wir sollten sie daran erinnern, wem ihr Gebiet in Wahrheit gehört."
 ETH_strengthen_the_republic: "Die Republik stärken"
 ETH_strengthen_the_republic_desc: "Die äthiopische Verfassung von 1995, die nicht nur Bürgerrechte garantierte, sondern auch kommunistische und monarchistische Fraktionen schwächte, muss das Leitbild der äthiopischen Gesellschaft sein. Demokratie und panafrikanische Integration sind der Weg in die Zukunft."
 ETH_guarantee_freedom_of_speech: "Meinungsfreiheit garantieren"
 ETH_guarantee_freedom_of_speech_desc: "Äthiopien ist religiös, ethnisch und politisch vielfältig. Um die Überlegenheit der Demokratie gegenüber anderen Ideologien und des Säkularismus gegenüber jeder Form moralistischer Lehre zu beweisen, müssen wir politische Meinungsfreiheit im Privaten wie im Öffentlichen zulassen und garantieren. Außerdem werden wir politische Radio- und Fernsehprogramme finanzieren, um die Nation weiter zu stärken."
 ETH_healthcare_program: "Gesundheitsprogramm"
 ETH_healthcare_program_desc: "Eine nationale Gesundheitsversorgung in einem Land mit Hunger- und Krankheitsproblemen wie Äthiopien zu garantieren, wird ein gewaltiges Unterfangen sein - doch mit internationaler Hilfe, einem Fokus auf medizinische Ausbildung und der Finanzierung regionaler Kliniken und Ärzte könnte Äthiopien wieder auf die Beine kommen."
 ETH_guarantee_freedom_of_religion: "Religionsfreiheit garantieren"
 ETH_guarantee_freedom_of_religion_desc: "Äthiopien ist die Heimat der äthiopisch-orthodoxen Tewahedo-Kirche (43%), der protestantischen Pentay (18%), des sunnitischen Islams sufischer Prägung (34%), der Katholiken (1%) und traditioneller Glaubensrichtungen (3%). Wir müssen garantieren, dass jede dieser vielfältigen und unterschiedlichen Gruppen in Frieden leben und ihren Glauben ausüben kann. Religiös geprägte Schulen müssen ebenfalls entsegregiert werden."
 ETH_education_program: "Bildungsprogramm"
 ETH_education_program_desc: "Wenn ein Volk modernisiert und erneuert werden soll, muss man die Kinder bilden."
 ETH_endorse_the_african_union: "Die Afrikanische Union unterstützen"
 ETH_endorse_the_african_union_desc: "Ethiopia on its own is not powerful enough. We should instead focus on uniting the political leaderships across Africa and encourage the AU to become more like the EU."
 ETH_reckless_industrial_expansion: "Rücksichtsloser Industrieausbau"
 ETH_reckless_industrial_expansion_desc: "Äthiopien muss modern, stark und frei sein! Wir müssen Platz für neue Dörfer, Städte und insbesondere für Industrieanlagen schaffen."
 ETH_secure_agricultural_production: "Die landwirtschaftliche Produktion sichern"
 ETH_secure_agricultural_production_desc: "Es ist wichtiger, die Menschen zu ernähren als die Nation. Wir sollten in Erwägung ziehen, weitgehend agrarisch zu bleiben, wenn dies das Überleben unseres Volkes sichert."
 ETH_declare_mengistu_innocent: "Mengistu für unschuldig erklären"
 ETH_declare_mengistu_innocent_desc: "Mengistu Haile Mariam ist der ehemalige kommunistische Diktator Äthiopiens. Unter seiner Herrschaft zwischen 1977 und 1991 erlebte Äthiopien Hyper-Militarisierung, Unterdrückung von Dissens und Bürgerkrieg. Er floh 1991 nach Simbabwe und wurde während seiner Abwesenheit von einem äthiopischen Gericht wegen Völkermords verurteilt. Eigentlich sind Völkermord und Diktatur ja gar nicht so schlimm. Wir sollten Mengistu vermutlich freisprechen."
 ETH_condemn_the_pretenders: "Die Prätendenten verurteilen"
 ETH_condemn_the_pretenders_desc: "Die frühere Königsfamilie Äthiopiens lebt im Exil, seit sie in den frühen 1970er Jahren gestürzt wurde. Wir sollten sie wissen lassen, dass sie nur der Tod erwartet, falls sie jemals nach Äthiopien zurückkehren sollten."
 ETH_return_of_mengistu: "Mengistus Rückkehr"
 ETH_return_of_mengistu_desc: "Nachdem wir unsere ungerechte Behandlung unseres früheren glorreichen Führers rückgängig gemacht haben, sollten wir ihm vielleicht erlauben, in das Land zurückzukehren."
 ETH_restore_the_pdre: "Die PDRE wiederherstellen"
 ETH_restore_the_pdre_desc: "The People's Democratic Republic of Ethiopia marked the greatest era of our national history. We should announce the restoration of the PDRE - and the return of Mengistu to the world stage."
 ETH_national_communism: "Nationalkommunismus"
 ETH_national_communism_desc: "Die afrikanischen Völker wurden so lange von fremden Imperialisten unterdrückt. Ein Bündnis mit den chinesischen Betrügerkommunisten wäre Heuchelei und reiner Verrat. Äthiopien wird auf eigenen Füßen stehen."
 ETH_align_to_china: "An China annähern"
 ETH_align_to_china_desc: "Mao Zedong hat es offenbar besser gemacht als Wladimir Lenin - sein Land existiert noch. Die früheren Beziehungen der PDRE zur Sowjetunion gehören wirklich der Vergangenheit an. Wir müssen uns mit China verbünden, der einzig wahren Macht."
 ETH_pan_african_communism: "Panafrikanischer Kommunismus"
 ETH_pan_african_communism_desc: "Die Revolution in der Heimat ist gesichert! Wir müssen sie verbreiten, Genossen! Arbeiter der Welt, vereinigt euch!"
 ETH_eritrea_start: "Der Krieg ist vorbei..."
 ETH_eritrea_start_desc: "...doch der Krieg gegen den Terrorismus hat gerade erst begonnen. Viele ehemalige Soldaten der nun aufgelösten EDF haben sich der neu formierten EPLF im benachbarten Sudan angeschlossen und bereiten sich auf den Gegenschlag vor. Es liegt nun an uns, welchen Weg wir einschlagen."
 ETH_eritrea_dissolve_assembly: "Die Eritreische Nationalversammlung auflösen"
 ETH_eritrea_dissolve_assembly_desc: "Die Eritreische Nationalversammlung ist ein schreckliches und überholtes System. Wir müssen dieses System auflösen und unser Bestes tun, ihnen ihren Irrweg aufzuzeigen. Die Eritreer werden durchaus Vertretung erhalten - allerdings über das Repräsentantenhaus der Völker und das Haus der Föderation."
 ETH_eritrea_arrest_leaders: "Afwerki verurteilen"
 ETH_eritrea_arrest_leaders_desc: "Isaias Afwerkis Prozesstermin steht an, und es wird wohl keine gute Zeit für ihn werden - und das sollte es auch nicht. Wir müssen dem eritreischen Volk zeigen, was geschieht, wenn es versucht, gegen die äthiopische Nation und den unvermeidlichen Wandel zu kämpfen, der letztlich für alle besser ist."
 ETH_detain_rabble_rousers: "Potenzielle separatistische Anführer festsetzen"
 ETH_detain_rabble_rousers_desc: "Während des Prozesses wurde rund um das Gerichtsgebäude zusätzliche Sicherheit stationiert; zum Glück wurde sie nicht benötigt. Allerdings gelang es den Kräften, einige auffällige Persönlichkeiten herauszufiltern. Diese Aufrührer sollten festgesetzt werden, bevor sie auf Gedanken des Widerstands kommen..."
 ETH_maintain_a_watchful_eye: "Ein wachsames Auge bewahren"
 ETH_maintain_a_watchful_eye_desc: "Da die schlimmsten Agitatoren keine Bedrohung mehr darstellen, ist es wichtig, unsere neuen Gebiete weiterhin genau zu überwachen - zumindest so lange, bis sie lernen zu akzeptieren, dass ein Leben unter der äthiopischen Zentralregierung für alle Beteiligten besser ist."
 ETH_eritrea_annex: "Eritrea annektieren"
 ETH_eritrea_annex_desc: "Since 1991, Eritrea has been independent, it was ruled as a one party state under the dictatorial regime of Afwerki. Now that we have well and truly defeated this regime and worn down the resistance of the local populace, we can institute our own governance entirely."
 ETH_eritrea_teach_amharic: "Sie Amharisch lehren"
 ETH_eritrea_teach_amharic_desc: "Wie sollen wir über das eritreische Volk herrschen, wenn es uns nicht versteht? Indem wir Amharisch in speziellen Sprachschulen als Pflichtfach für die eritreische Bevölkerung einführen, erwarten wir, dass insbesondere die jüngeren Eritreer es rasch lernen; den älteren Generationen dürfte dies allerdings schwerer fallen."
 ETH_eritrea_propaganda: "Propaganda-Verteilungsnetzwerk"
 ETH_eritrea_propaganda_desc: "Whilst calling it 'propaganda' may be crass, it is necessary to distribute documents that tout the benefits of Ethiopian rule, the larger our propaganda network, the more of it we can distribute, and the easier it'll be to show the Eritreans our point of view."
 ETH_eritrea_federation: "Eritreisch-äthiopisches Föderationsgesetz"
 ETH_eritrea_federation_desc: "Die erste Föderation zwischen unseren beiden Ländern zerfiel offen gesagt an den imperialistischen Ambitionen Haile Selassies. Wir sind überzeugt, dass nun der richtige Zeitpunkt gekommen ist, sie in demokratischer Form wiederzubeleben."
 ETH_eritrea_assembly: "Eritreische Parteizweige äthiopischer Parteien zulassen"
 ETH_eritrea_assembly_desc: "Auch wenn wir die Machtverfestigung Afwerkis verurteilen, könnte es notwendig sein, die dortigen Machtstrukturen auszunutzen, um die Föderalisierung voranzutreiben. Indem wir unseren eigenen Parteien erlauben, Zweigstellen zu gründen und in Eritrea zu Wahlen anzutreten, werden äthiopienfreundliche Kandidaten, die das Föderationsgesetz befürworten, mit hoher Wahrscheinlichkeit gewinnen. Auf diese Weise können wir unser Ziel erreichen, den ehemaligen eritreischen Staat als autonome Region in das neue Äthiopien zu integrieren."
 ETH_eritrea_lawbooks: "Die Gesetzbücher umschreiben"
 ETH_eritrea_lawbooks_desc: "Die eritreischen Gesetze in den Büchern sind primitiv und veraltet. Niemand sollte sich beispielsweise bei der Regierung registrieren müssen, um einen Glauben auszuüben. Wir müssen diese Gesetze neu schreiben, um stärker zu betonen, dass wir eine moderne Föderation sind und sein werden."
 ETH_eritrea_constitution: "Eine neue Verfassung verfassen"
 ETH_eritrea_constitution_desc: "Die alte eritreische Verfassung war derart ungeeignet, dass sie nicht einmal richtig umgesetzt wurde. Wir müssen eine Verfassung ausarbeiten, die unsere eigene ergänzt, statt mit ihr zu kollidieren, und sicherstellen, dass sie diesmal auch tatsächlich korrekt umgesetzt wird."
 ETH_eritrean_federal_state: "Mit Eritrea ordnungsgemäß föderalisieren"
 ETH_eritrean_federal_state_desc: "Endlich haben sich unsere Bemühungen ausgezahlt. Die letzten Schritte sollen nun umgesetzt werden, und sowohl Äthiopier als auch Eritreer sollen einander auf den Straßen und Märkten in die Arme gefallen sein. Ein Ziel, das noch vor nicht einmal einem Jahrzehnt als unmöglich galt, ist Wirklichkeit geworden."
 ETH_stabilize_the_food_supply_TT: "§YDie Hungersnot könnte sich verschlimmern, wenn die Lebensmittelversorgung nicht rechtzeitig stabilisiert wird.§!\n"
 ETH_ERI_acceptance_100_TT: "Akzeptanz der §HIntegration§! beträgt §G100%§!"
 ETH_ERI_federalisation_100_TT: "Akzeptanz der §HFöderalisierung§! beträgt §G100%§!"
 ETH_eritrea_federal_parties_allowed_TT: "Erlaubt §Y[ERI.GetNameWithFlag]§!, ihre eigenen Angelegenheiten und Wahlprozesse zu verwalten, während §Y[ETH.GetNameWithFlag]§! weiterhin die Kontrolle über die Region behält.\n\nLokale Wahlen sind für die kommenden Wochen angesetzt."
 ETH_eritrea_locked_TT: "§RDie Auswirkungen dieses Fokus sind erst bekannt, nachdem über das Schicksal Eritreas entschieden wurde!§!"
 ETH_annexation_support_TT: "Der Integrationsprozess steht bei §G100%§!"
 ETH_federation_support_TT: "Die Unterstützung für die Föderation beträgt §G100%§!"
 ETH_make_a_choice_FT_TT: "Der Zweig §Y$ETH_eritrea_start$§! wird im Fokusbaum §Yfreigeschaltet§!, eine Entscheidung über die Zukunft von §YEritrea§! muss getroffen werden"
 ETH_eritrea_assembly_TT: "Du machst bereits etwas Dummes, also nimm wenigstens etwas Geld"
 ETH_eritrea_integration_trigger_TT: "Hat im Ereignis §Y$ethiopia.24.t$§! den Weg der §YIntegration§! gewählt oder anschließend beschlossen, die Versammlung §Raufzulösen§!"
 ETH_eritrea_federation_trigger_TT: "Hat im Ereignis §Y$ethiopia.24.t$§! den Weg der §YFöderalisierung§! gewählt oder anschließend beschlossen, zu §Gföderalisieren§!"
 ETH_blocked_from_ERI_decisions_INT_TT: "Ist nicht von weiteren §YIntegrations§!-Maßnahmen ausgeschlossen"
 ETH_block_from_ERI_decisions_INT_TT: "Wird von allen weiteren Versuchen der §YIntegration§! §Rausgeschlossen§!"
 ETH_federalise_ERI_flip_TT: "Führt derzeit keine Entscheidung zur Durchführung einer §YIntegrations§!-Operation aus"
 ETH_blocked_from_ERI_decisions_FED_TT: "Ist nicht von weiteren §YFöderalisierungs§!-Maßnahmen ausgeschlossen"
 ETH_block_from_ERI_decisions_FED_TT: "Wird von allen weiteren Versuchen der §YFöderalisierung§! §Rausgeschlossen§!"
 ETH_dissolve_ERI_assembly_flip_TT: "Führt derzeit keine Entscheidung zur Durchführung einer §YFöderalisierungs§!-Operation aus"
 ETH_BANNED_RELEASE_ERI_TOOLTIP: "§Y[ROOT.GetNameWithFlag]§! kann §Y[FROM.GetNameWithFlag]§! nur freilassen, indem die entsprechende Entscheidung zur §YFöderalisierung§! gewählt wird.\n\nFalls diese Entscheidung nicht verfügbar ist, steht §Y[FROM.GetNameWithFlag]§! dauerhaft unter §Y[ROOT.GetAdjective]§! Herrschaft."
 ETH_locked_federalisation_TT: "§Y[ETH.GetNameWithFlag]§! wird daran §Rgehindert§!, §Y[ERI.GetNameWithFlag]§! zu annektieren, solange das §YFöderationsgesetz§! in Kraft ist"
 ETH_locked_annexation_TT: "§Y[ETH.GetNameWithFlag]§! wird daran §Rgehindert§!, §Y[ERI.GetNameWithFlag]§! freizulassen, solange der §YIntegrationsprozess§! läuft"
 update_ETH_amharic_speakers_TT: "§YVerbreitung der amharischen Sprache§!: [?ETH_amharic_change|2+]% (Aktuelle §YVerbreitung der amharischen Sprache§!: [?ETH_amharic_speakers|2Y]%)"
 update_ETH_propaganda_distribution_TT: "§YPropagandaverbreitung§!: [?ETH_propaganda_change|2+]% (Aktuelle §YPropagandaverbreitung§!: [?ETH_propaganda_distribution|2Y]%)"
 update_ETH_bozo_crackdown_TT: "§YUnterdrückung von Separatisten§!: [?ETH_crackdown_change|2+]% (Aktuelle §YUnterdrückung von Separatisten§!: [?ETH_crackdown_on_bozos|2Y]%)"
 ethiopia.1.t: "Äthiopische Kreditanfragen"
 ethiopia.1.d: "The Ethiopian government is attempting to get the national economy back on track through the invitation of international companies and the strengthening of local and regional economic sectors with the usage of government investments.\n\nNow, Ethiopia has approached our ministry of finance with a request to grant further government loans to the Ethiopian industrial and economic development sector. It seems as if we have little to gain for our government, but our businesspeople are warning us that if we don't grant loans to Ethiopia, somebody else will. And if our businesses are rejected due to our hostile stance towards the country, somebody else's companies are sure to get accepted."
 ethiopia.1.a: "Wir werden zusätzliche Kredite gewähren."
 ethiopia.1.b: "Wir können derzeit nichts bereitstellen."
 ethiopia.2.t: "Äthiopien sucht Investitionen"
 ethiopia.2.d: "Der äthiopische Industriesektor hat in letzter Zeit einen enormen Aufschwung erlebt, den die Regierung von [ETH.GetLeader] nun weiter ausbauen möchte. Die Hoffnung, Äthiopien in eine industrielle Großmacht zu verwandeln, kann jedoch nur durch ausländische Investitionen verwirklicht werden - und die äthiopische Regierung hat sich an uns gewandt, um unsere nationalen Unternehmen davon zu überzeugen, Äthiopiens wachsende Wirtschaft zu unterstützen."
 ethiopia.2.a: "Wir stimmen zu!"
 ethiopia.2.b: "Der Markt soll entscheiden."
 ethiopia.3.t: "Äthiopien sucht Investitionen"
 ethiopia.3.d: "Der äthiopische Industriesektor hat in letzter Zeit einen enormen Aufschwung erlebt, den die Regierung von [ETH.GetLeader] nun weiter ausbauen möchte. Die Hoffnung, Äthiopien in eine industrielle Großmacht zu verwandeln, kann jedoch nur durch ausländische Investitionen verwirklicht werden - und die äthiopische Regierung hat sich an uns gewandt, um unsere nationalen Unternehmen davon zu überzeugen, Äthiopiens wachsende Wirtschaft zu unterstützen."
 ethiopia.3.a: "Wir stimmen zu!"
 ethiopia.3.b: "Der Markt soll entscheiden."
 ethiopia.4.t: "Äthiopien sucht Investitionen"
 ethiopia.4.d: "Der äthiopische Industriesektor hat in letzter Zeit einen enormen Aufschwung erlebt, den die Regierung von [ETH.GetLeader] nun weiter ausbauen möchte. Die Hoffnung, Äthiopien in eine industrielle Großmacht zu verwandeln, kann jedoch nur durch ausländische Investitionen verwirklicht werden - und die äthiopische Regierung hat sich an uns gewandt, um unsere nationalen Unternehmen davon zu überzeugen, Äthiopiens wachsende Wirtschaft zu unterstützen."
 ethiopia.4.a: "Wir stimmen zu!"
 ethiopia.4.b: "Der Markt soll entscheiden."
 ethiopia.7.t: "Addis-Abeba-Stadtbahn fertiggestellt"
 ethiopia.7.d: "The Addis Ababa Light Rail finally finished its construction phase and is now moving on to testing. The Light Rail was originally intended to have a total of 41 stations on its two lines (of which 39 were finished) and each train has a capacity to carry 286 passengers. This will enable the light rail transit to provide a transportation service to 15,000 passengers per hour per direction and 60,000 in all four directions while the fares cost 2-6 Ethiopian birr.\n\nThe railway was contracted by the China Railway Group Limited and it is operated by the Shenzhen Metro Group. Addis Ababa Light Rail currently has a fleet of 41 three-section 70% low-floor trams manufactured by CNR Changchun."
 ethiopia.7.a: "Endlich keine Staus mehr!"
 ethiopia.8.t: "Ethio-Dschibuti-Eisenbahn stellt ihren Betrieb ein"
 ethiopia.8.d: "Nach dem Zweiten Weltkrieg begann für die Eisenbahn eine lange Phase des Niedergangs. Zwischen 1953 und 1957 halbierte sich das Verkehrsaufkommen, da der Straßenverkehr zunehmend Konkurrenz machte. Der Ogadenkrieg von 1977 bis 1978 versetzte der Bahn einen weiteren Schlag, als somalische Truppen einmarschierten und die Strecke bis nach Dire Dawa besetzten. Teile der Bahnlinie wurden im Krieg gesprengt, wodurch der Bahnbetrieb erneut halbiert wurde. Nach Kriegsende setzte sich der Niedergang aufgrund mangelnder Wartung und Angriffen von Rebellen wie der Ogaden Liberation Front fort.\n\nSowohl der Wartungsmangel als auch ein ehrgeiziges Straßenbauprogramm machten den Schienenverkehr zunehmend unrentabel. Im Januar 1985 kamen bei der Awash-Zugkatastrophe 429 Passagiere ums Leben, als ihr Zug auf der Awash-Brücke entgleiste und in die darunterliegende Schlucht stürzte. Der Bahnverkehr zwischen Addis Abeba und Dire Dawa endete schließlich in diesem Jahr, doch Züge verkehrten weiterhin zwischen Dire Dawa und Dschibuti. Die Gleise zwischen Dire Dawa und Addis Abeba verfielen vollständig, und viele Schienen wurden gestohlen und als Schrott verkauft."
 ethiopia.8.a: "Wir hätten sie früher reparieren sollen"
 ethiopia.9.t: "Addis-Abeba-Stadtbahn erweitert"
 ethiopia.9.d: "The new line built is completely grade-separated. Apart from extending the existing lines, two new lines were built. The first one starts at St. George's Cathedral, passes along Mexico Square to the African Union Headquarters and terminates at Lebu, connecting to the new national rail network. The second line starts at Megenagna Roundabout and passes via Bole Airport, Wello Sefer area, Saris market area and Jommo area and terminates at Lebu."
 ethiopia.9.a: "Von Addis Abeba nach Dschibuti!"
 ethiopia.10.t: "Addis-Abeba-Dschibuti-Eisenbahn fertiggestellt"
 ethiopia.10.d: "Diese Strecke wird das Rückgrat unseres neuen äthiopischen Eisenbahnnetzes bilden. Sie verschafft uns Zugang zum Meer und verbindet unsere Hauptstadt Addis Abeba mit Dschibuti und dessen Hafen Doraleh."
 ethiopia.10.a: "Das wird unserer Wirtschaft helfen"
 ETH_railway_repaired_tt: "Die Ethio-Dschibuti-Eisenbahn ist repariert"
 ETH_railway_destroyed_flg: "Die Ethio-Dschibuti-Eisenbahn ist zerstört"
 ethiopia.11.t: "Die EPLF greift... schon wieder zu den Waffen!"
 ethiopia.11.d: "For the second time since the end of World War 2, Eritrea has found itself under Ethiopian occupation. Many former high ranking politicians and military leaders have managed to escape the Ethiopian forces and have gone into a self imposed exile in Sudan. From there, they have seemingly refounded the Eritrean People's Liberation Front.\n\nThe original EPLF transformed itself into the People's Front for Democracy and Justice shortly after Eritrean independence from Ethiopia in 1991 and acted as the sole legal party of Eritrea until its recent dismantling. Since Isaias' recent capture and subsequent house arrest, his presidential advisor Yemane Gebreab has reportedly taken over the remnants of the party and is rallying the remnants into taking up arms under the EPLF's banner once more."
 ethiopia.11.a: "Mögen sie es auch versuchen, wir werden nicht erschüttert."
 ethiopia.13.t: "Isaias Afewerki verhaftet"
 ethiopia.13.d: "As the gunfire around Asmara quietened and Eritrea's last stalwart defenders laid down their arms, Isaias Afwerki and his most loyal men were already en route to neighbouring Sudan in a relatively nondescript motorcade, a last-ditch desperate attempt to escape Ethiopian justice. His bodyguards put up what little resistance they could muster, but the numbers were simply not on their side.\n\nIsaias Afewerki was promptly apprehended and bundled into a military vehicle bound for Addis Ababa, his fate remains uncertain but until then, he remains under house arrest, guarded by Ethiopia's finest soldiers."
 ethiopia.13.a: "Die Gerechtigkeit wird siegen."
 ethiopia.14.t: "Der Prozess gegen Isaias Afewerki"
 ethiopia.14.d: "Heute ist der Prozesstermin des ehemaligen Führers Eritreas, Isaias Afwerki. Inmitten der ohnehin lautstarken Gerichtsverhandlungen war Isaias lauter als alle anderen zu hören, wie er gegen seine Lage protestierte. Als die Kameras auf ihn gerichtet wurden, während er den Saal betrat, wies er die Korruptionsvorwürfe des Gerichts und des äthiopischen Justizsystems insgesamt zurück und behauptete, der Prozess sei nichts weiter als eine Farce, da sein Schicksal schon lange vor Beginn jeglicher Verhandlungen festgestanden habe.\n\nViele internationale Reporter und Beobachter des Prozesses, die seiner Lage sympathisch gegenüberstanden, schlossen sich seinen Bedenken an, doch die Rufe nach Korruption und manipulierten Verfahren können den angeblichen Tyrannen Eritreas nicht retten. Nach mehreren Tagen der Beratung und der Prüfung aller Beweise wird er rasch für schuldig befunden, und sein Urteil lautet..."
 ethiopia.14.a: "...Tod."
 ethiopia.14.b: "...lebenslange Haft."
 ethiopia.18.t: "Zera Selassie kehrt nach Äthiopien zurück"
 ethiopia.18.d: "Zera Selassie returns to once again take up his mantle as the king of Ethiopia. Let him live long and his country prosper underneath his great leadership."
 ethiopia.18.a: "Wir heißen ihn willkommen"
 ethiopia.19.t: "Zera Selassie's Coronation"
 ethiopia.19.d: "The day was perfectly chosen, the sun is shining bright and there is not a single cloud in the sky. Zera Selassie rides on his horse, surrounded by a large, cheering crowd, towards the Medhane Alem Cathedral in Addis Ababa. Today is his official coronation as His Imperial Majesty Emperor Amha Selassie I, Elect of God, Conquering Lion of the Tribe of Judah and King of Kings of Ethiopia.\n\nTogether with his only child he halts in front of the cathedral, which got decorated with the imperial banners, and steps towards the entrance. Inside the cathedral is everyone of importance in Ethiopia eagerly awaiting the coronation.\n\nAs Zera walks towards the Presbyter, his heart begins to beat faster. This is truly a moment he won't forget and he could not even imagine in his craziest dreams. The ceremony itself was over pretty fast and as he walks out as the legitimate king of Ethiopia, everyone bows for him."
 ethiopia.19.a: "Long live his majesty!"
 ethiopia.20.t: "Die Hungersnot bricht aus!"
 ethiopia.20.d: "Der jüngste Konflikt zwischen unseren Nachbarn und die Verweigerung der Zusammenarbeit zwischen Eritrea und Äthiopien haben etwas noch viel Verheerenderes ausgelöst. Das Land ist in eine Hungersnot gefallen, und Menschen beginnen zu sterben, da der Lebensmittelmarkt im Land durch die mangelnde Kooperation unserer Nachbarn stranguliert wird. Die Regierung muss etwas unternehmen, um dem Volk zu helfen. Sie muss handeln, bevor das Land in sich zusammenbricht."
 ethiopia.20.a: "Oh nein"
 ethiopia.21.t: "Niederlage auf dem Feld"
 ethiopia.21.d: "Nach Monaten des Stillstands hat der Feind endlich unsere Linien durchbrochen und ist in unser eigentliches Kernland eingedrungen. Vielleicht sollten wir dem Friedensrahmen zustimmen, den die Organisation für Afrikanische Einheit 1998 vorgelegt hat, und einen Waffenstillstand vorschlagen?"
 ethiopia.21.a: "Frieden ist die einzige Option"
 ethiopia.21.b: "Krieg ist die einzige Option"
 ethiopia.22.t: "[FROM.GetName] schlägt Waffenstillstand vor"
 ethiopia.22.d: "Nachdem unsere Streitkräfte die feindlichen Linien durchbrochen hatten, wurden wir von der Regierung [FROM.GetAdjective] kontaktiert, die erklärte, sie stimme dem Friedensrahmen der Organisation für Afrikanische Einheit zu. Sie schlägt einen sofortigen Waffenstillstand vor"
 ethiopia.22.a: "Endlich! Sieg!"
 ethiopia.22.b: "Wir werden nicht aufhören, bis sie vor uns niederknien!"
 ethiopia.23.t: "Die Prozesse gegen die eritreischen Abgeordneten"
 ethiopia.23.d: "Genau wie Afwerki müssen auch jene, die für eritreische Aufwiegelung eintreten, für ihre Verbrechen gegen Äthiopien und sein Volk vor Gericht gestellt werden. Die Frage ist nun: Sollen wir diese Abgeordneten zum Tode verurteilen oder sie einfach lebenslang hinter Gitter bringen?"
 ethiopia.23.a: "Der Tod soll es sein!"
 ethiopia.23.b: "Lebenslange Haft ist genug."
 ethiopia.24.t: "Das Schicksal Eritreas"
 ethiopia.24.d: "Eritrea wurde im Krieg besiegt, und viele fordern, die Besatzung aufrechtzuerhalten, um das eritreische Volk vollständig unter unsere Kontrolle zu bringen. Andere wiederum vertreten einen liberaleren Ansatz und wünschen sich ein zweites Föderationsgesetz. Letztlich liegt es an [ETH.GetLeader], was aus dem eritreischen Staat wird."
 ethiopia.24.a: "Besatzung aufrechterhalten!"
 ethiopia.24.b: "Wir sollten föderalisieren."
 ethiopia_news.1.t: "Äthiopien erhält chinesische Militärhilfe"
 ethiopia_news.1.d: "Nach einer langwierigen Rivalität zwischen amerikanischen und chinesischen Rüstungsunternehmen um die Versorgung des äthiopischen Militärs hat die äthiopische Regierung den chinesischen Konzernen weitreichende Freiheiten eingeräumt und mehrere militärisch-wirtschaftliche Verträge mit der Volksrepublik China unterzeichnet.\n\nDer Außenminister der Vereinigten Staaten hat bereits großes Bedauern über die äthiopische Entscheidung geäußert."
 ethiopia_news.1.a: "Äthiopien hat sich Amerika widersetzt."
 ethiopia_news.2.t: "Äthiopien erhält amerikanische Militärhilfe"
 ethiopia_news.2.d: "Sowohl die Vereinigten Staaten von Amerika als auch die Volksrepublik China haben in den vergangenen Monaten versucht, Rüstungsverträge mit dem äthiopischen Verteidigungsministerium zu erhalten.\n\nÄthiopien hat sich nun entschieden, große Mengen an Waffen bei amerikanischen Konzernen zu bestellen. Die Volksrepublik China hat bereits begonnen, Gesetze zu erlassen, die es chinesischen Unternehmen erschweren sollen, mit Äthiopien Handel zu treiben, um den ostafrikanischen Staat zu bestrafen, der es gewagt hat, sich ihnen zu widersetzen."
 ethiopia_news.2.a: "Äthiopien hat sich China widersetzt."
 ethiopia_news.3.t: "Zera Yacob kehrt nach Äthiopien zurück"
 ethiopia_news.3.d: "Äthiopien hat kürzlich die Wiederherstellung seines kaiserlichen Thrones angekündigt, der unter der kommunistischen PDRE und der nachfolgenden demokratischen Verfassung von 1995 abgeschafft worden war.\n\nDer rechtmäßige Thronprätendent, der Enkel Haile Selassies I., Zera Yacob, lebt seit den 1970er Jahren mit seiner Familie in Florida in den Vereinigten Staaten. Nun hat er öffentlich erklärt, dass er die offizielle Einladung der äthiopischen Regierung annehmen, in das Land seiner Vorfahren zurückkehren, seinen rechtmäßigen Thron beanspruchen und seine rechtmäßige Position als Kaiser von Äthiopien einnehmen wird."
 ethiopia_news.3.a: "Der Kaiser schlägt zurück."
 ethiopia_news.4.t: "Mengistu freigesprochen"
 ethiopia_news.4.d: "Der Oberste Gerichtshof Äthiopiens hat heute bestätigt, dass die Verurteilung des ehemaligen äthiopischen kommunistischen Diktators Mengistu Haile Mariam unrechtmäßig war, und ihn offiziell von allen Anklagen freigesprochen. Mariam, der sich derzeit im Zimbabwe Robert Mugabes im Exil befindet, war zuvor des Völkermords an Minderheiten und der Verbrechen gegen die Menschlichkeit am eigenen Volk schuldig gesprochen worden. In Äthiopien gilt er nun als unschuldiger Mann, doch es ist noch nicht klar, ob er beabsichtigt, in seine Heimat zurückzukehren.\n\nDie Entscheidung stieß sowohl innerhalb als auch außerhalb des afrikanischen Kontinents auf internationale Verurteilung."
 ethiopia_news.4.a: "Ein riskanter Schritt."
 ethiopia_news.5.t: "Mengistu kehrt zurück"
 ethiopia_news.5.d: "Nach einer langen Phase der Überlegung und einer offiziellen Einladung durch die äthiopische Regierung hat sich der ehemalige kommunistische Diktator Mengistu Haile Mariam entschieden, nach Äthiopien zurückzukehren. Dort wird erwartet, dass er erneut eine führende Position innerhalb der kommunistischen Partei Äthiopiens einnimmt."
 ethiopia_news.5.a: "Der Diktator kehrt zurück."
 ethiopia_news.6.t: "Die Wiederherstellung der PDRE"
 ethiopia_news.6.d: "In a political shock, the Ethiopian government has decided to overturn the 1995 constitution and to cede power to the communist party once more.\n\nMengistu Haile Mariam has today once again taken over leadership of the country - he however refused to take an oath that would bind his now once more limitless power inside the country to a preset set of rules. He commented \"I know what's best for the people, I don't need an oath\", when asked about it by one of the few remaining international journalists.\n\nEthiopia is now widely expected to fall back to its old dark days of the 1980s."
 ethiopia_news.6.a: "Die PDRE ist auf die Weltbühne zurückgekehrt."
 ethiopia_news.7.t: "Waffenstillstand zwischen Äthiopien und Eritrea"
 ethiopia_news.7.d: "The governments of Ethiopia and Eritrea have agreed to cease hostilities and declare a ceasefire. Ever since the conflict started in 1998, the Organization of African Unity has been trying to propose a peace plan to solve the border conflict between the two countries. It seems that the countries have finally agreed to try and solve their issues peacefully."
 ethiopia_news.7.a: "Endlich"
 ethiopia_news.8.t: "Eritrea im Eritreisch-Äthiopischen Krieg besiegt!"
 ethiopia_news.8.d: "Fierce fighting from the outbreak of hostilities on 6th May 1998 was deemed by experts to result in a stalemate, however, the experts were proven wrong!\n\nIsaias Afwerki has been reported to have been detained by Ethiopian forces and it is uncertain what the fate of the Eritrean state will be."
 ethiopia_news.8.a: "Besorgniserregende Entwicklungen!"
 ETH_looming_famine: "Drohende Hungersnot"
 ETH_looming_famine_desc: "Eine Hungersnot zeichnet sich weiterhin am Horizont ab. Wenn wir die Lage in unserer Nation nicht bald stabilisieren, droht eine weitverbreitete Hungersnot. Unser Krieg mit Eritrea und der Verlust unserer Küstengebiete haben dieses Problem nur noch verschärft."
 ETH_idea_stabilized_food_supply: "Stabilisierte Lebensmittelversorgung"
 ETH_idea_stabilized_food_supply_desc: "Die Lebensmittelversorgung ist endlich stabilisiert worden, und wir können unsere Bevölkerung weiterhin versorgen und unterstützen. Eine sichere und stabile Lebensmittelversorgung ist von entscheidender Bedeutung für das Wachstum unserer Nation."
 ETH_idea_famine_strikes: "Hungersnot!"
 ETH_idea_famine_strikes_desc: "Die Hungersnot hat die Nation getroffen! Wir müssen unsere Aufmerksamkeit nach innen richten und unsere Lebensmittelversorgung in Ordnung bringen, bevor sich die Lage weiter verschlimmert und unsere Nation schweren Schaden erleidet."
 ETH_idea_cscec: "CSCEC-Investitionen"
 ETH_idea_cscec_desc: "The China State Construction Engineering Corporation (CSCEC) has begun to make investments within our country. It continues to help us develop but at the price, it makes us more susceptible to Chinese Influence in the region. "
 ETH_eritrean_friction: "Anhaltende Spannungen in Eritrea"
 ETH_eritrean_friction_desc: "Die anhaltenden Spannungen in Eritrea haben zu einem Mangel an Stabilität im Land geführt, und viele Flüchtlinge verlassen das Land aus Angst vor dem, was noch kommen könnte."
 ETH_dissolved_the_assembly: ""
 ETH_dissolved_the_assembly_desc: "Die Auflösung der Eritreischen Nationalversammlung hat viele Eritreer äußerst widerwillig gemacht, Veränderungen innerhalb der Grenzen ihrer ehemaligen Nation zu akzeptieren. Dieser Widerstand dürfte mit der Zeit nachlassen, wird jedoch zu mangelnder Gefügigkeit in den besetzten Gebieten führen."
 ETH_1984_mode: "Eritreisches Überwachungsnetzwerk"
 ETH_1984_mode_desc: "Die Prozesse gegen Afwerki und seine Abgeordneten haben die Einrichtung eines weitreichenden und tief verwurzelten Überwachungsnetzes aus Überwachungskameras und Informanten erforderlich gemacht. Es ist zu hoffen, dass dieses Netz nicht lange gebraucht wird, doch das hängt ganz davon ab, wie schnell sich das eritreische Volk integriert und seine neue Identität annimmt."
 ETH_eritrean_constitution: "Äthiopisch-eritreische Bundesverfassung"
 ETH_eritrean_constitution_desc: "Mit einer neuen Verfassung hat Äthiopien seinen Griff über Eritrea gefestigt, allerdings um den Preis, zumindest einen Teil der finanziellen Verantwortung für Eritreas innere Angelegenheiten zu tragen."
 ETH_eritrean_federalisation_underway: "Föderalisierungsgespräche im Gange"
 ETH_eritrean_federalisation_underway_desc: "Solange die Föderalisierung im Gange ist, ist angesichts der laufenden Verhandlungen mit einem gewissen Auswanderungsfaktor zu rechnen."
 ETH_ethiopian_intervention_forces: "Äthiopische Interventionsstreitkräfte"
 ETH_ethiopian_intervention_forces_desc: ""
 ETH_idea_messebo: "Messebo Cement"
 ETH_idea_messebo_desc: ""
 ETH_diplomacy_corps: "Diplomatisches Korps"
 ETH_diplomacy_corps_desc: ""
 ETH_aircraft_investments: ""
 ETH_aircraft_investments_desc: ""
 ETH_motorization_investments: "Marathon Motors Engineering"
 ETH_motorization_investments_desc: ""
 ETH_agricultural_investments: ""
 ETH_agricultural_investments_desc: ""
 ETH_educating_the_people: "Bildung für das Volk"
 ETH_educating_the_people_desc: ""
 ETH_idea_refactored_debt: "Umstrukturierte Schulden"
 ETH_idea_refactored_debt_desc: "Die Umstrukturierung unserer Schulden ist ein sicherer Weg, um mehr Stabilität in unsere Nation zu bringen."
 ETH_eritrean_integration_category: "Eritreische Integrationsbemühungen"
 ETH_eritrean_integration_category_desc: "Wir arbeiten derzeit mit Nachdruck daran, das eritreische Volk in unsere Nation zu integrieren. Der Weg bis an unser Ziel mag schwierig sein, doch er ist notwendig, wenn wir eine Nation unter einem Banner sein wollen.\n\n\n§HAktueller Integrationsstand§!: §G[?ETH_eritrean_acceptance|2]%§!\n\n§HVerbreitung der amharischen Sprache§!: §G[?ETH_amharic_speakers|2]%§!\n\n§HPropagandaverbreitung§!: §G[?ETH_propaganda_distribution|2]%§!\n\n§HUnterdrückung von Separatisten§!: §G[?ETH_crackdown_on_bozos|2]%§!"
 ETH_integration_process_tick: "Integrationsprozess"
 ETH_full_integration: "Vollständige Integration durchsetzen"
 ETH_full_integration_desc: "Da das §Y[ERI.GetAdjective]§! Volk nun fest unter unserer Kontrolle steht, ist die Zeit gekommen, die letzten Überreste des künstlichen Staates auszulöschen, der einst als §Y[ERI.GetName]§! bekannt war."
 ETH_federalise_ERI_flip: "Prozess der §YFöderalisierung§! einleiten"
 ETH_federalise_ERI_flip_desc: "Die fortgesetzte Besetzung des §Y[ERI.GetAdjective]§! Staates ist kein tragfähiges Unterfangen mehr. Und die Menschen dort verlangen nach einer Form der Vertretung, also sollten wir eine neue Regierung einsetzen, die mit unserer eigenen Ausrichtung übereinstimmt."
 ETH_fund_amharic_schools: "Amharischunterricht durchsetzen"
 ETH_fund_amharic_schools_desc: "Die Finanzierung von Amharisch-Sprachschulen wird auf etwa §Y$1.00 Milliarden§! geschätzt. Es ist von entscheidender Bedeutung, dafür zu sorgen, dass das §Y[ERI.GetAdjective]§! Volk unsere Lingua franca versteht, denn wenn es uns nicht versteht, wie sollen wir es regieren?"
 ETH_distribute_propaganda: "Propagandakampagnen"
 ETH_distribute_propaganda_desc: "Auch wenn manche Botschaften teuer sind, ist die Botschaft „Benimmt euch - oder sonst“ recht günstig auf Werbetafeln anzubringen. Die Werbetafeln der neu annektierten Gebiete können für den geringen Preis von §Y$0.50 Milliarden§! mit dieser Botschaft plakatiert werden."
 ETH_utilise_informants: "Informantennetzwerk nutzen"
 ETH_utilise_informants_desc: "Informanten sind teuer, doch glücklicherweise war §Y[ERI.GetName]§! arm und wird uns daher kein Vermögen kosten. Das Kommando unserer Besatzung schätzt, dass wir §R$1.00 Milliarden§! für Bestechungsgelder an den richtigen Stellen bereitstellen müssen."
 ETH_harsh_crackdowns: "Hartes Vorgehen gegen Separatisten"
 ETH_harsh_crackdowns_desc: "Widerspruch ist in unserem neuen §Y[ETH.GetName]§! willkommen, denn so lassen sich Unruhestifter am schnellsten aufspüren. Indem wir die nötigen Mittel bereitstellen, können wir Operationen zur Niederschlagung dieses Widerstands in der Bevölkerung durchführen."
 ETH_make_arrests: "Lautstarke Kritiker verhaften"
 ETH_make_arrests_desc: "„Jeder ist ein Kritiker“ - das ist eine törichte Redensart, denn sie impliziert, dass alle gleich seien. Das sind sie nicht. Die einfachste Lösung dieses Problems besteht darin, jene zu verhaften, die uns und unsere Regierung negativ kritisieren."
 ETH_eritrean_federalisation_category: "Fortschritt der eritreischen Föderalisierung"
 ETH_eritrean_federalisation_category_desc: "We are currently working hard to pass the Act of Federation, this may be a difficult road to travel in order to reach our final destination, but it is a necessary one if we are to be a somewhat unified nation under a federal banner.\n\n\n§HCurrent Progress of Federalisation§!: §G[?ETH_eritrean_federation_process|2]%§!\n\n§HAmharic Language Spread§!: §G[?ETH_amharic_speakers|2]%§!\n\n§HPropaganda Spread§!: §G[?ETH_propaganda_distribution|2]%§!\n\n§HSeparatist Suppression§!: §G[?ETH_crackdown_on_bozos|2]%§!"
 ETH_federalisation_process_tick: "Föderalisierungsprozess"
 ETH_federalisation_process_tick_desc: "Alle §Y30 Tage§! werden wir über unseren Fortschritt dabei informiert, das §Y[ERI.GetAdjective]§! Volk und seine Systeme mit unserer eigenen Denkweise in Einklang zu bringen."
 ETH_full_federalisation: "Das zweite Föderationsgesetz unterzeichnen"
 ETH_full_federalisation_desc: "Da das §Y[ERI.GetAdjective]§! Volk das Föderationsgesetz nun unterstützt, kann es offiziell in Kraft gesetzt werden. Dies wird §Y[ETH.GetNameWithFlag]§! jedoch daran hindern, die Region zu annektieren."
 ETH_dissolve_ERI_assembly_flip: "Die Versammlung von §Y[ERI.GetNameWithFlag]§! auflösen"
 ETH_dissolve_ERI_assembly_flip_desc: "Das Experiment der Föderalisierung ist ein schrecklicher Fehlschlag gewesen. Das §Y[ERI.GetAdjective]§! Volk ist schlicht ein zu starker destabilisierender Faktor, um ihm die von uns geplante Autonomie zu gewähren. Wir müssen ihre Versammlung auflösen und gegen jedes Gerede von „Autonomie“ hart vorgehen."
 ETH_encourage_language_schools: "Mehr Mittel an Amharisch-Schulen senden"
 ETH_encourage_language_schools_desc: "Die Finanzierung von Amharisch-Sprachschulen wird auf etwa §Y$1.00 Milliarden§! geschätzt. Es ist wichtig, dem §Y[ERI.GetAdjective]§! Volk zu helfen, unsere Lingua franca zu verstehen, denn wenn es uns nicht versteht, wie sollen wir es regieren?"
 ETH_show_off_benefits_federation: "Die Vorteile der Föderalisierung hervorheben"
 ETH_show_off_benefits_federation_desc: "Werbetafeln, Flugblätter, Plakate und Aufkleber - all das ist teuer, genauer gesagt etwa §Y$2.50 Milliarden§!. Doch es ist eine notwendige Investition, wenn wir die Vorteile eines Föderationsgesetzes angemessen herausstellen wollen."
 ETH_falsify_evidence: "Beweise für Verfehlungen fälschen"
 ETH_falsify_evidence_desc: "Am Ende des Tages müssen Agitatoren verschwinden, und wenn sie das Gesetz nicht brechen, besteht der beste Weg darin, ... „alternative Fakten“ zu präsentieren. Manche nennen das Beweisfälschung, aber das können sie dann auch hinter Gittern sagen."
 ETH_deport_agitators: "Agitatoren deportieren"
 ETH_deport_agitators_desc: "Die Schlimmsten der Schlimmen können weder rehabilitiert noch umerzogen werden; sie können schlicht zum Problem eines anderen werden. Unter Nutzung militärischer Strukturen werden wir jene, die unsere neuen Gesetze gebrochen haben, über unsere Grenzen hinaus abschieben."
 ETH_chi_investments_category: "Chinesische Investitionsprojekte"
 ETH_chi_investments_category_desc: "Due to a series of targeted investments, the Chinese government has managed to secure an investment treaty with us. The treaty allows the Chinese government to gain influence in our country whilst we gain critical infrastructure and economic development projects in return."
 ETH_european_investments_category: "Europäische Investitionsprojekte"
 ETH_european_investments_category_desc: "Nach mehreren Wochen der Verhandlungen mit der Europäischen Union ist es uns gelungen, eine Reihe von Abkommen über Investitionen in unserem Land abzuschließen."
 ETH_light_rail: "Die Addis-Abeba-Stadtbahn bauen"
 ETH_light_rail_desc: "Die wachsende Stadt Addis Abeba leidet jeden Tag unter Staus, doch China hat bereits eine ausgezeichnete Lösung für dieses Problem: ein brandneues Stadtbahnsystem, das von unseren chinesischen Freunden unterstützt wird."
 ETH_construct_light_rail: "Bau der Addis-Abeba-Stadtbahn"
 ETH_light_rail_2: "Das Stadtbahnnetz erweitern"
 ETH_light_rail_2_desc: "In all four directions of our Light Rail Network there is room for expansion. Also we can connect the Light Rail with the also recently built Addis Ababa-Djibouti Railway."
 ETH_construct_light_rail_2: "Erweiterung des Stadtbahnnetzes"
 ETH_construct_light_rail_2_desc: "Nach einer kurzen Diskussion über Haushaltsmaßnahmen haben wir beschlossen, unser Stadtbahnnetz zu erweitern. Diese Erweiterung wird mehr wirtschaftliche Freiheit innerhalb des Landes ermöglichen und zugleich einige unserer Probleme bei der Einfuhr von Lebensmitteln von der Küste lindern."
 ETH_rehabilitation: "Sanierung der Ethio-Dschibuti-Eisenbahn"
 ETH_rehabilitation_desc: "Die Ethio-Dschibuti-Eisenbahn hat ihren Betrieb eingestellt, und jeder Versuch, sie instand zu setzen, wäre Zeitverschwendung. Viele Streckenabschnitte müssen inzwischen vollständig ersetzt werden, um den Betrieb wieder aufnehmen zu können."
 ETH_rehabilitation_railway: "Sanierung der Ethio-Dschibuti-Eisenbahn"
 ETH_rehabilitation_railway_desc: "Die Arbeiten zur Wiederherstellung der Ethio-Dschibuti-Eisenbahn haben begonnen."
 ETH_repair_railway: "Die Ethio-Dschibuti-Eisenbahn reparieren"
 ETH_repair_railway_desc: "Die Ethio-Dschibuti-Eisenbahn muss dringend instand gesetzt werden, und wenn wir das nicht jetzt tun, können die Folgen kostspielig werden."
 ETH_rehabilitation_railway_2: "Sanierung der Ethio-Dschibuti-Eisenbahn"
 ETH_rehabilitation_railway_2_desc: "Die Arbeiten zur Reparatur der Ethio-Dschibuti-Eisenbahn haben begonnen"
 ETH_addis_ababa_djibouti_railway: "Die Addis-Abeba-Dschibuti-Eisenbahn bauen"
 ETH_addis_ababa_djibouti_railway_desc: "Mehr als 95 % des äthiopischen Handels verlaufen über Dschibuti, was das Land für unsere Wirtschaft unverzichtbar macht. Indem wir unsere Hauptstadt direkt mit Dschibuti über eine moderne Eisenbahn verbinden, können wir Reisezeiten und Transportkosten für unsere Waren drastisch senken."
 ETH_construct_addis_ababa_djibouti_railway: "Bau der Addis-Abeba-Dschibuti-Eisenbahn"
 ETH_construct_addis_ababa_djibouti_railway_desc: "Die Arbeiten zum Bau der Addis-Abeba-Dschibuti-Eisenbahn haben begonnen."
 ETH_eritrea_tackle_separatist: "Aufstandsbekämpfungsoperationen"
 ETH_eritrea_tackle_separatist_desc: "Wir haben die potenzielle Bedrohung durch Separatisten noch nicht vollständig beseitigt, die aus irgendeinem Grund zur alten Ordnung zurückkehren wollen. Wenn wir sie nicht mit dem Zuckerbrot überzeugen können, müssen wir womöglich zum Stock greifen."
 ETH_zera_yacob_returns_TT: "Zera Yacob kehrt nach Äthiopien zurück!\n"
 ETH_imperial_guard_TT: "§GThe Kebur Zabagna was the Emperor's official guard. By restoring it, we will secure the new emperor's security as well as its prestige.§!"
 ETH_eritrea_assembly_parties_tt: "§YEritrea§! decides which branches may campaign.\n\nOur §YEthiopian wings§! taking the assembly is the likeliest outcome and advances the §YProgress of Federalisation§! by §G10%§!.\nA win for the §Ynative Eritrean parties§! advances it by §G5%§!.\nA §Ymonarchist restoration§! advances it not at all, costs us §RStability§! and loosens our hold on §YEritrea§!."
 update_ETH_eritrean_federation_process_TT: "§YProgress of Federalisation§!: [?ETH_federation_process_change|2+]% (Current §YProgress of Federalisation§!: [?ETH_eritrean_federation_process|2Y]%)"
