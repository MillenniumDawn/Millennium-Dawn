 PHI_investigate_corporations: "调查公司"
 PHI_investigate_corporations_desc: "菲律宾大型企业集团长期以来与监管机构和立法者保持着密切关系。对企业账目、税务申报和政府合同进行重点调查，可能会揭露贿赂和挪用公款的丑闻，但结果取决于目前腐败的根深蒂固程度。\n\n当前腐败等级：([?PHI_corruption_tier|0]) [?PHI_corruption_tier_name]"
 PHI_audit_government_contracts: "审计政府合同"
 PHI_audit_government_contracts_desc: "公共基础设施和采购合同是臭名昭著的贪污滋生地，回扣和虚报发票等手段会将资金从公共项目中挪用。对近期合同进行彻底审计或许能揭露欺诈行为，但那些有所隐瞒的官员会极力抵制审查。\n\n当前腐败等级：([?PHI_corruption_tier|0]) [?PHI_corruption_tier_name]"
 PHI_inspect_tax_bureau: "检查税务局"
 PHI_inspect_tax_bureau_desc: "税务局一直饱受贿赂、暗箱操作和伪造记录等指控的困扰。内部调查或许能够追回损失的税款并揪出腐败官员，但税务局自身的腐败也可能庇护最严重的违法者。\n\n当前腐败等级：([?PHI_corruption_tier|0]) [?PHI_corruption_tier_name]"
 PHI_investigate_the_military: "调查军方"
 PHI_investigate_the_military_desc: "采购丑闻和吃空饷问题长期以来一直困扰着菲律宾武装部队的预算。调查军方财务状况可能会引发与军官团的摩擦，但成功的调查可以追回被盗资金，并恢复军队内部的纪律。\n\n当前腐败等级：([?PHI_corruption_tier|0]) [?PHI_corruption_tier_name]"
 PHI_purge_local_officials: "清洗地方官员"
 PHI_purge_local_officials_desc: "从省议会大厦到描笼涯大厅的地方政府单位往往由将公职视为家族企业的政治王朝主导。有针对性地清洗腐败的地方官员可以打破他们对权力的控制，尽管根深蒂固的王朝可能会竭尽全力进行抵抗。\n\n当前腐败等级：([?PHI_corruption_tier|0]) [?PHI_corruption_tier_name]"
 PHI_trace_offshore_accounts: "追踪海外账户"
 PHI_trace_offshore_accounts_desc: "数十年来，非法所得往往被转移到海外的离岸账户和空壳公司。追踪这些账户耗时费力，成本高昂，而且涉及外交敏感问题，但一旦成功追踪，就能追回巨额资金，并对构建这些账户的犯罪网络造成沉重打击。\n\n当前腐败等级：([?PHI_corruption_tier|0]) [?PHI_corruption_tier_name]"
 PHI_police_investiture: "警察授勋"
 PHI_police_investiture_desc: "将政府资金重新分配，用于加强菲律宾国家警察，提高调查人员的工作效率，但代价是增加警务支出。"
 PHI_police_investiture_active_tt: "增加警务经费的措施正在发挥作用。所有反腐败调查的成功率都有所提高。\n§R+20%§!警力支出。§R−15§!最大指挥点数。"
 PHI_corporate_scandal_industry: "企业丑闻"
 PHI_corporate_scandal_industry_desc: "高价值企业腐败案的曝光动摇了投资者对我国工业领域的信心。"
 PHI_procurement_scandal_construction: "采购丑闻"
 PHI_procurement_scandal_construction_desc: "政府合同中发现的重大腐败问题导致工程进度放缓，因为合同正在接受审查。"
 PHI_customs_fraud_tax: "海关欺诈案曝光"
 PHI_customs_fraud_tax_desc: "海关部门重组期间，一个海关欺诈团伙扰乱了税收征管工作。"
 PHI_tax_scandal_investment: "税务局丑闻"
 PHI_tax_scandal_investment_desc: "税务部门高层腐败吓跑了外国投资者。"
 PHI_military_scandal_org: "军方腐败丑闻"
 PHI_military_scandal_org_desc: "总参谋部的腐败破坏了指挥结构和部队凝聚力。"
 PHI_offshore_fortune_investment: "追回的境外资金"
 PHI_offshore_fortune_investment_desc: "查获的海外资产已被重新投资，开辟了新的外国投资渠道。"
 PHI_locked_corruption: "根深蒂固的腐败"
 PHI_locked_corruption_desc: "§R无法手动修改反腐败法律§!\n多年来的裙带政治、官僚主义低效和根深蒂固的特殊利益集团，使得腐败渗透到菲律宾国家体制的方方面面。公共资源经常被挪用，问责机制依然薄弱，权势人物继续从现状中获利。仅靠法令无法实现有意义的改革。反腐败斗争需要坚定不移的调查、更强大的机构以及一个敢于挑战那些从体制中获利者的政府。"
 PHI_corruption_eradicated: "廉洁政府"
 PHI_corruption_eradicated_desc: "经过多年的持续改革，菲律宾取得了一项在其历史上极为罕见的成就：一个真正廉洁高效的政府。国家机构更加健全，公众信任得以重建，贪污腐败的恶性循环也暂时被打破。但要保持这一水准，仍需持续保持警惕。"
 PHI_corruption_event.1.t: "腐败等级降低"
 PHI_corruption_event.1.d: "我们不懈的努力终于有了回报。腐败网络已被瓦解，新的问责机制已经建立。"
 PHI_corruption_event.1.a: "终于取得进展了。"
 PHI_corruption_event.2.t: "腐败加剧"
 PHI_corruption_event.2.d: "尽管我们做出了努力，腐败势力仍然巩固了他们的控制。贿赂和贪污已经进一步渗透到国家机构中。"
 PHI_corruption_event.2.a: "我们必须做得更好。"
 PHI_corruption_event.10.t: "调查：怀疑存在掩盖行为"
 PHI_corruption_event.10.d: "我们的调查人员遇到了重重阻碍，律师众多，文件都被封存，而且还有人突然失忆。某个有权势的人在掩盖罪行，但我们无法证实。"
 PHI_corruption_event.10.a: "继续关注他们。"
 PHI_corruption_event.11.t: "调查：发现腐败团伙"
 PHI_corruption_event.11.d: "一个在私营部门运作的中层腐败团伙被曝光。多名高管面临指控，部分被挪用的资金已被追回。"
 PHI_corruption_event.11.a: "起诉他们。"
 PHI_corruption_event.12.t: "调查：企业丑闻曝光"
 PHI_corruption_event.12.d: "一场巨大的企业丑闻震动了商界。高管们与政府官员勾结，挪用公共资金。丑闻的余波动摇了投资者的信心。"
 PHI_corruption_event.12.a: "没收他们的资产。"
 PHI_corruption_event.13.t: "调查：高额腐败案曝光"
 PHI_corruption_event.13.d: "一项惊人的发现：一张牵涉私营企业最高层的巨额企业腐败网络已被彻底揭露。数十亿美元的资产正在被查封。"
 PHI_corruption_event.13.a: "这件事不会被遗忘。"
 PHI_corruption_event.20.t: "审计：未发现证据"
 PHI_corruption_event.20.d: "审计结果显示没有任何问题。所有合同的纸质文件都核对无误。要么账目干净，要么在我们到来之前就有人篡改过。"
 PHI_corruption_event.20.a: "我们尝试过了。"
 PHI_corruption_event.21.t: "审计：管理不善暴露无遗"
 PHI_corruption_event.21.d: "审计人员发现多个部门存在账目混乱和虚报发票的情况。被挪用的资金已被追回。"
 PHI_corruption_event.21.a: "让他们承担责任。"
 PHI_corruption_event.22.t: "审计：发现采购腐败"
 PHI_corruption_event.22.d: "一个根深蒂固的采购舞弊案被曝光。官员们有系统地将合同授予空壳公司，以换取回扣。"
 PHI_corruption_event.22.a: "拆除网络。"
 PHI_corruption_event.23.t: "审计：国家贪污案曝光"
 PHI_corruption_event.23.d: "一起涉及多个部委的惊人贪污案被曝光。如此大规模的公款盗窃案堪称全国丑闻。"
 PHI_corruption_event.23.a: "这一切到此结束。"
 PHI_corruption_event.30.t: "税务检查：未发现任何问题"
 PHI_corruption_event.30.d: "检查人员未发现确凿的违法证据。工作人员配合调查，记录也井然有序。调查无果而终。"
 PHI_corruption_event.30.a: "重返工作。"
 PHI_corruption_event.31.t: "税务稽查：发现贿赂行为"
 PHI_corruption_event.31.d: "一些基层税务人员因收受贿赂以减少税款评估而被抓获。他们已被解雇，拖欠的税款也已被追回。"
 PHI_corruption_event.31.a: "Clean house."
 PHI_corruption_event.32.t: "Tax Inspection: Customs Fraud Exposed"
 PHI_corruption_event.32.d: "A sophisticated customs fraud ring has been dismantled. Smugglers had bribed senior agents to wave through untaxed shipments for years."
 PHI_corruption_event.32.a: "Reform the bureau."
 PHI_corruption_event.33.t: "Tax Inspection: Top Officials Implicated"
 PHI_corruption_event.33.d: "Top officials within the Bureau of Internal Revenue have been implicated in a systemic corruption scheme. The scandal has alarmed foreign investors and rattled public confidence."
 PHI_corruption_event.33.a: "Prosecute every one of them."
 PHI_corruption_event.40.t: "Military Inquiry: Evidence Covered Up"
 PHI_corruption_event.40.d: "The military closed ranks. Our investigators were met with stonewalling at every level. If corruption exists, it has been buried deep."
 PHI_corruption_event.40.a: "We will return."
 PHI_corruption_event.41.t: "Military Inquiry: Officers Caught"
 PHI_corruption_event.41.d: "Several low-ranking officers were caught diverting fuel allocations and equipment for personal gain. They have been court-martialled."
 PHI_corruption_event.41.a: "Justice is served."
 PHI_corruption_event.42.t: "Military Inquiry: General Staff Implicated"
 PHI_corruption_event.42.d: "Members of the general staff have been implicated in a corruption ring involving defense procurement contracts. The scandal has disrupted the chain of command."
 PHI_corruption_event.42.a: "Purge the ranks."
 PHI_corruption_event.43.t: "Military Inquiry: Senior Figure Exposed"
 PHI_corruption_event.43.d: "A senior military figure has been publicly exposed for embezzling defense funds over many years. The revelation has shocked the armed forces and the public alike."
 PHI_corruption_event.43.a: "No one is above the law."
 PHI_corruption_event.50.t: "Purge: No Significant Results"
 PHI_corruption_event.50.d: "Local officials kept their heads down and the purge found little to act on. Either the networks went quiet or were tipped off in advance."
 PHI_corruption_event.50.a: "We will try again."
 PHI_corruption_event.51.t: "Purge: Graft Network Found"
 PHI_corruption_event.51.d: "A small-scale graft network operating out of the local bureaucracy has been dismantled. A handful of officials have been removed from their posts."
 PHI_corruption_event.51.a: "Good riddance."
 PHI_corruption_event.52.t: "Purge: Local Syndicate Exposed"
 PHI_corruption_event.52.d: "A major local syndicate embedded within the regional government has been exposed. Their removal has disrupted local power structures and stirred unrest."
 PHI_corruption_event.52.a: "Stability will follow."
 PHI_corruption_event.53.t: "Purge: Political Dynasty Toppled"
 PHI_corruption_event.53.d: "An entrenched political dynasty that had controlled local government for decades has been toppled. Their assets have been seized, though loyalists remain restless."
 PHI_corruption_event.53.a: "A new era begins."
 PHI_corruption_event.60.t: "Offshore Trace: No Trail Found"
 PHI_corruption_event.60.d: "Our financial investigators hit a dead end. Every lead dissolved into anonymous shell companies across multiple jurisdictions. The money has vanished."
 PHI_corruption_event.60.a: "We lost them."
 PHI_corruption_event.61.t: "Offshore Trace: Minor Accounts Found"
 PHI_corruption_event.61.d: "A number of minor offshore accounts linked to government officials have been identified and frozen. The amounts are modest but the precedent is significant."
 PHI_corruption_event.61.a: "Freeze everything."
 PHI_corruption_event.62.t: "Offshore Trace: Laundering Network Exposed"
 PHI_corruption_event.62.d: "A major money laundering network moving funds through offshore accounts has been dismantled. A significant sum has been repatriated to the Philippine treasury."
 PHI_corruption_event.62.a: "Bring it home."
 PHI_corruption_event.63.t: "Offshore Trace: Offshore Fortune Uncovered"
 PHI_corruption_event.63.d: "An extraordinary discovery: a vast offshore fortune belonging to senior officials has been uncovered and seized. The windfall is historic and sends a powerful message."
 PHI_corruption_event.63.a: "The people will know."
 PHI_corruption_event.99.t: "Public Trust Restored"
 PHI_corruption_event.99.d: "With the old political dynasty removed from power, local communities are slowly rebuilding trust in their institutions. A sense of cautious optimism is taking hold."
 PHI_corruption_event.99.a: "The people are behind us."
 PHI_corruption_event.100.t: "We Have Done It"
 PHI_corruption_event.100.d: "After years of painstaking investigations, prosecutions, and institutional reforms, our anti-corruption drive has reached a milestone that few believed possible. The entrenched networks of graft and patronage that once paralyzed our government have been dismantled. The Philippines stands at the threshold of a new era, one defined not by what officials steal, but by what they build."
 PHI_corruption_event.100.a: "A new Philippines begins today."
 PHI_corruption_event.200.t: "Corporate Lobbying Scandal"
 PHI_corruption_event.200.d: "Rumors are circulating that a major conglomerate has used secret donations to influence recent legislation. The public is paying attention, and the opposition smells blood."
 PHI_corruption_event.200.a: "Ignore it. We can't fight everyone."
 PHI_corruption_event.200.b: "Launch a limited audit."
 PHI_corruption_event.200.c: "Publicly condemn them."
 PHI_corruption_event.201.t: "Ghost Projects"
 PHI_corruption_event.201.d: "A parliamentary report has found several state-funded infrastructure projects with no trace of completion: no roads built, no buildings standing, no workers ever hired. The money simply vanished."
 PHI_corruption_event.201.a: "Sweep it under the rug."
 PHI_corruption_event.201.b: "Blame local officials."
 PHI_corruption_event.201.c: "Launch an official inquiry."
 PHI_corruption_event.202.t: "Tax Leak"
 PHI_corruption_event.202.d: "A whistleblower has come forward with evidence that senior government officials have been evading taxes through a network of fake shell companies. The documents are already circulating in the press."
 PHI_corruption_event.202.a: "Handle this quietly."
 PHI_corruption_event.202.b: "Make an example of them."
 PHI_corruption_event.202.c: "Offer leniency in exchange for cooperation."
 PHI_corruption_event.203.t: "Military Procurement Fraud"
 PHI_corruption_event.203.d: "Investigations have revealed missing weapons shipments intended for the Armed Forces of the Philippines. Invoices were signed, deliveries were logged, but the equipment is nowhere to be found."
 PHI_corruption_event.203.a: "Dismiss the accusations."
 PHI_corruption_event.203.b: "Punish a few scapegoats."
 PHI_corruption_event.203.c: "Launch a full inquiry."
 PHI_corruption_event.204.t: "Provincial Mafia Networks"
 PHI_corruption_event.204.d: "Police intelligence reports have confirmed what many locals already knew: several provincial and barangay officials are actively cooperating with organized crime syndicates. Protection money is changing hands at every level."
 PHI_corruption_event.204.a: "Ignore it."
 PHI_corruption_event.204.b: "Arrest them publicly."
 PHI_corruption_event.204.c: "Replace them with loyalists."
 PHI_corruption_event.205.t: "Foreign Kickback Scheme"
 PHI_corruption_event.205.d: "Evidence has emerged that foreign construction and energy companies bribed senior officials to secure lucrative government contracts. The paper trail leads all the way to the capital."
 PHI_corruption_event.205.a: "Deny everything."
 PHI_corruption_event.205.b: "Quietly sanction them."
 PHI_corruption_event.205.c: "Make a public example."
 PHI_corruption_event.206.t: "Bureaucratic Rot"
 PHI_corruption_event.206.d: "Petty corruption has become increasingly normalized across government offices. Clerks expect envelopes. Inspectors need persuading. Permits have a price beyond their official fee. The culture of small corruptions is eroding institutional trust."
 PHI_corruption_event.206.a: "Let them have their small perks."
 PHI_corruption_event.206.b: "Issue symbolic reforms."
 PHI_corruption_event.206.c: "Reassign several officials."
