 AUSHUN_form_category: "オーストリア＝ハンガリー帝国の再形成"
 AUSHUN_form_category_desc: "オーストリア＝ハンガリー帝国は、19世紀後半から20世紀初頭にかけて中央ヨーロッパで強大な勢力を誇っていた。第一次世界大戦での大敗後、国家は解体され、チェコ、オーストリア、ハンガリー、スロバキア、スロベニア、ボスニア、そしてウクライナ、ポーランド、ルーマニアの一部に分裂した。今こそ、はるか昔に失われた権威を取り戻す時だ。オーストリア＝ハンガリー帝国を改革すべき時が来たのだ。"
 AUSHUN_integrate_start: "[GetAUSHUNNameDef]形成の開始"
 AUSHUN_integrate_start_desc: "オーストリア＝ハンガリー帝国の領土は我が軍によって奪還され、政治家たちは新たな地域の統治に向けた取り組みを開始した。\n\n"
 AUSHUN_integrate_austria: "[GetAUSHUNNameAdj][AUS.GetAdjective]地域の統合"
 AUSHUN_integrate_austria_desc: "かつてのハプスブルク帝国の中心地であるオーストリアは、我らの権力の主要拠点の一つであるべきだ。"
 AUSHUN_integrate_hungary: "[GetAUSHUNNameAdj][HUN.GetAdjective]地域の統合"
 AUSHUN_integrate_hungary_desc: "ハンガリー王国は、二重帝国を構成する王国の片割れであり、帝国の統治におけるパートナーであった。その統合は、帝国の構造を再建するために不可欠である。"
 AUSHUN_integrate_slovenia: "[GetAUSHUNNameAdj][SLV.GetAdjective]地域の統合"
 AUSHUN_integrate_slovenia_desc: "スロベニアの領土はオーストリア帝冠領の一部を構成しており、アドリア海への出口として機能するとともに、オーストリアとバルカン半島を結ぶ架け橋としての役割を果たしていた。"
 AUSHUN_NORTHITA_integrate: "[GetAUSHUNNameAdj]北イタリア地域の統合"
 AUSHUN_NORTHITA_integrate_desc: "かつて、イタリアのロンバルド＝ヴェネト地方は、文化と商業に恵まれたハプスブルク家の宝であった。この地域の回収により、オーストリアはポー川流域における影響力を取り戻すことになるだろう。"
 AUSHUN_integrate_croatia: "[GetAUSHUNNameAdj][CRO.GetAdjective]地域の統合"
 AUSHUN_integrate_croatia_desc: "クロアチアはハンガリー王冠領の一部であり、かなりの自治権を有していた。アドリア海沿岸に位置するその港湾と戦略的な立地は、帝国の海軍力にとって極めて重要なものとなっていた。"
 AUSHUN_integrate_bosnia: "[GetAUSHUNNameAdj][BOS.GetAdjective]地域の統合"
 AUSHUN_integrate_bosnia_desc: "1878年以来オーストリア＝ハンガリー帝国によって統治され、1908年に正式に併合されたボスニア・ヘルツェゴビナの統合は、我々の南方の国境を固め、バルカン半島への影響力を拡大することになるだろう。"
 AUSHUN_integrate_slovakia: "[GetAUSHUNNameAdj][SLO.GetAdjective]地域の統合"
 AUSHUN_integrate_slovakia_desc: "スロヴァキアの領土はハンガリー王国の不可欠な一部であり、王国の山岳地帯に広がる北の国境を形成していた。その再統合により、カルパティア山脈に対する我々の支配はさらに強固なものとなる。"
 AUSHUN_AUSROM_integrate: "[GetAUSHUNNameAdj]トランシルヴァニア地域の統合"
 AUSHUN_AUSROM_integrate_desc: "トランシルヴァニアは、かつてハンガリー王領であり、ルーマニア人とハンガリー人の間で争われてきた地域である。この地域における支配権の掌握は、帝国の東部への要衝を確保することにつながる。"
 AUSHUN_integrate_czechia: "[GetAUSHUNNameAdj][CZE.GetAdjective]地域の統合"
 AUSHUN_integrate_czechia_desc: "ボヘミア王領は、帝国の中でも最も工業化が進み、文化的に豊かな地域の一つであった。プラハは帝国の主要都市の一つとして位置づけられており、その再統合は極めて重要である。"
 AUSHUN_AUSPOL_integrate: "南ポーランドの統合"
 AUSHUN_AUSPOL_integrate_desc: "ガリツィアは、ポーランド分割によって獲得された王領であり、帝国の北の辺境に経済的資源と戦略的深みをもたらした。"
 AUSHUN_WESTUKR_integrate: "南西ウクライナの統合"
 AUSHUN_WESTUKR_integrate_desc: "ガリツィアの東部地域にはルテニア人が居住しており、豊かな農業生産をもたらしていた。彼らの統合により、我々の影響力はウクライナの国境地帯にまで拡大している。"
 AUSHUN_update_flag: "[GetAUSHUNNameDef]形成の完遂"
 AUSHUN_update_flag_desc: "すべての構成地域が統合されれば、我々は変革を完遂し、[GetAUSHUNNameDef]を宣言するとともに、その統一された国旗と名称を採用することができる。"
