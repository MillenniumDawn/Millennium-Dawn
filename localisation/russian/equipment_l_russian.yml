 train_equipment: "Гражданские поезда"
 train_equipment_1: "Современный дизель-электрический локомотив"
 train_equipment_2: "Высокоскоростной электропоезд"
 train_equipment_3: "Поезд будущего на водородной тяге"
 train_equipment_desc: "Да просто поезд."
 combat_eng_equipment: "Боевое инженерное оборудование"
 combat_eng_equipment_desc: "Боевые инженеры играют ключевую роль во всех вооружённых силах мира: они неизменно тесно интегрированы в структуру войск или даже непосредственно в боевые части национальных армий."
 L_Drone_equipment: "Дроны"
 L_Drone_equipment_desc: "Разведывательные дроны малой дальности (БПЛА) обеспечивают ценную разведку в реальном времени и понимание обстановки на поле боя. Они лёгкие и сравнительно легко переносятся."
 artillery_equipment: "Артиллерия"
 artillery_equipment_desc: "Артиллерия — это класс крупного военного оружия, созданного для стрельбы боеприпасами на дальность и с мощностью, намного превосходящими возможности стрелкового оружия пехоты."
 artillery_1: "Артиллерия 1965 года"
 artillery_1_desc: "Благодаря мощным возможностям ведения огня с закрытых позиций артиллерия наносит непрерывные точные удары там, где это необходимо на поле боя, и далеко за пределами прямой видимости. Её может перезаряжать непосредственно расчёт. Поскольку для перемещения ей нужны тягачи, менять позицию между ударами бывает непросто, что делает её уязвимой для контрбатарейного огня противника. Лёгкие системы меньшего калибра можно перемещать вручную; они подходят для воздушно-десантных операций, поскольку помещаются в транспортные самолёты."
 artillery_2: "АРТ 1985 года"
 artillery_2_desc: "Благодаря мощным возможностям ведения огня с закрытых позиций артиллерия наносит непрерывные точные удары там, где это необходимо на поле боя, и далеко за пределами прямой видимости. Её может перезаряжать непосредственно расчёт. Поскольку для перемещения ей нужны тягачи, менять позицию между ударами бывает непросто, что делает её уязвимой для контрбатарейного огня противника. Лёгкие системы меньшего калибра можно перемещать вручную; они подходят для воздушно-десантных операций, поскольку помещаются в транспортные самолёты."
