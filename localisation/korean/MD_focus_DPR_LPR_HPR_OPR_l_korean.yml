 DPR_nov_annex: "노보로시야 수립"
 DPR_nov_annex_desc: ""
 dpr.4.t: "[ROOT.GetName]의 러시아 가입"
 dpr.4.d: "마침내 [ROOT.GetNameWithFlag]이(가) 고향으로 돌아갑니다. 이제 그들은 위대한 나라의 일부가 되어 자치를 희생하게 되지만, 과연 우리에게 자치가 필요했을까요?"
 dpr.4.a: "마침내"
 dpr.4.b: "안된다"
 dpr.5.t: "수립된 노보로시야"
 dpr.5.d: "도네츠크 공화국과 루한스크 공화국이 오늘 노보로시야 수립에 관한 문서에 서명했습니다. 우크라이나 남동부의 상황이 빠르게 전개되고 있는 듯합니다."
 dpr.5.a: "흥미롭군"
 dpr.6.t: ""
 dpr.6.d: ""
 dpr.6.a: ""
 dpr.7.t: "노보로시야 수립"
 dpr.7.d: "도네츠크 공화국과 루한스크 공화국이 노보로시야 수립 선언에 서명했습니다. 우리는 이 지역들의 해방을 향해 한 걸음 내디뎠습니다"
 dpr.7.a: "만세"
 odessa_focus: "오데사 인민공화국 중점"
 OPR_Start_rebellion: "새 공화국의 탄생"
 OPR_Start_rebellion_desc: "노보로시야의 땅에서 새로운 인민 공화국이 탄생했습니다. 오데사 주민들은 자결권을 지켜 냈으며, 이제 무기를 손에 들고 이를 지켜야 합니다."
 OPR_weapon_suplly: "무기고 접수"
 OPR_weapon_suplly_desc: "우리 공화국 영토에서 발견되는 무기고를 접수하고 그 무기를 우리 인민 민병대에 배분할 것입니다."
 OPR_odessa_defence: "오데사 강화"
 OPR_odessa_defence_desc: "오데사에 방어 요새 건설을 시작할 것입니다. 적이 다가오고 있으며 우리는 도시를 방어할 준비를 갖추어야 합니다."
 OPR_mobilisation: "주민 동원"
 OPR_mobilisation_desc: "오데사 사람들은 고향을 지키기 위해 나서야 합니다. 그러지 않으면 적은 우리를 용서하지 않고 파괴할 것입니다."
 OPR_people_militia: "OPR 인민 민병대"
 OPR_people_militia_desc: "다른 공화국들과 마찬가지로, 우리도 국가의 존립을 지키기 위해 자체 인민 민병대를 창설할 것입니다."
 OPR_russian_suplly: "러시아 무기"
 OPR_russian_suplly_desc: "러시아가 우리의 독립을 지킬 수 있도록 무기를 보내고 있습니다."
 OPR_government: "공화국 정부"
 OPR_government_desc: "우리 국가가 온전히 기능하도록 마침내 정부와 그 구조를 승인할 것입니다."
 OPR_bivalute: "흐리우냐 폐기"
 OPR_bivalute_desc: "우리는 더 이상 계산에 흐리우냐를 사용할 생각이 없으며, 루블만 사용할 것입니다."
 OPR_bank: "오데사 국립 은행"
 OPR_bank_desc: "국립 은행을 설립하면서 우리 자체의 경제 체제를 만들어 나가기 시작할 것입니다."
 OPR_passport: "오데사 시민 여권"
 OPR_passport_desc: "우리 자체의 시민권도 만들 것입니다. 사람들은 우리가 우리 자신의 국가에 살고 있음을 이해해야 합니다."
 OPR_operator: "우리의 통신 사업자"
 OPR_operator_desc: "우크라이나 통신 사업자를 완전히 없애고 우리 자체의 사업자를 만들 것입니다."
 OPR_teroborona: "영토 방어 생성"
 OPR_teroborona_desc: "인민 민병대에 더해, 우리는 국경과 내부 안보를 강화하기 위해 영토방위대를 창설하는 우크라이나의 관행을 차용하고 있습니다."
 OPR_afini: "오데사 분대"
 OPR_afini_desc: "우려하는 시민들이 도시를 지키기 위해 분대로 뭉쳤습니다."
 OPR_mali: "오데사 여단"
 OPR_mali_desc: "우려하는 시민들이 도시를 지키기 위해 여단으로 뭉쳤습니다."
 OPR_sloboda: "\\"붉은 근위대\\" 여단"
 OPR_sloboda_desc: "소련 정부를 그리워하는 주민도 많으며, 우리는 이들로 별도의 부대를 꾸릴 수 있었습니다."
 OPR_mgb: "OPR 국가보안부"
 OPR_mgb_desc: "공화국 내부에서 시민들의 평화와 안녕을 지킬 우리 자체의 부처를 창설할 것입니다."
 OPR_interbrigabe: "국제 여단"
 OPR_interbrigabe_desc: "뭉쳐서 하나의 강력한 군대를 이루기 위해 러시아에서 건너온 민족볼셰비키 국제여단입니다!"
 OPR_desorg: "무질서 해소"
 OPR_desorg_desc: "서로 복종하지 않는 수많은 대대로 이루어진 우리 군의 무질서를 해소하고 있습니다."
 OPR_defence: "방어선"
 OPR_defence_desc: "우리나라는 국경을 강화하고 앞으로도 스스로를 방어할 태세를 갖추어야 합니다."
 OPR_guard_republic: "OPR 공화국 근위대"
 OPR_guard_republic_desc: "공화국 근위대는 전선에서 가장 중요한 임무를 수행하는 정예 부대로 창설될 것입니다."
 OPR_infra: "인프라 재건"
 OPR_infra_desc: "전투로 우리의 인프라가 완전히 파괴되었으며, 우리는 이를 복구할 것입니다."
 OPR_energy: "에너지 부문"
 OPR_energy_desc: "공화국이 암흑에 빠지지 않도록 에너지 부문에 투자할 것입니다"
 OPR_referendum: "러시아 가입 국민투표"
 OPR_referendum_desc: "우리의 주된 목표는 러시아의 일부가 되는 것이었으며 지금도 그렇습니다. 러시아의 일부가 될지 결정하는 국민투표를 실시하겠지만, 결과는 이미 분명하다고 봅니다. 마지막 결정은 러시아에 달려 있습니다."
 OPR_referendum_trans: "트란스니스트리아 가입 국민투표"
 OPR_referendum_trans_desc: "우리의 주된 목표는 트란스니스트리아의 일부가 되는 것이었으며 지금도 그렇습니다. 트란스니스트리아의 일부가 될지 결정하는 국민투표를 실시하겠지만, 결과는 이미 분명하다고 봅니다. 마지막 결정은 트란스니스트리아에 달려 있습니다."
 OPR_economic: "오데사 경제"
 OPR_economic_desc: "오데사 영토에서 상실된 생산 시설의 복구를 시작할 것입니다"
 OPR_avto: "오데사 자동차 조립 공장"
 OPR_avto_desc: "오데사 자동차 조립 공장은 오데사 시에 있는 자동차 조립 공장입니다"
 OPR_avia_zavod: "오데사 항공 공장"
 OPR_avia_zavod_desc: "오데사 항공 공장은 항공 장비의 현대화, 수리, 정비를 수행하는 군산복합체 기업입니다."
 OPR_tractor: "농기계 공장"
 OPR_tractor_desc: "오데사 농기계 공장은 농기계 수리를 하는 산업 기업입니다."
 OPR_unproffesional_army: "비조직 민병대"
 OPR_proffesional_army: "인민 민병대"
 OPR_bivaluta: "이중 통화 시기"
 OPR_ter_orobona: "영토방위대"
 OPR_forts_buildings: "요새 집중 건설"
 kharkiv_focus: "하르키우 인민공화국 중점"
 HPR_Start_rebellion: "새 공화국의 탄생"
 HPR_Start_rebellion_desc: "노보로시야의 땅에서 새로운 인민 공화국이 탄생했습니다. 하르키우 주민들은 자결권을 지켜 냈으며, 이제 무기를 손에 들고 이를 지켜야 합니다."
 HPR_weapon_suplly: "무기고 접수"
 HPR_weapon_suplly_desc: "우리 공화국 영토에서 발견되는 무기고를 접수하고 그 무기를 우리 인민 민병대에 배분할 것입니다."
 HPR_harkov_defence: "하르키우 강화"
 HPR_harkov_defence_desc: "하르키우에 방어 요새 건설을 시작할 것입니다. 적이 다가오고 있으며 우리는 도시를 방어할 준비를 갖추어야 합니다."
 HPR_mobilisation: "주민 동원"
 HPR_mobilisation_desc: "하르키우 사람들은 고향을 지키기 위해 나서야 합니다. 그러지 않으면 적은 우리를 용서하지 않고 파괴할 것입니다."
 HPR_people_militia: "HPR 인민 민병대"
 HPR_people_militia_desc: "다른 공화국들과 마찬가지로, 우리도 국가의 존립을 지키기 위해 자체 인민 민병대를 창설할 것입니다."
 HPR_russian_suplly: "러시아 무기"
 HPR_russian_suplly_desc: "러시아가 우리의 독립을 지킬 수 있도록 무기를 보내고 있습니다."
 HPR_government: "공화국 정부"
 HPR_government_desc: "우리 국가가 온전히 기능하도록 마침내 정부와 그 구조를 승인할 것입니다."
 HPR_bivalute: "흐리우냐 폐기"
 HPR_bivalute_desc: "우리는 더 이상 계산에 흐리우냐를 사용할 생각이 없으며, 루블만 사용할 것입니다."
 HPR_bank: "하르키우 국립 은행"
 HPR_bank_desc: "국립 은행을 설립하면서 우리 자체의 경제 체제를 만들어 나가기 시작할 것입니다."
 HPR_passport: "하르키우 시민 여권"
 HPR_passport_desc: "우리 자체의 시민권도 만들 것입니다. 사람들은 우리가 우리 자신의 국가에 살고 있음을 이해해야 합니다."
 HPR_operator: "우리의 통신 사업자"
 HPR_operator_desc: "우크라이나 통신 사업자를 완전히 없애고 우리 자체의 사업자를 만들 것입니다."
 HPR_teroborona: "영토 방어 생성"
 HPR_teroborona_desc: "인민 민병대에 더해, 우리는 국경과 내부 안보를 강화하기 위해 영토방위대를 창설하는 우크라이나의 관행을 차용하고 있습니다."
 HPR_afini: "\\"아테네\\" 대대"
 HPR_afini_desc: "우리 공화국에 찾아온 많은 마음 따뜻한 시민들이 이미 자체 대대인 아테네를 창설할 수 있었습니다. DPR에 스파르타가 있는 동안, 우리에게는 아테네가 있을 것입니다."
 HPR_mali: "\\"말리\\" 대대"
 HPR_mali_desc: "DPR의 형제들이 소말리 대대의 깃발 아래 싸우는 동안, 우리는 말리 대대를 창설할 것입니다."
 HPR_sloboda: "\\"슬로보다\\" 카자크 대대"
 HPR_sloboda_desc: "카자크 대표들이 우리 공화국에 도착해 자체 대대를 창설했습니다."
 HPR_mgb: "HPR 국가보안부"
 HPR_mgb_desc: "공화국 내부에서 시민들의 평화와 안녕을 지킬 우리 자체의 부처를 창설할 것입니다."
 HPR_interbrigabe: "국제 여단"
 HPR_interbrigabe_desc: "뭉쳐서 하나의 강력한 군대를 이루기 위해 러시아에서 건너온 민족볼셰비키 국제여단입니다!"
 HPR_desorg: "무질서 해소"
 HPR_desorg_desc: "서로 복종하지 않는 수많은 대대로 이루어진 우리 군의 무질서를 해소하고 있습니다."
 HPR_defence: "방어선"
 HPR_defence_desc: "우리나라는 국경을 강화하고 앞으로도 스스로를 방어할 태세를 갖추어야 합니다."
 HPR_guard_republic: "HPR 공화국 근위대"
 HPR_guard_republic_desc: "공화국 근위대는 전선에서 가장 중요한 임무를 수행하는 정예 부대로 창설될 것입니다."
 HPR_infra: "인프라 재건"
 HPR_infra_desc: "전투로 우리의 인프라가 완전히 파괴되었으며, 우리는 이를 복구할 것입니다."
 HPR_energy: "에너지 부문"
 HPR_energy_desc: "공화국이 암흑에 빠지지 않도록 에너지 부문에 투자할 것입니다"
 HPR_kugbaz: "쿠반가스 국유화"
 HPR_kugbaz_desc: "공화국의 이익을 위해 이 회사를 국유화합니다"
 HPR_kondicioner: "\\"콘디치오네르\\" 공장 국유화 및 재가동"
 HPR_kondicioner_desc: "우리에게는 더 많은 산업이 필요하며, 앞서 파괴된 공장을 되살릴 것입니다."
 HPR_referendum: "러시아 가입 국민투표"
 HPR_referendum_desc: "우리의 주된 목표는 러시아의 일부가 되는 것이었으며 지금도 그렇습니다. 러시아의 일부가 될지 결정하는 국민투표를 실시하겠지만, 결과는 이미 분명하다고 봅니다. 마지막 결정은 러시아에 달려 있습니다."
 HPR_economic: "하르키우 경제"
 HPR_economic_desc: "하르키우 영토에서 상실된 생산 시설의 복구를 시작할 것입니다"
 HPR_bronetank: "하르키우 장갑차 공장"
 HPR_bronetank_desc: "장갑차의 생산, 수리, 정비, 재장비, 현대화를 수행하는 장갑 산업 국영 기업입니다"
 HPR_avia_zavod: "하르키우 항공 공장"
 HPR_avia_zavod_desc: "하르키우 시의 항공기 제조 기업입니다. 여객기, 수송기, 군용기를 생산합니다"
 HPR_priborostroy: "하르키우 계기 제작 공장"
 HPR_priborostroy_desc: "군용 전자 장비와 가정용 전기 장비를 생산하던 소련 최대 규모의 공장 중 하나입니다."
 HPR_tractor: "하르키우 트랙터 공장"
 HPR_tractor_desc: "무한궤도식 및 차륜식 트랙터를 생산하는 기업입니다."
 HPR_agregat: "하르키우 아그레가트 설계국"
 HPR_agregat_desc: "항공 및 로켓 기술용 유압, 연료, 전기 계통의 장치를 개발하고 제조하는 군산복합체의 과학 생산 기업입니다."
 HPR_morozova: "하르키우 기계 설계국"
 HPR_morozova_desc: "장갑차를 개발하는 기업입니다. 과거 KP KKBM은 소련의 장갑 궤도 차량 개발에서 핵심적인 역할을 했습니다."
 HPR_specmachine: "하르키우 특수 기계 공장"
 HPR_specmachine_desc: "군산복합체의 국영 기업입니다."
 HPR_malichev: "말리셰프 공장"
 HPR_malichev_desc: "하르키우의 운송 기계 공장으로, 엔진, 기관차, 전차를 생산합니다."
 HPR_reborn_ser_and_molot: "\\"망치와 낫\\" 공장 재가동"
 HPR_reborn_ser_and_molot_desc: "하르키우의 대규모 농기계 기업으로, 하르키우 산업에서 가장 중요한 기업 중 하나였으며 러시아 제국과 소련에서 손꼽히는 대규모 농기계 기업 중 하나였습니다."
 HPR_concers: "하르키우 방위 콘체른"
 HPR_concers_desc: "우리의 모든 군수 산업 기업을 하나의 콘체른으로 통합할 것입니다. 이를 통해 생산 조율을 강화하고 생산성을 높일 것입니다."
 HPR_unproffesional_army: "비조직 민병대"
 HPR_proffesional_army: "인민 민병대"
 HPR_bivaluta: "이중 통화 시기"
 HPR_kubgaz_idea: "쿠반가스"
 HPR_ter_orobona: "영토방위대"
 HPR_forts_buildings: "요새 집중 건설"
 HPR_concern_sov: "하르키우 방위 콘체른"
 LPR_start: "인민공화국"
 LPR_focus: "루한스크 인민공화국 중점"
 LPR_start_desc: "이제 우리는 돌아갈 길이 없습니다. 우리는 독립을 위해 싸울 것입니다."
 LPR_vstavai_dombass: "일어나라 돈바스"
 LPR_vstavai_dombass_desc: "모든 광부, 교사, 군인 및 노동자. 우리는 모두 조국을 위해 싸울 것입니다!"
 LPR_reform_army: "군 개혁"
 LPR_reform_army_desc: "모든 전투 부대를 단일 구조로 편성할 필요가 있습니다."
 LPR_reforms_army: "군사 개혁 완료"
 LPR_reforms_army_desc: "우리의 인민 민병대는 조국을 방어할 준비가 되었습니다."
 LPR_bank: "루한스크 중앙은행"
 LPR_bank_desc: "우리의 은행 제도를 정비해야 합니다."
 LPR_propaganda_desc: "우리 봉기의 정당성을 사람들에게 납득시킬 때입니다."
 LPR_gos_granitca: "국경 강화"
 LPR_gos_granitca_desc: "적은 지나가지 못할 것입니다!"
 LPR_preemnik_dkpr: "우리는 도네츠크-크리보로그 공화국의 계승자"
 LPR_preemnik_dkpr_desc: "우리는 도네츠크와 기타 지역의 영토에 있던 이 국가 형태의 계승자임을 선언합니다. 어쩌면 이것이 앞으로 역할을 할지도 모릅니다."
 LPR_pasports: "루한스크 공화국 시민 여권"
 LPR_pasports_desc: "우리 시민은 여권을 가져야 합니다."
 LPR_war_economic: "전시 경제"
 LPR_war_economic_desc: "우리는 전시 경제 속에서 살아가야 할 것입니다."
 LPR_cheburashka: "다연장 로켓 체부라시카"
 LPR_cheburashka_desc: "우리 자체의 다연장 로켓 체계는 군에 훌륭한 보탬이 될 것입니다."
 LPR_resource_from_sov: "러시아의 도움"
