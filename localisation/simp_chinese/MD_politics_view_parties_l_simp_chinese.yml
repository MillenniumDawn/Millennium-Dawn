 EST.Nat_Populism3: "£EST_national_populism3 (VAP)  - 爱沙尼亚未来党"
 EST.Nat_Populism3_icon: "£EST_national_populism3"
 EST.Nat_Populism3_desc: "（保守民粹主义）- 爱沙尼亚未来党\n\n爱沙尼亚未来党融合了右翼自由主义和民粹主义思想，主张削减政党资金和商业支持，但对同性婚姻持中立态度，并批评欧盟的多元文化政策。"
 ARM.Western_Autocracy_alt: "£ARM_western_autocracy_alty (STPAP) - 萨松的勇敢者泛亚美尼亚党"
 ARM.Western_Autocracy_alt_icon: "£ARM_western_autocracy_alty"
 ARM.Western_Autocracy_alt_desc: "（民族保守主义） - 萨松的勇敢者泛亚美尼亚党\n\n萨松的勇敢者是一个右翼民族主义政党，由2016年占领埃里温警察局的武装团体老兵于2018年9月29日创立，其名称源自中世纪史诗《萨松的勇士》。该党主张与俄罗斯彻底决裂，加入西方安全机构，并建立一个包含阿尔察赫在内的统一亚美尼亚。\n\n在选举中，该党一直未能达到门槛，2018年得票率为1.82%，2021年为1.49%，是民族民主阵线的核心力量。其影响力主要来自街头动员和创始人的烈士形象，而非议会席位数量。"
 ARM.Western_Autocracy_alty: "£ARM_western_autocracy_alt (NDP) - 民族民主极点"
 ARM.Western_Autocracy_alty_icon: "£ARM_western_autocracy_alt"
 ARM.Western_Autocracy_alty_desc: "（亲西方民族主义） - 民族民主极点\n\n民族民主极点是一个亲西方的民族主义联盟，于2020年5月4日由萨松的勇敢者泛亚美尼亚党、民族进步党和一群独立政治家组成，民族自决联盟也是其支持者之一。该联盟要求退出集体安全条约组织和欧亚经济联盟，加入欧盟和北约，并与莫斯科彻底决裂。\n\n在2021年的选举中，该联盟仅获得1.49%的选票，未能赢得任何议席，此后一直保持着议会外势力的地位。其影响力主要体现在它是推动彻底西化的最有力组织力量，这使得它能够在议会之外主导这场辩论的走向。"
 ARM.conservatism_alt: "£ARM_western_conservative_alt (HER) - 传统党"
 ARM.conservatism_alt_icon: "£ARM_western_conservative_alt"
 ARM.conservatism_alt_desc: "（民族自由主义） - 传统党\n\n遗产党是一个民族自由主义政党，由拉菲·霍瓦尼相于2002年创立。霍瓦尼相是独立亚美尼亚的第一任外交部长，也是一位从美国侨民中归来的亚美尼亚人。该党将经济自由主义与对亚美尼亚历史的民族主义解读相结合，主张加入欧盟、承认阿尔察赫以及建立一个以法治为基础的国家。\n\n在选举中，该党在2007年赢得了7个席位，在2012年赢得了5个席位。在2013年的总统选举中，霍瓦尼相以36.8%的得票率击败了谢尔日·萨尔基相，但该党在2017年失去了所有席位。该党的影响力在于霍瓦尼相的个人追随者以及其在欧洲人民党中的观察员席位，这使得该党在西方获得了与其规模不相符的关注。"
 ARM.conservatism_alty: "£ARM_western_conservative_alty (PANA) - 泛亚美尼亚民族协议"
 ARM.conservatism_alty_icon: "£ARM_western_conservative_alty"
 ARM.conservatism_alty_desc: "（社会保守主义） - 泛亚美尼亚民族协议\n\n泛亚美尼亚民族协议是一个民族主义和社会保守派联盟，于2019年6月22日在阿瑟·巴巴扬领导下成立，成员包括哈伊克党 、基督教人民复兴党、恩杰德民族宗教党和社会正义党。它呼吁直接民主、废除总统职位、免费大学教育、遣返侨民以及阿尔扎赫与亚美尼亚的统一。\n\n在政治上，该联盟在2020年和2021年要求尼科尔·帕希尼扬辞职的街头抗议活动中与反对派站在一起，并反对他发起的宪法公投。由于该联盟在国民议会中没有席位，其影响力仅限于社会活动和联盟政治。"
 ARM.liberalism_alt: "£ARM_western_liberalism_alt (EPA) - 亚美尼亚欧洲党"
 ARM.liberalism_alt_icon: "£ARM_western_liberalism_alt"
 ARM.liberalism_alt_desc: "（民主社会主义） - 亚美尼亚欧洲党\n\n亚美尼亚欧洲党是一个自由主义的大西洋主义政党，由电影导演蒂格兰·赫兹马良于2018年11月6日天鹅绒革命后创立。该党主张立即与欧盟进行入盟谈判，退出欧亚经济联盟和集体安全条约组织，并最终加入北约，认为这是亚美尼亚安全的唯一保障。\n\n在选举中，该党仍然处于边缘地位，在2021年埃里温市议会选举中仅获得0.19%的选票，在2023年也仅获得1.11%的选票。该党的优势在于其议程设置能力，推动执政党走向其不愿公开承认的西方路线。"
 ARM.socialism_alt: "£ARM_western_socialism_alt (DWP) - 民主道路党"
 ARM.socialism_alt_icon: "£ARM_western_socialism_alt"
 ARM.socialism_alt_desc: "（社会民主主义） - 民主道路党\n\n民主道路党是一个亲西方的小规模社会民主党，由马努克·加斯帕良于2006年创立，现在由他的儿子、前议员曼努埃尔·加斯帕良领导。该党主张社会民主治理、建立2008年3月1日遇难者纪念碑和自由选举，并且多年来一直是亚美尼亚国民大会反对派联盟的成员。\n\n该党在2007年和2012年的选举中分别获得1.05%和0.36%的选票，并因2021年选举舞弊而抵制了该届选举。其影响力仅限于反对派声明和联合执政，而非议会席位。"
 ARM.socialism_alty: "£ARM_western_socialism_alt (BA) - 光明亚美尼亚党"
 ARM.socialism_alty_icon: "£ARM_western_socialism_alt"
 ARM.socialism_alty_desc: "（自由主义） - 光明亚美尼亚党\n\n光明亚美尼亚党是一个亲欧的自由主义政党，由埃德蒙·马鲁基扬于2015年12月12日创立，是欧洲自由民主联盟的成员。该党倡导欧洲一体化、司法改革和基于规则的经济，同时坚持只要亚美尼亚的利益不被出卖，就应继续与俄罗斯合作。\n\n在选举方面，该党于2017年通过“出路联盟”进入议会，并在2018年成为第三大党，拥有18个席位，之后跌至1.22%，并在2021年失去所有席位。该党现在的影响力主要依靠马鲁基扬作为前反对派领导人的形象以及其与欧洲自由民主联盟的联系。"
 ARM.Conservative_alt: "£ARM_Conservative_alt (RPA) - 亚美尼亚共和党 (§7新兴主义t§!派)"
 ARM.Conservative_alt_icon: "£ARM_Conservative_alt"
 ARM.Conservative_alt_desc: "（民族保守主义） - 亚美尼亚共和党新兴主义派\n\n亚美尼亚共和党由阿肖特·纳瓦萨尔迪扬于1990年4月2日创立，其意识形态源于加列金·恩杰德的“民族宗教”。该党于1999年至2018年间执政，先后由安德拉尼克·马尔加良和谢尔日·萨尔基相领导。其执政派系抛弃了建党信条，成为典型的后苏联时代权力政党，成员包括高级官员、公务员和商人，他们的财富都依赖于与国家的关系。\n\n在政府中，该党在2007年拥有64个席位，2012年拥有69个席位，2017年拥有58个席位，但在2018年的“天鹅绒革命”中，其得票率仅为4.7%。该党剩余的影响力来自于其在执政二十年间建立的人脉网络，这些网络在2021年通过“我有荣誉联盟”重新赢得了四个席位。"
 ARM.Autocracy_alt: "£ARM_autocracy_alt (HAP) - 亚美尼亚祖国党"
 ARM.Autocracy_alt_icon: "£ARM_autocracy_alt"
 ARM.Autocracy_alt_desc: "（亲俄民族主义） - 亚美尼亚祖国党\n\n亚美尼亚祖国党是一个民族主义亲俄政党，于2005年首次注册，2016年被取缔，2018年天鹅绒革命后在阿尔塔克·加尔斯蒂安的领导下重新成立。该党支持加强军队建设、维护亚美尼亚和阿尔察赫的领土完整、将仇恨言论定为犯罪，并支持俄罗斯边防部队继续驻扎。\n\n该党在2021年选举中仅获得1.03%的选票，未赢得任何席位，并声称选举结果存在舞弊。其影响力仅限于亲俄抗议阵营，在该阵营中，它与其他更大的政治集团争夺同一批选民。"
 ARM.Neutral_Autocracy_alt: "£ARM_neutral_autocracy_alt (UH) - 祖国力量党"
 ARM.Neutral_Autocracy_alt_icon: "£ARM_neutral_autocracy_alt"
 ARM.Neutral_Autocracy_alt_desc: "（亚美尼亚民族主义） - 祖国力量党\n\n“祖国力量”党是一个民族主义政党，由商人、前议员蒂格兰·阿尔扎坎茨扬于2022年4月3日创立。他承诺将国内外的爱国者团结起来，共同维护亚美尼亚和阿尔察赫的安全。该党的竞选纲领包括打击腐败、保障边境安全、促进经济发展和建设现代化军队。\n\n在选举方面，该党在2023年埃里温市议会选举中仅获得0.74%的选票，没有赢得任何席位。其影响力主要依赖于阿尔扎坎茨扬的财力以及战后有利于承诺增强军事实力的政党的社会氛围。"
 ARM.Neutral_conservatism_alt: "£ARM_neutral_conservative_alt (NAP) - 国家议程党"
 ARM.Neutral_conservatism_alt_icon: "£ARM_neutral_conservative_alt"
 ARM.Neutral_conservatism_alt_desc: "（民族保守主义） - 国家议程党\n\n民族议程党是一个中间偏右的政党，由前麦肯锡合伙人阿维蒂克·查拉比扬于2018年12月24日与外交官、商人和遣返活动人士共同创立。该党以“民族国家、健康的公众和具有竞争力的经济”为竞选口号，支持阿尔察赫与亚美尼亚的统一、增加军费预算、发展农村以及让更多女性参政。\n\n在政治上，该党在2020年和2021年加入了反对尼科尔·帕希尼扬的祖国救国运动，之后又回归独立反对派。由于该党在2021年仅获得0.06%的选票，其影响力仅限于专家评论和海外侨民网络。"
 ARM.oligarchism_icon: "£ARM_oligarch"
 ARM.Neutral_Libertarian_icon: "£ARM_Neutral_Libertarian"
 ARM.Neutral_Libertarian_alt: "£ARM_neutral_libertarian_alt (CC) - 公民契约党"
 ARM.Neutral_Libertarian_alt_icon: "£ARM_neutral_libertarian_alt"
 ARM.Neutral_Libertarian_alt_desc: "（自由民粹主义） - 公民契约党\n\n公民契约党是尼科尔·帕希尼扬的政党，于2013年12月作为公民运动成立，并于2015年5月30日注册为政党，在2018年的天鹅绒革命中夺取政权。该党除了改革、反腐败和人民主权之外，没有固定的教条，将自由民主与直接诉诸街头的民粹主义风格相结合。\n\n在执政期间，该党在2018年赢得82个席位，2021年赢得71个席位，2026年赢得64个席位，2024年冻结了亚美尼亚加入集体安全条约组织的资格，2025年启动了正式的欧盟入盟程序。该党的优势在于帕希尼扬的个人授权，这一授权在战败和失去阿尔察赫后依然有效。"
 ARM.Neutral_green_alt: "£ARM_neutral_green_alt (CD) - 公民的决定"
 ARM.Neutral_green_alt_icon: "£ARM_neutral_green_alt"
 ARM.Neutral_green_alt_desc: "（社会民主主义） - 公民的决定\n\n公民的决定是一个社会民主主义和环保主义政党，由“天鹅绒革命”的左翼活动人士于2018年11月3日创立，戈尔·哈科比扬担任书记。该党主张建立以财富再分配为基础的福利国家，推行全民医疗保健、免费教育、性别平等、工会权利和直接民主，同时支持阿尔察赫的自决权，并要求与俄罗斯重新谈判相关协议。\n\n该党在2018年和2021年的选举中分别获得0.68%和0.30%的选票，并在迪利然市议会拥有两个席位。其优势在于青年积极分子以及作为亚美尼亚政坛最鲜明的绿色左翼声音。"
 ARM.neutral_Social_alt: "£ARM_neutral_social_alt (SDHP) - 社会民主号角党"
 ARM.neutral_Social_alt_icon: "£ARM_neutral_social_alt"
 ARM.neutral_Social_alt_desc: "(社会民主主义) - 社会民主号角党\n\n社会民主党亨恰克党是亚美尼亚历史最悠久的政党，由阿维蒂斯·纳扎尔别基安、玛丽亚姆·瓦尔达尼安和一群学生于1887年8月在日内瓦创立，也是第一个在奥斯曼帝国和波斯开展活动的社会主义政党。该党将社会民主主义与亚美尼亚民族主义相结合，倡导免费教育和医疗保健、加入欧盟、减少对俄罗斯的依赖以及阿尔察赫与亚美尼亚的统一。\n\n在亚美尼亚，该党于2021年以亚美尼亚民主党候选人的身份参选，仅获得0.39%的选票，未获得任何席位，而其成员曾参与早期的纳戈尔诺-卡拉巴赫战争。该党的影响力主要来自海外侨民，尤其是在黎巴嫩，在那里它仍然是一支活跃的政治力量。"
 ARM.Nat_Populism_icon: "£ARM_Conservative_alt"
 ARM.Nat_Populism_alt: "£ARM_national_populist (AEUA) - 亚美尼亚雄鹰统一亚美尼亚党"
 ARM.Nat_Populism_alt_icon: "£ARM_national_populist"
 ARM.Nat_Populism_alt_desc: "(亚美尼亚民族主义) - 亚美尼亚雄鹰统一亚美尼亚党\n\n亚美尼亚雄鹰统一亚美尼亚党是一个民族主义、亲俄政党，由哈奇克·阿斯里扬于2018年6月23日在天鹅绒革命后创立。该党主张统一亚美尼亚，支持亚美尼亚使徒教会，持疑欧立场，并主张与俄罗斯建立伙伴关系，将其包装成忠诚的基督教兄弟之间的关系。\n\n在政治上，该党于6月7日宣布退出2021年大选，并表示在亚美尼亚的安全和领土完整得到恢复之前，将抵制选举。由于该党没有议席，其影响力仅限于民族主义民众和亲俄抗议阵营。"
 ARM.Nat_Populism_alty: "£ARM_national_populist (PVP) - 公众之声党"
 ARM.Nat_Populism_alty_icon: "£ARM_national_populist"
 ARM.Nat_Populism_alty_desc: "(亚美尼亚民族主义) - 公众之声党\n\n公众之声党成立于2022年8月6日，由久姆里前市长瓦尔丹·古卡相创立，在古卡相于2024年1月被驱逐后，现任主席为阿尔塔克·加尔斯蒂扬。该党的竞选纲领包括：将阿尔察赫与亚美尼亚统一、保障安全、反腐败、维护社会正义、进行选举改革以及保障少数民族的权利。\n\n在选举方面，该党在2023年埃里温市议会选举中取得突破，获得9.68%的选票，赢得65个席位中的7席，但同年针对其领导层的刑事调查也随之展开。该党的优势在于其在市政选举中的立足点，以及吸引那些对政府和旧精英阶层都感到​​失望的选民的民粹主义风格。"
 ARM.Nat_Autocracy_alt: "£ARM_military_junta_alt (AFA) - 亚美尼亚武装部队"
 ARM.Nat_Autocracy_alt_icon: "£ARM_military_junta_alt"
 ARM.Nat_Autocracy_alt_desc: "(军政府) - 亚美尼亚武装部队\n\n亚美尼亚武装部队作为执政集团，代表着由总参谋部领导的政府，而该国自独立以来一直处于战争或封锁状态。这支部队于1992年1月28日由卡拉巴赫志愿部队和前苏联第七近卫集团军组建而成，陆军、空军和防空部队现役人员约55000人，实行18个月的义务兵役制，并得到俄罗斯驻久姆里第102空军基地的支持。\n\n实际上，军人统治意味着军官掌控各部委，动员凌驾于经济之上，阿尔察赫及其边境的安全被视为唯一的政治问题。它的优势在于能够威慑阿塞拜疆和土耳其，其风险在于国家将只对其指挥官负责。"
 ARM.Nat_Autocracy_alty: "£ARM_military_junta_alty (5165) - 民族保守运动党"
 ARM.Nat_Autocracy_alty_icon: "£ARM_military_junta_alty"
 ARM.Nat_Autocracy_alty_desc: "(民族保守主义) - 5165民族保守运动\n\n5165民族保守运动是一个民族主义政党，由卡琳·托诺扬于2021年4月22日创立，党名取自亚拉腊山的高度（以米为单位），其竞选口号是“为了亚美尼亚人和亚美尼亚”。该党优先考虑国家安全、加强军队建设、医疗改革、侨民遣返以及阿尔察赫独立，并特别强调让军属参与政治。\n\n该党在2021年选举中仅获得1.22%的选票，且未赢得任何席位。其优势在于对2020年战争退伍军人和阵亡将士家属的吸引力，而这正是老牌政党难以触及的选民群体。"
 ARM.Monarchist_alt: "£ARM_monarchist_alt HOB) - 巴格拉图尼王室"
 ARM.Monarchist_alt_icon: "£ARM_monarchist_alt"
 ARM.Monarchist_alt_desc: "(民族君主主义) - 巴格拉图尼王室\n\n巴格拉图尼王朝于公元885年至1045年统治中世纪的亚美尼亚王国，从古代的附庸国崛起，在阿拉伯统治下成为亚美尼亚最杰出的贵族家族，之后在阿尼建立了独立的王国。该王朝亚美尼亚分支没有公认的继承人，现代的继承权主张寄托在罗兰·冯·巴格拉图尼身上，他自称是波兰和匈牙利侨民的后裔，后来回到家乡领导君主主义运动。\n\n在巴格拉图尼王冠复辟后，这个国家将建立在本土王朝和亚美尼亚民族主义之上，而非任何外国王室。它的优势在于其国名，承载着最后一个本土王国的记忆；而它的弱点在于其血统无人能够考证。"
 ARM.Monarchist_alty: "£ARM_monarchist_altr (HOS) - 萨伏依王室"
 ARM.Monarchist_alty_icon: "£ARM_monarchist_altr"
 ARM.Monarchist_alty_desc: "(民族君主主义) - 萨伏依王室\n\n萨伏依王朝通过塞浦路斯的卢西尼昂国王继承了亚美尼亚国王的头衔。1396年，西里西亚的列翁五世将王位传给了卢西尼昂国王，而卢西尼昂国王的最后一位王后夏洛特于1485年将王位让给了萨伏依的查理一世。该王朝一直拥有亚美尼亚、塞浦路斯和耶路撒冷的王位，直到1946年意大利君主制覆灭。如今，它作为流亡的意大利前王室家族而存在。\n\n如果萨伏依王朝复辟，亚美尼亚将由一个外国天主教王朝统治，该王朝的统治权并非基于民族认同，而是法律上的，并受到卢西尼昂王朝幸存后裔的挑战。其优势在于与欧洲王室的联系以及与意大利王室联合的前景，而劣势则在于其在亚美尼亚本土缺乏根基。"
 ARM.Monarchist_altr: "£ARM_monarchist_alty (AAO) - 亚美尼亚-雅利安秩序"
 ARM.Monarchist_altr_icon: "£ARM_monarchist_alty"
 ARM.Monarchist_altr_desc: "(赫坦主义极端民族主义) - 亚美尼亚-雅利安秩序\n\n亚美尼亚-雅利安秩序是由阿尔缅·阿维季相领导的极端民族主义和新异教运动，总部位于阿博维扬。该教团于2009年从阿里之子教团分裂出来，此前阿维季相自封为精神领袖，并宣布在埃里温建立一座中央神庙。该教团寻求恢复大亚美尼亚作为雅利安民族的家园，并将赫坦教奉为国教。\n\n2005年，埃里温一家法院以煽动敌对情绪为由，判处阿维季相三年缓刑。此前，他曾向一家报纸表示，犹太人和雅兹迪人社群危及国家安全。尽管该党在选举中的影响力微乎其微，但它标志着民族主义光谱的极端边缘。"
 FIN.Western_Autocracy: "£FIN_Western_Autocracy_small (Liik.) - 立刻行动"
 FIN.Western_Autocracy_icon: "£FIN_Western_Autocracy_small"
 FIN.Western_Autocracy_desc: "（自由保守主义） - 立刻行动\n\n立刻行动党是由商人哈里·哈基莫创立的政党。哈基莫是民族联合党最受欢迎的候选人之一，但因未能获得该党部长职位而感到沮丧。该党成立后，迅速聚集了众多名人和知名商人，如记者托马斯·恩布什、房地产大亨杰思罗·罗斯泰特和夜总会老板塞杜·科斯金。除了通过直接民主和电子民主实现政治进程的现代化之外，该党没有明确的政纲。一些人将该党描述为哈基莫商人形象的自恋延伸。"
 FIN.Autocracy: "£FIN_Autocracy_small (VKK) - 权力属于人民"
 FIN.Autocracy_icon: "£FIN_Autocracy_small"
 FIN.Autocracy_desc: "（国家保守主义） - 权力属于人民\n\n权力属于人民党由许多持欧洲怀疑论和亲俄立场的政客组成。该党支持强硬派基督教、自给自足和直接民主。该党领导人希望俄罗斯入侵芬兰，这样他们就能帮助芬兰共产党夺取政权。"
 FIN.Neutral_Autocracy: "£FIN_Neutral_Autocracy_small (LLP) - 自然法党"
 FIN.Neutral_Autocracy_icon: "£FIN_Neutral_Autocracy_small"
 FIN.Neutral_Autocracy_desc: "（超然冥想） - 自然法党\n\n自然法党是由玛赫西·马赫什·优济的追随者创立的，目的是在芬兰政治中推广超然冥想。该党在1999年大选中最大的卖点是所谓的“瑜伽飞行”，它可以消除国家层面的压力。该党还提倡脉搏冥想，用指南针指引社区方向，并培训长期失业的人成为瑜伽飞行者，充当压力清洗机。该运动的全球领袖玛赫西·马赫什表示，他希望建立一个基于君主制的新世界政府。"
 FIN.oligarchism: "£FIN_oligarchism_small (RKP) - 瑞典族人民党"
 FIN.oligarchism_icon: "£FIN_oligarchism_small"
 FIN.oligarchism_desc: "（瑞典人权利、社会自由主义） - 瑞典族人民党\n\n瑞典族人民党是芬兰的一个小型社会自由党，旨在保护瑞典人的权利。尽管规模很小，但该党是芬兰政治的“造王者”，自1979年以来一直是每届政府的一部分。由于该党主要关注与瑞典人口有关的问题，因此其社会和经济政策灵活，因为其成员来自不同的背景。该党有时因受到大型投资者的严重影响而受到批评，这些投资者是该党的捐助者和影响者。"
 FIN.neutral_Social: "£FIN_neutral_Social_small (Vas.) - 左翼联盟"
 FIN.neutral_Social_icon: "£FIN_neutral_Social_small"
 FIN.neutral_Social_desc: "（民主社会主义）- 左翼联盟\n\n左翼联盟是芬兰政坛中一个相对较新的政党，由芬兰人民民主联盟和芬兰共产党于1990年成立，旨在弥合芬兰左翼政党之间的分歧。该党反对全球资本主义，希望用更可持续、更团结的替代方案取而代之。该党的党纲中还包括许多环保和女权主义政策。"
 FIN.Nat_Autocracy: "£FIN_Nat_Autocracy_small (PV) - 芬兰国防军"
 FIN.Nat_Autocracy_icon: "£FIN_Nat_Autocracy_small"
 FIN.Nat_Autocracy_desc: "（军政府） - 芬兰国防军\n\n芬兰国防军是负责保卫芬兰的主要机构。除了国防职责外，他们还负责在需要时为其他救援服务（如警察和消防部门）提供支持。芬兰国防军只有一支小型常备军（约20,000名士兵），军队主要围绕一支非常庞大的预备役部队组建。"
