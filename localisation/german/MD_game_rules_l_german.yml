 RULE_HARD_AI_ECONOMIC: "Wirtschafts-KI"
 RULE_DISABLE_HARD_AI_ECONOMIC: "Standardbeschränkung"
 RULE_DISABLE_HARD_AI_ECONOMIC_DESC: "Eine Standardeinschränkung der KI, welche ihr nicht erlaubt ihre Wirtschaft zu stärken. Für ein historisch korrektes Spiel"
 RULE_ENABLE_HARD_AI_ECONOMIC: "Keine Einschränkungen"
 RULE_ENABLE_HARD_AI_ECONOMIC_DESC: "Wenn du es leid bist, dass in jedem Spiel die KI nicht aus der Wirtschaftskrise herauskommt – das hier ist für dich. Die KI ist nicht länger in Entscheidungen über ihre Wirtschaft begrenzt. Sei darauf vorbereitet, dass viele Länder reicher werden als deines. Nur für diejenigen, die sich einer Herausforderung stellen wollen. Grüße von der \"Battle-KI\" ;)"
 RULE_AI_STARTING_POLITICAL_POWER: "Politische Macht der KI zu Beginn"
