l_korean:
 ITA_territorial_claims: "영유권 주장"
 ITA_territorial_claims_desc: "우리 과거의 정복 유산은 알프스 산맥과 지중해 너머 멀리까지 퍼져 있습니다. 우리는 이 영광을 되찾기 위해 분투할 것입니다!"
 ITA_normalize_extraordinary_bonuses: "특별 보너스 정상화"
 ITA_normalize_extraordinary_bonuses_desc: "많은 \"일회성\" 또는 \"특별\" 보너스가 표준 또는 반복이 되었으며, 목표는 동일하지만 이전 보너스의 이름이 다른 수많은 새로운 보너스가 지속적으로 발생합니다. 이 관행은 납세자의 돈을 활용하는 매우 효율적인 방법은 아니지만 상당한 인기 상승을 제공합니다."
 ITA_eastern_sympathies: "동양을 바라보라"
 ITA_eastern_sympathies_desc: "동양의 세계가 미래입니다."
 ITA_unaligned_empire: "우리 스스로"
 ITA_unaligned_empire_desc: "이탈리아인들은 종종 이런 말을 하곤 합니다:\n\n\"같이 망할바엔 혼자 있는게 낫다\"\n(Meglio soli che male accompagnati)"
 ITA_western_alignment: "서방과 함께"
 ITA_western_alignment_desc: "첫 번째 세계가, 최고의 세계입니다."
 ITA_new_land_nobility: "라피운디움은 내 길이다"
 ITA_new_land_nobility_desc: "Nobles managed these territories since the dawn of man, they will continue to do so."
 ITA_new_industrial_nobility: "귀족들의 산업 인수"
 ITA_new_industrial_nobility_desc: "피는 절대 속일 수 없습니다. 귀족들이 우리 산업을 이끌 것입니다."
 ITA_secure_the_succession: "승계권 보호"
 ITA_secure_the_succession_desc: "건강한 아이가 죽으면 왕의 자리를 대신할 준비가 되어 병원에 있습니다. 그의 왕위 계승권을 보장하기 위한 법적 틀을 강화하겠습니다. 승계가 확보되었습니다!"
 ITA_war_economy: "전시 경제"
 ITA_war_economy_desc: "Can you hear the soldiers marching? The roar of the engines of the bombers? Can you see that tank column? War is coming."
 ITA_empower_the_senate: "상원의 권한 확대"
 ITA_empower_the_senate_desc: "Senatus Popvlvsque Romanus will lead our country once again."
 ITA_empower_the_emperor: "황제의 권한 확대"
 ITA_empower_the_emperor_desc: "황제는 제국을 통치하고 우리의 의로운 땅을 회복할 것입니다."
 ITA_recognize_free_market_efficiency: "자유 시장 경제의 효율성 인정"
 ITA_recognize_free_market_efficiency_desc: "자유 시장은 세계 대부분의 국가에서 채택되었으며 빠르게 성장할 수 있는 최선의 방법임이 입증되었습니다. 우리의 새로운 국가는 스스로 빠르게 발전해야 합니다."
 ITA_corporativism: "협동조합주의"
 ITA_corporativism_desc: "Mussolini said of this ideology: \"Everything for the state, nothing outside the state, nothing against the state.\" Each class must work together under an authoritarian rule that enforces peace between corporations."
 ITA_military_industrial_complex: "군수산업"
 ITA_military_industrial_complex_desc: "우리나라는 우리의 위대함을 가로막는 그 누구와도 싸울 준비가 되어 있어야 합니다. 그리고 이번에는 총검을 사용하지 않을 것입니다."
 ITA_crush_third_rome: "제3의 로마 짓밟기"
 ITA_crush_third_rome_desc: "Back in the Tsarist era, the Russians thought they were the successors of the Empire because one niece of the last Byzantine Emperor married a Tsar. Well, they will learn there is only one Rome."
 ITA_reopen_brothels: "매춘 합법화"
 ITA_reopen_brothels_desc: "가난한 여성을 일부 범죄자가 착취하도록 놔두는 것은 모든 도덕에 어긋납니다. 매춘부가 되는 것은 다른 모든 직업과 마찬가지로 보장되는 직업이어야 합니다."
 ITA_legalize_all_drugs: "모든 마약의 합법화"
 ITA_legalize_all_drugs_desc: "Legalizing drugs will make it more difficult for the §RMafia§! to sell them. If we sell alcohol, cigarettes and allow people into casinò, why shouldn't we let people try some morphine?"
 ITA_protect_our_traditions: "우리의 전통 보호"
 ITA_protect_our_traditions_desc: "Our values are \"Dio, Patria e Famiglia\". We won't allow the lefties to destroy our country or make it a Muslim chapel."
 ITA_repeal_former_government_measures_9: "국왕 폐위"
 ITA_repeal_former_government_measures_9_desc: "절대 왕정은 과거의 유물에 지나지 않으며, 최근 사보이아가의 통치는 우리에게 그 이유를 상기시켜주었습니다. 이제 이탈리아의 국민들이 일어설 때이며 우린 공화국을 복원할 것입니다."
 ITA_repeal_former_government_measures_8: "황제 폐위"
 ITA_repeal_former_government_measures_8_desc: "절대 왕정은 과거의 유물에 지나지 않으며, 최근 황제가 다스린 국가의 상태는 우리가 이 사실을 다시금 확신할 수 있게 해주었습니다. 이제 이탈리아의 국민들이 일어설 때이며 우린 공화국을 복원할 것입니다."
 ITA_repeal_former_government_measures_7: "정권 전복"
 ITA_repeal_former_government_measures_7_desc: "한때 모든 이탈리아인들의 마음속에 불을 지펴 새로운 권력을 집권시키는데 큰 역할을 했던 파시즘의 향수는 검은 셔츠단의 잔혹한 행위로 인해 빠른 속도로 완전히 사라져버렸습니다. 이제 이탈리아판 '뉘른베르크 국제군사재판 (Nuremberg process)'을 진행할 시간입니다."
 ITA_repeal_former_government_measures_6: "의회 재구성"
 ITA_repeal_former_government_measures_6_desc: "Although a democratic facade, the Senate is just an expression of Italy's wealthy elites. Italians have realized this and have decided that it is time to restore true democracy."
 ITA_ban_nuclear_power: "핵 무장 금지"
 ITA_ban_nuclear_power_desc: "Italians voted to abolish any form of nuclear energy during the 1987 referendum and this is still their will."
 ITA_encourage_renewables: "재생 가능 에너지 장려"
 ITA_encourage_renewables_desc: "This is the 21st century; shut down the thermal power stations. We have wind, sun, and water. Nothing else is needed."
 ITA_happy_degrowth: "행복한 후퇴"
 ITA_happy_degrowth_desc: "Our economic system can't aim to keep growing forever. Our focus on profit is bringing destruction to our planet and must be stopped. Producing less, consuming less and recycling more is the way."
 ITA_ban_gmos: "유전자 변형 식품 (GMO) 금지"
 ITA_ban_gmos_desc: "우리는 인공 식품을 금지하고 자연에서 비롯된 건강한 음식을 재배해야합니다."
 ITA_tax_the_rich: "부자들에게 세금을 부과하라!"
 ITA_tax_the_rich_desc: "상류층의 부를 이용하여 불우한 이들에게 고르게 분배하기 위해선 부자들에게 복지세를 적용할 필요가 있습니다."
 ITA_raise_minimum_wage: "최저임금 인상"
 ITA_raise_minimum_wage_desc: "보편적인 최저임금은 노동조합의 단체협약의 적용을 받지 못하는 노동자들을 위해 꼭 필요합니다."
 ITA_protect_migrant_rights: "이민자들의 권리를 보호하라"
 ITA_protect_migrant_rights_desc: "이탈리아인들은 과거에도 오랜 기간 동안 이민자였으며 지금도 그렇습니다. 안전하고 편안한 삶을 살 기회가 충분하지 않기 때문에 다른 나라로 가는 것이 어떤 느낌인지 알아야 합니다... 이 사람들을 돕고 포퓰리즘 선전이 이러한 기억을 지우는 것을 허용하지 마십시오."
 ITA_communism_resurgence: "공산주의에 대한 불안"
 ITA_communism_resurgence_desc: "이탈리아 공산당은 냉전 기간 동안 서구 공산당 중 가장 큰 정당이었습니다. 동지들이여, 이제 다시 일어서야 할 때입니다. 자본주의를 파괴할 때입니다!"
 ITA_non_aligned_communism: "공산주의재건당 (PRC)"
 ITA_non_aligned_communism_desc: "공산재건당은 마르크스주의, 생태사회주의, 반스탈린주의 정당이다. 당은 자동화, 모든 노동자의 권리, 상호주의를 위해 노력합니다."
 ITA_align_to_the_east: "이탈리아 공산당"
 ITA_align_to_the_east_desc: "마르크스-레닌주의 정당으로, 새로운 레닌주의 신 경제 계획(NEP)을 추진하고 있습니다."
 ITA_nationalize_companies: "기업 국유화"
 ITA_nationalize_companies_desc: "노동자가 기업을 관리할 겁니다. 우리에게 주인은 필요치 않습니다!"
 ITA_nationalize_companies_2: "기업 국유화"
 ITA_nationalize_companies_2_desc: "노동자들이 회사를 관리할 것이고 우리에게는 주인이 필요하지 않습니다!"
 ITA_widespread_expropriation: "광범위한 수용"
 ITA_widespread_expropriation_desc: "“능력에 따라 내고, 필요에 따라 받는 것”은 단순한 구호에 그치지 않습니다."
 ITA_redistribution: "부의 재분배"
 ITA_redistribution_desc: "소수 부자들의 이익을 위하여 다수가 고통 받는 것은 정당화될 수 없습니다. 사람들은 저마다 각자의 몫을 얻게 될 것입니다."
 ITA_plan_industrial_development: "산업 발전 계획"
 ITA_plan_industrial_development_desc: "우리는 국영 기업, 협동조합 및 노동자 소유 기업을 통해 우리 나라를 발전시켜 나갈 것입니다."
 ITA_plan_industrial_development_2: "산업 발전 계획"
 ITA_plan_industrial_development_2_desc: "우리는 국영 기업, 협동조합 및 노동자 소유 기업을 통해 우리 나라를 발전시켜 나갈 것입니다."
 ITA_abolish_capitalist_media: "자본주의 선전 폐지"
 ITA_abolish_capitalist_media_desc: "기존 미디어는 단지 이윤을 추구하고 소유주의 이익을 위해 움직이는 기업일 뿐입니다. 우리는 노동자들이 소유하는 새로운 미디어를 만들 것입니다."
 ITA_silence_defeatists: "패배주의자를 침묵시켜라"
 ITA_silence_defeatists_desc: "새로운 헌법을 받아들이기를 거부하는 사람들은 제대로 된 재교육을 받아야 합니다..."
 ITA_silence_defeatists_2: "패배주의자를 침묵시켜라"
 ITA_silence_defeatists_2_desc: "새로운 헌법을 받아들이기를 거부하는 사람들은 제대로 된 재교육을 받아야 합니다..."
 ITA_safeguard_the_revolution: "혁명 수호"
 ITA_safeguard_the_revolution_desc: "새로운 헌법을 제정하는 것만으로는 충분하지 않았습니다. 이제 프롤레타리아 독재를 수립할 때입니다."
 ITA_libertarians: "급진당"
 ITA_libertarians_desc: "급진당은 반교권주의의, 시민 자유지상주의, 자유주의, 급진주의와 환경주의의 보루였습니다. 보니노 리스트는 이 위대한 정당의 정당한 후계자이며 이탈리아 정치권에 대한 가장 강력한 야당으로 스스로를 제시했습니다. 급진주의자들은 비폭력과 민권운동, 대마의 합법화, 동성애자 권리, 수감자들의 인간조건 향상과 원자력 완전 폐지로 잘 알려져 있습니다. 국제적으로 당은 인권과 자기결정권을 지지합니다."
 ITA_liberals: "자유주의 연방"
 ITA_liberals_desc: "이 이념은 친유럽 중도 정당의 기치 아래 다양한 사상을 하나로 묶어내며, 특히 진보주의 성향의 가톨릭 신자들 사이에서 강력한 지지를 받고 있습니다. 이 정당은 사회 보수주의자, 사회 진보주의자, 경제 자유주의자, 사회민주주의자들을 아우르고 있습니다."
 ITA_centre_right: "포르자 이탈리아"
 ITA_centre_right_desc: "이 정당은 사회의 전통적인 관점과 경제적 자유주의를 합친 이념을 지지합니다. 포르차 이탈리아는 유럽 인민당 그룹 (EPP) 소속 정당이며 자신을 '자유'와 '개인주의 중심 이념'의 수호자를 자처합니다."
 ITA_centre_left: "올리브나무"
 ITA_centre_left_desc: "사회민주주의 세력과 기독교 좌파의 연합으로, 이탈리아 기독교민주당(DC)과 이탈리아 공산당(PCI) 출신 인사들이 창당한 정당들을 기반으로 탄생했습니다. 올리브 나무는 5년마다 예비선거를 실시하는데, 등록된 당원뿐만 아니라 모든 이탈리아 국민이 참여할 수 있으며, 당 내의 다양한 파벌들이 자유롭게 경쟁할 수 있습니다. 이로 인해 당내 파벌 간 갈등이 발생하고, 이는 이념적 혼란과 잦은 당 분열을 초래합니다."
 ITA_right_wing_populism: "국민동맹"
 ITA_right_wing_populism_desc: "국민동맹은 1995년 이탈리아 사회운동이 삼색불꽃과 국민동맹의 두 부문으로 분리될 때 창당되었으며, 후자가 더 온건한 분파였습니다. 그 주요 신념은 \\"사회적 우파\\" 이념에 바탕을 두고 있는데, 전통주의적이고 반세계화적인 사회관을 가진 우익 정당이면서 복지 국가와 정부의 경제 개입을 지지합니다."
 ITA_left_wing_populism: "오성운동"
 ITA_left_wing_populism_desc: "M5S는 포퓰리즘, 반 기득권층, 환경주의, 반이민, 반세계주의, 유럽 회의주의자로 여겨집니다. 이 정당은 보통 좌파가 옹호하는 정책을 추진함에도 불구하고 반이민적인 입장으로 인해 일부 사람들은 우파로 묘사되기도 합니다. 국제적으로 주요 동맹은 중국입니다. 이 정당은 기득권층과 부패에 대응하기 위해 코미디언에 의해 만들어졌지만 기득권층과의 협력을 받아들이는 것으로 입증되었습니다."
 ITA_greens: "녹색 이탈리아"
 ITA_greens_desc: "Historically the Greens never had much success in Italy. Their green, eco-socialist views are resisted by the conservative Italian population. Can we build a better future? Thunberg said: 'The eyes of all future generations are upon you. And if you choose to fail us, I say - we will never forgive you.'"
 ITA_leu: "Free and Equal"
 ITA_leu_desc: "The wealth of the 5% richest Italians (holder of 41% of the national net wealth) is higher than all the wealth held by the poorest 80%. We will push for the redistribution of wealth inside our country, fight illegal work, and raise the minimum wage for the jobs that are not unionized."
 ITA_protect_foreign_investment: "해외 투자 보호"
 ITA_protect_foreign_investment_desc: "이제 외국인들이 이탈리아 남부에 투자할 이유가 있는 환경을 조성했으니, 그들의 자금이 §R마피아§!에게 가로채이지 않도록 해야 합니다."
 ITA_greater_padania: "대 파다니아"
 ITA_greater_padania_desc: "이탈리아 남부는 구제할 수 없는 것으로 드러났지만, 중부 이탈리아에 사는 이들에 대해서는 그렇게 말할 수 없습니다. 우리의 새로운 국가는 그들이 로마의 수도 지위를 포기하는 것을 받아들이는 한 그들을 기꺼이 받아들입니다."
 ITA_roma_ladrona: "도둑맞은 로마 (로마 라드로나)"
 ITA_roma_ladrona_desc: "수년간 우리는 이탈리아 남부만이 우리의 발목을 잡는 지역이 아님을 목격했습니다. 로마의 부패와 터무니없는 규제는 나머지 남부 지역의 끊임없는 자금 요구만큼이나 해로웠으며, 이제 이 짐들을 떨쳐낼 때입니다."
 ITA_dismantle_the_nation: "국가 해체"
 ITA_dismantle_the_nation_desc: "북부와 남부의 분열은 돌이킬 수 없는 수준입니다. 북부인들은 더 이상 남부의 비효율을 감당하는 부담을 받아들이지 않을 것입니다."
 ITA_italian_federation: "이탈리아 연방"
 ITA_italian_federation_desc: "분리주의 운동의 더 온건한 분파를 활용하면, 자치도를 높여 북부에서 남부로의 자원 유출을 막음으로써 국가의 일체성을 지킬 수 있을 것입니다."
 ITA_dissatisfaction_in_the_north: "북쪽의 불만"
 ITA_dissatisfaction_in_the_north_desc: "북부 지역에서 남부 지역으로 흘러가는 세금을 더욱 늘린 것이 북부인들의 인내심에 결정적인 계기가 되었습니다. 분리주의 운동의 세력이 크게 성장했습니다."
 ITA_building_amnesty: "건물에 대한 사면"
 ITA_building_amnesty_desc: "과거 많은 정부가 그랬듯이, 규정을 바꾸어 수많은 불법 건축물을 합법으로 만들 수 있습니다. 이는 해당 건물의 모든 거주자들 사이에서 분명 인기를 끌 것입니다. 이 결정을 후회하는 일이 없기를 바랍니다."
 ITA_stop_building_abuse: "건물 남용 중지"
 ITA_stop_building_abuse_desc: "불법 건축은 세수를 줄일 뿐만 아니라 범죄 조직의 영향력을 키우고, 무엇보다 심각한 안전 문제를 일으킵니다. 이는 활성 단층선과 화산 위에 자리한 나라에게 우려스러운 일입니다."
 ITA_fight_tax_evasion: "탈세와 투쟁"
 ITA_fight_tax_evasion_desc: "탈세는 이탈리아에서 극히 만연하여 이미 어려운 예산에서 절실히 필요한 자금을 빼앗고 있습니다. 더 발전된 통제 수단과 더 단순한 세법이 이 문제를 해결하는 데 도움이 될 것입니다."
 ITA_great_projects: "대규모 프로젝트"
 ITA_great_projects_desc: "대다수의 필수적인 기반시설 프로젝트들은 소위 \"내 뒷마당에는 안된다 (not in my backyard)\", 또는 '님비 (NIMBY)'라고 알려진 집단의 전국적인 위원회로부터 거부되어 왔습니다. 우리는 이 새로운 프로젝트를 진행할 수 있도록 그들의 지역 관리에 대한 영향력을 줄여야만 합니다."
 ITA_brennero_tunnel: "브레너 터널"
 ITA_brennero_tunnel_desc: "브렌네르 기저 터널은 알프스 동부의 브렌네로 고개 아래에 철도 터널을 건설하는 사업으로, 이탈리아와 중부 유럽 사이의 이동 시간을 크게 단축할 것입니다."
 ITA_tav_torino_lione: "토리노 - 리온 고속철도"
 ITA_tav_torino_lione_desc: "토리노와 리옹 사이의 TAV(Treno ad Alta Velocità / 고속철도)는 수년간 추진되어 온 사업입니다. 알프스 아래에 터널을 굴착하는 것으로, 님비 위원회들의 광범위한 반대에 부딪혀 왔습니다."
 ITA_mose_venezia: "베네치아 모스 (MOSE) 프로젝트"
 ITA_mose_venezia_desc: "MOSE(Modulo Sperimentale Elettromeccanico, 실험용 전기기계 모듈)는 베네치아 석호 입구에 설치된 가동식 방벽으로 이루어진 시스템으로, 이례적인 고조로 인한 침수를 막도록 설계되었습니다."
 ITA_messina_strait_bridge: "메시나 해협을 연결하는 다리"
 ITA_messina_strait_bridge_desc: "메시나 해협을 가로지르는 다리는 한 세기가 넘도록 꿈이었으며, 많은 정부가 그 꿈을 실현하려 했으나 모두 실패했습니다. 지금까지는 그랬습니다."
 ITA_stop_the_brain_drain: "두뇌 유출 방지"
 ITA_stop_the_brain_drain_desc: "청년들에게 충분한 기회를 보장함으로써 이민을 막고, 우리가 비용을 들여 제공한 교육의 혜택을 거둘 수 있습니다."
 ITA_integrative_restoration: "통합적인 복원"
 ITA_integrative_restoration_desc: "이탈리아는 과거의 유적으로 가득하며, 그중 일부는 극히 보존 상태가 좋아 충분한 자원과 숙련된 손길만 있다면 베로나의 로마 원형경기장처럼 다시 우리 도시의 살아 있는 일부가 될 수 있습니다."
 ITA_increase_ASI_funding: "이탈리아 우주청 (ASI) 지원 확대"
 ITA_increase_ASI_funding_desc: "이탈리아는 전 세계에서 미국과 소련 다음으로, 오로지 자국의 힘만으로 인공위성을 우주에 발사한 3번째 국가입니다. 이탈리아의 인공위성인 \"산 마르코\"를 발사한지 수년이 지났지만, 우주 탐사는 아직까지도 제일 중요한 부분 중 하나입니다. 우리는 이탈리아 우주청 (ASI)의 추가적인 지원을 확대하고 다음 세대의 우주 경쟁에서 좋은 위치를 가져갈 수 있도록 우주 과학에 대한 국가의 헌신을 증대하기 위해 과학 기술의 꽃이 피어나도록 해야만 합니다."
 ITA_attract_foreign_tourists: "국제 관광 유치"
 ITA_attract_foreign_tourists_desc: "이탈리아는 이미 세계에서 가장 인기 있는 관광지 중 하나입니다. 그럼에도 많은 도시가 열악한 상태이고 최고의 해변조차 외국인 방문객이 거의 없이 국내 관광에 의존하고 있어, 우리는 잠재력을 거의 활용하지 못하고 있습니다. 대규모 국제 마케팅 캠페인은 분명 더 많은 돈을 쓰는 방문객을 반도로 불러올 것입니다."
 ITA_crack_down_on_antivaxxers: "백신 접종 거부자 단속"
 ITA_crack_down_on_antivaxxers_desc: "최근 인터넷 성장의 부작용 하나는 음모론이 퍼지는 속도가 빨라졌다는 점입니다. 그중 가장 위험한 것은 백신이 자폐증을 일으킨다는 믿음입니다. 이 터무니없는 이론은 심각한 해를 끼치기 전에 근절되어야 합니다."
 ITA_bypass_the_1987_referendum: "1987년 국민투표 통과"
 ITA_bypass_the_1987_referendum_desc: "체르노빌 사고 이후 실시된 1987년 국민투표 이전, 이탈리아는 이미 1960년대 초에 원전 3기를 건설한 원자력 에너지 선도국이었습니다. 우리의 수력 발전은 최대 용량에 도달했으며, 국가 전력망을 두고 도박을 할 수는 없습니다. 안정적인 전력과 성장을 보장하면서 탄소 배출 감축 약속을 지키려면 청정 에너지원을 찾아야 합니다. 원자력이 최선의 선택입니다."
 ITA_encourage_gmos: "유전자 변형 식품 (GMO) 장려"
 ITA_encourage_gmos_desc: "우리 대학들은 매우 유망한 유전학 연구를 하고 있습니다. 우리의 반동적인 사회는 그들의 날개를 충분히 꺾어 왔으며, 이제 이 흥미로운 새 분야에서 실험하도록 허용할 때입니다."
 ITA_fight_scientific_illiteracy: "과학적 문맹 퇴치"
 ITA_fight_scientific_illiteracy_desc: "과학 교육에 대한 우리의 집중은 사회에 만연하여 절실히 필요한 환경 및 보건 정책의 통과를 가로막아 온 과학적 문맹을 근절할 토대를 놓았습니다."
 ITA_merge_small_municipalities: "소규모 지방자치단체 통합"
 ITA_merge_small_municipalities_desc: "이탈리아에는 8000개가 넘는 지자체가 있으며, 그중 수백 곳은 터무니없이 작습니다. 이들을 합병하면 국가의 막대한 예산을 절약하고 통합된 지자체가 쓸 수 있는 자원도 늘어날 것입니다."
 ITA_abolish_perfect_bicameralism: "'완전한 양원제' 폐지"
 ITA_abolish_perfect_bicameralism_desc: "이탈리아의 입법 체계는 하원과 상원이라는 두 의회에 기반합니다. 이탈리아 특유의 이 체계에서 두 의회는 동등한 권한을 가지며 모든 법률은 두 의회에서 동일하게 승인되어야 하므로, 입법 과정이 극히 느리고 경우에 따라 완전한 교착에 빠집니다."
 ITA_inefficient_administration: "비효율적인 행정부"
 ITA_inefficient_administration_desc: "이탈리아의 공공 행정은 비대하고 비효율적이며 부패했습니다. 지방 행정은 권한이 중복되고, 재원 문제가 있으며, 책임감이 거의 없습니다. 자식들에게 건강한 나라를 물려주려면 이 모든 것이 바뀌어야 합니다."
 ITA_tourism_is_our_oil: "관광업이 우리의 목숨이다"
 ITA_tourism_is_our_oil_desc: "우리나라는 역사, 예술, 자연 유산이 세계에서 가장 밀집해 있습니다. 해변과 산은 아름답고 도시들은 전 세계에 알려져 있으니, 이를 활용하기 위해 우리의 인적 자본을 개발해야 합니다."
 ITA_increase_funding_for_research: "대학 연구 보조금 증가"
 ITA_increase_funding_for_research_desc: "우리 대학들은 세계 다른 나라들에 비해 훨씬 적은 자금으로 상당한 양의 연구를 해내고 있습니다. 충분한 자원이 주어진다면 무엇을 이룰 수 있을지 상상해 보십시오."
 ITA_defund_school_laboratories: "전문 학교 지원금 축소"
 ITA_defund_school_laboratories_desc: "직업학교가 학생들에게 제공하는 교육 수준을 고려하면 우리가 직업학교에 쓰는 금액은 터무니없이 높습니다. 이 자금을 다른 방식으로 쓰는 편이 나을 수 있습니다."
 ITA_increase_funding_for_professional_schools: "전문 학교 지원금 확대"
 ITA_increase_funding_for_professional_schools_desc: "직업학교는 대학 교육에 투자할 돈이 없는 사회 하층 아이들을 끌어들이는 경향이 있습니다. 이 학교들이 다음 세대의 노동자를 준비할 모든 재정적 수단을 갖추도록 하는 것은 무엇보다 중요합니다."
 ITA_classical_education: "전통적인 교육 방식"
 ITA_classical_education_desc: "우리는 옛 것을 포기하지 말아야합니다. 이 국가는 고전에 정통한 사람들에 의해 설립되었으며, 그렇기에 우린 미래의 통치자들도 이 전통을 따르도록 해야만합니다."
 ITA_modern_education: "현대적 교육"
 ITA_modern_education_desc: "이제 중세의 유산을 떨쳐내고 라틴어와 그리스어 같은 사어 교육에 그토록 많은 자원을 쏟는 일을 멈추고 더 현대적인 과목으로 전환할 때가 되었습니다."
 ITA_school_reform: "교육 체계 개혁"
 ITA_school_reform_desc: "우리의 교육 체계는 빠르게 낡고 부적절해지고 있으며, 다음 세대의 미래를 보장하려면 개혁해야 합니다."
 ITA_ask_the_chinese: "중국에 도움 요청"
 ITA_ask_the_chinese_desc: "중국은 줄곧 유럽에서 발판을 찾아 왔으며, 이탈리아의 항구는 새로운 실크로드의 종착점이 될 수 있습니다. 중국의 투자는 풍부할 수 있으나, 우리나라에 대한 동방의 영향력에 대한 우려가 따릅니다."
 ITA_seek_european_help: "유럽의 지원 모색"
 ITA_seek_european_help_desc: "경제를 부양하는 데는 많은 비용이 들며, 이를 위해 국채로 직접 자금을 빌린다면 부채 문제를 악화시킬 수 있습니다. 유럽 연합은 낮은 금리로 필요한 금액을 제공해 줄 수 있습니다."
 ITA_stimulate_growth: "성장 촉진"
 ITA_stimulate_growth_desc: "부채를 더 관리하기 쉽게 만들려면 GDP와 그에 따른 수입을 늘려, 그 과정에서 예상 금리를 낮출 수 있습니다. 이는 공짜도 쉬운 일도 아니지만 결국에는 성과를 낼 것입니다."
 ITA_reduce_expenses: "비용 절감"
 ITA_reduce_expenses_desc: "긴축 조치는 인기가 없을 수 있지만, 적자를 줄이고 부채를 더 지속 가능하게 만드는 데 도움이 될 것입니다."
 ITA_the_debt_problem: "이탈리아의 부채"
 ITA_the_debt_problem_desc: "지난 10년간의 무책임한 지출은 이탈리아에 막대한 규모의 정부 부채를 남겼습니다. 우리는 이 문제를 해결할 도덕적 책임이 있으며, 우리의 어리석음을 자식과 손주들에게 떠넘길 수는 없습니다."
 ITA_encourage_youth_to_join_unions: "젊은 세대들의 노조 가입 권유"
 ITA_encourage_youth_to_join_unions_desc: "우리의 최근 연금 개혁은 주로 퇴직자로 구성된 노동조합을 크게 화나게 했습니다. 적절한 캠페인을 통해 젊은 노동자들이 노조에 가입하도록 장려하고 권력 구도를 우리에게 유리하게 바꿀 수 있을 것입니다."
 ITA_marginalize_labour_unions: "노동 조합 무시"
 ITA_marginalize_labour_unions_desc: "이탈리아의 노동조합은 대부분 퇴직자로 구성되어 있으며, 우리의 최근 연금 개혁으로 인해 정부에 극도로 불만을 품고 있습니다. 이 낡은 기관들이 사회에 행사하는 영향력을 줄일 때가 되었습니다."
 ITA_reintroduce_baby_pensions: "'아기 연금 (Baby Pensions)' 재도입"
 ITA_reintroduce_baby_pensions_desc: "So-called \"baby pensions\" may seem economically absurd. After all, there is hardly any logic to a worker paying contributions for 14.5 years and then receiving a pension for 40 years. However that worker will surely be thankful to whoever allowed him or her to live at the expense of the state."
 ITA_recalculate_baby_pensions: "'아기 연금' 재검토"
 ITA_recalculate_baby_pensions_desc: "우리의 연금 체계는 지속 가능성을 높이기 위해 최근 변경되었으나, 수많은 퇴직자들이 14년 6개월 1일만 일하고도 30대 중반에 은퇴할 수 있었던 터무니없는 옛 제도(악명 높은 베이비 연금)를 이용했습니다. 이 연금들을 새 제도로 재산정해야 합니다."
 ITA_Quota_100: "쿼터 100 (Quota 100)"
 ITA_Quota_100_desc: "은퇴 연령 요건을 낮추면 신규 노동자를 위한 자리가 더 많이 생길 것입니다. 이미 흔들리는 우리 제도에 부담이 되겠지만 수혜자들은 크게 환영할 것입니다."
 ITA_increase_pension_age_requirements: "연금 최소 연령 증가"
 ITA_increase_pension_age_requirements_desc: "연금 수급 연령 요건을 높이면 노동자가 평생 제도에 납부하는 기여금을 늘릴 수 있고, 동시에 연금을 받을 것으로 예상되는 기간을 줄여 제도의 막대한 비용을 절감할 수 있습니다."
 ITA_pension_reform: "연금 개혁"
 ITA_pension_reform_desc: "우리의 연금 체계는 세계에서 가장 지속 불가능한 축에 속하며, 붕괴하기 전에 바꾸어야 합니다."
 ITA_generational_divide: "세대 분열"
 ITA_generational_divide_desc: "지난 수십 년간 이탈리아 정치인들은 전후 이탈리아 경제 기적 동안 얻은 재원을 널리 활용하면서도 앞날에 대한 고려는 거의 하지 않았습니다. 이제 그 재원은 바닥났지만, 그 청구서는 혜택을 받지 못했고 인구 구성에서도 대표성이 낮은 세대가 치르게 됩니다."
 ITA_legalize_light_drugs: "합법화"
 ITA_legalize_light_drugs_desc: "주로 대마초인 가벼운 마약 소비는 보건상 매우 사소한 문제로 입증되었으며, 소비를 제한하려는 우리의 시도는 어차피 처참하게 실패하여 법 집행 기관의 값비싼 시간 낭비와 법원의 엄청난 적체만을 초래했습니다. 이제 이러한 사실을 인정하고 합법화할 때입니다."
 ITA_reform_the_judiciary: "사법부 개혁"
 ITA_reform_the_judiciary_desc: "우리의 사법 체계는 선진국 중 가장 느린 축에 속합니다. 이는 국민에게 큰 불이익이고 기업에게도 부정적 요인입니다. 체계의 속도를 높이려면 법전을 간소화해야 합니다."
 ITA_refound_IRI: "IRI (산업 재건 기관) 부활"
 ITA_refound_IRI_desc: "IRI(Instituto per la Ricostruzione Industriale / 산업재건공사)가 폐쇄를 앞두고 있습니다. 이 결정을 되돌려 경제에 대한 우리의 개입을 통합하는 강력한 옛 도구를 유지할 수 있습니다."
 ITA_sell_government_shares_in_companies: "기업의 정부 지분 판매"
 ITA_sell_government_shares_in_companies_desc: "정부는 많은 이탈리아 기업에 상당한 지분을 보유하고 있으며, 이를 매각하면 절실히 필요한 자금을 회수하는 동시에 정부의 간섭을 줄이고 경제적 자유를 늘릴 수 있습니다."
 ITA_further_protect_workers_rights: "노동자 권리 향상"
 ITA_further_protect_workers_rights_desc: "무기한 계약 노동자는 이미 이탈리아에서 가장 보호받는 범주이지만, 퇴직자와 더불어 여전히 가장 큰 유권자층이므로 이들을 달래는 것은 지지율을 높게 유지하는 손쉬운 득표 전략입니다."
 ITA_save_struggling_companies: "침체된 기업 구제"
 ITA_save_struggling_companies_desc: "경쟁력 없는 기업의 생존을 보장하는 일은 결코 저렴하지 않지만, 선거가 오면 노동자와 노동조합은 누가 자신들의 일자리를 구했는지 분명 기억할 것입니다."
 ITA_let_companies_fail: "망하게 내버려두라"
 ITA_let_companies_fail_desc: "상당한 비중을 지닌 기업이 파산 직전에 놓일 때마다 이탈리아 국가나 지방 행정은 일자리를 지키기 위해 폐업을 막아 왔습니다. 이 값비싼 관행은 정치적 이득이 크지만 경제의 효율성을 크게 떨어뜨립니다. 더 생산적인 기업이 시장 점유율을 차지할 수 있도록 기업이 무너지게 두어야 합니다."
 ITA_cultural_divide: "문화적 분할"
 ITA_cultural_divide_desc: "에이나우디의 사망 이후, 이탈리아는 사실상 자유주의 정책을 포기하였으며, 모든 영향력있는 정당들은 정부의 중대한 개입에 대한 합의를 조용히 고수하고 있습니다. 사회의 대부분은 전례를 따라갔고, 경제 및 사회적 자유를 만들어 내려는 많은 노력들이 점점 더 어려워지고 있습니다."
 ITA_safeguard_european_development_funds: "유럽 개발 기금 (EDF) 보호"
 ITA_safeguard_european_development_funds_desc: "북부 이탈리아에서 거둔 대부분의 자금과 마찬가지로, 유럽 기금도 엉뚱한 사람의 손에 들어가거나 단순히 청구되지 않은 채 방치되는 경향이 있습니다. 기업에 더 경쟁력 있는 환경을 보장하기 위해 이 절실히 필요한 자금을 제대로 활용하려고 노력해야 합니다."
 ITA_let_salaries_decrease: "연봉을 낮춰라"
 ITA_let_salaries_decrease_desc: "주요 직종별 적정 임금은 전국적 효력을 지니는 노동조합 협약에 의해 규정됩니다. 이는 북부 노동자의 더 높은 생산성과 맞물려, 남부가 의미 있는 투자를 전혀 유치하지 못하게 합니다. 계약을 지역 수준에서 재협상하면 임금과 생산성 사이의 격차를 크게 줄이고 투자를 장려할 수 있습니다."
 ITA_fire_excessive_government_employees: "불필요한 정부 인력 해고"
 ITA_fire_excessive_government_employees_desc: "시칠리아 한 곳의 산림 경찰이 캐나다 전체보다 많다는 말이 흔히 회자됩니다. 이러한 비대한 행정의 사례들은 중단되어야 합니다."
 ITA_south_reforms: "남부 개혁"
 ITA_south_reforms_desc: "이탈리아 남부에 투입된 대부분의 자금은 의미 있는 성과를 내지 못했습니다. 이제 남부 문제를 다룰 새로운 방법을 개발할 때일지도 모릅니다."
 ITA_citizenship_income: "시민으로써의 소득"
 ITA_citizenship_income_desc: "채용 자체를 위한 채용은 행정 효율을 크게 떨어뜨리는 불편한 결과를 낳았습니다. \\"도움이 필요한\\" 사람들에게 직접 돈을 이전함으로써 이를 해결할 수 있을지도 모릅니다. 우리는 법령으로 빈곤을 폐지할 것입니다."
 ITA_hire_more_government_employees: "더 많은 정부 인력 고용"
 ITA_hire_more_government_employees_desc: "공직은 계약상의 안정성 때문에 매우 선망받으며, 그 수를 늘리면 범죄 조직에 쉽게 포섭되는 사람들의 수가 줄어들 것입니다. 또한 남부인들은 투표함을 사용할 때가 되면 누가 자신들에게 일자리를 주었는지 분명 기억할 것입니다. 결국에는 그들이 할 일을 찾아낼 것입니다."
 ITA_intensify_money_transfer: "송금 시스템 강화"
 ITA_intensify_money_transfer_desc: "남부의 기반시설은 상당히 미개발 상태이며, 이를 개선하면 이 지역의 생산 잠재력이 분명 열리고 북부의 세금을 보상할 것입니다. 자금이 엉뚱한 사람의 손에 들어가지 않기를 바랄 뿐입니다."
 ITA_south_status_quo: "현 상태 유지"
 ITA_south_status_quo_desc: "수많은 정부가 돈을 쏟아붓는 방식으로 남부 문제를 해결하려 했습니다. 어쩌면 충분히 쏟아붓지 않았을 뿐일지도 모릅니다."
 ITA_export_mafia: "§t마피아§! 수출"
 ITA_export_mafia_desc: "§t마피아§!의 활동은 국경 같은 터무니없는 가상의 선에 의해 제한되지 않습니다. 새로운 친구들이 범죄 세계에 가진 기존 연줄을 이용하여 국제적으로 귀중한 영향력을 얻을 수 있습니다."
 ITA_rein_in_favors: "호의적인 통제"
 ITA_rein_in_favors_desc: "우리는 전국에서 이루어지는 광범위한 마피아 활동을 묵인하고 있으며, 그 대가로 패밀리들은 다음 선거에서 우리의 소중한 자리를 위협하는 이가 없도록 보장해 줄 것입니다."
 ITA_blindness_in_the_north: "편견으로 가득한 북쪽"
 ITA_blindness_in_the_north_desc: "북부 이탈리아 사람들은 종종 §t마피아§!가 이탈리아 남부 지역에만 존재하는 문제라고 생각하지만, 사실 그렇지 않습니다. 마피아의 존재는 덜 느껴지지만, 그들은 더 부유한 북부 지역에서 불법적으로 얻은 자금을 투자하는 데 집중하고 있으며, 대형 공공 프로젝트, 쓰레기 처리, 성매매 및 마약 밀매 등에서 이득을 보고 있습니다. 우리는 그 대가로 특혜를 받는 조건으로 그것을 묵인할 것입니다."
 ITA_deafness_in_the_south: "패배로 가득한 남쪽"
 ITA_deafness_in_the_south_desc: "남부에서 §t마피아§!의 가장 중요한 수입원 중 하나는 \\"피초\\"로, 아무리 작은 사업체라도 \\"보호\\"를 명목으로 지역 패밀리에게 내야 하는 돈입니다. 내지 않으면 사업체와 그 소유주에게 불쾌한 결말이 닥치는 경우가 많습니다. 우리는 패밀리들의 호의를 대가로 이 관행을 묵인할 것입니다."
 ITA_war_with_mafia: "War with Mafia"
 ITA_war_with_mafia_desc: "지금까지 경찰력으로 괜찮은 성과를 거두었지만, 당면한 과제는 훨씬 더 강력한 접근을 요구합니다. 이탈리아 육군을 거리에 배치하여 모든 마피아 깡패가 다시 \\"피초\\"를 요구하기 전에 두 번 생각하게 만들 때입니다."
 ITA_relax_legal_framework: "유연한 법률 체계"
 ITA_relax_legal_framework_desc: "§R마피아§!처럼 사회에 뿌리내린 범죄 조직과 싸우는 일은 쉽지 않으며, 우리 자신의 법률에 손발이 묶인 채 싸우는 것은 더욱 나쁩니다. §R마피아§!에 제대로 맞서기 위해 비상 조치를 마련해야 합니다."
 ITA_intensify_police_operations: "경찰 작전 강화"
 ITA_intensify_police_operations_desc: "수동적인 접근은 지난 수십 년간 통하지 않았고 앞으로도 통하지 않을 것입니다. 손을 더럽히더라도 §R마피아§!와 정면으로 맞서 싸워야 합니다."
 ITA_turn_the_population_against_them: "사람들이 반대하도록 만들어라"
 ITA_turn_the_population_against_them_desc: "The main strength of §RMafia§! lies in the passive acceptance of society, \"Omertà\". Southerners won't denounce those criminals out of fear or even because of slight approval as they feel that the central government has abandoned them. We must change the narrative and ensure that the people feel safe and cared for."
 ITA_seek_support_of_the_church: "교회의 지원 모색"
 ITA_seek_support_of_the_church_desc: "이탈리아 남부는 여전히 신앙심이 깊습니다. 따라서 교회는 §R마피아§!로부터 사회의 통제권을 되찾는 데 필수적인 동맹이 될 수 있습니다."
 ITA_anti_mafia_education: "Anti-Mafia Education"
 ITA_anti_mafia_education_desc: "§R마피아§!를 물리치려면 우리 아이들이 자라서 그들의 조직원으로 포섭되지 않도록 해야 합니다. 학교가 패밀리들의 음모에서 벗어나 아이들이 안전하게 성장할 수 있는 장소를 제공하도록 해야 합니다."
 ITA_eradicating_mafia: "Eradicating the Mafia"
 ITA_eradicating_mafia_desc: "남부 개발을 가로막는 가장 큰 문제 중 하나는 §R마피아§!로 알려진 조직 범죄입니다. 여러 범죄 조직이 거의 봉건적인 방식으로 이탈리아 남부를 장악하고 있으며 사회의 불가분한 일부가 되었습니다. 이들을 제거하는 일은 쉽지 않겠지만 옳은 일입니다."
 ITA_North_South_divide: "남부의 의문"
 ITA_North_South_divide_desc: "이탈리아 남부는 수십 년간 더 산업화된 북부에 뒤처져 왔습니다. 이탈리아가 세계 무대에서 경쟁력을 유지하려면 이 격차를 메워야 합니다."
 ITA_divided_nation: "새로운 '유럽의 환자'"
 ITA_divided_nation_desc: "한때 역동적이던 이탈리아 경제는 서방 수준에 급속히 뒤처지고 있으며, 조직 범죄와 부패가 만연하고, 생산성 성장은 멈췄으며, 부채는 계속 늘고, 재능 있는 젊은이들은 이탈리아가 줄 수 없는 기회를 찾아 나라를 떠나고 있습니다. 이탈리아가 새천년에 성공하길 원한다면 이 문제들과 그 밖의 많은 문제를 해결해야 합니다."
 ITA_industrial_focus: "이탈리아 산업"
 ITA_industrial_focus_desc: "이탈이아의 산업은 냉전 기간 동안 호황기를 거쳐 왔으며, 세계 강국들 사이에서 입지를 굳건히 지키기 위하여 우리의 산업을 지속적으로 발전시켜야 할 것입니다."
 ITA_south_italian_dev: "이탈리아 남부 개발"
 ITA_south_italian_dev_desc: "우리는 이탈리아 남부를 발전시킴으로 현재의 열악한 상황을 바로잡아야 합니다. 스페인이 통치한 이래로 남부는 북부보다 더욱 빈약하고 퇴보되어졌습니다. 이젠 우리가 그곳을 재건할 차례입니다."
 ITA_central_italian_dev: "이탈리아 중심부 발전"
 ITA_central_italian_dev_desc: "남부의 산업이 어려운 처지에 있고 북부의 산업이 질주하고 있다고 해서, 우리나라 중부의 산업을 소홀히 해도 된다는 뜻은 아닙니다."
 ITA_north_italian_dev: "이탈리아 북부 개발"
 ITA_north_italian_dev_desc: "이탈리아의 북부는 이탈리아 중에서 가장 발전되고 현대적인 곳입니다. 우리는 이곳이 더욱 성장하도록 돕기 위하여 현대화하고 개선해야 할 것이며, 우리의 경제력 또란 증가시켜야 할 것입니다."
 ITA_islands_dev: "군도 개발"
 ITA_islands_dev_desc: "현재 시실리와 사르디니아는 본토의 상황보다 더욱 열악합니다. 우리는 그들을 성장시키고 현대화를 돕기 위하여 더욱 투자해야 할 것입니다."
 ITA_south_infrastructure: "남부 산업 증강"
 ITA_south_infrastructure_desc: "산업 혁명 이후의 우리 영토의 남부 내의 기반 시설은 이웃 국가들보다 열악합니다. 우린 독일이 경쟁심을 가지도록 할 만큼 고속도로와 도로망을 더 건설하여야 합니다."
 ITA_central_infrastructure: "중앙 기반시설 확장"
 ITA_central_infrastructure_desc: "이 나라의 대부분이 그렇듯이, 중부 이탈리아의 기반시설은 북부만큼 발달하지 못했으며 동시에 남부만큼 부족하지는 않습니다. 분명히 개선의 여지가 아직 있습니다."
 ITA_north_infrastructure: "북부 산업 증강"
 ITA_north_infrastructure_desc: "북부의 기반 시설은 이탈리아에서 가장 좋은 성능을 보유하고 있으나 아직은 개선의 필요가 남아 있습니다. 이들을 통하여 이웃 국가 간에 새로운 교통망 연결을 통하여 북부의 효율성을 더욱 향상시킬 수 있을 것입니다."
 ITA_islands_infrastructure: "섬들을 발전시켜라"
 ITA_islands_infrastructure_desc: "우리의 섬 지역이 발전에서 뒤처지게 놔둘 수 없습니다! 어느 훌륭한 유럽 도시에도 뒤지지 않도록 새로운 도로와 철도를 건설해야 합니다!"
 ITA_south_dockyards: "치비타베키아 항구 개선"
 ITA_south_dockyards_desc: "치비타베키아 항구는 우리의 수도 근처에 의치해 있으며 전략적 위치입니다. 또한 우리는 강한 해군을 보유하고 있기 때문에 항구 개선을 시급히 실행해야 할 것입니다."
 ITA_central_dockyards: "치비타베키아항 개선"
 ITA_central_dockyards_desc: "전략적 위치에 있고 수도와 가까운 중요한 항구 치비타베키아를 개선하십시오. 이탈리아는 한때 해양 초강대국이었으며, 로마 근해에서 해군이 강하지 않다면 우리의 유산을 결코 되찾을 수 없습니다!"
 ITA_north_dockyards: "트리에스테항 개선"
 ITA_north_dockyards_desc: "트리에스테는 베네치아 및 바리와 함께 아드리아해에서 우리의 가장 중요한 항구이니 중요한 항구를 개선합시다."
 ITA_islands_civilian: "사르디니아 시민 증강"
 ITA_islands_civilian_desc: "우리는 이 아름다운 사르디니아 섬에서 더욱 많은 개발과 제조를 요해야 할 것입니다. 이는 그들의 번영을 증진시킬 뿐만 아니라 감사함으로 독립에 대한 어리석은 요구를 가라앉힐 것입니다."
 ITA_islands_military: "시칠리 국방 증강"
 ITA_islands_military_desc: "로마의 후손인 이탈리아 군대는 로마의 후손입니다. 그렇기에 그들은 강해야 하며 잘 갖춰져야 합니다. 그렇기에 시칠리아에서 그들의 장비를 제조하도록 하여 지역을 부유하게 함과 동시에 평화로운 독립을 요구하도록 할 것입니다."
 ITA_invest_south: "남부 산업 지원"
 ITA_invest_south_desc: "남부의 번영을 돕기 위한 우리는 노력과 동시에 북부의 경제적 영향력을 넘어서도록 도와야 할 것입니다."
 ITA_invest_north: "북부 산업 지원"
 ITA_invest_north_desc: "북부는 우리의 기반입니다. 우리는 그곳의 경제력을 퍼트리는 것보다 확장하는데 주력해야 할 것입니다."
 ITA_enforce_culture_SRD: "사르디니아의 문화동맹 강화"
 ITA_enforce_culture_SRD_desc: "사르디니아의 국민들은 그들이 이탈리아에 있다는 것을 이해시키기 위하여 그들의 독립에 대한 욕구를 멈추게 해야 합니다."
 ITA_north_miracle: "북부 산업의 효율성"
 ITA_north_miracle_desc: "Northern Italian Industries have a history of efficiency and productivity, despite the historical issues plaguing the country."
 ITA_education_reforms: "교육 개혁"
 ITA_education_reforms_desc: "The Germans, French, and British all dominate European higher education. Italian universities must be the finest on the continent if we wish for our country to become the leading European power!"
 ITA_oil_fields_sicily: "시칠리아의 유전"
 ITA_oil_fields_sicily_desc: "누가 사우디아라비아나 베네수엘라에서 기름을 캡니까? 진정한 강국은 자급자족으로 자원을 얻습니다. 그렇기에 우리나라도 지중해에서 기름을 추출하기 시작해야합니다. 현재 시칠리아 물에 기름이 아주 많이 포함되어 있습니다."
 ITA_european_logistics: "병참 개선"
 ITA_european_logistics_desc: "개선된 인프라와 함께 개선 된 물류는 더욱 적은 수의 공장으로 더욱 많은 것을 생산할 수 있게 함으로 경제 호황을 불러일으킬 수 있습니다. 그렇기에 우리는 기업이 북부의 새로운 기회에 적응할 수 있도록 도와야 할 것입니다."
 ITA_buona_scuola: "교육 구조 개선"
 ITA_buona_scuola_desc: "우리의 고등 교육은 아주 좋고 훌륭하나 외국 교육이 유입된다면 무너질지도 모릅니다. 그러니 이탈리아의 공립학교를 더욱 투자함으로써 유럽에서 최고로 만들어야 합니다."
 ITA_bureaucratic_reforms: "관료 개혁"
 ITA_bureaucratic_reforms_desc: "현재의 이탈리아 정부는 매우 비효율적으로 운영되고 있습니다. 우리의 경제 개혁에서 배운 것을 토대로 내부 관료제를 재구성한다면 효율이 크게 개선될 것입니다."
 ITA_oil_fields_basilicata: "바실리카다의 유전"
 ITA_oil_fields_basilicata_desc: "After our recent success in Sicily, we have found that we may possess more oil than we thought! Let's set up extraction operations south of our mainland. Let the black gold flow."
 ITA_support_eni_africa: "ENI의 아프리카 지원"
 ITA_support_eni_africa_desc: "우리의 선전적인 석유회사인 ENI에 정부의 영향력을 사용함으로써 아프리카 자원에 대한 통제력이 우리 경제 발전에 도움이 될 것입니다."
 ITA_support_eni_arabia: "아라비아의 에니 (Eni) 석유회사 지원"
 ITA_support_eni_arabia_desc: "아프리카와 마찬가지로 우리는 아라비아 반도에서 ENI를 도움으로 전 세계의 전략적 자원을 더욱 많이 통제할 수 있을 것입니다."
 ITA_anti_mafia_measures: "§t마피아§! 방지 대책"
 ITA_anti_mafia_measures_desc: "§t마피아§!의 위엄은 전 세계적으로도 잘 알려져 있으며, 대부분의 사람들이 영화나 방송 등으로 그들을 대단한 존재로 접하지만 실제로 이탈리아에게 있어선 위협거리입니다. 우리는 법정이 주요 제도를 시행할 수 있도록 지원함으로 그들을 완전히 없앨 수 없으리라 하더라도 그들의 영향력은 어느 정도 줄일 수 있을 것입니다."
 ITA_anti_corruption_measures: "부패 척결 대책"
 ITA_anti_corruption_measures_desc: "우리가 마피아의 영향력을 다룸으로써 우리는 부패와 싸울 수 있는 방안을 마련했습니다. 이전의 마피아 체포를 통하여 얻은 자료로 몇몇의 부패한 정치인들을 찾아내었으며, 우리의 정의와 모범을 보이기 위하여 정부 내 부패 방지 규정을 강화해야 할 것입니다."
 ITA_ideology_focus: "이데올로기 중점"
 ITA_ideology_focus_desc: "Ever since the Second World War, Italy has been a Western-aligned democracy, but times are changing. Perhaps it's time to revise our ideological allegiances."
 ITA_our_past: "옛 방식에서 벗어나다"
 ITA_our_past_desc: "민주주의는 부패와 권력 쇠퇴를 가져왔습니다. 이제 우리가 다시 일어나길 원한다면 우린 그것을 척결해야 할 것입니다."
 ITA_what_we_are: "민주주의 척결"
 ITA_what_we_are_desc: "우리는 무솔리니의 전체주의에서 자유와 쟁취를 배웠습니다. 이젠 우리의 자유를 향해 나아갑시다. 이탈리아의 자유를 되찾읍시다."
 ITA_mantain_the_republic: "Maintain the Republic"
 ITA_mantain_the_republic_desc: "헌법은 이탈리아가 노동에 기초한 민주 공화국이라고 명시합니다. 주권은 국민에게 속하며, 국민이 헌법이 정한 형식과 한계 내에서 행사합니다."
 ITA_towards_monarchy: "군주제"
 ITA_towards_monarchy_desc: "이탈리아의 황금기는 분명 군주제의 시대였습니다. 허나 우리 공화국은 실패하였으며 다시금 왕권을 회복시키기 위해 나아가야할 것입니다."
 ITA_empower_the_king: "새로운 왕위"
 ITA_empower_the_king_desc: "We can't restore the monarchy and not empower the rightful heirs to the throne. The government is ready, let's crown a new king. All Hail King Vittorio Emanuele IV, of the House of Savoy, rightful King of Italy!"
 ITA_reestablish_rome: "새로운 로마"
 ITA_reestablish_rome_desc: "Italy's true golden age was back when the Roman Empire stretched from Iberia to the Caucasus. We should reclaim the mantle of Rome, and strive to rebuild the Empire in the modern age."
 ITA_dismantle_parliament: "의회 해체"
 ITA_dismantle_parliament_desc: "The people of Italy have spoken, we now have the legitimacy required to throw away the corrupt political class that has caused decades of decline without needless violence."
 ITA_march_on_rome: "새로운 행진"
 ITA_march_on_rome_desc: "무솔리니가 힘을 얻기 위하여 로마에서 검은 셔츠를 입고 행진한 것처럼 우리도 파시즘 운동을 공식적으로 포용하기 위해서 두 번째의 파시스트 운동을 조직할 수 있도록 도와야합니다. 이제 시간이 다다랐으니 우리도 이처럼 실시해야 합니다."
 ITA_reclaim_colonies: "식민지 개척"
 ITA_reclaim_colonies_desc: "이탈리아 식민지 제국은 확실히 세계에서 가장 위대하진 못하였으나 세계에 파시즘의 힘을 보여주기 원한다면 다시 그 명예를 회복해야합니다. 이전의 독립되었던 식민지 속의 아프리카인들과 국가를 다시 정복하는 것은 누워서 떡 먹기입니다."
 ITA_renew_lateran_treaties: "라테라노 조약 갱신"
 ITA_renew_lateran_treaties_desc: "라테란 조약은 파시즘 이탈리아와 바티칸 시국 사이의 협약으로 ‘로마 내부의 문제’가 해결되었으며 이탈리아는 바티칸 시국을 독립 국가로 인식하게 하였던 조약입니다. 또한 그들은 우리의 민주주의 헌법의 일부로 속해있기 때문에 그들 또한 파시스트를 존중할 것임을 분명히 해야 할 것입니다."
 ITA_renew_lateran_treaties_2: "라테라노 조약 갱신"
 ITA_renew_lateran_treaties_2_desc: "라테란 조약은 파시즘 이탈리아와 바티칸 시국 사이의 협약으로 ‘로마 내부의 문제’가 해결되었으며 이탈리아는 바티칸 시국을 독립 국가로 인식하게 하였던 조약입니다. 또한 그들은 우리의 민주주의 헌법의 일부로 속해있기 때문에 그들 또한 파시스트를 존중할 것임을 분명히 해야 할 것입니다."
 ITA_pesky_states: "중소국가에 대한 최후통첩"
 ITA_pesky_states_desc: "It's time to tell the micro-states within Italy that the government doesn't recognize their right to exist. They will submit to the new Duce, or our new blackshirt legions will march on them."
 ITA_retake_african_coast: "아프리카 해안 탈환"
 ITA_retake_african_coast_desc: "사람들은 고대 로마에 대해 생각할 때에 보통 유럽을 생각하지만 북아프리카 또한 중요하다고 생각합니다. 현재 그 국가들은 가난하고 약하기 때문에 우리는 그들을 받아들임으로써 로마의 통치를 회복할 수 있어야 합니다."
 ITA_retake_levant: "레반트 수복"
 ITA_retake_levant_desc: "한때 고대 최강의 제국들이 자리했던 중동은 역사에서 밀려났고, 그 국민들은 외세의 지배와 끊임없는 내분 속에서 고통받고 있습니다. 이 지역에 다시 한번 팍스 로마나를 가져오고, 지하의 부를 차지하여 우리의 영광스러운 복원에 연료로 삼을 때입니다."
 ITA_invite_the_gauls: "서유럽"
 ITA_invite_the_gauls_desc: "우리 서유럽의 형제들 또한 로마들의 자손들입니다. 우리가 그들을 로마 제국의 진정한 후계자로 만들고 싶다면, 우리는 그것들을 그들에게 제공해야합니다."
 ITA_invite_africans: "아프리카와 중동"
 ITA_invite_africans_desc: "로마 시대 이후로 아프리카와 중동은 많은 변화를 겪어왔습니다. 새로운 문화와 이슬람의 부상은 영원히 그들을 그들의 문화로 이루었을지 모르지만 그들 또한 로마의 자손들입니다. 이에 우리는 그들에게 우리 연맹에 들여올 수 있도록 여러 가지를 제공해야합니다."
 ITA_strike_gaul: "서부 침공"
 ITA_strike_gaul_desc: "갈리아, 히스파니아, 브리타니아. 그들은 진실로 그들 자신이 새로운 로마 제국의 일부임을 받아들이도록 하기 위해서, 우리 군대가 그들에게 보내어져 조금의 압박과 진압을 행사할 것입니다."
 ITA_recover_anatolia: "아나톨리아 복구"
 ITA_recover_anatolia_desc: "The Eastern Empire must be restored. Our new technology should mean that we won't have to split up again since we can govern better, so it must be us that reclaims those lands. Let's make Istanbul Constantinople again!"
 ITA_invite_anatolians: "아나톨리아인 초대"
 ITA_invite_anatolians_desc: "우리는 동방 제국에게 회원 자격을 부여하지 않고 로마의 후계자라 진지하게 주장할 수는 없습니다. 모든 이들에게 자격을 부여함으로써 각국 정부와의 협상을 진행해야 합니다."
 ITA_our_savoie: "사보이 수복"
 ITA_our_savoie_desc: "Savoy was unlawfully given to the French when we needed their help against the Austrians during Risorgimento."
 ITA_recover_balkans: "발칸 제도 복구"
 ITA_recover_balkans_desc: "발칸 지역은 현 인구의 혼합체이며, 유고슬라비아의 붕괴에서 보았듯 많은 분쟁을 일으켜왔습니다. 우리는 그들과의 형제로서 로마 깃발 아래 그들을 하나로 묶고 종지부를 찍어야합니다."
 ITA_invite_balkan_countries: "발칸반도"
 ITA_invite_balkan_countries_desc: "The Balkans should be invited into the Roman Federation, to allow it to span the whole of the Mediterranean coast. It was a vital part of the Western Empire, and the recent chaos in the region is a disgrace to the memory of Rome."
 ITA_strike_germans_before_they_can: "독일"
 ITA_strike_germans_before_they_can_desc: "한때 독일의 게르만족은 로마를 무너뜨린 장본인이나 새로운 로마가 탄생한 지금, 우리는 굳게 살아남을 것임을 약조하고, 독일이 우리의 위협이 되지 않으며 또한 그들이 우릴 먼저 치도록 두지 않게 하여 우리의 군대가 베를린 위로 행진하도록 하겠습니다."
 ITA_arabian_black_gold: "아라비아의 검은 황금"
 ITA_arabian_black_gold_desc: "우리는 아라비아를 정복하려는 무솔리니의 옛 꿈을 추구해야합니다. 이는 이탈리아 제국의 창공과 중요성을 크게 높일뿐만 아니라 대규모의 석유 매장량을 확보하게 될 것입니다. 이로써 아라비아의 검은 황금을 얻음으로 이탈리아 제국은 더욱 풍부해질 것입니다."
 ITA_abandon_the_west: "서부를 포기하다"
 ITA_abandon_the_west_desc: "NATO가 우리더러 ‘잘있으라’라고 말한다면 우린 우리의 방식대로 갈 수밖에 없습니다. 냉전이 끝나고 나면 우리는 외교에서 미국과 그 친구들을 영입할 필요가 없습니다."
 ITA_settle_southern_question: "남부 문제 해결"
 ITA_settle_southern_question_desc: "이탈리아 남부는 새로운 왕국을 반대하지만, 우리는 집중적인 선전 운동을 통하여 지역 주민들 사이에서 이를 정당화하고 시위자들을 진정시켜야 할 것입니다."
 ITA_demand_crown_albania: "알바니아 요구"
 ITA_demand_crown_albania_desc: "King Vittorio Emanuele III took the throne of Albania from King Zog. And Albania still retains significant ties with Italy, it's time to bring them back into the fold."
 ITA_italian_empire: "제국 설립"
 ITA_italian_empire_desc: "By taking back our colonies we have de facto restored the Italian Empire, and therefore our glorious ruler can officially claim that the Kingdom of Italy is now the Empire of Italy. All Hail Emperor Vittorio IV!"
 ITA_attack_on_america: "미국을 공격하다"
 ITA_attack_on_america_desc: "세계 2차 대전에서 미국은 우리나라를 침략하고 몰락하도록 만들었습니다. 이후 이탈리아는 약화되었으나 마침내 다시 세계 강대국의 자리로 회복했습니다. 따라서 이젠 복수의 시간입니다. 우리는 곧 워싱턴을 점령할 것이며, 미국인들에게 로마의 참된 힘을 단단히 보여줄 것입니다."
 ITA_with_europe: "유럽 공동체 촉발"
 ITA_with_europe_desc: "이탈리아는 유럽 연합과도 더욱 가까워져야 합니다. 우리는 다른 이들과도 긴밀한 유대 관계를 유지하고 협력을 강화해야합니다."
 ITA_with_europe_2: "유럽의 협력 추구"
 ITA_with_europe_2_desc: "이탈리아는 유럽 연합과 가까워야 합니다. 다른 회원국들과 긴밀한 유대를 추구하고 협력을 강화해야 합니다."
 ITA_european_speech: "유럽 의회 연설"
 ITA_european_speech_desc: "우리는 유럽을 통일하려는 의도를 발표해야합니다. MEP의 이탈리아 대표가 의회에 공식적으로 진행할 연설과 홍보 등의 여러 준비를 진행해야 할 것입니다."
 ITA_prepare_the_union: "연맹을 준비하다"
 ITA_prepare_the_union_desc: "우리는 단일화 조약을 준비하여 유럽 의회에 제출해야합니다. 모든 회원국들이 이 조약을 기꺼이 받아들일 수 있도록 준비하는 데는 시간이 걸릴 것입니다."
 ITA_unite_the_union: "하나 된 유럽"
 ITA_unite_the_union_desc: "유럽 연합은 우리의 미래요 우리는 곧 유럽 연합의 미래입니다. 우리는 유럽 의회에 단일화 조약을 제출했기에 모든 EU 회원국들이 이들 승인할 수 있도록 함께 걸어나가며 마침내 단일화가 되는 날, 우리는 지금껏 보아온 단언컨대 최고의 대륙을 바라볼 수 있을 것입니다."
 ITA_without_europe: "우리 스스로"
 ITA_without_europe_desc: "유럽 연합은 실패한 연맹이며, 더 이상 회원국들이 우리의 주권을 강탈하지 못하도록 해야 합니다. 우린 이들과 거리를 둬야할 이유가 생겼습니다."
 ITA_diplomatic_focus: "외교 중점"
 ITA_diplomatic_focus_desc: "§YIndustrial Cooperation§!: Both countries receive a civilian factory.\n§YMilitary Cooperation§!: Italy asks to buy military equipment.\n§YTourism Deal§!: Both countries receive an office.\n§YTrade Deal§!: Italy receives resources, the other country gets a factory.\n§YMigration§!: Italy gets more population growth or reduced police cost.\n§YTech Deal§!: Italy pays money for research speed and tech bonuses."
 ITA_strenghten_ties_with_west: "서부와의 관계 강화"
 ITA_strenghten_ties_with_west_desc: "파시즘의 종식 이후 이탈리아는 안정적인 민주주의 국가로 성장했습니다. 우리는 미국, 나토, 그리고 자유세계 전체와의 유대를 유지할 필요가 있습니다."
 ITA_draw_closer_to_east: "동부 포용"
 ITA_draw_closer_to_east_desc: "러시아는 강력한 초강대국입니다. 만일 그들이 우리의 최고 동맹국이 된다면 서부와 분리할 수도 있을 것입니다. 만일 협력이 이루어진다면 그들은 우리의 항구를 사용할 수 있을 것이고 우리는 그들의 영향력과 힘을 사용할 수 있을 것입니다."
 ITA_draw_closer_to_far_east: "중국과 함께"
 ITA_draw_closer_to_far_east_desc: "새로운 세기로 나아가며 중국이 그 자리를 차지할 지도 모릅니다. 우리가 서부와 완전한 분리를 원한다면 우리는 그들에게 가까이 다가가야 할 것입니다. 우리의 동맹국들은 그들을 매우 귀하게 받아들일 것이며 극히 환영할 것입니다."
 ITA_befriend_america: "미국과 친선"
 ITA_befriend_america_desc: "미국은 현대의 자유와 민주주의의 융합체입니다. 이탈리아가 자유를 추구한다는 것을 세계에 확실히 알릴 수 있도록 미국과의 화합을 이끌어야 합니다."
 ITA_befriend_europeans: "서유럽과 친선"
 ITA_befriend_europeans_desc: "우리는 형제들에게 충성과 의지가 있음을 보여줘야 합니다. 그들과 함께 서 있는 이상 말입니다."
 ITA_befriend_middle_east: "중동과 친선"
 ITA_befriend_middle_east_desc: "우리는 타 회원국들이 중동 국가에 반대하는 것에 관심을 둘 이유가 없습니다. 그들은 이웃을 신뢰하지 않으므로 우리는 그들에게 친구가 되어줄 수 있다는 것을 확신시켜야 합니다."
 ITA_befriend_south_east_asia: "동남아시아와 친선"
 ITA_befriend_south_east_asia_desc: "중국과 더 가까워지기 위한 노력의 일환으로 우린 다른 아시아 국가들과도 친구가 되어야 할 것입니다."
 ITA_befriend_europeans2: "동유럽과 친선"
 ITA_befriend_europeans2_desc: "동부는 서부보다 가난하며, 문화와 정치적으로도 열악합니다. 우리는 그들에게 외교적 지원을 제공함과 동시에 그들과 함께 서 있음을 확실시해야합니다."
 ITA_befriend_csto: "CSTO와 친선"
 ITA_befriend_csto_desc: "우리가 러시아인들과 화합을 맺는다면, 친구로써의 관계를 맺을 수 있을 것입니다. 우리는 이들과 CSTO의 회원국들에게 우리가 그들의 친구이자 동맹국으로 생각하도록 해야 할 것입니다."
 ITA_befriend_malaya: "동인도와의 친선"
 ITA_befriend_malaya_desc: "If we aligned ourselves with the Chinese, we are going to have to find other potential allies around them. The Pacific nations of Malaysia and Indonesia are great candidates."
 ITA_befriend_south_america: "남아메리카와 친선"
 ITA_befriend_south_america_desc: "냉전 이후 남미는 미국과 서부에 대한 일반적인 불신이 가득하지만, 이탈리아에 대해선 별로 그렇게 생각하진 않는 듯합니다. 그렇기에 우리는 브라질과 아르헨티나에게 우정의 손길을 넓히고 그 지역에 우리의 영향력을 부여해야 할 때입니다."
 ITA_befriend_europeans3: "북유럽과 친선"
 ITA_befriend_europeans3_desc: "우린 우리의 이웃인 튜토닉과 스칸디나비아를 잊어서는 안됩니다. 우리가 진정한 민주주의의 지지자로 추앙받고 싶다면 그들과 우정을 주고받는 것이 중요합니다."
 ITA_the_nato: "NATO와 화해"
 ITA_the_nato_desc: "우리는 동료 동맹 회원들에게 우리가 그들의 안전에 전념한다는 것을 보증해야합니다."
 ITA_italeave: "이탈리브"
 ITA_italeave_desc: "The European Union is a corrupt hive of bureaucrats that despise Italy and constantly plot towards its downfall; we must leave this rotting organisation."
 ITA_global_investments: "해외 투자"
 ITA_global_investments_desc: "우리가 유럽에 분리되어 홀로 나아가려 한다면, 우리는 외국에게 우리의 영향력을 보여줘야 할 것입니다. 만일 그렇게 하기 위해선 그들의 선의를 사기 위하여 타국 발전에 투자해야 할 것입니다."
 ITA_use_force: "이민 금지령"
 ITA_use_force_desc: "검사받지 않은 이민은 악순환입니다. 중산층은 가난한 국가로 도망칠 것이고, 부유한 국가의 하층민이 될 것이며, 저소득층의 생계를 위협할 것입니다. 즉 그들이 자국을 떠나 타국으로 가게 되면 그곳은 그들로 인하여 고통 받을 것이고, 이로 인하여 부유한 국가들은 이득과 효과를 얻게 된다는 것입니다. 그렇기에 우린 이러한 악순환에 맞서 싸울 필요가 있습니다."
 ITA_encourage_immigration: "이민 장려"
 ITA_encourage_immigration_desc: "이민은 저출산과 저임금 직원 부족과 같은 많은 문제들을 해결할 열쇠입니다. 그러므로 앞으로 더욱 많은 이민자들을 받아들이는 것은 경제적으로 볼 때 바람직합니다."
 ITA_close_air_support: "근접항공지원기"
 ITA_close_air_support_desc: "CAS, while having few tools to defend itself, deals massive damage to enemy men and materiel, shredding its way through the modern battlefield from high above. If we attain air superiority, we can beat far more significant foes by just bombing their troops into oblivion."
 italy_md.1.t: "바티칸 시국은 조약 갱신을 받아들였습니다!"
 italy_md.1.d: "The Vatican City has decided to renew the Lateran Treaties! Now, Italy has even God on its side!"
 italy_md.1.o1: "환상적이군."
 italy_md.2.t: "바티칸 시국은 조약 갱신을 거부했습니다."
 italy_md.2.d: "바티칸 시국은 라테란 조약 갱신을 하지 않기로 결정했습니다."
 italy_md.2.o1: "그들은 지금 본인들이 뭘 하려고 하는건지 전혀 이해하지 못하고 있다!"
 italy_md.3.t: "이탈리아의 합병 요구!"
 italy_md.3.d: "충격적인 요구가 우리에게 전해졌습니다. 이탈리아는 합병을 요구하고 있습니다! 우리나라는 이미 이탈리아와 전쟁에 준비된 상태이지만, 이는 수많은 것을 잃게하는 길이고, 우리가 승리할 가능성은 아주 적습니다... 무엇을 해야 할까요?"
 italy_md.3.o1: "Looks like we are all Italians now."
 italy_md.3.o2: "충격적인 요구다! 국제사회는 우리에게 손을 들어줄 거다."
 italy_md.4.t: "[From.GetName] 는 합병을 받아들였다!"
 italy_md.4.d: "[From.GetName] 는 우리의 요구를 받아들였고, 이제 이탈리아 영토의 일부가 되었습니다."
 italy_md.4.o1: "달콤하군."
 italy_md.5.t: "[From.GetName] 는 합병제안을 거부했습니다!"
 italy_md.5.d: "[From.GetName] has decided not to accept our requests."
 italy_md.5.o1: "[From.GetName] 는 곧 황무지가 될 것이다!"
 italy_md.6.t: "이탈리아부터의 제안"
 italy_md.6.d: "이탈리아 국영 회사 ENI는 우리나라의 해안에서 석유 매장지를 발견했다고 주장했습니다... 이들은 석유 시추선을 건설하여 그 결과물을 똑같이 나누기로 하자고 제안하고 있습니다. 우리는 어떻게 해야 할까요?"
 italy_md.6.o1: "당연히 승낙이지"
 italy_md.6.o2: "It's OUR oil. Not some Italian imperialists!"
 italy_md.7.t: "[From.GetName]의 석유 거래 거부!"
 italy_md.7.d: "From.GetName] 에게 보내진 우리의 공평한 제안은 거절되었습니다! 그들은 이 자원이 자신들의 것이며, 그 누구와도 나누기를 원하지 않는다고 했습니다."
 italy_md.7.o1: "댓가를 치를 것이다!"
 italy_md.8.t: "[From.GetName] 는 석유 거래를 받아들였습니다!"
 italy_md.8.d: "[From.GetAdjective] 정부는 우리의 제안을 받아들였습니다. 그들은 우리가 발견한 석유 매장지에 석유 시추선을 설치하여 석유채취를 허락하였으며, 채취한 석유를 같은 양의 석유로 나눌 것입니다."
 italy_md.8.o1: "모두에게 이득이 된 결과군!"
 italy_md.9.t: "이탈리아부터의 제안"
 italy_md.9.d: "The Italian national company ENI claimed they've found an oil deposit off the shores of our country... they offered to build oil wells and other infrastructure, while giving us our fair share. Should we accept?"
 italy_md.9.o1: "당연히 승낙이지"
 italy_md.9.o2: "우리나라의 자원이고 누구와도 나누기를 원하지 않는다!"
 italy_md.10.t: "우리의 제안이 거절되다!"
 italy_md.10.d: "Our fair offer sent to [From.GetName] was refused! They claim the oil deposit is theirs, and they don't want to share it with anyone."
 italy_md.10.o1: "댓가를 치를 것이다!"
 italy_md.11.t: "로마 연방으로부터의 초대"
 italy_md.11.d: "우리는 '로마 연방'에 초대를 받았습니다. 이 세력은 위대한 로마 제국을 제건하는데 그 목적을 두고 있습니다. 우리는 무엇을 어떻게 해야 할꺄요?"
 italy_md.11.o1: "세입 징수와 부채 상환."
 italy_md.12.t: "[From.GetName] 은(는) [Root.GetFactionName1]에 가입하려합니다."
 italy_md.12.d: "[From.GetName] 은(는) 세력에 가입하기를 원합니다. 받아들여야할까요?"
 italy_md.12.o1: "찬성"
 italy_md.12.o2: "안된다"
 italy_md.13.t: "긴축 조치"
 italy_md.13.d: "[From.GetName] 은(는) 우리나라의 사회기반시설 개발에 도움을 주기로 결심하였습니다. 우리는 더욱  더 강해지기 위해 이러한 제의를 기뻐하며 받아들였습니다!"
 italy_md.13.o1: "달콤하군"
 italy_md.13.o2: "의료"
 italy_md.13.o3: "복지"
 italy_md.14.t: "이탈리아 국가 시스템 소개"
 italy_md.14.d: "To access this tutorial again use the command \"event italy_md.23\" in the console. \n\n Italian Content by Simone - Traiano \n Collaborators: Mik; Zebrone"
 italy_md.14.o1: "항공우주 디시전 및 군사 중점"
 italy_md.14.o2: "매주 안정도"
 italy_md.14.o3: "정책과 지도자"
 italy_md.14.o4: "첫 페이지로 돌아가기"
 italy_md.15.t: "아마트리체의 지진!"
 italy_md.15.d: "오늘 이탈리아에 지진이 강타했습니다. 진원지는 라치오 아마트리체로 이탈리아 중부 지역이었습니다. 진도는 6.2로, 299명의 사람들이 움브리아, 라치오에서 사망했지만, 최소 238명의 사람들이 돌무더기 속에서 살아남았다고 보도됩니다. 또한 4,400명의 인력이 구조와 탐색 작업에 투입되었습니다."
 italy_md.15.o1: "모든 건물을 다시 지어야겠군!"
 italy_md.16.t: "라퀼라의 지진!"
 italy_md.16.d: "Today, Italy was hit by earthquake. The epicenter is located in L'Aquila, in Abruzzo, a central italian region. The earthquake measured 6.3 on the Richter Scale. As of now, 309 people have been reported killed. This was the deadliest earthquake since the 1980 Irpinia Earthquake, and due to the terrain the city lies on, this may be just the first of a long series of new earthquakes in the region."
 italy_md.16.o1: "빠르고 효율적인 재건설이 필요하다!"
 italy_md.17.t: "산업 협력을 제안하는 이탈리아"
 italy_md.17.d: "Both our countries have strong manufacturing sectors geared towards international trade and exports. Cooperation should benefit both parts."
 italy_md.17.o1: "수락한다"
 italy_md.18.t: "무역 협정을 제안하는 이탈리아"
 italy_md.18.d: "우리의 산업에서 당신의 원자재는 커다란 도움이 되었으며 또한 우리나라에서는 이탈리아의 패션과 음식에 열광할 것이라 확신하고 있기에, 이 거래는 우리 모두에게 득이 될 것입니다."
 italy_md.18.o1: "수락한다"
 italy_md.19.t: "이탈리브!!"
 italy_md.19.d: "Our country is better off without European Union involvement! We must hold a referendum and show everyone that the people of Italy want to quit this failed and obsolete union. It's finally time to make Italy great again!"
 italy_md.19.o1: "오늘 총선거를 연다!"
 italy_md.20.t: "아탈리브 결과 : 떠난다!"
 italy_md.20.d: "이탈리아 시민들은 현명하게 투표를 하여 이탈리아가 EU를 떠나는데 찬성을 하였습니다! 우리는 50조항에 의거하여 가능한한 빨리 협의를 시작해야합니다."
 italy_md.20.o1: "환상적이군"
 italy_md.21.t: "아탈리브 결과 : 남는다!"
 italy_md.21.d: "The Italian people have decided to vote against exit from the European Union. They must be brainwashed by European propaganda! Now we need to decide whether to trigger Article 50 or not, even if the situation in our country could get a little heated."
 italy_md.21.o1: "우리의 길을 가겠다"
 italy_md.22.t: "개혁 기대치"
 italy_md.22.d: "이탈리아의 정치적 불안정성을 반영하기 위해, 이탈리아에 새롭게 추가된 콘텐츠의 주요 특징 중 하나는 ‘개혁 기대치’라는 변동치입니다. 여권 연립정당에 속한 정당들은 국민을 만족시키는 정책을 시행하지 않을 경우 지지율이 급격히 하락하게 됩니다. 연립정당 중 한 정당의 지지율이 당선 당시 수치의 절반 이하로 떨어지면, 해당 정당은 연립정당에서 탈퇴하게 됩니다. 연립정부의 지지율이 지나치게 하락하면 정부 위기가 발생하며, 이는 재선을 통해 해결하거나 안정성을 희생하면서 정부를 유지하려는 시도를 통해 해결할 수 있습니다. 개혁 기대치 수치는 중점 사항, 사건, 결정에 영향을 받지만 고정된 값은 아닙니다. 법률, 세율, 금리, 안정성에 따라 개혁 기대치는 상승하거나 하락합니다. 또한 기술관료제 정부를 운영할 경우 시간이 지남에 따라 개혁 기대치가 증가하며, 개혁에 소요되는 정치적 비용도 증가합니다."
 italy_md.22.o1: "목록으로 돌아가기"
 italy_md.22.o2: "튜토리얼 끝내기"
 italy_md.23.t: "이탈리아 국가 시스템 소개"
 italy_md.23.d: "이 안내창은 이탈리아의 플레이에 적용된 새로운 디시전과 이벤트에 대해 소개하는 창입니다. 이 튜토리얼을 통해 이 시스템에 대한 자세한 설명을 확인할 수 있습니다."
 italy_md.23.o1: "개혁 기대치"
 italy_md.23.o2: "§t마피아§!"
 italy_md.23.o3: "다음 장으로 넘어가기"
 italy_md.23.o4: "튜토리얼 끝내기"
 italy_md.24.t: "살레르노-레조디칼라브리아-칼라브리아 고속도로"
 italy_md.24.d: "50년 이상의 건설 끝에 살레르노-레조디칼라브리아-칼라브리아 고속도로가 개통되게 되었습니다! 이 고속도로에는 엄청난 현대화 공사를 실행되었습니다. 많은 갈래길들이 기존의 도로를 따라 지어졌으며, 있던 갈래길들은 재건설되거나 정비되었습니다. 이제 고속도로가 개통되면서 지난 50년간 '이탈리아의 섬'으로 간주되던 칼라브리아에서 어디로든지 쉽게 이동할 수 있게되었습니다."
 italy_md.24.o1: "시간이군!"
 italy_md.25.t: "우주 디시전 및 군사 트리"
 italy_md.25.d: "By completing the \"Increase ASI Funding\" in the \"Great Projects\" branch of the Industrial focus tree you'll unlock access to a set of space-related decisions. A recurring decision allows you to dedicate more resources to Scientific Space Exploration, which will cost a significant amount of money but will provide research speed increase and a small boost to political power. Most importantly, growing your space program will eventually unlock the capability to setup an Outpost on the Moon which, in turn, will serve as a base for asteroid mining. Asteroid mining allows you to take advantage of strategic raw resources as long as you'll be willing to sustain the pretty significant yearly financial cost required to sustain such endeavour. At the same time you will need to keep your population sufficiently satisfied by the achievement of your space program, otherwise the great expenses and efforts it requires won't be justified any longer and further operations might have to be aborted.\n\nThe new military branch contains several focuses that allow you to specialize equipment, these trigger events that let you choose between reducing the production cost and reliability of a certain equipment type or increasing its cost and its combat stats. The bonuses granted in this way will be shown in a single idea for each military branch to avoid national spirits window cluttering. Another new feature is the ability to upgrade officers in the leadership section, this will retire an officer and create a new one with the same name but better stats. This process implies you will need to enlist the officer again if he was in use."
 italy_md.25.o1: "목록으로 돌아가기"
 italy_md.25.o2: "튜토리얼 끝내기"
 italy_md.26.t: "국내 파벌 변경"
 italy_md.26.d: "최근의 국내 정치 사건들로 인해 우리나라 내부 세력들의 상대적 영향력에 변화가 생겼습니다."
 italy_md.26.o1: "콘핀두스트리아"
 italy_md.26.o2: "피아차 아파리"
 italy_md.27.t: "이탈리아 무역협정"
 italy_md.27.d: "An Italian trade delegation has arrived in our capital. They seek mutual investment and further economic ties between our two countries"
 italy_md.27.o1: "이 어찌 좋지 아니한가"
 italy_md.28.t: "산업시설에 대한 사보타주!"
 italy_md.28.d: "Earlier today we received news that our industries and infrastructures were sabotaged by heavily equipped criminals. The industries were set on fire and huge explosions happened on highways. Our secret agencies discovered that the attacks are an answer from the feared leaders of the '§tMafia§!' who didn't take our recent actions against them lightly."
 italy_md.28.o1: "뒤로 물러설 필요가 있다"
 italy_md.28.o2: "지구상에는 놈들을 근멸해야할 많은 이유가 있다!"
 italy_md.29.t: "군사시설에 대한 사보타주!"
 italy_md.29.d: "Once again, an attack on our industries took place, as well as bomb attacks on buses and trains. Besides the damaged industries, an unestimated number of people died in the terror attacks in city centres. Once again, all these attacks are connected with organized criminality. When will this ever stop?"
 italy_md.29.o1: "뒤로 물러나야 한다"
 italy_md.29.o2: "겨우 이런걸로 우리를 멈출 수는 없다!"
 italy_md.30.t: "§t마피아§!"
 italy_md.30.d: "Organized criminality is a significant problem in Italy. In the game this is represented with the new §tMafia§! mechanics. All 4 southern states have a major \"Clan\" associated to them:  §2Cosa Nostra§! in §2Sicily§!, §0Camorra§! in §0Campania§!, §7'Ndrangheta§! in §7Calabria§! and §9Sacra Corona Unita§! in §9Puglia§!. Each clan has a strength value that directly reduces growth in the region in which they operate by reducing construction speed and increasing costs and time of foreign investments. Furthermore an average value of all strengths is used to calculate how much §tMafia§! affects the country as a whole through the §tMafia§! national spirit and by increasing focus tree expenditures cost. Industrial focuses now not only have a higher cost based on the current value of mafia influence, but will also increase mafia strength according to how much money criminals are able to siphon off the projects. To fight criminals Italy must employ its police forces and ensure Italians collaborate in the eradication of §tMafia§!. §tMafia§! strength increases passively over time, but this increase can be lowered, and even reversed, by taking some national focuses. Furthermore effectiveness of decisions to fight mafia will be based on the Police Effectiveness value. That value is influenced by some focuses, Corruption, Police funding, regional §tMafia§! strength and the amount of undercover agents in the region. Once average mafia strength has been negligible for some years a victory over §tMafia§! can be finally declared."
 italy_md.30.o1: "목록으로 돌아가기"
 italy_md.30.o2: "튜토리얼 끝내기"
 italy_md.31.t: "매주 안정도"
 italy_md.31.d: "Many focuses and mechanics in this rework are based on weekly stability. Since vanilla HOI4 has a hard cap on how much that modifier can influence stability, a national spirit has been introduced to ensure the values are applied correctly indefinitely. Most of the choices in the tree will be between an option that grants big immediate benefits in terms of stability, with an over time decrease, and an option that will instead lower your stability immediately but increase it gradually over time.\n\nThis is needed because HOI4 has a pool of stability with size 100 that can be filled or emptied by effects simply granting stability, not attached to a national spirit or other effects, and by weekly stability. When this pool is completely full or empty you can no longer add or subtract weekly stability. When this occurs this mechanic will add weekly stability to the multipurpose modifier. Because of this, if the weekly stability gain is reversed the multipurpose modifier stability will be affected only when the pool is completely full or empty again."
 italy_md.31.o1: "목록으로 돌아가기"
 italy_md.31.o2: "튜토리얼 끝내기"
 italy_md.32.t: "범죄조직의 끝!"
 italy_md.32.d: "몇 십년 전부터 그들의 암흑시장은 공공연하게 시시되어 왔지만, 이제 이러한 일은 일어나지 않을 것입니다. 우리의 범죄조직 소탕 개혁은 성공적이었습니다. 이탈리아는 이제 §t마피아§!로부터 자유롭습니다. 더 이상 우리 시민들은, 특히 남부 이탈리아의 시민들은 §t마피아§!들에게 고통받지 않아도 됩니다."
 italy_md.32.o1: "이탈리아에 있어서 역사적인 날이다!"
 italy_md.33.t: "이탈리아의 라테라노 조약 갱신 제안"
 italy_md.33.d: "새로운 이탈리아 정권은 또다시 이탈리아인들에 대한 교회의 막대한 영향력을 이용하려 합니다. 우리의 지지를 대가로 그들은 우리의 안전과 독립을 보장하겠다고 합니다. 어떻게 응답하시겠습니까?"
 italy_md.33.o1: "수락한다."
 italy_md.33.o2: "거절한다."
 italy_md.34.t: "투자를 요청하는 이탈리아"
 italy_md.34.d: "이탈리아는 자국의 경제 침체를 해결하기 위해 우리의 투자를 부탁합니다."
 italy_md.34.o1: "수락한다."
 italy_md.34.o2: "거절한다."
 italy_md.35.t: "투자 수락"
 italy_md.35.d: "우리의 발전 지원금 요청이 수락되었습니다."
 italy_md.35.o1: "좋은 거래였다"
 italy_md.36.t: "투자 거부됨"
 italy_md.36.d: "우리의 발전 지원금 요청이 거부되었습니다."
 italy_md.36.o1: "이게 최선이야."
 italy_md.37.t: "국가 변경하기 (Tag Switch)"
 italy_md.37.d: "새롭게 업데이트된 국가로 플레이 하시겠습니까?"
 italy_md.37.o1: "파다니아로 플레이한다"
 italy_md.37.o2: "양시칠리아로 플레이 한다"
 italy_md.38.t: "정부 위기"
 italy_md.38.d: "이탈리아인들은 필요하다고 느끼는 개혁을 실행할 이 정부의 능력에 대한 믿음을 잃었습니다. 야당은 새 선거를 요구하고 있지만, 몇 가지 정치적 타협으로 우리는 얼마간 더 자리를 유지할 수 있습니다. 어떻게 하시겠습니까?\n\n 정부 연립이 선출될 당시 인기도의 절반 아래로 떨어지면 정부 위기가 발생합니다. 이는 연립 정당들이 인기를 잃거나 연립에서 완전히 이탈하는 경우(인기를 너무 많이 잃으면 그렇게 합니다)에 일어날 수 있습니다. 소수 연립 정당이 집권당보다 훨씬 더 인기를 얻을 때도 정부 위기가 발생할 수 있습니다."
 italy_md.38.o1: "새로운 선거"
 italy_md.38.o2: "입법부의 합법적인 결론에 도달하기 위해 노력해봅시다."
 italy_md.39.t: "정책 및 지도자"
 italy_md.39.d: "The main mechanic of the political branch of the Italian Focus Tree are policies. Policies become available once their focus is completed, but you don't simply get the effects with the focus. Instead policies have been moved to decisions which can be enacted and repealed multiple times, allowing for greater roleplay and metagaming possibilities. But beware, repealing a policy won't provide the exact opposite effects it granted when enacted, especially in regards to Reform Expectancy.\n\nThe section of the focus tree above the policies is dedicated to party leaders. Since automatic retiring of party leaders following a lost election has been disabled for Italy, this section was created to ensure changes in leadership are possible."
 italy_md.39.o1: "목록으로 돌아가기"
 italy_md.39.o2: "튜토리얼 끝내기"
 italy_news.1.t: "이탈리아는 다시 파시즘 국가가 되었습니다."
 italy_news.1.d: "오늘 이탈리아 의회는 무력으로 제압당했고 파시스트 반란군은 의회에 자리를 잡았습니다. 시민들의 열광적인 인기로 공화국은 무너졌고 새로운 파시스트 정부가 그 자리를 대신하게 되었습니다. 이제 이탈리아에는 무슨 일이 일어날까요? 무솔리니가 이루려고 했던 '민족통일주의(Terre Irredente)'를 무력으로 아니면 외교적인 방법으로? 어떤 방법으로 이룰까요?"
 italy_news.1.o1: "이탈리아의 미래는 밝다"
 italy_news.1.o2: "파시스트 국가가 EU에? 받아들일 수 없다!"
 italy_news.1.o3: "Only time will tell."
 italy_news.2.t: "이탈리아 왕국의 복원!"
 italy_news.2.d: "Today, the monarchist supporters staged a coup in Rome, Italy, and the pretender King of the Savoy dynasty, Vittorio Emanuele IV, was called upon to become the new King of Italy. He immediately answered and accepted, and will now rule as an absolute monarch, the first since the end of World War II, when the Italian people voted to turn Italy into a republic."
 italy_news.2.o1: "대왕만세!"
 italy_news.2.o2: "흥미롭군."
 italy_news.3.t: "로마 제국의 귀환!"
 italy_news.3.d: "It sounds like a writing prompt, but it is reality. Earlier today, fascist supporters in Italy broke into parliament and declared that the republic was over and that it was going to be replaced by a new fascist government. The new Italian government claims to be the Roman Empire, and aims to recover the lands of the old Empire. Will this happen through diplomacy or war? Only time will tell."
 italy_news.3.o1: "왔노라, 보았노라, 이겼노라(Veni, Vidi, Vici)"
 italy_news.3.o2: "Let's hope the new 'Roman' monarch won't be called Julius Caesar."
 italy_news.3.o3: "야만인의 침공이 다시 있을까?"
 italy_news.3.o4: "흥미롭군"
 italy_news.4.t: "이탈리아의 유럽 친선정책"
 italy_news.4.d: "Recently the Prime Minister of Italy claimed that his country will now be following a policy of European friendship. The intentions of the European countries are to enlarge the union and eventually unify the countries into a single one, which is set to become the undisputed superpower of the European Continent."
 italy_news.4.o1: "흥미롭군"
 italy_news.5.t: "유럽 연설"
 italy_news.5.d: "The European Union has been slowly taking steps towards more and more cooperation between the European Countries. Years and years of wars and battles have finally ended and Europe is now moving towards a process of unification. Since the creation of the EU there has been a huge development of the countries who agreed to Schengen and the Eurozone, but by unifying the whole continent under a single government and banner, Europe will finally show to the world that the old powers are still to be considered on par with the growing economies of Asia and America. The last step towards European unification has been taken."
 italy_news.5.o1: "하나의 유럽!"
 italy_news.5.o2: "저들을 지켜볼 필요가 있다."
 italy_news.5.o3: "유럽을 영광의 길로 이끌어야한다!"
 italy_news.7.t: "'§t마피아§!와의 전쟁'을 선언하는 이탈리아!"
 italy_news.7.d: "조직범죄는 이탈리아에서의 가장 큰 문제입니다. 수십 년 동안 그들의 그늘진 사업은 이탈리아 정부의 영향을 거의 받지 않고 일어날 수 있었습니다. 하지만, 오늘날 이탈리아는 공식적으로 전국의 조직범죄들을 근절하기 위해서 '과정'을 시작했습니다. 이 '전쟁'이 얼마나 효과적일지는 시간 만이 알 수 있을 것입니다."
 italy_news.7.o1: "우리는 준비가 되었다."
 italy_news.7.o2: "알겠다"
 italy_news.8.t: "이탈리아의 §t마피아§!와의 전쟁은 성공적입니다!"
 italy_news.8.d: "Who would have believed this some years ago? Probably no one, but we can say for certain right now that the last remnants of what was once called §tMafia§! are now gone. The last leaders of the feared criminal organization were processed lately and, even though some activity could still be happening in the shadows, the §tMafia§! as a whole has finally been taken down!"
 italy_news.8.o1: "우리나라의 또 다른 위대한 승리다"
 italy_news.8.o2: "알겠다"
 italy_news.9.t: "이탈리아의 §t마피아§!와의 전쟁은 실패하였습니다!"
 italy_news.9.d: "분명, 이탈리아에서 온 소식은 가장 큰 시도조차 마침내 §t마피아§!를 이탈리아에서 몰아내지 못했다고 말합니다. 두려운 범죄 조직의 역습으로 이탈리아 정부가 권력을 장악하는 것을 막을 수 있다는 사실이 이탈리아가 §t마피아§!에게 '전쟁'을 사실상 막을 만큼 충분하다는 것으로 입증되었습니다."
 italy_news.9.o1: "우리는 해야만 했다."
 italy_news.9.o2: "흥미로운 전개로군."
 mafia.1.t: "갱단 사이의 정착을 위한 갈등"
 mafia.1.d1: "우리 잠입 요원들은 경쟁 조직의 영역에 침입해 적절한 사람들에게 불편한 질문을 던짐으로써 경쟁 갱단들 사이에 충돌을 일으키는 데 성공했습니다. 이는 갱단을 크게 약화시키겠지만, 민간인이 내분에 휘말릴 수 있습니다."
 mafia.1.a: "참으로 불행한 대가이다."
 mafia.2.t: "우리 요원이 발각되었습니다!"
 mafia.2.d1: "Our undercover agents' attempts at provoking infighting between the gangs have been discovered, the fate of the agents is still unknown, but we can imagine it wasn't pleasant."
 mafia.2.a: "다음번엔 꼭 잡아낼것이다."
 mafia.3.t: "§t마피아§! 근거지 소탕 완료"
 mafia.3.d1: "우리 잡입 요원이 제공한 귀중한 정보를 통해서 현장을 급습한 경찰이 §t마피아§! 근거지를 제거하고 여러 범죄자들을 포획할 수 있었습니다. 우리는 이 성공을 모든 매체를 통해 보도할 것입니다."
 mafia.3.a: "이제 다음 것도 계속 잡아내자"
 mafia.4.t: "우리 요원이 발각되었습니다!"
 mafia.4.d1: "§t마피아§! 근거지를 폭로하려는 우리 잡입 요원의 시도가 발각되었습니다. 우리 요원의 생사 여부는 아직 알 수 없지만, 그들이 좋은 대우를 해주지 않을 것이라는 사실은 분명합니다."
 mafia.4.a: "다음번엔 꼭 잡아낼것이다."
 mafia.6.t: "불법 폐기물 투기"
 mafia.6.d: "Another illegal Dump has been discovered in §0Campania§!, untreated toxic leaks have contaminated irrigation water near cultivated fields. §0Camorra§! is the main suspect."
 mafia.6.o1: "이 문제를 처리해야한다.\"."
 mafia.6.o2: "여기에 신경 쓸 시간이 없다."
 mafia.7.t: "§7'Ndrangheta§! Drug Smugglers"
 mafia.7.d: "Our informers have notified us of an incoming shipment of drugs from South America that is expected to soon arrive at the Gioia Tauro port."
 mafia.7.o1: "이 문제를 처리해야한다."
 mafia.7.o2: "여기에 신경 쓸 시간이 없다."
 mafia.8.t: "§9풀리아§!에서의 무기 밀수"
 mafia.8.d: "Our spies have informed us of an upcoming shipment of weapons from Eastern Europe, predicted to arrive in §9Puglia§! for the §9Sacra Corona Unita§!."
 mafia.8.o1: "이 문제를 처리해야한다."
 mafia.8.o2: "여기에 신경 쓸 시간이 없다."
 mafia.9.t: "§2Cosa Nostra§! Drug Smugglers"
 mafia.9.d: "Our informers have notified us of an incoming shipment of drugs from South America that is expected to arrive in §2Sicily§! soon."
 mafia.9.o1: "이 문제를 처리해야한다."
 mafia.9.o2: "여기에 신경 쓸 시간이 없다."
 mafia.10.t: "§0카모라§! 마약 밀수업자"
 mafia.10.d: "Our informers have notified us of an incoming shipment of drugs from South America that is expected to arrive in §0Campania§! soon."
 mafia.10.o1: "이 문제를 처리해야한다."
 mafia.10.o2: "이곳에 신경 쓸 여유가 없다!"
 mafia.11.t: "§7드랑케타§! 담배 밀수범"
 mafia.11.d: "Our informers have notified us of an ongoing smuggling operation of cigarettes in §7Calabria§!."
 mafia.11.o1: "이 문제를 처리해야한다."
 mafia.11.o2: "이럴 시간이 없다"
 mafia.12.t: "§9사크로 코로나 우니타§! 담배 밀수꾼"
 mafia.12.d: "Our informers have notified us of an ongoing smuggling operation of cigarettes in §9Puglia§!."
 mafia.12.o1: "이 문제를 처리해야한다."
 mafia.12.o2: "이럴 시간이 없다"
 mafia.13.t: "§9풀리아§!에서 의심스러운 부패 현장 발각"
 mafia.13.d: "우리 잠입 요원들은 §9풀리아§!에서 부패 현장이 의심된다고 보고하였습니다."
 mafia.13.o1: "당장 체포해라!"
 mafia.13.o2: "이건 그저 엄청난 시간 낭비일 뿐이다"
 mafia.14.t: "§9풀리아§!에서 의심스러운 불법 계약 발각"
 mafia.14.d: "우리 정보원들은 의심스러운 불법 계약의 가능성을 보고하였습니다."
 mafia.14.o1: "The DIA must do something about this."
 mafia.14.o2: "조사가 진행되기를 기다리는 것이 낫겠다."
 mafia.14.o3: "그저 시간 낭비일 뿐이다."
 mafia.15.t: "체포 완료"
 mafia.15.d: "전면적인 조사가 이루어진 끝에 우리 팀은 최근에 발생한 불법 계약과 범죄자들의 연결고리를 밝혀냈습니다."
 mafia.15.o1: "계속해서 다음 단계로 넘어가자"
 mafia.16.t: "대응 실패"
 mafia.16.d: "전면적인 조사가 진행되었지만 우리 팀은 최근 발생한 불법 계약과 범죄자들의 연결고리를 추적하는데 실패하였고, 이로써 범죄자들은 앞으로 이를 피해갈 수 있는 방법을 찾아냈을 것입니다."
 mafia.16.o1: "젠장! 다음엔 꼭 체포할 것이다!"
 mafia.17.t: "§7칼라브리아§!에서 보스의 근거지로 의심되는 지역 발견"
 mafia.17.d: "우리 잠입 요원들은 §7칼리브리아§!에서 보스의 근거지로 의심되는 장소에 대해 보고하였습니다."
 mafia.17.o1: "내부에서든, 외부에서든, 기습적인 검거를 진행하라"
 mafia.17.o2: "그저 시간 낭비일 뿐이다"
 mafia.18.t: "§7칼리브리아§!에서 의심스러운 대량의 마약 밀수 현장 포착"
 mafia.18.d: "우리 정보원들은 지오이아 타우로 항구에서 거대한 마약 밀수에 대한 가능성을 보고했습니다."
 mafia.18.o1: "The DIA must do something about this, now."
 mafia.18.o2: "조사가 진행되기를 기다리는 것이 낫겠다."
 mafia.18.o3: "그저 시간 낭비일 뿐이다."
 mafia.19.t: "체포 완료"
 mafia.19.d: "전면적인 조사가 이루어진 끝에 우리 팀은 최근 지오이아 타우로 항구에서 발생한 마약 운송책과 범죄자들의 연결고리를 밝혀냈습니다."
 mafia.19.o1: "계속해서 다음 단계로 넘어가자"
 mafia.20.t: "대응 실패"
 mafia.20.d: "우리 팀은 마약 운송책이 변경되었다는 사실을 알아냈습니다. 우린 그들을 추적하는데 실패하였습니다."
 mafia.20.o1: "젠장! 다음엔 꼭 체포할 것이다!"
 mafia.21.t: "§0카모라§! 조직 내부의 정의를 위한 협력자"
 mafia.21.o1: "심문과 재판이 끝나기 전까지는 생포하자"
 mafia.21.o2: "이건 그저 엄청난 시간 낭비일 뿐이다"
 mafia.22.t: "스캄피아에서의 폭로"
 mafia.22.d: "One of our agents has infiltrated a large drug hotspot (Piazza di spaccio) in Scampia, an infamous district of Naples."
 mafia.22.o1: "The DIA must do something about this now, before it's too late."
 mafia.22.o2: "조사가 진행되기를 기다리는 것이 낫겠다."
 mafia.22.o3: "요원을 철수시켜라, 그곳은 너무 위험하다."
 mafia.23.t: "체포 완료"
 mafia.23.d: "After deep investigations our dedicated team has exposed the criminal network behind the drug operations in the Neapolitan district, but if we don't eradicate the problem entirely, others will take their places."
 mafia.23.o1: "계속해서 다음 단계로 넘어가자"
 mafia.24.t: "대응 실패"
 mafia.24.d: "우리 팀은 용의자들이 사라졌다는 사실을 발견했습니다. 우리는 그들을 추적하는데 실패하였습니다."
 mafia.24.o1: "젠장! 다음엔 꼭 체포할 것이다!"
 mafia.25.t: "\"피조 (Pizzo)\""
 mafia.25.d: "Thanks to our agents we have the chance to reduce the pizzo gains for §2Cosa Nostra§!. We can hit where it hurts most, their cash deposits. Pizzo is the tax that the mafia applies to activities in their territory; it is estimated that 80% of Palermitan businesses pay the pizzo."
 mafia.25.o1: "이를 승인한다. 꼭 우리가 원하는 결과를 얻기를 바란다."
 mafia.25.o2: "The risk is too high; I don't want more blood on the streets."
 mafia.26.t: "§2시칠리아§! 내 지역 격차에 따른 부패 현장"
 mafia.26.d: "우리 요원들은 §2시칠리아§!의 자율 지역에서 대규모 부패가 이루어지고 있다는 정보를 입수하였습니다."
 mafia.26.o1: "The DIA must do something about this now, before they discover our plans."
 mafia.26.o2: "조사가 진행되기를 기다리는 것이 낫겠다."
 mafia.26.o3: "No, if we start to arrest the corrupted they could start again with the bombs."
 mafia.27.t: "체포 완료"
 mafia.27.d: "After deep investigations our dedicated team has arrested all the suspects in this corruption case."
 mafia.27.o1: "계속해서 다음 단계로 넘어가자"
 mafia.28.t: "대응 실패"
 mafia.28.d: "우리 팀은 용의자들이 사라졌다는 사실을 발견했습니다. 우리는 그들을 추적하는데 실패하였습니다."
 mafia.28.o1: "젠장! 다음엔 꼭 체포할 것이다!"
 ITA_elected_reactionary_party: "오성운동 투표!"
 ITA_political_reforms_done: "정치 개혁 끝"
 ITA_continue_war_on_mafia_tt: "전쟁을 지속하라!"
 ITA_end_war_on_mafia_tt: "§t마피아§!와의 전쟁 종식!"
 ITA_held_referendum_europe: "이탈리브 국민투표 개최"
 ITA_italeave_referendum: "이탈리아 국민들에게는 선택권이 있습니다. EU에 잔류해야할까요? 아니면 떠나야할까요?"
 ITA_party_chosen: "이전 정당 조치를 폐지하지 않고 정당을 선택했습니다."
 ITA_ideology_chosen: "이전 정당 조치를 폐지하지 않고 이념을 선택했습니다."
 ITA_undemocratic_coup: "Has overthrown democracy."
 ITA_restored_democracy: "민주주의를 복원하였다."
 ITA_accepted_oil_investments_africa: "석유 사업 투자 승인"
 italy_china_trade_deal: "이탈리아에 대한 중국의 투자에는 중국 상품이 유럽에 우선적으로 진입할 수 있도록 중국과 이탈리아 간의 무역 협정을 체결한다는 조건이 붙었습니다."
 ITA_mafia_modifier: "§t\"마피아\"§!"
 ITA_mafia_modifier_TT: "조직범죄는 이탈리아의 거대한 문제입니다. 특히 남부 지방에서는 지역 업체들이 §t마피아§!에게 위협과 압박을 받고 있으며, 마피아는 공무원을 매수하고 범죄자를 추적하려는 경찰과 검사를 협박하기도 합니다."
 ITA_party_propaganda_modifier: "선전"
 ITA_party_propaganda_modifier_TT: "이탈리아에 옛 영광을 되찾아 주려면 정부에 대한 신뢰가 필요하며, 우리의 언론은 이탈리아 국민이 우리에게 필요한 모든 지지를 보내도록 해야 합니다."
 mafia_foreign_investment: "§tMafia§! infiltrations in foreign investment projects."
 mafia_foreign_investment_TT: "해외 투자 사업에 대한 §t마피아§!의 침투는 비용을 증가시켜 사업 실현 가능성을 낮춥니다."
 cosa_nostra_infiltrations_modifier: "§2Cosa Nostra§! infiltration in construction projects"
 camorra_infiltrations_modifier: "건설 프로젝트에 대한 §0카모라§!의 침투"
 ndrangheta_infiltrations_modifier: "§7드랑게타§!의 건설 프로젝트 침투"
 sacra_corona_unita_infiltrations_modifier: "§9사크로 코로나 우니타§!의 건설 프로젝트 침투"
 mafia_infiltrations_TT: "조직범죄가 뇌물과 부패를 통해 건설 사업에 책정된 자금의 상당 부분을 가로채는 것은 흔한 관행입니다."
 frequent_high_tides: "지속적으로 높아지는 해수면"
 frequent_high_tides_TT: "베네치아는 세계적으로 유명한 도시로, 현존하는 가장 상징적인 관광지 중 하나로 널리 꼽힙니다. 그러나 베네치아 석호 한가운데라는 위태로운 입지와 기후 변화로 인한 해수면 상승 탓에 도시의 침수 빈도가 서서히, 그러나 꾸준히 증가하고 있습니다."
 ITA_party_popularity_drift_modifier: "개혁 기대치"
 ITA_reform_expectance_TT: "사람들은 언제나 현재 상황에 불만을 품지만, 그 불만은 종종 정당합니다. 이탈리아에는 개혁이 절실히 필요하지만, 국민이 원하는 개혁이 나라가 실제로 필요로 하는 개혁과 같지 않을 수도 있다는 점을 유의해야 합니다. \n\n현재 개혁 기대치: [?drift_switch_var_base|3+]\n\n값이 높으면 정부가 국민의 기대에 부응하고 있어 연립이 지지를 얻으며, 값이 낮으면 지지를 잃습니다. 개혁 기대치는 매월 국가 상황(안정도, 법률, 세금, 금리)에 따라 변하며 중점, 결정, 사건의 영향을 받을 수 있습니다."
 unfinished_infrastructures: "완성되지 않은 기반시설"
 unfinished_infrastructures_TT: "이 지역의 기반시설은 전설적일 정도로 공사가 지연되어 그 결과 극도로 낙후되어 있습니다."
 messina_strait_bridge: "메시나 해협을 연결하는 다리"
 messina_strait_bridge_TT: "수 세기에 걸친 꿈과 실패한 계획 끝에, 전설로만 전해지던 메시나 해협 대교가 마침내 완공되었습니다. 이 공학의 경이는 세계에서 단연 가장 큰 현수교입니다. 부디 시칠리아가 유럽의 나머지 지역을 따라잡는 데 도움이 되길 바랍니다."
 ITA_nimby_culture: "님비 (NIMBY)의 영향"
 ITA_nimby_culture_TT: "\\"우리 집 뒷마당만은 안 된다\\"를 외치는 운동은 이념적으로 거의 모든 종류의 기반시설 공사에 반대하며, 대개 비과학적이거나 음모론적인 주장에 근거하여 공사를 중단하거나 다른 곳으로 옮기라고 시위합니다."
 monuments_restored: "기념비 복구"
 monuments_restored_TT: "이 지역에서 대규모 통합 복원 사업이 완료되어 관광객 유입과 전반적인 경제적 안녕이 크게 증가했습니다."
 ITA_election_tips: "선거 도움말"
 ITA_election_tips_desc: "지속적인 돈의 흐름과 유입은 \"소비 보너스\"와 이어집니다. 이는 납세자들의 돈으로 사람들의 투표권을 사는 과정을 더욱 납득할 수 있도록 설명하는 방법입니다."
 ITA_election_tips_2: "선거 도움말"
 ITA_election_tips_2_desc: "A constant influx of money is being channeled into \"bonuses for consumption\", a more acceptable way to describe the process of buying people's vote with taxpayers money."
 ITA_election_tips_3: "선거 도움말"
 ITA_election_tips_3_desc: "A constant influx of money is being channeled into \"bonuses for consumption\", a more acceptable way to describe the process of buying people's vote with taxpayers money."
 ITA_vatican_support: "성좌로부터의 지원"
 ITA_vatican_support_desc: "라테라노 조약을 갱신함으로써 우리는 교황청의 상당한 지지를 확보했으며, 이는 국민 대다수가 여전히 독실한 신자라는 점을 고려할 때 특히 중요합니다."
 ITA_royal_family: "왕실"
 ITA_royal_family_desc: "이탈리아 왕실의 생활은 이탈리아 국민이 가장 많이 주목하는 사회 현상 중 하나가 되었습니다."
 ITA_decentralized_nation: "국가의 분권화"
 ITA_decentralized_nation_desc: "많은 권한이 국가에서 지방 당국으로 이양되었으며, 그에 따라 많은 재정 자원도 이동했습니다."
 ITA_war_with_Mafia: "§t마피아§!를 향한 전쟁"
 ITA_war_with_Mafia_desc: "더 이상 우리나라에서 조직범죄의 존재를 용납하지 않을 것입니다. 이들을 완전히 소탕하기 위해 경찰 작전에 추가 자원을 투입해야 합니다."
 ITA_party_propaganda: "전시 선전"
 ITA_party_propaganda_desc: "우리의 적들은 우리의 거대한 힘 앞에서 떨게 될 것이다."
 ITA_party_approved_media_f: "정당이 승인한 매체"
 ITA_party_approved_media_f_desc: "언론은 국가를 위해 이탈리아의 형제자매들이 관리할 것이다."
 ITA_party_approved_media_c: "정당이 승인한 매체"
 ITA_party_approved_media_c_desc: "언론은 우리의 새로운 언론인 집단이 관리할 것이다."
 ITA_traditional_values: "Traditional Values"
 ITA_traditional_values_desc: "-신, 조국, 가족-이 우리의 새로운 표어가 될 것이다"
 ITA_expropriations: "몰수"
 ITA_expropriations_desc: "더 이상 착취자도, 특권도 없다."
 ITA_legacy_of_the_PCI: "이탈리아 공산당 (PCI)의 유산"
 ITA_legacy_of_the_PCI_desc: "The PCI, Italian Communist Party, was the biggest Communist Party of the West and widely influenced Italian politics for decades. After the end of the Cold War its power vanished and its members formed a myriad of small parties, but its ideology still strongly influences the beliefs of a significant portion of Italians."
 ITA_bloated_local_administrations: "부풀어 오른 지방행정체계"
 ITA_bloated_local_administrations_desc: "지방 행정, 특히 남부 지방의 행정은 실업자에게 안정적인 일자리를 제공하는 손쉬운 수단으로 활용되어 왔습니다. 분명 인기 있는 조치이지만, 그로 인해 지방 행정은 비용이 많이 들고 비효율적이 되었습니다."
 ITA_legalized_prostitution: "합법화된 매춘"
 ITA_legalized_prostitution_desc: "성매매는 다른 많은 직업과 같은 직업이다."
 ITA_citizenship_income_spirit: "시민으로써의 소득"
 ITA_citizenship_income_spirit_desc: "시민들은 매월 소득을 지급받게 됩니다"
 ITA_high_minimum_wage: "높은 최저 임금"
 ITA_high_minimum_wage_desc: "노조에 가입하지 않은 사람들은 임금을 올릴 수 있도록 국가의 도움을 받게 됩니다."
 ITA_flat_tax: "단일세율제 (Flat Tax)"
 ITA_flat_tax_desc: "Following Russia's example we will apply a flat tax. This will mostly benefit the wealthy and we hope that this will trickle down. The revenue lost might mean that we won't have enough money to keep healthcare and social services at previous levels."
 ITA_carbon_tax: "탄소세 (Carbon tax)"
 ITA_carbon_tax_desc: "This tax will steer the private sector towards green energy."
 ITA_green_subsidies: "환경 친화 보조금"
 ITA_green_subsidies_desc: "우리는 세상을 구하고자 하는 이들에게 보조금을 지급한다."
 ITA_gmos_banned: "유전자 변형 식품 (GMO) 금지"
 ITA_gmos_banned_desc: "더 이상 실험실에서 식량을 만들지 않는다."
 ITA_happy_degrowth_spirit: "행복한 후퇴"
 ITA_happy_degrowth_spirit_desc: "우리의 새로운 경제 기조는 우리가 더 나은 삶을 살고 지구가 더 오래 존속하도록 도울 것이다."
 ITA_capital_flight: "자본도피"
 ITA_capital_flight_desc: "투자자, 사업가, 은행가들은 우리나라를 자신들의 돈을 맡길 매력적인 곳으로 여기지 않습니다. \n §Y세수§!는 §G1%§! 증가합니다\n"
 ITA_inefficient_administration_1: "비효율적인 행정부"
 ITA_inefficient_administration_2: "비효율적인 행정부"
 ITA_inefficient_administration_3: "비효율적인 행정부"
 ITA_migration_tolerated: "이민 허용"
 ITA_migration_tolerated_desc: "우리는 제3세계의 상황을 이해하며 더 나은 미래를 찾는 사람들을 용인합니다."
 ITA_divide_et_impera: "분할하여 통치하라"
 ITA_divide_et_impera_desc: "'Divide Et Impera', meaning 'Divide And Rule' literally means gaining and maintaining power by breaking up larger concentrations of power into pieces that individually have less power than the one implementing the strategy. This idea should guide our policy if we want to form a New Rome."
 ITA_peaceful_takeovers: "평화적 지배"
 ITA_peaceful_takeovers_desc: "역사는 군사력만으로는 유럽을 통일하기에 충분하지 않음을 보여주었습니다. 우리의 영토를 되찾으려면 새로운 방법을 사용해야 하며, 집요하고 표적화된 선전이 우리의 영향력을 행사할 비옥한 토양을 만들어 줄 것입니다."
 ITA_mafia: "§t\"마피아\"§!"
 ITA_mafia_desc: "조직범죄는 이탈리아의 거대한 문제입니다. 특히 남부 지방에서는 지역 업체들이 §t마피아§!에게 위협과 압박을 받고 있으며, 마피아는 공무원을 매수하고 범죄자를 추적하려는 경찰과 검사를 협박하기도 합니다."
 ITA_parliament_dismantled: "의회 해체"
 ITA_parliament_dismantled_desc: "행정부는 권력을 장악하고 의회를 폐쇄했으며, 나라는 새로운 체제로의 전환을 완료하고 있습니다."
 ITA_kingdom_restored: "Restoration of the Savoy Dynasty"
 ITA_kingdom_restored_desc: "사보이아 왕조가 재건되었습니다. 이탈리아는 이제 다시 한번 왕국입니다."
 ITA_new_march_on_rome: "파시즘의 부활"
 ITA_new_march_on_rome_desc: "무솔리니는 권력을 잡기 위해 검은 셔츠단과 함께 로마로 진군했습니다. 우리는 파시스트 운동이 두 번째 진군을 조직하여 공식적으로 파시즘을 다시 받아들이도록 도와야 합니다. 이제 열차는 이미 정시에 운행되고 있으니, 이번에는 처음부터 정복에 집중할 수 있습니다."
 ITA_southern_question: "남부의 저항"
 ITA_southern_question_desc: "이탈리아 남부는 언제나 사보이아 왕조에 완강했습니다. 이탈리아가 통일되던 당시, 남부인들의 시각에서 천인대 원정은 '정복 행위'였으며, 따라서 그들은 지금 우리의 국왕에게 반대하고 있습니다."
 ITA_migrants_from_africa: "아프리카의 불법 이민"
 ITA_migrants_from_africa_desc: "이민자들은 범죄 증가, 사회적 긴장, 종교적 긴장을 불러옵니다. 우리는 이러한 불법 체류자들이 이곳에 머무르도록 두지 않을 것입니다."
 ITA_migrants_from_africa_encouraged: "북아프리카의 이민 장려"
 ITA_migrants_from_africa_encouraged_desc: "우리는 고령화로 인한 인구 감소에 대응하기 위해 이 젊은이들이 필요합니다. 이민 1세대는 우리 자국민보다 필요로 하는 것이 적습니다."
 ITA_migrants_from_africa_limited: "북아프리카의 이민 제한"
 ITA_migrants_from_africa_limited_desc: "이민자들은 범죄 증가, 사회적 긴장, 종교적 긴장을 불러옵니다. 우리는 이 이민자들이 이곳에 오지 못하도록 억제할 것입니다."
 ITA_restore_the_currency_idea: "리라 (Lira) 화폐의 복원"
 ITA_restore_the_currency_idea_desc: "리라는 이탈리아가 사상 최대의 경제 호황을 누리던 시절을 함께했으며, 우리는 이것이 다시 일어나도록 리라를 다시 채택할 것입니다. 돌아온 리라를 환영합니다! \n §Y부채 금리§!: §R+[?1]%§!"
 ITA_mafia_sabotages_industry: "§t마피아§!의 산업 사보타주"
 ITA_mafia_sabotages_industry_desc: "§t마피아§!가 우리 민간 산업 부문을 공포에 떨게 하고 있습니다. 우편물 폭탄과 폭파 사건이 우리나라의 거리에서 빈번하게 일어나고 있습니다."
 ITA_mafia_sabotages_military: "§t마피아§!의 군 사보타주"
 ITA_mafia_sabotages_military_desc: "피초티들이 질서를 회복하기 위해 파견된 군 호송대를 매복 공격하거나 우리 군을 겨냥한 차량 폭탄 테러를 조직하고 있습니다. 부패도 증가하고 있습니다."
 ITA_victory_over_mafia: "§t마피아§!에 대한 승리"
 ITA_victory_over_mafia_desc: "§t마피아§!와의 전쟁은 길고 가혹했지만, 마침내 승리를 선언할 수 있습니다. 새로운 의식 있는 국가가 유럽에서 떠오르고 있습니다."
 ITA_zombie_companies: "좀비 회사"
 ITA_zombie_companies_desc: "기업 파산을 막아 일자리를 지키려는 우리의 노력은 경제의 경쟁력을 크게 떨어뜨렸지만, 적어도 일자리를 지킨 이들의 충성은 확보했습니다."
 ITA_dynamic_economy: "역동적인 경제"
 ITA_dynamic_economy_desc: "기업이 도태되고 새로운 효율적인 기업으로 대체되도록 허용함으로써 우리는 경제의 전반적인 경쟁력을 높입니다."
 ITA_legalized_light_drugs: "약한 마약의 합법화"
 ITA_legalized_light_drugs_desc: "§Y세입§!이 §G2%§! 증가합니다\n\n가벼운 마약을 합법화 함으로써 세입이 더욱 증가하였고, 법원에서 사소한 문제로 시간을 뺏기지 않도록 하여 법원의 효율성을 상당히 증가시켰습니다."
 ITA_legalized_all_drugs: "마약 합법화"
 ITA_legalized_all_drugs_desc: "§Y세입§!이 §G3%§! 증가합니다\n\n마약을 합법화 함으로써 세입이 더욱 증가하였고, 법원에서 사소한 문제로 시간을 뺏기지 않도록 하여 법원의 효율성을 상당히 증가시켰습니다."
 ITA_tax_evasion: "탈세"
 ITA_tax_evasion_desc: ""
 ITA_brain_drain: "두뇌 유출 (Brain Drain)"
 ITA_brain_drain_desc: "역량보다 연공서열을 중시하는 노동 시장과 자원이 부족한 교육 제도는 특히 남부 지방에서 청년들의 기회 부족을 낳았습니다. 그 결과 더 역동적인 경제를 찾아 떠나는 이민자가 늘어나고 있습니다."
 ITA_building_abuse: "건물의 남용"
 ITA_building_abuse_desc: "Decreases §YTax Revenue§! by §R5%§!\n It is common practice in many parts of the country to ignore building safety laws and regulatory plans to lower costs. Local authorities tend to turn a blind eye in order to not have to deal with §tMafia§! and over the years many governments have regularly implemented building amnesties, keeping unsafe buildings in place in order to have them taxed."
 ITA_outdated_education: "전통적인 교육 시스템"
 ITA_outdated_education_desc: "우리의 교육 제도는 수십 년 전에 개발된 모델에 머물러 있으며, 개혁의 부재로 상당한 돈을 절약했지만 다음 세대는 미래의 도전에 대비하지 못하고 있습니다. 명백한 결함에도 불구하고 지식인 엘리트는 이 구식 제도를 자랑스러워하며 제도와 그 근저의 문화적 문제를 개혁하려는 모든 시도에 반대합니다."
 ITA_gmos_encouraged: "유전자 변형 식품 (GMO) 장려"
 ITA_gmos_encouraged_desc: "이탈리아는 인구 밀도가 높고 실제로 경작 가능한 토지는 일부에 불과합니다. GMO 덕분에 우리는 농업 수확량을 개선하고 예기치 못한 사건에 더 잘 견디는 농지를 만들었으며, 해외 수입 의존도도 낮추었습니다."
 ITA_tourist_destination: "주요 관광지"
 ITA_tourist_destination_desc: "이탈리아는 아름다운 바다, 웅장한 산, 풍부한 역사 덕분에 세계에서 가장 중요한 관광지 중 하나입니다."
 ITA_flexible_labour_market: "유연한 노동 시장"
 ITA_flexible_labour_market_desc: "노동자에 대한 과도한 규제를 제한함으로써 노동 시장이 더 유연하고 효율적으로 되었습니다."
 ITA_rigid_labour_market: "엄격한 노동 시장"
 ITA_rigid_labour_market_desc: "노동자를 보호하는 규제를 강화함으로써 우리는 노동 시장의 효율이 어느 정도 감소하는 것을 감수하고 수백만 가정의 안정을 높였습니다."
 ITA_privatizations: "민영화"
 ITA_privatizations_desc: "공기업을 민영화함으로써 우리는 막대한 자금을 회수했으며 동시에 지출도 꾸준히 줄였습니다."
 ITA_IRI: "IRI (산업 재건 기관)"
 ITA_IRI_desc: "산업재건청(IRI)은 비용은 많이 들지만 국가의 전략 자산에 대한 폭넓은 통제권을 우리에게 부여하는 강력한 수단입니다."
 ITA_underdeveloped_south: "남부의 의문"
 ITA_underdeveloped_south_desc: "깊이 뿌리내린 구조적 문제가 이탈리아 남반부를 괴롭히며 나라 전체의 발전을 늦추고 있습니다."
 ITA_closed_nation: "전체주의 정부"
 ITA_closed_nation_desc: "우리나라의 일은 우리가 알아서 할것이다."
 ITA_economic_freedoms: "경제적 자유"
 ITA_economic_freedoms_desc: "경제적 자유는 우리나라를 성장시키고 한때 위대했던 제국을 되살리는 데 필요한 자원을 제공할 것입니다."
 ITA_war_economy_spirit: "전시 경제"
 ITA_war_economy_spirit_desc: "우리의 정당한 영토를 점령한 야만인들은 수가 많고 강력한 동맹이 있으니, 이들에 맞서려면 전쟁에 맞춰진 경제가 필요하다."
 Planned_Economy_ITA: "계획 경제"
 list_of_statalist_parties_TT: "List of statist parties: \n [socialism_L] \n [communist_state_L] \n [anarchist_communism_L] \n [Conservative_L] \n [Autocracy_L] \n [Neutral_green_L] \n [neutral_Social_L] \n [Neutral_Communism_L] \n [Nat_Populism_L] \n [Nat_Fascism_L] \n [Nat_Autocracy_L] \n [Monarchist_L] \n"
 list_of_expansionist_parties_TT: "List of expansionist parties: \n Western Autocrats \n [communist_state_L] \n [Autocracy_L] \n [Neutral_Autocracy_L] \n [oligarchism_L] \n [Neutral_Communism_L] \n [Nat_Fascism_L] \n [Nat_Autocracy_L] \n [Monarchist_L] \n"
 has_expansionist_government_TT: "확장주의 정부를 가지고 있어야 합니다. \n 영유권 주장 중점에 설명된 목록을 참고하세요."
 ITA_increase_police_effectivness_TT: "이것은 경찰 효율을 증가시킬 것입니다."
 ITA_empower_the_king_TT: "§Y샤보이 왕가가 돌아와 자국을 이끌 것입니다!§!\n"
 ITA_focus_reduction_mafia_strength_TT: "이 조치는 조직화된 범죄 조직들의 수입을 감소시키고, 그들의 힘을 약화시킬 것입니다."
 ITA_reopen_brothels_TT: "§Y세입§!이 §G1%§! 증가함\n"
 monument_restored_TT: "이 기념물을 복원하면 사무 부문 하나, 공유 건물 슬롯 1개, 그리고 §G10%§!의 주 건설 속도가 추가됩니다."
 romanization_ITA: "로마제국의 부활"
 romanization_ITA_desc: "로마인들은 오래전에 몰락했습니다. 그러나 그들의 영향력과 유산은 여전히 남아 있습니다. 이제 신로마인으로서 앞으로 나아가 로마를 재건하는 것이 우리의 임무입니다. 모든 일의 시작은 작다(Omnium Rerum Principia Parva Sunt).\n\n§Y이 결정들은 매우 비용이 많이 들며 로마의 막대한 투자가 필요합니다.§!\n"
 integration_britannia: "브리타니아 로마화"
 integration_britannia_desc: "브리타니아는 로마인의 마지막 위대한 정복지 중 하나입니다. 스코틀랜드 남쪽 지역은 통합에 훌륭한 곳이 될 것입니다. 잉글랜드인들은 확실히 땅을 일굴 줄 알았습니다."
 integration_narbonensis: "나르보넨시스 로마화"
 integration_narbonensis_desc: "나르보넨시스는 프랑스 남부 대부분을 아우릅니다. 이 지역은 우리 본국과 매우 가깝기 때문에 통합을 추진하기 시작해야 합니다."
 integration_lugdunensis_aquitania: "Romanize Lugdunensis and Aquitania"
 integration_lugdunensis_aquitania_desc: "루그두넨시스와 아퀴타니아는 프랑스 북부와 중부의 대부분입니다. 리옹과 같은 지역도 포함합니다. 이 속주는 카이사르가 위대한 정복 전쟁에서 얻은 넓은 지역 중 하나였습니다."
 integration_belgica: "벨기카 로마화"
 integration_belgica_desc: "벨기카는 현대 세계에서 수많은 서로 다른 지역에 해당합니다. 벨기에, 네덜란드 남부, 룩셈부르크, 라인강 서쪽의 독일 일부를 아우릅니다. 벨기카는 제국의 최전성기에 가장 큰 국경 속주 중 하나였습니다."
 integration_raetia_noricum: "라이티아와 노리쿰 로마화"
 integration_raetia_noricum_desc: "알프스 너머의 땅은 언제나 다소 미개척지였습니다. 스위스와 오스트리아의 산악 사나이들은 하나씩 순응하게 될 것입니다. 이 땅들은 제국 북부 지역과 가깝다는 이유로 가장 먼저 정복된 지역에 속했습니다."
 integration_northwestern_balkans: "발칸 지역 로마화"
 integration_northwestern_balkans_desc: "발칸 지역은 옛 제국 속주가 많았던 넓은 지역입니다. 전성기의 고대 속주는 상판노니아, 하판노니아, 달마티아였습니다. 이 세 속주는 긴밀하게 연결되어 있으므로 하나의 더 큰 제국 속주로 묶어 일괄 통치할 수 있습니다."
 integration_dacia_moesia: "다치아와 모이시아 로마화"
 integration_dacia_moesia_desc: "다키아, 하모이시아, 상모이시아 제국 속주는 발칸 중부와 동부 대부분을 아우릅니다. 진정한 로마인에 의한 통치를 복원하기 시작해야 합니다."
 integration_greece: "그리스 로마화"
 integration_greece_desc: "그리스는 로마 제국의 가장 이른 주요 정복지 중 하나입니다. 또한 비잔티움 제국의 권력 기반 중 하나이기도 합니다. 우리는 이곳을 다시 한번 통합해야 합니다!"
 integration_mauretania: "마우레타니아 로마화"
 integration_mauretania_desc: "마우레타니아는 현대 마그레브 해안 지역 대부분을 아우릅니다. 이제 다시 우리의 통제 아래 있으니 지중해에 대한 장악력을 강화하도록 추진해야 합니다."
 integration_africa_proconsularis: "카르타고 로마화"
 integration_africa_proconsularis_desc: "카르타고 지역은 대부분 오늘날의 튀니지에 있습니다. 시칠리아와 사르데냐에서 출발하는 거점을 확보하면 이탈리아 인근에서 정복을 준비하는 데 도움이 될 것입니다."
 integration_tarraconensis_lusitania_baetica: "이베리아 지역 로마화"
 integration_tarraconensis_lusitania_baetica_desc: "타라코넨시스, 루시타니아, 바이티카 속주는 기원전 27년 아우구스투스가 재편하며 처음 설치했습니다."
 integration_cyrenaica_aegyptus: "아이깁토스와 키레나이카 로마화"
 integration_cyrenaica_aegyptus_desc: "이집트와 리비아 북동부는 한때 우리 제국의 초석이었습니다. 이곳은 나일강의 비옥한 땅으로 제국의 상당 부분을 먹여 살릴 수 있었으며, 삼각주에서는 우리에게 중요한 부두도 제공했습니다. 로마에 더 많은 활력을 불어넣기 위해 이곳 사람들을 다시 로마화하기 시작해야 합니다."
 integration_anatolia: "아나톨리아 로마화"
 integration_anatolia_desc: "아나톨리아는 동로마 제국의 상당 부분을 차지했으며 로마가 수행한 가장 큰 정복 중 하나였습니다. 이제 이곳을 합당한 깃발 아래 복원할 때입니다."
 integration_iraq: "이라크 로마화"
 integration_iraq_desc: "이라크는 한때 아시리아와 메소포타미아 속주였습니다. 위대한 로마 제국의 비옥한 곡창 지대였으며 페르시아군과의 분쟁의 중심지이기도 했습니다."
 generic_ITA: "이탈리아 주요 결정"
 bonus_to_stimulate_consumption: "\"소비 자극\"에 보너스 지원"
 bonus_to_stimulate_consumption_desc: "With the excuse of stimulating internal consumption we can give a large monetary bonus and raise population satisfaction with the current situation."
 one_time_paycheck_bonus: "한 번의 월급 보너스"
 one_time_paycheck_bonus_desc: "With the excuse of stimulating internal consumption we can place a significant one-time bonus in our workers' paychecks to raise our popularity."
 integrative_restoration_ITA: "통합적인 복원"
 integrative_restoration_ITA_desc: "수십 년간의 연구 끝에 우리는 선조들이 우리나라의 수많은 위대한 기념물을 지을 때 사용한 기술을 거의 완벽하게 이해하게 되었습니다. 이를 재현하여 그 기념물들을 재건하고 영광스러운 건축물에 다시 활력을 불어넣을 수 있습니다."
 restore_the_Colosseum: "'콜로세움' 복원"
 restore_the_Colosseum_desc: "지진과 약탈로 일부가 파괴되었음에도 콜로세움은 여전히 로마 문명이 이룩한 높이를 보여주는 경외로운 상징입니다. 원래의 용도는 현대에는 너무 야만적일지 모르지만, 우리 수도의 중심에서 공연과 콘서트를 여는 최고의 무대가 될 수 있습니다. 복원에는 비용이 들겠지만 분명 더 많은 관광객을 끌어들이고 국민의 애국심을 불러일으킬 것입니다."
 restore_the_Fori_Imperiali: "'황제들의 포룸' 복원"
 restore_the_Fori_Imperiali_desc: "무솔리니의 제국 광장 복원 시도는 이익보다 피해가 더 컸습니다. 이번에는 올바른 방식으로 일을 처리하여 고대 수도에 새로운 중심을 세울 것입니다."
 restore_Pompeii: "'폼페이' 복원"
 restore_Pompeii_desc: "단연 역대 가장 중요한 고고학적 발견인 폼페이는 선조들의 생활 방식에 대한 놀라운 통찰을 주었으며, 이를 영광스러운 기념물로 복원하는 것이 마땅합니다."
 restore_the_Temple_Valley: "'신전의 계곡' 복원"
 restore_the_Temple_Valley_desc: "신전의 계곡은 지중해에서 그리스 문명의 가장 큰 유적 중 하나이며, 대부분의 신전이 세월에 거의 지워졌음에도 여전히 수많은 관광객을 끌어들입니다. 이곳을 복원함으로써 시칠리아를 세계가 감탄할 더욱 매력적인 여행지로 만들 것입니다."
 ITA_italian_space_decision_category: "이탈리아 우주 프로그램"
 ITA_italian_space_decision_category_desc: "우주: 최후의 개척지. 우리가 세계의 눈에 열강으로 남고자 한다면 이 개척지를 본격적으로 정복해 나가야 하지만, 이는 오직 막대한 비용을 치러야만 달성할 수 있습니다. 대규모 우주 프로그램에서 실질적인 경제적 이익을 얻을 수 있을지 확신할 수 없으므로, 우리는 이 사업이 가치 있는 도전임을 이탈리아 국민들에게 계속해서 확신시켜야 합니다! \n§R(만약 우주 프로그램 열의가 35 미만으로 떨어지면, 우주 작전이 중단됩니다!)§!\n\n현재 우주 프로그램 열의: §Y[?ITA_peoples_support]§! \n과학 우주 프로그램 수준: §Y[?ITA_space_program_level]§! \n현재 우주 프로그램 연간 수익: §G[?ITA_space_income_var]§! \n현재 우주 프로그램 연간 지출: §R[?ITA_space_expenses_var]§! \n§Y소행성 채굴 자원§!: \n귀금속: [?ITA_asteroid_precious]   경금속: [?ITA_asteroid_aluminium]   산업용 금속: [?ITA_asteroid_tungsten]"
 ITA_run_support_campaigns_short: "단기간의 민간 지원 캠페인 시작"
 ITA_run_support_campaigns_short_desc: "우리의 최고 과학자들이 우주에 숨겨진 과학적 경이를 이제 막 풀어내기 시작한 단계라면, 국민은 이 모든 일이 몹시 혼란스러울 것입니다. 짧은 소셜 미디어 캠페인이면 어느 정도 지지를 얻을 수 있을 것입니다!"
 ITA_run_support_campaigns_long: "장기간의 민간 지원 캠페인 시작"
 ITA_run_support_campaigns_long_desc: "우리의 최고 과학자들이 우주에 숨겨진 과학적 경이를 이제 막 풀어내기 시작한 단계라면, 국민은 이 모든 일이 몹시 혼란스러울 것입니다. 상세한 교육 캠페인은 국민의 지지를 얻는 데 놀라운 효과를 낼 것입니다!"
 ITA_rebalance_the_ASI_budget: "이탈리아 우주청 (ASI) 재균형"
 ITA_rebalance_the_ASI_budget_desc: "우리의 우주 프로그램인 ASI는 과거에 비효율적인 지출과 소규모 부패 문제를 겪은 적이 있습니다. 국가 감사관을 투입해 과도한 지출을 억제하고, ASI가 절실히 필요한 긍정적인 평판을 얻도록 해야 합니다."
 ITA_launch_commercial_satellite: "상업위성 발사"
 ITA_launch_commercial_satellite_desc: "정보화 시대가 한창인 지금, 민간 기업들은 앞다투어 위성을 발사하려 하고 있습니다. 이런 기업 일부가 우리 시설에서 발사하도록 허용하면 합리적인 경제적 이익을 얻을 수 있을 것입니다. 다만 국민이 상업 위주의 프로그램에 싫증을 낼 수도 있다는 점에 유의하십시오!"
 ITA_prep_international_space_station: "국제우주정거장 (ISS) 발사 준비"
 ITA_prep_international_space_station_desc: "이는 세계적인 성과이자 사업이지만, 우리는 자체 보급 로켓과 자체 인원을 국제우주정거장(ISS)에 보낼 준비를 할 수 있습니다."
 ITA_italian_iss_launch: "이탈리아 국제우주정거장 (ISS) 발사"
 ITA_italian_iss_launch_desc: "수개월의 계획과 준비 끝에 우리의 보급 셔틀 임무가 발사 준비를 마쳤습니다. 셋... 둘... 하나... 발사!"
 ITA_collect_income_mission: "수입 합산"
 ITA_collect_income_mission_desc: "해마다 민간 기업으로부터 우리가 받아야 할 몫을 거둬들여야 합니다."
 ITA_expand_space_program: "과학 우주 프로그램 확장"
 ITA_expand_space_program_desc: "더 많은 자원은 더 많은 기회와 더욱 야심 찬 탐사 계획을 의미합니다."
 ITA_shrink_space_program: "과학 우주 프로그램에 대한 지원 축소"
 ITA_shrink_space_program_desc: "과학 우주 프로그램의 비용은 이익을 훨씬 웃돌며, 우리는 더 이상 이를 감당할 수 없습니다."
 ITA_setup_lunar_base: "Establish a Lunar Base"
 ITA_setup_lunar_base_desc: "달 기지를 건설하면 우리 활동 범위를 크게 넓힐 발판이 마련되어, 향후 계획을 위한 제조, 연료 보급, 정비 능력을 제공할 것입니다."
 ITA_increase_asteroid_mining_aluminium: "경금속 소행성의 채광률 증가"
 ITA_increase_asteroid_mining_aluminium_2: "경금속 소행성의 채광률 증가"
 ITA_increase_asteroid_mining_aluminium_3: "경금속 소행성의 채광률 증가"
 ITA_increase_asteroid_mining_tungsten: "산업 금속 소행성의 채광률 증가"
 ITA_increase_asteroid_mining_tungsten_2: "산업 금속 소행성의 채광률 증가"
 ITA_increase_asteroid_mining_tungsten_3: "산업 금속 소행성의 채광률 증가"
 ITA_reduce_asteroid_mining_aluminium: "경금속 소행성의 채광률 감소"
 ITA_reduce_asteroid_mining_tungsten: "산업 금속 소행성의 채광률 감소"
 ITA_expanded_space_program_TT: "이것은 우리의 과학 우주 프로그램에 필요한 비용을  §R20§! 만큼 증가시킬 것입니다.\n  ASI 정신이 다음과 같이 변동됩니다: \n 일간 정치력 획득 §G0.05§! \n 연구 속도 §G+2.5%§! 증가"
 ITA_shrinked_space_program_TT: "이는 우리 과학 우주 프로그램에 필요한 비용을 §G20§!만큼 감소시킬 것입니다. \n ASI 정신이 다음과 같이 변동됩니다: \n 일간 정치력 획득 §R-0.05§! \n 연구 속도 §R-2.5%§! 감소"
 ITA_peoples_support_campaigns_short_TT: "우리 항공 우주 프로그램의 열광도는 §Y7.5§!만큼 §G증가§!하였습니다."
 ITA_peoples_support_campaigns_long_TT: "우리 항공 우주 프로그램의 열광도는 §Y15§!만큼 §G증가§!하였습니다."
 ITA_rebalance_the_ASI_budget_TT: "우리 항공 우주 프로그램의 열광도는 효과적인 대중의 지원 자금에 대한 운영 덕분에 §Y5§!만큼 §G증가§!하였습니다."
 ITA_income_TT: "상업적 우주 프로그램은 §G[?ITA_space_income_var]§! x10억의 수익을 냈습니다."
 ITA_expenses_TT: "과학 우주 프로그램은 §R[?ITA_space_expenses_var]§! x10억의 자금이 필요합니다."
 ITA_has_enough_space_support_tt: "작전을 시작하기 위해서는 충분한 §Y우주 프로그램 열광도§!가 필요합니다."
 ITA_launch_ready: "발사를 위한 준비가 완료되었습니다."
 ITA_recently_expanded_space_program: "최근에 우주 프로그램을 확장했음"
 ITA_lower_people_support_10_TT: "이는 상업적 우주 프로그램의 열광도를 §R10§!만큼 감소시킬 것입니다."
 ITA_increase_people_support_10_TT: "이는 상업적 우주 프로그램의 열광도를 §G1§!만큼 증가시킬 것입니다."
 ITA_increase_space_income_1_TT: "이는 상업적 우주 프로그램의 수익을 §G1§!만큼 증가시킬 것입니다."
 ITA_increase_space_expenses_3_TT: "This will increase the expenses from our Scientific Space Program by §R3§!."
 ITA_increase_space_expenses_6_TT: "This will increase the expenses from our Scientific Space Program by §R6§!."
 ITA_increase_space_expenses_9_TT: "This will increase the expenses from our Scientific Space Program by §R9§!."
 ITA_increase_space_expenses_10_TT: "This will increase the expenses from our Scientific Space Program by §R10§!."
 ITA_decrease_space_expenses_3_TT: "This will decrease the expenses from our Scientific Space Program by §G3§!."
 ITA_lunar_base_TT: "우리 과학 우주 프로그램은 충분히 개발되었습니다."
 ITA_has_lunar_base_TT: "우리의 달 전초기지는 작전을 시작할 준비가 되었습니다."
 ITA_ASI: "이탈리아 우주청 (ASI)"
 ITA_ASI_TT: "이탈리아 우주국(ASI, Agenzia Spaziale Italiana)은 이탈리아의 우주 기관입니다. 이탈리아가 나머지 서방 국가에 뒤처지지 않고 따라가는 몇 안 되는 연구 분야 중 하나로, 세계에서 가장 권위 있는 우주 기관들과의 협력을 통해 여러 야심 찬 탐사를 현실로 만드는 데 기여했습니다."
 ITA_idea_ASI_failing: "이탈리아 우주청 (ASI) 예산 부족"
 ITA_idea_prep_the_launch: "발사 준비"
 ITA_idea_space_research: "우주 연구 개발"
 ITA_moon_base: "달 기지"
 ITA_moon_base_desc: "달에 있는 우리의 전초기지는 태양계에 대한 연구와 추가 탐사, 그리고 그 자원의 개발을 위한 완벽한 거점을 제공합니다. 또한 국제 무대에서 위신의 원천이기도 합니다."
 extraordinary_police_funding: "Activate extraordinary police funding"
 extraordinary_police_funding_desc: "마피아 조직들과의 전쟁은 우리 경찰 인력에게 제한된 자원으로 인하여 부담을 주고 있습니다. 그렇기에 막대한 양의 특별한 경찰 자금을 투자하는 것은 확실히 많은 도움을 줄 것입니다."
 mafia_infiltrations_focus_TT: "이 사업의 비용은 마피아 침투 정도에 따라 달라집니다. 이 사업 예산에서 빼돌려진 돈은 결국 범죄 조직을 강화하게 된다는 점에 유의하십시오."
 eradicating_mafia_focus_TT: "이 중점을 통해 §t마피아§!에 대적할 수 있는 더 많은 디시전이 해금될 것입니다."
 mafia_ITA: "이탈리아의 §t마피아§!"
 mafia_ITA_desc: "Organized crime has plagued Southern Italy even before unification. It is known worldwide and referred to as the \"§tMafia§!\", which identifies a wide group of criminal organizations such as \"§0Camorra§!\" in the §0Campania§! region, \"§2Cosa Nostra§!\" in §2Sicily§!, \"§7'Ndrangheta§!\" in §7Calabria§! or \"§9Sacra Corona Unita§!\" in §9Puglia§!. §tMafia§! influence will grow if left unchecked, and their strength will increase considerably if the criminal organizations manage to lay their hands on public and foreign investments."
 seize_drug_shipment: "§7칼라브리아§!에서 마약 상선 장악"
 seize_drug_shipment_desc: "유럽 불법 마약 거래의 상당 부분이 은드랑게타가 장악한 §7칼라브리아§! 항구를 통과합니다. 이 화물을 차단하면 그들의 수익이 크게 줄어들 것입니다."
 seize_weapons_shipment: "§9풀리아§!에서 무기 상선 장악"
 seize_weapons_shipment_desc: "다수의 불법 무기가 §9사크라 코로나 우니타§!의 불법 밀매를 통해 §9풀리아§!의 항구를 거쳐 동유럽에서 이탈리아로 반입되고 있습니다. 이들의 화물 일부를 차단하면 그 지역에서 이들의 영향력이 약화될 것입니다."
 expose_illicit_waste_dumps: "§0캄파니아§!에서 불법 쓰레기 더미 배출"
 expose_illicit_waste_dumps_desc: "§0카모라§!의 중요한 수입원은 안전과 환경법을 거의 개의치 않고 다양한 종류의 폐기물을 처리하는 것입니다."
 seize_illegal_migrant_boats: "§2시칠리아§!에서 불법 이민 보트 장악"
 seize_illegal_migrant_boats_desc: "Taking advantage of their geographic proximity, Sicilian §2Cosa Nostra§! has entered the business of illegal immigration. Renewing our effort to fight human trafficking will also threaten one of their sources of income."
 reduce_mafia_strength_tt: "이는 범죄 조직의 위력을 감소시킬 것입니다."
 infiltrate_mafia_organizations_tt: "이는 마피아에 대한 우리의 작전이 성공할 가능성을 높여줄 것입니다."
 leverage_clan_infighting_TT: "The chances of success of this operation depend on the level of our infiltration in criminal associations."
 mafia_strength_decrease_tt: "이는 §t마피아§!를 약화시킬 것입니다."
 mafia_strength_marginal_operation_success_TT: "우리의 작전은 미미한 성과만을 냈으며, 오로지 마피아 위력의 증가를 감소시키는 것을 조절했을 뿐입니다."
 infiltrate_cosa_nostra: "Infiltrate §2Cosa Nostra§!"
 infiltrate_cosa_nostra_desc: "With the right contacts we can place undercover agents in §2Cosa Nostra§! that will provide us useful information and will weaken them from within."
 infiltrate_camorra: "§0카모라§! 잠입하기"
 infiltrate_camorra_desc: "정확한 연락망을 통해 우린 §0카모라§!에 비밀 요원을 침투하여 유용한 정보를 입수하고 그들을 약화시킬 수 있습니다."
 infiltrate_ndrangheta: "§7드랑게타§! 잠입하기"
 infiltrate_ndrangheta_desc: "정확한 연락망을 통해 우린 §7드랑게타§!에 비밀 요원을 침투하여 유용한 정보를 입수하고 그들을 약화시킬 수 있습니다."
 infiltrate_sacra_corona_unita: "§9사크로 코로나 우니타§! 잠입하기"
 infiltrate_sacra_corona_unita_desc: "정확한 연락망을 통해 우린 §9사크로 코로나 우니타§!에 비밀 요원을 침투하여 유용한 정보를 입수하고 그들을 약화시킬 수 있습니다."
 leverage_cosa_nostra_infighting: "Leverage §2Cosa Nostra§! Infighting"
 leverage_cosa_nostra_infighting_desc: "Big mafia organizations such as \"§2Cosa Nostra§!\" or \"§0Camorra§!\" are actually composed of a myriad of smaller clans that often rival each other. By pulling the right levers we can break the delicate inner peace under which they operate."
 leverage_camorra_infighting: "§0카모라§!의 내부 갈등에 영향"
 leverage_camorra_infighting_desc: "Big mafia organizations such as \"§2Cosa Nostra§!\" or \"§0Camorra§!\" are actually composed of a myriad of smaller clans that often rival each other. By pulling the right levers we can break the delicate inner peace under which they operate."
 leverage_ndrangheta_infighting: "§7드랑게타§!의 내부 갈등에 영향"
 leverage_ndrangheta_infighting_desc: "Big mafia organizations such as \"§2Cosa Nostra§!\" or \"§0Camorra§!\" are actually composed of a myriad of smaller clans that often rival each other. By pulling the right levers we can break the delicate inner peace under which they operate."
 leverage_sacra_corona_unita_infighting: "§9사크로 코로나 우니타§!의 내부 갈등에 영향"
 leverage_sacra_corona_unita_infighting_desc: "Big mafia organizations such as \"§2Cosa Nostra§!\" or \"§0Camorra§!\" are actually composed of a myriad of smaller clans that often rival each other. By pulling the right levers we can break the delicate inner peace under which they operate."
 mafia_strength_reduction_over_time_TT: "이 방법은 §t마피아§! 위력을 계속해서 감소시킬 것입니다."
 attack_hideouts_sicily: "Attack §2Cosa Nostra§! Hideouts"
 attack_hideouts_sicily_desc: "Thanks to our undercover agents we have gathered enough information and we are now able to make targeted strikes against key mafia hideouts throughout the country. §YThis decision can be taken only if a sufficient number of agents have infiltrated clans and strength is below 0.25.§!"
 attack_hideouts_campania: "§0카모라§!의 아지트 공격하기"
 attack_hideouts_campania_desc: "Thanks to our undercover agents we have gathered enough information and we are now able to make targeted strikes against key mafia hideouts throughout the country. §YThis decision can be taken only if a sufficient number of agents have infiltrated clans and strength is below 0.25.§!"
 attack_hideouts_calabria: "§7느랑게타§!의 아지트 공격하기"
 attack_hideouts_calabria_desc: "Thanks to our undercover agents we have gathered enough information and we are now able to make targeted strikes against key mafia hideouts throughout the country. §YThis decision can be taken only if a sufficient number of agents have infiltrated clans and strength is below 0.25.§!"
 attack_hideouts_puglia: "§9사크라 코로나 우니타§!의 아지트 공격하기"
 attack_hideouts_puglia_desc: "Thanks to our undercover agents we have gathered enough information and we are now able to make targeted strikes against key mafia hideouts throughout the country. §YThis decision can be taken only if a sufficient number of agents have infiltrated clans and strength is below 0.25.§!"
 army_in_the_streets: "군대를 배치하라"
 army_in_the_streets_desc: "이제 강력한 조치를 취하여 다시 한번 범죄자들을 뿌리 뽑아야 할 때입니다."
