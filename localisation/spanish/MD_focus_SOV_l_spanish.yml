 sov_gru.1.t: "Rusia quiere enviar al GRU a nuestro país"
 sov_gru.1.d: "Los servicios de inteligencia rusos han propuesto enviar instructores y especialistas en combate del GRU para apoyar a nuestro país."
 sov_gru.1.a: "Estamos de acuerdo"
 sov_gru.1.b: "No los necesitamos."
 sov_gru.2.t: "[FROM.GetNameWithFlag] ha aceptado admitir a nuestro GRU"
 sov_gru.2.d: "Su gobierno ha aceptado permitir que nuestros agentes del GRU participen en sus operaciones militares. Estamos dispuestos a proporcionar todo nuestro apoyo."
 sov_gru.2.a: "Agradable"
 sov_gru.3.t: "[FROM.GetNameWithFlag] Rechazado Nuestro GRU"
 sov_gru.3.d: "Su gobierno rechazó la participación de nuestras fuerzas especiales, al considerarla una intromisión excesiva en su sistema político."
 sov_gru.3.a: "Débiles"
 sov_gru.4.t: "Los agentes del GRU regresan a casa"
 sov_gru.4.d: "Los oficiales del GRU han regresado de su misión y están listos para seguir sirviendo a la patria."
 sov_gru.4.a: "Bien"
 sov_gru.5.t: "Creación del Centro E"
 sov_gru.5.d: "We will establish a new Ministry of Internal Affairs department focused on combating opposition activities, especially targeting pro-Western groups."
 sov_gru.5.a: "Agradable"
 sov_gru.6.t: "Rusia Ofrece Asistencia de PMC de Wagner"
 sov_gru.6.d: "Los canales diplomáticos rusos han ofrecido enviar un contingente de la PMC de Wagner para apoyarnos en la situación actual."
 sov_gru.6.a: "Estamos de acuerdo"
 sov_gru.6.b: "No los necesitamos."
 sov_gru.7.t: "[FROM.GetNameWithFlag] ha aceptado la ayuda de las CSP Wagner"
 sov_gru.7.d: "Su gobierno aceptó nuestra oferta de asistencia de PMC de Wagner. Nuestros combatientes se están desplegando en una nueva misión."
 sov_gru.7.a: "Agradable"
 sov_gru.8.t: "[FROM.GetNameWithFlag] PMC de Wagner rechazó la ayuda"
 sov_gru.8.d: "Su gobierno rechazó la ayuda de PMC de Wagner, aparentemente confiado en que puede manejar las cosas por sí solo."
 sov_gru.8.a: "Débiles"
 sov_gru.9.t: "PMC de Wagner Regresar a casa"
 sov_gru.9.d: "Los combatientes de PMC de Wagner  han completado su misión y regresan a casa."
 sov_gru.9.a: "Agradable"
 sov_gru.10.t: "Rusia Ofrece Asistencia de PMC de Wagner"
 sov_gru.10.d: "Los canales diplomáticos rusos han vuelto a ofrecer el apoyo de PMC de Wagner para ayudarnos a gestionar la situación."
 sov_gru.10.a: "Estamos de acuerdo"
 sov_gru.10.b: "No los necesitamos."
 sov_gru.11.t: "[FROM.GetNameWithFlag] ha aceptado la ayuda de las CSP Wagner"
 sov_gru.11.d: "Su gobierno aceptó recibir la ayuda de PMC Wagner. Nuestros combatientes se están desplegando una vez más."
 sov_gru.11.a: "Agradable"
 sov_gru.12.t: "[FROM.GetNameWithFlag] PMC de Wagner rechazó la ayuda"
 sov_gru.12.d: "Su gobierno rechazó la ayuda de PMC de Wagner, confiando en sus propias capacidades."
 sov_gru.12.a: "Débiles"
 sov_gru.13.t: "PMC de Wagner Regresar a casa"
 sov_gru.13.d: "Los combatientes de PMC de Wagner han terminado su misión y regresan a casa."
 sov_gru.13.a: "Agradable"
 SOV_russia_good: "País Unido e Integral"
 SOV_russia_good_desc: "El referéndum confirmó que nuestro pueblo no desea alterar la integridad territorial de Rusia."
 SOV_good_federalism: "Federalismo Exitoso"
 SOV_good_federalism_desc: "Nuestro sistema federal ha madurado, beneficiando tanto al gobierno central como a los sujetos que lo componen."
 SOV_federal_police: "Policía Federal"
 SOV_federal_police_desc: "Reformaremos la policía, dividiéndola en fuerzas federales y regionales, empoderando a las regiones y reduciendo la presión sobre el presupuesto central."
 SOV_federation_army: "Ejército Federal"
 SOV_federation_army_desc: "Dado que muchas entidades pueden reclutar sus propias unidades, la carga del ejército federal se reducirá significativamente."
 SOV_no_taxes_subjects: "Abolir los Impuestos Federales"
 SOV_no_taxes_subjects_desc: "Eliminaremos los impuestos federales sobre los sujetos, aliviando su carga financiera y estimulando las economías locales."
 SOV_cis_return: "La Segunda Oportunidad de la CEI"
 SOV_cis_return_desc: "A pesar de los fracasos del pasado, tenemos la intención de revivir la CEI como una unión de estados postsoviéticos libres."
 SOV_cis_reform: "Negociaciones sobre Reformas"
 SOV_cis_reform_desc: "La CEI necesita una reforma si queremos evitar repetir los errores del pasado y garantizar el éxito a largo plazo."
 SOV_cis_returning_members: "Llegar a los nuevos miembros"
 SOV_cis_returning_members_desc: "Algunos países abandonaron la CEI y ya no se consideran miembros. Tenemos previsto recuperarlos."
 SOV_cis_new_member: "Nuevos Miembros de la CEI"
 SOV_cis_new_member_desc: "La CEI debe crecer incluyendo a todas las antiguas repúblicas soviéticas para fortalecer la unión."
 SOV_cis_unity_state: "Confederación CIS"
 SOV_cis_unity_state_desc: "Concebido originalmente como una confederación, nuestro objetivo es volver a presentar este proyecto a todos los miembros de la CEI, a pesar de los posibles riesgos."
 SOV_cis_military_forces: "Fuerzas Armadas de la CEI"
 SOV_cis_military_forces_desc: "La CEI debe contar con una fuerza militar moderna y poderosa, y estamos comprometidos con su revitalización."
 SOV_kasyanov_economic_reform: "Reformas Económicas a Gran Escala"
 SOV_kasyanov_economic_reform_desc: "A pesar de los abundantes recursos, nuestra economía está estancada. Eliminaremos las restricciones impuestas por el gobierno anterior y reactivaremos el crecimiento."
 SOV_kasyanov_infrastructure: "Programa de infraestructuras a gran escala"
 SOV_kasyanov_infrastructure_desc: "Nuestra infraestructura se encuentra en malas condiciones. Debemos poner en marcha un programa federal para mejorarla urgentemente."
 SOV_kasyanov_human_capital: "Capital Humano"
 SOV_kasyanov_human_capital_desc: "Los ciudadanos son la base del Estado, e invertiremos mucho en su bienestar y desarrollo."
 SOV_kasyanov_far_east: "Programa Federal del Lejano Oriente"
 SOV_kasyanov_far_east_desc: "El Lejano Oriente requiere una inversión considerable. Crearemos un programa federal específico para desarrollar la región."
 SOV_kasyanov_militia: "Inversiones en Agricultura"
 SOV_kasyanov_militia_desc: "Los agricultores deben sentirse protegidos financiera y legalmente. Implementaremos reformas para mejorar la agricultura privada."
 SOV_kasyanov_konkurentsia: "Más Poderes Antimonopolio"
 SOV_kasyanov_konkurentsia_desc: "El Servicio Federal Antimonopolio obtendrá mayores facultades para combatir las actividades ilegales en el mercado."
 SOV_political_reforms: "Reforma Política a Gran Escala"
 SOV_political_reforms_desc: "Nuestro sistema político necesita un cambio fundamental. Iniciaremos reformas para poner fin al control totalitario y revitalizar la vida política."
 SOV_kasyanov_political: "Gran Rusia Democrática"
 SOV_kasyanov_happy_farmers_idea: "Apoyo Gubernamental a los Agricultores"
 SOV_kasyanov_fas: "Servicio Federal Antimonopolio"
 SOV_kasyanov_anti_corruption_agency: "Agencia Independiente Anticorrupción"
 sov_liberals.1.t: "¡Reformas Completadas!"
 sov_liberals.1.d: "¡Hemos reformado con éxito nuestro sistema económico en solo 500 días! Se trata de un logro importante, que supera lo que Gaidar y Yeltsin pudieron conseguir. Ahora debemos mantener un crecimiento constante y mejorar el bienestar de nuestros ciudadanos."
 sov_liberals.1.o1: "¡Celebremos!"
 sov_liberals.2.t: "¡Las Reformas Fracasaron!"
 sov_liberals.2.d: "Nuestros esfuerzos de reforma han fracasado. No hemos sido capaces de crear el milagro económico que esperábamos. Ahora debemos prepararnos para lo peor, probablemente enfrentándonos a una recesión económica similar a la de la década de 1990."
 sov_liberals.2.o1: "Oh, no..."
 sov_liberals.2.o2: "Oh, no..."
 sov_liberals.2.o3: "Oh, no..."
 sov_liberals.3.t: "El Gran Referéndum Democrático Ruso"
 sov_liberals.3.d: "Ha llegado el momento de decidir el futuro de la estructura estatal-territorial de Rusia. Un referéndum nacional revelará finalmente cómo imagina el pueblo el futuro territorial de nuestro país."
 sov_liberals.3.o1: "El pueblo decide el destino del país."
 sov_liberals.4.t: "[FROM.GetNameWithFlag] nos invita a formar una alianza."
 sov_liberals.4.d: "[FROM.GetNameWithFlag] nos invita a unirnos a su Alianza Independiente Libre, cuyo objetivo es defender la democracia en la antigua Unión Soviética y más allá. Juntos, podemos fortalecer nuestra defensa, hacer crecer nuestras economías y aumentar nuestra influencia geopolítica. Rechazar esta invitación significa perder un apoyo crucial durante los conflictos y quedarnos solos. La elección es nuestra: unirnos y cooperar o seguir por nuestra cuenta."
 sov_liberals.4.a: "Aceptamos su oferta."
 sov_liberals.4.b: "No es el momento adecuado para esto."
 sov_liberals.5.t: "[FROM.GetNameWithFlag] acepta unirte a nuestra alianza"
 sov_liberals.5.d: "[FROM.GetNameWithFlag] ha aceptado nuestra invitación para unirse a la Alianza Independiente Libre. Ahora están bajo nuestra protección."
 sov_liberals.5.a: "Excelente!"
 sov_liberals.6.t: "[FROM.GetNameWithFlag] se ha negado a unirse a nuestra alianza."
 sov_liberals.6.d: "[FROM.GetNameWithFlag] rechazó nuestra invitación a la Alianza Independiente Libre."
 sov_liberals.6.a: "Es su elección."
 sov_liberals.6.b: "No lo dejaremos pasar. ¡Tomaremos medidas por la fuerza!"
 sov_liberals.7.t: "[FROM.GetNameWithFlag] nos invita a formar una alianza."
 sov_liberals.7.d: "[FROM.GetNameWithFlag] nos invita a unirnos a su Alianza Independiente Libre para defender la democracia en todo el espacio postsoviético y más allá. Unirnos reforzará nuestra defensa, nuestra economía y nuestra influencia global. Rechazar la invitación supone el riesgo de aislamiento en caso de conflicto."
 sov_liberals.7.a: "Aceptamos"
 sov_liberals.7.b: "No podemos en este momento"
 sov_liberals.8.t: "[FROM.GetNameWithFlag] nos invita a formar una alianza."
 sov_liberals.8.d: "[FROM.GetNameWithFlag] nos invita a unirnos a su Alianza Independiente Libre, cuyo objetivo es proteger la democracia en la antigua Unión Soviética y en todo el mundo. Juntos, podemos fortalecer la defensa, desarrollar la economía y ampliar nuestra influencia. Rechazar la invitación conlleva el riesgo de perder aliados en caso de conflicto."
 sov_liberals.8.a: "Aceptamos"
 sov_liberals.8.b: "Ahora no"
 sov_liberals.9.t: "[FROM.GetNameWithFlag] nos invita a formar una alianza."
 sov_liberals.9.d: "[FROM.GetNameWithFlag] nos invita a unirnos a su Alianza Independiente Libre dedicada a defender la democracia en la región postsoviética y más allá. La cooperación promete fortaleza defensiva, crecimiento económico e influencia geopolítica. Rechazarla podría dejarnos aislados."
 sov_liberals.9.a: "Aceptamos"
 sov_liberals.9.b: "Nosotros debemos declinar por ahora"
 sov_liberals.10.t: "[FROM.GetNameWithFlag] nos invita a formar una alianza."
 sov_liberals.10.d: "[FROM.GetNameWithFlag] nos invita a unirnos a su Alianza Independiente Libre para defender la democracia en toda la antigua Unión Soviética y en todo el mundo. Unirnos mejorará la defensa, el desarrollo económico y la posición global. Rechazar la invitación conlleva el riesgo de perder un apoyo crucial."
 sov_liberals.10.a: "Aceptamos"
 sov_liberals.10.b: "Por el momento, declinamos."
 sov_liberals.11.t: "[FROM.GetNameWithFlag] nos invita al CEI"
 sov_liberals.11.d: "[FROM.GetNameWithFlag] está intentando una vez más revivir la CEI y nos invita a volver a unirnos a ella. Con un liderazgo más democrático, la CEI podría convertirse en una auténtica unión de estados independientes en lugar de una herramienta para la influencia de Moscú."
 sov_liberals.11.a: "Estamos de acuerdo en volver a unirnos."
 sov_liberals.11.b: "No"
 sov_liberals.12.t: "[FROM.GetNameWithFlag] ha aceptado unirse a la CEI."
 sov_liberals.12.d: "[FROM.GetNameWithFlag] aceptó nuestra invitación para unirse a la CEI, lo que refuerza nuestra posición y demuestra que el proyecto sigue vivo."
 sov_liberals.12.a: "Bien"
 sov_liberals.13.t: "[FROM.GetNameWithFlag] se negó a unirse a la CEI."
 sov_liberals.13.d: "[FROM.GetNameWithFlag] rechazó nuestra oferta, mostrando poco interés en cooperar dentro del espacio postsoviético."
 sov_liberals.13.a: "Lamentable"
 sov_liberals.14.t: "[FROM.GetNameWithFlag] propone crear una Confederación CEI."
 sov_liberals.14.d: "[FROM.GetNameWithFlag] sugiere ampliar la CEI para convertirla en una confederación, restaurando parcialmente su forma de la década de 1990. Si bien esto ofrece ventajas, también conlleva el riesgo de perder autonomía, ya que Moscú recuperaría un mayor control."
 sov_liberals.14.a: "Estamos de acuerdo"
 sov_liberals.14.b: "No"
 sov_liberals.15.t: "[FROM.GetNameWithFlag] se convirtió en miembro de la Confederación CEI."
 sov_liberals.15.d: "[FROM.GetNameWithFlag] firmó para unirse a la Confederación CEI con nosotros, lo que nos acerca a un estado casi unificado y hace que el colapso de la década de 1990 parezca un recuerdo lejano."
 sov_liberals.15.a: "Bien"
 sov_liberals.16.t: "[FROM.GetNameWithFlag] se negó a convertirse en miembro de la Confederación CEI."
 sov_liberals.16.d: "[FROM.GetNameWithFlag] rechazó el acuerdo de la Confederación de la CEI y, indignado por la pérdida de soberanía, se retiró inmediatamente de la CEI."
 sov_liberals.16.a: "Lamentable"
 sov_liberals.17.t: "[FROM.GetNameWithFlag] propone la creación de las Fuerzas Armadas de la CEI."
 sov_liberals.17.d: "[FROM.GetNameWithFlag] quiere reactivar las fuerzas armadas de la CEI para mejorar la coordinación entre los Estados miembros. Esto aumentaría el poder militar, pero también la influencia de Rusia."
 sov_liberals.17.a: "Estamos de acuerdo"
 sov_liberals.17.b: "No"
 sov_liberals.18.t: "[FROM.GetNameWithFlag] acepta participar en las fuerzas armadas de la CEI."
 sov_liberals.18.d: "[FROM.GetNameWithFlag] ha aceptado unirse a las fuerzas armadas de la CEI, lo que supone un importante refuerzo de la potencia militar de la unión."
 sov_liberals.18.a: "Bien"
 sov_liberals.19.t: "[FROM.GetNameWithFlag] se negó a participar en las fuerzas armadas de la CEI."
 sov_liberals.19.d: "[FROM.GetNameWithFlag] se negó a unirse a las fuerzas armadas del CEI, que han sido restablecidas, considerando que su composición actual es suficiente."
 sov_liberals.19.a: "Lamentable"
 sov_liberals.21.t: "[FROM.GetNameWithFlag] abandona la CEI"
 sov_liberals.21.d: "[FROM.GetNameWithFlag] discrepa con el nuevo Gobierno y las políticas de Rusia, y firma un decreto para retirarse de la CEI y sus estructuras."
 sov_liberals.21.a: "Lamentable"
 sov_liberals.22.t: "[FROM.GetNameWithFlag] Ofrece inversiones en Kaliningrado"
 sov_liberals.22.d: "[FROM.GetNameWithFlag] ha cambiado su política hacia Kaliningrado, abriéndola a la inversión extranjera y proponiendo la colaboración."
 sov_liberals.22.a: "Estamos de acuerdo"
 sov_liberals.22.b: "No"
 sov_liberals.23.t: "[FROM.GetNameWithFlag] ha aceptado invertir en la región de Kaliningrado"
 sov_liberals.23.d: "[FROM.GetNameWithFlag] aceptó nuestra propuesta de inversión y se está preparando para finalizar el acuerdo."
 sov_liberals.23.a: "Excelente"
 sov_liberals.24.t: "[FROM.GetNameWithFlag] se ha negado a invertir en la región de Kaliningrado"
 sov_liberals.24.d: "[FROM.GetNameWithFlag] rechazó nuestra oferta de inversión, al parecer por no ver ningún beneficio para ellos."
 sov_liberals.24.a: "Lamentable"
 sov_liberals.25.t: "Resultados de las Inversiones en la Región de Kaliningrado"
 sov_liberals.25.d: "Nos hemos puesto en contacto con varios países Europeos para presentarles propuestas de inversión en Kaliningrado, y los resultados han sido prometedores."
 sov_liberals.25.a: "De acuerdo"
 sov_liberals.26.t: "El desarrollo del Lejano Oriente: la segunda etapa"
 sov_liberals.26.d: "Nuestro programa de desarrollo del Lejano Oriente continúa con el anuncio de la próxima etapa de financiación para el crecimiento de la región."
 sov_liberals.26.a: "Bien"
 sov_liberals.27.t: "Destino de Georgia"
 sov_liberals.27.d: "Georgia sigue siendo un reto en el Cáucaso. Debemos decidir cómo gestionar nuestras relaciones con este país."
 sov_liberals.27.a: "Marcha hacia Tiflis"
 sov_liberals.27.b: "Las relaciones pacíficas siguen siendo nuestra prioridad."
 sov_liberals.28.t: "La Operación «Sweet Gifts» ha concluido con éxito."
 sov_liberals.28.d: "Hemos desenmascarado y desmantelado la mayor red de corrupción del país, deteniendo a oligarcas y diputados de alto rango. Nuestra principal tarea ahora es mantener este nuevo orden."
 sov_liberals.28.a: "La Fundación Anticorrupción ha cumplido su misión."
 sov_liberals.29.t: "¡Han asesinado a Boris Nemtsov!"
 sov_liberals.29.d: "Boris Nemtsov fue asesinado el 27 de febrero de 2015 cerca del puente Bolshoi Moskvoretsky en Moscú mientras paseaba con la modelo ucraniana Anna Duritskaya. Los agresores conocían su ruta y le dispararon seis veces por la espalda, alcanzándole órganos vitales. Los asesinos huyeron en un coche blanco. Varios sospechosos fueron condenados a penas de prisión de entre 11 y 20 años. El autor intelectual sigue sin ser identificado."
 sov_liberals.29.a: "Notado"
 sov_liberals.30.t: "El legado de Yeltsin"
 sov_liberals.30.d: "Tras el colapso de la Unión Soviética, Boris Yeltsin, un líder atribulado, presidió una época difícil: la disolución del Consejo Supremo, las guerras de Chechenia, las crisis económicas y las reformas fallidas. Más tarde, Rusia buscó la estabilidad bajo un nuevo líder que prometía orden y crecimiento. El sistema político se transformó, consolidando la nación tras la agitación. El futuro sigue siendo incierto."
 sov_liberals.30.a: "Observemos con atención."
 sov_liberals.31.t: "La Muerte de Yeltsin"
 sov_liberals.31.d: "RIA ha informado de que Boris Yeltsin, el primer presidente de la Rusia independiente, ha fallecido tras una larga batalla contra una enfermedad cardíaca. Se guardó un minuto de silencio en la universidad que lleva su nombre y muchos líderes occidentales han enviado sus condolencias."
 sov_liberals.31.a: "Descansa en paz, luchador por la libertad."
 sov_liberals.31.b: "Descansa en paz."
 sov_liberals_news.1.t: "El Gran Referéndum Democrático Ruso"
 sov_liberals_news.1.d: "Ha tenido lugar un referéndum histórico sobre el futuro territorial de Rusia. Las fronteras internas han cambiado drásticamente, sorprendiendo a muchos, ya que se dio a los ciudadanos de a pie el poder de decidir el destino del país."
 sov_liberals_news.1.a: "¿Es esto verdadera democracia?"
 SOV_great_democratic_referendum_tt: "Los resultados del §YReferéndum§! dependen del estado del £text_icon_sov_empire §Ylegado ruso§!. Cuanto más se incline el £text_icon_sov_empire §Ylegado ruso§! hacia el £text_icon_sov_democratic §2democracia§!, mayor será la posibilidad de que se produzca un cambio en la estructura territorial del país como resultado del §Yreferéndum§!."
 SOV_system_democratic_referendum_tt: "El §Ysistema político§! elegido influirá en los resultados del §Ypróximo referéndum§!."
 SOV_subjects_exist_tt: "§YRusia§! tiene al menos un tema."
 SOV_subjects_federalization_buff_tt: "El espíritu nacional de §YVerdadero federalismo§! §Ycambiará§! y ahora estará §Ydisponible§! una §Gversión mejorada§! de este."
 SOV_one_CIS_member_tt: "Al menos §Yun otro país§! es miembro de §2la CEI§!"
 SOV_nazbols_new_russian_order: "El nuevo orden ruso"
 SOV_nazbols_new_russian_order_desc: "¡Un nuevo orden amanece para Rusia! Es hora de poner fin a la fragmentación y devolver la unidad a la nación."
 SOV_nazbols_no_more_oligarch: "Encargarse de los oligarcas"
 SOV_nazbols_no_more_oligarch_desc: "Los oligarcas deben dejar de explotar a Rusia. ¡Tomaremos medidas decisivas para poner fin a su saqueo!"
 SOV_nazbols_natiolalize: "Nacionalización de corporaciones"
 SOV_nazbols_natiolalize_desc: "Las grandes corporaciones son un sombrío recordatorio de los años 90. Las nacionalizaremos para beneficiar al país y a su gente."
 SOV_nazbols_west_nationalise: "Nacionalización de empresas occidentales"
 SOV_nazbols_west_nationalise_desc: "Las corporaciones occidentales que entraron en nuestro territorio en los años 90 deben marcharse. Es hora de reclamar lo que es nuestro."
 SOV_nazbols_destroy_republic: "Fin de las Repúblicas Nacionales"
 SOV_nazbols_destroy_republic_desc: "Las repúblicas nacionales no tienen cabida en Rusia. No repetiremos los errores de la Unión Soviética."
 SOV_nazbols_federalism: "Adherirse a las ideas del federalismo"
 SOV_nazbols_federalism_desc: "¡Apoyamos el verdadero federalismo! Los sujetos deben ser autónomos, no solo regiones que sirven a la capital."
 SOV_nazbols_no_export: "La economía rusa cerrada"
 SOV_nazbols_no_export_desc: "Una economía cerrada es una economía fuerte. Rusia puede permitirse este enfoque porque tiene todo lo que necesita."
 SOV_nazbols_cut_fsb: "Recortar el presupuesto del FSB"
 SOV_nazbols_cut_fsb_desc: "Nuestro gobierno gasta demasiado en servicios secretos que espían excesivamente a los ciudadanos. Reduciremos el presupuesto del FSB y reduciremos esta estructura porque somos un país libre."
 SOV_nazbols_help_science: "La ciencia al servicio de Rusia"
 SOV_nazbols_help_science_desc: "La ciencia impulsa el progreso y alimentaremos plenamente este motor con mayor financiación."
 SOV_nazbols_hate_democracy: "Odio al liberalismo y al comunismo"
 SOV_nazbols_hate_democracy_desc: "El liberalismo y el comunismo han llevado a la decadencia de nuestra nación y a la pérdida del espíritu ruso. No dejaremos que destruyan nuestro país."
 SOV_nazbols_new_industrialization: "Nueva industrialización"
 SOV_nazbols_new_industrialization_desc: "¡Lanzaremos un nuevo esfuerzo de industrialización para revivir la fuerza de la industria de la era soviética!"
 SOV_nazbols_capital_return: "División de Retorno Capital"
 SOV_nazbols_capital_return_desc: "Planeamos crear una agencia especial encargada de recuperar el capital ruso del extranjero, por cualquier medio necesario."
 SOV_nazbols_free_weapon: "Porte libre de armas"
 SOV_nazbols_free_weapon_desc: "¡El derecho a portar armas libremente transformará la sociedad rusa! Todo ciudadano debería tener derecho a la legítima defensa."
 SOV_nazbols_back_russians: "Traer a los rusos de vuelta a su patria."
 SOV_nazbols_back_russians_desc: "Promoveremos activamente y apoyaremos financieramente el regreso de las personas de habla rusa a su patria."
 SOV_nazbols_return_russian_territories: "Devolución de los territorios rusos en disputa"
 SOV_nazbols_return_russian_territories_desc: "La cuestión rusa en la antigua Unión Soviética sigue sin resolverse. La abordaremos con decisión: o mediante ultimátums o nos arriesgamos a ser devorados."
 SOV_nazbols_belarus_go_home: "Volver a Bielorrusia"
 SOV_nazbols_belarus_go_home_desc: "Bielorrusia es un pedazo de nuestra patria que nos fue arrebatado injustamente. No hay tierra más autóctona para los rusos que esta pequeña región."
 SOV_nazbols_separatists_go_home: "Anexar las Repúblicas Separatistas"
 SOV_nazbols_separatists_go_home_desc: "Transnistria, Abjasia, Osetia del Sur: su supuesta independencia es un error remanente de la Rusia de Yeltsin. Nosotros solucionaremos esto."
 SOV_nazbols_help_artsakh: "Proteger Artsaj"
 SOV_nazbols_help_artsakh_desc: "Artsaj es el territorio más fervientemente cristiano del espacio postsoviético, hogar de los armenios más auténticos. ¡Debemos protegerlos!"
 SOV_nazbols_help_kurdistan: "Proteger Kurdistán"
 SOV_nazbols_help_kurdistan_desc: "Kurdistán será nuestro punto de apoyo en la región si ganamos influencia diplomática. Irán, Irak y Turquía tendrán que contar con nuestro poder allí."
 SOV_nazbols_anti_westes: "Doctrina Antioccidental"
 SOV_nazbols_anti_westes_desc: "¡No habrá piedad para los ocupantes occidentales del espíritu ruso!"
 SOV_nazbols_ayatolla: "El ayatolá ruso"
 SOV_nazbols_ayatolla_desc: "Inspirada por el Ayatolá de Irán, Rusia necesita un líder espiritual que mantenga el equilibrio moral del pueblo, no ministerios desalmados."
 SOV_nazbols_our_irgc: "El Cuerpo de Guardianes de la Revolución Comunista Ortodoxa"
 SOV_nazbols_our_irgc_desc: "Crearemos un equivalente ruso del CGRI iraní para salvaguardar los logros ideológicos de nuestro régimen."
 SOV_nazbols_ruralisation: "Ruralización"
 SOV_nazbols_ruralisation_desc: "Invertiremos fuertemente en el desarrollo del sector agroindustrial de nuestra economía."
 SOV_nazbols_new_religion: "La Iglesia Ortodoxa Comunista"
 SOV_nazbols_new_religion_desc: "La Iglesia ortodoxa ha perdido credibilidad, llegando incluso a cooperar con los nazis en la Segunda Guerra Mundial. Construiremos una nueva iglesia que sintetice todo el patrimonio espiritual de Rusia."
 SOV_free_weapon: "Libre portación de armas"
 SOV_russians_back_idea: "Regreso de los compatriotas"
 SOV_nazbol_irgc_idea: "El Cuerpo de Guardianes de la Revolución Comunista Ortodoxa"
 sov_nazbol.1.t: "Rusia quiere anexionarnos"
 sov_nazbol.1.d: "El gobierno ruso ha emitido un ultimátum exigiendo un referéndum para unirnos a ellos. Sabemos cuál es el resultado más probable, por lo que es hora de decidir nuestra respuesta."
 sov_nazbol.1.a: "Por supuesto, es hora de volver a casa, a Rusia"
 sov_nazbol.1.b: "No hoy"
 sov_nazbol.2.t: "[FROM.GetName] Está integrado en [SOV.GetName]"
 sov_nazbol.2.d: "[FROM.GetName] se ha integrado completamente en nuestro glorioso Imperio. Estamos reclamando lo que se perdió durante el último siglo y no nos detendremos ahora."
 sov_nazbol.2.a: "Nuestro país se ha vuelto más fuerte"
 sov_nazbol.3.t: "¡Rusia reclama nuestros territorios!"
 sov_nazbol.3.d: "Rusia exige un ultimátum por parte de nuestro territorio que considera suyo. Debemos decidir cómo responder."
 sov_nazbol.3.a: "Concederemos"
 sov_nazbol.3.b: "Nunca"
 sov_nazbol.4.t: "Los bolcheviques nacionales se unen a la coalición"
 sov_nazbol.4.d: "Los nacionalbolcheviques se han unido a nuestra coalición gobernante, ganando influencia sobre la política de nuestro país."
 sov_nazbol.4.a: "¡Sí, a la victoria!"
 SOV_nazbol_destroy_republics_TT: "Todas las §Yrepúblicas nacionales§! no fueron §Rdestruidas§!"
 SOV_wagner_minoboroni: "Suministro del Ministerio de Defensa"
 SOV_wagner_minoboroni_desc: "El Ministerio de Defensa nos proporcionará las armas necesarias para llevar a cabo nuestras operaciones. Este apoyo reforzará significativamente nuestras capacidades."
 SOV_wagner_cadres: "Iniciar el proceso de reclutamiento"
 SOV_wagner_cadres_desc: "Comenzaremos a reclutar a los primeros candidatos para que se unan a nuestras PMC. Una selección cuidadosa es crucial para el éxito de nuestras operaciones."
 SOV_wagner_first_pmc: "El Primer Batallón de las PMC"
 SOV_wagner_first_pmc_desc: "Se ha formado nuestro primer batallón PMC y estamos casi listos para lanzar nuestras primeras misiones de combate. Esto supone un hito importante en la expansión de nuestra influencia."
 SOV_wagner_more_operations: "Ampliación de Actividades"
 SOV_wagner_more_operations_desc: "Nuestro PMC ya está preparado para participar en operaciones en todo el mundo. Esta expansión aumentará nuestro alcance e impacto global."
 SOV_wagner_african: "Dirección Africana"
 SOV_wagner_african_desc: "África quedó perdida tras el colapso de la URSS; es hora de recuperar nuestra influencia allí. Restablecer nuestra presencia abrirá nuevas oportunidades estratégicas."
 SOV_wagner_support_gru: "Apoyo a las Operaciones del GRU"
 SOV_wagner_support_gru_desc: "Apoyaremos las misiones del GRU para mejorar la eficacia de la política exterior rusa. Cooperación mejorará la tasa de éxito de las operaciones encubiertas."
 SOV_wagner_rusich: "DshRG Rusich"
 SOV_wagner_rusich_desc: "También integraremos un pequeño batallón de nacionalistas en nuestras filas, reforzando nuestras PMC. Su compromiso ideológico los convierte en valiosos aliados en nuestras misiones."
 SOV_russian_government_idea: "El Gobierno ruso"
 SOV_russian_government_idea_desc: "La situación política de Rusia siempre ha sido inestable, especialmente tras el colapso de la URSS. Muchos factores contribuyen a ello: el separatismo interno, la inestabilidad política y la apatía pública hacia el destino del Estado."
