 PMR.anarchist_communism_desc: "（民主社会主义） - 该党将自己定位为左翼反对党。它将社会主义与爱国主义相结合，并主张德涅斯特河沿岸的独立。公正共和国在其党的宣言中宣布，其主要目标是团结寻求承认总理独立的人。该党认为独立是建立更公正、更有凝聚力的社会的一种方式。"
