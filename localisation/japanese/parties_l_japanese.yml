 Neutral_Communism: "共産主義"
 Neutral_Communism_desc: "Communist State: - Non-Aligned governments vary vastly in government types and sub-ideologies, and usually have a very pragmatic approach to their foreign alignments. They may want to further their own national independence or other regional goals, or simply are torn between greater powers, who in their struggle for influence pull them in different directions."
 Neutral_Muslim_Brotherhood: "穏健イスラム主義"
 Neutral_Muslim_Brotherhood_desc: "穏健イスラム主義：－ムスリム同胞団は、1928年にイスラム法学者のハサン・アル＝バンナーによってエジプトに設立された多国籍のスンナ派イスラム教組織。アラブ世界全体の支援者を擁し、スラムの慈善活動と組み合わせた政治的行動主義のモデルでもある。それに触発された集団や政党の目標は政治的イスラム政府であり、クルアーンとスンナを社会の唯一の基準点とすることである。"
 nationalist: "ナショナリズムの世界観"
 nationalist_noun: "ナショナリスト"
 nationalist_desc: "ナショナリスト政府"
 Nat_Autocracy: "軍事政権"
 Nat_Autocracy_desc: "軍事政権：－民族主義政府は、自分たちが貧乏くじを引いたと信じ、保護主義、軍事化、国家と民族の主権に基づく国家の再生を追求する。彼らはグローバルで自由主義な機関を嫌っているが、狭い国内的目標や拡大主義的目標を達成するためには、国際的な枠組みにおいて実用的なままでいるかもしれない。"
 Nat_Fascism: "ファシズム"
 Nat_Fascism_desc: "ファシズム：－ナショナリズム政府は、自分たちが貧乏くじを引いたと信じ、保護主義、軍事化、国家と民族の主権に基づく国家の再生を追求する。彼らはグローバルで自由主義な機関を嫌っているが、狭い国内的目標や拡大主義的目標を達成するためには、国際的な枠組みにおいて実用的なままでいるかもしれない。"
 Nat_Populism: "ポピュリズム"
 Nat_Populism_desc: "右派ポピュリズム：－ナショナリズム政府は、自分たちが貧乏くじを引いたと信じ、保護主義、軍事化、国家と民族の主権に基づく国家の再生を追求する。彼らはグローバルで自由主義な機関を嫌っているが、狭い国内的目標や拡大主義的目標を達成するためには、国際的な枠組みにおいて実用的なままでいるかもしれない。"
 Monarchist: "君主主義"
 Monarchist_desc: "君主主義：－ナショナリズム政府は、自分たちが貧乏くじを引いたと信じ、保護主義、軍事化、国家と民族の主権に基づく国家の再生を追求する。彼らはグローバルで自由主義な機関を嫌っているが、狭い国内的目標や拡大主義的目標を達成するためには、国際的な枠組みにおいて実用的なままでいるかもしれない。"
 Neutral_green: "緑の政治"
 Neutral_green_desc: "Green: - Non-Aligned governments vary vastly in government types and sub-ideologies, and usually have a very pragmatic approach to their foreign alignments. They may want to further their own national independence or other regional goals, or simply are torn between greater powers, who in their struggle for influence pull them in different directions."
 communist_state: "Communist"
 communist_state_desc: "Communist State: - Governments with an Emerging Outlook are those, especially in the Global South and Post-Soviet Sphere, that seek to replace the prevailing Liberal World Order with their own alternate institutions and multipolar way of global politics. They often have differing attitudes towards globalization, forms of government, and domestic policy.---- Communism is a radical socialist ideology, which is staunchly opposed to free market capitalism, instead promoting that control over the means of production be held by 'the workers'. What exactly this means varies, but has often translated to the state and economy being controlled by a single, authoritarian 'Communist Party'. Since the collapse of the Soviet Union, communism has greatly diminished across the world, but some states still claim it as their official ideology. Those aligned with the emerging powers see the current liberal, capitalist world order as exploitative, and believe it must be torn down and replaced."