 USA_infantry_weapons_2: "M16A1"
 USA_infantry_weapons_2_desc: "M16 소총(공식 명칭: 5.56mm 구경 M16 소총)은 미군을 위해 ArmaLite AR-15 소총을 개량한 군용 소총 계열입니다. 초기 M16 소총은 20발들이 탄창을 사용하는 5.56mm 자동 소총이었습니다."
 USA_infantry_weapons_3: "M16A2"
 USA_infantry_weapons_3_desc: "M16A2 소총의 개발은 원래 미 해병대가 베트남 전쟁에서 XM16E1과 M16A1 소총을 사용해 얻은 전투 경험을 바탕으로 요청한 것이었습니다. 이 소총은 1982년 국방부에서 \"미군 5.56mm 소총 M16A2\"로 공식 채택되었습니다. 미 해병대는 1980년대 초중반에 이 소총을 미군 최초로 도입했으며, 미 육군은 1980년대 후반에 뒤이어 도입했습니다."
 USA_infantry_weapons_4: "M16A4"
 USA_infantry_weapons_4_desc: "The M16A4 is the fourth generation of the M16 series. It is equipped with a removable carrying handle and a full length quad Picatinny rail for mounting optics and other ancillary devices. The FN M16A4, using safe/semi/burst selective fire, became standard issue for the U.S. Marine Corps. Military issue rifles are also equipped with a Knight's Armament Company M5 RAS hand guard, allowing vertical grips, lasers, tactical lights, and other accessories to be attached, coining the designation M16A4 MWS (or Modular Weapon System) in U.S. Army field manuals."
 USA_infantry_weapons_5: "M4A1"
 USA_infantry_weapons_5_desc: "M4 카빈 소총은 M16 돌격소총의 단축형 및 경량형 변형 모델입니다. M4는 5.56x45mm NATO 탄을 사용하는 공랭식, 직접 가스 작동식, 탄창식 카빈 소총입니다. 14.5인치(370mm) 길이의 총열과 접이식 개머리판을 갖추고 있습니다."
 USA_infantry_weapons_7: "M7 Spear"
 USA_infantry_weapons_7_desc: "A new revolutionary design that incorporates cutting edge materials and advanced ballistics computer."
 USA_infantry_weapons_6: "M27 IAR"
 USA_infantry_weapons_6_desc: ""
 USA_infantry_weapons_8: "Titan APPL"
 USA_infantry_weapons_8_desc: "이 무기 플랫폼은 M4 시스템의 뛰어난 신뢰성을 그대로 계승하면서도 21세기에 걸맞은 독창적인 기술을 적용했습니다. 탄피 없는 탄약을 사용하여 무게를 줄였을 뿐만 아니라, 소형화된 자기 가속 방식을 활용하여 초기 형태의 휴대용 하이브리드 레일건으로 거듭났습니다."
