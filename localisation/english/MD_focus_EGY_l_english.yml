###MILITAR
 EGY_military_anger1: "Unsatisfied Military"
 EGY_military_anger1_desc: "The Military is currently §RUnsatisfied§! with our party and policies, and is not going to cause us any problems for the time being.\n§W--------------§!\nThis national spirit will be §RReplaced§! if our standing with the military §HDrops below -50§! or we exceed §H0§!. This national spirit will also cancel if we remove §HThe Military Internal Faction§!."
 EGY_military_happy: "Pleased Military"
 EGY_military_happy_desc: "The Military is currently §GPleased§! with our party and policies, and is not going to cause us any problems.\n§W--------------§!\nThis national spirit will be §RReplaced§! if our standing with the military §HDrops below 0§! or we remove §HThe Military Internal Faction§!."
 EGY_military_anger2: "Frustrated Army"
 EGY_military_anger2_desc: "The Military is currently §RFrustrated§! with our party and policies, and is starting to cause us some problems.\n§W--------------§!\nThis national spirit will be §RReplaced§! if our standing with the military §HDrops below -100§! or exceeds §H-50§!. This national spirit will also cancel if we remove §HThe Military Internal Faction§!."
 EGY_military_anger3: "Furious Army"
 EGY_military_anger3_desc: "The Military is currently §RFurious§! with our party and policies, and they are causing problems.\n§W--------------§!\nThis national spirit will be §RReplaced§! if our standing with the military §HDrops below -150§! or we exceed §H-100§!. This national spirit will also cancel if we remove §HThe Military Internal Faction§!."
 EGY_military_anger4: "Disloyal Army"
 EGY_military_anger4_desc: "The Military is currently §RDisloyal§! because of our party and policies, and they are causing major problems.\n§W--------------§!\nThis national spirit will be §RReplaced§! if our standing with the military §HDrops below -200§! or we exceed §H-150§!. This national spirit will also cancel if we remove §HThe Military Internal Faction§!."
 EGY_military_anger5: "Crippled Army"
EGY_military_anger5_desc: "The Military is currently §RCrippled§! due to our party policies and low standing. The armed forces of Egypt are virtually useless unless we increase our standing with the military.\n§W--------------§!\nThis national spirit will be §RReplaced§! if our standing with the military exceeds §H-200§!. This national spirit will also cancel if we remove §HThe Military Internal Faction§!."
EGY_guards_of_secularism: "Opportunistic Military"
EGY_guards_of_secularism_desc: "The Egyptian military has not been hesitant to take the first opportunity that would grant them more power, either politically or logistically. The military will oppose parties that threaten their influence over the government. For example, the military will seize any opportunity to oust a government that aligns themselves with the Muslim Brotherhood, as they go against the military's influence over the central government.\n\nThe military opposes non-secular political parties such as the §W[Neutral_Muslim_Brotherhood_L]§!. The military's §YStanding§! with the government is affected by multiple factors, such as §GMilitary Spending§! or §RCorruption§!. If our §YStanding§! with them drops below §Y-100§!, the military will take actions to topple the government.\n\n§YThe Military§! will also resist attempts to reduce its power but if we manage to remove them, they won't be able to interfere with us."
egypt.141.t: "Military Coup in Egypt!"
egypt.141.d: "Today, higher command of Egyptian military rolled down the streets of Cairo and Alexandria and occupied several government buildings. They demand our government to resign!"
egypt.141.a: "We should give up..."
egypt.141.b: "No step back!"

