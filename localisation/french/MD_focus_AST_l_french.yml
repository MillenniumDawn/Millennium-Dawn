 mining_smear_campaign_idea_ast: "Campagne médiatique minière"
 mining_smear_campaign_idea_ast_desc: "La campagne de dénigrement bat son plein. Alimentée par des millions de dollars des compagnies minières, la télévision déborde de publicités discréditant notre gouvernement, avec un accent sur Kevin Rudd, tout en canalisant les dons vers l'opposition."
