l_english:
 # Linux Ecosystem
 linux_system_programs: "Linux Ecosystem Programs"
 linux_system_programs_desc: "Linux adoption depends on more than access to source code. These programs shape how widely Linux is deployed, who sustains it, and how institutions verify the software they operate."
 linux_system_program_slot_available_tt: "Our country is operational, and no other Linux ecosystem program is active"
 linux_system_can_pay_gdp_0_1_percent_tt: "Our Treasury can cover §Y0.1% of GDP§! without an incoming bankruptcy collapse"
 linux_system_can_pay_gdp_0_2_percent_tt: "Our Treasury can cover §Y0.2% of GDP§! without an incoming bankruptcy collapse"
 # Adoption Ideas
 linux_system_experimental_adoption: "Experimental"
 linux_system_experimental_adoption_desc: "Linux remains confined to pilots and specialist systems. Its limited reach provides no broad economic effect."
 linux_system_institutional_adoption: "Institutional Adoption"
 linux_system_institutional_adoption_desc: "Public agencies, universities, and major firms maintain Linux beside established platforms. Shared skills begin to improve Research Speed and Office Productivity."
 linux_system_infrastructure_standard: "Infrastructure Standard"
 linux_system_infrastructure_standard_desc: "Linux underpins important server, cloud, and industrial systems. Standardization improves Research Speed, Productivity Growth, Office Productivity, and Cyber Defense."
 linux_system_broad_economic_adoption: "Broad Economic Adoption"
 linux_system_broad_economic_adoption_desc: "Linux is embedded across the public and private economy, from routine office systems to critical infrastructure. Its scale improves Research Speed, Productivity Growth, Office Productivity, and Corporate Tax Revenue."

 # Support Ideas
 linux_system_mixed_linux_estate: "Mixed Linux Estate"
 linux_system_mixed_linux_estate_desc: "Institutions combine community packages, enterprise subscriptions, and internal support. Diversity preserves flexibility, but fragmented integration reduces Research Speed and Cyber Defense while raising Bureaucracy Cost."
 linux_system_upstream_partnership: "Upstream Partnership"
 linux_system_upstream_partnership_desc: "Our institutions fund maintainers and contribute changes to the projects they depend on. Shared development improves Research Speed and lowers the cost of Receiving Foreign Investment, but raises Bureaucracy Cost."
 linux_system_enterprise_distribution: "Enterprise Distribution"
 linux_system_enterprise_distribution_desc: "Commercial distributors integrate packages, certify releases, and provide accountable support. Predictable service improves Office Productivity and Corporate Tax Revenue, but raises Internal Investment Monetary Cost and can create vendor dependency."
 linux_system_national_baseline: "National Baseline"
 linux_system_national_baseline_desc: "A public authority controls approved packages, signing policy, and deployment standards. Stronger Cyber Defense comes with slower research and a costly certification bureaucracy."

 # Programs
 linux_system_fund_upstream_maintenance: "Fund Upstream Maintenance"
 linux_system_fund_upstream_maintenance_desc: "Dedicated funding supports maintainer time, coordinated releases, and faster security response. The program improves shared capacity while public institutions carry its financial and administrative cost."
 linux_system_fund_upstream_maintenance_tt: "Political Power: §R-25§!\nSpends §Y0.1% of GDP§!.\n§YStewardship§!: §G+1§!\n§YAssurance§!: §G+1§!\nFor §Y180 days§!: Research Speed §G+1.00%§! and Bureaucracy Cost §R+1.00%§!.\nThe shared Linux program slot reopens when this §Y180-day§! program ends."
 linux_system_contract_enterprise_support: "Contract Enterprise Support"
 linux_system_contract_enterprise_support_desc: "A commercial distributor provides integration, certification, and response guarantees across our Linux estate. The contract improves Productivity Growth and reduces Bureaucracy Cost, though institutions become more dependent on a vendor lifecycle."
 linux_system_contract_enterprise_support_tt: "Political Power: §R-25§!\nSpends §Y0.1% of GDP§!.\n§YDeployment§!: §G+1§!\n§YAssurance§!: §G+1§!\nSets our §YSupport Model§! to §YEnterprise Distribution§!.\nFor §Y180 days§!: Productivity Growth §G+1.00%§! and Bureaucracy Cost §G-1.00%§!.\nThe shared Linux program slot reopens when this §Y180-day§! program ends."
 linux_system_harden_lifecycle: "Harden the Software Lifecycle"
 linux_system_harden_lifecycle_desc: "Package audits, secured signing infrastructure, and coordinated update testing strengthen the software trust chain. The additional controls improve assurance while increasing administrative work."
 linux_system_harden_lifecycle_tt: "Political Power: §R-35§!\nSpends §Y0.1% of GDP§!.\n§YAssurance§!: §G+2§!\nFor §Y365 days§!: Cyber Defense §G+2§! and Bureaucracy Cost §R+1.00%§!.\nThe shared Linux program slot reopens when this §Y365-day§! program ends."
 linux_system_public_procurement: "Adopt Open Public Procurement"
 linux_system_public_procurement_desc: "Public procurement rules accept auditable Linux platforms and fund the integration work needed to deploy them. Wider access supports diffusion, but shifts coordination costs onto public institutions."
 linux_system_public_procurement_tt: "Political Power: §R-50§!\nSpends §Y0.2% of GDP§!.\n§YDeployment§!: §G+1§!\n§YStewardship§!: §G+1§!\n§YAssurance§!: §G+1§!\nFor §Y180 days§!: Research Speed §G+1.00%§!, Productivity Growth §G+1.00%§!, and Bureaucracy Cost §R+2.00%§!.\nThe shared Linux program slot reopens when this §Y180-day§! program ends."

 # Program Ideas
 linux_system_upstream_maintenance_program: "Upstream Maintenance Program"
 linux_system_upstream_maintenance_program_desc: "Dedicated funding supports maintainer time, coordinated releases, and faster security response. The program improves shared capacity while public institutions carry its financial and administrative cost."
 linux_system_enterprise_support_program: "Enterprise Support Contract"
 linux_system_enterprise_support_program_desc: "A commercial distributor provides integration, certification, and response guarantees across our Linux estate. The contract improves Productivity Growth and reduces Bureaucracy Cost, though institutions become more dependent on a vendor lifecycle."
 linux_system_lifecycle_hardening_program: "Software Lifecycle Hardening"
 linux_system_lifecycle_hardening_program_desc: "Package audits, secured signing infrastructure, and coordinated update testing strengthen the software trust chain. The additional controls improve assurance while increasing administrative work."
 linux_system_public_procurement_program: "Open Public Procurement Program"
 linux_system_public_procurement_program_desc: "Public procurement rules accept auditable Linux platforms and fund the integration work needed to deploy them. Wider access supports diffusion, but shifts coordination costs onto public institutions."

 # 2001: The Common Layer
 linux_system_events.1.t: "The Common Layer"
 linux_system_events.1.d: "Linux has become a common operating layer across servers, research systems, and network infrastructure. We must decide whether to strengthen upstream capacity, purchase enterprise support, or keep a mixed estate while the technology matures."
 linux_system_events.1.a: "Fund the common layer"
 linux_system_events.1.a_tt: "§YDeployment§!: §G+1§!\n§YStewardship§!: §G+2§!\nSets our §YSupport Model§! to §YUpstream Partnership§!.\nGain a §G5%§! research bonus for §Y$CAT_computing_tech$§!."
 linux_system_events.1.b: "Purchase enterprise support"
 linux_system_events.1.b_tt: "§YDeployment§!: §G+2§!\n§YAssurance§!: §G+1§!\nSets our §YSupport Model§! to §YEnterprise Distribution§!.\nGain a §G5%§! research bonus for §Y$CAT_computing_tech$§!."
 linux_system_events.1.c: "Keep a mixed estate"
 linux_system_events.1.c_tt: "Avoids a procurement fight: no migration is forced on public bodies.\n§YStewardship§!: §R-1§!\n§YAssurance§!: §R-1§!\nSets our §YSupport Model§! to §YMixed Linux Estate§!."

 # 2008: Public Code and the Support Economy
 linux_system_events.2.t: "Public Code and the Support Economy"
 linux_system_events.2.d: "Public institutions and firms increasingly depend on code they can inspect but do not necessarily maintain themselves. The economic question is no longer whether Linux is free to obtain, but who pays for integration, security work, and long-term support."
 linux_system_events.2.a: "Fund upstream participation"
 linux_system_events.2.a_tt: "Political Power: §R-50§!\nSpends §Y0.2% of GDP§!.\n§YDeployment§!: §G+1§!\n§YStewardship§!: §G+1§!\n§YAssurance§!: §G+1§!\nSets our §YSupport Model§! to §YUpstream Partnership§!."
 linux_system_events.2.b: "Contract enterprise support"
 linux_system_events.2.b_tt: "Political Power: §R-25§!\nSpends §Y0.1% of GDP§!.\n§YDeployment§!: §G+1§!\n§YAssurance§!: §G+2§!\nSets our §YSupport Model§! to §YEnterprise Distribution§!."
 linux_system_events.2.c: "Establish a national baseline"
 linux_system_events.2.c_tt: "Political Power: §R-50§!\nSpends §Y0.2% of GDP§!.\n§YDeployment§!: §G+1§!\n§YAssurance§!: §G+2§!\nSets our §YSupport Model§! to §YNational Baseline§!."
 linux_system_events.2.e: "Keep a mixed Linux estate"
 linux_system_events.2.e_tt: "§YAssurance§!: §R-1§!\nSets our §YSupport Model§! to §YMixed Linux Estate§!."

 # 2015: The Software Trust Chain
 linux_system_events.3.t: "The Software Trust Chain"
 linux_system_events.3.d_mixed: "A mixed estate draws packages, firmware, and updates from several channels. This diversity limits dependence on one authority, but makes it harder to prove where every component came from."
 linux_system_events.3.d_upstream: "Our upstream partnership makes public development and shared review central to the software trust chain. Broad participation can expose faults quickly, but assurance depends on sustained maintainer capacity."
 linux_system_events.3.d_enterprise: "Our enterprise distribution model places vendors between upstream code and institutional deployment. Certification and support contracts strengthen assurance, but can slow access to fixes outside the vendor lifecycle."
 linux_system_events.3.d_national: "Our national baseline brings package approval, signing, and deployment under public authority. The controlled chain improves accountability, but requires a permanent certification bureaucracy."
 linux_system_events.3.a: "Fund shared verification"
 linux_system_events.3.a_tt: "§YStewardship§!: §G+1§!\n§YAssurance§!: §G+1§!\nSets our §YSupport Model§! to §YUpstream Partnership§!.\nApplies §YShared Updates Program§! for §Y365 days§!: Research Speed §G+1.00%§! and Bureaucracy Cost §R+1.00%§!."
 linux_system_events.3.b: "Require vendor certification"
 linux_system_events.3.b_tt: "Spends §Y0.1% of GDP§!.\n§YDeployment§!: §G+1§!\n§YAssurance§!: §G+2§!\nSets our §YSupport Model§! to §YEnterprise Distribution§!."
 linux_system_events.3.c: "Establish a national signing authority"
 linux_system_events.3.c_tt: "Spends §Y0.2% of GDP§!.\n§YAssurance§!: §G+2§!\nSets our §YSupport Model§! to §YNational Baseline§!.\nApplies §YNational Signing Program§! for §Y365 days§!: Bureaucracy Cost §R+2.00%§!."
 linux_system_events.3.d: "Defer a common standard"
 linux_system_events.3.d_tt: "§YAssurance§!: §R-1§!\nSets our §YSupport Model§! to §YMixed Linux Estate§!."
 linux_system_shared_updates_program: "Shared Updates Program"
 linux_system_shared_updates_program_desc: "Shared verification connects institutional security work with upstream maintainers. Faster review improves research, but the coordination effort raises Bureaucracy Cost."
 linux_system_national_signing_program: "National Signing Program"
 linux_system_national_signing_program_desc: "A national signing authority must audit packages, maintain keys, and certify updates across the public estate. Stronger assurance carries a higher Bureaucracy Cost."

 # 2019: Enterprise Linux, Open Cloud, and National Baselines
 linux_system_events.4.t: "Enterprise Linux, Open Cloud, and National Baselines"
 linux_system_events.4.d_mixed: "Enterprise Linux, open cloud platforms, and state-backed baselines have created several viable paths to scale. A mixed estate preserves choice, but increases integration and support overhead."
 linux_system_events.4.d_upstream: "Enterprise Linux and open cloud services draw heavily on the upstream communities our institutions support. Federated participation widens interoperability, but also exposes us to coordination failures beyond any single contract."
 linux_system_events.4.d_enterprise: "Enterprise Linux subscriptions and open cloud platforms have made commercial support a durable economic sector. Vendor accountability eases deployment, though subscription leverage can harden into dependency."
 linux_system_events.4.d_national: "National baselines can combine auditable packages with domestic certification and controlled deployment. This strengthens institutional assurance, but may narrow compatibility with the wider ecosystem."
 linux_system_events.4.a: "Federate upstream participation"
 linux_system_events.4.a_tt: "§YDeployment§!: §G+2§!\n§YStewardship§!: §G+2§!\n§YAssurance§!: §G+1§!\nSets our §YSupport Model§! to §YUpstream Partnership§!.\nGain a §G5%§! research bonus for §Y$CAT_internet_tech$§!."
 linux_system_events.4.b: "Scale enterprise cloud support"
 linux_system_events.4.b_tt: "§YDeployment§!: §G+2§!\n§YAssurance§!: §G+2§!\nSets our §YSupport Model§! to §YEnterprise Distribution§!.\nGain a §G5%§! research bonus for §Y$CAT_internet_tech$§!."
 linux_system_events.4.c: "Standardize a national distribution"
 linux_system_events.4.c_tt: "§YDeployment§!: §G+1§!\n§YAssurance§!: §G+2§!\nSets our §YSupport Model§! to §YNational Baseline§!.\nGain a §G5%§! research bonus for §Y$CAT_encryption_tech$§!."

 # 2024: The Maintainer Governance Crisis
 linux_system_events.5.t: "The Maintainer Governance Crisis"
 linux_system_events.5.d_mixed: "A maintainer dispute has exposed the hidden labor and authority behind our mixed Linux estate. We can formalize a settlement or accept disruption while institutions renegotiate support."
 linux_system_events.5.d_upstream: "A maintainer dispute has exposed the limits of voluntary stewardship across a widely deployed Linux estate. Binding maintainer authority may restore cooperation, but it also transfers release power away from institutional sponsors."
 linux_system_events.5.d_enterprise: "A maintainer dispute tests whether commercial stewardship can retain contributor trust while meeting contractual obligations. Central release engineering offers clear accountability, but a settlement without community influence may deepen the rupture."
 linux_system_events.5.d_national: "A maintainer dispute has reached the public certification chain that anchors our national baseline. A public authority can preserve continuity, but only by funding the expertise and review capacity it claims to govern."
 linux_system_events.5.a: "Guarantee maintainer authority"
 linux_system_events.5.a_tt: "Political Power: §R-25§!\nSpends §Y0.1% of GDP§!.\n§YStewardship§!: §G+2§!\n§YAssurance§!: §G+1§!\nSets our §YSupport Model§! to §YUpstream Partnership§!."
 linux_system_events.5.b: "Place releases under commercial stewardship"
 linux_system_events.5.b_tt: "Political Power: §R-50§!\nSpends §Y0.1% of GDP§!.\n§YAssurance§!: §G+2§!\nSets our §YSupport Model§! to §YEnterprise Distribution§!."
 linux_system_events.5.c: "Create a public certification authority"
 linux_system_events.5.c_tt: "Political Power: §R-50§!\nSpends §Y0.2% of GDP§!.\n§YAssurance§!: §G+2§!\nSets our §YSupport Model§! to §YNational Baseline§!."
 linux_system_events.5.d: "Accept a disruptive compromise"
 linux_system_events.5.d_tt: "§YDeployment§!: §R-1§!\n§YAssurance§!: §R-2§!\nSets our §YSupport Model§! to §YMixed Linux Estate§!.\nApplies §YFragile Linux Estate§! for §Y365 days§!: Productivity Growth §R-1.00%§! and Cyber Defense §R-1§!."
 linux_system_fragile_estate: "Fragile Linux Estate"
 linux_system_fragile_estate_desc: "Institutions have deferred the dispute over release authority without resolving it. Emergency integration work reduces Productivity Growth and Cyber Defense until a durable settlement emerges."
