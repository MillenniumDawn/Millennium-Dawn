 mission_to_mars_tt: "Une mission habitée vers Mars sera organisée.\n"
 asteroid_mining_wait_period_tt: "Nous devrons explorer et attendre un astéroïde approprié pour le manœuvrer en orbite terrestre.\n"
 asteroid_mining_spotted_tt: "Avec un astéroïde repéré, il faudra un court délai pour le placer en orbite, de 50 à 100 jours.\n"
 asteroid_mining_orbit_tt: "L'astéroïde étant en orbite, les entreprises vont désormais envoyer des drones miniers vers l'astéroïde pour l'exploiter.\n"
