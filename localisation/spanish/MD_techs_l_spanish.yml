 stealth_destroyer_hull_1: "Casco de Destructor Sigiloso 2015"
 stealth_destroyer_hull_1_desc: "Changes in modern technology of warfare have caused more advanced fleets to look for new answers for survivability in their fleets. Stealth Destroyers have become a preeminent focus. Keeping hidden from advanced enemy sensors and radars means these powerful weapons can strike closer, quicker, and with increased lethality, with the added bonus of increased survivability in modern conflicts."
 stealth_destroyer_hull_2: "Casco de Destructor Sigiloso 2030"
 stealth_destroyer_hull_2_desc: "Changes in modern technology of warfare have caused more advanced fleets to look for new answers for survivability in their fleets. Stealth Destroyers have become a preeminent focus. Keeping hidden from advanced enemy sensors and radars means these powerful weapons can strike closer, quicker, and with increased lethality, with the added bonus of increased survivability in modern conflicts."
