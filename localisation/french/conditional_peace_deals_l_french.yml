 CPD_AIA_title_TEXT_DELAYED: "L'IA est prête à accepter ou refuser cet accord de paix pour les raisons suivantes:\n\nRéticence initiale pour accepter: §R-100§!\n\n[CPD_ai_accept_economic_cost][CPD_ai_accept_war_support][CPD_ai_accept_relative_strength][CPD_ai_accept_surrender_progress][CPD_ai_accept_battles_won][CPD_ai_accept_sender_contribution][CPD_ai_accept_power_ranking][CPD_ai_accept_faction_backing][CPD_ai_accept_months_at_war][CPD_ai_accept_war_weariness][CPD_ai_accept_desperation][CPD_ai_acceptance_difficulty_setting][CPD_ai_accept_cost_of_peace][CPD_ai_accept_deal_fairness][CPD_ai_accept_full_puppet_aversion][CPD_ai_accept_regime_change_aversion][CPD_ai_accept_forced_neutrality_aversion][CPD_ai_accept_military_basing_aversion][CPD_ai_accept_resource_rights_aversion][CPD_ai_accept_ceasefire_acceptance]\n\nScore actuel de l'IA pour accepter: [CPD_ai_acceptance_total]"
