 HOL_royal_influence_church:0 "Restauração da Hegemonia Protestante"
 HOL_royal_influence_church_desc:0 "Com a força renovada da monarquia, a Coroa reafirma sua autoridade sobre as instituições do Estado, desmantelando grande parte da influência pluralista. A Igreja Protestante é elevada de volta a perto de seu antigo papel central na vida pública, orientando as normas, a educação e a lei."
 HOL_eindhoven_brainport_idea: "Eindhoven Brainport"
 HOL_eindhoven_brainport_idea_desc:0 "A Eindhoven Brainport é uma das principais regiões de alta tecnologia dos Países Baixos, renomada por sua inovação e por suas indústrias de tecnologia avançada. Centrada em Eindhoven, essa área é uma potência em setores como semicondutores, tecnologia automotiva e robótica. Sede de empresas globais como ASML e Philips, a Brainport Eindhoven impulsiona um crescimento econômico significativo e contribui de forma decisiva para a posição dos Países Baixos como líder global em tecnologia e inovação."
 HOL_brainport: "Eindhoven Brainport"
 HOL_brainport_desc:0 "Eindhoven Brainport é uma das principais regiões de alta tecnologia dos Países Baixos, renomada por suas indústrias de inovação e tecnologia avançada. Centrada em Eindhoven, essa área é uma potência em setores como semicondutores, tecnologia automotiva e robótica. Sede de empresas globais como ASML e Philips, o Brainport Eindhoven impulsiona um crescimento econômico significativo e contribui de forma decisiva para a posição dos Países Baixos como líder global em tecnologia e inovação."
