 RULE_OPTION_REVANCHIST_PATH_AI_DESC: "What is left of the federal establishment turns the Free States towards recovering the whole of the continental United States. Every neighbour on the old American map becomes a claim waiting to be pressed §Rand this path only exists if the United States rule is set to Post United Era or The Great Collapse§!."
 RULE_OPTION_ISOLATION_PATH: "대고립"
 RULE_OPTION_ISOLATION_PATH_AI_DESC: "The American dream is written off, and the Free States shut the door on a world they no longer believe they owe anything. Washington's old commitments lapse and the eastern seaboard is left to its quiet §Rand this path only exists if the United States rule is set to Post United Era or The Great Collapse§!."
 RULE_OPTION_ARCADIA_PATH: "동부의 정체성"
 RULE_OPTION_ARCADIA_PATH_AI_DESC: "Federal loyalty fades and the Free States build a new §8Eastern Identity§! out of the Arcadia Plan rather than mourning the union. The east coast becomes a nation in its own right instead of a rump of the old one §Rand this path only exists if the United States rule is set to Post United Era or The Great Collapse§!."
 CSA_AI_BEHAVIOR: "@CSA Southern Republic"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH: "남부의 아메리카"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH_AI_DESC: "The Southern Republic keeps faith with the old American idea and sets out to rebuild the union under its own flag. It offers itself as the legitimate successor to the United States rather than as a breakaway §Rand this path only exists if the United States rule is set to Post United Era or The Great Collapse§!."
 RULE_OPTION_GOLDEN_CIRCLE_PATH: "골든 서클"
 RULE_OPTION_GOLDEN_CIRCLE_PATH_AI_DESC: "The republic revives the §8Golden Circle§!, the Confederacy's old design for an empire around the Gulf and the Caribbean. The Southern Republic looks south for its future, and its neighbours find themselves inside somebody's sphere §Rand this path only exists if the United States rule is set to Post United Era or The Great Collapse§!."
 RULE_OPTION_SOUTHERN_ARCADIA_PATH: "동부의 정체성"
 RULE_OPTION_SOUTHERN_ARCADIA_PATH_AI_DESC: "Unwilling to carry either the American or the Confederate legacy, the republic builds a new identity on its Cajun and Creole inheritance. The Gulf coast becomes a nation of its own rather than anyone's successor state §Rand this path only exists if the United States rule is set to Post United Era or The Great Collapse§!."
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH: "플로리다 봉기"
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH_AI_DESC: "Southern nationalists refuse the Florida result and take up arms against a government they call stolen. The young republic tears itself open in its first years §Rand this path only exists if the United States rule is set to Post United Era or The Great Collapse§!."
 CAS_AI_BEHAVIOR: "@CAS 캐스케이디아"
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH: "로키산맥 저항군"
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH_AI_DESC: "Olympia leaves the unrest in the Idaho panhandle to local sheriffs, and the §8Rocky Mountain Resistance§! outgrows them until the mountain counties rise for independence. Cascadia has to fight a secession in its own back country §Rand this path only exists if the United States rule is set to Post United Era or The Great Collapse§!."
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH: "우리 시대의 평화"
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH_AI_DESC: "Olympia sends a special investigations unit east to take over the counter-resistance effort, and order returns until the §8Rocky Mountain Resistance§! leadership disbands the movement itself. Cascadia comes out of the crisis whole and quiet §Rand this path only exists if the United States rule is set to Post United Era or The Great Collapse§!."
 LKT_AI_BEHAVIOR: "@LKT Lakota"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH: "수복 전선 전쟁"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH_AI_DESC: "An auditor sent from the capital confronts the §8Reclamation Front§! leadership on his own authority, and the meeting ends in open rupture. Kansas militarises under the Front and Lakota goes to war with it §Rand this path only exists if the United States rule is set to Post United Era or The Great Collapse§!."
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH: "수복 전선 평화"
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH_AI_DESC: "A second round of investigation disproves the harshest reports about the §8Reclamation Front§!, and the two governments talk instead of arming. Lakota and the Front build a common economic and social union out of the reconciliation §Rand this path only exists if the United States rule is set to Post United Era or The Great Collapse§!."
 GAME_RULE_nato_disabled: "게임 규칙에 의해 §YNATO§! 비활성화됨"
 RULE_GOD_OF_WAR: "전쟁의 신 모드"
 RULE_GOD_OF_WAR_NO: "비활성화"
 RULE_GOD_OF_WAR_YES: "활성화"
 RULE_GOD_OF_WAR_NO_DESC: "AI는 기본 구성을 사용합니다."
 RULE_GOD_OF_WAR_YES_DESC: "AI가 강화된 편제와 약간의 치트를 사용합니다."
 RULE_ALLOW_CONDITIONAL_PEACE_DEAL: "조건부 평화협정 허용"
 RULE_OPTION_CONDITIONAL_PEACE_DEAL_YES_DESC: "교전국들이 §Y'조건부 평화협정'§! 외교 기능을 사용할 수 있도록 허용합니다. 이를 통해 어느 한쪽이 완전히 항복하지 않더라도 평화협정을 체결할 수 있습니다."
 RULE_OPTION_CONDITIONAL_PEACE_DEAL_NO_DESC: "국가들이 §Y조건부 평화협정§! 외교 기능을 사용할 수 없도록 제한합니다. 따라서 평화를 되찾기 위해서는 강제로 총력전을 끝까지 치러야만 할 것입니다."
 RULE_PEACE_PROPOSAL_BLOCKED_TT: "§Y조건부 평화 협정§!이 활성화된 동안에는 이 기능이 차단됩니다. 대신 §Y$CPD_OFFER_CONDITIONAL_PEACE_TITLE$§!을(를) 사용하십시오!"
 RULE_OPTION_SECOND_COAL_WARS: "제2차 석탄 전쟁"
 RULE_OPTION_SECOND_COAL_WARS_AI_DESC: "The Free States refuse the revived §8United Mine Workers§! any reopening of the West Virginia pits, and the coalfields riot and declare the state independent. A second Coal War opens a front in the Appalachians §Rand this path only exists if the United States rule is set to Post United Era or The Great Collapse§!."
 NEN_AI_BEHAVIOR: "@NEN 뉴잉글랜드"
 RULE_OPTION_GREEN_MOUNTAIN_REBELLION: "그린 마운틴 반란"
 RULE_OPTION_GREEN_MOUNTAIN_REBELLION_AI_DESC: "The national government refuses the Vermont demand to move the seat of government to Montpelier and lets the resentment build. The §8Green Mountain§! counties rise, and New England has to put down a rebellion in one of its own states §Rand this path only exists if the United States rule is set to Post United Era or The Great Collapse§!."
 RULE_OPTION_THE_OTHER_NEW_CAPITAL: "또 다른 새로운 수도"
 RULE_OPTION_THE_OTHER_NEW_CAPITAL_AI_DESC: "Few in the capital care enough to fight over an address, so the government grants the Vermont demand and moves to Montpelier. New England spends nothing on the quarrel and keeps its northern states content §Rand this path only exists if the United States rule is set to Post United Era or The Great Collapse§!."
 RULE_ALLOW_WORLD_WAR: "세계대전 강제화"
 RULE_ALLOW_ENABLE_WORLD_WAR: "정해진 수순의 세계 대전 활성화"
 RULE_ALLOW_ENABLE_WORLD_WAR_YES_DESC: "이 옵션은 대체역사 요소를 제한하고, 다른 모드들처럼 특정 연도에 세계대전이 발발하도록 유도합니다.\n\n역사적 AI 모드로 플레이하고 'AI 부채 전쟁' 옵션을 끄는 것이 강력히 권장됩니다."
 RULE_ALLOW_ENABLE_WORLD_WAR_NO: "정해진 수순의 세계 대전 비활성화"
 RULE_ALLOW_ENABLE_WORLD_WAR_NO_DESC: "밀레니엄 던이 기존의 대체역사 형태를 유지합니다."
 RULE_ENABLE_INVESTMENT_COLLAPSE_LOCK: "파산 위기 상황에서 투자 제한"
 RULE_ENABLE_INVESTMENT_COLLAPSE_LOCK_NO_DESC: "\"파산 위기\" 임무가 활성화된 상태에서도 타국에 투자를 보낼 수 있습니다."
 RULE_ENABLE_INVESTMENT_COLLAPSE_LOCK_YES_DESC: "\"파산 위기\" 임무가 활성화된 상태에서는 더 이상 타국에 투자를 보낼 수 없습니다."
 RULE_HISTORIC_EVENTS: "역사적 사건 발생 시기"
 RULE_HISTORIC_EVENTS_NO: "역사적 사건이 무작위로 발생합니다. 이는 일반적인 게임 설정입니다."
 RULE_HISTORIC_EVENTS_YES: "역사적 사건이 무작위로 발생하지 않습니다. 대부분의 사건은 여전히 무작위성을 띠지만, 특정 사건은 지연을 방지하기 위해 역사적 날짜가 포함된 달에 반드시 발생하도록 보정됩니다. 이것이 완벽한 역사적 고증을 의미하지는 않으며, 단지 역사적 흐름을 따르도록 도울 뿐입니다."
 RULE_ALLOW_MD_ANNEX: "지저분한 국경 합병 허용"
 RULE_OPTION_MD_ANNEX_NO_DESC: "평화 협정 이후의 국경에 개입하지 않으며, 국경은 회담에서 획정된 그대로 유지됩니다."
 RULE_OPTION_MD_ANNEX_YES_DESC: "평화협정 이후 동일한 국가 태그가 여러 개 존재할 경우, 나머지 세력은 가장 강력한 종주국을 둔 쪽으로 통합됩니다. 종주국의 국력은 열강 순위 국민정신에 따라 결정됩니다. 합병이 완료되기까지 최대 14일이 소요될 수 있습니다."
 RULE_DISABLE_CSTO: "집단안보조약기구(CSTO) 비활성화"
 RULE_YES_DISABLE_CSTO_DESC: "게임 로딩 시 집단안보조약기구(CSTO)가 비활성화됩니다."
 RULE_NO_DISABLE_CSTO_DESC: "집단안보조약기구(CSTO)는 세력으로 계속 유지됩니다."
 RULE_DISABLE_MUSLIM_BROTHERHOOD_CIVIL_WAR: "무슬림 형제단 내전 비활성화"
 RULE_YES_DISABLE_MUSLIM_BROTHERHOOD_CIVIL_WAR_DESC: "무슬림 형제단 내전이 비활성화됩니다."
 RULE_NO_DISABLE_MUSLIM_BROTHERHOOD_CIVIL_WAR_DESC: "무슬림 형제단 내전이 활성화됩니다."
 RULE_OPTION_SWE_RED_SWEDEN: "Red Sweden"
 RULE_DISABLE_AI_INFLUENCE_PUPPETING: "AI 영향력 괴뢰화 비활성화"
 RULE_YES_DISABLE_AI_INFLUENCE_PUPPETING_DESC: "AI가 영향력 시스템을 통해 타국을 괴뢰국으로 만들 수 없습니다."
 RULE_NO_DISABLE_AI_INFLUENCE_PUPPETING_DESC: "AI가 영향력 시스템을 통해 타국을 괴뢰국으로 만들 수 있습니다."
 RULE_ALLOW_MP_ENHANCEMENTS: "멀티플레이 최적화"
 RULE_NOT_ALLOW_MP_ENHANCEMENTS_DESC: "게임 속도 향상을 위한 멀티플레이 기능을 허용하지 않습니다. 싱글플레이 시 권장하지 않습니다."
 RULE_ALLOW_MP_ENHANCEMENTS_DESC: "게임 속도 향상을 위한 멀티플레이 기능을 허용하지 않습니다. 또한 국력 순위 요구 조건을 무시하고 모든 국가가 세력을 창설할 수 있게 합니다."
 RULE_DISABLE_WESTERN_OUTLOOK_FEATURES: "서구권의 공격적 영향력 기능 비활성화"
 RULE_YES_DISABLE_WESTERN_OUTLOOK_FEATURES: "영향력을 이용한 쿠데타 시도나 괴뢰화 같은 공격적인 서구권 기능을 비활성화합니다."
 RULE_INTERNAL_FACTION_COST_REDUCTION: "내부 파벌 비용 감소"
 RULE_DISABLE_INTERNAL_FACTION_COST_REDUCTION_DESC: "내부 파벌 변경 비용이 기본값으로 유지됩니다."
 RULE_ENABLE_INTERNAL_FACTION_COST_REDUCTION_DESC: "(콘텐츠상 막혀있는 경우를 제외하고) 모든 국가의 내부 파벌 변경 비용이 감소합니다. §R이로 인해 중점이 고장 나거나 문제가 발생하더라도 책임은 본인에게 있습니다.§!"
 RULE_OPTION_EU_ONE: "1일"
 RULE_OPTION_EU_ONE_DESC: "§R테스트 목적용입니다.§! 유럽 의회 및 유럽 이사회 투표 대기시간이 기본 180일 대신 1일로 설정됩니다."
 RULE_ALLOW_FORCING_A_WHITE_PEACE: "평화 강제 허용"
 RULE_YES_FORCING_A_WHITE_PEACE: "공격 전쟁 중인 국가에 백지 평화를 강제할 수 있도록 허용합니다."
 RULE_NO_FORCING_A_WHITE_PEACE: "공격 전쟁 중인 국가에 백지 평화를 강제하는 것을 허용하지 않습니다."
 RULE_OPTION_IF_POINT_00: "매달 0.00"
 RULE_OPTION_IF_POINT_00_DESC: "§Y내부 파벌§! 의견의 매달 변동치가 기본값인 0.50 대신 0.00으로 설정됩니다. 이 설정 사용 시 밀레니엄 던의 도전 과제가 비활성화됩니다."
 RULE_ENABLE_ENERGY_LOAD_SHARING: "에너지 부하 공유 활성화"
 RULE_ENABLE_ENERGY_LOAD_SHARING_DESC: "에너지 적자 발생 시 인접 국가에서 에너지를 사거나 팔 수 있는 에너지 부하 공유 시스템을 활성화합니다."
 RULE_DISABLE_ENERGY_LOAD_SHARING_DESC: "에너지 적자 발생 시 인접 국가에서 에너지를 사거나 팔 수 있는 에너지 부하 공유 시스템을 비활성화합니다."
