 Opium_Economy: "아편 경제"
 Opium_Economy_desc: "아편은 아프간에서 수 세기 동안 주요 환금작물이었습니다. 하지만, 지난 수십 년간의 혼란과 세계 마약 거래의 등장으로 아프가니스탄의 아편 재배가 크게 확대 되며, 대부분의 농촌 경제가 상당 부분 양귀비에 의존하고 있습니다. 그러나, 아편은 대부분이 불법적인 약물 제조에 사용되기 때문에 우리 정부가 아편의 재배를 통한 이익을 얻기는 어렵습니다."
 Major_Non_NATO_Ally: "주요 비NATO 동맹국"
 Major_Non_NATO_Ally_desc: "주요 비NATO 동맹국 (MNNA)은 북대서양조약기구 (NATO)의 회원국은 아니지만 미군과 전략적으로 긴밀하게 협조하는 미국 정부가 지정한 동맹국을 뜻합니다. 비록 MNNA 지위는 미국과 자동적으로 상호 방위 조약을 맺게 되는것을 뜻하지는 않으나, 비-NATO 국가들이 받을 수 없는 다양한 군사적, 재정적 이점을 누릴 수 있습니다."
 ISI_jihadist_islamic_state: "지하디스트의 이슬람 국가 (IS)"
 ISI_jihadist_islamic_state_desc: "[ISI.GetNameWithFlag]가 집결했고 칼리프 제국은 여전히 ​​강력하다. 이제 불신자들에 대한 지하드를 벌여 그들의 보잘것없는 존재를 끝장낼 때다!"
 isis_sleeper_cell_idea: "ISIS 잠복 조직"
 isis_sleeper_cell_idea_desc: "망할 테러리스트들이 우리나라에 침입해 문제를 일으키고 있습니다. 테러리스트들이 더 많은 피와 눈물, 고통을 초래하기 전에 그들을 끝장내야 합니다."
 israel_new_intifada: "신 인티파다 (Intifada)"
 hutu_tutsi_tensions: "르완다 (Hutu-Tutsi) 내부 긴장"
 hutu_tutsi_tensions_desc: "The Hutu and the Tutsi are two separate ethnic groups living in the border regions between the Democratic Republic of the Congo and Tanzania, especially in the two small countries Burundi and Rwanda. Burundi is dominated by the Tutsi and committed a genocide against the Hutu in 1972, whereas Rwanda is dominated by the Hutu and had hundreds of thousands of Tutsis slaughtered by Hutu militias in 1994.\n\nThese two ethnic groups just seem to not get along, but have been forced into the same countries by the European-created colonial borders."
