 investments_DECISIONS: "Строительные проекты"
 investments_DECISIONS_desc: "Наши строительные проекты в зарубежных странах.\n\nОбъём наших §Gмеждународных инвестиций§!: $$[?ROOT.int_investments] §Hмлрд§!.\nАктивные §Yинвестиционные проекты§!: [?active_projects]/15\n"
 investments_construction_CANCEL_decision: "Отменить строительный проект"
