 part_reusable_OLV6: "Systèmes de lancement partiellement réutilisables"
 part_reusable_OLV6_desc: "Les systèmes de lancement partiellement réutilisables sont des systèmes de lancement à plusieurs étages dans lesquels certains étages reviennent sur terre et sont réutilisés. Cela réduit les coûts et le temps de production."
 OLV7: "Lanceur 2025"
 OLV7_desc: "Un lanceur ou une fusée porteuse est un véhicule propulsé par fusée utilisé pour transporter une charge utile de la surface de la Terre vers l'espace, généralement vers l'orbite terrestre ou au-delà.\n\nLanceur orbital (Lanceur 2025):\n§YLancement spatial§!:\nMasse de Charge Utile: §Y20000§! kg | Fiabilité: §Y90%§!\n§YProduction§!:\nPrix par unité: §Y0.07§!$ milliards | Industries civiles par unité: §Y2§! | Jours de production par unité: §Y90§!"
 full_reusable_OLV7: "Systèmes de lancement entièrement réutilisables"
 full_reusable_OLV7_desc: "Les lanceurs entièrement réutilisables sont des systèmes dont tous les étages reviennent sur Terre et peuvent être réutilisés. Cela réduit considérablement les coûts et les délais de production."
 OLV8: "Lanceur 2035"
 OLV8_desc: "Un lanceur ou une fusée porteuse est un véhicule propulsé par fusée utilisé pour transporter une charge utile de la surface de la Terre vers l'espace, généralement vers l'orbite terrestre ou au-delà.\n\nLanceur orbital (Lanceur 2035):\n§YLancement spatial§!:\nMasse de Charge Utile: §Y24000§! kg | Fiabilité: §Y95%§!\n§YProduction§!:\nPrix par unité: §Y0.14§!$ milliards | Industries civiles par unité: §Y2§! | Jours de production par unité: §Y95§!"
 full_reusable_OLV8: "Systèmes de lancement entièrement réutilisables II"
 full_reusable_OLV8_desc: "Les lanceurs entièrement réutilisables sont des systèmes dont tous les étages reviennent sur Terre et peuvent être réutilisés. Cela réduit considérablement les coûts et les délais de production."
 ballistic_missile: "Missiles balistiques"
 ballistic_missile_desc: "Les missiles balistiques sont un type de missile qui utilise le mouvement de projection pour envoyer des ogives sur une cible. Les armes sont alimentées par un bref explosif et une grande dépense de carburant et de force et la majorité du vol se fait sans moteur. Certains missiles sont des missiles balistiques à courte portée (SRBM) qui restent dans l'atmosphère terrestre tandis que les plus gros de ces missiles sont capables de vol orbital et passent la majorité de leur vol hors de l'atmosphère."
 cruise_missile: "Missiles de croisière"
 cruise_missile_desc: "Un missile de croisière est un missile guidé autopropulsé sans pilote qui maintient son vol grâce à la portance aérodynamique pendant la majeure partie de sa trajectoire. Les missiles de croisière sont conçus pour transporter une charge utile importante sur de longues distances avec une grande précision. Les missiles de croisière modernes sont capables de se déplacer à des vitesses subsoniques, supersoniques ou hypersoniques élevées, sont auto-navigables et peuvent voler sur une trajectoire non balistique à très basse altitude."
 TEL_launched_missiles: "Missiles lancés par TEL"
 TEL_launched_missiles_desc: "§Y2 TEL§! (tracteur-érecteur-lanceur) a §Y1 Launcher§! par §YBatterie§! (2x1)."
