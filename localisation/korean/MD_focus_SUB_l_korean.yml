 ural_focus: "우랄 국가 중점 트리"
 URA_start_new_millenium: "스베르들롭스크의 새로운 세기"
 URA_start_new_millenium_desc: "스베르들롭스크 지방은 러시아에서 가장 중요한 산업 중심지 중 하나입니다. 새 천년에 접어들면서 이곳은 많은 문제를 안고 있습니다. 강도 행위, 소련 붕괴 이후 문을 닫은 공장들, 그리고 여전히 침체된 경제가 그것입니다."
 URA_attitude_federal: "연방 정책 지지"
 URA_attitude_federal_desc: "러시아의 구성 주체로서 우리는 모스크바 당국의 정책을 전적으로 지지할 것입니다. 우리가 독자적인 공화국을 만들려 했던 1993년의 경험은 지금도 모스크바가 우리 지역에 하는 인사 임명에 영향을 미치고 있습니다."
 URA_new_business_centers: "새로운 비즈니스 센터"
 URA_new_business_centers_desc: "현 스베르들롭스크 지방 수장과 예카테린부르크 시장은 이견에도 불구하고 한 가지 점에서 뜻을 같이합니다. 이 지역이 우랄 전체의 비즈니스 중심지가 되어야 하며 이를 위해 적극 기여해야 한다는 것입니다."
 URA_transport_development: "교통 체계 발전"
 URA_transport_development_desc: "지역 주민의 활발한 증가와 예카테린부르크 및 인근 도시로의 인구 유입 증가로 인해 도로 건설 재원을 늘릴 수밖에 없습니다."
 URA_deal_with_chernetsky: "예카테린부르크 시장과의 갈등"
 URA_deal_with_chernetsky_desc: "지역 정부와 예카테린부르크 시청은 수년 동안 서로 암묵적으로 대립해 왔습니다. 정치 상황을 안정시키려면 이 갈등을 점진적으로 완화해야 합니다."
 URA_russian_expo_arms: "러시아 무기 박람회"
 URA_russian_expo_arms_desc: "군사 장비 제조업체들이 성과를 선보이도록 이곳에 많이 유치하기 위해, 우리 지역의 사격장 중 한 곳에 무기 박람회를 열 계획입니다."
 URA_deal_with_ocg: "90년대 갱단 처리"
 URA_deal_with_ocg_desc: "90년대 이래 몇몇 대규모 범죄 조직이 우리 지역에서 큰 영향력과 권력을 행사해 왔습니다. 그들은 행동 면에서 꽤 애국적이고 외부의 영향력이 지역에 미치지 못하게 막고 있기는 하나, 그들이 쿠데타를 일으키기 전에 제거해야 할 때입니다."
 URA_german_investors: "독일 투자자"
 URA_german_investors_desc: "양국 정부 간에 필요한 대화가 이미 이루어져 있으므로 독일의 투자자를 우리 지역에 유치하고자 합니다."
 URA_meeting_foreign: "외국 대사와의 회담"
 URA_meeting_foreign_desc: "예카테린부르크에는 수많은 외국 영사관이 위치해 있으며 더 많은 영사관이 개설될 예정입니다. 우리는 주요 EU 국가들과의 외교적 접촉을 확대할 계획입니다."
 URA_meeting_belarus: "벨라루스와의 동반자 관계"
 URA_meeting_belarus_desc: "우리는 벨라루스에 무역 협정을 제안할 준비가 되어 있으며, 이는 우리의 농업 기술을 향상시키는 데 도움이 될 것입니다."
 URA_koltsovo: "콜초보 공항 확장"
 URA_koltsovo_desc: "우리 지역으로 가는 항공편이 늘어남에 따라 주 공항인 콜초보를 보수하고 확장해야 합니다."
 URA_factories: "신규 공장"
 URA_factories_desc: "우랄의 산업 잠재력 또한 확충되어야 하며, 적어도 소련 붕괴 이전 수준으로 회복하도록 노력해야 합니다."
 URA_agro_restruict: "농공업 부문 투자"
 URA_agro_restruict_desc: "우리의 농공업 복합체에도 투자가 필요합니다. 우리의 최고 공장들이 우랄을 먹여 살릴 것입니다!"
 URA_small_business: "소기업 지원"
 URA_small_business_desc: "소기업은 진보의 엔진입니다. 지역에 소기업이 많을수록 우리가 거둘 세금도 늘어납니다."
 URA_policy_category: "우랄의 정치"
 URA_policy_category_desc: "\n\n\n\n\n\n£URA_desctext_policy \n\n\n\n\n\n\n\n\n우랄은 러시아 전체의 버팀목입니다. 주요 군수 산업 생산이 이곳에 위치해 있습니다. 90년대에 이미 이 지역은 독립, 또는 적어도 더 큰 자치에 대한 열망을 보였습니다. 이제 우랄의 잠재력을 실현할 때입니다."
 URA_edro: "통합 러시아"
 URA_edro_desc: "우리는 연방 당국의 정책을 전적으로 지지할 준비가 되어 있으며 그들과 대립할 생각이 없습니다."
 URA_support_from_moscow: "모스크바의 지원"
 URA_support_from_moscow_desc: "모스크바에 대한 우리의 충성이 보답을 받아 연방 중앙으로부터 소규모 보조금을 받았습니다."
 URA_titanium_valley: "티타늄 밸리"
 URA_titanium_valley_desc: "티타늄 밸리는 러시아 우랄 연방관구 스베르들롭스크 주에 있는 경제특구로, 항공기, 자동차, 조선 및 의료 산업용 티타늄 제품 생산에 주력할 것입니다. 이 특구는 세계 최대 티타늄 생산업체인 VSMPO-아비스마를 중심으로 조성될 것입니다."
 URA_misharin: "알렉산드르 미샤린"
 URA_misharin_desc: "알렉산드르 세르게예비치 미샤린은 러시아 스베르들롭스크 주의 전 주지사입니다. 그는 이전 주지사 에두아르트 로셀이 사임한 뒤에 임명되었습니다."
 URA_innoprom: "이노프롬"
 URA_innoprom_desc: "이노프롬은 매년 예카테린부르크에서 열리는 대규모 국제 산업 박람회입니다. 공표된 바에 따르면 이 박람회의 목적은 러시아에서 개발되어 산업에 즉시 적용할 수 있는 첨단 기술을 선보이고, 최고의 혁신 사례의 확산과 산업 기업과 기술 개발자 간 비즈니스 관계 발전을 촉진하는 것입니다."
 URA_metro_expansion: "지하철 확장"
 URA_metro_expansion_desc: "예카테린부르크의 지하철은 세계에서 가장 작은 축에 속합니다. 우리는 연방 정부의 지원을 받아 몇 개 역을 더 늘릴 준비가 되어 있습니다."
 URA_bajov: "바조프 운동"
 URA_bajov_desc: "지역 애국심 고취를 목표로 하는 정치 조직을 설립할 계획입니다. 이 조직은 우랄의 저명한 작가이자 애국자인 바조프의 이름을 달게 될 것입니다."
 URA_relations_moscow: "모스크바와의 관계 유지"
 URA_relations_moscow_desc: "우리는 모스크바에 계속 충성할 계획이며, 이는 연방 중앙으로부터 지역이 더 많은 지원을 받게 해 줄 것입니다."
 URA_more_roads: "인프라 확장"
 URA_more_roads_desc: "지역이 빠르게 발전하고 있어 다시 인프라 투자가 필요합니다."
 URA_big_ekb: "대예카테린부르크"
 URA_big_ekb_desc: "모스크바를 본받아 예카테린부르크를 인근의 여러 마을 및 도시와 합쳐 거대 도시를 만들 계획입니다."
 URA_kuyvashev: "예브게니 쿠이바셰프"
 URA_kuyvashev_desc: "예브게니 블라디미로비치 쿠이바셰프는 이전 주지사의 사임 이후 스베르들롭스크 주지사를 맡고 있는 러시아 정치인입니다. 쿠이바셰프는 앞서 우랄 연방관구 제3대 대통령 전권대표를 지냈습니다. 그는 튜멘과 토볼스크 행정 수장 등의 직책을 역임했습니다."
 URA_eltsyn_center: "보리스 옐친 대통령 센터"
 URA_eltsyn_center_desc: "보리스 옐친 대통령 센터는 옐친 센터라고도 불리며, 예카테린부르크에 개관한 사회, 문화, 교육 센터입니다. 프로젝트의 건축가는 건축, 소통, 예술, 산업 디자인의 접점에서 활동하는 학제 간 사무소 BERNASKONI의 창립자 보리스 베르나스코니입니다. 이 센터의 주요 시설 중 하나는 러시아 현대 정치사와 초대 대통령에게 헌정된 보리스 옐친 박물관입니다."
 URA_transport_reform: "교통 개혁"
 URA_transport_reform_desc: "우리 지역, 특히 예카테린부르크에는 여객 운송업체가 너무 많습니다. 비용을 줄이기 위해 이렇게 많은 운송 수단을 최적화할 계획입니다."
 URA_ekaterinburg_city: "예카테린부르크 시티"
 URA_ekaterinburg_city_desc: "예카테린부르크 시티는 러시아 예카테린부르크 도심 근처의 상업 지구입니다. 이세트 강 제방의 보리스 옐친 거리에 위치해 있으며 현재 개발 중입니다. 이 지구는 5헥타르를 차지합니다."
 URA_expo_arms_to_moscow: "무기 박람회를 모스크바에 양도"
 URA_expo_arms_to_moscow_desc: "모스크바 정부는 우리의 무기 박람회를 가져가 자신들의 지역에서 개최하려 합니다. 우리는 이것이 훌륭한 해결책이 될 것이라 생각합니다."
 URA_end_conflict: "갈등 종식: 시청 - 지방"
 URA_end_conflict_desc: "오랜 정치적 대립 끝에 우리는 마침내 이 해묵은 갈등을 완전히 끝낼 준비가 되었습니다."
 URA_second_stage_titanium_valley: "티타늄 밸리 2단계"
 URA_second_stage_titanium_valley_desc: "우리의 티타늄 밸리는 계속 확장될 것입니다."
 URA_gold_rossel: "로셀의 황금기"
 URA_gold_rossel_desc: "우리 지역은 당시 로셀 주지사처럼 자치의 이상을 수호할 계획입니다."
 URA_ural_spirit: "우랄 정신"
 URA_ural_spirit_desc: "우랄 정신은 우랄을 특별한 지역으로 만드는 것입니다. 독립에 대한 열망, 누구의 그림자도 되지 않으려는 의지이며, 우리는 우랄 정체성과 함께 이를 발전시킬 계획입니다."
 URA_return_to_republic: "우랄 공화국 재선포"
 URA_return_to_republic_desc: "우랄 공화국의 복원을 다시 선포할 계획입니다. 우리는 공화국 해산에 강하게 반대하며, 이 결정이 헌법에 부합하지 않았다고도 믿습니다."
 URA_our_import: "우랄 수입 대체"
 URA_our_import_desc: "경제적 자치를 강화하기 위해 우랄 제품을 계속 발전시킬 것입니다."
 URA_ural_francs: "우랄 프랑"
 URA_ural_francs_desc: "또한 독자 화폐인 우랄 프랑이라는 구상으로 돌아갈 계획입니다. 이 구상은 로셀이 아니라 올리가르히 안톤 바코프가 제안한 것입니다. 이렇게 하면 루블 권역이 붕괴할 경우에도 우리 경제를 지킬 수 있습니다."
 URA_meet_governors: "우랄 지역 주지사들과의 회담"
 URA_meet_governors_desc: "1993년처럼 우랄 지역 정부들과 다시 협력 협정에 서명할 계획입니다."
 URA_invest_in_destroyed: "파괴된 시설에 투자"
 URA_invest_in_destroyed_desc: "민영화로 인해 이전에 파괴된 공장들의 복구에 투자하고 있습니다."
 URA_region_campaign: "우랄 공화국 선전"
 URA_region_campaign_desc: "시위 등의 평화적 수단을 활용해 지역 주민과 당국이 우리와 합의에 이르도록 설득할 계획입니다."
 URA_region_unrest: "지역 반란"
 URA_region_unrest_desc: "각 지역에서 폭동을 조직하고 이들을 강제로 우리에게 귀속시킬 계획입니다."
 URA_republican_army: "우랄 공화국군"
 URA_republican_army_desc: "우랄은 독립을 지키고 내부 문제를 해결하기 위해 오래전에 이미 독자적인 군대를 가졌어야 했습니다. 이제 우리는 독자적인 군대의 창설을 공식 발표할 준비가 되었습니다."
 URA_sklads: "러시아 무기 접수"
 URA_sklads_desc: "우리 영토에 있는 모든 무기를 우리 군을 위해 접수할 계획입니다."
 URA_territoral_defence: "우랄 영토 방위"
 URA_territoral_defence_desc: "내부 문제 해결과 국경 방어를 위해 독자적인 영토 방위군의 창설을 발표할 것입니다. 다행히 러시아 법률은 영토 방위군의 창설을 허용하며, 우리는 연방 중앙과 충돌하지 않습니다."
 URA_great_ural: "위대한 우랄"
 URA_great_ural_desc: "경제적 권력 중심지로서의 위대한 우랄이라는 꿈은 1993년 이후 많은 이들의 마음속에서 오랫동안 무르익어 왔으며, 이제 우리는 이를 위해 나아갈 준비가 되어 있습니다."
 URA_germany_cores: "독일-우랄 동반자 관계"
 URA_germany_cores_desc: "우리는 오래전부터 독일을 무역, 경제, 군사 등 모든 관계에서 주된 동반자로 여겨 왔습니다. 우리는 이 동반자 관계를 새로운 단계로 끌어올릴 계획입니다."
 URA_germany_bundesver: "독일군과의 훈련"
 URA_germany_bundesver_desc: "우리 군을 개선하는 데 필요한 경험을 얻기 위해 독일군과 합동 훈련을 실시할 것입니다."
 URA_germany_weapons: "독일제 소총 구매"
 URA_germany_weapons_desc: "우리 군을 재무장해야 하므로 독일로부터 소총을 구매하는 대규모 계약을 체결할 준비가 되어 있습니다."
 URA_germany_infra: "독일 인프라"
 URA_germany_infra_desc: "우리의 인프라를 현대화하기 위해 독일과 대규모 계약을 체결할 계획입니다."
 URA_germany_more_trade: "대규모 무역 협정"
 URA_germany_more_trade_desc: "무역 속도를 더욱 발전시킬 계획이며 양국 간의 대규모 산업 협정을 맺을 준비가 되어 있습니다."
 URA_germany_army: "우랄군의 독일식 경험"
 URA_germany_army_desc: "독일군과의 협력은 완전히 새로운 수준에 이를 것이며, 이는 우리가 독자적인 강력한 군대를 만드는 단계로 전환하는 계기가 될 것입니다."
 URA_germany_more_weapons: "독일제 전차 구매"
 URA_germany_more_weapons_desc: "우리의 생산 시설과 독일제 전차의 도움으로, 우랄을 외부의 침해로부터 지킬 강력한 전차 부대를 창설할 수 있을 것입니다. 따라서 독일제 전차의 대량 구매를 발표할 준비가 되어 있습니다."
 URA_ger_promka: "독일과의 산업 계약"
 URA_rne_start: "러시아의 우랄"
 URA_rne_start_desc: "우랄은 이제 진정한 러시아 애국자들의 지도 아래 있습니다. 우리의 철권이 이 아름다운 지역의 러시아적 부흥을 방해하는 모든 이들을 제거할 것입니다."
 URA_rne_orthodoxy: "정교회의 우랄"
 URA_rne_orthodoxy_desc: "종교는 우리가 정부의 토대에도 놓을 기반입니다. 신앙이 없다면 우리 국민은 서방이 강요하는 가치 속에서 길을 잃고 번영과 강성으로 이끌어 줄 이정표를 잃게 될 것입니다."
 URA_rne_paramilitary: "준군사 조직"
 URA_rne_paramilitary_desc: "더 많은 지지자를 우리 대열로 끌어들이기 위해 준군사 조직을 창설하기 시작할 것입니다. 장차 우리 고향 땅을 지킬 전투원이 필요할 것입니다."
 URA_rne_disloyal: "불충한 자 제거"
 URA_rne_disloyal_desc: "즉시 우리 대열을 정리하기 시작할 것입니다. 잠재적 배신자와 푼돈에 우리의 이상을 팔아넘길 자들을 즉시 가려내야 합니다."
 URA_rne_migrants: "엄격한 이민 정책"
 URA_rne_migrants_desc: "이민자들이 게토에 모여 우리 시민들을 공포에 떨게 하도록 허용하지 않을 것입니다. 이민이라는 재앙으로부터 우리 집을 지킬 것입니다."
 URA_rne_false_democracy: "거짓 민주주의의 종식"
 URA_rne_false_democracy_desc: "민주주의와 그 모든 거짓된 제도는 모든 문제를 해결하는 방법으로 수년간 우리 국민에게 주입되었지만, 몇 년이 지난 지금 사람들이 그것을 기도하던 곳에는 폐허만 남아 있습니다. 거짓 민주주의를 타도하자!"
 URA_rne_no_radicalism: "급진주의 배격"
 URA_rne_no_radicalism_desc: "우리의 열렬한 민족주의에도 불구하고, 우리는 쇼비니즘과 나치즘으로 이어지는 가장 급진적인 형태를 적극 배격합니다. 우리는 그러한 급진주의자들과 싸울 것입니다."
 URA_rne_youth: "청년 준군사 운동"
 URA_rne_youth_desc: "우리가 만든 청년 운동에 젊은이들을 적극 참여시킬 것입니다. 그들 한 사람 한 사람은 조국을 지킬 잠재적 전투원이자 수호자입니다."
 URA_rne_security: "비밀 정보기관"
 URA_rne_security_desc: "우리 가운데에는 FSB, GRU, 내무부 같은 기관에서 복무한 퇴역 군인이 많습니다. 그들의 경험과 지식, 전술을 활용하여 독자적인 보안 기관을 구성할 계획입니다."
 URA_rne_anti_amer: "반미-반이스라엘 독트린"
 URA_rne_anti_amer_desc: "우리는 세계의 모든 악과 폐해의 근원이 미국과 이스라엘이라고 믿습니다. 세계의 모든 분쟁을 부추기고 어디서든 그로부터 이익을 얻는 것은 바로 그들입니다."
 URA_rne_nationalise: "국유화"
 URA_rne_nationalise_desc: "90년대의 약탈적 민영화로 도둑맞은 모든 것을 우리 지역의 이익과 이득을 위해 되찾아 올 것입니다."
 URA_rne_anti_commies: "반공 선전"
 URA_rne_anti_commies_desc: "우랄은 공산주의 정서가 큰 영향을 미친 지역이었던 적이 없으며, 특히 스베르들롭스크 자체는 소련 붕괴에 찬성표를 던졌지만, 그래도 우리는 공산주의자들과 더 싸우려 노력할 것입니다."
 URA_rne_protect_russian: "러시아인 보호 독트린"
 URA_rne_protect_russian_desc: "우리는 세계 어디에서든, 어느 대륙에서든 언제나 러시아 민족과 그 이익을 위해 싸울 것입니다."
 URA_rne_military_power: "우랄의 군사력"
 URA_rne_military_power_desc: "우랄의 힘은 군수 공장들과 모든 위협으로부터 스스로를 지켜 줄 군사적 잠재력에 있습니다."
 URA_rne_social_just_state: "사회적으로 정의로운 국가"
 URA_rne_social_just_state_desc: "우리 시민은 안전하다고 느끼고 자신을 보호해 주는 국가를 지킬 준비가 되도록, 가능한 모든 사회적 보장으로 보호받아야 합니다."
 URA_rne_provide_work: "실업자를 위한 일자리"
 URA_rne_provide_work_desc: "실업은 없애야 하며, 이를 없애는 가장 좋은 방법은 사람들에게 일자리를 주는 것이고, 우리는 새 공장을 건설하여 일자리를 제공할 것입니다."
 URA_rne_free_education: "무상 교육의 전통"
 URA_rne_free_education_desc: "무상 교육은 소련 시대부터 존재해 왔으며, 우리는 이처럼 효과적이고 유용한 관행을 포기할 생각이 없습니다. 오히려 이러한 형태의 교육을 개선하고 효율성을 높이는 데 투자할 계획입니다."
 URA_rne_decent_life: "품위 있는 삶"
 URA_rne_decent_life_desc: "품위 있는 삶은 우리 시민이 젊은 시절과 노년에 보장받아야 할 것이며, 이것이 우리 사회 정책의 주된 목표입니다."
 URA_rne_russian_dictatorship: "전 우랄 러시아 민족 독재"
 URA_rne_russian_dictatorship_desc: "우리는 우랄 지역 전체에 우리의 사상을 적극 전파할 것이며, 한 지역에만 국한될 수 없습니다."
 URA_rne_bunt_regions: "러시아 우랄 혁명"
 URA_rne_bunt_regions_desc: "모스크바가 세운 우랄 점령 체제를 타도하라. 우리는 러시아 혁명의 불길 속에서 우랄을 해방할 것입니다."
 URA_rne_friend_nazbol: "뜻밖의 동맹"
 URA_rne_friend_nazbol_desc: "지금 러시아가 처한 현실과 지난 100년간의 혼란이 초래한 파국을 직시하며 옛 영광을 되찾을 길을 모색하던 중 내린 결단입니다. 정부의 꼭두각시나 거짓 애국자가 아닌 진정으로 러시아를 지탱해 온 유일한 세력인 민족볼셰비키에게, 우리보다 훨씬 탄탄한 그들의 지지세를 바탕으로 조국을 구할 시작점이 되어 줄 단초를 제공하기로 한 결정입니다."
 URA_rne_ekb_all_nazbol: "예카테린부르크 민족 볼셰비키 포럼"
 URA_rne_ekb_all_nazbol_desc: "국내 정치에 영향력을 행사하고자 그들과 전력을 통합하기 위해 마련한, 우랄의 수도에서 열리는 전 세계 민족볼셰비키 결집 포럼입니다."
 URA_rne_nazbol_unite_propaganda: "통합 선전"
 URA_rne_nazbol_unite_propaganda_desc: "우리의 선전 역량을 통합하고 러시아 전역의 대중에게 우리의 선전을 전달하기 위해 노력할 것입니다."
 URA_rne_nazbol_revanshizm_propaganda: "복수주의 선전"
 URA_rne_nazbol_revanshizm_propaganda_desc: "두 제국의 붕괴와 지난 100년간 러시아에 일어난 일, 그리고 현 당국이 이 제국을 이끌었고 그 멸망으로 이끌 이들의 화신이라는 점을 사람들에게 상기시켜야 합니다."
 URA_rne_nazbol_to_russia: "새로운 러시아"
 URA_rne_nazbol_to_russia_desc: "우리는 목표를 달성했습니다. 이제 러시아의 진정한 애국자들이 크렘린을 차지했으며, 우리는 이 러시아를 다시 위대하게 만드는 데 도움을 줄 이들의 대열에 합류할 준비가 되었습니다."
 URA_rne_volunteer_blr: "[BLR.GetName]의 의용군"
 URA_rne_volunteer_blr_desc: "의용군이 진정한 러시아 우랄을 위한 우리의 투쟁을 도울 준비가 되어 있습니다."
 URA_rne_volunteer_ukr: "[UKR.GetName]의 의용군"
 URA_rne_volunteer_ukr_desc: "의용군이 진정한 러시아 우랄을 위한 우리의 투쟁을 도울 준비가 되어 있습니다."
 URA_rne_volunteer_ger: "[GER.GetName]의 의용군"
 URA_rne_volunteer_ger_desc: "의용군이 진정한 러시아 우랄을 위한 우리의 투쟁을 도울 준비가 되어 있습니다."
 URA_rne_volunteer_hun: "[HUN.GetName]의 의용군"
 URA_rne_volunteer_hun_desc: "의용군이 진정한 러시아 우랄을 위한 우리의 투쟁을 도울 준비가 되어 있습니다."
 URA_rne_volunteer_bul: "[BUL.GetName]의 의용군"
 URA_rne_volunteer_bul_desc: "의용군이 진정한 러시아 우랄을 위한 우리의 투쟁을 도울 준비가 되어 있습니다."
 URA_nazbols_ekb: "예카테린부르크 민족 볼셰비키 포럼"
 URA_nazbols_unite: "통합 선전"
 URA_nazbols_revanshizm: "복수주의 선전"
 URA_rne_idea: "러시아 민족의 우랄"
 URA_rne_russian_dictatorship_idea: "러시아 민족 독재"
 URA_rne_education_idea: "러시아 민족 교육"
 URA_rne_paramilitary_idea: "준군사 조직"
 URA_rne_youth_idea: "청년 준군사 조직"
 URA_rne_security_idea: "비밀 정보기관"
 URA_rne_protect_russians_idea: "러시아인 보호 독트린"
 URA_rne_volunteers_battalion_idea: "외국인 의용군"
 URA_rne_TT: "[SOV.GetNameWithFlag]에서 §R민족볼셰비키§!의 인기도를 증가시키는 §Y새로운 결정§!이 공개됩니다."
 URA_democratic_start: "우랄 민주주의"
 URA_democratic_start_desc: "민주주의의 진정한 지지자들이 마침내 우랄을 장악했습니다. 우리는 러시아의 나머지 지역에 진정한 법치 국가를 보여줄 것입니다."
 URA_democratic_government: "새 정부"
 URA_democratic_government_desc: "합법적으로 선출된 의원들로만 새 정부를 구성할 것입니다."
 URA_democratic_new_republic: "새 공화국"
 URA_democratic_new_republic_desc: "우랄에는 가장 정직하고, 가장 애국적이며, 가장 민주적인 정치인들이 필요합니다. 우리 공화국은 바로 그런 사람들을 당국에 모으기 위해 노력할 것입니다."
 URA_democratic_constituion: "새 헌법"
 URA_democratic_constituion_desc: "모든 허점을 없애고 더욱 민주적으로 만들도록 헌법을 다시 쓸 것입니다."
 URA_democratic_old_amministrative: "신구 행정 구역"
 URA_democratic_old_amministrative_desc: "현재의 영토 구분 원칙을 버리고 내부 구획을 완전히 다시 짤 계획이며, 러시아 제국 시기의 구분 원칙에 의거할 것입니다. 그 안에서 더 경제적이고 영토적인 논리를 찾을 수 있기 때문입니다."
 URA_democratic_internal_affairs: "내무부"
 URA_democratic_internal_affairs_desc: "지역의 내부 문제 상황을 완전히 통제하기 위해 독자적인 내무부를 창설할 계획입니다."
 URA_democratic_state_secuirty: "국가안보부"
 URA_democratic_state_secuirty_desc: "우리가 창설한 국가안보부는 고향 땅의 내부 질서 안정을 보장하는 데 도움이 될 것입니다. FSB, GRU, 내무부 등 여러 기관의 전직 인원을 모집할 계획이며, 이를 통해 숙련된 부서를 만들 수 있을 것입니다."
 URA_democratic_ural_spirit: "우랄 정신"
 URA_democratic_ural_spirit_desc: "자유의 우랄 정신은 그 누구도 우리를 꺾지 못하도록 우리가 계속 길러 나갈 것입니다."
 URA_democratic_socially_protected: "사회적으로 보호받는 시민"
 URA_democratic_socially_protected_desc: "민주 국가가 마땅히 해야 할 일이므로 시민을 지원하는 여러 사회적 조치를 취할 것입니다."
 URA_democratic_armed_forces: "우랄 공화국군"
 URA_democratic_armed_forces_desc: "우랄은 독립을 지키고 내부 문제를 해결하기 위해 오래전에 이미 독자적인 군대를 가졌어야 했습니다. 이제 우리는 독자적인 군대의 창설을 공식 발표할 준비가 되었습니다."
 URA_democratic_sklads: "러시아 무기 접수"
 URA_democratic_sklads_desc: "우리 영토에 있는 모든 무기를 우리 군을 위해 접수할 계획입니다."
 URA_democratic_ter_oborona: "우랄 영토 방위"
 URA_democratic_ter_oborona_desc: "내부 문제 해결과 국경 방어를 위해 독자적인 영토 방위군의 창설을 발표할 것입니다. 다행히 러시아 법률은 영토 방위군의 창설을 허용하며, 우리는 연방 중앙과 충돌하지 않습니다."
 URA_democratic_anti_corruption: "반부패 센터"
 URA_democratic_anti_corruption_desc: "부패와의 전쟁을 선포하는 데 그치지 않고, 시민들이 이 싸움에 참여할 수 있다는 점을 자랑스러워하도록 만들어야 합니다. 따라서 어떤 시민이든 우리를 도울 수 있는 반부패 센터를 개설합니다."
 URA_democratic_usaid: "USAID 요청"
 URA_democratic_usaid_desc: "서방 국가들과의 우호 관계를 지지하는 차원에서 미국의 USAID 프로그램에 참여할 계획입니다."
 URA_democratic_eu: "EU와의 동반자 관계"
 URA_democratic_eu_desc: "더 폭넓은 협력을 위해 유럽 국가들과 접촉을 수립할 것입니다."
 URA_democratic_free_media: "자유 언론"
 URA_democratic_free_media_desc: "우리는 전체주의적 검열을 하거나 언론에서 의견의 자유를 제한할 생각이 없습니다."
 URA_democratic_western_investors: "서방 투자자 유치"
 URA_democratic_western_investors_desc: "서방 투자자들은 오랫동안 우리 지역을 눈여겨봐 왔지만, 문제들 때문에 이전에는 우리에게 투자하기를 꺼렸습니다. 이제 상황이 바뀌었고 마침내 유럽 투자자에게 우리 지역의 문을 열어 볼 수 있습니다."
 URA_democratic_subsidies_regions: "인접 지역 인구 유치"
 URA_democratic_subsidies_regions_desc: "인구 증가를 촉진하기 위해 우리 지역으로 이주하는 모든 이들에게 추가 자금을 지급할 계획입니다."
 URA_democratic_invest_it: "IT 부문 투자"
 URA_democratic_invest_it_desc: "미래는 IT 기술의 것이며 이는 지금도 분명합니다. 우리는 이 분야에서 뒤처질 생각이 없으며 IT 분야를 적극 후원할 것입니다."
 URA_democratic_offshore_zone: "역외 구역"
 URA_democratic_offshore_zone_desc: "우리 지역 내에 역외 구역을 조성하여 외국인 투자를 유치할 준비도 되어 있습니다."
 URA_democratic_euro_defence: "EU 국가들과의 훈련"
 URA_democratic_euro_defence_desc: "우리 군을 훈련시키기 위해 EU 국가들과 일련의 훈련을 실시할 것입니다."
 URA_democratic_nato_weapon: "나토 국가에서의 무기 구매"
 URA_democratic_nato_weapon_desc: "독립 국가로서 우리의 무기고를 시급히 보충해야 합니다."
 URA_democratic_liberal_stronghold: "자유주의의 거점"
 URA_democratic_liberal_stronghold_desc: "우리는 우랄과 인근 모든 지역에서 자유주의 가치의 화신이 될 것입니다."
 URA_democratic_referendum_region: "평화 시위"
 URA_democratic_referendum_region_desc: "우리는 혁명의 불길을 일으킬 생각이 없으며, 우랄 지역 문제를 평화적으로 해결할 계획입니다."
 URA_democratic_chelyaba_business: "첼랴빈스크 시"
 URA_democratic_chelyaba_business_desc: "우리는 이 지역의 수도 개발에 투자하여 우리 공화국 전체의 경제 발전을 가속화할 계획입니다."
 URA_democratic_kurgan_business: "쿠르간 시"
 URA_democratic_kurgan_business_desc: "우리는 이 지역의 수도 개발에 투자하여 우리 공화국 전체의 경제 발전을 가속화할 계획입니다."
 URA_democratic_orenburg_business: "오렌부르크 시"
 URA_democratic_orenburg_business_desc: "우리는 이 지역의 수도 개발에 투자하여 우리 공화국 전체의 경제 발전을 가속화할 계획입니다."
 URA_democratic_idea: "민주 우랄"
 URA_democratic_state_security_idea: "국가안보부"
 URA_democratic_internal_affairs_idea: "내무부"
 URA_idea_eu_member_associate: "EU와의 협력"
 URA_monarchy_start: "군주제 우랄"
 URA_monarchy_start_desc: "우랄은 러시아에서 군주주의 복귀의 등불이 될 것입니다. 우리는 이상적인 입헌 군주국을 건설할 것이며 다른 모두가 우리에게 손을 내밀 것입니다."
 URA_monarchy_identity: "정체성 유지"
 URA_monarchy_identity_desc: "우리는 군주제를 지향하지만 우랄 정체성을 지지할 것입니다. 그것이 러시아 전역의 변화를 이끄는 엔진이 될 것이기 때문입니다."
 URA_monarchy_christian_ural: "종교는 아편이 아니다"
 URA_monarchy_christian_ural_desc: "정교회는 우리 지역에서 그 어느 때보다 지원받을 것이며, 이러한 서방의 자유주의적 무신론 교리는 우리와 우리 국민에게 낯섭니다."
 URA_monarchy_stalin_trial: "스탈린과 레닌에 대한 재판"
 URA_monarchy_stalin_trial_desc: "한 세기 동안 우리와 함께하지 않았던 자들, 그 범죄를 우랄이 잊지 않았고 결코 잊지 않을 자들에 대해 공개 재판을 열 계획입니다."
 URA_monarchy_sell_seats: "의회 의석 매매"
 URA_monarchy_sell_seats_desc: "우리는 의회 의석 매매에서 아무런 문제도 전혀 느끼지 못합니다. 이는 본질적으로 지역 경제에 대한 투자이기 때문입니다."
 URA_monarchy_rosie_rat: "쥐 로지"
 URA_monarchy_rosie_rat_desc: "'쥐 로지'는 마피아 및 강도 행위와의 연루를 이유로 스베르들롭스크 지방 주지사를 겨냥한 모욕적인 구호입니다. 우리는 그의 유산에 맞선 투쟁에서 이 구호를 공식 구호로 사용할 계획입니다."
 URA_monarchy_imperial_territory: "제국령"
 URA_monarchy_imperial_territory_desc: "특별한 영토 단위인 제국령을 창설할 계획입니다. 경제특구와 유사한 것입니다."
 URA_monarchy_anti_mafia: "반마피아 운동"
 URA_monarchy_anti_mafia_desc: "반마피아 운동을 국가 차원의 운동으로 만들 계획입니다. 부패와 강도 행위와의 싸움이 우리에게 더 쉽고 투명해지도록 전폭적인 재정 지원을 할 것입니다."
 URA_monarchy_senate: "우랄 원로원"
 URA_monarchy_senate_desc: "새로운 국가 자문 기구인 원로원을 창설할 계획입니다. 그 임무에는 자문 기능이 포함되며, 다양한 제안을 처리한 뒤 이를 채택하도록 두마로 보내게 됩니다. 그렇게 하면 입법 기관은 법안에 대한 불필요한 논의에서 벗어날 것입니다."
 URA_monarchy_raise_citizen: "책임 있는 시민 양성"
 URA_monarchy_raise_citizen_desc: "강한 국가에는 그에 걸맞게 강하고 교양 있는 시민이 있어야 하며, 그렇지 않으면 그런 나라의 존속은 매우 빠르게 끝나게 됩니다. 역사는 이를 여러 차례 입증해 왔습니다."
 URA_monarchy_throne_russian: "러시아 성좌"
 URA_monarchy_throne_russian_desc: "우랄의 중심에 바티칸에 상응하는 우리만의 것을 만들어 전 세계 모든 정교회 신자들의 성지가 될 계획입니다."
 URA_monarchy_mini_state: "러시아 바티칸"
 URA_monarchy_mini_state_desc: "예카테린부르크 중심에 위치한 피의 사원 인근 영토에 독자적인 초소형 국가의 창설을 선언합니다."
 URA_monarchy_guard: "러시아 제국 근위대"
 URA_monarchy_guard_desc: "근위대가 없는 군주가 어디 있겠습니까? 국가와 황제를 보호하기 위해 성좌 영토에 제국 근위대가 창설될 것입니다."
 URA_monarchy_romanov_empire: "로마노프 제국"
 URA_monarchy_romanov_empire_desc: "아무도 예상하지 못한 특이한 방식으로 제국의 권위를 되살릴 계획입니다."
 URA_monarchy_negotiate_land: "토지 임대 협상"
 URA_monarchy_negotiate_land_desc: "우리 프로젝트를 위해서는 소규모 영토를 확보해야 하며, 소국과는 이 문제를 풀기가 더 쉽습니다. 따라서 잠재적 파트너들과 협상을 시작할 것입니다."
 URA_monarchy_maritime: "해양 제국"
 URA_monarchy_maritime_desc: "해양 강국이 될 때입니다."
 URA_monarchy_heir_throne: "진정한 왕위 계승자"
 URA_monarchy_heir_throne_desc: "로마노프 가문의 진정한 후계자가 우리 지역 영토에서 공식적으로 군주가 되었습니다."
 URA_monarchy_negotiate_white: "백계 망명 운동과의 협상"
 URA_monarchy_negotiate_white_desc: "이제 백계 망명자들을 조국으로 돌려보낼 때입니다. 내전 이후 많은 러시아 시민이 조국에서 멀리 떨어져 살아왔으며, 우리는 그중 일부라도 귀환시키기 위한 협상을 시작할 준비가 되어 있습니다."
 URA_monarchy_referendums: "평화 시위"
 URA_monarchy_referendums_desc: "우리는 혁명의 불길을 일으킬 생각이 없으며, 우랄 지역 문제를 평화적으로 해결할 계획입니다."
 URA_monarchy_rovs: "러시아 전군연합과의 협상"
 URA_monarchy_rovs_desc: "러시아 전군연합은 백군 장군 표트르 브란겔이 1924년 9월 1일 세르비아-크로아티아-슬로베니아 왕국에서 창설한 백계 운동 조직입니다. 처음에는 스렘스키카를로브치 시에 본부를 두었습니다. 이 조직의 표면적 목적은 소련 밖으로 이주한 러시아 백계 운동의 참전 용사들, 즉 병사와 장교 모두를 원조하는 것이었습니다. 우리는 이들을 완전히 복귀시켜 우리 국가에 통합할 준비가 되어 있습니다."
 URA_monarchy_rovs_integrate: "ROVS 통합"
 URA_monarchy_rovs_integrate_desc: "우리는 이들을 우리 국가에 통합할 준비가 되어 있으며, 그중에서도 특히 열렬한 운동 지지자들로는 전투 부대를 창설할 준비가 되어 있습니다."
 URA_monarchy_revive_cossack: "우랄 카자크 부활"
 URA_monarchy_revive_cossack_desc: "우랄 카자크는 오래전에 사라졌지만, 우랄 카자크는 우리의 자랑이며 이 시기의 역사를 부끄러워하지 않으므로 우리는 이 운동을 되살릴 준비가 되어 있습니다."
 URA_monarchy_cossack_land: "우랄 카자크의 땅 반환"
 URA_monarchy_cossack_land_desc: "우랄 카자크의 땅은 현재 러시아 영토 밖에 위치해 있으며, 우리는 어떤 방법으로든 이를 바로잡을 계획입니다."
 URA_monarchy_russian_lighthouse: "러시아의 등대"
 URA_monarchy_russian_lighthouse_desc: "우리는 진심으로 러시아를 지지하는 모든 이들의 진정한 등불이 될 것입니다. 이는 더 많은 사람을 우리 지역으로 끌어들일 것입니다."
 URA_monarchy_luxury_tax: "사치세"
 URA_monarchy_luxury_tax_desc: "우리는 사치세를 도입할 계획이며, 이를 통해 우리의 재정에 많은 추가 자금을 확보할 수 있을 것입니다."
 URA_monarchy_agri_sup: "농공업 부문 지원"
 URA_monarchy_agri_sup_desc: "우리의 농업은 재정 지원의 우선 분야 중 하나가 되어야 합니다. 우리는 러시아가 주요 농업 강국이었던 제국 시절을 기억합니다."
 URA_monarchy_nationalise: "국유화"
 URA_monarchy_nationalise_desc: "90년대의 약탈적 민영화로 도둑맞은 모든 것을 우리 지역의 이익과 이득을 위해 되찾아 올 것입니다."
 URA_monarchy_small_sup: "소기업 지원"
 URA_monarchy_small_sup_desc: "소기업은 진보의 엔진입니다. 지역에 소기업이 많을수록 우리가 거둘 세금도 늘어납니다."
 URA_monarchy_emperess_maria: "황후 마리야 기관청"
 URA_monarchy_emperess_maria_desc: "이 부서를 복원하면 저렴한 요양소와 병원을 담당하게 되며, 이를 통해 시민들에 대한 보건 지원을 개선할 것입니다."
 URA_monarchy_ark: "방주 프로젝트"
 URA_monarchy_ark_desc: "방주 프로젝트는 외국인을 후한 보수의 일자리로 끌어들이는 우리의 사업으로, 미국 시민과 유럽 시민 모두에게 많은 보수를 지급할 준비가 되어 있습니다."
 URA_monarchy_education: "교육 개혁"
 URA_monarchy_education_desc: "교육에 대한 대대적인 개혁을 단행할 계획이며, 그 주된 원칙은 소련 체제를 버리고 현재로서는 그것이 최선이라고 여기는 것입니다. 이와 함께 학교에서의 남녀 학급 분리 등 소련 치하에서 폐지된 것들이 도입될 것입니다."
 URA_monarchy_health: "보건 개혁"
 URA_monarchy_health_desc: "시민의 전반적인 건강 지수를 높이기 위해 대대적인 보건 개혁을 단행할 계획입니다."
 URA_monarchy_idea: "군주제 우랄"
 URA_monarchy_royal_leib_guard_idea: "러시아 근위대"
 URA_monarchy_rovs_idea: "러시아 전군연합"
 URA_monarchy_kazachestvo_idea: "우랄 카자크"
 URA_monarchy_anti_mafia_idea: "반마피아 운동"
 URA_monarchy_luxury_tax_idea: "사치세"
 URA_monarchy_senate_idea: "우랄 원로원"
 URA_monarchy_emperess_maria_idea: "황후 마리야 기관청"
 URA_monarchy_education_reform_idea: "교육 개혁"
 URA_monarchy_ark_idea: "방주 프로젝트"
 URA_russian_vatican_support: "러시아 바티칸"
 URA_romanov_empire: "[URA.GetNameWithFlag]의 영토"
 URA_romanov_empire_desc: "우리는 [URA.GetNameWithFlag]의 영토 일부를 매각했으며, 그 대가로 그들은 우리에게 영향력을 행사하고 우리가 이 토지를 되사들일 때까지 자금을 배정할 수 있게 됩니다."
 URA_romanov_montenegro: "[MNT.GetNameWithFlag]의 토지 매입 시도"
 URA_romanov_albania: "[ALB.GetNameWithFlag]의 토지 매입 시도"
 URA_romanov_macedonia: "[FYR.GetNameWithFlag]의 토지 매입 시도"
 URA_romanov_gambia: "[GAM.GetNameWithFlag]의 토지 매입 시도"
 URA_romanov_trinidad: "[TRI.GetNameWithFlag]의 토지 매입 시도"
 URA_romanov_montenegro_influency: "[MNT.GetNameWithFlag]에 영향력 확대"
 URA_romanov_albania_influency: "[ALB.GetNameWithFlag]에 영향력 확대"
 URA_romanov_macedonia_influency: "[FYR.GetNameWithFlag]에 영향력 확대"
 URA_romanov_gambia_influency: "[GAM.GetNameWithFlag]에 영향력 확대"
 URA_romanov_trinidad_influency: "[TRI.GetNameWithFlag]에 영향력 확대"
 URA_kazahrevoult_warning_tt: "§R현지 카자크의 무장 봉기§!가 §Y우리 서부 영토에서 시작됩니다§!"
 URA_communism_start: "공산주의 우랄"
 URA_communism_start_desc: "우랄의 권력은 오랜 세월이 지난 지금 다시 진정한 공산주의 애국자들에게 돌아왔습니다. 우리는 이 지역의 과거 산업적 영광을 되살릴 것입니다."
 URA_communism_government: "공산주의 정부"
 URA_communism_government_desc: "지역의 진정한 애국자들과 사회주의 사상의 충실한 지지자들로 집권당을 구성할 것입니다."
 URA_communism_constituion: "새 헌법"
 URA_communism_constituion_desc: "끔찍했던 90년대의 메아리였던 이 끔찍한 헌법을 다시 쓸 것입니다."
 URA_communism_internal_enemies: "대열 내 숙청"
 URA_communism_internal_enemies_desc: "모든 배신자와 믿을 수 없는 자들이 마침내 분란을 일으키기 전에 우리 대열에서 숙청할 것입니다."
 URA_communism_down_democrats: "민주주의자와의 투쟁"
 URA_communism_down_democrats_desc: "자유주의와 민주주의 신봉자들은 침묵시키고 권력에서 제거해야 합니다. 90년대의 민주주의는 우리에게 충분했습니다!"
 URA_communism_down_nationalist: "급진 민족주의 분쇄"
 URA_communism_down_nationalist_desc: "우랄은 민족주의 구호를 내세우는 급진주의자들이 설 자리가 아니며, 우리는 그들의 목소리를 잠재우기 위해 모든 내부 자원을 동원합니다."
 URA_communism_eliminate_rossel_era: "로셀 시대의 유산 청산"
 URA_communism_eliminate_rossel_era_desc: "우리 지역에는 로셀 주지사 통치 시기로부터 남은 문제가 많으며, 우리는 그 부정적 유산을 신속히 처리할 계획입니다."
 URA_communism_atheism: "무신론의 우랄"
 URA_communism_atheism_desc: "우리는 종교와 그것이 우리에게 미치는 영향에 맞서 싸울 것입니다. 무신론은 우랄을 다시 한번 진보를 향해 나아가게 할 것입니다."
 URA_communism_regionalism: "지역주의"
 URA_communism_regionalism_desc: "우리는 지역주의 개념과 우랄이 쉬운 지역이 아니라는 인식을 부분적으로 지지할 준비가 되어 있습니다."
 URA_communism_our_kgb: "우리의 우랄 KGB"
 URA_communism_our_kgb_desc: "KGB와 같은 조직은 우리에게 영향을 미치려는 내부와 외부의 적에 맞서 싸우는 데 언제나 긍정적인 결과를 가져왔으며, 우리는 정치적 안정을 지키기 위해 독자적인 KGB의 창설에 착수할 것입니다."
 URA_communism_ural_oblast: "우랄 주"
 URA_communism_ural_oblast_desc: "소련 시절 우랄은 우랄 주라는 형태로 통합되어 있었지만, 이후 그 경계는 허공에서 만들어진 여러 지역 단위로 쪼개졌습니다. 우리는 이를 바로잡을 계획입니다."
 URA_communism_region_revoult: "우랄 내 봉기 조장"
 URA_communism_region_revoult_desc: "평화적 해결책은 없습니다. 각 지역이 봉기해야 하며, 우리는 이를 도울 것입니다!"
 URA_communism_khmao_revoult: "[KHM.GetName]의 혁명"
 URA_communism_khmao_revoult_desc: "우리의 봉기를 다른 우랄 지역과 공화국으로 확대할 계획이며, 다음은 [KHM.GetName]입니다!"
 URA_communism_yanao_revoult: "[YAM.GetName]의 혁명"
 URA_communism_yanao_revoult_desc: "우리의 봉기를 다른 우랄 지역과 공화국으로 확대할 계획이며, 다음은 [YAM.GetName]입니다!"
 URA_communism_region_campaign: "평화적 국민투표"
 URA_communism_region_campaign_desc: "우리는 혁명의 불길을 일으킬 생각이 없으며, 우랄 지역 문제를 평화적으로 해결할 계획입니다."
 URA_communism_yugra_campaign: "[KHM.GetName] 국민투표"
 URA_communism_yugra_campaign_desc: "[KHM.GetName]의 우리 편입에 관한 국민투표를 실시할 계획입니다. 어쩌면 연방 정부가 이 단위가 우리의 일부가 되도록 허용할 수도 있습니다."
 URA_communism_yanao_campaign: "[YAM.GetName] 국민투표"
 URA_communism_yanao_campaign_desc: "[YAM.GetName]의 우리 편입에 관한 국민투표를 실시할 계획입니다. 어쩌면 연방 정부가 이 단위가 우리의 일부가 되도록 허용할 수도 있습니다."
 URA_communism_great_ural: "대우랄 지역"
 URA_communism_great_ural_desc: "나머지 지역을 우리의 위대한 우랄 프로젝트에 통합하고 있습니다."
 URA_communism_ural_corps: "우랄 의용 전차 군단 부활"
 URA_communism_ural_corps_desc: "대조국전쟁 당시 우랄의 의용군은 의용 군단을 편성하여 베를린에 이르기까지 수많은 전투에 참가했습니다. 규모는 작더라도 이 영광스러운 전투 부대를 되살릴 준비가 되어 있습니다."
 URA_communism_orthodox_compromise: "정교회와의 타협"
 URA_communism_orthodox_compromise_desc: "우리는 정교회 및 그 신자들과 일종의 타협을 이루고 그들을 추적하지 않을 준비가 되어 있습니다."
 URA_communism_socialism: "사회주의"
 URA_communism_socialism_desc: "우리의 경제 및 정치 프로그램에 사회주의 사상을 적극 도입할 것입니다."
 URA_communism_ural_corps_academies: "군사 학교 부활"
 URA_communism_ural_corps_academies_desc: "소련 붕괴와 함께 많은 군사 학교가 폐쇄되었으며, 우리는 영광스러운 군사 학교들을 되살릴 계획입니다."
 URA_communism_ural_international_brigade: "우랄 국제 여단"
 URA_communism_ural_international_brigade_desc: "우리의 영광스러운 국제주의 전사들은 전 지구의 사회주의 형제들을 지킬 준비가 되어 있습니다."
 URA_communism_ural_pioneer: "피오네르 부활"
 URA_communism_ural_pioneer_desc: "젊은이들은 통제되고 올바른 방향으로 이끌어져야 합니다. 새로운 세대도 사회주의의 이상을 따르도록 과거의 피오네르 활동을 되살릴 것입니다."
 URA_communism_ural_red_army: "우랄 붉은 군대"
 URA_communism_ural_red_army_desc: "오직 붉은 군대만이 사회주의 조국을 지킬 수 있습니다! 그리고 우리는 이곳 우랄에서 우리만의 붉은 군대를 창설할 것입니다."
 URA_communism_sklads: "러시아 무기 접수"
 URA_communism_five_year: "제1차 5개년 계획"
 URA_communism_five_year_desc: "소련식 계획 경제 관행으로 돌아갈 계획이며, 이를 향한 우리의 첫 대규모 결정은 제1차 5개년 계획의 착수입니다."
 URA_communism_trade_unions: "노동조합 지원"
 URA_communism_trade_unions_desc: "노동조합은 우리가 그토록 치열하게 지키는 노동자의 권리를 보호하는 데 중요하고 필요합니다. 노동자의 권리를 보호하지 않고서는 사회주의 국가를 건설하지 못할 것입니다."
 URA_communism_collectivism: "집단주의 지원"
 URA_communism_collectivism_desc: "집단주의와 그 지원은 우리 국내 정책의 중요한 이념적 구성 요소이며, 오직 화합하는 노동자 집단만이 폐허의 잿더미에서 어떤 기업이든 일으켜 세울 것입니다."
 URA_communism_military_factories: "군수 공장 복구"
 URA_communism_military_factories_desc: "군수 공장의 폐허는 수년간 우랄의 흔한 풍경이었으며, 우리는 이 폐허를 우랄의 군사력으로 바꿀 것입니다."
 URA_communism_roads: "우랄로 가는 더 많은 도로"
 URA_communism_roads_desc: "우리 지역은 빠른 성장으로 인해 더 많은 도로가 필요합니다. 지역 도로망의 발전을 5개년 발전 계획에 포함할 것입니다."
 URA_communism_science_bitch: "과학의 우랄"
 URA_communism_science_bitch_desc: "과학은 진보의 엔진이며 우리는 이를 부정하지 않고 지원합니다. 우리의 5개년 발전 계획에는 지역 전체의 교육 기관 발전이 포함될 것입니다."
 URA_communism_marxism: "학교와 대학의 마르크스주의"
 URA_communism_marxism_desc: "젊은 세대가 우리 아름다운 지역에 무엇을 건설하려 하는지 이해하도록 마르크스주의와 그 구성 요소를 교육과정에 되돌릴 것입니다."
 URA_communism_second_five: "제2차 5개년 계획"
 URA_communism_second_five_desc: "5개년 계획을 계속 이어갈 계획이며, 제2차 5개년 계획이 곧 발표될 것입니다."
 URA_communism_agro_invest: "농공업 부문 개선"
 URA_communism_agro_invest_desc: "우랄은 산업 지역이지만, 우리와 주민에게 필요한 모든 것을 공급하기 위해 농업도 잊어서는 안 됩니다."
 URA_communism_invest_energy: "에너지 투자"
 URA_communism_invest_energy_desc: "우랄의 에너지 안정은 제2차 5개년 계획의 우선 과제 중 하나가 되어야 합니다."
 URA_communism_invest_factories: "신규 공장"
 URA_communism_invest_factories_desc: "지역의 산업 잠재력을 확충하기 위해 신규 공장 건설을 발표할 준비가 되어 있습니다."
 URA_communism_invest_metro: "지하철 발전"
 URA_communism_invest_metro_desc: "소련 시절에 작성된 계획에 따라 도시 지하철을 더욱 발전시킬 계획입니다."
 URA_communism_invest_nuclear_plant: "자체 원자력 발전소 건설"
 URA_communism_invest_nuclear_plant_desc: "우리는 독자적인 원자력 발전소를 건설할 준비가 되어 있습니다."
 URA_communism_nationalisation: "국유화"
 URA_communism_nationalisation_desc: "90년대의 약탈적 민영화로 도둑맞은 모든 것을 우리 지역의 이익과 이득을 위해 되찾아 올 것입니다."
 URA_commies_idea: "공산주의 우랄"
 URA_intertanional_brigade_idea: "국제 여단"
 URA_military_univer_idea: "부활한 군사 학교"
 URA_red_army_idea: "우랄 붉은 군대"
 URA_kgb_idea: "우랄 KGB"
 URA_five_year_plans: "5개년 계획"
 URA_new_roads: "도로 개발"
 URA_invest_univer: "교육 투자"
 URA_marxist_reeducation_idea: "마르크스주의 교육"
 URA_roizman_start: "로이즈만의 통치"
 URA_roizman_start_desc: "스베르들롭스크 정부는 이제 예브게니 로이즈만이 이끌고 있습니다. 그는 90년대에 지역의 마약 중독과 적극 싸운 '마약 없는 도시' 재단으로 유명합니다. 게다가 그는 지역과 예카테린부르크 시를 열렬히 사랑하는 애국자이며, 이는 우리 지역의 발전 동력에 긍정적인 영향을 미칠 수 있습니다."
 URA_roizman_start_narcs: "마약 없는 우랄"
 URA_roizman_start_narcs_desc: "'마약 없는 도시' 프로그램을 우리 지역 전체의 경계까지 확대할 것입니다."
 URA_roizman_migrants: "반이민 정책"
 URA_roizman_migrants_desc: "불법 이민과 적극 싸울 것입니다. 범죄의 전성기는 바로 이전 당국이 수상한 범죄 분자들이 우리 지역에 쉽게 들어오도록 허용했을 때 찾아왔습니다. 우리는 이를 바로잡을 것입니다."
 URA_roizman_robes: "사법 개혁"
 URA_roizman_robes_desc: "법복 입은 창녀들 - 로이즈만은 우리 사법 체계의 실태를 보고 이렇게 외쳤습니다. 즉시 개혁에 착수할 것입니다."
 URA_roizman_spirits: "우랄 정신 지원"
 URA_roizman_spirits_desc: "우랄인들은 언제나 자기 지역의 애국자였고, 민주주의와 전체주의에 맞선 투쟁의 애국자였습니다. 우리는 이를 적극 지원할 뿐입니다."
 URA_roizman_masks: "법 집행 개혁"
 URA_roizman_masks_desc: "복면을 쓴 저능아들 - 로이즈만은 법 집행 기관의 실태를 보고 이렇게 외쳤습니다. 이 분야의 개혁에 즉시 착수할 것입니다."
 URA_roizman_dick_shot: "가족 지원"
 URA_roizman_dick_shot_desc: "\"성부위에 총을 쏴야 한다!\" 로이즈만은 인구 통계 보고서에 대해 자신의 회의에서 크게 선언했습니다. \"젊은 가정을 지원해야지, 그들을 노예처럼 몰아가서는 안 된다."
 URA_roizman_dirt_soul: "쾌적한 도시"
 URA_roizman_dirt_soul_desc: "당신들 영혼에는 때가 끼었소 - 로이즈만은 도시의 청결 상태를 비판하며 이렇게 터뜨렸습니다. 그럼에도 도시에는 봄과 가을에 거리의 먼지를 청소할 수 있게 해 줄 개혁이 필요합니다."
 URA_roizman_moms: "자유 언론"
 URA_roizman_moms_desc: "무슨 엄마 거시기 같은 소리 - 로이즈만은 우랄의 언론 자유에 관한 연설 중에, 누구든 그 내용이 무엇이든 자신의 의견을 표현할 수 있다고 말하며 이렇게 덧붙였습니다."
 URA_roizman_gibdd: "반 LGBT"
 URA_roizman_gibdd_desc: "우리는 그러한 것들을 지지하지 않으며 합법화할 생각도 없습니다."
 URA_roizman_candelabra: "촛대 문제"
 URA_roizman_candelabra_desc: "'점잖은 사회라면 그런 일에는 촛대로 혼쭐을 냈을 겁니다.' 로이즈만은 우랄의 종교적 관용에 관한 연설 중에 이렇게 답했습니다. '우리는 어떤 종교든 맹렬히 옹호할 것이며 어느 하나가 지배적 지위를 차지하는 것을 허용하지 않을 것입니다.'"
 URA_roizman_tv: "텔레비전 문제"
 URA_roizman_tv_desc: "텔레비전이 키운 자들 - 로이즈만은 공산당과 전체주의적 과거를 상징하는 다른 정당에 계속 투표하는 이들을 이렇게 평했습니다. 우리는 사람들의 머릿속에서 이 텔레비전식 사고를 빼낼 계획입니다."
 URA_roizman_patriot: "애국주의 문제"
 URA_roizman_patriot_desc: "You are shit and not a patriot - Roizman shouted to the official that at the conference he asked the question that Ural patriotism is nonsense and you need to be a patriot of something more real. We will actively continue to support Ural patriotism."
 URA_roizman_commies: "공산주의 따위 꺼져라"
 URA_roizman_commies_desc: "과거의 피로 얼룩진 끔찍한 이념의 신봉자들을 제거할 때입니다. 적극적인 반공 선전을 시작할 것입니다."
 URA_roizman_baobab: "환경 프로그램"
 URA_roizman_baobab_desc: "바오밥처럼 태어난 로이즈만은, 우랄 정부가 염두에 두고 있는 환경 개혁의 타당성에 대해 질문한 기자에게 이렇게 외쳤습니다. \"우리는 환경 생산에 대규모로 투자할 계획입니다.\""
 URA_roizman_renovation: "재개발"
 URA_roizman_renovation_desc: "우리 도시는 확장될 뿐 아니라 지은 지 40~50년이 넘은 주택 단지도 정비해야 하므로 재개발 프로그램을 추진할 것입니다."
 URA_roizman_katz: "빌어먹을 막심 카츠"
 URA_roizman_katz_desc: "막심 카츠와 좌파 자유주의 야당 전체는 우랄에서 금지되어야 합니다."
 URA_roizman_neirb: "평화주의 정치"
 URA_roizman_neirb_desc: "우리 지역에 중립적 지위와 평화주의 정책을 선언할 계획이며, 호전적으로 굴거나 지역에 혼란을 일으킬 생각이 없습니다."
 URA_roizman_gnomick_economic: "난쟁이의 경제"
 URA_roizman_gnomick_economic_desc: "당신들의 경제는 난쟁이의 성기 같소 - 로이즈만은 재무 장관과의 회의에서 이렇게 말하며, 우리가 큰 경제 성장을 이룰 수 있음을 넌지시 내비쳤습니다."
 URA_roizman_taxes: "연방세 인하"
 URA_roizman_taxes_desc: "우리 재정 체계의 부담이 너무 크므로 연방세 인하를 요청할 계획입니다."
 URA_roizman_federal: "연방 직할시"
 URA_roizman_federal_desc: "예카테린부르크는 연방 직할시가 되어야 합니다! 우리는 이를 달성할 것입니다."
 URA_roizman_idea: "로이즈만의 통치"
 URA_dick_shot_idea: "어린 가족 지원"
