 CHI_korea_peninsula_tension_display: "$CHI_korea_peninsula_tension$: [?CHI_korea_peninsula_tension]"
 CHI_legitimacy_concentrated_desc: "정치국 상무위원회는 더 이상 정족수를 필요로 하지 않습니다. 총서기의 측근 집단이 조직망과 하나가 되었습니다. 중앙기율검사위원회는 이제 형식적인 존재일 뿐입니다."
 CHI_Lips_and_Teeth: "순망치한"
 CHI_Lips_and_Teeth_desc: "중국과 북한의 관계를 '입술과 이처럼 가깝다'고 규정한 역사적 표현은 한국전쟁 이래 중국 정책의 지침이 되어 왔습니다. 이 독트린을 공식화하면 중국은 김씨 정권의 존속을 책임지게 되며, 평양과의 유대는 깊어지지만 폭넓은 한반도 화해는 포기하게 됩니다."
 CHI_mass_line_campaign: "군중 노선 운동"
 CHI_mass_line_campaign_desc: "관료들이 농촌 지역으로 파견되어 농민과 함께 식사하고 현지 상황에 대한 보고서를 제출해야 합니다. 정부 사무실에서 사치품이 치워지고 호화로운 공공 지출은 공개적으로 비난받습니다. 이 운동은 관료들의 눈에 보이는 행태를 바꾸고, 국가 자원을 사적인 경로로 빼돌리던 비공식 소비를 억제합니다."
 CHI_Mount_Paektu_Understanding: "백두산 양해"
 CHI_Mount_Paektu_Understanding_desc: "김씨 왕조의 신화적 탄생지인 백두산의 그늘 아래에서 체결된 비밀 양자 양해로, 북한군 지휘부와의 중국 안보 협의가 공식화됩니다."
