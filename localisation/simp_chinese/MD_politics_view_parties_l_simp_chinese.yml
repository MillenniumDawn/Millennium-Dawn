 EGY.Nat_Fascism_icon: "£EGY_Nat_Fascism"
 EGY.Nat_Fascism_desc: "（伊拉克复兴党）- 埃及地区阿拉伯社会复兴党是埃及新复兴党政党。它是伊拉克领导的复兴党的埃及地区分支。\n\n该党来自§H军方的看法§!为§G+50§!"
