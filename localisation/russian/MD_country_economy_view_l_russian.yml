 increases_cb_rate_tooltip: "Повысить §Yключевую ставку§! на 1 п.п., ужесточая денежно-кредитные условия.\n\n§YЭффекты:§!\nЕжеквартальная инфляция дополнительно подавляется на §G0,3%§! за квартал\nПроцентная ставка по государственному долгу повышается на §R0,5 п.п.§!\n\n§YУсловия:§!\n£pol_power_icon §Y25§! политического влияния\nКлючевая ставка ниже 20%\nИзменение ставки не производилось последние 60 дней"
 decreases_cb_rate_tooltip: "Понизить §Yключевую ставку§! на 1 п.п., смягчая денежно-кредитные условия.\n\n§YЭффекты:§!\nЕжеквартальная инфляция подавляется на §R0,3%§! меньше за квартал\nПроцентная ставка по государственному долгу снижается на §G0,5 п.п.§!\n\n§YУсловия:§!\n£pol_power_icon §Y25§! политического влияния\nКлючевая ставка выше 0%\nИзменение ставки не производилось последние 60 дней"
