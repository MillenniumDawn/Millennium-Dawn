 Cameroon.1.t: "카메룬 산 분화"
 Cameroon.1.d: "4,040m의 높이를 가진 화산인 카메룬 산은 중앙 아프라카에서 가장 높은 곳이며, 그와 동시에 가장활발한 화산활동을 하고 있는 곳입니다.\n\n1999년에 이미 분화하였으며, 이로 인해 주변에 살고 있던 주민들은 대피해야했습니다. 그리고 현지인들이 몽고 마 은데미(\"위대함의 산\")라 부르는 이 화산은 2000년 3월 28일 다시 한번 분화하여 수개월간 격렬한 활동을 이어갔습니다."
 Cameroon.1.a: "This will hurt the region"
 Cameroon.1.b: "필요한 물자를 보내라!"
 diplomatic_response.1.t: "[FROM.GetName] Accepts!"
 diplomatic_response.1.d: "[This.GetAdjective]와 [FROM.GetAdjective] 대표단은 최근 협상에서 상호 합의에 도달했습니다. [FROM.GetName]은 우리의 제안에 동의할 의향이 있습니다."
 diplomatic_response.1.o1: "Excellent"
 diplomatic_response.2.t: "[FROM.GetName] Rejects!"
 diplomatic_response.2.d: "며칠 밤을 새워가며 사소한 세부 사항부터 중요한 쟁점까지 격렬한 논쟁을 벌인 끝에, [This.GetName] 측과 [FROM.GetName] 측 대표단 간의 최근 협상은 결렬되었습니다. 저희 제안은 당분간 실현되지 않을 것입니다."
 diplomatic_response.2.d1: "[FROM.GetNameWithFlag](은)는 우리의 구제 금융 요청을 거부하였습니다. 이는 앞으로 다가올 재난을 더욱 위태롭게 만들 것입니다..."
 diplomatic_response.2.o1: "Oh well"
 LibyaNews.1.t: "2차 리비아 내전의 종식"
 LibyaNews.1.GNA.d: "칼리아 하프타르가 낙선한 것을 받아들이지 않고 휘하의 군사들로 정권을 축출한 2014년에 이 사건이 있고 난후, 2차 리비아 내전이 발발하였습니다. 정부측은 신 총국민회의라는 새로운 기관을 설립하여 내전이 발발되게 되었습니다. 2015년 UN은 평화협정을 국가협정 정부라 부르는 공동 정부를 구성하는 방향으로 중재하였습니다. 하지만, 1년 뒤에 이 평화는 부서졌고 3세력 간의 내전이 발발하였습니다.\n\n 국제적인 지지를 받고 있는 국가협정이 군사의 부족에도 불구하고 반란군을 무찌르고 나라를 통합할 것 같습니다. EU와 많은 서방국들이 판단에 따르면, 이는 지역 균형의 변화를 가져올 것 같습니다."
 LibyaNews.1.HOR.d: "칼리아 하프타르가 낙선한 것을 받아들이지 않고 휘하의 군사들로 정권을 축출한 2014년에 이 사건이 있고 난후, 2차 리비아 내전이 발발하였습니다. 정부측은 신 총국민회의라는 새로운 기관을 설립하여 내전이 발발되게 되었습니다. 2015년 UN은 평화협정을 국가협정 정부라 부르는 공동 정부를 구성하는 방향으로 중재하였습니다. 하지만, 1년 뒤에 이 평화는 부서졌고 3세력 간의 내전이 발발하였습니다.\n\n 하프타르 장군, 리비아 군, 다른 친 가다피 세력에게 지원을 받는 정당이 리비아를 장악할 것 같습니다. 러시아에게 지원을 받고 뒷배로 삼고 있는 하프타르는 국내에 러시아 군사기지를 세울 것을 약조하였습니다. 이는 러시아의 북아프리카 영향력을 늘릴 것입니다."
 LibyaNews.1.GNC.d: "The Second Libyan Civil War started in 2014, after the Libyan military under General Khalifa Haftar ousted the ruling government when they refused to step down after losing the elections of 2014. The supporters of the government formed a new faction, the National Salvation Government, sparking a new civil war. In 2015, the UN brokered a truce between the two factions, forming a new joint-government called the Government of National Accord. However, only a year later the peace was shattered, plunging the country into a three-way civil war.\n\nIt seems that against all odds, the National Salvation Government has emerged victorious. Composed mainly of Islamists and members of the Muslim Brotherhood, many experts claim that this victory could've only been achieved by serious backing from foreign actors. Who those actors were remains unclear."
 SierraLeoneNews.1.t: "시에라리온 내전의 종식"
 SierraLeoneNews.1.SIE.d: "The Sierra Leonean government announced an official victory over the rebels today. With support from Guinea, United Kingdom and the UNAMSIL forces, the rebels of RUF and AFRC have either surrendered or fled to neighbouring Liberia. The leader of RUF, [AFR.GetLeader], was found in a hideout and arrested, and was handed to the custody of the British SAS.\n\nHe is currently awaiting his trial, being charged with multiple counts of war crimes by the UN."
 SierraLeoneNews.1.AFR.d: "영국과 UN군의 지원에도 불구하고 시에라리온 정부군은 프리아운을 방어하는데 실패했습니다. 몇몇 정부관료들은 나이지리아로 탈출을 했습니다. 다른 운없는 이들은 반란군에 생포되어 바로 총살을 당하거나 수도 길거리에서 행진을 하며 놀림감이 되었습니다.\n\n수도 함락 이후, 몇일간은 약탈이 자행되었으며, 반란군은 온 국토를 돌며 승리를 자축했습니다.\n\n국가는 이제 주변에 어떠한 이도 민병대와 맞썰 수 없는 상태에 들어서면서 혼란과 무정부상태에 빠져들었습니다."
 SierraLeoneNews.1.a: "흥미로운 전개로군."
 SierraLeone.2.t: "시에라리온의 동맹군의 몰락"
 SierraLeone.2.d: "시에라리온 정부는 반란군의 손에 무너졌습니다. 우리의 도움이 충분치 않았던 것 같습니다. 혁명평의회군(AFRC)과 계속해서 싸움을 이어나갈 수 있지만, 이는 정권교체 사태까지 이어질 수도 있습니다. 어쩌면 시에라리온에서 철수하는 것이 더 나을 수도 있습니다."
 SierraLeone.2.a: "평화 협상을 시도하라."
 SierraLeone.2.b: "시에라리온에서 저들을 몰아내자"
 SierraLeone.3.t: "기니 정부의 휴전 요청"
 SierraLeone.3.d: "기니 정부는 양측의 전쟁을 멈추고 자국군을 시에라리온에서 물리겠다고 제안했습니다. 어떻게 대답을 해야 할까요?"
 SierraLeone.3.a: "그만 멈추자"
 SierraLeone.3.b: "계속 싸워라"
 SierraLeone.4.t: "혁명평의회군(AFRC)이 휴전협상에 동의하다"
 SierraLeone.4.d: "시에라리온 반란군은 휴전에 동의를 하였습니다"
 SierraLeone.4.a: "좋아"
 SierraLeone.5.t: "혁명평의회군(AFRC)은 휴전에 거부하였습니다"
 SierraLeone.5.d: "시에라리온 반란군은 우리의 제안을 거절했고, 계속해서 전쟁을 이어갈 것입니다."
 SierraLeone.5.a: "젠장"
 LiberiaNews.1.t: "제2차 라이베리아 내전 종전"
 LiberiaNews.1.LIB.d: "Today Charles Taylor, the dictator-president of Liberia, announced the end of LURD in Liberia. Despite the Liberian military being in shambles, and most of the work being done by Taylor's anti-terrorist units, LURD with their Guinean allies weren't able to topple his government. What remaining rebels there are have crossed the border and escaped to Guinea. It is likely that Taylor will continue the conflict with Guinea until all opposition is dealt with."
 LiberiaNews.1.LUR.d: "오늘 텔레비전 방송을 통해 찰스 테일러 대통령은 사임을 발표했습니다. 직후 그는 나이지리아로 망명하기 위해 비행기에 올랐고, 그 사이 몬로비아 거리에서는 LURD 반군들이 환호하며 춤을 추었습니다. 테일러는 전쟁 범죄 혐의로 인터폴의 체포 영장이 발부되었지만, 나이지리아 정부는 라이베리아 신정부의 요청이 없는 한 추방을 거부하고 있습니다.\n\n새로운 라이베리아 정부는 현재 조직 개편을 진행 중이며, 몬로비아에 자리를 잡고 이후 전국적으로 안정되기까지는 시간이 걸릴 것입니다."
 LiberiaNews.1.a: "흥미롭군"
 Liberia.2.t: "라이베리아 내부 동맹의 몰락"
 Liberia.2.d: "테일러 정권은 라이베리아로부터 화해와 민주주의를 위한 라이베리아인 연합(LURD)을 축출했습니다. 무기와 원조를 통해 지원을 했고, 이들 세력과의 국경개방을 맺었지만, 반란군은 테일러 정권을 축출해내는데는 실패아였습니다. 군사 작전을 실행해 테일러를 우리의 힘으로 축출하는 다음단계를 이행할 때입니다. 아니면 라이베리아에서 완전 철수를 하던가요."
 Liberia.2.a: "평화 협상을 시도하라."
 Liberia.2.b: "테일러를 축출해야 한다"
 Liberia.3.t: "기니 정부의 휴전 요청"
 Liberia.3.d: "기니 정부는 양측의 전쟁을 멈추고 자국군을 라이베리아에서 물리겠다고 제안했습니다. 어떻게 대답을 해야 할까요?"
 Liberia.3.a: "그만 멈추자"
 Liberia.3.b: "계속 싸워라"
 Liberia.4.t: "테일러 대통령이 휴전협상에 동의하다"
 Liberia.4.d: "테일러 정부는 휴전에 동의를 하였습니다"
 Liberia.4.a: "좋아"
 Liberia.5.t: "테일러 정부는 휴전에 거부하였습니다"
 Liberia.5.d: "찰스 테일러가 우리의 제안을 거절했고, 계속해서 전쟁을 이어갈 것입니다."
 Liberia.5.a: "젠장"
