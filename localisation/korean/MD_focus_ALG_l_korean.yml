 deep_state_power_decreased_1_tt: "§G딥 스테이트 권력: -1§!"
 deep_state_power_decreased_2_tt: "§G딥 스테이트 권력: -2§!"
 deep_state_power_decreased_3_tt: "§G딥 스테이트 권력: -3§!"
 deep_state_power_decreased_4_tt: "§G딥 스테이트 권력: -4§!"
