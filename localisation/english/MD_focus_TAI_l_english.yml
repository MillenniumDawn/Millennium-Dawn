 #National Spirits
 TAI_legacy_of_1949: "Legacy of 1949"
 TAI_legacy_of_1949_desc: "The end of the Chinese Civil War in 1949 saw the Nationalist Guomindang (KMT) and their supporters flee to the island province of Taiwan. The legacy of this event, combined with a local, nativist Taiwanese movement has led to a strong rejection of reunification with the mainland by the majority of Taiwanese citizens."
 TAI_the_great_chip_empire: "The Great Chip Empire"
 TAI_the_great_chip_empire_desc: "Having taken advantage of semiconductor and microchip production in it's infancy, and by being a more attractive investment than other nations. Taiwan has catapulted itself to the forefront of the industry. Though cheap, efficient production, and large exports to western nations, Taiwan has balanced its economy and national security on being the supply of microchips to the western world, and continues to be an industry leader through constant and regular innovation."
 TAI_flight_crew_strike: "Taoyuan Flight Attendants Union strike"
 TAI_flight_crew_strike_desc: "No results! No stopping!"

 # Foxconn Corporate History
 TAI_foxconn_ev_pipeline: "EV Pipeline Without Volume"
 TAI_foxconn_ev_pipeline_desc: "Reference vehicles and partner programs create engineering options, but validated products and solvent customers remain scarce. Capital is committed before dependable volume arrives."
 TAI_foxconn_factory_behind_brand: "The Factory Behind the Brand"
 TAI_foxconn_factory_behind_brand_desc: "Hon Hai/Foxconn turns customer designs into repeatable production through tooling, procurement, process engineering, testing, and logistics. Its enormous throughput remains constrained by thin margins and powerful clients."
 TAI_foxconn_factory_city_production: "Factory-City Production"
 TAI_foxconn_factory_city_production_desc: "Dense supplier networks, dormitories, transport, and industrial services permit rapid production ramps. Concentrating work and daily life inside a few campuses also magnifies labor and disruption risks."
 TAI_foxconn_resilient_manufacturing_network: "Resilient Manufacturing Network"
 TAI_foxconn_resilient_manufacturing_network_desc: "A Build, Operate, Localize network connects qualified regional hubs while retaining valuable mainland capacity. Redundancy improves market access and crisis recovery at a permanent coordination cost."
 taiwan.300.a: "Build the densest mainland network"
 taiwan.300.b: "Deepen components and Taiwanese capacity"
 taiwan.300.d: "By 2000, Taiwan-based Hon Hai/Foxconn has become an established electronics manufacturer with a rapidly expanding mainland production system. Management must decide whether scale, component depth, or geographic resilience will guide its next decade."
 taiwan.300.t: "The Factory Behind the Brand"
 taiwan.301.a: "Raise standards and automate carefully"
 taiwan.301.b: "Automate production and expand inland"
 taiwan.301.d: "A cluster of worker deaths and reports of distress has brought scrutiny to working hours, compensation, safety, and life inside the factory-city system. The causes are contested, but the need for an institutional response is not."
 taiwan.301.t: "The Shenzhen Labor Crisis"
 taiwan.302.a: "Concentrate the launch system in Zhengzhou"
 taiwan.302.b: "Build several inland production nodes"
 taiwan.302.d: "Zhengzhou offers infrastructure, recruitment support, and enough space for an immense inland production campus. The project can create extraordinary launch capacity while deepening dependence on one customer, place, and policy environment."
 taiwan.302.t: "iPhone City"
 taiwan.303.a: "Lead the Sharp recapitalization"
 taiwan.303.b: "Preserve a strategic partnership"
 taiwan.303.d: "Sharp needs a recapitalization partner, while Foxconn wants display expertise, engineers, and a closer component relationship. Control would bring a difficult Japanese turnaround rather than an instant transfer of technology."
 taiwan.303.t: "Sharp at the Brink"
 taiwan.304.a: "Commit to the Wisconsin project"
 taiwan.304.b: "Reduce the project before construction"
 taiwan.304.d: "Washington has answered Foxconn's proposal. The company must now decide whether the available support justifies a full commitment, a narrower project, or a return to its Asian network."
 taiwan.304.t: "The Wisconsin Commitment"
 taiwan.305.a: "Become the neutral AI-rack integrator"
 taiwan.305.b: "Pursue sovereign systems and chip capacity"
 taiwan.305.c: "Specialize in consumer systems"
 taiwan.305.d: "Complete AI racks combine boards, accelerators, power, cooling, cables, and exacting system validation. Foxconn can remain a neutral integrator, test sovereign systems and semiconductor capacity, or keep consumer electronics at the center of its portfolio."
 taiwan.305.t: "The AI Factory"
