name: Setup MD Python
description: Set up Python and install the Millennium Dawn tool groups
inputs:
  analysis:
    description: Install the optional analysis dependency group
    required: false
    default: "false"
  install:
    description: Install pip groups after setting up Python
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
      with:
        python-version: "3.x"
        cache: pip
    - name: Install Python dependencies
      if: inputs.install == 'true'
      shell: bash
      env:
        INSTALL_ANALYSIS: ${{ inputs.analysis }}
      run: |
        python -m pip install --upgrade pip
        if [ "$INSTALL_ANALYSIS" = "true" ]; then
          pip install --group dev --group runtime --group analysis
        else
          pip install --group dev --group runtime
        fi
