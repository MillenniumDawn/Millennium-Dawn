 EFS_flag_category: "Zmiana flagi Federacji Europejskiej"
 EFS_flag_category_desc: "Wraz z powstaniem Federacji Europejskiej państwa członkowskie zdecydowały się przyjąć nowe flagi ze wspólnym europejskim wzorem."
 USoE_Flag_Reset_Flag_category: "Flaga USoE"
 USoE_Flag_Reset_Flag_category_desc: ""
 USoE_reset_flag: "Zresetuj flagę USoE"
 USoE_reset_flag_desc: "Zmień flagę USoE na standardową flagę UE (nie można tego cofnąć)."
 EDU_major_non_EU_ally_desc: "Aby uzyskać niezbędną strategiczną autonomię w obronie swoich zbiorowych interesów, reagować na zewnętrzne konflikty i kryzysy oraz projektować bezpieczeństwo w swoim sąsiedztwie, państwa członkowskie §YUnii Europejskiej§! postanowiły utworzyć §YEuropejską Unię Obrony (EDU)§! jako sojusz wojskowy. Początkowo EDU miała na celu obronę Europy, lecz obecnie współpracuje z państwami spoza UE, aby bronić ich wspólnych interesów i utrzymać pokój."
 POTEF750: "Doktryna wschodnia"
 POTEF750_desc: "Federacja Europejska potrzebuje dobrze wyszkolonej piechoty na wschodnie równiny."
 POTEF751: "Wojna dronów"
 POTEF751_desc: "Wojna z użyciem dronów staje się coraz tańsza, a masowe uderzenia – skuteczne."
 POTEF752: "Dalekowschodni Wielki Firewall"
 POTEF752_desc: "Rosnące wpływy §Y[CHI.GetNameWithFlag]§! w państwach członkowskich Europy Wschodniej wymagają przeciwdziałania."
 POTEF753: "Wschodni Bastion Morski"
 POTEF753_desc: "Mając Rosję po naszej stronie, możemy umocnić rozległe wschodnie wybrzeża Federacji."
 POTEF_mass_drone_production: "Koncentracja na produkcji dronów"
