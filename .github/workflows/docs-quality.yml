name: Docs Quality (Astro)

on:
  pull_request:
    branches: [main, master]
    paths:
      - "docs/**"
      - "tools/docs_checks/**"
      - ".github/workflows/docs-quality.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  docs-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            docs
            tools/docs_checks
          sparse-checkout-cone-mode: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        working-directory: docs
        run: bun install

      - name: Checker self-tests
        run: |
          python3 tools/docs_checks/check_link_syntax.py --self-test
          python3 tools/docs_checks/check_accessibility_basics.py --self-test

      - name: Docs checks (lint, build, links, a11y, perf, ...)
        id: checks
        run: python3 tools/docs_checks/check_docs.py

      - name: Write docs-quality sidecar
        if: always()
        run: |
          status=passed
          errors=0
          if [ "${{ steps.checks.outcome }}" != "success" ]; then
            status=failed
            errors=1
          fi
          {
            printf '{"suite":"tools","job":"Docs quality",'
            printf '"name":"docs-quality",'
            printf '"title":"Docs quality",'
            printf '"status":"%s","errors":%d,' "$status" "$errors"
            printf '"warnings":0,"issues":[]}\n'
          } >> suite-run.json

      - name: Upload docs-quality results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-quality-results
          path: suite-run.json
          if-no-files-found: error
          retention-days: 7
