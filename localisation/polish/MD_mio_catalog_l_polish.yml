 GENERIC_krepost_state_defense_bureau_desc: "Tajemniczy, licencjonowany eksporter specjalizujący się w MANPADS i przeciwpancernych pociskach kierowanych, zaopatrujący klientów za pośrednictwem nieoznakowanych pośredników."
 GENERIC_north_plains_heavy_industries_desc: "Rozległy zakład z czasów radzieckich, wytwarzający broń piechoty na wielką skalę i nastawiony na masową produkcję kosztem jakości."
 GENERIC_sentinel_grid_networks_desc: "Dostawca usług sygnałowych i C2 oferujący rozwiązania kompresji kill-chain dla armii nieposiadających zintegrowanej infrastruktury dowodzenia."
 GENERIC_brunn_heavy_engineering_werke_desc: "Środkowoeuropejskie przedsiębiorstwo inżynieryjne o korzeniach sięgających czasów habsburskich, wytwarzające systemy artyleryjskie – zarówno na licencji, jak i własnej konstrukcji."
 GENERIC_reichswerke_konstrukt_dynamik_desc: "Dwutorowy producent uzbrojenia z regionu Europy Środkowej, zajmujący się artylerią gąsienicową oraz platformami czołgów podstawowych."
 GENERIC_vector_defense_labs_desc: "Koncentrujący się na kosztach integrator systemów obrony przeciwrakietowej, który opiera się na doktrynie, że przechwytywanie za dolara jest skuteczniejsze niż pozłacanie."
 GENERIC_marshall_tractor_works_desc: "Zespół fabryki czołgów, stosujący odziedziczoną radziecką metodologię produkcji, która kładzie nacisk na wielkość produkcji i łatwość napraw."
 GENERIC_vanderlind_hartwell_systems_desc: "Główny wykonawca z Waszyngtonu, wykorzystujący polityczne powiązania, zabezpiecza programy pojazdów opancerzonych i bojowych wozów piechoty na dużą skalę."
 GENERIC_mil_kamov_rotorworks_desc: "Biuro konstrukcyjne śmigłowców wywodzące się z tradycji projektowania radzieckich maszyn szturmowych i transportowych, znane z tego, że przedkładało trwałość nad zaawansowanie techniczne."
 GENERIC_helitech_avionique_desc: "Kameralna, anglo-włoska firma specjalizująca się w awionice i integracji systemów śmigłowcowych, oferująca wysokiej klasy elektronikę w segmencie premium."
 GENERIC_aurora_aerodynamics_corporation_desc: "Tajny projekt typu „skunkworks”, obejmujący produkcję najnowocześniejszych myśliwców i samolotów wielozadaniowych dla wymagających klientów z sektora obronnego."
 GENERIC_societe_europeenne_daerostructures_desc: "Ogólnoeuropejskie konsorcjum realizujące wspólne przedsięwzięcia produkcyjne i specjalizujące się w wielkogabarytowych konstrukcjach lotniczych, platformach transportowych oraz samolotach patrolowych."
 GENERIC_southwestern_aerospace_dynamics_bureau_desc: "Biuro podlegające dyrekcji, zajmujące się wytwarzaniem wielozadaniowych i strategicznych platform powietrznych pod ścisłym nadzorem rządowym."
 GENERIC_skyforge_autonomous_systems_desc: "Firma powiązana z Doliną Krzemową, która w procesie tworzenia autonomicznych dronów uderzeniowych stosuje startupową kulturę szybkiego działania."
 GENERIC_compagnie_aeronatique_darmement_desc: "Producent uzbrojenia o francuskich korzeniach, oferujący międzyplatformowe standardy amunicji do samolotów myśliwskich, maszyn pokładowych oraz pocisków kierowanych."
 GENERIC_whitehall_strategic_solutions_desc: "Wyspecjalizowana firma doradcza z branży morskiej, która przekształciła się w producenta małych jednostek bojowych, koncentrując się na korwetach i okrętach patrolowych."
 GENERIC_triton_maritime_defense_group_desc: "Międzynarodowa sieć stoczniowa produkująca niszczyciele i fregaty w wielu krajach partnerskich."
 GENERIC_eastern_maritime_shipbuilding_group_desc: "Stocznia pracująca w systemie trzyzmianowym i w trybie ciągłym, budująca krążowniki oraz lotniskowce w napiętych terminach."
 GENERIC_sevmorprom_submarine_yards_desc: "Północna rosyjska stocznia okrętów podwodnych specjalizująca się w pracach na zimnych wodach oraz platformach szturmowych i rakietowych o jakości eksportowej."
 GENERIC_halland_civic_engineering_group_desc: "Nordycki konglomerat przemysłowy specjalizujący się w logistyce podwójnego zastosowania, obejmującej infrastrukturę cywilną i łańcuchy dostaw wojskowych."
 GENERIC_second_academy_missile_bureau_desc: "Biuro badań nad pociskami balistycznymi i manewrującymi, działające w oparciu o rygorystyczne protokoły „need-to-finance”."
 GENERIC_western_orbital_systems_bureau_desc: "Biuro ds. systemów orbitalnych i strategicznych, koncentrujące się na środkach przenoszenia nowej generacji oraz świadomości sytuacyjnej w przestrzeni kosmicznej."
 GENERIC_central_heavy_atomics_power_desc: "Program napędu i uzbrojenia wykorzystujący energię jądrową, łączący wiedzę z zakresu cywilnych reaktorów z rozwojem morskich pocisków balistycznych."
