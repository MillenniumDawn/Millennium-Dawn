 RULE_OPTION_MD_ANNEX_YES_DESC: "After a peace deal, if multiple instances of the same tag exist, all remaining tags will be integrated into the one with the most powerful overlord. The overlord's strength will be determined by their power rank national spirit. Clean-up after a war may take up to 14 days to take place."
