l_spanish:
 united_kingdom_focus: "Árbol de enfoque del Reino Unido"
 ENG_royal_army: "Ejército británico"
 ENG_royal_army_desc: "El Ejército británico es la principal fuerza terrestre de las Fuerzas Armadas Británicas y sus orígenes se remontan a los ejércitos escocés e inglés en 1707, cuando se unieron en el Acta de Unión. Ha participado en casi todas las guerras importantes, incluidas la Guerra de los Siete Años, la Guerra Revolucionaria, las Guerras Napoleónicas, la Guerra de Crimea y la Primera y Segunda Guerra Mundial. En este tiempo, ha evolucionado desde una fuerza principalmente de infantería a una fuerza altamente avanzada y mecanizada con diversos elementos de apoyo y sus fuerzas especiales de clase mundial, que han servido como punto de referencia para otros servicios internacionales."
 ENG_irish_referendum: "[GetYear] Referéndum de independencia de [NIR.GetFlag] Irlanda del Norte"
 ENG_irish_referendum_desc: "El pueblo de [NIR.GetFlag] Irlanda del Norte votará en un referéndum que determinará su futuro como nación, territorio constituyente y actor en las islas británicas. La campaña se desarrollará hasta el día de la votación, y el resultado reflejará la postura que haya adoptado la opinión pública norirlandesa en el momento del recuento. Westminster puede gastar poder político y fondos de la tesorería para influir en ella.\n\nVoto para abandonar la Unión: §Y[?ENG_referendum_leave_vote|0]§!%"
 ENG_scottish_referendum: "[GetYear] Referéndum [SCO.GetFlag] escocés por la independencia"
 ENG_scottish_referendum_desc: "El pueblo de [SCO.GetFlag] Escocia votará en un referéndum que determinará su futuro como nación, territorio constituyente y actor en las islas británicas. La campaña se desarrollará hasta el día de la votación, y el resultado reflejará la postura que haya adoptado la opinión pública escocesa en el momento del recuento. Westminster puede gastar poder político y fondos de la tesorería para influir en ella.\n\nVoto para abandonar la Unión: §Y[?ENG_referendum_leave_vote|0]§!%"
 britain_md.1.t: "Nuestra ambición para Gran Bretaña"
 britain_md.1.d: "El pueblo ha hablado y se ha decidido que el Partido Laborista es el partido elegido por el pueblo para que lo represente en el futuro. Nuestra visión y ambición de que Gran Bretaña sea verdaderamente lo mejor que puede ser no tiene límites, y comenzaremos a abordar las cuestiones de nuestra gran unión de inmediato."
 britain_md.2.t: "¿Aprovechando nuestras oportunidades?"
 britain_md.2.d: "Podemos influir masivamente en el mercado nacional fomentando inversiones en determinadas industrias nicho. Pero hacerlo podría potencialmente infundir miedo en los inversores que han invertido su dinero en industrias competidoras, causando una ligera desaceleración económica. Actualmente el gabinete está dividido sobre si esta medida es o no la mejor a tomar en este momento."
 britain_md.3.t: "Haciendo una gran promesa"
 britain_md.3.d: "Para cautivar a una base de votantes más amplia, necesitaremos apelar a una de nuestras facciones internas. Hacerlo no sólo demostrará nuestra capacidad para operar múltiples sectores del gobierno con eficiencia, sino que también nos permitirá adquirir un poco de capital adicional para financiar otros proyectos. Además, con la nueva influencia adquirida sobre estas facciones, podremos cambiar el rumbo en futuras elecciones contra nuestros rivales políticos."
 britain_md.4.t: "¿A quién le cobramos impuestos?"
 britain_md.4.d: "Nuestro gobierno se enfrenta a una situación singular. Para obtener más ingresos, necesitaríamos aumentar los impuestos para financiar nuestros programas de gasto social. Sin embargo, hacerlo enojará a un segmento de la población de una manera u otra, y se ha advertido contra los impuestos generalizados porque es probable que sean los que más daño hagan a nuestra reputación. En lugar de eso, nuestro gabinete propone que gravemos a un segmento de la población para no irritar a todo el mundo."
 britain_md.5.t: "Gran Bretaña avanza, no retrocede"
 britain_md.5.d: "Debemos evitar que la sociedad caiga en las profundas represiones que algunos de nuestros oponentes políticos siguen reclamando. Lucharemos para que Gran Bretaña siga avanzando hacia el futuro sin interrupciones. Nuestros valores, orden y estabilidad no deben verse comprometidos bajo ninguna circunstancia, y lucharemos para garantizar que permanezcamos en la cima de las elecciones."
 britain_md.6.t: "Raspando los cielos británicos"
 britain_md.7.t: "Nadie se queda atrás"
 britain_md.7.d: "En todo el mundo, ya sea en Europa, Asia, África o las Américas, la desigualdad sigue creciendo. Con unos salarios estancados y unos precios por las nubes, vivir en sí mismo se ha convertido en una carga. Sin embargo, ¡este no tiene por qué ser el caso de los ciudadanos del Reino Unido! Mediante reformas rápidas y nuevas políticas, demostraremos al mundo que no es necesario sucumbir a esta tendencia creciente de desigualdad."
 britain_md.8.t: "¿Conexiones entre ambos?"
 britain_md.8.d: "Mucha gente de la derecha del espectro político ha declarado que el aumento de la delincuencia está directamente relacionado con el aumento de la migración en los últimos años. Aunque muchos refutan estas afirmaciones, calificándolas de xenófobas e intolerantes, otros afirman que la causa es la incapacidad de algunos migrantes y refugiados de asimilarse a la cultura [ENG.GetAdjective]."
 britain_md.9.t: "Siempre puede ser mejor"
 britain_md.9.d: "Gran Bretaña no tiene por qué ser como el resto del mundo; puede ser mejor. Mediante una reforma política seria, podemos contrarrestar la corriente de retroceso democrático y convertir a Gran Bretaña en la mejor versión posible de sí misma. Esta vez, el Partido Laborista se ha comprometido a implementar reformas sociales y políticas drásticas, y nuestro mensaje llegará al pueblo británico como nunca antes."
 britain_md.10.t: "¿Reconsideración de la Ley de Lobby?"
 britain_md.10.d: "Algunos miembros de nuestro gabinete nos piden cada vez más que reconsideremos la ley de lobby. Tal medida, por supuesto, causaría revuelo y podría conducir a un aumento de los casos de corrupción en el gobierno. Sin embargo, si quisiéramos conseguir algún apoyo y financiación rápidos para nuestro partido, quizá debiéramos considerar al menos realizar algunas modificaciones a la ley."
 britain_md.11.t: "Dando un poco de sentido común a Gran Bretaña"
 britain_md.11.d: "Es hora de que traigamos algo de normalidad a este país sumido en el caos. El sentido común parece haberse descartado por completo, ya que los laboristas han comenzado a aprobar reformas con daños irreversibles. Nuestro gobierno impulsará a Gran Bretaña hacia un estado más fuerte e independiente, no uno gobernado por Bruselas o por un gabinete de izquierdistas."
 britain_md.12.t: "[FROM.GetName] solicita acceso militar"
 britain_md.12.d: "En un aparente esfuerzo por hacer de Europa un continente más flexible en materia de defensa, los [ENG.GetAdjective] han decidido enviar solicitudes de acceso militar. Aunque no ganaremos nada con ello, tampoco perderemos prácticamente nada."
 britain_md.13.t: "Participación británica"
 britain_md.13.d: "El gobierno británico se ha comprometido a ayudarnos a combatir a nuestros enemigos y a proteger la soberanía de nuestro estado. Lo que no dejaron muy claro fue qué esperaban a cambio. Hemos recibido información de una fuente confiable de que el gobierno británico tiene la intención de confiscar nuestros recursos en Freetown por un período de 500 días si logra ejercer una influencia significativa sobre nosotros. Tienen la intención de hacer esto independientemente de si les permitimos desplegar tropas o no."
 britain_md.14.t: "¡Los británicos se apoderan de nuestros recursos!"
 britain_md.14.d: "Los británicos se han apoderado de nuestros recursos porque ejercen una influencia considerable sobre nosotros. Esto durará 500 días hasta que se retiren."
 britain_md.15.t: "Fin de la misión: Barras"
 britain_md.15.d: "Nuestro tiempo en Sierra Leona está llegando a su fin, y hemos comenzado los preparativos para eliminar las instituciones que han estado transfiriendo recursos desde Sierra Leona para ser exportados y obtener ingresos británicos."
 britain_md.16.t: "¿Golpe de Estado en Gambia?"
 britain_md.16.d: "Ha llegado el momento de que finalmente pongamos fin al estado tiránico dirigido por [GAM.GetLeader] en Gambia. Organizaremos un derrocamiento de su gobierno, pero si tentamos demasiado a la suerte, podría desembocar en una guerra civil y potencialmente salirse de nuestras manos."
 britain_md.17.t: "Golpe de Estado exitoso en Gambia"
 britain_md.17.d: "Hemos derrocado con éxito al régimen opresor de Gambia y hemos instaurado el gobierno que deseamos. El pueblo de Gambia ya no sufrirá una opresión innecesaria."
 britain_md.18.t: "Golpe de Estado fallido en Gambia"
 britain_md.18.d: "No hemos logrado derrocar a [GAM.GetLeader] y, como resultado, hemos perdido a varios militares británicos. Nuestro intento de golpe de Estado está siendo duramente criticado internacionalmente, y las relaciones con el gobierno gambiano se han deteriorado."
 britain_md.19.t: "Golpe de Estado increíblemente exitoso en Gambia"
 britain_md.19.d: "Hemos tenido mucho éxito en nuestros esfuerzos en Gambia. No solo hemos derrocado al gobierno opresor, sino que también hemos logrado establecer un control firme sobre el estado, convirtiéndolo esencialmente en un estado satélite."
 britain_md.20.t: "Operación Delta Guard: Éxito"
 britain_md.20.d: "Hemos logrado asegurar yacimientos petrolíferos estratégicos en el Delta, y se ha visto a las fuerzas nigerianas retirándose hacia el norte, rumbo a su capital. Se desconoce si tomarán represalias, pero por ahora disfrutamos del botín de guerra."
 britain_md.21.t: "Las fuerzas británicas se apoderan de petróleo en el Delta"
 britain_md.21.d: "Las fuerzas británicas han violado gravemente nuestra soberanía y han declarado que nuestros sagrados campos petrolíferos están bajo \"protección temporal\", calificando a nuestro gobierno de inestable y poco confiable. No tenemos idea de por qué decidieron que la acción militar es el mejor curso de acción para seguir adelante, pero una cosa es segura: no podemos quedarnos de brazos cruzados ante esta situación."
 britain_md.22.t: "Nigeria toma represalias"
 britain_md.22.d: "Varios militares británicos resultaron heridos y algunos incluso murieron en un ataque de represalia de las Fuerzas Armadas de Nigeria. Esto surge como respuesta a nuestra toma de varios yacimientos petrolíferos del Delta, lo que nos asegura un acceso vital al petróleo del inestable gobierno nigeriano. Debemos tomar la capital nigeriana para ponerlos en su lugar."
 britain_md.23.t: "Las fuerzas británicas se retiran"
 britain_md.23.d: "Por temor al poder de las grandes Fuerzas Armadas nigerianas y al valiente liderazgo de [NIG.GetLeader], las cobardes fuerzas británicas se han retirado del Delta y han cesado todas las operaciones petroleras. Salimos victoriosos en este sentido y no esperamos más represalias británicas."
 britain_md.24.t: "Seleccionar una agenda"
 britain_md.24.d: "Nuestro partido ha ganado las elecciones, es hora de que seleccionemos una agenda."
 britain_md.25.t: "Reino Unido - Información, por favor lea"
 britain_md.25.d: "¡Hola! Parece que has elegido el Reino Unido como país. ¡Esperamos que lo disfrutes!\n\nActualmente estás jugando la Fase I de la actualización del Reino Unido, que incluye un árbol de enfoque, un conjunto de decisiones y mecánicas de monarquía rediseñados. Quizás te preguntes si habrá más novedades, y la respuesta es sí, habrá más.\n\nFase II:\nEn la Fase II se puede esperar ver un sistema de devolución aún más profundo y un sistema de Cámara de los Comunes mejorado.\n\nFase III\nEn la Fase III puedes esperar un árbol de política exterior ampliado, caminos políticos adicionales y ¡mucho más!\n\nSi tienes algún comentario sobre el árbol, ¡háznoslo saber en nuestro Discord, Reddit o Github!\n\n - Equipo de MD Reino Unido"
 britain_md.26.t: "Adelante con una nueva política para las Falklands"
 britain_md.26.d: "En la actualidad se han intensificado los llamamientos para que se siga trabajando en la integración de las Islas Falkland o se adopten nuevas medidas. Si bien esto último puede ser un poco agresivo, a la larga nos beneficiará. También hay quienes desean que devolvamos las Malvinas para consolidar nuestra imagen en la región sudamericana."
 ENG_british_flag_on_the_moon: "Bandera británica en la luna"
 ENG_british_flag_on_the_moon_desc: "Embárcate en una ambiciosa misión lunar mientras el Reino Unido se esfuerza por establecer una base británica en la Luna. Esta iniciativa lunar simboliza la dedicación del país a la exploración espacial, demostrando su capacidad tecnológica y fomentando la innovación científica. Sé pionero en la frontera cósmica, elevando la posición global del Reino Unido en el ámbito de la exploración espacial."
 ENG_set_sail_to_mars: "Zarpa hacia Marte"
 ENG_set_sail_to_mars_desc: "Aventurándose más allá de los límites de la Tierra, el Reino Unido aspira a establecer una presencia en Marte. Esta iniciativa visionaria se centra en ser pionero en la exploración marciana, ampliando los límites de la tecnología espacial y posicionando al Reino Unido como un actor clave en la búsqueda de la humanidad para llegar al Planeta Rojo. Embárcate en el desafío de la conquista marciana, definiendo el papel del Reino Unido en el futuro de la exploración interplanetaria."
 ENG_new_thirteen_colonies: "Nuevas trece colonias"
 ENG_new_thirteen_colonies_desc: "Al trazar un rumbo hacia nuevas fronteras, el Reino Unido se inspira en la historia y visualiza el establecimiento de las Trece Nuevas Colonias en Marte. Retomando el espíritu de las trece colonias originales, esta ambiciosa iniciativa simboliza el compromiso del Reino Unido con la colonización marciana, afrontando los desafíos de la colonización interplanetaria. Lidera la creación de un nuevo legado en el Planeta Rojo, donde los pioneros británicos emprenden un viaje que evoca las raíces históricas de la nación."
 ENG_asteroid_mining: "Minería de Asteroides"
 ENG_asteroid_mining_desc: "Avanzando hacia el cosmos con la Royal Asteroid Mining Company británica, mientras el Reino Unido adopta la Recolección de Recursos Celestiales. Decidida a extraer recursos valiosos de asteroides, esta iniciativa simboliza la dedicación del país a la utilización pionera de recursos espaciales y la tecnología de vanguardia."
 ENG_standardized_space_parts: "Piezas espaciales estandarizadas"
 ENG_standardized_space_parts_desc: "Revolucionar la asequibilidad de la exploración espacial impulsando la estandarización de componentes espaciales en el Reino Unido. Al optimizar y estandarizar los componentes, esta iniciativa busca hacer que las empresas espaciales sean más rentables, lo que demuestra el compromiso del país con el fomento de proyectos espaciales accesibles y económicos."
 ENG_virgin_galactic: "Virgin Galactic"
 ENG_virgin_galactic_desc: "Como líder en la industria del turismo espacial, Virgin Galactic se esfuerza por hacer que el cosmos sea accesible para todos. Con naves espaciales innovadoras y el compromiso de ampliar los límites de la exploración espacial, Virgin Galactic representa el papel del Reino Unido en la configuración del futuro de las aventuras espaciales civiles."
 ENG_british_commercial_spaceport: "Puerto espacial comercial británico"
 ENG_british_commercial_spaceport_desc: "Ante la creciente carrera global por el cosmos, el Reino Unido reconoce la necesidad imperiosa de consolidar su posición en la vanguardia de la exploración espacial. El establecimiento de un puerto espacial comercial británico es fundamental para impulsar la presencia del país en las iniciativas espaciales comerciales. Al invertir en la construcción y el desarrollo de un puerto espacial específico, el Reino Unido aspira a fomentar la innovación, atraer alianzas internacionales e impulsar su industria aeroespacial a nuevas cotas, asegurando un futuro prometedor como actor clave en la frontera cósmica."
 ENG_united_kingdom_space_command: "Comando Espacial del Reino Unido"
 ENG_united_kingdom_space_command_desc: "A medida que el cosmos se convierte en un nuevo escenario de influencia estratégica, el Reino Unido reconoce la necesidad de consolidar sus esfuerzos en operaciones espaciales. El establecimiento del Comando Espacial del Reino Unido es un objetivo decisivo para unificar y fortalecer las capacidades espaciales del país. Mediante la centralización del mando, el fomento de operaciones conjuntas y la inversión en tecnologías de vanguardia, el Reino Unido se esfuerza por asegurar sus intereses en el ámbito cósmico, garantizando una presencia formidable entre las estrellas y salvaguardando la seguridad nacional en la era espacial."
 ENG_istari_programme: "Programa ISTARI"
 ENG_istari_programme_desc: "En respuesta al panorama global en evolución, el Reino Unido presenta el Programa ISTARI, un enfoque ambicioso dedicado a la Inteligencia, Vigilancia, Adquisición de Objetivos y Reconocimiento en el dominio cibernético."
 ENG_space_red_coats: "Fusileros espaciales"
 ENG_space_red_coats_desc: "Inspirándose en un pasado histórico, el Reino Unido revitaliza el legado de los Casacas Rojas con los Fusileros Espaciales del Siglo XXI. Evocando el espíritu de resiliencia histórica, este enfoque impulsa la exploración espacial británica hacia una nueva era. Vestidos de rojo simbólico, los Casacas Rojas Espaciales se esfuerzan por explorar el cosmos, encarnando la tradición de la exploración y proyectando la influencia británica a través de la extensión celestial."
 ENG_1st_space_force_division: "1ª División de la Fuerza Espacial"
 ENG_1st_space_force_division_desc: "Trazando un curso más allá de los límites terrestres, el Reino Unido traza un camino audaz con la creación de la División de la Fuerza Espacial Británica. Sin precedentes en la historia, esto marca el inicio de una nueva era mientras Gran Bretaña establece su primera división espacial dedicada. Encargada de salvaguardar los intereses celestes y abrazar lo desconocido, la División de la Fuerza Espacial simboliza el compromiso de la nación con la exploración y seguridad de la frontera cósmica, donde la Union Jack ondeará entre las estrellas."
 ENG_space_capabilities: "Capacidades del ciberespacio"
 ENG_space_capabilities_desc: "Reconociendo la importancia fundamental del ámbito digital, el Reino Unido centra su atención en mejorar las capacidades del ciberespacio. En una era donde la información es poder, esta iniciativa representa un compromiso para fortalecer la capacidad del país en las operaciones ciberespaciales."
 ENG_strategic_defence_review: "Libro Blanco de Defensa de [GetYear]"
 ENG_strategic_defence_review_desc: "Nuestras prioridades y amenazas cambian constantemente, y nuestra burocracia militar debe evolucionar para contrarrestarlas. Al coordinar una nueva respuesta de seguridad nacional con socios de todo el gobierno y nuestros aliados, podemos garantizar que nuestras fuerzas armadas se mantengan adaptables al cambio y listas para afrontar las amenazas a la seguridad británica."
 ENG_AS90: "AS-90 Braveheart"
 ENG_AS90_desc: "El AS90, sistema de artillería de la década de 1990, también conocido como equipo de cañón L131 de 155 mm, es el principal armamento blindado autopropulsado del Ejército británico. Fue diseñado y construido por la división de armamento de Vickers Shipbuilding and Engineering entre 1982 y 1987, y entró en producción en 1992 con 179 vehículos fabricados. Reemplazó al antiguo FV433 Abbot de 105 mm y al antiguo cañón autopropulsado M109 de 155 mm. Se han propuesto proyectos para modernizar el AS90 e incorporar un cañón más grande, capaz de disparar armas del calibre 52, lo que aumenta su alcance sin asistencia y munición de largo alcance."
 ENG_operation_excellence: "Comando especial"
 ENG_utility_vehicle_modernisation: "Modernización de vehículos utilitarios"
 ENG_utility_vehicle_modernisation_desc: "Se ha vuelto claro a través de las experiencias en Irlanda del Norte durante el período de los Problemas que los actuales vehículos utilitarios de infantería militar empleados por el Ejército, como el Snatch Land Rover, ofrecen poca o ninguna protección contra los IED y las minas, con informes de supervivencia que indican que dañan activamente a los supervivientes de la explosión inicial. Como tal, el Ministerio de Defensa ha comenzado a explorar opciones para emplear vehículos modernos con blindaje resistente a minas y emboscadas, como el 'Cougar' MRAP de EE.UU."
 ENG_nlaw_anti_tank_system: "Sistema antitanque NLAW"
 ENG_nlaw_anti_tank_system_desc: "El SAAB Bofors Dynamics NLAW, MBT LAW o R85 es un sistema de misiles ligero, de lanzamiento portátil, desechable y de línea de visión, diseñado para infantería. Diseñado por SAAB para los Ministerios de Defensa del Reino Unido y Suecia en el Reino Unido, bajo el mando del Equipo NLAW, con diversos subcontratistas, incluyendo una amplia colaboración con Thales Air Defence."
 ENG_startstreak_anti_air_system: "Sistema antiaéreo Starstreak"
 ENG_startstreak_anti_air_system_desc: "El Starstreak es un misil tierra-aire británico de corto alcance, un sistema portátil de defensa aérea (MANPADS) que se utiliza en diversas configuraciones en helicópteros y vehículos para cobertura móvil. Es fabricado por Thales Air Defence en Belfast, Irlanda del Norte. Tras el lanzamiento, el misil alcanza velocidades superiores a Mach 4, lo que lo convierte en el misil tierra-aire de corto alcance más rápido del mercado. Para aumentar su potencial, lanza tres submuniciones que transportan rayos láser contra su objetivo, lo que aumenta la probabilidad de un impacto."
 ENG_M270: "Recapitalizar la M270"
 ENG_M270_desc: "El Ministerio de Defensa planea invertir en la recapitalización de los sistemas de lanzadores de misiles M270 sobre orugas y de varios tipos de misiles en servicio, para complementar la adquisición de municiones del Sistema de Lanzamiento de Cohetes Guiados. Con la intención de introducir nuevos motores, blindaje y sistemas de control de tiro modernizados."
 ENG_mobile_fires_platform_program: "Programa de Plataforma de Incendios Móviles"
 ENG_mobile_fires_platform_program_desc: "Tras el fin de la Guerra Fría y la disminución de la expectativa de un conflicto en las llanuras alemanas, el arsenal de sistemas de artillería de 155 mm del Ejército disminuyó. Ahora, ante nuevas amenazas en el horizonte, el Ministerio de Defensa ha decidido tomar medidas para revitalizar esta capacidad. Se han presentado numerosos candidatos para este contrato, de los cuales solo uno resultará ganador."
 ENG_fres_program: "Programa FRES"
 ENG_fres_program_desc: "El Programa FRES (Sistema de Efecto Rápido Futuro) representa un enfoque prospectivo para el desarrollo de capacidades militares. Centrado en la agilidad y la adaptabilidad, FRES tiene como objetivo proporcionar a las Fuerzas Armadas Británicas una versátil gama de plataformas terrestres, incluyendo vehículos blindados y sistemas de apoyo."
 ENG_fix_civil_servant: "Arreglar el 'Funcionario Civil'"
 ENG_fix_civil_servant_desc: "Originalmente asediado por quejas frecuentes y problemas de rendimiento entre las tropas, el fusil L85A1 se sometió a una actualización completa en respuesta a su difícil mantenimiento y operación poco confiable. A menudo apodado el 'funcionario civil' debido a su percepción de poca confiabilidad y funcionalidad compleja, estas preocupaciones promovieron una revisión significativa de 2000 a 2002. Aproximadamente 200,000 de los 320,000 fusiles automáticos L85A1 existentes fueron renovados."
 ENG_modern_littoral_force: "Fuerza Litoral Moderna"
 ENG_trident_nuclear_program: "Programa Nuclear Trident"
 ENG_general_dynamics_ajax: "General Dynamics Ajax"
 ENG_general_dynamics_ajax_desc: "El General Dynamics Ajax, un vehículo de reconocimiento de última generación, surgió como una piedra angular en los esfuerzos de modernización de las Fuerzas Armadas Británicas. Diseñado para satisfacer las exigentes necesidades de la guerra moderna, este vehículo blindado ágil y avanzado integró tecnología de vanguardia, permitiendo capacidades de reconocimiento sin precedentes."
 ENG_challenger_lethality_improvement_programme: "Programa de Mejora de Letalidad del Challenger"
 ENG_challenger_lethality_improvement_programme_desc: "El Programa de Mejora de Letalidad del Challenger fue un programa para reemplazar el actual cañón rayado L30A1 con el cañón de ánima lisa Rheinmetall de 120 mm actualmente utilizado en el Leopard 2 y el M1 Abrams. El uso de un arma de ánima lisa habría permitido al Challenger 2 utilizar munición estándar de la OTAN, incluyendo penetradores de energía cinética basados en tungsteno que no tienen las mismas objeciones políticas y ambientales que las rondas de uranio empobrecido."
 ENG_challenger_3: "Challenger 3"
 ENG_challenger_3_desc: "El tanque Challenger 3, desarrollado con orgullo por el Reino Unido, personifica la guerra acorazada de vanguardia. Con tecnología de última generación, potencia de fuego formidable y protección mejorada, el Challenger 3 garantiza una dominación superior en el campo de batalla. Este tanque modernizado subraya el compromiso del Reino Unido de mantener una fuerza acorazada formidable, lista para enfrentar los desafíos de la guerra contemporánea."
 ENG_modern_landing_craft: "Embarcaciones de Desembarco Modernas"
 ENG_mechanised_amphibious_assault: "Asalto Anfibio Mecanizado"
 ENG_aircraft_ai_integration: "Integración de IA en Aeronaves"
 ENG_aircraft_ai_integration_desc: "Guiado por el principio de Calidad sobre Cantidad, el Reino Unido prioriza la excelencia y la superioridad tecnológica en sus fuerzas militares. Este espíritu nacional enfatiza la adquisición de equipos avanzados y sofisticados, asegurando una postura de defensa formidable y tecnológicamente avanzada. Al enfocarse en la calidad, el Reino Unido busca maximizar la efectividad de sus fuerzas, creando una ventaja estratégica frente a los desafíos modernos."
 ENG_strike_brigades: "Brigadas de Ataque"
 ENG_future_soldier_armed_forces: "Fuerzas Armadas del Soldado del Futuro"
 ENG_future_soldier_armed_forces_desc: "La iniciativa Soldado del Futuro es una estrategia prospectiva adoptada por las fuerzas armadas, incluido el Reino Unido. Se centra en equipar a los soldados con tecnologías y capacidades de vanguardia, mejorando su efectividad en el campo de batalla moderno."
 ENG_joint_expeditionary_force: "Fuerza Expedicionaria Conjunta"
 ENG_joint_expeditionary_force_desc: "Originada en 2012 e introducida por el entonces Jefe del Estado Mayor de la Defensa, el General Sir David Richards, la Fuerza Expedicionaria Conjunta (JEF) surgió de la disolución de la Fuerza de Reacción Rápida Conjunta (JRRF) durante el énfasis del Reino Unido en las operaciones de Afganistán e Irak. Compuesta por personal y equipos de la Royal Navy, Royal Marines, Ejército Británico y Royal Air Force, el componente del Reino Unido de la JEF prioriza una mayor integración. Esta integración se enfatiza particularmente al trabajar junto a las fuerzas armadas de otras naciones, marcando un cambio significativo con respecto a los modelos anteriores."
 ENG_carrier_group_debate: "Debate sobre el Grupo de Portaaeronaves"
 ENG_worldwide_reach: "Alcance Mundial"
 ENG_worldwide_reach_desc: "El Reino Unido fue alguna vez una superpotencia, teniendo un alcance en todo el mundo para proteger sus intereses. Necesitamos volver a este poder para mantener nuestros intereses en todo el globo."
 ENG_national_service_debate: "Debate sobre el Servicio Nacional"
 ENG_national_service_debate_desc: "Un ejército basado en voluntarios no puede mantener el ritmo con la creciente demanda de tropas británicas en todo el mundo. Necesitamos aumentar nuestro reclutamiento para cumplir con la demanda."
 ENG_army_special_operations_brigade: "Brigada de Operaciones Especiales del Ejército"
 ENG_reestablish_far_east_command: "Reestablecer el Mando del Lejano Oriente"
 ENG_reestablish_far_east_command_desc: "El reestablecimiento británico del Mando del Lejano Oriente marca una reorientación estratégica hacia el fortalecimiento de las capacidades militares en esta región pivotal. Esta iniciativa implica el despliegue de estructuras de mando, unidades operativas y apoyo logístico para abordar eficazmente las dinámicas de seguridad en evolución. Al fortificar la presencia y la coordinación en el Lejano Oriente, las Fuerzas Armadas Británicas buscan responder con destreza a los desafíos regionales, fomentar asociaciones con aliados y contribuir significativamente a la estabilidad general de esta parte estratégicamente vital del mundo."
 ENG_britannia_armed_forces: "Fuerzas Armadas de Britannia"
 ENG_britannia_armed_forces_desc: "Con nuestros esfuerzos por recrear nuestro poder militar mundial, finalmente podemos decir que tenemos un ejército capaz de defender los intereses británicos en todo el mundo."
 ENG_allied_basing_efforts: "Esfuerzos de Base Aliada"
 ENG_allied_basing_efforts_desc: "La Iniciativa de Base Aliada representa un compromiso unificado para fortalecer las capacidades estratégicas entre las naciones miembros de la alianza. Bajo esta iniciativa, el Reino Unido se beneficia de una mejora sostenida y sustancial en la infraestructura, incluyendo ferrocarriles, bases aéreas, puertos y más. Esta mejora duradera aumenta la destreza logística y la efectividad operativa general del Reino Unido."
 ENG_reactivate_naval_defense_act_1889: "Reactivar la Ley de Defensa Naval de 1889"
 ENG_reactivate_naval_defense_act_1889_desc: "En un guiño simbólico a la prominencia marítima histórica, la Reactivación de la Ley de Defensa Naval de 1889 marca un compromiso de cara al futuro para fortalecer las capacidades navales. Esta legislación tiene como objetivo encauzar el espíritu del pasado en la preparación naval moderna. Al revigorizar los principios de la ley original, el Reino Unido señala su dedicación a mantener una fuerza naval robusta y tecnológicamente avanzada. La ley podría incluir disposiciones para la modernización de activos navales, la expansión de la infraestructura naval y inversiones estratégicas para asegurar que la Royal Navy siga siendo una presencia formidable en el escenario global."
 ENG_royal_navy: "Armada Real"
 ENG_royal_navy_desc: "La Armada Real Británica se erige como una de las fuerzas marítimas más destacadas del mundo, con un legado histórico que se remonta a siglos. Reconocida por su adaptabilidad y destreza tecnológica, la Royal Navy desempeña un papel crucial en la protección de los intereses marítimos del Reino Unido y en la proyección de poder a nivel global."
 ENG_british_foreign_legion: "Legión Extranjera Británica"
 ENG_british_foreign_legion_desc: "Adoptando un modelo de servicio internacional, esta legión da la bienvenida a nacionales extranjeros que deseen servir en el ejército británico. Diseñada para fomentar la camaradería, la diversidad y un sentido de propósito compartido, la Legión Extranjera Británica se convierte en una vía única para que individuos de diversos orígenes contribuyan a la defensa del Reino Unido."
 ENG_multi_ocean_navy: "Armada Multiocéano"
 ENG_multi_ocean_navy_desc: "Para proteger los intereses británicos en todo el mundo, necesitamos aumentar nuestras capacidades navales para operar en todos los océanos."
 ENG_Strategic_Aircraft_Training: "Entrenamiento de Aeronaves Estratégicas"
 ENG_Strategic_Aircraft_Training_desc: "En los tiempos modernos, es necesario tener una fuerza aérea capaz de operar en todos los océanos. Necesitamos aumentar nuestras operaciones de aeronaves estratégicas para tener esta capacidad."
 ENG_field_army_expansion: "Expansión del Ejército de Campo"
 ENG_field_army_expansion_desc: "La iniciativa de Expansión del Ejército de Campo marca un compromiso estratégico del Reino Unido para fortalecer sus fuerzas terrestres, asegurando una capacidad militar robusta y adaptable. Esta expansión implica aumentar el tamaño y las capacidades del ejército de campo, que abarca las fuerzas terrestres principales del Ejército Británico."
 ENG_type_31_frigate_inspiration_class: "Fragata Clase Inspiration Tipo 31"
 ENG_type_31_frigate_inspiration_class_desc: "El Tipo 31 es la mitad de propósito general de la fuerza de fragatas, ordenado en 2019 a un precio fijo de 250 millones de libras por barco. Babcock construye las cinco unidades en Rosyth según el diseño Arrowhead 140, derivado de la clase danesa Iver Huitfeldt, un casco diésel-eléctrico grande con un cañón Bofors de 57 mm, el Sea Ceptor y un margen deliberado dejado para futuras mejoras. Inspiration, Active, Bulldog, Campbeltown y Formidable reviven nombres de toda la historia de la flota."
 ENG_multi_role_support_ship_project: "Proyecto de Buque de Apoyo Multirrol"
 ENG_multi_role_support_ship_project_desc: "El Buque de Apoyo Multirrol está destinado a reemplazar a los buques Albion, Bulwark y la clase Bay en un solo casco flexible. En lugar de ser un barco de muelle construido para un gran desembarco, está diseñado alrededor de una bahía de misión, una cubierta de vuelo y alojamiento modular, para que el mismo buque pueda transportar una fuerza de incursión de comandos, realizar una operación de ayuda humanitaria o servir como base avanzada para sistemas no tripulados."
 ENG_expanded_carrier_wing_procurement: "Adquisición de Ala de Portaaviones Ampliada"
 ENG_expanded_carrier_wing_procurement_desc: "Al invertir en un ala de portaaviones ampliada, el Reino Unido busca proyectar poder, proteger los intereses marítimos y contribuir significativamente a los esfuerzos de seguridad internacional. Esta iniciativa refleja la dedicación de la nación a mantener una fuerza de aviación naval moderna y capaz en el panorama de seguridad global en rápida evolución."
 ENG_strategic_aircraft_strategy: "Estrategia de Aeronaves Estratégicas"
 ENG_strategic_aircraft_strategy_desc: "La Estrategia de Aeronaves Estratégicas describe el enfoque del Reino Unido para la adquisición, despliegue y utilización de activos de aeronaves estratégicas. Esta estrategia integral abarca una serie de consideraciones, incluyendo prioridades de defensa nacional, desafíos de seguridad global y avances tecnológicos."
 ENG_continent_operational_considerations: "Consideraciones Operativas Continentales"
 ENG_continent_operational_considerations_desc: "Necesitamos priorizar nuestro compromiso con nuestras fuerzas armadas y aliados. Por lo tanto, necesitamos seleccionar en qué rama de nuestro ejército nos especializamos."
 ENG_astute_class: "Submarino Clase Astute"
 ENG_astute_class_desc: "La clase Astute es la última clase de submarinos de flota propulsados por energía nuclear en servicio con la Royal Navy. Los barcos están siendo construidos por BAE Systems Submarines en Barrow-in-Furness."
 ENG_type_45_destroyer_upgrades: "Mejoras del Destructor Tipo 45"
 ENG_type_45_destroyer_upgrades_desc: "El proyecto de Mejoras del Destructor Tipo 45 tiene como objetivo mejorar las capacidades de los destructores Tipo 45 de la Royal Navy a través de tecnología avanzada y mejoras en los sistemas. Las áreas clave de enfoque incluyen radar, sistemas de combate, propulsión y mejoras en la defensa de misiles."
 ENG_dreadnought_class: "Submarino Clase Dreadnought"
 ENG_dreadnought_class_desc: "El proyecto del Submarino Clase Dreadnought implica el diseño, construcción e integración de los submarinos de misiles balísticos de próxima generación para la Royal Navy. Estos submarinos contarán con capacidades avanzadas de sigilo, propulsión y armas estratégicas, asegurando una capacidad disuasoria nuclear creíble para el Reino Unido."
 ENG_type_26_frigate: "Fragata Tipo 26"
 ENG_type_26_frigate_desc: "El Tipo 26, llamado Clase City en honor a Glasgow, Cardiff, Belfast y sus hermanas, es la mitad antisubmarina de la fuerza de fragatas. Construido por BAE Systems en el Clyde desde 2017, está organizado alrededor del silenciamiento acústico: una plataforma diésel-eléctrica y de turbina de gas montada en una balsa, el array remolcado de sonar Sonar 2087 y una bahía de misión a mediabarco para barcos, contenedores y sistemas no tripulados. Ocho barcos escoltarán a los portaaviones y al disuasivo, con cascos adicionales vendidos a Australia y Canadá."
 ENG_type_83_destroyer: "Destructor Tipo 83"
 ENG_type_83_destroyer_desc: "El destructor Tipo 83 es una futura clase de destructores de misiles guiados que se espera que se unan a la flota de la Royal Navy a mediados o finales de la década de 2030. Esta clase propuesta promete capacidades avanzadas y características modernizadas para cumplir con los requisitos navales en evolución. Diseñado para versatilidad y potencia, el destructor Tipo 83 representa un avance pivotal en las capacidades marítimas de la Royal Navy, asegurando la preparación y efectividad en futuros entornos operativos."
 ENG_qinetiq_dragonfire_system: "Sistema QinetiQ Dragonfire"
 ENG_qinetiq_dragonfire_system_desc: "Dragonfire representa una tecnología puntera británica de arma de energía dirigida por láser. Presentado en la conferencia de Equipos de Defensa y Seguridad Internacional en Londres en 2017, está desarrollado por UK Dragonfire, un esfuerzo colaborativo que involucra a MBDA UK, Leonardo UK, QinetiQ y el Laboratorio de Ciencia y Tecnología de Defensa. Como demostrador tecnológico pivotal, Dragonfire se someterá a pruebas rigurosas para evaluar las armas de energía dirigida por láser y sus aplicaciones prospectivas dentro de las Fuerzas Armadas Británicas, marcando un avance significativo en la innovación militar y el desarrollo de capacidades."
 ENG_auxiliary_royal_navy: "Armada Real Auxiliar"
 ENG_auxiliary_royal_navy_desc: "La Armada Real Auxiliar se refiere históricamente a barcos tripulados por civiles que apoyan y complementan las operaciones de la Royal Navy durante tiempos de conflicto o crisis."
 ENG_revitalise_merchant_navy: "Revitalizar la Marina Mercante"
 ENG_revitalise_merchant_navy_desc: "El Imperio Británico se fundó alguna vez en el comercio, y nuestra flota mercante global es nuestra gloria y fundación. Que nuestra flota mercante vuelva a extenderse por todo el mundo."
 ENG_bay_slass_landing_ships: "Buques de Desembarco Clase Bay"
 ENG_bay_slass_landing_ships_desc: "Los buques de desembarco clase Bay son embarcaciones anfibias versátiles diseñadas para respaldar una gran variedad de operaciones militares, incluidas misiones de asistencia humanitaria, socorro en casos de desastre y asalto anfibio. Estos buques cuentan con una amplia cubierta de vuelo y una cubierta de dique para el lanzamiento y la recuperación de lanchas de desembarco y vehículos anfibios."
 ENG_river_class_patrol_boat: "Barco Patrullero Clase River"
 ENG_river_class_patrol_boat_desc: "Los barcos patrulleros de la clase River sirven como versátiles buques de patrulla costera, empleados para la seguridad marítima, protección de fronteras y tareas de aplicación de la ley. Con sus sistemas avanzados de vigilancia y comunicación, estos barcos patrulleros patullan efectivamente las aguas costeras, salvaguardando la integridad territorial y los intereses marítimos. Diseñados para resistencia y flexibilidad, los buques de la clase River desempeñan un papel crítico en la mejora de la seguridad marítima y el cumplimiento de la ley marítima dentro de las aguas del Reino Unido y más allá."
 ENG_point_class_sealift_ships: "Buques de Transporte Marítimo Clase Point"
 ENG_point_class_sealift_ships_desc: "Los buques de transporte marítimo de la clase Point son activos vitales en la flota de la Royal Fleet Auxiliary, diseñados para transportar carga y equipo militar para apoyar operaciones expedicionarias. Estos buques de tipo roll-on/roll-off cuentan con capacidades versátiles de manejo de carga, lo que permite una carga y descarga eficiente de vehículos y suministros en diversos puertos y entornos marítimos. Con su capacidad de elevación estratégica, los buques de la clase Point contribuyen significativamente a las capacidades logísticas del Reino Unido, facilitando el despliegue rápido de fuerzas y equipos militares durante escenarios de tiempo de paz y conflicto."
 ENG_bae_cv90_MkIV: "BAE CV90 Mk IV"
 ENG_bae_cv90_MkIV_desc: "El BAE CV90 Mk IV es una versión mejorada del vehículo de combate de infantería CV90, con tecnología avanzada y mejoras para la guerra moderna. Ofrece mayor movilidad, supervivencia y potencia de fuego, lo que lo convierte en un activo formidable para las unidades de infantería blindada en el campo de batalla."
 ENG_expand_sandhurst_academy: "Expansión de la Academia Sandhurst"
 ENG_expand_sandhurst_academy_desc: "La Academia Militar Real de Sandhurst (RMAS) es una de las instituciones de entrenamiento militar más destacadas del mundo, reconocida por sus programas rigurosos y su compromiso de producir líderes militares excepcionales. Fundada en 1802, RMAS sirve como el principal establecimiento de entrenamiento de oficiales para el Ejército Británico, así como para varios aliados y socios internacionales."
 ENG_soldier_welfare_initiative: "Iniciativa de Bienestar del Soldado"
 ENG_soldier_welfare_initiative_desc: "Al priorizar el bienestar de nuestros soldados y sus familias, esta iniciativa demuestra nuestro compromiso de honrar su servicio y sacrificio al tiempo que fomenta una comunidad militar solidaria y resiliente."
 ENG_mgcs_program: "Programa MGCS"
 ENG_mgcs_program_desc: "El Sistema de Combate Terrestre Principal (MGCS) es un programa de vehículo de combate blindado de próxima generación diseñado para proporcionar capacidades avanzadas a las fuerzas terrestres en escenarios de guerra moderna. Como un esfuerzo colaborativo entre Alemania y Francia, el MGCS tiene como objetivo desarrollar un carro de combate principal versátil y tecnológicamente avanzado que pueda operar eficazmente en diversos entornos de batalla."
 ENG_royal_airforce_modernisation: "Modernización de la Royal Air Force"
 ENG_royal_airforce_modernisation_desc: "A través de la Modernización de la RAF, la Royal Air Force reafirma su compromiso de mantener la superioridad aérea, proyectar poder y salvaguardar los intereses nacionales en un entorno de seguridad global cada vez más complejo y disputado."
 ENG_watchkeeper_wk450: "Watchkeeper WK450"
 ENG_watchkeeper_wk450_desc: "El Watchkeeper WK450 es un sistema aéreo no tripulado avanzado diseñado para operaciones de inteligencia, vigilancia y reconocimiento (ISR). Desarrollado por Thales Group, este UAV de media altitud y larga autonomía (MALE) ofrece una gama de sensores y cámaras sofisticados para vigilancia en tiempo real y adquisición de objetivos. Con sus capacidades de autonomía y vuelo autónomo, el Watchkeeper WK450 proporciona a las fuerzas militares una mayor conciencia situacional y la capacidad de recopilar inteligencia crítica en una variedad de entornos operativos."
 ENG_reaper_purchase: "Compra de Reaper"
 ENG_reaper_purchase_desc: "Las fuerzas militares de todo el mundo han adquirido el MQ-9 Reaper para mejorar sus capacidades de inteligencia, vigilancia y reconocimiento (ISR), así como para realizar ataques de precisión contra objetivos de alto valor. La capacidad del Reaper para permanecer sobre áreas objetivo durante períodos prolongados y su conjunto avanzado de sensores lo convierten en un activo valioso para recopilar inteligencia en tiempo real y proporcionar apoyo a las fuerzas terrestres."
 ENG_missile_development: "Desarrollo de Misiles"
 ENG_missile_development_desc: "Necesitamos modernizar nuestras capacidades de misiles para seguir siendo una fuerza aérea moderna."
 ENG_electronic_warfare_measures: "Medidas de Guerra Electrónica"
 ENG_electronic_warfare_measures_desc: "Necesitamos modernizar nuestra informática para mantenernos seguros contra los ciberataques."
 ENG_nato_joint_airforce_training: "Entrenamiento Conjunto de la Fuerza Aérea de la OTAN"
 ENG_nato_joint_airforce_training_desc: "A través de escenarios simulados, ejercicios en vivo y eventos de entrenamiento conjunto, las fuerzas aéreas participantes desarrollan y perfeccionan sus capacidades en áreas como combate aéreo, operaciones aire-tierra, reabastecimiento en vuelo y defensa aérea. Estas actividades de entrenamiento fomentan la comprensión mutua, la confianza y la cooperación entre las fuerzas aéreas aliadas, asegurando que puedan operar juntos sin problemas en entornos de coalición y responder eficazmente a los desafíos de seguridad regionales y globales."
 ENG_c19_globemasters: "C-17 Globemaster III"
 ENG_c19_globemasters_desc: "El C-17 Globemaster III es un avión de transporte estratégico versátil utilizado por fuerzas aéreas de todo el mundo para misiones de transporte rápido y de largo alcance. Fabricado por Boeing, este avión de transporte pesado es capaz de transportar grandes cargas, incluyendo tropas, vehículos y ayuda humanitaria, a ubicaciones remotas y aeródromos austero. Con su aviónica avanzada, diseño de ala alta y capacidades de despegue y aterrizaje cortos (STOL), el C-17 Globemaster III desempeña un papel crucial en el apoyo a operaciones militares y humanitarias en todo el mundo."
 ENG_airbus_a400m: "Airbus A400M"
 ENG_airbus_a400m_desc: "El Airbus A400M es un avión de transporte militar moderno diseñado para cumplir con los requisitos operativos de varias fuerzas aéreas en todo el mundo. Con una configuración de ala alta y motores turbohélice avanzados, el A400M ofrece un rendimiento excepcional, incluyendo capacidades de despegue y aterrizaje cortos (STOL), capacidades de largo alcance y la capacidad de operar desde aeródromos semi-preparados."
 ENG_nimrod_mra4: "Nimrod MRA4"
 ENG_nimrod_mra4_desc: "El Nimrod MRA4 era una versión modernizada del icónico avión de patrulla marítima Nimrod, destinado a proporcionar capacidades mejoradas para la guerra antisubmarina, la vigilancia marítima y las misiones de búsqueda y rescate. Con sensores avanzados, sistemas de comunicación y equipos de misión, el Nimrod MRA4 ofrecía un rendimiento y versatilidad mejorados en comparación con su predecesor."
 ENG_apache_wah64: "AgustaWestland Apache"
 ENG_apache_wah64_desc: "La adquisición y despliegue del helicóptero AgustaWestland Apache marcó un avance significativo en el arsenal de combate aéreo del Reino Unido. Se realizaron varias alteraciones al diseño estándar del Apache, incluyendo un motor Rolls Royce mejorado, un mecanismo de palas plegables para almacenamiento, protección contra hielo en el rotor y mayor capacidad de cohetes. Introducido para fortalecer las capacidades aéreas de la nación, este sofisticado helicóptero de ataque simboliza un salto adelante en la tecnología de aviación militar y la efectividad operativa estratégica."
 ENG_boeing_p8_poseidon: "Boeing P-8 Poseidon"
 ENG_boeing_p8_poseidon_desc: "El Boeing P-8 Poseidon es un avión de patrulla marítima multiusos diseñado para la guerra antisubmarina de largo alcance, la guerra antisuperficie y las operaciones de inteligencia, vigilancia y reconocimiento. Basado en el avión comercial Boeing 737, el P-8 Poseidon cuenta con sensores avanzados, sistemas de comunicación y capacidades de armas, lo que lo convierte en una plataforma altamente efectiva para misiones de patrulla marítima."
 ENG_revive_p125_project: "Revivir el Proyecto P125"
 ENG_revive_p125_project_desc: "El proyecto revivido P125 busca desarrollar una plataforma aérea versátil y rentable capaz de cumplir una variedad de roles, incluyendo superioridad aérea, apoyo aéreo cercano, reconocimiento y entrenamiento. Al incorporar aviónica, sensores y sistemas de armas de vanguardia, la aeronave modernizada P125 ofrecerá un rendimiento, supervivencia y efectividad de misión mejorados."
 ENG_joint_strike_fighter_project: "Proyecto Caza de Ataque Conjunto"
 ENG_joint_strike_fighter_project_desc: "Con capacidades avanzadas de sigilo, tecnología de fusión de sensores y capacidades de misión multirrol, el F-35 Joint Strike Fighter proporciona una conciencia situacional y letalidad inigualables en operaciones aire-aire y aire-tierra."
 ENG_bae_systems_tempest: "BAE Systems Tempest"
 ENG_bae_systems_tempest_desc: "El BAE Systems Tempest es un concepto de avión de combate de sexta generación de vanguardia diseñado para satisfacer las necesidades cambiantes de la guerra aérea moderna. Con tecnología avanzada de sigilo, capacidades de fusión de sensores y sistemas autónomos, el Tempest está listo para ofrecer un rendimiento, supervivencia y letalidad mejorados en entornos de espacio aéreo disputado."
 ENG_defence_industrial_policy: "Política Industrial de Defensa"
 ENG_defence_industrial_policy_desc: "La Política Industrial de Defensa Británica describe el marco estratégico que guía el desarrollo, gestión y sostenibilidad de la base industrial de defensa de la nación. Con un legado rico en innovación y excelencia, la industria de defensa del Reino Unido desempeña un papel fundamental en el apoyo a los objetivos de seguridad nacional, la promoción de la prosperidad económica y el mantenimiento del liderazgo tecnológico en el escenario global."
 ENG_cayman_enterprise_city: "Ciudad Empresarial de Caimán"
 ENG_cayman_enterprise_city_desc: "La Ciudad Empresarial de Caimán es una zona económica especial en las Islas Caimán, que ofrece una plataforma única para que las empresas internacionales establezcan una presencia física en una jurisdicción fiscalmente neutral. Con procesos simplificados e incentivos, proporciona un entorno propicio para que las empresas en industrias como la tecnología, la biotecnología y los medios de comunicación prosperen y crezcan."
 ENG_illex_fishery: "Pesquería de Illex"
 ENG_illex_fishery_desc: "La pesquería de Illex es una parte vital de la economía de las Islas Malvinas, centrada en la cosecha sostenible de la especie de calamar Illex. Gestionada cuidadosamente para garantizar la viabilidad a largo plazo, la pesquería apoya los medios de vida locales y contribuye a la seguridad alimentaria y la estabilidad económica de la región."
 ENG_north_mole_power_plant: "Central Eléctrica de North Mole"
 ENG_north_mole_power_plant_desc: "Ubicada en Gibraltar, la Central Eléctrica de North Mole desempeña un papel crucial en la satisfacción de las necesidades energéticas del territorio. Equipada con tecnología e infraestructura modernas, proporciona generación de electricidad confiable, apoyando la vida diaria y las actividades económicas de los residentes y empresas de Gibraltar."
 ENG_biras_creek_resort: "Resort de Biras Creek"
 ENG_biras_creek_resort_desc: "Ubicado en las Islas Vírgenes Británicas, el Resort de Biras Creek ofrece un retiro de lujo en medio de una impresionante belleza natural. Conocido por sus playas apartadas, alojamientos de alta gama y servicio personalizado, ofrece un escape idílico para los viajeros que buscan relajación y rejuvenecimiento en un paraíso tropical."
 ENG_bermuda_innovation_sprint: "Sprint de Innovación de Bermudas"
 ENG_bermuda_innovation_sprint_desc: "El Sprint de Innovación de Bermudas es una iniciativa destinada a fomentar la innovación y el emprendimiento en la isla. A través de programas de aceleración, mentoría y oportunidades de financiación, apoya a las nuevas empresas y aventuras tecnológicas en el desarrollo de soluciones innovadoras y el impulso del crecimiento económico en Bermudas."
 ENG_princes_lodge_plantation: "Plantación Princes Lodge"
 ENG_princes_lodge_plantation_desc: "La Plantación Princes Lodge es una finca histórica en Santa Elena, que muestra el rico patrimonio cultural y las tradiciones agrícolas de la isla. Con su entorno pintoresco y su arquitectura colonial preservada, ofrece a los visitantes una visión del pasado de la isla mientras contribuye al turismo cultural y a los esfuerzos de preservación del patrimonio local."
 ENG_beaches_turks_caicos: "Playas de Turcos y Caicos"
 ENG_beaches_turks_caicos_desc: "Beaches Turks y Caicos es un destino turístico de lujo todo incluido, famoso por sus playas prístinas, comodidades de alta gama y ambiente familiar. Ofreciendo una amplia gama de actividades y opciones de entretenimiento, proporciona una experiencia de vacaciones inolvidable para huéspedes de todas las edades en las Islas Turcas y Caicos."
 ENG_little_bay_port_development_project: "Proyecto de Desarrollo del Puerto de Little Bay"
 ENG_little_bay_port_development_project_desc: "El Proyecto de Desarrollo del Puerto de Little Bay tiene como objetivo mejorar la infraestructura y las perspectivas económicas de Montserrat mediante el desarrollo de una instalación portuaria moderna en Little Bay. Con capacidades de transporte y logística mejoradas, busca estimular el comercio, el turismo y las oportunidades de inversión en la isla."
 ENG_pitcairn_islands_study_center: "Centro de Estudio de las Islas Pitcairn"
 ENG_pitcairn_islands_study_center_desc: "El Centro de Estudio de las Islas Pitcairn es una institución de investigación dedicada al estudio y preservación de la historia, cultura y biodiversidad de las Islas Pitcairn. A través de sus archivos, publicaciones y programas educativos, promueve la conciencia y el aprecio por estos territorios remotos y únicos."
 ENG_share_vtol_research: "Compartir Investigación de VTOL"
 ENG_share_vtol_research_desc: "Compartir Investigación de VTOL implica iniciativas de colaboración y compartir conocimientos entre las partes interesadas de la industria e instituciones de investigación para avanzar en la tecnología de despegue y aterrizaje vertical (VTOL)."
 ENG_channel_homegrown_innovation: "Canalizar la Innovación Local"
 ENG_channel_homegrown_innovation_desc: "Al apoyar a las nuevas empresas locales, instituciones de investigación y pequeñas empresas, busca catalizar el desarrollo de tecnologías y soluciones de vanguardia que aborden los desafíos y oportunidades clave de la industria. A través de la colaboración, el apoyo financiero y la construcción de ecosistemas, tiene como objetivo posicionar al Reino Unido como líder mundial en innovación aeronáutica, impulsando el crecimiento económico y la competitividad."
 ENG_revive_british_aviation_industry: "Revitalizar la Industria de Aviación Británica"
 ENG_revive_british_aviation_industry_desc: "Al promover la inversión, la innovación y el desarrollo de habilidades, busca revitalizar las capacidades de producción nacional, mejorar la resiliencia de la cadena de suministro y crear empleos de alta calidad en todo el país."
 ENG_focus_on_component_manufacturing: "Enfoque en la Fabricación de Componentes"
 ENG_focus_on_component_manufacturing_desc: "Al invertir en tecnologías de fabricación avanzadas, capacitación de la fuerza laboral y medidas de resiliencia de la cadena de suministro, tiene como objetivo capturar un mayor valor y competitividad en el mercado aeroespacial global. A través de asociaciones con fabricantes de equipos originales, proveedores de nivel y organizaciones de investigación, busca promover la innovación, la eficiencia y la calidad en todo el ecosistema de componentes aeroespaciales."
 ENG_us_uk_collaboration: "Colaboración EE.UU.-Reino Unido"
 ENG_us_uk_collaboration_desc: "Estados Unidos siempre está en busca de buenos socios. Al adoptar los proyectos de aviación británicos, podríamos trabajar juntos para recibir más financiación y darles parte de nuestra innovación."
 ENG_skylon_engine: "Motor Skylon"
 ENG_skylon_engine_desc: "El Motor Skylon representa un esfuerzo innovador en la industria aeroespacial del Reino Unido, centrado en el desarrollo de sistemas de propulsión de próxima generación. A través de la ingeniería avanzada, la ciencia de materiales y la modelación computacional, esta iniciativa tiene como objetivo diseñar y fabricar motores a reacción de alto rendimiento que ofrezcan una eficiencia, confiabilidad y sostenibilidad excepcionales."
 ENG_rebirthing_black_arrow: "Renacer del Black Arrow"
 ENG_rebirthing_black_arrow_desc: "El Renacer del Black Arrow conmemora el legado del programa Black Arrow, un proyecto histórico británico de vehículo de lanzamiento espacial. Esta iniciativa tiene como objetivo revitalizar y modernizar el espíritu de la exploración espacial en el Reino Unido mediante el desarrollo de capacidades de lanzamiento avanzadas y tecnologías de satélites."
 ENG_lightweight_fire_platform_artillery: "Artillería de Plataforma de Fuego Ligera"
 ENG_lightweight_fire_platform_artillery_desc: "El proyecto de Artillería de Plataforma de Fuego Ligera tiene como objetivo desarrollar e implementar un sistema de artillería versátil y móvil optimizado para un despliegue rápido y apoyo de potencia de fuego de precisión. Al aprovechar materiales ligeros, principios de diseño modular y sistemas avanzados de control de fuego, esta iniciativa busca mejorar la agilidad, capacidad de respuesta y letalidad de las unidades de artillería en diversos entornos operativos."
 ENG_harpoon_replacement: "Reemplazo del Harpoon"
 ENG_harpoon_replacement_desc: "El programa de Reemplazo del Harpoon se centra en desarrollar un sistema de misiles antibuque de próxima generación para reemplazar los misiles Harpoon envejecidos en el arsenal militar británico. Al aprovechar tecnologías avanzadas de guía, propulsión y orientación, esta iniciativa tiene como objetivo proporcionar a las fuerzas navales un mayor alcance, precisión y letalidad contra amenazas de superficie en entornos marítimos."
 ENG_codify_service_economy: "Codificar la Economía Basada en Servicios"
 ENG_codify_service_economy_desc: "Durante décadas, Gran Bretaña ha derivado hacia un modelo basado en servicios. Las finanzas, la consultoría y los medios llenan el vacío dejado por las fábricas cerradas. Es hora de hacer de esta deriva una estrategia explícita."
 ENG_gate_burton_energy: "Construir el Parque Energético de Gate Burton"
 ENG_gate_burton_energy_desc: "El Parque Energético de Gate Burton convertirá tierras de cultivo cerca de Gate Burton, en Lincolnshire, en un importante sitio solar y de baterías, alimentando energía limpia a la Red Nacional y ayudando a reemplazar la generación de carbón y gas envejecida."
 ENG_gate_burton_energy_tt: "¡Añadir §G1§! §YParque de Baterías§!"
 ENG_ai_white_collar: "IA para Trabajo de Cuello Blanco"
 ENG_ai_white_collar_desc: "Desde bufetes de abogados hasta firmas de contabilidad, los sistemas de IA comienzan a manejar el análisis rutinario y el trabajo documental. Los empleos desaparecen, los márgenes aumentan."
 ENG_empower_city_london: "Fortalecer la Ciudad de Londres"
 ENG_empower_city_london_desc: "Al flexibilizar las normas de planificación y respaldar nuevas torres en la Milla Cuadrada, fomentamos que los bancos y las empresas de servicios amplíen su presencia. El nuevo espacio de oficinas de categoría A en la Ciudad crecerá más rápido, afianzando el papel de Londres como centro financiero global."
 ENG_empower_edinburgh: "Fortalecer el Distrito Financiero de Edimburgo"
 ENG_empower_edinburgh_desc: "Al respaldar nuevas oficinas de categoría A y la infraestructura alrededor de New Town y el distrito de Exchange, ayudamos a los bancos y gestores de activos de Edimburgo a expandir su presencia, fortaleciendo el segundo centro financiero del Reino Unido fuera de Londres."
 ENG_found_invest_northern_ireland: "Fundar Invertir en Irlanda del Norte"
 ENG_found_invest_northern_ireland_desc: "Establecemos Invertir en Irlanda del Norte para promocionar la región en el extranjero y atraer un flujo constante de nuevas fábricas, oficinas y astilleros."
 ENG_digital_government: "Reforma Digital del Gobierno"
 ENG_digital_government_desc: "Digitalizamos los servicios públicos, la recaudación de impuestos, las licencias y los beneficios, reduciendo el papeleo y los costos."
 ENG_invest_silicon_glenn: "Invertir en Silicon Glen"
 ENG_invest_silicon_glenn_desc: "Canalizamos fondos hacia Silicon Glen en Escocia, expandiendo laboratorios y parques tecnológicos para acelerar la investigación en computación, internet y inteligencia artificial."
 ENG_cross_border_cooperation: "Cooperación Transfronteriza"
 ENG_cross_border_cooperation_desc: "Profundizamos la cooperación práctica entre Irlanda del Norte e Irlanda, reduciendo la burocracia y aumentando el comercio y la influencia transfronterizos."
 ENG_national_data_infrastructure: "Infraestructura Nacional de Datos"
 ENG_national_data_infrastructure_desc: "Implementamos fibra óptica, centros de datos y redes troncales a nivel nacional para acelerar las conexiones digitales, extender el alcance del suministro y mejorar la productividad en toda la economía."
 ENG_admiral_group: "Asociarse con Admiral Group"
 ENG_admiral_group_desc: "Trabajamos con Admiral Group en Cardiff para expandir la cobertura de seguros privados, aliviando la presión sobre los presupuestos de bienestar y atención médica."
 ENG_fintech_open_banking: "Centro de Fintech y Banca Abierta"
 ENG_fintech_open_banking_desc: "Convertimos al Reino Unido en un centro líder de fintech y banca abierta, aumentando los ingresos fiscales corporativos al tiempo que reducimos el costo de los préstamos gubernamentales."
 ENG_global_consulting_state: "Estado de Consultoría Global"
 ENG_global_consulting_state_desc: "Apoyamos a las consultorías y firmas de abogados británicas en todo el mundo, extendiendo nuestra influencia, profundizando los vínculos de investigación y atrayendo más inversión extranjera."
 ENG_lean_manufacturing: "Fabricación Ágil"
 ENG_lean_manufacturing_desc: "Al implementar robótica, sensores y flujos de trabajo just-in-time en nuestras plantas, reemplazamos el trabajo rutinario con líneas automatizadas. Las fábricas consumen más energía pero usan menos trabajadores, mientras que la producción y la eficiencia aumentan con cada serie de producción."
 ENG_cloud_isles: "Islas de la Nube"
 ENG_cloud_isles_desc: "Convertimos a Gran Bretaña en un centro para vastos centros de datos y campus en la nube. Las oficinas consumen más energía para alimentar granjas de servidores, pero los servicios digitales que albergan generan mayores ingresos fiscales y avances en investigación más rápidos."
 ENG_algorithmic_finance: "Finanzas Algorítmicas"
 ENG_algorithmic_finance_desc: "Implementamos motores de riesgo avanzados y sistemas de tesorería automatizados para gestionar flujos de efectivo, deuda y pagos, reduciendo la burocracia y los costos operativos del gobierno."
 ENG_invest_harland_wolff: "Invertir en Harland & Wolff"
 ENG_invest_harland_wolff_desc: "Invertimos nuevo capital en los astilleros de Harland & Wolff en Belfast y más allá, reabriendo gradas, contratan trabajadores cualificados y aumentando la producción de nuestros astilleros."
 ENG_critical_minerals_strategy: "Estrategia de Minerales Críticos"
 ENG_critical_minerals_strategy_desc: "Lanzamos una estrategia nacional de minerales críticos, respaldando nuevos proyectos en Cornualles, Gales y más allá para asegurar minerales clave y mejorar el acceso de Gran Bretaña a recursos vitales."
 ENG_dogger_bank_offshore: "Centro Energético Offshore de Dogger Bank"
 ENG_dogger_bank_offshore_desc: "Apoyamos el complejo eólico offshore de Dogger Bank en el Mar del Norte, construyendo el parque eólico más grande del mundo para proporcionar energía limpia a millones de hogares británicos."
 ENG_hinkley_point_c: "Completar Hinkley Point C"
 ENG_hinkley_point_c_desc: "Avanzamos con el proyecto de doble reactor de Hinkley Point C en Somerset, añadiendo más de 3 GW de energía de carga base a largo plazo y baja en carbono a la red."
 ENG_acknowledge_industrial_collapse: "Reconocer el Colapso Industrial"
 ENG_acknowledge_industrial_collapse_desc: "Desde Redcar en Teesside hasta Port Talbot en el sur de Gales, los altos hornos se han enfriado y comunidades enteras han perdido su columna vertebral industrial. Debemos admitir finalmente cuánto ha caído la industria pesada de Gran Bretaña antes de poder reconstruirla."
 ENG_building_brittain_fit_future: "Construir una Gran Bretaña Preparada para el Futuro"
 ENG_building_brittain_fit_future_desc: "Lanzamos una estrategia industrial a largo plazo para impulsar la productividad y el poder adquisitivo, invirtiendo en ideas, personas, infraestructura y lugares en todo el Reino Unido."
 ENG_northern_powerhouse: "Potencia del Norte y Motor de las Midlands"
 ENG_northern_powerhouse_desc: "Vinculamos la Potencia del Norte y el Motor de las Midlands en un solo corredor de crecimiento, respaldando el transporte, las habilidades y la inversión empresarial para elevar la productividad desde Liverpool y Mánchester hasta Birmingham y las Midlands Orientales."
 ENG_aerospace_wales: "Aeroespacial de Gales"
 ENG_aerospace_wales_desc: "Apoyamos el grupo aeroespacial de Gales alrededor de Airbus Broughton, St Athan y el centro de MRO, impulsando la producción local de alas, el trabajo de reparación y los empleos de alta tecnología en aviación."
 ENG_marine_power_systems: "Sistemas de Energía Marina"
 ENG_marine_power_systems_desc: "Apoyamos a Marine Power Systems, con sede en Gales, para escalar plataformas de energía eólica y undimotriz flotantes, convirtiendo los astilleros y puertos locales en centros de energía marina de próxima generación."
 ENG_develop_edinburgh_west_end: "Desarrollar el West End de Edimburgo"
 ENG_develop_edinburgh_west_end_desc: "Modernizamos el distrito de Exchange en el West End para convertirlo en una mezcla más densa de oficinas, laboratorios y talleres modernos, impulsando la producción local de investigación y la eficiencia de la producción, al tiempo que añadimos nuevo espacio para que nuestras facciones líderes se expandan."
 ENG_develop_bae_aerospace: "Desarrollar BAE Aeroespacial en Escocia"
 ENG_develop_bae_aerospace_desc: "Expandimos la huella aeroespacial de BAE alrededor de Prestwick y otros sitios escoceses, añadiendo nuevos hangares, talleres y equipos de ingeniería para apoyar aviones de combate avanzados y programas futuros."
 ENG_glasgow_shipbuilidng: "Centro de Construcción naval de Glasgow"
 ENG_glasgow_shipbuilidng_desc: "Modernizaremos los astilleros del Clyde en Govan y Scotstoun, convirtiendo a Glasgow en un centro neurálgico a largo plazo para la construcción de buques militares y la exportación naval."
 ENG_high_value_manufacturing_zones: "Zonas de Fabricación de Alto Valor"
 ENG_high_value_manufacturing_zones_desc: "Designamos zonas de fabricación de alto valor alrededor de centros al estilo Catapult y parques científicos, dando a las empresas un acceso más rápido a laboratorios, habilidades e instalaciones modernas para elevar la productividad y la producción avanzada."
 ENG_high_value_manufacturing_zones_tt: "Si un estado tiene §G5§! §Y$infrastructure$§!, al menos §G10§! §Y$industrial_complex$§!, al menos §G5§! §Y$offices$§!, al menos §G5§! §Y$arms_factory$§! O §G5§! §Y$dockyard$§!, agregaremos por estado:"
 ENG_steel_guarantee: "Garantía del Acero"
 ENG_steel_guarantee_desc: "Nos comprometemos a financiar a largo plazo y garantizar proyectos de acero de baja emisión de carbono, dando a los inversores la confianza para modernizar las plantas y asegurar la producción nacional de acero durante décadas."
 ENG_steel_guarantee_tt: "§Y[10.GetName],[11.GetName],[12.GetName]§! o §Y[1191.GetName]§! obtendrán:\nMás de §Y4 $industrial_complex$§!: §G+6§! §Y$country_resource_steel$§!.\nMás de §Y4 $offices$§!: §G+3§! §Y$country_resource_tungsten$§!.\nCualquier §YInstalación§! y §Y$sp_improved_synthetic_diamonds$§! completada: un adicional §G+3§! §Y$country_resource_chromium$§!."
 ENG_celsa_steel: "Apoyar a Celsa Steel Cardiff"
 ENG_celsa_steel_desc: "Apoyamos los altos hornos de arco eléctrico y el molino de barras de Celsa en Cardiff, aumentando la producción de acero de baja emisión de carbono y alambrón, mientras mantenemos un gran reciclador y empleador galés funcionando a toda capacidad."
 ENG_expand_scottish_steel: "Expandir el Acero Escocés"
 ENG_expand_scottish_steel_desc: "Invertimos en las plantas de Dalzell y Clydebridge para reiniciar la producción de placas, asegurar el acero escocés para barcos de guerra y energía eólica marina, y hacer crecer una base moderna de acero pesado al norte de la frontera."
 ENG_refine_natural_bauxite: "Refinar Bauxita Natural"
 ENG_refine_natural_bauxite_desc: "Construimos instalaciones de alúmina alrededor de Edimburgo para refinar la bauxita importada en materia prima de alta calidad, impulsando la producción nacional de aluminio de Escocia."
 ENG_deep_mining_coal: "Revivir la Minería Profunda de Carbón en Escocia"
 ENG_deep_mining_coal_desc: "Reabrimos vetas profundas en los antiguos campos de carbón de Escocia, hundiendo nuevos pozos y reconstruyendo la infraestructura de las minas para restaurar la producción subterránea de carbón al norte de la frontera."
 ENG_opencast_mining: "Expandir la Minería a Cielo Abierto en Escocia"
 ENG_opencast_mining_desc: "Otorgamos licencias para nuevos sitios a cielo abierto en los campos de carbón de Escocia, extrayendo el recubrimiento para alcanzar vetas poco profundas y aumentar los suministro nacionales de carbón."
 ENG_cononish_gold_silver: "Minas de Oro y Plata de Cononish"
 ENG_cononish_gold_silver_desc: "Apoyamos la mina de Cononish cerca de Tyndrum, convirtiendo el único depósito comercial de oro y plata de Escocia en una fuente constante de metales preciosos para la nación."
 ENG_national_productivity_commission: "Comisión Nacional de Productividad"
 ENG_national_productivity_commission_desc: "Establecemos una Comisión Nacional de Productividad para alinear la inversión, la infraestructura y las políticas de innovación en torno a una misión: elevar la productividad en todo el Reino Unido."
 ENG_infrastructure_for_productivty: "Estrategia de Infraestructura nacional"
 ENG_infrastructure_for_productivty_desc: "Implementaremos una Estrategia de infraestructura nacional orientada a carreteras, ferrocarriles y redes digitales que impulse la productividad en lugar de frenarla."
 ENG_universaties_engines_of_growth: "Fondo de Fortaleza Regional"
 ENG_universaties_engines_of_growth_desc: "Pondremos en marcha un fondo al estilo de 'Fortaleza regional', respaldando asociaciones entre universidades y empresas en toda Inglaterra para transformar el potencial de la investigación local en empleo, inversión y crecimiento."
 ENG_hs2: "Lanzar High Speed 2"
 ENG_hs2_desc: "Damos luz verde al High Speed 2, autorizando la primera fase entre Londres y las Midlands y comprometiéndonos a décadas de inversión en nuevos ferrocarriles de alta velocidad."
 ENG_northern_powerhouse_rail: "Ferrocarril de la Potencia del Norte"
 ENG_northern_powerhouse_rail_desc: "Nos comprometemos con el Ferrocarril de la Potencia del Norte, una nueva red este-oeste mejorada que conecta Liverpool, Mánchester, Leeds y el norte en general con trenes más rápidos, frecuentes y mayor capacidad para pasajeros y carga."
 ENG_euston_canary_wharf_integration: "Integración de Euston y Canary Wharf"
 ENG_euston_canary_wharf_integration_desc: "Integramos la terminal HS2 en Euston con la red ferroviaria y de metro este-oeste de Londres, creando enlaces fluidos con la City y Canary Wharf para que los pasajeros de alta velocidad puedan llegar a los distritos financieros de la capital en minutos."
 ENG_midland_main_lines: "Modernización de la Línea Principal de las Midlands"
 ENG_midland_main_lines_desc: "Avanzamos con la modernización y electrificación de la Línea Principal de las Midlands entre Londres y las Midlands Orientales, reduciendo los tiempos de viaje y liberando capacidad para pasajeros y carga."
 ENG_russel_group: "Universidades del Grupo Russell"
 ENG_russel_group_desc: "Estrecharemos los lazos con las universidades de investigación intensiva del Grupo Russell, respaldando proyectos conjuntos que transformen la ciencia puntera a nivel mundial en crecimiento para todo el país."
 ENG_golden_triangle_research: "Arco de Investigación del Triángulo Dorado"
 ENG_golden_triangle_research_desc: "Profundizamos los vínculos entre las universidades líderes de Oxford, Cambridge y Londres, construyendo un arco de investigación del Triángulo Dorado que concentre laboratorios de clase mundial, talento y financiación en un solo corredor de innovación de alto impacto."
 ENG_imperial_king_tech_clusters: "Clústeres Tecnológicos del Imperial y el King's"
 ENG_imperial_king_tech_clusters_desc: "Conectaremos el campus de innovación de White City del Imperial con los centros tecnológicos y de salud del King's, construyendo clústeres densos donde laboratorios, empresas emergentes e inversores puedan transformar la investigación de vanguardia en avances comerciales."
 ENG_skill_england_technical: "Skills England y Trayectorias Técnicas"
 ENG_skill_england_technical_desc: "Colaboraremos con Skills England para identificar las carencias de cualificación y ampliar las vías técnicas y los programas de aprendizaje, ofreciendo a más personas trayectorias claras y de alta calidad hacia el empleo cualificado."
 ENG_closing_britains_productivity_gap: "Cerrar la Brecha de Productividad de Gran Bretaña"
 ENG_closing_britains_productivity_gap_desc: "Después de años de inversión dirigida en infraestructura, universidades y habilidades, nuestra brecha de productividad finalmente comienza a cerrarse, elevando la producción por trabajador y dando a la economía espacio para salarios más altos y mejores servicios."
 ENG_closing_britains_productivity_gap_tt: "Podemos revertir la penalización de productividad investigando §Y$CAT_infrastructure$§!"
 ENG_ambitions_for_britain: "Ambiciones para Gran Bretaña"
 ENG_ambitions_for_britain_desc: "Gran Bretaña no puede quedarse a la zaga mientras el tiempo avanza. Gran Bretaña debe ser ambiciosa, y para eso, el pueblo británico necesita al Partido Laborista. A través de la determinación, el Partido Laborista catapultará al Reino Unido para convertirlo en uno de los actores globales más grandes de nuestra era. El nuevo milenio será nuestro."
 ENG_deeper_prosperity: "Prosperidad Más Profunda"
 ENG_deeper_prosperity_desc: "Lograremos una prosperidad más profunda creando más empleos e incentivando a nuestro pueblo a buscar oportunidades laborales. Esto solo podría lograrse creando un entorno sostenible, especialmente a través de una infraestructura adecuada."
 ENG_every_region_of_the_country: "Cada Región del País"
 ENG_every_region_of_the_country_desc: "Nuestros esfuerzos no se limitarán a los principales centros de la sociedad; no, priorizarán cada región del país. Somos una unión, después de todo. Sin una distribución equitativa de los recursos, el estado se fracturará y creará desigualdades para grandes poblaciones urbanas y rurales."
 ENG_the_foundation: "La Base"
 ENG_the_foundation_desc: "La base, el pilar y la columna vertebral de este país es el trabajador que pasa innumerables horas al servicio de su país. Iniciar reformas para permitir más flexibilidad en el lugar de trabajo en cuanto a vacaciones, tiempo libre y licencia por enfermedad será un cambio importante para mantener fuerte este pilar de la sociedad."
 ENG_nhs_reform: "Reforma del NHS"
 ENG_nhs_reform_desc: "El Servicio Nacional de Salud necesita desesperadamente una reforma. No solo un cambio superficial donde pidamos la construcción de nuevos hospitales e instalaciones médicas; no, en cambio, impulsaremos la sincronización de los sectores público y privado para mejorar el NHS, de modo que podamos reducir los tiempos de espera, modernizar nuestras instalaciones existentes y atender a más pacientes de manera más oportuna."
 ENG_reinassaince_of_status: "Renacimiento del Estatus"
 ENG_reinassaince_of_status_desc: "Nuestro pueblo debe ser capaz de ascender en la escala social y progresar económicamente. Por lo tanto, debemos intervenir en una etapa temprana de sus vidas. Al otorgar a los centros de educación superior las herramientas necesarias que requieren, seremos capaces de poner a disposición de nuestra gente, con mayor facilidad, los recursos que necesitan para progresar en la sociedad."
 ENG_a_grand_promise: "Una Gran Promesa"
 ENG_a_grand_promise_desc: "Para mantener el apoyo a nuestro partido, necesitaremos hacer una gran promesa que cautive a nuestros constituyentes. Al cumplir esta promesa, podremos consolidar la credibilidad de nuestra coalición y asestar un golpe mayor a nuestra oposición."
 ENG_more_frontline_staff: "Más Personal de Primera Línea"
 ENG_more_frontline_staff_desc: "Necesitamos fomentar la productividad agrícola animando a más personal de primera línea a incorporarse al lugar de trabajo. A través de programas de incentivos, podremos reconstruir el espíritu agrícola decadente de nuestro país."
 ENG_foster_the_tech_revolution: "Fomentar la Revolución del Silicio"
 ENG_foster_the_tech_revolution_desc: "Una nueva revolución se está desarrollando ante nuestros ojos: la revolución del silicio. A través de la tecnología, las economías globales están comenzando a cambiar de maneras nunca antes vistas. Sociedades rurales y agrícolas han comenzado a transformarse en algunas de las economías más formidables a través de microchips y otros dispositivos electrónicos. Nosotros también debemos comenzar a capitalizar esta nueva tendencia lo antes posible."
 ENG_uplift_traditional_industry: "Impulsar la Industria Tradicional"
 ENG_uplift_traditional_industry_desc: "No necesitamos la moda electrónica que tanto ha cautivado al mundo. En cambio, podemos enfocarnos en lo que sabemos que ha funcionado históricamente: la industria pesada. ¿Por qué debemos tomar riesgos en cosas tan meniales que podrían poner en peligro nuestra economía?"
 ENG_prioritize_the_teachers: "Priorizar a los Educadores"
 ENG_prioritize_the_teachers_desc: "Reconocer el papel de los educadores en la sociedad tendrá beneficios enormes que resonarán en toda la nación y la región. Al establecer su papel en la vida de los civiles británicos cotidianos, la gente finalmente comenzará a apreciar la educación por lo que realmente es."
 ENG_prioritize_the_doctors: "Priorizar a los Médicos"
 ENG_prioritize_the_doctors_desc: "Los médicos son los que evitan que la gente muera, son los que evitan la propagación de enfermedades y son los que mantienen un sentido más amplio de seguridad en nuestro país. Al ayudar a avanzar el papel de los médicos y el personal médico, también podremos animar a más personas a llenar los roles del NHS que están gravemente faltos de personal."
 ENG_strengthening_communities: "Fortalecer las Comunidades"
 ENG_strengthening_communities_desc: "Fortalecer las comunidades y, por extensión, la identidad británica nos permitirá fomentar un mayor sentido de unidad nacional. Esto nos permitirá proteger los valores que más queremos, al tiempo que creamos cohesión social de manera más eficiente."
 ENG_to_europa_and_beyond: "¡Hacia Europa y Más Allá!"
 ENG_to_europa_and_beyond_desc: "Somos europeos primero, británicos segundo. Olvidar nuestro hogar regional es olvidar quiénes somos. Debemos buscar una integración más profunda con el continente europeo y la Unión Europea en su conjunto para respaldar la visión más grande de todos los pueblos europeos."
 ENG_no_one_left_behind: "Que Nadie se Quede Atrás"
 ENG_no_one_left_behind_desc: "Ningún británico se quedará atrás en nuestra carrera hacia la grandeza. Todos serán ayudados y llevados a la línea de meta de la sociedad, y juntos superaremos esta gran lucha hacia el éxito."
 ENG_criminal_justice_reform: "Reforma de la Justicia Penal"
 ENG_criminal_justice_reform_desc: "Fortalecer nuestro sistema de justicia también fortalecerá a su vez nuestras normas democráticas de larga data. Al agilizar el proceso judicial, la fe en nuestras instituciones democráticas también aumentará, y es más probable que se establezca el apoyo a largo plazo para el gobierno."
 ENG_welfare_reform: "Reforma del Bienestar"
 ENG_welfare_reform_desc: "Establecer una relación creíble con nuestros constituyentes solo podría lograrse mediante la reforma de nuestro sistema de bienestar. Al demostrar que nos importa su vida diaria, podremos darles una docena de razones por las cuales deberían seguir votando por nosotros para mantenernos en el cargo."
 ENG_tax_reform: "Reformas Fiscales"
 ENG_tax_reform_desc: "§R'¿Esperar... ¿dónde está mi dinero?'§!\n\nAl aprobar reformas fiscales, no solo podremos fortalecer nuestra economía y tesorería, sino que también avanzaremos hacia la financiación de nuestros programas de reforma social. Aunque podría ser un poco impopular entre aquellos que serán gravados."
 ENG_productivity_challenge: "El Desafío de la Productividad"
 ENG_productivity_challenge_desc: "Nos resulta cada vez más difícil conseguir que algunos de nuestros trabajadores... trabajen. Al impulsar algunos cambios, podríamos animarlos a hacer algo productivo una vez más."
 ENG_britain_forward_not_back: "Gran Bretaña Hacia Adelante, No Hacia Atrás"
 ENG_britain_forward_not_back_desc: "Solo necesitamos mirar hacia adelante para ver hacia dónde nos dirigimos, y si no tomamos las riendas de nuestro futuro, entonces nuestro destino estará en manos del azar. No queremos eso. Queremos guiar a nuestro país hacia la grandeza, y eso solo puede lograrse estableciendo lo que debemos hacer primero para llegar allí."
 ENG_competition_planning_and_regulation: "Planificación de la Competencia y Regulación"
 ENG_competition_planning_and_regulation_desc: "No podemos tener competencia sin regulación. Sin los límites adecuados, las corporaciones se saldrán de control y absorberán a las empresas más pequeñas, eliminando esencialmente los ingresos de miles, si no millones."
 ENG_new_rights_new_choices: "Nuevos Derechos, Nuevas Opciones"
 ENG_new_rights_new_choices_desc: "Al dar a nuestro pueblo más derechos en cuanto a cuándo quieren trabajar, podremos impulsar la productividad a nivel nacional. Actualmente, ciertos lugares de trabajo restringen el acceso a aquellos que no están por encima de la edad de jubilación, y aquellos que lo están están siendo lentamente expulsados. Al dar a aquellos que están por encima del umbral de jubilación la capacidad de trabajar nuevamente, traeremos una mayor estabilidad económica."
 ENG_supporting_science: "Apoyar la Ciencia"
 ENG_supporting_science_desc: "A través del apoyo a nuevos métodos de excavación científica, podremos aumentar nuestra capacidad de suministrar programas de investigación nacionales y aumentar nuestra capacidad de exportar más bienes en el escenario internacional."
 ENG_codify_key_of_convetions: "Codificar la Clave de las Convenciones"
 ENG_codify_key_of_convetions_desc: "Al codificar finalmente la Clave de las Convenciones, transformaremos por fin las normas políticas en normas jurídicas. Nuestra política ya no estará dictada por la tradición, sino por la ley, y a través de esto seremos capaces de impulsar nuestro avance hacia una democracia mejor."
 ENG_generations_of_tomorrow: "Las Generaciones del Mañana"
 ENG_generations_of_tomorrow_desc: "Reformar el sistema de pensiones finalmente nos permitirá establecer una red de seguridad concreta para nuestras generaciones actuales y futuras. Actualmente, muchos reciben una asignación demasiado baja o ninguna, y es hora de que hagamos algo al respecto."
 ENG_fostering_entrepreneurship: "Fomentar el Emprendimiento"
 ENG_fostering_entrepreneurship_desc: "Queremos que los innovadores inunden nuestro país, y para hacerlo, necesitamos comenzar a asignar algunos fondos gubernamentales para lograr un entorno sostenible para aquellos dispuestos a invertir."
 ENG_modern_transport_infrastructure: "Modernización de la Infraestructura de Transporte"
 ENG_modern_transport_infrastructure_desc: "Si nuestras carreteras están todas desordenadas y rotas, ¿de qué sirve conducir? Invertir en programas de infraestructura nuevos e innovadores allanará el camino hacia una Gran Bretaña mejor y más funcional."
 ENG_thriving_rural_scene: "Una Escena Rural Próspera"
 ENG_thriving_rural_scene_desc: "Nuestros asentamientos rurales no pueden ser dejados a merced de la historia y olvidados. En su lugar, abrazaremos estas áreas rurales y fomentaremos aún más sus actividades."
 ENG_scraping_the_skies: "Raspar el Cielo"
 ENG_scraping_the_skies_desc: "Si queremos construir nuestra imagen en el escenario internacional, vamos a necesitar algunas torres, específicamente torres que dejen al mundo asombrado por su magnificencia."
 ENG_creative_cities: "Ciudades Creativas"
 ENG_creative_cities_desc: "Al fomentar las influencias culturales para diseñar nuevas ubicaciones urbanas, crearemos las condiciones perfectas para fortalecer el espíritu y la moral de nuestro pueblo, sin importar a dónde vayan."
 ENG_party_of_pensior_poverty: "El Partido de la Pobreza de los Pensionistas"
 ENG_party_of_pensior_poverty_desc: "Los Conservadores, los Tories, o el 'Partido de la Pobreza de los Jubilados' como nos gusta llamarlos, están degradando la integridad de nuestro sector de bienestar y arruinando activamente los medios de vida de aquellos que dependen de las pensiones para sobrevivir. Debemos dar un paso para asegurarnos de que la gente sea consciente de sus prácticas retrógradas."
 ENG_fostering_home_ownership: "Fomentar la Propiedad de Vivienda"
 ENG_fostering_home_ownership_desc: "En lugar de incentivar a la gente a vivir de fondos gubernamentales, los ayudaremos a adquirir viviendas para ellos y sus seres queridos. De esa manera, podrán descansar tranquilos sabiendo que no están viviendo en un terreno que no es suyo."
 ENG_social_housing: "Programas de Vivienda Social"
 ENG_social_housing_desc: "Seamos realistas, los precios de las viviendas están comenzando a dispararse y no hay señales de que vayan a detenerse. Debemos impulsar programas de vivienda social que proporcionarán a nuestros constituyentes un techo sobre sus cabezas y protección contra los elementos de la naturaleza."
 ENG_copyright_in_a_digital_age: "Derechos de Autor en la Era Digital"
 ENG_copyright_in_a_digital_age_desc: "Nuestras leyes de derechos de autor actualmente no están donde deberían estar, con muchas cláusulas que se han omitido o dejado sin clarificar. Debemos codificar nuestras regulaciones y otorgar más protección a los medios."
 ENG_strengthening_our_grids: "Fortalecer Nuestras Redes"
 ENG_strengthening_our_grids_desc: "Nuestra gente necesita energía fuerte, confiable y constante para llevar a cabo sus días. Un corte aleatorio de vez en cuando es inevitable, pero no debería ser parte de la vida diaria. Al fortalecer nuestras redes principales, aseguraremos la confiabilidad de nuestro sector energético."
 ENG_strengthen_pension_credit: "Fortalecer el Crédito de Pensiones"
 ENG_strengthen_pension_credit_desc: "Al proporcionar una opción de beneficio gubernamental a las personas mayores de la edad de jubilación estatal que tienen bajos ingresos, podremos aumentar sus ingresos semanales a un nivel mínimo y ayudar con los costos de vivienda y otros gastos."
 ENG_the_workers_of_yesterday: "Los Trabajadores de Ayer"
 ENG_the_workers_of_yesterday_desc: "No podemos dejar que el trabajo de ayer se desperdicie; aumentaremos los programas de pensiones para aquellos que están jubilados e incluso podríamos ofrecer más beneficios si deciden transmitir su experiencia a las nuevas generaciones."
 ENG_tenant_regulation: "Regulaciones para Inquilinos"
 ENG_tenant_regulation_desc: "No debemos abandonar a los dueños de viviendas que alquilan propiedades para que otros las alquilen. Las propiedades deben ser respetadas, y por lo tanto, las regulaciones son un factor necesario para asegurar que todos estén contentos."
 ENG_a_future_fair_for_all: "Un Futuro Justo para Todos"
 ENG_a_future_fair_for_all_desc: "Parece que, a medida que el mundo evoluciona, las condiciones de vida de las personas continúan empeorando. Tras la emoción que siguió al amanecer del nuevo milenio, la esperanza llenó a la gente del mundo de creer que sus gobiernos finalmente cambiarían sus formas para mejor. Sin embargo, ese no fue el caso. El retroceso democrático, los costos crecientes y el caos general han llevado al mundo fuera de su camino. Debemos hacer todo lo que esté a nuestro alcance para asegurarnos de que el Reino Unido no caiga en esta espiral de muerte."
 ENG_crime_and_immigration: "Crimen e Inmigración"
 ENG_crime_and_immigration_desc: "Ha habido llamadas para aumentar las restricciones a los migrantes por parte de aquellos en la derecha. Si bien podemos ver de dónde vienen, ceder a sus demandas significaría alejarnos más de los principios centrales de nuestro partido y movernos en una dirección más conservadora."
 ENG_democratic_reform: "Promover la Reforma Democrática"
 ENG_democratic_reform_desc: "Actualmente, existen ciertos vacíos legales que permiten que se tomen decisiones más autocráticas a nivel estatal. Es hora de que tomemos las riendas y finalmente presentemos un proyecto de ley en el parlamento que obligue a aquellos que se benefician de esta ambigüedad política."
 ENG_a_global_future: "Un Futuro Global"
 ENG_a_global_future_desc: "No podemos enfocarnos únicamente en los asuntos del estado; debemos también mostrar atención a los asuntos globales. Con la soberanía de otros estados tenida en cuenta, buscaremos extender la influencia [adjetivo del Reino Unido] en todo el mundo."
 ENG_national_renewal: "Renovación Nacional"
 ENG_national_renewal_desc: "La reorientación de la política [adjetivo del Reino Unido] ha llevado a un movimiento de renovación nacional, donde las personas continúan demandando cambio. No nos detendremos ni descansaremos, y continuaremos entregando cambio. Bueno, por supuesto."
 ENG_with_open_arms: "Con los Brazos Abiertos"
 ENG_with_open_arms_desc: "Debemos reconocer la importancia de los migrantes. Ya sea que lo hagamos con los brazos abiertos o no, si seguimos alejándolos, nos perderemos un talento serio que de otra manera no adquiriríamos."
 ENG_community_payback: "Programa de Devolución a la Comunidad"
 ENG_community_payback_desc: "El programa de devolución a la comunidad tendrá como objetivo permitir que las comunidades determinen cómo deben ser castigados los criminales. Esto puede ser desde tiempo cumplido hasta el tipo de servicio comunitario. Todo estará a cargo de las comunidades locales, pero toda la nación se beneficiará de ello."
 ENG_checks_on_migration: "Controles sobre la Migración"
 ENG_checks_on_migration_desc: "No importa cuánto necesitemos a los migrantes, no podemos simplemente dejarlos entrar sin ninguna revisión previa. Estableceremos algunos controles sobre los migrantes para asegurarnos de que realmente no tengan malas intenciones."
 ENG_australian_style_point_system: "Sistema de Puntos al Estilo Australiano"
 ENG_australian_style_point_system_desc: "Siguiendo los pasos de nuestros amigos australianos, estableceremos un sistema basado en puntos donde los migrantes sean admitidos según sus habilidades y capacidad para contribuir a la nación."
 ENG_tough_on_anti_social_behavior: "Postura Firme contra el Comportamiento Antisocial"
 ENG_tough_on_anti_social_behavior_desc: "Nuestra gente necesita ser incentivada a trabajar. Pasar todo el día en casa no logrará nada. Podremos conseguir que los jóvenes trabajen al permitirles hacer pasantías con las fuerzas policiales y militares, específicamente en las industrias de defensa."
 ENG_renewed_police_budget: "Presupuesto Policial Renovado"
 ENG_renewed_police_budget_desc: "Nuestra policía no puede estar subfinanciada; debemos reconocer la importancia de una fuerza policial fuerte y robusta que se asegurará de que nuestras comunidades permanezcan seguras."
 ENG_established_refugee_programs: "Establecer Programas para Refugiados"
 ENG_established_refugee_programs_desc: "Sin un programa adecuado para refugiados, aquellos que huyen de sus hogares vendrán a nosotros sin nada que ofrecer. Crearemos un plan integral que integrará a los refugiados en la sociedad y los hará trabajar para contribuir a la economía de la nación."
 ENG_streamlined_citizenship_process: "Proceso de Ciudadanía Simplificado"
 ENG_streamlined_citizenship_process_desc: "Vayamos al grano: agregar obstáculos adicionales para que las personas salten al obtener la ciudadanía no es necesario. Permitir una integración más rápida será más beneficioso para todos a largo plazo."
 ENG_neighbourhood_police_teams: "Equipos de Policía de Barrio"
 ENG_neighbourhood_police_teams_desc: "En lugar de aumentar los costos policiales, podemos hacer lo contrario. Al llamar a los barrios a formar equipos policiales, podremos descentralizar la justicia hasta el punto en que el crimen podría ser reportado a las autoridades adecuadas y tratado sin tener unidades de patrulla en todas partes al mismo tiempo."
 ENG_cctv_reduce_fear: "Las Cámaras de CCTV Reducen el Miedo"
 ENG_cctv_reduce_fear_desc: "Las cámaras en espacios públicos son una parte esencial para mantener la seguridad nacional y civil. Si la gente sabe que los criminales serán atrapados, permanecerán tranquilos mientras los criminales lo piensan dos veces antes de cometer un crimen."
 ENG_britain_can_be_better: "Gran Bretaña Puede Ser Mejor"
 ENG_britain_can_be_better_desc: "Con el cambio y la reforma adecuados, Gran Bretaña puede ser mejor. No es que Gran Bretaña sea mala ahora, pero siempre hay espacio para mejorar. El pueblo británico ha confiado en nuestro partido, el Partido Laborista, para liderar a Gran Bretaña en la carga hacia la reforma. No podemos decepcionarlos y debemos hacer todo lo posible para asegurarnos de que sus voces sean escuchadas."
 ENG_more_power_to_people: "Más Poder para el Pueblo"
 ENG_more_power_to_people_desc: "El poder del gobierno debe estar en manos del pueblo. Los políticos, después de todo, son del pueblo. No debemos permitir que las dinastías políticas surjan y tomen el control."
 ENG_westminster_reinforced: "Westminster Reforzado"
 ENG_westminster_reinforced_desc: "A veces la gente no sabe exactamente lo que está pidiendo. En tales instancias, la intervención del gobierno debe aumentarse y los expertos políticos necesitan intervenir y tomar una decisión por ellos."
 ENG_further_digital_governance: "Gobernanza Digital Adicional"
 ENG_further_digital_governance_desc: "La gente debería poder interactuar con el gobierno de manera más libre. Internet es la herramienta perfecta para eso, y al permitir que la gente acceda a los recursos gubernamentales a través del espacio digital, podremos mejorar nuestras capacidades de gobierno sin muchos problemas."
 ENG_a_union_of_nations: "Una Unión de Naciones"
 ENG_a_union_of_nations_desc: "Gran Bretaña no es una nación, es una unión de naciones. Nos aseguraremos de que cada nación esté representada con precisión, y eso se logrará mediante nuestra capacidad para darles acceso a oportunidades económicas."
 ENG_reconsider_the_lobbying_act: "Reconsiderar la Ley de Cabildeo"
 ENG_reconsider_the_lobbying_act_desc: "La Ley de Cabildeo a menudo ha sido acusada de mejorar enormemente la transparencia gubernamental al requerir que los grupos de cabildeo revelen su financiación, regulaciones sobre cuánto pueden gastar, etc. Sin embargo, esto también ha impactado nuestras actividades, y algunos están pidiendo una revisión del proyecto de ley."
 ENG_people_led_constitutional_convention: "Convención Constitucional Liderada por el Pueblo"
 ENG_people_led_constitutional_convention_desc: "Llamaremos al pueblo a liderar la convención constitucional, permitiendo que la pluralidad reemplace a la singularidad. Con el voto del pueblo, su confianza en nosotros será eternamente asegurada."
 ENG_corporaet_led_constitutional_convention: "Convención Liderada por las Corporaciones"
 ENG_corporaet_led_constitutional_convention_desc: "Las corporaciones saben qué es lo mejor para Gran Bretaña. Por lo tanto, debemos priorizar sus intereses en la dirección del país antes que los de cualquier otra persona; al fin y a cabo, ellas son las que tienen el dinero."
 ENG_revised_town_laws: "Leyes Municipales Revisadas"
 ENG_revised_town_laws_desc: "Algunas leyes municipales aún retienen reglas y regulaciones bastante anticuadas. Es mejor que comencemos a limpiarlas, especialmente ya que algunas de ellas han estado causando interrupciones en la actividad de ciertas industrias."
 ENG_replacing_the_house_of_lords: "Reemplazar la Cámara de los Lores"
 ENG_replacing_the_house_of_lords_desc: "La Cámara de los Lores es una de las instituciones más antiguas del mundo, pero también una de las más retrógradas. Su constante intromisión en el parlamento los ha convertido en un dolor de cabeza a la hora de aprobar proyectos de ley, y debe hacerse algo al respecto."
 ENG_ulift_peerages: "Elevar los Pares del Reino"
 ENG_ulift_peerages_desc: "El primer paso para evitar que Gran Bretaña se aleje de sus tradiciones es elevar los pares del reino. Con los pares, seremos capaces de proteger nuestras tradiciones y la cultura de la corte."
 ENG_abolish_life_peerages: "Abolir los Títulos Nobiliarios Vitalicios"
 ENG_abolish_life_peerages_desc: "Los títulos nobiliarios no son algo que se elige; los títulos nobiliarios son completamente hereditarios o designados. No hay nada democrático en los títulos nobiliarios, y abolirlos cortará severamente las influencias aristocráticas."
 ENG_common_expertise: "Experiencia Común"
 ENG_common_expertise_desc: "Necesitamos la experiencia del hombre común, no la de las corporaciones, los políticos o los extranjeros. Necesitamos personas reales del reino común para guiar a la nación y moverla hacia un futuro más brillante y mejor."
 ENG_technocratic_expertise: "Experiencia Tecnocrata"
 ENG_technocratic_expertise_desc: "Aquellos que han demostrado ser dignos casi siempre son ricos y educados. Incorporar su experiencia en el gobierno catapultará el progreso de Gran Bretaña diez veces más."
 ENG_labour_for_workers_and_ceos_alike: "Laborista: Para Trabajadores y CEOs por Igual"
 ENG_labour_for_workers_and_ceos_alike_desc: "Debemos abstenernos de alienar a los CEOs y a las capas altas de la sociedad. En su lugar, debemos complacerlos y trabajar hacia negociaciones y compromisos que permitan mejores regulaciones laborales."
 ENG_the_queens_family: "La Familia de la Reina"
 ENG_the_queens_family_desc: "La fuerza del Soberano no solo radica en la ley o la tradición, sino en el círculo que está detrás de ella cuando el estado está bajo presión. Aquellos invitados al Círculo Interno de la Reina llevarán influencia en su nombre, pero nunca deben confundir la proximidad con la autoridad. La Corona es la única constante, y la Reina decidirá cómo su familia la sirve."
 ENG_the_prince_trust: "La Fundación del Príncipe"
 ENG_the_prince_trust_desc: "La Corona perdura porque se adapta, y pocos instrumentos han demostrado ser más prácticos que la Fundación del Príncipe. Al expandir su alcance, convertimos el patrocinio real en oportunidades medibles: formación, aprendizajes y una escalera de regreso a la sociedad para aquellos que se han quedado atrás. Es poder blando con resultados duros, y fortalece a la monarquía donde más importa: en la vida de los británicos comunes."
 ENG_harmony_doctrine: "La Doctrina de la Armonía"
 ENG_harmony_doctrine_desc: "En una era de polarización, la autoridad de la monarquía radica en su capacidad para unificar sin gobernar. Avanzaremos con una Doctrina de la Armonía: mediación silenciosa entre el gobierno, la industria, las comunidades de fe y la sociedad civil, para reducir las fracturas y reconstruir la cohesión nacional. El estado puede ordenar, pero la Corona puede reconciliar."
 ENG_climate_alarm_bell: "Tocar la Campana de Alarma Climática"
 ENG_climate_alarm_bell_desc: "Las advertencias ya no son teóricas, y el retraso ahora conlleva un costo nacional. Usaremos el peso de la plataforma del Heredero para forzar el riesgo climático en cada agenda, desde la seguridad energética hasta la resiliencia alimentaria y la planificación de infraestructuras. Cuando el Palacio habla con claridad, incluso los ministerios más reacios escuchan."
 ENG_duchy_originals: "Originales del Ducado"
 ENG_duchy_originals_desc: "El Ducado puede ser más que tradición; puede ser prueba de que la administración moderna es rentable. Expandiremos los Originales del Ducado como un modelo de producción sostenible, cadenas de suministro éticas y empresa rural que mantenga a las comunidades viables sin vaciarlas. Si la Corona debe dar ejemplo, que sea uno que pague su camino."
 ENG_heir_of_the_realm: "Heredero del Reino"
 ENG_heir_of_the_realm_desc: "El reinado de Isabel ha definido una era, pero el reino siempre debe mirar lo que viene después. Formalizaremos el papel nacional del Heredero, con mayor visibilidad, acceso más profundo a los informes estatales y una presencia más clara en toda la Unión. La continuidad no se asume; se prepara."
 ENG_naval_prince: "El Príncipe Naval"
 ENG_naval_prince_desc: "El servicio real no es teatro; es una afirmación de credibilidad ganada con el uniforme. Pondremos la identidad naval del Duque de York al frente de los esfuerzos ceremoniales y de reclutamiento, reforzando el vínculo entre la Corona y la Flota. En mares inciertos, los símbolos del deber aún pueden estabilizar a la nación."
 ENG_naval_prince_tt: "Desbloquea §Y$ENG_prince_andrew_leader_name$§! como §YAlto Mando Militar§!"
 ENG_appoint_trade_representative: "Nombrar un Representante Comercial Real"
 ENG_appoint_trade_representative_desc: "La influencia de Gran Bretaña viaja mejor cuando llega tanto con el mandato gubernamental como con el prestigio real. Nombraremos a un Representante Comercial Real para abrir puertas, tranquilizar a los socios y dar a los exportadores un defensor de alto perfil en las negociaciones. Donde los ministros regatean, la Corona puede conferir."
 ENG_emerging_markets_circuit: "Circuito de Mercados Emergentes"
 ENG_emerging_markets_circuit_desc: "El crecimiento del mundo está cambiando, y Gran Bretaña no puede permitirse llegar tarde. Lanzaremos un circuito de mercados emergentes de visitas, foros de inversión y presentaciones estratégicas diseñadas para anclar los negocios británicos en la próxima ola de demanda global. El objetivo es simple: relaciones ahora, influencia después."
 ENG_digital_enterprise_patronage: "Mecenazgo de la Empresa Digital"
 ENG_digital_enterprise_patronage_desc: "El comercio se escribe cada vez más en código, no en carga. Usaremos el mecenazgo real para elevar la empresa digital de Gran Bretaña, las fintech, la ciberseguridad, los servicios avanzados y las nuevas empresas que los escalan, convirtiendo el prestigio en inversión y la inversión en empleos. Si el Palacio puede modernizarse, también puede hacerlo la economía."
 ENG_duty_of_the_crown: "Deber de la Corona"
 ENG_duty_of_the_crown_desc: "Un título real no es un escudo, es una obligación. Enmarcaremos el papel público del Duque en torno al servicio visible, la representación disciplinada y los resultados que justifiquen el lugar de la institución en la vida nacional. En una monarquía, el deber es la única moneda que nunca se devalúa."
 ENG_workhorse_of_the_crown: "Caballo de Trabajo de la Corona"
 ENG_workhorse_of_the_crown_desc: "La monarquía sobrevive con más que espectáculo; sobrevive con un servicio incansable y visible. Elevaremos el modelo de deber de la Princesa Real, con agendas completas, compromisos locales y seguimiento silencioso, al estándar que el público reconoce como trabajo real. Cuando la Corona sea cuestionada, esta debe ser la respuesta."
 ENG_carers_recognition_campaign: "Campaña de Reconocimiento a los Cuidadores"
 ENG_carers_recognition_campaign_desc: "El cuidado en Gran Bretaña a menudo lo brindan personas que reciben poco reconocimiento y menos descanso. Lanzaremos una Campaña Nacional de Reconocimiento a los Cuidadores bajo el mecenazgo real, presionando al gobierno y a la sociedad civil para que apoyen a los cuidadores no remunerados con alivio práctico y respeto público. Un país que honra el servicio en el extranjero también debe honrar el servicio en el hogar."
 ENG_discipline_service: "Disciplina en el Servicio"
 ENG_discipline_service_desc: "Una Corona que se desvía se convierte en un objetivo; una Corona disciplinada se convierte en una institución nuevamente. Endureceremos los estándares de conducta, afilaremos las rutinas de la casa y exigiremos un desempeño profesional en cada deber público. El ejemplo de Anne no es glamuroso, pero es duradero."
 ENG_princess_admiral_royal_navy: "Almirante Princesa de la Royal Navy"
 ENG_princess_admiral_royal_navy_desc: "La Royal Navy es más que hardware; es tradición, identidad y alcance nacional. Profundizaremos el papel naval de la Princesa Real para fortalecer la moral, el reclutamiento y el vínculo del servicio con la nación. En tiempo de paz como en crisis, la Flota debe saber que la Corona está con ella."
 ENG_princess_admiral_royal_navy_tt: "Desbloquea §Y$ENG_princess_anne_leader_name$§! como §YAlto Mando Militar§!"
 ENG_colonel_of_horse_logistics: "Coronel de Caballería y Logística"
 ENG_colonel_of_horse_logistics_desc: "Los ejércitos se mueven con disciplina y logística, no con discursos. Formalizaremos los nombramientos militares de la Princesa Real para enfatizar la preparación, el sostenimiento y la competencia poco glamurosa que gana campañas. Una fuerza moderna necesita campeones que respeten el trabajo detrás de la primera línea."
 ENG_quiet_professionalism: "Profesionalismo Silencioso"
 ENG_quiet_professionalism_desc: "Hay poder en la contención y credibilidad en la consistencia. Haremos del profesionalismo silencioso la filosofía operativa del Palacio: menos teatralidad, más entrega y una presencia constante en toda la Unión. Si Gran Bretaña quiere una monarquía que gane su sustento, así es como se hace."
 ENG_chairman_international_award: "Presidente del Premio Internacional"
 ENG_chairman_international_award_desc: "El legado se preserva mediante instituciones que sobreviven a cualquier reinado. Fortaleceremos el liderazgo del Duque del Premio Internacional para construir habilidades prácticas, confianza cívica y liderazgo en la próxima generación. Una monarquía que invierte en la juventud invierte en su propio futuro."
 ENG_trustee_network: "La Red de Fideicomisarios"
 ENG_trustee_network_desc: "La influencia no se declara; se mantiene a través de juntas, organizaciones benéficas y la maquinaria silenciosa de la vida pública. Expandiremos una red de fideicomisarios que vincule instituciones creíbles con el mecenazgo real, mejorando la coordinación y elevando los estándares en todo el sector. Cuando la Corona organiza la responsabilidad, gana autoridad."
 ENG_commonwealth_youth_outreach: "Divulgación Juvenil de la Commonwealth"
 ENG_commonwealth_youth_outreach_desc: "La Commonwealth no perdurará solo con ceremonias; debe sentirse relevante para los jóvenes. Lanzaremos un esfuerzo de divulgación sostenido de intercambios, programas de formación e iniciativas cívicas conjuntas para mantener vivos los lazos de Gran Bretaña en la vida de los futuros líderes. El poder blando es más fuerte cuando es personal."
 ENG_production_guild_patronage: "Mecenazgo de los Gremios de Producción"
 ENG_production_guild_patronage_desc: "La industria es cultura tanto como comercio, y los sectores creativos y de producción de Gran Bretaña son activos estratégicos. Usaremos el mecenazgo real para defender a los gremios, estudios y oficios especializados que hacen que la producción británica sea competitiva a nivel mundial. El prestigio atrae atención; la atención atrae inversión."
 ENG_steady_hand: "Mano Firme"
 ENG_steady_hand_desc: "En una familia definida por el escrutinio, la estabilidad se convierte en una virtud estratégica. Presentaremos al Duque como una mano firme, confiable, predecible y enfocado en el servicio en lugar de en los titulares. A veces, el papel real más valioso es simplemente evitar que la institución se desvíe."
 ENG_duke_charities: "Organizaciones Benéficas del Duque"
 ENG_duke_charities_desc: "El legado del Duque de Edimburgo se mide en instituciones construidas, no en discursos pronunciados. Consolidaremos y profesionalizaremos su portafolio benéfico para asegurar financiamiento a largo plazo, una gobernanza más aguda y una confianza pública duradera. Si la monarquía ha de ser respetada, su filantropía debe ser tan disciplinada como su ceremonia."
 ENG_international_award_conference: "Conferencia del Premio Internacional"
 ENG_international_award_conference_desc: "La fuerza del Premio siempre ha sido su red global y estándares compartidos. Convocaremos una Conferencia del Premio Internacional para alinear a los socios, expandir la participación y modernizar los programas para una nueva generación. Un legado real se convierte en un sistema cuando se organiza internacionalmente."
 ENG_wwf_president_emeritus: "Presidente Emérito del WWF"
 ENG_wwf_president_emeritus_desc: "La conservación ya no es una causa de nicho; es seguridad nacional con otro nombre. Aprovecharemos la posición del Duque como Presidente Emérito del WWF para elevar la protección de la vida silvestre, la biodiversidad y la administración ambiental como prioridades políticas serias. Cuando el Palacio enmarca la naturaleza como estratégica, a los gobiernos les resulta más difícil ignorarla."
 ENG_prince_phillip_medal: "Medalla del Príncipe Felipe"
 ENG_prince_phillip_medal_desc: "Los símbolos importan cuando premian las virtudes correctas. Estableceremos la Medalla del Príncipe Felipe para honrar el servicio práctico, la ingeniería, la industria, la respuesta de emergencia y la competencia poco glamurosa que mantiene a Gran Bretaña funcionando. Es un mensaje real en metal: los resultados son lo que cuenta."
 ENG_strength_and_stay: "Fuerza y Permanencia"
 ENG_strength_and_stay_desc: "La monarquía perdura manteniéndose firme bajo presión. Proyectaremos la antigua filosofía del Duque: disciplina, resiliencia y negarse a ceder ante las modas pasajeras, en la postura pública de la casa. Cuando lleguen las tormentas, la Corona debe parecer inamovible."
 ENG_from_sandhurst_to_service: "De Sandhurst al Servicio"
 ENG_from_sandhurst_to_service_desc: "La próxima generación de la Corona debe ser creíble en más que ceremonia. Anclaremos el papel público del Príncipe en el servicio disciplinado, el profesionalismo militar, el deber y el liderazgo práctico aprendido a la fuerza. Sandhurst no es una insignia; es un estándar."
 ENG_royal_foundation: "La Fundación Real"
 ENG_royal_foundation_desc: "La monarquía moderna se mide por impacto, no por tradición. Expandiremos la Fundación Real como el instrumento principal del Príncipe, con programas profesionales, resultados medibles y asociaciones que puedan sobrevivir a los cambios políticos. Si el Palacio ha de liderar, debe entregar."
 ENG_heads_together: "Juntos por la Salud Mental"
 ENG_heads_together_desc: "Una nación resiliente requiere más que fronteras fuertes; requiere mentes fuertes. Elevaremos 'Heads Together' a un esfuerzo nacional por la alfabetización en salud mental, la reducción del estigma y el apoyo práctico para aquellos que luchan en silencio. La Corona no puede legislar la compasión, pero puede normalizarla."
 ENG_veteran_armed_forces_support: "Apoyo a Nuestros Veteranos"
 ENG_veteran_armed_forces_support_desc: "El servicio no termina cuando uno se quita el uniforme. Fortaleceremos el apoyo a los veteranos y las fuerzas armadas a través de organizaciones benéficas, empleadores y la coordinación gubernamental, asegurándonos de que aquellos que cargaron con la carga no sean descartados después. Un país que pide sacrificio debe garantizar dignidad."
 ENG_bridge_to_the_future: "Un Puente hacia el Futuro"
 ENG_bridge_to_the_future_desc: "El reinado de Isabel representa continuidad. Guillermo debe representar transición. Moldearemos al Príncipe como un puente hacia el futuro, moderno en métodos, disciplinado en tono y arraigado en la legitimidad del servicio. El próximo capítulo de la monarquía comienza antes de que la corona pase."
 ENG_queen_eldest: "Consejo de la Mayor"
 ENG_queen_eldest_desc: "La Reina se dirige a su línea de mayor edad para proyectar continuidad en el extranjero y confianza en el hogar. Con el alcance público del heredero y el acceso de un enviado real, la Corona puede abrir puertas que los ministros no pueden y mantener la voz de Gran Bretaña escuchada en cada capital."
 ENG_queen_middle: "El Pilar Central"
 ENG_queen_middle_desc: "La Reina depende de la generación intermedia para mantener la institución funcionando con disciplina y entrega. Su fuerza no es el espectáculo, es el horario, los estándares y la competencia silenciosa que protege a la Corona del escándalo y la deriva."
 ENG_queen_youngest: "Puente hacia el Mañana"
 ENG_queen_youngest_desc: "La Reina ancla la casa en una estabilidad probada mientras prepara la próxima era a plena vista. Con el peso institucional de una consorte veterana y el récord de servicio moderno del próximo heredero, la monarquía señala que la renovación es controlada, no caótica."
 ENG_triumph_of_the_crown: "Triunfo de la Corona"
 ENG_triumph_of_the_crown_desc: "El equilibrio ha cambiado, y la Corona ya no reina solo por tradición. Con la monarquía al mando del estado, Gran Bretaña entra en un nuevo acuerdo donde la lealtad es recompensada, el disenso es gestionado y la dirección nacional se establece desde el Palacio. El reino se moverá con un solo propósito ahora, y el mundo entenderá que la Corona ha regresado para gobernar."
 ENG_the_queens_speech_title: "El Discurso de la Reina"
 ENG_the_queens_speech_desc: "[ENG_the_queens_speech_focus_description]"
 ENG_the_kings_speech_title: "El Discurso del Rey"
 ENG_restore_civil_liberties: "Restaurar las Libertades Civiles"
 ENG_restore_civil_liberties_desc: "Una Corona que gobierna también debe demostrar que puede contenerse. Derogaremos los poderes extraordinarios, restauraremos el debido proceso y reafirmaremos los derechos que hacen que la autoridad británica sea legítima. Dejemos que nuestros oponentes lo llamen debilidad; el reino lo llamará confianza."
 ENG_rule_sword_sceptre: "Gobernar con Espada y Cetro"
 ENG_rule_sword_sceptre_desc: "Las antiguas restricciones han fallado, y el reino no será gobernado por la indecisión. Fusionaremos la autoridad real con los instrumentos del poder estatal, asegurándonos de que la voluntad de la Corona se cumpla sin demora. Gran Bretaña será ordenada, decisiva y temida por aquellos que confunden la cortesía con la debilidad."
 ENG_royal_prerogative_activation: "Activar la Prerrogativa Real"
 ENG_royal_prerogative_activation_desc: "Hay poderes que existen en las sombras de la constitución, usados con moderación y mencionados con cuidado. Activaremos la Prerrogativa Real para mover al estado con rapidez, eludiendo la parálisis y forzando a la maquinaria del gobierno a alinearse. Cuando la Corona actúa, el reino sigue."
 ENG_a_bid_soft_power: "Una Oferta por el Poder Blando"
 ENG_a_bid_soft_power_desc: "El poder no se mide solo en barcos y presupuestos, sino en prestigio, acceso y la capacidad de establecer el tono de la vida internacional. Haremos de la Corona el motor del poder blando de Gran Bretaña, expandiendo la diplomacia cultural, el mecenazgo real en el extranjero y las redes de influencia que perduren más que cualquier gabinete. Cuando otros persigan titulares, nosotros daremos forma a la narrativa."
 ENG_commonwealth_summit: "Organizar una Cumbre de la Commonwealth"
 ENG_commonwealth_summit_desc: "La Commonwealth no es un eco del imperio, es una red que puede afilarse en estrategia. Organizaremos una Cumbre de la Commonwealth bajo la dirección real para asegurar nuevos compromisos en comercio, cooperación en seguridad y desarrollo compartido. Si Gran Bretaña ha de liderar de nuevo, comenzará reuniendo a sus amigos en una sola sala."
 ENG_crown_procurement_program: "Programa de Adquisiciones de la Corona"
 ENG_crown_procurement_program_desc: "Una monarquía que gobierna no puede depender de contratos lentos y guerras de territorios ministeriales. Estableceremos un Programa de Adquisiciones de la Corona para centralizar las compras, acelerar el rearme y recompensar a las empresas que entreguen a tiempo y a escala. Cuando el Palacio firma, la industria se moverá."
 ENG_modernize_royal_navy: "Modernizar la Royal Navy"
 ENG_modernize_royal_navy_desc: "El alcance de Gran Bretaña siempre ha sido marítimo, y la Corona no gobernará un reino que no pueda controlar sus rutas marítimas. Modernizaremos la Royal Navy con nuevos cascos, una doctrina más afilada y la logística para sostener operaciones lejos de las aguas nacionales. Dejemos que los rivales observen nuestros puertos y cuenten lo que sale de ellos."
 ENG_raf_army_overhaul: "Reorganizar la RAF y el Ejército"
 ENG_raf_army_overhaul_desc: "Una flota sin cobertura aérea y poder terrestre es un símbolo, no un escudo. Reorganizaremos la RAF y el Ejército con estructuras de mando modernas, equipos actualizados y entrenamiento construido para la guerra de alta intensidad. La Corona no apostará su autoridad en fuerzas obsoletas."
 ENG_leverage_crown_estate: "Aprovechar el Patrimonio de la Corona"
 ENG_leverage_crown_estate_desc: "El Patrimonio de la Corona es más que herencia; es un instrumento estratégico. Aprovecharemos sus activos para financiar proyectos nacionales, estabilizar industrias clave y anclar el desarrollo a largo plazo sin mendigar al Parlamento por cada libra. Si la monarquía ha de gobernar, también debe aprender a invertir."
 ENG_national_service_act: "Aprobar la Ley de Servicio Nacional"
 ENG_national_service_act_desc: "Un reino que quiere seguridad debe estar dispuesto a cargar con su peso. Aprobaremos una Ley de Servicio Nacional para construir mano de obra, disciplina y un sentido compartido de obligación en toda la nación. Algunos lo llamarán coerción; la Corona lo llamará deber."
 ENG_new_constitutional_charter: "Redactar una Nueva Carta Constitucional"
 ENG_new_constitutional_charter_desc: "El antiguo acuerdo fue escrito para una Gran Bretaña diferente y ya no se sostiene bajo presión. Redactaremos una Nueva Carta Constitucional que defina la autoridad de la Corona, los límites del Parlamento y los derechos que permanecen más allá de la política. Una vez sellada, el reino tendrá claridad, y la claridad es poder."
 ENG_secure_succession: "Asegurar la Sucesión"
 ENG_secure_succession_desc: "Una monarquía que gobierna no puede permitirse la incertidumbre en la cima. Aseguraremos la sucesión mediante leyes claras, planificación disciplinada y afirmación pública del mandato del heredero. La continuidad no se asume; se impone."
 ENG_rule_councillorship: "Gobernar por Consejería"
 ENG_rule_councillorship_desc: "El gobierno parlamentario genera facciones, pero la Corona puede gobernar a través de manos confiables. Empoderaremos a un Consejo Real de Consejeros para redactar políticas, supervisar ministerios y mantener al estado alineado con el Palacio. Gran Bretaña será gobernada por competencia y lealtad, no por negociaciones partidistas."
 ENG_convene_foreign_secretary_cabinet: "Convocar el Gabinete del Secretario de Asuntos Exteriores"
 ENG_convene_foreign_secretary_cabinet_desc: "La diplomacia no puede improvisarse cuando la autoridad de la Corona está en juego. Convocaremos un Gabinete del Secretario de Asuntos Exteriores para coordinar embajadores, inteligencia, enviados comerciales y planificadores de defensa bajo una sola dirección. Gran Bretaña hablará con una sola voz en el extranjero, y será la correcta."
 ENG_champion_liberal_values: "Defender los Valores Liberales"
 ENG_champion_liberal_values_desc: "Si la monarquía ha de gobernar, debe hacerlo con principios que Gran Bretaña pueda reconocer como propios. Defenderemos los valores liberales, defenderemos las instituciones libres y probaremos que la autoridad real puede coexistir con los derechos y la moderación. La Corona será fuerte, y será legítima."
 ENG_european_outreach: "Divulgación Europea"
 ENG_european_outreach_desc: "Gran Bretaña no puede permitirse el aislamiento en su propia puerta. Lanzaremos una campaña de divulgación europea para reconstruir canales, asegurar la cooperación donde los intereses se superponen y evitar que los rivales establezcan los términos del continente sin nosotros. La Corona tratará directamente, y Europa lo notará."
 ENG_close_proximity_nato: "Proximidad Cerrada con la OTAN"
 ENG_close_proximity_nato_desc: "La OTAN no es solo un pacto; es una palanca de disuasión y acceso. Nos acercaremos a la Alianza para asegurar el intercambio de inteligencia, la interoperabilidad y la profundidad estratégica, manteniendo al mismo tiempo la libertad de acción de la Corona intacta. Gran Bretaña estará aliada, pero nunca subordinada."
 ENG_joint_operational_command: "Establecer un Mando Operativo Conjunto"
 ENG_joint_operational_command_desc: "La rivalidad interservicios desperdicia tiempo, y el tiempo mata. Estableceremos un Mando Operativo Conjunto para unificar la planificación, la logística y la ejecución en la Armada, el Ejército y la RAF bajo una sola doctrina de combate. Cuando la Corona ordene acción, cada rama se moverá como una sola."
 ENG_reaffirm_special_relationship: "Reafirmar la Relación Especial"
 ENG_reaffirm_special_relationship_desc: "El poder respeta el poder, y Estados Unidos sigue siendo el socio más decisivo del reino. Reafirmaremos la Relación Especial a través de la cooperación en inteligencia, la coordinación en defensa y la planificación estratégica conjunta al más alto nivel. La Corona mantendrá el lugar de Gran Bretaña en la mesa donde se decide el mundo."
 ENG_royal_charitable_initiative: "Iniciativa Benéfica Real"
 ENG_royal_charitable_initiative_desc: "Gobernar es más fácil cuando el reino cree que se cuida de él. Lanzaremos una Iniciativa Benéfica Real para dirigir fondos, voluntarios y atención pública hacia comunidades bajo presión, demostrando que la Corona puede gobernar con compasión. La lealtad crece más rápido donde la ayuda llega primero."
 ENG_time_for_common_sense: "Es Hora del Sentido Común"
 ENG_time_for_common_sense_desc: "El momento del sentido común es ahora. Años de gobierno liderado por el Partido Laborista han alejado a nuestro pueblo de los ideales que hacen de Gran Bretaña lo que alguna vez fue. No podemos dejar que los esfuerzos de grandes hombres como Winston Churchill se desperdicien; no, moldearemos a Gran Bretaña para que sea lo que siempre debió ser: una gran potencia."
 ENG_knowing_who_we_are: "Saber Quiénes Somos"
 ENG_knowing_who_we_are_desc: "Somos británicos primero, europeos segundo. No podemos olvidar quiénes somos: somos los herederos de una superpotencia como el mundo nunca antes había visto. El sol nunca se ponía en el Imperio Británico, y seguirá así si tenemos algo que decir al respecto."
 ENG_a_world_leader: "Un Líder Mundial"
 ENG_a_world_leader_desc: "Somos británicos, segundos de nadie. Somos líderes mundiales y campeones de la libertad. No podemos permitir que nuestro liderazgo como potencia mundial se desvanezca. En su lugar, reafirmaremos nuestro lugar en la vanguardia del liderazgo global."
 ENG_fighting_the_power_of_brussels: "Luchar contra el Poder de Bruselas"
 ENG_fighting_the_power_of_brussels_desc: "Bruselas ha excedido su capacidad administrativa. Están degradando activamente la independencia de nuestra nación con su retórica y son una amenaza para nuestra capacidad de elegir lo que queremos para Gran Bretaña."
 ENG_a_civilized_society: "Una Sociedad Civilizada"
 ENG_a_civilized_society_desc: "Como sociedad civilizada, Gran Bretaña no estará sujeta a la propaganda de otros. Por lo tanto, trabajar para romper la influencia de aquellos que quieren traer cambios radicales a nuestro estilo de vida debe ser abordado rápidamente."
 ENG_a_stronger_society: "Una Sociedad Más Fuerte"
 ENG_a_stronger_society_desc: "Nuestra sociedad será más fuerte y unida que nunca. No podemos permitir que otros fracturen nuestra unidad bajo la excusa de la 'reforma'. Nuestra sociedad solo puede volverse más fuerte si continuamos protegiendo nuestros valores fundamentales."
 ENG_a_staunch_ally: "Un Aliado Firme"
 ENG_a_staunch_ally_desc: "¡No somos más que un aliado firme para nuestros socios en la OTAN! Cualquiera que se atreva a acusarnos de ser 'gorrones' o un lastre puede volver a su casa de donde vino."
 ENG_town_and_country: "Ciudad y Campo"
 ENG_town_and_country_desc: "Somos un país que no puede olvidar sus pueblos pequeños, rurales y humildes. Debemos recordar a estas personas con todas nuestras fuerzas e incentivarlos a seguir adelante."
 ENG_a_more_flexible_europe: "Una Europa Más Flexible"
 ENG_a_more_flexible_europe_desc: "Europa necesita ser más flexible en sus objetivos de política exterior en general. Si vamos a convertirnos en un continente más fuerte en su conjunto, Europa necesita deshacerse de la agenda de 'unificación' y trabajar para ser más flexible."
 ENG_rural_friendly_transport_services: "Servicios de Transporte Amigables con el Campo"
 ENG_rural_friendly_transport_services_desc: "Nuestros servicios de transporte no son muy amigables con las comunidades rurales. Tendremos que encontrar una manera de complacer a estas personas."
 ENG_industrial_friendly_transport_services: "Servicios de Transporte Amigables con la Industria"
 ENG_industrial_friendly_transport_services_desc: "El trabajador necesita llegar y salir del trabajo sin problemas. Tendremos que considerar la renovación o al menos la mejora de nuestros servicios de transporte para ubicaciones industriales."
 ENG_no_army_outside_of_europe: "Ningún Ejército Fuera de Europa"
 ENG_no_army_outside_of_europe_desc: "¿Por qué hay soldados británicos fuera de las fronteras de Europa? ¿Qué hacen en Asia? ¿África? ¿Oriente Medio? En su lugar, necesitamos enfocarnos en mantener a nuestras tropas dentro de Europa."
 ENG_abolish_centrally_planned_housing: "Abolir la Vivienda Planificada Centralmente"
 ENG_abolish_centrally_planned_housing_desc: "En lugar de enfocarnos en asignar nuestro presupuesto hacia una agenda de vivienda planificada centralmente, podemos redirigir esos fondos hacia cosas más importantes."
 ENG_coming_to_the_aid_of_others: "Acudir en Ayuda de Otros"
 ENG_coming_to_the_aid_of_others_desc: "Hay personas en el mundo que desesperadamente necesitan nuestra ayuda, y estamos aquí para proporcionársela."
 ENG_global_matters_global_problems: "Asuntos Globales, Problemas Globales"
 ENG_global_matters_global_problems_desc: "¿Por qué nos importa lo que otros están enfrentando? ¡Es su problema, no el nuestro! Necesitan resolverlo por su cuenta."
 ENG_credit_based_public_transport: "Transporte Público Basado en Créditos"
 ENG_credit_based_public_transport_desc: "¿Trabajas? Excelente, no tienes que preocuparte por pagar tus tarifas. Al permitir que aquellos que trabajan usen el transporte público de forma gratuita, podremos incentivar a las personas a buscar empleos y trabajar."
 ENG_safe_haven_not_safe_touch: "Refugio Seguro, No Toque Seguro"
 ENG_safe_haven_not_safe_touch_desc: "Somos un refugio seguro para aquellos que realmente necesitan ayuda. Si simplemente dejamos entrar a cualquiera, arruinarán nuestro país hasta la destrucción."
 ENG_are_you_thinking_what_were_thinking: "¿Estás Pensando lo que Estamos Pensando?"
 ENG_are_you_thinking_what_were_thinking_desc: ""
 ENG_power_to_the_bank_of_england: "Poder al Banco de Inglaterra"
 ENG_power_to_the_bank_of_england_desc: "Tal como están las cosas, el Banco de Inglaterra está en un estado peor que nunca. Por lo tanto, es necesario que actuemos y fortalezcamos la institución."
 ENG_british_dream: "El Sueño Británico"
 ENG_british_dream_desc: "El sueño británico es uno que muchos no han tenido durante mucho tiempo. Es el sueño y la ambición de que todos los británicos prosperen, sin tener que sufrir las consecuencias de las pérdidas comunitarias."
 ENG_whats_wrong_with_discipline: "¿Qué Hay de Malo con la Disciplina?"
 ENG_whats_wrong_with_discipline_desc: "Parece que nuestras escuelas se han vuelto blandas y han comenzado a evitar tomar acciones disciplinarias necesarias. Es nuestro deber enseñar modales a nuestros jóvenes, y nos aseguraremos de que los educadores lo sepan."
 ENG_across_the_board_tax_slashes: "Recortes de Impuestos en Todos los Sectores"
 ENG_across_the_board_tax_slashes_desc: "Si recortamos impuestos en todos los sectores, nuestro pueblo de todos los ámbitos de la sociedad sentirá que el peso de sus cargas se reduce drásticamente. ¡No debemos discriminar!"
 ENG_tax_slashes_only_for_some: "Recortes de Impuestos Solo para Algunos"
 ENG_tax_slashes_only_for_some_desc: "No tenemos el presupuesto ni la voluntad de recortar impuestos para todos. Tendremos que ser coordinados y recortar impuestos solo donde nos beneficie."
 ENG_icnreased_control_for_administrators: "Mayor Control para los Administradores"
 ENG_icnreased_control_for_administrators_desc: "Aquellos que trabajan en nuestras escuelas necesitan la capacidad de tener voz en los asuntos de sus instituciones. Hacerlo nos permitirá que surjan nuevos académicos."
 ENG_keeping_hospitals_clean: "Mantener los Hospitales Limpios"
 ENG_keeping_hospitals_clean_desc: "Necesitamos mantener nuestros hospitales limpios, tanto en cuanto a la apariencia física como a su credibilidad."
 ENG_corporate_invitations: "Invitaciones Corporativas"
 ENG_corporate_invitations_desc: "Necesitamos invitar a las corporaciones a que vengan y nos ayuden a decidir sobre la política económica. Ellos son el corazón de nuestra economía, y sin ellos, no seríamos nada."
 ENG_more_police_less_crime: "Más Policía, Menos Crimen"
 ENG_more_police_less_crime_desc: "Es bastante obvio, ¿verdad? Si tenemos más policía patrullando las calles, entonces ciertamente tendremos muchos menos crímenes."
 ENG_cutting_wait_times: "Reducir los Tiempos de Espera"
 ENG_cutting_wait_times_desc: "La gente espera demasiado tiempo por los servicios médicos. ¡Es hora de que hagamos algo al respecto y reduzcamos los tiempos de espera a la mitad!"
 ENG_turnaround_schools: "Escuelas de Reorientación"
 ENG_turnaround_schools_desc: "Si los estudiantes no pueden sentarse correctamente en clase y escuchar a su instructor, entonces tendremos que pensar en otra cosa. Enviarlos a escuelas de reorientación finalmente resolverá este problema que tenemos con una pequeña minoría de nuestros estudiantes."
 ENG_structural_overhaul_of_nhs: "Reorganización Estructural del NHS"
 ENG_structural_overhaul_of_nhs_desc: "Tal como están las cosas, el NHS no puede continuar. Está consumiendo todo nuestro dinero y dejando a los pacientes enfermos y esperando afuera. Debemos iniciar una serie de reformas que reconstruyan el NHS desde cero."
 ENG_trusting_local_professionals: "Confiar en los Profesionales Locales"
 ENG_trusting_local_professionals_desc: "¿Por qué arreglarlo si no está roto? Dejaremos los asuntos médicos en manos de los profesionales médicos y permitiremos que el NHS opere con algunos ajustes menores."
 ENG_keeping_up_our_guard: "Mantener la Guardia en Alto"
 ENG_keeping_up_our_guard_desc: "No podemos bajar la guardia solo porque las cosas están calmadas ahora. Debemos anticipar todo tipo de escenarios, incluso durante tiempos de estabilidad y prosperidad."
 ENG_benefitting_the_taxpayer: "Beneficiar al Contribuyente"
 ENG_benefitting_the_taxpayer_desc: "¿A quién servimos si no es al contribuyente? Necesitamos implementar políticas que tranquilizarán a los contribuyentes de que su dinero no se está desperdiciando."
 ENG_invitation_to_the_government_of_britain: "Invitación al Gobierno de Gran Bretaña"
 ENG_invitation_to_the_government_of_britain_desc: ""
 ENG_get_britain_moving_again: "Poner a Gran Bretaña en Movimiento de Nuevo"
 ENG_get_britain_moving_again_desc: "Ha llegado el momento de poner a Gran Bretaña en movimiento de nuevo. Nunca más con la estrategia lenta, metódica y convencional de esperar a que la economía se arregle por sí misma. Vamos a tomar las riendas nosotros mismos."
 ENG_cleanup_westminster: "Limpiar Westminster"
 ENG_cleanup_westminster_desc: "Westminster es un desastre, saturado de burocracia y exceso administrativo. Es hora de que tomemos un martillo y limpiemos el lugar."
 ENG_big_society_not_big_government: "Gran Sociedad, No Gran Gobierno"
 ENG_big_society_not_big_government_desc: "¿Por qué necesitamos un gobierno grande? Si nuestra sociedad es lo suficientemente buena, ¿por qué monitorear, administrar y dictar cada aspecto de sus vidas? En su lugar, recortaremos el gobierno y permitiremos que la sociedad haga lo suyo."
 ENG_household_debt_management_programs: "Programas de Gestión de Deudas Domésticas"
 ENG_household_debt_management_programs_desc: "A veces la gente simplemente no puede pagar sus deudas, y eso está bien. Estableceremos programas de gestión de deudas que se harán cargo de parte de su deuda o los ayudarán con planes para pagarla."
 ENG_bigger_place_for_educators: "Un Lugar Más Grande para los Educadores"
 ENG_bigger_place_for_educators_desc: "El país necesita abrirse más a nuestros educadores. No los apreciamos ni cerca de lo que deberíamos, especialmente por el trabajo que están haciendo."
 ENG_the_most_family_friendly_country: "El País Más Amigable con las Familias"
 ENG_the_most_family_friendly_country_desc: "Nuestro país necesita ser más abierto a aceptar familias y a que la gente forme familias. Nuestra población no puede permanecer estática y pequeña; necesitamos crecer y fomentar buenos valores."
 ENG_knowledge_for_industry: "Conocimiento para la Industria"
 ENG_knowledge_for_industry_desc: "En lugar de dejar que el conocimiento se desperdicie en otros lugares, podríamos redirigir parte de ese poder cerebral hacia nuevas industrias, quizás industrias militares."
 ENG_power_of_recall: "Poder de Revocación"
 ENG_power_of_recall_desc: "Es evidente que algunos primeros ministros mienten y, por lo tanto, necesitan ser destituidos si no pueden cumplir con sus promesas. Debemos permitir que la gente revoque a los primeros ministros que ya no quieren que lideren el camino."
 ENG_a_more_balanced_economy: "Una Economía Más Equilibrada"
 ENG_a_more_balanced_economy_desc: "Nuestra economía está en mal estado como resultado de décadas de incompetencia laborista. ¡Es hora de que las cosas vuelvan a la normalidad!"
 ENG_bye_bye_bureaucracy: "Adiós a la Burocracia"
 ENG_bye_bye_bureaucracy_desc: "¿Quién necesita un gobierno grande cuando podemos tener una gran libertad? No hay necesidad de burocracia en la vida cotidiana de nuestros constituyentes; más bien, hay necesidad de libertades expandidas."
 ENG_case_by_case_intervention: "Intervención Caso por Caso"
 ENG_protecting_childhood: "Proteger la Infancia"
 ENG_protecting_childhood_desc: "Tal como están las cosas, nuestros jóvenes están en un riesgo mayor de ser dañados por individuos enfermos a través de múltiples canales, ya sea internet o las calles. Debemos tomar medidas adicionales para proteger la infancia y permitir que crezcan y prosperen."
 ENG_investigate_lost_funds: "Investigar Fondos Perdidos"
 ENG_investigate_lost_funds_desc: "Por alguna razón, grandes sumas de dinero del gobierno desaparecieron hace unos años. Es hora de que abramos una investigación adecuada y descubramos qué pasó."
 ENG_a_more_transparent_government: "Un gobierno más transparente"
 ENG_a_more_transparent_government_desc: "Nuestro gobierno no es ni de lejos lo suficientemente transparente, y debemos tomar medidas adicionales para garantizar que nuestros electores estén al tanto de lo que sucede en Westminster."
 ENG_petitions_for_debate: "Peticiones para debate"
 ENG_petitions_for_debate_desc: "Si permitimos que la ciudadanía reúna un número significativo de firmas en una petición de cambio, podríamos trasladarlas al parlamento para su revisión e implementar las opiniones del pueblo de manera más directa."
 ENG_public_reading_stage: "Etapa de lectura pública"
 ENG_public_reading_stage_desc: "Permitiremos la creación de un foro de internet que deje a nuestro pueblo comentar y debatir los cambios que se aprueban en el parlamento, aumentando la transparencia y el alcance del gobierno."
 ENG_for_the_common_man: "Para el hombre común"
 ENG_for_the_common_man_desc: "Nuestro gobierno es para el hombre común, no para los que dirigen el cotarro. Aprobaremos reformas específicas que permitirán una mayor actividad política entre la clase trabajadora."
 ENG_for_the_wealthy_man: "Para el hombre rico"
 ENG_for_the_wealthy_man_desc: "¿Qué demonios tienen que ver los pobres con el gobierno de todos modos? La mayoría son unos vagos de izquierda que solo quieren subsidios gubernamentales para evitar trabajar. Nos enfocaremos en los individuos de la sociedad que realmente trabajan y contribuyen a la economía."
 ENG_a_brighter_more_secure_future: "Un futuro más brillante y seguro"
 ENG_a_brighter_more_secure_future_desc: ""
 ENG_operation_dagger: "Operación Daga"
 ENG_operation_dagger_desc: "El golfo Pérsico estuvo una vez dominado por nuestras fuerzas, y nuestra capacidad para dictar lo que entraba y salía era casi absoluta. Hoy en día, sin embargo, estamos en una posición de menor fuerza para negociar con los actores regionales, y nos vemos obligados a depender de nuestras bazas comerciales para conseguir algo. Al apoderarnos de Musandam, podremos volver a estar en una posición de poder en el golfo."
 ENG_operation_barras: "Operación Barras"
 ENG_operation_barras_desc: "Hemos recibido informes de que el grupo miliciano, comúnmente conocido como los 'West Side Boys' por periodistas y emisoras, ha capturado a varios soldados británicos y los mantiene como rehenes. Se nos presiona para intervenir de alguna forma para salvar sus vidas, y el mando militar ha redactado la Operación Barras para llevarlo a cabo. También tenemos la opción de tomar medidas adicionales para incautar recursos vitales durante la operación; sin embargo, esto no es obligatorio."
 ENG_operation_coastal_star: "Operación Estrella Costera"
 ENG_operation_coastal_star_desc: "Gambia está empezando a derivar peligrosamente hacia el autoritarismo, la inestabilidad y, sin duda, a salir de nuestra órbita. Tendremos que intervenir de alguna forma y hacer que cambien de rumbo, de lo contrario, el resto de África Occidental podría seguir el mismo camino."
 ENG_operation_delta_guard: "Operación Guardia del Delta"
 ENG_operation_delta_guard_desc: "Claramente los nigerianos no saben nada sobre dirigir un Estado, y estamos obligados a hacer algo con el oro negro desperdiciado que rodea el Delta. De lo contrario, dejaríamos que se pierda, y nadie quiere eso. La Operación Guardia del Delta nos permitirá restablecer el dominio económico en Nigeria y los ingresos sin duda beneficiarán al Estado."
 ENG_the_sun_which_never_set: "El sol que nunca se ponía"
 ENG_the_sun_which_never_set_desc: "El sol realmente nunca se pone en Gran Bretaña, y nos aseguraremos de que siga siendo así."
 ENG_operation_resolute_banner: "Operación Estandarte Resuelto"
 ENG_operation_resolute_banner_desc: "El gobierno serbio sigue amenazando a Kosovo y, como resultado, nos vemos obligados a intervenir y trazar una línea roja."
 ENG_falklands_policy: "Política de las Malvinas"
 ENG_falklands_policy_desc: "A pesar del pequeño choque que tuvimos con Argentina por las Malvinas hace un par de décadas, el recuerdo del conflicto aún está fresco en la mente de muchos. Podemos seguir adelante con una nueva política en las islas y tal vez tomar medidas adicionales."
 ENG_regime_change_in_zimbabwe: "Operación Salvaguarda"
 ENG_regime_change_in_zimbabwe_desc: "El longevo dictador de Zimbabue, [ZIM.GetLeader], debe ser derrocado por cualquier medio necesario. Su opresión hacia los ciudadanos británicos y el pueblo zimbabuense no puede pasarse por alto y la justicia debe aplicarse con rapidez."
 ENG_operation_east_divide: "Operación División Oriental"
 ENG_operation_east_divide_desc: "El Suez es legítimamente territorio británico, y sin él, hemos tenido que pasar por las dificultades de las 'regulaciones del comercio internacional'. Como tal, intentaremos llegar a un acuerdo con los egipcios para obtener el control parcial del Sinaí; de lo contrario, no tendremos más remedio que tomar cartas en el asunto."
 ENG_operation_ninety_seven: "Operación '97"
 ENG_operation_ninety_seven_desc: "Entregar Hong Kong a los chinos fue un error, y uno muy grave. Debemos buscar nuevas formas de hacer que Hong Kong vuelva a estar bajo nuestra influencia si queremos restablecernos como una hegemonía económica."
 devolution.1.t: "Los territorios constituyentes buscan aprobar leyes para reducir la dependencia"
 devolution.1.d: "Los acontecimientos recientes en el país han llevado a nuestros estados constituyentes a avanzar hacia la aprobación de políticas para disminuir su dependencia del gobierno central. Tenemos la capacidad de vetar estos proyectos de ley, pero hacerlo puede generar mayores niveles de insatisfacción."
 devolution.1.a: "Aprobarlos"
 devolution.1.b: "Vetarlos"
 devolution.1.c: "Mostrarme los proyectos de ley individuales"
 devolution.2.t: "El proyecto de ley de Escocia"
 devolution.2.d: "El parlamento escocés ha presentado al gobierno un proyecto de ley que aumentará su autonomía y lo impulsará hacia un Estado con mayor descentralización. Vetar este proyecto de ley puede enfurecerlos, pero aprobarlo los empujará hacia la transferencia de competencias."
 devolution.2.a: "Aprobarlo"
 devolution.2.b: "Vetarlo"
 devolution.3.t: "El proyecto de ley de Irlanda del Norte"
 devolution.3.d: "El parlamento de Irlanda del Norte ha presentado al gobierno un proyecto de ley que aumentará su autonomía y lo impulsará hacia un Estado con mayor descentralización. Vetar este proyecto de ley puede enfurecerlos, pero aprobarlo los empujará hacia la transferencia de competencias."
 devolution.3.a: "Aprobarlo"
 devolution.3.b: "Vetarlo"
 devolution.4.t: "El proyecto de ley de Gales"
 devolution.4.d: "El parlamento galés ha presentado al gobierno un proyecto de ley que aumentará su autonomía y lo impulsará hacia un Estado con mayor descentralización. Vetar este proyecto de ley puede enfurecerlos, pero aprobarlo los empujará hacia la transferencia de competencias."
 devolution.4.a: "Aprobarlo"
 devolution.4.b: "Vetarlo"
 devolution.5.t: "Crecen los llamamientos a la independencia de Escocia"
 devolution.5.d: "Cada día que pasa, los presentadores de noticias se sitúan ante multitudes de personas que exigen la celebración de un referéndum nacional para decidir si Escocia debe seguir formando parte de [ENG.GetName] o no. Obviamente, Westminster se opone por lo general a la idea, pero vetarla directamente podría desencadenar inestabilidad."
 devolution.5.a: "Está bien, veamos qué pasa"
 devolution.5.b: "Vetarlo"
 devolution.6.t: "Crecen los llamamientos a la independencia de Irlanda del Norte"
 devolution.6.d: "Cada día que pasa, los presentadores de noticias se sitúan ante multitudes de personas que exigen la celebración de un referéndum nacional para decidir si Irlanda del Norte debe seguir formando parte de [ENG.GetName] o no. Obviamente, Westminster se opone por lo general a la idea, pero vetarla directamente podría desencadenar inestabilidad."
 devolution.6.a: "Está bien, veamos qué pasa"
 devolution.6.b: "Vetarlo"
 devolution.7.t: "Crecen los llamamientos a la independencia de Gales"
 devolution.7.d: "Cada día que pasa, los presentadores de noticias se sitúan ante multitudes de personas que exigen la celebración de un referéndum nacional para decidir si Gales debe seguir formando parte de [ENG.GetName] o no. Obviamente, Westminster se opone por lo general a la idea, pero vetarla directamente podría desencadenar inestabilidad."
 devolution.7.a: "Está bien, veamos qué pasa"
 devolution.7.b: "Vetarlo"
 devolution.10.t: "Elecciones territoriales"
 devolution.10.d: "Ha llegado el momento de celebrar elecciones en nuestros estados constituyentes. Cada territorio elegirá a nuevos primeros ministros en sus respectivos parlamentos, quienes serán proindependentistas o partidarios de [ENG.GetName]. La probabilidad de que estos miembros independentistas sean elegidos dependerá de la agitación social en cada uno de los respectivos territorios."
 devolution.10.a: "De acuerdo"
 britain_md.100.t: "Aproximándose a la Operación Daga"
 britain_md.100.d: "Musandam se encuentra en una región muy estratégica, actuando como la daga del golfo Pérsico. Innumerables petroleros y convoyes pasan a diario por el estrecho de Ormuz; con la volatilidad cada vez mayor de la región, somos incapaces de garantizar la protección de la ruta de navegación. Si logramos poner la provincia bajo nuestro control, estaremos en una mejor posición para proteger nuestras flotas y activos en la zona."
 britain_md.100.a: "Intentar llegar a un acuerdo con Omán"
 britain_md.100.b: "No hay tiempo para negociar, avancen"
 britain_md.101.t: "[ENG.GetName] se nos aproxima por Musandam"
 britain_md.101.d: "Los británicos han venido a hablar con nosotros. Más concretamente, vienen a por nuestro territorio. Al escuchar la propuesta británica, nuestros diplomáticos salieron furiosos de la sala, incapaces de contenerse tras oír que los británicos están aquí para intentar negociar por Musandam. Una exigencia tan agresiva sin duda alterará a nuestro pueblo más allá de lo imaginable. No obstante, los británicos han reiterado que rechazar tal demanda no les dejará otra opción que 'buscar otros medios'."
 britain_md.101.a: "¡Jamás!"
 britain_md.101.b: "¿Qué otra opción tenemos?"
 britain_md.102.t: "Omán rechaza las negociaciones"
 britain_md.102.d: "El gobierno de Omán ha dejado claro que no está interesado en ningún tipo de negociación y, en su lugar, ha optado por echar a nuestros diplomáticos de malas maneras."
 britain_md.102.a: "No nos dejan otra opción"
 britain_md.102.b: "Olvídalo"
 britain_md.103.t: "Omán nos impone condiciones"
 britain_md.103.d: "El gobierno omaní ha tomado la sabia decisión de negociar con nosotros e incluso nos ha ofrecido condiciones. Se nos pide pagar una cuantiosa suma por adelantado y garantizar la protección de Omán durante un periodo de tiempo. Rechazar esta oferta significaría que Omán no nos cederá los derechos sobre Musandam."
 britain_md.103.a: "Está bien"
 britain_md.103.b: "No, lo tomaremos por otra vía"
 britain_md.103.c: "Olvídalo"
 ENG_western_allies_western_ideals: "Aliados occidentales, ideales occidentales"
 ENG_western_allies_western_ideals_desc: ""
 ENG_out_with_the_new_in_with_the_old: "Fuera lo nuevo, que vuelva lo viejo"
 ENG_out_with_the_new_in_with_the_old_desc: ""
 royal_workers_idea: "Trabajadores reales"
 ENG_crown_procurement_program_idea: "Programa de adquisiciones de la Corona"
 ENG_recent_defections: "Deserciones recientes"
 ENG_recent_defections_desc: "Tropas, generales y pilotos experimentados huyen de nuestras filas con la esperanza de cortar lazos con nuestro gobierno, al que consideran una amenaza para el Estado."
 ENG_war_of_independence: "Guerra de independencia"
 ENG_war_of_independence_desc: "Con la moral y el ánimo por las nubes, nuestros hombres están listos para ver el fin del régimen tiránico de Londres."
 ENG_typhoon_debate1: "Aumento de la producción de cazas Typhoon"
 ENG_resistance_against_westminster: "Resistencia contra Westminster"
 ENG_resistance_against_westminster_desC: "Tras rechazar una propuesta de referéndum, los ciudadanos de este territorio han opuesto una férrea resistencia en forma de desobediencia civil y pequeños brotes de violencia para mostrar su descontento."
 ENG_political_modifier: "El sistema de Westminster"
 ENG_two_party_system_idea: "Sistema bipartidista"
 ENG_economy_modifier: "La economía de [ENG.GetName]"
 ENG_building_britain_idea: "Construir una Gran Bretaña preparada para el futuro"
 ENG_building_britain_idea_desc: "Una estrategia industrial a largo plazo alinea la inversión en ideas, personas, infraestructuras y lugares, elevando lentamente la productividad y dando a las empresas la confianza necesaria para planificar, contratar y construir en todo el país."
 ENG_ireland_border_cooperation_idea_IRE: "Cooperación fronteriza con Irlanda"
 ENG_ireland_border_cooperation_idea_IRE_desc: "Organismos transfronterizos prácticos y programas conjuntos vinculan a Irlanda del Norte e Irlanda en materia de comercio, infraestructuras y servicios, agilizando los trámites burocráticos y ayudando a que las mercancías, las personas y las ideas se muevan con mayor libertad a través de la frontera."
 ENG_Space_Command0: "Capacidades británicas en el ciberespacio"
 ENG_Space_Command0_desc: "El Reino Unido trabaja para mejorar sus capacidades y asegurar sus intereses en el espacio."
 ENG_Space_Command2: "Mando Espacial del Reino Unido"
 ENG_Space_Command3: "Mando Espacial del Reino Unido"
 ENG_Space_Command3_desc: "El Mando Espacial del Reino Unido es el líder de la defensa en operaciones espaciales, fuerza laboral espacial y capacidad espacial. Se trata de un mando conjunto, con sede en RAF High Wycombe, y cuenta con personal de la Marina Real, el Ejército Británico y la Real Fuerza Aérea, junto con funcionarios públicos y contratistas. Con la creación de la 1.ª División Espacial, la organización ha superado las expectativas en todo el mundo, y Gran Bretaña experimenta una nueva era 'Dreadnought'."
 ENG_standardized_space_parts1: "Componentes espaciales estandarizados"
 ENG_standardized_space_parts1_desc: "Al apoyar a las empresas comerciales para que el espacio sea accesible y asequible, se han reducido los costes de fabricación de productos espaciales."
 ENG_Historical_Valor1: "Valor histórico"
 ENG_Historical_Varlor1_desc: "Arraigadas en la tradición, las fuerzas armadas británicas se enorgullecen de su célebre patrimonio. Sin embargo, el estado mayor se mantiene firme en las estrategias convencionales, mostrándose escéptico ante las tácticas no probadas. Mientras el ejército se encuentra al borde del cambio, equilibrar el orgullo y la adaptabilidad se convierte en la esencia de la defensa de la nación."
 ENG_Aging_Military1: "Ejército envejecido"
 ENG_Aging_Military1_desc: "Debido al abandono financiero, el ejército del Reino Unido se enfrenta a graves problemas de envejecimiento, lidiando con equipos obsoletos y un descenso de la calidad. El impacto de la falta de fondos resuena en las filas, planteando desafíos para mantener una fuerza de defensa moderna y eficaz."
 ENG_desert_hawk: "Desert Hawk"
 ENG_desert_hawk_desc: "El Lockheed Martin Desert Hawk III es un VANT diseñado por Skunk Works en Lockheed Martin Aeronautics. Es un pequeño dron de vigilancia capaz de realizar observación por radar, inteligencia de señales e interceptación de comunicaciones, junto con observación remota dotada de visión nocturna, imágenes térmicas y sensores electroópticos."
 ENG_archer_artillery_alliance: "Alianza de Artillería Archer"
 ENG_archer_artillery_alliance_desc: "La Alianza de Artillería Archer, desarrollada por Suecia, representa un hito en la potencia de fuego de precisión de largo alcance. Con carga automatizada y despliegue rápido, este sistema de artillería garantiza un apoyo preciso y flexible en el campo de batalla. Su diseño modular mejora las operaciones militares, otorgando a Suecia y al Reino Unido una ventaja estratégica en combate."
 ENG_Boxer_Program: "Programa Boxer"
 ENG_Boxer_Program_desc: "El Programa de TBP Boxer, una colaboración entre Alemania y los Países Bajos, introduce una nueva era en los transportes blindados de personal. El diseño modular del Boxer permite una fácil adaptación a diversas misiones, incluyendo el transporte de tropas y la evacuación médica. Con características avanzadas de protección y una movilidad excepcional, este vehículo mejora la seguridad y la eficacia del personal militar en diversos entornos operativos."
 ENG_warrior_capability_sustainment_programme: "Programa de Sostenimiento de Capacidades de los Vehículos Blindados Warrior"
 ENG_warrior_capability_sustainment_programme_desc: "El obsoleto cañón RARDEN de 30 mm del Warrior, dada su incapacidad para disparar en movimiento con precisión, ha impulsado estudios sobre nuevos sistemas de armas y diseños de torretas para prolongar su vida de combate. Los planes actuales prevén la adición de una torreta con cañón CT40 de 40 mm totalmente estabilizada, una arquitectura electrónica mejorada y un sistema de protección de blindaje modular con kits de montaje rápido. Al mismo tiempo, el programa del Vehículo de Apoyo a Grupos de Combate Blindados ha propuesto la conversión de la plataforma en un TBP para sustituir al FV432."
 ENG_warrior_ajax_upgrades: "Actualizaciones Ajax para los Vehículos Blindados Warrior"
 ENG_warrior_ajax_upgrades_desc: "El proyecto de Actualizaciones Ajax para el Warrior, liderado por el Reino Unido, representa una mejora significativa para el emblemático vehículo de combate de infantería Warrior. Con modificaciones avanzadas que incluyen una potencia de fuego mejorada, sistemas de comunicación optimizados y un blindaje mejorado, el Warrior Ajax garantiza un rendimiento superior en el campo de batalla. Estas actualizaciones refuerzan las capacidades militares del Reino Unido, proporcionando un apoyo blindado moderno y versátil para las fuerzas terrestres en una variedad de escenarios operativos."
 ENG_fres_program_Idea: "Programa FRES"
 ENG_fres_program_Idea_desc: "El Programa FRES (Sistema Futuro de Efecto Rápido) del Reino Unido es una iniciativa vanguardista encaminada a mejorar la agilidad militar mediante plataformas terrestres versátiles. Al integrar tecnología puntera para una respuesta rápida, garantiza la preparación del Reino Unido ante una gran diversidad de misiones."
 ENG_fixing_civil_servant_idea: "Reforma de la función pública"
 ENG_fixing_civil_servant_idea_desc: "Nuestros soldados necesitan equipo fiable. Estamos esforzándonos por cumplir con este requisito."
 ENG_special_command1: "Mando especializado"
 ENG_special_command1_desc: "Al concentrarnos en perfeccionar la especialización y la eficacia del ejército, buscamos mejorar las capacidades de combate de nuestras fuerzas armadas. Este compromiso, sin embargo, conlleva un aumento de los gastos y unos requisitos de recursos más exigentes."
 ENG_special_command2: "Mando especializado"
 ENG_special_command2_desc: "Al concentrarnos en perfeccionar la especialización y la eficacia del ejército, buscamos mejorar las capacidades de combate de nuestras fuerzas armadas. Este compromiso, sin embargo, conlleva un aumento de los gastos y unos requisitos de recursos más exigentes."
 ENG_special_command3: "Mando especializado"
 ENG_special_command3_desc: "Al concentrarnos en perfeccionar la especialización y la eficacia del ejército, buscamos mejorar las capacidades de combate de nuestras fuerzas armadas. Este compromiso, sin embargo, conlleva un aumento de los gastos y unos requisitos de recursos más exigentes."
 ENG_UKSF1: "Fuerzas Especiales del Reino Unido"
 ENG_UKSF1_desc: "Compuestos por fuerzas de élite como el SAS y el SBS, estos operativos altamente cualificados destacan en operaciones encubiertas, contraterrorismo y guerra no convencional. La presencia de las Fuerzas Especiales de élite eleva la agilidad estratégica del Reino Unido y sus capacidades contraterroristas, encarnando la excelencia en precisión y adaptabilidad."
 ENG_UKSF2: "Fuerzas Especiales del Reino Unido"
 ENG_UKSF2_desc: "Compuestos por fuerzas de élite como el SAS y el SBS, estos operativos altamente cualificados destacan en operaciones encubiertas, contraterrorismo y guerra no convencional. La presencia de las Fuerzas Especiales de élite eleva la agilidad estratégica del Reino Unido y sus capacidades contraterroristas, encarnando la excelencia en precisión y adaptabilidad."
 ENG_aircraft_ai_idea: "Integración de IA en aeronaves"
 ENG_aircraft_ai_idea_desc: "A medida que la tecnología avanza, el Reino Unido lidera la integración de IA en aeronaves, fusionando inteligencia artificial de vanguardia con capacidades aéreas. Este espíritu nacional significa el compromiso de aprovechar la IA para mejorar el rendimiento de los aviones, los sistemas autónomos y las capacidades de misión adaptativas."
 ENG_quality_over_quantity: "Calidad sobre cantidad"
 ENG_worldwide_command1: "Mando global"
 ENG_worldwide_command1_desc: "El concepto de un Mando Global del Ejército Británico plantea un enfoque estratégico en el que el ejército británico extiende su alcance operativo a escala mundial. Esta iniciativa implica el establecimiento de una estructura de mando capaz de coordinar y llevar a cabo operaciones militares a escala internacional. Mediante el despliegue de fuerzas en diversas regiones, las fuerzas armadas británicas pretenden potenciar su influencia global, responder a las amenazas emergentes y contribuir a la seguridad internacional. El Mando Global del Ejército Británico representa un compromiso con una intervención militar proactiva y versátil, en consonancia con la naturaleza cambiante de los desafíos de seguridad mundiales."
 ENG_worldwide_command2: "Mando global"
 ENG_worldwide_command2_desc: "El concepto de un Mando Global del Ejército Británico plantea un enfoque estratégico en el que el ejército británico extiende su alcance operativo a escala mundial. Esta iniciativa implica el establecimiento de una estructura de mando capaz de coordinar y llevar a cabo operaciones militares a escala internacional. Mediante el desplueguede fuerzas en diversas regiones, las fuerzas armadas británicas pretenden potenciar su influencia global, responder a las amenazas emergentes y contribuir a la seguridad internacional. El Mando Global del Ejército Británico representa un compromiso con una intervención militar proactiva y versátil, en consonancia con la naturaleza cambiante de los desafíos de seguridad mundiales."
 ENG_worldwide_command3: "Mando global"
 ENG_worldwide_command3_desc: "El concepto de un Mando Global del Ejército Británico plantea un enfoque estratégico en el que el ejército británico extiende su alcance operativo a escala mundial. Esta iniciativa implica el establecimiento de una estructura de mando capaz de coordinar y llevar a cabo operaciones militares a escala internacional. Mediante el despliegue de fuerzas en diversas regiones, las fuerzas armadas británicas pretenden potenciar su influencia global, responder a las amenazas emergentes y contribuir a la seguridad internacional. El Mando Global del Ejército Británico representa un compromiso con una intervención militar proactiva y versátil, en consonancia con la naturaleza cambiante de los desafíos de seguridad mundiales."
 ENG_worldwide_command4: "Mando global"
 ENG_worldwide_command4_desc: "El concepto de un Mando Global del Ejército Británico plantea un enfoque estratégico en el que el ejército británico extiende su alcance operativo a escala mundial. Esta iniciativa implica el establecimiento de una estructura de mando capaz de coordinar y llevar a cabo operaciones militares a escala internacional. Mediante el despliegue de fuerzas en diversas regiones, las fuerzas armadas británicas pretenden potenciar su influencia global, responder a las amenazas emergentes y contribuir a la seguridad internacional. El Mando Global del Ejército Británico representa un compromiso con una intervención militar proactiva y versátil, en consonancia con la naturaleza cambiante de los desafíos de seguridad mundiales."
 ENG_naval_defense_act_1889_1: "Ley de Defensa Naval de 1889"
 ENG_naval_defense_act_1889_1_desc: "La Ley de Defensa Naval de 1889 fue una ley del Parlamento del Reino Unido. Recibió la sanción real el 31 de mayo de 1889 y adoptó formalmente el estándar de las dos potencias, incrementando la fuerza naval del Reino Unido. Dicho estándar exigía que la Marina Real mantuviera un número de acorazados al menos igual a la fuerza combinada de las dos siguientes armadas más grandes del mundo."
 ENG_naval_defense_act_1889_1_tt: "§RSe cambiará a un espíritu nacional temporal durante dos años una vez que seamos la potencia naval del continente.§!"
 ENG_army_special_operations_brigade_idea: "Brigada de Operaciones Especiales del Ejército"
 ENG_army_special_operations_brigade_idea_desc: "La Brigada de Operaciones Especiales del Ejército del Reino Unido constituye una fuerza de élite y altamente especializada dentro de las fuerzas armadas británicas. Integrada por soldados expertamente adiestrados de diversas unidades, esta brigada está diseñada específicamente para misiones no convencionales y de alto riesgo. Equipada con armamento avanzado, un entrenamiento especializado y un compromiso con la versatilidad, la Brigada de Operaciones Especiales del Ejército desempeña un papel fundamental a la hora de hacer frente a amenazas complejas, ejecutar operaciones de precisión y contribuir a la estrategia general de defensa de la nación."
 ENG_allied_basing_efforts_Idea: "Esfuerzos de establecimiento de bases aliadas"
 ENG_allied_basing_efforts_Idea_desc: "La iniciativa de Esfuerzos de establecimiento de bases aliadas plantea un enfoque integral para fortalecer las infraestructuras y los activos estratégicos de las naciones miembros dentro de la alianza. Este programa abarca mejoras esenciales en las redes de transporte, bases aéreas, puertos y otras instalaciones críticas. El Reino Unido, como uno de los principales contribuyentes de la alianza, recibe una mejora sustancial y duradera en su infraestructura, lo que fomenta la eficiencia logística y la preparación estratégica."
 ENG_royal_navy_Idea1: "Marina Real Británica"
 ENG_royal_navy_Idea1_desc: "La Marina Real Británica se erige como una de las principales fuerzas marítimas del mundo, con un célebre legado que se remonta a varios siglos atrás. Reconocida por su adaptabilidad y destreza tecnológica, la Royal Navy desempeña un papel crucial en la salvaguarda de los intereses marítimos del Reino Unido y en la proyección de su poder a escala global."
 ENG_royal_navy_Idea2: "Marina Real Británica"
 ENG_royal_navy_Idea2_desc: "La Marina Real Británica se erige como una de las principales fuerzas marítimas del mundo, con un célebre legado que se remonta a varios siglos atrás. Reconocida por su adaptabilidad y destreza tecnológica, la Royal Navy desempeña un papel crucial en la salvaguarda de los intereses marítimos del Reino Unido y en la proyección de su poder a escala global."
