 spain.15.a: "사태를 수습하자"
 spain.16.t: "우리를 지지하는 카탈루냐인들"
 spain.16.d: "카탈루냐 공동체 내의 영향력 있는 인사와 단체가 중앙 정부에 대한 지지를 표명했습니다. 우리는 호의에 보답하여 일부 자원을 투입해 이들의 목소리를 높여 줄 수 있습니다."
 spain.16.a: "우리가 얻을 수 있는 것은 가져갈 것이다"
 spain.16.b: "우리의 지지 세력에 호응하자"
 spain.17.t: "Catalan Protests"
 spain.17.d: "카탈루냐에서 대규모 시위가 일어났습니다. 군중이 바르셀로나와 헤로나에 모여 중앙 정부에 대한 불만을 표출하고 카탈루냐의 분리 독립을 요구하고 있습니다. 대응책을 정해야 합니다. 불만을 마음껏 토로하게 두어 분리주의 운동이 탄력을 받을 위험을 감수할 것인지, 아니면 반대 의견을 진압하려 시도할 것인지 결정해야 합니다."
 spain.17.a: "그들의 체제에서 그들을 끌어내리자"
 spain.17.b: "평화를 지속하자"
 spain.17.c: "탄압해라"
 spain.18.t: "Catalan Riots"
 spain.18.d: "카탈루냐의 시위가 극단주의 세력과 기회주의자들에 의해 대규모 폭동으로 변질되며 파괴적으로 번졌습니다. 도시의 혼란 속에서 우리는 통제를 완화하거나, 폭도를 해산시키기 위해 특수 진압 부대를 투입해야 합니다."
 spain.18.a: "그들의 체제에서 그들을 끌어내리자"
 spain.18.b: "기동대를 배치시켜라"
 spain.19.t: "경찰과 충돌하는 카탈루냐인들"
 spain.19.d: "카탈루냐의 폭도들이 경찰의 투입에 폭력으로 맞섰습니다. 폭도들이 도시에 평화를 되찾으려는 경찰의 시도에 맞서 즉석 무기를 동원하면서 바르셀로나는 전쟁터처럼 보입니다. 도시에 광범위한 피해가 발생했으며 여러 명의 사망자가 보고되었습니다."
 spain.19.a: "사태를 수습하자"
 spain.20.t: "우리를 지지하는 안달루시아인"
 spain.20.d: "안달루시아 공동체 내의 영향력 있는 인사와 단체가 중앙 정부에 대한 지지를 표명했습니다. 우리는 호의에 보답하여 일부 자원을 투입해 이들의 목소리를 높여 줄 수 있습니다."
 spain.20.a: "우리가 얻을 수 있는 것은 가져갈 것이다"
 spain.20.b: "우리의 지지 세력에 호응하자"
 spain.21.t: "Andalusian Protests"
 spain.21.d: "안달루시아에서 대규모 시위가 일어났습니다. 군중이 세비야와 말라가에 모여 중앙 정부에 대한 불만을 표출하고 안달루시아의 분리 독립을 요구하고 있습니다. 대응책을 정해야 합니다. 불만을 마음껏 토로하게 두어 분리주의 운동이 탄력을 받을 위험을 감수할 것인지, 아니면 반대 의견을 진압하려 시도할 것인지 결정해야 합니다."
 spain.21.a: "그들의 체제에서 그들을 끌어내리자"
 spain.21.b: "평화를 지속하자"
 spain.21.c: "탄압해라"
 spain.22.t: "Andalusian Riots"
 spain.22.d: "안달루시아의 시위가 극단주의 세력과 기회주의자들에 의해 대규모 폭동으로 변질되며 파괴적으로 번졌습니다. 도시의 혼란 속에서 우리는 통제를 완화하거나, 폭도를 해산시키기 위해 특수 진압 부대를 투입해야 합니다."
 spain.22.a: "그들의 체제에서 그들을 끌어내리자"
 spain.22.b: "기동대를 배치시켜라"
 spain.23.t: "Clashes With Police In Andalusia"
 spain.23.d: "안달루시아의 폭도들이 경찰의 투입에 폭력으로 맞섰습니다. 폭도들이 도시에 평화를 되찾으려는 경찰의 시도에 맞서 즉석 무기를 동원하면서 세비야는 전쟁터처럼 보입니다. 도시에 광범위한 피해가 발생했으며 여러 명의 사망자가 보고되었습니다."
 spain.23.a: "사태를 수습하자"
 spain.50.t: "투우 경기에 대한 의문"
 spain.50.d: "투우는 스페인에서 길고 활기찬 역사를 지녀 왔습니다. 최근 몇 년간 인기가 서서히 떨어지기 시작했지만 여전히 상당히 인기가 있습니다. 그러나 스페인에는 이 스포츠를 학대적이고 시대에 뒤떨어진 것으로 보는 세력이 있습니다. 투우는 스페인 문화의 일부로서 어느 정도 헌법적 근거를 유지하고 있으며, 따라서 법으로 보호받습니다. 투우에 대해 어떤 입장을 취해야 하겠습니까?"
 spain.50.a: "경기를 금지해라"
 spain.50.b: "소를 죽이는 것을 막아라"
 spain.50.c: "전통을 계속 이어갈 수 있도록 해주자"
 spain.51.t: "Court Calls Ban Unconstitutional"
 spain.51.d: "스페인 헌법재판소는 투우 금지가 위헌이라고 판결했습니다. 그들은 투우가 스페인 문화유산의 필수적인 일부라고 주장합니다. 우리는 패배를 인정해야 하겠습니까, 아니면 법원의 결정에 이의를 제기해야 하겠습니까?"
 spain.51.a: "금지 정책을 철회해라"
 spain.51.b: "헌법 재판소의 주장에 반대하자"
 spain.52.t: "황소의 생명을 담보하는 것이 위헌이라고 주장하는 헌법 재판소"
 spain.52.d: "스페인 헌법재판소가 투우에 관한 우리의 최근 입법을 검토했습니다. 그들은 소를 죽이지 않는 것이 투우의 본질에 어긋난다고 판단했으며, 따라서 위헌으로 결정했습니다. 우리는 패배를 인정해야 하겠습니까, 아니면 법원의 이 결정에 이의를 제기해야 하겠습니까?\n"
 spain.52.a: "황소의 생명 담보를 철회하자"
 spain.52.b: "헌법 재판소의 주장에 반대하자"
 spain.53.t: "입장을 표명하는 법원"
 spain.53.d1: "법원은 오늘 앞서 제안된 금지 조치가 계속 시행될 것이라고 발표했습니다. 이는 앞으로 영구히 유지될 것입니다."
 spain.53.d2: "법원은 투우 관련 입법이 위헌이라고 결정했습니다. 이제 우리의 금지 조치를 폐지하고 현행 입법을 무효화하는 절차에 들어갑니다."
 spain.53.a: "현상 유지한다"
 spain.53.b: "모든 변동을 철회하라."
 spain.54.t: "투우 경기에 대한 국민투표"
 spain.54.d: "[SPR.GetLeader] 및 정부는 투우 문제를 처리하는 최선의 방법이 국민투표라고 결정했습니다. 핵심 입법에 대해 국민에게 투표권을 부여하면 법원의 이의 제기 없이 통과되도록 보장할 충분한 여지가 생길 것입니다."
 spain.54.a: "국민투표를 개최하자"
 spain.55.t: "총 선거"
 spain.55.d: "오늘은 최근 입법에 대해 투표하는 날입니다. 이제 투표에 부칠 때입니다!"
 spain.55.a: "집계를 시작하자!"
 spain.56.t: "결과 발표"
 spain.56.d: "국민 투표 결과 그들은 투우 경기에 대한 정부의 정책 방향을 지지하는 것으로 드러났습니다. 또 한번 민주주의가 빛을 발하고 있습니다."
 spain.56.d2: "우리 국민들은 오늘 투우 경기에 대한 우리의 최근 결정을 철회할 수 있는 과반수의 지지를 확인하며, 우리의 결정을 완전히 뒤집었습니다."
 spain.56.a: "또 하나의 사안이 이렇게 마무리되는군"
 spain.57.t: "왕좌에 대한 의문"
 spain.57.d: "현 지배 왕조인 부르봉 가문은 18세기부터 스페인을 다스려 왔습니다. 그러나 가장 유력한 왕위 요구자 가운데 하나가 카를로스파입니다. 충분한 인기를 얻고 새 법을 통과시킬 수 있다면 카를로스파가 스페인 왕좌에 오르는 모습을 볼 수 있습니다.\n"
 spain.57.a: "카를로스파는 다시 한번 빛을 발할 것이다"
 spain.57.b: "부르봉 가문이 우리를 섬길 것이다"
 spain.58.t: "The Constitution Reformed"
 spain.58.d: "군주들에게 요청한 모습대로 헌법을 개혁할 기회가 주어졌습니다. 군주들은 어떤 길을 택해야 하겠습니까?"
 spain.58.a: "새로운 입헌 군주제"
 spain.58.b: "절대 군주제"
 spain.59.t: "Democratic Constitutionalism"
 spain.59.d: "군주제는 민주적 요소를 포함하는 새 헌법을 마련했습니다. 국민은 투표권을 유지합니다. 그러나 승인된 정당에 대해서만 투표할 수 있습니다. 이러한 잠재적 정당들은 §Y[Western_Autocracy_L]§!와(과)의 공동 통치를 가능하게 할 것입니다."
 spain.59.a: "군주 공화정이 빛을 발할 것이다"
 spain.60.t: "이베리아 연방의 결성"
 spain.60.d: "이베리아 반도는 이 세계가 목격한 가장 큰 제국 두 곳의 중심지였습니다. 이 연합을 선포함으로써 우리가 이룰 수 있는 힘과 영광을 상상해 보십시오. 이제 우리의 앞길을 열고 이베리아 연합을 선포할 때입니다."
 spain.60.a: "연방을 선포하자"
 spain.61.t: "새로운 이베리아 연방을 선포하는 [FROM.GetName]"
 spain.61.d: "스페인은 스스로를 이베리아의 새로운 중심지로 선언했으며, 그 결과로 이제 [FROM.GetName](이)라고 선포했습니다. 이베리아는 이제 그들이 차지할 몫이며, 왕실은 수십 년 전의 영유권 주장을 다시 꺼낼 준비를 하고 있습니다."
 spain.61.a: "흥미로운 전개로군."
 spain.62.t: "우리의 왕좌를 요구하는 [FROM.GetName]"
 spain.62.d: "[FROM.GetName](이)가 우리의 왕좌를 요구했습니다. 그들은 왕좌를 양도하거나 멸망하라는 최후통첩을 제시했습니다. 어떻게 진행해야 하겠습니까?"
 spain.62.a: "왕좌를 양보하자"
 spain.62.b: "꺼져라 이 부르봉아"
 spain.62.c: "꺼져라 이 카를로스들아"
 spain.63.t: "우리를 인정하는 [FROM.GetName]"
 spain.63.d: "[FROM.GetName](이)가 우리에게 포르투갈 왕좌를 양도했습니다. 땅의 운명과 법치는 현재 왕실이 다음에 무엇을 하느냐에 달려 있습니다. §Y[Monarchist_L]§!은(는) 수개월 전에 이 땅에 대한 영유권을 주장했으나, 한편으로는 새로 정복한 영토의 통치에 대해서도 고민하고 있습니다. 당분간 포르투갈이 스스로 통치하도록 허용해야 하겠습니까, 아니면 직접 통치해야 하겠습니까?"
 spain.63.a: "왕좌가 새로운 빛을 발할 것이다"
 spain.63.b: "이제 포르트갈 정부가 통치할 수 있겠지"
 spain.64.t: "양보를 거부하는 [FROM.GetName]"
 spain.64.d: "[POR.GetAdjective] 측이 우리에게 반기를 들었습니다. 이는 최상급의 모욕이며 즉각 바로잡아야 합니다. 군을 준비하십시오. 전쟁의 나팔이 울리기 시작합니다!"
 spain.64.a: "Invade the Inferior Portuguese"
 spain.65.t: "안도라에서의 행진"
 spain.65.d: "스페인이 안도라 국경 밖에 대규모 병력을 배치했습니다. §Y[Monarchist_L]§!은(는) 우리 영토에 대한 영유권을 주장하는 오래전 잊힌 법 조항을 인용합니다. 어떻게 진행해야 하겠습니까? 이 더 큰 적에 맞서야 하겠습니까, 아니면 그들의 요구에 굴복해야 하겠습니까?"
 spain.65.a: "스페인에게 굴복하자"
 spain.65.b: "스페인인들을 거부한다"
 spain.66.t: "수긍하는 [FROM.GetName]"
 spain.66.d: "[FROM.GetName](이)가 우리에게 굴복했습니다. 우리 군은 이제 안도라라베야를 점령 중이며 행정부는 이 도시 국가를 최대한 신속히 통합하기 위해 작업 중입니다. 시간은 제한적이지만 곧 통합될 것이며, 이 지역은 우리의 통치 아래에서 다시 안정을 찾을 것입니다."
 spain.66.a: "$spain.63.a$"
 spain.67.t: "[FROM.GetName]의 반항"
 spain.67.d: "[FROM.GetName](이)가 우리에게서 타고난 권리를 부정했으며, 이는 우리가 수 세기 동안 거부당해 온 것입니다. 안도라를 통치하는 불법 점령자들은 굴복시켜야 합니다. 우리 제국의 이 핵심적인 기반을 영원히 손에서 놓치기 전에 되찾을 때입니다."
 spain.67.a: "안도라라벨랴는 우리 것이 될 것이다!"
 spain.68.t: "암초를 요구하는 [FROM.GetName]"
 spain.68.d: "스페인은 한때 지브롤터를 다스렸으며 수십 년 동안 반환을 주장해 왔습니다. 우리는 1700년대부터 이 바위산을 보유해 왔지만, 그들은 여전히 스페인으로의 반환을 요구하고 있습니다. 어떻게 진행해야 하겠습니까? 지브롤터를 스페인에 넘겨야 하겠습니까, 아니면 그들이 낮잠이나 한숨 더 자게 두어야 하겠습니까?"
 spain.68.a: "지브롤터를 양보하자"
 spain.68.b: "낮잠이나 자라, 스페인 사람아."
 spain.69.t: "[19.GetName] 지역을 양보하는 [FROM.GetName]"
 spain.69.d: "지브롤터에 이제 다시 스페인 국기가 휘날립니다. [FROM.GetName](은)는 더 이상 우리 국경의 이 고립 영토를 통제하지 못하며, 우리는 지난 수 세기 동안 그랬어야 했던 것처럼 해협을 지배합니다. 외교 정책을 개정하며 위대한 우리나라가 거둔 또 하나의 승리입니다."
 spain.69.a: "$spain.63.a$"
 spain.70.t: "우리의 요구를 거부한 [FROM.GetName]"
 spain.70.d: "[19.GetName]을(를) 소유한 개들이 바위산에 대한 우리의 권리를 부정했습니다. 이 모욕을 바로잡을 준비를 해야 하며, 그렇지 않으면 우리는 세계 무대의 웃음거리가 됩니다. [THIS.GetAdjective] 국기가 바위산 위에 다시 휘날릴 것은 별들에 쓰여 있는 운명입니다."
 spain.70.a: "우리의 적법한 영토를 점령하자!"
 spain.71.t: "부활한 스페인 제국"
 spain.71.d: "[FROM.GetName](이)가 새로운 스페인 제국을 선포했으며, 그들의 영광으로 가는 길은 분명합니다. 죽었던 제국이 세계의 현상 유지가 바뀐 지금 되살아났습니다. 세계는 [SPR.GetLeader]와(과) 그 정부가 이 불안한 시기에도 예측 불가능한 행보를 이어가는 것을 지켜보고 있습니다."
 spain.71.a: "불안한 전개로군"
 spain.72.t: "성소수자에 대한 입장"
 spain.72.d: "스페인은 역사적으로 동성애자 공동체를 둘러싸고 양쪽 입장을 오갔습니다. 프랑코 치하에서는 동성애자를 투옥한 이력이 있으며, 민주주의로 전환하면서 즉각 입장이 뒤바뀌었습니다. 앞으로 나아가면서 이는 널리 퍼진 쟁점입니다. 동성애자 권리에 대한 입장을 되돌려야 하겠습니까, 아니면 앞으로도 계속 지지해야 하겠습니까?"
 spain.72.a: "새로운 입장을 취하자"
 spain.72.b: "현상 유지하자"
 spain.72.c: "동성애를 금지한다"
 spain.73.t: "’부모의 자녀 교육 검열‘ (Pin-Parental) 정책"
 spain.73.d: "핀 패런털 교육이란 학부모가 교육 사안에 대해 \\"거부권\\"을 행사할 수 있는 권한입니다. 우익 세력은 수십 년간 이를 주장해 왔으며, 그에 따라 새로운 입법을 준비하고 있습니다. 새 법안은 학부모가 자녀가 이른바 \\"불필요한\\" 정보에 대한 교육을 받지 못하게 거부할 수 있도록 허용합니다. 이에 대해 어떤 입장을 취해야 하겠습니까?"
 spain.73.a: "전면적인 교육 거부권을 제공하자"
 spain.73.b: "논란의 안건에 대해서는 투표를 진행하자"
 spain.73.c: "사실… 다시 한번 생각해볼 필요가 있겠다"
 spain.74.t: "원주민 보호주의 (Nativism)의 부상"
 spain.74.d: "토착주의가 우리나라에서 서서히 커지기 시작했습니다. 토착주의 개념은 합법이든 불법이든 이민자보다 국가의 국민, 즉 출생 시민을 우선시합니다. 우익 세력의 인기 상승으로 이 운동은 지난 몇 년간 점점 더 힘을 얻었습니다. 정부는 우리나라에서 추구하고자 하는 토착주의의 형태를 선택해야 합니다. 이 운동에 대해 강경한 입장을 취해야 하겠습니까, 아니면 온건한 입장을 취해야 하겠습니까?"
 spain.74.a: "MSGA! MSGA! MSGA!"
 spain.74.b: "스페인에서 태어났다면, 모두 스페인 사람이다"
 spain.75.t: "팔랑헤즘의 귀환"
 spain.75.d: "[SPR.GetLeader]와(과) [Nat_Fascism_L]이(가) 권력을 되찾아 위대한 우리나라에 새로운 질서의 복귀를 시작하면서 우리는 뿌리로 돌아왔습니다. 마드리드에 새로운 새벽이 내려앉으며 파시즘의 귀환이 태양처럼 환히 타오릅니다. [SPR.GetLeader]은(는) [SPR.GetName]의 새 시대를 열고 공화국을 새로운 팔랑헤 국가로 개혁하겠다고 밝혔습니다. 위대한 우리나라에서 불사조가 다시 날아오를 것입니다."
 spain.75.a: "스페인에 영광을!"
 spain.76.t: "팔랑헤즘으로 돌아온 [FROM.GetName]"
 spain.76.d: "[FROM.GetName](은)는 최근 스페인 정부의 격변을 목격했습니다. 팔랑헤당이 다시 한번 스페인 국민을 위한 정부의 책임을 맡았습니다. [SPR.GetLeader]의 당선은 힘겹게 얻은 승리였으나 그럼에도 승리였습니다. 이 변화로 인한 세계의 반향은 시간이 지나야 알 수 있을 것입니다."
 spain.76.a: "음…"
 spain.77.t: "팔랑헤주의 신여성"
 spain.77.d: "남성에게는 남성의 자리가 있고 여성에게도 마찬가지입니다. 우리나라가 이 길을 계속 나아가는 가운데, 우리나라에서 여성의 역할을 결정해야 합니다. 보다 전통적인 기준을 유지하면 인구 증가율이 높아질 것입니다. 그러나 여성의 선택을 허용하면 더 다양한 경제적 기회가 생길 것입니다."
 spain.77.a: "여성도 최전선에 설 수 있도록 하라"
 spain.77.b: "모든 것은 선택에 달렸다"
 spain.78.t: "군주제 폐지"
 spain.78.d: "[SPR.GetLeader] 아래의 새 공산주의 정부가 새로운 안건을 제출했습니다. 그들은 군주제를 폐지하는 입법을 준비하고 있습니다. 그러나 이 혁명적 결정에는 두 가지 갈래가 있어 상황이 불안정합니다. 입법의 첫 번째 방식은 군주를 권좌에서 폐위하는 것이며, 다른 선택지는 왕실이 결코 돌아오지 못하도록 왕가를 집단 처형하는 것입니다. 정부는 어떻게 진행해야 하겠습니까?"
 spain.78.a: "프랑스 방식"
 spain.78.b: "군주제를 끌어내려라"
 spain.79.t1: "왕실을 처형한 [FROM.GetName]"
 spain.79.t2: "왕실을 저버린 [FROM.GetName]"
 spain.79.d1: "[SPR.GetName]의 군주제가 국민의 손에 처형되었습니다. 나라가 공산주의에 한 걸음씩 다가서면서 격변은 입헌 군주제에서 벗어났습니다. [SPR.GetName]은 위태로운 상황에 놓였으며, 세계는 사태가 전개되는 것을 면밀히 지켜볼 것입니다."
 spain.79.d2: "[SPR.GetName]의 군주제는 국민에게 버림받았습니다. [SPR.GetLeader]과(와) 집권 연립은 이제 군주제와 그 구시대적 방식을 폐지할 때라고 판단했습니다. 이러한 변화를 허용하기 위해 헌법을 다시 쓰는 과감한 변화입니다. 세계 모든 나라가 신중한 눈으로 [SPR.GetName]의 상황이 전개되는 것을 지켜보고 있습니다."
 spain.79.a: "[FROM.GetName]의 새로운 행보가 시작되는가?"
 spain.80.t: "신여성의 해방"
 spain.80.d: "우리 여성들은 가장 큰 자산입니다. 여성들을 기존 지위 너머로 해방시키고 법 앞에서 동등한 존재로 공식 인정하여 모든 성차별을 없애면, 여성들은 우리의 새로운 공산주의 사회를 위한 도구가 될 수 있습니다. [SPR.GetName]의 모든 이들이 지금 당장 여성 동지들과 권력을 나누어야 합니다!"
 spain.80.a: "여성의 자유는 국민의 자유이다"
 spain.81.t: "이민법의 개정"
 spain.81.d: "이민 정책을 결정해야 할 때가 되었습니다. 오고자 하는 모든 이에게 국경을 개방하는 방향으로 나아갈 수 있고, 확대된 비자 프로그램으로 부가가치가 높은 노동자를 더 받아들일 수도 있으며, 보다 반이민적인 입장을 취할 수도 있습니다."
 spain.81.a: "모든 이들을 위한 시민권"
 spain.81.b: "비자 시스템"
 spain.81.c: "비자도 없고, 입국도 안된다"
 spain.83.t: "비토리아에서 팔랑헤주의자들의 행진"
 spain.83.d: "팔랑헤당원들이 몇 시간 전부터 비토리아의 거리에서 움직이기 시작했으며 현재 반정부 동조자와 ETA 민족주의자들을 공격하기 위해 집결 중입니다. 준군사 조직은 [SPR.GetLeader]의 명령을 기다리며 준비를 마쳤습니다."
 spain.83.a: "처참한 비토리아의 밤이다"
 spain.83.b: "Round Up the Conspirators"
 spain.84.t: "비토리아에서의 행진"
 spain.84.d1: "비토리아 진군이 끝났습니다. 팔랑헤당원들은 막대한 피해를 입혔고, 비토리아 시는 거리에서 벌어진 전투로 다수의 사상자를 냈습니다. 이는 필요악이지만 우리는 앞으로 나아갈 것입니다."
 spain.84.d2: "바스크 분리주의 운동의 핵심 인물들이 발견되어 비토리아 거리에서 즉결 처형되었습니다. 도시는 분리주의자들의 피로 붉게 물들었으며, 곧 팔랑헤 정부 아래 이 반란 지방에 평화가 찾아올 것입니다."
 spain.84.d3: "청년 셔츠단 병력이 진군하여 바스크 독립을 지지하는 공모자들을 둘러싼 싸움에서 현지 주민과 충돌했습니다. 팔랑헤 준군사 병력이 바스크 지지자들을 압박하면서 상황은 빠르게 폭력으로 치달았고 거리는 순식간에 혼란에 빠졌습니다."
 spain.84.d4: "팔랑헤 정부가 비토리아 거리에서 열렬한 환영을 받는 가운데 독립 지지파 ETA 병력이 오늘 공식적으로 일제 검거되었습니다. 적대 세력은 핵심 인물들이 체포되고 구금되면서 진압되거나 크게 약화되었습니다."
 spain.84.a: "비토리아는 스페인이다"
 spain.85.t: "대형 유조선 ‘프레스티지’ 해상 사고"
 spain.85.d: "폭풍우 속에서 7만 7천 톤의 중유를 싣고 가던 유조선 MV 프레스티지호의 탱크 하나가 파열되었습니다. 이 선박은 이후 갈리시아 해안에서 약 210킬로미터 떨어진 곳에서 침몰했습니다. 약 6만 7천 입방미터의 중유가 유출된 것으로 추정됩니다. 유출은 스페인, 프랑스, 포르투갈 해안의 수천 킬로미터 해안선과 천 곳이 넘는 해변을 오염시켰고 지역 어업에도 막대한 피해를 입혔습니다. 이 유출은 스페인 역사상 최대의 환경 재난입니다."
 spain.85.a: "바다위의 얼룩을 제거해라"
 spain.86.t: "바르셀로나에서의 행진"
 spain.86.d: "팔랑헤 병력이 바르셀로나로 진군할 준비를 마쳤습니다. 이곳은 국내에서 반팔랑헤 압력의 마지막 주요 거점입니다. 분리주의에 맞선 이 마지막 저항의 보루를 제거합니다."
 spain.86.a: "처참한 바르셀로나의 밤이다"
 spain.86.b: "Round Up the Conspirators"
 spain.87.t: "바르셀로나에서의 행진"
 spain.87.d1: "바르셀로나 진군이 끝났습니다. 팔랑헤당원들은 막대한 피해를 입혔고, 바르셀로나 시는 거리에서 벌어진 전투로 다수의 사상자를 냈습니다. 이는 필요악이지만 우리는 앞으로 나아갈 것입니다."
 spain.87.d2: "카탈루냐 분리주의 운동의 핵심 인물들이 발견되어 바르셀로나 거리에서 즉결 처형되었습니다. 도시는 분리주의자들의 피로 붉게 물들었으며, 곧 팔랑헤 정부 아래 이 반란 지방에 평화가 찾아올 것입니다."
 spain.87.d3: "청년 셔츠단 병력이 진군하여 카탈루냐 독립을 지지하는 공모자들을 둘러싼 싸움에서 현지 주민과 충돌했습니다. 팔랑헤 준군사 병력이 카탈루냐 지지자들을 압박하면서 상황은 빠르게 폭력으로 치달았고 거리는 순식간에 혼란에 빠졌습니다."
 spain.87.d4: "팔랑헤 정부가 바르셀로나 거리에서 열렬한 환영을 받는 가운데 독립 지지파 카탈루냐 병력이 오늘 공식적으로 일제 검거되었습니다. 적대 세력은 핵심 인물들이 체포되고 구금되면서 진압되거나 크게 약화되었습니다."
 spain.87.a: "Barcelona is Spanish"
 spain.201.t: "아프리카 이주 위기"
 spain.201.d: "아프리카에서는 빈곤, 열악한 통치, 거듭되는 내부 불안정, 잘못 관리된 경제, 분쟁이 이른바 경제 이주민과 난민을 낳았습니다. 노동력의 급속한 증가와 더딘 고용 증가가 맞물려 청년의 이주를 촉발합니다. 질 낮은 교육과 기술 부족은 청년의 고용 기회를 제한합니다. 세우타와 멜리야는 스페인의 일부이며 따라서 유럽 연합의 일부이기도 하므로, 아프리카 이주민들은 EU 영토에 \\"진입\\"하여 난민 지위를 주장하려 합니다."
 spain.201.a: "단 한명도 들어오지 못하게 막아라"
 spain.201.b: "모두 들여보내라"
 spain.201.c: "일부를 들여보내자"
 spain.202.t: "세우타 지역에서 난동을 피운 아프리카 이주자들"
 spain.202.d: "세우타의 국경 울타리가 울타리를 넘어 스페인 영토에서 난민 지위를 얻으려는 수백 명의 이주민에게 습격당하고 있습니다. 국제 사회의 눈이 세우타에 쏠려 있으며 우리의 대응을 기다리고 있습니다. 고무탄과 최루가스로 맞설 수도, 국경을 열어 들여보낼 수도 있으며, 정부 내 일부 반이민 세력은 또 다른... 모범적인 제안을 갖고 있습니다."
 spain.202.a: "치명적인 상황은 아니다"
 spain.202.b: "그들을 공격해라"
 spain.202.c: "문을 열어주어라"
 spain.203.t: "멜리야 지역에서 난동을 피운 아프리카 이주자들"
 spain.203.d: "멜리야의 국경 울타리가 울타리를 넘어 스페인 영토에서 난민 지위를 얻으려는 수백 명의 이주민에게 습격당하고 있습니다. 국제 사회의 눈이 멜리야에 쏠려 있으며 우리의 대응을 기다리고 있습니다. 고무탄과 최루가스로 맞설 수도, 국경을 열어 들여보낼 수도 있으며, 정부 내 일부 반이민 세력은 또 다른... 모범적인 제안을 갖고 있습니다."
 spain.203.a: "치명적인 상황은 아니다"
 spain.203.b: "그들을 공격해라"
 spain.203.c: "문을 열어주어라"
 spain.204.t: "후안 카를로스의 퇴위"
 spain.204.d: "높아지는 압박과 고령 속에서 후안 카를로스 국왕은 권좌에서 물러나 아들 펠리페 6세에게 [SPR.GetName]의 왕위를 계승하도록 하기로 결정했습니다. 국왕은 개인적인 사유를 들고 있지만, 왕실을 둘러싼 논란과 특정한 코끼리 사냥 여행에 관해 상당한 의문이 제기되어 왔습니다. 그럼에도 왕관은 40년간의 통치를 마치고 펠리페에게 넘어가게 됩니다."
 spain.204.a: "왕관이 저무는구나"
 spain.205.t: "카를로스 휴고의 죽음"
 spain.205.d1: "카를로스 우고는 1977년 부친으로부터 가문의 수장 자리를 이어받은 이래 스페인 왕위를 요구한 카를로스파의 후계자였습니다. 카를로스주의는 최근 큰 영향력을 행사하지 못했지만, 여전히 스페인 군주주의 진영에서 두드러진 세력입니다."
 spain.205.d2: "국왕 카를로스 우고가 오늘 큰 충격 속에 세상을 떠났습니다. 불행한 사태이며 온 나라에 깊은 슬픔을 안겼습니다. 그는 카를로스파의 대의를 내세워 최근에야 권력을 잡았을 뿐입니다. 역사는 그의 이름을 카를로스파 운동의 주요 인물 가운데 하나로 기억할 것입니다."
 spain.205.a: "카를로스주의는 계속 된다"
 spain.206.t: "시민-시민권당 창설"
 spain.206.d: "정당 시우다다노스는 카탈루냐의 신생 정당으로 최근 신문 머리기사를 장식했습니다. 이 당은 깊은 스페인 민족주의 이념을 표방하는 탈민족주의 자유주의 정당입니다."
 spain.206.a: "시간이 모든 것을 말해주겠지…"
 spain.207.t: "복스 (Vox)의 대두"
 spain.207.d: "복스(라틴어로 \\"목소리\\")는 최근 인기를 얻기 시작한 국민 보수 정당입니다. 이 당은 [conservatism_L]이(가) 너무 \\"자유주의적\\"이라고 평가되어 그로부터 분리되어 결성되었습니다. 당내 분열은 신보수주의 또는 사회적 보수주의 성향의 국민당 당원들에게서 갈라져 나온 것입니다. 이 신당의 주요 주장 가운데 일부는 지역 자치와 지역 의회를 폐지하도록 스페인 헌법을 고쳐 쓰는 것입니다. 이는 현재의 정치 환경과 극명한 차이를 보이며 앞으로 다가올 시대를 예고합니다."
 spain.207.a: "흥미롭군."
 spain.208.t: "’스페인 2000‘의 창설"
 spain.208.d: "에스파냐 2000은 스스로를 포퓰리즘 성향으로 규정하는 극우 정당이며, 가족 수호를 중심으로 사회민주주의와 보수주의를 혼합한 노선을 주장합니다. 이 당은 스페인 경제에 대해 강경한 유럽회의주의, 반세계화, 보호무역주의적 정서를 계속 유지하고 있습니다. 호세 루이스 로베르토는 스페인의 주요 보수 세력과 구별되기 위해 국민당(PP)에서 이탈해 이 당을 결성했습니다."
 spain.208.a: "우익 주의의 물결이구만"
 spain.209.t: "스페인의 대안 (AES)의 창당"
 spain.209.d: "라파엘 로페스디에게스가 오늘 스페인에서 새로운 정당을 선언하며 뉴스에 올랐습니다. 스페인 대안(알테르나티바 에스파뇰라)은 스스로를 사회적 기독교 정당이자 전 계층 정당으로 설명하는 새로운 우익 정당입니다. 당의 정치 강령은 \\"생명 수호\\"(낙태에 대한 전반적 반대), 친가족, 확고한 기독교적 뿌리, 새로운 스페인의 통합을 논합니다. 이 당은 전 계층 정당이라 규정하지만, 사회 및 경제 문제에서 좌파 성향이라 밝히고 있음에도 확연히 우파에 속합니다."
 spain.209.a: "새로운 도전자군"
 spain.210.t: "무대에 오른 연합 포데모스 (Unidos Podemos)"
 spain.210.d: "우니도스 포데모스는 에쿠오, 통일 좌파, 포데모스 정당들의 연합체입니다. 세 좌익 정당은 하나의 좌익 정당으로서 스페인 선거에 출마하기 위해 공통의 대의 아래 뭉쳤습니다. 이 당은 스스로를 좌익 포퓰리즘 정당으로 칭하며 강한 민주사회주의 사상을 표방합니다."
 spain.210.a: "새로운 좌익 세력이군"
 spain.211.t: "새로운 이름"
 spain.211.d: "우니도스 포데모스의 창립자 파블로 이글레시아스는 다가오는 선거를 앞두고 우니도스 포데모스에서 우니다스 포데모스로 당명을 변경한다고 발표했습니다."
 spain.211.a: "환상적이야"
 spain.212.t: "리콴유 세계 도시 상 (Lee Kuan Yew World City Prize)을 받은 빌바오"
 spain.212.d: "빌바오 시가 리콴유 세계 도시상의 최신 수상자로 발표되었습니다. 도시 국가 싱가포르가 수여하는 이 상은 흔히 도시학 분야의 노벨상이라 불립니다. 1990년대 이후 빌바오의 발전은 눈부신 성공을 거두었으며 그 노력을 인정받았습니다."
 spain.212.a: "빌바오에게 축복을!"
 spain.213.t: "루고의 로마시대 성벽 (Lugo's Roman Walls)이 세계문화유산에 지정되다"
 spain.213.d: "루고의 로마 성벽은 3세기에 건설되어 건설 이래 대부분 온전하게 남아 있습니다. 성벽은 갈리시아 루고의 역사 지구를 따라 2킬로미터 넘게 뻗어 있습니다. 이 오랜 요새는 세계와 인류의 문화 기념물로서 유네스코 세계유산 목록에 등재되었습니다."
 spain.213.a: "놀라운 전개로군"
 spain.214.t: "마드리드에서 차량 폭파를 감행한 ‘바스크 조국과 자유 (ETA)’"
 spain.214.d: "25킬로그램의 폭발물을 실은 차량 폭탄이 마드리드의 코라손 데 마리아 거리에서 폭발했습니다. ETA는 정부 관리 후안 훈케라를 노린 것으로 보이며 그는 목숨을 건졌습니다."
 spain.214.a: "비극이군"
 spain.215.t: "바타수나 (Batasuna) 금지"
 spain.215.d: "스페인 대법원은 바스크 정당 \\"바타수나\\"를 불법으로 선언했습니다. 스페인 헌법재판소는 이 결정을 확인했습니다. 바타수나는 ETA와의 연관을 부인하지만, 다수의 바타수나 지도자들이 ETA 활동으로 투옥되었습니다. 이 금지 조치는 그들의 대표가 선거에 출마하거나 공개 시위 또는 집회를 여는 것을 금지하며 자산을 동결합니다."
 spain.215.a: "진작 해야될 것이었다"
 spain.216.t: "좌절된 ‘바스크 조국과 자유’의 기차 공격"
 spain.216.d: "ETA가 크리스마스 이브에 마드리드의 붐비는 차마르틴 역에서 50킬로그램의 폭발물을 터뜨리려 시도했습니다. 경찰은 산세바스티안에서 마드리드행 열차에 28킬로그램의 폭발물을 싣던 ETA 조직원을 저지하여 시도를 좌절시켰습니다. 이후 부르고스 근처를 지나 마드리드로 향하던 두 번째 열차에서 20킬로그램이 넘는 폭발물이 든 또 다른 폭탄이 발견되었습니다. 발견되지 않은 추가 공격이 없다고 확신할 때까지 해당 지역의 철도 노선을 폐쇄했습니다."
 spain.216.a: "최소한의 피해였다"
 spain.217.t: "마드리드-바라자 공항 폭팔"
 spain.217.d: "500~800킬로그램을 실은 승합차 폭탄이 마드리드 바라하스 공항 T4 터미널에서 폭발하여 2명이 사망하고 52명이 부상을 입었습니다. ETA가 이 공격의 책임을 주장했습니다. 공격으로 공항 터미널이 파손되었고 주차 구조물 전체가 파괴되었습니다."
 spain.217.a: "또 하나의 비극이다"
 spain.218.t: "바스크 자결권에 대한 국민 투표의 부정 부패"
 spain.218.d: "스페인으로부터의 자결에 관한 자문적 국민투표가 스페인 헌법재판소에서 불법으로 판결되었습니다. 바스크 민족당 내부에서도 일부는 이 투표가 현재 쇠퇴 중인 ETA를 강화할 것으로 여겨 반대했습니다."
 spain.218.a: "국민투표는 언제나 참혹한 결말이지"
 spain.219.t: "주르단 마르티게티의 체포"
 spain.219.d: "ETA의 특공대 지휘자 주르단 마르티테기 리사소가 프랑스 경찰에 체포되었습니다. 그는 ETA에서 가장 위험한 조직원 가운데 하나로 여겨지며, 이 체포는 조직의 폭력을 크게 줄일 것입니다."
 spain.219.a: "또 너냐?"
 spain.220.t: "국가헌병대 본부 앞에서 발생한 차량 폭격"
 spain.220.d: "칼비아와 부르고스의 치안군 사무소 밖에서 차량 폭탄 두 대가 폭발했습니다. 2명이 사망하고 여성과 어린이를 포함해 65명이 부상을 입었습니다. ETA가 이 공격의 책임을 주장했습니다."
 spain.220.a: "또 하나의 비극이구만..."
 spain.221.t: "'바스크 조국과 자유' 측과의 영구적인 정전"
 spain.221.d: "ETA는 4개월 전에 선언한 휴전이 이제 \\"영구적이며 전면적\\"이라고 선언했습니다. 이 조직이 결성된 이래 ETA의 폭력으로 800명이 넘는 사람이 숨졌지만, 이제 공포가 끝난 것으로 보입니다."
 spain.221.a: "정말 끝난 것인가?"
 spain.222.t: "제헌절의 폭발"
 spain.222.d: "알리칸테, 아빌라, 시우다드레알, 레온, 말라가, 산티야나 델 마르, 바야돌리드 시에서 소형 폭탄이 터졌습니다. 공격은 헌법의 날 기념행사와 시기가 겹쳤습니다."
 spain.222.a: "Luckily No One Was Killed"
 spain.223.t: "마드리드에서 또 다른 차량 폭격"
 spain.223.d: "염소산염 30킬로그램을 실은 흰색 르노 19가 마드리드의 기업 사무소 두 곳 옆에서 폭발했습니다. 42명이 부상을 입었습니다."
 spain.223.a: "또 이런 짓을!"
 spain.230.t: "카탈루냐 자치권 법령"
 spain.230.d: "카탈루냐 정부는 새로운 자치 헌장을 공식 발표했습니다. 헌장 개정으로 카탈루냐의 상징 규정이 전면적으로 바뀌었고, 카탈루냐어를 이 지역의 언어로 선언했으며 스페인 헌법과는 별개로 헌장이 수호하는 특정 권리가 만들어졌습니다. 그러나 논란이 없지 않았습니다. 헌장은 서문에서 카탈루냐를 \\"민족\\"으로 선언하여 구별하고 있습니다."
 spain.230.a: "원래 그런 법 아니겠나."
 spain.230.b: "Identity Obsession is a Monster"
 spain.231.t: "법령을 개정하는 헌법재판소"
 spain.231.d: "카탈루냐 헌장은 지난 몇 년간 정치적 반대자들 등으로부터 거센 검증을 받았습니다. 법원은 6대 4로 헌장의 14개 조항을 다시 쓰고 27개 조항을 추가 해석하도록 결정했습니다. 카탈루냐 주민들은 한결같이 법원에 대한 시위를 시작했습니다. 이 결정이 나라에 무엇을 의미하게 될지는 시간이 말해 줄 것입니다..."
 spain.231.a: "어떤 결과가 기다리고 있을까?"
 spain.232.t: "2010년의 시위"
 spain.232.d: "올해 초 헌법재판소는 민족주의적 정서를 줄이기 위해 카탈루냐 자치 헌장을 수정하도록 판결했습니다. 오늘 카탈루냐 주민들은 카탈루냐 자치의 제한과 법원의 결정에 반대하며 바르셀로나 중심가를 가득 메우고 행진했습니다. 바르셀로나 시위에는 110만 명에서 150만 명 사이가 참석한 것으로 추산됩니다."
 spain.232.a: "경찰을 동원해라"
 spain.232.b: "뭐라고 하는지 들어나 보자"
 spain.232.c: "수뇌부들과 협상을 진행하자"
 spain.233.t: "독립을 요구하는 카탈루냐인들"
 spain.233.d: "카탈루냐 주민들이 다시 한번 바르셀로나의 거리로 나섰습니다. 카탈루냐 국민은 마드리드의 통치에 점점 더 불만을 품고 있습니다. 한때는 자치 헌장의 축소에 항의하는 시위였지만, 이제는 노골적으로 독립을 요구하고 있습니다. 그들이 원하는 것을 들어줘야 하겠습니까?"
 spain.233.a: "그들이 원하는 대로"
 spain.233.b: "통제를 강화해야 한다"
 spain.234.t: "카탈루냐 독립의 길 (The Catalan Way)"
 spain.234.d: "카탈루냐의 시위가 계속해서 지역을 뒤흔들고 있습니다. 긴장이 쌓이고 고조되고 있으며 카탈루냐 주민 사이의 상황을 더욱 악화시킬 뿐입니다. 이번 시위에는 독립을 지지해 시위하고 행진한 카탈루냐 주민이 150만 명 가까이에 달했습니다."
 spain.234.a: "경찰을 동원해라"
 spain.234.b: "뭐라고 하는지 들어나 보자"
 spain.234.c: "수뇌부들과 협상을 진행하자"
 spain.235.t: "2014년 '카탈루냐 독립의 길'"
 spain.235.d: "카탈루냐의 시위가 계속해서 지역을 뒤흔들고 있습니다. 긴장이 쌓이고 고조되고 있으며 카탈루냐 주민 사이의 상황을 더욱 악화시킬 뿐입니다. 이번 시위에는 독립을 지지해 시위하고 행진한 카탈루냐 주민이 200만 명 가까이에 달했습니다. 이 독립 시위는 훨씬 더 큰 무언가의 전조이며, 어떻게 될지는 시간이 말해 줄 것입니다."
 spain.235.a: "경찰을 동원해라"
 spain.235.b: "뭐라고 하는지 들어나 보자"
 spain.235.c: "수뇌부들과 협상을 진행하자"
 spain.236.t: "자결권에 대한 총선거"
 spain.236.d: "카탈루냐 정부는 오늘 카탈루냐의 독립에 관한 국민투표를 개최했습니다. 이 역사적인 투표에 참여한 이들은 압도적으로 독립에 찬성했습니다. 이 국민투표는 법적 자문으로 간주되며 독립에 대한 법적 구속력은 없습니다."
 spain.236.a: "경찰을 동원해라"
 spain.236.b: "뭐라고 하는지 들어나 보자"
 spain.236.c: "수뇌부들과 협상을 진행하자"
 spain.237.t: "앞장서라, 카탈루냐 공화국이여!"
 spain.237.d: "사람들이 다시 한번 독립을 지지하며 거리로 나섰습니다. 최근 당선된 카를레스 푸지데몬은 카탈루냐 독립 운동에 새 생명을 불어넣었습니다. 이러한 흐름의 변화는 다가올 화약고를 터뜨렸습니다. 바르셀로나의 거리에서 백만 명이 다시 한번 자신들의 목소리를 내고 있습니다."
 spain.237.a: "경찰을 동원해라"
 spain.237.b: "뭐라고 하는지 들어나 보자"
 spain.237.c: "수뇌부들과 협상을 진행하자"
 spain.238.t: "카탈루냐의 독립 선언"
 spain.238.d: "카탈루냐 의회가 카탈루냐를 독립 국가로 선언했습니다. 정부 수반 카를레스 푸지데몬은 국민의 뜻에 따라 행동하여 스페인으로부터의 분리를 시작했습니다. 어떻게 대응해야 하겠습니까? 카탈루냐 주민들이 스페인을 떠나도록 두어야 하겠습니까?"
 spain.238.a: "카탈루냐를 해방한다"
 spain.238.b: "카탈루냐 의회를 해체시켜라"
 spain.239.t: "Carles Puigdemont Flees"
 spain.239.d: "반역자 카를레스 푸지데몬과 카탈루냐 정부의 다른 핵심 인물들은 체포 영장을 피해 스페인에서 도주했습니다. 벨기에 등 북쪽으로 사라진 그는 당분간 우리의 사법권에서 벗어났습니다..."
 spain.239.a: "개자식."
 spain.240.t: "카탈루냐 독립 지도자에 대한 재판"
 spain.240.d: "카탈루냐의 주요 독립 지도자들이 2017년 독립 선언에서의 행동과 참여에 대해 오늘 재판을 받습니다. 이제 이 반란 가담자들을 단호하게 사법 처리할 때입니다. 법원은 피고인 아홉 명이 9년에서 13년의 징역형을 살게 된다고 선고했습니다."
 spain.240.a: "속이 시원하군."
 spain.241.t: "대규모 카탈루냐 시위"
 spain.241.d: "카탈루냐 주민들이 스페인 정부에 항의하기 위해 다시 한번 거리로 나섰습니다. 독립 지도자들의 재판이 바르셀로나에 걷잡을 수 없는 분란을 일으키면서, 그들은 권력 남용 등을 거론하고 있습니다. 사람들은 독립과 자결권을 외치고 있습니다."
 spain.241.a: "경찰을 동원해라"
 spain.241.b: "뭐라고 하는지 들어나 보자"
 spain.241.c: "수뇌부들과 협상을 진행하자"
 spain.242.t: "분리주의자들의 사면"
 spain.242.d: "[SPR.GetLeader]은(는) 예상과는 전혀 다른 길을 택했습니다. 정부 정책의 전환으로, 징역 전에 2년을 선고받은 분리주의자들에게 사면을 내렸습니다. [SPR.GetLeader]이(가) 분리주의자들을 사면한 조치는 카탈루냐와 마드리드의 스페인 정부 사이의 관계를 회복하는 데 결정적인 조치입니다."
 spain.242.a: "함께 우리는 일어설 것이다"
 spain.243.t: "국가 주도 테러를 통제하는 법정"
 spain.243.d: "In a massive change of pace, the courts have declared the Spanish State committed acts of state-sponsored terrorism on Antonio Cubillo. A prominent Canary Islands secessionist with their attempted assassination. It is the first example of the state being recognized as committing acts of terrorism against the people of Spain. How should we proceed?"
 spain.243.a: "법정을 무시하자"
 spain.243.b: "피해에 대해 보상해주자"
 spain.244.t: "안토니오 쿠빌리오의 사망"
 spain.244.d: "카나리아 제도 독립 운동의 창립자가 오늘 산타크루스데테네리페의 자택에서 82세로 별세했습니다. 카나리아 제도 주민들은 그들 문화의 등대이자 카나리아 독립 운동의 얼굴이었던 그를 애도합니다. 그는 프랑코 정권의 박해를 피해 알제리로 망명하여 그곳에서 독립 운동을 시작하며 충만한 삶을 살았습니다. 1978년에는 스페인 내무 당국과 연루된 암살 시도로 불구가 되었으나 삶을 이어갔습니다. 그의 노력은 카나리아 제도의 독립이라는 면에서 큰 결실을 보지 못했지만, 독립에 대한 생각은 카나리아 제도 주민들의 마음과 정신 속에서 더욱 밝게 타오르고 있습니다."
 spain.244.a: "국가 주도의 장례식을 열어라"
 spain.244.b: "카나리아인들에게 슬픈 날이구만"
 spain.245.t: "메트로폴 파라솔 프로젝트"
 spain.245.d: "메트로폴 파라솔은 생산의 극대화를 위해 세비야 시로부터 정부에 제안된 계획안입니다. 세비야 당국과 개발 위원회는 지상층의 상점을 위한 지하 주차장을 건설하기 위해 위치를 선정하였습니다. 그러나, 건설 도중 로마 및 알-안달루스 시대의 유적이 발견되었습니다. 이로써 건설은 즉시 중단되었고 현재까지 그 상태로 남아있었습니다. 시 당국은 이 지역의 개발권을 경매로 내놓았으며, 메트로폴 파라솔이 입찰에 성공하였습니다. 이 프로젝트를 승인해야할까요?"
 spain.245.a: "당장 계약금을 지급해라!"
 spain.245.b: "Endorse it Politically"
 spain.245.c: "멍청한 계획이다"
 spain.246.t: "자금이 요구되는 메트로폴 파라솔 계획"
 spain.246.d: "관리 부실 때문이든 다른 문제 때문이든, 메트로폴 파라솔 사업에는 추가 자금이 필요합니다. 이들은 이를 추가 자원이나 설계 보조에 사용할 수 있습니다. 이 예술가들이 돈을 어떻게 쓰고 있는지는 결코 알 수 없을지도 모릅니다. 어떻게 진행해야 하겠습니까?"
 spain.246.a: "지원해줘라"
 spain.246.b: "No, Make Do"
 spain.247.t: "메트로폴 파라솔 프로젝트 완료"
 spain.247.d: "이제 라스 세타스로 불리는 메트로폴 파라솔 사업이 마침내 완공되었습니다. 마지막 리본이 잘리고 구상된 이래 처음으로 스페인 국민의 입장이 허용되는 장관입니다. 참으로 웅장한 광경입니다."
 spain.248.t: "모로코와의 어업에 대한 거래"
 spain.248.d: "오늘 [SPR.GetLeader]와(과) [MOR.GetLeader]은(는) 모로코 앞바다의 어업 수역에 관한 합의를 마무리하기 시작했습니다. 제시된 합의안은 모로코 대표단에 훨씬 더 유리합니다. 그러나 이것이 그들이 협상할 의향이 있는 마지막 합의입니다. 이 합의는 스페인이 모로코의 EEZ(배타적 경제수역)에 진입하는 어선의 수를 줄이도록 규정합니다."
 spain.248.a: "거래를 수락하자"
 spain.248.b: "거래를 거부하자"
 spain.253.t: "사그라다 파밀리아 성당에 대한 지원"
 spain.253.d: "사그라다 파밀리아는 1882년 3월에 건설이 시작되어 지난 수 세기 동안 계속 작업이 이어져 왔습니다. 1926년에 세상을 떠난 건축가 안토니 가우디가 설계한 현대 건축의 경이입니다. 건축가의 사망으로 건설을 중단해야 하는지는 종종 논쟁거리입니다. 그러나 대부분의 사람들은 완공되면 위대한 모습이 나타날 것이라고 믿습니다. 원한다면 이 사업에 추가 자금을 지원할 수 있습니다."
 spain.253.a: "추가적인 보조금을 제공하자"
 spain.253.b: "이만하면 충분하다"
 spain.254.t: "사그라다 파밀리아 성당의 완공"
 spain.254.d: "마침내 현대 스페인 예술의 정점이 완성되었습니다. 사그라다 파밀리아가 그 영광스러운 모습 그대로 완공되었습니다. 고딕 양식과 곡선적인 아르 누보 형태는 스페인을 위한 또 하나의 기념물이 탄생하는 진정한 아름다움입니다. 이 대성당은 스페인 국민이 신에게 두는 신앙의 증표로 서 있을 것입니다. 참으로 장관입니다."
 spain.254.a: "가우디가 미소짓겠군"
 spain.255.t: "마드리드 열차 폭발"
 spain.255.d: "폭발이 마드리드의 통근 열차 체계를 뒤흔든 진정으로 비극적인 하루였습니다. 폭발로 확인된 사망자만 193명이고 약 2천 명이 부상을 입었습니다. 이는 스페인 역사상 가장 치명적인 테러 공격이자 80년대 이후 유럽에서 가장 치명적인 테러입니다. 이 공격을 실제로 누가 실행했는지에 대해 논의가 있었습니다..."
 spain.255.a: "바스크 조국과 자유 (ETA)를 비난하자"
 spain.255.b: "이슬람주의자들을 비난하자"
 spain.255.c: "사망자들에게 경의를 표하자"
 spain.256.t: "사망자들에 대한 추모"
 spain.256.d1: "국민은 정부의 행동에 대해 의견을 밝혔으며, 스페인 국민에게 해를 끼치려는 자들에게 보다 강경한 조치를 취하지 않겠다는 정부의 선택에 불만을 품고 있습니다. 사람들은 정부가 나약하고 무능하다고 말하고 있습니다."
 spain.256.d2: "정부의 지지하는 태도는 고통받는 국민에게 호평을 받았습니다."
 spain.256.a: "A Day for Mourning"
 spain.257.t1: "바스크 조국과 자유 (ETA)에 대한 비난"
 spain.257.t2: "이슬람주의자들에 대한 비난"
 spain.257.d1: "사람들은 오늘 집권당 이외의 어느 정당이든 권력을 잡기를 외치고 있습니다. 마드리드 열차 폭탄 테러는 분명 ETA의 소행이 아니었음에도, 집권 정부는 우리 국민을 탓했습니다. 역겹고 혐오스럽다는 말이 쏟아지고 있습니다. 이는 앞으로 나아가는 우리에게 실패였습니다."
 spain.257.d2: "사람들은 ETA와 바스크 분리주의자들의 소행이라는 정부의 주장을 지지하기 시작했습니다. 이들은 소셜 미디어로 나가 ETA를 사법 처리하라고 계속 외치고 있습니다. 선거를 확보한 뒤 이 범죄자를 사법 처리한다면 현 집권당의 승리는 보장될 것입니다."
 spain.257.d3: "ETA의 소행이라는 주장은 국민들 사이에서 별다른 반응을 얻지 못했습니다. 큰 변화는 없었고 정부에 대한 지지도 분노도 없었습니다."
 spain.257.d4: "이슬람주의자를 탓한 것은 스페인 정부에 크게 역효과를 낳았습니다. 사람들은 정부가 이슬람 혐오적이고 인종차별적이라고 말하고 있습니다. 우리를 단결시키려던 것이었으나 오히려 분열시켰을 뿐입니다."
 spain.257.d5: "사람들은 급진적 이슬람 세력이 스페인에 대한 공격을 일으켰다는 주장을 압도적으로 지지했습니다. 우리를 덮친 비극은 국민을 현 집권당 뒤에 단결시켰고 표심을 흔들 가능성이 높습니다."
 spain.257.d6: "이슬람주의자의 소행이라는 주장은 스페인 정치권에서 별다른 반응을 얻지 못했습니다. 큰 변화는 없었고 정부에 대한 지지도 분노도 없었습니다."
 spain.257.a: "비통한 날이다"
 spain.258.t: "좌절된 바르셀로나 테러 모의"
 spain.258.d: "바르셀로나에서 발생할 수 있었던 테러 공격과 관련하여 오늘 일찍 용의자 14명이 체포되었습니다. 이 조직은 바르셀로나 지하철 체계에서 자살 조끼를 터뜨려 도시 기반시설에 전례 없는 피해를 줄 계획이었습니다. 이는 스페인, 독일, 프랑스, 포르투갈, 영국에 걸친 일련의 공격의 촉매가 되도록 의도되었습니다. 다행히 오늘 치안군과 정보 기관이 공격을 저지했습니다."
 spain.258.a: "경관들에게 훈장을 수여해라!"
 spain.259.t: "바르셀로나 테러 공격"
 spain.259.d: "어제 알카나르에서 폭발물을 준비하던 중 폭발이 일어나 용의자 두 명이 사망했습니다. 이 두 용의자의 공범들이 오늘 바르셀로나 라스 람블라스에서 보행자들을 향해 차량을 돌진시켜 14명이 사망하고 최소 130명이 부상을 입었습니다. 이 공격은 2004년 마드리드 열차 폭탄 테러 이후 스페인에서 가장 치명적입니다. 급진 이슬람 세력은 이를 이슬람의 승리라고 주장하고 있으며, 우리는 상처를 추스르기에도 간신히 버티고 있습니다..."
 spain.259.a: "비극의 연속이군…"
 spain.260.t: "야외 테라스를 자차로 들이받은 남성"
 spain.260.d: "오늘 27세의 남성이 차량을 레스토랑 테라스로 돌진시켜 한 명이 사망하고 다섯 명이 부상을 입었습니다. 운전자는 충돌 직후 사망했으며, 추가적인 테러 공격에 대한 우려가 커짐에 따라 국가가 큰 충격에 휩싸였습니다. 이번 사건은 지하디스트 테러리즘 행위로 선언되었습니다."
 spain.260.a: "슬픈 날이다…"
 spain.261.t: "지브롤터 자주권에 대한 국민 투표"
 spain.261.d: "지브롤터가 [19.OWNER.GetName]을(를) 떠날지 여부를 결정하기 위해 또 한 번 국민투표를 실시했습니다. 국민투표는 지브롤터 주민이 스페인에 합류하기를 원하는지 결정하기 위해 [GetDateText]에 실시되었습니다. 주민들은 압도적으로 [19.OWNER.GetName]에 남는 쪽에 찬성했습니다. 결과에 이의를 제기해 보아야 하겠습니까?"
 spain.261.a: "국민 투표에 대응해라"
 spain.261.b: "놔둬라"
 spain.262.t: "지브롤터 국민 투표에 대해 의문을 제기하는 스페인 정부"
 spain.262.d: "최근의 국민투표는 우리 정부와 [SPR.GetName] 정부 사이 긴장의 초점이 되었습니다. 그들은 허위 정보와 무효한 국민투표가 이루어졌다고 주장하며 주민들이 [SPR.GetName]에 합류하도록 허용해야 한다고 합니다. [SPR.GetLeader]은(는) \\"지브롤터 주민은 스페인인입니다. 고향으로 돌아오게 하십시오.\\"라고 말한 것으로 인용되었습니다."
 spain.262.a: "그 암초를 인정하자"
 spain.262.b: "유치한 스페인의 요구는 거절한다"
 spain.263.t1: "요구를 거절한 [FROM.GetName]"
 spain.263.d1: "[FROM.GetName](이)가 지브롤터의 스페인 반환을 허용하라는 우리의 요구에 대한 답변을 발표했습니다. 이는 우리의 외교 정책 목표를 무너뜨렸으며, 그토록 하찮은 행동을 요구한 탓에 우리를 유럽의 웃음거리로 만들었습니다."
 spain.263.t2: "지브롤터는 우리의 것이다!"
 spain.263.d2: "갑작스러운 사태 전환으로 [FROM.GetName](이)가 바위산을 스페인 국민에게 양도했습니다. 반도가 이제 다시 우리의 위대한 통치 아래 거의 온전해졌으므로 스페인 국민에게 영광스러운 날입니다."
 spain.263.a: "공개적으로 모욕해라"
 spain.263.b: "멍청한 결정이군. 맘대로 해라."
 spain.263.c: "그 암초는 우리 것이다!"
 spain.500.t: "2000년 선거"
 spain.500.d: "[conservatism_L](이)가 총선에서 압도적인 승리를 거두었습니다. [SPR.GetLeader]은(는) 코르테스 헤네랄레스에서 절대 과반을 확보했습니다."
 spain.500.d1: "좌익 연립 정부 [socialism_L] 측과 [anarchist_communism_L] 측은 수많은 논란 속에 승리하였습니다. 이 두 정당은 1978년 스페인 헌법 제정 이후 처음으로 조직된 연립 정부입니다. 스페인 국민들에게 실로 놀라운 날이 아닐 수 없습니다."
 spain.500.d2: "이번 선거에서는 이례적으로 [conservatism_L]도 [socialism_L]도 승리하지 못했습니다. 새로운 집권당이 큰 이변 속에서 승리하여, 1970년대부터 이어져 온 미묘한 균형을 깨뜨렸습니다."
 spain.500.d3: "스페인 사회노동당 (POSE) 다수를 차지하며 선거에서 승리하였습니다. [conservatism_L] 측은 손쉽게 승리할 수 있었음에도 불구하고 패배하였습니다. 이제 스페인에서 새로운 사회주의의 물결이 찾아오고 있습니다."
 spain.500.a: "[conservatism_L]의 압도적 승리"
 spain.500.b: "스페인의 새로운 행보"
 spain.500.c: "[conservatism_L]의 대이변"
 spain.501.t: "스페인 사회노동당 (POSE)과 좌파연합 (IU)"
 spain.501.d: "오늘 [socialism_L] 측과 [anarchist_communism_L] 측의 대표단이 마드리드에서 두 정당 간의 잠재적인 연립에 대해 논의하기 위햏 회담을 가졌습니다. [socialism_L] 내부의 온건파는 선거에서 불리해질 것이라며 반대하는 입장입니다. 반면 좌파 인사들은 이 방법이 선거에서의 승리를 가져다 줄 수 있는 길이라 믿고 있습니다. [anarchist_communism_L] 측과의 연립을 두고 정당 내부의 두 세력이 서로 충돌하고 있습니다."
 spain.501.a: "합당을 해야 한다"
 spain.501.b: "제안을 거절한다"
 SPR_the_regions_of_spain: "[SPR.GetName]의 문화"
 SPR_the_regions_of_spain_desc: "§Y[SPR.GetNameWithFlag]§! is a cultural melting pot. Each culture is distinct and unique from the rest, and they represent their distinct regions and, as such, are very different from the Castilian people of central Spain. The peace with them is tenuous at best, as proven in the Basque region. It is important we keep ties with these groups or risk fracturing §Y[SPR.GetNameWithFlag]§!. The higher the opinion of each group the more productive the region will be.\n\n[CAT.GetFlag] Catalanes (Catalonians) Opinion: [?SPR_culture_opinion^0|Y0]\n[NAV.GetFlag] Euskaldunak (Basques) Opinion: [?SPR_culture_opinion^1|Y0]\n[GAL.GetFlag] Galegos (Galicians) Opinion: [?SPR_culture_opinion^2|Y0]\n[SPA.GetFlag] Andaluces (Andalusians) Opinion: [?SPR_culture_opinion^3|Y0]\n[CNR.GetFlag] Canarios (Canarians) Opinion: [?SPR_culture_opinion^4|Y0]"
 SPR_basque_revolt_against_spain_mission: "다가오는 [88.GetName]의 §Y[NAV.GetFlag][NAV.GetAdjective]§! 반란"
 SPR_basque_revolt_against_spain_mission_desc: "[88.GetName] 주민들은 [SPR.GetAdjective] 정부와 그 폭정을 더는 참을 수 없게 되었습니다. 그들은 국가에 맞선 반란을 일으킬 준비를 하고 있습니다.\n"
 SPR_galician_revolt_against_spain_mission: "다가오는 [944.GetName]의 §Y[GAL.GetFlag][GAL.GetAdjective]§! 반란"
 SPR_galician_revolt_against_spain_mission_desc: "갈레고스는 정부에 맞서 무기를 들기로 결정했습니다. 이 상황을 빨리 해결할수록 더 안정된 스페인으로 더 빨리 돌아갈 수 있습니다."
 SPR_revoke_galician_citizenship_decision: "§Y[GAL.GetFlag][GAL.GetAdjective]§! 시민권 철회"
 SPR_revoke_galician_citizenship_decision_desc: "갈리시아인의 시민권을 박탈하면 이러한 민족주의가 어느 정도 가라앉을 것입니다. 허튼소리를 포기한다면 스페인 시민권을 되돌려줄 수 있습니다."
 SPR_monarchist_spain: "스페인의 군주"
 SPR_catalonian_revolt_against_spain_mission: "다가오는 [86.GetName]의 §Y[CAT.GetFlag][CAT.GetAdjective]§! 반란"
 SPR_catalonian_revolt_against_spain_mission_desc: "카탈루냐인들은 국가에 맞선 반란을 준비하고 있습니다. 검은 먹구름이 마드리드 위로 몰려들기 시작합니다."
 SPR_basque_targeted_subsidies_decision: "§Y[NAV.GetFlag][NAV.GetAdjective]§! 보조금"
 SPR_basque_targeted_subsidies_decision_desc: "바스크 주민을 대상으로 한 지역 맞춤형 보조금을 준비하면 주민들의 일시적인 호의를 얻을 수 있습니다."
 SPR_revoke_basque_citizenship_decision: "§Y[NAV.GetFlag][NAV.GetAdjective]§! 시민권 철회"
 SPR_revoke_basque_citizenship_decision_desc: "바스크인의 시민권을 박탈하면 이러한 민족주의가 어느 정도 가라앉을 것입니다. 허튼소리를 포기한다면 스페인 시민권을 되돌려줄 수 있습니다."
 SPR_catalonian_targeted_subsidies_decision: "§Y[CAT.GetFlag][CAT.GetAdjective]§! 보조금"
 SPR_catalonian_targeted_subsidies_decision_desc: "카탈루냐 주민을 대상으로 한 지역 맞춤형 보조금을 준비하면 주민들의 일시적인 호의를 얻을 수 있습니다."
 SPR_revoke_catalonian_citizenship_decision: "§Y[CAT.GetFlag][CAT.GetAdjective]§! 시민권 철회"
 SPR_revoke_catalonian_citizenship_decision_desc: "카탈루냐 분리주의자와 공모자의 시민권을 박탈합니다."
 SPR_galician_targeted_subsidies_decision: "§Y[GAL.GetFlag][GAL.GetAdjective]§! 보조금"
 SPR_galician_targeted_subsidies_decision_desc: "갈리시아 주민을 대상으로 한 지역 맞춤형 보조금을 준비하면 주민들의 일시적인 호의를 얻을 수 있습니다."
 SPR_monarchist_spain_desc: "스페인 군주제는 세계에서 가장 오래 존속한 군주제 가운데 하나입니다"
 SPR_spawn_new_guardia_real_decision: "왕실근위대 확장"
 SPR_spawn_new_guardia_real_decision_desc: "왕실 근위대 부대를 추가로 훈련시키면 더욱 유익해질 것입니다."
 SPR_a_just_tax_decision: "정당한 세금"
 SPR_a_just_tax_decision_desc: "왕좌는 당분간 나라를 더 잘 다스리기 위해 추가 자금이 필요합니다. 일시적이기는 하지만 국민이 불공평하게 여길 수 있는 일입니다. 그러나 이는 정당하고 신성한 세금입니다.\n"
 SPR_a_divine_right_decision: "신성한 권리"
 SPR_a_divine_right_decision_desc: "왕관은 신이 내린 선물로서 스페인 국민에게 수여되었습니다. 우리에게는 통치할 신성한 권리가 있으며, 따라서 국민에게 우리의 신성함을 보여 주어야 합니다."
 SPR_install_the_carlists_decision: "카를로스파 군주제 수립"
 SPR_install_the_carlists_decision_desc: "카를로스파 군주제가 우리를 새로운 미래로 이끌 것입니다."
 SPR_remove_our_coalition_partner_decision: "연립 파트너 제거"
 SPR_remove_our_coalition_partner_decision_desc: "현재의 집권 연립은 만족스럽지 못합니다. 내각을 개편하고 통치를 도울 새로운 과반 정당을 선택해야 합니다."
 SPR_add_conservatism_into_coalition_decision: "§Y[conservatism_L]§!을(를) 연립에 초대"
 SPR_add_conservatism_into_coalition_decision_desc: "§Y[conservatism_L]§!은(는) 우리나라를 위해 훌륭한 일을 해 왔습니다."
 SPR_add_socialism_into_coalition_decision: "§Y[socialism_L]§!을(를) 연립에 초대"
 SPR_add_socialism_into_coalition_decision_desc: "[socialism_L]은(는) 통치를 돕기에 훌륭한 선택입니다."
 SPR_add_nat_fascism_into_coalition_decision: "§Y[Nat_Fascism_L]§!을(를) 연립에 초대"
 SPR_add_nat_fascism_into_coalition_decision_desc: "[Nat_Fascism_L]은(는) 통치를 돕기에 훌륭한 선택입니다."
 SPR_add_nat_rwp_into_coalition_decision: "§Y[Nat_Populism_L]§!을(를) 연립에 초대"
 SPR_add_nat_rwp_into_coalition_decision_desc: "[Nat_Populism_L]은(는) 통치를 돕기에 훌륭한 선택입니다."
 SPR_challenge_the_court_ban_bull_mission: "헌법 재판소에 대한 반발"
 SPR_challenge_the_court_ban_bull_mission_desc: "법원은 우리 행정부와 최근 제안한 입법에 대한 소송을 준비하고 있습니다. 최고 법원은 투우 금지가 스페인 문화와 국가 유산에 대한 공격이라는 판단을 시작했습니다. 그들은 우리 행정부가 스페인인이라는 것의 의미를 공격하고 있다고 밝혔습니다. 우리는 국민의 종복이므로 이 법원에 맞설 때입니다!"
 SPR_challenge_the_court_killing_bull_mission: "헌법 재판소에 대한 반발"
 SPR_challenge_the_court_killing_bull_mission_desc: "법원은 우리 행정부와 최근 제안한 입법에 대한 소송을 준비하고 있습니다. 최고 법원은 소를 죽이는 것의 금지가 스페인 문화와 국가 유산에 대한 공격이라는 판단을 시작했습니다. 그들은 우리 행정부가 스페인인이라는 것의 의미를 공격하고 있다고 밝혔습니다. 우리는 국민의 종복이므로 이 법원에 맞설 때입니다!"
 SPR_support_the_cause_decision: "대의를 지지한다"
 SPR_support_the_cause_decision_desc: "투우의 오점이 없는 스페인의 새로운 미래를 준비하는 일이 눈앞에 다가와 있습니다. 투우를 둘러싼 법을 바꾸려 하면 필연적으로 반대에 직면할 것입니다. 이제 대의를 지지하기 위해 거리로 나서야 합니다!"
 SPR_codify_the_ban_into_law_decision: "금지를 법제화"
 SPR_codify_the_ban_into_law_decision_desc: "법원 심리 이전에 정부에서 과반 찬성을 얻어 금지를 법으로 성문화한다면 법원은 물러설 것입니다. 그들은 법을 승인하고 우리의 가장 중대한 반대를 제거하는 것 외에 선택의 여지가 없을 것입니다. "
 SPR_codify_the_killing_of_the_bull_decision: "소를 죽이는 것을 법제화"
 SPR_codify_the_killing_of_the_bull_decision_desc: "법원 심리 이전에 정부에서 과반 찬성을 얻어 소를 죽이는 것을 법으로 성문화한다면 법원은 물러설 것입니다. 그들은 법을 승인하고 우리의 가장 중대한 반대를 제거하는 것 외에 선택의 여지가 없을 것입니다. "
 SPR_hold_a_referendum_on_bull_question_decision: "국민투표 실시"
 SPR_hold_a_referendum_on_bull_question_decision_desc: "우리가 쓸 수 있는 가장 강력한 수단은 국민입니다. 국민을 믿는다면 그들은 올바른 선택지를 고르고 스페인의 투우 모습을 영원히 바꾸려는 우리의 바람을 지지할 것입니다!"
 SPR_spawn_new_regulares_decision: "신규 정규 여단 모집"
 SPR_spawn_new_regulares_decision_desc: "정규 여단을 추가로 배치하면 현재 육군을 보강하는 데 도움이 될 것입니다."
 SPR_spawn_new_foreign_legion_decision: "신규 외인부대 테르시오 모집"
 SPR_spawn_new_foreign_legion_decision_desc: "추가 외인부대 병력은 언제나 환영입니다."
 SPR_foreign_recruitment: "외국인 모집"
 SPR_foreign_recruitment_desc: "유지할 수 있는 §Y정규 여단§!의 수는 §Y비중핵 인구§!에 따라 결정되며, §Y비중핵 인구§! [?SPR_regulare_cap_tt_val|Y0]백만 명당 1개 여단이 허용됩니다.\n\n현재 정규 여단 수용량: [?SPR_deployed_regulares|Y0]/[?SPR_regulare_cap|Y0]\n\n유지할 수 있는 §Y외인부대 테르시오§!의 수는 §Y총 인력§!에 따라 결정되며, §Y총 인력§! [?SPR_legion_cap_tt_val|Y0]천 명당 1개 테르시오가 허용됩니다.\n\n현재 외인부대 테르시오 수용량: [?SPR_deployed_legions|Y0]/[?SPR_legion_cap|Y0]"
 SPR_political_policy_category: "스페인의 정치 정책"
 SPR_political_policy_category_desc: "$SPR_explain_politics_tt$"
 SPR_file_a_motion_of_no_confidence: "불신임안 제출"
 SPR_file_a_motion_of_no_confidence_desc: "불신임안을 제출하면 다른 정부가 권력을 잡거나 현 정부가 그대로 집권을 유지할 무대가 마련됩니다. 우리가 누구를 지지하든, 그들이 권력으로 이행하는 과정을 지원해야 합니다."
 SPR_political_support_decision: "정치적 지지"
 SPR_political_support_decision_desc: "광고라도 좀 돌려야 합니다. 요즘은 소셜 미디어도 괜찮습니다."
 SPR_exploit_the_union_decision: "노조 착취"
 SPR_exploit_the_union_decision_desc: "노조는 우리 정부의 더 큰 구상에서 하나의 말에 불과합니다. 그들의 금고를 활용하는 것은 우리와 국민에게만 이로울 것입니다.\n"
 SPR_tap_the_bank_funds_decision: "은행 자금 활용"
 SPR_tap_the_bank_funds_decision_desc: "국영 은행은 정부가 설립했습니다. 이를 이용해 추가 자금을 확보하는 것도 좋을 것입니다.\n"
 SPR_encourage_communist_neighbors_decision: "이웃 나라의 공산주의 고취"
 SPR_encourage_communist_neighbors_decision_desc: "이웃 나라들은 생산 수단을 장악하는 일이 한참 부족합니다. 약간 부추겨 줍시다.\n"
 SPR_unban_the_monarchy_decision: "군주제 복원"
 SPR_unban_the_monarchy_decision_desc: "공산주의를 경험하는 동안 군주제가 폐지되었습니다. 원한다면 군주들에게 복귀를 제안할 수 있습니다."
 SPR_conservatism_policy_replacer_decision: "§Y[conservatism_L]§! 정책 복귀"
 SPR_conservatism_policy_replacer_decision_desc: "우리는 보수주의 정부 형태로 돌아왔습니다. 가능한 한 빨리 정책을 복원하는 것은 우리나라에 훌륭한 조치가 될 것입니다.\n\n§C이 결정은 이전 정부의 정책을 되돌릴 수 있게 합니다. 본질적으로 잃어버린 국가 정신을 되찾는 것입니다.§!\n"
 SPR_rwp_policy_replacer_decisions: "§Y[Nat_Populism_L]§! 정책 복귀"
 SPR_rwp_policy_replacer_decisions_desc: "[Nat_Populism_L]이(가) 우리나라 지배층으로 다시 돌아왔습니다. 이들의 정책은 최근 많은 논쟁거리였으나 다시 한번 제시해 보는 것도 흥미로울 것입니다.\n\n§C이 결정은 이전 정부의 정책을 되돌릴 수 있게 합니다. 본질적으로 잃어버린 국가 정신을 되찾는 것입니다.§!\n"
 SPR_falangists_policy_replacer_decision: "§Y[Nat_Fascism_L]§! 정책 복귀"
 SPR_falangists_policy_replacer_decision_desc: "[Nat_Fascism_L] 아래의 팔랑헤당원들이 다시 한번 권력의 혈관 속으로 슬금슬금 스며들었습니다. 그들의 정책이 법으로 다시 성문화되기를 기다리고 있습니다.\n\n§C이 결정은 이전 정부의 정책을 되돌릴 수 있게 합니다. 본질적으로 잃어버린 국가 정신을 되찾는 것입니다.§!\n"
 SPR_communist_policy_replacer_decision: "§Y[communist_state_L]§! 정책 복귀"
 SPR_communist_policy_replacer_decision_desc: "[communist_state_L]이(가) 다시 한번 권력을 잡았습니다. 그들의 정책을 되살리는 것은 나라에 매우 이로울 것입니다.\n\n§C이 결정은 이전 정부의 정책을 되돌릴 수 있게 합니다. 본질적으로 잃어버린 국가 정신을 되찾는 것입니다.§!\n"
 SPR_socialism_policy_replacer_decision: "§Y[socialism_L]§! 정책 복귀"
 SPR_socialism_policy_replacer_decision_desc: "[socialism_L]이(가) 다시 한번 국가 통치로 돌아왔습니다.\n\n§C이 결정은 이전 정부의 정책을 되돌릴 수 있게 합니다. 본질적으로 잃어버린 국가 정신을 되찾는 것입니다.§!\n"
 SPR_explain_politics_tt: "[SPR.GetFlag] §Y[SPR.GetAdjective]§! 정치 체계는 일반적인 §Y밀레니엄 던§! 트리와 다릅니다. 모든 경로가 열려 있으며 한 번의 게임에서 모든 경로를 택할 수 있습니다. 다만 정당을 선출하거나 쿠데타로 강제해야 합니다. 이 트리는 선거 제도를 거치며 선택한 정당에 대한 지지를 육성하도록 요구하여, 강력하고 단합된 정부를 유지해야 하거나 정부를 교체해야 하는 상황을 모사합니다. 사건, 결정, 중점 모두가 게임 내내 스페인에서 일어나는 일에 영향을 미칩니다. 마지막으로, 조기 총선 결정은 \\"불신임안\\" 결정으로 대체되며, 이는 모든 정식 선거로부터 2년 뒤에 취할 수 있습니다."
 SPR_file_a_motion_of_no_confidence_tt: "불신임안이 제출되면 선거 제도가 시작되기까지 두 달이 남습니다. 원하는 집권 정당을 선출하지 못하면 다음 시도까지 1년을 기다리거나 다음 정식 선거를 기다려야 합니다.\n\n불신임안 제출됨 (다음 불신임안 제출 가능까지 남은 일수: [?SPR_filed_a_motion_of_no_confidence:days_left|Y0])"
 SPR_cultural_opinion_change: "§Y[selected_culture_index]§! 평판이 [?cultural_opinion|+0] 변동합니다 (현재 평판: [selected_culture_index_cur_opin])\n"
