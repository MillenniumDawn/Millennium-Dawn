 CZE_political_leaders_stanislav_gross_text_text: "§t스타니슬라프 그로스§!"
 CZE_political_leaders_stanislav_gross_TT: "§Y스타니슬라프 그로스§!"
 CZE_political_leaders_stanislav_gross_delayed_TT: "스타니슬라프 그로스는 체코의 총리를 지낸 체코의 변호사이자 정치인입니다. 그는 이전에 2000년부터 2004년까지 밀로시 제만 내각과 블라디미르 슈피들라 내각에서 내무장관을 지냈습니다.\n\n재임 중 경찰 내부의 여러 스캔들이 유출되었는데, 최고위 관리들의 부패, 입찰 과정의 부정, 연쇄 살인 사건 미해결 등이었습니다. 그로스는 이것이 경찰 내부의 그러한 행위를 더 잘 적발할 수 있게 된 덕분이라고 주장했습니다. 그로스는 또한 친구와 동맹을 국영 기업 임원으로 앉힌 일과 정치적 목적으로 비밀 정보기관을 남용한 일로 비판받았습니다.\n\n그는 잠시 체코슬로바키아 국영 철도(ČSD)에서 기관사 견습생으로 일했습니다."
 CZE_political_leaders_stanislav_gross_effect_text_text: "§G-12.5%§! §Y경찰 지출§!"
 CZE_political_leaders_jiri_paroubek_text_text: "§t이르지 파로우베크§!"
 CZE_political_leaders_jiri_paroubek_TT: "§Y이르지 파로우베크§!"
 CZE_political_leaders_jiri_paroubek_delayed_TT: "이르지 파로우베크는 2005년 4월부터 2006년 9월까지 체코의 총리를 지낸 체코의 정치인입니다.\n\n1979년 공산 정권의 위성 정당 중 하나였던 체코슬로바키아 사회당의 집행위원이었던 이르지 파로우베크는 공산주의 국가 비밀경찰(StB)의 관심을 끌었습니다. 그는 요원들과 세 차례 만났으며, 그 자리에서 공산 정부에 대한 충성과 77헌장 같은 반체제 단체에 대한 반대를 표명했다고 알려져 있습니다."
 CZE_political_leaders_jiri_paroubek_effect_text_text: "§G+15%§! §Y정치력 획득§!"
 CZE_political_leaders_bohuslav_sobotka_text_text: "§t보후슬라프 소보트카§!"
 CZE_political_leaders_bohuslav_sobotka_TT: "§Y보후슬라프 소보트카§!"
 CZE_political_leaders_bohuslav_sobotka_delayed_TT: "보후슬라프 소보트카는 2002년부터 2006년까지 재무장관을 지낸 체코의 정치인이자 변호사입니다.\n\n2013년 체코 총선 이후 소보트카는 2014년 1월 17일 대통령에 의해 총리로 임명되었고, 12일 뒤 ČSSD, ANO 2011, KDU-ČSL로 구성된 중도좌파 연립 정부를 구성했습니다. 그의 정부는 판매 전자 등록이나 부가가치세 통제 체계 같은 탈세 근절 조치들을 도입하고, 중국과의 관계를 강화했으며, 경찰을 개혁하고, 공무원법을 폐지하고, 금연법을 시행했습니다. 그는 또한 러시아의 우크라이나 개입과 그에 따른 제재, 국내 정책, 그리고 2017년 5월 소보트카가 철회한 사임 문제를 두고 밀로시 제만 대통령과 자주 충돌했습니다.\n\n소보트카는 15년 만에, 체코 역사상 세 번째로 임기를 모두 마친 총리입니다."
 CZE_political_leaders_bohuslav_sobotka_effect_text_text: "§G+10%§! §Y세수§!"
 CZE_political_leaders_jan_hamacek_text_text: "§t얀 하마체크§!"
 CZE_political_leaders_jan_hamacek_TT: "§Y얀 하마체크§!"
 CZE_political_leaders_jan_hamacek_delayed_TT: "얀 하마체크는 2006년 선거에서 처음으로 하원 의원에 당선되었습니다. 의원 재직 중 그는 외교위원회 부위원장을 맡았고, NATO 의회 총회 체코 대표단을 이끌었으며, 유럽 문제 위원회에서도 활동했습니다.\n\n그는 내무장관에 임명되었고, 2018년 6월부터 10월까지 외무장관 직무대행도 맡았습니다.\n\n2018년 8월 하마체크는 시리아에서 독일 인도주의 단체 직원 두 명의 석방 협상을 도왔으며, 이들의 인계를 위해 다마스쿠스를 방문했습니다."
 CZE_political_leaders_jan_hamacek_effect_text_text: "§G+15%§! §Y관계 획득§!"
 CZE_political_leaders_michal_smarda_text_text: "§t미할 슈마르다§!"
 CZE_political_leaders_michal_smarda_TT: "§Y미할 슈마르다§!"
 CZE_political_leaders_michal_smarda_delayed_TT: "미할 슈마르다는 2021년 12월부터 SOCDEM 대표를 맡고 있는 체코의 정치인입니다. 2006년 노베 메스토 나 모라베 시의회에 처음 선출되었고, 2010년에는 시장이 되었습니다. 2016년에는 잠시 비소치나 지방 대표를 지냈습니다.\n\n 그는 체코 문화부 장관 후보였습니다."
 CZE_political_leaders_michal_smarda_effect_text_text: "§G+10.5%§! §Y안정도 계수§!"
 CZE_political_leaders_jan_kasal_text_text: "§3얀 카살§!"
 CZE_political_leaders_jan_kasal_TT: "§Y얀 카살§!"
 CZE_political_leaders_jan_kasal_delayed_TT: "얀 카살은 카렐 대학교에 다니며 가톨릭 신학을 공부했습니다. 그는 ČSL 소속으로 체코 민족평의회 의원이 되었으며, KDU-ČSL과 이 당의 보수 진영을 대표하는 주요 인물입니다."
 CZE_political_leaders_jan_kasal_effect_text_text: "§G+7.5%§! §Y안정도 계수§!"
 CZE_political_leaders_cyril_svoboda_text_text: "§3시릴 스보보다§!"
 CZE_political_leaders_cyril_svoboda_TT: "§Y시릴 스보보다§!"
 CZE_political_leaders_cyril_svoboda_delayed_TT: "시릴 스보보다는 정치 경력 동안 부총리(2002년 7월~2004년 8월)와 외무장관(2002년 7월~2006년 9월)을 비롯한 여러 장관직을 역임했습니다. 그는 2011년 프라하에 외교 아카데미를 설립했으며 현재 프라하의 여러 대학에서 강의하고 있습니다.\n\nKDU-ČSL이 2007년 ODS 및 녹색당과 연립을 구성했을 때 스보보다는 무임소 장관이자 정부 입법위원회 위원장이 되었습니다. 2009년 1월 정부 '세대교체' 때 그는 지역개발부 장관이 되었습니다."
 CZE_political_leaders_cyril_svoboda_effect_text_text: "§G+12.5%§! §Y정치력 획득§!"
 CZE_political_leaders_jiri_cunek_text_text: "§3이르지 추네크§!"
 CZE_political_leaders_jiri_cunek_TT: "§Y이르지 추네크§!"
 CZE_political_leaders_jiri_cunek_delayed_TT: "이르지 추네크는 1990년 KDU-ČSL에 입당한 체코의 정치인입니다. 2007년 1월부터 11월까지, 그리고 2008년 4월부터 2009년 1월까지 미레크 토폴라네크 제2기 정부의 제1부총리 겸 체코 지역개발부 장관을 지냈습니다.\n\n그는 고트발도프의 기계공학대학을 졸업한 뒤 즈브로요프카 프세틴에 입사해 처음에는 안전 기술자로, 1993년부터는 산업안전 책임자로 일했습니다."
 CZE_political_leaders_jiri_cunek_effect_text_text: "§G+10%§! §Y건설 속도§!"
 CZE_political_leaders_pavel_belobradek_text_text: "§3파벨 벨로브라데크§!"
 CZE_political_leaders_pavel_belobradek_TT: "§Y파벨 벨로브라데크§!"
 CZE_political_leaders_pavel_belobradek_delayed_TT: "파벨 벨로브라데크는 체코의 정치인이자 수의사, 지방자치 공직자로, 2010년부터 2019년까지 KDU-ČSL 대표를, 2014년부터 2017년까지 부총리를 지냈습니다.\n\n2014년 1월 파벨 벨로브라데크는 보후슬라프 소보트카 내각에서 과학·연구·혁신 담당 부총리직의 KDU-ČSL 후보가 되었습니다. 그는 또한 2014년 체코 지방선거에서 자신의 자리를 지켜 냈습니다."
 CZE_political_leaders_pavel_belobradek_effect_text_text: "§G+12.5%§! §Y연구 속도§!"
 CZE_political_leaders_marek_vyborny_text_text: "§3마레크 비보르니§!"
 CZE_political_leaders_marek_vyborny_TT: "§Y마레크 비보르니§!"
 CZE_political_leaders_marek_vyborny_delayed_TT: "마레크 비보르니는 2023년 6월부터 페트르 피알라 내각에서 체코 농업부 장관을 맡고 있는 체코의 정치인입니다.\n\n비보르니는 올로모우츠의 팔라츠키 대학교에서 역사와 신학을 공부했습니다. 이후 2001년 파르두비체의 김나지움에서 역사, 사회과학 기초, 라틴어를 가르치기 시작했습니다. 2012년 8월 1일부터 2018년 3월 31일까지는 모차르트 문법학교의 교장을 지냈습니다.\n\n 2017년 10월부터 KDU-ČSL 소속으로 체코 의회 하원 의원을 맡고 있습니다."
 CZE_political_leaders_marek_vyborny_effect_text_text: "§G+15%§! §Y농업 생산성§!"
 CZE_political_leaders_marian_jurecka_text_text: "§3마리안 유레츠카§!"
 CZE_political_leaders_marian_jurecka_TT: "§Y마리안 유레츠카§!"
 CZE_political_leaders_marian_jurecka_delayed_TT: "마리안 유레츠카는 체코의 정치인으로, 2021년 12월 17일부터 페트르 피알라 내각의 부총리 겸 노동사회부 장관을, 2022년 11월부터 2023년 3월까지 환경부 장관을 지냈습니다. 그는 이전에 2014년부터 2017년까지 보후슬라프 소보트카 내각의 농업부 장관을 지냈습니다."
 CZE_political_leaders_marian_jurecka_effect_text_text: "§G+6%§! §Y생산성 증가§!"
 CZE_political_leaders_karel_kuhnl_text_text: "§G카렐 퀴늘§!"
 CZE_political_leaders_karel_kuhnl_TT: "§Y카렐 퀴늘§!"
 CZE_political_leaders_karel_kuhnl_delayed_TT: "1993년부터 1997년까지 카렐 퀴늘은 영국 주재 체코 대사였으며, 1995년까지는 아일랜드 대사도 겸했습니다. 1997년부터 1998년까지 카렐 퀴늘은 체코 산업무역부 장관을 지냈습니다.\n\n1998년부터 2006년까지 그는 US-DEU 소속 하원 의원직을 맡았으며, 2000년부터 2001년까지는 이 당의 대표였습니다.\n\n새천년 초에 카렐 퀴늘은 4자 연합(Čtyřkoalice) 프로젝트에 깊이 관여했습니다."
 CZE_political_leaders_karel_kuhnl_effect_text_text: "§G+15%§! §Y무역 관계 계수§!"
 CZE_political_leaders_hana_marvanova_text_text: "§G하나 마르바노바§!"
 CZE_political_leaders_hana_marvanova_TT: "§Y하나 마르바노바§!"
 CZE_political_leaders_hana_marvanova_delayed_TT: "하나 코르도바 마르바노바는 체코의 변호사이자 정치인으로, 전 체코 의회 하원 부의장입니다.\n\n2018년 그녀는 STAN 운동(시장과 무소속)의 무소속 당원으로 프라하 시의회에 선출되었고, 입법·공공행정·주거 지원 담당 시의원 겸 위원이 되었습니다. 2014년에는 잠시 헬레나 발코바 법무장관의 차관을 지냈습니다.\n\n그녀는 독립평화협회나 부패 반대 시민 운동 같은 여러 활동가 단체와 구상의 창립자이기도 합니다."
 CZE_political_leaders_hana_marvanova_effect_text_text: "§G+11.5%§! §Y정치력 획득§!"
 CZE_political_leaders_ivan_pilip_text_text: "§G이반 필리프§!"
 CZE_political_leaders_ivan_pilip_TT: "§Y이반 필리프§!"
 CZE_political_leaders_ivan_pilip_delayed_TT: "이반 필리프는 1994년부터 1997년까지 교육청소년체육부 장관을 지낸 뒤 1997년 6월부터 1998년 7월까지 재무장관을 지낸 체코의 정치인이자 경제학자입니다.\n\n필리프는 경제학자로 교육받았으며, 체코의 공산주의 몰락 이후 기독민주당(KDS)으로 정계에 입문했습니다. 필리프는 1992년부터 1998년까지 정부에서 일했으며, KDS가 시민민주당과 합당하기 전까지 이끌었습니다. 필리프는 시민민주당에서 이탈해 자유연합을 창당한 의원들 가운데 한 명이었고, 1998년에 야당으로 돌아섰습니다.\n\n필리프는 2001년 초 쿠바 정부 반대자들을 만난 뒤 거의 한 달 동안 쿠바에 구금되었다가, 쿠바에 대한 국제적 압력으로 풀려났습니다. 그는 2002년 하원 의석을 잃었지만 이후 한동안 자유연합의 임시 대표를 맡았고, 2004년부터 2007년까지 유럽투자은행 부총재를 지냈습니다."
 CZE_political_leaders_ivan_pilip_effect_text_text: "§G+10%§! §Y세수 증가§!"
 CZE_political_leaders_petr_mares_text_text: "§G페트르 마레시§!"
 CZE_political_leaders_petr_mares_TT: "§Y페트르 마레시§!"
 CZE_political_leaders_petr_mares_delayed_TT: "페트르 마레시는 체코의 외교관이자 전직 정치인으로, 20세기와 21세기의 전환기에 자유연합 소속 하원 의원이었고 2003~2004년에는 이 당의 대표이자 블라디미르 슈피들라 내각의 부총리였습니다.\n\n1990년부터 그는 카렐 대학교 사회과학대학에서 강의했습니다.\n\n1998년 선거에서 그는 자유연합 소속으로(동보헤미아 지방 선거구) 하원 의원에 당선되었습니다. 그는 과학·교육·문화·청소년·체육 의회 위원회의 위원장이었으며 2001~2002년에는 선거위원회 위원장도 맡았습니다. 그는 2002년 선거까지 의회에 남았습니다."
 CZE_political_leaders_petr_mares_effect_text_text: "§G+10.5%§! §Y연구 속도§!"
 CZE_political_leaders_pavel_nemec_text_text: "§G파벨 네메치§!"
 CZE_political_leaders_pavel_nemec_TT: "§Y파벨 네메치§!"
 CZE_political_leaders_pavel_nemec_delayed_TT: "파벨 네메치는 체코의 변호사이자 자유연합의 전직 정치인(2004~2006년 대표)으로, 20세기와 21세기의 전환기에 하원 의원이었고, 2002~2004년 지역개발부 장관을 지낸 뒤 2006년까지 스타니슬라프 그로스 내각과 이르지 파로우베크 내각의 법무장관 겸 부총리를 지냈습니다.\n\n의원으로서 그는 집행명령의 공동 발의자였으며, 이로써 집행관과 집행관 협회의 창설이 가능해졌습니다. 법무장관으로서는 크로메르지시의 법무학교를 법무 아카데미와 통합하여 사법부 민간 직원을 위한 하나의 부처 소속 교육 기관을 만들었습니다."
 CZE_political_leaders_pavel_nemec_effect_text_text: "§G-15%§! §Y부패 변화 비용§!"
 CZE_political_leaders_jan_hadrava_text_text: "§G얀 하드라바§!"
 CZE_political_leaders_jan_hadrava_TT: "§Y얀 하드라바§!"
 CZE_political_leaders_jan_hadrava_delayed_TT: "얀 하드라바는 체코의 정치인으로, 벨벳 혁명 이후 시민포럼 소속으로 체코슬로바키아 연방의회 민족원 의원을 지냈습니다.\n\n그는 크라이카 리바프스케 우돌리 공장에서 섬유 기술자로 일했고, 이후 소콜로프의 문화센터에서 납품 담당자 겸 노동자로 일했습니다. 1970년대 후반 그는 친구들과 함께 비공식 문학도 소개하는 시 동호회를 만들었고, 이로 인해 국가보안부의 관심을 받았습니다."
 CZE_political_leaders_jan_hadrava_effect_text_text: "§G+8.5%§! §Y건설 속도§!"
 CZE_political_leaders_jan_cerny_text_text: "§G얀 체르니§!"
 CZE_political_leaders_jan_cerny_TT: "§Y얀 체르니§!"
 CZE_political_leaders_jan_cerny_delayed_TT: "얀 체르니는 체코의 수의사이자 정치인으로, 1990년대에 ODS 소속으로 체코 민족평의회와 하원 의원을 지냈고, 이후 자유연합 소속으로 요제프 토쇼프스키 정부의 지역개발부 장관을 지냈으며, 2007~2011년에는 자유연합의 마지막 대표였습니다. 2020년부터 그는 코스텔레츠 나트 체르니미 레시 시장을 맡고 있습니다."
 CZE_political_leaders_jan_cerny_effect_text_text: "§G+6%§! §Y생산성 성장§!"
 CZE_political_leaders_andrej_babis_text_text: "§2안드레이 바비시§!"
 CZE_political_leaders_andrej_babis_TT: "§Y안드레이 바비시§!"
 CZE_political_leaders_andrej_babis_delayed_TT: "안드레이 바비시는 ANO 당의 초대이자 최근까지 유일한 대표입니다. 2014~2017년 그는 보후슬라프 소보트카 내각에서 제1부총리 겸 재무장관을 지냈습니다. 그는 대기업 아그로페르트의 창립자입니다. 막대한 경제적, 정치적, 언론적 영향력을 자신에게 유리하게 사용한다는 이유로 그는 종종 올리가르히로 불립니다.\n\n현재 아그로페르트는 주식회사이며 체코 최대의 농업·식품·화학 지주회사입니다. 이 지주회사는 주로 체코와 슬로바키아에 있는 법적으로 독립된 230개 이상의 기업을 통제합니다."
 CZE_political_leaders_andrej_babis_effect_text_text: "§G+17.5%§! §Y법인세 수입§!"
 CZE_political_leaders_karel_schwarzenberg_text_text: "§C카렐 슈바르첸베르크§!"
 CZE_political_leaders_karel_schwarzenberg_TT: "§Y카렐 슈바르첸베르크§!"
 CZE_political_leaders_karel_schwarzenberg_delayed_TT: "카렐 슈바르첸베르크는 TOP 09의 공동 창립자이자 초대 대표입니다. 그는 바츨라프 하벨 대통령의 비서실장으로 일했고, 외무장관과 제1부총리를 지냈습니다.\n\n카렐 슈바르첸베르크는 교회 재산 반환, 즉 1948년 이후 공산주의자들이 교회에서 몰수한 재산의 반환을 지지했습니다. 그는 또한 녹색 정치를 장려했으며, 2005년에는 논란이 된 재생 에너지 지원법에 찬성표를 던졌지만 동시에 이른바 환경 테러리즘은 거부했습니다.\n\n그는 개인적인 체코 애국심을 크게 강조했고 오랫동안 인권을 위해 싸웠습니다"
 CZE_political_leaders_karel_schwarzenberg_effect_text_text: "§G+4§! §Y생산성 성장§!"
 CZE_political_leaders_miroslav_kalousek_text_text: "§3미로슬라프 칼로우세크§!"
 CZE_political_leaders_miroslav_kalousek_TT: "§Y미로슬라프 칼로우세크§!"
 CZE_political_leaders_miroslav_kalousek_delayed_TT: "TOP 09의 공동 창립자이자 전 대표이며, 그 이전에는 KDU-ČSL 소속이었습니다. 그는 재무장관을 지냈습니다.\n\n그는 부총리의 전문 자문관이었고, 체코슬로바키아 부총리 자문관 노조의 책임자이자 예산과 획득 절차를 담당한 국방차관이었습니다."
 CZE_political_leaders_miroslav_kalousek_effect_text_text: "§G+12.5§! §Y세수 증가§!"
 CZE_political_leaders_jiri_pospisil_text_text: "§C이르지 포스피실§!"
 CZE_political_leaders_jiri_pospisil_TT: "§Y이르지 포스피실§!"
 CZE_political_leaders_jiri_pospisil_delayed_TT: "이르지 포스피실은 처음에는 2006~2009년 미레크 토폴라네크의 제1기 및 제2기 정부에서, 그리고 다시 2010~2012년 페트르 네차스 내각에서 법무장관직을 맡았습니다.\n\n2012년 6월 27일 바츨라프 클라우스 대통령은 페트르 네차스 총리의 제안에 따라 그를 법무장관직에서 해임했습니다. 공식적인 사유는 부처 운영에서의 관리 실패였습니다. 다수의 정치인과 전문가들은 이 사유가 명분일 뿐이라고 평했으며, 진짜 이유로 포스피실이 렌카 브라다초바를 프라하 수석 검사로 임명하려 했던 점을 꼽았습니다.\n\n포스피실의 해임에 반대하는 여러 차례의 시위가 조직되었고, 일부 비정부 반부패 단체는 법무장관 해임을 이유로 총리의 사임을 촉구했습니다."
 CZE_political_leaders_jiri_pospisil_effect_text_text: "§G+20%§! §Y정치력 획득§!"
 CZE_political_leaders_marketa_pekarova_text_text: "§C마르케타 페카로바§!"
 CZE_political_leaders_marketa_pekarova_TT: "§Y마르케타 페카로바 아다모바§!"
 CZE_political_leaders_marketa_pekarova_delayed_TT: "2009년 마르케타 페카로바 아다모바는 새로 창당된 TOP 09에 입당했습니다. 그때까지 그녀는 정치에 적극적으로 참여하지 않았습니다.\n\n그녀는 공석이 된 시의원으로 프라하 8구 의회에 선출되었습니다. 사회 분야와 마약 예방이 그녀의 담당이었습니다. 2012년 5월부터 그녀의 담당 분야는 유럽 기금 분야로 확대되었습니다.\n\n반면에 그녀는 자발적 방식의 난민 수용을 지지했고, 안드레이 바비시 정부가 '고아가 된 아이 수십 명의 수용과 과밀한 난민 수용소의 부담 완화마저 EU 파트너들을 돕기를 거부하고 있다'고 비판했습니다."
 CZE_political_leaders_marketa_pekarova_effect_text_text: "§G-14%§! §Y경찰 지출 비용§!"
 CZE_political_leaders_vaclav_klaus_text_text: "§1바츨라프 클라우스§!"
 CZE_political_leaders_vaclav_klaus_TT: "§Y바츨라프 클라우스§!"
 CZE_political_leaders_vaclav_klaus_delayed_TT: "공산주의 시절 바츨라프 클라우스는 은행원이자 예측 분석가로 일했습니다. 1989년 11월 공산주의가 붕괴한 뒤 그는 국민통합 정부의 재무장관이 되었습니다. 1991년 바츨라프 클라우스는 시민민주당(ODS)의 주요 공동 창립자였습니다.\n\n그는 2003년 2월 체코 대통령에 선출되었고 2008년에 두 번째 5년 임기로 재선되었습니다.\n\n그의 대통령 재임 기간은 지구온난화 부정부터 유럽회의주의에 이르는 문제에 대한 강한 견해로 인한 많은 논란과, 임기 마지막 달에 선포한 광범위한 사면으로 점철되었으며, 이로 인해 체코 상원에 의해 대역죄 혐의로 기소되었습니다."
 CZE_political_leaders_vaclav_klaus_effect_text_text: "§G-15%§! §Y부패 변화 비용§!"
 CZE_political_leaders_mirek_topolanek_text_text: "§1미레크 토폴라네크§!"
 CZE_political_leaders_mirek_topolanek_TT: "§Y미레크 토폴라네크§!"
 CZE_political_leaders_mirek_topolanek_delayed_TT: "미레크 토폴라네크는 2007년 10월 이른바 총리의 5대 우선 과제를 발표했습니다. 이는 정부가 채택한 임기 중 정부 프로그램 목표의 190개 프로젝트로 구성된 10개 프로그램 분야를 포함하는 정부 성명이었습니다. 시민과의 소통과 이해를 쉽게 하기 위해 미레크 토폴라네크는 10개 프로그램 분야를 총리의 5대 우선 과제로 요약했습니다. 건전한 재정, 현대적이고 효율적인 국가, 안전한 나라의 안전한 시민, 장벽 제거, 과학과 교육 장려가 그것입니다.\n\n그는 부시 행정부가 제안한 미사일 방어 체계의 열렬한 지지자였으며, 이는 러시아의 격렬한 반대를 받았습니다. 오바마 행정부는 러시아가 협력하여, 방어 체계가 막으려는 핵 야망을 가진 국가인 이란이 핵 프로그램 개발과 중동 전역의 테러 조직 지원을 중단하도록 설득한다면 이를 건설할 필요가 없을 수도 있다고 시사했습니다.\n\n2010년 정계를 떠난 뒤 토폴라네크는 전력 산업에서 활동하며 화석 연료 업계를 대변하는 목소리 큰 로비스트로 활약하고 있습니다."
 CZE_political_leaders_mirek_topolanek_effect_text_text: "§G+10%§! §Y정치력 획득§!"
 CZE_political_leaders_petr_necas_text_text: "§1페트르 네차스§!"
 CZE_political_leaders_petr_necas_TT: "§Y페트르 네차스§!"
 CZE_political_leaders_petr_necas_delayed_TT: "페트르 네차스는 브르노의 마사리크 대학교에서 물리학 자연과학 박사 학위를 받았습니다. 1991년 그는 ODS의 공동 창립자 중 한 명이었습니다.\n\n네차스가 이끈 내각은 기독교 교회 재산 반환법, 연금 개혁, 대학 개혁을 밀어붙였습니다. 이 모든 것은 매우 인기가 없었고 많은 비판을 받았습니다.\n\n그는 체코의 국가 부채를 억제하기 위해 이룬 절감으로 칭찬받았습니다. 비판자들은 종종 그를 부패 혐의로 비난하며 의료 문제를 해결하지 못한다고 비판합니다. 2023년 5월 네차스는 위증죄로 유죄 판결을 받고 벌금형을 선고받아, 역사상 처음으로 형사 범죄로 유죄를 선고받은 총리가 되었습니다."
 CZE_political_leaders_petr_necas_effect_text_text: "§G+10%§! §Y연구 속도§!"
 CZE_political_leaders_petr_fiala_text_text: "§1페트르 피알라§!"
 CZE_political_leaders_petr_fiala_TT: "§Y페트르 피알라§!"
 CZE_political_leaders_petr_fiala_delayed_TT: "페트르 피알라는 2021년 11월부터 체코 총리를, 2014년부터 ODS 대표를 맡고 있는 체코의 정치인이자 정치학자입니다. 그는 이전에 2012년부터 2013년까지 교육청소년체육부 장관을 지냈습니다. 정계에 입문하기 전에는 마사리크 대학교의 총장이었습니다.\n\n2020년 피알라는 KDU-ČSL 및 TOP 09와 함께하는 중도우파 선거 연합, 이른바 스폴루(Spolu)를 추진했습니다. 그는 2021년 체코 총선에서 이 연합의 총리 후보가 되어, 재정 책임과 대서양주의의 일환으로 NATO와의 긴밀한 관계에 초점을 맞춘 친서방, 친유럽 중도우파 정강을 내걸고 선거에 나섰습니다.\n\n이 연합은 초기 여론조사를 웃돌며 선거에서 1위를 차지했으나, 하원 의석은 2위인 ANO 2011보다 한 석 적었습니다."
 CZE_political_leaders_petr_fiala_effect_text_text: "§G+17.5%§! §Y연구 속도§!"
 CZE_political_leaders_miroslav_grebenicek_text_text: "§R미로슬라프 그레베니체크§!"
 CZE_political_leaders_miroslav_grebenicek_TT: "§Y미로슬라프 그레베니체크§!"
 CZE_political_leaders_miroslav_grebenicek_delayed_TT: "미로슬라프 그레베니체크는 브르노의 얀 에반겔리스타 푸르키녜 대학교 교육철학대학을 졸업했으며, 1968년에는 바르샤바 조약군의 진입에 항의한 학생들 가운데 한 명이었습니다.\n\n학업을 마친 뒤 그는 교사로 일했고, 1975년부터 브르노의 얀 에반겔리스타 푸르키녜 대학교에서 19세기와 20세기 역사, 노동운동사, 경제 이론을 중심으로 강의했습니다.\n\n그는 1975년에 공산당에 입당했습니다."
 CZE_political_leaders_miroslav_grebenicek_effect_text_text: "§G+10%§! §Y연구 속도§!"
 CZE_political_leaders_vojtech_filip_text_text: "§R보이테흐 필리프§!"
 CZE_political_leaders_vojtech_filip_TT: "§Y보이테흐 필리프§!"
 CZE_political_leaders_vojtech_filip_delayed_TT: "보이테흐 필리프는 체코의 전직 정치인이자 보헤미아 모라비아 공산당의 전 대표로, 2002~2010년과 2013~2021년에 체코 의회 하원 부의장을, 1996~2021년에 하원 의원을 지냈으며, 1990년대 초에는 연방의회 인민원 의원이었고 StB의 유급 협력자였습니다. 2022년 2월부터는 체코-중국 혼합 상공회의소 이사회 의장을 맡고 있습니다.\n\n1983년 그는 공산당에 입당했습니다. 1985년 7월부터 그는 국가보안부(StB) 요원들과 접촉을 유지했으며, 처음에는 '보이테흐'라는 비밀 협력 후보로서였습니다. 1986년 4월 15일 그는 StB 소령 루보미르 안탈의 사상 협력자로 포섭되어 '팔머'라는 암호명을 받았습니다."
 CZE_political_leaders_vojtech_filip_effect_text_text: "§G+15%§! §Y정치력 획득§!"
 CZE_political_leaders_katerina_konecna_text_text: "§R카테르지나 코네츠나§!"
 CZE_political_leaders_katerina_konecna_TT: "§Y카테르지나 코네츠나§!"
 CZE_political_leaders_katerina_konecna_delayed_TT: "카테르지나 코네츠나는 체코의 정치인으로, 2002년부터 2014년까지 모라비아-슬레스코 지방 소속 체코 의회 의원이었고, 보헤미아 모라비아 공산당 당원으로서 유럽 정치 및 EU 부문 그림자 장관직을 맡고 있습니다.\n\n1999년 그녀는 마사리크 대학교 경제행정대학에 입학했습니다. 이곳에서 국가 경제 분야를 공부했으며, 2002년 하원 의원에 당선된 뒤에는 공공경제행정 복합 전공으로 옮겨 2003년에 학사 학위를 받고 졸업했습니다.\n\n2009년 그녀는 금융행정대학교에서 공학 학위를 받았습니다. 4년 뒤에는 마사리크 대학교 법과대학에서 행정법 전공을 마치고 두 번째 학사 학위를 취득했습니다."
 CZE_political_leaders_katerina_konecna_effect_text_text: "§G+8%§! §Y생산성 증가§!"
 CZE_political_leaders_ods_title_text_text: "§1시민민주당§!"
 CZE_political_leaders_ods_description_text_text: "[CZE_political_leaders_ods_description_text_text]"
 CZE_political_leaders_ods_description_text_2000: "정당 인기도: [?THIS.party_pop_array^1|%1Y]\n§g현재 정당 인기도 효과:§!\n£foreign_influence_defense_modifier_texticon §Y외국 영향력 방어:§! [?CZE_ods_foreign_influence_defense_modifier|%.2+]\n£construction_speed_texticon §Y생산 속도 계수:§! [?CZE_ods_prod_speed_building_factor|%.2+]\n\n§1ODS§!의 상황은 불안정했습니다. ODA 및 §3KDU-ČSL§!과의 연립이 분열되면서 §G자유연합(훗날의 US-DEU)§!이 §1ODS§!를 지지하기를 거부하여 과반 확보가 무산되었습니다. §1ODS§!는 야당 협약에 서명했으며, 이는 당이 밀로시 제만 산하의 §tČSSD§! 정부에 신임을 제공하고 이를 유지하도록 약속하는 것이었습니다."
 CZE_political_leaders_ods_description_text_2002: "정당 인기도: [?THIS.party_pop_array^1|%1Y]\n§g현재 정당 인기도 효과:§!\n£foreign_influence_defense_modifier_texticon §Y외국 영향력 방어:§! [?CZE_ods_foreign_influence_defense_modifier|%.2+]\n£construction_speed_texticon §Y생산 속도 계수:§! [?CZE_ods_prod_speed_building_factor|%.2+]\n\n2002년 총선에서 §1ODS§!는 경제 성장과 사회 지출 개선에 집중하기로 했습니다. 그 사이 이들은 바츨라프 클라우스를 체코 대통령으로 선택했고 다음 선거를 앞두고 큰 인기를 얻었습니다."
 CZE_political_leaders_ods_description_text_2006: "정당 인기도: [?THIS.party_pop_array^1|%1Y]\n§g현재 정당 인기도 효과:§!\n£foreign_influence_defense_modifier_texticon §Y외국 영향력 방어:§! [?CZE_ods_foreign_influence_defense_modifier|%.2+]\n£construction_speed_texticon §Y생산 속도 계수:§! [?CZE_ods_prod_speed_building_factor|%.2+]\n\n이번에 §1ODS§!는 사회 지출 개혁과 §7녹색당§!과의 협력에 크게 집중하며, 이는 재생 에너지 발전 부문을 개선하는 데 도움이 됩니다. 그 밖에도 세제 개혁과 사회 지출 및 부패에 강하게 초점을 맞춘 2008년 상원 선거를 위한 철저한 준비를 목표로 합니다."
 CZE_political_leaders_ods_description_text_2010: "정당 인기도: [?THIS.party_pop_array^1|%1Y]\n§g현재 정당 인기도 효과:§!\n£foreign_influence_defense_modifier_texticon §Y외국 영향력 방어:§! [?CZE_ods_foreign_influence_defense_modifier|%.2+]\n£construction_speed_texticon §Y생산 속도 계수:§! [?CZE_ods_prod_speed_building_factor|%.2+]\n\n페트르 네차스가 당의 지도부를 맡으려 하고 있습니다. §1ODS§!는 자신들의 인기를 이용해 의회의 구성을 바꾸고 자기 사람들을 환경 부문의 수장으로 앉힐 준비가 되어 있습니다. 이러한 계획 때문에 §1ODS§!는 농업 생산성 증대, 더 나은 보급 관리, 신규 재생 에너지 발전기에 집중할 것입니다."
 CZE_political_leaders_ods_description_text_2013: "정당 인기도: [?THIS.party_pop_array^1|%1Y]\n§g현재 정당 인기도 효과:§!\n£foreign_influence_defense_modifier_texticon §Y외국 영향력 방어:§! [?CZE_ods_foreign_influence_defense_modifier|%.2+]\n£construction_speed_texticon §Y생산 속도 계수:§! [?CZE_ods_prod_speed_building_factor|%.2+]\n\n마사리크 대학교 전 총장이자 장관이었던 페트르 피알라가 대표로 선출되었습니다. 그의 지도력 아래 §1ODS§!는 새 공장을 짓고, 자원 채굴을 늘리며, 화석 연료보다 원자력을 우선시할 수 있게 됩니다."
 CZE_political_leaders_ods_description_text_2017: "정당 인기도: [?THIS.party_pop_array^1|%1Y]\n§g현재 정당 인기도 효과:§!\n£foreign_influence_defense_modifier_texticon §Y외국 영향력 방어:§! [?CZE_ods_foreign_influence_defense_modifier|%.2+]\n£construction_speed_texticon §Y생산 속도 계수:§! [?CZE_ods_prod_speed_building_factor|%.2+]\n\n좋은 지도자, 올바른 강령, 강력한 우파. 이 구호와 함께 §1ODS§!는 2017년 선거에 나섰습니다. 이 당은 연구 보조금과 도시 지역 확장에 집중합니다. 당은 새 공장을 짓고, 신기술을 연구하며, §0SPOLU§! 연립을 준비할 계획입니다."
 CZE_political_leaders_ods_description_text_2021: "정당 인기도: [?THIS.party_pop_array^1|%1Y]\n§g현재 정당 인기도 효과:§!\n£foreign_influence_defense_modifier_texticon §Y외국 영향력 방어:§! [?CZE_ods_foreign_influence_defense_modifier|%.2+]\n£construction_speed_texticon §Y생산 속도 계수:§! [?CZE_ods_prod_speed_building_factor|%.2+]\n\n§1ODS§!는 §3KDU-ČSL§!, §CTOP 09§!와 연립 정부를 구성했습니다. §0SPOLU§!가 결성되었으며 곧 해적당(Piráti)과 시장·무소속(Starostové)을 초대할 준비가 되어 있습니다. 페트르 피알라가 연합의 새 대표가 되었으며 정부에 앉을 새로운 정치인 5명을 준비할 것입니다."
 CZE_political_leaders_cssd_title_text_text: "§t체코 사회민주당§!"
 CZE_political_leaders_cssd_description_text_text: "[CZE_political_leaders_cssd_description_text_text]"
 CZE_political_leaders_cssd_description_text_2000: "정당 인기도: [?THIS.party_pop_array^3|%1Y]\n§g현재 정당 인기도 효과:§!\n£western_outlook_campaign_cost_modifier_texticon  §Y매일 민주주의 지지:§! [?CZE_cssd_democratic_drift|+]\n£GFX_stability_popularity_texticon §Y안정도:§! [?CZE_stab_factor|%.2+]\n\n체제 변혁 이후 제만 덕분에 §tČSSD§!는 1998년 총선 전에 급속히 막대한 인기를 얻었습니다.\n§tČSSD§!는 총선에서 승리하여 새 천년의 체코 공화국을 가장 먼저 이끌었습니다. 논란이 되게도, 이 정당은 자신들과 견해가 크게 다른 최대 야당 §1ODS§!와 권력을 나누어 가졌습니다."
 CZE_political_leaders_cssd_description_text_2002: "정당 인기도: [?THIS.party_pop_array^3|%1Y]\n§g현재 정당 인기도 효과:§!\n£western_outlook_campaign_cost_modifier_texticon  §Y매일 민주주의 지지:§! [?CZE_cssd_democratic_drift|+]\n£GFX_stability_popularity_texticon §Y안정도:§! [?CZE_stab_factor|%.2+]\n\n밀로시 제만을 블라디미르 슈피들라로 교체하면서 이전 정부의 스캔들을 끊어내는 데 성공했습니다. 이제 그는 당을 떠날 것인지, 아니면 외국인 투자자를 끌어들이고 사무 부문을 고도화할 자신의 프로그램을 계속할 것인지 선택해야 합니다. 그가 떠나기로 한다면 스타니슬라프 그로스가 반§RKSČM§! 프로그램을 들고 등장할 것입니다."
 CZE_political_leaders_cssd_description_text_2006: "정당 인기도: [?THIS.party_pop_array^3|%1Y]\n§g현재 정당 인기도 효과:§!\n£western_outlook_campaign_cost_modifier_texticon  §Y매일 민주주의 지지:§! [?CZE_cssd_democratic_drift|+]\n£GFX_stability_popularity_texticon §Y안정도:§! [?CZE_stab_factor|%.2+]\n\n2006년 총선을 앞두고 §tČSSD§!는 다시 한번 숱한 비리 의혹에 직면했습니다. 이 정당은 부패 및 관료제 개혁에 주력할 것입니다. 그 밖에 2008년 상원 선거가 다가오고 있어 모든 이목이 이 행사에 쏠려 있습니다. §tČSSD§!는 §1ODS§!와 맞서야 할 것입니다. §tČSSD§!는 생산성 향상에 크게 주력할 것입니다."
 CZE_political_leaders_cssd_description_text_2010: "정당 인기도: [?THIS.party_pop_array^3|%1Y]\n§g현재 정당 인기도 효과:§!\n£western_outlook_campaign_cost_modifier_texticon  §Y매일 민주주의 지지:§! [?CZE_cssd_democratic_drift|+]\n£GFX_stability_popularity_texticon §Y안정도:§! [?CZE_stab_factor|%.2+]\n\n2011년 보후슬라프 소보트카가 §tČSSD§!의 당수가 되었습니다. 새 프로그램은 화석 연료 에너지 생산 비용을 들여서라도 가능한 모든 원천의 재생 에너지 부문을 겨냥하고 있습니다. 또한 이 프로그램은 새로운 인프라 보조금과 건설 확대도 목표로 합니다."
 CZE_political_leaders_cssd_description_text_2013: "정당 인기도: [?THIS.party_pop_array^3|%1Y]\n§g현재 정당 인기도 효과:§!\n£western_outlook_campaign_cost_modifier_texticon  §Y매일 민주주의 지지:§! [?CZE_cssd_democratic_drift|+]\n£GFX_stability_popularity_texticon §Y안정도:§! [?CZE_stab_factor|%.2+]\n\n§2ANO§!의 세력이 커지고 있으니 이들과 연립을 구성하기 좋은 시기입니다. §tČSSD§!의 새 프로그램은 세금을 인상하고 문화 및 종교 유적을 복원하여 더 많은 사람을 나라로 끌어들일 것입니다. 교회 복원에 대한 관심 덕분에 §3KDU-ČSL§!도 협력을 시작하는 데 더 호의적입니다."
 CZE_political_leaders_cssd_description_text_2017: "정당 인기도: [?THIS.party_pop_array^3|%1Y]\n§g현재 정당 인기도 효과:§!\n£western_outlook_campaign_cost_modifier_texticon  §Y매일 민주주의 지지:§! [?CZE_cssd_democratic_drift|+]\n£GFX_stability_popularity_texticon §Y안정도:§! [?CZE_stab_factor|%.2+]\n\n세계에 불안정한 시기가 다가오고 있습니다. §tČSSD§!는 산업과 농업에 더 무게를 두는 방침을 내놓았으며 새 민간 공장과 농업 지구를 건설할 계획입니다. 위기가 닥칠 때 §tČSSD§!는 이에 대비하고 신속히 새로운 대응책을 마련할 것입니다."
 CZE_political_leaders_cssd_description_text_2021: "정당 인기도: [?THIS.party_pop_array^3|%1Y]\n§g현재 정당 인기도 효과:§!\n£western_outlook_campaign_cost_modifier_texticon  §Y매일 민주주의 지지:§! [?CZE_cssd_democratic_drift|+]\n£GFX_stability_popularity_texticon §Y안정도:§! [?CZE_stab_factor|%.2+]\n\n2020년의 전염병은 당 대표이자 내무장관인 얀 하마체크의 존재감을 크게 끌어올렸습니다. 당은 가을 지방 선거와 상원 선거에서 하마체크의 인기를 활용하려 했으며, 당의 구호는 '위기 속에서 우리가 여러분을 지키겠습니다'가 되었습니다. §Y§tČSSD§!는 질병에 맞설 준비가 되어 있습니다.§!"
 CZE_political_leaders_kdu_title_text_text: "§3기독교민주연합-체코슬로바키아 인민당§!"
 CZE_political_leaders_kdu_description_text_text: "[CZE_political_leaders_kdu_description_text_text]"
 CZE_political_leaders_kdu_description_text_2000: "정당 인기도: [?THIS.party_pop_array^14|%1Y]\n§g현재 정당 인기도 효과:§!\n£GFX_corporate_tax_income_multiplier_modifier_texticon  §Y농업 생산성:§! [?CZE_kdu_agricolture_productivity_modifier|%.2+]\n£foreign_influence_defense_modifier_texticon §Y외국 영향력 방어:§! [?CZE_kdu_foreign_influence_defense_modifier|%.2+]\n\n§3KDU-ČSL§!은 기독교 민주주의 정당입니다. 1919년 1월 여러 가톨릭 정당이 합당하여 창당된, 체코에서 가장 오래된 정당 중 하나입니다. 이 정당은 가족 지원, 양질의 교육, 농촌, 농업과 소기업, 기독교 가치의 증진과 환경 보호를 중시합니다."
 CZE_political_leaders_kdu_description_text_2002: "정당 인기도: [?THIS.party_pop_array^14|%1Y]\n§g현재 정당 인기도 효과:§!\n£GFX_corporate_tax_income_multiplier_modifier_texticon  §Y농업 생산성:§! [?CZE_kdu_agricolture_productivity_modifier|%.2+]\n£foreign_influence_defense_modifier_texticon §Y외국 영향력 방어:§! [?CZE_kdu_foreign_influence_defense_modifier|%.2+]\n\n2002년 7월, §3KDU-ČSL§!은 §tČSSD§!, §GUS-DEU§!, §1ODS§!의 동반자가 되려 시도할 것입니다. 이 계획은 각 정당과 §3KDU-ČSL§! 자신의 인기를 끌어올려 다음 프로그램에서 더욱 진전하는 데 도움이 될 것입니다."
 CZE_political_leaders_kdu_description_text_2006: "정당 인기도: [?THIS.party_pop_array^14|%1Y]\n§g현재 정당 인기도 효과:§!\n£GFX_corporate_tax_income_multiplier_modifier_texticon  §Y농업 생산성:§! [?CZE_kdu_agricolture_productivity_modifier|%.2+]\n£foreign_influence_defense_modifier_texticon §Y외국 영향력 방어:§! [?CZE_kdu_foreign_influence_defense_modifier|%.2+]\n\n선거 이후 §3KDU-ČSL§!은 §7녹색당§!, §1ODS§!와 협력을 시작하려 합니다. 신임 당수 이르지 추네크는 다음 당 강령에 교회 추가 보수와 사회 지출 변경, 치안 의식을 높이기 위한 일부 법률 강화가 포함될 것이라고 발표했습니다."
 CZE_political_leaders_kdu_description_text_2010: "정당 인기도: [?THIS.party_pop_array^14|%1Y]\n§g현재 정당 인기도 효과:§!\n£GFX_corporate_tax_income_multiplier_modifier_texticon  §Y농업 생산성:§! [?CZE_kdu_agricolture_productivity_modifier|%.2+]\n£foreign_influence_defense_modifier_texticon §Y외국 영향력 방어:§! [?CZE_kdu_foreign_influence_defense_modifier|%.2+]\n\n다른 정당들이 재생 에너지와 환경 보호에 더 큰 관심을 기울이기 시작하면서 §3KDU-ČSL§!도 뒤처지지 않고 자체 생태 프로그램을 내놓았습니다. 이들은 더 효율적인 연료와 새로운 재생 에너지 기술을 개발하고, 일부 사회 개혁을 마무리하며, 원자력 발전을 개선하겠다고 약속합니다."
 CZE_political_leaders_kdu_description_text_2013: "정당 인기도: [?THIS.party_pop_array^14|%1Y]\n§g현재 정당 인기도 효과:§!\n£GFX_corporate_tax_income_multiplier_modifier_texticon  §Y농업 생산성:§! [?CZE_kdu_agricolture_productivity_modifier|%.2+]\n£foreign_influence_defense_modifier_texticon §Y외국 영향력 방어:§! [?CZE_kdu_foreign_influence_defense_modifier|%.2+]\n\n§3KDU-ČSL§!은 에너지 및 환경 부문의 변화를 포함한 기존 프로그램을 이어갑니다. 이 정당은 장관이 될 새로운 정치인들을 준비해 두었습니다. 이를 가능하게 하려면 §3KDU-ČSL§!에 인기가 필요합니다. 다행히 유럽 의회 선거가 다가오고 있습니다. 성공한다면 §3KDU-ČSL§!은 프로그램을 완수하기에 충분한 인기를 얻을 수도 있습니다."
 CZE_political_leaders_kdu_description_text_2017: "정당 인기도: [?THIS.party_pop_array^14|%1Y]\n§g현재 정당 인기도 효과:§!\n£GFX_corporate_tax_income_multiplier_modifier_texticon  §Y농업 생산성:§! [?CZE_kdu_agricolture_productivity_modifier|%.2+]\n£foreign_influence_defense_modifier_texticon §Y외국 영향력 방어:§! [?CZE_kdu_foreign_influence_defense_modifier|%.2+]\n\n당 대회는 당명의 공식 변경을 승인했으며, 이것이 현재의 약칭 §3KDU-ČSL§!입니다. §3KDU-ČSL§!의 새 지도부는 부모 지원을 정책의 핵심으로 삼았습니다. 환경 보호와 기후 변화 대응이 또 다른 우선 과제로 제시되었습니다."
 CZE_political_leaders_kdu_description_text_2021: "정당 인기도: [?THIS.party_pop_array^14|%1Y]\n§g현재 정당 인기도 효과:§!\n£GFX_corporate_tax_income_multiplier_modifier_texticon  §Y농업 생산성:§! [?CZE_kdu_agricolture_productivity_modifier|%.2+]\n£foreign_influence_defense_modifier_texticon §Y외국 영향력 방어:§! [?CZE_kdu_foreign_influence_defense_modifier|%.2+]\n\n2020년 10월, §3KDU-ČSL§!, §1ODS§!, §CTOP 09§!의 지도자들은 2021년 총선을 위한 연합 결성을 발표하고 이를 §0SPOLU§!(체코어로 §0함께§!)라고 이름 붙였습니다. §1페트르 피알라§!가 대표가 되었고, §3KDU-ČSL§!의 당수와 §CTOP 09§!의 당수는 부대표직을 맡았습니다."
 CZE_political_leaders_kscm_title_text_text: "§R보헤미아-모라비아 공산당§!"
 CZE_political_leaders_kscm_description_text_text: "[CZE_political_leaders_kscm_description_text_text]"
 CZE_political_leaders_kscm_description_text_2000: "정당 인기도: [?THIS.party_pop_array^4|%1Y]\n§g현재 정당 인기도 효과:§!\n£emerging_outlook_campaign_cost_modifier_texticon §Y매일 신흥국 지지:§! [?CZE_kscm_communist_drift_modifier|+]\n£construction_speed_texticon §Y생산 속도 계수:§! [?CZE_kscm_prod_speed_building_factor|%.2+]\n\n§RKSČM§!은 1990년 §R체코슬로바키아 공산당§!의 후신으로 창당되었으나, 1992년 4월까지는 정당 연방의 틀 안에서 계속 활동했습니다. 정당 연방의 해체는 체코슬로바키아 분리 이전에 이루어졌으며, 당시 이 정당은 체코의 §RKSČM§!과 슬로바키아 민주좌파당으로 갈라졌습니다."
 CZE_political_leaders_kscm_description_text_2002: "정당 인기도: [?THIS.party_pop_array^4|%1Y]\n§g현재 정당 인기도 효과:§!\n£emerging_outlook_campaign_cost_modifier_texticon §Y매일 신흥국 지지:§! [?CZE_kscm_communist_drift_modifier|+]\n£construction_speed_texticon §Y생산 속도 계수:§! [?CZE_kscm_prod_speed_building_factor|%.2+]\n\n이번에 §RKSČM§!은 조세 제도 개선, §3KDU-ČSL§!과 §1ODS§!의 인기 하락, 그리고 러시아와의 관계 재개선에 크게 주력할 것입니다. 이러한 관점은 체코 공화국이 러시아 자원에 더 의존하게 만들겠지만, 무역 수입을 늘리고 관계 증진에도 도움이 될 것입니다."
 CZE_political_leaders_kscm_description_text_2006: "정당 인기도: [?THIS.party_pop_array^4|%1Y]\n§g현재 정당 인기도 효과:§!\n£emerging_outlook_campaign_cost_modifier_texticon §Y매일 신흥국 지지:§! [?CZE_kscm_communist_drift_modifier|+]\n£construction_speed_texticon §Y생산 속도 계수:§! [?CZE_kscm_prod_speed_building_factor|%.2+]\n\n§RKSČM§!은 기존 프로그램을 이어가되 이번에는 산업 부문에 더 중점을 둡니다. §tČSSD§!의 도움으로 새 인프라를 건설하고, 자원 부문을 확대하며, 농업 발전을 지원할 수 있을 것입니다."
 CZE_political_leaders_kscm_description_text_2010: "정당 인기도: [?THIS.party_pop_array^4|%1Y]\n§g현재 정당 인기도 효과:§!\n£emerging_outlook_campaign_cost_modifier_texticon §Y매일 신흥국 지지:§! [?CZE_kscm_communist_drift_modifier|+]\n£construction_speed_texticon §Y생산 속도 계수:§! [?CZE_kscm_prod_speed_building_factor|%.2+]\n\n새로운 10년이 밝으면서 §RKSČM§!은 완전히 새로운 프로그램을 내놓습니다. 주된 목표는 재생 에너지 기술 개발에 대한 강력한 지원과 국가 생산성 향상 지원이며, 특히 농업 부문의 개선을 강조합니다."
 CZE_political_leaders_kscm_description_text_2013: "정당 인기도: [?THIS.party_pop_array^4|%1Y]\n§g현재 정당 인기도 효과:§!\n£emerging_outlook_campaign_cost_modifier_texticon §Y매일 신흥국 지지:§! [?CZE_kscm_communist_drift_modifier|+]\n£construction_speed_texticon §Y생산 속도 계수:§! [?CZE_kscm_prod_speed_building_factor|%.2+]\n\n마지막 남은 유력 공산당이 정말로 강력한 위기에 직면하려 하고 있습니다. 그러나 유럽 공산당들 사이에서 주도권을 얻는 계획에 성공한다면 §RKSČM§!에게도 아직 희망은 있습니다."
 CZE_political_leaders_kscm_description_text_2017: "정당 인기도: [?THIS.party_pop_array^4|%1Y]\n§g현재 정당 인기도 효과:§!\n£emerging_outlook_campaign_cost_modifier_texticon §Y매일 신흥국 지지:§! [?CZE_kscm_communist_drift_modifier|+]\n£construction_speed_texticon §Y생산 속도 계수:§! [?CZE_kscm_prod_speed_building_factor|%.2+]\n\n여기가 §RKSČM§! 국가 중점 트리가 끝나는 지점입니다. 이야기는 현재 완결되었습니다. 이 정당은 §tČSSD§!와 좋은 관계를 유지하며 다음 프로그램을 마무리하려 노력합니다."
 CZE_political_leaders_kscm_description_text_2021: "정당 인기도: [?THIS.party_pop_array^4|%1Y]\n§g현재 정당 인기도 효과:§!\n£emerging_outlook_campaign_cost_modifier_texticon §Y매일 신흥국 지지:§! [?CZE_kscm_communist_drift_modifier|+]\n£construction_speed_texticon §Y생산 속도 계수:§! [?CZE_kscm_prod_speed_building_factor|%.2+]\n\n당 대표 보이테흐 필리프가 사임했습니다. 2021년 10월 23일부로 §RKSČM§! 지도부 최초의 여성이 된 카테리나 코네츠나가 당 대표를 맡고 있습니다."
 CZE_political_leaders_us_title_text_text: "§G자유연합-민주연합§!"
 CZE_political_leaders_us_description_text_text: "[CZE_political_leaders_us_description_text_text]"
 CZE_political_leaders_us_description_text_2000: "정당 인기도: [?THIS.party_pop_array^2|%1Y]\n§g현재 정당 인기도 효과:§!\n£social_cost_multiplier_modifier_texticon  §Y복지 비용 배수:§! [?CZE_us_social_cost_multiplier_modifier|%.2-]\n£police_cost_multiplier_modifier_texticon  §Y경찰 비용 배수:§! [?CZE_us_police_cost_multiplier_modifier|%.2-]\n\n§G자유연합§!은 1998년 1월, 바츨라프 클라우스의 지도력에 불만을 품은 §1ODS§! 전 당원들이 창당했습니다.\n§G자유연합§!은 1998년 선거 후 야당이 되었습니다. 야당 시절 §G민주연합§!과 합당했고 §3KDU-ČSL§!과 연합을 구성했습니다."
 CZE_political_leaders_us_description_text_2002: "정당 인기도: [?THIS.party_pop_array^2|%1Y]\n§g현재 정당 인기도 효과:§!\n£social_cost_multiplier_modifier_texticon  §Y복지 비용 배수:§! [?CZE_us_social_cost_multiplier_modifier|%.2-]\n£police_cost_multiplier_modifier_texticon  §Y경찰 비용 배수:§! [?CZE_us_police_cost_multiplier_modifier|%.2-]\n\n2002년 선거 이후 무언가가 달라졌습니다. 이 정당은 카타르 왕자 사건 같은 여러 논란에 시달렸습니다. 2006년 선거를 위해 이들은 새로운 유권자를 끌어들일 매우 파격적인 프로그램을 들고 나올 것입니다..."
 CZE_political_leaders_us_description_text_2006: "정당 인기도: [?THIS.party_pop_array^2|%1Y]\n§g현재 정당 인기도 효과:§!\n£social_cost_multiplier_modifier_texticon  §Y복지 비용 배수:§! [?CZE_us_social_cost_multiplier_modifier|%.2-]\n£police_cost_multiplier_modifier_texticon  §Y경찰 비용 배수:§! [?CZE_us_police_cost_multiplier_modifier|%.2-]\n\n2006년 선거를 앞두고 §GUS-DEU§!는 이미지를 급진적으로 바꾸어 오망성을 상징으로 내세우고, 극단적 자유주의에서 아나키즘에 이르는 성향의 젊은 유권자들의 표를 얻으려 했습니다. 당분간은 새 건물을 짓고 세제를 개선하는 데 주력할 것입니다."
 CZE_political_leaders_us_description_text_2010: "정당 인기도: [?THIS.party_pop_array^2|%1Y]\n§g현재 정당 인기도 효과:§!\n£social_cost_multiplier_modifier_texticon  §Y복지 비용 배수:§! [?CZE_us_social_cost_multiplier_modifier|%.2-]\n£police_cost_multiplier_modifier_texticon  §Y경찰 비용 배수:§! [?CZE_us_police_cost_multiplier_modifier|%.2-]\n\n2010년 선거에서 §GUS-DEU§!는 출마하지 않고 §1ODS§! 지지를 표명했습니다. §GUS-DEU§!는 2011년 1월 1일 공식적으로 소멸했습니다. 그럼에도 이 정당은 2015년분을 포함해 매년 재정 보고서를 계속 제출하고 있습니다(이는 미래에서 온 메시지였습니다)."
 CZE_political_leaders_ano_title_text_text: "§2불만 시민 행동 2011§!"
 CZE_political_leaders_ano_description_text_text: "[CZE_political_leaders_ano_description_text_text]"
 CZE_political_leaders_ano_description_text_2011: "정당 인기도: [?THIS.party_pop_array^13|%1Y]\n§g현재 정당 인기도 효과:§!\n£tax_gain_multiplier_modifier_texticon §Y법인세 수입:§! [?CZE_ano_corporate_tax_income_multiplier_modifier|%.2+]\n£construction_speed_texticon §Y생산 속도 계수:§! [?CZE_ano_prod_speed_building_factor|%.2+]\n\n§2ANO§!는 2011년 가을에 창당되었습니다. 이 운동은 기존 정치 세력에 불만을 가진 유권자들에게 초점을 맞추었습니다. 운동의 목표는 모든 수준의 선거에 참여하고, 기업인과 자영업자에게 더 우호적인 환경을 조성하며, 부패와 정치 공작을 근절하고, 고용 증가를 촉진하는 것입니다."
 CZE_political_leaders_ano_description_text_2013: "정당 인기도: [?THIS.party_pop_array^13|%1Y]\n§g현재 정당 인기도 효과:§!\n£tax_gain_multiplier_modifier_texticon §Y법인세 수입:§! [?CZE_ano_corporate_tax_income_multiplier_modifier|%.2+]\n£construction_speed_texticon §Y생산 속도 계수:§! [?CZE_ano_prod_speed_building_factor|%.2+]\n\n§2ANO§!는 모든 당원이 따라야 하는 새로운 윤리 강령을 내놓았습니다. 이 정당은 또한 §tČSSD§!, §3KDU-ČSL§!과 연립을 구성하려 하며, 이는 정부에 입성하고 중요한 개혁을 추진하며 다음 선거 공약을 준비하는 데 도움이 될 것입니다."
 CZE_political_leaders_ano_description_text_2017: "정당 인기도: [?THIS.party_pop_array^13|%1Y]\n§g현재 정당 인기도 효과:§!\n£tax_gain_multiplier_modifier_texticon §Y법인세 수입:§! [?CZE_ano_corporate_tax_income_multiplier_modifier|%.2+]\n£construction_speed_texticon §Y생산 속도 계수:§! [?CZE_ano_prod_speed_building_factor|%.2+]\n\n2017년 §2ANO§!의 공약은 경제 성장, 과대 책정된 국가 계약 제한, 국가의 신속한 건설과 디지털화, 신기술 보조금 지급이었습니다. 이러한 단호한 행동은 이들이 막대한 인기를 얻는 데 도움이 될 것입니다."
 CZE_political_leaders_ano_description_text_2021: "정당 인기도: [?THIS.party_pop_array^13|%1Y]\n§g현재 정당 인기도 효과:§!\n£tax_gain_multiplier_modifier_texticon §Y법인세 수입:§! [?CZE_ano_corporate_tax_income_multiplier_modifier|%.2+]\n£construction_speed_texticon §Y생산 속도 계수:§! [?CZE_ano_prod_speed_building_factor|%.2+]\n\n2022년 10월 30일, 안드레이 바비시는 TV 노바에 출연하여 체코 공화국 대통령직에 출마할 의사를 밝혔습니다. 원래 공식 후보는 10월 26일에 발표될 예정이었으나, 안드레이 바비시가 병중이어서 날짜가 2022년 10월 31일로 미뤄졌고, 이날 기자회견도 열렸습니다."
 CZE_political_leaders_top_title_text_text: "§C전통 책임 번영§!"
 CZE_political_leaders_top_description_text_text: "[CZE_political_leaders_top_description_text_text]"
 CZE_political_leaders_top_description_text_2009: "정당 인기도: [?THIS.party_pop_array^2|%1Y]\n§g현재 정당 인기도 효과:§!\n£health_cost_multiplier_modifier_texticon §Y의료 비용 배수:§! [?CZE_top_health_cost_multiplier_modifier|%.2-]\n£under_construction_texticon §Y건물 노동자 요구량:§! [?CZE_top_buildings_worker_requirement_modifier|%.2-]\n\n§CTOP 09§!는 2009년 6월 11일 §3KDU-ČSL§!을 탈당한 미로슬라프 칼루세크가 창당했습니다. 이 정당은 유럽적 정체성과 고대 및 유대-기독교 문화의 유산을 강조합니다.\n체코 정치 무대에서 가장 친유럽적인 정당 중 하나입니다."
 CZE_political_leaders_top_description_text_2010: "정당 인기도: [?THIS.party_pop_array^2|%1Y]\n§g현재 정당 인기도 효과:§!\n£health_cost_multiplier_modifier_texticon §Y의료 비용 배수:§! [?CZE_top_health_cost_multiplier_modifier|%.2-]\n£under_construction_texticon §Y건물 노동자 요구량:§! [?CZE_top_buildings_worker_requirement_modifier|%.2-]\n\n§CTOP 09§!는 녹색 국토와 자연 경관을 지키기 위한 대대적인 환경 개혁을 주창합니다. 이들은 농업을 돕고, 재생 에너지를 개선하며, 유럽 연합과 더 가까워지기 위해 많은 노력을 기울입니다."
 CZE_political_leaders_top_description_text_2013: "정당 인기도: [?THIS.party_pop_array^2|%1Y]\n§g현재 정당 인기도 효과:§!\n£health_cost_multiplier_modifier_texticon §Y의료 비용 배수:§! [?CZE_top_health_cost_multiplier_modifier|%.2-]\n£under_construction_texticon §Y건물 노동자 요구량:§! [?CZE_top_buildings_worker_requirement_modifier|%.2-]\n\n새 정부 대표들, 특히 §2ANO§! 운동의 대표 안드레이 바비시는 §CTOP 09§!에 대한 비방 캠페인을 벌였습니다. 이 정당은 §2ANO§!에 맞서 방어하면서, 대규모 지역 개발과 더 많은 사람을 나라로 끌어들이는 것을 포함한 프로그램을 계속 추진해야 했습니다."
 CZE_political_leaders_top_description_text_2017: "정당 인기도: [?THIS.party_pop_array^2|%1Y]\n§g현재 정당 인기도 효과:§!\n£health_cost_multiplier_modifier_texticon §Y의료 비용 배수:§! [?CZE_top_health_cost_multiplier_modifier|%.2-]\n£under_construction_texticon §Y건물 노동자 요구량:§! [?CZE_top_buildings_worker_requirement_modifier|%.2-]\n\n2020년 10월 27일, §1ODS§!와 §3KDU-ČSL§! 대표들은 총선을 앞두고 협력 각서에 서명하고 연합의 이름을 §0SPOLU§!로 정했습니다. 그 밖에도 이 정당은 계속해서 새 인물을 영입하고 산업 부문을 키웠으며, 여전히 환경 보호를 우선시했습니다."
 CZE_political_leaders_top_description_text_2021: "정당 인기도: [?THIS.party_pop_array^2|%1Y]\n§g현재 정당 인기도 효과:§!\n£health_cost_multiplier_modifier_texticon §Y의료 비용 배수:§! [?CZE_top_health_cost_multiplier_modifier|%.2-]\n£under_construction_texticon §Y건물 노동자 요구량:§! [?CZE_top_buildings_worker_requirement_modifier|%.2-]\n\n§0SPOLU§! 연합은 2021년 10월 총선에서 득표율 27.79%로 승리했습니다. 이후 §0SPOLU§! 연합은 §g해적당과 시장·무소속 연합§!과 정부 구성 협상을 시작했습니다."
