l_braz_por:
 SOV_proclaim_soviet_hegemony: "Proclamar a Hegemonia Soviética"
 EST_new_economic_policy_desc: "Desde que restabelecemos nossa independência, conseguimos nos posicionar como uma ponte entre o Oriente e o Ocidente, além de buscar reformas econômicas e integração com o Ocidente. No entanto, devemos formular uma nova política que esteja mais alinhada com nossos parceiros estrangeiros, uma política mais lucrativa e metódica."
 SOV_proclaim_soviet_hegemony_desc: "Com a economia recuperada e as massas mobilizadas, a Rússia está pronta para retomar seu papel de liderança. Afirmaremos abertamente a primazia soviética, deslocando o equilíbrio de poder para o leste e pressionando os estados europeus a lidarem com o nosso retorno."
 SOV_the_third_rome_desc: "Moscou, a Terceira Roma, é a ideia de que Moscou é a sucessora da Roma antiga e de Bizâncio, carregando adiante o legado do Império Romano. Esse conceito tem sido debatido ao longo da história europeia quanto a qual cidade herda por direito esse legado."
 polish_focus: "Árvore de Focos da Polônia"
 SOV_socialist_humanism_desc: "O socialismo não é apenas uma questão de fábricas e cotas, mas da dignidade do trabalhador. Colocaremos o bem-estar humano no centro da revolução, provando que o caminho comunista serve ao povo e não o contrário."
 SOV_socialist_humanism: "Humanismo Socialista"
 SOV_the_third_rome: "A Terceira Roma"
 king: "Origem: Realeza"