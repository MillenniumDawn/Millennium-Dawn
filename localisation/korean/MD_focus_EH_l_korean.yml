 sp_monitor_portal_energy_emissions_project: "차원문 에너지 방출 감시"
 sp_monitor_portal_energy_emissions_project_desc: "위성의 도움으로 가장 가까운 차원문의 에너지 방출을 감시할 것입니다. 이를 통해 적과 그 움직임에 대한 더 많은 정보를 수집할 수 있습니다. 성공한다면 이 방출로 인해 위성망에 발생하는 주기적인 오작동도 해결할 수 있을지 모릅니다."
 sp_monitor_portal_energy_emissions_project_prototype: "불규칙한 에너지 신호"
 sp_monitor_portal_energy_emissions_project_prototype_desc: "손상된 위성들이 차원문에서 끊임없이 포착되는 불규칙한 에너지 신호를 보고했습니다. 이것이 위성망 오작동의 원인으로 보입니다. 이 방출로부터 위성을 보호할 대책을 마련할 수도 있고, 이 현상을 더 잘 이해하기 위해 더 많은 시간을 들여 연구할 수도 있습니다."
 sp_monitor_portal_energy_emissions_project_prototype_a: "진척이 가장 중요하다"
 sp_monitor_portal_energy_emissions_project_prototype_b: "추가 연구에 시간을 들인다"
 sp_spies_in_hive_project: "벌집 속의 첩자"
 sp_spies_in_hive_project_desc: "일부 키메라 부대는 공격에 성공한 뒤 차원문 지대로 되돌아갑니다. 이 단계에서 이들은 거의 본능적인 행동을 보이며, 추적기와 작은 카메라를 부착할 기회가 생깁니다. 그 후 이들이 차원문으로 돌아가게 둘 것입니다. 무엇이 잘못될 수 있겠습니까?"
 sp_spies_in_hive_project_prototype: "메카가 우리의 배달부가 될 수 있다"
 sp_spies_in_hive_project_prototype_desc: "메카를 생산하고 있으므로, 키메라 군세와 싸우는 동안 메카로 추적기를 부착할 수 있습니다. 위험하며 틀림없이 많은 훌륭한 기계와 조종사를 잃겠지만, 이 전쟁을 끝내는 데 한 걸음 더 다가갈 수 있습니다."
 sp_spies_in_hive_project_prototype_a: "메카만 사용한다"
 sp_spies_in_hive_project_prototype_b: "메카를 너무 많이 잃을 수 없으니 군대가 돕는다"
 sp_spies_in_hive_project_prototype_c: "추가 위험은 감수하지 않는다"
 sp_the_tesla_weapon_project: "T.E.S.L.A. 무기"
 sp_the_tesla_weapon_project_desc: "선형 소멸 전술 전자기 체계(T.E.S.L.A.)는 넓은 반경 내의 전자 체계를 무력화할 수 있는 강력한 전자기 펄스(EMP)를 방출하도록 설계된 초병기입니다. 이 무기는 차원문을 교란하고 키메라 군세를 영구적으로 약화시키는 열쇠가 될 수 있습니다."
 sp_the_tesla_weapon_project_prototype: "연구 부문 방향 재설정"
 sp_the_tesla_weapon_project_prototype_desc: "모든 연구 역량을 T.E.S.L.A. 무기 개발로 돌릴 수 있습니다. 프로젝트는 빨라지겠지만 다른 중요한 연구 계획이 지연될 수 있습니다."
 sp_the_tesla_weapon_project_prototype_a: "모든 연구를 T.E.S.L.A.에 집중한다"
 sp_the_tesla_weapon_project_prototype_b: "연구 역량을 균형 있게 배분한다"
 sp_the_tesla_weapon_project_prototype_c: "지연은 용납할 수 없다"
 sp_hacs_gen_one_project: "BF-38 아틀라스"
 sp_hacs_gen_one_project_desc: "1세대 고기동 전투 체계(HACS) 메카는 키메라에 맞선 우리 싸움의 중요한 이정표가 될 것입니다. 이 메카들은 키메라 군세와 싸우는 데 가장 큰 자산이 될 것입니다."
 sp_hacs_gen_one_project_prototype_western_one: "내구력인가 화력인가?"
 sp_hacs_gen_one_project_prototype_western_one_desc: "전장은 거친 곳이며, 우리 메카는 강력한 일격을 가하면서도 집중포화를 견뎌 낼 수 있어야 합니다. HACS의 내구력을 강화하여 전투에서 더 잘 버티게 할 수 있습니다. 아니면 화력을 우선시하여 메카에 첨단 무장을 갖춰 적을 신속히 제거할 수도 있습니다."
 sp_hacs_gen_one_project_prototype_western_one_a: "내구력 강화"
 sp_hacs_gen_one_project_prototype_western_one_b: "화력 우선"
 sp_hacs_gen_one_project_prototype_western_one_c: "지금 그대로 완벽하다"
 sp_hacs_gen_one_project_prototype_western_two: "HACS 구성 요소 우선순위"
 sp_hacs_gen_one_project_prototype_western_two_desc: "HACS 설계를 개선할 여유 자금이 있습니다. 메카의 기동성을 강화하여 전장에서 더 빠르고 민첩하게 만드는 데 집중할 수 있습니다. 아니면 무기 체계 개선에 투자하여 공격 능력을 높일 수도 있습니다."
 sp_hacs_gen_one_project_prototype_western_two_a: "기동성에 집중"
 sp_hacs_gen_one_project_prototype_western_two_b: "무장에 집중"
 sp_hacs_gen_one_project_prototype_eastern_one: "생산 감축 가능성"
 sp_hacs_gen_one_project_prototype_eastern_one_desc: "생산 속도를 높이기 위해 HACS 설계에서 일부 안전 장치와 중복 체계를 생략할 수 있습니다. 이는 오작동률을 약간 높일 수 있지만, 더 많은 메카를 더 빨리 전장에 배치할 수 있게 해 줄 것입니다."
 sp_hacs_gen_one_project_prototype_eastern_one_a: "최대한 빨리 필요하다"
 sp_hacs_gen_one_project_prototype_eastern_one_b: "더 공을 들여야 한다"
 sp_hacs_gen_one_project_prototype_eastern_one_c: "현재 생산 기준을 유지한다"
 sp_hacs_gen_one_project_prototype_eastern_two: "전장에서의 효율성"
 sp_hacs_gen_one_project_prototype_eastern_two_desc: "더 많은 수의 HACS 메카를 제작하여 압도적인 수로 적을 제압할 수 있습니다. 아니면 생산 수량이 줄더라도 메카의 설계를 개선하여 전투 효율을 높이는 데 집중할 수 있습니다."
 sp_hacs_gen_one_project_prototype_eastern_two_a: "더 많은 메카가 필요하다"
 sp_hacs_gen_one_project_prototype_eastern_two_b: "설계를 개선하자"
 sp_hacs_gen_two_project: "GSK-41 보가티리"
 sp_hacs_gen_two_project_desc: "우리의 최신 위풍당당한 HACS 메카를 또 한 번 개량할 때가 왔습니다. 열정적인 민간 기술자와 과학자들 덕분에 메카의 설계를 한층 더 개선할 수 있었습니다. 어쩌면 생산 비용을 낮출 방법까지 찾을지도 모릅니다."
 sp_hacs_gen_two_project_prototype_western_one: "랜달라이트 비용 절감"
 sp_hacs_gen_two_project_prototype_western_one_desc: "오래된 연구 기록을 뒤적이다가 HACS 생산에 쓰이는 랜달라이트의 양을 줄일 아이디어를 몇 가지 발견했습니다. 이 변경을 적용하면 성능에 큰 영향을 주지 않으면서 메카 한 대당 비용을 낮출 수 있습니다."
 sp_hacs_gen_two_project_prototype_western_one_a: "물론이지!"
 sp_hacs_gen_two_project_prototype_western_one_b: "메카를 약화시킬 수는 없다"
 sp_hacs_gen_two_project_prototype_eastern_one: "랜달라이트 비용 절감"
 sp_hacs_gen_two_project_prototype_eastern_one_desc: "랜달라이트에 대한 새로운 연구 덕분에 HACS 생산에 쓰이는 이 귀중한 자원의 양을 더욱 줄일 방법을 찾았습니다. 같은 양의 랜달라이트로 더 많은 메카를 생산할 수 있지만, 기계는 성능을 일부 희생해야 합니다."
 sp_hacs_gen_two_project_prototype_eastern_one_a: "그래, 안 될 것 없지"
 sp_hacs_gen_two_project_prototype_eastern_one_b: "전장에서의 불리함이 너무 크다"
 sp_hacs_gen_three_project: "SAS-32 헤라클레스"
 sp_hacs_gen_three_project_desc: "이것은 HACS 메카의 완벽한 개량형이며, 현재 우리가 제조할 수 있는 가장 강력한 HACS 메카 모델로서 키메라에 맞서 싸우는 우리의 능력을 극대화할 수 있습니다."
 sp_hacs_gen_three_project_prototype_one: "최종 병기"
 sp_hacs_gen_three_project_prototype_one_desc: "우리 기술자들은 키메라에 맞설 궁극의 무기를 만들겠다는 목표로 HACS 메카의 급진적인 재설계를 제안했습니다. 이 새로운 설계는 현재 기술의 한계를 넘어서 그 어느 때보다 빠르고 강하며 튼튼한 메카를 낳겠지만, 훨씬 높은 비용이 듭니다."
 sp_hacs_gen_three_project_prototype_one_a: "그것이 궁극의 무기다"
 sp_hacs_gen_three_project_prototype_one_b: "지금 당장 필요하다!"
 sp_hacs_gen_three_project_prototype_one_c: "현재 설계가 완벽하다"
 EH_spirits_lasts_until_war_is_active_TT: "§Y이 국가 정신은 침략자들과 전쟁 중인 동안 유지됩니다.§!"
 EH_defence_decrease_blocked_while_at_war_with_ALN_TT: "§R침략자들과 전쟁 중에는 군사비 지출을 줄일 수 없습니다.§!"
 EH_the_country_of_war_idea_TT: "§Y전쟁의 나라 변동치를 추가합니다.§!\n§R국가 중점 요건이 충족되지 않으면 제거됩니다.§!"
