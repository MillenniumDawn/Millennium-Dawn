 ALG_appoint_sellal: "Назначить Абдельмалека Селлала"
 ALG_appoint_sellal_desc: "Селлаль, технократ и верный сторонник Бутефлики, олицетворяет преемственность и прагматичное управление, уделяя особое внимание стабильности и эффективному функционированию государственных институтов."
 ALG_sellal_gets_appointed: "Абдельмалек Селлаль назначен премьер-министром."
 ALG_sellal_modifiers: "§YПоследствия визита Селлала:§!\nДемократический дрейф: §G+0.10§!\nБюрократические издержки: §G-10%§!\nНалоговый доход: §G+3%§!\nОжидаемые расходы полиции: §R-1§!\nОжидаемые расходы на здравоохранение: §R-1§!"
 ALG_appoint_ouyahia: "Назначить Ахмеда Оуяхию"
 ALG_appoint_ouyahia_desc: "Уяхья — опытный политик, известный своей жесткой политикой экономии и преданностью правящей элите. Его стиль руководства предполагает централизованный контроль и финансовую дисциплину."
 ALG_ouyahia_gets_appointed: "Ахмед Оуяхья назначен премьер-министром."
 ALG_ouyahia_modifiers: "§YПоследствия назначения Оуяхьи:§!\nДемократический дрейф: §G+0.10§!\nБюрократические издержки: §G-10%§!\nНалоговый доход: §G+3%§!\nОжидаемые расходы полиции: §R-1§!\nОжидаемые расходы на здравоохранение: §R-1§!"
 ALG_appoint_bedoui: "Назначить Нуреддина Бедуи"
 ALG_appoint_bedoui_desc: "Бедуи, кадровый бюрократ и министр, олицетворяет собой технократическую преданность президентству. Его стиль управления делает упор на эффективность управления и ограниченные реформы."
 ALG_bedoui_gets_appointed: "Нуреддин Бедуи был назначен премьер-министром."
 ALG_bedoui_modifiers: "§YПоследствия назначения Бедуи:§!\nДемократический дрейф: §G+0.10§!\nБюрократические издержки: §G-10%§!\nНалоговый доход: §G+3%§!\nОжидаемые расходы полиции: §R-1§!\nОжидаемые расходы на здравоохранение: §R-1§!"
 ALG_no_pm_set: "§RПремьер-министр не назначен§!"
 ALG_ahmed_gaid_salah_desc: "Начальник штаба Народной национальной армии Ахмед Гаид Салах был кадровым офицером, который продвинулся по служебной лестнице во время Войны за независимость и впоследствии стал одной из самых влиятельных фигур в военных и политических делах Алжира."
 ALG_smain_lamari_desc: "Глава алжирских разведывательных и контрразведывательных служб Смаин Ламари сыграл центральную роль в «Грязной войне» против исламистских повстанцев в период «Черного десятилетия»."
 ALG_kaidi_mohamed_desc: "Каиди Мохамед — уважаемый офицер с опытом службы в механизированных формированиях, специализировавшийся на бронетанковых боях и модернизации сухопутных войск Алжира."
 ALG_ahcene_tafer_desc: "Ахсен Тафер был известен своим лидерством в механизированных частях Алжира и своей ролью в реструктуризации армии в послевоенные годы."
 ALG_mohammed_larbi_haouli_desc: "Мохаммед Ларби Хаули командовал ВМС Алжира в период модернизации, совмещая береговую оборону с региональным сотрудничеством."
 ALG_ammar_atamnia_desc: "Аммар Атамния, высокопоставленный офицер, служивший стратегом в сухопутных войсках Алжира, был известен своим акцентом на оборонительной войне и военной подготовке."
 ALG_mohammed_al_arabi_hawalli_desc: "Мохаммед Аль-Араби Хавалли занимал командные должности на военно-морском флоте и внес вклад в реформирование военно-морских сил Алжира."
 ALG_mahmoud_laraba_desc: "Командир военно-воздушных сил Махмуд Лараба принимал участие в подготовке пилотов и реорганизации системы противовоздушной обороны Алжира."
 ALG_mohamed_lamari_desc: "В период «Черного десятилетия», занимая должность начальника штаба, Мохамед Ламари был одной из ключевых фигур, руководивших контртеррористическими операциями Алжира."
 ALG_said_chengriha_desc: "Саид Ченгриха специализировался на бронетанковых войсках и логистике, впоследствии дослужился до должности командующего сухопутными войсками Алжира, а затем и до начальника штаба."
 ALG_ben_ali_ben_ali_desc: "Бен Али, командующий элитными подразделениями Алжира, заслужил репутацию профессионала и дисциплинированного солдата в пехоте."
 ALG_fatima_zohra_ardjoune_desc: "Фатима Зора Арджун, одна из первых женщин в Алжире, дослужившихся до звания генерала, была военным врачом и символом модернизации вооруженных сил."
 ALG_mohamed_mediene_desc: "Известный как «Туфик», Мохамед Медьен возглавлял влиятельную алжирскую разведывательную службу (DRS) с 1990 по 2015 год, что делает его одной из самых влиятельных фигур в современной истории Алжира."
 ALG_abdelmalek_guenaizia_desc: "Абдельмалек Гуэнайзия занимал должности заместителя министра обороны, а затем начальника штаба, сыграв ключевую роль в модернизации алжирской армии."
 ALG_ahmed_bousteila_desc: "Командир алжирской жандармерии Ахмед Бустейла отвечал за безопасность сельских районов Алжира, а также за борьбу с контрабандой и терроризмом."
 ALG_fatima_boudouani_desc: "Фатима Будуани, первая женщина, получившая звание генерала в алжирской армии (2009 год), стала прорывом в вопросах гендерной интеграции в вооруженных силах."
 alg_medal_1: "Приказ от 1 ноября"
 alg_medal_1_desc: "Награжден за исключительную храбрость при защите страны."
 alg_medal_2: "Медаль за национальное освобождение"
 alg_medal_2_desc: "Памятник посвящен выдающемуся вкладу в борьбу за независимость Алжира."
 alg_medal_3: "Медаль «За военные заслуги»"
 alg_medal_3_desc: "Награжден за выдающиеся заслуги в командовании и службе."
 alg_medal_4: "Медаль «За доблесть»"
 alg_medal_4_desc: "Отмечает акты мужества на поле боя."
 alg_medal_5: "Медаль «За народную службу»"
 alg_medal_5_desc: "Награжден за самоотверженную службу по защите гражданского населения."
 alg_medal_6: "Медаль «Наследие мученика»"
 alg_medal_6_desc: "Символ высшей жертвы во имя нации."
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_0: "Второй лейтенант"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_1: "Лейтенант"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_2: "Капитан"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_3: "Главный"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_4: "Полковник"
 algeria_intro.1.t: "Алжирская Народно-Демократическая Республика"
 algeria_intro.1.d: "Алжир вступает в 21 век, покрытый шрамами кровавого Черного десятилетия, но все еще держащийся на ногах. Государство пережило исламистский мятеж, но раны гражданской войны остаются глубокими. Президент Абдельазиз Бутефлика обещает примирение и реконструкцию, но предстоящие задачи являются грандиозными: оживление экономики, реформа вооруженных сил, восстановление доверия между народом и государством и поиск компромиссов между могущественными иностранными партнерами. Укрепит ли Алжир стабильность и возвысится как региональная держава или снова погрузится во внутренние раздоры?"
 algeria_intro.1.a: "Нация, покрытая шрамами, но несломленная."
 ALG_resistance_window_title: "Алжирское движение сопротивления"
 ALG_resistance_window_desc: "Нация потрясена массовыми протестами, беспорядками и сопротивлением. Ле Пувуар стремится подавить инакомыслие, но чем сильнее оказывается давление, тем сильнее становится сопротивление."
 ALG_protester_exhaustion_TT: "§YПротестующие§! устали от ответных мер правительства."
 ALG_deploys_security_TT: "§YДля подавления беспорядков государство задействует крупные силы безопасности.§!"
 ALG_presidential_decisions_only_one_is_available_TT: "Одновременно может быть активирована только одна мера подавления."
 ALG_resistance_movement: "Движение Хирак"
 ALG_resistance_movement_desc: "В Алжире продолжаются общенациональные народные протесты, известные как «Хирак», с требованиями политических реформ, прозрачности и социальной справедливости."
 ALG_throttle_internet_speeds: "Постановление № 24-17: Регулирование телекоммуникаций"
 ALG_throttle_internet_speeds_desc: "Согласно Постановлению 24-17, власти ограничивают доступ к онлайн-платформам и социальным сетям, чтобы помешать организаторам «Хирака». Это ограничивает координацию протестов, но вызывает недовольство граждан и замедляет экономическую активность."
 ALG_nationwide_security_presence: "Операция «Пустынный ястреб»: присутствие в сфере национальной безопасности."
 ALG_fund_pro_government_protests: "Национальная программа солидарности: инициатива «Барака»."
 ALG_fund_pro_government_protests_desc: "Правительство финансирует и организует проправительственные демонстрации в рамках проекта «Барака» для противодействия движению «Хирак». Это может ослабить оппозиционный настрой, но обходится дорого и рискует разжечь общественное недовольство."
 ALG_deploy_security_kabylia_1: "Перебросить войска безопасности в Кабилию."
 ALG_deploy_security_kabylia_1_desc: "Кабилия превратилась в очаг беспорядков. Развертывание сил безопасности может успокоить регион, но это также чревато дальнейшим обострением местного недовольства."
 ALG_deploy_security_mzab_1: "Перебросить войска безопасности в долину Мзаб."
 ALG_deploy_security_mzab_1_desc: "Напряженность в долине Мзаб обострилась. Отправка отрядов безопасности может сдержать беспорядки на местном уровне, но жесткие операции рискуют оттолкнуть местные общины и подорвать долгосрочное доверие."
 ALG_deploy_security_aures_1: "Перебросить войска безопасности в высокогорье Ореса."
 ALG_deploy_security_aures_1_desc: "Высокогорье Ореса стало центром протестов. Развертывание сил безопасности может разогнать крупные собрания, но это создаст логистические трудности в условиях пересеченной местности и может обострить региональные разногласия."
 ALG_deploy_security_tamanrasset_1: "Перебросить войска безопасности в провинцию Таманрассет"
 ALG_deploy_security_tamanrasset_1_desc: "В южных провинциях Таманрассета наблюдается рост беспорядков. Развертывание войск может стабилизировать транспортные маршруты и ключевые объекты, но сопряжено с риском ухудшения отношений с местным населением и нарушения трансграничной торговли через Сахару."
 ALG_deploy_security_granderg_1: "Развернуть войска безопасности в районе Гранд-Эрг-Оксиденталь."
 ALG_deploy_security_granderg_1_desc: "Беспорядки вокруг национального парка Гранд-Эрг-Оксиденталь угрожают отдаленным поселениям и критически важной инфраструктуре. Патрулирование может обеспечить кратковременный порядок, однако суровые условия делают длительные операции дорогостоящими и политически чувствительными."
 ALG_deploy_security_atlas_1: "Перебросить войска безопасности в предгорья Атласских гор."
 ALG_deploy_security_atlas_1_desc: "В предгорьях Атласских гор регулярно проходят протесты и забастовки рабочих. Целенаправленное развертывание сил может предотвратить массовые мобилизации вдоль транспортных коридоров, но может усилить недовольство среди сельского населения."
 ALG_deploy_security_constantinois_1: "Перебросить войска безопасности в Константинопольский регион"
 ALG_deploy_security_constantinois_1_desc: "В Константине и его окрестностях часто проходят демонстрации. Концентрация сил безопасности здесь может защитить правительственные объекты и порты, но повышает вероятность столкновений в густонаселенных городских районах."
 ALG_deploy_security_algerois_1: "Развернуть войска безопасности в столичном регионе Алжира."
 ALG_deploy_security_algerois_1_desc: "Алжир остается центром активности движения «Хирак». Значительное присутствие сил безопасности может сдерживать уличные мобилизации и обеспечивать безопасность институтов, однако это сопряжено с риском видимых репрессий в столице и серьезными политическими последствиями."
 ALG_deploy_security_oranais_1: "Развернуть войска безопасности на побережье Орана и Западном побережье."
 ALG_deploy_security_oranais_1_desc: "В регионе Оран наблюдается рост демонстраций, связанных с профсоюзами и молодежными организациями. Развертывание войск может защитить порты и экономические центры, но может нарушить торговлю и обострить напряженность в отношениях с местными лидерами."
 ALG_doing_decision: "В настоящее время применяются меры по пресечению нарушений."
 ALG_doing_decision_y: "В настоящее время применяются меры по пресечению нарушений."
 ALG_protests_ongoing: "Протесты по всей стране продолжаются."
 ALG_locals_swayed: "Местные жители сочувствуют протестующим."
 ALG_kabylia_fell_recently: "Кабилия недавно была умиротворена."
 ALG_oranais_fell_recently: "Регион Оранаис недавно был умиротворен."
 ALG_algerois_fell_recently: "Недавно была проведена миротворческая операция в столичном регионе Алжира."
 ALG_constantinois_fell_recently: "Регион Константинополь недавно был усмирен."
 ALG_atlas_fell_recently: "Предгорья Атласа недавно были умиротворены."
 ALG_granderg_fell_recently: "Великий Эрг Оксиденталь недавно был умиротворен."
 ALG_tamanrasset_fell_recently: "Провинция Таманрассет недавно была умиротворена."
 ALG_aures_fell_recently: "Недавно высокогорье Ореса было умиротворено."
 ALG_mzab_fell_recently: "Долина Мзаб недавно была умиротворена."
 ALG_state_falls_TT: "§YThis state§! попал под влияние протестующих."
 algerian_events.201.t: "Мзаб пал под натиском протестующих"
 algerian_events.201.a: "Ещё один регион ускользает"
 algerian_events.202.t: "Орес пал перед протестующими"
 algerian_events.202.a: "Протесты распространились"
 algerian_events.203.t: "Таманрассет пал под натиском протестующих."
 algerian_events.203.a: "Юг нестабилен."
 algerian_events.204.t: "Гранд-Эрг-Оксиденталь пал под натиском протестующих."
 algerian_events.204.a: "Даже пустыня поднимается"
 algerian_events.205.t: "Алжирский Атлас пал под натиском протестующих."
 algerian_events.205.a: "Беспорядки усиливаются"
 algerian_events.206.t: "Константинуа пал перед протестующими"
 algerian_events.206.a: "Восточный фронт извергается"
 algerian_events.207.t: "Кабилия пала под натиском протестующих."
 algerian_events.207.a: "Кабилия возрождается"
 algerian_events.208.t: "Альжеруа пал перед протестующими"
 algerian_events.208.a: "Сердце Алжира трепещет"
 algerian_events.209.t: "Оранаис пал перед протестующими"
 algerian_events.209.a: "Запад потерян"
 algerian_events.201.d: "Жители Мзаба вышли из-под власти правительства и заняли улицы.\nНастроения мозабитов: [ALG_mozabite_satisfaction_text]"
 algerian_events.202.d: "В горах Орес недовольство переросло в открытое неповиновение.\nНастроения шауйя: [ALG_chaoui_satisfaction_text]"
 algerian_events.203.d: "Несмотря на удалённость, Таманрассет взорвался, и правительство теряет контроль над краем.\nНастроения туарегов: [ALG_tuareg_satisfaction_text]"
 algerian_events.204.d: "Жители пустынных районов Западного Гранд-Эрга присоединились к волне протестов.\nЖалоба общественности: [ALG_grievance_text]"
 algerian_events.205.d: "Атласский край, прежде тихий, стал очагом антиправительственных волнений.\nНастроения арабов: [ALG_arab_satisfaction_text]"
 algerian_events.206.d: "Протесты на востоке смяли местные силы безопасности: Константинуа пал.\nНастроения арабов: [ALG_arab_satisfaction_text]"
 algerian_events.207.d: "Кабилия, с её давними традициями инакомыслия, вновь открыто бросает вызов государству.\nКабильское настроение: [ALG_kabyle_satisfaction_text]"
 algerian_events.208.d: "Даже столичный регион потрясли неконтролируемые протесты.\nВоенный штаб: [ALG_army_grip_text]"
 algerian_events.209.d: "На западе Оранэ присоединился к волне волнений, катящейся по Алжиру.\nНастроения арабов: [ALG_arab_satisfaction_text]"
 algerian_events.200.t: "Протесты подавлены"
 algerian_events.200.d: "Силам безопасности удалось подавить последнюю волну демонстраций, хотя общественное недовольство по-прежнему тлеет."
 algerian_events.200.a: "Порядок восстановлен, по крайней мере, на данный момент."
 algerian_events.2015.t: "Подавление имеет обратный эффект."
 algerian_events.2015.d: "Попытки подавить протесты лишь усилили гнев, придали демонстрантам смелости и ослабили авторитет правительства."
 algerian_events.2015.a: "Ситуация ухудшается."
 algerian_events.2025.t: "Протесты закончились"
 algerian_events.2025.d: "После нескольких месяцев борьбы последняя волна протестов утихла. Напряженность сохраняется, но пока на улицах снова тихо."
 algerian_events.2025.a: "Наконец, воцаряется спокойствие."
 algerian_events.301.t: "В стране вспыхнули протесты!"
 algerian_events.301.d: "Похоже, наши недавние действия были восприняты народом крайне негативно, и по всей стране вспыхнули протесты. Постепенно, но неуклонно, всё больше людей требуют отставки правительства, хотя мы никуда не собираемся уходить."
 algerian_events.301.a: "Мы должны были это предвидеть!"
 ALG_khenchela_arms_manufacturer: "Оружейный комплекс Кхенчела"
 ALG_khenchela_arms_manufacturer_desc: "Государственный завод в провинции Хенчела, производящий пехотное оружие и снаряжение для Алжирской национальной народной армии. Создан для снижения зависимости от импорта оружия из-за рубежа и обеспечения самодостаточности в производстве стрелкового оружия."
 ALG_seriana_small_arms: "Завод стрелкового оружия Сериана"
 ALG_seriana_small_arms_desc: "Завод в Сериане, расположенный на востоке Алжира, производит винтовки, пистолеты и боеприпасы для алжирских сил безопасности. Завод находится под надзором Министерства национальной обороны."
 ALG_dgi_missile_systems: "DGI - Главное управление военной промышленности"
 ALG_dgi_missile_systems_desc: "Главное управление военной промышленности курирует оборонный сектор Алжира, включая разработку управляемого оружия, противотанковых/зенитных систем и артиллерии. Подчиняясь Министерству национальной обороны, Главное управление координирует деятельность государственных предприятий и военно-технических партнерств для обеспечения стратегической автономии."
 ALG_bcl_armored_development: "BCL - Бригада строительной логистики"
 ALG_bcl_armored_development_desc: "Военно-логистическая строительная бригада занимается техническим обслуживанием, модернизацией и ограниченным внутренним производством бронетехники. BCL специализируется на восстановлении техники советской эпохи и адаптации машин к оперативным условиям Сахары."
 ALG_snvi_vehicle_manufacturer: "SNVI - Национальное общество автомобильной промышленности"
 ALG_snvi_vehicle_manufacturer_desc: "Национальный производитель транспортных средств Алжира, основанный в 1967 году. SNVI производит военные грузовики, внедорожники и легкую бронетехнику в партнерстве с Mercedes-Benz и другими производителями, причем все конструкции адаптированы к местности и климату Северной Африки."
 ALG_enmib_helicopter_unit: "ENMIB - Национальное предприятие по материальному обеспечению и инфраструктуре базы"
 ALG_enmib_helicopter_unit_desc: "Алжирский завод по техническому обслуживанию и сборке вертолетов, предоставляющий услуги по капитальному ремонту и осуществляющий ограниченное производство для ВВС Алжира. ENMIB занимается лицензионной сборкой вертолетов зарубежных разработок."
 ALG_mers_el_kebir_shipyards: "Военно-морская верфь Мерс-эль-Кебир"
 ALG_mers_el_kebir_shipyards_desc: "Этот исторический военно-морской объект, расположенный в стратегически важном порту Мерс-эль-Кебир недалеко от Орана, занимается строительством и техническим обслуживанием патрульных и легких военно-морских судов для ВМС Алжира."
 ALG_el_djazair_naval_industry: "CNAN — Национальная алжирская навигационная компания"
 ALG_el_djazair_naval_industry_desc: "Алжирская национальная морская компания CNAN управляет верфями в Алжире, способными строить корветы, фрегаты и подводные лодки при помощи иностранных технических специалистов. Компания также занимается коммерческими перевозками и военно-морской логистикой."
 ALG_ersa_aircraft_manufacturer: "ERSA - Предприятие по ремонту и авиационному обслуживанию"
 ALG_ersa_aircraft_manufacturer_desc: "ERSA — это главный центр технического обслуживания, ремонта и капитального ремонта самолетов в Алжире. Компания осуществляет ограниченную сборку лицензированных самолетов для ВВС Алжира и предоставляет комплексные технические услуги в области авиации."
