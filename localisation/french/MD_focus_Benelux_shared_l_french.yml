l_french:
 BNL_dynmod_union: "Union Benelux"
 BNL_benelux_union_treaty: "Traité de l'Union Benelux"
 BNL_benelux_union_treaty_desc: "Signé à La Haye en 2008, le nouveau traité remplace l'accord de 1958 arrivant à expiration et rebaptise notre coopération Union Benelux. Il prolonge le marché commun et élargit notre travail conjoint à la justice, à la sécurité et au développement durable, offrant aux trois États un cadre moderne unique sur lequel bâtir."
 BNL_single_market: "Marché intérieur du Benelux"
 BNL_single_market_desc: "Le Benelux va plus loin que le marché européen élargi, en supprimant les barrières administratives qui divisent encore les trois économies. Longtemps laboratoire de l'intégration européenne, l'union expérimente les normes communes et la reconnaissance mutuelle qui permettent aux entreprises de commercer et d'opérer comme si les frontières n'existaient pas."
 BNL_capital_integration: "Intégration des marchés de capitaux"
 BNL_capital_integration_desc: "La Bourse d'Amsterdam, les banques de Bruxelles et la vaste industrie des fonds d'investissement luxembourgeoise forment déjà l'un des plus profonds bassins de capitaux d'Europe. Aligner la supervision financière et les règles transfrontalières laisse ce capital affluer librement vers les entreprises les plus productives de l'union."
 BNL_port_cooperation: "Rotterdam et Anvers"
 BNL_port_cooperation_desc: "Rotterdam et Anvers sont les deux plus grands ports d'Europe. Coordonner le cluster Anvers-Rotterdam-Amsterdam au lieu de se disputer le même fret fait de la logistique beneluxienne une porte d'entrée de classe mondiale unique."
 BNL_freight_corridors: "Couloirs de fret"
 BNL_freight_corridors_desc: "Des liaisons ferroviaires dédiées comme la Betuweroute et le Rhin de fer relient les ports maritimes à l'hinterland européen. Un investissement conjoint dans ces corridors renforce l'épine dorsale industrielle de l'union."
 BNL_north_sea_wind: "Vent de la mer du Nord"
 BNL_north_sea_wind_desc: "Dans le cadre de la North Seas Energy Cooperation, le Benelux développe conjointement l'éolien offshore. Mutualiser les raccordements au réseau fait de la mer du Nord une source d'énergie renouvelable partagée."
 BNL_gas_hub: "Hub gazier Benelux"
 BNL_gas_hub_desc: "Le gisement de Groningue et le terminal GNL de Zeebrugge font du Benelux un hub gazier. Coordonner l'approvisionnement via le Forum énergétique pentolatéral sécurise l'énergie de l'union."
 BNL_research_cooperation: "Région technologique la plus performante"
 BNL_research_cooperation_desc: "Eindhoven et Louvain, tendant vers Aix-la-Chapelle, forment la Top Technology Region, l'une des plus denses concentrations de recherche high-tech d'Europe. En mutualisant laboratoires, financements et talents dans ce triangle transfrontalier, le Benelux peut innover mieux que des rivaux bien plus grands."
 BNL_university_network: "Réseau universitaire"
 BNL_university_network_desc: "Delft, Louvain, Eindhoven et Wageningen ancrent un réseau académique dense. Relier leurs programmes et diplômes crée un vivier partagé de talents et de savoirs."
 BNL_hightech_triangle: "Triangle de haute technologie"
 BNL_hightech_triangle_desc: "Brainport Eindhoven, foyer d'ASML et de NXP, et imec à Louvain forment le cœur de la recherche européenne sur les semi-conducteurs. Un soutien conjoint à ce cluster maintient le Benelux à la frontière de la haute technologie."
 BNL_space_cooperation: "Coopération spatiale"
 BNL_space_cooperation_desc: "Le cœur technique de l'Agence spatiale européenne, l'ESTEC, se trouve à Noordwijk. Coordonner les contributions beneluxiennes aux efforts spatiaux européens bâtit une capacité d'ingénierie avancée."
 BNL_nuclear_research: "Recherche nucléaire"
 BNL_nuclear_research_desc: "Petten aux Pays-Bas et le SCK CEN à Mol en Belgique, avec son projet de réacteur MYRRHA, mènent la recherche européenne sur les réacteurs et les isotopes médicaux. Un programme conjoint fait progresser la science nucléaire de l'union."
 BNL_innovation_area: "Zone d'innovation Benelux"
 BNL_innovation_area_desc: "Relier le réseau de recherche, le cluster high-tech et les programmes nucléaire et spatial en un seul espace d'innovation fait du Benelux l'une des régions les plus intensives en recherche au monde."
 BNL_benelux_parliament: "Parlement Benelux"
 BNL_benelux_parliament_desc: "Un traité de 2015 remplace l'ancien Conseil consultatif de 1955 par l'Assemblée interparlementaire Benelux, offrant à l'union un forum parlementaire issu des trois législatures nationales. Le renforcer pose les bases d'une intégration politique plus profonde entre les trois États."
 BNL_benelux_court: "Cour de justice du Benelux"
 BNL_benelux_court_desc: "Un protocole de 2012 modernise la Cour de justice Benelux, élargissant son mandat du marché commun à de nouveaux domaines comme la propriété intellectuelle. La cour partagée harmonise le droit dans les trois juridictions et donne à l'union un ordre juridique commun."
 BNL_shared_foreign_policy: "Politique étrangère commune"
 BNL_shared_foreign_policy_desc: "Suivant une tradition aussi ancienne que l'union elle-même, les trois gouvernements concertent leurs positions avant chaque Conseil européen et sommet de l'OTAN. En parlant d'une seule voix, le Benelux pèse à Bruxelles bien au-delà de la taille de ses membres."
 BNL_political_union: "Union politique"
 BNL_political_union_desc: "Avec un parlement partagé, une cour commune et une politique étrangère unique désormais en place, les trois gouvernements dépassent la simple coopération, liant leurs institutions politiques en une union en tout sauf le nom."
 BNL_treaty_of_union: "Traité d'union"
 BNL_treaty_of_union_desc: "Des décennies d'institutions communes aboutissent ici. Les trois peuples étant profondément intégrés, le gouvernement dirigeant pose à ses partenaires la question d'un État beneluxien unique. Seul leur consentement peut faire céder les souverainetés séparées à une seule nation."
 BNL_treaty_of_union_tt: "Ouvre la voie à un État beneluxien unifié"
 BNL_integration_requirement_tt: "$BNL_integration$ est supérieur à §G100§!"
 BNL_integration: "§YIntégration du Benelux§!"
 BNL_integration_tt: "£GFX_benelux_icon $BNL_integration$ : $RIGHT|+=1$"
 BNL_integration_tooltip: "£GFX_benelux_icon $BNL_integration$: §G[?BNL_integration]§!"
 BNL_benelux_defence: "Déclaration de défense du Benelux"
 BNL_benelux_defence_desc: "La Déclaration Benelux de 2012 a engagé la Belgique, les Pays-Bas et le Luxembourg à mettre en commun leurs efforts de défense, à partager les coûts et à accroître la production militaire conjointe. C'est le cadre dans lequel les trois forces armées approfondissent leur coopération."
 BNL_mio_sharing_tt: "§Y[BEL.GetNameWithFlag]§!, §Y[HOL.GetNameWithFlag]§! et §Y[LUX.GetNameWithFlag]§! partagent toutes les §Yorganisations militaro-industrielles.§!"
 BNL_benelux_air_policing: "Police de l'air au Benelux"
 BNL_benelux_air_policing_desc: "Depuis 2017, la Belgique et les Pays-Bas se relaient pour garder l'espace aérien des trois pays sous une alerte de réaction rapide unique, avec le droit d'intercepter au-delà des frontières de chacun."
 BNL_air_defence_command: "Centre de commandement et de contrôle aérien"
 BNL_air_defence_command_desc: "Un centre de commandement et de contrôle aérien partagé intègre l'image radar et les défenses aériennes terrestres des trois nations en un système coordonné."
 BNL_binational_air_command: "Commandement aérien binational"
 BNL_binational_air_command_desc: "Fusionner les commandements aériens opérationnels permet aux forces aériennes du Benelux de planifier et d'exécuter leurs missions comme une organisation unique, en partageant bases, contrôleurs et procédures."
 BNL_mrtt_fleet: "Flotte multinationale MRTT"
 BNL_mrtt_fleet_desc: "La flotte mutualisée d'Airbus A330 Multi Role Tanker Transport, basée à Eindhoven et partagée entre les partenaires du Benelux et d'autres États européens, fournit le ravitaillement en vol et le transport aérien stratégique à chaque membre."
 BNL_eatc: "Commandement du transport aérien européen"
 BNL_eatc_desc: "Basé à Eindhoven, le Commandement européen du transport aérien met en commun les aéronefs de transport militaire, de ravitaillement et d'évacuation sanitaire de ses membres sous un seul commandement."
 BNL_belux_a400m: "Unité BELUX A400M"
 BNL_belux_a400m_desc: "La Belgique et le Luxembourg mettent en commun leurs A400M Atlas en une unité binational à Melsbroek, partageant équipages, maintenance et un centre de formation commun. L'unique appareil luxembourgeois vole aux couleurs belges, les deux nations se partageant le coût et les heures de vol d'une seule flotte."
 BNL_f35_cooperation: "Maintien en puissance interarmées des F-35"
 BNL_f35_cooperation_desc: "La Belgique et les Pays-Bas coordonnent la formation et la maintenance de leurs flottes de F-35, partageant installations et expertise entre les deux forces aériennes."
 BNL_benesam: "Accord naval BENESAM"
 BNL_benesam_desc: "La Belgique et les Pays-Bas font fonctionner leurs deux marines comme une seule, partageant formation, logistique et maintenance, chacun conservant le commandement de ses propres déploiements. Approfondir cet accord de longue date rend la flotte combinée bien plus grande que la somme de ses parties."
 BNL_admiral_benelux: "Amiral Benelux"
 BNL_admiral_benelux_desc: "Un état-major naval binational unique à Den Helder commande les opérations des flottes belge et néerlandaise, les deux commandants de marine partageant le quartier général conjoint."
 BNL_vlissingen_class: "Chasseurs de mines de classe Vlissingen"
 BNL_vlissingen_class_desc: "Le programme conjoint belgo-néerlandais de remplacement de la lutte contre les mines, un effort de douze navires pour retirer les chasseurs vieillissants de classe Tripartite Alkmaar. Construits par Naval Group, ces navires-mères opèrent à distance de sécurité avec des drones de surface et sous-marins autonomes. Les Pays-Bas alignent leurs six bâtiments comme classe Vlissingen, aux côtés des navires belges du même dessin."
 BNL_hollandklasse_frigate: "Développement de la frégate classe Holland"
 BNL_hollandklasse_frigate_desc: "Les Pays-Bas mettent sur cale de nouvelles frégates Hollandklasse pour renouveler leur flotte de patrouille maritime et de lutte anti-sous-marine. Équipées de capteurs modernes, de systèmes de missiles et d'une coque à faible signature, elles protègent les eaux néerlandaises et appuient les opérations outre-mer."
 BNL_aswf_frigate: "Frégate de guerre anti-sous-marine"
 BNL_aswf_frigate_desc: "La Belgique et les Pays-Bas remplacent conjointement leurs frégates de classe M par un nouveau dessin de lutte anti-sous-marine, partageant développement, radar et systèmes de combat."
 BNL_para_school: "Ecole Parachutiste Benelux"
 BNL_para_school_desc: "Les écoles de parachutistes du Benelux sont regroupées en un centre de formation unique à Schaffen, qualifiant les troupes aéroportées des trois nations selon un standard commun."
 BNL_csomtg: "Groupe de travail combiné sur les opérations spéciales"
 BNL_csomtg_desc: "La Belgique et les Pays-Bas constituent un groupement maritime d'opérations spéciales combiné, prêt à se déployer ensemble sur terre et en mer pour des missions OTAN rapides."
 benelux.1.t: "Un traité d'union du Benelux"
 benelux.1.d: "[FROM.GetName] propose que nous mettions de côté nos souverainetés séparées et rejoignions un État beneluxien unique. Des décennies d'institutions partagées ont préparé le terrain, mais renoncer à la nation n'est pas un petit pas."
 benelux.1.a: "Nous rejoindrons l'union"
 benelux.1.b: "Nous restons notre propre nation"
 benelux.2.t: "Notre partenaire accepte l'union"
 benelux.2.d: "[FROM.GetName] a accepté de rejoindre un Benelux unifié. Notre partenaire désormais lié à nous, nous pouvons achever la formation de l'union."
 benelux.2.a: "Une nouvelle nation est née"
 benelux.3.t: "Notre partenaire refuse l'union"
 benelux.3.d: "[FROM.GetName] n'est pas encore prêt à abandonner son indépendance. L'union devra attendre, ou être bâtie sur des bases plus solides."
 benelux.3.a: "Nous serons patients"
 benelux.4.t: "Un traité d'union du Benelux"
 benelux.4.d: "[FROM.GetName] propose que nous mettions de côté nos souverainetés séparées et rejoignions un État beneluxien unique. Nous ancrons déjà la coopération beneluxienne, notre économie et nos forces armées éclipsant celles de nos partenaires, et nous dirigeons de fait l'union en tout sauf le nom. Une fusion formelle échangerait cette primauté de facto, et notre emprise exclusive sur un État que nous dominons déjà, contre des institutions partagées que nous ne pourrions pas diriger unilatéralement."
 benelux.4.a: "Nous rejoindrons l'union"
 benelux.4.b: "Nous restons notre propre nation"
 benelux.5.t: "Un traité d'union du Benelux"
 benelux.5.d: "[FROM.GetName] propose que nous mettions de côté nos souverainetés séparées et rejoignions un État beneluxien unique. De loin le plus petit des trois, nous risquons d'être politiquement et culturellement absorbés par nos deux voisins bien plus grands, notre Grand-Duché réduit à une note de bas de page dans une union que nous ne pourrons pas espérer diriger."
 benelux.5.a: "Nous rejoindrons l'union"
 benelux.5.b: "Nous restons notre propre nation"
 BNL_retry_treaty_of_union_BEL: "Renouveler la proposition d'union à la Belgique"
 BNL_retry_treaty_of_union_BEL_desc: "La Belgique a refusé la dernière proposition d'un État beneluxien unifié. Une approche révisée, étayée par de nouveaux arguments et une pression diplomatique renouvelée, pourra peut-être encore convaincre Bruxelles."
 BNL_retry_treaty_of_union_HOL: "Renouveler la proposition d'union aux Pays-Bas"
 BNL_retry_treaty_of_union_HOL_desc: "Les Pays-Bas ont refusé la dernière proposition d'un État beneluxien unifié. Une approche révisée, étayée par de nouveaux arguments et une pression diplomatique renouvelée, pourra peut-être encore convaincre La Haye."
 BNL_retry_treaty_of_union_LUX: "Renouveler la proposition d'union au Luxembourg"
 BNL_retry_treaty_of_union_LUX_desc: "Le Luxembourg a refusé la dernière proposition d'un État beneluxien unifié. Une approche révisée, étayée par de nouveaux arguments et une pression diplomatique renouvelée, pourra peut-être encore convaincre le Grand-Duché."
 BNL_retry_shared_outlook_tt: "Ils sont plus susceptibles d'accepter si nous partageons la même forme de gouvernement."
 BNL_retry_influence_tt: "Ils sont plus susceptibles d'accepter si nous exerçons une influence significative sur eux."
 BNL_retry_opinion_tt: "Ils sont plus susceptibles d'accepter si leur opinion à notre égard est supérieure à §G200§!."