 mercosur.28.t: "가입 완료"
 mercosur.28.d: "[FROM.GetName]의 긴 가입 절차가 마무리되었습니다. 협상과 제도 조정, 그리고 꾸준한 의지의 표명을 거쳐 이제 더 이상 모호함은 없습니다. 이들은 이제 메르코수르의 정회원으로서 서 있습니다."
 mercosur.28.a: "새 회원국이 가입한다."
 mercosur.29.t: "회원 자격 공식화"
 mercosur.29.d: "[FROM.GetName]과(와) 함께 닦아 온 길이 마침내 결말에 이르렀습니다. 조심스러운 구애로 시작된 것이 정회원 가입으로 끝을 맺었고, 메르코수르 내 우리의 자리는 이제 임시가 아니라 공식적인 것이 되었습니다."
 mercosur.29.a: "우리는 블록에 합류한다."
 mercosur.30.t: "남아메리카 정상회담 발표"
 mercosur.30.d: "지역 협력 재개를 위한 첫걸음으로 새로운 남아메리카 정상회담이 발표되었습니다. 주최 측은 메르코수르를 되살리고, 경제 조율을 강화하며, 대륙이 세계 정세에서 더 강한 집단적 목소리를 갖도록 해야 한다고 선언했습니다. 지지자들은 이 구상을 오랫동안 미뤄졌던 지역적 야망으로의 복귀라고 환영하는 반면, 비판자들은 남아메리카가 상징을 넘어 지속적인 통합으로 나아갈 수 있을지 의문을 제기합니다."
 mercosur.30.a: "새로운 지역 시대가 열린다."
 mercosur.31.t: "[FROM.GetName], 메르코수르 준회원국으로 가입"
 mercosur.31.d: "[FROM.GetName]이(가) 메르코수르 준회원국으로 가입하기로 합의했으며, 이는 남아메리카 지역 협력 부활의 새로운 단계를 알립니다. 준회원 지위는 정회원 가입에는 미치지 못하지만 더 긴밀한 무역 관계, 정치적 조율, 향후 가입 협상의 문을 엽니다. 지지자들은 이 조치를 메르코수르가 다시금 진지한 지역 세력이 되어 가고 있다는 신호로 봅니다."
 mercosur.31.a: "블록이 성장하고 있다."
 mercosur.32.t: "메르코수르 정회원국이 된 [FROM.GetName]"
 mercosur.32.d: "[FROM.GetName]이(가) 메르코수르에 정회원으로 가입했습니다. 지역 외교로 시작된 일이 이제 블록 자체의 실질적 확대가 되어, 라틴 아메리카 전역에서 그 경제적 비중과 정치적 의의를 키우고 있습니다. 통합을 지지하는 이들에게 이것은 외교적 성공 이상입니다. 메르코수르가 여전히 대륙의 미래를 빚을 수 있다는 증거입니다."
 mercosur.32.a: "새 회원국, 더 강한 블록."
 BRA_unasul: "우나수르 설립"
 BRA_unasul_desc: "남아메리카의 협력은 더 이상 임시 체제로 남아서는 안 됩니다. 이를 상설 지역 기구로 제도화할 때가 되었습니다. 정치 대화, 인프라 개발, 사회 협력을 아우르는 구조를 만들면 남아메리카의 단결을 새로운 단계로 끌어올릴 수 있습니다."
 MER_expansion_unasul: "우나수르 확대"
 MER_expansion_unasul_desc: "우나수르가 진정한 대륙 단위 체제가 되려면 정치적 추진력을 유지하면서 참여를 넓혀야 합니다. 더 많은 국가를 사업에 끌어들이면 남아메리카의 공동 기구로서의 정당성을 강화할 수 있습니다."
 MER_sa_corridor_development: "남아메리카 회랑 개발"
 MER_sa_corridor_development_desc: "대륙 통합은 선언만으로 유지될 수 없습니다. 도로, 항만, 철도, 통신, 내륙 회랑을 연결해야 국경을 넘는 이동과 무역이 수사가 아닌 현실이 됩니다."
 MER_counter_cartel: "반카르텔 협력"
 MER_counter_cartel_desc: "마약 밀매, 무기 밀수, 초국적 범죄 조직은 남아메리카의 안정과 지역 통합 모두를 위협합니다. 국경을 가리지 않는 위협에 맞서려면 정보 공유와 공동 행동을 강화해야 합니다."
 MER_sa_energy_council: "남아메리카 에너지 평의회"
 MER_sa_energy_council_desc: "석유, 가스, 수력, 대규모 송전망을 갖춘 남아메리카에는 에너지 협력의 큰 잠재력이 있습니다. 이러한 자원이 경쟁의 불씨가 되도록 놔두기보다 지역 안정과 상호 보완을 추구해야 합니다."
 MER_sa_health_council: "남아메리카 보건 평의회"
 MER_sa_health_council_desc: "보건 협력은 지정학보다 덜 극적이지만 남아메리카 통합에서 가장 실용적이고 효과적인 분야 중 하나입니다. 감시 체계, 의약품, 보건 인력을 조율하면 일상생활을 통해 통합을 보여 줄 수 있습니다."
 MER_productive_integration_and_sme_networks: "생산 통합과 중소기업 네트워크"
 MER_productive_integration_and_sme_networks_desc: "지역 통합이 대기업과 원자재 수출에만 머물러서는 안 됩니다. 중소기업, 지역 공급망, 생산적 상호 보완을 장려하면 이 사업에 더 구체적인 경제적 기반을 줄 수 있습니다."
 MER_sa_defense_council: "남아메리카 국방 평의회"
 MER_sa_defense_council_desc: "남아메리카의 안보가 외부 체제에만 의존해서는 안 됩니다. 거창한 군사적 야망에 앞서, 지역은 국방 문제에서 대화, 투명성, 조율된 위기 관리의 습관부터 쌓아야 합니다."
 MER_sa_network_for_science_and_innovation: "남아메리카 혁신 네트워크"
 MER_sa_network_for_science_and_innovation_desc: "통합이 미래에 기여하려면 남아메리카는 시장과 자원뿐 아니라 지식과 혁신도 연결해야 합니다. 과학 협력은 대륙의 자율적 발전을 강화할 수 있습니다."
 MER_unasul_factions: "우나수르 공동 방위 기구"
 MER_unasul_factions_desc: "남아메리카의 단결을 정치 협력 너머로 나아가게 할 때가 되었습니다. 지역 안보를 지키고 외부의 압력과 불안정화 시도에 집단적으로 대응하기 위해, 우리는 우나수르 아래 방위 협력을 제도화하고 남아메리카 국가들을 잇는 새로운 공동 방위 기구를 세울 것입니다."
 unasul_member_state_modifier: "우나수르 회원국"
 unasul_member_state_modifier_desc: "우나수르는 남아메리카의 정치 조율, 발전, 공동 행동을 위한 대륙 단위 체제로 재건되고 있습니다. 회원국이 늘어나고 새로운 평의회와 사업이 기구의 영향력을 심화할수록 그 혜택도 커집니다.\n\n§Y이 국가 정신은 우나수르 회원국 수가 늘어날수록 더 강해집니다.§!"
 MER_unasul_integrated_corridor_plan_modifier: "우나수르 통합 회랑 계획"
 MER_unasul_integrated_corridor_plan_modifier_desc: "우나수르는 남아메리카 전역의 도로, 물류, 디지털 연결에 대한 조율된 투자 회차를 개시했습니다. 당분간 회원국들은 평소보다 빠르게 수송 및 네트워크 인프라를 건설하고 있습니다."
 MER_unasul_energy_security_modifier: "우나수르 에너지 안보 구상"
 MER_unasul_energy_security_modifier_desc: "우나수르는 에너지 회복력을 위해 블록 전체의 자원을 투입하기로 했습니다. 회원국들은 현재 공동 지역 계획에 따라 화력, 원자력, 재생 에너지 발전소 건설을 가속하고 있습니다."
 MER_unasul_joint_exercises_modifier: "우나수르 합동 훈련"
 MER_unasul_joint_exercises_modifier_desc: "우나수르의 군대는 현재 조율된 합동 훈련, 참모 교류, 상호 운용성 계획 회차에 참여하고 있습니다."
 MER_invite_to_unasul: "[FROM.GetName]을(를) 우나수르에 초청"
 MER_invite_to_unasul_desc: "[FROM.GetName]과(와) 우나수르 가입에 관한 공식 회담을 시작합니다. 수락 확률은 해당 국가의 우리에 대한 관계, 우리의 영향력, 그리고 우나수르 트리의 진행도에 따라 결정됩니다."
 MER_unasul_integrated_corridor_plan: "통합 회랑 계획 개시"
 MER_unasul_integrated_corridor_plan_desc: "국고 자원을 투입하여 180일 동안 현 우나수르 모든 회원국의 수송 및 네트워크 건설을 가속합니다."
 MER_unasul_counter_cartel_operation: "반카르텔 동맹 작전 개시"
 MER_unasul_counter_cartel_operation_desc: "카르텔의 영향을 받는 모든 우나수르 회원국에 조율된 반카르텔 작전에 정치적 자산을 투입하도록 요청합니다. 최종 효과는 얼마나 많은 국가가 전폭적으로 참여하느냐에 달려 있습니다."
 MER_unasul_counter_cartel_operation_tt: "카르텔의 영향을 받는 모든 우나수르 회원국에 작전에 정치적 자산을 투입하도록 요청합니다. 최종 결과는 참여 정부들이 단속을 얼마나 강력히 뒷받침하느냐에 달려 있습니다."
 MER_unasul_energy_security_reinforcement: "남아메리카 에너지 안보 강화"
 MER_unasul_energy_security_reinforcement_desc: "국고 자원을 투입하여 180일 동안 현 우나수르 모든 회원국의 화력, 원자력, 재생 에너지 발전소 건설을 가속합니다."
 MER_unasul_joint_health_improvement_project: "우나수르 공동 보건 개선 사업 개시"
 MER_unasul_joint_health_improvement_project_desc: "180일간의 보건 조율 사업을 시작합니다. 사업이 끝나면 우나수르의 월간 인구 성장률이 영구적으로 증가합니다. 최대 4회까지 완료할 수 있습니다.\n\n§Y이 사업 계통을 통해 우나수르의 월간 인구 성장률은 총 최대 +10%까지 도달할 수 있습니다.§!"
 MER_unasul_supply_chain_strengthening: "남아메리카 공급망 강화"
 MER_unasul_supply_chain_strengthening_desc: "180일간의 공급망 조율 사업을 개시합니다. 사업이 끝나면 우나수르의 민간 산업 생산성이 영구적으로 증가합니다. 최대 4회까지 완료할 수 있습니다.\n\n§Y이 사업 계통을 통해 우나수르의 민간 산업 생산성은 총 최대 +15%까지 도달할 수 있습니다.§!"
 MER_unasul_joint_exercises: "우나수르 합동 훈련 개시"
 MER_unasul_joint_exercises_desc: "우나수르 합동 훈련 180일 회차에 자금을 지원하여 블록 전역의 일일 육군, 해군, 공군 경험치 획득량을 향상합니다."
 MER_unasul_joint_research_exchange_project: "우나수르 공동 연구 및 기술 교류 사업 개시"
 MER_unasul_joint_research_exchange_project_desc: "180일간의 연구 조율 계획을 시작합니다. 계획이 끝나면 우나수르의 연구 속도가 영구적으로 증가합니다. 최대 4회까지 완료할 수 있습니다.\n\n§Y이 사업 계통을 통해 우나수르의 연구 속도는 총 최대 +10%까지 도달할 수 있습니다.§!"
 mercosur.35.t: "우나수르 가입 초청"
 mercosur.35.d: "[FROM.GetName]이(가) 우리를 우나수르에 초청했습니다. 이는 남아메리카가 다시 함께 행동하는 법을 배울 수 있는 정치적 지붕으로 제시되었습니다. 수락하면 대화, 조율, 대륙적 야망을 약속하는 사업에 들어가게 되지만, 더 폭넓은 지역 구상에 우리를 묶을 준비가 되었는지도 묻게 됩니다."
 mercosur.35.a: "우나수르에 가입한다."
 mercosur.35.b: "당분간은 거절한다."
 mercosur.36.t: "우나수르 초청 발송"
 mercosur.36.d: "[FROM.GetName]과(와) 우나수르 가입에 관한 외교 회담이 시작되었습니다. 초청장은 발송되었고 설득도 이루어졌으니, 이제 또 하나의 수도가 남아메리카 협조 체제의 부활에 걸 의향이 있는지 지켜볼 차례입니다."
 mercosur.36.a: "진행한다."
 mercosur.37.t: "우나수르 초청 수락"
 mercosur.37.d: "[FROM.GetName]이(가) 우리의 초청을 수락하고 우나수르에 가입했습니다. 얼마 전까지 연설과 공동 성명에서 논의되던 구상이 실제 대륙 기구의 모습을 갖추기 시작하고 있습니다."
 mercosur.37.a: "훌륭하다."
 mercosur.38.t: "우나수르 초청 거절"
 mercosur.38.d: "[FROM.GetName]이(가) 당분간 우리의 우나수르 가입 초청을 거절했습니다. 더 넓은 남아메리카 체제라는 꿈이 완전히 배척된 것은 아니지만, 아직 그들의 신뢰를 얻지도 못했습니다."
 mercosur.38.a: "나중에 다시 시도하겠다."
 mercosur.39.t: "우나수르 가입 수락"
 mercosur.39.d: "우리는 [FROM.GetName]의 초청을 수락하고 우나수르에 가입했습니다. 남아메리카 통합의 미래가 아무리 불확실하더라도, 우리는 이를 방관하지 않기로 했습니다."
 mercosur.39.a: "더 넓은 남아메리카."
 mercosur.40.t: "[FROM.GetName], 우나수르 가입"
 mercosur.40.d: "[FROM.GetName]이(가) 우나수르에 가입하여 떠오르는 남아메리카 체제에 또 하나의 목소리와 관료 조직, 국가적 야망을 더했습니다. 가입이 이어질수록 이 사업을 향수로 치부하기는 어려워지고 지속적인 정치적 사실로 상상하기는 쉬워집니다."
 mercosur.40.a: "대륙이 계속 정렬하고 있다."
 mercosur.50.t: "통합 회랑 계획 발동"
 mercosur.50.d: "우나수르의 통합 회랑 계획이 회의 탁자에서 측량 지도와 현장 계획으로 옮겨 갔습니다. 대륙 전역에서 부처, 기술자, 계획가들이 통합이라는 말을 각국이 실제로 체감할 수 있는 도로, 연결망, 회랑으로 바꾸려 애쓰고 있습니다."
 mercosur.50.a: "계속 건설한다."
 mercosur.51.t: "공동 보건 사업 개시"
 mercosur.51.d: "우나수르 체제 아래 새로운 공동 보건 구상이 시작되었습니다. 관계자들은 공동 조달, 공동 대응, 더 나은 조율을 이야기하지만, 행정적 언어 뒤에는 지역 통합을 진료소와 약국, 일상생활에서 체감하게 하겠다는 더 큰 야망이 있습니다."
 mercosur.51.a: "더 건강한 대륙을 위하여."
 mercosur.52.t: "공동 보건 사업 완료"
 mercosur.52.d: "최근 공동 보건 구상이 마무리되었고, 가장 성공적인 방식들이 우나수르의 상설 기구에 통합되고 있습니다. 임시 노력으로 시작된 것이 관행으로 자리 잡으며 기구에 더 인간적이고 구체적인 얼굴을 부여하고 있습니다."
 mercosur.52.a: "지속적인 성과."
 mercosur.53.t: "에너지 안보 구상 발동"
 mercosur.53.d: "우나수르가 대륙 전체의 에너지 안보 추진을 개시했습니다. 전력 계획가, 공익 사업 관료, 장관들이 갑자기 같은 지역 지도를 놓고 일하며, 남아메리카의 풍부한 자원이 경쟁이 아닌 안정의 원천이 되도록 힘쓰고 있습니다."
 mercosur.53.a: "대륙에 전력을 공급하라."
 mercosur.54.t: "공급망 구상 개시"
 mercosur.54.d: "우나수르의 새로운 공급망 구상이 시작되었습니다. 정부, 상공회의소, 기술 기관들이 남아메리카의 생산을 단지 나란히 존재하게 하는 데 그치지 않고 서로 맞물리게 하는 어려운 작업에 나서고 있습니다."
 mercosur.54.a: "시장을 통합한다."
 mercosur.55.t: "공급망 구상 완료"
 mercosur.55.d: "우나수르의 최근 공급망 구상이 완료되었습니다. 그 실무적 교훈과 상업적 관계, 행정 관행은 더 이상 임시 실험이 아니며, 지역의 상설 경제 구조의 일부가 되어 가고 있습니다."
 mercosur.55.a: "더 강한 생산 기반."
 mercosur.56.t: "합동 훈련 진행 중"
 mercosur.56.d: "우나수르의 합동 훈련이 시작되었습니다. 예전에는 공식 의례로만 서로를 알던 장교들이 현장에서 만나 방식을 교환하고 가정을 시험하며, 지역 조율이 실제로 작동해야 할 때 어떤 모습인지 배우고 있습니다."
 mercosur.56.a: "대비 태세를 높인다."
 mercosur.57.t: "연구 교류 사업 개시"
 mercosur.57.d: "우나수르의 새로운 연구 및 기술 교류 노력이 시작되었습니다. 남아메리카 전역의 대학, 연구소, 기술 기관들이 같은 대화에 참여하며, 지역이 재화를 거래하는 만큼 진지하게 아이디어를 거래할 수 있기를 바랍니다."
 mercosur.57.a: "지식을 공유한다."
 mercosur.58.t: "연구 교류 사업 완료"
 mercosur.58.d: "최근 연구 및 기술 교류 노력이 마무리되었습니다. 이를 통해 맺어진 협력 관계는 사업 자체가 끝난 뒤에도 이어져, 더 촘촘한 인맥망과 남아메리카의 지식이 흩어지기만 하는 것이 아니라 조직될 수 있다는 더 강한 확신을 남겼습니다."
 mercosur.58.a: "지식은 지속된다."
 mercosur.60.t: "반카르텔 작전 자금 지원"
 mercosur.60.d: "우나수르가 카르텔의 영향력에 맞선 조율된 작전을 개시했습니다. 우리 앞에 놓인 질문은 위협이 실재하는지가 아니라, 지역 차원의 대응에 우리 자신의 정치적 무게를 얼마나 실을 의향이 있는지입니다."
 mercosur.60.a: "제한적인 부처 간 기여를 승인한다."
 mercosur.60.b: "국가의 모든 역량을 작전에 투입한다."
 mercosur.61.t: "반카르텔 작전 강화"
 mercosur.61.d: "참여한 우나수르 정부 대다수가 작전에 전폭적으로 임하기로 했습니다. 그 결과는 단순한 몸짓이 아니라 카르텔 조직망과 그 후원자, 그리고 그들이 버티게 하는 공포의 분위기에 대한 날카로운 지역적 타격이었습니다."
 mercosur.61.a: "우위를 몰아붙인다."
 mercosur.62.t: "반카르텔 작전 완료"
 mercosur.62.d: "작전은 보다 절제된 지원 속에 진행되었습니다. 그럼에도 조율된 압박은 카르텔 조직망을 동요시키고 활동 여지를 약화시켰으나, 더 단합된 대응이 가져왔을 만한 힘에는 미치지 못했습니다."
 mercosur.62.a: "유용한 한 걸음."
 mercosur.75.t: "우나수르 방위 조약 가입 초청"
 mercosur.75.d: "[FROM.GetName]이(가) 우리를 우나수르 방위 체제에 초청했습니다. 수락하는 것은 또 하나의 문서에 서명하는 것 이상입니다. 압력이 높아질 때 남아메리카가 함께 서겠다는 뜻을 이웃과 외부에 알리려는 군사적 양해 안에 우리를 놓는 일입니다."
 mercosur.75.a: "방위 조약에 가입한다."
 mercosur.75.b: "거절한다."
 mercosur.76.t: "방위 조약 초청 수락"
 mercosur.76.d: "[FROM.GetName]이(가) 우리의 초청을 수락하고 우나수르 방위 조약에 가입했습니다. 동맹은 아직 젊지만 서명이 늘어날 때마다 신뢰성과 무게, 그리고 수사 이상의 의미를 얻습니다."
 mercosur.76.a: "동맹이 성장한다."
 mercosur.77.t: "방위 조약 초청 거절"
 mercosur.77.d: "[FROM.GetName]이(가) 당분간 우나수르 방위 조약 가입을 거절했습니다. 지역 연대라는 말이 무성하지만, 모든 정부가 방위 정책을 공동의 남아메리카 서사의 일부로 만들 준비가 되어 있는 것은 아닙니다."
 mercosur.77.a: "유감이다."
 mercosur.78.t: "우나수르 방위 조약 가입"
 mercosur.78.d: "우리는 [FROM.GetName]의 초청을 수락하고 우나수르 방위 조약에 가입했습니다. 이로써 우리는 정치적 친화성을 전략적 책무로 바꾸려는 대륙 체제에 우리의 안보를 더 긴밀히 묶었습니다."
 mercosur.78.a: "남아메리카는 함께 선다."
 mercosur.79.t: "관세 조정 완료"
 mercosur.79.d: "신규 가입 예정국과의 수주에 걸친 협상, 법률 검토, 관세 작업이 마무리되었습니다. 이 과정은 겉으로는 기술적이었지만 정치적으로는 단순한 이유로 중요했습니다. 그들의 시장과 우리 시장 사이의 장벽 하나가 일시적인 것으로 상상하기 쉬워졌기 때문입니다."
 mercosur.80.t: "관세 현대화 완료"
 mercosur.80.d: "신규 가입 예정국의 관세 개혁 노력이 완료되었습니다. 절차가 명확해지고 국경 업무가 강화되었으며, 해당 국가의 행정 태세가 메르코수르 정회원 가입이 요구하는 수준에 가까워졌습니다."
 mercosur.81.t: "공통 표준 도입"
 mercosur.81.d: "신규 가입 예정국의 공통 표준 패키지가 완료되었습니다. 한때 거리를 반영하던 규칙이 이제 호환성의 언어로 다시 쓰이고 있으며, 블록으로 향하는 길이 점점 현실처럼 보입니다."
 mercosur.82.t: "물류 회랑 사업 완료"
 mercosur.82.d: "신규 가입 예정국의 물류 회랑 사업이 완료되었습니다. 한때 추상적으로 논의되던 것이 노선, 창고, 실용적인 연결의 형태를 갖추기 시작하여 가입이 의례적인 것이 아니라 현실에 뿌리내린 것처럼 느껴지게 합니다."
 mercosur.83.t: "수송 개선 완료"
 mercosur.83.d: "신규 가입 예정국의 가입 패키지와 연계된 최근 수송 공사가 완료되었습니다. 거리가 사라진 것은 아니지만 지도는 조금 작아 보이고 통합의 전망은 조금 덜 이론적으로 느껴집니다."
 mercosur.84.t: "연결성 사업 완료"
 mercosur.84.d: "신규 가입 예정국의 최신 연결성 사업이 완료되었습니다. 상업 교통, 행정 접촉, 국경 간 조율이 이제 더 견고한 경로로 오갈 수 있습니다."
 mercosur.85.t: "개발 기금 집행"
 mercosur.85.d: "신규 가입 예정국을 위한 개발 패키지가 모두 전달되었습니다. 어떤 공동 성명보다도 이 정도 규모의 눈에 보이는 약속은 메르코수르가 신뢰를 요구하는 데 그치지 않고 회원 자격에 투자할 준비가 되어 있음을 그들 정부에 알려 줍니다."
 mercosur.86.t: "민간 투자 완료"
 mercosur.86.d: "신규 가입 예정국의 가입 패키지 중 민간 투자 단계가 완료되었습니다. 작업장과 기업, 상업 지구는 이제 지역 통합을 단지 외교적인 것이 아니라 구체적인 것으로 볼 더 분명한 이유를 갖게 되었습니다."
 mercosur.87.t: "인프라 개선 완료"
 mercosur.87.d: "신규 가입 예정국의 인프라 개선 사업이 마무리되었습니다. 완료된 사업마다 같은 정치적 메시지를 남깁니다. 가입은 서명 하나가 아니라 그 나라가 더 넓은 지역과 연결되는 방식의 재편이라는 것입니다."
 mercosur.88.t: "상업 인프라 확충"
 mercosur.88.d: "신규 가입 예정국의 상업 인프라 사업이 완료되었습니다. 메르코수르의 약속은 이제 연설뿐 아니라 더 붐비는 회랑, 더 나은 시설, 그리고 더 뚜렷해진 상호 의존의 감각 속에서도 나타납니다."
 mercosur.89.t: "산업 투자 협정 발효"
 mercosur.89.d: "신규 가입 예정국과의 산업 투자 협정이 발효되었습니다. 외교적 양해였던 것이 의례보다 오래갈 만한 깊이와 기대, 이해관계를 지닌 경제 관계로 자리 잡고 있습니다."
 mercosur.90.t: "상업 투자 체제 수립"
 mercosur.90.d: "신규 가입 예정국과의 상업 투자 체제가 수립되었습니다. 은행, 기업, 부처들 사이에 더 튼튼한 다리가 놓였으며, 가입을 상징적 몸짓이 아닌 공동의 도박으로 여길 더 강한 유인이 생겼습니다."
 mercosur.91.t: "금융 협력 패키지 전달"
 mercosur.91.d: "신규 가입 예정국을 위한 금융 협력 패키지가 전달되었습니다. 이 마지막 조각이 갖춰지면서 가입 노력은 더 이상 임시로 보이지 않으며, 한 국가가 꾸준히 블록의 핵심부로 이끌려 들어오는 느낌을 줍니다."
 mercosur.108.t: "메르코수르 개발 기금 회차 개시"
 mercosur.108.d: "메르코수르 개발 기금의 새 회차가 가동되었습니다. 블록 전역의 부처, 기업, 지방 당국은 이를 단순한 장부상 항목이 아니라, 통합 뒤에 여전히 자금과 계획, 제도적 의지가 있다는 증거로 읽을 것입니다. 발전의 약속이 다시금 서류에서 현장으로 옮겨 가고 있습니다."
 mercosur.108.a: "자금이 움직이기 시작하게 하라."
 mercosur.accession_project_complete.a: "진행한다."
 mercosur.93.t: "정회원 가입 수락"
 mercosur.93.d: "[FROM.GetName]이(가) 우리의 제안을 수락하고 즉시 메르코수르에 정회원으로 가입했습니다. 긴 과도기도, 조심스럽게 짜인 구애도 없이, 오늘 블록이 더 커졌다는 갑작스러운 정치적 사실만이 있을 뿐입니다."
 mercosur.93.a: "훌륭하다."
 mercosur.94.t: "메르코수르 가입"
 mercosur.94.d: "우리의 진로는 정해졌으며, 메르코수르는 더 이상 손이 닿지 않는 회의체가 아니라 우리가 이제 내부에서 살아가는 구조입니다. 지역 질서에서 우리의 위치에 대한 오랜 모호함은 더 단단한 사실에 자리를 내주고 있습니다. 우리는 블록 안에 있으며, 대륙은 이 현실에 적응해야 할 것입니다."
 mercosur.94.a: "우리는 블록에 합류한다."
 mercosur.105.t: "준회원 지위 부여"
 mercosur.105.d: "우리의 청원으로 우리는 메르코수르 준회원국이 되었습니다. 아직 블록의 가장 안쪽 방은 아니지만, 우리의 정치적, 경제적 지평이 이제 남아메리카 통합에서 멀어지기보다 그쪽으로 기울고 있음을 보여 주기에 충분합니다."
 mercosur.105.a: "한 걸음 더 다가간다."
 mercosur.107.t: "우나수르 청원 승인"
 mercosur.107.d: "우리의 청원으로 우리는 우나수르에 가입했습니다. 남아메리카 통합의 미래가 얼마나 불확실하든, 우리는 이 실험을 멀리서 지켜보지 않고 들어가서 지금 구축되고 있는 체제 안에 우리의 자리를 잡기로 했습니다."
 mercosur.107.a: "우리는 사업에 참여한다."
 mercosur_news.1.t: "우나수르 설립"
 mercosur_news.1.d: "남아메리카 국가들은 정치 대화, 인프라 개발, 사회 협력을 하나의 체제 아래 묶는 상설 지역 기구로서 우나수르의 설립을 발표했습니다. 이 걸음으로 남아메리카의 단결은 새로운 단계에 들어서며, 지역 조율은 더욱 제도적이고 지속적인 것이 될 수 있습니다. 그러나 이 사업이 정말로 성공할지는 회원국들이 서로 다른 국익을 극복할 수 있느냐에 달려 있습니다."
 mercosur_news.1.a: "남아메리카의 새로운 단계"
 mercosur_news.2.t: "우나수르, 공동 방위 조약 결성"
 mercosur_news.2.d: "우나수르는 경제 및 정치 조율을 넘어 새로운 남아메리카 방위 조약의 결성을 발표했습니다. 지지자들은 이를 지역 단결의 자연스러운 연장이라고 묘사하는 반면, 회의론자들은 대륙이 블록 정치의 더 공세적이고 잠재적으로 분열적인 국면에 들어서고 있다고 경고합니다."
 mercosur_news.2.a: "남아메리카가 대오를 좁힌다."
 mercosur_news.3.t: "회원국, 우나수르에서 이탈"
 mercosur_news.3.d: "[ROOT.GetNameWithFlag]이(가) 우나수르 공동 방위 체제에서의 탈퇴를 발표하여, 남아메리카가 처음 방어선을 함께 그었을 때 봉합되었다고 많은 이들이 믿었던 의구심을 다시 불러일으켰습니다. 탈퇴 지지자들은 이를 주권적 행동의 자유로의 복귀라고 묘사하며, 비판자들은 형식적 서명만큼이나 정치적 신뢰에 의존하던 조약에 처음으로 나타난 눈에 띄는 균열이라고 봅니다. 이것이 고립된 번복에 그칠지 더 광범위한 와해의 시작일지를 이제 대륙 전체가 지켜볼 것입니다."
 mercosur_news.3.a: "조약은 더 이상 깨지지 않을 것처럼 보이지 않는다."
 UNASUL_faction: "우나수르 방위 조약"
 UNASUL_faction_DEF: "우나수르 방위 조약"
 MER_invite_to_unasul_TT: "§Y수락 확률은 해당 국가의 우리에 대한 관계, 우리의 영향력, 그리고 우나수르 트리의 진행도에 따라 결정됩니다!§!"
 MER_request_mercosur_associate_membership_tt: "§Y공식 청원서를 제출합니다. 심사 기간이 끝나면 우리는 메르코수르 준회원국으로 가입합니다.§!"
 MER_request_mercosur_full_membership_tt: "§Y공식 청원서를 제출합니다. 심사 기간이 끝나면 우리는 메르코수르에 정회원으로 가입합니다.§!"
 MER_request_unasul_membership_tt: "§Y공식 청원서를 제출합니다. 심사 기간이 끝나면 우리는 우나수르에 가입합니다.§!"
 MER_unasul_member_tt: "모든 회원국의 §Y우나수르 회원국§!에 다음 변동치를 적용합니다."
 BRA_unasul_events_TT: "§Y모든 메르코수르 회원국에 우나수르 가입 초청을 보냅니다!§!"
 MER_expansion_unasul_TT: "남아메리카 국가를 §Y우나수르§!에 초청하는 결정을 §G잠금 해제§!합니다!"
 mercosur.110.t: "메르코수르 민주주의 조항 심사"
 mercosur.110.d: "[FROM.GetName]에서 벌어진 일은 더 이상 국내적 의미만 가진 국내 문제로 치부할 수 없습니다. 그곳의 심각한 정치적 전환으로 인해 개방적 경쟁과 헌법적 절제가 그 나라에서 아직 의미가 있는지 의문이 제기되었습니다. 블록 곳곳에서 장관과 외교관들이 메르코수르의 민주주의 조항이 진지한 약속인지 단지 의례적 문구인지 공개적으로 묻고 있습니다. 우리는 [FROM.GetName]의 자격을 정지할지, 아니면 남아메리카 시장을 온전히 지키기 위해 이 전환을 용인할지 결정해야 합니다."
 mercosur.110.a: "조항을 집행해야 한다."
 mercosur.110.b: "마지막으로 한 번 유예한다."
 mercosur.112.t: "메르코수르의 우리 자격 정지"
 mercosur.112.d: "블록의 판결이 도착했으며, 이는 명백합니다. 메르코수르는 우리의 최근 행보가 민주주의 조항이 정한 선을 넘었다고 판단했고, 그 대가가 이제 기구 내 우리의 자리에서 치러지고 있습니다. 남아메리카가 우리에게 영원히 등을 돌린 것은 아니지만, 이 순간을 응답 없이 지나칠 수 없는 때로 규정하기로 했습니다."
 mercosur.112.a: "그 결과는 현실이다."
 mercosur.113.t: "메르코수르의 조건부 유예 부여"
 mercosur.113.d: "메르코수르는 우리의 자격을 즉각 정지하지 않기로 했지만, 사면을 내리지도 않았습니다. 우리는 눈에 띄는 불신의 그늘 아래 블록 안에 남아 있으며, 지역의 모든 수도는 남아메리카 시장에서 우리의 지속적인 자리가 이제 신뢰가 아닌 보호관찰에 달려 있음을 이해할 것입니다."
 mercosur.113.a: "우리는 감시 아래 남는다."
 mercosur.114.t: "메르코수르, 회원국 자격 정지"
 mercosur.114.d: "[FROM.GetName]의 심각한 정치적 전환 이후 메르코수르 내부의 논쟁은 어려운 결정으로 끝났습니다. 블록은 민주주의 조항을 발동하여 [FROM.GetName]의 지위를 정지시켰으며, 이는 남아메리카 시장이 자신이 토대로 삼는다고 주장하는 정치적 조건을 여전히 수호할 의사가 있음을 알립니다."
 mercosur.114.a: "블록이 선을 긋는다."
 mercosur.115.t: "문을 조금 열어 둔 메르코수르"
 mercosur.115.d: "[FROM.GetName]의 심각한 정치적 변화에 이어 메르코수르는 자격 정지까지는 가지 않았지만, 그 결정은 지지가 아니었습니다. 블록은 당분간 단결을 지키기로 하면서 [FROM.GetName]에 눈에 띄는 경고를 부과했고, 민주적 정당성의 문제가 기구 내 그 나라의 자리에 계속 그림자를 드리울 것입니다."
 mercosur.115.a: "아슬아슬한 유예."
 mercosur.117.t: "우나수르 민주주의 조항 심사"
 mercosur.117.d: "[FROM.GetName]의 최근 사태는 한 수도의 내부 논쟁을 훨씬 넘어 퍼져 나갔습니다. 그곳의 심각한 정치적 전환은 그 나라의 민주적 삶이 힘이나 의도에 의해 위축되고 있는지에 대해 대륙 전역에 의혹을 불러일으켰습니다. 우나수르 전반에서 이제 문제는 이 기구가 민주적 약속을 수호하기 위해 세워진 것인지, 아니면 편할 때만 그것을 말하기 위한 것인지입니다. 우리는 [FROM.GetName]을(를) 남아메리카 체제에서 정지시킬지, 아니면 경고 아래 체제 안에 두는 편이 사업에 더 이로운지 선택해야 합니다."
 mercosur.117.a: "체제에서 정지시킨다."
 mercosur.117.b: "체제 안에 두되 견책한다."
 mercosur.119.t: "우나수르의 우리 자격 정지"
 mercosur.119.d: "우나수르가 판결을 내렸으며, 그 메시지는 연대가 아닌 거리 두기입니다. 기구는 우리의 최근 행보가 민주주의 조항과 양립할 수 없다고 결론지었고, 이에 따라 남아메리카 체제 내 우리의 자리가 정지되었습니다. 대륙적 수렴의 상징이 되어야 했던 것이 오히려 지역적 정당성에도 한계가 있음을 일깨우는 것이 되었습니다."
 mercosur.119.a: "타격이 가해졌다."
 mercosur.120.t: "우나수르의 우리 보호관찰 조치"
 mercosur.120.d: "우나수르는 우리의 자격을 즉각 정지하지 않기로 했지만, 그 결정은 위안이 되지 못합니다. 우리는 눈에 띄는 견책 아래에서만 체제 안에 남아 있으며, 남아메리카의 수도들은 그 선택을 사업 내 우리의 자리가 이제 신뢰가 아닌 조건부라는 경고로 읽을 것입니다."
 mercosur.120.a: "유예일 뿐 무죄 방면이 아니다."
 mercosur.121.t: "우나수르, 회원국 자격 정지"
 mercosur.121.d: "[FROM.GetName]의 심각한 정치적 전환을 검토한 끝에 우나수르는 민주주의 조항을 발동하여 그 나라의 기구 내 지위를 정지시키기로 했습니다. 이 결정은 남아메리카의 단결이 여전히 정치적 토대를 내세운다는 점, 그리고 일부 위반은 문제를 공개적으로 거론하게 할 만큼 심각하다는 점을 강조합니다."
 mercosur.121.a: "체제가 단단해진다."
 mercosur.122.t: "우나수르의 유예 부여"
 mercosur.122.d: "[FROM.GetName]의 심각한 정치적 전환 이후 우나수르는 당분간 그 나라를 정지시키지 않기로 했습니다. 그럼에도 결과는 깨끗한 지지와는 거리가 멉니다. 기구는 분열보다 단결을 택했으면서도, 남아메리카 사업 내 [FROM.GetName]의 자리가 의심 아래 있을 것임을 분명히 했습니다."
 mercosur.122.a: "경고는 유효하다."
 MER_democratic_clause_warning_tt: "§Y우리가 메르코수르나 우나수르에 속해 있다면, 이 조치는 두 기구의 민주주의 조항에 따른 심사를 촉발하여 우리의 회원 자격을 위태롭게 할 수 있습니다.§!"
 MER_mercosur_democratic_clause_vote_suspend_tt: "§Y정지에 찬성표를 던집니다.§! 정지 측이 우세하면 다음 조치가 시행됩니다."
 MER_mercosur_democratic_clause_vote_probation_tt: "§Y경고 아래 메르코수르 안에 두는 데 표를 던집니다.§! 유예 측이 우세하면 다음 조치가 시행됩니다."
 MER_mercosur_democratic_clause_suspension_tt: "§Y이 국가를 메르코수르에서 정지시킵니다.§! §Y메르코수르 회원국§!을 제거하고, 남은 모든 정회원국의 회원국 기반 성장을 §G생산성 성장 1%§!, §G세수 배수 1%§!, §G해외 영향력 배수 1%§!만큼 감소시킵니다."
 MER_mercosur_democratic_clause_probation_tt: "§Y이 국가를 보호관찰 상태로 메르코수르 안에 둡니다.§! 현재와 미래의 모든 메르코수르 회원국에 대해 §Y메르코수르 회원국§!을 통해 부여되는 안정도를 §R5%§! 감소시킵니다."
 MER_unasul_democratic_clause_vote_suspend_tt: "§Y정지에 찬성표를 던집니다.§! 정지 측이 우세하면 다음 조치가 시행됩니다."
 MER_unasul_democratic_clause_vote_probation_tt: "§Y경고 아래 우나수르 안에 두는 데 표를 던집니다.§! 유예 측이 우세하면 다음 조치가 시행됩니다."
 MER_unasul_democratic_clause_suspension_tt: "§Y이 국가를 우나수르에서 정지시킵니다.§! §Y우나수르 회원국§!을 제거하고, 우나수르의 회원국 기반 성장을 §R정치력 획득 1%§!와 §R안정도 1%§!만큼 감소시키며, 해당 국가가 우나수르 방위 조약에 속해 있다면 이를 탈퇴시킵니다."
 MER_unasul_democratic_clause_probation_tt: "§Y이 국가를 보호관찰 상태로 우나수르 안에 둡니다.§! 현재와 미래의 모든 우나수르 회원국에 대해 §Y우나수르 회원국§!을 통해 부여되는 안정도를 §R5%§! 감소시킵니다."
 MER_unasul_joint_health_improvement_project_rounds_tt: "공동 보건 개선 사업의 완료 회차가 §Y4§!회 미만이어야 합니다"
 MER_unasul_supply_chain_strengthening_rounds_tt: "공급망 강화의 완료 회차가 §Y4§!회 미만이어야 합니다"
 MER_unasul_joint_research_exchange_project_rounds_tt: "공동 연구 및 기술 교류 사업의 완료 회차가 §Y4§!회 미만이어야 합니다"