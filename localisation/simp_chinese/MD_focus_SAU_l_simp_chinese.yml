 SAU_events.345.b: "拒绝请求"
 SAU_events.345.desc: "沙特阿拉伯已提出购买英国战斗机的请求。批准这笔交易将加强两国利润丰厚的防务伙伴关系。"
 SAU_events.345.t: "沙特阿拉伯请求购买英国战斗机"
 SAU_events.346.a: "批准销售"
 SAU_events.346.b: "拒绝请求"
 SAU_events.346.desc: "沙特阿拉伯已提出购买俄罗斯战斗机的请求。批准这笔交易将为俄罗斯在海湾地区开拓一个巨大的新市场。"
 SAU_events.346.t: "沙特阿拉伯请求购买俄罗斯战斗机"
 SAU_events.347.a: "批准销售"
 SAU_events.347.b: "拒绝请求"
 SAU_events.347.desc: "沙特阿拉伯已提出购买一大批M1A2艾布拉姆斯主战坦克。这笔交易将使沙特王国与美国的后勤和训练体系更加紧密地联系起来。"
 SAU_events.347.t: "沙特阿拉伯请求购买美国坦克"
 SAU_events.348.a: "批准销售"
 SAU_events.348.b: "拒绝请求"
 SAU_events.348.desc: "沙特阿拉伯已提出购买一大批T-90坦克。这笔交易将使俄罗斯工业在传统上由西方主导的市场中站稳脚跟。"
 SAU_events.348.t: "沙特阿拉伯请求购买俄罗斯坦克"
 SAU_events.349.a: "批准销售"
 SAU_events.349.b: "拒绝请求"
 SAU_events.349.desc: "沙特阿拉伯已提出购买勒克莱尔坦克的请求。批准这笔军售将加深法国与沙特阿拉伯的防务关系。"
 SAU_events.349.t: "沙特阿拉伯请求购买法国坦克"
 SAU_events.35.a: "尽我们所能重建。"
 SAU_events.35.d: "我们通往欧洲的输油管道被切断了。破坏分子炸毁了关键路段，石油无法再运往西方。今晚莫斯科可以松一口气了。"
 SAU_events.35.t: "欧洲输油管道被切断"
 SAU_events.350.a: "批准销售"
 SAU_events.350.b: "拒绝请求"
 SAU_events.350.desc: "沙特阿拉伯已提出购买豹2坦克的请求。批准这笔交易将扩大德国对海湾地区的国防出口。"
 SAU_events.350.t: "沙特阿拉伯请求购买德国坦克"
 SAU_events.351.a: "批准销售"
 SAU_events.351.b: "拒绝请求"
 SAU_events.351.desc: "沙特阿拉伯已向美国造船厂提出建造一艘现代化护卫舰的请求，该舰将为沙特皇家海军服役。这份合同将深化与利雅得的海军合作。"
 SAU_events.351.t: "沙特阿拉伯请求购买美国护卫舰"
 SAU_events.352.a: "批准销售"
 SAU_events.352.b: "拒绝请求"
 SAU_events.352.desc: "沙特阿拉伯已向俄罗斯造船厂提出建造一艘现代化护卫舰的需求，该舰将为沙特皇家海军服务。这份合同将为俄罗斯军舰开拓海湾地区的新市场。"
 SAU_events.352.t: "沙特阿拉伯请求购买俄罗斯护卫舰"
 SAU_events.353.a: "批准销售"
 SAU_events.353.b: "拒绝请求"
 SAU_events.353.desc: "沙特阿拉伯已向法国造船厂提出建造一艘现代化护卫舰的请求，该舰将用于沙特皇家海军。这份合同将延续沙特与利雅得之间长期的防务合作关系。"
 SAU_events.353.t: "沙特阿拉伯请求购买法国护卫舰"
 SAU_events.354.a: "批准销售"
 SAU_events.354.b: "拒绝请求"
 SAU_events.354.desc: "沙特阿拉伯已向德国造船厂提出建造一艘现代化军舰的请求，该军舰将用于沙特皇家海军。这份合同将加强德国在海湾地区的防务关系。"
 SAU_events.354.t: "沙特阿拉伯请求购买德国战舰"
 SAU_events.360.a: "§H建立主权财富基金。§!把这笔意外之财存起来，为未来投资。"
 SAU_events.360.b: "§H为大型超级项目提供资金。§!把资金投入到国内的工厂和城市建设中。"
 SAU_events.360.c: "§H分发给人民。§!补贴和奖金可以收买忠诚度和安心。"
 SAU_events.360.d: "原油价格从每桶25美元飙升至§G140美元§!以上。石油美元如潮水般涌入国库，速度之快令王国都应接不暇。§Y2003年至2008年§!的这笔意外之财可谓百年一遇，其用途将影响王国未来数十年的走向。议会就此展开辩论：§L是将其储存起来，用于建设，还是与他人分享§!？"
 SAU_events.360.t: "§H石油繁荣§!"
 SAU_events.361.a: "§R令人愤慨的打击！§!"
 SAU_events.361.b: "找到新的供应商，然后熬过这段时期。"
 SAU_events.361.d: "利雅得加入了阿拉伯国家对我们的石油禁运。油轮在海湾闲置，我们的炼油厂即将枯竭，汽油价格失控飙升。工厂停工，司机们排起长队，一等就是几个小时。\n\n沙特方面表示，除非我们对该地区的政策有所改变，否则制裁不会停止。只要制裁持续，我们的经济就会一直承受压力。"
 SAU_events.361.t: "§R沙特阿拉伯切断了我们的石油供应§!"
 SAU_events.362.a: "§G石油是我们的利剑。§!"
 SAU_events.362.b: "§R我们会渡过这场风暴。§!"
 SAU_events.362.c: "危险的局势升级。"
 SAU_events.362.d: "沙特阿拉伯王国重演§H1973年§!的局面，宣布对西方国家和以色列的盟友实施石油禁运。§L美国、英国、法国、德国和荷兰§!现在面临燃料短缺、配给制和价格飙升的困境。\n\n在整个阿拉伯和穆斯林世界，民众纷纷为利雅得的强硬姿态欢呼。在西方各国首都，政府争相寻找替代供应商，并警告经济衰退的风险。石油，这种曾经仅仅是一种商品，如今已成为国家政治博弈的武器。"
 SAU_events.362.t: "§H沙特阿拉伯挥舞着石油武器§!"
 SAU_events.363.a: "§Y油桶总会发出召唤。§!（§R石油依赖性+2§!）"
 SAU_events.363.d: "即使沙特阿拉伯王国经济多元化发展，原油的引力也从未松动。每个部门、每项预算、每一笔唾手可得的石油美元，都在将经济拉回原油的怀抱。既得利益、廉价能源和阻力最小的路径，都在朝着同一个方向拉扯。\n\n如果王国不持续努力，就会重新滑向对石油的依赖。"
 SAU_events.363.t: "§R石油的吸引力§!"
 SAU_events.370.a: "§G拥抱市场改革。§!让私营部门发挥主导作用。"
 SAU_events.370.b: "§R维护现有秩序。§!改变可以等等。"
 SAU_events.370.d: "经济部的技术官僚们力主§L放松管制、私有化和开放市场§!。而保守派则警告说，行动过快将破坏王国赖以建立的社会契约。委员会必须指明方向。"
 SAU_events.370.t: "§H经济变化§!"
 SAU_events.371.a: "§G为女性创造更多机会。§!经济发展需要每一种人才。"
 SAU_events.371.b: "§R维护传统角色。§!维护家庭结构。"
 SAU_events.371.d: "新一代受过良好教育的沙特女性渴望工作，而沙特经济也需要她们。改革派看到了尚未开发的才能；而§L乌里玛§!和保守家庭则认为这是一条不可逾越的界限。"
 SAU_events.371.t: "§H职场女性§!"
 SAU_events.372.a: "§G允许开放进出§!王国无法躲避世人。"
 SAU_events.372.b: "§R过滤和审查。§!维护公共道德。"
 SAU_events.372.d: "卫星电视和早期互联网将外国思想带入沙特阿拉伯的千家万户。自由派人士欢迎这种向世界开放的局面；而传统派人士则要求国家对信徒接触到的信息进行过滤。"
 SAU_events.372.t: "§H卫星天线和互联网§!"
 SAU_events.373.a: "§G限制他们的权力。§!缩减巡逻规模。"
 SAU_events.373.b: "§R重申他们的使命。§!美德必须得到维护。"
 SAU_events.373.d: "§L美德促进委员会§!在街头巡逻，强制执行着装、祈祷和男女交往等方面的规定。市民和商家对他们的权力感到不满；而神职人员则认为他们是国家灵魂的守护者。"
 SAU_events.373.t: "§H宗教警察§!"
 SAU_events.380.a: "允许开设传统的计息账户。"
 SAU_events.380.b: "严格禁止利息 - 伊斯兰教法至高无上。"
 SAU_events.380.c: "公共领域适用伊斯兰债券，私人领域关注务实利益。"
 SAU_events.380.d: "王国必须就§L利息§!问题表明立场。§L世俗改革者§!认为，传统的计息账户能够吸引外资，并推动银行业现代化。§L高级学者委员会§!则要求严格禁止利息，并遵守伊斯兰教法。一种§H混合§!方案允许公开发行伊斯兰债券，同时允许私下进行非正式的利息交易。"
 SAU_events.380.t: "§H标准化利息法§!"
 SAU_events.381.a: "现代部分准备金制度 - 以牺牲稳定为代价实现增长。"
 SAU_events.381.b: "仅以资产为支撑的投资 - 稳定但速度较慢。"
 SAU_events.381.c: "适度的储备金要求。"
 SAU_events.381.d: "银行每里亚尔的存款能创造多少信贷？§L西方模式§!采用§H部分准备金制度§! - 杠杆率高达10:1，信贷更多，增长更快，风险也更大。§L伊斯兰模式§!则要求§H完全资产支持§! - 每笔贷款都与实际财富挂钩，速度较慢但更稳定。§H混合§!模式则设定了适度的准备金要求。"
 SAU_events.381.t: "§H部分准备金制度§!"
 SAU_events.382.a: "监管宽松 - 允许衍生品和期货交易。"
 SAU_events.382.b: "严格禁止 - 禁止一切投资活动，禁止一切赌博行为。"
 SAU_events.382.c: "仅限受监管的衍生品 - 平衡的方法"
 SAU_events.382.d: "沙特阿拉伯王国应该对投§L机、衍生品和期货§!进行多严格的监管？§L西方观点§!认为这些是重要的风险管理工具。§L伊斯兰教观点§!则谴责它们为§L投机§!，与赌博无异。一种§H混合§!方案只允许受监管的衍生品交易。"
 SAU_events.382.t: "§H反投机指令§!"
 SAU_events.383.a: "传统的以利息为基础的银行间市场。"
 SAU_events.383.b: "基于穆拉巴哈模式的伊斯兰银行间市场。"
 SAU_events.383.c: "混合型 - 两者分别运行。"
 SAU_events.383.d: "银行间相互借贷的条件是什么？§L西方模式§!采用§H传统的利率走廊§!（类似伦敦银行同业拆放利率）。§L伊斯兰模式§!则通过§H穆拉巴哈§!（一种以资产为抵押的成本加成融资）进行银行间资金流动。§H混合§!模式则允许在特定行业同时采用这两种方式。"
 SAU_events.383.t: "§H银行间贷款准则§!"
 SAU_events.384.a: "沙特阿拉伯货币局 - 独立的世俗监管机构。"
 SAU_events.384.b: "沙特阿拉伯货币局+拥有强制否决权的伊斯兰教法委员会"
 SAU_events.384.c: "混合 - 两个平行结构。"
 SAU_events.384.d: "谁来监管沙特阿拉伯的银行？§L西方模式§!将§L沙特阿拉伯货币管理局§!设定为一个§H独立的、技术官僚式的监管机构§!。§L伊斯兰模式§!则将沙特阿拉伯货币管理局与§H伊斯兰教法监督委员会§!相结合 - 该委员会由拥有强制否决权的宗教人士组成。§H混合§!模式则由两个平行的机构组成。"
 SAU_events.384.t: "§H银行控制法§!"
 SAU_events.385.a: "严格的正统观念 - 无妥协"
 SAU_events.385.b: "务实 - 引领全球伊斯兰金融市场。"
 SAU_events.385.d: "沙特阿拉伯王国全力发展§H伊斯兰金融§!。但究竟要做到何种程度？§L严格遵循正统教义§! - 绝不妥协，每一笔交易都必须符合伊斯兰教法 - 能够赢得§L乌里玛§!的无条件支持，并为子孙后代带来稳定。而§L务实的伊斯兰模式§! - 打造全球伊斯兰金融中心，吸引来自§L马来西亚§!、§L印度尼西亚§!、§L伊朗§!和§L海湾地区§!的穆斯林资本 - 则为了扩大影响力而牺牲了一定的纯粹性。"
 SAU_events.385.t: "§H伊斯兰金融堡垒§!"
 SAU_events.386.a: "全盘盎格鲁-撒克逊 - 允许使用所有工具。"
 SAU_events.386.b: "渐进式 - 披着伊斯兰教法外衣的西方习俗。"
 SAU_events.386.d: "王国打破传统，推行金融§H世俗化§!。§L全盘盎格鲁-撒克逊§!路线采用所有西方金融工具 - §H衍生品§!、§H债券§!、§H保证金交易§! - 最大限度地吸引了外资，但也激怒了§L乌里玛§!。§L渐进§!路线则在西方做法外披上伊斯兰教法的外衣 - 收入较少，但受到的抵制也较小。"
 SAU_events.386.t: "§G金融世俗化§!"
 SAU_events.39.a: "暴风雨已经结束了。"
 SAU_events.39.d: "沙特阿拉伯及其盟军战机对胡塞武装控制的也门境内目标发动了大规模空袭。利雅得方面已宣布将恢复也门公认的政府，并打击伊朗支持的胡塞武装。整个中东地区屏息凝神。"
 SAU_events.39.t: "“果断风暴”行动开始"
 SAU_events.390.a: "批准向利雅得出售"
 SAU_events.390.b: "拒绝请求"
 SAU_events.390.d: "沙特阿拉伯王国已正式提出购买F-15“攻击鹰”战斗机 - 我们最优秀的出口战斗机。利雅得是海湾地区的重要盟友，也是我们的主要武器客户。我们是否应该批准这笔交易？"
 SAU_events.390.t: "沙特阿拉伯提出请求：F-15“攻击鹰”战斗机"
 SAU_events.391.a: "极好的消息"
 SAU_events.391.d: "美国已同意向沙特阿拉伯王国出售F-15“攻击鹰”战斗机。交易完成 - 沙特皇家空军很快将装备最先进的美国战机。"
 SAU_events.391.t: "华盛顿批准F-15交易"
 SAU_events.392.a: "一次挫折"
 SAU_events.392.d: "美国目前拒绝出售F-15战斗机。过一段时间后，我们可能会再次提出请求。"
 SAU_events.392.t: "华盛顿拒绝"
 SAU_events.393.a: "批准出口"
 SAU_events.393.b: "拒绝请求"
 SAU_events.393.d: "沙特阿拉伯已根据“萨拉姆计划”申请采购欧洲战斗机“台风”。作为该计划的合作伙伴，德国是否应该批准向利雅得出口这架战机？"
 SAU_events.393.t: "沙特阿拉伯请求：欧洲台风战斗机"
 SAU_events.394.a: "极好的消息"
 SAU_events.394.d: "该财团已同意向沙特阿拉伯王国出口欧洲台风战斗机。“萨拉姆”计划现在可以继续进行。"
 SAU_events.394.t: "台风协议获批"
 SAU_events.395.a: "一次挫折"
 SAU_events.395.d: "欧洲方面目前拒绝出口“台风”战斗机。我们以后可能会再次尝试。"
 SAU_events.395.t: "台风协议被拒绝"
 SAU_events.396.a: "批准向利雅得出售"
 SAU_events.396.b: "拒绝请求"
 SAU_events.396.d: "沙特阿拉伯王国希望扩大“亚玛玛”计划，并采购升级后的“狂风”GR4战斗机。利雅得几十年来一直是英国工业的忠实客户。我们是否应该批准这笔交易？"
 SAU_events.396.t: "沙特阿拉伯请求：狂风GR4"
 SAU_events.397.a: "极好的消息"
 SAU_events.397.d: "英国已同意根据扩大的亚玛玛协议向该国供应狂风GR4战斗机。我们的打击中队将令海湾地区羡慕不已。"
 SAU_events.397.t: "伦敦批准了狂风交易"
 SAU_events.398.a: "一次挫折"
 SAU_events.398.d: "英国目前拒绝扩大“狂风”战斗机的采购协议。我们可能会在一段时间后再次提出请求。"
 SAU_events.398.t: "伦敦拒绝"
 SAU_events.399.a: "批准出口"
 SAU_events.399.b: "拒绝请求"
 SAU_events.399.d: "沙特阿拉伯已提出采购帕纳维亚“狂风”IDS战斗机的请求，这是一款坚固耐用的多国联合攻击机。作为该联合体的成员之一，意大利是否应该批准向利雅得出口该型飞机？"
 SAU_events.399.t: "沙特请求：帕纳维亚狂风"
 SAU_events.4.a: "极好的消息"
 SAU_events.4.d: "[FROM.GetNameDefCap]已接受我们的提议。协议现在可以继续推进。"
 SAU_events.4.t: "[FROM.GetNameDefCap]接受提议"
 SAU_events.40.a: "遏制：孤立并扼杀该政权。"
 SAU_events.40.b: "谨慎缓和：暂时降低温度。"
 SAU_events.40.c: "进入战时状态：我们会抢在他之前发动攻击。"
 SAU_events.40.d: "萨达姆仍然统治着巴格达，科威特和哈夫吉的惨痛记忆仍然笼罩着海湾地区。沙特阿拉伯王国必须在萨达姆再次冒险之前，决定如何应对这个危险的邻国。"
 SAU_events.40.t: "萨达姆的阴影"
 SAU_events.400.a: "极好的消息"
 SAU_events.400.d: "意大利已同意向沙特阿拉伯王国出口帕纳维亚“旋风”遮断/攻击型战斗机。该财团欢迎一位重要的新运营商加入。"
 SAU_events.400.t: "罗马批准了狂风交易"
 SAU_events.401.a: "一次挫折"
 SAU_events.401.d: "意大利目前拒绝出口“狂风”战斗机。我们稍后可能会再次尝试。"
 SAU_events.401.t: "罗马拒绝"
 SAU_events.5.a: "一次挫折"
 SAU_events.5.d: "[FROM.GetNameDefCap]已拒绝我们的提议。两国关系将受到影响。"
 SAU_events.5.t: "[FROM.GetNameDefCap]拒绝提议"
 SAU_events.56.a: "在北京主持会谈。"
 SAU_events.56.b: "这不是我们之间的争执。"
 SAU_events.56.d: "沙特阿拉伯请求我们调解利雅得和德黑兰之间的争端。海湾两岸都向我们供应石油，他们的争端威胁着我们赖以生存的每一艘油轮。主办此次会谈将使北京巩固其在该地区不可或缺的地位。"
 SAU_events.56.t: "来自利雅得的请求"
 SAU_events.57.a: "签订协议。"
 SAU_events.57.b: "我们不会和他们坐在一起。"
 SAU_events.57.d: "中国邀请我们去北京与沙特阿拉伯签署协议：恢复外交关系，重开大使馆，结束代理人战争。沙特方面已经同意。签字的笔已为我们准备就绪。"
 SAU_events.57.t: "致北京的邀请"
 SAU_events.58.a: "崭新篇章"
 SAU_events.58.d: "在中国斡旋下，沙特阿拉伯王国和伊朗伊斯兰共和国签署了协议。大使馆将重新开放，代理人将偃旗息鼓，海湾地区终于可以松一口气。竞争并未结束，但利刃已入鞘。"
 SAU_events.58.t: "北京协议"
 SAU_events.59.a: "就这样吧。"
 SAU_events.59.d: "谈判尚未开始便已破裂。对抗仍在继续，海湾地区依然危机四伏。"
 SAU_events.59.t: "调解失败"
 SAU_events.6.a: "加入走廊。"
 SAU_events.6.b: "拒绝该提议。"
 SAU_events.6.d: "沙特阿拉伯提议修建印度-中东-欧洲经济走廊，这是一条绕过苏伊士运河，经由海湾连接印度和欧洲的贸易路线。"
 SAU_events.6.t: "[SAU.GetFlag]印度-中东-欧洲走廊[RAJ.GetFlag]"
 SAU_events.60.a: "军队向真主党发起进攻。"
 SAU_events.60.b: "黎巴嫩不会为利雅得流血。"
 SAU_events.60.d: "沙特的资金重建了我们的军队；沙特的步枪填满了我们的军火库。现在利雅得要价：对真主党采取行动，瓦解这个国中之国。军队的准备比以往任何时候都更加充分。黎巴嫩能否挺过这一劫，则是另一个问题。"
 SAU_events.60.t: "来自利雅得的授权"
 SAU_events.61.a: "南方恢复秩序。"
 SAU_events.61.d: "随着贝鲁特方面着手恢复对黎巴嫩南部地区的国家控制，黎巴嫩军队的纵队正向南推进。在与“国中之国”共存数十年后，黎巴嫩政府已下令其重建的军队武力解除真主党的武装。海湾国家对此表示赞赏；而德黑兰则称此举是对抵抗运动的叛国行为。"
 SAU_events.61.t: "黎巴嫩军队对真主党采取行动"
 SAU_events.63.a: "证据胜于雄辩。"
 SAU_events.63.d: "沙特阿拉伯已向阿拉伯联盟提交了一份文件，其中包括导弹碎片、货运清单和截获的通信记录，这些证据指向胡塞武装的武器库源自伊朗。阿拉伯国家首都对此反应异常一致，而德黑兰的否认几乎无人理睬。"
 SAU_events.63.t: "档案揭露伊朗在也门的幕后操纵"
 SAU_events.64.a: "街头一片混乱。"
 SAU_events.64.d: "从德黑兰到贝鲁特，民众走上街头，抗议“抵抗轴心”各国政府。抗议者的诉求虽源于当地，但观察人士指出，他们的资金来源却明显带有海湾地区的印记。“抵抗轴心”指责外国势力幕后操纵，而外国势力则矢口否认。"
 SAU_events.64.t: "抗议活动席卷抵抗轴心国"
 SAU_events.65.a: "穆斯林共同体只认一个地址。"
 SAU_events.65.d: "应沙特阿拉伯的邀请，伊斯兰世界齐聚其圣城麦加，伊朗代表团也位列其中。无论闭门会议达成了什么决定，其意义都昭然若揭：当伊斯兰世界集会时，它便在麦加举行，而利雅得则坐在会议桌的首位。"
 SAU_events.65.t: "麦加峰会"
 SAU_events.67.a: "在北京的一次握手。"
 SAU_events.67.d: "在几乎无人相信的仪式上，沙特阿拉伯和伊朗在北京签署协议，恢复了多年来的外交关系。两国大使馆将重新开放，代理人战争也将平息。中国斡旋达成了这项协议，向华盛顿传递的信息十分明确：中东出现了一位新的调解人。"
 SAU_events.67.t: "北京协议"
 SAU_events.68.a: "听他们把话说完。"
 SAU_events.68.b: "没什么好说的。"
 SAU_events.68.d: "沙特阿拉伯通过第三方首都的中间人询问以色列是否愿意就关系正常化进行谈判。目前尚未提出任何条件。问题在于，沙特阿拉伯是否应该听取以色列的请求。"
 SAU_events.68.t: "来自利雅得的静谧之路"
 SAU_events.69.a: "进展。"
 SAU_events.69.d: "以色列的回应比预期更为积极。谈判进程保持稳定，并缓慢推进。"
 SAU_events.69.t: "来自特拉维夫的积极信号"
 SAU_events.7.a: "接受合作协议。"
 SAU_events.7.b: "拒绝提议"
 SAU_events.7.d: "利雅得提议建立以沙特电信公司和韩国基础设施为核心的战略投资伙伴关系。两国都将从中受益，进入对方市场。"
 SAU_events.7.t: "[SAU.GetFlag]沙特-韩国伙伴关系[KOR.GetFlag]"
 SAU_events.70.a: "令人失望。"
 SAU_events.70.d: "以色列的回应冷淡而简短。谈判陷入僵局，前景黯淡。"
 SAU_events.70.t: "冷淡的回应"
 SAU_events.71.a: "接受1967年的界线。一个为了和平而建的国家。"
 SAU_events.71.b: "1967年界线是不可能的。"
 SAU_events.71.d: "沙特阿拉伯正式提出阿拉伯和平倡议：承认巴勒斯坦国地位，互设大使馆，与整个阿拉伯世界开展贸易，并实现和平，以此换取巴勒斯坦在1967年边界基础上建立一个独立的国家。这是迄今为止最大的筹码，而以色列几十年来一直拒绝接受这一条件。"
 SAU_events.71.t: "阿拉伯和平倡议"
 SAU_events.72.a: "达成交易"
 SAU_events.72.b: "钱不是问题。"
 SAU_events.72.d: "沙特谈判代表抛出诱人条件：投资基金、开放天空、技术走廊以及进入海湾最大市场。与利雅得达成的和平协议将带来前所未有的巨大收益。"
 SAU_events.72.t: "海湾的财富"
 SAU_events.73.a: "一个国家的和平。历史。"
 SAU_events.73.d: "沙特阿拉伯和以色列签署了《利雅得协议》：两国关系全面正常化，以以色列接受在1967年边界基础上建立一个独立的巴勒斯坦国为交换条件，该协议由沙特阿拉伯和约旦担保。这项被搁置了一代人的阿拉伯和平倡议，在短短一个下午就重绘了中东版图。"
 SAU_events.73.t: "利雅得协议"
 SAU_events.74.a: "老话重提。"
 SAU_events.74.d: "利雅得和特拉维夫之间的会谈无果而终。以色列不接受巴勒斯坦建国；沙特阿拉伯则坚持己见。这一代人以来最大胆的外交尝试以砰然关门告终。"
 SAU_events.74.t: "沙特-以色列会谈破裂"
 SAU_events.75.a: "世纪豪赌。"
 SAU_events.75.d: "沙特阿拉伯在没有任何附加条件、没有巴勒斯坦建国、也没有事先警告的情况下，承认了以色列并与其建立了全面关系。华盛顿欢欣鼓舞，特拉维夫欣喜若狂，而阿拉伯世界的街头却一片哗然。两圣地监护人做出了世纪豪赌。"
 SAU_events.75.t: "沙特阿拉伯承认以色列"
 SAU_events.76.a: "时机已过。"
 SAU_events.76.d: "与以色列的会谈已经没有时间了。太多问题悬而未决太久，时机已过。双方代表团默默收拾行装，旧有的界限再次浮现在地图上。"
 SAU_events.76.t: "窗户关上了"
 SAU_events.77.a: "准备协议。"
 SAU_events.77.d: "以色列已经接受了我们提出的足够多的条件，使协议得以生效。现在只剩下签字和载入史册了。"
 SAU_events.77.t: "谈判取得突破"
 SAU_events.79.a: "开始谈判。"
 SAU_events.79.b: "没什么好说的。"
 SAU_events.79.d: "华盛顿和安曼方面传来消息，沙特阿拉伯准备在最高层公开讨论关系正常化问题。代价将十分高昂，谈判也将受到全世界的关注。但阿拉伯国家从未伸出过如此大的手。"
 SAU_events.79.t: "来自利雅得的序曲"
 SAU_events.8.a: "签署防务条约。"
 SAU_events.8.b: "拒绝条约"
 SAU_events.8.d: "随着中东地区紧张局势加剧，沙特阿拉伯提议与巴基斯坦签署一项共同防御条约。该协议将包括对两国军事行动的保障和准入权。"
 SAU_events.8.t: "[SAU.GetFlag]沙特-巴基斯坦防务条约[PAK.GetFlag]"
 SAU_events.80.a: "不可思议的事情，竟然被安排好了。"
 SAU_events.80.d: "利雅得和特拉维夫已经证实：关于关系正常化的正式会谈已经启动。双方代表团已启程前往。世界各国政府都在重新审视其对中东的认知，而所有反对这项协议的国家也都在暗自倒计时。"
 SAU_events.80.t: "沙特与以色列开始会谈"
 SAU_events.81.a: "他们的拒绝就是他们的答案。"
 SAU_events.81.d: "特拉维夫方面甚至拒绝开启谈判。这一提议毫无进展，王国向全世界伸出的手也悬在半空。这一代人恐怕无法达成协议。"
 SAU_events.81.t: "以色列拒绝谈判"
 SAU_events.82.a: "一个由混凝土和玻璃建造的未来。"
 SAU_events.82.d: "最后期限到来了，而王国所做出的每一个预测都与此相反。新未来城在红海上闪闪发光，利雅得已焕然一新，游客们来到了曾经只有石油井架的地方。沙特阿拉伯为自己购买了一个不依赖原油的未来。"
 SAU_events.82.t: "2030愿景已实现"
 SAU_events.83.a: "承诺兑现了。"
 SAU_events.83.d: "时至2030年，愿景计划大多仍未实现。半成品高塔锈迹斑斑地矗立在沙漠中，承诺的城市空无一人，耗资数千亿美元却几乎毫无成果。那些曾称之为幻想的批评家们正在庆祝胜利，而民众也对此充耳不闻。"
 SAU_events.83.t: "白象"
 SAU_events.84.a: "把它记下来。"
 SAU_events.84.d: "“愿景”计划的另一项旗舰项目也未能按期完工。承包商已收到款项，起重机已拆除，媒体也纷纷占据头条。资金外流，疑虑进一步蔓延。"
 SAU_events.84.t: "项目未能按时完成"
 SAU_events.88.a: "继承问题已经出现争议。"
 SAU_events.88.d: "法赫德·本·阿卜杜勒-阿齐兹·阿勒沙特国王驾崩。十年前他因中风去世，名义上仍是国王，由他的同父异母兄弟阿卜杜拉摄政。如今，阿卜杜拉正式登基。然而，阿卜杜拉本人已年过八旬，沙特王室的王子们已经在商议谁将继承他的王位。\n\n§Y阿卜杜拉国王的继任者之争正式开始。请关注王储们的决议。§!"
 SAU_events.88.t: "法赫德国王之死"
 SAU_events.89.a: "王冠的传承"
 SAU_events.89.d: "阿卜杜拉·本·阿卜杜勒-阿齐兹·阿勒沙特国王驾崩。十年来，沙特王室的王子们一直在权衡和商讨谁应继承王位。如今，这个问题已无法再拖延，拥有最大影响力的王子将被拥立为王。\n\n§Y萨勒曼·本·阿卜杜勒阿齐兹：§![?SAU_salman_share|0]%\n§Y穆罕默德·本·纳伊夫：§![?SAU_mbn_share|0]%\n§Y穆塔伊卜·本·阿卜杜拉：§! [?SAU_mutaib_share|0]%"
 SAU_events.89.t: "阿卜杜拉国王之死"
 SAU_events.9.a: "接受合作协议。"
 SAU_events.9.b: "拒绝提议"
 SAU_events.9.d: "沙特阿拉伯提议与中国建立战略投资伙伴关系。该协议将扩大中国的基础设施项目，并加强北京在海湾地区的地位。"
 SAU_events.9.t: "[SAU.GetFlag]沙特-中国战略伙伴关系[CHI.GetFlag]"
 SAU_events.90.a: "与王室站在一起"
 SAU_events.90.b: "废除王国"
 SAU_events.90.d: "席卷阿拉伯世界的狂热浪潮已蔓延至沙特阿拉伯王国。东部省份和汉志各城市街头挤满了民众，他们要求结束专制统治。宗教领袖犹豫不决，国民警卫队等待命令，沙特王室必须决定是动用武力镇压民意，还是任由旧秩序垮台。"
 SAU_events.90.t: "阿拉伯之春蔓延至王国"
 SAU_events.91.a: "现在关闭"
 SAU_events.91.b: "将其作为杠杆"
 SAU_events.91.b.tt: "您仍然可以通过§Y封闭海峡§!决议随时选择关闭海峡。"
 SAU_events.91.d: "战争已蔓延至海湾地区。我们的导弹阵地和快速攻击艇严阵以待，部署在霍尔木兹海峡沿岸，这条通道是全球五分之一石油的运输要道。我们现在就可以将其封锁，使世界经济瘫痪；或者，我们也可以继续对敌人构成威胁，并在我们选择的时机将其封锁。"
 SAU_events.91.t: "关闭霍尔木兹海峡？"
 SAU_events.92.a: "宣告伊斯兰共和国成立"
 SAU_events.92.b: "保卫阿拉伯共和国"
 SAU_events.92.d: "随着什叶派运动的兴起，制宪会议必须决定共和国将成为什么样的国家：建立在宗教权威基础上的伊斯兰共和国，还是世俗的阿拉伯共和国。"
 SAU_events.92.t: "共和国的性质"
 SAU_events.93.a: "加入伊朗抵抗轴心"
 SAU_events.93.b: "建立独立的反帝国主义阵线"
 SAU_events.93.d: "德黑兰向这个新生的什叶派共和国伸出了橄榄枝。强硬派必须做出选择：要么加入伊朗抵抗轴心，接受最高领袖的庇护；要么建立一个不受任何外国资本控制的独立阵线。"
 SAU_events.93.t: "抵抗轴心"
 SAU_events.94.a: "加入阵线"
 SAU_events.94.b: "拒绝邀请"
 SAU_events.94.d: "阿拉伯共和国高举与抵抗轴心相抗衡的旗帜，呼吁我国与德黑兰决裂，加入由利雅得领导的独立阵线。"
 SAU_events.94.t: "来自阿拉伯的邀请"
 SAU_events.95.a: "加入阿拉伯共产国际"
 SAU_events.95.b: "与众不同"
 SAU_events.95.d: "红色阿拉伯呼吁阿拉伯世界的工人和革命者团结在同一面旗帜下。"
 SAU_events.95.t: "阿拉伯共产国际"
 SAU_events.96.a: "红色黎明升起。"
 SAU_events.96.d: "红旗在利雅得飘扬。沙特王室被推翻，阿拉伯人民共和国宣告成立，誓言将革命带入整个阿拉伯世界。"
 SAU_events.96.t: "阿拉伯人民共和国"
 SAU_events.97.a: "因此，它宣告成立了"
 SAU_events.97.d: "制宪会议宣布成立阿拉伯伊斯兰共和国，其建立在法学家监护和信徒统治的基础之上。"
 SAU_events.97.t: "阿拉伯伊斯兰共和国"
 SAU_events.98.a: "危险的裂痕"
 SAU_events.98.d: "阿拉伯世界已与德黑兰决裂，拒绝接受伊朗的指导，决心领导自己的反帝国主义阵线。什叶派世界也因此分裂为两个相互对立的抵抗中心。"
 SAU_events.98.t: "轴心国的分裂"
 SAU_events.99.a: "他们会为此负责。"
 SAU_events.99.d: "利雅得已经与轴心国决裂，并拉拢了我们的盟友。德黑兰必须决定如何回应这种对抵抗运动的背叛。"
