 KOR_naturalized_citizens_serve: "Citoyens naturalisés requis pour servir"
 KOR_naturalized_citizens_serve_desc: "Les citoyens coréens naturalisés nés à l’étranger devront désormais servir dans l’armée. Bien que cela ait aidé à contrer une réduction des conscrits due à la diminution de la population coréenne, cela a découragé les étrangers d’acquérir la citoyenneté coréenne."
