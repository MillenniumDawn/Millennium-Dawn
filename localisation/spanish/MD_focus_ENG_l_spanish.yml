 ENG_unionist_campaign_tour: "Gira de campaña unionista"
 ENG_unionist_campaign_tour_desc: "Lleva al Gabinete a la carretera. Ayuntamientos, fábricas, astilleros y sindicatos universitarios, cada día de la campaña, exponiendo los argumentos en persona en lugar de a través de un comunicado de prensa redactado en Londres. Esto mueve unos cuantos puntos y se puede repetir mientras los ministros resistan.\n\nVoto para abandonar la Unión: §Y[?ENG_referendum_leave_vote|0]§!%"
 ENG_fiscal_settlement_offer: "Ofrecer un acuerdo fiscal"
 ENG_fiscal_settlement_offer_desc: "Abre el Tesoro. Una subvención en bloque garantizada, proyectos de capital confirmados en lugar de prometidos y un suelo bajo la fórmula de financiación, todo firmado antes del día de la votación. Los votantes que sopesan la independencia frente a las finanzas de sus hogares se darán cuenta, y la dependencia de la región respecto a Westminster se profundizará con cada libra invertida.\n\nVoto para abandonar la Unión: §Y[?ENG_referendum_leave_vote|0]§!%"
 ENG_discredit_separatists: "Desacreditar la campaña separatista"
 ENG_discredit_separatists_desc: "Difunde informes perjudiciales contra la dirección separatista. Sus planes monetarios, sus acuerdos fronterizos, sus finanzas y, si las filtraciones van por ahí, sus vidas privadas. Funciona más veces de las que falla, y cuando falla les regala un agravio y un titular de prensa.\n\nVoto para abandonar la Unión: §Y[?ENG_referendum_leave_vote|0]§!%"
 ENG_discredit_separatists_tt: "§G60%§! de probabilidad de que la campaña cale y el apoyo a abandonar la Unión caiga drásticamente.\n§R40%§! de probabilidad de que salga el tiro por la culata, elevando tanto el voto de salida como la agitación local."
 ENG_further_devolution_pledge: "Comprometer una mayor descentralización"
 ENG_further_devolution_pledge_desc: "La última carta de la mano: el compromiso firmado de que un voto a favor de permanecer se responderá con nuevas competencias sobre impuestos, bienestar social y radiodifusión. Esto mueve el voto separatista moderado y rebaja la tensión de la política nacionalista durante una generación, al precio de ceder las palancas que Westminster necesitaría para mantener unida a la región la próxima vez.\n\nSolo se puede comprometer una vez por campaña.\n\nVoto para abandonar la Unión: §Y[?ENG_referendum_leave_vote|0]§!%"
 ENG_referendum_leave_vote_down_4_tt: "Voto para abandonar la Unión: §G-4§!"
 ENG_referendum_leave_vote_down_6_tt: "Voto para abandonar la Unión: §G-6§!"
 ENG_referendum_leave_vote_down_7_tt: "Voto para abandonar la Unión: §G-7§!"
 ENG_promote_unionism_scotland: "Defender la Unión en Escocia"
 ENG_promote_unionism_scotland_desc: "Financia las operaciones sobre el terreno de los partidos unionistas en Escocia entre las elecciones en lugar de durante ellas: oficinas electorales que se mantienen abiertas, candidatos reclutados en escaños que el partido había dado por perdidos y una defensa sostenida de la Unión allá donde nadie se ha molestado en hacerla durante años. Una labor lenta y poco glamurosa, pero lo único que hace descender el nacionalismo escocés.\n\nRequiere que la agitación escocesa sea lo suficientemente baja como para que los argumentos sean escuchados."
 ENG_scottish_unionism_calm_tt: "La agitación escocesa está por debajo de §G25§! (actualmente §Y[?ENG_scottish_agitation|0]§!)"
 ENG_promote_unionism_nireland: "Defender la Unión en Irlanda del Norte"
 ENG_promote_unionism_nireland_desc: "Financia a las organizaciones cívicas unionistas en Irlanda del Norte fuera de la temporada de desfiles: proyectos comunitarios en las zonas de fricción, planes de empleo intercomunitarios y candidatos capaces de retener un escaño sin necesidad de hacer campaña centrada en la frontera. Un trabajo lento, pero lo único que hace descender el nacionalismo norirlandés.\n\nRequiere que la tensión sectaria sea lo suficientemente baja como para que los argumentos sean escuchados."
 ENG_north_irish_unionism_calm_tt: "La tensión sectaria está por debajo de §G25§! (actualmente §Y[?ENG_north_irish_agitation|0]§!)"
 ENG_promote_unionism_wales: "Defender la Unión en Gales"
 ENG_promote_unionism_wales_desc: "Financia la organización de los partidos unionistas en Gales: trabajo electoral en las cuencas mineras, campañas en idioma galés que no cedan la lengua a los nacionalistas y una defensa positiva de la Unión en lugar de limitarse a argumentar que los números no cuadran. Lento, pero lo único que hace descender el nacionalismo galés.\n\nRequiere que la agitación galesa sea lo suficientemente baja como para que los argumentos sean escuchados."
 ENG_wales_unionism_calm_tt: "La agitación galesa está por debajo de §G25§! (actualmente §Y[?ENG_wales_agitation|0]§!)"
 ENG_convene_constitutional_convention: "Convocar una convención constitucional"
 ENG_convene_constitutional_convention_desc: "El acuerdo constitucional de 1998 se redactó deprisa, por personas que esperaban renegociarlo más tarde, y ese momento ha llegado. Convoca una convención multipartidista sobre la forma futura de la Unión: las administraciones descentralizadas, las bancadas de la oposición, las iglesias y los sindicatos, sentados durante seis meses y rindiendo cuentas ante el Parlamento en lugar de ante el Gabinete.\n\nLa convención no decide nada por sí misma. Su informe es la base legal y política sobre la cual Westminster puede plantear un acuerdo permanente a Escocia, Irlanda del Norte o Gales, y sin él, nadie se tomaría en serio ninguna oferta de acuerdo.\n\nRequiere un gobierno lo suficientemente estable como para sobrevivir al debate, y que no haya ninguna campaña de referéndum o de independencia ya en curso."
 ENG_scottish_union_settlement: "Proponer un acuerdo de la Unión escocesa"
 ENG_scottish_union_settlement_desc: "Con la política escocesa en calma, las finanzas de Escocia vinculadas al Tesoro y los partidos independentistas en su momento más débil, Westminster puede plantear la cuestión constitucional a Escocia bajo sus propios términos en lugar de esperar a que se lo pidan. Un acuerdo aprobado en las urnas pone fin al proceso de descentralización de forma permanente: el lugar de Escocia en el Reino Unido queda fijado por estatuto, la maquinaria del referéndum se desmantela y Holyrood deja de ser una vía de salida de la Unión.\n\nUn acuerdo rechazado no cambia nada y cuesta una década antes de que se pueda volver a intentar.\n\nPresión de independencia: §Y[?ENG_scottish_pressure|0]§!/§G20§!\nNacionalismo escocés: §Y[?ENG_scottish_nationalists|0]§!/§G25§!"
 ENG_scottish_settlement_calm_tt: "La presión de independencia escocesa está por debajo de §G20§! (actualmente §Y[?ENG_scottish_pressure|0]§!)"
 ENG_scottish_settlement_ready_tt: "El nacionalismo escocés está por debajo de §G25§! (actualmente §Y[?ENG_scottish_nationalists|0]§!)"
 ENG_north_irish_union_settlement: "Proponer un acuerdo de la Unión norirlandesa"
 ENG_north_irish_union_settlement_desc: "Con los disidentes desarmados, la Provincia en calma y la política republicana en su momento más débil, Westminster puede plantear la cuestión constitucional a Irlanda del Norte bajo sus propios términos. Un acuerdo aprobado en las urnas pone fin al proceso de descentralización de forma permanente y cierra el referéndum fronterizo como vía de salida de la Unión.\n\nUn acuerdo rechazado no cambia nada y cuesta una década antes de que se pueda volver a intentar.\n\nPresión de independencia: §Y[?ENG_north_irish_pressure|0]§!/§G20§!\nNacionalismo norirlandés: §Y[?ENG_north_irish_nationalists|0]§!/§G25§!"
 ENG_north_irish_settlement_calm_tt: "La presión de independencia norirlandesa está por debajo de §G20§! (actualmente §Y[?ENG_north_irish_pressure|0]§!)"
 ENG_north_irish_settlement_ready_tt: "El nacionalismo norirlandés está por debajo de §G25§! (actualmente §Y[?ENG_north_irish_nationalists|0]§!)"
 ENG_welsh_union_settlement: "Proponer un acuerdo de la Unión galesa"
 ENG_welsh_union_settlement_desc: "Con la política galesa en calma y el ala independentista del Senedd en una posición marginal, Westminster puede resolver la cuestión constitucional en Gales antes de que nadie más la plantee. Un acuerdo aprobado en las urnas pone fin al proceso de descentralización de forma permanente y fija por estatuto el lugar de Gales en el Reino Unido.\n\nUn acuerdo rechazado no cambia nada y cuesta una década antes de que se pueda volver a intentar.\n\nPresión de independencia: §Y[?ENG_wales_pressure|0]§!/§G20§!\nNacionalismo galés: §Y[?ENG_wales_nationalists|0]§!/§G25§!"
 ENG_wales_settlement_calm_tt: "La presión de independencia galesa está por debajo de §G20§! (actualmente §Y[?ENG_wales_pressure|0]§!)"
 ENG_wales_settlement_ready_tt: "El nacionalismo galés está por debajo de §G25§! (actualmente §Y[?ENG_wales_nationalists|0]§!)"
 devolution.11.t: "[ENG_GetReferendumRegion] vota a favor de marchar"
 devolution.11.d: "El escrutinio ha terminado y el resultado es indiscutible. Una mayoría ha votado a favor de abandonar el Reino Unido, y el gobierno que convocó el referéndum está obligado a hacerlo efectivo. Las negociaciones sobre defensa, deuda, moneda y fronteras comienzan de inmediato, y el primer acto es de carácter constitucional: la transferencia de competencias que Westminster pasó una generación negándose a conceder es ahora una transferencia de soberanía."
 devolution.11.a: "El resultado se mantiene."
 devolution.12.t: "La Unión resiste"
 devolution.12.d: "La campaña por la salida ha perdido. La participación ha sido alta, el margen es lo suficientemente claro como para que nadie con credibilidad lo impugne, y la cuestión constitucional queda cerrada por una generación según los términos explícitos de la votación. Los partidos separatistas se reagruparán, y la amargura de una campaña perdida tardará años en calmarse, pero el Reino Unido está intacto y Westminster tiene una respuesta para la próxima vez que se plantee la exigencia."
 devolution.12.a: "Una vez por generación."
 devolution.13.t: "El acuerdo es aprobado"
 devolution.13.d: "El acuerdo ha salido adelante. [ENG_GetReferendumRegion] ha votado a favor de cerrar la cuestión constitucional bajo los términos de Westminster: el proceso de descentralización termina aquí, el lugar de la región en el Reino Unido se apoya en un mandato popular en lugar de en una ley que un futuro Parlamento podría derogar, y no hay ningún otro referéndum posterior que convocar. Los partidos nacionalistas se han quedado argumentando en contra de un resultado que sus propios votantes entregaron."
 devolution.13.a: "La cuestión está resuelta."
 devolution.14.t: "El acuerdo es rechazado"
 devolution.14.d: "El acuerdo ha sido rechazado en las urnas. Pedir a una región que renuncie por contrato a su derecho a volver a preguntar se interpretó exactamente como dijeron los separatistas que se interpretaría, y la campaña les ha regalado el argumento que llevaban años sin poder sostener. Nada cambia constitucionalmente, el dinero y el capital político han desaparecido, y la cuestión que Westminster intentó cerrar ahora resuena con más fuerza que antes."
 devolution.14.a: "Un error costoso."
