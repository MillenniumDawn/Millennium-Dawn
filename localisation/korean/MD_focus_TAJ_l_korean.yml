 tajik_corruption.1.t: "월간 암시장 물품 수거"
 tajik_corruption.1.d: "이번 달 암시장 물품이 두샨베에 도착한 것으로 보입니다. 정부 관료들이 이 반입 사실을 감추려 하는 가운데, 내각의 많은 인사들은 이 물품으로 국가 내부의 일부 파벌을 달래자고 제안하고 있습니다. 이 물품을 어떻게 처리해야 하겠습니까?"
 tajik_corruption.1.a: "직접 수거한다"
 tajik_corruption.1.b: "군에 넘긴다"
 tajik_corruption.1.c: "올리가르히에게 넘긴다"
 tajik_corruption.1.c1: "농민에게 넘긴다"
 tajik_corruption.1.d1: "소상공인에게 넘긴다"
 tajik_corruption.1.e: "화석 연료 산업에 넘긴다"
 tajik_corruption.1.f: "노동조합에 넘긴다"
 tajik_corruption.1.g: "국제 은행가들에게 넘긴다"
 tajik_corruption.1.h: "산업 재벌에게 넘긴다"
 tajik_corruption.1.i: "군수 산업 조직(MIO)에 넘긴다"
 tajik_corruption.1.j: "울라마에게 넘긴다"
 tajik_corruption.1.k: "쿠드스군에 넘긴다"
 tajik_corruption.1.l: "지주들에게 넘긴다"
 tajik_corruption.1.m: "정보 공동체에 넘긴다"
 tajik_corruption.1.n: "해운 산업에 넘긴다"
 tajik_corruption.2.t: "국가에 침투한 외세의 영향력"
 tajik_corruption.2.d: "암시장이 외세의 영향력이 우리 국가에 스며드는 통로를 열어준 것으로 보입니다. 일부 시민들은 남쪽 국경에서 말을 퍼뜨리는 자들이 퍼뜨린 어리석은 소문을 떠들고 있습니다."
 tajik_corruption.2.a: "알겠다"
 tajik_corruption.3.t: "이슬람주의 팸플릿 확산"
 tajik_corruption.3.d: "암시장은 우리 나라를 지역 및 해외 이슬람주의자들이 가하는 잠재적 위협에 노출시켰으며, 그 가르침을 설파하는 특정 팸플릿이 퍼진 것으로 보입니다."
 tajik_corruption.3.a: "알겠다"
 tajik_corruption.4.t: "반정부 팸플릿 확산"
 tajik_corruption.4.d: "해외 어느 외국 정부가 뿌린 팸플릿이 암시장을 통해 우리 나라에 유입된 것으로 보이며, 도시 중심부보다는 농촌 지역을 중심으로 전반적인 불안을 일으키고 있습니다."
 tajik_corruption.4.a: "알겠다"
 tajik_corruption.5.t: "병사들 사이에 퍼진 해외 마약 중독"
 tajik_corruption.5.d: "마약이 암시장에서 우리 병사들의 막사로 흘러들어, 일부 부대에서 집단 중독을 일으키고 있는 것으로 보입니다."
 tajik_corruption.5.a: "알겠다"
 tajik_corruption.6.t: "도시 중심부를 중독에 빠뜨린 해외 마약"
 tajik_corruption.6.d: "암시장의 마약이 안타깝게도 국민들의 가정까지 흘러들어 일부 동네에서 전반적인 중독을 일으키고 있으며, 이로 인해 노동 의욕이 줄어들고 있습니다."
 tajik_corruption.6.a: "알겠다"
 tajik_corruption.7.t: "암시장과 연결된 테러 공격"
 tajik_corruption.7.d: "우리 도시 중 한 곳에서 발생한 테러 공격이 외국 테러 조직의 소행으로 추적되었다는 보고가 있습니다. 이 조직은 우리가 모르는 사이에 암시장을 통해 테러범들을 우리 도시로 들여보낼 수 있었습니다."
 tajik_corruption.7.a: "알겠다"
 tajik_corruption.8.t: "국고에서 자금 밀반출"
 tajik_corruption.8.d: "국고에서 자금이 빠져나가 암시장을 통해 어딘가로 밀반출되었다는 보고가 있습니다. 이 자금을 되찾을 수 있을지는 알 수 없으나, 주시할 필요가 있습니다."
 tajik_corruption.8.a: "알겠다"
 tajik_corruption.9.t: "국가 관료들의 국가 기밀 매각"
 tajik_corruption.9.d: "내각 일부 인사들은 정부 내 인물들이 암시장을 통해 적에게 국가 기밀을 팔아넘기고 있으며, 이로 인해 국가 기밀이 위험에 처할 수 있다고 주장하고 있습니다."
 tajik_corruption.9.a: "알겠다"
 tajik_corruption.10.t: "운영에 불만을 품은 이익 단체들"
 tajik_corruption.10.d: "국내 이익 단체들은 현재의 상황에 매우 불만을 품고 있으며, 자신들에게 돌아가야 할 자금이 암시장에 쓰이고 있다고 주장하고 있습니다."
 tajik_corruption.10.a: "알겠다"
 tajik_corruption.11.t: "외국 국가 기밀 밀반입"
 tajik_corruption.11.d: "우리는 암시장을 통해 더 발전한 국가들의 국가 기밀을 밀반입할 수 있었습니다. 이를 통해 과학적 진보를 크게 앞당길 수 있습니다."
 tajik_corruption.11.a: "좋군"
 tajik_corruption.12.t: "암시장을 통한 미사일 밀반입"
 tajik_corruption.12.d: "오늘 커다란 트럭이 더 큰 방수포를 덮은 채 두샨베의 정부 시설로 들어왔습니다. 덮개를 벗기자 외국의 미사일이 모습을 드러냈습니다. 우리 인력이 어떻게 이것을 손에 넣었는지는 아직 알 수 없으나, 이제 우리는 적에게 날려 보낼 거대한 금속 로켓을 보유하게 되었습니다."
 tajik_corruption.12.a: "좋군"
 tajik_corruption.13.t: "두샨베로 금 밀반입"
 tajik_corruption.13.d: "밀수업자들이 오늘 발각되지 않고 대량의 금을 두샨베로 들여오는 데 성공하여, 경제적 잉여 면에서 약간의 여유를 확보할 수 있게 되었습니다."
 tajik_corruption.13.a: "좋군"
 tajik_corruption.14.t: "중화기 밀반입"
 tajik_corruption.14.d: "다른 국가의 밀수업자들을 통해 포병 화기와 대전차 미사일이 국경을 넘어 들어왔습니다. 이를 통해 우리 병력에게 절실히 필요한 중화기를 지급할 수 있습니다."
 tajik_corruption.14.a: "좋군"
 tajik_corruption.15.t: "외국 설계도 밀반입"
 tajik_corruption.15.d: "외국 설계도가 암시장을 통해 국내로 밀반입되어, 그렇지 않았다면 효율이 떨어졌을 일상 장비의 설계를 개선할 수 있게 되었습니다."
 tajik_corruption.15.a: "좋군"
 tajik_corruption.16.t: "군사 교리 밀반입"
 tajik_corruption.16.d: "유럽 어딘가의 주요 훈련 학교에서 나온 외국 군사 교리 자료를 밀반입하는 데 성공하여, 우리의 전술을 개선할 수 있게 되었습니다."
 tajik_corruption.16.a: "좋군"
 tajik_corruption.17.t: "농기계 밀반입"
 tajik_corruption.17.d: "암시장을 통해 대형 산업용 농기계를 밀반입하는 데 성공했으며, 이제 마침내 어딘가에 대규모 농장을 건설할 수 있게 되었습니다."
 tajik_corruption.17.a: "건설한다"
 tajik_corruption.17.b: "팔아넘긴다"
 tajik_corruption.18.t: "장교 지침서 밀반입"
 tajik_corruption.18.d: "어느 강대국의 장교 지침서가 밀반입되었으며, 이는 전투, 작전 계획, 군수 분야에서 우리 장군들의 효율을 높이는 데 사용될 것입니다."
 tajik_corruption.18.a: "좋군"
 tajik_corruption.19.t: "위험한 밀수품 차단"
 tajik_corruption.19.d: "우리는 암시장을 통해 위험한 밀수품이 국내로 유입되는 것을 차단하는 데 성공했으며, 이는 수천은 아니더라도 수백 명의 목숨을 구했을 수 있습니다."
 tajik_corruption.19.a: "좋군"
 tajik_corruption.20.t: "타지키스탄의 러시아 시장 마약 유입!"
 tajik_corruption.20.d: "[TAJ.GetFlag] 타지크 정부가 우리에 대한 영향력을 얻는 수단으로 마약이 우리 나라로 흘러드는 것을 공공연히 묵인하고 있다는 의심을 받고 있습니다. 보고에 따르면 [TAJ.GetFlag] [TAJ.GetName]은(는) 자국을 위한 호의를 우리에게서 얻어내기 위해 시간이 지남에 따라 유입되는 마약의 양을 점차 늘릴 계획일 수 있습니다. 무력으로 대응할 수도 있으나, 그럴 경우 타지키스탄은 다른 강대국의 뒤로 숨어 보호를 받으려 할 것입니다."
 tajik_corruption.20.a: "왜?"
 tajik_corruption.21.t: "타지키스탄, 러시아로 유입되는 마약 증가"
 tajik_corruption.21.d: "[TAJ.GetFlag] 타지크 정부는 암시장에서 흘러들던 마약의 양을 늘리기로 결정했습니다. 이 조치는 타지크 정부의 요청을 앞두고 취해진 것으로 예상되며, 이는 다시 압박을 가하기 전에 무언가를 원하고 있을 가능성이 있음을 의미합니다."
 tajik_corruption.21.a: "알겠다"
 tajik_corruption.22.t: "타지키스탄, 국경 경비 강화"
 tajik_corruption.22.d: "타지크 정부는 이제 중앙아시아로, 그리고 우리 나라로 유입되는 마약의 흐름을 강력히 단속하겠다고 맹세했습니다. 덕분에 타지키스탄이 마약 거래를 비장의 카드로 쓰는 일을 걱정하지 않아도 되므로 마침내 한숨 돌릴 수 있습니다."
 tajik_corruption.22.a: "좋군"
 tajik_corruption.23.t: "타지키스탄, 마약 유입 증가 암시"
 tajik_corruption.23.d: "타지크 정부는 국경 통제를 완화할 수 있음을 내비치고 있으며, 이는 더 많은 마약이 러시아로 흘러들도록 허용하겠다는 의미입니다. 위험한 행동에서 나온 위험한 발언입니다. 타지키스탄은 아마도 우리의 희생을 대가로 자국 정부를 위한 혜택을 요구하려는 것으로 보입니다."
 tajik_corruption.23.a: "좋다"
 tajik_corruption.23.b: "아니, 지금은 안 된다"
 tajik_corruption.23.c: "한 번만 더 이러면 어떻게 되는지 알게 될 것이다"
 tajik_corruption.23.c1: "여기까지다"
 tajik_corruption.24.t: "러시아, 경제 지원 제공"
 tajik_corruption.24.d: "러시아 정부는 우리에게 더 많은 경제 지원을 제공하기로 동의했으며, 우리의 절차를 더 효율적이고 비용 효과적으로 만들 수 있도록 지식을 공유할 것입니다."
 tajik_corruption.24.a: "좋아"
 tajik_corruption.25.t: "러시아, 경제 원조 거부"
 tajik_corruption.25.d: "러시아 정부가 우리에 대한 경제 지원 제공을 거부했으며, 이는 우리가 그들을 충분히 압박하지 못했음을 시사합니다."
 tajik_corruption.25.a: "그들이 뭘 어쨌다고?"
 tajik_corruption.26.t: "러시아, 경고 발표"
 tajik_corruption.26.d: "러시아 정부가 경고를 발표했습니다. 마약 반입을 중단하지 않으면 다시는 그런 일이 없도록 '단호한 조치'를 취하겠다는 것입니다."
 tajik_corruption.26.a: "우려스럽군"
 tajik_corruption.27.t: "러시아, 침공 준비"
 tajik_corruption.27.d: "러시아 정부는 더 이상 참을 수 없다고 판단한 듯하며, 우리 영토를 침공하기 위해 러시아군에 공식 동원령을 내렸습니다."
 tajik_corruption.27.a: "좋지 않은 상황이군"
 tajik_corruption.28.t: "러시아의 최후통첩 전달"
 tajik_corruption.28.d: "러시아 정부는 더 이상 러시아 영토로 마약이 흘러들지 않도록 국경 경비를 강화해야 하는 기한을 우리에게 제시했습니다."
 tajik_corruption.28.a: "우려스럽군"
 tajik_corruption.29.t: "타지키스탄, 이행 거부"
 tajik_corruption.29.d: "타지키스탄은 우리가 제시한 조건을 이행하지 않았으며, 우리가 원한다면 곧 그 대가를 치르게 될 것입니다."
 tajik_corruption.29.a: "이제 끝장이다"
 tajik_corruption.29.b: "상관없다"
 tajik_flavor.1.t: "수박에 불만을 품은 [TAJ.GetLeader]"
 tajik_flavor.1.d: "국정의 모든 사안에서 세세한 부분까지 신경 쓰기로 유명한 [TAJ.GetLeader]이(가) 최근 타지키스탄의 수박을 평소보다 면밀히 살펴보는 모습이 목격되었습니다. 현지 시장에서 한 입 베어 문 그는 \\"먼저 내 국경이 줄어들더니, 이제는 내 멜론까지 줄어드는가?\\"라고 중얼거렸다고 합니다. 소식통에 따르면 그는 즉시 이 \\"수박 위기\\"를 조사할 위원회를 구성하라고 명령했으며, 타지키스탄의 멜론조차 완벽할 수 없다면 세상에 무슨 희망이 있겠느냐고 한탄했다고 합니다."
 tajik_flavor.1.a: "주여, 자비를 베푸소서"
 tajik_flavor.2.t: "통합 타지크 야권 재결집"
 tajik_flavor.2.d: "통합 타지크 야권(UTO)은 90년대 타지키스탄 독립 이후 에모말리 라흐모노프와 그의 정부를 상대로 내전을 벌였습니다. 그의 정책과 핵심적인 협상 약속의 폐기는 UTO와 그 핵심 구성원들을 분노하게 했으며, 이들은 재결집하여 에모말리 라흐모노프와 그의 내각의 사임을 요구하고 있습니다. 이 단체가 신중하게 움직이지 않는다면, 평화적 혁명이라는 본래 목표와 달리 국내에서 또 한 번의 내전을 일으킬 위험이 있다는 소문이 돌고 있습니다."
 tajik_flavor.2.a: "흥미롭군"
 tajik_radicalism.1.t: "이슬람부흥당의 우리 사임 요구"
 tajik_radicalism.1.d: "이슬람부흥당 지도자들이 우리 정부의 사임과 \\"올바른 기관\\"으로의 권력 이양을 요구하는 공식 서한을 작성했습니다. 서한에서 그들은 무장을 마치고 대기 중이며 언제든 군대를 동원하여 우리 국가를 전복할 수 있다고 밝혔습니다. 이 급진주의자들에게 어떻게 대응할지는 이제 중앙정부에 달려 있습니다."
 tajik_radicalism.1.a: "어쩌면 때가 된 것인지도..."
 tajik_radicalism.1.b: "저 급진주의자들에게 분수를 알려줄 때다!"
 tajik_radicalism.2.t: "지하 마드라사 출현 시작"
 tajik_radicalism.2.d: "비밀 지하 마드라사에 대한 소문이 정부 내에 돌고 있으며, 앞으로 이들을 어떻게 다뤄야 하는지를 두고 많은 논쟁이 일고 있습니다."
 tajik_radicalism.2.a: "폐쇄하라!"
 tajik_radicalism.2.b: "위협이 되지 않는다"
 tajik_radicalism.3.t: "종교 설교의 정치화"
 tajik_radicalism.3.d: "최근 금요 예배가 점점 더 정치적으로 변하고 있으며, 종교 지도자들이 국가 상황을 논하면서 우리 정부를 부패하고 국가를 운영할 능력이 없는 것으로 묘사하고 있습니다."
 tajik_radicalism.3.a: "체포하라"
 tajik_radicalism.3.b: "위협이 되지 않는다"
 tajik_radicalism.4.t: "모스크 자선 단체 확대"
 tajik_radicalism.4.d: "모스크는 오래전부터 자선 단체를 운영해 왔으나, 최근 들어 그 연결망을 확장하고 있으며 정체불명의 개인들로부터 자금을 받고 있습니다."
 tajik_radicalism.4.a: "그 돈은 정당한 국가 재산이다"
 tajik_radicalism.4.b: "위협이 되지 않는다"
 tajik_radicalism.5.t: "비밀 종교 모임 형성"
 tajik_radicalism.5.d: "최근 비밀 종교 모임이 생겨나기 시작했으며, 사람들이 모여 종교 문제를 논의하고 있습니다. 이 모임 안에서 일부가 정부를 부정적으로 이야기한다는 소문이 있습니다."
 tajik_radicalism.5.a: "조사를 개시한다"
 tajik_radicalism.5.b: "위협이 되지 않는다"
 tajik_radicalism.6.t: "모스크 인근에서 군 인력과의 충돌"
 tajik_radicalism.6.d: "모스크 인근에서 군 인력이 괴롭힘을 당하는 사례가 늘고 있으며, 종교적 광신자들이 우리 병력에게 돌을 던지거나 침을 뱉으며 공격하고 있습니다."
 tajik_radicalism.6.a: "인력에게 더 신중하게 행동하라고 지시한다"
 tajik_radicalism.6.b: "스스로 알아서 하게 둔다"
 tajik_radicalism.7.t: "경찰 대상 공격 증가"
 tajik_radicalism.7.d: "불복종적이고 통제 불능인 현지인들이 경찰을 공격하고 일부 경찰서를 습격하여 전국적으로 사상자를 내고 있습니다. 상황은 통제를 벗어났으며 계속 악화될 것입니다."
 tajik_radicalism.7.a: "경찰을 증강한다"
 tajik_radicalism.7.b: "스스로 알아서 하게 둔다"
 tajik_radicalism.8.t: "정부 순찰에 저항하는 현지인들"
 tajik_radicalism.8.d: "농촌 지역에서 점점 더 많은 현지인들이 차량 진로에 커다란 바위를 놓아 경찰 순찰에 저항하기 시작했습니다. 일각에서는 이것이 정부의 약세를 보여주는 징후이며 국가가 국민에 대한 장악력을 잃고 있다고 말합니다."
 tajik_radicalism.8.a: "국가 선전이 이 모든 것을 해결할 것이다"
 tajik_radicalism.8.b: "그냥 바위를 돌아서 가라"
 tajik_radicalism.9.t: "해외에서 귀환하는 급진 타지크인 증가"
 tajik_radicalism.9.d: "해외에서 돌아오는 급진화된 타지크인이 이례적으로 급증했으며, 정부 내에서는 이들이 위험한 이념을 퍼뜨릴 것이라는 우려가 제기되고 있습니다."
 tajik_radicalism.9.a: "돌려보내라, 우리는 원치 않는다"
 tajik_radicalism.9.b: "위협이 되지 않는다"
 tajik_radicalism.10.t: "정부 호송대 매복 공격"
 tajik_radicalism.10.d: "이슬람부흥당과 연계된 조직의 무장 민병대가 외딴 마을에서 정부 호송대를 매복 공격했다는 보고가 있습니다."
 tajik_radicalism.10.a: "증원한다"
 tajik_radicalism.10.b: "철수한다"
 tajik_radicalism.11.t: "군사기지 피습"
 tajik_radicalism.11.d: "최근 남부 국경 인근 외딴 지역의 군사기지가 광신도들의 공격을 받았다는 보고가 있습니다. 일각에서는 이 민병대가 이슬람부흥당과 연계되어 있을 수 있다고 말합니다."
 tajik_radicalism.11.a: "증원군을 보낸다"
 tajik_radicalism.11.b: "철수한다"
 tajik_radicalism.12.t: "러시아 내 테러 공격"
 tajik_radicalism.12.d: "러시아 국영 매체는 타지크 민병대가 최근 도시 기반시설을 공격하여 주변 지역에 상당한 피해를 입혔다고 보도하고 있습니다. 러시아 정부는 피해자들과 파손된 도시 기반시설 모두에 대한 배상을 요구하고 있습니다."
 tajik_radicalism.12.a: "피해를 보상하겠다"
 tajik_radicalism.12.b: "내 알 바 아니다"
 tajik_radicalism.120.t: "타지크 국적자와 연계된 테러 공격"
 tajik_radicalism.120.d: "타지크 정부는 최근 타지크 국적자가 러시아 영토에서 저지른 공격에 대해 사과하고 그 피해를 보상했습니다. 이 공격으로 도시 기반시설이 파손되고 일부 인명이 희생되었으나, 타지크 정부는 피해와 희생자에 대한 보상을 제안했습니다."
 tajik_radicalism.120.a: "알겠다"
 tajik_radicalism.121.t: "타지크 국적자와 연계된 테러 공격"
 tajik_radicalism.121.d: "국영 매체는 타지크 국적자로 추정되는 테러범들이 우리 도시 중 한 곳에 피해를 입히고 사상자를 냈다고 보도하고 있습니다. 타지크 정부는 어떠한 피해에 대해서도 보상을 거부했으며 \\"희생자들에게 애도를 표한다\\"고만 밝혔습니다."
 tajik_radicalism.121.a: "우리 나라에 슬픈 날이다..."
 tajik_radicalism.14.t: "시장에서 위험한 사상 확산"
 tajik_radicalism.14.d: "전국의 일부 시장에서 몇몇 사람들이 확성기를 통해 정부와 우리 법을 비난하기 시작했습니다. 이들은 종종 상당한 군중을 끌어모으기 때문에 중앙정부 내에 일말의 불안감이 조성되었습니다."
 tajik_radicalism.14.a: "해당 시장을 일시 폐쇄하라!"
 tajik_radicalism.14.b: "위협이 되지 않는다"
 tajik_radicalism.15.t: "새로운 운동의 결성 시작"
 tajik_radicalism.15.d: "타지키스탄 중앙정부가 IRP를 정치 생활에서 배척한 이래, 이 조직의 일부 구성원과 운동 동조자들이 새로운 깃발과 단체 아래 결집하기 시작했습니다. 이들은 호라산 이슬람 국가를 자처하며 우리 정부와 지역 내 다른 정부들을 전복하겠다고 맹세했습니다. 이는 이 조직이 타지키스탄, 아프가니스탄, 이란 및 지역 내 다른 국가들을 겨냥하는 야심을 품고 있음을 의미합니다."
 tajik_radicalism.15.a: "우리가 그들을 짓밟겠다!"
 tajik_radicalism.16.t: "호라산 이슬람 국가, 대규모 공격 개시!"
 tajik_radicalism.16.d: "IS-KP는 국가 북부 소그드 주에 칼리파국을 수립했다고 선언했습니다. 이들은 [TAJ.GetLeader]의 '이단적'이고 '반이슬람적'인 정권을 '전복'하겠다고 주장합니다. 살라피주의 이념과 사상을 억제하려던 우리의 시도가 실패한 끝에 이러한 사태에 이르렀으며, 이제 우리 병력은 우리의 존립 자체를 위협하는 급진주의자들에 대한 공격을 위해 동원되고 있습니다."
 tajik_radicalism.16.a: "병력을 준비시켜라"
 tajik_radicalism.16.b: "때가 왔다"
 iranic_confederation.1.t: "[FROM.GetName]의 이란계 연방 초청"
 iranic_confederation.1.d: "[FROM.GetName]은(는) 최근 우리 정부에 사절단을 보내 이념적 유사성을 이유로 양국 간 이란계 연방을 제안했습니다. 사절단은 다른 이란계 국가들도 연방에 초청하고자 하며, 연방의 지도자는 집단 투표로 결정될 것이라고 밝혔습니다."
 iranic_confederation.1.a: "가입하겠다"
 iranic_confederation.1.b: "우리의 독립에 대한 이 위협을 거부한다!"
 iranic_confederation.2.t: "[FROM.GetName]의 협정 서명"
 iranic_confederation.2.d: "[FROM.GetName]의 대표단은 이란계 연방에 관한 우리의 협정에 기꺼이 서명했으며, 굳건한 악수와 함께 향후 협력에 대한 약속이 오갔습니다."
 iranic_confederation.2.a: "좋아"
 iranic_confederation.3.t: "[FROM.GetName]의 우리 협정 거부"
 iranic_confederation.3.d: "[FROM.GetName]의 대표단은 이념적 근거만으로는 양국의 통합을 정당화할 수 없다는 이유로 우리 외교관들을 돌려보냈습니다. 또한 양국 국민은 '전혀 다르며' 그러한 문화적 통합은 사회적 혼란을 초래할 것이라고 밝혔습니다."
 iranic_confederation.3.a: "언젠가 우리의 통합은 이루어질 것이다..."
 iranic_confederation.4.t: "연방 지도자"
 iranic_confederation.4.d: "이란계 연방의 모든 회원국이 마침내 구심점이 될 지도자를 투표로 선출할 때가 왔습니다. 지도자가 선출되면 모든 회원국은 연방 지도자의 체제에 맞추어 군대, 경제, 법률을 통합하기 시작할 것입니다."
 iranic_confederation.4.a: "이란"
 iranic_confederation.4.b: "아프가니스탄"
 iranic_confederation.4.c: "타지키스탄"
 iranic_confederation.4.e: "쿠르디스탄"
 iranic_confederation.4.f: "남오세티야"
 iranic_confederation.5.t: "연방 지도자 선출 결과"
 iranic_confederation.5.d: "연방의 지도자를 발표할 때가 왔습니다. 일주일간의 투표 끝에 모든 회원국이 표를 던졌으며, 그 결과 승자는..."
 iranic_confederation.5.a: "이란"
 iranic_confederation.5.b: "아프가니스탄"
 iranic_confederation.5.c: "타지키스탄"
 iranic_confederation.5.e: "쿠르디스탄"
 iranic_confederation.5.f: "남오세티야"
 iranic_confederation.6.t: "연방의 중앙집권화"
 iranic_confederation.6.d: "연방 지도자는 법률과 사회의 통합과 더불어, 연방 모든 시민의 회원국 간 자유 이동을 합법화한다고 발표했습니다."
 iranic_confederation.6.a: "알겠다"
 iranic_confederation.7.t: "연방 지도자, 완전 통합 선언"
 iranic_confederation.7.d: "연방 지도자인 [FROM.GetName]은(는) 이란계 연방의 모든 회원국이 이제 [FROM.capital.GetCapitalVictoryPointName](으)로 향하여 '이란계 국가 최고 평의회'에 합류할 것이라고 발표했습니다."
 iranic_confederation.7.a: "더 강한 미래를 향하여!"
 iranic_confederation.8.t: "이란계 협력에 대한 국제기구의 찬사"
 iranic_confederation.8.d: "UN과 같은 국제기구들은 우리가 국가 간 차이를 제쳐두고 분쟁 없이 하나의 깃발 아래 통합한 능력을 높이 평가했습니다."
 iranic_confederation.8.a: "훌륭해!"
 iranic_confederation.9.t: "수도 이전?"
 iranic_confederation.9.d: "우리 국가들의 통합 이후 이란계 국가 최고 평의회는 국가 내 모든 시민의 접근성을 높이기 위해 수도를 더 중앙에 가까운 곳으로 이전하는 안을 제기했습니다."
 iranic_confederation.9.a: "이스파한으로 옮긴다"
 iranic_confederation.9.b: "헤라트로 옮긴다"
 iranic_confederation.9.c: "현재 위치를 유지한다"
 iranic_confederation.10.t: "[FROM.GetName]의 군사 행동 위협"
 iranic_confederation.10.d: "[FROM.GetName]은(는) 우리가 발루치스탄 지역의 보유지를 즉시 포기하지 않으면 군사 행동에 나서겠다고 우리 정부를 위협했습니다. 그들의 정부는 그토록 원하는 땅을 차지하기 위해 가용한 모든 무력을 사용하겠다고 맹세했습니다."
 iranic_confederation.10.a: "허세를 간파한다"
 iranic_confederation.10.b: "좋다, 협상을 시작한다"
 iranic_confederation.11.t: "[FROM.GetName]의 우리 요구 일축"
 iranic_confederation.11.d: "[FROM.GetName]은(는) 어떤 상황에서도 발루치스탄 지역을 내놓지 않겠다고 밝혔으며, 이는 우리의 정당한 영토를 되찾으려면 무력에 의존해야 함을 의미합니다."
 iranic_confederation.11.a: "병력을 동원하라"
 iranic_confederation.12.t: "[FROM.GetName]의 협상 개시 동의"
 iranic_confederation.12.d: "[FROM.GetName]은(는) 발루치스탄에 대한 우리의 정당한 영유권을 인정하는 데 동의했으며, 해당 지역의 행정 직책을 우리에게 이양하는 데에도 동의했습니다."
 iranic_confederation.12.a: "좋군"
 iranic_confederation.15.t: "[FROM.GetName]의 군사 행동 위협"
 iranic_confederation.15.d: "[FROM.GetName]은(는) 우리가 쿠르디스탄 지역의 보유지를 즉시 포기하지 않으면 군사 행동에 나서겠다고 우리 정부를 위협했습니다. 그들의 정부는 그토록 원하는 땅을 차지하기 위해 가용한 모든 무력을 사용하겠다고 맹세했습니다."
 iranic_confederation.15.a: "허세를 간파한다"
 iranic_confederation.15.b: "좋다, 협상을 시작한다"
 iranic_confederation.16.t: "[FROM.GetName]의 우리 요구 일축"
 iranic_confederation.16.d: "[FROM.GetName]은(는) 어떤 상황에서도 쿠르디스탄 지역을 내놓지 않겠다고 밝혔으며, 이는 우리의 정당한 영토를 되찾으려면 무력에 의존해야 함을 의미합니다."
 iranic_confederation.16.a: "병력을 동원하라"
 iranic_confederation.17.t: "[FROM.GetName]의 협상 개시 동의"
 iranic_confederation.17.d: "[FROM.GetName]은(는) 쿠르디스탄 지역에 대한 우리의 정당한 영유권을 인정하는 데 동의했으며, 해당 지역의 행정 직책을 우리에게 이양하는 데에도 동의했습니다."
 iranic_confederation.17.a: "좋군"
 iranic_confederation.18.t: "[FROM.GetName]의 우리 협력 요구"
 iranic_confederation.18.d: "새로 수립된 [FROM.GetName]은(는) 지역에 '새롭고 통합되고 강력한' 국가를 수립하는 데 우리 정부의 협력을 요구하고 있습니다. 이는 우리 내각의 사임과 정부의 그들 당국으로의 이양을 의미합니다."
 iranic_confederation.18.a: "아니요"
 iranic_confederation.18.b: "선택의 여지가 없다..."
 iranic_confederation.19.t: "[FROM.GetName]의 우리 제안 거부"
 iranic_confederation.19.d: "[FROM.GetName]의 정부는 평화와 안정도를 개인적 야망보다 중시하지 않는 것이 분명하며, 우리는 그들을 무력으로 우리 휘하에 두어야 합니다."
 iranic_confederation.19.a: "병력을 동원하라"
 iranic_confederation.20.t: "[FROM.GetName]의 우리 당국 권력 이양"
 iranic_confederation.20.d: "[FROM.GetName]은(는) 자국 내 정부 직책을 최근 수립된 범이란주의 당국과 정당들에 이양하는 데 동의했으며, 이는 평화와 안정도를 개인적 야망보다 우선시했음을 분명히 보여줍니다."
 iranic_confederation.20.a: "좋아"
 tajik_focus.1.t: "복장 규정"
 tajik_focus.1.d: "우리 나라에는 남성과 여성이 입을 수 있는 것과 없는 것을 규정하는 엄격한 복장 규정의 역사가 있습니다. 우리 정부는 결국 우리 자신에게 이득이 되도록 이러한 규정 중 일부를 바꾸는 방안을 검토해 왔습니다. 그러나 보다 보수적인 지역의 일부 사람들은 법을 바꾸면 짐을 싸서 다른 나라로 이주하겠다고 위협하고 있습니다."
 tajik_focus.1.a: "법의 자유화가 필요하다"
 tajik_focus.1.b: "규제를 강화하라!"
 tajik_focus.2.t: "타지키스탄의 TAJ 조약 초청"
 tajik_focus.2.d: "TAJ 조약, 즉 테헤란-아프샤르 공동 조약은 타지크 정부가 우리에게 가입을 권유하는 군사 동맹으로, 지역 안보와 안정을 향한 여정에 함께하자는 제안입니다."
 tajik_focus.2.b: "가입하겠다"
 tajik_focus.2.a: "아니요"
 tajik_focus.3.t: "[FROM.GetName]의 우리 초청 거절"
 tajik_focus.3.d: "[FROM.GetAdjective] 정부는 현재 가진 것을 버릴 실질적인 필요성이 없다고 판단하여 TAJ 조약에 가입하지 않는 것이 자국에 최선이라고 결정했습니다."
 tajik_focus.3.a: "알겠다"
 tajik_focus.4.t: "타지크 정부의 투자 요청"
 tajik_focus.4.d: "타지키스탄의 새 정부는 세계에 문호를 개방하는 수단으로 우리 및 다른 걸프 국가들과의 관계를 강화하려 하고 있습니다. 이들은 우리의 지원을 통해 경제를 개선하고자 합니다."
 tajik_focus.4.a: "알겠다"
 tajik_focus.4.b: "아니요"
 tajik_focus.5.t: "[FROM.GetName]의 투자 결정"
 tajik_focus.5.d: "[FROM.GetName]의 정부는 우리 나라에 투자하기로 결정했으며, 자신들의 경제 전문 지식을 통해 우리 경제의 개선을 돕게 됩니다."
 tajik_focus.5.a: "훌륭해!"
 tajik_focus.6.t: "[FROM.GetName]의 투자 거부"
 tajik_focus.6.d: "[FROM.GetName]은(는) 우리 정부에 투자하기를 거부했으며, 우리가 그들의 투자를 지켜낼 만큼 신뢰할 수 없다는 점을 이유로 들었습니다."
 tajik_focus.6.a: "유감이군"
 tajik_focus.7.t: "타지키스탄의 의료 지원 요청"
 tajik_focus.7.d: "타지크 정부는 죽어가는 지도자 [TAJ.GetLeader]을(를) 위한 의료 지원을 요청하며 우리 정부에 연락해 왔습니다. 이들은 우리의 앞선 의료 기술 덕분에 병든 자국 지도자를 구할 수 있는 나라는 우리뿐이라고 말하고 있습니다."
 tajik_focus.7.a: "알겠다"
 tajik_focus.7.b: "아니요"
 tajik_focus.8.t: "[FROM.GetName]의 의료 인력 파견"
 tajik_focus.8.d: "[USA.GetAdjective] 정부가 의료 인력을 파견했으며, 이들은 현재 [TAJ.GetLeader]의 상태를 호전시키기 위해 치료하고 있습니다. 그들은 그가 회복 중이라고 밝히고 있습니다."
 tajik_focus.8.a: "좋아"
 tajik_focus.9.t: "[FROM.GetName]의 의료 지원 거부"
 tajik_focus.9.d: "[FROM.GetAdjective] 정부는 병든 우리 지도자를 치료할 의료 인력의 파견을 거부했으며, 이는 그들의 이기심과 탐욕에 끝이 없음을 보여줍니다."
 tajik_focus.9.a: "세상의 냉혹한 현실이다..."
 tajik_focus.10.t: "누리 사망!"
 tajik_focus.10.d: "오늘 아침 우리의 지도자 사이드 압둘로 누리가 암으로 인한 합병증으로 사망했다고 발표되었습니다. 많은 이들이 다음 지도자가 누가 될지 궁금해하고 있으나, 누리는 이미 무히딘 카비리를 후계자로 지명해 두었습니다."
 tajik_focus.10.a: "애도를 표한다"
 tajik_focus.11.t: "타지키스탄의 저항의 축 가입 요청"
 tajik_focus.11.d: "타지크 정부는 역사의 올바른 편에 서기로 결정했습니다. 이들은 제국주의 세력과 우리 국가의 적들에 맞선 저항의 기치를 들기로 선택했습니다."
 tajik_focus.11.a: "환영한다"
 tajik_focus.11.b: "절대 안 된다"
 tajik_focus.12.t: "타지키스탄의 중앙아시아 안보 연합 초청"
 tajik_focus.12.d: "타지크 정부는 우리를 중앙아시아 안보 연합에 초청했습니다. 이는 지역이 어떤 형태의 혼란이나 분쟁으로도 폭발하지 않도록 보장하는 새로운 안보 조약입니다."
 tajik_focus.12.a: "알겠다"
 tajik_focus.12.b: "끔찍한 발상이다"
 tajik_focus.14.t: "[FROM.GetName]의 조약 서명!"
 tajik_focus.14.d: "[FROM.GetName]의 정부는 우리 지역의 평화와 안정을 실제로 원한다고 판단하여 우리의 조약에 서명하기로 결정했습니다."
 tajik_focus.14.a: "훌륭해!"
 tajik_focus.15.t: "[FROM.GetName]의 조약 서명 거부!"
 tajik_focus.15.d: "[FROM.GetName]은(는) 우리의 조약에 서명하기를 거부했으며, 이는 우리 정부를 의심의 눈초리로, 어쩌면 시기의 눈으로 바라보고 있음을 암시합니다."
 tajik_focus.15.a: "우려스럽군"
 tajik_focus.16.t: "관계 강화를 원하는 타지크 정부"
 tajik_focus.16.d: "타지키스탄의 새 정부는 우리가 공식적으로 관계를 강화해 줄 것을 요청하고 있으며, 그 방법으로 자국 경제에 투자하는 것을 제안합니다. 타지크 정부는 이념적으로 우리와 크게 다르지만, 이념과 달리 외교 정책은 친서방 외교를 선호하는 것으로 보이며 이는 그들을 러시아의 영향권에서 멀어지게 합니다."
 tajik_focus.16.a: "물론이지"
 tajik_focus.16.b: "아니요"
 tajik_focus.17.t: "미국 정부의 협력 수용!"
 tajik_focus.17.d: "미국 정부는 우리 정부와 우리의 자결권 및 성장에 전폭적인 지지를 표명했습니다. 이들은 정치적, 경제적, 나아가 군사적 지원에 이르기까지 다양한 투자 방안을 제안했습니다."
 tajik_focus.17.a: "산업"
 tajik_focus.17.b: "경제"
 tajik_focus.17.c: "정치"
 tajik_focus.18.t: "미국 정부의 협력 거부"
 tajik_focus.18.d: "과거의 이념적 경계가 여전히 미국 정부가 우리를 친구로 인정하지 못하게 가로막고 있는 듯합니다."
 tajik_focus.18.a: "매우 유감이군"
 tajik_focus.19.t: "우리 시각의 변화?"
 tajik_focus.19.d: "우리 당과 그 이념 성향을 두고 많은 논의가 있었습니다. 많은 이들은 여전히 완전한 공산주의와 동방 노선에 강하게 매달려 있습니다. 그러나 더 많은 이들은 수백 년에 걸친 우리 국가와 국민에 대한 식민주의적, 제국주의적 착취의 결과로 보다 비동맹적인 세계관을 지향해야 한다고 주장하고 있습니다."
 tajik_focus.19.a: "우리는 방식을 바꿔야 한다"
 tajik_focus.19.b: "안 된다! 변화는 우리의 파멸을 부를 것이다"
 tajik_focus.20.t: "타지키스탄, 공격적 국유화 추진"
 tajik_focus.20.d: "타지크 정부는 우리 자산을 포함한 대부분의 외국 자산을 압류하고 정부 재산으로 선언하는 공격적인 국유화 정책을 추진했습니다. 모든 것이 압류된 것은 아니지만, 현지의 우리 해외 노동자 상당수가 모든 것을 잃고 어쩔 수 없이 귀국하게 되었습니다."
 tajik_focus.20.a: "상관없다"
 tajik_focus.20.b: "제재하라!"
 tajik_focus.21.t: "[FROM.GetName]의 금수 조치 명령!"
 tajik_focus.21.d: "[FROM.GetName]의 정부는 우리 나라에 금수 조치를 시행하여 우리와의 모든 경제적 관계를 끊도록 명령했습니다. 그들은 우리의 '불법 압류'가 주요 원인 중 하나라고 밝혔습니다."
 tajik_focus.21.a: "유감이군"
 tajik_focus.22.t: "타지키스탄의 화해 모색"
 tajik_focus.22.d: "타지크 정부가 우리 정부에 연락해 더 나은 관계와 화해를 모색하고 있습니다."
 tajik_focus.22.a: "아니요"
 tajik_focus.22.b: "알겠다"
 tajik_focus.23.t: "우리를 무시하는 [FROM.GetName]"
 tajik_focus.23.d: "탈레반 정부는 평화와 안전 보장에 대한 우리의 요청을 무시하기로 결정했습니다."
 tajik_focus.23.a: "이런, 아무튼"
 tajik_focus.24.t: "서기장"
 tajik_focus.24.d: "우리 당의 서기장은 당내 아무에게나 맡겨서는 안 되는 중요한 직책입니다. 우리는 국가를 통치하고 영광으로 이끌 만한 능력과 자질을 갖췄다고 판단되는 인물에게 서기장직을 신중하게 맡겨야 합니다."
 tajik_focus.24.a: "샤디가 능력을 입증했다"
 tajik_focus.24.b: "압둘로예프를 임명한다"
 tajik_focus.24.c: "탈바코프를 임명한다"
 tajik_focus.25.t: "UTO 지도부"
 tajik_focus.25.d: "통합 타지크 야권이 다시 한번 번영하려면, 억압적인 정권에 맞설 구심점이 될 인물을 세우는 데 하나로 뭉쳐야 합니다. 단결에 실패한다면 우리는 무너질 것입니다."
 tajik_focus.25.a: "IRP가 우리를 이끌 것이다"
 tajik_focus.25.b: "민주당이 승리를 확보할 것이다"
 tajik_focus.25.c: "경험 있는 인물이 필요하다, 공산주의자들을 불러라!"
 tajik_focus.26.t: "궁전 습격"
 tajik_focus.26.d: "라흐모노프의 궁전은 그의 억압으로부터 자유를 얻기 위한 투쟁의 쟁점이 되어 왔습니다. 수 주 동안 UTO는 라흐모노프를 제거하기 위해 궁전에 총공격을 감행할지를 두고 논쟁해 왔습니다. 그가 더 이상 권좌에 없다면 중앙정부는 스스로 붕괴할 것입니다."
 tajik_focus.26.a: "궁전을 포격하라!"
 tajik_focus.26.b: "기갑 사단을 투입한다"
 tajik_focus.26.c: "최정예 인원을 직접 선발한다"
 tajik_focus.27.t: "라흐모노프 도주"
 tajik_focus.27.d: "라흐모노프는 궁전에 대한 우리의 최근 공격에서 탈출하는 데 성공했으며, 오늘 아침 일찍 개인 전용기에 몰래 태워져 모스크바로 날아간 것으로 보고되었습니다."
 tajik_focus.27.a: "겁쟁이"
 tajik_focus.28.t: "라흐모노프 사망"
 tajik_focus.28.d: "오늘 라흐모노프의 아들 루스탐 에모말리가 나와 TV 연설로 국민에게 말했습니다. '맨손으로 이 나라를 일으킨 나의 아버지께서... 배신자들의 손에 살해당하셨습니다.' 그의 연설은 한 시대, 즉 라흐모노프와 그의 과두 독재의 시대가 끝났음을 알렸습니다. 투쟁은 아직 끝나지 않았으나 이는 커다란 승리입니다."
 tajik_focus.28.a: "혁명 만세!"
 tajik_focus.29.t: "타지크 혁명"
 tajik_focus.29.d: "정권을 전복할 때가 왔으며, 이번에는 우리의 약속을 끝까지 이행할 것입니다. 우리 병력이 전장에서 한 명도 남김없이 죽는 한이 있더라도 끝까지 싸울 것입니다. 에모말리의 측근들이 우리의 위대한 나라를 통치하도록 둘 수는 없습니다. 우리는 우리의 미래를 위해 싸울 것입니다!"
 tajik_focus.29.a: "전진!"
 tajik_focus.30.t: "혁명의 승리!"
 tajik_focus.30.d: "우리 병력은 전국의 도시들을 승리의 행진으로 누볐습니다. 승리를 선언하며 모든 거리, 상점, 가정, 사무실에 자유의 깃발을 올렸습니다. 우리의 승리는 지역 전체에 충격파를 일으켰으며, 여전히 이 지역을 통치하는 모든 부패한 독재자들에게 그들의 시대 또한 끝날 수 있다는 엄중한 무력 시위가 되었습니다."
 tajik_focus.30.a: "혁명 만세!"
 tajik_focus.280.t: "UTO의 요구"
 tajik_focus.280.d: "내전 중에 우리는 더 많은 지원을 얻기 위해 UTO에 양보하기로 했습니다. 이제 그들이 [TAJ.GetLeader]의 집무실로 곧장 찾아와 요구 사항을 충족시켜 달라고 요구하고 있습니다. 그들이 문제를 일으키기 전까지 요구를 들어줄 수 있는 시간이 일정 기간 주어질 것입니다."
 tajik_focus.280.a: "알겠다"
 tajik_focus.281.t: "CSTO"
 tajik_focus.281.d: "내전 이후 우리는 CSTO 동맹에서 축출되었습니다. 그 이후로 정부 일각에서는 동맹에 재가입하자는 의견이 나오고 있습니다. 그렇게 해야 하겠습니까?"
 tajik_focus.281.a: "우리에게 최선의 이익이다"
 tajik_focus.281.b: "아니다, 우리의 목표를 방해한다"
 tajik_focus.282.t: "지하디스트 야망의 종말"
 tajik_focus.282.d: "수년간 극단주의와 이슬람주의에 맞서 싸운 끝에, 우리는 마침내 이러한 외래 사상을 우리 나라에서 몰아내는 데 성공했습니다. 이제 회복할 때가 왔으며, 우리 나라 안에서 누구도 우리를 석기시대로 되돌리려 하지 않는다는 사실을 알고 마침내 안심할 수 있습니다."
 tajik_focus.282.a: "잘했습니다, [TAJ.GetLeader]"
 tajik_focus.283.t: "타지크-[KYR.GetAdjective] 분쟁 개시"
 tajik_focus.283.d: "타지크 정부는 자국 부대에 [KYR.GetName]의 국경 마을 점령을 준비하라는 명령을 내렸습니다. 이 분쟁이 걷잡을 수 없이 확대될 수 있다는 우려가 있어 세계적으로 일부 우려를 낳고 있습니다."
 tajik_focus.283.a: "어떻게 되는지 지켜보자"
 tajik_focus.31.t: "자기 사람 잡아먹기"
 tajik_focus.31.d: "우리 정부는 체제 안에 뿌리내린 올리가르히들을 활용하여, 그렇지 않았다면 접근할 수 없었을 이득을 얻을 수 있습니다. 정부의 부패한 부문을 이용해 '그들이 빚진 것'을 우리에게 지불하게 할 수 있습니다. 이 부유한 타지크인들은 '신타지크인'이라 불리며 자신들의 부를 공개적으로 거의 거론하지 않습니다. 이들 각자에 대한 정보를 캐내어 체포와 이후의 자산 압류를 정당화할 수 있습니다."
 tajik_focus.31.a: "호지 악바르 투라존조다의 재산"
 tajik_focus.31.b: "보보존 보보호노프의 재산"
 tajik_focus.31.c: "가푸르 미르조예프의 재산"
 tajik_focus.31.d1: "그들의 돈은 필요 없다!"
 tajik_focus.32.t: "타지키스탄을 이끄는 강력한 손"
 tajik_focus.32.d: "소련 붕괴 이후 타지크 내전이 일으킨 혼란 속에서 [TAJ.GetLeader]은(는) 1992년에 최고회의 의장으로 지도자의 자리에 올랐습니다. 1997년에는 중재를 통해 평화를 이끌어내 수년간의 분쟁을 끝냈습니다. 이제 확고히 권력을 쥔 라흐몬은 자신의 미래를 통제하기 위해 야권을 제쳐두고 통치를 공고히 해야 합니다."
 tajik_focus.32.a: "흥미롭군"
 tajik_focus.33.t: "마음의 평화와 그 방법..."
 tajik_focus.33.d: "라흐몬에게는 모든 스트레스를 식힐 무언가가 필요합니다. 그를 쇼핑에 데려가고, 어쩌면 식사까지 대접해야 할 것입니다..."
 tajik_focus.33.a: "모스크바 접대"
 tajik_focus.33.b: "직접 식사를 준비한다"
 tajik_focus.34.t: "대규모 금지령 개시"
 tajik_focus.35.t: "타지키스탄의 노획 미국 무기 요청"
 tajik_focus.35.d: "타지크 정부가 노획한 미국 무기를 요청하며 연락해 왔습니다. 그 대가로 값을 치를 용의가 있다고 합니다."
 tajik_focus.35.a: "돈이 필요하다"
 tajik_focus.35.b: "아니요"
 tajik_focus.36.t: "탈레반의 미국 무기 밀반입"
 tajik_focus.36.d: "탈레반은 우리의 요청을 받아들여 노획한 미국 군사 장비를 밀반입하기 시작했으며, 이는 우리 군의 보급선을 보충하는 데 도움이 됩니다."
 tajik_focus.36.a: "미국인들이 눈치채지 못하길 바라자"
 tajik_focus.37.t: "우리를 무시하는 탈레반!"
 tajik_focus.37.d: "탈레반은 우리를 무시하기로 결정하고, 대신 등에 '미국 험비'라고 적힌 쪽지를 붙인 당나귀 한 마리만 국경 너머로 보냈습니다."
 tajik_focus.37.a: "이게 대체 뭐야?"
 tajik_focus.38.t: "타지키스탄의 사리콜 산맥 양도!"
 tajik_focus.38.d: "타지크 정부는 우리가 이웃이 된 날부터 분쟁만 가득했던 사리콜 산맥을 우리 통제 하에 양도하기로 결정했습니다."
 tajik_focus.38.a: "좋아"
 tajik_focus.39.t: "타지키스탄의 무기 판매 요청"
 tajik_focus.39.d: "타지크 정부가 우리에게 무기를 판매해 달라고 요청했습니다. 최근 그들은 사리콜 산맥을 우리에게 양도하여 협상에 매우 적극적임을 보여주었습니다. 그들에게 약간의 호의를 보여주는 것도 좋지 않겠습니까?"
 tajik_focus.39.a: "알겠다"
 tajik_focus.39.b: "아니요"
 tajik_focus.40.t: "중국의 수락"
 tajik_focus.40.d: "중국 정부는 우리가 최근 사리콜 산맥을 중국의 통제로 이양한 데 대한 호의의 표시로 우리가 요청한 무기를 판매하는 데 동의했습니다."
 tajik_focus.40.a: "중국 보병 장비"
 tajik_focus.40.b: "중국 기갑 장비"
 tajik_focus.40.c: "중국 항공기"
 tajik_focus.41.t: "중국의 거절"
 tajik_focus.41.d: "사리콜 산맥을 내주는 등 우리가 가진 모든 것을 내놓았음에도 불구하고, 중국 정부는 뻔뻔하게도 무기 요청을 거절했습니다. 이는 그들에게 예의라곤 전혀 없음을 보여주는 것이므로 우리 정부의 많은 사람들이 이 조치에 분노하고 있습니다."
 tajik_focus.41.a: "왜?"
 tajik_focus.42.t: "최근 투자 급증"
 tajik_focus.42.d: "우리의 반부패 개혁 덕분에 전 세계 많은 투자자들이 타지크 경제에 지분을 갖기로 결정했습니다. 경제가 크게 개선될 것으로 전망되는 만큼, 이 지역에 대한 더 큰 경제적 영향력을 기대할 수 있습니다."
 tajik_focus.42.a: "훌륭해!"
 tajik_focus.43.t: "제201군사기지 임대"
 tajik_focus.43.d: "러시아는 우리가 기억하는 한 러시아군 제201소총병사단이 주둔해 온 제201군사기지를 임대해 왔습니다. 그러나 이 임대 조건은 협상 가능하며, 어쨌든 그들은 우리 땅에 있습니다. 러시아가 계속 둘 만한 가치가 있는지, 아니면 더 많은 돈을 낼 의향이 있는 다른 이에게 이 부지를 넘길지 살펴볼 수 있습니다."
 tajik_focus.43.a: "러시아가 무엇을 제안하는지 보자"
 tajik_focus.43.b: "러시아에게 가치 있는 것이 있다고 확신할 수 없다"
 tajik_focus.44.t: "타지키스탄의 양보 요구"
 tajik_focus.44.d: "타지크 정부는 그 어느 때보다 제201군사기지 임대 문제를 주시하고 있습니다. 타지크 정부가 우리 땅에 머물게 해 준 변함없는 관대함의 대가로 우리가 '기여할 만한 것이 있는지' 묻자 경고음이 울렸습니다. 어쩌면 타지크 정부는 계속 머물고 싶다면 무언가를 내놓아야 한다고 암시하는 것인지도 모릅니다..."
 tajik_focus.44.a: "좋다, 알겠다"
 tajik_focus.44.b: "아니요"
 tajik_focus.45.t: "러시아 정부의 양보 제안"
 tajik_focus.45.d: "러시아는 눈치가 있어 호의의 표시로 우리에게 일부 투자를 하기로 한 것으로 보입니다. 그래도 우리는 여전히 그들이 기지를 계속 쓰지 못하게 할 수 있습니다. 우리가 공식적으로 무언가를 요구한 적은 없으니까요."
 tajik_focus.45.a: "좋군"
 tajik_focus.46.t: "꿈쩍도 하지 않는 러시아 정부"
 tajik_focus.46.d: "러시아 정부는 우리의 모든 관대함에 대한 대가로 무언가를 원한다는 우리의 암시를 알아차리지 못했으며, 대신 '기지에 감사한다, 오랜 친구여'라고 적힌 공식 서한을 보내왔습니다."
 tajik_focus.46.a: "오랜 친구? 두고 보자"
 tajik_focus.47.t: "타지키스탄의 우리 대의 배신!"
 tajik_focus.47.d: "타지크 정부가 원하는 바를 정확히 내주었음에도 불구하고, 그들은 우리와 우리의 약속을 기어이 배신하기로 했습니다. 친절은 아무 소용이 없었던 것으로 보이며, 가까운 시일 내에 더 과감한 조치를 취해야 할 것입니다..."
 tajik_focus.47.a: "우리는 이를 잊지 않을 것이다"
 tajik_focus.48.t: "타지키스탄의 제201기지 임대 취소!"
 tajik_focus.48.d: "타지크 정부는 최근 제201기지를 우리 정부에 더 이상 임대하지 않기로 결정했습니다. 그들은 조건을 협상하는 대신 우리를 기지에서 완전히 쫓아내는 쪽을 택했습니다. 정부 내에서는 적절한 시기에 타지크 정부와 그 지도자 [TAJ.GetLeader]을(를) 축출할 계획을 세우자는 목소리가 나오고 있습니다."
 tajik_focus.48.a: "우리는 복수할 것이다"
 tajik_focus.49.t: "이제 어떻게 할 것인가?"
 tajik_focus.49.d: "건국 이래 러시아가 우리 나라에 주둔시켜 온 제201군사기지에 대해 보다 유리한 조건을 협상할 때가 왔습니다. 협상 없이 러시아군이 계속 머물게 둔다면 우리는 사실상 우리의 권리를 포기하는 셈입니다. 그러나 우리는 해외로 눈을 돌려... 필요한 만큼 지불할 용의가 있는 다른 나라를 찾을 수도 있습니다."
 tajik_focus.49.a: "러시아와의 계약을 다시 쓴다"
 tajik_focus.49.b: "미국 친구들에게 접촉한다"
 tajik_focus.49.c: "중국 친구들에게 접촉한다"
 tajik_focus.49.d1: "인도 친구들에게 접촉한다"
 tajik_focus.50.t: "타지키스탄의 흥미로운 제안"
 tajik_focus.50.d: "타지크 정부가 흥미로운 제안을 가지고 우리를 찾아왔습니다. 그들은 두샨베의 제201기지에 대한 '개선'을 요청하고 있습니다. 이 제안을 받아들이면 타지키스탄의 경제적 입지가 개선될 뿐만 아니라 이 지역에서 우리의 발판도 강화됩니다."
 tajik_focus.50.a: "놓칠 수 없는 제안이다"
 tajik_focus.50.b: "끔찍한 발상이다, 엮이고 싶지 않다"
 tajik_focus.51.t: "[FROM.GetName]의 우리 제안 수락"
 tajik_focus.51.d: "[FROM.GetName]은(는) 기지에 대한 우리의 제안을 받아들이는 것이 자국의 최선의 이익이라고 판단했습니다."
 tajik_focus.51.a: "좋은 선택이다, [FROM.GetName]"
 tajik_focus.52.t: "[FROM.GetName]의 제201기지 인수"
 tajik_focus.52.d: "[FROM.GetName]의 도둑들이 우리 군이 정당하게 주둔해 온 제201기지를 인수하기로 결정했습니다. 또한 우리와 상의도 없이 병력을 철수할 한정된 시간만을 준 저 배신자 타지크인들도 잊어서는 안 됩니다!"
 tajik_focus.52.a: "대체 무슨 짓이냐, [FROM.GetName]?"
 tajik_focus.53.t: "우리의 몫"
 tajik_focus.53.d: "가족 사업은 순조롭게 진행되고 있는 것으로 보입니다. 우리의 투자는 크게 결실을 맺고 있으며, 두샨베와 소그드 전역에서 새로운 공장들이 생겨나고 있습니다. 그러나 이 산업 기반은 라흐몬 일가가 통제하는 것이 아니라 민간 소유 기업 운동의 일부입니다. 우리는 파이 전체를 한꺼번에 가질 수도 있고, 조금씩 차지해 나갈 수도 있습니다."
 tajik_focus.53.a: "전부 원한다, 지금 당장"
 tajik_focus.53.b: "서두를 필요는 없다"
 tajik_focus.54.t: "타지키스탄의 CSTO 확대 촉구"
 tajik_focus.54.d: "타지크 정부는 CSTO를 확대하여 중앙아시아의 더 넓은 지역을 포괄하도록 우리에게 요청하고 있습니다. 이들은 동맹의 영향력 있는 회원국임을 입증하기 위해 투르크메니스탄과 우즈베키스탄에 초청장을 보내줄 것을 요청하고 있습니다."
 tajik_focus.54.a: "좋은 생각이다"
 tajik_focus.54.b: "분수를 넘지 마라, 타지키스탄"
 tajik_focus.55.t: "CSTO 초청"
 tajik_focus.55.d: "러시아는 CSTO 동맹에 초청장을 보냈습니다. 이는 대부분 타지크의 요청 때문으로, 그들이 러시아 정부에 우리 나라에 초청장을 보내도록 압박했기 때문입니다."
 tajik_focus.55.a: "알겠다"
 tajik_focus.55.b: "아니요"
 tajik_focus.56.t: "우리의 공통 이익"
 tajik_focus.56.d: "현재 우리는 나라의 탈러시아화를 위해 노력하며 보다 독자적인 정체성을 향해 나아가고 있습니다. 그러나 노력을 두 배로 기울일 수 있습니다. 타지키스탄 민주당을 흡수하면 그들의 핵심 지도부와 당원들을 활용하여 국가 정체성을 형성하기 위한 보다 이란계 중심의 의제를 추진할 수 있습니다."
 tajik_focus.56.a: "합병을 진행한다"
 tajik_focus.56.b: "통합을 제한하자"
 tajik_focus.56.c: "끔찍한 발상이다. 안 된다"
 tajik_focus.57.t: "반대의 목소리: 우마랄리 쿠바토프"
 tajik_focus.57.d: "그룹 24의 활동 구성원인 우마랄리 쿠바토프가 튀르키예 망명지에서 활동 수위를 높이고 있습니다. 우리 정부는 일련의 선택지를 제시했으며, 그중 하나는 우마랄리를 영구히 침묵시키는 것입니다. 그러한 방식으로 그를 처리하기로 한다면 역풍을 맞아 국내외로부터 더 많은 의혹의 시선을 받게 될 가능성이 있습니다."
 tajik_focus.57.a: "명령을 내려 그를 제거한다"
 tajik_focus.57.b: "자원을 다른 곳에 쓰는 편이 낫다"
 tajik_focus.58.t: "우마랄리 쿠바토프, 이스탄불에서 숨진 채 발견"
 tajik_focus.58.d: "튀르키예 언론은 우마랄리 쿠바토프가 이스탄불 파티흐 구의 한 식당에서 숨진 채 발견되었다고 보도하고 있습니다. 타지크 출신 3명이 체포되었으나 타지크 정부와의 연관성은 밝혀지지 않았습니다. 우마랄리는 수년간 골칫거리였으며, 이슬람부흥당(IRP)과 연계된 '그룹 24' 조직으로 우리 정부에 맞선 야권 운동을 조직해 왔습니다."
 tajik_focus.58.a: "골칫거리가 하나 줄었다"
 tajik_focus.59.t: "암살 시도에서 살아남은 우마랄리 쿠바토프"
 tajik_focus.59.d: "우마랄리 쿠바토프는 머리를 겨냥한 총격을 간발의 차로 피했습니다. 뒤에서 소리가 나자 무엇인지 확인하려 재빨리 움직였고, 이에 놀란 암살 미수범이 총을 빗맞혔다고 합니다. 이후 범인의 총이 막혔고, 식당에 있던 사람들이 총격범을 덮쳐 경찰이 올 때까지 제압했다고 합니다. 우마랄리에 대한 이 암살 시도는 타지크 당국의 소행으로 지목되고 있으며, 튀르키예 정부와 다른 나라들이 이 시도를 규탄하고 있습니다."
 tajik_focus.59.a: "젠장, 아무도 아무 말도 하지 마라"
 tajik_focus.60.t: "우리의 새로운 행정 수도"
 tajik_focus.60.d: "중앙아시아 국가 연방의 창설 이후 우리는 통치를 공고히 하고 정당성을 확보할 수 있었습니다. 그러나 새로운 국가를 더욱 굳건히 하려면 국내 어딘가에 새 수도를 세워야 합니다. 주요 도시 지역을 후보지로 삼고 그에 맞춰 도시 이름을 바꿀 것입니다."
 tajik_focus.60.a: "오조도보드로 옮긴다"
 tajik_focus.60.b: "루스탐샤흐르로 옮긴다"
 tajik_focus.60.c: "토지다르로 옮긴다"
 tajik_focus.60.d1: "두샨베로 충분하다"
 tajik_focus.61.t: "[TAJ.GetLeader] 재선!"
 tajik_focus.61.d: "국가 지도자 [TAJ.GetLeader]이(가) 직접선거에서 재선되었습니다! 득표율 100%에 거의 근접하는 승리를 거둔 [TAJ.GetLeader]은(는) 한 번 더 임기 동안 국가를 이끄는 영예를 누리게 될 것입니다. 지지자 군중이 수도의 거리를 가득 메우고 또 한 번의 번영하는 임기를 기대하고 있습니다."
 tajik_focus.61.a: "완벽하군..."
 tajik_focus.61.b: "그런데 내가 민주주의를 원했다면?"
 tajik_focus.62.t: "우리의 헬리콥터 함대"
 tajik_focus.62.d: "우리의 헬리콥터 전력은 급속히 노후화되고 있으며 공급량도 매우 부족합니다. 개선 방안이 그리 좋지는 않지만, 비축분을 확실히 늘릴 수는 있습니다. 미국이나 러시아에 요청하면 최소한 작동 가능한 헬리콥터 몇 대는 군에 들여올 수 있을 것입니다."
 tajik_focus.62.a: "미국에 요청한다"
 tajik_focus.62.b: "러시아에 요청한다"
 tajik_focus.63.t: "타지키스탄의 헬리콥터 요청"
 tajik_focus.63.d: "타지크 정부가 우리에게 헬리콥터 일부를 공급해 달라고 요청하고 있습니다. 이는 우리의 비교적 낡은 전력 일부를 내주는 것을 의미하지만, 이 중앙아시아의 작은 나라에 우리 헬리콥터를 넘길지 여부는 우리의 선택입니다."
 tajik_focus.63.a: "판매를 승인한다"
 tajik_focus.63.b: "아니요"
 tajik_focus.64.t: "[FROM.GetName]의 헬리콥터 판매 승인"
 tajik_focus.64.d: "[FROM.GetAdjective] 정부가 헬리콥터에 대한 우리의 요청을 받아들였습니다. 비록 자국의 오래된 기체를 보내올 것이지만, 노후화된 우리 헬리콥터 전력에는 여전히 큰 보탬이 될 것입니다."
 tajik_focus.64.a: "좋아"
 tajik_focus.65.t: "[FROM.GetName]의 군사 협정 거부"
 tajik_focus.65.d: "양질의 군사 지원에 대한 우리의 기대는 낮았지만, [FROM.GetName]은(는) 그럼에도 자국의 지원 일부를 우리에게 줄 필요가 없다고 판단했습니다."
 tajik_focus.65.a: "유감이군"
 tajik_focus.66.t: "타지키스탄의 군수 산업 지원 요청"
 tajik_focus.66.d: "타지크 정부는 자국 내에 강력하고 생산적인 무기 산업을 구축하는 데 우리의 지원을 요청하고 있습니다. 그 대가로 우리 정부에 특별 대우를 제공하겠다고 하며, 우리는 우리의 영향력을 확대할 수 있을 것입니다."
 tajik_focus.66.a: "좋은 생각이다"
 tajik_focus.66.b: "아니요"
 tajik_focus.67.t: "튀르키예의 무기 공장 건설"
 tajik_focus.67.d: "튀르키예 정부는 무기 산업 지원에 대한 우리의 요청을 받아들였으며, 우리 노동자들이 사용할 공장 몇 곳을 건설했습니다."
 tajik_focus.67.a: "훌륭해!"
 tajik_focus.68.t: "타지키스탄의 드론 전문가 동반 무기 산업 지원 요청"
 tajik_focus.68.d: "타지크 정부는 우리 정부에 무기 산업 구축을 도와달라고 요청하고 있으며, 특히 우리 산업의 일부와 유사한 드론 장비 생산에 중점을 두고 있습니다. 이를 통해 우리는 영향력을 확대하고 도움이 필요한 형제국을 도울 수 있습니다."
 tajik_focus.68.a: "훌륭한 생각이다"
 tajik_focus.68.b: "아니요"
 tajik_focus.69.t: "이란의 지원 제공"
 tajik_focus.69.d: "이란 정부는 우리의 요청을 받아들여 무기 공장을 지어주었으며, 이 공장은 현재 우리 노동자들을 훈련시킬 계획인 이란 자국의 드론 전문가들이 감독하고 지휘하고 있습니다."
 tajik_focus.69.a: "좋아"
 tajik_focus.70.t: "타지키스탄: 풍요 속의 빈곤"
 tajik_focus.70.d: "우리 나라는 대부분의 전문가들에게 '중앙아시아에서 가장 가난한 나라'로 불립니다. 우리 국민이 견뎌야 하는 이 경제적 부담은 정부 관료들의 잘못된 운영의 결과입니다. 이제 새로운 길, 즉 경제 회복과 국력 강화의 길을 선택할 때입니다."
 tajik_focus.70.a: "부패에 집중한다"
 tajik_focus.70.b: "생산적인 노동력에 집중한다"
 tajik_focus.71.t: "라흐몬의 썩어가는 열매"
 tajik_focus.71.d: "타지키스탄 공화국은 위태로운 처지에 놓여 있습니다. 만연한 부패, 광범위한 족벌주의, 정부의 비효율, 그리고 잘못된 통치의 상처는 소련 붕괴 이후 이 나라가 그렸던 발전의 길에서 크게 벗어나게 만들었습니다. 1990년대의 내전은 물리적 파괴 이상의 것을 남겼습니다. 그것은 국가의 단합을 산산조각 냈고, 국민들 사이에 불신의 씨앗을 뿌렸으며, 오늘날까지 이어지는 정치적 불안정의 분위기를 조성했습니다. 전후 권력 투쟁에서 승리를 거두며 부상한 에모말리 라흐몬 대통령은 이제 참혹한 분쟁의 여파에서 여전히 헤어나지 못한 나라를 재건하는 과제에 직면해 있습니다. 경제 침체, 지역 간 격차, 그리고 점점 소외되는 국민은 취약한 평화를 무너뜨릴 위험을 안고 있습니다. 국내외의 반대 세력이라는 그림자가 짙게 드리운 가운데, 많은 이들이 라흐몬이 나라를 번영으로 이끌 능력이 있는지 의문을 제기하고 있습니다. 타지키스탄은 내부 분열을 극복하고 미래를 위한 새로운 길을 개척할 것인가, 아니면 불안한 과거의 그늘 속에서 계속 허우적댈 것인가?"
 tajik_focus.71.a: "새 천년이 우리에게 너그럽기를"
 pamir_conflict.1.t: "바트켄을 확보한 공격군"
 pamir_conflict.1.d: "공격군이 바트켄의 수비대를 몰아내고 이 지역의 주요 검문소와 정부 기관을 확보했습니다."
 pamir_conflict.1.a: "알겠다"
 pamir_conflict.2.t: "전선을 지켜낸 방어군"
 pamir_conflict.2.d: "파미르 지역에 주둔한 방어군은 이 지역의 주요 검문소를 점령하려는 공격군을 성공적으로 저지했습니다."
 pamir_conflict.2.a: "알겠다"
 pamir_conflict.3.t: "휴전 선언"
 pamir_conflict.3.d: "진전이 미흡하여 공격군은 공세를 중단하고 휴전에 합의했습니다."
 pamir_conflict.3.a: "알겠다"
 pamir_conflict.4.t: "공격을 격퇴하지 못한 아군"
 pamir_conflict.4.d: "아군은 전선을 지키지 못했으며, 침략자들이 가한 모든 공격에 무너지고 말았습니다."
 pamir_conflict.4.a: "유감이군"
 pamir_conflict.5.t: "바트켄을 확보한 공격군"
 pamir_conflict.5.d: "공격군이 바트켄의 수비대를 몰아내고 이 지역의 주요 검문소와 정부 기관을 확보했습니다."
 pamir_conflict.5.a: "알겠다"
 tajik_lore.0.t: "나디로프의 간청"
 tajik_lore.0.d: "대통령 집무실의 문이 조용히 열리고, 헐렁한 모자를 쓴 키 작은 장교가 절뚝거리며 들어와 라흐몬의 책상 위에 편지 한 통을 놓으며 총참모장 라밀 나디로프가 보낸 것이라고 말했다. 군 투자를 지원할 예산 자금을 요청하는 또 하나의 간청이었다. 신병들에게 지급되는 잉여 무기는 상태가 형편없었다. 라흐몬은 편지를 펼쳐 읽기 시작했다.\n\n평화와 민족 단결의 창시자이시며 국가의 지도자이신 각하께\n이 편지가 건강하신 각하께 닿기를 바랍니다. 각하와 사랑하는 타지키스탄을 위해 모든 것을 바칠 각오로 최전선에 서 있는 용감한 사나이들을 위해 다시 한번 재정 지원을 간청드리고자 이 글을 올립니다. 이들은 싸울 준비가 되어 있으나 용기만으로는 승리할 수 없습니다. 결국 병사는 손에 쥔 무기만큼만 유능할 수 있기 때문입니다.\n\n삼가\n라밀 할릴로비치 나디로프\n\n라흐몬은 편지를 봉투에 도로 넣고 의자에 몸을 기대며 흥얼거렸다."
 tajik_lore.0.a: "그저 평범한 하루일 뿐"
 tajik_lore.1.t: "가장 냉혹한 진실"
 tajik_lore.1.d: "나디로프는 어스름한 불빛의 집무실에 앉아 있었고, 기대감의 무게는 시가 끝에서 피어오르는 짙고 회색빛 안개만큼이나 무겁게 공기 중에 걸려 있었다. 내쉬는 숨마다 자욱한 연기가 더해져 비좁은 방을 침울하고 숨 막히는 정적 속에 감쌌다. 책상 램프의 희미한 불빛은 흩어진 지도와 전술 보고서 위로 길고 일렁이는 그림자를 드리웠고, 보고서마다 붉은 원과 반군의 움직임에 대해 급히 휘갈겨 쓴 메모가 표시되어 있었다.\n\n앞서 전령이 도착해 수도 두샨베의 공식 직인이 찍힌 봉인된 봉투를 책상 위에 떨어뜨렸다. 방금 도착한 편지에는 좋은 소식이 전혀 없었고, 약속된 군 예산의 증액도 없었다.\n\n그는 의자에 등을 기대고 듬성해진 머리카락 사이로 손을 쓸어 넘겼으며, 좌절감이 얼굴 깊이 새겨져 있었다. 암울한 현실에 더해, 불과 몇 시간 전에 새로운 보고가 도착했다. 또 하나의 IMU 거점이 타지크 영토 더 깊숙한 곳에 세워졌다는 것이다. 그 소식은 벽돌처럼 그를 강타했고, 한마디 한마디가 자금도 장비도 부족한 그의 병력이 맞서 싸워야 할 커져가는 위협을 쓰라리게 상기시켰다. 나디로프는 시가의 남은 부분을 넘치는 재떨이에 비벼 껐고, 불씨는 잠시 타올랐다가 어둠 속으로 스러졌다. 불확실성의 냉기가 내려앉으면서 방은 이제 더욱 싸늘하게 느껴졌다."
 tajik_lore.1.a: "알라훔마 아르함나"
 tajik_lore.2.t: "무기고 설계도"
 tajik_lore.2.d: "나디로프는 어스름한 불빛의 집무실에 앉아 있었고, 기대감의 무게는 시가 끝에서 피어오르는 짙고 회색빛 안개만큼이나 무겁게 공기 중에 걸려 있었다. 내쉬는 숨마다 자욱한 연기가 더해져 비좁은 방을 침울하고 숨 막히는 정적 속에 감쌌다. 책상 램프의 희미한 불빛은 흩어진 지도와 전술 보고서 위로 길고 일렁이는 그림자를 드리웠고, 보고서마다 붉은 원과 반군의 움직임에 대해 급히 휘갈겨 쓴 메모가 표시되어 있었다.\n\n전령이 도착해 두샨베의 공식 직인이 찍힌 봉인된 봉투를 책상 위에 올려놓았다. 또 한 번의 거절을 예상한 그는 낙담할 각오를 하고 한숨을 쉬며 봉투를 열었다. 그러나 기쁨의 물결이 그를 휩쓸었다. 요청이 승인되었고 파란 잉크 직인이 찍혀 있었던 것이다. 지체 없이 그는 작전실로 걸어 들어가 참모진 전원을 소집했다.\n\n그들은 함께 러시아 비축분에서 새로 확보한 소총의 대규모 수송을 위한 군수 조정을 시작했다. 각 참모장은 재고를 점검하며 자신들에게 가장 필요한 예비 부품과 장비를 골랐다. 나디로프는 혼자 히죽거리는 것을 멈출 수 없었다."
 tajik_lore.2.a: "토끼 사냥철이 시작된 모양이군"
 tajik_lore.3.t: "타빌다라 계곡의 광경"
 tajik_lore.3.d: "라디오가 지직거리며 잡음이 방을 가득 채웠다. 멀리서 들려오는 고함 소리가 일그러진 채 스피커로 새어 나왔고, 총성의 울림이 그 뒤를 따랐다. 상보르 지구의 높은 산악 지대에 자리 잡은 타빌다라 마을과 그 주변 지역을 감시하기 위해 호송대 한 대가 파견되었다. 이들의 임무는 아프가니스탄에서의 최근 좌절 이후 재결집한다는 보고에 따라 IMU 반군으로 의심되는 세력의 움직임을 추적하는 것이었다.\n\n보고가 나디로프에게 전해지자, 그는 이번에도 작전이 실패했다는 소식에 짜증에 휩싸였다. 그의 두 손이 책상을 내리쳤고, 충격에 방이 흔들렸다. 그는 어떤 실수든 곧 밝혀질 것이며 자신이 국가로부터 실패자로 낙인찍힐 것임을 알고 있었다."
 tajik_lore.3.a: "늘 벼랑 끝을 걷는다"
 tajik_lore.4.t: "타빌다라 계곡의 광경"
 tajik_lore.4.d: "산길 가장자리에 임시로 만든 망루에서 그는 소총의 가늠쇠를 따라 눈을 부릅뜨고 있었다. 그의 뒤에는 한 무리의 반군이 먹이를 기다리는 독수리처럼 서 있었다. 빛바랜 올리브색으로 칠해지고 타지크 지상군의 휘장을 단 소련 시대의 트럭이 모퉁이를 돌았다. 그의 손가락이 방아쇠를 당겼다. 트럭의 창문이 산산이 부서지고 피투성이가 된 운전사의 머리가 핸들 위로 쓰러지며 경적을 눌렀다. 트럭은 길가에서 벗어나 아래 계곡으로 굴러떨어지며 사냥용 덫이 되었다. 반군 일당이 마무리를 짓기 위해 달려 나갔다. 총알이 쏟아져 소총에서 뿜어진 불꽃이 트럭을 관통했고, 안에 남은 이들을 제거했다. 그들은 차량에서 시신들을 끌어냈다. 응답을 요구하는 라디오의 희미한 지직거림이 반복되었으나 아무 대답도 돌아오지 않았다. 임무는 끝났다."
 tajik_lore.4.a: "우리의 열매는 썩어버렸고 그들이 그것을 죽였다"
 tajik_lore.5.t: "은폐"
 tajik_lore.5.d: "나디로프는 중무장한 트럭과 장갑차 호송대를 이끌고 사건 현장에 가장 먼저 도착한 이들 중 하나였다. 그는 현장에 있던 기자들에게 즉시 차량이 통제력을 잃고 벼랑에서 이탈해 추락하여 탑승자들이 사망했다고 주장하라고 명령했으며, 이는 모두 자신의 흔적을 감추기 위한 것이었다."
 tajik_lore.5.a: "최고의 하루로군"
 tajik_lore.6.t: "달갑지 않은 전화"
 tajik_lore.6.d: "라흐몬이 책상에 앉아 있을 때 전화가 울렸다. 그가 수화기를 들자 [UZB.GetLeader]이(가) 나와 IMU가 타지크 국경을 넘어 우즈베키스탄으로 침입해 국경 경비병 두 명이 사망한 일에 대한 해명을 요구했다. 라흐몬은 퉁명스러운 어조로 대답했다.\n\n우리는 국경을 넘는 IMU의 움직임을 전혀 알지 못했습니다. 타지크 국경 순찰대는 현재 한창...\n\n[UZB.GetLeader]은(는) 통역을 멈추게 하고 라흐몬이 말을 끝내기 전에 가로막았다.\n\n변명 따위는 듣고 싶지 않소. 당신들이 그들에게 소풍을 즐기게 내버려 두는 사이 위협이 우리 집 문 앞에 와 있소. 타지키스탄 중부에서 IMU 세력을 비호하는 것을 즉각 중단할 것을 요구하오. 그렇지 않으면 그에 따른 결과가 있을 것이오! 그는 갑자기 전화를 끊었다.\n\n충격을 받은 라흐몬은 잠시 책상에 꼼짝 않고 앉아 있다가 수화기를 들어 참모총장에게 전화를 걸었다."
 tajik_lore.6.a: "이거 참 큰일이로군"
 tajik_lore.7.t: "불타는 언덕"
 tajik_lore.7.d: "우즈베크 전투기가 우리 영공을 침범하여 타지키스탄 북부 상공을 날다가 외딴 네 곳 중 한 곳에 표적 공습을 감행했다는 보고가 들어왔습니다. 이 공습은 IMU 거점을 겨냥한 것으로 보이나, 이는 분쟁의 심각한 확대이며 국가 안보를 위협합니다. 우리는 개처럼 짓밟히도록 내버려 둘 수 없지만, 또 한 번의 전면전을 감당할 여력도 없습니다."
 tajik_lore.7.a: "대응하지 않는다"
 tajik_lore.7.b: "병력을 결집한다"
 tajik_lore.8.t: "타지키스탄 타격 계획"
 tajik_lore.8.d: "IMU 세력이 타지키스탄의 산악 지대에 숨어 있습니다. 너무 늦기 전에 지금 행동해야 합니다."
 tajik_lore.8.a: "선택의 여지가 없다, 우리는 그럴 수밖에 없다."
 tajik_lore.9.t: "국경 지뢰 매설"
 tajik_lore.9.d: "IMU의 국경 침범이 매일 일어나고 있습니다. 국가를 방어하기 위해 지뢰를 매설하는 방어 태세를 취해야 합니다."
 tajik_lore.9.a: "선택의 여지가 없다, 우리는 그럴 수밖에 없다."
 tajik_lore.10.t: "우즈베키스탄의 지뢰 매설"
 tajik_lore.10.d: "라흐몬이 집무실로 돌아오니 책상 위에 쪽지 한 장이 기다리고 있었다. 쪽지를 펼치자 그의 표정이 어두워졌다. 메시지는 분명했다. 우즈베크군이 타지크-우즈베크 국경 지역에 지뢰를 매설하기 시작했다는 것이다.\n\n의자에 주저앉은 라흐몬은 굴욕감을 느꼈다. 또다시 자신이 바보처럼 보이게 되었다."
 tajik_lore.10.a: "우리 힘으로는 어쩔 수 없다"
 tajik_lore.10.b: "우리는 이를 받아들이지 않을 것이다"
 tajik_lore.11.t: "우즈베키스탄과의 위기 회담"
 tajik_lore.11.d: "수화기는 딱딱하고 차가워서 라흐몬의 땀에 젖은 손과 뚜렷이 대비되었다. 신호음 하나하나가 무엇이 걸려 있는지를 상기시켰다. [UZB.GetLeader]이(가) 전화를 받자 라흐몬은 퉁명스러우면서도 차분하게 말하며 동시에 참모들에게 방을 나가라고 손짓했다. 그 통화에서 무슨 일이 있었는지는 아무도 모르지만, 라흐몬이 돌아왔을 때 우즈베키스탄은 진격을 멈추는 데 합의한 상태였다. 라흐몬은 무슨 일이 있었는지 설명하기를 거부했다. "
 tajik_lore.11.a: "온 나라가 안도의 한숨을 내쉰다"
 tajik_lore.12.t: "우즈베키스탄, IMU 표적 작전으로 타지키스탄 타격"
 tajik_lore.12.d: "우즈베키스탄은 국경을 넘나드는 반군 활동을 명분으로 타지키스탄 북부 전역의 우즈베키스탄 이슬람 운동(IMU) 거점을 겨냥한 공습을 개시했습니다. 타지크 관리들은 이를 영공 침범으로 규탄했으나 아직 분쟁을 확대하지는 않았습니다. 이번 공습은 양국 간 긴장의 상당한 고조를 나타냅니다."
 tajik_lore.12.a: "혼란에 빠진 세상"
 tajik_lore.12.b: "우리 위로 드리운 그림자"
 tajik_lore.12.c: "결정적인 일격"
 tajik_lore.13.t: "우즈베키스탄, 타지크 국경에 지뢰 매설"
 tajik_lore.13.d: "우즈베크군은 IMU 반군의 움직임에 대한 우려로 타지크-우즈베크 국경을 따라 지뢰를 매설하기 시작했습니다. 이는 타지키스탄 북부의 IMU 거점을 겨냥한 최근의 공습에 이은 조치입니다. 타지크 관리들은 이러한 행위를 주권 침해이자 양국 간 긴장을 고조시키는 것이라고 규탄했습니다."
 tajik_lore.13.a: "흐릿한 나날이 앞에 놓여 있다"
 tajik_lore.14.t: "우즈베크의 타지키스탄 침공"
 tajik_lore.14.d: "타지크 국군은 우즈베크군이 국경을 넘어 타지크 군사 거점에 공격을 개시했다고 보고했습니다. 우즈베키스탄 정부는 이번 침입이 IMU(우즈베키스탄 이슬람 운동) 조직망으로부터 지역을 보호하기 위한 평화 유지 작전의 일환이라고 주장합니다. 타지키스탄은 우즈베크 정부가 국가 주권을 완전히 무시한 채 지역을 불안정하게 만들고 있다고 비난합니다. 분쟁이 확대되면서 많은 민간인이 남쪽으로 피란하고 있으며, 이는 잠재적인 인도주의 위기에 대한 우려를 높이고 있습니다."
 tajik_lore.14.a: "신중하게 걸었으나 지옥불로 끝났다"
 SOV_forbidden_bazaar: "타지키스탄의 협박"
 SOV_forbidden_bazaar_desc: "[TAJ.GetFlag] 타지크 정부는 우리 나라로 유입되는 마약의 흐름으로 우리를 협박하기로 결정했으며, 이는 여러 부문을 불안정하게 만들고 큰 부패를 일으키고 있습니다. 결국 동맹이라는 지위와 무관하게 그들에게 중단을 요구해야 하는 지점에 이를 것입니다."
 SOV_forbidden_bazaar_stop: "[TAJ.GetFlag] 타지키스탄에 국경 경비 강화 요구"
 SOV_forbidden_bazaar_stop_desc: "저 멍청한 [TAJ.GetLeader]에게 국경 경비를 강화하라고 명령할 때가 왔습니다."
 TAJ_forbidden_bazaar: "그림자의 바자르"
 TAJ_forbidden_bazaar_desc: "\n£TAJ_desctext_blackmarket\n\n\n\n매일 수많은 불법 물품이 [TAJ.GetFlag] §H타지키스탄§!을 통해 흘러들어옵니다. 마약부터 북쪽의 다른 국가로 국경을 넘는 불법 이민자에 이르기까지 모든 것이 포함됩니다. 이는 우리 정부에 이웃 국가들, 궁극적으로는 [SOV.GetFlag] 러시아에 대한 협상력을 제공합니다. [SOV.GetFlag] 러시아 정부의 행동에 불만이 있을 때, 혹은 그저 그러고 싶을 때, 우리는 [SOV.GetFlag] 러시아를 불안정하게 만들기 위해 §H암시장§! 주변의 §H경비§!를 느슨하게 할 수 있습니다. 이는 [SOV.GetFlag] 러시아를 분노하게 하며, 그들이 우리 나라에 대한 영향력을 높이려 할 수도 있습니다. 매달 §H암시장§! 주변의 경비 수준에 따라 우리는 발전에 보탬이 되는 밀수품을 얻게 되며, §H경비 수준§!에 따라 §R불안정화§! 요소가 우리 국가로 번질 가능성도 있습니다. [SOV.GetFlag] 러시아로 유입되는 마약의 양을 늘릴 때마다 그들을 분노하게 할 위험이 있으며, 그들이 §H40% 영향력§!을 가지고 있다면 이를 중단하라고 요구할 수 있습니다. [SOV.GetFlag] 러시아가 가진 변동치는 그들의 국가 정신 목록에서 동적 변동치에 마우스를 올려 확인할 수 있습니다.\n\n현재 경비 상태: [TAJ_high_security_flag][TAJ_medium_security_flag][TAJ_negligible_security_flag]"
 TAJ_high_security: "고강도 경비 시행"
 TAJ_high_security_desc: "국내로 유입되는 불법 물품을 막기 위해 암시장에 대한 더 많은 예방 조치를 취할 때가 왔습니다."
 TAJ_medium_security: "완화된 경비 시행"
 TAJ_medium_security_desc: "경비를 완화함으로써 어느 정도 통제를 유지하면서 암시장의 혜택을 거둘 수 있습니다."
 TAJ_negligible_security: "무시 가능한 경비 시행"
 TAJ_negligible_security_desc: "돈이 있는데 경비가 무슨 필요가 있겠습니까?"
 TAJ_threaten_russia: "러시아 위협"
 TAJ_threaten_russia_desc: "마약의 유입을 통해 러시아의 안정을 위협함으로써, 우리는 러시아가 우리의 요구에 굴복하도록 겁을 줄 수 있습니다."
 TAJ_flood_russian_market_with_drugs: "[SOV.GetFlag] 러시아 시장에 마약 살포"
 TAJ_flood_russian_market_with_drugs_desc: "우리는 [SOV.GetFlag] 러시아 정부와의 협상에서 유리한 입지와 영향력을 확보해야 합니다. 그들의 시장에 마약을 풀고 서서히 압박을 높이면 그들이 양보하여 우리가 원하는 것을 내줄 수도 있습니다."
 TAJ_cancel_distribute_monthly_bonus: "월간 암시장 물품 사건 재활성화"
 TAJ_cancel_distribute_monthly_bonus_desc: "매달 말에 월간 사건을 다시 받게 됩니다."
 TAJ_distribute_monthly_bonus: "월간 물품 자동 수거 및 분배"
 TAJ_distribute_monthly_bonus_desc: "암시장 물품에 대한 월간 알림이 더 이상 표시되지 않으며, 대신 물품이 자동으로 분배됩니다. 보너스가 분배되므로 일부 보너스는 약간 감소합니다."
 TAJ_increase_drug_amount: "마약 물량 증가"
 TAJ_increase_drug_amount_desc: "[SOV.GetFlag] 러시아를 더욱 압박하기 위해 러시아로 유입되는 마약의 흐름을 늘려야 합니다."
 TAJ_end_the_drug_flow: "마약 범람 종식"
 TAJ_end_the_drug_flow_desc: "러시아는 이제 우리에게 아무 쓸모가 없으며, 마침내 압박을 끝내고 그들 나라로 향하는 마약의 흐름을 멈출 수 있습니다."
 TAJ_russian_demands: "[SOV.GetFlag] 러시아의 요구"
 TAJ_russian_demands_desc: "러시아는 마침내 최후통첩을 내놓았습니다. 마약 단속을 강화하든가, 아니면 우리의 영토 주권을 포기하든가."
 TAJ_tajik_revolution_mech: "[TAJ.GetFlag] 타지크 혁명"
 TAJ_tajik_revolution_mech_desc: "§H라흐모노프 정부§!의 실패, 부패, 족벌주의는 독재자들과 정치 세습 가문에게 국가의 통치를 맡길 수 없음을 다시 한번 입증했습니다. §HUTO§!와 §H라흐모노프 정권§!에 맞서는 모든 반체제 인사들은 국가를 영원히 해방시키기 위해 하나의 깃발 아래 단결해야 합니다.\n\n우리는 혁명을 §HUTO§!를 중심으로 할 수도, 우리 당을 중심으로 할 수도 있습니다. §HUTO 단결도§!를 낮추면 혁명을 우리 당 중심으로 이끌게 되어 혁명 완수 후 제약 없이 통치할 수 있지만, 내전 중 받는 지지가 줄어들고 혁명 이후 상황이 혼란스러워집니다. 반면 §HUTO 단결도§!를 우선시하면 통치가 더 안정적일 수 있으나 나중에 요구 사항에 대처해야 합니다.\n\n§HUTO 단결도§!: [?TAJ_uto_unity]%"
 TAJ_launch_the_revolt: "봉기 개시"
 TAJ_launch_the_revolt_desc: "라흐모노프와 그의 범죄 정권을 영원히 전복할 때가 왔습니다."
 TAJ_tap_into_uto_funds: "UTO 자금 유용"
 TAJ_tap_into_uto_funds_desc: "중앙 지도부에 알리지 않고 UTO 자금을 몰래 가져감으로써 조직 내에 불화를 조성할 수 있습니다."
 TAJ_discredit_uto_leadership: "UTO 지도부 신뢰 실추"
 TAJ_discredit_uto_leadership_desc: "UTO 지도부의 신뢰를 실추시킴으로써 집단 내 신뢰감을 악화시키고 초점을 우리와 우리 당에 맞출 수 있습니다."
 TAJ_propaganda_campaign: "선전 캠페인"
 TAJ_propaganda_campaign_desc: "UTO를 지지하는 선전 캠페인을 전개하면 이 조직에 대한 더 나은 인식을 구축할 수 있습니다."
 TAJ_the_crackdown: "강경 진압"
 TAJ_radicalism_system: "움마의 메아리"
 TAJ_radicalism_system_desc: "\n£TAJ_desctext_irp\n\n\n\n빈곤, 부패, 족벌주의, 실업은 우리 국민이 정부에 대해 품어온 불만들 중 일부입니다. 그러나 그중 하나는 모든 것을 능가하며 많은 이들에게 마지막 결정타가 됩니다. 우리의 이슬람 관행 억압은 일부 국민으로 하여금 종교가 \n§H[TAJ.GetFlag] 타지키스탄§! 내 문제의 해답이라고 믿게 했으며, 이 땅에서 새로운 국가가 출현해야 한다고 강하게 확신하게 했습니다. 일부는 £TAJ_kingdom  §H이슬람부흥당§!과 같은 단체에 가입하고 있으며, 활발한 반란은 아니지만 이 조직과 연관된 간헐적인 공격이 무작위로 나타날 수 있습니다. 낮은 GDP나 실업과 같은 경제적 요인은 사람들이 나라를 떠나 급진화될 가능성을 높입니다. 세속화와 같은 특정 정치적 조치는 £TAJ_kingdom  §HIRP 영향력§!을 높일 수 있습니다. £TAJ_kingdom  §HIRP 영향력§!이 100%에 도달하면 우리와 지역, 가까운 동반자들을 불안정하게 만들려는 운동이 나타날 것입니다.\n\n현재 £TAJ_kingdom  §HIRP§! 영향력: [?TAJ_radical_influence]%"
 TAJ_deploy_national_guard: "[TAJ.GetFlag] 국가방위군 배치"
 TAJ_deploy_national_guard_desc: "국가방위군을 배치함으로써 이슬람주의자들의 정치 활동을 단속할 수 있지만, 그러기 위해서는 큰 비용이 들 수 있습니다."
 TAJ_recall_national_guard: "국가방위군 소환"
 TAJ_recall_national_guard_desc: "국가방위군을 불러들이면 이슬람주의자들의 정치 활동이 다시 증가하기 시작할 수 있지만, 최소한 국고에 약간의 자금이 남게 됩니다."
 TAJ_ban_the_irp: "£TAJ_kingdom  이슬람부흥당 규탄"
 TAJ_ban_the_irp_desc: "우리 정부가 £TAJ_kingdom  이슬람부흥당을 공개적으로 규탄하고 국가에 반하는 광범위한 정치 활동에 참여하는 것을 금지할 때가 왔습니다."
 TAJ_radicalism_system_2: "움마의 충격파"
 TAJ_radicalism_system_2_desc: "\n£TAJ_desctext_irp2\n\n\n\n£TAJ_kingdom  §H이슬람부흥당§!의 몰락과 타지크 사회의 지속적인 발전은 이전 세대보다 더욱 급진적인 새로운 극단주의 운동의 부상으로 이어졌습니다. £generic_Caliphate_small §H(IS-KP) 호라산 이슬람 국가§!가 이제 IRP의 몰락으로 생긴 공백을 메우기 위해 부상했으며, 이들은 그 어느 때보다 훨씬 더 급진적입니다. 우리는 국내 살라피주의 이념의 성장을 억제하고 항상 §H20% 미만§!으로 유지해야 합니다. 살라피주의 인기도가 §H20%§!를 넘는 순간 [TAJ.GetFlag] 타지키스탄은 내전으로 치닫게 됩니다. 우리의 §H테러 위협§!을 §G무시 가능§! 수준으로, §H급진화§!를 §G낮음§! 수준으로 낮추면 이 반란을 종식시킬 수 있습니다."
 TAJ_open_menu: "국제 체계 메뉴 열기"
 TAJ_open_menu_desc: "현재의 급진주의와 테러 위협을 어디에서 확인하는지 헷갈리십니까? 화면 오른쪽 하단의 지구본 아이콘을 찾거나, 이 결정을 클릭하여 '디테러' 탭으로 이동하십시오."
 TAJ_arrest_iskp: "£generic_Caliphate_small  IS-KP 지도부 체포"
 TAJ_arrest_iskp_desc: "그들은 지지 기반이 부족하여 현지인들로부터 국내 IS-KP 지도부의 위치를 쉽게 제보받아 체포할 수 있습니다."
 iranic_confederation: "이란계 국가 재통일"
 iranic_confederation_desc: "\n£TAJ_desctext_paniranist\n\n\n\n§H이란계§! 민족들은 역사 속의 여러 전쟁을 거치며 서로 갈라졌습니다. 처음에는 알렉산드로스의 정복으로, 이후에는 아랍의 침공으로 말입니다. 그 이후로 §H이란계§! 민족은 하나의 깃발 아래 통합하지 못했고, 그 때문에 세계에서 강력한 국가를 건설할 능력이 제한되어 왔습니다. §H범이란§! 운동은 50년대에 [PER.GetFlag] §H이란§!에서 처음 일어났으며 이후 [AFG.GetFlag] §H아프가니스탄§!과 [TAJ.GetFlag] §H타지키스탄§!으로 퍼졌으나, 소련에 의한 이란 관습과 언어의 탄압으로 이어졌습니다. 우리는 §H범이란주의 정부§!를 가진 국가들에 외교 사절단을 보내 우리 국가들의 §H재통일§!을 위한 준비를 시작할 수 있습니다."
 IRN_delegates_to_iran: "[PER.GetFlag] 테헤란에 대표단 파견"
 IRN_delegates_to_afghanistan: "[AFG.GetFlag] 카불에 대표단 파견"
 IRN_delegates_to_kurdistan: "[KUR.GetFlag] 에르빌에 대표단 파견"
 IRN_delegates_to_south_ossetia: "[SOO.GetFlag] 츠힌발리에 대표단 파견"
 IRN_delegates_to_tajikistan: "[TAJ.GetFlag] 두샨베에 대표단 파견"
 IRN_announce_diplomatic_integration: "외교적 통합 발표"
 IRN_elect_confederation_leader: "연방 지도자 선출"
 IRN_announce_iranic_integration: "사회적 통합 발표"
 IRN_announce_total_intergation: "완전 통합 발표"
 IRN_relocation_of_iranic_capital: "수도 이전?"
 IRN_ultimatum_to_pakistan: "[PAK.GetFlag] 파키스탄에 최후통첩 전달"
 IRN_ultimatum_to_turkey: "[TUR.GetFlag] 터키에 최후통첩 전달"
 IRN_ultimatum_to_uzbekistan: "[UZB.GetFlag] 우즈베키스탄에 최후통첩 전달"
 IRN_ultimatum_to_armenia: "[ARM.GetFlag] 아르메니아에 최후통첩 전달"
 TAJ_badakhshani_unrest: "[BDA.GetFlag] 바다흐샨 단층선"
 TAJ_badakhshani_unrest_desc: "\n£TAJ_desctext_BDA\n\n\n\n[BDA.GetFlag] §H고르노바다흐샨§!의 사람들은 \n[TAJ.GetFlag] §H타지키스탄§!의 나머지 지역과 다르게 발전하며 고유한 정체성을 보존해 왔습니다. 이는 이 지역에서 우리 정부에 일부 행정적 문제를 일으켰으며, 보안군과 시위대 간의 충돌이 드물지 않습니다. 무장 봉기의 위험은 없으나, 이 지역은 계속해서 우리의 무기 비축량과 인력을 소모할 것입니다.\n\n현재 [BDA.GetFlag] §H바다흐샨§! 불안: [?TAJ_badakhshan_unrest_var]%"
 TAJ_subsidies_in_badakhshan: "[BDA.GetFlag] 고르노바다흐샨에 보조금 지급"
 TAJ_subsidies_in_badakhshan_desc: "식량, 의약품, 의료 같은 필수품에 보조금을 지급하여 이 지역에서의 우리 정부 이미지를 개선할 수 있습니다."
 TAJ_monopolize_state_industries: "바다흐샨 산업 독점"
 TAJ_monopolize_state_industries_desc: "이 지역에 대한 중국의 투자로 인해 해당 산업은 우리 정부가 독점하기에 적합한 상태가 되었습니다."
 TAJ_visit_the_regional_governor: "지역 총독 방문"
 TAJ_visit_the_regional_governor_desc: "지역 총독을 방문함으로써 그들의 자치와 지방 정부에 대한 연방의 지지를 재확인할 수 있습니다."
 TAJ_sack_regional_governor: "지역 총독 해임"
 TAJ_sack_regional_governor_desc: "파미르 출신 총독이 있는 것은 이 지역에 대한 충분한 통제를 유지하는 데 도움이 되지 않으므로, 오히려 총독을 타지크 출신으로 교체하는 데 집중해야 합니다."
 TAJ_dig_for_badakhshani_resources: "바다흐샨 자원 채굴"
 TAJ_dig_for_badakhshani_resources_desc: "이 지역에는 채굴되기만을 기다리는 귀한 보석과 보옥이 많이 있습니다. 화난 현지인 몇 명을 제외하면, 무엇이 우리의 채굴을 막겠습니까?"
 TAJ_conscript_badakhshani_troops: "바다흐샨 병력 징집"
 TAJ_conscript_badakhshani_troops_desc: "바다흐샨인은 국내에 거주하는 다른 [TAJ.GetFlag] 타지크인과 다르지 않으며, 우리는 모두를 동등하게 대해야 합니다. 모두가 국군에서 복무해야 하며, 이는 결국 그들의 국가적 의무입니다."
 TAJ_permit_religious_freedoms: "종교의 자유 허용"
 TAJ_permit_religious_freedoms_desc: "[TAJ.GetFlag] 타지키스탄 대부분이 수니파 이슬람을 믿지만, 바다흐샨인들은 나머지 국가와 다른 시아파의 한 갈래를 따릅니다."
 TAJ_badakhshani_representation: "바다흐샨 대표성 개선"
 TAJ_badakhshani_representation_desc: "어쩌면 바다흐샨 사람들은 국정에서 다소 대표성이 부족하며, 중앙정부에서 조금 더 인정받을 필요가 있을지도 모릅니다..."
 TAJ_permit_pamiri_language: "파미르어 허용"
 TAJ_permit_pamiri_language_desc: "파미르어를 허용함으로써 바다흐샨 사람들이 국가의 보복에 대한 두려움 없이 정체성을 느끼게 할 수 있습니다."
 TAJ_restrict_troop_movement: "병력 이동 제한"
 TAJ_restrict_troop_movement_desc: "바다흐샨에서의 병력 이동을 제한함으로써 현지인들에게 우리가 해를 끼칠 의도가 없음을 보여줄 수 있습니다."
 TAJ_infrastructure_of_badakhshan: "바다흐샨의 기반시설"
 TAJ_infrastructure_of_badakhshan_desc: "바다흐샨인들은 더 나은 도로, 주택, 삶의 질을 요구해 왔습니다. 이를 제공함으로써 화해를 향해 한 걸음 나아갈 수 있습니다."
 TAJ_form_badakhshani_armed_forces: "바다흐샨 방위군 창설"
 TAJ_form_badakhshani_armed_forces_desc: "바다흐샨 사람들에게는 스스로를 방어할 권리가 있으며, 우리가 항상 그러한 지원을 제공할 자원을 갖추고 있지는 않을 것입니다."
 TAJ_khorugh_accord: "호루그 협정"
 TAJ_khorugh_accord_desc: "바다흐샨 대표들과 만나 호루그 협정의 조건에 합의할 때가 왔습니다. 이는 바다흐샨 지역에 대한 우리의 통제를 분권화하는 중대한 단계입니다."
 TAJ_settle_the_unrest: "불안 해소"
 TAJ_settle_the_unrest_desc: "우리 나라의 독립 이래 고르노바다흐샨 지역을 괴롭혀 온 불안을 해소할 때가 왔습니다."
 TAJ_badakhshan_area: "바다흐샨의 불안"
 TAJ_situation_in_pamirs: "파미르 정세"
 TAJ_situation_in_pamirs_desc: "\n£TAJ_desctext_pamir\n\n\n\n§H파미르§! 국경을 확정하는 과정에서 소련 최고 사령부가 잘못된 결정을 내린 결과 많은 비지가 만들어졌고, 그 결과 마을들이 본국과 단절되었습니다. 협상과 타협의 부재로 인해 [KYR.GetFlag] [KYR.GetName], [TAJ.GetFlag] 타지키스탄, [UZB.GetFlag] 우즈베키스탄 사이에서 가끔 폭력이 발생해 왔습니다. §H파미르§! 지역의 주를 공격해 점령하려면 먼저 군수상의 요건을 충족한 뒤 공격해야 합니다. 주 하나를 점령하고 §H9개월§! 동안 계속 유지하는 데 성공하면 그 주는 §H영구적으로§! 우리의 것이 됩니다."
 TAJ_attack_batken: "바트켄 공격 개시"
 TAJ_attack_batken_desc: "바트켄을 공격하면 육상 회랑을 확보하고 북부 파미르에 쉽게 접근할 수 있게 됩니다."
 TAJ_batken_occupation: "바트켄 점령"
 TAJ_batken_occupation_desc: "현지인들이 마침내 자신들의 영토에 대한 타지크의 통치를 받아들이기까지 바트켄을 약 270일 동안 유지해야 합니다."
 TAJ_attack_pamir: "파미르 공격 개시"
 TAJ_attack_pamir_desc: "파미르를 공격하면 육상 회랑을 확보하고 남부 파미르와 바트켄에 쉽게 접근할 수 있게 됩니다."
 TAJ_pamir_occupation_desc: "현지인들이 마침내 자신들의 영토에 대한 타지크의 통치를 받아들이기까지 파미르를 약 270일 동안 유지해야 합니다."
 TAJ_pamir_area: "파미르 지역"
 TAJ_internal_policies: "[TAJ.GetFlag] 타지키스탄의 정책"
 TAJ_communist_demand: "공산당의 요구"
 TAJ_communist_demand_desc: "내전 중 UTO가 결성된 결과, 우리는 공산주의자들에게 일부 양보를 약속했습니다..."
 TAJ_islamist_demand: "IRP의 요구"
 TAJ_islamist_demand_desc: "내전 중 UTO가 결성된 결과, 우리는 IRP에 일부 양보를 약속했습니다..."
 TAJ_nationalist_demand: "민주당의 요구"
 TAJ_nationalist_demand_desc: "내전 중 UTO가 결성된 결과, 우리는 민주당에 일부 양보를 약속했습니다..."
 TAJ_uzbekistan_puppet: "[UZB.GetFlag] 우즈베크 자치 지역 수립"
 TAJ_uzbekistan_puppet_desc: "우즈베키스탄에서의 정당한 봉기 이후, 우리는 마침내 이 나라에 대한 우리 행정부의 통제력을 확립할 수 있습니다."
 TAJ_soviet_onion: "망치가 낫을 빚다"
 TAJ_soviet_onion_desc: "\n£TAJ_desctext_commie\n\n\n\n소련 붕괴 이후 많은 타지크 농민과 시골 사람들은 통일된 소비에트 국가였던 옛 시절을 그리워했습니다. 이제 우리 국가와 주변 국가들의 진정한 잠재력을 실현하고, 중앙아시아 지역에 노동자 평의회를 수립하여 우리가 오직 우리 자신의 힘 외에는 누구에게도 의존하지 않음을 세계에 보여줄 때입니다."
 TAJ_workers_council_of_central_asia: "중앙아시아 노동자 평의회 수립"
 TAJ_The_Undeclared_Cold_War: "선포되지 않은 냉전"
 TAJ_The_Undeclared_Cold_War_desc: "\n£TAJ_desctext_cold_war_banner\n\n\n\n[TAJ.GetFlag] 타지키스탄은 [UZB.GetFlag] 우즈베키스탄의 중앙아시아 패권 야망이라는 드리워진 그림자와 [UZB.GetFlag] 우즈베키스탄 이슬람 운동(IMU)의 부상 사이에 끼어 위태로운 입장에 놓여 있습니다. 급진 살라피주의 단체인 IMU는 [TAJ.GetFlag] 타지키스탄 중부의 외딴 지역과 산악 지대에 \n뿌리를 내렸으며, [TAJ.GetFlag] 타지키스탄의 취약한 안보를 악용해 무장 야욕을 추구하고 있습니다. 이들의 작전은 우리 국가를 불안정하게 할 뿐 아니라 [UZB.GetFlag] 우즈베키스탄이 군사 행동에 나서도록 자극할 위험도 있습니다.\n\n상황은 심각합니다. 많은 장군들은 IMU의 무분별한 행태가 분쟁을 촉발할 수 있다고 우려합니다. 동시에 [UZB.GetFlag] 우즈베키스탄의 패권적이고 공격적인 태세는 실존적 위협이 되므로, 우리는 선을 지키며 신중하게 행동해야 합니다."
