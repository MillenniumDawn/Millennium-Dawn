 MD_antarctica_news.1.t: "[FROM.GetName]Solicitar unirse al Tratado Antártico"
 MD_antarctica_news.1.d: "[FROM.GetName] has applied to join the Antarctic Treaty, signaling a potential shift in their foreign policy and commitment to environmental conservation. The Antarctic Treaty is an international agreement that regulates the use of Antarctica for peaceful purposes and scientific research, while also protecting the continent's unique ecosystem. [FROM.GetName]'s application to join the treaty has been met with warm reactions from the international community, with some praising the move as a positive step towards global cooperation, while others express skepticism about [FROM.GetName]'s intentions and commitment to the treaty's principles. The application process will take a month to complete."
 MD_antarctica_news.1.a: "El tiempo lo dirá"
 MD_antarctica_news.1.b: "Ya era hora"
 MD_antarctica_news.2.t: "[FROM.GetName]Se adhiere al Tratado Antártico"
 MD_antarctica_news.2.d: "Hoy, [GetDateText], [FROM.GetName] se ha unido oficialmente al Tratado Antártico, convirtiéndose en miembro del acuerdo internacional que regula el uso de la Antártida con fines pacíficos y de investigación científica. Al unirse al tratado, [FROM.GetName] se ha comprometido a defender los principios de conservación ambiental y cooperación internacional en la Antártida. Esta decisión ha sido recibida con reacciones positivas por parte de la comunidad global, con muchos elogiando a [FROM.GetName] por su compromiso con la protección del ecosistema único de la Antártida y la promoción de la colaboración pacífica entre las naciones."
 MD_antarctica_news.2.a: "Otro miembro"
 MD_antarctica_news.2.b: "¡Manos a la obra!"
 MD_antarctica_news.3.t: "[FROM.GetName]Se propone salir del Tratado Antártico"
 MD_antarctica_news.3.d: "[FROM.GetName] ha decidido hoy abandonar el Tratado Antártico. La Comisión para la Conservación de los Recursos Vivos Marinos Antárticos (CCRVMA) les otorga un plazo de 2 años para desmantelar cualquier estación de investigación que posean en la Antártida y evitar cualquier actividad prohibida, como la explotación de recursos o la presencia militar. La decisión de abandonar el tratado ha recibido reacciones encontradas por parte de la comunidad internacional; algunos expresan decepción y preocupación por las posibles consecuencias para el medio ambiente y la cooperación global, mientras que otros apoyan el derecho de [FROM.GetName] a tomar sus propias decisiones respecto a su participación en acuerdos internacionales. El proceso de salida del tratado tardará 2 años en completarse."
 MD_antarctica_news.3.a: "¡Qué vergüenza!"
 MD_antarctica_news.3.b: "Tenemos mejores cosas que hacer"
 MD_antarctica_news.4.t: "[FROM.GetName]Se retira del Tratado Antártico"
 MD_antarctica_news.4.d: "[MD_antarctica_news_4_desc]"
 MD_antarctica_news.4.a: "El Tratado se debilita"
 MD_antarctica_news.4.b: "Lo que sea"
 MD_antarctica_news_4_desc_1: "After 2 years of leaving the Antarctic Treaty, [FROM.GetName] has officially left the international agreement that regulates the use of Antarctica for peaceful purposes and scientific research. Despite the warnings, [FROM.GetName] has left the treaty while having a Research Station in Antarctica, which has caused global response from the Treaty members, including potential sanctions and diplomatic backlash."
 MD_antarctica_news_4_desc_2: "Tras 2 años de haber iniciado su salida del Tratado Antártico, [FROM.GetName] ha abandonado oficialmente el acuerdo internacional que regula el uso de la Antártida con fines pacíficos y de investigación científica. [FROM.GetName] ha desmantelado con éxito todas las estaciones de investigación en la Antártida y ha evitado cualquier actividad prohibida, como la explotación de recursos o la presencia militar, lo que ha ayudado a mitigar las posibles consecuencias para el medio ambiente y la cooperación global."
 MD_antarctica_news.5.t: "Instalaciones de ciclo abierto detectadas en la estación antártica [FROM.GetAdjective]"
 MD_antarctica_news.5.d: "During the recent observer mission, Treaty observers have detected the usage of Open-Loop Utilities in one of the [FROM.GetAdjective] Antarctic research stations. This is a violation of the Antarctic Treaty, which prohibits any activity that may cause environmental harm or disrupt the ecosystem of Antarctica. The detection of Open-Loop Utilities has raised concerns among the Treaty members and may lead to diplomatic consequences."
 MD_antarctica_news.5.a: "Hay gente que tiene que ahorrar"
 MD_antarctica_news.5.b: "Bueno"
 MD_antarctica_news.6.t: "Se han detectado actividades ilegales en un laboratorio de la estación antártica [FROM.GetAdjective]"
 MD_antarctica_news.6.d: "During the recent observer mission, Treaty observers have detected illegal laboratory activities in one of the [FROM.GetAdjective] Antarctic research stations. This behavior is unacceptable and a clear violation of Antarctic Treaty. The Consultative Parties of the Treaty will address this issue and take appropriate actions to ensure the protection of Antarctica's unique ecosystem and the integrity of the treaty."
 MD_antarctica_news.6.a: "Esto es inaceptable"
 MD_antarctica_news.6.b: "Tenemos que hacer algo al respecto"
 MD_antarctica_news.7.t: "Investigación de armas nucleares detectada en la estación antártica [FROM.GetAdjective]"
 MD_antarctica_news.7.d: "During the recent observer mission, Treaty observers have detected nuclear weapon research in one of the [FROM.GetAdjective] Antarctic research stations. This is a severe violation of the Antarctic Treaty, which prohibits any military activity or any activity that may cause environmental harm or disrupt the ecosystem of Antarctica. Using a peaceful research station for construction and testing of nuclear weapons is an outrageous act that threatens the safety and security of the entire world. The Consultative Parties of the Treaty will take immediate and decisive actions to address this issue and hold those responsible accountable for their actions. The international community must come together to condemn this behavior and ensure that Antarctica remains a peaceful and protected environment for scientific research and cooperation."
 MD_antarctica_news.7.a: "¡Esto es indignante!"
 MD_antarctica_news.7.b: "Era más importante"
 MD_antarctica_news.8.t: "[FROM.GetName] Ha incumplido el Tratado Antártico en demasiadas ocasiones"
 MD_antarctica_news.8.d: "After multiple breaches of the Antarctic Treaty, [FROM.GetName] has reached a critical point where the Consultative Parties of the Treaty have decided to remove them from the treaty and impose severe diplomatic consequences. The repeated violations of the treaty's principles and regulations have undermined the integrity of the agreement and threatened the protection of Antarctica's unique ecosystem. The Consultative Parties of the Treaty will take decisive action to ensure that [FROM.GetName] is held accountable for their actions and that the Antarctic Treaty remains a strong and effective framework for international cooperation and environmental conservation."
 MD_antarctica_news.8.a: "Se lo han buscado ellos mismos"
 MD_antarctica_news.8.b: "Esto es demasiado"
 MD_antarctica_news.9.t: "Fuertes vientos en toda la Antártida"
 MD_antarctica_news.9.d: "Se han registrado fuertes vientos en toda la Antártida, lo que ha afectado a las estaciones de investigación. Las Partes Consultivas del Tratado están siguiendo de cerca la situación y prestando apoyo para garantizar la seguridad del personal y la continuidad de las investigaciones en curso. Las misiones de observación quedan suspendidas temporalmente hasta que mejoren las condiciones meteorológicas."
 MD_antarctica_news.9.a: "No está bien"
 MD_antarctica_news.10.t: "[FROM.GetName] Comienza la construcción de una estación de investigación antártica"
 MD_antarctica_news.10.d: "[FROM.GetName]ha iniciado la construcción de una nueva estación de investigación antártica, lo que pone de manifiesto su compromiso con la investigación científica y la conservación del medio ambiente en la región. Se prevé que la construcción de la estación dure varios meses, y las Partes Consultivas del Tratado supervisarán de cerca los avances para garantizar que se cumplan los principios y normas del Tratado Antártico."
 MD_antarctica_news.10.a: "¡Espléndido!"
 MD_antarctica.1.t: "Llega la misión de observadores"
 MD_antarctica.1.d: "[FROM.GetName]ha enviado observadores del Tratado para inspeccionar una de nuestras estaciones de investigación antárticas. Se prevé que la misión llegue en §Y7 días§!."
 MD_antarctica.1.a: "Esperaremos a que lleguen"
 MD_antarctica.3.t: "Informe de la misión de observación: se han detectado servicios públicos de bucle abierto"
 MD_antarctica.3.d: "Los observadores del Tratado han finalizado su inspección de nuestra estación de investigación antártica y han informado de que se ha detectado el uso de sistemas de servicios públicos de bucle abierto. Esto constituye una violación del Tratado Antártico y puede acarrear consecuencias diplomáticas. Las Partes Consultivas del Tratado han solicitado que se tomen medidas para sustituir dichos sistemas por opciones más respetuosas con el medio ambiente."
 MD_antarctica.3.a: "Tenemos que deshacernos de eso"
 MD_antarctica.4.t: "Informe de la misión de observación: se han detectado actividades ilegales en un laboratorio"
 MD_antarctica.4.d: "Los observadores del Tratado han finalizado su inspección de nuestra estación de investigación antártica y han informado de que se han detectado actividades de laboratorio ilegales. Las Partes Consultivas no impondrán más sanciones si cesamos todas las actividades ilegales en nuestra estación."
 MD_antarctica.4.a: "Tenemos que hacer algo al respecto"
 MD_antarctica.5.t: "Informe de la misión de observación: se ha detectado investigación sobre armas nucleares"
 MD_antarctica.5.d: "Los observadores del Tratado han concluido su inspección de nuestra estación de investigación antártica y han informado de que se han detectado actividades de investigación relacionadas con armas nucleares. Se trata de una grave violación del Tratado Antártico que acarreará consecuencias diplomáticas inmediatas. Las Partes Consultivas del Tratado adoptarán medidas decisivas para abordar esta cuestión y exigirán responsabilidades a los responsables de estos hechos, exigiendo el cese inmediato de todas las actividades de investigación nuclear en nuestra estación."
 MD_antarctica.5.a: "¡Tenemos que deshacernos de eso inmediatamente!"
 MD_antarctica.6.t: "Incumplimiento del Tratado Antártico: demasiadas infracciones"
 MD_antarctica.6.d: "Dear [ROOT.GetLeader],\n\nWe regret to inform you that your nation, [ROOT.GetName], has breached the Antarctic Treaty too many times, with a total of [?antarctica_station_reports] violations. As a result, the Consultative Parties of the Treaty have decided to remove [ROOT.GetName] from the treaty within 2 years and impose severe diplomatic consequences. The repeated violations of the treaty's principles and regulations have undermined the integrity of the agreement and threatened the protection of Antarctica's unique ecosystem. We urge you to take this matter seriously and remove the research station, before the membership is revoked.\n\nSincerely,\nThe Consultative Parties of the Antarctic Treaty"
 MD_antarctica.6.a: "Nos lo hemos buscado nosotros mismos"
 MD_antarctica.7.t: "¿Imponer un embargo a [FROM.GetName]?"
 MD_antarctica.7.d: "Due to the recent detection of nuclear weapon research in one of the [FROM.GetAdjective] Antarctic research stations, the Consultative Parties of the Antarctic Treaty are considering imposing an embargo on [FROM.GetName]. This would involve restricting trade and diplomatic relations with [FROM.GetName] in response to their violation of the treaty's principles and regulations."
 MD_antarctica.7.a: "Tienen que pagar por lo que han hecho"
 MD_antarctica.7.b: "No merece la pena"
 MD_antarctica.9.t: "Módulo de la estación antártica dañado"
 MD_antarctica.9.d: "Un módulo de una de nuestras estaciones de investigación antárticas ha sufrido daños a causa de una ventisca. Los ingenieros están preparando las reparaciones y comenzarán tan pronto como mejoren las condiciones meteorológicas.\n\nLas reparaciones comenzarán cuando termine la ventisca (§Y[?global.antarctica_blizzard_days_remaining|0]§! días restantes de ventisca) y tardarán §Y14§! días en completarse. Puedes ver el tiempo restante en la vista de la estación y en la información emergente del módulo dañado."
 MD_antarctica.9.a: "¡Maldito tiempo!"
 MD_antarctica.10.t: "Dismantling of the annexed country's Antarctic Research Station"
 MD_antarctica.10.d: "Debido a la anexión del país al que pertenecía la estación de investigación, esta ha sido desmantelada."
 MD_antarctica.10.a: "Vale"
 ANT_nukes_research_discovered_idea: "Se descubre una estación antártica dedicada a la investigación sobre armas nucleares"
 ANT_nukes_research_discovered_idea_desc: "Este país infringió el principio de prohibición total de la investigación militar en la Antártida al llevar a cabo investigaciones relacionadas con las armas nucleares."
 antarctica_small_treaty_admin_cost_1: "Administración del Tratado sobre la Antártida"
 antarctica_small_treaty_admin_cost_1_desc: "Este país ha firmado un tratado antártico menor (CCFA o CCRVMA), lo que aumenta la sobrecarga administrativa para la acción política"
 antarctica_small_treaty_admin_cost_2: "Administración ampliada del Tratado Antártico"
 antarctica_small_treaty_admin_cost_2_desc: "Este país ha firmado ambos tratados antárticos menores (CCFA y CCRVMA), lo que exige mayores recursos para la administración y el cumplimiento de los tratados."
 ANT_kicked_from_treaty_idea: "Expulsado del Tratado de la Antártida"
 ANT_kicked_from_treaty_idea_desc: "Debido a las reiteradas violaciones del Tratado Antártico, este país ha sido excluido del acuerdo y no podrá volver a incorporarse durante los próximos dos años."
 ANT_illegal_extraction_idea: "Extracción ilegal de recursos en la Antártida"
 ANT_illegal_extraction_idea_desc: "Nuestras relaciones con otros países se han deteriorado porque somos de los pocos que no queremos intercambiar recursos valiosos a cambio de conservar unas bonitas vistas de un páramo helado. Les importa demasiado ese bloque helado."
 ANT_military_training_idea: "Entrenamiento militar ilegal en la Antártida"
 ANT_military_training_idea_desc: "No hay mejor lugar que la Antártida para preparar a nuestros soldados para una ofensiva invernal."
