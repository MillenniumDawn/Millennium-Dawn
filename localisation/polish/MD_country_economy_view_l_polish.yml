 TREASURY_TOOLTIP_DELAYED: "Nasz skarbiec odzwierciedla ilość środków dostępnych do wydania i może być wykorzystywany do dokonywania zakupów oraz inwestycji. Jeśli saldo skarbca spadnie poniżej zera, co tydzień automatycznie zaciągane będzie zadłużenie, aby utrzymać dodatni stan środków.\n\n§t Ekran gospodarki przeniesiono do zakładki handlu. §!"
