 UKR_storage_item_9p148_tt: "§Y9П148 «Конкурс»§!\n\n\n£SOV_LAND_HAT2\n\n\n\nНа хранении: §Y[?ukraine_has_9p148_stockpile|0]§!\nПоколение: противотанковый ракетный комплекс второго поколения, на вооружении с 1974 года.\nТип техники: §YСамоходный ПТРК§!\n\nВарианты на хранении:\n• 9П148 «Конкурс»: §Y[?ukraine_has_9p148_stockpile|0]§!\n\nИстребитель танков на шасси §YБРДМ-2§! с полуавтоматическими ракетами §Y«Конкурс»§!. Наши дивизии вместо них используют §Y9П149 «Штурм-С»§!; §YКБ «Луч»§! может переоборудовать эти машины под пусковую установку §Y«Барьер-В»§!."
