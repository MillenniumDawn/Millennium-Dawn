 EU_recently_retired_from_an_eu_office_tt: "§Y[ROOT.GetNameWithFlag]§!이(가) 최근에 유럽연합(EU) 직위에서 퇴임한 이력이 없어야 합니다. (신규 관직 취임까지 남은 일수: [?recently_retired_from_an_eu_office:days_left|Y0]일)\n"
 EU_does_not_hold_another_office_tt: "§Y[ROOT.GetNameWithFlag]§!이(가) 현재 다른 §C[EUU.GetFlag][EUU.GetName]§! 직위를 보유하고 있지 않습니다.\n"
 EU_president_council_tt: "§Y유럽 정상회의 상임의장§!은 27개 회원국 국가원수 및 정부수반으로 구성된 유럽 정상회의의 회의를 주재하고 작업을 추진하며, 세계 무대에서 §C[EUU.GetFlag][EUU.GetName]§!을(를) 대표하는 수석 대표입니다. 이 기구는 국가원수 및 정부수반 회의와 유럽집행위원회(EC) 위원장으로 구성되며, 유럽연합(EU) 전체에 정치적 방향을 제시합니다.\n\n§Y관직 특권:§!\n이 직위를 보유하면 다른 회원국에 대한 영향력 요구 조건 없이도 법안을 투표에 상정할 수 있습니다.\n\n친유럽주의 운동 및 유럽회의주의 운동의 성공률이 §G+10%§! 증가합니다.\n\n[!eu_president_council_back_click]\n"
 eu_president_commission_tt: "§Y유럽집행위원회(EC) 위원장§!은 §C[EUU.GetFlag][EUU.GetName]§! 행정부의 수반입니다. 위원장은 유럽 의회(EP)에 공동으로 책임을 지는 위원단(위원회의)을 이끌고 있습니다. 위원장은 필요에 따라 위원들 간의 포트폴리오를 분배하거나 개각 및 해임할 권한을 가집니다. 유럽집행위원회(EC)는 유럽연합(EU) 법률이 될 법안을 제안할 수 있는 유일한 기구입니다.\n\n§Y직위 특권:§!\n이 직위를 보유하면 다른 회원국에 대한 영향력 요구 조건 없이도 법안을 투표에 상정할 수 있습니다.\n\n친유럽주의 운동 및 유럽회의주의 운동의 성공률이 §G+10%§! 증가합니다.\n\n이 직위를 보유하면 영향력과 무관하게 3단계 초과의 위반 행위를 저지른 회원국의 자격을 정지할 수 있습니다.\n\n[!eu_president_commission_back_click]\n"
 EU_high_representative_tt: "§Y외교안보정책 고위대표§!는 유럽연합(EU) 내 공동외교안보정책(CSDP)의 총괄 조정자이자 대표입니다. 종종 '유럽연합(EU) 외교장관'으로 줄여 부르며, 주로 회원국들을 대신해 외교 정책을 조율합니다.\n\n§Y직위 특권:§!\n\n[!foreign_affairs_security_back_click]\n"
 EU_president_european_parliament_tt: "§Y유럽 의회(EP) 의장§!은 유럽 의회(EP)의 토론과 활동을 주재합니다. 이들은 모든 법적 문제 및 대외 관계, 특히 국제 관계에서 유럽 의회(EP)를 대표합니다. 임기는 2년 6개월이며, §C[EUU.GetFlag][EUU.GetName]§! 예산안 및 공동결정절차에 따라 채택된 연합 법안의 서명에 의장의 서명이 필수적입니다.\n\n§Y직위 특권:§!\n이 직위를 보유하면 다른 회원국에 대한 영향력 요구 조건 없이도 법안을 투표에 상정할 수 있습니다.\n\n친유럽주의 운동 및 유럽회의주의 운동의 성공률이 §G+10%§! 증가합니다.\n\n[!eu_parliament_president_back_click]\n"
 EU_central_bank_president_tt: "§Y유럽중앙은행(ECB) 총재§!는 유로화 관리와 유로존 내 유럽연합(EU)의 통화 정책을 담당하는 유럽중앙은행(ECB)을 이끌며 중추적인 위치를 가집니다. 집행이사회, 정책이사회, 일반이사회의 수장을 맡으며 대외적으로 유럽중앙은행(ECB)을 대표합니다.\n\n§Y직위 특권:§!\n이 직위를 보유하면 유럽중앙은행(ECB)의 전면적 통화조치(OMT) 프로그램을 개시, 확대 또는 축소하여 이자율이 높은 회원국들의 금리를 일시적으로 낮출 수 있습니다.\n\n[!eu_central_bank_president_back_click]\n"
 EU_central_bank_idea_president_tt: "§C유럽 회원국§!에 대한 투자 시 $investment_cost_modifier$ 및 $investment_duration_modifier$ 수치가 §G15%§! 보정됩니다.\n"
 EU_ministry_of_economy_and_finance_tt: "§Y유럽 경제재정장관§!은 유럽 경제 정부를 수반으로 이끌며, 재정 동맹에 의해 부여된 권한을 행사합니다. 장관은 조세 당국, 회원국의 최저 임금 및 기타 경제·재정적 결정을 감독할 책임을 집니다.\n\n§Y직위 특권:§!\n\n이 직위를 보유하면 모든 영향력 요구 조건을 무시하고 언제든 예산안 초안을 유럽 의회(EP) 의사일정에 상정할 수 있습니다.\n\n[!eu_minister_economy_finance_back_click]\n"
 EU_ministry_of_economy_and_finance_idea_tt: "§C유럽 회원국§!에 대한 투자 시 $investment_cost_modifier$ 및 $investment_duration_modifier$ 수치가 §G5%§! 보정됩니다.\n"
 EU_frontex_director_tt: "§Y프론텍스(Frontex) 사무총장§!은 유럽국경해안경비청(EBCG, 통칭 프론텍스)을 통괄합니다. 프론텍스(Frontex)의 목적은 유럽의 대외 국경을 수호하기 위한 현장 회원국들의 노력을 지원하는 것입니다. 또한 자유·안보·정의 영역(AFSJ)을 지원하기 위해 솅겐 지역에 대한 국경 통제를 수행합니다.\n\n§Y직위 특권:§!\n\n이 직위를 보유하면 임기 동안 프론텍스(Frontex) 병력에 대한 일시적인 통제권을 장악할 수 있습니다.\n\n[!eu_frontex_director_back_click]\n"
 EU_sec_general_euro_army_tt: "§Y유로아미(EuroArmy) 사무총장§!은 유럽연합(EU) 유로아미(EuroArmy)의 수장입니다. 회원국들의 연합 및 공동 군대인 유로아미(EuroArmy)의 조율을 담당합니다.\n\n§Y직위 특권:§!\n\n이 직위를 보유하면 임기 동안 유로아미(EuroArmy) 병력에 대한 일시적인 통제권을 장악할 수 있습니다.\n[!eu_sec_general_euro_army_back_click]\n"
 EU_sec_general_euro_navy_tt: "§Y유로네이비(EuroNavy) 사무총장§!은 유럽연합(EU) 유로네이비(EuroNavy)의 수장입니다. 유럽연합(EU)의 연합 및 공동 해군 전력인 유로네이비(EuroNavy)의 조율을 담당합니다.\n\n§Y직위 특권:§!\n\n이 직위를 보유하면 회원국들의 해군 통제권을 인수하여 단일 유럽 함대로 통합할 수 있습니다.\n[!eu_sec_general_euro_navy_back_click]\n"
 EU_ambassador_to_un_tt: "§Y유엔 주재 유럽연합(EU) 대사§!는 유럽연합(EU) 모든 회원국들의 외교 사절단과 조율하여 유엔에서 유럽연합(EU)을 대표합니다.\n\n§Y직위 특권:§!\n이 직위를 보유한 국가는 '유엔 안전보장이사회(UNSC) 상임이사국' 국가 정신을 획득합니다.\n\n[!eu_ambassador_to_un_back_click]\n"
 EU_president_of_the_eurofederation_tt: "§Y유럽 연방 대통령§!은 합법적인 선거를 통해 선출된 유럽 연방의 지도자입니다. 유럽 연방은 유럽연합(EU)의 최종 연방화 단계 중 하나로, 이 직위는 매우 막강한 권력을 가집니다.\n\n§Y직위 특권:§!\n\n[!eu_pres_federation_back_click]\n"
