 IND_disasters_mechanic: "인도네시아의 지독한 악운"
 IND_disasters_mechanic_desc: "Indonesia is very lucky to have an abundance of natural resources, manpower and will-power to charge through the 21st century.\nHowever, §HIndonesia faces many challenges§! that §Rhinder its progress§!. Accidents are a §Rcommon theme§!, which could easily be prevented with better care for a particular region.\n\nFor this reason, it is our duty and responsibility to pay more attention to our states in a timely manner in order to avoid a disastrous fate that would cause us serious harm.\n\nWe will continue to have disasters for a considerable amount of time, however if we tackle them quickly they eventually stop after some time!"
 IND_back_muslim: "무슬림에 대한 지원"
 IND_back_muslim_desc: "We are an Islamic nation! Therefore, we must protect our muslims no matter the cost. Doing so, will win us popular support and root out any hatred towards us in Islamic majority Sulawesi\n\n\n\nNegotiating is invaluable and must begin immediately!"
 IND_muslim: "Negotiate terms with Muslims in Sulawesi"
