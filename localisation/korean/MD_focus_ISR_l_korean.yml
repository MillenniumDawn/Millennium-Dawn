 isr_armour_production_1: "장갑차량 생산"
 isr_armour_production_2: "장갑차량 생산"
 west_bank_barrier_no_settlements: "서안 장벽"
 west_bank_barrier_no_settlements_desc: "1949년 휴전선을 따라, 그리고 그 인근에 이어지는 연속적인 보안 장벽으로, 서안 지구로부터의 침투를 막기 위해 설계되었습니다. 이스라엘 정착촌 지구를 에워싸지 않고 건설되어 더 직선적인 경로를 따르며, 팔레스타인의 공격에 맞서 강력한 방어 거점을 제공합니다."
 west_bank_barrier_with_settlements: "서안 장벽"
 west_bank_barrier_with_settlements_desc: "주요 이스라엘 정착촌 지구를 경계 안에 포함하도록 건설된 보안 장벽으로, 장벽의 경로가 서안 깊숙이 뻗어 있습니다. 더 길고 복잡한 경로 탓에 그린 라인에 더 가깝게 맞춘 장벽에 비해 작전 효율이 다소 떨어집니다."
 settlement_removal_plans_1: "정착촌 철거 계획"
 settlement_removal_plans_1_desc: "서안 지구의 고립된 이스라엘 정착촌을 철거하기 위한 초기 기획 단계입니다. 조사단이 파견되었고 보상 체계가 초안 작성 중입니다. 아직 정착민에게는 통보되지 않았습니다."
 settlement_removal_plans_2: "정착촌 철거 계획"
 settlement_removal_plans_2_desc: "정부는 지정된 첫 정착촌의 주민들에게 철수가 필요하다고 공식 통보했습니다. 법적 이의 제기가 예상되며, 철수 과정의 보안 대책은 이스라엘 국방군과 조율 중입니다."
 settlement_removal_plans_3: "정착촌 철거 계획"
 settlement_removal_plans_3_desc: "지정된 정착촌의 1차 철수가 진행 중입니다. 보상금 지급이 시작되었고 임시 주거지가 마련되었습니다. 정착민 운동의 반발이 거세지고 있어 연립 정부에 상당한 압력이 되고 있습니다."
 settlement_removal_plans_4: "정착촌 철거 계획"
 settlement_removal_plans_4_desc: "대상 정착촌의 대다수가 철수 및 해체되었습니다. 이스라엘 국방군은 새로운 안보 방어선으로 재배치되었습니다. 국내적으로는 이 과정이 이스라엘 사회의 분열을 심화시켰으나, 국제사회의 반응은 대체로 긍정적이었습니다."
 settlement_removal_plans_5: "정착촌 철거 계획"
 settlement_removal_plans_5_desc: "정착촌 철거 프로그램이 완료되었습니다. 지정된 모든 전초기지가 철수되었고 토지는 팔레스타인 민정 당국에 반환되었습니다. 정부는 이제 이 과정의 정치적 결과에 직면해 있으며, 강경파는 그 결과를 되돌리거나 이의를 제기하려 하고 있습니다."
 ISR_Leaves_Gaza: "이스라엘, 가자에서 철수"
 ISR_USA_refused_to_share_modifier: "미국이 우리의 공군 증원 요청을 거절했습니다."
 israel_bombing_category: "전쟁 사이의 전쟁"
