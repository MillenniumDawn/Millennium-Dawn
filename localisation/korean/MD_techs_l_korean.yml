 SPACE_TITLE_SPACE_WEAPONS_DESC: "위성 요격 무기와 운동체 폭격"
 SPACE_TITLE_OLV: "궤도 우주 발사체"
 SPACE_TITLE_OLV_DESC: "발사체 또는 운반체 로켓은 로켓 추진체로, 지구 표면에서 우주로, 보통 지구 궤도 또는 그 너머로, 화물을 운반하는 데 사용됩니다."
 BALLISTIC_MISSILES_TITLE_IRBM: "중거리 탄도미사일"
 BALLISTIC_MISSILES_TITLE_IRBM_DESC: "중거리 탄도 미사일(IRBM)은 사정거리가 1000-5000km인 탄도 미사일입니다."
 BALLISTIC_MISSILES_TITLE_ICBM: "대륙간 탄도미사일"
 BALLISTIC_MISSILES_TITLE_ICBM_DESC: "대륙간탄도미사일(ICBM)은 주로 하나 이상의 열핵탄두를 운반하기 위해 설계된 최소 사거리 6000km의 미사일입니다."
 CRUISE_MISSILES_TITLE_HSCM: "초음속\n순항 미사일"
 CRUISE_MISSILES_TITLE_HSCM_DESC: "극초음속 순항 미사일(HSCM)은 음속의 최소 5배(마하 5)를 이동합니다."
 CRUISE_MISSILES_TITLE_GLCM: "지상 발사 순항 미사일"
 CRUISE_MISSILES_TITLE_GLCM_DESC: "지상 발사 순항 미사일 (GLCM)은 지상 기반 순항 미사일입니다."
 MISSILE_DEFENCE_TITLE_SAM: "지대공 미사일"
 MISSILE_DEFENCE_TITLE_SAM_DESC: "지대공 미사일 (SAM)은 항공기나 다른 미사일을 파괴하기 위해 지상에서 발사되도록 설계된 미사일입니다."
 tech_vls_surface_1: "VLS Surface-Attack Missiles 1975"
 tech_vls_surface_1_desc: "Early vertical-launch surface-attack missile concepts place long-range strike weapons in protected launch cells, allowing warships to fire land-attack missiles without relying on exposed deck launchers or trainable mounts."
 tech_vls_surface_2: "VLS Surface-Attack Missiles 1985"
 tech_vls_surface_2_desc: "Modern VLS surface-attack missiles give warships a compact, rapid-response strike capability, launching cruise missiles from below-deck cells against coastal defenses, airfields, command centers, and other fixed targets."
 tech_vls_surface_3: "VLS Surface-Attack Missiles 2000"
 tech_vls_surface_3_desc: "Improved VLS strike systems integrate better navigation, mission planning, and all-weather guidance, allowing surface ships to deliver precise long-range attacks deep inland from standoff distances."
 tech_vls_surface_4: "VLS Surface-Attack Missiles 2015"
 tech_vls_surface_4_desc: "Advanced VLS surface-attack missiles use upgraded datalinks, improved seekers, and flexible flight profiles to strike defended land targets, relocate aimpoints in flight, and support coordinated naval strike operations."
 tech_vls_aa_1: "VLS Surface-to-Air Missiles 1975"
 tech_vls_aa_1_desc: "Early vertical-launch surface-to-air missile concepts place fleet air-defense weapons in protected launch cells, allowing warships to respond faster against aircraft and incoming missiles without relying on exposed trainable launchers."
 tech_vls_aa_2: "VLS Surface-to-Air Missiles 1985"
 tech_vls_aa_2_desc: "Modern VLS surface-to-air missiles give warships a rapid-reaction fleet defense capability, launching Standard-type interceptors from below-deck cells against aircraft, anti-ship missiles, and other aerial threats."
 tech_vls_aa_3: "VLS Surface-to-Air Missiles 2000"
 tech_vls_aa_3_desc: "Improved VLS air-defense systems integrate area-defense interceptors, short-range defensive missiles, radar guidance, and combat-system coordination, allowing ships to protect themselves and nearby fleet units from layered air attacks."
 tech_vls_aa_4: "VLS Surface-to-Air Missiles 2015"
 tech_vls_aa_4_desc: "Advanced VLS surface-to-air missiles combine active seekers, upgraded datalinks, and integrated air-defense processing to engage aircraft, cruise missiles, ballistic missile threats, and complex saturation attacks."
 module_light_flight_deck_2: "다목적 헬리콥터 공격 체계"
 module_light_flight_deck_2_desc: "Multipurpose Helicopter Assault platforms expand upon amphibious transport designs by emphasizing rotary-wing operations. Enhanced flight decks and command facilities improve troop deployment, logistical support, and rapid response capabilities.\n\n§GDesigner Hint: Light Flight Decks trade Cannon Attack for Deck Size as tiers advance. Use the Transport Dock for direct firepower or later assault decks for embarked aviation.§!"
 module_ciws_1_desc: "초기 근접방어무기체계(CIWS)는 다가오는 미사일과 항공기에 대한 최후의 방어선을 제공합니다. 레이더 유도 기관포를 사용하는 이 체계는 현대 군함에 제한적이나 중요한 점방어 능력을 부여합니다.\n\n§G설계 힌트: 이 점방어 체계는 대공과 장갑을 향상시키고 체력을 소폭 높입니다. 항공 및 미사일 위협에 유용하지만 생산 비용, 연료 소모, 인력, 수상 가시성이 증가합니다.§!"
 module_ciws_2_desc: "레이더 추적과 사격통제 체계의 개선으로 근접방어무기체계의 효율이 높아졌습니다. 더 빠른 반응 속도와 향상된 정확도가 초기 대함 미사일에 대한 생존성을 높여 줍니다.\n\n§G설계 힌트: 이 점방어 체계는 대공과 장갑을 향상시키고 체력을 소폭 높입니다. 항공 및 미사일 위협에 유용하지만 생산 비용, 연료 소모, 인력, 수상 가시성이 증가합니다.§!"
 module_ciws_3_desc: "3세대 CIWS는 첨단 센서와 전산화된 조준 체계를 통합하여 교전 거리를 늘리고 초음속 위협에 대한 요격 성공률을 높입니다.\n\n§G설계 힌트: 이 점방어 체계는 대공과 장갑을 향상시키고 체력을 소폭 높입니다. 항공 및 미사일 위협에 유용하지만 생산 비용, 연료 소모, 인력, 수상 가시성이 증가합니다.§!"
 module_ciws_4_desc: "현대식 근접방어무기체계는 정교한 레이더, 전자광학 조준, 더 높은 발사 속도의 무기를 결합합니다. 이러한 체계는 포화 미사일 공격에 대한 점방어 성능을 크게 향상시킵니다.\n\n§G설계 힌트: 이 점방어 체계는 대공과 장갑을 향상시키고 체력을 소폭 높입니다. 항공 및 미사일 위협에 유용하지만 생산 비용, 연료 소모, 인력, 수상 가시성이 증가합니다.§!"
 module_ciws_5_desc: "고도로 자동화된 CIWS 플랫폼은 네트워크 센서와 향상된 추적 알고리즘을 활용하여 첨단 순항미사일과 정밀 유도 무기에 더 높은 신뢰도로 대응합니다.\n\n§G설계 힌트: 이 점방어 체계는 대공과 장갑을 향상시키고 체력을 소폭 높입니다. 항공 및 미사일 위협에 유용하지만 생산 비용, 연료 소모, 인력, 수상 가시성이 증가합니다.§!"
 module_ciws_6_desc: "최첨단 근접방어무기체계는 점방어 기술의 정수를 보여주며, 최첨단 센서, 인공지능 보조 조준, 신속 대응 요격체를 도입하여 가장 진보된 미사일 위협도 격파합니다.\n\n§G설계 힌트: 이 점방어 체계는 대공과 장갑을 향상시키고 체력을 소폭 높입니다. 항공 및 미사일 위협에 유용하지만 생산 비용, 연료 소모, 인력, 수상 가시성이 증가합니다.§!"
 module_heavy_guns_1_desc: "초기 중구경 함포 체계는 수상함에 함선과 해안 표적에 대한 기본적인 장거리 화력을 제공합니다.\n\n§G설계 힌트: 중구경 함포는 높은 포 공격력과 함선 체력을 제공하지만 포 관통력은 없습니다. 해안 포격과 비장갑 함선과의 교전에 사용하되, 상당한 IC, 인력, 연료 비용과 가시성 증가를 감수해야 합니다.§!"
 module_heavy_guns_2_desc: "개량된 중구경 함포는 더 높은 발사 속도, 더 나은 정확도, 증가한 포탄 속도를 제공하여 해상 교전에 유리합니다.\n\n§G설계 힌트: 중구경 함포는 높은 포 공격력과 함선 체력을 제공하지만 포 관통력은 없습니다. 해안 포격과 비장갑 함선과의 교전에 사용하되, 상당한 IC, 인력, 연료 비용과 가시성 증가를 감수해야 합니다.§!"
 module_heavy_guns_3_desc: "현대식 중구경 함포는 첨단 사격통제 체계, 안정화 장치, 개선된 탄약을 통합하여 뛰어난 장거리 전투 성능을 발휘합니다.\n\n§G설계 힌트: 중구경 함포는 높은 포 공격력과 함선 체력을 제공하지만 포 관통력은 없습니다. 해안 포격과 비장갑 함선과의 교전에 사용하되, 상당한 IC, 인력, 연료 비용과 가시성 증가를 감수해야 합니다.§!"
 module_ram_1_desc: "초기 롤링 에어프레임 미사일(RAM) 체계는 다가오는 항공기와 대함 미사일에 대한 경량 미사일 기반 점방어 수단을 제공합니다. 사거리와 유도 정교함은 제한적이지만 함선의 방어 능력을 크게 높여 줍니다.\n\n§G설계 힌트: RAM 체계는 점방어를 위한 강력한 대공과 장갑을 제공하며 체력도 어느 정도 높여 줍니다. 항공 및 미사일 위협에 유용하지만 포 기반 방어 체계보다 IC, 연료, 인력 비용이 높습니다.§!"
 module_ram_2_desc: "탐색기 기술과 미사일 반응성의 개선으로 RAM 체계의 효율이 높아졌습니다. 향상된 추적 및 요격 신뢰도가 초기 세대 순항미사일에 대한 더 나은 방어를 가능하게 합니다.\n\n§G설계 힌트: RAM 체계는 점방어를 위한 강력한 대공과 장갑을 제공하며 체력도 어느 정도 높여 줍니다. 항공 및 미사일 위협에 유용하지만 포 기반 방어 체계보다 IC, 연료, 인력 비용이 높습니다.§!"
 module_ram_3_desc: "3세대 RAM 체계는 향상된 이중 모드 유도와 더 빠른 반응 속도를 도입하여 기동하는 위협과 초음속 위협에 대한 명중 확률을 높입니다.\n\n§G설계 힌트: RAM 체계는 점방어를 위한 강력한 대공과 장갑을 제공하며 체력도 어느 정도 높여 줍니다. 항공 및 미사일 위협에 유용하지만 포 기반 방어 체계보다 IC, 연료, 인력 비용이 높습니다.§!"
 module_ram_4_desc: "현대식 RAM 발사기는 첨단 탐색기와 향상된 사격통제 통합을 갖추어 포화 공격과 저피탐 미사일 위협에 대한 더 효과적인 방어를 가능하게 합니다.\n\n§G설계 힌트: RAM 체계는 점방어를 위한 강력한 대공과 장갑을 제공하며 체력도 어느 정도 높여 줍니다. 항공 및 미사일 위협에 유용하지만 포 기반 방어 체계보다 IC, 연료, 인력 비용이 높습니다.§!"
 module_ram_5_desc: "고도로 발전한 RAM 체계는 네트워크 센서 데이터와 정제된 유도 알고리즘의 혜택을 받아 복잡한 전투 환경에서도 현대식 정밀 유도 무기를 안정적으로 요격합니다.\n\n§G설계 힌트: RAM 체계는 점방어를 위한 강력한 대공과 장갑을 제공하며 체력도 어느 정도 높여 줍니다. 항공 및 미사일 위협에 유용하지만 포 기반 방어 체계보다 IC, 연료, 인력 비용이 높습니다.§!"
 module_ram_6_desc: "최첨단 RAM 플랫폼은 미사일 기반 점방어의 정점으로서, 최첨단 유도 체계, 향상된 대응책 저항력, 신속한 교전 능력을 통합하여 가장 진보된 항공 위협을 격파합니다.\n\n§G설계 힌트: RAM 체계는 점방어를 위한 강력한 대공과 장갑을 제공하며 체력도 어느 정도 높여 줍니다. 항공 및 미사일 위협에 유용하지만 포 기반 방어 체계보다 IC, 연료, 인력 비용이 높습니다.§!"
 module_torpedoes_1_desc: "초기 대잠 어뢰는 잠수함에 대한 기본적인 수중 타격 능력을 제공합니다. 사거리와 유도 능력은 제한적이지만 함선이 수중 위협에 대응하는 능력을 높여 줍니다.\n\n§G설계 힌트: 대잠 어뢰는 탐지된 잠수함을 격침하기 위한 강력한 대잠수함전 능력을 제공합니다. 전담 호위함과 사냥함에 유용하지만 생산, 연료, 인력 비용이 증가하며 수상함에는 도움이 되지 않습니다.§!"
 module_torpedoes_2_desc: "개량된 대잠 어뢰는 향상된 소나 유도 및 추진 체계를 갖추어 현대식 잠수함에 대한 탐지 및 교전 효율을 높입니다.\n\n§G설계 힌트: 대잠 어뢰는 탐지된 잠수함을 격침하기 위한 강력한 대잠수함전 능력을 제공합니다. 전담 호위함과 사냥함에 유용하지만 생산, 연료, 인력 비용이 증가하며 수상함에는 도움이 되지 않습니다.§!"
 module_torpedoes_3_desc: "현대식 대잠 어뢰는 첨단 유도 알고리즘과 더 빠른 속도를 도입하여 회피하는 잠수함 표적을 더 안정적으로 요격할 수 있게 합니다.\n\n§G설계 힌트: 대잠 어뢰는 탐지된 잠수함을 격침하기 위한 강력한 대잠수함전 능력을 제공합니다. 전담 호위함과 사냥함에 유용하지만 생산, 연료, 인력 비용이 증가하며 수상함에는 도움이 되지 않습니다.§!"
 module_torpedoes_4_desc: "고도로 발전한 대잠 어뢰는 정교한 센서, 향상된 대응책 저항력, 더 긴 사거리를 활용하여 복잡한 작전 환경에서도 잠수함을 효과적으로 공격할 수 있게 합니다.\n\n§G설계 힌트: 대잠 어뢰는 탐지된 잠수함을 격침하기 위한 강력한 대잠수함전 능력을 제공합니다. 전담 호위함과 사냥함에 유용하지만 생산, 연료, 인력 비용이 증가하며 수상함에는 도움이 되지 않습니다.§!"
 module_torpedoes_5_desc: "차세대 대잠 어뢰는 은밀한 접근, 지능형 표적 선정, 연장된 항속 시간을 강조하여 뛰어난 수중 위협 무력화 능력을 제공합니다.\n\n§G설계 힌트: 대잠 어뢰는 탐지된 잠수함을 격침하기 위한 강력한 대잠수함전 능력을 제공합니다. 전담 호위함과 사냥함에 유용하지만 생산, 연료, 인력 비용이 증가하며 수상함에는 도움이 되지 않습니다.§!"
 module_torpedoes_6_desc: "최첨단 대잠 어뢰는 대잠수함전 기술의 정점으로서, 인공지능 보조 유도, 극한의 속도, 첨단 대대응책 체계를 통합하여 현대 수중 전장을 지배합니다.\n\n§G설계 힌트: 대잠 어뢰는 탐지된 잠수함을 격침하기 위한 강력한 대잠수함전 능력을 제공합니다. 전담 호위함과 사냥함에 유용하지만 생산, 연료, 인력 비용이 증가하며 수상함에는 도움이 되지 않습니다.§!"
 module_aa_guns_1_desc: "초기 대공포 체계는 적 항공기에 대한 기본적인 방어를 제공합니다. 근거리에서는 효과적이어서 함선을 공중 공격으로부터 보호하는 데 도움이 되지만, 발사 속도와 조준 정밀도는 제한적입니다.\n\n§G설계 힌트: 대공포는 대공과 장갑을 향상시켜, 적 항공기로부터 전담 방호가 필요한 함선에 유용합니다.§!"
 module_aa_guns_2_desc: "개량된 대공포는 더 높은 발사 속도와 향상된 조준 체계를 갖추어, 함선이 더 빠르고 기동성 높은 항공기와 더 잘 교전할 수 있게 합니다.\n\n§G설계 힌트: 대공포는 대공과 장갑을 향상시켜, 적 항공기로부터 전담 방호가 필요한 함선에 유용합니다.§!"
 module_aa_guns_3_desc: "현대식 대공포는 첨단 사격통제 및 안정화 장치를 통합하여 고속 및 저공 비행 위협을 안정적으로 추적하고 교전할 수 있게 합니다.\n\n§G설계 힌트: 대공포는 대공과 장갑을 향상시켜, 적 항공기로부터 전담 방호가 필요한 함선에 유용합니다.§!"
 module_aa_guns_4_desc: "고도로 발전한 대공포 체계는 자동 조준과 향상된 탄약을 활용하여 대규모 공습과 정밀 유도 무기에 대한 효과적인 방어를 제공합니다.\n\n§G설계 힌트: 대공포는 대공과 장갑을 향상시켜, 적 항공기로부터 전담 방호가 필요한 함선에 유용합니다.§!"
 module_aa_guns_5_desc: "차세대 대공포는 속사 능력, 통합 센서 네트워크, 뛰어난 정확도를 결합하여 현대 및 신흥 항공 위협에 대한 포괄적인 방공을 제공합니다.\n\n§G설계 힌트: 대공포는 대공과 장갑을 향상시켜, 적 항공기로부터 전담 방호가 필요한 함선에 유용합니다.§!"
 module_radar_1_desc: "초기 해군 레이더 체계는 수상 및 항공 위협에 대한 기본적인 탐지를 제공합니다. 사거리와 해상도는 제한적이지만 함대 작전에 필요한 기초적인 상황 인식을 제공합니다.\n\n§G설계 힌트: 레이더는 수상 탐지와 잠수함 탐지를 향상시키는 동시에 대함 미사일, 어뢰 공격력, 대공을 강화합니다. 범용 전투함에 적합하지만 소나보다 IC와 마이크로칩 비용이 높습니다.§!"
 module_radar_2_desc: "개량된 레이더 체계는 더 긴 탐지 거리와 더 나은 표적 해상도를 갖추어, 함선이 위협을 더 일찍 식별하고 방어 행동을 더 효과적으로 조율할 수 있게 합니다.\n\n§G설계 힌트: 레이더는 수상 탐지와 잠수함 탐지를 향상시키는 동시에 대함 미사일, 어뢰 공격력, 대공을 강화합니다. 범용 전투함에 적합하지만 소나보다 IC와 마이크로칩 비용이 높습니다.§!"
 module_radar_3_desc: "현대식 레이더 플랫폼은 첨단 신호 처리와 자동 추적을 통합하여 잡음이 많은 환경에서도 고속 항공기와 수상 표적의 탐지를 향상시킵니다.\n\n§G설계 힌트: 레이더는 수상 탐지와 잠수함 탐지를 향상시키는 동시에 대함 미사일, 어뢰 공격력, 대공을 강화합니다. 범용 전투함에 적합하지만 소나보다 IC와 마이크로칩 비용이 높습니다.§!"
 module_radar_4_desc: "고도로 발전한 레이더 체계는 다중 표적 추적, 향상된 사거리, 전자 대응책에 대한 저항력을 제공하여 분쟁 지역에서도 신뢰할 수 있는 상황 인식을 보장합니다.\n\n§G설계 힌트: 레이더는 수상 탐지와 잠수함 탐지를 향상시키는 동시에 대함 미사일, 어뢰 공격력, 대공을 강화합니다. 범용 전투함에 적합하지만 소나보다 IC와 마이크로칩 비용이 높습니다.§!"
 module_radar_5_desc: "차세대 레이더 체계는 장거리 탐지, 정밀 조준, 함상 전투 체계와의 매끄러운 통합을 결합하여 함대 전체의 위협 대응력을 크게 높입니다.\n\n§G설계 힌트: 레이더는 수상 탐지와 잠수함 탐지를 향상시키는 동시에 대함 미사일, 어뢰 공격력, 대공을 강화합니다. 범용 전투함에 적합하지만 소나보다 IC와 마이크로칩 비용이 높습니다.§!"
 module_radar_6_desc: "근미래 레이더 플랫폼은 인공지능 보조 신호 분석, 다중 스펙트럼 탐지, 저피탐 표적에 대한 첨단 추적을 갖추어 뛰어난 해상 상황 인식을 가능하게 합니다.\n\n§G설계 힌트: 레이더는 수상 탐지와 잠수함 탐지를 향상시키는 동시에 대함 미사일, 어뢰 공격력, 대공을 강화합니다. 범용 전투함에 적합하지만 소나보다 IC와 마이크로칩 비용이 높습니다.§!"
 module_radar_7_desc: "최첨단 레이더 기술은 네트워크 센서 융합, 극한 거리 탐지, 자동 위협 우선순위 판별을 통합하여 해군 탐지 및 표적 획득 능력의 정점을 보여줍니다.\n\n§G설계 힌트: 레이더는 수상 탐지와 잠수함 탐지를 향상시키는 동시에 대함 미사일, 어뢰 공격력, 대공을 강화합니다. 범용 전투함에 적합하지만 소나보다 IC와 마이크로칩 비용이 높습니다.§!"
 module_sonar_1_desc: "초기 함상 소나 체계는 인근 잠수함에 대한 기본적인 탐지를 제공합니다. 사거리와 해상도는 제한적이지만 함선에 기초적인 수중 인식 능력을 부여합니다.\n\n§G설계 힌트: 소나는 잠수함 탐지를 중점적으로 향상시키며 수상 탐지, 대함 미사일, 어뢰 공격력도 높여 줍니다. 대잠 함선에 비용 대비 효율적인 선택이지만 레이더보다 전투 지원 범위는 좁습니다.§!"
 module_sonar_2_desc: "개량된 소나 체계는 향상된 탐지 거리와 해상도를 갖추어, 함선이 잠수함을 더 효과적으로 추적하고 수중 위협에 더 정확하게 대응할 수 있게 합니다.\n\n§G설계 힌트: 소나는 잠수함 탐지를 중점적으로 향상시키며 수상 탐지, 대함 미사일, 어뢰 공격력도 높여 줍니다. 대잠 함선에 비용 대비 효율적인 선택이지만 레이더보다 전투 지원 범위는 좁습니다.§!"
 module_sonar_3_desc: "현대식 소나 플랫폼은 첨단 신호 처리와 안정화 장치를 통합하여 복잡한 해양 환경에서 빠르거나 회피하는 잠수함을 탐지하는 능력을 향상시킵니다.\n\n§G설계 힌트: 소나는 잠수함 탐지를 중점적으로 향상시키며 수상 탐지, 대함 미사일, 어뢰 공격력도 높여 줍니다. 대잠 함선에 비용 대비 효율적인 선택이지만 레이더보다 전투 지원 범위는 좁습니다.§!"
 module_sonar_4_desc: "고도로 발전한 소나 체계는 장거리 잠수함 탐지, 더 나은 표적 식별, 소음과 대응책에 대한 저항력을 제공하여 함대의 대잠 작전을 강화합니다.\n\n§G설계 힌트: 소나는 잠수함 탐지를 중점적으로 향상시키며 수상 탐지, 대함 미사일, 어뢰 공격력도 높여 줍니다. 대잠 함선에 비용 대비 효율적인 선택이지만 레이더보다 전투 지원 범위는 좁습니다.§!"
 module_sonar_5_desc: "차세대 소나 체계는 여러 주파수 대역과 자동 추적 알고리즘을 통합하여 현대식 스텔스 잠수함을 먼 거리에서도 안정적으로 탐지할 수 있게 합니다.\n\n§G설계 힌트: 소나는 잠수함 탐지를 중점적으로 향상시키며 수상 탐지, 대함 미사일, 어뢰 공격력도 높여 줍니다. 대잠 함선에 비용 대비 효율적인 선택이지만 레이더보다 전투 지원 범위는 좁습니다.§!"
 module_sonar_6_desc: "근미래 소나 플랫폼은 인공지능 보조 신호 분석과 다중 센서 융합을 활용하여 까다로운 조건에서도 정밀한 잠수함 위치 파악과 향상된 상황 인식을 가능하게 합니다.\n\n§G설계 힌트: 소나는 잠수함 탐지를 중점적으로 향상시키며 수상 탐지, 대함 미사일, 어뢰 공격력도 높여 줍니다. 대잠 함선에 비용 대비 효율적인 선택이지만 레이더보다 전투 지원 범위는 좁습니다.§!"
 module_sonar_7_desc: "최첨단 소나 기술은 극한 거리 탐지, 실시간 위협 우선순위 판별, 첨단 소음 저감을 결합하여 수중 탐지 및 대잠수함전 능력의 정점을 보여줍니다.\n\n§G설계 힌트: 소나는 잠수함 탐지를 중점적으로 향상시키며 수상 탐지, 대함 미사일, 어뢰 공격력도 높여 줍니다. 대잠 함선에 비용 대비 효율적인 선택이지만 레이더보다 전투 지원 범위는 좁습니다.§!"
 module_surface_oil_power_desc: "초기 석유 기관은 수상함에 안정적인 추진력을 제공하며 속도와 항속 시간은 보통 수준입니다.\n\n§G설계 힌트: 석유 추진은 완만한 속력과 최대 항속거리만 필요한 함선을 위한 저렴한 기관입니다. 저비용 연안 함대에 적합하지만 연료 소모와 수상 가시성이 증가합니다.§!"
 module_surface_jet_turbine_power_desc: "초기 제트 터빈 기관은 연료 효율을 일부 희생하는 대신 수상함의 속도를 크게 향상시킵니다.\n\n§G설계 힌트: 제트 터빈은 기존 기관보다 더 높은 속력과 최대 항속거리를 제공하며 수상 가시성이 낮습니다. 지역 전투 함대에 적합하지만 생산 비용과 연료 소모가 증가합니다.§!"
 module_light_surface_jet_turbine_power_desc: "경량 제트 터빈은 관리 가능한 연료 소비를 유지하면서 소형 함선의 속도를 높입니다.\n\n§G설계 힌트: 경량 제트 터빈은 디젤 기관보다 더 높은 속력과 최대 항속거리를 제공하며 수상 가시성이 낮습니다. 고속 지역 전투함에 적합하지만 생산 비용과 연료 소모가 증가합니다.§!"
 module_surface_early_reactor_power_desc: "초기 함정용 원자로는 수상 전투함에 장거리, 연료 비의존형 추진력과 안정적인 성능을 제공합니다.\n\n§G설계 힌트: 원자력 추진은 점진적으로 향상되는 속력과 탁월한 최대 항속거리를 제공하며 연료 없이 운용됩니다. 전 세계에 배치되는 함대에 적합하지만 건조 비용이 극단적으로 비쌉니다.§!"
 module_surface_adv_reactor_power_desc: "첨단 원자로는 더 높은 출력 밀도와 향상된 효율을 제공하여 장기 전개와 더 빠른 함선을 가능하게 합니다.\n\n§G설계 힌트: 원자력 추진은 점진적으로 향상되는 속력과 탁월한 최대 항속거리를 제공하며 연료 없이 운용됩니다. 전 세계에 배치되는 함대에 적합하지만 건조 비용이 극단적으로 비쌉니다.§!"
 module_surface_mod_reactor_power_desc: "현대식 원자로는 높은 출력, 연료 효율, 신뢰성을 결합하여 지속적인 해군 작전을 뒷받침합니다.\n\n§G설계 힌트: 원자력 추진은 점진적으로 향상되는 속력과 탁월한 최대 항속거리를 제공하며 연료 없이 운용됩니다. 전 세계에 배치되는 함대에 적합하지만 건조 비용이 극단적으로 비쌉니다.§!"
 module_surface_fut_reactor_power_desc: "차세대 원자로는 최고의 성능, 뛰어난 효율, 거의 무제한에 가까운 항속 시간을 가장 현대적인 수상함에 제공합니다.\n\n§G설계 힌트: 원자력 추진은 점진적으로 향상되는 속력과 탁월한 최대 항속거리를 제공하며 연료 없이 운용됩니다. 전 세계에 배치되는 함대에 적합하지만 건조 비용이 극단적으로 비쌉니다.§!"
 module_sub_diesel_electric_power_desc: "초기 디젤전기 체계는 제한된 항속 시간으로 잠수함에 기본적인 잠항 및 수상 추진력을 제공합니다.\n\n§G설계 힌트: 디젤전기 추진은 연료에 의존하는 저렴한 잠수함을 제공하며, 상위 등급에서 속력, 최대 항속거리, 은밀성이 향상됩니다. 지역 및 인근 해역 작전에 적합하지만 원자로의 전 지구적 항속 시간에는 미치지 못합니다.§!"
 module_sub_early_reactor_power_desc: "초기 원자로는 잠수함이 장기간 잠항 상태를 유지할 수 있게 하여 작전 지속 능력을 크게 향상시킵니다.\n\n§G설계 힌트: 원자력 추진은 잠수함에 높은 속력, 탁월한 최대 항속거리를 부여하며 연료 없이 운용됩니다. 전 지구적 전개에 적합하지만 IC 비용이 더 높고 일반적으로 디젤전기 추진보다 탐지되기 쉽습니다.§!"
 module_sub_adv_reactor_power_desc: "첨단 원자로는 더 높은 출력을 제공하여 더 빠른 속도와 더 긴 잠항 작전을 지원합니다.\n\n§G설계 힌트: 원자력 추진은 잠수함에 높은 속력, 탁월한 최대 항속거리를 부여하며 연료 없이 운용됩니다. 전 지구적 전개에 적합하지만 IC 비용이 더 높고 일반적으로 디젤전기 추진보다 탐지되기 쉽습니다.§!"
 module_sub_mod_reactor_power_desc: "현대식 원자로는 향상된 효율과 신뢰성을 통합하여 고속에서도 지속적인 잠항 작전을 가능하게 합니다.\n\n§G설계 힌트: 원자력 추진은 잠수함에 높은 속력, 탁월한 최대 항속거리를 부여하며 연료 없이 운용됩니다. 전 지구적 전개에 적합하지만 IC 비용이 더 높고 일반적으로 디젤전기 추진보다 탐지되기 쉽습니다.§!"
 module_sub_fut_reactor_power_desc: "최첨단 원자로는 근미래 잠수함에 비할 데 없는 항속 시간, 속도, 은밀성을 제공합니다.\n\n§G설계 힌트: 원자력 추진은 잠수함에 높은 속력, 탁월한 최대 항속거리를 부여하며 연료 없이 운용됩니다. 전 지구적 전개에 적합하지만 IC 비용이 더 높고 일반적으로 디젤전기 추진보다 탐지되기 쉽습니다.§!"
 module_light_helipad_1_desc: "기본적인 경량 헬리패드 시설은 소형 함선이 정찰과 제한적인 대잠 임무를 위해 헬리콥터 1대를 운용할 수 있게 합니다.\n\n§G설계 힌트: 경량 헬리패드는 일반 헬리패드보다 낮은 비용으로 잠수함 탐지, 대잠수함전, 수상 탐지, 소해 능력을 향상시킵니다. 소형 대잠 호위함에 적합하지만 연료 소모, 인력, 수상 가시성이 여전히 증가합니다.§!"
 module_light_helipad_2_desc: "강화된 경량 헬리패드는 회전익 작전을 더 잘 지원하여 대잠, 감시, 수송 능력을 향상시킵니다.\n\n§G설계 힌트: 경량 헬리패드는 일반 헬리패드보다 낮은 비용으로 잠수함 탐지, 대잠수함전, 수상 탐지, 소해 능력을 향상시킵니다. 소형 대잠 호위함에 적합하지만 연료 소모, 인력, 수상 가시성이 여전히 증가합니다.§!"
