 message_from_iran.1.t: "장비를 보낸 이란"
 message_from_iran.1.d: "오늘 우리는 기지 한 곳에서 대규모 기밀 수송품을 받았으며, 이는 이란에서 보낸 것으로 확인되었습니다. 이 수송품에는 지상전 및 게릴라전용 군사 장비가 포함되어 있으며, 우리는 이를 우리 자신을 방어하고 적에 맞서는 데 사용할 수 있습니다."
 message_from_iran.1.o1: "Thank you"
 message_from_iran.2.t: "자금을 지원한 이란"
 message_from_iran.2.d: "우리 기지 한 곳에서, 이란에서 미국 달러 현금이 다수의 가방에 담겨 보내져 왔다는 연락을 받았습니다."
 message_from_iran.2.o1: "Thank you"
 message_from_iran.3.t: "공장을 건설한 이란"
 message_from_iran.3.d: "이란이 우리를 위해 지하 공장을 건설해 주었으며, 우리는 피해를 걱정하지 않고 이를 이용해 다른 건축물을 지을 수 있습니다."
 message_from_iran.3.o1: "Thank you"
