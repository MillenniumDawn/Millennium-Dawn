 IND_islamic_resist_info: "Sulawesi is one of our largest islands, and it is filled with many different peoples. However, the large muslim majority is calling out the state for neglect and are putting up heavy resistance against much of our forces and economy. This resistance is making life very difficult for our men, and security forces"
