 ukraine_develop_btr4.1.name: "'BTR-4' 전투 임무 선택"
 ukraine_develop_btr4.1.desc: "이 장비의 임무를 선택할 수 있습니다. 더 가볍고 저렴한 APC로 할 것인지, 더 비싸지만 중무장한 IFV로 할 것인지 정해야 합니다.\n이 결정에 따라 BTR-4를 장비할 대대가 기계화 대대 또는 기갑 대대로 정해집니다.\n원한다면 기본적으로 동일한 장비를 반대의 임무로도 생산할 수 있습니다."
 ukraine_develop_btr4.1.a: "APC"
 ukraine_develop_btr4.1.b: "IFV"
 ukraine_develop_btr4.2.name: "'BTR-4' APC의 주무장 선택"
 ukraine_develop_btr4.2.desc: "BTR-4 APC의 주무장을 선택할 수 있습니다.\n생산 비용을 줄이려면 기관총을 선택할 수 있으며, 전투 효율을 극대화하려면 여러 가지 중무장 모듈 중에서 선택할 수 있습니다."
