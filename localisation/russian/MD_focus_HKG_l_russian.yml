 HKG_contract_completed_line: "§YКонтракты выполнены: §! [?HKG_contract_completed|0]"
 HKG_contract_section_label: "Действующие контракты ([?HKG_contract_count|0] / [?HKG_contract_max_slots|0])"
 HKG_contract_idle: "Действующих контрактов нет. Обратитесь в Пекин с петицией ниже с просьбой о размещении заказа на закупку или дождитесь его издания Центральной военной комиссией."
 HKG_contract_row0: "§Y[GetHKGContractRow0Class]§![GetHKGContractRow0License] - §G[?HKG_contract_disp_quota_0|0]§!/[?HKG_contract_disp_total_0|0] осталось кораблей §G[?HKG_contract_disp_deadline_0|0]§! дней осталось"
 HKG_contract_row1: "§Y[GetHKGContractRow1Class]§![GetHKGContractRow1License] - §G[?HKG_contract_disp_quota_1|0]§!/[?HKG_contract_disp_total_1|0] осталось кораблей §G[?HKG_contract_disp_deadline_1|0]§! дней осталось"
 HKG_contract_row2: "§Y[GetHKGContractRow2Class]§![GetHKGContractRow2License] - §G[?HKG_contract_disp_quota_2|0]§!/[?HKG_contract_disp_total_2|0] осталось кораблей §G[?HKG_contract_disp_deadline_2|0]§! дней осталось"
 HKG_contract_capstone_label: "Гонконгский флот"
 HKG_contract_capstone_progress: "Завершите программу создания отечественных авианосцев и постройте авианосец, чтобы увековечить военно-морское наследие города."
 HKG_contract_capstone_done: "§GФлот Гонконга в море — Гонконг признан военно-морской державой.§!"
 HKG_contract_capstone_progress_tt: "Срабатывает после завершения всей основной сюжетной линии, связанной с авианосцами, и после того, как Гонконг построит или сохранит авианосец. Наделяет §YВоенно-морская мощь Гонконга§! национальным духом."
 HKG_contract_capstone_done_tt: "Завершающий этап достигнут. §YВоенно-морская мощь Гонконга§! Национальный дух активен, и могут быть согласованы более выгодные условия контракта."
 HKG_naval_contracts_category: "Контракты на закупку военно-морских ресурсов"
 HKG_contract_solicit_contract: "Подать петицию в Пекин с просьбой о заключении контракта."
 HKG_contract_solicit_contract_desc: "Обратитесь в Центральную военную комиссию и запросите новый заказ на закупку военных кораблей. Одновременно можно заключить до трех контрактов; чем больше контрактов вы заключаете, тем дольше Пекин разрешает на каждый из них. Класс и вознаграждение зависят от вашего положения в обществе."
 HKG_contract_deliver_destroyer: "Доставить эсминец"
 HKG_contract_deliver_destroyer_desc: "Передайте один готовый эсминец Военно-морскому флоту Народно-освободительной армии Китая. Он будет зачислен на ваш самый срочный контракт на эсминец. Повторяйте процесс, пока не будет выполнена квота по этому контракту."
 HKG_contract_deliver_frigate: "Доставить фрегат"
 HKG_contract_deliver_frigate_desc: "Передайте один готовый фрегат Военно-морскому флоту Народно-освободительной армии Китая. Он будет зачислен на ваш самый срочный контракт на фрегат. Повторяйте, пока не будет выполнена квота по этому контракту."
 HKG_contract_deliver_submarine: "Доставить подводную лодку"
 HKG_contract_deliver_submarine_desc: "Передайте одну готовую ударную подводную лодку Военно-морскому флоту Народно-освободительной армии Китая. Она будет зачислена в ваш самый срочный контракт на строительство подводных лодок."
 HKG_contract_deliver_cruiser: "Доставить крейсер"
 HKG_contract_deliver_cruiser_desc: "Передайте один достроенный крейсер Военно-морскому флоту Народно-освободительной армии Китая. Он будет зачислен на ваш самый срочный контракт на крейсер."
 HKG_contract_deliver_carrier: "Передать авианосец"
 HKG_contract_deliver_carrier_desc: "Передать готовый авианосец Военно-морскому флоту Народно-освободительной армии Китая и выполнить контракт на строительство авианосца."
 HKG_contract_negotiate_terms: "Пересмотреть условия закупки"
 HKG_contract_negotiate_terms_desc: "С формированием Гонконгского флота гонконгские верфи пользуются уважением. Необходимо оказывать давление на Пекин, чтобы добиться более крупных выплат и более длительных сроков по всем будущим контрактам."
 HKG_contract_need_destroyer_tt: "Для доставки грузов нам необходим как минимум один эсминец в составе нашего флота."
 HKG_contract_need_frigate_tt: "Для доставки грузов нам необходим как минимум один фрегат в составе нашего флота."
 HKG_contract_need_submarine_tt: "Для доставки грузов нам необходимо иметь в своем флоте как минимум одну ударную подводную лодку."
 HKG_contract_need_cruiser_tt: "В нашем флоте должен быть как минимум один крейсер для доставки грузов."
 HKG_contract_need_carrier_tt: "Для выполнения поставленных задач нам необходим авианосец в составе нашего флота."
 HKG_contract_slots_free_tt: "У нас есть свободное время для заключения контракта (одновременно может выполняться максимум три контракта)."
 HKG_contract_modules_tt: "Наши верфи исследовали как минимум первый уровень каждого основного модуля боевого корабля: двигатель, главное орудие, ракеты, торпеды, гидролокатор и радар."
 HKG_contract_tt_unlock: "Открывает систему §YКонтракты на закупку военно-морских сил Китая§!: стройте военные корабли для Пекина в обмен на доходы в казну, политическую власть и промышленный рост."
 HKG_contract_tt_solicit: "Центральная военная комиссия ответит предложением о закупке в течение нескольких дней."
 HKG_contract_tt_accept_advance: "Получите аванс в размере §G$[?HKG_contract_offer_advance|0]§! в казну и §G1000§! людских ресурсов, выплачиваемых при подписании контракта."
 HKG_contract_tt_accept_license: "Пекин выдаёт §Oлицензию на производство§! одного из своих проверенных проектов [GetHKGContractOfferClass], который мы можем строить непосредственно на наших верфях. §YПримечание: это проверенный серийный проект, а не новейшая разработка ВМС Народно-освободительной армии Китая.§!"
 HKG_contract_tt_accept_onfulfil: "После доставки всего заказа: оставшаяся сумма поступает в казну. §G[?HKG_contract_offer_pp|0]§! Предоставляются политическая власть и рост промышленной производительности, а также начинается выплата временного бонуса к доходам верфи."
 HKG_contract_tt_decline: "Предложение утрачивает силу. Штрафных санкций нет, и Пекин может в будущем предложить новое соглашение."
 HKG_contract_tt_deliver: "Передайте один корабль Военно-морскому флоту Народно-освободительной армии Китая, используя его в качестве оплаты по самому срочному контракту этого класса.\n§YКорабль должен находиться в вашем резервном флоте. Корабль, назначенный в состав оперативной группы, не может быть передан. Сначала переместите его в резерв.§!"
 HKG_contract_tt_deliver_reward: "Когда выполняется вся квота по контракту: оставшаяся сумма поступает в казну, и предоставляются политическая власть, повышение производительности и бонус к доходам верфи."
 HKG_contract_tt_negotiate: "Все будущие контракты оплачиваются на §G25%§! больше и позволяют §G50%§! более долгие сроки."
 HKG_contract.1.t: "Комиссия из Пекина"
 HKG_contract.1.d_normal: "Центральная военная комиссия Пекина обратилась к нашим верфям с заказом на закупку.\n\n§YЗаказ:§! [?HKG_contract_offer_quota|0] х [GetHKGContractOfferClass]\n§YКрайний срок:§! [?HKG_contract_offer_deadline|0] дней\n§YОплата:§! $[?HKG_contract_offer_funds|0] - $[?HKG_contract_offer_advance|0] и §G1000§! людских ресурсов выплачиваются при подписании договора, остальная сумма – при доставке.\n§YПо завершении:§! [?HKG_contract_offer_pp|0] политическая власть, устойчивый рост производительности и временная премия за выручку верфи.\n\nКорабли должны быть построены на наших собственных верфях и переданы Военно-морскому флоту Народно-освободительной армии Китая. Несоблюдение сроков ухудшит отношения с материком."
 HKG_contract.1.d_license: "Центральная военная комиссия Пекина предлагает §Oлицензионный договор§!. Военно-морской флот Народно-освободительной армии Китая предоставит нашим верфям один из своих уже разработанных проектов для строительства по лицензии.\n\n§YЛицензионный дизайн:§! [?HKG_contract_offer_quota|0] х [GetHKGContractOfferClass]\n§YКрайний срок:§! [?HKG_contract_offer_deadline|0] дней\n§YОплата:§! $[?HKG_contract_offer_funds|0] - $[?HKG_contract_offer_advance|0] и §G1000§! людских ресурсов выплачиваются при подписании договора, остальная сумма – при доставке.\n§YПо завершении:§! [?HKG_contract_offer_pp|0] политическая власть, устойчивый рост производительности и временная премия за выручку верфи.\n\nПолучение лицензии на производство позволит нам напрямую реализовывать проекты, разработанные в Пекине. §YПримечание: Пекин использует проверенную конструкцию корабля, а не свой новейший военный корабль.§! Несоблюдение сроков испортит отношения с материковым Китаем."
 HKG_contract.1.a: "Принять комиссию"
 HKG_contract.1.b: "Отказаться — наши верфи не готовы"
 HKG_contract.2.t: "Контракт выполнен"
 HKG_contract.2.d: "Последний корабль из заказа передан Военно-морскому флоту Народно-освободительной армии Китая. Пекин доволен: окончательный платеж в размере §Y$[?HKG_contract_last_payment|0]§! поступил в казну, политический капитал высвобожден, и наши верфи заслужили свою репутацию. Наш авторитет на материке укрепился."
 HKG_contract.2.a: "Гонконг строит флот"
 HKG_contract.3.t: "Пропущен срок сдачи контракта"
 HKG_contract.3.d: "Срок действия контракта истек, а заказ так и не был выполнен. Центральная военная комиссия отметила невыполнение Гонконгом своих обязательств. Недовольство Пекина теперь давит на наши верфи, и наши отношения с материковым Китаем ухудшились."
 HKG_contract.3.a: "Неприятная неудача"
 HKG_contract.50.t: "Гонконгский флот"
 HKG_contract.50.d: "От субподрядчика до первоклассного судостроителя — верфи Гонконга завершили программу строительства авианосца внутри страны и вывели его в море. То, что начиналось как контракты на закупку для Пекина, превратилось в судостроительную отрасль, которая никому не подчиняется. Родился Гонконгский флот, и вместе с ним Гонконг занял свое место среди военно-морских держав."
 HKG_contract.50.a: "Город плывет"
 HKG_contract_dockyard_revenue: "Дивиденды от закупок"
 HKG_contract_dockyard_revenue_desc: "Выполненный контракт с Пекином обеспечивает загруженность и прибыльность гонконгских верфей. Строительство военно-морских судов приносит стабильный доход, а портфель заказов остается полным."
 HKG_contract_beijing_displeasure: "Недовольство Пекина"
 HKG_contract_beijing_displeasure_desc: "Гонконг не выполнил контрактный заказ в срок. Центральная военная комиссия утратила доверие к городским верфям, и это сказывается на политической ситуации во всей администрации."
 HKG_contract_naval_power: "Военно-морская мощь Гонконга"
 HKG_contract_naval_power_desc: "Гонконгские верфи построили собственный авианосец и доказали свое превосходство над любыми другими в Азии. Морская промышленность города теперь является постоянным стратегическим активом."
 HKG_carrier_home: "Авианосец для Гонконга"
 HKG_carrier_home_desc: "Строительство авианосца для внутренних рейсов — самый амбициозный проект, когда-либо предпринимавшийся городом. Он начинается со стапелей, сухих доков и политической воли для его реализации."
 HKG_carrier_construction: "Заложить корпус"
 HKG_carrier_construction_desc: "Восточная морская судостроительная группа начала работы по строительству корпуса авианосца. В этих работах задействованы все верфи и сварщики, которых только могут выделить Гонконг."
 HKG_carrier_construction2: "Оснастите авианосец"
 HKG_carrier_construction2_desc: "После завершения строительства корпуса авианосец переходит к дооснащению. Силовая установка, командные посты и островная надстройка устанавливаются у причала."
 HKG_carrier_modules: "Интеграция систем авианосцев"
 HKG_carrier_modules_desc: "В конструкцию интегрированы современные модули авианосца: катапульты, торможение и системы борьбы с повреждениями, созданные на основе многолетнего опыта военно-морских сил."
 HKG_flight_deck_limitations: "Преодолейте ограничения полетной палубы."
 HKG_flight_deck_limitations_desc: "Первая полетная палуба Гонконга тесна по западным меркам. Инженеры переработали компоновку палубы, чтобы обеспечить взлет и посадку самолетов в приемлемом темпе."
 HKG_carrier_special_airwing: "Тренировка авиационного крыла авианосца"
 HKG_carrier_special_airwing_desc: "Эффективность авианосца напрямую зависит от квалификации пилотов, которые с него взлетают."
 HKG_carrier_defensive_weapons: "Комплекс самообороны авианосца"
 HKG_carrier_defensive_weapons_desc: "Авианосец оснащен системами ближнего боя, зенитными ракетами и средствами радиоэлектронной борьбы, что позволяет ему выживать, не полагаясь полностью на эскортные корабли."
 HKG_carrier_logistics: "Инфраструктура поддержки авианосцев"
 HKG_carrier_logistics_desc: "Для авианосца необходим соответствующий требованиям порт приписки: глубоководные причалы, склады боеприпасов и логистическая база для обеспечения его нахождения в море."
 HKG_expanded_shipyards: "Расширить верфи"
 HKG_expanded_shipyards_desc: "Гонконгские верфи работают на пределе своих возможностей. Новые стапели и сухие доки расширяют возможности города по строительству и ремонту военных кораблей."
 HKG_expanded_trade_capacity: "Расширение торговых возможностей"
 HKG_expanded_trade_capacity_desc: "Будучи одним из крупнейших мировых торговых центров, Гонконг инвестирует в портовый и промышленный потенциал, необходимый для бесперебойного движения товаров через гавань."
 HKG_expanded_searoutes: "Обеспечьте безопасность морских путей"
 HKG_expanded_searoutes_desc: "Процветание Гонконга зависит от открытых морских путей. Администрация укрепляет торговые связи со своими морскими соседями, чтобы обеспечить безопасность этих маршрутов."
 HKG_expanded_inland_routes: "Расширить внутренние маршруты"
 HKG_expanded_inland_routes_desc: "Помимо порта, Гонконг укрепляет железнодорожные и автомобильные связи, которые соединяют его с материком и обеспечивают энергией его промышленность."
 HKG_offshore_industry: "Развитие оффшорной индустрии"
 HKG_offshore_industry_desc: "Земля в Гонконге дефицитна и дорога. Город прибегает к использованию искусственно созданных и прибрежных территорий для строительства новых промышленных комплексов."
 HKG_offshore_industry2: "Расширение оффшорной индустрии"
 HKG_offshore_industry2_desc: "Программа развития морской промышленности доказывает свою эффективность. Дальнейшее освоение земель и строительство выводят производственную базу Гонконга за пределы прибрежной зоны."
 HKG_housing_policy_modifier: "Жилищная политика"
 HKG_housing_policy_modifier_desc: "Совокупный вес решений, принятых Гонконгом в сфере жилищного строительства, ощущается во всех сферах: в строительстве, в государственном бюджете и в терпении его жителей. Каждый этап жилищной программы меняет эти показатели в лучшую или худшую сторону."
 HKG_small_house_policy: "Реформировать политику в отношении небольших домов"
 HKG_small_house_policy_desc: "Политика строительства малоэтажных домов, действовавшая в колониальную эпоху, предоставляла коренным жителям Новых Территорий право строить малоэтажные дома на исконных землях. Реформирование этой политики высвободит обширные территории для застройки более высокой плотности, но сельская элита будет сопротивляться любым изменениям своих унаследованных привилегий."
 HKG_brownfield_consolidation: "Объединить заброшенные промышленные территории"
 HKG_brownfield_consolidation_desc: "Сотни гектаров в Новых Территориях заняты открытыми складскими площадками, пунктами приема металлолома и контейнерными парками. Объединение этих заброшенных промышленных территорий в многоэтажные комплексы позволит освободить землю под застройку без использования каких-либо перевалочных барж."
 HKG_revitalise_private_market: "Оживить частный рынок"
 HKG_revitalise_private_market_desc: "Устранив конкуренцию на государственном рынке, правительство обращается к застройщикам. Для ускорения вывода частных квартир на рынок предлагаются упрощенные процедуры согласования, смягченные требования к коэффициентам застройки и налоговые льготы."
 HKG_relax_mortgage_rules: "Смягчить правила ипотечного кредитования"
 HKG_relax_mortgage_rules_desc: "Валютное управление смягчает требования к соотношению кредита к стоимости залога и пороговые значения для стресс-тестов. Покупатели, приобретающие жилье впервые, наконец-то могут преодолеть препятствие в виде первоначального взноса, хотя критики предупреждают о том, что это создаст дополнительную нагрузку на балансы домохозяйств."
 HKG_vacancy_tax: "Ввести налог на пустующие помещения"
 HKG_vacancy_tax_desc: "Вводится карательный сбор с новых квартир, оставшихся непроданными и незанятыми. Застройщики больше не смогут постепенно выставлять на рынок готовые квартиры, чтобы поддерживать высокие цены; спекулятивное хранение жилья прекращается."
 HKG_light_public_housing: "Легкодоступное государственное жилье"
 HKG_light_public_housing_desc: "Сборные модульные жилые комплексы, построенные на неиспользуемых государственных землях в качестве временного решения для семей, оказавшихся в списке ожидания. Дешевые и быстровозводимые, они дают Жилищному управлению годы, необходимые для строительства постоянных жилых комплексов."
 HKG_tenancy_control: "Регулирование разделённых на несколько частей квартир"
 HKG_tenancy_control_desc: "Власти города вводят ограничения на арендную плату, обязательные письменные договоры аренды и минимальные стандарты. Арендодатели теряют свободу действий; десятки тысяч людей, запертых в разделенных перегородками квартирах, получают определенную защиту."
 HKG_starter_homes_scheme: "Программа предоставления жилья для начинающих семей"
 HKG_starter_homes_scheme_desc: "Новый уровень владения жильем, ориентированный на молодых специалистов, которые не могут позволить себе как государственное, так и частное жилье. Продаваемое по ценам ниже рыночных с ограничениями на перепродажу, это предложение восстанавливает первую ступеньку на пути к собственному жилью."
 HKG_artificial_islands: "Программа создания искусственных островов"
 HKG_artificial_islands_desc: "Программа создания масштабных искусственных островов в центральной акватории, задуманная для размещения сотен тысяч людей и формирования нового столичного района. Стоимость исчисляется сотнями миллиардов, и экологические возражения очень сильны, но прирост пригодной для использования земли не имеет себе равных."
 HKG_northern_metropolis: "Северная метрополия"
 HKG_northern_metropolis_desc: "Масштабный план развития Новых Территорий, граничащих с Шэньчжэнем, который интегрирует Гонконг в Большой залив. Вдоль северной границы планируется строительство новых городов, железнодорожных линий и инновационного пояса."
 HKG_country_park_periphery: "Развитие периметра загородного парка"
 HKG_country_park_periphery_desc: "Наименее ценные с экологической точки зрения окраины охраняемых национальных парков открываются для строительства. Экологи возмущены таким прецедентом; правительство настаивает на том, что земля слишком ценна, чтобы оставлять ее необработанной в условиях жилищного кризиса."
 HKG_redevelop_old_estates: "Реконструкция ветхих жилых комплексов"
 HKG_redevelop_old_estates_desc: "Старейшие муниципальные жилые комплексы, построенные в десятилетия экономического бума и ныне приходящие в упадок, сносят и перестраивают в соответствии с современными стандартами плотности застройки. Жителей переселяют и переселяют в новые дома; на той же площади появляется гораздо больше квартир."
 HKG_abolish_subdivided_flats: "Отменить разделение квартир на несколько блоков"
 HKG_abolish_subdivided_flats_desc: "После ввода в эксплуатацию достаточного количества нового жилья правительство принимает решение запретить разделенные на секции квартиры и дома-клетки, которые позорили город на протяжении целого поколения. Эпоха разделенных перегородками многоквартирных домов подходит к концу."
 HKG_urban_renewal_push: "Расширить полномочия Управления по обновлению городских территорий"
 HKG_urban_renewal_push_desc: "Управлению по реконструкции городов предоставляются расширенные полномочия по принудительному выкупу недвижимости и больший бюджет для расчистки и восстановления пришедших в упадок районов. Старый Коулун и набережная преображаются квартал за кварталом."
 HKG_smart_city_housing: "Жилье в «умном городе»"
 HKG_smart_city_housing_desc: "Новые жилые комплексы оснащаются современными технологиями с нуля: интегрированная транспортная система, централизованное охлаждение и цифровое управление. Жилой фонд Гонконга становится витриной для амбиций «умного города», которые преследует регион Большого залива."
 HKG_housing_for_all: "Дом для каждого жителя Гонконга"
 HKG_housing_for_all_desc: "Многолетний кризис объявлен завершенным. Очереди ликвидированы, разделенные на квартиры участки упразднены, и собственность снова стала доступной для обычной семьи. Поколение, выросшее в условиях аренды, наконец-то может мечтать о собственном доме."
 HKG_naval_contracts_category_desc: "Строить военные корабли для Пекина и доставлять их в срок, чтобы повысить авторитет Гонконга в глазах материкового Китая.\n§YДля доставки корабля он должен находиться в вашем резервном флоте. Корабль, назначенный в состав оперативной группы, доставить нельзя. Сначала переместите его в резерв.§!"
 HKG_contract_acquire_pearl_river: "Петиция по поводу дельты реки Чжуцзян"
 HKG_contract_acquire_pearl_river_desc: "Гонконгские верфи верно служили Пекину и заслужили полное доверие материкового Китая. Используйте этот авторитет, чтобы попросить Центральную военную комиссию уступить дельту Жемчужной реки, что позволит удвоить промышленную базу города."
 HKG_contract_max_standing_tt: "Наши отношения с материком должны быть на самом высоком уровне."
 HKG_contract_pearl_river_accept_tt: "Пекин уступает дельту реки Чжуцзян Гонконгу."
 HKG_contract_yard_slack_tt: "Наши верфи располагают свободными мощностями, чтобы взять на себя еще один контракт и при этом обеспечить своевременную поставку."
 HKG_contract.20.t: "Петиция из Гонконга"
 HKG_contract.20.d: "Гонконг неизменно строил наш флот и теперь просит своей награды: передачу дельты реки Чжуцзян в распоряжение своей администрации. Судостроительные верфи на юге города обеспечили бы его промышленность, а лояльный субподрядчик стал бы региональной державой. Финансирование уже выделено."
 HKG_contract.20.a: "Передать дельту реки Чжуцзян"
 HKG_contract.20.b: "Материковая часть не будет разделена."
 HKG_contract.21.t: "Дельта возвращается домой"
 HKG_contract.21.d: "Пекин согласился. Теперь дельта Жемчужной реки подчиняется Гонконгу, а ее заводы и судоходные пути интегрированы в экономику города. Гонконг больше не является одним перенаселенным островом, а сердцем южного промышленного пояса."
 HKG_contract.21.a: "Возникает промышленный гигант."
 HKG_contract.22.t: "Пекин отказывает"
 HKG_contract.22.d: "Центральная военная комиссия отказалась уступить дельту Жемчужной реки. Территориальная целостность материковой части Китая не продается, как бы лояльны ни были верфи. Наш платеж возвращен."
 HKG_contract.22.a: "Мы спросим ещё раз, когда придёт время."
 HKG_contract.30.t: "Доставка не удалась"
 HKG_contract.30.d: "Корабль не был передан. Выбранное для передачи судно назначено в состав оперативной группы, и флагманский корабль не может быть передан.\n§YПереместите корабль в свой резервный флот, затем снова используйте решение о передаче.§! Кредит по контракту не начислен."
 HKG_contract.30.a: "Переместите его в резерв и попробуйте снова."
 HKG_contract_resource_access: "Линия снабжения с материка"
 HKG_contract_resource_access_desc: "Действующий контракт на закупку военно-морского вооружения открывает преференциальный доступ к цепочкам поставок материкового Китая. Пекин поставляет сырье на городские верфи по цене, значительно меньшей обычной, при этом портфель заказов остается полным."
 HKG_contract_resource_access_tt: "§GРесурсы, импортируемые из Китая, значительно дешевле на протяжении всего срока действия контракта.§!"
 HKG_contract_shipbuilding_legacy: "Наследие судостроения"
 HKG_contract_shipbuilding_legacy_desc: "Каждый поставленный на материк военный корабль повышает эффективность верфей Гонконга. Каждый выполненный заказ добавляет 1% к объему производства военно-морских верфей."
 HKG_mainland_resource_supply: "Материковое снабжение ресурсами"
 HKG_mainland_resource_supply_desc: "Пекин перенаправляет нефть, сталь, легкие металлы, драгоценные металлы, композитные материалы и микрочипы с материка, чтобы обеспечить работу судостроительных верфей города по военно-морским контрактам. Гонконг практически ничего из этого не производит самостоятельно, поэтому гарантированный поток является тем, что делает возможным строительство военных кораблей для материка. Поставки обеспечиваются только до тех пор, пока действует контракт."
 HKG_mainland_resource_supply_tt: "§YЭти ресурсы берутся непосредственно из собственного пула Китая и только в течение действия контракта.§!"
 CHI_hong_kong_resource_drain: "Ресурсы для Гонконга"
 CHI_hong_kong_resource_drain_desc: "Нефть, сталь, легкие металлы, драгоценные металлы, композитные материалы и микрочипы направляются на юг, чтобы обеспечить работу гонконгских верфей по контракту с материковым Китаем. Перенаправленная продукция больше недоступна для собственной промышленности материкового Китая."
 CHI_hong_kong_resource_drain_tt: "§RЭти ресурсы перенаправляются в Гонконг на время действия контракта.§!"
 HKG_support_the_business: "Поддержите бизнес-сектор"
 HKG_support_the_business_desc: "Налоговые льготы, дерегулирование и дешевые кредиты направляют капитал города непосредственно на заводы. Производство резко растет, хотя эти льготы создают нагрузку на бюджет и вызывают недовольство политиков."
 legco_motion_reform_status_quo: "Сохранение избирательного статус-кво."
 legco_motion_reform_gradual: "Постепенная и упорядоченная избирательная реформа"
 legco_motion_reform_universal: "Всеобщее избирательное право"
 HKG_china_dominant_influence_tt: "§Y[CHI.GetNameWithFlag]§! является ведущим инфлюенсером в [ROOT.GetNameWithFlag] с уровнем влияния более 80%."