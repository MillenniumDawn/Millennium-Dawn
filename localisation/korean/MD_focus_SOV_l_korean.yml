 SOV_referendum_in_kuban_desc: "쿠반 공화국은 러시아 내전 당시 역사적으로 만들어진 국가였습니다. 오늘날 우리는 해당 지역과 러시아 전체의 상호 경제적 이익을 위해 그 자치를 다시 확대하는 방안을 고려하고 있습니다."
 SOV_referendum_in_ural: "[URA.GetFlag]우랄 공화국 프로젝트의 부활"
 SOV_referendum_in_ural_desc: "우랄 공화국은 한때 에두아르드 로셀 주지사가 해당 지역에 민족 공화국과 동등한 지위를 부여하기 위해 제안한 것이었습니다. 법적으로 저지되었지만 그 구상은 여전히 남아 있습니다. 이제 이 오랫동안 묻혀 있던 프로젝트를 재검토하고 어쩌면 부활시킬 적기일지도 모릅니다."
 ukraha_rebellion: "우크라이나에서 마이단이 일어났다"
 SOV_paid_cons_tt: "추가 수입: §Y병역 면제 징집병§!으로부터 인구 1,000만 명당 $§G0.015§!\n"
 SOV_party_earnings_tt: "추가 수입: $$§G0.300§! §Y당 수익§!에서 발생\n"
 SOV_bumaga: "명목상만 연합"
 SOV_bumaga_desc: "러시아 자유민주당이 정권을 잡았음에도 내부 분열이 지속되며 당의 결속력을 약화시키고 있습니다. 겉으로는 단결된 것처럼 보이지만 정파 간의 이해관계가 엇갈리고 있습니다. 이제 당을 온전히 통합하고 내부 갈등을 종식시켜 강력하고 일관된 모습을 보여야 할 때입니다."
 SOV_jirik_partiya: "지리놉스키의 당"
 SOV_jirik_partiya_desc: "Zhirinovsky's party stands united behind its leader. Loyalty and discipline have solidified the party's core, enabling it to pursue its nationalistic agenda with conviction. This unity strengthens our position in Russia's political landscape."
 SOV_jirik_partiya_jirinovci: "충성스러운 사람들을 더 가까이 데려와라"
 SOV_jirik_partiya_jirinovci_desc: "We must gather the most dedicated and loyal members who will obey orders without hesitation. These steadfast supporters will form the backbone of our party, ready to act decisively whenever called upon. Strengthening loyalty is essential for our survival."
 SOV_jirik_partiya_chistki: "당 숙청"
 SOV_jirik_partiya_chistki_desc: "It is time to purge the party of freethinkers and potential traitors who threaten our unity. By removing dissenters, we will ensure a disciplined and obedient organization. This cleansing is vital to secure our political future."
 SOV_jirik_partiya_puppet_sovet: "꼭두각시 최고회의"
 SOV_jirik_partiya_puppet_sovet_desc: "The Supreme Council must serve solely as our mouthpiece, lacking any real autonomy or power. By subordinating this body, we prevent challenges to the leadership and ensure absolute control over party decisions."
 SOV_jirik_partiya_young: "청년단의 군사화"
 SOV_jirik_partiya_young_desc: "The youth must be prepared for the coming conflict, as peaceful times are ending. Training and militarizing young party members will build a new generation ready to defend our ideals. This focus on youth is crucial for our long-term strength."
 SOV_jirik_partiya_total_control: "완전한 지배"
 SOV_jirik_partiya_total_control_desc: "Our party must be completely under our control to prevent any rebellion or unauthorized action. Absolute dominance over all party functions ensures efficiency and loyalty. Only through total control can we achieve our goals."
 SOV_jirik_partiya_and: "Zhirinovsky and the Party"
 SOV_jirik_partiya_and_desc: "The party's power does not rest solely on its leader; it complements and supports him. This symbiotic relationship allows for coordinated leadership and broader support across various party factions. Together, they form a unified force."
 SOV_jirik_partiya_and_samodeal: "자아비판 장려"
 SOV_jirik_partiya_and_samodeal_desc: "We will foster initiative and self-driven activity within the party ranks. Encouraging members to take responsibility and act proactively strengthens our movement from within. This approach builds a more resilient organization."
 SOV_jirik_partiya_and_kadres: "Pragmatic Approach to Human Resources"
 SOV_jirik_partiya_and_kadres_desc: "Rather than demanding blind loyalty, we will seek the most effective and capable personnel for the party. Competence and results will take priority over mere devotion, ensuring a stronger and more efficient leadership."
 SOV_jirik_partiya_and_sovet: "최고회의 강화"
 SOV_jirik_partiya_and_sovet_desc: "The Supreme Council should demonstrate that Zhirinovsky is not a dictator and that the party embraces a plurality of opinions. By strengthening this body, we show the party's commitment to internal debate and shared governance."
 SOV_jirik_partiya_and_money: "추가 수입"
 SOV_jirik_partiya_and_money_desc: "We will expand the party's income through various sources to fund our activities more effectively. Increasing financial resources is essential for growing our influence and sustaining long-term campaigns. Diversifying revenue streams is a strategic priority."
 SOV_jirik_partiya_and_autonomous: "자치당"
 SOV_jirik_partiya_and_autonomous_desc: "An autonomous party guarantees freedom of opinion and diversity within its ranks. Allowing internal independence encourages innovation and debate, which will strengthen our political platform and adaptability."
 SOV_alliance_armenia: "아제르바이잔의 끝"
 SOV_alliance_armenia_desc: "Azerbaijan's fabricated history only obstructs our fraternal Armenia. We will confront and resolve this obstacle to ensure Armenia's security and prosperity."
 SOV_south_azer_admistration: "이란 현"
 SOV_south_azer_admistration_desc: "우리는 남아제르바이잔에서 우리에게 충성하는 지역 세력을 지원하여 이란의 장악력을 약화시킬 반란을 일으킬 계획입니다. 이 전략은 이란의 통제를 불안정하게 만들고 우리의 영향력을 확대하는 것을 목표로 합니다."
 SOV_nov: "노보로시야 반환"
 SOV_nov_desc: "노보로시야를 우리 제국 내의 마땅한 자리로 되돌릴 때입니다. 이 지역을 되찾는 것은 남부 국경을 강화하고 역사적 유산을 되살립니다."
 SOV_help_sirya: "시리아 형제들"
 SOV_help_sirya_desc: "우리는 시리아에 대한 영향력을 높일 계획입니다. 시리아는 파괴를 노리는 서방 세계주의자들의 표적이 된 나라입니다. 시리아를 지원하는 것은 우리의 전략적 이익을 보호하고 적대 세력에 맞서는 일입니다."
 SOV_zhirinovsky_attack_ukraha: "우크라이나 군사 작전"
 SOV_zhirinovsky_attack_ukraha_desc: "우리의 목표는 우크라이나가 독립 국가로 존재하는 것을 끝내는 것입니다. 러시아 국기가 다시 한번 키예프 위에 휘날리며 우리의 역사적 통제가 회복될 때입니다."
 SOV_question_of_bavaria: "바이에른 분리주의"
 SOV_question_of_bavaria_desc: "우리는 바이에른이 독일에서 분리하려는 열망을 지지합니다. 분리주의를 조장하면 독일이 약화되고 지역 내 우리의 전략적 이익에 도움이 될 것입니다."
 SOV_question_of_east_german: "동독 회상"
 SOV_question_of_east_german_desc: "우리는 동독 국민들에게 동독의 자랑스러운 역사를 상기시킬 것입니다. 이 유산을 되살리는 것은 우리의 더 큰 정치적 목표와 지역 내 영향력을 뒷받침합니다."
 SOV_europe_pizda: "유럽 진군 준비"
 SOV_europe_pizda_desc: "유럽의 위협을 제거할 때가 왔습니다. 우리는 내부에서부터 그들을 약화시키고 그들의 힘을 완전히 꺾을 것입니다. 이 작전은 유럽으로의 결정적인 진격의 시작을 알립니다."
 SOV_question_of_spain: "분열된 스페인"
 SOV_question_of_spain_desc: "스페인은 분리주의를 막기 위해 오랫동안 자치 지역들 사이의 균형을 유지해 왔습니다. 우리는 이 균형을 흔들어 스페인을 약화시키고 지역 분열을 조장할 것입니다. 이 전략은 스페인의 단결을 무너뜨릴 것입니다."
 SOV_question_of_germany: "독일 문제"
 SOV_question_of_germany_desc: "독일은 여전히 핵심적인 전략적 경쟁자입니다. 우리는 더 이상 이전 세기처럼 관대함을 보일 생각이 없습니다. 독일 문제를 해결하는 것은 유럽에서 우리의 지배를 확보하는 데 매우 중요합니다."
 SOV_crusade_russian: "러시아 십자군"
 SOV_crusade_russian_desc: "성지를 향한 우리의 위대한 러시아 십자군을 개시할 때입니다. 과거의 황제들이 이루지 못한 일을 우리는 결의와 힘으로 완수할 것입니다. 이 사명은 우리의 영적, 제국적 목적을 새롭게 합니다."
 SOV_crusade_antioch: "안티오크 현"
 SOV_crusade_antioch_desc: "이 땅은 한때 안티오키아 공국에 속해 있었으며, 우리가 이를 복원할 것입니다. 이 현을 되살리는 것은 우리의 입지를 재확립하고 역사적 영유권을 기립니다."
 SOV_crusade_assiryan: "아시리아 현"
 SOV_crusade_assiryan_desc: "현대의 시리아는 위대한 아시리아 제국의 그림자에 불과합니다. 우리는 러시아의 통치 아래 시리아인들을 다시 위대함으로 이끌어 그들의 옛 힘과 위상을 회복시킬 것입니다."
 SOV_crusade_isr: "예루살렘 현"
 SOV_crusade_isr_desc: "예루살렘은 우리 원정의 궁극적인 목표입니다. 성묘는 이제부터 우리의 것이 될 것이며, 이는 이 지역에서의 우리의 영적, 정치적 영향력을 공고히 할 것입니다."
 SOV_crusade_egy: "콥트 현"
 SOV_crusade_egy_desc: "콥트인은 이집트의 진정한 통치자입니다. 우리는 그들의 대의를 지지하고, 그들이 우리 제국 내에서 마땅한 지위를 되찾도록 가능한 모든 것을 할 것입니다."
 SOV_romanian_shit: "루마니아의 위협"
 SOV_romanian_shit_desc: "Romania threatens our southwestern borders. We must address this problem swiftly to secure our frontiers and maintain regional stability."
 SOV_treaty_with_afganistan: "다시 아프가니스탄으로"
 SOV_treaty_with_afganistan_desc: "우리 제국은 다시 한번 아프가니스탄의 국경에 도달했습니다. 어쩌면 이번에는 행운이 우리 편이 되어 이 전략적 지역에 대한 통제권을 되찾을 것입니다."
 SOV_allied_nrk: "북한과의 동맹"
 SOV_allied_nrk_desc: "We aim to strengthen our influence in the East by expanding alliances, starting with a nation whose people recognize our support for their existence. This partnership will solidify our position in the region."
 SOV_return_kgb: "Restore the KGB"
 SOV_return_kgb_desc: "Current intelligence services are a poor imitation of the Soviet-era KGB, which was the most effective. We will revive the KGB to restore strength and security."
 SOV_storm_v: "포로들을 전쟁에 보내다"
 SOV_storm_v_desc: "수감자들은 기여하지 않고 공공 자원만 소모합니다. 이제 그들은 조국을 위해 싸우도록 보내져 복무를 통해 빚을 갚게 될 것입니다."
 SOV_new_russian_army: "러시아 의용군"
 SOV_new_russian_army_desc: "우리의 군대에는 대대적인 개혁이 필요합니다. 현재의 체제는 실패했으며, 새로운 활력으로 러시아를 수호할 준비가 된 의용군을 창설할 때입니다."
 SOV_women: "여성 대대"
 SOV_women_desc: "우리의 여성 대대는 적에게 공포를 안겨줄 것입니다. 그들의 존재만으로도 적들은 공포에 질려 달아날 것입니다."
 SOV_kazachestvo: "카자크 군사화"
 SOV_kazachestvo_desc: "카자크는 제멋대로인 행동을 그치고 러시아 군대의 규율 있는 일원으로 복무하는 데 복귀해야 합니다."
 SOV_war_kafedra: "군사 학과 복원"
 SOV_war_kafedra_desc: "군사 학과의 폐지는 중대한 실수였습니다. 우리는 군대와 군사 교육을 강화하기 위해 이를 복원할 것입니다."
 SOV_nationalize: "민영화 결과 재검토"
 SOV_nationalize_desc: "우리는 민영화의 파괴적인 영향을 재평가하고 국익을 지키기 위해 그 해로운 결과를 무효화할 것입니다."
 SOV_minister_propaganda: "선전부 창설"
 SOV_minister_propaganda_desc: "모든 메시지의 완전한 통제와 효과를 보장하기 위해 선전은 전담 부처 아래 중앙집권화되어야 합니다."
 SOV_pay_off_army: "군 복무 면제 허용"
 SOV_pay_off_army_desc: "우리는 개인이 상당한 금액을 납부하여 병역을 면제받도록 허용할 것이며, 이 자금은 군대를 강화하는 데 재투자될 것입니다."
 SOV_jirik_cult: "지리노프스키 숭배"
 SOV_jirik_cult_desc: "지리노프스키는 우리 국가의 상징이 되었습니다. 국민은 그를 중심으로 숭배를 만들어 냈으며, 우리는 이것이 번성하도록 허용할 것입니다."
 SOV_fuck_parties: "민주주의는 지옥에 가라"
 SOV_fuck_parties_desc: "Democracy is a tool of Western intelligence services to spread propaganda. We will not permit enemy influence on our soil."
 SOV_jirik_fear: "경찰국가"
 SOV_jirik_fear_desc: "조국의 적들에게는 자비가 없을 것입니다. 우리 경찰은 질서를 유지하기 위해 무거운 업무량을 감당하고 있습니다."
 SOV_jirik_stand: "조국은 무엇보다 우선한다"
 SOV_jirik_stand_desc: "조국을 수호하는 것은 모든 시민의 의무입니다. 민간인조차도 흔들림 없는 용기로 나라를 지킬 준비가 되어 있어야 합니다."
 SOV_jirik_warlord: "최고 통치자"
 SOV_jirik_warlord_desc: "위대하고 강력한 러시아의 밝은 미래를 향해 전진!"
 SOV_military_exercises_anti_turkey_idea: "러시아군과의 합동 훈련"
 SOV_military_exercises_anti_turkey1_idea: "반튀르키예 연합과의 합동 훈련"
