l_english:

 faction_manifest_containment_of_decadence_name: "Containment of Western Decadence"
 faction_manifest_containment_of_decadence_desc: "'In the name of God, the compassionate, the merciful'\n--------------\nWhat do we have but our own flesh and blood to protect this land? The imperialist thirst for soil which is not theirs could never be quenched with simple diplomacy. At last, an Axis of Resistance is the only way forward in preventing further imperialist agendas from gaining ground in the world, even if it means fighting to the very last man."

 faction_cento_motto_name: "Freedom, Union, Vigilance"
 faction_cento_motto_desc: "'A bridge between East and West'\n--------------\nFrom nothing came something, a rebuilt identity and alliance. In such a troubled region, what could weak men accomplish? Alas, it is CENTO that has been tasked with the responsibility of keeping watch and ensuring the continued stability of all lives confined within these eastern frontiers."

 faction_manifest_protect_regional_minorities_name: "Protect Regional Minorities"
 faction_manifest_protect_regional_minorities_desc: "We will defend the homelands of our allies so that minority communities can live in safety. Progress follows the share of member-owned core states fully controlled by their owners."

 faction_manifest_nile_security_name: "Secure the Nile Valley"
 faction_manifest_nile_security_desc: "A common front between Egypt and Sudan will protect the river both countries depend on. The alliance gains progress for each of them that remains a member."

 faction_manifest_periphery_partnership_name: "Build Regional Partnerships"
 faction_manifest_periphery_partnership_desc: "We will build lasting ties through trade and mutual defense. The pact reaches full progress with four members."

 faction_manifest_arab_sovereignty_name: "Defend Arab Sovereignty"
 faction_manifest_arab_sovereignty_desc: "We will bring independent Arab nations together to defend their right to govern themselves. Progress follows the share of existing Arab nations that are independent members of the Front."

 joining_rule_independent_arab_nations_only: "Independent Arab Nations Only"
 joining_rule_independent_arab_nations_only_desc: "Must be an independent Arab nation."

 collection_faction_fully_controlled_core_states: "Faction Core States Fully Controlled by Their Owners"
 collection_nile_security_members: "Egypt and Sudan in the Faction"
 collection_arab_nations: "Existing Arab Nations"
 collection_independent_arab_faction_members: "Independent Arab Faction Members"

 faction_manifest_balkan_socialist_cooperation_name: "A Socialist Balkans"
 faction_manifest_balkan_socialist_cooperation_desc: "We will bring the socialist governments of the Balkans together in a common front. Progress follows the share of eligible Balkan countries that have a communist or non-aligned communist government and belong to the Union."

 faction_manifest_eastern_european_pact_name: "An Eastern European Front"
 faction_manifest_eastern_european_pact_desc: "From the Baltic to the Black Sea, we will build a regional bloc that can stand against outside powers. Progress follows the share of the Pact's prospective members that have joined."

 collection_balkan_pact_countries: "Eligible Balkan Countries"
 collection_balkan_socialist_faction_members: "Communist Balkan Members"
 collection_eastern_european_pact_countries: "Eastern Europe Pact Countries"
 collection_eastern_european_pact_members: "Regional Pact Members"

 faction_manifest_peace_in_our_time_name: "Peace in the World"
 faction_manifest_peace_in_our_time_desc: "'Animus in consulendo liber'\n--------------\nThe collapse of the Warsaw Pact and the rise of international law and order once more was all thanks to the collective effort of NATO Member States. Today, however, it appears that some states in our world have decided to exploit this era of stability for their own interests, and are actively working against NATO efforts. In order to ensure security in our times we must work to expand the alliance to new frontiers, and ensure the safety for all peoples globally."

 faction_manifest_preserving_our_place_name: "Preserving Our Place in the World"
 faction_manifest_preserving_our_place_desc: "'Collective security in a multipolar world'\n--------------\nThe collapse of the Soviet Union brought about the creation of several states. Such an event posed itself as an opportunity to the Western bloc, where the United States and the rest of NATO sought out to bring former Soviet states under their influence. Though many are saying that a newly hegemonic United States is the world's sole superpower, it is our faction's intent to derail any hope of that becoming a permanent reality. Through strength in unity we will ensure that the post-Soviet sphere is protected, armed, and prepared."

 faction_manifest_unite_islamic_countries_name: "Unite The Islamic World"
 faction_manifest_unite_islamic_countries_desc: "For centuries now, the Islamic world has been disjointed - now through cooperation and understanding we can be united once more."

 faction_manifest_the_second_red_wave_goal_name: "The Second Red Wave"
 faction_manifest_the_second_red_wave_goal_desc: "When the Bolsheviks first took power, they ignited a fire that lasted for decades. Yet they couldn't solve the biggest flaw of their new system: the incompetent leadership. While the West was growing stronger, the Soviet Union was stagnating. We have lived under communist dictatorships for too long. Now it's our time to rule the world in our own vision of communism."

 faction_manifest_comeback_of_the_monarchy_name: "The Comeback of The Monarchy"
 faction_manifest_comeback_of_the_monarchy_desc: "For centuries, monarchies have ruled the world with wisdom and strength. Yet in recent decades, republics and democracies have taken over, introducing only temporary peace and stability. That prosperity began to fall, so it is time for the monarchies to rise again, to restore order and tradition to our nations. Through unity and cooperation, we can bring back the glory of the monarchy and lead our people to a brighter future."
