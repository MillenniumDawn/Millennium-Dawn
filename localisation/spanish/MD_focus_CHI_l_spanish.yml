 CHI_hainan_free_trade_port: "Puerto de libre comercio de Hainan"
 CHI_hainan_free_trade_port_desc: "En 2018, Pekín designó a la totalidad de Hainan como zona piloto de libre comercio, con un plan maestro publicado en 2020 que trazó el camino hacia un territorio aduanero totalmente independiente para 2025. Las obras de ampliación en Haikou y el puerto de aguas profundas de Yangpu, junto con los terrenos del foro de Boao, mejoran la capacidad logística y de conferencias de la isla de cara al cierre aduanero regional. Una vez sellado, las mercancías circularán libremente dentro de Hainan y se enfrentarán a aranceles solo cuando crucen a la zona aduanera del continente."
 CHI_hainan_zero_tariff_zone: "Zona de arancel cero de Hainan"
 CHI_hainan_zero_tariff_zone_desc: "Un catálogo publicado de mercancías con arancel cero permite que las importaciones que cumplan los requisitos entren en Hainan libres de derechos, mientras que los tipos del impuesto sobre la renta de las personas físicas y jurídicas se limitan al 15 % para los residentes elegibles y las industrias fomentadas. Las franquicias de venta minorista libres de impuestos fuera del continente (*offshore*) se amplían enormemente más allá de las del continente, atrayendo un gasto turístico que antes se destinaba a Hong Kong o al extranjero. El régimen fiscal y arancelario acelera la transformación de Hainan, pasando de una economía basada en las plantaciones y la pesca a una orientada al turismo, los servicios extraterritoriales y el comercio de procesamiento de alto valor."
 CHI_kra_canal_underwriting: "Financiar el canal de Kra"
 CHI_kra_canal_underwriting_desc: "El Banco de Desarrollo de China y el Banco de Exportación e Importación de China conceden financiación preferencial para la próxima fase de excavación del canal a través del istmo de Kra. La línea de crédito permite a Bangkok proceder con la construcción de inmediato en lugar de esperar a los ciclos presupuestarios nacionales, al tiempo que vincula la finalización del proyecto a la buena voluntad continua de China. Cada tramo profundiza la participación financiera de Pekín en una vía navegable que permitiría al transporte marítimo chino eludir el estrecho de Malaca."
 CHI_kra_canal_underwriting_phase_tt: "El §Ycanal de Kra§! aún está en construcción."
 CHI_kra_transit_corridor: "Corredor de tránsito de Kra"
 CHI_kra_transit_corridor_desc: "Las empresas estatales chinas de transporte marítimo y energía establecen terminales de tránsito y abastecimiento de combustible en el completado canal de Kra, lo que reduce los viajes de los petroleros desde el golfo Pérsico hasta Guangdong en unos 1.200 kilómetros y alivia la dependencia del estrecho de Malaca, congestionado y vulnerable a los cuellos de botella. El acuerdo resulta más valioso cuando las empresas chinas poseen una concesión operativa sobre el tráfico del canal en lugar de simples derechos de tránsito."
