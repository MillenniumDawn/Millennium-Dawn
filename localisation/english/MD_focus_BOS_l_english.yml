 BOS_anti_government_demonstrations: "Anti Government Demonstrations"
 BOS_anti_government_demonstrations_desc: "Many have taken to the streets over our actions. The unrest will subside once the affected people's Attitude and Stability recover."
 BOS_internal_faction_balance: "The Peoples of Bosnia"
 BOS_internal_faction_balance_desc: "The balance of Bosniak, Croat, and Serb interests across the state apparatus shapes stability and recruitment."
 BOS_landmine_contamination: "Landmine Contamination"
 BOS_landmine_contamination_desc: "Uncleared wartime minefields in this region kill civilians, restrict settlement, and keep productive land out of use."

