 SOV_russian_airforce_idea_1_desc: "The Air Force flies a fleet it cannot fuel and trains pilots it cannot afford to keep current. Accident rates are climbing and readiness is nominal.\n§W--------------§!\nThis national spirit will be §Geased§! one step by each of the §HReorganize the Air Force§!, §HReforms in Structures§! and §HForm the UAC§! focuses, in any order. It is §RRemoved§! entirely by the §HRussian Aerospace Forces§! focus."
