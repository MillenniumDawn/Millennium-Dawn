 KOR_naturalized_citizens_serve: "Naturalizowani obywatele zobowiązani do służby"
 KOR_naturalized_citizens_serve_desc: "Naturalizowani obywatele Korei urodzeni za granicą będą teraz zobowiązani do służby wojskowej. Chociaż pomogło to przeciwdziałać spadkowi liczby poborowych w związku z kurczeniem się populacji Korei, zniechęciło to obcokrajowców do nabycia obywatelstwa koreańskiego."
 KOR_has_progressive_government_TT: "Ma §YProgresywny§! Rząd"
 KOR_has_progressive_coalition_TT: "Ma §YProgresywny§! Członek koalicji"
 KOR_has_liberal_government_TT: "Ma §YLiberal§! Rząd"
