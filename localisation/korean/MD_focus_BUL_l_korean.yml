 BUL_generic_factory_5_desc: "에너지 안정을 보장하기 위해 우리나라에 석유 비축분을 마련해야 합니다."
 BUL_construction_effort_5_desc: "우리는 현대적 기준에 맞춰 교육을 개혁해야 합니다."
 BUL_ally_to_china_desc: "중국은 세계에서 가장 크고 가장 성공한 공산주의 국가입니다. 그들은 우리의 당연한 동맹입니다!"
 BUL_ally_to_russia_desc: "러시아는 소련 붕괴 이후에도 여전히 서방의 영향력에 맞서 싸우고 있으므로 우리는 그들과 우호를 맺어야 합니다."
 BUL_macedonia_in_flames_desc: "마케도니아의 형제들에게 혁명의 불길을 퍼뜨릴 때가 왔습니다!"
 BUL_generic_generic_generic_genericism_desc: "우리에게는 바다가 있어 좋은 해변을 만들 수 있으므로 관광 부문을 발전시켜야 합니다. 또한 많은 명소도 있습니다."
 BUL_bulgarian_generic_generic_generic_computer_desc: "불가리아의 컴퓨터 산업은 최고라고 할 수 없지만, 어... 어쩌면 개선을 시도해 봐야 할지도 모릅니다."
 BUL_generic_generic_bulgarian_vlaues_desc: "우리의 민족적 가치와 종교는 지켜져야 합니다. 과거를 모르는 자는 좋은 미래를 만들 수 없습니다!"
 BUL_generic_conservative_ecologism_generic_desc: "에코글라스노스트는 1989년 4월 11일에 설립되어 1989년 12월 11일에 공식 등록된 독립적인 불가리아 환경 단체입니다. 에코글라스노스트는 야권 연합 운동인 민주세력연합의 창립 회원이 되었습니다."
 BUL_red_balkan_dream_desc: "우리의 절대적인 목표는 발칸 전역에서 공산주의 이념이 승리하는 것입니다!"
 BUL_ally_to_yugo_desc: "유고슬라비아는 여전히 서방의 영향력에 저항하는 몇 안 되는 국가 중 하나입니다. 우리는 그들과 우호를 맺어야 합니다!"
 BUL_generic_army_effort_desc: "새천년을 맞아 불가리아 육군은 바르샤바 조약 해체 이후 변혁을 앞두고 있으며, 현대화, 훈련, 나토 통합을 우선시합니다. 육상, 공중, 해상 구성 요소를 갖춘 이 군대는 불가리아의 방어를 수호하고 국제 평화유지 임무에 참여하여, 변화하는 안보 역학 속에서 적응력과 전문성에 대한 의지를 보여 줄 것입니다."
 BUL_Expansionism_desc: "우리나라는 오랜 존속 기간 동안 너무 많은 영토를 잃었습니다. 이러한 상실의 과정을 멈추고 마침내 우리나라의 위대함을 되찾을 때입니다!"
 BUL_improved_administration: "행정 개선"
 BUL_improved_administration_desc: "간소화되고 개혁된 우리의 행정은 시민과 국가 전체의 부담을 손쉽게 감당할 수 있습니다."
 BUL_demcrat_maced_resolv_desc: "우리는 마케도니아와의 모든 갈등을 해결하고 우호 협력 조약에 서명해야 합니다."
 BUL_oligarchy_desc: "기업이 번영해야 불가리아가 그 혜택을 누립니다! 게오르기 간체프는 무엇이 좋은지 알고 있습니다!"
 BUL_step_labour_union_desc: "기업에 대한 규제 철폐! 이것이 우리의 새 좌우명입니다! 반대하십니까? 당신에게 안된 일이군요!"
 BUL_jorj_kgb_desc: "게오르기 간체프는 수년간 영국을 상대로 첩보 활동을 한 전직 KGB 요원입니다. 그는 훌륭한 특수 기관을 갖는다는 것이 무엇을 의미하는지 알고 있습니다!"
 BUL_business_monopoly_desc: "그렇습니다! 제대로 들으셨습니다! 나라를 지배할 하나의 거대 기업을 세우면 되는데, 왜 여러 경제 부문의 독점에 맞서 애써야 합니까!"
 BUL_sports_promotion_desc: "펜싱은 최고의 스포츠입니다. 게오르기 간체프는 분명 이에 대해 잘 알고 있습니다. 모든 사람이 펜싱 대회에 참석해야 합니다. 이것은 규칙입니다!"
 BUL_george_in_action_desc: "'행동하는 게오르기'는 불가리아에서 매우 인기 있던 TV 프로그램이었습니다. 지금부터 매일 저녁 모든 TV 채널이 오직 이 프로그램만 방영하며, 여기서 게오르기가 평범한 사람들과 대화를 나눌 것입니다!"
 BUL_liberal_autocrat_populism_desc: "우리의 경제는 자유주의적이고, 우리의 정치는 전제적이며, 우리의 지도자는 포퓰리스트입니다! 더 무슨 말이 필요합니까?"
 BUL_liberals_focus_desc: "민주당은 불가리아의 중도우파 정당입니다. 이 정당은 유럽 국민당의 회원이었습니다."
 BUL_christian_values_desc: "기독교적 가치는 우리의 정치적 행동을 위한 도덕적 토대입니다."
 BUL_looking_to_germany_desc: "독일식 정부 모델이 우리의 주된 본보기가 되어야 합니다."
 BUL_like_angela_merkel_desc: "앙겔라 메르켈은 독일의 저명한 정치인이며, 우리는 그녀의 정책과 실천을 존경합니다. 우리는 그녀의 본보기를 따라야 합니다."
 BUL_corporativism_dem_desc: "기독교 조합주의는 고린도전서 12장 12-31절에서 타르수스의 바울이 말한 기독교 교리의 사회적, 경제적 또는 현대 정치적 적용으로, 모든 사람과 구성 요소가 인체처럼 기능적으로 결합된 유기적 형태의 정치와 사회를 말합니다."
 BUL_respect_worker_rights_desc: "노동자는 우리 경제와 사회의 근간입니다. 우리는 어떠한 대가를 치르더라도 그들의 권리를 지지해야 합니다."
 BUL_free_will_free_society_desc: "우리 사회의 의지가 드러나고 우리에게 전달되어야 하며, 그렇게 함으로써 우리는 진정한 민주적 통치를 구현할 것입니다."
 BUL_free_economic_zones_desc: "불가리아를 외국인 투자에 더 적합하게 만들기 위해 자유 경제 구역을 설립해야 합니다."
 BUL_businees_as_usual_desc: "우리의 관행은 그대로 유지되어야 하며, 우리는 이미 확립된 노선을 계속 나아갈 것입니다."
 BUL_pipeline_greece_desc: "양국 모두 에너지 수요를 충족할 송유관이 필요합니다."
 BUL_pipeline_russia_desc: "양국 모두 에너지 수요를 충족할 송유관이 필요합니다."
 BUL_demcrat_turks_compromis_desc: "우리는 우리나라에 거주하는 튀르키예계 소수민족과 어떤 합의를 찾으려 노력해야 합니다."
 BUL_pirate_party_desc: "해적당은 불가리아의 정당입니다. 이들의 목표는 지적 재산, 특허, 저작권 분야의 법률을 개혁하는 것입니다. 이들은 지적 재산 개혁, 비상업적 정보의 자유와 불기소, 그리고 사생활 보호를 옹호합니다."
 BUL_freedom_for_all_desc: "우리는 모두를 위한 미디어와 저작권의 자유를 보장하고 사이버 노예제의 쇠사슬을 끊어야 합니다!"
 BUL_free_media_desc: "미디어는 어떠한 검열로부터도 자유로워야 하며 완전히 해방되어야 합니다."
 BUL_minarchist_council_desc: "최소국가주의는 제한적이고 최소한으로 존재하는 국가 모델로, 그 기능은 자유지상주의 이론에 달려 있습니다. 우파 자유지상주의자들은 이를 시민에게 군대, 경찰, 법원을 제공하여 침략, 절도, 계약 위반, 사기로부터 보호하고 재산법을 집행하는, 비침략 원칙의 집행자로서만 지지합니다."
 BUL_no_copyright_desc: "저작권법은 평범한 사람들을 속이기 위한 일종의 속임수입니다. 우리는 이를 폐지해야 합니다!"
 BUL_freedom_for_communes_desc: "코뮌은 국가의 절대적 폭정으로부터 해방되어야 하며, 이를 보장하는 것이 우리의 역할입니다!"
 BUL_crusade_on_propaganda_desc: "UN은 우리를 통제하기 위해 만들어진 가짜 조직입니다! 우리는 무슨 수를 써서든 그에 저항해야 합니다!"
 BUL_support_from_us_party_desc: "미국에 있는 우리의 이념적 형제들이 우리를 돕는 데 진정으로 관심이 있을지도 모릅니다."
 BUL_greens_focus_desc: "불가리아 녹색당은 불가리아의 환경주의 정당입니다. 1989년 소피아에서 알렉산다르 카라카차노프가 창당했으며, 그는 이후 당 의장이 되었습니다."
 BUL_ecological_radicalism_desc: "생태 급진주의는 환경 문제를 해결하기 위해 사회 구조와 행동의 급격하고 근본적인 변화를 옹호하며, 흔히 전통적인 경제 및 정치 체제에 도전합니다."
 BUL_investing_in_eco_projects_desc: "녹색 투자는 기후 변화를 완화하고 생태 보존을 촉진하는 것을 목표로, 환경적으로 지속 가능한 사업, 기업, 기술에 재원을 배분하는 것을 말합니다."
 BUL_countering_ecological_reactionism_desc: "우리의 새로운 의제에 반대하는 모든 자는 침묵시키고 그에 걸맞게 처벌해야 합니다!"
 BUL_green_energy_desc: "재생 에너지는 햇빛, 바람, 물, 지열 같은 천연 자원에서 생산되는 지속 가능한 전력원을 가리키며, 무한히 보충될 수 있고 환경에 미치는 영향이 최소한입니다."
 BUL_glxin_bampem_zavodneri_desc: "우리의 녹색 의제에 부합하도록 산업 생산의 새로운 표준을 확립해야 합니다."
 BUL_freash_bulgarian_air_desc: "신선한 공기는 자유, 건강, 그리고 때묻지 않은 자연 경관과의 연결이라는 본질을 구현하기에 불가리아 국민에게 필수적이며, 문화적 정체성에 깊이 뿌리내려 현대 생활의 압박으로부터의 안식처로 소중히 여겨집니다."
 BUL_bulgarian_wine_desc: "와인을 좋아하지 않는 사람이 있을까요? 우리는 없다고 생각합니다! 디오니소스의 축복이 우리 모두에게 내리기를!"
 BUL_green_bulgaria_desc: "이제 불가리아는 정체성을 혁신한 새롭고 더 푸른 국가가 되었습니다!"
 BUL_revitalizing_militar_industry_desc: "우리 군수 산업의 옛 위대함을 되살릴 때가 왔습니다."
 BUL_airburst_stuff_desc: "우리는 병사들을 위한 군 장비를 생산하는 국내 제조업체에 대한 투자를 늘릴 계획입니다."
 BUL_airburst_stufff_desc: "아스널은 우리나라에서 가장 오래된 무기 기업이며, 우리는 이 회사를 존속시키고 옛 영광을 회복시킬 계획입니다."
 BUL_zenith_ka_desc: "우리는 우리 군에 무기와 탄약을 공급하는 여러 군 장비 제조업체에 투자할 계획입니다."
 BUL_expanding_arsenal_desc: "우리는 군수 산업 전체를 하나로 통합하여 강력한 국가 방위 복합체를 만들 준비가 되어 있습니다."
 BUL_NATO_cooperation_desc: "우리는 군 교리에 관해 나토와 협력할 수 있습니다. 이러한 협력은 우리에게 상당히 유익할 것입니다."
 BUL_eu_ask_invest_desc: "독일에 투자를 요청해 보는 것이 좋을지도 모릅니다. 양측 모두에게 이로울 수 있습니다."
 BUL_global_diplomacy_desc: "불가리아의 글로벌 외교는 세계 모든 국가와 우호 관계를 수립하고 유지하며 평화적으로 공존하려는 국가의 염원을 반영합니다."
 BUL_the_country_of_brotherly_love_desc: "우리는 다른 발칸 이웃 나라들과의 관계를 개선해야 합니다."
 BUL_the_international_mediator_desc: "우리는 발칸의 모든 문제를 해결하는 데 중재자가 되어야 합니다."
 BUL_strength_in_cooperation_desc: "우리는 모든 발칸 국가와 모든 분야에서 협력을 강화해야 합니다."
 BUL_support_the_little_guys_desc: "우리는 발칸의 가장 친한 친구들을 우리가 할 수 있는 모든 것으로 도와야 합니다."
 BUL_a_global_power_desc: "영향력을 넓히려면 우리는 발칸의 선도 강국이 되어야 합니다."
 BUL_align_to_nato_desc: "우리는 나토와의 관계를 강화해야 하며, 장차 가입해야 합니다."
 BUL_eu_trading_deals_desc: "우리는 주요 동맹인 유럽 연합과의 무역 관계를 강화해야 합니다."
 BUL_align_to_nato2_desc: "우리는 나토에 가입해야 합니다. 지금 당장. 물론 그들이 우리를 받아 준다면 말입니다."
 BUL_arms_deals_desc: "나토의 틀 안에서 미국과의 협력에는 우리 무기의 갱신도 포함되며, 미국은 자국의 최고 보병 무기를 우리에게 판매할 의향이 있습니다."
 BUL_sanctions_avoid_desc: "불필요한 제재를 피하기 위해 모든 EU 및 나토의 요구 사항을 준수해야 합니다."
 BUL_eastern_alignment_desc: "우리는 BRICS 및 CSTO와의 관계를 강화해야 하며, 장차 가입해야 합니다."
 BUL_Economic_pertnership_with_eastern_europe_desc: "동유럽이 우리와 가장 가까우므로 그들과의 관계를 강화해야 합니다."
 BUL_align_to_nobody_desc: "적어도 지금으로서는 중립을 유지해야 합니다."
 BUL_special_partnership_desc: "주요 무역 및 경제 동반자 중 하나인 EAEU와의 관계를 강화할 필요가 있습니다."
 BUL_wto_deals_desc: "WTO와 더 긴밀한 협력을 조직할 필요가 있습니다."
 BUL_align_to_csto_desc: "우리는 CSTO에 가입해야 합니다. 지금 당장. 물론 그들이 우리를 받아 준다면 말입니다."
 BUL_SCO_partnership_desc: "SCO와 더 긴밀한 협력을 조직할 필요가 있습니다."
 BUL_joining_sco_desc: "우리는 SCO에 가입해야 합니다. 지금 당장. 우리 경제를 강화하기 위해서입니다."
 BUL_decommodify_the_basics_idea: "기본재의 탈상품화"
 BUL_decommodify_the_basics_idea_desc: "기본재는 상품으로 취급되어서는 안 됩니다. 그것은 기본이며 그렇게 다루어져야 합니다."
 BUL_develop_public_sector: "공공 부문 발전"
 BUL_develop_public_sector_desc: "불가리아의 공공 부문은 낡았으며, 우리는 그 광범위한 발전에 집중해야 합니다."
 bulg.14.b: "다행히 이 사태를 가라앉혔다..."
 BUL_will_pay_debt: "§Y우리는 부채를 갚을 것이다!§!"
 BUL_military_tree_shortcut: "육군 트리"
 BUL_economic_tree_shortcut: "경제 트리"
 BUL_diplomacy_tree_shortcut: "외교 트리"
 BUL_politic_tree_shortcut: "정치 트리"
 BUL_new_army: "군대 개혁 완수"
 BUL_new_army_desc: "21세기가 도래했으니, 지난 세기에 시작한 개혁을 완수하고 우리 군의 새로운 면모를 만들 때입니다."
 BUL_air_effort: "공군"
 BUL_air_effort_desc: "항공은 우리 군의 하늘의 방패이며, 이 방패는 그 어느 때보다 강해져야 합니다. 우리는 공군 전력에 대한 재정 지원을 늘리고 군 전체 부문의 구조 개혁을 시행할 것입니다."
 BUL_army_effort: "육군"
 BUL_army_effort_desc: "우리의 지상군 부대에는 개혁, 새로운 인력, 늘어난 재정 지원이 필요하며, 강한 보병 없이는 군사 작전을 성공적으로 수행할 수 없습니다."
 BUL_generic_logistic: "병참 지원 사령부"
 BUL_generic_logistic_desc: "강력한 병참이 없는 군대는 아무것도 아닙니다. 우리는 병력에 대한 병참 지원 예산을 몇 배로 늘릴 계획입니다."
 BUL_military_police: "헌병대"
 BUL_military_police_desc: "규율은 강한 군대의 열쇠이며, 강력한 헌병대가 없다면 머지않아 군대 붕괴라는 결과를 분명히 보게 될 것입니다."
 BUL_military_sso: "합동 특수전 사령부"
 BUL_military_sso_desc: "모든 군대에는 정예 부대가 있어야 하며, 적절한 재정 지원도 받아야 합니다. 대규모 군대가 더 이상 싸우지 않는 새로운 시대에는 특수 부대가 승패를 가르므로, 우리는 정예 병력의 재정, 인력, 기술 장비를 개선하는 데 집중할 것입니다."
 BUL_return_morpehi: "해병대 재건"
 BUL_return_morpehi_desc: "해병대는 20세기에 우리가 해체했으나, 고국의 해안을 방어하거나 반대로 다른 나라의 해안을 습격할 준비를 갖추기 위해 이 영광스러운 군종을 재건할 때입니다."
 BUL_peacekeepers: "평화유지군 대대"
 BUL_peacekeepers_desc: "21세기에 어느 군대든 평화유지 활동은 표준이 되고 있으며, 이제 모든 국가가 세계 어디서든 다른 국가를 지원할 수 있도록 적어도 평화유지군 대대 하나를 편성하려 하고 있습니다. 우리도 예외가 아닐 것입니다."
 BUL_help_army: "보조 부대"
 BUL_help_army_desc: "주력군에 대한 개혁에 더하여, 국가의 집권당에 따라 우리에게는 다양한 종류의 부대를 창설하거나 재건할 수 있는 독특한 기회가 있습니다."
 BUL_create_pmc: "민간 군사 기업 바텐베르크 창설"
 BUL_create_pmc_desc: "유명한 올리가르히 바실 보시코프는 러시아 바그너 민간 군사 기업의 경험에서 영감을 받아, 세계 정치에서 우리나라의 역할을 강화하기 위해 자신의 민간 군사 기업을 창설하려 하고 있습니다."
 BUL_rebuild_rocket_troops: "로켓군 재건"
 BUL_rebuild_rocket_troops_desc: "우리 군의 미사일 부대는 21세기 초 나토의 명령으로 해체되었으나, 이제 우리 군이 힘을 되찾을 수 있도록 이들을 복원하려 합니다."
 BUL_mobilize_national_guard: "국가 방위대 동원"
 BUL_mobilize_national_guard_desc: "국가 방위대가 우리 국가의 방어에서 진정으로 자신의 가치를 증명할 때입니다."
 BUL_bulgarian_brsm: "국방 지원 기구"
 BUL_bulgarian_brsm_desc: "우리는 이 청년 조직을 되살릴 것이며, 청년들은 국가의 군사 분야에 참여해야 합니다."
 BUL_build_troops: "건설 부대"
 BUL_build_troops_desc: "우리 군은 건설 부대가 매우 부족합니다. 전장의 지형이 스스로 알아서 맞춰지기를 바랄 것이 아니라 우리 자신을 위해 바꿔야 하기 때문입니다."
 BUL_start_revoult: "§Y[FYR.GetNameWithFlag]§!에서 봉기 §Y개시§!"
 FYR_start_revoult: "§Y[BUL.GetNameWithFlag]§!에서 봉기 §Y개시§!"
 bulg.16.t: "친불가리아 봉기"
 bulg.16.d: "불가리아 특수 기관이 우리 영토에서 봉기를 일으키는 데 성공했습니다! 그들은 오랫동안 반군을 지원해 왔으며, 이제 우리를 마침내 무너뜨리기로 결심한 듯합니다!"
 bulg.16.a: "젠장, 그들을"
 bulg.17.t: "친마케도니아 봉기"
 bulg.17.d: "마케도니아 특수 기관이 우리 영토에서 봉기를 일으키는 데 성공했습니다! 그들은 오랫동안 반군을 지원해 왔으며, 이제 우리를 마침내 무너뜨리기로 결심한 듯합니다!"
 bulg.17.a: "젠장, 그들을"
 bulg.18.t: "도움을 요청하는 반군"
 bulg.18.d: "우리가 일으킨 반군은 공동의 적에 맞서 싸우기 위해 군사 지원과 직접적인 군사 개입을 요청하고 있습니다."
 bulg.18.a: "우리도 참전한다"
 bulg.18.b: "아니요"
 bulg.19.t: ""
 bulg.19.d: ""
 bulg.19.a: ""
 bulg.20.t: ""
 bulg.20.d: ""
 bulg.20.a: ""
 bulg.21.t: "불가리아의 원자력 발전소"
 bulg.21.d: "불가리아가 원자력 발전소 건설을 도와 달라고 요청하고 있습니다. 이 작업을 효율적으로 수행할 수 있는 것은 우리 전문가들뿐이기 때문입니다. 불가리아의 에너지 안보를 보장할 준비가 되어 있습니까?"
 bulg.21.a: "물론이지"
 bulg.21.b: "아니요"
 bulg.22.t: "불가리아의 원자력 발전소"
 bulg.22.d: "러시아가 우리나라의 원자력 발전소 건설을 완료하기 위해 자국 전문가를 보낼 준비가 되었다고 통보했으며, 이는 의심할 여지 없이 우리를 기쁘게 합니다!"
 bulg.22.a: "알았다"
 bulg.23.t: "불가리아의 원자력 발전소"
 bulg.23.d: "러시아는 우리의 원자력 발전소 건설을 돕기를 거부한다고 알려 왔으며, 우리는 그들의 거부에 놀랐습니다."
 bulg.23.a: "슬프다"
 bulg.24.t: "불가리아의 루크오일"
 bulg.24.d: "불가리아 정부는 우리 석유 기업 루크오일과의 협력을 확대할 준비가 되어 있으며, 불가리아에서 사업 활동을 확장할 기회를 줄 준비가 되었다고 발표했습니다."
 bulg.24.a: "동의한다"
 bulg.24.b: "아니요"
 bulg.25.t: "불가리아의 루크오일"
 bulg.25.d: "러시아는 우리나라에서 루크오일의 협력을 우리가 필요한 만큼 확대할 준비가 되었다고 알려 왔으며, 이는 우리의 에너지 안보에 좋은 소식입니다."
 bulg.25.a: "알았다"
 bulg.26.t: "불가리아의 루크오일"
 bulg.26.d: "러시아는 우리나라에서 루크오일의 활동을 확대할 준비가 되어 있지 않다고 알려 왔으며, 우리는 이에 극도로 실망했습니다. 그들은 정말 누군가를 두려워하는 것일까요?"
 bulg.26.a: "슬프다"
 bulg.27.t: "불가리아와의 군 훈련"
 bulg.27.d: "불가리아 정부는 조율을 발전시키고 부대 간 상호 작용을 개선하며 양국 군의 경험을 교환하기 위해 우리 군과 자국 군의 특별 군사 훈련을 실시하기를 원합니다."
 bulg.27.a: "동의한다"
 bulg.27.b: "아니요"
 bulg.28.t: "러시아와의 군 훈련"
 bulg.28.d: "러시아 정부는 특별한 방식으로 양국 군의 훈련을 실시할 준비가 되어 있으며, 이는 우리 참모부에 좋은 소식입니다."
 bulg.28.a: "알았다"
 bulg.29.t: "러시아와의 군 훈련"
 bulg.29.d: "러시아 정부는 자국 군대가 더 중요한 사안에 몰두하고 있다는 이유를 들어 양국 군의 훈련 실시를 거부했습니다."
 bulg.29.a: "슬프다"
 bulg.30.t: "불가리아-미국 공동 군사 시설"
 bulg.30.d: "불가리아 정부는 자국 보호의 보장과 자국군 훈련을 위한 숙련된 전문가로서 우리 병력을 불가리아 영토에 배치할 것을 제안하고 있습니다."
 bulg.30.a: "동의한다"
 bulg.30.b: "아니요"
 bulg.31.t: "불가리아-미국 공동 군사 시설"
 bulg.31.d: "미국 정부는 우리의 제안에 동의했으며 우리 영토의 여러 군사 시설에 약 2,500명의 병력을 배치할 준비가 되었습니다."
 bulg.31.a: "알았다"
 bulg.32.t: "불가리아-미국 공동 군사 시설"
 bulg.32.d: "미국 정부는 병력 배치에 관한 우리와의 협정 서명을 거부했습니다. 그들은 정말 누군가를 두려워하는 것일까요?"
 bulg.32.a: "슬프다"
 BUL_tennesi: "테네시 주 방위군과의 훈련"
 BUL_tennesi_desc: "미국과의 군사 동반자 관계는 특별 프로그램의 일환으로 각 주와도 개별적으로 발전하고 있으며, 각 주는 공동 군사 훈련을 위해 공산권의 옛 일원이었던 파트너 국가를 하나씩 선택했습니다. 우리와의 협력은 테네시 주가 맡게 되었으며, 우리는 그들과 군사 훈련을 실시할 것입니다."
 BUL_military_objects: "불가리아-미국 공동 군사 시설"
 BUL_military_objects_desc: "불가리아-미국 공동 군사 시설은 미국과 불가리아가 서명한 국방 협력 협정에 따라 설립되었습니다. 협정에 따라 미군은 이 기지들에서 훈련하며, 기지는 불가리아의 지휘와 불가리아 국기 아래 그대로 유지됩니다."
 BUL_align_to_usa: "미국과의 동반자 관계"
 BUL_align_to_usa_desc: "우리는 미국을 가장 신뢰할 수 있는 동반자로 보며, 그 교리와 외교 정책에 의지할 준비가 되어 있습니다. 우리는 서방 세계의 일부이며 이에 저항할 생각이 없습니다."
 BUL_align_russia: "러시아와의 동반자 관계"
 BUL_align_russia_desc: "러시아와 불가리아는 오랜 동맹이자 동반자였으며, 우리는 같은 사회주의 군사 블록의 일원이었으나 사회주의 진영이 붕괴한 뒤 모든 접촉을 잃었습니다. 어쩌면 형제적 유대를 되찾을 기회가 있을지도 모릅니다."
 BUL_russian_aes: "러시아 원자력 발전소"
 BUL_russian_aes_desc: "러시아 기업 로스아톰은 원자력 발전소 건설을 도울 준비가 되어 있으며, 이는 우리 에너지 안보에 대한 훌륭한 보장이자 양국 간 우정의 멋진 행위가 될 것입니다."
 BUL_arms_boost: "러시아의 군수 산업 투자"
 BUL_arms_boost_desc: "러시아의 군수 산업은 의심할 여지 없이 세계 최고 수준이며, 우리는 그들이 우리나라에 투자하도록 허용할 준비가 되어 있습니다. 우리가 러시아와 우호를 맺는 길을 선택한 이후 우리나라는 이제 많은 적의 위협을 받고 있기 때문입니다."
 BUL_army_boost: "양국 군의 군사 훈련"
 BUL_army_boost_desc: "우리는 양국 군의 최대 규모 합동 훈련을 실시할 준비가 되어 있습니다. 이 훈련은 우리에게 유용한 경험이 될 것이며, 경험 교환을 고려할 때 일부 육군 부대를 개선하는 데 도움이 될 것입니다."
 BUL_lukoil_boost: "루크오일과의 협력 확대"
 BUL_lukoil_boost_desc: "러시아 기업 루크오일은 오랫동안 우리 시장에서 운영해 왔으며, 우리는 그들이 우리 시장에서 활동을 확장하도록 허용할 준비가 되어 있습니다. 그 대가로 우리는 훨씬 더 큰 에너지 안보를 얻게 될 것입니다."
 BUL_military_usa_objects: "불가리아-미국 공동 군사 시설"
 BUL_armstechno: "암스테크노"
 BUL_armstechno_desc: "국내 드론 및 무인기 제조업체가 사업 확대를 위한 정부 자금을 지원받게 됩니다."
 BUL_terem: "테렘"
 BUL_terem_desc: "국방부 산하 12개 정비 시설입니다. 장갑, 자동차, 항공, 포병 및 레이더 장비의 정비를 전문으로 하는 다기능 구조의 공장들입니다."
 BUL_arms_mars: "MARS 아머 유한회사"
 BUL_arms_arsenal: "아스널 AD"
 BUL_arms_sopot_kentox: "VMZ 소포트 및 킨텍스"
 BUL_arms_techno: "암스테크노"
 BUL_arms_terem: "테렘"
 BUL_general_bank: "유나이티드 불가리안 뱅크"
 BUL_general_bank_desc: "유나이티드 불가리안 뱅크는 불가리아의 상업 은행입니다. 22개 국영 상업 은행의 합병을 통해 이뤄진 불가리아 최초이자 최대의 은행 통합 사업입니다. UBB는 1992년 9월 30일에 설립되었습니다."
 BUL_dsk_bank: "DSK 은행"
 BUL_dsk_bank_desc: "DSK 은행은 불가리아 최대 은행입니다. 1951년 국가 저축 은행으로 설립되었으며 1999년 주식회사로 전환되었습니다."
 BUL_post_bank: "포스트뱅크"
 BUL_post_bank_desc: "법적으로 유로뱅크 불가리아 AD로 알려진 포스트뱅크는 불가리아의 종합 은행입니다."
 BUL_overgas: "오버가스 AD"
 BUL_overgas_desc: "1991년에 설립된 오버가스는 천연가스 부문에서 불가리아 최대의 민간 기업이며, 특히 가스화 분야의 기반시설 서비스를 개발하고 제공하는 선두 기업입니다."
 BUL_vivacom: "비바컴"
 BUL_vivacom_desc: "비바컴은 불가리아의 통신 회사입니다. 매출과 시장 점유율 모두에서 불가리아 최대의 통신 회사이며, 과거에는 국영 사업자였습니다."
 BUL_ontotex: "불가리아 IT 기업"
 BUL_ontotex_desc: "IT가 세계 경제의 미래이므로 우리는 IT 부문에 대규모 투자를 할 계획입니다."
 BUL_energy_holding: "불가리안 에너지 홀딩"
 BUL_energy_holding_desc: "불가리안 에너지 홀딩 EAD는 불가리아의 국영 에너지 지주회사입니다. 마리차 이스토크 2 발전소의 소유자입니다."
 BUL_bulgargaz: "불가르가즈"
 BUL_bulgargaz_desc: "불가르가즈는 불가리아 최대의 천연가스 유통 회사입니다. 불가리안 에너지 홀딩 EAD의 자회사입니다."
 BUL_aurubis: "아우루비스 불가리아"
 BUL_aurubis_desc: "아우루비스 불가리아는 남동유럽 최대의 구리 제련 및 정련 시설입니다. 공장은 불가리아 서부 소피아주의 피르도프와 즐라티차 사이에 위치합니다. 1958년에 설립된 이 공장은 초기 연간 생산 능력이 16만 톤이었으며 현재는 34만 톤으로 확장되었습니다."
 BUL_asarel: "아사렐 메데트"
 BUL_asarel_desc: "아사렐 메데트는 구리를 채굴하고 가공하는 불가리아 기업입니다. 광산과 가공 공장은 불가리아 파자르지크주의 파나기우리슈테 북서쪽 11킬로미터에 위치합니다. 매년 1,300만 톤이 넘는 구리 광석을 채굴하고 구리 정광을 생산하여, 파나기우리슈테 북쪽 약 25킬로미터에 있는 피르도프 구리 제련소 및 정련소를 포함해 전 세계에 판매합니다. 광석에는 몰리브덴, 니켈, 금, 은도 포함되어 있습니다."
 BUL_astrabioplant: "아스트라바이오플란트"
 BUL_astrabioplant_desc: "\\"아스트라 바이오플랜트\\" 사업은 식물성 기름과 바이오디젤 생산을 위한 현대식 공장의 기획과 건설로 시작됩니다. 이 생산 설비는 연간 6만 톤의 바이오디젤 생산 능력을 확보할 수 있게 해 줍니다."
 BUL_railways: "불가리아 국영 철도"
 BUL_railways_desc: "우리나라의 철도망은 오랫동안 발전을 위한 투자를 받지 못했으며, 우리는 이를 바로잡을 것입니다."
 BUL_airways: "불가리아 항공"
 BUL_airways_desc: "우리나라의 주요 항공사들은 추가 투자를 받을 것이며, 새로운 공항들이 개설되어 군사적 목적을 포함해 우리에게 유용하게 쓰일 수 있습니다."
 BUL_agrix: "아그릭스"
 BUL_agrix_desc: "아그릭스 불가리아 OOD는 곡물과 유지 작물을 거래하는 기업입니다. 이와 더불어 아그릭스 불가리아는 전국의 농가에 종자, 비료, 작물 보호 제품도 공급합니다. 아그릭스 불가리아 OOD는 역동적이고 빠르게 성장하는 기업으로, 설립 이래 연평균 78%의 성장률을 달성했습니다."
 BUL_agria: "아그리아 그룹 홀딩 JSC"
 BUL_agria_desc: "아그리아 그룹 홀딩 JSC는 불가리아 북동부에서 활동하는 상장 기업입니다. 이 그룹은 농업 생산, 곡물 및 유지 작물 거래, 저장, 가공, 운송과 물류, 재생 에너지를 전문으로 하는 다수의 기업으로 구성되어 있습니다."
 BUL_restore_pleven: "플라마 플레벤 정유소 복원"
 BUL_restore_pleven_desc: "90년대 경제 붕괴로 폐쇄되었던 정유소가 이제 다시 문을 열게 됩니다."
 BUL_foreign: "외국인 투자자 유치"
 BUL_foreign_desc: "외국인 투자는 우리 경제에 공기와도 같으므로, 우리는 외국인 투자자를 유치하기 위한 사업을 적극적으로 시작합니다."
 BUL_bdz_idea: "불가리아 국영 철도"
 BUL_bulair_idea: "불가리아 항공"
 BUL_ubb_idea: "유나이티드 불가리안 뱅크"
 BUL_postbank_idea: "포스트뱅크"
 BUL_dskbank_idea: "DSK 은행"
 BUL_aurubis_idea: "아우루비스 불가리아"
 BUL_asarel_idea: "아사렐 메데트"
 BUL_nimero_idea: "니메로"
 BUL_ontotext_idea: "온토텍스트"
 BUL_overgas_idea: "오버가스 주식회사 AD"
 BUL_vivacom_idea: "비바콤"
 BUL_energyholding_idea: "불가리아 에너지 홀딩"
 BUL_agrix_idea: "아그릭스"
 BUL_agria_idea: "아그리아 그룹 홀딩 JSC"
 BUL_lukoil_russian_idea: "러시아 루코일"
 BUL_foreign_investment: "외국인 투자자 유치 정책"
 BUL_inter_defence: "안전한 불가리아"
 BUL_inter_defence_desc: "우리나라는 외부와 내부의 적 모두로부터 보호받아야 하며, 우리의 특수 기관에는 충분한 재정이 지원되어야 합니다."
 BUL_special_police_troops: "특수 경찰 부대"
 BUL_special_police_troops_desc: "우리나라는 외부와 내부의 적 모두로부터 보호받아야 하며, 우리의 특수 기관에는 충분한 재정이 지원되어야 합니다."
 BUL_sia: "SIA"
 BUL_sia_desc: "불가리아의 해외 정보 기관으로, 불가리아 공화국의 국가 안보, 이익, 우선순위와 관련된 정보, 평가, 분석, 전망을 수집·처리·분석하여 국가 지도부에 제공합니다."
 BUL_sobt: "SOBT"
 BUL_sobt_desc: "SOBT는 불가리아 내무부 소속의 최상급 경찰 전술 부대입니다. 주된 임무는 중대한 테러 행위에 대응하고, 인질 구출을 수행하며, 고가치 표적을 체포하는 것입니다. SOBT에는 총 152명이 복무하고 있습니다."
 BUL_dans: "DANS"
 BUL_dans_desc: "DANS는 방첩 및 보안을 전담하는 기관으로, 불가리아의 국가 안보에 대한 위협을 탐지하고 예방하며 무력화하는 것이 주된 책무입니다. 불가리아에서 가장 강력한 보안 기관입니다."
 BUL_arsenal_income_idea: "아르세날 AD 출하 및 수익"
 BUL_arsenal_income_idea_desc: "JSC 아르세날 AD는 카잔라크에 본사를 둔 불가리아의 주식회사입니다. 아르세날 AD는 주로 화기와 군사 장비를 생산합니다."
 BUL_plama_pleven_refinery: "플라마 플레벤 정유소"
 BUL_christian_democracy: "기독교 민주주의"
 BUL_christian_democracy_desc: "기독교 민주주의의 가치는 사회 정의, 인간 존엄성, 그리고 기독교 윤리에 뿌리를 둔 민주적 통치를 강조하며, 우리의 자유주의 개혁에 도덕적 토대를 제공합니다."
 BUL_orthodox_national_values: "정교회 민족 가치"
 BUL_orthodox_national_values_desc: "정교회는 우리의 민족 정체성과 전통적 가치를 강화하여 국가의 도덕적 기반을 다지고, 우리 민족주의 대의에 대한 지지를 결집시킵니다."
 BUL_restructure_tourism: "불가리아 관광 재편"
 BUL_restructure_tourism_desc: "우리는 관광 부문을 재편하고 발전시켜야 합니다. 불가리아에는 해외 방문객을 끌어들일 흑해 해안, 스키 리조트, 풍부한 문화유산이 있습니다."
 BUL_major_tourist_destination: "주요 관광지"
 BUL_major_tourist_destination_desc: "주요 관광지가 완전히 개발되면 불가리아는 유럽의 일류 관광지 중 하나로 자리매김하여 GDP에 크게 기여할 수 있습니다."
 BUL_developed_all_tourist_destinations_tt: "모든 관광지 개발 완료 (선니비치, 보로베츠, 바르나 해변)"
 BUL_bulgarian_rose_oil: "불가리아 장미 오일"
 BUL_bulgarian_rose_oil_desc: "불가리아는 흔히 불가리아의 '액체 황금'이라 불리는 장미 오일로 유명합니다. 이 정유는 장미 계곡에서 재배되는 희귀한 다마스크 장미에서 추출됩니다. 주요 구매국으로는 프랑스, 미국, 중국이 있으며, 가치 있는 수출 상품이 되고 있습니다."
 BUL_rose_oil_exports: "불가리아 장미 오일 수출"
 BUL_rose_oil_exports_desc: "불가리아는 전 세계 장미 오일의 70%를 생산합니다. 장미 계곡의 귀한 다마스크 장미에서 얻는 정유는 향수, 화장품, 의약품에 쓰이며, 프랑스, 미국, 중국으로부터 높은 가격을 받습니다."
 BUL_tourism_1: "구조조정된 관광업"
 BUL_tourism_1_tt: "매년 §G$0.15B§!의 수익을 창출합니다"
 BUL_tourism_2: "주요 관광지"
 BUL_tourism_2_tt: "매년 §G$0.30B§!의 수익을 창출합니다"
 BUL_major_tourist_destination_idea: "주요 관광지"
 BUL_major_tourist_destination_idea_desc: "불가리아는 관광업이 국가 GDP의 11% 이상을 차지하는 주요 관광지가 되었습니다. 해변 휴양지, 스키장, 문화 유적지가 매년 수백만 명의 방문객을 끌어들이고 있습니다. 우리의 접객 산업은 앞선 개혁의 법인세 수입과 산업 생산성 향상을 유지하면서 새로운 거주민과 세수를 끌어들이고 있습니다."
 BUL_sunny_beach_revenue: "서니 비치 리조트"
 BUL_sunny_beach_revenue_desc: "서니 비치는 불가리아에서 가장 큰 해변 휴양지로, 러시아, 우크라이나, 루마니아, 영국, 독일, 튀르키예에서 온 관광객을 끌어들입니다. 이 휴양지는 상당한 관광 수익을 창출합니다."
 BUL_sunny_beach_revenue_tt: "매년 §G$0.60B§!의 수익을 창출합니다"
 BUL_borovets_revenue: "보로베츠 스키 리조트"
 BUL_borovets_revenue_desc: "보로베츠는 소피아 남쪽 릴라 산맥에 위치한 불가리아에서 가장 크고 오래된 스키 리조트 중 하나입니다. 유럽에서 가성비가 가장 좋은 스키 여행지로 꼽힙니다."
 BUL_borovets_revenue_tt: "매년 §G$0.40B§!의 수익을 창출합니다"
 BUL_varna_beaches_revenue: "바르나 해변 리조트"
 BUL_varna_beaches_revenue_desc: "골든 샌즈와 성 콘스탄틴과 헬레나를 포함한 바르나 지역의 해변은 러시아, 영국, 우크라이나, 루마니아 관광객이 으뜸으로 꼽는 여행지입니다."
 BUL_varna_beaches_revenue_tt: "매년 §G$0.45B§!의 수익을 창출합니다"
 BUL_284_return: "도브루자 국유화"
 BUL_anti_lgbtqa_stance_idea: "반LGBTQ 입장"
 BUL_anti_lgbtqa_stance_idea_desc: "전통적인 정교회 가치에 따라, 정부는 다른 보수 국가의 유사한 법률을 본떠 LGBTQ 선전과 공개적 표현을 제한하는 법안을 제정했습니다. 국제적으로는 논란이 되고 있으나, 이러한 입장은 민족주의 및 전통주의 유권자들 사이에서 지지를 강화합니다."
 BUL_economy_modifier: "불가리아 경제"
 BUL_army_modifier: "불가리아 육군"
 BUL_services_modifier: "불가리아 특수 기관"
 BUL_reforms_resolved_tt: "§g미완의 경제 개혁§!이 해결되었습니다."
 bul_expansion.1.t: "불가리아의 팽창 발표"
 bul_expansion.1.d: "불가리아는 영토를 확장하겠다는 의사를 공식적으로 선언했습니다. 국제 사회는 이제 소피아의 야망을 지지할지, 아니면 맞서 반대할지 결정해야 합니다."
 bul_expansion.1.a: "우리는 불가리아의 열망을 지지한다"
 bul_expansion.1.b: "우리는 이 공격적인 태도를 규탄한다"
 bul_mech.18.d: "이웃 나라의 대표들이 공동 국경 부근에서 합동 군사 훈련을 실시하자는 초청을 전해 왔습니다. 참여하면 우리 장교들이 귀중한 경험을 쌓고 지역 파트너들과의 협조를 강화할 수 있습니다."
 bul_yug.1.t: "유고슬라비아 문제"
 bul_yug.1.d: "불가리아는 기로에 서 있습니다. 옛 유고슬라비아의 땅이 우리 앞에 놓여 있습니다. 우리는 손을 내밀 것입니까, 아니면 역사적 영유권을 주장할 것입니까?"
 bul_yug.1.a: "옛 유고슬라비아 국가들을 우리의 조약에 초청한다"
 bul_yug.1.b: "옛 유고슬라비아에 대한 영토 영유권을 주장한다"
 bul_yug.2.t: "불가리아의 [THIS.GetName]에 대한 연합 발칸 조약 초청"
 bul_yug.2.d: "소피아가 [THIS.GetName]에 연합 발칸 조약에 가입하라는 공식 초청장을 보냈습니다. 이 결정은 발칸의 미래를 좌우할 것입니다."
 bul_yug.2.a: "수락한다. 발칸은 하나로 뭉친다."
 bul_yug.2.b: "그들의 제안을 거절한다."
 bul_yug.6.t: "불가리아의 영토 영유권 주장"
 bul_yug.6.d: "소피아가 역사적 권리와 국가 이익을 내세워 옛 유고슬라비아 영토에 대한 영유권을 공식 선언했습니다. 지역 안정에 미칠 파장은 심각합니다."
 bul_yug.6.a: "이러한 침략을 용납할 수 없다."
 bul_yug.7.t: "불가리아의 옛 유고슬라비아 영유권 주장"
 bul_yug.7.d: "불가리아가 옛 유고슬라비아 공화국들에 대한 영유권을 선언했습니다. 국제 사회는 대응을 결정해야 합니다."
 bul_yug.7.a: "불가리아에 제재를 가한다"
 bul_yug.7.b: "불가리아의 입장에 지지를 표명한다"
 bul_yug.7.c: "우리가 상관할 일이 아니다."
 bul_yug.8.t: "제재를 받는 우리"
 bul_yug.8.d: "[FROM.GetName]이(가) 옛 유고슬라비아에 대한 우리의 영유권 주장에 대응하여 불가리아에 제재를 가했습니다."
 bul_yug.8.a: "우리는 견뎌낼 것이다."
 bul_yug.9.t: "나서는 친구"
 bul_yug.9.d: "[FROM.GetName]이(가) 옛 유고슬라비아 영토에 대한 불가리아의 입장에 지지를 표명했습니다."
 bul_yug.9.a: "그들의 지지에 감사한다."
 BUL_under_sanctions: "국제 제재"
 BUL_under_sanctions_desc: "불가리아의 단호한 영유권 주장은 국제 사회의 비난과 경제적 압박을 불러왔습니다. 무역 상대국들은 경계하고 있고, 투자는 정체되었으며, 제재 국가들이 압박을 더해 감에 따라 세수가 쪼그라들고 있습니다."
 BUL_tourism_0_tt: "매년 §G$0.075B§!의 수익을 창출합니다"
 BUL_lower_tax: "세금 인하"
 BUL_euroatlantic_path_tt: "§Y불가리아는 유럽-대서양 노선에 전념합니다.§!"
 BUL_nationalist_path_tt: "§R불가리아는 권위주의적 민족 결집으로 돌아섭니다.§!"
 BUL_communist_path_tt: "§R불가리아는 붉은 발칸의 꿈을 받아들입니다.§!"
 BUL_currency_board_tt: "§G통화위원회의 신뢰도가 불가리아의 차입 비용을 낮춥니다.§!"
 BUL_privatization_risk_tt: "§R급속한 민영화는 새로운 부패를 불러옵니다.§!"
 BUL_smuggling_corruption_tt: "§R무기 밀매 경로는 부정부패의 통로 구실도 합니다.§!"
 BUL_energy_dependence_tt: "§R불가리아의 에너지는 값싼 러시아산 공급에 계속 묶여 있습니다.§!"
 BUL_acdi_support_only_tt: "그들은 우리 세력에 가입하지 않고 대신 장비 지원을 보내 줄 수도 있습니다."
 BUL_macedonia_decision_integration_tt: "불가리아가 소유한 마케도니아 영토는 §Y제4 불가리아 왕국§! 결정을 통해 통합할 수 있습니다"
 BUL_fyr_pact_costs_tt: "양국에 §Y$7.50B§!의 비용이 들며, 불가리아와 북마케도니아는 영향력 §Y3.5%§!를 서로 교환합니다"
 BUL_aes_costs_tt: "국고에서 §Y$10.00B§!가 소요되며 불가리아 내 러시아 영향력이 §Y2.5%§! 증가합니다"
 BUL_csto_invite_tt: "러시아가 §YCSTO§! 가입을 위한 공식 초청을 보냅니다"
 BUL_lukoil_influence_tt: "불가리아 내 러시아 영향력이 §Y1.5%§! 증가합니다"
 BUL_joint_exercises_tt: "합동 훈련은 소규모의 영구적인 육군 보너스를 부여하며 불가리아 내 러시아 영향력을 §Y1.5%§! 증가시킵니다"
 BUL_usa_facilities_influence_tt: "불가리아 내 미국 영향력이 §Y1.5%§! 증가합니다"
 BUL_united_balkan_pact: "통합 발칸 조약"
