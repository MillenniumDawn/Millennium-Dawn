l_korean:
 tut_2_text_1: "좋습니다! 이제 경보 확인을 마쳤으니 전쟁 수행의 세부 사항을 본격적으로 배워 봅시다. 이탈리아는 에티오피아와 전쟁 중인 상태로 시작하며, 방법만 익히면 이 전쟁에서 이기는 데 큰 어려움이 없을 것입니다.\n\n카메라를 남동쪽으로 옮겨 아프리카의 에리트레아를 찾으십시오. 카메라 위치를 옮겼다면 $STATE|Y$ 주에서 §Y여단을 선택하십시오§!. §G좌클릭§!한 채 끌어서 범위를 지정하면 됩니다."
 tut_3_text_1: "훌륭합니다! 이제 공세 계획을 세우는 법을 배웁니다.\n\n여단은 §Y군§!으로 묶을 수 있습니다. 군은 전투 계획을 그리는 데 쓰이며, 이를 이끌 §Y지휘관§!을 배정할 수 있습니다."
 tut_3_text_2: "여단을 선택한 상태에서 화면 아래의 §Y새 군§! 버튼을 클릭하십시오. 남쪽 §Y소말릴란드§!에 있는 여단도 같은 방법으로 하십시오."
 tut_5_text_1: "좋습니다! 이제 에티오피아 방면에 §Y전선§!이 생겼습니다. 부대가 §Y전투 계획§!에 따라 공격하게 하려면 먼저 §Y공세 명령§!도 그려야 합니다.\n\n§Y공세선§! 버튼을 클릭한 다음, §G우클릭§!한 채 강조 표시된 두 지방 사이로 끌어 그리십시오. 남쪽 §Y소말릴란드§!에 있는 여단도 같은 방법으로 하십시오."
 tut_11_text_1: "이제 아군이 에티오피아의 수도 아디스아바바를 향한 공세를 시작합니다. 적 영토를 충분히 점령하면 적은 항복할 것입니다.\n\n£SPACE 키를 눌러 게임의 §Y일시정지를 해제§!하십시오. £KP_PLUS  또는 £KP_MINUS  키로 게임 속도를 조절할 수 있습니다. 계속 같은 속도로 하기보다 상황에 맞게 속도를 바꿔 가며 하는 것이 보통입니다.\n\n힌트: 부대를 더 세밀하게 통제하고 싶다면 여단을 선택하고 지방을 §G우클릭§!하여 전투 계획에서 받은 명령을 직접 덮어쓸 수 있습니다."
 tut_13_text_1: "승리했습니다! 전쟁이 끝났고 에티오피아는 패배했습니다.\n\n평시에는 §Y병력을 수송§!해 바다 건너 다른 곳으로 재배치하거나, 다음 전쟁을 준비할 수도 있습니다. \n\n에티오피아를 물리쳤으니 그곳에 여단이 그렇게 많이 있을 필요는 없습니다.\n\n§Y여단 4개§! 이상을 선택해 §Y강조 표시된 항구§!로 이동시키십시오. 해당 지방을 §G우클릭§!하면 됩니다."
 TUT_QUEUE_DIV: "§L여단§! 1개가 배치 대기 중"
 TUT_SELECTED_DIVS: "$STATE$에서 여단 $NUMBERS$개 선택됨"
 TUT_TROOPS_IN_PORT: "$STATE$의 항구에 여단 $NUMBERS$개 대기 중"
 TUT_TROOPS_IN_TRANSIT: "여단 $NUMBERS$개가 $COUNTRY$의 항구로 이동 중"
 BUTTON_WIKI_DIVISION_TEMPLATES: "HOI4 위키에서 §H여단 편제§!에 대해 알아보기!"
 HINT_ARMY_PLANNER_TEXT_1_1: "여기는 §Y징집 및 배치§! 화면이며, 새 여단을 훈련 대기열에 올리고 이후 배치까지 관리하는 곳입니다. §Y디비지오네 디 판테리아§! 여단을 대기열에 추가하기를 권합니다.\n\n훈련 중인 여단은 먼저 필요한 §Y장비§!를 확보하려 합니다. 장비를 갖추면 훈련을 시작합니다. 훈련 진행도는 장비 확보 진행도를 넘을 수 없습니다.\n\n§Y훈련§! 버튼을 클릭하면 여단이 훈련 대기열에 추가됩니다."
 HINT_ARMY_PLANNER_TEXT_1_2: "여단이 훈련을 마치면 §Y원하는 위치§!에 §Y배치§!할 수 있습니다. 여단은 자국의 핵심 영토에만 배치할 수 있습니다."
 HINT_ARMY_PLANNER_TEXT_2: "여단은 순차로, 또는 병행해서 생산할 수 있습니다.\n\n병행 훈련 중인 여단은 §Y장비§!를 같은 속도로 받으므로 거의 같은 시기에 완성됩니다. 여단이 필요한 장비를 모두 갖추고 훈련을 마치면 선택한 위치에 배치됩니다.\n\n§Y부대 추가§!를 클릭하면 병행 훈련할 여단을 하나 더 추가합니다.\n\n전세가 불리하게 돌아갔다면 여단을 §Y장비와 훈련이 갖추어지기 전에§! 배치하는 것도 방법일 수 있습니다. 가능하면 피하는 것이 좋습니다.\n\n어떤 부대를 징집해야 할지는 HOI4 위키에서 더 자세히 볼 수 있습니다!"
 HINT_DIVISION_DESIGNER: "힌트: 여단 설계기"
 HINT_DIVISION_DESIGNER_NOXP_TEXT: "여기는 §Y여단 설계기§!이며, 새 §Y여단 편제§!를 만들거나 수정하는 곳입니다. 여단 편제를 수정하거나 새로 만들려면 £army_experience  §Y육군 경험치§!가 듭니다. 육군 경험치는 부대가 전투를 치르거나 육군 훈련 중일 때 얻습니다. 경험 레벨 1인 §Y신병§! 부대는 £army_experience  육군 경험치를 생산하지 않습니다.\n\n여단 편제를 만들거나 수정하려면 £army_experience 육군 경험치가 더 필요합니다."
 HINT_DIVISION_DESIGNER_XP_TEXT: "여기는 §Y여단 설계기§!이며, 새 §Y여단 편제§!를 만들거나 수정하는 곳입니다. 여단 편제를 수정하거나 새로 만들려면 £army_experience  §Y육군 경험치§!가 듭니다. 육군 경험치는 부대가 전투를 치르거나 육군 훈련 중일 때 얻습니다. 경험 레벨 1인 §Y신병§! 부대는 £army_experience  육군 경험치를 생산하지 않습니다.\n\n첫 편제 수정으로는 지원 열의 빈 칸을 클릭해 여단에 £unit_artillery_icon_small §Y지원 포병§!을 추가하기를 권합니다. 추가했다면 §Y저장§!을 클릭하십시오. 이 편제를 쓰는 여단은 이제 포병 §Y장비§!를 요청하기 시작합니다."
 HINT_EDIT_TEMPLATE_TEXT: "§Y여단 편제§!에서 쓰지 않는 장비를 생산하고 있습니다. 하지만 £army_experience §Y육군 경험치§!가 있으니 이 문제를 해결할 수 있습니다.\n\n§Y디비지오네 디 판테리아§! 또는 원하는 다른 여단 옆의 §Y수정§!을 클릭하십시오."
 HINT_LOGISTICS_TEXT: "여기는 §Y병참§! 화면이며, 장비를 소모하는 속도보다 생산하는 속도가 빠른지 느린지 파악하는 데 쓰입니다.\n\n필요하다고 생각한 양보다 특정 §Y장비§!를 더 많이 생산하고 있다면, 그 장비를 생산하는 §Y생산 라인§!에 투입한 공장 수를 줄이는 것이 좋을 수 있습니다.\n\n여단의 §Y보급§! 상태가 좋은지 여부는 전장에서 성공을 거두는 데 중요한 요소입니다. §Y보급 지도 모드§! £GFX_F4  로 바꾸면 보급 상태를 확인할 수 있습니다."
 HINT_LOGISTICS_TEXT_2: "보급은 £GFX_capital_hub_texticon §Y수도 보급 거점§!에서 분배되어 £GFX_train_texticon §Y열차§!나 £GFX_convoy_texticon §Y수송선단§!을 타고 각 지방의 £GFX_supply_hub_texticon §Y보급 거점§!이나 £GFX_naval_supply_hub_texticon §Y해군 기지§!로 흘러갑니다. \n\n이후 보급은 거점의 범위 안에 있는 야전 여단에 분배됩니다. £GFX_supply_hub_texticon §Y보급 거점§!을 선택하고 £GFX_shift 를 누르고 있으면 범위를 볼 수 있습니다. 범위는 £GFX_unit_motorized_icon_small §Y트럭§!을 사용하는 차량화의 영향을 받습니다.\n\n효율은 £GFX_railways_texticon §Y철도§!와 £GFX_naval_supply_hub_texticon §Y해군 기지§!의 수준, £GFX_train_texticon §Y열차§! 부족, 적의 공습으로도 영향을 받습니다. 이 때문에 §R병목§!이 생깁니다. 수도 보급 거점까지의 철도를 업그레이드하고, 전투기로 방공을 제공하고, 열차를 충분히 확보하면 완화할 수 있습니다. 보급 가용량은 §Y보급 지도 모드§!  £GFX_F4  에서 확인할 수 있습니다."
 HINT_NO_TEMPLATE_NO_XP_TEXT: "§Y편제 없음 경보§!를 클릭하셨군요. 걱정하지 마십시오! 경보에서 답을 찾아보는 것은 아주 좋은 습관이며, 경보는 그러라고 있는 것입니다.\n\n아마 포병 장비를 생산하는 생산 라인을 만드셨을 것입니다. 지금은 어떤 §Y여단§!도 자신의 §Y여단 편제§!에서 그 장비를 쓰고 있지 않습니다.\n\n£army_experience  §Y육군 경험치§!를 더 얻으면 여단 편제를 수정해 포병을 포함시킬 수 있습니다. £army_experience  육군 경험치는 여단이 전투를 치르거나 육군 훈련 중일 때 얻습니다.\n\n£army_experience  육군 경험치를 더 얻으면 이 튜토리얼이 안내해 드릴 것이므로, 지금은 이 경보를 무시해도 됩니다."
 HINT_NO_TEMPLATE_HAVE_XP_TEXT: "§Y편제 없음 경보§!를 클릭하셨습니다. 이 경보는 현재 쓰지 않는 장비를 생산하고 있다는 뜻입니다.\n\n여단이 새로운 종류의 장비를 쓰게 하려면 §Y여단 편제§!를 수정해야 합니다. 여단 편제를 수정하려면 £army_experience  §Y육군 경험치§!가 듭니다.\n\n§Y징집 및 배치§! 화면으로 가서 §Y수정§!할 여단 편제를 고르십시오.\n\n이 경보에 마우스를 올리면 어떤 종류의 장비를 생산하면서 쓰지 않고 있는지 확인할 수 있습니다."
 HINT_OFFICER_CORPS_SCREEN_TEXT_2: "이론가는 전반적인 전략을 다루는 육군·해군·공군 §Y교리§!의 비용을 줄여 줍니다. 교리는 군 병과별로 정해지며, 야전 여단과 함대, 항공 연대에 보너스를 줍니다."
 HINT_OCCUPIED_TERRITORIES_SCREEN: "힌트: 점령지"
 HINT_OCCUPIED_TERRITORIES_SCREEN_TEXT: "저항에 대처하고 주민을 통제하려면 점령한 주에 치안 임무를 수행할 군 병력을 수비대로 주둔시켜야 합니다. 게임 속 수비대가 이를 나타내며, 왼쪽 위 국기를 클릭해 여는 §Y정치 화면§!의 §Y점령지§! 탭에서 배정할 수 있습니다.\n\n수비대를 구성하는 여단은 지도에 보이지 않으며, 자동으로 편성되고 장비도 자동으로 받습니다. 장비 배분은 §Y징집 및 배치§! 탭에서 설정할 수 있습니다."
 HINT_SELECT_UNIT_TEXT: "이제 §Y에티오피아§!와 전쟁을 벌일 때입니다. 먼저 공세 명령이 담긴 전투 계획을 만들어 부대에 명령을 내리십시오.\n\n§Y에리트레아§! 주에서 §Y강조 표시된 여단을 선택하십시오§!."
 HINT_LOW_SUPPLY_TEXT_1: "여단이 전투 능력을 유지하려면 보급이 필요합니다. 보급은 £GFX_capital_hub_texticon §Y수도 보급 거점§!에서 분배되어 £GFX_train_texticon §Y열차§!나 £GFX_convoy_texticon §Y수송선단§!을 타고 각 지방의 £GFX_supply_hub_texticon §Y보급 거점§!이나 £GFX_naval_supply_hub_texticon §Y해군 기지§!로 흘러갑니다. \n\n이후 보급은 거점의 범위 안에 있는 야전 여단에 분배됩니다. £GFX_supply_hub_texticon §Y보급 거점§!을 선택하고 £GFX_shift. 를 누르고 있으면 범위를 볼 수 있습니다. §Y차량화 우선순위§!는 거점의 범위를 넓혀 여단이 보급을 받는 거리를 늘려 줍니다. 이때 £GFX_unit_motorized_icon_small §Y트럭§!이 사용됩니다."