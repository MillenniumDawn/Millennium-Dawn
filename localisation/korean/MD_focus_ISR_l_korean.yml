 wesill_be_creful_tt: "우리 §4모사드§! 요원들이 §Y남코카서스§!를 통해 [PER.GetNameWithFlag]에 침투하여 §G핵 기록 보관소를 탈취§!하려 시도할 것입니다. 명령을 내릴 때 무엇을 선택할지 §Y신중§!해야 합니다."
 israel_economy.213.t: "이스라엘-튀르키예 가스 송유관!"
 israel_economy.213.d: "이스라엘-튀르키예 가스 송유관이 마무리되어 마침내 건설됩니다. 양국 모두 크게 이익을 얻게 될 것입니다! 모든 비용은 이스라엘이 부담합니다."
 israel_economy.213.a: "훌륭합니다!"
 israel_economy.214.t: "이스라엘-그리스 가스 송유관!"
 israel_economy.214.d: "이스라엘-그리스 가스 송유관이 마무리되어 마침내 건설됩니다. 양국 모두 크게 이익을 얻게 될 것입니다! 모든 비용은 이스라엘이 부담합니다."
 israel_economy.214.a: "훌륭합니다!"
 israel_economy.215.t: "가스 파이프라인 프로젝트를 제안하는 이스라엘!"
 israel_economy.215.d: "이스라엘이 우리와 이스라엘을 잇는 새로운 가스 송유관 프로젝트를 제안합니다. 동의하시겠습니까?"
 israel_economy.215.a: "어디에 서명합니까?"
 israel_economy.215.b: "아니."
 israel_economy.216.t: "이집트의 동의!"
 israel_economy.216.d: "이집트가 우리의 제안에 동의했습니다."
 israel_economy.216.a: "훌륭해!"
 israel_economy.217.t: "이집트의 거절!"
 israel_economy.217.d: "이집트가 우리의 제안을 거절했습니다."
 israel_economy.217.a: "매우 유감이다."
 israel_economy.218.t: "올림픽 게임 작전을 제안하는 이스라엘!"
 israel_economy.218.d: "최근 이스라엘 정부가 비밀 소통 채널을 통해 접근하여, 이란 핵 시설을 겨냥한 사이버 교란을 통한 비밀 파괴 공작을 제안했습니다. 이 작전을 지원하시겠습니까?"
 israel_economy.218.a: "사이버 전문가를 파견하겠다."
 israel_economy.218.b: "우리는 여기에 참여하지 않겠다."
 israel_economy.219.t: "참여하려는 미국!"
 israel_economy.219.d: "미국이 올림픽 게임 작전에 참여할 것입니다."
 israel_economy.219.a: "훌륭해!"
 israel_economy.220.t: "참여하지 않을 미국"
 israel_economy.220.d: "그들은 이 작전이 긴장을 크게 고조시킬 것이며 자신들은 이에 관여하고 싶지 않다고 말합니다."
 israel_economy.220.a: "알겠다..."
 ISR_olympic_games: "올림픽 게임 작전"
 ISR_olympic_games_op: "올림픽 게임 작전"
 olymp_games_thr: "올림픽 게임 작전"
 israel_mechanic.15.t: "이란 핵 시설에 대한 사이버 공격!"
 israel_mechanic.15.d: "최근 이란 핵 시설을 겨냥한 사이버 교란을 통한 파괴 공작이 있었던 것으로 보이나 아직 인정되지는 않았다. 이란은 이스라엘과 미국이 책임이 있다고 주장하고 있다. 그러나 이들 국가는 이러한 주장을 확인하지 않았다."
 israel_mechanic.15.a: "흥미롭군."
 israel_mechanic.16.t: "이란 핵 시설에 대한 사이버 공격 실패!"
 israel_mechanic.16.d: "최근 이란의 방화벽이 이란의 핵 개발을 교란하기 위해 이란 핵 시설 시스템에 투입된 새로운 사이버 웜을 탐지했습니다."
 israel_mechanic.17.t: "테헤란의 우리 요원들!"
 israel_mechanic.17.d: "우리 요원들은 이란의 핵 기록 보관소가 있다고 알려진 창고 근처에 있습니다. 1년간의 창고 감시 결과 이란 경비병의 아침 교대조는 오전 7시경 도착하며, 요원들은 오전 5시 이전에 철수하라는 명령을 받았습니다. 신속히 행동하여 어떻게 할지 빨리 결정해야 합니다."
 israel_mechanic.17.a: "토치를 가지고 금고를 절단하라."
 israel_mechanic.17.b: "C4를 가지고 입구를 신속히 폭파하라."
 israel_mechanic.1711.t: "테헤란 외곽에서 폭발"
 israel_mechanic.1711.d: "우리의 내부 정보원이 우리 핵 기록 보관소가 있는 창고 인근에서 폭발이 있었다는 소식을 전해 왔습니다."
 israel_mechanic.1711.a: "경비대를 보내라!"
 israel_mechanic.18.t: "작전 성공!"
 israel_mechanic.18.d: "우리 요원들이 이란의 핵 기록 보관소를 성공적으로 빼냈습니다. 이란 관리인들이 도착하자, 핵무기, 탄두 설계, 생산 계획에 관한 수년간의 작업을 기록한 이란의 비밀 핵 기록 상당수를 누군가 훔쳐갔음이 즉시 분명해졌습니다."
 israel_mechanic.18.a: "훌륭합니다!"
 israel_mechanic.1811.t: "도난당한 우리의 핵 기록 보관소!"
 israel_mechanic.1811.d: "모사드 요원들이 우리의 핵 기록 보관소를 훔치는 데 성공했으며, 이제 이스라엘은 우리 핵 프로젝트에 관한 모든 계획과 연구 문서를 갖게 되었습니다."
 israel_mechanic.1811.a: "젠장!"
 israel_mechanic.19.t: "작전 실패!"
 israel_mechanic.19.d: "우리 요원들이 붙잡혔으며 이란 내무부의 심문을 받게 될 것입니다. 그들은 붙잡히기 전에 문서를 전달하지 못했습니다."
 israel_mechanic.19.a: "아, 젠장..."
 israel_mechanic.1911.t: "붙잡힌 이스라엘 요원들!"
 israel_mechanic.1911.d: "최근 이스라엘 요원들이 우리의 핵 기록 보관소를 훔치려다 테헤란 외곽에서 붙잡혔습니다. 이 요원들은 억류되어 심문받게 될 것입니다."
 israel_mechanic.1911.a: "경비대에 포상하라!"
 israel_mechanic.20.t: "작전 결과 불분명!"
 israel_mechanic.20.d: "우리 요원들은 탈출하는 데 성공했으나, 건물이 파괴되어 우리가 얻을 수 있었던 모든 정보도 함께 파괴되었습니다."
 israel_mechanic.20.a: "글쎄.."
 ISR_archive_stolen: "우리의 핵 기록 보관소 도난"
 ISR_archive_destroyed: "파괴된 핵 기록 보관소"
 israel_mechanic.2011.t: "파괴된 우리의 핵 기록 보관소!"
 israel_mechanic.2011.d: "모사드 요원들이 테헤란 외곽에 있는 우리의 비밀 창고에서 문서를 훔치려 했던 것으로 보이나, 무능함 때문에 단순히 건물을 파괴하고 말았습니다. 그들은 이미 출국했을 가능성이 높지만, 이 결과가 가능한 모든 결과 중 최악은 아닐지도 모릅니다."
 israel_mechanic.2011.a: "글쎄.."
 full_blockades_isr: "이스라엘 보이콧"
