 JAP_choice: "Reinício Político"
 JAP_choice_desc: "Em meio à estagnação prolongada e ao cansaço institucional, a confiança na política vacilou, enquanto apenas a necessidade de reformas continuou a se acumular. Para que este país avance, ele precisa primeiro definir um rumo claro de governança e estabelecer um arcabouço para a tomada de decisões."
 JAP_left: "Esquerda do Japão"
 JAP_left_desc: "O objetivo da política não é apenas o crescimento econômico, mas também proteger o sustento e a dignidade das pessoas. Garantiremos transparência e fiscalizaremos rigorosamente os que estão no poder, fortaleceremos o poder de barganha dos trabalhadores e a rede de proteção social e reduziremos a desigualdade e a insegurança. Ao buscar uma governança que não desconsidere os direitos humanos e ao avançar na transição para energia sustentável, pretendemos reconstruir a sociedade japonesa."
 JAP_left_TT: "§YVocê pode aumentar muito a aprovação de um dos partidos de esquerda!\nNo entanto, se for o partido governante, o aumento será pequeno.§!"
 JAP_information_disclosure: "Fortalecer a Divulgação de Informações"
 JAP_information_disclosure_desc: "Para restaurar a confiança na política e na administração pública, imporemos a divulgação rigorosa de informações e fortaleceremos a criação, a preservação e a divulgação de documentos oficiais. Isso eliminará os terrenos férteis para a corrupção e o conluio, tornará as decisões políticas mais transparentes e facilitará o avanço das reformas."
 JAP_left_party_TT: "Uma das seguintes condições deve ser verdadeira:\n§Y$JAP.liberalism$§! está no poder.\n§Y$JAP.liberalism_alt$§! está no poder.\n§Y$JAP.neutral_Social$§! está no poder.\n§Y$JAP.Neutral_Communism$§! está no poder.\n§Y$JAP.anarchist_communism$§! está no poder.\n"
 JAP_management_documents: "Gestão Rigorosa de Documentos Oficiais"
 JAP_management_documents_desc: "Organizaremos e preservaremos os registros das decisões de formulação de políticas, do histórico de procedimentos administrativos e dos documentos mantidos por instituições públicas sob um padrão unificado, ao mesmo tempo que fortaleceremos o sistema de gestão. Ao evitar a dispersão de registros e o manuseio indevido, e ao melhorar a verificabilidade e a continuidade administrativa, buscamos aumentar a confiabilidade e a eficiência prática das operações do governo."
 JAP_digital_archiving: "Arquivamento Digital de Documentos Oficiais"
 JAP_digital_archiving_desc: "Digitalizaremos os registros oficiais e os administraremos de forma centralizada para agilizar os procedimentos de busca, compartilhamento e preservação. Ao abandonar as práticas centradas no papel, reduziremos os encargos administrativos e os custos de gestão e conteremos os gastos do governo."
 JAP_independent_audits: "Auditoria Independente Completa"
 JAP_independent_audits_desc: "Garantiremos a independência total dos órgãos de auditoria e estabeleceremos um sistema de fiscalização livre de interferência de políticos ou da burocracia. Ao facilitar a detecção precoce de conluio e má conduta, avançaremos no combate à corrupção e, ao restaurar a confiança na política, fortaleceremos também a força motriz por trás da implementação de políticas."
 JAP_eliminating_amakudari: "Erradicar o Amakudari"
 JAP_eliminating_amakudari_desc: "Acabaremos com a prática do amakudari, que facilmente fomenta o conluio entre burocratas e empresas, e passaremos o bisturi nos interesses arraigados. Ao melhorar a transparência nas nomeações e fortalecer a concorrência, conteremos a corrupção, reduzindo a ineficiência e elevando a produtividade."
 JAP_disclosure_of_political_funding: "Divulgação Total do Financiamento Político"
 JAP_disclosure_of_political_funding_desc: "Divulgaremos integralmente o fluxo de recursos políticos e tornaremos doadores e gastos claramente visíveis. Isso reduzirá o espaço para dinheiro opaco entrar na política e avançará no combate à corrupção, além de fortalecer a resiliência contra operações de influência de atores estrangeiros."
 JAP_protecting_human_rights: "Proteger os Direitos Humanos"
 JAP_protecting_human_rights_desc: "Colocaremos a proteção da dignidade e dos direitos de cada pessoa no centro da governança. Ao corrigir a discriminação e o tratamento injusto e construir uma sociedade onde as pessoas possam viver com tranquilidade, fortaleceremos a coesão e a estabilidade internas."
 JAP_same_sex_partnerships: "Legalizar as Uniões entre Pessoas do Mesmo Sexo"
 JAP_same_sex_partnerships_desc: "Reconheceremos legalmente os parceiros do mesmo sexo e implantaremos um sistema que reduza as desvantagens cotidianas em áreas como consentimento médico, moradia e herança. Ao respeitar formas diversas de família e atenuar as divisões sociais, fortaleceremos a estabilidade interna."
 JAP_employment_disabilities: "Ampliar o Emprego de Pessoas com Deficiência"
 JAP_employment_disabilities_desc: "Criaremos um ambiente em que as pessoas possam trabalhar independentemente de deficiência e ampliaremos o apoio ao emprego e as adaptações razoáveis no local de trabalho. Ao ampliar as oportunidades de emprego, fortaleceremos a força de trabalho e, ao promover a participação social, contribuiremos também para a estabilidade interna."
 JAP_prevent_domestic_violence: "Esforços de Prevenção à Violência Doméstica"
 JAP_prevent_domestic_violence_desc: "Fortaleceremos a prevenção e a detecção precoce da violência doméstica e ampliaremos os serviços de aconselhamento e o apoio protetivo. Ao romper o ciclo de abuso e reduzir a insegurança e a violência dentro de casa, aumentaremos a estabilidade social."
 JAP_protecting_labor_union: "Proteger os Direitos Sindicais"
 JAP_protecting_labor_union_desc: "Garantiremos claramente os direitos dos sindicatos e criaremos um ambiente em que a negociação coletiva e as consultas entre trabalhadores e empregadores possam ser conduzidas adequadamente. Ao refletir a voz dos locais de trabalho nas instituições e na gestão das empresas, promoveremos a estabilidade do emprego e das condições de trabalho."
 JAP_subcontracto: "Conter o Assédio a Subcontratados"
 JAP_subcontracto_desc: "Reprimiremos as exigências injustas de redução de preços, os atrasos de pagamento e as alterações unilaterais das condições contratuais impostas aos subcontratados, e construiremos um ambiente de comércio justo. Ao proteger a base de renda das pequenas e médias empresas, fortaleceremos a saúde de toda a cadeia de suprimentos e contribuiremos para a estabilidade social."
 JAP_pressure_wage_increases: "Pressão por Aumentos Salariais"
 JAP_pressure_wage_increases_desc: "Incentivaremos as empresas a elevar os salários e aumentar a renda das famílias. Ao apoiar o consumo e atenuar a insegurança no dia a dia, fortaleceremos a estabilidade social e buscaremos um círculo virtuoso na economia."
 JAP_regulation_temporary_agency_work: "Endurecer as Regras do Trabalho Temporário"
 JAP_regulation_temporary_agency_work_desc: "Conteremos o abuso da mão de obra temporária terceirizada e promoveremos a estabilidade no emprego e melhores condições de trabalho. Priorizando um ambiente de trabalho seguro e de longo prazo em vez da eficiência de curto prazo, fortaleceremos a estabilidade social."
 JAP_ban_non_regular_employment: "Proibir o Emprego Não Regular"
 JAP_ban_non_regular_employment_desc: "Reformaremos as práticas de emprego que dependem do trabalho não regular e faremos a transição para um sistema em que todos possam obter emprego estável e tratamento justo. Ao reduzir a insegurança no cotidiano e conter a divisão social, fortaleceremos a estabilidade nacional."
 JAP_redistribution: "Priorizar a Redistribuição"
 JAP_redistribution_desc: "Passaremos a uma política que prioriza a correção da desigualdade de renda e da insegurança econômica, destinando recursos de forma mais generosa a quem precisa de apoio. Por meio da redistribuição, conteremos a divisão social, aumentaremos a sensação de segurança das pessoas e buscaremos uma governança estável."
 JAP_reducing_medical_costs: "Reduzir os Custos Médicos Diretos"
 JAP_reducing_medical_costs_desc: "Reduziremos as despesas médicas pagas do próprio bolso e construiremos um sistema em que as pessoas possam receber o tratamento necessário sem hesitar. Ao aliviar a ansiedade financeira das famílias e conter o aumento das disparidades de saúde, fortaleceremos a estabilidade social."
 JAP_care_workers: "Melhorar Salários e Condições dos Cuidadores"
 JAP_care_workers_desc: "Melhoraremos os salários e as condições de trabalho dos cuidadores e promoveremos o recrutamento e a retenção da força de trabalho. Ao fortalecer a continuidade do cuidado, aliviar o fardo das famílias e apoiar a participação na força de trabalho, contribuiremos para a estabilidade social."
 JAP_housing_support: "Ampliar o Apoio à Moradia"
 JAP_housing_support_desc: "Ampliaremos o apoio à moradia para reduzir o peso dos aluguéis e ajudar as pessoas a garantir uma habitação estável. Ao aliviar a insegurança habitacional e apoiar a estabilidade no dia a dia, conteremos a divisão social e fortaleceremos a estabilidade interna."
 JAP_student_loans: "Reduzir o Fardo dos Empréstimos Estudantis"
 JAP_student_loans_desc: "Reduziremos o ônus do pagamento dos empréstimos estudantis e diminuiremos as barreiras ao ensino superior e à requalificação. Ao avançar no desenvolvimento do capital humano como investimento no futuro, apoiaremos o progresso da pesquisa e da tecnologia."
 JAP_nuclear_phaseout: "Adeus ao Átomo"
 JAP_nuclear_phaseout_desc: "Em vez de apostar no próximo terremoto, a nação deixa os reatores fecharem à medida que suas licenças expiram e investe o dinheiro em eficiência e renováveis. O caminho é mais caro no curto prazo e mais seguro no longo. Nenhuma onda na costa ameaçará um segundo Fukushima.\n-------------\nParalisa toda a frota nuclear e abre o §YPrograma de Transformação Verde§!, que substitui a produção perdida por geração que o Japão não precisa importar e por uma demanda que não precisa mais atender. Cada projeto também desmantela definitivamente os reatores de sua região."
 JAP_leading_disarmament: "Liderar a Diplomacia do Desarmamento"
 JAP_leading_disarmament_desc: "Faremos do desarmamento e da desescalada pilares de nossa política externa e buscaremos a estabilidade regional por meio do diálogo e da construção de confiança. Priorizaremos soluções que não dependam da força e trabalharemos para melhorar as relações com outros países."
 JAP_restricting_arms_exports: "Restringir as Exportações de Armas"
 JAP_restricting_arms_exports_desc: "Restringiremos as exportações de armas e sinalizaremos claramente uma postura diplomática com menor probabilidade de alimentar tensões militares. Ao priorizar o desarmamento e a construção de confiança, faremos avançar o diálogo rumo à estabilidade regional."
 JAP_principle_of_no_armed_forces: "Reafirmar o Princípio de Não Possuir Forças Militares"
 JAP_principle_of_no_armed_forces_desc: "Reafirmaremos o princípio de não manter forças militares e declararemos claramente uma postura de governança que não dependa do poder militar. Colocaremos o pacifismo no centro de nossa política e enfatizaremos a segurança por meio da diplomacia e da cooperação internacional."
 JAP_abrogating_us_japan_security_treaty: "Abolir o Tratado de Segurança Japão-EUA"
 JAP_abrogating_us_japan_security_treaty_desc: "Nos retiraremos do arcabouço de segurança Japão-EUA e passaremos a uma política de segurança independente, que não dependa dos Estados Unidos. Isso ampliará a liberdade de nossa política externa e afirmará com mais clareza nossa soberania e independência."
 JAP_dissolving_sdf: "Dissolver as Forças de Autodefesa"
 JAP_dissolving_sdf_desc: "Dissolveremos as Forças de Autodefesa e passaremos a uma governança que não dependa do poder militar. Ao redirecionar para o setor civil os recursos e esforços antes dedicados à defesa, priorizaremos o fortalecimento da indústria e das bases da vida cotidiana e aceleraremos o desenvolvimento interno."
 JAP_army_delete_TT: "§RTodas as forças terrestres serão removidas!§!"
 JAP_right: "Direita do Japão"
 JAP_right_desc: "Enfatizamos a capacidade do Estado e a ordem social, promovendo uma segurança pública mais forte, a resposta a crises e uma política externa e de segurança que coloque os interesses nacionais em primeiro plano. Buscamos o crescimento por meio da reforma regulatória e da revitalização da atividade empresarial, e procuramos reconstruir o país sobre uma base de tradição e valores comunitários."
 JAP_right_TT: "§YVocê pode aumentar muito a aprovação de um dos partidos de direita!\nNo entanto, se for o partido governante, o aumento será pequeno.§!"
 JAP_strengthen_military_power: "Política de Fortalecimento do Poder Militar"
 JAP_strengthen_military_power_desc: "Diante das mudanças no ambiente de segurança, estabeleceremos claramente o fortalecimento de nossa postura de defesa como política nacional. Ao reforçar a dissuasão, preveniremos ameaças antes que se concretizem e demonstraremos nosso compromisso de proteger a segurança pública e a soberania nacional."
 JAP_right_party_TT: "Uma das seguintes condições deve ser verdadeira:\n§Y$JAP.conservatism$§! está no poder.\n§Y$JAP.socialism$§! está no poder.\n§Y$JAP.Neutral_conservatism$§! está no poder.\n§Y$JAP.Neutral_conservatism2$§! está no poder.\n§Y$JAP.Neutral_conservatism3$§! está no poder.\n§Y$JAP.Neutral_conservatism4$§! está no poder.\n§Y$JAP.Neutral_Libertarian$§! está no poder.\n§Y$JAP.Nat_Populism$§! está no poder.\n"
 JAP_allow_overseas_deployment: "Permitir o Envio das FAD ao Exterior"
 JAP_allow_overseas_deployment_desc: "Levando em conta a situação internacional e a cooperação com aliados, declararemos claramente uma política que permite o envio das Forças de Autodefesa ao exterior. Ao participar de missões internacionais, fortaleceremos a dissuasão e a influência e protegeremos os interesses e a segurança nacionais de forma mais proativa."
 JAP_international_missions: "Arcabouço Legal para Missões Internacionais"
 JAP_international_missions_desc: "Estabeleceremos a base legal e os procedimentos para a participação em missões internacionais, criando um sistema em que as Forças de Autodefesa possam atuar sob regras consistentes. Isso reduzirá a incerteza no terreno e permitirá uma execução mais confiável da cooperação internacional."
 JAP_revising_use_weapons: "Revisar as Regras de Uso de Armas"
 JAP_revising_use_weapons_desc: "Revisaremos os padrões e procedimentos para o uso de armas de modo a corresponder à realidade das missões internacionais e da resposta a crises. Ao esclarecer o âmbito de autoridade e responsabilidade necessário para cumprir as missões, estabeleceremos um sistema em que as Forças de Autodefesa possam proteger adequadamente a si mesmas e aos outros."
 JAP_exclusive_defense: "Manter uma Postura Exclusivamente Defensiva"
 JAP_exclusive_defense_desc: "Defenderemos rigorosamente uma postura exclusivamente defensiva como princípio orientador de nossa política de segurança, limitando claramente o uso das capacidades de defesa ao escopo de impedir ataques ao nosso país. Mantendo a dissuasão, evitaremos a expansão militar excessiva e demonstraremos uma postura com menor probabilidade de aumentar as tensões com países vizinhos."
 JAP_exclusive_defense_TT: "§YEste foco nacional aproxima o Equilíbrio de Poder do Nível 2!§!"
 JAP_collective_self_defense: "Política de Permissão da Autodefesa Coletiva"
 JAP_collective_self_defense_desc: "Com a visão de que ataques a aliados também podem afetar diretamente nossa própria segurança, declararemos claramente uma política que permite o exercício da autodefesa coletiva. Isso fortalecerá a dissuasão e a eficácia das alianças e construirá um arcabouço de segurança mais proativo."
 JAP_prioritizing_order: "Priorizar a Ordem"
 JAP_prioritizing_order_desc: "Colocaremos a ordem social e a segurança pública como principais prioridades da governança. Valorizando as regras e a responsabilidade, e mantendo a segurança pública e uma administração estável, reconstruiremos as bases da nação."
 JAP_strengthen_public_security: "Plano Abrangente de Segurança Pública"
 JAP_strengthen_public_security_desc: "Faremos uma revisão completa do sistema de segurança pública e formularemos um plano abrangente que cubra equipamentos, pessoal e coordenação de informações. Ao agilizar as operações no terreno e fortalecer as capacidades policiais, reforçaremos a dissuasão do crime e garantiremos a estabilidade social."
 JAP_against_organized_crime: "Reforçar as Medidas contra o Crime Organizado"
 JAP_against_organized_crime_desc: "Intensificaremos a repressão ao crime organizado e avançaremos em esforços para cortar fontes de financiamento e ampliar a capacidade investigativa. Ao restaurar a segurança pública interna, fortaleceremos a estabilidade social e construiremos também um sistema nacional menos vulnerável à infiltração e às operações de influência de atores externos."
 JAP_against_terrorist_financing: "Medidas contra o Financiamento do Terrorismo"
 JAP_against_terrorist_financing_desc: "Monitoraremos rigorosamente os fluxos financeiros e aplicaremos integralmente os sistemas para cortar o financiamento de organizações terroristas e grupos extremistas. Ao fortalecer a coordenação entre as autoridades financeiras e os órgãos de investigação, protegeremos a segurança interna e aumentaremos a resiliência contra operações de influência externa, ao mesmo tempo que melhoraremos a estabilidade social."
 JAP_counter_espionage: "Construir um Arcabouço Antiespionagem"
 JAP_counter_espionage_desc: "Fortaleceremos as contramedidas contra atividades de inteligência e implantaremos sistemas para proteger informações sigilosas e aprimorar o monitoramento. Ao impedir a infiltração e as operações encobertas de atores externos e proteger a tomada de decisões nacionais, garantiremos a estabilidade interna."
 JAP_strengthening_cabinet: "Fortalecer a Autoridade do Gabinete"
 JAP_strengthening_cabinet_desc: "Fortaleceremos a cadeia de comando e as funções de coordenação do Gabinete para melhorar a rapidez e a consistência da tomada de decisões. Ao construir um sistema capaz de agir com rapidez na resposta a crises e nas políticas-chave, reforçaremos a liderança decisiva na governança nacional."
 JAP_cabinet_personnel_bureau: "Secretaria de Pessoal do Gabinete"
 JAP_cabinet_personnel_bureau_desc: "Estabeleceremos um sistema que permite ao Gabinete supervisionar centralmente as questões de pessoal, fortalecendo a transparência e o controle sobre as nomeações de alto escalão. Ao promover as pessoas certas nas posições certas, agilizaremos o funcionamento da burocracia e aumentaremos a capacidade do governo de implementar políticas."
 JAP_breaking_down_bureaucratic_siloing: "Derrubar os Silos Burocráticos"
 JAP_breaking_down_bureaucratic_siloing_desc: "Reformaremos a administração fragmentada entre os ministérios e fortaleceremos o compartilhamento de informações e a coordenação entre ministérios. Ao reduzir procedimentos duplicados e gargalos, agilizaremos a administração pública e aceleraremos a execução de investimentos e projetos públicos."
 JAP_policy_evaluation_and_kpis: "Introduzir Avaliação de Políticas e KPIs"
 JAP_policy_evaluation_and_kpis_desc: "Introduziremos um sistema de avaliação e KPIs para que os resultados das políticas possam ser verificados com dados mensuráveis. Ao revisar medidas de baixo impacto e concentrar os recursos limitados em áreas de alto efeito, melhoraremos a eficiência administrativa e elevaremos a produtividade econômica."
 JAP_national_security_council: "Criar um Conselho de Segurança Nacional"
 JAP_national_security_council_desc: "Centralizaremos no Gabinete as informações e a tomada de decisões relacionadas à segurança e construiremos um sistema que permita decisões rápidas e consistentes. Ao fortalecer as capacidades de resposta a crises e aprimorar a coordenação com aliados e órgãos relevantes, reforçaremos a dissuasão."
 JAP_emergency_powers: "Cláusula de Poderes de Emergência"
 JAP_emergency_powers_desc: "Em preparação para situações extraordinárias, como grandes desastres ou ataques armados, esclareceremos as autoridades e os procedimentos necessários em emergências. Mantendo a fiscalização em tempos de paz, aceleraremos a resposta a crises e fortaleceremos a cadeia de comando, garantindo a estabilidade nacional e a postura de defesa."
 JAP_regulatory_reform: "Crescimento por Meio da Reforma Regulatória"
 JAP_regulatory_reform_desc: "Revisaremos regulamentos e procedimentos, reduziremos os encargos administrativos e promoveremos a atividade empresarial e o investimento. Ao facilitar o lançamento de novos empreendimentos e o desenvolvimento de instalações, aumentaremos o ritmo do crescimento econômico."
 JAP_postal_privatization: "Privatização dos Correios"
 JAP_postal_privatization_desc: "Avançaremos na privatização dos serviços postais, revisando um sistema conduzido pelo governo para melhorar a eficiência da administração pública. Embora a incorporação de princípios de mercado tenha como objetivo fortalecer a atividade empresarial e a base tributária, a reforma também pode provocar forte oposição quanto ao seu mérito e intensificar o conflito político."
 JAP_postal_privatization_TT: "§YUm evento será disparado no qual você escolherá se realiza ou não uma eleição geral de dissolução!§!"
 JAP_second_wave_privatization: "Segunda Etapa da Privatização"
 JAP_second_wave_privatization_desc: "Levaremos as reformas de privatização mais adiante e reveremos o papel do setor público e a forma de operação dos serviços públicos. Ao reduzir a ineficiência administrativa e incentivar o investimento e a atividade empresarial, impulsionaremos o dinamismo econômico."
 JAP_special_zones: "Zonas Especiais Estratégicas Nacionais"
 JAP_special_zones_desc: "Criaremos exceções regulatórias em áreas designadas e promoveremos intensivamente a entrada de empresas e novos investimentos. Ao avançar projetos de demonstração e a comercialização além das barreiras institucionais existentes, aceleraremos o crescimento impulsionado pelo dinamismo do setor privado e revitalizaremos as economias locais."
 JAP_expansion_regulatory_reform_zones: "Zonas de Reforma em Todo o País"
 JAP_expansion_regulatory_reform_zones_desc: "Ampliaremos para todo o país os resultados alcançados nas zonas especiais, transformando a reforma regulatória de uma exceção regional em um padrão nacional. Ao reduzir as barreiras de entrada e de investimento, incentivaremos novos empreendimentos e promoveremos a revitalização econômica em todo o país."
 JAP_new_market_entry: "Promover a Entrada em Novos Mercados"
 JAP_new_market_entry_desc: "Reduziremos as barreiras de entrada e apoiaremos o empreendedorismo e a abertura de novos negócios. Ao fomentar a concorrência e a inovação, elevaremos a produtividade e fortaleceremos a base tributária."
 JAP_new_technologies: "Acolher Novas Tecnologias"
 JAP_new_technologies_desc: "Apoiaremos ativamente a adoção e a comercialização de novas tecnologias, acelerando a pesquisa e o desenvolvimento e a inovação industrial. Ao fomentar novos setores de crescimento, fortaleceremos a competitividade nacional."
 JAP_key_industries_back_home: "Relocalizar as Indústrias Críticas"
 JAP_key_industries_back_home_desc: "Construiremos um sistema que permita a produção doméstica estável de indústrias críticas, fortalecendo as cadeias de suprimentos e aumentando a autossuficiência em setores-chave. Ao incentivar o investimento interno, reforçaremos a base industrial e criaremos uma estrutura menos vulnerável a mudanças no ambiente internacional."
 JAP_economic_security: "Estabelecer a Segurança Econômica"
 JAP_economic_security_desc: "Revisaremos os arranjos de fornecimento de materiais críticos e indústrias-chave e gerenciaremos os riscos em tecnologia, capital e informação para estabelecer a segurança econômica. Isso fortalecerá a autossuficiência nacional e a competitividade sustentável das empresas, apoiando um crescimento estável."
 JAP_patriotic_education: "Educação Patriótica"
 JAP_patriotic_education_desc: "Promoveremos uma educação que enfatize a história, a cultura e a responsabilidade cívica da nação, fortalecendo a coesão social e o senso de normas compartilhadas. Ao construir uma base menos suscetível à influência externa, reforçaremos a estabilidade interna."
 JAP_fundamentals_of_education: "Redefinir os Fundamentos da Educação"
 JAP_fundamentals_of_education_desc: "Revisaremos os objetivos e padrões da educação e redefiniremos, como política nacional, o desenvolvimento da capacidade acadêmica, dos conhecimentos fundamentais e das habilidades práticas. Ao priorizar o investimento em educação, fortaleceremos a base para o desenvolvimento do capital humano e da pesquisa e desenvolvimento."
 JAP_dotoku_education: "Educação Dotoku"
 JAP_dotoku_education_desc: "Daremos maior ênfase à educação Dotoku e cultivaremos valores como o espírito cívico, a responsabilidade e a consideração pelos outros no ensino escolar. Ao fortalecer as normas sociais e aprofundar a coesão nas comunidades locais, contribuiremos para a estabilidade interna."
 JAP_national_flag_and_anthem: "Respeitar a Bandeira e o Hino Nacional"
 JAP_national_flag_and_anthem_desc: "Afirmaremos claramente o respeito à bandeira e ao hino nacional, fortalecendo o sentimento de pertencimento nacional e a unidade social. Isso reforçará a coesão em tempos de crise e construirá uma base menos suscetível à influência externa."
 JAP_family_policy: "Fortalecer a Política Familiar"
 JAP_family_policy_desc: "Respeitaremos os valores dos lares e das famílias e ampliaremos as medidas que apoiam a criação dos filhos e a vida cotidiana. Ao criar um ambiente em que as pessoas possam formar famílias com tranquilidade, fortaleceremos a base demográfica futura e contribuiremos para a estabilidade social."
 JAP_glorious_decade: "Rumo a uma Década de Brilho"
 JAP_inflation_target: "Esclarecer o Compromisso da Política"
 JAP_down_long_term_interest_rates: "Reduzir as Taxas de Juros de Longo Prazo"
 JAP_down_long_term_interest_rates_desc: "Manteremos as taxas de juros de longo prazo baixas e estáveis, reduzindo os custos de financiamento para empresas e famílias. Ao apoiar o investimento, a renovação de capital e a compra de imóveis, sustentando assim a demanda e elevando a economia, abriremos também caminho para a recuperação da arrecadação de impostos."
 JAP_special_inspection_banks: "Inspeções Especiais nos Bancos"
 JAP_special_inspection_banks_desc: "Para restaurar a solidez do sistema financeiro, realizaremos exames rigorosos dos ativos dos bancos. Ao esclarecer o verdadeiro estado dos créditos inadimplentes e acabar com o adiamento de perdas e o tratamento opaco, criaremos um ponto de apoio para deter a reação em cadeia de ansiedade com o crédito e aperto nos empréstimos."
 JAP_bank_supervision: "Fortalecer a Supervisão Bancária"
 JAP_bank_supervision_desc: "Em vez de tratar as inspeções e medidas corretivas como algo pontual, fortaleceremos permanentemente o arcabouço de supervisão. Ao impor a divulgação e a governança e evitar a repetição de uma gestão de risco frágil e de um tratamento opaco, estabilizaremos a confiança no sistema financeiro."
 JAP_business_assessment: "Avaliação Justa das Empresas"
 JAP_business_assessment_desc: "Para julgar com precisão as capacidades e os riscos das empresas, avaliaremos objetivamente a lucratividade e as perspectivas futuras dos negócios. Sem depender de manter as empresas à tona ou de prolongá-las, distinguiremos as áreas que devem ser reconstruídas daquelas que devem ser reestruturadas e lançaremos as bases para que capital e talento fluam para os setores de crescimento."
 JAP_corporate_debt_restructuring: "Reestruturação da Dívida Corporativa"
 JAP_corporate_debt_restructuring_desc: "Trataremos dos fardos excessivos de dívida e garantiremos o tempo e o fôlego necessários para a recuperação. Ao sair do estado de ser consumido por pagamentos de juros e amortizações, e permitir que os recursos sejam direcionados ao investimento, ao emprego e à transformação dos negócios, romperemos a cadeia da estagnação."
 JAP_corporate_revitalization: "Revitalização Corporativa"
 JAP_corporate_revitalization_desc: "Levaremos a reestruturação a uma nova etapa e reconstruiremos as bases corporativas em termos financeiros e operacionais. Ao tratar de encargos excessivos e ineficiências e colocar as empresas em posição de avançar com investimentos, contratações e aumentos salariais, consolidaremos uma recuperação liderada pelo setor privado."
 JAP_expectations_escaping_deflation: "Restaurar as Expectativas de Crescimento"
 JAP_expectations_escaping_deflation_desc: "Ao resolver os créditos inadimplentes e desfazer o endividamento excessivo, deslocaremos o foco da economia da \"defesa\" para o \"ataque\". Se as empresas retomarem os gastos com investimento, P&D e pessoas, e as famílias recuperarem uma perspectiva mais clara do futuro, um círculo virtuoso de produtividade e salários será mais provável de se firmar. Construiremos a base necessária para reiniciar plenamente a recuperação da competitividade."
 JAP_promoting_labor_mobility: "Promover a Mobilidade da Mão de Obra"
 JAP_promoting_labor_mobility_desc: "Criaremos condições que facilitem o deslocamento de talentos para os setores de crescimento e avançaremos na realocação da força de trabalho. Ao reduzir as barreiras à troca de emprego e à recolocação e apoiar a requalificação, impulsionaremos a renovação industrial e elevaremos a produtividade."
 JAP_competition_service_sector: "Promover a Concorrência no Setor de Serviços"
 JAP_competition_service_sector_desc: "Incentivaremos a entrada e a concorrência no setor de serviços e trataremos das ineficiências e rigidezes de preços que têm contribuído para a estagnação. Ao revisar regulamentos e práticas arraigadas, melhoraremos o ambiente de negócios e passaremos a um mercado em que serviços melhores sejam mais facilmente escolhidos."
 JAP_revitalization_economy: "Revitalizar a Economia Japonesa"
 JAP_revitalization_economy_desc: "Avançamos na reconstrução do sistema financeiro e do setor corporativo e traçamos um caminho para recuperar a demanda e melhorar os salários. Ao eliminar uma a uma as causas da estagnação e criar um ambiente em que famílias e empresas enxerguem o futuro com mais clareza, consolidaremos o ímpeto rumo ao crescimento."
 JAP_equal_pay_for_equal_work: "Salário Igual para Trabalho Igual"
 JAP_equal_pay_for_equal_work_desc: "A Lei de Emprego de Meio Período e de Prazo Determinado obriga os empregadores a justificar cada diferença de salário e benefício entre trabalhadores regulares e não regulares, ou aboli-la. Quatro em cada dez trabalhadores japoneses são não regulares, sentados nas mesmas mesas por uma fração do salário-hora, sem bônus, sem indenização de aposentadoria e sem expectativa de emprego na próxima primavera. As empresas perdem o colchão de mão de obra barata em que se apoiaram por décadas, e milhões de pessoas que nunca puderam planejar um ano à frente finalmente podem."
 JAP_diplomacy: "Diplomacia do Japão"
 JAP_diplomacy_desc: "Reconstruir os laços com o mundo e redefinir o papel do Japão na comunidade internacional."
 JAP_diplomacy_idea_TT: "§YÀ medida que você avança no foco de diplomacia, novos modificadores serão adicionados a este espírito nacional!§!"
 JAP_friendship_asean: "Melhorar as Relações com a ASEAN"
 JAP_friendship_asean_desc: "O governo japonês trabalhará para melhorar as relações com os países da ASEAN, avançando na restauração da confiança e na promoção do diálogo. Para o Japão, a ASEAN é um parceiro indispensável e importante tanto em termos econômicos quanto de segurança, e sua unidade e estabilidade moldarão o futuro de toda a região."
 JAP_not_asean_war_TT: "Existe pelo menos um país com o espírito nacional \"Membro da ASEAN\", e o Japão não está em guerra com nenhum país que tenha o espírito nacional \"Membro da ASEAN\"."
 JAP_chiang_mai: "Iniciativa de Chiang Mai"
 JAP_chiang_mai_desc: "Por meio da Iniciativa de Chiang Mai, o Japão fortalece a cooperação financeira regional para apoiar a estabilidade econômica e a coesão das nações da ASEAN."
 JAP_quantitative_oda: "APD Quantitativa"
 JAP_quantitative_oda_desc: "Por meio de investimentos em larga escala da APD em infraestrutura essencial, como transportes, portos e energia, o Japão apoia o crescimento econômico da ASEAN e a conectividade regional."
 JAP_qualitative_oda: "APD Qualitativa"
 JAP_qualitative_oda_desc: "Ao fazer parcerias com empresas e instituições locais, o Japão promove o desenvolvimento do capital humano e os valores democráticos, ampliando sua influência na ASEAN."
 JAP_security_south_china_sea: "Postura de Segurança no Mar da China Meridional"
 JAP_security_south_china_sea_desc: "Amparado pela confiança das nações da ASEAN, o Japão inicia um marco de segurança marítima neutra e pacífica no Mar da China Meridional."
 JAP_away_dependence: "Romper com a Dependência dos EUA"
 JAP_away_dependence_desc: "O Japão começa a reexaminar a natureza de seus laços de longa data, buscando ampliar suas opções estratégicas e sua autonomia. Em áreas como economia, tecnologia e segurança, seguimos um rumo moldado por nossa própria visão de futuro."
 JAP_development_production: "Estabelecer Cadeias de Produção Nacionais"
 JAP_development_production_desc: "Para garantir a defesa nacional de forma independente, estabeleceremos um sistema doméstico capaz de produzir armas e materiais dentro do Japão."
 JAP_japanese_doctrine: "Formular uma Doutrina Japonesa"
 JAP_japanese_doctrine_desc: "Estabeleceremos uma doutrina de segurança japonesa independente, permitindo respostas flexíveis adaptadas ao nosso ambiente estratégico."
 JAP_recalling_researchers: "Chamar de Volta os Pesquisadores no Exterior"
 JAP_recalling_researchers_desc: "Universidades e laboratórios nacionais oferecem cargos de via rápida, instalações modernizadas e bolsas competitivas para reverter um longo êxodo de talentos. O objetivo é reconstruir a força de pesquisa nacional trazendo de volta cientistas japoneses dos Estados Unidos."
 JAP_japanese_cloud: "Nuvem Kasumigaseki"
 JAP_japanese_cloud_desc: "Construir uma \"Nuvem Kasumigaseki\" governamental, operada por provedores japoneses e hospedada em servidores nacionais. Ministérios e órgãos-chave migram seus sistemas para essa plataforma compartilhada para reduzir custos, padronizar a segurança e manter dados sensíveis sob controle nacional."
 JAP_base_okinawa: "Negociações sobre a Retirada das Forças dos EUA em Okinawa"
 JAP_base_okinawa_desc: "Para reforçar a autonomia de segurança do Japão, começarão as negociações para a retirada das forças dos EUA estacionadas em Okinawa."
 JAP_enhancement_exercises: "Exercícios Conjuntos Ampliados"
 JAP_enhancement_exercises_desc: "Aprofundar a integração com as forças dos EUA por meio de treinos conjuntos maiores e mais frequentes. Unidades marítimas, aéreas e terrestres ensaiam procedimentos, comunicações e logística compartilhados para que, numa crise real, ambos os lados possam se mover, combater e se reabastecer como uma única força coordenada."
 JAP_education_jap_usa: "Programas Educacionais Conjuntos EUA-Japão"
 JAP_education_jap_usa_desc: "Para aprofundar o entendimento mútuo entre o Japão e os Estados Unidos, implementaremos programas educacionais conjuntos e intercâmbios de estudantes. Aprendendo com o senso de disciplina do Japão e o espírito empreendedor dos EUA, esta iniciativa formará uma nova geração de líderes de mentalidade internacional e fortalecerá ainda mais a confiança bilateral."
 JAP_culture_technology: "Intercâmbio Cultural e Tecnológico Japão-EUA"
 JAP_culture_technology_desc: "Estreitar os laços entre empresas japonesas e polos tecnológicos dos EUA, unindo laboratórios universitários e estúdios a parceiros no Vale do Silício, em Seattle e em Los Angeles. Engenheiros, designers e criadores circulam em projetos conjuntos, combinando o know-how americano em plataformas com o hardware, os jogos e a animação japoneses."
 JAP_dual_use: "Cooperação em Tecnologia de Uso Duplo"
 JAP_dual_use_desc: "O Japão e os Estados Unidos aprofundarão a cooperação no campo das tecnologias de uso duplo, aplicáveis tanto a fins civis quanto militares. Por meio da colaboração entre a indústria e a academia, esta parceria acelerará os esforços de pesquisa e desenvolvimento, impulsionando o avanço tecnológico geral."
 JAP_okinawa_development: "Projeto de Desenvolvimento Conjunto de Okinawa"
 JAP_okinawa_development_desc: "Para promover o crescimento econômico e a integração regional de Okinawa, o Japão e os Estados Unidos cooperarão em um projeto de desenvolvimento conjunto centrado em infraestrutura. Ao melhorar redes de transporte, sistemas logísticos e instalações públicas, esta iniciativa busca ampliar o crescimento regional e abrir novos caminhos para a cooperação Japão-EUA."
 JAP_informal_cooperation: "Marco de Cooperação Informal"
 JAP_informal_cooperation_desc: "Apesar da falta de relações diplomáticas formais, o Japão e Taiwan desenvolveram formas práticas e substanciais de cooperação. Por meio da resposta a desastres, do intercâmbio tecnológico e da interação entre os povos, está sendo estabelecida uma base mutuamente benéfica."
 JAP_disaster_countermeasure_cooperation: "Plataforma de Conhecimento sobre Desastres Japão-Taiwan"
 JAP_disaster_countermeasure_cooperation_desc: "Dada a vulnerabilidade compartilhada a desastres naturais, o Japão e Taiwan estão criando uma plataforma conjunta para compartilhar conhecimentos e lições sobre resposta a desastres. Essa cooperação reforça a resiliência e a capacidade de reparo de ambas as nações."
 JAP_tai_high_technology: "Elo de Alta Tecnologia Japão-Taiwan"
 JAP_tai_high_technology_desc: "Instituições de pesquisa e empresas privadas do Japão e de Taiwan estão unindo forças para colaborar em tecnologias civis de ponta. Esta parceria visa impulsionar a inovação e a produtividade nas indústrias de ambas as nações."
 JAP_tai_tourist_visa: "Flexibilização das Políticas de Visto de Turista"
 JAP_tai_tourist_visa_desc: "Para incentivar ainda mais o turismo receptivo vindo de Taiwan, o Japão facilitará seus procedimentos de visto. O maior intercâmbio entre os povos e o turismo ajudarão a estimular a economia e a promover um entendimento mútuo mais profundo."
 JAP_tai_international_student: "Ampliação dos Programas de Intercâmbio de Estudantes"
 JAP_tai_international_student_desc: "O Japão ampliará as oportunidades para estudantes taiwaneses estudarem em suas universidades. Esta iniciativa visa aprofundar os laços acadêmicos e culturais e formar futuros líderes que unirão as duas sociedades."
 JAP_tai_senkaku: "Estabelecer Negociações Marítimas com Taiwan"
 JAP_tai_senkaku_desc: "A disputa pelas Ilhas Senkaku molda os direitos de pesca, a segurança marítima e toda negociação no Mar da China Oriental. O Japão abre canais de diálogo e consultas práticas para reduzir o atrito na água sem ceder nada em matéria de soberania. Ele administra o confronto em vez de resolvê-lo."
 JAP_dprk_national_policy: "Doutrina da Península do Norte"
 JAP_dprk_national_policy_desc: "A Coreia do Norte continua sendo a faísca mais próxima de nossas costas e o ator mais imprevisível da península. Definiremos uma política nacional unificada em relação a Pyongyang, sincronizando diplomacia, inteligência e prontidão em uma única doutrina. O rumo que escolhermos definirá os termos da segurança no Nordeste Asiático."
 JAP_dprk_maximum_pressure: "Pressão Máxima sobre Pyongyang"
 JAP_dprk_maximum_pressure_desc: "A Coreia do Norte entende de alavancagem, não de boa vontade. Endureceremos a fiscalização das sanções, ampliaremos o monitoramento marítimo e coordenaremos a pressão diplomática para restringir a margem de escalada de Pyongyang. O objetivo é simples: elevar o custo de cada provocação até que o regime seja forçado a recalcular."
 JAP_dprk_missile_defense: "Escudo de Mísseis em Camadas"
 JAP_dprk_missile_defense_desc: "A ameaça do norte se mede em minutos, não em dias. Fortaleceremos uma rede de defesa antimísseis em camadas por terra, mar e ar para proteger nossas cidades, portos e centros de comando contra um ataque repentino. Um escudo crível negará a Pyongyang o poder de nos intimidar à distância."
 JAP_dprk_trilateral_training: "Exercícios Trilaterais na Península"
 JAP_dprk_trilateral_training_desc: "A segurança na península não pode se apoiar apenas em declarações. O treinamento conjunto com a Coreia do Sul e os Estados Unidos melhorará a prontidão, a interoperabilidade e a resposta a crises no ponto de conflito mais perigoso da região. Ao treinar juntos, sinalizamos que a agressão encontrará uma resposta coordenada."
 JAP_dprk_korean_defense_treaty: "Acordo de Defesa Japão-Coreia"
 JAP_dprk_korean_defense_treaty_desc: "A península e o arquipélago japonês compartilham a mesma linha de frente. Um acordo formal de defesa com a Coreia do Sul unirá o compartilhamento de inteligência, o planejamento de contingências e os compromissos mútuos de segurança em um marco duradouro. Antigos ressentimentos permanecem, mas a necessidade estratégica exige uma base mais sólida."
 JAP_dprk_conditional_engagement: "Canal Condicional com Pyongyang"
 JAP_dprk_conditional_engagement_desc: "A pressão sozinha não consegue administrar todas as crises. Abriremos um canal diplomático controlado com a Coreia do Norte, condicionado a regras estritas sobre testes de mísseis, incidentes militares e desestabilização regional. O diálogo não substituirá a dissuasão, mas poderá evitar erros de cálculo."
 JAP_dprk_normalization_framework: "Roteiro de Normalização"
 JAP_dprk_normalization_framework_desc: "Um Nordeste Asiático estável exige mais do que o gerenciamento permanente de crises. Estabeleceremos um marco gradual de normalização com a Coreia do Norte, vinculando o progresso diplomático a compromissos de segurança verificáveis e garantias regionais. Qualquer acordo deve ser gradual, exequível e ancorado na reciprocidade."
 JAP_dprk_support_unification: "Apoiar uma Península Unificada"
 JAP_dprk_support_unification_desc: "A divisão da Coreia moldou a segurança do Leste Asiático por gerações, mas não precisa ser permanente. Apoiaremos um caminho pacífico rumo à unificação coreana por meio da diplomacia, da coordenação com parceiros e do planejamento para a estabilidade regional. Se a península for refeita, o Japão deve ajudar a moldar a ordem que se seguir."
 JAP_history_education: "Transparência na Educação Histórica"
 JAP_history_education_desc: "Devemos encarar os fatos históricos de frente, revisando os materiais didáticos e as diretrizes de ensino. Uma educação histórica transparente é o primeiro passo para construir confiança com nossos países vizinhos."
 JAP_statement: "Declaração de [ROOT.GetLeader]"
 JAP_statement_desc: "Para expressar uma postura clara de responsabilidade e remorso em relação a eventos históricos, o governo emitirá uma nova declaração oficial. Esta iniciativa visa promover a reconciliação com as nações afetadas e fomentar relações voltadas ao futuro, baseadas na confiança mútua."
 JAP_intellectual_platform: "Plataforma Trilateral de História"
 JAP_intellectual_platform_desc: "Com a mediação da ONU, o Japão, a China e a Coreia do Sul planejarão e estabelecerão em conjunto museus e arquivos digitais para transmitir as memórias da guerra às futuras gerações. O Japão fornecerá apoio financeiro, posicionando esta iniciativa como um símbolo global de paz e reconciliação."
 JAP_intellectual_platform_TT: "§YSe ambos os países chegarem a um acordo, um espírito nacional que aumenta a §Gestabilidade§! será concedido às três nações!§!"
 JAP_chi_friendship: "Melhorar as Relações com a China"
 JAP_chi_friendship_desc: "Para estabilizar as relações Japão-China, o governo japonês continuará o diálogo e trabalhará para promover o entendimento mútuo e administrar os atritos. A China é um país vizinho com grande influência sobre a ordem e a economia regionais, e melhorar as relações está diretamente ligado à segurança e à prosperidade do Japão."
 JAP_chi_accept_intellectual_platform: "A China concordou com o estabelecimento da Plataforma de História Japão-China-Coreia."
 JAP_chi_trade_support: "Apoio à Reforma do Sistema Comercial da China"
 JAP_chi_trade_support_desc: "Oferecer apoio técnico e institucional à reforma e à modernização do sistema comercial da China. Isso facilita a entrada das empresas japonesas e amplia a influência do Japão na região."
 JAP_chi_advancement_companies: "Entrada Mútua de Empresas nos Mercados"
 JAP_chi_advancement_companies_desc: "Promover o investimento mútuo e a entrada no mercado entre empresas japonesas e chinesas para aumentar a interdependência econômica e elevar a produtividade."
 JAP_chi_kanji: "Projeto de Cooperação Cultural da \"Sinosfera\""
 JAP_chi_kanji_desc: "Ao fortalecer os laços culturais entre os países da Sinosfera, este projeto enfatiza valores compartilhados e vínculos históricos, servindo de amortecedor cultural contra influências externas."
 JAP_chi_temple: "Projeto Conjunto de Preservação de Templos Budistas"
 JAP_chi_temple_desc: "Preservar os templos budistas como patrimônio cultural compartilhado por meio da cooperação Japão-China. Este projeto eleva seu valor como atrativos turísticos e reafirma os laços históricos entre as duas nações."
 JAP_chi_senkaku: "Administrar a Disputa de Senkaku"
 JAP_chi_senkaku_desc: "As tensões em torno das Ilhas Senkaku estão diretamente ligadas ao conjunto das relações Japão-China e à estabilidade do Mar da China Oriental. Embora mantendo nossa posição sobre a soberania, é necessário estabelecer um marco diplomático de administração para evitar choques acidentais. Estabeleçamos formalmente canais de diálogo e, contendo o atrito no mar, avancemos nas negociações em um ambiente favorável ao nosso país."
 JAP_kor_friendship: "Melhorar as Relações com a Coreia do Sul"
 JAP_kor_friendship_desc: "Rumo a uma relação Japão-Coreia do Sul voltada ao futuro, o governo japonês trabalhará para restaurar a confiança e manter o diálogo. A Coreia do Sul é um dos vizinhos mais importantes do Japão, diretamente ligado à estabilidade regional e à economia, e melhorar as relações ampliará as opções e a influência do Japão."
 JAP_kor_accept_intellectual_platform: "A Coreia do Sul concordou com o estabelecimento da Plataforma de História Japão-China-Coreia."
 JAP_kor_accelerator: "Aceleradora Tóquio-Seul"
 JAP_kor_accelerator_desc: "Um programa conjunto de aceleração é estabelecido em Tóquio e Seul para apoiar e nutrir startups, fortalecendo a inovação e a cooperação econômica entre as duas capitais."
 JAP_kor_local_companies: "Iniciativa de Intercâmbio de Empresas Locais"
 JAP_kor_local_companies_desc: "Promove a colaboração entre empresas regionais, acelerando o crescimento e o desenvolvimento das indústrias civis em nível local."
 JAP_kor_cultural_exchange: "Intercâmbio Cultural"
 JAP_kor_cultural_exchange_desc: "Ao promover o intercâmbio cultural, lança-se a base para um maior entendimento mútuo e para a influência da opinião pública entre os dois povos."
 JAP_kor_aging: "Força-Tarefa Japão-Coreia sobre Sociedades em Envelhecimento"
 JAP_kor_aging_desc: "Uma força-tarefa conjunta Japão-Coreia é formada para enfrentar o desafio comum das sociedades em envelhecimento, realizando discussões mensais para elaborar políticas cooperativas."
 JAP_kor_liancourt_rocks: "Administrar a Disputa de Takeshima"
 JAP_kor_liancourt_rocks_desc: "A disputa por Takeshima (Dokdo) é uma importante questão pendente que pode afetar o conjunto das relações Japão-Coreia do Sul. Mantendo firmemente a posição de nosso país, estabeleceremos um marco de diálogo e consultas práticas para evitar atritos acidentais e a escalada das tensões diplomáticas. Isso levantará as restrições às negociações com a Coreia do Sul sobre a questão de Takeshima (Dokdo)."
 JAP_approaching_russia: "Reaproximação com a Rússia"
 JAP_approaching_russia_desc: "Para garantir a estabilidade geopolítica e o acesso a recursos, seguimos uma linha diplomática voltada a melhorar as relações com a Rússia, com foco na cooperação em energia, infraestrutura e comércio."
 JAP_sov_far_east_development: "Iniciativa do Extremo Oriente"
 JAP_sov_far_east_development_desc: "Aproveitando a experiência japonesa em revitalização regional no clima frio de Hokkaido, esta iniciativa promove o desenvolvimento de regiões frias no Extremo Oriente Russo por meio de investimento em infraestrutura e capital estrangeiro"
 JAP_sov_saakhalin: "Sacalina II"
 JAP_sov_saakhalin_desc: "Para garantir o acesso estável a combustíveis fósseis, o Japão fortalece o investimento estrangeiro no projeto energético Sacalina II em cooperação com a Rússia."
 JAP_sov_logistics_corridor: "Corredor Logístico Japão-Europa"
 JAP_sov_logistics_corridor_desc: "Desenvolveremos um corredor logístico terrestre ligando o Japão à Europa via Rússia. Utilizando as ferrovias e rodovias russas, buscamos encurtar os tempos de transporte e estabelecer um acesso estável aos mercados europeus."
 JAP_sov_it_corridor: "Corredor Digital da Rússia"
 JAP_sov_it_corridor_desc: "Em colaboração com empresas japonesas de TI, infraestrutura como data centers e cabos de fibra óptica será instalada na Rússia, criando uma rede de comércio digital que liga a Europa, a Ásia Central e a Rússia."
 JAP_sov_kuril_islands: "Administrar a Disputa dos Territórios do Norte"
 JAP_sov_kuril_islands_desc: "A questão dos Territórios do Norte é um assunto pendente não resolvido que toca o próprio alicerce das relações Japão-Rússia. Mantendo firmemente a posição de nosso país, estabeleceremos um marco de negociações diplomáticas e consultas práticas para evitar o entrincheiramento do confronto. Administrando com cuidado as relações com a Rússia, levantaremos as restrições às negociações sobre a questão dos Territórios do Norte."
 JAP_defensive_foundations: "Fundamentos Defensivos"
 JAP_defensive_foundations_desc: "O Japão fortalece a postura defensiva fundamental das Forças de Autodefesa, com foco na proteção do território, na resposta a crises e na dissuasão, permanecendo dentro dos limites de uma interpretação estritamente defensiva do Artigo 9."
 JAP_jgsdf: "Fortalecer a JGSDF"
 JAP_jgsdf_desc: "A Força Terrestre de Autodefesa do Japão amplia suas capacidades defensivas com melhor mobilidade, treinamento e prontidão. Essas medidas garantem que a força continue apta a proteger o território, atuando estritamente dentro das restrições legais e estratégicas existentes."
 JAP_type_x_mbt: "Destacar o Carro de Combate Principal Tipo 10"
 JAP_type_x_mbt_desc: "O Tipo 10 representa um salto no desenvolvimento blindado japonês: mais leve, mais rápido e projetado especificamente para o desdobramento rápido no terreno difícil do Japão. Ao ampliar a produção e treinar tripulações para essa plataforma avançada, a JGSDF fortalece sua capacidade de responder rapidamente a ameaças dentro do país."
 JAP_type_manouvre_combat_vehicle: "Veículo de Combate de Manobra Tipo 16"
 JAP_type_manouvre_combat_vehicle_desc: "O Veículo de Combate de Manobra Tipo 16 oferece poder de fogo altamente móvel para forças de resposta rápida. Sua configuração sobre rodas permite que a JGSDF reposicione unidades rapidamente pelo arquipélago, reforçando regiões remotas sem depender da logística de blindados pesados."
 JAP_wheeled_howitzer: "Obus Sobre Rodas Tipo 19"
 JAP_wheeled_howitzer_desc: "Uma nova geração de artilharia móvel, o Tipo 19, combina sistemas modernos de controle de tiro com capacidade de redesdobramento rápido. Seu chassi sobre rodas permite apoio flexível às operações defensivas na geografia dispersa e acidentada do Japão."
 JAP_chu_sam: "Expandir a Rede Chu-SAM Tipo 03"
 JAP_chu_sam_desc: "O Japão fortalece sua postura de defesa aérea com baterias Chu-SAM Tipo 03 adicionais. Esses modernos sistemas de mísseis de médio alcance reforçam a proteção contra incursões aéreas e se integram perfeitamente à infraestrutura nacional de alerta antecipado e rastreamento."
 JAP_type_atgm: "Modernizar as Unidades de Mísseis Antitanque da Infantaria"
 JAP_type_atgm_desc: "A JGSDF equipa sua infantaria e seus elementos de reconhecimento com sistemas aprimorados de mísseis antitanque guiados, incluindo modelos atualizados do Tipo 01 e do Tipo 96. Essas melhorias garantem que as forças terrestres continuem capazes de enfrentar ameaças blindadas modernas em qualquer combate defensivo."
 JAP_central_readiness_force: "Expandir a Força de Prontidão Central"
 JAP_central_readiness_force_desc: "A Força de Prontidão Central é desenvolvida como um comando flexível e rapidamente desdobrável, capaz de responder a emergências em qualquer parte do Japão. Ao melhorar o treinamento conjunto, a mobilidade e a coordenação com os exércitos regionais, garantimos que as unidades terrestres possam reforçar áreas críticas em curto prazo."
 JAP_civil_protection_act: "Implementar o Marco de Proteção Civil"
 JAP_civil_protection_act_desc: "Novas medidas de proteção civil formalizam a cooperação entre as Forças de Autodefesa, as autoridades locais, a polícia e os serviços de emergência. Procedimentos legais claros para evacuações, resposta a crises e proteção da infraestrutura fortalecem a capacidade do Japão de proteger sua população tanto em desastres quanto em incidentes de segurança."
 JAP_maritime_self_defence_force: "Fortalecer a Força Marítima de Autodefesa"
 JAP_maritime_self_defence_force_desc: "A Força Marítima de Autodefesa é reforçada com melhor treinamento, manutenção e estruturas de apoio para sustentar operações de alto ritmo no mar. Ao ampliar os grupos de escolta, a capacidade de patrulha e a logística naval, o Japão pode proteger melhor as rotas marítimas vitais e as águas costeiras."
 JAP_amphibious_rapid_deployment: "Treinar a Brigada Anfíbia de Desdobramento Rápido"
 JAP_amphibious_rapid_deployment_desc: "Uma formação anfíbia dedicada de desdobramento rápido é criada para responder a crises nas ilhas remotas do Japão. Combinando infantaria, blindados e transporte naval, esta brigada é treinada para reforçar, assegurar e, se necessário, retomar territórios-chave na fronteira marítima do Japão."
 JAP_atago_destroyer: "Comissionar Contratorpedeiros Aegis Avançados"
 JAP_atago_destroyer_desc: "Novos contratorpedeiros equipados com Aegis entram em serviço, oferecendo poderosas capacidades de defesa aérea, antissubmarino e comando. Essas escoltas avançadas formam o núcleo da moderna frota de superfície do Japão e fortalecem significativamente a proteção da frota e a dissuasão regional."
 JAP_keen_sword_operation: "Expandir os Exercícios Conjuntos Keen Sword"
 JAP_keen_sword_operation_desc: "A série de exercícios Keen Sword é expandida para incluir componentes navais, aéreos e terrestres mais complexos. Treinos regulares em larga escala com forças aliadas aprimoram a interoperabilidade, melhoram o comando e controle conjuntos e demonstram a prontidão do Japão para operar com eficácia em um ambiente regional disputado."
 JAP_f2_multirole_defensive_enhancement: "Aprimorar a Frota Multifunção F-2"
 JAP_f2_multirole_defensive_enhancement_desc: "A frota de F-2 recebe aviônicos, sensores e sistemas de armas atualizados para melhorar a defesa aérea e o ataque marítimo em águas próximas. Esses aprimoramentos permitem que as aeronaves respondam com mais eficácia às ameaças regionais, mantendo um perfil de missão essencialmente defensivo."
 JAP_f15_defensive_updat_programe: "Programa de Modernização Defensiva do F-15"
 JAP_f15_defensive_updat_programe_desc: "Os caças de superioridade aérea F-15 do Japão passam por uma modernização abrangente, incluindo radares modernos, suítes de guerra eletrônica e mísseis ar-ar aprimorados. A frota atualizada fortalece significativamente a capacidade do Japão de proteger seu próprio espaço aéreo contra adversários cada vez mais capazes."
 JAP_hyuga_class: "Empregar os Contratorpedeiros-Helicópteros da Classe Hyūga"
 JAP_hyuga_class_desc: "Os contratorpedeiros-helicópteros da classe Hyūga entram em pleno serviço operacional como plataformas de comando e de guerra antissubmarino. Sua capacidade de coordenar grupos de escolta e operar vários helicópteros melhora muito a proteção da frota e a consciência situacional marítima."
 JAP_p_maritime_patrol: "Expandir a Aviação de Patrulha Marítima"
 JAP_p_maritime_patrol_desc: "O Japão investe em aeronaves modernas de patrulha marítima para monitorar rotas marítimas, rastrear submarinos e apoiar operações de busca e salvamento. Uma cobertura de patrulha ampliada ao redor do arquipélago fortalece tanto a segurança nacional quanto a segurança do tráfego marítimo."
 JAP_deploy_ballistic_warning_radars: "Instalar Radares de Alerta de Mísseis Balísticos"
 JAP_deploy_ballistic_warning_radars_desc: "Novos radares de alerta antecipado de longo alcance são instalados para detectar e rastrear lançamentos de mísseis balísticos na região. Ao integrar esses sensores à rede de comando nacional, o Japão ganha minutos vitais para avaliar ameaças, alertar a população e coordenar respostas defensivas."
 JAP_modernize_jadge: "Modernizar a Rede de Defesa Aérea JADGE"
 JAP_modernize_jadge_desc: "O sistema JADGE (Japan Aerospace Defense Ground Environment) é atualizado com melhores enlaces de dados, capacidade de processamento e integração com sensores navais e terrestres. Uma rede JADGE modernizada permite decisões mais rápidas e um desdobramento mais eficiente dos meios de defesa aérea."
 JAP_air_self_defence_force: "Fortalecer a Força Aérea de Autodefesa"
 JAP_air_self_defence_force_desc: "A Força Aérea de Autodefesa amplia seus programas de treinamento, a infraestrutura de bases e as unidades de apoio para lidar com um ritmo operacional mais alto. Essas melhorias garantem que o Japão possa sustentar patrulhas aéreas contínuas, decolagens de alerta rápidas e exercícios conjuntos complexos à medida que o ambiente aéreo regional se torna mais exigente."
 JAP_article_nine_transition_comittee: "Criar o Comitê de Transição da Defesa"
 JAP_article_nine_transition_comittee_desc: "Um comitê dedicado é formado para coordenar a transição do Japão rumo a uma postura de defesa nacional modernizada. Reunindo formuladores de políticas, planejadores militares e especialistas jurídicos, o Japão pode administrar a mudança de responsabilidades e garantir uma transformação estável e bem organizada."
 JAP_article_nine_transition_comittee_tt: "§GO modificador de Equilíbrio de Poder do Artigo 9 não poderá mais mudar com base no nível de interpretação. Isso agora dá acesso a Focos Nacionais, removendo completamente o Artigo 9§!"
 JAP_secure_public_support: "Garantir o Apoio Público à Reforma da Defesa"
 JAP_secure_public_support_desc: "Um esforço nacional é lançado para explicar a evolução da política de defesa do Japão, responder às preocupações do público e construir confiança na nova postura de segurança. O amplo apoio da sociedade garante a estabilidade política e reduz o atrito durante a transição."
 JAP_modernize_joint_command: "Modernizar as Estruturas de Comando Conjunto"
 JAP_modernize_joint_command_desc: "As forças armadas integram seus comandos operacionais em uma estrutura conjunta unificada, melhorando a interoperabilidade e a prontidão. O planejamento conjunto moderno e padrões de treinamento compartilhados permitem respostas mais eficientes a cenários de segurança complexos."
 JAP_normalize_defense_procurement: "Normalizar os Sistemas de Aquisição de Defesa"
 JAP_normalize_defense_procurement_desc: "O Japão simplifica as aquisições de defesa, amplia a capacidade industrial e fortalece a coordenação com os fabricantes nacionais. Processos de aquisição transparentes e modernizados garantem que projetos de defesa críticos possam ser entregues com eficiência e de forma sustentável."
 JAP_formalize_national_defense: "Formalizar as Capacidades de Defesa Nacional"
 JAP_formalize_national_defense_desc: "O Japão codifica oficialmente suas responsabilidades de defesa ampliadas, esclarecendo papéis, missões e metas estratégicas de longo prazo. Com a transição concluída, as forças armadas atuam sob uma visão unificada, concebida para proteger os interesses nacionais em um ambiente regional cada vez mais complexo."
 JAP_normalize_defense_procurement_done: "Aquisições de Defesa Normalizadas"
 JAP_modernize_joint_command_done: "Modernização do Comando Conjunto Concluída"
 JAP_consolidate_national_defense_framework_done: "Marco de Defesa Nacional Consolidado"
 JAP_rebuild_blue_water_navy: "Reconstruir uma Marinha de Águas Azuis"
 JAP_rebuild_blue_water_navy_desc: "O Japão prepara sua frota para operações prolongadas muito além das águas nacionais, ampliando a logística, a capacidade de reabastecimento e as forças de escolta de longo alcance. Uma marinha de águas azuis renovada permite ao Japão proteger rotas marítimas, apoiar parceiros e responder a crises em toda a região ampliada."
 JAP_carrier_aviation_tt: "[JAP_carrier_aviation_idea_desc]\n"
 JAP_carrier_aviation_development: "Programa de Desenvolvimento da Aviação Embarcada"
 JAP_carrier_aviation_development_desc: "Um programa dedicado é lançado para desenvolver a aviação capaz de operar em porta-aviões, integrando caças navais, operações de convés e treinamento especializado. Construir uma arma aérea embarcada crível aumenta drasticamente o alcance e a flexibilidade da frota, tanto na dissuasão quanto no combate."
 JAP_submarine_modernization_project: "Projeto de Modernização de Submarinos"
 JAP_submarine_modernization_project_desc: "O Japão moderniza sua frota de submarinos com cascos mais silenciosos, sensores avançados e armas modernas. Uma nova geração de submarinos de ataque fortalece a dissuasão submarina, a capacidade de negação do mar e a habilidade de monitorar em profundidade águas disputadas."
 JAP_expand_multi_role_destroyer_fleet: "Expandir a Frota de Contratorpedeiros Multifunção"
 JAP_expand_multi_role_destroyer_fleet_desc: "Contratorpedeiros multifunção adicionais são comissionados para oferecer defesa aérea, guerra antissubmarino e capacidade de ataque de superfície em uma única plataforma flexível. Essas escoltas formam a espinha dorsal das forças-tarefa ampliadas do Japão no mar."
 JAP_establish_joint_rapid_deployment_command: "Criar o Comando Conjunto de Desdobramento Rápido"
 JAP_establish_joint_rapid_deployment_command_desc: "Um comando conjunto é criado para coordenar elementos terrestres, aéreos e navais rapidamente desdobráveis. Com planejamento unificado e respostas de contingência pré-combinadas, o Japão ganha uma força capaz de reagir rapidamente a crises em qualquer ponto de seu ambiente estratégico ampliado."
 JAP_full_defense_industrial_mobilisation: "Mobilização Industrial de Defesa Total"
 JAP_full_defense_industrial_mobilisation_desc: "O Japão alinha sua base industrial, suas instituições de pesquisa e suas redes logísticas em torno de um plano abrangente de produção de defesa. Aquisições padronizadas, contratos de longo prazo e capacidade ampliada permitem a fabricação contínua de navios, veículos, aeronaves e armas avançadas."
 JAP_long_range_strike_missile_artillery_forces: "Forças de Ataque de Longo Alcance e Artilharia de Mísseis"
 JAP_long_range_strike_missile_artillery_forces_desc: "Unidades especializadas de mísseis e artilharia são organizadas para realizar ataques de precisão a longa distância. Combinando munições avançadas com sistemas modernos de designação de alvos e comando, o Japão ganha a capacidade de manter em risco ativos militares distantes e infraestruturas essenciais."
 JAP_expand_mechanized_brigades: "Expandir as Brigadas Mecanizadas"
 JAP_expand_mechanized_brigades_desc: "As formações mecanizadas existentes são reforçadas e novas brigadas são criadas, equipadas com veículos de combate de infantaria modernos e blindados de apoio. Essa expansão melhora a mobilidade, a proteção e a capacidade de combate sustentado em terra."
 JAP_deploy_next_generation: "Empregar Formações de Combate de Nova Geração"
 JAP_deploy_next_generation_desc: "As unidades de combate são reorganizadas em torno de equipamentos de nova geração, sistemas de comando em rede e doutrina de armas combinadas. Essas formações são projetadas para desdobramento rápido, alta capacidade de sobrevivência e operações eficazes em ambientes complexos e de alta intensidade."
 JAP_national_defense_professionalization: "Profissionalização da Defesa Nacional"
 JAP_national_defense_professionalization_desc: "O Japão investe em educação militar profissional, desenvolvimento de carreira e sistemas modernos de pessoal em todas as forças. Um corpo de oficiais e sargentos mais capaz, experiente e coeso aumenta a prontidão, melhora a liderança e sustenta a eficácia de longo prazo das forças de defesa nacional."
 JAP_integrated_air_space_command: "Comando Integrado Aeroespacial"
 JAP_integrated_air_space_command_desc: "Um comando integrado aeroespacial é criado para coordenar a defesa aérea, o alerta antecipado, o apoio por satélite e a vigilância espacial. Fundindo informações de radares terrestres, sensores aerotransportados e plataformas orbitais, o Japão obtém um quadro mais claro do espaço de batalha e pode responder mais rápido a ameaças emergentes."
 JAP_establish_long_range_strike_aviation: "Criar a Aviação de Ataque de Longo Alcance"
 JAP_establish_long_range_strike_aviation_desc: "Unidades dedicadas de aviação de ataque de longo alcance são formadas, equipadas com aeronaves modernas e armas de saída (standoff). Essas forças dão a capacidade de atingir alvos críticos a grandes distâncias, apoiando a dissuasão e as operações conjuntas em toda a região ampliada."
 JAP_mext_generation_air_dominance: "Domínio Aéreo de Nova Geração"
 JAP_mext_generation_air_dominance_desc: "O Japão acelera o desenvolvimento de um caça de domínio aéreo de nova geração, combinando furtividade, sensores avançados e sistemas de combate em rede. Este programa garante que a força aérea possa manter a superioridade em céus cada vez mais disputados no futuro."
 JAP_advanced_missile_development: "Diretoria de Mísseis Avançados"
 JAP_advanced_missile_development_desc: "Uma diretoria dedicada é criada para supervisionar a pesquisa, os testes e a produção de sistemas de mísseis avançados. De armas ar-ar e antinavio modernas a capacidades de ataque de precisão de longo alcance, esse esforço amplia o arsenal do Japão e aumenta a eficácia de todos os ramos."
 JAP_high_tech_domestic_manufacturing: "Manufatura de Defesa Nacional de Alta Tecnologia"
 JAP_high_tech_domestic_manufacturing_desc: "O Japão investe em manufatura de ponta para aviônicos, sensores, estruturas compostas e sistemas de propulsão. Fortalecer as cadeias de suprimentos nacionais de componentes críticos reduz a dependência de fornecedores estrangeiros e apoia a modernização rápida de plataformas aéreas e de mísseis."
 JAP_establish_japan_defense_technology_agency: "Agência de Tecnologia de Defesa do Japão"
 JAP_establish_japan_defense_technology_agency_desc: "Uma agência centralizada de tecnologia de defesa é criada para coordenar pesquisa, aquisições e inovação entre a indústria, a academia e as forças armadas. A supervisão unificada acelera os ciclos de desenvolvimento, reduz a duplicação e garante que conceitos promissores passem rapidamente do laboratório às unidades da linha de frente."
 JAP_atla_defense_technology_consolidation: "Consolidação Tecnológica da ATLA"
 JAP_atla_defense_technology_consolidation_desc: "A Agência de Aquisição, Tecnologia e Logística recebe um papel central na coordenação de pesquisa, desenvolvimento e aquisições em todos os ramos das forças armadas. Ao consolidar os programas de tecnologia de defesa sob uma única autoridade, o Japão pode reduzir a duplicação, acelerar a inovação e levar projetos promissores mais depressa ao serviço operacional."
 JAP_gifu_test_aerospace_development_center: "Centro de Testes e Desenvolvimento Aeroespacial de Gifu"
 JAP_gifu_test_aerospace_development_center_desc: "Gifu é transformada em um polo de testes e avaliação de primeira linha para aeronaves, aviônicos e sistemas de armas. Campos de provas dedicados, espaço aéreo instrumentado e equipes de engenharia especializadas apoiam ensaios rigorosos, garantindo que novos projetos sejam plenamente comprovados antes de entrar em serviço na linha de frente."
 JAP_aichi_nagoya_aerospace_defense_cluster: "Polo Aeroespacial e de Defesa de Aichi-Nagoya"
 JAP_aichi_nagoya_aerospace_defense_cluster_desc: "A região de Aichi-Nagoya é cultivada como um importante polo de produção aeroespacial e de defesa, ligando grandes fabricantes, fornecedores e institutos de pesquisa. O investimento concentrado nessa área aumenta a produção de fuselagens, motores e componentes de alta tecnologia para plataformas militares e de uso duplo."
 JAP_kobo_maritime_heavy_industry_corridor: "Corredor de Indústria Pesada Marítima de Kobe"
 JAP_kobo_maritime_heavy_industry_corridor_desc: "Kobe e as cidades costeiras vizinhas são transformadas em um corredor contínuo de indústria pesada marítima. Estaleiros, siderúrgicas e empresas de engenharia naval ampliados oferecem capacidade para construir e manter uma frota maior e mais capaz e sua infraestrutura de apoio."
 JAP_nagasaki_shipyard_defense: "Integração Defensiva dos Estaleiros de Nagasaki"
 JAP_nagasaki_shipyard_defense_desc: "Os principais estaleiros de Nagasaki são integrados mais profundamente ao planejamento da defesa nacional, dedicando capacidade adicional a escoltas, navios de apoio e plataformas navais especializadas. Uma coordenação mais estreita entre os estaleiros e a marinha encurta os prazos de construção e melhora a prontidão da frota."
 JAP_kure_naval_arsenal_revival: "Renascimento do Arsenal Naval de Kure"
 JAP_kure_naval_arsenal_revival_desc: "As históricas instalações navais de Kure são revitalizadas como um complexo moderno de construção e reparo naval. Docas, oficinas e nós logísticos modernizados restauram o papel da cidade como centro-chave de manutenção, reformas e atualizações de navios de guerra da linha de frente."
 JAP_sasebo_fleet_support_complex: "Complexo de Apoio à Frota de Sasebo"
 JAP_sasebo_fleet_support_complex_desc: "Sasebo é ampliada em um complexo abrangente de apoio à frota, com maior capacidade de reparo, armazenamento de munição e infraestrutura de suprimento. Sua localização no oeste do Japão a torna um polo ideal para sustentar operações em mares próximos e em pontos de estrangulamento marítimos essenciais."
 JAP_yokosuka_dockyard_expansion: "Expansão do Estaleiro de Yokosuka"
 JAP_yokosuka_dockyard_expansion_desc: "Os estaleiros de Yokosuka e as instalações associadas são ampliados para comportar mais navios e ciclos de manutenção mais profundos. Como uma das principais bases navais do Japão, uma Yokosuka ampliada aumenta muito a capacidade da marinha de manter os principais combatentes de superfície prontos para o desdobramento."
 JAP_revitalize_defense_production: "Revitalizar a Base de Produção de Defesa"
 JAP_revitalize_defense_production_desc: "O Japão empreende um amplo esforço para reanimar sua base industrial de defesa, apoiando os principais fabricantes, estabilizando contratos de longo prazo e modernizando as linhas de produção. Uma base industrial mais saudável permite ao país equipar suas forças de forma confiável e se adaptar mais rapidamente a novas exigências operacionais."
 JAP_kaguya_starward_expedition: "Expedição Estelar Kaguya"
 JAP_kaguya_starward_expedition_desc: "Inspirado no conto da Princesa Kaguya, que voltou à Lua em um manto de luz, o Japão lança um ambicioso levantamento de espaço profundo de asteroides próximos da Terra. Sondas robóticas avançadas e demonstradores de mineração são enviados ao vazio, transformando lenda em tecnologia e lançando as bases para a futura extração de recursos entre as estrelas."
 JAP_kaguya_starward_expedition_tt: "§YNossa Missão à Lua será iniciada!§!"
 JAP_tsukuyomi_lunar_program: "Programa Lunar Tsukuyomi"
 JAP_tsukuyomi_lunar_program_desc: "Batizado em homenagem a Tsukuyomi, o kami da lua da mitologia japonesa, este programa une a indústria, os institutos de pesquisa e a agência espacial em um esforço lunar contínuo. Orbitadores, módulos de pouso e infraestrutura de superfície transformam a Lua de um símbolo distante em um posto avançado tangível, a serviço da ciência, da navegação e das ambições de longo prazo do futuro espacial do Japão."
 JAP_amaterasu_martian_dawn: "Alvorecer Marciano Amaterasu"
 JAP_amaterasu_martian_dawn_desc: "Sob o nome de Amaterasu, deusa do sol nascente, o Japão estende a mão ao planeta vermelho. Sondas de longo alcance, propulsão avançada e pesquisa pioneira em suporte de vida sustentam uma nova onda de exploração marciana. Cada missão empurra os limites da engenhosidade humana, transformando o brilho distante de Marte no próximo horizonte da civilização de alta tecnologia do Japão."
 JAP_restore_imperial_household: "Restaurar a Casa Imperial"
 JAP_restore_imperial_household_desc: "A Casa Imperial sai da cerimônia e entra na administração nacional, recuperando capacidade institucional e um papel formal na corte. A legitimidade é reordenada de modo que o Trono do Crisântemo dite os termos em vez de ratificá-los. Cada facção agora precisa escolher um lado."
 JAP_reinstate_former_imperial_houses: "Reintegrar as Antigas Casas Imperiais"
 JAP_reinstate_former_imperial_houses_desc: "As antigas casas principescas são reintegradas e seu status restaurado, ampliando os ramos aptos a herdar o Trono. Os monarquistas o aclamam como salvaguarda de uma linhagem ininterrupta; os constitucionalistas o condenam como engenharia política. A sucessão estará garantida seja qual for o desfecho da discussão."
 JAP_male_line_succession_act: "Aprovar a Lei de Sucessão pela Linha Masculina"
 JAP_male_line_succession_act_desc: "A incerteza sucessória é uma vulnerabilidade estratégica tanto quanto uma controvérsia interna. Codificaremos em lei a sucessão pela linha masculina para eliminar ambiguidades e assegurar a continuidade dinástica por gerações. A medida consolidará o apoio monarquista, mas incendiará a oposição feroz de reformistas que a veem como um retrocesso em relação ao Japão moderno."
 JAP_imperial_rites_restored: "Restaurar os Ritos Imperiais"
 JAP_imperial_rites_restored_desc: "Um trono sem ritual é uma coroa sem peso. Restauraremos os ritos imperiais como cerimônias reconhecidas pelo Estado, reafirmando os fundamentos sagrados da monarquia e a continuidade da nação. Assim, ligamos o Estado moderno à legitimidade ancestral, aprove ou não a classe política."
 JAP_recall_privy_council: "Convocar de Volta o Conselho Privado"
 JAP_recall_privy_council_desc: "A política parlamentar se tornou barulhenta, passageira e cada vez mais desligada da arte de governar a longo prazo. Convocaremos de volta o Conselho Privado para dar ao Trono um órgão consultivo permanente, discreto, experiente e leal à continuidade do Estado. Seu retorno será visto como uma âncora estabilizadora pelos monarquistas e como um centro de poder não eleito por seus opositores."
 JAP_imperial_reform_commission: "Criar a Comissão de Reforma Imperial"
 JAP_imperial_reform_commission_desc: "A restauração exige estrutura, não improviso. Criaremos uma Comissão de Reforma Imperial para elaborar o plano jurídico e institucional de uma monarquia renovada e alinhar ministérios, repartições da corte e órgãos de segurança em torno de uma única doutrina de Estado. Uma vez reunida, a comissão transformará o simbolismo em política e tornará o recuo politicamente impossível."
 JAP_imperial_audience: "Realizar uma Audiência Imperial"
 JAP_imperial_audience_desc: "Os partidos serão convocados não como iguais, mas como suplicantes diante do Trono. Numa Audiência Imperial cuidadosamente encenada, vincularemos os líderes das facções a uma nova ordem, na qual a política eleitoral serve ao Estado em vez de comandá-lo. Se o Trono do Crisântemo vai presidir um xogunato moderno, deve primeiro fazer a classe política se curvar à sua lógica."
 JAP_imperial_civic_oath: "Proclamar o Juramento Cívico Imperial"
 JAP_imperial_civic_oath_desc: "Uma nova ordem exige mais do que decretos; exige lealdade compartilhada. Proclamaremos um Juramento Cívico Imperial que une funcionários, militares e instituições civis ao Trono como fonte última de legitimidade. Assim, transformamos a lealdade em lei e fazemos a dissidência parecer traição."
 JAP_unified_intelligence_secretariat: "Criar uma Secretaria Unificada de Inteligência"
 JAP_unified_intelligence_secretariat_desc: "Um xogunato moderno não pode ser cego. Consolidaremos serviços concorrentes em uma Secretaria Unificada de Inteligência que se reporta por uma única cadeia de comando e protege o quadro estratégico do Trono. Isso afiará nossa arte de governar da noite para o dia, ao mesmo tempo em que dá aos rivais todos os motivos para temer o que a corte agora sabe."
 JAP_blue_water_navy: "Construir uma Marinha de Águas Azuis"
 JAP_blue_water_navy_desc: "O destino do Japão é marítimo, e nossa segurança não pode terminar no horizonte. Construiremos uma verdadeira marinha de águas azuis, capaz de operar longe das águas nacionais, proteger rotas marítimas e projetar poder onde nossos interesses exigirem. Com a frota como instrumento de aço do Trono, o mundo aprenderá a medir o Japão pela esteira que ele deixa para trás."
 JAP_imperial_defense_council: "Formar o Conselho Imperial de Defesa"
 JAP_imperial_defense_council_desc: "A estratégia não pode ficar à mercê dos ciclos eleitorais e das rivalidades ministeriais. Formaremos um Conselho Imperial de Defesa para unificar as forças armadas, a liderança da inteligência e os principais ministérios sob uma única doutrina estratégica ancorada no Trono. De um só golpe, a política de segurança do Japão se torna coerente e muito mais difícil de ser sabotada pelas facções por dentro."
 JAP_rare_earth_resilience: "A Reserva Estratégica Imperial"
 JAP_rare_earth_resilience_desc: "O governo imperial ordena às grandes casas comerciais que garantam as linhas de suprimento e formem reservas de petróleo bruto e de metais estratégicos contra qualquer guerra ou embargo. A Casa e os ministérios detêm juntos os tendões materiais da nação em custódia para a coroa. O que o reino do Imperador não pode comprar livremente, ele estoca e garante com as próprias mãos.\n-------------\nSe §Y$JAP_national_energy_security$§! já tiver sido alcançada, a reserva é constituída sobre bases seguras e rende §Go dobro§! do benefício em metais estratégicos."
 JAP_national_shipbuilding_plan: "Programa de Expansão da Frota Imperial"
 JAP_national_shipbuilding_plan_desc: "O Trono não se contentará com a defesa costeira; o Japão comandará os mares que decidem nosso destino. Sob o Programa de Expansão da Frota Imperial, elevaremos a capacidade dos estaleiros, firmaremos aquisições navais de longo prazo e manteremos um ciclo de construção contínuo, do assentamento da quilha ao comissionamento. Quando este plano estiver em andamento, nossos rivais não debaterão as intenções do Japão. Eles contarão nossos cascos."
 JAP_imperial_war_cabinet: "Convocar o Gabinete Imperial de Guerra"
 JAP_imperial_war_cabinet_desc: "Em tempos de crise, o Japão não pode ser governado por demora, comissões e barganhas partidárias. Convocaremos um Gabinete Imperial de Guerra para centralizar a autoridade de comando e unir a liderança política a uma única linha estratégica sob o mandato do Trono. A partir deste momento, o Estado agirá com uma só voz, e será a do Imperador."
 JAP_russian_lost_territories: "Reivindicar os Territórios do Norte"
 JAP_russian_lost_territories_desc: "O Japão defende sua reivindicação sobre as ilhas e águas mantidas pela Rússia como uma exigência soberana respaldada por alavancagem real, e não como uma formalidade diplomática. Se Moscou recusar, o Japão deverá decidir até onde está disposto a ir. O norte não permanecerá fechado atrás de tratados e silêncio."
 JAP_fight_china_again: "Dragão e Crisântemo"
 JAP_fight_china_again_desc: "O velho conflito nunca foi realmente resolvido, apenas adiado por trás de tratados e equilíbrios cambiantes. Prepararemos a nação para enfrentar a China mais uma vez, mobilizando a indústria, as forças armadas e a vontade pública para uma guerra que decide o futuro da região. Desta vez, o Japão não lutará apenas pela sobrevivência, mas pela ordem que se seguirá."
 JAP_reclaim_pacific_rim: "Afirmar Nosso Mandato na Orla do Pacífico"
 JAP_reclaim_pacific_rim_desc: "A prosperidade e a segurança do Japão estão escritas por todo o Pacífico, das rotas marítimas às cadeias de ilhas e aos pontos de estrangulamento distantes. Afirmaremos um mandato na Orla do Pacífico que trate a influência marítima como política nacional, respaldada por presença da frota, acesso a bases e alavancagem econômica. A era de ver os outros traçarem o mapa acabou; o Japão o moldará."
 JAP_office_for_colonialism: "Reviver o Daitōa-shō"
 JAP_office_for_colonialism_desc: "Um império sem administração é uma conquista que desmorona sob o próprio peso. Reviveremos o Daitōa-shō para coordenar a governança no exterior, os arranjos de segurança e a integração econômica sob uma única doutrina imperial. Com um único ministério para dirigir a esfera, a influência do Japão não será mais improvisada: será administrada, expandida e imposta."
 JAP_office_for_colonialism_tt: "Desbloqueia a lei de ocupação nos estados asiáticos:\n"
 JAP_reclaim_south_chinese_sea: "Comandar os Mares do Sul"
 JAP_reclaim_south_chinese_sea_desc: "O Mar da China Meridional é a artéria da Ásia, e quem o controla controla o fluxo de comércio, combustível e poder. Agiremos para recuperar o domínio nessas águas, estabelecendo presença, bases e a força naval para impor nossa vontade a qualquer desafiante. O Japão não pedirá acesso; irá garanti-lo pela força."
 JAP_reclaim_indochina: "Retornar à Indochina"
 JAP_reclaim_indochina_desc: "A Indochina fica no cruzamento do Sudeste Asiático, onde portos, recursos e rotas marítimas decidem quem define o equilíbrio regional. Retornaremos com pressão, força e engenharia política para trazer esses territórios de volta à direção estratégica do Japão. Uma vez assegurado, o flanco sul de nossa esfera marítima será ancorado em influência permanente."
 JAP_reclaim_australia: "A Âncora do Sul"
 JAP_reclaim_australia_desc: "A Austrália é a pedra angular do Pacífico Sul, um continente que pode abrigar frotas, poder aéreo e a logística que decide guerras longas. Agiremos para trazê-la ao controle estratégico do Japão, não como uma incursão ou um gesto, mas como uma âncora permanente de nossa esfera marítima. Se o sul for assegurado, o Pacífico se torna um lago japonês."
 JAP_reclaim_myanmar: "Assegurar o Portão do Irrawaddy"
 JAP_reclaim_myanmar_desc: "Mianmar é a ponte terrestre entre o Sul e o Sudeste Asiático, controlando rotas que ligam a Baía de Bengala ao coração da região. Agiremos para retomá-lo pela força e pela pressão política, transformando seus portos, aeródromos e corredores em ativos da esfera ampliada do Japão. Uma vez assegurado o Portão do Irrawaddy, nosso flanco sul se torna muito mais difícil de desafiar."
 JAP_reclaim_the_pacific: "O Oceano como Nossa Fronteira"
 JAP_reclaim_the_pacific_desc: "O Pacífico não é uma extensão distante: é a fronteira que decide a sobrevivência e a grandeza do Japão. Vamos recuperá-lo por meio de presença da frota, pontos fortificados nas ilhas e a vontade de impor uma ordem marítima moldada em Tóquio. Quando o oceano se tornar nossa fronteira, todo rival será forçado a operar sob nossa sombra."
 JAP_reclaim_north_korea: "Subjugar o Norte sob a Mão de Tóquio"
 JAP_reclaim_north_korea_desc: "Forçaremos um acordo que despoje Pyongyang de autonomia estratégica e coloque sua política externa sob supervisão japonesa. Por meio de acesso controlado, garantias de segurança e alavancagem dura sobre recursos e reconstrução, o Norte será transformado em um amortecedor dependente, em vez de uma ameaça imprevisível. É dominação sem ilusões, e estabilidade imposta por desenho."
 JAP_reclaim_south_korea: "Impor um Marco de Protetorado"
 JAP_reclaim_south_korea_desc: "Iremos além da influência e estabeleceremos um marco de protetorado que vincule a política externa e de segurança da Coreia à direção de Tóquio. Por meio de acordos controlados, assessores e alavancagem sobre instituições-chave, a Coreia será forçada a uma posição subordinada sem necessidade de anexação aberta. É um império moderno construído com papelada, pressão e permanência."
 JAP_reclaim_taiwan: "Estabelecer um Protetorado sobre Taiwan"
 JAP_reclaim_taiwan_desc: "Passaremos da influência ao controle impondo um marco de protetorado que vincule a defesa e a política externa de Taiwan à direção de Tóquio. Por meio de garantias, direitos de bases e alavancagem institucional, a ilha será assegurada como um bastião marítimo leal, sem necessidade de anexação aberta. É um arranjo imperial moderno, imposto pelo poder naval e pela pressão política."
 JAP_basic_reconstruction_policy: "Política de Reconstrução"
 JAP_basic_reconstruction_policy_desc: "Na esteira da devastação sem precedentes causada pelo Grande Terremoto do Leste do Japão, o governo deve estabelecer uma política básica de reconstrução. Apresentar um marco nacional para restaurar os meios de subsistência, reconstruir a infraestrutura e revitalizar a indústria será o primeiro passo para recuperar a confiança do público e estabilizar a sociedade."
 JAP_tohoku_infrastructure: "Reconstruir a Infraestrutura de Tohoku"
 JAP_tohoku_infrastructure_desc: "O terremoto e o tsunami causaram danos catastróficos às redes de transporte e serviços essenciais de Tohoku. Reconstruir estradas, ferrovias e portos é o primeiro passo para restaurar as comunidades locais e avançar na recuperação da região. Embora o esforço exija custos e tempo imensos, não pode ser adiado."
 JAP_fishery_revival: "Recuperação Agropesqueira"
 JAP_fishery_revival_desc: "O tsunami devastou os portos pesqueiros e as terras agrícolas de Tohoku, destruindo incontáveis meios de subsistência. Reconstruir esses setores restaurará a base econômica da região e garantirá um abastecimento alimentar estável. Esse esforço é vital tanto para a recuperação local quanto para a segurança nacional."
 JAP_tohoku_port: "Restaurar as Funções Portuárias de Tohoku"
 JAP_tohoku_port_desc: "O tsunami paralisou instalações portuárias e estaleiros, interrompendo a logística e o comércio marítimo. A reconstrução reviverá as indústrias regionais e reabrirá rotas nacionais e internacionais essenciais. Recuperar esses portões é fundamental para a recuperação econômica mais ampla do Japão."
 JAP_power_supply: "Estabilização do Fornecimento de Energia"
 JAP_power_supply_desc: "O desastre danificou muitas instalações elétricas e redes de transmissão, criando uma grave escassez de eletricidade. Devemos expandir rapidamente as fontes alternativas e reforçar a rede para garantir a estabilidade tanto dos cidadãos quanto da indústria."
 JAP_kanto_infrastructure: "Reconstruir a Infraestrutura de Kanto"
 JAP_kanto_infrastructure_desc: "O desastre infligiu graves danos à região de Kanto, particularmente ao norte, interrompendo as redes de transporte e as funções urbanas. Restaurar a infraestrutura que sustenta a área da capital é essencial para reviver a atividade econômica e manter a estabilidade nacional. Uma reconstrução rápida e bem planejada é imperativa."
 JAP_reconstruction_agency: "Criar a Agência de Reconstrução"
 JAP_reconstruction_agency_desc: "Para acelerar e coordenar a recuperação pós-desastre, o governo criará a Agência de Reconstrução. Este órgão dedicado unificará os esforços entre as autoridades centrais e locais, garantindo a implementação eficaz dos planos de recuperação."
 JAP_industrial_recovery: "Restaurar a Base Industrial"
 JAP_industrial_recovery_desc: "O desastre danificou gravemente fábricas e instalações industriais. Ao reconstruir a base industrial, podemos restaurar o emprego e acelerar a recuperação da nossa economia."
 JAP_funding_local_governments: "Apoio aos Municípios Afetados"
 JAP_funding_local_governments_desc: "Destinar recursos aos governos locais das áreas afetadas para apoiar a recuperação, reconstruir os meios de subsistência e manter os serviços públicos."
 JAP_housing_reconstruction: "Reconstruir Moradias para as Vítimas"
 JAP_housing_reconstruction_desc: "Acelerar a construção de moradias temporárias e de bairros residenciais de longo prazo, tirando as famílias desalojadas dos abrigos e dando às cidades planos claros de reassentamento permanente."
 JAP_reconstruction_completed_focus: "Reconstrução Concluída"
 JAP_reconstruction_completed_focus_desc: "Marcar a transição da reconstrução emergencial para a revitalização de longo prazo em toda Tōhoku. A infraestrutura essencial está restaurada, as indústrias voltam a funcionar e as cidades começam a passar da sobrevivência ao crescimento."
 JAP_trilateral_anti_north_korea_training: "Prontidão Trilateral na Península"
 JAP_trilateral_anti_north_korea_training_desc: "Exercícios conjuntos regulares com a Coreia do Sul e os Estados Unidos forjaram um manual comum de resposta a crises na península. Procedimentos de comando interoperáveis, treinos aéreos e navais combinados e rotinas coordenadas de defesa antimísseis garantem que qualquer provocação de Pyongyang encontre uma resposta rápida, unificada e crível."
 JAP_dprk_policy_idea: "Penetração da Política Japonesa"
 JAP_dprk_policy_idea_desc: "A nova política coreana de Tóquio abriu canais que antes não existiam. Por meio de contatos diplomáticos, intermediários de bastidores, alavancagem econômica e cultivo de inteligência, o Japão ganhou uma janela temporária para expandir sua influência no ambiente político da Coreia do Norte. A abertura é frágil e disputada, mas, por ora, a pressão e a presença japonesas pesam mais em Pyongyang do que antes."
 JAP_entrenched_demand_shortfall_idea_1: "Estagnação de Demanda Entrincheirada"
 JAP_entrenched_demand_shortfall_idea_1_desc: "Expectativas deflacionárias e ansiedade quanto ao futuro estão suprimindo o consumo das famílias, enquanto as empresas seguram o investimento diante da demanda fraca. Os salários estão estagnados, os preços mal se movem e ninguém quer ser o primeiro a gastar. A economia do Japão não está colapsando, mas está sendo drenada pela paralisia.\n-------------\nVocê pode §Gatenuar§! os efeitos deste espírito nacional usando as decisões de §Y$JAP_japanese_economy_decisions$§! para elevar o §YProgresso da Recuperação da Demanda§! a pelo menos §G30§!!"
 JAP_transparency_and_audit_reform_modifier: "Reforma de Transparência e Auditoria"
 JAP_transparency_and_audit_reform_modifier_desc: "Fortaleceremos a divulgação de informações e a gestão de registros públicos, reduzindo as oportunidades de má conduta por meio da digitalização e de auditorias independentes. Ao enfrentar o amakudari e a opacidade do financiamento político, aumentaremos a eficiência administrativa e a confiança, bem como a resiliência contra influências externas."
 JAP_protecting_human_rights_modifier: "$JAP_protecting_human_rights$"
 JAP_protecting_human_rights_modifier_desc: "$JAP_protecting_human_rights_desc$"
 JAP_worker_protection_modifier: "Proteção ao Trabalhador"
 JAP_worker_protection_modifier_desc: "Protegeremos a subsistência e a segurança dos trabalhadores no local de trabalho, criando condições que permitam às pessoas continuar trabalhando a longo prazo. Apoiando salários mais altos e melhor tratamento e aliviando a insegurança econômica, fortaleceremos a estabilidade social e os alicerces da indústria."
 JAP_redistribution_modifier: "$JAP_redistribution$"
 JAP_redistribution_modifier_desc: "$JAP_redistribution_desc$"
 JAP_prioritizing_order_modifier: "$JAP_prioritizing_order$"
 JAP_prioritizing_order_modifier_desc: "$JAP_prioritizing_order_desc$"
 JAP_strengthening_cabinet_modifier: "$JAP_strengthening_cabinet$"
 JAP_strengthening_cabinet_modifier_desc: "$JAP_strengthening_cabinet_desc$"
 JAP_regulatory_reform_modifier: "Reforma Regulatória e Estratégia de Crescimento"
 JAP_regulatory_reform_modifier_desc: "Fortaleceremos a competitividade nacional e migraremos para um sistema capaz de sustentar um crescimento estável. Reduzindo as restrições à atividade empresarial, aproveitaremos o dinamismo do setor privado para impulsionar a indústria e o emprego."
 JAP_patriotic_education_modifier: "$JAP_patriotic_education$"
 JAP_patriotic_education_modifier_desc: "$JAP_patriotic_education_desc$"
 JAP_jsdf_international_missions_idea1a: "Base Institucional para Missões de Cooperação Internacional"
 JAP_jsdf_international_missions_idea1a_desc: "O desenvolvimento do arcabouço legal e dos padrões operacionais necessários às missões de cooperação internacional avançou. Com os procedimentos de desdobramento no exterior e os padrões de resposta durante as missões se tornando mais claros, a estabilidade das operações das forças e a consistência das decisões no local estão melhorando."
 JAP_constitutional_debate_idea: "Debate Constitucional em Escalada"
 JAP_constitutional_debate_idea_desc: "Uma grande mudança na política de segurança abalou pressupostos antigos sobre a ordem do pós-guerra. Embora cresça o apoio ao fortalecimento da defesa nacional, a oposição dos preocupados com o recuo do pacifismo continua forte, e o conflito na sociedade e na esfera política está se intensificando."
 JAP_f15_programe: "Programa de Modernização do F-15"
 JAP_submarine_modernization_idea: "Programa de Modernização de Submarinos"
 JAP_carrier_aviation: "Restauração dos Porta-Aviões"
 JAP_keen_sword_operation_idea: "Exercícios Keen Sword"
 JAP_defense_technology_agency1: "Agência de Tecnologia de Defesa Nippon"
 JAP_defense_technology_agency1_desc: "A Agência de Tecnologia de Defesa Nippon coordena pesquisa, desenvolvimento e aquisições entre a indústria, a academia e as forças armadas. Ao unificar projetos avançados sob uma única visão estratégica, o Japão acelera a inovação, reduz a duplicação e garante que tecnologias de ponta cheguem mais rápido às unidades da linha de frente."
 JAP_diplomacy_modifier: "Diplomacia do Japão"
 JAP_diplomacy_modifier_desc: "O Japão dá ênfase aos laços bilaterais com nações-chave, ampliando a cooperação em áreas como economia, segurança e cultura. Por meio de parcerias pragmáticas e baseadas em interesses, o Japão fortalece sua presença no cenário global."
 JAP_chiang_mai_initiative: "Iniciativa de Chiang Mai"
 JAP_chiang_mai_initiative_desc: "Com a expansão dos acordos de swap cambial com o Japão, os estados-membros da ASEAN fortalecem sua resiliência a crises financeiras, reforçando a estabilidade econômica e a autonomia."
 JAP_quantitative_oda_idea: "Investimento Japonês em Infraestrutura via APD"
 JAP_quantitative_oda_idea_desc: "A Assistência Oficial ao Desenvolvimento do Japão acelerou o desenvolvimento de infraestrutura como transportes, portos e eletricidade. Esse apoio serve de base vital para o crescimento econômico da nossa nação."
 JAP_qualitative_oda_idea: "APD Japonesa para Capital Humano e Inovação"
 JAP_qualitative_oda_idea_desc: "A cooperação com o Japão trouxe progressos significativos em educação, desenvolvimento de recursos humanos e pesquisa. Fortalecer a capacidade de empresas e instituições locais abre caminho para o desenvolvimento sustentável."
 JAP_security_south_china_sea_idea: "Engajamento Japonês na Estabilidade Marítima"
 JAP_security_south_china_sea_idea_desc: "O engajamento neutro do Japão na segurança marítima do Mar da China Meridional ajudou a aliviar as tensões regionais e a proteger a liberdade de navegação. Ele serve como uma presença estabilizadora confiável para a nossa região."
 JAP_jap_education: "Programa de Intercâmbio Educacional Japão-EUA"
 JAP_jap_education_desc: "Um programa educacional híbrido, que combina a disciplina do Japão com o espírito empreendedor dos EUA, está sendo testado. Esse aprendizado mútuo de pontos fortes oferece um estímulo valioso ao desenvolvimento das futuras gerações."
 JAP_jap_education_culture: "Cooperação Cultural e Educacional Japão-EUA"
 JAP_jap_education_culture_desc: "Uma parceria mais abrangente está surgindo entre o Japão e os Estados Unidos, indo além da cultura pop e das tecnologias avançadas. O desenvolvimento de recursos humanos se aprofundou com a fusão da educação focada em disciplina do Japão e do ethos criativo dos EUA. A sinergia entre afinidade cultural e colaboração científica fomenta tanto a estabilidade social quanto o impulso à inovação."
 JAP_dual_use_idea: "Cooperação em Pesquisa de Uso Duplo Japão-EUA"
 JAP_dual_use_idea_desc: "A cooperação entre o Japão e os Estados Unidos em tecnologias de uso duplo está sendo ampliada. O desenvolvimento acelerado e a troca de conhecimentos prometem maior competitividade futura nos campos civil e militar."
 JAP_disaster_countermeasure_cooperation_idea: "Maior Resiliência a Desastres por Meio da Cooperação"
 JAP_disaster_countermeasure_cooperation_idea_desc: "Por meio da cooperação com o Japão na resposta a desastres, Taiwan fortaleceu significativamente sua capacidade de lidar com emergências. Espera-se que o intercâmbio de conhecimento e os programas de treinamento conjunto reduzam os danos e acelerem a recuperação."
 JAP_tai_high_technology_idea: "Parceria Japão-Taiwan em Tecnologia Avançada"
 JAP_tai_high_technology_idea_desc: "A pesquisa conjunta com o Japão está acelerando a inovação nos setores de tecnologia civil de Taiwan. Recursos de pesquisa compartilhados e a colaboração internacional estão aumentando a competitividade industrial."
 JAP_tai_international_student_idea: "Intercâmbio de Nova Geração com o Japão"
 JAP_tai_international_student_idea_desc: "A ampliação das oportunidades de estudo no Japão permite que mais estudantes taiwaneses adquiram experiências acadêmicas diversas. Isso fomenta a formação de futuros líderes nas relações Japão-Taiwan e amplia as perspectivas internacionais."
 JAP_chi_kor_intellectual_platform: "Plataforma de Diálogo sobre a Memória do Leste Asiático"
 JAP_chi_kor_intellectual_platform_desc: "Com o apoio das Nações Unidas, o Japão, a China e a Coreia do Sul lançaram uma plataforma intelectual conjunta para preservar memórias históricas e aprofundar o entendimento mútuo. Esta iniciativa marca um novo marco internacional que equilibra a reflexão histórica com a cooperação voltada ao futuro."
 JAP_chi_trade_support_idea: "Harmonização Internacional dos Sistemas Comerciais"
 JAP_chi_trade_support_idea_desc: "Com o apoio técnico e institucional do Japão, a China avança no desenvolvimento de sistemas comerciais alinhados aos padrões internacionais. Reformas como procedimentos aduaneiros simplificados e revisões legais contribuem para a modernização institucional."
 JAP_chi_advancement_companies_idea: "Maior Integração Industrial com o Japão"
 JAP_chi_advancement_companies_idea_desc: "A expansão mútua de empresas japonesas e chinesas está racionalizando as redes de produção e aprofundando a interdependência econômica entre as duas nações."
 JAP_chi_kanji_idea: "Cooperação na Esfera Cultural Sino-Japonesa"
 JAP_chi_kanji_idea_desc: "Por meio da cooperação cultural com o Japão, a China fortalece os intercâmbios dentro da \"Esfera Cultural dos Caracteres Chineses\" compartilhada. Isso contribui para um maior soft power e uma imagem internacional mais favorável."
 JAP_chi_temple_idea: "Preservação Conjunta do Patrimônio Budista"
 JAP_chi_temple_idea_desc: "Ao preservar e restaurar em conjunto com o Japão templos budistas e bens culturais, a China reafirma o valor de seu patrimônio religioso e promove o turismo."
 JAP_kor_accelerator_idea: "Cooperação da Aceleradora Tóquio-Seul"
 JAP_kor_accelerator_idea_desc: "A estrutura de apoio a startups criada em conjunto por Seul e Tóquio está fomentando a próxima geração de empreendedores e fortalecendo a cooperação tecnológica entre as cidades."
 JAP_kor_local_companies_idea: "Programa de Intercâmbio de Empresas Locais"
 JAP_kor_local_companies_idea_desc: "Por meio do intercâmbio entre empresas locais da Coreia e do Japão, as economias regionais se revitalizam e novas redes industriais do setor privado estão se formando."
 JAP_kor_aging_idea: "Força-Tarefa Conjunta sobre Sociedades em Envelhecimento"
 JAP_kor_aging_idea_desc: "Para enfrentar o desafio comum do envelhecimento populacional, foi formada uma força-tarefa conjunta de especialistas coreanos e japoneses para trocar ideias sobre políticas e aprimorar as medidas de bem-estar social."
 JAP_sov_logistics_corridor_idea: "Rede Logística Eurasiática Japão-Rússia"
 JAP_sov_logistics_corridor_idea_desc: "Por meio da cooperação com o Japão, está em andamento o desenvolvimento do corredor logístico que liga o Japão à Europa via Rússia. Melhorias de infraestrutura e a integração econômica estão aumentando a importância geopolítica da Rússia."
 JAP_sov_it_corridor_idea: "Iniciativa de Conectividade Digital Japão-Rússia"
 JAP_sov_it_corridor_idea_desc: "Com o apoio do Japão, a Rússia está expandindo sua infraestrutura de TI. A parceria Japão-Rússia visa construir um amplo corredor digital e estabelecer uma base para o intercâmbio global de informações."
 JAP_territorial_disputes1: "Ganhos Políticos das Negociações Territoriais"
 JAP_territorial_disputes1_desc: "Com certo grau de progresso nas antigas questões territoriais, as tensões nas águas vizinhas diminuíram um pouco e uma sensação de alívio também se espalha na opinião pública interna. A redução da incerteza diplomática também tem efeito positivo sobre a atividade econômica nas regiões costeiras, sustentando a base de arrecadação ligada à pesca por meio da melhoria das condições de operação."
 JAP_monarchist_shipbuilding_idea: "Impulso à Construção Naval Imperial"
 JAP_monarchist_shipbuilding_idea_desc: "O Império retornará ao mar como seu domínio natural. Sob um Impulso à Construção Naval Imperial, os estaleiros são ampliados, os contratos são centralizados e a produção é levada a um ritmo sustentado de tempo de guerra até que a frota esteja à altura da ambição do Japão. Lançados em nome do Imperador, os mares pertencem ao Império!"
 JAP_monarchist_shipbuilding_idea_tt: "§RErste espírito nacional será removido quando você for§! §Y$naval_power_of_the_continent$§!"
 JAP_restoring_imperial_household_idea: "Restaurando a Casa Imperial"
 JAP_restoring_imperial_household_idea_desc: "A Casa Imperial está sendo reconstruída como uma instituição de Estado, não como uma corte decorativa. Suas repartições são ampliadas, seus protocolos formalizados e sua influência restaurada por nomeações que ligam ministérios e sociedade mais estreitamente ao Trono. A casa do Imperador voltará a funcionar como o motor silencioso da coesão e da direção nacionais."
 JAP_once_millennium_disaster: "Um Desastre que Ocorre Uma Vez a Cada Milênio"
 JAP_once_millennium_disaster_desc: "O Grande Terremoto do Leste do Japão, de 11 de março de 2011, é um dos desastres mais devastadores da história japonesa moderna. O terremoto e o tsunami destruíram em um instante a infraestrutura, as indústrias e os meios de subsistência, mergulhando a nação em grave turbulência. O caminho da recuperação será longo e árduo, exigindo enormes recursos e tempo."
 JAP_scars_earthquake_and_tsunami: "Cicatrizes do Terremoto e do Tsunami"
 JAP_scars_earthquake_and_tsunami_desc: "O Grande Terremoto do Leste do Japão e seu devastador tsunami infligiram danos catastróficos às cidades, portos e comunidades costeiras da região de Tohoku. A infraestrutura e as instalações industriais foram destruídas, minando gravemente a produtividade local e os meios de subsistência. A recuperação levará anos e exigirá imensos recursos e esforço."
 JAP_scars_earthquake: "Cicatrizes do Terremoto"
 JAP_scars_earthquake_desc: "Os tremores do Grande Terremoto do Leste do Japão também atingiram a região de Kanto, afetando fortemente as redes de transporte e interrompendo partes da base industrial. Até a área da capital sofreu uma queda temporária na atividade econômica. Embora a devastação não seja tão grave quanto em Tohoku, a recuperação ainda exige tempo e esforço consideráveis."
 JAP_focus_renewable_energy_idea: "Foco em Energia Renovável"
 JAP_focus_renewable_energy_idea_desc: "As preocupações com a segurança nuclear nos levaram a priorizar a energia renovável, fortalecendo nossa independência de longo prazo na geração de energia."
 JAP_focus_energy_TT: "Despesas Adicionais: §R0,01%§! do PIB"
 JAP_focus_thermal_power_idea: "Foco em Usinas de Combustível Fóssil"
 JAP_focus_thermal_power_idea_desc: "Optar por usinas de combustível fóssil garante produção estável e fornecimento imediato, especialmente enquanto a segurança nuclear continuar sendo uma preocupação nacional."
 JAP_anxiety_nuclear_power: "Ansiedade Pública com a Energia Nuclear"
 JAP_anxiety_nuclear_power_desc: "O choque do acidente de Fukushima Daiichi espalhou medo e desconfiança em relação à energia nuclear por toda a sociedade. A oposição pública e os atrasos processuais estão paralisando novas construções, enquanto a turbulência política continua."
 JAP_shut_down_nuclear_plants: "Desligar Todas as Usinas Nucleares"
 JAP_shut_down_nuclear_plants_desc: "Ao decidir desligar a energia nuclear, o governo respondeu diretamente aos temores do público. A oposição persiste, mas a decisão é amplamente vista como uma priorização da segurança, e a agitação social está diminuindo gradualmente."
 JAP_nuclear_strict_examination: "Padrões de Segurança Nuclear Endurecidos"
 JAP_nuclear_strict_examination_desc: "Em resposta ao acidente, as regulamentações e revisões foram drasticamente fortalecidas. Novas construções e reinícios agora exigem medidas adicionais e procedimentos demorados, tornando a energia nuclear mais lenta para expandir e menos capaz de operar nos níveis anteriores."
 JAP_continue_nuclear_plants: "Continuar a Geração de Energia Nuclear"
 JAP_continue_nuclear_plants_desc: "O governo optou por manter a energia nuclear, mas a memória do acidente continua viva. A desconfiança e a reação adversa quanto à segurança persistem, alimentando conflitos políticos que minam a estabilidade interna."
 JAP_crown_centered: "Ressurgimento do Pensamento Centrado na Coroa"
 JAP_crown_centered_desc: "Após as declarações do Primeiro-Ministro Mori, a retórica tradicionalista e monarquista começou a ganhar impulso em alguns círculos. Como o governo demonstrou disposição de aproveitar essa tendência, um movimento que busca reavaliar a Casa Imperial como princípio central do Estado começou a adquirir uma influência política limitada, porém crescente."
 JAP_monarchist_modifier: "Governo Imperial"
 JAP_monarchist_modifier_desc: "O Trono voltou a comandar, e o Estado agora se move por mandato imperial, e não por barganhas partidárias. Ministérios, órgãos de segurança e indústria estão alinhados sob uma única doutrina que trata o Imperador como fonte de legitimidade e direção."
 JAP_airforce_modifier: "[JAP_airforce_name]"
 JAP_article9_modifier: "Artigo 9"
 JAP_defense_industry: "Rede de Defesa Kyōdō"
 JAP_defense_industry_2: "Rede de Defesa Kyōdō"
 JAP_landforce_modifier: "[JAP_landforces_name]"
 JAP_navy_modifier: "[JAP_navy_name]"
 JAP_navy_modifier_2: "[JAP_navy_name]"
 JAP_japanese_tech_agency_tt: "[JAP_defense_technology_idea_desc]\n"
 JAP_military_decision_category: "Militar [JAP.GetAdjectiveCap]"
 JAP_consolidate_national_defense_framework_mission: "Consolidar o Marco de Defesa Nacional"
 JAP_consolidate_national_defense_framework_mission_desc: "A transição para uma postura de defesa mais ampla criou incerteza nas estruturas de comando, nos processos de planejamento e nas responsabilidades legais. Ao consolidar o marco de defesa nacional, o Japão restaura gradualmente a coerência e reduz a perturbação causada pela reforma.\n\n$JAP_article9_mission_explainer_tt$"
 JAP_modernize_joint_command_mission: "Modernizar as Estruturas de Comando Conjunto"
 JAP_modernize_joint_command_mission_desc: "Integrar os domínios terrestre, naval, aéreo e emergentes em um comando conjunto unificado exige tempo, treinamento e mudança organizacional. À medida que novos procedimentos são testados e refinados, o atrito diminui lentamente e a eficácia das forças armadas do Japão melhora.\n\n$JAP_article9_mission_explainer_tt$"
 JAP_asteroid_mining_light_operation: "Levantamento Celeste Leve"
 JAP_asteroid_mining_light_operation_desc: "O Japão realiza um levantamento de asteroides em pequena escala, invocando a orientação dos espíritos ancestrais enquanto sondas vasculham os céus em busca de minérios aproveitáveis."
 JAP_asteroid_mining_medium_operation: "Missão de Extração Divina Média"
 JAP_asteroid_mining_medium_operation_desc: "Uma expedição maior se aventura mais fundo no cinturão de asteroides, recorrendo ao simbolismo mítico para inspirar a missão enquanto o Japão busca valiosos metais fora do planeta."
 JAP_asteroid_mining_heavy_operation: "Expedição de Mineração Celestial Pesada"
 JAP_asteroid_mining_heavy_operation_desc: "Um esforço de mineração de asteroides em larga escala é lançado, ecoando contos de forjas celestiais enquanto o Japão se empenha em recuperar ricos recursos celestes."
 JAP_mars_mission_program_mission: "Colônia em Marte Estabelecida"
 JAP_restore_guarantee: "Solicitar a Restauração das Garantias de Segurança dos EUA"
 JAP_restore_guarantee_desc: "Com as tensões regionais em alta e as dúvidas sobre nossa segurança de longo prazo crescendo, setores do governo argumentam que devemos buscar uma garantia de segurança renovada e explícita dos Estados Unidos. Fazê-lo provavelmente exigirá concessões políticas em matéria de política de defesa e na interpretação do Artigo 9, mas pode ser o preço da estabilidade estratégica."
 JAP_remove_american_blockade: "Solicitar o Fim da Pressão Naval dos EUA"
 JAP_remove_american_blockade_desc: "A presença naval americana reforçada em torno de nossas principais rotas marítimas tornou-se fonte de tensão dentro e fora do país. Os canais diplomáticos permanecem abertos para negociar a redução ou o fim dessa pressão, mas Washington quase certamente esperará, em troca, compromissos de segurança mais profundos e novos ajustes em nossa posição sobre o Artigo 9."
 JAP_restore_trade_relations: "Buscar a Normalização do Comércio com os Estados Unidos"
 JAP_restore_trade_relations_desc: "Tarifas e medidas comerciais direcionadas impostas pelos Estados Unidos estão prejudicando nossos exportadores e corroendo a confiança na aliança. Ao tratar diretamente com Washington, talvez consigamos normalizar as relações econômicas, mas qualquer alívio significativo provavelmente estará ligado à renovação da cooperação em segurança e a uma interpretação mais ampla do Artigo 9."
 JAP_chinese_agression_five: "Agressão Chinesa Crescente"
 JAP_chinese_agression_five_desc: "As recentes ações chinesas na região despertaram preocupação entre nossos planejadores de defesa. Embora a situação ainda não tenha atingido um limiar crítico, a tendência é inequívoca: Pequim está escalando sua postura de forma constante. Os formuladores de políticas alertam que o Japão deve se preparar para a possibilidade de novos desdobramentos desestabilizadores."
 JAP_chinese_agression_ten: "Pressão Chinesa em Escalada"
 JAP_chinese_agression_ten_desc: "A China intensificou sua pressão militar e geopolítica na região. Incursões de patrulha, desafios ao espaço aéreo e retórica agressiva aumentaram significativamente. A frequência crescente desses incidentes sugere uma estratégia deliberada de testar a determinação do Japão e remodelar o equilíbrio regional."
 JAP_chinese_agression_twelve: "Atividades Chinesas Alarmantes"
 JAP_chinese_agression_twelve_desc: "As ações mais recentes de Pequim marcam uma escalada preocupante. Relatórios de inteligência indicam maiores desdobramentos navais, exercícios militares perto de águas disputadas e mensagens políticas dirigidas diretamente ao Japão. A situação está se tornando cada vez mais instável, e os pedidos por uma resposta nacional mais forte estão ficando mais altos."
 JAP_chinese_agression_fourteen: "Graves Provocações Chinesas"
 JAP_chinese_agression_fourteen_desc: "A China deu vários passos agressivos que vão além da pressão rotineira. Ativos estratégicos foram posicionados perto do território japonês, e as incursões em nossas águas vizinhas atingiram uma nova frequência. Autoridades de defesa alertam que o Japão pode precisar reconsiderar elementos de sua postura de segurança."
 JAP_chinese_agression_sixteen: "Perigosa Escalada Chinesa"
 JAP_chinese_agression_sixteen_desc: "A situação regional está se tornando cada vez mais perigosa. As manobras militares chinesas agora parecem projetadas para intimidar o Japão diretamente, e os canais de propaganda em Pequim adotaram um tom mais duro. A possibilidade de uma crise desencadeada por erro de cálculo está aumentando drasticamente."
 JAP_chinese_agression_eighteen: "Pressão Militar Chinesa Crítica"
 JAP_chinese_agression_eighteen_desc: "A postura agressiva da China chegou a um ponto crítico. Zonas marítimas-chave estão sob pressão constante, as incursões aéreas estão em níveis sem precedentes e os parceiros regionais estão soando o alarme. Formuladores de políticas em Tóquio argumentam que o Japão deve reavaliar sua estratégia de defesa, incluindo a interpretação do Artigo 9."
 JAP_chinese_agression_twenty: "Grave Crise Regional: A Agressão Chinesa Atinge o Auge"
 JAP_chinese_agression_twenty_desc: "A situação se tornou uma crise regional em grande escala. A China realizou extensos desdobramentos militares perto do território japonês, sinalizando disposição de escalar ainda mais. A ameaça à segurança nacional já não é teórica: o Japão enfrenta um desafio direto que pode forçar decisões históricas sobre sua postura militar e o papel das Forças de Autodefesa."
 JAP_world_tension_high: "Revisar a Postura de Segurança"
 JAP_world_tension_high_desc: "A crescente instabilidade global exige que o Japão reavalie suas políticas defensivas e se prepare para possíveis mudanças na ordem internacional."
 JAP_world_tension_high2: "Preparar-se para Contingências Regionais"
 JAP_world_tension_high2_desc: "O mundo está se tornando cada vez mais perigoso. O Japão deve tomar medidas concretas para garantir a segurança nacional e manter a prontidão estratégica."
 JAP_world_tension_high3: "Ativar Medidas de Segurança Nacional"
 JAP_world_tension_high3_desc: "As tensões globais atingiram um nível crítico. O Japão deve agora considerar medidas extraordinárias para salvaguardar os interesses nacionais e sustentar a estabilidade regional."
 JAP_article_nine_protests_appeal: "Responder aos Protestos Pró-Defesa"
 JAP_article_nine_protests_appeal_desc: "Protestos pró-defesa generalizados exigem capacidades militares mais fortes e uma postura de segurança mais dura. Ao atender a esses apelos e ampliar a interpretação do Artigo 9, o governo pode canalizar a pressão pública para justificar uma política de defesa nacional mais assertiva."
 JAP_article_nine_protests_appeal_tt: "A §YForça dos Protestos§! é de pelo menos §R50§!"
 JAP_article_nine_protests_appeal_tt2: "[JAP.GetName] não possui a §YLei Militar Desejada§!"
 JAP_article_nine_military_parties: "Alavancar os Partidos Pró-Militares"
 JAP_article_nine_military_parties_desc: "Partidos pró-militares dentro do governo pressionam por uma defesa nacional mais forte e uma interpretação mais ampla do Artigo 9. Ao se alinhar à agenda deles, o governo pode avançar as reformas militares e justificar um nível mais alto de prontidão de defesa."
 JAP_article_nine: "Interpretação do Artigo 9"
 JAP_article_nine_left_side: "Pacifismo Estrito"
 JAP_article_nine_level_one: "Nível I: Interpretação Pacifista"
 JAP_article_nine_level_two: "Nível II: Interpretação Defensiva"
 JAP_article_nine_level_three: "Nível III: Defesa Cooperativa"
 JAP_article_nine_level_four: "Nível IV: Autodefesa Coletiva"
 JAP_article_nine_level_five: "Nível V: Papel Militar Ampliado"
 JAP_article_nine_right_side: "Defesa Ativa"
 JAP_great_east_japan_earthquake_decision: "Caminho para a Reconstrução"
 JAP_great_east_japan_earthquake_decision_desc: "Em 11 de março de 2011, o Grande Terremoto do Leste do Japão atingiu a nação com tremores e tsunamis sem precedentes, desencadeando uma devastação nunca vista na história moderna. De Tohoku a Kanto, vastas regiões foram paralisadas, bloqueando as redes de transporte, interrompendo a atividade econômica e virando incontáveis vidas de cabeça para baixo. Comunidades e indústrias perderam seus alicerces, e a nação como um todo foi mergulhada em turbulência e incerteza.\n\nO desastre não foi apenas de destruição física; abriu uma profunda cicatriz na psique nacional e forçou a sociedade a reconsiderar seus próprios fundamentos. O Japão está agora numa encruzilhada, incumbido do imenso desafio da recuperação e da renovação. Reconstruir as regiões devastadas, restaurar as indústrias e reviver a vida e os laços de seu povo são responsabilidades inescapáveis do Estado.\n\nEsse esforço, conhecido como 'Caminho para a Reconstrução', será longo e árduo. Mas só superando tal adversidade o Japão poderá forjar um futuro renovado."
 JAP_tohoku_infrastructure_decision: "Reconstrução da Infraestrutura de Tohoku"
 JAP_tohoku_infrastructure_decision_desc: "Passo a passo, devemos reconstruir a infraestrutura devastada pelo terremoto. Restaurar estradas, ferrovias e portos, os alicerces das economias regionais e da vida cotidiana, é o primeiro passo para a recuperação."
 JAP_kanto_infrastructure_decision: "Reconstrução da Infraestrutura de Kanto"
 JAP_kanto_infrastructure_decision_desc: "Passo a passo, devemos reconstruir a infraestrutura devastada pelo terremoto. Restaurar estradas, ferrovias e portos, os alicerces das economias regionais e da vida cotidiana, é o primeiro passo para a recuperação."
 JAP_tohoku_communication_decision: "Restaurar as Telecomunicações em Tohoku"
 JAP_tohoku_communication_decision_desc: "A infraestrutura de telecomunicações devastada pelo desastre é vital para a recuperação e para a vida cotidiana. Passo a passo, a restauração deve avançar para reconectar as comunidades e revitalizar a economia."
 JAP_kanto_communication_decision: "Restaurar as Telecomunicações em Kanto"
 JAP_kanto_communication_decision_desc: "A infraestrutura de telecomunicações devastada pelo desastre é vital para a recuperação e para a vida cotidiana. Passo a passo, a restauração deve avançar para reconectar as comunidades e revitalizar a economia."
 JAP_tohoku_industrial_recovery_decision: "Revitalizar a Indústria em Tohoku"
 JAP_tohoku_industrial_recovery_decision_desc: "Reviver as indústrias locais paralisadas pelo desastre é essencial para a recuperação econômica. Restaurar as indústrias civis ajudará a criar empregos e a fortalecer a base da produção."
 JAP_kanto_industrial_recovery_decision: "Revitalizar a Indústria em Kanto"
 JAP_kanto_industrial_recovery_decision_desc: "Reviver as indústrias locais paralisadas pelo desastre é essencial para a recuperação econômica. Restaurar as indústrias civis ajudará a criar empregos e a fortalecer a base da produção."
 JAP_domestic_policy_decision: "Decisões de Política Interna [JAP.GetFlag][JAP.GetAdjective]"
 JAP_focus_renewable_energy_decision: "Foco em Energia Renovável"
 JAP_focus_renewable_energy_decision_desc: "Diante da crescente preocupação com a segurança da energia nuclear, maiores investimentos em energia solar, eólica e outras fontes renováveis oferecem um caminho para diversificar a energia e reduzir a dependência de combustíveis importados."
 JAP_focus_thermal_power_decision: "Foco em Usinas de Combustível Fóssil"
 JAP_focus_thermal_power_decision_desc: "Em meio às preocupações com a segurança nuclear, expandir as usinas a carvão, petróleo e gás natural oferece uma fonte de eletricidade mais imediata e confiável para a nação."
 JAP_saudi_aramco_crude_storage: "Armazenamento de Petróleo da Saudi Aramco"
 JAP_saudi_aramco_crude_storage_desc: "Garantir armazenamento dedicado de petróleo bruto por meio da Saudi Aramco para estabilizar o suprimento e reduzir a exposição a choques súbitos de mercado. Ancorando o acesso de longo prazo e a entrega previsível, o Japão compra fôlego estratégico."
 JAP_overseas_upstream_equity: "Comprar os Poços na Fonte"
 JAP_overseas_upstream_equity_desc: "A INPEX, principal exploradora da nação, e os financiadores estatais da JOGMEC adquirem participações em campos de Abu Dhabi ao Extremo Oriente Russo, blindando o país dos caprichos do mercado à vista. Cada barril extraído de um poço de propriedade japonesa é um barril que nenhum rival pode reter. A propriedade é o suprimento mais seguro."
 JAP_kosaka_tsl_furnace: "Expansão do Forno TSL de Kosaka"
 JAP_kosaka_tsl_furnace_desc: "O processamento é tão estratégico quanto a extração. Ampliaremos a capacidade do forno TSL de Kosaka para tratar sucata complexa e concentrados mistos, recuperando metais críticos que de outra forma seriam perdidos."
 JAP_green_ship_recycling: "Reciclagem Verde de Navios"
 JAP_green_ship_recycling_desc: "Uma frota não é apenas construída, ela é desmontada, e o aço deve retornar à nação. Estabeleceremos padrões e capacidade de reciclagem verde de navios para recuperar materiais de alto valor de forma segura e eficiente. Cada casco aposentado se tornará recurso para o próximo."
 JAP_bibi_world_decision: "Construção da Fundição Rapidus IIM-1 'Bibi World'"
 JAP_bibi_world_decision_desc: "Acelerar a construção da fundição Rapidus IIM-1 'Bibi World' para garantir capacidade de semicondutores de nova geração em solo japonês."
 JAP_yufutsu_oil_expansion_decision: "Expansão do Petróleo de Yufutsu"
 JAP_yufutsu_oil_expansion_decision_desc: "Expandir o campo de Yufutsu para fortalecer o suprimento nacional e reduzir a exposição a perturbações externas."
 JAP_toray_expansion_program_decision: "Programa de Expansão da Toray"
 JAP_toray_expansion_program_decision_desc: "Ampliar a produção de materiais avançados da Toray para fortalecer a base industrial do Japão onde mais importa."
 JAP_teijin_aerospace_prepreg_decision: "Prepreg Aeroespacial da Teijin"
 JAP_teijin_aerospace_prepreg_decision_desc: "Expandir a capacidade de prepreg de grau aeroespacial da Teijin para garantir a espinha dorsal de compósitos das fuselagens modernas e dos sistemas de defesa de ponta."
 JAP_demand_south_kuril: "Exigir as Ilhas Curilas do Sul"
 JAP_demand_south_kuril_desc: "Tóquio emitirá uma exigência formal pela devolução das Ilhas Curilas do Sul. Moscou pode ceder para evitar a escalada, ou recusar e arriscar uma crise."
 JAP_demand_north_kuril: "Exigir as Ilhas Curilas do Norte"
 JAP_demand_north_kuril_desc: "O Japão exigirá a devolução das Ilhas Curilas do Norte como parte de uma agenda mais ampla de restauração imperial. Uma recusa pode ser usada para justificar uma nova escalada."
 JAP_demand_sakhalin: "Exigir Sacalina"
 JAP_demand_sakhalin_desc: "O Japão exigirá a devolução de Sacalina. Se o governo soviético rejeitar a exigência, Tóquio terá de escolher entre contenção, conflito limitado ou guerra."
 JAP_peaceout_russia: "Encerrar a Guerra com a Rússia"
 JAP_peaceout_russia_desc: "Forçaremos um acordo com a Rússia para encerrar a guerra em nossos termos e assegurar o que conquistamos. É uma decisão política tanto quanto militar, fixando a nova realidade em tratados antes que Moscou possa se reagrupar. Se a Rússia aceitar, os combates terminam e o mapa muda para sempre."
 JAP_claiming_south_korea: "Afirmar uma Reivindicação sobre a Coreia"
 JAP_claiming_south_korea_desc: "Enquadraremos a Coreia como uma questão de segurança japonesa e de prerrogativa histórica, transformando a ambiguidade em uma reivindicação explícita. Isso não é um gesto, é uma declaração de que nossa fronteira estratégica não termina no Estreito de Tsushima. Feita a reivindicação, toda negociação futura começará em nossos termos."
 JAP_claiming_north_korea: "Definir a Questão do Norte da Coreia"
 JAP_claiming_north_korea_desc: "O regime de Pyongyang não é um vizinho, é uma crise permanente que ameaça nossos mares e nossas cidades. Formalizaremos a reivindicação do Japão de moldar o futuro da península do norte, tratando-a como uma questão de segurança que não pode ser deixada a outros. Uma vez declarada, o Norte será um problema a ser administrado em termos japoneses."
 JAP_claiming_taiwan: "Reafirmar Nosso Mandato sobre Taiwan"
 JAP_claiming_taiwan_desc: "Taiwan está na dobradiça da primeira cadeia de ilhas e na garganta da nossa segurança marítima. Reafirmaremos um mandato japonês sobre a ilha, tratando seu status como uma necessidade estratégica, e não como um assunto a ser decidido por potências distantes. Uma vez declarado, o Japão tratará o futuro de Taiwan como inseparável do seu próprio."
 JAP_claiming_malaysia: "Reivindicar a Malásia"
 JAP_claiming_malaysia_desc: "A Malásia fica sobre estreitos e rotas de suprimento fundamentais que decidem o fluxo do comércio e do combustível da região. Faremos uma reivindicação formal e trataremos seu status como uma questão de segurança japonesa e de ordem marítima. Uma vez declarado, toda negociação começará com o nosso mandato sobre a mesa."
 JAP_claiming_indonesia: "Fincar um Mandato na Indonésia"
 JAP_claiming_indonesia_desc: "A Indonésia controla as ilhas e os pontos de estrangulamento que unem os oceanos Índico e Pacífico. Fincaremos um mandato sobre o arquipélago, tratando suas rotas marítimas e recursos como necessidades estratégicas do Japão. Se a região terá ordem, ela será imposta a partir de Tóquio."
 JAP_claiming_vietnam: "Declarar Nosso Interesse no Vietnã"
 JAP_claiming_vietnam_desc: "O Vietnã ancora a borda do Mar da China Meridional e oferece bases capazes de moldar o equilíbrio de todo o litoral. Declararemos a reivindicação de interesse do Japão e deixaremos claro que seu alinhamento não será decidido sem nós. A influência começa com certeza, e a certeza começa com uma reivindicação."
 JAP_claiming_cambodia: "Estender a Esfera ao Camboja"
 JAP_claiming_cambodia_desc: "O Camboja é pequeno, mas a geografia o torna um corredor, uma zona-tampão e uma alavanca no Sudeste Asiático continental. Estenderemos nossa reivindicação e vincularemos seu futuro à esfera japonesa mais ampla. O que parece insignificante no mapa pode decidir a estabilidade da região."
 JAP_claiming_laos: "Reivindicar o Interior do Mekong"
 JAP_claiming_laos_desc: "O Laos controla rotas terrestres, rios e a profundidade silenciosa atrás do litoral. Reivindicaremos o interior do Mekong como parte da nossa segurança continental, garantindo que rivais não o usem como porta dos fundos para a nossa esfera. Controle não é apenas portos, são corredores."
 JAP_claiming_australia: "Declarar uma Reivindicação sobre a Austrália"
 JAP_claiming_australia_desc: "A Austrália é a âncora sul do Pacífico, um continente capaz de abrigar frotas, poder aéreo e a logística de uma guerra longa. Declararemos uma reivindicação e sinalizaremos que os acessos ao sul não ficarão fora do alcance estratégico do Japão. Se o sul estiver garantido, o oceano virá em seguida."
 JAP_claiming_new_zealand: "Reivindicar os Postos Avançados do Sul"
 JAP_claiming_new_zealand_desc: "A Nova Zelândia pode ser distante, mas fica em rotas que importam quando o Pacífico se torna disputado. Reivindicaremos os postos avançados do sul e negaremos aos rivais uma retaguarda segura além do nosso alcance. Até ilhas distantes viram armas quando outros as controlam."
 JAP_claiming_myanmar: "Afirmar o Controle do Portão do Irauadi"
 JAP_claiming_myanmar_desc: "Mianmar é uma ponte terrestre entre oceanos e uma porta de entrada para o interior da região. Faremos uma reivindicação e trataremos seus portos, corredores e aeródromos como ativos estratégicos da esfera japonesa. Quem controla o portão decide quem entra."
 JAP_demand_palau: "Exigir Palau"
 JAP_demand_palau_desc: "Palau é um pequeno arquipélago com grande peso no planejamento naval, oferecendo ancoragem, vigilância e alcance. Exigiremos sua submissão à autoridade japonesa e o garantiremos como posto avançado da nossa ordem no Pacífico. O mapa é escrito com bases, não com discursos."
 JAP_demand_micronesia: "Exigir a Micronésia"
 JAP_demand_micronesia_desc: "A Micronésia se estende pelo Pacífico central como pontos de apoio para frotas e aeronaves. Exigiremos seu controle para garantir as rotas de trânsito e negar aos rivais áreas de concentração em nosso oceano. Uma vez tomadas, essas ilhas transformam distância em vantagem."
 JAP_demand_nauru: "Exigir Nauru"
 JAP_demand_nauru_desc: "Nauru é minúscula, mas ilhas assim decidem a cobertura de vigilância e o acesso por águas vastas. Exigiremos seu alinhamento com o Japão e a incorporaremos à nossa rede de postos avançados. Na era marítima, nenhuma ilha é irrelevante."
 JAP_demand_kiribati: "Exigir Quiribati"
 JAP_demand_kiribati_desc: "Quiribati se estende por acessos-chave que podem apoiar reconhecimento, reabastecimento e interdição. Exigiremos sua submissão à direção japonesa e garantiremos as ilhas como uma cadeia em nosso perímetro mais amplo. O Pacífico será organizado, um elo de cada vez."
 JAP_demand_marshall_islands: "Exigir as Ilhas Marshall"
 JAP_demand_marshall_islands_desc: "As Ilhas Marshall oferecem espaço para aeródromos, logística e controle sobre as rotas do Pacífico central. Exigiremos sua transferência para a esfera do Japão e as transformaremos em pontos de apoio fortificados para operações de frota. Quem controla esses atóis pode moldar um teatro inteiro."
 JAP_demand_tuvalu: "Exigir Tuvalu"
 JAP_demand_tuvalu_desc: "Tuvalu oferece pouca terra, mas oferece presença, e a presença decide o controle do mar. Exigiremos o alinhamento de Tuvalu e o garantiremos como posto de escuta e ponto de passagem no Pacífico Sul. Até as menores ilhas podem ancorar um perímetro."
 JAP_demand_solomon_islands: "Exigir as Ilhas Salomão"
 JAP_demand_solomon_islands_desc: "As Ilhas Salomão são uma barreira natural e área de concentração no Pacífico sudoeste, ideais para aeródromos e cobertura naval. Exigiremos sua submissão ao Japão e bloquearemos as rotas que passam por elas. Controle aqui significa controle do movimento."
 JAP_demand_guinea: "Exigir a Nova Guiné"
 JAP_demand_guinea_desc: "A Nova Guiné é um bastião de porte continental que domina os acessos entre o Sudeste Asiático e o Pacífico. Exigiremos sua transferência e a transformaremos em uma fortaleza de poder aéreo, logística e defesa avançada. Com a Nova Guiné garantida, o teatro do sul se curvará à nossa vontade."
 JAP_demand_vanuatu: "Exigir Vanuatu"
 JAP_demand_vanuatu_desc: "Vanuatu fica em linhas importantes para o reabastecimento e o alcance ao Pacífico sudoeste. Exigiremos seu alinhamento com o Japão e o integraremos à nossa rede de bases. Uma cadeia de ilhas vira uma muralha quando está unida."
 JAP_demand_fiji: "Exigir Fiji"
 JAP_demand_fiji_desc: "Fiji é um polo central no Pacífico Sul, capaz de apoiar a logística de frotas e operações aéreas num amplo arco. Exigiremos sua submissão ao Japão e a garantiremos como pedra angular do nosso perímetro sul. Quando Fiji for nossa, o equilíbrio da região mudará."
 JAP_demand_samoa: "Exigir Samoa"
 JAP_demand_samoa_desc: "Samoa fica em rotas que ligam o Pacífico central aos acessos do sul. Exigiremos o alinhamento de Samoa com o Japão e integraremos seus portos e aeródromos ao nosso perímetro mais amplo. Em um império oceânico, até ilhas distantes se tornam decisivas."
 JAP_demand_tonga: "Exigir Tonga"
 JAP_demand_tonga_desc: "Tonga oferece um ponto de apoio estratégico no Pacífico Sul e uma plataforma para monitorar o movimento por águas vastas. Exigiremos a submissão de Tonga à direção japonesa e a garantiremos como parte da nossa cadeia de controle ao sul. Neutralidade é um luxo que não permitiremos em nossas rotas marítimas."
 JAP_demand_american_islands: "Exigir as Ilhas Americanas"
 JAP_demand_american_islands_desc: "Ilhas em mãos americanas não são só território, são bases avançadas que projetam poder sobre o nosso oceano. Exigiremos sua transferência ou neutralização sob autoridade japonesa, negando a Washington uma área de concentração à nossa porta. Se o Pacífico deve ser ordenado, os pontos de apoio estrangeiros devem ser removidos."
 JAP_demand_french_islands: "Exigir as Ilhas Francesas"
 JAP_demand_french_islands_desc: "As ilhas francesas oferecem alcance, portos e cobertura diplomática para a presença estrangeira no Pacífico. Exigiremos sua submissão ao Japão e as incorporaremos à nossa rede de postos avançados e corredores. Nossa esfera não será perfurada por impérios distantes."
 JAP_demand_british_islands: "Exigir as Ilhas Britânicas"
 JAP_demand_british_islands_desc: "As possessões insulares britânicas são resquícios de uma ordem mais antiga, mas ainda oferecem bases e influência sobre rotas críticas. Exigiremos sua transferência para a esfera do Japão e fecharemos mais uma lacuna em nosso perímetro marítimo. O Pacífico será organizado sob uma única autoridade, a nossa."
 JAP_imperial_procurement_standardization: "Padronização das Aquisições Imperiais"
 JAP_imperial_procurement_standardization_desc: "Centralizar as regras de aquisição, padronizar componentes e impor especificações comuns às forças armadas. O objetivo é produção mais rápida, logística mais simples e menos gargalos de produção."
 JAP_zaibatsu_empowerment_charter: "Carta de Fortalecimento dos Zaibatsu"
 JAP_zaibatsu_empowerment_charter_desc: "Conceder privilégios ampliados a conglomerados industriais selecionados em troca de metas de produção vinculantes definidas pelo governo imperial."
 JAP_neighborhood_associations_system: "Sistema de Associações de Vizinhança"
 JAP_neighborhood_associations_system_desc: "Reconstruir uma rede nacional de associações locais para registrar domicílios, coordenar a distribuição e apoiar a mobilização rápida. Isso fortalece o controle social e melhora a capacidade de resposta do Estado."
 JAP_state_rites_restoration: "Restauração dos Ritos de Estado"
 JAP_state_rites_restoration_desc: "Restaurar as cerimônias de Estado e os ritos públicos como pilar central da vida nacional. Esta reforma reforça a legitimidade imperial e estimula o conformismo público à ordem restaurada."
 JAP_national_morals_education_act: "Lei de Moral e Educação Nacional"
 JAP_national_morals_education_act_desc: "Padronizar a educação cívica em torno do dever, do serviço e da coesão nacional. As escolas serão usadas para construir disciplina, ampliar a prontidão e fomentar a lealdade ao Estado restaurado."
 JAP_imperial_rescript_revival: "Revival do Rescrito Imperial"
 JAP_imperial_rescript_revival_desc: "Reviver um rescrito imperial oficial para ancorar a legitimidade do Estado e definir as obrigações do cidadão. A ordem restaurada será apresentada como um retorno à unidade, ao dever e ao propósito nacional."
 JAP_north_korean_remilitarized_dmz: "Responder à Escalada da Coreia do Norte na DMZ"
 JAP_north_korean_remilitarized_dmz_desc: "A Coreia do Norte reforçou posições ao longo da Zona Desmilitarizada. Tóquio citará essa escalada para endurecer a postura de segurança e ampliar a margem operacional sob o Artigo 9."
 JAP_north_korean_increased_nuclear_testing: "Responder aos Testes Nucleares da Coreia do Norte"
 JAP_north_korean_increased_nuclear_testing_desc: "Um ritmo renovado de testes nucleares elevou o ambiente de ameaça regional. O governo usará isso para justificar uma interpretação mais rígida do Artigo 9 e acelerar medidas de prontidão."
 JAP_north_korean_threats_to_south_korea: "Responder às Ameaças da Coreia do Norte"
 JAP_north_korean_threats_to_south_korea_desc: "Ameaças diretas contra a República da Coreia aumentam o risco de um conflito mais amplo que pode transbordar para o perímetro de segurança do Japão. Tóquio pode ampliar a interpretação do Artigo 9 e reforçar o planejamento de dissuasão."
 JAP_north_korean_road_to_war: "Preparar-se para a Marcha da Coreia do Norte rumo à Guerra"
 JAP_north_korean_road_to_war_desc: "A situação desliza para um conflito aberto. O Japão não pode mais confiar apenas na contenção. Uma interpretação revisada do Artigo 9 permitirá um planejamento militar mais robusto e opções de resposta mais rápidas."
 JAP_russian_agressiveness: "Responder à Agressividade Russa"
 JAP_russian_agressiveness_desc: "A postura cada vez mais assertiva da Rússia no Nordeste Asiático está minando a estabilidade regional. Tóquio usará o ambiente de ameaça elevado para fortalecer a dissuasão e ampliar a margem operacional sob o Artigo 9."
 JAP_defence_russian_asian_ambitions: "Conter as Ambições Asiáticas da Rússia"
 JAP_defence_russian_asian_ambitions_desc: "As ambições de Moscou na Ásia ameaçam o ambiente de segurança do Japão e o equilíbrio de poder no Pacífico. Tóquio endurecerá sua postura de defesa e ampliará as opções operacionais sob o Artigo 9."
 JAP_russian_north_korean_alliance: "Preparar-se para um Eixo Rússia-Coreia do Norte"
 JAP_russian_north_korean_alliance_desc: "Um alinhamento mais estreito entre a Rússia e a Coreia do Norte aumentaria a pressão sobre o Japão de várias direções. Tóquio responderá fortalecendo a dissuasão e afrouxando as restrições remanescentes sob o Artigo 9."
 JAP_russian_pacific_naval_presence: "Responder ao Reforço Naval Russo no Pacífico"
 JAP_russian_pacific_naval_presence_desc: "A postura naval da Rússia no Pacífico está se tornando mais assertiva. O Japão usará essa mudança para justificar maior prontidão marítima e uma interpretação mais flexível do Artigo 9."
 JAP_tookover_sikhalin_mission: "Prazo para Recuperar os Territórios Perdidos"
 JAP_tookover_sikhalin_mission_desc: "O tempo está se esgotando. Se a Rússia não recuperar os objetivos exigidos antes do prazo, a pressão internacional e o desgaste interno forçarão um acordo. Uma paz será assinada, e os territórios perdidos serão cedidos como preço para encerrar a guerra."
 JAP_russia_demands_peace_japan: "Um Acordo de Paz com a Rússia"
 JAP_russia_demands_peace_japan_desc: "Com as Ilhas Curilas e Sacalina agora firmemente sob controle japonês, Tóquio apresentou uma proposta para encerrar a guerra. A oferta é simples e calculada: paz em troca de a Rússia reconhecer a nova realidade no norte. Não é um ato de caridade, mas um acordo estratégico, que garante nossos ganhos e poupa as duas nações do custo de um conflito prolongado. A aceitação encerraria a guerra e formalizaria nosso controle sobre os territórios capturados. A rejeição sinalizaria que Moscou está disposta a continuar uma guerra que já não tem certeza de vencer."
 JAP_russia_demands_peace_russia: "Exigir Paz do Japão"
 JAP_russia_demands_peace_russia_desc: "Exigiremos um acordo com o Japão para encerrar os combates e congelar a situação antes que piore. Não é reconciliação, é controle de danos, fixando os termos enquanto ainda temos poder de barganha para forçar um desfecho. Se Tóquio recusar, saberemos que busca vitória, e não paz."
 JAP_auto_claiming_tt: "Ao selecionar esta decisão, ela se repetirá até que todos os estados nucleares sejam reivindicados. Então você poderá exigir submissão"
 JAP_intellectual_platform_decision: "$JAP_intellectual_platform$"
 JAP_intellectual_platform_decision_desc: "$JAP_intellectual_platform_desc$"
 JAP_declining_birthrate_category: "Agência de Medidas contra a Queda da Natalidade"
 JAP_declining_birthrate_category_desc: "A crise populacional do Japão tem várias facetas: os nascimentos ficam atrás das mortes, a parcela de aposentados cresce a cada ano e a população em idade ativa encolhe, incapaz de se repor. Sem ação coordenada, a pressão se espalha pela oferta de mão de obra, pela solvência das pensões, pela estabilidade do Estado e pela vitalidade econômica das prefeituras rurais. Não há solução rápida única, apenas uma reforma sustentada e abrangente em vários domínios de política.\n\nAs decisões disponíveis aqui foram desenhadas para funcionar em conjunto com os ramos de foco demográfico. Cada uma atua sobre uma ou mais dimensões da crise (o déficit de nascimentos, a escassez de força de trabalho, o limiar de desemprego, o fardo dos custos de saúde, o fardo dos custos sociais ou a erosão da estabilidade) e cada decisão se aposenta sozinha quando sua condição-alvo melhora, evitando o uso excessivo de qualquer alavanca isolada.\n\n§YO progresso aparece no espírito nacional §!§G$JAP_demographic_pressure_modifier$§!§Y: conforme os focos demográficos são concluídos e as decisões relevantes são tomadas, as penalidades do modificador diminuem gradualmente rumo a zero. A negligência prolongada permite que a pressão permaneça ou piore, corroendo a estabilidade e a capacidade econômica.§!"
 JAP_territorial_disputes: "Disputas Territoriais de [JAP.GetNameWithFlag]"
 JAP_territorial_disputes_desc: "[JAP.GetName] está atualmente envolvido em disputas territoriais com países vizinhos sobre as três regiões a seguir:\n\n§YTerritórios do Norte (Ilhas Curilas do Sul)§!: [JAP.GetName] reivindica as ilhas de Etorofu, Kunashiri, Shikotan e o grupo Habomai, situadas a nordeste de Hokkaido, argumentando que sua ocupação pela União Soviética após a Segunda Guerra Mundial foi ilegítima, e continua a buscar sua devolução por parte de [SOV.GetName]. [SOV.GetName], por sua vez, afirma soberania sobre as ilhas e mantém o controle efetivo.\n\n§YTakeshima (nome [KOR.GetAdjective]: Dokdo)§!: Localizada no Mar de [JAP.GetName] (Mar do Leste), esta ilha é reivindicada por [JAP.GetName], mas está sob controle efetivo de [KOR.GetName] desde a década de 1950. A disputa continua sendo uma questão altamente controversa entre os dois países, envolvendo interpretações históricas e direitos de pesca, e é considerada politicamente sensível.\n§YComo Takeshima é pequena demais para aparecer no mapa, mesmo uma negociação bem-sucedida não resultará em ganhos territoriais. No entanto, você ainda poderá obter os modificadores descritos abaixo!§!\n\n§YIlhas Senkaku (nome chinês: Ilhas Diaoyu)§!: Este grupo de ilhotas desabitadas no Mar da China Oriental está sob o controle efetivo de [JAP.GetName] desde 1895, mas também é reivindicado por [CHI.GetName] e [TAI.GetName]. Desde a década de 1990, repetidos protestos diplomáticos e afirmações concorrentes fizeram da questão um potencial foco de tensões futuras.\n\nTodas essas disputas estão profundamente entrelaçadas com história, direito internacional, controle efetivo, relações diplomáticas e opinião pública interna. Resolvê-las exige fomentar laços mais estreitos e entendimento mútuo com os países envolvidos.\n\n§YDica: Aumentar a opinião do país-alvo ou ampliar sua influência sobre ele tornará as negociações mais propensas ao sucesso!§!\n\n§YRecompensa:§! Se as negociações forem bem-sucedidas, você poderá obter modificadores de §G$MODIFIER_STABILITY_FACTOR$§! e §G$agriculture_district_income_tax_modifier$§!!"
 JAP_territorial_disputes_TT: "Se as negociações forem bem-sucedidas, além de resolver a questão territorial, você poderá obter bônus de §G$MODIFIER_STABILITY_FACTOR$§! e §G$agriculture_district_income_tax_modifier$§!!"
 JAP_dec_negotiations_resolve_northern_territories_dispute: "Negociações para Resolver a Disputa dos Territórios do Norte"
 JAP_dec_negotiations_resolve_northern_territories_dispute_desc: "A questão territorial dos Territórios do Norte continua sendo um dos assuntos pendentes mais significativos da diplomacia [JAP.GetName]-[SOV.GetName] do pós-guerra. Enfrentar essa questão de frente e buscar uma solução pacífica é crucial para restaurar a soberania de [JAP.GetName] e garantir a estabilidade no Extremo Oriente. Se houver confiança mútua e condições de negociação suficientes, poderemos iniciar negociações diplomáticas formais com [SOV.GetName] para pedir a devolução dos territórios."
 JAP_dec_negotiations_resolve_senkaku_dispute_china: "Negociações para Resolver a Disputa das Ilhas Senkaku com [CHI.GetName]"
 JAP_dec_negotiations_resolve_senkaku_dispute_china_desc: "As reivindicações territoriais de [CHI.GetName] sobre as Ilhas Senkaku tornaram-se um fator desestabilizador nas relações [JAP.GetName]-[CHI.GetName]. Como parte que exerce o controle efetivo das ilhas, [JAP.GetName] busca resolver a questão por via diplomática, persuadindo [CHI.GetName] a retirar sua reivindicação. Com a confiança mútua e a influência internacional necessárias, estamos prontos para iniciar negociações diretas com [CHI.GetName]."
 JAP_dec_negotiations_resolve_senkaku_dispute_taiwan: "Negociações para Resolver a Disputa das Ilhas Senkaku com [TAI.GetName]"
 JAP_dec_negotiations_resolve_senkaku_dispute_taiwan_desc: "A reivindicação territorial de [TAI.GetName] sobre as Ilhas Senkaku tornou-se um possível obstáculo à confiança mútua e à cooperação entre [JAP.GetName] e [TAI.GetName]. Para obter o reconhecimento diplomático do controle efetivo de [JAP.GetName] sobre as ilhas, estamos prontos para entrar em negociações pacíficas com as autoridades [TAI.GetAdjective]."
 JAP_dec_negotiations_resolve_takeshima_dispute: "Negociações para Resolver a Disputa de Takeshima"
 JAP_dec_negotiations_resolve_takeshima_dispute_desc: "A disputa territorial com [KOR.GetName] sobre Takeshima há muito é um grande obstáculo nas relações [JAP.GetName]-[KOR.GetName]. Nossa nação está pronta para propor formalmente negociações territoriais ao governo [KOR.GetAdjective], buscando uma solução por meio de uma diplomacia calma e sincera."
 JAP_base_okinawa_decision: "Futuro das Forças dos EUA em Okinawa"
 JAP_base_okinawa_decision_desc: "Okinawa continua abrigando um número significativo de bases militares dos EUA, o que afeta tanto o arcabouço de segurança do Japão quanto as comunidades locais.\nO governo japonês agora estuda formas de reavaliar o arranjo atual em busca de maior autonomia de segurança e menores fardos regionais.\nPor meio do engajamento diplomático, um novo equilíbrio na relação de segurança EUA-Japão pode ser encontrado.\n\nDica: §Ya influência de [JAP.GetName] em [USA.GetName]§! e §Ya influência de [USA.GetName] em [JAP.GetName]§! afetam a taxa de sucesso da negociação. Além disso, você também pode aumentar a taxa de sucesso §Yresolvendo o Equilíbrio de Poder sobre o Artigo 9§! ou §Yelevando os gastos militares para pelo menos $defence_04$§!!"
 JAP_negotiation_base_okinawa: "Iniciar Negociações sobre a Retirada dos EUA de Okinawa"
 JAP_negotiation_base_okinawa_desc: "Para reforçar a autonomia de segurança nacional, o Japão iniciará negociações diplomáticas sobre a retirada das forças militares dos EUA estacionadas em Okinawa. Esta medida visa reavaliar os arranjos de segurança atuais e explorar um arcabouço mais adaptável diante da evolução da dinâmica regional."
 Japan.101.t: "Dissolução Postal: Pondo Nosso Mandato à Prova"
 Japan.101.d: "O debate sobre a privatização dos correios encontrou forte resistência na Dieta, e as deliberações estão cada vez mais tensas. Mesmo dentro do partido, vozes cautelosas e contrárias continuam fortes: alguns argumentam que devemos avançar por meio de ajustes e revisões, enquanto outros insistem que agora é a hora de esclarecer a questão e buscar o julgamento do público.\nSe dissolvermos a Câmara dos Representantes e convocarmos eleições gerais, colocaremos a própria reforma sob teste direto. Ao mesmo tempo, o calendário político mudaria rapidamente para uma eleição, e uma tensão política elevada seria inevitável.\n\nDevemos seguir adiante com a dissolução e as eleições gerais?"
 Japan.101.a: "Dissolver a Câmara dos Representantes."
 Japan.101.b: "Não dissolver."
 Japan.103.t: "Ascensão das Forças de Esquerda"
 Japan.103.d: "Em meio à estagnação econômica, à insegurança no emprego e às crescentes preocupações com a seguridade social, o interesse cresce rapidamente em forças de esquerda que pedem maior redistribuição e apoio à subsistência. Como receptáculo da insatisfação com a política estabelecida, o apoio se espalha por várias regiões, e as pesquisas de opinião também começaram a mostrar crescimento notável dos partidos de esquerda. No cenário político à frente, a presença da esquerda provavelmente se tornará impossível de ignorar."
 Japan.103.a: "Vento a favor das forças liberais"
 Japan.103.b: "Crescimento das forças social-democratas"
 Japan.103.c: "Presença ampliada das forças comunistas"
 Japan.103.e: "Ascensão rápida das forças populistas de esquerda"
 Japan.104.t: "Ascensão das Forças de Direita"
 Japan.104.d: "Em meio à crescente ansiedade com o ambiente de segurança e à desconfiança cada vez maior na política, o apoio se espalha por forças de direita que pedem a manutenção da ordem, a autossuficiência nacional e a ênfase em valores tradicionais. Essas posições atraem o interesse de um amplo leque de eleitores, e as pesquisas de opinião também começaram a mostrar crescimento notável dos partidos de direita. No cenário político à frente, a presença da direita pode aumentar ainda mais."
 Japan.104.a: "Apoio ampliado às forças conservadoras"
 Japan.104.b: "Crescimento das forças social-democratas"
 Japan.104.c: "Ascensão das forças conservadoras reformistas"
 Japan.104.e: "Apoio ampliado às forças alinhadas à Restauração"
 JAP_diplomacy.01.t: "Início das Negociações sobre a Retirada das Tropas dos EUA de Okinawa"
 JAP_diplomacy.01.d: "Por décadas, a presença das forças dos EUA no Japão foi uma pedra angular do arcabouço de segurança do pós-guerra do país e da estabilidade regional. No entanto, diante da evolução das condições geopolíticas, das mudanças na opinião pública e do crescente interesse do Japão em reforçar suas próprias capacidades de defesa, o governo concluiu que deve reexaminar a presença militar dos EUA em Okinawa. Como primeiro passo, as negociações formais com os Estados Unidos começarão agora."
 JAP_diplomacy.01.a: "Iniciar as negociações diplomáticas"
 JAP_diplomacy.02.t: "Pedido Japonês de Negociações sobre a Retirada das Tropas"
 JAP_diplomacy.02.d: "O governo japonês apresentou um pedido formal para entrar em negociações sobre a retirada das forças dos EUA estacionadas em Okinawa. A proposta não é de natureza antagônica, mas apresentada como parte de uma reavaliação mais ampla da postura de defesa do Japão e de suas necessidades de segurança em evolução. Os Estados Unidos precisam agora considerar como responder, equilibrando a integridade da aliança com os interesses estratégicos de longo prazo na região."
 JAP_diplomacy.02.a: "Aceitar o pedido"
 JAP_diplomacy.02.b: "Recusar o pedido"
 JAP_diplomacy.03.t: "Acordo Alcançado: Forças dos EUA Vão se Retirar"
 JAP_diplomacy.03.d: "Após uma série de discussões diplomáticas, o Japão e os Estados Unidos chegaram a um acordo sobre a retirada das forças dos EUA de Okinawa. Este é um momento decisivo na política de defesa em evolução do Japão e ressalta seu desejo de assumir maior responsabilidade pela própria segurança.  Embora isso marque o fim de um arcabouço existente, também oferece uma oportunidade de reavaliar a relação EUA-Japão e explorar novas formas de cooperação em segurança para o futuro."
 JAP_diplomacy.03.a: "Um novo capítulo na política de segurança começa"
 JAP_diplomacy.04.t: "Negociações Fracassadas: Retirada Negada"
 JAP_diplomacy.04.d: "O governo dos EUA recusou o pedido do Japão de retirada das tropas de Okinawa. Como resultado, o arranjo de segurança existente permanecerá em vigor. Esse desfecho pode provocar reações mistas dentro do Japão, possivelmente alimentando o debate sobre a autonomia do país em assuntos de defesa. O governo japonês deve agora reavaliar sua abordagem enquanto continua a monitorar o cenário regional e interno mais amplo."
 JAP_diplomacy.04.a: "Hora de pensar no próximo passo"
 JAP_diplomacy.05.t: "Rumo a uma Memória Compartilhada para o Futuro"
 JAP_diplomacy.05.d: "O governo japonês decidiu propor a criação de uma plataforma intelectual trilateral sob mediação da ONU, com o objetivo de compartilhar as memórias e lições das guerras passadas e transmitir uma cultura de paz às futuras gerações. O projeto incluirá museus e arquivos digitais, com todos os custos cobertos pelo Japão. A proposta será entregue formalmente à China e à Coreia do Sul por canais diplomáticos."
 JAP_diplomacy.05.a: "Enviar a proposta"
 JAP_diplomacy.06.t: "Proposta do Japão: Compartilhando a Memória e o Futuro"
 JAP_diplomacy.06.d: "O governo japonês propôs, sob mediação da ONU, a criação de uma plataforma intelectual trilateral com a China e a Coreia do Sul para preservar as memórias e lições da guerra para as futuras gerações. A iniciativa inclui a construção de museus e arquivos digitais, com todos os custos cobertos pelo Japão. Escolheremos a cooperação voltada ao futuro ou continuaremos mergulhados na desconfiança? Nossa decisão moldará o futuro da memória no Leste Asiático."
 JAP_diplomacy.06.a: "Aceitar a proposta"
 JAP_diplomacy.06.b: "Rejeitar a proposta"
 JAP_diplomacy.08.t: "Plataforma Intelectual Trilateral Lançada"
 JAP_diplomacy.08.d: "Tanto a China quanto a Coreia do Sul aceitaram a proposta. Sob mediação da ONU, a plataforma intelectual trilateral foi formalmente lançada. Por meio de museus e arquivos conjuntos, a memória e as lições da guerra serão agora transmitidas às futuras gerações. Isso pode marcar um primeiro passo significativo rumo à reconciliação e ao entendimento mútuo."
 JAP_diplomacy.08.a: "Um novo passo rumo ao futuro"
 JAP_diplomacy.09.t: "A Proposta Foi Rejeitada"
 JAP_diplomacy.09.d: "Infelizmente, nossa plataforma intelectual idealizada foi rejeitada. Está claro que a reconciliação exige mais tempo e esforços contínuos para construir confiança."
 JAP_diplomacy.09.a: "Devemos esperar por outra oportunidade"
 JAP_news.01.t: "Declaração de [JAP.GetLeader]: Reconhecendo a História"
 JAP_news.01.d: "Hoje, o governo japonês emitiu uma declaração oficial do primeiro-ministro [JAP.GetLeader], expressando profundo remorso e sincero pedido de desculpas pelo domínio colonial e pelas ações do Japão durante a guerra. A declaração enfatizou um compromisso sincero de construir relações diplomáticas voltadas ao futuro e de preservar com responsabilidade a memória da história. O discurso atraiu grande atenção dentro e fora do país, e espera-se que influencie a diplomacia futura no Leste Asiático."
 JAP_news.01.a: "Nossa responsabilidade pelo futuro."
 JAP_news.01.b: "Acompanharemos de perto os próximos acontecimentos."
 JAP_diplomacy.34.t: "Proposta de Ampliação dos Acordos de Swap Cambial"
 JAP_diplomacy.34.a: "Aceitar"
 JAP_diplomacy.34.b: "Recusar por ora"
 JAP_diplomacy_34_TT: "§YCada país da ASEAN que aceitar receberá um modificador de estabilidade e terá uma §Gopinião favorável§! sobre nós.§!"
 JAP_diplomacy.35.t: "Acordo sobre a Ampliação do Swap"
 JAP_diplomacy.35.d: "[FROM.GetName] concordou com a proposta do Japão de ampliar o acordo de swap cambial. Isso fortalece ainda mais a \"rede de proteção\" de apoio à liquidez em tempos de crise, aumentando a confiança do mercado e a eficácia da cooperação regional. Este acordo também é um passo claro para elevar a confiança no Japão dentro da ASEAN."
 JAP_diplomacy.35.a: "Bom."
 JAP_diplomacy.36.t: "Proposta Recusada"
 JAP_diplomacy.36.d: "[FROM.GetName] indicou que recusará a proposta do Japão de ampliar o acordo de swap cambial. Isso reflete a preferência por priorizar o esclarecimento dos termos e dos procedimentos operacionais do acordo, e não é uma crítica à proposta em si. O Japão deve ter em mente as circunstâncias do outro país, mantendo abertos os canais de diálogo."
 JAP_diplomacy.36.a: "Entendido."
 JAP_diplomacy.37.t: "Proposta de Investimento em Infraestrutura Essencial"
 JAP_diplomacy.37.d: "Para impulsionar a conectividade regional e o crescimento econômico, o governo japonês propôs um investimento de APD em larga escala em nosso país, voltado à infraestrutura essencial, como redes de transporte, portos e energia. Melhorias em estradas, portos e redes elétricas fortalecerão as bases da logística e da indústria, apoiando diretamente o crescimento do nosso país. Aceitar a proposta também aumentaria a influência do Japão dentro da ASEAN.\n\nDevemos aceitar esta proposta e acelerar o desenvolvimento da infraestrutura?"
 JAP_diplomacy.37.a: "Aceitar"
 JAP_diplomacy.37.b: "Rejeitar"
 JAP_diplomacy_37_TT: "§YCada país da ASEAN que aceitar receberá um modificador de velocidade de construção de infraestrutura. Contribuiremos com §R$3,5 bilhões§! e ganharemos §G2,5% de influência§! em cada país que aceitar.§!"
 JAP_diplomacy.38.t: "Proposta de Investimento Aceita"
 JAP_diplomacy.38.d: "[FROM.GetName] aceitou a proposta do Japão de investimento de APD em infraestrutura essencial. O avanço das melhorias em redes de transporte, portos e infraestrutura elétrica impulsionará a conectividade regional e o crescimento econômico, ao mesmo tempo em que consolida mais firmemente a nossa participação. Este acordo fortalecerá ainda mais a influência do Japão dentro da ASEAN."
 JAP_diplomacy.38.a: "Bom."
 JAP_diplomacy.39.t: "Proposta Recusada"
 JAP_diplomacy.39.d: "[FROM.GetName] indicou que recusará a proposta do Japão de investimento de APD em infraestrutura essencial. O outro país parece estar priorizando seus planos internos e preparativos institucionais, mas isso não significa que esteja rejeitando a proposta em si. O Japão deve ter em mente as circunstâncias do outro país, deixando espaço para cooperação futura."
 JAP_diplomacy.39.a: "Entendido."
 JAP_diplomacy.40.t: "Proposta de Cooperação em Capital Humano e Pesquisa"
 JAP_diplomacy.40.a: "Aceitar"
 JAP_diplomacy.40.b: "Rejeitar"
 JAP_diplomacy_40_TT: "§YCada país da ASEAN que aceitar receberá modificadores de velocidade de pesquisa e de crescimento da produtividade. Ganharemos §G2,5% de influência§! em cada país que aceitar.§!"
 JAP_diplomacy.41.t: "Proposta de Cooperação Aceita"
 JAP_diplomacy.41.a: "Bom."
 JAP_diplomacy.42.t: "Proposta Recusada"
 JAP_diplomacy.42.a: "Entendido."
 JAP_diplomacy.43.t: "Pedido para Aderir ao Arcabouço de Segurança Marítima do Japão"
 JAP_diplomacy.43.d: "O governo japonês apresentou um plano para lançar um arcabouço de segurança marítima neutro e pacífico, voltado a aliviar as tensões no Mar da China Meridional e proteger a liberdade de navegação, e procurou o nosso país para aderir a ele. Cooperações como compartilhamento de informações, busca e salvamento marítimos, combate à pirataria e exercícios conjuntos contribuiriam para a estabilidade regional e melhorariam a capacidade de gestão de crises. Aceitar a proposta também aumentaria a influência do Japão dentro da ASEAN.\n\nDevemos aceitar esta proposta e cooperar dentro do arcabouço do Japão?"
 JAP_diplomacy.43.a: "Aceitar"
 JAP_diplomacy.43.b: "Rejeitar"
 JAP_diplomacy_43_TT: "§YCada país da ASEAN que aceitar receberá um modificador de estabilidade. Ganharemos §G2,5% de influência§! e uma opinião favorável de cada país que aceitar.§!"
 JAP_diplomacy.44.t: "Acordo para Aderir ao Arcabouço"
 JAP_diplomacy.44.d: "[FROM.GetName] concordou em aderir ao arcabouço de segurança marítima neutro e pacífico proposto pelo Japão. Conforme a cooperação em compartilhamento de informações, busca e salvamento marítimos, combate à pirataria e exercícios conjuntos avança, podemos esperar progresso concreto na estabilidade regional e na proteção da liberdade de navegação. Este acordo fortalecerá a confiança e a influência do Japão dentro da ASEAN."
 JAP_diplomacy.44.a: "Bom."
 JAP_diplomacy.45.t: "Proposta de Participação Recusada"
 JAP_diplomacy.45.d: "[FROM.GetName] indicou que recusará aderir ao arcabouço de segurança marítima neutro e pacífico proposto pelo Japão. O outro país parece estar priorizando considerações sobre a situação regional e prioridades internas, mas isso não significa que esteja rejeitando os próprios princípios da cooperação. O Japão deve manter uma postura que não inflame as tensões, deixando espaço para diálogo e cooperação."
 JAP_diplomacy.45.a: "Entendido."
 JAP_diplomacy.46.t: "Lançamento do Programa Educacional Conjunto Japão-EUA"
 JAP_diplomacy.46.d: "O governo japonês propôs ampliar os programas educacionais conjuntos e os intercâmbios de estudantes para aprofundar o entendimento mútuo e formar a próxima geração. Ao criar um arcabouço em que ambos os países aprendem com os pontos fortes um do outro, a disciplina do Japão e o espírito empreendedor dos Estados Unidos, o objetivo é formar uma nova geração de líderes com visão internacional. Essa iniciativa aumentará os laços entre os povos e fortalecerá ainda mais a confiança dentro da aliança."
 JAP_diplomacy.46.a: "Um investimento no futuro."
 JAP_diplomacy.47.t: "Intercâmbio de Tecnologia e Cultura Japão-EUA"
 JAP_diplomacy.47.d: "O governo japonês apresentou um plano para ampliar o intercâmbio tecnológico e cultural ligando laboratórios universitários, estúdios e redes corporativas japonesas a parceiros no Vale do Silício, em Seattle e em Los Angeles. Engenheiros, designers e criadores viajariam de um lado para o outro em projetos conjuntos, com o objetivo de combinar o know-how americano em operação de plataformas com os pontos fortes do Japão em hardware, jogos e animação. Se a afinidade cultural e a cooperação científica avançarem juntas, reforçarão tanto a estabilidade social quanto o ímpeto de inovação."
 JAP_diplomacy.47.a: "Vamos maximizar a sinergia."
 JAP_diplomacy.48.t: "Cooperação em Pesquisa de Uso Duplo Japão-EUA"
 JAP_diplomacy.48.d: "O governo japonês apresentou uma proposta para fortalecer ainda mais a cooperação Japão-EUA em áreas de tecnologia de uso duplo, aplicáveis tanto a fins civis quanto militares. Centrado na colaboração entre indústria e meio acadêmico, o plano visa avançar a pesquisa conjunta, compartilhar conhecimento especializado e promover o intercâmbio de pessoal, acelerando a P&D e impulsionando o desenvolvimento tecnológico geral. Se essa parceria criar raízes, espera-se que aumente a competitividade futura nos setores civil e militar."
 JAP_diplomacy.48.a: "Vamos avançar a pesquisa conjunta."
 JAP_diplomacy.49.t: "Plataforma de Conhecimento em Preparação para Desastres Japão-Taiwan"
 JAP_diplomacy.49.a: "Vamos aumentar nossa resiliência."
 JAP_diplomacy.50.t: "Fortalecimento da Parceria Avançada de Tecnologia Japão-Taiwan"
 JAP_diplomacy.50.a: "Vamos acelerar a pesquisa conjunta."
 JAP_diplomacy.51.t: "Ampliação de Vagas para Estudar no Japão"
 JAP_diplomacy.51.d: "O governo japonês propôs ampliar as cotas de bolsas e as vagas de admissão para aumentar as oportunidades de estudantes taiwaneses estudarem em universidades japonesas. Essa iniciativa visa não apenas aprofundar os laços acadêmicos e culturais, mas também formar futuros talentos capazes de conectar nossas duas sociedades. À medida que os intercâmbios se ampliam, a base para a próxima geração levar adiante as relações Japão-Taiwan ficará ainda mais forte."
 JAP_diplomacy.51.a: "Um investimento na próxima geração."
 JAP_diplomacy.52.t: "Proposta de Apoio à Reforma do Sistema Comercial"
 JAP_diplomacy.52.d: "O governo japonês propôs cooperação técnica e institucional para apoiar a reforma e a modernização do sistema comercial da China. Simplificando os procedimentos aduaneiros, digitalizando as operações administrativas e desenvolvendo regras alinhadas aos padrões internacionais, o objetivo é facilitar o comércio e melhorar a previsibilidade da atividade empresarial. Se essas reformas avançarem, o fardo processual das importações e exportações diminuirá, reduzindo o atrito na atividade econômica. Aceitar esta proposta também aumentaria a influência do Japão dentro da China.\n\nDevemos aceitar o apoio do Japão e avançar na harmonização internacional do nosso sistema comercial?"
 JAP_diplomacy.52.a: "Aceitar"
 JAP_diplomacy.52.b: "Rejeitar"
 JAP_diplomacy_52_TT: "§YSe a oferta for aceita, a China receberá um modificador de redução da carga tributária, e nós ganharemos §Ginfluência§! dentro da China!§!"
 JAP_diplomacy.53.t: "Proposta de Cooperação Aceita"
 JAP_diplomacy.53.d: "[FROM.GetName] aceitou a oferta do Japão de apoio técnico e institucional para reformar e modernizar seu sistema comercial. Conforme os procedimentos aduaneiros são simplificados e as operações administrativas melhoram, a facilitação do comércio e a previsibilidade da atividade empresarial aumentarão, e o ambiente para as empresas japonesas entrarem no mercado também melhorará. Este acordo fortalecerá de forma constante a influência do Japão dentro da China."
 JAP_diplomacy.53.a: "Bom."
 JAP_diplomacy.54.t: "Proposta Recusada"
 JAP_diplomacy.54.d: "[FROM.GetName] indicou que recusará a proposta do Japão de fornecer apoio técnico e institucional para reformar e modernizar seu sistema comercial. O outro lado parece estar priorizando suas prioridades de desenho de políticas e a coordenação interna, mas isso não significa que esteja rejeitando a necessidade da própria reforma. O Japão deve ter em mente as circunstâncias do outro país, deixando espaço para diálogo e cooperação."
 JAP_diplomacy.54.a: "Entendido."
 JAP_diplomacy.55.t: "Ampliação da Cooperação de Investimentos Japão-China"
 JAP_diplomacy.55.d: "O governo japonês indicou sua intenção de avançar na coordenação institucional e em um arcabouço de cooperação para promover o investimento mútuo e a entrada no mercado entre empresas japonesas e chinesas. Se a entrada cruzada se acelerar, as redes de produção poderão ser otimizadas e as cadeias de suprimento tornadas mais eficientes, o que deve elevar a produtividade industrial geral. Aprofundar a interdependência econômica também traz riscos, mas pode, ao mesmo tempo, servir como um fator prático de estabilização ao reduzir o atrito."
 JAP_diplomacy.55.a: "Vamos abrir o mercado e melhorar a eficiência."
 JAP_diplomacy.56.a: "Vamos aprofundar a solidariedade cultural."
 JAP_diplomacy.57.t: "Projeto Conjunto Japão-China de Preservação de Templos Budistas"
 JAP_diplomacy.57.d: "O governo japonês propôs a implementação de um projeto conjunto Japão-China para preservar templos budistas como patrimônio cultural compartilhado, realizando em conjunto esforços de conservação e restauração. Compartilhando técnicas de restauração e métodos de levantamento e estabelecendo um arcabouço cooperativo para a proteção de bens culturais, o objetivo é reafirmar o valor dos templos e dos bens culturais associados e garantir sua preservação de longo prazo. Se os resultados desses esforços de preservação se tornarem visíveis, o apelo do turismo cultural aumentará, e também se podem esperar efeitos positivos indiretos sobre as economias locais. Essa cooperação também pode servir de oportunidade para reafirmar os laços históricos entre nossos dois países."
 JAP_diplomacy.57.a: "Vamos proteger nosso patrimônio e promover o turismo."
 JAP_diplomacy.58.t: "Acelerador Tóquio-Seul"
 JAP_diplomacy.58.d: "O governo japonês apresentou uma proposta para criar um programa conjunto de aceleração em Tóquio e Seul, institucionalizando o apoio a startups nos dois países. Com assistência na captação de recursos, mentoria, cooperação com empresas e universidades e intercâmbio de talentos entre as duas cidades, o objetivo é elevar as taxas de sucesso das startups e fortalecer a cooperação tecnológica. Se esse arcabouço funcionar como pretendido, a inovação entre as cidades se acelerará, e a cooperação econômica Japão-Coreia será fortalecida de forma mais prática e orientada a resultados."
 JAP_diplomacy.58.a: "Vamos acelerar o impulso das startups."
 JAP_diplomacy.59.t: "Ampliação da Cooperação em Nível Local Japão-Coreia"
 JAP_diplomacy.59.a: "Vamos gerar crescimento a partir das regiões."
 JAP_diplomacy.60.t: "Proposta de Intercâmbio Cultural Japão-Coreia"
 JAP_diplomacy.60.d: "O governo japonês apresentou uma proposta para ampliar sistematicamente o intercâmbio cultural entre o Japão e a Coreia do Sul. Por meio de intercâmbios em mídia, artes, esportes, turismo e educação, o objetivo é aprofundar o entendimento mútuo entre nossos povos e reduzir a distância social. Se os intercâmbios se ampliarem, também influenciarão o sentimento público e as atitudes externas, e ambos os países ganharão um ambiente em que poderão se expressar com mais eficácia na esfera interna um do outro.\n\nDevemos aceitar esta proposta e promover o intercâmbio cultural?"
 JAP_diplomacy.60.a: "Aceitar"
 JAP_diplomacy.60.b: "Rejeitar"
 JAP_diplomacy_60_TT: "§YSe a oferta for aceita, ganharemos §Ginfluência§! na Coreia, mas a Coreia também ganhará §Rinfluência§! no Japão.§!"
 JAP_diplomacy_60_TT2: "§YO intercâmbio cultural nos permitiria ganhar influência no Japão, mas a influência do Japão em seu próprio país também aumentaria.§!"
 JAP_diplomacy.61.t: "Proposta Aceita"
 JAP_diplomacy.61.d: "[FROM.GetName] concordou com a proposta do Japão de ampliar o intercâmbio cultural. Conforme os intercâmbios em mídia, artes, esportes, turismo e educação se ampliam, o entendimento mútuo se aprofundará e podem ocorrer mudanças no sentimento público em ambos os países. Por meio deste acordo, o Japão ganhará uma voz mais forte dentro da Coreia, enquanto a Coreia também fortalecerá sua influência dentro do Japão."
 JAP_diplomacy.61.a: "Bom."
 JAP_diplomacy.62.t: "Proposta Recusada"
 JAP_diplomacy.62.d: "[FROM.GetName] indicou que recusará a proposta do Japão de ampliar o intercâmbio cultural. O outro país parece estar priorizando a consideração da opinião pública e das circunstâncias internas, mas isso não significa que esteja rejeitando o próprio intercâmbio cultural. O Japão deve manter abertos os canais de diálogo, deixando espaço para avançar o entendimento mútuo por outros meios."
 JAP_diplomacy.62.a: "Entendido."
 JAP_diplomacy.63.t: "Força-Tarefa Japão-Coreia sobre a Sociedade Envelhecida"
 JAP_diplomacy.63.d: "O governo japonês propôs criar uma força-tarefa conjunta de especialistas e instituições relevantes do Japão e da Coreia do Sul para enfrentar o desafio comum de uma sociedade envelhecida, com consultas mensais para formular políticas cooperativas. Compartilhando conhecimento especializado sobre o fortalecimento dos sistemas de cuidado aos idosos e de saúde, o apoio ao emprego e o desenho do bem-estar comunitário, o objetivo é aumentar tanto a velocidade quanto a eficácia das respostas políticas. Se esse arcabouço criar raízes, avançará o fortalecimento das medidas de bem-estar social e contribuirá para a estabilidade social de longo prazo."
 JAP_diplomacy.63.a: "Vamos avançar juntos nos preparativos."
 JAP_diplomacy_63_TT: "§YA Coreia do Sul ganhará um modificador de crescimento populacional.§!"
 JAP_diplomacy.64.t: "Cooperação para o Desenvolvimento de Regiões Frias"
 JAP_diplomacy.64.d: "O governo japonês propôs a \"Iniciativa do Extremo Oriente\" para apoiar o desenvolvimento de regiões frias no Extremo Oriente Russo, aproveitando a experiência de Hokkaido na revitalização de regiões de clima frio, por meio de investimento em infraestrutura e da introdução de capital estrangeiro. Avançando melhorias fundamentais em transporte, logística e energia, o objetivo é estimular a atividade econômica regional e aumentar a eficácia do desenvolvimento. A iniciativa visa o desenvolvimento de infraestrutura em Sakha e Kamchatka."
 JAP_diplomacy.64.a: "Vamos fortalecer as bases do Extremo Oriente."
 JAP_diplomacy.65.t: "Sacalina II"
 JAP_diplomacy.65.d: "O governo japonês indicou sua intenção de fortalecer o investimento estrangeiro no projeto energético Sacalina II enquanto coopera com a Rússia, a fim de garantir acesso estável a combustíveis fósseis. Se o investimento de capital e a estabilização das operações avançarem, a continuidade do desenvolvimento melhorará e se poderá esperar uma expansão da capacidade de produção. Sacalina continuará sendo um importante polo de suprimento e provavelmente trará efeitos positivos também para a economia regional."
 JAP_diplomacy.65.a: "Vamos expandir a capacidade de produção."
 JAP_diplomacy.66.t: "Lançamento da Cooperação da Rede de Transporte Eurasiana"
 JAP_diplomacy.66.d: "O governo japonês indicou sua intenção de avançar a cooperação Japão-Rússia para desenvolver um corredor logístico terrestre ligando o Japão à Europa via Rússia. Aproveitando as redes ferroviárias e as principais rodovias, o objetivo é encurtar os tempos de transporte e estabelecer acesso estável aos mercados europeus, ao mesmo tempo em que se aceleram as melhorias de infraestrutura ao longo do corredor. Se a carga começar a fluir na prática, a Rússia aumentará ainda mais sua importância como polo eurasiano, e a conectividade econômica também se aprofundará."
 JAP_diplomacy.66.a: "Vamos acelerar o desenvolvimento do corredor."
 JAP_diplomacy.67.t: "Lançamento da Cooperação em Infraestrutura de TI Japão-Rússia"
 JAP_diplomacy.67.d: "O governo japonês apresentou a iniciativa \"Corredor Digital da Rússia\", trabalhando com empresas japonesas de TI para desenvolver na Rússia infraestrutura como data centers e redes de fibra óptica. O objetivo é modernizar a infraestrutura interna de comunicações e, ao mesmo tempo, fortalecer o papel da Rússia como polo de uma rede de comércio digital que liga Europa, Ásia Central e Rússia. Se essa cooperação entrar nos trilhos, a estabilidade dos fluxos de informação e a capacidade da rede melhorarão, e a digitalização da atividade econômica também se acelerará."
 JAP_diplomacy.67.a: "Vamos expandir nossa infraestrutura de conectividade."
 JAP_historical.20110311.t: "O Grande Terremoto do Leste do Japão"
 JAP_historical.20110311.d: "Às 14h46 de 11 de março de 2011, um enorme terremoto de magnitude 9,0 atingiu a costa do Pacífico da região de Tohoku. O tremor mais forte já registrado no Japão sacudiu violentamente amplas áreas de Tohoku a Kanto, e o imenso tsunami que se seguiu engoliu cidades e vilarejos costeiros, deixando devastação catastrófica. Portos e comunidades pesqueiras foram obliterados em instantes, enquanto estradas, ferrovias e aeroportos foram cortados, lançando as funções urbanas no caos.\n\nCentenas de milhares de pessoas perderam suas casas e buscaram refúgio em abrigos de emergência. O custo econômico é impressionante, pois a agricultura, a pesca e a manufatura, a espinha dorsal da economia regional, sofreram danos paralisantes. As tarefas simultâneas de restaurar a infraestrutura, ajudar os deslocados e reconstruir indústrias e cidades levarão a capacidade administrativa do governo ao seu limite absoluto.\n\nEm meio a esta tragédia sem precedentes, o povo japonês demonstrou resiliência e solidariedade. No entanto, a rapidez e a eficácia com que o governo conseguir responder determinarão a estabilidade e o futuro da nação."
 JAP_historical.20110311.a: "Devemos dedicar todos os esforços ao resgate e à recuperação."
 JAP_great_east_japan_earthquake_tree_tt: "§YA árvore de focos nacionais para a reconstrução após o Grande Terremoto do Leste do Japão foi desbloqueada!§!"
 JAP_news.02.t: "Terremoto Sem Precedentes Atinge o Japão"
 JAP_news.02.d: "Em 11 de março de 2011, o Japão foi atingido por um enorme terremoto. Mais tarde conhecido como o Grande Terremoto do Leste do Japão, este abalo de magnitude 9,0 na costa do Pacífico de Tohoku causou destruição catastrófica em uma vasta área, deixando dezenas de milhares de mortos ou desaparecidos e infligindo perdas econômicas incalculáveis.\n\nO tsunami que se seguiu obliterou cidades costeiras, portos e redes de transporte em instantes, forçando centenas de milhares de pessoas a abrigos de evacuação. A sociedade japonesa enfrenta agora sua maior crise desde o pós-guerra.\n\nO Grande Terremoto do Leste do Japão tornou-se um momento decisivo, enquanto o mundo observa como uma das principais economias do globo conseguirá sua recuperação."
 JAP_news.02.a: "Uma tragédia aterrorizante..."
 Japan.201103111.t: "Declaração de Conclusão da Recuperação"
 Japan.201103111.d: "Anos se passaram desde o grande desastre, os escombros foram removidos e as cidades voltaram a se encher da vitalidade de seu povo. A vida das vítimas gradualmente se estabilizou, e as indústrias e a infraestrutura foram restauradas. Hoje, o governo declara oficialmente a 'Recuperação Alcançada', encerrando o capítulo de uma longa era de dificuldades.\n\nEmbora essa tragédia tenha deixado cicatrizes profundas, também fomentou resiliência e orgulho, lançando a base para um futuro mais brilhante."
 Japan.201103111.a: "Superamos a adversidade!"
 Japan.201103112.t: "Progresso na Restauração da Infraestrutura"
 Japan.201103112.d: "Parte da infraestrutura destruída pelo desastre foi agora restaurada. O transporte e a logística estão sendo gradualmente retomados, trazendo mudanças pequenas, mas significativas, para o cotidiano. Embora a recuperação completa ainda esteja distante, este é um claro passo adiante."
 Japan.201103112.a: "Um passo adiante."
 Japan.201103113.t: "Restauração Total da Infraestrutura"
 Japan.201103113.d: "A infraestrutura de Tohoku, devastada pelo terremoto, finalmente atingiu o nível de restauração almejado. As redes de transporte e as funções logísticas estão novamente em pleno funcionamento, dando novo ímpeto à sociedade e à economia locais. O esforço de reconstrução alcançou um marco importante."
 Japan.201103113.a: "Um marco importante."
 Japan.201103114.t: "Progresso na Restauração da Infraestrutura"
 Japan.201103114.d: "Parte da infraestrutura destruída pelo desastre foi agora restaurada. O transporte e a logística estão sendo gradualmente retomados, trazendo mudanças pequenas, mas significativas, para o cotidiano. Embora a recuperação completa ainda esteja distante, este é um claro passo adiante."
 Japan.201103114.a: "Um passo adiante."
 Japan.201103115.t: "Restauração Total da Infraestrutura"
 Japan.201103115.d: "A infraestrutura de Kanto, devastada pelo terremoto, finalmente atingiu o nível de restauração almejado. As redes de transporte e as funções logísticas estão novamente em pleno funcionamento, dando novo ímpeto à sociedade e à economia locais. O esforço de reconstrução alcançou um marco importante."
 Japan.201103115.a: "Um marco importante."
 Japan.201103116.t: "Telecomunicações Restauradas"
 Japan.201103116.d: "A rede de telecomunicações na região atingida pelo desastre foi finalmente restaurada em parte. A comunicação para a vida cotidiana e os negócios melhorou, trazendo nova esperança à economia e à sociedade locais."
 Japan.201103116.a: "Seguir com mais restauração"
 Japan.201103117.t: "Telecomunicações Totalmente Restauradas"
 Japan.201103117.d: "A infraestrutura de telecomunicações de Tohoku, devastada pelo terremoto, finalmente atingiu o nível de restauração almejado. Com a base da vida cotidiana e da indústria garantida, o caminho da recuperação alcançou um marco importante."
 Japan.201103117.a: "Registrar isto como um passo adiante na recuperação"
 Japan.201103118.t: "Telecomunicações Totalmente Restauradas"
 Japan.201103118.d: "A infraestrutura de telecomunicações de Kanto, devastada pelo terremoto, finalmente atingiu o nível de restauração almejado. Com a base da vida cotidiana e da indústria garantida, o caminho da recuperação alcançou um marco importante."
 Japan.201103118.a: "Registrar isto como um passo adiante na recuperação"
 Japan.201103119.t: "Indústria Local Retoma as Atividades"
 Japan.201103119.d: "Fábricas e empresas da região atingida pelo desastre retomaram as operações. Embora a recuperação completa ainda esteja distante, o retorno dos empregos e da atividade econômica oferece uma sensação tangível de progresso."
 Japan.201103119.a: "Avançar com mais recuperação industrial"
 Japan.2011031110.t: "Base Industrial Totalmente Restaurada"
 Japan.2011031110.d: "A base industrial de Tohoku, devastada pelo terremoto, finalmente atingiu o nível de recuperação almejado. Com os empregos e a capacidade de produção restaurados, o caminho da reconstrução alcançou um marco importante."
 Japan.2011031110.a: "Avançar para a próxima etapa da recuperação"
 Japan.2011031111.t: "Indústria Local Retoma as Atividades"
 Japan.2011031111.d: "Fábricas e empresas da região atingida pelo desastre retomaram as operações. Embora a recuperação completa ainda esteja distante, o retorno dos empregos e da atividade econômica oferece uma sensação tangível de progresso."
 Japan.2011031111.a: "Avançar com mais recuperação industrial"
 Japan.2011031112.t: "Base Industrial Totalmente Restaurada"
 Japan.2011031112.d: "A base industrial de Kanto, devastada pelo terremoto, finalmente atingiu o nível de recuperação almejado. Com os empregos e a capacidade de produção restaurados, o caminho da reconstrução alcançou um marco importante."
 Japan.2011031112.a: "Avançar para a próxima etapa da recuperação"
 Japan.2011031150.t: "Acidente na Usina Nuclear de Fukushima Daiichi"
 Japan.2011031150.d: "O Japão foi atingido por um terremoto e um tsunami sem precedentes e, enquanto a nação se esforça para responder, chegou mais um relato de pior cenário. Um tsunami atingiu a Usina Nuclear de Fukushima Daiichi, em Fukushima, causando falhas nos geradores de emergência, nas baterias e nos tanques de combustível e mergulhando o local em uma perda total de energia.\nAlém disso, grandes quantidades de hidrogênio foram geradas e se acumularam dentro dos edifícios dos reatores, levando a explosões de hidrogênio nas Unidades 1, 3 e 4. Com o temor de vazamentos radioativos nos pontos danificados, o público entrou em pânico."
 Japan.2011031150.a: "Devemos agir imediatamente!"
 JAP_news.03.t: "Acidente na Usina Nuclear de Fukushima Daiichi"
 JAP_news.03.d: "Um acidente grave foi relatado na Usina Nuclear de Fukushima Daiichi, do Japão, após o terremoto e o tsunami. Embora os reatores tenham sido desligados após o abalo, o tsunami teria inutilizado os geradores de emergência e outros equipamentos críticos, levando a uma perda total de energia. Sem que o resfriamento pudesse ser mantido, ocorreram derretimentos de núcleo em várias unidades.\nA geração e o acúmulo de hidrogênio também desencadearam explosões nos edifícios dos reatores, e considera-se altamente provável que materiais radioativos tenham sido liberados no meio ambiente pelos pontos danificados. O governo japonês se esforça para responder."
 JAP_news.03.a: "Que situação..."
 Japan.2011031151.t: "A Política Nuclear do Japão em uma Encruzilhada"
 Japan.2011031151.d: "Um mês se passou desde o acidente nuclear, e o governo japonês agora é forçado a tomar uma decisão. O acidente de Fukushima Daiichi abalou profundamente a sensação de segurança nuclear do público. A opinião pública está dividida, o setor empresarial teme o impacto no fornecimento de energia e os cidadãos estão ansiosos com a possibilidade de vazamento radioativo.\n\nO Japão deve agora deixar claro se continuará a depender da energia nuclear ou escolherá outro caminho."
 Japan.2011031151.a: "Proibir, desligar tudo!"
 Japan.2011031151.b: "Devemos introduzir inspeções rigorosas."
 Japan.2011031151.c: "Seguir como antes!"
 JAP_territorial.01.t: "Início das Negociações dos Territórios do Norte"
 JAP_territorial.01.d: "A disputa territorial sobre os Territórios do Norte é, desde o fim da guerra, uma questão pendente entre [JAP.GetName] e [SOV.GetName]. Agora, nossa nação chegou ao ponto de solicitar formalmente negociações com [SOV.GetName] para resolver o assunto de forma pacífica. Isto não é apenas uma formalidade diplomática, mas um passo crucial para afirmar nossa soberania e legitimidade histórica."
 JAP_territorial.01.oA: "Vamos começar!"
 JAP_territorial.02.t: "[JAP.GetName] Solicita Negociações dos Territórios do Norte"
 JAP_territorial.02.d: "O governo [JAP.GetAdjective] enviou um pedido formal para abrir negociações sobre os Territórios do Norte. Essa questão está engavetada há décadas, e a decisão afetará tanto a nossa posição internacional quanto a política interna. O compromisso significará uma perda do interesse nacional ou um ganho de confiança internacional? Chegou a hora de decidir."
 JAP_territorial.02.oA: "Ceder o território a [JAP.GetName]"
 JAP_territorial.02.oB: "Recusar o pedido. Não há espaço para negociação"
 JAP_territorial.03.t: "Acordo sobre a Devolução dos Territórios do Norte"
 JAP_territorial.03.d: "Finalmente, a antiga questão dos Territórios do Norte foi resolvida. Após negociações com [SOV.GetName], chegou-se a um acordo para a devolução dos territórios em disputa. Isso marca uma vitória diplomática e uma conquista histórica na história [JAP.GetAdjective] do pós-guerra."
 JAP_territorial.03.oA: "Um acordo histórico!"
 JAP_territorial.04.t: "Colapso das Negociações dos Territórios do Norte"
 JAP_territorial.04.d: "O governo [SOV.GetAdjective] rejeitou oficialmente nossa proposta de negociações sobre a devolução dos Territórios do Norte. Apesar de nossos esforços diplomáticos, não se alcançou uma solução. Devemos agora nos concentrar em construir maior confiança e ampliar nossa influência para nos preparar para novas negociações no futuro."
 JAP_territorial.04.oA: "Foi cedo demais desta vez..."
 JAP_territorial.05.t: "Iniciar Negociações sobre as Senkaku com [CHI.GetName]"
 JAP_territorial.05.d: "[JAP.GetName] atualmente exerce controle efetivo sobre as Ilhas Senkaku, mas [CHI.GetName] continua a afirmar sua reivindicação de soberania. À luz dos esforços diplomáticos anteriores, chegou a hora de a nossa nação iniciar formalmente negociações com o governo [CHI.GetAdjective] em busca de uma solução pacífica."
 JAP_territorial.05.oA: "Vamos começar!"
 JAP_territorial.06.t: "[JAP.GetName] Propõe Negociações Territoriais"
 JAP_territorial.06.d: "O governo [JAP.GetAdjective] pediu que retiremos nossa reivindicação territorial sobre as Ilhas Senkaku. Eles defendem uma solução pacífica e a estabilidade regional, e avançam com negociações respaldadas por pressão diplomática e apoio internacional. Aceitar esta proposta certamente despertará apoio e oposição, tanto dentro quanto fora do país."
 JAP_territorial.06.oA: "Retirar a reivindicação e priorizar a estabilidade regional."
 JAP_territorial.06.oB: "Manter a reivindicação e defender a soberania nacional."
 JAP_territorial.07.t: "[CHI.GetName] Retira a Reivindicação das Senkaku!"
 JAP_territorial.07.d: "[CHI.GetName] retirou oficialmente sua reivindicação territorial sobre as Ilhas Senkaku. As antigas tensões no Mar da China Oriental foram significativamente aliviadas, e isso é saudado, dentro e fora do país, como uma grande vitória diplomática. Marca um importante primeiro passo rumo à estabilidade regional e à construção de confiança."
 JAP_territorial.07.oA: "Um avanço histórico."
 JAP_territorial.08.t: "[CHI.GetName] Mantém Sua Reivindicação"
 JAP_territorial.08.d: "[CHI.GetName] declarou que manterá sua reivindicação territorial sobre as Ilhas Senkaku. As negociações terminaram sem sucesso, evidenciando a necessidade de construir mais relações e fortalecer a influência internacional. Embora o diálogo continue possível, a situação segue difícil."
 JAP_territorial.08.oA: "Talvez tenha sido cedo demais..."
 JAP_territorial.09.t: "Iniciar Negociações sobre as Senkaku com [TAI.GetName]"
 JAP_territorial.09.d: "[TAI.GetName] há muito reivindica soberania sobre as Ilhas Senkaku com base em fundamentos históricos e geográficos, enquanto [JAP.GetName] mantém sua posição sobre a legitimidade de seu controle efetivo. Em um esforço para resolver pacificamente essa antiga questão, faremos uma proposta diplomática formal a [TAI.GetName]."
 JAP_territorial.09.oA: "Vamos começar!"
 JAP_territorial.10.t: "[JAP.GetName] Propõe Negociações Territoriais"
 JAP_territorial.10.d: "O governo [JAP.GetAdjective] pediu que abandonemos nossa reivindicação às Ilhas Senkaku. Considerando a complexidade das relações entre os dois lados do Estreito e o contexto internacional mais amplo, será necessária uma deliberação cuidadosa para decidir se aceitamos este pedido."
 JAP_territorial.10.oA: "Retirar a reivindicação pela estabilidade regional."
 JAP_territorial.10.oB: "Devemos continuar a afirmar nossa soberania."
 JAP_territorial.11.t: "[TAI.GetName] Retira a Reivindicação das Senkaku!"
 JAP_territorial.11.d: "As autoridades [TAI.GetAdjective] retiraram oficialmente sua reivindicação territorial às Ilhas Senkaku. Com uma das antigas questões do Mar da China Oriental resolvida, as relações [JAP.GetName]-[TAI.GetName] entram em uma nova era de estabilidade, aumentando as esperanças de uma cooperação mais profunda no futuro."
 JAP_territorial.11.oA: "Um acordo histórico."
 JAP_territorial.12.t: "[TAI.GetName] Se Recusa a Retirar a Reivindicação"
 JAP_territorial.12.d: "[TAI.GetName] declarou que manterá sua reivindicação territorial às Ilhas Senkaku. As negociações terminaram em fracasso, deixando claro que resolver a questão exigirá maior influência diplomática e mais confiança mútua no futuro."
 JAP_territorial.12.oA: "Talvez ainda fosse cedo demais..."
 JAP_territorial.13.t: "Iniciar Negociações sobre Takeshima com [KOR.GetName]"
 JAP_territorial.13.d: "Para pôr fim à antiga disputa territorial sobre Takeshima entre [JAP.GetName] e [KOR.GetName], nosso governo propôs negociações pacíficas com [KOR.GetName]. Em vez de impor nossa reivindicação unilateralmente, este movimento visa construir uma relação voltada ao futuro entre as duas nações."
 JAP_territorial.13.oA: "Vamos começar!"
 JAP_territorial.14.t: "[JAP.GetName] Propõe Negociações sobre Dokdo"
 JAP_territorial.14.d: "O governo [JAP.GetAdjective] nos procurou para negociações sobre a soberania de Dokdo. Embora seja uma decisão extremamente difícil à luz da opinião pública interna e do contexto histórico, é também um julgamento diplomático crucial que pode moldar o futuro das relações [JAP.GetName]-[KOR.GetName]."
 JAP_territorial.14.oA: "Priorizar a melhoria das relações com [JAP.GetName] e concordar com a transferência."
 JAP_territorial.14.oB: "Não podemos abrir mão do nosso território nacional."
 JAP_territorial.15.t: "[KOR.GetName] Concorda em Transferir Takeshima!"
 JAP_territorial.15.d: "Como parte dos esforços para melhorar as relações [JAP.GetName]-[KOR.GetName], o governo [KOR.GetAdjective] concordou em devolver Takeshima. Isso marca o fim de um confronto de décadas e inaugura uma nova fase de confiança entre os dois países. É um momento em que os esforços diplomáticos pacíficos deram frutos."
 JAP_territorial.15.oA: "Uma conquista histórica."
 JAP_territorial.16.t: "[KOR.GetName] Recusa as Negociações sobre Takeshima"
 JAP_territorial.16.d: "O governo [KOR.GetAdjective] rejeitou nosso pedido de devolução de Takeshima. A resolução da questão territorial continua difícil e, sem maior influência diplomática e confiança mútua, será difícil encerrar o assunto."
 JAP_territorial.16.oA: "Por ora, devemos continuar o diálogo."
 JAP_renegotiation_territory: "A renegociação será possível em um ano!"
 JAP_historical.20010426.t: "Yoshirō Mori Renuncia, Junichiro Koizumi Torna-se Primeiro-Ministro"
 JAP_historical.20010426.oA: "Reforma, já!"
 JAP_historical.20060926.t: "Continuidade ou Sucessão?"
 JAP_historical.20060926.oA: "Junichiro Koizumi"
 JAP_historical.20060926.oB: "Shinzo Abe"
 JAP_historical.20070926.t: "Continuidade ou Renovação?"
 JAP_historical.20070926.oA: "Shinzo Abe"
 JAP_historical.20070926.oB: "Yasuo Fukuda"
 JAP_historical.20080924.t: "Uma Transição Tranquila ou uma Mudança Ousada?"
 JAP_historical.20080924.oA: "Yasuo Fukuda"
 JAP_historical.20080924.oB: "Tarō Asō"
 Japan.01.t: "Aproximação das Forças Tradicionalistas"
 Japan.01.d: "Enquanto a polêmica sobre as declarações do primeiro-ministro Mori continua, diversos grupos e comentaristas que defendem que a Casa Imperial deve ser reavaliada como centro da ordem estatal do Japão intensificaram suas atividades. Eles procuraram o governo, sugerindo que, se este demonstrar de forma mais clara a disposição de defender a tradição e o caráter nacional, poderão apoiá-lo moldando a opinião pública e por meio do ativismo de base.\n\nNo entanto, laços mais estreitos com essas forças correm o risco de borrar a linha entre o conservadorismo do establishment e o monarquismo radical, podendo atrair novas críticas ao governo. Devemos aproveitar esta oferta ou manter distância?"
 Japan.01.a: "Manter Distância."
 Japan.01.b: "Usá-los como Alavanca Política."
 JAP_koizumi_appear_TT: "Mori pode aproveitar sua partida de golfe, mas sua influência política provavelmente diminuirá de forma significativa. O partido pode em breve começar a buscar §Yum novo líder.§!"
 JAP_historical.20030926.t: "Fusão PDJ-PL: O Partido Liberal Se Une ao Partido Democrata"
 JAP_historical.20030926.d: "Os movimentos para consolidar as forças não ligadas ao PLD estão se acelerando. Após repetidas conversas, o Partido Democrata e o Partido Liberal concordaram em unificar o principal veículo político do campo não-PLD em uma única organização.\n\nO Partido Liberal será dissolvido e incorporado ao Partido Democrata em uma fusão por absorção. Isso aumentará a presença do campo não-PLD na Dieta, mas também poderá criar novos focos de tensão, à medida que os partidos disputam a direção das políticas e a liderança."
 JAP_historical.20030926.a: "O realinhamento não-PLD está em andamento."
 JAP_historical.20070307.t: "As Misteriosas Despesas de Utilidades"
 JAP_historical.20070307.d: "Em março de 2007, durante uma sessão da Comissão de Orçamento da Câmara dos Conselheiros, revelou-se que a organização de financiamento político do Ministro da Agricultura, Florestas e Pesca Toshikatsu Matsuoka, o \"Fórum Político e Econômico do Novo Século Toshikatsu Matsuoka\", havia declarado um total de aproximadamente 28,8 milhões de ienes em despesas de utilidades ao longo de cinco anos, de 2001 a 2005, em seus relatórios de fundos políticos.\n\nO que chamou particular atenção foi o fato de que o \"escritório principal\" da organização ficava no edifício de gabinetes dos membros da Câmara dos Representantes, onde água, eletricidade e climatização são fornecidas gratuitamente.\nO ministro Matsuoka explicou que as despesas incluíam custos de um \"ionizador de água\" e de \"aquecimento elétrico\", mas não apresentou uma justificativa clara para os valores declarados. Em sessões posteriores da Dieta, recusou-se ainda a dar mais detalhes, afirmando: \"Pelo sistema, nenhuma explicação adicional é exigida\".\n\nOs partidos de oposição criticaram duramente a situação, chamando-a de possível \"declaração falsa\" e \"abuso do sistema\", enquanto a desconfiança pública aumentava em relação à prestação de contas geral do governo."
 JAP_historical.20070307.oA: "Exigir que o ministro dê uma explicação pública completa"
 JAP_historical.20070307.oB: "Defendê-lo até a conclusão da investigação"
 JAP_historical.20070528.t: "Um Fardo Pesado Demais"
 JAP_historical.20070528.d: "O Ministro da Agricultura, Florestas e Pesca, Toshikatsu Matsuoka, foi encontrado morto por enforcamento em sua residência parlamentar em Akasaka, Tóquio. A polícia confirmou depois que foi suicídio.\n\nPor vários meses, o ministro Matsuoka enfrentou intenso escrutínio na Dieta, na mídia e na opinião pública por causa das altas despesas de utilidades declaradas em seus registros de financiamento político.\n\nA notícia causou choque no público, levantando questões mais profundas: \"Ele era o único que deveria ter sido responsabilizado?\" e \"A resposta do governo foi realmente adequada?\""
 JAP_historical.20070528.oA: "Que tragédia..."
 JAP_historical.20070801.t: "Uma Cadeia de Escândalos: O Peso da Responsabilidade"
 JAP_historical.20070801.d: "Após a morte do Ministro da Agricultura, Florestas e Pesca Toshikatsu Matsuoka, Norihiko Akagi foi nomeado seu sucessor. No entanto, apenas dois meses depois, Akagi foi na prática forçado a renunciar após diversas questões levantadas sobre seu relatório de financiamento político, incluindo despesas de escritório, tratamento de doações e a declaração em duplicidade de recibos por seu grupo político \"Tokuyūkai\".\n\nCom dois ministros da agricultura sucessivos envolvidos em escândalos em tão curto espaço de tempo, surgiram sérias dúvidas sobre o senso de responsabilidade, a transparência e a confiabilidade do governo nas nomeações para o gabinete. O cargo de Ministro da Agricultura passou a ser visto como \"amaldiçoado\", e o governo está agora sob pressão para tomar medidas decisivas a fim de restaurar a confiança e estabilizar sua liderança."
 JAP_historical.20070801.oA: "Por que isso continua acontecendo? Devemos recuperar a confiança do povo."
 JAP_historical.20070704.t: "Uma Gafe Fatal"
 JAP_historical.20070704.d: "Durante uma palestra pública, o Ministro da Defesa Fumio Kyūma fez uma declaração controversa sugerindo que os bombardeios atômicos de Hiroshima e Nagasaki foram \"inevitáveis\".\nO comentário foi amplamente interpretado como uma tolerância aos bombardeios, provocando intensa reação dos grupos de sobreviventes da bomba atômica e do público. As críticas vieram tanto de parlamentares da situação quanto da oposição, bem como de governos locais. O primeiro-ministro Abe emitiu uma repreensão formal.\nApós a declaração, líderes locais e grupos cívicos realizaram protestos de ocupação nas cidades afetadas, escalando a polêmica para uma crise política em grande escala. Kyūma acabou renunciando ao cargo de Ministro da Defesa, e Yuriko Koike foi nomeada sua sucessora.\n\nO que começou como uma \"mera gafe de um ministro\" tornou-se um sério teste da capacidade de governo e da credibilidade internacional do governo."
 JAP_historical.20070704.oA: "Como governo, devemos expressar sincero e profundo pesar."
 JAP_historical.20090808.t: "A Fundação do Seu Partido"
 JAP_historical.20090808.d: "À medida que crescem as expectativas de mudança de governo, a insatisfação continua forte com a lentidão na tomada de decisões dos partidos existentes e com a rigidez da administração. Nesse clima, Yoshimi Watanabe e outros colocaram a \"reforma\" em primeiro plano e convocaram a reunião de uma nova força política que não dependesse da estrutura existente.\n\nDessa forma, foi anunciada a fundação do Seu Partido. Este movimento, que defende a reforma administrativa e a desregulamentação, ampliará as escolhas dos eleitores e acelerará ainda mais o realinhamento e as manobras na política japonesa."
 JAP_historical.20090808.a: "Sob a bandeira da reforma, uma nova força começa a se mover."
 JAP_historical.20120928.t: "A Fundação do Partido da Inovação do Japão"
 JAP_historical.20120928.d: "À medida que se espalham a desconfiança nos partidos existentes e a insatisfação com a estagnação política, um movimento reformista baseado no partido regional Associação da Restauração de Osaka, que vinha ampliando sua influência em Osaka, começou a se mover rumo à política nacional. Essa corrente, que havia aumentado sua presença na política regional defendendo a revisão da administração local e a reforma da governança, seria reorganizada como uma força política nacional e chamaria atenção como alternativa aos partidos estabelecidos.\n\nA fundação do Partido da Inovação do Japão não marcaria apenas o nascimento de um novo partido, mas também se tornaria um evento que acelera ainda mais o realinhamento da oposição e a formação de uma \"terceira força\"."
 JAP_historical.20120928.a: "Uma nova força reformista entra na política nacional."
 JAP_historical.20141128.t: "A Dissolução do Seu Partido"
 JAP_historical.20141128.d: "O Seu Partido, que havia estabelecido presença como uma \"terceira força\" contra os grandes partidos existentes, vinha achando cada vez mais difícil manter a unidade interna, à medida que as divergências de opinião se aprofundavam gradualmente quanto à direção da gestão do partido e às respostas às eleições.\n\nNo fim, o partido decidiu se dissolver, e seus parlamentares filiados seguiram cada um por caminhos separados. A dispersão de uma força que se reunira sob a bandeira da reforma destaca mais uma vez a natureza fluida do realinhamento da oposição e provavelmente terá um impacto nada pequeno também no futuro mapa político."
 JAP_historical.20141128.a: "Um pilar da terceira força chega ao fim."
 JAP_historical.20170925.t: "Realinhamento da Oposição: Divisão entre o Esperança e os Democratas Constitucionais"
 JAP_historical.20170925.d: "As forças não ligadas ao PLD entram numa grande fase de realinhamento. O recém-surgido Partido da Esperança atraiu rapidamente atenção como um novo veículo voltado à reforma, em um contexto de insatisfação com os partidos existentes e de sensação de estagnação política. Para algumas partes do campo não-PLD estabelecido, a fusão e a cooperação pareciam uma oportunidade de reconstruir suas forças, mas, ao mesmo tempo, conflitos sobre a direção das políticas e as condições da fusão começaram a surgir gradualmente.\nAs forças enraizadas no antigo Partido Democrata não se uniram em um único bloco: algumas se fundiram ou cooperaram com o Partido da Esperança, enquanto outras formaram o Partido Democrático Constitucional e adotaram uma linha independente. O realinhamento avançou, mas a divisão também ficou mais clara ao mesmo tempo, e a estrutura das forças não-PLD foi drasticamente redesenhada."
 JAP_historical.20170925.a: "O campo não-PLD se dividiu entre o Esperança e os Democratas Constitucionais."
 JAP_historical.20170925_TT: "§YO Partido Democrata será substituído pelo Partido Democrático Constitucional!§!"
 JAP_historical.20180507.t: "Realinhamento da Oposição: Formação do Partido Democrático para o Povo"
 JAP_historical.20180507.d: "As forças de oposição, reorganizadas pela divisão entre o Partido da Esperança e o Partido Democrático Constitucional, continuaram a passar por novas reorganizações. Uma parte do antigo campo do Partido Democrata e uma parte do campo do Partido da Esperança, embora carregando pontos de discordância, buscaram se unir como uma nova força de centro, e o Partido da Esperança foi gradualmente perdendo peso como estrutura independente.\nCom o tempo, formou-se o Partido Democrático para o Povo. Isso também marcou a criação de um novo veículo político que defende uma linha de centro distinta do Partido Democrático Constitucional, e a estrutura da oposição continuaria a mudar."
 JAP_historical.20180507.a: "O realinhamento continua, e o formato da oposição segue mudando."
 JAP_historical.20180507_TT: "§YO Partido da Esperança será substituído pelo Partido Democrático para o Povo!§!"
 JAP_historical.20190401.t: "A Fundação do Reiwa Shinsengumi"
 JAP_historical.20190401.d: "Em meio à desconfiança latente nos partidos existentes e à insatisfação com a insegurança da subsistência, Tarō Yamamoto e outros se mobilizaram para lançar uma nova força política. Enfatizando o apoio de base que não depende de grandes organizações e defendendo levar à política nacional vozes que a ordem política estabelecida não consegue captar por completo, esse movimento pode ser posicionado como uma força que coloca em primeiro plano apelos centrados na subsistência, incluindo apoio às famílias, ampliação da seguridade social e revisão de encargos, inclusive o imposto sobre o consumo.\n\nA fundação do Reiwa Shinsengumi amplia o leque de opções dentro das forças de oposição e, ao mesmo tempo, torna-se um evento que sublinha mais uma vez a fluidez do realinhamento político."
 JAP_historical.20190401.a: "Uma nova força de base declara sua entrada na política nacional."
 JAP_historical.20220710.t: "A Ascensão do Sanseitō"
 JAP_historical.20220710.d: "Em meio à crescente discussão sobre a desconfiança em relação aos partidos existentes e à sensação de distância da participação política, o Sanseitō, uma nova força política que ampliou seu apoio por meio de atividade de base e divulgação de informações, começou a mostrar presença no cenário político nacional. Respaldado pela construção de organização local e por apelos próprios e distintos, atrai cada vez mais atenção como veículo para segmentos que os grandes partidos não haviam conseguido absorver por completo.\n\nEnfatizando sua distância dos partidos estabelecidos, o Sanseitō se expande como um novo partido que dá importância à participação e à capacidade de mobilização de seus membros e apoiadores. Sua postura de colocar em primeiro plano temas como educação, alimentação, sistemas sociais e consciência de soberania atrai apoio, podendo ainda se tornar um fator que abala o alinhamento partidário e a estrutura de temas existentes.\n\nO crescimento dessa nova força é uma mudança que os partidos existentes não podem ignorar, e pode também influenciar futuros realinhamentos da oposição e dos conservadores, bem como a definição das agendas políticas."
 JAP_historical.20220710.a: "Uma nova força emergente fortalece sua presença na política."
