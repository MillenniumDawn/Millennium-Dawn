 reform_canbedone_tt: "§Y개혁 분기를 진행할 수 있게 됩니다!§!"
 waituntilarafatdies_tt: "§Y개혁을 진행하려면 야세르 아라파트가 사망할 때까지 기다려야 합니다. 그러나 이는 다른 기회를 가져다줄 수도 있습니다.§!"
 israeli_settlements: "이스라엘 정착촌"
 israeli_settlements_desc: "1967년 6일 전쟁에서 이스라엘이 승리하여 요르단으로부터 서안 지구의 통제권을 장악한 직후, 헤브론의 한 호텔에 머물던 시온주의 활동가 집단이 퇴거를 거부했습니다. 이스라엘 정부는 서안 지구에 최초의 유대인 정착촌을 세워 활동가들과 타협하려 했고, 그로 인해 팔레스타인 목동들이 그 땅을 계속 사용하지 못하게 되었습니다. 이 사건은 오늘날까지 이어지는 흐름의 시작이 되었으며, 100곳이 넘는 정착촌이 세워지면서 팔레스타인 주민들의 분노는 커져만 갔습니다."
 israeli_settlements2: "이스라엘 정착촌"
 israeli_settlements2_desc: "1967년 6일 전쟁에서 이스라엘이 승리하여 요르단으로부터 서안 지구의 통제권을 장악한 직후, 헤브론의 한 호텔에 머물던 시온주의 활동가 집단이 퇴거를 거부했습니다. 이스라엘 정부는 서안 지구에 최초의 유대인 정착촌을 세워 활동가들과 타협하려 했고, 그로 인해 팔레스타인 목동들이 그 땅을 계속 사용하지 못하게 되었습니다. 이 사건은 오늘날까지 이어지는 흐름의 시작이 되었으며, 100곳이 넘는 정착촌이 세워지면서 팔레스타인 주민들의 분노는 커져만 갔습니다."
 israeli_settlements3: "이스라엘 정착촌"
 israeli_settlements3_desc: "1967년 6일 전쟁에서 이스라엘이 승리하여 요르단으로부터 서안 지구의 통제권을 장악한 직후, 헤브론의 한 호텔에 머물던 시온주의 활동가 집단이 퇴거를 거부했습니다. 이스라엘 정부는 서안 지구에 최초의 유대인 정착촌을 세워 활동가들과 타협하려 했고, 그로 인해 팔레스타인 목동들이 그 땅을 계속 사용하지 못하게 되었습니다. 이 사건은 오늘날까지 이어지는 흐름의 시작이 되었으며, 100곳이 넘는 정착촌이 세워지면서 팔레스타인 주민들의 분노는 커져만 갔습니다."
 israeli_blockade: "이스라엘 봉쇄"
 israeli_blockade_desc: "Since Hamas seized control of the Gaza Strip from Fatah in 2007, Egypt and Israel have enforced a land, air and sea blockade of Gaza. While Israel has maintained that the blockade is legal under international law and that it is necessary to guarantee Israeli security and put pressure on a violent terrorist organization, humanitarian and intergovernmental organizations have accused Israel of inflicting collective punishment on the people of Gaza through the blockade, forcing the territory's inhabitants to remain dependent on humanitarian aid."
 israel.116.t: "철수법을 제안하는 [ISR.GetLeader]!"
 israel.116.d: "최근 사태 이후, 이스라엘 정부는 가자 지구에서의 주둔을 줄이고 해당 지역의 정착촌을 철수시킬 것을 제안했습니다. 이는 우리의 경제 상황을 완화시켜 주겠지만, 이스라엘 사회의 많은 사람들이 이에 매우 분노할 수 있습니다."
 israel.116.a: "그들이 충분히 이성적이기를 바란다."
 israel.116.b: "훌륭해!"
 ISR_support_of_settlements: "정착촌 지원"
 ISR_support_of_settlements_desc: "우리 정부는 사실상의 팔레스타인 지역에 있는 정착촌의 재정적 필요를 위해 예산의 일정 비율을 지원함으로써 정착촌을 지지합니다.\n§W--------------§!\n이 국가 정신은 §Y$ISR_disengagement_plan$§! 중점을 완료하면 §G개선§!됩니다."
 ISR_support_of_settlements2: "정착촌 지원"
 ISR_support_of_settlements2_desc: "우리 정부는 사실상의 팔레스타인 지역에 있는 정착촌의 재정적 필요를 위해 예산의 일정 비율을 지원함으로써 정착촌을 지지합니다.\n§W--------------§!\n이 국가 정신은 §Y$ISR_the_enclave_settlements$§! 중점을 완료하면 §R제거§!되고 비점령지 중심의 정착촌 정책으로 대체됩니다."
 focus_on_exclaves_0: "비점령지 중심"
 focus_on_exclaves_0_desc: "우리 정부는 사실상의 팔레스타인 지역에 있는 정착촌의 재정적 필요를 위해 예산의 일정 비율을 지원함으로써 정착촌을 지지합니다."
 focus_on_exclaves_1: "비점령지 중심"
 focus_on_exclaves_1_desc: "우리 정부는 사실상의 팔레스타인 지역에 있는 정착촌의 재정적 필요를 위해 예산의 일정 비율을 지원함으로써 정착촌을 지지합니다."
 israel.117.t: "법안에 항의하는 종교 시온주의 랍비들!"
 israel.117.d: "최근 많은 종교 시온주의 지도자들이 정부에 반대하는 운동을 지지하며 이 법안에 항의했습니다. 어떻게 해야 하겠습니까?"
 israel.117.a: "랍비들의 심기를 건드리지 마라."
 israel.117.b: "그들의 정치 개입에 대한 분노를 불러일으켜라!"
 israel.118.t: "법안에 맞선 항명 촉구!"
 israel.118.d: "이스라엘의 많은 시위대가 철수법에 대한 항명을 촉구하고 있습니다. 그들은 정부의 승인 없이 특정한 번복 조치를 취하려 합니다. 어떻게 해야 하겠습니까?"
 israel.118.a: "법안을 도덕적으로 경멸하는 자들을 처벌하라!"
 israel.118.b: "철수 중에 그들이 자제하도록 허용하라"
 israel.119.t: "계획에 대한 국민투표를 요구하는 국회의원들!"
 israel.119.d: "크네세트 의원들이 철수 계획에 대한 새로운 국민투표를 제안했습니다. 이를 실시해야 하겠습니까?"
 israel.119.a: "국민이 우리에게 통치할 권한을 주었다!"
 israel.119.b: "대법원으로 무효화하라."
 wemaypiss_people_but_money_tt: "우리는 §R[HAM.GetNameWithFlag]§!에서 §G[ISR.GetNameWithFlag]§!의 정착촌을 철수시켜 §R[HAM.GetNameWithFlag]§!의 §Y정착촌 지원§!에 들어가는 §R자금 지출§!을 §G감소§!시킵니다!\n\n§Y그러나§! §Y많은 집단§!이 이 §Y결정§!을 §R그다지 지지하지 않을§! 수 있습니다."
 hamas_toofar_tt: "§R급진 세력§!이 §R서안 지구§!를 장악했습니다. §G우리§!는 그러한 일이 §Y우리의 국경§!에 존재하게 되는 §R위험을 감수할 수§! 없습니다."
 hebron_tt: "§Y[PAL.GetNameWithFlag]§!가 §R헤브론 봉기§!에 대처하고 §R급진 세력§!을 §G진압§!하는 것을 도와 달라고 요청했습니다. §G우리 군대§!는 §Y팔레스타인 자치정부§!의 §G영토에 진입§!하여 §G그에 따라 행동§!할 것입니다."
 operation_shover_galim_1: "쇼베르 갈림 작전"
 operation_shover_galim_2: "쇼베르 갈림 작전"
 betrayed_oslo: "오슬로 협정 배신"
 lioncagcapt_tt: "§G사자 우리 운동의 지도자들이 체포됩니다!§!"
 lionnotcagcapt_tt: "§R사자 우리 운동의 지도자들이 체포되지 않았습니다!§!"
 israel.120.t: "체포된 사자 우리 운동의 지도자들!"
 israel.120.d: "최근 이스라엘군이 나블루스를 포위하고 사자 우리 운동의 지도자들을 체포했습니다."
 israel.120.a: "매우 유감이다."
 israel.121.t: "이스라엘의 작전 실패!"
 israel.121.d: "최근 이스라엘군이 나블루스를 포위하고 사자 우리 운동의 지도자들을 체포하려 했습니다. 그러나 그들은 성공하지 못했습니다."
 israel.121.a: "매우 좋다."
 anti_palestine_propaganda: "반팔레스타인 선전"
 anti_abbas_propaganda: "반압바스 선전"
 daniel_lions_cage_1: "사자 우리의 다니엘 작전"
 israel.122.t: "대테러 작전에 대한 우리의 참여를 요청하는 이스라엘!"
 israel.122.d: "최근 서안 지구 위기 이후, 이스라엘은 우리 영토에서 수행하려는 대테러 작전에 우리가 참여할 것을 요구하고 있습니다. 동의하겠습니까?"
 israel.122.a: "이는 우리 통치의 정당성을 높이는 데 도움이 될 것이다."
 israel.122.b: "우리는 결코 시온주의자들과 협력하지 않을 것이다!"
 israel.123.t: "책임 분담에 동의한 팔레스타인 보안 기관!"
 israel.123.d: "서안 지구에서 대테러 작전을 개시하기로 합의가 이루어졌습니다. 이제 우리는 협조하여 신속히 움직여야 합니다."
 israel.123.a: "훌륭해!"
 israel.124.t: "대테러 작전 참여를 거부하는 압바스!"
 israel.124.d: "서안 지구 정부는 자국 영토에 테러 위협이 있음에도 우리와의 어떠한 협력도 거부했습니다. 그들은 우리나라와 협력하기를 원하지 않습니다."
 israel.124.a: "흥!"
 theymayrej_pal_tt: "§Y[PAL.GetNameWithFlag]§!가 §G우리의 제안§!을 §R거부§!하면, 이 §Y중점§!은 §Y미완료 상태§!가 되며 우리는 §G다른 선택지로 돌아갈 수 있습니다!§!"
 pal_rejected_conter: "팔레스타인이 대테러 협력 제안을 거부했다."
 israel.125.t: "대테러 작전 장비를 전달하는 마프타시!"
 israel.125.d: "이스라엘이 앞으로의 작전에 대비할 수 있도록 우리에게 일부 장비를 보냈습니다."
 israel.125.a: "그들의 지원을 받게 되어 기쁘다."
 coract_gaz_tt: "§Y가자에 대해 어떻게 대응할지 행동 방침을 결정해야 합니다...§!"
 israel.126.t: "후드나를 제안하는 이스라엘!"
 israel.126.d: "최근 우리의 가자 장악 이후, 이스라엘 정부는 장기 휴전의 대가로 봉쇄를 해제하겠다는 제안을 해 왔습니다. 또한 우리가 수락할 경우 우리 경제에 투자하겠다고 약속했습니다. 어떻게 해야 하겠습니까?"
 israel.126.a: "또 하나의 어리석은 시온주의자 음모다!"
 israel.126.b: "돈이 먼저다, 신사 여러분..."
 hudna_accept: "가자가 후드나를 수락했다!"
 hudna_notaccept: "가자가 후드나를 거부했다!"
 hudna_whatdo_tt: "§R[HAM.GetNameWithFlag]§!에 §Y경제적, 정치적 제안§!이 담긴 §Y서한을 보냅니다§!.\n\n§6이는 가자 지구의 운명을 결정할 것입니다...§!"
 israel.127.t: "[HAM.GetNameWithFlag]의 거부!"
 israel.127.d: "[HAM.GetNameWithFlag]는 우리의 정치경제적 제안을 거부했으며 어떤 상황에서도 우리와 협력하지 않을 것입니다.\n\n그들과는 협상이 불가능한 것으로 보입니다..."
 israel.127.a: "그들에게 안된 일이다."
 israel.128.t: "[HAM.GetNameWithFlag]의 수락!"
 israel.128.d: "놀랍게도 [HAM.GetNameWithFlag]는 이전의 적대적 발언에도 불구하고 우리의 제안을 수락했으며 우리와 협력할 것입니다.\n\n인생은 놀랍지 않습니까?"
 israel.128.a: "정말로 통했다고?"
 PAL_closing_gates_all_open: "§9관문 폐쇄§! §G전면 개방§!"
 PAL_closing_gates_airport_closed: "§9관문 폐쇄§! §t부분 봉쇄§!"
 PAL_closing_gates_ports_closed: "§9관문 폐쇄§! §t강력한 봉쇄§!"
 PAL_closing_gates_kerem_takeover_restrictions: "§9관문 폐쇄§! §t전면 봉쇄§!"
 PAL_closing_gates_erez_closed: "§9관문 폐쇄§! §t쇠퇴시키는 봉쇄§!"
 PAL_closing_gates_kerem_shalom_closed: "§9관문 폐쇄§! §t숨통을 조이는 봉쇄§!"
 PAL_closing_gates_rafah_closed: "§9관문 폐쇄§! §t극심하게 숨통을 조이는 봉쇄§!"
 israel.129.t: "가자를 봉쇄한 이스라엘!"
 israel.129.d: "최근 우리의 가자 장악 이후, 이스라엘은 자국과의 국경을 경제적으로 봉쇄하기로 결정했습니다. 이제 우리는 이스라엘 쪽과 부분적으로 고립되었습니다."
 israel.129.a: "빌어먹을 시온주의자들!"
 israel.130.t: "가자 봉쇄를 요청하는 이스라엘!"
 israel.130.d: "최근 이스라엘 정부가 우리에게 접근하여 가자 지구에 대한 공동 봉쇄를 제안했습니다. 이는 가자의 테러범들을 크게 약화시키고, 무기 밀수업자로부터 우리의 국경을 지키며, 전반적인 안보를 강화할 것입니다. 어떻게 답하시겠습니까?"
 israel.130.a: "물론이다!"
 israel.130.b: "아니, 하지 않겠다."
 israel.131.t: "가자를 봉쇄한 이집트!"
 israel.131.d: "최근 이집트 정부는 극단주의자들의 가자 장악 이후 가자 지구를 봉쇄하기로 결정했습니다.\n\n많은 전문가들은 이 결정이 이집트 정부와 이스라엘의 긴밀한 관계 때문에 내려졌다고 주장합니다."
 israel.131.a: "훌륭해!"
 israel.131.b: "배신자들!"
 israel.132.t: "봉쇄를 거부하는 이집트!"
 israel.132.d: "이집트 정부는 가자 봉쇄를 인도주의적 위기를 초래할 수 있는 잠재적 원인으로 보아 우리의 제안을 거부했습니다."
 israel.132.a: "흠."
 egyopi_tt: "[EGY.GetNameWithFlag]와의 관계가 §Y충분히 높다면§!, 그들은 §R[HAM.GetNameWithFlag]§!를 §G봉쇄§!하여 가자 지구에 심각한 문제를 일으킬 것입니다."
 israel.133.t: "어업권을 제한하는 이스라엘!"
 israel.133.d: "이스라엘이 가자의 해상 국경을 폐쇄했습니다. 이제 어업권이 제한되었고 우리는 더욱 심하게 봉쇄되었습니다."
 israel.133.a: "으윽!"
 tur_mrmr_tt: "§R[HAM.GetNameWithFlag]§!에 물자를 공급하는 §R[TUR.GetFlag]튀르키예§! 선박에 대해 §Y군사 습격을 수행합니다§!. 이는 §Y다양한 결과§!를 가져올 수 있습니다."
 willincr_bloc_tt: "이는 §R[HAM.GetNameWithFlag]§!에 대한 §G봉쇄를 강화§!합니다"
 ISR_gazan_workers: "가자 저임금 노동력"
 ISR_gazan_workershama: "노동 이민"
 israel.134.t: "후원자들의 자금..."
 israel.134.d: "최근 우리의 후원자들과 이스라엘은 우리가 2년간 이스라엘을 공격하지 않기로 합의했으며, 그 대가로 후원자들이 우리에게 자금을 제공할 것입니다."
 israel.134.a: "받아들일 수밖에 없다."
 focus_eff_ch_tt: "이 중점의 §G효과§!는 §R[HAM.GetNameWithFlag]§!의 §Y집권 정당§!에 따라 달라집니다"
 israel.135.t: "공동 투자를 제안하는 이스라엘"
 israel.135.d: "최근 이스라엘과 가자 신정부 사이의 후드나 이후, 이스라엘은 우리가 가자 지구에 카지노를 건설하는 것을 돕기를 원합니다. 동의하겠습니까?"
 israel.135.a: "물론이다!"
 israel.135.b: "음? 아니다."
 gaza_casinos: "가자의 카지노"
 israel.136.t: "미국의 수락!"
 israel.136.d: "미국이 우리의 제안을 수락했으며 가자 카지노 비용을 우리와 분담할 것입니다."
 israel.136.a: "훌륭해!"
 israel.137.t: "미국의 거부!"
 israel.137.d: "미국이 우리의 제안을 거부했으며, 따라서 우리가 가자 카지노 사업의 전체 비용을 부담하게 됩니다."
 israel.137.a: "알겠다."
 gazan_casino_tt: "§Y[USA.GetNameWithFlag]§!에 §Y공동 투자 제안§!을 합니다. §Y[USA.GetNameWithFlag]§!가 제안을 거부하면 우리가 단독으로 §Y비용을 부담§!합니다.\n\n사건 이후 가자는 다음을 받습니다."
 PAL_newsingapore: "신 싱가포르"
 israel.138.t: "가자를 위한 기부를 요청하는 이스라엘!"
 israel.138.d: "가자와의 후드나 이후, 이스라엘은 우리에게 가자 개발에 자금을 기부해 줄 것을 요청하고 있습니다. 동의하겠습니까?"
 israel.138.a: "물론이다!"
 israel.138.b: "우리는 다른 일로 바쁘다."
 israel.139.t: "가자에 자금을 기부한 [FROM.GetNameWithFlag]!"
 israel.139.d: "최근 그들은 이스라엘의 요청에 따라 가자 개발 사업에 일부 자금을 기부했습니다."
 israel.139.a: "훌륭해!"
 israel.139.b: "훌륭하다."
 israel.140.t: "가자 기부를 거부한 [FROM.GetNameWithFlag]!"
 israel.140.d: "그들은 가자 개발 사업에 참여하기를 원하지 않습니다."
 israel.140.a: "알겠다."
 israel.141.t: "샬리트 협정"
 israel.141.d: "가자 테러범들에게 붙잡힌 우리 병사 중 한 명인 길라드 샬리트가 너무 오랫동안 팔레스타인에 억류되어 있습니다.\n\n우리 정치 전문가들은 그 한 사람을 우리 교도소에 수감된 팔레스타인 테러범 1027명과 교환하기를 원합니다. 이 제안에 동의하겠습니까?"
 israel.141.a: "그렇다. 우리 아이를 집으로 데려오라."
 israel.141.b: "매우 어리석은 제안이다!"
 israel.142.t: "예샤 위원회 구성!"
 israel.142.d: "최근 예샤 위원회가 재편되었으며, 이스라엘은 우리 영토 내 자국 정착촌과 관련하여 무엇에 중점을 둘지 결정해야 합니다. 그들은 이미 우리 영토에 대한 통제를 강화했습니다."
 israel.142.a: "으윽!"
 israel.143.t: "월경지에 집중하는 이스라엘!"
 israel.143.d: "이스라엘이 서안 지구의 비점령지에 집중함에 따라 정착촌이 강화되었습니다!"
 israel.143.a: "우리는 이에 저항해야 한다."
 israel.144.t: "아모나 문제"
 israel.144.d: "법무장관이 아모나의 사유지 몰수에 대해 경고합니다.\n\n정착촌 지지 성향의 의원들은 전초기지를 유지할 법적 허점을 찾으려 했지만, 아비하이 만델블리트 법무장관은 사유지 몰수를 승인하는 입법을 시도하는 것은 위헌이 될 것이라고 경고했습니다.\n\n어떻게 해야 하겠습니까?"
 israel.144.a: "대법원의 요구에 맞게 법을 수정하라."
 israel.144.b: "법무장관의 의견을 무시하라."
 amona_tt: "§R[PAL.GetFlag]아모나§!의 §G사유지 몰수§!에 대한 §Y미래를 결정§!합니다."
 israel.145.t: "에비아타르 협상"
 israel.145.d: "안보부와 정착민들이 에비아타르를 두고 협상 중입니다.\n\n사마리아 지역 의회는 에비아타르를 전초기지가 아닌 정착촌으로 지칭했으며, 서안 지구 특유의 법적 정의의 엄격함에 익숙하지 않은 이스라엘 및 국제 언론도 이러한 표현을 그대로 받아들였습니다. 정착촌 설립은 법적 절차를 따르지만, 전초기지 설립은 이스라엘 법상 불법입니다.\n\n어느 쪽 편을 들어야 하겠습니까?"
 israel.145.a: "정착촌에 인근 토지를 할당하라."
 israel.145.b: "에비아타르를 현재 상태로 승인하라."
 eviatar_tt: "§R[PAL.GetFlag]에비아타르§!의 §Y전초기지§!에 대한 §Y미래를 결정§!합니다."
 israel.146.t: "호메시 외곽 사건으로 재판에 넘겨진 정착민들!"
 israel.146.d: "최근 광신적인 정착민들과 예샤 위원회 사이에 사건이 발생했습니다. 어떻게 해야 하겠습니까?"
 israel.146.a: "그들은 무고하다, 가해자들을 체포하라!"
 israel.146.b: "국제법을 존중해야 한다."
 homesh_tt: "§R[PAL.GetFlag]호메시§!의 §Y정착촌§!에 대한 §Y미래를 결정§!합니다."
 ISR_operation_pager: "신질서 작전"
 ISR_operation_pager_desc: "침공에 앞서 헤즈볼라의 수장을 제거하고 그들의 지휘 체계를 끊어야 합니다."
 israel.147.t: "남레바논에서 호출기 폭발!"
 israel.147.d: "레바논 고위 보안 소식통과 또 다른 소식통이 로이터에 밝힌 바에 따르면, 이스라엘 정보기관 모사드는 화요일의 폭발이 일어나기 수개월 전 레바논 조직 헤즈볼라가 주문한 대만산 호출기 5,000개 안에 소량의 폭발물을 심어 두었습니다.\n\n이 작전은 전례 없는 헤즈볼라의 보안 붕괴로, 레바논 전역에서 수천 개의 호출기가 폭발하여 9명이 사망하고 이 조직의 전투원과 주베이루트 이란 대사를 포함한 3,000명 가까운 사람이 부상을 입었습니다.\n\n이제 이스라엘은 헤즈볼라가 장악한 지역에 포격을 시작합니다."
 israel.147.a: "츠리흐 레아소트 니크마."
 israel.147.b: "빌어먹을 시온주의자들!"
