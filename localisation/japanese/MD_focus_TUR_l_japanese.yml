 TUR_assimulate_kuwait: "Assimilate Kuwait"
 TUR_assimulate_syria: "Assimilate Syria"
 TUR_assimulate_iraq: "Assimilate Iraq"
 TUR_invite_azerbaijan: "アゼルバイジャンを招待する"
 TUR_invite_azerbaijan_desc: "アゼルバイジャンの兄弟たちは、我々が統一するこの日を切望してきた。彼らが喜んで我々に加わることを願おう。"
 TUR_invite_kazakhstan: "カザフスタンを招待する"
 TUR_invite_kazakhstan_desc: "Kazakhs currently have some of the most land in the Turkic world. Their invitation to the Confederation should be a no-brainer."
 TUR_invite_uzbekistan: "ウズベキスタンを招待する"
 TUR_invite_uzbekistan_desc: "Uzbeks will be delighted upon hearing the news that their nation is eligible to join the Turkic Confederation. There will be no doubts they will join."
 TUR_invite_turkmenistan: "トルクメニスタンを招待する"
 TUR_invite_turkmenistan_desc: "Turkmenistan is not a country that really opens itself up to the world, but surely they will open themselves up to their Turkic friends."
 TUR_land_reforms: "土地改革"
 TUR_land_reforms_desc: "我々は国民の間での土地分配の扱い方を完全に改革するだろう。"
 TUR_military_debug: "TSK"
 TUR_seize_mafia_assets: "マフィア資産の押収"
 TUR_seize_mafia_assets_desc: "今や我々が何人かマフィアメンバーを逮捕したので、我々は安全に彼らの資産を……調査目的のために押収することができる。"
 TUR_seize_goods_from_ports: "港からの物品窃盗"
 TUR_assassinate_abdul_mustafa: "クルド人への対処"
 TUR_assassinate_abdul_mustafa_desc: "Ever since the Kurds gained autonomy in Northern Iraq back in the 90's, our security forces have been put on high alert due to the boost in morale of Kurdish separatists. By assassinating the governor of Kirkuk we will be able to severely damage Kurdish morale, and resistance."
 TUR_gulenist_educators2_desc: "我々は教育改善に焦点を当てており、できる限りギュレンの教えを広めなければならない"
 TUR_9833_name_mhp: "コンスタンティニエ"
 TUR_flavor_event.5.b: "悲劇だ"
 TUR_support_from_kurdish_television: "クルド系テレビ局からの支持"
 TUR_support_from_kurdish_television_desc: "我々が支援してきたクルド系テレビチャンネルが、政府と国家を支持し、好意的に報じ始めた。"
 PKK_hard_fought_freedom: "苦難の末に得た自由"
 PKK_hard_fought_freedom_desc: "我々の自由は容易に手に入ったものではない。クルディスタンの勇敢な戦士たちがトルコ国家から自治を勝ち取るまでには数十年を要した。この自由は、最後の一人のクルド人までもが守り抜く！"
 TUR_revised_political_party_laws: "標的を定めた政党法"
 TUR_revised_political_party_laws_desc: "Certain laws have been passed that limit the ability of certain political parties to say what they want."
 TUR_scorched_earth_tactics: "焦土作戦"
 TUR_supply_disruption: "兵站問題"
 TUR_PKK_released_TT: "£TUR_Neutral_Communism §OPKKの反乱§!は終結する！\n - £TUR_Neutral_Communism §OPKK§!は新しいクルド人国家の統治機関となる。"
 PKK_strength_TT: "PKKの強度"
 PKK_strength2_TT: "この変数はPKKがどれほど強力になったかを示す。この変数は毎年5〜10%ずつ上昇し、100%に達するとPKKは独立を宣言し、独立戦争を開始する。我々がより多くの基地を掃討すれば、PKKの戦力は弱まる。迅速に行動しなければ、PKKは数年で独立を達成してしまうだろう。"
 TUR_pkk_manpower_TT: "[ROOT.TUR_PKK_bases_name]基地の人的資源"
 TUR_pkk_manpower2_TT: "この変数は[ROOT.TUR_PKK_bases_name]基地に存在する人的資源を示す。これを100未満にできれば、この地域からPKKを恒久的に排除することができる。全ての州でPKKを排除すれば、PKKに対する完全勝利を宣言できる。"
 TUR_PKK_insurgency_formally_ends_TT: "£TUR_Neutral_Communism §OPKKの反乱§!は正式に終結する"
 TUR_less_than_100_PKK_diyarbakir_TT: "§Hディヤルバクル§!基地の§H人的資源§!が100未満である"
 TUR_less_than_100_PKK_van_TT: "§Hヴァン§!基地の§H人的資源§!が100未満である"
 TUR_less_than_100_PKK_euphrates_TT: "§Hユーフラテス§!基地の§H人的資源§!が100未満である"
 TUR_has_large_mil_or_higher_TT: "§O多額の軍事支出§!以上である"
 TUR_automate_warfare_TT: "£TUR_Neutral_Communism PKKに対する作戦を開始する\n - この基地を常に攻撃する必要はなくなり、自動的に行われるようになる\n - 毎月末、一定数の£TUR_Neutral_Communism PKKが死亡する\n - 作戦が有効な間、装備と人的資源を消費する\n - 作戦が進行中、戦闘に関連するイベントを受け取る\n - £TUR_Neutral_Communism PKKがアナトリア深部を攻撃する可能性が高まる"
 TUR_end_automate_warfare_TT: "この州における£TUR_Neutral_Communism  PKKに対する作戦を終了する"
 TUR_spend_equipment_TT: "§R以下のものを失う§!:\n - §H150§!～§H460§!丁の小火器\n - §H25§!～§H190§!台の汎用トラック\n - §H5§!～§H65§!人の人的資源"
 TUR_assault_this_base_TT: "§H40§!～§H190§!人の£TUR_Neutral_Communism PKK反乱分子が§G殺害§!される！"
 TUR_finalized_kurdish_reforms_TT: "[PKK.GetFlag]§Hクルド§!独立に関する住民投票を§H最終決定§!し、実施する\n - このディシジョンを取ると、これ以上の改革を可決することは§Rできなくなる§!"
 TUR_release_ocalan_TT: "§Hアブドゥッラー・オジャラン§!が解放される"
 TUR_completed_reconciliations_TT: "全ての改革が完了し、可決された"
 TUR_PKK_broke_free_tt: "[PKK.GetFlag]PKKが独立を宣言する！\n - 戦争目標を正当化するか、襲撃を通じて戦争を開始しない限り、直接介入することはできない\n[PKK.GetFlag]PKKは常備軍を持ち、我々に対して大きな防御ボーナスを持つ\n - 全てのクルド人地域での中核州を失う。"
 TUR_double_damage_TT: "§H2倍§!の§HPKK反乱分子§!を排除する！\n§H50%§!の確率で§H民需工場を1個§!失う！"
 TUR_2X_LOSS_TT: "§H50% Chance§! we lose §H2X More§! Equipment"
 TUR_AIR_LOSS_TT: "§H50%の確率§!で§H輸送機§!を1失う"
 TUR_PKK_DAMAGE_300_TT: "§H300人§!の§HPKK反乱分子§!を排除"
 TUR_PKK_DAMAGE_200_TT: "§H200人§!の§HPKK反乱分子§!を排除"
 TUR_PKK_DAMAGE_100_2_TT: "§H100人§!の§HPKK反乱分子§!を逮捕"
 TUR_PKK2_TT: "£decision_icon_small クルディスタン問題に関する追加の§Yディシジョン§!が§Y解放§!される\n - この選択肢を取ることで、中東のクルド人地域に対するより大きな支配を主張することができる。\n - 全てのPKKの基地を破壊することに成功すれば、トルコにおけるクルド分離主義に恒久的な終止符を打つことができる。"
 TUR_PKK3_TT: "£decision_icon_small クルディスタン問題に関する追加の§Yディシジョン§!が§Y解放§!される\n - この選択肢は、£TUR_Neutral_Communism §HPKKの基地§!に対する軍事作戦に代わるものだ。基地を破壊したところで、約束は果たされない。\n - 必要な改革を成立させるのに、§H1,500日間§!の猶予がある。これは改革に着手することで延長できる。\n - この選択肢により、[PKK.GetFlag]クルド人により大きな自治権が与えられることになる。\n - [PKK.GetFlag]ディヤルバクルは自治地域となり、その産業の大部分は我々の管理下となる。\n - [PKK.GetFlag]PKKは独自の軍隊、政府、領土を持つことになる。\n - この選択肢を選べば、クルド系少数民族が相当数存在する近隣諸国の反感を買うことになるだろう。"
 TUR_rebuilding_kurdistan: "クルディスタンの再建"
 TUR_rebuilding_kurdistan_desc: "\n£TUR_desctext_PKK \n\n\n\n\n我々の和解の約束は、偉大なる我が国の東部に住むクルド人住民に新たな希望をもたらした。彼らは別の存在となるが、新しいクルド人国家は依然として我々の政府に応える必要がある。安定的で自給自足可能なクルド人国家を創設するためには、まずそれが崩壊したり我々に過度に依存したりすることなく自立できるような、必要なインフラと枠組みを構築しなければならない。この約束を果たせなければ、我々はこの地域に対する完全な支配を失うかもしれない。"
 TUR_PKK_mechanic: "クルディスタン問題"
 TUR_PKK_mechanic_desc: "\n£TUR_desctext_PKK \n\n\n\n\nThe £TUR_Neutral_Communism  §HPKK§! first began their attacks in the late 70's, and ever since, have persisted in their efforts of gaining autonomy or out-right independence from our nation. The £TUR_Neutral_Communism  §HPKK§! have spread their movement to neighboring states, destabilizing our neighbors, and creating a need for closer cooperation. We can do little in stopping the growth of their strength except for attacking them. The more bases we clear out, the weaker their strength becomes. Taking out the £TUR_Neutral_Communism  §HPKK§! is a race against time, the longer we take to clear them out, the closer they get to a major revolt or independence.\n\nSelected Base: [ROOT.TUR_PKK_bases_name]"
 TUR_PKK_van_manpower: "[?var_pkk_van]"
 TUR_PKK_diyarbakir_manpower: "[?var_pkk_diyarbakir]"
 TUR_PKK_euphrates_manpower: "[?var_pkk_euphrates]"
 TUR_hold_meeting: "ディヤルバクル会談の開催"
 TUR_hold_meeting_desc: "We can convene in Diyarbakır with our allies, and together we can agree on a deal to move forward. Either we can cooperate with our allies, and take on the PKK together at a cost, or we can decide to do things on our own, potentially risking conflict with our neighbors if we choose to pursue cross-border raids. We can also choose to announce our intention to grant the Kurds autonomy at the summit."
 TUR_select_van_base: "ヴァンでの作戦実施"
 TUR_select_van_base_desc: "ヴァン地域はイランとアルメニアの両方に接しており、PKKの活動が最も活発な州の一つである。"
 TUR_select_diyarbakir_base: "ディヤルバクルでの作戦実施"
 TUR_select_diyarbakir_base_desc: "おそらくPKKメンバーと支持者からの抵抗が最も激しい地域であるディヤルバクルは、PKKによる活動のホットスポットとなっている。"
 TUR_select_euphrates_base: "中央ユーフラテスでの作戦実施"
 TUR_select_euphrates_base_desc: "他の地域よりは穏やかだが、中央ユーフラテス地域ではPKKの支部が活動している。"
 TUR_assault_this_base: "[ROOT.TUR_PKK_bases_name]への攻撃開始"
 TUR_assault_this_base_desc: "[ROOT.TUR_PKK_bases_name]に攻撃を仕掛けることで、より直接的にPKKの拠点を掃討することができる。"
 TUR_greenlight_operations_in_van: "ヴァンでの作戦を承認"
 TUR_greenlight_operations_in_van_desc: "我々はトルコ軍に承認を与え、ヴァンでPKKに対する全面的な攻撃を開始することができる。"
 TUR_end_operations_in_van: "ヴァンでの作戦終了"
 TUR_end_operations_in_van_desc: "他の場所で資源と計画が必要なため、ヴァンでの作戦を終結させる必要がある。"
 TUR_greenlight_operations_in_diyarbakir: "ディヤルバクルでの作戦を承認"
 TUR_greenlight_operations_in_diyarbakir_desc: "我々はトルコ軍に承認を与え、ディヤルバクルでPKKに対する全面的な攻撃を開始することができる。"
 TUR_end_operations_in_diyarbakir: "ディヤルバクルでの作戦終了"
 TUR_end_operations_in_diyarbakir_desc: "他の場所で資源と計画が必要なため、ディヤルバクルでの作戦を終結させる必要がある。"
 TUR_greenlight_operations_in_euphrates: "中央ユーフラテスでの作戦を承認"
 TUR_greenlight_operations_in_euphrates_desc: "我々はトルコ軍に承認を与え、中央ユーフラテスでPKKに対する全面的な攻撃を開始することができる。"
 TUR_end_operations_in_euphrates: "中央ユーフラテスでの作戦終了"
 TUR_end_operations_in_euphrates_desc: "他の場所で資源と計画が必要なため、中央ユーフラテスでの作戦を終結させる必要がある。"
 TUR_clean_out_PKK_in_van: "ヴァンにおけるPKKの存在を終結させる"
 TUR_clean_out_PKK_in_van_desc: "ついにヴァンとその周辺地域におけるPKKの存在を終わらせる時が来た。PKKとの戦いにおける我々の成功はこれまでのところ実を結んでいるが、ヴァンで平和を維持することができるだろうか？"
 TUR_clean_out_PKK_in_diyarbakir: "ディヤルバクルにおけるPKKの存在を終結させる"
 TUR_clean_out_PKK_in_diyarbakir_desc: "ついにディヤルバクルとその周辺地域におけるPKKの存在を終わらせる時が来た。PKKとの戦いにおける我々の成功はこれまでのところ実を結んでいるが、ディヤルバクルで平和を維持することができるだろうか？"
 TUR_clean_out_PKK_in_euphrates: "中央ユーフラテスにおけるPKKの存在を終結させる"
 TUR_clean_out_PKK_in_euphrates_desc: "ついに中央ユーフラテスとその周辺地域におけるPKKの存在を終わらせる時が来た。PKKとの戦いにおける我々の成功はこれまでのところ実を結んでいるが、中央ユーフラテスで平和を維持することができるだろうか？"
 TUR_declare_victory_over_PKK: "PKKに対する勝利"
 TUR_declare_victory_over_PKK_desc: "数十年前に我々の主権を残酷に攻撃し始めたPKKのテロリストに対する、長らく待ち望んだ勝利を宣言する時が来た。"
 TUR_the_promise_of_no_return: "後戻りのできない約束"
 TUR_the_promise_of_no_return_desc: "我々は東部のクルド人コミュニティに対し、より大きな自治権を約束した。5つの改革を完了させ、期限までに最終決定を下さなければならない。各改革に着手するたびに、期限は延長される。PKKの基地に対する軍事作戦は、この任務には影響しない。"
 TUR_finalize_the_reforms: "改革の最終決定"
 TUR_finalize_the_reforms_desc: "多くの改革が可決された今、改革を最終決定し、正式なクルド人の住民投票を呼びかける時が来た。"
 TUR_power_infrastructure: "適切な電力インフラの確立"
 TUR_power_infrastructure_desc: "適切な電力網の欠如は、国家運営において巨大な失敗につながりかねない。新しいクルド人国家も例外ではない。"
 TUR_jobs_and_careers: "クルド人の雇用とキャリア"
 TUR_jobs_and_careers_desc: "クルド人国家が繁栄するためには、雇用が必要不可欠である。適切な雇用と生産性がなければ、いかなる国家の経済も自壊してしまうだろう。"
 TUR_kurdish_security_apparatus: "クルド治安機関の設立"
 TUR_kurdish_security_apparatus_desc: "Without proper security and a competent armed force, the Kurdish state will be susceptible to foreign or internal attacks on its territory. This would eventually spill over into Turkey itself, which is something that we simply cannot afford."
 TUR_pass_the_infrastructure_bill: "インフラ改革法案の可決"
 TUR_pass_the_infrastructure_bill_desc: "東クルディスタンインフラ改革法案を可決することで、我々はいくつかの中央アナトリアへの産業移転を正式に承認し、将来の国家が独自の産業を構築するために必要なインフラを建設することができる。"
 TUR_release_ocalan: "オジャランの解放"
 TUR_release_ocalan_desc: "アブドゥッラー・オジャランは、これまで我々の刑務所におり、何度も処刑の危機に瀕してきた。クルド人との関係を改善したいのであれば、オジャランを社会に解放する時が来た。"
 TUR_PKK_VAN_BASE: "ヴァン"
 TUR_PKK_DIYARBAKIR_BASE: "ディヤルバクル"
 TUR_PKK_EUPHRATES_BASE: "中央ユーフラテス"
 TUR_PKK_NO_BASE: "基地が選択されていない"
 TUR_PKK_NO_BASE_STRENGTH: "N/A"
 TUR_pkk.2.b: "いや。これは我々の主権に対する脅威だ"
 TUR_pkk.100.t: "[ROOT.TUR_PKK_bases_name]への作戦前攻撃"
 TUR_pkk.100.d: "我々は、標的としている基地でPKKの防御を軟化させる段階に達した。現在、作戦前の攻撃を実施するために、[ROOT.TUR_PKK_bases_name]周辺のPKKの動きがマッピングされている。物事がうまくいかない可能性は常にあるが、部隊が準備万端で効果的であれば、失敗を過度に心配する必要はないはずだ。"
 TUR_pkk.100.a: "連携した空爆を開始する"
 TUR_pkk.100.b: "彼らの補給線を断つ"
 TUR_pkk.100.c: "砲撃で彼らを叩く"
 TUR_pkk.100.d1: "今回は見送ろう"
 TUR_pkk.200.t: "部隊の物資が不足"
 TUR_pkk.200.d: "[ROOT.TUR_PKK_bases_name]の最前線からの報告によると、物資が不足しており、PKKに対する作戦能力が低下する可能性があることが示されている。我々は最前線の部隊に彼らが必要とする装備を送ることができるが、国際舞台で迫り来るいかなる潜在的な紛争のためにも、我々自身の物資を維持することを忘れてはならない。"
 TUR_pkk.200.a: "必要なものは何でも空輸せよ"
 TUR_pkk.200.b: "信頼できる地元民に装備を渡して輸送させる"
 TUR_pkk.200.c: "今あるものでなんとかできるだろう"
 TUR_pkk.201.t: "PKK、住宅地に陣取る"
 TUR_pkk.201.d: "PKKは住宅地に防御陣地を設置することを決定し、市民を危険に晒している。我々はこの地域で大きな混乱を引き起こすことなく、これらの反乱分子を排除する方法を見つけ出さなければならない。さもなければ、我々の評判と、無関係の市民の命を危険に晒すことになりかねない。"
 TUR_pkk.201.a: "特殊部隊を呼べ"
 TUR_pkk.201.b: "夜間に攻撃を試みる"
 TUR_pkk.201.c: "ただ攻撃を開始せよ！"
 TUR_pkk.202.t: "PKKが反攻を開始"
 TUR_pkk.202.d: "PKKは[ROOT.TUR_PKK_bases_name]で大規模な反攻を開始することを決定し、一部の部隊に混乱と恐怖をもたらしている。しかし、今は頭のない鶏のように走り回る時ではなく、次の手を評価する時である。作戦担当の最高司令部は通知を受け、命令を待っている。"
 TUR_pkk.202.a: "我々自身の攻勢で応じよ"
 TUR_pkk.202.b: "塹壕を掘り、攻撃に備えよ"
 TUR_pkk.202.c: "焦土作戦を用い、後退せよ"
 TUR_pkk.203.t: "大規模なPKK輸送部隊を奇襲"
 TUR_pkk.203.d: "鹵獲した軍用および民間車両を使用し、PKKは予期せぬ攻撃を避けるため、[ROOT.TUR_PKK_bases_name]から別の場所へ前進していた。しかし、PKK内部の情報提供者による密告のおかげで、我々は奇襲に成功した。現在、この輸送部隊は我々のジャンダルマによって包囲されており、彼らは次に取るべき措置についての命令を待っている。"
 TUR_pkk.203.a: "地域の全てを破壊せよ"
 TUR_pkk.203.b: "攻撃を仕掛け、装備の鹵獲を試みよ"
 TUR_pkk.203.c: "彼らが降伏するまで兵糧攻めにせよ"
 TUR_pkk.204.t: "PKK、分裂を画策"
 TUR_pkk.204.d: "PKKは全国で大規模な抗議行動を呼びかけることにより、我が国内に政治的な分裂を画策しようとしている。機動隊は待機状態にあるが、議会と我々の政党は拡大措置を求めている。"
 TUR_pkk.204.a: "首謀者を逮捕せよ"
 TUR_pkk.204.b: "この動きを利用せよ"
 TUR_pkk.204.c: "彼らの動きを弱める法律を可決せよ"
 TUR_pkk.205.t: "PKK部隊、アルメニアへ撤退"
 TUR_pkk.205.d: "PKK fighters that were engaged with our own troops have crossed the border into Armenia, even attacking and holding some Armenian border guards hostage. There are a few who are still trying to flee from the engagement with our troops, but we now have to make a decision to either send reinforcements and prepare to cross the border or continue the fight against the ones who are still trying to flee."
 TUR_pkk.205.a: "作戦を完全に放棄する"
 TUR_pkk.205.b: "まだここにいる者たちに集中する"
 TUR_pkk.205.c: "奴らを追え！"
 TUR_pkk.206.t: "トルコ軍、敗北を喫す"
 TUR_pkk.206.d: "トルコ・アルメニア国境からの報告によると、トルコ兵はアルメニアに逃げ込んだPKK工作員を捕獲できず、トルコに撤退している模様だ。アルメニア当局は、PKKを匿ったのではなく、予期せぬ侵入であり、捕らえられたPKK戦闘員は処分されると繰り返している。"
 TUR_pkk.206.a: "了解"
 TUR_pkk.207.t: "アルメニア軍、戦闘を停止"
 TUR_pkk.207.d: "国境でのアルメニア警備隊に対する一連の攻撃が成功した後、そこに駐留していた部隊は戦闘を停止し、東トルコ国境からアルメニアに逃げ込んだPKK戦闘員の捕獲を許可することに同意した。"
 TUR_pkk.207.a: "了解"
 TUR_pkk.208.t: "トルコ軍とアルメニア軍、停戦に合意"
 TUR_pkk.208.d: "アルメニアとトルコの国境警備隊間での一連の衝突の後、双方は武器を置き、停戦に合意した。"
 TUR_pkk.208.a: "了解"
 TUR_pkk.209.t: "部隊が適切な輸送手段を欠く"
 TUR_pkk.209.d: "Our troops have somehow managed to get themselves stranded on the way back to their base. Reportedly, PKK militants were able to sabotage much of the convoys used to transport the troops to the Eastern border."
 TUR_pkk.209.b: "前進を続けるよう伝えよ"
 TUR_pkk.209.a: "追加の輸送機を送れ"
 TUR_pkk.209.c: "回収できるものは何でも回収せよ"
 TUR_pkk.210.t: "PKK脱走兵とされる人物、情報提供を約束"
 TUR_pkk.210.d: "伝えられるところによると、PKKからの脱走兵が我が軍に投降し、ヴァン周辺に駐留するPKK部隊の重要な位置を明らかにすると約束した。もし彼が嘘をついていなければ、我々はその情報を利用して、彼が明かしたPKKの陣地を完全に破壊することができるだろう。"
 TUR_pkk.210.a: "彼は信用できない、独房に入れろ"
 TUR_pkk.210.b: "「奴らはどこだ？」"
 TUR_pkk.210.c: "「他に何を知っている？」"
 TUR_pkk.211.t: "誤情報が犠牲者を生む！"
 TUR_pkk.211.d: "It appears that the information given by the Alleged PKK double agent has been incorrect. As a result, we have lost several good men to this tragedy. Their blood will not be in vain, and our revenge will be swift!"
 TUR_pkk.211.a: "最悪だ"
 TUR_pkk.212.t: "情報が隠されたPKKの基地へと繋がる"
 TUR_pkk.212.d: "It appears that the information provided to us by the PKK double agent has led to the location of several PKK members at a hidden base. As a result, our men have been able to assault the location and take out several PKK terrorists."
 TUR_pkk.212.a: "素晴らしい！"
 TUR_pkk.214.t: "ヴァンでの作戦成功"
 TUR_pkk.214.d: "数十年にわたる戦いの末、大ヴァンにおける組織的なクルド人の抵抗は終焉を迎えた。トルコ国家の栄光ある旗がかつてないほど高く掲げられ、この地域の新たな始まりが、そこに住むあらゆる人々に新たな希望をもたらした。"
 TUR_pkk.214.a: "ついに終わった……"
 TUR_pkk.215.t: "中央ユーフラテスでの作戦成功"
 TUR_pkk.215.d: "数十年にわたる戦いの末、大中央ユーフラテス地域における組織的なクルド人の抵抗は終焉を迎えた。トルコ国家の栄光ある旗がかつてないほど高く掲げられ、この地域の新たな始まりが、そこに住むあらゆる人々に新たな希望をもたらした。"
 TUR_pkk.215.a: "ついに終わった……"
 TUR_pkk.216.t: "ディヤルバクルでの作戦成功"
 TUR_pkk.216.d: "数十年にわたる戦いの末、大ディヤルバクル地域における組織的なクルド人の抵抗は終焉を迎えた。トルコ国家の栄光ある旗がかつてないほど高く掲げられ、この地域の新たな始まりが、そこに住むあらゆる人々に新たな希望をもたらした。"
 TUR_pkk.216.a: "ついに終わった……"
 TUR_pkk.217.t: "[TUR.GetName]、PKKに対する勝利を宣言"
 TUR_pkk.217.d: "[TUR.GetAdjective]政府は最近、全ての主要なPKKの基地、支部、隠れ家が[TUR.GetAdjective]軍（TSK）によって掃討されたと宣言する声明を発表した。この発表は、[TUR.GetName]自体を含む中東全域のクルド人分離主義者を憂慮させている。PKKは1970年代に始まり、数十年にもわたって[TUR.GetName]で活動してきた。このクルド人グループは当初、現在のトルコ東部に独立国家を創設することを望んでいたが、その運動はすぐに完全な独立ではなく自治を求めるものへと変わっていった。[TUR.GetAdjective]政府はそのような圧力に屈することなく、ついにこの運動に対する勝利を宣言できるほどに達した。"
 TUR_pkk.217.a: "興味深い"
 TUR_pkk.604.t: "PKK、総動員を宣言"
 TUR_pkk.604.d: "PKKは我が政府に対して総動員を宣言し、本日未明の報道官の発表によると、「運動の全ての支持者、そして全ての自由の戦士は、夜明けに指揮官に報告せよ」とのことだ。この発表に続き、PKKはクルディスタン地域周辺の町への全面的な攻撃を開始し、公式に敵対行為を開始し、それらの地域に住む人々に大きな不安をもたらした。PKKが完全に根絶されるまで、まもなく非常事態が宣言される。"
 TUR_pkk.604.a: "本性を現したようだ……"
 TUR_pkk.600.t: "約束不履行による壊滅的な結果"
 TUR_pkk.600.d: "Our empty promises have now caught up to us. The Kurds that reside in the east of our state have seized control over Kurdish majority areas. We no longer formally control these territories, with our government being essentially powerless in making an immediate decision as a result of the bureaucratic process that we are stuck in."
 TUR_pkk.600.a: "なんてこった"
 TUR_pkk.601.t: "クルド自治住民投票が可決"
 TUR_pkk.601.d: "The Kurdish autonomy referendum has passed with an overwhelming majority of Kurds voting in favor of autonomization. With this referendum, the People's Republic of Kurdistan will become an Eyalet of [TUR.GetName]. The Kurdistan Workers' Party will be the ruling authority in the state, and they will be able to field an army, govern the laws and politics of the region, and hold elections as they see fit. We will still retain control over major industrial and economic sectors, but a fraction of the profits will still go to the Kurdish state."
 TUR_pkk.601.a: "了解"
 TUR_VAN_SELECTED_OP: "ヴァンが選択された"
 TUR_commence_operations_in_van: "ヴァンでの作戦開始"
 TUR_commence_operations_in_van_desc: "我が国におけるPKKの中心部に深く切り込む時が来た。我が国で最も東にある拠点であるヴァンを、PKKは西トルコやイランへの多くの攻撃の拠点として利用している。我々は彼らを排除するための作戦を開始し、ヴァンは長年そこに巣食っていた脅威から解放されるだろう。"
 TUR_PKK_ACTIVITY: "活動中の£TUR_Neutral_Communism PKKの反乱"
 TUR_PKK_ACTIVITY_desc: "PKKは"
 TUR_misak_mili: "ミサク・ミリー"
 TUR_misak_mili_desc: "\n£TUR_desctext_misak \n\n\n\n\n§HMisak-ı Millî§! (National Pact) was a set of six decisions passed by the parliament in the 1920's. Vitalized primarily after the destruction of the [TUR.GetFlag] Ottoman Empire at the hands of the Entente, the §HNational Pact§! sought out to restore some of Turkey's lost glory, and its lands. However the decisions were not followed through with due to the [TUR.GetFlag] Turkish war of independence and the establishment of the [TUR.GetFlag] Turkish Republic by Mustafa Kemal Ataturk. However the concept and ideals of the §HNational Pact§! still resonates within many [TUR.GetFlag] Turkish nationalists in the modern day, despite its lack of wide-spread support in the national populace."
 TUR_armenian_integration: "[ARM.GetFlag]アルメニアへの帰還"
 TUR_levantine_vilayets: "[SYR.GetFlag][LEB.GetFlag]レヴァント諸州"
 TUR_eastern_resolve: "[KUR.GetFlag][PUK.GetFlag]東方の決意"
 TUR_aegean_realignment: "[GRE.GetFlag]エーゲ海の再編"
 TUR_crescent_and_olive: "[CYP.GetFlag][NCY.GetFlag]三日月とオリーブ"
 TUR_kurdish_schools: "クルド語の学校と大学"
 TUR_kurdish_schools_desc: "我々が必要と判断した特定の学校や都市で、トルコ語と並行してクルド語の使用を許可する。これは、バイリンガルで育ったかどうかにかかわらず、特に若者にとって有益だろう。"
 TUR_kurdish_language_5: "クルド語国営チャンネル"
 TUR_kurdish_language_5_desc: "TRT (short for Türkiye Radyo Televizyon, Turkish Radio and Television) has been our official state TV since '68. Over the years, its numbers grew and there are now several channels of TRT, some of them are for general subjects or for example TRT-Müzik broadcasts only music or TRT-Belgesel broadcasts only documentaries. We should open up a new one that will operate in Kurdish language. This can cost more but will further discredit PKK propaganda."
 TUR_finalized_reforms: "改革を最終決定した"
 TUR_fight_army_incompetence: "イエスマンの軍隊"
 TUR_fight_army_incompetence_desc: "軍隊は改革され、再構築され、「イエス、サー」と言う人が増え、「ノー」と言う人が少なくなるようにするだろう。"
 Turkish_mafia.1200.t: "PKKの反乱が鎮圧された"
 Turkish_mafia.1200.d: "我が国の治安部隊は、クルド人地域全域での作戦を完了した。PKKがトルコ領土を脅かす能力は壊滅し、秩序が回復しつつある。"
 Turkish_mafia.1200.a: "ここでの仕事はこれで終わりだ。"
 Turkish_parties.11.t: "民権と平等党"
 Turkish_parties.11.d: "南東部での指揮で称賛され、支持者からは「伝説の司令官」として知られる退役将軍オスマン・パムコグルが、「民権と平等党」を結党した。同党は、強硬な世俗主義的ケマル主義とクルド問題に対する強硬路線を融合させ、既存の政党とは一線を画す民族主義的な選択肢として自らを位置づけている。"
 Turkish_parties.11.a: "新たな勢力が舞台に登場する"
 TUR_PKK_TT: "£decision_icon_small クルディスタン問題に関する追加の§Yディシジョン§!が§Y解放§!される\n - この選択肢を選べば、近隣諸国の支持を得たまま、PKKに対して行動を起こすことができる。\n - [PER.GetFlag]イラン、[SYR.GetFlag]シリア、[IRQ.GetFlag]イラク、そして[KUR.GetFlag]クルド人が、ディヤルバクルで開催される安全保障サミットに招待される予定だ。\n - 参加する隣国全てが、PKK弱体化の手助けをしてくれるだろう。"
 TUR_ai_build_the_akp: "Build the Party of Justice and Development"
 TUR_ai_build_the_akp_desc: "The remnants of the Virtue Party's reformist wing are organising a new movement, and the machine behind it is being assembled district by district."
 TUR_ai_rally_the_kemalists: "Rally the Republican Ranks"
 TUR_ai_rally_the_kemalists_desc: "The republican establishment is closing ranks and campaigning hard to keep the secular parties ahead of the field."
 TUR_ai_rally_the_grey_wolves: "Rally the Nationalist Movement"
 TUR_ai_rally_the_grey_wolves_desc: "The nationalist movement is organising in the provinces, and its rallies are drawing crowds the established parties can no longer match."
 TUR_ai_build_hizmet: "Expand the Hizmet Network"
 TUR_ai_build_hizmet_desc: "The movement's schools, newspapers and business associations are quietly building a following that no party list yet reflects."
 TUR_ai_rally_the_left: "Rally the Turkish Left"
 TUR_ai_rally_the_left_desc: "The revolutionary left is organising in the unions and the universities, taking the anti-establishment vote the Islamists have been living on."
 TUR_ai_rally_the_virtue_party: "Rally the Virtue Party"
 TUR_ai_rally_the_virtue_party_desc: "The Islamist movement is consolidating behind the Virtue Party, gathering the votes it will need to govern."
 TUR_ai_rally_the_great_east: "Preach the Great East"
 TUR_ai_rally_the_great_east_desc: "The movement's preachers are carrying Necip Fazıl's vision of a restored Islamic order into the mosques and the party's own rank and file."
 TUR_pkk.605.t: "Renewed Offensive in the Southeast"
 TUR_pkk.605.d: "The PKK has spent years rebuilding in the mountains while the government looked elsewhere, and the general staff will wait no longer. A state of emergency has been declared across the southeastern provinces, reservists are being called up, and the army is moving into the valleys in strength. The insurgency will be broken back down to a manageable size, but the bill will be a heavy one: in conscripts, in lira, and in the government's standing at home."
 TUR_pkk.605.a: "Whatever it takes."
 TUR_PKK_OFFENSIVE_TT: "The £TUR_Neutral_Communism  §OPKK Insurgency§! is beaten back down to a manageable strength, but it is not destroyed."
 TUR_fund_oil_strikes: "Funded Oil Industry Strikes"