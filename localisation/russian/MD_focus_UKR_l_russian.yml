 ukr_modernize_sov_equipment_s125_orders_tt: "Один дивизион уходит покупателю за §G0.04§! млрд — как позиция (§G+1§! к ПВО в одном из его регионов) или как §Y4§! мобильные пусковые установки. Нужно его мнение о нас не ниже §Y10§! или §Y0§!, если он уже покупал с наших складов.\nЕсли мы выберем одну страну Кавказа, две другие получат §R-10§! к мнению о нас."
 ukr_modernize_sov_equipment_s125_site_tt: "§G+1§! к ПВО в регионе [1087.GetName], [696.GetName], [1086.GetName] или [1085.GetName], если мы его контролируем и там есть место."
