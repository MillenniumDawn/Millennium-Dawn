l_braz_por:
 united_kingdom_focus: "Árvore de Foco do Reino Unido"
 ENG_royal_army: "British Army"
 ENG_royal_army_desc: "The British Army is the primary land force of the British Armed Forces, it can trace its roots back to the Scottish and English armies in 1707 when they were joined together in the Act of Union. It has been involved in almost all major wars, including the Seven Years War, Revolutionary War, Napoleonic Wars, Crimean War, and First & Second World Wars. In this time, it has evolved from a primarily Infantry force to a highly advanced and mechanised force with varying support elements and its world-class special forces, which have served as a benchmark for other international services"
 ENG_irish_referendum: "[GetYear] Referendo Norte-Irlandês de Independência [NIR.GetFlag]"
 ENG_irish_referendum_desc: "O povo [NIR.GetFlag] norte-irlandês votará em um referendo que determinará seu futuro como nação, constituinte e ator nas Ilhas Britânicas. A campanha corre até o dia da votação, e o resultado será o que a opinião norte-irlandesa tiver se tornado quando for contado. Westminster pode gastar capital político e dinheiro do Tesouro para influenciá-lo.\n\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_scottish_referendum: "[GetYear] Referendo Escocês de Independência [SCO.GetFlag]"
 ENG_scottish_referendum_desc: "O povo [SCO.GetFlag] escocês votará em um referendo que determinará seu futuro como nação, constituinte e ator nas Ilhas Britânicas. A campanha corre até o dia da votação, e o resultado será o que a opinião escocesa tiver se tornado quando for contado. Westminster pode gastar capital político e dinheiro do Tesouro para influenciá-lo.\n\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 britain_md.1.t: "Our Ambition for Britain"
 britain_md.1.d: "The people have spoken, and it has been decided that the Labour party is the party of choice the people wish to represent them moving forward. Our vision and ambition for Britain to truly be its best has no limits, and we shall begin to tackle the issues of our great union immediately."
 britain_md.2.t: "Taking Our Chances?"
 britain_md.2.d: "We are able to massively influence the national market by encouraging investments into certain niche industries. But doing so could potentially instill fear in investors who have invested their money in competing industries, causing a slight economic downturn. The cabinet is currently split on whether or not this move is the best one to make at this time."
 britain_md.3.t: "Making A Grand Promise"
 britain_md.3.d: "To captivate a wider voter base, we'll need to appeal to one of our internal factions. Doing so will not only demonstrate our ability to operate multiple sectors of government with efficiency, but it will also allow us to acquire a little bit of extra capital to fund other projects. Additionally with newly gained leverage over these factions we will be able to turn the tide in future elections against our political rivals."
 britain_md.4.t: "Who Do We Tax?"
 britain_md.4.d: "Nosso governo enfrenta uma situação singular. Para obter mais receita para o governo, precisaríamos aumentar impostos para financiar nossos programas de gastos sociais. No entanto, fazer isso irritará um segmento da população de um jeito ou de outro, e alertou-se contra a tributação generalizada, pois é provável que cause o maior dano à nossa reputação. Em vez disso, nosso gabinete propõe que tributemos um segmento da população para não irritar todo mundo."
 britain_md.5.t: "Britain Forward, Not Back"
 britain_md.5.d: "Devemos impedir a regressão da sociedade às profundezas da repressão que alguns de nossos opositores políticos continuam a defender. Lutaremos para manter a Grã-Bretanha avançando rumo ao futuro sem interrupção. Nossos valores, a ordem e a estabilidade não devem ser comprometidos em hipótese alguma, e lutaremos para garantir que permaneçamos no topo das urnas."
 britain_md.6.t: "Scraping British Skies"
 britain_md.7.t: "No One Left Behind"
 britain_md.7.d: "All around the world, be it in Europe, Asia, Africa, or the Americas, inequality continues to grow. With wages stagnating and prices skyrocketing, living in of itself has become a chore. For the citizens of the United Kingdom however, this does not have to be the case! With swift reforms and new policies, we will prove to the world that you do not have to succumb to this growing trend of inequality."
 britain_md.8.t: "Connections Between The Two?"
 britain_md.8.d: "Muitas pessoas da direita do espectro político declararam que o aumento da criminalidade está diretamente ligado ao aumento da migração nos últimos anos. Embora muitos refutem essas alegações, rotulando-as de xenófobas e intolerantes, outros afirmam que a causa é a incapacidade de alguns migrantes e refugiados de se assimilarem à cultura [ENG.GetAdjective]."
 britain_md.9.t: "It Can Always Be Better"
 britain_md.9.d: "Britain does not have to be like the rest of the world, it can be better. Through serious political reform we can move against the tide of demcoratic backsliding and make Britain the best version of itself that it could be. This time around, Labour has pledged to bring drastic social and political reform, with our message reaching the people of Britain like never before."
 britain_md.10.t: "Reconsideration of the Lobbying Act?"
 britain_md.10.d: "Some within our cabinet are increasingly calling on us to reconsider the lobbying act. Such a move of course, would cause an uproar and could lead to increased cases of corruption within the government. However, if we wanted to attain some quick support and funding for our party we may want to look into some modifications for the act at the very least.."
 britain_md.11.t: "Knocking Some Sense Into Britain"
 britain_md.11.d: "It's time that we bring some normality to this country riddled with chaos. Common sense seems to have been entirely discarded, as those in the Labour party have begun to pass reforms with irreversible damage. Our government shall push Britain towardsa stronger, more independent state, not one ran by Brussels or a cabinet of leftists."
 britain_md.12.t: "[FROM.GetName] Solicita Acesso Militar"
 britain_md.12.d: "Em aparente esforço para tornar a Europa um continente mais flexível em matéria de defesa, os [ENG.GetAdjective] decidiram enviar pedidos solicitando acesso militar. Embora realmente não ganhemos nada com isso, também basicamente não perderemos nada."
 britain_md.13.t: "British Involvement"
 britain_md.13.d: "The British government has vowed to assist us in fighting our enemies and protecting the sovereingty of our state. What they didn't make very clear was what they expected in return. We have recieved intelligence from a trusted source that the British government intends to seize our resources in Freetown for a period of 500 days if they hold a significant amount of influence over us. They intend to do this regardless of if we allow them to deploy troops or not."
 britain_md.14.t: "British Seize Our Resources!"
 britain_md.14.d: "The British have seized our resources because they hold a significant amount of influence over us. This will last a period of 500 days until they withdraw."
 britain_md.15.t: "End Of Mission: Barras"
 britain_md.15.d: "Our time in Sierra Leone is coming to an end, and we've begun preparation to remove institutions which have been transferring resources from Sierra Leone to be exported for British income."
 britain_md.16.t: "Coup in Gambia?"
 britain_md.16.d: "Chegou a hora de finalmente pôr fim ao Estado tirânico comandado por [GAM.GetLeader] na Gâmbia. Organizaremos a derrubada de seu governo, mas, se forçarmos demais a sorte, ele pode descambar para uma guerra civil e potencialmente sair de nossas mãos."
 britain_md.17.t: "Successful Coup in Gambia"
 britain_md.17.d: "We've successfully ousted the oppressive regime in Gambia and have installed our preferred government in charge. The people of Gambia will no longer suffer under needless oppression."
 britain_md.18.t: "Botched Coup in Gambia"
 britain_md.18.d: "Não tivemos sucesso em depor [GAM.GetLeader] e, como resultado, perdemos vários militares britânicos. Nossa tentativa de golpe está sendo vista com severo escrutínio internacional, e os laços com o governo gambiano pioraram."
 britain_md.19.t: "Incredibly Successful Coup in Gambia"
 britain_md.19.d: "Tivemos mais do que sucesso em nossos esforços na Gâmbia. Não só derrubamos o governo opressor, como também conseguimos estabelecer controle firme sobre o Estado, transformando-o essencialmente em um Estado satélite."
 britain_md.20.t: "Operation Delta Guard: Success"
 britain_md.20.d: "Tivemos sucesso em garantir campos de petróleo estratégicos no Delta, e forças nigerianas foram vistas recuando para o norte, rumo à sua capital. Não se sabe por enquanto se retaliarão ou não, mas por ora desfrutamos dos espólios de guerra."
 britain_md.21.t: "British Forces Seize Oil By the Delta"
 britain_md.21.d: "British forces have grossly violated our sovereignty, and have declared our sacred oil fields as under 'temporary protection', calling our government unstable and untrustworthy. We've got no idea as to why they have decided that military action is the best course of action moving forward, but one thing is for certain, we cannot take this lying on our backs."
 britain_md.22.t: "Nigeria Retaliates"
 britain_md.22.d: "Vários militares britânicos ficaram feridos e alguns foram até mortos em um ataque de retaliação das Forças Armadas Nigerianas. É uma resposta à nossa tomada de vários campos de petróleo no Delta, garantindo acesso vital ao petróleo do instável governo nigeriano. Devemos tomar a capital nigeriana para colocá-los em seu lugar."
 britain_md.23.t: "British Forces Withdraw"
 britain_md.23.d: "Temendo o poder das grandes Forças Armadas Nigerianas e a valente liderança de [NIG.GetLeader], as forças britânicas covardes se retiraram do Delta e cessaram todas as operações de petróleo. Saímos vitoriosos neste ponto e não esperamos mais retaliação britânica."
 britain_md.24.t: "Select An Agenda"
 britain_md.24.d: "Our party has won the election, it is time for us to select an agenda."
 britain_md.25.t: "United Kingdom - Information, Please Read"
 britain_md.25.d: "Olá! Parece que você escolheu o Reino Unido como seu país, esperamos que goste!\n\nVocê está jogando atualmente a Fase I do retrabalho do Reino Unido, que inclui uma árvore de focos retrabalhada, um conjunto de decisões e mecânicas de monarquia. Você pode se perguntar se vem mais por aí, e a resposta é sim, virá mais.\n\nFase II:\nNa Fase II você pode esperar um sistema de devolução ainda mais aprofundado e um sistema melhorado da Câmara dos Comuns.\n\nFase III:\nNa Fase III você pode esperar uma árvore de política externa ampliada, caminhos políticos adicionais e muito mais!\n\nSe tiver qualquer feedback sobre a árvore, avise-nos no nosso Discord, Reddit ou Github!\n\n - Equipe do MD Reino Unido"
 britain_md.26.t: "Forwards With a New Falklands Policy"
 britain_md.26.d: "Atualmente há pedidos crescentes para continuar trabalhando na integração das ilhas Falkland ou para tomar medidas adicionais. Embora a segunda opção possa ser um pouco agressiva, ela acabará compensando em nosso benefício a longo prazo. Há também aqueles que desejam que devolvamos as Falkland para consolidar nossa imagem na região da América do Sul."
 ENG_british_flag_on_the_moon: "Bandeira Britânica na Lua"
 ENG_british_flag_on_the_moon_desc: "Embarque em uma ambiciosa missão lunar enquanto o Reino Unido se empenha em estabelecer uma base britânica na Lua. Essa iniciativa lunar representa a dedicação da nação à exploração espacial, demonstrando proeza tecnológica e fomentando a inovação científica. Seja pioneiro na fronteira cósmica, elevando a posição global do Reino Unido no campo da exploração espacial."
 ENG_set_sail_to_mars: "Zarpar para Marte"
 ENG_set_sail_to_mars_desc: "Aventurando-se além dos limites da Terra, o Reino Unido ousa estabelecer uma presença em Marte. Essa iniciativa visionária se concentra na exploração pioneira de Marte, ampliando os limites da tecnologia espacial e posicionando o Reino Unido como protagonista na busca da humanidade pelo Planeta Vermelho. Abrace o desafio da conquista marciana, definindo o papel do Reino Unido no futuro da exploração interplanetária."
 ENG_new_thirteen_colonies: "Novas Treze Colônias"
 ENG_new_thirteen_colonies_desc: "Traçando um rumo para novas fronteiras, o Reino Unido se inspira na história, vislumbrando o estabelecimento de Novas Treze Colônias em Marte. Ecoando o espírito das treze colônias originais, essa ambiciosa iniciativa representa o compromisso do Reino Unido com o povoamento de Marte, abraçando os desafios da colonização interplanetária. Lidere a criação de um novo legado no Planeta Vermelho, onde pioneiros britânicos embarcam numa jornada que remete às raízes históricas da nação."
 ENG_asteroid_mining: "Mineração de Asteroides"
 ENG_asteroid_mining_desc: "Avance rumo ao cosmos com a Companhia Real Britânica de Mineração de Asteroides, enquanto o Reino Unido abraça a Colheita de Recursos Celestes. Com o objetivo de extrair recursos valiosos de asteroides, essa iniciativa simboliza a dedicação da nação ao uso pioneiro de recursos espaciais e à tecnologia de ponta."
 ENG_standardized_space_parts: "Peças Espaciais Padronizadas"
 ENG_standardized_space_parts_desc: "Revolucione a acessibilidade financeira da exploração espacial com o esforço por Peças Espaciais Padronizadas no Reino Unido. Ao simplificar e padronizar componentes, essa iniciativa visa tornar os empreendimentos espaciais mais econômicos, marcando o compromisso da nação em fomentar iniciativas espaciais acessíveis e baratas."
 ENG_virgin_galactic: "Virgin Galactic"
 ENG_virgin_galactic_desc: "Como pioneira da indústria de turismo espacial, a Virgin Galactic se empenha em tornar o cosmos acessível a todos. Com espaçonaves inovadoras e o compromisso de ampliar os limites da exploração espacial, a Virgin Galactic representa o papel do Reino Unido na formação do futuro das aventuras espaciais civis."
 ENG_british_commercial_spaceport: "Espaçoporto Comercial Britânico"
 ENG_british_commercial_spaceport_desc: "Com a corrida global pelo cosmos se intensificando, o Reino Unido reconhece a necessidade de garantir sua posição na fronteira da exploração espacial. O estabelecimento de um Espaçoporto Comercial Britânico é um foco fundamental para avançar a presença da nação em empreendimentos espaciais comerciais. Investindo na construção e no desenvolvimento de um espaçoporto dedicado, o Reino Unido aspira a fomentar a inovação, atrair parcerias internacionais e levar sua indústria aeroespacial a novos patamares, assegurando um futuro promissor como protagonista na fronteira cósmica."
 ENG_united_kingdom_space_command: "Comando Espacial do Reino Unido"
 ENG_united_kingdom_space_command_desc: "À medida que o cosmos se torna uma nova arena de influência estratégica, o Reino Unido reconhece a necessidade de consolidar seus esforços em operações espaciais. O estabelecimento do Comando Espacial do Reino Unido é um foco decisivo voltado a unificar e fortalecer as capacidades espaciais da nação. Centralizando o comando, fomentando operações conjuntas e investindo em tecnologias de ponta, o Reino Unido busca garantir seus interesses no domínio cósmico, assegurando uma presença formidável entre as estrelas e salvaguardando a segurança nacional na era espacial."
 ENG_istari_programme: "Programa ISTARI"
 ENG_istari_programme_desc: "Em resposta ao cenário global em evolução, o Reino Unido apresenta o Programa ISTARI, um ambicioso foco dedicado à Inteligência, Vigilância, Aquisição de Alvos e Reconhecimento no domínio cibernético."
 ENG_space_red_coats: "Fuzileiros Espaciais"
 ENG_space_red_coats_desc: "Inspirando-se em um passado glorioso, o Reino Unido revitaliza o legado dos Casacas Vermelhas com os Fuzileiros Espaciais do Século XXI. Evocando o espírito de resiliência histórica, esse foco impulsiona a exploração espacial britânica rumo a uma nova era. Vestidos no vermelho simbólico, os Casacas Vermelhas Espaciais procuram explorar o cosmos, encarnando a tradição de exploração e projetando a influência britânica pela vastidão celeste."
 ENG_1st_space_force_division: "1ª Divisão da Força Espacial"
 ENG_1st_space_force_division_desc: "Traçando um rumo além dos limites terrestres, o Reino Unido segue um caminho audaz com a criação da Divisão da Força Espacial Britânica. Sem precedentes na história, isso anuncia uma nova era à medida que a Grã-Bretanha estabelece sua primeira divisão espacial dedicada. Encarregada de salvaguardar os interesses celestes e abraçar o desconhecido, a Divisão da Força Espacial representa o compromisso da nação em explorar e proteger a fronteira cósmica, onde a Union Jack tremulará entre as estrelas."
 ENG_space_capabilities: "Capacidades no Ciberespaço"
 ENG_space_capabilities_desc: "Reconhecendo a importância primordial do domínio digital, o Reino Unido direciona seu foco para o aprimoramento das Capacidades no Ciberespaço. Numa era em que informação é poder, essa iniciativa representa o compromisso de fortalecer a capacidade da nação em operações no ciberespaço."
 ENG_strategic_defence_review: "Livro Branco de Defesa de [GetYear]"
 ENG_strategic_defence_review_desc: "Nossas prioridades e ameaças estão em constante mudança, e nossa burocracia militar deve evoluir para combatê-las. Coordenando uma nova resposta de segurança nacional com parceiros em todo o governo e com nossos aliados, podemos garantir que nossas Forças Armadas permaneçam adaptáveis à mudança e prontas para enfrentar as ameaças à segurança britânica."
 ENG_AS90: "AS90 'Braveheart'"
 ENG_AS90_desc: "O AS90, Sistema de Artilharia para os Anos 1990, também conhecido como Gun Equipment 155mm L131, é a principal artilharia autopropulsada blindada usada pelo Exército Britânico. Projetado e construído pela divisão de armamentos da Vickers Shipbuilding and Engineering entre 1982 e 1987, com a produção seguindo em 1992 e 179 veículos fabricados. Substituiu o antigo FV433 Abbot de 105mm e o antigo M109 SPG de 155mm. Foram propostos esforços para modernizar o AS90 com um cano maior, capaz de disparar armas de calibre 52, aumentando seu alcance sem assistência e com munição de alcance estendido."
 ENG_operation_excellence: "Comando Especial"
 ENG_utility_vehicle_modernisation: "Modernização de Veículos Utilitários"
 ENG_utility_vehicle_modernisation_desc: "Ficou claro, pelas experiências na Irlanda do Norte durante o período dos Troubles, que os atuais veículos utilitários de infantaria militar empregados pelo Exército, como o Snatch Land Rover, oferecem pouca ou nenhuma proteção contra IEDs e minas, e relatos de sobreviventes afirmam que chegam a ferir ativamente os que sobrevivem à explosão inicial. Por isso, o Ministério da Defesa começou a explorar opções para empregar veículos modernos com blindagem resistente a minas e proteção contra emboscadas, como o MRAP americano 'Cougar'"
 ENG_nlaw_anti_tank_system: "Sistema Antitanque NLAW"
 ENG_nlaw_anti_tank_system_desc: "O SAAB Bofors Dynamics NLAW, MBT LAW ou R85 é um sistema de mísseis leve, descartável, de disparo do ombro, do tipo dispare e esqueça, de linha de visada, projetado para uso da infantaria. Foi concebido pela SAAB para os Ministérios da Defesa do Reino Unido e da Suécia, no Reino Unido sob a Team NLAW, com diversos subcontratados, incluindo grande participação da Thales Air Defences."
 ENG_startstreak_anti_air_system: "Sistema Antiaéreo Starstreak"
 ENG_startstreak_anti_air_system_desc: "O Starstreak é um míssil superfície-ar britânico de curto alcance, tanto um sistema de defesa aérea portátil (MANPADS) quanto usado em diversas configurações em helicópteros e veículos para cobertura móvel. É fabricado pela Thales Air Defence em Belfast, Irlanda do Norte. Após o lançamento, o míssil acelera a velocidades acima de Mach 4, tornando-o o míssil superfície-ar de curto alcance mais rápido que existe. Ampliando seu potencial, ele lança três submunições guiadas por feixe de laser contra o alvo, aumentando a probabilidade de acerto."
 ENG_M270: "Recapitalizar o M270"
 ENG_M270_desc: "O Ministério da Defesa planeja investir na recapitalização dos sistemas lançadores de mísseis sobre lagartas M270 e de vários tipos de mísseis dos que estão em serviço, para complementar a compra de munições do Sistema de Foguetes de Lançamento Guiado. A intenção é introduzir novos motores, proteção blindada e sistemas de controle de tiro modernizados."
 ENG_mobile_fires_platform_program: "Programa de Plataforma de Fogos Móvel"
 ENG_mobile_fires_platform_program_desc: "Com o fim da Guerra Fria e a diminuição da expectativa de um conflito nas planícies alemãs, o estoque de sistemas de artilharia de 155mm do Exército declinou e, agora, com novas ameaças no horizonte, o Ministério da Defesa decidiu tomar medidas para ressuscitar essa capacidade. Vários candidatos para cumprir esse contrato se apresentaram, dos quais apenas um terá sucesso."
 ENG_fres_program: "Programa FRES"
 ENG_fres_program_desc: "O Programa FRES (Future Rapid Effect System) representa uma abordagem voltada ao futuro para o desenvolvimento de capacidades militares. Focado em agilidade e adaptabilidade, o FRES visa fornecer às Forças Armadas Britânicas uma gama versátil de plataformas terrestres, incluindo veículos blindados e sistemas de apoio."
 ENG_fix_civil_servant: "Consertando o 'Funcionário Público'"
 ENG_fix_civil_servant_desc: "Originalmente assolado por reclamações frequentes e problemas de desempenho entre as tropas, o fuzil L85A1 passou por uma atualização abrangente em resposta à sua manutenção difícil e operação pouco confiável. Frequentemente apelidado de 'funcionário público' por sua suposta falta de confiabilidade e funcionamento complexo, essas preocupações motivaram uma grande reformulação entre 2000 e 2002. Aproximadamente 200.000 dos 320.000 fuzis automáticos L85A1 existentes foram reformados."
 ENG_modern_littoral_force: "Força Litorânea Moderna"
 ENG_trident_nuclear_program: "Programa Nuclear Trident"
 ENG_general_dynamics_ajax: "General Dynamics Ajax"
 ENG_general_dynamics_ajax_desc: "O General Dynamics Ajax, um veículo de reconhecimento de última geração, tornou-se pedra angular dos esforços de modernização das Forças Armadas Britânicas. Projetado para atender às exigentes necessidades da guerra moderna, esse veículo blindado ágil e avançado integrou tecnologia de ponta, permitindo capacidades de reconhecimento incomparáveis."
 ENG_challenger_lethality_improvement_programme: "Programa de Melhoria de Letalidade do Challenger"
 ENG_challenger_lethality_improvement_programme_desc: "O Programa de Melhoria de Letalidade do Challenger foi um programa para substituir o atual canhão raiado L30A1 pelo canhão de alma lisa Rheinmetall de 120 mm usado atualmente no Leopard 2 e no M1 Abrams. O uso de uma arma de alma lisa teria permitido ao Challenger 2 empregar munição padrão da OTAN, incluindo penetradores de energia cinética à base de tungstênio, que não enfrentam as mesmas objeções políticas e ambientais que os projéteis de urânio empobrecido."
 ENG_challenger_3: "Challenger 3"
 ENG_challenger_3_desc: "O tanque Challenger 3, orgulhosamente desenvolvido pelo Reino Unido, personifica a guerra blindada de ponta. Com tecnologia de última geração, poder de fogo formidável e proteção aprimorada, o Challenger 3 garante superioridade no campo de batalha. Esse tanque modernizado ressalta o compromisso do Reino Unido em manter uma força blindada formidável, pronta para enfrentar os desafios da guerra contemporânea."
 ENG_modern_landing_craft: "Lanchas de Desembarque Modernas"
 ENG_mechanised_amphibious_assault: "Assalto Anfíbio Mecanizado"
 ENG_aircraft_ai_integration: "Integração de IA em Aeronaves"
 ENG_aircraft_ai_integration_desc: "Guiado pelo princípio de Qualidade sobre Quantidade, o Reino Unido prioriza a excelência e a superioridade tecnológica em suas forças militares. Esse espírito nacional enfatiza a aquisição de equipamentos avançados e sofisticados, garantindo uma postura de defesa formidável e tecnologicamente avançada. Ao focar na qualidade, o Reino Unido pretende maximizar a eficácia de suas forças, criando uma vantagem estratégica diante dos desafios modernos."
 ENG_strike_brigades: "Brigadas de Ataque"
 ENG_future_soldier_armed_forces: "Forças Armadas do Soldado do Futuro"
 ENG_future_soldier_armed_forces_desc: "A iniciativa Soldado do Futuro é uma estratégia voltada ao futuro adotada por forças armadas, incluindo as do Reino Unido. Ela se concentra em equipar os soldados com tecnologias e capacidades de ponta, aumentando sua eficácia no campo de batalha moderno."
 ENG_joint_expeditionary_force: "Força Expedicionária Conjunta"
 ENG_joint_expeditionary_force_desc: "Originada em 2012 e apresentada pelo então Chefe do Estado-Maior de Defesa, general Sir David Richards, a Força Expedicionária Conjunta (JEF) surgiu da dissolução da Força Conjunta de Reação Rápida (JRRF) durante a ênfase do Reino Unido nas operações no Afeganistão e no Iraque. Composta por pessoal e equipamento da Marinha Real, dos Fuzileiros Navais Reais, do Exército Britânico e da Força Aérea Real, o componente britânico da JEF prioriza uma integração mais elevada. Essa integração é enfatizada sobretudo ao atuar ao lado das forças armadas de outras nações, marcando uma mudança significativa em relação a modelos anteriores."
 ENG_carrier_group_debate: "Debate sobre o Grupo de Porta-Aviões"
 ENG_worldwide_reach: "Alcance Mundial"
 ENG_worldwide_reach_desc: "O Reino Unido já foi uma superpotência, com alcance pelo mundo para proteger seus interesses. Precisamos retornar a esse poder para manter nossos interesses em todo o globo"
 ENG_national_service_debate: "Debate sobre o Serviço Nacional"
 ENG_national_service_debate_desc: "Um exército baseado em voluntários não consegue acompanhar a crescente demanda por tropas britânicas pelo globo. Precisamos ampliar o recrutamento para atender à demanda"
 ENG_army_special_operations_brigade: "Brigada de Operações Especiais do Exército"
 ENG_reestablish_far_east_command: "Restabelecer o Comando do Extremo Oriente"
 ENG_reestablish_far_east_command_desc: "O restabelecimento britânico do Comando do Extremo Oriente marca uma reorientação estratégica rumo ao aprimoramento das capacidades militares nessa região crucial. Essa iniciativa envolve o desdobramento de estruturas de comando, unidades operacionais e apoio logístico para lidar de forma eficaz com a dinâmica de segurança em evolução. Fortalecendo a presença e a coordenação no Extremo Oriente, as Forças Armadas Britânicas pretendem responder com habilidade aos desafios regionais, fomentar parcerias com aliados e contribuir de forma significativa para a estabilidade geral dessa parte estrategicamente vital do mundo."
 ENG_britannia_armed_forces: "Forças Armadas Britannia"
 ENG_britannia_armed_forces_desc: "Com nossos esforços para recriar nosso poder militar mundial, finalmente podemos dizer que temos um exército capaz de defender o interesse britânico em todo o globo"
 ENG_allied_basing_efforts: "Esforços de Basing Aliado"
 ENG_allied_basing_efforts_desc: "A Iniciativa de Basing Aliado representa um compromisso unificado de fortalecer as capacidades estratégicas entre os países membros da aliança. Sob essa iniciativa, o Reino Unido se beneficia de uma melhoria sustentada e substancial em infraestrutura, incluindo ferrovias, bases aéreas, portos e mais. Essa melhoria duradoura aumenta a proeza logística do Reino Unido e sua eficácia operacional geral."
 ENG_reactivate_naval_defense_act_1889: "Reativar a Lei de Defesa Naval de 1889"
 ENG_reactivate_naval_defense_act_1889_desc: "Num aceno simbólico à proeminência marítima histórica, a Reativação da Lei de Defesa Naval de 1889 marca um compromisso voltado ao futuro de fortalecer as capacidades navais. Essa legislação visa canalizar o espírito do passado para a prontidão naval moderna. Ao revigorar os princípios da lei original, o Reino Unido sinaliza sua dedicação em manter uma força naval robusta e tecnologicamente avançada. A lei poderia incluir disposições para a modernização dos ativos navais, a expansão da infraestrutura naval e investimentos estratégicos para garantir que a Marinha Real continue sendo uma presença formidável no cenário mundial."
 ENG_royal_navy: "Marinha Real"
 ENG_royal_navy_desc: "A Marinha Real Britânica é uma das principais forças marítimas do mundo, com um legado glorioso que remonta a séculos. Reconhecida por sua adaptabilidade e proeza tecnológica, a Marinha Real desempenha um papel crucial na salvaguarda dos interesses marítimos do Reino Unido e na projeção de poder globalmente. "
 ENG_british_foreign_legion: "Legião Estrangeira Britânica"
 ENG_british_foreign_legion_desc: "Abraçando um modelo de serviço internacional, esta legião acolhe estrangeiros que desejam servir nas Forças Armadas Britânicas. Concebida para fomentar camaradagem, diversidade e um senso de propósito compartilhado, a Legião Estrangeira Britânica se torna um caminho único para indivíduos de diversas origens contribuírem para a defesa do Reino Unido."
 ENG_multi_ocean_navy: "Marinha Multioceânica"
 ENG_multi_ocean_navy_desc: "Para proteger os interesses britânicos pelo mundo, precisamos ampliar nossas capacidades navais para atacar através dos oceanos"
 ENG_Strategic_Aircraft_Training: "Treinamento de Aeronaves Estratégicas"
 ENG_Strategic_Aircraft_Training_desc: "Nos tempos modernos, é necessário ter uma força aérea capaz de atacar através de todos os oceanos. Precisamos ampliar nossas operações de aeronaves estratégicas para ter essa possibilidade."
 ENG_field_army_expansion: "Expansão do Exército de Campanha"
 ENG_field_army_expansion_desc: "A iniciativa de Expansão do Exército de Campanha marca um compromisso estratégico do Reino Unido de reforçar suas forças terrestres, garantindo uma capacidade militar robusta e adaptável. Essa expansão envolve aumentar o tamanho e as capacidades do exército de campanha, que engloba as principais forças terrestres do Exército Britânico."
 ENG_type_31_frigate_inspiration_class: "Fragata Type 31 Classe Inspiration"
 ENG_type_31_frigate_inspiration_class_desc: "A Type 31 é a metade de uso geral da força de fragatas, encomendada em 2019 a um preço fixo de 250 milhões de libras por navio. A Babcock constrói as cinco em Rosyth, no projeto Arrowhead 140, derivado da classe dinamarquesa Iver Huitfeldt, um grande casco dieselétrico com canhão Bofors de 57mm, Sea Ceptor e margem deliberada para crescimento futuro. Inspiration, Active, Bulldog, Campbeltown e Formidable revivem nomes de toda a história da frota."
 ENG_multi_role_support_ship_project: "Projeto de Navio de Apoio Multimissão"
 ENG_multi_role_support_ship_project_desc: "O Navio de Apoio Multimissão é o substituto pretendido para os Albion, Bulwark e a classe Bay em um único casco flexível. Em vez de um navio-doca construído para um grande desembarque, ele é projetado em torno de um compartimento de missão, um convoo e alojamentos modulares, de modo que a mesma embarcação possa transportar uma força de incursão de comandos, conduzir uma operação de ajuda em desastres ou servir de base avançada para sistemas não tripulados."
 ENG_expanded_carrier_wing_procurement: "Aquisição de Ala Aérea Ampliada de Porta-Aviões"
 ENG_expanded_carrier_wing_procurement_desc: "Ao investir em uma ala aérea de porta-aviões ampliada, o Reino Unido pretende projetar poder, proteger interesses marítimos e contribuir de forma significativa para os esforços de segurança internacional. Essa iniciativa reflete a dedicação da nação em manter uma aviação naval moderna e capaz no cenário de segurança global em rápida evolução."
 ENG_strategic_aircraft_strategy: "Estratégia de Aeronaves Estratégicas"
 ENG_strategic_aircraft_strategy_desc: "A Estratégia de Aeronaves Estratégicas define a abordagem do Reino Unido para a aquisição, o desdobramento e a utilização de ativos de aeronaves estratégicas. Essa estratégia abrangente engloba uma série de considerações, incluindo prioridades de defesa nacional, desafios de segurança global e avanços tecnológicos."
 ENG_continent_operational_considerations: "Considerações Operacionais Continentais"
 ENG_continent_operational_considerations_desc: "Precisamos priorizar nosso compromisso com nossas forças armadas e aliados. Portanto, precisamos escolher em qual ramo do nosso exército nos especializaremos."
 ENG_astute_class: "Submarino Classe Astute"
 ENG_astute_class_desc: "A classe Astute é a mais recente classe de submarinos de ataque de propulsão nuclear em serviço na Marinha Real. Os submarinos estão sendo construídos pela BAE Systems Submarines em Barrow-in-Furness."
 ENG_type_45_destroyer_upgrades: "Melhorias do Contratorpedeiro Type 45"
 ENG_type_45_destroyer_upgrades_desc: "O projeto de Melhorias do Contratorpedeiro Type 45 visa aprimorar as capacidades dos contratorpedeiros Type 45 da Marinha Real por meio de tecnologia avançada e melhorias de sistemas. As principais áreas de foco incluem radar, sistemas de combate, propulsão e aprimoramentos na defesa antimíssil."
 ENG_dreadnought_class: "Submarino Classe Dreadnought"
 ENG_dreadnought_class_desc: "O projeto de Submarino Classe Dreadnought envolve o projeto, a construção e a integração dos submarinos de mísseis balísticos de próxima geração da Marinha Real. Esses submarinos contarão com furtividade, propulsão e capacidades de armas estratégicas avançadas, garantindo uma capacidade de dissuasão nuclear crível para o Reino Unido."
 ENG_type_26_frigate: "Fragata Type 26"
 ENG_type_26_frigate_desc: "A Type 26, chamada de classe City em homenagem a Glasgow, Cardiff, Belfast e suas irmãs, é a metade antissubmarino da força de fragatas. Construída pela BAE Systems no Clyde a partir de 2017, é organizada em torno da redução acústica: uma planta dieselétrica e de turbina a gás montada sobre balsas, o sonar de arrasto Sonar 2087 e um compartimento de missão no meio do navio para botes, contêineres e sistemas não tripulados. Oito navios escoltarão os porta-aviões e a dissuasão, com outros cascos vendidos à Austrália e ao Canadá."
 ENG_type_83_destroyer: "Contratorpedeiro Type 83"
 ENG_type_83_destroyer_desc: "O contratorpedeiro Type 83 é uma futura classe de contratorpedeiros de mísseis guiados prevista para integrar a frota da Marinha Real em meados ou fins da década de 2030. Essa classe proposta promete capacidades avançadas e recursos modernizados para atender às necessidades navais em evolução. Projetado para versatilidade e potência, o Type 83 representa um avanço fundamental nas capacidades marítimas da Marinha Real, garantindo prontidão e eficácia em futuros ambientes operacionais."
 ENG_qinetiq_dragonfire_system: "Sistema Dragonfire da Qinetiq"
 ENG_qinetiq_dragonfire_system_desc: "O Dragonfire representa um demonstrador tecnológico britânico de ponta de arma a laser de energia dirigida. Apresentado na conferência Defence and Security Equipment International, em Londres, em 2017, é desenvolvido pela UK Dragonfire, um esforço colaborativo que envolve a MBDA UK, a Leonardo UK, a QinetiQ e o Defence Science and Technology Laboratory. Como demonstrador tecnológico fundamental, o Dragonfire passará por testes rigorosos para avaliar armas a laser de energia dirigida e suas aplicações prospectivas nas Forças Armadas Britânicas, marcando um avanço significativo na inovação militar e no desenvolvimento de capacidades."
 ENG_auxiliary_royal_navy: "Marinha Real Auxiliar"
 ENG_auxiliary_royal_navy_desc: "A Marinha Real Auxiliar refere-se historicamente a navios tripulados por civis que apoiam e complementam as operações da Marinha Real em tempos de conflito ou crise."
 ENG_revitalise_merchant_navy: "Revitalizar a Marinha Mercante"
 ENG_revitalise_merchant_navy_desc: "O Império Britânico foi fundado no comércio, e nossa frota mercante global é nossa glória e nossa base. Que nossa frota mercante volte a se espalhar pelo mundo."
 ENG_bay_slass_landing_ships: "Navios de Desembarque Classe Bay"
 ENG_bay_slass_landing_ships_desc: "Os navios de desembarque da classe Bay são embarcações anfíbias versáteis projetadas para apoiar uma série de operações militares, incluindo assistência humanitária, ajuda em desastres e missões de assalto anfíbio. Essas embarcações têm um grande convoo e uma doca alagável para lançar e recuperar lanchas de desembarque e veículos anfíbios."
 ENG_river_class_patrol_boat: "Patrulha Classe River"
 ENG_river_class_patrol_boat_desc: "As patrulhas da classe River servem como embarcações de patrulha oceânica versáteis, empregadas em segurança marítima, proteção de fronteiras e tarefas de aplicação da lei. Com seus sistemas avançados de vigilância e comunicação, essas patrulhas policiam com eficácia as águas costeiras, salvaguardando a integridade territorial e os interesses marítimos. Projetadas para autonomia e flexibilidade, as embarcações da classe River desempenham papel crítico no aumento da segurança marítima e na defesa da lei marítima nas águas do Reino Unido e além."
 ENG_point_class_sealift_ships: "Navios de Transporte Marítimo Classe Point"
 ENG_point_class_sealift_ships_desc: "Os navios de transporte marítimo da classe Point são ativos vitais da frota da Royal Fleet Auxiliary, projetados para transportar carga e equipamentos militares em apoio a operações expedicionárias. Essas embarcações roll-on/roll-off oferecem capacidades versáteis de manuseio de carga, permitindo o carregamento e descarregamento eficiente de veículos e suprimentos em diversos portos e ambientes marítimos. Com sua capacidade de transporte estratégico, os navios da classe Point contribuem significativamente para as capacidades logísticas do Reino Unido, facilitando o rápido desdobramento de forças e equipamentos militares em cenários de paz e de conflito."
 ENG_bae_cv90_MkIV: "BAE CV90 Mk IV"
 ENG_bae_cv90_MkIV_desc: "O BAE CV90 Mk IV é uma versão atualizada do veículo de combate de infantaria CV90, com tecnologia avançada e melhorias para a guerra moderna. Oferece mobilidade, capacidade de sobrevivência e poder de fogo aprimorados, tornando-se um ativo formidável para as unidades de infantaria blindada no campo de batalha."
 ENG_expand_sandhurst_academy: "Expandir a Academia de Sandhurst"
 ENG_expand_sandhurst_academy_desc: "A Academia Militar Real de Sandhurst (RMAS) é uma das principais instituições de treinamento militar do mundo, reconhecida por seus programas rigorosos e pelo compromisso de formar líderes militares excepcionais. Fundada em 1802, a RMAS é o principal estabelecimento de formação de oficiais do Exército Britânico, bem como de diversos aliados e parceiros internacionais."
 ENG_soldier_welfare_initiative: "Iniciativa de Bem-Estar do Soldado"
 ENG_soldier_welfare_initiative_desc: "Ao priorizar o bem-estar de nossos soldados e suas famílias, essa iniciativa demonstra nosso compromisso de honrar seu serviço e sacrifício, ao mesmo tempo em que fomenta uma comunidade militar solidária e resiliente."
 ENG_mgcs_program: "Programa MGCS"
 ENG_mgcs_program_desc: "O Main Ground Combat System (MGCS) é um programa de veículo de combate blindado de próxima geração projetado para fornecer capacidades avançadas às forças terrestres em cenários de guerra moderna. Como esforço colaborativo entre Alemanha e França, o MGCS visa desenvolver um carro de combate principal versátil e tecnologicamente avançado, capaz de operar com eficácia em diversos ambientes de campo de batalha."
 ENG_royal_airforce_modernisation: "Modernização da Força Aérea Real"
 ENG_royal_airforce_modernisation_desc: "Por meio da Modernização da RAF, a Força Aérea Real reafirma seu compromisso de manter a superioridade aérea, projetar poder e salvaguardar os interesses nacionais em um ambiente de segurança global cada vez mais complexo e disputado."
 ENG_watchkeeper_wk450: "Watchkeeper WK450"
 ENG_watchkeeper_wk450_desc: "O Watchkeeper WK450 é um sistema aéreo não tripulado avançado projetado para operações de inteligência, vigilância e reconhecimento (ISR). Desenvolvido pelo Thales Group, esse VANT de média altitude e longa autonomia (MALE) oferece uma gama de sensores e câmeras sofisticados para vigilância em tempo real e aquisição de alvos. Com sua autonomia e capacidade de voo autônomo, o Watchkeeper WK450 dá às forças militares maior consciência situacional e a capacidade de coletar inteligência crítica em diversos ambientes operacionais."
 ENG_reaper_purchase: "Compra do Reaper"
 ENG_reaper_purchase_desc: "Forças militares ao redor do mundo adquiriram o MQ-9 Reaper para aprimorar suas capacidades de inteligência, vigilância e reconhecimento (ISR), bem como para realizar ataques de precisão contra alvos de alto valor. A capacidade do Reaper de permanecer sobre áreas-alvo por longos períodos e seu conjunto avançado de sensores fazem dele um ativo valioso para coletar inteligência em tempo real e dar apoio às forças terrestres."
 ENG_missile_development: "Desenvolvimento de Mísseis"
 ENG_missile_development_desc: "Precisamos modernizar nossas Capacidades de Mísseis para continuar sendo uma força aérea moderna"
 ENG_electronic_warfare_measures: "Medidas de Guerra Eletrônica"
 ENG_electronic_warfare_measures_desc: "Precisamos modernizar nossa computação para nos mantermos seguros contra ataques cibernéticos"
 ENG_nato_joint_airforce_training: "Treinamento Conjunto de Forças Aéreas da OTAN"
 ENG_nato_joint_airforce_training_desc: "Por meio de cenários simulados, exercícios reais e eventos de treinamento conjunto, as forças aéreas participantes desenvolvem e aprimoram suas capacidades em áreas como combate aéreo, operações ar-solo, reabastecimento em voo e defesa aérea. Essas atividades de treinamento fomentam o entendimento mútuo, a confiança e a cooperação entre as forças aéreas aliadas, garantindo que possam operar juntas sem percalços em ambientes de coalizão e responder com eficácia a desafios de segurança regionais e globais."
 ENG_c19_globemasters: "C-17 Globemasters"
 ENG_c19_globemasters_desc: "O C-17 Globemaster III é uma aeronave de transporte aéreo estratégico versátil, utilizada por forças aéreas do mundo todo para missões de transporte rápidas e de longo alcance. Fabricada pela Boeing, essa aeronave de carga pesada é capaz de transportar grandes cargas, incluindo tropas, veículos e ajuda humanitária, a locais remotos e pistas rudimentares. Com sua aviônica avançada, projeto de asa alta e capacidade de decolagem e pouso curtos (STOL), o C-17 Globemaster III desempenha papel crucial no apoio a operações militares e humanitárias em todo o globo."
 ENG_airbus_a400m: "Airbus A400M"
 ENG_airbus_a400m_desc: "O Airbus A400M é uma aeronave de transporte militar moderna projetada para atender aos requisitos operacionais de várias forças aéreas do mundo. Com configuração de asa alta e motores turboélice avançados, o A400M oferece desempenho excepcional, incluindo capacidade de decolagem e pouso curtos (STOL), longo alcance e a capacidade de operar a partir de pistas semipreparadas."
 ENG_nimrod_mra4: "Nimrod MRA4"
 ENG_nimrod_mra4_desc: "O Nimrod MRA4 era uma versão modernizada da icônica aeronave de patrulha marítima Nimrod, destinada a fornecer capacidades aprimoradas para guerra antissubmarino, vigilância marítima e missões de busca e salvamento. Com sensores avançados, sistemas de comunicação e equipamentos de missão, o Nimrod MRA4 oferecia desempenho e versatilidade melhores que seu predecessor."
 ENG_apache_wah64: "AgustaWestland Apache"
 ENG_apache_wah64_desc: "A aquisição e o emprego do helicóptero Augusta Westland Apache marcaram um avanço significativo no arsenal de combate aéreo do Reino Unido. Foram feitas várias alterações no projeto padrão do Apache, incluindo um motor Rolls Royce atualizado, mecanismo de pás dobráveis para armazenamento, proteção contra gelo no rotor e maior capacidade de foguetes. Introduzido para reforçar as capacidades aéreas da nação, esse sofisticado helicóptero de ataque simboliza um salto na tecnologia da aviação militar e na eficácia operacional estratégica."
 ENG_boeing_p8_poseidon: "Boeing P8 Poseidon"
 ENG_boeing_p8_poseidon_desc: "O Boeing P-8 Poseidon é uma aeronave de patrulha marítima multimissão projetada para guerra antissubmarino de longo alcance, guerra antissuperfície e operações de inteligência, vigilância e reconhecimento. Baseado no avião comercial Boeing 737, o P-8 Poseidon conta com sensores avançados, sistemas de comunicação e capacidades de armamento, tornando-o uma plataforma altamente eficaz para missões de patrulha marítima."
 ENG_revive_p125_project: "Reviver o Projeto P125"
 ENG_revive_p125_project_desc: "O projeto P125 revivido busca desenvolver uma plataforma de aeronave versátil e econômica, capaz de cumprir diversos papéis, incluindo superioridade aérea, apoio aéreo aproximado, reconhecimento e treinamento. Ao incorporar aviônica, sensores e sistemas de armas de ponta, a aeronave P125 modernizada oferecerá desempenho, capacidade de sobrevivência e eficácia de missão aprimorados."
 ENG_joint_strike_fighter_project: "Projeto Joint Strike Fighter"
 ENG_joint_strike_fighter_project_desc: "Com capacidades avançadas de furtividade, tecnologia de fusão de sensores e capacidades de missão multifunção, o F-35 Joint Strike Fighter oferece consciência situacional e letalidade incomparáveis em operações ar-ar e ar-solo."
 ENG_bae_systems_tempest: "BAE Systems Tempest"
 ENG_bae_systems_tempest_desc: "O BAE Systems Tempest é um conceito de caça de sexta geração de ponta, projetado para atender às necessidades em evolução da guerra aérea moderna. Com tecnologia avançada de furtividade, capacidades de fusão de sensores e sistemas autônomos, o Tempest está pronto para entregar desempenho, capacidade de sobrevivência e letalidade aprimorados em ambientes de espaço aéreo disputado."
 ENG_defence_industrial_policy: "Política Industrial de Defesa"
 ENG_defence_industrial_policy_desc: "A Política Industrial de Defesa Britânica delineia o arcabouço estratégico que orienta o desenvolvimento, a gestão e a sustentabilidade da base industrial de defesa da nação. Com uma rica herança de inovação e excelência, a indústria de defesa do Reino Unido desempenha papel fundamental no apoio aos objetivos de segurança nacional, na promoção da prosperidade econômica e na manutenção da liderança tecnológica no cenário mundial."
 ENG_cayman_enterprise_city: "Cayman Enterprise City"
 ENG_cayman_enterprise_city_desc: "A Cayman Enterprise City é uma zona econômica especial nas Ilhas Cayman, oferecendo uma plataforma única para empresas internacionais estabelecerem presença física em uma jurisdição de neutralidade tributária. Com processos simplificados e incentivos, oferece um ambiente propício para que empresas de setores como tecnologia, biotecnologia e mídia prosperem e cresçam."
 ENG_illex_fishery: "Pesqueiro de Illex"
 ENG_illex_fishery_desc: "O Pesqueiro de Illex é parte vital da economia das Ilhas Malvinas, voltado à captura sustentável da espécie de lula Illex. Gerido com cuidado para garantir a viabilidade de longo prazo, o pesqueiro sustenta os meios de subsistência locais e contribui para a segurança alimentar e a estabilidade econômica da região."
 ENG_north_mole_power_plant: "Usina Elétrica de North Mole"
 ENG_north_mole_power_plant_desc: "Localizada em Gibraltar, a Usina Elétrica de North Mole desempenha papel crucial no atendimento às necessidades de energia do território. Equipada com tecnologia e infraestrutura modernas, fornece geração de eletricidade confiável, sustentando o dia a dia e as atividades econômicas dos moradores e empresas de Gibraltar."
 ENG_biras_creek_resort: "Biras Creek Resort"
 ENG_biras_creek_resort_desc: "Aninhado nas Ilhas Virgens Britânicas, o Biras Creek Resort oferece um refúgio luxuoso em meio a uma beleza natural deslumbrante. Conhecido por suas praias isoladas, acomodações sofisticadas e serviço personalizado, oferece uma fuga idílica para viajantes que buscam relaxamento e renovação em um paraíso tropical."
 ENG_bermuda_innovation_sprint: "Sprint de Inovação das Bermudas"
 ENG_bermuda_innovation_sprint_desc: "O Sprint de Inovação das Bermudas é uma iniciativa voltada a fomentar a inovação e o empreendedorismo na ilha. Por meio de programas de aceleração, mentoria e oportunidades de financiamento, apoia startups e empreendimentos de tecnologia no desenvolvimento de soluções inovadoras e na promoção do crescimento econômico nas Bermudas."
 ENG_princes_lodge_plantation: "Plantação Princes Lodge"
 ENG_princes_lodge_plantation_desc: "A Plantação Princes Lodge é uma propriedade histórica em Santa Helena, que mostra o rico patrimônio cultural e as tradições agrícolas da ilha. Com seu cenário pitoresco e arquitetura colonial preservada, oferece aos visitantes um vislumbre do passado da ilha, ao mesmo tempo em que contribui para o turismo cultural e os esforços de preservação do patrimônio local."
 ENG_beaches_turks_caicos: "Beaches Turks Caicos"
 ENG_beaches_turks_caicos_desc: "O Beaches Turks and Caicos é um destino de resort de luxo all-inclusive, famoso por suas praias intocadas, comodidades sofisticadas e ambiente familiar. Oferecendo uma ampla gama de atividades e opções de entretenimento, proporciona uma experiência de férias inesquecível para hóspedes de todas as idades nas Ilhas Turks e Caicos."
 ENG_little_bay_port_development_project: "Projeto de Desenvolvimento do Porto de Little Bay"
 ENG_little_bay_port_development_project_desc: "O Projeto de Desenvolvimento do Porto de Little Bay visa melhorar a infraestrutura e as perspectivas econômicas de Montserrat, desenvolvendo uma instalação portuária moderna em Little Bay. Com capacidades de transporte e logística aprimoradas, busca estimular o comércio, o turismo e as oportunidades de investimento na ilha."
 ENG_pitcairn_islands_study_center: "Centro de Estudos das Ilhas Pitcairn"
 ENG_pitcairn_islands_study_center_desc: "O Centro de Estudos das Ilhas Pitcairn é uma instituição de pesquisa dedicada ao estudo e à preservação da história, da cultura e da biodiversidade das Ilhas Pitcairn. Por meio de seus arquivos, publicações e programas educacionais, promove a conscientização e a valorização desses territórios remotos e únicos."
 ENG_share_vtol_research: "Compartilhar Pesquisa de VTOL"
 ENG_share_vtol_research_desc: "Compartilhar Pesquisa de VTOL envolve iniciativas de colaboração e troca de conhecimento entre partes interessadas da indústria e instituições de pesquisa para avançar a tecnologia de decolagem e pouso vertical (VTOL)"
 ENG_channel_homegrown_innovation: "Canalizar a Inovação Nacional"
 ENG_channel_homegrown_innovation_desc: "Ao apoiar startups nacionais, instituições de pesquisa e pequenas empresas, busca-se catalisar o desenvolvimento de tecnologias e soluções de ponta que enfrentem os principais desafios e oportunidades do setor. Por meio de colaboração, apoio financeiro e construção de ecossistema, pretende-se posicionar o Reino Unido como líder global em inovação aeronáutica, impulsionando o crescimento econômico e a competitividade."
 ENG_revive_british_aviation_industry: "Reviver a Indústria Aeronáutica Britânica"
 ENG_revive_british_aviation_industry_desc: "Ao promover investimento, inovação e desenvolvimento de competências, busca-se revitalizar as capacidades de produção nacionais, aumentar a resiliência da cadeia de suprimentos e criar empregos de alta qualidade em todo o país."
 ENG_focus_on_component_manufacturing: "Foco na Fabricação de Componentes"
 ENG_focus_on_component_manufacturing_desc: "Ao investir em tecnologias de manufatura avançada, treinamento da força de trabalho e medidas de resiliência da cadeia de suprimentos, pretende-se capturar maior valor e competitividade no mercado aeroespacial global. Por meio de parcerias com OEMs, fornecedores de camadas e organizações de pesquisa, busca-se promover inovação, eficiência e qualidade em todo o ecossistema de componentes aeroespaciais."
 ENG_us_uk_collaboration: "Colaboração EUA-Reino Unido"
 ENG_us_uk_collaboration_desc: "Os EUA estão sempre em busca de bons parceiros. Ao abraçar os Projetos Aeronáuticos Britânicos, poderíamos trabalhar juntos para receber mais financiamento e dar a eles um pouco da nossa inovação"
 ENG_skylon_engine: "Motor Skylone"
 ENG_skylon_engine_desc: "O Motor Skylone representa um empreendimento revolucionário na indústria aeroespacial do Reino Unido, voltado ao desenvolvimento de sistemas de propulsão de próxima geração. Por meio de engenharia avançada, ciência dos materiais e modelagem computacional, essa iniciativa visa projetar e fabricar motores a jato de alto desempenho que ofereçam eficiência, confiabilidade e sustentabilidade excepcionais."
 ENG_rebirthing_black_arrow: "Renascimento do Black Arrow"
 ENG_rebirthing_black_arrow_desc: "O Renascimento do Black Arrow comemora o legado do programa Black Arrow, um histórico projeto britânico de veículo lançador espacial. Essa iniciativa visa reviver e modernizar o espírito da exploração espacial no Reino Unido, desenvolvendo capacidades avançadas de lançamento e tecnologias de satélites."
 ENG_lightweight_fire_platform_artillery: "Artilharia de Plataforma de Fogo Leve"
 ENG_lightweight_fire_platform_artillery_desc: "O projeto de Artilharia de Plataforma de Fogo Leve visa desenvolver e empregar um sistema de artilharia versátil e móvel, otimizado para desdobramento rápido e apoio de fogo de precisão. Aproveitando materiais leves, princípios de projeto modular e sistemas avançados de controle de tiro, essa iniciativa busca aumentar a agilidade, a capacidade de resposta e a letalidade das unidades de artilharia em diversos ambientes operacionais."
 ENG_harpoon_replacement: "Substituição do Harpoon"
 ENG_harpoon_replacement_desc: "O programa de Substituição do Harpoon se concentra em desenvolver um sistema de mísseis antinavio de próxima geração para substituir os envelhecidos mísseis Harpoon do arsenal militar britânico. Aproveitando tecnologias avançadas de guiagem, propulsão e designação de alvos, essa iniciativa visa dar às forças navais maior alcance, precisão e letalidade contra ameaças de superfície em ambientes marítimos."
 ENG_codify_service_economy: "Codificar a Economia Baseada em Serviços"
 ENG_codify_service_economy_desc: "Por décadas, a Grã-Bretanha tem derivado para um modelo baseado em serviços. Finanças, consultoria e mídia preenchendo a lacuna deixada por fábricas fechadas. É hora de transformar essa deriva em estratégia explícita."
 ENG_gate_burton_energy: "Construir o Parque de Energia de Gate Burton"
 ENG_gate_burton_energy_desc: "O Parque de Energia de Gate Burton transformará terras agrícolas perto de Gate Burton, em Lincolnshire, em um grande complexo solar e de baterias, injetando energia limpa na Rede Nacional e ajudando a substituir a geração envelhecida a carvão e gás."
 ENG_ai_white_collar: "IA para o Trabalho de Colarinho Branco"
 ENG_ai_white_collar_desc: "De escritórios de advocacia a firmas de contabilidade, sistemas de IA começam a lidar com análises e documentos de rotina. Empregos desaparecem, margens sobem."
 ENG_empower_city_london: "Fortalecer a City de Londres"
 ENG_empower_city_london_desc: "Ao flexibilizar as regras de planejamento e apoiar novas torres na Square Mile, incentivamos bancos e empresas de serviços a ampliar sua presença. Novos espaços de escritório de Grau A na City surgirão mais rápido, ancorando o papel de Londres como centro financeiro global."
 ENG_empower_edinburgh: "Fortalecer o Distrito Financeiro de Edimburgo"
 ENG_empower_edinburgh_desc: "Ao apoiar novos escritórios de Grau A e infraestrutura em torno da New Town e do distrito de Exchange, ajudamos os bancos e gestoras de ativos de Edimburgo a expandir sua presença, fortalecendo o segundo centro financeiro do Reino Unido fora de Londres."
 ENG_found_invest_northern_ireland: "Fundar a Invest Northern Ireland"
 ENG_found_invest_northern_ireland_desc: "Criamos a Invest Northern Ireland para divulgar a região no exterior e atrair um fluxo constante de novas fábricas, escritórios e estaleiros."
 ENG_digital_government: "Reformulação do Governo Digital"
 ENG_digital_government_desc: "Digitalizamos os serviços públicos, a tributação, o licenciamento e os benefícios, reduzindo a papelada e cortando custos."
 ENG_invest_silicon_glenn: "Investir no Silicon Glen"
 ENG_invest_silicon_glenn_desc: "Canalizamos recursos para o Silicon Glen da Escócia, ampliando laboratórios e parques tecnológicos para acelerar a pesquisa em computação, internet e inteligência artificial."
 ENG_cross_border_cooperation: "Cooperação Transfronteiriça"
 ENG_cross_border_cooperation_desc: "Aprofundamos a cooperação prática entre a Irlanda do Norte e a Irlanda, cortando a burocracia e impulsionando o comércio e a influência transfronteiriços."
 ENG_national_data_infrastructure: "Infraestrutura Nacional de Dados"
 ENG_national_data_infrastructure_desc: "Implantamos fibra em todo o país, centros de dados e redes de backbone para acelerar as conexões digitais, ampliar o alcance da cadeia de suprimentos e aumentar a produtividade em toda a economia."
 ENG_admiral_group: "Parceria com o Admiral Group"
 ENG_admiral_group_desc: "Trabalhamos com o Admiral Group, em Cardiff, para ampliar a cobertura de seguros privados, aliviando a pressão sobre os orçamentos de assistência social e saúde."
 ENG_fintech_open_banking: "Polo de Fintech e Open Banking"
 ENG_fintech_open_banking_desc: "Transformamos o Reino Unido em um polo líder de fintech e open banking, aumentando a arrecadação de impostos corporativos e reduzindo o custo do endividamento do governo."
 ENG_global_consulting_state: "Estado de Consultoria Global"
 ENG_global_consulting_state_desc: "Apoiamos consultorias e escritórios de advocacia britânicos no mundo todo, ampliando nossa influência, aprofundando vínculos de pesquisa e atraindo mais investimento estrangeiro."
 ENG_lean_manufacturing: "Manufatura Enxuta"
 ENG_lean_manufacturing_desc: "Ao implantar robótica, sensores e fluxos de trabalho just-in-time em nossas fábricas, substituímos o trabalho braçal repetitivo por linhas automatizadas. As fábricas consomem mais energia, mas empregam menos trabalhadores, enquanto a produção e a eficiência crescem a cada ciclo produtivo."
 ENG_cloud_isles: "Ilhas da Nuvem"
 ENG_cloud_isles_desc: "Transformamos a Grã-Bretanha em um polo de vastos data centers e campi de computação em nuvem. Os escritórios consomem mais energia para alimentar os servidores, mas os serviços digitais hospedados neles geram maior arrecadação de impostos e avanços de pesquisa mais rápidos."
 ENG_algorithmic_finance: "Finanças Algorítmicas"
 ENG_algorithmic_finance_desc: "Implantamos mecanismos avançados de risco e sistemas automatizados de tesouraria para gerir fluxos de caixa, dívida e pagamentos, reduzindo a burocracia e baixando os custos de funcionamento do governo."
 ENG_invest_harland_wolff: "Investir na Harland & Wolff"
 ENG_invest_harland_wolff_desc: "Injetamos capital novo nos estaleiros da Harland & Wolff em Belfast e além, reabrindo carreiras de lançamento, contratando trabalhadores qualificados e aumentando a produção de nossos estaleiros."
 ENG_critical_minerals_strategy: "Estratégia de Minerais Críticos"
 ENG_critical_minerals_strategy_desc: "Lançamos uma estratégia nacional de minerais críticos, apoiando novos projetos na Cornualha, no País de Gales e além para garantir minérios essenciais e melhorar o acesso da Grã-Bretanha a recursos vitais."
 ENG_dogger_bank_offshore: "Polo de Energia Offshore de Dogger Bank"
 ENG_dogger_bank_offshore_desc: "Apoiamos o complexo eólico offshore de Dogger Bank, no Mar do Norte, construindo o maior parque eólico do mundo para levar energia limpa a milhões de lares britânicos."
 ENG_hinkley_point_c: "Concluir Hinkley Point C"
 ENG_hinkley_point_c_desc: "Seguimos em frente com o projeto de dois reatores de Hinkley Point C, em Somerset, adicionando mais de 3 GW de energia de base de baixo carbono e longo prazo à rede."
 ENG_acknowledge_industrial_collapse: "Reconhecer o Colapso Industrial"
 ENG_acknowledge_industrial_collapse_desc: "De Redcar, em Teesside, a Port Talbot, no sul do País de Gales, os altos-fornos esfriaram e comunidades inteiras perderam sua espinha dorsal industrial. Precisamos finalmente admitir o quanto a indústria pesada da Grã-Bretanha decaiu antes de podermos reconstruí-la."
 ENG_building_brittain_fit_future: "Construindo uma Grã-Bretanha Preparada para o Futuro"
 ENG_building_brittain_fit_future_desc: "Lançamos uma estratégia industrial de longo prazo para aumentar a produtividade e o poder de ganho, investindo em ideias, pessoas, infraestrutura e regiões em toda a Grã-Bretanha."
 ENG_northern_powerhouse: "Northern Powerhouse e Midlands Engine"
 ENG_northern_powerhouse_desc: "Unimos o Northern Powerhouse e o Midlands Engine em um único corredor de crescimento, apoiando transporte, qualificação e investimento empresarial para elevar a produtividade de Liverpool e Manchester, passando por Birmingham, até as Midlands Orientais."
 ENG_aerospace_wales: "Aeroespacial do País de Gales"
 ENG_aerospace_wales_desc: "Apoiamos o polo aeroespacial galês em torno da Airbus em Broughton, St Athan e do amplo centro de MRO, impulsionando a produção local de asas, os serviços de reparo e empregos de alto valor na aviação."
 ENG_marine_power_systems: "Apoiar a Marine Power Systems"
 ENG_marine_power_systems_desc: "Apoiamos a Marine Power Systems, sediada no País de Gales, para ampliar plataformas flutuantes de energia eólica e das ondas, transformando estaleiros e portos locais em polos de energia marinha de nova geração."
 ENG_develop_edinburgh_west_end: "Desenvolver o West End de Edimburgo"
 ENG_develop_edinburgh_west_end_desc: "Transformamos o distrito de Exchange, no West End, em uma mistura mais densa de escritórios, laboratórios e oficinas modernas, aumentando a produção de pesquisa e a eficiência produtiva local e criando novo espaço para nossas principais facções se expandirem."
 ENG_develop_bae_aerospace: "Desenvolver a BAE Aerospace na Escócia"
 ENG_develop_bae_aerospace_desc: "Expandimos a presença aeroespacial da BAE em torno de Prestwick e de outros locais escoceses, adicionando novos hangares, oficinas e equipes de engenharia para apoiar aeronaves de combate avançadas e programas futuros."
 ENG_glasgow_shipbuilidng: "Polo de Construção Naval de Glasgow"
 ENG_glasgow_shipbuilidng_desc: "Modernizamos os estaleiros do Clyde em Govan e Scotstoun, transformando Glasgow em um polo de longo prazo para a construção de navios militares e exportações navais."
 ENG_high_value_manufacturing_zones: "Zonas de Manufatura de Alto Valor"
 ENG_high_value_manufacturing_zones_desc: "Designamos zonas de manufatura de alto valor em torno de centros no estilo Catapult e parques científicos, dando às empresas acesso mais rápido a laboratórios, qualificação e instalações modernas para elevar a produtividade e a produção avançada."
 ENG_high_value_manufacturing_zones_tt: "Se um estado tiver §G5§! de §Y$infrastructure$§!, pelo menos §G10§! de §Y$industrial_complex$§!, pelo menos §G5§! de §Y$offices$§!, pelo menos §G5§! de §Y$arms_factory$§! OU §G5§! de §Y$dockyard$§! , adicionaremos por estado:"
 ENG_steel_guarantee: "Garantia do Aço"
 ENG_steel_guarantee_desc: "Comprometemos financiamento e garantias de longo prazo para projetos de aço de baixo carbono, dando aos investidores a confiança para modernizar as usinas e assegurar a produção siderúrgica nacional por décadas."
 ENG_steel_guarantee_tt: "§Y[10.GetName],[11.GetName],[12.GetName]§! ou §Y[1191.GetName]§! receberá:\nMais de §Y4 $industrial_complex$§!: §G+6§! de §Y$country_resource_steel$§!.\nMais de §Y4 $offices$§!: §G+3§! de §Y$country_resource_tungsten$§!.\nQualquer §YInstalação§! e §Y$sp_improved_synthetic_diamonds$§! concluídos: mais §G+3§! de §Y$country_resource_chromium$§!."
 ENG_celsa_steel: "Apoiar a Celsa Steel Cardiff"
 ENG_celsa_steel_desc: "Apoiamos a siderúrgica de forno elétrico a arco e o laminador de vergalhões e fio-máquina da Celsa em Cardiff, elevando a produção de vergalhão e fio-máquina de baixo carbono e mantendo uma grande recicladora e empregadora galesa em plena capacidade."
 ENG_expand_scottish_steel: "Expandir o Aço Escocês"
 ENG_expand_scottish_steel_desc: "Investimos nas usinas de Dalzell e Clydebridge para retomar a produção de chapas, garantir aço escocês para navios de guerra e energia eólica offshore e fazer crescer uma base moderna de aço pesado ao norte da fronteira."
 ENG_refine_natural_bauxite: "Refinar Bauxita Natural"
 ENG_refine_natural_bauxite_desc: "Construímos instalações de alumina em torno de Edimburgo para refinar bauxita importada em matéria-prima de alta qualidade, aumentando a produção nacional de alumínio da Escócia."
 ENG_deep_mining_coal: "Reviver a Mineração Profunda de Carvão na Escócia"
 ENG_deep_mining_coal_desc: "Reabrimos as jazidas profundas das antigas regiões carboníferas da Escócia, abrindo novos poços e reconstruindo a infraestrutura das minas para restaurar a produção subterrânea de carvão ao norte da fronteira."
 ENG_opencast_mining: "Expandir a Mineração a Céu Aberto na Escócia"
 ENG_opencast_mining_desc: "Licenciamos novos sítios a céu aberto nas regiões carboníferas da Escócia, removendo a camada superficial para alcançar veios rasos e aumentando o suprimento nacional de carvão."
 ENG_cononish_gold_silver: "Mina de Ouro e Prata de Cononish"
 ENG_cononish_gold_silver_desc: "Apoiamos a mina de Cononish, perto de Tyndrum, transformando o único depósito comercial de ouro e prata da Escócia em uma fonte estável de metais preciosos para a nação."
 ENG_national_productivity_commission: "Comissão Nacional de Produtividade"
 ENG_national_productivity_commission_desc: "Estabelecemos uma Comissão Nacional de Produtividade para alinhar as políticas de investimento, infraestrutura e inovação em torno de uma única missão: elevar a produtividade em toda a Grã-Bretanha."
 ENG_infrastructure_for_productivty: "Estratégia Nacional de Infraestrutura"
 ENG_infrastructure_for_productivty_desc: "Implementamos uma Estratégia Nacional de Infraestrutura voltada a estradas, ferrovias e redes digitais que elevam a produtividade em vez de freá-la."
 ENG_universaties_engines_of_growth: "Fundo Strength in Places"
 ENG_universaties_engines_of_growth_desc: "Lançamos um fundo no estilo Strength in Places, apoiando parcerias entre universidades e empresas em toda a Inglaterra para transformar pontos fortes de pesquisa locais em empregos, investimento e crescimento."
 ENG_hs2: "Lançar o High Speed 2"
 ENG_hs2_desc: "Damos sinal verde ao High Speed 2, autorizando a primeira fase entre Londres e as Midlands e comprometendo-nos com décadas de investimento em novas ferrovias de alta velocidade."
 ENG_northern_powerhouse_rail: "Northern Powerhouse Rail"
 ENG_northern_powerhouse_rail_desc: "Comprometemo-nos com o Northern Powerhouse Rail, uma rede leste-oeste nova e modernizada que liga Liverpool, Manchester, Leeds e o restante do Norte com trens mais rápidos e frequentes e maior capacidade para passageiros e cargas."
 ENG_euston_canary_wharf_integration: "Integrar Euston e Canary Wharf"
 ENG_euston_canary_wharf_integration_desc: "Conectamos o terminal do HS2 em Euston à rede ferroviária e de metrô leste-oeste de Londres, criando ligações diretas com a City e Canary Wharf para que os passageiros da alta velocidade cheguem aos distritos financeiros da capital em minutos."
 ENG_midland_main_lines: "Modernização da Midland Main Line"
 ENG_midland_main_lines_desc: "Avançamos com a modernização e eletrificação da Midland Main Line entre Londres e as Midlands Orientais, reduzindo tempos de viagem e liberando capacidade para passageiros e cargas."
 ENG_russel_group: "Universidades do Russell Group"
 ENG_russel_group_desc: "Aprofundamos os laços com as universidades de pesquisa intensiva do Russell Group, apoiando projetos conjuntos que transformam ciência de classe mundial em crescimento em todo o país."
 ENG_golden_triangle_research: "Arco de Pesquisa do Triângulo Dourado"
 ENG_golden_triangle_research_desc: "Aprofundamos os vínculos entre Oxford, Cambridge e as principais universidades de Londres, construindo um arco de pesquisa do Triângulo Dourado que concentra laboratórios, talentos e financiamento de classe mundial em um único corredor de inovação de alto impacto."
 ENG_imperial_king_tech_clusters: "Polos Tecnológicos do Imperial e do King's"
 ENG_imperial_king_tech_clusters_desc: "Ligamos o campus de inovação de White City do Imperial aos polos de tecnologia e saúde do King's, construindo clusters densos onde laboratórios, startups e investidores podem transformar pesquisa de ponta em avanços comerciais."
 ENG_skill_england_technical: "Skills England e Trajetórias Técnicas"
 ENG_skill_england_technical_desc: "Trabalhamos com a Skills England para mapear lacunas de qualificação e ampliar as vias técnicas e os aprendizados, oferecendo a mais pessoas caminhos claros e de qualidade para o trabalho qualificado."
 ENG_closing_britains_productivity_gap: "Fechar a Lacuna de Produtividade da Grã-Bretanha"
 ENG_closing_britains_productivity_gap_desc: "Depois de anos de investimento direcionado em infraestrutura, universidades e qualificação, nossa lacuna de produtividade finalmente começa a se fechar, elevando a produção por trabalhador e dando à economia espaço para salários mais altos e serviços melhores."
 ENG_closing_britains_productivity_gap_tt: "Podemos reverter a penalidade de produtividade pesquisando §Y$CAT_infrastructure$§!"
 ENG_ambitions_for_britain: "Ambições para a Grã-Bretanha"
 ENG_ambitions_for_britain_desc: "A Grã-Bretanha não pode ser deixada para apodrecer enquanto o tempo passa. A Grã-Bretanha deve ser ambiciosa e, para isso, o povo britânico precisa do Partido Trabalhista. Com determinação, o Partido Trabalhista lançará o Reino Unido ao posto de um dos maiores atores globais de nossa era. O novo milênio será nosso."
 ENG_deeper_prosperity: "Prosperidade Mais Profunda"
 ENG_deeper_prosperity_desc: "Alcançaremos uma prosperidade mais profunda criando mais empregos e incentivando nosso povo a buscar oportunidades de trabalho. Isso só será possível criando um ambiente sustentável, sobretudo por meio de uma infraestrutura adequada."
 ENG_every_region_of_the_country: "Todas as Regiões do País"
 ENG_every_region_of_the_country_desc: "Nossos esforços não se restringirão aos grandes centros da sociedade; não, darão prioridade a todas as regiões do país. Afinal, somos uma união. Sem a distribuição equitativa de recursos, o Estado se fraturará e criará desigualdades para grandes populações urbanas e rurais."
 ENG_the_foundation: "A Fundação"
 ENG_the_foundation_desc: "A fundação, o pilar e a espinha dorsal deste país é o trabalhador dedicado que passa incontáveis horas a serviço da nação. Iniciar reformas que permitam mais flexibilidade no local de trabalho em relação a feriados, folgas e licenças médicas será uma mudança importante para manter forte esse pilar da sociedade."
 ENG_nhs_reform: "Reforma do NHS"
 ENG_nhs_reform_desc: "O Serviço Nacional de Saúde precisa desesperadamente de reforma. Não apenas uma mudança superficial em que pedimos a construção de novos hospitais e instalações médicas; não, em vez disso, defenderemos a sincronização dos setores privado e público para melhorar o NHS, de modo a reduzir os tempos de espera, modernizar as instalações existentes e receber mais pacientes de forma mais ágil."
 ENG_reinassaince_of_status: "Renascimento do Status"
 ENG_reinassaince_of_status_desc: "Nosso povo precisa poder subir na escala social e progredir economicamente. Por isso, devemos intervir cedo em suas vidas. Ao conceder aos centros de ensino superior as ferramentas de que precisam, poderemos disponibilizar com mais facilidade os recursos de que nosso povo necessita para avançar na sociedade."
 ENG_a_grand_promise: "Uma Grande Promessa"
 ENG_a_grand_promise_desc: "Para manter o apoio ao nosso partido, precisaremos fazer uma grande promessa que cative nosso eleitorado. Cumprindo essa promessa, poderemos consolidar a credibilidade de nossa coalizão e desferir um golpe duro em nossa oposição."
 ENG_more_frontline_staff: "Mais Pessoal na Linha de Frente"
 ENG_more_frontline_staff_desc: "Precisamos fomentar a produtividade agrícola incentivando mais pessoal de linha de frente a ir para o local de trabalho. Por meio de programas de incentivo, poderemos reconstruir o espírito agrícola vacilante de nosso país."
 ENG_foster_the_tech_revolution: "Fomentar a Revolução do Silício"
 ENG_foster_the_tech_revolution_desc: "Uma nova revolução se desenrola diante de nossos olhos: a revolução do silício. Por meio da tecnologia, as economias globais começam a mudar como nunca antes. Antigas sociedades rurais e agrícolas começaram a se transformar em algumas das economias mais formidáveis por meio de microchips e outros eletrônicos. Nós também devemos começar a tirar proveito dessa nova tendência o quanto antes."
 ENG_uplift_traditional_industry: "Elevar a Indústria Tradicional"
 ENG_uplift_traditional_industry_desc: "Não precisamos da moda eletrônica na qual boa parte do mundo está tão envolvida. Em vez disso, podemos nos concentrar no que sabemos ter funcionado historicamente: a indústria pura e dura. Por que arriscar com coisas tão insignificantes que poderiam pôr em risco nossa economia?"
 ENG_prioritize_the_teachers: "Priorizar os Educadores"
 ENG_prioritize_the_teachers_desc: "Valorizar o papel dos educadores na sociedade trará enormes benefícios que ecoarão por toda a nação e a região. Ao estabelecer seu papel na vida dos civis [ENG.GetAdjective] comuns, as pessoas finalmente começarão a apreciar a educação pelo que ela realmente é."
 ENG_prioritize_the_doctors: "Priorizar os Médicos"
 ENG_prioritize_the_doctors_desc: "Os médicos são o que impede as pessoas de morrer, o que impede a propagação de doenças e o que mantém uma sensação mais ampla de segurança em nosso país. Ao ajudar a elevar o papel dos médicos e da equipe médica, também poderemos incentivar mais pessoas a preencher vagas do NHS que estão seriamente desfalcadas."
 ENG_strengthening_communities: "Fortalecer as Comunidades"
 ENG_strengthening_communities_desc: "Fortalecer as comunidades e, por tabela, fortalecer a identidade britânica nos permitirá cultivar um maior senso de unidade nacional. Isso nos permitirá proteger os valores que mais prezamos, ao mesmo tempo em que criamos coesão social de maneira mais eficiente."
 ENG_to_europa_and_beyond: "Rumo à Europa e Além!"
 ENG_to_europa_and_beyond_desc: "Somos europeus primeiro, britânicos depois. Esquecer nosso lar regional é esquecer quem somos. Devemos buscar uma integração mais profunda com o continente europeu e com a União Europeia como um todo, para que possamos apoiar a visão mais grandiosa de todos os povos europeus."
 ENG_no_one_left_behind: "Ninguém Deixado para Trás"
 ENG_no_one_left_behind_desc: "Nenhum britânico será deixado para trás em nossa corrida rumo à grandeza. Todos serão ajudados e levados até a linha de chegada da sociedade e, juntos, suportaremos esta grande luta rumo ao sucesso."
 ENG_criminal_justice_reform: "Reforma da Justiça Criminal"
 ENG_criminal_justice_reform_desc: "Fortalecer nosso sistema de justiça também fortalecerá, por sua vez, nossas antigas normas democráticas. Ao simplificar o processo judicial, a confiança em nossas instituições democráticas também aumentará e será mais provável estabelecer apoio de longo prazo ao governo."
 ENG_welfare_reform: "Reforma do Bem-Estar Social"
 ENG_welfare_reform_desc: "Estabelecer uma relação de credibilidade com nosso eleitorado só poderá ser alcançado reformando nosso sistema de bem-estar social. Ao mostrar que nos importamos com o dia a dia deles, poderemos lhes dar uma dúzia de razões para continuarem a nos eleger."
 ENG_tax_reform: "Reformas Tributárias"
 ENG_tax_reform_desc: "§R'E-espera.. para onde foi meu dinheiro?!'§!\n\nAo aprovar reformas tributárias, não só poderemos fortalecer nossa economia e tesouro, como também avançaremos no financiamento de nossos programas de reforma social. Embora possa ser um pouco impopular entre aqueles que serão tributados."
 ENG_productivity_challenge: "O Desafio da Produtividade"
 ENG_productivity_challenge_desc: "Está cada vez mais difícil fazer alguns de nossos trabalhadores, bem... trabalharem. Ao promover algumas mudanças, talvez consigamos empurrá-los a fazer algo produtivo novamente."
 ENG_britain_forward_not_back: "Grã-Bretanha para a Frente, Não para Trás"
 ENG_britain_forward_not_back_desc: "Só precisamos olhar adiante para ver aonde estamos indo e, se não assumirmos o controle de nosso futuro, nosso destino ficará nas mãos do acaso. Não queremos isso. Queremos conduzir nosso país rumo à grandeza e isso só poderá ser alcançado estabelecendo primeiro o que devemos fazer para chegar lá."
 ENG_competition_planning_and_regulation: "Planejamento e Regulação da Concorrência"
 ENG_competition_planning_and_regulation_desc: "Não podemos ter concorrência sem regulação. Sem as devidas salvaguardas, as corporações sairão dos trilhos e absorverão empresas menores, eliminando essencialmente a receita de milhares, se não milhões."
 ENG_new_rights_new_choices: "Novos Direitos, Novas Escolhas"
 ENG_new_rights_new_choices_desc: "Ao dar ao nosso povo mais direitos sobre quando querem trabalhar, poderemos aumentar a produtividade nacional. Atualmente, certos locais de trabalho restringem as vagas a quem não ultrapassou a idade de aposentadoria, e os que a ultrapassaram são lentamente afastados. Ao dar a quem está acima do limite de aposentadoria a possibilidade de trabalhar novamente, traremos maior estabilidade econômica."
 ENG_supporting_science: "Apoiar a Ciência"
 ENG_supporting_science_desc: "Com o apoio a novos métodos de escavação científica, poderemos aumentar nossa capacidade de abastecer programas de pesquisa nacionais e de exportar mais bens no cenário internacional."
 ENG_codify_key_of_convetions: "Codificar a Chave das Convenções"
 ENG_codify_key_of_convetions_desc: "Ao finalmente codificar a Chave das Convenções, transformaremos regras políticas em regras jurídicas. Nossa política não será mais ditada pela tradição, mas pela lei, e com isso poderemos avançar rumo a uma democracia melhor."
 ENG_generations_of_tomorrow: "As Gerações de Amanhã"
 ENG_generations_of_tomorrow_desc: "Reformar o sistema de pensões nos permitirá finalmente estabelecer uma rede de segurança concreta para nossas gerações atuais e futuras. Atualmente, muitos recebem um benefício baixo demais, ou nenhum, e já é hora de fazermos algo a respeito."
 ENG_fostering_entrepreneurship: "Fomentar o Empreendedorismo"
 ENG_fostering_entrepreneurship_desc: "Queremos inovadores inundando nosso país e, para isso, precisamos começar a destinar alguns fundos do governo à criação de um ambiente sustentável para aqueles dispostos a investir virem para cá."
 ENG_modern_transport_infrastructure: "Modernização da Infraestrutura de Transportes"
 ENG_modern_transport_infrastructure_desc: "Se nossas estradas estão todas ruins e quebradas, de que adianta dirigir? Investir em programas de infraestrutura novos e inovadores abrirá caminho para uma Grã-Bretanha melhor e mais funcional."
 ENG_thriving_rural_scene: "Um Cenário Rural Próspero"
 ENG_thriving_rural_scene_desc: "Nossos povoados rurais não podem ser deixados aos ventos da história e esquecidos. Em vez disso, abraçaremos essas áreas rurais e incentivaremos ainda mais suas atividades."
 ENG_scraping_the_skies: "Arranhando os Céus"
 ENG_scraping_the_skies_desc: "Se quisermos construir nossa imagem no cenário internacional, precisaremos de algumas torres, especificamente torres que deslumbrem o mundo por sua magnificência."
 ENG_creative_cities: "Cidades Criativas"
 ENG_creative_cities_desc: "Ao fomentar influências culturais para projetar novos espaços urbanos, criaremos as condições perfeitas para fortalecer o espírito e o moral de nosso povo, onde quer que vá."
 ENG_party_of_pensior_poverty: "O Partido da Pobreza dos Aposentados"
 ENG_party_of_pensior_poverty_desc: "Os Conservadores, os Tories, ou o 'Partido da Pobreza dos Aposentados', como gostamos de chamá-los, estão degradando a integridade de nosso setor de bem-estar e arruinando ativamente o sustento daqueles que dependem das pensões para sobreviver. Devemos dar um passo para garantir que o povo tenha ciência de suas práticas retrógradas."
 ENG_fostering_home_ownership: "Fomentar a Casa Própria"
 ENG_fostering_home_ownership_desc: "Em vez de incentivar as pessoas a viver de verbas do governo, vamos ajudá-las a adquirir casas para si e seus entes queridos. Assim, poderão descansar tranquilas sabendo que não vivem em um lote que não lhes pertence."
 ENG_social_housing: "Programas de Habitação Social"
 ENG_social_housing_desc: "Sejamos realistas: os preços dos imóveis começam a disparar e não há sinais de que vão parar. Devemos impulsionar programas de habitação social que ofereçam ao nosso eleitorado um teto sobre a cabeça e proteção contra as intempéries da natureza."
 ENG_copyright_in_a_digital_age: "Direitos Autorais na Era Digital"
 ENG_copyright_in_a_digital_age_desc: "Nossas leis de direitos autorais atualmente não estão onde precisam estar, com muitas cláusulas omitidas ou pouco claras. Devemos codificar nossas regulamentações e conceder mais proteção à mídia."
 ENG_strengthening_our_grids: "Fortalecer Nossas Redes"
 ENG_strengthening_our_grids_desc: "Nosso povo precisa de energia forte, confiável e constante para levar seus dias. Uma queda aleatória aqui e ali é inevitável, mas não deveria ser parte do dia a dia. Fortalecendo nossas principais redes, garantiremos a confiabilidade de nosso setor energético."
 ENG_strengthen_pension_credit: "Fortalecer o Crédito de Pensão"
 ENG_strengthen_pension_credit_desc: "Ao oferecer um benefício do governo a pessoas acima da idade da pensão estatal e com baixa renda, poderemos elevar sua renda semanal a um nível mínimo e ajudar com custos de moradia e outras despesas."
 ENG_the_workers_of_yesterday: "Os Trabalhadores de Ontem"
 ENG_the_workers_of_yesterday_desc: "Não podemos deixar que o trabalho de ontem seja desperdiçado; ampliaremos os programas de pensão para os aposentados e talvez até ofereçamos benefícios adicionais se decidirem transmitir sua experiência às novas gerações."
 ENG_tenant_regulation: "Regulamentação de Inquilinos"
 ENG_tenant_regulation_desc: "Não devemos abandonar os proprietários que alugam imóveis para outros. As propriedades devem ser respeitadas e, portanto, as regulamentações são um fator necessário para garantir que todos fiquem satisfeitos."
 ENG_a_future_fair_for_all: "Um Futuro Justo para Todos"
 ENG_a_future_fair_for_all_desc: "Parece que, à medida que o mundo evolui, as condições de vida das pessoas continuam a piorar. Após a empolgação que se seguiu ao alvorecer do novo milênio, a esperança fez as pessoas do mundo acreditarem que seus governos finalmente mudariam para melhor. Isso, porém, não aconteceu. O retrocesso democrático, o aumento dos custos e o caos generalizado desviaram o mundo de seu caminho. Devemos fazer tudo o que estiver ao nosso alcance para garantir que o Reino Unido não caia nessa espiral da morte."
 ENG_crime_and_immigration: "Crime e Migração"
 ENG_crime_and_immigration_desc: "Houve pedidos de maiores restrições aos migrantes vindos da direita. Embora entendamos de onde vêm, ceder às suas exigências significaria nos afastar dos princípios centrais de nosso partido e caminhar em uma direção mais conservadora."
 ENG_democratic_reform: "Aprofundar a Reforma Democrática"
 ENG_democratic_reform_desc: "Atualmente, existem certas brechas que permitem que decisões mais autocráticas sejam tomadas no nível estadual. É hora de tomarmos as rédeas e finalmente apresentar ao parlamento um projeto de lei que force a mão daqueles que se beneficiam dessa ambiguidade política."
 ENG_a_global_future: "Um Futuro Global"
 ENG_a_global_future_desc: "Não podemos nos concentrar apenas nos assuntos do Estado; devemos também dar atenção às questões globais. Levando em conta a soberania de outros Estados, buscaremos espalhar a influência [ENG.GetAdjective] por todo o mundo."
 ENG_national_renewal: "Renovação Nacional"
 ENG_national_renewal_desc: "A reorientação da política [ENG.GetAdjective] levou a uma espécie de movimento de renovação nacional, em que as pessoas continuam a exigir mudança. Não vamos parar nem descansar, e continuaremos apenas a entregar mudança. Boa mudança, é claro."
 ENG_with_open_arms: "De Braços Abertos"
 ENG_with_open_arms_desc: "Precisamos reconhecer a importância dos migrantes. Quer o façamos de braços abertos ou não, se continuarmos a afastá-los, perderemos talentos valiosos que de outra forma não conseguiríamos obter."
 ENG_community_payback: "Programa de Retribuição Comunitária"
 ENG_community_payback_desc: "O programa de retribuição comunitária visará permitir que as comunidades determinem como os criminosos devem ser punidos. Isso pode ir do tempo de cumprimento da pena ao tipo de serviço comunitário. Tudo ficará a cargo das comunidades locais, mas a nação inteira se beneficiará."
 ENG_checks_on_migration: "Controles sobre a Migração"
 ENG_checks_on_migration_desc: "Por mais que precisemos de migrantes, não podemos simplesmente deixá-los entrar sem triagem prévia. Estabeleceremos alguns controles sobre os migrantes para garantir que realmente não representam perigo."
 ENG_australian_style_point_system: "Sistema de Pontos ao Estilo Australiano"
 ENG_australian_style_point_system_desc: "Seguindo os passos de nossos amigos australianos, estabeleceremos um sistema de pontos em que os migrantes são admitidos com base em suas habilidades e capacidade de contribuir para a nação."
 ENG_tough_on_anti_social_behavior: "Postura Dura contra o Comportamento Antissocial"
 ENG_tough_on_anti_social_behavior_desc: "Nosso povo precisa ser incentivado a trabalhar. Ficar em casa o dia todo não levará a nada. Conseguiremos que os jovens trabalhem permitindo que estagiem nas forças policiais e militares, especificamente nas indústrias de defesa."
 ENG_renewed_police_budget: "Orçamento Policial Renovado"
 ENG_renewed_police_budget_desc: "Nossa polícia não pode ficar subfinanciada; devemos reconhecer a importância de uma força policial forte e robusta que garanta a segurança de nossas comunidades."
 ENG_established_refugee_programs: "Estabelecer Programas para Refugiados"
 ENG_established_refugee_programs_desc: "Sem um programa adequado para refugiados, aqueles que fogem de suas casas chegarão até nós sem nada a oferecer. Criaremos um plano abrangente que integre os refugiados à sociedade e os leve a contribuir para a economia da nação."
 ENG_streamlined_citizenship_process: "Processo de Cidadania Simplificado"
 ENG_streamlined_citizenship_process_desc: "Vamos direto ao ponto: acrescentar obstáculos adicionais para quem busca a cidadania é desnecessário. Permitir uma integração mais rápida será mais benéfico para todos a longo prazo."
 ENG_neighbourhood_police_teams: "Equipes de Policiamento Comunitário"
 ENG_neighbourhood_police_teams_desc: "Em vez de aumentar os custos do policiamento, podemos fazer o oposto. Convocando os bairros a formar equipes de policiamento, poderemos descentralizar a justiça até o ponto em que o crime possa ser comunicado às autoridades competentes e tratado sem ter unidades de patrulha em todos os lugares ao mesmo tempo."
 ENG_cctv_reduce_fear: "O CFTV Reduz o Medo"
 ENG_cctv_reduce_fear_desc: "Câmeras em espaços públicos são parte essencial da manutenção da segurança nacional e civil. Se as pessoas souberem que os criminosos serão pegos, ficarão tranquilas enquanto os criminosos pensam duas vezes antes de cometer um crime."
 ENG_britain_can_be_better: "A Grã-Bretanha Pode Ser Melhor"
 ENG_britain_can_be_better_desc: "Com mudança e reforma adequadas, a Grã-Bretanha pode ser melhor. Não quer dizer que a Grã-Bretanha seja ruim agora, mas sempre há espaço para melhorias. O povo britânico confiou ao nosso partido, o Partido Trabalhista, a liderança da Grã-Bretanha na marcha rumo à reforma. Não podemos decepcioná-lo e devemos fazer tudo o que estiver ao nosso alcance para garantir que suas vozes sejam ouvidas."
 ENG_more_power_to_people: "Mais Poder ao Povo"
 ENG_more_power_to_people_desc: "O poder do governo deve estar nas mãos do povo. Afinal, os políticos vêm do próprio povo. Não devemos permitir que dinastias políticas surjam e assumam o controle."
 ENG_westminster_reinforced: "Westminster Reforçado"
 ENG_westminster_reinforced_desc: "Às vezes o povo não sabe exatamente o que está pedindo. Nesses casos, a participação do governo deve aumentar e especialistas políticos precisam intervir e decidir por ele."
 ENG_further_digital_governance: "Ampliar a Governança Digital"
 ENG_further_digital_governance_desc: "As pessoas devem poder interagir com o governo com mais liberdade. A internet é a ferramenta perfeita para isso e, ao permitir que o povo acesse recursos do governo pelo espaço digital, poderemos ampliar nossa capacidade de governar sem grandes problemas."
 ENG_a_union_of_nations: "Uma União de Nações"
 ENG_a_union_of_nations_desc: "A Grã-Bretanha não é uma nação, é uma união de nações. Garantiremos que cada nação seja representada com precisão, e isso será feito por meio de nossa capacidade de lhes dar acesso a oportunidades econômicas."
 ENG_reconsider_the_lobbying_act: "Reconsiderar a Lei do Lobby"
 ENG_reconsider_the_lobbying_act_desc: "A Lei do Lobby é frequentemente acusada de melhorar muito a transparência governamental ao exigir que grupos de lobby revelem seu financiamento, com regras sobre quanto podem gastar e assim por diante. No entanto, isso também afetou nossas atividades, e alguns pedem uma revisão do projeto."
 ENG_people_led_constitutional_convention: "Convenção Liderada pelo Povo"
 ENG_people_led_constitutional_convention_desc: "Convocaremos o povo para liderar a convenção constitucional, permitindo que a pluralidade substitua a singularidade. Com o voto do povo, a confiança dele em nós estará eternamente assegurada."
 ENG_corporaet_led_constitutional_convention: "Convenção Liderada por Corporações"
 ENG_corporaet_led_constitutional_convention_desc: "As corporações sabem o que é melhor para a Grã-Bretanha. Portanto, devemos priorizar seus interesses na condução do país antes de qualquer outro; afinal, são elas que têm o dinheiro."
 ENG_revised_town_laws: "Leis Municipais Revisadas"
 ENG_revised_town_laws_desc: "Algumas leis municipais ainda mantêm regras e regulamentos bastante ultrapassados. É melhor começarmos a limpá-las, especialmente porque algumas delas vêm causando interrupções nas atividades de certas indústrias."
 ENG_replacing_the_house_of_lords: "Substituir a Câmara dos Lordes"
 ENG_replacing_the_house_of_lords_desc: "A Câmara dos Lordes é uma das instituições mais antigas do mundo, mas também uma das mais retrógradas. Sua constante intromissão no parlamento a tornou uma dor de cabeça na hora de aprovar projetos de lei, e algo precisa ser feito a respeito."
 ENG_ulift_peerages: "Elevar os Pariatos"
 ENG_ulift_peerages_desc: "O primeiro passo para impedir que a Grã-Bretanha se afaste de suas tradições é elevar os pariatos. Com os pariatos, poderemos proteger nossas tradições e a cultura da corte."
 ENG_abolish_life_peerages: "Abolir os Pariatos Vitalícios"
 ENG_abolish_life_peerages_desc: "Os pariatos não são algo eleito; são inteiramente hereditários ou nomeados. Não há nada de democrático nos pariatos, e aboli-los reduzirá severamente as influências aristocráticas."
 ENG_common_expertise: "Perícia Comum"
 ENG_common_expertise_desc: "Precisamos da perícia do homem comum, não da corporação, do político ou do estrangeiro. Precisamos de pessoas reais do povo comum para guiar a nação e conduzi-la a um futuro melhor e mais brilhante."
 ENG_technocratic_expertise: "Perícia Tecnocrática"
 ENG_technocratic_expertise_desc: "Aqueles que provaram seu valor são quase sempre ricos e instruídos. Trazer sua perícia para o governo impulsionará o progresso da Grã-Bretanha dez vezes mais."
 ENG_labour_for_workers_and_ceos_alike: "Trabalhistas: Para Trabalhadores e CEOs por Igual"
 ENG_labour_for_workers_and_ceos_alike_desc: "Precisamos evitar alienar os CEOs e os escalões superiores da sociedade. Em vez disso, precisamos apaziguá-los e trabalhar por negociações e compromissos que permitam melhores regulamentações trabalhistas."
 ENG_the_queens_family: "A Família da Rainha"
 ENG_the_queens_family_desc: "A força da Soberana não está apenas na lei ou na tradição, mas no círculo que se ergue atrás dela quando o Estado está sob pressão. Aqueles convidados para o Círculo Íntimo da Rainha carregarão influência em seu nome, mas jamais devem confundir proximidade com autoridade. A Coroa é a única constante, e a Rainha decidirá como sua família a serve."
 ENG_the_prince_trust: "O Prince's Trust"
 ENG_the_prince_trust_desc: "A Coroa perdura porque se adapta, e poucos instrumentos se mostraram mais práticos do que o Prince's Trust. Ao ampliar seu alcance, transformamos o patrocínio real em oportunidade mensurável, treinamento, aprendizados e uma escada de volta à sociedade para os deixados para trás. É poder brando com resultados concretos, e fortalece a monarquia onde mais importa: na vida dos britânicos comuns."
 ENG_harmony_doctrine: "A Doutrina da Harmonia"
 ENG_harmony_doctrine_desc: "Numa era de polarização, a autoridade da monarquia está em sua capacidade de unir sem governar. Promoveremos uma Doutrina da Harmonia, uma mediação discreta entre governo, indústria, comunidades religiosas e sociedade civil, para reduzir fraturas e reconstruir a coesão nacional. O Estado pode comandar, mas a Coroa pode reconciliar."
 ENG_climate_alarm_bell: "Soar o Alarme Climático"
 ENG_climate_alarm_bell_desc: "Os alertas já não são teóricos, e a demora agora tem um custo nacional. Usaremos o peso da plataforma do Herdeiro para pôr o risco climático em todas as pautas, da segurança energética à resiliência alimentar e ao planejamento de infraestrutura. Quando o Palácio fala com clareza, até os ministérios mais relutantes escutam."
 ENG_duchy_originals: "Duchy Originals"
 ENG_duchy_originals_desc: "O Ducado pode ser mais do que tradição; pode ser a prova de que a administração moderna é lucrativa. Expandiremos a Duchy Originals como modelo de produção sustentável, cadeias de suprimento éticas e empreendimento rural que mantém as comunidades viáveis sem esvaziá-las. Se a Coroa deve dar o exemplo, que seja um exemplo que se pague."
 ENG_heir_of_the_realm: "Herdeiro do Reino"
 ENG_heir_of_the_realm_desc: "O reinado de Elizabeth definiu uma era, mas o reino deve sempre olhar para o que vem a seguir. Formalizaremos o papel nacional do Herdeiro, com maior visibilidade, acesso mais profundo aos briefings de Estado e uma presença mais clara em toda a União. A continuidade não é presumida; é preparada."
 ENG_naval_prince: "O Príncipe Naval"
 ENG_naval_prince_desc: "O serviço real não é teatro; é uma reivindicação de credibilidade conquistada de uniforme. Colocaremos a identidade naval do Duque de York na vanguarda dos esforços cerimoniais e de recrutamento, reforçando o vínculo entre a Coroa e a Frota. Em mares incertos, os símbolos do dever ainda podem firmar a nação."
 ENG_naval_prince_tt: "Desbloqueia §Y$ENG_prince_andrew_leader_name$§! como §YAlto Comando Militar§!"
 ENG_appoint_trade_representative: "Nomear um Representante Comercial Real"
 ENG_appoint_trade_representative_desc: "A influência da Grã-Bretanha viaja melhor quando chega com mandato governamental e prestígio real. Nomearemos um Representante Comercial Real para abrir portas, tranquilizar parceiros e dar aos exportadores um defensor de alto perfil nas negociações. Onde os ministros barganham, a Coroa pode conferir."
 ENG_emerging_markets_circuit: "O Circuito dos Mercados Emergentes"
 ENG_emerging_markets_circuit_desc: "O crescimento mundial está mudando, e a Grã-Bretanha não pode se dar ao luxo de ser uma convidada tardia. Lançaremos um circuito de mercados emergentes com visitas, fóruns de investimento e apresentações estratégicas destinados a ancorar as empresas do Reino Unido na próxima onda de demanda global. O objetivo é simples: relações agora, influência depois."
 ENG_digital_enterprise_patronage: "Patrocínio da Empresa Digital"
 ENG_digital_enterprise_patronage_desc: "O comércio é cada vez mais escrito em código, não em carga. Usaremos o patrocínio real para elevar a empresa digital britânica, as fintechs, a cibersegurança, os serviços avançados e as startups que os escalam, transformando prestígio em investimento e investimento em empregos. Se o Palácio pode se modernizar, a economia também pode."
 ENG_duty_of_the_crown: "Dever da Coroa"
 ENG_duty_of_the_crown_desc: "Um título real não é um escudo, é uma obrigação. Vamos construir o papel público do Duque em torno do serviço visível, da representação disciplinada e de resultados que justifiquem o lugar da instituição na vida nacional. Em uma monarquia, o dever é a única moeda que nunca se desvaloriza."
 ENG_workhorse_of_the_crown: "O Burro de Carga da Coroa"
 ENG_workhorse_of_the_crown_desc: "A monarquia sobrevive de mais do que espetáculo; sobrevive de um serviço incansável e visível. Vamos elevar o modelo de dever da Princesa Real, agendas lotadas, compromissos locais e acompanhamento discreto, ao padrão que o público reconhece como trabalho de verdade. Quando a Coroa for questionada, essa deve ser a sua resposta."
 ENG_carers_recognition_campaign: "Campanha de Reconhecimento aos Cuidadores"
 ENG_carers_recognition_campaign_desc: "O cuidado na Grã-Bretanha costuma ser prestado por pessoas que recebem pouco reconhecimento e menos descanso ainda. Lançaremos uma Campanha Nacional de Reconhecimento aos Cuidadores sob patrocínio real, pressionando o governo e a sociedade civil a apoiar os cuidadores não remunerados com alívio prático e respeito público. Um país que honra o serviço no exterior também deve honrar o serviço em casa."
 ENG_discipline_service: "Disciplina no Serviço"
 ENG_discipline_service_desc: "Uma Coroa à deriva se torna alvo; uma Coroa disciplinada volta a ser uma instituição. Vamos endurecer os padrões de conduta, afiar as rotinas da casa real e exigir desempenho profissional em todo dever público. O exemplo de Anne não é glamouroso, mas é duradouro."
 ENG_princess_admiral_royal_navy: "Princesa Almirante da Marinha Real"
 ENG_princess_admiral_royal_navy_desc: "A Marinha Real é mais do que equipamento; é tradição, identidade e alcance nacional. Vamos aprofundar o papel naval da Princesa Real para fortalecer o moral, o recrutamento e o vínculo da força com a nação. Em tempos de paz e de crise, a Frota deve saber que a Coroa está ao seu lado."
 ENG_princess_admiral_royal_navy_tt: "Desbloqueia §Y$ENG_princess_anne_leader_name$§! como §YAlto Comando Militar§!"
 ENG_colonel_of_horse_logistics: "Coronel da Cavalaria e da Logística"
 ENG_colonel_of_horse_logistics_desc: "Exércitos se movem com disciplina e logística, não com discursos. Vamos formalizar as nomeações militares da Princesa Real para enfatizar a prontidão, a sustentação e a competência pouco glamourosa que vence campanhas. Uma força moderna precisa de defensores que respeitem o trabalho por trás da linha de frente."
 ENG_quiet_professionalism: "Profissionalismo Discreto"
 ENG_quiet_professionalism_desc: "Há poder na contenção e credibilidade na constância. Faremos do profissionalismo discreto a filosofia de funcionamento do Palácio: menos teatro, mais entrega e uma presença constante em toda a União. Se a Grã-Bretanha quer uma monarquia que mereça seu sustento, é assim que ela o faz."
 ENG_chairman_international_award: "Presidente do Prêmio Internacional"
 ENG_chairman_international_award_desc: "O legado é preservado por instituições que sobrevivem a qualquer reinado. Vamos fortalecer a liderança do Duque no Prêmio Internacional para desenvolver habilidades práticas, confiança cívica e liderança na próxima geração. Uma monarquia que investe na juventude investe no próprio futuro."
 ENG_trustee_network: "A Rede de Curadores"
 ENG_trustee_network_desc: "A influência não se declara; ela se mantém por meio de conselhos, instituições de caridade e da maquinaria discreta da vida pública. Vamos expandir uma rede de curadores que ligue instituições respeitáveis ao patrocínio real, melhorando a coordenação e elevando os padrões em todo o setor. Quando a Coroa organiza a responsabilidade, ela conquista autoridade."
 ENG_commonwealth_youth_outreach: "Alcance da Commonwealth à Juventude"
 ENG_commonwealth_youth_outreach_desc: "A Commonwealth não resistirá apenas com cerimônias; ela precisa parecer relevante para os jovens. Lançaremos um esforço contínuo de intercâmbios, programas de treinamento e iniciativas cívicas conjuntas para manter os laços da Grã-Bretanha vivos na vida dos futuros líderes. O poder brando é mais forte quando é pessoal."
 ENG_production_guild_patronage: "Patrocínio das Guildas de Produção"
 ENG_production_guild_patronage_desc: "A indústria é cultura tanto quanto é comércio, e os setores criativo e produtivo da Grã-Bretanha são ativos estratégicos. Usaremos o patrocínio real para defender as guildas, os estúdios e os ofícios especializados que tornam a produção britânica competitiva em escala global. O prestígio atrai atenção; a atenção atrai investimento."
 ENG_steady_hand: "Uma Mão Firme"
 ENG_steady_hand_desc: "Em uma família definida pelo escrutínio, a estabilidade se torna uma virtude estratégica. Apresentaremos o Duque como uma mão firme, confiável, previsível e focada no serviço em vez de manchetes. Às vezes, o papel real mais valioso é simplesmente impedir que a instituição balance."
 ENG_duke_charities: "As Instituições de Caridade do Duque"
 ENG_duke_charities_desc: "O legado do Duque de Edimburgo é medido em instituições construídas, não em discursos proferidos. Vamos consolidar e profissionalizar seu portfólio de caridade para garantir financiamento de longo prazo, governança mais afiada e confiança pública duradoura. Se a monarquia quer ser respeitada, sua filantropia deve ser tão disciplinada quanto sua cerimônia."
 ENG_international_award_conference: "Conferência do Prêmio Internacional"
 ENG_international_award_conference_desc: "A força do Prêmio sempre foi sua rede global e seus padrões compartilhados. Convocaremos uma Conferência do Prêmio Internacional para alinhar parceiros, ampliar a participação e modernizar os programas para uma nova geração. Um legado real se torna um sistema quando é organizado internacionalmente."
 ENG_wwf_president_emeritus: "Presidente Emérito do WWF"
 ENG_wwf_president_emeritus_desc: "A conservação já não é uma causa de nicho; é segurança nacional sob outro nome. Aproveitaremos a posição do Duque como Presidente Emérito do WWF para elevar a proteção da vida selvagem, a biodiversidade e a gestão ambiental a prioridades sérias de política pública. Quando o Palácio trata a natureza como algo estratégico, os governos têm mais dificuldade em ignorá-la."
 ENG_prince_phillip_medal: "A Medalha Príncipe Philip"
 ENG_prince_phillip_medal_desc: "Símbolos importam quando recompensam as virtudes certas. Instituiremos uma Medalha Príncipe Philip para honrar o serviço prático, a engenharia, a indústria, a resposta a emergências e a competência pouco glamourosa que mantém a Grã-Bretanha funcionando. É uma mensagem real em metal: o que conta são os resultados."
 ENG_strength_and_stay: "Força e Permanência"
 ENG_strength_and_stay_desc: "A monarquia perdura mantendo-se firme sob pressão. Projetaremos a antiga filosofia do Duque, disciplina, resiliência e recusa em se curvar a modismos passageiros, na postura pública da casa real. Quando vierem as tempestades, a Coroa deve parecer inabalável."
 ENG_from_sandhurst_to_service: "De Sandhurst ao Serviço"
 ENG_from_sandhurst_to_service_desc: "A próxima geração da Coroa precisa ser crível em mais do que cerimônias. Ancoraremos o papel público do Príncipe no serviço disciplinado, no profissionalismo militar, no dever e na liderança prática aprendida do jeito difícil. Sandhurst não é um distintivo; é um padrão."
 ENG_royal_foundation: "A Fundação Real"
 ENG_royal_foundation_desc: "A monarquia moderna é medida pelo impacto, não pela tradição. Vamos expandir a Fundação Real como principal instrumento do Príncipe, com programas profissionais, resultados mensuráveis e parcerias capazes de sobreviver às mudanças políticas. Se o Palácio quer liderar, precisa entregar."
 ENG_heads_together: "Heads Together"
 ENG_heads_together_desc: "Uma nação resiliente exige mais do que fronteiras fortes; exige mentes fortes. Elevaremos o Heads Together a um esforço nacional por conhecimento sobre saúde mental, redução do estigma e apoio prático a quem sofre em silêncio. A Coroa não pode legislar a compaixão, mas pode normalizá-la."
 ENG_veteran_armed_forces_support: "Apoio aos Nossos Veteranos"
 ENG_veteran_armed_forces_support_desc: "O serviço não termina quando se tira o uniforme. Fortaleceremos o apoio aos veteranos e às forças armadas por meio de instituições de caridade, empregadores e coordenação governamental, garantindo que quem carregou o fardo não seja descartado depois. Um país que exige sacrifício deve garantir dignidade."
 ENG_bridge_to_the_future: "Uma Ponte para o Futuro"
 ENG_bridge_to_the_future_desc: "O reinado de Elizabeth representa continuidade. William deve representar a transição. Moldaremos o Príncipe como uma ponte para o futuro, moderno nos métodos, disciplinado no tom e enraizado na legitimidade do serviço. O próximo capítulo da monarquia começa antes de a coroa passar."
 ENG_queen_eldest: "Conselho do Primogênito"
 ENG_queen_eldest_desc: "A Rainha recorre à sua linhagem mais velha para projetar continuidade no exterior e confiança em casa. Com o alcance público do herdeiro e o acesso de um enviado real, a Coroa pode abrir portas que os ministros não conseguem e manter a voz da Grã-Bretanha ouvida em todas as capitais."
 ENG_queen_middle: "O Pilar do Meio"
 ENG_queen_middle_desc: "A Rainha conta com a geração do meio para manter a instituição funcionando com disciplina e entrega. A força deles não está no espetáculo, mas na agenda, nos padrões e na competência discreta que protege a Coroa de escândalos e da deriva."
 ENG_queen_youngest: "Ponte para o Amanhã"
 ENG_queen_youngest_desc: "A Rainha ancora a casa real em uma estabilidade comprovada enquanto prepara a próxima era à vista de todos. Com o peso institucional de um consorte veterano e o histórico moderno de serviço do próximo herdeiro, a monarquia sinaliza que a renovação é controlada, não caótica."
 ENG_triumph_of_the_crown: "Triunfo da Coroa"
 ENG_triumph_of_the_crown_desc: "O equilíbrio mudou, e a Coroa já não reina apenas pela tradição. Com a monarquia no comando do Estado, a Grã-Bretanha entra em um novo acordo em que a lealdade é recompensada, a dissidência é administrada e o rumo nacional é definido a partir do Palácio. O reino agora se moverá com um único propósito, e o mundo entenderá que a Coroa voltou para governar."
 ENG_the_queens_speech_title: "O Discurso da Rainha"
 ENG_the_queens_speech_desc: "[ENG_the_queens_speech_focus_description]"
 ENG_the_kings_speech_title: "O Discurso do Rei"
 ENG_restore_civil_liberties: "Restaurar as Liberdades Civis"
 ENG_restore_civil_liberties_desc: "Uma Coroa que governa também deve provar que sabe se conter. Vamos reverter os poderes extraordinários, restaurar o devido processo legal e reafirmar os direitos que tornam legítima a autoridade britânica. Que nossos opositores chamem isso de fraqueza; o reino chamará de confiança."
 ENG_rule_sword_sceptre: "Governo por Espada e Cetro"
 ENG_rule_sword_sceptre_desc: "As antigas restrições falharam e o reino não será governado pela hesitação. Vamos fundir a autoridade real com os instrumentos do poder estatal, garantindo que a vontade da Coroa seja imposta sem demora. A Grã-Bretanha será ordeira, decisiva e temida por aqueles que confundem cortesia com fraqueza."
 ENG_royal_prerogative_activation: "Ativar a Prerrogativa Real"
 ENG_royal_prerogative_activation_desc: "Há poderes que existem nas sombras da constituição, usados com parcimônia e mencionados com cautela. Ativaremos a Prerrogativa Real para mover o Estado com rapidez, contornando a paralisia e forçando a máquina do governo a se alinhar. Quando a Coroa age, o reino segue."
 ENG_a_bid_soft_power: "Uma Aposta no Poder Brando"
 ENG_a_bid_soft_power_desc: "O poder não se mede apenas em navios e orçamentos, mas em prestígio, acesso e na capacidade de definir o tom da vida internacional. Faremos da Coroa o motor do poder brando britânico, ampliando a diplomacia cultural, o patrocínio real no exterior e redes de influência que sobrevivem a qualquer gabinete. Enquanto os outros correm atrás de manchetes, nós moldaremos a narrativa."
 ENG_commonwealth_summit: "Sediar uma Cúpula da Commonwealth"
 ENG_commonwealth_summit_desc: "A Commonwealth não é um eco do império, é uma rede que pode ser afiada em estratégia. Sediaremos uma Cúpula da Commonwealth sob direção real para assegurar novos compromissos em comércio, cooperação de segurança e desenvolvimento compartilhado. Se a Grã-Bretanha quer liderar de novo, começará reunindo seus amigos em uma sala."
 ENG_crown_procurement_program: "O Programa de Aquisições da Coroa"
 ENG_crown_procurement_program_desc: "Uma monarquia que governa não pode depender de contratos lentos e disputas de território entre ministérios. Estabeleceremos um Programa de Aquisições da Coroa para centralizar as compras, acelerar o rearmamento e recompensar as empresas que entregam no prazo e em escala. Quando o Palácio assina, a indústria se move."
 ENG_modernize_royal_navy: "Modernizar a Marinha Real"
 ENG_modernize_royal_navy_desc: "O alcance da Grã-Bretanha sempre foi marítimo, e a Coroa não governará um reino que não controla suas rotas marítimas. Modernizaremos a Marinha Real com novos cascos, doutrina mais afiada e a logística para sustentar operações longe das águas nacionais. Que os rivais observem nossos portos e contem o que sai deles."
 ENG_raf_army_overhaul: "Reformar a RAF e o Exército"
 ENG_raf_army_overhaul_desc: "Uma frota sem cobertura aérea e poder terrestre é um símbolo, não um escudo. Reformaremos a RAF e o Exército com estruturas de comando modernas, equipamentos atualizados e treinamento voltado para a guerra de alta intensidade. A Coroa não apostará sua autoridade em forças ultrapassadas."
 ENG_leverage_crown_estate: "Alavancar o Patrimônio da Coroa"
 ENG_leverage_crown_estate_desc: "O Patrimônio da Coroa é mais do que herança, é um instrumento estratégico. Alavancaremos seus ativos para financiar projetos nacionais, estabilizar indústrias-chave e sustentar o desenvolvimento de longo prazo sem implorar ao Parlamento por cada libra. Se a monarquia quer governar, também aprenderá a investir."
 ENG_national_service_act: "Aprovar a Lei do Serviço Nacional"
 ENG_national_service_act_desc: "Um reino que quer segurança precisa estar disposto a carregar seu peso. Aprovaremos uma Lei do Serviço Nacional para formar mão de obra, disciplina e um senso compartilhado de obrigação em toda a nação. Alguns chamarão de coerção; a Coroa chamará de dever."
 ENG_new_constitutional_charter: "Redigir uma Nova Carta Constitucional"
 ENG_new_constitutional_charter_desc: "O antigo acordo foi escrito para uma Grã-Bretanha diferente e já não se sustenta sob tensão. Redigiremos uma Nova Carta Constitucional que defina a autoridade da Coroa, os limites do Parlamento e os direitos que permanecem acima da política. Uma vez selada, o reino terá clareza, e clareza é poder."
 ENG_secure_succession: "Garantir a Sucessão"
 ENG_secure_succession_desc: "Uma monarquia que governa não pode se dar ao luxo de ter incerteza no topo. Garantiremos a sucessão por meio de leis claras, planejamento disciplinado e afirmação pública do mandato do herdeiro. A continuidade não é presumida, é imposta."
 ENG_rule_councillorship: "Governo por Conselheirado"
 ENG_rule_councillorship_desc: "O governo parlamentar gera facções, mas a Coroa pode governar por mãos de confiança. Daremos poder a um Conselho Real de Conselheiros para redigir políticas, supervisionar os ministérios e manter o Estado alinhado ao Palácio. A Grã-Bretanha será governada por competência e lealdade, não por barganhas partidárias."
 ENG_convene_foreign_secretary_cabinet: "Convocar o Gabinete do Secretário de Relações Exteriores"
 ENG_convene_foreign_secretary_cabinet_desc: "A diplomacia não pode ser improvisada quando a autoridade da Coroa está em jogo. Convocaremos um Gabinete do Secretário de Relações Exteriores para coordenar embaixadores, inteligência, enviados comerciais e planejadores de defesa sob uma direção única. A Grã-Bretanha falará com uma só voz no exterior, e será a voz certa."
 ENG_champion_liberal_values: "Defender os Valores Liberais"
 ENG_champion_liberal_values_desc: "Se a monarquia quer governar, deve governar com princípios que a Grã-Bretanha reconheça como seus. Defenderemos os valores liberais, protegeremos as instituições livres e provaremos que a autoridade real pode coexistir com direitos e contenção. A Coroa será forte e será legítima."
 ENG_european_outreach: "Aproximação com a Europa"
 ENG_european_outreach_desc: "A Grã-Bretanha não pode se dar ao luxo de ficar isolada à sua porta. Lançaremos uma campanha de aproximação com a Europa para reconstruir canais, garantir cooperação onde os interesses coincidem e impedir que rivais definam sem nós os termos do continente. A Coroa tratará diretamente, e a Europa tomará nota."
 ENG_close_proximity_nato: "Proximidade com a OTAN"
 ENG_close_proximity_nato_desc: "A OTAN não é apenas um pacto, é uma alavanca de dissuasão e acesso. Nos aproximaremos da Aliança para garantir compartilhamento de inteligência, interoperabilidade e profundidade estratégica, mantendo intacta a liberdade de ação da Coroa. A Grã-Bretanha será aliada, mas nunca subordinada."
 ENG_joint_operational_command: "Estabelecer um Comando Operacional Conjunto"
 ENG_joint_operational_command_desc: "A rivalidade entre as forças desperdiça tempo, e o tempo mata. Estabeleceremos um Comando Operacional Conjunto para unificar o planejamento, a logística e a execução entre a Marinha, o Exército e a RAF sob uma única doutrina de combate. Quando a Coroa ordenar a ação, todos os ramos se moverão como um só."
 ENG_reaffirm_special_relationship: "Reafirmar a Relação Especial"
 ENG_reaffirm_special_relationship_desc: "O poder respeita o poder, e os Estados Unidos continuam sendo o parceiro mais decisivo do reino. Reafirmaremos a Relação Especial por meio de cooperação em inteligência, coordenação de defesa e planejamento estratégico conjunto no mais alto nível. A Coroa manterá o assento da Grã-Bretanha à mesa onde se decide o mundo."
 ENG_royal_charitable_initiative: "A Iniciativa Real de Caridade"
 ENG_royal_charitable_initiative_desc: "Governar é mais fácil quando o reino acredita que é cuidado. Lançaremos uma Iniciativa Real de Caridade para direcionar recursos, voluntários e atenção pública às comunidades sob pressão, provando que a Coroa pode governar com compaixão. A lealdade cresce mais rápido onde a ajuda chega primeiro."
 ENG_time_for_common_sense: "É Hora do Bom Senso"
 ENG_time_for_common_sense_desc: "A hora do bom senso é agora. Anos de governo trabalhista desviaram nosso povo dos ideais que fizeram da Grã-Bretanha o que ela já foi. Não podemos deixar que o esforço de grandes homens como Winston Churchill seja em vão; não, moldaremos a Grã-Bretanha para ser o que sempre foi destinada a ser, uma grande potência."
 ENG_knowing_who_we_are: "Saber Quem Somos"
 ENG_knowing_who_we_are_desc: "Somos britânicos primeiro, europeus depois. Não podemos esquecer quem somos, somos os herdeiros de uma superpotência como o mundo nunca viu. O sol verdadeiramente nunca se pôs sobre a Grã-Bretanha, e continuará assim se depender de nós."
 ENG_a_world_leader: "Um Líder Mundial"
 ENG_a_world_leader_desc: "Somos britânicos, os melhores entre todos, somos líderes mundiais e campeões da liberdade, não podemos deixar nosso domínio como líder mundial escorregar. Em vez disso, nos reafirmaremos na vanguarda da liderança global."
 ENG_fighting_the_power_of_brussels: "Combater o Poder de Bruxelas"
 ENG_fighting_the_power_of_brussels_desc: "Bruxelas ultrapassou os limites de sua capacidade administrativa. Eles estão degradando ativamente a independência de nossa nação com sua retórica, e são uma ameaça à nossa capacidade de escolher o que queremos para a Grã-Bretanha!"
 ENG_a_civilized_society: "Uma Sociedade Civilizada"
 ENG_a_civilized_society_desc: "Como sociedade civilizada, a Grã-Bretanha não será submetida à propaganda alheia. Por isso, o trabalho de romper a influência dos que querem trazer mudanças radicais ao nosso modo de vida deve ser tratado com rapidez."
 ENG_a_stronger_society: "Uma Sociedade Mais Forte"
 ENG_a_stronger_society_desc: "Nossa sociedade será mais forte e mais unida do que nunca. Não podemos deixar que outros fraturem nossa unidade sob o disfarce de 'reforma'. Nossa sociedade só poderá se fortalecer se continuarmos a proteger nossos valores fundamentais."
 ENG_a_staunch_ally: "Um Aliado Leal"
 ENG_a_staunch_ally_desc: "Não somos nada além de um aliado leal de nossos parceiros na OTAN! Quem ousar nos acusar de parasitas, de ponta solta ou qualquer coisa do tipo pode voltar direto para o lugar de onde veio."
 ENG_town_and_country: "Cidade e Campo"
 ENG_town_and_country_desc: "Somos um país que não pode esquecer suas cidades pequenas, rurais e humildes. Devemos lembrar dessas pessoas com todas as nossas forças e incentivá-las a seguir em frente."
 ENG_a_more_flexible_europe: "Uma Europa Mais Flexível"
 ENG_a_more_flexible_europe_desc: "A Europa precisa ser mais flexível em seus objetivos gerais de política externa. Para nos tornarmos um continente mais forte como um todo, a Europa precisa abandonar toda essa agenda de 'unificação' e trabalhar para ser mais flexível."
 ENG_rural_friendly_transport_services: "Serviços de Transporte Amigáveis ao Campo"
 ENG_rural_friendly_transport_services_desc: "Nossos serviços de transporte não são nada amigáveis às comunidades rurais. Precisaremos encontrar um jeito de agradar essas pessoas."
 ENG_industrial_friendly_transport_services: "Serviços de Transporte Amigáveis à Indústria"
 ENG_industrial_friendly_transport_services_desc: "O trabalhador precisa ir e voltar do trabalho sem problemas. Precisaremos reformular, ou ao menos melhorar, nossos serviços de transporte para áreas industriais."
 ENG_no_army_outside_of_europe: "Nenhum Exército Fora da Europa"
 ENG_no_army_outside_of_europe_desc: "Por que militares britânicos estão fora dos limites da Europa? Que lugar eles têm na Ásia? Na África? No Oriente Médio? Em vez disso, precisamos nos concentrar em manter nossas tropas dentro da Europa."
 ENG_abolish_centrally_planned_housing: "Abolir a Habitação Planejada Centralmente"
 ENG_abolish_centrally_planned_housing_desc: "Em vez de destinar nosso orçamento a uma agenda de habitação planejada centralmente, podemos realocar esses recursos para coisas mais importantes."
 ENG_coming_to_the_aid_of_others: "Socorrer os Outros"
 ENG_coming_to_the_aid_of_others_desc: "Existem pessoas no mundo que precisam desesperadamente de nossa ajuda, e estamos aqui para oferecê-la."
 ENG_global_matters_global_problems: "Assuntos Globais, Problemas Globais"
 ENG_global_matters_global_problems_desc: "Por que nos importamos com o que os outros estão enfrentando? O problema é deles, não nosso! Eles que se virem sozinhos."
 ENG_credit_based_public_transport: "Transporte Público Baseado em Crédito"
 ENG_credit_based_public_transport_desc: "Você trabalha? Ótimo, não precisa se preocupar em pagar a passagem. Ao permitir que quem trabalha use o transporte público de graça, incentivaremos as pessoas a procurar emprego e trabalhar."
 ENG_safe_haven_not_safe_touch: "Refúgio Seguro, Não Porta Aberta"
 ENG_safe_haven_not_safe_touch_desc: "Somos um refúgio seguro para quem realmente precisa de ajuda; se deixarmos qualquer um entrar, eles vão arruinar nosso país até o esquecimento."
 ENG_are_you_thinking_what_were_thinking: "Você Está Pensando o Mesmo que Nós?"
 ENG_are_you_thinking_what_were_thinking_desc: ""
 ENG_power_to_the_bank_of_england: "Poder ao Banco da Inglaterra"
 ENG_power_to_the_bank_of_england_desc: "No momento, o Banco da Inglaterra está em pior estado do que nunca. Portanto, é necessário agir e fortalecer a instituição."
 ENG_british_dream: "O Sonho Britânico"
 ENG_british_dream_desc: "O sonho britânico é um sonho que muitos não têm há muito tempo. É o sonho e a ambição de que todos os britânicos prosperem, sem ter de sofrer as consequências de perdas coletivas."
 ENG_whats_wrong_with_discipline: "O Que Há de Errado com a Disciplina?"
 ENG_whats_wrong_with_discipline_desc: "Parece que nossas escolas ficaram frouxas e passaram a evitar tomar as medidas disciplinares necessárias. É nosso dever ensinar boas maneiras aos jovens, e faremos questão de que os educadores saibam disso."
 ENG_across_the_board_tax_slashes: "Cortes de Impostos para Todos"
 ENG_across_the_board_tax_slashes_desc: "Se cortarmos impostos para todos, nosso povo, de todas as camadas da sociedade, sentirá o peso de seus fardos diminuir drasticamente. Não devemos discriminar!"
 ENG_tax_slashes_only_for_some: "Cortes de Impostos Só para Alguns"
 ENG_tax_slashes_only_for_some_desc: "Não temos orçamento nem vontade de cortar impostos para todos. Teremos de ser coordenados e cortar impostos apenas onde nos beneficiarmos."
 ENG_icnreased_control_for_administrators: "Mais Controle para os Administradores"
 ENG_icnreased_control_for_administrators_desc: "Quem trabalha em nossas escolas precisa ter voz nos assuntos de suas instituições. Isso nos permitirá fazer surgir novos acadêmicos."
 ENG_keeping_hospitals_clean: "Manter os Hospitais Limpos"
 ENG_keeping_hospitals_clean_desc: "Precisamos manter nossos hospitais limpos, tanto na aparência física quanto na credibilidade."
 ENG_corporate_invitations: "Convites Corporativos"
 ENG_corporate_invitations_desc: "Precisamos convidar as corporações para nos ajudar a decidir a política econômica. Elas são o coração da nossa economia e, sem elas, não seríamos nada."
 ENG_more_police_less_crime: "Mais Polícia, Menos Crime"
 ENG_more_police_less_crime_desc: "É bem óbvio, não é? Se tivermos mais policiais patrulhando as ruas, certamente teremos muito menos crimes."
 ENG_cutting_wait_times: "Reduzir as Filas de Espera"
 ENG_cutting_wait_times_desc: "As pessoas esperam tempo demais por serviços médicos; já está na hora de fazermos algo a respeito e reduzir as esperas pela metade!"
 ENG_turnaround_schools: "Escolas de Recuperação"
 ENG_turnaround_schools_desc: "Se os alunos não conseguem ficar sentados direito na sala e ouvir o professor, teremos de pensar em outra coisa. Enviá-los para uma escola de recuperação finalmente resolverá esse problema que temos com uma pequena minoria de estudantes."
 ENG_structural_overhaul_of_nhs: "Reforma Estrutural do NHS"
 ENG_structural_overhaul_of_nhs_desc: "Do jeito que está, o NHS não pode continuar. Ele está sugando todo o nosso dinheiro e deixando pacientes doentes esperando porta afora. Devemos iniciar uma série de reformas que reconstruirão o NHS do zero."
 ENG_trusting_local_professionals: "Confiar nos Profissionais"
 ENG_trusting_local_professionals_desc: "Por que consertar o que não está quebrado? Deixaremos os assuntos médicos nas mãos dos profissionais de saúde e permitiremos que o NHS opere com alguns pequenos ajustes."
 ENG_keeping_up_our_guard: "Manter a Guarda Alta"
 ENG_keeping_up_our_guard_desc: "Não podemos baixar a guarda só porque agora as coisas estão calmas. Devemos antecipar todo tipo de cenário, mesmo em tempos de estabilidade e prosperidade."
 ENG_benefitting_the_taxpayer: "Beneficiar o Contribuinte"
 ENG_benefitting_the_taxpayer_desc: "Quem estamos servindo, se não o contribuinte? Precisamos implementar políticas que tranquilizem os contribuintes de que seu dinheiro não está sendo desperdiçado."
 ENG_invitation_to_the_government_of_britain: "Convite ao Governo da Grã-Bretanha"
 ENG_invitation_to_the_government_of_britain_desc: ""
 ENG_get_britain_moving_again: "Colocar a Grã-Bretanha em Movimento de Novo"
 ENG_get_britain_moving_again_desc: "Chegou a hora de colocar a Grã-Bretanha em movimento outra vez. Nunca mais com a estratégia lenta, metódica e convencional de esperar a economia se consertar sozinha. Vamos tomar as rédeas com nossas próprias mãos."
 ENG_cleanup_westminster: "Limpar Westminster"
 ENG_cleanup_westminster_desc: "Westminster é uma bagunça, saturada de burocracia e excessos administrativos. Chegou a hora de pegar uma marreta e limpar o lugar de cima a baixo."
 ENG_big_society_not_big_government: "Grande Sociedade, Não Grande Governo"
 ENG_big_society_not_big_government_desc: "Por que precisamos de um governo grande? Se nossa sociedade é boa o bastante, por que monitorar, administrar e ditar cada aspecto de suas vidas? Em vez disso, reduziremos o governo e deixaremos a sociedade fazer o seu trabalho."
 ENG_household_debt_management_programs: "Programas de Gestão de Dívidas Familiares"
 ENG_household_debt_management_programs_desc: "Às vezes as pessoas simplesmente não conseguem quitar suas dívidas, e tudo bem. Criaremos programas de gestão de dívidas que assumirão parte do débito ou ajudarão com planos para quitá-lo."
 ENG_bigger_place_for_educators: "Mais Espaço para os Educadores"
 ENG_bigger_place_for_educators_desc: "O país precisa se abrir mais para os nossos educadores. Não os valorizamos nem de longe como deveríamos, especialmente pelo trabalho que realizam."
 ENG_the_most_family_friendly_country: "O País Mais Amigável às Famílias"
 ENG_the_most_family_friendly_country_desc: "Nosso país precisa ser mais aberto a acolher famílias e pessoas que desejam ter filhos. Nossa população não pode permanecer estática e pequena; precisamos crescer e cultivar bons valores."
 ENG_knowledge_for_industry: "Conhecimento para a Indústria"
 ENG_knowledge_for_industry_desc: "Em vez de deixar o conhecimento ser desperdiçado em outros lugares, poderíamos redirecionar parte dessa capacidade intelectual para novas indústrias, talvez as militares."
 ENG_power_of_recall: "Poder de Revogação"
 ENG_power_of_recall_desc: "É evidente que alguns primeiros-ministros mentem e, portanto, precisam ser removidos se não cumprirem suas promessas. Devemos permitir que o povo revogue os primeiros-ministros que não quer mais no comando."
 ENG_a_more_balanced_economy: "Uma Economia Mais Equilibrada"
 ENG_a_more_balanced_economy_desc: "Nossa economia está em péssimo estado como resultado de décadas de incompetência trabalhista; está na hora de colocar as coisas em ordem!"
 ENG_bye_bye_bureaucracy: "Adeus, Burocracia"
 ENG_bye_bye_bureaucracy_desc: "Quem precisa de um governo grande quando podemos ter grande liberdade? Não há necessidade de burocracia no dia a dia de nossos eleitores; o que há é necessidade de mais liberdades."
 ENG_case_by_case_intervention: "Intervenção Caso a Caso"
 ENG_protecting_childhood: "Proteger a Infância"
 ENG_protecting_childhood_desc: "Do jeito que está, nossos jovens correm grande risco de ser prejudicados por indivíduos doentios por vários meios, seja a internet ou as ruas. Devemos tomar medidas adicionais para proteger a infância e permitir que eles cresçam e floresçam."
 ENG_investigate_lost_funds: "Investigar os Fundos Perdidos"
 ENG_investigate_lost_funds_desc: "Por algum motivo, grandes somas de dinheiro do governo desapareceram alguns anos atrás. Está na hora de abrir uma investigação adequada e descobrir o que aconteceu."
 ENG_a_more_transparent_government: "Um Governo Mais Transparente"
 ENG_a_more_transparent_government_desc: "Nosso governo não é nem de longe transparente o bastante, e devemos tomar medidas adicionais para garantir que nossos eleitores saibam o que está acontecendo em Westminster."
 ENG_petitions_for_debate: "Petições para Debate"
 ENG_petitions_for_debate_desc: "Se permitirmos que as pessoas reúnam um número significativo de assinaturas em uma petição por mudança, poderemos encaminhá-las ao parlamento para análise e implementar o retorno do povo de forma mais direta."
 ENG_public_reading_stage: "Etapa de Leitura Pública"
 ENG_public_reading_stage_desc: "Permitiremos um fórum na internet em que nosso povo possa comentar e discutir as mudanças aprovadas no parlamento, para maior transparência e aproximação com o governo."
 ENG_for_the_common_man: "Para o Homem Comum"
 ENG_for_the_common_man_desc: "Nosso governo é para o homem comum, não para quem comanda o espetáculo. Aprovaremos reformas direcionadas que permitam maior atividade política entre a classe comum."
 ENG_for_the_wealthy_man: "Para o Homem Rico"
 ENG_for_the_wealthy_man_desc: "Que diabos os pobres têm a ver com o governo, afinal? A maioria deles é de vagabundos de esquerda que não querem nada além de subsídios do governo para não trabalhar. Atenderemos os indivíduos da sociedade que de fato trabalham e contribuem para a economia."
 ENG_a_brighter_more_secure_future: "Um Futuro Mais Brilhante e Seguro"
 ENG_a_brighter_more_secure_future_desc: ""
 ENG_operation_dagger: "Operação Dagger"
 ENG_operation_dagger_desc: "O Golfo Pérsico já foi dominado por nossas forças, com nossa capacidade de ditar o que entra e sai sendo quase perfeita. Hoje, porém, estamos em posição inferior para negociar com os atores regionais e somos forçados a depender de nossas cartas de barganha para conseguir qualquer coisa. Ao tomar Musandam, poderemos voltar a estar em posição de poder no Golfo."
 ENG_operation_barras: "Operação Barras"
 ENG_operation_barras_desc: "Recebemos relatos de que o grupo miliciano 'West Side Niggaz', comumente chamado de 'West Side Boys' por jornalistas e emissoras, capturou vários soldados britânicos e agora os mantém como reféns. Estamos sendo pressionados a intervir de alguma forma para salvar suas vidas, e o comando militar elaborou a Operação Barras para executar isso. Também temos a opção de tomar medidas adicionais para apreender recursos vitais durante a operação; contudo, isso não é obrigatório."
 ENG_operation_coastal_star: "Operação Coastal Star"
 ENG_operation_coastal_star_desc: "A Gâmbia começa a derivar perigosamente para o autoritarismo, a instabilidade e, com certeza, para fora de nossa órbita. Precisaremos intervir de alguma forma e fazê-los mudar de rumo, ou o restante da África Ocidental poderá seguir o mesmo caminho."
 ENG_operation_delta_guard: "Operação Delta Guard"
 ENG_operation_delta_guard_desc: "Claramente os nigerianos não entendem nada de administrar um Estado, e somos obrigados a fazer algo a respeito do ouro negro desperdiçado ao redor do Delta. Do contrário, estaríamos apenas deixando-o se perder, e ninguém quer isso. A Operação Delta Guard nos permitirá restabelecer o domínio econômico na Nigéria, e a receita certamente beneficiará o Estado."
 ENG_the_sun_which_never_set: "O Sol Que Nunca Se Pôs"
 ENG_the_sun_which_never_set_desc: "O sol verdadeiramente nunca se põe sobre a Grã-Bretanha, e garantiremos que continue assim."
 ENG_operation_resolute_banner: "Operação Resolute Banner"
 ENG_operation_resolute_banner_desc: "O governo sérvio continua a ameaçar o Kosovo e, como resultado, somos forçados a intervir e traçar uma linha vermelha."
 ENG_falklands_policy: "Política das Malvinas"
 ENG_falklands_policy_desc: "Apesar do pequeno confronto que tivemos com a Argentina pelas Malvinas algumas décadas atrás, a memória do conflito ainda está fresca na mente de muitos. Podemos avançar com uma nova política para as ilhas e talvez tomar medidas adicionais."
 ENG_regime_change_in_zimbabwe: "Operação Safeguard"
 ENG_regime_change_in_zimbabwe_desc: "O antigo ditador do Zimbábue, [ZIM.GetLeader], deve ser derrubado por todos os meios necessários. A opressão dele contra os britânicos e contra o povo zimbabuano não pode passar em branco, e a justiça deve ser feita com rapidez."
 ENG_operation_east_divide: "Operação Eastern Divide"
 ENG_operation_east_divide_desc: "Suez é terra legitimamente britânica e, sem Suez, tivemos de enfrentar as dificuldades das 'regulamentações do comércio internacional'. Assim, tentaremos chegar a um acordo com os egípcios por um controle parcial no Sinai; caso contrário, não teremos escolha senão fazer algo a respeito."
 ENG_operation_ninety_seven: "Operação '97"
 ENG_operation_ninety_seven_desc: "Entregar Hong Kong aos chineses foi um erro, e dos graves. Devemos buscar novas formas de trazer Hong Kong de volta à nossa influência se quisermos nos restabelecer como hegemonia econômica."
 devolution.1.t: "Estados Constituintes Buscam Aprovar Projetos para Reduzir a Dependência"
 devolution.1.d: "Acontecimentos recentes no país levaram nossos estados constituintes a avançar na aprovação de políticas para reduzir sua dependência do governo central. Temos a capacidade de vetar esses projetos, mas isso pode gerar maiores níveis de insatisfação."
 devolution.1.a: "Aprová-los"
 devolution.1.b: "Vetá-los"
 devolution.1.c: "Mostre-me os projetos individuais"
 devolution.2.t: "O Projeto da Escócia"
 devolution.2.d: "O parlamento escocês apresentou ao governo um projeto que ampliará sua autonomia e os levará rumo a um Estado mais descentralizado. Vetar o projeto pode irritá-los, mas aprová-lo os empurrará para a devolução de poderes."
 devolution.2.a: "Aprová-lo"
 devolution.2.b: "Vetá-lo"
 devolution.3.t: "O Projeto da Irlanda do Norte"
 devolution.3.d: "O parlamento norte-irlandês apresentou ao governo um projeto que ampliará sua autonomia e os levará rumo a um Estado mais descentralizado. Vetar o projeto pode irritá-los, mas aprová-lo os empurrará para a devolução de poderes."
 devolution.3.a: "Aprová-lo"
 devolution.3.b: "Vetá-lo"
 devolution.4.t: "O Projeto do País de Gales"
 devolution.4.d: "O parlamento galês apresentou ao governo um projeto que ampliará sua autonomia e os levará rumo a um Estado mais descentralizado. Vetar o projeto pode irritá-los, mas aprová-lo os empurrará para a devolução de poderes."
 devolution.4.a: "Aprová-lo"
 devolution.4.b: "Vetá-lo"
 devolution.5.t: "Crescem os Pedidos pela Independência da Escócia"
 devolution.5.d: "A cada dia que passa, apresentadores de notícias aparecem diante de multidões exigindo a aprovação de um referendo nacional para decidir se a Escócia continuará ou não como parte de [ENG.GetName]. Obviamente, Westminster é geralmente contra a ideia, mas vetá-la de imediato pode gerar instabilidade."
 devolution.5.a: "Tudo bem, vamos ver o que acontece"
 devolution.5.b: "Vetá-lo"
 devolution.6.t: "Crescem os Pedidos pela Independência da Irlanda do Norte"
 devolution.6.d: "A cada dia que passa, apresentadores de notícias aparecem diante de multidões exigindo a aprovação de um referendo nacional para decidir se a Irlanda do Norte continuará ou não como parte de [ENG.GetName]. Obviamente, Westminster é geralmente contra a ideia, mas vetá-la de imediato pode gerar instabilidade."
 devolution.6.a: "Tudo bem, vamos ver o que acontece"
 devolution.6.b: "Vetá-lo"
 devolution.7.t: "Crescem os Pedidos pela Independência do País de Gales"
 devolution.7.d: "A cada dia que passa, apresentadores de notícias aparecem diante de multidões exigindo a aprovação de um referendo nacional para decidir se o País de Gales continuará ou não como parte de [ENG.GetName]. Obviamente, Westminster é geralmente contra a ideia, mas vetá-la de imediato pode gerar instabilidade."
 devolution.7.a: "Tudo bem, vamos ver o que acontece"
 devolution.7.b: "Vetá-lo"
 devolution.10.t: "Eleição dos Estados Constituintes"
 devolution.10.d: "Chegou a hora das eleições em nossos estados constituintes. Cada um elegerá novos primeiros-ministros em seus respectivos parlamentos, que serão pró-independência ou pró-[ENG.GetName]. A probabilidade de esses membros pró-independência serem eleitos depende do nível de agitação de cada constituinte."
 devolution.10.a: "Certo"
 britain_md.100.t: "Aproximando-se da Operação Dagger"
 britain_md.100.d: "Musandam fica numa região muito estratégica, sendo a adaga do Golfo Pérsico. Inúmeros petroleiros e comboios passam diariamente pelo estreito de Ormuz e, com a volatilidade cada vez maior da região, não conseguimos garantir que a rota marítima esteja protegida. Se conseguirmos trazer a província para o nosso controle, estaremos em melhor posição para proteger nossas frotas e ativos na região."
 britain_md.100.a: "Tentar fechar um acordo com Omã"
 britain_md.100.b: "Sem tempo para negociar, avançar"
 britain_md.101.t: "[ENG.GetName] Nos Procura por Musandam"
 britain_md.101.d: "Os britânicos vieram conversar conosco. Mais especificamente, vieram atrás do nosso território. Ao ouvir a proposta britânica, nossos diplomatas saíram furiosos, incapazes de se conter ao saber que os britânicos vieram tentar negociar Musandam. Uma exigência tão agressiva certamente enfurecerá nosso povo além da imaginação. Ainda assim, os britânicos reafirmaram que rejeitar tal exigência não lhes deixaria escolha senão 'buscar outros meios'."
 britain_md.101.a: "Jamais!"
 britain_md.101.b: "Que escolha temos?"
 britain_md.102.t: "Omã Recusa as Negociações"
 britain_md.102.d: "O governo omanense deixou claro que não tem interesse em nenhuma forma de negociação e, em vez disso, optou por repreender nossos diplomatas."
 britain_md.102.a: "Não nos deixam escolha"
 britain_md.102.b: "Esqueça"
 britain_md.103.t: "Omã Nos Apresenta Condições"
 britain_md.103.d: "O governo omanense tomou a sábia decisão de negociar conosco e até nos ofereceu condições. Pedem que paguemos uma quantia vultosa adiantada e garantamos a proteção de Omã por um período. Rejeitar essa oferta significaria que Omã não nos concederá os direitos sobre Musandam."
 britain_md.103.a: "Tudo bem"
 britain_md.103.b: "Não, resolveremos de outro jeito"
 britain_md.103.c: "Esqueça"
 ENG_western_allies_western_ideals: "Aliados Ocidentais, Ideais Ocidentais"
 ENG_western_allies_western_ideals_desc: ""
 ENG_out_with_the_new_in_with_the_old: "Fora o Novo, Dentro o Velho"
 ENG_out_with_the_new_in_with_the_old_desc: ""
 royal_workers_idea: "Trabalhadores Reais"
 ENG_crown_procurement_program_idea: "Programa de Aquisições da Coroa"
 ENG_recent_defections: "Deserções Recentes"
 ENG_recent_defections_desc: "Tropas, generais e pilotos habilidosos estão fugindo de nossas fileiras na esperança de romper laços com nosso governo, vendo-nos como uma ameaça ao Estado."
 ENG_war_of_independence: "Guerra de Independência"
 ENG_war_of_independence_desc: "Com ânimo e moral elevados, nossos homens estão prontos para ver o fim do governo tirânico de Londres."
 ENG_typhoon_debate1: "Produção Aumentada do Caça Typhoon"
 ENG_resistance_against_westminster: "Resistência contra Westminster"
 ENG_resistance_against_westminster_desC: "Após a rejeição de uma proposta de referendo, os habitantes deste estado ofereceram resistência firme na forma de desobediência civil e pequenos episódios de violência para mostrar seu descontentamento."
 ENG_political_modifier: "O Sistema de Westminster"
 ENG_two_party_system_idea: "Sistema Bipartidário"
 ENG_economy_modifier: "A Economia de [ENG.GetName]"
 ENG_building_britain_idea: "Construindo uma Grã-Bretanha Preparada para o Futuro"
 ENG_building_britain_idea_desc: "Uma estratégia industrial de longo prazo alinha o investimento em ideias, pessoas, infraestrutura e lugares, elevando lentamente a produtividade e dando às empresas confiança para planejar, contratar e construir em todo o país."
 ENG_ireland_border_cooperation_idea_IRE: "Cooperação na Fronteira Irlandesa"
 ENG_ireland_border_cooperation_idea_IRE_desc: "Órgãos transfronteiriços práticos e programas conjuntos ligam a Irlanda do Norte e a Irlanda em comércio, infraestrutura e serviços, reduzindo a papelada e ajudando bens, pessoas e ideias a circular mais livremente pela fronteira."
 ENG_Space_Command0: "Capacidades Cibernéticas Britânicas"
 ENG_Space_Command0_desc: "O Reino Unido está trabalhando para melhorar suas capacidades e garantir seus interesses no espaço"
 ENG_Space_Command2: "Comando Espacial do Reino Unido"
 ENG_Space_Command3: "Comando Espacial do Reino Unido"
 ENG_Space_Command3_desc: "O Comando Espacial do Reino Unido é o líder de defesa para operações espaciais, força de trabalho espacial e capacidade espacial. É um comando conjunto, sediado em RAF High Wycombe, com pessoal da Marinha Real, do Exército Britânico e da Real Força Aérea, além de servidores civis e contratados. Com a 1ª Divisão Espacial agora formada, a organização superou as expectativas em todo o mundo, e a Grã-Bretanha vive uma nova era Dreadnought."
 ENG_standardized_space_parts1: "Peças Espaciais Padronizadas"
 ENG_standardized_space_parts1_desc: "Ao apoiar empresas comerciais para tornar o espaço acessível e econômico, os custos de construção de produtos espaciais foram reduzidos."
 ENG_Historical_Valor1: "Bravura Histórica"
 ENG_Historical_Varlor1_desc: "Arraigadas em tradições, as forças armadas britânicas se orgulham de sua herança histórica. No entanto, o estado-maior permanece firme em estratégias convencionais, cético quanto a táticas não testadas. Com os militares à beira de uma mudança, equilibrar orgulho e adaptabilidade torna-se a essência da defesa da nação."
 ENG_Aging_Military1: "Militares Envelhecidos"
 ENG_Aging_Military1_desc: "Devido ao financiamento negligenciado, o exército do Reino Unido enfrenta graves problemas de envelhecimento, lidando com equipamentos obsoletos e qualidade em declínio. O impacto da negligência financeira ecoa pelas fileiras, dificultando a manutenção de uma força de defesa moderna e eficaz."
 ENG_desert_hawk: "Desert Hawk"
 ENG_desert_hawk_desc: "O Lockheed Martin Desert Hawk III é um VANT projetado pela Skunkworks da Lockheed Martin Aeronautics. É um pequeno drone de vigilância capaz de observação por radar, inteligência de sinais e interceptação de comunicações, além de observação remota com visão noturna, imagem térmica e sensores eletro-ópticos."
 ENG_archer_artillery_alliance: "Aliança de Artilharia Archer"
 ENG_archer_artillery_alliance_desc: "A Aliança de Artilharia Archer, desenvolvida pela Suécia, representa um avanço em poder de fogo de precisão de longo alcance. Com carregamento automatizado e implantação rápida, esse sistema de artilharia garante apoio preciso e flexível no campo de batalha. Seu projeto modular melhora as operações militares, dando à Suécia e ao Reino Unido uma vantagem estratégica em combate."
 ENG_Boxer_Program: "Programa Boxer"
 ENG_Boxer_Program_desc: "O Programa de Blindados de Transporte de Pessoal Boxer, uma colaboração entre Alemanha e Países Baixos, inaugura uma nova era nos veículos blindados de transporte de pessoal. O projeto modular do Boxer permite fácil adaptação a várias missões, incluindo transporte de tropas e evacuação médica. Com recursos avançados de proteção e mobilidade excepcional, esse veículo aumenta a segurança e a eficácia do pessoal militar em diversos ambientes operacionais."
 ENG_warrior_capability_sustainment_programme: "Programa de Sustentação de Capacidade dos Blindados Warrior"
 ENG_warrior_capability_sustainment_programme_desc: "O obsoleto canhão RARDEN de 30 mm do Warrior, incapaz de atirar em movimento com precisão, motivou estudos de novos sistemas de armas e projetos de torre para prolongar sua vida de combate. Os planos atuais preveem a adição de uma torre totalmente estabilizada com canhão CT40 de 40 mm, arquitetura eletrônica aprimorada e um sistema modular de proteção blindada com kits de montagem rápida. Paralelamente, o programa Armoured Battlegroup Support Vehicle propôs a conversão da plataforma em um blindado de transporte de pessoal para substituir o FV432."
 ENG_warrior_ajax_upgrades: "Melhorias Ajax dos Blindados Warrior"
 ENG_warrior_ajax_upgrades_desc: "O projeto de Melhorias Warrior Ajax, liderado pelo Reino Unido, representa um aprimoramento significativo do icônico veículo de combate de infantaria Warrior. Com modificações avançadas, incluindo maior poder de fogo, sistemas de comunicação aprimorados e blindagem atualizada, o Warrior Ajax garante desempenho superior no campo de batalha. Essas melhorias reforçam as capacidades militares do Reino Unido, oferecendo apoio blindado modernizado e versátil às forças terrestres em diversos cenários operacionais."
 ENG_fres_program_Idea: "Programa FRES"
 ENG_fres_program_Idea_desc: "O Programa FRES (Future Rapid Effect System) do Reino Unido é uma iniciativa visionária que aumenta a agilidade militar com plataformas terrestres versáteis. Integrando tecnologia de ponta para resposta rápida, garante a prontidão do Reino Unido em diversas missões."
 ENG_fixing_civil_servant_idea: "Consertando o Serviço Civil"
 ENG_fixing_civil_servant_idea_desc: "Nossos soldados precisam de equipamento confiável. Estamos nos esforçando para atender a essa exigência."
 ENG_special_command1: "Comando Especializado"
 ENG_special_command1_desc: "Concentrando-nos em refinar a especialização e a eficácia do exército, buscamos aumentar a capacidade de combate de nossas forças armadas. Esse compromisso, porém, vem ao custo de gastos maiores e exigências de recursos mais rigorosas."
 ENG_special_command2: "Comando Especializado"
 ENG_special_command2_desc: "Concentrando-nos em refinar a especialização e a eficácia do exército, buscamos aumentar a capacidade de combate de nossas forças armadas. Esse compromisso, porém, vem ao custo de gastos maiores e exigências de recursos mais rigorosas."
 ENG_special_command3: "Comando Especializado"
 ENG_special_command3_desc: "Concentrando-nos em refinar a especialização e a eficácia do exército, buscamos aumentar a capacidade de combate de nossas forças armadas. Esse compromisso, porém, vem ao custo de gastos maiores e exigências de recursos mais rigorosas."
 ENG_UKSF1: "Forças Especiais do Reino Unido"
 ENG_UKSF1_desc: "Compostos por forças de elite como o SAS e o SBS, esses operativos altamente treinados se destacam em operações encobertas, contraterrorismo e guerra não convencional. A presença das Forças Especiais de Elite eleva a agilidade estratégica e a capacidade antiterrorista do Reino Unido, personificando a excelência em precisão e adaptabilidade."
 ENG_UKSF2: "Forças Especiais do Reino Unido"
 ENG_UKSF2_desc: "Compostos por forças de elite como o SAS e o SBS, esses operativos altamente treinados se destacam em operações encobertas, contraterrorismo e guerra não convencional. A presença das Forças Especiais de Elite eleva a agilidade estratégica e a capacidade antiterrorista do Reino Unido, personificando a excelência em precisão e adaptabilidade."
 ENG_aircraft_ai_idea: "Integração de IA em Aeronaves"
 ENG_aircraft_ai_idea_desc: "Com o avanço da tecnologia, o Reino Unido é pioneiro na Integração de IA em Aeronaves, combinando inteligência artificial de ponta com capacidades aéreas. Este espírito nacional representa o compromisso de aproveitar a IA para melhor desempenho de aeronaves, sistemas autônomos e capacidades de missão adaptativas."
 ENG_quality_over_quantity: "Qualidade sobre Quantidade"
 ENG_worldwide_command1: "Comando Mundial"
 ENG_worldwide_command1_desc: "O conceito de um Comando Mundial do Exército Britânico prevê uma abordagem estratégica em que o Exército Britânico estende seu alcance operacional globalmente. Essa iniciativa envolve o estabelecimento de uma estrutura de comando capaz de coordenar e conduzir operações militares em escala mundial. Por meio do envio de forças a várias regiões, as Forças Armadas Britânicas buscam ampliar sua influência global, responder a ameaças emergentes e contribuir para a segurança internacional. O Comando Mundial do Exército Britânico representa um compromisso com um engajamento militar proativo e versátil, alinhado à natureza cambiante dos desafios de segurança globais."
 ENG_worldwide_command2: "Comando Mundial"
 ENG_worldwide_command2_desc: "O conceito de um Comando Mundial do Exército Britânico prevê uma abordagem estratégica em que o Exército Britânico estende seu alcance operacional globalmente. Essa iniciativa envolve o estabelecimento de uma estrutura de comando capaz de coordenar e conduzir operações militares em escala mundial. Por meio do envio de forças a várias regiões, as Forças Armadas Britânicas buscam ampliar sua influência global, responder a ameaças emergentes e contribuir para a segurança internacional. O Comando Mundial do Exército Britânico representa um compromisso com um engajamento militar proativo e versátil, alinhado à natureza cambiante dos desafios de segurança globais."
