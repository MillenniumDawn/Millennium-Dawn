 AFG_secure_border_with_pakistan_tt: "\nBudując fortyfikacje bezpieczeństwa wzdłuż granicy afgańsko-pakistańskiej, §Gzmniejszy się§! skuteczność £GFX_AFG_salafist_jihadism §RTaliban§! infiltracja naszego kraju. Budowa rozpocznie się od §Ycentralny§! Najpierw Afganistan ze względu na jego znaczenie polityczne, a następnie kontynuuj z §Ypołudniowego§! Afganistan do §Ypółnocny§! Afganistan\n"
