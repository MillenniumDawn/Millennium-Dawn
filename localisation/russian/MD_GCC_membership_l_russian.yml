 gcc_invite.1.t: "Приглашение из Персидского залива"
 gcc_invite.1.d: "[FROM.GetName], выступая от имени Совета сотрудничества арабских государств Персидского залива, направил нам официальное приглашение присоединиться к союзу. Членство в нем свяжет нашу экономику и безопасность с самым богатым блоком в арабском мире. Совет ожидает нашего ответа."
 gcc_invite.1.a: "Мы принимаем. Да здравствует Совет."
 gcc_invite.1.b: "На данный момент мы должны отказаться."
 gcc_invite.2.t: "ССАГПЗ приветствует Нового члена"
 gcc_invite.2.d: "На церемонии в Эр-Рияде Совет сотрудничества арабских государств Персидского залива официально принял новое государство-член, впервые расширив союз за пределы Персидского залива. Охват блока и его амбиции растут."
 gcc_invite.2.a: "Исторический день."
 gcc_invite.3.t: "Приглашение отклонено"
 gcc_invite.3.d: "Наше приглашение было отклонено. Расширению Совета придется подождать, пока не появится более готовый партнер или не изменится его мнение."
 gcc_invite.3.a: "Да будет так."
