 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_early: "Order the early §YBRDM-2§! upgrade in Mykolayiv"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_early_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2ld_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YMykolayiv Tank Repair Plant§! and the Morozov design bureau in Kharkiv have prepared two similar upgrades. Both add side hatches for the crew. The §YBRDM-2LD§! also gets a new diesel engine, while the §YBRDM-2M§! keeps the old gasoline one.\n\nThe offer stays open until the end of §Y2001§!. If we pass on it, the plant returns with a deeper upgrade in §Y2004§!.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_early_mission: "Last chance: early §YBRDM-2§! upgrade"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_early_mission_desc: "$ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_early_desc$\n\n§RThe plant withdraws the offer when the timer runs out.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_developed: "Order the §YBRDM-2DI Khazar§! upgrade in Mykolayiv"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_developed_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2di_for_tooltip\n\n\n\n\n\n\n\n\n§WOur missions abroad showed what a modern scout car needs. The §YMykolayiv Tank Repair Plant§! offers the §YBRDM-2DI Khazar§! with an IVECO diesel, a thermal imager, a video surveillance system and an extra hatch for the dismounts. For an extra cost, the plant can also fit the new §YBuh§! weapon station.\n\nThe offer stays open until the end of §Y2005§!.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_developed_mission: "Last chance: §YBRDM-2DI Khazar§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_developed_mission_desc: "$ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_developed_desc$\n\n§RThe plant withdraws the offer when the timer runs out.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.10.name: "The Next Step for the BRDM-2T"
 ukraine_modernize_sov_equipment_brdm_2_modernization.10.desc: "Techimpex can take the BRDM-2T further in two directions. The lightened version drops the turret for open machine gun mounts and BTR-70 style hatches, while the improved version keeps the turret and adds a Kevlar spall liner and a new gearbox."
 ukraine_modernize_sov_equipment_brdm_2_modernization.10.a: "Develop the lightened §YBRDM-2T zr. 2013§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.10.b: "Develop the improved §YBRDM-2T zr. 2015§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.11.name: "BRDM-2T zr. 2013 Ready"
 ukraine_modernize_sov_equipment_brdm_2_modernization.11.desc: "Techimpex has finished the §YBRDM-2T zr. 2013§!. Without the turret and the belly wheels, it has wide side hatches, an NSVT heavy machine gun and a PKT on open mounts."
 ukraine_modernize_sov_equipment_brdm_2_modernization.11.a: "Adopt the §YBRDM-2T zr. 2013§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.12.name: "BRDM-2T zr. 2015 Ready"
 ukraine_modernize_sov_equipment_brdm_2_modernization.12.desc: "Techimpex has finished the §YBRDM-2T zr. 2015§!. It keeps the turret and adds BRDM-2LD style hatches, a five-speed gearbox, Rosava tires, a Motorola radio and a Kevlar spall liner."
 ukraine_modernize_sov_equipment_brdm_2_modernization.12.a: "Adopt the §YBRDM-2T zr. 2015§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.13.name: "Mayak Offers the BRDM-2DP"
 ukraine_modernize_sov_equipment_brdm_2_modernization.13.desc: "The §YMayak§! plant in Kyiv has developed its own lightened §YBRDM-2DP§! with a diesel engine, side doors and removable anti-cumulative screens. Mayak asks for funding to finish the work and hand the design over to us."
 ukraine_modernize_sov_equipment_brdm_2_modernization.13.a: "Fund Mayak"
 ukraine_modernize_sov_equipment_brdm_2_modernization.13.b: "We stay with Techimpex"
 gets_event_delayed_tt: "\nWe will get an event '§Y$EVENT_NAME$§!' in approximately §Y$DAYS$§! days.\n"
 ukr_economy_rate.1.b: "Keep the rate where it is"
 UKR_develop_bastion_flag: "Completed decision §YDevelop T-84 'Bastion'§!"
 UKR_restore_an_71: "Resume work on the §YAn-71§!\nearly warning aircraft"
 UKR_restore_an_71_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_soviet_an_71_development_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YAn-71§! is an airborne early warning aircraft that §LAntonov Design Bureau§! built from the §YAn-72§! transport, with its radar dome mounted on top of a forward-swept fin. It first flew on 12 July 1985 to direct §RSoviet§! frontal aviation, but the program ended with the §RSoviet Union§!, and its §YVega-M Kvant§! radar never fully solved ground clutter.\nPrototype §YNo. 03§! still stands at Antonov after 362 flights, and India has shown interest in buying the type. Restoring the program would give our Air Force its own early warning aircraft.\n\n§GA particularly important military project:§! once it is completed, the §YVerkhovna Rada§! will be more willing to approve a higher military budget.§!"
 ukraine_modernize_planes_restore_an_71.1.name: "A Radar for the An-71"
 ukraine_modernize_planes_restore_an_71.1.desc: "Antonov has restored prototype No. 03 and gathered the old An-71 team. The airframe is sound, but the radar will decide the program. Vega-M in Moscow offers to finish the Kvant, while Israel's Elta offers a lighter version of its Phalcon phased-array radar for the An-71's disc radome."
 ukraine_modernize_planes_restore_an_71.1.a: "Finish the §YKvant§! with Vega-M"
 ukraine_modernize_planes_restore_an_71.1.b: "Buy the Israeli §YPhalcon§! radar"
 ukraine_modernize_planes_restore_an_71_kvant_tt: "In about §Y6 months§!, the §YAn-71§! flies again with the Soviet §YKvant§! radar (§Y$weap_buff_awacs_1$§!)."
 ukraine_modernize_planes_restore_an_71_phalcon_tt: "In about §Y9 months§!, the §YAn-71I§! flies with the Israeli §YPhalcon§! radar (§Y$weap_buff_awacs_2$§!)."
 ukraine_modernize_planes_restore_an_71.2.name: "The An-71 Flies Again"
 ukraine_modernize_planes_restore_an_71.2.desc_kvant: "Prototype No. 03 has flown with the reworked Kvant radar, and Vega-M's new filters finally pick out low-flying targets. Kharkiv Aircraft Plant, which builds the An-74, offers to carry that aircraft's improvements over to the An-71 airframe."
 ukraine_modernize_planes_restore_an_71.2.desc_phalcon: "Prototype No. 03 has flown with the Israeli radar in its disc radome, and the phased array tracks low-flying targets far better than the Kvant ever did. Kharkiv Aircraft Plant, which builds the An-74, offers to carry that aircraft's improvements over to the An-71 airframe."
 ukraine_modernize_planes_restore_an_71.2.a: "Rebuild it to the §YAn-74TK-200§! standard"
 ukraine_modernize_planes_restore_an_71.2.b: "Move the engines under the wing, as on the §YAn-74TK-300§!"
 ukraine_modernize_planes_restore_an_71.2.c: "Keep the prototype airframe"
 ukraine_modernize_planes_restore_an_71_200_tt: "In about §Y5 months§!, Kharkiv delivers the An-74TK-200 airframe: stronger de-icing (§Y$spec_redundant_3$§!), larger fuel tanks (§Y$spec_refuel_1$§!) and a bigger avionics bay (§Y$avionics_manned_2$§!)."
 ukraine_modernize_planes_restore_an_71_300_tt: "In about §Y8 months§!, Kharkiv and §YMotor Sich§! deliver the An-74TK-300 layout: underwing engines (§Y$engine_jet_double_3$§!) and new cockpit avionics (§Y$avionics_manned_3$§!). The aircraft loses the short takeoff of the over-wing engine layout."
 ukraine_modernize_planes_restore_an_71.3.name: "An-71 Rebuilt to the An-74TK-200 Standard"
 ukraine_modernize_planes_restore_an_71.3.desc: "Kharkiv has rebuilt the An-71 to the An-74TK-200 standard. Better de-icing, larger fuel tanks and a bigger avionics bay let it patrol longer and in harsher weather."
 ukraine_modernize_planes_restore_an_71.3.a: "Adopt the new airframe"
 ukraine_modernize_planes_restore_an_71.4.name: "An-71 Gets the An-74TK-300 Layout"
 ukraine_modernize_planes_restore_an_71.4.desc: "Kharkiv has moved the An-71's engines onto underwing pylons, as on the An-74TK-300. The aircraft gives up its short takeoff but cruises faster and burns less fuel on long patrols."
 ukraine_modernize_planes_restore_an_71.4.a: "Adopt the new airframe"
