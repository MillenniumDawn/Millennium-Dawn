 TUR_support_in_lebanon: "Unterstützung in §H Lebanon§! verstärken."
 TUR_support_in_jordan: "Unterstützung in §HJordanien §! verstärken!"
 TUR_support_in_saudi: "Unterstützung in §H Hedschas §! verstärken!"
 TUR_open_balkans: "§HÖffne den Balkan-Bereich§!"
 TUR_close_balkans: "§HSchließe den Balkan-Bereich§!"
 TUR_support_in_bulgaria: "Unterstützung in §H Bulgarien §! verstärken!"
 TUR_support_in_greece: "Unterstützung in §H Griechenland §! verstärken!"
 TUR_support_in_macedonia: "Unterstützung in §H Mazedonien §! verstärken!"
 TUR_open_assimulate: "§HOpen Assimilated Countries§!"
 TUR_close_assimulate: "§HClose Assimilated Countries§!"
 TUR_assimulate_macedonia: "Assimilate Macedonia"
 TUR_assimulate_greece: "Assimilate Greece"
 TUR_assimulate_bulgaria: "Assimilate Bulgaria"
 TUR_assimulate_hejaz: "Assimilate Hejaz"
 TUR_assimulate_lebanon: "Assimilate Lebanon"
 TUR_assimulate_jordan: "Assimilate Jordan"
 TUR_assimulate_israel: "Assimilate Israel/Palestine"
 TUR_assimulate_kuwait: "Assimilate Kuwait"
 TUR_assimulate_syria: "Assimilate Syria"
 TUR_assimulate_iraq: "Assimilate Iraq"
 TUR_invite_azerbaijan: "Aserbaidschan einladen"
 TUR_invite_azerbaijan_desc: "Unsere Brüder in Aserbaidschan haben sich nach diesem Tag gesehnt, an dem wir uns vereinigen. Hoffen wir, dass sie mehr als glücklich sind, sich uns anzuschließen."
 TUR_invite_kazakhstan: "Kasachstan einladen"
 TUR_invite_kazakhstan_desc: "Kazakhs currently have some of the most land in the Turkic world. Their invitation to the Confederation should be a no-brainer."
 TUR_invite_uzbekistan: "Usbekistan einladen"
 TUR_invite_uzbekistan_desc: "Uzbeks will be delighted upon hearing the news that their nation is eligible to join the Turkic Confederation. There will be no doubts they will join."
 TUR_invite_turkmenistan: "Turkmenistan einladen"
 TUR_invite_turkmenistan_desc: "Turkmenistan is not a country that really opens itself up to the world, but surely they will open themselves up to their Turkic friends."
 TUR_land_reforms: "Bodenreformen"
 TUR_land_reforms_desc: "Wir werden die Art und Weise, wie die Landverteilung unter unserem Volk gehandhabt wird, vollständig reformieren."
 TUR_military_debug: "Die TSK"
 TUR_seize_mafia_assets: "Mafia-Vermögen beschlagnahmen"
 TUR_seize_mafia_assets_desc: "Jetzt, wo wir mehrere Mafia-Mitglieder verhaftet haben, können wir ihr Vermögen beschlagnahmen für... Ermittlungszwecken beschlagnahmen."
 TUR_seize_goods_from_ports: "Waren aus Häfen stehlen"
 TUR_assassinate_abdul_mustafa: "Abkommen mit den Kurden"
 TUR_assassinate_abdul_mustafa_desc: "Ever since the Kurds gained autonomy in Northern Iraq back in the 90's, our security forces have been put on high alert due to the boost in morale of Kurdish separatists. By assassinating the governor of Kirkuk we will be able to severely damage Kurdish morale, and resistance."
 TUR_gulenist_educators2_desc: "Wir haben uns darauf konzentriert, unsere Bildung zu verbessern, und wir müssen die Lehren von Gülen verbreiten, solange wir noch können."
 TUR_9833_name_mhp: "Konstantinopel"
 TUR_flavor_event.5.b: "Tragisch"
 TUR_support_from_kurdish_television: "Unterstützung des kurdischen Fernsehens"
 TUR_support_from_kurdish_television_desc: "Kurdische Fernsehsender, die wir mit aufgebaut haben, haben begonnen, unsere Regierung und unseren Staat zu unterstützen und gut über sie zu sprechen."
 PKK_hard_fought_freedom: "Hart erkämpfte Freiheit"
 PKK_hard_fought_freedom_desc: "Unsere Freiheit ist uns nicht leicht gefallen. Die tapferen Kämpfer Kurdistans haben Jahrzehnte gebraucht, um die Autonomie vom türkischen Staat zu erlangen, und diese Freiheit wird bis zum letzten Kurden verteidigt werden!"
 TUR_revised_political_party_laws: "Gezielte politische Gesetze"
 TUR_revised_political_party_laws_desc: "Certain laws have been passed that limit the ability of certain political parties to say what they want."
 TUR_scorched_earth_tactics: "Taktik der verbrannten Erde"
 TUR_supply_disruption: "Logistische Probleme"
 TUR_PKK_released_TT: "Der Aufstand der £TUR_Neutral_Communism §OPKK§! wird enden!\n - Die £TUR_Neutral_Communism §OPKK§! wird das Regierungsorgan des neuen kurdischen Staates werden."
 PKK_strength_TT: "PKK Stärke"
 PKK_strength2_TT: "Diese Variable zeigt an, wie stark die PKK geworden ist. Diese Variable steigt jedes Jahr um 5-10%, und sobald sie 100% erreicht, wird die PKK ausbrechen und einen Unabhängigkeitskrieg führen. Je mehr Stützpunkte wir räumen, desto schwächer wird die PKK. Wir müssen schnell handeln, sonst kann die PKK in ein paar Jahren ausbrechen."
 TUR_pkk_manpower_TT: "Arbeitskräfte der [ROOT.TUR_PKK_bases_name] Basis"
 TUR_pkk_manpower2_TT: "Diese Variable zeigt die in der Basis [ROOT.TUR_PKK_bases_name] vorhandene Mannstärke an. Wenn es uns gelingt, sie auf unter 100 zu bringen, können wir die PKK dauerhaft aus diesem Gebiet vertreiben. Sobald wir die PKK in allen Bundesstaaten ausgerottet haben, können wir den vollständigen Sieg über die PKK erklären."
 TUR_PKK_insurgency_formally_ends_TT: "Der £TUR_Neutral_Communism §O PKK-Aufstand §! wird enden"
 TUR_less_than_100_PKK_diyarbakir_TT: "Hat weniger als §H100 Arbeitskräfte§! in der §HDiyarbakır§! Basis"
 TUR_less_than_100_PKK_van_TT: "Hat weniger als §H100 Arbeitskräfte§! im §HVan§! Basis"
 TUR_less_than_100_PKK_euphrates_TT: "Hat weniger als §H100 Arbeitskräfte§! im §HEuphrat§! Basis"
 TUR_has_large_mil_or_higher_TT: "Hat §OLarge Militärausgaben§! oder höher"
 TUR_automate_warfare_TT: "Wird eine Operation gegen die £TUR_Neutral_Communism PKK beginnen\n - Anstatt diesen Stützpunkt ständig anzugreifen, wird dies automatisch geschehen\n - Am Ende jedes Monats wird eine bestimmte Anzahl von £TUR_Neutral_Communism PKK tot sein\n - Während eine Operation aktiv ist, werden wir Ausrüstung und Arbeitskräfte ausgeben\n - Wir werden Ereignisse im Zusammenhang mit den Kämpfen erhalten, während die Operationen laufen\n - Die £TUR_Neutral_Communism PKK wird eher tief in Anatolien angreifen"
 TUR_end_automate_warfare_TT: "Wird die Operationen gegen die £TUR_Neutral_Communism PKK in diesem Staat beenden"
 TUR_spend_equipment_TT: "§RWe will lose§!:\n - Irgendwo zwischen §H150§! und §H460§! Kleinwaffen\n - Überall zwischen §H25§! und §H190§! Utility Trucks\n - Irgendwo zwischen §H5§! und §H65§! Arbeitskräfte"
 TUR_assault_this_base_TT: "Zwischen §H40§! und §H190§! £TUR_Neutral_Communism PKK Aufständische werden §Getötet§!"
 TUR_finalized_kurdish_reforms_TT: "Wir werden §Hfinalisieren§! und ein Referendum über [PKK.GetFlag] §HKurdische§! Unabhängigkeit abhalten\n - Wir werden §Rnicht§! in der Lage sein, weitere Reformen zu verabschieden, wenn wir diese Entscheidung treffen"
 TUR_release_ocalan_TT: "§Hadullah Öcalan§! wird freigelassen"
 TUR_completed_reconciliations_TT: "Alle Reformen sind abgeschlossen und verabschiedet"
 TUR_PKK_broke_free_tt: "Die [PKK.GetFlag] PKK wird ausbrechen!\n - Wir werden nicht in der Lage sein, direkt einzugreifen, es sei denn, wir rechtfertigen ein Kriegsziel oder beginnen einen Krieg durch einen Überfall.\n - Die [PKK.GetFlag] PKK wird über ein stehendes Heer verfügen, das einen großen Verteidigungsbonus gegen uns hat.\n - Wir werden alle Kerne in den kurdischen Gebieten verlieren."
 TUR_double_damage_TT: "Wird §H2X§! mehr §HPKK-Aufständische§ eliminieren§!\n§H50%§! Chance, dass wir §H1 Zivile Industrie§ verlieren§!"
 TUR_2X_LOSS_TT: "§H50% Chance§! we lose §H2X More§! Equipment"
 TUR_AIR_LOSS_TT: "§H50% Chance§! wir verlieren ein §HTransportflugzeug§!"
 TUR_PKK_DAMAGE_300_TT: "Eliminierung von §H300§! §HPKK Aufständische§!"
 TUR_PKK_DAMAGE_200_TT: "Eliminierung von §H200§! §HPKK-Aufständische§!"
 TUR_PKK_DAMAGE_100_2_TT: "Verhaftungen §H100§! §HPKK Aufständische§!"
 TUR_PKK2_TT: "£decision_icon_small §YUnlocks§! Zusätzliche §YEntscheidungen§! für Ärger in Kurdistan\n - Die Wahl dieser Option wird es uns ermöglichen, eine größere Dominanz über die kurdischen Gebiete im Nahen Osten zu erlangen.\n - Wenn wir erfolgreich alle PKK-Stützpunkte zerstören, werden wir in der Lage sein, dem kurdischen Separatismus in der Türkei ein dauerhaftes Ende zu setzen."
 TUR_PKK3_TT: "£decision_icon_small §YUnlocks§! Additional §YDecisions§! for Trouble in Kurdistan\n - This option replaces military operations against £TUR_Neutral_Communism  §HPKK bases§!. Destroying bases will not fulfill the promise.\n - We will have §H1,500 days§! to pass the required reforms. Starting a reform extends the deadline.\n - This option will grant the [PKK.GetFlag] Kurds more autonomy.\n - [PKK.GetFlag] Diyarbakir will become an autonomous region, with much of its industry controlled by us.\n - The [PKK.GetFlag] PKK will have its own army, government, and territory.\n - Taking this option will anger neighboring countries with sizeable Kurdish minorities."
 TUR_rebuilding_kurdistan: "Wiederaufbau Kurdistans"
 TUR_rebuilding_kurdistan_desc: "\n£TUR_desctext_PKK \n\n\n\n\nOur promise of reconciliation has renewed hopes in the Kurdish population living in the Eastern parts of our great nation. Though they will be a separate entity, the new Kurdish state will still need to answer to our government. In order to create a stable, and self-sufficient Kurdish state, we must first create the necessary infrastructure and framework for it to hold itself without collapsing or relying on us too much. If we fail to deliver this promise, we may lose complete control over the region."
 TUR_PKK_mechanic: "Unruhen in Kurdistan"
 TUR_PKK_mechanic_desc: "\n£TUR_desctext_PKK \n\n\n\n\nThe £TUR_Neutral_Communism  §HPKK§! first began their attacks in the late 70's, and ever since, have persisted in their efforts of gaining autonomy or out-right independence from our nation. The £TUR_Neutral_Communism  §HPKK§! have spread their movement to neighboring states, destabilizing our neighbors, and creating a need for closer cooperation. We can do little in stopping the growth of their strength except for attacking them. The more bases we clear out, the weaker their strength becomes. Taking out the £TUR_Neutral_Communism  §HPKK§! is a race against time, the longer we take to clear them out, the closer they get to a major revolt or independence.\n\nSelected Base: [ROOT.TUR_PKK_bases_name]"
 TUR_PKK_van_manpower: "[?var_pkk_van]"
 TUR_PKK_diyarbakir_manpower: "[?var_pkk_diyarbakir]"
 TUR_PKK_euphrates_manpower: "[?var_pkk_euphrates]"
 TUR_hold_meeting: "Abhaltung des Diyarbakır-Gipfels"
 TUR_hold_meeting_desc: "We can convene in Diyarbakır with our allies, and together we can agree on a deal to move forward. Either we can cooperate with our allies, and take on the PKK together at a cost, or we can decide to do things on our own, potentially risking conflict with our neighbors if we choose to pursue cross-border raids. We can also choose to announce our intention to grant the Kurds autonomy at the summit."
 TUR_select_van_base: "Operationen im Transporter durchführen"
 TUR_select_van_base_desc: "Die Region Van ist die Provinz mit den meisten PKK-Aktivitäten und grenzt sowohl an den Iran als auch an Armenien."
 TUR_select_diyarbakir_base: "Durchführung von Operationen in Diyarbakır"
 TUR_select_diyarbakir_base_desc: "Diyarbakır, das Gebiet mit dem vielleicht größten Widerstand von PKK-Mitgliedern und -Anhängern, war ein Hotspot für PKK-Aktivitäten."
 TUR_select_euphrates_base: "Durchführung von Operationen am Mittleren Euphrat"
 TUR_select_euphrates_base_desc: "Obwohl das Gebiet am Mittleren Euphrat ruhiger ist als andere Gebiete, sind dort aktive PKK-Zellen unterwegs."
 TUR_assault_this_base: "Angriff auf [ROOT.TUR_PKK_bases_name] starten"
 TUR_assault_this_base_desc: "Durch einen Angriff auf [ROOT.TUR_PKK_bases_name] können wir die PKK-Hochburgen direkter ausschalten."
 TUR_greenlight_operations_in_van: "Greenlight-Betrieb in Van"
 TUR_greenlight_operations_in_van_desc: "Wir können der TSK grünes Licht geben, um einen Großangriff gegen die PKK in Van zu starten."
 TUR_end_operations_in_van: "Operationen beenden in Van"
 TUR_end_operations_in_van_desc: "Wir müssen die Arbeiten in Van abschließen, da Ressourcen und Planung an anderer Stelle benötigt werden."
 TUR_greenlight_operations_in_diyarbakir: "Greenlight-Einsätze in Diyarbakır"
 TUR_greenlight_operations_in_diyarbakir_desc: "Wir können der TSK grünes Licht geben, um einen Großangriff gegen die PKK in Diyarbakır zu starten."
 TUR_end_operations_in_diyarbakir: "Operationen in Diyarbakir beenden"
 TUR_end_operations_in_diyarbakir_desc: "Wir müssen die Operationen in Diyarbakır abschließen, da anderswo Ressourcen und Planung benötigt werden."
 TUR_greenlight_operations_in_euphrates: "Grünes Licht für Operationen am Mittleren Euphrat"
 TUR_greenlight_operations_in_euphrates_desc: "Wir können der TSK grünes Licht geben, um einen Großangriff gegen die PKK am Mittleren Euphrat zu starten."
 TUR_end_operations_in_euphrates: "Operationen am Mittleren Euphrat beenden"
 TUR_end_operations_in_euphrates_desc: "Wir müssen die Operationen am Mittleren Euphrat abschließen, da Ressourcen und Planung an anderer Stelle benötigt werden."
 TUR_clean_out_PKK_in_van: "PKK-Präsenz in Van beenden"
 TUR_clean_out_PKK_in_van_desc: "Es ist an der Zeit, dass wir die Präsenz der PKK in Van und den umliegenden Gebieten endlich beenden. Unser Erfolg im Kampf gegen die PKK hat sich bisher ausgezahlt, aber werden wir in der Lage sein, den Frieden in Van zu erhalten?"
 TUR_clean_out_PKK_in_diyarbakir: "Beendigung der PKK-Präsenz in Diyarbakır"
 TUR_clean_out_PKK_in_diyarbakir_desc: "Es ist an der Zeit, dass wir die Präsenz der PKK in Diyarbakır und den umliegenden Gebieten endlich beenden. Unser Erfolg im Kampf gegen die PKK hat sich bisher ausgezahlt, aber werden wir in der Lage sein, den Frieden in Diyarbakır zu erhalten?"
 TUR_clean_out_PKK_in_euphrates: "Beendigung der PKK-Präsenz am Mittleren Euphrat"
 TUR_clean_out_PKK_in_euphrates_desc: "Es ist an der Zeit, dass wir die Präsenz der PKK am Mittleren Euphrat und in den umliegenden Gebieten endlich beenden. Unser Erfolg im Kampf gegen die PKK hat sich bisher ausgezahlt, aber werden wir den Frieden am Mittleren Euphrat erhalten können?"
 TUR_declare_victory_over_PKK: "Triumph über die PKK"
 TUR_declare_victory_over_PKK_desc: "Es ist an der Zeit, dass wir den lang erwarteten Sieg und Triumph über die PKK-Terroristen erringen, die vor mehreren Jahrzehnten begonnen haben, unsere Souveränität rücksichtslos anzugreifen."
 TUR_the_promise_of_no_return: "Das Versprechen der Nichtwiederkehr"
 TUR_the_promise_of_no_return_desc: "We promised the Kurdish community in the east greater autonomy. Complete five reforms and finalize them before the deadline. Starting each reform extends the deadline. Military operations against PKK bases do not affect this mission."
 TUR_finalize_the_reforms: "Die Reformen abschließen"
 TUR_finalize_the_reforms_desc: "Nach der Verabschiedung zahlreicher Reformen ist es nun an der Zeit, die Reformen abzuschließen und ein ordentliches kurdisches Referendum abzuhalten."
 TUR_power_infrastructure: "Aufbau einer angemessenen Energieinfrastruktur"
 TUR_power_infrastructure_desc: "Das Fehlen eines angemessenen Stromnetzes kann zu kolossalen Misserfolgen bei der Verwaltung eines Staates führen. Der neue kurdische Staat wird nicht anders sein."
 TUR_jobs_and_careers: "Kurdische Jobs und Karrieren"
 TUR_jobs_and_careers_desc: "Arbeitsplätze sind eine Notwendigkeit für das Gedeihen des kurdischen Staates. Ohne angemessene Beschäftigung und Produktivität würde die Wirtschaft jeder Nation in sich selbst zusammenbrechen."
 TUR_kurdish_security_apparatus: "Aufbau des kurdischen Sicherheitsapparats"
 TUR_kurdish_security_apparatus_desc: "Without proper security and a competent armed force, the Kurdish state will be susceptible to foreign or internal attacks on its territory. This would eventually spill over into Turkey itself, which is something that we simply cannot afford."
 TUR_pass_the_infrastructure_bill: "Verabschiedung des Gesetzes zur Infrastrukturreform"
 TUR_pass_the_infrastructure_bill_desc: "Mit der Verabschiedung des Gesetzes zur Reform der Infrastruktur Ostkurdistans werden wir in der Lage sein, die Verlagerung verschiedener Industrien nach Zentralanatolien formell zu genehmigen und die Infrastruktur aufzubauen, die der künftige Staat für den Aufbau seiner eigenen Industrien benötigt."
 TUR_release_ocalan: "Öcalan freilassen"
 TUR_release_ocalan_desc: "Abdullah Öcalan befindet sich seit einiger Zeit in unserem Gefängnis und stand mehrfach kurz vor der Hinrichtung. Es ist an der Zeit, dass wir Öcalan wieder in die Gesellschaft entlassen, wenn wir unsere Beziehungen zu den Kurden verbessern wollen."
 TUR_PKK_VAN_BASE: "Van"
 TUR_PKK_DIYARBAKIR_BASE: "Diyarbakir"
 TUR_PKK_EUPHRATES_BASE: "Mittlerer Euphrat"
 TUR_PKK_NO_BASE: "Keine Basis ausgewählt"
 TUR_PKK_NO_BASE_STRENGTH: "N/A"
 TUR_pkk.2.b: "Nein. Das ist eine Bedrohung für unsere Souveränität."
 TUR_pkk.100.t: "Vor-Operations-Schlag auf [ROOT.TUR_PKK_bases_name]"
 TUR_pkk.100.d: "Wir haben die Phase erreicht, in der wir damit beginnen müssen, die Verteidigung der PKK in dem Stützpunkt, den wir ins Visier nehmen, zu schwächen. Derzeit wird die PKK-Bewegung um [ROOT.TUR_PKK_bases_name] kartiert, damit wir vor der Operation Angriffe durchführen können. Es besteht immer die Möglichkeit, dass etwas schief geht, aber wir sollten uns keine allzu großen Sorgen über ein Scheitern machen, wenn unsere Truppen gut vorbereitet und effektiv sind."
 TUR_pkk.100.a: "Einen koordinierten Luftangriff starten"
 TUR_pkk.100.b: "Ihre Versorgungslinien unterbrechen"
 TUR_pkk.100.c: "Pfeffert sie mit Artillerie"
 TUR_pkk.100.d1: "Wir können die Sache aussitzen"
 TUR_pkk.200.t: "Truppen gehen die Vorräte aus"
 TUR_pkk.200.d: "Berichte, die von der Front in [ROOT.TUR_PKK_bases_name] kommen, deuten auf einen Mangel an Nachschub hin, was ein mögliches Scheitern unserer operativen Fähigkeit, der PKK Schaden zuzufügen, signalisiert. Wir können den Truppen an der Front ihre dringend benötigte Ausrüstung schicken, aber wir müssen auch daran denken, unsere eigenen Vorräte für jeden potenziellen Konflikt, der sich auf der internationalen Bühne abzeichnet, zu erhalten."
 TUR_pkk.200.a: "Lufttransport von allem, was sie brauchen"
 TUR_pkk.200.b: "Übergabe der Ausrüstung an vertrauenswürdige Einheimische zum Transport"
 TUR_pkk.200.c: "Sie können nutzen, was sie jetzt haben"
 TUR_pkk.201.t: "PKK verschanzt sich in Wohngebiet"
 TUR_pkk.201.d: "Die PKK hat beschlossen, in einem Wohngebiet Verteidigungspositionen einzunehmen und damit die Zivilbevölkerung zu gefährden. Wir müssen einen Weg finden, diese Aufständischen auszuschalten, ohne dass es zu größeren Unruhen in dem Gebiet kommt. Andernfalls könnten wir unseren Ruf und das Leben derjenigen riskieren, die nichts anderes wollen, als in Ruhe gelassen zu werden."
 TUR_pkk.201.a: "Rufen Sie die Kommandoeinheiten auf"
 TUR_pkk.201.b: "Versuchen Sie, nachts zuzuschlagen"
 TUR_pkk.201.c: "Starten Sie einfach einen Angriff!"
 TUR_pkk.202.t: "PKK startet Gegenoffensive"
 TUR_pkk.202.d: "Die PKK hat beschlossen, eine große Gegenoffensive auf die Stadt [ROOT.TUR_PKK_bases_name] zu starten, was zu einiger Unordnung und einem Gefühl der Angst unter einigen Truppen geführt hat. Jetzt ist jedoch nicht die Zeit, um wie kopflose Hühner herumzurennen, sondern es ist an der Zeit, dass wir unsere nächsten Schritte abwägen. Das für den Einsatz zuständige Oberkommando wurde benachrichtigt und wartet auf Befehle."
 TUR_pkk.202.a: "Mit einer eigenen Offensive auf sie reagieren"
 TUR_pkk.202.b: "Eingraben und auf den Angriff vorbereiten"
 TUR_pkk.202.c: "Taktiken der verbrannten Erde anwenden und zurückweichen"
 TUR_pkk.203.t: "Massiver PKK-Konvoi überfallen"
 TUR_pkk.203.d: "Mit erbeuteten militärischen und zivilen Fahrzeugen rückte die PKK von [ROOT.TUR_PKK_bases_name] zu einem anderen Ort vor, um einem unerwarteten Angriff zu entgehen. Unsere Informanten innerhalb der PKK warnten uns jedoch vor der Bewegung, und wir konnten sie in einen Hinterhalt locken. Derzeit ist dieser Konvoi von unserer Jandarma eingekreist, und sie warten auf Befehle, wie sie weiter vorgehen sollen."
 TUR_pkk.203.a: "Alles in der Umgebung zerstören"
 TUR_pkk.203.b: "Greifen Sie an und versuchen Sie, die Ausrüstung zu erbeuten"
 TUR_pkk.203.c: "Sie aushungern, bis sie sich ergeben"
 TUR_pkk.204.t: "PKK versucht, Spaltung zu säen"
 TUR_pkk.204.d: "Die PKK hat versucht, unser Land politisch zu spalten, indem sie zu Massenprotesten im ganzen Land aufrief. Die Bereitschaftspolizei wurde in Bereitschaft versetzt, aber der Kongress und unsere Partei fordern erweiterte Maßnahmen."
 TUR_pkk.204.a: "Verhaftung der Ringanführer"
 TUR_pkk.204.b: "Die Bewegung zu unserem Vorteil nutzen"
 TUR_pkk.204.c: "Gesetze erlassen, um ihre Bewegungen zu schwächen"
 TUR_pkk.205.t: "PKK-Kräfte ziehen sich nach Armenien zurück"
 TUR_pkk.205.d: "PKK fighters that were engaged with our own troops have crossed the border into Armenia, even attacking and holding some Armenian border guards hostage. There are a few who are still trying to flee from the engagement with our troops, but we now have to make a decision to either send reinforcements and prepare to cross the border or continue the fight against the ones who are still trying to flee."
 TUR_pkk.205.a: "das Vorhaben ganz aufgeben"
 TUR_pkk.205.b: "Konzentration auf die, die noch da sind"
 TUR_pkk.205.c: "Verfolgen Sie sie!"
 TUR_pkk.206.t: "Türkische Streitkräfte erleiden eine Niederlage"
 TUR_pkk.206.d: "Berichte von der türkisch-armenischen Grenze deuten darauf hin, dass sich die türkischen Kämpfer in die Türkei zurückziehen, nachdem es ihnen nicht gelungen ist, die nach Armenien geflohenen PKK-Aktivisten gefangen zu nehmen. Armenische Beamte haben wiederholt erklärt, dass sie der PKK keinen Unterschlupf gewährt haben, sondern dass es sich vielmehr um ein unerwartetes Eindringen gehandelt hat und dass man sich um die gefangenen PKK-Kämpfer kümmern wird."
 TUR_pkk.206.a: "Okay"
 TUR_pkk.207.t: "Armenische Streitkräfte halten sich zurück"
 TUR_pkk.207.d: "Nach einer Reihe erfolgreicher Angriffe auf armenische Grenzsoldaten haben sich die dort stationierten Einheiten bereit erklärt, sich zurückzuziehen und die Gefangennahme von PKK-Kämpfern zuzulassen, die von der osttürkischen Grenze nach Armenien geflohen sind."
 TUR_pkk.207.a: "Okay"
 TUR_pkk.208.t: "Türkische und armenische Streitkräfte einigen sich auf Waffenstillstand"
 TUR_pkk.208.d: "Nach einer Reihe von Zusammenstößen zwischen armenischen und türkischen Grenzsoldaten haben sich beide Seiten bereit erklärt, die Waffen niederzulegen und einen Waffenstillstand zu vereinbaren."
 TUR_pkk.208.a: "Okay"
 TUR_pkk.209.t: "Mangel an angemessenem Transport für Truppen"
 TUR_pkk.209.d: "Our troops have somehow managed to get themselves stranded on the way back to their base. Reportedly, PKK militants were able to sabotage much of the convoys used to transport the troops to the Eastern border."
 TUR_pkk.209.b: "Sagen Sie ihnen, sie sollen weiter Druck machen"
 TUR_pkk.209.a: "Mehr Transporte schicken"
 TUR_pkk.209.c: "Retten, was wir können"
 TUR_pkk.210.t: "Mutmaßlicher PKK-Deserteur verspricht Informationen"
 TUR_pkk.210.d: "Angeblich hat sich ein Deserteur der PKK unseren Einheiten gestellt und versprochen, Schlüsselpositionen von PKK-Einheiten in der Umgebung von Van zu verraten. Wenn er nicht lügt, können wir seine Informationen nutzen, um die von ihm verratenen PKK-Stellungen vollständig auszulöschen."
 TUR_pkk.210.a: "Man kann ihm nicht trauen, steckt ihn in eine Zelle."
 TUR_pkk.210.b: "\"Wo sind sie?"
 TUR_pkk.210.c: "Was wissen Sie sonst noch?"
 TUR_pkk.211.t: "Irreführende Informationen führen zu Opfern!"
 TUR_pkk.211.d: "It appears that the information given by the Alleged PKK double agent has been incorrect. As a result, we have lost several good men to this tragedy. Their blood will not be in vain, and our revenge will be swift!"
 TUR_pkk.211.a: "Schrecklich"
 TUR_pkk.212.t: "Informationen führen zu geheimer PKK-Basis"
 TUR_pkk.212.d: "It appears that the information provided to us by the PKK double agent has led to the location of several PKK members at a hidden base. As a result, our men have been able to assault the location and take out several PKK terrorists."
 TUR_pkk.212.a: "Großartig!"
 TUR_pkk.214.t: "Operativer Erfolg in Van"
 TUR_pkk.214.d: "Nach jahrzehntelangen Kämpfen ist der organisierte kurdische Widerstand im Großraum Van zu einem Ende gekommen. Die glorreiche Fahne des türkischen Staates weht höher als je zuvor, und der Neubeginn in der Provinz lässt alle dort lebenden Völker wieder hoffen."
 TUR_pkk.214.a: "Na endlich..."
 TUR_pkk.215.t: "Operativer Erfolg am Mittleren Euphrat"
 TUR_pkk.215.d: "Nach jahrzehntelangen Kämpfen ist der organisierte kurdische Widerstand im Großraum Mittlerer Euphrat zu Ende gegangen. Die glorreiche Fahne des türkischen Staates weht höher als je zuvor, und der Neubeginn in der Provinz lässt alle dort lebenden Völker wieder hoffen."
 TUR_pkk.215.a: "Na endlich..."
 TUR_pkk.216.t: "Operativer Erfolg in Diyarbakır"
 TUR_pkk.216.d: "Nach jahrzehntelangen Kämpfen ist der organisierte kurdische Widerstand im Großraum Diyarbakır zu einem Ende gekommen. Die glorreiche Fahne des türkischen Staates weht höher als je zuvor, und der Neubeginn in der Provinz gibt allen dort lebenden Völkern neue Hoffnung."
 TUR_pkk.216.a: "Na endlich..."
 TUR_pkk.217.t: "[TUR.GetName] Sieg über die PKK verkündet"
 TUR_pkk.217.d: "Die [TUR.GetAdjective]-Regierung hat vor kurzem eine Erklärung veröffentlicht, in der sie erklärt, dass alle größeren Stützpunkte, Zellen und Verstecke der PKK von den [TUR.GetAdjective] Streitkräften (TSK) geräumt wurden. Diese Ankündigung beunruhigt kurdische Separatisten im gesamten Nahen Osten, einschließlich [TUR.GetName] selbst. Die PKK war seit sehr langer Zeit in [TUR.GetName] aktiv, mehrere Jahrzehnte lang seit ihrer Gründung in den 1970er Jahren. Die kurdische Gruppe hoffte ursprünglich auf die Gründung eines unabhängigen Staates im türkischen Osten, doch ihre Bewegung mündete schnell in dem Wunsch nach Autonomie statt völliger Unabhängigkeit. Die [TUR.GetAdjective]-Regierung hat diesem Druck standgehalten und ist nun an einem Punkt angelangt, an dem sie den Sieg über die Bewegung verkünden kann."
 TUR_pkk.217.a: "Interessant"
 TUR_pkk.604.t: "PKK erklärt Generalmobilmachung"
 TUR_pkk.604.d: "Die PKK hat eine allgemeine Mobilisierung gegen unsere Regierung ausgerufen. Ein Sprecher verkündete heute, dass \"alle Anhänger der Bewegung und alle Freiheitskämpfer sich bei Tagesanbruch bei ihren befehlshabenden Offizieren melden müssen\". Auf diese Ankündigung folgten allgemeine Angriffe der PKK auf Städte in der Umgebung der Region Kurdistan, womit die Feindseligkeiten offiziell begannen und eine Atmosphäre großer Sorge für die in diesen Gebieten lebende Bevölkerung geschaffen wurde. In Kürze soll der Ausnahmezustand verhängt werden, bis die PKK vollständig ausgemerzt ist."
 TUR_pkk.604.a: "Sie zeigen ihr wahres Gesicht."
 TUR_pkk.600.t: "Katastrophale Folgen nach dem Scheitern bei der Erfüllung unseres Versprechens"
 TUR_pkk.600.d: "Our empty promises have now caught up to us. The Kurds that reside in the east of our state have seized control over Kurdish majority areas. We no longer formally control these territories, with our government being essentially powerless in making an immediate decision as a result of the bureaucratic process that we are stuck in."
 TUR_pkk.600.a: "Oh nein"
 TUR_pkk.601.t: "Kurdisches Autonomiereferendum angenommen"
 TUR_pkk.601.d: "The Kurdish autonomy referendum has passed with an overwhelming majority of Kurds voting in favor of autonomization. With this referendum, the People's Republic of Kurdistan will become an Eyalet of [TUR.GetName]. The Kurdistan Workers' Party will be the ruling authority in the state, and they will be able to field an army, govern the laws and politics of the region, and hold elections as they see fit. We will still retain control over major industrial and economic sectors, but a fraction of the profits will still go to the Kurdish state."
 TUR_pkk.601.a: "Okay"
 TUR_VAN_SELECTED_OP: "Van ist ausgewählt worden"
 TUR_commence_operations_in_van: "Aufnahme der Tätigkeit in Van"
 TUR_commence_operations_in_van_desc: "Es ist an der Zeit, tief in das Herz der PKK in unserem Land einzudringen. Van ist der östlichste Stützpunkt der PKK in unserem Land und dient der PKK als Ausgangspunkt für viele ihrer Angriffe auf die Westtürkei und den Iran. Wir werden Operationen starten, um sie auszuschalten, und Van wird frei von der Bedrohung sein, die dort all die Jahre geherrscht hat."
 TUR_PKK_ACTIVITY: "Aktiv £TUR_Neutral_Communism  Aufstände der PKK"
 TUR_PKK_ACTIVITY_desc: "Die PKK hat"
 TUR_misak_mili: "Misak-ı Milli"
 TUR_misak_mili_desc: "\n£TUR_desctext_misak \n\n\n\n\n§HMisak-ı Millî§! (National Pact) was a set of six decisions passed by the parliament in the 1920's. Vitalized primarily after the destruction of the [TUR.GetFlag] Ottoman Empire at the hands of the Entente, the §HNational Pact§! sought out to restore some of Turkey's lost glory, and its lands. However the decisions were not followed through with due to the [TUR.GetFlag] Turkish war of independence and the establishment of the [TUR.GetFlag] Turkish Republic by Mustafa Kemal Ataturk. However the concept and ideals of the §HNational Pact§! still resonates within many [TUR.GetFlag] Turkish nationalists in the modern day, despite its lack of wide-spread support in the national populace."
 TUR_armenian_integration: "[ARM.GetFlag] Rückkehr nach Armenien"
 TUR_levantine_vilayets: "[SYR.GetFlag] [LEB.GetFlag] Levantinische Vilayets"
 TUR_eastern_resolve: "[KUR.GetFlag] [PUK.GetFlag] Ostauflösung"
 TUR_aegean_realignment: "[GRE.GetFlag] Neuausrichtung der Ägäis"
 TUR_crescent_and_olive: "[CYP.GetFlag] [NCY.GetFlag] Halbmond und Olive"
 TUR_kurdish_schools: "Kurdische Schulen und Universitäten"
 TUR_kurdish_schools_desc: "Wir werden zulassen, dass die kurdische Sprache neben dem Türkischen in bestimmten Schulen und Städten verwendet wird, wo immer wir dies für notwendig erachten. Dies wird vor allem für junge Menschen hilfreich sein, unabhängig davon, ob sie zweisprachig aufgewachsen sind oder nicht."
 TUR_kurdish_language_5: "Kurdischer Staatskanal"
 TUR_kurdish_language_5_desc: "TRT (short for Türkiye Radyo Televizyon, Turkish Radio and Television) has been our official state TV since '68. Over the years, its numbers grew and there are now several channels of TRT, some of them are for general subjects or for example TRT-Müzik broadcasts only music or TRT-Belgesel broadcasts only documentaries. We should open up a new one that will operate in Kurdish language. This can cost more but will further discredit PKK propaganda."
 TUR_finalized_reforms: " Hat die Reformen abgeschlossen"
 TUR_fight_army_incompetence: "Ja-Sager-Armee"
 TUR_fight_army_incompetence_desc: "Unsere Armee wird reformiert und umstrukturiert, so dass mehr Leute \"Ja, Sir\" sagen und weniger Leute \"Nein\" sagen."
 Turkish_mafia.1200.t: "PKK Insurgency Eliminated"
 Turkish_mafia.1200.d: "Our security forces have completed operations across the Kurdish regions. The PKK's capacity to threaten Turkish territory has been broken and order is being restored."
 Turkish_mafia.1200.a: "Our work here is done."
 Turkish_parties.11.t: "The Rights and Equality Party"
 Turkish_parties.11.d: "Retired general Osman Pamukoğlu, celebrated for his command in the southeast and known to his supporters as the 'Legendary Commander', has founded the Hak ve Eşitlik Partisi (HEPAR). The party blends staunch secular Kemalism with a hard line on the Kurdish question, presenting itself as a nationalist alternative untainted by the established parties."
 Turkish_parties.11.a: "A new force enters the arena"
 TUR_PKK_TT: "£decision_icon_small §YUnlocks§! Additional §YDecisions§! for Trouble in Kurdistan\n - Taking this option will let us move against the PKK while keeping our neighbors on side.\n - [PER.GetFlag] Iran, [SYR.GetFlag] Syria, [IRQ.GetFlag] Iraq and the [KUR.GetFlag] Kurds will be invited to a security summit in Diyarbakir.\n - Every neighbor that attends will help us wear the PKK down."
 TUR_ai_build_the_akp: "Build the Party of Justice and Development"
 TUR_ai_build_the_akp_desc: "The remnants of the Virtue Party's reformist wing are organising a new movement, and the machine behind it is being assembled district by district."
 TUR_ai_rally_the_kemalists: "Rally the Republican Ranks"
 TUR_ai_rally_the_kemalists_desc: "The republican establishment is closing ranks and campaigning hard to keep the secular parties ahead of the field."
 TUR_ai_rally_the_grey_wolves: "Rally the Nationalist Movement"
 TUR_ai_rally_the_grey_wolves_desc: "The nationalist movement is organising in the provinces, and its rallies are drawing crowds the established parties can no longer match."
 TUR_ai_build_hizmet: "Expand the Hizmet Network"
 TUR_ai_build_hizmet_desc: "The movement's schools, newspapers and business associations are quietly building a following that no party list yet reflects."
 TUR_ai_rally_the_left: "Rally the Turkish Left"
 TUR_ai_rally_the_left_desc: "The revolutionary left is organising in the unions and the universities, taking the anti-establishment vote the Islamists have been living on."
 TUR_ai_rally_the_virtue_party: "Rally the Virtue Party"
 TUR_ai_rally_the_virtue_party_desc: "The Islamist movement is consolidating behind the Virtue Party, gathering the votes it will need to govern."
 TUR_ai_rally_the_great_east: "Preach the Great East"
 TUR_ai_rally_the_great_east_desc: "The movement's preachers are carrying Necip Fazıl's vision of a restored Islamic order into the mosques and the party's own rank and file."
 TUR_pkk.605.t: "Renewed Offensive in the Southeast"
 TUR_pkk.605.d: "The PKK has spent years rebuilding in the mountains while the government looked elsewhere, and the general staff will wait no longer. A state of emergency has been declared across the southeastern provinces, reservists are being called up, and the army is moving into the valleys in strength. The insurgency will be broken back down to a manageable size, but the bill will be a heavy one: in conscripts, in lira, and in the government's standing at home."
 TUR_pkk.605.a: "Whatever it takes."
 TUR_PKK_OFFENSIVE_TT: "The £TUR_Neutral_Communism  §OPKK Insurgency§! is beaten back down to a manageable strength, but it is not destroyed."
 TUR_fund_oil_strikes: "Funded Oil Industry Strikes"