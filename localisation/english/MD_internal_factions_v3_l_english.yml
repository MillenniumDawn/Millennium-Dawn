 internal_faction_privilege_grant_tt: "§Y[?global.internal_faction_policy_name^internal_faction_p.GetTokenLocalizedKey]§!\n[?global.internal_faction_policy_desc^internal_faction_p.GetTokenLocalizedKey]\n\nGrant for §Y[?global.internal_faction_cost_grant_pp|0]§! Political Power: opinion §G+10§! now, opinion and influence targets §G+10§! each while active, §R-5§! opinion target for every rival faction.\nRequires no active crackdown on this faction and no policy change in the last [?global.internal_faction_policy_cooldown_months|0] months (§Y[?internal_faction_policy_cooldown^v|0]§! left)."
 internal_faction_privilege_grant_treasury_tt: "§Y[?global.internal_faction_policy_name^internal_faction_p.GetTokenLocalizedKey]§!\n[?global.internal_faction_policy_desc^internal_faction_p.GetTokenLocalizedKey]\n\nGrant for §Y$$[?internal_faction_cost|.2] Billion§! from the Treasury (0.1% of GDP): opinion §G+10§! now, opinion and influence targets §G+10§! each while active, §R-5§! opinion target for every rival faction.\nRequires no active crackdown on this faction and no policy change in the last [?global.internal_faction_policy_cooldown_months|0] months (§Y[?internal_faction_policy_cooldown^v|0]§! left)."
 internal_faction_privilege_revoke_tt: "§Y[?global.internal_faction_policy_name^internal_faction_p.GetTokenLocalizedKey]§!\n[?global.internal_faction_policy_desc^internal_faction_p.GetTokenLocalizedKey]\n\n§GActive.§! Revoke for §Y[?global.internal_faction_cost_revoke|0]§! Political Power: opinion §R-15§!, Stability §R-3%§!.\nRequires no policy change in the last [?global.internal_faction_policy_cooldown_months|0] months (§Y[?internal_faction_policy_cooldown^v|0]§! left)."
 internal_faction_crackdown_enact_tt: "§Y[?global.internal_faction_policy_name^internal_faction_p.GetTokenLocalizedKey]§!\n[?global.internal_faction_policy_desc^internal_faction_p.GetTokenLocalizedKey]\n\nEnact for §Y[?global.internal_faction_cost_crackdown|0]§! Political Power and §R-5%§! Stability: opinion §R-20§! and influence §R-20§! now, opinion target §R-15§! and influence target §R-20§! while active. Cancels this faction's privileges and blocks new ones.\nRequires the Military or the Intelligence Community present and not Hostile; cracking down on the Military requires a Positive Intelligence Community. No policy change in the last [?global.internal_faction_policy_cooldown_months|0] months (§Y[?internal_faction_policy_cooldown^v|0]§! left)."
 internal_faction_crackdown_lift_tt: "§Y[?global.internal_faction_policy_name^internal_faction_p.GetTokenLocalizedKey]§!\n[?global.internal_faction_policy_desc^internal_faction_p.GetTokenLocalizedKey]\n\n§GActive.§! Lift for §Y[?global.internal_faction_cost_lift|0]§! Political Power: opinion §G+5§!.\nRequires [?global.internal_faction_policy_cooldown_months|0] months since the last policy change (§Y[?internal_faction_policy_cooldown^v|0]§! left)."
 internal_faction_appease_button_text: "Appease"
 internal_faction_appease_tt: "Appease this faction for §Y[?global.internal_faction_cost_appease|0]§! Political Power: opinion §G+10§!. Other active factions of the same category lose §R3§! opinion."
 internal_faction_inactive_header: "Other Factions"
 internal_faction_support_button_text: "Support"
 internal_faction_support_tt: "Support this faction for §Y[?global.internal_faction_cost_support|0]§! Political Power: influence §G+15§! now. A faction with influence of at least §Y[?global.internal_faction_active_threshold|0]§! replaces the weakest active faction once it leads it by 5."
 internal_faction_active_tt: "Active faction. The §Y[?global.internal_faction_active_count|0]§! most influential factions are active: they apply their modifiers, react to laws and can receive policies. An inactive faction with influence of at least §Y[?global.internal_faction_active_threshold|0]§! that leads the weakest active faction by 5 takes its place at the monthly tick."
