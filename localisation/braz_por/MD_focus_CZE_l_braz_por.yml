 CZE_AUS_monarchy_event.12.d: "O bloco monarquista superou os partidos republicanos no Conselho Nacional. Com uma maioria funcional por trás e a corte tcheca oferecendo apoio aberto, os restauracionistas suspenderam o calendário eleitoral e proclamaram o arquiduque chefe de Estado. A Segunda República chegou ao fim não pela força das armas, mas por uma votação parlamentar comum."
