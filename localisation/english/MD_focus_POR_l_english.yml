 ### POLITICS ###
 POR_court_of_auditors: "Court of Auditors"
 POR_court_of_auditors_desc: "A court that can stop a contract before the money moves rather than write a report about it afterwards. Every government since the revolution has promised this and every one of them discovered a reason to wait."

 POR_road_ps_tt: "The £POR_western_social_democrat PS is in government"
 POR_road_psd_tt: "The £POR_western_conservative PSD is in government"
 POR_royal_cause_tt: "The £POR_nationalist_monarchist Braganca polls above §Y14%§!"

 ### POLITICS OF THE PUBLIC ARGUMENT ###
 POR_political_modifier: "The Third Republic"
 POR_political_modifier_desc: "The republic of April as it stands: the programme the government was elected on, the arguments it has won, and how far each argument has travelled. A proposal that was unthinkable becomes arguable, then ordinary, and every change of government teaches the public that the other side's settlement was never permanent.\n\n£drift_defence_texticon  §YIdeological Development§!: §H[?POR_ideological_development|0]§!/100 (tier §H[?POR_ideology_tier|0]§!/4)"
 POR_economy_modifier: "The Portuguese Economy"
 POR_economy_modifier_desc: "What the tax code, the budget rule, the state's holdings, the social settlement and the regional programmes currently do to the country. A government that repeals its predecessor's work takes its entry out of this ledger."

 POR_league_of_crowns: "League of Crowns"
 POR_league_of_crowns_modifier: "League of Crowns"
 POR_league_of_crowns_modifier_desc: "A defensive alliance of Europe's restored crowns, led from Lisbon. Each member adds to the standing of the whole: the more thrones, the more the League is worth to every one of them."
 POR_military_modifier: "The Armed Forces"
 POR_military_modifier_desc: "Professionalisation, procurement and the doctrines the three services settled on: what the army, the navy and the air force can find, reach and hold."
 POR_bloc_left_majority_tt: "The £POR_western_social_democrat PS, £POR_anarchist_communism CDU, £POR_non_aligned_socialist_democrat Bloco de Esquerda, £POR_non_aligned_communism PCTP and £POR_emerging_communism POUS together won a §Ymajority§! at the last election"
 POR_bloc_right_majority_tt: "The £POR_western_conservative PSD, £POR_non_aligned_conservative CDS-PP, £POR_western_liberal Nos Cidadaos, £POR_Nat_Populism PNR and £POR_nationalist_monarchist Braganca together won a §Ymajority§! at the last election"
 POR_bloc_centre_majority_tt: "The £POR_western_social_democrat PS and £POR_western_conservative PSD together won a §Ymajority§! at the last election"
 POR_ideology_tier_1_tt: "§YIdeological Development§! is above §Y20§!"
 POR_ideology_tier_2_tt: "§YIdeological Development§! is above §Y40§!"
 POR_ideology_tier_3_tt: "§YIdeological Development§! is above §Y60§!"
 POR_ideology_tier_4_tt: "§YIdeological Development§! is above §Y80§!"
 POR_focus_undone_tt: "  $FOCUS|Y$"
 POR_no_sovereign_wealth_fund_tt: "We have not founded a §YSovereign Wealth Fund§!"
 POR_no_debt_brake_tt: "We have not passed a §YDebt Brake§!"
 portugal_news.7.t: "A Change of Government in Lisbon"
 portugal_news.7.d: "Power has changed hands in Lisbon. Whatever else it settles, it settles that the last government's arrangements were arrangements rather than facts, and everything they decided is now something that can be decided differently."
 portugal_news.7.a: "Nothing is permanent"

 ### CHARACTERS ###
 POR_jorge_silva_carvalho: "Jorge Silva Carvalho"

 ### THE PARTY ROADS ###
 POR_royal_cause: "Royal Cause"
 POR_royal_cause_desc: "The House of Braganza never abdicated and never stopped being asked to. Duarte Pio has spent his life at the edge of national life, saying nothing that could be held against him, which in a republic this tired is a qualification.\n\nA crown would settle the question of who the state belongs to, and it would settle it against the Assembly."

 ### POLICY ###
 POR_programme_of_government: "Programme of Government"
 POR_programme_of_government_desc: "A government is a list of things it intends to do and a majority willing to vote for them. We have the second. The first is what this is."
 POR_economic_policy: "Economic Policy"
 POR_economic_policy_desc: "Everything the state does to the economy is done through two instruments: what it takes and what it builds. Decide which one this government is for."
 POR_financial_policy: "Financial Policy"
 POR_financial_policy_desc: "The revenue has to come from somewhere, and where it comes from is the oldest argument in politics. There is no neutral tax."
 POR_progressive_property_tax: "Progressive Property Tax"
 POR_progressive_property_tax_desc: "The old municipal contribution is replaced by a rate assessed on what a property is actually worth. Nobody's income changes; a great many people's bills do, and the ones whose bills rise have been paying almost nothing for thirty years."
 POR_land_register: "Land Register"
 POR_land_register_desc: "Half the country has never been surveyed, and the half that has was surveyed by people with an interest in the result. A register nobody can argue with is worth more than any rate we could set."
 POR_wealth_tax: "Wealth Tax"
 POR_wealth_tax_desc: "Not on what is earned, and not on what is spent, but on what is held. Every argument against it has been made for two hundred years, and none of them answers the simplest one for it: whatever the state takes from idle fortunes, it does not have to take from work."
 POR_broadening_the_income_tax: "Broadening the Income Tax"
 POR_broadening_the_income_tax_desc: "The base is narrow and the rates are high, which is the worst of both. More people pay, each of them pays less, and the revenue goes up regardless."
 POR_general_vat: "General VAT"
 POR_general_vat_desc: "Consumption is the one thing that cannot leave the country. It is also the tax that falls hardest on people with nothing left over at the end of the month, and everybody in the Assembly knows it."
 POR_flat_tax: "Flat Tax"
 POR_flat_tax_desc: "One rate, no brackets, no exemptions, and an accountancy profession with rather less to do. Capital arrives, revenue falls, and the difference comes out of payslips: the tax that no longer falls on what people own now falls on what they do."
 POR_tax_authority: "Tax Authority"
 POR_tax_authority_desc: "Whoever wrote the code, somebody has to collect it. Merging the revenue services into one body with one database is the least ideological thing in this branch and probably the most effective."
 POR_fiscal_path_1_open_tt: "We are not committed to §Yincome and consumption taxation§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to repeal it"
 POR_fiscal_path_2_open_tt: "We are not committed to §Yasset taxation§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to repeal it"
 POR_fiscal_path_1_held_tt: "Portugal taxes §Yassets§!"
 POR_fiscal_path_2_held_tt: "Portugal taxes §Yincome and consumption§!"
 POR_abandon_fiscal_path_1_tt: "§RRepeals§! §Yasset taxation§!, which we hold. These focuses are §Rundone§! and may be taken again:"
 POR_fiscal_path_1_closed_tt: "§YExclusive§! with §Yasset taxation§!: §Y$POR_progressive_property_tax$§!, §Y$POR_land_register$§! and §Y$POR_wealth_tax$§!. We hold none of it, so nothing is undone"
 POR_abandon_fiscal_path_2_tt: "§RRepeals§! §Yincome and consumption taxation§!, which we hold. These focuses are §Rundone§! and may be taken again:"
 POR_fiscal_path_2_closed_tt: "§YExclusive§! with §Yincome and consumption taxation§!: §Y$POR_broadening_the_income_tax$§!, §Y$POR_general_vat$§! and §Y$POR_flat_tax$§!. We hold none of it, so nothing is undone"

 ### THE DEFICIT ###
 POR_deficit_question: "Deficit Question"
 POR_deficit_question_desc: "Three per cent is a number in a treaty and our number is not three per cent. In November 2002 Portugal became the first country ever placed in the excessive deficit procedure, which is a distinction of a kind."
 POR_constancio_commission: "Constancio Commission"
 POR_constancio_commission_desc: "An independent committee is asked what the deficit actually was. The answer comes back at four point one per cent against the two point two we reported, and the government that commissioned it has to govern on that number."
 POR_rectifying_budget: "Rectifying Budget"
 POR_rectifying_budget_desc: "A hiring freeze across the whole public administration and value added tax up two points in the middle of a fiscal year. Nobody has ever won an election on a rectifying budget."
 POR_clean_exit: "Clean Exit"
 POR_clean_exit_desc: "We leave the programme with no precautionary credit line behind us, which is either confidence or bravado depending on who is asked. The markets decide which, and they decide quickly."
 POR_debt_brake: "Debt Brake"
 POR_debt_brake_desc: "One dull rule that outlives its finance minister: day-to-day spending balanced over the cycle, investment ring-fenced, and anything beyond that only by a recorded vote of the Assembly. A fund built on borrowing is the first thing it forbids."
 POR_extraordinary_measures: "Extraordinary Measures"
 POR_extraordinary_measures_desc: "A tax amnesty, a securitisation of arrears, and two corporate pension funds moved onto the state's books in exchange for the liabilities. Every one of them is legal, every one of them counts, and every one of them has to be done again next year."
 POR_the_stupid_pact: "Stupid Pact"
 POR_the_stupid_pact_desc: "The President of the Commission calls the Stability Pact stupid in a newspaper interview, and half of Europe privately agrees with him. If the rule cannot survive being applied to France and Germany, it is not a rule."
 POR_reverse_impoverishment: "Reversal of Impoverishment"
 POR_reverse_impoverishment_desc: "Wages, pensions and the thirty-five hour week come back, the surcharge goes, and the minimum wage starts climbing again. The deficit falls anyway, which was supposed to be impossible."
 POR_public_finance_council: "Public Finance Council"
 POR_public_finance_council_desc: "An independent body whose only job is to say in public whether the government's numbers add up. Every government that has one complains about it and none of them has abolished it."
 POR_deficit_path_1_open_tt: "We are not committed to §Yextraordinary measures§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to abandon them"
 POR_deficit_path_2_open_tt: "We are not committed to §Yconsolidation§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to abandon it"
 POR_deficit_path_1_held_tt: "Portugal is consolidating its §Ypublic accounts§!"
 POR_deficit_path_2_held_tt: "Portugal is meeting the deficit by §Yextraordinary measures§!"
 POR_abandon_deficit_path_1_tt: "§RAbandons§! §Yconsolidation§!, which we hold. These focuses are §Rundone§! and may be taken again:"
 POR_deficit_path_1_closed_tt: "§YExclusive§! with §Yconsolidation§!: §Y$POR_constancio_commission$§!, §Y$POR_rectifying_budget$§!, §Y$POR_clean_exit$§! and §Y$POR_debt_brake$§!. We hold none of it, so nothing is undone"
 POR_abandon_deficit_path_2_tt: "§RAbandons§! §Yextraordinary measures§!, which we hold. These focuses are §Rundone§! and may be taken again:"
 POR_deficit_path_2_closed_tt: "§YExclusive§! with §Yextraordinary measures§!: §Y$POR_extraordinary_measures$§!, §Y$POR_the_stupid_pact$§! and §Y$POR_reverse_impoverishment$§!. We hold none of it, so nothing is undone"

 ### THE BANKS ###
 POR_financial_system: "Financial System"
 POR_financial_system_desc: "Five banks hold most of the country's deposits and two of them are about to become the state's problem. What we decide now is whether that is a sentence or a choice."
 POR_nationalisation_of_the_bpn: "Nationalisation of the BPN"
 POR_nationalisation_of_the_bpn_desc: "A bank whose accounts turn out to have been fiction for a decade is taken into public ownership overnight to stop the queue forming at the door. The cost arrives in instalments for the next ten years."
 POR_recapitalising_the_caixa: "Recapitalising the Caixa"
 POR_recapitalising_the_caixa_desc: "The state bank needs capital and the state is its only shareholder. Brussels will allow it if we can show a private investor would have done the same, which requires a plan nobody quite believes."
 POR_public_development_bank: "Public Development Bank"
 POR_public_development_bank_desc: "A state bank that lends to firms too small for the market and too productive to lose. Everyone agrees it is needed and nobody agrees who should run it."
 POR_liquidation_of_the_bpp: "Liquidation of the BPP"
 POR_liquidation_of_the_bpp_desc: "A private bank is allowed to fail. The deposit guarantee covers the retail savers, the bondholders lose everything, and the lesson is delivered in public."
 POR_resolution_of_the_bes: "Resolution of the BES"
 POR_resolution_of_the_bes_desc: "The bank is split in a weekend: the good half becomes a new institution and the shareholders and subordinated creditors are wiped out. The resolution fund borrows the money from the state, which is not the same as the state paying, except that it is."
 POR_sale_of_the_novo_banco: "Sale of the Novo Banco"
 POR_sale_of_the_novo_banco_desc: "Three quarters of the bank goes to an American fund for an injection of capital rather than a price, and the state underwrites the losses on the old book. The resolution fund receives nothing."
 POR_banking_supervision: "Banking Supervision"
 POR_banking_supervision_desc: "The largest Portuguese banks pass under direct European supervision. Whatever else that does, it means the next crisis will be diagnosed by somebody who does not have lunch with the board."
 POR_banking_path_1_open_tt: "We are not committed to §Yletting banks fail§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to change course"
 POR_banking_path_2_open_tt: "We are not committed to §Ypublic bank rescues§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to change course"
 POR_banking_path_1_held_tt: "Portugal rescues its banks with §Ypublic money§!"
 POR_banking_path_2_held_tt: "Portugal resolves failed banks at the §Ycreditors' expense§!"
 POR_abandon_banking_path_1_tt: "§RAbandons§! §Ypublic bank rescues§!, which we hold. These focuses are §Rundone§! and may be taken again:"
 POR_banking_path_1_closed_tt: "§YExclusive§! with §Ypublic bank rescues§!: §Y$POR_nationalisation_of_the_bpn$§!, §Y$POR_recapitalising_the_caixa$§! and §Y$POR_public_development_bank$§!. We hold none of it, so nothing is undone"
 POR_abandon_banking_path_2_tt: "§RAbandons§! §Yletting banks fail§!, which we hold. These focuses are §Rundone§! and may be taken again:"
 POR_banking_path_2_closed_tt: "§YExclusive§! with §Yletting banks fail§!: §Y$POR_liquidation_of_the_bpp$§!, §Y$POR_resolution_of_the_bes$§! and §Y$POR_sale_of_the_novo_banco$§!. We hold none of it, so nothing is undone"

 ### INDUSTRIAL POLICY ###
 POR_industrial_policy: "Industrial Policy"
 POR_industrial_policy_desc: "The state owns shares in the electricity company, the telephone company, the oil company, the airline and the post office. Whether that is an instrument or an embarrassment is the whole argument."
 POR_parpublica: "Parpublica"
 POR_parpublica_desc: "One holding company for everything the state owns, so that somebody in Lisbon can finally answer the question of what the state owns. It is also, and not incidentally, an instrument."
 POR_efacec: "Efacec"
 POR_efacec_desc: "A transformer manufacturer with an Angolan shareholder whose assets have been frozen by a court, and four thousand jobs that do not care whose name is on the shares. The state takes the stake because nobody else will."
 POR_national_tap: "National Airline"
 POR_national_tap_desc: "An airline that loses money in every year it is not being sold, and that is the only operator flying to half the places our emigrants live. The case for keeping it has never been financial."
 POR_privatisation_programme: "Privatisation Programme"
 POR_privatisation_programme_desc: "The electricity company and the grid operator go to Chinese and Omani state firms, which is either the market working or a state selling to other states depending on how the sentence is finished."
 POR_post_office_and_the_airports: "Post Office and the Airports"
 POR_post_office_and_the_airports_desc: "The postal service is floated and the airport operator goes on a fifty-year concession to a French group. Both were profitable, which is what made them saleable."
 POR_end_of_parpublica: "Winding Up the Portfolio"
 POR_end_of_parpublica_desc: "The residual holdings go and the holding company that held them goes with it. Whatever the state wants to do to the economy after this, it will have to do with law rather than with shares."
 POR_competition_authority: "Competition Authority"
 POR_competition_authority_desc: "A regulator with the power to fine the banks and the supermarkets, and the nerve to do it. Whoever owns the firms, somebody has to stop them agreeing with each other."
 POR_industrial_path_1_open_tt: "We are not committed to §Yselling the state's holdings§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to reverse it"
 POR_industrial_path_2_open_tt: "We are not committed to §Ystate shareholding§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to reverse it"
 POR_industrial_path_1_held_tt: "Portugal holds its industry through the §Ystate§!"
 POR_industrial_path_2_held_tt: "Portugal has sold its §Yindustrial holdings§!"
 POR_abandon_industrial_path_1_tt: "§RAbandons§! §Ystate shareholding§!, which we hold. These focuses are §Rundone§! and may be taken again:"
 POR_industrial_path_1_closed_tt: "§YExclusive§! with §Ystate shareholding§!: §Y$POR_parpublica$§!, §Y$POR_efacec$§! and §Y$POR_national_tap$§!. We hold none of it, so nothing is undone"
 POR_abandon_industrial_path_2_tt: "§RReverses§! §Yselling the state's holdings§!, which we hold. The sale proceeds and foreign stakes are §Rgiven back§! with the assets. These focuses are §Rundone§! and may be taken again:"
 POR_industrial_path_2_closed_tt: "§YExclusive§! with §Yselling the state's holdings§!: §Y$POR_privatisation_programme$§!, §Y$POR_post_office_and_the_airports$§! and §Y$POR_end_of_parpublica$§!. We hold none of it, so nothing is undone"

 ### ENERGY ###
 POR_wind_gamble: "Wind Gamble"
 POR_wind_gamble_desc: "A single tender for twelve hundred megawatts on a guaranteed tariff. It is an enormous bet on a technology that does not yet work at this scale, and within fifteen years it will be a fifth of our electricity."
 POR_end_of_coal: "End of Coal"
 POR_end_of_coal_desc: "Sines closes nine years ahead of schedule and Pego follows it within the year. Portugal becomes the fourth country in Europe to burn no coal at all, which nobody would have predicted from here."
 POR_hydrogen_of_sines: "Hydrogen of Sines"
 POR_hydrogen_of_sines_desc: "The refinery town becomes an electrolysis town, on the argument that the cheapest renewable electricity in Europe should be exported as something other than electricity."
 POR_combined_cycle: "Combined Cycle"
 POR_combined_cycle_desc: "Gas turbines that can be turned up when the wind drops, and a terminal at Sines to land the fuel. The renewable case depends on somebody building these and then not using them."
 POR_alqueva_dam: "Alqueva Dam"
 POR_alqueva_dam_desc: "The largest artificial lake in western Europe, a village moved stone by stone to higher ground, and irrigation for a hundred and twenty thousand hectares of a province that had none."
 POR_nuclear_station: "Nuclear Station"
 POR_nuclear_station_desc: "The argument Portugal has refused to have since the site at Ferrel was abandoned to protest. The Spanish plant across the border has been running the whole time, and we buy its output."
 POR_energy_regulator: "Energy Regulator"
 POR_energy_regulator_desc: "Somebody has to decide what the tariff is, and to say out loud which of the guaranteed payments to generators were excessive. It makes no friends in either direction."
 POR_energy_path_1_open_tt: "We are not committed to §Ydispatchable generation§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to change course"
 POR_energy_path_2_open_tt: "We are not committed to §Yrenewables§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to change course"
 POR_energy_path_1_held_tt: "Portugal is building §Yrenewable§! generation"
 POR_energy_path_2_held_tt: "Portugal is building §Ydispatchable§! generation"
 POR_abandon_energy_path_1_tt: "§RAbandons§! §Yrenewables§!, which we hold. These focuses are §Rundone§! and may be taken again:"
 POR_energy_path_1_closed_tt: "§YExclusive§! with §Yrenewables§!: §Y$POR_wind_gamble$§!, §Y$POR_end_of_coal$§! and §Y$POR_hydrogen_of_sines$§!. We hold none of it, so nothing is undone"
 POR_abandon_energy_path_2_tt: "§RAbandons§! §Ydispatchable generation§!, which we hold. These focuses are §Rundone§! and may be taken again:"
 POR_energy_path_2_closed_tt: "§YExclusive§! with §Ydispatchable generation§!: §Y$POR_combined_cycle$§!, §Y$POR_alqueva_dam$§! and §Y$POR_nuclear_station$§!. We hold none of it, so nothing is undone"

 ### PUBLIC WORKS ###
 POR_high_speed_rail: "High Speed Rail"
 POR_high_speed_rail_desc: "Lisbon to Madrid in under three hours, on a line that has been drawn and redrawn for twenty years. The contract is signed before anyone establishes where the money is coming from."
 POR_new_airport: "New Airport"
 POR_new_airport_desc: "Five sites, four governments, three decades and one commission of inquiry. The argument about where to put Lisbon's second airport has outlasted most of the people who started it."
 POR_renegotiate_the_ppps: "Renegotiating the Partnerships"
 POR_renegotiate_the_ppps_desc: "The motorway concessions were written so that the state carried the traffic risk and the concessionaire carried none. Reopening them saves real money and teaches the next set of lawyers nothing."
 POR_cancel_the_tgv: "Cancelling the High Speed Line"
 POR_cancel_the_tgv_desc: "The line and the third crossing of the Tagus are cancelled outright in a single afternoon. The compensation is cheaper than the construction, which is the whole argument."
 POR_port_of_sines: "Port of Sines"
 POR_port_of_sines_desc: "The deepest water on the Atlantic coast of Europe, a container terminal that keeps outgrowing itself, and a freight corridor to the Spanish border. Whatever else we build, the ships still have to arrive somewhere."
 POR_public_works_path_1_open_tt: "We are not committed to §Ycancelling the public works§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to revive them"
 POR_public_works_path_2_open_tt: "We are not committed to §Ythe great public works§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to cancel them"
 POR_public_works_path_1_held_tt: "Portugal is building its §Ygreat public works§!"
 POR_public_works_path_2_held_tt: "Portugal has §Ycancelled§! the great public works"
 POR_abandon_public_works_path_1_tt: "§RAbandons§! §Ythe great public works§!, which we hold. These focuses are §Rundone§! and may be taken again:"
 POR_public_works_path_1_closed_tt: "§YExclusive§! with §Ythe great public works§!: §Y$POR_high_speed_rail$§! and §Y$POR_new_airport$§!. We hold none of it, so nothing is undone"
 POR_abandon_public_works_path_2_tt: "§RReverses§! §Ycancelling the public works§!, which we hold. The money saved is §Rgiven back§!. These focuses are §Rundone§! and may be taken again:"
 POR_public_works_path_2_closed_tt: "§YExclusive§! with §Ycancelling the public works§!: §Y$POR_renegotiate_the_ppps$§! and §Y$POR_cancel_the_tgv$§!. We hold none of it, so nothing is undone"

 ### LABOUR ###
 POR_labour_code_2009: "Labour Code of 2009"
 POR_labour_code_2009_desc: "Flexibility in exchange for security, negotiated with one union confederation and fought by the other. The hours bank arrives, and so does the argument about who chooses when the hours are worked."
 POR_minimum_wage: "Minimum Wage"
 POR_minimum_wage_desc: "Frozen for four years, then raised every January for a decade. Every raise was going to destroy employment and none of them did, which has not settled the argument."
 POR_labour_code_2003: "Labour Code of 2003"
 POR_labour_code_2003_desc: "The first consolidation of Portuguese labour law since before the revolution, carried against a general strike. What it consolidates is mostly the employer's side."
 POR_law_23_of_2012: "Law 23 of 2012"
 POR_law_23_of_2012_desc: "Overtime halved, severance cut by more than half, four public holidays abolished and collective dismissal made easier. Collective bargaining coverage falls from nearly two million workers to a third of a million inside two years."
 POR_social_concertation: "Social Concertation"
 POR_social_concertation_desc: "Government, employers and unions in one room signing a medium-term agreement. It works whenever both sides have already lost an argument in public and need somewhere to put the result."
 POR_labour_path_1_open_tt: "We are not committed to §Ylabour flexibility§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to reverse it"
 POR_labour_path_2_open_tt: "We are not committed to §Ylabour protection§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to reverse it"
 POR_labour_path_1_held_tt: "Portugal protects §Ythe contract§!"
 POR_labour_path_2_held_tt: "Portugal has made the labour market §Yflexible§!"
 POR_abandon_labour_path_1_tt: "§RRepeals§! §Ylabour protection§!, which we hold. These focuses are §Rundone§! and may be taken again:"
 POR_labour_path_1_closed_tt: "§YExclusive§! with §Ylabour protection§!: §Y$POR_labour_code_2009$§! and §Y$POR_minimum_wage$§!. We hold none of it, so nothing is undone"
 POR_abandon_labour_path_2_tt: "§RRepeals§! §Ylabour flexibility§!, which we hold. The regulation ladder is §Rwound back§!. These focuses are §Rundone§! and may be taken again:"
 POR_labour_path_2_closed_tt: "§YExclusive§! with §Ylabour flexibility§!: §Y$POR_labour_code_2003$§! and §Y$POR_law_23_of_2012$§!. We hold none of it, so nothing is undone"

 ### SOCIAL POLICY ###
 POR_social_policy: "Social Policy"
 POR_social_policy_desc: "Portugal spends nineteen per cent of its output on social protection against a European average near twenty-six. Every argument in this branch is about that gap and who should close it."
 POR_pact_of_cooperation: "Pact of Cooperation"
 POR_pact_of_cooperation_desc: "Most Portuguese social care is delivered by charities, mutualities and the Misericordias rather than by the state, under a framework the state signs and funds. It is cheaper than the alternative and nobody is quite willing to say so out loud."
 POR_health_system: "Health System"
 POR_health_system_desc: "A national health service built after the revolution, free at the point of use, and a parallel scheme for civil servants that most of the political class belongs to. Family health units are the reform everybody agrees on."
 POR_basic_health_law: "Basic Health Law"
 POR_basic_health_law_desc: "The 1990 settlement is repealed and hospital management can no longer be put out to concession. It passes on amendments from the parties to the government's left, which is the whole story of the arrangement."
 POR_end_of_the_partnerships: "End of the Partnerships"
 POR_end_of_the_partnerships_desc: "Braga, Vila Franca, Loures and Cascais come back into public management as their thirty-year contracts expire. Each one costs more to run the day after than the day before, and each one is kept."
 POR_basic_law_of_2002: "Basic Law of 2002"
 POR_basic_law_of_2002_desc: "Thirty-four hospitals become public companies in a single December, and the legal base for private hospital management is written. The service stays free; who runs it stops being settled."
 POR_hospital_ppps: "Hospital Partnerships"
 POR_hospital_ppps_desc: "Four new hospitals built and run on thirty-year contracts by private consortia. They are measurably efficient and there is no mechanism to find out what happens at the end."
 POR_health_path_1_open_tt: "We are not committed to §Ycontracted healthcare§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to reverse it"
 POR_health_path_2_open_tt: "We are not committed to §Ya wholly public service§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to reverse it"
 POR_health_path_1_held_tt: "Portugal runs a §Ywholly public§! health service"
 POR_health_path_2_held_tt: "Portugal §Ycontracts§! for health care"
 POR_abandon_health_path_1_tt: "§RRepeals§! §Ya wholly public service§!, which we hold. These focuses are §Rundone§! and may be taken again:"
 POR_health_path_1_closed_tt: "§YExclusive§! with §Ya wholly public service§!: §Y$POR_basic_health_law$§! and §Y$POR_end_of_the_partnerships$§!. We hold none of it, so nothing is undone"
 POR_abandon_health_path_2_tt: "§RRepeals§! §Ycontracted healthcare§!, which we hold. These focuses are §Rundone§! and may be taken again:"
 POR_health_path_2_closed_tt: "§YExclusive§! with §Ycontracted healthcare§!: §Y$POR_basic_law_of_2002$§! and §Y$POR_hospital_ppps$§!. We hold none of it, so nothing is undone"

 ### EDUCATION ###
 POR_education_system: "Education System"
 POR_education_system_desc: "The first international assessment put Portuguese fifteen-year-olds near the bottom of the developed world. Within fifteen years they are at the average, which is the largest improvement anybody recorded."
 POR_compulsory_schooling: "Compulsory Schooling to Eighteen"
 POR_compulsory_schooling_desc: "Twelve years of schooling for everyone, and a programme that certifies the skills of a million adults who left at fourth grade. It is the single largest thing any government here does to the ceiling on the economy."
 POR_education_technology_plan: "Technological Plan for Education"
 POR_education_technology_plan_desc: "Broadband and a board in every classroom, and half a million laptops built in Matosinhos and sold to schoolchildren for five euros. Whatever it did for learning, it built a computer industry from nothing."
 POR_diagnostic_tests: "Diagnostic Tests"
 POR_diagnostic_tests_desc: "The fourth and sixth grade exams are replaced by tests that tell a teacher what a class has not understood and are never published school by school. One external exam remains, at the end."
 POR_association_contracts: "Association Contracts"
 POR_association_contracts_desc: "The state pays private schools to teach where it has no school of its own. Where it does have one, paying twice is harder to defend, and that is exactly where the argument sits."
 POR_curricular_rigour: "Curricular Rigour"
 POR_curricular_rigour_desc: "National exams return at the fourth and sixth grades, the curriculum is written down as targets, and schools are merged into larger groupings. The results improve and the profession never forgives it."
 POR_education_path_1_open_tt: "We are not committed to §Ystate-funded private schooling§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to reverse it"
 POR_education_path_2_open_tt: "We are not committed to §Ycomprehensive schooling§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to reverse it"
 POR_education_path_1_held_tt: "Portugal funds §Yone school for everyone§!"
 POR_education_path_2_held_tt: "Portugal funds §Ythe pupil, not the school§!"
 POR_abandon_education_path_1_tt: "§RRepeals§! §Ycomprehensive schooling§!, which we hold. These focuses are §Rundone§! and may be taken again:"
 POR_education_path_1_closed_tt: "§YExclusive§! with §Ycomprehensive schooling§!: §Y$POR_compulsory_schooling$§!, §Y$POR_education_technology_plan$§! and §Y$POR_diagnostic_tests$§!. We hold none of it, so nothing is undone"
 POR_abandon_education_path_2_tt: "§RRepeals§! §Ystate-funded private schooling§!, which we hold. These focuses are §Rundone§! and may be taken again:"
 POR_education_path_2_closed_tt: "§YExclusive§! with §Ystate-funded private schooling§!: §Y$POR_association_contracts$§! and §Y$POR_curricular_rigour$§!. We hold none of it, so nothing is undone"

 ### HOUSING ###
 POR_housing_question: "Housing Question"
 POR_housing_question_desc: "Seven hundred thousand empty dwellings, a third of the rents in central Lisbon still frozen at nineteen-eighties levels, and the smallest public housing stock in western Europe. All three at once."
 POR_basic_housing_law: "Basic Housing Law"
 POR_basic_housing_law_desc: "Portugal's first basic law on housing puts the right to a dwelling into ordinary law rather than leaving it in the constitution where nobody can use it."
 POR_compulsory_letting: "Compulsory Letting"
 POR_compulsory_letting_desc: "A municipality may take a dwelling that has stood empty for two years and let it. It is vetoed, overridden, and repealed within two years, and for those two years it is the most argued-about paragraph in the country."
 POR_new_lease_regime: "New Urban Lease Regime"
 POR_new_lease_regime_desc: "The frozen rents end after a five-year transition and eviction becomes an administrative procedure. It unlocks the centre of every Portuguese city, and it empties a good deal of it first."
 POR_short_let_accommodation: "Short-Let Accommodation"
 POR_short_let_accommodation_desc: "A register, a licence and a hundred thousand apartments. The centres of Lisbon and Porto are rebuilt in a decade by people who do not live in them."
 POR_planning_by_rule: "Planning by Rule"
 POR_planning_by_rule_desc: "A project that complies with the municipal plan is approved without a licence, and objections succeed only on defined harm. The neighbours share the gain through a payment from the developer."
 POR_housing_path_1_open_tt: "We are not committed to §Ythe housing market§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to intervene in it"
 POR_housing_path_2_open_tt: "We are not committed to §Ytenant protection§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to reverse it"
 POR_housing_path_1_held_tt: "Portugal treats housing as a §Yright§!"
 POR_housing_path_2_held_tt: "Portugal treats housing as a §Ymarket§!"
 POR_abandon_housing_path_1_tt: "§RRepeals§! §Ytenant protection§!, which we hold. These focuses are §Rundone§! and may be taken again:"
 POR_housing_path_1_closed_tt: "§YExclusive§! with §Ytenant protection§!: §Y$POR_basic_housing_law$§! and §Y$POR_compulsory_letting$§!. We hold none of it, so nothing is undone"
 POR_abandon_housing_path_2_tt: "§RRepeals§! §Ythe housing market§!, which we hold. These focuses are §Rundone§! and may be taken again:"
 POR_housing_path_2_closed_tt: "§YExclusive§! with §Ythe housing market§!: §Y$POR_new_lease_regime$§!, §Y$POR_short_let_accommodation$§! and §Y$POR_planning_by_rule$§!. We hold none of it, so nothing is undone"

 ### SOCIAL SECURITY ###
 POR_social_security: "Social Security"
 POR_social_security_desc: "A pay-as-you-go system promising today's contributors a pension paid by people not yet born, and an index invented so that every benefit stops rising with the minimum wage."
 POR_social_insertion_income: "Social Insertion Income"
 POR_social_insertion_income_desc: "A minimum income with a contract attached, cut in every crisis and restored after every one. It is the cheapest thing the state does and the most argued about per escudo spent."
 POR_abolish_sustainability_factor: "Abolishing the Sustainability Factor"
 POR_abolish_sustainability_factor_desc: "The coefficient that quietly cuts every new pension by the rise in life expectancy since 2006 is repealed. It had reached fifteen per cent, and almost nobody retiring knew it existed."
 POR_sustainability_factor: "Sustainability Factor"
 POR_sustainability_factor_desc: "Pensions are tied to life expectancy, the whole career replaces the best ten years, and the reference index stops being the minimum wage. It is arithmetic, and arithmetic is not popular."
 POR_resources_test: "Resources Test"
 POR_resources_test_desc: "One uniform means test across every benefit, counting the whole household and its savings. Tens of thousands of families leave the rolls in the first year, which is either the point or the cost."
 POR_social_path_1_open_tt: "We are not committed to §Ypension retrenchment§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to reverse it"
 POR_social_path_2_open_tt: "We are not committed to §Ythe pay-as-you-go promise§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to reverse it"
 POR_social_path_1_held_tt: "Portugal keeps the §Ypay-as-you-go promise§!"
 POR_social_path_2_held_tt: "Portugal has tied pensions to §Ywhat can be paid§!"
 POR_abandon_social_path_1_tt: "§RRepeals§! §Ythe pay-as-you-go promise§!, which we hold. These focuses are §Rundone§! and may be taken again:"
 POR_social_path_1_closed_tt: "§YExclusive§! with §Ythe pay-as-you-go promise§!: §Y$POR_social_insertion_income$§! and §Y$POR_abolish_sustainability_factor$§!. We hold none of it, so nothing is undone"
 POR_abandon_social_path_2_tt: "§RRepeals§! §Ypension retrenchment§!, which we hold. These focuses are §Rundone§! and may be taken again:"
 POR_social_path_2_closed_tt: "§YExclusive§! with §Ypension retrenchment§!: §Y$POR_sustainability_factor$§! and §Y$POR_resources_test$§!. We hold none of it, so nothing is undone"

 ### THE CONSCIENCE VOTES ###
 POR_questions_of_conscience: "Questions of Conscience"
 POR_questions_of_conscience_desc: "The votes where the parties release their members and the country finds out what it actually thinks. Between them they decided more about how Portugal lives than any budget did."
 POR_referendum_of_2007: "Referendum of 2007"
 POR_referendum_of_2007_desc: "Fifty-nine per cent vote yes on a turnout too low to bind anybody. Parliament legislates anyway, which is either respecting the majority who voted or ignoring the majority who did not."
 POR_marriage_equality: "Marriage Equality"
 POR_marriage_equality_desc: "Civil marriage is opened without adoption, and adoption follows six years later over a presidential veto. Each step is smaller than its opponents feared and larger than its authors admitted."
 POR_concordat_of_2004: "Concordat of 2004"
 POR_concordat_of_2004_desc: "A new agreement with the Holy See replaces the one signed under the dictatorship. Religious education stays in state schools as a choice, and the Church keeps its standing in tax and property."
 POR_defence_of_life: "Defence of Life"
 POR_defence_of_life_desc: "A moderating fee and compulsory prior counselling, carried in one parliament and repealed in the next. The argument does not end; it changes venue."
 POR_conscience_path_1_open_tt: "We are not committed to §Ythe conservative settlement§!, or the £POR_western_social_democrat £POR_anarchist_communism £POR_non_aligned_socialist_democrat §Yleft bloc§! holds a majority to change it"
 POR_conscience_path_2_open_tt: "We are not committed to §Ythe liberal settlement§!, or the £POR_western_conservative £POR_non_aligned_conservative £POR_western_liberal §Ycentre-right bloc§! holds a majority to change it"
 POR_conscience_path_1_held_tt: "Portugal has legislated the §Yliberal§! settlement"
 POR_conscience_path_2_held_tt: "Portugal has legislated the §Yconservative§! settlement"
 POR_abandon_conscience_path_1_tt: "§RRepeals§! §Ythe liberal settlement§!, which we hold. These focuses are §Rundone§! and may be taken again:"
 POR_conscience_path_1_closed_tt: "§YExclusive§! with §Ythe liberal settlement§!: §Y$POR_referendum_of_2007$§! and §Y$POR_marriage_equality$§!. We hold none of it, so nothing is undone"
 POR_abandon_conscience_path_2_tt: "§RRepeals§! §Ythe conservative settlement§!, which we hold. These focuses are §Rundone§! and may be taken again:"
 POR_conscience_path_2_closed_tt: "§YExclusive§! with §Ythe conservative settlement§!: §Y$POR_concordat_of_2004$§! and §Y$POR_defence_of_life$§!. We hold none of it, so nothing is undone"
 POR_decriminalisation: "Decriminalisation"
 POR_decriminalisation_desc: "Possession stops being a crime and becomes a matter for a panel of a doctor, a lawyer and a social worker. The rest of the world spends twenty years deciding whether we were right, and drug deaths here fall by nine tenths."

 ### STATE REFORM ###
 POR_reform_of_the_state: "Reform of the State"
 POR_reform_of_the_state_desc: "Every government promises to reform the state and every one of them inherits the state its predecessor promised to reform. This one starts with the rules the state itself runs on."
 POR_a_legible_state: "A Legible State"
 POR_a_legible_state_desc: "A citizen should be able to read what the state buys, what it charges and how it decides. Most of that is already public somewhere. Very little of it is readable."
 POR_one_rule_for_everyone: "One Rule for Everyone"
 POR_one_rule_for_everyone_desc: "The same rule for every person, every firm and every product, written so that it still works when someone tries to beat it. Exceptions are where the money goes."
 POR_constitutional_revision: "Constitutional Revision"
 POR_constitutional_revision_desc: "The constitution can be revised every five years by two thirds of the Assembly, which means nothing changes unless the PS and the PSD agree. This time they agree on the Assembly itself."
 POR_smaller_assembly: "A Smaller Assembly"
 POR_smaller_assembly_desc: "The constitution allows between one hundred and eighty and two hundred and thirty deputies, and every parliament has chosen the maximum. Fewer deputies, paid against a professional benchmark, with careers outside the party."
 POR_research_bench: "A Research Bench for Every Deputy"
 POR_research_bench_desc: "Every deputy who wants one gets three to five researchers from the universities, with every adviser's interests on the register. The experts advise. The deputy the voters can remove still decides."
 POR_foreign_funding_register: "Foreign Funding Register"
 POR_foreign_funding_register_desc: "Campaigning paid for or directed by a foreign government is registered and capped, and the courts get the means to enforce it. The law names no community, only conduct."

 POR_public_contracts: "Public Contracts"
 POR_public_contracts_desc: "The state is the largest buyer in the country, and how it buys decides who builds, who profits and who gets caught. The question is whether it buys in public or buys quickly."
 POR_portal_base: "Portal BASE"
 POR_portal_base_desc: "Every public contract goes online with its price, its supplier and the official who signed it. The portal has existed since 2008. What changes is that a contract missing from it is a contract nobody may pay."
 POR_publish_or_void: "Publish or Void"
 POR_publish_or_void_desc: "Slovakia made an unpublished contract legally void and watched the number of bidders per tender more than double. Every amendment is published as it is signed, or it does not exist."
 POR_debarment_register: "Debarment Register"
 POR_debarment_register_desc: "A firm that bids knowing it cannot deliver is barred from public work for years, and the register says so by name. It is the first list in Lisbon that contractors read before the newspapers."
 POR_simplified_procedures: "Simplified Procedures"
 POR_simplified_procedures_desc: "The recovery funds must be spent by a fixed date, and the tender rules were written for a slower country. Deadlines are cut, appeals are shortened, and the money moves."
 POR_direct_award_thresholds: "Direct Award Thresholds"
 POR_direct_award_thresholds_desc: "Below a higher threshold a ministry may simply choose its supplier. The works start a year sooner, and the Court of Auditors reads about them a year later."

 POR_special_tax_regimes: "Special Tax Regimes"
 POR_special_tax_regimes_desc: "A pensioner arriving from Paris pays less tax than the nurse who treats him. Whether that is a bargain or a scandal depends on who is counting the new arrivals and who is counting the rent."
 POR_end_the_nhr_regime: "End the Non-Habitual Resident Regime"
 POR_end_the_nhr_regime_desc: "Ten years of near-zero tax for newcomers, offered since 2009 to anyone who could afford a lawyer. It is closed to new applicants, and the residents who came for it are taxed like everyone else."
 POR_minimum_effective_tax: "Minimum Effective Tax"
 POR_minimum_effective_tax_desc: "A fortune large enough to sit untaxed inside a holding company pays a floor of two per cent of its value each year. It is not a punishment. It is the income tax finally reaching the people it was always meant to."
 POR_non_habitual_residents: "Non-Habitual Residents"
 POR_non_habitual_residents_desc: "Ten years of a flat twenty per cent on Portuguese income and nothing on most foreign income. Retirees, founders and engineers arrive by the planeload, and so do their landlords' prices."
 POR_irs_jovem: "IRS Jovem"
 POR_irs_jovem_desc: "Graduates under thirty-five pay little or no income tax for their first years of work. It is cheaper than watching them leave for London, and dearer than anyone admits."

 POR_market_structure: "Market Structure"
 POR_market_structure_desc: "Three firms sell our electricity, three banks hold our savings and two chains feed us. A firm that needs its own regulator to behave is a firm the regulator has already lost to."
 POR_excessive_rents_inquiry: "Excessive Rents Inquiry"
 POR_excessive_rents_inquiry_desc: "A parliamentary inquiry into the guaranteed returns paid to the electricity incumbents since privatisation. It finds that consumers paid billions for contracts no competitive market would have signed."
 POR_unbundle_the_grid: "Unbundle the Grid"
 POR_unbundle_the_grid_desc: "The firm that generates the power may not own the wires that carry it. The grid becomes a neutral road that any generator may use at the same price."
 POR_break_up_power: "Power to Break Up"
 POR_break_up_power_desc: "Where a firm needs a permanent rulebook to behave, the Competition Authority may order it split, and must explain in public when it decides not to. A presumption, not a rule."
 POR_national_champions: "National Champions"
 POR_national_champions_desc: "A small country needs a few firms large enough to compete abroad, and large enough at home that foreign buyers cannot simply take them. The state helps them grow and does not ask too closely how."
 POR_merger_review_reform: "Merger Review Reform"
 POR_merger_review_reform_desc: "Mergers between Portuguese firms are judged against the European market, not the Portuguese one. Almost everything passes."

 POR_digital_state: "The Digital State"
 POR_digital_state_desc: "The citizen card, the mobile digital key and the automatic tax return made Portugal an example in Brussels. Behind them sit three hundred separate systems that do not talk to each other."
 POR_common_platform: "Common Platform"
 POR_common_platform_desc: "Identity, payments, notifications and data exchange are built once by the modernisation agency and offered to every ministry, municipality and hospital. Opting out requires a reason in writing."
 POR_published_tax_code: "Published Tax Code"
 POR_published_tax_code_desc: "The program that calculates every automatic tax return is published beside the law it implements, with its tests. When the code and the statute disagree, anyone can now find out."
 POR_anonymous_age_proof: "Anonymous Age Proof"
 POR_anonymous_age_proof_desc: "Where the law requires an age check online, the citizen proves one fact, that they are over eighteen, and nothing else. The state issues the proof and never learns where it was used."
 POR_ministry_contractors: "Ministry Contractors"
 POR_ministry_contractors_desc: "Each ministry hires the integrator it trusts and gets the system it asked for. Nothing is shared, everything is delivered, and the same software is bought eleven times."
 POR_single_state_login: "Single State Login"
 POR_single_state_login_desc: "One account for every public service, run by the state, which therefore sees every service its citizens use. It is convenient, secure and complete."

 POR_vice_and_the_treasury: "Vice and the Treasury"
 POR_vice_and_the_treasury_desc: "The state taxes tobacco, drink, sugar and gambling by four different logics written in four different decades. Either the tax measures the harm or it measures what the market will bear."
 POR_sugar_tax: "Sugar Tax"
 POR_sugar_tax_desc: "Sweetened drinks are taxed by their sugar content, and the manufacturers reformulate within a year rather than pay. The tax raises less every year, which is how it is supposed to work."
 POR_gambling_advertising_ban: "Gambling Advertising Ban"
 POR_gambling_advertising_ban_desc: "Betting operators lose the shirts, the stadium boards and the half-time adverts over three years, as tobacco did. The Santa Casa lottery keeps its own, and the exception is published with its cost."
 POR_one_harm_levy: "One Harm Levy"
 POR_one_harm_levy_desc: "Tobacco, alcohol, sugar and gambling are taxed by one published rule: the levy is set by the measured harm and reviewed when the evidence moves. The lobbies now argue about evidence instead of rates."
 POR_online_gambling_licences: "Online Gambling Licences"
 POR_online_gambling_licences_desc: "Online betting was illegal and everywhere. Licensed and taxed since 2015, it is legal and everywhere, and the state takes its share."
 POR_excise_relief: "Excise Relief"
 POR_excise_relief_desc: "The duties on wine and spirits are frozen and the producers are told the state is on their side. The Douro approves, and so does every bar in the country."

 POR_the_car_question: "The Car Question"
 POR_the_car_question_desc: "Lisbon has more cars per head than Madrid and worse buses than either. Every government decides whether the street belongs to the driver or to everyone else on it."
 POR_weight_based_car_tax: "Weight-Based Car Tax"
 POR_weight_based_car_tax_desc: "The annual circulation tax gains a supplement on every kilogram above a family car, on a path published years in advance. Electric cars get an allowance for the battery, and nobody gets an exemption."
 POR_car_free_baixa: "Car-Free Baixa"
 POR_car_free_baixa_desc: "The lower town is closed to through traffic. Buses, taxis, deliveries in the morning and every disabled resident's car are let in, and the access was designed with them before the first bollard went up."
 POR_end_the_scut_tolls: "End the SCUT Tolls"
 POR_end_the_scut_tolls_desc: "The motorways built as toll-free roads for the interior got tolls in 2011. They lose them again, and the towns along them stop paying to reach the coast."
 POR_car_tax_cut: "Car Tax Cut"
 POR_car_tax_cut_desc: "The registration and circulation taxes are cut for every car, new or old. Family budgets improve, the fleet stays old, and the air stays as it was."

 POR_criminal_procedure: "Criminal Procedure"
 POR_criminal_procedure_desc: "The great corruption trials take a decade and end in prescription as often as in verdicts. One answer is a faster trial. The other is no trial at all."
 POR_no_sentencing_deals: "No Sentencing Deals"
 POR_no_sentencing_deals_desc: "The Supreme Court ruled in 2013 that a sentence cannot be agreed in advance between prosecutor and defendant. The ruling is written into the code, and the prosecutors stop trying."
 POR_corroborated_confessions: "Corroborated Confessions"
 POR_corroborated_confessions_desc: "A confession convicts nobody until the judge has found evidence that it is true. No one is convicted on their word alone, and no one is paid in years off to give it."
 POR_sentencing_agreements: "Sentencing Agreements"
 POR_sentencing_agreements_desc: "A defendant who admits the facts may agree the sentence with the prosecution, subject to a judge. Trials that would have lasted ten years end in ten months."
 POR_rewarded_collaboration: "Rewarded Collaboration"
 POR_rewarded_collaboration_desc: "The accused who names his paymasters is rewarded with a lighter sentence. Brazil's prosecutors brought down a president this way, and their methods came under scrutiny of their own."

 POR_public_pay: "Public Pay"
 POR_public_pay_desc: "The state employs seven hundred thousand people and froze their careers for most of a decade. Teachers counted every day of it. What the state pays for, the years or the work, is now the question."
 POR_count_the_frozen_years: "Count the Frozen Years"
 POR_count_the_frozen_years_desc: "Nine years, four months and two days of frozen service are counted in full, in instalments. The teachers stop striking, and the finance minister stops sleeping."
 POR_automatic_progression: "Automatic Progression"
 POR_automatic_progression_desc: "Every public servant moves up the scale on a fixed timetable. The career becomes predictable again, and so does its cost."
 POR_performance_pay_scale: "Performance Pay Scale"
 POR_performance_pay_scale_desc: "Pay follows the role and the evidence of how well it is done, so an engineer who becomes a teacher at forty starts at the rate for the job. Nobody's pay falls. The top rises."
 POR_pay_tracks_average_earnings: "Pay Tracks Average Earnings"
 POR_pay_tracks_average_earnings_desc: "Public pay rises each year by the growth in average earnings, set by a published rule rather than a negotiation. The unions lose the annual fight, and so does the treasury."
 POR_minimum_services: "Minimum Services"
 POR_minimum_services_desc: "Strikes in schools and hospitals must leave a defined minimum of service running, set in advance by an independent arbitrator. The right to strike survives. The surprise does not."
