l_polish:
 SOV_proclaim_soviet_hegemony: "Ogłoś hegemonię Związku Radzieckiego"
 EST_new_economic_policy_desc: "Od czasu odzyskania niepodległości udało nam się wykreować wizerunek pomostu między Wschodem a Zachodem oraz realizować reformy gospodarcze i dążyć do integracji z Zachodem. Niemniej jednak musimy opracować nową politykę – bardziej spójną z działaniami naszych zagranicznych partnerów, a zarazem bardziej dochodową i systematyczną."
 SOV_proclaim_soviet_hegemony_desc: "Dzięki odbudowie gospodarki i mobilizacji mas Rosja jest gotowa odzyskać wiodącą rolę. Będziemy otwarcie manifestować prymat Związku Radzieckiego, przesuwając punkt ciężkości na Wschód i zmuszając państwa europejskie, by liczyły się z naszym powrotem."
 SOV_the_third_rome_desc: "Idea „Moskwy – Trzeciego Rzymu” zakłada, że ​​Moskwa jest spadkobierczynią starożytnego Rzymu i Bizancjum, kontynuującą dziedzictwo Cesarstwa Rzymskiego. Kwestia tego, które miasto ma prawo do tego dziedzictwa, była przedmiotem debat na przestrzeni dziejów Europy."
 polish_focus: "Drzewo celów Polski"
 SOV_socialist_humanism_desc: "Socjalizm to nie tylko kwestia fabryk i planowych norm produkcji, lecz także godności robotnika. W centrum rewolucji postawimy dobro człowieka, dowodząc, że droga komunizmu służy ludziom, a nie odwrotnie."
 SOV_socialist_humanism: "Socjalistyczny humanizm"
 SOV_the_third_rome: "Trzeci Rzym"
 king: "Tło: motyw królewski"