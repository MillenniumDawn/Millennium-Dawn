 UKR_fund_narp_aircraft_manufacturer_desc: "\n\n\n\n\n\n£UKR_desctext_strategic_aviation_narp\n\n\n\n\n\n\n\n\nВыделить средства §LНиколаевскому авиаремонтному заводу§!, чтобы создать мощности, оборудование и опыт, необходимые для восстановления парка дальней авиации Украины."
