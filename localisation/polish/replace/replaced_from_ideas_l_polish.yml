l_polish:
 nationalism_desc: "Rządy o nastawieniu nacjonalistycznym uważają, że na globalizacji wyszły najgorzej, i dążą do narodowego odrodzenia opartego na protekcjonizmie, militaryzacji oraz suwerenności narodowej i etnicznej. Choć żywią niechęć do globalnych instytucji liberalnych, potrafią zachować pragmatyzm w sojuszach międzynarodowych, by realizować własne cele wewnętrzne lub ekspansjonistyczne."
 aircraft_manufacturer: "Kompania obrony przeciwlotniczej"
 materiel_manufacturer: "Kompanie obrony przeciwpancernej piechoty"