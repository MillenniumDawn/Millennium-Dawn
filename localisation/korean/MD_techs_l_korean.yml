 module_helipads_1: "헬리패드 I"
 module_helipads_1_desc: "Basic helipad facilities allow warships to operate light helicopters for reconnaissance, transport, and limited anti-submarine warfare, expanding a vessel's operational flexibility.\n\n§GDesigner Hint: Helipads improve Sub Detection, Anti-Submarine Warfare, Surface Detection, and Minesweeping while adding Health Power. They suit ASW escorts and patrol ships, but increase production cost, fuel use, manpower, and Surface Visibility.§!"
 module_helipads_2: "헬리패드 II"
 module_helipads_2_desc: "Improved helipad designs include enhanced handling equipment, maintenance support, and better integration with ship systems, enabling sustained helicopter operations in a wider range of missions.\n\n§GDesigner Hint: Helipads improve Sub Detection, Anti-Submarine Warfare, Surface Detection, and Minesweeping while adding Health Power. They suit ASW escorts and patrol ships, but increase production cost, fuel use, manpower, and Surface Visibility.§!"
 module_helipads_3: "헬리패드 III"
 module_helipads_3_desc: "Advanced aviation facilities provide optimized flight decks, support systems, and command integration, allowing efficient operation of multiple modern helicopters for surveillance, anti-submarine warfare, and force projection.\n\n§GDesigner Hint: Helipads improve Sub Detection, Anti-Submarine Warfare, Surface Detection, and Minesweeping while adding Health Power. They suit ASW escorts and patrol ships, but increase production cost, fuel use, manpower, and Surface Visibility.§!"
 module_flight_deck_1: "경항공모함 갑판 (10)"
 module_flight_deck_1_desc: "This module dictates the size of the ship. Bigger carriers will be able to support more planes and will have bigger structural integrity, but will be easier to spot and hit. They require more fuel, and manpower and will cost more.\n\n§GDesigner Hint: A Flight Deck adds Deck Size, carrier detection, and Health Power, defining the vessel as a carrier. Use it for naval air power, but expect major production, manpower, fuel, and Surface Visibility costs that grow with deck size.§!"
 module_flight_deck_2: "Light Aircraft Carrier Deck II (20)"
 module_flight_deck_2_desc: "$module_flight_deck_1_desc$"
 module_flight_deck_3: "Medium Aircraft Carrier Deck (30)"
 module_flight_deck_4: "Medium Aircraft Carrier Deck II (40)"
 module_light_flight_deck_1: "상륙 수송 선거"
 module_light_flight_deck_1_desc: "Amphibious Transport Docks provide basic aviation and well-deck facilities for transporting troops, vehicles, and landing craft. These ships enable limited power projection and support amphibious operations close to hostile shores.\n\n§GDesigner Hint: Light Flight Decks trade Cannon Attack for Deck Size as tiers advance. Use the Transport Dock for direct firepower or later assault decks for embarked aviation.§!"
 module_fuel_tank: "연료 탱크"
 module_fuel_tank_desc: "Expanded fuel tanks to allow larger ship run times before having to eventually return from deployment.\n\n§GDesigner Hint: Fuel Tanks greatly increase Max Range, making them useful for distant patrols and deployments. They add a small amount of production cost, fuel use, manpower, and Surface Visibility.§!"
 module_esm_1: "전자전지원 (ESM) I"
 module_esm_1_desc: "Early Electronic Support Measures systems allow ships to detect, identify, and classify enemy radar emissions. These systems improve situational awareness and provide limited early warning against hostile threats.\n\n§GDesigner Hint: ESM increases Health Power and reduces Surface Visibility, improving survivability against detection and attack. It is useful on valuable combatants, but raises production cost and requires Microchips.§!"
 module_esm_2: "전자전지원 (ESM) II"
 module_esm_2_desc: "Improved ESM suites feature expanded frequency coverage and faster signal processing, enhancing the ability to track enemy sensors and support defensive countermeasures in complex electromagnetic environments.\n\n§GDesigner Hint: ESM increases Health Power and reduces Surface Visibility, improving survivability against detection and attack. It is useful on valuable combatants, but raises production cost and requires Microchips.§!"
 module_esm_3: "전자전지원 (ESM) III"
 module_esm_3_desc: "Advanced Electronic Support Measures integrate high-speed data processing and networked sensor fusion, allowing precise threat identification, improved early warning, and enhanced coordination with electronic warfare and combat systems.\n\n§GDesigner Hint: ESM increases Health Power and reduces Surface Visibility, improving survivability against detection and attack. It is useful on valuable combatants, but raises production cost and requires Microchips.§!"
 module_analog_fire_control: "아날로그 사격 통제 장치"
 module_analog_fire_control_desc: "Analog fire control systems are best described as manually operated systems.\n\n§GDesigner Hint: Fire Control improves Cannon Attack, Anti-Ship Missiles, AShM Piercing, Anti-Air, and Armor, making an armed ship more effective across several roles. Advanced systems provide stronger bonuses but cost more IC and Microchips.§!"
 module_digital_integrated_fire_control: "디지털 통합 사격 통제 장치"
 module_digital_integrated_fire_control_desc: "Digital interfaces integrated into the systems to allow for more effective leadership and maintenance from the ship's bridge.\n\n§GDesigner Hint: Fire Control improves Cannon Attack, Anti-Ship Missiles, AShM Piercing, Anti-Air, and Armor, making an armed ship more effective across several roles. Advanced systems provide stronger bonuses but cost more IC and Microchips.§!"
 module_advanced_integrated_missile_radar_control: "향상된 통합 미사일 레이더 통제 시스템"
 module_advanced_integrated_missile_radar_control_desc: "Advanced integrated missile radar control is best described by the integration of missile and radar to allow for quicker and more precise reactions to incoming threats.\n\n§GDesigner Hint: Fire Control improves Cannon Attack, Anti-Ship Missiles, AShM Piercing, Anti-Air, and Armor, making an armed ship more effective across several roles. Advanced systems provide stronger bonuses but cost more IC and Microchips.§!"
