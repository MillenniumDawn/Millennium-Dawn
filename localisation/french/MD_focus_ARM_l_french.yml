 karabakh.1.t: "[ARM.GetNameWithFlag] Attacked Our Positions!"
 karabakh.1.d: "Les troupes du Haut-Karabagh et arméniennes ont commencé à bombarder nos positions à la frontière avec la République non reconnue du Haut-Karabagh. Nos troupes tentent de repousser l’attaque ennemie."
 karabakh.1.a: "Zut !"
 karabakh.2.t: "[ARM.GetNameWithFlag] Wins the Firefight!"
 karabakh.2.d: "Lors d’un récent échange de tirs entre les unités arméniennes et azerbaïdjanaises, les Arméniens sont sortis victorieux, infligeant de lourdes pertes à la partie azerbaïdjanaise."
 karabakh.2.a: "Le conflit persiste"
 karabakh.3.t: "[ARM.GetNameWithFlag] Loses the Firefight!"
 karabakh.3.d: "Lors d’un récent échange de tirs entre les unités arméniennes et azerbaïdjanaises, les Azerbaïdjanais sont sortis victorieux, infligeant de lourdes pertes à la partie arménienne."
 karabakh.3.a: "Le conflit persiste"
 karabakh.4.t: "L’échange de tirs se termine par une impasse !"
 karabakh.4.d: "Suite à la récente attaque des forces arméniennes sur les positions azerbaïdjanaises, l’échange de tirs s’est terminé par un match nul et il n’y a eu aucun changement de positions."
 karabakh.4.a: "Le conflit persiste"
 karabakh.5.t: "[AZE.GetNameWithFlag] Attacked Our Positions!"
 karabakh.5.d: "The Azerbaijani troops began shelling our positions opposite the border with Azerbaijan. Our troops are trying to repel the enemy's attack."
 karabakh.5.a: "Zut !"
 karabakh.6.t: "[AZE.GetNameWithFlag] Wins the Firefight!"
 karabakh.6.d: "Lors d’un récent échange de tirs entre les unités arméniennes et azerbaïdjanaises, les Azerbaïdjanais sont sortis victorieux, infligeant de lourdes pertes à la partie arménienne."
 karabakh.6.a: "Le conflit persiste"
 karabakh.7.t: "[AZE.GetNameWithFlag] Loses the Firefight!"
 karabakh.7.d: "Lors d’un récent échange de tirs entre les unités arméniennes et azerbaïdjanaises, les Arméniens sont sortis victorieux, infligeant de lourdes pertes à la partie azerbaïdjanaise."
 karabakh.7.a: "Le conflit persiste"
 karabakh.8.t: "Opération de reconnaissance par drone réussie !"
 karabakh.8.d: "Récemment, nos drones de reconnaissance ont mené une opération réussie et ont collecté une quantité significative de renseignements sur l’ennemi."
 karabakh.8.a: "Super !"
 karabakh.9.t: "Drone abattu"
 karabakh.9.d: "Nos efforts de reconnaissance aérienne ont été repérés par l’ennemi, notre drone a été abattu par un tir chanceux de MANPAD, et un équipement précieux est maintenant perdu."
 karabakh.9.a: "Qu’ils aillent se faire voir !"
 karabakh.101.t: "Drone ennemi abattu"
 karabakh.101.d: "Recently, enemy UAV recon drone was shot down by a lucky MANPAD shot. The recon mission of our enemies has failed and they lost a valuable piece of equipment."
 karabakh.101.a: "Super !"
 karabakh.10.t: "Notre position finale sur les négociations des années 90"
 karabakh.10.d: "Dans les années 90, l’Azerbaïdjan, reconnaissant notre victoire, a accepté de reconnaître l’Artsakh si nous acceptions de céder la région de Hadrut en échange de cette reconnaissance. Céder des terres en échange de la reconnaissance peut être une bonne affaire, mais nos forces internes pourraient être très mécontentes. Cet accord pourrait également anéantir nos ambitions politiques..."
 karabakh.10.a: "We must agree. It is a more future-oriented solution."
 karabakh.10.b: "Nous ne pouvons pas permettre la cession de territoires."
 karabakh.11.t: "[ARM.GetNameWithFlag] Agrees to Our 90's Conditions!"
 karabakh.11.d: "Dans sa récente déclaration, la partie arménienne a accepté nos anciennes conditions, selon lesquelles la région de Hadrut nous est transférée en échange de notre reconnaissance de la République du Haut-Karabagh. Le conflit sera complètement résolu et nous signerons un pacte de non-agression avec l’Arménie. Il convient de noter qu’à l’heure actuelle, l’Arménie nous surpasse largement en puissance militaire."
 karabakh.11.a: "Merveilleux, nous acceptons ces conditions !"
 karabakh.11.b: "Nous avons aussi besoin d’un corridor à travers Meghri..."
 karabakh_news.2.t: "Résolution du conflit du Haut-Karabagh !"
 karabakh_news.2.d: "Après de nombreuses années de différend non résolu, les parties arménienne et azerbaïdjanaise ont réussi à conclure un accord indépendant sur le conflit du Haut-Karabagh et à signer une résolution correspondante qui garantit les intérêts des deux parties. Ce que ce changement entraînera dans le Caucase du Sud reste un mystère."
 karabakh_news.2.o1: "Paix dans le Caucase ?"
 karabakh.12.t: "[ARM.GetNameWithFlag] Demands Full Nagorno-Karabakh Recognition!"
 karabakh.12.d: "Dans sa récente déclaration, la partie arménienne a rejeté nos anciennes conditions, selon lesquelles la région de Hadrut nous est transférée en échange de notre reconnaissance de la République du Haut-Karabagh. Ils exigent une reconnaissance complète de la République du Haut-Karabagh sans changement territorial. Il convient de noter qu’à l’heure actuelle, l’Arménie nous surpasse largement en puissance militaire. Pour l’instant."
 karabakh.12.a: "Nous gagnerons à long terme. Augmentons les enjeux lors des prochaines négociations."
 karabakh.12.b: "Peut-être... accepter leur proposition ?"
 karabakh.13.t: "[AZE.GetNameWithFlag] Denies Our Offer!"
 karabakh.13.d: "L’Azerbaïdjan a rejeté nos conditions de négociation et a reporté la discussion sur les nouvelles conditions à la prochaine réunion."
 karabakh.13.a: "Préparons-nous alors."
 karabakh.14.t: "Notre nouvelle position"
 karabakh.14.d: "Après le premier cycle de négociations infructueux, nous sommes enfin prêts à reconsidérer notre position dans le processus de négociation. Devrions-nous exiger un passage à travers Zangezur, ou devrions-nous abandonner notre position de négociation ?"
 karabakh.14.a: "Présentons-leur nos nouvelles exigences."
 karabakh.14.b: "Reconnaissons le Haut-Karabagh."
 karabakh.15.t: "[AZE.GetNameWithFlag] Presents New Demands!"
 karabakh.15.d: "Récemment, le gouvernement de l’Azerbaïdjan nous a présenté un nouvel ensemble d’exigences pour la reconnaissance de l’Artsakh. Ils veulent toujours que nous cédions Hadrut, mais maintenant ils veulent aussi un corridor à travers Syunik pour le relier à Nakhitchevan. Devrions-nous accepter ces nouvelles conditions ?"
 karabakh.15.a: "Ces conditions sont inacceptables !"
 karabakh.15.b: "Cela semble assez raisonnable."
 karabakh.16.t: "[ARM.GetNameWithFlag] Denies Our Offer!"
 karabakh.16.d: "L’Arménie a rejeté nos conditions de négociation et a reporté la discussion sur les nouvelles conditions à la prochaine réunion."
 karabakh.16.a: "Préparons-nous alors."
 karabakh.17.t: "Nouvelle position de négociation"
 karabakh.17.d: "Après le cycle précédent de négociations, qui s’est terminé sans succès, nous devrions reconsidérer nos exigences envers l’Arménie. Compte tenu de notre renforcement sur la scène mondiale, nous devrions également exiger la région de Karvachar en échange de la reconnaissance du Haut-Karabagh comme faisant partie de l’Arménie. Cela nous semble être la position la plus avantageuse."
 karabakh.17.a: "Présentons les nouvelles conditions à l’Arménie."
 karabakh.17.b: "Abandonnons complètement le Karabagh..."
 karabakh.18.t: "[AZE.GetNameWithFlag]'s New Terms!"
 karabakh.18.d: "Récemment, l’Azerbaïdjan nous a présenté de nouvelles exigences pour la reconnaissance de l’Artsakh comme notre territoire. Maintenant, ils exigent Karvachar et Hadrut en échange de la reconnaissance de Stepanakert comme territoire de l’Arménie. Compte tenu du renforcement de l’Azerbaïdjan, cela peut poser un gros problème pour nous."
 karabakh.18.a: "Ces conditions sont inacceptables !"
 karabakh.18.b: "Nous devons nous rendre..."
 karabakh.24.t: "[ARM.GetNameWithFlag] Recognized and Annexed Nagorno-Karabakh!"
 karabakh.24.d: "L’Arménie, dans un acte d’agression inattendu, a déclaré l’annexion complète du Haut-Karabagh et sa reconnaissance. Nous percevons cela comme un acte d’agression totale et inconditionnelle !"
 karabakh.24.a: "En avant, attaquez !"
 karabakh_news.3.t: "Deuxième guerre du Haut-Karabagh"
 karabakh_news.3.d: "En raison des récents événements, l’Azerbaïdjan a lancé une offensive à grande échelle sur le territoire de la République non reconnue du Haut-Karabagh. Malgré l’invasion directe de l’Azerbaïdjan, le territoire du Haut-Karabagh était occupé par des forces arméniennes, ce qui donne à l’Azerbaïdjan l’impression que l’agression vient de la partie arménienne."
 karabakh_news.3.o1: "Ce sont des temps sombres."
 karabakh.25.t: "Opportunité au Haut-Karabagh !"
 karabakh.25.d: "La guerre au Haut-Karabagh dure depuis assez longtemps pour ébranler l’équilibre des forces dans la région. Peut-être devrions-nous en profiter pour introduire nos forces de maintien de la paix en Artsakh, obligeant l’Arménie à céder certains territoires. Cela augmenterait notre influence sur l’Arménie et l’Azerbaïdjan. Devrions-nous le faire ?"
 karabakh.25.a: "Bien sûr !"
 karabakh.25.b: "Ce n’est pas notre affaire."
 karabakh.26.t: "[SOV.GetNameWithFlag] Demands Karabakh Resolution!"
 karabakh.26.d: "La Russie estime que la guerre est allée trop loin et que nous devons négocier un cessez-le-feu entre les deux parties. Devrions-nous accepter ?"
 karabakh.26.a: "D’accord..."
 karabakh.26.b: "Non !"
 karabakh.27.t: "[FROM.GetNameWithFlag] Denies Ceasefire Proposal!"
 karabakh.27.d: "[FROM.GetNameWithFlag] denies our ceasefire proposal. We have put sanctions on them, however, our influence on them decreased."
 karabakh.27.a: "Salopards !"
 karabakh.28.t: "[SOV.GetNameWithFlag] Demands Karabakh Resolution!"
 karabakh.28.d: "La Russie estime que la guerre est allée trop loin et que nous devons négocier un cessez-le-feu entre les deux parties. L’Azerbaïdjan a déjà accepté. Devrions-nous accepter ?"
 karabakh.28.a: "D’accord..."
 karabakh.28.b: "Nous combattrons jusqu’au bout !"
 karabakh_news.4.t: "Cessez-le-feu au Haut-Karabagh !"
 karabakh_news.4.d: "Grâce aux efforts diplomatiques de la Russie, le récent conflit au Haut-Karabagh a été stoppé par la signature d’un cessez-le-feu par les parties arménienne et azerbaïdjanaise. La paix tiendra-t-elle dans le Caucase du Sud ou ces changements seront-ils éphémères ?"
 karabakh_news.4.o1: "La paix enfin."
 karabakh.29.t: "Deuxième offensive sur le Haut-Karabagh !"
 karabakh.29.d: "Le moment est venu d’attaquer à nouveau le Haut-Karabagh et de prendre tout ce qui reste."
 karabakh.29.a: "En avant !"
 arm_reaction.1.t: "La Géorgie a annexé l’Abkhazie"
 arm_reaction.1.d: "Le gouvernement géorgien, en nous contournant, a réussi à soumettre l’Abkhazie et à annoncer le début de son intégration dans son État. Nous sommes extrêmement indignés d’avoir été simplement ignorés et mis devant le fait accompli. Il est temps de décider comment nous réagirons à cet acte de violation de nos intérêts géopolitiques."
 arm_reaction.1.a: "Nous créerons une diversion."
 arm_reaction.1.b: "Organisons un soulèvement en Abkhazie."
 arm_reaction.1.c: "Exprimons notre indignation."
 arm_reaction.1.f: "Déclarer la guerre à la Géorgie."
 arm_reaction.2.t: "La Russie a organisé un sabotage !"
 arm_reaction.2.d: "En réponse à l’annexion de l’Abkhazie à notre État, la Russie a décidé de mener une action de représailles, sabotant notre structure politique et essayant de secouer l’opinion publique sur divers sujets sensibles."
 arm_reaction.2.a: "Pathétique."
 arm_reaction.3.t: "La révolte en Abkhazie"
 arm_reaction.3.d: "Russia could not accept our reunification with Abkhazia and was able to gather forces loyal to its military and carry out a coup. Among other things, Russia announces the beginning of a war with us, it seems they intend to destroy us for our desire to see Georgia united."
 arm_reaction.3.a: "Fous !"
 arm_reaction.4.t: "Le coup d’État pro-russe"
 arm_reaction.4.d: "The Russian special services were able to carry out a coup in our republic and seized power. Now we are not only under Russian control, but also involved in a war with Georgia, which Russia has declared war on."
 arm_reaction.4.a: "Entre deux feux."
 arm_reaction.5.t: "La Russie exprime son mécontentement"
 arm_reaction.5.d: "La Russie exprime un fort mécontentement face au fait que la question abkhaze a été résolue sans leur participation. Nos relations avec la Russie pourraient être ruinées à jamais, mais maintenant nous avons l’Abkhazie, et c’est beaucoup plus important pour nous."
 arm_reaction.5.a: "Qu’ils pleurent."
 arm_reaction.7.t: "La Russie a organisé un sabotage !"
 arm_reaction.7.d: "La Russie ne peut accepter que nous ayons cessé d’être une marionnette et a organisé un sabotage politique par les forces du FSB, essayant de déstabiliser la situation, mais nous tiendrons bon quoi qu’il arrive !"
 arm_reaction.7.a: "Pathétique."
 arm_reaction.8.t: "Révolte pro-russe"
 arm_reaction.8.d: "Our withdrawal from Russia's sphere of influence greatly offended their government, but we underestimated the extent of their influence on our country. They were able to organize a mutiny of forces loyal to them directed against us."
 arm_reaction.8.a: "Pathétique."
 arm_reaction.9.t: "La Russie exprime son mécontentement"
 arm_reaction.9.d: "La Russie a exprimé une indignation et un mécontentement sérieux face au fait que nous ayons si facilement et rapidement renversé leur gouvernement fantoche."
 arm_reaction.9.a: "Qu’ils pleurent."
 arm_reaction.10.t: "Guerre avec la Russie !"
 arm_reaction.10.d: "We guessed that Russia would not accept the loss of control over us, but they are ready to arrange a bloodbath, just not to let us go!"
 arm_reaction.10.a: "Fous !"
 arm_reaction.11.t: "Envoyer la SMP Wagner en Azerbaïdjan"
 arm_reaction.11.d: "La répression de l’Arménie se poursuit, et nous sommes prêts à élargir la zone de combat. La SMP Wagner est prête à se rendre en Azerbaïdjan et à déclencher une rébellion contre le gouvernement arménien là-bas."
 arm_reaction.11.a: "Nous y allons."
 arm_reaction.11.b: "Non."
 arm_reaction.12.t: "Mutinerie de la SMP Wagner en Azerbaïdjan"
 arm_reaction.12.d: "La Russie continue de saper l’unité de notre État. Les SMP Wagner ont été envoyées en Azerbaïdjan pour déclencher une révolte contre nous. Les rebelles sont peu nombreux, mais les bataillons de la SMP sont tout à fait capables de nous repousser."
 arm_reaction.12.a: "Ça empire."
 arm_reaction.13.t: "L’Azerbaïdjan demande une reconnaissance"
 arm_reaction.13.d: "The rebellion in Azerbaijan was successful, but now their government is asking for official recognition from us, as well as the establishment of our protectorate, perhaps they want to protect themselves from possible defeat in the war with Armenia, but then we will have to get involved in this war."
 arm_reaction.13.a: "À la guerre !"
 arm_reaction.13.b: "Notre aide leur suffit."
 arm_reaction.14.t: "L’Arménie soutient les séparatistes dans le Caucase"
 arm_reaction.14.d: "Nos services spéciaux ont établi que les services spéciaux arméniens soutiennent des groupes séparatistes dans le Caucase, soutenant ainsi pleinement la déstabilisation de la situation dans cette région avec l’aide des services arméniens. Il est temps de réagir."
 arm_reaction.14.a: "Nous créerons une diversion."
 arm_reaction.14.b: "Nous soutiendrons le séparatisme dans leurs régions."
 arm_reaction.14.c: "Exprimons notre indignation."
 arm_reaction.14.f: "Déclarer la guerre à l’Arménie."
 arm_reaction.15.t: "La Russie a organisé un sabotage !"
 arm_reaction.15.d: "Les services spéciaux russes ont apparemment réussi à établir notre implication dans le soutien aux séparatistes dans le Caucase et ont décidé de réagir immédiatement en sabotant notre système politique."
 arm_reaction.15.a: "Pathétique."
 arm_reaction.16.t: "La Russie soutient les séparatistes"
 arm_reaction.16.d: "Russian special services actively support separatist elements among our puppet states, thereby weakening our influence in the region."
 arm_reaction.16.a: "Pathétique."
 arm_reaction.17.t: "La Russie exprime son mécontentement"
 arm_reaction.17.d: "La Russie exprime un mécontentement actif face à notre soutien au séparatisme sur son territoire."
 arm_reaction.17.a: "Qu’ils pleurent."
 arm_reaction.18.t: "Guerre avec la Russie !"
 arm_reaction.18.d: "La Russie a décidé de répondre radicalement à notre soutien aux séparatistes dans leur région et nous a déclaré la guerre, de manière inattendue."
 arm_reaction.18.a: "Fous !"
 ARM_retire_tt: "§WEffet :§!\n§H[ROOT.GetLeader]§! §Wse retirera en tant que dirigeant de [ROOT.GetName]§!\n§H[show_ruling_party]§! §Wchoisira un nouveau dirigeant dans ses rangs.§!"
 ARM_political_assassinations: "Assassinats politiques"
 ARM_political_assassinations_desc: "Nous continuons à liquider nos opposants si nécessaire pour asseoir notre pouvoir politique."
 ARM_political_assassinations_category: "Assassinats politiques"
 ARM_political_assassinations_category_desc: "Après le coup d'État de 1999, le pouvoir de £ARM_Conservative §YKotcharian§! est dans une situation précaire. L'§Yopposition§! se préparera à renverser le président à plusieurs reprises. Il est nécessaire de nettoyer le champ politique pour s'assurer de la préservation du pouvoir. Les ennemis au sein de l'environnement politique et l'opposition extérieure doivent être éliminés."
 ARM_promotion_of_interest_armenia_in_greece: "Promouvoir les intérêts §Yarméniens§! dans §Y[GRE.GetNameWithFlag]§!"
 arm_expansion.15.t: "Le soulèvement en Arménie occidentale"
 arm_expansion.15.d: "Nous avons une chance de déclencher une révolte armée en Arménie occidentale, actuellement sous contrôle turc, mais nous devons comprendre que cela nous entraînera dans une guerre avec la Turquie, sans retour en arrière possible."
 arm_expansion.15.a: "Liberté pour l’Arménie occidentale !"
 arm_expansion.15.b: "Nous ne prendrons aucun risque."
 arm_expansion.16.t: "Le soulèvement en Arménie occidentale"
 arm_expansion.16.d: "De manière inattendue pour nous, dans ce qu’on appelle l’Arménie occidentale, une révolte a éclaté contre notre gouvernement ! Les autorités arméniennes ont directement déclaré être à l’origine de cette rébellion, et des informations ont déjà émergé sur l’apparition de leurs militants aux côtés des rebelles, c’est scandaleux !"
 arm_expansion.16.a: "Ils le paieront."
 arm_expansion.17.t: "Le soulèvement en Arménie occidentale"
 arm_expansion.17.d: "L’heure est venue pour la dernière guerre pour la libération des terres ancestrales arméniennes, maintenant ou jamais, gloire à l’Arménie !"
 arm_expansion.17.a: "Gloire à l’Arménie !"
 ARM_west_armenia: "République arménienne occidentale"
 ARM_chechnya_revoult_sub: "Coup d'État §Ypro-arménien§! de [ARM.GetFlag] dans §Y[CHE.GetNameWithFlag]§!"
 ARM_chechnya_weapons: "Fournir des armes aux §Yrebelles tchétchènes§! [CHE.GetFlag]"
 ARM_foreseeing_the_prophecy: "Prévoir la prophétie"
 ARM_foreseeing_the_prophecy_desc: "La légende des origines du peuple arménien raconte que les Arméniens ont conquis leur droit à l'existence en affrontant les tribus sémitiques du Sud sous l'égide de Hayk le Progéniteur. Les temps nouveaux portent sur leurs épaules l'héritage du passé et, selon la légende, le salut des Arméniens, à l'instar de celui de Hayk le Progéniteur, doit advenir au cours du nouveau millénaire."
 ARM_economy_shoghakn: "Shoghakn"
 ARM_economy_shoghakn_desc: "L'usine Shoghakn (anciennement usine Kristall) est la plus grande entreprise de traitement de diamants en Arménie. La première série de diamants traités en Arménie a été produite en mars 1971 à l'usine Kristall Nor Achna. Dans les années suivantes, Kristall a été renommée Stankostroitelny, puis Shoghakn en 1992. Pour la première fois en Arménie, des diamants en formes de 'Marquis', 'Ovale', 'Poire', ainsi que 'Émeraude', 'Baguette' et divers triangles ont été traités."
 ARM_socdem_principles_desc: "Nous devons adhérer aux principes sociaux de soutien à la société pour rendre notre société plus égale."
 ARM_raising_taxes_idea: "Réductions fiscales temporaires"
 ARM_utilize_military_knowledge: "Utilisation des connaissances militaires"
 ARM_utilize_military_knowledge_desc: "L'expérience militaire de Serzh Sargsyan doit être mise à profit pour nos forces armées, il sait ce qu'il faut faire."
 ARM_open_borders_with_AZE: "Propose Opening Borders with [AZE.GetNameWithFlag]"
 ARM_open_borders_with_AZE_desc: "Le conflit du Karabakh étant résolu, nous pouvons proposer à l'Azerbaïdjan d'ouvrir nos frontières communes, de normaliser les relations et de faciliter les échanges commerciaux entre nos nations."
 karabakh.30.t: "[ARM.GetNameWithFlag] Proposes Opening Borders"
 karabakh.30.d: "L'Arménie a proposé d'ouvrir la frontière entre nos deux pays. Le conflit du Haut-Karabakh étant désormais résolu, elle estime qu'il n'y a plus lieu de maintenir le blocus. L'ouverture de la frontière permettrait le commerce et la circulation des personnes entre nos deux pays, ce qui serait bénéfique pour nos deux économies."
 karabakh.30.a: "Accepter la proposition"
 karabakh.30.b: "Rejeter la proposition"
 karabakh.31.t: "Response from [AZE.GetNameWithFlag]"
 karabakh.31.d: "L'Azerbaïdjan a répondu favorablement à notre proposition concernant l'ouverture des frontières entre nos deux nations."
 karabakh.31.a: "Nous voyons."
 eastern_church_arm_desc: "L'Église apostolique arménienne (EAA) est l'une des plus anciennes Églises chrétiennes au monde. Selon la légende, elle est qualifiée d'« apostolique » car ses fondateurs seraient les apôtres Thaddée et Barthélemy, les premiers à prêcher le christianisme en Arménie. Historiquement, l'EAA fut fondée en 301 grâce à l'œuvre de saint Grégoire l'Illuminateur et à l'adoption du christianisme comme religion d'État par le roi Tiridate III."
 ARM_footbal_diplo_desc: "La « diplomatie du football » dans les relations arméniennes et turques a débuté le 6 septembre 2008, lorsque le président turc Abdullah Gül s'est rendu à Erevan à l'invitation du président arménien Serge Sarkissian pour assister conjointement à un match de football opposant les équipes nationales des deux pays dans le cadre des qualifications pour la Coupe du monde 2010. Après la rencontre, le dirigeant turc a invité son homologue arménien à assister au match retour en Turquie le 14 octobre 2009. Le 10 octobre 2009, des protocoles bilatéraux ont été signés à Zurich avec le soutien de hauts responsables politiques et de dirigeants internationaux. Quatre jours plus tard, à Bursa, les présidents turc et arménien ont assisté à un match de leurs équipes nationales respectives. Cependant, le 22 avril 2010, Serge Sarkissian a suspendu par décret la ratification des documents signés à Zurich, expliquant que la Turquie n'était pas prête à poursuivre le processus engagé."
 arme.14.b: "Nous n'avons aucun intérêt pour ce syndicat."
 arme.222.b: "Nous n'avons aucun intérêt pour ce syndicat."
 ARM_new_unif_proj_desc: "En nous inspirant des expériences étrangères, nous devons commencer à développer un nouvel uniforme de camouflage pour nos forces armées."
 ARM_invite_it_corp_shared_desc: "Nous avons l'intention d'inviter une autre grande entreprise informatique étrangère à soutenir le développement de notre secteur informatique."
 ARM_annex_states: "États annexes"
 ARM_Kocharyan_Opposition_loc1: "\n§gOPPOSITION RÉPRIMÉE§! :\n£western_outlook_campaign_cost_modifier_texticon Soutien quotidien pro-occidental : §R-0.01§!\n£nonaligned_outlook_campaign_cost_modifier_texticon Soutien quotidien non-aligné : §R-0.01§!\n§YDépenses de santé prévues§! : §G-1.00§!\n"
 arm_reaction.6.t: "L'Arménie annonce la levée de l'occupation russe"
 arm_reaction.6.d: "Le gouvernement arménien a arrêté nos agents, interdit les partis qui nous sont loyaux et déclaré ouvertement son intention de quitter notre sphère d'influence. Erevan est notre client depuis l'indépendance, et le perdre maintenant inviterait toutes les autres capitales du Caucase à tester jusqu'où va notre patience. Il est temps de décider comment nous répondrons."
 arm_reaction.6.a: "Nous allons créer une diversion."
 arm_reaction.6.b: "We'll Organize a Mutiny."
 arm_reaction.6.c: "Exprimons notre indignation."
 arm_reaction.6.f: "Déclarer la guerre à l'Arménie."
 arm_strike_build_in_progress: "Un projet de construction est déjà en cours"
 karabakh_regulated_flag: "La question du Karabakh a été close"
 NKR_marz_arm_desc: "Le statut juridique de l'Artsakh comme marz autonome (subdivision territoriale) au sein de l'Arménie protège la majorité arménienne distincte de la région contre les revendications azerbaïdjanaises, tout en maintenant une zone tampon dans le Caucase. Cet arrangement est né des structures administratives soviétiques et est devenu une pierre angulaire de l'intégrité territoriale et de la continuité culturelle arméniennes.\n§W--------------§!\nCet esprit national sera §Rretiré§! si l'Artsakh perd l'§Hautonomie de marz§! ou si l'§HArtsakh§! cesse d'exister."
 ARM_agree_on_places_desc: "Kotcharian consolide le pouvoir en négociant des accords secrets avec les hommes forts régionaux et les oligarques : répartition des postes gouvernementaux, garanties de privilèges économiques, et assurances que les structures de pouvoir existantes seront respectées en échange du soutien à sa présidence. Ces pactes d'élite maintiennent le système Kotcharian stable.\n§W--------------§!\nCet esprit national sera §Rretiré§! si §HRobert Kotcharian§! n'est plus notre dirigeant."
 ARM_suppressed_oppos_desc: "Le régime de Kotcharian utilise mesures de police, détention, accès médiatique restreint et harcèlement pour réprimer les partis d'opposition et les voix dissidentes. L'opposition est présente mais intimidée, incapable de s'organiser efficacement ou de défier l'emprise du président sur le pouvoir.\n§W--------------§!\nCet esprit national sera §Rretiré§! si §HRobert Kotcharian§! n'est plus notre dirigeant."
 ARM_cauc_tigr_desc: "La croissance économique extraordinaire de l'Arménie sous Kotcharian, bâtie sur des booms de construction, un afflux d'investissement étranger et un PIB en hausse, lui vaut la comparaison avec les tigres asiatiques. Kotcharian vante cette croissance comme preuve que son approche autocratique, favorable aux oligarques, fonctionne mieux que la gouvernance démocratique, justifiant son contrôle serré de la politique et des médias.\n§W--------------§!\nCet esprit national sera §Rretiré§! si §HRobert Kotcharian§! n'est plus notre dirigeant."
 ARM_autocratic_grip_desc: "Le système de Kotcharian se cristallise en un autoritarisme plein : les élections sont gérées, le parlement est subordonné, la justice obéit au président, et l'opposition est marginalisée. Kotcharian n'affronte aucun défi sérieux à son règne personnel, et l'appareil d'État sert sa volonté sans friction interne.\n§W--------------§!\nCet esprit national sera §Rretiré§! si §HRobert Kotcharian§! n'est plus notre dirigeant."
 ARM_armenia_kocharyan_idea_desc: "Un concept ombrelle englobant tout le système politique de Kotcharian : la consolidation du pouvoir autocratique personnel par des accords d'élite, la croissance économique, la répression de l'opposition et le recours à des partenaires oligarchiques. Les effets réels du règne de Kotcharian se manifestent par des idées subordonnées interconnectées reflétant différents aspects de son modèle de gouvernance.\n§W--------------§!\nCet esprit national sera §Rretiré§! si §HRobert Kotcharian§! n'est plus notre dirigeant."
 ARM_armenia_serj_idea_desc: "Un concept ombrelle englobant tout le système politique de Serge Sarkissian pendant sa présidence (2008-2018) : réseaux de loyauté militaire, campagnes d'éducation patriotique, réforme des retraites, monopoles oligarchiques et occidentalisation sélective sous un parapluie de sécurité russe. Les effets réels du régime de Sarkissian se manifestent par des idées subordonnées interconnectées reflétant différentes facettes de son modèle de gouvernance.\n§W--------------§!\nCet esprit national sera §Rretiré§! si §HSerge Sarkissian§! n'est plus notre dirigeant."
 ARM_tig_reforms_desc: "Le Premier ministre Tigran Sarkissian (2008-2014) met en œuvre des réformes économiques technocratiques : refonte du système de retraites, réforme fiscale ciblée, modernisation de l'infrastructure et gains d'efficacité administrative. Ces réformes génèrent une croissance à court terme mais s'avèrent politiquement impopulaires, surtout parmi les retraités et les travailleurs confrontés à des coupes de prestations.\n§W--------------§!\nCet esprit national sera §Rretiré§! si §HSerge Sarkissian§! n'est plus notre dirigeant."
 ARM_loyal_military_idea_desc: "L'armée arménienne devient un fondement du système politique de Sarkissian : officiers et généraux qui ont servi sous lui pendant la guerre du Karabakh forment une élite loyale, élevée à des fonctions politiques et des postes d'affaires. Cette fusion militaro-oligarchique assure la stabilité politique tout en subordonnant l'indépendance militaire au contrôle présidentiel.\n§W--------------§!\nCet esprit national sera §Rretiré§! si §HSerge Sarkissian§! n'est plus notre dirigeant."
 ARM_westernization_of_society_idea_desc: "Sarkissian permet une influence culturelle occidentale sélective : mode, musique, films et réseaux sociaux occidentaux entrent ouvertement en Arménie. L'enseignement supérieur se fait de plus en plus dans des universités occidentales ; la richesse de la diaspora afflue. Cette occidentalisation culturelle coexiste avec l'autoritarisme politique et le maintien de la domination militaire russe, créant une société hybride.\n§W--------------§!\nCet esprit national sera §Rretiré§! si §HSerge Sarkissian§! n'est plus notre dirigeant."
 ARM_increased_food_imports_idea_desc: "Les oligarques de Sarkissian monopolisent les imports de blé, de sucre et de carburant des pays voisins, surtout la Russie. Ce contrôle cartellisé enrichit l'oligarchie tout en maintenant des prix artificiellement élevés et l'Arménie dépendante des intermédiaires russes. Réforme agricole et concurrence menacent les rentes monopolistiques oligarchiques.\n§W--------------§!\nCet esprit national sera §Rretiré§! si §HSerge Sarkissian§! n'est plus notre dirigeant."
 ARM_loyal_generalitet_desc: "Le corps des officiers de Sarkissian devient une caste privilégiée : hauts salaires d'officiers, accès préférentiel aux affaires et priorité dans les contrats d'État cimentent la fusion militaro-oligarchique. Les généraux basculent vers le leadership des affaires civiles ; la loyauté à Sarkissian devient la seule exigence d'avancement, subordonnant le professionnalisme militaire à l'obéissance politique.\n§W--------------§!\nCet esprit national sera §Rretiré§! si §HSerge Sarkissian§! n'est plus notre dirigeant."
 ARM_pension_reform_idea_desc: "La réforme obligatoire des retraites par capitalisation de Tigran Sarkissian en 2014 réduit les obligations de retraite de l'État en transférant le risque aux travailleurs et aux marchés d'investissement. La réforme génère des recettes mais s'avère profondément impopulaire : les retraités subissent des coupes, les travailleurs se méfient des fonds privés, et des grèves éclatent en réponse à un vol perçu de la sécurité de la retraite.\n§W--------------§!\nCet esprit national sera §Rretiré§! si §HSerge Sarkissian§! n'est plus notre dirigeant."
 ARM_patriotic_educ_spir_desc: "Le régime de Sarkissian inscrit l'éducation nationaliste dans les écoles arméniennes : formation militaire, glorification de la guerre du Karabakh et accent sur l'unicité civilisationnelle arménienne. Cette éducation patriotique bâtit une génération attachée à la puissance militaire nationale et prête à subordonner les libertés civiles aux besoins de sécurité.\n§W--------------§!\nCet esprit national sera §Rretiré§! si §HSerge Sarkissian§! n'est plus notre dirigeant."
 ARM_patriotic_educmore_spir_desc: "Un stade avancé de l'éducation patriotique : le service militaire devient une attente quasi obligatoire pour la jeunesse ; les curriculums académiques mettent l'accent sur les études stratégiques et les vertus martiales ; les fonds d'État affluent vers des programmes célébrant les traditions guerrières arméniennes. Le système éducatif devient un instrument de mobilisation militaire.\n§W--------------§!\nCet esprit national sera §Rretiré§! si §HSerge Sarkissian§! n'est plus notre dirigeant."
 ARM_monopolies_supported_idea_desc: "Le système de Sarkissian protège explicitement les monopoles oligarchiques sur le carburant, le grain et la construction : les contrats d'État affluent vers des oligarques approuvés, la concurrence étrangère est bloquée, et les prix restent artificiellement élevés. La libéralisation économique reste rhétorique tandis que les cartels oligarchiques contrôlent les denrées de base et extraient des rentes du consommateur arménien.\n§W--------------§!\nCet esprit national sera §Rretiré§! si §HSerge Sarkissian§! n'est plus notre dirigeant."
 ARM_nationalistic_educ_spir_desc: "Une variante plus idéologiquement assertive de l'éducation patriotique : le nationalisme arménien devient non seulement la fierté du patrimoine mais une affirmation agressive de revendications ethniques et historiques. Les manuels mettent l'accent sur les mémoires territoriales arméniennes ; les différends internationaux sont cadrés par un prisme nationaliste ; des mouvements nationalistes concurrents deviennent des modèles civiques approuvés par l'État.\n§W--------------§!\nCet esprit national sera §Rretiré§! si §HSerge Sarkissian§! n'est plus notre dirigeant."
 ARM_glory_of_tigran_idea_desc: "La restauration de la fierté nationale arménienne par l'héritage de Tigrane le Grand, le roi antique qui régna jadis sur un empire s'étendant de la Caspienne à la Méditerranée. Les cercles nationalistes-monarchistes invoquent cette grandeur historique pour mobiliser le soutien à un retour au règne monarchique et à la restauration territoriale.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hmonarchistes nationalistes§! perdent le pouvoir."
 ARM_crusade_legacy_idea_desc: "Les royaumes chrétiens arméniens du passé mobilisaient leurs fidèles comme croisés contre les puissances musulmanes voisines. Les mouvements nationalistes-monarchistes font écho à cet héritage, cadrant l'État arménien comme une mission chrétienne et un point de ralliement contre les rivaux régionaux.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hmonarchistes nationalistes§! perdent le pouvoir."
 ARM_urheimat_restored_idea_desc: "Le cœur historique du peuple arménien s'étend des hauts plateaux anatoliens au Caucase du Sud. L'idéologie nationaliste-monarchiste se centre sur la restauration de la souveraineté arménienne sur ces terres antiques, recouvrant ce qui est vu comme la vraie patrie territoriale de l'Arménie.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hmonarchistes nationalistes§! perdent le pouvoir."
 ARM_tseghakronism_one_idea_desc: "Le tseghakronisme, ou « national-monarchisme », est le programme idéologique des mouvements nationalistes-monarchistes arméniens, mêlant restauration monarchique, nationalisme ethnique, maximalisme territorial et traditionalisme chrétien orthodoxe.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hmonarchistes nationalistes§! perdent le pouvoir."
 ARM_renewed_knighthood_idea_desc: "Le renouveau de l'ordre féodal arménien comme modèle de gouvernance moderne : une noblesse guerrière liée par l'honneur, la prouesse martiale et la loyauté à une couronne arménienne restaurée. Les nationalistes-monarchistes dressent des parallèles entre les anciens ordres chevaleresques et les structures militaro-aristocratiques contemporaines.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hmonarchistes nationalistes§! perdent le pouvoir."
 ARM_tseghakronism_two_idea_desc: "L'avancement du tseghakronisme en idéologie d'État d'ensemble : monarchie, nationalisme et christianisme orthodoxe unifiés comme pilier de la civilisation arménienne. L'État devient inséparable de l'Église, et la loyauté au trône devient un devoir religieux autant que patriotique.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hmonarchistes nationalistes§! perdent le pouvoir."
 ARM_state_christianity_idea_desc: "Le programme nationaliste-monarchiste centre l'Église apostolique arménienne comme âme de la nation arménienne. La politique d'État impose l'observance chrétienne et les valeurs orthodoxes comme fondement de l'identité, de la citoyenneté et de l'ordre social arméniens.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hmonarchistes nationalistes§! perdent le pouvoir."
 ARM_armenia_dashnak_idea_desc: "La Fédération révolutionnaire arménienne (Dachnaktsoutioun) a poursuivi l'indépendance et la libération nationale tout au long du XXe siècle, évoluant de racines socialistes vers des idéaux nationalistes. Cet esprit ombrelle reflète la profonde présence organisationnelle du parti, ses réseaux clandestins et sa flexibilité idéologique au service des intérêts nationaux arméniens.\n§W--------------§!\nCet esprit national sera §Rretiré§! si ni les §Hcommunistes anarchistes§! ni les §Hfascistes nationalistes§! ne détiennent le pouvoir."
 ARM_dashnak_mitia_idea_desc: "Garegin Njdeh (Mourad), connu comme « Mitia », incarnait les traditions militantes de la Dachnaktsoutioun et la résistance de guérilla contre l'occupation étrangère. Son héritage a inspiré les réseaux clandestins du parti et la rhétorique de lutte armée bien au XXIe siècle.\n§W--------------§!\nCet esprit national sera §Rretiré§! si ni les §Hcommunistes anarchistes§! ni les §Hfascistes nationalistes§! ne détiennent le pouvoir."
 ARM_legacy_of_nzhden_desc: "La Dachnaktsoutioun invoquait la vision de Njdeh d'une Arménie unie et indépendante libre du contrôle impérial, adaptant son idéologie au nationalisme et au socialisme modernes. Sa philosophie a inspiré les impulsions décentralistes du parti et sa méfiance du règne étranger centralisé.\n§W--------------§!\nCet esprit national sera §Rretiré§! si ni les §Hcommunistes anarchistes§! ni les §Hfascistes nationalistes§! ne détiennent le pouvoir."
 ARM_anti_imperialism_desc: "La Dachnaktsoutioun critiquait la dépendance arménienne aux puissances impériales russe et occidentale, plaidant pour l'autodétermination nationale et l'autonomie économique. Cette posture anti-impérialiste séduisait à la fois les circonscriptions de gauche et nationalistes en quête d'une vraie souveraineté arménienne.\n§W--------------§!\nCet esprit national sera §Rretiré§! si ni les §Hcommunistes anarchistes§! ni les §Hfascistes nationalistes§! ne détiennent le pouvoir."
 ARM_dashnak_militarism_desc: "La Dachnaktsoutioun mettait l'accent sur la lutte armée et la préparation militaire comme essentielles à la survie et à l'indépendance nationales. Le parti cultivait des traditions paramilitaires et soutenait la modernisation militaire, voyant les conflits de l'Arménie comme existentiels plutôt que négociables.\n§W--------------§!\nCet esprit national sera §Rretiré§! si ni les §Hcommunistes anarchistes§! ni les §Hfascistes nationalistes§! ne détiennent le pouvoir."
 ARM_great_trial_radi_desc: "La Dachnaktsoutioun cadrait les souffrances historiques de l'Arménie, du génocide ottoman à la domination soviétique, comme un « grand procès » qui a forgé le caractère national et l'engagement révolutionnaire. Ce récit justifiait la posture intransigeante du parti sur la souveraineté et sa résistance au compromis avec les puissances étrangères.\n§W--------------§!\nCet esprit national sera §Rretiré§! si ni les §Hcommunistes anarchistes§! ni les §Hfascistes nationalistes§! ne détiennent le pouvoir."
 ARM_class_strugle_desc: "L'héritage socialiste de la Dachnaktsoutioun positionnait la lutte des classes comme inséparable de la libération nationale, critiquant à la fois les élites capitalistes et les bureaucrates soviétiques comme oppresseurs. Le parti cadrait ouvriers et paysans comme les vrais agents de la rédemption nationale arménienne.\n§W--------------§!\nCet esprit national sera §Rretiré§! si ni les §Hcommunistes anarchistes§! ni les §Hfascistes nationalistes§! ne détiennent le pouvoir."
 ARM_arm_revolt_dashnak_desc: "La Dachnaktsoutioun organisa des révoltes armées contre l'occupation étrangère tout au long de son histoire, de la Turquie ottomane à l'Union soviétique. Les réseaux clandestins du parti menaient insurrections et sabotages, voyant la rébellion armée comme le seul chemin vers une vraie indépendance.\n§W--------------§!\nCet esprit national sera §Rretiré§! si ni les §Hcommunistes anarchistes§! ni les §Hfascistes nationalistes§! ne détiennent le pouvoir."
 ARM_arm_revolt_selhoz_desc: "La Dachnaktsoutioun mobilisait les travailleurs ruraux et agricoles (sovkhozes sous le règne soviétique) dans ses réseaux organisationnels, mettant l'accent sur le rôle de la paysannerie dans la libération nationale. Le socialisme agraire devint un pilier de l'appel populiste du parti dans les campagnes arméniennes.\n§W--------------§!\nCet esprit national sera §Rretiré§! si ni les §Hcommunistes anarchistes§! ni les §Hfascistes nationalistes§! ne détiennent le pouvoir."
 ARM_social_welfare_reform_idea_desc: "La Dachnaktsoutioun défendait l'aide sociale, les droits du travail et la protection des vulnérables comme impératifs moraux liés à la survie et à la solidarité arméniennes. Le parti plaidait pour une économie coopérative et l'entraide, se positionnant comme gardien des pauvres contre le capitalisme comme l'oligarchie corrompue.\n§W--------------§!\nCet esprit national sera §Rretiré§! si ni les §Hcommunistes anarchistes§! ni les §Hfascistes nationalistes§! ne détiennent le pouvoir."
 ARM_landforce_modifier: "Forces terrestres arméniennes"
 ARM_landforce_modifier_desc: "La composante terrestre des forces armées arméniennes, bâtie autour d'une ossature d'infanterie de conscription héritée de la 7e armée de la Garde soviétique et endurcie par la première guerre du Haut-Karabakh. Chaque réforme des forces terrestres, des troupes intérieures à la réserve de défense territoriale, s'accumule ici."
 ARM_airforce_modifier: "Force aérienne arménienne"
 ARM_airforce_modifier_desc: "La composante aérienne et de défense aérienne des forces armées arméniennes. Établie en 1992 autour d'une poignée d'appareils soviétiques transférés, elle a toujours été l'arme junior, et sa capacité repose autant sur la défense aérienne terrestre que sur ses avions de combat."
 ARM_navalforce_modifier: "Forces navales arméniennes"
 ARM_navalforce_modifier_desc: "L'Arménie n'a ni côte ni flotte, mais l'état-major maintient un cadre naval, un établissement de formation et une tradition d'infanterie de marine héritée de la marine soviétique. Si nos frontières atteignent jamais la mer, ou si nos marins servent sous un autre pavillon, l'expertise existera déjà."
 NKR_landforce_modifier: "Armée de défense de l'Artsakh"
 NKR_landforce_modifier_desc: "Les forces terrestres de la République d'Artsakh, formées en 1992 à partir de détachements de milice locale et soutenues depuis par l'équipement, l'entraînement et les officiers arméniens. Les réformes transférées depuis Erevan s'accumulent ici."
 NKR_airforce_modifier: "Force de défense aérienne de l'Artsakh"
 NKR_airforce_modifier_desc: "Le petit établissement de défense aérienne de la République d'Artsakh. Sans aviation de combat propre à parler, Stepanakert s'appuie presque entièrement sur des systèmes terrestres pour contester l'espace aérien au-dessus de la ligne de contact."
 ARM_security_modifier: "Services spéciaux arméniens"
 ARM_security_modifier_desc: "L'appareil de sécurité intérieure de la République d'Arménie : le Service de sécurité nationale à Erevan, ses directions de garde-frontières et d'antiterrorisme, la police du ministère de l'Intérieur, et la branche de renseignement extérieur scindée en 2016. Chaque réforme des services s'accumule ici."
 NKR_security_modifier: "Services de sécurité de l'Artsakh"
 NKR_security_modifier_desc: "L'establishment de sécurité de la République d'Artsakh, bâti sur le modèle arménien et largement pourvu d'officiers détachés d'Erevan. Les réformes adoptées en Arménie sont transmises à Stepanakert et s'accumulent ici."
 ARM_economy_modifier: "£text_icon_armdram Économie arménienne"
 ARM_economy_modifier_desc: "La moitié intérieure de l'économie arménienne : les banques de détail d'Erevan, les mines de cuivre et de molybdène de Syunik et de Lori, les transformateurs de fruits, les cimenteries et le réseau électrique. Chaque compagnie mise en production, privatisée ou étendue laisse sa marque ici."
 ARM_western_partners_modifier: "Partenariats économiques occidentaux"
 ARM_western_partners_modifier_desc: "La part de l'économie arménienne qui repose sur le capital et les institutions occidentaux : holdings tabac canadiens, banque britannique, télécoms néerlandais, concessions minières israéliennes, le secteur IT tourné vers l'Amérique et les programmes universitaires en Europe et aux États-Unis. Ces partenaires achètent de l'influence à Erevan tant qu'ils restent.\n§W--------------§!\nCet esprit national sera §Rretiré§! si nous entrons en guerre avec l'un de :§Y \n[USA.GetNameWithFlag] \n[ENG.GetNameWithFlag] \n[CAN.GetNameWithFlag] \n[FRA.GetNameWithFlag] \n[GER.GetNameWithFlag] \n[HOL.GetNameWithFlag] \n[ISR.GetNameWithFlag]§!"
 ARM_russian_partners_modifier: "Partenariats économiques russes"
 ARM_russian_partners_modifier_desc: "Les liens scientifiques et éducatifs de l'ère soviétique que Moscou finance encore : les instituts de recherche d'Erevan et les antennes universitaires russes en Arménie. Ils maintiennent la science arménienne en vie, et l'influence russe à Erevan avec elle.\n§W--------------§!\nCet esprit national sera §Rretiré§! si nous entrons en guerre avec :§Y \n[SOV.GetNameWithFlag]§!"
 NKR_economy_modifier: "Économie de l’Artsakh"
 NKR_economy_modifier_desc: "La petite économie de guerre de la République d'Artsakh : fiscalité de guerre, fermes des vallées du Karabakh, travaux forestiers et tout investissement que Stepanakert peut attirer. Chaque réforme adoptée à Stepanakert s'accumule ici."
 ARM_alpha_mobilize_idea: "Groupe Alpha (mobilisé)"
 ARM_alpha_mobilize_idea_desc: "Le groupe antiterroriste Alpha a été retiré de son rôle permanent et engagé au front comme formation de ligne. Pendant son déploiement, le service perd le travail de contre-espionnage et de garnison qu'il accomplit normalement.\n§W--------------§!\nCet esprit national sera §Rretiré§! à la fin de la guerre."
 ARM_police_troops_mobilize_idea: "Troupes de police (mobilisées)"
 ARM_police_troops_mobilize_idea_desc: "Les troupes intérieures du ministère de l'Intérieur ont été mobilisées comme formation de campagne. Pendant qu'elles sont au front, elles ne policent pas l'intérieur.\n§W--------------§!\nCet esprit national sera §Rretiré§! à la fin de la guerre."
 ARM_outdated_airforce_idea_desc: "Notre armée de l'air fait voler une poignée d'appareils transférés à l'effondrement soviétique. Les heures de cellule s'épuisent, les pièces détachées arrivent irrégulièrement, et les pilotes enregistrent bien trop peu d'heures pour conserver leurs qualifications.\n§W--------------§!\nCet esprit national §Gs'améliorera§! si nous achevons le focus §H$ARM_institute_mo_ra$§!, et sera §Rretiré§! si nous achevons le focus §H$ARM_air_fedence_force$§!.\nEn tant qu'§HArtsakh§!, il sera §Rretiré§! par le focus §H$NKR_planes$§!."
 ARM_outdated_army_idea_desc: "Nos forces terrestres sont équipées de stocks soviétiques laissés en 1991 et organisées selon une doctrine écrite pour une guerre qui ne sera jamais combattue. Les véhicules sont cannibalisés pour les pièces, l'entraînement est nominal, et le corps des officiers n'a pas été réformé depuis l'indépendance.\n§W--------------§!\nEn tant qu'§HArtsakh§!, il §Gs'améliorera§! avec les focus §H$NKR_safe_army$§!, §H$NKR_safe_univer$§!, §H$NKR_safe_special_forces$§!, §H$NKR_safe_vazgen$§! et §H$NKR_safe_mo_ra$§! à la place, et sera §Rretiré§! une fois les cinq achevés."
 ARM_nati_army_idea_desc: "Les vétérans de la guerre du Karabakh et les partis qui parlent pour eux se sont emparés du corps des officiers et des conseils de conscription. Ils remplissent les rangs et accroissent l'appétit de guerre, mais le gouvernement civil leur répond autant qu'ils lui répondent.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les communistes arrivent au pouvoir."
 ARM_dziavory_idea_desc: "Un détachement d'élite de reconnaissance et d'opérations spéciales tiré des volontaires les plus capables de la guerre du Karabakh. Fièrement nationalistes, les Dziavory sont autant une circonscription politique qu'une unité militaire.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les communistes arrivent au pouvoir."
 ARM_102_idea_desc: "La coopération avec la 102e base militaire russe à Gyumri donne à nos services accès au renseignement d'origine électromagnétique russe, à la pratique du contre-espionnage et à la garantie de sécurité qui vient d'une garnison étrangère sur notre sol.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les communistes arrivent au pouvoir."
 ARM_armenian_foreign_legion_idea_desc: "Modelée sur la Légion française, notre légion étrangère recrute des volontaires de toute nationalité prêts à servir l'Arménie. Elle nous donne un cadre expéditionnaire professionnel sans puiser dans les effectifs de conscription, au prix d'une influence étrangère sur son équipement et son entraînement.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les forces armées ne recrutent plus de volontaires ou si nous mettons fin à la liaison militaire étrangère."
 ARM_armenian_foreign_legion_moblize_idea_desc: "La brigade de la Légion étrangère a été retirée de son rôle permanent et engagée au front comme formation de ligne. Ses recrues, tirées de la diaspora et de volontaires étrangers, servent aux mêmes conditions que les conscrits tant que les combats durent.\n§W--------------§!\nCet esprit national sera §Rretiré§! à la fin de la guerre."
 ARM_national_guard_level_1_tt: "Nous avons établi la §YGarde nationale§!"
 ARM_national_guard_level_2_tt: "Nous avons étendu la §YGarde nationale§!"
 ARM_peace_level_1_tt: "Nous avons établi la §Ybrigade de maintien de la paix§!"
 ARM_anti_air_level_1_tt: "Nous avons établi la §Yforce de défense aérienne§!"
 ARM_vdv_level_1_tt: "Nous avons établi les §Yforces aéroportées§!"
 ARM_davisur_level_1_tt: "Nous avons adopté le programme d'équipement §YDAVISUR§!"
 NKR_integrate_army_of_armenia_available: "[ARM.GetNameWithFlag] a réformé une branche de ses forces armées que nous n'avons pas encore adoptée"
 ARM_nor_aven_first_desc: "La reconstruction de l'avenue du Nord au centre d'Erevan apporte modernisation et commerce au cœur de la capitale, accroissant les flux d'investissement et les opportunités d'affaires dans l'État concerné."
 ARM_nor_aven_sec_desc: "La préservation de la vieille ville d'Erevan apporte continuité culturelle et potentiel touristique à la capitale, maintenant le caractère du centre historique tout en ouvrant de nouvelles opportunités économiques.\n§W--------------§!\nCe modificateur d'État sera §Rretiré§! si les problèmes d'infrastructure à Erevan sont résolus."
 ARM_armenia_pashik_idea_desc: "Le gouvernement de Nikol Pachinian a embrassé la société civile, la décentralisation et les normes démocratiques après la révolution de velours de 2018. Son administration s'est tournée vers les institutions occidentales et les libertés civiles, marquant une rupture nette avec des décennies de gouvernance oligarchique.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hlibertariens neutres§! perdent le pouvoir."
 ARM_loyalists_in_government_desc: "Pachinian a cultivé une base politique au sein des institutions de l'État, nommant des fonctionnaires réformistes et des technocrates sympathiques à son agenda. Ce réseau de loyalistes a fourni un soutien crucial pendant les premières années de consolidation, lorsque la résistance des anciennes structures de pouvoir restait forte.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hlibertariens neutres§! perdent le pouvoir."
 ARM_armenian_soc_media_prop_idea_desc: "Le gouvernement de Pachinian a tiré parti des réseaux sociaux pour contourner les médias traditionnels contrôlés par les oligarques, s'adressant directement aux citoyens sur Facebook, Instagram et Telegram. Cet appareil de propagande moderne a renforcé son image de dirigeant du peuple et contourné la résistance institutionnelle à ses réformes.\n§W--------------§!\nCet esprit national sera §Rretiré§! si ni les §Hlibertariens neutres§! ni §HNikol Pachinian§! ne détiennent le pouvoir."
 ARM_pashinyan_anti_corrupt_idea_desc: "La lutte anticorruption est devenue la politique phare et la marque personnelle de Pachinian, avec arrestations et poursuites d'oligarques des régimes précédents. Son gouvernement a établi de nouveaux organes anticorruption et mécanismes de poursuite, bien que les critiques aient argué que l'application restait sélective et politiquement motivée.\n§W--------------§!\nCet esprit national sera §Rretiré§! si ni les §Hlibertariens neutres§! ni §HNikol Pachinian§! ne détiennent le pouvoir."
 ARM_education_reforms_desc: "Pachinian a priorisé la modernisation du système éducatif arménien, augmentant les salaires des enseignants et introduisant de nouveaux curriculums alignés sur les valeurs démocratiques. La réforme éducative symbolisait la rupture avec l'apprentissage par cœur de l'ère soviétique et préparait la jeune génération aux rôles de la société civile.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hlibertariens neutres§! perdent le pouvoir."
 ARM_true_pashik_democracy_desc: "La vision de la démocratie de Pachinian mettait l'accent sur des institutions transparentes, des médias indépendants et un débat pluraliste, un contraste marqué avec l'oligarchie opaque des années 1990. L'expression « démocratie de Pachik » encapsulait sa promesse d'une gouvernance représentative authentique et de la responsabilité.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hlibertariens neutres§! perdent le pouvoir."
 ARM_controlled_democracy_desc: "Tout en avançant les libertés civiles, le gouvernement de Pachinian a conservé un contrôle d'État significatif sur des institutions clés, des secteurs sensibles et des issues politiques. Cet équilibre entre apparence démocratique et pouvoir exécutif s'est révélé pragmatique pour naviguer l'oligarchie fractieuse de l'Arménie et les tensions régionales.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hlibertariens neutres§! perdent le pouvoir."
 ARM_new_era_of_peace_idea_desc: "Après des années de conflit, Pachinian a d'abord promu le dialogue et la désescalade avec l'Azerbaïdjan et la Turquie, mettant l'accent sur la coopération économique plutôt que la confrontation militaire. Son gouvernement a poursuivi des négociations sur le différend du Haut-Karabakh par une médiation internationale.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hlibertariens neutres§! perdent le pouvoir."
 ARM_support_of_ngo_idea_desc: "Le gouvernement de Pachinian a renforcé les liens avec les ONG internationales et les organisations de la société civile, accueillant leur surveillance de la gouvernance et des droits de l'homme. Ce partenariat a renforcé l'image démocratique de l'Arménie et sécurisé une aide étrangère liée aux réformes de bonne gouvernance.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hlibertariens neutres§! perdent le pouvoir."
 ARM_support_for_regions_desc: "Investissement gouvernemental dans l'agriculture rurale, l'infrastructure d'irrigation et les programmes de soutien aux cultures pour stimuler la productivité régionale et la production agricole dans les provinces frontalières."
 ARM_de_sovietization_idea_desc: "Le démantèlement systématique des institutions, de l'idéologie et de l'infrastructure de l'ère soviétique : remplacer le symbolisme communiste, décommuniser l'éducation et la culture, et reconstruire la société civile selon des lignes démocratiques. Cet agenda définit le projet libéral-nationaliste de Ter-Petrossian pour l'Arménie post-indépendance.\n§W--------------§!\nCet esprit national sera §Rretiré§! si ni les §Hlibertariens neutres§! ni §HLevon Ter-Petrossian§! ne détiennent le pouvoir."
 ARM_land_reform_idea_desc: "Démanteler les fermes collectives soviétiques et rendre la terre à la propriété privée pour stimuler la productivité agricole et inverser le déclin rural. Cette réforme libérale-démocratique vise à créer une classe de yeomen indépendants et à revitaliser l'Arménie rurale.\n§W--------------§!\nCet esprit national sera §Rretiré§! si ni les §Hlibertariens neutres§! ni §HLevon Ter-Petrossian§! ne détiennent le pouvoir."
 ARM_cilician_diplomacy_idea_desc: "La diaspora arménienne et les royaumes arméniens historiques de Cilicie fournissent des ressources diplomatiques et culturelles à la politique étrangère de l'Arménie. Engager les réseaux de la diaspora et honorer l'héritage cilicien renforce le standing international et la légitimité culturelle de l'Arménie.\n§W--------------§!\nCet esprit national sera §Rretiré§! si ni les §Hlibertariens neutres§! ni §HLevon Ter-Petrossian§! ne détiennent le pouvoir."
 ARM_balanced_approach_idea_desc: "Une voie médiane entre le traditionalisme orthodoxe franc et le libéralisme occidental, équilibrant l'héritage chrétien de l'Arménie avec un engagement pragmatique avec l'Occident et les États musulmans voisins. Cette diplomatie pragmatique cherche la stabilité par une neutralité calculée et un partenariat économique plutôt que par la confrontation idéologique.\n§W--------------§!\nCet esprit national sera §Rretiré§! si ni les §Hlibertariens neutres§! ni §HLevon Ter-Petrossian§! ne détiennent le pouvoir."
 ARM_liberalization_of_economy_idea_desc: "Réformes de marché pour remplacer la planification centrale soviétique : privatiser les entreprises d'État, lever les contrôles des prix, ouvrir l'Arménie au commerce international et établir un système bancaire moderne. Ce programme économique libéral vise à harnesser les énergies productives du capitalisme tout en maintenant des protections sociales.\n§W--------------§!\nCet esprit national sera §Rretiré§! si ni les §Hlibertariens neutres§! ni §HLevon Ter-Petrossian§! ne détiennent le pouvoir."
 ARM_crossroad_diplomacy_reverse_idea_desc: "Notre nation a établi un partenariat commercial mutuellement bénéfique avec l'Arménie, tirant parti de sa position stratégique pour accéder à de multiples marchés et ressources régionaux. Cette relation commerciale génère des retours économiques stables et un levier politique dans le Caucase, offrant à la fois gain économique et avantage géopolitique par un intermédiaire neutre.\n§W--------------§!\nCet esprit national sera §Rretiré§! si l'Arménie cesse d'exister ou si nous entrons en guerre avec l'Arménie."
 ARM_crossroad_diplomacy_idea_desc: "La position géographique de l'Arménie au carrefour des sphères d'influence russe, persane, turque et occidentale offre à la fois péril et opportunité. Ter-Petrossian poursuit un engagement pragmatique avec tous les camps, tirant parti de partenariats économiques et de sécurité sans lier l'Arménie à un seul bloc. Cette approche soutenue est rendue possible par l'emprise de gouvernements libertariens neutres ou dirigés par Ter-Petrossian.\n§W--------------§!\nCet esprit national §Gs'améliorera§! à mesure que les initiatives diplomatiques réussissent et que l'Arménie approfondit son engagement trans-blocs."
 ARM_crossroad_diplomacy_idea_1_desc: "L'engagement croissant de l'Arménie à travers de multiples sphères : accords avec la Russie pour la sécurité, avec l'Occident pour le commerce et l'investissement, avec l'Iran pour l'énergie et le transit, et avec sa diaspora pour le capital et l'expertise. Cet acte d'équilibrage avancé reste dépendant d'une gouvernance libertarienne neutre ou du leadership continu de Ter-Petrossian.\n§W--------------§!\nCet esprit national §Gs'améliorera§! à mesure que l'Arménie étend ses liens diplomatiques et économiques à travers toutes les régions."
 ARM_crossroad_diplomacy_idea_2_desc: "La position de carrefour de l'Arménie est devenue une pierre angulaire de sa stratégie de survie : jouer médiatrice et courtier entre puissances concurrentes, vendant ses atouts géographiques et culturels au plus offrant tout en minimisant le risque militaire et l'engagement politique. Cet équilibre délicat exige un engagement soutenu à une politique étrangère neutre.\n§W--------------§!\nCet esprit national §Gs'améliorera§! à mesure que la valeur de l'Arménie comme partenaire de carrefour neutre augmente."
 ARM_crossroad_diplomacy_idea_3_desc: "L'Arménie a consolidé sa position de véritable pont entre Est et Ouest : accueillant des bases militaires russes tout en engageant des membres de l'OTAN, vendant à des partenaires démocratiques comme autoritaires, et canalisant l'investissement de tous les camps. La durabilité de cet arrangement repose entièrement sur le maintien de l'Arménie hors des camps idéologiques, un engagement que seuls les gouvernements libertariens ou Ter-Petrossian peuvent tenir.\n§W--------------§!\nCet esprit national §Gs'améliorera§! à mesure que la réputation neutre de l'Arménie devient plus précieuse pour les puissances concurrentes."
 ARM_crossroad_diplomacy_idea_4_desc: "L'Arménie est devenue un carrefour véritablement indispensable : son territoire, ses réseaux de diaspora, ses centres financiers et sa posture neutre la rendent essentielle aux calculs stratégiques de la Russie, de l'Occident, de l'Iran et d'autres. Les rentes économiques affluent de toutes directions, finançant le développement et la sécurité arméniens sans exiger un alignement total avec un bloc.\n§W--------------§!\nCet esprit national §Gs'améliorera§! à mesure que l'indispensabilité stratégique de l'Arménie pour toutes les parties croît."
 ARM_crossroad_diplomacy_idea_5_desc: "L'Arménie a perfectionné l'art du carrefour : elle est devenue l'intermédiaire et la destination d'investissement privilégiés de multiples grandes puissances, chacune cherchant un levier dans le Caucase du Sud sans confrontation directe. La neutralité continue de l'Arménie et sa gouvernance libertarienne sont les clés du maintien de cet acte d'équilibrage extraordinairement profitable.\n§W--------------§!\nCet esprit national §Gs'améliorera§! si l'Arménie continue d'approfondir ses relations avec toutes les grandes puissances sans alignement formel."
 ARM_crossroad_diplomacy_idea_6_desc: "Le aboutissement de décennies de diplomatie soigneuse : l'Arménie a atteint une telle maîtrise de son rôle de carrefour qu'elle est essentielle à la stratégie régionale de chaque grande puissance. L'économie arménienne est tissée dans tous les blocs concurrents ; la sécurité arménienne est garantie par la présence russe mais respectée par l'Occident ; les élites arméniennes ont des actifs partout. Ce stade final exige un engagement inébranlable à la neutralité et ne peut survivre à un basculement idéologique.\n§W--------------§!\nCet esprit national sera §Rretiré§! si ni les §Hlibertariens neutres§! ni §HLevon Ter-Petrossian§! ne détiennent le pouvoir."
 ARM_national_liberal_agenda_idea_desc: "Raffi Hovannisian et le parti Héritage plaident pour le national-libéralisme : économie de marché combinée au nationalisme culturel et à l'engagement de la diaspora. Cet agenda rejette à la fois l'autoritarisme de style soviétique et le néolibéralisme occidental, cherchant une voie arménienne unique de nationalisme civique, d'entrepreneuriat et de développement financé par la diaspora.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hconservateurs occidentaux§! perdent le pouvoir."
 ARM_health_pindos_idea_desc: "Les réformes de santé destinées à moderniser et privatiser la médecine arménienne génèrent des conséquences inattendues : coûts en hausse, accès réduit pour les pauvres, friction bureaucratique et pénuries de médicaments et d'équipement. La tentative d'appliquer des modèles de marché de santé américains aux conditions arméniennes se retourne, générant mécontentement public et tension économique.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hconservateurs occidentaux§! perdent le pouvoir."
 ARM_free_market_reforms_idea_desc: "Hovannisian plaide pour une économie libérale classique : privatisation des entreprises d'État, démantèlement des monopoles, levée des contrôles des prix et ouverture de l'Arménie à la concurrence. Les réformes de libre marché visent à libérer l'énergie entrepreneuriale et à éliminer le rentierisme oligarchique, bien qu'elles risquent disruption sociale et inégalité si elles ne sont pas équilibrées par un soutien social.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hconservateurs occidentaux§! perdent le pouvoir."
 ARM_protection_of_armenian_heritage_idea_desc: "Le parti Héritage place le legs culturel et spirituel arménien au centre de la politique : soutien d'État à l'Église apostolique, préservation des monastères et sites historiques arméniens, et accent sur la continuité civilisationnelle arménienne. Ce nationalisme culturel distingue l'Arménie de l'athéisme soviétique tout en maintenant l'ouverture aux valeurs civiques occidentales.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hconservateurs occidentaux§! perdent le pouvoir."
 ARM_armenian_traders_culture_idea_desc: "Invoquant les réseaux marchands historiques de la diaspora arménienne, Hovannisian célèbre l'esprit entrepreneurial et le réseautage commercial comme traits spécifiquement arméniens. L'État encourage les associations d'affaires, les partenariats commerciaux de la diaspora et l'éducation orientée marché, voyant capitalisme et identité arménienne comme compatibles.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hconservateurs occidentaux§! perdent le pouvoir."
 ARM_protection_of_national_education_idea_desc: "Héritage protège l'éducation arménienne de la domination culturelle étrangère (surtout russe) : mettant l'accent sur l'histoire, la langue et la littérature arméniennes dans les curriculums, accroissant les dépenses d'éducation pour attirer des enseignants de la diaspora, et renforçant les liens avec les universités occidentales tout en maintenant l'identité culturelle arménienne comme cœur.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hconservateurs occidentaux§! perdent le pouvoir."
 ARM_soil_of_libery_idea_desc: "Le sol de l'Arménie, physiquement et métaphoriquement, devient le terreau de la liberté démocratique et de l'indépendance nationale. Hovannisian cadre l'État arménien comme un projet de principes universels de liberté : démocratie, droits de l'homme et État de droit enracinés dans le sol arménien, résistant à la fois à l'autoritarisme russe et à la capture oligarchique.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hconservateurs occidentaux§! perdent le pouvoir."
 ARM_us_inspired_government_idea_desc: "Hovannisian modèle explicitement la gouvernance arménienne sur les institutions américaines : séparation constitutionnelle des pouvoirs, justice indépendante, structures fédérales et accent sur la société civile. Cette américanisation de la gouvernance vise à importer la résilience démocratique occidentale et à protéger l'Arménie de la domination russe comme de la capture oligarchique.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hconservateurs occidentaux§! perdent le pouvoir."
 ARM_social_promises_desc: "Pachinian a promis une réforme sociale d'ensemble, y compris des hausses de retraites, de meilleurs services publics et des mesures anticorruption pour bâtir une légitimité populaire. Ces engagements formaient l'ossature de sa campagne de 2018 et de ses premières initiatives de gouvernance.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hlibertariens neutres§! perdent le pouvoir."
 ARM_armenia_raffik_idea_desc: "Un concept ombrelle incarnant la vision conservatrice-occidentale de Raffi Hovannisian : le national-libéralisme arménien marié à l'engagement de la diaspora, l'économie de libre marché, la protection du patrimoine et une gouvernance démocratique de style américain. Les effets réels de cette vision se manifestent par des idées subordonnées interconnectées reflétant différentes facettes du modèle d'Hovannisian pour transformer l'Arménie.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hconservateurs occidentaux§! perdent le pouvoir."
 ARM_sport_development_desc: "L'Arménie investit systématiquement dans l'infrastructure athlétique, les académies d'entraînement et les programmes sportifs compétitifs pour cultiver la fierté nationale et le prestige international. Le succès aux sports olympiques et aux compétitions régionales montre l'excellence arménienne au monde, bâtissant un soft power et l'unité autour d'un accomplissement national partagé.\n§W--------------§!\nCet esprit national §Gs'améliorera§! lorsque le focus §HDévelopper le sport§! est achevé."
 ARM_berkut_troops_desc: "Berkut, l'Aigle d'or, est une unité d'élite de contrôle des émeutes et d'antiterrorisme déployée par les intérêts oligarchiques pour réprimer grèves, organisation ouvrière et troubles civils. Leur présence reflète la volonté des oligarques d'utiliser la force pour protéger leurs monopoles économiques contre le défi populaire.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Holigarques neutres§! perdent le pouvoir."
 ARM_farmercracy_desc: "Les oligarques d'Arménie maintiennent le contrôle économique par des monopoles agricoles : contrôlant les prix du grain, les canaux d'export et le régime foncier. Les partis politiques soutenus par les oligarques promeuvent des protections agricoles qui maintiennent l'Arménie rurale dépendante de leurs réseaux de clientélisme et de leur soutien électoral.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Holigarques neutres§! perdent le pouvoir."
 ARM_corporatocracy_desc: "Règne par les oligarques et leurs relais corporatifs : les entreprises d'État sont informellement contrôlées par de puissants oligarques, les contrats gouvernementaux affluent vers leurs alliés, et la politique d'État est modelée par leurs intérêts économiques plutôt que par le bien public. Les oligarques ont effectivement acheté l'appareil d'État.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Holigarques neutres§! perdent le pouvoir."
 ARM_legacy_of_father_idea_desc: "L'héritage de Demirtchian comme dirigeant du Parti communiste reposait sur son soutien aux ouvriers industriels et aux soldats soviétiques, les voyant comme l'ossature du développement arménien. Ce palier représente l'appel fondateur de son modèle socialiste technocratique à la classe ouvrière.\n§W--------------§!\nCet esprit national §Gs'améliorera§! lorsque le focus §HOuvriers et soldats§! est achevé."
 ARM_legacy_of_father_two_idea_desc: "La vision de Demirtchian du développement soviétique arménien mettait l'accent sur l'autonomie culturelle au sein d'un État socialiste géré, équilibrant identité nationale et internationalisme prolétarien. Ce palier représente un engagement approfondi à la gouvernance technocratique et à l'héritage institutionnel soviétique.\n§W--------------§!\nCet esprit national §Gs'améliorera§! lorsque le focus §HCondamner les décisions soviétiques§! est achevé."
 ARM_legacy_of_father_three_idea_desc: "L'accent tardif de Demirtchian sur les technocrates stratégiques — économistes, ingénieurs et administrateurs — comme essentiels à la modernisation nationale a cristallisé sa philosophie de gouvernance. Ce palier représente l'ascendant de l'expertise et des principes méritocratiques sur les réseaux de clientélisme.\n§W--------------§!\nCet esprit national §Gs'améliorera§! lorsque le focus §HPromouvoir les technocrates§! est achevé."
 ARM_legacy_of_father_four_idea_desc: "La réalisation ultime de l'héritage de Demirtchian, un État communiste technocratique gérant les intérêts stratégiques et le développement de l'Arménie, représente le sommet de la gouvernance de style soviétique en Arménie. Ce palier final capture le rêve d'un communisme nationaliste efficace libre de l'ingérence de Moscou.\n§W--------------§!\nCet esprit national sera §Rretiré§! lorsque la restauration de Demirtchian s'achève et que le projet communiste affronte un défi inévitable."
 ARM_armenia_demirchyan_idea_desc: "Karen Demirtchian, dirigeant du Parti communiste arménien de l'ère soviétique, incarnait la gouvernance technocratique et les impulsions nationalistes au sein de la structure soviétique. Son administration mettait l'accent sur le développement industriel et la préservation culturelle, gagnant le respect même des opposants pour sa compétence et sa retenue.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hcommunistes neutres§! perdent le pouvoir."
 ARM_economy_shady_idea_desc: "Salaires en liquide, imports non enregistrés et commerce non taxé maintiennent une large part du commerce arménien hors des livres. Cela achète la paix sociale au prix du Trésor.\n§W--------------§!\nCet esprit national §Gs'améliorera§! si nous utilisons la décision §YDétruire l'influence de l'économie parallèle§!."
 ARM_economy_shady_idea4_desc: "Seul le plus petit coin de l'économie grise reste. Le focus §YAffaires de casino§! le §Gretire§!."
 ARM_multigroup_idea_desc: "Le conglomérat Multigroup s'étend dans le carburant, le tabac, la construction et la politique. Chaque concession qui lui est faite approfondit son emprise sur l'État.\n§W--------------§!\nCet esprit national §Gs'améliorera§! si nous utilisons la décision §YDémanteler Multigroup§!."
 ARM_gaz_energy_problems_desc: "L'Arménie a hérité d'un réseau de gaz et d'électricité qui ne correspond plus à sa demande, et les coupures hivernales des années 1990 restent fraîches dans la mémoire vive.\n§W--------------§!\nCet esprit national sera §Rretiré§! si nous achevons le focus §HCoopération avec Gazprom§!."
 ARM_has_artsakh_idea: "Administration de l’Artsakh"
 ARM_has_artsakh_idea_desc: "Erevan porte l'administration civile, la police et les retraites d'un territoire qu'elle ne reconnaît pas formellement comme le sien. Le coût est silencieux mais permanent.\n§W--------------§!\nCet esprit national sera §Rretiré§! si l'§HArtsakh§! perd son §Hautonomie de marz§! ou cesse d'exister."
 ARM_integration_idea: "Intégrer un nouveau territoire"
 ARM_integration_idea_desc: "Une province nouvellement annexée est amenée sous le droit arménien. Tant que la transition n'est pas achevée, les coûts de police montent et les gens partent."
 ARM_Eraz_idea_desc: "The Yerevan Automobile Plant (ErAZ) is the Soviet-era cornerstone of Armenian automotive manufacturing, producing the iconic ErAZ vans and commercial vehicles for export throughout the USSR and post-Soviet markets. Revival of ErAZ production symbolizes Armenia's re-industrialization and dependence on Russian markets and technology.\n§W--------------§!\nThis national spirit will be §RRemoved§! if we enter into war with Russia."
 NKR_gaz_energy_problems_desc: "La majeure partie de l'Artsakh est encore chauffée au bois et au gaz en bouteille.\n§W--------------§!\nCet esprit national sera §Rretiré§! si nous achevons le focus §HMener la gazéification§!."
 NKR_corruption_in_police_idea_desc: "La police de l'Artsakh vit de ce qu'elle peut extraire aux checkpoints.\n§W--------------§!\nCet esprit national sera §Rretiré§! si nous achevons le focus §HRéorganisation de la police§!."
 ARM_economy_tourism_income_tt: "£text_icon_armdram L'Arménie perçoit des §Yrecettes touristiques mensuelles§! de chaque région de villégiature qu'elle contrôle"
 ARM_have_bank_sector_tt: "Nous avons un §Ysecteur bancaire§! consolidé"
 ARM_have_green_energy_tt: "Nous avons un programme d'§Yénergie verte§!"
 ARM_have_electric_networks_tt: "Nous possédons les §Yréseaux électriques d'Arménie§!"
 arm_economic.24.t: "Les partenaires occidentaux se retirent"
 arm_economic.24.d: "Dès les premiers coups de feu, les conseils se sont réunis. Holdings tabac, banques, opérateurs télécoms, concessions minières et programmes universitaires démantèlent tous à la fois leurs opérations arméniennes. Certains invoquent les sanctions, d'autres l'assurance, et aucun ne dira quand ils entendent revenir."
 arm_economic.24.a: "Ils n'allaient jamais rester."
 arm_economic.25.t: "Moscou ferme les instituts"
 arm_economic.25.d: "Le financement de la recherche s'est arrêté d'abord, puis l'antenne universitaire a reçu l'ordre de suspendre les admissions. Des décennies de laboratoires partagés et de personnel échangé sont défaits par lettre administrative, et les scientifiques qui les ont bâtis cherchent déjà du travail à l'étranger."
 arm_economic.25.a: "Nous les reconstruirons nous-mêmes."
 ARM_landmines_desc: "Mines antichars et antipersonnel déployées à travers le territoire de l'Artsakh comme mesure défensive contre l'invasion. Elles gênent les opérations mécanisées ennemies mais compliquent la reconstruction civile et le développement économique."
 ARM_eu_coop_agreement_desc: "L'Arménie signe l'accord de partenariat global et renforcé (CEPA) avec l'Union européenne en 2017, rehaussant les liens au-delà de l'accord d'association de 2013 abandonné lorsque l'Arménie a rejoint l'Union économique eurasienne. Le CEPA établit une coopération en commerce, investissement, gouvernance, énergie et sécurité, un acte d'équilibrage entre engagement européen et intégration régionale menée par la Russie.\n§W--------------§!\nCet esprit national sera §Rretiré§! lorsque le focus §HFermer toutes les organisations d'intégration§! est achevé."
 ARM_eu_council_desc: "L'adhésion de l'Arménie au Conseil de l'Europe expose le pays aux normes européennes de droits de l'homme, aux normes démocratiques et à l'examen international. Cet ancrage institutionnel aux structures de gouvernance européennes fournit légitimité et cadres juridiques pour la réforme intérieure, tout en soumettant les politiques arméniennes à une pression et une surveillance extérieures.\n§W--------------§!\nCet esprit national sera §Rretiré§! lorsque le focus §HFermer toutes les organisations d'intégration§! est achevé."
 ARM_eu_commitie_desc: "Une commission parlementaire arménienne dédiée à l'intégration européenne coordonne l'harmonisation législative, met en œuvre les normes européennes et gère la machinerie bureaucratique liant l'Arménie aux réseaux institutionnels européens. La commission représente l'ancrage profond des attentes de gouvernance européennes dans la pratique étatique arménienne.\n§W--------------§!\nCet esprit national sera §Rretiré§! lorsque le focus §HFermer toutes les organisations d'intégration§! est achevé."
 ARM_eu_ngos_desc: "Des ONG européennes et internationales opèrent à travers l'Arménie, surveillant les droits de l'homme, délivrant des services et promouvant la réforme de la gouvernance. Leur présence fournit des mécanismes de responsabilité extérieure tout en sapant le monopole de l'État sur la société civile et projetant des valeurs occidentales dans les communautés arméniennes.\n§W--------------§!\nCet esprit national sera §Rretiré§! lorsque le focus §HFermer les ONG§! est achevé."
 ARM_eu_lgbt_desc: "L'engagement nominal de l'Arménie envers les droits LGBTQIA, codifié par les conventions européennes des droits de l'homme, affronte une profonde résistance sociale et religieuse de la majorité orthodoxe conservatrice arménienne. Cette tension entre obligations juridiques européennes et valeurs intérieures reste l'un des points d'engagement les plus épineux de l'Arménie avec l'Occident.\n§W--------------§!\nCet esprit national sera §Rretiré§! lorsque le focus §HPropagande contre les valeurs occidentales§! est achevé."
 ARM_help_siryan_idea_desc: "L'Arménie achemine par air personnel militaire, conseillers et fournitures humanitaires vers l'enclave syro-arménienne d'Alep, soutenant les communautés arméniennes menacées pendant la guerre civile syrienne. Cette mission soutient la sécurité de la communauté de la diaspora tout en affirmant l'engagement de l'Arménie à protéger les minorités arméniennes à travers le Moyen-Orient.\n§W--------------§!\nCet esprit national sera §Rretiré§! lorsque la paix sera restaurée et que notre mission humanitaire s'achèvera."
 ARM_fsb_borderguards_desc: "Des gardes-frontières du Service fédéral de sécurité russe sont stationnés aux frontières de l'Arménie avec la Turquie et l'Iran depuis 1992, formalisés par un traité bilatéral. Ils patrouillent la frontière, interceptent les contrebandiers et maintiennent un symbole visible de la présence militaire russe sur notre sol. Leur déploiement dépend de la bonne volonté de Moscou et de la stabilité de la relation bilatérale.\n§W--------------§!"
 ARM_syunik_pipeline_desc: "Un gazoduc traversant la province de Syunik, livrant du gaz iranien à l'Arménie. Le gazoduc soulage la pénurie énergétique chronique de l'Arménie, intègre la province sud à l'économie nationale et crée un lien précieux dans le commerce irano-arménien.\n§W--------------§!\nCe modificateur d'État sera §Rretiré§! si nous annulons le gazoduc par la décision §YAnnuler le gazoduc§! ou si nous le modernisons par la décision §YÉtendre le gazoduc§!."
 ARM_syunik_pipeline_two_desc: "Un gazoduc modernisé à travers la province de Syunik, livrant des approvisionnements accrus de gaz iranien à l'Arménie. Le gazoduc étendu approfondit l'intégration économique de l'Arménie avec l'Iran et stimule considérablement le développement de la province.\n§W--------------§!\nCe modificateur d'État sera §Rretiré§! si nous annulons le gazoduc par la décision §YAnnuler le gazoduc§!."
 ARM_arm_electr_deal_desc: "Un accord d'approvisionnement en électricité de l'Iran vers l'Arménie, réduisant la dépendance à la production nationale et allégeant les pénuries saisonnières dans la province."
 ARM_arm_electr_deal_two_desc: "Un accord étendu pour des approvisionnements accrus d'électricité depuis l'Iran, stabilisant le réseau électrique arménien et permettant la croissance industrielle dans les provinces frontalières."
 ARM_legacy_of_grunwald_idea_desc: "L'Arménie invoque la leçon de Grunwald : opposition unie contre l'hégémonie germanique. Dressant des parallèles avec l'alliance polono-lituanienne contre l'expansion teutonique, l'Arménie courtise d'anciens partenaires soviétiques et d'Europe de l'Est pour former un contrepoids à la domination industrielle et politique allemande dans la région.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hcommunistes§! arrivent au pouvoir."
 ARM_amenia_iran_memo_desc: "L'Arménie et l'Iran ont signé des mémorandums d'entente cruciaux au début des années 2000 couvrant la coopération énergétique, les voies de transit et la coordination médiatique. Ces accords reconnaissaient des intérêts partagés dans la stabilité, l'accès aux marchés et la défense commune contre des rivaux partagés. Le partenariat ancrat l'Arménie dans un réseau de liens eurasien.\n§W--------------§!\nCet esprit national sera §Rretiré§! si l'opinion de l'Iran à notre égard tombe sous zéro."
 ARM_amenia_iran_dam_share_desc: "L'Arménie et l'Iran ont conjointement investi dans l'infrastructure hydroélectrique le long de l'Araxe dans la province de Syunik, créant une production énergétique partagée et une dépendance économique mutuelle. Cette entreprise conjointe exemplifiait une coopération transfrontalière pratique et fournissait à l'Arménie une électricité bon marché tandis que l'Iran gagnait de l'influence sur la sécurité énergétique arménienne.\n§W--------------§!\nCet esprit national sera §Rretiré§! si l'opinion de l'Iran à notre égard tombe sous zéro."
 ARM_free_trade_zone_desc: "Une zone de libre-échange établie dans la province de Meghri pour faciliter les flux commerciaux, réduire les barrières tarifaires et attirer l'investissement étranger dans la région frontalière sud reliant l'Arménie à l'Iran."
 ARM_ukraine_cooperation_idea_desc: "L'Arménie et l'Ukraine forgent des partenariats stratégiques tirant parti de la substantielle présence de la diaspora arménienne en Ukraine. La coopération couvre commerce, investissement, technologie militaire et coordination politique dans l'espace post-soviétique, liant deux nations aux expériences partagées de pression russe et de frontières contestées.\n§W--------------§!\nCet esprit national sera §Rretiré§! si nous entrons en guerre avec l'Ukraine."
 ARM_yazidi_repatriation_desc: "L'Arménie accueille des Yézidis fuyant la persécution à travers le Moyen-Orient, leur offrant sanctuaire, autonomie culturelle et représentation dans les institutions politiques arméniennes. Le programme de rapatriement yézidi reflète les liens historiques de l'Arménie avec la communauté yézidie et positionne l'Arménie comme refuge des minorités persécutées à travers la diaspora.\n§W--------------§!\nCet esprit national §Gs'améliorera§! lorsque le focus §HNotre terre de leur liberté§! est achevé."
 ARM_yazidi_repatriation2_desc: "Le rapatriement yézidi atteint son sommet : des dizaines de milliers de Yézidis sont revenus sur les terres arméniennes, créant des centres culturels florissants en Cilicie et ailleurs. La communauté gagne une pleine représentation parlementaire, une autonomie religieuse et des opportunités économiques, positionnant l'Arménie comme un refuge exemplaire pour les minorités persécutées au Moyen-Orient.\n§W--------------§!\nCet esprit national sera §Rretiré§! si nous perdons le contrôle de la Cilicie."
 ARM_armenia_zhirayr_idea_desc: "Un concept ombrelle incarnant le programme politique radical pro-occidental et anti-russe de Sefilian : gouvernance menée par les vétérans, confrontation avec l'élite oligarchique, activisme anticorruption et réorientation dramatique vers l'OTAN et l'Occident. Les effets réels de cette transformation radicale se manifestent par des idées subordonnées interconnectées reflétant différentes facettes de la vision de Sefilian.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hautocrates occidentaux§! perdent le pouvoir."
 ARM_zhirayr_veterans_idea_desc: "Sefilian et son mouvement placent les vétérans de combat, surtout les commandants de la guerre du Karabakh, au leadership politique, arguant que l'expérience militaire et le sacrifice confèrent la légitimité. Les vétérans déplacent civils et oligarques des postes d'autorité, apportant discipline martiale et priorités nationalistes à la gouvernance.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hautocrates occidentaux§! perdent le pouvoir."
 ARM_zhirayr_pro_western_position_idea_desc: "Une rupture nette avec la politique étrangère arménienne post-soviétique : le mouvement de Sefilian abandonne le partenariat militaire russe et les obligations de l'OTSC au profit de l'adhésion à l'OTAN, de l'intégration européenne et de l'alignement avec les puissances occidentales. L'Arménie devient un avant-poste de l'alliance occidentale dans le Caucase du Sud, affrontant la Russie directement aux frontières arméniennes.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hautocrates occidentaux§! perdent le pouvoir."
 ARM_zhirayr_no_russian_idea_desc: "Sefilian rejette explicitement la dépendance arménienne à la protection militaire russe. Retirer les troupes russes du sol arménien, refuser les obligations de l'OTSC et bâtir des capacités de défense indépendantes arméniennes deviennent centraux à ce programme nationaliste anticolonial. L'Arménie reconquiert sa souveraineté vis-à-vis de Moscou.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hautocrates occidentaux§! perdent le pouvoir."
 ARM_zhirayr_radicalism_idea_desc: "Le mouvement de Sefilian rejette explicitement la politique de consensus et les compromis libéraux, embrassant l'action directe et la confrontation idéologique avec l'ordre oligarchique établi. Le cadrage radical de la politique arménienne — protestation armée, occupation de bâtiments d'État et défi public — devient institutionnalisé comme principe de gouvernance.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hautocrates occidentaux§! perdent le pouvoir."
 ARM_zhirayr_first_armenia_war_idea_desc: "Sefilian et son mouvement vénèrent la première guerre du Haut-Karabakh (1988-1994) comme le moment définissant de l'indépendance et de la gloire militaire arméniennes. Cette mémoire de guerre devient une force de mobilisation pour une confrontation renouvelée : avec l'Azerbaïdjan, avec la Russie sur l'avenir de l'Arménie, et avec l'élite intérieure qui aurait gaspillé la victoire.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hautocrates occidentaux§! perdent le pouvoir."
 ARM_zhirayr_fight_freedom_idea_desc: "Sefilian cadre la lutte présente comme une continuation des guerres de libération de l'Arménie : liberté de la domination étrangère (la Russie), liberté de la tyrannie intérieure (les oligarques), et liberté de tracer une voie indépendante. La lutte héroïque devient à la fois la méthode et la justification de l'action radicale et de l'alliance occidentale.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hautocrates occidentaux§! perdent le pouvoir."
 ARM_zhirayr_heroes_idea_desc: "Le mouvement de Sefilian élève héros de guerre, dirigeants militants et martyrs comme modèles pour la jeunesse arménienne, remplaçant les oligarques comme symboles de l'aspiration nationale. Une nouvelle génération de héros émerge de la lutte contre la corruption et la dépendance étrangère, inspirant une plus haute mobilisation et un sacrifice pour les buts nationaux.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hautocrates occidentaux§! perdent le pouvoir."
 ARM_zhirayr_e_commerce_idea_desc: "Le mouvement de Sefilian embrasse une transformation technologique radicale : développer le secteur IT arménien comme levier d'intégration occidentale et d'indépendance économique vis-à-vis de la Russie. L'économie tech devient un symbole de modernité, d'émancipation de la jeunesse et de rupture avec les industries héritées de l'ère soviétique.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hautocrates occidentaux§! perdent le pouvoir."
 ARM_zhirayr_sassoun_idea_desc: "Nommée d'après les légendaires héros de Sassoun du folklore arménien et le groupe armé Sasna Tsrer que Sefilian mena lors de sa prise de commissariat en 2016, cette idée célèbre le défi armé comme outil moral et politique. Le modèle du guerrier-héros devient le gabarit pour affronter la tyrannie, intérieure ou étrangère.\n§W--------------§!\nCet esprit national sera §Rretiré§! si les §Hautocrates occidentaux§! perdent le pouvoir."
 ARM_turkey_compliance_idea_desc: "L'Arménie tolère tacitement un gouvernement en exil pour l'Arménie occidentale, maintenant une conformité diplomatique avec la Turquie pour éviter la provocation tout en préservant la revendication irrédentiste sur les terres arméniennes historiques. Cet arrangement permet à l'Arménie de plaider pour les intérêts de la diaspora sans déclencher une réponse militaire turque directe.\n§W--------------§!\nCet esprit national sera §Rretiré§! lorsque l'événement §HSoulèvement en Arménie occidentale§! se déclenche et que l'Arménie choisit la libération."
 ARM_kazah_cooperation_idea_desc: "L'Arménie établit des liens économiques et politiques avec le Kazakhstan, capitalisant sur un héritage soviétique partagé, des connexions de diaspora et un intérêt mutuel à contrer l'hégémonie russe. La coopération inclut commerce énergétique, investissement et coordination de sécurité, ancrant l'Arménie dans les réseaux d'Asie centrale.\n§W--------------§!\nCet esprit national sera §Rretiré§! si nous entrons en guerre avec le Kazakhstan."