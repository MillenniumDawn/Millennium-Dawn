 sp_improved_nuclear_ballistic_warhead_delivery_systems: "Système de livraison d'ogives balistiques amélioré"
 sp_improved_nuclear_ballistic_warhead_delivery_systems_desc: "Au cours du développement des ogives nucléaires, nous avons pu améliorer et développer une portée accrue pour notre équipement de missiles."
 sp_fusion_reactors_special_project_idea: "Réacteurs à fusion"
 sp_improved_nuclear_reactor_centrifuge_technology_idea: "Centrifugeuse de réacteur nucléaire améliorée"
