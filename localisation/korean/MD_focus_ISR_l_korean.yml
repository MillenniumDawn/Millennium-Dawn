 israel_knesset_category: "[ISR.GetNameWithFlag] 크네세트"
 israel_knesset_category_desc: "§4크네세트§!에서 입법, 연립, 의회 절차를 관리합니다. 법률을 통과시키고, 연립 파트너를 만족시키며, 정부의 실질적 과반 의석을 유지하십시오."
 ISR_knesset_desc_loc: "  §4크네세트§!는 [ISR.GetNameWithFlag]의 국회(의회)이며, \n  네 가지 주요 기능을 갖습니다. §Y법률 제정§! - §4크네세트§!만이 \n  법률을 제정할 권한을 가집니다 - 정부 업무의 감독, \n  [ISR.GetNameWithFlag]의 §Y대통령§! 및 국가 감사원장 선출, 그리고 \n  §4크네세트§! 위원회와 본회의 활동을 통한 \n  국가 현안의 심의입니다.\n\n  §Y정부를 유지§!하려면 §9연립§!을 구성하고 연립 구성원들의\n  요구를 충족시켜야 하며, 이는 우리에게 더 많은 지지와\n  예산법을 변경할 더 많은 가능성도 줍니다. §4크네세트§!에서의 우리의 지지와 인기도는\n  보유한 의석 수로 나타납니다."
