 call_to_war_rule_chinese_united_front: "중국 통일 전선"
 call_to_war_rule_chinese_indian_alliance: "중국-인도 동맹"
 joining_rule_gca_nations: "일부 그란콜롬비아 국가"
 all_gca_possible_members: "모든 GCA 가입 가능 국가"
 all_gca_possible_members_desc: "가입 가능한 모든 그란콜롬비아 동맹 국가를 동맹에 가입시키십시오."
 POL_red_europe_pact: "붉은 유럽 조약"
 POL_eastern_europe_pact: "동유럽 조약"
 joining_rule_shia: "시아파 국가만"
 joining_rule_post_soviet_states: "구소련 국가만"
 stabilizing_balkans: "발칸 안정화"
 stabilizing_balkans_desc: "발칸은 유럽의 장기적 평화를 위해 안정화가 필요한 '뜨거운' 지역입니다"
 nato_expansion: "나토 확장"
 nato_expansion_desc: "평화를 지키고 부상하는 위협을 억제하려면 수의 힘에서 강점을 찾아야 합니다."
 transform_nato_forces: "나토군 개편"
 transform_nato_forces_desc: "내일의 도전에 대응하기 위해 나토군의 구조를 개선해야 합니다."
 transform_eap_forces: "동아시아 조약군 개편"
 transform_eap_forces_desc: "내일의 도전에 대응하기 위해 동아시아 조약군의 구조를 개선해야 합니다."
 check_russia: "러시아의 위협에 맞서기"
 check_russia_desc: "러시아는 이미 너무 오래 평화를 어지럽혀 왔으며, 그들의 행보를 반드시 견제해야 합니다."
 check_china: "중국의 위협에 맞서기"
 check_china_desc: "중국은 이미 너무 오래 평화를 어지럽혀 왔으며, 그들의 행보를 반드시 견제해야 합니다."
 democracy_in_europe: "유럽의 민주주의"
 democracy_in_europe_desc: "유럽에서 민주주의가 최고의 자리를 차지하도록 이를 공고히 하고 보장하는 것이 필수적입니다."
 democracy_in_europe_completed_tt: "모든 유럽 국가가 선거를 치르며 서방 또는 비동맹 성향임"
 democracy_in_east_asia: "동아시아의 민주주의"
 democracy_in_east_asia_desc: "동아시아에서 민주주의가 최고의 자리를 차지하도록 이를 공고히 하고 보장하는 것이 필수적입니다."
 faction_goal_no_terrorism_name: "정보 기관 설립"
 faction_goal_no_terrorism_desc: "전 세계적 테러에 대한 우리 세력의 대응은 너무 오랫동안 분열되어 있었습니다. 국가 정보 기관을 설립하면 본격적인 대테러 활동의 기반이 마련되며, 동반국들이 위협을 본격적으로 추적하는 데 필요한 보너스를 얻게 됩니다."
 crush_the_democracy_goal_name: "민주주의 분쇄"
 crush_the_democracy_goal_desc: "국민은 민주주의 이상을 잊어야 합니다. 그래야만 서방의 선전과 공격으로부터 안전해질 수 있습니다."
 help_ukraine_name: "침공에 맞선 우크라이나 지원"
 help_ukraine_name_desc: "우크라이나는 서방으로 나아가고 있고 러시아는 몰락한 제국에 필사적으로 매달리고 있습니다. 진로를 바꾸려는 우크라이나의 의지를 지켜야 합니다."
 help_taiwan_name: "침공에 맞선 대만 지원"
 help_taiwan_name_desc: "중국은 동아시아에 명백한 위협이 되었습니다. 대만이 다시 중국의 통제 아래로 들어가는 것을 막는 것이 좋은 선택일 것입니다."
 control_mandeb_goal_name: "만데브 해협 장악"
 control_mandeb_goal_name_desc: "만데브 해협은 홍해의 핵심 요충지 중 하나입니다. 지역 내 지속적인 상업과 병참을 보장하기 위해 이를 장악해야 합니다."
 call_to_war_rule_never: "전쟁 개입 없음"
 nato_defeat_taliban: "아프가니스탄의 테러 격퇴"
 nato_defeat_taliban_desc: "미국에 대한 대규모 테러 공격의 여파 속에서, 나토는 더 큰 피해를 입히기 전에 이 위협을 파괴할 준비를 갖추어야 합니다."
