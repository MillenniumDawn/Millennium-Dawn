 STALKER_global_zone_category: "Global Zone Affairs"
 STALKER_global_zone_category_desc: "Since the Kaymanov outcome, anomalous Zones and the artifacts they yield concern every government.\n\nWorld artifact price: §Y$[?global.STALKER_artifact_price|2]§! billion each\nArtifacts on the open market: §Y[?global.STALKER_market_artifacts|0]§!"
 STALKER_mdst_category: "MDST Counterintelligence"
 STALKER_mdst_category_desc: "The X-Lab files show that MDST, the Ministry of Defense and Secret Technologies, still draws on Project X channels inside state institutions, including ours.\n\nMDST penetration: §Y[?ROOT.STALKER_mdst_penetration|0]§! / 80\nIt grows by §R1§! each month. Above §Y9§!, its monthly chance to steal artifacts and X-Lab progress is one fifth of its penetration, at most once every §Y180 days§!."
 STALKER_mdst_warning_heeded: "Warned us about MDST"
