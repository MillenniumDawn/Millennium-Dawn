 CHI_SAR_MIO_share_tt: "Tous les États marionnettes RAS ont accès aux organisations militaro-industrielles de la Chine."
 CHI_tai_pressure_economic_tt: "La Chine s'appuie sur les dépendances commerciales pour presser Washington de réduire son soutien à Taïwan. Les États-Unis doivent décider comment répondre."
 CHI_tai_pressure_diplomatic_tt: "La Chine ouvre des canaux diplomatiques mesurés pour persuader Washington de s'éloigner de Taïwan."
 CHI_pressure_derecognize_TAI_tt: "La Chine applique une pression économique et diplomatique. Si la cible ne retire pas sa reconnaissance de Taïwan dans le délai, la Chine imposera un embargo commercial."
 TAI_reduced_us_support: "Soutien militaire américain diminué"
 TAI_reduced_us_support_desc: "Sous la pression chinoise à Washington, les États-Unis ont réduit les livraisons d'armes et la coopération militaire avec Taïwan. Les forces armées font face à une préparation réduite et à un moral plus bas parmi les unités dépendantes de l'équipement et de la doctrine américains."
 TAI_isolated_from_us: "Abandonné par Washington"
 TAI_isolated_from_us_desc: "Les États-Unis ont formellement retiré leur soutien militaire et diplomatique à Taïwan sous une pression chinoise soutenue. Les forces armées se retrouvent sans leur principal garant de sécurité, ce qui sape gravement la capacité de défense et la confiance civile."
 CHI_TAI_shared_modifier: "Relations à travers le détroit"
 CHI_TAI_shared_modifier_desc: "Un indice dynamique d'interdépendance économique et politique à travers le détroit de Taïwan. Des liens plus étroits relèvent la stabilité et la dérive démocratique tout en améliorant les relations commerciales, l'efficacité des usines, la vitesse de recherche et la production de construction ; l'éloignement alimente au contraire la dérive communiste, la pression politique interne et la capacité de raids navals."
 CHI_SAR_network_modifier: "Un système chinois"
 CHI_SAR_network_modifier_desc: ""
 CHI_TAI_air_dominance: "Suprématie aérienne sur le détroit"
 CHI_TAI_air_dominance_desc: "Les opérations de l'armée de l'air de l'APL au-dessus du détroit de Taïwan ont établi une pression aérienne persistante sur les défenses taïwanaises, dégradant leur capacité à contester le contrôle de l'espace aérien."
 CHI_TAI_naval_modernization_idea: "Modernisation navale"
 CHI_TAI_naval_modernization_idea_desc: "Le programme d'acquisition accéléré de la marine de l'APL a livré une flotte moderne capable d'opérations soutenues dans le détroit de Taïwan."
 TAI_blockade_economic_crisis: "Crise économique du blocus"
 TAI_blockade_economic_crisis_desc: "Le blocus naval chinois a coupé les routes commerciales maritimes de Taïwan, provoquant de graves pénuries de carburant, de matières premières et de biens de consommation. La production industrielle s'est effondrée."
 TAI_self_sufficiency: "Mesures d'autosuffisance"
 TAI_self_sufficiency_desc: "Des mesures d'urgence pour développer la capacité de production intérieure et réduire la dépendance aux importations commencent à porter leurs fruits, compensant partiellement l'impact du blocus."
 TAI_cyber_sabotage: "Cyber-sabotage"
 TAI_cyber_sabotage_desc: "Une opération cyber chinoise coordonnée a perturbé les infrastructures critiques, les communications militaires et les systèmes financiers à travers Taïwan."
 TAI_blockade_partial: "Perturbation maritime"
 TAI_blockade_partial_desc: "La zone de sécurité maritime déclarée par la Chine perturbe le trafic commercial et fait grimper les coûts d'assurance des navires à destination des ports taïwanais."
 TAI_emergency_situation: "État d'urgence"
 TAI_emergency_situation_desc: "Taïwan a déclaré l'état d'urgence en réponse au blocus chinois. La conscription a été élargie et les mesures de défense civile activées, mais le tribut économique est sévère."
 CHI_TAI_tourism_ban: "Gel du tourisme à travers le détroit"
 CHI_TAI_tourism_ban_desc: "La RPC a suspendu le tourisme sortant de groupe et individuel vers Taïwan, coupant les flux de visiteurs constitués depuis la libéralisation des voyages transdétroit en 2008. En 2019, Pékin a étendu l'interdiction aux permis de visite individuelle, stoppant des centaines de milliers de voyageurs annuels. La mesure inflige un préjudice direct aux secteurs de l'hôtellerie, du commerce de détail et des services de Taïwan tout en signalant la volonté de Pékin d'utiliser l'interdépendance économique comme outil de coercition."
 CHI_crossstrait_operations: "Préparation aux opérations à travers le détroit"
 CHI_crossstrait_operations_desc: "L'APL a atteint la pleine préparation opérationnelle pour des opérations amphibies et aéroportées combinées à travers le détroit de Taïwan."
 CHI_TAI_amphibious_mastery: "Doctrine d'assaut amphibie"
 CHI_TAI_amphibious_mastery_desc: "Les formations du corps des marines de l'APL ont atteint un haut niveau de maîtrise des opérations amphibies interarmes grâce à des exercices intensifs dans le détroit de Taïwan."
 CHI_TAI_military_buildup_idea: "Renforcement militaire transdétroit"
 CHI_TAI_military_buildup_idea_desc: "L'Armée populaire de libération a concentré d'importants moyens terrestres, navals et aériens le long de la côte du Fujian en préparation d'une éventuelle contingence du détroit de Taïwan."
 china_sar.027.t: "La question de Taïwan : premiers coups"
 china_sar.027.d: "Le Conseil des affaires d'État a autorisé une campagne soutenue pour éroder le soutien américain à Taïwan. Levier économique, isolement diplomatique et signaux militaires sont autant d'instruments disponibles. La question est de savoir jusqu'où pousser, et à quelle vitesse."
 china_sar.027.a: "Appliquer une pression économique maximale. Nous rendrons le coût du soutien à Taïwan insupportable."
 china_sar.027.b: "Commencer par des ouvertures diplomatiques mesurées. La patience donne de meilleurs résultats que la confrontation."
 china_sar.028.t: "Washington pèse ses options"
 china_sar.028.d: "La campagne de pression de Pékin arrive à Washington à un moment maladroit. L'administration fait face à des factions concurrentes : faucons exigeant une réaffirmation ferme de l'engagement envers Taïwan, et pragmatiques inquiets des conséquences économiques d'une antagonisation de la Chine."
 china_sar.028.a: "Réaffirmer notre engagement envers Taïwan. La pression chinoise ne fait que renforcer notre résolution."
 china_sar.028.b: "Reconnaître les préoccupations de la Chine. Nous pouvons trouver une formule qui réduit les tensions sans abandonner Taïwan."
 china_sar.029.t: "Escalade : la Chine relève l'enjeu"
 china_sar.029.d: "Le rejet de Washington a mal été accueilli à Zhongnanhai. La direction est sous pression pour démontrer que le défi a un prix. Deux options sont sur la table : bâtir une coalition diplomatique contre la politique américaine sur Taïwan, ou signaler la résolution militaire par des exercices dans le détroit."
 china_sar.029.a: "Bâtir une coalition internationale. L'isolement diplomatique est plus durable que la confrontation."
 china_sar.029.b: "Mener des exercices dans le détroit de Taïwan. Washington doit comprendre la dimension militaire de notre engagement."
 china_sar.030.t: "Washington propose une concession partielle"
 china_sar.030.d: "Après un débat interne, l'administration a signalé sa volonté de réduire, mais non d'éliminer, les ventes d'armes à Taïwan. L'offre est présentée comme un geste en faveur de la stabilité. Pékin doit décider s'il accepte le gain partiel ou insiste pour un retrait complet."
 china_sar.030.a: "Accepter la concession. Un gain partiel reste un gain."
 china_sar.030.b: "Rejeter l'offre. Le retrait complet du soutien est le seul résultat acceptable."
 china_sar.031.t: "L'Amérique à la croisée des chemins"
 china_sar.031.d: "La campagne de pression soutenue de la Chine a forcé une décision finale à Washington. La communauté du renseignement avertit que de nouvelles concessions risquent d'enhardir Pékin dans tout l'Indo-Pacifique. Mais le coût économique de la confrontation est également réel. L'administration doit choisir."
 china_sar.031.a: "Retirer le soutien formel à Taïwan. La relation avec Pékin est trop importante pour être sacrifiée."
 china_sar.031.b: "Réaffirmer pleinement notre engagement envers Taïwan. Nous ne nous laisserons pas intimider jusqu'à l'abandon."
 china_sar.032.t: "Washington prend ses distances avec Taïwan"
 china_sar.032.d: "Dans un basculement discret mais considérable, les États-Unis ont signalé qu'ils ne fourniront plus de soutien militaire et diplomatique actif au statut séparé de Taïwan. L'annonce est formulée en langage bureaucratique, mais son sens stratégique est sans équivoque : Taïwan se tient seul."
 china_sar.032.a: "Une réussite historique. La voie de la réunification est désormais ouverte."
 china_sar.033.t: "Washington réaffirme son engagement"
 china_sar.033.d: "Les États-Unis ont rejeté la campagne de pression chinoise et réaffirmé publiquement leur engagement envers la sécurité de Taïwan. L'administration a annoncé un nouveau paquet d'armes pour Taipei et convoqué des consultations d'urgence avec le Japon et l'Australie. La campagne de Pékin a échoué et a durci l'opposition à Washington."
 china_sar.033.a: "Un revers, mais pas une défaite. Nous réévaluerons notre approche."
 china_sar.001.t: "Proposition : accord sur le commerce des services transdétroit"
 china_sar.001.d: "Pékin a présenté l'accord transdétroit sur le commerce des services, ouvrant d'importants secteurs de services des deux rives à un commerce et un investissement plus libres. La proposition accorderait aux entreprises continentales l'accès aux secteurs bancaire, sanitaire et de la distribution de Taïwan. Les partisans y voient un approfondissement de l'intégration économique ; les critiques avertissent qu'elle offre à Pékin un levier structurel sur l'économie taïwanaise."
 china_sar.001.a: "Signer l'accord. L'intégration économique sert nos intérêts à long terme."
 china_sar.001.b: "Rejeter l'accord. Les concessions sont trop profondes et le contrôle trop faible."
 china_sar.002.t: "Réseaux d'affaires à travers le détroit"
 china_sar.002.d: "Des réseaux d'affaires pro-Pékin se sont étendus aux secteurs financier et médiatique de Taïwan, soutenus par des capitaux continentaux et facilités par une série d'accords d'investissement opaques. Le gouvernement doit décider comment répondre à une influence croissante qui brouille la frontière entre commerce et politique."
 china_sar.002.a: "Accueillir les échanges transdétroit. Les liens économiques sont un fondement de la stabilité."
 china_sar.002.b: "Surveiller les réseaux, mais ne pas les restreindre. Une réaction excessive nuirait au commerce légitime."
 china_sar.002.c: "Imposer des restrictions aux investissements liés au continent dans les secteurs sensibles."
 china_sar.003.t: "La question du consensus de 92"
 china_sar.003.d: "La Chine continentale a formellement proposé de relancer le consensus de 1992 comme base diplomatique des pourparlers transdétroit. La formule est délibérément ambiguë : Pékin l'interprète comme un engagement envers l'objectif de réunification sous une seule Chine, tandis que le KMT l'a traditionnellement accepté sous la formule « une Chine, interprétations respectives ». Le DPP le rejette depuis longtemps comme un piège politique. Taïwan doit répondre."
 china_sar.003.a: "Accepter la formule du consensus. « Une Chine, interprétations respectives » préserve notre position tout en ouvrant une voie au dialogue."
 china_sar.003.b: "Reconnaître l'esprit du dialogue sans endosser explicitement la formule. Nous cherchons la paix, pas un engagement politique."
 china_sar.003.c: "Rejeter le consensus. Toute formule impliquant l'acceptation d'« une Chine » sape notre statut souverain."
 china_sar.004.t: "Victoire des indépendantistes à Taïwan"
 china_sar.004.d: "Le camp indépendantiste a obtenu la majorité aux élections taïwanaises. Le gouvernement entrant a clairement indiqué qu'il n'accepterait pas le consensus de 92 et entend tracer un cap plus assertif sur le statut international de Taïwan. Les relations transdétroit entrent dans une période de refroidissement."
 china_sar.004.a: "Un revers. Nous réévaluerons notre approche de Taipei."
 china_sar.005.t: "Les opérations d’ingérence de Pékin dévoilées"
 china_sar.005.d: "Le Bureau de la sécurité nationale de Taïwan a mis au jour des preuves d'opérations liées à la RPC visant à influencer la politique intérieure, notamment des investissements médiatiques par procuration, le financement de figures politiques pro-engagement et la culture de réseaux d'affaires utilisés pour canaliser des messages politiques. Les conclusions ont fuité dans la presse et suscitent l'indignation publique."
 china_sar.005.a: "Expulser les attachés culturels impliqués et adresser une protestation formelle. Nous ne tolérerons pas la manipulation étrangère de notre démocratie."
 china_sar.006.t: "Taïwan expulse des responsables chinois"
 china_sar.006.d: "Taipei a formellement expulsé plusieurs attachés culturels et commerciaux après la révélation des opérations d'influence politique de Pékin. La mesure reçoit les applaudissements des alliés démocratiques de Taïwan et une vive réprimande publique du ministère des Affaires étrangères à Pékin."
 china_sar.006.a: "Encaisser le coût diplomatique. L'exposition de l'opération retarde notre travail, mais la stratégie d'ensemble reste saine."
 china_sar.035.t: "La sensibilisation culturelle de Pékin"
 china_sar.035.d: "La Chine et la Mongolie-Intérieure ont lancé une campagne d'influence culturelle coordonnée en Mongolie, promouvant un héritage mongol partagé tout en orientant l'opinion publique vers une intégration plus étroite. Pékin présente l'effort comme un échange culturel, mais les implications sont indéniablement politiques."
 china_sar.035.a: "Nous n'avons d'autre choix que de le reconnaître."
 china_sar.036.t: "Une union avec la Mongolie-Intérieure ?"
 china_sar.036.d: "Une délégation officielle de Pékin et Hohhot est arrivée à Oulan-Bator avec une proposition formelle : la Mongolie est invitée à rejoindre la République populaire en tant que région administrative spéciale dans un cadre « un pays, deux systèmes ». L'offre s'accompagne de garanties économiques et de promesses d'autonomie culturelle, mais aussi de tout le poids de l'influence chinoise."
 china_sar.036.a: "Nous acceptons l'offre."
 china_sar.036.b: "La Mongolie restera indépendante."
 china_sar.037.t: "La Mongolie refuse la réunification"
 china_sar.037.d: "Oulan-Bator a formellement rejeté la proposition de réunification. Le gouvernement mongol invoque la souveraineté nationale et l'opposition publique, même si les canaux diplomatiques restent ouverts. Pékin prend acte de la décision mais précise que l'offre tient."
 china_sar.037.a: "Nous réessaierons."
 china_sar.007.t: "Approche dangereuse au-dessus du détroit"
 china_sar.007.d: "Un chasseur de l'APL a mené une interception agressive d'un aéronef militaire étranger opérant près de la ligne médiane du détroit de Taïwan. La rencontre, filmée par la caméra de cockpit, montre le pilote chinois passant à quelques mètres de l'appareil cible. Les médias internationaux exigent une réponse."
 china_sar.007.a: "Nier toute implication et désescalader."
 china_sar.007.b: "Gardez le silence officiel."
 china_sar.007.c: "Défendre publiquement l'action comme une application légitime de la loi."
 china_sar.008.t: "Collision navale dans le détroit de Taïwan"
 china_sar.008.d: "Un destroyer de la marine de l'APL et un navire de guerre étranger sont entrés en collision lors d'une rencontre rapprochée dans le détroit de Taïwan. Les deux bâtiments ont subi des dégâts. L'incident a déclenché un tollé international et place Pékin dans une position difficile."
 china_sar.008.a: "Blâmer l'autre partie pour une navigation imprudente."
 china_sar.008.b: "Ne rien déclarer et laisser l'affaire s'estomper."
 china_sar.008.c: "Présentez des excuses privées via les canaux secondaires."
 china_sar.009.t: "Test de fusée : silence régional"
 china_sar.009.d: "L'essai de missile balistique de la Force des fusées de l'APL au-dessus du détroit de Taïwan a suscité une réaction internationale timide. Washington a publié une déclaration de préoccupation de pure forme mais n'a pris aucune mesure concrète. L'absence de réaction américaine significative envoie un signal puissant dans toute la région."
 china_sar.009.a: "Notre résolution parle plus fort que leur silence."
 china_sar.010.t: "Test de fusée : refoulement américain"
 china_sar.010.d: "L'essai de missile de la Force des fusées de l'APL près de Taïwan a spectaculairement échoué. Washington a ordonné à un groupe aéronaval d'entrer dans le détroit et annoncé un paquet d'armes d'urgence pour Taipei. L'opinion internationale s'est consolidée contre Pékin."
 china_sar.010.a: "Ce revers ne nous dissuadera pas."
 china_sar.011.t: "Taïwan est seul"
 china_sar.011.d: "Les alliés diplomatiques formels de Taïwan ont été réduits à une poignée de petits États. Sans reconnaissance internationale significative, la prétention de Taipei à la souveraineté repose sur un terrain de plus en plus fragile. L'isolement est à la fois symbolique et pratique."
 china_sar.011.a: "Le filet se resserre autour de la province renégate."
 china_sar.012.t: "Vote du Congrès sur les armes"
 china_sar.012.d: "Le Congrès des États-Unis débat d'un important paquet de ventes d'armes à Taïwan. Notre réseau de lobby à Washington a l'occasion d'influencer le vote, mais l'intervention comporte des risques si notre implication est exposée."
 china_sar.012.a: "Activer le réseau de lobby pour bloquer la vente."
 china_sar.012.b: "Formuler des menaces économiques par les voies diplomatiques."
 china_sar.012.c: "Laisser le processus se dérouler sans interférence."
 china_sar.013.t: "Le conseil des affaires plaide pour la détente"
 china_sar.013.d: "Le US-China Business Council a publié un rapport exhortant Washington à privilégier la stabilité commerciale plutôt que les engagements de sécurité envers Taïwan. Le rapport, façonné par nos efforts d'engagement économique, a gagné du terrain dans les cercles politiques."
 china_sar.013.a: "Noté."
 china_sar.014.t: "L’ingérence électorale révélée"
 china_sar.014.d: "Les agences de renseignement américaines ont publiquement attribué une opération d'influence politique à des acteurs étatiques chinois. Le scandale a déclenché une indignation bipartisane au Congrès et une vague de mesures punitives. Notre position stratégique vis-à-vis de Washington a subi un coup sévère."
 china_sar.014.a: "Une erreur de calcul coûteuse."
 china_sar.015.t: "Réunion d'urgence sur la sécurité"
 china_sar.015.d: "L'exercice de simulation de blocus de la Chine dans le détroit de Taïwan a déclenché une session d'urgence du Conseil de sécurité nationale. Commandants militaires et membres du cabinet débattent de la réponse appropriée à la pression croissante de Pékin."
 china_sar.015.a: "Accroître la préparation militaire le long de la côte."
 china_sar.015.b: "Faire appel à la communauté internationale pour obtenir un soutien."
 china_sar.016.t: "État d'urgence"
 china_sar.016.d: "Le blocus partiel persiste depuis deux mois, perturbant le commerce et créant des pénuries de carburant et de matières critiques. Le gouvernement fait face à une pression croissante pour déclarer un état d'urgence formel et placer les forces armées en alerte maximale."
 china_sar.016.a: "Déclarer l'état d'urgence."
 china_sar.016.b: "Rechercher une résolution diplomatique avec Pékin."
 china_sar.017.t: "La question de la capitulation"
 china_sar.017.d: "Le blocus naval complet a brisé notre économie et coupé nos lignes d'approvisionnement. Le soutien américain étant de fait retiré, des voix au sein du gouvernement évoquent discrètement la possibilité d'ouvrir des négociations avec Pékin selon leurs termes."
 china_sar.017.a: "Nous ne nous rendrons jamais. Continuer le combat."
 china_sar.017.b: "Ouvrir des négociations avec Pékin."
 china_sar.018.t: "Taïwan ouvre les négociations"
 china_sar.018.d: "Taipei a envoyé une délégation à Pékin avec mandat de discuter des termes de la réunification. Le blocus, l'effondrement économique et le retrait du soutien américain n'ont laissé à l'île aucune alternative viable. Un chapitre historique se clôt."
 china_sar.018.a: "Accepter la réunification de la mère patrie."
 china_sar.019.t: "Crise du détroit de Taiwan"
 china_sar.019.d: "Les tensions dans le détroit de Taïwan ont atteint un seuil critique. Les forces militaires des deux côtés sont en préparation maximale et une seule erreur de calcul pourrait déclencher un conflit ouvert. Le Comité permanent du Politburo convoque une session d'urgence pour décider de la prochaine étape."
 china_sar.019.a: "Reculer du bord du gouffre. Désescalader."
 china_sar.019.b: "Passez à travers. Émettez un objectif de guerre formel."
 china_sar.020.t: "Ultimatum de Pékin"
 china_sar.020.d: "Pékin a délivré un ultimatum formel exigeant l'acceptation de la réunification sous la République populaire. Le non-respect entraînera une action militaire. Le gouvernement doit décider s'il résiste ou négocie."
 china_sar.020.a: "Rejeter l'ultimatum. Se préparer à la guerre."
 china_sar.020.b: "Accepter les termes. La lutte est terminée."
 china_sar.021.t: "Taïwan rejette la réunification"
 china_sar.021.d: "Taipei a formellement rejeté notre ultimatum. Le gouvernement de Taïwan a déclaré son intention de résister à toute tentative de réunification forcée et mobilise ses forces armées. La voie d'une résolution pacifique est close."
 china_sar.021.a: "Ainsi soit-il. Se préparer à la guerre."
 china_sar.022.t: "Taiwan accepte la réunification"
 china_sar.022.d: "Taipei a accepté les termes de la réunification. La République de Chine sera dissoute et son territoire intégré à la République populaire. Des décennies de division transdétroit touchent à leur fin."
 china_sar.022.a: "La mère patrie est à nouveau entière."
 china_sar.023.t: "Pression diplomatique chinoise"
 china_sar.023.d: "Pékin a formulé une demande formelle de retrait de notre reconnaissance de Taïwan. La Chine offre des incitations économiques en cas de conformité et menace de sanctions en cas de refus. Notre reconnaissance continue de Taipei est devenue une position diplomatique coûteuse."
 china_sar.023.a: "S'y conformer. Retirer la reconnaissance de Taïwan."
 china_sar.023.b: "Refuser. Nous tenons nos engagements."
 china_sar.024.t: "Exercice amphibie dans le détroit"
 china_sar.024.d: "Le corps des marines de l'APL a mené son plus grand exercice de débarquement amphibie dans le détroit de Taïwan, simulant un assaut de plage sur une côte fortifiée. L'exercice, diffusé par les médias d'État, envoie un signal sans équivoque à Taipei comme à Washington."
 china_sar.024.a: "Le monde a pris note."
 china_sar.025.t: "Confrontation sur la liberté de navigation"
 china_sar.025.d: "La marine des États-Unis a envoyé un navire de guerre à travers notre zone de sécurité maritime déclarée près de Taïwan. Le bâtiment diffuse ouvertement sa présence, défiant la marine de l'APL de répondre. Nos forces suivent le navire américain."
 china_sar.025.a: "Autoriser le passage. Évitez une confrontation directe."
 china_sar.025.b: "Suivre et défier le bâtiment américain."
 china_sar.026.t: "Changement de direction aux États-Unis"
 china_sar.026.d: "Un changement à la présidence américaine a modifié le paysage politique de notre stratégie taïwanaise. La position de la nouvelle administration sur les relations transdétroit affectera le niveau de soutien américain à Taipei."
 china_sar.026.a: "Ajuster notre stratégie en conséquence."
 USA_taiwan_defense_category: "Défense de Taïwan"
 CHI_TAI_amphibious_exercise: "Exercice amphibie dans le détroit"
 CHI_TAI_amphibious_exercise_desc: "Ordonner un exercice de débarquement amphibie de grande envergure dans le détroit de Taïwan pour démontrer la capacité militaire et faire pression sur Taipei."
 CHI_TAI_adiz_incursion: "Incursion ADIZ"
 CHI_TAI_adiz_incursion_desc: "Envoyer des chasseurs de l'armée de l'air de l'APL dans la zone d'identification de défense aérienne de Taïwan pour tester les temps de réaction et éroder la confiance de Taipei."
 CHI_TAI_rocket_test: "Test de missile balistique"
 CHI_TAI_rocket_test_desc: "Mener un essai de missile balistique au-dessus du détroit de Taïwan. La réponse dépend du niveau actuel d'engagement américain envers la défense de Taïwan."
 CHI_TAI_grey_zone_ops: "Opérations en zone grise"
 CHI_TAI_grey_zone_ops_desc: "Mener des provocations de bas niveau, notamment des incursions de garde-côtes, des déploiements de flottes de pêche et des sondes de guerre électronique près des eaux taïwanaises."
 CHI_TAI_blockade_simulation: "Exercice de simulation de blocus"
 CHI_TAI_blockade_simulation_desc: "Organiser un exercice naval de grande envergure simulant un blocus complet de Taïwan, testant la logistique et démontrant la capacité de couper les lignes d'approvisionnement de l'île."
 CHI_TAI_cyberattack: "Cyberattaque contre Taïwan"
 CHI_TAI_cyberattack_desc: "Lancer une opération cyber coordonnée visant le réseau électrique, les systèmes financiers et les communications militaires de Taïwan."
 CHI_TAI_shadow_carrier: "Groupe de transporteurs américains fantômes"
 CHI_TAI_shadow_carrier_desc: "Déployer des sous-marins et des bâtiments de surface pour suivre le groupe aéronaval américain opérant près du détroit de Taïwan."
 CHI_TAI_intercept_aircraft: "Intercepter la reconnaissance américaine"
 CHI_TAI_intercept_aircraft_desc: "Faire décoller des chasseurs pour intercepter et suivre agressivement les aéronefs de reconnaissance américains opérant près du détroit."
 CHI_TAI_un_protest: "Protestation à l'ONU contre les ventes d'armes"
 CHI_TAI_un_protest_desc: "Déposer une protestation formelle aux Nations unies contre les ventes d'armes américaines à Taïwan, générant une pression internationale sur Washington."
 CHI_TAI_maritime_zone: "Déclarer une zone de sécurité maritime"
 CHI_TAI_maritime_zone_desc: "Déclarer une zone de sécurité maritime autour des approches clés de Taïwan, établissant un prétexte juridique pour intercepter et inspecter le trafic commercial."
 CHI_TAI_partial_blockade: "Blocus naval partiel"
 CHI_TAI_partial_blockade_desc: "Faire monter la zone de sécurité maritime en blocus naval partiel, restreignant les livraisons de carburant et de matières premières à Taïwan."
 CHI_TAI_full_blockade: "Blocus naval complet"
 CHI_TAI_full_blockade_desc: "Imposer un blocus naval complet autour de Taïwan, coupant tout le commerce maritime et les lignes d'approvisionnement de l'île."
 CHI_TAI_influence_us_election: "Influencer les élections américaines"
 CHI_TAI_influence_us_election_desc: "Déployer des opérations d'influence politique clandestines aux États-Unis pour favoriser les candidats favorables à la position de Pékin sur Taïwan."
 CHI_TAI_support_houthis: "Soutenir les opérations Houthis"
 CHI_TAI_support_houthis_desc: "Fournir un soutien matériel clandestin aux forces houthies au Yémen, créant une crise de sécurité qui détourne les ressources militaires américaines du Pacifique."
 CHI_TAI_arm_iran: "Livraisons d'armes clandestines à l'Iran"
 CHI_TAI_arm_iran_desc: "Canaliser des technologies militaires avancées vers l'Iran via des intermédiaires, accroissant la pression sur les forces américaines au Moyen-Orient."
 CHI_TAI_scs_provocations: "Provocations en mer de Chine méridionale"
 CHI_TAI_scs_provocations_desc: "Affirmer la souveraineté chinoise sur des récifs contestés en mer de Chine méridionale par la militarisation d'îles, le harcèlement des garde-côtes contre les revendicateurs rivaux et l'élargissement des zones de défense aérienne. Ces actions forcent les États-Unis à détourner des moyens navals pour rassurer les partenaires de l'ASEAN."
 CHI_TAI_nk_provocations: "Encourager les provocations nord-coréennes"
 CHI_TAI_nk_provocations_desc: "Signaler à Pyongyang que les essais de missiles et les provocations militaires sur la péninsule coréenne seront tolérés, forçant les États-Unis à redéployer des forces hors du théâtre taïwanais."
 CHI_TAI_middleeast_diversion: "Engagement stratégique au Moyen-Orient"
 CHI_TAI_middleeast_diversion_desc: "Approfondir les partenariats militaires et économiques au Moyen-Orient pour accroître la dépendance régionale vis-à-vis de Pékin tout en détournant l'attention américaine du théâtre indo-pacifique."
 CHI_TAI_support_russia: "Soutenir les opérations russes"
 CHI_TAI_support_russia_desc: "Fournir un soutien économique et logistique aux opérations militaires de la Russie, prolongeant un conflit qui draine l'attention et les ressources américaines."
 CHI_TAI_strait_naval_exercise: "Exercice naval dans le détroit de Taiwan"
 CHI_TAI_strait_naval_exercise_desc: "Mener un exercice naval de grande envergure dans le détroit de Taïwan, pratiquant les opérations d'assaut amphibie et la guerre d'anti-accès. L'exercice améliorera la préparation navale mais provoquera une condamnation internationale."
 CHI_TAI_fund_us_opposition: "Financer le plaidoyer américain en faveur de la Chine"
 CHI_TAI_fund_us_opposition_desc: "Canaliser des ressources via des intermédiaires pour soutenir des groupes politiques, think tanks et médias américains favorables à la position de Pékin sur Taïwan. Une découverte provoquerait un violent retour de bâton."
 CHI_TAI_exploit_us_commitments: "Exploiter la surextension militaire américaine"
 CHI_TAI_exploit_us_commitments_desc: "Tandis que les États-Unis sont engagés dans des opérations militaires à l'étranger, intensifier la pression diplomatique et militaire sur Taïwan. Les forces américaines sont étirées et ne peuvent renforcer crédiblement le Pacifique."
 USA_TAI_send_carrier: "Déployer un porte-avions dans le détroit de Taïwan"
 USA_TAI_send_carrier_desc: "Ordonner à un groupe aéronaval de transiter par le détroit de Taïwan en démonstration de force, signalant l'engagement américain envers la stabilité régionale."
 USA_TAI_recon_flight: "Vol de reconnaissance au-dessus du détroit"
 USA_TAI_recon_flight_desc: "Dépêcher des aéronefs de surveillance pour suivre l'activité de l'APL dans le détroit de Taïwan après des incursions chinoises dans la ZIDA."
 USA_TAI_arm_taiwan: "Paquet d'armes d'urgence pour Taïwan"
 USA_TAI_arm_taiwan_desc: "Approuver un paquet de ventes d'armes d'urgence pour l'armée taïwanaise en réponse aux préparatifs de blocus croissants de la Chine."
 USA_TAI_fon_operation: "Opération de liberté de navigation"
 USA_TAI_fon_operation_desc: "Envoyer un navire de guerre à travers la zone de sécurité maritime déclarée par la Chine pour affirmer la liberté de navigation et contester les prétentions de Pékin."
 USA_TAI_rimpac_exercise: "Exercice naval RIMPAC"
 USA_TAI_rimpac_exercise_desc: "Inviter Taïwan à participer à l'exercice naval annuel Rim of the Pacific, le plus grand exercice maritime international du monde, signalant l'engagement américain envers les partenaires régionaux."
 CHI_SAR_decisions_category: "Stratégie d’une seule Chine"
 CHI_SAR_decisions_category_desc: "\n£GFX_CHI_commission_2\n\n\n\n§YLa stratégie d'une seule Chine§! représente la politique de Pékin visant à consolider tous les territoires revendiqués sous un seul État chinois. Par une combinaison de pression politique, de développement économique et de contrôle administratif, les régions sont progressivement alignées sur le gouvernement central.\n\nCe processus peut suivre des voies différentes. Une §Ysinisation§! accrue renforce le contrôle direct et l'intégration, tandis que des arrangements plus autonomes privilégient la stabilité locale et le potentiel économique au détriment de l'autorité centrale.\n\nL'équilibre entre ces approches déterminera l'unité de long terme de l'État, tandis que la question de §YTaïwan§! reste façonnée par la reconnaissance internationale, le soutien étranger et les tensions transdétroit.\n\n§YRégions administratives spéciales de Chine§!\n$HKG_sinicization$\n$MAC_sinicization$\n$TIB_sinicization$\n$ETK_sinicization$\n$OMG_sinicization$\n\n$CHI_TAI_trust_display$\n$CHI_taiwan_us_support_display$\n$CHI_taiwan_strait_tension_display$\n$CHI_taiwan_recognition_count_display$\n$uighur_threat_display$"
 CHI_pressure_derecognize_TAI: "Faire pression sur [From.GetName] pour qu'il retire sa reconnaissance de Taïwan"
 CHI_pressure_derecognize_TAI_desc: "Pékin mène une campagne diplomatique soutenue pour réduire la reconnaissance internationale de Taïwan. [From.GetName] entretient actuellement des liens formels avec Taipei. Une combinaison d'incitations économiques et de menaces de sanctions peut suffire à induire un changement de position."
 CHI_establish_education_centres: "Établir des centres d'enseignement des compétences professionnelles au Xinjiang"
 CHI_establish_education_centres_desc: ""
 CHI_MON_reunification_retry: "Renouveler l'offre de réunification"
 CHI_MON_reunification_retry_desc: "La Mongolie a rejeté notre proposition précédente. Nous pouvons de nouveau approcher Oulan-Bator une fois les conditions diplomatiques apaisées."
 CHI_han_settlement_small: "Petit programme de réinstallation han"
 CHI_han_settlement_small_desc: "Un modeste programme sponsorisé par l'État relocalise des familles han depuis des provinces intérieures densément peuplées vers de nouvelles communes en Nei Mongol, soutenu par des incitations à l'emploi et des schémas d'attribution de terres."
 CHI_han_settlement_medium: "Programme intermédiaire de réinstallation han"
 CHI_han_settlement_medium_desc: "Un effort de réinstallation organisé plus large déplace des dizaines de milliers de travailleurs han et leurs familles en Nei Mongol. De nouvelles zones industrielles et parcelles agricoles sont désignées pour absorber la population entrante."
 CHI_han_settlement_large: "Programme massif de réinstallation han"
 CHI_han_settlement_large_desc: "Une campagne d'ingénierie démographique à grande échelle transfère des centaines de milliers de colons han en Nei Mongol en une seule vague coordonnée. L'impact à long terme sur la composition ethnique de la région est substantiel, bien que la résistance locale s'élève fortement à court terme."
 CHI_TAI_media_infiltration: "Infiltration des réseaux médiatiques"
 CHI_TAI_media_infiltration_desc: "Financer et étendre les réseaux de propriété médiatique et d'influence éditoriale pro-Pékin à Taïwan. Cultiver un environnement informationnel plus amical pour l'engagement transdétroit."
 CHI_TAI_business_council_funding: "Financement du conseil des affaires transdétroit"
 CHI_TAI_business_council_funding_desc: "Fournir un soutien financier aux associations d'affaires alignées sur le KMT et aux chambres de commerce transdétroit. Renforcer la constituency pro-engagement au sein de l'élite économique taïwanaise."
 CHI_TAI_cultural_exchange_program: "Programme d'échanges culturels transdétroit"
 CHI_TAI_cultural_exchange_program_desc: "Parrainer des échanges académiques, des festivals culturels et des programmes de dialogue jeunesse à travers le détroit. Bâtir des liens de peuple à peuple qui assouplissent la résistance politique à des relations plus étroites."
 CHI_TAI_cross_strait_infrastructure_investment: "Investissement d'infrastructures transdétroit"
 CHI_TAI_cross_strait_infrastructure_investment_desc: "Canaliser des capitaux continentaux vers des projets d'infrastructure à Taïwan, présentant l'investissement chinois comme une source d'opportunité économique et approfondissant l'interdépendance matérielle entre les deux économies."
 CHI_45g_national_deployment_idea: "Initiative nationale de déploiement de la 5G"
 CHI_45g_national_deployment_idea_desc: "Déploiement accéléré des infrastructures de réseau 5G à travers le pays, avec coordination étatique de l'investissement en capital dans les stations de base, les équipements de réseau cœur et l'attribution du spectre. L'initiative privilégie la couverture des industries stratégiques et des infrastructures critiques."
 CHI_avic_innovation_idea: "Développement aéronautique d'AVIC"
 CHI_avic_innovation_idea_desc: "La Aviation Industry Corporation of China pousse les capacités indigènes de conception et de production d'aéronefs, faisant avancer les programmes de chasseurs et de transport sans dépendance à la technologie et aux licences étrangères."
 CHI_big_fund_phase_1_idea: "Fonds national de l'industrie des semi-conducteurs"
 CHI_big_fund_phase_1_idea_desc: "Réponse stratégique de la Chine à l'autosuffisance en semi-conducteurs, le Grand fonds mobilise le capital d'État pour développer une capacité indigène de fabrication, de conception et de production d'équipements. L'initiative met l'accent sur la réduction de la dépendance aux fonderies et outils EDA étrangers."
 CHI_caic_innovation_idea: "Développement d'hélicoptères d'attaque de CAIC"
 CHI_caic_innovation_idea_desc: "Le conglomérat aérospatial chinois fait avancer la technologie des hélicoptères d'attaque par le développement et la production de plateformes giravion indigènes conçues pour un déploiement rapide et des opérations soutenues."
 CHI_casc_innovation_idea: "Programmes spatiaux et satellitaires CASC"
 CHI_casc_innovation_idea_desc: "China Aerospace Science and Technology Corporation élargit les capacités de lancement spatial, de communications satellitaires et d'observation de la Terre, cimentant le rôle de la Chine comme grande puissance spatiale indépendante des restrictions d'accès étrangères."
 CHI_casic_innovation_idea: "Développement de missiles et de contre-mesures CASIC"
 CHI_casic_innovation_idea_desc: "China Aerospace Science and Industry Corporation fait avancer les systèmes de missiles de croisière, de missiles balistiques et de défense aérienne par une R&D soutenue en propulsion, guidage et guerre électronique."
 CHI_cetc_innovation_idea: "Développement informatique et IA CETC"
 CHI_cetc_innovation_idea_desc: "China Electronics Technology Group investit dans le calcul haute performance, la conception de semi-conducteurs et les plateformes d'intelligence artificielle pour réduire la dépendance technologique et accélérer l'innovation intérieure dans les technologies habilitantes critiques."
 CHI_crrc_innovation_idea: "Fabrication industrielle de CRRC"
 CHI_crrc_innovation_idea_desc: "Le constructeur ferroviaire et de transit chinois se diversifie vers des secteurs industriels plus larges, s'appuyant sur des décennies d'expertise de chaîne d'approvisionnement en métallurgie, manufacture de précision et intégration de systèmes."
 CHI_csgc_innovation_idea: "Développement de VBC de CSGC"
 CHI_csgc_innovation_idea_desc: "Le constructeur d'État chinois de véhicules blindés développe des plateformes de nouvelle génération de chars, véhicules de combat d'infanterie et véhicules de soutien, intégrant blindage avancé, puissance de feu et mobilité."
 CHI_csic_innovation_idea: "Développement de sous-marins de CSIC"
 CHI_csic_innovation_idea_desc: "China State Shipbuilding Industrial Corporation fait avancer la conception et la production de sous-marins, en mettant l'accent sur les matériaux de coque, la furtivité acoustique et les systèmes de capteurs avancés pour des opérations sous-marines prolongées."
 CHI_cssc_innovation_idea: "Développement de bâtiments de surface de CSSC"
 CHI_cssc_innovation_idea_desc: "Le principal constructeur naval chinois se concentre sur des conceptions avancées de destroyers, frégates et corvettes avec des systèmes de combat intégrés, étendant les capacités océaniques de la Chine sur les routes maritimes stratégiques."
 CHI_failed_five_year_plan: "Plan quinquennal en échec"
 CHI_failed_five_year_plan_desc: "Des résultats décevants du dernier cycle de planification quinquennale ont forcé une réévaluation des priorités et de l'allocation des ressources. La confiance publique dans les objectifs de développement à long terme a souffert, exigeant des corrections de politique immédiates."
 CHI_haig_innovation_idea: "Développement du Harbin Aircraft Industry Group"
 CHI_haig_innovation_idea_desc: "Le secteur aéronautique de Harbin élargit les capacités giravion, développant des hélicoptères de transport et des plateformes d'attaque qui réduisent la dépendance aux conceptions et licences étrangères."
 CHI_inner_mongolia_innovation_idea: "Développement des blindés de Mongolie-Intérieure"
 CHI_inner_mongolia_innovation_idea_desc: "La base intégrée de production de blindés de Mongolie-Intérieure fait avancer le développement de chars de combat principaux et de véhicules blindés, s'appuyant sur des siècles d'expertise métallurgique et des techniques de manufacture modernes."
 CHI_jap_strategic_isolation: "Isolement stratégique japonais"
 CHI_jap_strategic_isolation_desc: "Notre levier économique et notre positionnement diplomatique régional marginalisent de plus en plus l'influence stratégique du Japon en Asie de l'Est. Tokyo fait face à une inflation des biens de consommation, des marchés d'export réduits et le poids psychologique de l'irrelevance stratégique."
 CHI_kor_g2_economic_platform: "Cadre économique G2 Chine-Corée"
 CHI_kor_g2_economic_platform_desc: "Établissement de mécanismes de coordination économique bilatérale entre la Chine et la Corée, couvrant la politique commerciale, les flux d'investissement et les partenariats technologiques. L'arrangement positionne les deux nations comme co-gestionnaires de la prospérité est-asiatique."
 CHI_kor_trilateral_opening: "Ouverture trilatérale en Corée"
 CHI_kor_trilateral_opening_desc: "Ouverture diplomatique vers la Corée du Nord par des consultations de haut niveau et un engagement économique limité, signalant la volonté de la Chine de faciliter le dialogue et de fournir un soutien matériel à une réforme contrôlée."
 CHI_made_in_china_2025_idea: "Fabriqué en Chine 2025"
 CHI_made_in_china_2025_idea_desc: "Une initiative de politique industrielle sur une décennie ciblant la manufacture high-tech dans les semi-conducteurs, les composites avancés, la robotique et le transit ferroviaire. Le programme vise à faire passer la Chine de l'usine du monde à l'innovateur du monde."
 CHI_nko_final_transition: "Transition finale de la Corée du Nord"
 CHI_nko_final_transition_desc: "L'étape finale de la transformation de la Corée du Nord représente le aboutissement de l'influence et de l'alignement chinois. Pyongyang devient fonctionnellement intégré à la sphère chinoise avec une indépendance nominale minimale."
 CHI_nko_managed_reform_pilot: "Pilote de réforme encadrée en Corée du Nord"
 CHI_nko_managed_reform_pilot_desc: "La Chine parraine une libéralisation économique limitée en Corée du Nord via des zones économiques spéciales et des mécanismes de marché contrôlés. Le pilote teste si Pyongyang peut réformer sans déstabiliser le contrôle du régime."
 CHI_norinco_innovation_idea: "Développement d'armements de NORINCO"
 CHI_norinco_innovation_idea_desc: "China North Industries Corporation accélère la modernisation des armes d'infanterie, des systèmes d'artillerie et des plateformes de blindage léger. Le portefeuille d'export de NORINCO s'étend aux armées ayant un accès limité aux fournisseurs occidentaux."
 CHI_phi_abandonment_doctrine: "Doctrine d'abandon des Philippines"
 CHI_phi_abandonment_doctrine_desc: "Culture délibérée de la dépendance économique philippine et de l'éloignement diplomatique vis-à-vis de son partenaire de sécurité traditionnel, laissant Manille isolée et vulnérable à la pression chinoise."
 CHI_poly_innovation_idea: "Développement militaro-industriel Poly Technologies"
 CHI_poly_innovation_idea_desc: "Le portefeuille militaro-industriel diversifié de Polytech s'étend aux secteurs de défense émergents, s'appuyant sur le soutien de l'État et l'accès aux institutions de recherche à travers l'appareil de défense."
 CHI_sac_innovation_idea: "Développement d'avions de chasse de SAC"
 CHI_sac_innovation_idea_desc: "Shenyang Aircraft Corporation fait avancer la conception et la production de chasseurs, développant des plateformes indigènes qui réduisent la dépendance aux moteurs russes et à la technologie radar AESA."
 CHI_shadow_banking_cleanup_idea: "Nettoyage du secteur bancaire parallèle"
 CHI_shadow_banking_cleanup_idea_desc: "La répression réglementaire des produits de trust non régulés, du prêt pair-à-pair et du financement hors bilan retire des risques systémiques du système financier. La contraction du crédit à court terme est compensée par une confiance réglementaire améliorée."
 CHI_south_china_sea_dominance_window: "Fenêtre de domination de la mer de Chine méridionale"
 CHI_south_china_sea_dominance_window_desc: "Une fenêtre stratégique s'est ouverte pour consolider le contrôle de la mer de Chine méridionale par la présence navale, l'expansion de la flotte de pêche civile et la construction d'installations militaires sur des îles gagnées sur la mer. La fenêtre peut se refermer si les puissances régionales se coordonnent pour contester l'expansion chinoise."
 CHI_ztz99_rollout_idea: "Déploiement du char de combat principal Type 99"
 CHI_ztz99_rollout_idea_desc: "Production et déploiement à grande échelle du char de combat principal Type 99 à travers la force terrestre de l'APL, offrant un meilleur blindage, une meilleure puissance de feu et une meilleure mobilité que les plateformes antérieures."
 ETK_security_reinforcement_idea: "Renforcement des forces de sécurité"
 ETK_security_reinforcement_idea_desc: "Expansion des forces de sécurité et durcissement des infrastructures contre les attentats terroristes, avec un coût économique modeste compensé par des libertés civiles réduites et une surveillance accrue."
 ETK_surveillance_state_idea: "Mesures de surveillance de l'État"
 ETK_surveillance_state_idea_desc: "Expansion exhaustive des systèmes de surveillance, des réseaux de points de contrôle et du recueil de renseignement à travers la société. Les gains d'efficacité économique d'un meilleur contrôle social sont compensés par une innovation réduite et un moindre engagement citoyen."
 ETK_terrorism_aftermath: "Conséquences du terrorisme"
 ETK_terrorism_aftermath_desc: "Les préoccupations de sécurité persistantes et le traumatisme social des récents attentats terroristes continuent de perturber l'activité économique et la confiance publique. Le rétablissement exige du temps et une restauration effective de la sécurité."
 TAI_civil_defense_readiness: "Préparation de la défense civile"
 TAI_civil_defense_readiness_desc: "Mobilisation de la population pour des tâches de défense aérienne, avec formation à l'abri, aux soins des blessés et au contrôle des dégâts. La défense contre les menaces aériennes s'améliore au prix d'une qualité de vie réduite et d'une perturbation économique."
 CHI_bri_pacific_engagement_tt: "$CHI_bri_pacific_engagement$ : $RIGHT|+=1$"
 CHI_Asset_Seizure_tt: "§YActif saisi :§! §G+25§! trésorerie, §G+3§! $CHI_bri_global_presence$\nLa dette en cours diminue du coût d'un projet"
 chi_bri.16.a: "Nous gérerons les conséquences"
 chi_bri.16.d: "Le ministère des Finances a confirmé ce que les comptes montraient déjà : nous ne pouvons pas honorer le paiement de ce mois sur nos obligations des Nouvelles routes de la soie. Pékin sera informé d'ici quelques jours. Tant que les arriérés ne sont pas réglés, notre créancier est en droit d'agir, et les options qui s'offrent à lui ne sont pas toutes douces."
 chi_bri.16.t: "Paiement des Nouvelles routes de la soie manqué"
 chi_bri.17.a: "Signer la concession"
 chi_bri.17.b: "Les gisements ne sont pas à vendre"
 chi_bri.17.d: "Une délégation chinoise est arrivée avec une proposition qui n'en est pas vraiment une. En échange de la réduction de notre dette en défaut des Nouvelles routes de la soie du coût d'un projet, Pékin veut des droits d'extraction et d'exportation à long terme sur nos gisements minéraux. Une partie de la dette disparaîtrait des livres. De même, en grande partie, le contrôle du sol sous nos pieds."
 chi_bri.17.t: "Pékin exige des droits sur les ressources"
 chi_bri.18.a: "Il reste d’autres instruments"
 chi_bri.18.d: "[FROM.GetName] a rejeté net nos conditions de concession sur les ressources. Leur dette demeure, leur défaut demeure, et notre délégation est rentrée à Pékin les mains vides. La question est désormais d'attendre, ou de recouvrer ce qui nous est dû par d'autres moyens."
 chi_bri.18.t: "[FROM.GetName] refuse nos conditions"
 chi_bri.19.a: "Peser nos options"
 chi_bri.19.d: "[FROM.GetName] a manqué un paiement sur ses obligations des Nouvelles routes de la soie. La somme n'est pas grande aux échelles de l'initiative, mais le précédent compte : chaque autre emprunteur observe comment Pékin répond. Nous pouvons restructurer la dette, exiger des droits sur les ressources, ou saisir ce que nous avons financé."
 chi_bri.19.t: "[FROM.GetName] fait défaut sur la dette des Nouvelles routes de la soie"
 chi_bri.23.a: "La construction est ce qui compte"
 chi_bri.23.d: "Notre Trésor n'a pas pu couvrir notre part du §Y[GetBRIProjectName]§!, aussi Pékin a étendu un crédit pour combler l'écart. La construction avance de toute façon. La dette est désormais sur nos livres, elle produit des intérêts, et si nous ne pouvons pas la servir les termes donnent à la Chine une latitude considérable."
 chi_bri.23.t: "Projet des Nouvelles routes de la soie financé à crédit"
 CHI_BRI_automation_disable_tt: "Les candidatures aux Nouvelles routes de la soie doivent être §Yexaminées individuellement§!"
 CHI_BRI_automation_enable_tt: "Les candidatures aux Nouvelles routes de la soie sont §Gacceptées automatiquement§!"
 CHI_bri_buy_back_concession: "Racheter la concession"
 CHI_bri_buy_back_concession_desc: "Racheter notre sortie des droits d'extraction et d'exportation cédés aux firmes chinoises. Coûteux, et Pékin n'encaissera pas la perte de bon gré, mais cela rend les gisements au contrôle national."
 CHI_bri_can_host_energy: "Nous contrôlons un État avec un complexe industriel à alimenter"
 CHI_bri_can_host_mine: "Nous contrôlons un État avec des gisements minéraux intéressants"
 CHI_bri_can_host_pipeline: "Nous contrôlons un État avec des gisements intéressants de pétrole, d'acier ou de métaux précieux"
 CHI_bri_can_host_port: "Nous contrôlons un État côtier qui pourrait accueillir le port"
 CHI_bri_can_host_prestige: "Nous contrôlons notre capitale"
 CHI_bri_can_host_rail: "Nous contrôlons un État qui pourrait accueillir le chemin de fer"
 CHI_bri_can_host_sez: "Nous contrôlons un État côtier ou bien connecté qui pourrait accueillir la zone"
 CHI_bri_can_host_telecom: "Nous contrôlons un État qui pourrait accueillir le réseau"
 CHI_bri_can_request: "La Chine accepte les candidatures aux Nouvelles routes de la soie et a un créneau de projet libre"
 CHI_bri_clear_loan_tt: "Leur dette en cours des Nouvelles routes de la soie est §Gannulée§!"
 CHI_bri_has_reclaimable_structure: "Ils détiennent un projet des Nouvelles routes de la soie que nous pourrions prendre"
 CHI_bri_monthly_income_base: "Contribution mensuelle de base de la BRI"
 CHI_bri_monthly_income_base_desc: "La part du budget d'État versée chaque mois au fonds des Nouvelles routes de la soie par les focales et décisions, avant les bonus ministériels."
 CHI_bri_monthly_income_total: "Contribution mensuelle BRI"
 CHI_bri_monthly_income_total_desc: "Le total versé chaque mois au fonds des Nouvelles routes de la soie : la base engagée plus d'éventuels bonus ministériels."
 CHI_bri_refuse_concession_tt: "Nous §Rconservons la dette§! et restons en défaut"
 CHI_bri_returns_multiplier_base: "Multiplicateur de retours BRI"
 CHI_bri_returns_multiplier_base_desc: "Bonus appliqué au rendement des investissements internationaux que la Chine comptabilise sur chaque projet des Nouvelles routes de la soie achevé."
 CHI_bri_unlock_tt: "§YNouvelles routes de la soie :§! §G6§! créneaux de projet, §G40§! par projet, §G+8§! de contribution mensuelle, §G+4§! d'investissements internationaux par projet achevé"
 CHI_Write_Off_Debts_tt: "La dette des Nouvelles routes de la soie de chaque partenaire éligible est §Gannulée§! en totalité"
 CHI_bri_forum_surge: "Afflux du Forum des Nouvelles routes de la soie"
 CHI_bri_forum_surge_desc: "Les engagements signés au forum triennal permettent à Pékin de porter deux projets de plus à la fois pendant les trois prochaines années. Avec davantage de créneaux ouverts, davantage d'États partenaires peuvent construire à tout moment."
 CHI_bri_partner_1: "Participant à la BRI"
 CHI_bri_partner_1_desc: "Un premier projet des Nouvelles routes de la soie a commencé. Les équipes de construction chinoises accélèrent les travaux nationaux et prêtent de la crédibilité à l'agenda de développement du gouvernement."
 CHI_bri_partner_2: "Partenaire de la BRI"
 CHI_bri_partner_2_desc: "Un second projet des Nouvelles routes de la soie a été livré. L'ingénierie et le financement d'infrastructure chinois deviennent une part visible du programme national de développement."
 CHI_bri_partner_3: "Partenaire stratégique BRI"
 CHI_bri_partner_3_desc: "Plusieurs projets des Nouvelles routes de la soie sont désormais actifs dans le pays. Entrepreneurs chinois, lignes de crédit et appui politique renforcent la capacité de l'État, et Pékin attend en retour un alignement diplomatique."
 CHI_bri_partner_4: "État d’ancrage de la BRI"
 CHI_bri_partner_4_desc: "L'investissement des Nouvelles routes de la soie sous-tend l'économie nationale. Le capital chinois finance construction et approvisionnement de consommation, et la dépendance est désormais difficile à dénouer sans grave perturbation."
 CHI_bri_partner_5: "Partenaire clé de la BRI"
 CHI_bri_partner_5_desc: "Le pays est un pilier des Nouvelles routes de la soie. Normes, entrepreneurs et financement chinois sont enchâssés dans chaque grand corridor, et la politique économique se fixe en ayant Pékin à l'esprit."
 CHI_bri_presence_modifier: "Présence mondiale de la BRI"
 CHI_bri_presence_modifier_desc: "Le standing que la Chine tire de son réseau des Nouvelles routes de la soie. Il croît avec le nombre d'États partenaires et avec la profondeur de l'ancrage de chacun."
 CHI_bri_presence_modifier_tt: "Évolue avec §Y$CHI_bri_global_presence$§! : le rang combiné de chaque partenaire des Nouvelles routes de la soie. La demande de biens de consommation baisse jusqu'à §G7,5 %§! à 200 de présence."
 CHI_bri_claim_resource_rights: "Réclamer les droits sur les ressources"
 CHI_bri_claim_resource_rights_desc: "Prendre un paiement en nature. Le débiteur cède des droits d'extraction et d'exportation à long terme, réduisant sa dette d'un coût de projet tout en cédant le contrôle de sa base de ressources. Disponible uniquement sur la voie du prêt prédateur."
 CHI_bri_project_mission: "Construction des Nouvelles routes de la soie"
 CHI_bri_project_mission_desc: "Entrepreneurs et financement chinois sont à l'œuvre sur le §Y[GetBRIProjectName]§!. À la livraison nous en gagnons les bénéfices, le rang de notre partenaire s'élève, et Pékin encaisse son retour."
 CHI_bri_raise_contribution: "Augmenter le financement des Nouvelles routes de la soie"
 CHI_bri_raise_contribution_desc: "Engager une part plus large du budget d'État au fonds des Nouvelles routes de la soie chaque mois. La trésorerie paie la construction d'avance et n'est jamais réapprovisionnée par les retours de projets, donc la faire croître est le seul moyen de continuer à construire."
 CHI_bri_raise_contribution_tt: "§Y$CHI_bri_monthly_income$§! : jusqu'à §G+4§! par mois (maximum §Y30§!)"
 CHI_bri_resource_concession_idea: "Concession de ressources chinoises"
 CHI_bri_resource_concession_idea_desc: "Une partie d'un prêt des Nouvelles routes de la soie en défaut a été réglée en cédant des droits d'extraction et d'exportation. Des firmes chinoises exploitent les gisements, et les recettes quittent le pays avant même d'être taxées. La concession court jusqu'à son rachat."
 CHI_BRI_project_missions: "Projets des Nouvelles routes de la soie"
 CHI_BRI_project_missions_desc: "Projets des Nouvelles routes de la soie actuellement en construction dans notre pays, financés et bâtis par des entrepreneurs chinois."
 CHI_BRI_automation_disable: "Désactiver l'automatisation BRI"
 CHI_BRI_automation_disable_desc: "Revenir à un processus d'examen manuel des candidatures de projets des Nouvelles routes de la soie. Chaque candidature arrivera comme un événement pour que la Chine l'examine et l'approuve ou la rejette individuellement. Les candidatures déjà en attente d'examen conservent le processus sous lequel elles ont été ouvertes."
 CHI_BRI_automation_enable: "Activer l'automatisation BRI"
 CHI_BRI_automation_enable_desc: "Approuver automatiquement les candidatures des Nouvelles routes de la soie au lieu d'examiner chacune. Les candidats sont déjà filtrés pour l'éligibilité et un créneau de projet libre avant de pouvoir postuler, donc l'automatisation saute simplement la paperasse. Les candidatures déjà en attente d'examen conservent le processus sous lequel elles ont été ouvertes."
 CHI_bri_committed_projects: "Projets engagés par la BRI"
 CHI_bri_committed_projects_desc: "Projets BRI actifs plus les demandes en attente d'examen. Chaque demande en cours réserve un emplacement de projet."
 CHI_MAC_gambling_diversification: "Diversification de l'industrie du jeu"
 CHI_MAC_gambling_diversification_desc: "Pendant des décennies, la prospérité de Macao a reposé sur un seul pilier : le tapis du casino. Un virage délibéré vers les services numériques, le e-commerce et les infrastructures technologiques élargit l'assiette fiscale au-delà des tables de jeu, amortissant la RAS contre les à-coups des recettes touristiques tout en semant une économie internet indigène."
