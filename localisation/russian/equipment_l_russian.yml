 CZE_Anti_tank_1: "PTŘS-12 Volant"
 CZE_Anti_tank_1_desc: "Первая чехословацкая противотанковая управляемая ракета. Использует ручное командное наведение (MCLOS) и пробивает до 400 мм брони на дальности 3 км при скорости 130 м/с. Низкая скорость выбрана намеренно — она даёт более точное наведение и больше времени на реакцию до попадания."
 CZE_Anti_tank_2: "RPTZ-84"
 CZE_Anti_tank_2_desc: "Противотанковая управляемая ракета производства республики. Использует наведение SACLOS и пробивает броню до 400 метров на дальности 3 км при скорости 350 м/с. Она стала ответом на последние достижения в бронировании техники врагов государства."
 CZE_Anti_tank_3: "RPTZ-96"
 CZE_Anti_tank_3_desc: "Raketová Protitanková Zbraň 96 расшифровывается как «реактивное противотанковое оружие, тип 96». Первый прототип собственной чешской разработки F&F («выстрелил и забыл»). В итоге проект дал оружие, способное переключаться между довольно ненадёжным программным режимом «выстрелил и забыл», который порой путал дом с самоходным орудием, и очень точной системой SACLOS."
 CZE_Anti_tank_4: "PTŘS-101"
 CZE_Anti_tank_4_desc: "Расшифровывается как ПТРК-101. Первая надёжная конструкция F&F — всего 5 прототипов после первого! В ней также используются лидирующие ракеты для противодействия новой угрозе — комплексам активной защиты. Однако идея отличается от зарубежных разработок: первая выпущенная боевая часть всё равно начинена взрывчаткой, чтобы осколками поражать внешнее оборудование танка и датчики на крыше башни, а за ней следует вторая — тандемная бронебойная боевая часть."
 CZE_Anti_Air_0: "PLŘS-KD vz. 2 Střela"
 CZE_Anti_Air_0_desc: "Второе поколение ракет класса «земля-воздух». У них небольшая дальность полёта — 10 км. Название Střela означает «ракета». Vz. 2 — ракета с инфракрасной головкой самонаведения, которую легко увести с цели, но, с другой стороны, она показала высокую надёжность при стрельбах по мишеням на полигоне."
 CZE_Anti_Air_0_variant: "Střela-2M1"
 CZE_Anti_Air_1: "PLŘS-MD vz. 3 Rychlík"
 CZE_Anti_Air_1_desc: "Зенитная ракета средней дальности второго поколения производства наших предприятий. Она входит в семейство ракет второго поколения: vz.2 малой дальности, vz.3 средней дальности и vz.4 большой дальности. Это ракета с полуактивным радиолокационным наведением, летящая со скоростью 2 Маха, с большой осколочной боевой частью, предназначенная против ударных истребителей, летящих строем, — в надежде, что они не обнаружили ракету заранее."
 CZE_Anti_Air_2: "PLŘS-SD vz. 5 Jehla"
 CZE_Anti_Air_2_desc: "3-е поколение ракет класса «земля-воздух». Это ракета малой дальности, управляемая активной радиолокационной головкой самонаведения. Частью семейства 3-го поколения являются также vz. 6 AMRSAM, vz. 7 LRSAM и vz. 8 ALRSAM. Ракета может выдерживать перегрузки до 16G и достигать скорости 2 Маха при стрельбе из стационарного положения. Были изготовлены варианты для самолётов, способные уничтожать цели на расстоянии 30 км, разгоняясь до 3,5 Маха."
 CZE_Anti_Air_3: "PLŘŠ-KD vz. 13 Hroznýš"
 CZE_Anti_Air_3_desc: "5-е поколение чешского ЗРК малой дальности. Конструкция имеет пассивный радар и инфракрасную ОЭС, подверженную помехам из-за отсутствия внешней связи. Наведение на конечном участке может использовать большую часть подъемного корпуса ракеты, чтобы выдерживать перегрузки до 14G на скорости 3 Маха, хотя ракета способна разогнаться до 4-4,5 Маха, при запуске с высоты 5 км. Ракета, благодаря бортовому компьютеру, определяет скорость цели и способна замедляться, чтобы задать лучший радиус разворота. Дальность полета - 150 км от самолета."
 CZE_Anti_Air_4: "PLŘS-MD vz. 25 Zmije"
 CZE_Anti_Air_4_desc: "Ракеты используют новейшие технологии и оборудование, чтобы поражать даже самые незаметные самолеты наших противников. Включает в себя спутниковую связь, которая направляет ракету на любой самолет-невидимку, потому что даже самолет-невидимка не является невидимкой в видимом спектре."
 CZE_MBT_1: "T-54AR Řeka"
 CZE_MBT_1_desc: "Чешский танк, созданный на базе Т-55 советского производства. Танк был капитально переработан — от шасси до последней части программного обеспечения, что улучшило его потенциал в геометрической прогрессии. Новая система управления огнём под названием «Kladivo» в шесть раз повысила точность стрельбы танка. Благодаря этому танк всё ещё может быть сопоставим с более новыми типами."
 CZE_MBT_2: "T-72M1"
 CZE_MBT_2_desc: "Вторая программа модернизации на Т-72 - совершенствование его систем стабилизации и управления огнем. Танк также получил новую пушку и дополнительные слои брони."
 CZE_MBT_3: "T-72M4 CZ Moderna"
 CZE_MBT_3_short: "T-72M4CZ"
 CZE_MBT_3_desc: "Пятая чешская модернизация Т-72М1 позволила довести танк до новейших стандартов в боевой обстановке, улучшив всё программное и аппаратное обеспечение и добавив новые типы динамической защиты DYNA. Танк находится на пределе возможностей Т-72."
 CZE_MBT_4: "T-8 Ohař"
 CZE_MBT_4_desc: "Танк на базе нового шасси, разработанного компанией VOP Nový Jičín. Он имеет новую композитную броню с элементами динамической защиты и новую инновационную внутреннюю компоновку: кабина экипажа размещена в корпусе, а автомат заряжания — в башне. Танк также оснащён автоматической коробкой передач, новыми датчиками лазерного облучения и пусков ПТУР, а также новыми вспомогательными силовыми установками."
 CZE_MBT_5: "T-15 Otakar"
 CZE_MBT_5_desc: "Шаг вперёд от прошлых технологий благодаря новому боевому опыту наших танковых экипажей, этот танк имеет множество небольших улучшений внутри своего уменьшенного шасси, предложенных опытными экипажами. Танк управляется всего двумя солдатами, выполняющими функции водителя-командира и наводчика-заряжающего. В танке установлена внутренняя и внешняя система связи, что исключает необходимость в радистах и другом экипаже. На башне установлена система активной защиты чешского происхождения под названием Deštník с радиусом покрытия 360°."
 CZE_MBT_7: "T-25 Oskar"
 CZE_MBT_7_desc: "Броневая компоновка танка улучшена благодаря модульной системе брони. Без брони, которая устанавливается после разгрузки, танк можно перебрасывать очень быстро. Эта система также облегчает техническое обслуживание и ремонт. Танк оснащён новым комплексом активной защиты под названием Štít в сдвоенной конфигурации для борьбы с тандемными и простыми боеголовками. Он способен уничтожить до 3 подлетающих ракет, если между ними есть хотя бы 0,5 секунды, или 2 одновременно."
 CZE_MBT_8: "T-35 Orel"
 CZE_MBT_8_desc: "Опираясь на опыт серии Т-25/Т-35 и модернизаций Т-72, Т-35 Orel спроектирован как уникальное изделие чешской промышленности, возродившейся из пепла после расцвета, пережитого перед Второй мировой войной. Танк, собранный из деталей, электрической брони и других модульных компонентов, таких как четырёхканальный APS, способен справиться с любой угрозой. В башне установлено оружие направленной энергии, использующее реактор танка для нагрева впрыскиваемой плазмы и её разгона в сторону вражеского танка. Реактор также снабжает танк необходимой энергией."
 CZE_APC_1: "OT-64 Skot"
 CZE_APC_1_desc: "Obrněný Transportér 64 или Бронетранспортер 64 способен принять в бой 20 солдат, включая 2 члена экипажа, и опционально вооружен крупнокалиберным пулеметом. Версии без пулемета имеют больше места для личного оружия и грузового пространства для боеприпасов."
 CZE_APC_2: "OT-90"
 CZE_APC_2_desc: "OT-90 — преемник OT-64: он доставляет людей в бой под защитой своей брони и вооружён автоматической пушкой или крупнокалиберным пулемётом. Он был создан на базе шасси BVP-1 путём переоборудования корпуса и замены башни на меньшую либо её снятия."
 CZE_APC_3: "OT-90M"
 CZE_APC_3_desc: "Старение OT-90 привело ко 2-й программе модернизации. Машина снова была фактически перестроена с нуля. Вооружение заменили нашим новейшим крупнокалиберным пулемётом, а механические части машины — новыми, более лёгкими. Тяжёлое радиооборудование также заменили современными компьютерами, что сделало машину быстрее как на дороге, так и по бездорожью."
 CZE_APC_4: "OT-105 Housenka"
 CZE_APC_4_desc: "Унифицированная система вооружения Housenka использует одно шасси во многих вариантах, чтобы удовлетворить все потребности армии. Она используется как зенитная ракетная артиллерия или носитель ПТУР. В варианте БТР она оснащена одним дистанционно управляемым крупнокалиберным пулемётом и 16 пассажирскими местами."
 CZE_APC_5: "OT-105M2"
 CZE_APC_5_desc: "Модернизация Housenka была признана необходимой, чтобы машина сохранила свою ценность в постоянно меняющемся мире. Крупнокалиберный пулемёт заменили более новым, способным использовать боеприпасы с дистанционным взрывателем. Программное обеспечение машины обновили до версии 4.5, в которой появилось множество изменений, а также возможность использовать дистанционный взрыватель для поражения противника за стенами и укрытиями."
 CZE_APC_6: "OT-121 Topas"
 CZE_APC_6_desc: "Преемник Housenka UWS, UWS Topas использует модульную броню и детали. Версия БТР имеет броневой пакет А с самой низкой защитой, но всё же достаточной, чтобы её не пробивали различные РПГ и лёгкие ПТУР. Броня была усилена композитными элементами, а также решётчатым экраном вокруг машины."
 CZE_APC_7: "OT-133 Vávřín"
 CZE_APC_7_desc: "UWS Vavřín использует новейшие системы активной защиты для обеспечения безопасности экипажа и десанта. Машина также оснащена теплоизоляцией, снижающей её инфракрасную заметность. Гибридный двигатель может работать на обычном топливе или биомассе, что позволяет ей долго обходиться без пополнения запасов, если скармливать ей немного (читай: ОЧЕНЬ МНОГО) деревьев."
 CZE_APC_8: "OT-136 Leknín"
 CZE_APC_8_desc: "UWS Leknín является преемником UWS Vavřín. Он оснащён постановщиками помех, твердотельным лазерным оружием направленной энергии в качестве основного наступательного и оборонительного вооружения, а также противопехотным крупнокалиберным пулемётом. Лазер способен поражать быстро летящие ПТУР, выводя из строя их систему наведения или создавая ей помехи. На случай отказа лазера машина оснащена двумя КАЗ Štít, по одному с каждой стороны. Впрочем, от танкового снаряда это машину не защитит."
 CZE_IFV_1: "BVP-1"
 CZE_IFV_1_desc: "BVP расшифровывается как Bojové vozidlo pěchoty, Бронированная боевая машина пехоты (AIFV). Она используется в основном для транспортировки войск, а иногда и в наступательных операциях для развертывания войск и поддержки их своими автоматическими пушками против легкобронированных целей или с противопехотными боеприпасами. Перевозит 8 пассажиров."
 CZE_IFV_2: "BVP-1K"
 CZE_IFV_2_desc: "Модернизация BVP-1, вооружённая ПТУР и оснащённая новыми средствами связи и вычислительными устройствами. Машина также получила новое лёгкое радио- и коммуникационное оборудование и новый двигатель."
 CZE_IFV_3: "BVP-2"
 CZE_IFV_3_desc: "Новое шасси, новая автоматическая пушка, новые ПТУР. BVP-2 также имеет более прочную броню и более совершенную электронику. Серьёзный шаг вперёд по сравнению с BVP-1. Перевозит 3 пассажира и 3 члена экипажа."
 CZE_IFV_4: "BVP Sněžka"
 CZE_IFV_4_desc: "BVP Sněžka это сильно модифицированный BVP-2 с новейшей электроникой и технологиями."
 CZE_IFV_5: "KBVP Pandur II"
 CZE_IFV_5_desc: "Pandur II, купленный в Австрии и разобранный в Чехии. Затем эта единая система вооружения была разработана с нуля и запущена в производство; она включает носители ПТУР, машины связи, командно-штабные машины, БТР, БМП и другие боевые бронированные машины. Использует ПТУР SPIKE-LR."
 CZE_IFV_5_short: "KBVP"
 CZE_IFV_6: "KBVP M1 Pandur II"
 CZE_IFV_6_desc: "Чешская модернизация Pandur II, в основном повышающая его защищённость за счёт решётчатых экранов против РПГ. Также улучшены фильтры и система вентиляции для работы в условиях пыли и песка, повышена надёжность. Использует ПТУР SPIKE-LR."
 CZE_IFV_6_short: "KBVP M1"
 CZE_IFV_7: "KBVP Komár"
 CZE_IFV_7_desc: "KBVP расшифровывается как Kolové bojové vozidlo pěchoty, колёсная AIFV. Она используется как более бронированная и оснащённая версия ОТ-133, использующая его модульную систему броневого пакета В. Её башня выпускается в двух взаимозаменяемых вариантах."
 CZE_IFV_8: "KBVP Vážka"
 CZE_IFV_8_desc: "KBVP Vážka разработана как вариант ОТ-136 со всеми его особенностями, но с меньшей вместимостью десанта, а также более тяжёлым вооружением и защитой с использованием броневого пакета В. Она использует тот же лазер, что и ОТ-136, с более мощной ВСУ для его питания."
 CZE_Rec_tank_0: "BPzV Svatava"
 CZE_Rec_tank_0_desc: "Разведывательный вариант BVP-1 с усиленной оптикой и сенсорным оборудованием."
 CZE_Rec_tank_1: "LOS"
 CZE_Rec_tank_1_desc: "Разведывательный вариант ОТ-90, модернизированное оборудование, приборы C2I и другие достижения в области разведывательных технологий."
 CZE_Rec_tank_2: "KBVP-PZ Pandur II"
 CZE_Rec_tank_2_desc: "Разведывательная версия Pandur II"
 CZE_Rec_tank_3: "KBVP-PZ M1 Pandur II"
 CZE_Rec_tank_3_desc: "Разведывательная версия Pandur II M1"
 CZE_Rec_tank_4: "KBVP-PZ Komár"
 CZE_Rec_tank_4_desc: "Разведывательная версия Komár"
 CZE_Rec_tank_5: "BVP-PZ Vážka"
 CZE_Rec_tank_5_desc: "Разведывательная версия Vážka"
 CZE_Heavy_Anti_tank_1: "BRDM-1-ST"
 CZE_Heavy_Anti_tank_1_desc: "Советский носитель ПТУР отечественного производства."
 CZE_Heavy_Anti_tank_2: "БРДМ-2-СТ"
 CZE_Heavy_Anti_tank_2_desc: "Носитель ПТУР второго поколения на базе БРДМ отечественного производства с модернизированными системами."
 CZE_Heavy_Anti_tank_3: "KBVP-ST Pandur II"
 CZE_Heavy_Anti_tank_3_short: "KBVP-ST"
 CZE_Heavy_Anti_tank_3_desc: "Pandur II, купленный по лицензии в Австрии и собранный в Чехии, — единая система вооружения, включающая носители ПТУР, машины связи, командно-штабные машины, БТР, БМП и другие боевые бронированные машины. Использует ПТУР SPIKE-LR."
 CZE_Heavy_Anti_tank_4: "KBVP-ST M2 Pandur II"
 CZE_Heavy_Anti_tank_4_desc: "Чешская модернизация Pandur II до модификации Modernization 2, повышающая его защищённость, а также надёжность и управляемость в условиях пыли или песка. Использует ПТУР SPIKE-LR."
 CZE_SP_Anti_Air_0: "PLRK Střela-1M"
 CZE_SP_Anti_Air_0_desc: "Быстроходная колесная машина ЗРК с ракетами малой или средней дальности."
 CZE_SP_Anti_Air_1: "PLRK Osa"
 CZE_SP_Anti_Air_1_desc: "Быстроходный колесный ЗРК с ракетами средней дальности."
 CZE_SP_Anti_Air_2: "PLRK-121 Jehla"
 CZE_SP_Anti_Air_2_desc: "На базе Объединённой системы вооружения ОТ-121, оснащённой новейшими ракетами ЗРК PLŘS vz. 13, 14 или 15 Hroznýš."
 CZE_SP_Anti_Air_3: "PLRK-133 Hroznýš"
 CZE_SP_Anti_Air_3_desc: "На базе Объединённой системы вооружения ОТ-133, оснащённой новейшими ракетами ЗРК PLŘS vz. 16, 17, 18 или 19 Chřestýš."
 CZE_SP_Anti_Air_4: "PLRK-136 Zmije"
 CZE_SP_Anti_Air_4_desc: "На базе Объединённой системы вооружения ОТ-136, оснащённой новейшими ракетами ЗРК PLŘS vz. 25,26,27 или 28 Zmije."
 CZE_SP_R_arty_0: "RM-51"
 CZE_SP_R_arty_0_desc: "На основе конструкций советских РСЗО и оригинальной «Катюши», использовавшейся во Второй мировой войне. Несёт 32 ракеты с дальностью полета 8 км."
 CZE_SP_R_arty_1: "RM-70 Grad"
 CZE_SP_R_arty_1_desc: "Преемник RM-51, использующий новое шасси и системы наведения, расширяющие дальность полета до 20 км с его 40 ракетами."
 CZE_SP_R_arty_2: "RM-71 Vampír"
 CZE_SP_R_arty_2_desc: "Преемник РМ-70 имеет новую бронированную кабину для экипажа и управляемые артиллерийские снаряды, способные поражать цели на расстоянии 100 км от машины."
 CZE_SP_R_arty_3: "RM-94 Monzun"
 CZE_SP_R_arty_3_desc: "Новым поколением РСЗО стала РМ-94. Она оснащена улучшенным оборудованием связи и радиооборудованием, а её снаряды заменены новыми интеллектуальными боеприпасами с наведением от множества систем, включая GPS или Galileo."
 CZE_SP_R_arty_4: "RM-96 Tajfun"
 CZE_SP_R_arty_4_desc: "RM96 — шедевр артиллерии. 42 независимые цели противника поражаются одновременно и точно с расстояния 300 км машиной, управляемой из любой точки Земли."
 CZE_SP_arty_0: "ShM vz. 85 PRÁM-S"
 CZE_SP_arty_0_desc: "Этот BVP-2, переделанный в самоходный миномёт, полезен для ближней поддержки, когда наши товарищи попадают под огонь."
 CZE_SP_arty_1: "ShKH vz. 77 DANA"
 CZE_SP_arty_1_desc: "Широко экспортируемая артиллерия DANA имеет очень подвижное колесное шасси и передовые компьютеры наведения, позволяющие вести огонь с высокой точностью и передислокацией."
 CZE_SP_arty_2: "ShKH vz. 77 DANA M2"
 CZE_SP_arty_2_desc: "Модернизация DANA приводит её в соответствие с новейшими стандартами и технологиями, а также добавляет новые типы боеприпасов. Она оснащена новой колёсной осью и двигателем, а также новой системой управления огнём и связи, что позволяет ей более точно координировать огонь и связь с вышестоящими тактическими и стратегическими средствами."
 CZE_SP_arty_3: "ShKH vz. 105 KATKA"
 CZE_SP_arty_3_desc: "Преемник DANA, артиллерийская КАТКА базируется на высокой мобильности своего предшественника, но обеспечивает более высокую взаимосвязанность со всеми военными средствами, позволяя ей рассчитывать условия в реальном времени, позиции и перемещения, принимая во внимание погоду и другие события, чтобы получить еще более точные удары. У него новая пушка с более длинным стволом и газовым отверстием."
 CZE_SP_arty_4: "ShKH vz. 109 BÁRA"
 CZE_SP_arty_4_desc: "Bára — это шедевр инженерной мысли. Благодаря дистанционному управлению и высокой скорости на бездорожье она почти не несёт потерь от контрбатарейного огня, а большой запас боеприпасов обеспечивает длительную стрельбу и редкое пополнение."
 CZE_artillery_1: "122mm houfnice vz. 38/74"
 CZE_artillery_1_short: "vz. 38/74"
 CZE_artillery_1_desc: "Орудие, разработанное вскоре после Второй мировой войны и применяемое с тех пор. Дешёвое, но надёжное."
 CZE_artillery_2: "122mm houfnice D-30A"
 CZE_artillery_2_short: "vz. 30"
 CZE_artillery_2_desc: "Артиллерийская система отечественного производства, созданная с применением чешских технологий на базе зарубежной D-30."
 CZE_artillery_3: "155mm houfnice vz. 2"
 CZE_artillery_3_short: "vz. 2"
 CZE_artillery_3_desc: "Гаубица нового поколения с возможностью стрельбы прямой наводкой и компьютерным наведением."
 CZE_artillery_4: "155mm houfnice vz. 23"
 CZE_artillery_4_short: "vz. 23"
 CZE_artillery_4_desc: "Артиллерия, использующая новое поколение интеллектуальных боеприпасов для точных ударов."
 CZE_util_vehicle_1: "Praha M59"
 CZE_util_vehicle_1_desc: ""
 CZE_util_vehicle_2: "Tatra 813 8x8 KOLOS"
 CZE_util_vehicle_2_desc: "Грузовик Tatra с высокой проходимостью, способный перевозить любой тип груза, включая живые существа."
 CZE_util_vehicle_3: "Tatra 815 6x6"
 CZE_util_vehicle_3_desc: "Модернизированный грузовик Tatra для транспортировки грузов и выполнения хозяйственных задач. Выпускается в версиях: грузовая, контейнеровоз, мобильная мастерская, топливная цистерна, самосвал, кран, пожарная машина, вывоз мусора, эвакуатор и другие."
 CZE_util_vehicle_4: "Tatra 815-7 8x8 PRAM"
 CZE_util_vehicle_4_desc: "Tatra T-815 с бронированной кабиной и улучшенной проходимостью, новым двигателем и GPS."
 CZE_util_vehicle_5: "Perun 4x4"
 CZE_util_vehicle_5_desc: "Новый джип для хозяйственных нужд, командования и связи."
 CZE_util_vehicle_6: "Škoda Želva 4x4"
 CZE_util_vehicle_6_desc: "Бронированный джип с оборудованием для разведки, центром командования и связи или возможностью перевозки пассажиров."
 CZE_util_vehicle_7: "Tatra 915 8x8"
 CZE_util_vehicle_7_desc: "Полностью бронированный грузовой автомобиль"
