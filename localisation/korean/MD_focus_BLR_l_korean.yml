 BLR_is_not_currently_sending_azot_mission_TT: "[ROOT.GetNameWithFlag](은)는 현재 §Y무역 임무§!를 수행하고 있지 않습니다\n"
 belarus_LTB.1.t: "공산주의 시위 발발"
 belarus_LTB.1.d: "공산주의 선동가들이 전국에서 대규모 시위를 조직했습니다. 시위는 대중의 큰 관심을 끌고 있으며 정부에 상당한 압박을 가하고 있습니다. 우리 정보 기관은 외국의 개입을 의심하고 있지만 이를 확인하지는 못했습니다."
 belarus_LTB.1.a: "매우 우려스럽다"
 belarus_LTB.2.t: "친벨라루스 선전 운동"
 belarus_LTB.2.d: "벨라루스와의 긴밀한 관계가 가져다줄 이점을 홍보하는 조직적인 선전 운동이 우리 언론 전반에 등장했습니다. 포스터와 전단, 대중 연설자들이 통합 국가를 요구하고 있습니다. 풀뿌리 운동처럼 보이지만 메시지는 놀라울 정도로 일관되어 있습니다."
 belarus_LTB.2.a: "이에 맞서야 한다"
 belarus_LTB.3.t: "외국과의 연루 혐의를 받는 군 장교들"
 belarus_LTB.3.d: "우리 군 장교 여러 명이 외국 자금의 지급과 관련된 부패 스캔들에 연루되었습니다. 혐의를 받는 장교들은 민감한 직위에 있었기에 이들의 제거는 지휘 체계에 공백을 만들 것입니다. 이는 보다 광범위한 외국 정보 작전의 일환으로 보입니다."
 belarus_LTB.3.a: "즉시 체포하라"
 belarus_LTB.4.t: "정치 부패 스캔들"
 belarus_LTB.4.d: "유출된 문서에 따르면 다수의 의원이 정치적 영향력을 대가로 외국 정부로부터 금품을 받아 온 것으로 드러났습니다. 이 스캔들은 우리 민주 제도에 대한 대중의 신뢰를 뒤흔들었고, 여러 연립 파트너가 지지 철회를 위협하고 있습니다."
 belarus_LTB.4.a: "이것은 재앙이다"
 belarus_LTB.5.t: "공산주의 봉기"
 belarus_LTB.5.d: "무장한 공산주의 반란군이 전국의 주요 정부 건물을 점거했습니다. 군은 분열되어 있고 민간 정부는 붕괴하고 있는 듯합니다. 이것은 전면적인 혁명입니다. 해외의 우리 동맹들은 개입할 수 없거나 개입하려 하지 않았습니다."
 belarus_LTB.5.a: "낡은 질서는 끝났다"
 BLR_new_paths_desc: ""
 BLR_Financing_protests_in_pol: "폴란드 내 시위 자금 지원"
 BLR_parlament_pol_places: "폴란드 의회 인맥 자금 지원"
 BLR_vilnius_returns: "빌뉴스 통합"
 BLR_samogitia_returns: "사모기티아 통합"
 BLR_sudovia_returns: "수도비아 통합"
 BLR_klaipeda_returns: "클라이페다 통합"
 BLR_lithuania_claims: "§Y[LIT.GetNameWithFlag]§!에 대한 영유권 주장"
 BLR_lithuania_claims_desc: "빌뉴스와 그 주변 지역은 리투아니아 대공국의 중심지였으며, 벨라루스 민족주의자들은 이 도시를 리투아니아의 손에 넘긴 1939년의 합의를 결코 받아들이지 않았습니다. 우리는 영유권을 공개적으로 주장하고 빌뉴스에 이 지역을 반환하라고 요구할 것입니다."
 BLR_operation_new_day: "작전 \\"새로운 날\\""
 BLR_operation_new_day_desc: "빌뉴스는 협상 테이블에서 넘어오지 않을 것입니다. 모스크바와 함께 리투아니아에 대한 합동 작전을 벌이면 수바우키 회랑을 차단하고 이 지역을 우리 통제 아래 둘 수 있지만, 이는 NATO 회원국과의 전쟁을 의미합니다."
 BLR_partnership_azerbaijan: "§Y[AZE.GetNameWithFlag]§! 구애"
 BLR_partnership_azerbaijan_desc: "바쿠는 석유 수입이 있고 이웃 나라들의 정치에 애정이 없으므로, 훈계 없이 우리와 교역할 바로 그런 파트너입니다. 아제르바이잔 자본에 벨라루스 산업의 지분을 제안할 것입니다."
 BLR_partnership_venezuela: "§Y[VEN.GetNameWithFlag]§! 구애"
 BLR_partnership_venezuela_desc: "카라카스는 서방 세력권 밖의 친구를 찾고 있으며 그 대가를 치를 오일 달러가 있습니다. 파트너십은 새로운 벨라루스 산업의 자금이 되고 우리에게 아메리카 대륙의 발판을 제공할 것입니다."
 BLR_military_coop_venezuela: "§Y[VEN.GetNameWithFlag]§!과(와) 군사 협력"
 BLR_military_coop_venezuela_desc: "상업적 유대가 구축되었으므로 카라카스가 실제로 원하는 것, 즉 대공 방어 체계와 숙련된 승무원, 그리고 이를 운용할 전문 지식을 제공할 수 있습니다."
 BLR_soviet_plants_category: "소련 산업 유산"
 BLR_soviet_plants_category_desc: "벨라루스가 벨로루시 소비에트 사회주의 공화국으로부터 물려받은 공장들로, 바라노비치의 제558 항공기 수리 공장, 민스크 차륜 트랙터 공장, 바리사우의 제140 수리 공장, 민스크 트랙터 공장이 있습니다. 이 공장들은 모두 더 이상 존재하지 않는 소련군 전투 서열에 복무하도록 건설되었으며, 이제 각자 자체 고객을 찾아야 합니다."
 BLR_advanced_industry_category: "군산위원회"
