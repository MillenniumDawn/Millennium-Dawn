 OBT_proc_channel_open_tt: "The American supply channel is open (no procurement hold)"
 OBT_strait_below_friction_tt: "Cross-Strait Tension is below §Y40§! (Calm or Friction)"
 OBT_strait_below_crisis_tt: "Cross-Strait Tension is below §Y60§! (no Crisis)"
 OBT_strait_below_brink_tt: "Cross-Strait Tension is below §Y80§! (no Brink)"
 OBT_fund_kidd_tt: "Funds the §YKidd-class destroyers§!."
 OBT_fund_kidd_transfer: "Fund the Kidd Transfer"
 OBT_fund_kidd_transfer_desc: "The Legislative Yuan stalled the special budget. A narrower bill covering only the Kidd-class destroyers may pass where the full package failed."
 OBT_fund_full_tt: "Funds the §YP-3C patrol aircraft§! and design work on the §Ydiesel submarines§!."
 OBT_fund_full_package: "Pass the Remaining Special Budget"
 OBT_fund_full_package_desc: "The rest of the 2001 package, the patrol aircraft and the submarines, still waits for money. Historically the Legislative Yuan blocked it from 2004 to 2007."
 OBT_req_TAI_us_confidence_55: "U.S. Confidence in Taipei is at least §Y55§!"
 OBT_expedite_kidd_tt: "The remaining refit time is cut by §G40%§!."
 OBT_expedite_kidd: "Expedite the Kidd Refit"
 OBT_expedite_kidd_desc: "Paying for extra shifts in the Charleston yard and sending crews early can bring the destroyers home sooner."
 OBT_req_CHI_taiwan_us_support_60: "U.S. Support is at least §Y60§!"
 OBT_p3c_priority_tt: "The current contract or refurbishment stage is cut by §G50%§!."
 OBT_p3c_priority: "Negotiate Priority Delivery"
 OBT_p3c_priority_desc: "If Washington will move Taiwan up the queue at Lockheed's refurbishment line, the patrol aircraft could arrive years earlier. It will cost money and goodwill."
 OBT_p3c_second_line_tt: "The current stage is cut by §G25%§! and later batches arrive every §G9§! months instead of 18."
 OBT_p3c_second_line: "Fund a Second Refurbishment Line"
 OBT_p3c_second_line_desc: "A second line would refurbish airframes in parallel, if our own maintenance crews are ready to take them."
 OBT_sub_talks_usa_tt: "Talks begin. They succeed only if every condition above still holds in §Y180§! days."
 OBT_sub_talks_usa: "Ask Washington to Reopen a Diesel Line"
 OBT_sub_talks_usa_desc: "No American yard has built a diesel submarine since the 1950s. A new line is possible only if Washington trusts us completely and is willing to spend its own political capital. Talks take 180 days. If the conditions still hold when they end, the contract is signed. If not, the talks fail."
 OBT_sub_talks_hol_tt: "Talks begin. They succeed only if every condition above still holds in §Y180§! days."
 OBT_sub_talks_hol: "Approach the Hai Lung Builders"
 OBT_sub_talks_hol_desc: "Rotterdam's RDM built our two Hai Lung boats in the 1980s. The yard is struggling and could build an improved design, if The Hague accepts Beijing's anger before RDM closes in 2004. Talks take 180 days. If the conditions still hold when they end, the contract is signed. If not, the talks fail."
 OBT_sub_talks_ger_tt: "Talks begin. They succeed only if every condition above still holds in §Y180§! days."
 OBT_sub_talks_ger: "Negotiate a German License"
 OBT_sub_talks_ger_desc: "Germany's HDW designs the world's best-selling diesel submarines. Berlin has always refused Taipei. Only close relations and a calm Strait could change that. Talks take 180 days. If the conditions still hold when they end, the contract is signed. If not, the talks fail."
 OBT_sub_appropriation_tt: "Construction begins. The first pair is due in about §Y6 years§!, then a pair every year."
 OBT_sub_appropriation: "Appropriate the Submarine Construction Funds"
 OBT_sub_appropriation_desc: "A builder is ready, but construction needs its own appropriation, the largest single defense bill in our history, and a navy ready to crew eight new boats."
 OBT_req_TAI_reform_capacity_60: "Reform Capacity is at least §Y60§!"
 OBT_sub_second_line_tt: "The current stage is cut by §G25%§! and later pairs arrive every §G6§! months instead of 12."
 OBT_sub_second_line: "Open a Second Building Slip"
 OBT_sub_second_line_desc: "A second slip would halve the gap between pairs, if our engineers can supervise two hulls at once."
 OBT_fund_aegis_tt: "Construction begins. The first pair is due in about §Y7 years§!, the second a year later."
 OBT_fund_aegis: "Fund the Aegis Destroyers"
 OBT_fund_aegis_desc: "Washington agreed to sell Aegis destroyers. They would be the most capable warships in the region outside the U.S. and Japanese navies, built new, and very expensive."
 OBT_cancel_kidd: "Cancel the Kidd Transfer"
 OBT_cancel_kidd_desc: "Money already spent is not returned. Washington will remember the cancellation, and anything already delivered stays in service."
 OBT_cancel_p3c: "Cancel the P-3C Purchase"
 OBT_cancel_p3c_desc: "Money already spent is not returned. Washington will remember the cancellation, and anything already delivered stays in service."
 OBT_cancel_sub: "Cancel the Submarine Program"
 OBT_cancel_sub_desc: "Money already spent is not returned. Washington will remember the cancellation, and anything already delivered stays in service."
 OBT_cancel_aegis: "Cancel the Aegis Purchase"
 OBT_cancel_aegis_desc: "Money already spent is not returned. Washington will remember the cancellation, and anything already delivered stays in service."
 OBT_han_kuang: "Hold the Han Kuang Exercise"
 OBT_han_kuang_desc: "Our annual joint exercise tests whether the services can defend the island together. Holding it seriously, rather than as a scripted show, builds real confidence."
 OBT_req_TAI_reform_capacity_40: "Reform Capacity is at least §Y40§!"
 OBT_joint_drill: "Joint Operations Drill"
 OBT_joint_drill_desc: "The army, navy and air force still plan separately. A joint command drill exposes the gaps before a crisis does."
 OBT_pentagon_assessment: "Host a Pentagon Assessment Team"
 OBT_pentagon_assessment_desc: "American assessors will tell us candidly what does not work. Their report will embarrass some commanders, and it will reassure Washington that we take defense seriously."
 OBT_civil_defense_review: "Civil Defense Coordination Review"
 OBT_civil_defense_review_desc: "City governments, ministries and the armed forces rehearse who does what when the power, ports or networks fail."
 OBT_supply_chain_review: "Semiconductor Supply-Chain Review"
 OBT_supply_chain_review_desc: "A review of materials, tools and energy for the fabs shows where a single supplier, often on the mainland, could stop production."
