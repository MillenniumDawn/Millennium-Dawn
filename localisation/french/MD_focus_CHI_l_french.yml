 CHI_bri_prestige_projects: "Projets BRI Prestige construits"
 CHI_bri_prestige_projects_desc: "Décompte cumulatif des projets de prestige et de bonne volonté politique achevés dans le cadre de la BRI."
 CHI_bri_prestige_projects_tt: "$CHI_bri_prestige_projects$ : $RIGHT|+=1$"
