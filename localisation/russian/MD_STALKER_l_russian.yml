 STALKER_zone_leading_mercenaries: "Наёмники"
 STALKER_global_zone_category: "Мировые дела Зон"
 STALKER_global_zone_category_desc: "После исхода Кайманова аномальные Зоны и добываемые в них артефакты касаются каждого правительства.\n\nМировая цена артефакта: §Y$[?global.STALKER_artifact_price|2]§! млрд за штуку\nАртефактов на открытом рынке: §Y[?global.STALKER_market_artifacts|0]§!"
 STALKER_mdst_category: "Контрразведка против MDST"
 STALKER_mdst_category_desc: "Материалы лабораторий X показывают, что MDST — Министерство обороны и секретных технологий — по-прежнему пользуется каналами проекта X внутри государственных учреждений, в том числе наших.\n\nПроникновение MDST: §Y[?ROOT.STALKER_mdst_penetration|0]§! / 80\nОно растёт на §R1§! каждый месяц. Выше §Y9§! его ежемесячный шанс украсть артефакты и прогресс по лабораториям X равен пятой части проникновения, но не чаще раза в §Y180 дн.§!"
 STALKER_mdst_warning_heeded: "Предупредили нас о MDST"
