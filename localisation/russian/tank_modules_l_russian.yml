 afv_hover_suspension_1: "Подвеска в режиме зависания I"
 afv_hover_suspension_1_desc: "В системах воздушной подвески используется технология подъема, которая уменьшает площадь контакта с землей и повышает мобильность на пересеченной местности, позволяя бронетранспортерам развивать значительно более высокую скорость.\n\n§G Подсказка для разработчиков: воздушная подвеска значительно увеличивает максимальную скорость, но при этом возрастает расход топлива и стоимость производства.§!"
