 CHI_infantry_weapons_2_desc: "81식(\\"81식 자동소총\\")은 중국이 설계한 2세대 선택 사격식 가스 작동 방식 7.62x39mm 소총(칼라시니코프 및 SKS 작동 방식 기반)으로, 중국 인민해방군이 채택했습니다."
