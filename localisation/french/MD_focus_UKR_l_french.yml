 UKR_develop_t38_stylet_spaa: "Développer le projet d'antiaérien mobile T-38 Stylet"
 UKR_modernize_rk10_spaa: "Strela-10 §YRK-10§! Intégration"
 UKR_develop_kentavr_spaa: "Développez §YZRAK 'Kentavr'§!"
 UKR_develop_2s22: "Développer le 2S22 'Bohdana'"
 UKR_develop_2s22_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_2s22_for_tooltip\n\n\n\n\n\n\n\n\nLe 2S22 « Bohdana » est un obusier automoteur ukrainien de 155 mm, développé par l'usine de construction de machines-outils lourdes de Kramatorsk pour doter les Forces armées ukrainiennes de capacités d'artillerie modernes au standard OTAN.\nLe système est monté sur un châssis à roues, offrant une haute mobilité opérationnelle et lui permettant de changer rapidement de position de tir après avoir engagé l'ennemi.\nLe canon de 155 mm est capable d'employer des munitions d'artillerie standard OTAN, accroissant considérablement la portée et la puissance de feu disponibles pour les unités d'artillerie ukrainiennes.\nSes systèmes automatisés de conduite de tir et de navigation permettent à l'équipage de déterminer rapidement les données de tir et d'engager les cibles avec une plus grande précision.\nLe développement du « Bohdana » représente une étape majeure dans la modernisation de l'artillerie ukrainienne et la transition vers des systèmes d'armes au standard OTAN."
 UKR_modernize_su25_m1: "Moderniser l'avion d'attaque Su-25"
 UKR_modernize_su27_1m: "Moderniser l'avion de chasse Su-27"
 UKR_modernize_mig29_mu2: "Modernize l'avion de chasse MiG-29 variante MU1"
 UKR_modernize_mig29_mu1: "Moderniser l'avion de chasse MiG-29 variante MU2"
 UKR_develop_an_lbl: "Développer une proposition §YAntonov Light Aircraft§!"
 UKR_develop_an_lbl_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_an_lbl_development_for_tooltip\n\n\n\n\n\n\n\n\nL'avion léger Antonov est un avion léger proposé, conçu par le bureau d'études Antonov, qui devrait être proche du Yak-130. Il est destiné à divers rôles, y compris l'entraînement et la reconnaissance. L'aéronef devrait présenter une avionique avancée, une cellule légère et des moteurs efficaces pour offrir d'excellentes performances et une bonne efficacité énergétique."
 UKR_develop_an_bfv: "Développer un §Yavion de chasse Antonov§! proposé"
 ukraine_develop_2s22.1.name: "Développer l'obusier automoteur 2S22 'Bohdana'"
 ukraine_develop_2s22.1.desc: "La technologie progresse et nos armes vieillissent. Nous devons développer notre propre obusier automoteur moderne pour nos forces."
 ukraine_develop_2s22.1.a: "Fournir un financement de base"
 ukraine_develop_2s22.1.b: "Fournir un financement important"
 ukraine_develop_2s22.2.name: "KrZVV a finalisé le projet du nouvel automoteur"
 ukraine_develop_2s22.2.desc: "L'usine KrZVV a terminé le projet du nouvel automoteur pour notre armée. Cependant, faute de fonds suffisants, ils n'ont pas pu concevoir un nouveau canon et ont dû utiliser un ancien modèle soviétique."
 ukraine_develop_2s22.2.a: "D'accord, lançons la production !"
 ukraine_develop_2s22.3.name: "KrZVV a finalisé le projet du nouvel automoteur"
 ukraine_develop_2s22.3.desc: "KrZVV a achevé la conception de notre nouvel automoteur. Grâce aux fonds supplémentaires, chaque aspect du véhicule a été développé à partir de zéro, garantissant puissance et modernité."
 ukraine_develop_2s22.3.a: "Parfait, lançons la production !"
 UKR_develop_stuhna_p_atgm: "Développer le RK-2 'Stuhna-P'"
 UKR_develop_stuhna_p_atgm_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_stuhna_p_for_tooltip\n\n\n\n\n\n\n\n\nLe Stuhna-P, connu sous sa version d'exportation Skif, est un système de missile guidé antichar (ATGM) ukrainien développé au début des années 2010 par le bureau d'études Luch.\nLe Stuhna-P est conçu pour détruire des cibles blindées modernes à blindage combiné porté ou monolithique, y compris le blindage réactif explosif (ERA).\nLe Stuhna-P peut attaquer des cibles aussi bien stationnaires que mobiles.\nIls peuvent attaquer à longue portée jusqu'à 5 kilomètres de jour et à courte portée jusqu'à 100 mètres."
 UKR_develop_corsar_atgm: "Développer le RK-3 'Corsar'"
 UKR_develop_corsar_atgm_desc: "Le RK-3 Corsar est un missile antichar guidé portable léger ukrainien développé par le bureau d'études d'État Loutch de Kyiv.\nLe Corsar est susceptible de remplacer les systèmes antichars d'époque soviétique tels que le 9M113 Konkurs et le 9K111 Fagot.\nIl est destiné à détruire des cibles blindées stationnaires et en mouvement. Il peut aussi être utilisé contre des emplacements, des objets légèrement blindés et des hélicoptères.\nLe tir peut s'effectuer depuis l'affût comme depuis un parapet de tranchée. Le mode de guidage est le faisceau laser."
 UKR_modernize_stuhna_p_atgm: "Moderniser le RK-2 'Stuhna-P'"
 UKR_modernize_stuhna_p_atgm_desc: "Nous pouvons moderniser davantage le complexe ATGM Stuhna-P, pour mieux rester en phase avec les menaces actuelles."
 UKR_develop_bulava_atgm: "Développer le 'Bulava'"
 UKR_develop_bulava_atgm_desc: "Futur complexe ATGM doté de capacités 'tire et oublie'.\nToutes les informations sont §Yclassifiées§! pour le moment."
 UKR_develop_stuhna_p_flag: " Décision terminée §YDévelopper le RK-2 'Stuhna-P'§!"
 UKR_develop_corsar_flag: " Décision terminée §YDévelopper le RK-3 'Corsar'§!"
 UKR_develop_kba27: "Développer l'artillerie automotrice KBA-27"
 UKR_develop_kba27_desc: "Le KBA-27 est un obusier ukrainien de 152 mm dérivé du 2A61 Pat-B soviétique. Une variante expérimentale montait le canon sur un transporteur amphibie PTS-2, combinant la puissance de feu d'artillerie lourde avec une grande mobilité et des capacités amphibies. Un développement ultérieur pourrait transformer ce prototype en un système d'artillerie automoteur viable."
 UKR_modernize_stuhna_p_flag: " Décision terminée §YModerniser le RK-2 'Stuhna-P'§!"
 UKR_develop_baryer_s: "Développer §Y'Baryes-S'§!"
 UKR_develop_baryer_s_desc: "Le Baryer-S est un système de missile antichar guidé (ATGM) ukrainien développé par le bureau d'études Loutch à partir de l'ATGM Chtourm-S.\nLe Baryer-S est conçu pour détruire des cibles blindées modernes à blindage combiné porté ou monolithique, y compris le blindage réactif explosif (ERA)."
