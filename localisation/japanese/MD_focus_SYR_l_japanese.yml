 SYR_ECONOMIC_DECISIONS_THREE_FREE_FACTORIES_EXPLANATION: "§R建設に割り当てられていない利用可能な産業施設が少なくとも3つ必要である。割り当てた建設をキャンセルするか、完了して利用可能になるまで待つこと§!"
