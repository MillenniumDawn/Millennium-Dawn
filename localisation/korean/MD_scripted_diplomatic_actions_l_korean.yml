 REVOKE_MIL_GNSS_ACCESS_TITLE: "군용 위성항법시스템 접근 취소"
 REVOKE_MIL_GNSS_ACCESS_ACTION_DESC: "우리의 암호화된 군용 위치 파악 네트워크에 대한 모든 업링크 자격 증명을 취소하고 즉시 통합 접근을 종료합니다. 이 조치는 방위 작전에 필수적인 항법 능력을 차단하고, 정밀 유도 시스템을 비활성화하며, 전략적 신뢰의 근본적인 파기를 나타냅니다. 이러한 조치는 양국 간 안보 협력 및 작전 상호 운용성에 심각한 영향을 미칩니다. 그들은 우리의 §Y군용 위성항법시스템 위성 네트워크§!에 대한 모든 접근 권한을 상실할 것입니다."
