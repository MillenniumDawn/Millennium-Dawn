l_korean:
 New_England_focus: "뉴잉글랜드 중점 계통도"
 NEN_new_nation_new_problems: "새로운 나라, 새로운 문제"
 NEN_new_nation_new_problems_desc: "먼지가 가라앉으면서 우리는 이제 실제로 \"작전 기지\"를 어디에 설정할지, 즉 우리 나라의 수도를 어디에 둘지 고민하기 시작할 수 있습니다."
 NEN_focus_maine_mayhem: "메인의 대혼란"
 NEN_focus_maine_mayhem_desc: "메인은 면적이 가장 큰 주이기 때문에 사람들이 숲과 산속에 숨어들려 할 때 다루기가 가장 어려운 곳입니다. 따라서 우리는 기본적인 경제 구조를 통해 그들을 끌어내야 합니다. 음식은 우리가 생존하고 살기 위한 권리이며, 메인은 이러한 기본적인 경제 구조를 위한 좋은 출발점이 될 것입니다."
 NEN_focus_greenville_gallantries: "그린빌의 미덕"
 NEN_focus_greenville_gallantries_desc: "사람들이 함께 일하기 시작하고 사회적 응집력이 평화로운 형태로 형성되면서, 이제 우리는 행정 및 시민 서비스를 구현할 때입니다. 곧 메인 주는 우리의 젊은 나라에서 자랑스러워할 만한 기념비적인 존재가 될 것입니다."
 NEN_focus_hampshire_havoc: "뉴햄프셔 혼란"
 NEN_focus_hampshire_havoc_desc: "우리 새로운 나라의 대체로 중앙에 위치한 뉴햄프셔는 국가 전체의 질서를 회복하는 데 전략적으로 중요한 주입니다. 따라서 우리는 인프라와 경제 활동을 구축하여 주를 \"재통합\"할 준비를 해야 합니다."
 NEN_focus_concord_concrete: "콩코드의 콘크리트"
 NEN_focus_concord_concrete_desc: "경제적 및 사회적 응집력은 우리가 시민 및 응급 서비스를 시행하여 사람들의 삶을 개선하고 주에 법과 질서를 회복할 수 있을 정도로 적정 수준에 도달했습니다. 이 모든 과정에서 주요 경제적 원동력은 콩코드 콘크리트라는 건설 회사였으며, 이들은 문자 그대로 우리 젊은 나라의 미래를 위한 기초를 쌓고 있습니다."
 NEN_focus_messychusetts: "메시추세츠"
 NEN_focus_messychusetts_desc: "매사추세츠는 옛 공화국이 몰락한 이후 완전한 난장판이 되었습니다. 많은 국민이 보스턴 자체를 뉴잉글랜드인이 된다는 것의 의미를 폭넓게 규정하는 문화적 수도로 여기기에, 이는 우리 젊은 국가에 치명적입니다. 따라서 우리는 이 문화를 다시 조명받게 하기 위해 정리하고 재건하며 길을 열기 위해 할 수 있는 모든 일을 할 것입니다."
 NEN_focus_boston_beauty: "보스턴의 아름다움"
 NEN_focus_boston_beauty_desc: "끊임없는 노력과 이마의 땀으로 우리는 한때 아름다웠던 이 도시와 땅의 영광을 되찾습니다. 이렇게 복구된 상태에서 새로 찾은 영광과 열정을 공공 및 행정 서비스 도입으로 굳건히 하여, 위대한 국가의 또 다른 지역에 질서와 평화를 완전히 회복할 수 있습니다."
 NEN_focus_vermont_violence: "버몬트의 폭력"
 NEN_focus_vermont_violence_desc: "\\"삼각 쌍둥이\\"의 나머지 절반인 버몬트는 뉴욕과 국경을 맞댄 주로, 개발이 되어 있음에도 상당히 고립되어 있습니다. 이러한 고립 속에서 만연한 폭력 행위가 거리를 집어삼켰으며, 이 주를 다시 북동부 가족으로 돌려보내려면 평화와 안정도를 회복하는 것이 우리의 임무입니다. 먼저 매사추세츠와 뉴햄프셔 국경 지역을 따라 제한적인 경제 투자와 기초 인프라 투자를 시작하고 거기서부터 나아갈 것입니다."
 NEN_focus_virtuous_vermont: "덕망 있는 버몬트"
 NEN_focus_virtuous_vermont_desc: "시간이 걸렸지만, 지역 주민의 노력과 칭찬할 만한 헌신 덕분에 한때 불안정했던 이 땅에 평화와 미덕을 되돌리기 시작했습니다. 이제 정부 행정과 법 집행 기관을 세워 주의 재통합을 위한 기반을 더 잘 조직하고 마련할 수 있습니다."
 NEN_focus_connecticut_crutch: "코네티컷의 버팀목"
 NEN_focus_connecticut_crutch_desc: "코네티컷은 우리의 두 번째로 작은 주이면서도 해안선의 약 3분의 1을 차지하여 그 자체로 하나의 도박과도 같습니다. 해안선이 길고 내륙 지형이 많지 않아 경제적 다양성을 유지하기 어렵습니다. 따라서 이 주와 주민이 우리 국가의 다른 어느 지역 못지않은 기회를 누리도록 경제적 다양성의 기준을 세우는 것이 우리의 책임입니다."
 NEN_focus_middletown_miracle: "미들타운의 기적"
 NEN_focus_middletown_miracle_desc: "농업과 식품 가공 산업에 가벼운 투자를 한 덕분에 우리는 \\"중공업 아니면 해운\\"에 그치지 않는 기반을 마련할 수 있었습니다. 이제 공공 서비스를 도입하고 주에 질서와 평화를 재건하여 뉴잉글랜드 퍼즐의 또 한 조각으로 만들 수 있습니다."
 NEN_focus_rhode_island_riots: "로드아일랜드 폭동"
 NEN_focus_rhode_island_riots_desc: "우리의 가장 작은 영토임에도 로드아일랜드 주는 떠돌아다니는 폭도 무리에 장악되었습니다. 이런 불안정 속에서 폭도들이 계속하지 못하게 만들려면 사실상 국경 거점만 설치하면 됩니다. 거기서부터 법 집행 기관을 천천히 투입하여 이 \\"조직화된 혼란\\"을 조금씩 깎아 낼 수 있습니다."
 NEN_focus_providence_parties: "프로비던스의 연회"
 NEN_focus_providence_parties_desc: "시간이 걸렸지만 마침내 해냈습니다. 폭도 무리가 크게 줄었고 주민들 사이에서 사회적 결속이 우선시되기 시작했습니다. 이 안정도의 상승 추세를 활용하여 지역 법 집행, 소방, 정부 행정 같은 공공 서비스를 도입할 때입니다. 머지않아 우리 국가는 다시 하나가 될 것입니다."
 NEN_focus_new_new_england: "새로운 뉴잉글랜드"
 NEN_focus_new_new_england_desc: "길고 위험한 여정이었지만, 헌신과 결의, 그리고 위대한 국가 국민의 의지로 우리는 승리했습니다. 우리 국가는 하나가 되었고, 이 단결로 우리가 창조할 수 있는 길을 열어 갑니다. 미래는 지금이며 그 미래는 우리의 것이 될 것입니다."
 NEN_Augusta_capital: "§Y오거스타§!를 수도로 삼았습니다"
 NEN_Concord_capital: "§Y콩코드§!를 수도로 삼았습니다"
 NEN_Boston_capital: "§Y보스턴§!을 수도로 삼았습니다"
 NEN_end_of_teaser: "티저 트리의 공식 종료. 이제 당신이 영토를 통제합니다. 그러니 마음대로 하십시오... 당분간은."
 NEN_decisions_war_time_mobilization_category: "전시 동원"
 NEN_decisions_war_time_mobilization_category_desc: "필요가 생기면 적어도 전선의 틈을 메울 지원병 군단을 소집할 수 있습니다. 전쟁이 언제 올지는 모르지만, 닥쳐올 것임은 압니다."
 NEN_war_time_mobilization: "1차 동원"
 NEN_war_time_mobilization_desc: "무기를 들라는 부름이 닥쳤으며, 우리는 집을 지키기 위해 결집해야 합니다. 딕시의 사나이들이여, 무기를 들어라!"
 NEN_war_second_wave_defenders: "2차 방어군"
 NEN_war_second_wave_defenders_desc: "적이 밀어붙이고 있으므로 또 한 차례의 방어군을 징집해야 합니다. 국가의 사기는 떨어지겠지만 병력이 필요합니다."
 NEN_war_desperate_defenders: "절박한 방어군"
 NEN_war_desperate_defenders_desc: "상황이 암울해지고 있으며, 능력이 되든 안 되든 전선을 지킬 수 있는 모든 인원이 필요합니다. 어쩌면, 정말 어쩌면 우리는 여전히 이길 수 있을지도 모릅니다."
 NEN_event.1.t: "정부 소재지"
 NEN_event.1.d: "옛 공화국에서 우리의 새 국가가 일어서는 지금, 국가의 수도를 정하는 문제를 살펴보아야 합니다. 많은 이들은 일상을 이어 가며 영토의 안정화에 힘쓸 수 있도록 단순하게 정하기를 바랍니다. 이에 따라 어느 주도가 국가 수도를 맡을지를 둘러싼 논쟁이 격렬합니다. 현재까지의 선택지는 메인, 뉴햄프셔, 매사추세츠로 보입니다. 모두 서로 비교적 가까우므로 어떤 선택이 되든 대체로 좋은 선택일 것입니다."
 NEN_event.1.o1: "이제 좀 끝낼 수 없을까"
 NEN_event.2.t: "수도 선택"
 NEN_event.2.d: "앞서 말한 대로 오거스타, 콩코드, 보스턴을 둘러싼 논쟁이 격렬합니다. 많은 이들은 보스턴이 이미 뉴잉글랜드 정체성의 비공식적 중심지라고 믿지만, 다른 이들은 보스턴이 실질적 수도가 아닌 문화적 수도로 남아야 한다고 믿습니다."
 NEN_event.2.o1: "메인 주 오거스타"
 NEN_event.2.o2: "뉴햄프셔 주 콩코드"
 NEN_event.2.o3: "매사추세츠 주 보스턴"
 NEN_letting_loose_the_dogs: "개들을 풀어놓다"
 NEN_letting_loose_the_dogs_desc: "우리 시민은 불독과 같아서 부름에 결집하여 적이 어디에 있든 맞서 싸울 것입니다."
 NEN_creating_infantry_reserves: "예비대 창설"
 NEN_creating_infantry_reserves_desc: "대륙 전역에서 심상치 않은 소리가 들리며 우리는 이를 경계해야 합니다. 분명 우리에게 문제가 닥칠 것이니 정면으로 맞설 준비를 해야 합니다. 최악에 대비할 수 있도록 즉응 예비 병력을 편성합시다."
 NEN_mobilizing_the_reserves: "예비대 동원"
 NEN_mobilizing_the_reserves_desc: "우리의 안전과 독립을 지키기 위해 마침내 행동에 나서 예비대를 동원해야 합니다. 더 평화로운 내일에 대한 우리의 희망 위에 신께서 그 지친 영혼을 쉬게 하시기를."
 NEN_event.3.t: "버몬트인의 움직임"
 NEN_event.3.d: "수도 논쟁이 계속되는 가운데, 많은 버몬트인은 자신들의 주가 논의에 참여하지 못했다는 사실 때문에 소외감을 느끼고 있습니다. 일부 토박이 버몬트인은 연대를 과시하려고 주로 돌아오고 있습니다. 좋게 봐도 사소한 말다툼 이상의 의미가 있는지 알 수 없는 시위입니다. 이 운동 내의 일부 급진파는 이미 벌어진 혼란을 이어 가려고 불길에 부채질을 하고 있습니다."
 NEN_event.3.o1: "제발 사이좋게 지낼 수 없을까?"
 NEN_event.4.t: "계속되는 버몬트인의 선동"
 NEN_event.4.d: "국가가 대체로 다시 일어섰음에도 불만을 품은 버몬트인 가운데 놀랄 만큼 많은 목소리 큰 이들이 옛 주민들을 결집시켰습니다. 새 국가 정부에 도전하는 움직임으로, 주지사와 저명한 정치 지도자들의 호소에 따라 수천 명의 전 버몬트 시민이 돌아오고 있습니다. 그런 지도자 중 한 명인 하워드 브러시 딘 3세는 이렇게 돌아오는 주의 \\"가족\\"들에게 일자리를 마련하려 하고 있습니다. 겉보기에는 선의의 몸짓이지만, 새 국가 정부를 적극적으로 훼손하는 행위는 국가 단결을 크게 저해하고 버몬트 급진파를 더욱 대담하게 만들고 있습니다."
 NEN_event.4.o1: "좋아, 잠시 진정하자"
 NEN_event.5.t: "버몬트인의 요구"
 NEN_event.5.d: "오늘 일찍 꽤 충격적인 서한을 받았으며, 다음과 같이 인용됩니다. \\"투쟁의 긴장된 시기에 우리는 하나의 문화로서, 뉴잉글랜드 문화로서 단결해야 함을 상기합니다. 그러나 현 국가 정부는 우리가 공유하는 문화를 규정하는 핵심 주 중 하나를 배제함으로써 그러한 단결을 보여 주지 못했습니다. 코네티컷이나 로드아일랜드 같은 주는 왜 나서지 않느냐고 물을 수 있습니다. 간단한 대답은 그들이 나서지 않으리라는 것입니다. 그들은 우리가 처한 폐허만 고쳐 준다면 어떤 국가 정부가 뭐라 하든 상관하지 않습니다. 그러나 이제 끝입니다. 우리 버몬트인은 수도 논쟁에서 배제되었으며, 수가 많지 않음에도 우리의 공동의 복리 아래 단결하여 자긍심을 지키고 있습니다. 우리 경제는 지역 지도자들과 고향으로 돌아온 이들의 정책 덕분에 이미 앞서 나가기 시작했습니다. 이제 우리는 이렇게 요구합니다. 현 국가 정부의 소재지를 버몬트 주도인 몬트필리어로 옮기십시오. 그렇지 않으면 이른바 \\"새 국가\\"의 한 부분을 통째로 내친 결과를 감당해야 할 것입니다.\\""
 NEN_event.5.o1: "뭐... 그러지?"
 NEN_event.5.o2: "수도가 어디든 누가 신경이나 쓰나?"
 NEN_event.6.t: "치솟는 긴장"
 NEN_event.6.d: "사태가 눈덩이처럼 불어나기 시작하자 양측 모두 병력을 조직하고 최악에 대비하기 시작했습니다. 성냥에 언제 불이 붙을지는 신만이 알지만, 우리가 아직 어둠에서 벗어나지 못했다는 점은 분명합니다."
 NEN_event.6.o1: "이 고통은 언제 끝나는가?"
 NEN_event.7.t: "그린 마운틴 반군"
 NEN_event.7.d: "버몬트 주 전역의 술렁임이 새어 나왔고, 그들이 스스로를 \\"그린 마운틴 반란\\"이라 칭했다는 소문이 돕니다. 이는 분명 그들이 이용하려는 민심 얻기용 헛소리이며, 우리는 속지 않을 것입니다."
 NEN_event.7.o1: "그 산을 두더지 굴로 만들어 주겠다"
 NEN_event.8.t: "국가 동원"
 NEN_event.8.d: "우리는 자유의 문턱에 서 있지만, 이른바 \\"뉴잉글랜드 정부\\"가 우리에 맞서 동원을 시작하면서 억압의 망령이 닥쳐왔습니다. 우리는 국가와 국민, 그리고 얼마 되지 않는 산업을 결집시켜 굳건히 버텨야 합니다. 우리는 다시 한 번 자유로워질 것이기 때문입니다."
 NEN_event.8.o1: "전선을 사수하라!"
 NEN_event.9.t: "그린 마운틴 반란"
 NEN_event.9.d: "대화가 더 이상 통하지 않아 무기를 들 수밖에 없는 때가 왔습니다. 이 터무니없는 사태를 이번에 완전히 끝냅시다."
 NEN_event.9.o1: "몬트필리어로 진군한다!"