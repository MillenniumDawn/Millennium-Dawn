 UKR_interlegion_2: "Призыв §Y2-го Грузинского Интернационального Легиона§! на фронт"
 UKR_interlegion_3: "Призыв §YГрузинского Национального Легиона§! на фронт"
 UKR_interlegion_5: "Призыв §YБатальона имени Хамзата Гелаева§! на фронт"
 UKR_interlegion_7: "Призыв §YБатальона имени Имама Шамиля§! на фронт"
