 RULE_OPTION_THE_GREAT_REBELLION: "大反乱"
 RULE_OPTION_THE_GREAT_REBELLION_AI_DESC: "政治的・個人的な利害関係を持つ勢力が競い合い、国は徐々に分断されつつある。一般市民の間では無関心が広がり、危機的な状況に陥りかねないほどになっている。投票差がますます縮まっているという噂や、再集計の可能性が、アメリカ国民に恐怖と猜疑心を抱かせている。しかし、まさかそんなことが起こるはずがない。何しろ、それは実質的に統計上の異常値に過ぎないのだから……なあ……そうだろう？"
