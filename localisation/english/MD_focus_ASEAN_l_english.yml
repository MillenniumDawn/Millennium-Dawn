l_english:

 ASEAN_focus_completed_tt: "Already completed by an ASEAN member."

 ASEAN_bali_concord_ii: "The Bali Concord"
 ASEAN_bali_concord_ii_desc: "Bali, October. The Bangkok Declaration of 1967 is thirty-six years behind us, and it has never once been asked to do the things a serious organisation does. The Concord announces three Communities where there was only a summit calendar and commits us to build each. Political-Security. Economic. Socio-Cultural. What the words mean in practice will be discovered by the members who have to build them."

 ASEAN_asean_charter: "The ASEAN Charter"
 ASEAN_asean_charter_desc: "Signed at the summit in Singapore, in force fourteen months later. The Charter gives the Association a legal personality it never had, codifies consensus as Article 20, and preserves the escape valve for economic cooperation as Article 21: Minus X, willing members only. The bloc stops being a series of communiqués and becomes an institution. The tests will come."

 ASEAN_flexible_engagement_debate: "The Interference Question"
 ASEAN_flexible_engagement_debate_desc: "Non-interference is the founding taboo, and it has begun to strain. Rangoon looks the other way at the Rohingya. The refugees who cross the Thai border do not respect the Charter's language. Surin Pitsuwan tabled the question a decade ago in Manila and lost nine to one. The question is back on the table. The vote will not be unanimous. Either outcome sets the ceiling for what this bloc can do about its own members."

 ASEAN_uphold_non_interference: "The ASEAN Way Holds"
 ASEAN_uphold_non_interference_desc: "Sovereignty is inviolable, and no member state comments on another's internal affairs. The doctrine is what keeps Cambodia and Laos in the tent and the summits polite. It is also what allowed the region to look away from Rangoon for the better part of two decades. We choose the discipline of silence, and the silence is what the Charter now calls consensus."

 ASEAN_flexible_engagement: "Voice Where It Matters"
 ASEAN_flexible_engagement_desc: "The bloc adopts what Surin Pitsuwan proposed and could not sell. A reserved right to comment on a member's crisis when it spills outward. Refugee flows count. Junta calendars count. The autocrats will not thank us for it, and the new authority will not be used lightly. That is the point."

 ASEAN_empower_secretariat: "Jakarta's Mandate"
 ASEAN_empower_secretariat_desc: "Every serious institution has a headquarters and a staff. Ours has Jakarta and a permanent budget crisis. Empower the Secretariat with drafting authority, senior civil servants seconded from every capital, and enough of a purse to convene a meeting without asking Singapore for cab fare. Surin's tenure as Secretary-General showed what the office could do. The office is what should be built next."

 ASEAN_summit_calendar: "The Calendar Becomes an Institution"
 ASEAN_summit_calendar_desc: "Two summits a year, alphabetical chair rotation, a working ministerial track between them. Small members get a year in the driver's seat. Malaysia has done it repeatedly. Laos and Cambodia will do it too, and the region will treat their agenda-setting years with roughly as much seriousness as it treats Indonesia's."

 ASEAN_dispute_settlement_protocol: "A Way to Disagree"
 ASEAN_dispute_settlement_protocol_desc: "The Enhanced Dispute Settlement Protocol is signed with ceremony and has never once been invoked in the two decades since. Every Preah Vihear round, every Sabah note-verbale, every gas-field standoff at Ambalat has gone to bilateral talks or to the Hague. Sign the thing that lets us actually use it."

 ASEAN_aichr: "AICHR"
 ASEAN_aichr_desc: "The Intergovernmental Commission on Human Rights was designed to be visible and toothless, which it is. A stronger AICHR would embarrass some of us and give the others a mandate for the awkward conversations. The Secretariat wants it. The Cambodian delegation does not. The vote will hold, narrowly."

 ASEAN_found_the_court: "The ASEAN Court of Justice"
 ASEAN_found_the_court_desc: "A court that binds. The Dispute Settlement Protocol is a mechanism; this is the body that would use it. Every member's overlapping South China Sea claim, every unresolved border, becomes a legal question instead of a fleet question. Manila had a Hague ruling in hand and could not persuade the bloc to cite it. That will be a harder position to hold with our own court on record."

 ASEAN_free_trade_area: "AFTA in Working Order"
 ASEAN_free_trade_area_desc: "The Free Trade Area was declared in 1992 and has spent every year since limping toward its own tariff schedule. AFTA works on paper and half-works at the border. The signatories are the ASEAN-6: Brunei, Indonesia, Malaysia, the Philippines, Singapore, Thailand. None of us are willing to admit the customs union is not yet a customs union. Fix it."

 ASEAN_revise_cept: "Modernise the CEPT"
 ASEAN_revise_cept_desc: "The Common Effective Preferential Tariff scheme is the machinery under AFTA. It is old. It carves out too many exemptions, treats CLMV timelines as sacred, and does not know what to do with services. Rewrite it. Everyone signs the new schedule; a handful, quietly, will keep their old exemptions anyway."

 ASEAN_chiang_mai_initiative: "Chiang Mai"
 ASEAN_chiang_mai_initiative_desc: "In 1997 the region ran out of dollars and had to negotiate with the IMF. That will not happen again. The Initiative signed at the ADB meeting in Chiang Mai builds a bilateral currency-swap network across ASEAN+3 that lets each member borrow the region's credit before it borrows the Fund's. The Tom Yum Kung Crisis is our reason. The next crisis, whenever it comes, is our test."

 ASEAN_atiga: "Zero Tariffs"
 ASEAN_atiga_desc: "The ASEAN Trade in Goods Agreement takes intra-bloc tariffs to zero for the ASEAN-6. The CLMV latecomers get another five years. Twenty-three items across all ten members remain sensitive: sugar in the Philippines, rice everywhere, tobacco in Indonesia, and stay carved out on general principle. AFTA finally means what it says."

 ASEAN_cmim_multilateralise: "The Common Pool"
 ASEAN_cmim_multilateralise_desc: "The bilateral swaps built at Chiang Mai worked in theory. When they were tested in the global crisis they were found to be a tangle. Multilateralisation converts the network into a $120bn common pool with a single trigger and a single surveillance office, AMRO, in Singapore. The IMF, still, is the lender of last resort. The distance to it is now longer."

 ASEAN_single_window: "The Single Window"
 ASEAN_single_window_desc: "Every trade shipment across a member border currently clears five separate customs regimes with five separate forms. The Single Window is a single electronic clearance visible to all ten capitals in real time. Practical, unglamorous, and the single largest reduction in the actual cost of cross-border trade the AEC will deliver."

 ASEAN_open_skies: "Open Skies"
 ASEAN_open_skies_desc: "The Multilateral Agreement on Air Services fully liberalises passenger air travel between our capital cities. AirAsia was built anticipating this. Vietnam Airlines is prepared for it. Garuda Indonesia is not, but will be forced to prepare. The tourism economy grows. The flag carriers of the smaller members are asked questions their boards would rather not answer."

 ASEAN_power_grid: "The ASEAN Power Grid"
 ASEAN_power_grid_desc: "Surplus hydro sits in Laos and Yunnan, geothermal in Sumatra, solar potential across every equatorial member. Demand centres sit in Singapore, Bangkok, Jakarta, Ho Chi Minh City. The Grid interconnects them. The Laos-Thailand-Malaysia-Singapore pilot has been proving the concept for years. Scale the pilot, and the region stops burning imported LNG to keep its capitals lit."

 ASEAN_singapore_kunming_rail: "The Singapore-Kunming Rail Link"
 ASEAN_singapore_kunming_rail_desc: "The mainland rail corridor from Singapore through Kuala Lumpur, Bangkok, Vientiane, up into Kunming. China has built its half of the Laos segment. The sections south of that have been under discussion since the 1990s and half-built ever since. Finish it. The mainland becomes a single logistics corridor; the maritime members will need to reconsider the terms of their competition."

 ASEAN_asean_economic_community: "The AEC"
 ASEAN_asean_economic_community_desc: "The ASEAN Economic Community, declared with fireworks at the December summit. It is not the EU single market and does not pretend to be. Labour and capital move less freely than trade in goods, and the harmonisation timelines are aspirational. Six hundred and sixty million people, five trillion dollars of combined GDP, one production base. Real, if incomplete."

 ASEAN_hub_or_market_fork: "Depth or Reach"
 ASEAN_hub_or_market_fork_desc: "The AEC is done. The next decade goes one of two ways. Deeper: harmonise our labour markets, our banking sectors, our services trade, until the ASEAN of 660 million is really one economy. Wider: sit at the head of every FTA negotiation from RCEP onward and rent the bloc's chair to whoever will pay for it. Both are defensible. They are opposite."

 ASEAN_external_fta_hub: "The Hub Strategy"
 ASEAN_external_fta_hub_desc: "The bloc chairs everything. ASEAN+3, +6, +8, the RCEP negotiations, every regional trade round. The chair is worth more to us than any harmonisation project would be. Singapore likes this. The Secretariat likes it more. Deep integration waits for a decade we do not yet see."

 ASEAN_deep_single_market: "A True Single Market"
 ASEAN_deep_single_market_desc: "Four freedoms: goods, services, capital, labour. The AEC delivers the first; the others are aspirational blueprint language. Adopting them for real means a Singaporean engineer takes a job in Jakarta the same way a Rotterdam engineer takes one in Munich. The CLMV wage floors will scream. So will the Filipino labour ministries. The prize on the other side is a monetary union that could actually work."

 ASEAN_asian_currency_unit: "The ACU"
 ASEAN_asian_currency_unit_desc: "The Asian Currency Unit, drafted at the ADB by Haruhiko Kuroda and never adopted. A trade-weighted basket of member currencies, then a common unit of account, then a currency. The economic case is straightforward: our trade is already denominated in dollars we do not print. The political case has never been available. It is now."

 ASEAN_political_security_community: "The APSC"
 ASEAN_political_security_community_desc: "The Political-Security Community was declared at Bali II and given a Blueprint years later. Internal cooperation on counter-terror, disaster response, the Malacca patrols. External architecture through the ARF, the +3, the East Asia Summit, ADMM-Plus. One Community, one workplan. Everything downstream reports to it."

 ASEAN_arf: "The ASEAN Regional Forum"
 ASEAN_arf_desc: "The ARF is our first attempt at a security dialogue with the great powers on our terms and our calendar. Twenty-seven members: the ten of us, the +3, the +8, the EU, Pakistan, PNG, Timor-Leste, Bangladesh, Sri Lanka, the DPRK. Confidence-building measures, preventive diplomacy, and, in theory, conflict resolution. In practice it is a room where nothing has to be agreed and no one has to leave. That is its value."

 ASEAN_plus_three: "ASEAN Plus Three"
 ASEAN_plus_three_desc: "The +3 process brings China, Japan and South Korea to the ASEAN table on ASEAN's calendar and under ASEAN's chair. The trilateral history among the three is bad enough that the bloc's neutral ground is more useful than it might sound. Chiang Mai came out of this room. RCEP will. The relationships we broker between Beijing, Tokyo and Seoul are relationships we own leverage over."

 ASEAN_east_asia_summit: "The East Asia Summit"
 ASEAN_east_asia_summit_desc: "Kuala Lumpur, December. The first EAS adds India, Australia and New Zealand to the ASEAN+3 table. Eighteen countries; ASEAN in the chair; the largest strategic-dialogue forum in Asia. The small states of Southeast Asia are setting the room where China, Japan, India and the western Pacific meet each other. This is what centrality means in a single sentence."

 ASEAN_extend_eas_us_russia: "Widen the Summit"
 ASEAN_extend_eas_us_russia_desc: "Bali, November. The East Asia Summit widens to include the United States and Russia. Both patrons at our table, both under our chair. Every strategic question in the western Pacific is now discussed in a room the bloc convenes. Whether the room can decide anything is a separate question. Whether it exists at all is the point."

 ASEAN_rcep: "RCEP"
 ASEAN_rcep_desc: "The Regional Comprehensive Economic Partnership. Fifteen countries, thirty percent of global GDP, the largest trade agreement on earth. Eight years of negotiations, all chaired by us. India walked at the last minute. China, Japan, South Korea, Australia and New Zealand signed. The convening-power racket has cashed its largest cheque."

 ASEAN_declaration_scs: "The Declaration on the South China Sea"
 ASEAN_declaration_scs_desc: "Phnom Penh, November. Four claimants among us: Vietnam, the Philippines, Malaysia, Brunei. China across the table. The Declaration on Conduct freezes reclamation and calls for restraint. It has no enforcement, no timetable, no penalty. The reefs will continue to grow. The declaration is still the reason the reef question is discussed in the room at all."

 ASEAN_counterterrorism: "After Bali"
 ASEAN_counterterrorism_desc: "The Kuta bombing kills 202 in October. Jemaah Islamiyah names itself out loud. The Convention on Counter Terrorism follows five years later and formalises what the intelligence services have been doing since the same week Kuta burned: sharing signals, coordinating arrests, tracing financing. The convention is a treaty. The cooperation was already there."

 ASEAN_malacca_patrols: "The Malacca Patrols"
 ASEAN_malacca_patrols_desc: "MALSINDO: Malaysia, Singapore, Indonesia, plus Thailand a year later. Coordinated patrols in the busiest shipping strait on earth. Piracy incidents fall from over a hundred a year to single digits within a decade. This is ASEAN security cooperation actually working, without the language of alliance and without an American ship in sight."

 ASEAN_hadr: "The AHA Centre"
 ASEAN_hadr_desc: "The Boxing Day tsunami killed a quarter of a million people. Every member with a coastline was hit, and the aid arrived in the wrong sequence to the wrong airports because no one was coordinating. AADMER is the treaty; the AHA Centre in Jakarta is the operations room. Every regional disaster since has run through it: Yolanda, Nargis, Palu, Lombok."

 ASEAN_admm: "The Defence Ministers' Meeting"
 ASEAN_admm_desc: "Kuala Lumpur, May. Ten defence ministers around one table for the first time. ADMM is not an alliance and does not intend to become one. It coordinates disaster response, counter-terror, maritime security. The alliance question is elsewhere. This room is where the practical work happens."

 ASEAN_admm_plus: "ADMM-Plus"
 ASEAN_admm_plus_desc: "Hanoi, October. The eight dialogue partners join the ADMM table: the United States, China, Russia, India, Japan, South Korea, Australia, New Zealand. Working groups on counter-piracy, HADR, peacekeeping, cyber. The most senior defence gathering in Asia where the American and Chinese ministers are compelled by the seating chart to speak to each other. That, alone, is worth the exercise."

 ASEAN_first_joint_exercise: "The Solidarity Exercise"
 ASEAN_first_joint_exercise_desc: "The first ASEAN-wide military exercise in the bloc's history. The Natuna Sea is the venue; the choice of venue is the message. Non-combat, joint HADR and search-and-rescue drills, no live fire. Symbolic. Symbols are what ASEAN specialises in, and this one has been unavailable to us for the entire life of the Association."

 ASEAN_seanwfz_pressure_p5: "The Bangkok Treaty's Missing Signatures"
 ASEAN_seanwfz_pressure_p5_desc: "The Southeast Asian Nuclear Weapon Free Zone Treaty binds every member and every warhead we might ever host on our soil. The P5 have refused to sign the protocol since 1997 because their submarines pass through the zone with weapons aboard. Push them. Africa got Pelindaba across the line eventually. The precedent works."

 ASEAN_alignment_question: "Which Way We Face"
 ASEAN_alignment_question_desc: "Beijing writes the largest cheques. Washington signs the treaty guarantees. Neither is asking politely any more. Every capital in the bloc will be pressed to declare, and no capital can afford to. The doctrine each government picks is its own; the bloc pays the price in cohesion when the picks go badly. The question is on the table."

 ASEAN_align_with_china: "The Chinese Doctrine"
 ASEAN_align_with_china_desc: "The equipment is cheaper, the terms are softer, and the Belt and Road has already funded the port and the railway. Beijing has been the largest investor in the mainland ASEAN economies for years. The reef question stays awkward and quiet. The rest of the bloc will not like this choice, and will spend cohesion on saying so."

 ASEAN_pursue_self_reliance: "Bebas Aktif"
 ASEAN_pursue_self_reliance_desc: "The Four No's from Hanoi: no alliances, no foreign bases, no siding, no threats. They hold up better than any of us expected. Jakarta's bebas aktif is older than Sukarno. Building a domestic defence industry that lets us mean the words is slower than picking a patron, and costs more. It is also the only path that does not tax our standing in Manila or Phnom Penh."

 ASEAN_align_with_america: "The American Doctrine"
 ASEAN_align_with_america_desc: "The Mutual Defence Treaty with Manila dates to 1951. Bangkok's alliance to 1954. Singapore has arrangements the US Navy relies on and does not talk about. Interoperability, high-end kit, freedom-of-navigation cover. The bill is that we are in whatever war Washington starts next, and the reef question becomes the reef war. The rest of the bloc will not thank us."

 ASEAN_defense_community: "The ASEAN Defence Community"
 ASEAN_defense_community_desc: "The bloc that refused to be an alliance is asked to become one. The trigger is not our choice: a war on our doorstep, a member's territory contested, a patron gone missing. The answer is not automatic. Signing the pact overrides fifty-six years of refusal; the pact is one act. The wars it will oblige us to enter are the price. Manila voted for this. Vientiane will need convincing."

 ASEAN_admission_protocols: "Article Six"
 ASEAN_admission_protocols_desc: "The Charter's admission clause: full consensus, established procedures. The CLMV expansions were the working precedent, and none of them were quick. Formalise the machinery so we can invite when we mean to invite, and block when we mean to block. Singapore has strong views about the second half."

 ASEAN_iai_narrow_gap: "The Initiative for ASEAN Integration"
 ASEAN_iai_narrow_gap_desc: "The IAI is the programme through which the ASEAN-6 pay to bring the CLMV up. Roads, ports, customs training, university scholarships. Unglamorous work funded largely by Japan and quietly by the bank in Manila. Without it every new admission dilutes what the AEC is worth to everyone. Fund it properly this time."

 ASEAN_admit_east_timor: "Admit Timor-Leste"
 ASEAN_admit_east_timor_desc: "Dili applied in 2011. Singapore blocked, then abstained, then negotiated, then blocked again, for the better part of a decade over capacity concerns none of the CLMV members would have survived scrutiny on. In-principle accession is agreed at the Phnom Penh summit. Full membership follows at the Jakarta chairmanship. Timor becomes the eleventh."

 ASEAN_admit_png: "Admit Papua New Guinea"
 ASEAN_admit_png_desc: "Port Moresby has been an observer since 1976 and a Special Observer since 1981, and periodically applies for full membership without pressing. Geographic contiguity is not an argument. Melanesian identity is a different argument. The Indonesian border in Sepik is the awkward question no one raises at the summit."

 ASEAN_bimstec_absorption: "Absorb the Bay of Bengal"
 ASEAN_bimstec_absorption_desc: "Bangladesh and Sri Lanka have their own bloc. BIMSTEC, which India runs and which has never quite worked. Offering them ASEAN membership is offering to absorb their entire venue. Dhaka is interested. Colombo is desperate. Delhi will consider this an act of soft encroachment and will be correct. The trade case is real. The political case has never been made."

 ASEAN_pacific_expansion: "The Pacific Members"
 ASEAN_pacific_expansion_desc: "Fiji, the Solomon Islands, PALAU, Vanuatu, Tonga, the Marshalls. Their real venue is the Pacific Islands Forum. The geography barely holds together. What holds it together is that ASEAN is the only regional body offering them meaningful membership that is not, in name, a Chinese initiative. The Pacific has noticed."

 ASEAN_asean_11_new_governance: "Governance for Eleven"
 ASEAN_asean_11_new_governance_desc: "Timor-Leste's accession changes the quorum arithmetic. Chair rotation becomes an eleven-year cycle. The founding six of the ASEAN-6 remain the quorum core; every threshold in the Charter that used to say five now says six or seven. Practical housekeeping, done at the summit that closes the wave."

 ASEAN_indo_pacific_pole: "The Indo-Pacific Pole"
 ASEAN_indo_pacific_pole_desc: "ASEAN of twenty-plus members, from the Bay of Bengal to the western Pacific. The third pole of Indo-Pacific power, alongside the US alliance system and the Sino-Russian axis. Fantasy on any timeline that does not begin with everything gating this focus. The fantasy is what we have built toward. The bloc becomes the region."
