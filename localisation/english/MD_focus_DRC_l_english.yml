 MDRC_union_integrated_administration: "Integrated Union Administration"
 MDRC_union_integrated_administration_desc: "Three completed regional integration programmes and an expanded charter support a coordinated administration. Regional integration remains a separate choice; this office does not annex further territory."
 MDRC_consolidate_union: "Consolidate the Union Administration"
 MDRC_consolidate_union_desc: "After expanding the union and directly integrating at least three regions, establish a permanent common administrative service. Costs 2 treasury and 100 political power. Reduces bureaucracy costs by 3% and adds 2% stability and 2% productivity growth."
 MDRC_union_projects: "Regional Unions and Integration"
 MDRC_union_projects_desc: "Proclaim an ideological regional union using directly owned or puppet-held territory. Formation preserves puppets. Accession requires a separate offer and consent; territorial integration requires direct ownership and a paid 180-day programme. Listed regions use the installed 2000-map core-state definitions."
 mdrc_union.1.t: "An Offer of Voluntary Accession"
 mdrc_union.1.d: "Kinshasa invites our government to dissolve its separate sovereign administration and accede directly to the regional union. Acceptance transfers our territory and armed forces to DRC. Refusal preserves our current subject relationship and territory. This offer is separate from the earlier proclamation of a union."
 mdrc_union.1.a: "Accept direct accession to the union."
 mdrc_union.1.b: "Retain our separate administration."
 MDRC_depth_industry_review_bonus: "Industrial Modernization Review"
 MDRC_active_staff_exercises: "Conduct Joint Staff Exercises"
 MDRC_active_staff_exercises_desc: "Six months of joint exercises add 2% organization and 0.5 percentage points of reinforcement rate, at 4% higher military spending. Also grants 20 army experience and 25 command power."
 MDRC_programme_decision_staff_exercises: "Conduct Joint Staff Exercises"
 MDRC_programme_decision_staff_exercises_desc: "Six months of joint exercises add 2% organization and 0.5 percentage points of reinforcement rate, at 4% higher military spending. Also grants 20 army experience and 25 command power. Costs 0.5 treasury and 60 political power. Can be commissioned again after 365 days; its temporary spirit does not create separate stacking copies."
 MDRC_programme_decision_staff_exercises_tt: "Unlocks Conduct Joint Staff Exercises: a funded repeatable programme costing 0.5 treasury and 60 political power, with a 365-day cooldown."
 MDRC_active_air_readiness: "Fund Air-Service Readiness"
 MDRC_active_air_readiness_desc: "Six months of inspections reduce accident risk by 5% and improve air mission efficiency by 3%, at 4% higher military spending. Grants 20 air experience and up to 10,000 fuel."
 MDRC_programme_decision_air_readiness: "Fund Air-Service Readiness"
 MDRC_programme_decision_air_readiness_desc: "Six months of inspections reduce accident risk by 5% and improve air mission efficiency by 3%, at 4% higher military spending. Grants 20 air experience and up to 10,000 fuel. Costs 0.5 treasury and 60 political power. Can be commissioned again after 365 days; its temporary spirit does not create separate stacking copies."
 MDRC_programme_decision_air_readiness_tt: "Unlocks Fund Air-Service Readiness: a funded repeatable programme costing 0.5 treasury and 60 political power, with a 365-day cooldown."
 MDRC_active_river_exercises: "Coordinate River and Coastal Exercises"
 MDRC_active_river_exercises_desc: "Six months of exercises improve naval coordination and convoy escort efficiency by 3%, at 3% higher military spending. Grants 20 naval experience and up to 5,000 fuel."
 MDRC_programme_decision_river_exercises: "Coordinate River and Coastal Exercises"
 MDRC_programme_decision_river_exercises_desc: "Six months of exercises improve naval coordination and convoy escort efficiency by 3%, at 3% higher military spending. Grants 20 naval experience and up to 5,000 fuel. Costs 0.25 treasury and 50 political power. Can be commissioned again after 365 days; its temporary spirit does not create separate stacking copies."
 MDRC_programme_decision_river_exercises_tt: "Unlocks Coordinate River and Coastal Exercises: a funded repeatable programme costing 0.25 treasury and 50 political power, with a 365-day cooldown."
 MDRC_active_industry_review: "Commission an Industrial Modernization Review"
 MDRC_active_industry_review_desc: "A 270-day programme adds 2% civilian-factory productivity and 5% efficiency growth, at 4% higher bureaucracy costs. Grants one 25% industrial research bonus."
 MDRC_programme_decision_industry_review: "Commission an Industrial Modernization Review"
 MDRC_programme_decision_industry_review_desc: "A 270-day programme adds 2% civilian-factory productivity and 5% efficiency growth, at 4% higher bureaucracy costs. Grants one 25% industrial research bonus. Costs 1.5 treasury and 80 political power. Can be commissioned again after 730 days; its temporary spirit does not create separate stacking copies."
 MDRC_programme_decision_industry_review_tt: "Unlocks Commission an Industrial Modernization Review: a funded repeatable programme costing 1.5 treasury and 80 political power, with a 730-day cooldown."
 MDRC_active_public_services: "Fund a Public-Service Delivery Cycle"
 MDRC_active_public_services_desc: "One year of delivery monitoring adds 2.5% stability and 2% productivity growth, at 4% higher bureaucracy costs. Returns 10 political power when commissioned."
 MDRC_programme_decision_public_services: "Fund a Public-Service Delivery Cycle"
 MDRC_programme_decision_public_services_desc: "One year of delivery monitoring adds 2.5% stability and 2% productivity growth, at 4% higher bureaucracy costs. Returns 10 political power when commissioned. Costs 1 treasury and 75 political power. Can be commissioned again after 730 days; its temporary spirit does not create separate stacking copies."
 MDRC_programme_decision_public_services_tt: "Unlocks Fund a Public-Service Delivery Cycle: a funded repeatable programme costing 1 treasury and 75 political power, with a 730-day cooldown."
 MDRC_active_literacy_refresher: "Launch an Adult-Literacy Refresher"
 MDRC_active_literacy_refresher_desc: "Raises actual literacy by one percentage point, up to 100%, and funds a year of 1% research speed and productivity growth at 3% higher bureaucracy costs. Available below 99% literacy."
 MDRC_programme_decision_literacy_refresher: "Launch an Adult-Literacy Refresher"
 MDRC_programme_decision_literacy_refresher_desc: "Raises actual literacy by one percentage point, up to 100%, and funds a year of 1% research speed and productivity growth at 3% higher bureaucracy costs. Available below 99% literacy. Costs 0.75 treasury and 50 political power. Can be commissioned again after 730 days; its temporary spirit does not create separate stacking copies."
 MDRC_programme_decision_literacy_refresher_tt: "Unlocks Launch an Adult-Literacy Refresher: a funded repeatable programme costing 0.75 treasury and 50 political power, with a 730-day cooldown."
 MDRC_active_regional_summit: "Host a Regional Reconstruction Summit"
 MDRC_active_regional_summit_desc: "Improves relations with existing peaceful participants. For 180 days, trade opinion rises by 4% and diplomatic maintenance falls by 10%, while bureaucracy costs rise by 2%."
 MDRC_programme_decision_regional_summit: "Host a Regional Reconstruction Summit"
 MDRC_programme_decision_regional_summit_desc: "Improves relations with existing peaceful participants. For 180 days, trade opinion rises by 4% and diplomatic maintenance falls by 10%, while bureaucracy costs rise by 2%. Costs 0.5 treasury and 75 political power. Can be commissioned again after 365 days; its temporary spirit does not create separate stacking copies."
 MDRC_programme_decision_regional_summit_tt: "Unlocks Host a Regional Reconstruction Summit: a funded repeatable programme costing 0.5 treasury and 75 political power, with a 365-day cooldown."
 MDRC_reform_programmes: "Advanced Reform Programmes"
 MDRC_reform_programmes_desc: "Major branch conclusions unlock funded follow-up programmes. Each has a stated cost, duration and cooldown. Benefits come with ongoing spending while the programme is active."
 MDRC_LDK_government_1: "Revolutionary Government"
 MDRC_LDK_government_1_desc: "Emergency presidential control purchases coordination at the cost of public trust."
 MDRC_LDK_government_2: "Consolidated Revolutionary State"
 MDRC_LDK_government_2_desc: "A salaried administration supports a still-centralized presidency."
 MDRC_LDK_government_3: "Constitutional Revolutionary State"
 MDRC_LDK_government_3_desc: "A speculative constitutional settlement establishes predictable administration."
 MDRC_LDK_presidential: "Presidential Direction"
 MDRC_LDK_presidential_desc: "Executive speed comes with restricted political participation."
 MDRC_LDK_congress: "Revolutionary Congress"
 MDRC_LDK_congress_desc: "Collective review checks the presidency but slows executive decisions."
 MDRC_LDK_cpp: "People's Power Committees"
 MDRC_LDK_cpp_desc: "Local committees mobilize support while surveillance undermines confidence."
 MDRC_LDK_development_1: "Costly Reconstruction"
 MDRC_LDK_development_1_desc: "Reconstruction initially ties up productive capacity."
 MDRC_LDK_development_2: "National Development Programme"
 MDRC_LDK_development_2_desc: "Restored transport supports modest productivity gains."
 MDRC_LDK_development_3: "Economic Sovereignty"
 MDRC_LDK_development_3_desc: "A diversified production base reduces supply vulnerability."
 MDRC_LDK_mining: "Reorganized Gecamines"
 MDRC_LDK_mining_desc: "Audited investment improves extraction while mine rehabilitation consumes construction capacity."
 MDRC_LDK_enterprise: "Rehabilitated State Enterprises"
 MDRC_LDK_enterprise_desc: "Modern maintenance procedures improve industrial efficiency."
 MDRC_LDK_tax: "Reform the National Tax Administration"
 MDRC_LDK_tax_desc: "Audit receipts and make assessment procedures consistent. This lowers corruption and supports the revenue service without secretly changing either tax rate.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_economy$§!."
 MDRC_LDK_fac_1: "Loyal but Fragmented FAC"
 MDRC_LDK_fac_1_desc: "The army remains loyal but lacks common command procedures."
 MDRC_LDK_fac_2: "Reorganized FAC"
 MDRC_LDK_fac_2_desc: "Standardized command improves organization and recovery."
 MDRC_LDK_fac_3: "Professional Congolese Land Forces"
 MDRC_LDK_fac_3_desc: "Logistics and training now support effective formations."
 MDRC_LDK_purge: "Purge Disloyal Military Officers"
 MDRC_LDK_purge_desc: "Investigations displace experienced staff as well as suspect appointees. Greater political control comes with lost experience and a year of reduced organization; named historical officers are not arbitrarily accused.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_loyalty$§!."
 MDRC_LDK_defence: "Katanga Defensive Planning"
 MDRC_LDK_defence_desc: "Defensive exercises improve prepared positions."
 MDRC_LDK_academies: "Establish National Military Academies"
 MDRC_LDK_academies_desc: "Fund staff courses, map reading and logistics instruction. Academies improve experience generation rather than conjuring elite formations.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_land_forces$§!."
 MDRC_LDK_mobilisation: "Expanded Recruitment"
 MDRC_LDK_mobilisation_desc: "Additional recruits place a burden on training and production."
 MDRC_LDK_offensive: "Prepared Counteroffensive"
 MDRC_LDK_offensive_desc: "A short operational effort draws on stockpiles and fuel."
 MDRC_LDK_escalation: "Regional Confrontation"
 MDRC_LDK_escalation_desc: "Confrontation strengthens resolve while disrupting civilian production."
 MDRC_LDK_security: "Regional Security Framework"
 MDRC_LDK_security_desc: "Military liaison reduces supply friction with neighboring governments."
 MDRC_LDK_ddr: "Negotiated Reintegration"
 MDRC_LDK_ddr_desc: "Demobilization buys stability but temporarily dilutes command cohesion."
 MDRC_LDK_justice: "Centralized Revolutionary Justice"
 MDRC_LDK_justice_desc: "Coercive security consolidates authority at a political and economic cost."
 MDRC_LDK_communities: "Rebuild War-Damaged Communities"
 MDRC_LDK_communities_desc: "Support clinics, water services and housing repairs in recovered districts. A modest enduring stability benefit follows paid reconstruction, not an instant end to wartime suffering.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_reintegrate$§!."
 MDRC_LDK_united: "A Reunified Republic"
 MDRC_LDK_united_desc: "Restored civil authority provides a durable peace dividend."
 MDRC_LDK_permanent_1: "Permanent Revolutionary Presidency"
 MDRC_LDK_permanent_1_desc: "An exclusive revolutionary government concentrates executive authority."
 MDRC_LDK_permanent_2: "Disciplined Revolutionary Republic"
 MDRC_LDK_permanent_2_desc: "Industrial direction and presidential authority reinforce one another."
 MDRC_LDK_institutional_1: "Institutionalized Revolution"
 MDRC_LDK_institutional_1_desc: "Constitutional procedures replace personal interventions."
 MDRC_LDK_institutional_2: "Institutionalized Revolutionary Republic"
 MDRC_LDK_institutional_2_desc: "Predictable institutions improve both education and administration."
 MDRC_LDK_reconstruction_1: "National Reconstruction Cabinet"
 MDRC_LDK_reconstruction_1_desc: "A broad cabinet directs resources away from military mobilization."
 MDRC_LDK_reconstruction_2: "National Reconstruction Government"
 MDRC_LDK_reconstruction_2_desc: "A negotiated government channels the peace dividend into civilian growth."
 MDRC_LDK_survives: "The Revolutionary President Survives"
 MDRC_LDK_survives_desc: "Alternate history: Laurent-Desire Kabila has survived the assassination attempt. His survival preserves the presidency but leaves its legitimacy, fragmented army and wartime economy unresolved. Reorganizing the state will demand choices and resources rather than an effortless restoration."
 MDRC_LDK_afdl: "The Legacy of the AFDL"
 MDRC_LDK_afdl_desc: "The AFDL brought Kabila to power in 1997, but its wartime coalition fractured. Reconnect veterans and civilian administrators around a new political organization; this is a proposed revival, not a claim that the original alliance survived intact.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_survives$§!."
 MDRC_LDK_consolidate: "Consolidate the Revolutionary Government"
 MDRC_LDK_consolidate_desc: "The 1997 constitutional decree concentrated authority in the presidency. In this alternate future, a salaried secretariat will make that authority more effective while retaining its political costs.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_afdl$§!."
 MDRC_LDK_committees: "Reorganize the People's Power Committees"
 MDRC_LDK_committees_desc: "The government introduced People's Power Committees in 1999. Reorganizing them could improve local mobilization, but their surveillance functions carry a real loss of public trust.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_consolidate$§!."
 MDRC_LDK_hewa_bora: "The Ideals of Hewa Bora"
 MDRC_LDK_hewa_bora_desc: "Kabila's long guerrilla past supplies symbols for a new civic education campaign. Applying that legacy to adult education after 2001 is a speculative policy choice, not a documented nationwide programme.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_committees$§!."
 MDRC_LDK_order: "A New Congolese Political Order"
 MDRC_LDK_order_desc: "Prepare an internal debate over personal presidential authority and collective revolutionary institutions. Neither option alone resolves the war or creates a democratic mandate.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_hewa_bora$§!."
 MDRC_LDK_discipline: "Restore Revolutionary Discipline"
 MDRC_LDK_discipline_desc: "Investigate diversion of public funds within the governing coalition. Removing protected intermediaries costs political capital but lowers the actual corruption law by one level.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_order$§!."
 MDRC_LDK_administration: "Reorganize the Central Administration"
 MDRC_LDK_administration_desc: "Fund personnel registers and ministerial accounts. A government that cannot identify its employees cannot reliably finance reconstruction.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_discipline$§!."
 MDRC_LDK_presidential_authority: "Strengthen Presidential Authority"
 MDRC_LDK_presidential_authority_desc: "Alternate history: retain presidential appointment powers. Decisions become faster, but concentration of power keeps an enduring political cost.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_administration$§!."
 MDRC_LDK_national_congress: "The Revolutionary National Congress"
 MDRC_LDK_national_congress_desc: "Alternate history: establish a congress with budget review powers. Collective procedures slow the executive while giving revolutionary institutions a more stable foundation.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_administration$§!."
 MDRC_LDK_afdl_future: "The Future of the AFDL"
 MDRC_LDK_afdl_future_desc: "Reorganize the surviving revolutionary networks as a civilian governing organization. Administrative cadres will replace competing military patronage channels.\n\n§W--------------§!\nRequired earlier focuses:\nComplete §Yany one§! of: §Y$MDRC_LDK_presidential_authority$§!, §Y$MDRC_LDK_national_congress$§!."
 MDRC_LDK_constitution: "A New Constitution for the Congo"
 MDRC_LDK_constitution_desc: "Kabila promised constitutional change, but the 1998 draft never became a settled democratic framework. This focus implements a new, explicitly alternate-history constitutional compromise.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_afdl_future$§!."
 MDRC_LDK_republic: "The Revolutionary Republic"
 MDRC_LDK_republic_desc: "Publish the constitutional settlement and fund civilian access to public records. Legality must extend beyond a proclamation in Kinshasa.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_constitution$§!."
 MDRC_LDK_state: "The Consolidation of the State"
 MDRC_LDK_state_desc: "Make ministry reporting and provincial budgets regular obligations. The state now has the institutional footing to choose its long-term direction.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_republic$§!."
 MDRC_LDK_economy: "Rebuild the Congolese Economy"
 MDRC_LDK_economy_desc: "The war has disrupted tax receipts, transport and investment. Begin a funded rehabilitation plan, accepting a temporary loss of industrial output while essential networks are repaired.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_mandate$§!."
 MDRC_LDK_gecamines: "Reorganize Gecamines"
 MDRC_LDK_gecamines_desc: "Review contracts, maintenance budgets and payrolls at the state mining company. Higher extraction requires rehabilitation expenditure and diverts construction capacity.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_economy$§!."
 MDRC_LDK_katanga: "Restore the Katanga Mining Industry"
 MDRC_LDK_katanga_desc: "Secure and repair Katanga's industrial transport infrastructure. Work can proceed only while the Republic owns and fully controls the state.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_gecamines$§!."
 MDRC_LDK_copper: "Expand Copper Production"
 MDRC_LDK_copper_desc: "Fund equipment and processing improvements in the southern mineral belt. Millennium Dawn represents these outputs through its technology-metals resource category.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_katanga$§!."
 MDRC_LDK_cobalt: "Develop the Cobalt Deposits"
 MDRC_LDK_cobalt_desc: "Expand audited cobalt extraction using MD's technology-metals resource abstraction. Production benefits remain attached to Katanga and will be lost if the state is lost.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_katanga$§!."
 MDRC_LDK_railway: "Rebuild the National Railway Network"
 MDRC_LDK_railway_desc: "Repair Katanga's rail freight terminals and feeder infrastructure. This is a funded regional first phase of a national programme, not an instant transcontinental railway.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_LDK_copper$§!.\nComplete §Y$MDRC_LDK_cobalt$§!."
 MDRC_LDK_river: "Restore the Congo River Transport System"
 MDRC_LDK_river_desc: "Reopen landing stages and maintenance depots along the river. Improved infrastructure in Equateur strengthens the movement of food and civilian freight.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_enterprises$§!."
 MDRC_LDK_enterprises: "Rebuild State-Owned Enterprises"
 MDRC_LDK_enterprises_desc: "Refurbish maintenance services before expanding payrolls. Efficient state enterprises can improve factory output, provided their rehabilitation is paid for.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_tax$§!."
 MDRC_LDK_agriculture: "Strengthen Domestic Agricultural Production"
 MDRC_LDK_agriculture_desc: "Fund storage, extension services and a new agricultural district in government-controlled Equateur. Food security depends on functioning rural institutions.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_enterprises$§!."
 MDRC_LDK_infrastructure: "Expand National Infrastructure Projects"
 MDRC_LDK_infrastructure_desc: "Extend the capital-region power network to support reconstruction. A renewable-energy infrastructure level represents an incremental project, not completion of the entire Inga complex.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_LDK_railway$§!.\nComplete §Y$MDRC_LDK_river$§!."
 MDRC_LDK_heartland: "Industrialize the Congolese Heartland"
 MDRC_LDK_heartland_desc: "Establish a civilian production complex in Katanga. The project requires public funds, political commitment and secure control of the industrial district.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_infrastructure$§!."
 MDRC_LDK_development: "Establish a National Development Programme"
 MDRC_LDK_development_desc: "The preceding investments now support a coordinated development programme. Replace the initial reconstruction strain with modest, sustained output and infrastructure benefits.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_LDK_infrastructure$§!.\nComplete §Y$MDRC_LDK_agriculture$§!."
 MDRC_LDK_independence: "Economic Independence for the Congo"
 MDRC_LDK_independence_desc: "Publish mineral contracts and reduce dependence on opaque intermediaries. Economic sovereignty requires accountable institutions as well as ownership of resources.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_LDK_heartland$§!.\nComplete §Y$MDRC_LDK_development$§!."
 MDRC_LDK_self_sufficient: "A Self-Sufficient Revolutionary Economy"
 MDRC_LDK_self_sufficient_desc: "Alternate history: a more diversified domestic economy reduces vulnerability to disruptions. This remains a modest productive base, not literal independence from all foreign trade.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_independence$§!."
 MDRC_LDK_commander: "Restore the Supreme Command"
 MDRC_LDK_commander_desc: "The armed forces need clear orders and an effective national command liaison. Reorganize the supreme command under the current government without making military reform depend on a presidential succession.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_mandate$§!."
 MDRC_LDK_loyalty: "Reaffirm the Loyalty of the FAC"
 MDRC_LDK_loyalty_desc: "Confirm command appointments and restore pay records. The loyalist officer roster becomes available through the command reorganization programme.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_commander$§!."
 MDRC_LDK_high_command: "Restore the Military High Command"
 MDRC_LDK_high_command_desc: "Reestablish staff reporting around Sylvestre Lwetcha and the available senior officers. Appointment decisions use the actual installed characters and preserve existing experienced commanders.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_loyalty$§!."
 MDRC_LDK_land_forces: "Reorganize the Congolese Land Forces"
 MDRC_LDK_land_forces_desc: "Replace incompatible command procedures with a national standard. The purge penalty continues until its scheduled expiry; organizational reform does not erase that disruption.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_LDK_purge$§!.\nComplete §Y$MDRC_LDK_high_command$§!."
 MDRC_LDK_commands: "Establish New Regional Commands"
 MDRC_LDK_commands_desc: "Assign provincial liaison officers and fund communications equipment. Regional commands need reliable radios before they can coordinate dispersed forces.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_land_forces$§!."
 MDRC_LDK_defensive_line: "Strengthen the Katanga Defensive Line"
 MDRC_LDK_defensive_line_desc: "Prepare fallback positions and defensive exercises in Katanga. Training improves the army's defence while the construction programme requires control of the region.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_commands$§!."
 MDRC_LDK_eastern_front: "Reinforce the Eastern Front"
 MDRC_LDK_eastern_front_desc: "Send infantry weapons, utility vehicles and communications equipment to formations facing the eastern conflict. This supplies units without falsely claiming to have recovered the Kivus.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_commands$§!."
 MDRC_LDK_recruitment: "Expand Military Recruitment"
 MDRC_LDK_recruitment_desc: "Broaden recruitment while acknowledging the training burden and lost civilian workers. The mobilization spirit can be removed through the postwar settlement.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_academies$§!."
 MDRC_LDK_infantry: "Modernize Infantry Equipment"
 MDRC_LDK_infantry_desc: "Purchase and refurbish a substantial infantry equipment package. These are physical weapons, command systems and utility vehicles credited to the stockpile.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_LDK_defensive_line$§!.\nComplete §Y$MDRC_LDK_eastern_front$§!."
 MDRC_LDK_production: "Develop Domestic Military Production"
 MDRC_LDK_production_desc: "Finance a military production workshop in the capital region. Local maintenance and manufacturing require a secure industrial base and substantial public expenditure.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_recruitment$§!."
 MDRC_LDK_allied_forces: "Coordinate with Allied Forces"
 MDRC_LDK_allied_forces_desc: "Angola, Zimbabwe and Namibia backed Kabila's government during the war. Renew liaison with governments that still maintain peaceful relations with Kinshasa.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_LDK_infantry$§!.\nComplete §Y$MDRC_LDK_production$§!."
 MDRC_LDK_counteroffensive: "The Congolese Counteroffensive"
 MDRC_LDK_counteroffensive_desc: "Prepare a limited offensive against the existing Congolese rebel administrations. The operational bonus lasts six months and increases supply consumption; no foreign territory receives free claims or cores.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_allied_forces$§!."
 MDRC_LDK_sovereignty: "Secure the Sovereignty of the Republic"
 MDRC_LDK_sovereignty_desc: "Professional command and maintained supply systems sustain the army beyond one campaign. This institutional reward does not declare territorial reunification complete.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_counteroffensive$§!."
 MDRC_LDK_interference: "Reject Foreign Interference"
 MDRC_LDK_interference_desc: "Foreign intervention helped Kabila reach power and later threatened his government. State a principle of sovereignty while recognizing that the war cannot be solved through rhetoric alone.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_mandate$§!."
 MDRC_LDK_diplomatic_sovereignty: "Reaffirm Congolese Sovereignty"
 MDRC_LDK_diplomatic_sovereignty_desc: "Publish a diplomatic platform focused on internationally recognized Congolese territory. Rival governments may reject it; the declaration creates no foreign claims.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_interference$§!."
 MDRC_LDK_angola: "Strengthen Ties with Angola"
 MDRC_LDK_angola_desc: "Renew liaison with Luanda, whose forces supported the government in the Second Congo War. Cooperation requires that the two governments are not at war.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_diplomatic_sovereignty$§!."
 MDRC_LDK_zimbabwe: "Renew the Zimbabwean Alliance"
 MDRC_LDK_zimbabwe_desc: "Seek a new training and equipment arrangement with Zimbabwe. This improves relations and supplies a paid equipment package without automatically dragging either country into a new war.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_diplomatic_sovereignty$§!."
 MDRC_LDK_namibia: "Reinforce Relations with Namibia"
 MDRC_LDK_namibia_desc: "Maintain military liaison with Namibia and fund joint staff instruction. The relationship brings practical experience, not unconditional military access.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_diplomatic_sovereignty$§!."
 MDRC_LDK_rwanda: "The Future of Relations with Rwanda"
 MDRC_LDK_rwanda_desc: "Choose whether to offer negotiations or escalate the confrontation. Negotiation partners retain the right to refuse; escalation imposes an economic penalty and worsens relations.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_recognition$§!."
 MDRC_LDK_uganda: "Confront Ugandan Influence"
 MDRC_LDK_uganda_desc: "Pursue the diplomatic approach chosen for the Great Lakes. Negotiators renew ceasefire offers; confrontation hardens positions while the diplomatic mission consumes public funds.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_rwanda$§!."
 MDRC_LDK_recognition: "Pursue African Diplomatic Recognition"
 MDRC_LDK_recognition_desc: "Present a sovereign reconstruction programme to regional partners. Recognition improves diplomatic room for manoeuvre without granting automatic leadership of the African Union.\n\n§W--------------§!\nRequired earlier focuses:\nComplete §Yany one§! of: §Y$MDRC_LDK_angola$§!, §Y$MDRC_LDK_zimbabwe$§!, §Y$MDRC_LDK_namibia$§!."
 MDRC_LDK_agreements: "Renegotiate Regional Security Agreements"
 MDRC_LDK_agreements_desc: "Review the wartime security arrangements with Angola, Zimbabwe and Namibia. A liaison budget turns political support into more reliable logistics.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_recognition$§!."
 MDRC_LDK_future: "The Congo Determines Its Future"
 MDRC_LDK_future_desc: "Authorize follow-up talks or renewed security consultations. The decisions remain available after refusal so a single failed offer does not permanently end diplomacy.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_agreements$§!."
 MDRC_LDK_framework: "Establish a Regional Security Framework"
 MDRC_LDK_framework_desc: "Extend border liaison to governments willing to cooperate. On the negotiation route, terminate the economic confrontation penalty; confrontation instead produces additional staff experience.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_LDK_uganda$§!.\nComplete §Y$MDRC_LDK_future$§!."
 MDRC_LDK_order_africa: "A New Central African Diplomatic Order"
 MDRC_LDK_order_africa_desc: "A Congo at peace can pursue a durable regional role. This capstone requires actual peace rather than treating unanswered offers as a settlement.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_framework$§!."
 MDRC_LDK_liberation: "The Liberation of Eastern Congo"
 MDRC_LDK_liberation_desc: "Choose how to restore authority: negotiate demobilization or impose centralized security. This prepares a policy; it does not reward liberation while another country still controls the east.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_mandate$§!."
 MDRC_LDK_kivus: "Restore Authority in the Kivus"
 MDRC_LDK_kivus_desc: "Reopen administrative offices only after both Kivu states are owned and fully controlled by the Republic. Flags and declarations cannot substitute for territorial control.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_liberation$§!."
 MDRC_LDK_reintegrate: "Reintegrate the Rebel Territories"
 MDRC_LDK_reintegrate_desc: "Once the rebel administrations have ceased to exist and the Republic controls its core territory, establish common payrolls. Negotiated integration and coercive restoration retain different political consequences.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_kivus$§!."
 MDRC_LDK_civil_admin: "Reestablish Civil Administration"
 MDRC_LDK_civil_admin_desc: "Fund civilian district records, public notices and administrative salaries in recovered territory. The offices cannot function during continuing foreign occupation.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_kivus$§!."
 MDRC_LDK_transport: "Restore National Transportation"
 MDRC_LDK_transport_desc: "Rebuild Kivu road infrastructure after recovery. Both states must remain under full Congolese control when construction is authorized.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_justice_choice$§!."
 MDRC_LDK_provinces: "Reform the Provincial Governments"
 MDRC_LDK_provinces_desc: "Audit provincial budgets and assign civilian governors under the chosen settlement. The reform reduces corruption while consuming political capital.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_civil_admin$§!."
 MDRC_LDK_mai_mai: "The Future of the Mai-Mai"
 MDRC_LDK_mai_mai_desc: "Negotiate demobilization and supervised recruitment, or demand centralized command. Integration is not automatic innocence: former combatants require a political settlement and screening.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_justice_choice$§!."
 MDRC_LDK_justice_choice: "National Reconciliation or Revolutionary Justice"
 MDRC_LDK_justice_choice_desc: "Implement the chosen postwar policy. Negotiated reconciliation opens a screened 2003 officer-integration programme; centralized justice instead reinforces command and keeps its political costs.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_LDK_communities$§!.\nComplete §Y$MDRC_LDK_provinces$§!."
 MDRC_LDK_reunification: "Reunification of the Republic"
 MDRC_LDK_reunification_desc: "Confirm that all Congolese core states are owned and fully controlled by the Republic and that the rebel administrations no longer exist. Only then is a national reunification dividend justified.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_LDK_transport$§!.\nComplete §Y$MDRC_LDK_mai_mai$§!."
 MDRC_LDK_end_war: "The End of the Second Congo War"
 MDRC_LDK_end_war_desc: "End emergency mobilization only once the Republic is reunited and at peace. Remove the temporary demobilization and confrontation burdens as civilian institutions resume their work.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_reunification$§!."
 MDRC_LDK_united_republic: "A United Democratic Republic of the Congo"
 MDRC_LDK_united_republic_desc: "Celebrate a recovered and peaceful Republic while committing funds to public services. Territorial unity is a foundation for the next political choice, not proof that every grievance has disappeared.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_end_war$§!."
 MDRC_LDK_long_term: "Beyond the Emergency Presidency"
 MDRC_LDK_long_term_desc: "Alternate history: a surviving Laurent now faces a choice beyond wartime rule. Political consolidation, funded economic rehabilitation and actual reunification must precede a permanent settlement.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_LDK_state$§!.\nComplete §Y$MDRC_LDK_self_sufficient$§!.\nComplete §Y$MDRC_LDK_united_republic$§!."
 MDRC_LDK_permanent: "The Permanent Revolutionary Republic"
 MDRC_LDK_permanent_desc: "Preserve an exclusive revolutionary presidency. This path favours executive power and industrial direction while retaining a stability penalty.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_LDK_long_term$§!.\nComplete §Y$MDRC_LDK_presidential_authority$§!."
 MDRC_LDK_permanent_programme: "Presidential Production Directives"
 MDRC_LDK_permanent_programme_desc: "Fund a coordinated production programme under the executive. Industrial discipline is a policy choice with public costs.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_permanent$§!."
 MDRC_LDK_permanent_settlement: "The Enduring Revolutionary State"
 MDRC_LDK_permanent_settlement_desc: "Consolidate the presidential settlement. This imagined future is a political choice, not a documented promise made by Kabila.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_permanent_programme$§!."
 MDRC_LDK_institutional: "Institutionalize the Revolution"
 MDRC_LDK_institutional_desc: "Accept a constitutional revolutionary state with collective review and predictable succession procedures. This route strengthens institutions without declaring Laurent a historical liberal democrat.\n\n§W--------------§!\nRequired focuses: satisfy §Yevery§! line below:\nComplete §Y$MDRC_LDK_long_term$§!.\nComplete §Y$MDRC_LDK_national_congress$§!."
 MDRC_LDK_institutional_programme: "Constitutional Public Institutions"
 MDRC_LDK_institutional_programme_desc: "Publish budgets and expand adult education through the new institutions. Professional administration must outlive individual presidential interventions.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_institutional$§!."
 MDRC_LDK_institutional_settlement: "A Republic Beyond Personal Rule"
 MDRC_LDK_institutional_settlement_desc: "Consolidate a speculative institutional settlement with durable research and stability benefits. Constitutional review and published budgets support continuity beyond personal presidential intervention.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_institutional_programme$§!."
 MDRC_LDK_reconstruction: "The National Reconstruction Government"
 MDRC_LDK_reconstruction_desc: "Form a cabinet centred on negotiated recovery. Production improves while public enthusiasm for another war declines.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_long_term$§!."
 MDRC_LDK_reconstruction_programme: "The Civilian Peace Budget"
 MDRC_LDK_reconstruction_programme_desc: "Finance civilian reconstruction and reverse emergency political restrictions. A peace budget requires the country to remain at peace.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_reconstruction$§!."
 MDRC_LDK_reconstruction_settlement: "A Government for Reconstruction"
 MDRC_LDK_reconstruction_settlement_desc: "Complete the negotiated reconstruction settlement and replace the initial cabinet with a durable civilian development programme.\n\n§W--------------§!\nRequired earlier focus:\nComplete §Y$MDRC_LDK_reconstruction_programme$§!."
 MDRC_LDK_hostility: "Regional confrontation"
 MDRC_LDK_interim_council: "Interim Council of Ministers"
 mdrc_ldk.0.t: "The Attempt on Laurent Kabila"
 mdrc_ldk.0.d: "On 16 January 2001 the presidency faces an assassination attempt. Historically, Laurent-Desire Kabila died and Joseph Kabila formally took office on 26 January. Choose that succession or an explicitly alternate history in which Laurent survives. The choice permanently determines which leadership branch can be pursued; completed old-save focuses are retained."
 mdrc_ldk.0.a: "Historical outcome: Laurent dies; prepare Joseph's accession."
 mdrc_ldk.0.b: "Alternate history: the president survives."
 mdrc_ldk.1.t: "Joseph Kabila Assumes the Presidency"
 mdrc_ldk.1.d: "The interregnum ends with Joseph Kabila's formal accession. His political branch is now available, while Laurent's survival political branch remains locked. National military, economic, diplomatic and reconstruction programmes are available under either government. Joseph leaves field command."
 mdrc_ldk.1.a: "The reconstruction presidency begins."
 mdrc_ldk.3.t: "The Shape of Revolutionary Government"
 mdrc_ldk.3.d: "The existing presidency concentrated authority, while the People's Power Committees offered a competing language of popular participation. This new debate is speculative: prioritize immediate executive action or pay for broader consultation. The later authority-versus-congress focuses establish the permanent constitutional choice."
 mdrc_ldk.3.a: "Give the executive room to act."
 mdrc_ldk.3.b: "Fund consultations first."
 mdrc_ldk.4.t: "Negotiation or Regional Confrontation"
 mdrc_ldk.4.d: "The government must choose its Great Lakes approach. Negotiation spends political capital and sends actual ceasefire offers, which each recipient may refuse. Confrontation increases resolve but damages relations and civilian production. Neither choice grants claims on Rwanda or Uganda."
 mdrc_ldk.4.a: "Seek a negotiated regional settlement."
 mdrc_ldk.4.b: "Maintain a confrontational security policy."
 mdrc_ldk.5.t: "Restoring Authority in the East"
 mdrc_ldk.5.d: "Choose negotiated demobilization and screened reintegration, or centralized military restoration. Offers can be refused and recovery must be achieved on the map. The postwar branch will not pay reunification rewards until the required territory is genuinely recovered."
 mdrc_ldk.5.a: "Open negotiations and reintegration."
 mdrc_ldk.5.b: "Restore central authority by force."
 MDRC_LDK_programmes: "Congolese Reconstruction and Security"
 MDRC_LDK_programmes_desc: "National reconstruction, diplomatic and military programmes available to either government after completing their required focuses."
 MDRC_LDK_renew_talks: "Renew Regional Ceasefire Talks"
 MDRC_LDK_renew_talks_desc: "Send renewed ceasefire offers to existing belligerents. Each may refuse; only an accepted offer changes the war."
 MDRC_LDK_integration_offer: "Offer a Negotiated Rebel Settlement"
 MDRC_LDK_integration_offer_desc: "At peace, invite RCD and MLC administrations that are independent or DRC subjects to integrate. Acceptance transfers their territory and units; refusal transfers nothing."
 MDRC_LDK_literacy_campaign: "Fund Provincial Literacy Campaigns"
 MDRC_LDK_literacy_campaign_desc: "Fund a repeatable literacy programme. The treasury cost is real and the native MD literacy effect is applied once per completed programme."
 MDRC_LDK_army_review: "Fund a Staff Readiness Exercise"
 MDRC_LDK_army_review_desc: "Purchase staff exercises and a communications replacement package."
 MDRC_LDK_joseph_kabila_name: "Joseph Kabila"
 MDRC_LDK_sikatende_shabani_name: "Sikatende Shabani"
 MDRC_LDK_joseph_mundimbi_name: "Joseph Mundimbi"
 MDRC_LDK_felicien_kiyana_name: "Felicien Kiyana"
 MDRC_LDK_felix_mbusa_mabe_name: "Felix Mbusa Mabe"
 MDRC_LDK_jean_yav_nawej_name: "Jean Yav Nawej"
 MDRC_LDK_marcelin_lukama_name: "Marcelin Lukama"
 MDRC_LDK_denis_kalume_numbi_name: "Denis Kalume Numbi"
 MDRC_LDK_delphin_mulangu_name: "Delphin Mulangu"
 MDRC_LDK_laurent_nkunda_name: "Laurent Nkunda"
 MDRC_LDK_officers_2003: "Integrate the 2003 Officer Cadre"
 MDRC_LDK_officers_2003_desc: "Recruit Sylvain Buki and Gabriel Amisi Kumba into field command after a peaceful national settlement from 30 June 2003 onward. Existing advisor roles remain. This costs political capital and applies a temporary organization penalty."
 MDRC_LDK_nkunda_settlement: "Offer Nkunda a Supervised Command"
 MDRC_LDK_nkunda_settlement_desc: "Explicit alternate history: retain Laurent Nkunda within a supervised integrated army instead of his later rebellion. Requires the 2003 cadre programme, peace and complete national control. The appointment carries a stability cost."
 MDRC_LDK_historical_staff: "Confirm the Congolese Command Roster"
 MDRC_LDK_historical_staff_desc: "Make the loyalist and general-staff roster available after national army reform under either government. Existing Kifwa, Olenga and Kayembe stats are untouched."
 MDRC_JK_SHORTCUT: "Joseph Kabila: Political Path"
 MDRC_LDK_SHORTCUT: "Laurent Kabila: Political Path"
 MDRC_AFRICAN_UNION_SHORTCUT: "MD African Union"
 MDRC_UNION_UNLOCK_SHORTCUT: "Congolese Formables"
 MDRC_partnership: "Congolese Cooperation"
 mdrc.1.t: "A Congolese Ceasefire Proposal"
 mdrc.1.d: "Kinshasa proposes an end to hostilities. Accepting will conclude peace with the Democratic Republic of the Congo under the current war configuration. Our government must decide whether continued fighting serves its interests."
 mdrc.1.a: "Accept the ceasefire."
 mdrc.1.b: "Continue the war."
 mdrc.2.t: "An Offer of National Reintegration"
 mdrc.2.d: "Kinshasa offers integration into a reunited Congo. Accepting dissolves our separate administration and transfers our territory and armed forces to the Democratic Republic of the Congo."
 mdrc.2.a: "Accept reunification."
 mdrc.2.b: "Retain our separate administration."
 mdrc.3.t: "A Ceasefire Has Been Accepted"
 mdrc.3.d: "A government approached by our negotiators has accepted a ceasefire. Other belligerents may still be fighting, and peace alone does not reunify the country."
 mdrc.3.a: "Keep the channels open."
 mdrc.4.t: "Negotiations Have Been Rejected"
 mdrc.4.d: "One of the governments approached by our delegation has rejected the proposal. We can renew diplomacy later or prepare to enforce reunification through the decisions menu."
 mdrc.4.a: "Review our options."
 mdrc.5.t: "An Administration Rejoins the Republic"
 mdrc.5.d: "A rebel administration has accepted integration. The territory and armed forces under its authority have returned to the Republic. Other territorial disputes may remain unresolved."
 mdrc.5.a: "Begin the difficult work of reconciliation."
 MDRC_reconstruction: "Reconstruction and the Great Lakes"
 MDRC_reconstruction_desc: "Use diplomacy to resolve outstanding conflicts, or pursue limited military objectives. Repeated offers cost political power and have a cooldown. Foreign governments retain the right to refuse."
 MDRC_talk_RCD: "Renew Talks with RCD"
 MDRC_talk_RCD_desc: "Send another ceasefire proposal. Acceptance is not guaranteed, and the current war configuration determines the peace outcome."
 MDRC_talk_MLC: "Renew Talks with MLC"
 MDRC_talk_MLC_desc: "Send another ceasefire proposal. Acceptance is not guaranteed, and the current war configuration determines the peace outcome."
 MDRC_talk_RWA: "Renew Talks with RWA"
 MDRC_talk_RWA_desc: "Send another ceasefire proposal. Acceptance is not guaranteed, and the current war configuration determines the peace outcome."
 MDRC_talk_UGA: "Renew Talks with UGA"
 MDRC_talk_UGA_desc: "Send another ceasefire proposal. Acceptance is not guaranteed, and the current war configuration determines the peace outcome."
 MDRC_integrate_RCD: "Offer Reintegration to RCD"
 MDRC_integrate_RCD_desc: "Offer peaceful integration of the rebel administration. Acceptance transfers its territory and troops to the DRC. Rejection leaves it independent."
 MDRC_enforce_RCD: "Prepare Reunification against RCD"
 MDRC_enforce_RCD_desc: "Prepare an annexation war goal against the independent rebel administration. This does not declare war or guarantee victory."
 MDRC_integrate_MLC: "Offer Reintegration to MLC"
 MDRC_integrate_MLC_desc: "Offer peaceful integration of the rebel administration. Acceptance transfers its territory and troops to the DRC. Rejection leaves it independent."
 MDRC_enforce_MLC: "Prepare Reunification against MLC"
 MDRC_enforce_MLC_desc: "Prepare an annexation war goal against the independent rebel administration. This does not declare war or guarantee victory."
 MDRC_confront_RWA: "Prepare to Confront RWA"
 MDRC_confront_RWA_desc: "Prepare a war goal against a neighbouring government. This is an optional alternate-history escalation; no foreign states become Congolese cores."
 MDRC_confront_UGA: "Prepare to Confront UGA"
 MDRC_confront_UGA_desc: "Prepare a war goal against a neighbouring government. This is an optional alternate-history escalation; no foreign states become Congolese cores."
 MDRC_projects: "Congolese Development Projects"
 MDRC_projects_desc: "Focuses unlock one-time development projects. Each project costs the listed treasury and political power and requires ownership and full control of its location. A completed project disappears from this list."
 MDRC_Joseph_succession: "Joseph Kabila has formally assumed the presidency (historical succession)"
 MDRC_LDK_survived: "Laurent-Desire Kabila survived the assassination attempt"
 MDRC_LDK_historical: "The historical Joseph Kabila succession has occurred and Laurent's survival path has not been chosen"
 MDRC_LDK_in_power: "Laurent-Desire Kabila survived and remains president; the historical succession has not occurred"
 MDRC_LDK_reunited: "The Republic owns and fully controls every Congolese core state; the RCD and MLC administrations no longer exist"
