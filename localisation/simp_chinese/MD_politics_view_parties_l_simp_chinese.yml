 EST.Neutral_Libertarian_desc: "(自由保​​守主义) - 共和国党\n\n共和国党是爱沙尼亚的一个自由保守党派。该党信奉传统的自由保守主义、反腐败和民粹主义言论。"
 EST.Neutral_Libertarian2: "£EST_neutral_libertarian (E200)  - 爱沙尼亚 200"
 EST.Neutral_Libertarian2_icon: "£EST_neutral_libertarian"
 EST.Neutral_Libertarian2_desc: "(自由主义) - 爱沙尼亚 200\n\n爱沙尼亚 200是一个自由派政党，主张自由市场贸易和进步的社会政策，该党也主张更深层次地融入北约和欧盟。"
 EST.Neutral_green_icon: "£EST_neutral_greens"
