 BOS_demand_eufor_withdrawal_desc: "국제 군사 주둔을 줄이고 보스니아가 독자적인 국내 치안을 유지할 수 있는지 시험합니다."
 BOS_SFOR_title: "보스니아 헤르체고비나 안정화군"
 BOS_SFOR_title_desc: "NATO 주도의 안정화군은 데이턴 협정의 군사 조항을 집행하고 보스니아의 전후 안보를 뒷받침합니다. 그 권한은 위기 시 연장될 수 있고, 국가 기관이 회복됨에 따라 단축될 수 있습니다."
 BOS_peacekeeper_oversight: "평화유지군 감독"
 BOS_peacekeeper_oversight_desc: "개혁이 국내 안보 수요를 따라가지 못하는 동안 유럽의 임무단이 보스니아에 계속 남아 있습니다."
 BOS_civil_war_operations: "내전 작전"
 BOS_civil_war_operations_desc: "보스니아가 내전 상태인 동안 분쟁 지역 전반에 걸쳐 전시 비상 조치를 조율합니다."
 BOS_rotating_presidency: "순환 대통령제"
 BOS_rotating_presidency_desc: "보스니아의 대통령직은 보스니아크인, 크로아티아인, 세르비아인 대표 사이에서 순환합니다. 이 제도는 한 구성 집단의 지배를 제한하지만, 잦은 권한 이양은 입법을 방해할 수 있습니다.\n\n세르비아인의 태도: [ROOT.BOS_srpska_attitude]\n보스니아크인의 태도: [ROOT.BOS_bosniak_attitude]\n크로아티아인의 태도: [ROOT.BOS_croat_attitude]"
 BOS_more_sfor: "SFOR 기간 연장 요청"
 BOS_more_sfor_desc: "보스니아가 정치적 또는 경제적으로 불안정한 동안 NATO에 SFOR 권한 연장을 요청합니다."
 BOS_lower_sfor: "SFOR 기간 단축 요청"
 BOS_lower_sfor_desc: "보스니아 기관들이 안보 책임을 온전히 넘겨받을 준비를 함에 따라 SFOR 권한을 단축합니다."
 BOS_attack_upon_nato_desc: "보스니아군은 NATO 회원국들에 비해 작전상 극심한 열세에 있습니다."
 BOS_sfor_vol_troops: "SFOR 지원병 약속"
 BOS_sfor_vol_troops_desc: "보스니아가 다시 내전에 빠지면 평화유지 참여국들은 지원병을 신속히 파견할 수 있습니다."
 BOS_SER_vol_troops: "세르비아 지원병 약속"
 BOS_SER_vol_troops_desc: "보스니아 분쟁이 재발하면 세르비아는 스릅스카 공화국을 지원하기 위해 지원병을 신속히 파견할 수 있습니다."
 BOS_idea_muslim_nationalism: "동원된 무슬림 민족주의"
 BOS_idea_muslim_nationalism_desc: "종교적 민족주의는 동원과 외국 개입을 뒷받침하는 한편 정권을 정치적 변화에 대해 경직되게 만듭니다."
 BOS_idea_srpska_supremacy: "스릅스카 우위"
 BOS_idea_srpska_supremacy_desc: "스릅스카 기관이 국가를 지배하고 자원 정책을 주도하지만, 권력 분점은 사실상 끝났습니다."
 BOS_dominant_entity_idea: "지배적 정치체"
 BOS_dominant_entity_idea_desc: "스릅스카의 중앙 국가 장악은 정부를 안정시키고 외국의 정치적 영향력에 맞서 단단히 하는 효과가 있습니다."
 BOS_workers_front_idea: "노동자 전선"
 BOS_workers_front_idea_desc: "조직된 노동은 독립적인 정치 세력이 되었습니다. 그 동원력은 정부를 강화하는 한편 기존 기관들을 동요시킵니다."
 BOS_workers_compact: "전국 노조 협약"
 BOS_workers_compact_desc: "국가는 노동 평화와 더 높은 운영 비용을 대가로 직장 내 권리와 사회 지출을 보장했습니다."
 BOS_worker_managed_economy: "노동자 자주 관리 경제"
 BOS_worker_managed_economy_desc: "노동자 평의회가 기업 경영진과 권한을 나눕니다. 이 체제는 세수를 늘리지만 처음에는 산업 생산에 차질을 빚습니다."
 BOS_mechanical_modernization: "기계 현대화"
 BOS_mechanical_modernization_desc: "현대식 기계와 기술 훈련은 노동자 관리를 더 생산적인 산업 모델로 전환시켰습니다."
 BOS_workers_republic_idea: "노동자 공화국"
 BOS_workers_republic_idea_desc: "평의회 대표들이 국가와 그 산업을 지휘합니다. 안착된 사회주의 질서는 건설과 공공 행정을 가속합니다."
 BOS_idea_prepping_an_offensive: "공세 준비 완료"
 BOS_idea_prepping_an_offensive_desc: "비축된 보급품과 상세한 참모 계획이 일시적으로 작전 준비를 향상시킵니다."
 BOS_idea_commence_the_offensives: "공세의 기세"
 BOS_idea_commence_the_offensives_desc: "군대는 내전 전선 전체에 걸친 조율된 공세에 전념하고 있습니다."
 BOS_idea_rally_the_troops: "결집한 병력"
 BOS_idea_rally_the_troops_desc: "예비 부대와 현지 신병들이 전쟁 수행에 대한 대중의 지지를 지탱하고 있습니다."
 BOS_idea_mobilize_the_nation: "국가 총동원"
 BOS_idea_mobilize_the_nation_desc: "비상 동원은 군사 작전과 라이선스 보병 장비 생산을 가속합니다."
 BOS_idea_dig_in: "준비된 방어선"
 BOS_idea_dig_in_desc: "공병과 야전 부대가 방어 진지를 신속히 준비하고 있습니다."
 BOS_idea_fight_or_perish: "싸울 것인가, 죽을 것인가"
 BOS_idea_fight_or_perish_desc: "정부는 내전에서의 패배를 막기 위해 추가 인력을 동원하고 있습니다."
 BOS_idea_national_sentiment: "전시 민족 감정"
 BOS_idea_national_sentiment_desc: "국가 선전이 분쟁이 이어지는 동안 민족주의 동원을 유지시킵니다."
 BOS_religious_identity_idea: "종교적 정체성"
 BOS_religious_identity_idea_desc: "정부는 이슬람 기관과 종교적 민족주의 강령을 통해 국가를 규정합니다."
 BOS_low_police_budget: "낮은 경찰 예산"
 BOS_low_police_budget_desc: "경찰 예산 삭감은 일상 지출을 줄이지만 조직범죄에 대한 국가의 대응을 약화시킵니다."
 BOS_bosniak_balkan_aspiration_desc: "보스니아크 병력은 국가를 지키고 세르비아계 및 크로아티아계 분리 군대를 격파하기 위해 동원되었습니다."
 BOS_srpska_balkan_aspiration_desc: "스릅스카 공화국은 보스니아 중앙 정부와 경쟁하는 크로아티아계 병력을 물리치기 위해 동원되었습니다."
 BOS_croat_balkan_aspiration_desc: "보스니아 크로아티아계 병력은 보스니아크 및 세르비아 군대로부터 자신들의 영토를 지키기 위해 동원되었습니다."
 BOS_police_high_desc: "경찰 예산 확대는 상당한 재정 비용을 치르는 대신 법 집행과 정치적 통제를 개선합니다."
 BOS_air_doctrine_review: "항공 교리 검토"
 BOS_air_doctrine_review_desc: "임시 참모 연구와 훈련이 실용적인 항공 교리의 채택을 앞당기고 있습니다."
 BOS_internal_investment_desc: "국내 투자 장려책은 민간 산업을 뒷받침하는 한편 생산적 용도에서 빠져나가는 생산량의 비중을 줄입니다."
 BOS_crime_increase_desc: "약한 법 집행으로 조직범죄가 확산되어 행정 비용과 소비자 비용이 올라가고 있습니다."
 BOS_idea_mechanization_of_the_army: "기계화 육군"
 BOS_idea_mechanization_of_the_army_desc: "방호 차량과 기동 계획은 감당할 만한 인력 비용으로 보스니아의 소규모 육군에 더 큰 작전 범위를 부여합니다."
 BOS_idea_transportation_methods: "현대식 육군 수송"
 BOS_idea_transportation_methods_desc: "표준형 다목적 차량과 수송 헬리콥터는 군수의 비용과 복잡성을 줄여 줍니다."
 BOS_idea_the_land_fleet: "통합 기계화 차량 전력"
 BOS_idea_the_land_fleet_desc: "공통 차량 계열은 과도한 조달 간접비 없이 수송차와 장갑차의 균형 잡힌 전력을 뒷받침합니다."
 BOS_idea_aerial_dominance: "제공권 장악"
 BOS_idea_aerial_dominance_desc: "보스니아는 전투기 가동률, 조종사의 자질, 지상군과의 긴밀한 협조에 투자하고 있습니다."
 BOS_idea_air_defence_initiative: "대공 방어 구상"
 BOS_idea_air_defence_initiative_desc: "지상 기반 대공 방어와 감시는 도시, 기지, 야전 부대에 믿을 만한 방패가 됩니다."
 BOS_idea_apc_armament: "장갑 수송차"
 BOS_idea_apc_armament_desc: "표준화된 장갑 수송차는 보병 방호와 제병 협동 기동력을 향상시킵니다."
 BOS_idea_main_battle_line: "현대적 대기갑 교리"
 BOS_idea_main_battle_line_desc: "기동 대기갑 부대는 보스니아가 값비싼 전차 전력을 유지하지 않고도 더 중무장한 부대와 맞설 수 있게 합니다."
 BOS_idea_boots_on_the_ground: "보병 중심 군대"
 BOS_idea_boots_on_the_ground_desc: "준비된 보병과 훈련된 예비군은 보스니아의 지형과 예산에 맞는 방어 전력의 핵심을 이룹니다."
 BOS_eu_development_loans: "EU 개발 차관"
 BOS_eu_development_loans_desc: "유럽의 신용이 재건에 자금을 대고 소비 경제를 완화하고 있지만, 상환 조건은 더 무거운 이자 부담을 지우고 보스니아가 외부의 압력에 더 노출되도록 만듭니다."
 BOS_election_stimulus: "선거 연도 지출"
 BOS_election_stimulus_desc: "투표를 앞둔 비상 지출이 가계 재정을 안정시키고 정부에 대한 대중의 신뢰를 끌어올리고 있습니다."
 BOS_reconstruction_drive: "국가 재건 운동"
 BOS_reconstruction_drive_desc: "조율된 재건 사업이 전국의 건설을 가속하고 국가에 대한 대중의 신뢰를 서서히 회복시키고 있습니다."
 BOS_national_mobilization: "국가 동원 체계"
 BOS_national_mobilization_desc: "명확한 예비군 의무는 훈련된 인력 풀을 넓히며, 준비된 방어 계획 덕분에 점령된 보스니아 영토는 점령군에 훨씬 더 격렬히 저항할 것입니다."
 BOS_idea_detain_ratko_mladic: "라트코 믈라디치 구금됨"
 BOS_idea_detain_ratko_mladic_desc: "국제 사법과의 협력으로 보스니아 기관에 대한 서방의 신뢰가 높아졌습니다."
 BOS_idea_civilian_training: "확대된 예비군 훈련"
 BOS_idea_civilian_training_desc: "임시 국가 훈련 계획이 예비군을 동원과 영토 방어에 대비시키고 있습니다."
 BOS_idea_post_war_clean_up: "전후 정리 계획"
 BOS_idea_post_war_clean_up_desc: "조율된 정리 및 재건이 피해 지역 사회에 대한 투자를 일시적으로 가속하고 있습니다."
 BOS_pro_bosnia: "보스니아크 지지 정부 수립"
 BOS_pro_bosnia_desc: "보스니아크 지지 정부가 국가 기관을 이끌며 국가 행정 비용을 줄입니다."
 BOS_pro_srpska: "세르비아인 지지 정부 수립"
 BOS_pro_srpska_desc: "세르비아인 지지 정부가 국가 기관을 이끌며 스릅스카 공화국과의 안보 협력을 우선시합니다."
 BOS_civil_war_recovery: "내전 복구"
 BOS_civil_war_recovery_desc: "재발한 내전은 생산, 대중의 신뢰, 그리고 협력국을 끌어들이는 보스니아의 능력에 타격을 입혔습니다."
 BOS_post_war_efforts: "전후 복구 노력"
 BOS_post_war_efforts_desc: "세수와 재건 장려책이 전후 투자의 일시적 급증을 뒷받침하고 있습니다."
 BOS_milorad_dodik_idea: "밀로라드 도디크"
 BOS_milorad_dodik_idea_desc: "밀로라드 도디크의 정치 조직망은 중앙 기관을 방해하는 한편 스릅스카 공화국의 자치를 강화합니다."
 BOS_farming_improvements: "농업 개선"
 BOS_farming_improvements_desc: "현대식 장비와 더 안전해진 토지가 농업 생산량과 농촌 안정을 향상시키고 있습니다."
 BOS_farming_powerhouse: "농업 강국"
 BOS_farming_powerhouse_desc: "생산적인 농업 부문이 이제 농촌 소득, 인구 증가, 세원을 뒷받침합니다."
 BOS_mining_development: "광업 발전"
 BOS_mining_development_desc: "현대화된 광산이 자원 채굴량과 과세 가능한 지역 활동을 늘리고 있습니다."
 BOS_mining_industry: "광업"
 BOS_mining_industry_desc: "통합된 투자가 더 크고 효율적인 광업 부문을 만들어 냈습니다."
 BOS_lumber_harvesting_idea: "목재 벌채"
 BOS_lumber_harvesting_idea_desc: "임업 및 가공 투자가 농촌의 자원 산출과 과세 가능한 활동을 확대하고 있습니다."
 BOS_dayton_accords_desc: "데이턴 합의는 보스니아가 평화로운 동안 팽창을 억제하고 세르비아 및 크로아티아와의 군사적 대립을 제한합니다."
 BOS_land_mine_removal_efforts_desc: "지뢰 제거팀이 오염된 토지로 인한 보건 및 경제 부담을 줄이고 있지만, 이 사업에는 지속적인 재정 지원이 필요합니다."
 BOS_trade_deal_with_russia: "사라예보-모스크바 무역 협정 I"
 BOS_trade_deal_with_russia_desc: "러시아와의 제한적 협정은 투자를 뒷받침하고 소비자 비용을 낮추는 한편 동방의 정치적 영향력을 키웁니다."
 BOS_trade_deal_with_russia_expanded: "사라예보-모스크바 무역 협정 II"
 BOS_trade_deal_with_russia_expanded_desc: "확대된 러시아와의 무역과 신용은 경제 협력과 보스니아의 동방 정치 노선을 심화합니다."
 BOS_trade_deal_with_eu: "EU 무역 협정 I"
 BOS_trade_deal_with_eu_desc: "유럽 연합과의 제한적 협정은 소비자 비용을 낮추고 민주적, 금융적 통합을 뒷받침합니다."
 BOS_trade_deal_with_eu_expanded: "EU 무역 협정 II"
 BOS_trade_deal_with_eu_expanded_desc: "유럽 시장과 신용에 대한 접근이 확대되어 보스니아의 서방 경제 노선이 강화됩니다."
 BOS_trade_with_nato: "NATO 원조 패키지"
 BOS_trade_with_nato_desc: "NATO 협력국들이 경제 지원을 제공하여 당장의 비용을 낮추고 서방 정치 노선을 장려합니다."
 BOS_trade_with_usa: "미국-보스니아 공동 무역 조약"
 BOS_trade_with_usa_desc: "미국과의 양자 협정은 에너지 생산, 소비자 접근성, 서방 정치 노선을 뒷받침합니다."
 BOS_gov_old_name: "보스니아 의회"
 BOS_islamic_revolt: "보스니아 무자헤딘 반란"
 BOS_islamic_upper: "보스니아 칼리파국"
 bos_workers_republic: "보스니아 헤르체고비나 노동자 공화국"
 BOS_events.1.t: "보스니아 내전"
 BOS_events.1.d: "스릅스카 공화국이 독립을 선언하면서 보스니아는 다시 내전 상태로 돌아갔습니다. 중앙 정부는 분리 세력을 물리치지 못하면 국가의 영구 분단 위기에 처하게 됩니다."
 BOS_events.1.a: "보스니아 헤르체고비나를 수호한다"
 BOS_events.1.b: "스릅스카 공화국과 함께한다"
 BOS_events.2.t: "크로아티아인 독립 선언"
 BOS_events.2.d: "이미 전쟁으로 분열된 나라에서 헤르체고비나의 보스니아 크로아티아계 지도자들이 독립을 선언했습니다. 중앙 정부는 스릅스카 공화국에 대한 전선을 포기하지 않으면서 남부의 통제권을 되찾아야 합니다."
 BOS_events.2.a: "국가의 영토 보전을 회복한다"
 BOS_events.2.b: "크로아티아인 분리주의자들의 편에 선다"
 BOS_events.4.t: "전쟁의 끝"
 BOS_events.4.d: "정부는 보스니아 헤르체고비나에 대한 통제권을 회복하여 재발한 내전을 끝냈습니다. 이제 동원 해제, 재건, 정치적 화해를 시작할 수 있습니다."
 BOS_events.4.a: "완전한 재통합"
 BOS_events.4.b: "협상을 통한 자치"
 BOS_events.4.c: "감독권을 국제 행정부에 넘긴다"
 BOS_events.59.t: "전쟁으로 번진 대치"
 BOS_events.59.d: "분리 독립 위기는 합의 없이 끝까지 진행되었습니다. 스릅스카 공화국이 노골적으로 독립을 선언했고 나라는 다시 전쟁 상태에 빠졌습니다."
 BOS_events.59.a: "무력으로 나라를 하나로 지킨다"
 BOS_events.60.t: "헤르체고비나의 분리"
 BOS_events.60.d: "합의에 이르지 못하자 헤르체고비나의 크로아티아계 지도자들이 독립을 선언하고 사라예보에 맞서 무기를 들었습니다."
 BOS_events.60.a: "남부의 통제권을 회복한다"
 BOS_events.11.t: "외국 무기 도착"
 BOS_events.11.d: "지역 협력국이 우리 군을 위해 보병 무기를 인도했습니다. 이 물자는 전선을 보강하고 그 배경에 있는 관계를 강화할 것입니다."
 BOS_events.11.a: "무기를 배포한다"
 BOS_events.12.t: "농민 파업"
 BOS_events.12.d: "낮은 가격, 위험한 토지, 미약한 국가 지원에 직면한 농민들이 전국적인 파업에 돌입했습니다. 조직자들은 농업 투자와 경제 정책의 변화를 요구합니다."
 BOS_events.12.a: "정부 교체를 받아들인다"
 BOS_events.12.b: "농민들과 협상한다"
 BOS_events.13.t: "파업 참가자들과의 합의"
 BOS_events.13.d: "정부와 파업 지도부는 임금, 직장 내 보호, 향후 협상을 다루는 합의안을 받아들였습니다. 이 합의는 당장의 시위를 끝내지만 국가에 새로운 의무를 지웁니다."
 BOS_events.13.a: "합의를 이행한다"
 BOS_events.14.t: "광부 파업"
 BOS_events.14.d: "광산 노동자들이 더 안전한 환경, 안정적인 임금, 더 짧은 교대 근무를 요구하며 생산을 중단했습니다. 파업은 이 산업에 의존하는 지역 사회로 번지고 있습니다."
 BOS_events.14.a: "정부 교체를 받아들인다"
 BOS_events.14.b: "광부들과 협상한다"
 BOS_events.9.t: "보스니아의 무기 요청"
 BOS_events.9.d: "[FROM.GetName]이(가) 내전을 위해 보병 무기를 요청했습니다. 지원하면 발칸에서의 우리 영향력이 확대되겠지만, 장비는 우리 자체 비축분에서 나가야 합니다."
 BOS_events.9.a: "무기를 보낸다"
 BOS_events.9.b: "비축분을 보존한다"
 BOS_events.34.t: "보스니아의 CSTO 가입 요청"
 BOS_events.34.d: "[FROM.GetName]이(가) CSTO 가입을 요청했습니다. 가입하면 동맹이 서부 발칸으로 확장되겠지만, 보스니아의 미해결 분쟁도 들여올 수 있습니다."
 BOS_events.34.a: "보스니아를 받아들인다"
 BOS_events.34.b: "신청을 거절한다"
 BOS_events.35.t: "CSTO 가입 승인"
 BOS_events.35.d: "러시아가 우리의 신청을 승인했습니다. 이제 보스니아는 CSTO의 집단 방위 의무를 함께 집니다."
 BOS_events.35.a: "의무를 받아들인다"
 BOS_events.36.t: "CSTO 가입 거절"
 BOS_events.36.d: "러시아가 우리의 신청을 거절하고 동맹을 발칸으로 확장하기를 거부했습니다."
 BOS_events.36.a: "동방 정책을 재고한다"
 BOS_events.15.t: "보스니아의 무기 협력 제안"
 BOS_events.15.d: "[FROM.GetName]이(가) 세르비아산 항공기와 소총의 생산 라이선스를 요청하며 방위 산업 협약을 제안했습니다. 더 긴밀한 군사 관계는 사라예보를 베오그라드에 묶어 두겠지만, 보스니아 내 일부는 이러한 의존에 반감을 품을 것입니다."
 BOS_events.15.a: "생산 라이선스를 허가한다"
 BOS_events.15.b: "요청을 거절한다"
 BOS_events.16.t: "베오그라드의 무기 라이선스 허가"
 BOS_events.16.d: "세르비아가 생산 라이선스 이전을 승인했습니다. 이제 보스니아 공장은 세르비아 설계를 생산할 수 있지만, 보스니아크 공동체 내의 친세르비아 정서가 불안을 일으켰습니다."
 BOS_events.16.a: "라이선스 생산을 시작한다"
 BOS_events.17.t: "베오그라드의 거절"
 BOS_events.17.d: "세르비아는 이러한 조건으로는 방위 산업을 공유하고 싶지 않다며 무기 협력 제안을 거절했습니다."
 BOS_events.17.a: "다른 곳을 알아본다"
 BOS_events.18.t: "보스니아의 투자 초청"
 BOS_events.18.d: "[FROM.GetName]이(가) 외국 자동차 제조사를 국내에 생산 시설을 세우도록 초청하고 있습니다. 공장을 세우면 새로운 시장이 열리고 보스니아 경제에 대한 우리의 상업적 영향력이 커질 것입니다."
 BOS_events.18.a: "보스니아에 공장을 세운다"
 BOS_events.18.b: "초청을 거절한다"
 BOS_events.19.t: "외국 자동차 제조사 투자"
 BOS_events.19.d: "[FROM.GetName]이(가) 보스니아에 공장을 세우기로 합의했습니다. 이 투자는 일자리와 자본을 가져오지만, 제조사 본국 정부가 우리 산업 정책에 발판을 얻게 될 것입니다."
 BOS_events.19.a: "투자를 환영한다"
 BOS_events.20.t: "투자 거절"
 BOS_events.20.d: "[FROM.GetName]이(가) 당분간 보스니아의 자동차 산업에 투자하지 않기로 했습니다."
 BOS_events.20.a: "다른 제조사에 접촉한다"
 BOS_events.21.t: "보스니아의 소총 구매 요청"
 BOS_events.21.d: "[FROM.GetName]이(가) 독일제 현대식 보병 무기 한 묶음을 구매하고자 합니다. 판매는 외화와 사라예보의 호의를 가져다줄 것입니다."
 BOS_events.21.a: "판매를 승인한다"
 BOS_events.21.b: "판매를 거부한다"
 BOS_events.22.t: "독일 소총 인도"
 BOS_events.22.d: "독일이 판매를 승인했습니다. 현대식 보병 무기 화물이 우리 무기고로 오고 있습니다."
 BOS_events.22.a: "무기를 배포한다"
 BOS_events.23.t: "독일의 판매 거절"
 BOS_events.23.d: "베를린은 현재 보스니아에 보병 무기를 판매하지 않기로 했습니다."
 BOS_events.23.a: "다른 공급처를 찾는다"
 BOS_events.24.t: "보스니아의 러시아 소총 구매 요청"
 BOS_events.24.d: "[FROM.GetName]이(가) 러시아제 보병 무기를 대량으로 구매하고자 합니다. 이 주문은 러시아 산업에 반가운 판매가 될 것입니다."
 BOS_events.24.a: "판매를 승인한다"
 BOS_events.24.b: "판매를 거부한다"
 BOS_events.25.t: "러시아 소총 인도"
 BOS_events.25.d: "러시아가 판매를 승인했습니다. 대량의 보병 무기 화물이 우리 비축고로 오고 있습니다."
 BOS_events.25.a: "무기를 배포한다"
 BOS_events.26.t: "러시아의 판매 거절"
 BOS_events.26.d: "모스크바는 현재 보스니아에 보병 무기를 판매하지 않기로 했습니다."
 BOS_events.26.a: "다른 공급처를 찾는다"
 BOS_political.4.t: "보스니아의 전후 선거"
 BOS_political.4.d: "새 세기 들어 처음 치러지는 보스니아 헤르체고비나의 전국 선거는 어느 연립이 취약한 전후 기관들을 이끌지 결정할 것입니다."
 BOS_political.4.a: "보스니아크 주도 정부를 유지한다"
 BOS_political.4.a_tt: "§Y민주행동당§!이 정부를 이끌 것입니다. 다음 대통령직 순환은 세르비아인 대표에게 넘어갑니다."
 BOS_political.4.b: "세르비아인 주도 연립을 지지한다"
 BOS_political.4.b_tt: "§Y독립사회민주동맹§!이 §Y세르비아민주당§!과 함께 연립을 이끌 것입니다. 다음 대통령직 순환은 크로아티아인 대표에게 넘어갑니다."
 BOS_political.20.t: "내전 이후의 합의"
 BOS_political.20.d: "전쟁이 끝났습니다. 보스니아 헤르체고비나는 하나의 권력 아래 다시 재편되었으며, 옛 세력들이 해체되는 동안 당면 과제는 국가를 안정시키는 것입니다."
 BOS_political.20.a: "대스릅스카를 수립한다"
 BOS_political.20.b: "크로아티아인 주도 정부를 수립한다"
 BOS_political.20.c: "사라예보의 통제 아래 보스니아를 재통합한다"
 BOS_political.1.t: "전후 국가"
 BOS_political.1.d: "보스니아 헤르체고비나는 손상된 기관, 분열된 권한, 끝나지 않은 복구를 안고 새 세기에 접어듭니다. 정부는 정치체에 얼마나 많은 권한을 남길지 결정해야 합니다."
 BOS_political.1.a: "새로운 국가를 정의한다"
 BOS_political.2.t: "정치체 자치 확대"
 BOS_political.2.d: "정부는 공동의 외교 및 국방 정책을 유지하면서 헤르체고비나와 스릅스카 공화국에 추가적인 내정 권한을 이양했습니다. 이제 보스니아는 더 느슨한 연방으로 기능합니다."
 BOS_political.2.a: "합의를 시행한다"
 BOS_political.3.t: "연방 재통합"
 BOS_political.3.d: "자치 확대는 혼합 공동체에서 중복된 관할권을 낳았고 공통 서비스를 약화시켰습니다. 정치체 지도자들은 지역 대표성을 보존하는 연방 합의에 따른 재통합을 받아들였습니다."
 BOS_political.3.a: "연방을 재통합한다"
 BOS_political.5.t: "금융 위기"
 BOS_political.5.d: "세계 금융 위기로 수출이 줄고 신용이 경색되었으며 보스니아 고용주들은 감원으로 내몰리고 있습니다. 회복에는 재정 및 산업 정책의 조율이 필요합니다."
 BOS_political.5.a: "회복 계획을 준비한다"
 BOS_political.6.t: "밀로라드 도디크"
 BOS_political.6.d: "밀로라드 도디크는 스릅스카 공화국에서 지도력을 공고히 하고 정치체의 자치를 자신의 정치 강령의 중심에 두었습니다. 그의 커져 가는 조직망은 국가 기관을 강화하려는 모든 시도를 복잡하게 만들 것입니다."
 BOS_political.6.a: "사라예보가 대응해야 한다"
 BOS_political.8.t: "분리 교육 분쟁의 폭력화"
 BOS_political.8.d: "세르비아인과 보스니아크인 학생의 통합을 둘러싼 분쟁이 지방 의회로의 행진으로 번졌습니다. 기물 파손과 귀환자 소유 사업장에 대한 공격으로 진압 경찰이 개입해야 했습니다."
 BOS_political.8.a: "분열의 골은 여전히 깊다"
 BOS_political.9.t: "평화유지군 병력 감축 계획"
 BOS_political.9.d: "NATO는 치안 상황이 개선됨에 따라 보스니아 평화유지군 주둔 규모를 줄이겠다고 발표했습니다. 현지 지도자들은 국가 병력이 임무를 넘겨받을 준비가 되었는지를 두고 의견이 갈립니다."
 BOS_political.9.a: "우리의 대비 태세를 검토한다"
 BOS_political.10.t: "언론 공격을 기록한 보고서"
 BOS_political.10.d: "새 보고서는 2002년 한 해 동안 보스니아 언론인에 대한 위협과 폭행이 늘었음을 기록하고 있습니다. 협박의 상당 부분은 민족주의 조직과 지역 정치 후견인들의 소행으로 지목됩니다."
 BOS_political.10.a: "독립 언론을 보호한다"
 BOS_political.11.t: "니콜리치, 징역 23년 선고"
 BOS_political.11.d: "법원은 보스니아 세르비아계 장교 드라간 니콜리치에게 수시차 수용소에서 저지른 범죄로 징역 23년을 선고했습니다. 이 판결은 전시 책임을 둘러싼 정치적 논쟁을 다시 불러일으켰습니다."
 BOS_political.11.a: "정의는 집행되어야 한다"
 BOS_political.13.t: "난민 귀환 사상 최고치"
 BOS_political.13.d: "치안이 개선되고 주택이 재건됨에 따라 더 많은 실향민이 돌아오고 있습니다. 지방 당국은 전시의 긴장이 남아 있는 지역에서 서비스를 제공하고 귀환자를 보호해야 합니다."
 BOS_political.13.a: "귀환을 지원한다"
 BOS_political.14.t: "난민과 귀환자를 덮친 혹한"
 BOS_political.14.d: "혹한이 보스니아 헤르체고비나 전역의 난민 및 귀환자 공동체를 강타했습니다. 국내 기관과 UN은 난방 연료, 거처, 식량을 전달하는 데 애를 먹고 있습니다."
 BOS_political.14.a: "긴급 구호를 동원한다"
 BOS_political.15.t: "폭발로 알리야 이제트베고비치의 묘 훼손"
 BOS_political.15.d: "폭발물이 사라예보에 있는 전 대통령 알리야 이제트베고비치의 묘를 훼손했습니다. 이 공격은 대중의 분노를 일으켰고 정치적 동기에 의한 폭력에 대한 우려를 되살렸습니다."
 BOS_political.15.a: "공격을 조사한다"
 BOS_political.17.t: "남동유럽 홍수"
 BOS_political.17.d: "기록적인 강우로 보스니아와 인접국 전역에서 도시가 침수되고, 기반시설이 파손되고, 산사태가 발생했습니다. 비상 구조대는 장기적인 구호 및 재건 활동에 직면해 있습니다."
 BOS_political.17.a: "재난 구호를 조율한다"
 BOS_events.55.t: "알리야 이제트베고비치 사망"
 BOS_events.55.d: "전 대통령 알리야 이제트베고비치가 심장 질환 합병증으로 사망했습니다. 그의 죽음은 보스니아크 정치와 보스니아 헤르체고비나의 독립 투쟁에서 한 시대를 규정한 장을 닫습니다."
 BOS_events.55.a: "그의 유산을 기린다"
 BOS_events.55.b: "국가는 앞으로 나아가야 한다"
 BOS_political.21.t: "보스니아의 보장 요청"
 BOS_political.21.d: "EUFOR가 안보 책임을 보스니아 기관에 이양함에 따라 [FROM.GetName]이(가) 자국의 독립을 보장해 달라고 요청했습니다."
 BOS_political.21.a: "보스니아를 보장한다"
 BOS_political.21.b: "약속을 거절한다"
 BOS_political.22.t: "보스니아의 연합 제안"
 BOS_political.22.d: "[FROM.GetName]의 스릅스카 주도 정부가 세르비아로의 편입을 제안했습니다. 수락하면 보스니아의 영토와 군대가 우리 국가로 이전됩니다."
 BOS_political.22.a: "연합을 승인한다"
 BOS_political.22.b: "별개의 국가로 남는다"
 BOS_zivko_radisic: "지브코 라디시치"
 BOS_ante_jelavic: "안테 옐라비치"
 BOS_halid_genjac: "할리드 겐야치"
 BOS_sulejman_tihic: "술레이만 티히치"
 BOS_mirko_sarovic: "미르코 샤로비치"
 BOS_dragan_covic: "드라간 초비치"
 BOS_haris_silajdzic: "하리스 실라이지치"
 BOS_nebojsa_radmanovic: "네보이샤 라드마노비치"
 BOS_zeljko_komsic: "젤리코 콤시치"
 BOS_bosnia_random: "새로운 보스니아크 대표가 순환 대통령직을 맡습니다."
 BOS_serb_random: "새로운 세르비아인 대표가 순환 대통령직을 맡습니다."
 BOS_croat_random: "새로운 크로아티아인 대표가 순환 대통령직을 맡습니다."
 BOS_events.45.a: "협상을 시작한다"
 BOS_events.45.d: "공공 부문 종사자들이 노동 불안에 합류하여 안정적인 임금, 단체 교섭, 정실 인사의 종식을 요구했습니다."
 BOS_events.45.t: "공공 부문 파업"
 BOS_events.46.a: "운동이 확산되고 있다"
 BOS_events.46.d: "노조들이 정치체의 경계를 넘어 요구를 조율함에 따라 시위가 직장에서 도심으로 확대되었습니다."
 BOS_events.46.t: "전국적 노동자 시위"
 BOS_events.47.a: "공공 기관을 보호한다"
 BOS_events.47.d: "정부 청사 앞에서의 대치가 폭력적으로 변했습니다. 노조 지도자들은 도발자들을 탓하고, 보안 당국은 비상 권한을 요구합니다."
 BOS_events.47.t: "시위의 폭력화"
 BOS_events.48.a: "새 정부를 인정한다"
 BOS_events.48.d: "기존 연립은 의회 통제권을 잃었습니다. 노동자 지지를 받는 내각이 이제 국가와 경제를 재편할 권한을 주장하고 있습니다."
 BOS_events.48.t: "노동자들의 정부 입성"
 BOS_eu_accession: "유럽 연합 가입"
 BOS_eu_accession_desc: "회원국이 되려면 협상 분야를 하나씩 마무리해야 합니다. 모든 단계에는 세 구성 집단 모두의 동의가 필요하며, 스릅스카 공화국은 지도부가 적대적으로 돌아설 때마다 절차를 지연시킬 수 있습니다."
 BOS_eu_judicial_reform: "사법 분야 협상 마무리"
 BOS_eu_judicial_reform_desc: "법원 절차, 항소심, 검찰의 독립성을 EU 가입 기준에 맞춥니다."
 BOS_eu_anti_corruption_commitments: "반부패 공약 채택"
 BOS_eu_anti_corruption_commitments_desc: "EU가 감독하는 반부패 기준을 이행하겠다고 약속합니다. 국가 포획이 심각한 한 브뤼셀은 이 분야를 열지 않을 것입니다."
 BOS_eu_market_alignment: "단일 시장 정렬"
 BOS_eu_market_alignment_desc: "EU의 제품 표준, 통관 절차, 경쟁 규정을 채택합니다. 준수에는 비용이 들지만 가입 전 자금이 풀립니다."
 BOS_eu_candidate_status: "후보국 지위 확보"
 BOS_eu_candidate_status_desc: "유럽 이사회에 보스니아 헤르체고비나를 공식 회원 후보국으로 인정해 달라고 청원합니다."
 BOS_eu_open_negotiations: "가입 협상 개시"
 BOS_eu_open_negotiations_desc: "유럽 집행위원회와 정식 회원 가입 협상을 시작합니다. 국가 차원의 의무가 확대됨에 따라 바냐루카의 반발이 예상됩니다."
 BOS_eu_sign_accession_treaty: "가입 조약 서명"
 BOS_eu_sign_accession_treaty_desc: "협상을 마무리하고 가입 조약에 서명합니다. 회원국 지위 자체는 유럽 연합에 대한 정식 신청이 여전히 필요합니다."
 BOS_treasury_5_tt: "국고에 최소 £treasury 5.0 이상이 있음"
 BOS_treasury_2_tt: "국고에 최소 £treasury 2.0 이상이 있음"
 BOS_judiciary_meets_eu_standards_tt: "사법부가 EU 가입 기준을 충족함"
 BOS_anti_corruption_framework_tt: "EU가 감독하는 반부패 체계가 마련되어 있음"
 BOS_market_aligned_with_eu_tt: "국내 규제가 단일 시장에 정렬되어 있음"
 BOS_recognized_eu_candidate_tt: "보스니아 헤르체고비나가 공인된 EU 회원 후보국이 됨"
 BOS_eu_application_open_tt: "조약이 우리의 유럽 연합 가입 신청에 필요한 대중의 지지를 쌓음"
 BOS_economic_development: "경제 발전"
 BOS_economic_development_desc: "전후 경제를 위한 외국 자금 투자, 민영화, 재건 계획입니다.\n 정치체 차원의 후견 조직망이 인사, 계약, 그리고 경제의 상당 부분을 통제합니다. 이를 해체하는 일은 더디고 그로 이익을 얻는 집단의 분노를 삽니다."
 BOS_court_turkish_investment: "튀르키예 투자 유치"
 BOS_court_turkish_investment_desc: "튀르키예의 건설사와 은행에 문호를 엽니다. 앙카라의 자금이 유입되고, 그와 함께 사라예보에 대한 튀르키예의 영향력도 따라옵니다."
 BOS_court_gulf_investment: "걸프 투자 유치"
 BOS_court_gulf_investment_desc: "걸프 자금을 부동산, 관광, 금융 분야로 끌어들입니다. 이 자본은 국고를 채우고 민심을 안정시키지만, 보스니아 내 리야드의 입지도 커집니다."
 BOS_rapid_privatization: "신속한 민영화"
 BOS_rapid_privatization_desc: "국영 기업을 사려는 누구에게나 빠르게 매각합니다. 매각은 국고를 채우고 생산을 끌어올리지만, 헐값 거래는 부패를 키우고 노동자를 동요시킵니다."
 BOS_transparent_privatization: "투명한 민영화"
 BOS_transparent_privatization_desc: "감사를 거친 공개 입찰을 통해 국영 기업을 매각합니다. 수익은 적고 절차는 느리지만, 비리가 줄고 국민의 신뢰가 유지됩니다."
 BOS_thermal_plant_chinese_financing: "중국 자금 화력 발전소"
 BOS_thermal_plant_chinese_financing_desc: "갈탄 발전소를 확장하기 위해 중국의 대출을 받습니다. 생산량은 즉시 늘어나지만 부채와 베이징의 영향력이 함께 따라옵니다."
 BOS_hydro_refurbishment: "수력 발전소 정비"
 BOS_hydro_refurbishment_desc: "네레트바강과 드리나강의 노후한 댐과 터빈을 정비합니다. 초기 비용은 만만치 않지만, 안정적인 전력은 산업을 안정시킵니다."
 BOS_end_brcko_supervision: "브르치코 감독 종료"
 BOS_end_brcko_supervision_desc: "브르치코 특별구에 대한 국제 감독 체제를 정리하고 온전히 지역 기관에 넘깁니다. 스릅스카 공화국은 곧바로 새로운 체제를 시험할 것입니다."
 BOS_police_restructuring: "경찰 개편"
 BOS_police_restructuring_desc: "분산된 정치체 경찰을 국가 체계 아래로 통합합니다. 이는 EU와의 긴밀한 관계를 위한 전제 조건이지만, 스릅스카 공화국은 통제권 상실에 반발합니다."
 BOS_anti_corruption_investigations: "반부패 수사"
 BOS_anti_corruption_investigations_desc: "국가 검찰을 뿌리 깊은 후견 조직망에 투입합니다. 부패는 줄어들겠지만, 관리들이 기소된 구성 집단은 불안해할 것입니다."
 BOS_judicial_appointments: "사법부 인사 탈정치화"
 BOS_judicial_appointments_desc: "사법부 인사권을 정당 지도부에서 독립 위원회로 이전합니다."
 BOS_depoliticized_judiciary_tt: "사법부 인사가 정당의 통제로부터 차단됨"
 BOS_public_procurement_reform: "공공 조달 개혁"
 BOS_public_procurement_reform_desc: "국가 계약에 공개 입찰을 도입합니다. 장부를 공개하는 데는 초기 비용이 들고 여러 편안한 관행이 끝납니다."
 BOS_transparent_procurement_tt: "국가 계약이 공개 입찰을 통해 수여됨"
 BOS_diaspora_investment_drive: "해외 동포 투자 유치 운동"
 BOS_diaspora_investment_drive_desc: "해외 동포 기업 단체가 공공 사업에 공동 출자하도록 초청하고, 이주민 저축자를 대상으로 일회성 채권을 발행합니다."
 BOS_dual_citizenship_outreach: "이중 국적 홍보"
 BOS_dual_citizenship_outreach_desc: "이중 국적 절차와 영사 등록을 간소화하여 이주민들이 본국과의 공식적 유대를 유지하도록 합니다. 등록된 해외 동포가 많을수록 본국으로 송금되는 돈도 늘어납니다."
 BOS_expanded_dual_citizenship_tt: "해외 동포 송금 수입 20% 증가"
 BOS_diaspora_return_program: "해외 동포 귀환 계획"
 BOS_diaspora_return_program_desc: "해외에서 돌아오는 가족을 위한 정착 지원금과 일자리 알선에 자금을 댑니다. 비용은 많이 들지만, 이 나라에는 돈보다 사람이 더 필요합니다."
 BOS_treasury_1_tt: "국고에 최소 £treasury 1.0 이상이 있음"
 BOS_dayton_pressure: "압박받는 데이턴 체제"
 BOS_dayton_pressure_desc: "스릅스카 공화국이 국가 기관에 도전하고 분리 독립을 위협하고 있습니다. 사라예보는 자치를 양보하거나, 고등대표에게 합의안 강제를 요청하거나, 국제 중재를 구할 수 있습니다."
 BOS_concede_to_srpska_demands: "정치체 요구 수용"
 BOS_concede_to_srpska_demands_desc: "분쟁 중인 권한을 스릅스카 공화국에 돌려줍니다. 위기는 끝나지만 중앙 권위를 대가로 치릅니다."
 BOS_invoke_bonn_powers: "본 권한 발동"
 BOS_invoke_bonn_powers_desc: "고등대표에게 분쟁 중인 입법을 강제하고 방해하는 관리들을 해임하도록 요청합니다. 효과적이지만 바냐루카의 깊은 반감을 삽니다."
 BOS_request_international_arbitration: "국제 중재 요청"
 BOS_request_international_arbitration_desc: "분쟁을 국제 중재에 회부합니다. 더디고 비용이 들지만, 어느 쪽에도 보상을 주지 않고 대치를 끝낼 수 있습니다."
 BOS_phase_out_ohr_supervision: "OHR 감독 단계적 종료"
 BOS_phase_out_ohr_supervision_desc: "정치체 관계가 안정되었으니 고등대표의 남은 권한을 국내 기관에 이전하는 협상을 벌입니다."
 BOS_dayton_pressure_decisions_available_tt: "위기 대응책은 압박받는 데이턴 체제 결정에서 사용할 수 있음"
 BOS_eu_candidate: "EU 회원 후보국"
 BOS_eu_candidate_desc: "후보국 지위는 보스니아 헤르체고비나에 회원국으로 가는 공식 경로, 정기적인 진행 보고, 회원국과의 더 원활한 관계를 제공합니다."
 BOS_eu_negotiations: "EU 가입 협상"
 BOS_eu_negotiations_desc: "가입 협상 분야가 열려 있고 EU의 기술 지원이 국가 기관으로 유입되어 행정 및 기반시설 작업을 가속하고 있습니다."
 BOS_eu_accession_treaty: "EU 가입 조약 서명"
 BOS_eu_accession_treaty_desc: "가입 조약이 서명되어 비준이 진행 중입니다. 시장은 회원국 지위를 확정된 것으로 여기며, 국가 기구는 뚜렷한 방향성을 가지고 움직입니다."
 BOS_eu_accession_funds: "사전 가입 지원"
 BOS_eu_accession_funds_desc: "사전 가입 지원 기금(IPA)은 기반시설, 행정 역량, 더 저렴한 국가 차입에 자금을 댑니다."
 BOS_republika_srpska_secession_crisis: "분리 독립 위기"
 BOS_republika_srpska_secession_crisis_desc: "스릅스카 공화국이 국가 기관을 보이콧하고 국민투표 입법을 준비하고 있습니다. 대치가 이어지는 동안 외국 후원자들이 틈을 노리고 있습니다."
 BOS_ohr_supervision: "OHR 감독"
 BOS_ohr_supervision_desc: "고등대표가 본 권한을 직접 행사하고 있습니다. 강제된 결정들은 국가가 기능하도록 유지하지만 선출된 기관들을 배제합니다."
 BOS_national_reconciliation: "민족 화해"
 BOS_national_reconciliation_desc: "세 구성 집단 모두가 국가 정부를 지지합니다. 정치체 간 협력은 예외가 아니라 일상이 되었습니다."
 BOS_political.24.t: "후보국 지위 부여"
 BOS_political.24.d: "유럽 이사회는 보스니아 헤르체고비나를 회원 후보국으로 공식 인정했습니다. 이 결정은 수년간의 개혁에 대한 보상이며, 브뤼셀이 매년 우리의 진전 상황을 보고하도록 의무를 지웁니다."
 BOS_political.24.a: "유럽의 미래"
 BOS_political.25.t: "바냐루카의 협상 방해"
 BOS_political.25.d: "스릅스카 공화국 대표단은 정치체 권한이 문서로 보장되지 않는 한 협상 체계의 비준을 거부하며 국가 의회에서 퇴장했습니다."
 BOS_political.25.a: "복귀를 위해 협상한다"
 BOS_political.25.b: "그들 없이 비준한다"
 BOS_political.26.t: "조달 스캔들 폭로"
 BOS_political.26.d: "언론인들이 정치체 고위 관리들을 조작된 공공 입찰과 연결하는 계약서를 공개했습니다. 이 조직망은 각 부처, 국영 기업, 그리고 적어도 하나의 집권 정당에까지 뻗어 있습니다."
 BOS_political.26.a: "조직망을 기소한다"
 BOS_political.26.b: "이 사안을 묻어 둔다"
 BOS_political.27.t: "스릅스카 공화국의 분리 독립 위협"
 BOS_political.27.d: "바냐루카의 정치체 의회가 국가 기관에서 탈퇴하는 안건의 표결 일정을 잡았으며, 지도부는 독립 국민투표를 공공연히 논의하고 있습니다."
 BOS_political.27.a: "국가가 대응해야 한다"
 BOS_political.28.t: "굳어지는 대치"
 BOS_political.28.d: "합의 없이 수개월의 보이콧이 지나갔습니다. 정치체 기관들은 이제 국가 권위가 선택 사항인 것처럼 움직이고 있으며, 모든 진영의 온건파는 입지를 잃었습니다."
 BOS_political.28.a: "위험한 선례"
 BOS_diaspora_remittances: "해외 동포 송금"
 BOS_diaspora_remittances_desc: "해외에서 일하는 보스니아인이 본국으로 보내는 돈은 GDP의 약 10분의 1에 달합니다. 이 돈은 국가 예산이 닿지 않는 곳을 포함해 전국 모든 지역의 가계에 도달합니다."
 BOS_diaspora_returnees: "귀환하는 해외 동포"
 BOS_diaspora_returnees_desc: "정착 지원금이 독일, 오스트리아, 스칸디나비아에서 가족들을 돌아오게 하고 있습니다. 그들은 저축, 기술, 아이들을 데리고 옵니다."
 BOS_nato_interoperability: "NATO 상호 운용성"
 BOS_nato_interoperability_desc: "합동 훈련, 동맹 표준, 평화를 위한 동반자 프로그램이 서방식 체계로 군대를 재건하고 있습니다."
 BOS_political.29.t: "해외 동포의 돈이 고향으로"
 BOS_political.29.d: "투자 유치 운동이 유럽과 북미 전역의 해외 동포 기업인들의 약속과 함께 마무리되었습니다. 국제적 기준으로는 소박한 액수지만, 외국 투자자들이 외면하는 지방 자치단체에 도착합니다."
 BOS_political.29.a: "반가운 소식"
 BOS_political.30.t: "카라지치 구금"
 BOS_political.30.d: "베오그라드발 소식이 한 시간 만에 사라예보 전역에 퍼졌습니다. 전시 보스니아 세르비아인 지도자였던 라도반 카라지치가 체포되어 헤이그로 이송될 예정입니다. 생존자 단체와 희생자 가족들은 사라예보에서 스레브레니차까지 조용한 추모 집회를 열고 있습니다. 바냐루카의 분위기는 더 어둡습니다."
 BOS_political.30.a: "13년은 너무 늦었다"
 BOS_political.31.t: "믈라디치 구금"
 BOS_political.31.d: "스레브레니차 학살을 자행한 군대의 사령관 라트코 믈라디치가 세르비아 북부의 한 농가에서 체포되었습니다. 스레브레니차의 어머니들에게 이 체포는 16년의 기다림을 끝냅니다. 정치체 경계선 너머에서는 여전히 그를 수호자로 말하는 이들이 있습니다."
 BOS_political.31.a: "정의가 라자레보에 닿다"
 BOS_political.32.t: "세이디치-핀치 판결"
 BOS_political.32.d: "유럽 인권 재판소는 헌법의 민족별 피선거권 규정이 유럽 인권 협약을 위반한다고 판결했습니다. 로마 활동가 데르보 세이디치와 유대인 공동체 지도자 야코브 핀치는 세 구성 민족 어디에도 속하지 않는다는 이유로 대통령직에 출마할 수 없습니다. 크로아티아 정당들은 현재의 제도가 다른 이들이 자신들을 대신해 대통령 위원을 선출하게 한다고 덧붙입니다. 이 판결을 이행하려면 아무도 협상하고 싶어 하지 않는 헌법 개정이 필요합니다."
 BOS_political.32.a: "데이턴 개정은 말처럼 쉽지 않다"
 BOS_sejdic_finci_ruling_tt: "§Y스트라스부르는 헌법의 민족별 피선거권 규정에 위헌 판결을 내렸습니다. 이 판결을 다루는 사법 개혁은 브뤼셀에서 더 큰 비중을 가질 것입니다.§!"
 BOS_sejdic_finci_addressed_tt: "§G이 개혁은 세이디치-핀치 판결을 다루어 브뤼셀의 오랜 요구 하나를 해소합니다.§!"
 BOS_serbia_reaction_tt: "세르비아가 스릅스카 공화국을 지지할지 결정합니다."
 BOS_croatia_reaction_tt: "크로아티아가 헤르체그-보스나를 지지할지 결정합니다."
 BOS_political.33.t: "EUFOR 임무 인수"
 BOS_political.33.d: "부트미르 기지에서 열린 기념식에서 NATO 주도의 안정화군이 자신의 임무를 유럽 연합에 공식적으로 넘겼습니다. 알테아 작전은 베를린 플러스 합의에 따라 SFOR의 병력, 기지, 권한을 이어받습니다. 대부분의 보스니아인에게 눈에 띄는 변화는 소매의 깃발뿐입니다."
 BOS_political.33.a: "부트미르에서 깃발이 바뀐다"
 BOS_political.34.t: "전쟁 이후 첫 인구조사"
 BOS_political.34.d: "조사원들이 1991년 이후 처음으로 인구 집계를 시작했습니다. 민족, 언어, 신앙에 관한 모든 문항이 분쟁의 대상이며, 스릅스카 공화국은 해외 거주 시민의 집계 방식을 받아들이지 않겠다고 이미 밝혔습니다. 서식 뒤에는 아무도 입 밖에 내지 않는 질문이 서 있습니다. 누가 아직 여기에 남아 있는가."
 BOS_political.34.a: "남은 이들을 센다"
 BOS_political.35.t: "불타는 투즐라"
 BOS_political.35.d: "투즐라의 파산한 공장 앞에서 시작된 시위가 사라예보, 제니차, 모스타르로 번졌습니다. 정부 건물이 불타고 있으며, 군중은 민족 구호가 아니라 일자리와 민영화 비리 기소를 요구하고 있습니다. 시민 평의회가 구성되어 칸톤 정부에 직접 요구를 전달하고 있습니다."
 BOS_political.35.a: "평의회의 요구를 수용한다"
 BOS_political.35.b: "먼저 질서를 회복한다"
 BOS_political.36.t: "브뤼셀에 신청서 제출"
 BOS_political.36.d: "대통령 위원회 의장이 보스니아의 유럽 연합 가입 신청서를 이사회 순회의장국인 네덜란드에 전달했습니다. 후보국 지위에 이르기까지는 수년의 적응이 남아 있지만, 신청은 적어도 서류상으로는 모든 정부 수준을 같은 방향으로 묶어 둡니다."
 BOS_political.36.a: "먼 길이 될 것이다"
 BOS_political.37.t: "고등대표, 집단학살 부인 금지"
 BOS_political.37.d: "퇴임을 앞둔 고등대표가 마지막 조치 중 하나로 스레브레니차 집단학살 부인과 전범 미화에 형사 처벌을 부과했습니다. 바냐루카는 폭발했습니다. 정치체 지도자들은 이 결정이 무효라고 선언하고, 국가 기관 보이콧을 발표하며, 데이턴이 내준 것을 되찾겠다고 공공연히 말하고 있습니다."
 BOS_political.37.a: "법은 모두에게 적용된다"
 BOS_political.37.b: "국가는 개입하지 않는다"
 BOS_political.38.t: "바냐루카, 탈퇴를 의결"
 BOS_political.38.d: "정치체 의회는 6개월 안에 스릅스카 공화국을 국가 군대, 세무 당국, 사법부에서 탈퇴시키라고 정부에 지시했습니다. 이 결론은 당장은 선언적이지만 해체로 가는 길을 노골적인 표현으로 그려 보입니다. 각국 대사관은 성명을 준비하고 있으며, 데이턴의 보증국들은 이 합의가 여전히 어떤 가치가 있는지 질문받고 있습니다."
 BOS_political.38.a: "보증국들에게 가져간다"
 BOS_political.38.b: "바냐루카가 먼저 물러서기를 기다린다"
 BOS_political.40.t: "코소보, 독립 선언"
 BOS_political.40.d: "프리슈티나가 세르비아로부터의 독립을 선포했습니다. 이 선언은 보스니아를 갈라놓았습니다. 보스니아크 및 크로아티아 지도자들은 승인 쪽으로 기울고, 스릅스카 공화국은 자신들의 분리 독립을 위한 선례라고 경고합니다."
 BOS_political.40.a: "민족 자결에 대한 지지를 표명한다"
 BOS_political.40.b: "일방적 선언을 거부한다"
 BOS_political.40.c: "국가를 하나로 지키기 위해 중립을 지킨다"
 BOS_political.41.t: "우나사나에 몰려든 이주민"
 BOS_political.41.d: "서부 발칸 경로를 따라 이동하던 수천 명이 크로아티아 국경 인근에 발이 묶였습니다. 우나사나 칸톤 당국은 수용소가 넘쳐 나며 혼자서는 감당할 수 없다고 밝혔습니다."
 BOS_political.41.a: "유럽 연합의 지원을 요청한다"
 BOS_political.41.b: "국경을 강화하고 수용소를 정리한다"
 BOS_political.42.t: "유럽과의 제휴 협정"
 BOS_political.42.d: "보스니아 헤르체고비나가 유럽 연합과 안정화 연합 협정에 서명했습니다. 이는 회원국으로 가는 먼 길의 첫 번째 계약상 단계입니다."
 BOS_political.42.a: "유럽을 향한 이정표"
 BOS_political.43.t: "국가 부가가치세"
 BOS_political.43.d: "단일 국가 차원의 부가가치세가 옛 정치체별 판매세의 누더기 체계를 대체합니다. 징수는 중앙집중화되고 수입은 하나의 국가 계좌를 통해 배분됩니다."
 BOS_political.43.a: "통합 세금을 시행한다"
 BOS_political.43.b: "정치체가 각자의 세율을 유지하게 한다"
 BOS_political.44.t: "4월 패키지"
 BOS_political.44.d: "협상된 헌법 개정안 묶음은 중앙 국가를 강화하고 대통령직을 간소화할 것입니다. 하원에서 두 표가 모자랍니다."
 BOS_political.44.a: "개혁안 통과에 정치적 자본을 쓴다"
 BOS_political.44.b: "패키지가 무산되도록 둔다"
 BOS_political.45.t: "부트미르 회담"
 BOS_political.45.d: "미국과 유럽의 중재자들이 헌법적 교착 상태를 풀기 위해 사라예보 인근의 기지에 정당 지도자들을 모았습니다. 제안은 정치체들에 국가로의 권한 이양을 요구합니다."
 BOS_political.45.a: "중재자들과 협의한다"
 BOS_political.45.b: "정치체의 특권을 수호한다"
 BOS_political.46.t: "문제가 된 브르치코 특별구"
 BOS_political.46.d: "스릅스카 공화국이 전후 국제 감독 아래 놓인 자치 회랑인 브르치코 특별구의 공동 기관에서 자국 관리들을 철수시키겠다고 위협합니다."
 BOS_political.46.a: "특별구의 공동 지위를 수호한다"
 BOS_political.46.b: "평화를 지키기 위해 양보한다"
 BOS_political.47.t: "정부 없는 모스타르"
 BOS_political.47.d: "크로아티아 정당과 보스니아크 정당은 시 자치 규약에 합의하지 못하고 있으며, 모스타르는 수년간 유효한 지방 선거를 치르지 못했습니다. 분열된 도시는 의회 없이 표류하고 있습니다."
 BOS_political.47.a: "통합된 시 자치 규약을 강제한다"
 BOS_political.47.b: "정당들의 대치를 방치한다"
 BOS_political.48.t: "가속화되는 대탈출"
 BOS_political.48.d: "사라예보, 투즐라, 바냐루카를 떠나는 버스와 저가 항공편이 한 방향으로만 가득 차서 운행합니다. 젊은 졸업생, 기능공, 온 가족이 국가가 대체할 수 있는 속도보다 빠르게 독일, 오스트리아, 크로아티아로 떠나고 있습니다."
 BOS_political.48.a: "원인에 관한 보고서를 의뢰한다"
 BOS_political.48.b: "EU 시대의 평범한 이동성으로 치부한다"
 BOS_political.49.t: "콤시치, 크로아티아인 몫 의석 확보"
 BOS_political.49.d: "젤리코 콤시치가 보스니아크 다수의 표로 대통령직 크로아티아인 몫 의석을 차지하여 HDZ의 드라간 초비치를 꺾었습니다. 크로아티아인 다수 도시들은 그를 환영하지 않는다고 선언하고 있으며, 자그레브는 자국 공동체가 거부한 결과에 항의하고 있습니다."
 BOS_political.49.a: "공정하게 얻은 다민족 위임"
 BOS_political.49.b: "크로아티아인 유권자는 대표되지 못하고 표결에서 밀렸다"
 BOS_political.50.t: "NATO 프로그램 교착"
 BOS_political.50.d: "SNSD 소속 장관들이 국가가 NATO에 연례 국가 프로그램을 제출하는 것을 허용하지 않고 있으며, 이것이 없으면 각료 회의를 구성할 수 없습니다. 정부가 전혀 없는 채로 수개월이 흐르고 있습니다."
 BOS_political.50.a: "그래도 프로그램을 제출한다"
 BOS_political.50.b: "대신 이름을 바꾼 개혁 프로그램을 제안한다"
 BOS_political.51.t: "마침내 정부 구성"
 BOS_political.51.d: "선거 14개월 후 각료 회의가 취임 선서를 했습니다. 사라예보에 다시 정부가 생겼지만, 그 대가는 누구도 온전히 만족하지 못하는 체면치레 타협이었습니다."
 BOS_political.51.a: "업무 복귀"
 BOS_political.52.t: "권한 없는 고등대표"
 BOS_political.52.d: "크리스티안 슈미트가 고등대표로 취임했지만, UN 안전보장이사회는 그의 임명을 승인한 적이 없습니다. 러시아, 중국, 스릅스카 공화국 지도부는 이 공백을 붙잡아 그의 권한이 정당하지 않다고 주장하고 있습니다."
 BOS_political.52.a: "사라예보는 평소대로"
 BOS_political.53.t: "투표소에서 강제된 개혁"
 BOS_political.53.d: "투표가 마감되는 시점에 고등대표가 본 권한을 사용하여 연방 헌법과 선거법에 대한 개정안을 강제하고, 민족원을 확대하며, 정부 구성 기한을 정했습니다. 비판자들은 이를 강제된 헌법이라 부르고, HDZ는 늦어진 조치라고 말합니다."
 BOS_political.53.a: "어떤 방식으로 왔든 실용적인 해결책"
 BOS_political.53.b: "비자유주의적 월권"
 BOS_political.53.c: "논쟁에서 물러나 있는다"
 BOS_political.54.t: "바냐루카, 법원을 무효화"
 BOS_political.54.d: "정치체 의회는 국가 헌법재판소의 판결이 스릅스카 공화국에서는 적용되지 않으며, 고등대표의 결정을 정치체 관보에 게재하는 것을 금지한다는 법을 통과시켰습니다. 이제 사라예보의 권한은 정치체 경계선에서 멈춥니다."
 BOS_political.54.a: "가능한 모든 경로로 맞선다"
 BOS_political.54.b: "이 순간이 지나가도록 둔다"
 BOS_hr_legitimacy_disputed_tt: "§R스릅스카 공화국은 고등대표의 결정을 무효로 간주하여 위기를 심화시킵니다§!"
 BOS_political.55.t: "브뤼셀의 협상 개시"
 BOS_political.55.d: "보스니아가 신청한 지 8년 만에 유럽 이사회가 가입 협상을 개시하기로 합의했습니다. 회원국으로 가는 길은 여전히 멀지만, 처음으로 그 길이 브뤼셀을 우회하지 않고 통과합니다."
 BOS_political.55.a: "이정표를 축하한다"
 BOS_political.55.b: "축하를 자제한다"
 BOS_political.57.t: "도디크 유죄 판결 및 공직 금지"
 BOS_political.57.d: "보스니아 헤르체고비나 법원은 고등대표의 결정을 거부한 밀로라드 도디크에게 유죄를 선고하고 공직 보유를 금지했습니다. 스릅스카 공화국 기관들은 판결을 받아들일지 거부할지 결정해야 합니다."
 BOS_political.57.a: "판결은 유효하다"
 BOS_political.57.b: "스릅스카 공화국은 누가 이끌지 지시받지 않는다"
 BOS_reject_third_entity_demand: "제3 정치체 요구 거부"
 BOS_reject_third_entity_demand_desc: "연방을 크로아티아인 다수의 별도 정치체로 재편하는 방안을 배제합니다. 보스니아크 정당들은 안도하고, 크로아티아 정당들은 사라예보가 결코 귀를 기울이지 않을 증거라고 말합니다."
 BOS_concede_partial_croat_autonomy: "크로아티아인 부분 자치 양보"
 BOS_concede_partial_croat_autonomy_desc: "크로아티아인 다수 칸톤에 완전한 제3 정치체에는 못 미치는 확대된 자치를 부여합니다. HNS의 핵심 불만에 답하지만, 조율해야 할 정부 계층이 하나 더 늘어나는 대가를 치릅니다."
 BOS_register_defence_property: "국방 재산을 국유로 등록"
 BOS_register_defence_property_desc: "정치체들이 여전히 소유권을 주장하는 군사 부지를 국가 장부로 이전합니다. 이는 NATO가 회원 행동 계획 활성화를 위해 내건 전제 조건입니다."
 BOS_request_nato_waiver: "NATO 면제 요청"
 BOS_request_nato_waiver_desc: "스릅스카 공화국의 동의를 기다리는 대신 NATO에 국방 재산 조건을 아예 면제해 달라고 요청합니다. 효과는 있지만 바냐루카는 누가 요청했는지 잊지 않을 것입니다."
 BOS_activate_map: "회원 행동 계획 활성화"
 BOS_activate_map_desc: "재산 문제가 해결되었으니 NATO의 회원 행동 계획을 채택하고 가입을 향한 공식 경로를 시작합니다."
 BOS_expand_arms_exports: "탄약 및 무기 수출 확대"
 BOS_expand_arms_exports_desc: "유럽 안팎의 구매자들에게 수출을 늘리고 있는 국영 연계 무기 공장들을 지원합니다. 주문 장부는 가득 찼고, 화물이 어디로 가는지를 둘러싼 논쟁도 그만큼 뜨겁습니다."
 BOS_gulf_investment_delivered_tt: "§G부로지 오존이 예정대로 착공됩니다§!"
 BOS_gulf_investment_stalled_tt: "§R부로지 오존이 약속된 수준에 크게 못 미친 채 정체됩니다§!"
 BOS_host_sarajevo_film_festival: "사라예보 영화제 개최"
 BOS_host_sarajevo_film_festival_desc: "국가 자금과 물류로 남동유럽 최대 영화제를 지원합니다. 매년 여름 관광객과 언론을 사라예보로 끌어들이며 도시의 문화적 위상을 이웃 나라들보다 한참 앞서게 합니다."
 BOS_federation_development_grant: "연방 개발 보조금"
 BOS_federation_development_grant_desc: "보스니아크 다수 연방 칸톤 전역의 기반시설에 국고 자금을 투입합니다. 보스니아크 공동체는 투자를 환영하지만 스릅스카 공화국은 이를 편애로 받아들입니다."
 BOS_herzegovina_development_grant: "헤르체고비나 개발 보조금"
 BOS_herzegovina_development_grant_desc: "크로아티아인 다수 지역인 헤르체고비나의 도로와 공공 설비에 자금을 댑니다. 크로아티아 지도자들은 이를 인정으로 받아들이지만, 보스니아크인들은 민족주의 거점으로 돈이 흘러가는 것에 분개합니다."
 BOS_srpska_development_grant: "스릅스카 공화국 개발 보조금"
 BOS_srpska_development_grant_desc: "스릅스카 공화국의 기반시설에 국고 자금을 투입합니다. 이 조치는 세르비아인의 호의를 사지만, 보스니아크인들은 계속 탈퇴를 위협하는 정치체에 보상을 주는 데 반발합니다."
 BOS_croat_grievance: "크로아티아 정치적 불만"
 BOS_croat_grievance_desc: "크로아티아 정당들은 대통령직의 크로아티아인 몫 의석이 크로아티아인이 아닌 보스니아크인의 표로 결정되었다고 주장하며, 공동체 외부에서 표결로 밀리지 않는 선거 제도를 요구합니다."
 BOS_third_entity_demand: "연방 재편"
 BOS_third_entity_demand_desc: "크로아티아인 다수 칸톤은 확대된 자치를 누리지만, 그 대가로 국가 기구는 운영하기가 한 계층 더 복잡해졌습니다."
 BOS_contested_high_representative: "고등대표의 논란 많은 권한"
 BOS_contested_high_representative_desc: "고등대표는 UN 안전보장이사회의 승인 없이 취임했습니다. 스릅스카 공화국은 이 공백을 그의 결정을 무시해도 되는 구실로 삼고 있으며, 본 권한을 행사할 때마다 이제 정책 다툼뿐 아니라 정당성 다툼까지 불러옵니다."
 BOS_map_participant: "NATO 회원 행동 계획"
 BOS_map_participant_desc: "보스니아 장교들은 최종 가입으로 이어지는 공식 경로인 회원 행동 계획에 따라 NATO 카운터파트와 함께 훈련하고 계획을 수립합니다."
 BOS_arms_export_boom: "무기 수출 호황"
 BOS_arms_export_boom_desc: "국영 연계 무기 공장들은 NATO 구경과 바르샤바 조약기구 구경 주문을 가리지 않고 소화하며 전력으로 가동되고 있습니다. 국고는 이익을 보지만, 화물이 실제로 누구에게 도달하는지에 대한 논쟁도 이어집니다."
 BOS_brain_drain_1: "대규모 이민"
 BOS_brain_drain_1_desc: "무비자 여행 시대가 시작된 이후 수십만 명이 떠났으며, 이들 중 고학력자와 젊은이의 비중이 높습니다. 교실, 진료소, 공장 현장 모두가 그 공백을 느끼고 있습니다."
 BOS_brain_drain_eased_tt: "§G귀환하는 가족들이 대규모 이민 문제를 완화하고 있습니다§!"
 BOS_economic_reconstruction: "경제 재건"
 BOS_economic_reconstruction_desc: "전후 보스니아는 재건을 끝낸 적이 없습니다. 한 세대가 지난 지금도 국가에는 임시방편의 민영화와 하나씩 들여오는 외국 차관이 아닌 일관된 경제 계획이 필요합니다."
 BOS_reform_agenda_adoption: "개혁 의제 채택"
 BOS_reform_agenda_adoption_desc: "EU가 가입 경로 재가동의 대가로 내건 사회경제 개혁 계획을 이행하겠다고 약속합니다. 브뤼셀이 공식 계획을 가리킬 수 있으면 사법 및 시장 개혁은 더 빨리 진행됩니다."
 BOS_growth_plan_negotiations: "성장 계획 협상"
 BOS_growth_plan_negotiations_desc: "EU의 개혁 및 성장 기금을 받기 위한 협상을 시작합니다. 자금은 실재하지만 그에 딸린 조건도 마찬가지입니다."
 BOS_corridor_vc_northern_construction: "북부 회랑 건설"
 BOS_corridor_vc_northern_construction_desc: "도보이, 제니차, 사라예보를 지나는 Vc 회랑 건설을 추진합니다. 전쟁 이후 이 나라 최대의 기반시설 사업이며 대부분 브뤼셀에서 자금을 댑니다."
 BOS_corridor_vc_southern_construction: "남부 회랑 연장"
 BOS_corridor_vc_southern_construction_desc: "고속도로를 모스타르 방면으로 이어 연방의 산업 중심인 북부와 아드리아해를 마주한 남부 사이의 간극을 메웁니다."
 BOS_corridor_vc_opening: "Vc 회랑 개통"
 BOS_corridor_vc_opening_desc: "헝가리 국경에서 플로체 항에 이르는 완공된 노선의 개통식을 거행합니다. 20년에 걸친 EU 자금 개발의 가장 분명한 성과입니다."
 BOS_east_energy_partnership: "중국 에너지 자금 유치"
 BOS_east_energy_partnership_desc: "EU 가입 문서에 어떤 대가를 치르더라도, 중국 국영 대출과 시공사에 기대어 국내 석탄 화력 발전소를 계속 가동하고 확장합니다."
 BOS_west_energy_partnership: "에너지 정책을 EU에 맞추기"
 BOS_west_energy_partnership_desc: "새로운 석탄 발전 설비 대신 수력 발전과 EU 자금의 전력망 개선에 투자를 유도하여 에너지 부문을 유럽의 국가 보조금 규정 안에 둡니다."
 BOS_defense_industry_revival: "방위 공장 부활"
 BOS_defense_industry_revival_desc: "한때 유고슬라비아의 절반에 공급했으나 지금은 가동률이 크게 떨어진 탄약 공장인 이그만 코니치와 우니스 기넥스에 국가의 지원을 실어 줍니다."
 BOS_arms_industry_capacity_expansion: "생산 능력 확대"
 BOS_arms_industry_capacity_expansion_desc: "무기 공장을 개조하여 NATO 구경과 바르샤바 조약기구 구경 생산 라인을 동시에 가동합니다. 이 조합 덕분에 보스니아산 탄약은 거의 어디서나 팔릴 수 있습니다."
 BOS_defense_export_drive: "수출 호황 쫓기"
 BOS_defense_export_drive_desc: "해외 수요 재개로 열린 수출 시장에 대응해 증산하는 공장들을 지원합니다. 주문 장부는 가득 찼고 점점 더 불어나고 있습니다."
 BOS_national_jobs_program: "국가 일자리 사업 개시"
 BOS_national_jobs_program_desc: "국내에서 일자리 창출과 훈련에 자금을 대어, 무비자 시대가 시작된 이후 떠난 수십만 명이 머물거나 돌아올 이유를 갖게 합니다."
 BOS_youth_retention_initiative: "청년 정착 투자"
 BOS_youth_retention_initiative_desc: "유출 인구의 대부분을 차지하는 젊은 졸업생과 기능공을 직접 겨냥한 보조금과 주거 지원으로 일자리 사업을 확대합니다."
 BOS_brain_drain_reversed_tt: "§G대규모 이민 문제가 해소되었습니다§!"
 BOS_corridor_vc_trade_boost: "Vc 회랑 개통"
 BOS_corridor_vc_trade_boost_desc: "완공된 고속도로 연결망은 전국과 아드리아해로 가는 화물 수송 시간을 단축하여 유럽 나머지 지역과의 무역을 원활하게 합니다."
 BOS_defense_industrial_base: "부활한 방위 산업 기반"
 BOS_defense_industrial_base_desc: "이그만 코니치와 우니스 기넥스가 예전 생산 능력에 가깝게 가동되고 있지만, 늘어난 생산량은 여전히 같은 공장을 두고 민수품과 경쟁합니다."
 BOS_jobs_program_idea: "국가 일자리 사업"
 BOS_jobs_program_idea_desc: "국가 자금 일자리 창출은 노동자들이 독일행 버스를 타려고 줄 서는 대신 머물 이유를 주고 있습니다."
 BOS_youth_retention_idea: "청년 정착 보조금"
 BOS_youth_retention_idea_desc: "젊은 졸업생을 겨냥한 주거 및 경력 보조금이 그들 중 일부를 이곳에서 가정과 경력을 시작할 만큼 오래 머물게 하고 있습니다."
 BOS_mostar_industrial_decline: "모스타르 제련소 폐쇄"
 BOS_mostar_industrial_decline_desc: "한때 연방 최대의 전력 소비처였던 알루미늄 공장은 불이 꺼졌고, 모스타르 경제는 아직 메우지 못한 수천 개의 일자리가 부족합니다."
 BOS_mostar_industrial_revival: "새 경영진 아래의 모스타르"
 BOS_mostar_industrial_revival_desc: "전략적 투자자가 모스타르 제련소 운영을 인수하여 축소되었지만 가동 가능한 규모로 생산을 재개했습니다."
 BOS_zenica_industrial_decline: "제니차 제철소 가동 중단"
 BOS_zenica_industrial_decline_desc: "한 세기 넘게 제니차 경제의 중심이었던 용광로가 식었으며, 지역은 수천 개 일자리의 상실을 감당하고 있습니다."
 BOS_zenica_industrial_revival: "새 소유주 아래의 제니차"
 BOS_zenica_industrial_revival_desc: "한 구매자가 제니차 제철소를 인수하여 기존 인력의 일부가 새 경영진 아래에서 계속 일하게 되었습니다."
 BOS_eu_growth_plan_tranche: "EU 성장 계획 분할금 수령"
 BOS_eu_growth_plan_tranche_desc: "EU 개혁 및 성장 기금의 다음 지급분을 요청합니다. 부패가 기준을 넘거나 정부가 협상하기에 너무 불안정하면 분할금을 상실합니다."
 BOS_political.58.t: "불이 꺼진 모스타르 제련소"
 BOS_political.58.d: "연방 최대의 전력 소비처인 알루미니이 모스타르는 전력 공사에 진 수억 규모의 미납 부채 때문에 전력이 끊겼습니다. 글렌코어는 몇 달 전 인수를 포기했고, 이 규모의 제련소를 완전 가동 중단 이후 재가동하는 것이 가능하지조차 않을 수 있습니다."
 BOS_political.58.a: "공장이 문을 닫게 둔다"
 BOS_political.58.b: "전략적 투자자를 물색한다"
 BOS_political.59.t: "식어 가는 제니차 용광로"
 BOS_political.59.d: "아르셀로미탈이 한 세기 넘게 도시 경제의 중심이었던 제니차 제철소의 용광로를 멈췄습니다. 약한 유럽 수요와 높은 에너지 비용으로 이 라인은 가동할수록 적자가 되었습니다."
 BOS_political.59.a: "용광로가 식은 채로 둔다"
 BOS_political.59.b: "새 소유주를 찾는다"
 BOS_political.60.t: "투즐라 7호기 무산"
 BOS_political.60.d: "중국 자금의 투즐라 갈탄 발전 설비는 공식적으로 무산되었습니다. 대출을 뒷받침한 국가 보증은 수년 전 EU의 국가 보조금 규정을 위반했으며, 정부는 마침내 브뤼셀이 이미 말하던 바를 확인했습니다. 중국 거저우바는 어쨌든 계약의 이행을 원합니다."
 BOS_political.60.a: "취소를 받아들인다"
 BOS_political.60.b: "계약 해지에 이의를 제기한다"
 BOS_political.61.t: "유럽 자유 여행"
 BOS_political.61.d: "EU는 보스니아 생체 인식 여권 소지자에 대한 단기 체류 솅겐 비자를 폐지했습니다. 전쟁 이후 처음으로 EU로 넘어가는 일은 국경에서 여권을 보여 주는 것 이상을 의미하지 않습니다."
 BOS_political.61.a: "이정표를 축하한다"
 BOS_political.61.b: "이 길이 어디로 이어질지 경고한다"
 BOS_visa_era_emigration_tt: "§YEU 무비자 여행으로 떠나는 일이 그 어느 때보다 쉬워졌습니다§!"
 BOS_political.62.t: "2010년 선거의 시민적 순간"
 BOS_political.62.d: "즐라트코 라구므지야의 다민족 SDP가 전쟁 이후 처음으로 연방 선거에서 1위를 차지했으며, 밀로라드 도디크의 SNSD는 스릅스카 공화국을 휩쓸었습니다. 이제 여섯 정당이 어느 쪽도 지배할 수 없는 정부를 구성해야 합니다."
 BOS_political.62.a: "시민적 돌파구를 발전시킨다"
 BOS_political.62.b: "정치체들이 각자의 입지를 지키게 둔다"
 BOS_political.63.t: "16개월 늦은 연립"
 BOS_political.63.d: "투표가 마감된 지 16개월 만에 6당 연립이 마침내 각료 회의를 구성했습니다. 누가 의장을 맡을지 합의하는 데만 그 시간의 대부분이 걸렸습니다."
 BOS_political.63.a: "통치로 복귀한다"
 BOS_paralysis_lifted_tt: "§G정부 구성 마비가 해소되었습니다§!"
 BOS_political.64.t: "민족주의자들의 귀환"
 BOS_political.64.d: "SDA가 연방 내 제1당 지위를 되찾았고, 드라간 초비치가 대통령직 크로아티아인 몫 의석을 차지했으며, 도디크는 간신히 스릅스카 공화국을 지켰습니다. 2010년의 다민족 실험은 거의 무너졌습니다."
 BOS_political.64.a: "옛 진영들이 돌아온 데는 이유가 있다"
 BOS_political.64.b: "시민의 길을 다시 시도한다"
 BOS_political.65.t: "다시 투표하는 모스타르"
 BOS_political.65.d: "유럽 법원의 판결이 사라예보를 움직이고 이제트베고비치와 초비치가 새로운 시 자치 규약을 맺은 뒤, 모스타르는 12년 만에 처음으로 지방 선거를 치렀습니다. 분열된 도시에 마침내 선출된 의회가 생겼습니다."
 BOS_political.65.a: "도시를 위한 새로운 위임"
 BOS_political.65.b: "깨지기 쉬운 휴전일 뿐이다"
 BOS_political.66.t: "스릅스카 공화국의 외국 대리인법"
 BOS_political.66.d: "도디크의 유죄 판결 며칠 뒤, 정치체 의회는 외국 자금을 받는 NGO와 독립 언론에 외국 대리인으로 등록하고 모든 기부를 보고하도록 강제하는 법을 서둘러 통과시켰습니다. OSCE와 베네치아 위원회는 이를 시민 사회의 후퇴라고 부릅니다."
 BOS_political.66.a: "탄압을 규탄한다"
 BOS_political.66.b: "스릅스카 공화국은 스스로에게만 답한다"
 BOS_political.67.t: "아무도 집행하지 않는 영장"
 BOS_political.67.d: "도디크는 국가 및 인터폴 체포 영장을 무시한 채 베오그라드와 이스라엘을 거쳐 모스크바로 이동했습니다. 국가 보안 기관이 스릅스카 공화국 내에서 그를 체포하려 하자 정치체 경찰이 가로막았습니다."
 BOS_political.67.a: "체포를 밀어붙인다"
 BOS_political.67.b: "대치가 식도록 둔다"
 BOS_rs_police_standoff_tt: "§R스릅스카 공화국 경찰이 도디크를 체포로부터 보호하여 위기를 심화시킵니다§!"
 BOS_political.68.t: "도디크의 자리를 위한 조기 선거"
 BOS_political.68.d: "선거관리위원회가 도디크의 대통령직을 박탈함에 따라 스릅스카 공화국은 조기 대통령 선거를 치렀습니다. SNSD 충성파 시니샤 카란과 SDS 도전자 브란코 블라누샤는 3포인트 이내의 격차로 마무리했습니다."
 BOS_political.68.a: "SNSD 조직이 버틴다"
 BOS_political.68.b: "야당이 돌파한다"
 BOS_political.69.t: "류비치 판결"
 BOS_political.69.d: "헌법재판소는 연방 민족원에서 칸톤마다 민족 집단별로 최소 한 명의 대표를 보장하는 규정을 폐기했습니다. 의회에는 대체 규정을 만들 과반수가 없어 선거법은 그대로 동결됩니다."
 BOS_political.69.a: "이 일이 나중에 화가 되어 돌아올 것이라 경고한다"
 BOS_political.69.b: "기록해 두고 넘어간다"
 BOS_political.49.d_ljubic: "젤리코 콤시치가 보스니아크 다수의 표로 대통령직 크로아티아인 몫 의석을 차지하여 HDZ의 드라간 초비치를 꺾었습니다. 2년 전 류비치 판결에서 헌법재판소가 남겨 둔 바로 그 선거법의 공백은 이제 크로아티아인 유권자가 언제든 표결로 밀릴 수 있다는 HDZ 주장의 핵심입니다. 크로아티아인 다수 도시들은 그를 환영하지 않는다고 선언하고 있으며, 자그레브는 자국 공동체가 거부한 결과에 항의하고 있습니다."
 BOS_political.70.t: "부고이노 경찰서 폭탄 테러"
 BOS_political.70.d: "수제 폭탄이 부고이노 경찰서를 강타하여 경찰관 1명이 사망하고 6명이 부상을 입었습니다. 배후의 살라피스트 세포는 전쟁 이후 이 나라가 맞닥뜨린 최초의 대규모 자생 지하디스트 조직망입니다."
 BOS_political.70.a: "고립된 세포로 취급한다"
 BOS_political.70.b: "급진화에 경종을 울린다"
 BOS_counter_radicalization_available_tt: "§Y급진화 대응 결정을 이제 사용할 수 있습니다§!"
 BOS_political.71.t: "미국 대사관에 총격"
 BOS_political.71.d: "와하비즘 거주지 고르냐 마오차 출신의 무장 괴한이 사라예보 주재 미국 대사관에 100발 넘게 총을 쏘다 경찰 저격수에게 제압되었습니다. 이 나라의 급진화 문제는 더 이상 국내만의 이야기가 아닙니다."
 BOS_political.71.a: "외교적 여파를 감수한다"
 BOS_political.71.b: "거주지들에 대한 해명을 요구한다"
 BOS_salafi_enclave_decision_available_tt: "§Y살라피 거주지 감시 결정을 이제 사용할 수 있습니다§!"
 BOS_political.72.t: "즈보르니크 경찰서 공격"
 BOS_political.72.d: "무장 괴한이 스릅스카 공화국의 즈보르니크 경찰서에서 경찰관을 살해한 뒤 자신도 사살되었습니다. 세르비아 정치체 내부를 강타한 최초의 이슬람주의 공격입니다. 알려진 동료 중 일부는 시리아에서 싸웠습니다."
 BOS_political.72.a: "위협은 정치체의 경계를 가리지 않는다"
 BOS_political.73.t: "워싱턴, 도디크 조직망 제재"
 BOS_political.73.d: "미국 재무부는 밀로라드 도디크를 제재하고, 부패와 데이턴에 대한 고의적인 방해를 이유로 그의 가족과 후견 조직망으로 제재 범위를 넓혔습니다. 지금까지 스릅스카 공화국을 겨냥한 서방의 가장 날카로운 강압 수단입니다."
 BOS_political.73.a: "늦었지만 마땅한 책임 추궁"
 BOS_political.73.b: "스릅스카 공화국 자체에 대한 공격"
 BOS_sanctions_deepen_crisis_tt: "§R제재는 진행 중인 스릅스카 공화국 분리 독립 위기를 악화시킵니다§!"
 BOS_political.74.t: "베이블루션"
 BOS_political.74.d: "교착 상태 속에서 의회가 시민 신분증법을 실효시키는 바람에 신생아들이 수개월째 신분증 번호, 여권, 의료 카드 없이 지내고 있습니다. 중병에 걸린 아기가 해외 치료를 기다리다 사망한 뒤, 1만 명이 사라예보에서 행진했습니다. 전쟁 이후 최대의 시민 시위입니다."
 BOS_political.74.a: "신속한 해결을 약속한다"
 BOS_political.74.b: "의회가 해결하도록 둔다"
 BOS_political.75.t: "보스니아, 월드컵 본선 진출"
 BOS_political.75.d: "리투아니아에서의 1대 0 승리로 보스니아 헤르체고비나는 독립국으로서 첫 월드컵에 진출했습니다. 몇 주 동안 에딘 제코의 대표팀은 온 나라가 같은 것을 응원하게 만들고 있습니다."
 BOS_political.75.a: "잠시나마 하나가 된 나라"
 BOS_political.81.t: "SAA 마침내 발효"
 BOS_political.81.d: "서명 7년 만에 안정화 연합 협정이 발효되었습니다. 이는 수년간 정체되었던 유럽 경로를 재개하고 각료 회의에서 구체화되고 있는 개혁 의제의 토대를 마련합니다."
 BOS_political.81.a: "브뤼셀과의 새 출발"
 BOS_political.77.t: "B&H 항공, 영영 운항 중단"
 BOS_political.77.d: "연방 정부는 갚을 수 없는 부채를 안고 있던 국적 항공사 B&H 항공을 청산했습니다. 독립 이후 처음으로 이 나라에는 국적 항공사가 없습니다."
 BOS_political.77.a: "보내 준다"
 BOS_political.77.b: "구제 금융을 투입한다"
 BOS_political.78.t: "부로지 오존 발표"
 BOS_political.78.d: "두바이의 부로지 부동산 개발이 사라예보 바로 외곽 트르노보에 43억 유로 규모의 리조트 도시를 세우는 계획을 공개하고 수천 개의 일자리를 약속했습니다. 걸프 자본이 그 어느 때보다 보스니아의 부동산과 관광 부문을 주시하고 있습니다."
 BOS_political.78.a: "발표를 환영한다"
 BOS_political.76.t: "EFT 스타나리 가동"
 BOS_political.76.d: "바냐루카 인근의 300메가와트급 스타나리 갈탄 발전소가 상업 운전에 들어갔으며, 이는 전쟁 이후 보스니아 어디서든 지어진 첫 신규 화력 발전소입니다. 이제 스릅스카 공화국은 중국 자금으로 조달하고 건설한 자체 안정 전력원을 갖게 되었습니다."
 BOS_political.76.a: "스릅스카 공화국의 자부심"
 BOS_political.80.t: "첫 사라예보 프라이드"
 BOS_political.80.d: "약 2천 명이 이 나라 최초의 프라이드를 위해 사라예보를 행진했습니다. 옛 유고슬라비아 수도 중 마지막으로 개최한 것입니다. 소규모 맞불 시위대가 \\"전통적 가치\\" 현수막 아래 모였지만 행진은 폭력 없이 지나갔습니다."
 BOS_political.80.a: "행진 참가자들의 보호를 보장한다"
 BOS_political.80.b: "국가는 거리를 둔다"
 BOS_political.79.t: "야블라니차를 덮친 홍수와 산사태"
 BOS_political.79.d: "돌발 홍수와 산사태가 보스니아 중부와 남부를 휩쓸어, 이 나라가 지난 10년간 겪은 최악의 재난이 되었습니다. 돌냐 야블라니차가 가장 큰 타격을 입었으며, 토석류가 가옥을 덮쳐 수십 명이 목숨을 잃었습니다."
 BOS_political.79.a: "EU에 연대 원조를 호소한다"
 BOS_political.79.b: "자력으로 재건한다"
 BOS_pass_jmbg_law: "JMBG 법 통과"
 BOS_pass_jmbg_law_desc: "신생아들이 신분 증명서를 받지 못하게 만든 등록 공백을 끝내기 위해, 대체 시민 신분증 법안을 의회에서 밀어붙입니다."
 BOS_jmbg_law_passed_tt: "§G시민 신분증 법이 대체되었으며, 시위가 가라앉았습니다§!"
 BOS_counter_radicalization_program: "급진화 대응 프로그램 개시"
 BOS_counter_radicalization_program_desc: "최근 폭탄 테러의 배후인 살라피스트 조직망을 겨냥한 접촉 활동과 감시에 자금을 투입하여, 국내 치안에 입은 피해의 일부를 되돌립니다."
 BOS_monitor_salafi_enclaves: "살라피 집단 거주지 감시"
 BOS_monitor_salafi_enclaves_desc: "고르냐 마오차와 같은 마을을 지속적인 감시 아래 둡니다. 탐지 능력은 향상되지만, 그곳에 사는 보스니아크 공동체에게 국가가 자신들을 어떻게 보는지를 분명히 알려 주는 결과가 됩니다."
 BOS_repatriate_foreign_fighters: "외국인 전투원 송환 및 기소"
 BOS_repatriate_foreign_fighters_desc: "시리아와 이라크에서 ISIS를 위해 싸운 시민들을 송환하여 2014년 테러 방지법에 따라 재판에 회부합니다. 사회 복귀에는 막대한 비용이 들며, 모든 사건이 깔끔하게 끝나지는 않습니다."
 BOS_reintegration_success_tt: "§G귀환자들의 사회 복귀가 성공적으로 이루어졌습니다§!"
 BOS_reintegration_relapse_tt: "§R일부 귀환자들이 다시 급진 조직망으로 흘러들었습니다§!"
 BOS_government_formation_paralysis: "정부 구성 마비"
 BOS_government_formation_paralysis_desc: "각료회의를 구성할 만큼의 의석을 확보한 연립이 없습니다. 정당들이 협상하는 동안 각 부처는 임시 예산으로 운영되고 있습니다."
 BOS_civil_society_crackdown: "시민사회 탄압"
 BOS_civil_society_crackdown_desc: "스릅스카 공화국의 외국 대리인법은 NGO와 독립 언론에게 등록하고, 자금 출처를 보고하며, 자체 생산물에 표시를 달 것을 강제합니다. 감시 단체와 후원자 모두 이 자치체에서 손을 떼고 있습니다."
 BOS_domestic_terror_threat_1: "국내 테러 위협"
 BOS_domestic_terror_threat_1_desc: "규모는 작지만 활발한 살라피스트 조직망이 국가의 시야 밖에서 활동하며, 고립된 소수 공동체에서 신병을 모집하고 있습니다."
 BOS_counter_radicalization_measures: "급진화 대응 조치"
 BOS_counter_radicalization_measures_desc: "접촉 프로그램과 확대된 감시가 부고뇨 폭탄 테러를 낳은 조직망을 조금씩 무너뜨리고 있습니다."
 BOS_salafi_enclave_monitoring: "살라피 집단 거주지 감시"
 BOS_salafi_enclave_monitoring_desc: "보안 기관이 고르냐 마오차 및 이와 유사한 공동체를 상시 감시하고 있습니다. 예전보다 더 많은 음모를 적발하지만, 감시당하는 지역 사회의 신뢰를 대가로 치르고 있습니다."
 BOS_foreign_fighter_reintegration: "외국인 전투원 사회 복귀"
 BOS_foreign_fighter_reintegration_desc: "송환 프로그램에 따라 유죄 판결을 받고 석방된 귀환자들이 일자리로 인도되고 있으며, 처음 그들을 모집했던 조직망으로부터 멀어지고 있습니다."
 BOS_eufor_deterrence: "EUFOR 증강"
 BOS_eufor_deterrence_desc: "증강된 EUFOR 알테아 주둔군은 보스니아의 평화에 외부 보증인이 있음을 눈에 띄게 상기시켜 주며, 이는 바냐루카에서 분리 독립을 생각하는 이들에게 부담으로 작용합니다."
 BOS_eufor_deterrence_tt: "§YEUFOR의 증강된 주둔이 스릅스카 공화국의 분리 독립 시도 위험을 억제합니다§!"
 BOS_jmbg_crisis: "JMBG 위기"
 BOS_jmbg_crisis_desc: "의회가 대체 시민 신분증 법안에 합의하지 못하는 동안 신생아들이 신분 증명서 없이 지내고 있습니다. 사태가 길어질수록 시위의 규모는 커집니다."
 BOS_world_cup_unity: "월드컵 열기"
 BOS_world_cup_unity_desc: "국가대표팀의 사상 첫 월드컵 진출은 보스니아크, 크로아티아계, 세르비아계 모두에게 동시에 환호할 거리를 안겨 주었습니다."
 BOS_stanari_plant_online: "스타나리 발전소 가동"
 BOS_stanari_plant_online_desc: "중국이 건설한 스타나리 갈탄 발전소가 스릅스카 공화국의 전력망에 안정적으로 전력을 공급하고 있으며, 이는 전쟁 이후 이 나라에서 처음으로 건설된 신규 화력 발전 용량입니다."
 BOS_national_carrier_pride: "국적 항공사의 자부심"
 BOS_national_carrier_pride_desc: "국가 보조를 받는 국적 항공사가 여전히 운항 중이며, 2015년 이후 국적 항공사 없이 지내 온 나라에서 작은 자부심의 원천이 되고 있습니다."
