l_polish:
 FYR_political.1.t: "Powstanie na północnym zachodzie"
 FYR_political.1.d: "Albańscy bojownicy, określający się mianem Armii Wyzwolenia Narodowego, zajęli przygraniczną wieś Tanuševci, a starcia z siłami bezpieczeństwa rozprzestrzeniają się w kierunku Tetowa. Skopje obawia się, że wojna, która ominęła Macedonię w latach dziewięćdziesiątych, ostatecznie do niej dotarła."
 FYR_political.1.a: "Zabiegaj o międzynarodową mediację"
 FYR_political.1.b: "Zmiażdż powstanie"
 FYR_political.2.t: "Porozumienie ramowe z Ochrydy"
 FYR_political.2.d: "Przedstawiciele rządu oraz liderzy partii albańskich podpisali w Ochrydzie – przy udziale zachodnich mediatorów – porozumienie ramowe. Język albański zyskuje status urzędowy w gminach, w których mniejszość ta stanowi ponad jedną piątą populacji; następuje decentralizacja struktur policyjnych, a powstańcy złożą broń w punktach odbioru prowadzonych przez NATO, korzystając z amnestii."
 FYR_political.2.a: "Współdzielenie władzy jest lepsze niż wojna"
 FYR_political.3.t: "Porozumienie z Prespy"
 FYR_political.3.d: "Nad brzegiem jeziora Prespa negocjatorzy ze Skopje i Aten parafowali porozumienie kończące trwający od dziesięcioleci spór o nazwę. Kraj ten miałby przyjąć nazwę Republika Macedonii Północnej, a w zamian Grecja wycofałaby swoje weto wobec członkostwa w NATO oraz negocjacji akcesyjnych z Unią Europejską."
 FYR_political.3.a: "Podpisz i obierz drogę euroatlantycką"
 FYR_political.3.b: "Nie zmienimy nazwy naszego narodu"