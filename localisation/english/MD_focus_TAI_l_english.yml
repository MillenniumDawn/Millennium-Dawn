 TAI_pc_industry_events.3.t: "The VIA-Intel Settlement"
 TAI_pc_industry_events.3.d: "Years of patent and licensing disputes have produced a broad settlement and cross-license. VIA can use the breathing room to stabilize its processor road map, continue an expensive legal struggle, or embed its technology inside licensed partnerships."
 TAI_pc_industry_events.3.a: "Use the cross-license to rebuild"
