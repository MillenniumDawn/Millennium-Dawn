 ukraine_develop_btr4.6.desc: "We can choose the desired weapons module for BTR-4 IFV.\n\n§YBM-1B 'Hrim'§! armament: 1x 30 mm automatic cannon, 1x 30 mm automatic grenade launcher, 1x 7.62 mm coaxial machine gun, 4x 9P135M 'Konkurs' or 'Barier' AT missiles.\n\n§YKBA-105 'Shkval'§! armament: 1x 30 mm automatic cannon, 1x 7.62 mm coaxial machine gun, 4x 9P135M 'Konkurs' or 'Barier' AT missiles (optional 1x 30 mm automatic grenade launcher with reduction to 2x AT missiles).\n\n§YBAU 23x2§! armament: 2x 23x152 mm automatic cannons, 1x 7.62 mm coaxial machine gun."
