 POL_WALESA: "Walesa vuelve a ser presidente"
 POL_WALESA_DESC: "Polonia apoyará al partido ChDRP, ganará como Polonia y elegirá su futuro."
 RULE_OPTION_GER_GREEN: "The Green Chancellery"
 RULE_OPTION_GER_GREEN_DESC: "The §8Greens§! take the chancellery in their own right and spend it on the nuclear phase-out, a European green deal and progressive taxation. Germany pushes the alliance eastward and puts distance between itself and both Moscow and Beijing."
 RULE_OPTION_GER_NATIONALIST: "Rule of the National Democrats"
 RULE_OPTION_GER_NATIONALIST_DESC: "The constitutional order collapses into civil war and the §8National Democratic Party§! takes the ruins, building a one-party police state on blood, soil and expulsion. Germany turns openly irredentist and every border around it becomes a claim."
 RULE_OPTION_GER_SOCIALIST: "The Left Ascendant"
 RULE_OPTION_GER_SOCIALIST_DESC: "§8Die Linke§! takes power out of the wreckage of the Federal Republic, throws the Americans off their bases and disarms the country. Germany then presses France, Poland and Sweden into a workers' union, by force if they refuse it."
 RULE_OPTION_GER_MONARCHIST: "The Kaiser Returns"
 RULE_OPTION_GER_MONARCHIST_DESC: "The republic falls and the §8Kaiser§! is crowned again over a restored empire. Germany puts monarchs back on the Swiss, Austrian, Belgian, Ottoman and Italian thrones and gathers them into an imperial bloc."
 RULE_DISABLE_FORMABLE_NATIONS: "Deshabilitar Naciones Formables"
 RULE_YES_FORMABLE_NATIONS_DESC: "Deshabilita las decisiones de Naciones Formables."
 RULE_NO_FORMABLE_NATIONS_DESC: "Las naciones formables estarán habilitadas."
 RULE_ALLOW_EDGY_FLAGS: "Permitir Banderas Controvertidas"
 RULE_ALLOW_EDGY_FLAGS_BLOCKED_DESC: "Evita que aparezcan algunas de las opciones de banderas más controvertidas."
 RULE_ALLOW_EDGY_FLAGS_ALLOWED_DESC: "Permite opciones de banderas más controvertidas que normalmente estarían censuradas."
 RULE_DISABLE_EU: "Deshabilitar la UE"
 RULE_YES_DISABLE_EU_DESC: "Todos los países serán eliminados de la Unión Europea."
 RULE_NO_DISABLE_EU_DESC: "La Unión Europea existirá tal como está."
 RULE_DISABLE_NATO: "Deshabilitar la OTAN"
 RULE_YES_DISABLE_NATO_DESC: "La OTAN se deshabilitará al cargar el juego."
 RULE_NO_DISABLE_NATO_DESC: "La OTAN seguirá siendo una facción."
 RULE_SPREAD_INFLUENCE_AMOUNT_GAIN: "Incremento de Ganancia de Influencia al Expandirse"
 RULE_SPREAD_INFLUENCE_AMOUNT_GAIN_DESC: "Cambia la cantidad de influencia ganada al expandir la influencia."
 RULE_SPREAD_INFLUENCE_GAIN_3: "3%"
 RULE_SPREAD_INFLUENCE_GAIN_3_DESC: "3 % de influencia ganada por acción de propagación. Para cuando quieras aumentar la ganancia de influencia."
 RULE_SPREAD_INFLUENCE_GAIN_0_5: "0.5%"
 RULE_SPREAD_INFLUENCE_GAIN_0_5_DESC: "Gana un 0.5% de influencia por acción de expansión. Útil si deseas ralentizar la ganancia de influencia."
 RULE_SPREAD_INFLUENCE_GAIN_1_5: "1.5%"
 RULE_SPREAD_INFLUENCE_GAIN_1_5_DESC: "1 % de influencia obtenida por cada acción de propagación. La ganancia de influencia predeterminada por cada acción de influencia de propagación."
 RULE_SPREAD_INFLUENCE_GAIN_1: "1%"
 RULE_SPREAD_INFLUENCE_GAIN_1_DESC: "1 % de influencia ganada por acción de propagación. Si realmente quieres ralentizar la ganancia de influencia."
 RULE_SPREAD_INFLUENCE_GAIN_2: "2%"
 RULE_SPREAD_INFLUENCE_GAIN_2_DESC: "2 % de influencia ganada por cada acción de propagación. Si realmente quieres aumentar la ganancia de influencia."
 RULE_SPREAD_INFLUENCE_GAIN_4: "4%"
 RULE_SPREAD_INFLUENCE_GAIN_4_DESC: "Gana un 4% de influencia por acción de expansión. Útil si deseas aumentar significativamente la ganancia de influencia."
 RULE_SPREAD_INFLUENCE_AMOUNT_COOLDOWN: "Tiempo de Enfriamiento para Expandir Influencia"
 RULE_SPREAD_INFLUENCE_30_COOLDOWN: "30 días"
 RULE_SPREAD_INFLUENCE_30_COOLDOWN_DESC: "El enfriamiento predeterminado. Cada 30 días, puedes expandir tu influencia hacia otra nación."
 RULE_SPREAD_INFLUENCE_14_COOLDOWN: "14 días"
 RULE_SPREAD_INFLUENCE_14_COOLDOWN_DESC: "Cada 14 días, puedes expandir tu influencia hacia otra nación."
 RULE_SPREAD_INFLUENCE_0_COOLDOWN: "Sin enfriamiento"
 RULE_SPREAD_INFLUENCE_0_COOLDOWN_DESC: "Sin tiempo de enfriamiento para expandir la influencia, ¡ideal si deseas gastar todo tu §HPoder Político§! en influenciar a otras naciones!"
 RULE_SPREAD_INFLUENCE_60_COOLDOWN: "60 días"
 RULE_SPREAD_INFLUENCE_60_COOLDOWN_DESC: "Cada 60 días, puedes expandir tu influencia hacia otra nación."
 RULE_INVEST_INFLUENCE_AMOUNT_GAIN: "Ganancia de Influencia por Inversiones"
 RULE_INVEST_DEFAULT_GAIN_1: "1%"
 RULE_INVEST_DEFAULT_GAIN_1_DESC: "Ganarás un 1% de influencia cada vez que alguien acepte tus inversiones."
 RULE_INVEST_DEFAULT_GAIN_0_5: "0.5%"
 RULE_INVEST_DEFAULT_GAIN_0_5_DESC: "Ganarás un 0.5% de influencia cada vez que alguien acepte tus inversiones."
 RULE_INVEST_DEFAULT_GAIN_2: "2%"
 RULE_INVEST_DEFAULT_GAIN_2_DESC: "Ganarás un 2% de influencia cada vez que alguien acepte tus inversiones."
 RULE_INFLUENCE_COOLDOWN: "Enfriamiento para Ganar Influencia por Inversiones"
 RULE_14_DAY_INFLUENCE: "Enfriamiento de 14 días"
 RULE_14_DAY_INFLUENCE_DESC: "Opción predeterminada. El enfriamiento para ganar influencia por inversiones es de 14 días o 2 semanas. Esto se aplica a la nación en todas las oportunidades de inversión posibles. Aunque aún puedes invertir, no ganarás influencia durante este período de tiempo."
 RULE_0_DAY_INFLUENCE: "Sin enfriamiento"
 RULE_0_DAY_INFLUENCE_DESC: "La antigua forma de ganar influencia por inversiones sin límite de tiempo. Puedes invertir tantas veces como quieras y seguir ganando influencia, ¡no recomendado para aquellos que prefieren el equilibrio!"
 RULE_30_DAY_INFLUENCE: "Enfriamiento de 30 días"
 RULE_30_DAY_INFLUENCE_DESC: "La opción sugerida para multijugador. El enfriamiento para ganar influencia por inversiones es de 30 días o aproximadamente 1 mes. Esto se aplica a la nación en todas las oportunidades de inversión posibles. Aunque aún puedes invertir, no ganarás influencia durante este período de tiempo."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_TICK: "¡Habilite la §YIndependencia Doméstica§! mensual Marca de crecimiento"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_TICK_NO_DESC: "Desactiva la §YIndependencia Doméstica§! mensual Marca de crecimiento"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_TICK_YES_DESC: "Habilita el aumento mensual de §YIndependencia doméstica§!. Cada mes, §YIndependencia doméstica§! aumentará según el valor establecido en la regla del juego \"Aumento mensual de §YIndependencia doméstica§!\", que está establecida de manera predeterminada en 0,10 % por mes."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT: "§YIndependencia doméstica§! mensual Cantidad de tics de crecimiento"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_05: "0.05%"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_05_DESC: "Cada mes, la §YIndependencia Doméstica§! aumenta en un 0,05 % siempre que la marca de crecimiento mensual de §YIndependencia Doméstica§! esté habilitada."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_10: "0.10%"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_10_DESC: "Cada mes, la §YIndependencia Doméstica§! aumenta en un 0,10 % siempre que la marca de crecimiento mensual de §YIndependencia Doméstica§! esté habilitada."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_15: "0.15%"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_15_DESC: "Cada mes, la §YIndependencia Doméstica§! aumenta en un 0,15 % siempre que la marca de crecimiento mensual de §YIndependencia Doméstica§! esté habilitada."
 RULE_ENABLE_DIVISION_LIMITER: "Habilitar Limitador de Divisiones de la IA"
 RULE_NO_ENABLE_DIVISION_LIMITER_DESC: "Desactivado el Limitador de Divisiones de la IA\n\nPor defecto, la IA no estará limitada en la cantidad de unidades que puede producir. Si deseas limitar las divisiones por razones de rendimiento, ¡actívalo!"
 RULE_YES_ENABLE_DIVISION_LIMITER_DESC: "Habilitado el Limitador de Divisiones de la IA\n\nCuando está habilitado, es menos probable que la IA produzca unidades, lo que permite una experiencia más fluida para que puedas jugar con relativa tranquilidad."
 RULE_OPTION_POTATO_EDITION: "Edición Patata"
 RULE_POTATO_EDITION_DIVISION_LIMITER_DESC: "Habilitado el Limitador de Divisiones de la IA en la Edición Patata\n\nLimita aún más a la IA por razones de rendimiento.\n"
 RULE_REMOVE_MICRO_STATES: "Remove Nations"
 RULE_NO_RULE_REMOVE_MICRO_STATES_DESC: "Do not remove any nations from the game start."
 RULE_ALLOW_ENABLE_LEDGER: "Habilitar Libro Mayor de MD"
 RULE_ALLOW_ENABLE_LEDGER_YES_DESC: "MD's Ledger is enabled. (Some information from the La Resistance intel ledger may become redundant. Disable this feature if you want a harder game.)"
 RULE_ALLOW_ENABLE_LEDGER_NO_DESC: "Deshabilita el libro mayor de MD. Esto es mejor para los usuarios que prefieren una experiencia más auténtica y desean utilizar La Resistencia para obtener información crítica."
 RULE_ALLOW_HELP_GUI: "Habilitar la GUI de ayuda de MD"
