 ENG_inner_circle_andrew.06.d: "Tras las repercusiones de sus vínculos con Jeffrey Epstein, el príncipe Andrés se ha vuelto políticamente tóxico. Bajo una creciente presión pública e institucional, es despojado de su estatus remanente dentro de la familia real y expulsado del círculo íntimo."
 ENG_military.046.t: "Washington aprueba la asociación"
 ENG_military.046.d: "Los Estados Unidos han designado formalmente al Reino Unido como Aliado importante no miembro de la OTAN. Esta asociación estratégica abre la puerta a una cooperación de defensa más profunda y a un acceso preferente a la tecnología militar estadounidense."
 ENG_military.046.a: "Un amigo valioso al otro lado del Atlántico"
 ENG_military.047.t: "Washington rechaza la asociación"
 ENG_military.047.d: "Los Estados Unidos han rechazado nuestra solicitud para la designación de Aliado importante no miembro de la OTAN. La relación especial se mantiene, pero Washington no está preparado para formalizarla más en este momento."
 ENG_military.047.a: "Decepcionante, pero no es el fin"
