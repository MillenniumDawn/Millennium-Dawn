 ARM_infantry_weapons_2: "АК-74"
 ARM_infantry_weapons_2_desc: "АК-74 разработан на основе АКМ и имеет значительные улучшения по сравнению с предшественником. В частности, он использует патроны калибра 5,45 мм вместо тогдашнего стандартного для стран Варшавского договора 7,62 мм."
 ARM_infantry_weapons_3: "K6-92 BORZ"
 ARM_infantry_weapons_3_desc: "Пистолет-пулемёт К6-92 был разработан в Армении, которая после обретения независимости в 1991 году фактически находилась в состоянии вооружённого конфликта с Азербайджаном из-за Нагорного Карабаха. Армянские вооружённые формирования остро ощущали нехватку стрелкового оружия, потребность в котором побудила армянских инженеров в 1991–1992 годах создать относительно простой пистолет-пулемёт К6-92."
 ARM_infantry_weapons_4: "VAHAN"
 ARM_infantry_weapons_4_desc: "«Ваган» был разработан на основе экспериментальной штурмовой винтовки калибра 7,62х39 мм (иногда называемой МБК-2), разработанной Манасяном во время службы в советской армии. Автоматическое оружие работает по принципу полусвободного затвора, что позволяет упростить конструкцию для полукустарного производства."
 ARM_infantry_weapons_5: "K-3"
 ARM_infantry_weapons_5_desc: "К-3 — армянская штурмовая винтовка схемы буллпап, разработанная в середине 1990-х годов на базе советского автомата АК-74, с возможностью ведения автоматического и полуавтоматического огня, а также огня из подствольного гранатомёта. Разработана департаментом военной промышленности Министерства обороны Армении. Выпускается небольшими сериями."
 ARM_infantry_weapons_6: "AS-300"
 ARM_infantry_weapons_6_desc: "Представленная в Армении на военных командно-штабных учениях «Ардзаганк-2013» в октябре 2013 года, штурмовая винтовка AS-300 рассчитана на использование патронов 7,62 × 35 мм и имеет аналогичный глушитель. Штурмовая винтовка имеет коробчатый магазин на 30 патронов, другую конструкцию приклада и вертикальную переднюю рукоятку. Газовая автоматика обеспечивает скорострельность до 500 выстрелов в минуту. Ударно-спусковой механизм куркового типа, режим огня — одиночный и автоматический. При производстве AS-300 используется затворный механизм от автомата Калашникова, хотя устанавливаются новые ствол, приклад и другие детали."
 ARM_infantry_weapons_7: "ASR-545"
 ARM_infantry_weapons_7_desc: "Представленная в Армении на военных командно-штабных учениях «Ардзаганк-2013» в октябре 2013 года, винтовка ASR-545 оснащена газовой автоматикой. Винтовка предназначена для ведения точного бесшумного огня со скрытых позиций по уничтожению живой силы противника и легкобронированной техники (для последней используются бронебойные патроны собственного производства). Винтовки оснащены планками Пикатинни для оптических и коллиматорных прицелов, а также другими приспособлениями. В винтовке используется патрон 5,45х39 мм с дозвуковой пулей."
 ARM_infantry_weapons_8: "RDL-34"
 ARM_infantry_weapons_8_desc: "Последняя разработка ASPAR Arms, созданная на базе AR-15, использует магазины и патроны от автомата Калашникова, при этом имея достаточно надёжную конструкцию, которая не уступает своим аналогам."
