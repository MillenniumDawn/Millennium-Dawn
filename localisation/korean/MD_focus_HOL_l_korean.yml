 HOL_gkn_aerospace_unlocked: "§YGKN Aerospace§!가 2015년에 포커 테크놀로지스를 인수함"
 HOL_brussels_defiance: "브뤼셀에 대한 반발"
 HOL_jerusalem_embassy_backlash: "대사관을 예루살렘으로 이전함"
 HOL_asml_tsmc_group: "ASML-TSMC 기술 동맹"
 HOL_asml_tsmc_group_desc: "ASML-TSMC 기술 동맹은 반도체 연구와 생산의 최전선을 대표합니다. 리소그래피에 관한 네덜란드의 전문성과 반도체 제조에서 대만이 지닌 선도적 위치를 결합한 이 파트너십은 세계 기술 지형을 장악하여, 첨단 마이크로칩과 기술 혁신에 대한 독보적인 접근권을 확보하는 것을 목표로 합니다."
 HOL_willem_alexander_army_captain: "왕실 육군 준장"
 HOL_willem_alexander_navy_captain: "왕실 해군 지휘관"
 HOL_willem_alexander_airforce_captain: "왕실 공군 준장"
 HOL_groningen_quake_reduce_tt: "월간 흐로닝언 지진 변화: §G-10%§!"
 HOL_groningen_quake_end_tt: "§G흐로닝언의 유발 지진을 종식시킵니다.§!"
 HOL_groningen.1.t: "흔들리는 흐로닝언의 지반"
 HOL_groningen.1.d: "수년간 계속된 가스 채굴이 흐로닝언 지하를 불안정하게 만들었습니다. 첫 대규모 유발 지진이 발생하여 가옥에 균열이 생기고 기반시설이 손상되었습니다. 유정에서 계속 가스를 뽑아내는 한 진동은 다시 찾아올 것입니다."
 HOL_groningen.1.a: "그 결과를 감당하겠다"
 HOL_groningen.2.t: "흐로닝언의 지진"
 HOL_groningen.2.d: "유발 지진이 계속되면서 지반이 다시 움직여 주 전역의 가옥에 균열이 가고 기반시설이 손상되었습니다."
 HOL_groningen.2.a: "피해를 복구한다"
 HOL_soft_power_doctrine: "소프트 파워 교리"
 HOL_soft_power_doctrine_desc: "네덜란드는 개발 원조, EU에서의 리더십, 수자원 및 병참 전문성의 세계적 투사를 통해 그 규모를 넘어서는 영향력을 행사합니다. 이를 교리로 공식화하면 정치적 자본이 지속적인 대외 영향력으로 전환됩니다."
 HOL_development_cooperation_ministry: "개발협력부"
 HOL_development_cooperation_ministry_desc: "네덜란드는 역사적으로 GDP 대비 가장 후한 공적개발원조 공여국 중 하나였던 개발협력부에 대한 전액 재정 지원을 복원합니다. 원조는 정치적 양보를 얻어내기보다 수혜국 정부와의 장기적 파트너십을 구축하는 데 쓰입니다."
 HOL_global_development_partnerships: "글로벌 개발 파트너십"
 HOL_global_development_partnerships_desc: "네덜란드 대사관과 개발 담당관은 아프리카, 아시아, 중동, 라틴 아메리카에서 사업을 확대합니다. 수혜국 정부는 네덜란드 지원의 일관되고 강압적이지 않은 성격을 신뢰성의 표시로 받아들입니다."
 HOL_untied_aid_program: "비구속성 원조 프로그램"
 HOL_untied_aid_program_desc: "네덜란드는 수혜국이 개방 시장에서 재화와 용역을 조달할 수 있는 비구속성 개발 원조를 약속합니다. 이러한 접근은 양자 간 조건부 원조로는 얻을 수 없는 호감을 심화하고 네덜란드의 영향력을 넓힙니다."
 HOL_humanitarian_leadership: "인도주의 리더십"
 HOL_humanitarian_leadership_desc: "네덜란드는 국제사법재판소와 국제형사재판소의 소재지인 헤이그의 역할을 바탕으로 국제 인도법과 위기 대응의 중심에 자리매김합니다. 이러한 국제적 위상은 네덜란드 외교 정책을 세계 긴장도의 압력으로부터 보호합니다."
 HOL_humanitarian_leadership_name: "인도주의 리더십"
 HOL_humanitarian_leadership_name_desc: "국제 재판소의 개최국으로서 네덜란드는 국내 정치를 안정시키는 도덕적 권위를 행사하며, 훨씬 적은 외교적 마찰로 해외에 병력을 투입할 수 있습니다."
 HOL_eu_single_market_champion: "EU 단일 시장 옹호국"
 HOL_eu_single_market_champion_desc: "네덜란드는 특히 서비스, 디지털 무역, 금융 규제 분야에서 단일 시장 심화에 가장 헌신적인 EU 회원국 중 하나로 꾸준히 꼽힙니다. 네덜란드 외교관들은 남아 있는 장벽을 제거하기 위해 EU 기관 내에서 적극적으로 로비합니다."
 HOL_frugal_four_leadership: "검소한 4국 리더십"
 HOL_frugal_four_leadership_desc: "오스트리아, 덴마크, 스웨덴과 함께 네덜란드는 공동 지출에 대한 예산 규율과 개혁 조건을 고집하는, EU 내 재정 보수 진영을 이끕니다. 이러한 공조는 양자 간 영향력만으로는 얻을 수 없는 수준으로 EU 재정 협상에서 네덜란드의 영향력을 증폭시킵니다."
 HOL_european_strategic_autonomy: "유럽 전략적 자율성"
 HOL_european_strategic_autonomy_desc: "네덜란드는 더 강력한 유럽 방위 및 외교 정체성을 옹호하며, EU의 전략 나침반을 지지하고 공동 역량에 기여합니다. 네덜란드 외교관들은 블록이 더 독립적인 전략 태세로 나아가도록 EU 파트너들 사이에서 연합을 구축합니다."
 HOL_water_diplomacy_initiative: "물 외교 구상"
 HOL_water_diplomacy_initiative_desc: "네덜란드 수자원 기술자와 델타레스 전문가들이 공식 외교 프로그램을 통해 아프리카, 아시아, 라틴 아메리카의 홍수 취약 및 물 부족 국가에 파견됩니다. 델타 웍스와 네덜란드식 통합 물 관리 방식이 기준 모델로 활용되어 지속적인 기술적, 정치적 관계를 구축합니다."
 HOL_gateway_to_europe_desc: "로테르담은 유럽 최대의 항구이며 스히폴은 주요 항공 거점 중 하나입니다. 네덜란드는 이러한 병참 중심성을 외교적 자산으로 활용하여 무역 사절단을 유치하고, 유럽 시장 진출을 원하는 파트너에게 네덜란드 기반시설을 선호되는 관문으로 자리매김시킵니다."
 HOL_global_trade_facilitation: "글로벌 무역 촉진"
 HOL_global_trade_facilitation_desc: "네덜란드 외교관들은 서방 연대 및 비동맹 시장 전반에서 개방적이고 규칙에 기반한 무역을 옹호합니다. 로테르담의 처리 능력과 네덜란드 금융 서비스에 뒷받침된 양자 무역 촉진 협정은 네덜란드의 상업적, 정치적 영향권을 넓힙니다."
 HOL_dutch_soft_power_powerhouse: "네덜란드 소프트 파워 강국"
 HOL_dutch_soft_power_powerhouse_desc: "네덜란드는 개발, 유럽 내 리더십, 무역 전반에서 신뢰할 수 있고 원칙 있으며 유능한 파트너라는 평판을 체계적으로 쌓아 왔습니다. 이제 그 소프트 파워는 인구와 군사력으로 예측되는 수준을 넘어서며, 국제 무대에서 지속적인 정치적 영향력을 부여합니다."
 HOL_development_partner_opinion: "네덜란드 개발 파트너"
 HOL_water_partnership_opinion: "네덜란드 물 파트너십"
 HOL_eu_leadership_opinion: "네덜란드의 EU 리더십"
 HOL_mocro.1.t: "이름만 아닐 뿐 마약 국가인가?"
 HOL_mocro.1.d: "코카인이 로테르담으로 쏟아져 들어오고, 도시의 지하세계에 뿌리를 둔 범죄 조직이 수십억을 세탁하며, 연이은 살인이 증인, 변호사, 언론인을 덮쳤습니다. 논평가들은 네덜란드가 조직범죄에 밀리고 있는 것 아니냐고 공공연히 묻고 있습니다."
 HOL_mocro.1.a: "법치에 대한 위협에 맞선다"
 HOL_mocro.1.b: "위협이 과장되었다"
 HOL_mocro.2.t: "로테르담에서 사상 최대의 코카인 적발"
 HOL_mocro.2.d: "세관원들이 과일 컨테이너에 숨겨진 수 톤의 코카인을 적발했습니다. 수사관들은 이른바 '추출자'라 불리는 부패한 부두 노동자들이 항구를 통해 화물을 빼돌리도록 도운 것으로 의심하고 있습니다."
 HOL_mocro.2.a: "항구의 세관을 강화한다"
 HOL_mocro.2.b: "화물이 빠져나간다"
 HOL_mocro.3.t: "총격으로 살해된 변호사"
 HOL_mocro.3.d: "대규모 조직범죄 재판과 관련된 변호인이 대낮에 총에 맞아 숨졌습니다. 이 살인은 사법 체계에 대한 직접적인 공격이며 대중에게 큰 충격을 안겼습니다."
 HOL_mocro.3.a: "증인에게 국가 보호를 제공한다"
 HOL_mocro.3.b: "모두를 보호할 수는 없다"
 HOL_mocro.4.t: "암호화 네트워크 해독"
 HOL_mocro.4.d: "경찰이 범죄 조직이 사용하는 암호화 휴대전화 네트워크에 침투하여 밀매, 자금 세탁, 계획된 살인에 관한 수백만 건의 메시지를 확보했습니다."
 HOL_mocro.4.a: "가로챈 메시지에 따라 조치한다"
 HOL_mocro.4.b: "모든 단서를 추적할 인력이 부족하다"
 HOL_mocro.5.t: "벽돌과 모르타르에 스며든 검은 돈"
 HOL_mocro.5.d: "수사관들은 세탁된 마약 수익이 전국의 부동산, 식당, 소규모 사업체로 흘러들어간 경로를 추적했습니다. 소유 관계를 풀어내는 일은 더디고 정치적으로 민감할 것입니다."
 HOL_mocro.5.a: "자산을 압류한다"
 HOL_mocro.5.b: "못 본 척한다"
 HOL_mocro.6.t: "잃어버린 세대"
 HOL_mocro.6.d: "모집책들은 빠른 돈과 지위를 미끼로 어려운 동네의 십대들을 마약 거래로 끌어들이고 있으며, 폭력적인 청년 하위문화는 갱스터의 삶을 미화합니다."
 HOL_mocro.6.a: "예방 및 청소년 프로그램에 자금을 지원한다"
 HOL_mocro.6.b: "강력한 단속으로 대응한다"
 HOL_mocro.7.t: "항구의 부패"
 HOL_mocro.7.d: "내부 조사 결과 세관 공무원, 항만 노동자, 경찰이 범죄 조직의 돈을 받고 있다는 사실이 드러났습니다. 이들을 뿌리 뽑으면 항구의 운영이 마비될 위험이 있습니다."
 HOL_mocro.7.a: "부패한 공무원을 숙청한다"
 HOL_mocro.7.b: "조치할 만한 증거가 없다"
 HOL_mocro.8.t: "판결에 이른 마렝고 재판"
 HOL_mocro.8.d: "비상한 보안 속에 수년간 이어진 소송 끝에, 법원은 이 나라에서 가장 악명 높은 범죄 조직의 두목들에게 유죄를 선고했습니다. 이는 법치의 기념비적 승리입니다."
 HOL_mocro.8.a: "정의가 실현되었다"
 VVD_Leader_Wilders: "§YGeert Wilders§!이(가) £HOL_western_liberal VVD 당수입니다"
 HOL_wilders_vvd_firebrand: "언론의 선동가"
 HOL_wilders_vvd_firebrand_desc: "언론과 의회에서 끊임없이 존재감을 드러내며 경쟁자들을 수세에 몰아넣고, 외부의 압력에 맞서 당을 단단히 결속시킵니다."
 HOL_voice_of_the_discontented: "불만을 품은 자들의 목소리"
 HOL_voice_of_the_discontented_desc: "다른 이들이 외면하는 유권자들을 대변하여 이들을 당에 결집시키는 동시에 나라를 외국의 간섭으로부터 보호합니다."
 HOL_asylum_clampdown: "난민 단속"
 HOL_asylum_clampdown_desc: "더 엄격한 입국 규정과 신속한 절차로 신규 입국자가 급감하여 주택과 노동 시장의 부담이 완화됩니다."
 HOL_politics.82.t: "난민 중단"
 HOL_politics.82.d: "수용 센터가 넘쳐나고 여론은 조치를 요구합니다. 빌더르스는 난민 유입에 대해 가능한 가장 강경한 대응을 촉구합니다."
 HOL_politics.82.a: "엄격한 법적 상한을 도입한다"
 HOL_politics.82.b: "대규모 추방을 명령한다"
 HOL_politics.83.t: "통합 논쟁"
 HOL_politics.83.d: "빌더르스는 이슬람, 통합, 네덜란드 정체성을 둘러싼 전국적 논쟁을 촉발합니다. 당은 어디까지 밀어붙일지 결정해야 합니다."
 HOL_politics.83.a: "동화 교육을 의무화한다"
 HOL_politics.83.b: "표현의 자유를 수호하고 맞선다"
 HOL_politics.84.t: "예루살렘으로의 대사관"
 HOL_politics.84.d: "이스라엘의 열렬한 친구인 빌더르스는 정부가 예루살렘을 인정하고 네덜란드 대사관을 그곳으로 옮기도록 촉구합니다. 워싱턴은 박수를 보내겠지만, 중동 전역의 수도들은 결과를 경고합니다."
 HOL_politics.84.a: "대사관을 예루살렘으로 옮긴다"
 HOL_politics.84.b: "대사관을 텔아비브에 유지한다"
 HOL_polder_model: "폴더 모델"
 HOL_polder_model_desc: "폴더 모델은 정부, 고용주, 노동조합이 결정을 강요하는 대신 폭넓은 합의를 협상하는, 합의에 기반한 정책 결정이라는 네덜란드의 전통입니다. 수 세기에 걸친 협력적 수자원 관리에 뿌리를 둔 이 모델은 타협과 안정적인 연립을 선호하여, 더 느리고 신중한 개혁이라는 대가를 치르는 대신 네덜란드 정치에 회복력과 외교적 신뢰를 부여합니다."
 HOL_politics.85.t: "프랑스의 분할 동참"
 HOL_politics.85.d: "파리는 우리의 제안을 수락했으며 벨기에에 미래에 관한 국민투표를 압박할 것입니다. 분할의 기반이 마련되었습니다. 이제 벨기에 관련 결정을 통해 이 문제를 추진할 수 있습니다."
 HOL_politics.85.a: "훌륭하군."
 BNL_aswf_frigates_remaining_tt: "인도된 ASWF 호위함이 4척 미만입니다"
 BNL_lay_down_aswf_frigate: "ASWF 호위함 기공"
 BNL_lay_down_aswf_frigate_desc: "대잠수함전 호위함 사업은 노후화된 카럴 도르만급과 빌링언급 호위함을 네덜란드 왕립 해군용 2척과 벨기에 해군 부대용 2척, 총 4척의 현대식 함정으로 대체하기 위한 벨기에와 네덜란드의 공동 노력입니다. 정숙한 선체, 예인 배열 소나 체계, 탑재형 대잠 헬리콥터를 중심으로 설계된 각 함정은 다멘 조선소에서 한 차례의 전체 건조 주기를 거쳐 기공된 뒤 함대에 합류합니다."
 BNL_aswf_capability_update: "ASWF 중간 수명 능력 개량"
 BNL_aswf_capability_update_desc: "대잠수함전 호위함 4척이 모두 취역함에 따라 양국 공동 사업단은 중간 수명 현대화를 승인합니다. 개선된 추진 체계, 향상된 소나 체계, 강화된 방공 발사관, 새롭게 단장한 헬리콥터 시설 덕분에 이 함급은 잔여 복무 기간 동안 현대 잠수함 위협에 맞서 경쟁력을 유지합니다."
 HOL_deploy_islands_commando: "외곽 섬에 특공대 투입"
 HOL_gulden_reintroduced: "§Y[HOL.GetNameWithFlag]§!이(가) $gulden$을(를) 국가 통화로 재도입함"
 HOL_marinestudie_tt: "새로운 §Y해군 지도자§!는 진급 시 특성 §Y$HOL_navy_moderniser_leader$§!을(를) 얻을 수 있습니다."
 HOL_navy_moderniser_leader: "해군 현대화 추진자"
 HOL_nationalist_populism_modifier: "민족주의 사회"
 HOL_FAD_GER_declined: "§Y[GER.GetNameWithFlag]§!이(가) 프로젝트에서 탈퇴함"
 HOL_FAD_construction: "미래 대공 방어함 건조"
 HOL_FAD_construction_desc: "우리 조선소는 미래 대공 방어함 방공 호위함을 건조하고 있습니다. 프로그램이 종료되면 완성된 함선은 곧바로 함대에 취역합니다."
 HOL_FAD_delay_reduced_tt: "새로운 협력국이 남은 건조 시간을 단축합니다"
 HOL_FAD_ger_withdrew_tt: "독일의 탈퇴로 남은 건조가 지연됩니다"
 HOL_military.038.t: "기로에 선 미래 대공 방어함"
 HOL_military.038.d: "미래 대공 방어함은 비용 상승과 상충하는 요구 사항에 부딪혔으며, 조선소는 일정을 지키기 위해 더 많은 자금이 필요합니다. 연방의회는 분담금을 늘릴지, 아니면 프로그램에서 탈퇴할지 결정해야 합니다."
 HOL_military.038.a: "분담금을 늘린다"
 HOL_military.038.b: "프로그램에서 탈퇴한다"
 HOL_ing_group_upgrades_tt: "ING 해외 진출: §Y[?HOL_ing_group_upgrades|0]§!/3"
 HOL_daf_organization: "DAF"
 HOL_werkspoor_equipment_manufacturer_mio_header_diesel_locomotive_program: "디젤 기관차 프로그램"
 HOL_werkspoor_equipment_manufacturer_mio_header_industrial_diversification: "산업 다각화"
 BEL_sabiex_international_tank_manufacturer_mio_header_m113_heritage: "M113 유산"
 BEL_sabiex_international_tank_manufacturer_mio_header_wheeled_armour: "차륜형 장갑차"
 BEL_sabiex_international_tank_manufacturer_mio_header_logistics_fleet: "병참 차량단"
 Pim_Fortuyn_Alive: "핌 포르퇴인 생존"
 HOL_wilders_party_created: "자유당 창당됨"
 HOL_D66_in_progress_flag: "D66 중점 진행 중"
 HOL_SGP_in_progress_flag: "SGP 중점 진행 중"
 HOL_GL_in_progress_flag: "녹색좌파 중점 진행 중"
 HOL_failed_declaring_war_voc: "VOC를 위한 선전포고 실패"
 HOL_suriname_accepted_infrastructure: "수리남 기반시설 협정 수락됨"
 HOL_accepted_FRA_carrier: "프랑스 항공모함 지원 수락됨"
 HOL_claim_german_leadership_tt: "정부 수입이 정부 지출을 초과합니다."
 HOL_voc_india_christian_tt: "인도 정부에 대한 기독교 공동체의 관계가 50% 미만입니다."
 HOL_asml_high_na_innovation_monopoly: "High-NA 혁신 독점"
 HOL_asml_high_na_innovation_monopoly_desc: "ASML은 성숙한 EUV 생산, High-NA 선도력, 탄력적인 공급업체 네트워크를 결합합니다. 네덜란드의 연구와 서비스 역량이 첨단 리소그래피에서 ASML의 독보적 위치를 뒷받침합니다."
 HOL_asml_resilient_european_tooling_network: "탄력적인 유럽 장비 네트워크"
 HOL_asml_resilient_european_tooling_network_desc: "ASML은 정밀 공급업체와 현장 서비스 팀으로 이루어진 다변화된 유럽 네트워크의 중심에 있습니다. 신뢰성과 고객 지원이 장비 수요를 지속적인 수출 수입으로 전환합니다."
 HOL_asml_neutral_global_lithography_utility: "중립적 글로벌 리소그래피 공급자"
 HOL_asml_neutral_global_lithography_utility_desc: "ASML은 상업적으로 중립적인 배분 정책 아래 정치 블록을 가리지 않고 자격을 갖춘 고객에게 서비스를 제공합니다. 폭넓은 접근은 연구 파트너십과 수출 수익을 뒷받침합니다."
 HOL_asml_strategic_western_gatekeeper: "전략적 서방 관문지기"
 HOL_asml_strategic_western_gatekeeper_desc: "네덜란드의 허가 정책은 첨단 시스템 접근권을 전략적 파트너들에게 집중시킵니다. 이 정책은 국가의 영향력을 강화하는 대신 ASML의 상업적 도달 범위를 좁힙니다."
 HOL_asml_commercial_tooling_champion: "상업 장비 선도 기업"
 HOL_asml_commercial_tooling_champion_desc: "ASML은 보다 특화된 전략적 성과를 달성하지는 못했지만 여전히 수익성 있는 글로벌 장비 공급업체입니다. 연구와 수출 입지는 여전히 네덜란드 경제에 도움이 됩니다."
 HOL_asml_backlog_pressure_moderate: "장비 수주 잔량 증가"
 HOL_asml_backlog_pressure_moderate_desc: "강한 리소그래피 수요가 서비스와 엔지니어링 업무량을 늘리는 한편 장비 수출 수입을 뒷받침합니다."
 HOL_asml_backlog_pressure_severe: "심각한 장비 수주 잔량"
 HOL_asml_backlog_pressure_severe_desc: "예외적인 수주 잔량이 장비 수익을 끌어올리지만 엔지니어를 연구와 고객 인증 업무에서 빼앗아 갑니다."
 HOL_asml_events.1.t: "EUV에 대한 전념"
 HOL_asml_events.1.d: "세기 초에 ASML은 광원과 광학계 문제가 해결되지 않았음에도 극자외선 리소그래피가 지속적인 투자를 받을 가치가 있는지 결정해야 합니다. 이 결정은 회사의 연구 지평을 좌우할 것입니다."
 HOL_asml_events.1.a: "장기 전망에 전념한다"
 HOL_asml_events.1.a_tt: "리소그래피 선도력: §G+1§!\nEUV 성숙도: §G+1§!"
 HOL_asml_events.1.b: "EUV와 현행 플랫폼의 균형을 맞춘다"
 HOL_asml_events.1.b_tt: "공급업체 회복력: §G+2§!\n고객 다변화: §G+1§!"
 HOL_asml_events.2.t: "EUV 프로그램 통합"
 HOL_asml_events.2.d: "시제품 작업은 EUV 광원, 광학계, 스테이지, 소프트웨어가 서로 얼마나 긴밀하게 의존하는지 드러냈습니다. ASML은 프로그램을 통합하거나 단기 고객 납품을 우선할 수 있습니다."
 HOL_asml_events.2.a: "개발 프로그램을 통합한다"
 HOL_asml_events.2.a_tt: "EUV 성숙도: §G+1§!\n공급업체 회복력: §G+1§!"
 HOL_asml_events.2.b: "현행 납품을 보호한다"
 HOL_asml_events.2.b_tt: "고객 다변화: §G+2§!\nEUV 성숙도: §R-1§!"
 HOL_asml_events.3.t: "최초의 EUV 알파 장비"
 HOL_asml_events.3.d: "ASML의 첫 알파 시연 시스템은 EUV를 실험실 부품에서 통합 장비로 끌어올립니다. 장비는 아직 실험 단계이며, 엔지니어링 우선순위가 시제품에서 무엇을 배울지를 결정할 것입니다."
 HOL_asml_events.3.a: "통합 알파 장비를 추진한다"
 HOL_asml_events.3.a_tt: "리소그래피 선도력: §G+1§!\nEUV 성숙도: §G+2§!"
 HOL_asml_events.3.b: "시제품 신뢰성을 우선한다"
 HOL_asml_events.3.b_tt: "EUV 성숙도: §G+1§!\n공급업체 회복력: §G+2§!"
 HOL_asml_events.4.t: "BRION 인수"
 HOL_asml_events.4.d: "컴퓨테이셔널 리소그래피는 고객이 마스크와 공정 조건이 인쇄된 패턴에 어떤 영향을 주는지 예측하도록 도울 수 있습니다. BRION을 인수하면 이러한 모델을 ASML의 스캐너와 통합할 수 있습니다."
 HOL_asml_events.4.a: "BRION의 전문성을 통합한다"
 HOL_asml_events.4.a_tt: "리소그래피 선도력: §G+1§!\n고객 다변화: §G+1§!"
 HOL_asml_events.4.b: "역량을 자체 개발한다"
 HOL_asml_events.4.b_tt: "리소그래피 선도력: §G+1§!\n전략적 통제: §G+1§!"
 HOL_asml_events.5.t: "YieldStar 계측 통합"
 HOL_asml_events.5.d: "YieldStar 계측은 스캐너 성능을 생산 웨이퍼에서 측정한 값과 연결할 수 있습니다. ASML은 통합 공정 제어를 강조할지, 더 폭넓은 서비스 모델을 강조할지 결정해야 합니다."
 HOL_asml_events.5.a: "스캐너와 계측 데이터를 통합한다"
 HOL_asml_events.5.a_tt: "EUV 성숙도: §G+1§!\n공급업체 회복력: §G+1§!"
 HOL_asml_events.5.b: "계측 서비스 모델을 구축한다"
 HOL_asml_events.5.b_tt: "고객 다변화: §G+2§!\n공급업체 회복력: §G+1§!"
 HOL_asml_events.6.t: "NXE:3100 인도"
 HOL_asml_events.6.d: "삼성은 고객에게 제공되는 최초의 EUV 시스템인 ASML NXE:3100을 인수할 준비가 되어 있습니다. 인도는 고객의 학습을 심화할 수 있으며, 추가 실험실 작업은 더 폭넓은 배치에 앞서 기술적 위험을 줄일 수 있습니다."
 HOL_asml_events.6.a: "삼성에 시스템을 인도한다"
 HOL_asml_events.6.a_tt: "EUV 성숙도: §G+1§!\n고객 다변화: §G+1§!"
 HOL_asml_events.6.b: "실험실 검증을 연장한다"
 HOL_asml_events.6.b_tt: "EUV 성숙도: §G+2§!\n고객 다변화: §R-1§!"
 HOL_asml_events.7.t: "고객 공동 투자 프로그램"
 HOL_asml_events.7.d: "ASML은 주요 고객들에게 차세대 리소그래피에 필요한 연구 역량에 공동 투자할 것을 요청하고 있습니다. 삼성을 참여시키거나, 네덜란드 기업이 자체 자금 조달로 통제권을 유지할 수 있습니다."
 HOL_asml_events.7.a: "삼성을 참여시킨다"
 HOL_asml_events.7.a_tt: "고객 다변화: §G+1§!\n전략적 통제: §G+1§!\n한국이 존재하면 삼성이 협상 대응 사건을 받습니다."
 HOL_asml_events.7.b: "프로그램을 자체 조달한다"
 HOL_asml_events.7.b_tt: "전략적 통제: §G+2§!\n고객 다변화: §R-1§!"
 HOL_asml_events.8.t: "사이머 통합"
 HOL_asml_events.8.d: "사이머의 광원 엔지니어링은 EUV 처리량과 가용성의 핵심입니다. 공급업체를 ASML 내부로 편입하면 협업이 개선될 수 있으며, 다변화된 광원 전략은 더 많은 외부 이중화를 유지할 것입니다."
 HOL_asml_events.8.a: "사이머의 광원 팀을 통합한다"
 HOL_asml_events.8.a_tt: "EUV 성숙도: §G+1§!\n공급업체 회복력: §G+2§!"
 HOL_asml_events.8.b: "다변화된 광원 작업을 유지한다"
 HOL_asml_events.8.b_tt: "공급업체 회복력: §G+2§!\nEUV 성숙도: §G+1§!"
 HOL_asml_events.9.t: "NXE:3400 준비"
 HOL_asml_events.9.d: "NXE:3400 세대는 EUV 성능을 양산에 적합한 시스템으로 바꿔야 합니다. ASML은 상용화를 가속하거나 신뢰성을 지키기 위해 더 느린 증산을 택할 수 있습니다."
 HOL_asml_events.9.a: "상업적 배치를 준비한다"
 HOL_asml_events.9.a_tt: "EUV 성숙도: §G+1§!\n고객 다변화: §G+1§!"
 HOL_asml_events.9.b: "보수적인 증산을 택한다"
 HOL_asml_events.9.b_tt: "공급업체 회복력: §G+2§!\nEUV 성숙도: §G+1§!"
 HOL_asml_events.10.t: "상업용 EUV 검증"
 HOL_asml_events.10.d: "EUV는 선도적인 파운드리에서 생산 기술이 되고 있습니다. ASML은 시스템 성능에 집중하거나, 늘어나는 설치 기반을 지원하는 데 필요한 서비스 조직을 확장할 수 있습니다."
 HOL_asml_events.10.a: "상업용 플랫폼을 검증한다"
 HOL_asml_events.10.a_tt: "리소그래피 선도력: §G+1§!\nEUV 성숙도: §G+1§!"
 HOL_asml_events.10.b: "고객 서비스 확대를 우선한다"
 HOL_asml_events.10.b_tt: "고객 다변화: §G+2§!\n공급업체 회복력: §G+1§!"
 HOL_asml_events.11.t: "100번째 EUV 시스템"
 HOL_asml_events.11.d: "ASML이 출하한 100번째 EUV 시스템은 설치 기반의 급격한 증가를 의미합니다. 회사는 생산 증가에 맞춰 예비 부품, 현장 엔지니어, 고객 지원을 확충해야 합니다."
 HOL_asml_events.11.a: "납품과 함께 서비스를 확대한다"
 HOL_asml_events.11.a_tt: "공급업체 회복력: §G+2§!\n고객 다변화: §G+1§!"
 HOL_asml_events.11.b: "납품 물량을 우선한다"
 HOL_asml_events.11.b_tt: "고객 다변화: §G+2§!\n공급업체 회복력: §R-1§!"
 HOL_asml_events.12.t: "최초의 High-NA 시스템 인도"
 HOL_asml_events.12.d: "ASML의 첫 High-NA EUV 시스템은 더 큰 개구수와 새로운 세대의 공정 통합 과제를 도입하며, 인텔이 가장 먼저 받기를 원합니다. 조기 인도는 기술적 선도력을 입증하거나 더 폭넓은 고객 시범 운용을 뒷받침할 수 있습니다."
 HOL_asml_events.12.a: "첫 완제 시스템을 인도한다"
 HOL_asml_events.12.a_tt: "리소그래피 선도력: §G+1§!\nEUV 성숙도: §G+2§!"
 HOL_asml_events.12.b: "고객 시범 운용을 확대한다"
 HOL_asml_events.12.b_tt: "EUV 성숙도: §G+1§!\n고객 다변화: §G+2§!"
 HOL_asml_events.13.t: "imec High-NA 연구소 개소"
 HOL_asml_events.13.d: "ASML과 imec은 고객과 공급업체가 소재, 마스크, 공정 흐름을 시험할 수 있는 공동 High-NA 연구소를 열고 있습니다. 이 시설은 공동 검증을 강조하거나 독자적 통제를 강조할 수 있습니다."
 HOL_asml_events.13.a: "공동 연구소를 개소한다"
 HOL_asml_events.13.a_tt: "공급업체 회복력: §G+1§!\n고객 다변화: §G+1§!"
 HOL_asml_events.13.b: "검증을 독자적으로 유지한다"
 HOL_asml_events.13.b_tt: "리소그래피 선도력: §G+1§!\n전략적 통제: §G+2§!"
 HOL_asml_events.14.t: "첨단 수출 통제 확대"
 HOL_asml_events.14.d: "네덜란드 정부는 첨단 반도체 제조 장비에 대한 통제를 확대하고 있으며, 이는 실질적으로 ASML이 누구에게 판매할 수 있는지를 결정하는 일입니다. 허가는 전략적 안보 정책을 따르거나 자격을 갖춘 고객 사이에서 폭넓은 배분을 유지할 수 있습니다."
 HOL_asml_events.14.a: "전략적 허가를 채택한다"
 HOL_asml_events.14.a_tt: "전략적 통제: §G+3§!\n전략적 허가 시장 기조를 설정합니다."
 HOL_asml_events.14.b: "개방적 배분을 유지한다"
 HOL_asml_events.14.b_tt: "고객 다변화: §G+1§!\n전략적 통제: §R-2§!\n개방형 고객 배분 시장 기조를 설정합니다."
 HOL_asml_events.15.t: "ASML의 전략적 위치 평가"
 HOL_asml_events.15.d: "ASML이 누적해 온 선택들은 이제 첨단 리소그래피, 공급업체 조율, 고객 서비스, 수출 허가 분야에서의 위치를 규정합니다. 이 최종 평가는 역사적 측정이 아닌 게임플레이상의 종합입니다."
 HOL_asml_events.15.a: "ASML의 전략적 결과를 확정한다"
 HOL_asml_events.15.a_tt: "다섯 개의 한정된 기업 점수에 따라 정확히 하나의 ASML 최종 성과를 적용합니다."
 HOL_asml_technology_threshold_tt: "리소그래피 선도력이 7 초과이고 EUV 성숙도가 5 초과여야 합니다."
 HOL_conservative_society_modifier: "보수주의 사회"
 HOL_FAD_member: "퓨처 에어 디펜더 프로그램 참가국임"
 HOL_common_event.19.t: "핌 포르퇴인 리스트"
 HOL_common_event.19.d: "살기 좋은 네덜란드가 한 신문 인터뷰에서 이슬람과 이민에 관해 한 발언을 이유로 핌 포르퇴인을 대표 후보에서 제외했습니다. 며칠 만에 포르퇴인은 자신의 정당인 핌 포르퇴인 리스트를 출범시켰고, 살기 좋은 네덜란드의 전 당원들이 총선을 앞두고 이 당에 합류하고 있습니다."
 HOL_common_event.19.a: "포르퇴인의 반란에 자신만의 깃발이 생겼다."
 HOL_marine_modified_idea: "수정된 해병대 이전 계획"
 HOL_usa_taiwan_compensation: "대만 보상금 지급"
 USA_Taiwan_Compensation_Benefit: "네덜란드의 대만 보상"
