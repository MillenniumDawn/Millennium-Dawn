 AUTOMATION_SETTINGS_INFLUENCE_DESC: "配置定期执行的操作，以保护我国政府免受外国影响。"
 AUTOMATION_SETTINGS_SPACE_SAVE_BUTTON_TT: "将太空计划中暂存的有效载荷清单存储为§Y自定义§!计划，并切换到该计划。\n\n§Y先决条件：§!\n[!automation_space_save_button_click_enabled]"
 AUTOMATION_SETTINGS_SPACE_UPGRADE_BUTTON_TT: "在现有轨道覆盖范围允许的情况下，将每个星座推广到最新一代的研究对象。\n\n§Y先决条件：§!\n[!automation_space_upgrade_button_click_enabled]"
 AUTOMATION_SETTINGS_NOTIFICATIONS_HEADER: "通知和偏好设置"
 AUTOMATION_SETTINGS_UN_HEADER: "联合国"
 AUTOMATION_SETTINGS_NATO_HEADER: "北约"
 AUTOMATION_SETTINGS_ENERGY_HEADER: "能源"
 AUTOMATION_SETTINGS_PP_RESERVE: "政治点数储备"
 AUTOMATION_SETTINGS_PP_RESERVE_VALUE: "£pol_power [?automation_pp_reserve|0]"
 AUTOMATION_SETTINGS_PP_RESERVE_TT: "消耗政治点数的自动行动会等到政治点数足以支付其成本且不低于储备值时才会执行。手动行动不受影响。\n\n£click_left §Y左键点击§!：调整§Y1§!\n£key_ctrl + £click_left §YCtri+左键点击§!：调整§Y10§!\n£key_shift + £click_left §YShift+左键点击§!：调整§Y100§!"
 AUTOMATION_SETTINGS_PP_RESERVE_PLUS_TT: "£click_left §Y左键点击§!：增加§Y1§!\n£key_ctrl + £click_left §YCtrl+左键点击§!：增加§Y10§!\n£key_shift + £click_left §YShift+左键点击§!：增加§Y100§!"
 AUTOMATION_SETTINGS_PP_RESERVE_MINUS_TT: "£click_left §Y左键点击§!：减少§Y1§!\n£key_ctrl + £click_left §YCtrl+左键点击§!：减少§Y10§!\n£key_shift + £click_left §YShift+左键点击§!：减少§Y100§!"
 AUTOMATION_SETTINGS_CORRUPTION: "自动拒绝腐败提议"
 AUTOMATION_SETTINGS_CORRUPTION_TT: "自动跳过腐败提议。启用此功能后，相关活动及其加成将不会显示。"
 AUTOMATION_SETTINGS_FOREIGN_ELECTION: "外国选举通知"
 AUTOMATION_SETTINGS_FOREIGN_ELECTION_TT: "显示其他国家选举的新闻通知。"
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS: "影响突袭通知"
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS_TT: "显示其他国家之间的影响力突袭事件。即使禁用此功能，针对我们的突袭事件仍会被报告。"
 AUTOMATION_SETTINGS_INFLUENCE_REPORT: "月度自动影响力报告"
 AUTOMATION_SETTINGS_INFLUENCE_REPORT_TT: "显示受自动影响国家/地区的月度报告。"
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE: "自动接受投资提议"
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE_TT: "自动接受所有收到的国际投资提议。启用此功能将禁用自动拒绝功能。"
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION: "自动拒绝投资提议"
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION_TT: "自动拒绝所有国际投资提议。启用此功能将禁用自动接受提议。"
 AUTOMATION_SETTINGS_REINVESTMENT: "国际投资再投资"
 AUTOMATION_SETTINGS_REINVESTMENT_TT: "选择国际投资的每周收益如何在国库和再投资之间分配。"
 AUTOMATION_SETTINGS_REINVEST_OFF: "禁用"
 AUTOMATION_SETTINGS_REINVEST_OFF_TT: "将所有国际投资收益上缴国库。"
 AUTOMATION_SETTINGS_REINVEST_FULL: "全部"
 AUTOMATION_SETTINGS_REINVEST_FULL_TT: "将所有国际投资收益进行再投资。"
 AUTOMATION_SETTINGS_REINVEST_SPLIT: "拆分"
 AUTOMATION_SETTINGS_REINVEST_SPLIT_TT: "将国际投资收益的一半上缴国库，另一半进行再投资。"
 AUTOMATION_SETTINGS_FUEL_PURCHASE: "自动购买燃料"
 AUTOMATION_SETTINGS_FUEL_PURCHASE_TT: "立即购买燃料，然后每28天检查一次，当燃料储备低于20%时再次购买。禁用此功能可取消未来的购买。"
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS: "重复选定的内部投资"
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS_TT: "启用此功能后，每日需支付§R0.15§!£pol_power 政治点数。在状态视图中右键点击内部投资按钮，选择要重复进行的投资状态和类型。选定的投资项目每周检查一次，并在有空位、国库能够支付当前成本且政治点数储备得以维持的情况下运行。"
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY: "自动补给南极站点"
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY_TT: "从11月到3月，在剩余燃料使用时间不足15天时自动为我们的南极科考站订购燃料；从4月到10月，在剩余燃料使用时间不足30天时自动为我们的南极科考站订购燃料。运输费用§R$0.25b/1000单位燃料§!，极地冬季费用翻倍。订单要等到国库能够支付全部费用后才能执行。"
 AUTOMATION_SETTINGS_ENERGY_CONSUMPTION_POLICY: "自动消费政策"
 AUTOMATION_SETTINGS_SC_VOTE: "安理会默认投票"
 AUTOMATION_SETTINGS_SC_VOTE_TT: "选择我们如何对安全理事会决议进行自动投票。再次单击所选选项即可返回手动投票模式。"
 AUTOMATION_SETTINGS_GA_VOTE: "大会默认投票"
 AUTOMATION_SETTINGS_GA_VOTE_TT: "选择我们如何对大会决议进行自动投票。再次单击所选选项即可返回手动投票模式。"
 AUTOMATION_SETTINGS_VOTE_YES: "是"
 AUTOMATION_SETTINGS_VOTE_NO: "否"
 AUTOMATION_SETTINGS_VOTE_ABSTAIN: "弃权"
 AUTOMATION_SETTINGS_SC_ACCEPT_TT: "对安理会所有决议自动投赞成票。"
 AUTOMATION_SETTINGS_SC_REJECT_TT: "对安理会所有决议，均自动投否决票。常任理事国将在适用情况下行使否决权。"
 AUTOMATION_SETTINGS_SC_ABSTAIN_TT: "自动对安理会所有决议投弃权票。"
 AUTOMATION_SETTINGS_GA_ACCEPT_TT: "对大会的每一项决议自动投赞成票。"
 AUTOMATION_SETTINGS_GA_REJECT_TT: "对大会的每一项决议自动投否决票。"
 AUTOMATION_SETTINGS_GA_ABSTAIN_TT: "自动对大会所有决议投弃权票。"
 AUTOMATION_SETTINGS_NATO_RATIFICATION: "自动批准北约成员国身份"
 AUTOMATION_SETTINGS_NATO_RATIFICATION_TT: "自动花费§Y20§!点£pol_power 政治点数储备来批准每个北约候选国的入盟申请。批准程序将等到政治点数储备能够维持在一定水平后才会进行。"
 AUTOMATION_SETTINGS_INFLUENCE_HEADER: "影响力防御"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE: "自动对抗外国影响"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE_TT: "启用此功能后，每日需支付§R0.05§!点£pol_power 政治点数。如有可用点数，则自动消耗§Y100§!点£pol_power 政治点数，使国内独立度提升§G2.5%§!。每100天重复一次。当政府受到游说或任何一项支出会导致政治点数低于储备时，自动功能暂停。"
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS: "自动攻击外国影响者"
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS_TT: "启用此功能后，每日需支付§R0.05§!点£pol_power 政治点数。系统将自动花费§Y125§!点£pol_power 政治点数，发起一场为期60天的针对最强合格外国影响力人物的行动。每次只能进行一场行动。不符合资格、已被游说或处于冷却期的目标将被跳过。当任何一项支出导致政治点数低于储备时，自动化流程将暂停。"
 AUTOMATION_SETTINGS_INFLUENCE_COST_NOTE: "每个启用选项每天花费§R0.05§!£pol_power 。两个选项一起启用每天花费§R0.10§!£pol_power 。"
 AUTOMATION_SETTINGS_ECONOMY_PAGE: "经济"
 AUTOMATION_SETTINGS_ECONOMY_DESC: "选择要自动管理的税收、公共支出、投资和能源采购。将鼠标悬停在标题或选项上可查看详细信息。"
 AUTOMATION_SETTINGS_TAX_HEADER: "税率"
 AUTOMATION_SETTINGS_BUDGET_HEADER: "预算法"
 AUTOMATION_SETTINGS_TAX_SUMMARY: "已启用的税种每四周根据预算平衡、债务和稳定度最多变动一个百分点。高于预期税率的增税会增加§Y政策过渡成本§!，而低于预期税率的减税则会提供临时加成。当税收过渡惩罚超过10% £stability_texticon §Y稳定度§!时，会增加更多惩罚的增税将被暂停，除非赤字严重。\n\n手动更改不会影响自动化功能。"
 AUTOMATION_SETTINGS_BUDGET_SUMMARY: "已启用的预算会向预期支出方向调整一级。每周最多更改一项预算，并轮流优先处理。增加预算需要预算盈余，当过渡惩罚附加费高于5%时时，会增加更多惩罚的操作将被暂停，战争期间的§Y军事开支§!除外。向预期水平靠拢不会增加§Y政策过渡成本§!。手动更改不会影响自动化功能。"
 AUTOMATION_SETTINGS_POPULATION_TAX: "人口税：[?population_tax_rate|0]%"
 AUTOMATION_SETTINGS_CORPORATE_TAX: "企业税：[?corporate_tax_rate|0]%"
 AUTOMATION_SETTINGS_POPULATION_TAX_TT: "每四周根据预算收支、债务和稳定度，自动将人口税调整一个百分点。遵循税率变更限制，并在超出储备部分时支付正常的政治点数成本。高于预期税率的加税会带来§Y政策过渡成本§!，当税收过渡惩罚超过10% £stability_texticon §Y稳定度§!时，会增加更多惩罚的增税将被暂停，除非赤字严重。手动更改不会影响自动化功能。"
 AUTOMATION_SETTINGS_CORPORATE_TAX_TT: "每四周根据预算收支、债务和稳定度，自动将企业税调整一个百分点。遵循税率变更限制，并在超出储备部分时支付正常的政治点数成本。高于预期税率的加税会带来§Y政策过渡成本§!，当税收过渡惩罚超过10% £stability_texticon §Y稳定度§!时，会增加更多惩罚的增税将被暂停，除非赤字严重。手动更改不会影响自动化功能。"
 AUTOMATION_SETTINGS_BUDGET_BUREAUCRACY: "行政：[?bureau_law|0] / [?expected_adm_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_BUREAUCRACY_TT: "自动将行政开支调整至其预期支出水平，每次调整一级。数值显示当前水平与预期水平。适用常规法律限制与政治点数成本。增加开支需有盈余，并在濒临破产或该项预算的过渡附加费高于5%时暂停。政治点数储备予以保留。向预期水平靠拢不会增加§Y政策过渡成本§!。手动更改不会影响自动化功能。"
 AUTOMATION_SETTINGS_BUDGET_CRIME_FIGHTING: "警务：[?police_law|0] / [?expected_police_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_CRIME_FIGHTING_TT: "自动将警务开支调整至其预期支出水平，每次调整一级。数值显示当前水平与预期水平。适用常规法律限制与政治点数成本。增加开支需有盈余，并在濒临破产或该项预算的过渡附加费高于5%时暂停。政治点数储备予以保留。向预期水平靠拢不会增加§Y政策过渡成本§!。手动更改不会影响自动化功能。"
 AUTOMATION_SETTINGS_BUDGET_EDUCATION_BUDGET: "教育：[?education_law|0] / [?expected_edu_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_EDUCATION_BUDGET_TT: "自动将教育开支调整至其预期支出水平，每次调整一级。数值显示当前水平与预期水平。适用常规法律限制与政治点数成本。增加开支需有盈余，并在濒临破产或该项预算的过渡附加费高于5%时暂停。政治点数储备予以保留。向预期水平靠拢不会增加§Y政策过渡成本§!。手动更改不会影响自动化功能。"
 AUTOMATION_SETTINGS_BUDGET_HEALTH_BUDGET: "医疗保健：[?health_law|0] / [?expected_health_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_HEALTH_BUDGET_TT: "自动将医保支出调整至其预期支出水平，每次调整一级。数值显示当前水平与预期水平。适用常规法律限制与政治点数成本。增加开支需有盈余，并在濒临破产或该项预算的过渡附加费高于5%时暂停。政治点数储备予以保留。向预期水平靠拢不会增加§Y政策过渡成本§!。手动更改不会影响自动化功能。"
 AUTOMATION_SETTINGS_BUDGET_SOCIAL_BUDGET: "福利：[?social_law|0] / [?expected_welfare_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_SOCIAL_BUDGET_TT: "自动将福利开支调整至其预期支出水平，每次调整一级。数值显示当前水平与预期水平。适用常规法律限制与政治点数成本。增加开支需有盈余，并在濒临破产或该项预算的过渡附加费高于5%时暂停。政治点数储备予以保留。向预期水平靠拢不会增加§Y政策过渡成本§!。手动更改不会影响自动化功能。"
 AUTOMATION_SETTINGS_BUDGET_MILITARY_SPENDING: "军事开支：[?military_law|0] / [?expected_military_law|0]"
 AUTOMATION_SETTINGS_BUDGET_MILITARY_SPENDING_TT: "自动将军事开支调整至其预期支出水平，每次调整一级。数值显示当前水平与预期水平。适用常规法律限制与政治点数成本。增加开支需有盈余，并在濒临破产或该项预算的过渡附加费高于5%时暂停。政治点数储备予以保留。向预期水平靠拢不会增加§Y政策过渡成本§!。手动更改不会影响自动化功能。"
 AUTOMATION_SETTINGS_GENERAL_PAGE_TT: "配置通用自动化，例如联合国行动、通知偏好设置和其他次要自动化操作。"
 AUTOMATION_SETTINGS_SPACE_PAGE_TT: "配置卫星自动生产、发射和卫星升级。\n\n§Y先决条件：§!\n[!automation_settings_space_page_button_click_enabled]"
 AUTOMATION_SETTINGS_INFLUENCE_PAGE_TT: "配置影响力自动化，例如影响力防御和攻击。"
 AUTOMATION_SETTINGS_ECONOMY_PAGE_TT: "配置经济自动化功能，例如税率、预算法律、投资和能源。"
 AUTOMATION_SETTINGS_INVESTMENT_HEADER: "投资"
 AUTOMATION_SETTINGS_MAP_PALETTE_HEADER: "地图模式颜色"
 AUTOMATION_SETTINGS_MAP_PALETTE_HEADER_TT: "选择模组地图模式使用的颜色。每个玩家都会为自己游玩的国家/地区设置此颜色，因此切换国家/地区后需要重新设置。选择§Y标准§!可重置此设置。"
 AUTOMATION_SETTINGS_MAP_PALETTE_STANDARD: "标准"
 AUTOMATION_SETTINGS_MAP_PALETTE_STANDARD_TT: "默认颜色，已勾选以确保红绿色盲和蓝黄色盲人士也能清晰阅读。选择此项可重置设置。"
 AUTOMATION_SETTINGS_MAP_PALETTE_RED_GREEN: "红绿色盲"
 AUTOMATION_SETTINGS_MAP_PALETTE_RED_GREEN_TT: "针对红色盲和绿色盲患者。将§Y欧盟§!、§Y影响力§!以及§Y货币储备§!地图模式的颜色间距拉大。其他地图模式则保留一套适用于所有类型的颜色。"
 AUTOMATION_SETTINGS_MAP_PALETTE_BLUE_YELLOW: "蓝黄色盲"
 AUTOMATION_SETTINGS_MAP_PALETTE_BLUE_YELLOW_TT: "针对三色视觉障碍。将§Y欧盟§!、§Y影响力§!以及§Y货币储备§!地图模式的颜色间距拉大。其他地图模式则保留一套适用于所有类型的颜色。"
 AUTOMATION_SETTINGS_MIO_UNLOCK: "自动解锁通用军事工业组织"
 AUTOMATION_SETTINGS_MIO_UNLOCK_TT: "启用后立即按通用军事工业组织目录顺序解锁符合条件的组织，之后每天解锁。每一次解锁消耗£pol_power §R50§!政治点数。相应的经验值消耗也需支付：陆军或空军经验值§R50§!、§R75§!或§R100§!，海军经验值§R100§!（详见目录）。拥有国内组织的国家每次解锁还需消耗§R1个合约代币§!。购买需待所有要求和费用满足且政治力量储备维持在一定水平后方可进行。较早符合条件的条目将优先获得有限的经验值和合约代币。默认情况下此功能已禁用。"