 CZE_Strike_fighter1: "아에로 L-29R 델핀"
 CZE_L_Strike_fighter1: "아에로 L-29 델핀"
 CZE_CV_L_Strike_fighter1: "아에로 L-299 델핀"
 CZE_L_Strike_fighter1_desc: "In response to a sizable requirement for a common jet-propelled trainer to be adopted across the diverse nations of the Eastern Bloc, Aero decided to embark upon their own design project with a view to suitably satisfying this demand. On 5 April 1959, an initial prototype, designated as the XL-29, performed its maiden flight. The L-29 was selected to become the standard trainer for the air forces of Warsaw Pact nations, for which it was delivered from the 1960s onwards."
 CZE_CV_L_Strike_fighter1_desc: "L-29의 함재기 개량형입니다."
 CZE_Strike_fighter2: "아에로 L-39C 알바트로스"
 CZE_cas1: "아에로 L-39ZA 알바트로스"
 CZE_Strike_fighter2_desc: "L-39 Alca로부터 새롭게 개발된 이 항공기는 더 힘이 센 엔진과 튼튼해진 기체 골격으로, 어디서든 단거리 이착륙을 가능캐합니다."
 CZE_cas1_desc: "쉬운 조종성을 가지고 있는 근접 항공 지원기로 가벼운 지원만할 수 있도록 설계되었습니다."
 CZE_Strike_fighter3: "아에로 L-159A 알차"
 CZE_L_Strike_fighter2: "아에로 L-39C 알바트로스"
 CZE_CV_L_Strike_fighter2: "아에로 L-159E 알차"
 CZE_Strike_fighter3_desc: "New development from L-39 and L-59 created this plane with new type of engines, overhauled airframe, modernized cockpit leaving the plane almost totally different from its predecessors."
 CZE_L_Strike_fighter2_desc: "L-159의 폭격기 개량형으로 무장을 탑재하거나 훈련기로 사용될 수 있습니다."
 CZE_CV_L_Strike_fighter2_desc: "L-159의 함재기 개량형입니다."
 CZE_cas2: "아에로 L-39M 알바트로스"
