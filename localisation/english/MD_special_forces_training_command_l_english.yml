 MD_sftc_fully_upgraded: "Fully Upgraded"
 MD_sftc_exercise_ranger: "Ranger Assessment Exercise"
 MD_sftc_exercise_ranger_desc: "Rangers move through a selection and assessment course built around long range patrols, navigation and small unit tactics under sustained fatigue."
 MD_sftc_ex_ranger_short: "Special Ranger Regiment mastery for 90 days."
 MD_sftc_exercise_marine: "Amphibious Raid Exercise"
 MD_sftc_exercise_marine_desc: "Special marine detachments rehearse raids from the sea, using surface craft and small boats, against a defended shoreline."
 MD_sftc_ex_marine_short: "Special Marine Forces mastery for 90 days."
 MD_sftc_exercise_airborne: "Airborne Insertion Exercise"
 MD_sftc_exercise_airborne_desc: "Airborne companies practice night insertion by parachute and transport aircraft, then assemble and move to their objectives."
 MD_sftc_ex_airborne_short: "Airborne Companies mastery for 90 days."
 MD_sftc_exercise_joint: "Joint Special Operations Exercise"
 MD_sftc_exercise_joint_desc: "Ranger, marine and airborne detachments train under one special operations headquarters and fight a combined scenario across land, sea and air."
 MD_sftc_ex_joint_short: "Special Operations mastery for 90 days."
 MD_sftc_exercise_air_assault: "Air Assault Raid"
 MD_sftc_exercise_air_assault_desc: "Rangers deploy by helicopter and transport aircraft to seize an objective behind the front, hold it, and withdraw under air cover."
 MD_sftc_ex_air_assault_short: "Supplemental Special Forces mastery for 90 days."
 MD_sftc_exercise_littoral: "Littoral Ranger Exercise"
 MD_sftc_exercise_littoral_desc: "Rangers train to operate from the sea on coastal approaches, rivers and islands, using boats and naval gunfire support to reach inland targets."
 MD_sftc_ex_littoral_short: "Supplemental Special Forces mastery for 90 days."
 MD_sftc_exercise_envelopment: "Vertical Envelopment Exercise"
 MD_sftc_exercise_envelopment_desc: "Marines and airborne companies strike the same objective from the sea and from the air at once to split the defender's reserves."
 MD_sftc_ex_envelopment_short: "Supplemental Special Forces mastery for 90 days."
 MD_sftc_school_name: "Special Operations Training Program"
 MD_sftc_school_short: "Unlocks Special Operations School, boosts exercises."
 MD_sftc_school_level_text: "Level [?ROOT.MD_sftc_school_level|0]/3"
 MD_sftc_insertion_name: "Expeditionary Insertion Program"
 MD_sftc_insertion_short: "Unlocks Insertion Readiness."
 MD_sftc_insertion_level_text: "Level [?ROOT.MD_sftc_insertion_level|0]/3"
 MD_sftc_command_name: "Special Operations Command Program"
 MD_sftc_command_short: "Unlocks Special Operations Command."
 MD_sftc_command_level_text: "Level [?ROOT.MD_sftc_command_level|0]/3"
 MD_sftc_qualification_name: "Special Forces Qualification Course"
 MD_sftc_qualification_short: "One army leader may gain a special forces trait."
 MD_sftc_qualification_cooldown: "Special Forces Qualification Course in Session"
 MD_sftc_qualification_cooldown_desc: "Selected officers are completing special forces qualification. The next course starts when this one graduates."
 MD_sftc_joint_course_name: "Joint Special Operations Course"
 MD_sftc_joint_course_short: "Every special forces leader gains experience."
 MD_sftc_joint_course_cooldown: "Joint Special Operations Course in Session"
 MD_sftc_joint_course_cooldown_desc: "Special forces officers from all services are training together at the joint special operations course. A new course can begin once this class has finished."
 MD_sftc_school_1: "Special Operations School I"
 MD_sftc_school_1_desc: "A permanent special operations school selects and trains candidates, standardizes tactics and shortens the time needed to raise new special forces units."
 MD_sftc_school_2: "Special Operations School II"
 MD_sftc_school_2_desc: "$MD_sftc_school_1_desc$"
 MD_sftc_school_3: "Special Operations School III"
 MD_sftc_school_3_desc: "$MD_sftc_school_1_desc$"
 MD_sftc_insertion_1: "Insertion Readiness I"
 MD_sftc_insertion_1_desc: "Standing procedures and dedicated lift assets keep special forces ready to deploy by sea and air on short notice."
 MD_sftc_insertion_2: "Insertion Readiness II"
 MD_sftc_insertion_2_desc: "$MD_sftc_insertion_1_desc$"
 MD_sftc_insertion_3: "Insertion Readiness III"
 MD_sftc_insertion_3_desc: "$MD_sftc_insertion_1_desc$"
 MD_sftc_command_1: "Special Operations Command I"
 MD_sftc_command_1_desc: "A unified special operations command plans and controls missions across the services and gives forward units firm support and clear authority."
 MD_sftc_command_2: "Special Operations Command II"
