 UKR_t62_egypt_independent_development_cost_tooltip: "£pol_power §Y5§!와 £army_experience §Y2§!이(가) 필요하며 §Y[?UKR_storage_t62_independent_development_cost|2]십억§! 달러가 듭니다"
 UKR_t62_egypt_independent_development_tt: "시험 후 §YT-62-5TDF§!를 채택하면 §YT-55§! 사업 없이도 §Y[EGY.GetNameWithFlag]§! 근대화 제안에 요구되는 구형 모델 조건을 충족합니다."
 UKR_t62_egypt_kmdb_free_tt: "§YKMDB§!가 보관 중인 전차를 조사하고 있지 않으며, 다른 §YT-55§!나 §YT-62§! 설계도 개발하고 있지 않음"
 UKR_varyag_buy_back_hull: "§Y바랴크§! 되찾기"
 UKR_varyag_buy_back_hull_desc: "\n\n\n\n\n\n£UKR_desctext_varyag_hull_for_tooltip\n\n\n\n\n\n\n\n\n§W매각 상대 §!§L청롯§!§W과의 계약을 취소하고, §!§Y[CHI.GetNameWithFlag]§!§W을(를) 통해 구매자에게 대금을 환불하며, §!§Y[TUR.GetNameWithFlag]§!§W에 대가를 치르고 §!§Y미콜라이우§!§W로 되돌려 예인하게 합니다.§!"
 UKR_varyag_expand_mykolaiv_shipyard: "§Y미콜라이우§! 조선소 확장"
 UKR_varyag_expand_mykolaiv_shipyard_desc: "\n\n\n\n\n\n£UKR_desctext_varyag_refit_for_tooltip\n\n\n\n\n\n\n\n\n§W6개월에 걸쳐 §!§L흑해 조선소§!§W를 확장하는 자금을 지원해 §!§Y미콜라이우§!§W에 §!§G해군 조선소 1개§!§W를 추가합니다. §!§Y바랴크§!§W를 완성하려면 그곳에 조선소가 최소 2개 필요합니다.§!"
 varyag_prepare_refit: "§Y바랴크§! 개수 계획 수립"
 varyag_prepare_refit_desc: "\n\n\n\n\n\n£UKR_desctext_varyag_refit_for_tooltip\n\n\n\n\n\n\n\n\n§W기존 기관을 조사하고, 항공모함의 전자 장비와 방어 무장에 대한 입찰을 받습니다.§!"
 UKR_varyag_install_catapults: "캐터펄트 개조 승인"
 UKR_varyag_install_catapults_desc: "\n\n\n\n\n\n£UKR_desctext_varyag_refit_for_tooltip\n\n\n\n\n\n\n\n\n§W건조를 시작하기 전에 §!§Y바랴크§!§W를 캐터펄트 발진에 맞게 개조합니다. 이 개조로 §!§YF/A-18C 호넷§!§W과 §!§Y라팔 M§!§W을 운용할 수 있으며, §!§YMiG-29K§!§W에 맞춘 스키점프 사양은 대체됩니다.§!"
 varyag_complete_the_carrier: "§Y바랴크§! 완성"
 varyag_complete_the_carrier_desc: "\n\n\n\n\n\n£UKR_desctext_varyag_hull_for_tooltip\n\n\n\n\n\n\n\n\n§W선택한 장비를 설치하고 2년간의 작업 끝에 항공모함을 취역시킵니다. 조선소를 잃으면 §!§R건조가 중단되고 투입한 자금도 사라집니다§!§W.§!"
 UKR_varyag_restore_yak38: "§YYak-38§! 기체 복구"
 UKR_varyag_restore_yak38_desc: "\n\n\n\n\n\n£UKR_desctext_varyag_air_group_for_tooltip\n\n\n\n\n\n\n\n\n§W창고에서 쓸 만한 기체와 예비 부품을 회수해 §!§G6§!대의 §YYak-38§!§W을 6개월 안에 오버홀합니다. 첫 항모 항공단에 쓸 자금을 확정하는 단계입니다.§!"
 UKR_varyag_order_rafale_m: "§Y라팔 M§! 전투기 주문"
 UKR_varyag_order_rafale_m_desc: "\n\n\n\n\n\n£UKR_desctext_varyag_air_group_for_tooltip\n\n\n\n\n\n\n\n\n§W§!§Y[FRA.GetNameWithFlag]§!§W에 §!§G12§!대의 §YRafale M§!§W 전투기를 £treasury §!§R9.00§!§W십억 달러에 요청합니다. 이 주문에는 캐터펄트 개조가 필요합니다.§!"
 UKR_varyag_order_mig29k: "§YMiG-29K§! 전투기 주문"
 UKR_varyag_order_mig29k_desc: "\n\n\n\n\n\n£UKR_desctext_varyag_air_group_for_tooltip\n\n\n\n\n\n\n\n\n§W§!§Y[SOV.GetNameWithFlag]§!§W에 §!§G12§!대의 §YMiG-29K§!§W 전투기를 £treasury §!§R6.00§!§W십억 달러에 요청합니다. 이 주문에는 스키점프 사양이 필요합니다.§!"
 varyag_order_hornets: "§YF/A-18C 호넷§! 전투기 요청"
 varyag_order_hornets_desc: "\n\n\n\n\n\n£UKR_desctext_varyag_air_group_for_tooltip\n\n\n\n\n\n\n\n\n§W§!§Y[USA.GetNameWithFlag]§!§W에 §!§G12§!대의 §YF/A-18C 호넷§!§W 전투기를 승인 시 £treasury §!§R8.00§!§W십억 달러에 요청합니다. 이 주문에는 캐터펄트를 갖춘 §!§Y바랴크§!§W가 필요합니다.§!"
 varyag_chinese_funds_tt: "국고가 더 큰 제안액인 £treasury §R2.00§!십억 달러를 감당할 수 있어야 합니다."
 varyag_turkish_funds_tt: "국고가 합의액인 £treasury §R2.70§!십억 달러를 감당할 수 있어야 합니다."
 varyag_transit_offer_tt: "§Y[TUR.GetNameWithFlag]§!은(는) £treasury §R2.00§!십억 달러를 받고 수락하거나, 미사일 지원을 조건으로 £treasury §R1.00§!십억 달러를 받고 수락하거나, §R협상을 결렬시킬§! 수 있습니다."
 varyag_transit_approved_tt: "§Y바랴크§!가 §Y[CHI.GetNameWithFlag]§!을(를) 향해 §G출항합니다§!. 항해에는 보통 약 4개월이 걸립니다."
 varyag_transit_refused_tt: "§Y[CHI.GetNameWithFlag]§!은(는) §R선체를 잃지만§! 설계도는 그대로 보유합니다. §Y[UKR.GetNameWithFlag]§!은(는) §G선체를 되찾고§! 예인 비용을 지불할 수 있습니다."
 varyag_offer_lapsed_tt: "§R제안이 만료되었습니다.§! 합의 요건이 바뀌었습니다."
 varyag_buyback_tt: "§Y[CHI.GetNameWithFlag]§!이(가) £treasury §R0.20§!십억 달러를 환불받습니다. §Y[TUR.GetNameWithFlag]§!은(는) 되돌려 예인하는 대가로 £treasury §R0.50§!십억 달러를 받습니다. §Y바랴크§!는 §Y미콜라이우§!로 §G돌아오며§!, §Y[CHI.GetNameWithFlag]§!과(와)의 관계는 §R악화됩니다§!."
 varyag_joint_offer_tt: "§Y[UKR.GetNameWithFlag]§!이(가) 동의하면 우리는 §G선체와 연구 보너스§!를 얻습니다. 우리는 §Y[UKR.GetNameWithFlag]§!에 £treasury §R2.50§!십억 달러를 지불하고 §Y[CHI.GetNameWithFlag]§!에 £treasury §R0.20§!십억 달러를 환불합니다."
 varyag_joint_deal_tt: "§Y[TUR.GetNameWithFlag]§!이(가) §G선체를 넘겨받습니다§!. §Y[CHI.GetNameWithFlag]§!은(는) 보상을 받으며, 양국 정부와의 관계는 모두 §R악화됩니다§!."
 varyag_carrier_protests_tt: "§Y[SOV.GetNameWithFlag]§!은(는) 우리의 항공모함 사업에 어떻게 대응할지 결정합니다. 현재 §Y나토§! 회원국들은 §R반발할§! 것입니다."
 UKR_varyag_training_delivery_tt: "취역 시 §Y[SOV.GetNameWithFlag]§!과(와) 평화 상태이고 그쪽의 우리에 대한 호감도가 §Y+30§! 이상이면 §YSu-25UTG§! 훈련기 §G2대§!와 §YSu-33§! §G1대§!를 받습니다."
 varyag_chinese_refit_tt: "다른 요건을 충족하면 선체를 §G$CHI_the_varyag_refit$ 중점에 쓸 수 있게 됩니다§!."
 varyag_blueprints_tt: "설계도는 §Y1985년형 항공모함 선체§!에 §G연구 보너스 25%§!를 제공합니다."
 UKR_varyag_mykolaiv_dockyards_tt: "§Y미콜라이우§!에 §Y해군 조선소 2개§! 이상이 있어야 합니다."
