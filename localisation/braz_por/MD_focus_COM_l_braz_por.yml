 COM_reform_defunct_pmc_units_tt: "Desbloqueia opções adicionais de §YEmpresas Militares Privadas§!.\n"
 COM_mayotte_referendum_starting_chance_tt: "Se a §Y$COM_mayotte_referendum_mission$§! não tiver começado:\nO apoio §Y[MTE.GetAdjective]§! à unificação com as §YComores§! começa em 25 em vez de 10.\n\nSe a §Y$COM_mayotte_referendum_mission$§! tiver começado:\n"
