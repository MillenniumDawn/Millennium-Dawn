 SWI_ruag_integration_centre: "통합 센터"
 SWI_the_bank_of_the_world: "세계의 은행"
 SWI_the_bank_of_the_world_desc: "스위스의 은행 비밀주의는 취리히와 제네바를 세계의 금고로 만들었습니다. 그 역할을 공식화하여 외국 자본이 런던이나 프랑크푸르트가 아닌 이곳에 자리 잡게 합니다."
 SWI_strengthening_swiss_cooperation: "스위스 협력 강화"
 SWI_strengthening_swiss_cooperation_desc: "합동 훈련, 공유된 교리, 표준화된 장비가 스위스 민병대를 새로운 동맹 파트너들과 결속시킵니다."
 SWI_bastion_of_democracy: "민주주의의 보루"
 SWI_bastion_of_democracy_desc: "중립은 결코 무관심이 아니었습니다. 스위스는 자치의 살아 있는 사례로서 있으며, 그 사실을 분명히 밝힙니다."
 SWI_eu_investments: "유럽 투자"
 SWI_eu_investments_desc: "스위스 자본이 단일 시장으로 흘러듭니다. 우리 은행은 유럽의 성장을 뒷받침하고, 유럽의 성장은 우리 은행을 뒷받침합니다."
 SWI_on_our_own_path: "우리만의 길"
 SWI_on_our_own_path_desc: "EU는 여러 고객 중 하나일 뿐입니다. 스위스 금융은 돈을 내는 누구에게나 봉사하며, 오직 베른에만 답합니다."
 SWI_staple_of_democracy: "민주주의의 주축"
 SWI_staple_of_democracy_desc: "서방 수도들이 우리와 거래하는 것은 우리 제도가 예측 가능하기 때문입니다. 그 예측 가능성 자체가 하나의 수출품입니다."
 SWI_eu_candidacy: "유럽 연합 후보국"
 SWI_eu_candidacy_desc: "베른이 브뤼셀에 공식 신청서를 제출합니다. 가입은 양자 협정의 누더기를 끝내고 스위스를 수십 년간 맴돌던 연합에 묶어 둘 것입니다."
 SWI_eu_candidacy_tt: "스위스가 §YEU 후보국§!이 됩니다"
 SWI_friend_for_all: "모두의 친구"
 SWI_friend_for_all_desc: "블록도 없고 연대도 없으며 영원한 친구도 없습니다. 스위스는 모든 국가에 주선을 제공하며 모두에게 신뢰받습니다."
 SWI_trust_in_the_eu: "EU에 대한 신뢰"
 SWI_trust_in_the_eu_desc: "후보국이라는 것은 회원국이라는 뜻이 아닙니다. 회원국들과의 협력을 심화하면 가입 투표에 앞서 스위스의 의지를 입증할 수 있습니다."
 SWI_trust_in_the_eu_tt: "모든 §YEU 회원국§!의 스위스에 대한 관계가 §G+30§! 증가합니다"
 SWI_swiss_independence: "스위스 독립"
 SWI_swiss_independence_desc: "외국 로비는 베른에서 편안해졌습니다. 그들의 영향력이 물러나고 국내 기관들이 통제권을 되찾습니다."
 SWI_mutual_defence_training: "상호 방위 훈련"
 SWI_mutual_defence_training_desc: "알프스 전투 학교가 유럽 파트너들에게 문을 엽니다. 그들의 병사들은 우리의 산을 배우고, 우리 민병대는 그들과 나란히 싸우는 법을 배웁니다."
 SWI_invest_in_eu: "EU에 투자"
 SWI_invest_in_eu_desc: "스위스 연기금과 은행이 유럽 산업에 직접 지분을 확보하여 금융의 무게를 정치적 위상으로 전환합니다."
 SWI_national_investments: "국가 투자"
 SWI_national_investments_desc: "해외로 나갔을 자본이 안으로 향하여 스위스의 인프라, 스위스의 산업, 스위스의 연구로 돌아옵니다."
 SWI_defence_training_in_the_alps: "알프스 방위 훈련"
 SWI_defence_training_in_the_alps_desc: "모든 신병은 자신이 지킬 땅을 배웁니다. 보수 교육은 민병대가 맡아 지켜야 할 계곡에서 훈련을 거듭합니다."
 SWI_european_defence: "유럽 방위"
 SWI_european_defence_desc: "공동 유럽 방위 체제가 형성되며, 스위스의 공학과 스위스의 중립이 그 변두리가 아닌 중심에 놓입니다."
 SWI_swiss_banking: "스위스 은행업"
 SWI_swiss_banking_desc: "우리 은행들은 자신의 이름이 된 나라보다 더 커졌습니다. 이 부문을 통합하여 마땅히 얻은 규모로 일하게 합니다."
 SWI_swiss_banking_two: "세계의 금고"
 SWI_swiss_banking_two_desc: "예금이 모든 대륙에서 도착합니다. 스위스는 대형 금융 중심지들과의 경쟁을 멈추고, 그들이 준비금을 보관하는 장소가 됩니다."
 SWI_last_man_standing: "최후의 일인"
 SWI_last_man_standing_desc: "교리는 최악을 가정합니다. 모든 도로가 끊기고 모든 동맹이 사라진 상황입니다. 민병대는 그럼에도 계속 싸우도록 훈련됩니다."
 SWI_protect_alps: "알프스의 수호자"
 SWI_protect_alps_desc: "알프스는 단순한 풍경이 아닙니다. 고지 계곡에 대한 연방 차원의 보호는 600년 동안 침략자를 막아 온 지형을 보존합니다."
 SWI_Expanding_nuclear_research_desc: "스위스의 원자로는 발전을 넘어섭니다. 연방 연구소들의 연구 프로그램이 핵연료 주기와 재료 과학으로 나아갑니다."
 swiss_political_system4: "스위스의 정치 체제"
 swiss_political_system4_desc: "권력은 다시 칸톤으로 내려갑니다. 베른은 명령하기보다 조율하며, 지방 정부는 지방 정부가 결정할 수 있는 것을 결정합니다. 연방 차원의 의사 결정은 느려지지만, 건설과 행정은 그 결과를 안고 살아가는 사람들에게 책임을 집니다.\n\n이 체제는 스위스가 스스로에게만 답하고 연방 평의회가 민주 정당, 중립 블록, 또는 민족 포퓰리스트의 손에 남아 있는 동안에만 유지됩니다. 외세의 지배 아래 들어가거나 이들 외의 누군가에게 정부를 넘긴다면, 이 체제를 작동시키는 합의는 사라집니다."
 SWI_milita: "무장 민병대"
 SWI_milita_desc: "시민군은 무장하는 만큼 정치화됩니다. 복무는 소총의 학교인 동시에 국가의 학교가 됩니다."
 SWI_multilingual_workers: "다언어 노동자"
 SWI_multilingual_workers_desc: "독일어, 프랑스어, 이탈리아어, 로만슈어를 쓰는 노동자들이 오랫동안 스위스 노동계를 갈라놓은 언어의 경계를 넘어 조직화합니다."
 SWI_propaganda_idea: "국가 선전"
 SWI_propaganda_idea_desc: "연방 언론실은 정보를 전달하는 데 그치지 않고 설득하기 시작합니다. 라디오, 인쇄물, 학교 교육과정이 모두 같은 메시지를 전합니다."
 SWI_true_neutral: "진정한 중립"
 SWI_true_neutral_desc: "§Y특별 규칙:§!\n\n§Y우리는§! §R절대§! §Y세력에 가입할 수 없습니다!§!\n--------------\n무장 중립도, 호의적 중립도 아닙니다. 스위스는 어느 편에도 서지 않고, 기지를 제공하지 않으며, 어떠한 보장에도 서명하지 않습니다.\n--------------\n이 국가 정신은 §H진정한 중립 포기§! 결정을 통해 §R제거§!될 수 있습니다."
 SWI_sig_sauer_ag: "SIG 자우어 AG"
 SWI_sig_sauer_ag_desc: "노이하우젠 공장이 민병대를 무장시킵니다. 군용 소총을 보유한 모든 스위스 가정은 SIG의 생산품 한 자루를 가지고 있는 셈입니다."
 SWI_rheinmetall_cooperation: "라인메탈 협력"
 SWI_rheinmetall_cooperation_desc: "오리콘의 후신인 취리히의 라인메탈 방공 부문은 스위스의 화기 및 레이더 작업을 독일 최대의 무기 기업과 연결합니다."
 SWI_thales_cooperation: "탈레스 협력"
 SWI_thales_cooperation_desc: "탈레스 스위스는 민병대를 네트워크화된 군대로 탈바꿈시키는 레이더, 광전자 장비, 지휘 체계를 공급합니다."
 SWI_local_production1: "국내 생산"
 SWI_local_production1_desc: "해외에서 구입한 무기는 금수 조치를 당할 수 있습니다. 툰에서 만든 무기는 그럴 수 없습니다. 필수 장비는 국내 생산 라인이 대체합니다."
 SWI_pilatus_aircraft_manufacturer_trainer_header: "훈련기"
 SWI_pilatus_aircraft_manufacturer_attack_header: "경공격기"
 SWI_pilatus_aircraft_manufacturer_utility_header: "다목적기 및 수송기"
 switzerland.18.t: "NATO 문제"
 switzerland.18.desc: "가입 의정서가 연방 평의회의 탁자 위에 놓여 있습니다. 서명하면 유럽의 모든 제국보다 오래 존속해 온 무장 중립은 끝납니다."
 switzerland.18.a: "의정서에 서명한다."
 switzerland.18.b: "중립은 협상 대상이 아니다."
 switzerland.22.t: "유럽 내 우리의 위치"
 switzerland.22.desc: "브뤼셀은 스위스의 규제를 EU 법률에 구속시키는 조건으로 더 깊은 무역 접근권을 제안합니다. 주들의 의견이 갈립니다."
 switzerland.22.a: "EU와의 유대를 심화한다."
 switzerland.22.b: "모든 나라와 동등하게 무역한다."
 switzerland.23.t: "스위스의 제안"
 switzerland.23.desc: "베른은 공국이 알프스 연방에 가입할 것을 제안합니다. 리히텐슈타인은 이미 프랑을 사용하고 있으며 우리와 관세 동맹을 공유하고 있습니다. 남은 것은 왕관뿐입니다."
 switzerland.23.a: "연합을 수락한다."
 switzerland.23.b: "공국은 홀로 선다."
 switzerland.24.t: "리히텐슈타인 가입"
 switzerland.24.desc: "파두츠가 동의했습니다. 공국은 정회원으로서 연방에 들어오며, 알프스에 남은 마지막 독립 영토는 사라집니다."
 switzerland.24.a: "알프스가 온전해졌다."
 switzerland.25.t: "리히텐슈타인의 거절"
 switzerland.25.desc: "대공이 거절했습니다. 파두츠는 아무리 작더라도 자신의 왕관과 의회, 그리고 독립을 지킬 것입니다."
 switzerland.25.a: "그렇다면 어쩔 수 없다."
 switzerland.26.t: "알프스 최후통첩"
 switzerland.26.desc: "베른은 최후통첩을 보냈습니다. 공국은 가능하다면 합의로, 필요하다면 무력으로 알프스 연방에 가입해야 합니다. 방어할 필요가 전혀 없었던 국경을 따라 스위스군이 집결하고 있습니다. 이제 란트타크는 리히텐슈타인이 이웃에 복종할 것인지 맞설 것인지 결정해야 합니다."
 switzerland.26.a: "우리는 스위스에 맞설 수 없다."
 switzerland.26.b: "공국은 무릎 꿇지 않는다!"
 SWI_un_member_tt: "스위스는 §Y국제연합 회원국§!이어야 합니다 (§G국제연합 가입§! 결정을 통해 가입)"
 SWI_bank_established_tt: "스위스가 §G서방의 은행§!, §G세계의 은행§!, §G유럽 투자§! 또는 §G우리만의 길§!을 통해 §Y주요 금융 중심지§!를 구축해야 합니다"
 SWI_world_bank_established_tt: "스위스가 §G세계의 은행§!, §G유럽 투자§! 또는 §G우리만의 길§!을 통해 §Y세계 금융 중심지§!를 구축해야 합니다"
 SWI_fiscal_equalization_council: "재정 균등화 기금"
 SWI_fiscal_equalization_council_desc: "주 평의회가 개혁을 이끄는 가운데, 새로운 연방 기금이 가장 부유한 주에서 가장 가난한 주로 부를 재분배하여, 지역 자치를 보존하면서 연방 전체에 균일한 발전과 높은 생활 수준을 보장합니다."
 SWI_idea_mass_produced_firearms: "대량 생산 화기"
 SWI_idea_mass_produced_firearms_desc: "표준화된 생산 라인과 호환 가능한 부품은 소형 화기의 비용을 낮추면서 신뢰성과 방어 성능을 향상시켰습니다."
 SWI_idea_gunship_development: "건십 개발"
 SWI_idea_gunship_development_desc: "중무장한 헬리콥터 건십은 근접 항공 지원과 정찰을 제공하며, 공중 기동력을 육군의 방어 교리와 결합합니다."
 switzerland.27.t: "유로파이터 구매 요청"
 switzerland.27.d: "스위스가 우리 방위 산업에서 유로파이터 타이푼 항공기를 구매하겠다고 요청했습니다."
 switzerland.27.a: "판매를 승인한다."
 switzerland.27.b: "거절한다. 우리 생산 라인은 가동 중이다."
 switzerland.28.t: "라팔 구매 요청"
 switzerland.28.d: "스위스가 우리 방위 산업에서 라팔 전투기를 구매하겠다고 요청했습니다."
 switzerland.28.a: "판매를 승인한다."
 switzerland.28.b: "거절한다. 우리 생산 라인은 가동 중이다."
 switzerland.29.t: "C-130J 구매 요청"
 switzerland.29.d: "스위스가 우리 방위 산업에서 C-130J 슈퍼 허큘리스 수송기를 구매하겠다고 요청했습니다."
 switzerland.29.a: "판매를 승인한다."
 switzerland.29.b: "거절한다. 우리 생산 라인은 가동 중이다."
 switzerland.30.t: "구매 승인"
 switzerland.30.d: "우리의 구매 요청이 승인되었습니다. 항공기가 인도되고 있습니다."
 switzerland.30.a: "훌륭하군."
 switzerland.31.t: "구매 거절"
 switzerland.31.d: "우리의 구매 요청이 거절되었습니다. 항공기는 인도되지 않을 것입니다."
 switzerland.31.a: "사업에 차질이 생겼다."
 SWI_heer_modifier: "스위스 육군 (Schweizer Heer)"
 SWI_heer_modifier_desc: "스위스 육군은 보편적 징병제를 바탕으로 한 민병 부대로, 시민이 소총을 집에 보관하고 산악을 최전방 방어선으로 간주합니다. 이렇다 할 상비 야전군은 보유하지 않으며, 대신 신속한 동원, 사전 준비된 폭파 시설, 요새화된 알프스 지형에 의존합니다."
 SWI_schweizerische_luftwaffe_modifier: "스위스 공군 (Schweizerische Luftwaffe)"
 SWI_schweizerische_luftwaffe_modifier_desc: "스위스 공군은 연방의 영공을 지키기 위해 존재할 뿐, 그 너머는 염두에 두지 않습니다. 항공기들은 강화된 알프스 기지와 동굴 격납고에서 출격하며, 전력 투사보다는 요격과 영공 감시를 임무로 합니다."
 SWI_military_industry_modifier: "스위스 군수 산업"
 SWI_military_industry_modifier_desc: "스위스의 무기 생산은 규모는 작지만 정밀하며 철저히 독립적입니다. RUAG, MOWAG, SIG 자우어 같은 기업들이 민병대에 장비를 공급하고 해외로 수출하며, 국가 규모에 비해 훨씬 큰 방위 산업 기반을 유지하고 있습니다."
 SWI_politica_estera_svizzera_modifier: "스위스 외교 정책"
 SWI_politica_estera_svizzera_modifier_desc: "무장 중립과 유엔 평화 유지 활동에서부터 은행 간 유대, 유럽 또는 NATO와의 제휴에 이르기까지, 베른이 해외에서 내린 선택이 누적된 결과입니다. 외교 정책 계획의 각 단계는 연방의 위상, 재정, 그리고 민병대의 준비 태세를 좌우합니다."
 SWI_alps_treaty: "알프스 조약"
 SWI_alps_treaty_trade: "알프스 조약 무역 조건"
 SWI_geneva_climate_accord: "제네바 기후 협정"
 SWI_swiss_neutrality: "스위스의 중립"