 ITA_infantry_weapons_1: "BM59"
 ITA_infantry_weapons_1_desc: "BM 59는 1959년 이탈리아에서 개발된 자동 전투 소총입니다. M1 개런드 소총을 기반으로 하며, 7.62x51mm NATO 탄을 사용하고, 탈착식 탄창을 장착하도록 개조되었으며, 연발 사격이 가능합니다. 이후 개량형에는 최신 소총에서 흔히 볼 수 있는 여러 기능이 추가되었습니다."
