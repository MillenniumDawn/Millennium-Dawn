 HOL_groningen_quake_reduce_tt: "Ежемесячное изменение землетрясений в Гронингене: §G-10%§!"
 HOL_groningen_quake_end_tt: "§GПрекращает вызванные добычей землетрясения в Гронингене.§!"
 HOL_groningen.1.t: "Земля уходит из-под ног в Гронингене"
 HOL_groningen.1.d: "Годы непрерывной добычи газа расшатали недра под Гронингеном. Произошло первое крупное вызванное добычей землетрясение: в домах пошли трещины, пострадала инфраструктура. Пока скважины качают, подземные толчки будут повторяться."
 HOL_groningen.1.a: "Мы справимся с последствиями"
 HOL_groningen.2.t: "Землетрясение в Гронингене"
 HOL_groningen.2.d: "Земля снова дрогнула: по всей провинции пошли трещины в домах и пострадала инфраструктура — вызванные добычей толчки продолжаются."
 HOL_groningen.2.a: "Возместить ущерб"
 HOL_soft_power_doctrine: "Доктрина мягкой силы"
 HOL_soft_power_doctrine_desc: "Нидерланды весят в мире больше своих размеров благодаря помощи развитию, руководящей роли в ЕС и мировому распространению своего опыта в водном деле и логистике. Закрепив это как доктрину, страна обращает политический капитал в устойчивое влияние за рубежом."
 HOL_development_cooperation_ministry: "Министерство сотрудничества в целях развития"
 HOL_development_cooperation_ministry_desc: "Нидерланды полностью восстанавливают финансирование министерства по сотрудничеству в целях развития — страна исторически была одним из самых щедрых доноров официальной помощи развитию в пересчёте на ВВП. Помощь направляется на построение долгосрочных партнёрств с правительствами-получателями, а не на выбивание политических уступок."
 HOL_global_development_partnerships: "Мировые партнёрства в целях развития"
 HOL_global_development_partnerships_desc: "Нидерландские посольства и атташе по вопросам развития расширяют работу в Африке, Азии, на Ближнем Востоке и в Латинской Америке. Правительства-получатели отмечают последовательный и ненавязчивый характер нидерландской помощи как знак надёжности."
 HOL_untied_aid_program: "Программа несвязанной помощи"
 HOL_untied_aid_program_desc: "Нидерланды переходят на несвязанную помощь развитию: страны-получатели смогут закупать товары и услуги на открытом рынке. Такой подход укрепляет доброе отношение к нам и расширяет нидерландское влияние сильнее, чем это дало бы выставление условий."
 HOL_humanitarian_leadership: "Гуманитарное лидерство"
 HOL_humanitarian_leadership_desc: "Нидерланды ставят себя в центр международного гуманитарного права и реагирования на кризисы, опираясь на роль Гааги как места пребывания Международного суда ООН и Международного уголовного суда. Это международное положение ограждает нидерландскую внешнюю политику от давления мировой напряжённости."
 HOL_humanitarian_leadership_name: "Гуманитарное лидерство"
 HOL_humanitarian_leadership_name_desc: "Как принимающая сторона международных судов, Нидерланды обладают нравственным авторитетом, который успокаивает внутреннюю политику и позволяет направлять войска за рубеж с куда меньшими дипломатическими трениями."
 HOL_eu_single_market_champion: "Поборник единого рынка ЕС"
 HOL_eu_single_market_champion_desc: "Нидерланды неизменно среди тех государств ЕС, что решительнее всех выступают за углубление единого рынка — особенно в услугах, цифровой торговле и финансовом регулировании. Нидерландские дипломаты деятельно добиваются в институтах ЕС снятия оставшихся барьеров."
 HOL_frugal_four_leadership: "Лидерство «бережливой четвёрки»"
 HOL_frugal_four_leadership_desc: "Вместе с Австрией, Данией и Швецией Нидерланды возглавляют бюджетно-консервативный блок в ЕС, настаивая на бюджетной дисциплине и увязке общих расходов с реформами. Такое согласование усиливает нидерландское влияние в бюджетных переговорах ЕС куда больше, чем позволил бы один двусторонний вес."
 HOL_european_strategic_autonomy: "Европейская стратегическая самостоятельность"
 HOL_european_strategic_autonomy_desc: "Нидерланды отстаивают более самостоятельную оборонную и внешнюю политику Европы, поддерживают «Стратегический компас» ЕС и вкладываются в общие возможности. Нидерландские дипломаты собирают коалиции среди партнёров по ЕС, чтобы склонить союз к более независимой стратегической линии."
 HOL_water_diplomacy_initiative: "Инициатива водной дипломатии"
 HOL_water_diplomacy_initiative_desc: "Голландские инженеры-гидротехники и специалисты Deltares направляются по линии официальной дипломатической программы в страны Африки, Азии и Латинской Америки, страдающие от наводнений или нехватки воды. Образцом служат «Дельта-план» и голландский подход к комплексному управлению водными ресурсами, а вместе с ними выстраиваются прочные технические и политические связи."
 HOL_gateway_to_europe_desc: "Роттердам — крупнейший порт Европы, а Схипхол — один из её главных авиационных узлов. Нидерланды обращают это логистическое положение в дипломатический ресурс: принимают торговые миссии и подают свою инфраструктуру как предпочтительные ворота для партнёров, которым нужен выход на европейские рынки."
 HOL_global_trade_facilitation: "Упрощение мировой торговли"
 HOL_global_trade_facilitation_desc: "Нидерландские дипломаты отстаивают открытую торговлю по правилам — и на западных, и на внеблоковых рынках. Двусторонние соглашения об упрощении торговли, подкреплённые пропускной способностью Роттердама и нидерландскими финансовыми услугами, раздвигают торговый и политический охват страны."
 HOL_dutch_soft_power_powerhouse: "Держава мягкой силы"
 HOL_dutch_soft_power_powerhouse_desc: "Нидерланды последовательно взращивали репутацию надёжного, принципиального и умелого партнёра в помощи развитию, европейском руководстве и торговле. Их мягкая сила теперь превосходит то, что можно было бы предположить по численности населения и военному весу, и даёт стране устойчивое политическое влияние на международных площадках."
 HOL_development_partner_opinion: "Нидерландский партнёр по развитию"
 HOL_water_partnership_opinion: "Голландское водное партнёрство"
 HOL_eu_leadership_opinion: "Нидерландское руководство в ЕС"
 HOL_mocro.1.t: "Наркогосударство во всём, кроме названия?"
 HOL_mocro.1.d: "Через Роттердам хлещет кокаин, укоренившиеся в городском подполье преступные сети отмывают миллиарды, а череда убийств настигла свидетелей, адвокатов и журналиста. Обозреватели открыто спрашивают, не проигрывают ли Нидерланды организованной преступности."
 HOL_mocro.1.a: "Дать отпор угрозе верховенству права"
 HOL_mocro.1.b: "Угроза преувеличена"
 HOL_mocro.2.t: "Рекордная партия кокаина в Роттердаме"
 HOL_mocro.2.d: "Таможенники перехватили тонны кокаина, спрятанные в контейнере с фруктами. Следователи подозревают, что партию провели через порт подкупленные докеры — так называемые «выносчики»."
 HOL_mocro.2.a: "Усилить таможню в порту"
 HOL_mocro.2.b: "Партия проходит мимо"
 HOL_mocro.3.t: "Адвоката расстреляли"
 HOL_mocro.3.d: "Адвокат, связанный с крупным процессом по делу организованной преступности, застрелен средь бела дня. Это убийство — прямой удар по правосудию, и оно потрясло общество."
 HOL_mocro.3.a: "Взять свидетелей под государственную защиту"
 HOL_mocro.3.b: "Всех защитить мы не можем"
 HOL_mocro.4.t: "Зашифрованная сеть взломана"
 HOL_mocro.4.d: "Полиция взломала зашифрованную телефонную сеть, которой пользовались преступные организации, и собрала миллионы сообщений о перевозках наркотиков, отмывании денег и готовящихся убийствах."
 HOL_mocro.4.a: "Действовать по перехваченным сообщениям"
 HOL_mocro.4.b: "У нас не хватит людей на каждую зацепку"
 HOL_mocro.5.t: "Грязные деньги в кирпиче и бетоне"
 HOL_mocro.5.d: "Следователи проследили отмытые наркодоходы в недвижимость, рестораны и малый бизнес по всей стране. Распутать цепочки владения будет долго и политически неудобно."
 HOL_mocro.5.a: "Изъять имущество"
 HOL_mocro.5.b: "Закрыть глаза"
 HOL_mocro.6.t: "Потерянное поколение"
 HOL_mocro.6.d: "Вербовщики заманивают подростков из неблагополучных кварталов в наркоторговлю быстрыми деньгами и положением, а жестокая молодёжная субкультура воспевает бандитскую жизнь."
 HOL_mocro.6.a: "Вложиться в профилактику и молодёжные программы"
 HOL_mocro.6.b: "Ответить жёстким разгромом"
 HOL_mocro.7.t: "Коррупция в порту"
 HOL_mocro.7.d: "Внутренняя проверка выявила таможенников, портовых рабочих и полицейских на содержании у преступных сетей. Вычистить их — значит рискнуть парализовать работу порта."
 HOL_mocro.7.a: "Вычистить продажных чиновников"
 HOL_mocro.7.b: "Доказательств, на которых можно действовать, нет"
 HOL_mocro.8.t: "По делу «Маренго» вынесен приговор"
 HOL_mocro.8.d: "После нескольких лет разбирательств под чрезвычайной охраной суд признал виновными главарей самого известного преступного синдиката страны. Это знаковая победа верховенства права."
 HOL_mocro.8.a: "Правосудие свершилось"
 VVD_Leader_Wilders: "§YГерт Вилдерс§! — лидер £HOL_western_liberal VVD"
 HOL_wilders_vvd_firebrand: "Трибун в медиа"
 HOL_wilders_vvd_firebrand_desc: "Его неотступное присутствие в прессе и парламенте держит соперников в обороне и закаляет партию против внешнего давления."
 HOL_voice_of_the_discontented: "Голос недовольных"
 HOL_voice_of_the_discontented_desc: "Он говорит от имени избирателей, которых не замечают другие, привязывая их к партии и ограждая страну от иностранного вмешательства."
 HOL_asylum_clampdown: "Закручивание гаек в убежище"
 HOL_asylum_clampdown_desc: "Ужесточение правил въезда и ускорение процедур резко сократили число прибывающих, ослабив давление на жильё и рынок труда."
 HOL_politics.82.t: "Остановить приём беженцев"
 HOL_politics.82.d: "Центры приёма переполнены, и общество требует действий. Вилдерс настаивает на самом жёстком из возможных ответов на приток просителей убежища."
 HOL_politics.82.a: "Ввести жёсткую законодательную квоту"
 HOL_politics.82.b: "Приказать о массовой высылке"
 HOL_politics.83.t: "Спор об интеграции"
 HOL_politics.83.d: "Вилдерс выносит на общенациональный спор вопросы об исламе, интеграции и нидерландской самобытности. Партии предстоит решить, как далеко заходить."
 HOL_politics.83.a: "Ввести обязательные курсы ассимиляции"
 HOL_politics.83.b: "Отстаивать свободу слова и идти на конфликт"
 HOL_politics.84.t: "Посольство в Иерусалим"
 HOL_politics.84.d: "Ярый друг Израиля, Вилдерс требует от правительства признать Иерусалим и перенести туда нидерландское посольство. Вашингтон бы такое приветствовал, но столицы по всему краю предупреждают о последствиях."
 HOL_politics.84.a: "Перенести посольство в Иерусалим"
 HOL_politics.84.b: "Оставить посольство в Тель-Авиве"
 HOL_polder_model: "Польдерная модель"
 HOL_polder_model_desc: "«Польдерная модель» — нидерландская традиция принимать решения через согласие, когда правительство, работодатели и профсоюзы договариваются о широких соглашениях, а не навязывают решения. Уходя корнями в века совместного управления водой, она предпочитает компромисс и устойчивые коалиции, что придаёт нидерландской политике стойкость и дипломатический вес ценой более медленных и осмотрительных реформ."
 HOL_politics.85.t: "Франция присоединяется к разделу"
 HOL_politics.85.d: "Париж принял наше предложение и надавит на Бельгию, требуя референдума о её будущем. Почва для раздела подготовлена. Дальше мы можем двигать дело через решения по Бельгии."
 HOL_politics.85.a: "Превосходно."
 BNL_aswf_frigates_remaining_tt: "Передано менее четырёх фрегатов ASWF"
 BNL_lay_down_aswf_frigate: "Заложить фрегат ASWF"
 BNL_lay_down_aswf_frigate_desc: "Программа противолодочного фрегата (ASWF) — совместное бельгийско-нидерландское начинание, призванное заменить стареющие фрегаты типов Karel Doorman и Wielingen четырьмя современными корпусами: два для Королевского флота Нидерландов и два для бельгийского военно-морского компонента. Построенный вокруг малошумного корпуса, буксируемой гидроакустической антенны и палубного противолодочного вертолёта, каждый корабль закладывается на верфях Damen и проходит полный цикл постройки, прежде чем войти в состав флота."
 BNL_aswf_capability_update: "Модернизация фрегатов ASWF в середине срока службы"
 BNL_aswf_capability_update_desc: "Когда все четыре противолодочных фрегата вступают в строй, двустороннее управление программой утверждает модернизацию в середине срока службы. Улучшенная силовая установка, усовершенствованный гидроакустический комплекс, усиленные ячейки ПВО и обновлённое вертолётное оборудование позволяют этому типу кораблей на весь остаток службы оставаться на высоте современных подводных угроз."
 HOL_deploy_islands_commando: "Направить коммандос на Внешние острова"
 HOL_gulden_reintroduced: "§Y[HOL.GetNameWithFlag]§! вернула $gulden$ как государственную валюту"
 HOL_marinestudie_tt: "Новые §YФлотоводцы§! могут получить черту §Y$HOL_navy_moderniser_leader$§! при повышении."
 HOL_navy_moderniser_leader: "Обновитель флота"
 HOL_nationalist_populism_modifier: "Националистическое общество"
 HOL_FAD_GER_declined: "§Y[GER.GetNameWithFlag]§! вышла из проекта"
 HOL_FAD_construction: "Постройка Future Air Defender"
 HOL_FAD_construction_desc: "Наши верфи строят фрегаты противовоздушной обороны Future Air Defender. По завершении программы готовые корабли сразу входят в состав флота."
 HOL_FAD_delay_reduced_tt: "Новый партнёр сокращает оставшийся срок постройки"
 HOL_FAD_ger_withdrew_tt: "Выход Германии затягивает оставшуюся постройку"
 HOL_military.038.t: "Future Air Defender на распутье"
 HOL_military.038.d: "Программа Future Air Defender столкнулась с ростом издержек и расхождением требований, и верфям нужно больше денег, чтобы удержать сроки. Бундестагу предстоит решить, увеличить ли свою долю финансирования или выйти из программы."
 HOL_military.038.a: "Увеличить наше финансирование"
 HOL_military.038.b: "Выйти из программы"
 HOL_ing_group_upgrades_tt: "Международные расширения ING: §Y[?HOL_ing_group_upgrades|0]§!/3"
 HOL_daf_organization: "DAF"
 HOL_werkspoor_equipment_manufacturer_mio_header_diesel_locomotive_program: "Программа тепловозостроения"
 HOL_werkspoor_equipment_manufacturer_mio_header_industrial_diversification: "Диверсификация производства"
 BEL_sabiex_international_tank_manufacturer_mio_header_m113_heritage: "Наследие M113"
 BEL_sabiex_international_tank_manufacturer_mio_header_wheeled_armour: "Колёсная бронетехника"
 BEL_sabiex_international_tank_manufacturer_mio_header_logistics_fleet: "Парк тыловых машин"
 Pim_Fortuyn_Alive: "Пим Фортёйн жив"
 HOL_wilders_party_created: "Создана Партия свободы (PVV)"
 HOL_D66_in_progress_flag: "Цель D66 в работе"
 HOL_SGP_in_progress_flag: "Цель SGP в работе"
 HOL_GL_in_progress_flag: "Цель GroenLinks в работе"
 HOL_failed_declaring_war_voc: "Не удалось объявить войну ради VOC"
 HOL_suriname_accepted_infrastructure: "Суринам принял соглашение по инфраструктуре"
 HOL_accepted_FRA_carrier: "Французская помощь по авианосцу принята"
 HOL_claim_german_leadership_tt: "Доходы государства превышают его расходы."
 HOL_voc_india_christian_tt: "Отношение христианской общины к индийскому правительству ниже 50 %."
 HOL_asml_high_na_innovation_monopoly: "Монополия на новшества High-NA"
 HOL_asml_high_na_innovation_monopoly_desc: "ASML соединяет отлаженное серийное производство EUV, первенство в High-NA и устойчивую сеть поставщиков. Нидерландские исследования и сервисные мощности поддерживают её исключительное положение в передовой литографии."
 HOL_asml_resilient_european_tooling_network: "Устойчивая европейская сеть станкостроения"
 HOL_asml_resilient_european_tooling_network_desc: "ASML держит на себе разветвлённую европейскую сеть поставщиков точного оборудования и выездных сервисных бригад. Надёжность и поддержка заказчиков обращают спрос на оборудование в устойчивый экспортный доход."
 HOL_asml_neutral_global_lithography_utility: "Нейтральный мировой поставщик литографии"
 HOL_asml_neutral_global_lithography_utility_desc: "ASML обслуживает аттестованных заказчиков по обе стороны политических блоков, придерживаясь коммерчески нейтральной политики распределения. Широкий доступ поддерживает исследовательские партнёрства и экспортную выручку."
 HOL_asml_strategic_western_gatekeeper: "Стратегический привратник Запада"
 HOL_asml_strategic_western_gatekeeper_desc: "Нидерландская лицензионная политика сосредоточивает доступ к передовым установкам в руках стратегических партнёров. Она усиливает рычаги государства, но сужает коммерческий охват ASML."
 HOL_asml_commercial_tooling_champion: "Лидер рынка промышленного оборудования"
 HOL_asml_commercial_tooling_champion_desc: "ASML остаётся прибыльным мировым поставщиком оборудования, не добившись при этом ни одного из более узких стратегических результатов. Её исследования и позиции в экспорте всё равно идут на пользу нидерландской экономике."
 HOL_asml_backlog_pressure_moderate: "Повышенный портфель заказов"
 HOL_asml_backlog_pressure_moderate_desc: "Высокий спрос на литографию увеличивает нагрузку на сервис и инженерные службы, одновременно поддерживая доходы от экспорта оборудования."
 HOL_asml_backlog_pressure_severe: "Критический портфель заказов"
 HOL_asml_backlog_pressure_severe_desc: "Небывалый портфель заказов взвинчивает выручку от оборудования, но отвлекает инженеров от исследований и аттестации у заказчиков."
 HOL_asml_events.1.t: "Ставка на EUV"
 HOL_asml_events.1.d: "На пороге нового века ASML предстоит решить, заслуживает ли литография в жёстком ультрафиолете постоянных вложений, несмотря на нерешённые проблемы с источником излучения и оптикой. От этого решения зависит исследовательский горизонт компании."
 HOL_asml_events.1.a: "Играть вдолгую"
 HOL_asml_events.1.a_tt: "Лидерство в литографии: §G+1§!\nЗрелость EUV: §G+1§!"
 HOL_asml_events.1.b: "Уравновесить EUV нынешними платформами"
 HOL_asml_events.1.b_tt: "Устойчивость поставщиков: §G+2§!\nДиверсификация заказчиков: §G+1§!"
 HOL_asml_events.2.t: "Свести программу EUV воедино"
 HOL_asml_events.2.d: "Работа над опытными образцами показала, насколько тесно связаны между собой источники EUV, оптика, координатные столы и программное обеспечение. ASML может свести программу воедино либо отдать приоритет ближайшим поставкам заказчикам."
 HOL_asml_events.2.a: "Свести разработку в единую программу"
 HOL_asml_events.2.a_tt: "Зрелость EUV: §G+1§!\nУстойчивость поставщиков: §G+1§!"
 HOL_asml_events.2.b: "Защитить текущие поставки"
 HOL_asml_events.2.b_tt: "Диверсификация заказчиков: §G+2§!\nЗрелость EUV: §R-1§!"
 HOL_asml_events.3.t: "Первые альфа-установки EUV"
 HOL_asml_events.3.d: "Первые демонстрационные альфа-установки ASML переводят EUV из лабораторных узлов в цельные машины. Они остаются опытными, и от инженерных приоритетов зависит, чему эти образцы научат компанию."
 HOL_asml_events.3.a: "Форсировать сборку альфа-установок"
 HOL_asml_events.3.a_tt: "Лидерство в литографии: §G+1§!\nЗрелость EUV: §G+2§!"
 HOL_asml_events.3.b: "Сделать ставку на надёжность опытных образцов"
 HOL_asml_events.3.b_tt: "Зрелость EUV: §G+1§!\nУстойчивость поставщиков: §G+2§!"
 HOL_asml_events.4.t: "Купить BRION"
 HOL_asml_events.4.d: "Вычислительная литография помогает заказчикам предсказывать, как фотошаблоны и условия техпроцесса влияют на получаемый рисунок. Покупка BRION позволила бы соединить эти модели со сканерами ASML."
 HOL_asml_events.4.a: "Вобрать опыт BRION"
 HOL_asml_events.4.a_tt: "Лидерство в литографии: §G+1§!\nДиверсификация заказчиков: §G+1§!"
 HOL_asml_events.4.b: "Развивать это направление своими силами"
 HOL_asml_events.4.b_tt: "Лидерство в литографии: §G+1§!\nСтратегический контроль: §G+1§!"
 HOL_asml_events.5.t: "Встроить метрологию YieldStar"
 HOL_asml_events.5.d: "Метрология YieldStar способна связать характеристики сканера с измерениями на серийных пластинах. ASML предстоит решить, делать ли упор на встроенный контроль техпроцесса или на более широкую сервисную модель."
 HOL_asml_events.5.a: "Свести данные сканера и метрологии"
 HOL_asml_events.5.a_tt: "Зрелость EUV: §G+1§!\nУстойчивость поставщиков: §G+1§!"
 HOL_asml_events.5.b: "Построить сервисную модель на метрологии"
 HOL_asml_events.5.b_tt: "Диверсификация заказчиков: §G+2§!\nУстойчивость поставщиков: §G+1§!"
 HOL_asml_events.6.t: "Поставить NXE:3100"
 HOL_asml_events.6.d: "Samsung готова принять ASML NXE:3100 — первую установку EUV, предложенную заказчику. Поставка углубит опыт заказчика, тогда как дополнительная лабораторная работа снизила бы технические риски перед более широким развёртыванием."
 HOL_asml_events.6.a: "Поставить установку Samsung"
 HOL_asml_events.6.a_tt: "Зрелость EUV: §G+1§!\nДиверсификация заказчиков: §G+1§!"
 HOL_asml_events.6.b: "Продолжить лабораторные испытания"
 HOL_asml_events.6.b_tt: "Зрелость EUV: §G+2§!\nДиверсификация заказчиков: §R-1§!"
 HOL_asml_events.7.t: "Программа соинвестиций заказчиков"
 HOL_asml_events.7.d: "ASML предлагает крупным заказчикам вложиться в исследовательские мощности, нужные для литографии следующего поколения. Samsung можно пригласить к участию, а можно сохранить контроль за счёт собственного финансирования."
 HOL_asml_events.7.a: "Пригласить Samsung к участию"
 HOL_asml_events.7.a_tt: "Диверсификация заказчиков: §G+1§!\nСтратегический контроль: §G+1§!\nSamsung получает событие с ответом на переговоры, если Корея доступна."
 HOL_asml_events.7.b: "Профинансировать программу своими силами"
 HOL_asml_events.7.b_tt: "Стратегический контроль: §G+2§!\nДиверсификация заказчиков: §R-1§!"
 HOL_asml_events.8.t: "Поглотить Cymer"
 HOL_asml_events.8.d: "Разработки Cymer в области источников света определяют производительность и готовность установок EUV. Включение поставщика в состав ASML улучшит согласованность работ, тогда как стратегия нескольких источников сохранила бы больше внешнего резерва."
 HOL_asml_events.8.a: "Включить в состав команды Cymer по источникам"
 HOL_asml_events.8.a_tt: "Зрелость EUV: §G+1§!\nУстойчивость поставщиков: §G+2§!"
 HOL_asml_events.8.b: "Сохранить работу с несколькими поставщиками источников"
 HOL_asml_events.8.b_tt: "Устойчивость поставщиков: §G+2§!\nЗрелость EUV: §G+1§!"
 HOL_asml_events.9.t: "Подготовить NXE:3400"
 HOL_asml_events.9.d: "Поколению NXE:3400 предстоит превратить характеристики EUV в установку, пригодную для массового производства. ASML может ускорить вывод на рынок либо наращивать выпуск медленнее, чтобы не потерять в надёжности."
 HOL_asml_events.9.a: "Готовить серийное развёртывание"
 HOL_asml_events.9.a_tt: "Зрелость EUV: §G+1§!\nДиверсификация заказчиков: §G+1§!"
 HOL_asml_events.9.b: "Наращивать выпуск осторожно"
 HOL_asml_events.9.b_tt: "Устойчивость поставщиков: §G+2§!\nЗрелость EUV: §G+1§!"
 HOL_asml_events.10.t: "Проверка EUV в серийном производстве"
 HOL_asml_events.10.d: "EUV становится серийной технологией на ведущих фабриках. ASML может сосредоточиться на характеристиках установок либо расширить сервисную службу, необходимую для растущего парка уже поставленных машин."
 HOL_asml_events.10.a: "Подтвердить состоятельность серийной платформы"
 HOL_asml_events.10.a_tt: "Лидерство в литографии: §G+1§!\nЗрелость EUV: §G+1§!"
 HOL_asml_events.10.b: "Сначала нарастить сервис для заказчиков"
 HOL_asml_events.10.b_tt: "Диверсификация заказчиков: §G+2§!\nУстойчивость поставщиков: §G+1§!"
 HOL_asml_events.11.t: "Сотая установка EUV"
 HOL_asml_events.11.d: "Сотая отгруженная установка EUV знаменует резкий рост парка машин у заказчиков. Компании придётся подкрепить рост производства запчастями, выездными инженерами и клиентской поддержкой."
 HOL_asml_events.11.a: "Наращивать сервис вместе с поставками"
 HOL_asml_events.11.a_tt: "Устойчивость поставщиков: §G+2§!\nДиверсификация заказчиков: §G+1§!"
 HOL_asml_events.11.b: "Ставить во главу угла объём поставок"
 HOL_asml_events.11.b_tt: "Диверсификация заказчиков: §G+2§!\nУстойчивость поставщиков: §R-1§!"
 HOL_asml_events.12.t: "Поставить первую установку High-NA"
 HOL_asml_events.12.d: "Первая установка High-NA EUV от ASML приносит увеличенную числовую апертуру и новое поколение трудностей с интеграцией техпроцесса, и Intel хочет получить её первой. Ранняя поставка может доказать техническое первенство либо поддержать более широкий круг пилотных заказчиков."
 HOL_asml_events.12.a: "Поставить первую полностью укомплектованную установку"
 HOL_asml_events.12.a_tt: "Лидерство в литографии: §G+1§!\nЗрелость EUV: §G+2§!"
 HOL_asml_events.12.b: "Расширить круг заказчиков на пилотном этапе"
 HOL_asml_events.12.b_tt: "Зрелость EUV: §G+1§!\nДиверсификация заказчиков: §G+2§!"
 HOL_asml_events.13.t: "Открыть лабораторию High-NA вместе с imec"
 HOL_asml_events.13.d: "ASML и imec открывают совместную лабораторию High-NA, где заказчики и поставщики смогут испытывать материалы, фотошаблоны и технологические маршруты. Площадку можно нацелить на совместную аттестацию либо на закрытый контроль."
 HOL_asml_events.13.a: "Открыть совместную лабораторию"
 HOL_asml_events.13.a_tt: "Устойчивость поставщиков: §G+1§!\nДиверсификация заказчиков: §G+1§!"
 HOL_asml_events.13.b: "Оставить аттестацию за собой"
 HOL_asml_events.13.b_tt: "Лидерство в литографии: §G+1§!\nСтратегический контроль: §G+2§!"
 HOL_asml_events.14.t: "Расширить контроль над экспортом передовых технологий"
 HOL_asml_events.14.d: "Нидерландское правительство расширяет контроль над передовым оборудованием для производства полупроводников, а на деле это означает решение о том, кому ASML вправе продавать. Лицензирование может следовать стратегической политике безопасности либо сохранять более широкое распределение между аттестованными заказчиками."
 HOL_asml_events.14.a: "Перейти к стратегическому лицензированию"
 HOL_asml_events.14.a_tt: "Стратегический контроль: §G+3§!\nЗадаёт рыночную линию «Стратегическое лицензирование»."
 HOL_asml_events.14.b: "Сохранить открытое распределение"
 HOL_asml_events.14.b_tt: "Диверсификация заказчиков: §G+1§!\nСтратегический контроль: §R-2§!\nЗадаёт рыночную линию «Открытое распределение между заказчиками»."
 HOL_asml_events.15.t: "Оценить стратегическое положение ASML"
 HOL_asml_events.15.d: "Накопленные решения ASML определяют её положение в передовой литографии, работе с поставщиками, обслуживании заказчиков и экспортном лицензировании. Эта итоговая оценка — игровое обобщение, а не историческое измерение."
 HOL_asml_events.15.a: "Определить стратегический итог ASML"
 HOL_asml_events.15.a_tt: "Применяет ровно один итог для ASML — в соответствии с пятью ограниченными корпоративными показателями."
 HOL_asml_technology_threshold_tt: "Требуется «Лидерство в литографии» выше 7 и «Зрелость EUV» выше 5."
 HOL_conservative_society_modifier: "Консервативное общество"