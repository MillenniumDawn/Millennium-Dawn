 FYR_political.1.t: "Insurrection dans le Nord-Ouest"
 FYR_political.1.d: "Des militants albanais ethniques se disant Armée de libération nationale ont saisi le village frontalier de Tanuševci, et les accrochages avec les forces de sécurité s'étendent vers Tetovo. Skopje craint que la guerre qui a épargné la Macédoine dans les années quatre-vingt-dix soit enfin arrivée."
 FYR_political.1.a: "Rechercher une médiation internationale"
 FYR_political.1.b: "Écraser l'insurrection"
 FYR_political.2.t: "L'accord-cadre d'Ohrid"
 FYR_political.2.d: "Le gouvernement et les dirigeants des partis albanais ont signé un accord-cadre à Ohrid sous médiation occidentale. La langue albanaise acquiert un statut officiel dans les communes où la minorité dépasse un cinquième de la population, la police est décentralisée, et les insurgés remettront leurs armes aux collecteurs de l'OTAN sous amnistie."
 FYR_political.2.a: "Mieux partager le pouvoir que faire la guerre"
 FYR_political.3.t: "L'accord de Prespa"
 FYR_political.3.d: "Sur les rives du lac Prespa, les négociateurs de Skopje et d'Athènes ont paraphé un accord pour mettre fin au litige de plusieurs décennies sur le nom. Le pays deviendrait la République de Macédoine du Nord, et en retour la Grèce lève son veto à l'adhésion à l'OTAN et aux pourparlers d'accession européenne."
 FYR_political.3.a: "Signer et prendre la voie euro-atlantique"
 FYR_political.3.b: "Nous ne renommerons pas notre nation"