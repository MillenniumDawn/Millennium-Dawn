l_korean:
 SMA_focus: "산마리노 중점 계통도"
 SMA_economy: "우리의 경제"
 SMA_economy_desc: "산마리노의 경제는 보잘것없으며, 오직 우리의 결정만이 이를 어떻게든 개선하여 최소한 리히텐슈타인과 어깨를 나란히 하게 만들 수 있습니다."
 SMA_start_buildings: "건설 회사 위탁"
 SMA_start_buildings_desc: "건설 산업을 힘차게 발전시켜야만 우리의 작은 나라가 더욱 발전하여 미래로 나아갈 수 있습니다."
 SMA_civil_industry: "피아트 공장"
 SMA_civil_industry_desc: "이탈리아의 친구들에게 FIAT를 보내 산마리노에서 차량을 생산하도록 요청할 수 있으며, 이는 양국 경제에 도움이 됩니다."
 SMA_building_slot: "토지 재분배"
 SMA_building_slot_desc: "우리나라의 땅은 한 치도 소중하므로, 모든 토지를 최대한 활용해야 합니다."
 SMA_roads: "도시 도로 재정비 사업"
 SMA_roads_desc: "발전하려면 먼저 길을 닦아야 합니다. 편리한 교통은 모든 발전의 기반입니다."
 SMA_office: "산마리노 중앙은행 확장"
 SMA_office_desc: "우리의 화폐와 국민의 돈은 어떤 역경 속에서도 지켜져야 합니다. 이를 위해 중앙은행을 확장할 수 있습니다."
 SMA_research_center: "산마리노 연구 센터"
 SMA_research_center_desc: "산마리노 연구 센터는 과학자들의 주요 거점이 될 것입니다. 우리의 가장 뛰어난 인재들이 이제 힘을 합쳐 국가 기술을 발전시킬 것입니다."
 SMA_economy_of_san_marino: "새로운 경제적 지평"
 SMA_economy_of_san_marino_desc: "다각화하고 적응하기 위해 우리의 경제적 지평을 넓혀야 합니다."
 SMA_latest_technologies: "따라잡고 앞지르기"
 SMA_latest_technologies_desc: "과학 기술은 제1의 생산력입니다. 산마리노는 세계 첨단 기술 발전의 최전선에 설 것입니다."
 SMA_electronics_research: "아쿠아비바 전자"
 SMA_electronics_research_desc: "아쿠아비바 전자에 요청하여 국민을 위한 더 나은 상수도 기반시설을 설치할 수 있습니다."
 SMA_internet_research: "스펙트럼 연구개발 센터"
 SMA_internet_research_desc: "정보화 시대가 도래한 지금, 차세대 인터넷에 대한 연구와 탐구를 늦출 수 없습니다."
 SMA_new_computers: "국산 컴퓨터"
 SMA_new_computers_desc: "국내 물자 공급을 늘리기 위한 구상의 일환으로 산마리노에서 컴퓨터와 관련 제품을 연구 개발할 것입니다."
 SMA_neural_research: "세라발레 네트웍스"
 SMA_neural_research_desc: "미래 세계는 인공지능의 세계가 될 것이며, 우리는 세라발레 네트웍스를 통해 이 분야의 선두 주자가 될 것입니다!"
 SMA_industrial_research: "피오렌티노 연구진"
 SMA_industrial_research_desc: "우리 산업의 기술 수준을 더욱 높이는 것은 매우 중요하며, 피오렌티노 연구진의 도움을 받을 수 있습니다."
 SMA_construction_research: "산마리노 공공건축부"
 SMA_construction_research_desc: "건설 산업의 기술 연구개발은 건설 속도와 품질을 크게 향상시킬 수 있습니다."
 SMA_sintetic_fuel_research: "산마리노 국영 연료 공급소"
 SMA_sintetic_fuel_research_desc: "우리나라에는 자원 매장지가 거의 없으므로 합성 자원은 시급히 해결해야 할 과제가 되었습니다."
 SMA_dna_and_gmo_research: "파에타노 연구 센터"
 SMA_dna_and_gmo_research_desc: "21세기는 생명공학의 세기이며, 그것이 세계에 가져다줄 결실의 세기입니다."
 SMA_philosophers_stone: "라피스 필로소포룸"
 SMA_philosophers_stone_desc: "우리의 과학자들이 모든 연금술사의 오랜 꿈을 이루게 할 수 있습니다. 현자의 돌을 발견해 볼 수도 있겠지요..."
 SMA_foreign_investment: "외국인 투자"
 SMA_foreign_investment_desc: "산마리노는 잠재적 국제 투자자들과의 개별 협정 및 협약을 장려하며 외국인 투자에 열려 있습니다. 유리한 지리적 위치, 뛰어난 서비스와 제품, 그리고 경제 및 기술 성장 잠재력은 산마리노를 사업 구상의 든든한 파트너로 만들어 줍니다."
 SMA_ask_to_build_germany: "독일에 투자 요청"
 SMA_ask_to_build_germany_desc: "독일은 유럽 연합의 주요 국가이며, 독일의 투자를 유치하는 것은 우리 경제에 매우 중요합니다."
 SMA_ask_to_build_france: "프랑스에 투자 요청"
 SMA_ask_to_build_france_desc: "그렇습니다, 혼란이 좀 있을지 모르지만 적어도 경제만큼은 잘 굴러가고 있지 않습니까."
 SMA_ask_to_build_italy: "이탈리아에 투자 요청"
 SMA_ask_to_build_italy_desc: "우리나라는 이탈리아에 둘러싸여 있으며, 이탈리아의 투자는 우리의 생존이 걸린 문제입니다."
 SMA_ask_to_build_poland: "폴란드에 투자 요청"
 SMA_ask_to_build_poland_desc: "폴란드는 EU의 신흥국이며, 폴란드의 투자는 우리가 시급히 필요로 하는 것입니다."
 SMA_foreign_factories: "공장 투자 요청"
 SMA_foreign_factories_desc: "우리 산업에 대한 투자는 산업을 개선하는 데에도 훌륭합니다."
 SMA_polish_build: "폴란드 건설 회사"
 SMA_polish_build_desc: "폴란드인들이 우리를 위해 건설하러 왔습니다! 설계도를 고국에 두고 오지 않았기를 바랄 뿐입니다."
 SMA_ger_volks: "폭스바겐 공장 보조금"
 SMA_ger_volks_desc: "폭스바겐 공장에 보조금을 지급하면 독일의 투자를 더욱 효과적으로 유치할 수 있습니다."
 SMA_ger_cars: "BMW 공장 보조금"
 SMA_ger_cars_desc: "BMW 공장에 보조금을 지급하면 독일의 투자를 더욱 효과적으로 유치할 수 있습니다."
 SMA_researches: "독일 연구진"
 SMA_researches_desc: "독일은 최근 상당한 기술 진보를 이루고 있으며, 그들과 연구개발에서 협력하는 것이 매우 현명할 것입니다."
 SMA_ger_electric: "독일 전력 구매"
 SMA_ger_electric_desc: "독일로부터 전기를 구매하는 것은 좋은 거래입니다. 독일이 언제 전력 문제를 겪은 적이 있습니까?"
 SMA_ita_cars: "페라리 공장 보조금"
 SMA_ita_cars_desc: "페라리 공장에 보조금을 지급하면 이탈리아의 투자를 더욱 효과적으로 유치할 수 있습니다."
 SMA_italy_trade: "이탈리아와의 무역"
 SMA_italy_trade_desc: "이탈리아는 우리의 가장 중요한 이웃이며, 이탈리아와의 경제 및 무역 관계 유지는 최우선 과제여야 합니다."
 SMA_farmers: "농민 지원"
 SMA_farmers_desc: "농민은 우리나라 경제의 근간이며, 우리는 언제나 이들에 대한 지원을 보장해야 합니다."
 SMA_foregin_economy: "무형 경제"
 SMA_foregin_economy_desc: "산마리노는 세계 경제를 이끄는 선두 주자가 되어 경제 세계화의 물결 속에서 더 큰 성공을 거둘 것입니다."
 SMA_tourism_support: "관광 지원"
 SMA_tourism_support_desc: "관광은 우리 작은 나라에 매우 수익성이 높은 산업입니다."
 SMA_tourism_support_ii: "관광 장려책"
 SMA_tourism_support_ii_desc: "현재의 성과에 따라 관광 산업에 대한 지원을 계속 강화할 것입니다."
 SMA_tourism_support_iii: "관광 확대"
 SMA_tourism_support_iii_desc: "관광객이 점점 늘고 있지만, 서비스의 질에서 방심해서는 안 됩니다."
 SMA_increased_level_of_tourism: "관광 수준 \n향상"
 SMA_increased_level_of_tourism_desc: "우리의 관광 산업은 이미 세계 최고 수준에 속하지만, 더 높은 수준으로 끌어올릴 필요가 있습니다."
 SMA_build_hotel_hetel_rosa: "호텔 건설 \n\\"헤텔 로사\\""
 SMA_build_hotel_hetel_rosa_desc: "관광객을 위한 호텔이 더 필요하며, 헤텔 로사가 이를 훌륭히 해낼 수 있습니다."
 SMA_build_hotel_public_palace: "호텔 건설 \n\\"퍼블릭 팰리스\\""
 SMA_build_hotel_public_palace_desc: "퍼블릭 팰리스는 훌륭한 관광 명소가 될 것입니다."
 SMA_build_hotel_prima_torre: "호텔 건설 \n\\"프리마 토레\\""
 SMA_build_hotel_prima_torre_desc: "프리마 토레는 더 많은 관광객을 우리나라에 수용하는 데 도움이 될 것입니다."
 SMA_emphasis_on_tourism: "관광 중시"
 SMA_emphasis_on_tourism_desc: "산마리노의 관광 산업은 세계와 미래를 향해 열려 있어야 합니다."
 SMA_bastion_of_beautiful_buildings: "아름다운 건축물의 보루"
 SMA_bastion_of_beautiful_buildings_desc: "지구상에 산마리노의 아름다움보다 더 아름다운 곳은 없습니다."
 SMA_expansion_state_departments: "국가 부처 확대"
 SMA_expansion_state_departments_desc: "정부 부처의 규모를 확대하고 형태를 최적화하여 정부 부처의 효율을 높입니다."
 SMA_increasing_the_army: "군 지출 증액"
 SMA_increasing_the_army_desc: "오직 군대만이 우리의 작은 나라를 지킬 수 있으며, 군사 예산의 증액이 시급합니다."
 SMA_increasing_health_care: "보건 지출 증액"
 SMA_increasing_health_care_desc: "높은 품질의 폭넓은 보건 의료는 시민의 지지를 높이는 확실한 방법입니다."
 SMA_increasing_police: "경찰 지출 증액"
 SMA_increasing_police_desc: "치안을 보장하기 위한 전제 조건은 충분한 경찰 예산입니다."
 SMA_increasing_education: "교육 지출 증액"
 SMA_increasing_education_desc: "교육은 시민의 자질을 높이고 문명 사회를 건설하는 초석입니다."
 SMA_increasing_social_benefits: "사회 복지 지출 증액"
 SMA_increasing_social_benefits_desc: "사회 복지를 보장하는 것은 국가의 기본적인 의무입니다."
 SMA_increasing_administrarion: "행정 지출 증액"
 SMA_increasing_administrarion_desc: "행정 비용의 증액만이 정부의 통치 능력을 향상시킬 수 있습니다."
 SMA_fuck_euro: "유로 대체"
 SMA_fuck_euro_desc: "이제 마침내 그 쓰레기 같은 유로를 내던질 수 있습니다."
 SMA_army_san_marino: "산마리노 육군"
 SMA_army_san_marino_desc: "위대한 군사력을 건설하기 시작합시다!"
 SMA_armed_forces_san_marino: "San Marino Armed Forces"
 SMA_armed_forces_san_marino_desc: "지금 우리 군이 할 수 있는 일이라고는 퍼레이드뿐입니다... 이를 바로잡아야 합니다."
 SMA_purchase_italian_weapons: "이탈리아 무기 구매"
 SMA_purchase_italian_weapons_desc: "이탈리아제 무기는 우리 상황에 매우 적합하므로 일부를 조달해야 합니다."
 SMA_purchase_italian_technique: "이탈리아 전차 구매"
 SMA_purchase_italian_technique_desc: "이탈리아의 전차 기술은 놀라우며, 우리의 방위를 위해 일부를 조달할 수 있습니다."
 SMA_ask_italian_for_Artillery: "이탈리아에 포병 장비 요청"
 SMA_ask_italian_for_Artillery_desc: "이탈리아의 포병 장비 역시 인상적이며 국방력을 크게 높여 줄 것입니다."
 SMA_ask_italian_for_MANPADS_and_ATGM: "이탈리아에 MANPADS 및 ATGM 요청"
 SMA_ask_italian_for_MANPADS_and_ATGM_desc: "방공은 현대전의 핵심 요소이며, 방공 무기의 배치 역시 최우선 과제입니다."
 SMA_purchase_italian_equipment: "이탈리아 장비 구매"
 SMA_purchase_italian_equipment_desc: "보조 장비 또한 군 운용에 없어서는 안 되며, 다가올 전쟁에 대처하려면 충분한 비축이 필요합니다."
 SMA_purchase_spanish_technique: "스페인 차량 구매"
 SMA_purchase_spanish_technique_desc: "스페인 차량을 구매하면 우리 군의 전력을 효과적으로 강화할 수 있습니다."
 SMA_ask_spanish_for_BMP: "스페인에 보병전투차 요청"
 SMA_ask_spanish_for_BMP_desc: "보병전투차는 미래 전쟁에서 보병에게 더 나은 전투 능력을 제공할 것입니다."
 SMA_ask_spanish_for_APC: "스페인에 장갑차 요청"
 SMA_ask_spanish_for_APC_desc: "장갑 수송차는 미래 전쟁에서 보병에게 없어서는 안 될 수단입니다."
 SMA_purchase_spanish_weapons: "스페인 무기 구매"
 SMA_purchase_spanish_weapons_desc: "우리 군 체계가 스페인제 차량으로 가득 차 있으므로 스페인제 무기를 구매하는 것은 당연합니다."
 SMA_divisons_training: "사단 훈련"
 SMA_divisons_training_desc: "좋은 훈련 없이는 전쟁에서의 승리는 불가능합니다."
 SMA_solders_training: "병사 훈련"
 SMA_solders_training_desc: "우리 군의 준비는 완료되었으며, 승리가 우리에게 다가오고 있습니다."
 SMA_policy_development: "정치 발전"
 SMA_policy_development_desc: "우리는 오랫동안 중립국이었지만, 새 천년과 함께 새로운 시대가 열렸습니다. 그것이 평화와 번영의 시대가 될지, 전쟁과 팽창의 시대가 될지 결정해야 합니다."
 SMA_in_country_policy: "국내 정치"
 SMA_in_country_policy_desc: "내부 정세를 안정시켜야 하며, 이를 위해 우리가 원하지 않는 정당들을 억제해야 합니다."
 SMA_break_power_of_church: "교회의 권력 타파"
 SMA_break_power_of_church_desc: "현대 사회는 종교가 모든 것을 지배하도록 놔둘 수 없습니다. 카이사르의 것은 카이사르에게 돌려야 합니다."
 SMA_ban_communism_parties: "공산주의 정당 금지"
 SMA_ban_communism_parties_desc: "공산주의는 우리의 민주 사회에 설 자리가 없으며, 이를 보장하기 위해 법으로 규정해야 합니다."
 SMA_ban_fascism: "파시스트 정당 금지"
 SMA_ban_fascism_desc: "파시즘은 존재할 수 없습니다. 민주주의 만세!"
 SMA_break_opposition: "야당 분쇄"
 SMA_break_opposition_desc: "모든 야당은 외세의 앞잡이이므로, 그들의 활동은 금지되어야 합니다."
 SMA_stabilize_policy: "정책 안정화"
 SMA_stabilize_policy_desc: "그래도 산마리노는 축복받은 나라입니다."
 SMA_democracy: "민주주의 발전"
 SMA_democracy_desc: "민주주의는 우리나라의 근간이며, 우리 민주 사회의 정상적인 발전을 유지하는 것은 매우 중요합니다."
 SMA_christdem_party: "기독민주당"
 SMA_christdem_party_desc: "기독민주당은 우리나라의 주요 정당이며 국내 가톨릭 공동체를 대표합니다."
 SMA_social_viplat: "사회적 지지"
 SMA_social_viplat_desc: "폭넓은 사회적 지지를 얻어야만 우리의 민주 체제가 더욱 건강하게 발전할 수 있습니다."
 SMA_mixed_economy: "혼합 경제"
 SMA_mixed_economy_desc: "국영 기업과 민간 기업이 장기적으로 공존하며 발전하도록 하는 것은 우리가 해결해야 했던 과제였습니다. 은행과의 우호적 협상을 통해 협력에 대한 합의에 이를 수 있습니다."
 SMA_support_church: "교회 지원"
 SMA_support_church_desc: "산마리노의 역사와 그 존재 자체는 교회 및 가톨릭과 직접적으로 연관되어 있습니다. 이 때문에 교회는 큰 영향력을 지니고 있습니다."
 SMA_coop_with_ita_deep: "이탈리아와의 협력"
 SMA_coop_with_ita_deep_desc: "이탈리아는 우리의 가장 중요한 이웃이며, 이탈리아와의 관계 유지는 최우선 과제입니다."
 SMA_banks_agreement: "은행과의 협정"
 SMA_banks_agreement_desc: "은행과의 우호적 협상을 통해 협력에 대한 합의에 이르렀습니다."
 SMA_palom_place: "순례지"
 SMA_palom_place_desc: "가톨릭은 우리에게 전부이며, 우리는 하느님을 믿습니다."
 SMA_mutual_vzaimovig: "이탈리아와의 상호 무역"
 SMA_mutual_vzaimovig_desc: "이탈리아는 우리의 유일한 이웃이며, 우리의 모든 수출입 무역은 이탈리아를 거칩니다."
 SMA_assoc_with_eu: "유럽 연합 제휴"
 SMA_assoc_with_eu_desc: "EU의 광대한 단일 시장은 우리나라 경제의 추가 발전에 필요한 조건을 제공합니다."
 SMA_connect_with_profsoyuz: "노동조합 협의"
 SMA_connect_with_profsoyuz_desc: "노동조합과의 조율은 중요합니다."
 SMA_activity_spy: "무엇보다 감시"
 SMA_activity_spy_desc: "감독은 무엇보다 중요하며, 아무것도 빠뜨려서는 안 됩니다."
 SMA_effectiveness_upor: "무엇보다 효율"
 SMA_effectiveness_upor_desc: "효율은 무엇보다 중요합니다. 효율 없이는 살아남을 수 없습니다."
 SMA_save_our_nature: "자연 보호"
 SMA_save_our_nature_desc: "우리는 자연과 그 아름다움을 보존해야 합니다."
 SMA_stab_aboveall: "무엇보다 국민 통합"
 SMA_stab_aboveall_desc: "국민 간의 단결은 무엇보다 중요합니다. 단결이 없다면 우리에게 남는 것이 무엇이겠습니까?"
 SMA_organiz_anti_corrupt: "부패 척결 노력"
 SMA_organiz_anti_corrupt_desc: "모든 수준에서 부패와 맞서 싸워야 합니다. 그렇지 않으면 우리는 부패에 압도당할 것입니다."
 SMA_reform_police: "경찰 개혁"
 SMA_reform_police_desc: "우리 경찰에는 여전히 많은 문제가 있으며 개혁이 필요합니다."
 SMA_social_media_ad: "소셜 미디어 광고"
 SMA_social_media_ad_desc: "우리는 유행을 따라가야 합니다. 요즘 젊은이들에게 인기 있는 게 뭡니까? 틱톡이나 유튜비? 훌륭하군요! 그게 뭔지는 모르겠지만 거기서 광고를 시작하십시오."
 SMA_nonof_offshore: "역외 금융국"
 SMA_nonof_offshore_desc: "모두가 알다시피 산마리노는 아주 작은 나라이므로, 역외 기업을 유치하는 것이 우리에게 중요한 사업이 되었습니다."
 SMA_allow_casionos: "카지노 규제"
 SMA_allow_casionos_desc: "우리 영토 내에서 운영되는 카지노가 정치인과 시민을 부패시키지 않도록 감독을 해야 합니다."
 SMA_free_internet: "인터넷 자유화"
 SMA_free_internet_desc: "우리는 정보화 시대에 살고 있으며, 시민들이 언제든 인터넷에 접속할 기회를 제공하는 것은 시대의 요구이자 모든 국가가 따를 본보기를 남길 것입니다."
 SMA_podoxod_tax: "누진세"
 SMA_podoxod_tax_desc: "세금을 통해 국내의 빈부 격차를 줄일 수 있습니다."
 SMA_san_marino_for_people: "국민을 위한 산마리노"
 SMA_san_marino_for_people_desc: "서기 301년 산마리노가 건국된 이래 우리의 사명은 공익에 봉사하는 것이었습니다."
 SMA_reform_gov: "정부 개혁"
 SMA_reform_gov_desc: "정부를 개혁하여 현재의 사회 구성이 지속되도록 합니다."
 SMA_market_expansion: "시장 확대"
 SMA_market_expansion_desc: "우리 산업이 더 잘 발전하고 지속되도록 시장을 확대해야 합니다."
 SMA_stabilize_government: "정부 안정화"
 SMA_stabilize_government_desc: "안정된 정부만이 훌륭한 시장과 사회를 만들 수 있습니다."
 SMA_usa_deal: "미국과의 거래"
 SMA_usa_deal_desc: "산마리노는 약소국이므로 서방 및 미국과 협력해야만 일어설 수 있습니다."
 SMA_approach_nato: "NATO 접근"
 SMA_approach_nato_desc: "NATO라는 거대 동맹에 가입하면 산마리노의 방어력을 효과적으로 높일 수 있습니다."
 SMA_democracy_name: "민주 동맹"
 SMA_democracy_name_desc: "민주 동맹은 민주 사회를 만듭니다."
 SMA_spoiler_parties: "친LGBT 법안"
 SMA_spoiler_parties_desc: "LGBT는 개인의 자유이며 타인이 간섭할 권리는 없습니다. 우리는 개인의 자유를 보호해야 합니다."
 SMA_stabilize_infl: "영향력 안정화"
 SMA_stabilize_infl_desc: "우리의 영향력은 해외에서도 잘 알려져 있으며, 이는 우리의 강점입니다."
 SMA_2006_summit: "산마리노의 길"
 SMA_2006_summit_desc: "산마리노는 스스로 세계 무대에 오를 수 있습니다. 우리는 서방의 도움이 필요하지 않으며, 특히 그 대가로 큰 값을 치러야 하는 도움은 더욱 그렇습니다."
 SMA_econ_interv: "개입 대응"
 SMA_econ_interv_desc: "우리는 작은 나라이지만, 자국에 대한 외국의 간섭에는 흔들림 없이 반대해야 합니다."
 SMA_intr_reg_togov_proj: "무역 프로젝트"
 SMA_intr_reg_togov_proj_desc: "해외 시장을 적극 개척하여 우리 제품의 더 넓은 판로를 찾습니다."
 SMA_europian_communism_alliacne: "사회민주주의 구상"
 SMA_europian_communism_alliacne_desc: "사회민주주의가 우리 사회와 우리나라를 구할 것입니다."
 SMA_general_economy: "일반 경제"
 SMA_general_economy_desc: "사회주의 경제의 거대한 발전은 대세입니다."
 SMA_business_start_up_support: "창업 지원"
 SMA_business_start_up_support_desc: "신생 기업에 대한 지원은 매우 필요합니다."
 SMA_rakulakat_banks: "은행 통제"
 SMA_rakulakat_banks_desc: "개혁을 진행하는 동안 금융 체계가 역풍을 맞지 않도록 은행을 통제합니다."
 SMA_ask_limited_help_italy: "이탈리아에 도움 요청"
 SMA_ask_limited_help_italy_desc: "이탈리아는 우리의 주요 이웃이며 우리는 이탈리아에 도움을 구할 수 있습니다."
 SMA_sammaran_democratic_party: "개혁을 위한 사회주의자들"
 SMA_sammaran_democratic_party_desc: "오직 사회주의적 개혁만이 자본주의 체제에서 해결할 수 없는 문제들을 해결할 수 있습니다."
 SMA_emphasis_on_small_medium_businesses: "중소기업 중시"
 SMA_emphasis_on_small_medium_businesses_desc: "다가오는 경제 문제에 대처하기 위해 중소기업의 발전을 지원합니다."
 SMA_expand_trade_unions: "노동조합 확대"
 SMA_expand_trade_unions_desc: "노동조합의 권리를 확대하여 노동자의 처우와 생산 효율을 효과적으로 향상시킵니다."
 SMA_usa_and_west: "미국과 서방"
 SMA_usa_and_west_desc: "우리는 서방 진영과 함께할 것이며 모든 것이 미래를 향해 나아갈 것입니다."
 SMA_san_marino_path: "독립"
 SMA_san_marino_path_desc: "독립 만세!"
 SMA_pluralism: "다원주의"
 SMA_pluralism_desc: "다양성은 세계적 추세이며, 우리는 다양한 나라를 지지할 것입니다."
 SMA_traditional_religion: "전통 종교"
 SMA_traditional_religion_desc: "오직 순수한 가톨릭만이 우리가 따를 가치가 있습니다."
 SMA_legacy_past: "과거의 유산"
 SMA_legacy_past_desc: "우리의 전통이 우리나라를 위대하게 만들었으며, 우리는 누구도 이를 파괴하도록 허용하지 않을 것입니다."
 SMA_country_of_freedom: "자유의 나라"
 SMA_country_of_freedom_desc: "산마리노는 자유로운 나라이며 건국 이래로 항상 그러했습니다."
 SMA_abolish_captaincy: "집정관 제도 폐지"
 SMA_abolish_captaincy_desc: "강력한 동맹이 있으면 자체 군대를 유지할 필요가 없어지고 예산을 크게 줄일 수 있습니다."
 SMA_save_traditions: "전통 계승"
 SMA_save_traditions_desc: "전통을 지키는 것은 곧 우리나라를 지키는 것입니다."
 SMA_human_rights: "프랑스와의 제휴"
 SMA_human_rights_desc: "우리는 프랑스와 마찬가지로 인권을 존중합니다."
 SMA_stable_stability: "와인 공장"
 SMA_stable_stability_desc: "어느 나라의 와인이 최고입니까? 프랑스? 이탈리아? 아닙니다! 산마리노입니다!"
 SMA_take_down_the_mafia: "마피아 소탕"
 SMA_take_down_the_mafia_desc: "우리 정보 당국이 마피아의 두목들을 모두 찾아냈습니다. 이제 그들을 체포할 수 있으며, 부하들은 쥐처럼 흩어질 것입니다."
 SMA_church_without_authority: "교회의 권력 박탈"
 SMA_church_without_authority_desc: "교회에서 모든 영향력을 박탈하되, 신앙을 가진 사람들을 위해서는 남겨 둘 것입니다."
 SMA_healthy_people: "건강한 국민"
 SMA_healthy_people_desc: "건강한 국민이 건강한 나라를 만듭니다. 건강이 없으면 아무것도 없습니다."
 SMA_no_gmo: "GMO 금지"
 SMA_no_gmo_desc: "그들이 우리 음식에 무엇을 넣고 있는지 알 수 없는데, 이를 허용할 이유가 무엇이겠습니까? 유전자 변형 식품이 우리나라에 반입되는 것을 금지해야 합니다."
 SMA_all_for_peoples: "모든 것은 국민을 위해"
 SMA_all_for_peoples_desc: "권력은 국민으로부터 나오며, 우리 정부가 하는 모든 일은 국민을 위한 것입니다."
 SMA_lgbt_rights: "LGBT 권리"
 SMA_lgbt_rights_desc: "우리는 LGBT 공동체의 권리 보호를 지지합니다."
 SMA_airport_remini: "리미니 공항"
 SMA_airport_remini_desc: "이탈리아와 협정을 맺어 리미니 공항을 공유할 수 있지만, 이탈리아 노동자의 권리라는 대가를 치러야 합니다."
 SMA_change_history_in_textbooks: "교과서 역사 수정"
 SMA_change_history_in_textbooks_desc: "산마리노의 역사는 매우 흥미롭지만, 애국심을 기르기에 늘 적합하지는 않으며 일부 대목은 우리에게 불편하기까지 합니다. 그러나 우리는 이를 쉽게 바꿀 수 있습니다."
 SMA_correct_prisoners: "수감자 교화"
 SMA_correct_prisoners_desc: "범죄자는 교도소에서 교화되어야 사회에 해가 되지 않는 사람이 될 수 있습니다."
 SMA_com_multi_party_system: "사회민주주의 이상"
 SMA_com_multi_party_system_desc: "사회민주주의의 이념은 우리가 나아가는 방향과 일치합니다."
 SMA_pro_lgbtqa_stance_idea: "친LGBTQIA 입장"
 SMA_pro_lgbtqa_stance_idea_desc: "우리 정부는 친LGBT 입장을 취했습니다."
 SMA_half_pro_lgbtqa_stance_idea: "부분적 친LGBTQIA 입장"
 SMA_half_pro_lgbtqa_stance_idea_desc: "우리 정부는 부분적으로 친LGBT 입장을 취했습니다."
 SMA_raising_taxes_idea: "한시적 감세"
 SMA_improved_administration: "행정 개선"
 SMA_improved_administration_desc: "간소화되고 개혁된 우리의 행정은 시민과 국가 전체의 부담을 손쉽게 감당할 수 있습니다."
 SMA_liberal_state: "진보 국가"
 SMA_liberal_state_desc: "우리 조국은 더 이상 과거 지향적이어서는 안 됩니다. 진보와 번영에 집중해야 합니다."
 SMA_pro_farmers: "친농민"
 SMA_bastion_of_freedom: "자유의 보루"
 SMA_gmos_banned: "GMO 금지"
 SMA_health_care: "국민을 위한 보건 의료"
 SMA_increase_army: "군 예산 증액"
 SMA_increase_health_care: "보건 예산 증액"
 SMA_increase_police: "경찰 예산 증액"
 SMA_increase_education: "교육 예산 증액"
 SMA_increase_social_benefits: "사회 복지 예산 증액"
 SMA_christian_state_1: "기독교 국가"
 SMA_christian_state_1_desc: "기독교는 우리 문화의 일부입니다. 기독교는 우리 국민으로서의 핵심 가치를 나타냅니다."
 SMA_christian_state_2: "강력한 기독교 국가"
 SMA_christian_state_2_desc: "가톨릭은 우리의 국교입니다. 가톨릭은 어려운 시기에 우리를 인도하고, 무엇이 선이고 무엇이 아닌지를 보여줍니다."
 SMA_pro_west: "친서방"
 the_SMA_euro: "산마리노 유로"
 the_SMA_euro_desc: "산마리노의 공식 통화는 유로입니다. 유럽 연합과의 협정에 따라 국가는 자국의 국가 상징이 새겨진 유로 주화를 제한된 수량만큼 주조할 권리를 갖습니다."
 SMA_buildings: "건설 사업"
 SMA_buildings_desc: "산마리노 전역에서 이렇게 작은 나라치고는 엄청난 양의 건설이 진행되고 있습니다.\n§R하지만 이로 인해 몇 가지 제약이 따르며 한동안 수입이 크게 줄어듭니다.§!"
 SMA_effective_upor: "효율 중시"
 SMA_effective_upor_desc: "노예는 일하거나 자야 한다!"
 SMA_increased_tourism: "관광 의존 경제"
 SMA_increased_tourism_desc: "우리는 국내 성장의 다른 수단보다 관광에 크게 의존하도록 나라를 이끌어 왔습니다."
 SMA_balance_tourism_ii: "관광 의존"
 SMA_balance_tourism_ii_desc: "우리의 규모와 위치 덕분에 관광에 집중할지 국가 발전에 집중할지를 수동으로 선택할 수 있습니다.\n현재 산마리노의 균형은 §Y관광§! 쪽으로 기울고 있습니다."
 SMA_balance_tourism_i: "관광 집중"
 SMA_balance_tourism_i_desc: "우리의 규모와 위치 덕분에 관광에 집중할지 국가 발전에 집중할지를 수동으로 선택할 수 있습니다.\n현재 산마리노의 균형은 §Y관광§! 쪽으로 기울고 있습니다."
 SMA_balance_balance: "균형 잡힌 경제"
 SMA_balance_balance_desc: "우리의 규모와 위치 덕분에 관광에 집중할지 국가 발전에 집중할지를 수동으로 선택할 수 있습니다.\n현재 §Y관광§!과 §Y경제§!는 균형을 이루고 있습니다."
 SMA_balance_economy_i: "자급자족 집중"
 SMA_balance_economy_i_desc: "우리의 규모와 위치 덕분에 관광에 집중할지 국가 발전에 집중할지를 수동으로 선택할 수 있습니다.\n현재 산마리노의 균형은 §Y자급자족§! 쪽으로 기울고 있습니다."
 SMA_balance_economy_ii: "어느 정도 경제적 자급자족"
 SMA_balance_economy_ii_desc: "우리의 규모와 위치 덕분에 관광에 집중할지 국가 발전에 집중할지를 수동으로 선택할 수 있습니다.\n현재 산마리노의 균형은 §Y자급자족§! 쪽으로 기울고 있습니다."
 SMA_increased_economy: "경제적 자급자족"
 SMA_increased_economy_desc: "우리는 경제적 자급자족의 길로 나아가기로 했으며, 이는 우리의 수입을 누구에게도 의존하지 않는다는 뜻입니다."
 SMA_emphass_on_tourism: "관광 중시"
 SMA_emphass_on_tourism_desc: "산마리노는 관광 중시의 길을 걸어왔습니다."
 SMA_bastion_of_beautiful: "아름다운 건축물의 보루"
 SMA_bastion_of_beautiful_desc: "산마리노는 로마 제국 방식의 웅장하고 아름다운 건축물의 보루가 되었으며, 이는 오늘날의 초라한 건축과 뚜렷이 대비됩니다."
 SMA_center_i: "§R미완공 연구 센터§!"
 SMA_center_i_desc: "우리는 산마리노가 시대에 발맞추고 다른 국가들을 따라잡도록 도와줄 연구 센터를 짓기 시작했습니다.\n§R과학자들을 야외에 모아 두었습니다. 없는 것보다는 낫지만, 건설을 계속해야 합니다.§!"
 SMA_center_ii: "§H부분 완공§!"
 SMA_center_ii_desc: "우리는 산마리노가 시대에 발맞추고 다른 국가들을 따라잡도록 도와줄 연구 센터를 짓기 시작했습니다.\n§H현재 연구 센터는 절반쯤 지어졌으며, 일하기에 편안하지는 않지만 이미 가능합니다.§!"
 SMA_center_iii: "§G거의 완공§!"
 SMA_center_iii_desc: "우리는 산마리노가 시대에 발맞추고 다른 국가들을 따라잡도록 도와줄 연구 센터를 짓기 시작했습니다.\n§G연구 센터는 완전히 지어지지는 않았지만 이미 일하기에 편안합니다.§!"
 SMA_center: "연구 센터"
 SMA_center_desc: "산마리노에는 거대한 연구 센터가 있어 국가가 첨단 기술을 탐구하고 유럽과 보조를 맞출 수 있습니다."
 SMA_no_wars_iii: "전투 경험 없음"
 SMA_no_wars_iii_desc: "산마리노는 유럽에서 가장 오래된 나라이지만, 제2차 세계 대전 당시 독일군이 산마리노를 점령한 때를 제외하면 전쟁을 치른 적이 거의 없습니다. \n§R이 때문에 우리에게는 군대도, 전투 경험도 없습니다.§!"
 SMA_no_wars_ii: "제한적 전투 경험"
 SMA_no_wars_ii_desc: "산마리노는 유럽에서 가장 오래된 나라이지만, 제2차 세계 대전 당시 독일군이 산마리노를 점령한 때를 제외하면 전쟁을 치른 적이 거의 없습니다. \n§R이 때문에 우리에게는 군대도, 전투 경험도 없습니다.§!"
 SMA_no_wars_i: "평균적 전투 경험"
 SMA_no_wars_i_desc: "산마리노는 유럽에서 가장 오래된 나라이지만, 제2차 세계 대전 당시 독일군이 산마리노를 점령한 때를 제외하면 전쟁을 치른 적이 거의 없습니다. \n§R이 때문에 우리에게는 군대도, 전투 경험도 없습니다.§!"
 SMA_recruits: "신병"
 SMA_recruits_desc: "산마리노는 징병제 군대를 운영합니다. 이 때문에 우리 병사들은 훈련이 부족하며, 대부분은 조국을 위해 목숨을 걸 의사가 없습니다. 하지만... 수는 많습니다."
 SMA_contract_service: "계약 복무"
 SMA_contract_service_desc: "산마리노는 계약제 군대를 운영합니다. 이 때문에 우리에게는 훈련이 잘된 병사들이 있으며, 이들은 위대한 조국을 지키기 위해 끝까지 싸울 준비가 되어 있습니다."
 SMA_army_of_sacred_marino: "산마리노 육군"
 SMA_army_of_sacred_marino_desc: "서기 301년에 세워진 우리는 유럽에서 가장 오래된 공화국입니다. 17세기가 넘는 세월 동안 우리의 산악 조국은 정복당하지 않았고 독립은 단 한 번도 꺾이지 않았습니다. 우리는 불굴의 유산을 지닌 자랑스러운 민족이며, 이제 산마리노 육군은 그 유산을 힘과 영광의 새 시대로 이끌 것입니다."
 SMA_loyal_army: "충성스러운 군대"
 SMA_loyal_army_desc: "숙청 이후 산마리노에서 군대는 정부를 전적으로 지지합니다. 위대한 조국에 영광을!"
 SMA_lang_ita: "이탈리아어"
 SMA_lang_romanion: "로마냐어"
 SMA_hist_peace: "평화로운 역사"
 SMA_hist_mil: "군사적 역사"
 SMA_ed_work: "노동자 교육"
 SMA_ed_res: "과학자 교육"
 SMA_ed_mil: "군인 교육"
 SMA_rights_of_italian_workers_in_san_marino: "이탈리아 노동자의 권리"
 SMA_rights_of_italian_workers_in_san_marino_desc: "리미니 공항과 산마리노 내 이탈리아 노동자의 권리를 공유하는 협정이 이탈리아와 체결되었습니다."
 SMA_chruch_withnout_autority: "헌신적인 교회"
 SMA_chruch_withnout_autority_desc: "교회는 우리 정부에 전적으로 헌신하며 기꺼이 우리의 이익을 위해 나설 것입니다."
 SMA_trust_in_people: "국민에 대한 신뢰"
 SMA_trust_in_people_desc: "우리는 때때로 우리에게 해가 되더라도 우리나라에 있는 사람들을 신뢰합니다."
 SMA_traditional_marriage: "전통적 혼인"
 SMA_traditional_marriage_desc: "산마리노는 LGBT 권리에 대한 일체의 인정을 금지했습니다. 성별은 남성과 여성 둘뿐이며 그 외에는 모두 인정하지 않습니다."
 SMA_mafia: "산마리노의 마피아"
 SMA_mafia_desc: "산마리노에는 여러 마피아가 있으며, 이들은 국가의 안정적인 운영을 크게 방해합니다. 이들을 소탕하기 위해 가능한 한 빨리 조치를 취해야 합니다."
 SMA_legacy_of_past: "우리의 유산"
 SMA_legacy_of_past_desc: "아드리아해를 굽어보는 언덕 위에 자리한 산마리노는 수 세기에 걸친 특별한 유산을 자랑합니다. 세계에서 가장 오래된 공화국이자 가장 작은 나라 중 하나로서, 우리나라는 역사와 문화, 전통이 풍부합니다. 우리 고유의 유산은 우리가 어떤 민족인지를 빚어냈으며, 시간을 관통하는 우리의 회복력과 적응력을 증명합니다.\n우리의 유산은 건축과 종교를 넘어서도 이어집니다. 수도 산마리노 시에는 문화적 다양성을 기리는 수많은 박물관이 있으며, 그중 국립 박물관에는 우리 역사의 여러 시기에서 유래한 방대한 유물 컬렉션이 소장되어 있습니다. 또한 도자기와 자수 같은 우리의 전통 공예는 오늘날에도 번성하며 지역 장인들의 기술과 예술성을 보여줍니다.\n우리는 위대하고 §G독립§!된 나라입니다!"
 SMA_general_field_exercises: "농민 지원"
 SMA_general_field_exercises_desc: "농민들은 작지만 자랑스러운 우리나라의 경제 성장과 발전을 계속 이끌고 있으며, 이들을 지원하는 것은 필수적입니다."
 SMA.1.t: "우리 주교의 제안..."
 SMA.1.d: "우리의 거룩하고 올바른 교회가 산마리노를 장악했습니다. 그곳의 주교는 우리 두 나라를 하나의 몸으로 통합하고 교황 성하께 모든 권력을 부여하고자 합니다!"
 SMA.1.a: "물론이지"
 SMA.1.b: "참으로 어리석은 제안이다."
 SMA.2.t: "헌법 400주년"
 SMA.2.d: "오늘은 산마리노 헌법 제정 400주년입니다! 이 뜻깊은 날을 기념해야 할까요, 아니면 모두가 각자의 일에 전념하도록 두어야 할까요?"
 SMA.2.a: "축하하자!!!"
 SMA.2.b: "모두 일하는 중이다."
 SMA.3.t: "현자의 돌 발견"
 SMA.3.d: "우리 과학자들이 현자의 돌을 발견했습니다! 하지만 이제 우리는 이 위대한 발견을 전 세계에 알려야 할지, 아니면 우리만 간직해야 할지 고민에 빠졌습니다."
 SMA.3.a: "세상에 알린다"
 SMA.3.b: "아무에게도 알리지 않는다"
 SMA.6.t: "요한 바오로 서거!"
 SMA.6.d: "2005년 4월 2일, 역사상 가장 많은 곳을 순방한 교황이자 16세기 이후 최초의 비이탈리아인 교황인 요한 바오로 2세가 바티칸의 거처에서 선종했습니다. 엿새 뒤 200만 명이 그의 장례식을 위해 바티칸 시국을 가득 메웠으며, 역사상 최대 규모의 장례식 중 하나로 알려져 있습니다..."
 SMA.8.t: "산마리노 민주진보당과 개혁을 위한 사회주의자들의 통합"
 SMA.8.d: "산마리노 민주진보당과 개혁을 위한 사회주의자들, 두 정당이 하나로 합당하기를 원하는데, 이것이 우리에게 이로울까요?"
 SMA.8.a: "합당을 허용한다"
 SMA.8.b: "합당을 금지한다"
 SMA_news.1.t: "바티칸과 산마리노의 통합!"
 SMA_news.1.desc: "전 세계의 이목을 사로잡은 역사적인 사태 속에서, 초미니 국가인 산마리노와 바티칸 시국이 통합하여 교황의 통치 아래 하나의 나라를 이루기로 결정했습니다. 이 획기적인 합병은 풍부한 역사와 독자적 정체성을 지닌 두 주권 실체를 하나로 묶으며, 양국에 독특한 미래를 약속합니다!"
 SMA_news.1.a: "흥미롭군"
 SMA_news.2.t: "현자의 돌 발견!"
 SMA_news.2.desc: "산마리노의 과학자들이 수 세기 동안 다른 과학자들이 시도해 온 일을 마침내 해냈습니다! 그들은 어떤 금속이든 금으로 바꿀 수 있는 시약을 발견했습니다!"
 SMA_news.2.a: "뭐라고?"
 SMA_news.2.b: "우리 과학자들은 세계 최고다!"
 SMA_countries.1.t: "산마리노와의 협정"
 SMA_countries.1.d: ""
 SMA_countries.1.a: "협정에 서명한다"
 SMA_countries.1.b: "서명하지 않는다"
 SMA_countries.4.t: "산마리노 투자"
 SMA_countries.4.d: "산마리노의 독특한 투자 기회에 함께하십시오!\n산마리노는 이제 성장과 발전을 위한 독특한 기회를 찾는 국제 투자자들에게 문을 열고 있습니다. 국가의 경제적 기반을 강화하고자 하는 이들은 이 놀라운 초미니 국가에 투자함으로써 얻을 수 있는 다양한 이점을 우리에게 살펴보도록 초청하고 있습니다.\n뜻을 같이하는 이들과 교류하면서, 산마리노가 왜 유럽에서 외국인 투자의 으뜸가는 목적지로 빠르게 떠오르고 있는지를 직접 확인할 수 있는 이 기회를 놓쳐서는 안 됩니다."
 SMA_countries.4.a: "물론이다"
 SMA_countries.4.b: "필요 없다."
 SMA_countries.5.t: "투자 신청 거부됨"
 SMA_countries.5.d: "최근 우리는 외국인 투자를 요청했습니다. 그러나 매우 유감스럽게도 우리의 요청은 거부되었습니다."
 SMA_countries.5.a: "슬프군"
 SMA_countries.6.t: "투자 신청 승인됨"
 SMA_countries.6.d: "우리는 최근 외국인 투자 유치를 위한 신청서를 제출했습니다. 다행히도 그들은 우리의 신청을 승인했습니다."
 SMA_countries.6.a: "알겠다"
 SMA_countries.2.t: "이탈리아의 거절"
 SMA_countries.2.d: ""
 SMA_countries.2.a: "아... 알겠다..."
 SMA_countries.3.t: "이탈리아의 동의"
 SMA_countries.3.d: ""
 SMA_countries.3.a: "좋아"
 SMA_research_center_category: "연구 센터 건설"
