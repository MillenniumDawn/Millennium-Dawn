 GER_SAPOS_USA_II: "§YO contrato de acesso ao GPS precisa ser renegociado.§!"
 GER_citizen_in_uniform: "Cidadão de Uniforme"
 GER_citizen_in_uniform_desc: "O princípio do 'Cidadão de Uniforme' é uma pedra angular da Bundeswehr, enfatizando que os soldados não são apenas pessoal militar, mas também membros responsáveis de uma sociedade democrática. Enraizada no conceito de Innere Führung, essa doutrina garante que cada militar, homem ou mulher, respeite os valores constitucionais e os direitos humanos e permaneça subordinado ao governo civil. Ao fomentar o pensamento crítico, a responsabilidade ética e a lealdade democrática, mantemos uma força militar que serve ao povo em vez de governá-lo."
 GER_Eurofighter.1.t: "Entrega Cerimonial do Eurofighter Typhoon"
 GER_Eurofighter.1.d: "Um marco da aviação alemã foi alcançado. Hoje, a Luftwaffe recebe oficialmente seu primeiro Eurofighter Typhoon Tranche 1. Desenvolvido em colaboração com parceiros europeus, o Eurofighter representa um salto nas capacidades de combate aéreo, substituindo caças envelhecidos por tecnologia de ponta. A cerimônia de entrega, com a presença de altas autoridades, simboliza o compromisso da Alemanha com uma força aérea moderna e capaz. Com sua aviônica avançada, manobrabilidade superior e funcionalidade multifunção, o Eurofighter Typhoon protegerá o espaço aéreo alemão pelas próximas décadas."
 GER_Eurofighter.1.a: "Uma nova era para a Luftwaffe começa!"
 GER_support_heimatverein: "Suporte heimatverein"
 GER_support_heimatverein_desc: "heimatverein, ou clubes culturais locais, desempenham um papel importante na preservação das tradições regionais e no fomento do espírito comunitário. Ao apoiar essas organizações, o governo alemão visa manter a diversidade cultural dentro de uma identidade nacional unida. \"Nossa força está na nossa diversidade regional\", disse o ex-chanceler Helmut Kohl. Essas associações contribuem para o tecido social da Alemanha preservando os costumes e a herança local."
 GER_Day_of_open_garrison: "Dia de Guarnição Aberta"
 Germany_Mech.9.t: "O Exército Britânico Deixa a Alemanha"
 Germany_Mech.9.d: "Por décadas, forças britânicas estiveram estacionadas na Alemanha, moldando a cooperação militar e a segurança europeia. Agora, suas bases estão vazias e seus alojamentos, abandonados. Alguns veem isso como o fim de uma era de amizade e aliança, enquanto outros veem os últimos resquícios de uma ocupação passada finalmente se apagando."
 Germany_Mech.9.a: "Uma despedida sincera aos nossos aliados."
 Germany_Mech.9.b: "Finalmente, os ocupantes foram embora."
 Germany_Mech.10.t: "Tropas Americanas se Retiram do Solo Alemão"
 Germany_Mech.10.d: "As últimas tropas americanas deixaram suas bases na Alemanha, encerrando o capítulo de uma presença militar que durou gerações. Antes pilar da defesa europeia da OTAN, essas guarnições agora estão vazias. Para alguns, é uma despedida agridoce de parceiros de confiança. Para outros, é uma saída há muito esperada da influência estrangeira."
 Germany_Mech.10.a: "Adeus, velhos amigos."
 Germany_Mech.10.b: "Ocupantes não são mais bem-vindos!"
 GER_Cold_War.10.t: "O Futuro das Antigas Guarnições da Bundeswehr"
 GER_Cold_War.10.d: "Com a reestruturação e a redução da Bundeswehr, muitas guarnições antigas não são mais necessárias. Algumas ficam em locais estrategicamente irrelevantes, enquanto outras poderiam servir a novos propósitos. A questão permanece: o que devemos fazer com esses locais?"
 GER_Cold_War.10.a: "Convertê-las em infraestrutura civil."
 GER_Cold_War.10.b: "Preservá-las para possível uso militar futuro."
 GER_Cold_War.10.c: "Vendê-las a investidores privados."
 GER_Cold_War.11.t: "O Destino das Antigas Guarnições Britânicas"
 GER_Cold_War.11.d: "Com o Exército Britânico se retirando gradualmente da Alemanha, várias de suas antigas guarnições continuam vazias. Esses locais militares abrigaram milhares de soldados e suas famílias, mas agora são relíquias vazias da Guerra Fria. Devemos reaproveitá-los ou deixar a história decidir seu destino?"
 GER_Cold_War.11.a: "Transformá-las em áreas residenciais e comerciais."
 GER_Cold_War.11.b: "Mantê-las como campos de treinamento militar."
 GER_Cold_War.11.c: "Preservá-las como sítios históricos da era da Guerra Fria."
 GER_news.03.t: "Queda do Voo 4590 da Air France, 109 Mortos."
 GER_news.03.d: "O Voo 4590 da Air France, um jato de passageiros Concorde em um voo fretado internacional de Paris a Nova York, caiu logo após a decolagem. O jato colidiu com um hotel em Gonesse, nas proximidades, dois minutos após a decolagem. Todos os 9 tripulantes e 100 passageiros (96 dos quais alemães) a bordo morreram, além de quatro pessoas no hotel. Outras seis pessoas no hotel ficaram gravemente feridas.\n\nA investigação oficial foi conduzida pelo órgão francês de investigação de acidentes, o Bureau d'Enquêtes et d'Analyses pour la Sécurité de l'Aviation Civile (BEA). A investigação pós-acidente revelou que a aeronave estava acima do peso máximo de decolagem para a temperatura ambiente e outras condições, e 810 kg (1.790 lb) acima do peso estrutural máximo, carregada de modo que o centro de gravidade ficou atrás do limite de decolagem."
 GER_news.03.a: "Um golpe trágico para a aviação europeia"
 GER_news.04.t: "Talibã Destrói Antigos Budas em Bamiyan"
 GER_news.04.d: "Em 12 de março de 2001, o regime talibã no Afeganistão destruiu os antigos Budas de Bamiyan, duas estátuas monumentais esculpidas nos penhascos do Vale de Bamiyan. Essas relíquias de grande importância cultural e histórica permaneceram por mais de 1.500 anos, representando a rica herança budista da região. A comunidade internacional condenou o ato como uma perda severa para o patrimônio mundial."
 GER_news.04.a: "Um golpe trágico para a história humana."
 GER_news.05.t: "'Good Bye Lenin!' Estreia na Berlinale 2002"
 GER_news.05.d: "No Festival de Cinema Berlinale de 2002, o filme alemão 'Good Bye Lenin!' estreou com grande aclamação da crítica. A tragicomédia, ambientada nas consequências da reunificação alemã, retrata a história de um jovem que esconde a queda do Muro de Berlim de sua frágil mãe. O filme oferece uma reflexão bem-humorada, porém comovente, sobre a identidade da Alemanha pós-reunificação e o choque entre Leste e Oeste."
 GER_news.05.a: "Um filme que captura o espírito de uma nação."
 GER_news.06.t: "Choque PISA - Alemanha Obtém Resultado Abaixo da Média"
 GER_news.06.d: "Os resultados do estudo PISA de 2002 provocaram um choque na Alemanha. A avaliação internacional de estudantes de 15 anos revelou que os alunos alemães tiveram desempenho abaixo da média da OCDE em leitura, matemática e ciências. As conclusões desencadearam um debate nacional sobre o estado do sistema educacional alemão, gerando pedidos de grandes reformas."
 GER_news.06.a: "Um alerta para a educação alemã."
 GER_news.07.t: "Love Parade 2000 - Uma Celebração da Música e da Liberdade"
 GER_news.07.d: "A Love Parade 2000, em Berlim, atraiu mais de um milhão de visitantes, celebrando a música eletrônica, a liberdade e a união. O evento anual, originalmente fundado como uma pequena manifestação pela paz e pela música, tornou-se um símbolo da cultura jovem alemã moderna, atraindo ravers de todo o mundo para dançar no coração da capital."
 GER_news.07.a: "Berlim, a capital mundial do techno."
 GER_news.08.t: "Cúpula de Vidro do Reichstag Abre ao Público"
 GER_news.08.d: "Em 2001, a recém-concluída cúpula de vidro no topo do edifício do Reichstag foi aberta ao público, oferecendo aos visitantes vistas panorâmicas de Berlim. Projetada pelo arquiteto Sir Norman Foster, a cúpula transparente simboliza a abertura e a transparência do governo, tornando-se um marco da democracia alemã moderna."
 GER_news.08.a: "Uma vista clara para o coração da democracia."
 GER_news.09.t: "O Colapso do Império de Mídia Kirch"
 GER_news.09.d: "Em 2002, o Grupo Kirch, um dos maiores conglomerados de mídia da Alemanha, pediu falência. O colapso marcou um dos maiores fracassos corporativos da Alemanha do pós-guerra, causando choque no cenário midiático alemão. Com dívidas crescentes e investimentos fracassados, a queda da Kirch expôs fraquezas estruturais na indústria de mídia alemã."
 GER_news.09.a: "Um gigante da mídia cai."
 GER_news.10.t: "Desastre na Pista de Testes do Transrapid"
 GER_news.10.d: "Em 22 de setembro de 2006, o trem de levitação magnética Transrapid, de ponta na Alemanha, sofreu um trágico acidente em sua pista de testes em Emsland. Um veículo de manutenção foi deixado por engano na pista, resultando em uma colisão catastrófica que tirou 23 vidas. O incidente lançou uma longa sombra sobre as ambições da Alemanha de ser pioneira na tecnologia maglev."
 GER_news.10.a: "Uma tragédia para a inovação alemã."
 GER_news.11.t: "Colapso do Arquivo Municipal de Colônia Choca a Alemanha"
 GER_news.11.d: "Em 3 de março de 2009, o prédio do Arquivo Municipal de Colônia desabou inesperadamente em um canteiro de obras adjacente, resultando na perda de incontáveis documentos históricos que abrangiam séculos. O colapso, atribuído a obras subterrâneas defeituosas, foi descrito como um dos maiores desastres culturais da Alemanha do pós-guerra."
 GER_news.11.a: "Uma perda inestimável para a história."
 GER_news.12.t: "Escândalo do Conselho de Supervisão da Volkswagen Vem à Tona"
 GER_news.12.d: "Em 2009, a Volkswagen, gigante automotiva alemã, esteve envolvida em um escândalo envolvendo membros seniores de seu conselho de supervisão. Acusações de uso indevido de fundos da empresa, viagens de luxo e favores pessoais evidenciaram problemas de governança no topo de uma das empresas mais icônicas da Alemanha. O caso manchou a reputação da VW e provocou pedidos de supervisão mais rigorosa."
 GER_news.12.a: "A corrupção mancha o gigante automotivo."
 GER_idea_bfv_islamist_high: "Bundesamt Für Verfassungsschutz"
 GER_idea_bfv_islamist_med: "Bundesamt Für Verfassungsschutz"
