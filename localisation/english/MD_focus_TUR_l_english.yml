 TUR_develop_domestic_category: "Develop Domestic Weapon Systems"
 TUR_develop_domestic_category_desc: "\n\n\n\n\n\n£TUR_desctext_develop_domestic_main\n\n\n\n\n\n\n\n\nWe can invest time and resources into researching and developing our own modern weapon systems. Drawing upon Turkey's engineering expertise and industrial traditions, we can create equipment tailored to the needs of our armed forces. Building a domestic defense industry will strengthen our military capabilities and reduce our reliance on foreign suppliers."
 
 # ============================================================
 # WHEELED ARMOURED VEHICLES (AFV) TENDER
 # ============================================================
 tur_afv_tender: "Hold a tender for §YWheeled Armoured Vehicles§!"
 tur_afv_tender_desc: "\n\n\n\n\n\n£TUR_desctext_develop_domestic_afv_for_tooltip\n\n\n\n\n\n\n\n\n§WTender for a new domestic wheeled armoured vehicle for the Land Forces.\n§W--------------§!\n§LOtokar§! §YArma§!: 8x8 wheeled armoured vehicle with §Ghigh payload§! and §Gstrong mine protection§!, but §Rheavier§!.\n§LFNSS§! §YPars III§!: 6x6/8x8 wheeled armoured vehicle with §Ggreat agility§! and §Gcheap production§!, but §Rless payload§!.\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the development of §Ynewer versions§! of these vehicles.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 turkey_afv_tender.1.name: "The Commission Has Spoken"
 turkey_afv_tender.1.desc: "§WAfter months of field trials, the evaluation commission has reviewed the §LFNSS§! §YPars III§! and the §LOtokar§! §YArma§!. Both vehicles crossed mud, steep slopes and river fords, and both passed live-fire tests.\n\n§LOtokar§! §YArma§!: modular 8x8 with §Ghigh payload§!, §Gstrong mine protection§! and §Groom to grow§!, but §Rheavier§!.\n\n§LFNSS§! §YPars III§!: modular 6x6/8x8 with §Ggreat agility§!, §Gcheap production§! and §Gfast delivery§!, but §Rless payload§!.\n\nThe winner will shape our armoured vehicle fleet for decades.§!"
 turkey_afv_tender.1.a: "§LOtokar§! §YArma§! §G(Payload and protection)§! §R(Heavier)§!"
 turkey_afv_tender.1.b: "§LFNSS§! §YPars III§! §G(Agile and cheap)§! §R(Less payload)§!"

 # ============================================================
 # TRANSPORT VEHICLES TENDER
 # ============================================================
 tur_light_transport_tender: "Hold a tender for §YTransport Vehicles§!"
 tur_light_transport_tender_desc: "\n\n\n\n\n\n£TUR_desctext_light_transport_tender_for_tooltip\n\n\n\n\n\n\n\n\n§WTender to replace the aging §YTuzla Jeep§! with new utility and transport vehicles.\n§W--------------§!\n§LOtokar§! §YDefender MLR41§!: light utility vehicle with §Gexcellent off-road performance§! and §Gquick delivery§!, but §Rbasic protection§!.\n§LOtokar§! §YNew Generation Hull§!: modular armoured platform with §Gmine protection§! and §Gshared components§!, but §Rtakes longer to field§!.\n§LOtokar§! §YISV§!: armoured utility vehicle with §Gbetter crew protection§! and §Gweapon mounts§!, but §Rcosts more§!.\n§YUnimog U4000§!: commercial-grade truck with §Grugged chassis§! and §Glow cost§!, but §Rlittle protection§!.\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YArmored Vehicles Tender§! and the development of §Ynewer versions§! of these vehicles.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 turkey_light_transport_tender.1.name: "Transport Vehicle Tender"
 turkey_light_transport_tender.1.desc: "§WThe §YTuzla Jeep§! has served our soldiers for decades, but it offers §Ralmost no protection§!, its load capacity is §Rmodest§! and spare parts are becoming §Rscarce§!. The General Staff wants it replaced, and the tender has produced several proposals.\n\n§LOtokar§! §YDefender MLR41§!: proven vehicle with §Gexcellent off-road performance§!. It can be bought as a batch right away, or built in series at a domestic plant if we §Rinvest in a longer program§!.\n\n§LOtokar§! §YNew Generation Hull§!: modular platform with §Gmore protection and flexibility§!, but it will take §Rmore time and money§! to field.\n\n§YCheaper Options§!: the §LOtokar§! §YISV§! or the §YUnimog U4000§!.\n\nThe decision we make now will shape our equipment for years to come.§!"
 turkey_light_transport_tender.1.a: "§LOtokar§! §YDefender MLR41§! large batch §G(Immediate delivery)§!"
 turkey_light_transport_tender.1.b: "Expand the §LOtokar Arifiye§! plant for the §YDefender MLR41§! §G(Series production)§! §R(240+ days)§!"
 turkey_light_transport_tender.1.c: "§LOtokar§! §YNew Generation Hull§! §G(Mine protection)§! §R(Takes longer)§!"
 turkey_light_transport_tender.1.d: "§YCheaper Options§! §G(Low cost)§!"
 turkey_light_transport_tender.2.name: "The New Generation Hull Configuration"
 turkey_light_transport_tender.2.desc: "§WThe §LOtokar§! §YNew Generation Hull§! is a modular platform that can become two distinct vehicles. Shared parts should make §Gproduction§! and §Gmaintenance§! simpler.\n\n§LOtokar§! §YKaya§!: utility and transport variant for §Gcargo§!, §Gsupply§! and §Gpersonnel§! duties.\n\n§LOtokar§! §YCobra§!: §YMRAP§! variant that protects its crew from §Gmines§! and §Gambushes§!.\n\nWhich configuration should we field?§!"
 turkey_light_transport_tender.2.a: "§LOtokar§! §YKaya§! transport §G(Cargo and troops)§!"
 turkey_light_transport_tender.2.b: "§LOtokar§! §YCobra§! MRAP §G(Mine protection)§! §R(Costs more)§!"
 turkey_light_transport_tender.3.name: "Unimog and ISV Developments"
 turkey_light_transport_tender.3.desc: "§WTwo very different proposals are on the table, and only one can be selected.\n\n§LOtokar§! §YISV§!: purpose-built armoured vehicle with §Gbetter crew protection§! and §Gweapon mounts§!, but §Rcosts more§! to buy and operate.\n\n§YUnimog U4000§!: commercial-grade truck with a §Grugged chassis§! and §Geasy maintenance§!, but §Rlittle protection§!.\n\nThe choice is between §Ysurvivability§! and §Yaffordability§!.§!"
 turkey_light_transport_tender.3.a: "§LOtokar§! §YISV§! §G(Protection)§! §R(Costs more)§!"
 turkey_light_transport_tender.3.b: "§YUnimog U4000§! §G(Cheap and rugged)§! §R(Little protection)§!"
 turkey_light_transport_tender.4.name: "The Otokar Arifiye Plant Expansion Is Complete"
 turkey_light_transport_tender.4.desc: "§WThe new workshops of the §LOtokar Arifiye§! plant are ready. The plant can now build the §YDefender§!, §YAkrep§! and §YCobra§! vehicles in series for our Armed Forces.§!"
 turkey_light_transport_tender.4.a: "§GStart the production line§!"

 # ============================================================
 # ARMORED VEHICLES (LIGHT TRANSPORT + MRAP) TENDER
 # ============================================================
 tur_mrap_tender: "Hold a tender for §YArmored Vehicles§!"
 tur_mrap_tender_desc: "\n\n\n\n\n\n£TUR_mrap_for_tooltip\n\n\n\n\n\n\n\n\n§WTender for new light transport and MRAP vehicles. §GBoth programs can be decided§!, and a choice in §Rboth§! is needed to finish the tender.\n§W--------------§!\n§LBMC§! §Y235§!: light transport vehicle with §Gcheap production§! and §Gquick delivery§!, but §Rlimited protection§!.\n§LBMC§! §YEfe§!: light transport vehicle with §Gbetter mobility§! and §Gstronger protection§!, but §Rmore expensive§!.\n§LBMC§! §YKirpi 4x4§!: MRAP with §Gproven design§! and §Gmine protection§!, but §Rsmaller troop capacity§!.\n§LBMC§! §YKirpi 6x6§!: MRAP with §Gmore troop capacity§! and §Gheavier protection§!, but §Rmore expensive§!.\n§YKaya 2§!: MRAP with §Gcheap production§! and §Gquick delivery§!, but §Rlower protection§!.§!"
 tur_mrap_requires_light_transport: "Complete the §YTransport Vehicles Tender§!"
 tur_mrap_tender.1.name: "The Armored Vehicle Tender"
 tur_mrap_tender.1.desc: "§WThe proposals for the §YArmored Vehicle Tender§! have been reviewed. Our troops still depend on aging, unprotected vehicles, and the threat of mines and ambushes grows on every front.\n\nTwo programs are on the table: a §YLight Transport§! vehicle to carry troops and supplies, and an §YMRAP§! vehicle to protect them against mines. §GBoth can be decided§!, one after the other.\n\nWhich program should we settle first?§!"
 tur_mrap_tender.1.a: "§YLight Transport§! program"
 tur_mrap_tender.1.b: "§YMRAP§! program"
 tur_mrap_tender.2.name: "The Light Transport Tender"
 tur_mrap_tender.2.desc: "§WTwo domestic designs are competing for the §YLight Transport§! contract.\n\n§LBMC§! §Y235§!: §Gcheap§! and §Gquick to produce§!, but offers only §Rlimited protection§!.\n\n§LBMC§! §YEfe§!: §Gbetter mobility§! and §Gstronger protection§!, but §Rmore expensive§! and §Rslower to field§!.\n\nCost and speed on one side, capability on the other.§!"
 tur_mrap_tender.2.a: "§LBMC§! §Y235§! §G(Cheap and fast)§! §R(Limited protection)§!"
 tur_mrap_tender.2.b: "§LBMC§! §YEfe§! §G(Capable)§! §R(More expensive)§!"
 tur_mrap_tender.3.name: "The MRAP Tender"
 tur_mrap_tender.3.desc: "§WThree designs are competing for the §YMRAP§! contract.\n\n§LBMC§! §YKirpi 4x4§!: §Gproven§! and §Gaffordable§!, with solid mine protection, but a §Rsmaller troop capacity§!.\n\n§LBMC§! §YKirpi 6x6§!: §Gmore troop capacity§!, §Gheavier protection§! and room for more equipment, but §Rmore expensive§! and §Rless agile§!.\n\n§YKaya 2§!: §Gcheapest§! and §Gquick to field§!, but §Rlower protection§!.\n\nAffordability, balance or capability?§!"
 tur_mrap_tender.3.a: "§LBMC§! §YKirpi 4x4§! §G(Proven and balanced)§! §R(Smaller capacity)§!"
 tur_mrap_tender.3.b: "§LBMC§! §YKirpi 6x6§! §G(Heavy protection)§! §R(More expensive)§!"
 tur_mrap_tender.3.c: "§YKaya 2§! §G(Cheap and fast)§! §R(Lower protection)§!"
 tur_mrap_tender.4.a: "Continue"

 # ============================================================
 # SELF-PROPELLED HOWITZER TENDER
 # ============================================================
 tur_spg_tender: "Hold a tender for §YSelf-Propelled Howitzers§!"
 tur_spg_tender_desc: "\n\n\n\n\n\n£TUR_desctext_spg_tender_for_tooltip\n\n\n\n\n\n\n\n\n§WTender to replace the aging §YM44T§! and §YM52T§! with a new 155-mm self-propelled howitzer.\n§W--------------§!\n[GER.GetFlag]§YPzH 2000§!: 155-mm self-propelled howitzer with §Goutstanding rate of fire§! and §Gfully automated loading§!, but §Rvery expensive§!.\n[KOR.GetFlag]§YK9 Thunder§!: 155-mm self-propelled howitzer with §Gcost-effective design§! and §Glicensed production in Turkey§!.\n[ENG.GetFlag]§YAS-90§!: 155-mm self-propelled howitzer with §Greliable design§! and §Geasy integration§!, but §Rthe oldest design§!.\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YAsya TTO§! and the §YNext Generation Self-Propelled Howitzers Tender§!.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_spg_tender.1.name: "The Self Propelled Howitzer Tender"
 tur_spg_tender.1.desc: "§WThe §YSelf-Propelled Howitzer Tender§! has concluded. Our aging §YM44T§! and §YM52T§! fleet can no longer be relied upon, and three partners have offered a replacement.\n\n[GER.GetFlag]§YPzH 2000§!: the §Gmost advanced§! system, with an §Gunmatched rate of fire§! and §Gextreme range§!, but §Rvery expensive§! and leaves §Ronly a minor role for our industry§!.\n\n[KOR.GetFlag]§YK9 Thunder§!: §Gcapable§! and §Gcost-effective§!, with §Gtechnology transfer§! and §Glicensed production§! in Turkey as the §YT-155 Firtina§!.\n\n[ENG.GetFlag]§YAS-90§!: §Gproven§! and §Geasy to integrate§!, but §Rthe oldest§! design with §Rless room to grow§!.\n\nEach choice will shape our artillery for decades.§!"
 tur_spg_tender.1.a: "[KOR.GetFlag]§YK9 Thunder§! §G(Built in Turkey as the T-155 Firtina)§!"
 tur_spg_tender.1.b: "[GER.GetFlag]§YPzH 2000§! §G(Best performance)§! §R(Very expensive)§!"
 tur_spg_tender.1.c: "[ENG.GetFlag]§YAS-90§! §G(Safe and reliable)§! §R(Oldest design)§!"

 TUR_develop_asya: "Develop the §YAsya TTO§!"
 TUR_develop_asya_desc: "\n\n\n\n\n\n£TUR_develop_asya_for_tooltip\n\n\n\n\n\n\n\n\n§WNew equipment: §YAsya TTO§!, 155-mm wheeled self-propelled howitzer.\nDeveloper: §LASELSAN§!.\nFeatures: §Gfully domestic design§! and §Gfast move, fire and relocate§!, and other smaller features.\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YNext Generation Self-Propelled Howitzers Tender§!.\nIf you §Rskip§! it, it will §Rnot§! be available to you.§!"
 TUR_develop_asya_locked_tt: "Complete the §YSelf-Propelled Howitzer Tender§!"

 tur_spg2_tender: "Hold a tender for §YNext Generation Self-Propelled Howitzers§!"
 tur_spg2_tender_desc: "\n\n\n\n\n\n£tur_spg2_tender_for_tooltip\n\n\n\n\n\n\n\n\n§WTender for a new wheeled 155-mm self-propelled howitzer to join the §YT-155 Firtina§!. §YFirtina II§! will be developed in either case.\n§W--------------§!\n§LMKE§! §YYavuz§!: 155-mm/52 howitzer on a truck chassis, §Gcheap§! and §Gquick to field§!, but §Rless protection§!.\n§YArpan§! (§YT-155 TTA§!): 8x8 wheeled 155-mm howitzer by §LASFAT§!, §LASELSAN§!, §LMKE§! and §LBMC§!, §Gmore capable§! and §Gbetter protected§!, but §Rcostlier§! and §Rslower§!.§!"
 TUR_spg2_tender_locked_tt: "Complete the §YAsya TTO§! Development"
 tur_spg2_tender.1.name: "The Next Generation Howitzers"
 tur_spg2_tender.1.desc: "§WThe §YT-155 Firtina§! has served well, but our tracked howitzers are §Rslow to redeploy§! and §Rexpensive to maintain§!. The General Staff will upgrade it to the §YFirtina II§! standard in every case, and add a §Ywheeled 155-mm howitzer§! beside it.\n\n§LMKE§! §YYavuz§!: 155-mm gun on a truck chassis, §Gcheaper§! and §Gquick to field§!, but §Rless protection and capability§!.\n\n§YArpan§! (§YT-155 TTA§!): 8x8 wheeled howitzer from §LASFAT§!, §LASELSAN§!, §LMKE§! and §LBMC§!, §Gfar more capable§!, but §Rcostlier§! and §Rslower§! to deliver.\n\nEither way, the §YFirtina II§! will join our artillery.§!"
 tur_spg2_tender.1.a: "§YFirtina II§! with §LMKE§! §YYavuz§! §G(Cheaper and faster)§! §R(Less capable)§!"
 tur_spg2_tender.1.b: "§YFirtina II§! with §YArpan§! §G(More capable)§! §R(Costly)§!"

 # ============================================================
 # M60 MODERNIZATION TENDER
 # ============================================================
 tur_m60t_upgrade_tender: "Hold a tender for §YM60 Modernization§!"
 tur_m60t_upgrade_tender_desc: "\n\n\n\n\n\n£TUR_m60t_upgrade_tender_for_tooltip\n\n\n\n\n\n\n\n\n§WTender for the modernization of our existing §YM60 Patton§! tanks.\n§W--------------§!\n[ISR.GetFlag]§YM60T§!: upgrade package with a §Gnew 120-mm smoothbore gun§! and §Gimproved armor§!, but §Rstill an old hull§!.\n[USA.GetFlag]§YM60-2000§!: far larger rebuild with §GAbrams-derived technology§! and §Gmuch greater combat value§!, but §Rmuch more expensive§!.\n[UKR.GetFlag]§YM60-84§!: hybrid of the §YM60A3§! hull and a §YT-84 Oplot§! turret with §Gstrong firepower§! and §Gmodern protection§!, but §Rtechnically risky§!.\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YTank 2000 Tender§! and §YAltay Development§!.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_m60t_upgrade_tender.1.name: "The M60 Modernization Tender"
 tur_m60t_upgrade_tender.1.desc: "§WThe proposals for the §YM60 Modernization Tender§! have been reviewed. Our §YPatton§! fleet can no longer face modern threats as it is, and three partners have offered to bring it up to date.\n\n[ISR.GetFlag]§YM60T§!: §Gproven§! and §Gaffordable§!, with a §Gnew 120-mm smoothbore gun§! and §Gimproved armor§!, but the result remains a §Rmodernized M60§! and makes us §Rdependent on Israeli industry§!.\n\n[USA.GetFlag]§YM60-2000§!: a far more ambitious rebuild with §GAbrams-derived technology§! and §Gmuch greater combat value§!, but §Rmuch more expensive§! and §Rslower§! to bring into service.\n\n[UKR.GetFlag]§YM60-84§!: the §YM60A3§! hull with a §YT-84 Oplot§! turret, §Gstrong firepower§! and §Gmodern protection§! at a §Gmoderate price§!, but an §Runtested hybrid§!.\n\nSpeed and cost, capability, or a bold hybrid. The choice is ours.§!"
 tur_m60t_upgrade_tender.1.a: "[ISR.GetFlag]§YM60T§! §G(Fast and affordable)§! §R(Old hull)§!"
 tur_m60t_upgrade_tender.1.b: "[USA.GetFlag]§YM60-2000§! §G(Capable, long-term)§! §R(Very expensive)§!"
 tur_m60t_upgrade_tender.1.c: "[UKR.GetFlag]§YM60-84§! §G(Oplot turret)§! §R(Untested)§!"

 # ============================================================
 # TANK 2000 TENDER
 # ============================================================
 TUR_tank_2000_requires_m60t_tt: "Complete the §YM60 Modernization Tender§!"
 tur_tank_2000_tender: "Hold a tender for §YTank 2000§!"
 tur_tank_2000_tender_desc: "\n\n\n\n\n\n£TUR_desctext_tank_2000_tender_for_tooltip\n\n\n\n\n\n\n\n\n§WTender for a new main battle tank, tested in trials across §YAnatolia§!.\n§W--------------§!\n[GER.GetFlag]§YLeopard 2A6§!: main battle tank with an §Goutstanding gun§! and §Gfire control§!, but §Rtechnology transfer is uncertain§!.\n[FRA.GetFlag]§YLeclerc§!: main battle tank with an §Gautoloader§! and §Gagile design§!, but §Rcostly§! and §Rcomplex to maintain§!.\n[USA.GetFlag]§YM1A2 Abrams§!: main battle tank, §Gwell protected§! and §Gcapable§!, but §Rexpensive§! and §Rheavy§!.\n[UKR.GetFlag]§YT-84 Yatagan§!: main battle tank, §Gcheap§! and §Gopen to technology transfer§!, but §Rless mature§!.\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock §YAltay Development§!.\nIf you §Rskip§! it, it will §Rnot§! be available to you.§!"
 tur_tank_2000_tender.1.name: "The Tank 2000 Tender"
 tur_tank_2000_tender.1.desc: "§WAfter months of trials across §YAnatolia§!, the results of the §YTank 2000 Tender§! have reached the General Staff. Four foreign designs competed to become our new main battle tank.\n\n[GER.GetFlag]§YLeopard 2A6§!: the §Gbest performer in the trials§!, with an §Goutstanding gun§! and §Gfire control§!, but Berlin is §Rhesitant on technology transfer§! and the deal is §Rpolitically fragile§!.\n\n[FRA.GetFlag]§YLeclerc§!: §Gmodern§! and §Gagile§! with an §Gautoloader§!, but §Rcostly§! and §Rcomplex to maintain§!.\n\n[USA.GetFlag]§YM1A2 Abrams§!: §Gcapable§! and §Gwell protected§!, and it would §Gstrengthen our ties with Washington§!, but §Rexpensive§! and §Rheavy§!.\n\n[UKR.GetFlag]§YT-84 Yatagan§!: §Gcheap§! and §Gopen to technology transfer§!, but §Rless mature§!.\n\nIf no deal is possible, we can settle for surplus §YLeopard 2A4s§! from [GER.GetFlag]§YGerman§! stocks.§!"
 tur_tank_2000_tender.1.a: "[GER.GetFlag]§YLeopard 2A6§! §G(Best in trials)§! §R(Uncertain deal)§!"
 tur_tank_2000_tender.1.b: "[FRA.GetFlag]§YLeclerc§! §G(Modern and agile)§! §R(Costly)§!"
 tur_tank_2000_tender.1.c: "[USA.GetFlag]§YM1A2 Abrams§! §G(Well protected)§! §R(Expensive)§!"
 tur_tank_2000_tender.1.d: "[UKR.GetFlag]§YT-84 Yatagan§! §G(Cheap, technology transfer)§! §R(Less mature)§!"
 tur_tank_2000_tender.1.e: "[GER.GetFlag]Surplus §YLeopard 2A4s§! §G(Available at once)§! §R(Older)§!"
 tur_tank_2000_tender.2.name: "Berlin Says No"
 tur_tank_2000_tender.2.desc: "§WThe [GER.GetFlag]§YGerman§! government has refused to approve the export of the §YLeopard 2A6§! to [TUR.GetFlag]§YTurkey§!, citing §Rhuman rights concerns§!.\n\nBerlin has quietly offered a consolation: a large batch of surplus §YLeopard 2A4s§! from §YBundeswehr§! stocks. They are §Rolder and less capable§!, but §Gavailable immediately§! and at a §Gfraction of the price§!.\n\nShould we take what we can get, or return to the other bidders?§!"
 tur_tank_2000_tender.2.a: "§YLeopard 2A4s§! §G(Accept the surplus)§!"
 tur_tank_2000_tender.2.b: "§YReturn to the other bids§! §G(Modern tank)§!"

 # ============================================================
 # EARLY ALTAY / YENI ALTAY
 # ============================================================
 tur_early_altay_requires_tank_2000_tt: "Complete the §YTank 2000 Tender§!"
 tur_early_altay_development: "Develop the §YEarly Altay§!"
 tur_early_altay_development_desc: "\n\n\n\n\n\n£TUR_desctext_altay_for_tooltip\n\n\n\n\n\n\n\n\n§WNew equipment: §YAltay§!, the first domestic main battle tank.\nDeveloper: §LOtokar§! or §LBMC§!.\nFeatures: §Gdomestic design§! and §Gchoice of gun, armor and engine§!, and other smaller features.\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the development of the §YYeni Altay§!.\nIf you §Rskip§! it, it will §Rnot§! be available to you.§!"
 tur_early_altay_development.1.name: "The Altay Takes Shape"
 tur_early_altay_development.1.desc: "§WThe §YGeneral Staff§! has decided that [TUR.GetFlag]§YTurkey§! will no longer wait on foreign capitals for its main battle tank. A §Gdomestic design§! will be built, and the §YSSM§! must choose who leads it.\n\n§LOtokar§!: our most experienced tank and armoured vehicle designer, with a §Gproven design bureau§! and a §Gfaster path to a prototype§!, but it relies on §Rforeign know-how§! for the hardest parts.\n\n§LBMC§!: an ambitious group with §Gdeep pockets§! and §Glarge production capacity§!, promising a §Gmore independent program§!, but with §Rno experience§! designing a modern tank, and §Rdelays are likely§!.\n\nWhoever we pick will shape the §YAltay§! for decades.§!"
 tur_early_altay_development.1.a: "§LOtokar§! leads §G(Proven, 360 days)§! §R(Foreign know-how)§!"
 tur_early_altay_development.1.b: "§LBMC§! leads §G(Domestic)§! §R(Risky, 480 days)§!"
 tur_early_altay_development.2.name: "Altay: Choosing the Main Gun"
 tur_early_altay_development.2.desc: "§WThe design team has reached its first milestone, and the §Ymain gun§! must be chosen before work on the hull and turret continues.\n\n§Y120-mm L/55§!: §Glonger and more powerful§!, with better range and penetration, but §Rmore expensive§! and needs a §Rheavier turret§!.\n\n§Y120-mm L/44§!: §Gcheaper§! and §Gproven§!, easier to produce and fit, but §Rless firepower§! against the latest armor.§!"
 tur_early_altay_development.2.a: "§Y120-mm L/55§! gun §G(More firepower)§! §R(Expensive)§!"
 tur_early_altay_development.2.b: "§Y120-mm L/44§! gun §G(Cheaper)§! §R(Less firepower)§!"
 tur_early_altay_development.3.name: "Altay: Choosing the Armor"
 tur_early_altay_development.3.desc: "§WWith the gun settled, the engineers ask which §Yarmor package§! the Altay should carry.\n\n§YComposite armor§!: §Gfar better protection§! against modern anti-tank weapons, but §Rcostly§! and needs §Rtechnology we are still learning§!.\n\n§YBasic steel armor§!: §Gcheap§! and §Geasy to produce§!, but leaves our crews §Rvulnerable§! on a modern battlefield.§!"
 tur_early_altay_development.3.a: "§YComposite armor§! §G(Better protection)§! §R(Expensive)§!"
 tur_early_altay_development.3.b: "§YBasic steel armor§! §G(Cheaper)§! §R(Weaker protection)§!"
 tur_early_altay_development.4.name: "Altay: Choosing the Engine"
 tur_early_altay_development.4.desc: "§WThe final major decision is the §Yengine§!, which decides how fast, how far and how reliably the Altay can move.\n\n§YPowerful modern diesel§!: §Gexcellent mobility§! and a better power-to-weight ratio, but §Rexpensive§! and likely to need §Rimported components§!.\n\n§YSimple, cheaper engine§!: §Gquick to produce§! and easy to maintain, but the tank will be §Rslower and less agile§!.§!"
 tur_early_altay_development.4.a: "§YPowerful diesel engine§! §G(Mobility)§! §R(Expensive)§!"
 tur_early_altay_development.4.b: "§YSimple engine§! §G(Cheaper)§! §R(Slower)§!"
 tur_early_altay_development.5.name: "The Altay Is Ready"
 tur_early_altay_development.5.desc: "§WAfter long years of design work, the first §YAltay§! is ready to leave the drawing board. The gun, armor and engine chosen along the way have come together in [TUR.GetFlag]§YTurkey§!'s first §Gdomestic main battle tank§!. The General Staff has approved the design for production.§!"
 tur_early_altay_development.5.a: "§GBegin production of the Altay§!"
 tur_early_altay_development.6.name: "BMC Stumbles"
 tur_early_altay_development.6.desc: "§WTrouble has hit the §YAltay§! program. §LBMC§!'s engineers have run into serious problems integrating the §Yengine and transmission§! with the hull, and the first test rigs failed their endurance trials.\n\n§LBMC§! admits the design needs §Rsignificant rework§!. The fixes are possible, but §Rlate§! and §Rmore expensive§! than promised. The program is set back by §R90 days§!.§!"
 tur_early_altay_development.6.a: "§RBMC has screwed up§! §R(+90 days, -10 treasury, -2% stability)§!"

 tur_yeni_altay_requires_early_altay: "Complete the §YEarly Altay§! Development"
 tur_yeni_altay_development: "Develop the §YYeni Altay§!"
 tur_yeni_altay_development_desc: "\n\n\n\n\n\n£TUR_desctext_yeni_altay_for_tooltip\n\n\n\n\n\n\n\n\n§WModernization of existing equipment: §YAltay§! (§YYeni Altay§!).\nDeveloper: §LBMC§!.\nFeatures: new §Gpowerpack§! (§YKorean§! import or domestic §YBATU§! engine) and §Gserial production§!, and other smaller modifications.§!"
 tur_yeni_altay_development.1.name: "The Powerpack Problem"
 tur_yeni_altay_development.1.desc: "§WThe §YYeni Altay§! program is stuck. §LBMC§! promised delivery within two years, but the [GER.GetFlag]§YGerman§! §LMTU§! and §LRenk§! powerpacks are out of reach because of the §Rembargo§!.\n\n[KOR.GetFlag]§YKorean§! powerpack: a §Gproven§! package for the first batch, but we remain §Rdependent on foreign suppliers§!.\n\n§LBMC§! §YBATU§! engine: §Gfully domestic§!, but §Rmuch slower and riskier§!.§!"
 tur_yeni_altay_development.1.a: "[KOR.GetFlag]§YKorean powerpack§! §G(Faster)§! §R(Foreign-dependent)§!"
 tur_yeni_altay_development.1.b: "§LBMC§! §YBATU§! engine §G(Fully domestic)§! §R(Very slow)§!"
 tur_yeni_altay_development.2.name: "The Altay T1 Enters Production"
 tur_yeni_altay_development.2.desc: "§WAfter years of delays, the first §YAltay T1§! tanks are ready to leave the factory, powered by the imported [KOR.GetFlag]§YKorean§! powerpack. §LBMC§! has struggled to organize the production line, and early output will be §Rslow and inefficient§!. The domestic engine will only be ready for a later batch.§!"
 tur_yeni_altay_development.2.a: "§GBegin production§! §R(Expect production problems)§!"
 tur_yeni_altay_development.3.name: "The Altay T2 Is Ready"
 tur_yeni_altay_development.3.desc: "§WAfter a long and costly wait, the §YBATU§! engine has matured and the §YAltay T2§! can enter production with a fully §Gdomestic powerpack§!. §LBMC§! still has teething problems, but the tank no longer depends on §Rforeign permission§!.§!"
 tur_yeni_altay_development.3.a: "§GBegin production§! §R(Expect production problems)§!"
 tur_yeni_altay_development.4.name: "The Domestic Powerpack Matures"
 tur_yeni_altay_development.4.desc: "§WYears after the T1 entered service, the §LBMC§! §YBATU§! engine and transmission are ready. Later batches of the Altay can use a §Gfully domestic powerpack§!, ending our §Rdependence§! on [KOR.GetFlag]§YKorean§! suppliers.§!"
 tur_yeni_altay_development.4.a: "§GBegin Altay T2 production§!"
 TUR_bmc_production_problems: "BMC Production Problems"
 TUR_bmc_production_problems_desc: "§LBMC§! is struggling with the §YAltay§! production line, lowering our §Rfactory efficiency§!."

 # ============================================================
 # SPAA TENDER
 # ============================================================
 tur_spaa_tender: "Hold a tender for §YSPAA Systems§!"
 tur_spaa_tender_desc: "\n\n\n\n\n\n£TUR_spaa_tender_for_tooltip\n\n\n\n\n\n\n\n\n§WTender for a new self-propelled air defense system to protect our maneuver forces.\n§W--------------§!\n[TUR.GetFlag]§YAtilgan§! and §YZipkin§!: short-range §YStinger§! missile systems with §Gdomestic design§! and §Gcheap, quick production§!, but §Rinfrared guidance limits performance in poor weather§!.\n[FRA.GetFlag][GER.GetFlag]§YRoland§!: missile system on an §LFNSS§! §YACV§! chassis with §Gall-weather capability§! and §Gradar tracking§!, but §Rforeign-dependent§! and §Rexpensive§!.\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YKorkut§! Development and the §YHisar§! Development.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_spaa_tender.1.name: "The Air Defense Tender"
 tur_spaa_tender.1.desc: "§WThe proposals for the §YSelf-Propelled Air Defense Tender§! have been reviewed. Our maneuver forces cannot keep advancing beneath an open sky, and two options have been put before us.\n\n[TUR.GetFlag]§YAtilgan§! and §YZipkin§!: short-range §YStinger§! systems on armored vehicles, §Gdomestic§!, §Gcheap§! and §Gquick to field§!, but §Rinfrared guidance§! limits them in poor weather and against defended targets.\n\n[FRA.GetFlag][GER.GetFlag]§YRoland§! on an §LFNSS§! §YACV§! chassis: §Gall-weather§! with §Gradar tracking§! and a heavier missile, but §Rexpensive§!, §Rcomplex§! and §Rdependent on foreign suppliers§!.\n\nDomestic production or foreign capability?§!"
 tur_spaa_tender.1.a: "[TUR.GetFlag]§YAtilgan§! and §YZipkin§! §G(Domestic, cheap)§! §R(Weather limits)§!"
 tur_spaa_tender.1.b: "[FRA.GetFlag][GER.GetFlag]§YRoland§! §G(All-weather)§! §R(Expensive, foreign)§!"

 TUR_develop_hisar: "Develop the §YHisar-A§! and §YHisar-O§!"
 TUR_develop_hisar_desc: "\n\n\n\n\n\n£TUR_develop_hisar_for_tooltip\n\n\n\n\n\n\n\n\n§WNew equipment: §YHisar-A§! and §YHisar-O§! surface-to-air missile systems.\nDevelopers: §LASELSAN§! (radars and fire control) and §LRoketsan§! (missiles).\nFeatures: §Gmobile low-altitude defense§! (§YHisar-A§!) and §Gmedium-altitude coverage§! (§YHisar-O§!), and other smaller features.§!"
 tur_hisar_requires_korkut: "Complete the §YKorkut§! Development"

 tur_korkut_development: "Develop the §YKorkut§!"
 tur_korkut_development_desc: "\n\n\n\n\n\n£TUR_korkut_for_tooltip\n\n\n\n\n\n\n\n\n§WNew equipment: §YKorkut§!, self-propelled air defense system that escorts our armored columns.\nDeveloper: §LASELSAN§!.\nFeatures: §Gtwin 35-mm cannons§! and §Gintegrated radar and fire control§!, and other smaller features.\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YHisar§! Development and the §YGürz§! or §YBurç§! Development.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_korkut_requires_kms: "Complete the §YSPAA Systems Tender§!"
 tur_korkut_development.1.name: "Korkut SPAAG Development"
 tur_korkut_development.1.desc: "§WThe §YKorkut§! began as a requirement for an air defense system that could accompany our armored columns and engage threats at close range. Its twin §Y35-mm§! cannons, radars and electro-optical suite are ready, but it still lacks a carrier platform.\n\n§LFNSS§! §YACV-30§!: tracked chassis with §Gfar better protection§! and §Gdurability§!, but §Rslower§!.\n\n§LOtokar§! §YArma 8x8§!: wheeled chassis with §Ghigh speed§! and §Gmobility§!, but §Rless protection§!.\n\nWhichever we choose will define how the §YKorkut§! fights for decades.§!"
 tur_korkut_development.1.a: "§LFNSS§! §YACV-30§! §G(Better protection)§! §R(Slower)§!"
 tur_korkut_development.1.b: "§LOtokar§! §YArma 8x8§! §G(Fast, mobile)§! §R(Less protection)§!"

 # ============================================================
 # GURZ / BURC
 # ============================================================
 tur_gurz_requires_korkut: "Complete the §YKorkut§! Development"
 tur_gurz_burc_development: "Develop the §YGürz§! or §YBurç§!"
 tur_gurz_burc_development_desc: "\n\n\n\n\n\n£TUR_develop_gurz_burc_for_tooltip\n\n\n\n\n\n\n\n\n§WNew equipment: wheeled gun-missile air defense system on an 8x8 chassis.\n§W--------------§!\n§YGürz§! (§LASELSAN§!): §G35-mm airburst cannon§! and §Gmodern AESA radar§!, but §Rcomplex and expensive§!.\n§YBurç§! (§LRoketsan§! and §LFNSS§!): §Gagile, cheap chassis§! and §Gmissiles reaching 10 km§!, but §Rless mature§!.\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the development of §Ynewer versions§! of these vehicles.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_gurz_burc_development.1.name: "Gürz or Burç"
 tur_gurz_burc_development.1.desc: "§WThe design bureaus have finished their preliminary studies, and both the §YGürz§! and the §YBurç§! are ready for full development. We can only fund one of them for now.\n\n§YGürz§! (§LASELSAN§!): §G35-mm airburst cannon§! and §Gmodern AESA radar§!, but §Rcomplex and expensive§!.\n\n§YBurç§! (§LRoketsan§! and §LFNSS§!): §Gagile, cheap chassis§! and §Gmissiles reaching 10 km§!, but §Rless mature§!.\n\nOur choice decides which vehicle goes through the §Ycannon§!, §Ychassis§! and §Ymissile§! trials.§!"
 tur_gurz_burc_development.1.a: "§YGürz§! §G(Airburst cannon, AESA radar)§! §R(Expensive)§!"
 tur_gurz_burc_development.1.b: "§YBurç§! §G(Agile and cheap)§! §R(Less mature)§!"
 tur_gurz_burc_development.2.name: "Choosing the Main Gun"
 tur_gurz_burc_development.2.desc: "§WThe design team has reached its first milestone, and the §Ymain gun§! must be chosen before work on the turret and hull continues.\n\n§YHeavy Cannon§!: §Gmore firepower§!, §Glonger range§! and §Gbetter penetration§!, but §Rmore expensive§! and needs a §Rheavier turret§!.\n\n§YLight Cannon§!: §Gcheaper§! and §Glighter§!, easier to produce and fit, but §Rless firepower§!.§!"
 tur_gurz_burc_development.2.a: "§YHeavy Cannon§! §G(More firepower)§! §R(Expensive)§!"
 tur_gurz_burc_development.2.b: "§YLight Cannon§! §G(Cheaper)§! §R(Less firepower)§!"
 tur_gurz_burc_development.3.name: "Choosing the Chassis"
 tur_gurz_burc_development.3.desc: "§WWith the gun settled, the engineers ask which §Ychassis§! should carry it.\n\n§YArmored Chassis§!: §Gfar better protection§! for the crew and systems, but §Rheavier§!, §Rslower§! and §Rmore expensive§!.\n\n§YMobile Chassis§!: §Glight§!, §Gfast§! and §Gcheaper§!, but §Rless protection§! on a modern battlefield.\n\nThe choice is between §Ysurvivability§! and §Ymobility§!.§!"
 tur_gurz_burc_development.3.a: "§YArmored Chassis§! §G(Better protection)§! §R(Expensive)§!"
 tur_gurz_burc_development.3.b: "§YMobile Chassis§! §G(Faster and cheaper)§! §R(Weaker protection)§!"
 tur_gurz_burc_development.4.name: "Choosing the Missiles"
 tur_gurz_burc_development.4.desc: "§WThe final major decision is the §Ymissile system§!, which decides how far and how accurately the vehicle can strike.\n\n§YLong-Range Missile§!: §Gguided§! with a §Gmuch longer range§! and §Ghigh accuracy§!, but §Rexpensive§! and §Rcomplex§! to integrate.\n\n§YStandard Missile§!: §Gproven§! and §Gcheaper§!, easy to produce and maintain, but its §Rshorter range§! gives the enemy more chances to hit back.§!"
 tur_gurz_burc_development.4.a: "§YLong-Range Missile§! §G(Range and accuracy)§! §R(Expensive)§!"
 tur_gurz_burc_development.4.b: "§YStandard Missile§! §G(Cheaper)§! §R(Shorter range)§!"
 tur_gurz_burc_development.5.name: "The Vehicle Is Ready"
 tur_gurz_burc_development.5.desc: "§WAfter months of design work, the first prototype is ready to leave the drawing board. The gun, chassis and missile system chosen along the way have come together in a finished vehicle, and the trials have satisfied the General Staff. The design has been approved for production.§!"
 tur_gurz_burc_development.5.a: "§GBegin production§!"

 # ============================================================
 # MBRL TENDER
 # ============================================================
 turkey_mlrs_tender: "Hold a tender for §YMBRL Systems§!"
 turkey_mlrs_tender_desc: "\n\n\n\n\n\n£TUR_mlrs_tender_for_tooltip\n\n\n\n\n\n\n\n\n§WTender for a new multiple launch rocket system by §LRoketsan§! on wheeled launcher trucks.\n§W--------------§!\n§YTR-122 Sakarya§!: 122-mm rocket system with §Gcheap, quick production§! and §Ghuge volume of fire§!, but §Runguided rockets§!.\n§YTRG-300 Kaplan§!: 300-mm rocket system with §Gguided rockets§! and §Gmuch longer range§!, but §Rmore expensive§! and §Rheavier§!.\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the development of §Ynewer versions§! of these systems.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 turkey_mlrs_tender.1.name: "The MLRS Tender"
 turkey_mlrs_tender.1.desc: "§WOur artillery can hit hard, but it cannot reach deep. The tube guns and old rocket launchers in service are §Rshort-ranged§! and cannot saturate a target quickly enough. The General Staff wants a modern §YMultiple Launch Rocket System§! built by our own industry.\n\n§YTR-122 Sakarya§!: 122-mm system with a large number of tubes, §Gcheap§!, §Gquick to produce§! and able to put a §Ghuge volume of rockets§! on a target, but its rockets are §Runguided§! and §Rshort-ranged§!.\n\n§YTRG-300 Kaplan§!: 300-mm system with §Gguided rockets§! and a §Gmuch longer range§!, able to strike §Gdeep targets§! with §Ghigh accuracy§!, but §Rmore expensive§!, §Rheavier§! and §Rslower to produce§!.\n\nThe choice is between §Ymass§! and §Yprecision§!.§!"
 turkey_mlrs_tender.1.a: "§YTRG-300 Kaplan§! §G(Precision, deep strike)§! §R(Expensive)§!"
 turkey_mlrs_tender.1.b: "§YTR-122 Sakarya§! §G(Mass, volume of fire)§! §R(Unguided)§!"

