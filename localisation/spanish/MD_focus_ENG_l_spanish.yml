 ENG_apollo_programme: "APOLLO Programme"
 ENG_apollo_programme_desc: "The APOLLO Programme is the Ministry of Defence's long-term renewal of British Forces Cyprus. It replaces the 1960s passenger and freight terminal at RAF Akrotiri, builds hundreds of new service family homes, and adds schools and medical facilities across the Sovereign Base Areas, keeping the station fit as the UK's main staging post for the eastern Mediterranean and Middle East."
