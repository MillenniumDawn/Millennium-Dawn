 TIB_sar_development_modifier: "Développement de la RAS tibétaine"
 TIB_sar_development_modifier_desc: "Suit le développement économique cumulé de la région administrative spéciale tibétaine, reflétant la croissance du tourisme de pèlerinage, du commerce transfrontalier et des recettes d'extraction de ressources affluant vers la RAS."
