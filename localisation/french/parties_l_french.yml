 Neutral_Muslim_Brotherhood: "Islamisme modéré"
 Neutral_Muslim_Brotherhood_desc: "Islamistes modérés : groupes et partis inspirés par les Frères musulmans, une organisation islamiste sunnite transnationale fondée en Égypte par l'érudit musulman Hassan al-Banna en 1928. Elle compte des partisans dans tout le monde arabe et au-delà grâce à son modèle d'activisme politique combiné à des œuvres caritatives islamiques. Son objectif est la gouvernance politique islamique et l'instauration du Coran et de la Sunnah comme seul point de référence pour la société."
 nationalist: "Perspective nationaliste"
 nationalist_noun: "Nationaliste"
 nationalist_desc: "Gouvernement nationaliste"
 Nat_Autocracy: "Junte militaire"
 Nat_Autocracy_desc: "Junte militaire : - Les gouvernements §Ynationalistes§! estiment qu'ils ont obtenu le raccourci de la mondialisation et cherchent une renaissance nationale basée sur le protectionnisme, la militarisation et la souveraineté nationale et ethnique. Ils détestent les institutions libérales mondiales, mais peuvent rester pragmatiques dans leurs alignements internationaux pour poursuivre leurs objectifs nationaux ou expansionnistes étroits."
 Nat_Fascism: "Fascisme"
 Nat_Fascism_desc: "Fascisme : - Les gouvernements §Ynationalistes§! estiment qu'ils ont obtenu le raccourci de la mondialisation et cherchent une renaissance nationale basée sur le protectionnisme, la militarisation et la souveraineté nationale et ethnique. Ils détestent les institutions libérales mondiales, mais peuvent rester pragmatiques dans leurs alignements internationaux pour poursuivre leurs objectifs nationaux ou expansionnistes étroits."
 Nat_Populism: "Populisme"
 Nat_Populism_desc: "Populisme de droite : - Les gouvernements §Ynationalistes§! estiment qu'ils ont obtenu le raccourci de la mondialisation et cherchent une renaissance nationale basée sur le protectionnisme, la militarisation et la souveraineté nationale et ethnique. Ils détestent les institutions libérales mondiales, mais peuvent rester pragmatiques dans leurs alignements internationaux pour poursuivre leurs objectifs nationaux ou expansionnistes étroits."
 Monarchist: "Monarchiste"
 Monarchist_desc: "Monarchiste : - Les gouvernements §Ynationalistes§! estiment qu'ils ont obtenu le raccourci de la mondialisation et cherchent une renaissance nationale basée sur le protectionnisme, la militarisation et la souveraineté nationale et ethnique. Ils détestent les institutions libérales mondiales, mais peuvent rester pragmatiques dans leurs alignements internationaux pour poursuivre leurs objectifs nationaux ou expansionnistes étroits."
 communist_state: "Communist"
 communist_state_desc: "Communist State: - Governments with an Emerging Outlook are those, especially in the Global South and Post-Soviet Sphere, that seek to replace the prevailing Liberal World Order with their own alternate institutions and multipolar way of global politics. They often have differing attitudes towards globalization, forms of government, and domestic policy.---- Communism is a radical socialist ideology, which is staunchly opposed to free market capitalism, instead promoting that control over the means of production be held by 'the workers'. What exactly this means varies, but has often translated to the state and economy being controlled by a single, authoritarian 'Communist Party'. Since the collapse of the Soviet Union, communism has greatly diminished across the world, but some states still claim it as their official ideology. Those aligned with the emerging powers see the current liberal, capitalist world order as exploitative, and believe it must be torn down and replaced."