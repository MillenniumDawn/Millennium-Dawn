 gcc_invite.1.t: "걸프의 초청"
 gcc_invite.1.d: "걸프 협력 회의를 대표하여 [FROM.GetName]이(가) 우리에게 연합 가입을 위한 정식 초청을 보내왔습니다. 가입하면 우리의 경제와 안보가 아랍 세계에서 가장 부유한 블록과 결합될 것입니다. 회의는 우리의 답변을 기다리고 있습니다."
 gcc_invite.1.a: "수락한다. 회의여 영원하라."
 gcc_invite.1.b: "지금은 거절해야겠다."
 gcc_invite.2.t: "GCC, 새 회원국 환영"
 gcc_invite.2.d: "리야드에서 열린 기념식에서 걸프 협력 회의가 새 회원국을 정식으로 받아들여, 연합이 처음으로 걸프 연안을 넘어 확장되었습니다. 블록의 영향권과 야망이 함께 커지고 있습니다."
 gcc_invite.2.a: "역사적인 날이다."
 gcc_invite.3.t: "초청 거절"
 gcc_invite.3.d: "우리의 초청이 거절되었습니다. 회의의 확장은 더 의향 있는 파트너가 나타나거나 마음이 바뀔 때까지 기다려야 할 것입니다."
 gcc_invite.3.a: "그렇다면 어쩔 수 없다."
