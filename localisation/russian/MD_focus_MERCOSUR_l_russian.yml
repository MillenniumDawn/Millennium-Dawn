 MER_invite_PAN_full_member_desc: "Начать переговоры о повышении статуса Панамы с ассоциированного члена до полноправного члена МЕРКОСУР.$MER_full_membership_acceptance_hint_desc$$MER_full_membership_invite_process_desc$"
 MER_request_mercosur_associate_membership: "Петиция о предоставлении статуса ассоциированного члена МЕРКОСУР"
 MER_request_mercosur_associate_membership_desc: "Подайте официальное ходатайство в МЕРКОСУР о предоставлении статуса ассоциированного члена. Если рассмотрение ходатайства пройдет без проблем, после окончания периода проверки мы будем включены в дальний круг блока, что откроет путь к более тесной региональной координации."
 MER_request_mercosur_full_membership: "Петиция о полноправном членстве в МЕРКОСУР"
 MER_request_mercosur_full_membership_desc: "Подайте официальную заявку на вступление в МЕРКОСУР в качестве полноправного члена. Если процесс пройдет успешно, наше присоединение будет официально оформлено по окончании периода рассмотрения, что позволит нам стать полноправными членами блока."
 MER_request_unasul_membership: "Петиция о вступлении в UNASUL"
 MER_request_unasul_membership_desc: "Подайте официальную заявку на вступление в UNASUL. Если заявка будет рассмотрена, мы присоединимся к южноамериканской структуре по окончании периода рассмотрения, а не будем ждать отдельного двустороннего приглашения."
 leave_UNASUL: "Покинуть Объединенный механизм обороны УНАСУЛ"
 leave_UNASUL_desc: "Выйти из военного альянса, созданного на основе Объединенного оборонного механизма UNASUL, и прекратить наше участие в его общей оборонной структуре."
 UNASUL_leave_tt: "Мы выйдем из военного альянса Объединенного оборонного механизма УНАСУЛ."
 MER_full_membership_acceptance_hint_desc: "\n\n§YПроцент одобрения определяется мнением страны о вас, вашим влиянием на нее и прогрессом дерева МЕРКОСУР!§!"
 MER_full_membership_invite_process_desc: "\n\n§YЕсли страна примет решение, она может либо немедленно присоединиться в качестве полноправного члена, либо запросить трехэтапный пакет документов для вступления. Завершение всех трех этапов процесса принятия решения о вступлении формализует членство через инвестиционный канал.§!"
 MER_mercosur_associate_invite_accept_tt: "Приглашенная страна становится ассоциированным государством §YMERCOSUR§!. Каждое текущее государство-член §YMERCOSUR§! получает §G+1.00%§! §YЕжемесячный рост производительности§! и §G+1.00%§! §YМножитель иностранного влияния§!, и обе стороны получают уведомление."
 MER_mercosur_associate_invite_reject_tt: "Приглашенная страна отклоняет предложение, и к ней больше не могут обращаться. §Y180 дней§!и мы проиграем §R15§! §YПолитическая власть§! после получения отказа."
 MER_mercosur_full_invite_accept_tt: "Приглашенная страна принимает предложение. Затем она будет выбирать между §Yнемедленное полное членство§! и ан §Yтрехэтапный путь присоединения, обеспеченный инвестициями§!и обе стороны получают уведомление о принятии."
 MER_mercosur_full_invite_reject_tt: "Приглашенная страна отклоняет предложение, и к ней больше не могут обращаться. §Y365 дней§!и мы проиграем §R25§! §YПолитическая власть§! после получения отказа."
 MER_unasul_invite_accept_tt: "Приглашенная страна присоединяется к §YUNASUL§!. Динамический модификатор §YUNASUL Member State§! обновляется для всех участников, увеличиваясь на §G+1.00%§! §YPolitical Power Gain§! и §G+1.00%§! §YStability§!, и отправляются региональные уведомления."
