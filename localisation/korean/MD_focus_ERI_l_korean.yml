l_korean:
 ERI_eritrea_puppet_federation: "두번째 연방"
 ERI_eritrea_puppet_federation_desc: "For the second time in our history, we're subject to Ethiopia. The first time it didn't work out, but maybe this time it will?"
 ERI_eritrea_puppet_federation_assembly: "에리트리아 대표 의회"
 ERI_eritrea_puppet_federation_assembly_desc: ""
 ERI_eritrea_puppet_federation_constitution: "헌법 재정"
 ERI_eritrea_puppet_federation_constitution_desc: ""
 ERI_eritrea_puppet_federation_appoint_chief_executive: "최고 지도자 임명"
 ERI_eritrea_puppet_federation_appoint_chief_executive_desc: "It's time to vote for our official representative to replace the current Transitional Government. Although we're in a federation with Ethiopia again, we need a strong man on the top to fight for our rights."
 appoint_chief_executive_tt: "§YA new Chief Executive will get appointed.§!"
 ERI_eritrea_puppet_federation_christian: "최고 지도자 아메드 나싸르"
 ahmed_nasser_cf: "아메드 나싸르가 새로운 최고 지도자입니다."
 ERI_eritrea_puppet_federation_muslim: "최고 지도자 후세인 켈리파이"
 hussein_kelifay_cf: "후세인 켈리파이가 새로운 최고 지도자입니다."
 eritrea.1.t: "행정 수반 임명"
 eritrea.1.d: "에리트레아 구국 전선(ENSF), 에리트레아 해방 전선(ELF)"
 eritrea.1.a: "ENSF 지도자 아메드 나세르"
 eritrea.1.b: "ELF 지도자 후세인 켈리파이"
 eritrea.2.t: "최초의 암하라어 학교, 오늘 개교"
 eritrea.2.d: "에티오피아는 대중에게 암하라어를 가르치기 위한 일련의 새 학교에 자금을 지원했습니다. 18세에서 60세 사이의 모든 사람이 기초 문장을 익히기 위해 최소한 입문 과정을 강제로 수강해야 하는 듯합니다. 학생들에게는 2학년부터 새 과목이 도입됩니다."
 eritrea.2.a: "어쩌면 우리는 저들을 이해하고 싶지 않은지도 모른다..."
 eritrea.3.t: "에티오피아 정당들, 에리트레아 지부 설립"
 eritrea.3.d: "에티오피아의 에리트레아 점령이 진행되면서, 에티오피아에 기반을 둔 많은 정당이 우리 도시에 지부를 열기 시작했으며, 우리 고유의 에리트레아 해방 전선부터 EPRDF 대표단에 이르기까지 정치 스펙트럼 전반이 자신들의 강령에 귀 기울일 사람을 찾아 경쟁하고 있습니다.\n\n심지어 셀라시에 치하의 \\"좋았던 옛 시절\\"로 돌아가기를 바라는 듯한 이들도 있습니다..."
 eritrea.3.a: "강령을 하나 받아 볼까?"
 ERI_ethiopian_lawbooks: "재편된 법체계"
 ERI_ethiopian_lawbooks_desc: "에티오피아는 에리트레아 법체계를 밑바닥부터 재건하기 위해 일련의 새로운 법전과 지침을 제공했으며, 그 결과 에리트레아의 법체계는 그 어느 때보다 훨씬 효율적이 되었습니다."
 ERI_amharic_constitution: "에티오피아-에리트레아 연방 헌법"
 ERI_amharic_constitution_desc: "새 헌법이 시행됨에 따라 에티오피아는 에리트레아에 대한 장악력을 굳혔으며, 그 대가로 에리트레아 내정에 대한 재정적 책임의 일부를 스스로 부담하게 되었습니다."
 ERI_eritrea_puppet_focus: "에리트레아 중점계통도"
 eritrea.3.b: "우리 자체 정당은 어떨까?"
 eritrea.3.c: "민주주의가 정말 통할까?"
 eritrea.4.t: "EISM, 급진적 재건 노력 제안"
 eritrea.4.d: "에티오피아와의 전쟁이 완전히 끝나면서, 전쟁과 아페웨르키의 끔찍한 통치로부터 에리트레아를 재건하기 위해 귀국하려는 디아스포라가 부족하지 않습니다.\n\n그러나 이들 디아스포라 가운데 일부는 다른 이들보다 더 급진적으로 보이며, EISM 소속을 자처하는 이들은 자신들이 모스크 안의 권력을 쥔다는 조건으로 에리트레아를 재건하겠다고 제안하고 있습니다..."
 eritrea.4.a: "기도 시간의 부름에 응답해야 할지도 모른다."
 eritrea.4.b: "그렇지 않다고 생각한다."
 ERI_transitional_government_desc: "에리트레아 정부는 붕괴했으며, 에티오피아는 현재 국가의 정치 구조를 재편하고 있습니다. 그 결과 이전 통치에서 현 에티오피아 국가와 더 부합하는 정부로 이행하는 과도 정부가 들어서 있습니다."
 ERI_eritrea_puppet_federation_christian_desc: ""
 ERI_eritrea_puppet_federation_muslim_desc: ""