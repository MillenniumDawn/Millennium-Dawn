 cnc_equipment_type: "Оборудование C&C"
 cnc_equipment_type_desc: "Оборудование командования и управления — это система, позволяющая руководству осуществлять руководство и контроль над назначенными силами для выполнения миссий и задач."
 cnc_equipment_1: "Оборудование C2"
 cnc_equipment_1_desc: "Оборудование командования и управления — это система, позволяющая руководству осуществлять власть и руководство над назначенными силами для выполнения миссий и задач. Эффективное командование и управление повышает организованность и моральный дух. C2 (командование и управление) является первым поколением оборудования C2."
 cnc_equipment_2: "Оборудование C3"
 cnc_equipment_2_desc: "Оборудование командования и управления — это система, позволяющая руководству осуществлять власть и руководство над назначенными силами для выполнения миссий и задач. Эффективное командование и управление обеспечивает лучшую организацию и моральный дух. C3 (Командование, управление и связь) является вторым поколением оборудования C2."
 cnc_equipment_3: "Оборудование C3ISTAR"
 cnc_equipment_3_desc: "Оборудование командования и управления — это система, позволяющая руководству осуществлять власть и руководство над назначенными силами для выполнения миссий и задач. Эффективное командование и управление повышает организацию и моральный дух. C3ISTAR (Командование, управление и связь, разведка, наблюдение, обнаружение целей и рекогносцировка) является третьим поколением оборудования C2."
 cnc_equipment_4: "Оборудование C4I"
 cnc_equipment_4_desc: "Оборудование командования и управления — это система, позволяющая руководству осуществлять власть и руководство над назначенными силами для выполнения миссий и задач. Эффективное командование и управление повышает организацию и моральный дух. C4I (Командование, управление, связь, вычислительная техника, разведка и совместимость) является четвёртым поколением оборудования C2."
 cnc_equipment_5: "Оборудование C4ISTAR"
 cnc_equipment_5_desc: "Оборудование командования и управления — это система, позволяющая руководству осуществлять власть и руководство над назначенными силами для выполнения миссий и задач. Эффективное командование и управление повышает организацию и моральный дух. C4ISTAR (Командование, управление, связь, вычислительная техника, разведка, совместимость, наблюдение, обнаружение целей и рекогносцировка) является пятым поколением оборудования C2."
 cnc_equipment_6: "Оборудование C5I"
 cnc_equipment_6_desc: "Оборудование командования и управления — это система, позволяющая руководству осуществлять власть и руководство над назначенными силами для выполнения миссий и задач. Эффективное командование и управление повышает организацию и моральный дух. C5I (Командование, управление, связь, вычислительная техника, совместная работа и разведка) является шестым поколением оборудования C2."
 cnc_equipment_7: "Оборудование C5ISTAR"
 cnc_equipment_7_desc: "Оборудование командования и управления — это система, позволяющая руководству осуществлять власть и руководство над назначенными силами для выполнения миссий и задач. Эффективное командование и управление повышает организацию и моральный дух. C5ISTAR (Командование, управление, связь, вычислительная техника, совместная работа, разведка, совместимость, наблюдение, обнаружение целей и рекогносцировка) является седьмым поколением оборудования C2."
 land_drone_equipment_type: "Наземные дроны"
 land_drone_equipment_type_desc: "Разведывательные дроны ближнего действия (БПЛА) обеспечивают ценную разведку в реальном времени и повышают осведомлённость о ситуации на поле боя. Они лёгкие и относительно легко переносимые."
 land_drone_equipment_1: "Дрон 1995"
 land_drone_equipment_1_desc: "Разведывательные дроны ближнего действия (БПЛА) обеспечивают ценную разведку в реальном времени и повышают осведомлённость о ситуации на поле боя. Они лёгкие и относительно легко переносимые."
