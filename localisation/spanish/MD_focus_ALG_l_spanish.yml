 ALG_oil_focused_energy_small_profit_desc: "Argelia ha decidido utilizar sus recursos petroleros sin explotar para ser autosuficiente en su producción de energía. Aunque es barato y de fácil acceso, el petróleo no es el enfoque más respetuoso con el medio ambiente."
