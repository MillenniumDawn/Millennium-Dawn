 CHI_TAI_intl_org_blockade_tt: "[TAI.GetNameWithFlag] obtiene un modificador dinámico que le penaliza en función de su nivel de reconocimiento internacional."
 CHI_TAI_intl_isolation_modifier: "Índice de aislamiento internacional"
 CHI_TAI_intl_isolation_modifier_desc: "Una medida dinámica del aislamiento diplomático de Taiwán, que escala de manera inversa al número de Estados miembros de la ONU que mantienen un reconocimiento diplomático formal. Un menor número de Estados que le reconozcan intensifica las penalizaciones a la opinión comercial, la influencia extranjera y el coste de mejorar relaciones con China; por el contrario, un mayor reconocimiento mejora estas relaciones y aumenta la influencia diplomática de Taiwán."
 CHI_recognition_embargo: "Embargo por reconocimiento"
 CHI_recognition_embargo_desc: "China ha impuesto severas sanciones económicas y diplomáticas a cualquier nación que mantenga un reconocimiento diplomático formal de Taiwán. Los costes comerciales con China han aumentado significativamente y el acceso a los mercados chinos está estrictamente restringido."
 china_sar.038.t: "Pekín propone una cooperación económica a través del Estrecho"
 china_sar.038.d: "Pekín ha presentado una propuesta formal a Taipéi para establecer un marco de cooperación económica a través del estrecho. Los funcionarios del continente lo enmarcan como un acuerdo pragmático y mutuamente beneficioso que elude por completo la cuestión de la soberanía. Los grupos empresariales de Taiwán se muestran receptivos, pero la oposición proindependentista advierte de un deslizamiento lento hacia la dependencia de la economía del continente."
 china_sar.038.a: "Comprometerse con el marco."
 china_sar.038.b: "Rechazar el acercamiento."
 china_sar.039.t: "Pekín ofrece expandir el comercio a través del Estrecho"
 china_sar.039.d: "Aprovechando la apertura del diálogo económico, Pekín propone una expansión sustancial del comercio a través del estrecho, reduciendo los aranceles y suavizando las restricciones a las exportaciones de Taiwán hacia el continente. La oferta evoca el Acuerdo Marco de Cooperación Económica y asoma el acceso al vasto mercado del continente. Los críticos en Taipéi temen que las concesiones conlleven condiciones políticas."
 china_sar.039.a: "Expandir el comercio con el continente."
 china_sar.039.b: "Rechazar la expansión comercial."
 china_sar.040.t: "Acceso al mercado del continente para empresas de Taiwán"
 china_sar.040.d: "Pekín invita a las empresas de Taiwán a operar en el continente bajo condiciones preferenciales, ofreciendo espacios de oficinas, derechos de construcción compartidos y una tramitación de licencias simplificada. Para la economía de Taiwán, impulsada por las exportaciones, la oportunidad es considerable, pero un mayor enredo comercial con el continente sigue siendo un asunto políticamente sensible en Taipéi."
 china_sar.040.a: "Aceptar el acceso preferencial al mercado."
 china_sar.040.b: "Mantener a nuestras empresas a distancia."
 china_sar.041.t: "Coordinación de semiconductores a través del Estrecho"
 china_sar.041.d: "Pekín propone una coordinación entre el continente y la industria de semiconductores de Taiwán, líder a nivel mundial, incluyendo instalaciones de fabricación conjuntas e investigación compartida. El sector de los chips de Taiwán es su mayor activo estratégico y su escudo más fuerte; compartirlo con el continente sería lucrativo, pero erosionaría la mismísima influencia que mantiene comprometidos a los socios de Taipéi."
 china_sar.041.a: "Coordinar en materia de semiconductores."
 china_sar.041.b: "Proteger nuestra industria de chips."
 china_sar.042.t: "Intercambio de delegaciones empresariales"
 china_sar.042.d: "Pekín invita a delegaciones empresariales recíprocas a recorrer los centros industriales a ambos lados del estrecho, forjando lazos personales entre ejecutivos del continente y de Taiwán. Las visitas son de bajo riesgo y comercialmente útiles, aunque cada una de ellas refuerza el entramado de interdependencia económica a través del estrecho."
 china_sar.042.a: "Intercambiar delegaciones."
 china_sar.042.b: "Rechazar las visitas."
 china_sar.043.t: "Enlaces directos de transporte a través del Estrecho"
 china_sar.043.d: "Pekín propone una expansión de los enlaces directos de transporte a través del estrecho, aprovechando la política de los Tres Enlaces con nuevas rutas marítimas, vuelos e infraestructuras. Las conexiones directas reducirían los costes tanto para las empresas como para los viajeros, vinculando de forma cada vez más estrecha a ambas economías."
 china_sar.043.a: "Abrir enlaces directos de transporte."
 china_sar.043.b: "Limitar las conexiones directas."
 china_sar.044.t: "Salvaguardias de inversión a través del Estrecho"
 china_sar.044.d: "Pekín ofrece un acuerdo formal que garantiza la protección legal para las inversiones de Taiwán en el continente, abordando las antiguas preocupaciones sobre los derechos de propiedad y el arbitraje. Las salvaguardias tranquilizarían a los inversores cautelosos, pero también consolidan un marco en el que Taipéi negocia con Pekín como un socio económico."
 china_sar.044.a: "Firmar las salvaguardias de inversión."
 china_sar.044.b: "Rechazar el acuerdo."
 china_sar.045.t: "Planificación industrial conjunta a través del Estrecho"
 china_sar.045.d: "Pekín propone una planificación industrial coordinada a través del estrecho, alineando cadenas de suministro, estándares y proyectos de gran envergadura. Dicha integración produciría eficiencias reales, pero también integraría la economía de Taiwán en la estrategia a largo plazo del continente, una perspectiva que alarma a los votantes defensores de la soberanía en Taipéi."
 china_sar.045.a: "Alinear nuestra planificación industrial."
 china_sar.045.b: "Planificar nuestra economía de forma independiente."
 china_sar.046.t: "Integración económica profunda a través del Estrecho"
 china_sar.046.d: "Pekín propone la fase final de la unión económica a través del estrecho: un mercado profundamente integrado con regulaciones armonizadas y el libre movimiento de bienes y capitales. Los partidarios señalan la prosperidad que traería consigo; los opositores advierten que, a este nivel de profundidad, la unión económica se vuelve difícil de distinguir de una absorción política."
 china_sar.046.a: "Completar la integración económica."
 china_sar.046.b: "Detenerse al borde del agua."
 china_sar.047.t: "Taipéi sopesa el Acuerdo de Reunificación"
 china_sar.047.d: "Pekín ha puesto sobre la mesa el marco final para una reunificación pacífica: Taiwán se reintegraría en la República Popular como una Región Administrativa Especial, conservando su propia administración, sistema legal y economía bajo el modelo de un país, dos sistemas. Tras años de distensión a través del estrecho, el acuerdo queda ahora en manos de Taipéi para su ratificación."
 china_sar.047.a: "Ratificar el acuerdo y reunificarse."
 china_sar.047.b: "La isla no está preparada para esto."
 CHI_calm_hong_kong_protests: "Restaurar el orden en Hong Kong"
 CHI_calm_hong_kong_protests_desc: "Las protestas desatadas por nuestras reformas electorales continúan perturbando la Región Administrativa Especial. Con las fuerzas de seguridad sobre el terreno y la situación estabilizándose, el gobierno central puede proceder a desactivar discretamente los disturbios y devolver la normalidad a Hong Kong."
 CHI_TAI_resend_economic_track: "Renovar propuesta de cooperación: Marco económico"
 CHI_TAI_resend_economic_track_desc: "Taipéi rechazó el acercamiento anterior. Dirigirse de nuevo al gobierno de Taiwán con el marco de cooperación económica a través del estrecho."
