 mercosur.18.d: "[PRU.GetName]과(와) 메르코수르 정회원 가입에 관한 공식 협상이 시작되었습니다. 이는 상징적인 몸짓이 아닙니다. 협상이 성공하면 블록은 공동의 남아메리카 체제 안에 자국의 미래를 두려는 또 하나의 정부를 얻게 됩니다."
