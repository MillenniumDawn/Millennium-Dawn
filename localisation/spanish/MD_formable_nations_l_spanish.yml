l_spanish:
 BLT_form_category: "Unificar los Estados Bálticos"
 BLT_form_category_desc: "Los Estados Bálticos son la unión de estados entre Estonia, Letonia y Lituania. Las tres naciones han sido durante mucho tiempo presa de los depredadores de la geopolítica europea y siguen sufriendo a manos del imperialismo europeo. Luchar contra la influencia y la presión de los benefactores extranjeros es una necesidad y una prioridad máxima. Podemos lograr este objetivo unificando a las naciones y convirtiéndonos en una nación de personas que puedan resistir las presiones de la influencia extranjera y establecerse como un miembro en el escenario mundial, no como un obstáculo en el camino del que puedan abusar otras naciones."
 BLT_integrate_start: "Begin forming [GetBLTNameDef]"
 BLT_integrate_start_desc: "It is time to form the Baltic States.\n\n"
 BLT_integrate_lithuania: "Integrate [GetBLTNameAdj] [LIT.GetAdjective] Territories"
 BLT_integrate_lithuania_desc: "Lithuania is the largest of the three Baltic state nations. It beats the nations of Latvia and Estonia in most earmarks, such as population, GDP, and land area. Integrating this nation will take a considerable amount of resources from our nation, but it will benefit our new Baltic State."
 BLT_integrate_latvia: "Integrate [GetBLTNameAdj] [LAT.GetAdjective] Territories"
 BLT_integrate_latvia_desc: "Letonia es otro Estado báltico. Conecta a Lituania y Estonia y tiene una ubicación estratégica muy importante. Integrar esta nación requerirá una cantidad considerable de recursos de nuestra nación, pero beneficiará a nuestro nuevo Estado báltico."
 BLT_integrate_estonia: "Integrate [GetBLTNameAdj] [EST.GetAdjective] Territories"
 BLT_integrate_estonia_desc: "Estonia es el más pequeño de los tres Estados bálticos, pero posee la costa más extensa de las tres naciones. Su economía se basa principalmente en la dependencia de la costa y de la silvicultura. El pueblo estonio es una increíble incorporación a nuestra nueva gran nación. La integración de esta nación requerirá algunos recursos de nuestra nación, pero aun así beneficiará a nuestro nuevo Estado báltico."
 BLT_update_flag: "Finish Forming [GetBLTNameDef]"
 BLT_update_flag_desc: "With every constituent territory integrated, we can complete our transformation and proclaim [GetBLTNameDef], adopting its unified flag and name."
 FCA_form_category: "Unificar América Central"
 FCA_form_category_desc: "La República Federal de América Central existió a principios del siglo XIX. Fue una unión de estados de los territorios de la antigua Capitanía General de Guatemala de la Nueva España. Estaba compuesta por los países de Costa Rica, El Salvador, Guatemala, Honduras, Nicaragua y partes de México y Belice. Unir la federación será una prueba para las naciones mientras unifican la multitud de ideologías."
