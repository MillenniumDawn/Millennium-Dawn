 SUD.Nat_Fascism_desc: "（伊拉克复兴党）- 苏丹阿拉伯复兴社会党是一个相对较小的政党，但由于受到伊拉克的资助，该党能够发挥与其规模相当的重大影响力。该党主要由在伊拉克学习过的学生组成。"
