 #Zombie Firms: the investigation, the obstruction, and the wind-down
 JAP_zombie_companies_resolved_tt: "Japan's §Yzombie companies§! have been fully wound down"
 JAP_zombie_report_credible_tt: "The investigation produced at least a §Ypartial report§!"
 JAP_zombie_investigation_concluded_tt: "The investigation has §Yconcluded§!, whatever it found"
 JAP_zombie_case_files_up_1_tt: "§YCase Files§!: $RIGHT|+=1$"
 JAP_zombie_case_files_up_2_tt: "§YCase Files§!: $RIGHT|+=2$"
 JAP_zombie_case_files_down_1_tt: "§YCase Files§!: §R-1§!"
 JAP_zombie_case_files_down_2_tt: "§YCase Files§!: §R-2§!"
 JAP_zombie_obstruction_up_2_tt: "§YObstruction§!: §R+2§!"
 JAP_zombie_obstruction_up_5_tt: "§YObstruction§!: §R+5§!"
