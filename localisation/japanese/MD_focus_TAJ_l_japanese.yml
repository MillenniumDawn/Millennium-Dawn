 TAJ_communist_demand: "共産党の要求"
 TAJ_communist_demand_desc: "内戦中にUTOが形成された結果、我々は共産主義者にいくつかの譲歩を約束した……"
 TAJ_islamist_demand: "IRPの要求"
 TAJ_islamist_demand_desc: "内戦中にUTOが形成された結果、我々はIRPにいくつかの譲歩を約束した……"
