 ARM_olympic_comitee: "올림픽 위원회"
 ARM_olympic_comitee_desc: "올림픽 위원회를 모든 면에서 강화하고 지원해야 합니다. 가기크 차루키안은 스스로 운동선수였기에 외면할 수 없습니다."
 ARM_tsaruk_trde: "차루키안의 무역"
 ARM_tsaruk_trde_desc: "차루키안은 매우 경험 많은 무역상입니다. 이 사업을 국유화하는 것이 좋지 않을까요?"
 ARM_utilize_assets: "자산 활용"
 ARM_utilize_assets_desc: "경제의 모든 분야에 더 많은 노력이 필요하더라도, 수입을 늘리기 위해 우리나라의 모든 것을 활용해야 합니다."
 ARM_statue_of_christ: "새로운 그리스도 상"
 ARM_statue_of_christ_desc: "차루키안은 매우 독실한 기독교인입니다. 그는 예수 그리스도의 새로운 상을 세우고 싶어 합니다. 정말 훌륭한 생각입니다!"
 ARM_sport_youth: "스포츠를 즐기는 청년"
 ARM_sport_youth_desc: "아르메니아의 모든 청년은 운동을 즐기고, 강하며, 건강해야 합니다! 이것이 우리의 궁극적인 목표입니다."
 ARM_bet_culture: "내기 문화 수용"
 ARM_bet_culture_desc: "많은 아르메니아인은 맥주를 마시고 스포츠에 내기를 거는 것을 좋아합니다. 이 문화를 지원해야 합니다! 무엇이 문제입니까?"
 ARM_support_peasants: "농촌 인구 지원"
 ARM_support_peasants_desc: "모든 농촌 인구를 지원해야 합니다. 차루키안 본인이 농민 출신이므로 서민들의 어려움을 잘 알고 있습니다."
 ARM_befr_mafia: "마피아와의 우호"
 ARM_befr_mafia_desc: "마피아와 친분을 맺으면 장기적으로 우리의 정치적 목표에 도움이 될 수 있으며, 그들의 네트워크를 국가 권력의 도구로 바꿀 수 있습니다."
 ARM_freedom_for_pes: "농민의 자유"
 ARM_freedom_for_pes_desc: "소규모 농업 생산 사업체에 대한 간섭을 삼가야 합니다. 그들에게 어느 정도의 자유를 주어야 합니다."
 ARM_hire_pmc_wagner: "PMC 와그너 고용"
 ARM_hire_pmc_wagner_desc: "전쟁이 우리 영토를 휩쓸고 있으며, 우리는 조국을 지키기 위해 어떠한 비용도 아끼지 않을 것입니다. 적의 공격을 격퇴하기 위해 러시아와 그 유명한 PMC들에게 도움을 요청할 계획입니다."
 ARM_create_pmc: "황금사자 전사 PMC"
 ARM_create_pmc_desc: "우리는 두둑한 보수를 받고 국가의 이익을 지킬 우리만의 민간 군사 기업도 창설해야 하며, 그 보수는 반드시 지급할 것입니다."
 ARM_sport_development: "스포츠 국가"
 ARM_berkut_troops: "베르쿠트"
 ARM_farmercracy: "농본주의"
 ARM_corporatocracy: "기업 지배 체제"
 ARM_unstable_government_idea: "불안정한 정부"
 arme.73.t: "아르메니아의 그리스도 상"
 arme.73.d: "우리의 웅대한 종교 프로젝트인 예수 그리스도 상이 완공되었습니다. 이제 아르메니아 영토에는 그리스도의 얼굴이 자리하게 되었고, 전 세계의 기독교인이 우리를 찬탄하고 있습니다."
 arme.73.a: "하느님의 도우심으로"
 ARM_Demirchyan: "아르메니아 국민당"
 ARM_Demirchyan_desc: "아르메니아 국민당(아르메니아어: Hayastani Zhoghovrdakan Kusaktsutyun)은 아르메니아의 사회주의 정당입니다. 1974년부터 1988년까지 아르메니아 공산당 제1서기를 지낸 소련 및 아르메니아의 당 간부이자 정치가 카렌 데미르치얀이 창당했습니다. 현재는 그의 아들 스테판 데미르치얀이 당을 이끌고 있습니다."
 ARM_strat_technocrats: "테크노크라트 승진"
 ARM_strat_technocrats_desc: "아르메니아를 우리가 원하는 모습으로 만들려면 정부와 내각을 대대적으로 개혁하여 이전 정부의 아첨꾼들을 몰아내고 젊은 새 전문가들을 영입해야 합니다."
 ARM_reindustr_country: "\\"재건\\"의 되돌림"
 ARM_reindustr_country_desc: "페레스트로이카를 시작한 더러운 고르바초프는 우리나라의 명예를 더럽히고 폐허로 만들어 망쳐 놓았습니다. 사회주의 체제로 다시 재건하고 소련 말기의 끔찍한 나날들을 오랫동안 잊어야 할 때입니다."
 ARM_demirch_gamble: "스테판의 도박"
 ARM_demirch_gamble_desc: "스테판의 사회주의적 견해에도 불구하고, 우리와 같은 외교 노선을 가진 다른 정당 중 하나와 통합하는 것이 정치적으로 유리할 것입니다."
 ARM_legacy_of_father: "아버지의 유산"
 ARM_legacy_of_father_desc: "우리에게는 오직 하나의 구호, 하나의 좌우명이 있습니다. 일하는 모든 사람은 삶의 혜택을 누릴 권리가 있다는 것입니다. 근로 인민의 피를 빨아먹는 기생충들에게서는 이 혜택을 박탈해야 합니다. 그리고 우리는 선언합니다. 모든 것을 노동자에게, 모든 것을 노동자에게!"
 ARM_iron_fisting_oligs: "올리가르히 분쇄"
 ARM_iron_fisting_oligs_desc: "90년대의 비적 무리가 더는 이 나라와 경제를 지배하지 못하도록 해야 합니다!"
 ARM_socialism_with_human_face: "인간의 얼굴을 한 사회주의"
 ARM_socialism_with_human_face_desc: "종교와 사회주의는 결코 적대적이지 않습니다. 소비에트 정부조차도 그 시기에 아르메니아 교회를 허용했습니다. 우리는 교회와 싸울 것이 아니라 교회와 하나가 되어야 합니다!"
 ARM_coalition_with_vazgen_supporters: "바즈겐 지지자들과의 연립"
 ARM_coalition_with_vazgen_supporters_desc: "1999년 의회 습격은 예르크라파와 아르메니아 국민당이 집권하는 것을 막기 위해 특별히 노린 것이었습니다. 바즈겐 사르그샨과 카렌 데미르치얀은 그 습격으로 살해되었습니다. 우리 민족의 번영을 위해 다시 뭉쳐야 합니다!"
 ARM_remember_shaumian: "샤우먄의 전략"
 ARM_remember_shaumian_desc: "샤우먄은 노동 계급과 민족적 결속을 위해 아르메니아 민족주의와 볼셰비즘이 결합된 인상적인 사례였습니다. 우리는 그의 유산을 이어 나가야 합니다."
 ARM_euro_dilemma: "유럽 딜레마"
 ARM_euro_dilemma_desc: "유럽 연합에 대한 우리의 입장을 마침내 정해야 합니다. 우리는 EU에 상당히 호의적이지만, 지정학적 상황이 우리에게 다른 입장을 요구할 수도 있습니다."
 ARM_rebuilding_initiative: "재건 구상"
 ARM_rebuilding_initiative_desc: "레닌은 자본주의의 부활이 러시아 소비에트 연방 사회주의 공화국에 안전하지 않다는 것을 이해했지만, 문제는 그 정도였기에 이를 용인할 만하다고 보았습니다. 그리고 그 정도는 소비에트 스스로 정했습니다. 이로써 경제의 자본주의 부문 성장을 조절할 수 있었습니다. \\"사회주의로 가는 길을 지키기 위해, 우리는 농민들에게 우리가 스스로 판단하는 범위 내에서 일련의 양보를 한다.\\""
 ARM_sov_legacy_cond_dec: "소비에트의 결정 규탄"
 ARM_sov_legacy_cond_dec_desc: "자캅카스 공화국이 수립된 지 한 세기가 지났습니다. 민족주의로 인해 찢어진 이 공화국은 세 개의 국가로 분열되었습니다. 우리는 민족적, 역사적 차이를 잊고, 이웃 나라들이 부르주아 권력을 타도하고 프롤레타리아 독재를 수립하도록 도와야 합니다!"
 ARM_invite_asala: "붉은 팽창"
 ARM_invite_asala_desc: "아르메니아 해방 비밀군(ASALA)은 1975년부터 1990년대까지 활동한 마르크스-레닌주의 무장 조직으로, 튀르키예 정부가 1915년 아르메니아인 학살에 대한 책임을 공개적으로 인정하고, 배상금을 지급하며, 아르메니아인의 고향을 위한 영토를 할양하도록 강제하는 것을 목표로 내세웠습니다. ASALA 자체와 다른 출처들은 이 조직을 게릴라 및 무장 조직으로 묘사했습니다. 우리는 그 발자취를 따라야 합니다."
 ARM_workers_soldiers: "노동자와 군인"
 ARM_workers_soldiers_desc: "우리의 정체성과 민족적 정의에 대한 열망을 경제 정책과 분리할 수 없습니다. 우리는 아르메니아인의 나라이며, 노동자와 군인의 나라입니다!"
 ARM_support_patriotic_movement: "애국 운동 지원"
 ARM_support_patriotic_movement_desc: "우리나라에서 무제한 자본주의를 복원하려는 것이 아닌 모든 애국 운동을 지원해야 합니다."
 ARM_legacy_of_father_idea: "아버지의 유산"
 ARM_legacy_of_father_two_idea: "아버지의 유산"
 ARM_legacy_of_father_three_idea: "아버지의 유산"
 ARM_legacy_of_father_four_idea: "아버지의 유산"
 ARM_christian_humanism_idea: "기독교 휴머니즘"
 ARM_shaumians_thought_idea: "샤우먄 사상"
 ARM_armenia_demirchyan_idea: "데미르치얀의 아르메니아"
 ARM_asala_bases_idea: "ASALA 기지"
 arm_demirchyan.1.t: "군 숙청"
 arm_demirchyan.1.d: "군대 안에는 여전히 코차랸 지지자들로 대표되는 위험한 분자들이 남아 있습니다. 군대에서 이들을 숙청해야 합니다."
 arm_demirchyan.1.a: "좋다."
 arm_demirchyan.2.t: "우리의 고문들"
 arm_demirchyan.2.d: "더 나은 통치를 위해서는 다른 정당들의 조언에 귀를 기울여야 할지도 모릅니다. 남은 것은 어느 정당을 선택할지입니다."
 arm_demirchyan.2.a: "평화와 민주주의가 우리 국민을 이끌어야 한다."
 arm_demirchyan.2.b: "우리는 올바른 사회주의를 지지한다."
 arm_demirchyan.3.t: "§Y[ARM.GetNameWithFlag]§!, ASALA 기지 수용 제안"
 arm_demirchyan.3.d: "§Y[ARM.GetNameWithFlag]§!(이)가 튀르키예로부터 우리의 주권을 지키기 위한 기지를 제공하겠다고 제안하고 있습니다. 그 대가로 반 지역을 그들의 이익 범위에 포함하는 것을 허락해 달라고 요청합니다."
 arm_demirchyan.3.a: "우리는 언제나 전우들의 편이다!"
 arm_demirchyan.3.b: "미안하지만 거절한다."
 arm_demirchyan.4.t: "§Y[KUR.GetNameWithFlag]§!, 우리의 제안 거절"
 arm_demirchyan.4.d: "그들은 우리의 도움이 필요 없다고 말했습니다."
 arm_demirchyan.4.a: "별로군."
 arm_demirchyan.5.t: "ASALA의 부활"
 arm_demirchyan.5.d: "아제르바이잔과 튀르키예에 대한 군사화된 정책으로 알려진 ASALA 그룹이 이제 공식적으로 §Y[ARM.GetNameWithFlag]§!의 안보를 수호하고 있다는 사실이 최근 알려졌습니다."
 arm_demirchyan.5.a: "아, 젠장..."
 arm_demirchyan.5.b: "단순한 정치적 책략일 뿐이다."
 arm_demirchyan.6.t: "우리 정부 편에 선 ASALA"
 arm_demirchyan.6.d: "누구도 잊히지 않고 어떤 것도 잊히지 않습니다. 우리의 ASALA 동맹과 함께라면 §Y[ARM.GetNameWithFlag]§!을(를) 위대한 미래로 이끌 수 있습니다!"
 arm_demirchyan.6.a: "좋다!"
 arm_demirchyan_news.1.t: "[ARM.GetLeader], 공산주의 정권 비판"
 arm_demirchyan_news.1.d: "아르메니아 지도자 [ARM.GetLeader](이)가 세계의 모든 공산주의 정권을 공개적으로 비판했습니다. 그는 이들 정권이 자국의 자원을 비효율적으로 사용하며 경제와 문화를 파괴하고 있다고 말했습니다."
 arm_demirchyan_news.1.a: "사회주의 체제에 대한 타격이다."
 ARM_forced_industrialisation_unlock_tt: "§Y강제 산업화 결정이 열립니다: §Y[ARM.GetNameWithFlag]§!§!"
 arm_demirchyan.8.t: "EU에 대한 우리의 입장"
 arm_demirchyan.8.d: "EU와의 협력을 계속할지 포기할지 결정해야 합니다. 다만 EU와 계속 협력하기로 한다면 그들로부터 어느 정도 이익을 얻을 수 있을 것입니다."
 arm_demirchyan.8.a: "EU에 대표단을 파견한다."
 arm_demirchyan.8.b: "우리에게는 다른 계획이 있다."
 arm_demirchyan.9.t: "§Y[ARM.GetNameWithFlag]§! 대표단, 수도에 도착"
 arm_demirchyan.9.d: "§Y[ARM.GetNameWithFlag]§!은(는) 이념에도 불구하고 우리와 계속 협력하기를 원합니다. 그들의 제안을 받아들이겠습니까?"
 arm_demirchyan.9.a: "그래, 안 될 것 없지."
 arm_demirchyan.9.b: "공산주의자들은 우리가 신경 쓸 가치가 없다."
 arm_demirchyan.10.t: "[FROM.GetNameWithFlag], 수락!"
 arm_demirchyan.10.d: "우리는 그들이 우리와 계속 협력하도록 설득하는 데 성공했습니다."
 arm_demirchyan.10.a: "좋다!"
 arm_demirchyan.11.t: "우리와의 협력 거부"
 arm_demirchyan.11.d: "유감스럽게도 우리의 제안은 그들에게 와닿지 않았습니다."
 arm_demirchyan.11.a: "별로군."
 arm_demirchyan.12.t: "이 땅의 미래"
 arm_demirchyan.12.d: "우리 땅의 미래를 결정할 때입니다. 민족 볼셰비즘과 민주주의적 견해 모두 우리나라에서 인기가 있지만, 최종 결과는 우리에게 달려 있습니다."
 arm_demirchyan.12.a: "민주주의가 우리에게 최선이다."
 arm_demirchyan.12.b: "더 급진적인 길이 우리나라를 더욱 강하게 만들 것이다."
