 arab_mafia_1: "§t통제 불능의§! 아랍 마피아"
 arab_mafia_1_desc: "이스라엘 경찰은 이스라엘 범죄 조직을 점진적으로 해체하는 프로그램을 시작했으나 유대인 조직에만 집중해 왔습니다. 그 사이 아랍인 거주 지역에서는 부족 간, 가문 간 범죄율이 급등하기 시작했고, 요르단강 서안과 요르단에서 막대한 양의 총기가 흘러들어 끝없는 폭력의 순환을 부추기며 죄 없는 이스라엘 아랍인 민간인만 점점 더 많이 희생되고 있습니다.\n§W--------------§!\n아랍 범죄 분기에서 §Y$ISR_learn_from_october_events$§! 또는 §Y$ISR_rely_on_gideonites$§!부터 §Y$ISR_storm_tuba_zangariya$§!에 이르기까지 중점을 하나 완료할 때마다 이 국가 정신은 §G개선§!되며, 해당 분기를 모두 완료하면 §R제거§!됩니다."
 arab_mafia_2: "§O강력한§! 아랍 마피아"
