 attack_helicopter: "Helikopter szturmowy"
 Air_UAV: "Bezzałogowy bojowy statek powietrzny"
 transport_helicopter: "Helikopter transportowy"
 Militia_Bat: "Milicja"
 Militia_Bat_desc: "Kompania milicji pieszej. Jednostki milicji charakteryzują się mniejszą ilością ciężkiego sprzętu i zestawów komunikacyjnych niż normalna piechota. Dzięki temu są bardzo mobilne i skuteczne w trudnym terenie, ale szybko topnieją w płaskim terenie w starciu z opancerzonym przeciwnikiem.\n\n§G Wskazówka Projektanta: Milicja zapewnia tanią linię obrony i zdolność do tłumienia przeciwnika. Jednostki te najlepiej sprawdzają się w miastach, lasach i na wzgórzach, lecz charakteryzują się słabymi parametrami obrony i przełamania, a także są szczególnie podatne na ataki wojsk pancernych oraz walkę w terenie otwartym lub trudnym. §!"
 Mot_Militia_Bat: "Zmotoryzowana milicja"
 Mot_Militia_Bat_desc: "Kompania Milicji z pickupami, a nawet opancerzonymi pojazdami użytkowymi. Jednostki Milicji charakteryzują się mniejszą ilością ciężkiego sprzętu i zestawów komunikacyjnych niż zwykła piechota. Dzięki temu są bardzo mobilni i skuteczni w trudnym terenie, ale szybko topią się na płaskim terenie przeciwko opancerzonemu przeciwnikowi.\n\n§G Wskazówka Projektanta: Zmotoryzowana milicja poświęca część oszczędności na szybkość i większe możliwości tłumienia. Wykorzystuje się ją do mobilnego zapewnienia bezpieczeństwa i niedrogiej eksploatacji na równinach i pustyniach, ale jej słabe statystyki bojowe i kary za trudny teren sprawiają, że jest to słaba jednostka szturmowa. §!"
 L_Inf_Bat: "Lekka piechota"
 L_Inf_Bat_desc: "Kompania Lekkiej Piechoty bez środków transportu. Rzadko spotykana na współczesnym polu bitwy, ale istnieją wyspecjalizowane jednostki do walki w bardzo trudnym terenie, takim jak dżungla i góry - gdzie są bardzo skuteczne. Może przydać się również jako garnizon miejski.\n\n§G Wskazówka projektanta: Lekka piechota zapewnia wysoki poziom organizacji i dużą skuteczność bojową na wzgórzach, w lasach, górach, dżunglach, na bagnach oraz w miastach, nie wymagając przy tym pojazdów. Wykorzystuj ją do utrzymywania pozycji lub atakowania w trudnym terenie, ale licz się z powolnym przemieszczaniem strategicznym oraz słabszymi atakami na równinach i pustyniach. §!"
 Mot_Inf_Bat: "Piechota zmotoryzowana"
 Mot_Inf_Bat_desc: "Kompania piechoty zmotoryzowanej wykorzystuje do transportu różnego rodzaju pojazdy użytkowe – od pickupów po nowoczesne pojazdy odporne na wybuchy min. Zapewniają one szybką mobilność na polu walki w warunkach, w których drogi i otwarty teren sprzyjają przemieszczaniu się pojazdów.\n\n§G Wskazówka projektanta: Piechota zmotoryzowana zapewnia przystępną cenowo szybkość i dobre osiągi w otwartym terenie. Wykorzystuj ją do wykorzystywania przełamań i wspierania szybkich działań na froncie, pamiętając jednak, że jej pojazdy zwiększają zapotrzebowanie na sprzęt i tracą na skuteczności w lasach, górach, dżunglach, na bagnach oraz w miastach. §!"
 Mech_Inf_Bat: "Piechota zmechanizowana"
 Mech_Inf_Bat_desc: "Kompania Piechoty zmechanizowanej jako środek transportu wykorzystuje transportery opancerzone. Świetnie nadają się do walki pancernej na płaskim terenie.\n\n§G Wskazówka projektanta: Piechota zmechanizowana łączy solidną obronę i mobilność zapewnianą przez pojazdy opancerzone z wysoką skutecznością na równinach i pustyniach. Wykorzystuj ją do utrzymywania linii frontu w szybkich formacjach pancernych, pamiętając jednak, że transportery opancerzone są kosztowne, a ich zdolności bojowe i mobilność spadają w lasach, górach, dżunglach oraz miastach. §!"
 Arm_Inf_Bat: "Piechota pancerna"
 Arm_Inf_Bat_desc: "Kompania Piechoty Pancernej wykorzystuje bojowe wozy piechoty jako środek transportu. Dobrze nadają się do walki pancernej na płaskim terenie, ale marnują się w trudnym terenie, gdzie muszą działać pieszo z dala od swoich BWP.\n\n§G Wskazówka projektanta: Piechota pancerna używa bojowych wozów piechoty (BWP) ze względu na większą siłę ognia, opancerzenie i zdolność do przełamania niż piechota zmechanizowana. Używaj ich razem z czołgami w terenie otwartym, ale ich niższa organizacja, wysoki koszt sprzętu oraz wysokie kary za przebywanie w górach, dżungli, na bagnach i w mieście wymagają ostrożnego rozmieszczenia. §!"
 L_Air_Inf_Bat: "Piechota powietrzno-desantowa"
 L_Air_Inf_Bat_desc: "Kompanie lekkiej piechoty powietrznodesantowej to elitarne jednostki, specjalizujące się w desancie z powietrza – zarówno metodą spadochronową z samolotów transportowych, jak i przy użyciu śmigłowców. Są one zdolne do szybkiego reagowania na sytuacje kryzysowe na dużych dystansach oraz mogą zostać przerzucone na tyły wroga w celu opanowania kluczowych obiektów, wyprzedzając tym samym główne siły armii. Wybrany sposób transportu narzuca jednak ścisłe ograniczenia co do ilości przenoszonego przez nie ciężkiego uzbrojenia.\n\n§G Wskazówka projektanta: Piechota powietrznodesantowa łączy wysoki poziom organizacji z możliwością desantu spadochronowego oraz dużą skutecznością w trudnym terenie. Wykorzystuj ją do zajmowania i utrzymywania odizolowanych celów; jednak ze względu na wyszkolenie klasy sił specjalnych oraz zwiększone zapotrzebowanie na sprzęt piechoty, jednostki te są kosztowne w przypadku rutynowych działań na linii frontu. §!"
 Mot_Air_Inf_Bat: "Zmotoryzowana piechota powietrzno-desantowa"
 Mot_Air_Inf_Bat_desc: "Zmotoryzowane kompanie piechoty powietrznodesantowej to elitarne jednostki, specjalnie szkolone w zakresie desantowania drogą powietrzną – zarówno poprzez zrzut spadochronowy z samolotów transportowych, jak i przy użyciu śmigłowców. Są one zdolne do szybkiego reagowania na sytuacje kryzysowe na dużych dystansach oraz mogą zostać przerzucone na tyły wroga w celu opanowania kluczowych obiektów jeszcze przed nadejściem głównych sił. Wykorzystywane przez nie pojazdy wielozadaniowe zapewniają im dużą mobilność po wylądowaniu i umożliwiają zabranie na pole walki większej ilości ciężkiego uzbrojenia; należy jednak pamiętać, że desantowanie tych jednostek wraz z pojazdami wiąże się ze znacznie większymi wyzwaniami logistycznymi.\n\n§G Wskazówka projektanta: Zmotoryzowana piechota powietrznodesantowa zyskuje na szybkości po desancie i sprawdza się w otwartym terenie. Warto ją wykorzystać, gdy siły powietrznodesantowe muszą szybko rozwinąć natarcie lub wzmocnić pozycje; należy jednak pamiętać, że obecność pojazdów zwiększa obciążenie sprzętowe oraz obniża poziom organizacji i skuteczność w trudnym terenie w porównaniu z oddziałami pieszymi. §!"
 Mech_Air_Inf_Bat: "Zmechanizowana piechota powietrzno-desantowa"
 Mech_Air_Inf_Bat_desc: "Zmechanizowane kompanie piechoty powietrznodesantowej to elitarne jednostki, wyspecjalizowane w desantowaniu drogą powietrzną z pokładu samolotów transportowych. Potrafią one błyskawicznie reagować na sytuacje kryzysowe w znacznej odległości i mogą zostać przerzucone na tyły wroga, aby opanować kluczowe cele jeszcze przed nadejściem głównych sił. Dzięki specjalnie zaprojektowanym lekkim transporterom opancerzonym jednostki te zyskują dużą mobilność po wylądowaniu i mogą wprowadzić do walki znacznie więcej ciężkiego uzbrojenia niż typowe, lżejsze oddziały powietrznodesantowe. Jednakże desantowanie ich wraz z takimi pojazdami wiąże się ze znacznie większymi wyzwaniami logistycznymi.\n\n§G Wskazówka projektanta: Zmechanizowana piechota powietrznodesantowa zapewnia desantowi ochronę (dzięki transporterom opancerzonym), szybkość oraz większą siłę ognia. Warto po nią sięgnąć, gdy odizolowane siły powietrznodesantowe muszą przetrwać walkę manewrową po wylądowaniu; jednak niższa organizacja, duże zapotrzebowanie na sprzęt oraz dotkliwe kary za walkę w trudnym terenie czynią z niej kosztowny, specjalistyczny wybór.§!"
 Arm_Air_Inf_Bat: "Pancerna piechota powietrzno-desantowa"
 Arm_Air_Inf_Bat_desc: "Pancerne Kompanie Piechoty Powietrznodesantowej to elitarne jednostki, wyspecjalizowane w desantowaniu drogą powietrzną z pokładu samolotów transportowych. Potrafią one błyskawicznie reagować na sytuacje kryzysowe w znacznej odległości i zostać przerzucone na tyły wroga w celu opanowania kluczowych obiektów, wyprzedzając tym samym główne siły armii. Specjalnie zaprojektowane lekkie bojowe wozy piechoty zapewniają im dużą mobilność i pozwalają na równorzędną walkę ze standardowymi formacjami zmechanizowanymi. Jednakże desantowanie tych jednostek wraz z ich pojazdami wiąże się z ogromnymi wyzwaniami logistycznymi. Według stanu na 2017 rok, jedynie Rosja dysponowała tego typu siłami.\n\n§G Wskazówka projektanta: Pancerna Piechota Powietrznodesantowa zapewnia siłę ognia bojowego wozu piechoty, pancerz i możliwość przełamania poprzez zrzut spadochronowy. Używaj jej do atakowania bronionych celów lub walki z mobilnymi rezerwami wroga po wkroczeniu na pole bitwy, ale jej bardzo duże obciążenie sprzętem, niska organizacja i kary za trudny teren sprawiają, że straty są kosztowne. §!"
 L_Marine_Bat: "Piechota morska"
 L_Marine_Bat_desc: "Kompania piechoty morskiej to elitarna jednostka piechoty, specjalnie szkolona do działań desantowych, takich jak forsowanie rzek, operacje na terenach podmokłych czy desanty morskie. Ponieważ żołnierze ci nie dysponują pojazdami, istnieją ścisłe ograniczenia dotyczące ilości przenoszonego przez nich ciężkiego sprzętu.\n\n§G Wskazówka projektanta: Piechota morska zapewnia wysoki poziom organizacji oraz dużą skuteczność w działaniach desantowych i na terenach podmokłych, nie generując przy tym kosztów związanych z pojazdami. Wykorzystuj ją do tworzenia przyczółków i walki na mokradłach; pamiętaj jednak, że po desancie jednostki te poruszają się wolniej, zużywają limit sił specjalnych i są mniej efektywne w otwartym terenie. §!"
 Mot_Marine_Bat: "Zmotoryzowana piechota morska"
 Mot_Marine_Bat_desc: "Zmotoryzowane kompanie piechoty morskiej to elitarne jednostki piechoty, specjalnie szkolone do działań desantowych i operacji w trudnym terenie, takich jak forsowanie rzek, walka na terenach podmokłych czy desanty morskie. Choć do walki pieszej przystępują jako lekka piechota, dysponują pojazdami wielozadaniowymi służącymi do transportu lądowego, co zapewnia im dużą mobilność i pozwala zabrać na pole bitwy znaczne ilości ciężkiego uzbrojenia.\n\n§G Wskazówka projektanta: Zmotoryzowana piechota morska zachowuje silny bonus do desantu, jednocześnie zwiększając prędkość, co umożliwia szybką ekspansję z przyczółka. Używaj jej, gdy siły desantowe muszą szybko przemieszczać się w głąb lądu, ale jej pojazdy kosztują więcej sprzętu i obniżają Organizację oraz skuteczność w górach w porównaniu z piechotą morską. §!"
 Mech_Marine_Bat: "Zmechanizowana piechota morska"
 Mech_Marine_Bat_desc: "Kompania zmechanizowanej piechoty morskiej to elitarna formacja, specjalnie szkolona do działań desantowych, w tym forsowania rzek, operowania na terenach podmokłych oraz przeprowadzania desantów morskich. Dzięki temu, że desantują się pod osłoną specjalnie zaprojektowanych pływających transporterów opancerzonych, są doskonale przygotowane do natychmiastowego uderzenia przy zachowaniu dużej mobilności i możliwości wprowadzenia do walki znacznych ilości ciężkiego uzbrojenia.\n\n§G Wskazówka projektanta: Zmechanizowani marines łączą premię do desantu z ochroną Transporterów Opancerzonych (APC) i dużą mobilnością po lądowaniu. Używaj ich do rozbudowy i utrzymania zmechanizowanych przyczółków, ale mają gorszą organizację niż lżejsi marines, a ich pojazdy słabo radzą sobie w lasach i górach. §!"
 Arm_Marine_Bat: "Pancerna piechota morska"
 Arm_Marine_Bat_desc: "Kompanie zmechanizowanej piechoty morskiej to elitarne jednostki piechoty, specjalnie szkolone do działań desantowych i operacji w środowisku wodno-lądowym, takich jak forsowanie rzek, walka na terenach podmokłych czy desanty morskie. Są one w stanie pokonywać znaczne odległości drogą wodną, ​​korzystając z silnie opancerzonych, odrzutowych bojowych wozów piechoty przystosowanych do pływania, a po dotarciu do brzegu – z wielką wprawą przystępować do walki bezpośrednio z pokładu tych pojazdów.\n\n§G Wskazówka projektanta: Pancerni marines zapewniają najsilniejszą siłę ognia bojowych wozów piechoty morskiej, największą siłę pancerza i największą zdolność do walki w mieście wśród piechoty morskiej, zachowując jednocześnie premię do desantu. Używaj ich przeciwko silnie bronionym portom, ale ich niska organizacja, wysoki koszt oraz wysokie kary za góry i dżunglę wymagają lżejszych jednostek do walki w trudnym terenie śródlądowym. §!"
 L_Air_assault_Bat: "Piechota Powietrznodesantowa"
 L_Air_assault_Bat_desc: "Kompania Piechoty Powietrznodesantowej to elitarna piechota, która dzięki specjalnemu wyszkoleniu w zjazdach na linie i transporcie lotniczym, posiada sprzęt, który jest czasami projektowany lub modyfikowany w terenie, aby umożliwić lepszy transport samolotami. Kompanie są często wykorzystywane do zdobywania i utrzymywania kluczowego terenu, który nie został w pełni zabezpieczony, oraz do bezpośredniego ataku na siły wroga za liniami wroga.\n\n§G Wskazówka projektanta: Piechota desantowo-szturmowa wykorzystuje śmigłowce transportowe do szybkich operacji i zyskuje premie bojowe w najtrudniejszym terenie. Wykorzystuj ją do zajmowania odległych wzgórz, lasów, gór, dżungli, bagien czy miast; pamiętaj jednak, że niska siła, słabe zdolności fortyfikacyjne oraz kosztowne śmigłowce sprawiają, iż długotrwała walka w linii frontu jest ryzykowna. §!"
 attack_helo_bat: "Eskadra śmigłowców szturmowych"
 attack_helo_bat_desc: "Eskadry śmigłowców uderzeniowych koncentrują siły maszyn bojowych w celu przeprowadzania szybkich uderzeń przeciwpancernych oraz zapewnienia bezpośredniego wsparcia na szerokim froncie.\n\n§G Wskazówka projektanta: Śmigłowce szturmowe zapewniają szybką, opancerzoną siłę ognia i potężne uderzenia na równinach oraz pustyniach. Wykorzystuj je do wspierania przełamań lub zwalczania jednostek pancernych w otwartym terenie; pamiętaj jednak, że bardzo niska organizacja i siła, wysoki koszt jednostek oraz słaba skuteczność w miastach, górach, lasach i dżunglach sprawiają, że prowadzenie nimi długotrwałych walk jest ryzykowne. §!"
 attack_helo_comp: "Eskadra śmigłowców szturmowych"
 attack_helo_comp_desc: "Klucz śmigłowców szturmowych zapewnia oddziałom pierwszej linii szybkie wsparcie ogniowe oraz mobilną siłę ognia do zwalczania celów opancerzonych.\n\n§G Wskazówka projektanta: Lot śmigłowca szturmowego zapewnia szybką, opancerzoną siłę ognia bez szerokości bojowej. Można go używać jako elastycznego wsparcia dla piechoty, jednostek mobilnych, pancernych lub dywizji piechoty morskiej, ale siły lotnicze i sprzęt dowodzenia są drogie, a w miastach i dżunglach atakuje on mniej skutecznie. §!"
 Special_Forces: "Siły operacji specjalnych"
 Special_Forces_desc: "Siły operacji specjalnych to elita wszystkich sił zbrojnych, w których działają, przeszkolona dłużej i ciężej niż ktokolwiek inny. Są ekspertami w trudnych terenach, operacjach powietrzno-desantowych i desantach desantowych. Są jednak bardzo słabo wyposażeni, ponieważ być może będą musieli działać mobilnie za liniami frontu.\n\n§G Wskazówka projektanta: Siły Specjalne zapewniają wyjątkowe premie do organizacji, regeneracji i walki w różnorodnym terenie, a także oferują możliwość desantu powietrznego oraz ewakuacji drogą morską. Wykorzystuj je do najtrudniejszych rajdów i walk o kluczowe cele; jednak ze względu na dużą szerokość frontu, bardzo długi czas szkolenia, limity liczebności oraz lekkie uzbrojenie nie nadają się one do roli zwykłej piechoty liniowej. §!"
 armor_Bat: "Kompania czołgów"
 armor_Bat_desc: "Kompania pancerna dysponuje wyłącznie najlepiej opancerzonymi pojazdami – czołgami podstawowymi. Dzięki doskonałej mobilności w terenie płaskim oraz potężnej sile ognia bezpośredniego, maszyny te są stworzone do przełamywania linii frontu przeciwnika, co pozwala na szybkie wykorzystanie wyłomu przez kolejne pododdziały piechoty zmechanizowanej.\n\n§G Wskazówka Projektanta: Czołgi zapewniają wysokie wartości pancerza i przełamania oraz dużą siłę ognia przeciwko celom opancerzonym, a także korzystają z doskonałych premii w terenie równinnym i na pustyniach. Sprawdzają się jako siła uderzeniowa dywizji ofensywnych, jednak wymagają kosztownego sprzętu pancernego i dowodzenia, charakteryzują się niską organizacją oraz otrzymują znaczne kary do skuteczności w lasach, górach, dżunglach, na bagnach i w miastach. §!"
 armor_Comp: "Pluton czołgów"
 armor_Comp_desc: "Pluton czołgów składa się wyłącznie z najciężej opancerzonych pojazdów, jakie istnieją, czyli czołgów podstawowych. Dzięki doskonałej mobilności na płaskim terenie i zaciekłemu bezpośredniemu ogniowi, są przeznaczone do wybijania dziur w liniach frontu wroga, które mogą zostać szybko wykorzystane przez kolejne jednostki piechoty zmechanizowanej.\n\n§G Wskazówka Projektanta: Pluton czołgów dodaje pancerz, przełamanie i mobilną siłę ognia bez szerokości bojowej. Używaj go do usztywniania odpowiednich formacji piechoty lub mobilnych do walki na otwartym terenie, ale jego czołgi i sprzęt dowodzenia są kosztowne, a ponadto spowalnia i słabo atakuje w górach, dżunglach i bagnach. §!"
 L_Recce_Comp: "Pluton Lekkiej Piechoty Rozpoznawczej"
 L_Recce_Comp_desc: "Kompanie rozpoznawcze lekkiego odbioru działają w szyku pieszym, przez co są pozbawione znacznej części ciężkiego uzbrojenia, które czyni z nich skuteczną jednostkę bojową. Przenikają one w pobliże sił przeciwnika, aby obserwować i raportować jego działania, wykorzystując do gromadzenia danych wywiadowczych zarówno rozpoznanie z użyciem dronów, jak i środki nadzoru elektronicznego. Mogą również przeprowadzać ograniczone wypady i zasadzki. Kompanie te często określa się mianem „szwadronów”, co stanowi nawiązanie do ich rodowodu wywodzącego się z dawnych jednostek kawalerii.\n\n§G Wskazówka Projektanta: Jednostka rozpoznania piechoty zapewnia rozpoznanie i inicjatywę bez zwiększania szerokości frontu, oferując jednocześnie niewielkie premie w lasach, górach, dżunglach i na wzgórzach. Sprawdza się w dywizjach piechoty, powietrznodesantowych, aeromobilnych, piechoty morskiej oraz sił specjalnych, jednak wymaga więcej siły żywej niż inne jednostki rozpoznawcze i zapewnia znikomą siłę ognia. §!"
 Mot_Recce_Comp: "Zmotoryzowany Pluton Rozpoznawczy"
 Mot_Recce_Comp_desc: "Zmotoryzowane kompanie rozpoznawcze wykorzystują pojazdy wielozadaniowe i dysponują w dużej mierze takim samym wyposażeniem, jak ich odpowiedniki w piechocie. Pełnią jednak odmienne funkcje: przenikają w pobliże sił przeciwnika, by obserwować i raportować jego działania, a do gromadzenia danych wywiadowczych wykorzystują zarówno rozpoznanie z użyciem dronów, jak i środki rozpoznania elektronicznego. Mogą również przeprowadzać ograniczone wypady i zasadzki. Kompanie te często określa się mianem „szwadronów”, co nawiązuje do ich rodowodu wywodzącego się z dawnych jednostek kawalerii.\n\n§G Wskazówka Projektanta: Zmotoryzowane Kompanie Rozpoznawcze zapewniają lepsze Rozpoznanie i Inicjatywę niż zwiad pieszy, jednocześnie dorównując formacjom mobilnym i zwiększając mobilność w otwartym terenie. Używaj ich w dywizjach zmotoryzowanych lub morskich, ale Pojazdy Użytkowe zwiększają koszt i spowalniają w górach, dżungli i na bagnach.§!"
 Mech_Recce_Comp: "Zmechanizowany Pluton Rozpoznawczy"
 Mech_Recce_Comp_desc: "Zmechanizowane kompanie rozpoznawcze współpracują z Transporterami Opancerzonymi i mają w dużej mierze ten sam sprzęt, co ich odpowiedniki w piechocie. Ich role są jednak inne. Infiltrują blisko wroga, aby obserwować i raportować jego działania, a także korzystają z rozpoznania dronów i nadzoru elektronicznego w celu gromadzenia informacji wywiadowczych. Mogą także przeprowadzać ograniczone naloty i zasadzki. Kompanie zwiadowcze są często nazywane „Szwadronami” ze względu na ich dziedzictwo jako byłych jednostek kawalerii.\n\n§G Wskazówka projektanta: Zmechanizowana Kompania Rozpoznawcza zapewnia wysoki poziom Rozpoznania i Inicjatywy bez szerokości pola walki, jednocześnie dorównując formacjom transporterów opancerzonych i poprawiając ruch na równinach. Używaj jej w dywizjach pancernych lub piechoty morskiej, ale koszt Transporterów Opancerzonych i sprzętu wsparcia jest wysoki, a w górach i na bagnach przemieszczają się wolniej. §!"
 Arm_Recce_Comp: "Ciężka Zmechanizowany Pluton Rozpoznawczy"
 Arm_Recce_Comp_desc: "Ciężkie Zmechanizowane kompanie rozpoznawcze współpracują z Bojowymi Wozami Piechoty i mają w dużej mierze taki sam sprzęt, jak ich odpowiedniki piechoty pancernej. Ich role są jednak inne. Infiltrują blisko wroga, aby obserwować i raportować jego działania, a także korzystają z rozpoznania dronów i nadzoru elektronicznego w celu gromadzenia informacji wywiadowczych. Potrafią także przeprowadzać napady i zasadzki. Kompanie zwiadowcze są często nazywane „szwadronami” ze względu na ich dziedzictwo jako byłych jednostek kawalerii.\n\n§G Wskazówka projektanta: Ciężkie zmechanizowane jednostki rozpoznawcze zapewniają wysoki poziom rozpoznania i inicjatywy, oferując jednocześnie ochronę typową dla bojowych wozów piechoty (BWP) i nie zajmując szerokości frontu. Używaj ich w dywizjach pancernych lub piechoty morskiej operujących na równinach i pustyniach, ale bojowe wozy piechoty są drogie, a poruszanie się w lasach, górach, dżunglach i bagnach jest utrudnione. §!"
 L_arm_Bat: "Kompania czołgów lekkich"
 L_arm_Bat_desc: "Kompanie czołgów lekkich operują specjalnymi, często kołowymi czołgami lekkimi, które łączą w sobie niesamowitą mobilność z budzącą podziw siłą hamowania. Mogą stawić czoła wszystkim typom piechoty w bezpośredniej walce. Jednak bezpośrednia walka nie jest ich zamierzoną rolą – infiltrują blisko wroga, aby obserwować i raportować jego działania, a także korzystają zarówno z rozpoznania dronów, jak i nadzoru elektronicznego, aby zebrać informacje wywiadowcze. Mogą także przeprowadzać naloty i zasadzki na ważne zasoby wroga i formacje zmechanizowane.\n\n§G Wskazówka projektanta: Czołgi lekkie zapewniają szybką, opancerzoną siłę ognia i silne ataki na równinach i pustyniach. Używaj ich do rozpoznania siłowego i operacyjnego, ale ich opancerzenie i bezpośrednia siła bojowa są mniejsze, a trudny teren znacznie zmniejsza ich skuteczność. §!"
 armor_Recce_Comp: "Pancerny Pluton Rozpoznawczy"
 armor_Recce_Comp_desc: "Pancerne Plutony Rozpoznawcze korzystają ze specjalnych lekkich czołgów zwiadowczych, które łączą w sobie niesamowitą mobilność z budzącą podziw siłą hamowania. Mogą stawić czoła wszystkim typom piechoty w bezpośredniej walce. Jednak bezpośrednia walka nie jest ich zamierzoną rolą – infiltrują blisko wroga, aby obserwować i raportować jego działania, a także korzystają zarówno z rozpoznania dronów, jak i nadzoru elektronicznego, aby zebrać informacje wywiadowcze. Mogą także przeprowadzać naloty i zasadzki na ważne zasoby wroga i formacje zmechanizowane. Kompanie zwiadowcze są często nazywane „eskadrami” ze względu na ich dziedzictwo jako byłych jednostek kawalerii.\n\n§G Wskazówka projektanta: Rozpoznanie pancerne zapewnia najwyższy poziom rozpoznania i inicjatywy wśród konwencjonalnych zwiadowców, jednocześnie zwiększając mobilność przeciwpancerną bez szerokości bojowej. Używaj go w formacjach czołgów na otwartym terenie, ale czołgi rozpoznawcze i sprzęt dowódczy są kosztowne, a ruchomość znacznie spada w lasach, górach, dżunglach i na mokradłach. §!"
 L_Engi_Comp: "Kompania inżynieryjna"
 L_Engi_Comp_desc: "Inżynierowie zajmują się budową tymczasowych mostów i umocnień obwodowych, stawianiem oraz usuwaniem pól minowych, a także neutralizacją ładunków wybuchowych. Do celów obronnych są wyposażeni w podstawową broń piechoty.\n\n§G Wskazówka projektanta: Kompanie inżynieryjne poprawiają okopywanie się, pomagają piechocie w ataku i obronie w fortach, miastach, lasach i na bagnach oraz usprawniają obronę i ruch w górach. Używaj ich w dywizjach obronnych lub terenowych, ale zwiększają one szerokość pola walki, siłę roboczą i wyposażenie, wnosząc jednocześnie niewielką bezpośrednią siłę ognia. §!"
 H_Engi_Comp: "Ciężka kompania Inżynieryjna"
 H_Engi_Comp_desc: "Inżynierowie zajmują się budową tymczasowych mostów i umocnień obwodowych, stawianiem oraz usuwaniem pól minowych, a także neutralizacją ładunków wybuchowych. Do celów obronnych wykorzystują standardowe uzbrojenie piechoty. Dzięki specjalistycznym pojazdom inżynieryjnym i ewakuacyjnym są dobrze przygotowani do odzyskiwania z linii frontu sprzętu wyłączonego z walki.\n\n§G Wskazówka projektanta: Ciężkie kompanie inżynieryjne zapewniają lepsze okopanie oraz większe premie do walki w fortyfikacjach, na terenach miejskich, górskich i bagnistych niż standardowe jednostki inżynieryjne. Warto włączać je do kluczowych formacji szturmowych lub obronnych, jednak ze względu na duże zapotrzebowanie na ludzi i sprzęt stanowią one kosztowny element wsparcia. §! "
 Arty_Bat: "Bateria Artylerii"
 Arty_Bat_desc: "Dzięki swoim potężnym zdolnościom ognia pośredniego artyleria zapewnia trwałe, precyzyjne uderzenia tam, gdzie jest to potrzebne na polu bitwy, a także daleko poza zasięgiem wzroku. Może zostać przeładowany bezpośrednio przez załogę. Ponieważ do swojego ruchu potrzebuje zewnętrznych pojazdów, poruszanie się pomiędzy atakami może być trudne, co czyni go podatnym na kontrataki artylerii wroga. Lekkie systemy mniejszego kalibru można przeciągać ręcznie i nadają się do operacji powietrznych, ponieważ mieszczą się w samolotach transportowych.\n\n§G Wskazówka projektanta: Bateria artylerii zapewnia znaczny atak przeciwko celom miękkim i może być zrzucana drogą powietrzną, co czyni ją skuteczną w walce z siłami opartymi na piechocie. Warto ją wykorzystać do wzmocnienia siły ognia oddziałów pieszych, jednak niska organizacja i siła, zwiększona szerokość frontu oraz kary do ruchu w trudnym terenie sprawiają, że do jej ochrony niezbędne jest wsparcie piechoty. §!"
 Arty_Battery: "Pluton Artylerii"
 Arty_Battery_desc: "Dzięki swoim potężnym zdolnościom ognia pośredniego artyleria zapewnia trwałe, precyzyjne uderzenia tam, gdzie jest to potrzebne na polu bitwy, a także daleko poza zasięgiem wzroku. Może zostać przeładowany bezpośrednio przez załogę. Ponieważ do swojego ruchu potrzebuje zewnętrznych pojazdów, poruszanie się pomiędzy atakami może być trudne, co czyni go podatnym na kontrataki artylerii wroga. Lekkie systemy mniejszego kalibru można przeciągać ręcznie i nadają się do operacji powietrznych, ponieważ mieszczą się w samolotach transportowych.\n\n§G Wskazówka projektanta: Pluton artylerii dodaje atak miękki bez szerokości bojowej, przy znacznie niższym koszcie wyposażenia niż pełna bateria artylerii. Można go używać jako ekonomicznego wsparcia ogniowego dla kwalifikujących się formacji pieszych, ale bardzo niska Organizacja i kary za trudny teren ograniczają jego wartość w dywizjach nieposiadających wsparcia lub wysoce mobilnych. §!"
 SP_Arty_Bat: "Bateria Artylerii Samobieżnej"
 SP_Arty_Bat_desc: "Dzięki swoim potężnym zdolnościom ognia pośredniego artyleria samobieżna zapewnia trwałe, precyzyjne uderzenia tam, gdzie jest to potrzebne na polu bitwy, a także daleko poza zasięgiem wzroku. Załoga może go przeładować bezpośrednio, a dzięki własnemu napędowi jest mobilny, dzięki czemu może poruszać się, aby uniknąć kontrataków artylerii wroga.\n\n§G Wskazówka projektanta: Bateria artylerii samobieżnej zapewnia dużą siłę ognia przeciwko jednostkom miękkim dotrzymując kroku formacjom pancernym i świetnie sprawdzając się na równinach. Wykorzystuj ją do przełamywania linii obsadzonych przez liczną piechotę, pamiętając jednak, że niska organizacja, zwiększona szerokość frontu, kosztowne podwozie oraz kary za walkę w trudnym terenie wymagają zapewnienia osłony pancernej i otwartej przestrzeni. §!"
 SP_Arty_Battery: "Pluton Baterii Samobieżnej"
 SP_Arty_Battery_desc: "Dzięki swoim potężnym zdolnościom ognia pośredniego artyleria samobieżna zapewnia ciągłe, precyzyjne uderzenia tam, gdzie jest to potrzebne na polu bitwy, a także daleko poza zasięgiem wzroku. Załoga może go przeładować bezpośrednio, a dzięki własnemu napędowi jest mobilny, dzięki czemu może poruszać się, aby uniknąć kontrataków artylerii wroga.\n\n§G Wskazówka projektanta: Pluton artylerii samobieżnej zapewnia mobilny atak przeciwko celom miękkim (Soft Attack), nie zajmując przy tym szerokości frontu. Wykorzystuj go jako kompaktowe wsparcie ogniowe dla jednostek zmechanizowanych, pancernych, piechoty morskiej lub milicji; pamiętaj jednak, że specjalistyczne podwozie jest droższe od holowanych dział i gorzej radzi sobie w terenie górskim, dżungli oraz na bagnach. §!"
 SP_R_Arty_Bat: "Bateria Artylerii Rakietowej"
 SP_R_Arty_Bat_desc: "Bateria artylerii rakietowej wyposażona w wyrzutnie MLRS potrafi całkowicie zniszczyć dany obszar, prowadząc ogień z dużej odległości. System ten jest wykorzystywany do rażenia zaplecza przeciwnika, gdyż ze względu na brak precyzji nie nadaje się do punktowych uderzeń na polu walki. Wymaga specjalistycznych pojazdów do przeładowania, a sam proces uzupełniania amunicji jest czasochłonny.\n\n§G Wskazówka projektanta: Bateria MLRS zapewnia bardzo wysoki poziom ataku miękkiego i przebicia, a jednocześnie dopasowuje się do mobilnych formacji na otwartym terenie. Używaj jej do skoncentrowanej siły ognia ofensywnego, ale ma niską organizację, zwiększa szerokość pola walki, wymaga drogich pojazdów rakietowych i słabo radzi sobie w górach, dżungli, na bagnach i w miastach. §!"
 SP_R_Arty_Battery: "Pluton Artylerii Rakietowej"
 SP_R_Arty_Battery_desc: "Używając wyrzutni MLRS, pluton artylerii rakietowej może zniszczyć obszary z dużej odległości. Używany przeciwko tyłom wroga, ponieważ masowy ogień sprawia, że ​​nie nadaje się do precyzyjnych uderzeń na polu bitwy. Potrzebuje specjalnych pojazdów do przeładunku, a czas przeładowania jest powolny.\n\n§G Wskazówka projektanta: Pluton Artylerii Rakietowej dodaje silny, mobilny atak miękki i trochę przełamania bez szerokości bojowej. Używaj go do zwartego wsparcia ofensywnego w dywizjach mobilnych lub pancernych, ale pojazdy rakietowe są drogie, oferują niewielką wytrzymałość i tracą mobilność w górach i na bagnach. §!"
 SP_AA_Bat: "Samobieżna bateria przeciwlotnicza"
 SP_AA_Bat_desc: "Wykorzystując samobieżne systemy rakiet przeciwlotniczych krótkiego i średniego zasięgu, Bateria Obrony Powietrznej będzie bronił swojej jednostki przed atakami bliskiego wsparcia powietrznego wroga.\n\n§G Wskazówka projektanta: Samobieżna Obrona Powietrzna zapewnia wysoką skuteczność ataku powietrznego i mobilną ochronę dla formacji pancernych. Używaj jej, gdy samoloty wroga zagrażają cennym czołom, ale zwiększa szerokość pola walki, kosztuje specjalistyczne pojazdy, zapewnia niewielką siłę ognia naziemnego i słabo radzi sobie w górach, dżungli i na bagnach. §!"
 SP_AA_Battery: "Samobieżny pluton przeciwlotniczy"
 SP_AA_Battery_desc: "Wykorzystując samobieżne systemy rakiet przeciwlotniczych krótkiego i średniego zasięgu, Pluton Obrony Powietrznej będzie bronić swojej jednostki przed atakami bliskiego wsparcia powietrznego wroga.\n\n§G Wskazówka projektanta: Samobieżny pluton obrony powietrznej dodaje mobilny atak powietrzny bez szerokości bojowej. Używaj go do ochrony mobilnych, pancernych lub morskich dywizji pod wrogim niebem, ale jego specjalistyczne podwozie ma niewielką wartość przeciwko wojskom lądowym i jest mniej mobilne w górach i na bagnach. §!"
 combat_service_support_company: "Batalion Zabezpieczenia Bojowego"
 combat_service_support_company_desc: "Personel logistyczny i medyczny dywizji koordynuje dystrybucję zaopatrzenia, ewakuację poszkodowanych oraz napływ uzupełnień.\n\n§G Wskazówka projektanta: Wsparcie Służby Bojowej zmniejsza zużycie zaopatrzenia i paliwa, jednocześnie chroniąc siłę roboczą i doświadczenie jednostki poprzez regenerację poległych. Używaj go w dużych, doświadczonych lub potrzebujących zaopatrzenia dywizjach, ale zwiększa szerokość pola walki i wyposażenie, jednocześnie znacznie obniżając statystyki bezpośredniej walki. §!"
 helicopter_combat_service_support: "Eskadra Wsparcia Bojowego Śmigłowców"
 helicopter_combat_service_support_desc: "Transportowane śmigłowcami zespoły logistyczne i medyczne zapewniają wsparcie siłom szybko przerzucanym w rejon działań oraz prowadzą ewakuację rannych z wysuniętych pozycji.\n\n§G Wskazówka projektanta: Wsparcie bojowe śmigłowców zapewnia skuteczniejszą ewakuację rannych oraz większe oszczędności w zaopatrzeniu i paliwie przy mniejszej liczbie ludzi niż wsparcie naziemne. Używaj go w przypadku kosztownego transportu powietrznego lub szybkich formacji, ale śmigłowce transportowe są drogie, zwiększają szerokość pola walki, a ich wkład w walkę jest minimalny. §!"
 L_Marine_Cdo_Bat: "Komandosi Morscy"
 L_Marine_Cdo_Bat_desc: "Kompania Komandosów Morskich to większe formacje piechoty morskiej, wyszkolone do prowadzenia operacji typu „uderz i uciekaj” oraz innych zadań lekkiej piechoty.\n\n§G Wskazówka projektanta: Komandosi morscy łączą wysoką Organizację z doskonałymi zdolnościami do ataków desantowych oraz walki na terenach podmokłych, leśnych i zurbanizowanych. Wykorzystuj ich do elitarnych rajdów i desantów w warunkach oporu przeciwnika, jednak ich status jednostek specjalnych, długi czas szkolenia, lekkie uzbrojenie oraz słabsza skuteczność w otwartym terenie ograniczają możliwość ich masowego użycia. §!"
 air_assault_Arty_Battery: "Pluton artylerii powietrznodesantowej"
 air_assault_Arty_Battery_desc: "Jednostki te, wyposażone w artylerię holowaną, zwiększają swoją mobilność poprzez transport dział w podwieszeniu zewnętrznym, co pozwala im dotrzymać kroku szybszym pododdziałom piechoty powietrznodesantowej.\n\n§G Wskazówka projektanta: Pluton artylerii powietrzno-mobilnej dodaje atak miękki bez szerokości bojowej i najlepiej sprawdza się na wzgórzach, w górach, lasach, dżunglach i miastach. Można go używać jako kompaktowego wsparcia ogniowego dla formacji powietrzno-mobilnych lub morskich, ale śmigłowce i artyleria są kosztowne, a na równinach i pustyniach działa słabiej. §!"
 drone_tactical_company: "Pluton dronów FPV"
 drone_tactical_company_desc: "Wykorzystując drony FPV – zarówno płatowce, jak i wielowirnikowce – jednostki te prowadzą rozpoznanie oraz przeprowadzają precyzyjne uderzenia, wspierając pododdziały liniowe.\n\n§G Wskazówka projektanta: Jednostka dronów FPV zapewnia skuteczne możliwości atakowania celów miękkich i twardych, nie zajmuje szerokości frontu i może być desantowana z powietrza. Wykorzystuj ją do zapewnienia elastycznego wsparcia ogniowego w dywizjach zdolnych do zaopatrywania dronów naziemnych; pamiętaj jednak, że jednostka ta praktycznie nie posiada organizacji i wymaga znacznych zasobów sprzętowych, by utrzymać się w walce. §!"
 group_headquarters_title: "Jednostki Dowództwa Sztabowego"
 arm_inf_hq: "Dowództwo piechoty zmechanizowanej"
 arm_inf_hq_desc: "Komponent dowodzenia dla piechoty zmechanizowanej i pancernej."
 arm_hq: "Opancerzone stanowisko dowodzenia"
 arm_hq_desc: "Komponent dowodzenia dla czołgów lekkich i czołgów podstawowych"
 L_Ranger_Bat: "Komandosi (Rangersi)"
 L_Ranger_Recce_Comp: "Pluton Rozpoznawczy Komandosów"
 group_headquarters_title_desc: "Pododdziały dowodzenia, wyposażone do prowadzenia oddziałów do walki"
 light_inf_hq: "Dowództwo lekkiej piechoty"
 light_inf_hq_desc: "Komponent dowodzenia dla piechoty lekkiej i zmotoryzowanej"
 helo_hq: "Dowództwo oddziałów śmigłowcowcyh"
 helo_hq_desc: "Komponent dowodzenia dla pododdziałów śmigłowcowych"
 group_light_bat_title: "Jednostki z brakami kadrowo-sprzętowymi"
 group_light_bat_title_desc: "Elementy bojowe o niewystarczającej liczebności, zaprojektowane w celu zwielokrotnienia siły, o zmniejszonych możliwościach, ale przy zmniejszonym czasie szkolenia i kosztach."
 Light_Mech_Inf_Bat: "Niepełnostanowy Batalion Piechoty Zmechanizowanej"
 Light_Mech_Inf_Bat_desc: "Pododdział zmechanizowany o niepełnym stanie osobowym wykorzystuje niewielką liczbę transporterów opancerzonych do wzmocnienia ugrupowania, nie zajmując przy tym typowej szerokości frontu.\n\n§G Wskazówka projektanta: Piechota zmechanizowana o zbyt małej sile zapewnia ochronę i obronę transporterów opancerzonych bez szerokości bojowej. Używaj jej do wzmocnienia odpowiednich formacji na równinach, wzgórzach lub w miastach, ale jej koszt pojazdu, niska siła oraz wysokie kary za góry, dżunglę, bagna, rzeki i amfibie ograniczają niezależną wartość bojową. §!"
 Light_Arm_Inf_Bat: "Jedna fabryka zaprzestanie produkcji obrabiarek i stanie się wolnym zakładem, który będzie można przydzielić do nowego zadania."
 Light_Arm_Inf_Bat_desc: "An understrength armored infantry element uses a small allocation of Infantry Fighting Vehicles to add protected firepower without occupying normal frontage.\n\n§GDesigner Hint: Understrength Armored Infantry adds IFV Armor and firepower without Combat Width and performs best in plains and deserts. Use it to reinforce valuable formations, but its low Organization, costly vehicles, and extreme rough-terrain, river, and amphibious penalties make it highly specialized.§!"
 Light_L_Air_assault_Bat: "Understrength Air Assault Infantry Battalion"
 Light_L_Air_assault_Bat_desc: "Air Assault Infantry are elite Infantry, with their special training in rappelling and air transportation, their equipment is sometimes designed or field-modified to allow better transportation within aircraft. They are often used to to seize and hold key terrain which has not been fully secured, and to directly engage enemy forces behind enemy lines.\n\n§GDesigner Hint: This understrength air-assault element adds Organization and powerful urban, mountain, forest, jungle, and marsh bonuses without Combat Width. Use it to strengthen specialized formations in difficult terrain, but its helicopter requirement is costly and it performs poorly in plains, deserts, and amphibious attacks.§!"
 Light_attack_helo_bat: "Understrength Attack Helicopter Regiment"
 Light_attack_helo_bat_desc: "A small attack helicopter element provides rapid gunship support without the footprint of a full regiment.\n\n§GDesigner Hint: Understrength Attack Helicopters add fast armored firepower without Combat Width and excel across plains and deserts. Use them for compact mobile support, but their very low Organization and Strength, expensive aircraft, and severe mountain, jungle, marsh, and urban penalties make losses difficult to absorb.§!"
 Light_armor_Bat: "Understrength Tank Battalion"
 Light_armor_Bat_desc: "An understrength tank element concentrates a limited number of Main Battle Tanks to reinforce a formation without occupying normal frontage.\n\n§GDesigner Hint: Understrength Tanks add Armor, Breakthrough, and strong plains and desert attacks without Combat Width. Use them to reinforce offensive formations economically, but their low Organization and Strength, tank cost, and extreme penalties in rough terrain and cities make them poor general-purpose support.§!"
 Light_L_arm_Bat: "Understrength Light Tank Battalion"
 Light_L_arm_Bat_desc: "An understrength light tank element provides mobile anti-armor firepower and reconnaissance in force with a smaller vehicle footprint.\n\n§GDesigner Hint: Understrength Light Tanks add mobile anti-armor firepower without Combat Width and excel in plains and deserts. Use them to stiffen fast formations against vehicles, but their low Strength, specialized chassis, and heavy rough-terrain, river, and amphibious penalties limit flexibility.§!"
 Light_SP_Arty_Bat: "Understrength Self-Propelled Artillery Battalion"
 Light_SP_Arty_Bat_desc: "Zredukowany pododdział artylerii samobieżnej prowadzi mobilny ogień pośredni, dysponując mniejszą liczbą pojazdów niż pełny batalion.\n\n§G Wskazówka projektanta: Artyleria samobieżna o zbyt małej sile zapewnia mobilny atak miękki bez szerokości bojowej i sprawdza się szczególnie dobrze na równinach, pustyniach i w miastach. Używaj jej do zwartego wsparcia ofensywnego, ale ma praktycznie zerową organizację, niską siłę, koszt wyspecjalizowanego podwozia i słabszą skuteczność w lasach, górach i dżungli. §!"
 Light_SP_R_Arty_Bat: "Understrength Self-Propelled Rocket Artillery Battalion"
 Light_SP_R_Arty_Bat_desc: "A reduced multiple-launch rocket element provides concentrated area fire while using fewer vehicles than a full battalion.\n\n§GDesigner Hint: Understrength Rocket Artillery adds powerful mobile Soft Attack without Combat Width and excels in plains, deserts, and cities. Use it to reinforce offensive formations, but its negligible Organization, low Strength, rocket-vehicle cost, and rough-terrain penalties require protection.§!"
 Light_SP_AA_Bat: "Understrength Self-Propelled Air Defence Battalion"
 Light_SP_AA_Bat_desc: "A reduced self-propelled air-defence element protects the formation with a small allocation of mobile anti-air systems.\n\n§GDesigner Hint: Understrength Self-Propelled Air Defence adds Air Attack without Combat Width or much Manpower. Use it for compact protection of mobile formations under enemy air power, but it has almost no Organization, low Strength, and requires specialized anti-air vehicles that add little ground firepower.§!"
 Drone_Recce_Comp: "Bezzałogowy pluton rozpoznawczy"
 Drone_Recce_Comp_desc: "Dzięki wykorzystaniu małych bezzałogowych systemów powietrznych do prowadzenia obserwacji poza zasięgiem wzroku, pluton rozpoznania bezzałogowego zwiększa świadomość sytuacyjną na polu walki, nie narażając zwiadowców na bezpośredni ostrzał. Drony te pozwalają na szybkie sprawdzenie tras, wykrycie pozycji przeciwnika i potwierdzenie celów w trudnym terenie, co umożliwia szybsze podejmowanie decyzji i prowadzenie bardziej precyzyjnego ognia.\n\n§G Wskazówka projektanta: Bezzałogowe rozpoznanie zapewnia wysokie parametry rozpoznania i inicjatywy, wzmacnia inne jednostki rozpoznawcze oraz usprawnia ataki artyleryjskie. Warto stosować je w dywizjach zmechanizowanych lub pancernych, których stać na drony; należy jednak pamiętać, że zwiększa ono szerokość frontu i zużycie zaopatrzenia, osłabia zdolność do okopywania się oraz słabo sprawdza się w terenie miejskim i górskim. §!"
 medium_walker_battalion: "Medium Walker Company"
 medium_walker_battalion_desc: "Designed as the all-round backbone of walker formations, the Medium Walker Company combines balanced protection, mobility, and payload capacity for direct combat.\n\n§GDesigner Hint: Medium Walkers provide flexible armored frontline power determined by their equipped walker chassis. Use them as the general-purpose core of walker formations, but their wide Combat Width, low Organization, long training, and large chassis requirement make them expensive to field and replace.§!"
 light_walker_tank_battalion: "Light Walker Company"
 light_walker_tank_battalion_desc: "Built around anti-armor walker chassis, the Light Walker Company emphasizes hunting hardened targets and exploiting openings rather than sustained line combat.\n\n§GDesigner Hint: Light Walkers specialize in armored targets through tank-destroyer walker chassis. Use them when enemy Armor demands concentrated Piercing and Hard Attack, but their wide Combat Width, low Organization, long training, and specialized chassis cost make them inefficient against soft opposition.§!"
 heavy_walker_tank_battalion: "Heavy Walker Company"
 heavy_walker_tank_battalion_desc: "Heavy Walker Companies mount artillery payloads on massive walking platforms to deliver protected fire support with the main formation.\n\n§GDesigner Hint: Heavy Walkers provide armored artillery firepower from walker artillery chassis. Use them to add powerful support against infantry and fortified lines, but their wide Combat Width, low Organization, long training, and expensive specialized chassis require a well-supported formation.§!"
 space_artillery_support_company: "Space Artillery Support Battery"
 space_artillery_support_company_desc: "By employing artillery projectiles fired from orbital platforms, the Space Artillery Support Battery delivers precision bombardment from space onto battlefield targets far beyond the range of conventional systems. These strikes can rapidly suppress fortified positions, destroy high-value assets, and break up enemy concentrations with minimal warning.\n\n§GDesigner Hint: Space Artillery doubles the attack contribution of artillery batteries without adding Combat Width and can be paradropped. Use it to amplify artillery-heavy formations, but its rare orbital-control equipment, long training, and weak standalone combat stats make it wasteful in divisions with little artillery.§!"
 space_artillery_equipment_type: "Orbital Fire Control Relay"
 space_artillery_equipment_type_desc: "A hardened communications and targeting relay designed to request, coordinate, and confirm orbital artillery strikes in real time. It links frontline observers to space-based batteries, enabling rapid fire missions, precise timing, and reliable deconfliction with friendly forces. The system is expensive and resource heavy, but without it orbital firepower remains blind, slow, and dangerously inefficient."
 space_artillery_equipment_1: "$space_artillery_equipment_type$ |"
 space_artillery_equipment_1_desc: "$space_artillery_equipment_type_desc$"
 HACS_Mech: "System walki o wysokiej manewrowości pierwszej generacji"
 HACS_Mech_desc: "System walki o wysokiej manewrowości pierwszej generacji łączy zaawansowane opancerzenie, uzbrojenie i mobilność w platformie bojowej przystosowanej do przerzutu drogą powietrzną.\n\n§G Wskazówka projektanta: Jednostki HACS pierwszej generacji wyróżniają się bardzo wysoką organizacją, siłą i wszechstronną siłą ognia oraz zdolnością do desantu powietrznego, a także otrzymują znaczne premie w terenie pagórkowatym i na równinach. Wykorzystuj je jako elitarne, pancerne siły uderzeniowe, pamiętając jednak, że ze względu na dużą szerokość frontu, długi czas szkolenia, rzadkość wyposażenia oraz kary za walkę w lasach i dżungli, lekkomyślne straty mogą być bardzo dotkliwe. §!"
 HACS_Mech_2: "System walki o wysokiej manewrowości drugiej generacji"
 HACS_Mech_2_desc: "System bojowy o wysokiej manewrowości drugiej generacji poprawia ochronę, systemy uzbrojenia oraz wytrzymałość na polu walki, zachowując jednocześnie elastyczność w zakresie strategicznego rozmieszczenia.\n\n§G Wskazówka projektanta: Jednostki HACS drugiej generacji oferują lepszą organizację, siłę i zdolność przełamywania, zachowując jednocześnie możliwość desantu powietrznego oraz ewakuacji drogą morską. Sprawdzają się w elitarnych natarciach na wzgórzach, równinach, pustyniach i bagnach, jednak ze względu na dużą szerokość frontu, rzadki sprzęt, długi czas szkolenia oraz utrzymującą się karę do walki w dżungli, należy wykorzystywać je w sposób selektywny. §!"
 HACS_Mech_3: "System walki o wysokiej manewrowości trzeciej generacji"
 HACS_Mech_3_desc: "System walki o wysokiej manewrowości trzeciej generacji łączy w sobie zaawansowaną ochronę, modułowe uzbrojenie oraz wyjątkową wytrzymałość na polu walki.\n\n§G Wskazówka projektanta: Jednostki HAC trzeciej generacji wyróżniają się wyjątkową organizacją, siłą, zdolnością do okopywania się, dużą siłą ognia, możliwością desantu powietrznego oraz znacznymi premiami terenowymi. Wykorzystuj je w najbardziej wymagających operacjach pancernych, pamiętając jednak, że ich duża szerokość frontu, długi czas szkolenia oraz trudne do zastąpienia, zaawansowane wyposażenie sprawiają, że ponoszenie strat jest bardzo kosztowne. §!"
 ALN_bellatoris: "Bellatoris"
 ALN_bellatoris_desc: "The Bellatoris is the frontline warrior of the Chimera swarm, bred for relentless close assault. Fast and aggressive, it overwhelms defensive lines through sheer numbers and ferocity.\n\n§GDesigner Hint: Bellatoris combine very high Organization and Strength with balanced attacks, Defense, Breakthrough, and rapid training. Use them as general-purpose Chimera line troops in forests, hills, marshes, plains, and deserts, but they have no Air Attack and suffer in mountains and jungles.§!"
 ALN_brachionis: "Brachionis"
 ALN_brachionis_desc: "The Brachionis is a multi-limbed Chimera built to grapple and tear apart armored targets at close range.\n\n§GDesigner Hint: Brachionis trade some Defense for greater Soft Attack and Hard Attack while retaining high Organization and rapid training. Use them as aggressive assault troops on open ground, but they remain weaker in mountains and jungles.§!"
 ALN_gravis: "Gravis"
 ALN_gravis_desc: "The Gravis is the heaviest Chimera strain, an armored mass that anchors the swarm's advance and breaks hardened positions by force.\n\n§GDesigner Hint: Gravis provide the strongest Chimera attacks, Breakthrough, and Initiative with high Organization and rapid training. Use them as offensive anchors in open terrain, but they consume more Supply, have lower Defense and Organization than lighter strains, and suffer in mountains and jungles.§!"
 Hvy_Mot_Inf_Bat: "Ciężka Piechota Zmotoryzowana"
 Hvy_Mot_Inf_Bat_desc: "Ciężka kompania piechoty zmotoryzowanej wykorzystuje do transportu pojazdy typu MRAP (odporne na wybuchy min i zasadzki). Ich opancerzone pojazdy zapewniają załodze doskonałą ochronę przed minami, improwizowanymi ładunkami wybuchowymi (IED) oraz ostrzałem z broni strzeleckiej, co czyni je idealnymi do działań w nieprzyjaznym środowisku, charakteryzującym się wysokim ryzykiem zasadzek.\n\n§G Wskazówka projektanta: Ciężka piechota zmotoryzowana używa cięższych pojazdów opancerzonych do szybkich operacji na froncie na równinach i pustyniach. Wymagają one większego nakładu sprzętu i mają słabszą organizację i okop niż lżejsza piechota, a jednocześnie ponoszą znaczne straty w trudnym terenie. §!"
 L_Ranger_Bat_desc: "Komandosi (Rangersi) to elitarna lekka piechota, wyspecjalizowana w rajdach, działaniach bezpośrednich oraz szybkim przerzucie sił przed głównym zgrupowaniem. Poruszają się z minimalnym obciążeniem, by zapewnić sobie maksymalną mobilność i element zaskoczenia; przejmują kluczowe cele i utrzymują je do czasu nadejścia jednostek konwencjonalnych. Ceną za to jest ograniczone uzbrojenie ciężkie, co czyni ich podatnymi na ataki sił pancernych w otwartym terenie.\n\n§G Wskazówka projektanta: Komandosi łączą wysoką organizację i wyjątkowe bonusy do trudnego terenu z niską szerokością bojową. Używaj ich w elitarnych formacjach górskich, leśnych, dżunglowych, bagiennych lub miejskich, ale ich długie szkolenie, limit sił specjalnych i ograniczony ciężki sprzęt sprawiają, że masowe rozmieszczenie jest kosztowne i naraża ich na niebezpieczeństwo na równinach. §!"
 L_Ranger_Recce_Comp_desc: "Pododdział rozpoznawczy wywodzący się z Komandosów, wyszkolony do pieszej infiltracji głębokiego zaplecza wroga i raportowania o ruchach przeciwnika. Łącząc skryte działanie z rozpoznaniem przy użyciu dronów oraz nadzorem elektronicznym, zbierają oni informacje wywiadowcze i wyznaczają cele dla sił własnych, a także – gdy nadarzy się okazja – mogą przeprowadzać ograniczone wypady i zasadzki.\n\n§G Wskazówka projektanta: Jednostka Zwiadowcza Komandosów dodaje Rozpoznanie i Inicjatywę, jednocześnie ulepszając Miękki Atak artylerii i zapewniając skuteczną walkę w trudnym terenie. Używaj go w formacjach sił specjalnych wymagających elitarnego zwiadu, ale zwiększa on Szerokość Walki, zużywa zasoby sił specjalnych i zapewnia ograniczoną bezpośrednią siłę ognia. §!"
 A_L_arm_Bat: "Kompania Lekkich Czołgów powietrznodesantowych"
 A_L_arm_Bat_desc: "Kompanie czołgów lekkich dysponują specjalistycznymi, często kołowymi maszynami, które łączą w sobie niezwykłą mobilność z potężną siłą ognia. W bezpośrednim starciu potrafią skutecznie stawić czoła każdemu rodzajowi piechoty. Walka bezpośrednia nie jest jednak ich głównym zadaniem – jednostki te przenikają w pobliże sił wroga, by obserwować i raportować jego działania, wykorzystując do gromadzenia danych wywiadowczych zarówno rozpoznanie z użyciem dronów, jak i środki walki elektronicznej. Mogą również przeprowadzać rajdy i zasadzki na kluczowe obiekty oraz zmechanizowane formacje przeciwnika. Są także zdolne do udziału w operacjach powietrznodesantowych, zapewniając oddziałom spadochronowym natychmiastowe wsparcie pancerne na bliskim dystansie.\n\n§G Wskazówka projektanta: Lekkie czołgi powietrznodesantowe zapewniają formacjom desantowym mobilny pancerz i siłę ognia przeciwpancernego po wdrożeniu. Używaj ich do wsparcia wojsk powietrznodesantowych w walce z ruchliwym przeciwnikiem na otwartym terenie, ale specjalistyczne pojazdy są kosztowne i mają poważne problemy w górach, dżungli, na bagnach i w miastach. §!"
 air_assault_Arty_Bat: "Bateria artylerii powietrznodesantowej"
 air_assault_Arty_Bat_desc: "Pełna bateria holowanych dział artyleryjskich, transportowanych za pomocą podwieszeń śmigłowcowych. Zapewnia stałe pośrednie wsparcie ogniowe dla operacji aeromobilnych, dotrzymując kroku piechocie powietrznodesantowej dzięki szybkiemu przegrupowaniu w powietrzu.\n\n§G Wskazówka projektanta: Artyleria powietrzno-mobilna dodaje formacjom śmigłowców znaczną siłę ataku miękkiego i sprawdza się dobrze na wzgórzach, w górach, lasach, dżunglach i miastach. Używaj jej do wsparcia wojsk powietrzno-desantowych w trudnym terenie, ale zwiększa szerokość pola walki, ma słabą organizację i siłę oraz wymaga drogich śmigłowców transportowych. §!"
 Weapons_company: "Kompania broni wsparcia"
 Weapons_company_desc: "Kompania wsparcia ogniowego, wyposażona w broń przeznaczoną do bezpośredniego wsparcia ogniowego piechoty – taką jak obsługi uniwersalnych i wielkokalibrowych karabinów maszynowych, obsługi automatycznych granatników oraz inne rodzaje ciężkiej broni wsparcia bezpośredniego. Zadaniem tej kompanii jest zapewnienie wsparcia ogniowego pododdziałom piechoty, do których zostanie przydzielona w ramach szerszych struktur sił zbrojnych.\n\n§G Wskazówka projektanta: Kompania Broni dodaje szerokie statystyki do ognia bezpośredniego, zwłaszcza Przebicia, bez Szerokość Bojową. Użyj jej do wzmocnienia piechoty ogólnego przeznaczenia, ale jej wysokie zapotrzebowanie na wyposażenie piechoty i kara za Okopanie sprawiają, że jest mniej atrakcyjna dla tanich, statycznych obrońców. §!"
 Heavy_mortar_company: "Bateria Moździeży"
 Heavy_mortar_company_desc: "Moździerze zaprojektowano tak, aby zapewniały szybkie i zintegrowane wsparcie ogniowe pododdziałom liniowym, bez konieczności przydzielania im środków wsparcia z wyższych szczebli dowodzenia. Umożliwiają one prowadzenie ognia pośredniego na rzecz pododdziałów liniowych znacznie niższym kosztem, niż wymagałoby tego użycie pełnowymiarowego pododdziału artylerii.\n\n§G Wskazówka projektanta: Bateria moździerzy zapewnia silny atak miękki bez wyposażenia artyleryjskiego ani szerokości pola walki. Używaj jej jako niedrogiego, zintegrowanego wsparcia ogniowego przeciwko piechocie, ale oferuje niewiele ataku twardego lub przebijającego i zmniejsza okopywanie. §!"
 Sniper_company: "Pluton Snajperów"
 Sniper_company_desc: "Dzięki wyposażeniu w precyzyjnych strzelców działających w parach z obserwatorem, pluton snajperski prowadzi ogień selektywny na dalekie dystanse, eliminując cele o wysokim znaczeniu, takie jak oficerowie, załogi czy obsługa łączności. Formacja ta doskonale sprawdza się w nękaniu i dezorganizowaniu sił przeciwnika z ukrycia, osłabiając jego skuteczność bojową, a jednocześnie pozostając trudną do wykrycia i zwalczenia.\n\n§G Wskazówka projektanta: Pluton snajperski zwiększa siłę ataku przeciw celom miękkim oraz zdolności rozpoznawcze, a także podnosi inicjatywę jednostek rozpoznawczych i siłę ognia artylerii. Warto go wykorzystywać do walki z piechotą i usprawnienia koordynacji działań, jednak jednostka ta zwiększa szerokość frontu i charakteryzuje się bardzo słabymi parametrami przełamania, ataku przeciw celom twardym oraz przebicia pancerza. §!"
 AT_company: "Pluton Piechoty Przeciwpancernej"
 AT_company_desc: "Ten pluton przeciwpancerny, wyposażony w broń przeciwpancerną dla piechoty, został stworzony do ścisłej współpracy z pododdziałami lekkiej piechoty. Dzięki zdolności do sprawnego działania w terenie zurbanizowanym, lasach oraz innych miejscach o zwartej zabudowie lub terenie umocnionym, zespół ten może nie tylko skutecznie atakować nieprzyjacielskie pojazdy opancerzone, ale także błyskawicznie wycofywać się na swoje pozycje.\n\n§G Wskazówka projektanta: Piechota przeciwpancerna zapewnia wysoki poziom Ataku Twardego i Przebicia bez Szerokości Bojowej dla formacji piechoty, lotnictwa, piechoty morskiej i sił specjalnych. Używaj jej, gdy te dywizje muszą stawić opór pancerzowi, ale osłabia inne statystyki bojowe i zwiększa koszt specjalistycznego wyposażenia. §!"
 Mot_AT_company: "Zmotoryzowana bateria przeciwpancerna"
 Mot_AT_company_desc: "Bateria przeznaczona do działań przeciwpancernych, prowadząca ogień ze stanowisk zamontowanych na pojazdach. Konstrukcja ta kładzie nacisk przede wszystkim na szybkość, co pozwala jednostce dotrzymywać kroku dynamicznie przemieszczającym się pododdziałom zmechanizowanym i pancernym, przy jednoczesnym zapewnieniu zwiększonego potencjału przeciwpancernego.\n\n§G Wskazówka projektanta: Pojazd przeciwpancerny zapewnia wysoki poziom ataku twardego i przebijania bez spowalniania formacji mobilnych. Używaj go w dywizjach zmotoryzowanych, pancernych, powietrznodesantowych lub morskich walczących z czołgami, ale ciężka broń przeciwpancerna i pojazdy użytkowe zwiększają jego koszt i nie przynoszą większych korzyści w walce z celami lekkimi. §!"
 AA_company: "Bateria Przeciwpowietrzna"
 AA_company_desc: "Element przeznaczony specjalnie do zwalczania nieprzyjacielskich statków powietrznych oraz zapewniania obrony przed wrogimi śmigłowcami i innymi statkami powietrznymi.\n\n§G Wskazówka projektanta: Kompania przeciwlotnicza zapewnia dużą siłę ognia przeciwlotniczego, nie zajmując przy tym szerokości frontu. Warto ją stosować do ochrony dywizji operujących w strefach zagrożonych atakami z powietrza; jest ona jednak słaba w walce naziemnej i wymaga specjalistycznego sprzętu przeciwlotniczego, który traci na znaczeniu, gdy panuje się w powietrzu. §!"
 Combat_engineer_company: "Kompania saperów"
 Combat_engineer_company_desc: "Saperzy bojowi realizują zadania inżynieryjne o charakterze ofensywnym, zapewniając bezpośrednie wsparcie pododdziałom liniowym. Są przeszkoleni i wyposażeni do pokonywania trudnego terenu, takiego jak rzeki czy rowy przeciwpancerne. Dysponują również środkami umożliwiającymi wykonywanie przejść w polach minowych i innych przeszkodach obronnych oraz oczyszczanie terenu, co pozwala pozostałym siłom bojowym na swobodne przemieszczanie się.\n\n§G Wskazówka projektanta: Bataliony saperów zwiększają obronę i przełamanie oraz zapewniają niewielkie premie do ataku i obrony w lasach, górach, dżunglach i miastach, nie zajmując przy tym szerokości frontu. Warto je wykorzystywać podczas natarć w trudnym terenie, jednak wymagają one znacznych ilości sprzętu piechoty i oferują mniejsze korzyści w otwartym terenie. §!"
 pathfinder_company: "Pluton Rozpoznania powietrznodesantowego (Patfinderów)"
 pathfinder_company_desc: "Elitarne grupy spadochroniarzy, szkolone do wykonywania skoków wyprzedzających przed właściwą operacją powietrznodesantową w celu wyznaczenia najbezpieczniejszych stref zrzutu i punktów zbiórki. Żołnierze ci zapewniają kluczowe funkcje dowodzenia i kierowania w najważniejszych fazach każdej operacji powietrznodesantowej lub powietrzno-mobilnej.\n\n§G Wskazówka projektanta: Jednostki Pathfinder zwiększają organizację i siłę ataku przeciw celom miękkim piechoty powietrznodesantowej oraz mogą desantować się na spadochronach. Warto wykorzystywać je do wzmacniania dywizji powietrznodesantowych lub aeromobilnych, jednak zwiększają one szerokość frontu, są ograniczone do wspomnianych formacji i same w sobie dysponują niewielką siłą bojową. §!"
 amphibious_landing_detachment: "Morski oddział desantowy"
 amphibious_landing_detachment_desc: "Attached elements from the navy that allow for rapid and effective amphibious landing operations. Equipped with dedicated landing ships and equipment, these units facility rapid ship-to-shore or Over the Horizon landing operations. The price of attaching one of these units however, is the decrease in capabilities to conduct non-amphibious operations.\n\n§G Wskazówka projektanta: Oddział desantowy znacząco poprawia zdolności formacji piechoty morskiej w zakresie desantowych ataków, obrony oraz mobilności. Warto stosować go w dywizjach przeznaczonych do szturmowania plaż, jednak zwiększa on szerokość frontu, zapotrzebowanie na siłę żywą i sprzęt, a także nakłada poważne kary do walki w niemal każdym terenie lądowym. §!"
 combat_maintenance_company: "Kompania Serwisowa"
 combat_maintenance_company_desc: "Kompania techniczna utrzymuje pojazdy i ciężki sprzęt danej formacji w gotowości bojowej, prowadząc naprawy polowe i odzyskując uszkodzone maszyny, zanim zostaną one bezpowrotnie utracone. Przywracając sprawność pojazdom wyłączonym z walki w pobliżu linii frontu, jednostka ta podtrzymuje potencjał pancerny podczas długotrwałych działań i ogranicza straty wynikające z wyczerpania sprzętu.\n\n§G Wskazówka projektanta: Konserwacja poprawia niezawodność, odzyskiwanie i przejmowanie sprzętu w dywizjach z dużym udziałem pojazdów. Używaj jej, aby ograniczyć straty i oszczędzać drogi sprzęt podczas długich operacji, ale zwiększa szerokość pola walki, siłę roboczą i pojazdy użytkowe, jednocześnie wnosząc niewiele bezpośredniej siły ognia. §!"
 airmobile_maintenance_company: "Aeromobilna Kompania Serwisowa"
 airmobile_maintenance_company_desc: "Jednostka konserwacyjna skonfigurowana do wspierania sił aeromobilnych i śmigłowców, z lżejszym i łatwiejszym w transporcie oprzyrządowaniem niezbędnym do utrzymania w pełni sprawnych jednostek wiropłatowych i szybko przemieszczających się. Przywraca uszkodzony sprzęt w rejonach wysuniętych, utrzymując tempo operacji desantowych z dala od ustalonych baz.\n\n§G Wskazówka projektanta: Airmobile Maintenance poprawia przechwytywanie sprzętu i niezawodność, jednocześnie dotrzymując kroku formacjom śmigłowców. Używaj go do oszczędzania kosztownego sprzętu śmigłowcowego, ale oferuje on mniej możliwości odzyskiwania niż konserwacja naziemna, zwiększa szerokość pola walki i wymaga użycia wielu śmigłowców transportowych. §!"
 communications_company: "Kompania Łącznościowa"
 communications_company_desc: "Kompania łączności utrzymuje sieci radiowe, transmisji danych oraz dowodzenia, które spajają pododdział w jedną całość, zapewniając niezawodny przepływ rozkazów i meldunków na polu walki. Sprawna łączność poprawia koordynację i skraca czas reakcji, a także zwiększa odporność pododdziału na zakłócenia radiowe i elektroniczne.\n\n§G Wskazówka projektanta: Kompania łączności usprawnia organizację, odzyskiwanie gotowości oraz inicjatywę batalionów pierwszej linii. Warto ją stosować w dużych lub cennych dywizjach bojowych, które zyskują na lepszej koordynacji; należy jednak pamiętać, że zwiększa ona szerokość frontu i wiąże się ze znacznym kosztem sprzętu dowodzenia i łączności, oferując przy tym niewielką bezpośrednią siłę ognia. §!"
 military_police_attachment: "Oddział Żandarmerii Wojskowej"
 military_police_attachment_desc: "Żandarmeria wojskowa odpowiada za kierowanie ruchem, ochronę zaplecza oraz postępowanie z jeńcami, dzięki czemu oddziały liniowe mogą skupić się na walce. Zapewniając porządek na szlakach zaopatrzeniowych i zabezpieczając tyły przed przenikającymi tam przeciwnikami oraz maruderami, żandarmeria utrzymuje dyscyplinę i gwarantuje płynne przemieszczanie się sił.\n\n§G Wskazówka projektanta: Żandarmeria Wojskowa zwiększa poziom tłumienia piechoty i dodaje dalsze tłumienie bez szerokości pola walki. Używaj ich w szablonach okupacji i zabezpieczenia tyłów, ale ich siła robocza i koszt wyposażenia dają niewielkie korzyści dywizjom bojowym na pierwszej linii. §!"
 hq_mech: "Kompania Dowodzenia Piechoty Zmechanizowanej"
 hq_mot: "Kompania Dowodzenia Piechoty Zmotoryzowanej"
 hq_armor: "Kompania Dowodzenia Ciężkiej Kawalerii"
 hq_Mot_Inf_Bat: "HQ Motorized Infantry Security Detachment"
 hq_Mech_Inf_Bat: "HQ Mechanized Infantry Security Detachment"
 hq_Arm_Inf_Bat: "HQ Armored Security Detachment"
 hq_Mech_Marine_Bat: "HQ Marine Security Detachment"
 hq_Mech_Air_Inf_Bat: "HQ Air Assault Security Detachment"
 Militia_Recce_Comp: "Pluton rozpoznawczy Milicji"
 Militia_Recce_Comp_desc: "Kompanie rozpoznawcze milicji wykorzystują pojazdy ogólnego przeznaczenia oraz ograniczony sprzęt łączności do prowadzenia rozpoznania przed siłami głównymi milicji. Zapewniają one niedrogie rozpoznanie pozycji przeciwnika, zwłaszcza w terenie zabudowanym.\n\n§G Wskazówka projektanta: Zwiad milicji zwiększa Rozpoznanie i Inicjatywę, nie wpływając na szerokość frontu, a przy tym sprawdza się szczególnie dobrze w miastach i megamiastach. Warto go wykorzystać do taniego ulepszenia taktyki milicji, jednak jest on dostępny wyłącznie dla tej formacji i wnosi niewielki bezpośredni potencjał bojowy. §!"
 light_medium_walker_battalion: "Medium Walker Company (Light)"
 light_medium_walker_battalion_desc: "A reduced Medium Walker element reinforces a formation with a small allocation of general-purpose walker chassis.\n\n§GDesigner Hint: Understrength Medium Walkers add flexible armored power with less Combat Width and far fewer chassis than a full walker company. Use them when production cannot sustain a full element, but they retain low Organization, long training, and limited staying power.§!"
 light_light_walker_tank_battalion: "Light Walker Company (Light)"
 light_light_walker_tank_battalion_desc: "A reduced Light Walker element provides a small force of anti-armor walker platforms for targeted reinforcement.\n\n§GDesigner Hint: Understrength Light Walkers add concentrated anti-armor power with less Combat Width and fewer tank-destroyer chassis. Use them to reinforce divisions against hardened targets, but they retain low Organization, long training, and a narrow role against soft opposition.§!"
 light_heavy_walker_tank_battalion: "Heavy Walker Company (Light)"
 light_heavy_walker_tank_battalion_desc: "A reduced Heavy Walker element provides artillery-equipped walking platforms without the footprint of a full company.\n\n§GDesigner Hint: Understrength Heavy Walkers add armored artillery firepower with less Combat Width and fewer chassis than a full element. Use them for compact fire support, but their low Organization, long training, and specialized artillery chassis still make them costly.§!"
 hq_support_company: "HQ Support Company"
 hq_support_company_desc: "The headquarters support company provides the command staff, communications, transport, and security needed to direct a field formation.\n\n§GDesigner Hint: The HQ Support Company improves the bonuses a deployed leader gains from Skill. It is the general-purpose choice for an Army HQ template, but adds Combat Width, Manpower, and equipment without specialized combat or operational bonuses.§!"
 hq_engineer: "HQ Engineer Company"
 hq_engineer_desc: "The headquarters engineer company coordinates breaching, fortification, and mobility work across the formation.\n\n§GDesigner Hint: The HQ Engineer Company improves Fortification Damage and Amphibious Invasion Defense while adding Entrenchment and Breakthrough. Use it for siege, defensive, or coastal operations, but it adds Combat Width and offers limited direct firepower.§!"
 hq_recon: "HQ Reconnaissance Company"
 hq_recon_desc: "The headquarters reconnaissance company collects and distributes terrain and enemy information for the command staff.\n\n§GDesigner Hint: The HQ Reconnaissance Company improves Reconnaissance and Terrain Trait experience for the deployed leader while adding Reconnaissance to the HQ. Use it in mobile or terrain-focused commands, but it adds Combat Width and little direct combat power.§!"
 hq_maintenance: "HQ Maintenance Company"
 hq_maintenance_desc: "The headquarters maintenance company coordinates recovery, repair, and equipment salvage across the formation.\n\n§GDesigner Hint: The HQ Maintenance Company reduces Attrition and improves Equipment Capture for the deployed leader while adding Reliability and Equipment Capture to the HQ. Use it for equipment-heavy commands, but it adds Combat Width and has weak combat stats.§!"
 hq_logistics: "HQ Logistics Company"
 hq_logistics_desc: "The headquarters logistics company plans supply distribution and fuel movement for the formation.\n\n§GDesigner Hint: The HQ Logistics Company reduces Supply Consumption for the deployed leader and Fuel Consumption for the HQ. Use it on supply-constrained or fuel-intensive fronts, but it adds Combat Width and little fighting power.§!"
 hq_naval_liaison: "HQ Naval Liaison Company"
 hq_naval_liaison_desc: "Naval liaison teams connect the headquarters with fleet commanders and ship-to-shore support networks.\n\n§GDesigner Hint: The HQ Naval Liaison Company improves Shore Bombardment, Amphibious Invasion, and marine Supply Grace for the deployed leader. Use it for coastal and amphibious campaigns, but it adds Combat Width and provides little benefit far inland.§!"
 hq_air_liaison: "HQ Air Liaison Company"
 hq_air_liaison_desc: "Air liaison teams coordinate the headquarters with transport, close-support, and air-superiority formations.\n\n§GDesigner Hint: The HQ Air Liaison Company shortens Air Invasion Preparation and improves resistance to Close Air Support and the combat benefit from Air Superiority. Use it where air-ground coordination matters, but it adds Combat Width and no substantial ground firepower.§!"
 hq_specops: "HQ Special Operations Company"
 hq_specops_desc: "The special operations staff coordinates elite units operating beyond normal supply and command networks.\n\n§GDesigner Hint: The HQ Special Operations Company improves Special Forces Attack, Defense, and Out of Supply performance for the deployed leader without adding Combat Width. Use it to command elite formations, but its Manpower and equipment cost is wasted on conventional forces.§!"
 hq_mech_desc: "A mechanized operations staff coordinates armored personnel carriers and their embarked infantry across the formation.\n\n§GDesigner Hint: The HQ Mechanized Infantry Company improves Mechanized Attack and Defense for the deployed leader. Use it to command mechanized formations, but it demands APCs and substantial support equipment while offering little benefit to other unit types.§!"
 hq_mot_desc: "A motorized operations staff coordinates vehicle-borne infantry and the rapid movement of the formation.\n\n§GDesigner Hint: The HQ Motorized Infantry Company improves Motorized Attack and Defense for the deployed leader. Use it to command motorized formations, but its Utility Vehicle and equipment costs provide little value to foot or armored forces.§!"
 hq_armor_desc: "An armored operations staff coordinates tanks, armored infantry, and their supporting elements across the formation.\n\n§GDesigner Hint: The HQ Heavy Cavalry Company improves Armor Attack and Defense for the deployed leader. Use it to command tank-heavy forces, but its IFVs and broad equipment requirements make it one of the costlier HQ support choices.§!"
 hq_infantry: "HQ Infantry Security Detachment"
 hq_infantry_desc: "A light infantry detachment protects headquarters personnel, communications, and command posts from direct attack.\n\n§GDesigner Hint: The HQ Infantry Security Detachment provides high Strength and Organization at modest equipment cost for an Army HQ. Use it as a basic security line, but it adds Combat Width, lacks terrain bonuses, and has reduced combat stats compared with ordinary frontline infantry.§!"
 hq_Mot_Inf_Bat_desc: "A motorized infantry detachment provides mobile security for headquarters personnel and command posts.\n\n§GDesigner Hint: The HQ Motorized Infantry Security Detachment adds Speed, solid Organization, and strong hill and urban performance to an Army HQ. Use it for a mobile command formation, but vehicles add cost and it is weak across deserts, jungles, marshes, rivers, and amphibious attacks.§!"
 hq_Mech_Inf_Bat_desc: "Pododdział piechoty zmechanizowanej osłania mobilne stanowisko dowodzenia przy użyciu transporterów opancerzonych.\n\n§G Wskazówka projektanta: Oddział ochrony sztabu piechoty zmechanizowanej zapewnia mobilność opancerzoną oraz silną obronę na wzgórzach i w miastach. Wykorzystaj go do ochrony sztabu armii zmechanizowanej, pamiętając jednak, że transportery opancerzone są kosztowne, a jednostka ta otrzymuje dotkliwe kary w górach, dżungli, na bagnach, przy przekraczaniu rzek oraz podczas ataków desantowych. §!"
 hq_Arm_Inf_Bat_desc: "Pododdział piechoty pancernej wykorzystuje bojowe wozy piechoty do zapewnienia silnej ochrony stanowiska dowodzenia.\n\n§G Wskazówka projektanta: Opancerzony oddział ochrony sztabu zapewnia sztabowi armii ochronę dzięki wykorzystaniu bojowych wozów piechoty (BWP) oraz wysoką mobilność w otwartym terenie. Warto go stosować w połączeniu z dowództwami pancernymi, jednak jednostka ta cechuje się niższą organizacją, wysokim kosztem wyposażenia oraz znacznymi karami do skuteczności w trudnym terenie i podczas operacji desantowych. §!"
 hq_Mech_Marine_Bat_desc: "A mechanized marine detachment protects a headquarters during ship-to-shore and coastal operations.\n\n§GDesigner Hint: The HQ Marine Security Detachment combines armored mobility with strong Amphibious and River Attack for an Army HQ. Use it in marine commands and beachhead operations, but its APC cost and rough-terrain penalties make it inefficient for inland campaigns.§!"
 hq_Mech_Air_Inf_Bat_desc: "A lightweight mechanized detachment protects headquarters assigned to airborne and rapidly deployed formations.\n\n§GDesigner Hint: The HQ Air Assault Security Detachment provides armored security that can be paradropped with an Army HQ. Use it for airborne command formations, but its APC and support-equipment costs are high and it suffers major penalties in difficult terrain, rivers, and amphibious attacks.§!"
 Mech_Militia_Bat: "Zmechanizowana Milicja"
 Mech_Militia_Bat_desc: "Kompania milicji wyposażona w transportery opancerzone. Jednostki milicji wyróżniają się mniejszą ilością ciężkiego sprzętu i środków łączności w porównaniu do zwykłej piechoty. Zapewnia im to dużą mobilność i skuteczność w trudnym terenie, jednak na otwartym terenie szybko ulegają zniszczeniu w starciu z przeciwnikiem dysponującym pojazdami opancerzonymi.\n\n§G Wskazówka projektanta: Zmechanizowana milicja kosztem gospodarki zyskuje na szybkości i Twardości. Wykorzystuj ją jako niedrogie, cięższe jednostki ochrony mobilnej oraz do atakowania pieszej piechoty i artylerii; jednak słabe statystyki bojowe – w porównaniu z zawodowymi jednostkami zmechanizowanymi – uniemożliwiają jej nawiązanie równorzędnej walki z dobrze wyposażoną armią. §!"