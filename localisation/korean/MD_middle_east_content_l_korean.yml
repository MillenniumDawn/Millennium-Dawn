 gcc_autonomous: "없음"
 gcc_dominant_member_tt: "걸프협력회의의 주요 회원국임"
 GCC_campaign_for_unity: "GCC 통합을 위한 §Y캠페인§!"
 GCC_campaign_for_unity_desc: "걸프협력회의(GCC)의 결속력을 유지하기 위해서는 회원국 국민들 간의 일체감을 증진하기 위한 적극적인 노력을 기울여야 합니다."
 GCC_offer_joint_exercises_specific: "§YOffer§! to Host Joint GCC Exercises"
 GCC_offer_joint_exercises_specific_desc: "걸프 협력회의 (GCC) 회원국들 간의 합동 군사 훈련을 진행하는 것은 우리의 군사력을 증진시킬 수 있을 뿐만 아니라 걸프 협력회의 (GCC)의 단결성을 높여주며 우리의 군대들이 더욱 협력 할 수 있도록 해줄 것입니다."
 GCC_start_joint_exercises_specific: "§YStart§! Joint GCC Exercises"
 GCC_start_joint_exercises_specific_desc: "걸프 협력회의 (GCC) 회원국들 간의 합동 군사 훈련을 진행하는 것은 우리의 군사력을 증진시킬 수 있을 뿐만 아니라 걸프 협력회의 (GCC)의 단결성을 높여주며 우리의 군대들이 더욱 협력 할 수 있도록 해줄 것입니다."
 GCC_joint_drill: "걸프협력회의 합동 훈련"
 GCC_request_bloc_arms_sales: "§YRequest§! Bloc Arms Sale from External Backer"
 GCC_request_bloc_arms_sales_desc: "외부 지원국이 GCC 회원국 개별국이 아닌 GCC 전체에 무기를 공급하는 것은 우리에게 절실히 필요한 물자를 확보하는 데 도움이 될 뿐만 아니라, GCC 회원국 군대 간의 효율적인 합동 작전 능력 향상에도 기여할 것입니다."
