 MDRC_form_pan_african_2: "Proclaim the African Union"
 MDRC_form_pan_african_2_desc: "Constitute African Union through a regional charter. Requires the listed political programme, an eligible governing party, peace, and all highlighted territory under direct or puppet ownership and control. Costs 10 treasury and 300 political power. Puppets remain separate countries. The new national spirit brings shared institutions and ongoing administrative or military costs; territorial cores require later integration decisions. This is an alternate-history political union, not a reconstruction of exact historical borders."
 MDRC_union_pan_african_2: "African Union: Regional Administration"
 MDRC_union_pan_african_2_desc: "Shared institutions support the union but require ongoing expenditure. This replaces the earlier union charter, if present. Puppets retain their autonomy until a separately chosen and accepted accession offer."
