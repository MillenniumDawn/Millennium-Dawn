 BLR_Rec_tank_0: "BRDM-2"
 BLR_Rec_tank_0_desc: "기갑 정찰 및 순찰 차량. 보안 수준이 낮고 갑옷은 소형 무기 총알과 파편으로부터만 보호합니다. 자동차의 주요 특징은 매우 높은 크로스 컨트리 능력입니다."
 BLR_Rec_tank_0_short: "BRDM-2"
 BLR_Rec_tank_1: "BRM-1K"
 BLR_Rec_tank_1_desc: "BMP-1을 기반으로 개발된 추적 전투 정찰 차량입니다. 전장에서의 정찰을 위해 설계되었습니다. 물 장애물을 헤엄쳐 통과할 수 있습니다. 73mm 발사대와 7.62mm 기관총을 장비하고 있습니다. 차량의 정원은 6명입니다."
 BLR_Rec_tank_1_short: "BRM-1K"
 BLR_Rec_tank_2: "MBTS 카이만"
 BLR_Rec_tank_2_desc: "정찰 및 특수부대를 위한 이동식 장갑차입니다. 이 개체는 정찰 및 사보타주 작전 수행, 순찰 및 호송대 호위, 평화 유지 및 경찰 작전 수행, 비상 상황에서의 작전 수행을 위한 차량으로 사용되도록 고안되었습니다."
 BLR_Rec_tank_2_short: "카이만"
 BLR_APC_1: "BTR-60"
 BLR_APC_1_desc: "One of the oldest vehicles still in service, the BTR-60 has a 14.5mm KPVT heavy machine gun with 500 rounds. The secondary weapon is a 7.62mm PKT coaxial machine gun with 2,000 rounds. Great for light infantry movements, and QRFs."
 BLR_APC_1_short: "BTR-60"
 BLR_APC_2: "MT-LB"
 BLR_APC_2_desc: "1970년대에 만들어진 장비입니다. 싸고 빠르게 만들어졌으며, 소형 대공화기나 대보병용으로 운용했습니다."
 BLR_APC_2_short: "MT-LB"
 BLR_APC_3: "BTR-70"
 BLR_APC_3_desc: "BTR-70은 1972년 소련-아프가니스탄 전쟁에서 군대를 이동시켜 화력을 지원하는데 사용되었습니다. BTR-60과의 유일한 차이점은 장갑이 더 무겁다는 점입니다."
 BLR_APC_3_short: "BTR-70"
 BLR_APC_4: "BTR-80"
 BLR_APC_4_desc: "BTR-80은 8륜 수륙양용 병력 수송 장갑차(APC)로 소련에서 개발되었습니다. 1986년 배치되기 시작하여 이전의 차량인 BTR-60, BTR70들을 대체하기 시작했습니다. 아프가니스탄전에서 처음 그 실력을 발휘했습니다."
 BLR_APC_4_short: "BTR-80"
 BLR_APC_5: "BTR-90"
 BLR_APC_5_desc: "테러리스트와 싸우기 위해 1994년에 생산되었습니다. 강력한 무기인 30mm 시퍼노브 2A42 포를 500발의 포탄과 함께 장착하고 있습니다."
 BLR_APC_5_short: "BTR-90"
 BLR_APC_6: "Volat V2"
 BLR_APC_6_desc: "MZKT-690003 볼랏 V-2는 8x8 바퀴 배열을 갖춘 벨라루스의 전륜구동 장갑차입니다."
 BLR_APC_6_short: "Volat V2"
 BLR_IFV_1: "BMP-1"
 BLR_IFV_1_desc: "BMP-1은 소련제 수륙양용 궤도형 보병 전투 차량입니다. 소련-아프가니스탄 전쟁에서 병력 수송 및 지하디스트와의 전투에 사용되었습니다. 73mm 2A28 주포와 대전차 미사일 발사기를 장착하고 있습니다."
 BLR_IFV_1_short: "BMP-1"
 BLR_IFV_2: "BMP-2"
 BLR_IFV_2_desc: "BMP-2는 지하드 주의자들이 가장 두려워 하던 차량으로 30mm 캐논과 캐터필러를 가져 굉장히 빠르고 효율적입니다."
 BLR_IFV_2_short: "BMP-2"
 BLR_IFV_3: "BMP-2M"
 BLR_IFV_3_short: "BMP-2M"
 BLR_IFV_4: "BMP-3"
 BLR_IFV_4_desc: "BMP-3는 소련의 보병 전투 차량(IFV)로 BMP-1과 BMP-2를 계승하는 차량입니다. 100mm 포로 고폭탄을 발사합니다."
 BLR_IFV_4_short: "BMP-3"
 BLR_IFV_5: "BMP-3M"
 BLR_IFV_5_desc: "BMP-3M은 소련의 보병 전투 차량(IFV)로 BMP-1과 BMP-2를 계승하는 차량인 동시에 BMP-3의 개량형입니다. 포와 엔진을 향상시켰습니다."
 BLR_IFV_5_short: "BMP-3M"
 BLR_MBT_1: "T-62/64"
 BLR_MBT_1_desc: "소련이 생산한 전차 중 가장 거대한 전차. 냉전 초기 설계 및 생산된 이 전차는 붉은 군대의 주력이자 핵심 전력이었다. 한때 러시아의 힘을 상징하며 공포의 대상이었던 이 전차는 이제 미군의 공습으로 파괴되는 중동 기갑 부대의 상징적인 이미지로 자리 잡았다."
 BLR_MBT_1_short: "T-62/64"
 BLR_MBT_2: "T-72"
 BLR_MBT_2_desc: "T-72는 아마도 러시아가 생산한 가장 성공적인 디자인일 것입니다. 그것은 냉전 말기 소련군의 정점이었고, 수천 대가 생산되었으며, 오늘날까지도 러시아군의 중추 역할을 하고 있습니다. 비록 중동 분쟁에서 치명적인 실패로 악명이 높았지만, T-72는 미래의 러시아 전차 설계를 위한 개발 플랫폼으로 여전히 사용되고 있으며 오늘날 현대전의 기준에 부합하도록 끊임없는 수정과 업그레이드가 이루어졌습니다. 한때 소련군의 창이었던 전차를 과소평가하지 마십시오."
 BLR_MBT_2_short: "T-72"
 BLR_MBT_3: "T-80"
 BLR_MBT_3_desc: "단일 가스 터빈 동력 장치를 탑재한 전차. 세계 최초로 반응장갑(ERA)이 내장된 주력 전차. 로켓포와 기관총으로 무장한 이 궤도형 고기동 전투 차량은 대량살상무기 사용 상황을 포함한 광범위한 전투 임무를 24시간 내내 수행할 수 있도록 설계되었습니다."
 BLR_MBT_3_short: "T-80"
 BLR_MBT_4: "T-90"
 BLR_MBT_4_desc: "1993년에 채택된 러시아의 주력 전차 T-90은 2001년부터 2010년까지 세계에서 가장 많이 팔린 신형 주력 전차가 되었습니다. 이후 T-90A \"블라디미르\"와 T-90M \"프롤리프\"라는 두 가지 주요 개량형이 개발되었습니다."
 BLR_MBT_4_short: "T-90"
 BLR_MBT_5: "OB-477"
 BLR_MBT_5_short: "OB-477"
 BLR_Heavy_Anti_tank_1: "9P148 콘쿠르스"
 BLR_Heavy_Anti_tank_1_desc: "AT-5 Spandrel (Konkurs) created on the basis of the BRDM-2 armored reconnaissance and patrol vehicle. The main purpose is the transportation, guidance and launch of anti-tank guided missiles. It is capable of hitting with missiles both moving targets moving at speeds up to 60 km / h, and stationary targets such as bunkers and pillboxes in conditions of optical visibility."
 BLR_Heavy_Anti_tank_2: "9P148 Konkurs"
 BLR_Heavy_Anti_tank_2_desc: "AT-6 Spiral (Shturm-S) designed to destroy modern and promising tanks, including those equipped with dynamic protection, small-tonnage surface targets, low-flying air targets, defensive structures, manpower in shelters and on open areas day and night in simple and difficult weather conditions and in the presence of dust and smoke interference."
 BLR_SP_Anti_Air_0: "ZSU-23-4 실카"
 BLR_SP_Anti_Air_0_desc: "소련제 대공 자주포. 23mm 자동 4연장 기관포로 무장. 분당 발사 속도는 3400발. 수동, 반자동, 자동 조준 가능. 지상군 직접 지원, 최대 사거리 2500m, 고도 1500m, 속도 450m/s의 공중 목표물, 그리고 최대 사거리 2000m의 지상 목표물 파괴용으로 설계됨."
 BLR_SP_Anti_Air_1: "SA-8 오사"
 BLR_SP_Anti_Air_1_desc: "SA-8 게코(오사)는 소련제 자동화 대공 미사일 시스템입니다. 이 시스템은 전천후 운용이 가능하며, 모든 유형의 전투 작전에서 기계화 보병 사단(전차 사단)의 병력과 물자를 보호하도록 설계되었습니다."
 BLR_SP_Anti_Air_2: "SA-15 토르-M2"
 BLR_SP_Anti_Air_2_desc: "SA-15 Gauntlet (Tor) - short-range self-propelled anti-aircraft missile system \"Tor-M2\" is designed to destroy aircraft, helicopters, cruise, anti-radar and other guided missiles, gliding and guided bombs and unmanned aerial vehicles within the zone of destruction of the complex in conditions of intense fire and radio-optical-electronic countermeasures in all weather conditions, day and night."
 BLR_SP_R_arty_0: "BM-21 그라드"
 BLR_SP_R_arty_0_desc: "구경 122mm의 소련제 다연장로켓발사시스템(MLRS)입니다. 집결 지역의 노출 및 엄폐 병력, 비장갑 차량과 장갑차, 포병 및 박격포 포대, 지휘소와 기타 표적을 파괴하도록 설계되었습니다. 일제사격당 로켓 수는 40발입니다."
 BLR_SP_R_arty_1: "BM-27 우라간"
 BLR_SP_R_arty_1_desc: "구경 220mm의 소련제 다연장로켓발사시스템입니다. \\"그라드\\"에 비해 사거리뿐만 아니라 타격 범위가 최대 42헥타르까지 늘어났으며, 정확도도 전작의 1.5배를 넘어섰습니다. 일제사격당 로켓 수는 16발입니다."
 BLR_SP_R_arty_2_desc: "벨라루스의 301mm 다연장 로켓 시스템입니다. 노출 및 엄폐된 병력, 비장갑 및 장갑 군사 장비, 기타 대상을 고정밀로 파괴하도록 설계된 체계입니다. 사거리는 처음에는 최대 200km였으나, 이후 신형 미사일 사용으로 300km까지 늘어났습니다."
 BLR_SP_arty_0: "2S3 아카치야"
 BLR_SP_arty_0_desc: "소련제 152mm 사단급 자주 곡사포입니다. 병력, 포병 및 박격포 포대, 로켓 발사기, 전차, 화기, 지휘소, 전술 핵공격 수단을 제압하고 파괴하도록 설계되었습니다."
 BLR_SP_arty_1: "2S19 므스타-S"
 BLR_SP_arty_1_desc: "소련 및 러시아제 152mm 사단급 자주 곡사포입니다. 아카치야에 비해 므스타-S는 고폭 파편탄과 로켓 추진탄의 사거리가 크게 늘어났고 발사 속도도 높아졌습니다. 또한 2S19의 탄약 적재량에는 위력이 증대된 포탄이 포함되어 있어 그 효과가 이전 포탄을 1.3~1.5배 능가합니다."
 BLR_SP_arty_2: "2S19M2 므스타-SM"
 BLR_SP_arty_2_desc: "이 자주 곡사포는 므스타-S 플랫폼을 21세기로 끌어올린 것으로, 자동 사격 통제 체계와 GLONASS 지원을 갖추고 있습니다. 발사 속도는 2.5배 증가했고 조준 정확도가 향상되었으며, 한 문의 포로 다섯 발을 한꺼번에 표적에 명중시킨 뒤 사격 진지를 이탈할 수 있는 사격 급습 모드가 도입되었습니다. 또한 승무원의 거주 환경도 개선되었습니다."
 BLR_SP_arty_3: "2S35 코알리치야-SV"
 BLR_SP_arty_3_desc: "T-90 전차를 기반으로 한 러시아의 152mm 군종 공용 포 체계입니다. 므스타-SM에 비해 이 장비는 최대 사거리가 크게 늘었고(29km에서 80km로) 발사 속도도 1.5배 빨라졌습니다. 같은 자주포에서 발사되어 서로 다른 탄도를 비행하는 여러 포탄으로 표적을 동시에 타격할 수 있습니다. 사격은 완전 자동화되어 전투실에 포 승무원이 필요하지 않습니다."
 BLR_artillery_1: "D-30"
 BLR_artillery_1_desc: "122mm 소련제 견인 곡사포입니다. 세계 여러 나라에서 운용 중이며, 많은 군사 분쟁에서 사용되었고 지금도 사용되고 있습니다. 최대 사거리는 22km입니다."
 BLR_artillery_2: "2A65 Msta-B"
 BLR_artillery_2_desc: "견인식 152mm 곡사포입니다. 전작에 비해 몇 가지 근본적인 혁신이 적용되었습니다. 이중 슬롯 포구 제동기를 갖춘 길고 가는 포신, 2단 포가, 사격 시 바퀴를 들어 올리기 위해 받침대 아래에 설치된 플랫폼이 달린 유압 잭입니다. 발사 기구와 반자동 포미 덕분에 전투 발사 속도를 분당 7발까지 높일 수 있습니다. 최대 사거리는 28.9km입니다."
 BLR_artillery_3: "2A65M2 Msta-BM"
