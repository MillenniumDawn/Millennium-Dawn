 peacekeepers_occupying_our_territory: "占领我们领土的维和部队"
 australian_sanctions: "澳大利亚制裁"
 australian_sanctions_desc: "澳大利亚政府目前对我们实施的制裁对我们与盟友的贸易产生了虽小但切实的影响。"
 malaysia_aus_trade_deal_ast: "马来西亚贸易协议"
 australian_peacekeeping: "澳大利亚维和部队"
 australian_peacekeeping_desc: "为了协助我们应对持续存在的安全挑战，澳大利亚维和人员已被部署到位，协助恢复稳定、提供军事支持和援助。"
