 module_naval_anti_ship_drone_torpedoes_1: "Torpille en réseau I"
 module_naval_anti_ship_drone_torpedoes_1_desc: "Les drones-torpilles en réseau permettent des attaques à distance avec un engagement minimal de personnel, permettant aux flottes de projeter la létalité sans exposer les équipages. Leur fusée intelligente et la sélection du point d'impact maximisent les chances de dégâts catastrophiques au contact, rendant les coups critiques bien plus probables. Les matériaux, l'électronique et les systèmes de propulsion avancés requis élèvent les coûts globaux en ressources.\n\n§GIndice du concepteur : les torpilles drones offrent une attaque de torpille et une lutte anti-sous-marine tout en améliorant la chance de toucher et en réduisant fortement les besoins en main-d'œuvre. Conviennent aux conceptions de frappe précises à faible équipage, mais exigent davantage de puces.§!\n§GIndice concepteur : les torpilles-drones offrent attaque à la torpille et lutte anti-sous-marine tout en améliorant la chance de coup de torpille et en réduisant fortement les besoins en effectifs. Elles conviennent aux conceptions de frappe précises à faible équipage, mais exigent des quantités croissantes de microprocesseurs.§!"
 module_naval_anti_ship_drone_torpedoes_2: "Torpille II en réseau"
 module_naval_anti_ship_drone_torpedoes_2_desc: "$module_naval_anti_ship_drone_torpedoes_1_desc$"
 module_naval_anti_ship_drone_torpedoes_3: "Torpille III en réseau"
 module_naval_anti_ship_drone_torpedoes_3_desc: "$module_naval_anti_ship_drone_torpedoes_1_desc$"
 module_naval_anti_ship_drone_torpedoes_4: "Torpille IV en réseau"
 module_naval_anti_ship_drone_torpedoes_4_desc: "$module_naval_anti_ship_drone_torpedoes_1_desc$"
 module_naval_anti_torpedo_1: "Système de défense anti-torpille I"
 module_naval_anti_torpedo_1_desc: "Les systèmes de défense anti-torpilles combinent une détection sous-marine rapide et des contre-mesures automatisées pour réduire la menace des torpilles modernes.\n\n§GIndice du concepteur : la défense anti-torpilles réduit la chance de coup critique des torpilles ennemies, limitant les frappes les plus destructrices. Utile contre les flottes riches en torpilles, mais occupe un emplacement de missile et ajoute des coûts de production, de carburant et de main-d'œuvre.§!"
 module_naval_anti_torpedo_2: "Système de défense anti-torpille II"
 module_naval_anti_torpedo_2_desc: "$module_naval_anti_torpedo_1_desc$"
