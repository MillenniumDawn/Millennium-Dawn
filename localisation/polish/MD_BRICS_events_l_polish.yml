l_polish:
 brics_join.1.t: "[FROM.GetNameDef] ubiega się o członkostwo w BRICS"
 brics_join.1.d: "[FROM.GetNameDef] złożył oficjalny wniosek o przystąpienie do BRICS. Jako lider tego bloku, decyzję o ich przyjęciu podejmujemy my."
 brics_join.1.a: "Wzmacniają blok. Przyjmijcie je."
 brics_join.1.b: "Ich członkostwo nie służy naszym interesom."
 brics_join.2.t: "Nasze zgłoszenie zostało przyjęte."
 brics_join.2.d: "Grupa BRICS zatwierdziła nasz wniosek o członkostwo. Zajmujemy miejsce wśród państw tego bloku."
 brics_join.2.a: "Zajmijcie nasze miejsce w BRICS"
 brics_join.3.t: "Nasza kandydatura do BRICS została odrzucona."
 brics_join.3.d: "Przywództwo BRICS odrzuciło nasz wniosek. Drzwi nie są jednak zamknięte na zawsze i z czasem możemy ponownie podjąć starania w tej sprawie."
 brics_join.3.a: "Złożymy wniosek ponownie w późniejszym terminie"
 brics_join.3.b: "Zrezygnuj z tych starań"
 brics_join.4.t: "[ROOT.GetNameDef] Dołącz do BRICS"
 brics_join.4.d: "[ROOT.GetNameDef] został przyjęty do BRICS, co rozszerza zasięg i znaczenie tego bloku w porządku międzynarodowym."
 brics_join.4.a: "Zmieniająca się równowaga"
 brics_join.5.t: "Czas ponownie zwrócić się ku BRICS"
 brics_join.5.d: "Od czasu naszej ostatniej odmowy minęło wystarczająco dużo czasu. Możemy złożyć nowy wniosek do władz BRICS."
 brics_join.5.a: "Ponownie złóż nasz wniosek"
 brics_join.5.b: "Jeszcze nie"
 brics_join.6.t: "[FROM.GetNameDef] zaprasza nas do założenia BRICS"
 brics_join.6.d: "[FROM.GetNameDef] powołuje do życia BRICS i zaprosił nas do grona członków założycieli, byśmy od samego początku współtworzyli ten blok."
 brics_join.6.a: "Pomożemy założyć BRICS"
 brics_join.6.b: "Zachowamy dystans"
 brics_declined_membership: "Odrzucił członkostwo w BRICS."