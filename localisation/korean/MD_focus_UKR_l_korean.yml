 UKR_modernize_su25_m1k: "§YSu-25M1K§! 공격기 추가 개발"
 UKR_modernize_su25_m1k_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_su25m1k_for_tooltip\n\n\n\n\n\n\n\n\n§W§YSu-25M1K§!는 2015년 우크라이나 공군이 채택한, §R소련제§! 장갑 아음속 공격기 §YSu-25§!의 추가 개량형입니다.\n이번 현대화 작업의 핵심은 §Y\\"아드로스\\" KUV 26-50-01§! 복합 기만 플레어 투하 체계를 개장 설치해 항공기의 생존성을 높이는 것이었습니다.§!"
 UKR_developed_su25m1k_flag: " 결정 §Y§GSu-25M1K§! 공격기 추가 개발§! 완료"
