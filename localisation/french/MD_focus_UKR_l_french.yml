 ukraine_develop_btr4.8.name: "Programme de test pour le 'BTR-4' APC"
 ukraine_develop_btr4.8.desc: "We can choose the duration and complexity of pre-production tests for BTR-4 APC.\n\nWe can make the basic program and save money and time or extensive one, which will require more resources, but we may find and get rid of some of issues, visible on small-scale batch production. Eliminating them may lead to more reliable machine in the full-scale production run."
