 # Liberal Arms Export Contracts
 FRA_liberal_arms_contracts: "Liberal Arms Export Policy"
 FRA_liberal_arms_contracts_desc: "The French defense industry is one of the most advanced in the world. By adopting a liberal arms export policy, we can pursue lucrative defense contracts with nations seeking to modernize their military capabilities. This will not only boost our economy but also extend French influence abroad through military partnerships."
 FRA_liberal_arms_contracts_tt: "Over the coming months, we will propose arms contracts to §YSaudi Arabia§!, §YUnited Arab Emirates§!, §YSerbia§!, §YGreece§!, §YEgypt§!, and §YIndia§!."
 FRA_arms_contract_opinion: "Arms Contract Partnership"

 # Saudi Arabia Arms Contract Events
 france_md.323.t: "Arms Contract Proposal - Saudi Arabia"
 france_md.323.d: "Our defense ministry has prepared a proposal for an arms contract with [SAU.GetNameWithFlag]. The Saudi military is seeking to modernize its equipment, and French defense companies are eager to secure lucrative deals. What type of contract should we propose?"
 france_md.323.a: "Light weapons package ($5 billion)"
 france_md.323.b: "Heavy weapons package ($15 billion)"
 france_md.323.c: "Premium aircraft package ($30 billion)"
 france_md.323.e: "We will not pursue this contract"

 france_md.324.t: "French Arms Contract Offer"
 france_md.324.d: "[FRA.GetNameWithFlag] has proposed an arms contract to supply our military with modern French equipment. This partnership would strengthen our military capabilities and improve relations with France."
 france_md.324.a: "Accept the contract"
 france_md.324.b: "Decline the offer"

