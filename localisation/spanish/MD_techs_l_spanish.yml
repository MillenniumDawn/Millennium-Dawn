 module_vls_sub_asm_3: "Misiles antibuque VLS III"
 module_vls_sub_asm_3_desc: "Los sistemas de misiles antibuque VLS modernos integran buscadores avanzados y perfiles de vuelo rozadores de mar, lo que permite ataques de largo alcance coordinados y una mayor resistencia a las contramedidas enemigas.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor ataque antibuque y perforación de misiles antibuque, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_vls_sub_asm_4: "Misiles antibuque VLS IV"
 module_vls_sub_asm_4_desc: "Los misiles antibuque VLS altamente avanzados utilizan puntería en red y guía de precisión, permitiendo rápidos combates contra múltiples objetivos y una mejor efectividad contra las defensas navales modernas.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor ataque antibuque y perforación de misiles antibuque, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_vls_sub_asm_5: "Misiles antibuque VLS V"
 module_vls_sub_asm_5_desc: "Las plataformas de misiles antibuque VLS de próxima generación enfatizan el sigilo, la maniobrabilidad y la resistencia a la guerra electrónica, incrementando significativamente la supervivencia y el éxito de los ataques en entornos disputados.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor ataque antibuque y perforación de misiles antibuque, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_vls_sub_asm_6: "Misiles antibuque VLS VI"
 module_vls_sub_asm_6_desc: "Los sistemas de misiles antibuque VLS de vanguardia representan el cenit de la tecnología de ataque naval, combinando puntería inteligente, velocidad extrema y resistencia avanzada a las contramedidas para abrumar incluso a las flotas más sofisticadas.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor ataque antibuque y perforación de misiles antibuque, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_vls_sub_asm_7: "Misiles antibuque VLS VII"
 module_vls_sub_asm_7_desc: "Los sistemas de misiles antibuque VLS hiperavanzados representan el cenit de la tecnología de ataque naval, combinando puntería inteligente, velocidad extrema y resistencia avanzada a las contramedidas para abrumar incluso a las flotas más sofisticadas.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor ataque antibuque y perforación de misiles antibuque, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_vls_sub_asm_8: "Misiles antibuque VLS VIII"
 module_vls_sub_asm_8_desc: "Los sistemas de misiles antibuque VLS ultraavanzados representan el cenit de la tecnología de ataque naval, combinando puntería inteligente, velocidad extrema y resistencia avanzada a las contramedidas para abrumar incluso a las flotas más sofisticadas.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor ataque antibuque y perforación de misiles antibuque, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_vls_sam_1: "Misiles superficie-aire VLS I"
 module_vls_sam_2: "Misiles superficie-aire VLS II"
 module_vls_sam_3: "Misiles superficie-aire VLS III"
 module_vls_sam_4: "Misiles superficie-aire VLS IV"
 module_vls_sam_5: "Misiles superficie-aire VLS V"
 module_vls_sam_6: "Misiles superficie-aire VLS VI"
 module_vls_sam_7: "Misiles superficie-aire VLS VII"
 module_vls_sam_8: "Misiles superficie-aire VLS VIII"
 module_vls_sam_1_desc: "Los primeros sistemas de misiles superficie-aire basados en VLS proporcionan a los buques de guerra una defensa aérea de zona extendida contra aeronaves y misiles entrantes. La integración del lanzamiento vertical optimiza el tiempo de reacción y la capacidad de combate en todos los aspectos.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor blindaje y estadísticas antiaéreas, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_vls_sam_2_desc: "Los misiles superficie-aire VLS mejorados cuentan con guía por radar perfeccionada y un mayor alcance de combate, fortaleciendo la defensa aérea de la flota contra amenazas aéreas coordinadas.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor blindaje y estadísticas antiaéreas, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_vls_sam_3_desc: "Los sistemas de misiles superficie-aire VLS modernos incorporan buscadores avanzados y una mejor resistencia a las contramedidas, permitiendo una interceptación más fiable de objetivos rápidos y de baja observabilidad (sigilo).\n\n§GConsejo de diseño: Este módulo proporcionará un mayor blindaje y estadísticas antiaéreas, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_vls_sam_4_desc: "Las plataformas SAM VLS altamente avanzadas integran sensores en red y sistemas de control de tiro mejorados, permitiendo combates coordinados contra múltiples objetivos en entornos de alta densidad de amenazas.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor blindaje y estadísticas antiaéreas, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_vls_sam_5_desc: "Los misiles superficie-aire VLS de próxima generación enfatizan un alcance extendido, una alta maniobrabilidad y una resistencia superior a la guerra electrónica, mejorando significativamente las capacidades de defensa aérea por capas.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor blindaje y estadísticas antiaéreas, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_vls_sam_6_desc: "Los sistemas de misiles superficie-aire VLS de vanguardia representan la cúspide de la defensa aérea naval, combinando guía inteligente, rangos de combate extremos y una integración perfecta con las redes de sensores de toda la flota para contrarrestar las amenazas aéreas más avanzadas.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor blindaje y estadísticas antiaéreas, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_vls_sam_7_desc: "Los sistemas de misiles superficie-aire VLS hiperavanzados representan la cúspide de la defensa aérea naval, combinando guía inteligente, rangos de combate extremos y una integración perfecta con las redes de sensores de toda la flota para contrarrestar las amenazas aéreas más avanzadas.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor blindaje y estadísticas antiaéreas, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_vls_sam_8_desc: "Los sistemas de misiles superficie-aire VLS ultraavanzados representan la cúspide de la defensa aérea naval, combinando guía inteligente, rangos de combate extremos y una integración perfecta con las redes de sensores de toda la flota para contrarrestar las amenazas aéreas más avanzadas.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor blindaje y estadísticas antiaéreas, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC).§!"
 module_vls_lam_1: "Misil de ataque a tierra VLS I"
 module_vls_lam_2: "Misil de ataque a tierra VLS II"
 module_vls_lam_3: "Misil de ataque a tierra VLS III"
 module_vls_lam_4: "Misil de ataque a tierra VLS IV"
 module_vls_lam_5: "Misil de ataque a tierra VLS V"
 module_vls_lam_6: "Misil de ataque a tierra VLS VI"
 module_vls_lam_7: "Misil de ataque a tierra VLS VII"
 module_vls_lam_1_desc: "Los primeros sistemas de misiles de ataque a tierra basados en VLS permiten a los buques de guerra golpear objetivos terrestres desde larga distancia. Aunque tienen una precisión y flexibilidad limitadas, estas armas proporcionan un valioso apoyo de fuego a distancia segura (stand-off).\n\n§GConsejo de diseño: Este módulo proporcionará un mayor ataque de cañón para el bombardeo costero, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC) y una reducción en la perforación de cañón.§!"
 module_vls_lam_2_desc: "Los misiles de ataque a tierra mejorados cuentan con sistemas de guía perfeccionados y un alcance mayor, lo que permite realizar ataques más precisos contra objetivos estratégicos y tácticos en el interior del territorio.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor ataque de cañón para el bombardeo costero, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC) y una reducción en la perforación de cañón.§!"
 module_vls_lam_3_desc: "Los sistemas de misiles de ataque a tierra VLS modernos incorporan navegación avanzada, perfiles de vuelo de seguimiento del terreno y una supervivencia optimizada, incrementando significativamente la efectividad de los ataques de precisión.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor ataque de cañón para el bombardeo costero, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC) and una reducción en la perforación de cañón.§!"
 module_vls_lam_4_desc: "Las plataformas de misiles de ataque a tierra altamente avanzadas integran puntería en red y actualizaciones de la misión en tiempo real, lo que permite ataques flexibles y coordinados contra objetivos de alto valor.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor ataque de cañón para el bombardeo costero, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC) y una reducción en la perforación de cañón.§!"
 module_vls_lam_5_desc: "Los misiles de ataque a tierra VLS de vanguardia representan el cenit de la capacidad de ataque de precisión naval, combinando una exactitud extrema, un alcance prolongado y una resistencia robusta a las contramedidas para proyectar poder mucho más allá de la línea costera.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor ataque de cañón para el bombardeo costero, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC) y una reducción en la perforación de cañón.§!"
 module_vls_lam_6_desc: "Los misiles de ataque a tierra VLS hiperavanzados representan el cenit de la capacidad de ataque de precisión naval, combinando una exactitud extrema, un alcance prolongado y una resistencia robusta a las contramedidas para proyectar poder mucho más allá de la línea costera.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor ataque de cañón para el bombardeo costero, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC) y una reducción en la perforación de cañón.§!"
 module_vls_lam_7_desc: "Los misiles de ataque a tierra VLS ultraavanzados representan el cenit de la capacidad de ataque de precisión naval, combinando una exactitud extrema, un alcance prolongado y una resistencia robusta a las contramedidas para proyectar poder mucho más allá de la línea costera.\n\n§GConsejo de diseño: Este módulo proporcionará un mayor ataque de cañón para el bombardeo costero, junto con un aumento de puntos de vida, a costa de un mayor coste de capacidad industrial (IC) y una reducción en la perforación de cañón.§!"
