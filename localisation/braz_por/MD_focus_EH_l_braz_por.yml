l_braz_por:
 event_horizon_generic_focus: "Árvore de Foco da Humanidade"
 chimera_focus: "Árvore de Foco da Quimera"
 EH_set_up_electric_trap: "Montar Armadilha Elétrica"
 EH_remove_electric_trap: "Remover Armadilha Elétrica"
 EH_activate_electric_trap: "Ativar Armadilha Elétrica"
 EH_drone_mission_category: "Missão de Drone"
 EH_drone_mission_category_desc: "\n£EH_gui_drone_picture\n\n\n\nOs drones são nossas melhores e mais seguras ferramentas de reconhecimento. Graças a eles, podemos reunir informações sobre o inimigo sem arriscar a vida de nossos soldados. Podemos usá-los para explorar o Portal próximo e ver o que o inimigo está construindo ao redor dele, talvez nos permitindo obter uma vantagem tática durante a batalha contra uma dessas coisas."
 EH_research_sites_category: "Locais de Pesquisa"
 EH_research_sites_category_desc: "Os Locais de Pesquisa são nossa melhor forma de reunir mais informações sobre a Quimera e sua tecnologia. Esses postos atrairão os melhores cientistas disponíveis, além de render bônus de pesquisa para nossos projetos especiais. Só esperamos que as forças da Quimera não os notem rápido demais."
 EH_setup_research_site: "Montar Local de Pesquisa"
 EH_install_anti_air_weapons: "Instalar Armas Antiaéreas"
 EH_panic_shelters_and_land_turrets: "Construir Abrigos de Emergência e Torres Terrestres"
 EH_hire_additional_security_for_scientists: "Contratar Segurança Adicional para os Cientistas"
 EH_disable_site_notifications: "Desativar Notificações de Ataque aos Locais de Pesquisa"
 EH_enable_site_notifications: "Ativar Notificações de Ataque aos Locais de Pesquisa"
 EH_doudna_or_charpentier_project_mission: "Projeto Especial de §YJennifer Doudna§! e §YEmmanuelle Charpentier§!"
 EH_doudna_or_charpentier_project_mission_desc: "§YJennifer Doudna§! e §YEmmanuelle Charpentier§! estão trabalhando em um projeto especial que pode nos ajudar a entender melhor a composição genética da Quimera. Sua especialização na tecnologia de edição genética CRISPR pode fornecer percepções inestimáveis sobre as fraquezas dessas criaturas, permitindo desenvolver estratégias mais eficazes para combatê-las."
 EH_find_new_veins_category: "Encontrar Novos Veios de Randallita"
 EH_find_new_veins_category_desc: "A Randallita é um recurso raro e valioso encontrado em certos veios ao redor do mundo. É essencial para nossa pesquisa e desenvolvimento de novas tecnologias para combater a Quimera. Investindo em exploração e mineração, aumentamos nossas chances de encontrar novos veios de Randallita e garantir um suprimento constante desse recurso crucial.\n\nCada mina de Randallita fornecerá uma pequena quantidade de Randallita por semana. Precisamos encontrar e proteger o máximo possível de pontos quentes antes que as grandes corporações assumam a extração desse recurso e nos forcem a tomar decisões desagradáveis."
 EH_search_for_randallite_veins: "Procurar Veios de Randallita"
 EH_set_up_mine_mission: "Montando Nova Mina"
 EH_large_company_seeks_for_randallite_mission: "Grande Corporação Busca Randallita"
 EH_outlaw_randallite_extraction: "Proibir a Extração Privada de Randallita"
 EH_legalize_randallite_extraction: "Legalizar a Extração Privada de Randallita"
 EH_construct_southern_zenobia_defense_line: "Construir Linha de Defesa da §GZenóbia do Sul§!"
 EH_construct_western_zenobia_defense_line: "Construir Linha de Defesa da §GZenóbia Ocidental§!"
 EH_construct_inner_saladin_defense_line: "Construir Linha de Defesa do §GSaladino Interno§!"
 EH_construct_outer_saladin_defense_line: "Construir Linha de Defesa do §GSaladino Externo§!"
 EH_southern_zenobia_defense_line_destruction: "Linha de Defesa da Zenóbia do Sul Ruindo"
 EH_western_zenobia_defense_line_destruction: "Linha de Defesa da Zenóbia Ocidental Ruindo"
 EH_inner_saladin_defense_line_destruction: "Linha de Defesa do Saladino Interno Ruindo"
 EH_outer_saladin_defense_line_destruction: "Linha de Defesa do Saladino Externo Ruindo"
 EH_nile_defense_line_category: "Linhas de Defesa Zenóbia e Saladino"
 EH_nile_defense_line_category_desc: "As Linhas de Defesa do Nilo são nossa melhor chance de conter as forças da Quimera na África. A Linha Zenóbia será nossa primeira linha de defesa, enquanto a Linha Saladino será nossa última esperança caso a Zenóbia caia. Precisamos garantir que ambas as linhas estejam bem fortificadas e guarnecidas, pois serão a chave para nossa sobrevivência nesta guerra."
 EH_bosporus_defense_line_category: "Linha de Defesa do Bósforo"
 EH_bosporus_defense_line_category_desc: "A Linha de Defesa do Bósforo é nossa melhor chance de conter as forças da Quimera na Europa. A linha será fortificada com artilharia pesada e defesas antiaéreas, além de uma rede de trincheiras e bunkers. Os exércitos da maioria das nações europeias ficarão estacionados ali. Precisamos garantir que a linha resista."
 EH_construct_bosphorus_defense_line: "Construir Linha de Defesa do §GBósforo§!"
 EH_bosphorus_defense_line_destruction: "Linha de Defesa do Bósforo Ruindo"
 EH_caucasus_defense_line_category: "Linha de Defesa do Cáucaso"
 EH_caucasus_defense_line_category_desc: "O inimigo avança rapidamente pelo Oriente Médio, ameaçando nossas fronteiras ao sul. A Linha de Defesa do Cáucaso é nossa melhor chance de conter as forças da Quimera nesta região. A fortificação será um sistema de defesa em duas camadas, com a primeira linha composta de trincheiras e bunkers e a segunda fortificada com artilharia pesada e defesas antiaéreas. Precisamos garantir que a linha resista e esperar que contenhamos a Quimera no Tibete, a menos que nossa linha de defesa desmorone pela retaguarda."
 EH_construct_caucasus_defense_line: "Construir Linha de Defesa do §GCáucaso§!"
 EH_caucasus_defense_line_destruction_1: "Primeira Linha de Defesa do Cáucaso Ruindo"
 EH_caucasus_defense_line_destruction_2: "Segunda Linha de Defesa do Cáucaso Ruindo"
 EH_event.0.t: "Bem-vindo ao Event Horizon!"
 EH_event.0.d: "Event Horizon é o nosso primeiro grande cenário especial, feito para celebrar 1 milhão de inscritos na Steam Workshop. É um cenário focado em guerra, onde a humanidade luta pela sobrevivência contra invasores alienígenas desconhecidos. O cenário traz uma árvore de foco exclusiva, novos eventos, decisões, mecânicas, unidades e recursos que o imergirão nesta épica batalha pela sobrevivência. Prepare-se para enfrentar o desconhecido e levar a humanidade à vitória, e obrigado pelo seu apoio!"
 EH_event.0.a: "Uhuuuu!!! Peraí, ALIENÍGENAS?!!!"
 EH_event.1.t: "As Linhas Zenóbia e Saladino Estão em Construção"
 EH_event.1.d: "Em resposta à crescente ameaça vinda da África subsaariana, a Aliança do Oriente Médio autorizou a rápida construção de uma linha de defesa fortificada ao longo dos setores do sul do Nilo e do deserto ocidental do Egito. Designada Linha Zenóbia, essa posição abrigará posições de artilharia pesada e sistemas de trincheiras nas principais vias de aproximação.\n\nSe a linha Zenóbia cair, a linha Saladino resistirá logo atrás. Abrangendo toda a zona do canal, de Port Said ao Mar Vermelho, essa fortificação servirá como a linha de defesa absoluta.\n"
 EH_event.1.a: "Que o deserto seja o nosso escudo"
 EH_event.300.t: "O CERN Vai Além"
 EH_event.300.d: "Pesquisadores da Organização Europeia para a Pesquisa Nuclear (CERN) conduziram com sucesso uma colisão controlada de alta energia que resultou na criação temporária do que está sendo descrito como uma 'anomalia interdimensional localizada'.\n\nEmbora a fenda tenha sido medida em nível subatômico e durado apenas uma fração de nanossegundo, ela marca o primeiro registro de assinaturas de energia inconsistentes com as leis físicas conhecidas. Os protocolos iniciais de contenção funcionaram e nenhuma transferência de matéria foi observada, mas as implicações já causam abalos na comunidade científica global.\n\nA linha entre o teórico e o real acaba de se turvar."
 EH_event.300.a: "Isso é mesmo seguro?"
 EH_event.301.t: "Comboio da ONU Desaparecido na África Central"
 EH_event.301.d: "Um comboio humanitário das Nações Unidas que operava na região de fronteira entre Ruanda e a República Democrática do Congo perdeu contato. Imagens de satélite mostram sinais de destroços e veículos tombados espalhados por uma rota na selva, mas nenhum sinal de socorro foi recebido.\n\nNenhum sobrevivente ou corpo foi encontrado. Nenhuma facção rebelde assumiu a responsabilidade. A causa do incidente permanece oficialmente desconhecida."
 EH_event.301.a: "Mais um ataque contra as forças de paz da ONU..."
 EH_event.302.t: "Atividade Sísmica Incomum na Bacia do Tarim"
 EH_event.302.d: "Um conjunto de tremores rasos e de alta frequência foi registrado na Bacia do Tarim, no oeste da China. Os padrões sísmicos são incompatíveis com o movimento tectônico natural ou com qualquer atividade subterrânea conhecida. As autoridades chinesas não divulgaram comunicado, mas dados sismológicos regionais compartilhados discretamente por meio de um programa de intercâmbio universitário levantaram sobrancelhas entre os geofísicos."
 EH_event.302.a: "As leituras não fazem sentido"
 EH_event.303.t: "Silêncio de Rádio nos Pamires"
 EH_event.303.d: "Um posto de escuta do Exército de Libertação Popular em grande altitude, perto da fronteira sino-tadjique, cessou toda a comunicação. Nenhuma palavra oficial veio de Pequim, mas um radioamador cazaque relatou ter ouvido uma breve transmissão de emergência em mandarim antes do silêncio total. Satélites de inteligência mostram sinais visíveis de danos."
 EH_event.303.a: "Foi um ataque tadjique?"
 EH_event.304.t: "Guardas Florestais Desaparecidos no Norte do Alasca"
 EH_event.304.d: "Dois guardas florestais de parques nacionais que patrulhavam um setor remoto do Parque Nacional Denali foram declarados desaparecidos após não se reportarem por 72 horas. Uma equipe de busca foi enviada, apenas para descobrir o acampamento abandonado deles, com claros sinais de luta.\n\nEmbora a história tenha sido noticiada apenas por jornais locais no início, ela passou a ganhar repercussão nacional e internacional quando a equipe de busca também desapareceu sem deixar rastros. O FBI abriu uma investigação e uma caçada está em andamento."
 EH_event.304.a: "Um assassino à solta?"
 EH_event.305.t: "Surto Estranho nas Terras Altas Peruanas"
 EH_event.305.d: "Uma aldeia remota nas terras altas andinas do sul do Peru foi posta em quarentena pelas autoridades de saúde regionais após um surto misterioso. Os relatos iniciais descrevem febre, alucinações e desorientação sensorial aguda entre os moradores. Os sintomas surgiram rapidamente após um 'clarão de luz' e um tremor sentidos apenas em um vale estreito perto da aldeia.\n\nAutoridades peruanas afirmam ser uma infecção fúngica isolada, mas ONGs que atuam na região dizem que as equipes médicas foram escoltadas por militares. Um geólogo da Universidade Nacional de San Marcos, parte de uma equipe de pesquisa que mapeava cavernas próximas, está entre os desaparecidos."
 EH_event.305.a: "Mantenham-nos informados"
 EH_event.306.t: "Agitação em Xinjiang: Base Militar Atacada"
 EH_event.306.d: "Um incidente violento ocorreu perto de Kashgar, no oeste de Xinjiang. A mídia estatal chinesa está em silêncio, mas relatórios de inteligência indicam que a Base 36, uma instalação do Exército de Libertação Popular perto de Yecheng, foi invadida durante a noite por elementos hostis não identificados. A descrição transmitida por rádio fez pouco sentido quanto à verdadeira natureza dos atacantes.\n\nO Exército de Libertação Popular começou o envio emergencial de unidades mecanizadas e equipes de resposta química à região. Aviões de transporte foram vistos pousando no aeroporto de Kashgar nas primeiras horas da manhã.\n\nEm uma medida rara, um destacamento russo de resposta rápida também cruzou a fronteira para a China pelo Passo de Kulma."
 EH_event.306.a: "Situação sob controle, segundo Pequim"
 EH_event.307.t: "Detonação Nuclear Tática no Oeste da China"
 EH_event.307.d: "Uma explosão nuclear tática foi detectada perto do Deserto de Taklamakan, a cerca de 120 quilômetros a leste de Kashgar. A explosão ocorreu cinco dias após unidades do Exército de Libertação Popular serem enviadas para conter a ameaça desconhecida na região.\n\nTanto Pequim quanto Moscou negaram qualquer uso de armas nucleares, mas dados sísmicos confirmam uma detonação de baixa potência compatível com uma ogiva tática russa. Imagens de satélite mostram terreno queimado, estratos geológicos colapsados e um orbe escuro em rápida expansão.\n\nObservadores internacionais pressionam por respostas, mas os canais oficiais permanecem em silêncio. Nos círculos militares, cresce a especulação de que o ataque foi uma decisão unilateral do comando de campo russo sob a doutrina de engajamento de emergência."
 EH_event.307.a: "O que está acontecendo lá?!"
 EH_event.308.t: "O Véu Se Rasga"
 EH_event.308.d: "Imagens de satélite vazadas por uma fonte de inteligência anônima viralizaram no mundo todo: um vasto orbe roxo e pulsante se eleva sobre os restos carbonizados do local do impacto, com um enxame de criaturas saindo dele. Os cientistas não sabem explicar as imagens. As filmagens mostram claramente que o ataque nuclear não o destruiu e, se algo, apenas o fez crescer. Em poucas horas, três novos portais de tamanho e efeito semelhantes surgiram:\n- No noroeste do Alasca\n- Nas terras altas do Quênia, perto do Monte Elgon\n- No sul do Chile, perto do Cabo Horn.\n\nJá chegam relatos de que as criaturas são extremamente agressivas. A era da normalidade acabou."
 EH_event.308.a: "A verdade não pode mais ser negada"
 EH_event.309.t: "A ONU Convoca uma Assembleia de Emergência"
 EH_event.309.d: "Com o pânico público crescendo e a confiança nos governos nacionais fraquejando, as Nações Unidas entraram em sessão de emergência. A Assembleia Geral invocou poderes de crise raramente usados, e o Conselho de Segurança está em debate urgente sobre estratégias de resposta coordenada.\n\nAs propostas vão de cooperação militar global a forças-tarefa científicas conjuntas. As tensões aumentam entre os membros permanentes, à medida que as culpas circulam e as agendas colidem.\n\nMas, se os primeiros relatos de combate servem de indício, uma verdade já é clara: a humanidade deve permanecer unida ou enfrentar a extinção."
 EH_event.309.a: "Uma resposta global começa a tomar forma"
 EH_event.310.t: "Um Comando Unificado"
 EH_event.310.d: "A assembleia de emergência da ONU terminou com a criação do Comando Conjunto da ONU (UNJC). Um órgão internacional encarregado de coordenar estratégia militar, inteligência e apoio logístico contra a ameaça extradimensional em rápida expansão. Embora seja principalmente consultivo, o Comando recebeu uma margem operacional sem precedentes.\n\nEm paralelo, blocos regionais como a União Europeia começaram a lançar propostas de plena unificação política e militar, citando a necessidade de mobilização perfeita e soberania compartilhada diante da extinção. O que antes era impensável agora é discutido abertamente nos parlamentos de todo o continente."
 EH_event.310.a: "Um inimigo. Uma guerra"
 EH_event.401.t: "Os Estados Unidos da América do Norte"
 EH_event.401.d: "Nosso governo está pronto para convocar a unificação do nosso continente. É hora de nos unirmos e enfrentarmos a ameaça juntos. Só unidos podemos sobreviver."
 EH_event.401.a: "Vamos fazer isso"
 EH_event.402.t: "Governo [FROM.GetAdjectiveCap] Convoca à Unificação"
 EH_event.402.d: "Em um pronunciamento histórico à nação, [FROM.GetName] convocou a unificação das estruturas militares e políticas da América do Norte com os estados vizinhos para formar uma frente consolidada contra a ameaça da Quimera. Citando o perigo existencial representado pelos portais que se espalham rapidamente e seus habitantes monstruosos, o governo enfatizou que só pela união a sobrevivência pode ser garantida.\n\nA proposta inclui estruturas de comando compartilhadas, recursos reunidos, sistemas de defesa integrados e um território unificado."
 EH_event.402.a: "É chegada a hora"
 EH_event.403.t: "República de Centroamérica"
 EH_event.403.d: "Seguindo o exemplo da América do Norte, é hora de nossa nação se unir aos vizinhos. Nossas nações não são tão fortes quanto as da América do Sul ou do Norte, mas juntas podemos fazer uma enorme diferença."
 EH_event.403.a: "Pela sobrevivência do nosso povo"
 EH_event.404.t: "Governo [FROM.GetAdjectiveCap] Convoca à Unificação"
 EH_event.404.d: "Recebemos uma oferta inesperada de [FROM.GetName], propondo a unificação das nações centro-americanas em um único estado para coordenar melhor a defesa contra a ameaça da Quimera.\n\nEmbora alguns líderes manifestem preocupação com a soberania, a urgência da situação levou a uma séria consideração da oferta."
 EH_event.404.a: "Temos de fazer isso, custe o que custar"
 EH_event.405.t: "A União das Nações Sul-Americanas"
 EH_event.405.d: "Somos atualmente a única parte não unificada das Américas. Nossas nações são fortes, mas não o bastante para enfrentar sozinhas a ameaça da Quimera. É hora de nos unirmos e enfrentarmos a ameaça juntos."
 EH_event.405.a: "Enviar os convites"
 EH_event.406.t: "Governo [FROM.GetAdjectiveCap] Convoca à Unificação"
 EH_event.406.a: "Pelo futuro do nosso continente"
 EH_event.407.t: "A Federação Europeia"
 EH_event.407.d: "Nosso continente nunca esteve tão unido quanto hoje. A União Europeia e a OTAN estabeleceram laços fortes ao longo dos anos, mas agora é hora de levá-los ao próximo nível. Precisamos nos unir como uma só nação para enfrentar juntos a ameaça da Quimera."
 EH_event.407.a: "Vamos nos reunir em Bruxelas"
 EH_event.408.t: "Governo [FROM.GetAdjectiveCap] Convoca à Unificação"
 EH_event.408.d: "Hoje, [GetDateText], o governo [FROM.GetAdjectiveCap] propôs oficialmente a unificação das nações europeias em uma única entidade federal para coordenar melhor a defesa contra a ameaça da Quimera. Depois das Américas, era certo que uma das nações apresentaria a mesma proposta para o nosso continente.\n\nEmbora possa ir contra os valores democráticos da independência das nações, a urgência da situação turvou a maioria das visões ideológicas."
 EH_event.408.a: "Unidos antes, unidos hoje"
 EH_event.409.t: "O Ponto de Defesa Africano"
 EH_event.409.d: "Nosso continente enfrentou muitas guerras recentemente, mas ainda há esperança para nós. As nações africanas precisam se unir e enfrentar juntas a ameaça da Quimera. Elas precisam entender que é a única opção."
 EH_event.409.a: "Pela sobrevivência da África"
 EH_event.410.t: "Governo [FROM.GetAdjectiveCap] Convoca à Unificação"
 EH_event.410.d: "Apesar de tudo, o governo de [FROM.GetName] propôs a unificação das nações africanas para resistir unidas à ameaça da Quimera. Embora algumas nações ainda se recuperem de conflitos recentes, a urgência da situação é mais importante que nossos problemas locais."
 EH_event.410.a: "É o melhor que podemos fazer"
 EH_event.411.t: "A União Continental do Leste"
 EH_event.411.d: "Precisamos seguir o exemplo de outros continentes. Nossas nações são fortes, mas não o bastante para enfrentar sozinhas a ameaça da Quimera. Precisamos deixar de lado nossas diferenças e nos unir como um só."
 EH_event.411.a: "Enviar os convites"
 EH_event.412.t: "Governo [FROM.GetAdjectiveCap] Convoca à Unificação"
 EH_event.412.d: "Nossas nações passaram por muitos conflitos brutais recentemente. [FROM.GetName] propõe deixar de lado nossas diferenças e nos unirmos como um só para enfrentar juntos a ameaça da Quimera. Não foi uma conversa fácil, mas a Quimera é uma ameaça a todos nós muito maior que nossos problemas locais."
 EH_event.412.a: "Por ora, vamos ficar juntos"
 EH_event.413.t: "A Federação Eurasiana"
 EH_event.413.d: "Nossa grande facção precisa permanecer unida. A ameaça da Quimera está cada vez mais perto de nossas fronteiras. Nossas nações são fortes, mas não o bastante para enfrentar sozinhas a ameaça da Quimera. É hora de nos unirmos e enfrentarmos a ameaça juntos."
 EH_event.413.a: "Vamos nos reunir em Moscou"
 EH_event.414.t: "Governo [FROM.GetAdjectiveCap] Convoca à Unificação"
 EH_event.414.d: "Os tempos são sombrios. O governo de [FROM.GetName] propôs a unificação das nações eurasianas em uma única entidade federal para coordenar melhor a defesa contra a ameaça da Quimera. Com a proteção do exército e da economia russos, seremos capazes de expulsar as forças da Quimera deste planeta."
 EH_event.414.a: "Vida longa à OTSC!"
 EH_event.415.t: "Os Três Picos"
 EH_event.415.d: "Nossa grande nação deve permanecer intocada, então é hora de unir nossos aliados comunistas. Juntos podemos enfrentar a ameaça da Quimera e sobreviver para ver mais um dia."
 EH_event.415.a: "Pequim abrirá o caminho"
 EH_event.416.t: "Governo [FROM.GetAdjectiveCap] Convoca à Unificação"
 EH_event.416.d: "A China não está aberta a formar outra enorme federação como os outros continentes, mas nossas nações sempre foram próximas. O governo de [FROM.GetName] propôs unir nossos países sob uma só bandeira para enfrentar juntos a ameaça da Quimera."
 EH_event.416.a: "O último bastião comunista"
 EH_event.417.t: "A Coalizão da ASEAN"
 EH_event.417.d: "Temos sido cercados por megaestados recentemente. E o que piora nossa situação é o Portal da Quimera próximo, na China. É hora de nos unirmos e enfrentarmos a ameaça juntos."
 EH_event.417.a: "Já esperamos tempo demais"
 EH_event.418.t: "Governo [FROM.GetAdjectiveCap] Convoca à Unificação"
 EH_event.418.d: "O governo de [FROM.GetName] propôs a unificação das nações do Sudeste Asiático em uma única entidade para coordenar melhor a defesa contra a ameaça da Quimera. Com as recentes unificações em outros continentes, era só questão de tempo até que uma de nossas nações apresentasse a mesma proposta."
 EH_event.418.a: "Nossa única opção"
 EH_event.419.t: "A Coalizão do Leste Asiático"
 EH_event.419.d: "A ameaça se aproxima de nossas fronteiras. Não só com as forças da Quimera vindas da China, mas também da própria China e de seus novos aliados. Vamos mostrar a eles que não ficaremos de braços cruzados nesta guerra."
 EH_event.419.a: "Pela segurança de nossas ilhas"
 EH_event.420.t: "Governo [FROM.GetAdjectiveCap] Convoca à Unificação"
 EH_event.420.d: "O governo de [FROM.GetName] propôs a unificação das nações do Leste Asiático em uma única entidade para coordenar melhor a defesa tanto contra a ameaça da Quimera quanto contra a crescente influência da China."
 EH_event.420.a: "Preparar-se para o pior"
 EH_event.421.t: "A União de Defesa da Oceania"
 EH_event.421.d: "O resto do mundo está unido. Achávamos que esta guerra não chegaria às nossas ilhas, mas é só questão de tempo. Nossas nações viveram em paz geral; agora é hora de nos unirmos e defendermos nossos lares."
 EH_event.421.a: "Pela sobrevivência da Oceania"
 EH_event.422.t: "Governo [FROM.GetAdjectiveCap] Convoca à Unificação"
 EH_event.422.d: "O governo de [FROM.GetName] propôs a unificação das nações da Oceania. Embora nossas nações estejam longe das principais zonas de conflito, as recentes unificações em outros continentes nos fizeram perceber que precisamos estar prontos para qualquer coisa."
 EH_event.422.a: "Que assim seja"
 EH_event.423.t: "A Ascensão dos Estados Unidos da América do Norte"
 EH_event.423.d: "A rápida resposta do governo americano à ameaça da Quimera culminou no estabelecimento formal dos Estados Unidos da América do Norte (USNA). Após semanas de intensas negociações, os países do continente concordaram em dissolver seus governos nacionais e se integrar em uma única entidade federal.\n\nA USNA agora comanda uma força militar unificada, logística centralizada e um único governo de guerra."
 EH_event.423.a: "Uma nova era começa"
 EH_event.424.t: "Unificação da República de Centroamérica"
 EH_event.424.d: "Os líderes da América Central concordaram em dissolver seus governos nacionais e se integrar em uma única entidade: a República de Centroamérica (RCA). Não está totalmente claro se a unificação foi provocada inteiramente pela ameaça da Quimera ou também pela ameaça que a própria USNA representa. Mas uma coisa é certa: outro grupo de países está pronto para enfrentar a ameaça apocalíptica."
 EH_event.424.a: "Quem diria?"
 EH_event.425.t: "A União das Nações Sul-Americanas Foi Formada"
 EH_event.425.d: "A última parte das Américas finalmente se uniu. Após semanas de negociações, as nações sul-americanas concordaram em se unir sob uma única bandeira: a União das Nações Sul-Americanas (UNASUL).\n\nToda a América está agora preparada para enfrentar a ameaça junta."
 EH_event.425.a: "Um raio de esperança"
 EH_event.426.t: "O Nascimento da Federação Europeia"
 EH_event.426.d: "Após meses de disputas políticas, sessões de emergência e baixas crescentes, a União Europeia votou pela dissolução de seu arcabouço supranacional e pela reconstituição como um único megaestado federal: a Federação Europeia.\n\nMesmo países historicamente neutros como a Suíça e a Finlândia, após prolongados debates internos e referendos, optaram por aderir, citando a ameaça existencial representada pelas QUIMERAS. Com os exércitos nacionais consolidados e as fronteiras apagadas, a Federação Europeia agora dispõe de uma estrutura de comando unificada, recursos reunidos e um único governo de guerra.\n\nOs críticos alertam para uma integração apressada e perda de independência, mas os defensores argumentam que nada menos que a unificação total garantirá a sobrevivência."
 EH_event.426.a: "A sobrevivência não conhece fronteiras"
 EH_event.427.t: "A Formação do Ponto de Defesa Africano"
 EH_event.427.d: "Em um movimento histórico, as nações africanas se uniram para formar o Ponto de Defesa Africano (ADP).\n\nApesar de conflitos regionais persistentes e disparidades econômicas, os líderes concordaram que só pela unidade poderiam esperar defender seu povo e seus territórios. A África está agora pronta para contribuir de forma significativa na luta global contra a ameaça das QUIMERAS."
 EH_event.427.a: "A África está unida"
 EH_event.428.t: "União Continental do Leste Estabelecida"
 EH_event.428.d: "Em uma reviravolta surpreendente, nações da Ásia Central e do Norte da África concordaram em dissolver seus governos nacionais e formar a União Continental do Leste (ECU).\n\nA medida vem em meio a incursões crescentes das QUIMERAS e à percepção de que respostas fragmentadas só levaram a perdas maiores.\n\nEmbora alguns dos conflitos estejam longe de resolvidos, a urgência da ameaça das QUIMERAS levou os líderes a priorizar a sobrevivência sobre a soberania."
 EH_event.428.a: "Essa aliança vai durar?"
 EH_event.429.t: "Federação Eurasiana Oficialmente Formada"
 EH_event.429.d: "A reunião de Moscou terminou e agora o mundo testemunha o nascimento da Federação Eurasiana (ERF). Muitas nações especulam se a unificação foi forçada pela Rússia, mas a verdade é que todas as nações concordaram com a unificação para enfrentar juntas a ameaça da Quimera.\n\nHá também rumores de que a Rússia possa usar essa situação para restaurar a União Soviética ou voltar a ser uma ameaça para a Europa."
 EH_event.429.a: "Muitas perguntas permanecem..."
 EH_event.430.t: "Os Três Picos Unidos"
 EH_event.430.d: "Coreia do Norte, Mongólia e China se uniram oficialmente sob uma só bandeira: Os Três Picos. Embora a unificação tenha sido criticada pelo governo chinês, as fortes relações com seus aliados e a ameaça da Quimera o fizeram mudar de ideia.\n\nA nova nação está agora pronta para enfrentar a ameaça junta."
 EH_event.430.a: "Justo, eu acho..."
 EH_event.431.t: "Coalizão da ASEAN Formada"
 EH_event.431.d: "Outra parte da Ásia se uniu. As recentes unificações das nações do Oriente Médio e dos Três Picos levaram as nações do Sudeste Asiático a seguir o mesmo caminho."
 EH_event.431.a: "O mundo nunca esteve tão unido"
 EH_event.432.t: "Coalizão do Leste Asiático Estabelecida"
 EH_event.432.d: "Os últimos países asiáticos se uniram. Após semanas de negociações, as nações do Leste Asiático concordaram em dissolver seus governos nacionais e se integrar em uma única entidade: a Coalizão do Leste Asiático (EAC).\n\nCom a crescente influência da China e o Portal da Quimera próximo, a nova nação se prepara agora não só para enfrentar a ameaça da Quimera, mas também a possível agressão da própria China."
 EH_event.432.a: "Melhor unidos que divididos"
 EH_event.433.t: "União de Defesa da Oceania Criada"
 EH_event.433.d: "As nações da Oceania se uniram para formar a União de Defesa da Oceania (ODU). Apesar do isolamento geográfico e das disparidades econômicas, os líderes concordaram que só pela unidade poderiam esperar defender seu povo e seus territórios.\n\nA ODU está agora pronta para contribuir de forma significativa na luta global contra a ameaça da Quimera.\n\nCom a Oceania unida, o mundo está agora totalmente dividido em vários megaestados. As Nações Unidas permanecem como a última organização internacional, fazendo o possível para apoiar o esforço de guerra global."
 EH_event.433.a: "Admirável mundo novo"
 EH_event.434.t: "Energia dos Portais Interrompe as Comunicações Globais"
 EH_event.434.d: "Nas semanas seguintes ao surgimento dos portais da Quimera, as redes globais de comunicação sofreram interrupções sem precedentes. Os enlaces de satélite falham de forma intermitente, os cabos submarinos apresentam perda errática de dados e as redes terrestres são assoladas por interferências inexplicáveis.\n\nOs especialistas acreditam que os portais emitem uma forma única de radiação eletromagnética que interfere nas tecnologias de comunicação convencionais. Esforços estão em curso para desenvolver novos protocolos e equipamentos capazes de operar nesse ambiente hostil, mas por ora o fluxo de informações permanece severamente comprometido."
 EH_event.434.a: "Resolvam isso rápido!"
 EH_event.500.t: "A Descoberta da Randallita"
 EH_event.500.d: "Desde que os primeiros portais rasgaram a Terra, fragmentos de uma substância metálica não identificada foram encontrados pelo mundo. A maioria presumiu que fosse uma transformação dimensional de metais existentes, estranha, mas inerte.\n\nIsso mudou hoje. A Dra. Lisa Randall, física teórica e uma das principais mentes do mundo em física de dimensões superiores, decifrou a estrutura e as propriedades do material, revelando-o como um metal estável, leve e altamente resistente, com imenso potencial para aplicações militares.\n\nAgora batizada de Randallita, a substância é singularmente adequada para ligas avançadas, combinando resistência, tolerância ao calor e flexibilidade. Com o refino adequado, pode servir de base para uma nova geração de máquinas de guerra que nos ajudem a vencer."
 EH_event.500.a: "Enfim, algumas boas notícias"
 EH_event.501.t: "Protótipo de Estrutura HACS Revelado"
 EH_event.501.d: "Após meses de desenvolvimento acelerado, o primeiro protótipo de estrutura de um Sistema de Combate de Alta Agilidade (HACS) foi construído com sucesso pela equipe [FROM.GetAdjective].\n\nProjetada com um chassi bípede reforçado com Randallita e equipada com propulsores integrados, a plataforma HACS foi concebida para unir poder de fogo e capacidade de sobrevivência. Onde os tanques são lentos demais e as aeronaves vulneráveis demais às ameaças da Quimera, os HACS oferecem a mobilidade necessária sem sacrificar cargas de armas pesadas.\n\nEmbora ainda em testes, esse avanço marca um grande passo rumo às unidades de linha de frente da próxima geração. Um programa de pesquisa dedicado foi aprovado para levar o HACS à prontidão de combate."
 EH_event.501.a: "Uma nova era da guerra"
 EH_event.511.t: "Operação Marreta"
 EH_event.511.d: "Após meses de perdas amargas na Europa Oriental e o colapso da rede defensiva dos Bálcãs, a Federação Europeia lançou a Operação Marreta, uma ofensiva militar de alto risco para retomar a Linha do Bósforo e reabrir o corredor estratégico entre a Europa e o Oriente Médio. Liderada por unidades HACS recém-destacadas e apoiada por ataques coordenados de artilharia, navais e de mísseis, a ofensiva visa desalojar os enxames entrincheirados da Quimera das ruínas de Istambul e das colinas ao redor.\n\nO sucesso da operação marcaria um grande ponto de virada na restauração da mobilidade continental e na proteção do flanco sul da Europa. Mas a presença do enxame se adensou, e relatórios de inteligência sugerem novas variantes, nunca vistas, na região. A batalha à frente será custosa."
 EH_event.511.a: "A sorte está lançada"
 EH_event.800.t: "As Linhas Zenóbia e Saladino Estão em Construção"
 EH_event.800.d: "Em resposta ao enxame que avança rapidamente da África subsaariana, a Liga de Defesa do Oriente Médio ordenou a construção imediata de uma barreira fortificada no sul do Egito. Apelidada de Linha Zenóbia, ela se estende ao longo do Nilo e do flanco do deserto ocidental, integrando bunkers reforçados, redes de trincheiras e posições de artilharia de longo alcance para deter o ímpeto da Quimera.\n\nSe a Zenóbia cair, a Linha Saladino aguarda logo atrás. Ancorada ao longo do Canal de Suez, de Port Said ao Mar Vermelho, ela é o reduto final, uma linha inquebrável destinada a proteger do aniquilamento o coração cultural e espiritual da região."
 EH_event.800.a: "A linha está traçada"
 EH_event.801.t: "Colapso das Linhas Zenóbia e Saladino"
 EH_event.801.d: "Chegam relatos de que o enxame da Quimera rompeu tanto a Linha Zenóbia, no sul do Egito, quanto a Linha Saladino, ao longo do Canal de Suez. Apesar de esforços defensivos brutais e do forte apoio de artilharia, o inimigo se provou numeroso e implacável demais.\n\nSetores defensivos inteiros foram invadidos, fortificações perdidas, linhas de trincheira consumidas, e muitas unidades lutaram até o amargo fim. O QG de Suez silenciou desde então. A Liga de Defesa do Oriente Médio ordenou uma retirada completa em direção ao Levante.\n\nA ruptura da derradeira linha de defesa abre o portal para a frente norte. Não resta nenhuma zona de amortecimento."
 EH_event.801.a: "Resistiram o máximo que puderam"
 EH_event.802.t: "Linhas Zenóbia e Saladino Atingidas pela Retaguarda!"
 EH_event.802.d: "Devido ao colapso das linhas de defesa do Oriente Médio, as forças da Quimera agora romperam as linhas Zenóbia e Saladino pelo único lado vulnerável, a retaguarda. O enxame se derramou pela brecha em números esmagadores, superando rapidamente os defensores restantes e garantindo uma posição no coração do continente.\n\nCom as linhas comprometidas, a Quimera tem passe livre para avançar para o norte, ameaçando cidades-chave e infraestrutura por toda a Europa. A situação é grave, e a União Europeia deve agora se preparar para uma luta prolongada e brutal na primeira frente em suas fronteiras."
 EH_event.802.a: "A frente oriental era fraca demais"
 EH_event.803.t: "Fortificando a Europa: A Linha do Bósforo"
 EH_event.803.d: "A Coalizão Ocidental autorizou a criação de um novo reduto continental: a Linha do Bósforo.\n\nEstendendo-se pelos estreitos de Istambul, essa linha defensiva integra campos minados, bloqueios navais, posições preparadas e muralhas reforçadas para impedir uma brecha na Europa. Estacionada em seu centro está a Força-Tarefa Helesponto, uma unidade multinacional pronta para lutar até o fim.\n\nA ordem é clara: manter a linha, custe o que custar."
 EH_event.803.a: "Não passarão sem luta"
 EH_event.804.t: "A Queda da Linha do Bósforo"
 EH_event.804.d: "Após um cerco brutal e prolongado, a Linha do Bósforo foi rompida. As Quimeras se derramaram por Istambul numa onda de fogo e carne, superando as defesas apesar da desesperada contraofensiva.\n\nA Força-Tarefa Helesponto lutou até o último homem e é pranteada como heroína da Europa.\n\nCom a Europa agora diretamente exposta, o mundo ocidental perdeu seu primeiro escudo."
 EH_event.804.a: "Os guardiões da Europa serão pranteados"
 EH_event.805.t: "Linha do Bósforo Atingida pela Retaguarda!"
 EH_event.805.d: "As forças da Quimera conseguiram contornar o Mar Negro pelo norte e atingir a Linha do Bósforo pela retaguarda, ignorando por completo as fortificações e superando os defensores restantes. O enxame já domina os Bálcãs e a Europa Ocidental."
 EH_event.805.a: "A Europa já caiu"
 EH_event.806.t: "Linha de Defesa do Cáucaso em Construção"
 EH_event.806.d: "A Linha de Defesa do Cáucaso está sendo construída para proteger a ligação entre o Oriente Médio e o território meridional da Federação Eurasiana. A linha se estenderá pelas montanhas do Cáucaso, integrando as vantagens do terreno natural com posições fortificadas, posições de artilharia e unidades de resposta rápida para criar uma barreira formidável contra as forças avançadas da Quimera.\n\nEmbora possa não bastar para deter totalmente o enxame, servirá como uma zona de amortecimento crítica para ganhar tempo para a evacuação e o reagrupamento na Europa e na antiga Rússia."
 EH_event.806.a: "Que consigam a tempo"
 EH_event.807.t: "Primeira Linha da Defesa do Cáucaso Rompida"
 EH_event.807.d: "As forças da Quimera romperam a primeira linha da Defesa do Cáucaso, superando as fortificações iniciais e avançando pela região montanhosa. Apesar da feroz resistência dos defensores, o ataque implacável do enxame criou uma cabeça de ponte na área, ameaçando transbordar para o coração da Federação Eurasiana.\n\nA situação é crítica, mas ainda há esperança de que a segunda linha de defesa resista e impeça novas incursões."
 EH_event.807.a: "Ainda há esperança para a segunda linha"
 EH_event.808.t: "A Defesa do Cáucaso Caiu"
 EH_event.808.d: "Apesar de esforços valorosos, a Linha de Defesa do Cáucaso caiu. As forças da Quimera superaram os defensores restantes e garantiram uma posição na região, abrindo uma nova frente para a Federação Eurasiana.\n\nCom a perda dessa zona de amortecimento crítica, o enxame agora tem caminho direto para cidades-chave e infraestrutura por toda a Rússia e a Europa Ocidental. A situação é grave, e a Federação Eurasiana deve agora se preparar para uma luta prolongada e brutal em seu próprio solo."
 EH_event.808.a: "Não podem ser detidos..."
 EH_event.809.t: "Linha de Defesa do Cáucaso Atingida pela Retaguarda!"
 EH_event.809.d: "As forças da Quimera conseguiram contornar as montanhas do Cáucaso pelo norte e atingir a linha de defesa pela retaguarda, ignorando por completo as fortificações e superando os defensores restantes. O enxame já domina as regiões ao redor."
 EH_event.809.a: "Era o risco que precisava ser corrido"
 EH_event.900.t: "Queda de Washington D.C."
 EH_event.900.d: "A capital dos antigos Estados Unidos da América caiu.\n\nAs forças da Quimera lançaram um ataque devastador, rompendo as defesas da cidade e superando as unidades militares. Os marcos icônicos agora jazem em ruínas, e as ruas outrora movimentadas estão em um silêncio sinistro.\n\nSobreviventes relatam histórias aterradoras de caos e destruição enquanto a cidade caía nas mãos do enxame."
 EH_event.900.a: "O coração de uma nação está perdido..."
 EH_event.901.t: "Queda de Nova York"
 EH_event.901.d: "Nova York foi perdida para o enxame da Quimera.\n\nAs criaturas exploraram túneis subterrâneos e sistemas de metrô para contornar as defesas de superfície, pegando as unidades militares desprevenidas. O icônico horizonte é agora uma silhueta de destruição, com incêndios furiosos e edifícios desabando.\n\nStaten Island foi a primeira a cair, e agora a cidade inteira está sob controle da Quimera."
 EH_event.901.a: "A Estátua da Liberdade se foi..."
 EH_event.902.t: "Queda de Los Angeles"
 EH_event.902.d: "Los Angeles caiu.\n\nOutrora uma bela cidade, agora é apenas uma lembrança para incontáveis refugiados que fogem do avanço implacável da Quimera. O icônico letreiro de Hollywood é agora um triste lembrete do que se perdeu."
 EH_event.902.a: "Que perda..."
 EH_event.903.t: "Queda de São Francisco"
 EH_event.903.d: "São Francisco se foi\n\nAs Quimeras emergiram por fissuras subterrâneas e brechas costeiras, contornando as linhas defensivas com velocidade aterrorizante. O Comando do Pacífico relata que todas as forças restantes foram aniquiladas ou isoladas. As perdas civis são catastróficas.\n\nMais uma grande cidade perdida para o enxame."
 EH_event.903.a: "O Golden Gate está perdido..."
 EH_event.904.t: "Queda de Moscou"
 EH_event.904.d: "Moscou caiu.\n\nO enxame da Quimera lançou um ataque coordenado, superando as defesas da cidade com pura quantidade e ferocidade. O Kremlin, outrora símbolo da resiliência russa, jaz agora em ruínas.\n\nSobreviventes falam de caos e desespero enquanto a cidade sucumbia ao avanço implacável das criaturas."
 EH_event.904.a: "O coração da Rússia está perdido..."
 EH_event.905.t: "Queda de Xangai"
 EH_event.905.d: "Xangai caiu.\n\nO enxame atacou com força esmagadora, primeiro pelos subúrbios do sul, depois pelo Rio Huangpu, pegando os defensores em plena retirada. O Bund se tornou um cemitério de aço queimado e concreto quebrado. As transmissões de satélite agora mostram apenas silêncio, uma casca vazia de cidade."
 EH_event.905.a: "Quando vamos detê-los?"
 EH_event.1000.t: "Portal da Quimera Fechado!"
 EH_event.1000.d: "O Projeto T.E.S.L.A. revelou-se um enorme sucesso. [FROM.GetName] realizou uma incursão bem-sucedida para fechar um dos Portais da Quimera, fazendo com que todas as forças da Quimera no enorme perímetro perdessem a consciência instantaneamente. As criaturas ainda estão vivas, então a população local é aconselhada a não ter nenhum contato com os corpos. O exército nacional está a caminho para matar as unidades da Quimera enquanto dormem."
 EH_event.1000.a: "Aqueles desgraçados conseguiram."
 EH_focus_event.1.t: "Plano de Grande Mobilização"
 EH_focus_event.1.d: "Elas apareceram de repente. Estão atacando tudo o que se move e não vão parar até que tudo esteja morto. Nossos cientistas tentam descobrir o que são essas criaturas, de onde vêm e como detê-las. Enquanto isso, nossos militares tentam manter a linha de frente e proteger nossos cidadãos. Precisamos agir rápido antes que cheguem às nossas fronteiras. Podemos contar com nosso exército profissional ou convocar uma mobilização em massa."
 EH_focus_event.1.a: "Atirem contra elas tudo o que temos!"
 EH_focus_event.1.b: "Contaremos com o exército profissional."
 EH_focus_event.2.t: "Primeira Geração de Soldados de Quitina"
 EH_focus_event.2.d: "Pesquisas recentes sobre as tropas da Quimera permitiram criar uma nova linhagem de soldados: os Soldados de Quitina. A nova armadura tornará nosso povo mais resistente aos ataques físicos dos alienígenas, e seu design futurista traz esperança e entusiasmo à população."
 EH_focus_event.2.a: "Quando a ficção encontra a realidade."
 EH_focus_event.3.t: "Os Drones Alcançaram o Alvo"
 EH_focus_event.3.d: "Os drones tiraram fotos detalhadas da estrutura ao redor do Portal. Para entender melhor seu propósito e funcionamento, além dos fins defensivos, os cientistas terão de analisar os dados coletados. Felizmente, há um professor de biologia que vai querer examinar as fotos mais de perto."
 EH_focus_event.3.a: "Esperemos que tenha valido a pena."
 EH_focus_event.4.t: "A Quimera Destruiu o Esquadrão de Drones"
 EH_focus_event.4.d: "As forças da Quimera interceptaram e destruíram com sucesso o esquadrão de drones antes que concluísse sua missão. Nenhuma máquina conseguiu tirar uma foto e enviá-la antes de ser abatida."
 EH_focus_event.4.a: "Mais um fracasso..."
 EH_focus_event.5.t: "Forças da Quimera Destruíram o Local de Pesquisa"
 EH_focus_event.5.d: "As forças da Quimera descobriram e destruíram um de nossos Locais de Pesquisa. Parte dos dados de pesquisa foi perdida, mas pelo menos a Quimera não saiu sem baixas."
 EH_focus_event.5.a: "Procurem os sobreviventes!"
 EH_focus_event.6.t: "Forças da Quimera Repelidas do Local de Pesquisa"
 EH_focus_event.6.d: "A Quimera não conseguiu destruir nosso Local de Pesquisa. Nenhum dado de pesquisa foi perdido, e os cientistas estão a salvo."
 EH_focus_event.6.a: "Grande vitória!"
 EH_focus_event.7.t: "Cientista Desaparecido"
 EH_focus_event.7.d: "Um dos cientistas não conseguiu escapar do Local de Pesquisa antes de as forças da Quimera o atacarem. Não sabemos se o cientista está morto ou vivo, mas temos de presumir o pior; no momento não há como lançar uma missão de resgate."
 EH_focus_event.7.a: "Droga!"
 EH_focus_event.8.t: "Emissões de Energia do Portal Enfraquecem as Forças da Quimera"
 EH_focus_event.8.d: "Graças ao maior tempo dedicado a monitorar as emissões incomuns de energia do Portal que vêm perturbando nossa rede de satélites, nossos cientistas descobriram que essas emissões seguem padrões muito específicos. Novos satélites foram equipados com sensores especiais que detectam essas emissões e as usam para interferir nos sistemas de comunicação da Quimera. Esse avanço pode enfraquecer significativamente as forças da Quimera."
 EH_focus_event.8.a: "Este é um grande avanço!"
 EH_focus_event.9.t: "Corporações Privadas Enviam Trabalhadores para Ajudar os Locais de Pesquisa"
 EH_focus_event.9.d: "Enormes corporações privadas se reuniram para ajudar nossos cientistas em suas pesquisas contra a Quimera. Estão enviando seus melhores trabalhadores para ajudar a construir novos Locais de Pesquisa, acelerando significativamente todo o processo."
 EH_focus_event.9.a: "Ótimas notícias!"
 EH_focus_event.10.t: "Generais Militares Oferecem Segurança Adicional aos Locais de Pesquisa"
 EH_focus_event.10.d: "Nossos generais militares se ofereceram para enviar tropas adicionais para proteger nossos Centros de Pesquisa contra ataques das Quimeras. A experiência deles em combate e o conhecimento das táticas das Quimeras serão inestimáveis para garantir a segurança de nossos cientistas e o sucesso de nossos projetos."
 EH_focus_event.10.a: "Agradecemos o apoio deles!"
 EH_focus_event.11.t: "Um bilionário compartilha seu dinheiro para financiar os recursos"
 EH_focus_event.11.d: "Um bilionário decidiu doar uma parte significativa de sua fortuna para financiar nossos Centros de Pesquisa. Esse enorme aporte cobrirá os custos de construção de novas instalações e aumentará bastante a velocidade das pesquisas."
 EH_focus_event.11.a: "Reduzam os impostos dele!"
 EH_focus_event.12.t: "Veio de Randallita descoberto"
 EH_focus_event.12.d: "A equipe de busca descobriu um novo veio de Randallita. Cabe a nós decidir instalar operações de mineração e extrair esse valioso recurso."
 EH_focus_event.12.a: "Iniciar as operações de mineração!"
 EH_focus_event.12.b: "Não temos como pagar."
 EH_focus_event.13.t: "Veio de ferro descoberto"
 EH_focus_event.13.d: "A equipe de busca descobriu um novo veio de ferro. Cabe a nós decidir instalar operações de mineração para extraí-lo e aumentar nossa produção de aço."
 EH_focus_event.13.a: "Eu esperava mais, mas ainda precisamos disso."
 EH_focus_event.13.b: "Não temos como pagar."
 EH_focus_event.14.t: "Veio de alumínio descoberto"
 EH_focus_event.14.d: "A equipe de busca descobriu um novo veio de alumínio. Cabe a nós decidir instalar operações de mineração para extrair esse recurso."
 EH_focus_event.14.a: "Sem Randallita? Ainda assim é um bom negócio."
 EH_focus_event.14.b: "Não temos como pagar."
 EH_focus_event.15.t: "Empresa privada descobre veio de Randallita"
 EH_focus_event.15.d: "Uma das grandes corporações privadas descobriu um novo veio de Randallita. Ela está disposta a iniciar a mineração por conta própria, sem qualquer ajuda do governo."
 EH_focus_event.15.a: "Hã... deixem que façam isso."
 EH_focus_event.16.t: "[FROM.GetName] inicia a ofensiva final"
 EH_focus_event.16.d: "Após a bem-sucedida detonação da arma T.E.S.L.A. no Portal das Quimeras, as forças militares de [FROM.GetName] lançaram uma ofensiva total para eliminar todas as forças das Quimeras na área. Com o Portal fechado e o inimigo desorientado, esta é a nossa chance de desferir um golpe decisivo e retomar o território perdido."
 EH_focus_event.16.a: "Venceremos."
 EH_protect_the_homeland: "Proteger a Pátria!"
 EH_protect_the_homeland_desc: "Fomos invadidos por forças desconhecidas, saídas do próprio diabo. Devemos nos defender com tudo o que temos para repelir a ameaça e sobreviver para ver outro dia!"
 EH_territorial_advantages: "Vantagens Territoriais"
 EH_territorial_advantages_desc: "Os invasores são mais fortes no combate corpo a corpo... ou no combate em geral. Então, se não podemos vencê-los pela força, temos que ser mais espertos. Um novo programa de defesa nos ajudará a usar a paisagem a nosso favor e talvez seja o bastante para vencer algumas batalhas."
 EH_cold_acclimatization: "Aclimatação ao Frio"
 EH_cold_acclimatization_desc: "Os invasores são extremamente resistentes a baixas temperaturas. O problema extra é que dois portais ficam no Alasca e no Tibete. Se quisermos ter chance de chegar perto deles, precisamos nos fortalecer ou desenvolver novas formas de lutar contra o frio."
 EH_300: "300"
 EH_300_desc: "Passagens estreitas nas montanhas são um terreno incrivelmente difícil de atravessar. Um lugar perfeito para uma emboscada, se quer saber. Contanto que consigamos lidar com o apoio aéreo deles, podemos usar essas passagens para obter uma vantagem incrível nas batalhas."
 EH_heat_acclimatization: "Aclimatação ao Calor"
 EH_heat_acclimatization_desc: "Os monstros são muito resistentes às forças da natureza. Nós também precisamos ser mais fortes. Lutamos neste planeta por mais tempo do que essas coisas, e essa experiência deve ser usada agora a nosso favor."
 EH_sandstorms_are_our_allies: "As Tempestades de Areia São Nossas Aliadas"
 EH_sandstorms_are_our_allies_desc: "Sabemos quando as tempestades de areia estão chegando. Com esse conhecimento, podemos preparar nossa defesa e usar a areia a nosso favor. Vamos só torcer para que os monstros não tenham \"radares biológicos\"."
 EH_observe_local_fauna: "Observar a Fauna Local"
 EH_observe_local_fauna_desc: "Os animais fornecem um sistema de detecção precoce perfeito. Esses monstros são uma ameaça a todas as espécies, e nossos animais já parecem cientes da presença deles. Um grande grupo de animais fugindo em pânico pode ser uma informação importante quando nossos radares silenciarem."
 EH_our_weakness_to_their_disadvantage: "Nossa Fraqueza, a Desvantagem Deles"
 EH_our_weakness_to_their_disadvantage_desc: "As planícies são extremamente úteis para nossos veículos, mas tanques e IFVs não bastam para deter esses monstros. Porém, graças ao terreno plano, poderemos preparar algo especial que, com sorte, nos dará uma vantagem temporária no campo de batalha."
 EH_electric_traps: "Armadilhas Elétricas"
 EH_electric_traps_desc: "Com choques elétricos potentes e controlados, devemos conseguir dar às nossas unidades alguns minutos de folga para atacar as tropas inimigas. O consumo de energia será enorme, então teremos que encontrar uma forma de reduzir o uso de energia no país ou preparar novos canteiros de obras."
 EH_transfer_energy_from_civilian_sector: "Transferir Energia do Setor Civil"
 EH_transfer_energy_from_civilian_sector_desc: "Estamos consumindo energia demais quando as armadilhas estão ativas. Recarregá-las leva tempo demais e não podemos esperar uma semana inteira para usá-las de novo. Vamos transferir parte da energia do setor público para nossos bancos de energia."
 EH_invest_in_additional_power_sources: "Investir em Fontes de Energia Adicionais"
 EH_invest_in_additional_power_sources_desc: "A guerra não pode afetar os civis ainda mais do que já afeta. Vamos criar um novo projeto de reator para estabelecer segurança energética para hoje e para todos os outros dias."
 EH_reduce_energy_loss: "Reduzir a Perda de Energia"
 EH_reduce_energy_loss_desc: "Essas armadilhas consomem energia demais. São eficazes, mas custosas para nossa infraestrutura. Não podemos reduzir sua potência, mas podemos encontrar formas de limitar o uso de energia de outras fontes."
 EH_nation_remains_untouched: "A Nação Permanece Intocada"
 EH_nation_remains_untouched_desc: "Sejam lá o que forem essas criaturas, não podemos simplesmente deixar tudo de lado para fortalecer as forças armadas. As pessoas continuarão suas vidas normais como se nada de ruim estivesse acontecendo..."
 EH_put_away_internal_problems: "Deixar de Lado os Problemas Internos"
 EH_put_away_internal_problems_desc: "O protecionismo da pátria é atualmente o objetivo mais importante. Sem o exército, não haverá nação para proteger. As pessoas terão que lidar com seus problemas por conta própria enquanto fortalecemos as forças armadas. Se o exército falhar, a sociedade também falhará."
 EH_minimal_military_focus: "Foco Militar Mínimo"
 EH_minimal_military_focus_desc: "A indústria civil é, no momento, mais importante do que a produção de novas armas. Se a guerra está longe de nós, não há motivo para gastar tanto dinheiro com defesa."
 EH_high_military_focus: "Foco Militar Elevado"
 EH_high_military_focus_desc: "O inimigo se aproxima da nossa capital a cada dia. Não podemos baixar a guarda e precisamos acelerar a produção."
 EH_lower_conscription: "Menor Conscrição"
 EH_lower_conscription_desc: "Outras nações estão perdendo muita mão de obra, mas nossos soldados patrulham principalmente nossas fronteiras. Não precisamos recrutar mais deles só para gastar mais dinheiro com as forças armadas."
 EH_extended_conscription: "Conscrição Ampliada"
 EH_extended_conscription_desc: "Manter o inimigo fora de nossas fronteiras é a tarefa mais importante, não podemos perder mais terras!"
 EH_prioritize_corporations: "Priorizar as Corporações"
 EH_prioritize_corporations_desc: "A guerra arruinará nossa economia. Temos que manter nossas corporações leais ao Estado para não nos metermos em sérios problemas."
 EH_prioritize_military_companies: "Priorizar as Empresas Militares"
 EH_prioritize_military_companies_desc: "Pesquisa e aumento da produção de armas devem ser nossa maior prioridade. Sem armas, nossos homens não conseguirão lutar contra essas criaturas profanas."
 EH_a_new_resource: "Um Novo Recurso"
 EH_a_new_resource_desc: "A Dra. Lisa Randall estuda há algum tempo um novo recurso, a Randallita. Com sua equipe de cientistas, a Dra. Randall descobriu sua resistência incomum, aliada a um peso incrivelmente baixo. Após a descoberta da Randallita, outras nações notaram uma quantidade reduzida de [RESOURCE HERE]. É possível que os Portais estejam transmutando esse recurso em Randallita. Talvez seja esse o recurso comum do outro lado do Portal? Precisamos de mais pesquisas sobre isso."
 EH_a_fine_addition_to_my_collection: "Uma Bela Adição à Minha Coleção"
 EH_a_fine_addition_to_my_collection_desc: "A Randallita será um ótimo componente para armas e blindagens. Quando nos equiparmos com Randallita, talvez possamos repelir não só criaturas alienígenas, mas também outras nações."
 EH_first_hacs_prototype: "Primeiro Protótipo do HACS"
 EH_first_hacs_prototype_desc: "Jaegers, Atlas, Evangelion e por aí vai. Os mechas de combate avançados eram apenas ficção até que acontecimentos recentes mudaram tudo. O Sistema de Combate de Alta Agilidade (HACS) é um mecha de combate operacional da vida real, construído somente graças às propriedades da Randallita. O peso deixou de ser um grande problema depois que passamos a usar uma liga muito mais forte que o aço e mais leve que o magnésio. Com essa tecnologia, talvez finalmente consigamos causar dano significativo às forças inimigas."
 EH_new_enemy_new_strategy: "Novo Inimigo, Nova Estratégia"
 EH_new_enemy_new_strategy_desc: "Problemas estúpidos exigem soluções estúpidas, e este é o problema mais estúpido que já enfrentamos. Os alienígenas lutam como quem não teme se ferir, e é disso que tiraremos proveito. A blindagem das unidades pesadas protege bem, mas não é impenetrável. Temos que vencer esta luta sendo mais rápidos que as unidades resistentes e mais fortes que as criaturas voadoras. Dito isso, precisamos de mais Randallita e de balas, óbvio."
 EH_more_mechs_less_weapons: "Mais Mechas, Menos Armas"
 EH_more_mechs_less_weapons_desc: "Os mechas são nossas únicas armas eficazes contra essas criaturas. Sua produção leva muito tempo, e o estoque de Randallita é limitado. Será melhor converter algumas fábricas para ajudar a construir peças para os mechas, em vez das armas convencionais."
 EH_more_weapons_less_mechs: "Mais Armas, Menos Mechas"
 EH_more_weapons_less_mechs_desc: "A produção de mechas consome a maior parte de nossos recursos. Se continuarmos com essa produção em larga escala, nossa economia pode cair em depressão e nunca nos recuperaremos da dívida. É tempo de guerra, mas não podemos destruir nossa economia por essas novas máquinas."
 EH_iron_man: "Homem de Ferro?"
 EH_iron_man_desc: "Os primeiros mechas novos já estão lutando no campo de batalha. Agora a verdadeira luta começou, e talvez finalmente tenhamos uma chance contra os Invasores. Algumas pessoas começaram a especular até onde podemos chegar com essa tecnologia. Claro, a base de fãs da Marvel começou a nos enviar seus projetos da armadura do Homem de Ferro... na verdade, por que não?"
 EH_second_generation_hacs: "HACS de Segunda Geração"
 EH_second_generation_hacs_desc: "Graças aos projetos de nerds e engenheiros profissionais, estamos prontos para começar a planejar novos mechas um pouco mais cedo. Vamos alcançar mais um grande marco!"
 EH_highly_purified_randallite: "Randallita Altamente Purificada"
 EH_highly_purified_randallite_desc: "Nunca dedicamos tempo suficiente a refinar a Randallita bruta, pois a produção era nossa prioridade máxima. Mas, como agora sabemos mais sobre esse recurso e não temos tanta pressa em descobrir suas novas propriedades, podemos dedicar algum tempo para maximizar sua eficiência."
 EH_increase_research_budget: "Aumentar o Orçamento de Pesquisa"
 EH_increase_research_budget_desc: "A segunda geração do HACS foi um grande sucesso, mas não podemos nos acomodar. A humanidade sempre exigirá algo melhor, e é nesse momento que começamos a preparação para a terceira geração."
 EH_third_generation_hacs: "HACS de Terceira Geração"
 EH_third_generation_hacs_desc: "Todo o nosso trabalho árduo levou a este momento. Meses de pesquisa, testes e bilhões do nosso orçamento: estamos prontos para lançar o maior mecha de combate já visto na história dos mechas de combate!"
 EH_military_advantages: "Vantagens Militares"
 EH_military_advantages_desc: "Precisamos aprender como a Randallita poderá ajudar nossas tropas. Enquanto os mechas estão sendo construídos, temos mais desse minério do que podemos gastar nas novas máquinas. Precisamos encontrar mais maneiras de usá-lo."
 EH_ranjets: "Ranjatos"
 EH_ranjets_desc: "A Randallita nos permitiu construir os primeiros mechas de combate da história. Ela é tão leve que não precisamos nos limitar a essa nova tecnologia. Isso resolverá muitos problemas relacionados ao empuxo e ao peso das aeronaves. Aviões com cascos mais leves poderão carregar mais carga e armamentos, e nossos jatos serão mais manobráveis do que nunca."
 EH_not_so_heavy_weapons: "Armas Nem Tão Pesadas"
 EH_not_so_heavy_weapons_desc: "Podemos usar Randallita na produção de armas pesadas em vez de aço, titânio e outros materiais. As armas serão mais leves, e será mais fácil para os soldados carregá-las e usá-las. Os caminhões gastarão menos combustível no transporte, então tudo se beneficia dessa mudança."
 EH_find_new_veins: "Encontrar Novos Veios"
 EH_find_new_veins_desc: "Muitas jazidas de recursos foram substituídas por Randallita. Não sabemos como esse processo está progredindo, mas pode ser um bom momento para começar a escavar atrás de mais recursos. Talvez encontremos mais Randallita no subsolo."
 EH_more_precious_than_gold: "Mais Preciosa que Ouro"
 EH_more_precious_than_gold_desc: "A Randallita já está por toda parte. Grandes empresas estão gastando bilhões de dólares para colocar as mãos nesse recurso. É como a boa e velha corrida do ouro, mas a Randallita é muito mais útil que o ouro. Podemos fazer ferramentas comuns, máquinas e armas, e essa é só uma lista bem resumida. Nós, o Estado, temos que encontrar o máximo de Randallita possível antes que empresas gananciosas instaurem um monopólio sobre sua escavação, pesquisa e exportação. É difícil acreditar que realmente teremos que lutar contra a nossa própria nação, mas impor restrições pode ser a consequência final se a situação sair do controle."
 EH_civilian_benefits: "Benefícios Civis"
 EH_civilian_benefits_desc: "Nossa situação de guerra está estável, então podemos nos concentrar em usar a Randallita em espaços públicos. Se a situação com os Invasores piorar, sempre poderemos voltar à produção militar sem muitos problemas."
 EH_a_wonderful_prosthesis: "Uma Prótese Maravilhosa"
 EH_a_wonderful_prosthesis_desc: "A incrível resistência e leveza da Randallita nos permitiram construir um novo modelo de prótese de perna, deixando seus usuários ainda mais \"saudáveis\" do que seriam com a perna original. É hora de levar as extensões sintéticas do corpo humano a um nível digno de Cyberpunk!"
 EH_market_potential: "Potencial de Mercado"
 EH_market_potential_desc: "Há muita gente querendo colocar as mãos na Randallita. Como não estamos mais com pressa nos projetos militares, podemos começar a vender Randallita a investidores e para uso comercial. As grandes empresas passarão a substituir suas máquinas por outras feitas de Randallita, reduzindo a quantidade de combustível usada no mundo para movimentar máquinas e veículos pesados."
 EH_study_new_enemy: "Estudar o Novo Inimigo"
 EH_study_new_enemy_desc: "Após o ataque nuclear ao misterioso Portal, algum tipo de novas criaturas começou a se espalhar em círculo ao redor dele. Elas são altamente agressivas e atacam tudo o que se move. Não sabemos se conseguimos detê-las, mas, se existe uma forma de nos defender, precisamos descobri-la o quanto antes."
 EH_launch_orbital_scans: "Lançar Varreduras Orbitais"
 EH_launch_orbital_scans_desc: "Podemos usar nossos satélites para estudar as manobras inimigas e aprender seus padrões de movimento, se é que têm algum. Isso deve ajudar nossos estrategistas a preparar armadilhas e contratáticas mais eficazes."
 EH_find_the_weak_spots: "Encontrar os Pontos Fracos"
 EH_find_the_weak_spots_desc: "Essas criaturas podem ser mortas. Afinal, são feitas de sangue e matéria orgânica. Se conseguirmos levar uma delas ao nosso laboratório, poderemos encontrar seus órgãos mais vitais e estudá-los a nosso favor. Assim que descobrirmos os órgãos críticos, treinaremos nossos soldados e sistemas de combate para mirá-los sempre que possível."
 EH_disassemble_invader_armor: "Desmontar a Armadura dos Invasores"
 EH_disassemble_invader_armor_desc: "A maioria dos Invasores é resistente às nossas armas graças à sua dura armadura semelhante à quitina. Podemos iniciar pesquisas para conhecer sua estrutura e adaptá-la a coletes de proteção humanos. Talvez isso torne nossas tropas um pouco mais resistentes aos ataques inimigos."
 EH_portals_must_be_the_key: "Os Portais Devem Ser a Chave"
 EH_portals_must_be_the_key_desc: "Precisamos reunir mais informações sobre o Portal mais próximo, qualquer coisa que possa nos ser útil. Eles resistem a ataques nucleares, mas nada é indestrutível. Encontraremos uma forma de fechá-los, mesmo que isso signifique enviar nossos drones e aeronaves em missões suicidas."
 EH_investigate_strange_structure: "Investigar a Estrutura Estranha"
 EH_investigate_strange_structure_desc: "Notamos um comportamento estranho de nossos inimigos. Eles parecem construir algo ao redor dos Portais, provavelmente para protegê-los. Se estiverem construindo algum tipo de fortaleza, temos que agir rápido antes que os isolem completamente. Nosso próximo passo é preparar uma missão de reconhecimento detalhada usando nossos drones de combate. O inimigo domina o espaço aéreo, então é praticamente uma missão suicida, mas temos que esperar que pelo menos uma máquina consiga tirar fotos dessa estrutura e enviá-las ao nosso comando."
 EH_finding_their_vulnerability: "Encontrando a Vulnerabilidade Deles"
 EH_finding_their_vulnerability_desc: "Com bombardeios frequentes o bastante, talvez descubramos a fraqueza dos componentes de que essa estrutura é feita. O mais importante é verificar a resistência ao calor e à explosão e a corrosão tóxica. Não há como verificar sua densidade ao congelar, mas podemos observar o comportamento de outros materiais desses monstros para ver como reagem a temperaturas mais baixas."
 EH_but_how_does_this_key_work: "Mas Como Essa Chave Funciona?"
 EH_but_how_does_this_key_work_desc: "Esses Portais levam a outra dimensão, isso é certo. Seja o Mundo Invertido, a Antiterra ou o que for, deve haver algo que permita abrir e manter a conexão. Descobrir como eles fazem isso pode ser importante para entender sua natureza e funcionamento e, com um pouco de sorte, encontrar uma forma de interromper seu funcionamento e encerrar essa conexão."
 EH_project_tesla: "Projeto T.E.S.L.A."
 EH_project_tesla_desc: "O Sistema Eletromagnético Tático de Aniquilação Linear será nossa maior chance de mostrar aos monstros quem realmente manda aqui. Quando a arma estiver pronta, vamos dispará-la contra o Portal mais próximo. Se nossa teoria estiver correta, o pulso eletromagnético deve ser forte o bastante para interromper as conexões e, talvez, fechá-lo, temporária ou permanentemente."
 EH_whole_new_dawn: "Um Novo Amanhecer"
 EH_whole_new_dawn_desc: "Sabemos tudo o que precisamos saber para fechar os Portais. Se seguirmos o plano, devemos ser fortes o bastante para finalmente encerrar esta guerra."
