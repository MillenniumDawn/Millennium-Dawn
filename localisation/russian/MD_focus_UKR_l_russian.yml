 ukr_modernize_sov_equipment_old_artillery_upkeep_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_m30_for_tooltip\n\n\n\n\n\n\n\n\n§WНаши пушки §YМ-46§! и гаубицы §YМ-30§! военных времён ржавеют на хранении. Регулярное обслуживание позволит в случае войны §Gпривести их к бою за считаные дни§!.\n------------------\nОбслуживание действует §Y5§! лет, затем его нужно повторить.§!"
