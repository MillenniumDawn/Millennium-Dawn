 AUSHUN_form_category: "Das österreichisch-ungarische Kaiserreich wiederherstellen"
 AUSHUN_form_category_desc: "Das österreichisch-ungarische Kaiserreich war eine Großmacht in Mitteleuropa im späten 19. und frühen 20. Jahrhundert. Die Nation wurde nach ihrer vernichtenden Niederlage im Ersten Weltkrieg aufgelöst. Sie zerbrach in die Länder Tschechien, Österreich, Ungarn, die Slowakei, Slowenien, Bosnien sowie Teile der Ukraine, Polens und Rumäniens. Es ist an der Zeit, das Erbe zurückzuerobern, das so lange verloren war. Es ist an der Zeit, das österreichisch-ungarische Kaiserreichzu wiederherzustellen."
 AUSHUN_integrate_start: "Begin forming [GetAUSHUNNameDef]"
 AUSHUN_integrate_start_desc: "The holdings of the Austro-Hungarian Empire have been reclaimed by our military and our politicians have started the work towards administering the new regions.\n\n"
 AUSHUN_integrate_austria: "Integrate [GetAUSHUNNameAdj] [AUS.GetAdjective] Territories"
 AUSHUN_integrate_austria_desc: "The corelands of the former Habsburg empire, Austria should be one of the main seats of power in our nation."
 AUSHUN_integrate_hungary: "Integrate [GetAUSHUNNameAdj] [HUN.GetAdjective] Territories"
 AUSHUN_integrate_hungary_desc: "The Kingdom of Hungary was the other half of the Dual Monarchy, a partner in the governance of the empire. Its integration is essential to restoring the imperial structure."
 AUSHUN_integrate_slovenia: "Integrate [GetAUSHUNNameAdj] [SLV.GetAdjective] Territories"
 AUSHUN_integrate_slovenia_desc: "The Slovene lands formed part of the Austrian crown lands, providing access to the Adriatic and serving as a bridge between Austria and the Balkans."
 AUSHUN_NORTHITA_integrate: "Integrate [GetAUSHUNNameAdj] North Italian Territories"
 AUSHUN_NORTHITA_integrate_desc: "The Italian territories of Lombardy-Venetia were once jewels of the Habsburg crown, rich in culture and commerce. Their return would restore Austria's influence over the Po Valley."
 AUSHUN_integrate_croatia: "Integrate [GetAUSHUNNameAdj] [CRO.GetAdjective] Territories"
 AUSHUN_integrate_croatia_desc: "Croatia was part of the Hungarian crown with significant autonomy. Its ports and strategic position along the Adriatic made it vital to the empire's naval power."
 AUSHUN_integrate_bosnia: "Integrate [GetAUSHUNNameAdj] [BOS.GetAdjective] Territories"
 AUSHUN_integrate_bosnia_desc: "Administered by Austria-Hungary since 1878 and formally annexed in 1908, Bosnia-Herzegovina's integration will secure our southern borders and extend our influence into the Balkans."
 AUSHUN_integrate_slovakia: "Integrate [GetAUSHUNNameAdj] [SLO.GetAdjective] Territories"
 AUSHUN_integrate_slovakia_desc: "The Slovak lands were an integral part of the Kingdom of Hungary, forming the mountainous northern frontier of the crown. Their reintegration strengthens our hold over the Carpathians."
 AUSHUN_AUSROM_integrate: "Integrate [GetAUSHUNNameAdj] Transylvanian Territories"
 AUSHUN_AUSROM_integrate_desc: "Transylvania was a historic crown land of Hungary, contested between Romanian and Hungarian populations. Control of this region secures the eastern approaches to the empire."
 AUSHUN_integrate_czechia: "Integrate [GetAUSHUNNameAdj] [CZE.GetAdjective] Territories"
 AUSHUN_integrate_czechia_desc: "The Bohemian crown lands were among the most industrialized and culturally rich territories of the empire. Prague stood as one of the great imperial cities, and its reintegration is crucial."
 AUSHUN_AUSPOL_integrate: "Süd-Polen integrieren"
 AUSHUN_AUSPOL_integrate_desc: "Galicia was a crown land acquired through the partitions of Poland, bringing both economic resources and strategic depth to the northern frontier of the empire."
 AUSHUN_WESTUKR_integrate: "Süd-West-Ukraine integrieren"
 AUSHUN_WESTUKR_integrate_desc: "The eastern reaches of Galicia were home to Ruthenian populations and provided agricultural wealth. Their integration extends our influence into the Ukrainian borderlands."
 AUSHUN_update_flag: "Finish Forming [GetAUSHUNNameDef]"
 AUSHUN_update_flag_desc: "With every constituent territory integrated, we can complete our transformation and proclaim [GetAUSHUNNameDef], adopting its unified flag and name."
 is_AUSHUN: "Has formed [GetAUSHUNNameDef]"
 PBL_form_category: "Peru-Bolivianische Konföderation"
 PBL_form_category_desc: "The Peru-Bolivian Confederation was originally a short-lived entity in the early 19th century. It arose from the division of the Peruvian Republic and the civil wars of 1834 and 1835 to 1836 and included the Bolivian State. Modern talks are minimal, but it is nevertheless ever present in the political atmosphere of the Bolivian and Peruvian people. It is time to consider this new tomorrow for our people."
 PBL_integrate_start: "Begin forming [GetPBLNameDef]"
 PBL_integrate_start_desc: ""
 PBL_integrate_peru: "Integrate [GetPBLNameAdj] [PRU.GetAdjective] Territories"
 PBL_integrate_peru_desc: "Peru ist der größere der beiden Nationalstaaten in der Konföderation. Er verfügt über die größte Bevölkerung, Wirtschaft und Landfläche. Die Integration Perus ist ein kolossales Unterfangen, aber die Übernahme dieses Staates ist ein solider Schritt für die Interessen der neuen Konföderation."
 PBL_integrate_bolivia: "Integrate [GetPBLNameAdj] [BOL.GetAdjective] Territories"
 PBL_integrate_bolivia_desc: "Bolivien ist einer der beiden großen Nationalstaaten, die die Konföderation gegründet haben. Es ist ein kleinerer Staat in Bezug auf Landfläche, Bevölkerung und wirtschaftliche Leistungsfähigkeit, was jedoch kein Grund ist, dieses Land zu diskreditieren. Die Berge sind reich an Rohstoffen, die für die Herstellung von Elektronik und anderen Zwischenprodukten unerlässlich sind. Die Integration dieses Landes festigt eine weitere starke Position für unsere nun diversifizierte Wirtschaft."
 PBL_WESTPAR_integrate: "Integrate Western Paraguay"
 PBL_WESTPAR_integrate_desc: "Der Westen Paraguays verfügt nicht über die gleichen Rohstoffvorkommen wie der Westen Brasiliens oder der Norden Chiles. Dennoch verfügt dieses Gebiet über reichlich Ackerland und Regionen, in denen wir die Industrie unserer neuen Nation entwickeln können."
 PBL_WESTBRA_integrate: "Westliches Brasilien integrieren"
 PBL_WESTBRA_integrate_desc: "Westbrasilien ist die Heimat indigener Völker, reichhaltiger Ressourcen und vieles mehr. Die Integration Westbrasiliens sollte dazu beitragen, den Standpunkt unseres Landes zu verbessern und mehr Land für die Entwicklung zu gewinnen."
 PBL_NORTHCHL_integrate: "Integration von Nordchile"
 PBL_NORTHCHL_integrate_desc: "The northern regions of Chile are ripe for integration, and we must bring these into the fold to assist us in our future goals."
