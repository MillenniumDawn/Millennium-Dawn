 sp_maglev_trains_idea: "Trenes Maglev"
 sp_thorium_nuclear_fuel_idea: "Combustible Nuclear de Torio"
 sp_wireless_power_grid_expansion_idea: "Expansión de la Red Eléctrica Inalámbrica"
 sp_improved_synthetic_diamonds_idea: "Desarrollo Revitalizado de Diamantes Sintéticos"
 scientist_trait_genius: "Genio"
 scientist_trait_genius_desc: "Una mente visionaria que empuja los límites de la ciencia y la tecnología con una innovación sin paralelo. Este tipo de talento emerge solo una vez en una generación."
 scientist_trait_brilliant_theorist: "Teórico Brillante"
 scientist_trait_brilliant_theorist_desc: "Un maestro de conceptos y teorías abstractas, capaz de revolucionar la estrategia militar y la investigación científica."
 scientist_trait_gifted_engineer: "Ingeniero Dotado"
 scientist_trait_gifted_engineer_desc: "Un ingeniero naturalmente talentoso, apto para resolver problemas técnicos complejos en una variedad de campos."
 scientist_trait_bright: "Brillante"
 scientist_trait_bright_desc: "Un científico agudo y de pensamiento rápido que sobresale en captar nuevos conceptos y aplicarlos eficientemente."
 scientist_trait_fast_learner: "Aprendiz Rápido"
 scientist_trait_fast_learner_desc: "Se adapta rápidamente a nuevos desafíos, aprende más rápido que sus compañeros y sobresale en diversos campos científicos."
 scientist_trait_resourceful: "Recursivo"
 scientist_trait_resourceful_desc: "Siempre encuentra soluciones creativas, incluso cuando los recursos son escasos o las situaciones son desesperadas."
 scientist_trait_nuclear_specialist: "Especialista Nuclear"
 scientist_trait_nuclear_specialist_desc: "Un físico a la vanguardia de la investigación atómica, profundamente inmerso en el estudio de la fisión nuclear y las reacciones en cadena."
 scientist_trait_civilian_technology_expert: "Experto en Investigación Civil"
 scientist_trait_civilian_technology_expert_desc: "Un experto en el desarrollo de tecnologías dirigidas al sector civil."
 scientist_trait_energy_expert: "Experto en Producción de Energía"
 scientist_trait_energy_expert_desc: "Un veterano de múltiples empresas energéticas capaz de desarrollar nuevos métodos de producción de energía."
 scientist_trait_telecommunications_expert: "Experto en Telecomunicaciones"
 scientist_trait_telecommunications_expert_desc: "Una persona nacida con un teléfono en la mano, experta en encontrar formas de hacer que el porno esté disponible en todos los dispositivos que posees."
 scientist_trait_naval_vessels_specialist: "Especialista en cascos navales"
 scientist_trait_naval_vessels_specialist_desc: "Especialista en el diseño de cascos de buques de guerra, desde lanchas dron hasta superportaaviones."
 scientist_trait_stealth_specialist: "Especialista en Buques Sigilosos"
 scientist_trait_stealth_specialist_desc: "Especializado en desarrollar buques con una firma de radar y sonar mínima."
 scientist_trait_avionics_specialist: "Especialista en Aeronaves"
 scientist_trait_avionics_specialist_desc: "Un especialista en aerodinámica y diseño de aeronaves, capaz de desarrollar estructuras, motores y diseños de aeronaves superiores para dominar los cielos."
 scientist_trait_missile_specialist: "Especialista en Misiles"
 scientist_trait_missile_specialist_desc: "Especializado en tecnología de misiles, centrándose en los principios de propulsión en programas de misiles balísticos y guiados."
 scientist_trait_space_specialist: "Entusiasta del Espacio"
 scientist_trait_space_specialist_desc: "Una persona que ha dedicado su vida a avanzar en los objetivos de la humanidad más allá de la Tierra."
 scientist_trait_aircraft_engine_expert: "Experto en Propulsión"
 scientist_trait_aircraft_engine_expert_desc: "An authority on jet and piston propulsion, advancing research into engines and their application in military aircraft."
 scientist_trait_autonomous_plane_expert: "Experto en Vehículos no Tripulados"
 scientist_trait_autonomous_plane_expert_desc: "Un experto en hacer que las cosas vuelen sin que nadie las pilotee."
 scientist_trait_armored_specialist: "Especialista en vehículos blindados"
 scientist_trait_armored_specialist_desc: "Ingeniero experimentado especializado en el diseño de plataformas y cascos de vehículos blindados."
 scientist_trait_infantry_specialist: "Especialista en Infantería"
 scientist_trait_infantry_specialist_desc: "Un especialista en armas pequeñas, su uso y diseño."
 scientist_trait_mechsuit_specialist: "Especialista en Trajes Mecánicos"
 scientist_trait_mechsuit_specialist_desc: "Alguien que ha jugado demasiado a Titanfall."
 sp_improved_space_solar_farms_idea: "Granjas Solares Basadas en el Espacio"
 sp_afv_double_cannons: "Doble Cañón"
 sp_afv_double_cannons_desc: "Generally, our lighter armoured fighting vehicles are equipped with a single weapon, usually an autocannon. However, we might be able to create a system for mounting two cannons side by side."
 sp_afv_double_cannons_reward_improved_autoloader: "Autocargador Mejorado"
 sp_afv_double_cannons_reward_improved_autoloader_desc: "Nuestros ingenieros han desarrollado un autocargador mejorado para nuestros tanques mientras trabajaban en un sistema de recarga de doble cañón."
 sp_coilgun_memes: "Coilguns de Infantería"
 sp_coilgun_memes_desc: "Al hacer una versión en miniatura de la tecnología de railgun de nuestros tanques, podemos darle a nuestra infantería el poder de un proyectil de tungsteno a velocidad mach. \nNo tientes al desarrollador esquizofrénico porque juro que haré cosas como esta en una tarde."
 sp_multipurpose_warhead: "Cabezas de Guerra Multipropósito"
 sp_multipurpose_warhead_desc: "Tenemos misiles contra tanques y misiles contra aeronaves. Pero, ¿qué pasaría si pudiéramos dar a nuestros misiles eficacia contra ambos? De esta manera, en un apuro, los misiles antitanque y antiaéreos podrían usarse contra objetivos distintos a los previstos."
 sp_supercarrier_1: "Superportaaviones Tempranos"
 sp_supercarrier_1_desc: "El espacio ampliado en la cubierta y la capacidad de construir barcos de ese tamaño serán cruciales para nuestra proyección de poder a largo plazo."
 sp_supercarrier_2: "Superportaaviones Tardíos"
 sp_supercarrier_2_desc: "Con la adición de motores nucleares, más potencia significa barcos más grandes y mayor espacio en la cubierta."
 sp_stealth_technology: "Experimentación con Sigilo"
 sp_stealth_technology_desc: "Para darnos una ventaja sobre nuestro enemigo, debemos encontrar una manera de hacer que nuestros cazas sean menos detectables por el radar."
 sp_arsenal_bird: "Pájaro Arsenal"
 sp_aresnal_bird_desc: "Con el desarrollo de aeronaves completamente autónomas, motores de aeronaves nucleares y sistemas avanzados de control de vuelo, podemos construir una aeronave que pueda llevar una fuerza aérea de drones completa en sí misma. Esta aeronave, aunque extremadamente costosa, será la cúspide de los sistemas de combate aéreo."
 sp_multipurpose_warhead_reward_improved_warhead: "Ojivas Mejoradas"
 sp_multipurpose_warhead_reward_improved_warhead_desc: "Mientras intentaban averiguar cómo agregar rendimiento antiaéreo a los misiles antitanque y rendimiento antitanque a los misiles antiaéreos, nuestros ingenieros descubrieron cómo mejorar el rendimiento general de un tipo de misiles."
 sp_multipurpose_warhead_reward_improved_warhead_at: "Mejor Rendimiento Antitanque"
 sp_multipurpose_warhead_reward_improved_warhead_aa: "Mejor Rendimiento Antiaéreo"
 sp_emp_warhead: "Guerra Electrónica Mejorada"
 sp_emp_warhead_desc: "Tanto los tanques como los aviones tienen contramedidas de guerra electrónica que pueden reducir el impacto de las armas EMP. Dado que diferentes plataformas utilizan diferentes arquitecturas, solo podemos enfocarnos eficazmente en un tipo de objetivo."
 sp_emp_warhead_reward_improved_warhead_at: "Priorizar Objetivos Terrestres"
 sp_emp_warhead_reward_improved_warhead_aa: "Priorizar Objetivos Aéreos"
 sp_fire_support_land_drone_reward_improved_communication_desc: "Mientras desarrollaban un método de control eficiente para nuestros drones, nuestros ingenieros han desarrollado un método mejorado de comunicación inalámbrica. Podemos utilizar este avance tanto en una aplicación civil como militar."
 sp_double_shot_rifle_tt: "Aumenta todas las unidades de §YFuerzas Especiales§! §YDefensa§! y §YRuptura§! en §G5%§!\n"
 sp_double_shot_rifle_tech: "Rifle de Doble Disparo"
 sp_ground_fireandforget: "ATGM de Disparar y Olvidar"
 sp_ground_fireandforget_desc: "La miniaturización de la electrónica ahora permite que un misil se guíe automáticamente a un objetivo a través de bloqueos térmicos."
 sp_modern_air_electronics: "Electrónica Aerotransportada Moderna"
 sp_modern_air_electronics_desc: "Una nueva generación de avances en electrónica para radares aerotransportados, cabinas y otros sistemas."
 sp_future_air_electronics: "Electrónica Aerotransportada del Futuro"
 sp_future_air_electronics_desc: "Fusionando la tecnología más reciente en IA inteligente, sistemas láser y nanotecnología para equipos aerotransportados de alta eficiencia."
 sp_modern_air_weapons: "Armas Aerotransportadas Inteligentes"
 sp_modern_air_weapons_desc: "Sistemas de selección de objetivos inteligentes, radares de ondas milimétricas montados en armas, bloqueo después del lanzamiento. Una nueva generación de armas que allanan el camino del futuro campo de batalla."
 sp_future_air_weapons: "Armas Aerotransportadas Mejoradas con IA"
 sp_future_air_weapons_desc: "Mejorando la generación anterior de misiles y sensores aerotransportados con procesadores de IA y sistemas de detección y selección de objetivos aún más finos."
 sp_hypersonic_missile: "Misiles Hipersónicos"
 sp_hypersonic_missile_desc: "Los misiles hipersónicos darán a nuestra fuerza de misiles estratégicos la capacidad de atacar profundamente en territorio enemigo a velocidades consideradas imposibles no hace mucho tiempo."
 sp_hypersonic_missile_tt: "Desbloquea §Ytecnología de misiles hipersónicos§!"
 sp_naval_generic_reward_army_xp_1: "Cambio en el Flujo de Ideas"
 sp_naval_generic_reward_army_xp_2: "Ola de Ideas"
 sp_naval_generic_reward_army_xp_3: "Tsunami de Innovaciones!"
 sp_emp_warhead_reward_improved_warhead: "Arma Electrónica"
 sp_emp_warhead_reward_improved_warhead_desc: "El equipo electrónico puede darnos una ventaja en el combate aéreo."
 sp_helicopter_project: "Experimentos de diseño de helicópteros"
 sp_helicopter_project_desc: "Al igual que el diseño de un automóvil y otros vehículos, el diseño y la construcción de helicópteros requieren el conocimiento local para producir estos vehículos especializados localmente. Deberíamos realizar algunos experimentos de diseño hasta que desarrollemos una versión para nosotros mismos."
 sp_helicopter_project_tt: "Desbloquea las siguientes §YLíneas tecnológicas§!:\n- §YHelicópteros de transporte§!\n- §YHelicópteros de ataque§!\n"
 sp_air_generic_reward_army_xp_1: "Soplo de Aire Fresco"
 sp_air_generic_reward_army_xp_2: "Brisa de Innovación"
 sp_air_generic_reward_army_xp_3: "Vientos de Cambio"
 sp_tank_stealth_armor_early: "Armadura furtiva temprana"
 sp_tank_stealth_armor_early_desc: "By creating armor that not only protects our tanks, but also provides better concealment, we can embrace the best armored theories: that not being hit is better than stopping the hit."
 sp_electronic_government: "Gobierno electrónico"
 sp_electronic_government_desc: "Para maximizar la eficiencia del Estado, los ciudadanos deberían poder acceder e interactuar con su gobierno desde la comodidad de su hogar. Esto fomentará una mayor alfabetización en internet entre los ciudadanos y reducirá el gasto público a niveles astronómicos."
 sp_tank_nera_armor: "Compuesto NERA pesado"
 sp_tank_nera_armor_desc: "Podemos investigar materiales avanzados para producir tipos de blindaje más pesados ​​y resistentes, como insertos de uranio empobrecido."
 sp_aircraft_project_bba_tt: "Desbloquea las siguientes §YLíneas tecnológicas§!:\n-§YFuselajes ligeros§!\n-§YFuselajes medianos§!\n-§YFuselajes pesados§!\n-§YHelicópteros de ataque§!\n-§YHelicópteros de transporte§!\n"
 sp_aircraft_project_non_bba_tt: "Desbloquea las siguientes §YLíneas Tecnológicas§!:\n- §YCazas§!\n- §YApoyo Aéreo Cercano§!\n- §YBombarderos§!\n- §YVehículos Aéreos no Tripulado de Combate§!\n- §YCazas Ligeros§!\n"
 sp_space_weapons: "Armas basadas en el espacio"
 has_completed_space_program_tt: "Ha completado el proyecto especial: §Y$sp_space_program$§!"
 has_completed_space_weapons_tt: "Ha completado el proyecto especial: §Y$sp_space_weapons$§!"
 sp_microchip_production: "Laboratorios de producción de microchips"
 sp_microchip_production_desc: "By experimenting with miniaturizing our computing processes, and learning how to make them on a large scale, we will be able to produce our own microchips to use in modern weapons and equipment."
 sp_composite_production: "Laboratorios de producción de materiales compuestos"
 sp_composite_production_desc: "Al experimentar con nuevas tecnologías y métodos de fundición, mezcla y otros métodos químicos, podemos perfeccionar formas de fabricar materiales compuestos modernos y avanzados."
 sp_recon_land_drone: "Drones de reconocimiento terrestre"
 sp_recon_land_drone_desc: "La guerra terrestre moderna depende cada vez más de la superioridad informativa y de la detección temprana de amenazas. Al desplegar drones de reconocimiento dedicados junto a nuestras fuerzas terrestres, ampliamos su conocimiento mucho más allá de los métodos de exploración tradicionales. Esta inversión permite una toma de decisiones más rápida, una mejor coordinación y una imagen más clara del campo de batalla antes de que se produzca el combate directo."
 sp_smart_bullets: "Balas inteligentes"
 sp_smart_bullets_desc: "Los avances en guiado y puntería están empezando a influir incluso en los detalles más pequeños del campo de batalla. Al invertir en munición inteligente para nuestra infantería y armas de apoyo, buscamos mejorar la precisión y la eficacia en entornos de combate complejos."
 sp_recon_drone_land: "Sistemas de drones de reconocimiento terrestre"
 sp_recon_drone_land_desc: "Con el uso generalizado de vehículos aéreos no tripulados en el campo de batalla, los drones de reconocimiento terrestre proporcionan a las fuerzas terrestres información de inteligencia continua y en tiempo real sobre la línea del frente. Al operar cerca de las unidades de combate, estos drones mejoran el conocimiento de la situación, la identificación de objetivos y la coordinación sin exponer al personal a riesgos directos."
 sp_airless_tires: "Neumáticos sin aire"
 sp_airless_tires_desc: "La movilidad sigue siendo un factor crítico en las operaciones terrestres modernas, especialmente en entornos hostiles e impredecibles. Al adoptar la tecnología de neumáticos sin aire para vehículos militares, podemos reducir las necesidades de mantenimiento y eliminar la vulnerabilidad a los pinchazos. Esta inversión mejora la fiabilidad operativa, permitiendo que nuestras fuerzas mantengan el movimiento incluso en condiciones adversas."
 sp_exoskeletal_engine_tank: "Sistemas de motores exoesqueléticos"
 sp_exoskeletal_engine_tank_desc: "Los motores convencionales dependen de ejes y discos centrales que conllevan limitaciones inherentes de peso, tensión y eficiencia. Al explorar diseños de motores exoesqueletales, donde las palas rotatorias se apoyan dentro de una estructura de tambor-rotor, pretendemos reducir el peso, mejorar la fiabilidad y abrir nuevas posibilidades para una propulsión compacta y de gran potencia."
 sp_nuclear_engine_tank: "Sistemas de motores de propulsión nuclear"
 sp_nuclear_engine_tank_desc: "La creciente demanda de combustible y los rangos operativos ampliados están sometiendo a una presión cada vez mayor a la logística blindada convencional. Al explorar sistemas de motores de propulsión nuclear para vehículos terrestres pesados, buscamos reducir la dependencia de las líneas de suministro al tiempo que sostenemos la movilidad a largo plazo."
 sp_light_walker_tank_chassis: "Chasis de tanque andante ligero"
 sp_light_walker_tank_chassis_desc: "Un chasis blindado bípedo ligero diseñado para atravesar terrenos escarpados, escombros y obstáculos urbanos que limitan a los vehículos de oruga convencionales. Aunque su perfil elevado y sus complejos actuadores introducen desafíos de mantenimiento y fiabilidad, una plataforma de andante ligero puede ofrecer una movilidad excepcional en ciudades densas y terrenos difíciles cuando cuenta con el apoyo adecuado de infantería y drones."
 sp_drone_lrs: "Sistema de lanzamiento de cohetes dron"
 sp_drone_lrs_desc: "Al sustituir las municiones de cohetes convencionales por grandes cantidades de drones desechables, este sistema de lanzamiento ofrece una potencia de fuego basada en enjambres a lo largo de amplias zonas. Una vez desplegados, los drones se dispersan para realizar tareas de reconocimiento, ataque o merodeo, lo que permite a las fuerzas terrestres saturar las defensas enemigas, adaptarse a los objetivos en vuelo y mantener la presión sin depender de las cargas útiles de los misiles tradicionales."
 sp_heavy_walker_tank_chassis: "Chasis de tanque andante pesado"
 sp_heavy_walker_tank_chassis_desc: "Basándose en los conceptos de andantes anteriores, las plataformas blindadas bípedas pesadas combinan una gruesa protección de blindaje con una movilidad articulada para atravesar terrenos intransitables para los tanques pesados convencionales. Aunque son más lentos y mecánicamente más complejos, estos vehículos priorizan la durabilidad frontal y las plataformas de armas estables, lo que les permite apoyar operaciones de ruptura en entornos urbanos densos y accidentados."
 sp_walker_tank_chassis: "Chasis de tanque andante"
 sp_walker_tank_chassis_desc: "Combinando el diseño de vehículos blindados con una movilidad articulada basada en patas, los chasis de tanques andantes están destinados a operar en terrenos donde las plataformas de oruga convencionales tienen dificultades. Al sortear obstáculos y navegar por terrenos irregulares, estos vehículos ofrecen una mayor flexibilidad en entornos urbanos, montañosos y fuertemente dañados, a costa de una mayor complejidad mecánica y exigencias de mantenimiento."
 sp_hover_suspension: "Sistemas de suspensión por sustentación"
 sp_hover_suspension_desc: "Al sustituir el tren de rodaje tradicional de orugas por sistemas de sustentación por aire, los vehículos blindados de transporte de personal adquieren la capacidad de moverse por encima de la superficie del suelo en lugar de a través de ella. Esto permite a los vehículos atravesar barro, nieve, agua y escombros con un menor contacto con el suelo, mejorando la movilidad y la flexibilidad de despliegue al tiempo que introduce nuevos requisitos de potencia y mantenimiento."
 sp_magneto_explosive_munition: "Municiones explosivas magnetohidrodinámicas"
 sp_magneto_explosive_munition_desc: "Los vehículos fuertemente blindados siguen impulsando el desarrollo de armas antitanque más avanzadas. Al explorar las municiones explosivas magnetohidrodinámicas, buscamos mejorar la penetración y los efectos de interrupción de nuestros misiles guiados."
 sp_drone_torpedoes: "Torpedos dron"
 sp_drone_torpedoes_desc: "La guerra naval evoluciona rápidamente y los torpedos tradicionales ya no son suficientes contra las amenazas modernas. Al invertir en sistemas de torpedos basados en drones, pretendemos aumentar nuestra potencia de ataque bajo las olas. Estos nuevos torpedos son capaces de realizar un seguimiento independiente de los objetivos y un combate adaptativo, lo que permite a nuestras flotas mantener la iniciativa en operaciones navales y antisubmarinas."
 sp_anti_drone_laser_modules: "Módulos láser antidron"
 sp_anti_drone_laser_modules_desc: "El uso cada vez mayor de drones y municiones guiadas de precisión en el mar está obligando a replantear la defensa aérea naval. Al integrar sistemas antidron basados en láser en nuestros buques, podemos responder a estas amenazas con una velocidad y precisión que las armas tradicionales no pueden igualar."
 sp_mineclearing_drone: "Sistemas dron de remoción de minas"
 sp_mineclearing_drone_desc: "Las minas navales siguen siendo una de las amenazas más persistentes y rentables para las operaciones marítimas. Al trasladar las tareas de contramedidas de minas a sistemas de drones no tripulados, reducimos el riesgo para las tripulaciones al tiempo que mejoramos la velocidad y el alcance de las operaciones de limpieza."
 sp_naval_recon_drone: "Drones de reconocimiento naval"
 sp_naval_recon_drone_desc: "Mantener la conciencia situacional en el mar es cada vez más complejo a medida que los teatros navales se vuelven más concurridos y disputados. Al invertir en drones dedicados al reconocimiento naval, ampliamos nuestro alcance de vigilancia más allá de los límites de las plataformas tripuladas. Estos sistemas permiten a nuestras flotas detectar, rastrear y responder a las amenazas antes, garantizando decisiones de mando mejor informadas y una mayor flexibilidad operativa."
 sp_drone_submarine: "Submarino dron"
 sp_drone_submarine_desc: "La guerra submarina se está orientando hacia la persistencia y la denegación de acceso, más que hacia la mera potencia de fuego bruta. Mediante el desarrollo de plataformas submarinas no tripuladas, podemos mantener una presencia subacuática continua sin arriesgar a las tripulaciones ni a los activos de gran valor. Estos submarinos dron nos permiten vigilar, perturbar y disputar zonas marítimas clave operando por debajo del umbral de la escalada convencional."
 sp_modern_sail_ships: "Buques modernos asistidos por velas"
 sp_modern_sail_ships_desc: "Las crecientes demandas energéticas y la prolongada logística naval obligan a reevaluar el funcionamiento de nuestras flotas de apoyo. Al reintroducir diseños modernos asistidos por velas en buques seleccionados, podemos reducir el consumo de combustible al tiempo que mantenemos la fiabilidad operativa."
 sp_drone_patrol_boat: "Patrulleras dron"
 sp_drone_patrol_boat_desc: "La seguridad costera y las tareas de patrulla marítima se ven cada vez más limitadas por la escasez de mano de obra y la expansión de las demandas operativas. Mediante el despliegue de patrulleras no tripuladas, podemos mantener una presencia constante en zonas costeras y litorales clave sin necesidad de comprometer buques de guerra de mayor tamaño. Estas plataformas nos permiten vigilar, disuadir y responder a amenazas de baja intensidad con mayor eficiencia y flexibilidad."
 sp_drone_corvette: "Corbetas dron"
 sp_drone_corvette_desc: "A medida que los combates navales se vuelven más distribuidos y conllevan un mayor riesgo, se está reconsiderando el papel de los buques de combate de superficie más pequeños. Al invertir en plataformas de corbetas no tripuladas o con tripulación opcional, podemos proyectar fuerza y mantener el control del mar sin exponer a las tripulaciones a peligros innecesarios."
 sp_rail_gun_naval_battery: "Batería de cañón de riel naval"
 sp_rail_gun_naval_battery_desc: "Mientras que los primeros conceptos de cañones de riel se centraban en disparos únicos de gran impacto, el combate naval en evolución exige una potencia de fuego sostenida y flexible. Al desarrollar una batería de cañón de riel de varios cañones, avanzamos hacia mayores cadencias de fuego y una mejor saturación de objetivos."
 sp_nuclear_torpedoes: "Torpedos nucleares"
 sp_nuclear_torpedoes_desc: "A medida que la disuasión naval se orienta hacia el dominio submarino, las cargas útiles convencionales por sí solas pueden no ser ya suficientes. Al desarrollar torpedos con carga nuclear, introducemos un arma capaz de denegar vastas zonas marítimas y contrarrestar con decisión formaciones navales de gran valor."
 sp_fusion_reactor_engine: "Motor de reactor de fusión"
 sp_fusion_reactor_engine_desc: "Las crecientes demandas energéticas de los sistemas navales modernos están llevando a la propulsión y a la generación de energía convencionales a sus límites. Al invertir en motores de reactor basados en fusión para nuestros buques, pretendemos dar soporte a armas avanzadas, sensores y propulsión sin comprometer la autonomía. Este proyecto sienta las bases para una nueva generación de plataformas navales de alta energía, garantizando la superioridad operativa a largo plazo en el mar."
 sp_naval_swarm_module: "Sistemas de lanzamiento de enjambres de drones navales"
 sp_naval_swarm_module_desc: "Con la integración de sistemas de lanzamiento modulares a bordo de los buques de superficie, las plataformas navales adquieren la capacidad de desplegar grandes cantidades de drones autónomos para misiones de reconocimiento, guerra electrónica y ataque. Estos sistemas en enjambre amplían el alcance de los sensores del buque, colapsan las defensas enemigas y proporcionan una proyección de fuerza flexible sin exponer al buque nodriza a un combate directo."
 sp_radar_jamming_module: "Sistemas de interferencia de radar naval"
 sp_radar_jamming_module_desc: "Mediante el empleo de conjuntos avanzados de guerra electrónica diseñados para perturbar y degradar los sistemas de radar enemigos, los buques de superficie pueden ocultar su posición y movimientos reales en el mar. Estos sistemas de interferencia interfieren en la adquisición de objetivos y el control de tiro, reduciendo la eficacia de los sensores hostiles y aumentando la supervivencia durante los enfrentamientos navales."
 sp_anti_torpedo_module: "Sistemas antitorpedos navales"
 sp_anti_torpedo_module_desc: "Mediante el empleo de conjuntos dedicados de defensa antitorpedos diseñados para detectar, clasificar y neutralizar las amenazas submarinas entrantes, los buques de superficie pueden reducir el riesgo que plantean los torpedos modernos durante el tránsito y las operaciones de combate. Estos sistemas combinan un rápido seguimiento por sonar, el despliegue automatizado de contramedidas y soluciones de interceptación para desbaratar el guiado y derrotar a los torpedos antes del impacto, mejorando la supervivencia en aguas disputadas."
 sp_anti_ship_drone_missile: "Misiles dron antibuque"
 sp_anti_ship_drone_missile_desc: "Las capacidades de ataque naval se definen cada vez más por el alcance, la precisión y la supervivencia. Mediante el desarrollo de sistemas de misiles antibuque basados en drones, podemos ampliar nuestra capacidad de amenazar a los buques hostiles reduciendo al mismo tiempo el riesgo para las aeronaves tripuladas."
 sp_hover_helicopter_engine: "Motores de helicóptero con capacidad de vuelo estacionario"
 sp_hover_helicopter_engine_desc: "Los entornos urbanos y los terrenos confinados plantean nuevas exigencias a la aviación de alas rotatorias. Mediante el desarrollo de sistemas de motores con capacidad de vuelo estacionario, pretendemos mejorar la estabilidad a baja velocidad y el control vertical durante operaciones complejas."
 sp_hypersonic_engine: "Sistemas de propulsión hipersónica"
 sp_hypersonic_engine_desc: "La superioridad aérea está cada vez más condicionada por la velocidad, el alcance y la capacidad de penetrar en espacios aéreos defendidos. Al invertir en sistemas de propulsión hipersónica, buscamos superar los límites del rendimiento de las aeronaves convencionales."
 sp_awacs_project: "Sistema de Alerta y Control Aerotransportado"
 sp_awacs_project_desc: "Ante la creciente complejidad de las operaciones aéreas modernas, los sistemas de alerta y control aerotransportados se han convertido en una capacidad crítica para las fuerzas aéreas avanzadas, mediante el montaje de potentes matrices de radar y sistemas de mando en plataformas de aeronaves de gran autonomía."
 sp_fiber_drones: "Dron guiado por fibra óptica"
 sp_fiber_drones_desc: "Con el rápido desarrollo de los sistemas no tripulados y la guerra electrónica, los drones guiados por fibra óptica han surgido como una solución para contrarrestar las interferencias de señal y de bloqueo. Al transmitir las señales de control a través de enlaces físicos de fibra en lugar de comunicaciones por radio, estos drones pueden operar de forma fiable en entornos disputados manteniendo un control preciso sobre sus cargas útiles."
 sp_air_railguns: "Cañón de riel aire-aire"
 sp_air_railguns_desc: "En la búsqueda continua de mayores velocidades de combate y rangos de interceptación ampliados, los cañones de riel aire-aire se han propuesto como una alternativa a los sistemas de misiles convencionales."
 sp_air_railguns_helicopter: "Cañón de riel para helicóptero"
 sp_air_railguns_helicopter_desc: "Al integrar cañones electromagnéticos compactos en plataformas de alas rotatorias, los helicópteros pueden ofrecer un fuego de velocidad extremadamente alta capaz de penetrar objetivos blindados que normalmente requerirían aeronaves más pesadas o sistemas terrestres."
 sp_space_artillery: "Apoyo de fuego orbital"
 sp_space_artillery_desc: "Con la creciente integración de los sistemas basados en el espacio en la guerra moderna, el concepto de apoyo de fuego orbital ha surgido como un medio para lanzar ataques de precisión desde el espacio sobre objetivos terrestres."
 sp_air_pdl: "Láseres de defensa de punto"
 sp_air_pdl_desc: "Ante la creciente amenaza de los misiles de alta velocidad y los ataques de saturación, los láseres de defensa de punto aerotransportados proporcionan un medio para interceptar las amenazas entrantes a la velocidad de la luz. Al montar sistemas láser de alta energía en plataformas de aeronaves, estas armas pueden atacar y neutralizar misiles en vuelo, reduciendo la dependencia de las existencias limitadas de interceptores y mejorando la supervivencia en espacios aéreos disputados."
 sp_air_helicopter_drone_control: "Control de drones desde helicóptero"
 sp_air_helicopter_drone_control_desc: "La integración de una arquitectura completa de control de drones en las plataformas de alas rotatorias transforma a los helicópteros en nodos de mando aerotransportados para activos no tripulados de reconocimiento y ataque. Este enfoque reduce la necesidad de arriesgar a las tripulaciones en tareas de exposición rutinaria, al tiempo que mejora la coordinación, la fijación de objetivos y el ritmo en todo el espacio de batalla. Esta capacidad es costosa de implementar, ya que exige aviónica avanzada, enlaces de datos seguros y capacidad adicional de potencia y refrigeración."
 sp_air_gunship_railcannons: "Cañones de riel para cañoneros aéreos"
 sp_air_gunship_railcannons_desc: "Este proyecto monta pesadas matrices de cañones de riel en estructuras de aviones cañoneros dedicados, creando una aeronave que puede destrozar objetivos con fuego electromagnético sostenido. Con una velocidad de salida extrema y un control de tiro de precisión, puede desmantelar drones, aeronaves y formaciones terrestres más rápido de lo que pueden reaccionar las armas convencionales. Esta capacidad es ruinosamente costosa, ya que exige una generación de energía excepcional, refrigeración avanzada y materiales de alta calidad para mantener el sistema operativo."
 sp_deep_sea_mining: "Minería en aguas profundas"
 sp_deep_sea_mining_desc: "Las crecientes demandas industriales y tecnológicas están ejerciendo una presión cada vez mayor sobre las cadenas de suministro de recursos tradicionales. Al invertir en capacidades de minería en aguas profundas, pretendemos asegurar el acceso a minerales críticos situados más allá de las zonas de extracción convencionales."
 sp_agriculture_drone: "Sistemas de drones agrícolas"
 sp_agriculture_drone_desc: "Alimentar a una población creciente preservando la eficiencia se está convirtiendo en un desafío estratégico central. Mediante la introducción de sistemas avanzados de drones agrícolas, podemos modernizar las prácticas agrícolas a través de una mejor monitorización, un tratamiento de precisión y la automatización."
 sp_vertical_farming: "Agricultura vertical"
 sp_vertical_farming_desc: "La urbanización y la escasez de tierras están reconfigurando el enfoque que debe darse a la producción de alimentos. Al invertir en la agricultura vertical, trasladamos el rendimiento agrícola a entornos controlados de alta densidad que dependen menos del clima y de la geografía."
 sp_robotic_humanoid: "Asistentes robóticos domésticos"
 sp_robotic_humanoid_desc: "A medida que la vida cotidiana se integra más tecnológicamente, existe un potencial creciente de que los robots humanoides asistan a las personas en sus hogares. Mediante el desarrollo de asistentes robóticos domésticos, pretendemos dar apoyo a las tareas diarias, como el mantenimiento del hogar, el cuidado de personas y la asistencia personal."
 sp_robotic_surgery: "Cirugía robótica"
 sp_robotic_surgery_desc: "Los sistemas médicos se enfrentan a una presión creciente debido al envejecimiento de la población y al aumento de las demandas sanitarias. Al expandir el uso de la cirugía asistida por robot, pretendemos mejorar la precisión, reducir los tiempos de recuperación y hacer que los procedimientos avanzados estén disponibles de forma más amplia."
 sp_smart_grid: "Infraestructura de red inteligente"
 sp_smart_grid_desc: "El creciente consumo de energía y la integración de tecnologías avanzadas plantean nuevas exigencias a las redes eléctricas nacionales. Al invertir en infraestructuras de redes inteligentes, podemos gestionar mejor la distribución de electricidad, equilibrar la oferta y la demanda y reducir las ineficiencias sistémicas."
 sp_equipment_recycling: "Programa de reciclaje de equipamiento militar"
 sp_equipment_recycling_desc: "Un programa integral para recuperar, reacondicionar y reciclar equipamiento militar obsoleto o dañado. Al recuperar materiales y componentes críticos de plataformas fuera de servicio, las fuerzas armadas pueden reducir la tensión industrial, mejorar la resiliencia del suministro y compensar parcialmente las pérdidas de producción durante conflictos prolongados."
 sp_epigenetic_reprogramming: "Reprogramación epigenética"
 sp_epigenetic_reprogramming_desc: "Un programa de investigación biomédica centrado en alterar la expresión génica sin modificar las secuencias de ADN, con el objetivo de mejorar la resiliencia física, el rendimiento cognitivo y las tasas de recuperación del personal militar. Aunque ofrece posibles ventajas a largo plazo en la eficiencia del entrenamiento y la preparación para el combate, el programa plantea preocupaciones éticas y requiere una estricta supervisión regulatoria."
 sp_nuclear_energy: "Reactor de energía nuclear"
 sp_nuclear_energy_desc: "Los reactores nucleares son útiles para producir materiales para bombas. Sin embargo, la cantidad de energía producida podría utilizarse en su lugar para abastecer de electricidad a la industria civil y militar."
 sp_nuclear_bomb: "Proyecto de bomba de fisión nuclear"
 sp_nuclear_bomb_desc: "Una bomba que utiliza el proceso de fisión nuclear para liberar la energía almacenada del átomo en un único momento apocalíptico. Con un arma semejante en nuestro arsenal, ¿quién se atrevería a oponerse a nosotros?"
 sp_amws_combat_system: "Sistema de combate AMWS-21"
 sp_zamws_advanced_mws: "Sistema avanzado de armas múltiples XAMWS-24"
 sp_xciws_close_in_weapon_system: "Sistema de armas de defensa de punto XCIWS-2B"
 sp_close_range_battle_halberd: "Alabarda de combate de corto alcance Tipo-77"
 sp_great_sword: "Espadón BWS-3"
 special_project_consumer_costs_high: "Adquisición secreta de recursos"
 special_project_consumer_costs_high_desc: "Voces tenues susurran sobre una tremenda cantidad de suministros que el gobierno está desviando a lugares aparentemente inocuos. Algunos sugieren que los recursos se están consumiendo en proyectos secretos de investigación y desarrollo, pero existen pocas pruebas concretas que lo confirmen..."
 special_project_consumer_costs_medium: "Adquisición secreta de recursos"
 special_project_consumer_costs_medium_desc: "$special_project_consumer_costs_high_desc$"
 special_project_consumer_costs_low: "Adquisición secreta de recursos"
 special_project_consumer_costs_low_desc: "$special_project_consumer_costs_high_desc$"
 sp_tag_eh_portal_research: "Proyectos de investigación de portales"
 sp_tag_eh_mech_research: "Proyectos de investigación de mechas"
 sp_tag_eh_portal_research_speed_factor: "Velocidad de $sp_tag_eh_portal_research$"
 sp_tag_eh_mech_research_speed_factor: "Velocidad de $sp_tag_eh_mech_research$"
 sp_biofuel_e10_blend: "Mezcla de etanol E10"
 sp_biofuel_e10_blend_desc: "La mezcla de etanol con petróleo en una concentración del 10 % es una tecnología probada y desplegada comercialmente en miles de millones de vehículos en todo el mundo. La estandarización de la infraestructura de producción de E10 reduce nuestra dependencia de los combustibles fósiles importados, redirige los excedentes agrícolas al mix energético y requiere solo modificaciones menores en las redes de refinería y distribución existentes."
 sp_biofuel_flexfuel_butanol: "FlexFuel y síntesis de butanol"
 sp_biofuel_flexfuel_butanol_desc: "Partiendo de la mezcla estandarizada de etanol, este programa sigue dos vías paralelas. Los motores de combustible flexible (Flex-Fuel) toleran el E85 y mezclas similares con alto contenido de etanol, desvinculando la compatibilidad del vehículo de la proporción de la mezcla. El biobutanol ofrece una mayor densidad energética y un rendimiento de arranque en frío más cercano al de la gasolina, pero la producción a gran escala sigue siendo un problema de ingeniería sin resolver. Un programa exitoso situaría a nuestro sector del refinado por delante del mercado global."
 sp_nuclear_bomb_tt: "Desbloquea la capacidad de construir §Ybombas nucleares§!"
 sp_caterpillar_3512b: "Motor diésel Caterpillar 3512B"
 sp_caterpillar_3512b_desc: "El Caterpillar 3512B es un motor diésel potente y fiable que se ha utilizado ampliamente en diversas aplicaciones, incluidos buques marítimos, generación de energía y maquinaria pesada. Su diseño robusto y alto rendimiento lo convierten en una opción ideal para propulsar equipos en las duras condiciones de la Antártida."
 sp_premium_living_quarters: "Alojamientos premium"
 sp_premium_living_quarters_desc: "Estos alojamientos premium ofrecen un mayor confort y comodidades para el personal destinado en la Antártida, mejorando la satisfacción y la productividad de la estación."
 sp_drone_surface_combatant: "Buques de combate de superficie autónomos"
 sp_drone_surface_combatant_desc: "A medida que las tripulaciones se vuelven más difíciles de reclutar y retener, los buques de combate de superficie más grandes se están rediseñando en torno a la automatización. Las fragatas y destructores con tripulación opcional nos permiten mantener una presencia en alta mar con una fracción de la mano de obra, aceptando una mayor dependencia de la electrónica avanzada."
 sp_space_program: "Programa espacial"
 sp_space_program_desc: "Todo el mundo quiere llegar al espacio, excepto Polonia. Polonia no puede ir al espacio."
 sp_space_weapons_desc: "Lo que antes era una obra de ciencia ficción, nuestros científicos por fin han empezado a diseñar KILLSATs y otro armamento que puede utilizarse en el vacío del espacio. La capacidad de emplear estas armas no solo nos hará más fuertes defensivamente, sino también ofensivamente, ya que podremos interceptar, perturbar y contener a las potencias hostiles en las estrellas."
 sp_CNRP: "Polímero reforzado con nanotubos de carbono"
 sp_CNRP_desc: "La incrustación de redes de nanotubos de carbono en materiales compuestos aeroespaciales produce materiales para estructuras de aviones más resistentes y ligeros que la fibra de carbono convencional. El ahorro de peso se traduce directamente en una mejora del alcance, la carga útil y la durabilidad estructural."
