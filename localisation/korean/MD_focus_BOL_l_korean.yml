 bolivia_misc.1.t: "가스에 관한 국민투표"
 bolivia_misc.1.d: "볼리비아 정부는 가장 수익성이 높은 산업 중 하나인 가스 수출 문제에 관한 국민투표를 소집했습니다. 메스티소가 다수인 동부 볼리비아의 세력은 가스 수출 확대를 지지하는 반면, 원주민 공동체는 사회 발전에 더 초점을 맞출 것을 제안하여, 이번 국민투표는 볼리비아의 민족 분열이 뚜렷이 드러나는 투표가 되었습니다."
 bolivia_misc.1.a: "석유 자금은 개발에 써야 한다"
 bolivia_misc.1.b: "석유 수출이 우리의 입지를 개선할 것이다"
 bolivia_ethnic.1.t: "볼리비아군의 정부 사퇴 요구"
 bolivia_ethnic.1.d: "동부 볼리비아의 메스티소 다수와의 긴장이 최근 최고조에 달하고 시위가 이어지는 가운데, 볼리비아군 참모총장이 정부의 사퇴와 친메스티소 [conservatism_L]이(가) 이끄는 새 임시 정부의 수립을 요구했습니다. 이 임시 정부가 볼리비아를 새로운 선거로 이끌 것이며, 이를 거부하면 가혹한 결과가 따를 것이라고 덧붙였습니다. 요구를 따르면 민주 제도가 훼손되겠지만, 적어도 1982년에 끝난 볼리비아의 수많은 군사 독재가 되풀이되는 것은 피할 수 있습니다. 그러나 우리는 군이 정치에 개입하도록 허용해서도 안 되며, 그들의 압력에 저항할 수도 있습니다. 하지만 그렇게 하면 가혹한 결과가 초래될 수 있습니다. 어떤 선택을 하든 볼리비아의 미래에 극적인 영향을 미칠 것입니다."
 bolivia_ethnic.1.a: "우리의 시대는 끝났다, 물러나야 한다"
 bolivia_ethnic.1.b: "우리는 과거로 돌아가지 않을 것이다!"
 bolivia_ethnic.2.t: "볼리비아군의 라파스 진군"
 bolivia_ethnic.2.d: "군의 최후통첩을 거부하기로 한 우리의 결정 이후, 그들은 직접 사태를 장악하여 군 부대를 라파스로 진군시키고 대통령궁과 의회를 점거했습니다. 군은 비상사태를 선포하고 '라틴 아메리카에서 볼리비아의 정당한 위치를 회복하겠다'고 선언했으며, 민주주의가 돌아올 것이라고 약속했으나 군이 그럴 계획이 있을 것 같지는 않습니다."
 bolivia_ethnic.2.a: "볼리비아는 인디언으로부터 구원받았다!"
 bolivia_news.1.t: "볼리비아 정부, 군의 압력으로 사퇴"
 bolivia_news.1.d: "친원주민 성향의 볼리비아 정부와 동부 볼리비아 다수를 차지하는 메스티소 주민 사이의 긴장이 최근 고조되는 가운데, 볼리비아군은 정부의 사퇴와 유력한 친메스티소 야당들이 이끄는 새 임시 정부의 수립을 요구하는 최후통첩을 발표했습니다. 이 임시 정부는 나라를 새로운 선거로 이끌게 됩니다. 과거와 같은 새로운 군사 정권을 우려한 정부는 요구에 따라 사퇴했고, 이후 [BOL.GetLeader]이(가) 볼리비아의 새 임시 대통령으로 취임 선서를 했습니다. [BOL.GetLeader]은(는) 새 정부가 민주적 통치를 회복하고 있다고 주장하지만, 많은 논평가들은 새 정부가 강경한 반원주민 입장을 취했으며 볼리비아군이 원주민 시위에 무력을 사용했다는 보도가 많다는 데 의견을 같이하고 있습니다."
 bolivia_news.1.a: "민주주의에 불행한 날"
 bolivia_news.2.t: "볼리비아군, 군사 쿠데타로 볼리비아 정부 전복"
 bolivia_news.2.d: "친원주민 성향의 볼리비아 정부와 동부 볼리비아 다수를 차지하는 메스티소 주민 사이의 긴장이 최근 고조되는 가운데, 볼리비아군은 정부의 사퇴와 유력한 친메스티소 야당들이 이끄는 새 임시 정부의 수립을 요구하는 최후통첩을 발표했습니다. 이 임시 정부는 나라를 새로운 선거로 이끌게 됩니다. 과거와 같은 새로운 군사 정권을 우려한 정부가 요구를 거부하자 군은 수도 라파스를 급습하여 대통령궁과 의회를 장악했습니다. 이후 군은 비상사태를 선포하고 '라틴 아메리카에서 볼리비아의 정당한 위치를 회복하겠다'고 밝혔는데, 많은 논평가들은 이것이 지역 내 새로운 긴장을 높일 것이라고 보고 있습니다. 또한 1825년 독립 선언 이후 191번째 쿠데타를 겪은 볼리비아 민주주의에 불명예스러운 기록을 더하게 되었으며, 직전 쿠데타는 1980년이었습니다. "
 bolivia_news.2.a: "이 사람들은 쿠데타가 질리지도 않는 모양이군"
 BOL_economic_reforms: "볼리비아 경제 개혁"
 BOL_economic_reforms_desc: "우리 경제는 성장을 안정시키고 구조적 비효율을 줄이기 위한 시급하고 철저한 개혁을 필요로 합니다. 정책 전환과 제도 개혁을 통해 장기적 발전과 보다 공평한 미래의 토대를 마련할 수 있습니다."
 BOL_public_debt_reduction: "공공 부채 감축"
 BOL_public_debt_reduction_desc: "볼리비아의 공공 부채는 감당할 수 없을 만큼 불어나 우리의 경제적 독립을 위협하고 있습니다. 과도한 지출을 줄이고 상환 조건을 협상하여 재정 균형을 회복하고자 합니다."
 BOL_strengthen_the_boliviano: "볼리비아노 강화"
 BOL_strengthen_the_boliviano_desc: "볼리비아노는 우리 경제 안정의 상징으로서 강화되어야 합니다. 통화 개혁과 긴축적 통화 정책은 국내외의 신뢰를 회복하는 데 도움이 될 것입니다."
 BOL_national_development_plan: "국가 개발 계획"
 BOL_national_development_plan_desc: "우리는 통합된 개발 전략 아래 자원과 포부를 조율해야 합니다. 이 계획은 앞으로 수십 년간 인프라, 농업, 산업 확장의 방향을 이끌 것입니다."
 BOL_bolivian_agriculture: "볼리비아 농업"
 BOL_bolivian_agriculture_desc: "농업은 여전히 우리 농촌 경제의 생명줄입니다. 농민을 지원하고 농지 생산성을 높이는 것은 국가 번영에 필수적입니다."
 BOL_increase_credit_for_farmers: "농민 대출 확대"
 BOL_increase_credit_for_farmers_desc: "많은 농민들이 영농을 확장하거나 현대화할 금융 수단을 갖고 있지 못합니다. 국가가 보증하는 신용 한도는 농촌 공동체에 힘을 실어 주고 식량 생산을 촉진할 것입니다."
 BOL_improve_agricultural_technology: "농업 기술 개선"
 BOL_improve_agricultural_technology_desc: "낡은 도구와 방식이 우리 농장의 발목을 잡고 있습니다. 수확량과 효율을 높이기 위해 현대적인 기법, 교육, 기계에 투자할 것입니다."
 BOL_fight_contraband_imports: "밀수입 단속"
 BOL_fight_contraband_imports_desc: "불법 수입품은 국내 생산자의 가격 경쟁력을 깎아내리고 우리 경제를 해칩니다. 국경에서의 단속 강화와 관세 개혁은 국내 산업을 보호하는 데 도움이 될 것입니다."
 BOL_cash_crop_development_initiatives: "환금 작물 개발 계획"
 BOL_cash_crop_development_initiatives_desc: "부가가치가 높은 환금 작물에 집중함으로써 농업을 수출 강국으로 탈바꿈시킬 수 있습니다. 전략적 투자는 농민과 국가에 새로운 수입원을 만들어 줄 것입니다."
 BOL_bolivian_food_industry: "볼리비아 식품 산업 강화"
 BOL_bolivian_food_industry_desc: "탄탄한 식품 산업은 식량 안보를 보장하고 우리 농업 생산물에 부가가치를 더해 줍니다. 볼리비아 전역의 가공, 포장, 유통망을 지원해야 합니다."
 BOL_modern_and_productive_agriculture: "현대적이고 생산적인 농업"
 BOL_modern_and_productive_agriculture_desc: "우리는 볼리비아 농업을 완전히 현대화하고 그 경제적 잠재력을 끌어내고자 합니다. 혁신과 인프라를 통해 자급자족과 성장을 이룰 것입니다."
 BOL_national_referendum_on_gas: "가스에 관한 국민투표"
 BOL_national_referendum_on_gas_desc: "가스는 우리의 가장 큰 국가 자산 중 하나이며, 그 미래는 민주적으로 결정되어야 합니다. 국민투표로 민영화를 계속할지, 국가 통제를 더 강화할지가 정해질 것입니다."
 BOL_oil_money_for_development: "개발을 위한 석유 자금"
 BOL_oil_money_for_development_desc: "가스와 석유에서 나오는 수익은 볼리비아 국민을 위해 쓰여야 합니다. 수익을 보건, 교육, 인프라로 돌리면 우리의 천연 자산이 모든 국민에게 혜택을 주게 될 것입니다."
 BOL_prioritize_social_development: "사회 발전 우선"
 BOL_prioritize_social_development_desc: "우리는 불평등의 격차를 좁히고 생활 수준을 높여야 합니다. 사회 발전 프로그램은 교육, 주거, 사회적 이동성을 목표로 합니다."
 BOL_prioritize_healthcare_development: "보건 의료 발전 우선"
 BOL_prioritize_healthcare_development_desc: "볼리비아의 보건 의료 체계는 시급한 관심이 필요합니다. 병원, 교육, 농촌 진료소에 대한 투자는 생명을 구하고 더 건강한 국가를 만들 것입니다."
 BOL_prioritize_infrastructure_development: "인프라 발전 우선"
 BOL_prioritize_infrastructure_development_desc: "현대적 인프라는 경제 성장에 필수적입니다. 도로, 전력망, 상수도 체계를 확장하여 지역 사회를 연결하고 역량을 키울 것입니다."
 BOL_bring_the_ypfd_under_state_control: "YPFB를 국가 통제 아래로"
 BOL_bring_the_ypfd_under_state_control_desc: "볼리비아 국영 석유 회사(YPFB)는 공공의 이익에 봉사해야 합니다. 그 사업을 국유화함으로써 에너지 부문에 대한 주권을 되찾습니다."
 BOL_reinforce_gas_exports: "가스 수출 강화"
 BOL_reinforce_gas_exports_desc: "가스 수출은 여전히 우리 경제의 기둥입니다. 송유관, 협정, 생산 능력을 개선하면 수익과 지역 내 영향력이 늘어날 것입니다."
 BOL_invite_gazprom: "가즈프롬 초청"
 BOL_invite_gazprom_desc: "가즈프롬과의 협력은 우리에게 기술적 전문성과 외국인 투자를 가져다줍니다. 전략적 동반자 관계는 우리 가스 부문을 새로운 경지로 끌어올릴 수 있습니다."
 BOL_invite_exxonmobil: "엑손모빌 초청"
 BOL_invite_exxonmobil_desc: "엑손모빌과 손잡음으로써 세계적인 에너지 거대 기업 중 하나를 볼리비아로 끌어들입니다. 이러한 조치는 자본, 혁신, 국제적 영향력을 약속합니다."
 BOL_invite_cnpc: "CNPC 초청"
 BOL_invite_cnpc_desc: "중국석유천연가스공사는 경험과 풍부한 자금력을 갖추고 있습니다. 그들과의 협력은 새로운 시장을 열고 글로벌 관계를 강화할 수 있습니다."
 BOL_modernize_bolivian_oil_extraction: "볼리비아 석유 채굴 현대화"
 BOL_modernize_bolivian_oil_extraction_desc: "우리의 석유 채굴 기술은 낡고 비효율적입니다. 시설을 현대화하고 신기술을 도입하면 생산량이 늘고 환경 영향이 줄어들 것입니다."
 BOL_bolivian_manufacturing: "볼리비아 제조업"
 BOL_bolivian_manufacturing_desc: "강력한 제조업 부문을 구축하는 것은 볼리비아의 경제적 독립의 열쇠입니다. 우리는 산업 성장을 촉진하고 일자리를 창출하며 국내 및 수출 시장을 위한 상품을 생산하고자 합니다."
 BOL_cooperation_with_motor_companies: "자동차 기업과의 협력"
 BOL_cooperation_with_motor_companies_desc: "자동차 기업과의 제휴는 볼리비아의 자동차 산업에 시동을 걸어 줄 수 있습니다. 이러한 협력은 성장하는 우리 경제에 투자, 전문성, 기술을 가져다줄 것입니다."
 BOL_expand_the_cement_industry: "시멘트 산업 확장"
 BOL_expand_the_cement_industry_desc: "시멘트는 건설과 인프라에 필수적입니다. 이 산업을 확장하면 건설 사업을 뒷받침하고 새로운 고용 기회를 창출할 것입니다."
 BOL_towards_a_construction_boom: "건설 붐을 향하여"
 BOL_towards_a_construction_boom_desc: "건설 활동의 급증은 경제 성장을 자극하고 생활 수준을 향상시킬 것입니다. 주택과 공공 사업에 대한 투자 확대가 필수적입니다."
 BOL_tax_breaks_for_small_manufacturers: "소규모 제조업체 세금 감면"
 BOL_tax_breaks_for_small_manufacturers_desc: "소규모 제조업체는 많은 재정적 장애에 직면해 있습니다. 세제 혜택을 제공하면 기업가 정신을 장려하고 지역 기업이 번창하는 데 도움이 될 것입니다."
 BOL_counter_black_market_goods: "암시장 물품 대응"
 BOL_counter_black_market_goods_desc: "불법 물품이 우리 시장에 넘쳐나 합법적인 기업에 피해를 주고 있습니다. 단속 강화와 대국민 홍보 캠페인은 암시장을 억제하는 데 도움이 될 것입니다."
 BOL_world_class_textile_production: "세계적 수준의 섬유 생산"
 BOL_world_class_textile_production_desc: "볼리비아는 섬유 제조업의 선두 주자가 될 잠재력을 갖고 있습니다. 품질과 혁신에 투자하면 전 세계에 새로운 시장을 열 수 있습니다."
 BOL_bolivian_mining: "볼리비아 광업"
 BOL_bolivian_mining_desc: "광업은 귀중한 광물과 일자리를 제공하는 볼리비아 경제의 근간입니다. 이 부문을 현대화하면 지속 가능한 관행을 보장하면서 생산량을 늘릴 수 있습니다."
 BOL_increase_comibol_funding: "COMIBOL 자금 증액"
 BOL_increase_comibol_funding_desc: "국영 광업 회사 COMIBOL은 사명을 완수하기 위해 더 많은 자원이 필요합니다. 자금을 늘리면 생산이 증가하고 노동자의 안전이 개선될 것입니다."
 BOL_invite_foreign_mining_companies: "외국 광산 기업 초청"
 BOL_invite_foreign_mining_companies_desc: "외국인 투자는 우리 광업 부문에 기술과 자본을 가져다줄 수 있습니다. 전략적 동반자 관계는 경쟁력과 성장을 높일 것입니다."
 BOL_export_bolivian_resources: "볼리비아 자원 수출"
 BOL_export_bolivian_resources_desc: "볼리비아는 해외 수입을 늘리기 위해 자원 수출을 확대해야 합니다. 물류와 무역 관계를 개선하는 것이 성공의 관건입니다."
 BOL_el_muton_iron_mine: "엘 무툰 철광산"
 BOL_el_muton_iron_mine_desc: "엘 무툰 철광산을 개발하면 국내 철강 생산이 늘어날 것입니다. 이 사업은 우리 산업 포부의 초석입니다."
 BOL_exploit_lithium_deposits: "리튬 매장지 개발"
 BOL_exploit_lithium_deposits_desc: "볼리비아는 세계에서 가장 풍부한 리튬 매장량 일부를 보유하고 있습니다. 책임 있는 채굴은 우리를 세계 배터리 시장의 핵심 주체로 자리 잡게 할 것입니다."
 BOL_improve_miners_working_conditions: "광부 근로 조건 개선"
 BOL_improve_miners_working_conditions_desc: "광부들의 안전과 복지가 우선되어야 합니다. 시설을 개선하고 규정을 집행하면 노동자와 그 가족을 보호할 수 있습니다."
 BOL_expanding_our_economic_potential: "경제적 잠재력 확장"
 BOL_expanding_our_economic_potential_desc: "경제를 다변화하고 강화하면 지속적인 번영이 이루어질 것입니다. 전략적 투자와 혁신은 새로운 성장 기회를 열어 줄 것입니다."
 BOL_foundations_for_it_development: "IT 발전의 토대"
 BOL_foundations_for_it_development_desc: "볼리비아는 현대적인 정보 기술 부문의 토대를 구축해야 합니다. 교육과 인프라를 지원하면 혁신과 디지털 성장이 촉진될 것입니다."
 BOL_electronics_production: "전자 제품 생산"
 BOL_electronics_production_desc: "전자 제품을 국내에서 생산하면 수입이 줄고 첨단 기술 전문성이 쌓일 것입니다. 이 부문은 미래의 경제 발전과 일자리 창출을 이끌 수 있습니다."
 BOL_becoming_an_investment_hub: "투자 거점으로 도약"
 BOL_becoming_an_investment_hub_desc: "투자자에게 유리한 환경을 조성하면 자본과 기술을 끌어들일 수 있습니다. 우리는 비즈니스와 혁신의 지역 중심지가 되고자 합니다."
 BOL_reinforce_energy_production: "에너지 생산 강화"
 BOL_reinforce_energy_production_desc: "안정적인 에너지는 산업과 진보의 토대입니다. 생산 능력을 확장하면 늘어나는 수요를 충족하고 발전을 뒷받침할 수 있습니다."
 BOL_invest_into_windfarms: "풍력 발전 단지 투자"
 BOL_invest_into_windfarms_desc: "풍력 에너지는 볼리비아에 깨끗하고 재생 가능한 전력원을 제공합니다. 풍력 발전 단지에 투자하면 에너지원이 다변화되고 환경 영향이 줄어들 것입니다."
 BOL_hydroelectricity_production: "수력 발전 생산"
 BOL_hydroelectricity_production_desc: "우리 강을 수력 발전에 활용하는 것은 지속 가능한 에너지를 위해 필수적입니다. 이 부문을 확장하면 공급이 개선되고 배출량이 줄어들 것입니다."
 BOL_end_the_rentier_state: "지대 국가의 종식"
 BOL_end_the_rentier_state_desc: "자원 지대에 의존하면 우리 경제의 회복력이 약해집니다. 보다 지속 가능하고 균형 잡힌 경제를 만들기 위해 다변화해야 합니다."
 BOL_beauty_of_the_andes: "안데스의 아름다움"
 BOL_beauty_of_the_andes_desc: "웅장한 안데스 산맥은 자연의 보물입니다. 이를 책임 있게 홍보하면 관광이 활성화되고 국민의 자긍심이 높아질 수 있습니다."
 BOL_improve_public_transportation: "대중교통 개선"
 BOL_improve_public_transportation_desc: "효율적인 대중교통은 지역 사회를 연결하고 혼잡을 줄여 줍니다. 교통망을 개선하면 삶의 질과 경제 활동이 향상될 것입니다."
 BOL_urban_policing_initiative: "도시 치안 계획"
 BOL_urban_policing_initiative_desc: "더 강력하고 지역 사회 중심적인 치안 활동은 도시의 안전을 개선할 수 있습니다. 개혁과 투자는 신뢰를 쌓고 범죄를 줄일 것입니다."
 BOL_promote_sustainable_tourism: "지속 가능한 관광 촉진"
 BOL_promote_sustainable_tourism_desc: "볼리비아의 자연 및 문화 유산은 지속 가능한 관광 성장을 이끌 수 있습니다. 친환경 여행을 장려하면 환경을 보호하면서 지역 사회를 지원할 수 있습니다."
 BOL_revive_tungsten_production: "텅스텐 생산 부활"
 BOL_revive_tungsten_production_desc: "텅스텐은 귀중한 전략 자원입니다. 생산을 되살리면 광업 수익이 늘고 국가 산업이 뒷받침될 것입니다."
 BOL_the_andean_miracle: "안데스의 기적"
 BOL_the_andean_miracle_desc: "최근 수십 년간 볼리비아의 변모는 가히 기적과도 같습니다. 경제 성장, 사회 진보, 정치적 안정이 이 새로운 시대를 규정합니다."
 BOL_fuerzas_armadas_de_bolivia: "푸에르사스 아르마다스 데 볼리비아"
 BOL_fuerzas_armadas_de_bolivia_desc: "볼리비아군은 우리의 주권을 수호하고 국민 통합을 지킵니다. 현대화와 전문성은 미래의 도전에 대비하는 데 필수적입니다."
 BOL_ejercito_de_bolivia: "에헤르시토 데 볼리비아"
 BOL_ejercito_de_bolivia_desc: "우리 육군은 국방의 근간입니다. 그 능력과 대비 태세를 강화하면 국경과 국민의 안전이 보장됩니다."
 BOL_focus_on_mass_assault_tactics: "대규모 돌격 전술 중시"
 BOL_focus_on_mass_assault_tactics_desc: "대규모 돌격 전술은 대규모 병력 집중으로 적군을 압도하는 데 중점을 둡니다. 이 전략은 인력과 협동에 의존하여 승리를 거둡니다."
 BOL_expand_conscription: "징병 확대"
 BOL_expand_conscription_desc: "징병을 확대하면 훈련된 병사의 인력 풀이 늘어납니다. 이로써 국가를 방어하고 위협에 대응할 충분한 인력을 확보할 수 있습니다."
 BOL_expand_military_infrastructure: "군사 기반시설 확장"
 BOL_expand_military_infrastructure_desc: "새로운 기지, 훈련 센터, 물류 거점을 건설하면 우리의 군사적 역량이 강화됩니다. 기반시설 개선은 작전 효율을 뒷받침합니다."
 BOL_focus_on_military_morale: "군 사기 중시"
 BOL_focus_on_military_morale_desc: "높은 사기는 전투 효율에 결정적입니다. 병사 복지, 지휘력, 단결심에 투자하면 투지가 높아집니다."
 BOL_expand_artillery_units: "포병 부대 확장"
 BOL_expand_artillery_units_desc: "포병은 전장에서 핵심적인 화력을 제공합니다. 포병 부대를 늘리면 우리 육군의 공격 및 방어 능력이 향상됩니다."
 BOL_an_army_of_the_masses: "대중의 군대"
 BOL_an_army_of_the_masses_desc: "잘 훈련된 대규모 군대는 침략을 억제하고 주권을 지킬 수 있습니다. 대규모 군대를 구축하려면 훈련과 자원에 대한 헌신이 필요합니다."
 BOL_expand_the_escuela_de_condores: "에스쿠엘라 데 콘도레스 확장"
 BOL_expand_the_escuela_de_condores_desc: "콘도레스 학교는 볼리비아의 정예 병사를 양성합니다. 이를 확장하면 복잡한 안보 도전에 대응할 특수 부대를 더 많이 육성할 수 있습니다."
 BOL_form_specops_brigades: "특수 부대 여단 편성"
 BOL_form_specops_brigades_desc: "특수 부대 여단은 고도의 기술이 필요한 위험도 높은 임무를 수행합니다. 이러한 부대를 편성하면 볼리비아의 전술적 유연성이 향상됩니다."
 BOL_military_mechanization: "군 기계화"
 BOL_military_mechanization_desc: "보병을 기계화하면 기동성과 화력이 향상됩니다. 이 전환은 육군을 현대화하고 전장에서의 효율을 높입니다."
 BOL_abolish_conscription: "징병제 폐지"
 BOL_abolish_conscription_desc: "징병제를 끝내면 군은 전문 지원병 체제로 전환됩니다. 이는 질을 높일 수 있지만 가용 인력을 줄입니다."
 BOL_quality_over_quantity: "양보다 질"
 BOL_quality_over_quantity_desc: "규모는 작지만 더 잘 무장한 병력에 집중하면 전투 효율이 향상됩니다. 순수한 숫자보다 훈련과 현대 장비가 우선시됩니다."
 BOL_a_cost_effective_army: "비용 효율적인 군대"
 BOL_a_cost_effective_army_desc: "군을 군더더기 없이 효율적으로 유지하면 재정적 책임이 보장됩니다. 현명한 예산 편성으로 국방 수요와 경제적 현실의 균형을 맞출 수 있습니다."
 BOL_modernizing_our_equipment: "장비 현대화"
 BOL_modernizing_our_equipment_desc: "무기와 장구를 개선하면 우리 군의 경쟁력이 유지됩니다. 현대 장비는 생존성과 전투력을 향상시킵니다."
 BOL_develop_bolivian_military_industry: "볼리비아 군수 산업 육성"
 BOL_develop_bolivian_military_industry_desc: "국내 무기 산업을 구축하면 수입 의존도가 줄어듭니다. 이는 주권을 강화하고 일자리를 창출합니다."
 BOL_cooperate_with_foreign_arms_companies: "외국 무기 기업과의 협력"
 BOL_cooperate_with_foreign_arms_companies_desc: "국제 무기 기업과의 제휴는 기술 이전을 가속합니다. 이러한 협력은 우리의 군사적 역량을 향상시킵니다."
 BOL_tackle_military_corruption: "군 부패 척결"
 BOL_tackle_military_corruption_desc: "부패는 군의 효율과 사기를 해칩니다. 강력한 개혁과 감독은 신뢰와 규율을 회복시킵니다."
 BOL_elite_officer_training: "정예 장교 양성"
 BOL_elite_officer_training_desc: "고도로 숙련된 장교는 전장의 성공에 핵심입니다. 전문 교육 프로그램은 리더십과 전략적 전문성을 길러 줍니다."
 BOL_an_army_for_the_future: "미래를 위한 군대"
 BOL_an_army_for_the_future_desc: "우리는 군이 미래의 위협과 기술에 맞설 수 있도록 준비시켜야 합니다. 혁신과 적응력이 이 구상의 핵심입니다."
 BOL_fuerza_aerea_boliviana: "푸에르사 아에레아 볼리비아나"
 BOL_fuerza_aerea_boliviana_desc: "우리 공군은 볼리비아의 영공을 방어하고 지상군을 지원합니다. 공군의 전력을 강화하면 국가 안보가 높아집니다."
 BOL_purchase_american_aircraft: "미국 항공기 구매"
 BOL_purchase_american_aircraft_desc: "미국으로부터 항공기를 도입하면 첨단 기술과 검증된 신뢰성을 얻습니다. 이는 우리의 공중 전력을 강화합니다."
 BOL_purchase_chinese_aircraft: "중국 항공기 구매"
 BOL_purchase_chinese_aircraft_desc: "중국 항공기는 비용 효율적인 선택지와 점점 높아지는 기술적 정교함을 제공합니다. 공급처를 다변화하면 전략적 동반자 관계가 확대됩니다."
 BOL_purchase_russian_aircraft: "러시아 항공기 구매"
 BOL_purchase_russian_aircraft_desc: "러시아 항공기는 견고한 설계와 강력한 성능을 갖추고 있습니다. 협력은 우리 공군의 다재다능함을 높여 줍니다."
 BOL_improve_air_defense_infrastructure: "대공 방어 기반시설 개선"
 BOL_improve_air_defense_infrastructure_desc: "대공 방어 체계를 강화하면 핵심 자산과 인구 밀집 지역이 보호됩니다. 개선은 공중 위협에 대한 취약성을 줄여 줍니다."
 BOL_close_air_support: "근접 항공 지원"
 BOL_close_air_support_desc: "근접 항공 지원은 전투 중 지상군의 효율을 높여 줍니다. 공군과 지상군 작전의 통합은 전장의 성공에 필수적입니다."
 BOL_a_new_world_class_academy: "새로운 세계적 수준의 사관학교"
 BOL_a_new_world_class_academy_desc: "세계적 수준의 군사 학교를 설립하면 미래의 지도자를 길러낼 수 있습니다. 이 기관은 우수성의 기준을 세울 것입니다."
 BOL_dominate_the_skies: "하늘을 제패하라"
 BOL_dominate_the_skies_desc: "제공권 확보는 현대전에서 필수적입니다. 우리는 영공을 통제하고 모든 군사 작전을 지원하기 위해 투자할 것입니다."
 BOL_might_of_the_sky: "하늘의 위력"
 BOL_might_of_the_sky_desc: "우리의 항공 전력은 국력과 기술 진보의 상징입니다. 강력한 공군을 유지하면 침략을 억제할 수 있습니다."
 BOL_armada_boliviana: "아르마다 볼리비아나"
 BOL_armada_boliviana_desc: "볼리비아의 해군 전력은 우리의 수로를 방어하고 주권을 뒷받침합니다. 이 전력을 확장하면 국가 안보가 강화됩니다."
 BOL_naval_military_police: "해군 헌병대"
 BOL_naval_military_police_desc: "해군 헌병대는 함선과 기지 내의 규율과 보안을 유지합니다. 이들은 질서와 효율적인 작전을 보장합니다."
 BOL_expand_the_naval_academy: "해군 사관학교 확장"
 BOL_expand_the_naval_academy_desc: "확장된 해군 사관학교는 더 많은 장교와 수병을 양성합니다. 이 투자는 전문적이고 유능한 해상 전력을 구축합니다."
 BOL_return_to_the_sea: "바다로의 귀환"
 BOL_return_to_the_sea_desc: "태평양 접근권을 되찾는 것은 볼리비아의 역사적 목표입니다. 해군력을 갖추는 것은 이 포부에 결정적입니다."
 BOL_bolivian_marine_forces: "볼리비아 해병대"
 BOL_bolivian_marine_forces_desc: "해병대는 신속 대응 능력과 상륙전 전문성을 제공합니다. 해병대의 확장은 볼리비아의 작전 범위를 넓혀 줍니다."
 BOL_quick_strikes: "신속 타격"
 BOL_quick_strikes_desc: "신속하고 결정적인 타격은 적을 압도할 수 있습니다. 이러한 전력을 육성하면 전술적 유연성이 높아집니다."
 BOL_invest_into_shipbuilding: "조선업 투자"
 BOL_invest_into_shipbuilding_desc: "국내 조선 산업을 구축하면 해군 확장과 경제 성장을 뒷받침합니다. 이 부문은 장기적인 국방에 전략적입니다."
 BOL_a_grand_armada: "위대한 아르마다"
 BOL_a_grand_armada_desc: "강력한 함대를 건설하면 힘을 과시하고 국가 이익을 지킬 수 있습니다. 위대한 아르마다는 해상 주권의 상징입니다."
 BOL_masters_of_the_pacific: "태평양의 지배자"
 BOL_masters_of_the_pacific_desc: "태평양 해역을 장악하면 무역로와 전략적 이점을 확보할 수 있습니다. 볼리비아는 이 지역의 핵심 주체가 되기를 열망해야 합니다."
 BOL_new_millenium: "새천년"
 BOL_new_millenium_desc: "새천년에 들어서면서 개혁과 진보의 기회가 찾아옵니다. 볼리비아는 더 밝은 미래를 건설하기 위해 변화를 받아들여야 합니다."
 BOL_bolivian_reformists: "볼리비아 개혁주의자들"
 BOL_bolivian_reformists_desc: "개혁주의자들은 현대화, 사회 정의, 포용적 통치를 주창합니다. 그들의 비전이 나라가 나아갈 길을 만들어 갑니다."
 BOL_promote_bolivian_unity: "볼리비아 통합 촉진"
 BOL_promote_bolivian_unity_desc: "분열을 극복하려면 국민 통합이 필수적입니다. 포용성을 촉진하면 우리 사회의 결속이 강화됩니다."
 BOL_assure_mestizo_representation: "메스티소 대표성 보장"
 BOL_assure_mestizo_representation_desc: "메스티소 공동체의 정치적 대표성을 보장하면 형평성이 증진됩니다. 이러한 포용은 국민 결속을 뒷받침합니다."
 BOL_media_luna_investments: "메디아 루나 투자"
 BOL_media_luna_investments_desc: "메디아 루나 지역에 대한 투자는 지역 발전을 이끕니다. 균형 잡힌 성장은 볼리비아 전역의 격차를 줄여 줍니다."
 BOL_hold_talks_with_indigenous_ngos: "원주민 NGO와 대화"
 BOL_hold_talks_with_indigenous_ngos_desc: "원주민 NGO와의 교류는 대화와 협력을 촉진합니다. 상호 존중하는 협상은 공동의 목표를 진전시킵니다."
 BOL_protect_indigenous_land: "원주민 토지 보호"
 BOL_protect_indigenous_land_desc: "원주민 영토를 보호하면 문화와 환경이 보존됩니다. 권리를 지키려면 법적 보호 장치를 시행해야 합니다."
 BOL_union_of_reformist_forces: "개혁 세력 연합"
 BOL_union_of_reformist_forces_desc: "개혁 집단들을 한데 모으면 정치적 영향력이 강화됩니다. 단결하면 변화를 더 잘 주창할 수 있습니다."
 BOL_push_for_greater_pluralism: "더 큰 정치적 다원주의 추진"
 BOL_push_for_greater_pluralism_desc: "정치적 다양성을 장려하면 민주주의가 풍요로워집니다. 더 큰 다원주의는 모든 목소리가 경청되도록 합니다."
 BOL_improve_human_rights: "인권 개선"
 BOL_improve_human_rights_desc: "인권을 보호하고 증진하는 것은 정의의 기본입니다. 우리는 인권 침해를 바로잡고 포용적인 제도를 구축해야 합니다."
 BOL_anti_corruption_plan: "반부패 계획"
 BOL_anti_corruption_plan_desc: "부패는 신뢰와 발전을 훼손합니다. 정부의 청렴성을 회복하려면 강력한 계획이 필수적입니다."
 BOL_judicial_independence: "독립적인 사법부"
 BOL_judicial_independence_desc: "정치적 영향력에서 자유로운 사법부는 공정한 정의를 보장합니다. 이러한 독립성을 강화하면 법치가 확립됩니다."
 BOL_pragmatic_economic_approach: "실용적인 경제 접근"
 BOL_pragmatic_economic_approach_desc: "성장과 사회적 필요의 균형을 맞추려면 실용적인 정책이 필요합니다. 유연한 해법은 변화하는 경제 현실에 적응합니다."
 BOL_liberal_market_reforms: "자유주의 시장 개혁"
 BOL_liberal_market_reforms_desc: "시장 자유화는 투자와 혁신을 자극할 수 있습니다. 취약 계층을 보호하기 위해 개혁은 신중하게 관리되어야 합니다."
 BOL_ensure_investment_safety: "투자 안전 보장"
 BOL_ensure_investment_safety_desc: "안전한 환경을 제공하면 국내외 투자가 장려됩니다. 명확한 법률과 그 집행이 핵심입니다."
 BOL_lower_sme_taxation: "소기업 세금 인하"
 BOL_lower_sme_taxation_desc: "중소기업에 대한 세금을 줄이면 기업가 정신이 뒷받침됩니다. 이는 일자리 창출과 경제 다변화를 촉진합니다."
 BOL_telecom_investments: "통신 투자"
 BOL_telecom_investments_desc: "현대적인 통신 기반시설은 사람과 기업을 연결합니다. 투자는 디지털 포용과 경제 성장을 이끕니다."
 BOL_invest_in_the_tertiary_sector: "3차 산업 투자"
 BOL_invest_in_the_tertiary_sector_desc: "서비스업과 관광을 포함한 3차 산업은 경제 다양성에 필수적입니다. 이를 지원하면 고용과 혁신이 촉진됩니다."
 BOL_fight_illegal_coca_production: "불법 코카 재배 단속"
 BOL_fight_illegal_coca_production_desc: "불법 코카 재배는 범죄와 불안정을 부추깁니다. 이를 근절하려면 법 집행의 협조와 지역 사회의 지원이 필요합니다."
 BOL_renewable_investments: "재생 에너지 투자"
 BOL_renewable_investments_desc: "재생 에너지에 투자하면 지속 가능한 성장이 보장됩니다. 이는 화석 연료 의존도를 줄이고 환경을 보호합니다."
 BOL_promote_sustainable_development: "지속 가능한 발전 촉진"
 BOL_promote_sustainable_development_desc: "지속 가능한 발전은 경제 성장과 환경 관리의 균형을 맞춥니다. 볼리비아는 미래 세대를 위해 천연자원을 보호해야 합니다."
 BOL_strengthen_safety_net: "볼리비아 안전망 강화"
 BOL_strengthen_safety_net_desc: "사회 안전망은 어려운 시기에 취약 계층을 보호합니다. 이러한 프로그램을 확대하면 형평성과 안정이 증진됩니다."
 BOL_improve_bolivian_education: "볼리비아 교육 개선"
 BOL_improve_bolivian_education_desc: "양질의 교육은 국가 진보의 토대입니다. 학교와 교사에 대한 투자는 우리 청년들을 미래에 대비시킵니다."
 BOL_modernize_bolivian_hospitals: "볼리비아 병원 현대화"
 BOL_modernize_bolivian_hospitals_desc: "병원 기반시설과 장비를 개선하면 보건 성과가 향상됩니다. 현대적 의료에 대한 접근은 생명을 구하고 회복력을 키웁니다."
 BOL_support_young_families: "젊은 가정 지원"
 BOL_support_young_families_desc: "젊은 가정을 지원하는 정책은 사회의 미래를 강화합니다. 보육, 주거, 교육에 대한 지원이 필수적입니다."
 BOL_housing_programs: "주택 프로그램"
 BOL_housing_programs_desc: "저렴한 주택 계획은 도시와 농촌의 수요를 해결합니다. 모두에게 주거를 보장하면 삶의 질이 높아집니다."
 BOL_bolivia_for_all: "모두를 위한 볼리비아"
 BOL_bolivia_for_all_desc: "포용적인 볼리비아를 만든다는 것은 모두에게 평등한 기회를 의미합니다. 국민 통합과 다양성에 대한 존중이 우리의 목표입니다."
 BOL_bolivias_first_indigenous_president: "볼리비아 최초의 원주민 대통령"
 BOL_bolivias_first_indigenous_president_desc: "최초의 원주민 대통령을 선출한 것은 역사적인 이정표였습니다. 이는 사회 정의와 대표성을 향한 진보를 상징합니다."
 BOL_evonomics: "에보노믹스"
 BOL_evonomics_desc: "에보노믹스는 진화와 경제를 결합하여 적응력 있고 회복력 있는 정책을 만들어 냅니다. 이 접근법은 지속 가능한 발전을 위해 복잡성을 포용합니다."
 BOL_voice_of_the_discriminated: "차별받는 이들의 목소리"
 BOL_voice_of_the_discriminated_desc: "소외된 집단에 목소리를 주면 민주주의가 강화됩니다. 우리는 구조적 차별을 해소하고 모든 시민에게 힘을 실어 주어야 합니다."
 BOL_popular_social_initiatives: "대중적 사회 계획"
 BOL_popular_social_initiatives_desc: "풀뿌리 사회 프로그램은 일상생활을 개선하고 공동체를 육성합니다. 이러한 계획을 지원하면 참여와 연대가 장려됩니다."
 BOL_enact_universal_healthcare: "보편적 의료 시행"
 BOL_enact_universal_healthcare_desc: "보편적 의료는 모두가 의료 서비스를 받을 수 있도록 보장합니다. 이 정책은 공중 보건과 사회적 형평성을 증진합니다."
 BOL_greater_support_to_pensioners: "연금 수급자에 대한 더 큰 지원"
 BOL_greater_support_to_pensioners_desc: "연금 수급자를 지원하는 것은 그들의 존엄과 복지를 지키는 일입니다. 수당 확대는 노인에 대한 우리의 헌신을 보여 줍니다."
 BOL_lgbt_rights: "LGBT 권리 개선"
 BOL_lgbt_rights_desc: "LGBT 권리를 증진하면 평등과 인간의 존엄이 촉진됩니다. 법적 보호와 사회적 수용은 중요한 진전의 단계입니다."
 BOL_denounce_previous_colonialist_regimes: "과거 식민주의 정권 규탄"
 BOL_denounce_previous_colonialist_regimes_desc: "식민주의가 남긴 해악을 인정하는 것은 치유에 필수적입니다. 과거 정권을 규탄하는 것은 볼리비아의 주권과 정체성을 천명하는 일입니다."
 BOL_western_bolivia_investment_projects: "서부 볼리비아 투자 사업"
 BOL_western_bolivia_investment_projects_desc: "서부 볼리비아에 대한 맞춤형 투자는 균형 잡힌 국가 성장을 촉진합니다. 인프라와 서비스는 이 중요한 지역을 끌어올릴 것입니다."
 BOL_improve_rural_water_supply: "농촌 상수도 개선"
 BOL_improve_rural_water_supply_desc: "깨끗한 물에 대한 접근은 기본적인 인권입니다. 농촌 상수도 체계를 확대하면 건강과 생계가 개선됩니다."
 BOL_food_subsidies: "식량 보조금"
 BOL_food_subsidies_desc: "필수 식품에 보조금을 지급하면 모든 시민이 감당할 수 있는 가격이 보장됩니다. 이는 기아를 줄이고 저소득 가정을 지원합니다."
 BOL_improve_literacy_rates: "문해율 향상"
 BOL_improve_literacy_rates_desc: "더 높은 문해율은 기회와 성장의 문을 엽니다. 읽기와 쓰기를 가르치는 프로그램은 지역 사회에 힘을 실어 줍니다."
 BOL_build_new_rural_schools: "새 농촌 학교 건설"
 BOL_build_new_rural_schools_desc: "농촌 지역의 새 학교는 교육 불평등을 해소합니다. 양질의 교육에 대한 접근은 미래 세대를 강하게 합니다."
 BOL_expand_institutional_control: "제도적 통제 확대"
 BOL_expand_institutional_control_desc: "제도를 강화하면 통치와 책임성이 향상됩니다. 효과적인 통제는 법과 질서, 발전을 뒷받침합니다."
 BOL_undermine_the_media_luna: "메디아 루나 약화"
 BOL_undermine_the_media_luna_desc: "메디아 루나 지역의 반대 세력을 약화시키면 국민 통합이 공고해집니다. 전략적 정치 노력은 지역 분열을 줄여 줍니다."
 BOL_nationalize_resources: "볼리비아 천연자원 국유화"
 BOL_nationalize_resources_desc: "천연자원을 국가 통제 아래 두면 볼리비아의 부가 보호됩니다. 국유화는 더 나은 관리와 더 공정한 분배를 가능하게 합니다."
 BOL_withdraw_from_the_imf: "IMF 탈퇴"
 BOL_withdraw_from_the_imf_desc: "IMF에서 탈퇴하면 볼리비아가 경제 주권을 되찾을 수 있습니다. 이는 외부의 제약 없이 독자적인 재정 정책을 추진할 수 있게 합니다."
 BOL_empower_labour_unions: "노동조합 역량 강화"
 BOL_empower_labour_unions_desc: "강력한 노동조합은 노동자의 권리를 보호하고 공정한 임금을 촉진합니다. 노조의 역량을 강화하면 사회 정의와 일터의 민주주의가 강화됩니다."
 BOL_coca_yes_cocaine_no: "코카는 좋다, 코카인은 안 된다"
 BOL_coca_yes_cocaine_no_desc: "우리는 전통적인 코카 재배를 지지하면서 코카인 생산에는 반대합니다. 이 균형 잡힌 접근법은 문화적 관습을 존중하고 마약 밀매와 싸웁니다."
 BOL_modernize_coca_production: "코카 생산 현대화"
 BOL_modernize_coca_production_desc: "코카 재배를 현대화하면 생산성과 지속 가능성이 높아집니다. 개선된 방식은 농민에게 이득이 되면서 불법 작물의 확산을 줄입니다."
 BOL_towards_a_mixed_economy: "혼합 경제를 향하여"
 BOL_towards_a_mixed_economy_desc: "혼합 경제는 공공 부문과 민간 부문을 결합하여 균형 잡힌 성장을 촉진합니다. 이 접근법은 두 체제의 강점을 모두 활용합니다."
 BOL_increase_minimum_wage: "최저임금 인상"
 BOL_increase_minimum_wage_desc: "최저임금을 인상하면 노동자의 생활 수준이 개선됩니다. 이는 빈곤 감소와 경제적 포용을 뒷받침합니다."
 BOL_encourage_consumption: "소비 장려"
 BOL_encourage_consumption_desc: "소비자 수요를 높이면 경제 활동이 자극됩니다. 지출을 장려하면 기업이 성장하고 일자리가 창출됩니다."
 BOL_promote_indigenous_languages: "원주민 언어 장려"
 BOL_promote_indigenous_languages_desc: "원주민 언어를 보존하는 것은 볼리비아의 풍부한 문화유산을 기리는 일입니다. 장려는 자긍심과 사회적 포용을 키웁니다."
 BOL_inclusive_bolivia: "포용적 볼리비아"
 BOL_inclusive_bolivia_desc: "포용적인 볼리비아는 모든 시민의 다양성과 평등한 기회를 소중히 여깁니다. 공동체 간의 가교를 놓으면 국민 통합이 강화됩니다."
 BOL_bolivian_right: "볼리비아 우파"
 BOL_bolivian_right_desc: "볼리비아 우파는 자유 시장, 전통, 제한된 정부를 주창합니다. 그들의 정책은 보수적 가치를 반영합니다."
 BOL_hand_with_the_catholic_church: "가톨릭교회와 손잡다"
 BOL_hand_with_the_catholic_church_desc: "가톨릭교회는 여전히 강력한 사회 제도입니다. 협력은 도덕적 지도와 지역 사회의 지원을 강화합니다."
 BOL_promote_catholic_missionaries: "가톨릭 선교사 장려"
 BOL_promote_catholic_missionaries_desc: "가톨릭 선교사를 장려하면 종교적 활동과 사회 프로그램이 확대됩니다. 이는 영적, 문화적 영향력을 키웁니다."
 BOL_pursue_neoliberal_reforms: "신자유주의 개혁 추진"
 BOL_pursue_neoliberal_reforms_desc: "신자유주의 개혁은 규제 완화, 민영화, 시장 개방에 중점을 둡니다. 이러한 정책은 투자를 유치하고 성장을 촉진하는 것을 목표로 합니다."
 BOL_further_privatization_initiatives: "민영화 추진"
 BOL_further_privatization_initiatives_desc: "민영화를 확대하면 경제에 대한 국가의 관여가 줄어듭니다. 이는 효율과 민간 부문의 발전을 장려합니다."
 BOL_attract_foreign_investment: "외국인 투자 유치"
 BOL_attract_foreign_investment_desc: "외국인 투자는 자본, 기술, 일자리를 가져옵니다. 우호적인 환경을 조성하면 세계의 협력자들을 끌어들일 수 있습니다."
 BOL_cut_back_on_social_spending: "사회 지출 삭감"
 BOL_cut_back_on_social_spending_desc: "사회 지출을 줄이면 정부 비용은 낮아지지만 사회 불안의 위험이 있습니다. 안정을 유지하려면 신중한 균형이 필요합니다."
 BOL_smaller_state: "작은 정부"
 BOL_smaller_state_desc: "작은 정부는 관료제와 정부 개입을 제한합니다. 이는 민간 기업과 개인의 자유를 장려합니다."
 BOL_lower_tax_regime: "낮은 세율 체제"
 BOL_lower_tax_regime_desc: "세금을 낮추면 기업 활동과 경제 성장이 촉진됩니다. 경쟁력 있는 세금 정책은 기업가와 투자자를 끌어들입니다."
 BOL_dominate_the_house: "의회 장악"
 BOL_dominate_the_house_desc: "입법부에서 우위를 확보하면 정책 시행이 보장됩니다. 정치적 통제가 볼리비아의 미래 방향을 결정합니다."
 BOL_crackdown_on_organized_labour: "조직 노동 탄압"
 BOL_crackdown_on_organized_labour_desc: "조직 노동을 탄압하면 파업과 반대 의견이 억눌립니다. 이는 정부의 권위를 강화하지만 사회적 반발의 위험이 있습니다."
 BOL_oppose_satanic_communists: "악마적 공산주의자들에 맞서다"
 BOL_oppose_satanic_communists_desc: "공산주의 이념에 대한 반대는 도덕적, 정치적 싸움으로 규정됩니다. 이 입장은 보수 지지층을 결집시킵니다."
 BOL_liberalize_bolivias_trade_regime: "볼리비아 무역 체제 자유화"
 BOL_liberalize_bolivias_trade_regime_desc: "무역 자유화는 시장을 열고 경쟁력을 높입니다. 장벽을 제거하면 수출입이 장려됩니다."
 BOL_morally_correct_bolivia: "도덕적으로 올바른 볼리비아"
 BOL_morally_correct_bolivia_desc: "도덕적으로 올바른 볼리비아는 전통적 가치와 사회 질서를 지킵니다. 이 비전은 급진적 변화를 거부합니다."
 BOL_strengthen_the_media_luna: "메디아 루나 강화"
 BOL_strengthen_the_media_luna_desc: "메디아 루나의 정치적 영향력을 강화하면 반대 세력에 맞설 수 있습니다. 지역의 힘은 국가의 정치적 목표를 뒷받침합니다."
 BOL_expand_regional_funding: "지역 자금 확대"
 BOL_expand_regional_funding_desc: "지역에 대한 자금을 늘리면 균형 있는 발전이 촉진됩니다. 지역 사업은 공동체 고유의 필요를 해결합니다."
 BOL_strengthen_mestizo_pride: "메스티소 자긍심 강화"
 BOL_strengthen_mestizo_pride_desc: "메스티소의 자긍심을 높이면 정체성과 사회 결속이 길러집니다. 유산을 기리는 일은 이 중요한 인구 집단을 하나로 묶습니다."
 BOL_santa_cruz_infrastructure_projects: "산타크루스 인프라 사업"
 BOL_santa_cruz_infrastructure_projects_desc: "산타크루스의 인프라에 투자하면 경제 성장이 뒷받침됩니다. 개선된 도로, 공공 설비, 서비스는 기업을 끌어들입니다."
 BOL_expand_political_support: "정치적 지지 확대"
 BOL_expand_political_support_desc: "정치적 지지 기반을 넓히면 더 강한 통치가 구축됩니다. 동맹과 대외 활동은 영향력과 안정을 높입니다."
 BOL_bolivias_gems: "볼리비아의 보석들"
 BOL_bolivias_gems_desc: "볼리비아의 자연 및 문화 보물은 소중한 자산입니다. 이를 보호하고 홍보하면 관광과 국민적 자긍심이 높아집니다."
 BOL_renew_the_war_on_drugs: "마약과의 전쟁 재개"
 BOL_renew_the_war_on_drugs_desc: "마약과의 전쟁을 재개하면 밀매 조직망과 불법 재배가 표적이 됩니다. 이 노력은 법과 질서를 회복하는 것을 목표로 합니다."
 BOL_crackdown_on_coca_production: "코카 생산 단속"
 BOL_crackdown_on_coca_production_desc: "코카 재배를 단속하면 마약 공급망이 교란됩니다. 단속은 전통적 용도와 법적 제한 사이의 균형을 맞추고자 합니다."
 BOL_seek_us_technical_assistance: "미국의 기술 지원 요청"
 BOL_seek_us_technical_assistance_desc: "미국의 기술 지원을 요청하면 전문성과 지원을 얻을 수 있습니다. 이러한 협력은 제도적 역량을 강화합니다."
 BOL_expand_anti_cartel_operations: "카르텔 소탕 작전 확대"
 BOL_expand_anti_cartel_operations_desc: "카르텔 소탕 활동을 확대하면 조직 범죄와 마약 밀매가 교란됩니다. 단속 강화는 공공 안전을 높입니다."
 BOL_bring_in_military_support: "군의 지원 요청"
 BOL_bring_in_military_support_desc: "군의 지원은 소요에 맞서는 법 집행을 보강합니다. 필요할 때 군을 배치하면 질서가 회복됩니다."
 BOL_military_junta: "볼리비아군의 개입"
 BOL_military_junta_desc: "볼리비아군이 혼란 속에서 나라를 안정시키기 위해 개입합니다. 군정은 질서와 통제를 회복하는 것을 목표로 합니다."
 BOL_restore_order_in_the_streets: "거리의 질서 회복"
 BOL_restore_order_in_the_streets_desc: "거리의 질서를 회복하면 시민과 재산이 보호됩니다. 조율된 보안 조치는 폭력과 소요를 줄여 줍니다."
 BOL_legacy_of_the_banzerato: "반세라토의 유산"
 BOL_legacy_of_the_banzerato_desc: "반세라토 시대는 권위주의와 현대화라는 복합적인 유산을 남겼습니다. 그 영향은 지금도 볼리비아의 정치 지형을 형성하고 있습니다."
 BOL_crusade_against_the_indians: "인디언에 대한 성전"
 BOL_crusade_against_the_indians_desc: "원주민을 겨냥한 어두운 탄압의 장입니다. 이 운동은 문화적 정체성과 권리를 억누르려 했습니다."
 BOL_ban_indigenous_languages: "원주민 언어 금지"
 BOL_ban_indigenous_languages_desc: "원주민 언어를 금지하면 문화적 다양성과 유산이 훼손됩니다. 이러한 정책은 사회적 분열을 심화시킵니다."
 BOL_support_the_santa_cruz_youth_union: "산타크루스 청년 연합 지원"
 BOL_support_the_santa_cruz_youth_union_desc: "산타크루스 청년 연합을 지원하면 젊은 지도자들에게 힘이 실립니다. 이는 정치적 행동주의와 지역 정체성을 키웁니다."
 BOL_promote_mestizo_superiority: "메스티소 우월성 선전"
 BOL_promote_mestizo_superiority_desc: "메스티소 우월성을 선전하면 민족주의와 배척이 조장됩니다. 이 이념은 사회적 긴장을 만들어 냅니다."
 BOL_bolivian_corporate_state: "볼리비아 조합주의 국가"
 BOL_bolivian_corporate_state_desc: "조합주의 국가는 조합주의적 제도를 통해 사회를 조직합니다. 이 모델은 국가의 지도 아래 경제 집단과 사회 집단을 통제합니다."
 BOL_network_of_patronage: "후원 관계망"
 BOL_network_of_patronage_desc: "후원 관계망은 충성을 대가로 호의와 자원을 나눠 줍니다. 이 체계는 정치와 통치에 영향을 미칩니다."
 BOL_major_economic_projects: "대규모 경제 사업"
 BOL_major_economic_projects_desc: "성장을 촉진하고 외국 자본을 유치하며 경제의 핵심 부문을 현대화하기 위해 대규모 국가 개발 사업을 시작할 것입니다."
 BOL_inject_liquidity_in_the_economy: "경제에 유동성 투입"
 BOL_inject_liquidity_in_the_economy_desc: "유동성을 투입하면 단기적인 경제 활동을 끌어올리고 신용 제약을 완화할 수 있습니다. 이 조치는 경기 침체를 막고 일자리 창출을 뒷받침하는 것을 목표로 합니다."
 BOL_strength_of_the_armed_forces: "볼리비아군의 힘"
 BOL_strength_of_the_armed_forces_desc: "강한 군대는 국방과 내부 안정에 필수적입니다. 우리는 자금을 늘리고 훈련을 확대하며 장비를 현대화할 것입니다."
 BOL_form_bolivian_deathsquads: "볼리비아 암살단 조직"
 BOL_form_bolivian_deathsquads_desc: "내부 위협에 대처하기 위해 정예 암살단이 조직될 것입니다. 이 부대는 위험도가 높은 표적을 제거하기 위해 비밀리에 활동합니다."
 BOL_enforce_mandatory_service: "의무 복무 시행"
 BOL_enforce_mandatory_service_desc: "의무 군 복무는 규율과 국민 통합을 길러 줍니다. 모든 시민이 국방에 기여할 것으로 기대됩니다."
 BOL_strengthen_secret_services: "비밀 정보기관 강화"
 BOL_strengthen_secret_services_desc: "정보 능력을 확대하면 전복 활동과 테러에 신속히 대응할 수 있습니다. 비밀 유지와 효율이 최우선입니다."
 BOL_end_to_the_cartels: "카르텔의 종말"
 BOL_end_to_the_cartels_desc: "군과 경찰의 합동 작전을 통해 마약 카르텔을 근절할 것입니다. 이 작전은 피해 지역에 질서를 되찾아 줄 것입니다."
 BOL_gain_american_support: "미국의 지지 확보"
 BOL_gain_american_support_desc: "미국과 보조를 맞춤으로써 볼리비아는 국제적 입지를 강화할 결정적인 군사, 경제, 정보 지원을 얻을 수 있습니다."
 BOL_pride_of_bolivia: "볼리비아의 자부심"
 BOL_pride_of_bolivia_desc: "우리 국가는 위대함을 향해 떠오르고 있습니다. 국기 아래 결집하여 커져 가는 우리의 힘과 번영을 자랑스러워합시다."
 BOL_restoring_bolivias_lost_glory: "볼리비아의 잃어버린 영광 회복"
 BOL_restoring_bolivias_lost_glory_desc: "우리에게서 빼앗긴 것을 되찾을 때가 왔습니다. 볼리비아는 명예와 존엄, 역사적 영토를 되찾을 것입니다."
 BOL_destroy_brazil: "브라질 격파"
 BOL_destroy_brazil_desc: "우리는 더 이상 브라질의 지배를 용납하지 않을 것입니다. 힘과 결의로 브라질을 무릎 꿇릴 것입니다."
 BOL_avenge_chaco_war: "차코 전쟁의 복수"
 BOL_avenge_chaco_war_desc: "우리는 차코 전쟁의 굴욕을 결코 잊지 않을 것입니다. 파라과이는 우리 국민에게 저지른 죄의 대가를 치를 것입니다."
 BOL_reagain_our_access_to_the_sea: "바다 접근권 회복"
 BOL_reagain_our_access_to_the_sea_desc: "우리는 볼리비아의 정당한 바다 접근권을 되찾아야 합니다. 번영하는 미래는 해양 주권을 요구합니다."
 BOL_expand_military_production: "군수 생산 확대"
 BOL_expand_military_production_desc: "볼리비아는 군에 공급하고 국방의 전략적 자율성을 확보하기 위해 무기 제조를 늘릴 것입니다."
 BOL_expand_military_police: "헌병대 확대"
 BOL_expand_military_police_desc: "내부 안정을 보장하고 공공질서를 유지하기 위해 헌병대의 규모와 권한 범위를 늘릴 것입니다."
 BOL_bolivias_place_in_the_sun_restored: "볼리비아의 햇살 아래 자리 회복"
 BOL_bolivias_place_in_the_sun_restored_desc: "우리 국가는 더 이상 잊힌 존재가 아닙니다. 우리는 지역과 세계 무대에서 주요 행위자로서 마땅한 자리를 차지할 것입니다."
 BOL_light_of_the_wiphala: "위팔라의 빛"
 BOL_light_of_the_wiphala_desc: "위팔라는 단결과 저항을 상징합니다. 위팔라는 자랑스러운 원주민 주도 국가로서 우리의 미래를 인도할 것입니다."
 BOL_indigenismo: "원주민주의"
 BOL_indigenismo_desc: "원주민 정체성이 국가 이념의 초석이 될 것입니다. 원주민의 가치와 지도력을 중심으로 정책을 펼칠 것입니다."
 BOL_revive_indigenous_culture: "원주민 문화 부흥"
 BOL_revive_indigenous_culture_desc: "수 세기에 걸친 말살을 되돌려야 합니다. 문화 부흥 사업에 자금을 대고 원주민 전통을 공적 생활에 뿌리내리게 할 것입니다."
 BOL_defence_of_our_sacred_land: "신성한 땅의 수호"
 BOL_defence_of_our_sacred_land_desc: "우리는 착취와 침략으로부터 우리 땅을 지킬 것입니다. 주권을 위한 투쟁은 신성하며 타협이 있을 수 없습니다."
 BOL_water_wars_legacy: "물 전쟁의 유산"
 BOL_water_wars_legacy_desc: "물 전쟁은 우리에게 저항의 힘을 가르쳐 주었습니다. 이 유산은 경제적, 환경적 정의를 위한 우리의 투쟁에 불을 지필 것입니다."
 BOL_seize_foreign_business: "외국 기업 자산 몰수"
 BOL_seize_foreign_business_desc: "우리 국민을 착취하는 외국 기업을 국유화할 것입니다. 볼리비아의 부는 볼리비아인의 손에 남아 있어야 합니다."
 BOL_form_indigenous_militias: "원주민 민병대 조직"
 BOL_form_indigenous_militias_desc: "원주민 공동체에 뿌리를 둔 민병대가 지역 자치를 수호하고 외세 개입에 맞서 싸울 것입니다."
 BOL_liberation_from_colonialism: "식민주의로부터의 해방"
 BOL_liberation_from_colonialism_desc: "볼리비아는 경제, 문화, 정치를 불문하고 남아 있는 모든 식민 구조로부터 스스로를 해방할 것입니다."
 BOL_communitarian_socialism: "공동체 사회주의"
 BOL_communitarian_socialism_desc: "공동체의 연대, 지방 자치, 전통 지식에 기반한 사회주의 체제를 건설할 것입니다."
 BOL_housing_for_the_poor: "빈곤층을 위한 주택"
 BOL_housing_for_the_poor_desc: "모두가 거처를 누릴 자격이 있습니다. 볼리비아의 가장 취약한 시민들에게 집을 제공하기 위해 대규모 건설 프로그램을 시작할 것입니다."
 BOL_destroy_rich_landowners: "부유한 지주 타파"
 BOL_destroy_rich_landowners_desc: "토지와 권력을 독점하는 봉건적 엘리트를 해체할 것입니다. 재분배는 정의와 평등을 보장할 것입니다."
 BOL_subsidize_coca_production: "코카 생산 보조"
 BOL_subsidize_coca_production_desc: "전통적인 코카 재배는 보호되고 장려될 것입니다. 정부 보조금이 합법적이고 문화적인 사용을 뒷받침할 것입니다."
 BOL_state_controlled_unions: "국가 통제 노동조합"
 BOL_state_controlled_unions_desc: "반대 의견과 무질서를 막기 위해 노동조합은 국가의 지도와 감독 아래 놓일 것입니다."
 BOL_reforestation_initiatives: "조림 계획"
 BOL_reforestation_initiatives_desc: "삼림 파괴를 되돌리기 위해 나무를 심고 생태계를 복원할 것입니다. 녹색 정책이 우리의 환경을 지킬 것입니다."
 BOL_raise_living_standards: "생활 수준 향상"
 BOL_raise_living_standards_desc: "복지와 고용을 확대하여 수백만 명을 빈곤에서 구하고 모든 볼리비아인의 일상을 개선할 것입니다."
 BOL_enact_price_controls: "가격 통제 시행"
 BOL_enact_price_controls_desc: "소비자를 보호하기 위해 정부는 필수 물품과 서비스의 가격을 고정할 것입니다. 착취는 용납되지 않을 것입니다."
 BOL_five_year_plan: "5개년 계획"
 BOL_five_year_plan_desc: "우리의 5개년 계획이 볼리비아의 경제 변혁을 이끌 것입니다. 중앙 계획이 우리를 번영으로 인도할 것입니다."
 BOL_modernize_mining: "광업 현대화"
 BOL_modernize_mining_desc: "광업은 신기술과 더 나은 안전 대책으로 개선될 것입니다. 이 부문은 국가 발전의 근간이 될 것입니다."
 BOL_ban_pro_imperialist_force: "친제국주의 세력 금지"
 BOL_ban_pro_imperialist_force_desc: "외국 제국주의 열강에 동조하는 집단을 불법화할 것입니다. 국민 통합은 어떤 대가를 치르더라도 지켜져야 합니다."
 BOL_state_of_the_proletariat: "프롤레타리아 국가"
 BOL_state_of_the_proletariat_desc: "볼리비아는 노동자에 의한, 노동자를 위한 국가가 될 것입니다. 노동이 이끌 것이며 착취는 끝날 것입니다."
 BOL_anti_colonialist_struggle: "반식민주의 투쟁"
 BOL_anti_colonialist_struggle_desc: "우리는 우리 지역의 모든 형태의 식민 지배에 맞서 정치적, 경제적, 문화적 전쟁을 선포합니다."
 BOL_liberate_perus_oppressed: "페루의 억압받는 이들 해방"
 BOL_liberate_perus_oppressed_desc: "페루의 원주민과 노동자들과 연대하여 필요한 모든 수단으로 그들의 해방을 지원할 것입니다."
 BOL_liberate_chilean_natives: "칠레 원주민 해방"
 BOL_liberate_chilean_natives_desc: "칠레 원주민의 투쟁은 곧 우리의 투쟁입니다. 볼리비아는 그들이 억압에서 벗어나도록 도울 것입니다."
 BOL_liberate_the_amazonian_tribes: "아마존 부족 해방"
 BOL_liberate_the_amazonian_tribes_desc: "아마존 부족들은 멸종의 위기에 처해 있습니다. 그들의 땅과 권리, 문화를 지키기 위해 단호히 행동할 것입니다."
 BOL_our_oppression_avenged: "우리의 억압에 복수하라!"
 BOL_our_oppression_avenged_desc: "수 세기에 걸친 불의는 벌을 받지 않고 넘어가지 않을 것입니다. 우리의 혁명은 억압받는 이들에게는 정의를, 억압하는 자들에게는 공포를 가져다줄 것입니다."
 BOL_foreign_policy: "볼리비아 외교 정책"
 BOL_foreign_policy_desc: "볼리비아는 세계 무대에서 자신의 자리를 확보해야 합니다. 우리의 외교 정책은 국력과 이념적 명료성을 반영할 것입니다."
 BOL_paraguayan_relations: "파라과이와의 관계 개선"
 BOL_paraguayan_relations_desc: "파라과이와의 외교 관계를 강화하면 지역 안정을 도모하고 무역과 군사 협력의 새로운 길을 열 수 있습니다. 공유하는 역사와 국경을 고려할 때, 더 강력한 볼리비아-파라과이 동맹은 앞으로 몇 년간 필수적일 수 있습니다."
 BOL_brazil_pipeline: "브라질 송유관 협상"
 BOL_brazil_pipeline_desc: "브라질의 에너지 수요는 계속 증가하고 있으며, 볼리비아는 가치 있는 협상 카드를 쥐고 있습니다. 송유관 사업을 협상함으로써 장기적인 수입을 확보하고, 인프라를 개선하며, 에너지 수출을 통해 지역 내 영향력을 높일 수 있습니다."
 BOL_expanding_trade_relations: "브라질과의 무역 관계 확대"
 BOL_expanding_trade_relations_desc: "에너지 협정이 기반을 마련했으니, 이제 브라질과의 무역 유대를 심화할 때입니다. 상업 협력이 강화되면 산업 성장, 기술 교류, 더욱 굳건한 외교적 연대로 이어질 수 있습니다."
 BOL_convene_a_constitutional_assembly: "제헌의회 소집"
 BOL_convene_a_constitutional_assembly_desc: "분열된 국가를 치유하고 안정적인 토대를 확립하려면 볼리비아 전체를 대표하는 새로운 제헌의회를 소집해야 합니다."
 BOL_nature_of_the_state: "국가의 성격"
 BOL_nature_of_the_state_desc: "우리 국가의 성격은 어떠해야 할까요? 중앙집권제인가 연방제인가, 다민족 국가인가 단일 국가인가? 새 헌법에서 이를 규정해야 합니다."
 BOL_question_of_the_capital: "수도 문제"
 BOL_question_of_the_capital_desc: "라파스인가 수크레인가? 정부 소재지를 둘러싼 논쟁은 상징적이면서도 실질적입니다. 분명한 답을 법에 명시해야 합니다."
 BOL_question_of_judges: "판사 문제"
 BOL_question_of_judges_desc: "판사는 선출되어야 할까요, 임명되어야 할까요? 사법부의 독립과 대중의 신뢰가 달려 있습니다."
 BOL_question_of_our_right_to_the_sea: "바다에 대한 우리의 권리 문제"
 BOL_question_of_our_right_to_the_sea_desc: "우리 헌법은 정체성과 미래의 외교를 위해 태평양 접근에 대한 역사적 권리를 재확인해야 합니다."
 BOL_settling_the_ethnic_divide: "민족 분열 해소"
 BOL_settling_the_ethnic_divide_desc: "볼리비아의 민족 집단들은 불평등과 투쟁의 오랜 역사를 갖고 있습니다. 새 헌법은 이 국가적 상처를 치유하기 위해 노력해야 합니다."
 BOL_focus_on_integration: "통합 중시"
 BOL_focus_on_integration_desc: "우리는 모든 볼리비아인을 단일한 국가 정체성으로 통합하는 데 집중하여, 특별 대우나 분열보다 통합을 우선시해야 합니다."
 BOL_focus_on_justice: "정의 중시"
 BOL_focus_on_justice_desc: "정의는 새 질서의 기둥이 되어야 합니다. 역사적 잘못은 인정되어야 하며, 권리는 모든 공동체로 확대되어야 합니다."
 BOL_reconciliation_focus: "화해 중시"
 BOL_reconciliation_focus_desc: "정의와 통합 사이에는 화해가 있습니다. 우리는 분열을 메우고 공화국을 위한 새로운 협력의 길을 열고자 합니다."
 BOL_autonomy_for_the_media_luna: "메디아 루나 자치"
 BOL_autonomy_for_the_media_luna_desc: "동부 주들은 오랫동안 자치를 요구해 왔습니다. 이를 인정하면 긴장이 완화되고 통치가 개선될 수 있습니다."
 BOL_spanish_as_the_sole_language: "스페인어 단일 공용어"
 BOL_spanish_as_the_sole_language_desc: "스페인어를 유일한 공용어로 선언하면 통치가 단순해질 수 있지만, 원주민의 목소리를 소외시킬 위험이 있습니다."
 BOL_commission_on_past_abuses: "과거사 위원회"
 BOL_commission_on_past_abuses_desc: "과거의 국가 폭력, 정치적 탄압, 불의를 조사하기 위한 진실 정의 위원회를 구성할 것입니다."
 BOL_promote_ethnic_unity: "민족 통합 촉진"
 BOL_promote_ethnic_unity_desc: "우리의 목표는 모든 민족을 끌어올리는 공동의 볼리비아 정체성입니다. 학교, 언론, 정책이 이 이상을 반영해야 합니다."
 BOL_autonomy_for_indigenous_communities: "원주민 공동체 자치"
 BOL_autonomy_for_indigenous_communities_desc: "원주민 공동체는 자치와 문화 보존의 권리를 법으로 보장받아야 합니다."
 BOL_make_indigenous_languages_national: "원주민 언어를 국어로"
 BOL_make_indigenous_languages_national_desc: "케추아어, 아이마라어 및 기타 원주민 언어에 스페인어와 함께 국어의 지위가 부여될 것입니다."
 BOL_new_constitution: "새 헌법"
 BOL_new_constitution_desc: "토론과 타협, 비전으로 이어진 긴 과정이 끝났습니다. 볼리비아는 이제 미래를 위해 만들어진 새 헌법을 갖게 되었습니다."
 BOL_atacama_border_dispute: "아타카마 국경 분쟁"
 BOL_atacama_border_dispute_desc: "아타카마 사막을 둘러싼 칠레와의 오랜 영토 분쟁은 지금도 우리의 국가 정체성을 형성하고 있습니다. 앞으로 나아갈 길을 재검토할 때입니다."
 BOL_promote_a_diplomatic_solution: "외교적 해결 촉진"
 BOL_promote_a_diplomatic_solution_desc: "대립 대신 칠레와의 대화를 모색할 것입니다. 평화적 해결은 장기적인 이익을 가져오고 무역로를 열 수 있습니다."
 BOL_finding_a_mediator: "중재자 물색"
 BOL_finding_a_mediator_desc: "칠레와의 협상을 원활히 하기 위해 중립적인 국제 행위자들을 아타카마 분쟁의 중재자로 참여시킬 것입니다."
 BOL_drop_our_claim_on_atacama: "아타카마 영유권 주장 포기"
 BOL_drop_our_claim_on_atacama_desc: "역사적 영유권 주장을 내려놓으면 자존심은 상하더라도 칠레와의 관계가 정상화되고 지역에서 새로운 기회가 열릴 수 있습니다."
 BOL_new_era_in_chilean_relations: "칠레 관계의 새 시대"
 BOL_new_era_in_chilean_relations_desc: "긴장이 지나간 지금, 우리는 칠레와 남아메리카에서 무역, 발전, 외교 분야에서 협력할 수 있습니다."
 BOL_promote_common_cultural_heritage: "공동 문화유산 촉진"
 BOL_promote_common_cultural_heritage_desc: "과거의 갈등에도 불구하고 우리 국민은 공통된 문화적 뿌리를 공유합니다. 유산을 통한 통합의 촉진은 더 강력한 동반자 관계의 길을 닦을 수 있습니다."
 BOL_chilean_free_trade_agreement: "칠레 자유 무역 협정"
 BOL_chilean_free_trade_agreement_desc: "칠레와의 경제 통합은 양국 모두에 이익이 될 것입니다. 관세 인하와 인프라 공유는 서로에게 이득입니다."
 BOL_our_window_to_the_pacific: "태평양으로 향하는 우리의 창"
 BOL_our_window_to_the_pacific_desc: "우리는 외교를 통해 태평양으로 향하는 새로운 창을 확보했습니다. 해안 너머에 무역, 안보, 번영이 기다리고 있습니다."
 BOL_reach_out_to_the_americans: "미국에 접근"
 BOL_reach_out_to_the_americans_desc: "미국의 지지를 얻으면 균형이 우리에게 유리하게 기울 수 있습니다. 우리의 입장이 정당하며 지지받을 가치가 있음을 제시해야 합니다."
 BOL_reach_out_to_mercosur: "메르코수르에 접근"
 BOL_reach_out_to_mercosur_desc: "남아메리카의 경제 블록은 귀중한 정치적, 외교적 지렛대를 제공할 수 있습니다. 손을 내밀 때입니다."
 BOL_reach_out_to_the_sco: "SCO에 접근"
 BOL_reach_out_to_the_sco_desc: "상하이 협력 기구는 지지와 국제적 인정을 얻을 대안적인 길을 제공할 수 있습니다."
 BOL_revive_the_pinochet_proposal: "피노체트 제안 부활"
 BOL_revive_the_pinochet_proposal_desc: "칠레는 한때 우리의 분쟁을 해결하기 위해 영토 교환을 고려한 적이 있습니다. 그 제안을 되살리면 협상이 다시 불붙을 수 있습니다."
 BOL_insist_our_claim: "영유권 주장 고수"
 BOL_insist_our_claim_desc: "외교적 방식이든 아니든, 우리는 해안에 대한 정당한 영유권 주장을 포기하지 않을 것입니다. 그것은 우리의 역사적 운명입니다."
 BOL_presenting_our_case_to_the_hague: "헤이그에 사안 제소"
 BOL_presenting_our_case_to_the_hague_desc: "아타카마 문제에서 정의를 요구하기 위해 국제 재판소에 우리의 법적 논거를 제출할 것입니다."
 BOL_dream_lost: "잃어버린 꿈"
 BOL_dream_lost_desc: "세계는 우리에게 정의를 허락하지 않았습니다. 바다로 돌아가겠다는 꿈은 희미해지지만 우리의 정신은 남아 있습니다."
 BOL_dream_achieved: "이루어진 꿈"
 BOL_dream_achieved_desc: "우리는 태평양에서의 자리를 되찾았습니다. 역사는 이날을 볼리비아 해안 영광의 귀환으로 기억할 것입니다."
 BOL_abandon_diplomatic_solutions: "외교적 해결 포기"
 BOL_abandon_diplomatic_solutions_desc: "외교는 거듭 우리를 실망시켰습니다. 더 강하고 대담한 조치를 추구할 때입니다."
 BOL_ramp_up_military_readiness: "군 대비 태세 강화"
 BOL_ramp_up_military_readiness_desc: "우리는 모든 가능성에 대비해 군을 준비시켜야 합니다. 해안으로 가는 길은 불로 포장될지도 모릅니다."
 BOL_gather_border_intelligence: "국경 정보 수집"
 BOL_gather_border_intelligence_desc: "어떠한 대치에 앞서 칠레의 국경 방어와 군사 능력을 평가해야 합니다."
 BOL_enact_border_fortifications: "국경 요새화 시행"
 BOL_enact_border_fortifications_desc: "내륙을 보호하고 집결지를 확보하기 위해 우리의 방어 진지를 강화할 것입니다."
 BOL_remembering_the_alliance_of_1879: "1879년 동맹을 기억하며"
 BOL_remembering_the_alliance_of_1879_desc: "페루는 한때 우리와 함께했습니다. 옛 동맹을 되살리는 것은 칠레의 침략 앞에서 다시 우리에게 도움이 될 수 있습니다."
 BOL_strike_alone: "단독 타격"
 BOL_strike_alone_desc: "아무도 우리의 꿈을 위해 싸워 주지 않을 것이므로, 우리 스스로 싸워야 합니다. 어떤 대가를 치르더라도 해안은 우리의 것이 될 것입니다."
 BOL_revenge_for_the_war_of_the_pacific: "태평양 전쟁의 복수"
 BOL_revenge_for_the_war_of_the_pacific_desc: "이것은 정치 이상의 것입니다. 이것은 정의입니다. 우리가 해안을 잃은 일에 마침내 복수할 것입니다."
 BOL_reach_out_to_argentina: "아르헨티나에 접근"
 BOL_reach_out_to_argentina_desc: "아르헨티나는 지역에서 상당한 영향력을 갖고 있습니다. 외교적으로 손을 내밀면 경제적 이익과 전략적 협력을 얻을 수 있고, 더 넓은 동맹의 토대까지 마련할 수 있을 것입니다."
 BOL_western_relations: "서방과의 관계"
 BOL_western_relations_desc: "볼리비아는 협력과 국가 주권의 균형을 맞추며 서방 열강과 외교적으로 교류할 것입니다."
 BOL_our_former_rulers: "우리의 옛 지배자들"
 BOL_our_former_rulers_desc: "스페인은 한때 우리를 지배했습니다. 이제 우리는 동등한 존재로, 혹은 그들을 능가하는 존재로 설 것입니다. 굴종의 시대는 끝났습니다."
 BOL_our_american_partners: "우리의 미국 파트너"
 BOL_our_american_partners_desc: "미국은 상호 존중이 유지된다면 안보, 무역, 현대화 분야에서 귀중한 파트너가 될 수 있습니다."
 BOL_natos_arm_in_latin_america: "라틴 아메리카의 나토의 팔"
 BOL_natos_arm_in_latin_america_desc: "볼리비아는 나토의 남쪽 기둥으로서 이 지역에 힘과 민주적 가치를 투사할 것입니다."
 BOL_eu_trade_agreements: "유럽과의 무역 협정"
 BOL_eu_trade_agreements_desc: "EU와 더 긴밀한 관계를 맺으면 볼리비아의 수출 시장, 외국인 투자, 외교적 위상이 개선될 것입니다."
 BOL_oppose_chavismo_and_castroism: "차베스주의와 카스트로주의 반대"
 BOL_oppose_chavismo_and_castroism_desc: "우리는 카라카스와 아바나의 권위주의적 사회주의를 거부합니다. 볼리비아는 다른 길을 걸을 것입니다."
 BOL_american_military_expertise: "미국의 군사 전문성"
 BOL_american_military_expertise_desc: "미군은 훈련과 현대화를 제공합니다. 볼리비아는 자율성을 유지하면서 그들의 경험에서 이익을 얻을 것입니다."
 BOL_cias_door_in_latin_america: "라틴 아메리카에서 CIA의 문"
 BOL_cias_door_in_latin_america_desc: "CIA와의 정보 협력으로 볼리비아는 최첨단 역량과 보호를 얻게 될 것입니다."
 BOL_american_free_trade_deal: "볼리비아-미국 자유 무역 협정"
 BOL_american_free_trade_deal_desc: "미국과의 무역 협정은 우리 경제를 투자와 성장에 개방합니다. 우리는 서반구의 핵심 파트너가 될 것입니다."
 BOL_eastern_relations: "동방과의 관계"
 BOL_eastern_relations_desc: "세계적 영향력의 균형을 맞추고 새로운 동맹을 확보하기 위해 동방 열강과 전략적 동반자 관계를 구축할 것입니다."
 BOL_trip_to_beijing: "베이징 방문"
 BOL_trip_to_beijing_desc: "중국 방문은 외교 정책의 중대한 전환을 알립니다. 우리는 동방으로부터 투자, 지원, 동반자 관계를 모색할 것입니다."
 BOL_improve_relations_with_moscow: "모스크바와의 관계 개선"
 BOL_improve_relations_with_moscow_desc: "러시아와의 관계 개선은 볼리비아의 국방, 경제, 외교적 영향력에 이익이 될 것입니다."
 BOL_apply_to_join_the_sco: "SCO 가입"
 BOL_apply_to_join_the_sco_desc: "상하이 협력 기구에 가입함으로써 볼리비아는 서방의 지배에 맞서는 부상하는 세계 블록의 일원이 될 것입니다."
 BOL_russian_trade_agreement: "러시아와의 무역 협정"
 BOL_russian_trade_agreement_desc: "러시아와의 새로운 무역 협정은 우리의 에너지 부문을 강화하고 수출 시장을 다변화할 것입니다."
 BOL_foster_trade_ties_with_iran: "이란과의 무역 관계 증진"
 BOL_foster_trade_ties_with_iran_desc: "이란과 볼리비아는 무역, 산업, 외교 분야에서 협력할 수 있습니다. 제국주의에 대한 공동의 저항이 자연스러운 유대를 만들어 줍니다."
 BOL_open_doors_to_cuba_and_venezuela: "쿠바와 베네수엘라에 문호 개방"
 BOL_open_doors_to_cuba_and_venezuela_desc: "우리는 쿠바와 베네수엘라와의 관계를 받아들이고 그들의 투쟁을 지원하여 라틴 아메리카에 반제국주의 축을 구축할 것입니다."
 BOL_oppose_american_influence: "미국의 영향력에 맞서기"
 BOL_oppose_american_influence_desc: "미국의 간섭은 수십 년간 라틴 아메리카에 해를 끼쳐 왔습니다. 볼리비아는 워싱턴의 지배에 맞선 저항을 이끌 것입니다."
 BOL_chinese_investment_boom: "중국 투자 붐"
 BOL_chinese_investment_boom_desc: "중국의 자본과 기반시설 사업이 볼리비아 경제를 탈바꿈시키고 세계적 경쟁력을 높일 것입니다."
 BOL_expand_mercosur_types: "메르코수르 관계 확대"
 BOL_expand_mercosur_types_desc: "무역과 지역 협력을 촉진하기 위해 볼리비아의 메르코수르 참여를 강화할 것입니다."
 BOL_trade_ties_with_india: "인도와의 무역 관계 확대"
 BOL_trade_ties_with_india_desc: "인도는 방대한 경제적 기회를 제공합니다. 무역 관계를 강화하면 양국 모두에 이익이 될 것입니다."
 BOL_affirm_bolivian_neutrality: "볼리비아의 중립 천명"
 BOL_affirm_bolivian_neutrality_desc: "볼리비아는 세계적 분쟁에서 중립을 유지하며 외교, 평화, 다자주의에 집중할 것입니다."
 BOL_un_peacekeeping_assistance: "UN 평화유지 지원"
 BOL_un_peacekeeping_assistance_desc: "UN 평화유지 임무에 기여하여 책임 있는 국제 행위자로서의 역할을 강화할 것입니다."
 BOL_focus_on_national_defence: "국방에 집중"
 BOL_focus_on_national_defence_desc: "안전한 조국은 필수적입니다. 모든 군종에 걸쳐 국방 지출과 현대화를 우선시할 것입니다."
 BOL_reach_out_to_developing_nations: "개발도상국에 손을 내밀기"
 BOL_reach_out_to_developing_nations_desc: "볼리비아는 남남 협력과 상호 지원을 촉진하며 개발도상국의 지도국으로 활동할 것입니다."
 BOL_global_mediator: "세계의 중재자"
 BOL_global_mediator_desc: "볼리비아를 국제 분쟁과 갈등에서 중립적이고 신뢰할 수 있는 중재자로 자리매김하게 할 것입니다."
 BOL_switzerland_of_the_andes: "안데스의 스위스"
 BOL_switzerland_of_the_andes_desc: "우리는 안정적이고 중립적이며 번영하는 나라, 모두가 존경하는 안데스의 스위스가 되는 것을 목표로 합니다."
 BOL_legacy_of_the_confederation: "연방의 유산"
 BOL_legacy_of_the_confederation_desc: "우리는 페루-볼리비아 연방의 단결 정신을 기립니다. 그 유산은 앞으로의 통합을 위한 길잡이별로 남아 있습니다."
 BOL_strengthen_peruvian_bolivian_economic_ties: "경제 관계 강화"
 BOL_strengthen_peruvian_bolivian_economic_ties_desc: "페루와의 경제 협력은 공동의 번영을 가져오고 지역 유대를 강화할 것입니다."
 BOL_joint_military_exercises: "합동 군사 훈련"
 BOL_joint_military_exercises_desc: "이웃 국가들과의 합동 훈련은 협조 체계를 강화하고 상호 안보를 높입니다."
 BOL_our_brazilian_neighbours: "이웃 나라 브라질"
 BOL_our_brazilian_neighbours_desc: "브라질과의 관계는 복잡합니다. 가능한 경우 경쟁과 실용적인 협력 사이에서 균형을 맞출 것입니다."
 BOL_our_claims_south: "남쪽에 대한 우리의 영유권"
 BOL_our_claims_south_desc: "해안에 대한 접근권을 잃은 이후, 우리는 자국 물자를 확보하는 데에만도 막대한 관료적 절차를 거쳐야 했습니다. 이 문제에 대한 우리의 입장을 재평가할 때가 되었습니다."
 BOL_the_chilean_devil: "칠레라는 악마"
 BOL_the_chilean_devil_desc: "칠레 국가는 위장한 악마입니다. 그들은 지역에 불안정과 혼란만을 가져오며, 우리는 국민과 전 세계에 그들의 진짜 의도를 알려야 합니다."
 BOL_revenge_of_1879: "1879년의 복수"
 BOL_revenge_of_1879_desc: "1879년의 전쟁은 우리에게 국가적 굴욕과 해안의 상실을 안겨 주었습니다. 이제 이 상실을 바로잡을 때입니다."
 BOL_dropping_our_claims: "영유권 주장 포기"
 BOL_dropping_our_claims_desc: "전쟁과 영토 회복주의는 나아갈 길이 아닙니다. 외교와 협력을 통해서만 더 강한 볼리비아를 만들 수 있습니다."
 BOL_chilean_gas_exports: "칠레 가스 수출"
 BOL_chilean_gas_exports_desc: "가스를 매개로 칠레와 전략적 경제 협약을 맺으면 유혈 사태 없이 해안에 접근할 수 있을 것입니다."
 BOL_a_new_day_in_the_americas: "아메리카 대륙의 새로운 날"
 BOL_a_new_day_in_the_americas_desc: "우리는 칼 대신 펜으로도 해법을 이끌어 낼 수 있음을 증명했습니다. 이제 이 지역은 분쟁을 해결하는 모범으로 우리의 행보를 바라볼 것입니다."
 BOL_inclusive_bolivia_idea: "포용적 볼리비아"
 BOL_oil_reserve_decisions: "석유 매장지 결정"
 BOL_oil_reserve_decisions_desc: "최근의 법률 변화나 신기술 개발 덕분에 우리나라 안에 아직 남아 있는 여러 매장지에서 추가 석유를 발견하고 채굴할 수 있게 되었습니다."
 BOL_chilean_port_access: "칠레 항구 접근권"
 BOL_gas_export_to_chile: "칠레에 가스 수출"
 BOL_gas_export_to_chile_desc: "에너지 외교는 계속됩니다. 칠레에 가스를 공급하면 상호 의존이 강화되고 국가 예산에 이익이 됩니다."
 BOL_explore_oil_reserves_in_santa_cruz: "산타크루스 석유 매장지 탐사"
 BOL_explore_oil_reserves_in_santa_cruz_desc: ""
 BOL_explore_oil_reserves_in_pando_el_beni: "판도·엘베니 석유 매장지 탐사"
 BOL_explore_oil_reserves_in_pando_el_beni_desc: ""
 BOL_fortified_preparations: "방어 태세 구축"
 BOL_fortified_preparations_desc: "남쪽의 위협과 충돌하게 될 경우에 대비하여 국경을 견고하게 요새화해야 합니다."
 BOL_chilean_devil: "칠레의 악마"