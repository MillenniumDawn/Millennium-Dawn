 UKR_storage_item_t55_tt: "§YТ-54/Т-55§!\n\n\n£SOV_LAND_T_55A\n\n\n\nНа хранении: §Y[?ukraine_has_t55_stockpile|0]§!\nПоколение: основной боевой танк первого поколения, на вооружении с 1947 года.\nТип техники: §YКорпус танка 1-го поколения§!\n\nСемейство вариантов:\n• Т-54\n• Т-55А\n• Т-55АМ\n• Т-55АМВ\n\nСамые старые танки нашего резерва. §YХКБМ§! может переделать их корпуса в современные танки и тяжёлые БМП для нашей армии или на экспорт."
