 CPD_has_war_contribution_TT: "A une §Ycontribution de guerre§! contre [THIS.GetName] : §Y1+ bataille gagnée§! (actuellement §Y[?ROOT.CPD_VP@THIS|.0]§!) ou §Y3+ mois en guerre§! (actuellement §Y[?ROOT.months_at_war|.1]§!)"
 CPD_STATE_ACTIONS_HEADER: "§Y --- Mesures prises par l'État --- §!"
 CPD_COUNTRY_ACTIONS_HEADER: "§Y--- Actions du pays ---§!"
 CPD_ANNEX_BTN: "Annexer l'État"
 CPD_PUPPET_BTN: "État Fantoche"
 CPD_DEMILITARISE_BTN: "Démilitariser"
 CPD_LIBERATE_BTN: "Libérer"
 CPD_RESOURCE_RIGHTS_BTN: "Droits sur les ressources"
 CPD_CEASEFIRE_BTN: "Cessez-le-feu"
 CPD_WAR_REPS_BTN: "Réparations de guerre"
 CPD_NEUTRALITY_BTN: "Neutralité"
 CPD_REGIME_CHANGE_BTN: "Changement de régime"
 CPD_MIL_BASING_BTN: "Sationnement militaire"
 CPD_FULL_PUPPET_BTN: "Fantoche complet"
 CPD_resource_rights_button_TT: "§Y Droits sur les ressources §!"
 CPD_resource_rights_button_TT_DELAYED: "La sécurisation des §Y droits d'extraction des ressources §! permet de réorienter vers nous la production des États sélectionnés. Les États eux-mêmes restent sous l'autorité de leur propriétaire actuel ; seules les quantités de pétrole, d'acier, d'aluminium, de caoutchouc, de tungstène et de chrome qu'ils produisent sont acheminées vers notre économie. Cet accord reste en vigueur jusqu'à ce qu'il soit annulé par un autre accord de paix."
 CPD_military_basing_button_TT: "§Y Stationnement militaire §!"
 CPD_military_basing_button_TT_DELAYED: "§Y Droits de stationnement militaire §! garantissent à nos forces armées le libre passage sur le territoire de ce pays. Nos troupes peuvent se déplacer et se stationner librement jusqu’à ce que ce droit leur soit retiré."
 CPD_full_puppet_button_TT: "§Y Fantoche complet §!"
 CPD_full_puppet_button_TT_DELAYED: "Exiger le statut de §Y Fantoche complet §! revient à faire de cette nation tout entière notre vassal. Elle conserve ses frontières et sa population, mais perd son indépendance en matière de politique étrangère ; son économie, ses ressources humaines et son armée relèvent de notre autorité. Toutes les exigences relatives à la mise sous tutelle d’un État déjà prévues dans cet accord sont incluses."
 CPD_ceasefire_button_TT: "§Y Cessez-le-feu §!"
 CPD_ceasefire_button_TT_DELAYED: "Un §Y Cessez-le-feu §! met fin à la guerre en conservant la ligne de front telle qu’elle est actuellement. Chaque camp conserve les États qu’il contrôle actuellement, quel que soit le camp qui les détenait auparavant. La trêve reste en vigueur pendant §Y 720 jours §! avant que l’un ou l’autre camp ne puisse à nouveau déclarer la guerre à l’autre.\n\nUn cessez-le-feu et des revendications territoriales ne peuvent pas faire partie d’un même accord. L’activation d’un cessez-le-feu efface toutes les entrées au niveau des États de la proposition en cours."
 CPD_war_reparations_button_TT: "§Y Réparations de guerre §!"
 CPD_war_reparations_button_TT_DELAYED: "§Y Les réparations de guerre §! obligent le perdant à verser chaque semaine, pendant un an, une partie de son PIB. Ce transfert apparaît comme une nouvelle dépense dans le budget du payeur et comme une nouvelle recette dans celui du bénéficiaire.\n\n [CPD_reparations_preview]"
 CPD_reparations_preview_TT: "Transfert projeté pour cet accord : §Y£[?CPD_rep_preview_temp|.2]B par semaine§! (~§Y£[?CPD_rep_preview_total_temp|.0]B§! sur l'année)"
 CPD_forced_neutrality_button_TT: "§YNeutralité forcée§!"
 CPD_forced_neutrality_button_TT_DELAYED: "La §Yneutralité forcée§! retire cette nation de sa faction à la signature et lui interdit d'en rejoindre ou d'en former une autre pendant §Ycinq ans§!."
 CPD_regime_change_button_TT: "§YChangement de régime§!"
 CPD_regime_change_button_TT_DELAYED: "Le §Ychangement de régime§! remplace le parti au pouvoir de la cible par celui actuellement au pouvoir chez nous. Leur coalition est dissoute et un dirigeant de notre bord politique est installé. Le nouveau gouvernement subit une §Yinstabilité d'après-guerre§! pendant deux ans, et les nations islamiques peuvent connaître un §Ycontrecoup salafiste§! contre un pouvoir imposé de l'extérieur."
 additional_income_war_reparations_tt: "$$[?CPD_reparations_weekly|+3] provenant des §YRéparations de guerre§!\n"
 additional_expense_war_reparations_tt: "$$[?CPD_reparations_weekly|-3] provenant des §YRéparations de guerre§!\n"
 CPD_war_reparations_payer: "Réparations de guerre (payantes)"
 CPD_war_reparations_payer_desc: "Nous versons des réparations de guerre à la suite d'un traité de paix. Un transfert d'argent hebdomadaire apparaît comme une dépense supplémentaire au budget pendant §Y1 an§!."
 CPD_war_reparations_receiver: "Réparations de guerre (bénéficiaire)"
 CPD_war_reparations_receiver_desc: "Nous recevons des réparations de guerre à la suite d'un traité de paix. Un transfert d'argent hebdomadaire apparaît comme un revenu supplémentaire au budget pendant §Y1 an§!."
 CPD_forced_neutrality_spirit: "Neutralité forcée"
 CPD_forced_neutrality_spirit_desc: "Comme condition du traité de paix, notre nation a interdiction de rejoindre ou de créer des alliances militaires."
 CPD_regime_change_instability: "Instabilité politique d'après-guerre"
 CPD_regime_change_instability_desc: "Un changement de régime forcé a déstabilisé notre système politique."
 CPD_liberate_in_state_button_TT: "[CPD_LIBERATE_TT_LOC]"
 CPD_liberate_in_state_button_TT_DELAYED: "[CPD_LIBERATE_TT_DELAYED_LOC]"
 CPD_liberate_in_state_button_TT_DEMAND: "Libérer les États"
 CPD_liberate_in_state_button_TT_CONCESSION: "Accorder l’indépendance"
 CPD_liberate_in_state_button_TT_DELAYED_DEMAND: "Exiger la §Ylibération§! restitue les États sélectionnés à la nation qui les revendique légitimement. Un détenteur de cœurs encore existant reçoit le territoire directement ; un État disparu est ressuscité pour le recevoir. S'il ne reste aucun détenteur de cœurs, un nouvel État scissionnaire est forgé à partir de ce qui reste du propriétaire actuel."
 CPD_liberate_in_state_button_TT_DELAYED_CONCESSION: "Concéder l'§Yindépendance§! cède les États que nous détenons à leur revendiquant légitime, que cette nation existe encore ou doive être ressuscitée."
