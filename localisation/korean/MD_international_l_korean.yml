 IS_un_aid_general_budget_tt: "§BUN§! §Y일반 운영 예산§!에 대한 각국의 기여액을 내림차순으로 표시합니다"
 IS_un_aid_general_budget_tt_delayed: "§Y일반 운영 예산§!은 모든 §BUN§! 회원국이 최소 요건을 충족할 경우 기여하는 전체 기본 예산입니다. 최소 예산 기여액은 매년 연초에 계산되는 GDP의 §Y[?global.general_operating_budget_contribute_percent|%]§!이며, 예산에 추가하려면 최소 §G$0.001§!의 기여가 필요합니다. 이 최소 기준을 충족하지 못한 국가는 해당 연도에 예산에 기여하지 않으며, 그 결과 예산 기여에 따른 혜택도 받지 못합니다.\n\n§Y일반 운영 예산§!은 회원국이 §B국제연합§!에 매주 제공하는 기본 금액으로, 여러 §BUN§! §Y원조 프로그램§!에 분배됩니다. 이 기여금은 모든 프로그램에 균등하게 분배되며, 각 프로그램이 매주 운영을 위해 받는 초기 기본 금액이 됩니다.\n\n각국은 기여에 대한 혜택으로 §Y일반 운영 예산§!에 대한 기여 비율과 같은 만큼의 £foreign_influence_modifier_texticon §Y외국 영향력§! 승수 및 £foreign_influence_defense_modifier_texticon §Y외국 영향력 방어§! 승수 보너스를 받습니다."
 is_un_aid_total_budget_spending: "§C국제연합§!에 대한 §R총 지출§!:"
 is_un_aid_total_budget_spending_tt: "현재 §BUN§! 자금 지원에 $[?united_nations_expenses|-3]를 지출하고 있습니다"
 is_un_aid_total_budget_spending_tt_delayed: "이 수치는 §Y일반 운영 예산§!과 이후의 모든 §BUN§! 프로그램 기여에 대한 우리의 독자적인 지출 결정을 포함하여, 모든 §BUN§! §Y원조 프로그램§!에 걸쳐 지출하는 금액을 나타냅니다."
 is_un_basic_budget_spending: "§C국제연합§! §Y예산§!에 대한 §R지출§!:"
 is_un_basic_budget_spending_tt: "현재 §BUN§! §Y일반 운영 예산§!에 $[?united_nations_base_expenses|-3]를 지출하고 있습니다"
 is_un_basic_budget_spending_tt_delayed: "§Y일반 운영 예산§!은 회원국이 §B국제연합§!에 매주 제공하는 기본 금액으로, 여러 §BUN§! §Y원조 프로그램§!에 분배됩니다. 이 기여금은 모든 프로그램에 균등하게 분배되며, 각 프로그램이 매주 운영을 위해 받는 초기 기본 금액이 됩니다. 이 예산에서 자금을 받는 프로그램은 §YUNIDO§!, §YUNCDF§!, §YUNESCOE§!입니다"
 is_un_aid_unescoe_spending: "§YUNESCOE§!에 대한 §R지출§!:"
 is_un_aid_unescoe_spending_tt: "현재 §YUNESCOE 프로그램§!에 $[?united_nations_unescoe_funding|-3]를 지출하고 있습니다"
 is_un_aid_unescoe_spending_tt_delayed: "§B국제연합§! §Y교육과학문화기구§!는 교육을 개선하고, 개발도상국에 기술 자문을 제공하며, 성장에 도움이 필요한 국가에 정책 대화를 제공하기 위해 마련된 원조 기구입니다.\n\n이 §BUN§! §Y원조 프로그램§!은 £research_speed_texticon §Y연구 속도§! 및 £political_power_texticon §Y정치력 획득§!을 증진시킵니다."
 is_un_aid_unido_spending: "§YUNIDO§!에 대한 §R지출§!:"
 is_un_aid_unido_spending_tt: "현재 §YUNIDO 프로그램§!에 $[?united_nations_unido_funding|-3]를 지출하고 있습니다"
 is_un_aid_unido_spending_tt_delayed: "§B국제연합§! §Y산업개발기구§!는 산업 발전을 촉진하기 위해 마련된 원조 프로그램입니다. 개발도상국이 자체 산업을 구축하도록 도움으로써 이 프로그램은 빈곤과 싸우고, 포용적 세계화를 이루며, 환경 지속 가능성도 목표로 합니다.\n\n이 §BUN§! §Y원조 프로그램§!은 무상 임대 §Y민간 산업§!을 얻을 수 있는 능력을 제공하며, 각국이 산업 기반, 전력 인프라 및 건설 인프라를 개선할 수 있도록 £construction_speed_texticon §Y건설 속도§!도 향상시킵니다."
 is_un_aid_uncdf_spending: "§YUNCDF§!에 대한 §R지출§!:"
 is_un_aid_uncdf_spending_tt: "현재 §YUNCDF 프로그램§!에 $[?united_nations_uncdf_funding|-3]를 지출하고 있습니다"
 is_un_aid_uncdf_spending_tt_delayed: "§B국제연합§! §Y자본개발기금§!은 국가 투자를 위한 자본 흐름을 개선하기 위해 마련된 원조 프로그램입니다. 이 프로그램의 목표는 투자 프로그램과 디지털 금융을 통해 일자리를 창출하고 지속 가능한 경제 성장을 이끌어 내는 것입니다.\n\n이 §BUN§! §Y원조 프로그램§!은 프로그램의 원조를 받는 국가에 §Y재정§! 및 §Y개발§! 지원을 모두 제공합니다. 이 프로그램은 예산을 개선하고 생산성 증가를 촉진하기 위해 마련되었습니다."
 is_un_aid_spending_percent: "§Y기본 예산§! 비율(%):"
 is_un_aid_spending_percent_tt: "우리가 기여하는 §Y일반 운영 예산§!의 비율은 [?united_nations_contribution_percent|Y%2]입니다"
 is_un_aid_spending_percent_tt_delayed: "§Y일반 운영 예산§!의 비율은 위신의 문제이자 힘의 문제입니다. 더 많이 기여할수록 다른 나라에 대해 더 많은 £foreign_influence_modifier_texticon §Y외국 영향력§!을 확립할 수 있으며, 우리의 영향력도 더욱 효과적이 됩니다. 이 비율을 높일 수 있을수록 좋습니다."
 is_un_aid_additional_percent: "§C국제연합§! §Y원조 프로그램§! 비율(%):"
 is_un_aid_additional_percent_tt: "우리가 기여하는 모든 §Y원조 프로그램 추가 기여금§!의 비율은 [?united_nations_aid_program_contribution_percent|Y%2]입니다"
 is_un_aid_additional_percent_tt_delayed: "§Y원조 프로그램 추가 기여금§!의 비율이 높을수록 프로그램으로부터 원조를 받는 국가들에 대한 영향력이 커지고 £political_power_texticon §Y정치력 획득§!이 늘어나며, 우리의 §Y투자§!에 필요한 시간과 비용을 모두 §G감소§!시켜 다른 국가가 우리의 §Y투자§!를 수락할 가능성도 높아집니다"
 is_un_aid_total_budget_ido_tt_delayed: "프로그램 예산의 §Y25%§!는 각국이 £construction_speed_texticon §Y건설 속도§!를 개선하도록 돕는 데 쓰이며, 나머지 §Y75%§!는 §G보조금을 받는§! 국가에 임대 §Y민간 산업§!을 제공하는 데 쓰입니다."
 is_un_aid_total_budget_esco_tt_delayed: "프로그램 예산의 §Y25%§!는 각국이 £political_power_texticon §Y정치력 획득§!을 개선하도록 돕는 데 쓰이며, 나머지 §Y75%§!는 £research_speed_texticon §Y연구 속도§!를 개선하는 프로젝트에 쓰입니다"
