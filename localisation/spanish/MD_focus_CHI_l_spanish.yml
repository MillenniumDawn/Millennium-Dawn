 CHI_water_shortage_2: "$CHI_water_shortage$"
 CHI_water_shortage_2_desc: "La llanura del norte de China, la cuenca del río Amarillo y el corredor Pekín-Tianjin-Hebei albergan en conjunto aproximadamente la mitad de las tierras cultivadas del país, pero menos de una quinta parte de su agua dulce. La disponibilidad de agua por cápita en el norte se sitúa muy por debajo del umbral internacional de escasez de 1.000 metros cúbicos al año. Los vertidos industriales y las escorrentías agrícolas han contaminado una parte importante de las aguas superficiales y subterráneas disponibles, agravando la escasez física. La agricultura representa más del 60 por ciento del consumo total de agua, y las demandas de refrigeración del sector energético añaden más tensión a una base de recursos ya de por sí mermada.\n§W--------------§!\nCompletar proyectos de la categoría de decisiones §Y$CHI_water_shortage_category$§!, desbloqueada por el enfoque §Y$CHI_water_security_initiative$§!, y las rutas del Proyecto de Trasvase de Agua Sur-Norte en la categoría §Y$CHI_megaprojects$§! aumenta nuestro progreso en la conservación del agua. Este espíritu nacional §GMejorará§! con §Y9§! proyectos completados."
 CHI_water_shortage_3: "$CHI_water_shortage$"
 CHI_water_shortage_3_desc: "La llanura del norte de China, la cuenca del río Amarillo y el corredor Pekín-Tianjin-Hebei albergan en conjunto aproximadamente la mitad de las tierras cultivadas del país, pero menos de una quinta parte de su agua dulce. La disponibilidad de agua por cápita en el norte se sitúa muy por debajo del umbral internacional de escasez de 1.000 metros cúbicos al año. Los vertidos industriales y las escorrentías agrícolas han contaminado una parte importante de las aguas superficiales y subterráneas disponibles, agravando la escasez física. La agricultura representa más del 60 por ciento del consumo total de agua, y las demandas de refrigeración del sector energético añaden más tensión a una base de recursos ya de por sí mermada.\n§W--------------§!\nCompletar proyectos de la categoría de decisiones §Y$CHI_water_shortage_category$§!, desbloqueada por el enfoque §Y$CHI_water_security_initiative$§!, y las rutas del Proyecto de Trasvase de Agua Sur-Norte en la categoría §Y$CHI_megaprojects$§! aumenta nuestro progreso en la conservación del agua. Este espíritu nacional §GMejorará§! con §Y13§! proyectos completados."
 CHI_water_shortage_4: "$CHI_water_shortage$"
 CHI_water_shortage_4_desc: "La llanura del norte de China, la cuenca del río Amarillo y el corredor Pekín-Tianjin-Hebei albergan en conjunto aproximadamente la mitad de las tierras cultivadas del país, pero menos de una quinta parte de su agua dulce. La disponibilidad de agua por cápita en el norte se sitúa muy por debajo del umbral internacional de escasez de 1.000 metros cúbicos al año. Los vertidos industriales y las escorrentías agrícolas han contaminado una parte importante de las aguas superficiales y subterráneas disponibles, agravando la escasez física. La agricultura representa más del 60 por ciento del consumo total de agua, y las demandas de refrigeración del sector energético añaden más tensión a una base de recursos ya de por sí mermada.\n§W--------------§!\nCompletar proyectos de la categoría de decisiones §Y$CHI_water_shortage_category$§!, desbloqueada por el enfoque §Y$CHI_water_security_initiative$§!, y las rutas del Proyecto de Trasvase de Agua Sur-Norte en la categoría §Y$CHI_megaprojects$§! aumenta nuestro progreso en la conservación del agua. Este espíritu nacional se §REliminará§! con §Y17§! proyectos completados."
 CHI_local_debt_category: "Deuda de los gobiernos locales"
 CHI_local_debt_category_desc: "Los vehículos de financiación provincial se endeudan contra futuras ventas de tierras para financiar las fábricas, los parques empresariales y las infraestructuras que recompensan las evaluaciones de los cuadros. La factura nunca llega a los libros de Pekín, hasta que lo hace.\n\n§YPresión de la deuda§!: [?CHI_local_debt_pressure|0] / 100\n§YTolerancia fiscal§!: §Y$industrial_complex$§! y §Y$offices$§! soportados: [?CHI_local_debt_tolerance|0]\n§YActual§!: [?industrial_complex_total|0] §Y$industrial_complex$§! y [?office_park_total|0] §Y$offices$§!. Total: [?CHI_local_debt_buildings|0]\n\n§YCómo se mueve§!\nCada mes, la Tolerancia Fiscal aumenta en §G+0.25§!. Si el total de edificios la supera, la Presión de la Deuda aumenta en §R+1§! por cada edificio que rebase la línea. Si no es así, la Presión disminuye en §G-0.5§!.\n\n§GUmbrales§!\nLa presión fija el nivel de §Y$CHI_local_government_debt$§!.\n§G20§!: penalizaciones a los intereses y a los bienes de consumo.\n§G45§!: añade penalizaciones al rendimiento de las inversiones y a la estabilidad.\n§G70§!: añade penalizaciones a la velocidad de construcción y a la productividad de las fábricas.\n§G90§!: todas las penalizaciones alcanzan su punto máximo y el poder político se resiente.\nCae por debajo de un umbral y el nivel se aliviará de nuevo.\n\n§GCómo reducirla§!\nLos enfoques industriales aumentan la Presión de la Deuda. Los enfoques de reforma fiscal como §Y$CHI_property_tax_pilot_program$§! y §Y$CHI_cadre_evaluation_reform$§! aumentan la Tolerancia Fiscal o reducen la Presión directamente. §Y$CHI_provincial_debt_swap$§! abajo reduce la Presión en §G15§! una vez al año a cambio del §R2%§! del PIB.\n\n§GCómo terminar con ella§!\nUna vez que la Presión de la Deuda cae por debajo de §Y1§!, comienza la misión §Y$CHI_local_debt_resolution_mission$§!. Manténla ahí durante §Y5 años§! y el sistema de deuda local se retirará permanentemente. Si la Presión vuelve a subir a 1 o más, la misión se cancela y se reinicia cuando la Presión caiga de nuevo."
 CHI_provincial_debt_swap: "Canje de deuda provincial"
 CHI_provincial_debt_swap_desc: "El gobierno central permite a las provincias refinanciar los préstamos de sus vehículos de financiación en bonos a más largo plazo, absorbiendo parte de la carga en el presupuesto nacional. El canje alivia la presión inmediata de la deuda, pero no cambia en nada el modelo de crecimiento que la produjo."
 CHI_local_debt_resolution_mission: "Restricciones presupuestarias estrictas"
 CHI_local_debt_resolution_mission_desc: "Con la presión de la deuda local a cero, Pekín puede desmantelar el modelo de vehículos de financiación en lugar de gestionarlo. Las provincias solo se endeudan a través de la cuota oficial de bonos, los ingresos por tierras ya no se comprometen contra préstamos bancarios y las evaluaciones de los cuadros dejan de recompensar la construcción por el mero hecho de construir. Si la Presión de la Deuda se mantiene por debajo de 1 durante cinco años, el sistema de deuda local se retira definitivamente. Si vuelve a subir, la misión se cancela y se reiniciará una vez que la presión vuelva a caer por debajo de 1."
 CHI_local_debt_resolved_tt: "El sistema de la §YDeuda de los gobiernos locales§! queda §Gretirado permanentemente§!. La presión de la deuda y la tolerancia fiscal ya no cambian y la categoría de decisiones es eliminada."
 CHI_semiconductor_backwardness_2: "$CHI_semiconductor_backwardness_1$"
 CHI_semiconductor_backwardness_2_desc: "La industria de semiconductores de China sigue siendo estructuralmente dependiente de las fundiciones, el software de diseño y los equipos de fabricación extranjeros. Las fundiciones nacionales operan con un retraso de dos a tres generaciones respecto a la frontera tecnológica, las empresas de diseño carecen de cadenas de herramientas EDA maduras y ninguna firma nacional de equipos puede suministrar litografía avanzada. Esta brecha frena la construcción de plantas de chips nacionales y la producción de fundición, y limita tanto la electrónica civil como la cadena de suministro de electrónica militar.\n§W--------------§!\nEste espíritu nacional §GMejorará§! si completamos el enfoque §Y$CHI_domestic_eda$§!."
 CHI_semiconductor_backwardness_3: "$CHI_semiconductor_backwardness_1$"
 CHI_semiconductor_backwardness_3_desc: "La industria de semiconductores de China sigue siendo estructuralmente dependiente de las fundiciones, el software de diseño y los equipos de fabricación extranjeros. Las fundiciones nacionales operan con un retraso de dos a tres generaciones respecto a la frontera tecnológica, las empresas de diseño carecen de cadenas de herramientas EDA maduras y ninguna firma nacional de equipos puede suministrar litografía avanzada. Esta brecha frena la construcción de plantas de chips nacionales y la producción de fundición, y limita tanto la electrónica civil como la cadena de suministro de electrónica militar.\n§W--------------§!\nEste espíritu nacional §GMejorará§! si completamos el enfoque §Y$CHI_big_fund_phase2$§!."
 CHI_semiconductor_backwardness_4: "$CHI_semiconductor_backwardness_1$"
 CHI_semiconductor_backwardness_4_desc: "La industria de semiconductores de China sigue siendo estructuralmente dependiente de las fundiciones, el software de diseño y los equipos de fabricación extranjeros. Las fundiciones nacionales operan con un retraso de dos a tres generaciones respecto a la frontera tecnológica, las empresas de diseño carecen de cadenas de herramientas EDA maduras y ninguna firma nacional de equipos puede suministrar litografía avanzada. Esta brecha frena la construcción de plantas de chips nacionales y la producción de fundición, y limita tanto la electrónica civil como la cadena de suministro de electrónica militar.\n§W--------------§!\nEste espíritu nacional se §REliminará§! si completamos el enfoque §Y$CHI_mature_node_counter_offensive$§! o §Y$CHI_sicarrier_euv$§!."
 CHI_AST_pacific_deterrence: "Mayor disuasión en el Pacífico"
 CHI_AST_pacific_deterrence_desc: "La presión china por el establecimiento de bases en el Pacífico Sur ha forzado una urgente expansión del alcance de la Armada Real Australiana. Nuevos sensores, una inteligencia más precisa y activos anfibios preparados están listos en alerta."
 CHI_political_events.53.a: "Tomado nota."
 CHI_political_events.53.d: "El grupo yihadista uigur conocido como Partido Islámico de Turkistán ha comenzado a emitir sus declaraciones bajo el nombre de Partido Islámico del Turquestán Oriental, regresando a su denominación anterior. El cambio señala un énfasis renovado en el reclamo separatista de Xinjiang, mientras que los combatientes del grupo siguen basados en Afganistán y Siria."
 CHI_political_events.53.t: "El Partido Islámico de Turkistán regresa a su nombre original"
 CHI_outer_mongolia_return: "El retorno de Mongolia Exterior"
 CHI_outer_mongolia_return_desc: "Después de casi cien años, la pradera de Khalkha vuelve a estar bajo nuestro control; la estepa mongola, que se extiende al norte y al sur del desierto de Gobi, estará finalmente bajo una sola bandera. Es un símbolo significativo del gran rejuvenecimiento de la nación china. Esta tierra antigua adquirirá una nueva gloria en nuestras manos."
