 ukraine_praktyka_otaman_plan_6x6_tt: "The §YOtaman 6x6 122§! prototype is ready in §Y$DAYS$§! days. Then the 6x6 line continues with the §YOtaman 6x6 Grom§! and the §YOtaman-3§!."
