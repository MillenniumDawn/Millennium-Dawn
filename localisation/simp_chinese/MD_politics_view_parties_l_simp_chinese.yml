 ADY.oligarchism_icon: "£SOV_oligarchism_pre"
 ADY.Neutral_Communism: "£SOV_agrarian_party (APR) - 俄罗斯农民党"
 ADY.Neutral_Communism_icon: "£SOV_agrarian_party"
 ADY.Neutral_Communism_desc: "（农业社会主义）- 俄罗斯农民党\n\n农业党由米哈伊尔·拉普申和瓦西里·斯塔罗杜布采夫于1993年2月26日创立，旨在捍卫集体农场和国营农场，反对市场改革。在第一次国家杜马选举中，该党与共产党并肩投票，获得8%的选票和37个席位。在以粮食、向日葵和畜牧业为主的农业共和国阿迪格，该党代表着苏联时期农场主和农村行政部门的利益。\n\n随着集体农业制度的崩溃，该党得票率下降，2007年跌至2.30%，未获得任何席位。2008年，该党并入统一俄罗斯党。2012年5月2日，一个同名政党重新注册成立，成为当局的中间派盟友。2019年10月21日，最高法院以参选次数不足为由，解散了该党。"
 ADY.neutral_Social: "£SOV_non_aligned_socialist_democrat (PR) - 俄罗斯爱国者"
 ADY.neutral_Social_icon: "£SOV_non_aligned_socialist_democrat"
 ADY.neutral_Social_1: "£SOV_non_aligned_socialist_democrat_1 (NL) - 新人"
 ADY.neutral_Social_1_icon: "£SOV_non_aligned_socialist_democrat_1"
 ADY.neutral_Social_desc: "（民族社会主义）- 俄罗斯爱国者\n\n俄罗斯爱国者党由商人根纳季·谢米金于2005年4月20日被俄罗斯联邦共产党开除后在一次代表大会上创立，该党融合了民主社会主义和左翼民族主义：主张建立强大的福利国家、自然资源公有制和奉行大国外交政策。它自诩为忠于国家、敌视自由主义反对派的爱国左翼。\n\n该党的优势在于少数几个地方议会，而非国家杜马。在国家杜马选举中，该党分别在2007年、2011年和2016年获得0.89%、0.97%和0.59%的席位，其阿迪格共和国支部从未赢得过任何席位。2021年2月22日，该党与“为了真理”党合并，成立了“公正俄罗斯-为了真理”党。"
