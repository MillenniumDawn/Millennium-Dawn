 USoE.Neutral_conservatism: "£EU_parl_PG_party_14 (UEN) - 欧洲国家联盟"
 USoE.Neutral_conservatism_icon: "£EU_parl_PG_party_14"
 USoE.Neutral_conservatism_desc: "（中立保守主义） - 欧洲国家联盟(UEN)\n\n欧洲国家联盟的前身是“欧罗巴联盟”，是一个右翼的欧洲怀疑主义保守党。它试图将欧洲联盟的权力下放，并在其位置上形成一个主权国家的联盟。它对社会权利持保守立场，在经济上支持自由市场资本主义制度。"
 USoE.Neutral_conservatism_2017: "£EU_parliament_PG_2017_Neutral_conservatism (ACRE) - 欧洲保守派和改革派联盟"
 USoE.Neutral_conservatism_2017_icon: "£EU_parliament_PG_2017_Neutral_conservatism"
 USoE.Neutral_conservatism_2017_desc: "（中立保守主义）- 欧洲保守派和改革派联盟(ACRE)\n\n欧洲保守派和改革派联盟的前身是“欧洲保守派和改革派联盟”，是一个右翼的欧洲保守派政党。它试图将欧洲合众国的权力下放，并在其位置上形成一个主权国家的联盟。它对社会权利持保守立场，在经济上支持自由市场资本主义制度。"
 USoE.oligarchism: "£EU_parl_PG_party_15 (AoO) - 寡头政治联盟"
 USoE.oligarchism_icon: "£EU_parl_PG_party_15"
 USoE.oligarchism_desc: "（寡头主义者） - 寡头联盟(AoO)\n\n"
 USoE.Neutral_Libertarian: "£EU_parl_PG_party_16 (AoL) - 自由意志主义者联盟"
 USoE.Neutral_Libertarian_icon: "£EU_parl_PG_party_16"
 USoE.Neutral_Libertarian_desc: "（自由主义） - 自由意志主义者联盟(AoL)\n\n自由意志主义者联盟是一个自由主义政党，支持政府对经济和个人生活琐事的有限干预，而是认为政府的作用是为企业和个人提供一个自由发展的安全环境。它的政治议程集中在收获互联网在直接民主、表达自由和版权等问题上的优势。"
 USoE.Neutral_Libertarian_2017: "£EU_parliament_PG_2017_Neutral_Libertarian (PPEU) - 欧洲海盗党"
 USoE.Neutral_Libertarian_2017_icon: "£EU_parliament_PG_2017_Neutral_Libertarian"
 USoE.Neutral_Libertarian_2017_desc: "（自由主义） - 欧洲海盗党(PPEU)\n\n欧洲海盗党是一个自由主义政党，支持政府对经济和个人生活琐事的有限干预，而认为政府的作用是为企业和个人提供一个自由发展的安全环境。它的政治议程集中在收获互联网在直接民主、表达自由和版权等问题上的优势。"
 USoE.Neutral_green: "£EU_parl_PG_party_17 (Greens/EFA) - 绿党/欧洲自由联盟"
 USoE.Neutral_green_icon: "£EU_parl_PG_party_17"
 USoE.Neutral_green_desc: "（绿党） - 绿党/欧洲自由联盟(Greens/EFA)\n\n绿党/欧洲自由联盟，通常被称为“绿党”，是一个左翼政党。它的经济观点反对资本主义和对持续增长的研究，而是相信 “快乐的退化”的必要性。它强烈反对将核能作为清洁能源的来源，而是认为有必要暂时建造天然气发电厂，以支持未来的全面可再生能源转型。它的政治议程集中在减少不平等和保护环境上，其目的是通过大量赤字资助的公共开支来实现这一目标。"
 USoE.Neutral_green_2017: "£EU_parliament_PG_2017_Neutral_green (EGP) - 欧洲绿党"
 USoE.Neutral_green_2017_icon: "£EU_parliament_PG_2017_Neutral_green"
 USoE.Neutral_green_2017_desc: "（绿党） - 欧洲绿党(EGP)\n\n欧洲绿党，俗称“绿党”，是一个左翼政党。它的经济观点拒绝资本主义和持续增长的研究，而是相信“快乐的逆生长”的必要性。它强烈反对将核能作为清洁能源的来源，而是认为有必要临时建造燃气发电厂以支持未来全面的可再生能源转型。它的政治议程侧重于减少不平等和保护环境，并旨在通过大量赤字资助公共支出来实现这一目标。"
 USoE.neutral_Social: "£EU_parl_PG_party_18 (ASD) - 社会民主联盟"
 USoE.neutral_Social_icon: "£EU_parl_PG_party_18"
 USoE.neutral_Social_desc: "（不结盟社会民主主义）- 社会民主联盟(ASD)\n\n社会民主联盟是欧洲合众国议会的左翼政党，主张基于地区认同的更高程度的民主代表制，旨在将欧洲合众国塑造为“区域的欧洲”。其政治议程侧重于社会正义和经济平等。"
 USoE.neutral_Social_2017: "£EU_parliament_PG_2017_neutral_Social (EFA) - 欧洲自由联盟"
 USoE.neutral_Social_2017_icon: "£EU_parliament_PG_2017_neutral_Social"
 USoE.neutral_Social_2017_desc: "（不结盟社会民主主义）- 欧洲自由联盟(EFA)\n\n欧洲自由联盟是欧洲合众国议会的左翼政党，主张基于地区认同的更高程度的民主代表，旨在将欧洲合众国塑造成“区域的欧洲”。其政治议程的重点是社会正义和经济平等。"
 USoE.Neutral_Communism: "£EU_parl_PG_party_19 (GUE/NGL) - 欧洲联合左派/北欧绿党左派"
 USoE.Neutral_Communism_icon: "£EU_parl_PG_party_19"
 USoE.Neutral_Communism_desc: "（中立马克思-列宁主义）欧洲联合左派/北欧绿党左派(GUE/NGL)\n\n欧洲联合左派/北欧绿党左派是欧洲合众国议会的左翼政党。它主要由社会主义者和共产主义者组成，因此拒绝资本主义和传统的货币主义和预算政策。它旨在实现社会向社会主义的转变，但对于改革还是革命是实现这一目标的最佳途径并没有明确的立场。它反对与美国在欧洲合众国上的合作，而是认为欧洲应该走自己的路。"
 USoE.Neutral_Communism_2017: "£EU_parliament_PG_2017_Neutral_Communism (PEL) - 欧洲左翼党"
 USoE.Neutral_Communism_2017_icon: "£EU_parliament_PG_2017_Neutral_Communism"
 USoE.Neutral_Communism_2017_desc: "（中立马克思-列宁主义）- 欧洲左翼党(PEL)\n\n欧洲左翼党是欧洲合众国议会的左翼政党。它主要由社会主义者和共产主义者组成，因此拒绝资本主义和传统的货币主义和预算政策。它旨在实现社会向社会主义的转变，但对于改革还是革命是实现这一目标的最佳途径并没有明确的立场。它反对与美国在欧洲合众国上的合作，而是认为欧洲应该走自己的路。"
 USoE.Nat_Populism: "£EU_parl_PG_party_20 (EDD) - 欧洲的民主和多样性"
 USoE.Nat_Populism_icon: "£EU_parl_PG_party_20"
 USoE.Nat_Populism_desc: "（右翼民粹主义） - 欧洲的民主和多样性 (EDD)\n\n欧洲的民主和多样性是欧洲合众国议会的民粹主义欧洲怀疑党。它强烈反对统一进程，并旨在颠覆它。其政治观点集中在反移民和反全球化立场以及引入直接民主的目标上。"
 USoE.Nat_Populism_2017: "£EU_parliament_PG_2017_Nat_Populism (EFDD) - 自由和直接民主的欧洲"
 USoE.Nat_Populism_2017_icon: "£EU_parliament_PG_2017_Nat_Populism"
 USoE.Nat_Populism_2017_desc: "（右翼民粹主义） - 自由和直接民主的欧洲(EFDD)\n\n自由和直接民主的欧洲，前身为“欧洲的民主和多样性”，是欧洲合众国议会的民粹主义欧洲怀疑党。它强烈反对统一进程，并旨在颠覆它。其政治观点集中在反移民和反全球化立场以及引入直接民主的目标上。"
 USoE.Nat_Fascism: "£EU_parl_PG_party_21 (AoF) - 法西斯联盟"
 USoE.Nat_Fascism_icon: "£EU_parl_PG_party_21"
 USoE.Nat_Fascism_desc: "（法西斯主义） - 法西斯联盟(AoF)\n\n法西斯联盟是欧洲合众国议会的极右翼疑欧政党。它主要由法西斯主义者和极端民族主义者组成。它的政治观点集中在捍卫基督教传统、强硬的反移民政策以及用强人独裁取代民主。"
 USoE.Nat_Fascism_2017: "£EU_parliament_PG_2017_Nat_Fascism (APF) - 和平与自由联盟"
 USoE.Nat_Fascism_2017_icon: "£EU_parliament_PG_2017_Nat_Fascism"
 USoE.Nat_Fascism_2017_desc: "（法西斯主义） - 和平与自由联盟(APF)\n\n和平与自由联盟是欧洲合众国议会的极右翼欧洲怀疑主义政党。它主要由法西斯主义者和极端民族主义者组成。它的政治观点集中在捍卫基督教传统、强硬的反移民政策以及用强人独裁取代民主。"
 USoE.Nat_Autocracy: "£EU_parl_PG_party_22 (EUMS) - 欧洲联盟军事参谋部"
 USoE.Nat_Autocracy_icon: "£EU_parl_PG_party_22"
 USoE.Nat_Autocracy_desc: "（军政府） - 欧洲联盟军事参谋部(EUMS)\n\n欧洲联盟军事参谋部是欧洲合众国军队的政治分支，它是军队高级军事领导人的联盟，他们组成了军政府并控制了行政部门，以专制方式行使权力。"
 USoE.Monarchist: "£EU_parl_PG_party_23 (AoM) - 君主主义者联盟"
 USoE.Monarchist_icon: "£EU_parl_PG_party_23"
 USoE.Monarchist_desc: "（专制君主主义） - 君主主义者联盟(AoM)\n\n君主主义者联盟支持新登基的王朝。他们认为有必要有一个摆脱民主决策桎梏的绝对统治者，才能领导欧洲大陆度过21世纪。"
 MAC.Conservative: "£MAC_Conservative  澳门雇主利益联会"
 MAC.Conservative_desc: "澳门雇主利益联会是中国澳门特别行政区的一个政党。"
 MAC.liberalism: "£MAC_liberalism 新澳门学社"
 MAC.liberalism_desc: "新澳门学社是中国澳门特别行政区的一个主要亲民主政党。"
 MAC.socialism: "£MAC_socialism 传新澳门协会"
 MAC.socialism_desc: "传新澳门协会，常简称为澳门协同会，是澳门的一个中间派政党。"
 MAC.Neutral_conservatism: "£MAC_Neutral_conservatism 澳粤同盟"
 MAC.Neutral_conservatism_desc: "澳粤联盟，简称UMG，是中国澳门特别行政区的一个政党。"
 MAC.neutral_Social: "£MAC_neutral_Social 澳门街坊会联合总会"
 MAC.neutral_Social_desc: "澳门街坊会总会，简称街坊会，是澳门的一个亲北京政党，在立法会中有代表。"
