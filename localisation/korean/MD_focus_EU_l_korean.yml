 EU_budget_draft_desc: "차기 회계연도 유럽연합(EU) 예산안 초안을 작성한 회원국은 협상이 끝날 때 이를 유럽 의회(EP) 안건으로 상정해야 합니다. 보상으로, 초안 작성국은 유럽연합 예산안이 승인되어 발효될 때 투자된 총 정치력을 환급받습니다."
