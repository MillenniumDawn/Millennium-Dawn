 TurkicConfederation.4.d: "Le gouvernement turc nous a approchés, nous proposant de rejoindre la nouvelle Confédération turcique. Évidemment, si nous acceptons, nous serons unis, mais nous perdrons notre statut de pays souverain..."
 TurkicConfederation.4.a: "Les peuples turciques ne font qu’un !"
 TurkicConfederation.4.b: "Il vaut mieux ne pas rejoindre..."
 TurkicConfederation.11.t: "L’Azerbaïdjan rejoint la Confédération !"
 TurkicConfederation.11.d: "Le gouvernement azéri a accepté notre offre de rejoindre la Confédération turcique. Nous serons enfin unis avec nos frères d’Azerbaïdjan !"
 TurkicConfederation.11.a: "Excellente nouvelle pour la Confédération turcique"
 TurkicConfederation.21.t: "Le Kazakhstan rejoint la Confédération !"
 TurkicConfederation.21.d: "Le gouvernement kazakh a accepté notre offre de rejoindre la Confédération turcique. Nous serons enfin unis avec nos frères du Kazakhstan !"
 TurkicConfederation.21.a: "Excellente nouvelle pour la Confédération turcique"
 TurkicConfederation.31.t: "L’Ouzbékistan rejoint la Confédération !"
 TurkicConfederation.31.d: "Le gouvernement ouzbek a accepté notre offre de rejoindre la Confédération turcique. Nous serons enfin unis avec nos frères d’Ouzbékistan !"
 TurkicConfederation.31.a: "Excellente nouvelle pour la Confédération turcique"
 TurkicConfederation.41.t: "Le Turkménistan rejoint la Confédération !"
 TurkicConfederation.41.d: "Le gouvernement turkmène a accepté notre offre de rejoindre la Confédération turcique. Nous serons enfin unis avec nos frères du Turkménistan !"
 TurkicConfederation.41.a: "Excellente nouvelle pour la Confédération turcique"
 TurkicConfederation.12.t: "L’Azerbaïdjan refuse l’offre"
 TurkicConfederation.12.d: "Le gouvernement azéri a refusé notre offre de rejoindre la Confédération turcique. Il semble que nous devrons chercher d’autres nations pour une éventuelle unification."
 TurkicConfederation.12.a: "C'est malheureux"
 TurkicConfederation.22.t: "Le Kazakhstan refuse l’offre"
 TurkicConfederation.22.d: "Le gouvernement kazakh a refusé notre offre de rejoindre la Confédération turcique. Il semble que nous devrons chercher d’autres nations pour une éventuelle unification."
 TurkicConfederation.22.a: "C'est malheureux"
 TurkicConfederation.32.t: "L’Ouzbékistan refuse l’offre"
 TurkicConfederation.32.d: "Le gouvernement ouzbek a refusé notre offre de rejoindre la Confédération turcique. Il semble que nous devrons chercher d’autres nations pour une éventuelle unification."
 TurkicConfederation.32.a: "C'est malheureux"
 TurkicConfederation.42.t: "Le Turkménistan refuse l’offre"
 TurkicConfederation.42.d: "Le gouvernement turkmène a refusé notre offre de rejoindre la Confédération turcique. Il semble que nous devrons chercher d’autres nations pour une éventuelle unification."
 TurkicConfederation.42.a: "C'est malheureux"
 TUR_flavor_event.1.t: "Effondrement économique turc !"
 TUR_flavor_event.1.d: "It appears that our economy has collapsed, and we are unable to do anything to save it this instant. We are going to have to devise an economic plan which lets us slowly repair the economy, and set forth a Turkish Economic boom. We have a long road ahead of us, so we will have to get to work as soon as possible."
 TUR_flavor_event.1.a: "Espérons que ce soit le dernier de nos problèmes"
 TUR_flavor_event.2.t: "Séisme majeur à Bingöl"
 TUR_flavor_event.2.d: "A major 6.4 magnitude earthquake has rocked the Eastern city of Bingol. 177 people were killed, 84 of which being the result of a collapsing dormitory block in a boarding school. Roughly 8,000 houses were damaged, and about 4 schools have collapsed. This earthquake must act as a reminder for us to step up our disaster relief program."
 TUR_flavor_event.2.a: "Un jour triste pour notre nation"
 TUR_flavor_event.3.t: "Attentat à Istanbul !"
 TUR_flavor_event.3.d: "At around 9:30 in the morning about five days ago, two trucks loaded with bombs were detonated in Istanbul. One near Neve Shalom Synagogue, and one in Bet Israel Synagogue. About 28 people have lost their lives, while another 300 were injured. Today, we have gotten news that another 31 people were killed during an attack on the British consulate, and another 450 people were injured. In total, 59 people lost their lives, and 750 more were injured as a result of these attacks."
 TUR_flavor_event.3.a: "Terrible"
 TUR_flavor_event.3.b: "Préparer un certain niveau d’aide"
 TUR_flavor_event.3.c: "Mobiliser toute l’aide disponible"
 TUR_flavor_event.4.t: "Introduction de la nouvelle lire"
 TUR_flavor_event.4.d: "Recently, a major change to the Lira has been brought about. The Grand National Assembly had voted on the removal of six zeros from the Lira. This means that 1 lira of the new currency is the equivalent of 1,000,000 lira of the old version. However some are doubtful of this new change, and they are arguing that it could do more harm than good to the nation."
 TUR_flavor_event.4.a: "Non, c’est un bon changement"
 TUR_flavor_event.4.b: "L’ancien, c’est de l’or"
 TUR_flavor_event.5.t: "Assassinat de Hrant Dink"
 TUR_flavor_event.5.d: "Hrant Dink, a Turkish-Armenian journalist, had been assassinated in Istanbul a few days back. He was an activist of minority rights, and a newspaper editor who actively sought out the reconciliation between Armenians, and Turks. The murderer has been identified as a 17 year old male, and he is now under police custody. Hrant's death has sparked outrage amongst the Armenian community within our nation, and today was the funeral where thousands gathered in solidarity."
 TUR_flavor_event.5.a: "Tragique"
 TUR_flavor_event.6.t: "Afflux de migrants"
 TUR_flavor_event.6.d: "Lately, we have been receiving more and more migrants from neighboring countries and abroad due to increasing conflicts. This is starting to slowly destabilize our politics, and some people are even pushing for more aggressive policies. We will have to prepare a response to the series of events."
 TUR_flavor_event.6.a: "Plus on est, mieux c’est ?"
 TUR_flavor_event.7.t: "Augmentation de la consommation de drogue"
 TUR_flavor_event.7.d: "La consommation de drogue augmente lentement dans certaines zones du pays, en particulier dans les quartiers à faible revenu. Cela aura des effets dévastateurs, car nos politiques et lois sur ce sujet sont incohérentes."
 TUR_flavor_event.7.a: "Réviser les lois"
 TUR_flavor_event.8.t: "Raid sur la flottille de Gaza"
 TUR_flavor_event.8.d: "Plus tôt dans la journée, des commandos navals israéliens ont mené une opération contre plusieurs navires civils, tuant 9 citoyens turcs à bord du Mavi Marmara. Ces flottilles transportaient de l’aide humanitaire pour tenter de briser le blocus israélien de la bande de Gaza. Cela n’excuse toutefois pas le meurtre de nos ressortissants, et Israël se montre très réticent à offrir des compensations ou des excuses."
 TUR_flavor_event.8.a: "Exiger des réparations ET des excuses !"
 TUR_flavor_event.8.b: "Nous avons de plus gros problèmes à gérer..."
 TUR_flavor_event.81.t: "La Turquie exige des réparations pour le raid sur la flottille de Gaza"
 TUR_flavor_event.81.d: "Le gouvernement turc est furieux de l’intervention de nos commandos pour arrêter les navires tentant de briser le blocus de Gaza. Bien sûr, ils sont en tort, car nous leur avons donné plusieurs avertissements, mais ils s’en moquent."
 TUR_flavor_event.81.a: "Payer les réparations, qu’on en finisse"
 TUR_flavor_event.81.b: "Nous ne paierons rien"
 TUR_flavor_event.811.t: "Israël verse des réparations"
 TUR_flavor_event.811.d: "Israel has agreed to pay reparations to the victims' families and our state as a result of the unjustified raid against the Free Gaza Movement."
 TUR_flavor_event.811.a: "Les réparations ne suffisent jamais..."
 TUR_flavor_event.812.t: "Israël ignore notre demande"
 TUR_flavor_event.812.d: "The Israeli government has rebuffed our demands, saying that we have no say in demanding reparations as we were the ones at fault. This is an outrageous statement, but we will not forget this."
 TUR_flavor_event.812.a: "Inacceptable"
 TUR_flavor_event.9.t: "Séisme à Van"
 TUR_flavor_event.9.d: "Plus tôt dans la journée, un tremblement de terre d'une magnitude d'environ 7,1 a secoué Van. Environ 11 000 bâtiments ont été endommagés ou détruits, laissant plus de 60 000 personnes sans abri et environ 600 morts. Malheureusement, cela n’est pas rare car nos régions de l’Est ne sont pas étrangères aux catastrophes naturelles telles que les tremblements de terre."
 TUR_flavor_event.9.a: "Une tragédie"
 TUR_flavor_event.9.b: "Mobiliser les secours"
 TUR_flavor_event.10.t: "Manifestations de Norouz"
 TUR_flavor_event.10.d: "Kurds across the nation are starting to protest against our government's policies, and they are demanding that we change them to better suit their needs. Obviously they want nothing more but to destroy the Turkish nation, as a lot of these protesters are in favor of the PKK."
 TUR_flavor_event.10.a: "Mettre la police anti-émeute en alerte"
 TUR_flavor_event.10.b: "Laisser-les manifester"
 TUR_flavor_event.11.t: "Attaque contre l’ambassade des États-Unis !"
 TUR_flavor_event.11.d: "The U.S. Embassy in Ankara has been attacked by a man wearing a vest strapped with explosives. The attack left the suspect, and one Turkish security guard dead, whilst also damaging the building itself by leaving a giant hole on the side of it. The White House has said that it will have to conduct its own investigations as to why it happened, but this should not have happened in the first place."
 TUR_flavor_event.11.a: "No need for an investigation if they're doing one"
 TUR_flavor_event.11.b: "Lancer notre propre enquête"
 TUR_flavor_event.12.t: "Catastrophe minière à Soma"
 TUR_flavor_event.12.d: "About 2 days ago, a fire was caused by blasting in Soma, at a coal mine. The fire lasted for about 2 days, and rescue missions were mobilized as soon as possible, but were ultimately not very successful due to the thick smoke from the fire. It has been confirmed that about 301 were killed, and luckily, 486 were able to survive. Fingers are being pointed at the inadequate inspections, and officials in charge of inspections."
 TUR_flavor_event.12.a: "Tragique"
 TUR_flavor_event.12.b: "Réviser le protocole d’inspection"
 TUR_flavor_event.13.t: "Attentats à Ankara"
 TUR_flavor_event.13.d: "A short while ago, 2 bombs were detonated near Ankara Central railway station, leaving 109 civilians dead, and another 500 injured. It appears that the bombs were intended to disrupt a \"Labour, Peace, and Democracy\" rally in Ankara, organized by several groups. Several opposition parties have been blaming our government and our inabilities to prevent the attack, but all we can do for now is make changes where we can."
 TUR_flavor_event.13.a: "C'est malheureux"
 TUR_flavor_event.13.b: "Renforcer la sécurité"
 TUR_flavor_event.14.t: "Débat sur le programme scolaire"
 TUR_flavor_event.14.d: "Conservatives and conservative groups across the nation are demanding that we remove the concept of evolution from our schools' curriculums. This has worried the secularists in our country, with some even saying that this undermines the very foundation of the nation."
 TUR_flavor_event.14.a: "Supprimons-le, quelles preuves ont-ils de toute façon ?"
 TUR_flavor_event.14.b: "Ridicule"
 TUR_flavor_event.15.t: "Crash d’un CASA CN-235 à Isparta"
 TUR_flavor_event.15.d: "Il y a quelque temps, un CN-235 de l’armée de l’air effectuait une mission d’entraînement avec deux pilotes et un technicien à bord. En raison d’un brouillard épais, l’équipage n’a pas pu naviguer correctement et s’est écrasé, tuant tous les occupants."
 TUR_flavor_event.15.a: "Vraiment malheureux"
 TUR_flavor_event.15.b: "Apporter des changements"
 TUR_flavor_event.16.t: "Des scientifiques établissent une base en Antarctique"
 TUR_flavor_event.16.d: "A group of our nation's scientists have established a base in Antarctica, marking major scientific progress for our nation!"
 TUR_flavor_event.16.a: "Super"
 TUR_flavor_event.17.t: "Droits des Kurdes"
 TUR_flavor_event.17.d: "Les éléments libéraux de notre nation appellent à davantage de réformes concernant les lois kurdes existantes. Ils demandent un assouplissement pour faciliter la montée en popularité des partis kurdes. Mais les groupes conservateurs affirment que nous devons maintenir le statu quo pour préserver la stabilité."
 TUR_flavor_event.17.a: "Les réformes sont dangereuses"
 TUR_flavor_event.17.b: "Les réformes sont nécessaires"
 TUR_flavor_event.18.t: "Changement dans les valeurs familiales"
 TUR_flavor_event.18.d: "Récemment, une nouvelle loi a été adoptée permettant aux femmes de devenir chefs de famille. Bien que ce changement ait satisfait de nombreux libéraux, il a irrité les conservateurs. Nous avons une occasion unique de modifier cette loi, pour le meilleur ou pour le pire."
 TUR_flavor_event.18.a: "Nous devons préserver nos traditions"
 TUR_flavor_event.18.b: "Le changement est nécessaire"
 TUR_flavor_event.19.t: "Normalisation des relations avec l’Arménie"
 TUR_flavor_event.19.d: "After what seemed like forever, the Armenians are opening up to normalize relations between our two countries. Following the Assassination of Hrant Dink, our relations with Armenia took a nosedive, leading to an unnecessary amount of animosity between our two nations. However recently they have begun to move on from the past, and they are open to normalizing relations once more."
 TUR_flavor_event.19.a: "Ils sont peut-être ouverts à une normalisation, mais pas moi"
 TUR_flavor_event.19.b: "Excellentes nouvelles"
 TUR_flavor_event.20.t: "Pipeline gazier trans-Caspien"
 TUR_flavor_event.20.d: "After some convincing from the Americans, Turkmenistan has agreed to allow the construction of a subsea gas pipeline stretching from Turkmenbashi to Adana, Turkey. However, many in the government are sceptical, as they argue that the financial burden will ultimately fall on us, which could possibly put our economy at risk."
 TUR_flavor_event.20.a: "Ça semble une belle opportunité"
 TUR_flavor_event.20.b: "Non, merci"
 Turkish_Economy.1.t: "La Turquie propose des investissements"
 Turkish_Economy.1.desc: "Turkey has offered to build a civilian factory in one of our provinces as long as we let a Turkish company operate and maintain it, they will get some foreign influence from this but we will also benefit in the long run."
 Turkish_Economy.1.a: "Oui"
 Turkish_Economy.1.b: "Non"
 Turkish_Economy.2.t: "La Turquie propose des investissements"
 Turkish_Economy.2.desc: "La Turquie propose de construire une usine civile dans l’une de nos provinces, à condition qu’un Turc la gère et l’exploite. Cela leur donnera une certaine influence étrangère, mais nous en bénéficierons également à long terme."
 Turkish_Economy.2.a: "Oui"
 Turkish_Economy.2.b: "Non, nous ne sommes pas amis."
 Turkish_Economy.3.t: "La Turquie propose des investissements"
 Turkish_Economy.3.desc: "La Turquie propose de construire une usine civile dans l’une de nos provinces, à condition qu’un Turc la gère et l’exploite. Cela leur donnera une certaine influence étrangère, mais nous en bénéficierons également à long terme."
 Turkish_Economy.3.a: "Oui"
 Turkish_Economy.3.b: "Non"
 Turkish_Economy.4.t: "La Turquie propose des investissements"
 Turkish_Economy.4.desc: "La Turquie propose de construire une usine civile dans l’une de nos provinces, à condition qu’un Turc la gère et l’exploite. Cela leur donnera une certaine influence étrangère, mais nous en bénéficierons également à long terme."
 Turkish_Economy.4.a: "Oui"
 Turkish_Economy.4.b: "Non"
 Turkish_Economy.5.t: "La Turquie propose des investissements"
 Turkish_Economy.5.desc: "La Turquie propose de construire une usine civile dans l’une de nos provinces, à condition qu’un Turc la gère et l’exploite. Cela leur donnera une certaine influence étrangère, mais nous en bénéficierons également à long terme."
 Turkish_Economy.5.a: "Oui"
 Turkish_Economy.5.b: "Non"
 Turkish_Economy.11.t: "L’Iran accepte !"
 Turkish_Economy.11.desc: "The Iranians have accepted our offer at investments, and a Turkish company will now operate a civilian factory in Tehran."
 Turkish_Economy.11.a: "Cela aidera l’économie iranienne plus que tout..."
 Turkish_Economy.22.t: "L’Arménie accepte !"
 Turkish_Economy.22.desc: "Surprisingly, the Armenians have accepted our offer, and plans to construct a civilian factory in one of their provinces are now under way!"
 Turkish_Economy.22.a: "Anciens ennemis, nouveaux amis."
 Turkish_Economy.33.t: "La Géorgie accepte !"
 Turkish_Economy.33.desc: "La Géorgie a accepté notre offre de construire une usine civile, et ils ont également accepté que celle-ci soit gérée par une entreprise turque."
 Turkish_Economy.33.a: "Bien"
 Turkish_Economy.44.t: "La Bulgarie accepte !"
 Turkish_Economy.44.desc: "The Bulgarians have agreed to our terms and are now giving us a plot of land to construct civilian factories in!"
 Turkish_Economy.44.a: "Nous regardons vers l’ouest !"
 Turkish_Economy.55.t: "La Grèce accepte !"
 Turkish_Economy.55.desc: "The Greeks have accepted our offers and are now letting us construct a civilian factory in their land! What a surprise!"
 Turkish_Economy.55.a: "Nous ne nous y attendions pas, mais c’est génial !"
 Turkish_Economy.111.t: "L’Iran refuse l’offre !"
 Turkish_Economy.111.desc: "Il semble que Téhéran n’ait pas accepté nos conditions pour les investissements, nous devrons chercher ailleurs."
 Turkish_Economy.111.a: "triste"
 Turkish_Economy.222.t: "L’Arménie refuse l’offre !"
 Turkish_Economy.222.desc: "Sans surprise, les Arméniens ont rejeté notre offre de construire des industries civiles sur leur territoire."
 Turkish_Economy.222.a: "Old grudges stunt progress."
 Turkish_Economy.333.t: "La Géorgie refuse l’offre !"
 Turkish_Economy.333.desc: "Sadly, Georgia has rejected our offer at investments, and it appears we will have to re-evaluate Turkish-Georgian relations."
 Turkish_Economy.333.a: "C'est malheureux"
 Turkish_Economy.444.t: "La Bulgarie refuse l’offre !"
 Turkish_Economy.444.desc: "La Bulgarie n’a même pas répondu à notre demande concernant les investissements, nous devons considérer cela comme un refus."
 Turkish_Economy.444.a: "Incroyable"
 Turkish_Economy.555.t: "La Grèce refuse l’offre !"
 Turkish_Economy.555.desc: "Il semble que la Grèce ne veuille pas d’entreprises turques sur son sol, nous devrons donc nous retirer pour l’instant."
 Turkish_Economy.555.a: "Rien de nouveau ?"
 TUR_pkk.1.t: "Opération contre le PKK"
 TUR_pkk.1.d: "Il devient de plus en plus clair que nous ne pouvons pas soumettre les Kurdes par le dialogue, ce qui ne nous laisse d’autre choix que de mener des opérations militaires dans nos régions kurdes pour maintenir le contrôle et la stabilité. La probabilité de succès dépend de l’option choisie : en cas de succès, la force du PKK faiblira, mais en cas d’échec, ils seront galvanisés."
 TUR_pkk.1.a: "Une opération calculée et bien planifiée"
 TUR_pkk.1.b: "Une opération calculée"
 TUR_pkk.1.c: "Pas besoin de plans, foncez !"
 TUR_pkk.2.t: "Opération réussie"
 TUR_pkk.2.d: "The Turkish government announced at its Diyarbakir summit earlier today that it wishes to pursue cooperation with regional nations, including us. Our delegates at the conference have now relayed the information to [ROOT.capital.GetCapitalVictoryPointName], and wish to know the stance that our government will take in order to combat the PKK and its splinter groups in the region."
 TUR_pkk.2.a: "Mission accomplie"
 TUR_pkk.3.t: "Opération échouée"
 TUR_pkk.3.d: "Delegates from [FROM.GetName] firmly shook the hands of our delegates at the Diyarbakir conference, exclaiming that [FROM.capital.GetCapitalVictoryPointName] is eagerly anticipating the first steps to be taken against the PKK and its splinter groups."
 TUR_pkk.3.a: "Il y a toujours demain..."
 TUR_pkk.4.t: "Insurrection du PKK"
 TUR_pkk.4.d: "Delegates from our neighbor, [FROM.GetName], silently left the summit a little while ago. The strange decision is questionable at best, as it raises some concerns within our cabinet about what their intentions really are."
 TUR_pkk.4.a: "Non ! Nous combattrons"
 Turkey.1.t: "Özkan forme un nouveau parti"
 Turkey.1.desc: "Après que [ROOT.GetLeader] a publiquement dénoncé le vice-premier ministre, Özkan a annoncé qu’il démissionnait de son poste au parlement et dans le parti. Il a également déclaré qu’il formerait un nouveau parti, le Parti de la Nouvelle Turquie. De nombreux députés actuels de §W[socialisme_L]§! ont déjà annoncé leur intention de le rejoindre, et beaucoup tentent également de rejoindre §W[conservatisme_L]§!."
 Turkey.1.a: "Nous n’avons pas besoin de lui"
 Turkey.1.b: "Négocier en coulisses avec les députés"
 Turkey.2.t: "Özkan se retire de la politique"
 Turkey.2.desc: "Après que [ROOT.GetLeader] a publiquement dénoncé le vice-premier ministre, Özkan a annoncé qu’il démissionnait de son poste au parlement et dans le parti. Lors d’une conférence de presse ultérieure, il a déclaré qu’il se retirait complètement de la politique pour passer plus de temps avec sa famille et sur des projets personnels."
 Turkey.2.a: "Notre pari a porté ses fruits"
 Turkey.3.t: "Le coup d’Özkan"
 Turkey.3.desc: "The rumours were true! Özkan and other §W[socialism_L]§! members were planning a coup. After a motion of no-confidence at a party meeting towards [ROOT.GetLeader], he was forced to resign. Özkan has taken his place as Prime Minister of Turkey"
 Turkey.3.a: "Maudit soit cet homme !"
 Turkey.4.t: "[Nat_Populisme_L] demande de nouvelles élections"
 Turkey.4.desc: "En raison de la situation politique de §W[socialisme_L]§!, le §W[Nat_Populisme_L]§! a retiré son soutien à notre coalition gouvernementale et demande de nouvelles élections."
 Turkey.4.a: "Convoquer de nouvelles élections"
 Turkey.4.b: "Pas besoin d’élections, nous pouvons survivre"
 Turkey.5.t: "Élection présidentielle turque de 2000"
 Turkey.5.desc: "L’élection présidentielle de 2000 approche. En Turquie, le président est choisi par le parlement. Pour qu’un candidat l’emporte, il doit obtenir une majorité des deux tiers lors de l’un des deux premiers tours. S’il n’y a pas de vainqueur, le troisième tour peut être remporté à la majorité simple. S’il n’y a toujours pas de gagnant, un quatrième tour oppose les deux candidats les plus populaires, où l’un doit obtenir la majorité. En cas d’absence de victoire, une élection anticipée doit être organisée pour briser l’impasse.\n\nPour l’instant, chaque parti parlementaire présente son propre candidat, et il semble très improbable qu’aucun ne l’emporte."
 Turkey.5.a: "Le vice-premier ministre Özkan négociera"
 Turkey.5.b: "Nous devons juste espérer le meilleur"
 Turkey.6.t: "Ahmet Necdet Sezer élu président"
 Turkey.6.desc: "Ahmet Necdet Sezer a été élu 10e président de la République turque. Ancien président de la Cour constitutionnelle, son élection a été soutenue par la majorité des partis parlementaires après avoir été convaincus par le vice-premier ministre Özkan. Sezer est un fervent défenseur de la laïcité et un partisan de l’interdiction du voile."
 Turkey.6.a: "Bon travail, Özkan"
 Turkey.7.t: "Le candidat de [socialisme_L] remporte la présidence"
 Turkey.7.desc: "À la surprise générale, Mehmet Mail Büyükerman, le candidat de §W[socialisme_L]§! pour la présidence, a remporté le vote. Certains analystes politiques qualifient cela de miracle. La raison la plus probable de la victoire de Büyükerman est que les partis d’opposition ne voulaient pas déstabiliser davantage le pays en risquant de nouvelles élections."
 Turkey.7.a: "Excellent"
 Turkey.8.t: "Presidential Vote Proceeds To Its Fourth Round"
 Turkey.8.desc: "Aucun candidat n’a obtenu les deux tiers des voix requis lors des deux premiers tours, ni la majorité au troisième tour. La compétition est maintenant réduite aux candidats de §W[socialisme_L]§! et §W[Conservateur_L]§!. Il est encore très improbable que l’un d’eux l’emporte, rendant une élection anticipée très probable. Bien sûr, nous pouvons annoncer notre soutien au candidat de §W[Conservateur_L]§!. C’est pratiquement un suicide politique, mais cela nous ferait gagner du temps et nous éviterait une élection immédiate."
 Turkey.8.a: "Espérons le meilleur. Encore."
 Turkey.8.b: "Throw our weight behind the §W[Conservative_L]§! candidate"
 Turkey.9.t: "[Conservative_L] Un candidat remporte la présidence"
 Turkey.9.desc: "Avec le soutien du parti au pouvoir §W[socialism_L]§!, le candidat §W[Conservative_L]§! Nevzat Yalçıntaş a remporté l'élection présidentielle. Cela va certainement renforcer la popularité du parti §W[Conservative_L]§!"
 Turkey.9.a: "Excellent"
 Turkey.10.t: "La Constitution exige des élections anticipées"
 Turkey.10.desc: "Il semble qu’aucun candidat n’ait rassemblé assez de soutien pour remporter le poste de président. La Constitution turque exige qu’en pareil cas, une élection anticipée soit organisée pour briser l’impasse.\n\nLe nouveau parlement élira un nouveau président avec succès."
 Turkey.10.a: "Mince"
 Turkey.11.t: "Coup d’État militaire !"
 Turkey.11.desc: "Earlier today Turkish military units rolled down the streets of Istanbul and occupied several government buildings. The military announced the closure of Istanbul's airspace as Turkish fighter jets patrolled the area. We have reports of Turkish soldiers being deployed to other major cities as well. Some clashes have been reported between soldiers loyal to the current regime and the soldiers partaking in the coup. So far most members of government seem to have avoided capture by the military. There is still hope that forces loyal to the government will disarm these insurgents. Or perhaps not"
 Turkey.11.a: "L’armée est pleine de traîtres ! Arrêtez ces criminels !"
 Turkey.11.b: "La cause de l’armée est juste ! Les dirigeants décadents doivent être renversés !"
 Turkey.12.t: "Coup d’État militaire en Turquie"
 Turkey.12.d: "Tonight, tanks and mechanized units patrol the streets of Istanbul as soldiers station several government buildings. The military has announced the closure of Istanbul's airspace, as fighter jets roam the sky. No noise is to be heard from the streets besides the rumbling of the mechanized engines, as the people sit silently in their homes. A successful military coup in Turkey has ousted the ruling party following its reckless policies, and the military is now consolidating complete control over the country. The military has warned people not to come out to the streets, and they have declared a state of emergency."
 Turkey.12.a: "Intéressant"
 Turkey.14.t: "Échec du coup d’État militaire en Turquie"
 Turkey.14.d: "[TUR.GetLeader] met a large crowd of supporters this morning, as he announced that a military coup had been defeated, made possible only through the might of the Turkish people. [TUR.GetLeader] later announced that several key officers have been identified as prime suspects in this coup attempt, and that everyone else involved is getting investigated. In his speech, [TUR.GetLeader] also mentioned that there will be an \"inspection of all ranks\", and that \"there must be no traitors left\". Though it is unknown what will happen to the officials involved, one thing is for certain, and that is the role of the military in Turkish politics is no more."
 Turkey.14.a: "Intéressant"
 Turkey.15.t: "La Turquie plonge dans la guerre civile"
 Turkey.15.d: "Following the latest coup attempt in Turkey, crowds met the tanks rolling down the streets of Istanbul, and tried to halt their march to a government building. The tanks however, did not stop, resulting in several deaths. In other cities within Turkey, citizens have taken up arms and they have begun opening fire at the soldiers stationed in their cities, in an attempt to halt the coup. The military announced that the coup is justified, and that the leader must be overthrown to save the Turkish nation, and some people in the country support them on this. However for now, the scenes in Turkey resemble that of a civil war, rather than just another military coup."
 Turkey.15.a: "Wow"
 Turkey.77.t: "Unification chypriote !"
 Turkey.77.d: "The Northern Cypriot government has recently consolidated total control of the entirety of Cyprus, both north and south. This comes as they began growing in influence and strength, eventually being able to call for a referendum which let its people unify. Athens has expressed a lot of anger following the move, and they vow to never recognize Northern Cyprus as a legitimate state."
 Turkey.77.a: "Eh bien, c’est quelque chose"
 Turkey.88.t: "Unification chypriote"
 Turkey.88.d: "The Greek government has recently consolidated total control of the entirety of Cyprus, both north and south. This comes as they began growing in influence and strength, eventually being able to call for a referendum which let its people unify. Turkey has expressed a lot of anger following the move, and they vow to never recognize Greece as the legitimate owners of Cyprus."
 Turkey.88.a: "Intéressant"
 Turkey.100.t: "Élections générales"
 Turkey.100.d: "L’heure est venue pour notre peuple de voter pour le prochain parti qui accédera au pouvoir. Qui sera-ce ?"
 Turkey.100.a: "AKP"
 Turkey.100.b: "CHP"
 Turkey.100.c: "Le parti actuel convient parfaitement"
 TurkeyRandomEvents.1.t: "§W[conservatisme_L]§! secoué par un scandale"
 TurkeyRandomEvents.1.desc: "Une vidéo circule sur Internet montrant le leader de §W[conservatisme_L]§!, Deniz Baykal, dans une chambre avec son ancienne secrétaire. À la suite de ce scandale, Baykal a été contraint de démissionner de son poste."
 TurkeyRandomEvents.1.a: "Tant mieux pour nous, je suppose"
 TurkeyRandomEvents.1.b: "C’est une fausse vidéo ! Baykal ne démissionnera pas !"
 TurkeyRandomEvents.1.c: "Nous avons pas le choix"
 TurkeyFocusEvents.1.t: "[FROM.GetName] propose une alliance"
 TurkeyFocusEvents.1.desc: "[FROM.GetName] nous a proposé une alliance contre l’impérialisme occidental. En nous alliant avec [FROM.GetName], nous pourrions même avoir une chance de reprendre le Haut-Karabagh."
 TurkeyFocusEvents.1.a: "Nous sommes plus forts ensemble"
 TurkeyFocusEvents.1.b: "Nous ne voulons pas perturber l’équilibre"
 TurkeyFocusEvents.2.t: "[FROM.GetName] exige un retrait du Haut-Karabagh !"
 TurkeyFocusEvents.2.desc: "[FROM.GetName] exige que nous retirions toutes nos forces du Haut-Karabagh et rendions le contrôle de la région à l’Azerbaïdjan. C’est une demande audacieuse, mais l’agressivité récente de [FROM.GetName] montre qu’ils sont prêts à utiliser la force pour nous chasser. Nous ne tiendrons pas longtemps dans une guerre sur plusieurs fronts."
 TurkeyFocusEvents.2.a: "Nous devons céder"
 TurkeyFocusEvents.2.b: "Nous combattrons jusqu’au dernier homme !"
 TurkeyFocusEvents.3.t: "L’Arménie cède !"
 TurkeyFocusEvents.3.desc: "Armenia has yielded to demands of withdrawing from Nagorno-Karabakh. The area is now once again in control of Azerbaijan"
 TurkeyFocusEvents.3.a: "Super"
 TurkeyFocusEvents.4.t: "L’Arménie s’accroche au Haut-Karabagh"
 TurkeyFocusEvents.4.desc: "Armenia has flatly refused to return Nagorno-Karabakh to Azerbaijan"
 TurkeyFocusEvents.4.a: "Mince"
 TurkeyFocusEvents.4.b: "Alors nous le prendrons par la force"
 TurkeyFocusEvents.5.t: "Révolution en Iran ?"
 TurkeyFocusEvents.5.desc: "We can now successfully spread our revolution in Iran, but how we approach it will change how it will occur drastically."
 TurkeyFocusEvents.5.a: "Une quantité modérée d’armes"
 TurkeyFocusEvents.5.b: "Beaucoup d’armes"
 TurkeyFocusEvents.6.t: "Révolution en Irak ?"
 TurkeyFocusEvents.6.desc: "We can now successfully spread our revolution in Iraq, but how we approach it will change how it will occur drastically."
 TurkeyFocusEvents.6.a: "Une quantité modérée d’armes"
 TurkeyFocusEvents.6.b: "Beaucoup d’armes"
 TurkeyFocusEvents.7.t: "Révolution en Syrie ?"
 TurkeyFocusEvents.7.desc: "We can now successfully spread our revolution in Syria, but how we approach it will change how it will occur drastically."
 TurkeyFocusEvents.7.a: "Une quantité modérée d’armes"
 TurkeyFocusEvents.7.b: "Beaucoup d’armes"
 TurkeyFocusEvents.8.t: "[FROM.GetName] exige Hatay"
 TurkeyFocusEvents.8.desc: "[FROM.GetName] exige que nous leur rendions Hatay. Sans le contrôle de cet État, ils refusent de rejoindre notre alliance."
 TurkeyFocusEvents.8.a: "Je suppose que nous n’avons pas le choix"
 TurkeyFocusEvents.8.b: "La nation turque est indivisible !"
 TurkeyFocusEvents.9.t: "[FROM.GetName] rend Hatay"
 TurkeyFocusEvents.9.desc: "[FROM.GetName] nous a rendu Hatay."
 TurkeyFocusEvents.9.a: "Une belle journée !"
 TurkeyFocusEvents.10.t: "Le problème chypriote"
 TurkeyFocusEvents.10.d: "Le gouvernement turc accentue la pression sur la question chypriote plus que jamais, laissant notre gouvernement sans autre choix que de répondre. Nous avons élaboré un plan pour contrer ces agressions et nous le suivrons en conséquence !"
 TurkeyFocusEvents.10.a: "En avant !"
 TurkeyFocusEvents.19.t: "La Turquie veut établir une zone tampon"
 TurkeyFocusEvents.19.d: "The Turkish government wants to establish a buffer zone between our nations' borders. This means we have to completely demilitarize several of our northern provinces, and withdraw all military presence and let the Turks fight off the Kurds."
 TurkeyFocusEvents.19.a: "C’est pour le mieux..."
 TurkeyFocusEvents.19.b: "Absolument pas !"
 TurkeyFocusEvents.191.t: "La Syrie autorise une zone tampon"
 TurkeyFocusEvents.191.d: "The Syrian government has caved into the pressure, and has allowed us to create a buffer zone between our nations' borders."
 TurkeyFocusEvents.191.a: "Bien"
 TurkeyFocusEvents.192.t: "La Syrie refuse une zone tampon"
 TurkeyFocusEvents.192.d: "Le gouvernement syrien a rejeté notre demande d’établir une zone tampon entre nos États."
 TurkeyFocusEvents.192.a: "Eh bien..."
 TurkeyFocusEvents.20.t: "Que faire des réfugiés ?"
 TurkeyFocusEvents.20.d: "Notre pays accueille actuellement le plus grand nombre de réfugiés, et si nous le voulons, nous pouvons les utiliser comme pions politiques. Notre voisin de l’ouest, la Grèce, semble... peu coopératif... et nous pourrions peut-être utiliser certains de ces réfugiés pour les faire plier à nos demandes."
 TurkeyFocusEvents.20.a: "Non, cela nuirait à notre réputation"
 TurkeyFocusEvents.20.b: "Envoyer un petit nombre"
 TurkeyFocusEvents.20.c: "En envoyer beaucoup"
 TurkeyFocusEvents.21.t: "Un règlement potentiel pour le différend du Karabagh ?"
 TurkeyFocusEvents.21.d: "Le gouvernement turc nous a proposé un accord de compromis potentiel avec les Arméniens. Nous pouvons céder l’exclave de Nakhitchevan aux Arméniens en échange du contrôle de la région du Karabagh."
 TurkeyFocusEvents.21.a: "D’accord, voyons ce que les Arméniens en pensent"
 TurkeyFocusEvents.21.b: "Absolument pas"
 TurkeyFocusEvents.212.t: "L’Azerbaïdjan propose un règlement pour le différend du Karabagh"
 TurkeyFocusEvents.212.d: "[TUR.GetName] a rencontré [AZE.GetName] il y a quelques jours et a proposé un règlement possible pour le différend du Karabagh entre nous et les Azéris. Dans cette offre, nous renoncerons à nos revendications sur le Karabagh et le céderons aux Azéris, en échange de l’unification de Nakhitchevan avec l’Arménie."
 TurkeyFocusEvents.212.a: "Nous ne voyons pas pourquoi pas"
 TurkeyFocusEvents.212.b: "Absolument pas !"
 TurkeyFocusEvents.213.t: "Le différend du Karabagh est réglé !"
 TurkeyFocusEvents.213.d: "De grandes nouvelles nous parviennent de l’ambassade arménienne, les diplomates nous ont informés qu’ils ont accepté les termes de notre règlement concernant la région du Karabagh !"
 TurkeyFocusEvents.213.a: "Merveilleux !"
 TurkeyFocusEvents.214.t: "Le différend du Karabagh continue..."
 TurkeyFocusEvents.214.d: "Unfortunately it seems the Karabakh dispute will continue to harm Azeri and Armenian relations, as both sides have failed to come to an agreement."
 TurkeyFocusEvents.214.a: "Vraiment dommage..."
 TurkeyFocusEvents.69420.t: "À travers les épreuves"
 TurkeyFocusEvents.69420.d: "Our nation has seen it all, wars, conquest, humiliation, glory, and everything in between. The Dawn of the new Millennium is upon us, and the Turkish nation cannot afford to falter, we must adapt and adjust to the new times, otherwise our state may be swept by the winds of history. Our next presidential election is coming up shortly, and the victor will decide if we hold on to Ataturk's dream for a great Turkish Republic."
 TurkeyFocusEvents.69420.a: "Nous ne pouvons pas trébucher !"
 TurkeyFocusEvents.22.t: "Rassemblement pro-AKP à Istanbul !"
 TurkeyFocusEvents.22.d: "Aujourd’hui, un rassemblement pro-AKP s’est tenu à Istanbul pour afficher le soutien au parti. Les participants à cette manifestation appelaient également l’AKP à rompre sa coalition avec Hizmet."
 TurkeyFocusEvents.22.a: "Les gülenistes ne sont pas ravis..."
 TurkeyFocusEvents.23.t: "Gülenist supporters gather at a mosque!"
 TurkeyFocusEvents.23.d: "Gülenist supporters held a gathering at one of the mosques and were calling for the party to distance itself from its coalition with the AKP party."
 TurkeyFocusEvents.23.a: "Les partisans de l’AKP ne sont pas très contents..."
 TurkeyFocusEvents.24.t: "Alliance avec le FP ?"
 TurkeyFocusEvents.24.d: "Le parti FP a été interdit avant notre arrivée au pouvoir, mais il semble que ses membres n’aient pas disparu. La plupart ont rejoint le « SP », un autre groupe islamiste radical. Nous pourrions inviter certains de leurs membres à nous rejoindre pour gouverner la nation turque."
 TurkeyFocusEvents.24.a: "Pas une mauvaise idée..."
 TurkeyFocusEvents.24.b: "Je ne pense pas"
 TurkeyFocusEvents.25.t: "Avec qui conclure des accords ?"
 TurkeyFocusEvents.25.d: "Il est dans notre intérêt de nous ouvrir à des investissements potentiels en Turquie. Nous pouvons inviter des entreprises iraniennes ou saoudiennes à s’installer dans nos provinces orientales pour des activités d’extraction minière ou de forage."
 TurkeyFocusEvents.25.a: "Inviter des compagnies saoudiennes de forage"
 TurkeyFocusEvents.25.b: "Inviter des compagnies iraniennes d’extraction minière"
 TurkeyFocusEvents.26.t: "Notre soutien au Kosovo"
 TurkeyFocusEvents.26.d: "Nous devons prendre des mesures supplémentaires contre le gouvernement qui occupe actuellement le Kosovo. En tant que nation éprise de liberté, il est de notre devoir de propager nos convictions, et pour cela, nous devrons soit sanctionner leurs occupants, soit envoyer une mission militaire au Kosovo."
 TurkeyFocusEvents.26.a: "Envoyer une mission militaire au Kosovo"
 TurkeyFocusEvents.26.b: "Sanctions, sanctions et encore des sanctions !"
 TurkeyFocusEvents.27.t: "Actions contre l’Arabie saoudite"
 TurkeyFocusEvents.27.d: "The Saudi government had designated us as a terrorist organization before our rise to power due to pressure from the AKP party. We cannot let such an action go un-noticed. We will organize a proper response to really show them who's in charge."
 TurkeyFocusEvents.27.a: "Financer les travailleurs pétroliers pour qu’ils fassent grève"
 TurkeyFocusEvents.27.b: "Financer des groupes pro-démocratie pour créer une instabilité politique"
 TurkeyFocusEvents.28.t: "La Turquie veut que nous renvoyions les membres du PKK"
 TurkeyFocusEvents.28.d: "The Turkish government has asked us to send back members of the Kurdish PKK party, who are currently seeking refuge in Sweden. If we want to improve relations with the Turks we can send them.. but things will start looking ugly for us when the EU condemns us."
 TurkeyFocusEvents.28.a: "Les renvoyer"
 TurkeyFocusEvents.28.b: "Il vaut mieux ne pas le faire"
 TurkeyFocusEvents.29.t: "Le gouvernement suédois accepte de renvoyer les membres du PKK !"
 TurkeyFocusEvents.29.d: "Le gouvernement suédois a accepté de déporter les membres du PKK qui cherchent refuge dans leur pays, afin que nous puissions nous en occuper nous-mêmes."
 TurkeyFocusEvents.29.a: "Bien"
 TurkeyFocusEvents.30.t: "Le gouvernement suédois refuse de renvoyer les membres du PKK !"
 TurkeyFocusEvents.30.d: "The Swedish Government has refused to send back the PKK members they are currently harboring. This will not go un-noticed by us."
 TurkeyFocusEvents.30.a: "Ils le regretteront !"
 TurkeyFocusEvents.31.t: "Attiser les flammes en Iran"
 TurkeyFocusEvents.31.d: "Today we have at our disposal.. A lot of guns. And we can send a couple of these weapons to the Rebels in Khuzestan, so we can cripple Iran's oil industry. But the question is, how much support do we really want to give these guys, and how much damage can we make them do? "
 TurkeyFocusEvents.31.a: "Pas trop"
 TurkeyFocusEvents.31.b: "Aller à fond"
 TurkeyFocusEvents.32.t: "La Turquie veut établir des relations"
 TurkeyFocusEvents.32.d: "The Turkish government is willing to establish relations, and is asking us not to be hostile towards the PKK group, which is quite the request."
 TurkeyFocusEvents.32.a: "D’accord..."
 TurkeyFocusEvents.32.b: "Non, c’est trop risqué !"
 TurkeyFocusEvents.321.t: "Les peshmergas maintiennent leur hostilité"
 TurkeyFocusEvents.321.d: "The Peshmerga would rather maintain their hostility towards us, rather than fix them! We will not forget this, and they will regret it soon."
 TurkeyFocusEvents.321.a: "Fous !"
 TurkeyFocusEvents.322.t: "Les peshmergas coopèrent !"
 TurkeyFocusEvents.322.d: "Étonnamment, les peshmergas ont décidé de coopérer avec nous et ont établi des liens formels, bien qu’ils soient une région autonome."
 TurkeyFocusEvents.322.a: "Très bien"
 TurkeyFocusEvents.33.t: "Les peshmergas..."
 TurkeyFocusEvents.33.d: "Les peshmergas sont un autre groupe de Kurdes, situés juste en dessous de notre Kurdistan anatolien. Ils représentent une menace aussi importante que le PKK, mais ce n’est pas notre priorité pour le moment, car nous travaillons avec le PKK pour trouver une solution. Les peshmergas seront une menace majeure pour nous, et nous devrons nous en occuper avant qu’il ne soit trop tard."
 TurkeyFocusEvents.33.a: "Nous mènerons une opération"
 TurkeyFocusEvents.33.b: "We'll do an operation, with the Iraqis"
 TurkeyFocusEvents.331.t: "Turkey offers joint operation against Peshmerga"
 TurkeyFocusEvents.331.d: "Le gouvernement turc nous demande de nous joindre à eux pour une opération visant à neutraliser les peshmergas dans le nord de notre pays."
 TurkeyFocusEvents.331.a: "Absolument !"
 TurkeyFocusEvents.331.b: "Absolutely not!"
 TurkeyFocusEvents.332.t: "L’Irak refuse de participer à notre opération"
 TurkeyFocusEvents.332.d: "L’Irak n’est pas disposé à nous aider à combattre les peshmergas, ce qui signifie que nous devrons le faire seuls."
 TurkeyFocusEvents.332.a: "Eh bien..."
 TurkeyFocusEvents.34.t: "L’ère numérique de la Turquie"
 TurkeyFocusEvents.34.d: "Le World Wide Web s’étend de plus en plus, jour après jour. Cela signifie que nous devons suivre cette expansion, car le monde devient de plus en plus connecté. Nos citoyens ne sont pas différents de ceux des autres pays européens, et nous devons le prouver à notre peuple en développant leur infrastructure Internet. La question est : jusqu’à quel point ?"
 TurkeyFocusEvents.34.a: "L’étendre dans quelques zones seulement"
 TurkeyFocusEvents.34.b: "L’étendre autant que possible"
 TurkeyFocusEvents.35.t: "La Turquie nous invite à l’Union turco-syrienne"
 TurkeyFocusEvents.35.d: "Le nouveau gouvernement turc, dirigé par une majorité chiite, nous a demandé de les rejoindre dans une Union turco-syrienne, car nos populations partagent de nombreuses similitudes. Récemment, ils ont décidé de nous rendre Hatay, ce qui était un geste important, mais maintenant ils veulent que nous fassions partie d’eux ?"
 TurkeyFocusEvents.35.a: "Oui, nous rejoindrons"
 TurkeyFocusEvents.35.b: "Non"
 TurkeyFocusEvents.351.t: "Les Syriens acceptent de nous rejoindre"
 TurkeyFocusEvents.351.d: "Le gouvernement syrien a reconnu les similitudes entre nos peuples et a accepté de nous rejoindre dans l’Union turco-syrienne !"
 TurkeyFocusEvents.351.a: "Enfin..."
 TurkeyFocusEvents.352.t: "La Syrie rejette notre proposition !"
 TurkeyFocusEvents.352.d: "The Syrian government has foolishly rejected our proposal to join a union together. They clearly do not know what is good for Shias in the region!"
 TurkeyFocusEvents.352.a: "Maudit soit-il ! À la guerre !"
 TurkeyFocusEvents.36.t: "Les mafias galloise et écossaise forment leurs propres États !"
 TurkeyFocusEvents.36.d: "It appears the Anatolian Syndicate has funded and trained the Scottish and Welsh mafias just right under our nose. We failed to catch on and stop them in a timely manner, and therefore we are now going to have to make a decision."
 TurkeyFocusEvents.36.a: "Notre Royaume est UNI !"
 TurkeyFocusEvents.36.b: "Ça n’en vaut pas la peine"
 TurkeyFocusEvents.37.t: "Le Syndicat anatolien nous met en garde contre l’Australie"
 TurkeyFocusEvents.37.d: "The Anatolian Syndicate are warning us about an incoming attack from the Australians. Obviously this could all be a lie, considering that they are a Mafia state. But there is also a chance they aren't lying."
 TurkeyFocusEvents.37.a: "Ils ne peuvent pas mentir !"
 TurkeyFocusEvents.37.b: "Non... Ils mentent évidemment"
 TurkeyFocusEvents.38.t: "La Turquie veut que nous l’aidions à combattre Israël"
 TurkeyFocusEvents.38.d: "Turkey is requesting that our forces, along with our allies, help take down the Israelis. This is a very surprising move, but not unexpected after Islamists took over Turkey in the latest election."
 TurkeyFocusEvents.38.a: "Un jour que nous attendions..."
 TurkeyFocusEvents.38.b: "Le moment n’est pas venu"
 TurkeyFocusEvents.39.t: "L’Iran accepte"
 TurkeyFocusEvents.39.d: "L’Iran a accepté d’aider nos forces à combattre Israël. Ils feront également appel à leurs alliés, ce qui sera d’une grande aide pour nos forces."
 TurkeyFocusEvents.39.a: "Bien"
 TurkeyFocusEvents.40.t: "L’Iran refuse"
 TurkeyFocusEvents.40.d: "Dans un retournement choquant, l’Iran a décidé de ne pas nous aider à combattre Israël. Cela laisse nos diplomates perplexes, car l’Iran appelle à la chute des Israéliens depuis des décennies..."
 TurkeyFocusEvents.40.a: "D'accord"
 TurkeyFocusEvents.381.t: "L’Iran combat Israël"
 TurkeyFocusEvents.381.d: "Iran is fighting Israel, and they want to use our land to attack, and since they are our ally, it is best that we cooperate to take down the Israeli menace."
 TurkeyFocusEvents.381.a: "Nous attendions cela..."
 TurkeyFocusEvents.381.b: "Non"
 TurkeyFocusEvents.81.t: "La Turquie nous invite à l’OTM"
 TurkeyFocusEvents.81.desc: "L’OTM, ou Organisation du Traité Méditerranéen, a été récemment fondée par la Turquie. Ils nous invitent à rejoindre leur alliance et à devenir membre à part entière. Si nous le faisons, notre sécurité sera garantie par tous les autres membres, car il s’agit d’un pacte défensif."
 TurkeyFocusEvents.81.a: "Oui, mais seulement s’ils rendent Hatay"
 TurkeyFocusEvents.81.b: "Non"
 TurkeyFocusEvents.41.t: "La Turquie nous invite à l’OTM"
 TurkeyFocusEvents.41.d: "L’OTM, ou Organisation du Traité Méditerranéen, a été récemment fondée par la Turquie. Ils nous invitent à rejoindre leur alliance et à devenir membre à part entière. Si nous le faisons, notre sécurité sera garantie par tous les autres membres, car il s’agit d’un pacte défensif."
 TurkeyFocusEvents.41.a: "Nous devrions rejoindre"
 TurkeyFocusEvents.41.b: "Non"
 TurkeyFocusEvents.411.t: "L’Irak n’est pas intéressé"
 TurkeyFocusEvents.411.d: "Il semble que l’Irak ne soit pas intéressé à rejoindre l’OTM, notre alliance."
 TurkeyFocusEvents.411.a: "D'accord"
 TurkeyFocusEvents.42.t: "La Turquie nous invite à l’OTM"
 TurkeyFocusEvents.42.d: "L’OTM, ou Organisation du Traité Méditerranéen, a été récemment fondée par la Turquie. Ils nous invitent à rejoindre leur alliance et à devenir membre à part entière. Si nous le faisons, notre sécurité sera garantie par tous les autres membres, car il s’agit d’un pacte défensif."
 TurkeyFocusEvents.42.a: "Nous devrions rejoindre"
 TurkeyFocusEvents.42.b: "Non"
 TurkeyFocusEvents.421.t: "L’Égypte n’est pas intéressée"
 TurkeyFocusEvents.421.d: "Egypt has turned down our invitation to the MTO."
 TurkeyFocusEvents.421.a: "D'accord"
 TurkeyFocusEvents.43.t: "La Turquie nous a invités à la CBI"
 TurkeyFocusEvents.43.d: "Le gouvernement turc a récemment fondé la CBI, ou Confédération pour le Bien-être Islamique. L’objectif principal est d’accroître la coopération entre les nations islamiques et d’améliorer le bien-être des musulmans dans la région."
 TurkeyFocusEvents.43.a: "Inscrivez-moi"
 TurkeyFocusEvents.43.b: "Non"
 TurkeyFocusEvents.44.t: "La CBI investit dans notre infrastructure !"
 TurkeyFocusEvents.44.d: "The CIW is investing in our nation's abilities to build proper infrastructure and facilities for our people."
 TurkeyFocusEvents.44.a: "Super"
 TurkeyFocusEvents.45.t: "La CBI distribue des fournitures d’urgence !"
 TurkeyFocusEvents.45.d: "La CBI a distribué des fournitures d’urgence pour faire face à toute catastrophe imminente ou en cours au sein de l’organisation."
 TurkeyFocusEvents.45.a: "Super"
 TurkeyFocusEvents.46.t: "La CBI investit dans notre éducation !"
 TurkeyFocusEvents.46.d: "The CIW has invested in our nation's education sector, making it easier for people to go to school."
 TurkeyFocusEvents.46.a: "Super"
 TurkeyFocusEvents.47.t: "La CBI investit dans notre santé !"
 TurkeyFocusEvents.47.d: "The CIW is now investing in our nation's healthcare system, providing medical supplies and facilities to more people."
 TurkeyFocusEvents.47.a: "Super"
 TurkeyFocusEvents.48.t: "La CBI investit dans nos industries !"
 TurkeyFocusEvents.48.d: "The CIW is now investing in our nation's industrial sector, which lets our factories provide more goods."
 TurkeyFocusEvents.48.a: "Super"
 TurkeyFocusEvents.49.t: "[FROM.GetName] quitte la CBI"
 TurkeyFocusEvents.49.d: "[FROM.GetName] a décidé qu’il était préférable pour leur nation de se retirer de la CBI."
 TurkeyFocusEvents.49.a: "Eh bien, ils vont rater quelque chose"
 TurkeyFocusEvents.50.t: "La Turquie veut établir des bases militaires"
 TurkeyFocusEvents.50.d: "Le gouvernement turc demande que nous leur permettions de stationner leurs troupes dans notre nation."
 TurkeyFocusEvents.50.a: "Pourquoi pas"
 TurkeyFocusEvents.50.b: "Non"
 TurkeyFocusEvents.501.t: "Le Qatar rejette notre demande"
 TurkeyFocusEvents.501.d: "Le Qatar ne permet pas à nos troupes de stationner sur son territoire."
 TurkeyFocusEvents.501.a: "C'est malheureux"
 TurkeyFocusEvents.53.t: "Décès d’Osman V"
 TurkeyFocusEvents.53.d: "Une terrible nouvelle s’est répandue à Constantinople aujourd’hui, alors que le peuple apprend le décès d’Osman V. Bien que sa mort apporte une grande tristesse, Bayezid III veillera à perpétuer son héritage."
 TurkeyFocusEvents.53.a: "Le trône change"
 TurkeyFocusEvents.54.t: "Décès de Bayezid III"
 TurkeyFocusEvents.54.d: "Nous avons malheureusement appris aujourd'hui le décès de Beyezid III. Les gens pleurent sa mort dans les rues et la tristesse a envahi la nation. Cependant, tout espoir n'est pas perdu, puisque Dundar Ier sera couronné peu de temps après la fin de la période de deuil national, marquant le début de son règne."
 TurkeyFocusEvents.54.a: "Le trône change encore..."
 TurkeyFocusEvents.55.t: "Le Califat anatolien exige le Hedjaz"
 TurkeyFocusEvents.55.d: "The Anatolian Caliphate has come and demanded that we give them Hejaz, arguably our most important state. It would be incredibly foolish of us to give this state away, and quite frankly, we don't even know what they will do if we don't."
 TurkeyFocusEvents.55.a: "Quelle sorte de demande est-ce ?"
 TurkeyFocusEvents.55.b: "Eh bien... Nous voulons éviter un conflit, non ?"
 TurkeyFocusEvents.56.t: "[SAU.GetName] cède"
 TurkeyFocusEvents.56.d: "[SAU.GetName] a cédé à nos exigences. Nous recevrons le Hedjaz, et en échange, nous ne les attaquerons pas."
 TurkeyFocusEvents.56.a: "Bien"
 TurkeyFocusEvents.57.t: "[SAU.GetName] refuse nos demandes !"
 TurkeyFocusEvents.57.d: "[SAU.GetName] a foolishly refusé nos demandes, et à cause de cela, nous n’avons pas d’autre choix !"
 TurkeyFocusEvents.57.a: "Ils l’ont cherché"
 TurkeyFocusEvents.58.t: "Gérer Abdul Rahman Mustafa"
 TurkeyFocusEvents.58.d: "Iraq is currently at its most vulnerable, as the Americans are actively engaged in a conflict with them, crippling their security. This gives us a great opportunity to move in, and take out the governor of Kirkuk, a major city in Iraqi-Kurdistan. If we are successful, we will be able to seriously damage Kurdish morale, and subsequently the PKK's morale."
 TurkeyFocusEvents.58.a: "Envoyer quelques agents déguisés en civils"
 TurkeyFocusEvents.58.b: "Envoyer des agents bien entraînés et préparer un plan d’évasion"
 TurkeyFocusEvents.58.c: "Let's just forget about this plan entirely."
 TurkeyFocusEvents.59.t: "Abdul Mustafa tué"
 TurkeyFocusEvents.59.d: "Nos agents ont réussi à assassiner Abdul Rahman Mustafa, le gouverneur de Kirkouk."
 TurkeyFocusEvents.59.a: "Bien"
 TurkeyFocusEvents.60.t: "Les Américains capturent nos agents !"
 TurkeyFocusEvents.60.d: "Earlier today, soldiers from America's 173rd Airborne Brigade kicked down the doors of our agents' safehouse in the Kurdish city of Sulaymaniyah, and took them into custody. This has been dubbed as the \"Hood Event\" by the media, and our relations with the Americans have been negatively affected."
 TurkeyFocusEvents.60.a: "Mince"
 Turkish_mafia.1.t: "La mafia fait des vagues !"
 Turkish_mafia.1.d: "The Mafia has caused a scene in one of our bigger cities, which resulted in the death of a few individuals. Though it is currently unknown who committed this crime, our police force is very eager to go and hunt them down, despite the risks involved."
 Turkish_mafia.1.a: "Il vaut mieux ne pas causer plus de problèmes..."
 Turkish_mafia.1.b: "Je veux une enquête complète, maintenant !"
 Turkish_mafia.1.c: "Allouez toutes les ressources possibles"
 Turkish_mafia.11.t: "Recherche policière infructueuse"
 Turkish_mafia.11.d: "Our police force was unsuccessful in their search for the mobsters responsible for the crime committed a few days ago. This has made a few mobsters believe they are un-touchable, therefore increasing the Mafia's influence in the country."
 Turkish_mafia.11.a: "Quelle incompétence..."
 Turkish_mafia.12.t: "La police appréhende des suspects"
 Turkish_mafia.12.d: "The locals let out a sigh of relief today, as the police chief has recently announced the apprehension of several criminals and suspects, regarding a series of murders committed a few days ago. Several individuals affiliated with the Mafias are now aware of the effectiveness in our police force, and it'll make others think twice before joining the Mafia."
 Turkish_mafia.12.a: "Très bien"
 Turkish_mafia.2.t: "Des détectives découvrent une planque de la mafia"
 Turkish_mafia.2.d: "Un détective dans l’une des villes rurales a signalé avoir trouvé une potentielle planque de la mafia. La police tente rapidement d’organiser une réponse, car ils ignorent ce qu’ils trouveront dans cette planque, ou même s’il s’agit bien d’une planque mafieuse. Il est très probable que la mafia soit liée à cet endroit, mais cela comporte toujours des risques."
 Turkish_mafia.2.a: "Certaines choses sont mieux laissées tranquilles..."
 Turkish_mafia.2.b: "What do you mean they're scrambling a response? Prepare one, and do it quickly!"
 Turkish_mafia.2.c: "Allouez toutes les ressources possibles"
 Turkish_mafia.21.t: "La police subit des pertes !"
 Turkish_mafia.21.d: "It appears that the hideout was an ambush, and there were several gunmen ready to start shooting at our officers. Unfortunately, due to a lack of weapons and sufficient backup, several officers were killed and many more were injured."
 Turkish_mafia.21.a: "Mince"
 Turkish_mafia.22.t: "Planche nettoyée sans encombre"
 Turkish_mafia.22.d: "Tout s’est déroulé parfaitement lors de notre dernière opération. La planque a été rapidement nettoyée par nos unités, et plusieurs suspects pris par surprise ont été appréhendés par nos officiers."
 Turkish_mafia.22.a: "Super"
 Turkish_mafia.3.t: "Découverte d’un grand stock d’armes"
 Turkish_mafia.3.d: "Lors d’une fouille en cours, la police a trouvé un important stock d’armes entreposé dans un entrepôt. Plusieurs membres de la communauté exhortent la police à retracer l’origine de ce stock et à arrêter les personnes impliquées."
 Turkish_mafia.3.a: "Et si on prenait simplement les armes ?"
 Turkish_mafia.3.b: "Good idea, start a search immediately!"
 Turkish_mafia.3.c: "Allouez toutes les ressources possibles"
 Turkish_mafia.31.t: "La police gâche l’enquête !"
 Turkish_mafia.31.d: "Due to the lack of coordination, and high levels of incompetence, our police force did not find the criminals that had left their weapons cache. In fact, during the investigation our police force lost a considerable amount of their own weapons! How could this happen you may ask? Well, it appeared that our officers had gone in with a supply van filled with weapons, and someone hijacked the van and drove off!"
 Turkish_mafia.31.a: "Sérieusement ?"
 Turkish_mafia.32.t: "La police localise des suspects"
 Turkish_mafia.32.d: "It appeared that there was an underground weapon trade happening in one of the more urbanized cities. Luckily, we were able to catch these criminals before any major damage was done."
 Turkish_mafia.32.a: "C’est la norme"
 Turkish_mafia.4.t: "La police saisit une cargaison de drogue"
 Turkish_mafia.4.d: "Un groupe d’officiers est tombé sur un conteneur de cargaison suspect, et lorsqu’ils l’ont ouvert, ils ont été stupéfaits. De grandes quantités de drogues illégales ont été introduites dans le pays par un réseau inconnu, et les habitants sont impatients d’attraper les suspects."
 Turkish_mafia.4.a: "Eh bien... elles étaient sûrement destinées à un usage médical, non ?"
 Turkish_mafia.4.b: "I want an investigation immediately!"
 Turkish_mafia.4.c: "Allouez toutes les ressources possibles"
 Turkish_mafia.41.t: "Suspects arrêtés"
 Turkish_mafia.41.d: "Nous avons trouvé plusieurs individus liés au grand conteneur de drogue, et ils sont maintenant interrogés par la police. Beaucoup dans la communauté sont heureux de savoir que les drogues illégales ne viendront pas plomber leur communauté."
 Turkish_mafia.41.a: "Nous avons encore beaucoup à faire ! Au travail !"
 Turkish_mafia.42.t: "Investigation results in nothing"
 Turkish_mafia.42.d: "After a lengthy investigation, our officers were not able to connect anyone to the drug container. This is a major loss on our end, as now illegal drugs are still being smuggled into the country, and we have no leads!"
 Turkish_mafia.42.a: "Inacceptable"
 Turkish_mafia.5.t: "La mafia assassine un haut fonctionnaire"
 Turkish_mafia.5.d: "Tragedy has struck, as the Turkish mafia has assassinated a high ranking official. This will make our party's job much harder than it has to, and our opposition are most likely overcome with excitement."
 Turkish_mafia.5.a: "Mince"
 Turkish_mafia.6.t: "Braquage mafieux"
 Turkish_mafia.6.d: "La mafia a réussi un braquage dans l’une des banques de notre pays. Ils ont volé beaucoup d’argent, ce qui a finalement nui à notre économie et à notre peuple."
 Turkish_mafia.6.a: "Inacceptable"
 Turkish_mafia.7.t: "Une explosion secoue un centre commercial"
 Turkish_mafia.7.d: "Fingers are being pointed at the Mafia today, as the police suspect they were behind a bombing attack at a large commercial center. Their goal is unknown, but one thing is for certain, they are causing a lot of problems for the government."
 Turkish_mafia.7.a: "Mais pourquoi ?"
 Turkish_mafia.8.t: "La police s’engage dans une confrontation avec la mafia"
 Turkish_mafia.8.d: "Ce matin, il y a eu une très longue confrontation entre notre police et la mafia. Plusieurs officiers de police ont été blessés, et certains ont même été tués."
 Turkish_mafia.8.a: "Terrible !"
 Turkish_mafia.9.t: "L’ascension de la mafia"
 Turkish_mafia.9.d: "The Mafia has been ramping up its attacks in recent times, and it has quite frankly stressed out our security forces. With people joining the Mafia, and a life of crime now more than ever, it makes you question the validity of our state. A lot of people are demanding that our government step down, but we have a duty to serve and protect our people."
 Turkish_mafia.9.a: "Le combat ne s’arrêtera jamais !"
 Turkish_mafia.9.b: "Peut-être ont-ils raison..."
 Turkish_parties.1.t: "Les partis libéraux gagnent du terrain"
 Turkish_parties.1.d: "It appears that our people's ideology is becoming more and more liberal, as the liberal parties have begun gaining some more following than before. As a result of this, people are pushing for more liberal policies in our country."
 Turkish_parties.1.a: "D'accord"
 Turkish_parties.2.t: "Les partis conservateurs gagnent du terrain"
 Turkish_parties.2.d: "It appears that our people's ideology is becoming more and more conservative, as the conservative parties have begun gaining some more following than before. As a result of this, people are pushing for more conservative policies in our country."
 Turkish_parties.2.a: "D'accord"
 Turkish_parties.3.t: "Les partis de gauche gagnent du terrain"
 Turkish_parties.3.d: "It appears that our people's ideology is becoming more and more leftist, as the left-wing parties have begun gaining some more following than before. As a result of this, people are pushing for more socialist policies in our country."
 Turkish_parties.3.a: "D'accord"
 Turkish_parties.4.t: "Les partis de droite gagnent du terrain"
 Turkish_parties.4.d: "It appears that our people's ideology is becoming more and more nationalist, as the right-wing parties have begun gaining some more following than before. As a result of this, people are pushing for more nationalist policies in our country."
 Turkish_parties.4.a: "D'accord"
 Turkish_parties.9.t: "Changement radical en politique"
 Turkish_parties.9.d: "There has been a drastic, and radical shift in our nation's government, leading to a complete reorganization of our political structure."
 Turkish_parties.9.a: "D'accord"
 Turkish_parties.10.t: "Seul l’IA devrait voir ceci"
 Turkish_parties.10.d: "Réservé à l’IA"
 Turkish_parties.10.a: "Si vous voyez ceci, veuillez nous le faire savoir"
 TUR_bulent_ecevit_desc: "Bülent Ecevit is a senior politician who has been active in the Turkish political scene since the 1950s. Rising to a leadership in the CHP, he eventually succeeded Ismet Inönü as CHP chairman in 1972 and became Prime Minister in 1974. His government ordered the invasion of Cyprus in 1974, where he gained the nickname 'Conqueror of Cyprus' ('Kıbrıs Fatihi'). Following the military coup of 1980, Ecevit was incarcerated and banned from politics, eventually rejoining the scene in 1987 by taking the chairman position of DSP from his wife Rahsan. Finally in 1999, he regained the position of Prime Minister of Turkey, after his party's popularity soared with the capture of PKK leader Abdullah Öcalan.\n\nEcevit is also an adamant poet and writer, having written many books on both subjects, and translating many poems into Turkish.\n\nEcevit never finished his university degree, making it impossible for him to ever run for President."
 TUR_zeki_sezer_desc: "Zeki Sezer est un ancien ministre d’État du gouvernement d’Ecevit."
 TUR_husamettin_ozkan_desc: "Hüsamettin Özkan était le vice-Premier ministre dans le gouvernement de Bülent Ecevit, après avoir servi comme ministre d’État auparavant. Özkan est d’origine circassienne, et son frère Necdet a été maire de l’un des districts d’Istanbul."
 TUR_fethullah_gulen_desc: "Fethullah Gülen est le leader du mouvement Hizmet, ou mouvement güleniste. Autrefois imam local en Turquie, Gülen est devenu un érudit influent. Son organisation s’étend à travers le monde et fonctionne de manière très décentralisée. Gülen lui-même ne se considère pas vraiment comme un leader, et selon ses propres mots, il a simplement « exprimé ce que je crois. Parce que cela avait du sens, les gens l’ont adopté d’eux-mêmes »."
 TUR_deniz_baykal_desc: "Deniz Baykal started his political career in 1973, when he was elected to the Turkish Parliament as the youngest MP under the party CHP. The CHP originally noticed him as Baykal wrote his docent thesis on the subject of why the CHP had lost the 1965 election. After the 1980 military coup, Baykal was shortly imprisoned and banned from politics, but in 1987 he was allowed to re-enter, and he joined the Social Democratic People's Party.\n\nIn 1992, the law prohibiting the refounding of previously dismembered parties was overturned and Baykal (along with many other ex-CHP politicians), refounded the CHP.\n\nOften described as being the 'Old Guard' of CHP, many have blamed Baykal for the lack of success of CHP, as many of his policies do not match contemporary Turkey."
 TUR_Kemal_Kilicdaroglu_desc: "Kemal Kılıçdaroğlu was elected as the leader of CHP after a scandal forced Deniz Baykal to resign his position. Kılıçdaroğlu has actively challenged the AKP, and has actively vowed to reveal the corruption of the party's politicians. Kılıçdaroğlu has also aimed to move CHP back to its leftist oriented roots. However, Kılıçdaroğlu's actions do not always match his words, as he has been seen waving a Grey Wolves flag and he supports the deportation of all Syrian refugees."
 TUR_Ufuk_Uras_desc: "Ufuk Uras is an economist and a graduate of the Istanbul University. Uras has been the chairman of ÖDP since 1996."
 TUR_abdullah_levent_tuzel_desc: "Abdullah Tüzel est l’un des membres fondateurs de l’EMEP en 1996, et il dirige le parti depuis lors. Avant la politique, Tüzel travaillait comme avocat indépendant. Il a également été membre du conseil exécutif de la Fondation des droits humains d’Istanbul et président de l’Association des avocats modernes d’Istanbul."
 TUR_dogu_perincek_desc: "Doğu Perinçek est le fondateur du Parti des travailleurs IP et avocat de profession. Perinçek est connu pour ses positions anti-occidentales et ses idées kémalistes radicales combinées au maoïsme. Il nie fermement l’existence du génocide arménien et est membre du Comité Talat Pacha, une organisation nommée d’après le principal responsable présumé du génocide.\n\nPerinçek souhaite créer une force de contre-pouvoir contre l’impérialisme américain au Moyen-Orient."
 TUR_Necmeddin_Erbakan_desc: "Necmettin Erbakan is the founder of the Millî Görüş (National Vision) religious-political movement, which creates the foundation of his party. Erbakan is a long time leader of multiple Islamist political parties in Turkey, most of which have been banned shortly after their founding. Erbakan even served shortly as the Prime Minister, before being forced to step down by the military.\n\nErbakan's main policy is conservative Islam, and he wishes to shift focus from focusing on European countries to more cooperation with other Muslim nations, even going as far as creating an organization to rival NATO in the Middle East and a common currency called the dinar.\n\nIn early 2000s, Erbakan spent a little over 2 years in prison after being sentenced for embezzlement. The so called 'Lost Trillion Case' arose when his previous party, the Welfare Party, forged documents claiming that 1 trillion in Turkish lira of state sponsored party funds had been used for party activities in order to avoid having to return the funds after the party was banned in 1997."
 anti_imperialist_vanguard_faction: "Avant-garde anti-impérialiste"
 TUR_northern_cyprus_annexed: "Annexion de Chypre du Nord"
 TUR_afrin: "Annoncer des opérations anti-kurdes en Syrie"
 TUR_afrin_desc: "Kurdish terrorists go by many names, but that does not mean they do not share the same ideals as each other. The PKK has always been a threat to Turkey and it will remain a threat until it along with its allies in the YPG, PYD, SDF, et cetera, are destroyed. It starts with Afrin, gather the troops."
 TUR_afrin2: "Lancer l’opération Rameau d’Olivier"
 TUR_afrin2_desc: "If the Kurds cannot learn to accept their failure and defeat, they will continue to attack Turkey and its people, and this is where we must draw the line. Olive Branch will put an end to Kurdish terror attacks originating from the YPG held territory of Afrin. The operation is determined to root out and destroy Kurdish terrorists without collateral damage, we must proceed carefully."
 TUR_afrin_d: "Les forces turques menacent Afrin"
 TUR_afrin_d_desc: "L’assaut turc contre le peuple kurde se poursuit. La menace d’une invasion d’Afrin est réelle, car le président turc [their_country.GetLeader], sans surprise, nous a qualifiés de terroristes alignés sur le PKK et a menacé de nous écraser avant que nous puissions attaquer le territoire turc dans une prétendue attaque terroriste absurde. Ce n’est pas notre façon de faire, mais nous devons nous préparer immédiatement à une attaque !"
 TUR_afrin_d2: "Les forces turques continuent d’avancer"
 TUR_afrin_d2_desc: "They call it \"Operation Olive Branch\", funny how the saying goes that the olive branch is an offer of peace. The Turks know not the meaning of peace, and their campaign of Kurdish oppression continues against the wrong opponent. Alas, if they want to continue this fight, we shall continue to defend ourselves."
 TUR_counter_terrorism_mil: "Opérations antiterroristes - Branche militaire"
 strenghten_outposts_1: "Renforcer les avant-postes"
 strenghten_outposts_1_desc: "Our outposts in the south-eastern part of our country were built up to stop smuggling from and to Northern Iraq around 1960s. Now, facing terror attacks, they are either too old or at the wrong positions and highly vulnerable to asymmetrical attacks. We need to come up with a solution to this, it may cost a lot of money but will make it up to us with the lives saved. And opposition will surely try and discredit this reform as they always do, saying it will waste our money for no benefit, so there is little room for failure."
 strenghten_outposts_2: "Lancer la construction d’avant-postes renforcés"
 strenghten_outposts_2_desc: "Les premiers de nos nouveaux avant-postes devraient prouver leur efficacité rapidement, pour des raisons politiques. Peut-être les construire sur des points élevés, avec vue panoramique, et de préférence autour de passages étroits utilisés par les terroristes pour s’infiltrer."
 strenghten_outposts_3: "Priorité aux positions critiques"
 strenghten_outposts_3_desc: "Certains de nos avant-postes, comme Aktütün Karakolu, sont tristement célèbres pour être régulièrement attaqués en raison de leur position stratégique. Nous devrions renforcer ces positions faibles en priorité, obligeant les terroristes à revoir leurs plans."
 strenghten_outposts_4: "Améliorations supplémentaires"
 strenghten_outposts_4_desc: "Les nouveaux avant-postes se révèlent efficaces pour repousser les attaques terroristes ou éviter d’être attaqués. Maintenant, les terroristes évitent les avant-postes renforcés et se concentrent sur les anciens, plus faibles. Peut-être devrions-nous démanteler ceux qui sont inutiles et construire de nouveaux avant-postes aux endroits nécessaires."
 strenghten_outposts_5: "Génie stratégique"
 strenghten_outposts_5_desc: "Attacks on our outposts have been fairly reduced, maybe we can think about building new dams that will hinder terrorists' routes with their lakes, and use these dams as fortified bridges"
 strenghten_outposts_6: "Le succès aime la préparation"
 strenghten_outposts_6_desc: "Nearly every outpost of ours has either been rebuilt or left and razed. Only some final stages needed to polish up some sharp edges and we are done."
 doing_counter_terror_op_mil: "Mener une autre opération militaire"
 doing_ext_sec: "Opération transfrontalière en cours"
 doing_int_sec: "Opération de sécurité intérieure en cours"
 airstrike_prepare: "Préparer des frappes aériennes"
 airstrike_thingy: "Mener des frappes aériennes"
 add_power_to_pkk: "Ajouter de la puissance au PKK (pour débogage)"
 add_power_to_pkk_desc: "Ajoute de la puissance au PKK"
 internal_preparation_1: "Préparations normales pour opérations internes"
 internal_preparation_1_desc: "The fastest and cheapest one. If we pick this, the actual offensive will have a success rate of 40%. In terms of cost efficiency, this one is better.\n\n§RWe can't make several preparations for a single operation type!§!"
 internal_preparation_2: "Préparations médiocres pour opérations internes"
 internal_preparation_2_desc: "Normal one. If we pick this, the actual offensive will have a success rate of 50%.\n\n§RWe can't make several preparations for a single operation type!§!"
 internal_preparation_3: "Bonnes préparations pour opérations internes"
 internal_preparation_3_desc: "The slowest and most expensive one. If we pick this, the actual offensive will have a success rate of 60%. Not cost-efficient but with more guaranteed results.\n\n§RWe can't make several preparations for a single operation type!§!"
 internal_security: "Opérations internes"
 internal_security_desc: "Eastern part of our country has a rough terrain, it holds many deserted villages, castle-like natural valleys filled with caves, narrow passages around mountains where no one lives. These features are so useful for insurgencies and PKK uses it. We need to constantly attack and raze their makeshift bases to reduce their power and hinder their recruitment efforts.\n\nWe can't make cross-border operations and internal operations at the same time."
 external_preparation_1: "Préparations normales pour opérations externes"
 external_preparation_1_desc: "La plus rapide et la moins coûteuse. Si nous choisissons cette option, l’offensive aura un taux de réussite de 40 %. En termes d’efficacité coût, c’est la meilleure.\n\n§RNous ne pouvons pas faire plusieurs préparations pour un même type d’opération !§!"
 external_preparation_2: "Préparations médiocres pour opérations externes"
 external_preparation_2_desc: "Option standard. Si nous choisissons cette option, l’offensive aura un taux de réussite de 50 %.\n\n§RNous ne pouvons pas faire plusieurs préparations pour un même type d’opération !§!"
 external_preparation_3: "Bonnes préparations pour opérations externes"
 external_preparation_3_desc: "La plus lente et la plus coûteuse. Si nous choisissons cette option, l’offensive aura un taux de réussite de 60 %. Pas rentable, mais avec des résultats plus garantis.\n\n§RNous ne pouvons pas faire plusieurs préparations pour un même type d’opération !§!"
 external_security: "Opérations transfrontalières"
 external_security_desc: "Le PKK n’existe pas seulement à l’intérieur de nos frontières, une bonne partie de ses membres a des bases dans le nord de l’Irak, pour profiter du même terrain accidenté, être quelque peu à l’abri de notre puissance militaire, contrôler la contrebande et recruter. Nous devons attaquer ces positions également, bien que nous puissions faire face à des accusations de puissances étrangères.\n\nNous ne pouvons pas mener des opérations transfrontalières et internes en même temps."
 prepping_ext: "Planification d’une opération transfrontalière en cours"
 prepping_int: "Planification d’un balayage interne en cours"
 collapse_mil_branch: "Masquer les décisions d’opérations militaires"
 expand_mil_branch: "Afficher les décisions d’opérations militaires"
 collapse_civ_branch: "Masquer les décisions de réformes civiles"
 expand_civ_branch: "Afficher les décisions de réformes civiles"
 TUR_counter_terrorism_civ: "Opérations antiterroristes - Branche civile"
 college_professors: "Gérer les professeurs d’université"
 college_professors_desc: "We have a fight on our hands and these people that are supposed to be enlightened, but they bitch about the situation and want the government to abdicate whenever a terrorist attack happens and call it genocide or xenophobia whenever we try to make a move against PKK. This needs to be stopped. We will either purge them or make sure they won't discredit our actions with baseless claims anymore"
 kurdish_language_1: "Problème de la langue kurde"
 kurdish_language_1_desc: "For years there was an unwritten rule against Kurdish language. Not only opening television channels and universities with Kurdish language is banned, even if you are telling something Kurdish in public or in a street you might get attacked verbally. And nearly 20 percent of our population has Kurdish as their mother language. We need to solve this.\n\nUnlocks the second decision for more reforms."
 kurdish_language_2: "Mettre fin à la discrimination"
 kurdish_language_2_desc: "Tout d’abord, punir ceux qui agressent les locuteurs kurdes. Personne ne devrait avoir peur de parler sa propre langue.\n\nDéverrouille la troisième décision pour plus de réformes."
 kurdish_language_4: "Chaînes de télévision kurdes"
 kurdish_language_4_desc: "We will allow people to open Kurdish channels, not only this will discredit PKK's propaganda about Kurds being oppressed, it will win hearts of adult people who were born Kurdish and never got the chance to learn Turkish. Although we need to hire people to keep an eye on these channels and prevent them being used for PKK propaganda.\n\nUnlocks the fifth decision for more reforms."
 doing_counter_terror_op_civ: "Mener une autre réforme civile"
 investment_propaganda_1: "Projets d’infrastructure"
 investment_propaganda_1_desc: "Our eastern regions are lacking badly needed infrastructure to overcome rough terrain. In terms of equality and keeping people happy, we need to fix this."
 investment_propaganda_2: "Efforts contre le chômage"
 investment_propaganda_2_desc: "Hungry people tend to become criminals. Former governments ignored the eastern regions and didn't care about the problems that caused the Kurds to feel oppressed. We need to do better than the ones before us."
 TUR_military_category: "Forces armées turques"
 TUR_military_category_desc: "L’armée turque est intervenue dans la politique turque à plusieurs reprises. Chaque fois qu’elle a senti sa propre existence ou celle de la Turquie menacée, elle a organisé (ou tenté d’organiser) un coup d’État. Cela découlait souvent d’un éloignement du gouvernement turc de la laïcité, ou parfois de troubles économiques apparemment causés par le gouvernement.\n\nSi votre §YPosition§! avec [TUR.Nat_Autocracy_L] tombe en dessous de §Y0§!, les forces armées prendront des mesures pour destituer le gouvernement.\n\nNotre §YPosition§! actuelle : [?TUR_military_standing_value|0+]\n\n[?TUR_military_standing_party|=0+] de notre §YParti au pouvoir§!\n[?TUR_military_standing_conservatism|=0+] de £pol_idea §GConservatisme social - Gouvernement§!\n[?TUR_military_standing_opinion|=0+] de §YL’Armée§! Opinion actuelle\n[?TUR_military_standing_corruption|=0+] de notre §YNiveau de corruption§!\n[?TUR_military_standing_economy|=0+] de notre §YCycle économique§!\n[?TUR_military_standing_interest_rate|=0+] de notre §YTaux d’intérêt§!"
 TUR_hizmet_gulen_struggle: "La lutte entre Hizmet et l’AKP"
 TUR_hizmet_gulen_struggle_desc: "An active power struggle exists between §W[Western_Autocracy_L]§! and the §W[Neutral_Muslim_Brotherhood_L]§!. The Turkish people are split between who they want, as both sides formed a coalition in order to take power in the last election. Both parties are vying for power in Turkey, and they gain more and more power every time they successfully pass a law or counter one. Eventually things will tip over to one side and the coalition will be dissolved.\n\nCurrently §W[Western_Autocracy_L]§! Control is at §Y[?hizmet_power|%]§!\n\nCurrently §W[Neutral_Muslim_Brotherhood_L]§! Control is at §Y[?akp_power|%]§!"
 TUR_expose_akp_scandal: "Exposer les scandales de l’AKP"
 TUR_expose_akp_scandal_desc: "Nous allons révéler un scandale dans lequel §H[Neutral_Muslim_Brotherhood_L]§! est impliqué."
 TUR_expose_gulenist_institution: "Shut down Gülenist institutions"
 TUR_expose_gulenist_institution_desc: "Nous allons fermer une institution gérée par §H[Western_Autocracy_L]§!."
 TUR_random_rally_akp_gulen: "Rassemblement politique imminent !"
 TUR_disaster_income: "Catastrophe économique"
 TUR_disaster_income_desc: "Une catastrophe économique imminente est annoncée pour le pays, et elle arrive rapidement. Nous devons rapidement nous organiser pour empêcher la formation de partis d’opposition et éviter une crise aggravée."
 TUR_incoming_collapse: "Catastrophe imminente"
 TUR_incoming_collapse_desc: "The market will crash, leading to devastating consequences..."
 TUR_ciw_decisions: "CBI"
 TUR_ciw_decisions_desc: "The §HCIW§!, or otherwise known as the §HConfederation of Islamic Wellbeing§! is an organization that intends to improve the wellbeing of islamic peoples around the globe. The CIW leader, §HTurkey§!, will have the ability to §Hinvest in other CIW members§!, and it could be through §Hinfrastructure, networks, industries, or railways§!, etc. §HCIW Members§! can §Ropt out§! of the organization at anytime, but doing so will §Rrevoke§! their ability to re-apply at a later date.\nThe §HCIW leader§! will be able to invest in other countries' education, healthcare, industry, infrastructure and emergency supply infrastructure. Once the leader invests in one of these things, a modifier with the bonuses are added to all the §HCIW members§! at no cost to them. §HCIW Member§! states will be able to §Gask for investments§! which can give them buildings instead of the bonuses given from the §HCIW Leader§!. If a §HCIW Member§! chooses to do one of these decisions, then the §HCIW Leader§! will get a certain amount of money into their §GInternational Investments§!."
 TUR_invest_in_infrastructure: "Investir dans l'infrastructure CIW"
 TUR_invest_in_infrastructure_desc: "En étant capables de construire des infrastructures adéquates, les pays du CIW fourniront des logements et des installations adéquats à leurs populations."
 TUR_invest_in_disasters: "Aide aux sinistrés du CIW"
 TUR_invest_in_disasters_desc: "Le monde musulman traverse de nombreuses catastrophes et, bien souvent, il n'est pas en mesure de réparer les dégâts causés. Nous pouvons les aider en leur fournissant des fournitures de secours d'urgence."
 TUR_invest_in_education: "Investir dans l'éducation CIW"
 TUR_invest_in_education_desc: "Tout le monde a besoin d’avoir accès à une éducation adéquate, et pour cette raison, nous allons devoir investir dans les infrastructures éducatives des pays de la CIW."
 TUR_invest_in_health: "Investissez dans le CIW Healthcare"
 TUR_invest_in_health_desc: "Les pays du CIW ont besoin de soins de santé pour leurs nombreuses populations, car les médicaments adéquats sont difficiles à trouver ou trop chers."
 TUR_invest_in_industry: "Investissez dans CIW Industries"
 TUR_invest_in_industry_desc: "By investing in CIW countries' industries, we are able to make the Islamic world industrialize and catch up to the Europeans much quicker"
 TUR_leave_ciw: "Quitter la CBI"
 TUR_ask_for_infrastructure: "Demander des investissements en infrastructure"
 TUR_ask_for_network: "Demander des investissements en infrastructure réseau"
 TUR_ask_for_supply: "Demander des investissements en transport"
 TUR_ask_for_radars: "Demander des investissements en radars"
 TUR_ask_for_airbase: "Demander des investissements en aéroports"
 TUR_empower_sultan: "Renforcer le §W[Monarchist_L]§!"
 TUR_empower_sultan_desc: "The Sultan is the rightful owner of the Ottoman State, not some grumpy old man. The Sultan will take what is rightfully his, and he will get his supporters to march in and remove the current leader, even if it is done by force!"
 TUR_new_capital_mhp: "Reconstruire Constantinople"
 TUR_new_capital_mhp_desc: "Atatürk a déplacé notre capitale de Constantinople à Ankara. Bien que son intention était principalement de protéger la capitale de la Turquie de ses ennemis, au final, cela ne change pas grand-chose. Nous relocaliserons notre capitale à Constantinople et la rendrons plus grandiose que jamais !"
 TUR_open_mid_east: "§HOuvrir la section Moyen-Orient§!"
 TUR_close_mid_east: "§HFermer la section Moyen-Orient§!"
 TUR_support_in_iraq: "Renforcer le soutien en §HIrak§!"
 TUR_support_in_syria: "Renforcer le soutien en §HSyrie§!"
