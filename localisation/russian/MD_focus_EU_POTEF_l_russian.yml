 EFS_flag_category: "Смена флага Европейской федерации"
 EFS_flag_category_desc: "После создания Европейской федерации государства-члены решили принять новые флаги по общему европейскому образцу."
 USoE_Flag_Reset_Flag_category: "Флаг СШЕ"
 USoE_Flag_Reset_Flag_category_desc: ""
 USoE_reset_flag: "Сбросить флаг СШЕ"
 USoE_reset_flag_desc: "Изменить флаг СШЕ на стандартный флаг ЕС (отменить это действие нельзя)."
 EDU_major_non_EU_ally_desc: "Чтобы достичь необходимой стратегической автономии для защиты своих коллективных интересов, реагирования на внешние конфликты и кризисы, а также обеспечения безопасности в соседних регионах, государства-члены §YЕвропейского союза§! решили создать §YЕвропейский союз обороны (ЕСО)§! в качестве военного альянса. Изначально созданный для защиты Европы, ЕСО заключил союз с другими странами, не входящими в ЕС, для защиты общих интересов и поддержания мира."
 POTEF750: "Восточная доктрина"
 POTEF750_desc: "Европейской федерации нужна хорошо подготовленная пехота для восточных равнин."
