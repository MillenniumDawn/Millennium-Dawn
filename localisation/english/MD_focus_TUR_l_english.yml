 tur_spg_tender: "§WHold a tender for §YSelf-Propelled Howitzers§!"
 tur_spg_tender_desc: "\n\n\n\n\n\n£TUR_desctext_spg_tender_for_tooltip\n\n\n\n\n\n\n\n\n§WTender to replace our aging towed and self-propelled artillery, which can no longer keep pace with the mechanized columns it is meant to support, with a modern §Y155mm self-propelled howitzer§!. Partners from £KOR §YSouth Korea§!, £GER §YGermany§! and £ENG §YBritain§! have put proposals on the table.\n--------------\n§RWarning:§! This Decision is §Rrequired§! to unlock the development of §YAsya and Firtina 2§! systems.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_spg_tender.1.name: "§WThe §YSelf-Propelled Howitzer§! Tender§!"
 tur_spg_tender.1.desc: "§WThe trials for the §YSelf-Propelled Howitzer Tender§! have concluded. Our artillery can no longer keep pace with the mechanized columns it is meant to support, and three partners have put proposals on the table.\n\n£KOR §YK9 Thunder§!: a 155mm self-propelled howitzer from £KOR §LHanwha§! with a §Gmodern autoloader§!. It is §Gproven§! and §Gaffordable§!, and offered with §Gfull license production§! so that our own industry can build it, but it remains a §Rforeign design§!.\n\n£GER §YPzH 2000§!: a 155mm self-propelled howitzer from £GER §LKrauss-Maffei Wegmann§! with a §Ghigh rate of fire§! and §Gexcellent accuracy§!. It is widely regarded as the §Gbest howitzer in the world§!, but is §Rvery expensive§! and offered as a §Rdirect sale only§!.\n\n£ENG §YAS-90D§!: a 155mm self-propelled howitzer from £ENG §LBAE Systems§!, §Gsolid§! and §Gcheaper§!, available immediately, but §Rolder§! and §Rwithout any license production§!.\n\nLicense and industry, raw capability, or a cheap purchase? The delivery or production start will take §Y120 days§!.§!"
 tur_spg_tender.1.a: "£KOR §YK9 Thunder§! §G(License production, good system)§! §R(Foreign design)§!"
 tur_spg_tender.1.b: "£GER §YPzH 2000§! §G(Best in class)§! §R(Very expensive, no license)§!"
 tur_spg_tender.1.c: "£ENG §YAS-90D§! §G(Cheaper)§! §R(Older, no license)§!"
 tur_spg_tender.10.name: "§W§YT-155 Firtina§! Enters Production§!"
 tur_spg_tender.10.desc: "§WThe first license-built §YT-155 Firtina§! howitzers have rolled out of the Turkish workshops. Based on the £KOR §LHanwha§! §YK9 Thunder§! and built by £TUR §LMKE§!, this new equipment features a §Gmodern autoloader§! and a §Greliable chassis§!, and other smaller modifications.\n\nThe Firtina combines the Korean design with a Turkish production line, and our engineers have already begun working on improvements of their own.\n\n§GStrengths:§!§W Domestic production, good rate of fire, reasonable cost and room for local modifications.\n§RWeaknesses:§!§W Early production is slow and still depends on some Korean components.\n\nThe lines are open and the first batches are headed for the artillery regiments.§!"
 tur_spg_tender.10.a: "§WMade in Türkiye.§!"
 tur_spg_tender.11.name: "§W§YPzH 2000§! Delivered§!"
 tur_spg_tender.11.desc: "§WThe §YPzH 2000§! howitzers have arrived from £GER §YGermany§!, 280 of them, and our gunners have wasted no time in trying them out. Developed by £GER §LKrauss-Maffei Wegmann§!, this new equipment features an §Gunmatched rate of fire§! and §Gexcellent accuracy§!, and other smaller modifications.\n\nThe crews who have used them speak of them with something close to reverence.\n\n§GStrengths:§!§W Outstanding firepower, range and precision.\n§RWeaknesses:§!§W The most expensive option, with no license to build more ourselves.\n\nThe guns are being distributed to the artillery regiments.§!"
 tur_spg_tender.11.a: "§WA very fine piece of engineering.§!"
 tur_spg_tender.12.name: "§W§YAS-90D§! Delivered§!"
 tur_spg_tender.12.desc: "§WThe §YAS-90D§! howitzers have arrived from £ENG §YBritain§!, 280 of them, and are being inspected at the depots. Developed by £ENG §LBAE Systems§!, this new equipment features a §Gproven design§! and §Gsolid firepower§!, and other smaller modifications.\n\nThey bring a clear improvement over our aging artillery without breaking the budget.\n\n§GStrengths:§!§W Proven design, cheaper than the alternatives and available immediately.\n§RWeaknesses:§!§W Older technology, and no license to build more ourselves.\n\nThe guns are being distributed to the artillery regiments.§!"
 tur_spg_tender.12.a: "§WGood enough for the price.§!"

 TUR_develop_asya: "§WDevelop the §YAsya TTO§!"
 TUR_develop_asya_desc: "\n\n\n\n\n\n£TUR_develop_asya_for_tooltip\n\n\n\n\n\n\n\n\n§WNew equipment: §YAsya TTO§!, 155-mm wheeled self-propelled howitzer.\nDeveloper: £TUR §LASELSAN§!.\nFeatures: §Gfully domestic design§! and §Gfast move, fire and relocate§!, and other smaller modifications.\n--------------\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YNext Generation Self-Propelled Howitzers Tender§!.\nIf you §Rskip§! it, it will §Rnot§! be available to you.§!"
 tur_asya_requires_spg: "§WComplete the §YSelf-Propelled Howitzer§! Tender§!"

 TUR_develop_firtina2: "§WDevelop the §YFirtina 2§!"
 TUR_develop_firtina2_desc: "\n\n\n\n\n\n£TUR_develop_firtina2_for_tooltip\n\n\n\n\n\n\n\n\n§WNew equipment: §YFirtina 2§!, 155-mm tracked self-propelled howitzer based on the modernised §YT-155 Firtina§!.\nDevelopers: £TUR §LMKE§! and £TUR §LASELSAN§!.\nFeatures: §Glonger range§! and §Gdigital fire control§!, and other smaller modifications.\n--------------\n§RWarning:§! This Decision is §Rrequired§! to unlock the development of §Ynewer self-propelled howitzers§!.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_firtina2_requires_asya: "§WComplete the §YAsya TTO§! Development§!"



 tur_howitzer_dev: "§WDevelop a New §YWheeled Howitzer§!"
 tur_howitzer_dev_desc: "\n\n\n\n\n\n£TUR_develop_arpan_for_tooltip\n\n\n\n\n\n\n\n\n§WProgram to develop a modern domestic §Y155mm wheeled howitzer§! for our artillery corps. Two competing proposals are on the table.\n--------------\nOnly §Yone§! of the two can be developed, and the design will take §Y120 days§! to complete.§!"
 tur_howitzer_dev.1.name: "§WNext-Generation §YWheeled Howitzer§!§!"
 tur_howitzer_dev.1.desc: "§WTurkish engineers have two competing 155mm wheeled howitzer proposals on the table, and only one can receive funding. Development will take roughly four months.\n\n£TUR §YArpan§!: a more ambitious 155mm wheeled howitzer with §Gbetter range§! and a §Ghigher rate of fire§!, but it is §Rmore expensive§! to develop.\n\n£TUR §YYavuz§!: a 155mm wheeled howitzer with an §Geconomical, conservative design§! and §Glow development risk§!. It is §Gcheaper§!, but offers §Rmodest performance§!.\n\nWhich design should receive funding?§!"
 tur_howitzer_dev.1.a: "§WDevelop the §YArpan§! §G(Better performance)§! §R(More expensive)§!§!"
 tur_howitzer_dev.1.b: "§WDevelop the §YYavuz§! §G(Cheaper, low risk)§! §R(Modest performance)§!§!"
 tur_howitzer_dev.10.name: "§WThe §YArpan§! Wheeled Howitzer is Ready§!"
 tur_howitzer_dev.10.desc: "§WAfter months of testing, the §YArpan§! design has passed its acceptance trials. Developed by our domestic defense industry, this new equipment features a §Gcapable range§! and a §Ghigh rate of fire§!, and other smaller modifications.\n\nThis wheeled howitzer's range and rate of fire exceed our earlier systems.\n\n§GStrengths:§!§W Better range and firepower than our earlier systems.\n§RWeaknesses:§!§W Higher development and production cost.\n\nThe design is now available to our artillery planners.§!"
 tur_howitzer_dev.10.a: "§WA fine addition to the arsenal.§!"
 tur_howitzer_dev.11.name: "§WThe §YYavuz§! Wheeled Howitzer is Ready§!"
 tur_howitzer_dev.11.desc: "§WAfter months of testing, the §YYavuz§! design has passed its acceptance trials. Developed by our domestic defense industry, this new equipment features an §Geconomical, reliable design§! and §Glow production cost§!, and other smaller modifications.\n\nThis wheeled howitzer is a solid and affordable addition to our artillery.\n\n§GStrengths:§!§W Reliable, affordable and low risk.\n§RWeaknesses:§!§W Modest range and rate of fire.\n\nThe design is now available to our artillery planners.§!"
 tur_howitzer_dev.11.a: "§WA solid piece of work.§!"
 tur_arpan_requires_firtina2: "§WComplete the §YFirtina 2§! Development§!"

 tur_mlrs_development: "§WDevelop a New §YMultiple Launch Rocket System§!"
 tur_mlrs_development_desc: "\n\n\n\n\n\n£TUR_mlrs_tender_for_tooltip\n\n\n\n\n\n\n\n\n§WProgram to develop Türkiye's first modern domestic §Ymultiple launch rocket system§!, which our artillery corps still lacks. Two domestic proposals are ready for development.\n--------------\nOnly §Yone§! of the two can be developed. The design will be ready in §Y120 days§!, and production will begin immediately.\n--------------\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YTRG-300 Kaplan§! Development.\nIf you §Rskip§! it, it will §Rnot§! be available to you.§!"
 tur_mlrs_dev.1.name: "§WThe §YRocket Artillery§! Program§!"
 tur_mlrs_dev.1.desc: "§WOur artillery corps lacks a modern rocket system, and Turkish industry has two domestic proposals ready for development. Only one can receive funding.\n\n£TUR §YTR-122§!: a 122mm multiple launch rocket system from £TUR §LRoketsan§! built around lighter rockets, with §Ghigh mobility§! and §Gquick production§!. It is §Gcheaper§! and easy to support, but has §Rshorter range§! and a §Rsmaller warhead§!.\n\n£TUR §YT-300§!: a 300mm multiple launch rocket system from £TUR §LRoketsan§! with §Glonger range§! and §Gheavier rockets§!. It offers §Gmuch greater destructive power§!, but is §Rmore expensive§! to develop and build.\n\nThe design will be completed in §Y120 days§!.§!"
 tur_mlrs_dev.1.a: "£TUR §YTR-122§! §G(Cheaper, mobile)§! §R(Shorter range)§!"
 tur_mlrs_dev.1.b: "£TUR §YT-300§! §G(Long range, heavy rockets)§! §R(More expensive)§!"
 tur_mlrs_dev.10.name: "§WThe §YTR-122§! Enters Service§!"
 tur_mlrs_dev.10.desc: "§WThe first modern domestic multiple launch rocket system, the §YTR-122§!, has completed its trials and entered service with the Turkish Army. Developed by £TUR §LRoketsan§!, this new equipment features §Ghigh mobility§! and §Gquick production§!, and other smaller modifications.\n\nThe first batteries are already being assigned to the artillery regiments, and the production line is now open.\n\n§GStrengths:§!§W Cheap, mobile and quick to produce.\n§RWeaknesses:§!§W Shorter range and a smaller warhead than heavier systems.\n\nOur gunners now have a rocket system of their own design to support the advance of our forces.§!"
 tur_mlrs_dev.10.a: "§WA new era for our artillery.§!"
 tur_mlrs_dev.11.name: "§WThe §YT-300§! Enters Service§!"
 tur_mlrs_dev.11.desc: "§WThe first modern domestic multiple launch rocket system, the §YT-300§!, has completed its trials and entered service with the Turkish Army. Developed by £TUR §LRoketsan§!, this new equipment features §Glong range§! and §Gheavy rockets§!, and other smaller modifications.\n\nIts range and destructive power exceed anything our artillery has fielded before, and the production line is now open.\n\n§GStrengths:§!§W Long range, heavy rockets and great destructive power.\n§RWeaknesses:§!§W Expensive to build and to maintain.\n\nOur gunners can now strike targets deep behind enemy lines.§!"
 tur_mlrs_dev.11.a: "§WA new era for our artillery.§!"


 tur_trg300_development: "§WDevelop the §YTRG-300 Kaplan§!"
 tur_trg300_development_desc: "\n\n\n\n\n\n£TUR_trg300_for_tooltip\n\n\n\n\n\n\n\n\n§WNew equipment: §YTRG-300 Kaplan§!, long-range guided rocket system.\nDeveloper: £TUR §LRoketsan§!.\nFeatures: §Glong range§! and §Ghigh precision§!, and other smaller modifications.\n--------------\nThe design will take §Y120 days§! to complete, after which §Yproduction§! will begin.\n--------------\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YTRG-230§! Development.\nIf you §Rskip§! it, it will §Rnot§! be available to you.§!"
 tur_trg300_dev.1.name: "§WThe §YTRG-300 Kaplan§! Enters Production§!"
 tur_trg300_dev.1.desc: "§WThe development of the §YTRG-300 Kaplan§! has been completed. After months of testing, the long-range guided rocket system has passed its acceptance trials, and the production line has been opened. Developed by £TUR §LRoketsan§!, this new equipment features §Glong range§! and §Ghigh precision§!, and other smaller modifications.\n\nIt gives our artillery the ability to strike targets far behind the front line, and it is the product of a domestic industry that can now design and build advanced rocket systems of its own.\n\n§GStrengths:§!§W Long range, precision and heavy firepower.\n§RWeaknesses:§!§W Expensive and complex to produce and maintain.\n\nThe first batteries will be assigned to the artillery regiments in the coming months.§!"
 tur_trg300_dev.1.a: "§WOur rockets will reach far.§!"
 tur_trg300_requires_mlrs: "§WComplete the §YMLRS§! Development§!"


 tur_trg230_development: "§WDevelop the §YTRG-230§!"
 tur_trg230_development_desc: "\n\n\n\n\n\n£TUR_trg230_for_tooltip\n\n\n\n\n\n\n\n\n§WNew equipment: §YTRG-230§!, guided rocket system.\nDeveloper: £TUR §LRoketsan§!.\nFeatures: §Ghigh precision§! and §Ghigh mobility§!, and other smaller modifications.\n--------------\nThe design will take §Y120 days§! to complete, after which §Yproduction§! will begin.\n--------------\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YRoketsan MBRL§! Development.\nIf you §Rskip§! it, it will §Rnot§! be available to you.§!"
 tur_trg230_dev.1.name: "§WThe §YTRG-230§! Enters Production§!"
 tur_trg230_dev.1.desc: "§WThe development of the §YTRG-230§! has been completed. After months of testing, the guided rocket system has passed its acceptance trials, and the production line has been opened. Developed by £TUR §LRoketsan§!, this new equipment features §Ghigh precision§! and §Ghigh mobility§!, and other smaller modifications.\n\nIt gives our artillery an accurate and mobile rocket system that can hit targets well beyond the reach of conventional guns, and it shows that Turkish industry can now design and build modern guided rockets of its own.\n\n§GStrengths:§!§W Accurate, mobile and cheaper than heavier systems.\n§RWeaknesses:§!§W Shorter range and a smaller warhead than the heavier rocket systems.\n\nThe first batteries will be assigned to the artillery regiments in the coming months.§!"
 tur_trg230_dev.1.a: "§WOur rockets will find their mark.§!"
 tur_trg230_requires_trg300: "§WComplete the §YTRG-300§! Development§!"


 tur_roketsan_mbrl_development: "§WDevelop the §YRoketsan MBRL§!"
 tur_roketsan_mbrl_development_desc: "\n\n\n\n\n\n£TUR_mbrl_for_tooltip\n\n\n\n\n\n\n\n\n§WNew equipment: §YRoketsan MBRL§!, wheeled multiple rocket launcher, Türkiye's equivalent of the American £USA §YHIMARS§!.\nDeveloper: £TUR §LRoketsan§!.\nFeatures: §Ghigh mobility§! and §Gprecise guided rockets§!, and other smaller modifications.\n--------------\nThe design will take §Y120 days§! to complete, after which §Yproduction§! will begin.§!"
 tur_roketsan_mbrl_dev.1.name: "§WThe §YRoketsan MBRL§! Enters Production§!"
 tur_roketsan_mbrl_dev.1.desc: "§WThe development of the §YRoketsan MBRL§! has been completed. After months of testing, Türkiye's equivalent of the American £USA §YHIMARS§! has passed its acceptance trials, and the production line has been opened. Developed by £TUR §LRoketsan§!, this new equipment features §Ghigh mobility§! and §Gprecise guided rockets§!, and other smaller modifications.\n\nMounted on a wheeled truck chassis, the launcher can move quickly, fire its guided rockets and relocate before the enemy can respond. It shows that Turkish industry can now build modern rocket systems of its own.\n\n§GStrengths:§!§W Highly mobile, precise and quick to deploy.\n§RWeaknesses:§!§W Expensive, with a smaller rocket load than heavier launchers.\n\nThe first batteries will be assigned to the artillery regiments in the coming months.§!"
 tur_roketsan_mbrl_dev.1.a: "§WShoot and scoot.§!"
 tur_mbrl_requires_trg230: "§WComplete the §YTRG-230§! Development§!"


 TUR_develop_domestic_air_category: "Modernize Our Air Force"
 TUR_develop_domestic_air_category_desc: "\n\n\n\n\n\n£TUR_desctext_develop_domestic_air\n\n\n\n\n\n\n\n\n§WOur air force still relies on an aging fleet of aircraft and on foreign suppliers for the systems that matter most. We can invest time and resources into modernizing it, whether by bringing in proven foreign platforms under license or by developing new aircraft and systems of our own. Drawing upon §YTurkey's§! engineering expertise and growing aerospace industry, we can build an air force tailored to the needs of our pilots and our skies. A modern, domestically supported air fleet will strengthen our defense and reduce our reliance on foreign suppliers.§!"
 tur_e7t_peace_eagle_development: "§WAcquire the §YE-7T Peace Eagle§!"
 tur_e7t_peace_eagle_development_desc: "\n\n\n\n\n\n£TUR_e7t_for_tooltip\n\n\n\n\n\n\n\n\n§WProject to bring the §YE-7T Peace Eagle§! airborne early warning and control aircraft into service, built under §Ylicense from the United States§!.\n--------------\n§GStrengths:§!§W A proven airborne radar platform, with license production and full American technical support.\n§RWeaknesses:§!§W Expensive, and it ties us to American technology and spare parts.\n--------------\nThe design will take §Y180 days§! to complete, after which §Yproduction§! will begin.§!"
 tur_e7t_cost_20m_tt: "§WCosts §Y20 million§! from the treasury§!"
 tur_e7t_dev.1.name: "§WThe §YE-7T Peace Eagle§! Enters Service§!"
 tur_e7t_dev.1.desc: "§WThe §YE-7T Peace Eagle§! project has been completed. The first airborne early warning and control aircraft built under §Ylicense from the United States§! has passed its acceptance trials, and the production line has been opened.\n\nWith its powerful radar and the ability to track hundreds of targets at once, the Peace Eagle gives our air force the eyes it has long lacked. It can spot enemy aircraft and missiles from far beyond the reach of ground radars, and direct our fighters and air defenses against them with precision.\n\n§GStrengths:§!§W Wide radar coverage, a proven American design and strong technical support.\n§RWeaknesses:§!§W Expensive, and dependent on American technology and spare parts.\n\nThe first aircraft are expected to join the air force in the coming months.§!"
 tur_e7t_dev.1.a: "§WEyes in the sky.§!"

 tur_anka_b_development: "§WDevelop the §YTAI Anka-B§!"
 tur_anka_b_development_desc: "\n\n\n\n\n\n£TUR_anka_b_for_tooltip\n\n\n\n\n\n\n\n\n§WNew equipment: §YTAI Anka-B§!, medium-altitude long-endurance unmanned aerial vehicle.\nDeveloper: £TUR §LTAI§!.\nFeatures: §Glong endurance§! and §Gsatellite-linked reconnaissance§!, and other smaller modifications.\n--------------\nThe design will take §Y180 days§! to complete, after which §Yproduction§! will begin.\n--------------\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YAksungur§! and §YAnka-3§! Development.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_anka_b_dev.1.name: "§WThe §YTAI Anka-B§! Enters Production§!"
 tur_anka_b_dev.1.desc: "§WThe development of the §YTAI Anka-B§! has been completed. After months of testing, the unmanned aerial vehicle has passed its acceptance trials, and the production line has been opened. Developed by £TUR §LTAI§!, this new equipment features §Glong endurance§! and §Gsatellite-linked reconnaissance§!, and other smaller modifications.\n\nIt gives our forces the ability to watch and strike targets for many hours without risking a pilot, and it shows that Turkish industry can now design and build advanced unmanned aircraft of its own.\n\n§GStrengths:§!§W Long endurance, wide surveillance range and no risk to a pilot.\n§RWeaknesses:§!§W Vulnerable to modern air defenses, and limited payload compared with manned aircraft.\n\nThe first aircraft will join the air force in the coming months.§!"
 tur_anka_b_dev.1.a: "§WEyes that never tire.§!"
 tur_anka_b_dev.2.name: "§WThe §YTAI Anka-B§! Makes its Maiden Flight§"
 tur_anka_b_dev.2.desc: "§WThe first prototype of the §YTAI Anka-B§! has taken to the skies for the first time. Developed by £TUR §LTAI§!, the unmanned aerial vehicle took off, flew its planned route and landed safely, with its engineers watching every moment of the flight on the ground control screens.\n\nThe test confirmed the performance of its airframe and its §Gsatellite-linked§! control system, and the program is on track to be completed in the coming months.\n\n§GStrengths:§!§W The prototype performed as designed and the program remains on schedule.\n§RWeaknesses:§!§W Further testing is still needed before the aircraft can enter production.\n\nThe design is expected to be completed in about §Y90 days§!.§!"
 tur_anka_b_dev.2.a: "§WA successful first flight.§!"


 tur_p72_mpa_development: "§WDevelop the §YP-72 MPA§!"
 tur_p72_mpa_development_desc: "\n\n\n\n\n\n£TUR_p72_for_tooltip\n\n\n\n\n\n\n\n\n§WNew equipment: §YP-72 MPA§!, maritime patrol and anti-submarine warfare aircraft.\nDeveloper: £TUR §LTAI§!.\nFeatures: §Glong patrol endurance§! and §Ganti-submarine and anti-ship capability§!, and other smaller modifications.\n--------------\nThe design will take §Y120 days§! to complete, after which §Yproduction§! will begin.§!"
 tur_p72_dev.1.name: "§WThe §YP-72 MPA§! Enters Production§!"
 tur_p72_dev.1.desc: "§WThe development of the §YP-72 MPA§! has been completed. After months of testing, the maritime patrol aircraft has passed its acceptance trials, and the production line has been opened. Developed by £TUR §LTAI§!, this new equipment features §Glong patrol endurance§! and §Ganti-submarine and anti-ship capability§!, and other smaller modifications.\n\nIt gives our navy the ability to watch the Aegean, the Black Sea and the eastern Mediterranean for hours on end, hunt submarines and track hostile ships far from our coasts, and it shows that Turkish industry can now equip modern patrol aircraft with systems of its own.\n\n§GStrengths:§!§W Long endurance, wide patrol range and strong anti-submarine sensors.\n§RWeaknesses:§!§W Slow, unarmored and vulnerable to modern fighters.\n\nThe first aircraft will join the naval air arm in the coming months.§!"
 tur_p72_dev.1.a: "§WEyes over the sea.§!"

 tur_f16_ccip_modernization: "§WModernize the §YF-16§! to §YCCIP§!"
 tur_f16_ccip_modernization_desc: "\n\n\n\n\n\n£TUR_f16_ccip_for_tooltip\n\n\n\n\n\n\n\n\n§WModernization: §YF-16 CCIP§!, modernized multirole fighter.\nDeveloper: £TUR §LTAI§!.\nFeatures: §Gnew avionics and radar§! and §Gmodern weapons integration§!, and other smaller modifications.\n--------------\nThe design will take §Y120 days§! to complete, after which §Yproduction§! will begin.§!"
 tur_f16_ccip_dev.1.name: "§WThe §YF-16 CCIP§! Modernization is Complete§!"
 tur_f16_ccip_dev.1.desc: "§WThe modernization of the §YF-16§! fleet under the Common Configuration Implementation Program has been completed. After months of testing, the upgraded fighter has passed its acceptance trials, and the production line has been opened. Developed by £TUR §LTAI§!, this new equipment features §Gnew avionics and radar§! and §Gmodern weapons integration§!, and other smaller modifications.\n\nIt brings the aging fighters of the air force up to a common standard, giving our pilots better sensors and far more capable weapons, and it shows that Turkish industry can now modernize advanced combat aircraft on its own.\n\n§GStrengths:§!§W Modern avionics, a common configuration and better weapons.\n§RWeaknesses:§!§W Still an older airframe, with limited room for further upgrades.\n\nThe first upgraded aircraft will rejoin the squadrons in the coming months.§!"
 tur_f16_ccip_dev.1.a: "§WOld airframes, new teeth.§!"

 tur_hurkus_development: "§WDevelop the §YTAI Hurkus§!"
 tur_hurkus_development_desc: "\n\n\n\n\n\n£TUR_hurkus_for_tooltip\n\n\n\n\n\n\n\n\n§WNew equipment: §YTAI Hurkus§!, turboprop advanced trainer and light attack aircraft.\nDeveloper: £TUR §LTAI§!.\nFeatures: §Gfully domestic design§! and §Glow operating cost§!, and other smaller modifications.\n--------------\nThe design will take §Y180 days§! to complete, after which §Yproduction§! will begin.§!"
 tur_hurkus_dev.1.name: "§WThe §YTAI Hurkus§! Enters Production§!"
 tur_hurkus_dev.1.desc: "§WThe development of the §YTAI Hurkus§! has been completed. After months of testing, the turboprop aircraft has passed its acceptance trials, and the production line has been opened. Developed by £TUR §LTAI§!, this new equipment features §Gfully domestic design§! and §Glow operating cost§!, and other smaller modifications.\n\nIt gives our air force a modern aircraft to train its pilots and to support troops on the ground against light opposition, and it is the first complete aircraft designed and built by Turkish industry.\n\n§GStrengths:§!§W Domestic design, cheap to build and to fly, and able to operate from rough airfields.\n§RWeaknesses:§!§W Slow, lightly armed and vulnerable to modern air defenses.\n\nThe first aircraft will join the training squadrons and the air force in the coming months.§!"
 tur_hurkus_dev.1.a: "§WOur own wings.§!"

 tur_tb2_development: "§WDevelop the §YBayraktar TB-2§!"
 tur_tb2_development_desc: "\n\n\n\n\n\n£TUR_tb2_for_tooltip\n\n\n\n\n\n\n\n\n§WNew equipment: §YBayraktar TB-2§!, armed tactical unmanned aerial vehicle.\nDeveloper: £TUR §LBaykar§!.\nFeatures: §Glow cost§! and §Gprecision-guided munitions§!, and other smaller modifications.\n--------------\nThe design will take §Y120 days§! to complete, after which §Yproduction§! will begin.§!"
 tur_tb2_dev.1.name: "§WThe §YBayraktar TB-2§! Enters Production§!"
 tur_tb2_dev.1.desc: "§WThe development of the §YBayraktar TB-2§! has been completed. After months of testing, the armed unmanned aerial vehicle has passed its acceptance trials, and the production line has been opened. Developed by £TUR §LBaykar§!, this new equipment features §Glow cost§! and §Gprecision-guided munitions§!, and other smaller modifications.\n\nIt gives our forces the ability to watch the battlefield and strike targets with precision for many hours without risking a pilot, at a fraction of the price of a manned aircraft.\n\n§GStrengths:§!§W Cheap, long endurance and precise strikes without risking a pilot.\n§RWeaknesses:§!§W Slow, light payload and vulnerable to modern air defenses.\n\nThe first aircraft will join the air force in the coming months.§!"
 tur_tb2_dev.1.a: "§WA small drone that changes everything.§!"
 TUR_tb2_requires_anka: "§WComplete the §YTAI Anka§! Development§!"

 tur_akinci_development: "§WDevelop the §YBaykar Akinci§!"
 tur_akinci_development_desc: "\n\n\n\n\n\n£TUR_akinci_for_tooltip\n\n\n\n\n\n\n\n\n§WNew equipment: §YBaykar Akinci§!, heavy armed unmanned aerial vehicle.\nDeveloper: £TUR §LBaykar§!.\nFeatures: §Ghigh altitude§!, §Glong endurance§! and a §Gheavy weapons payload§!, and other smaller modifications.\n--------------\nThe design will take §Y180 days§! to complete, after which §Yproduction§! will begin.§!"
 tur_akinci_dev.1.name: "§WThe §YBaykar Akinci§! Enters Production§!"
 tur_akinci_dev.1.desc: "§WThe development of the §YBaykar Akinci§! has been completed. After months of testing, the heavy armed unmanned aerial vehicle has passed its acceptance trials, and the production line has been opened. Developed by £TUR §LBaykar§!, this new equipment features §Ghigh altitude§!, §Glong endurance§! and a §Gheavy weapons payload§!, and other smaller modifications.\n\nIt builds on the success of the Bayraktar TB-2 and can carry far more munitions, giving our forces the ability to strike deep and precisely without risking a pilot.\n\n§GStrengths:§!§W Long endurance, heavy payload and precise strikes without risking a pilot.\n§RWeaknesses:§!§W Slow, expensive compared to smaller drones and vulnerable to modern air defenses.\n\nThe first aircraft will join the air force in the coming months.§!"
 tur_akinci_dev.1.a: "§WA bigger drone for a bigger fight.§!"
 TUR_akinci_requires_tb2: "§WComplete the §YBayraktar TB-2§! Development§!"


 tur_mmu_kaan_development: "§WDevelop the §YMMU Kaan§!"
 tur_mmu_kaan_development_desc: "\n\n\n\n\n\n£TUR_mmu_kaan_for_tooltip\n\n\n\n\n\n\n\n\n§WProgram to develop the §YMMU Kaan§!, Türkiye's first domestically designed fifth generation fighter.\nDeveloper: £TUR §LTAI§!.\nFeatures: §Gfully domestic design§! and §Gmodern avionics§!, and other smaller modifications.\n--------------\nThe program has §Y5 stages§!: the §Yaircraft class§!, the §Yengine layout§!, the §Yengines§!, §Ystealth§! and the §Ymission role§! are chosen one after the other. The winning design will be ready in §Y1000 days§!.§!"
 tur_mmu_kaan_dev.1.name: "§W§YMMU Kaan§!: Choose an Aircraft§!"
 tur_mmu_kaan_dev.1.desc: "§WThe air force wants a modern fighter that can replace its aging fleet. The first decision is the size of the aircraft, and it will shape everything that follows.\n\n§YMedium aircraft§!: a larger airframe with §Gmore payload§!, §Glonger range§! and §Gmore room for sensors and fuel§!, but §Rmore expensive§! and §Rheavier§!.\n\n§YLightweight aircraft§!: a smaller airframe that is §Gcheaper§!, §Gmore agile§! and §Geasier to produce§!, but with §Rless payload§! and §Rshorter range§!.\n\nThe engine layout will be decided in §Y200 days§!.§!"
 tur_mmu_kaan_dev.1.a: "§YMedium aircraft§! §G(Payload, range)§! §R(Expensive)§!"
 tur_mmu_kaan_dev.1.b: "§YLightweight aircraft§! §G(Cheap, agile)§! §R(Less payload)§!"
 tur_mmu_kaan_dev.2.name: "§W§YMMU Kaan§!: Engine Layout§!"
 tur_mmu_kaan_dev.2.desc: "§WThe engineers need to decide how many engines will power the aircraft.\n\n§YSingle engine§!: §Glighter§!, §Gcheaper§! and §Gwith lower fuel use§!, but §Rless thrust§! and §Rno backup if the engine fails§!.\n\n§YDual engine§!: §Gmuch more thrust§! and §Gredundancy in case of damage§!, but §Rmore expensive§! and §Rheavier§!.\n\nThe engine will be decided in §Y200 days§!.§!"
 tur_mmu_kaan_dev.2.a: "§YSingle engine§! §G(Light, cheap)§! §R(Less thrust)§!"
 tur_mmu_kaan_dev.2.b: "§YDual engine§! §G(Thrust, redundancy)§! §R(Expensive)§!"
 tur_mmu_kaan_dev.3.name: "§W§YMMU Kaan§!: Engines§!"
 tur_mmu_kaan_dev.3.desc: "§WThe choice of engine will decide how independent the program will be.\n\n£TUR §YTF-35000§!: a §Gdomestic engine§! from £TUR §LTEI§!, §Gfree from foreign export approvals§! and a boost to our own industry, but §Rless proven§! and §Rslower to develop§!.\n\n£USA §YF110-129§!: a §Gproven engine§! from £USA §LGeneral Electric§!, §Gavailable immediately§! and §Gwell supported§!, but it makes us §Rdependent on American export approval§!.\n\nThe stealth decision will be made in §Y200 days§!.§!"
 tur_mmu_kaan_dev.3.a: "£TUR §YTF-35000§! §G(Domestic)§! §R(Less proven)§!"
 tur_mmu_kaan_dev.3.b: "£USA §YF110-129§! §G(Proven)§! §R(Foreign dependence)§!"
 tur_mmu_kaan_dev.4.name: "§W§YMMU Kaan§!: Stealth§!"
 tur_mmu_kaan_dev.4.desc: "§WThe next question is whether the aircraft will be designed to avoid radar.\n\n§YStealth§!: §Ga much lower radar signature§! and §Ga serious advantage against modern air defenses§!, but §Rmuch more expensive§!, §Rcomplex to build§! and §Rweapons must be carried internally§!.\n\n§YNo stealth§!: §Gcheaper§! and §Gsimpler to build§!, with §Gmore room for weapons on external pylons§!, but §Rvisible to modern radars§!.\n\nThe mission role will be decided in §Y200 days§!.§!"
 tur_mmu_kaan_dev.4.a: "§YStealth§! §G(Low radar signature)§! §R(Expensive, complex)§!"
 tur_mmu_kaan_dev.4.b: "§YNo stealth§! §G(Cheaper, simpler)§! §R(Visible to radar)§!"
 tur_mmu_kaan_dev.5.name: "§W§YMMU Kaan§!: Mission Role§!"
 tur_mmu_kaan_dev.5.desc: "§WThe last decision is the aircraft's main role.\n\n§YAir-to-air§!: §Gsuperior performance in air combat§! and §Gthe best chance of winning the skies§!, but §Rless useful against targets on the ground§!.\n\n§YMultirole§!: §Gflexible§! and §Gable to strike ground targets as well as enemy aircraft§!, but §Rless dominant in air combat§!.\n\nThe finished design will be delivered in §Y200 days§!.§!"
 tur_mmu_kaan_dev.5.a: "§YAir-to-air§! §G(Air superiority)§! §R(Less ground attack)§!"
 tur_mmu_kaan_dev.5.b: "§YMultirole§! §G(Flexible)§! §R(Less dominant in the air)§!"
 tur_mmu_kaan_dev.10.name: "§W§YMMU Kaan§!: Design Delivered§!"
 tur_mmu_kaan_dev.10.desc: "§WAfter 1000 days of work, the final design of the §YMMU Kaan§! has been delivered. Developed by £TUR §LTAI§!, this new equipment is built around the options chosen during the program, and has other smaller modifications.\n\nIt is the product of a domestic industry that can now design and build modern fighter aircraft on its own, and the production line has been opened.\n\nThe first aircraft are ready to join the squadrons of the air force.§!"
 tur_mmu_kaan_dev.10.a: "§WA new age for Turkish aviation.§!"
 TUR_kaan_requires_ccip: "§WComplete the §YF-16 CCIP§! Development§!"
 TUR_kaan_requires_stealth_project: "§WComplete §YStealth Aircraft§! Special Project§!"


