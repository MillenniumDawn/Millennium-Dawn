 CHI_TAI_intl_isolation_modifier: "Indice d’isolement international"
 CHI_TAI_intl_isolation_modifier_desc: "Une mesure dynamique de l'isolement diplomatique de Taïwan, inversement proportionnelle au nombre d'États membres de l'ONU qui maintiennent une reconnaissance diplomatique formelle. Moins d'États reconnaissants intensifient les pénalités d'opinion commerciale, d'influence étrangère et le coût d'amélioration des relations avec la Chine ; une reconnaissance plus large améliore inversement ces relations et accroît le levier diplomatique de Taïwan."
 CHI_recognition_embargo: "Embargo sur la reconnaissance"
 CHI_recognition_embargo_desc: "La Chine a imposé de strictes pénalités économiques et diplomatiques à toute nation maintenant une reconnaissance diplomatique formelle de Taïwan. Les coûts commerciaux avec la Chine ont fortement augmenté, et l'accès aux marchés chinois est gravement restreint."
 china_sar.038.t: "Pékin propose une coopération économique transdétroit"
 china_sar.038.d: "Pékin a adressé à Taipei une proposition formelle de cadre de coopération économique transdétroit. Les officiels continentaux le présentent comme un arrangement pragmatique et mutuellement bénéfique qui contourne entièrement la question de souveraineté. Les milieux d'affaires taïwanais y sont réceptifs, mais l'opposition indépendantiste met en garde contre un glissement lent vers la dépendance à l'économie continentale."
 china_sar.038.a: "S'engager dans le cadre."
 china_sar.038.b: "Décliner l'ouverture."
 china_sar.039.t: "Pékin propose d'étendre le commerce transdétroit"
 china_sar.039.d: "S'appuyant sur l'ouverture du dialogue économique, Pékin propose une expansion substantielle du commerce transdétroit, baissant les tarifs et assouplissant les restrictions sur les exportations taïwanaises vers le continent. L'offre rappelle l'accord-cadre de coopération économique et fait miroiter l'accès au vaste marché continental. Les critiques à Taipei craignent que les concessions n'aient des ficelles politiques."
 china_sar.039.a: "Étendre le commerce avec le continent."
 china_sar.039.b: "Rejeter l'expansion commerciale."
 china_sar.040.t: "Accès au marché continental pour les entreprises taïwanaises"
 china_sar.040.d: "Pékin invite les entreprises taïwanaises à opérer sur le continent à des conditions préférentielles, offrant bureaux, droits de construction partagés et licences accélérées. Pour l'économie taïwanaise tournée vers l'export, l'opportunité est considérable, mais un enchevêtrement commercial plus profond avec le continent reste politiquement sensible à Taipei."
 china_sar.040.a: "Accepter un accès préférentiel au marché."
 china_sar.040.b: "Tenir nos entreprises à distance."
 china_sar.041.t: "Coordination des semi-conducteurs à travers le détroit"
 china_sar.041.d: "Pékin propose une coordination entre le continent et l'industrie des semi-conducteurs de Taïwan, leader mondial, notamment des usines de fabrication conjointes et une recherche partagée. Le secteur des puces de Taïwan est son plus grand atout stratégique et son meilleur bouclier ; le partager avec le continent serait lucratif, mais éroderait précisément le levier qui retient les partenaires de Taipei."
 china_sar.041.a: "Se coordonner sur les semi-conducteurs."
 china_sar.041.b: "Protéger notre industrie des puces."
 china_sar.042.t: "Échange de délégations d'affaires"
 china_sar.042.d: "Pékin invite des délégations d'affaires réciproques à visiter des pôles industriels des deux rives du détroit, tissant des liens personnels entre dirigeants continentaux et taïwanais. Les visites sont peu risquées et commercialement utiles, bien que chacune épaississe la toile d'interdépendance économique transdétroit."
 china_sar.042.a: "Échange de délégations."
 china_sar.042.b: "Décliner les visites."
 china_sar.043.t: "Liaisons de transport directes à travers le détroit"
 china_sar.043.d: "Pékin propose une expansion des liaisons de transport directes à travers le détroit, s'appuyant sur la politique des Trois liaisons avec de nouvelles routes maritimes, des vols et des infrastructures. Des connexions directes réduiraient les coûts pour les entreprises comme pour les voyageurs, liant les deux économies toujours plus étroitement."
 china_sar.043.a: "Ouvrir des liaisons de transport directes."
 china_sar.043.b: "Limitez les connexions directes."
 china_sar.044.t: "Garanties d'investissement transdétroit"
 china_sar.044.d: "Pékin offre un accord formel garantissant la protection juridique des investissements taïwanais sur le continent, répondant à des préoccupations de longue date sur les droits de propriété et l'arbitrage. Les garanties rassureraient les investisseurs prudents, mais elles ancrent aussi un cadre dans lequel Taipei négocie avec Pékin comme partenaire économique."
 china_sar.044.a: "Signer les garanties d'investissement."
 china_sar.044.b: "Rejeter l'accord."
 china_sar.045.t: "Planification industrielle transdétroit conjointe"
 china_sar.045.d: "Pékin propose une planification industrielle coordonnée à travers le détroit, alignant chaînes d'approvisionnement, normes et grands projets. Une telle intégration produirait de réelles efficacités, mais plierait aussi l'économie taïwanaise à la stratégie de long terme du continent, une perspective qui alarme les électeurs souverainistes à Taipei."
 china_sar.045.a: "Aligner notre planification industrielle."
 china_sar.045.b: "Planifier notre économie indépendamment."
 china_sar.046.t: "Intégration économique transdétroit approfondie"
 china_sar.046.d: "Pékin propose l'étape finale de l'union économique transdétroit : un marché profondément intégré avec une réglementation harmonisée et la libre circulation des biens et des capitaux. Les partisans mettent en avant la prospérité qu'elle apporterait ; les opposants avertissent qu'à cette profondeur, l'union économique devient difficile à distinguer d'une absorption politique."
 china_sar.046.a: "Achever l'intégration économique."
 china_sar.046.b: "S'arrêter au bord de l'eau."
 china_sar.047.t: "Taipei pèse l'accord de réunification"
 china_sar.047.d: "Pékin a déposé le cadre final de réunification pacifique : Taïwan rejoindrait la République populaire en tant que région administrative spéciale, conservant sa propre administration, son système juridique et son économie sous le modèle « un pays, deux systèmes ». Après des années de détente transdétroit, l'accord repose désormais devant Taipei pour ratification."
 china_sar.047.a: "Ratifier l'accord et réunifier."
 china_sar.047.b: "L'île n'est pas prête pour cela."
 CHI_calm_hong_kong_protests: "Rétablir l'ordre à Hong Kong"
 CHI_calm_hong_kong_protests_desc: "Les manifestations déclenchées par nos réformes électorales continuent de perturber la région administrative spéciale. Les forces de sécurité étant sur le terrain et la situation se stabilisant, le gouvernement central peut s'employer à éteindre discrètement les troubles et à rétablir la normalité à Hong Kong."
