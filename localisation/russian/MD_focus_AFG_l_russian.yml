 AFG_junbish_i_milli_in_power_tt: "£GFX_AFG_conservative §YДжунбиш-и-Милли§! находится у власти"
 AFG_junbish_i_milli_forty_support_tt: "£GFX_AFG_conservative §YДжунбиш-и-Милли§! имеет более чем  §Y40%§! поддержки."
