 israel.86.t: "제닌 연구소 해체"
 israel.86.d: "우리는 제닌의 비밀 지하 군사 연구소를 확보했습니다. 이를 어떻게 처리할지 결정해야 합니다."
 israel.86.a: "그들의 비축분을 압수하라."
 israel.86.b: "시설을 장악하라"
 israel.86.c: "시설을 해체하여 이전하라!"
