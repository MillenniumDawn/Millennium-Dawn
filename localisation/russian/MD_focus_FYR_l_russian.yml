l_russian:
 FYR_political.1.t: "Мятеж на Северо - западе"
 FYR_political.1.d: "Боевики-этнические албанцы, называющие себя Национально-освободительной армией, захватили приграничную деревню Танушевци, и перестрелки с силами безопасности распространяются в направлении Тетово. Скопье опасается, что война, которая пощадила Македонию в девяностых годах, наконец-то началась."
 FYR_political.1.a: "Обратиться за международным посредничеством"
 FYR_political.1.b: "Подавите мятеж"
 FYR_political.2.t: "Охридское рамочное соглашение"
 FYR_political.2.d: "Правительство и лидеры албанской партии подписали рамочное соглашение в Охриде при посредничестве Запада. Албанский язык получает официальный статус в муниципалитетах, где меньшинство превышает пятую часть населения, функции полиции передаются другим органам, а повстанцы сдают свое оружие коллекторам НАТО по амнистии."
 FYR_political.2.a: "Разделение власти лучше, чем война"
 FYR_political.3.t: "Соглашение Преспа"
 FYR_political.3.d: "На берегу озера Преспа переговорщики из Скопье и Афин парафировали сделку, которая положит конец многолетнему спору о названии. Страна станет Республикой Северная Македония, а взамен Греция снимет свое вето на переговоры о членстве в НАТО и вступлении в ЕС."
 FYR_political.3.a: "Подпишите и встаньте на евроатлантический путь"
 FYR_political.3.b: "Мы не будем переименовывать нашу нацию"