 ukraine_develop_btr4.1.name: "Choose 'BTR-4' combat role"
 ukraine_develop_btr4.1.desc: "We can choose the desired role for this equipment - lighter and cheaper APC or more expensive and heavily armed IFV.\nOur decsion will influence what Battalions will be equipped with BTR-4: Mechanized or Armored.\nWe will have an option to produce basically the same equipment type but in opposite role if we want to."
 ukraine_develop_btr4.1.a: "APC"
 ukraine_develop_btr4.1.b: "IFV"
 ukraine_develop_btr4.2.name: "Choose primary weapons for 'BTR-4' APC"
 ukraine_develop_btr4.2.desc: "We can choose the desired main armament for BTR-4 APC.\nIf we want to cut production costs, we can select machine gun, but if we want to maximise its combat effectiveness - we can choose to select among a handful of available heavier weapons modules."
 ukraine_develop_btr4.2.a: "Machine gun only"
 ukraine_develop_btr4.2.b: "Weapons module"
 ukraine_develop_btr4.3.name: "Choose weapons module for 'BTR-4' APC"
 ukraine_develop_btr4.3.desc: "We can choose the desired weapons module for BTR-4 APC.\n\n§YBM-1B 'Hrim'§! armament: 1x 30 mm automatic cannon, 1x 30 mm automatic grenade launcher, 1x 7.62 mm coaxial machine gun, 4x 9P135M 'Konkurs' or 'Barier' AT missiles.\n\n§YKBA-105 'Shkval'§! armament: 1x 30 mm automatic cannon, 1x 7.62 mm coaxial machine gun, 4x 9P135M 'Konkurs' or 'Barier' AT missiles (optional 1x 30 mm automatic grenade launcher with reduction to 2x AT missiles).\n\n§YBAU 23x2§! armament: 2x 23x152 mm automatic cannons, 1x 7.62 mm coaxial machine gun."
 ukraine_develop_btr4.3.a: "BM-1B 'Hrim'"
 ukraine_develop_btr4.3.b: "KBA-105 'Shkval'"
