 ural_event.3.a: "유감이군"
 ural_event.4.t: "우랄 [URA.GetNameWithFlag] 투자"
 ural_event.4.d: "[URA.GetFlag]우랄 정부가 협력과 동반자 관계 발전을 위해 자신들의 지역에 대한 투자 협정을 체결할 것을 제안했습니다."
 ural_event.4.a: "물론이지"
 ural_event.4.b: "아니요"
 ural_event.5.t: "벨라루스의 투자"
 ural_event.5.d: "그들이 투자 협정에 대한 우리의 제안에 동의했습니다."
 ural_event.5.a: "알았다"
 ural_event.6.t: "벨라루스의 투자"
 ural_event.6.d: "그들이 투자 협정에 대한 우리의 제안을 거부했습니다."
 ural_event.6.a: "유감이군"
 ural_event.7.t: "우랄, 공화국 선포"
 ural_event.7.d: "우랄 정부가 스베르들롭스크 영토에 다시 한번 우랄 공화국을 선포했습니다. 우리는 그들에게 이후 어떻게 할지 신속히 결정해야 하며, 그들이 그러한 자치를 얻도록 허용할 것입니까?"
 ural_event.7.a: "흠..."
 ural_event.8.t: "[URA.GetNameWithFlag]이(가) 우리 지역과의 통합을 요청"
 ural_event.8.d: "[URA.GetFlag]우랄 정부가 우리 지역 중 하나인 쿠르간 주와의 통합 계획을 마련했습니다. 그들은 양측의 통합이 이 지역의 경제적 잠재력을 강화하며 우리와 그들 모두에게 이익이 될 것이라고 설득합니다."
 ural_event.8.a: "물론이지"
 ural_event.8.b: "아니요"
 ural_event.9.t: "러시아 지역과의 통합"
 ural_event.9.d: "러시아 정부가 우리가 자신들의 지역 중 하나와 통합하는 것을 허용했습니다."
 ural_event.9.a: "멋지군!"
 ural_event.10.t: "러시아 지역과의 통합"
 ural_event.10.d: "[SOV.GetFlag]러시아 정부가 자신들의 지역 중 하나와의 통합을 요청한 우리의 요청을 거부했습니다."
 ural_event.10.a: "유감이군"
 ural_event.11.t: "[URA.GetNameWithFlag]이(가) 우리 지역과의 통합을 요청"
 ural_event.11.d: "[URA.GetFlag]우랄 정부가 우리 지역 중 하나인 첼랴빈스크 주와의 통합 계획을 마련했습니다. 그들은 양측의 통합이 이 지역의 경제적 잠재력을 강화하며 우리와 그들 모두에게 이익이 될 것이라고 설득합니다."
 ural_event.11.a: "물론이지"
 ural_event.11.b: "아니요"
 ural_event.12.t: "러시아 지역과의 통합"
 ural_event.12.d: "러시아 정부가 우리가 자신들의 지역 중 하나와 통합하는 것을 허용했습니다."
 ural_event.12.a: "멋지군!"
 ural_event.13.t: "[URA.GetNameWithFlag]이(가) 우리 지역과의 통합을 요청"
 ural_event.13.d: "[URA.GetFlag]우랄 정부가 우리 지역 중 하나인 오렌부르크 주와의 통합 계획을 마련했습니다. 그들은 양측의 통합이 이 지역의 경제적 잠재력을 강화하며 우리와 그들 모두에게 이익이 될 것이라고 설득합니다."
 ural_event.13.a: "물론이지"
 ural_event.13.b: "아니요"
 ural_event.14.t: "러시아 지역과의 통합"
 ural_event.14.d: "러시아 정부가 우리가 자신들의 지역 중 하나와 통합하는 것을 허용했습니다."
 ural_event.14.a: "멋지군!"
 ural_event.15.t: "[URA.GetNameWithFlag]이(가) 우리 지역과의 통합을 요청"
 ural_event.15.d: "[URA.GetFlag]우랄 정부가 우리 지역 중 하나인 페름 주와의 통합 계획을 마련했습니다. 그들은 양측의 통합이 이 지역의 경제적 잠재력을 강화하며 우리와 그들 모두에게 이익이 될 것이라고 설득합니다."
 ural_event.15.a: "물론이지"
 ural_event.15.b: "아니요"
 ural_event.16.t: "러시아 지역과의 통합"
 ural_event.16.d: "러시아 정부가 우리가 자신들의 지역 중 하나와 통합하는 것을 허용했습니다."
 ural_event.16.a: "멋지군!"
 ural_event.17.t: "[URA.GetNameWithFlag]과(와)의 군사 훈련"
 ural_event.17.d: "[URA.GetName] 정부가 자국 영토에서 합동 훈련을 실시하자는 제안을 우리에게 보내왔습니다. 그들은 이를 통해 자국군을 발전시키려 합니다."
 ural_event.17.a: "동의한다"
 ural_event.17.b: "아니요"
 ural_event.18.t: "[GER.GetNameWithFlag]과(와)의 군사 훈련"
 ural_event.18.d: "독일 정부가 우리 군과 합동 훈련을 실시하는 데 동의했습니다."
 ural_event.18.a: "알았다"
 ural_event.19.t: "우리의 제안"
 ural_event.19.d: "독일 정부가 우리의 제안을 거부했습니다. 이렇게 좋은 거래를 놓쳐 실망스럽습니다."
 ural_event.19.a: "유감이군"
 ural_event.20.t: "[URA.GetNameWithFlag]과(와)의 무역 거래"
 ural_event.20.d: "[URA.GetName] 정부가 대규모 무역 거래를 제안했습니다. 이에 따라 우리는 그들의 산업에 접근할 수 있게 되며, 그 대가로 우리는 그들의 영토에 공장을 건설하는 데 투자할 준비가 되어 있습니다."
 ural_event.20.a: "동의한다"
 ural_event.20.b: "아니요"
 ural_event.21.t: "[GER.GetNameWithFlag]과(와)의 무역 거래"
 ural_event.21.d: "독일 정부가 우리의 제안에 동의했습니다."
 ural_event.21.a: "알았다"
 ural_event.22.t: "[URA.GetNameWithFlag]의 인프라 건설"
 ural_event.22.d: "[URA.GetName] 정부는 우리를 지역 인프라 건설에 대규모로 참여시키려 합니다. 이 거래는 이 지역에서 우리의 영향력을 크게 강화하고 우랄의 산업 기업들과의 협력을 확대할 것입니다."
 ural_event.22.a: "동의한다"
 ural_event.22.b: "아니요"
 ural_event.23.t: "[URA.GetNameWithFlag]의 인프라 건설"
 ural_event.23.d: "독일 정부가 우리의 제안에 동의했습니다."
 ural_event.23.a: "알았다"
 ural_event.24.t: "[URA.GetNameWithFlag]과(와)의 무역 거래"
 ural_event.24.d: "[URA.GetName] 정부가 2년 동안 자국의 생산 시설을 제공하는 거래를 제안했습니다. 우랄의 군수 공장은 세계 최고 수준으로 평가받는데, 우리는 동의하겠습니까?"
 ural_event.24.a: "동의한다"
 ural_event.24.b: "아니요"
 ural_event.25.t: "[FROM.GetNameWithFlag]과(와)의 무역 거래"
 ural_event.25.d: "그들이 우리의 제안에 동의했습니다."
 ural_event.25.a: "알았다"
 ural_event.26.t: "우리의 제안"
 ural_event.26.d: "그들의 정부가 우리 제안을 거절했습니다. 이렇게 좋은 거래를 놓쳐 아쉽습니다"
 ural_event.26.a: "안타깝군"
 ural_event.27.t: "쿠르간 주민투표"
 ural_event.27.d: "[FROM.GetNameWithFlag](이)가 쿠르간 지역의 통합 주민투표를 실시했습니다. 주민 과반수가 이 안건에 찬성표를 던졌습니다. 우리는 이 지역을 편입할 준비가 되어 있습니까?"
 ural_event.27.a: "예"
 ural_event.27.b: "아니요"
 ural_event.28.t: "쿠르간 주민투표"
 ural_event.28.d: "연방 정부가 쿠르간 지역의 우리 체제 편입을 승인했습니다."
 ural_event.28.a: "좋군"
 ural_event.29.t: "주민투표 결과 처리 현황"
 ural_event.29.d: "연방 정부가 주민투표 결과의 수용을 거부했습니다."
 ural_event.29.a: "안타깝군"
 ural_event.30.t: "첼랴빈스크 주민투표"
 ural_event.30.d: "[FROM.GetNameWithFlag](이)가 첼랴빈스크 지역의 통합 주민투표를 실시했습니다. 주민 과반수가 이 안건에 찬성표를 던졌습니다. 우리는 이 지역을 편입할 준비가 되어 있습니까?"
 ural_event.30.a: "예"
 ural_event.30.b: "아니요"
 ural_event.31.t: "첼랴빈스크 주민투표"
 ural_event.31.d: "연방 정부가 첼랴빈스크 지역의 우리 체제 편입을 승인했습니다."
 ural_event.31.a: "좋군"
 ural_event.32.t: "오렌부르크 주민투표"
 ural_event.32.d: "[FROM.GetNameWithFlag](이)가 오렌부르크 지역의 통합 주민투표를 실시했습니다. 주민 과반수가 이 안건에 찬성표를 던졌습니다. 우리는 이 지역을 편입할 준비가 되어 있습니까?"
 ural_event.32.a: "예"
 ural_event.32.b: "아니요"
 ural_event.33.t: "오렌부르크 주민투표"
 ural_event.33.d: "연방 정부가 오렌부르크 지역의 우리 체제 편입을 승인했습니다."
 ural_event.33.a: "좋군"
 ural_event.34.t: "페름 주민투표"
 ural_event.34.d: "[FROM.GetNameWithFlag](이)가 페름 지역의 통합 주민투표를 실시했습니다. 주민 과반수가 이 안건에 찬성표를 던졌습니다. 우리는 이 지역을 편입할 준비가 되어 있습니까?"
 ural_event.34.a: "예"
 ural_event.34.b: "아니요"
 ural_event.35.t: "페름 주민투표"
 ural_event.35.d: "연방 정부가 페름 지역의 우리 체제 편입을 승인했습니다."
 ural_event.35.a: "좋군"
 ural_event.36.t: "[KHM.GetName] 주민투표"
 ural_event.36.d: "[FROM.GetNameWithFlag](이)가 [KHM.GetName]의 통합 주민투표를 실시했습니다. 주민 과반수가 이 안건에 찬성표를 던졌습니다. 우리는 이 지역을 편입할 준비가 되어 있습니까?"
 ural_event.36.a: "예"
 ural_event.36.b: "아니요"
 ural_event.37.t: "[KHM.GetName] 주민투표"
 ural_event.37.d: "연방 정부가 [KHM.GetName]의 우리 체제 편입을 승인했습니다."
 ural_event.37.a: "좋군"
 ural_event.38.t: "서부 카자흐스탄의 무장 봉기"
 ural_event.38.d: "우랄 카자크가 우랄 정부의 지원을 받아 무장 봉기를 조직하는 데 성공했으며, 이 땅은 과거 우랄 카자크의 영토였다고 주장하며 이 지역을 되찾으려 하고 있습니다. 우리는 이들을 진압해야 합니다!"
 ural_event.38.a: "분리주의자들은 용납할 수 없다"
 ural_event.39.t: "영토 일부 매각"
 ural_event.39.d: "특출한 인물인 안톤 바코프가 이끄는 [URA.GetNameWithFlag] 정부가 자국 용도로 우리 영토의 일부를 매입하려 합니다. 이것이 장차 우리에게 영향력을 행사하는 수단이 될 수 있다는 점을 인식해야 합니다."
 ural_event.39.a: "그들에게 팔겠다"
 ural_event.39.b: "아니요"
 ural_event.40.t: "영토 일부 매각"
 ural_event.40.d: "그들이 우리에게 자국 영토의 일부를 팔 준비가 되어 있습니다."
 ural_event.40.a: "좋다"
 ural_event.41.t: "영토 일부 매각"
 ural_event.41.d: "그들이 자국 영토 일부를 매입하겠다는 우리의 제안을 거부했습니다."
 ural_event.41.a: "안타깝군"
 ural_event.42.t: "[URA.GetNameWithFlag], USAID 가입 희망"
 ural_event.42.d: "[URA.GetNameWithFlag] 정부가 USAID 프로그램 가입 요청을 보내왔습니다. 이 요청에 긍정적으로 응답할 준비가 되어 있습니까?"
 ural_event.42.a: "그들의 요청을 승인한다"
 ural_event.42.b: "아니요"
 ural_event.43.t: "USAID에 의해 승인된 우리의 신청"
 ural_event.43.d: "미국이 우리의 요청을 승인했으며, 이제 우리는 USAID 프로그램의 일원입니다."
 ural_event.43.a: "만세!"
