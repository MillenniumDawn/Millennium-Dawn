 CRO_political.1.t:0 "Haia indicia Gotovina"
 CRO_political.1.d:0 "O TPII tornou público um indiciamento contra o general Ante Gotovina por crimes cometidos durante a Operação Tempestade. Ele desapareceu antes que a prisão pudesse ser efetuada. Associações de veteranos estão se reunindo em protesto, e Bruxelas deixou claro que a cooperação com o tribunal é condição para a integração europeia."
 CRO_political.1.a:0 "Devemos cooperar com o tribunal"
 CRO_political.1.b:0 "A Croácia não extradita seus heróis"
 CRO_political.2.t:0 "Gotovina preso em Tenerife"
 CRO_political.2.d:0 "A polícia espanhola prendeu Ante Gotovina no restaurante de um hotel nas Ilhas Canárias após quatro anos foragido. Informações compartilhadas por Zagreb ajudaram a localizá-lo. Veteranos acendem velas na praça principal, mas o último obstáculo no caminho europeu foi removido."
 CRO_political.2.a:0 "Um passo doloroso, mas necessário"
 CRO_political.3.t:0 "Pedido de adesão à União Europeia"
 CRO_political.3.d:0 "O primeiro-ministro Ivica Račan apresentou formalmente em Atenas o pedido de adesão da Croácia à União Europeia. O governo espera alcançar a onda de adesões já em curso entre seus vizinhos do norte e deixar de vez para trás as guerras da década anterior."
 CRO_political.3.a:0 "Nosso lugar é na Europa"
 CRO_political.4.t:0 "Negociações de adesão iniciadas"
 CRO_political.4.d:0 "Depois que o promotor-chefe confirmou a plena cooperação da Croácia com o tribunal, a União Europeia abriu as negociações de adesão. A análise da legislação croata em relação ao acervo comunitário começa imediatamente, e os investidores estrangeiros estão atentos."
 CRO_political.4.a:0 "A análise começa"
 CRO_political.5.t:0 "Convite na Cúpula de Bucareste"
 CRO_political.5.d:0 "A cúpula da OTAN em Bucareste estendeu um convite formal à Croácia e à Albânia. Os protocolos de adesão devem ser assinados dentro do ano. O convite recompensa uma década de reforma da defesa e ancora a Croácia na aliança ocidental."
 CRO_political.5.a:0 "Um assento à mesa"
 CRO_political.6.t:0 "O caso Ina-MOL"
 CRO_political.6.d:0 "O ex-primeiro-ministro Ivo Sanader foi preso na Áustria após fugir da acusação. Os investigadores alegam que ele recebeu suborno da petrolífera húngara MOL para ceder direitos de gestão sobre a Ina, a empresa petrolífera nacional. O caso chega aos mais altos níveis do partido governante."
 CRO_political.6.a:0 "Ninguém está acima da lei"
 CRO_political.6.b:0 "Conter os danos"
 CRO_political.7.t:0 "Gotovina absolvido em apelação"
 CRO_political.7.d:0 "A câmara de apelações do TPII anulou as condenações dos generais Ante Gotovina e Mladen Markač e ordenou sua libertação imediata. A praça principal de Zagreb se encheu de multidões que os recebem em casa. Em Belgrado e Banja Luka, a decisão foi recebida com fúria."
 CRO_political.7.a:0 "Os generais voltam para casa"
 CRO_political.8.t:0 "Bem-vindos à União Europeia"
 CRO_political.8.d:0 "À meia-noite, a Croácia tornou-se o 28º Estado-membro da União Europeia, encerrando um processo de adesão de doze anos que sobreviveu a seis governos. Os postos alfandegários nas fronteiras com a Eslovênia e a Hungria estão sendo desmontados."
 CRO_political.8.a:0 "Um futuro europeu"
 CRO_political.9.t:0 "Schengen e o euro"
 CRO_political.9.d:0 "A Croácia adotou o euro e ingressou no espaço Schengen no mesmo dia, o primeiro Estado-membro a concluir as duas etapas ao mesmo tempo. Os controles de fronteira com o resto do bloco acabaram, e a kuna entra para a história. O setor de turismo espera uma temporada recorde."
 CRO_political.9.a:0 "Finalmente integrados por completo"
 CRO_political.10.t:0 "Herzeg-Bósnia declara independência"
 CRO_political.10.d:0 "Os cantões croatas da Herzegovina proclamaram uma Herzeg-Bósnia autônoma e cortaram seus laços com Sarajevo. Zagreb deve decidir até onde ir no apoio ao movimento separatista."
 CRO_political.10.a:0 "Reconhecer a Herzeg-Bósnia"
 CRO_political.10.b:0 "Enviar apoio discreto"
