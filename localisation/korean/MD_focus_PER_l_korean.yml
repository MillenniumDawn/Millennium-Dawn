 PER_new_majlis: "마즐리스"
 PER_new_majlis_desc: "[PER.GetFlag] §H마즐리스§!는 우리나라의 의회이며, 어떤 법이 생기고 사라질지를 좌우하기에 종종 우리의 필요에 반하는 결정을 내릴 수 있습니다. 국민은 선거 주기마다 [PER.GetFlag] §H마즐리스§!의 대표를 투표로 선출하며, 의석은 합법화된 정당에 인기도에 따라 배분됩니다. 금지된 정당에 돌아갔어야 할 의석은 알려지지 않은 의제를 추구하는 §H무소속§! 후보가 차지하게 됩니다.\n\n몇 달마다 [PER.GetFlag] §H마즐리스§!는 §H토론§!을 열며, 여기서 우리는 이익을 대가로 의석을 가진 정당들에 특정 개혁을 약속할 수 있습니다. 약속을 하고도 이행하지 않으면 그 결과를 감수해야 합니다. [PER.GetFlag] §H마즐리스§!는 언제든 우리가 시행한 법 변경에 이의를 제기할 수 있으며, 우리의 변경을 되돌리라고 요구할 수도 있습니다.\n\n[PER_majlis_0][PER_majlis_1][PER_majlis_2][PER_majlis_3][PER_majlis_4][PER_majlis_5][PER_majlis_6][PER_majlis_7][PER_majlis_8][PER_majlis_9][PER_majlis_10][PER_majlis_11][PER_majlis_12][PER_majlis_13][PER_majlis_14][PER_majlis_15][PER_majlis_16][PER_majlis_17][PER_majlis_18][PER_majlis_19][PER_majlis_20][PER_majlis_21][PER_majlis_22][PER_majlis_23][PER_majlis_IND_MP]마즐리스 총 의석 - [?ROOT.PER_majlis_total_seats|Y0]\n다음 선거: [?ROOT.PER_election_var|Y0]개월 후\n다음 토론: [?ROOT.PER_session_var|Y0]개월 후"
