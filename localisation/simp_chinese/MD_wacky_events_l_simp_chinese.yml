l_simp_chinese:
 MD_wacky.1.t: "圣诞夜的未注册接触"
 MD_wacky.1.d: "防空部队在午夜过后不久追踪到一个低空、缓慢越境的目标，并在未发出警告的情况下将其击落。回收小组报告称，他们发现了一辆雪橇、九头驯鹿和一个装满包裹的大袋子。"
 MD_wacky.1.a: "对残骸进行分类。"
 MD_wacky.1.b: "向孩子们道歉。"
 MD_wacky.2.t: "首都上空出现不明物体"
 MD_wacky.2.d: "数千人拍摄到一盏静默的三角形灯光在政府区上空停留了11分钟。空军坚称其雷达根本没有探测到任何异常。"
 MD_wacky.2.a: "扰乱拦截机。"
 MD_wacky.2.b: "宣布那是一个气象气球。"
 MD_wacky.3.t: "太空碎片坠落在部级停车场"
 MD_wacky.3.d: "一枚来自报废通信卫星的钛合金燃料箱昨夜坠落，压扁了三辆公务车和一排树篱。所幸无人受伤，也没有任何航天机构承认这颗卫星属于谁。"
 MD_wacky.3.a: "通知发射国"
 MD_wacky.3.b: "把它放到博物馆里去。"
 MD_wacky.4.t: "自动售货机瘫痪了部委网络"
 MD_wacky.4.d: "内政部花了一周时间追踪一起外国网络攻击，之后技术人员才将流量追踪到该建筑自身的智能自动售货机，这些售货机一直在悄悄地无限循环地重新订购碳酸饮料。"
 MD_wacky.4.a: "拔掉大楼里所有机器的电源。"
 MD_wacky.4.b: "让媒体相信这是外国势力所为。"
 MD_wacky_events: "古怪事件"
 MD_wacky_classified_intercept: "分类拦截"
 MD_wacky_classified_intercept_desc: "此次交战并未记录在任何已公布的战报中，参与交战的人员也被告知不得讨论目标的形状。然而，机炮摄像机的录像却是极佳的训练素材。"
 MD_wacky_ufo_conspiracy: "气象气球的解释"
 MD_wacky_ufo_conspiracy_desc: "没人相信官方声明。两个相互对立的公民委员会分别发布了内容相左的摄影分析报告，一家电视台也委托制作了一部关于政府保持沉默的纪录片。"
 MD_wacky_debris_exhibit: "再入大气层碎片展览"
 MD_wacky_debris_exhibit_desc: "这个燃料箱被放置在国家博物馆里，旁边是它撞击过的三辆车的照片。参观人数有所增加，而且现在有相当多的来访学生表示他们打算学习工程学。"
 MD_wacky_phantom_cyber_threat: "幽灵网络威胁"
 MD_wacky_phantom_cyber_threat_desc: "该部从未澄清有关外国入侵的说法，紧急网络安全预算也未经任何质疑便获得批准。自动售货机已从大楼内移除。"