l_korean:
 vatican_focus: "바티칸 중점 계통도"
 crusader_pope: "십자군 교황"
 caliph_pope: "새로운 칼리파"
 HLS_idea_vatican_library: "바티칸 도서관"
 HLS_idea_vatican_library_desc: "바티칸 도서관은 세계에서 가장 오래된 필사본 소장품 중 하나를 보유하고 있습니다. 완벽한 상태로 보존하려면 끊임없는 관리와 비용이 들지만, 여전히 교황청의 기념비로 남아 있습니다.\n§W--------------§!\n§Y$HLS_refurbish_the_vatican_library$§! 중점을 완료하면 이 국가 정신이 §G개선§!됩니다."
 HLS_idea_refurbished_vatican_library: "복원된 바티칸 도서관"
 HLS_idea_refurbished_vatican_library_desc: "복원된 바티칸 도서관은 관리 부담이 줄었으며, 열람실을 전 세계 학자들에게 개방했습니다."
 HLS_idea_rise_of_islam: "이슬람의 부상"
 HLS_idea_rise_of_islam_desc: "가톨릭의 본산이 새로운 신앙, 그것도 가장 뜻밖의 신앙을 받아들였습니다. 이제 교황은 성 베드로 대성당의 발코니에서 알라의 말씀을 설교합니다."
 HLS_idea_holy_soldiers: "십자군"
 HLS_idea_holy_soldiers_desc: "우리 병사들은 십자군이라는 칭호를 지닙니다. 열정이 본토에서의 결의를 굳건히 해 주지만, 이들을 이끄는 성직자들은 정치에 대한 인내심이 거의 없습니다."
 HLS_idea_allahs_will: "알라의 뜻"
 HLS_idea_allahs_will_desc: "신병들이 바티칸 칼리파국으로 몰려듭니다. 훈련받은 이는 드물지만, 신념이 부족한 이는 아무도 없습니다."
 HLS_idea_holy_war: "바티칸과의 전쟁"
 HLS_idea_holy_war_desc: "우리는 교황청과 전쟁 중입니다. 교황청은 이 분쟁을 성전으로 선포했지만 유럽의 나머지 나라들에 무기를 들라고 호소하지는 않았습니다."
 HLS_idea_global_crusade_target: "십자군 원정의 표적"
 HLS_idea_global_crusade_target_desc: "교황이 우리를 겨냥한 십자군 원정을 선포했으며, 유럽 국가들에 이에 참여해 달라고 요청했습니다."
 HLS_idea_fortress_vatican: "요새 바티칸"
 HLS_idea_fortress_vatican_desc: "바티칸은 철저히 요새화되었습니다. 교황의 적이라면 누구든 그 성벽을 뚫기 어려울 것입니다."
 HLS_idea_religious_recruits: "종교 신병"
 HLS_idea_religious_recruits_desc: "신자들이 교황청을 위해 싸우기를 원합니다. 대부분 소총을 쥐어 본 적이 없어 훈련하는 데 시간이 걸립니다."
 HLS_idea_rejected_islam: "이슬람 규탄"
 HLS_idea_rejected_islam_desc: "교황이 이슬람을 공식적으로 규탄했으며, 이슬람 세계와의 관계가 무너졌습니다."
 HLS_idea_accepted_islam: "이슬람 수용"
 HLS_idea_accepted_islam_desc: "교황이 이슬람을 자매 신앙으로 공식 인정하여 두 종교 관계에 새로운 장을 열었습니다."
 HLS_idea_crusader_state: "십자군 국가"
 HLS_idea_crusader_state_desc: "교황이 바티칸을 다시 한번 십자군 국가로 선포했습니다."
 HLS_idea_italian_power_supply: "이탈리아 전력 공급 협정"
 HLS_idea_italian_power_supply_desc: "바티칸은 전력의 거의 전부를 이탈리아에서 구입합니다. 이탈리아 전력 회사들과의 장기 공급 협정 덕분에 성 베드로 대성당의 불빛이 적정 가격으로 유지됩니다."
 HLS_idea_carbon_neutral_state: "최초의 탄소 중립 국가"
 HLS_idea_carbon_neutral_state_desc: "바티칸은 해외에 숲을 조성하여 배출량을 상쇄하며, 신자들에게 피조물을 돌보라고 설교합니다. 청정에너지 사업은 쿠리아 안에서 후한 후원자를 찾습니다."
 HLS_idea_papal_diplomacy: "교황 외교"
 HLS_idea_papal_diplomacy_desc: "교황 대사들이 세계 거의 모든 수도에 주재합니다. 교황의 특사와의 면담을 거부하는 정부는 드뭅니다."
 HLS_idea_vatican_observatory: "스페콜라 바티카나"
 HLS_idea_vatican_observatory_desc: "바티칸 천문대는 세계에서 가장 오래된 천문 연구 기관 중 하나입니다. 예수회 소속 천문학자들이 교황청에 어느 나라도 쉽게 견줄 수 없는 과학적 명성을 안겨 줍니다."
 HLS_idea_lacks_an_army: "전문 군대 부재"
 HLS_idea_lacks_an_army_desc: "바티칸은 스위스 근위대와 헌병대 외의 무장 병력이 필요했던 적이 없으며, 이를 양성할 기관도 없습니다.\n§W--------------§!\n§Y$HLS_question_of_the_land_forces$§! 중점을 완료하면 이 국가 정신이 §G개선§!됩니다."
 HLS_idea_forming_an_army: "군대 창설"
 HLS_idea_forming_an_army_desc: "교황청에 걸맞은 군대를 일으킬 때가 왔습니다."
 HLS_idea_swiss_guard_reform: "스위스 근위대 개혁"
 HLS_idea_swiss_guard_reform_desc: "스위스 근위대는 교황에게만 충성하며 다른 누구에게도 충성하지 않습니다. 이를 정식 군대로 확대하면 수 세기에 걸친 규율을 토대로 삼을 수 있습니다."
 HLS_idea_fanatics_reform: "광신도 군대"
 HLS_idea_fanatics_reform_desc: "신앙은 우리가 풍부하게 가진 유일한 자원입니다. 광신도 군대는 대열을 이루어 싸우는 법만 익힌다면 지원자가 부족할 일이 없습니다."
 HLS_idea_papal_states: "교황령"
 HLS_idea_papal_states_desc: "교황은 다시 세속의 군주가 되어, 성 베드로 대성당 성벽 뒤 몇 에이커의 땅을 훨씬 넘어서는 영토를 다스립니다. 이제 교회는 이끌어야 할 신자들뿐 아니라 통치해야 할 국가도 갖게 되었습니다."
 HLS_idea_roman_curia: "로마 쿠리아"
 HLS_idea_roman_curia_desc: "쿠리아는 국무원에서 바티칸 은행에 이르는 교황청의 행정 조직입니다. 쿠리아가 제 기능을 하면 교회 전체가 움직이고, 그렇지 않으면 아무것도 움직이지 않습니다."
 HLS_idea_pilgrim_pope: "순례하는 교황"
 HLS_idea_pilgrim_pope_desc: "우리는 세계가 로마로 오기를 기다리지 않습니다. 교황이 마닐라의 빈민가에서 바르샤바의 광장까지 세계로 나아가며, 그가 내리는 곳마다 군중이 모여듭니다."
 HLS_idea_moral_authority: "도덕적 권위"
 HLS_idea_moral_authority_desc: "우리는 군대를 거느리지 않지만, 교황이 말하면 국가 원수들은 여전히 귀를 기울입니다. 우리의 목소리가 멀리 닿는 것은 한 번도 목소리를 높일 필요가 없었기 때문입니다."
 we_are_the_true_vatican: "진정한 바티칸"
 agreed_to_our_aid: "우리의 원조를 수락함"
 disagreed_to_our_aid: "우리의 원조를 거절함"
 accepted_islam: "이슬람을 받아들임"
 rejected_islam: "이슬람을 거부함"
 HLS_decision_category: "교황 성하의 의제"
 HLS_decision_category_desc: "[HLS.GetLeader]은(는) 성 베드로 보좌의 권위를 지니고 있습니다. 쿠리아는 그의 결정을 기다립니다."
 HLS_ask_for_more_swiss_guard_unit: "스위스 근위대 추가 요청"
 HLS_ask_for_more_swiss_guard_unit_desc: "스위스인들은 1506년부터 교황을 지켜 왔습니다. 교황청이 성장할수록 이들의 보호가 필요한 정도도 커집니다."
 HLS_ask_for_more_swiss_guard_tt: "§Y스위스§!에 §Y스위스 근위대§! 사단 하나를 더 보내 달라고 요청합니다."
 HLS_accept_islam: "이슬람 수용"
 HLS_accept_islam_desc: "이슬람과 기독교의 관계는 우리 시대의 큰 논쟁 중 하나입니다. 바티칸의 공식 인정은 이슬람 세계에 평화의 비둘기를 날려 보내는 일이 될 것입니다."
 HLS_accept_islam_tooltip: "모든 이슬람 국가가 우리를 더 좋게 보게 되며, 우리도 그들을 더 좋게 봅니다."
 HLS_condemn_islam: "이슬람 규탄"
 HLS_condemn_islam_desc: "쿠리아 일각에서는 교황이 이슬람을 노골적으로 비난하여 수십 년간의 종교 간 대화와 결별하기를 바랍니다."
 HLS_condemn_islam_tooltip: "모든 이슬람 국가가 우리를 더 나쁘게 보게 됩니다. §Y$HLS_anti_islamist_crusade$§! 중점이 잠금 해제되고 §Y$HLS_a_dark_path$§! 중점이 닫힙니다."
 HLS_general_audience: "일반 알현 개최"
 HLS_general_audience_desc: "매주 교황은 성 베드로 광장에서 군중에게 말씀을 전합니다. 훌륭한 알현은 우리의 위상을 높이지만, 잘못 고른 한마디는 우리를 공격하는 데 쓰일 수 있습니다."
 HLS_convene_a_consistory: "추기경 회의 소집"
 HLS_convene_a_consistory_desc: "추기경 회의는 추기경단을 교황 주위에 모읍니다. 잘 운영된 회의는 교회의 제후들이 충성을 지키게 하고 쿠리아를 단속합니다."
 HLS_convene_the_ulema: "울라마 소집"
 HLS_convene_the_ulema_desc: "바티칸 칼리파국을 이끄는 학자들은 칼리파가 자신들의 조언을 구하기를 기대합니다. 이들을 로마에 모으면 새로운 신앙이 믿을 만한 손에 있다는 안도감을 줄 수 있습니다."
 HLS_rename_istanbul: "이스탄불을 콘스탄티노폴리스로 개칭"
 HLS_rename_istanbul_desc: "이 도시는 1453년 이후 기독교 통치자 아래에 있은 적이 없습니다. 다시 우리 것이 된 지금, 옛 이름을 되찾아야 합니다."
 HLS_religious_recruits_decision: "종교 지원병 모집"
 HLS_religious_recruits_decision_desc: "우리는 작은 나라이지만, 유럽 전역의 신자들이 신의 군대에 입대하기를 열망합니다."
 HLS_religious_recruits_tt: "수도에 §G성전사§! 사단 §Y5§!개가 생성됩니다."
 HLS_international_jihadists_decision: "외국인 전사 모집"
 HLS_international_jihadists_decision_desc: "이슬람 세계 곳곳의 지원자들이 바티칸 칼리파국을 위해 복무하기를 원합니다. 그들이 스스로 조직하기 전에 우리가 먼저 조직해야 합니다."
 HLS_international_jihadists_decision_tt: "수도에 §G파디윈 릴 바이트 알마크디스§! 사단 §Y5§!개가 생성됩니다."
 vatican.1.t: "통합을 요구하는 바티칸"
 vatican.1.d: "교황청이 우리에게 이탈리아 공화국을 해체하고 교황령에 합류하여, 교황에게 우리 땅에 대한 전권을 넘기라고 명령했습니다."
 vatican.1.o1: "신을 위해서라면 무엇이든."
 vatican.1.o2: "절대 안 된다!"
 vatican.2.t: "이탈리아의 동의"
 vatican.2.d: "[FROM.GetNameDefCap]이(가) 우리와의 합류에 동의했습니다. 교황령이 부활했으며, 로마는 다시 한번 기독교 왕국의 수도가 되었습니다."
 vatican.2.o1: "훌륭하다!"
 vatican.3.t: "이탈리아의 거부"
 vatican.3.d: "[FROM.GetNameDefCap]이(가) 스스로를 해체하기를 거부했습니다. 여전히 우리의 속국이지만, 이 거부로 쿠리아는 체면을 구겼습니다."
 vatican.3.o1: "그들은 이를 후회하게 될 것이다."
 vatican.4.t: "우리를 겨냥한 십자군 원정을 선포한 바티칸"
 vatican.4.d: "교황청이 반이슬람주의 십자군 원정을 선포하고 우리 정부를 적으로 지목했습니다. 교황은 우리에게 굴복할 것을 요구합니다."
 vatican.4.o1: "대가를 치르게 하겠다."
 vatican.5.t: "십자군 원정, 아니면 성전?"
 vatican.5.d: "우리는 주의 이름으로 [FROM.GetNameDef]와(과) 전쟁에 돌입합니다. 십자군 원정을 선포하여 동맹국과 유럽 국가들을 무장시킬까요, 아니면 이 전쟁을 우리만의 전쟁으로 둘까요?"
 vatican.5.o1: "이것은 우리의 싸움이다."
 vatican.5.o2: "[FROM.GetNameDef]에 맞서 하나로 뭉치자!"
 vatican.6.t: "우리에게 충성을 요구하는 바티칸"
 vatican.6.d: "교황청이 전례 없는 조치로 이탈리아 정부에 교황을 세속 군주로 받아들이고 공화국을 바티칸의 권위 아래 둘 것을 요구했습니다."
 vatican.6.o1: "우리는 교황 성하께 복종합니다."
 vatican.6.o2: "터무니없는 일이다."
 vatican.7.t: "십자군 원정 선포 여부"
 vatican.7.d: "우리는 이제 [FROM.GetNameDef]와(과) 전쟁 중입니다. 유럽의 기독교 국가들과 동맹국들을 십자군 원정으로 이 전쟁에 참여하도록 소집할까요?"
 vatican.7.o1: "아니, 이것은 우리의 전쟁이다."
 vatican.7.o2: "그렇다, 함께하면 우리는 강하다!"
 vatican_holy_war_event_tooltip: "이 전쟁을 §Y십자군 원정§!으로 선포합니다. 살라피주의가 아닌 모든 유럽 국가와 우리 세력의 모든 구성원이 대상국과의 전쟁에 참여하도록 초청받습니다."
 vatican.10.t: "원조를 제안하는 바티칸 칼리파국"
 vatican.10.d: "바티칸 칼리파국이 이슬람 국가들에 무기와 자금, 보호를 제공하겠다고 제안하며, 그들의 적에 맞선 신자들의 동맹을 약속했습니다."
 vatican.10.o1: "수락한다."
 vatican.10.o2: "우리끼리가 낫다."
 vatican.11.t: "우리를 십자군 원정으로 부르는 교황"
 vatican.11.d: "[HLS.GetLeader]이(가) [FROM.GetNameDef]을(를) 겨냥한 십자군 원정을 선포하고, 유럽의 모든 기독교 국가에 무기를 들거나 교황청에 지원을 보내 달라고 요청했습니다."
 vatican.11.o1: "신이 원하신다!"
 vatican.11.o2: "약간의 지원을 보내겠다."
 vatican.11.o3: "말도 안 된다, 지금이 21세기다!"
 vatican.12.t: "우리를 겨냥해 선포된 십자군 원정"
 vatican.12.d: "교황이 유럽 국가들에 우리에게 전쟁을 선포해 달라고 요청하고 있습니다. 최악의 사태에 대비해야 합니다."
 vatican.12.o1: "어디 해 보라지!"
 vatican.13.t: "스위스 근위대 증원을 요청하는 교황"
 vatican.13.d: "교황청이 우리에게 교황청 스위스 근위대 부대 하나를 더 보내 바티칸 시국에 상주하게 해 달라고 요청했습니다."
 vatican.13.o1: "교황님을 위해서라면? 물론이지!"
 vatican.13.o2: "충분히 보호받고 있다."
 vatican.14.t: "근위대를 더 보내 준 스위스"
 vatican.14.d: "우리의 요청이 받아들여졌습니다. 스위스 근위대의 새 부대가 우리 성벽 안에 주둔하기 시작했습니다."
 vatican.14.o1: "좋은 소식이다!"
 vatican.15.t: "스위스의 거부"
 vatican.15.d: "스위스가 이번에는 스위스 근위대를 더 보내는 것을 거절했습니다."
 vatican.15.o1: "아마 여유 병력이 생기면 보내겠지."
 vatican.16.t: "교황의 종주권을 받아들인 이탈리아"
 vatican.16.d: "모든 예상을 뒤엎고 [FROM.GetNameDef]이(가) 교황을 군주로 받아들였습니다. 로마는 다시 한번 바티칸에 복종합니다."
 vatican.16.o1: "신의 뜻이 이루어지리라."
 vatican.17.t: "교황의 종주권을 거부한 이탈리아"
 vatican.17.d: "[FROM.GetNameDefCap]이(가) 우리의 요구를 단호히 거부했습니다. 이탈리아가 자발적으로 복종하지 않는다면 복종하게 만들어야 합니다."
 vatican.17.o1: "그렇다면 힘으로 빼앗겠다."
 vatican.18.t: "희년을 맞아 로마로 밀려드는 순례자들"
 vatican.18.d: "교황이 희년을 선포하자 수백만 명의 순례자가 성 베드로 대성당의 성문을 통과하기 위해 로마로 쏟아져 들어오고 있습니다. 쿠리아는 이 인파를 어떻게 맞이할지 결정해야 합니다."
 vatican.18.o1: "모든 순례자를 환영한다."
 vatican.18.o2: "희년을 엄숙하고 질서 있게 치른다."
 vatican.19.t: "세계청년대회 개최지"
 vatican.19.d: "모든 대륙의 젊은 가톨릭 신자들이 세계청년대회를 위해 교황 주위에 모일 준비를 마쳤습니다. 쿠리아는 개최 지역을 골라야 하며, 이 선택은 교회가 미래를 어디에서 찾는지를 잘 보여 줄 것입니다."
 vatican.19.o1: "유럽에서 개최한다."
 vatican.19.o2: "아메리카에서 개최한다."
 vatican.19.o3: "아프리카와 아시아에서 개최한다."
 vatican.20.t: "아시시의 평화 기도회"
 vatican.20.d: "우리는 성 프란치스코의 도시 아시시에서 평화를 위해 기도하도록 세계 종교 지도자들을 초청했습니다. 누구를 초대할지를 두고 쿠리아의 의견이 갈립니다."
 vatican.20.o1: "모든 종교의 지도자를 초청한다."
 vatican.20.o2: "기독교 교파만 초청한다."
 vatican.21.t: "개혁과 전통을 논의하는 시노드"
 vatican.21.d: "모든 대륙의 주교들이 교회의 미래를 논의하기 위해 로마에 모였습니다. 개혁파는 더 열린 교회를 원하고, 전통파는 전해 내려온 것을 버리는 일을 경계합니다."
 vatican.21.o1: "개혁을 받아들인다."
 vatican.21.o2: "전통을 지킨다."
 vatican.21.o3: "타협을 모색한다."
 vatican.22.t: "쿠리아 재정을 폭로한 유출 문건"
 vatican.22.d: "바티칸 은행에 관한 기밀 문건이 언론에 흘러 들어가, 의심스러운 계좌와 기부자들이 거명되었습니다. 유럽 전역의 편집자들이 교황청에 해명을 요구하고 있습니다."
 vatican.22.o1: "장부를 공개하고 유출자를 기소한다."
 vatican.22.o2: "덮어 버린다."
 vatican_news.1.t: "십자군 원정을 선포한 교황"
 vatican_news.1.d1: "교황이 최근 이슬람을 규탄한 데 이어 [FROM.GetNameDef]을(를) 겨냥한 십자군 원정을 선포했습니다. 바티칸은 동맹국들에 즉시 참전할 것을 촉구합니다."
 vatican_news.1.d2: "교황이 우리의 신앙이 거짓이라고 선언하며 [FROM.GetNameDef]을(를) 겨냥한 이른바 십자군 원정을 선포했습니다. 알라께서 [FROM.GetName]에 힘을 주시고 교황을 굴복시키시기를."
 vatican_news.1.o1: "십자군 원정이라니? 지금이 1100년대인가?"
 vatican_news.1.o2: "인샬라."
 vatican_news.2.t: "이슬람을 인정한 교황"
 vatican_news.2.d1: "[HLS.GetLeader]이(가) 역사적인 발표를 통해 이슬람과 기독교가 신 앞에 평등하다고 선언하고, 모든 곳의 무슬림과의 지속적인 우정을 촉구했습니다."
 vatican_news.2.d2: "기독교인의 지도자 [HLS.GetLeader]이(가) 전 세계 앞에서 이슬람의 진리를 인정했습니다. 신자들 중 많은 이들이 이를 앞으로 올 일의 징조로 봅니다."
 vatican_news.2.o1: "둘 사이의 적대감이 줄어든다면 환영할 일이다."
 vatican_news.2.o2: "어쩌면 기독교와 이슬람이 나란히 설 수 있을지도 모른다."
 vatican_news.3.t: "이슬람을 규탄한 교황"
 vatican_news.3.d1: "[HLS.GetLeader]이(가) 수십 년간의 종교 간 대화를 저버리고 이슬람을 공식적으로 규탄했습니다. 중동의 여러 정부가 이미 바티칸을 향해 위협을 쏟아냈습니다."
 vatican_news.3.d2: "기독교인 교황 [HLS.GetLeader]이(가) 전 세계 앞에서 십억 무슬림의 신앙을 모욕했습니다. 우리는 이 중상모략을 그냥 넘기지 않을 것입니다."
 vatican_news.3.o1: "교황이 이슬람을 비난하다니? 다음엔 뭐, 십자군 원정이라도 하겠다는 건가?"
 vatican_news.3.o2: "교황은 이 말을 후회하게 될 것이다."
 vatican_news.4.t: "되살아난 콘스탄티노폴리스"
 vatican_news.4.d1: "[HLS.GetLeader]이(가) 이스탄불을 공식적으로 콘스탄티노폴리스로 개칭했습니다. 이 도시는 1453년 오스만에 함락되었고 1930년에 공식적으로 개칭되었으나, 이제 다시 기독교인의 손에 돌아왔습니다."
 vatican_news.4.d2: "교황이 정당한 주인으로부터 이스탄불을 빼앗은 뒤 콘스탄티노폴리스로 개칭했습니다. 이 모욕은 잊히지 않을 것입니다."
 vatican_news.4.o1: "더 나은 이름이다."
 vatican_news.4.o2: "교황의 손에 오래 머물지는 못할 것이다."
 holywar_wargoal: "성전"
 holywar_wargoal_desc: "교황청이 선포한 성전."
 holywar_wargoal_short_desc: "이 전쟁 목표는 교황이 이끄는 성전을 위한 것입니다."
 crusade_wargoal: "십자군 원정"
 crusade_wargoal_desc: "교황이 이 나라를 겨냥해 선포한 십자군 원정."
 crusade_wargoal_short_desc: "이 전쟁 목표는 교황이 선포한 십자군 원정을 위한 것입니다."
 jihad_wargoal: "지하드"
 jihad_wargoal_desc: "바티칸 칼리파국이 선포한 지하드."
 jihad_wargoal_short_desc: "이 전쟁 목표는 바티칸 칼리파국이 선포한 지하드를 위한 것입니다."
 vatican_islamist_alliance: "알라의 신실한 자들"
 vatican_holy_christian_alliance: "신성 동맹"
 HLS_retake_african_coast_tt: "한때 로마가 지배했던 북아프리카 해안에 대한 영유권을 주장합니다."
 HLS_anti_islamist_crusade_tt: "모든 §Y살라피주의§! 정부에 십자군 원정이 통보됩니다. 이후 각 정부마다 §Y성전§!으로 싸울지 유럽 전역의 §Y십자군 원정§!을 선포할지 선택합니다."
 HLS_aid_our_brethren_tt: "우리와 전쟁 중이 아닌 모든 이슬람 국가에 원조를 제안합니다. 수락한 국가는 §G안정도§!와 §G전쟁 지지도§!를 얻으며, 우리가 세력을 이끌고 있다면 우리 세력에 가입합니다."
 HLS_sympathizers_for_the_cause_tt: "모든 §Y살라피주의§! 국가에서 영향력 §G3%§!를 얻습니다."
 HLS_vatican_radio_tt: "§Y이탈리아§!, §Y폴란드§!, §Y스페인§!, §Y포르투갈§!, §Y아일랜드§!, §Y브라질§!, §Y멕시코§!, §Y필리핀§!에서 영향력 §G2%§!를 얻습니다."
 HLS_swiss_guard_tooltip: "§Y스위스§!가 바티칸에 §Y스위스 근위대§! 사단 하나를 보냅니다."
 HLS_anti_islamist_crusade_custom_trigger: "이슬람을 공식적으로 규탄했음"
 HLS_a_dark_path_custom_trigger: "이슬람을 규탄하지 않았음"
 HLS_ecumenical_outreach_tt: "모든 §Y정교회§! 국가에서 영향력 §G3%§!를 얻습니다."
 vatican_wyd_europe_tt: "§Y유럽§!의 모든 §Y기독교§! 국가에서 영향력 §G3%§!를 얻습니다."
 vatican_wyd_americas_tt: "§Y아메리카§!의 모든 §Y기독교§! 국가에서 영향력 §G3%§!를 얻습니다."
 vatican_wyd_global_south_tt: "§Y아프리카§!와 §Y아시아§!의 모든 §Y기독교§! 국가에서 영향력 §G3%§!를 얻습니다."
 vatican_assisi_muslim_tt: "모든 §Y이슬람§! 국가가 우리를 더 좋게 봅니다."
 vatican_assisi_orthodox_tt: "모든 §Y정교회 기독교§! 국가에서 영향력 §G2%§!를 얻습니다."
 HLS_improve_the_city: "도시 정비"
 HLS_improve_the_city_desc: "바티칸의 거리와 안뜰은 보수가 필요하며, 도시의 모든 제곱미터를 활용해야 합니다."
 HLS_strengthen_the_walls: "성벽 강화"
 HLS_strengthen_the_walls_desc: "레오 성벽은 천 년이 넘도록 교황을 지켜 왔습니다. 현대의 위협에는 현대적인 방어가 필요합니다."
 HLS_electrical_deals: "전력 협정"
 HLS_electrical_deals_desc: "바티칸은 전력을 이탈리아에서 구입합니다. 이탈리아 전력 회사들과 장기 협정을 맺으면 저렴하고 안정적인 공급을 확보할 수 있습니다."
 HLS_vatican_factories: "바티칸 공장"
 HLS_vatican_factories_desc: "그리 성스러운 일은 아니지만, 교황청에는 자체 산업이 필요합니다."
 HLS_carbon_neutrality: "탄소 중립"
 HLS_carbon_neutrality_desc: "배출량을 상쇄하기 위해 숲을 조성하면 바티칸은 세계 최초의 탄소 중립 국가가 되어 신자들이 피조물을 돌보도록 이끌 수 있습니다."
 HLS_solar_panels: "태양광 패널"
 HLS_solar_panels_desc: "바오로 6세 알현실의 지붕은 크고 평평하며 볕이 잘 듭니다. 여기에 태양광 패널을 덮으면 바티칸이 청정에너지의 모범이 될 것입니다."
 HLS_heavy_restructuring: "대대적인 구조 개편"
 HLS_heavy_restructuring_desc: "바티칸은 하나의 고립 영토에 머물러서는 안 됩니다. 이 작업은 수년이 걸리고 막대한 비용이 들겠지만, 우리를 강하게 만들 것입니다."
 HLS_vatican_fortress: "바티칸 요새화"
 HLS_vatican_fortress_desc: "바티칸은 단순한 도시가 아니라 교황의 자리입니다. 공장을 더 짓는 대신 철저히 요새화해야 합니다."
 HLS_refurbish_the_vatican_library: "바티칸 도서관 복원"
 HLS_refurbish_the_vatican_library_desc: "바티칸 도서관이 앞으로 수 세기 동안 경이로운 존재로 남으려면 철저한 복원이 필요합니다."
 HLS_road_to_greatness: "위대함으로 가는 길"
 HLS_road_to_greatness_desc: "세계는 지상에서 가장 작은 나라를 비웃습니다. 이제 옛 방식을 되살려 세계를 신앙의 새 시대로 이끌 때입니다."
 HLS_status_quo: "현상 유지"
 HLS_status_quo_desc: "교황청은 좋은 처지에 있습니다. 과거의 야망으로 돌아갈 필요는 없습니다."
 HLS_swiss_guard: "스위스 근위대"
 HLS_swiss_guard_desc: "스위스 근위대는 언제나 우리를 지켜 왔지만, 현대 세계는 근위대를 강화하라고 요구합니다."
 HLS_great_jubilee: "대희년"
 HLS_great_jubilee_desc: "성년이 되면 수백만 명의 순례자가 로마를 찾아 성 베드로 대성당의 성문을 통과합니다. 교회는 그들 모두를 맞이할 생각입니다."
 HLS_pastoral_journeys: "사목 방문"
 HLS_pastoral_journeys_desc: "교황은 더 이상 바티칸에서 세계가 찾아오기를 기다리지 않습니다. 먼 나라를 방문하면 교황청이 신자들을 직접 찾아가고, 그 목소리가 대통령들과 군중에게 똑같이 전해집니다."
 HLS_interfaith_dialogue: "종교 간 대화"
 HLS_interfaith_dialogue_desc: "1986년 교황은 평화를 위해 기도하고자 세계 종교 지도자들을 아시시에 모았습니다. 이들을 다시 한자리에 부르면 신앙이 폭력의 원인이 아니라 폭력에 맞서는 증언이 될 수 있음을 보여 줄 수 있습니다."
 HLS_world_youth_day: "세계청년대회"
 HLS_world_youth_day_desc: "교황은 몇 년마다 세계의 젊은이들을 기도와 축제의 대규모 집회로 부릅니다. 수백만 명이 응답하며, 많은 이들이 더 깊어진 신앙을 품고 고향으로 돌아갑니다."
 HLS_synod_of_bishops: "주교 시노드"
 HLS_synod_of_bishops_desc: "모든 대륙의 주교들이 로마에 모여 교회가 직면한 문제에 대해 교황에게 조언합니다. 이들의 조언은 교황청이 각지의 신자들과 접점을 유지하게 합니다."
 HLS_ecumenical_outreach: "교회 일치 운동"
 HLS_ecumenical_outreach_desc: "동방과 서방의 분열은 거의 천 년이 되었습니다. 정교회와의 인내심 있는 대화가 기독교 세계의 두 반쪽을 다시 가까이 이끌 수도 있습니다."
 HLS_moral_authority: "도덕적 권위"
 HLS_moral_authority_desc: "교황은 군대를 거느리지 않지만, 전쟁과 빈곤, 인간의 존엄에 관해 말하면 정부와 민중이 귀를 기울입니다. 이 신뢰야말로 교황청이 지닌 가장 귀중한 자산입니다."
 HLS_italy_our_puppet: "우리의 속국, 이탈리아"
 HLS_italy_our_puppet_desc: "우리의 부상을 시작하려면 이탈리아 본토에 대한 권위를 되찾아야 합니다. 이탈리아는 결국 우리의 고향입니다."
 HLS_retake_rome: "로마 탈환"
 HLS_retake_rome_desc: "바티칸은 언제나 우리 왕국의 심장이겠지만, 이를 지탱하려면 로마 전체와 그곳의 공장이 필요합니다."
 HLS_italian_integration: "이탈리아 통합"
 HLS_italian_integration_desc: "속국만으로는 부족합니다. 이탈리아는 교황령에 완전히 합류해야 합니다."
 HLS_rebuild_italy: "이탈리아 재건"
 HLS_rebuild_italy_desc: "이탈리아가 우리 권위 아래 들어온 지금, 그 재건을 위한 여지를 마련해야 합니다."
 HLS_reinstate_latin_language: "라틴어 복원"
 HLS_reinstate_latin_language_desc: "한 왕국은 하나의 언어를 써야 합니다. 교회의 언어인 라틴어가 우리 행정에서 이탈리아어를 대체할 것입니다."
 HLS_the_rise_of_christianity: "기독교의 부상"
 HLS_the_rise_of_christianity_desc: "교회가 영혼뿐 아니라 국가도 이끌 수 있음을 세상에 보여 줄 때입니다."
 HLS_new_alliance: "새 바티칸 동맹"
 HLS_new_alliance_desc: "바티칸 혼자서는 세상의 완고함을 이겨 낼 수 없습니다. 우리에게는 동맹이 필요합니다."
 HLS_religious_recruits: "종교 신병"
 HLS_religious_recruits_desc: "많은 신자가 우리를 위해 싸우기를 원합니다. 전투에 적합한 이는 드물어 훈련에 시간이 걸립니다."
 HLS_restore_roman_empire: "로마 제국 복원"
 HLS_restore_roman_empire_desc: "교회는 한때 로마에서 제국을 이끌었습니다. 다시 그럴 수 있습니다."
 HLS_divide_et_impera: "분할하여 통치하라(Divide et Impera)"
 HLS_divide_et_impera_desc: "'분할하여 통치하라.' 강대국들을 우리에게 저항할 수 없을 만큼 약한 조각들로 쪼개면 새로운 로마가 일어설 것입니다."
 HLS_strike_gaul: "갈리아 타격"
 HLS_strike_gaul_desc: "갈리아, 히스파니아, 브리타니아는 모두 한때 로마에 복종했습니다. 우리의 군단이 그 사실을 일깨워 줄 것입니다."
 HLS_retake_african_coast: "아프리카 해안 탈환"
 HLS_retake_african_coast_desc: "북아프리카는 갈리아 못지않게 로마의 일부였습니다. 그 해안을 따라 로마의 통치를 복원해야 합니다."
 HLS_recover_balkans: "발칸 회복"
 HLS_recover_balkans_desc: "발칸은 유고슬라비아가 붕괴한 이래 분쟁 외에는 거의 겪어 보지 못했습니다. 로마 아래 하나가 된다면 그곳의 민족들은 평화를 알게 될 것입니다."
 HLS_recover_anatolia: "아나톨리아 회복"
 HLS_recover_anatolia_desc: "동로마 제국을 복원해야 하며, 이번에는 서방과 갈라서지 않을 것입니다. 콘스탄티노폴리스가 기다리고 있습니다."
 HLS_holy_soldiers: "십자군"
 HLS_holy_soldiers_desc: "십자군이라는 칭호는 한때 십자군 전쟁에서 싸운 모든 이에게 주어졌습니다. 이 칭호를 우리 병사들에게 수여하면 그들을 교회에 결속시킬 수 있습니다."
 HLS_anti_islamist_crusade: "반이슬람주의 십자군 원정"
 HLS_anti_islamist_crusade_desc: "세계의 살라피주의 정권들은 교회의 분노를 샀습니다. 이제 칼을 들 때입니다."
 HLS_retake_the_holy_land: "성지 탈환"
 HLS_retake_the_holy_land_desc: "누가 제1차 십자군이 나쁜 생각이었다고 했습니까?"
 HLS_second_anti_islamist_crusade: "제2차 반이슬람주의 십자군 원정"
 HLS_second_anti_islamist_crusade_desc: "첫 번째 십자군 원정은 일을 끝내지 못했습니다. 이제 또 한 번의 원정을 떠날 때입니다."
 HLS_a_dark_path: "어두운 길"
 HLS_a_dark_path_desc: "바티칸의 기독교는 수명을 다했습니다. 교황은 새로운 신앙을 찾았고, 교황청이 그 뒤를 따를 것입니다."
 HLS_jihad: "지하드 선포"
 HLS_jihad_desc: "바티칸 칼리파국이 신앙을 전파하는 일에 진지하다는 것을 세상이 알아야 합니다."
 HLS_take_jerusalem: "예루살렘 점령"
 HLS_take_jerusalem_desc: "예루살렘은 아브라함 계통의 세 종교 모두에게 성지입니다. 바티칸 칼리파국은 이곳을 통치할 생각입니다."
 HLS_anti_america: "반미"
 HLS_anti_america_desc: "미국의 대테러 전쟁으로 이슬람 세계가 미국에 등을 돌렸습니다. 바티칸 칼리파국이 저항을 이끌 것입니다."
 HLS_aid_our_brethren: "우리 형제들 원조"
 HLS_aid_our_brethren_desc: "이슬람 국가들은 너무나 자주 외세의 처분에 맡겨집니다. 함께라면 서로를 지킬 수 있습니다."
 HLS_allahs_will: "알라의 뜻"
 HLS_allahs_will_desc: "신자들이 대의를 위해 목숨을 바칠 각오로 바티칸 칼리파국에 몰려듭니다."
 HLS_sympathizers_for_the_cause: "대의의 동조자들"
 HLS_sympathizers_for_the_cause_desc: "세계의 살라피주의 정부들은 우리의 메시지를 퍼뜨리는 데 유용할 것입니다. 이들의 환심을 사야 합니다."
 HLS_papal_armed_forces: "교황청 군대"
 HLS_papal_armed_forces_desc: "교황청은 1870년 교황령이 무너진 이래 군대가 필요하지 않았습니다. 이제 우리 병력을 점검할 때입니다."
 HLS_question_of_the_land_forces: "지상군 문제"
 HLS_question_of_the_land_forces_desc: "우리 지상군은 있으나 마나 합니다. 스위스 근위대를 토대로 삼을까요, 아니면 로마에서 젊은 열성 신자들을 훈련시킬까요?"
 HLS_maintain_the_swiss_guard: "스위스 근위대 유지"
 HLS_maintain_the_swiss_guard_desc: "스위스 근위대는 언제나 우리에게 충성해 왔습니다. 우리는 그 전통과 높은 규율 기준을 유지할 것입니다."
 HLS_drill_the_guard: "근위대 훈련"
 HLS_drill_the_guard_desc: "스위스 근위대는 공세 전쟁을 치르도록 만들어진 적이 없습니다. 혹독한 훈련이 이들을 그 임무에 걸맞게 만들 것입니다."
 HLS_offensive_swiss_guard: "공세형 스위스 근위대"
 HLS_offensive_swiss_guard_desc: "스위스 근위대는 훈련을 마치고 공격에 나선 우리 군을 이끌 준비가 되었습니다."
 HLS_refined_equipment_procurement: "개선된 장비 조달"
 HLS_refined_equipment_procurement_desc: "병사들에게 소총을 쥐여 주는 더 저렴한 방법이 생기면 그만큼 더 많은 병사가 소총을 들 수 있습니다."
 HLS_latium_military_industrial_complex: "로마 군산복합체"
 HLS_latium_military_industrial_complex_desc: "로마 군단은 자신들의 장비를 직접 관리했습니다. 비슷한 체계를 갖추면 동원 속도가 빨라지고 국가에 자금이 들어옵니다."
 HLS_bring_fanatics_to_rome: "광신도 로마 집결"
 HLS_bring_fanatics_to_rome_desc: "열성 신자들은 언제나 교회를 찾아왔습니다. 이제 그들에게 군복을 입힐 것입니다."
 HLS_fanatic_infantry: "광신도 보병"
 HLS_fanatic_infantry_desc: "열성 신자는 믿을 만한 병사가 아니지만, 수천 명이 한꺼번에 돌격하면 어떤 전선도 무너뜨릴 수 있습니다."
 HLS_disciplined_rabble: "규율 잡힌 오합지졸"
 HLS_disciplined_rabble_desc: "혹독한 규율이 있다면 우리의 열성 신자들은 무시무시한 전투 병력이 될 수 있습니다."
 HLS_papal_fleet: "교황청 함대"
 HLS_papal_fleet_desc: "교황청 해군은 1870년을 마지막으로 항해했습니다. 우리가 통치하는 해안선이 있으니 다시 한번 함대를 일으킬 수 있습니다."
 HLS_angelforce: "엔젤 포스"
 HLS_angelforce_desc: "바티칸은 이미 교황을 위한 헬기장을 갖추고 있습니다. 이것이 작은 교황청 공군의 씨앗이 될 수 있습니다."
 HLS_reform_the_curia: "로마 쿠리아 개혁"
 HLS_reform_the_curia_desc: "쿠리아의 성성과 평의회는 굼뜨고 다툼이 잦아졌습니다. 교황청 관료제 개혁은 진작에 이루어졌어야 합니다."
 HLS_clean_up_the_vatican_bank: "바티칸 은행 정화"
 HLS_clean_up_the_vatican_bank_desc: "종교사업기구는 수십 년간 스캔들에 얽혀 왔습니다. 유럽 규제 당국에 장부를 공개하면 우리 재정에 대한 신뢰를 회복할 수 있습니다."
 HLS_peters_pence: "베드로 성금"
 HLS_peters_pence_desc: "전 세계 가톨릭 신자들은 해마다 베드로 성금을 통해 교황에게 헌금합니다. 호소를 새롭게 하면 우리 금고가 채워질 것입니다."
 HLS_open_the_vatican_museums: "바티칸 박물관 개방"
 HLS_open_the_vatican_museums_desc: "해마다 수백만 명의 방문객이 시스티나 성당을 보러 옵니다. 개관 시간을 늘리고 전시관을 새로 열면 수백만 명이 더 찾아올 것입니다."
 HLS_vatican_observatory: "바티칸 천문대"
 HLS_vatican_observatory_desc: "스페콜라 바티카나는 한 세기가 넘도록 하늘을 연구해 왔습니다. 애리조나에 있는 망원경에 자금을 지원하면 교회가 과학의 최전선에 머물 수 있습니다."
 HLS_vatican_radio: "바티칸 라디오"
 HLS_vatican_radio_desc: "바티칸 라디오는 수십 개 언어로 교황의 목소리를 방송합니다. 도달 범위를 넓히면 가톨릭 세계와의 유대가 강화될 것입니다."
 HLS_papal_diplomacy: "교황 외교"
 HLS_papal_diplomacy_desc: "교황청은 세계 거의 모든 국가와 외교 관계를 맺고 있습니다. 이 네트워크를 활용해야 합니다."
 HLS_praedicate_evangelium: "복음을 선포하여라"
 HLS_praedicate_evangelium_desc: "2022년 사도 헌장 '복음을 선포하여라'(Praedicate Evangelium)는 복음 선포라는 사명을 중심으로 로마 쿠리아를 재편했습니다. 디카스테리움이 성성과 평의회를 대체했고, 평신도도 이를 이끌 자격을 얻게 되었습니다."