 JAP_ministry_officials_named: "Funcionários do Ministério Nomeados"
 JAP_ministry_officials_named_desc: "O contrato Shinsei é público, e os nomes dos funcionários que o assinaram também. O ministério passa o ano respondendo a perguntas em vez de conduzir a política, e toda empresa que negocia com ele espera a poeira baixar."
 JAP_bank_under_public_ownership: "Banco sob Propriedade Pública"
 JAP_bank_under_public_ownership_desc: "O Estado possui um grande banco e substituiu sua diretoria. O crédito é retomado nos termos do governo, o que é bem-vindo para os tomadores e um constrangimento permanente para os ministros que precisam responder por ele."
 JAP_ring_of_fire: "Vivendo no Círculo de Fogo"
 JAP_ring_of_fire_desc: "Quatro placas tectônicas se encontram sob o arquipélago japonês, e um quinto dos terremotos de magnitude seis ou mais do mundo ocorre aqui. Dois terços do parque habitacional é anterior à Lei de Padrões de Construção de 1981. A cada poucos anos um tremor racha uma via expressa, descarrila um Shinkansen ou paralisa uma fábrica, e o orçamento para desastres é uma linha permanente nas contas nacionais.\n-------------\nTerremotos continuarão atingindo §Y[609.GetName]§!, §Y[610.GetName]§!, §Y[611.GetName]§!, §Y[613.GetName]§!, §Y[615.GetName]§!, §Y[616.GetName]§! e §Y[617.GetName]§!. Uma região que passou pelo §Y$JAP_seismic_retrofit_category$§! estará mais preparada para Terremotos\n§GRemoção§!: toda região sujeita a terremotos foi reforçada sismicamente e o foco §Y$JAP_reconstruction_completed_focus$§! foi concluído."
 JAP_galapagos_syndrome_focus_idea: "O Prêmio de Galápagos"
 JAP_galapagos_syndrome_focus_idea_desc: "Enquanto o ministério discute convergência e comercialização, os escritórios comerciais fazem o óbvio e vendem a diferença. As linhas nacionais de chips operam com prêmio, as delegações de padronização empurram especificações japonesas para o exterior, e a pesquisa de processos acompanha o ritmo. O arranjo ganha tempo para a decisão que está por baixo, e não dura."
 JAP_galapagos_openness_tt: "[JAP.GetFlag] §YAbertura [JAP.GetAdjectiveCap]§! $RIGHT|+=0$"
