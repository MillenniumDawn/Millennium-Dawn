l_korean:
 reverse_engineering_tech_bonus: "역설계"
 reverse_engineering.1.t: "외국 장비 연구"
 reverse_engineering.1.d: "우리 기술자들이 최근 입수한 외국 군사 장비를 분해했습니다. 그 조사 결과는 우리 연구소가 해당 세대의 설계를 따라잡는 데 도움이 될 것입니다."
 reverse_engineering.1.a: "조사 결과를 설계자들과 공유한다"
 reverse_engineering_cooldown_tt: "§Y180§!일 동안 더 이상 외국 장비를 연구할 수 없습니다."