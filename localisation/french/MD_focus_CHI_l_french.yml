 BRI_apply_named_RAIL_desc: "Solliciter Pékin pour construire le §Y[THIS.GetBRINextProjectRAIL]§!. La demande coûte 30 de pouvoir politique. Sur approbation, nous payons §Y40§! de notre trésorerie ou recevons un prêt chinois. Requiert une frontière chinoise ou un partenariat BRI actif, et la paix."
 BRI_apply_named_PIPELINE: "Appliquer : §Y[THIS.GetBRINextProjectPIPELINE]§!"
 BRI_apply_named_PIPELINE_desc: "Solliciter Pékin pour construire le §Y[THIS.GetBRINextProjectPIPELINE]§!. La demande coûte 35 de pouvoir politique. Sur approbation, nous payons §Y40§! de notre trésorerie ou recevons un prêt chinois. Requiert des gisements de pétrole, d'acier ou de métaux précieux, et la paix."
 BRI_apply_named_TELECOM: "Postulez : §Y[THIS.GetBRINextProjectTELECOM]§!"
 BRI_apply_named_TELECOM_desc: "Solliciter Pékin pour construire le §Y[THIS.GetBRINextProjectTELECOM]§!. La demande coûte 25 de pouvoir politique. Sur approbation, nous payons §Y40§! de notre trésorerie ou recevons un prêt chinois. Requiert la paix. Les États alignés sur l'Occident attirent un examen."
 BRI_apply_named_SEZ: "Appliquer : §Y[THIS.GetBRINextProjectSEZ]§!"
 BRI_apply_named_SEZ_desc: "Solliciter Pékin pour construire le §Y[THIS.GetBRINextProjectSEZ]§!. La demande coûte 40 de pouvoir politique. Sur approbation, nous payons §Y40§! de notre trésorerie ou recevons un prêt chinois. Requiert plus de quatre usines et la paix."
 BRI_apply_named_MINE: "Appliquer : §Y[THIS.GetBRINextProjectMINE]§!"
 BRI_apply_named_MINE_desc: "Solliciter Pékin pour construire le §Y[THIS.GetBRINextProjectMINE]§!. La demande coûte 30 de pouvoir politique. Sur approbation, nous payons §Y40§! de notre trésorerie ou recevons un prêt chinois. Requiert des gisements de métaux précieux, métaux technologiques, métaux légers ou acier, et la paix."
 BRI_apply_named_ENERGY: "Appliquer : §Y[THIS.GetBRINextProjectENERGY]§!"
 BRI_apply_named_ENERGY_desc: "Solliciter Pékin pour construire le §Y[THIS.GetBRINextProjectENERGY]§!. La demande coûte 30 de pouvoir politique. Sur approbation, nous payons §Y40§! de notre trésorerie ou recevons un prêt chinois. Requiert un État industriel et la paix."
 BRI_apply_named_PRESTIGE: "Appliquer : §Y[THIS.GetBRINextProjectPRESTIGE]§!"
 BRI_apply_named_PRESTIGE_desc: "Solliciter Pékin pour construire le §Y[THIS.GetBRINextProjectPRESTIGE]§!. La demande coûte 40 de pouvoir politique. Sur approbation, nous payons §Y40§! de notre trésorerie ou recevons un prêt chinois. Requiert une stabilité supérieure à 40 % et la paix."
