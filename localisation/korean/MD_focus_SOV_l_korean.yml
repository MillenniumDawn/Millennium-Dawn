 SOV_army_category: "러시아군"
 SOV_army_category_desc: "러시아군은 한때 방대하고 막강했던 소련군의 희미한 그림자에 불과합니다. 이제 러시아는 언제나 세계 정치에 참여하고 직접 영향을 미쳐 온 국가의 군사력을 되살려야 하는 과제에 직면해 있습니다."
