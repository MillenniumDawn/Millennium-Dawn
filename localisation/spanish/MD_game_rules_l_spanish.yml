 RULE_OPTION_MD_COLORED_PUPPETS_YES_DESC: "Desde que se activó esta regla del juego, cualquier país que se convierta en títere cambiará automáticamente al color de su amo. (Por ejemplo, si China se convirtió en títere de India, India se volverá roja como China)."
