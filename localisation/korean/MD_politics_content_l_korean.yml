 MANAGE_SUBJECTS_TT: "§Y종속국 메뉴§!\n종속국은 위성국, 괴뢰국, 자치령, 특별행정구, 또는 다른 나라에 예속된 모든 국가를 가리킵니다. 각 국가는 귀하가 그들의 종주국인 것에 대해 서로 다르게 행동하며, 독립을 위해 싸우거나, 귀하의 나라가 그들에게 인기가 있다면 결국 통합을 허용할 것입니다.\n\n§Y종속국을 통합하면 그들의 영토에 중핵을 얻을 수 있으므로 병합의 매력적인 대안이 됩니다.§!\n"
 MANAGE_SUBJECTS_DELAYED_TT: "§Y국가가 통합에 저항하는 이유:§!\n기본값: §R+10§!\n종속국과 무역 협정 체결: §G-20%§!\n우리에 대한 종속국의 관계가 100 미만: §R+200%§!\n우리에 대한 종속국의 관계가 200 초과: §G-90%§!\n우리에 대한 종속국의 관계가 240 초과: §G-100%§!\n종속국이 우리와 같은 이념 성향을 가짐: §G-50%§!\n\n종속국의 §Y국내 영향력§!은 해당 §Y국내 영향력§!을 10으로 나눈 뒤, 그 값을 위에서 계산한 값에 곱하여 산출됩니다.\n\n§Y자치도 증가§! 중점에 대한 AI 게임 규칙을 비활성화하면 이 정보는 무의미해집니다."