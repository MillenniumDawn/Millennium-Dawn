l_russian:
 STALKER.130.t: "Катастрофический выброс"
 STALKER.130.d: "Выброс прорвал ослабленный периметр в [STALKER_zone_name]. На спутниковых снимках видны выгоревшие блокпосты и светящееся небо, а соседние правительства спрашивают, не их ли границы следующие."
 STALKER.130.a: "Зону не удастся сдерживать вечно."
 STALKER.131.t: "Они оставили себе наши артефакты"
 STALKER.131.d: "[From.GetName] отказывается вернуть артефакты, контрабандой вывезенные из нашей Зоны и изъятые её таможней. Её лаборатории уже их изучают."
 STALKER.131.a: "Потребовать их вернуть."
 STALKER.131.b: "Не стоит спора."
 STALKER.132.t: "НАТО обсуждает Зону"
 STALKER.132.d: "Министры обороны союзников провели закрытое заседание, посвящённое аномальной Зоне на территории [?global.STALKER_zone_host_target.GetName]. Сдерживание там рушится, и несколько членов хотят, чтобы альянс оплатил усиление периметра."
 STALKER.132.a: "Профинансировать сдерживание."
 STALKER.132.a_tt: "Чернобыльская Зона получает §G10§! к §Yсдерживанию§!."
 STALKER.132.b: "Это не дело альянса."
 STALKER.133.t: "Москва предлагает специалистов"
 STALKER.133.d: "У нашего МЧС есть опыт работы с заражёнными территориями, а Зона на территории [?global.STALKER_zone_host_target.GetName] выходит из-под контроля. Предложив своих специалистов, мы получим влияние там, где это важно."
 STALKER.133.a: "Отправить специалистов."
 STALKER.133.a_tt: "Чернобыльская Зона получает §G5§! к §Yсдерживанию§!."
 STALKER.133.b: "Пусть сами разбираются со своей бедой."
 STALKER.134.t: "Наша экспедиция пропала в Зоне"
 STALKER.134.d: "Исследовательская группа, отправленная нами в Зону по соглашению о доступе, не вернулась. В последней передаче описывалась аномалия, которой не было ни на одной карте."
 STALKER.134.a: "Принимающее правительство не смогло их защитить."
 STALKER.134.b: "Они знали, на что шли."
 STALKER.135.t: "Иностранные учёные погибли в Зоне"
 STALKER.135.d: "Исследователи из страны [?global.STALKER_casualty_country.GetName] погибли в аномальной Зоне. Их гибель снова разожгла спор о том, стоит ли вообще пускать туда иностранные группы."
 STALKER.135.a: "Зона забирает всех, кто в неё входит."
 STALKER.136.t: "Зона на нашей земле"
 STALKER.136.d_usa: "На территории США открылась аномальная Зона. Конгресс хочет слушаний, Пентагон — периметра, университеты — образцов. Администрации предстоит решить, кому Зона достанется первым."
 STALKER.136.d_sov: "На российской земле открылась Зона. Спецслужбы хотят оцепить и засекретить её, а Академия наук доказывает, что Россия не может позволить себе отстать в аномальных исследованиях."
 STALKER.136.d_chi: "В Китае открылась Зона. Руководство партии приказало её оцепить, но вопрос в том, станет ли она закрытой военной зоной или национальным исследовательским приоритетом."
 STALKER.136.d: "На нашей территории открылась аномальная Зона. Мы великая держава, и мир следит, как мы с ней справимся."
 STALKER.136.a: "Передать её военным."
 STALKER.136.a_tt: "Стоит §R50§! политической власти. Новая Зона получает §G15§! к §Yсдерживанию§!."
 STALKER.136.b: "Сделать её национальным исследовательским приоритетом."
 STALKER.136.b_tt: "Новая Зона получает §G10§! к §Yэксплуатации§!, что увеличивает наши исследования."
 STALKER_kept_seized_artifacts: "Оставили себе наши изъятые артефакты"
 STALKER_blamed_for_casualties: "Обвинили в гибели экспедиции"
 STALKER.137.t: "Совет берётся за Зоны"
 STALKER.137.d: "Постоянные члены собрались обсудить новые аномальные Зоны. Они могут поддержать сдерживание, открыть доступ для исследований правительствам, которые за него проголосуют, или отложить заседание. При равенстве голосов заседание откладывается."
 STALKER.137.a: "Голосовать за сдерживание."
 STALKER.137.a_tt: "Наш голос учитывается за сдерживание."
 STALKER.137.b: "Голосовать за доступ для исследований."
 STALKER.137.b_tt: "Наш голос учитывается за доступ. Если доступ победит, каждое проголосовавшее за него правительство получит доступ к исследованию Зоны."
 STALKER.137.c: "Голосовать за перенос заседания."
 STALKER.137.c_tt: "Наш голос учитывается за перенос. При равенстве голосов заседание также переносится."
 STALKER.138.t: "Заседание Совета закрыто"
 STALKER.138.d_containment: "Заседание завершилось в пользу сдерживания. Нового доступа для исследований голосование не дало."
 STALKER.138.d_access: "Заседание завершилось в пользу доступа для исследований. Правительства, проголосовавшие за доступ, могут изучать Зоны."
 STALKER.138.d_adjourn: "Заседание перенесено без решения. Сдерживание и доступ остались как есть."
 STALKER.138.a: "Совет сказал своё слово."
 STALKER_request_international_containment: "Запросить Международные силы охраны периметра"
 STALKER_request_international_containment_desc: "Попросить крупные державы помочь удерживать периметр Зоны. Международные силы охраны периметра (МСОП) принесут деньги, войска и учёных, а каждый участник будет ждать доступа взамен."
 STALKER_request_international_containment_tt: "Каждая наша Зона получает §G10§! к §Yсдерживанию§! и теряет до §G10§! влияния §Yбандитов§!. Все крупные державы, не воюющие с нами, приглашаются к участию; каждый участник добавляет ещё §G5§! §Yсдерживания§!, снижает влияние §Yбандитов§! до §G5§! и получает доступ к исследованию Зоны."
 STALKER_transfer_artifacts: "Передать артефакты: [FROM.GetName]"
 STALKER_transfer_artifacts_desc: "Отправить партию добытых артефактов в лаборатории страны [FROM.GetName] в знак доброй воли.\n\nЗапас артефактов: §Y[?ROOT.STALKER_artifact_stockpile|1]§!"
 STALKER_transfer_artifacts_tt: "Тратит §Y5§! артефактов из национального запаса. [FROM.GetName] получает §G+3%§! к скорости исследований на §Y180 дн.§! и лучше относится к нам."
 STALKER_foreign_zone_access: "Доступ к исследованию Зоны"
 STALKER_foreign_zone_access_desc: "Наши учёные имеют доступ к аномальной Зоне по международному соглашению."
 STALKER.20.t: "Изъяты аномальные артефакты"
 STALKER.20.d: "Таможенники в одном из наших портов вскрыли партию запчастей и нашли дюжину предметов, которые светятся, гудят или парят в воздухе. По документам их след ведёт через три подставные компании к Зоне."
 STALKER.20.d_usa: "ФБР накрыло контрабандную сеть, продававшую артефакты из Зоны частным коллекционерам в Нью-Йорке и Лос-Анджелесе. Изъятые предметы светятся, гудят или парят, а агенты, бравшие их без перчаток, теперь в больнице."
 STALKER.20.a: "Отправить их в наши лаборатории."
 STALKER.20.a_tt: "Даёт §G+3%§! к скорости исследований на §Y90 дн.§! Владелец Зоны может потребовать их вернуть."
 STALKER.20.b: "Вернуть их стране [event_target:STALKER_zone_controller_target.GetName]."
 STALKER.21.t: "Запрос на доступ к Зоне"
 STALKER.21.d: "[event_target:STALKER_access_requester.GetName] просит разрешения отправить научную группу в [STALKER_zone_name]. Их учёные работали бы вместе с нашими и предлагают поделиться находками."
 STALKER.21.a: "Предоставить доступ."
 STALKER.21.a_tt: "[event_target:STALKER_access_requester.GetName] получает §G+1%§! к скорости исследований благодаря доступу к Зоне. §YЭксплуатация§! Зоны растёт на §G5§!."
 STALKER.21.b: "Отказать."
 STALKER.23.t: "Международные силы охраны периметра"
 STALKER.23.d: "[?global.STALKER_ipsf_host.GetName] просит крупные державы помочь удерживать аномальную Зону на своей территории. Участники разделят расходы на периметр и получат доступ для своих учёных."
 STALKER.23.a: "Отправить контингент."
 STALKER.23.a_tt: "Каждая Зона под контролем страны [?global.STALKER_ipsf_host.GetName] получает §G5§! к §Yсдерживанию§! и теряет до §G5§! влияния §Yбандитов§!. Мы получаем §G+1%§! к скорости исследований благодаря доступу к Зоне."
 STALKER.23.b: "Это не наша проблема."
 STALKER.24.t: "Международные силы охраны периметра"
 STALKER.24.d: "[?global.STALKER_ipsf_host.GetName] просит крупные державы мира помочь сдержать аномальную Зону. Дипломаты в нескольких столицах говорят, что Международные силы охраны периметра могут быть развёрнуты в течение нескольких недель."
 STALKER.24.a: "Теперь Зона — общая проблема."
 STALKER_transfer_artifacts_available_tt: "В национальном запасе не менее §Y5§! артефактов (сейчас §Y[?ROOT.STALKER_artifact_stockpile|1]§!)."
 STALKER_seize_perimeter_artifacts: "Изымать артефакты на Чернобыльском периметре"
 STALKER_seize_perimeter_artifacts_desc: "Досматривать пути вывоза из Зоны ([FROM.GetName]) и изымать артефакты, пока контрабандисты не увезли их за границу."
 STALKER_seize_perimeter_artifacts_tt: "Перемещает §Y5§! артефактов из контрабандного оборота в наш запас, снижает местное влияние бандитов на §G10§! и повышает сдерживание на §G5§!."
 STALKER_seize_perimeter_artifacts_available_tt: "Нужно не менее §Y5§! артефактов в общем контрабандном обороте."
 STALKER_request_zone_research_access: "Запросить доступ к исследованию: [FROM.GetName]"
 STALKER_request_zone_research_access_desc: "Попросить страну, контролирующую Зону ([FROM.GetName]), допустить наших учёных. Одобрение даёт постоянный бонус к исследованиям."
 STALKER_request_zone_research_access_tt: "Владелец Зоны получает запрос на доступ для исследований. Если он согласится, мы получим §G+1%§! к скорости исследований, а Зона — §Y5§! эксплуатации."
 STALKER_request_zone_research_access_cooldown_tt: "У Зоны нет активной §Y365-дневной§! перезарядки запроса доступа для исследований."
 STALKER.27.t: "Кризис группировок в Зоне"
 STALKER.27.d: "Пока периметр слабеет, бандитские группы захватили пути в [STALKER_zone_name]. «Долг» хочет скоординированной зачистки, «Свобода» предлагает защищённые коридоры для вольных сталкеров. Контрабандисты предлагают долю своего товара в обмен на то, чтобы их оставили в покое."
 STALKER.27.a: "Поддержать зачистку «Долга»."
 STALKER.27.a_tt: "Влияние бандитов падает до §G25§!, «Долг» получает §G10§! (только в исходной Зоне), сдерживание растёт на §G10§!, а число сталкеров падает до §R10§!."
 STALKER.27.b: "Принять план коридоров «Свободы»."
 STALKER.27.b_tt: "Влияние бандитов падает до §G15§!, сталкеры получают §G10§!, «Свобода» — §G10§! (только в исходной Зоне), эксплуатация растёт на §G5§!, а сдерживание падает до §R5§!."
 STALKER.27.c: "Принять предложение контрабандистов."
 STALKER.27.c_tt: "Перемещает §Y5§! контрабандных артефактов в наш запас, но влияние бандитов растёт на §R10§!, а сдерживание падает до §R10§!."
 STALKER.27.e: "Пойти по следу накладных X-16."
 STALKER.27.e_tt: "Влияние бандитов падает до §G20§!, а сдерживание и эксплуатация растут на §G5§! каждое. Требуется открытие проекта X."
 STALKER_expel_foreign_agents: "Выслать иностранных агентов: [FROM.GetName]"
 STALKER_expel_foreign_agents_desc: "Иностранные спецслужбы наводнили Зону подрядчиками, исследователями и офицерами связи, которые отчитываются на родину.\n\nИностранное разведывательное присутствие: §Y[?FROM.STALKER_zone_foreign_intel|0]§!\nОно растёт на §Y5§! за каждую страну с доступом к исследованиям и на §Y0.4§! за каждое очко §Yэксплуатации§!. Выше §Y49§! оно подпитывает любую сеть MDST в нашем правительстве."
 STALKER_expel_foreign_agents_tt: "[FROM.GetName] теряет до §G40§! иностранного разведывательного присутствия. Все страны с доступом к исследованию Зоны станут хуже к нам относиться."
 STALKER.140.t: "Иностранные агенты в Зоне"
 STALKER.140.d: "Наша контрразведка составила карту иностранного присутствия в [STALKER_zone_name]. Половина учёных, подрядчиков и журналистов там отчитываются кому-то другому."
 STALKER.140.a: "Тихо свернуть сети."
 STALKER.140.a_tt: "Стоит §R25§! политической власти. Зона теряет до §G25§! иностранного разведывательного присутствия."
 STALKER.140.b: "Пусть смотрят. Мы смотрим за ними."
 STALKER.140.b_tt: "Иностранное разведывательное присутствие продолжает подпитывать любую сеть MDST в нашем правительстве."
 STALKER_expelled_our_agents: "Выслали наших агентов из Зоны"
 STALKER_hire_mercenaries: "Нанять наёмников: [FROM.GetName]"
 STALKER_hire_mercenaries_desc: "Взять на наше жалованье подрядчиков, которые уже работают на иностранные службы. Они остаются в исходной Зоне, а службы, нанявшие их первыми, никуда не уходят."
 STALKER_hire_mercenaries_tt: "Влияние наёмников растёт на §Y10§!, а иностранное разведывательное присутствие — на §Y5§!."
 STALKER_expel_mercenaries: "Выгнать наёмников: [FROM.GetName]"
 STALKER_expel_mercenaries_desc: "Приказать подрядчикам покинуть исходную Зону. Если иностранное присутствие сохранится, другой заказчик предложит им ту же работу."
 STALKER_expel_mercenaries_tt: "Влияние наёмников падает до §G25§!."
 STALKER.141.t: "Наёмники в Зоне"
 STALKER.141.d: "Подрядчики, работающие на иностранные службы, открыто действуют в [STALKER_zone_name]. Они возьмут наш контракт или чужой."
 STALKER.141.a: "Нанять их на кордон."
 STALKER.141.a_tt: "Стоит §R25§! политической власти. Влияние наёмников растёт на §Y8§!, а влияние военных падает до §R3§!."
 STALKER.141.b: "Приказать им уйти."
 STALKER.141.b_tt: "Влияние наёмников падает до §G15§!."
 STALKER_belarus_border_seizure: "Перехватывать артефакты Зоны на белорусской границе"
 STALKER_belarus_border_seizure_desc: "Досматривать грузы, пересекающие нашу границу, на предмет артефактов, контрабандой вывезенных из Чернобыльской Зоны."
 STALKER_belarus_border_seizure_tt: "Перемещает §Y5§! артефактов из контрабандного оборота в наш запас."
 STALKER_reinforce_polesie_reserve: "Укрепить Полесский заповедник"
 STALKER_reinforce_polesie_reserve_desc: "Белорусская половина зоны отчуждения проходит через Полесский государственный радиационно-экологический заповедник. Его заборы, патрули и блокпосты приходят в негодность, если за них не платить.\n\nБезопасность Полесья: §Y[?ROOT.STALKER_polesie_security|0]§!"
 STALKER_reinforce_polesie_reserve_tt: "Стоит §Y0.2%§! ВВП. Безопасность Полесья растёт на §G20§!. Она падает на §Y1§! в месяц, а ниже §Y30§! сталкеры и контрабандисты начинают проникать в Беларусь."
 STALKER_kgb_smuggling_investigation: "Поручить КГБ расследование контрабанды"
 STALKER_kgb_smuggling_investigation_desc: "Артефакты из Зоны идут на запад через Гомель. Наш Комитет государственной безопасности может проследить за деньгами.\n\nБезопасность Полесья: §Y[?ROOT.STALKER_polesie_security|0]§!"
 STALKER_kgb_smuggling_investigation_available_tt: "В обороте не менее §Y3§! контрабандных артефактов (сейчас §Y[?global.STALKER_smuggled_artifacts|1]§!)."
 STALKER_kgb_smuggling_investigation_tt: "Расследование может разгромить контрабандную сеть, зайти в тупик или разоблачить чиновников на жалованье у контрабандистов. Чем выше безопасность Полесья, тем больше шансов на успех."
 STALKER_propose_joint_zone_commission: "Предложить совместную комиссию по Зоне"
 STALKER_propose_joint_zone_commission_desc: "Зона не останавливается на границе. Пригласить правительство, контролирующее Чернобыльскую Зону, совместно управлять зоной отчуждения."
 STALKER_propose_joint_zone_commission_tt: "Решение принимает правительство, контролирующее Чернобыльскую Зону. Если оно согласится, Чернобыльская Зона получит §G10§! к §Yсдерживанию§!, безопасность Полесья вырастет на §G10§!, а наши учёные получат доступ к исследованию Зоны. Если откажется, повторный запрос будет невозможен §Y365 дн.§!"
 STALKER.60.t: "Сталкеры переходят Припять"
 STALKER.60.d: "Пограничники в Полесском заповеднике нашли разрезанные заборы и свежие следы, ведущие на север. Группа сталкеров и скупающие у них товар контрабандисты теперь выносят артефакты из Зоны по белорусским болотным тропам."
 STALKER.60.a: "Ужесточить полесский кордон."
 STALKER.60.a_tt: "Переходы уже выбросили на чёрный рынок ещё §R3§! артефакта и подняли влияние §Yбандитов§! в Чернобыльской Зоне на §R5§!. Безопасность Полесья растёт на §G10§!."
 STALKER.60.b: "Болота не перекрыть."
 STALKER.60.b_tt: "Переходы продолжаются. На чёрный рынок уже попало ещё §Y3§! артефакта, а влияние §Yбандитов§! в Чернобыльской Зоне выросло на §R5§!."
 STALKER.61.t: "Контрабандная сеть разгромлена"
 STALKER.61.d: "Сотрудники КГБ арестовали сеть курьеров, таможенников и перекупщиков, переправлявших артефакты из Зоны через Гомель. Изъятый товар теперь в государственных лабораториях."
 STALKER.61.a: "Урок всем, кто захочет попробовать."
 STALKER.61.a_tt: "Из оборота изымается до §G10§! контрабандных артефактов. Мы получаем §G5§! артефактов в запас, а влияние §Yбандитов§! в Чернобыльской Зоне падает до §G10§!."
 STALKER.62.t: "Чиновники на жалованье у контрабандистов"
 STALKER.62.d: "Расследование вывело на наших собственных людей. Несколько чиновников погранслужбы и заповедника брали деньги, чтобы пропускать партии артефактов."
 STALKER.62.a: "Вычистить всех."
 STALKER.62.a_tt: "Безопасность Полесья растёт на §G15§!, а из оборота изымается до §G5§! контрабандных артефактов."
 STALKER.62.b: "Тихо взять свою долю."
 STALKER.62.b_tt: "Казна получает §G$0.5§! млрд. Безопасность Полесья падает на §R10§!, а на чёрный рынок попадает ещё §R5§! контрабандных артефактов."
 STALKER.63.t: "Минск предлагает совместную комиссию по Зоне"
 STALKER.63.d: "[?global.STALKER_commission_proposer.GetName] предлагает совместно управлять зоной отчуждения, разделив патрули, данные и расходы на периметр по обе стороны границы."
 STALKER.63.a: "Принять комиссию."
 STALKER.63.a_tt: "Чернобыльская Зона получает §G10§! к §Yсдерживанию§! и теряет до §G5§! влияния §Yбандитов§!. [?global.STALKER_commission_proposer.GetName] получает доступ к исследованию Зоны и лучше относится к нам."
 STALKER.63.b: "Управлять Зоной будем мы."
 STALKER.63.b_tt: "[?global.STALKER_commission_proposer.GetName] станет хуже к нам относиться и не сможет повторить предложение §Y365 дн.§!"
 STALKER.64.t: "След остыл"
 STALKER.64.d: "Контрабандистов предупредили до того, как наши сотрудники начали действовать. Курьеры исчезли, а вместе с ними и артефакты."
 STALKER.64.a: "В следующий раз найдём."
 STALKER.65.t: "Совместная комиссия по Зоне согласована"
 STALKER.65.d: "Правительство, контролирующее Чернобыльскую Зону, приняло наше предложение. Его и наши сотрудники будут вместе патрулировать зону отчуждения, а наши учёные получили доступ."
 STALKER.65.a: "Хорошие соседи делят забор."
 STALKER.66.t: "Комиссия отклонена"
 STALKER.66.d: "Наше предложение о совместной комиссии по Зоне отклонено. Периметр на нашей стороне остаётся только нашей проблемой."
 STALKER.66.a: "Тогда мы охраняем свою сторону."
 STALKER_reinforce_polesie_reserve_available_tt: "Безопасность Полесья ниже §Y90§! (сейчас §Y[?ROOT.STALKER_polesie_security|0]§!)."
 STALKER_belarus_border_seizure_available_tt: "В обороте не менее §Y5§! контрабандных артефактов (сейчас §Y[?global.STALKER_smuggled_artifacts|1]§!)."
 STALKER.110.t: "Зона расширяется"
 STALKER.110.d: "Аномалии в [STALKER_zone_name] перекинулись на соседний регион. Колодцы испортились, стрелки компасов вращаются, а в городах, которые этого никогда не ждали, звучат первые предупреждения о выбросе."
 STALKER.110.t_drift: "Зона смещается"
 STALKER.110.d_drift: "Аномалии в [STALKER_zone_name] сдвинулись. Один соседний регион очищается, но они перекинулись на другой, где испортились колодцы и звучат первые предупреждения о выбросе."
 STALKER.110.a: "Эвакуировать пострадавшие города."
 STALKER.110.a_tt: "Стоит §Y0.4%§! ВВП. Пострадавший регион §Yэвакуирован§! на §Y180 дн.§!"
 STALKER.110.b: "Люди остаются в своих домах."
 STALKER.111.t: "Зона отступает"
 STALKER.111.d: "Работы по сдерживанию в [STALKER_zone_name] приносят плоды. Аномальные показания в соседнем регионе вернулись к норме, и линию отчуждения там сняли."
 STALKER.111.a: "Одним регионом для охраны меньше."
 STALKER_zone_evacuated: "Эвакуация из Зоны"
 STALKER_zone_evacuated_desc: "Жителей вывезли из городов, до которых дошла аномальная Зона."
 STALKER.41.t: "Пропавшие в глуши"
 STALKER.41.d: "Изыскательская группа пропала в отдалённой Зоне в [STALKER_zone_name], а ближайший аэродром в сотнях километров. В последнем радиовызове описывалась местность, которая больше не совпадала с их картами."
 STALKER.41.a: "Организовать спасательную операцию."
 STALKER.41.a_tt: "Стоит §R25§! политической власти. §YЭксплуатация§! Зоны растёт на §G5§!: спасатели прокладывают новые маршруты."
 STALKER.41.b: "Списать их."
 STALKER.41.b_tt: "Число §Yсталкеров§! падает до §Y5§!."
 STALKER.42.t: "Кризис эвакуации"
 STALKER.42.d: "Внутри нового периметра в [STALKER_zone_name] всё ещё живут десятки тысяч людей, и многие отказываются покидать дома, принадлежавшие их семьям поколениями. Местные чиновники хотят знать, будет ли армия выселять их силой."
 STALKER.42.a: "Эвакуировать силой."
 STALKER.42.a_tt: "§YСдерживание§! Зоны растёт на §G10§!, а мы теряем §R2%§! стабильности."
 STALKER.42.b: "Пусть остаются."
 STALKER.42.b_tt: "Число §Yсталкеров§! растёт на §Y10§!, а влияние §Yбандитов§! — на §R5§!."
 STALKER.43.t: "Речной путь"
 STALKER.43.d: "Контрабандисты по ночам вывозят артефакты из [STALKER_zone_name] по реке на каноэ и баржах, которые наши патрули не могут отличить от обычного движения. Эта торговля обогащает местные банды."
 STALKER.43.a: "Патрулировать реки."
 STALKER.43.a_tt: "Требует небольших расходов. Влияние §Yбандитов§! в Зоне падает до §G15§!."
 STALKER.43.b: "Тихо обложить движение налогом."
 STALKER.43.b_tt: "Добавляет §G3§! артефакта в национальный запас. Влияние §Yбандитов§! в Зоне растёт на §R5§!."
 STALKER.44.t: "Лаборатория по соседству"
 STALKER.44.d: "Зона в [STALKER_zone_name] поглотила землю вплоть до забора секретного государственного объекта. Его учёные просят доступа к аномалиям, а начальники охраны хотят оцепить объект."
 STALKER.44.a: "Начать секретную исследовательскую программу."
 STALKER.44.a_tt: "§YЭксплуатация§! Зоны растёт на §G10§!, усиливая наши исследования Зоны."
 STALKER.44.b: "Оцепить объект."
 STALKER.44.b_tt: "§YСдерживание§! Зоны растёт на §G10§!."
 STALKER.45.t: "Аномальный импульс у прибрежного комплекса"
 STALKER.45.d: "Рядом с важнейшими прибрежными реакторами в [STALKER_zone_name] возникли сильные гравитационные и электромагнитные аномалии. Из-за отказов компасов нарушено судоходство на ближайших морских путях, а техники просят специальную изоляцию для сдерживания."
 STALKER.45.a: "Установить морские запретные кордоны и укрепить сеть."
 STALKER.45.a_tt: "Стоит §R25§! политической власти и §R0.2%§! ВВП. §YСдерживание§! Зоны растёт на §G15§!, а §Yактивность§! падает на §G5§!."
 STALKER.45.b: "Использовать аномальное излучение для атомных исследований."
 STALKER.45.b_tt: "§YЭксплуатация§! Зоны растёт на §G10§!, §Yактивность§! — на §R5§!, а §Yсдерживание§! падает на §R10§!. Добавляет §G1§! аномальный образец в национальный запас артефактов."
 STALKER.46.t: "Оттаивающая глубинная Зона"
 STALKER.46.d: "Глубинные подземные аномалии раскололи вечную мерзлоту в [STALKER_zone_name]. В отдалённых долинах тундры на поверхность выходят геотермальные источники и скопления кристаллических артефактов, но зимние пути снабжения разрушаются из-за перепадов температуры."
 STALKER.46.a: "Направить тяжёлые ледокольные и инженерные колонны."
 STALKER.46.a_tt: "Стоит §R25§! политической власти и §R0.2%§! ВВП. §YСдерживание§! Зоны растёт на §G10§!, влияние §Y«Долга»§! — на §G5§! (только в исходной Зоне), а популяции мутантов падают до §G10§!."
 STALKER.46.b: "Субсидировать экспедиции независимых старателей."
 STALKER.46.b_tt: "Стоит §R15§! политической власти. Число §Yсталкеров§! растёт на §Y10§!, §Yэксплуатация§! Зоны — на §G10§!, а §Yсдерживание§! падает на §R5§!. Добавляет §G2§! аномальных образца в национальный запас артефактов."
 STALKER.47.t: "Артефакты чёрного рынка в пригородах"
 STALKER.47.d: "На густонаселённой окраине в [STALKER_zone_name] аномальными артефактами открыто торгуют на городских барахолках. Богатые коллекционеры и университетские исследователи соперничают с местными уличными бандами за неописанные аномалии."
 STALKER.47.a: "Начать военизированные полицейские облавы."
 STALKER.47.a_tt: "Стоит §R30§! политической власти и §R1%§! стабильности. Влияние §Yбандитов§! в Зоне падает до §G15§!, §Yсдерживание§! растёт на §G10§!, а число §Yсталкеров§! падает до §R5§!."
 STALKER.47.b: "Открыть государственные оценочные пункты."
 STALKER.47.b_tt: "Стоит §R0.2%§! ВВП. §YЭксплуатация§! Зоны растёт на §G10§!, число §Yсталкеров§! — на §G5§!, а влияние §Y«Свободы»§! — на §G5§! (только в исходной Зоне). Добавляет §G2§! аномальных образца в национальный запас артефактов."
 STALKER.48.t: "Шепчущий полог"
 STALKER.48.d: "В густых джунглях в [STALKER_zone_name] аномальная растительность и споры грибов затянули пограничные речные блокпосты. Разведчики экспедиций сообщают об аномальной биолюминесценции и меняющихся тропах под пологом леса."
 STALKER.48.a: "Прорубить широкие противопожарные полосы вокруг кордона."
 STALKER.48.a_tt: "Стоит §R20§! политической власти и §R0.1%§! ВВП. §YСдерживание§! Зоны растёт на §G10§!, популяции мутантов падают до §G10§!, а §Yактивность§! — на §G5§!."
 STALKER.48.b: "Собирать биологические образцы с зарослей."
 STALKER.48.b_tt: "§YЭксплуатация§! Зоны растёт на §G15§!, §Yсдерживание§! падает на §R5§!, а популяции мутантов растут до §R5§!. Добавляет §G1§! аномальный образец в национальный запас артефактов."