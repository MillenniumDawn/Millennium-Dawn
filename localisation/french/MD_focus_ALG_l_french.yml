 ALG_unlock_FLN_focus_tt: "§4Faire du FLN le parti dominant et choisir ensuite de former une coalition ou de rester seul au pouvoir§!"
 ALG_fln_coalition_tt: "Nous avons formé la Coalition présidentielle et nous obtenons de l'argent des autres partis"
 ALG_fln_no_coalition_tt: "Nous choisissons de rester seuls au pouvoir"
 FLN_focus: "La domination du FLN"
