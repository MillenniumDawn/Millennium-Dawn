 PRU.socialism: "£PRU_anarchist_communism (APRA) 美洲人民革命联盟 - 亲西方派"
 PRU.socialism_desc: "（第三道路）美洲人民革命联盟最初是一个反帝国主义运动，其目标是建立一个统一的南美洲。自1930年成立以来，美洲人民革命联盟参与了多届政府。虽然最初是一个较为激进的左翼政党，但在艾伦·加西亚的领导下，该党逐渐偏离了其根基，采取了第三道路的社会民主主义和日益新自由主义的政策。"
 PRU.socialism_1: "£generic_socialism_small (PNP) 秘鲁民族主义党"
 PRU.socialism_1_desc: "（第三道路）秘鲁民族主义党由奥良塔·乌马拉创立，最初是作为民族主义运动的政治工具而成立的 - 尽管在成立后不久，奥良塔就与激进运动保持距离 - 转而拥抱社会民主主义和新自由主义政策。"
 PRU.Nat_Fascism: "£generic_Nat_Fascism_small 种族灭绝运动"
 PRU.Nat_Fascism_desc: "（第三位置主义）民族主义运动是秘鲁的一个政治运动，由乌马拉家族于20世纪80年代秘鲁内战期间创立，该家族最初塑造了运动的早期发展。该运动汲取了多种意识形态的灵感，包括印第安主义、卡扎菲主义、反殖民主义、泛阿拉伯主义和秘鲁民族主义。它拥护种族优越论、秘鲁领土收复主义和社会保守主义观点，并融合了反资本主义和反马克思主义立场，因此被指责具有法西斯主义性质 - 许多人认为该运动是典型的第三位置主义运动。"
 PRU.Nat_Populism_1: "£generic_Nat_Populism_small (C90-NM) 变革90-新多数派"
 PRU.Nat_Populism_1_desc: "（右翼民粹主义）“变革90”党是为阿尔韦托·藤森的总统任期而成立的政治工具，而“新多数派”党则同样以支持藤森主义为核心。这两个政党自然而然地紧密结盟，形成选举和政治联盟，共同推进其共同目标。"
 PRU.Nat_Populism_2: "£generic_Nat_Populism_small (FP) 人民力量"
 PRU.Nat_Populism_2_desc: "（右翼民粹主义）人民力量党由新多数派和变革90党组成，延续了阿尔韦托·藤森的政治遗产，支持其家族成员的政治抱负，并寻求实施其保守的社会和经济新自由主义政策的民粹主义议程。"
 LIT.anarchist_communism_1: "£generic_anarchist_communism_small (SPF) 社会主义人民阵线"
 LIT.anarchist_communism_desc_1: "（民主社会主义）- 社会主义人民阵线由两个左翼政党合并而成，其行动和观点在立陶宛国内多次引发共产主义合法性争议。该党力图在保持较为温和的纲领的同时，成为该国左翼的广泛代表。该党一方面认同西方社会民主主义和前苏联社会主义的积极方面，另一方面又与社会主义中较为保守的派别紧密相连，例如反对LGBTQ权利、移民以及加入欧盟等机构。"
 LIT.Autocracy: "£generic_Autocracy_small (LLP) 立陶宛人民党"
 LIT.Autocracy_desc: "（左翼民粹主义）- 立陶宛人民党名义上是左翼政党，但实际上是立陶宛一个亲俄政党，寻求与俄罗斯和白俄罗斯建立更紧密的联系，同时反对与美国和欧盟一体化。该党奉行社会保守主义和经济民粹主义相结合的理念。"
 SAO.Neutral_conservatism: "£generic_Neutral_conservatism_small (ADI)  - 独立民主行动"
 SAO.Neutral_conservatism_desc: ""
 SAO.anarchist_communism: "£generic_anarchist_communism_small (MLSTP-PSD)  - 圣多美和普林西比解放运动 - 社会民主党"
 SAO.anarchist_communism_desc: ""
 SAO.Nat_Autocracy: "£generic_Nat_Autocracy_small (JNS) -  民族救国委员会"
 SAO.Nat_Autocracy_desc: ""
 VIE.Western_Autocracy: "£generic_Western_Autocracy_small (VNQDĐ) 越南国民党"
 VIE.Western_Autocracy_desc: "（大西洋主义） - 越南国民党最初于1927年成立，是一个效仿孙中山思想及早期国民党模式的左翼进步政党，但很快就被日益壮大的印度支那共产党边缘化，内部派系斗争削弱了其实力，并面临南方越南共和国与北方越南民主共和国的双重压力。随着北方的最终胜利，该党全体流亡，主要在海外侨民社区活动，其意识形态仅名义上保留着建党初期的纲领。"
 VIE.anarchist_communism: "£generic_anarchist_communism_small （VFF）越南祖国阵线"
 VIE.anarchist_communism_desc: "（人民阵线） - 越南祖国阵线是越南社会主义共和国的官方人民阵线。虽然实际上由越南共产党主导，但祖国阵线名义上是一个独立的组织。该组织的目的是将许多小型运动 - 如青年团体、工会以及历史上其他政党 - 联合在一个共同的旗帜之下。"
 WAA.Nat_Autocracy: "£generic_Nat_Autocracy_small （UWSA）佤邦联合军"
 WAA.Nat_Autocracy_desc: "（红色军政府） - 作为执政党佤邦联合党的军事分支，佤邦联合军作为党的直接控制下的延伸机构运作。与其上级组织类似，佤邦联合军与中国关系密切，力求在缅甸其他势力间保持中立，同时维持佤邦现状。"
 SUR.neutral_Social_desc: ""
 MRT.Neutral_social_desc: ""
 BUL.anarchist_communism_desc: ""
 COM.Neutral_Muslim_Brotherhood: "£generic_Neutral_Muslim_Brotherhood_small (PJ) - 朱瓦党"
 COM.Neutral_Muslim_Brotherhood_icon: "£generic_Neutral_Muslim_Brotherhood_small"
 COM.Neutral_Muslim_Brotherhood_desc: "（反帝国主义世俗主义） - 朱瓦党\n\n由艾哈迈德·阿卜杜拉·穆罕默德·桑比领导的朱瓦党，常被称为“科摩罗的阿亚图拉”，倡导世俗主义，反对科摩罗的威权统治。该党致力于维护选举进程，确保选举自由，并维护科摩罗的统一。"
 SWA.conservatism_desc: "（自由保守派）\n斯威士兰民族运动\n\nSSNM于1996年作为一场文化运动兴起，呼吁将君主制改革为君主立宪制，并建立全面的多党民主制度。\n\nSSNM公开表示，廷昆德拉分权制度彻底失败，不能代表[SWA.GetName]人民。"
 CHE.liberalism_desc: "（亲西方自由主义） - 车臣民主党\n\n车臣民主党是一个主张独立、世俗化与民主理念的政党。该党明确拒绝政治伊斯兰主义及其他激进意识形态，并着力与瓦伊纳赫民主党等过往的民族主义运动划清界限 - 认为这些组织已蜕变为极端势力。其政治纲领包括：实现车臣从俄罗斯控制下的\"去占领化\"，推动国际社会追诉战争罪行，以及对车臣战争造成的损失进行全额赔偿。"
 CHE.Caliphate_desc: "（激进萨拉菲主义） - 伊奇克里亚与达吉斯坦人民大会\n\n伊奇克里亚与达吉斯坦人民大会是一个伊斯兰恐怖组织，于1998年在车臣与达吉斯坦叛军指挥官联合领导下成立，由沙米尔·巴萨耶夫主导，并得到外籍阿拉伯雇佣兵伊本·哈塔卜及其与“巴德尔”（满月）组织有关联的核心圈子的支持。该组织于1998年在格罗兹尼举行大会后正式形成，其主要目标是在车臣和达吉斯坦地区建立一个独立的伊斯兰国家。"
 CHE.Kingdom: "£CHE_Islamic_Brigade (IB/IBON) 伊斯兰旅"
 CHE.Kingdom_desc: "（萨拉菲主义） - 伊斯兰旅\n\n伊斯兰旅，又称艾哈迈多夫教团，是由车臣指挥官拉姆赞·艾哈迈多夫及其兄弟于1999年成立的萨拉菲派武装组织，以参与绑架和谋杀而臭名昭著。该组织因反对总统阿斯兰·马斯哈多夫较为世俗化的政策而组建为武装反对力量，并于1998年在乌鲁斯-马尔坦战役中与政府军发生军事冲突。该组织由驻扎在车臣许多地区、城市和村庄的多个团体（教团）组成，其中最具影响力的分支是乌鲁斯-马尔坦教团，该教团完全控制了乌鲁斯-马尔坦区。"
 CHE.Kingdom_icon: "£CHE_Islamic_Brigade"
 CHE.oligarchism_desc: "（军国/匪帮主义） - 伊斯兰教法最高委员会\n\n伊斯兰教法最高委员会及其武装分支伊斯兰特种任务团，亦称\"为主道圣战\"伊斯兰特种团。该组织是活跃于车臣地区的圣战组织，由车臣军阀阿尔比·巴拉耶夫于1996年创立，前身为武装部队下属单位。该组织致力于建立以伊斯兰教法统治的车臣国家，并以绑架劫持、石油走私及恐怖行动而臭名昭著。其曾参与古杰尔梅斯的瓦哈比派暴动，导致总统阿斯兰·马斯哈多夫下令将其正式解散，但该组织仍持续活动。1998年四名外国移动通信工程师遭绑架斩首事件后，该组织被指与基地组织存在关联，但巴拉耶夫本人对此予以否认。"
 CHE.Neutral_Muslim_Brotherhood: "£generic_Neutral_Muslim_Brotherhood_small (PD) 焦哈尔之路"
 CHE.Neutral_Muslim_Brotherhood_desc: "（伊斯兰主义）- 焦哈尔之路\n\n\"焦哈尔之路\"是由焦哈尔·杜达耶夫的亲密伙伴及继任者泽利姆汗·扬达尔比耶夫领导的车臣伊斯兰主义政治运动。杜达耶夫去世后，扬达尔比耶夫于1996年至1997年间领导车臣。在1997年总统选举中败于阿斯兰·马斯哈多夫后，扬达尔比耶夫与马斯哈多夫关系破裂，随后被指控策划刺杀马斯哈多夫。马斯哈多夫公开谴责扬达尔比耶夫，指控其引入瓦哈比主义并资助反国家活动。此后扬达尔比耶夫加入强硬派伊斯兰主义反对阵营，与阿尔比·巴拉耶夫建立联系。目前扬达尔比耶夫常居卡塔尔，其政党作为政治实体已基本停止运作。"
 CHE.Nat_Fascism_desc: "（车臣民族主义） - 伊奇克里亚与达吉斯坦人民大会\n\n焦哈尔·杜达耶夫军由萨尔曼·拉杜耶夫于1997年创建，作为\"焦哈尔之路\"的战斗单位，宣称将持续作战直至俄罗斯承认车臣独立。实际上，该组织仅作为小型武装团伙活动，参与抢劫与炸弹袭击。拉杜耶夫以浮夸着装和妄想言论著称，包括冒领虚假袭击责任、声称杜达耶夫仍藏身于土耳其的秘密北大西洋公约组织基地指挥圣战。在1997年选举中未能争取到盟友后，拉杜耶夫在格罗兹尼发起长期集会，最终因支持者溃散导致枪战，其副指挥官在冲突中丧生。拉杜耶夫逃亡巴基斯坦，直至第二次车臣战争前夕才潜回车臣。"
 CHE.Nat_Autocracy1: "£generic_Nat_Autocracy_small (PNN) 民族独立党"
 CHE.Nat_Autocracy2: "£generic_Nat_Autocracy_small (CF) 高加索前线"
 CHE.Nat_Autocracy_desc1: "（车臣民族主义） - 伊奇克里亚与达吉斯坦人民大会\n\n民族独立党是车臣温和民族主义政党，由商人鲁斯兰·库塔耶夫创立。该党最初反对焦哈尔·杜达耶夫总统，批评其腐败与威权统治。随着第一次车臣战争爆发，该党转为坚定支持杜达耶夫及车臣独立，并于1995年重建后成为最强力的亲政府力量之一。该党在1997年总统与议会选举中取得压倒性胜利，支持广受认可的温和派候选人阿斯兰·马斯哈多夫与瓦哈·阿尔萨诺夫。此后，其影响力逐渐被强硬的伊斯兰主义反对派超越，马斯哈多夫仅与该党保持松散联系。"
 CHE.Nat_Autocracy_desc2: ""
 CHE.Conservative_desc: "（亲俄忠诚派民兵 / 威权主义） - 卡德罗夫派\n\n卡德罗夫派是由艾哈迈德·卡德罗夫在第二次车臣战争初期，由叛变的分离主义战士组建的亲克里姆林宫车臣民兵组织。该组织以实施报复行动和恐吓手段而闻名，反对瓦哈比派的影响，拒绝车臣独立，主张在有限自治下重新融入俄罗斯。"
 TAI.Western_Autocracy: "£TAI_conservatism (KMT) 中国国民党 - (独裁派)"
 TAI.Western_Autocracy_desc: "（大西洋主义） - 国民党，亦称中国国民党，由孙中山于1894年创立。这位受中国大陆与现居台湾岛的中华民国共同尊崇的领袖，曾引领该党致力于中国统一事业，建立了包纳诸多团体与思想的统一战线。党的官方意识形态深受孙中山“三民主义”影响，其核心要义包括民族主义、民权主义与民生主义。该党最初呈现左倾倾向，甚至曾与苏联结盟，但1927年上海清党屠杀事件导致国共决裂，不久即引发中国内战。国民党在内战结束前始终以不同形式掌控中国政权，最终在内战末期退守台湾岛，建立一党专政的中华民国残余政权，直至1987年恢复民主政治后仍是岛内根深蒂固的政治力量。基于其反共立场、内战历史与冷战格局，国民党逐渐右转，将三民主义调适为契合民族主义与保守主义的政治纲领。"
 TAI.socialism_1: "£generic_socialism_small (NPP) 时代力量"
 TAI.socialism_1_desc: "（左翼民族主义） - 时代力量，于2015年成立，主张台湾完全且正式地从中国独立出去。该党立场比民进党更为激进，采取甚至更坚定的左翼纲领，但尚未与台湾现有的两大政治联盟中的任何一方结盟。"
 TAI.Neutral_Autocracy: "£TAI_conservatism (KMT) 国民党 - (务实派)"
 TAI.Neutral_Autocracy_desc: "（务实保守主义） - 国民党，亦称中国国民党，由孙中山于1894年创立。这位受中国大陆与现居台湾岛的中华民国共同尊崇的领袖，曾引领该党致力于中国统一事业，并为诸多团体与理念构建了统一战线。党的官方意识形态深受孙中山“三民主义”影响，其核心要义包括民族主义、民权主义与民生主义。该党最初呈现左倾倾向，甚至曾与苏联结盟，但1927年上海清党屠杀事件导致国共决裂，不久即引发中国内战。国民党在内战结束前始终以不同形式掌控中国政权，最终在内战末期退守台湾岛，建立一党专政的中华民国残余政权，直至1987年恢复民主政治后仍是岛内根深蒂固的政治力量。基于其反共立场、内战历史与冷战格局，国民党逐渐右转，将三民主义调适为契合民族主义与保守主义的政治纲领。"
 TAI.neutral_Social_1: "£generic_neutral_Social_small （TPP）台湾民众党"
 TAI.neutral_Social_1_desc: "（左翼民粹主义） - 成立于2019年的台湾民众党，自诩为台湾政治体制中替代国民党和民进党的选择。名义上是一个反对建制的大帐篷政党，但其纲领和宣称的目标更偏向中左翼而非中间立场。"
 TAI.Nat_Fascism_1: "£TAI_anarchist_communism （CUPP）中华统一促进党"
 TAI.Nat_Fascism_1_desc: "（民族保守主义） - 在政治上高度右倾的统促党，其有限的政治纲领主要围绕在一个中国原则下，以\"一国两制\"方式实现与中国大陆统一。该党自身试图通过削弱甚至恐吓台湾乃至香港的民主派人士来推动中国利益的实现。"
 LEB.socialism_arm: "£generic_socialism_small (SDHP) 社会民主号角党"
 LEB.socialism_arm_desc: "（左翼社会民主主义）- 成立于1887年的社会民主号角党是代表亚美尼亚人历史最悠久的政党之一，曾在奥斯曼帝国和伊朗等地活动。该党奉行较为社会主义的政治纲领，主张在黎巴嫩实行计划经济，同时寻求与欧洲和西方加强合作。"
 LEB.liberalism_arm: "£generic_liberalism_small (ADL) 亚美尼亚民主自由党 - 拉姆加瓦尔"
 LEB.liberalism_arm_desc: "（民族自由主义）- 成立于1921年的亚美尼亚民主联盟致力于服务全球亚美尼亚侨民，同时在亚美尼亚国内也设有一个姊妹党。该党在意识形态上支持温和的自由主义纲领，拥护市场经济，这使其有别于大多数倾向于左翼或融合主义的亚美尼亚侨民政党。该党的发展一直落后于竞争对手，即使在亚美尼亚国内，其影响力也十分有限。"
 LEB.anarchist_communism_arm: "£LEB_socialist_democratism 塔什纳克/亚美尼亚革命联盟- （§7新兴主义§!派）"
 LEB.anarchist_communism_arm_desc: "（左翼民族主义）- 黎巴嫩亚美尼亚革命联盟的当地名称为塔什纳克党，可能是黎巴嫩最大的政党，代表着亚美尼亚人的利益。该党秉持民主社会主义意识形态，在黎巴嫩独立后的几届政府中都发挥了积极作用。作为亚美尼亚革命联盟的一部分，该党与亚美尼亚本土以及整个亚美尼亚侨民群体都保持着密切联系。"
 LEB.Neutral_Libertarian_arm: "£generic_Neutral_Libertarian_small 自由黎巴嫩亚美尼亚运动"
 LEB.Neutral_Libertarian_arm_desc: "（新自由主义）- 由一群黎巴嫩亚美尼亚商人组成的自由黎巴嫩亚美尼亚运动，支持温和的自由主义纲领，强调世俗政府。该党成员寥寥无几，选举成绩也十分有限。"
 LEB.Nat_Fascism_arm: "£LEB_socialist_democratism 塔什纳克/亚美尼亚革命联盟- （§Y民族主义§!派）"
 LEB.Nat_Fascism_arm_desc: "（社会民族主义）- 塔什纳克，即黎巴嫩境内亚美尼亚革命联盟的当地名称，可能是黎巴嫩最大的政党，代表着亚美尼亚人的利益。该党秉持民主社会主义意识形态，在黎巴嫩独立后的历届政府中都扮演着积极的角色。作为亚美尼亚革命联盟的一部分，该党与亚美尼亚本土以及整个亚美尼亚侨民群体都保持着密切联系。"
 BEN.Monarchist: "£generic_Monarchist_small 阿波美王室"
 BEN.Monarchist_desc: "（传统君主主义）- 阿波美皇家法院\n\n阿波美王室是阿拉达克索努王朝的所在，该王朝是达荷美王国的国王，其阿霍苏至今仍是贝宁最重要的传统统治者。王室不行使宪法赋予的权力；它负责仲裁土地和家族纠纷，主持伏都教仪式，并代表丰族人的身份认同。\n\n作为一个执政联盟，它主张恢复达荷美王权：权力根植于王室家族，伏都教为国教，阿波美而非科托努为国家中心。其影响力源于王位的道德威望、法律认可的传统酋长以及国王抵抗法国的英勇事迹。"
 BEN.Neutral_Libertarian: "£generic_Neutral_Libertarian_small (PRD) - 民主复兴党"
 BEN.Neutral_Libertarian_desc: "（社会自由主义）- 民主复兴党\n\n民主复兴党是资深律师阿德里安·洪贝吉的政治工具，他曾多次主持国民议会会议。该党以波多诺伏和韦梅河谷为据点，主张法治、权力下放和自由改革的经济，并将首都的地区利益视为国家利益。\n\n它时而与反对派结盟，时而与总统合作，在四分五裂的议会中扮演着“造王者”的角色。2022年，它并入进步革新联盟，结束了其独立存在。它的影响力在于乌梅选区的选票、洪贝吉党的机构地位以及其作为南北枢纽的作用。"
 CBD.liberalism: "£generic_liberalism_small (SRP) 桑兰西党"
 CBD.liberalism_1: "£generic_liberalism_small (CLP) 烛光党"
 CBD.liberalism_desc: "（进步自由主义）- 该党成立于1995年，最初名为高棉民族党，1998年更名为桑兰西党。该党奉行自由主义纲领，倡导柬埔寨的民主改革。由于柬埔寨人民党-奉辛比克联盟的长期统治以及柬埔寨的专制体制，该党在选举中鲜有斩获。"
 CBD.Monarchist: "£generic_Monarchist_small 诺罗敦王室"
 CBD.Monarchist_desc: "（专制君主主义）- 诺罗敦王室在19世纪末期崛起，其首任国王安阳奠定了法国干预柬埔寨内政以及柬埔寨与泰国和越南关系的基础。此后的统治者继承了这一遗产，诺罗敦家族的两个分支轮流执政，直至法国的影响力最终达到足以稳固支持一位统治者的程度。1970年，在一场亲美的共和政变中，王室被废黜，流亡朝鲜，并在那里认同了共产主义理念。之后，他们返回柬埔寨，试图融入红色高棉政府。诺罗敦·西哈努克曾短暂担任红色高棉国家元首，之后王室再次被迫流亡，直到1993年君主制复辟。"
 ECU.liberalism: "£ECU_anarchist_communism (PAIS) 主权祖国联盟/骄傲与主权的祖国（右翼）"
 ECU.liberalism_desc: "（新自由主义）- 作为席卷拉丁美洲的“粉红浪潮”的一部分，骄傲与主权的祖国最初奉行温和的左翼纲领，将玻利瓦尔主义、进步主义和社会主义思想融合在一起，形成一个广泛的左翼民粹主义联盟。尽管初期取得了成功，但该党逐渐向中间靠拢，党内右倾因素日益凸显，其灵感来源于“第三条道路”以及与自由主义理念相符的思想。"
 ANT.neutral_Social: "£generic_neutral_Social_small (ABLP) - 安提瓜和巴布达工党"
 ANT.neutral_Social_desc: "（工党主义）- 安提瓜和巴布达工党\n\n安提瓜和巴布达工党由维尔·康沃尔·伯德于1946年5月18日创立，是安提瓜工会和劳工联盟的政治分支。在伯德担任总理期间，该党领导安提瓜和巴布达于1981年实现自治和独立。工党最初是糖业工人的政党，后来发展成为一个务实、经济自由主义的执政党，其经济支柱包括旅游业、离岸金融和投资入籍计划。该党在社会议题上持保守立场，风格民粹主义，其核心是伯德家族，自2012年以来，加斯顿·布朗也加入了该党。\n\n自1976年以来，该家族几乎一直执政，仅有十年例外：维尔·伯德执政至1994年，其子莱斯特·伯德执政至2004年，布朗自2014年6月13日起执政。该家族在1999年的选举中得票率为52.94%，赢得17个席位中的12个；在2004年败选时得票率为41.9%，仅赢得4个席位；2014年得票率为56.45%，赢得14个席位；2018年得票率为59.24%，赢得15个席位；2023年得票率为47.06%，赢得9个席位。该家族的优势在于其掌控公共部门工资和乡村事务的强大政治机器；其弱点在于伯德家族及其继任者屡屡卷入的腐败丑闻。"
 LAT.Monarchist_desc: "(贵族君主制) - 库尔兰贵族会议\n\n 库尔兰贵族会议是在第一次世界大战期间，由德国占领的拉脱维亚领土上召开的。会议由库尔兰贵族组织。会议期间，与会者宣布从俄罗斯帝国独立，并与德国建立个人联盟。目前，这个机构需要选举一位新国王。"
 ADS.Nat_Autocracy: "£ads_nationalist_military_junta  (ADF) - 阿尔比恩国防军"
 ADS.Nat_Autocracy_desc: "(民族主义准军事公司) - 阿尔比恩国防军\n\n为应对英国主权日益增长的威胁而成立的阿尔比恩国防军的核心目标是建立一条安全带，以确保国家稳定和[ENG.GetLeader]的安全。"
 HOL.Western_Autocracy: "£HOL_nationalist_monarchist (W-HoON) - 奥兰治-拿骚王室"
 HOL.Western_Autocracy_icon: "£HOL_nationalist_monarchist"
 HOL.Western_Autocracy_desc: "(西式专制主义) - 奥兰治-拿骚王室。奥兰治-拿骚王室对荷兰国家行使直接行政权，将政治权力集中于王室，同时在外交和经济政策上保持鲜明的西方倾向。议会和法院名义上继续运作，但有关安全、战略和国家优先事项的关键决策均由君主制定，并由忠诚的大臣执行。该王朝将自身统治标榜为欧洲宪政传统的稳定延续，强调秩序、行政纪律以及与北约和欧盟的坚定联盟。政治多元化仅在王室设定的范围内存在，以确保团结、稳定和西方联盟凌驾于党派冲突之上。"
 LKT.Western_Autocracy: "£generic_Western_Autocracy_small 达科他民主党"
 LKT.Western_Autocracy_icon: "£generic_Western_Autocracy_small"
 LKT.Western_Autocracy_desc: "£generic_Western_Autocracy_small 达科他民主党 - (DDP) 民主党是一个相当直截了当的政党，他们信奉民主制度，然而有人将其与古希腊的民主形式相提并论，从长远来看，这些古希腊城邦最终演变成了寡头政治。但该党通过提醒人民行动胜于雄辩来驳斥这些指控。"
 LKT.conservatism: "£generic_conservatism_small 旧共和党"
 LKT.conservatism_icon: "£generic_conservatism_small"
 LKT.conservatism_desc: "£generic_conservatism_small 旧共和国党 - (ORP) 旧共和国党在技术上延续了原属旧共和国共和党与民主党的中右翼人士。该党认为，旧共和国的内爆源于媒体煽动和暴民统治的升级，而通过稳步迈向某种程度的保守主义国家，旧共和国将在新的光芒中重生。"
 LKT.liberalism: "£generic_liberalism_small 伟大自由党"
 LKT.liberalism_icon: "£generic_liberalism_small"
 LKT.liberalism_desc: "£generic_liberalism_small 大自由党 -（GLP）是一个标准的中间偏左政党。它侧重于更自由的社会政策，并确保推行自由的农业议程，以维持大平原地区的繁荣。总体而言，大自由党是一种自由民族主义政党，通过自由主义政策来促进共和国独立于外国势力。"
 LKT.socialism: "£USA_shepeard_party 农民进步党"
 LKT.socialism_icon: "£USA_shepeard_party"
 LKT.socialism_desc: "£USA_shepeard_party 农民进步党 - (FPP) 农民进步党是一个温和的农业主义政党。他们秉持着\"没有粮食，国家与人民皆无法生存\"的理念，将经济和社会政策的核心聚焦于农业劳动者阶层。基于这种\"从底层出发\"的指导思想，该党致力于通过优先发展农业来建设国家。"
 LKT.anarchist_communism: "£generic_anarchist_communism_small 拉科塔农业学会"
 LKT.anarchist_communism_icon: "£generic_anarchist_communism_small"
 LKT.anarchist_communism_desc: "£generic_anarchist_communism_small 拉科塔农业学会 - (LAS) 拉科塔农业学会是一个传统的无政府主义政党。他们致力于瓦解政府机构，使国家回归到更接近工团主义的领导模式 - 在这种模式下，权力金字塔在某种程度上更接近于一个立方体。农民和工人联合会负责协调生产与专业化分工，相关信息上报给社区委员会，并逐级向上传递，最终聚焦于服务地方民众，推动各地区发展，从而将这些地方联合成一个统一的国家。"
 LKT.Conservative: "£generic_Conservative_small 部落传统党"
 LKT.Conservative_icon: "£generic_Conservative_small"
 LKT.Conservative_desc: "£generic_Conservative_small 部落传统党 - (TTP) 部落传统党本身就是一个联合政党。凭借传统主义和社会保守主义的凝聚原则，原住民和所有其他民族能够团结起来，共同维护和平，为所有人设定缓慢前行的道路。"
 LKT.Autocracy: "£generic_Autocracy_small 堪萨斯城联盟"
 LKT.Autocracy_icon: "£generic_Autocracy_small"
 LKT.Autocracy_desc: "£generic_Autocracy_small 堪萨斯城联盟 - (KCK) 堪萨斯城联盟是一个经济优先型政党。致力于让我们这个欠发达的国家达到与沿海地区相媲美的水平。KCK认为，当经济对每个人来说都稳定且健康时，政治和社会政策自然会由人民来决定。"
 LKT.Neutral_Muslim_Brotherhood: "£generic_Neutral_Muslim_Brotherhood_small 伊斯兰国"
 LKT.Neutral_Muslim_Brotherhood_icon: "£generic_Neutral_Muslim_Brotherhood_small"
 LKT.Neutral_Muslim_Brotherhood_desc: "£generic_Neutral_Muslim_Brotherhood_small 伊斯兰国 - 伊斯兰国是一个非裔美国人文化团体，旨在促进并保障黑人在白人主导的美国社会中的地位。在拉科塔共和国，他们与当地原住民结成不稳定的联盟，试图在白人占多数的局面下争取一定的选举影响力。然而，该组织中的激进成员却试图建立一个仅限黑人的新国家，将其视为美洲大陆上黑人群体的救赎之路。"
 LKT.Neutral_Autocracy: "£generic_Neutral_Autocracy_small 青年实业家党"
 LKT.Neutral_Autocracy_icon: "£generic_Neutral_Autocracy_small"
 LKT.Neutral_Autocracy_desc: "£generic_Neutral_Autocracy_small 青年实业家党 - (YIP) 该党以新一代及其追求的未来为核心。成员多为二三十岁的年轻人，是一个致力于现代化的政党，旨在通过经济计划和改革推动国家步入现代，建立真正的工业和企业办公基础，以平衡极为强大的农业影响力。"
 LKT.Neutral_conservatism: "£generic_Neutral_conservatism_small 拉科塔传统与团结党"
 LKT.Neutral_conservatism_icon: "£generic_Neutral_conservatism_small"
 LKT.Neutral_conservatism_desc: "£generic_Neutral_conservatism_small 拉科塔传统与团结党 - (LTSP) LTSP是一个总体保守的政党，旨在将本土孤立主义融合为更优的国家政策。着眼于依靠自身土地解决自身问题，LTSP希望通过统一目标团结起适度多元的土地与人民，即维护所有珍视家庭、自由与自我表达且不滋扰公众者的现状。"
 LKT.oligarchism: "£generic_oligarchism_small 拉科塔技术统治党"
 LKT.oligarchism_icon: "£generic_oligarchism_small"
 LKT.oligarchism_desc: "£generic_oligarchism_small 拉科塔技术统治党 - (LTP) 简称技术党,是对传统技术官僚意识形态的一次有趣演绎。该党深知其广袤领土主要用于农业生产，因此着眼于利用这一特点推动独特的燃料效率研究、替代燃料创新，并将少量适宜工业化的土地作为核心，致力于提升这些区域内的效率与生产力。"
 LKT.Neutral_Libertarian: "£USA_Neutral_Libertarian_small 自由之地党"
 LKT.Neutral_Libertarian_icon: "£USA_Neutral_Libertarian_small"
 LKT.Neutral_Libertarian_desc: "£USA_Neutral_Libertarian_small 自由之地党 - (FoLP) 自由之地党是昔日自由党的一个幸存分支。如今，该党致力于应对工业化与维持农业和平之间的有趣分歧，在经济前进道路上存在内部分裂。因此，其大部分政纲倾向于关注社会意识，并防止任何形式的政府膨胀。"
 LKT.Neutral_green: "£USA_green_party 国家保护党"
 LKT.Neutral_green_icon: "£USA_green_party"
 LKT.Neutral_green_desc: "£USA_green_party 国家保护党 - (PNP) 有些人喜欢将PNP称为保护党，这是一个从旧绿党转型存续下来的政党。虽然其他地区可能未受到旧绿党的重大影响，但由于存在大量被动保护的土地，拉科塔共和国与该党形成了强烈的推拉关系。许多党外人士认为PNP将成为国家任何有意义的工业化进程的最大障碍，但党员试图将此类担忧斥为对党的极端看法。"
 LKT.neutral_Social: "£USA_socialist_party_of_america 玫瑰丛党"
 LKT.neutral_Social_icon: "£USA_socialist_party_of_america"
 LKT.neutral_Social_desc: "£USA_socialist_party_of_america 玫瑰丛党 - (RBP) 玫瑰丛党是一个理念相当朴素的政党。例如，该党致力于推动工人和农民在比例税制方面的平等。多数人将其视为民主社会主义的一种独特农业化形态，但该党自认为更偏向于进步主义的蓝领政党。"
 LKT.Neutral_Communism: "£generic_Neutral_Communism_small 玫瑰革命协会"
 LKT.Neutral_Communism_icon: "£generic_Neutral_Communism_small"
 LKT.Neutral_Communism_desc: "£generic_Neutral_Communism_small 玫瑰革命协会 - (RRA)“协会”是一个革命马克思主义政党，其理念更接近俄国布尔什维克或德国斯巴达克同盟等马克思主义政党的起源。该党认为，任何形式的革命都是实现真正持久变革、改善无产阶级生活的唯一途径。"
 LKT.Nat_Populism: "£generic_Nat_Populism_small 农作物喷洒者协会"
 LKT.Nat_Populism_icon: "£generic_Nat_Populism_small"
 LKT.Nat_Populism_desc: "£generic_Nat_Populism_small 农作物喷洒者协会 - (CDS) 农作物喷洒者协会，是一个奉行民族主义和孤立主义的政党。该党主张通过地域民族主义而非种族民族主义来统一领土，因此被视为一个独特的“右翼”政党。许多人认为这种说法是错误的，但该党否认这些指控，理由是其人口基数本来就很小。"
 LKT.Nat_Fascism: "£generic_Nat_Fascism_small 金田联盟"
 LKT.Nat_Fascism_icon: "£generic_Nat_Fascism_small"
 LKT.Nat_Fascism_desc: "£generic_Nat_Fascism_small 金田联盟 - (LGF)人们通常称其为“联盟”，它是更广泛的右翼运动中更具民族色彩的一派。他们认为，无论人口规模多大，如果一个国家无法保持霸权稳定，那么它注定会在多元文化带来的内部压力下走向失败。尽管原住民人口占比不到5%，但他们在堪萨斯州、达科他州和蒙大拿州拥有强大的势力，因此，如果“联盟”继续坚持这种残酷的现实，这些地区的广袤平原和山脉未来可能会成为一个真正的问题。"
 LKT.Nat_Autocracy: "£generic_Nat_Autocracy_small 拉克塔武装力量"
 LKT.Nat_Autocracy_icon: "£generic_Nat_Autocracy_small"
 LKT.Nat_Autocracy_desc: "£generic_Nat_Autocracy_small 拉克塔武装力量 - (AFL)拉克塔武装力量是一支以陆军为主的军队。由于共和国的地理位置，除了内河作战外，海军几乎没有军费开支。陆军获得了大部分军费，空军则位居第二，预算相对较少。许多人质疑，在没有强大空军的情况下，陆军究竟能发挥多大作用？但如果没有海军的牵绊，或许陆军的这些额外投入最终会带来一些积极的影响。"
 LKT.Monarchist: "£USA_american_heritage_party 黄石王室"
 LKT.Monarchist_icon: "£USA_american_heritage_party"
 LKT.Monarchist_desc: "£USA_american_heritage_party 黄石王室 - (HoY) 黄石王室又称黄石协会。这是一个旨在建立一个由选举产生的君主制国家的统一运动，并围绕黄石这一最显著的地理特征，赋予其新的象征、习俗和身份认同，以此来定义这个国家。尽管有人担心这是建立某种专制氏族的阴谋，但更多的人则认为这是让这片土地上的人民团结起来，共同前进，而不是让生活在这片土地上的不同群体之间陷入纷争的局面。"
 DPR.Nat_Populism_desc: "(欧亚主义) - 新俄罗斯党是乌克兰的一个分离主义政治组织，主张乌克兰东部（新俄罗斯）脱离俄罗斯联邦并入俄罗斯联邦。该党的主要意识形态驱动力是亲俄立场，但与许多俄罗斯民族主义运动一样，它也具有高度融合性，受到欧亚主义、苏联主义和现代俄罗斯民族主义运动的影响 - 该党宣称支持民主，但并未明确表明其左倾或右倾立场。"
 CRM.Conservative_desc: ""
 TOG.Nat_Autocracy_desc: "（民族主义军政府） - 该军方成立于1960年多哥独立之时，并迅速活跃于政坛。1967年，他们发动政变，扶持格纳辛贝·埃亚德马上台；随后，他们又威胁发动政变，迫使政府向其领导的人民党做出让步。由于人民党及其后继政党在多哥政府中占据重要地位，军方在国家政治和事务中一直保持着举足轻重的地位 - 即使在官方宣布结束一党制统治之后，他们名义上仍然支持继续维持独裁统治。"
 CAM.liberalism: "£generic_liberalism_small (CDU)  - 喀麦隆民主联盟"
 CAM.liberalism_desc: "（改良主义） - 成立于1991年的喀麦隆民主联盟迅速崛起，成为仅次于喀麦隆人民民主运动的第二大反对党。该党与社会民主阵线联手，试图对抗喀麦隆人民民主运动在政坛的持续主导地位，但反对派内部的纷争和派系斗争限制了其成效。在政策方面，该党的主要目标是消除腐败、推动民主改革 - 其创始人曾在艾哈迈杜·阿希乔政府中担任较为温和的职务。"
 CAM.socialism: "£generic_socialism_small (SDF)  - 社会民主阵线"
 CAM.socialism_desc: "（右翼社会民主主义） - 社会民主阵线成立于1990年，当时反对党的禁令名义上已经解除。它是该国的主要反对党，一直反对执政党喀麦隆人民民主运动，并反对其所认为的持续存在的事实上的单一政党统治。叙利亚民主力量的意识形态核心是民主改革，该党也持有进步主义和社会民主主义的观点。"
 CAM.Autocracy: "£generic_Autocracy_small (UNDP) - 民主与进步全国联盟"
 CAM.Autocracy_desc: "（务实专制主义） - 成立于1990年的民主与进步全国联盟最初是由流亡人士组成的反对党，但很快便转向支持执政党喀麦隆人民民主运动。民主与进步全国联盟声称继承了艾哈迈杜·阿希乔的遗志，其纲领和立场与这位前总统领导的喀麦隆人民民主运动高度一致。尽管在选举中屡屡失利，但凭借其对喀麦隆人民民主联盟的忠诚，该党在政府中占据了重要职位，并在自成立以来的多次选举中都保持了相当数量的席位。"
 CAM.Caliphate: "£generic_Caliphate_small (ISWAP) - 伊斯兰国 - 西非省"
 CAM.Caliphate_desc: "（萨拉菲圣战主义）- 伊斯兰国西非省是由博科圣地分裂出来的一个组织，声称其目标和利益与更大的“伊斯兰国”运动保持一致。该组织控制着“西非省”，其主要活动区域集中在尼日利亚和喀麦隆。该组织奉行泛伊斯兰主义、极右翼圣战主义意识形态，深受瓦哈比主义、萨拉菲主义以及伊斯兰教内部其他极端宗教运动的影响。该组织视在尼日利亚境内活动的博科圣地为竞争对手，双方之间不仅发生暴力冲突，该地区还出现了针对多个政府的暴力活动。"
 CAM.Nat_Autocracy: "£generic_Nat_Autocracy_small (FAC)  - 喀麦隆武装力量"
 CAM.Nat_Autocracy_desc: "（务实军政府） - 喀麦隆武装部队成立于1960年，一直以来都对执政政府保持着相对的忠诚。1984年的一次政变未能推翻喀麦隆人民民主运动的政权，反而促使更多效忠于比亚的势力进入军队，进一步巩固了比亚的统治。喀麦隆武装部队参与的大部分冲突都发生在喀麦隆境内，主要针对叛乱分子或国内异议人士。尽管如此，喀麦隆与邻国尼日利亚之间因领土争端而产生的冲突仍在持续，此外，中非共和国内战和尼日利亚国内的叛乱等其他一些邻国冲突也牵涉到喀麦隆的介入。"
 CHL.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small 拉丁美洲的真主党 - 智利"
 ARG.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small (Hezbollah) - 拉丁美洲的真主党"
 ARG.Vilayat_e_Faqih_desc: "（什叶派伊斯兰主义）- 拉丁美洲的真主党\n\n真主党在拉丁美洲是一个由资助者、协助者和同情者组成的网络，黎巴嫩什叶派运动正是通过这个网络在阿根廷、巴西和巴拉圭三国交界地区以及拉丁美洲的黎巴嫩侨民中开展活动的。它在阿根廷没有政治纲领；其目的是通过贸易和走私筹集资金，进行洗钱，并为来自贝鲁特和德黑兰的行动提供掩护。\n\n阿根廷曾直接感受到这些行动的影响。1992年3月布宜诺斯艾利斯以色列大使馆爆炸案和1994年7月18日造成85人死亡的阿根廷犹太人互助协会犹太社区中心爆炸案，均被阿根廷检察官认定为真主党受伊朗指使所为。此后，该案一直贯穿阿根廷政坛，从国际刑警组织的通缉令到2013年与伊朗签署的备忘录，再到2015年1月检察官阿尔贝托·尼斯曼的去世，都与此案息息相关。2019年7月17日，毛里西奥·马克里政府将真主党列为恐怖组织，成为拉丁美洲首个做出此举的国家。"
 BOL.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small (Hezbollah) - 拉丁美洲的真主党"
 BRA.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small (HLA) - 拉丁美洲的真主党"
 BRA.Vilayat_e_Faqih_desc: "（什叶派伊斯兰主义）- 拉丁美洲的真主党\n\n拉丁美洲的真主党并非一个政党，而是一个与黎巴嫩真主党有关联的秘密网络，其成员包括金融家、走私者和同情者，根植于巴西、巴拉圭和阿根廷三国交界地区的黎巴嫩侨民。该网络通过走私、洗钱和非正式汇款筹集资金，并将其输送至中东地区的真主党活动。\n\n它既不拥有席位，也不寻求席位。它的政治影响力在于它从地方官员那里收买的庇护，在于它赋予伊朗在美洲的影响力，以及在于它定期进行的逮捕和所谓的阴谋活动，这些活动吸引了外国情报机构的注意，并使伊朗与以色列和美国的关系紧张。"
 LKT.anarchist_communism_alt: "£generic_anarchist_communism_small (AIM) 美国印第安人运动"
 LKT.anarchist_communism_alt_desc: "（原住民主义） - 美国印第安人运动于1968年在其他社会运动的背景下成立，旨在为全美各地的原住民社区争取更多权利、自治权和法律认可。在其活动鼎盛时期，该组织隶属于彩虹联盟 - 一个由左翼民权组织组成的联盟，该联盟拥有建立一个更加多元化美国的共同愿景。虽然该组织代表着全体美国原住民，甚至与海外原住民团体合作，但其最主要的成员集中在中西部地区。在意识形态上，该组织主要与左翼立场一致，奉行进步的多元民族主义纲领 - 尽管其内部也存在持有不同理念的派别。"
 LKT.Neutral_Communism_alt: "£generic_Neutral_Communism_small (AIM) 美国印第安人运动（新左派）"
 LKT.Neutral_Communism_alt_desc: "（西方新左派） - 美国印第安人运动于1968年在其他社会运动的背景下成立，旨在为全美各地的原住民社区争取更多权利、自治权和法律认可。在其活动鼎盛时期，该组织隶属于彩虹联盟 - 一个由左翼民权组织组成的联盟，该联盟拥有建立一个更加多元化美国的共同愿景。虽然该组织代表着全体美国原住民，甚至与海外原住民团体合作，但其最主要的成员集中在中西部地区。在意识形态上，该组织主要与左翼立场一致，奉行进步的多元民族主义纲领 - 尽管其内部也存在持有不同理念的派别。"
 PAR.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small 拉丁美洲的真主党 - 巴拉圭"
 PRU.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small 秘鲁真主党分支"
 PRU.Vilayat_e_Faqih_desc: "（融合霍梅尼主义） - 与真主党在拉丁美洲的其他分支组织一样，秘鲁真主党分支规模较小，其主要目的是拓展伊朗的利益。在秘鲁，该组织奉行高度融合的意识形态，而非强硬立场，与种族灭绝运动、光辉道路以及其他反政府组织结盟。"
 DRU.Nat_Autocracy: "£generic_Nat_Autocracy_small 国民警卫队"
 DRU.Nat_Autocracy_desc: "（宗派军政府） - 叙利亚国民警卫队主要以苏韦达为中心，由叙利亚德鲁兹社区内几个规模较小、各自为政的准军事组织合并而成。它的成立源于对一个能够保卫德鲁兹社区并打击敌对准军事组织的统一、凝聚力强的组织的需要。国民警卫队由支持和反对阿萨德的民兵组成，他们为了共同的组织架构和目标而走到了一起。"
 QUE.conservatism: "£generic_conservatism_small (ADQ) - 魁北克民主行动"
 QUE.conservatism_desc: "（新自由主义）- 由魁北克自由党内部持不同意见者组建的魁北克民主联盟成立于1994年，旨在参加当年的选举。尽管初期表现良好，但此后支持率迅速下滑，落后于魁北克自由党和魁北克人党。该党在意识形态上支持魁北克民族主义，社会立场较为保守，但其纲领总体上属于新自由主义，倡导自由市场经济，且立场比其他魁北克右翼政党更为温和。"
 QUE.conservatism_1: "£generic_conservatism_small (CAQ)  - 魁北克未来联盟党（保守派）"
 QUE.conservatism_desc_1: "（民族保守主义）- 魁北克未来联盟党由魁北克人党和魁北克自由党的前成员于2011年组建，其纲领以民粹主义和民族主义为主。该党反对魁北克独立，但支持该地区更大的地方自治权，并进一步与左翼和右翼保持距离 - 尽管其政策和纲领本质上仍属于右翼保守主义。魁北克未来联盟党的出现排挤了其他右翼政党，并在选举中取得了成功。"
 QUE.liberalism: "£generic_liberalism_small (QLP)  - 魁北克自由党"
 QUE.liberalism_desc: "（中间派自由主义）- 魁北克自由党成立于1867年，其前身是法语加拿大党，该党后来与加拿大自由党结盟，直至1955年。历史上，该党内部曾出现过一些秉持社会自由主义甚至社会民主主义理念的派系，但总体而言，该党立场较为温和，但仍保留着以自由主义为核心的纲领。与其他魁北克政党不同，魁北克自由党支持魁北克继续留在加拿大，并享有地方自治权。"
 QUE.socialism: "£generic_socialism_small (PQ)  - 魁北克人党"
 QUE.socialism_desc: "（左翼主权主义）- 魁北克人党成立于1968年，由两个较小的分离主义团体 - 主权协会运动和国家联盟合并而成，旨在建立一个更强大的运动，推动魁北克自治乃至独立。该党主张魁北克完全独立，并将其作为其政纲的首要内容 - 其政治立场略偏左，融合了社会民主主义和社会自由主义的元素。"
 QUE.Neutral_green: "£generic_Neutral_green_small (GPQ)  - 魁北克绿党"
 QUE.Neutral_green_desc: "（环保主义） - 魁北克绿党的政治立场偏左，主张魁北克省实行联邦制，并由更加环保和进步的政府领导。历史上，该党内部曾出现分裂和冲突，甚至一度解散，魁北克省仅保留了加拿大绿党的联邦分支机构，直到后来才得以重建。"
 QUE.neutral_Social: "£generic_neutral_Social_small (PDS)  - 社会民主党"
 QUE.neutral_Social_desc: "（左翼社会民主主义） - 该党最初隶属于合作社联邦，后又加入新民主党，但在上世纪90年代，由于一系列分歧，以及该党提名一位前极左翼魁北克解放阵线成员担任党魁，最终正式脱离合作社联邦。该党在意识形态上坚定地站在左翼立场，奉行更为传统的社会民主主义纲领，并支持魁北克独立。"
 QUE.neutral_Social_1: "£generic_neutral_Social_small (UFP)  - 进步力量联盟"
 QUE.neutral_Social_desc_1: "（左翼民族主义）- 进步力量联盟成立于2002年，由几个较小的进步派和左翼政党合并而成，主张魁北克脱离加拿大独立。其成员包括魁北克共产党和魁北克社会主义民主党等前成员，他们团结在一个坚定的左翼纲领之下。"
 QUE.neutral_Social_2: "£generic_neutral_Social_small (QS)  - 魁北克团结党"
 QUE.neutral_Social_desc_2: "（民主社会主义）-魁北克团结党于2006年由多个较小的进步派和左翼政党合并而成，迅速成为魁北克主流政治中最左翼的政党。其意识形态融合了进步主义、多元民族主义、生态社会主义和反全球化观点，主张建立一个独立民主的魁北克国家。"
 QUE.Nat_Populism: "£generic_Nat_Populism_small (ADQ) - 魁北克民主行动（民粹主义派）"
 QUE.Nat_Populism_desc: "（保守民粹主义）- 由魁北克自由党内部持不同意见者组建的魁北克民主联盟成立于1994年，旨在参加当年的选举。尽管初期表现良好，但此后支持率迅速下滑，落后于魁北克自由党和魁北克人党。该党在意识形态上支持魁北克民族主义，社会立场较为保守，但其纲领总体上属于新自由主义，倡导自由市场经济，且立场比其他魁北克右翼政党更为温和。"
 QUE.Nat_Populism_1: "£generic_Nat_Populism_small  (CAQ)  - 魁北克未来联盟党"
 QUE.Nat_Populism_desc_1: "（民族民粹主义）- 魁北克未来联盟党由魁北克人党和魁北克自由党的前成员于2011年组建，其纲领以民粹主义和民族主义为主。该党反对魁北克独立，但支持该地区更大的地方自治权，并进一步与左翼和右翼保持距离 - 尽管其政策和纲领本质上仍属于右翼保守主义。魁北克未来联盟党的出现排挤了其他右翼政党，并在选举中取得了成功。"
 SOO.Caliphate: "£generic_Caliphate_small (IS-CP) 伊斯兰国 - 高加索省"
 ABK.Caliphate: "£generic_Caliphate_small (IS-CP) 伊斯兰国 - 高加索省"
 ARM.Caliphate: "£generic_Caliphate_small (IS-CP) 伊斯兰国 - 高加索省"
 AZE.Nat_Fascism: "£generic_Nat_Fascism_small (AMDP) - 阿塞拜疆民族民主党"
 AZE.Nat_Fascism_desc: "（泛突厥主义）- 阿塞拜疆民族民主党\n\n阿塞拜疆民族民主党成立于1993年，最初名为“灰狼党”，由人民阵线政府内政部长伊斯肯德尔·哈米多夫创立。哈米多夫将内政部运作成泛突厥主义民兵组织，并因在其办公室殴打记者而臭名昭著。1995年，在阿塞拜疆人民阵线叛乱之后，最高法院撤销了该党的注册，此后该党更名为现名。该党宣扬在土耳其领导下实现突厥世界的统一，奉行激进的阿塞拜疆民族主义，主张武力收复卡拉巴赫，并对俄罗斯、伊朗和亚美尼亚抱有敌意。\n\n在接下来的十年里，哈米多夫大部分时间都被关押在监狱中，该党早已不复当年准军事力量的辉煌，仅靠其副手们打着“灰狼永生”、“祖国不可分割”的旗号勉强维持着苟延残喘。该党汲取了卡拉巴赫战争老兵中根深蒂固的土耳其民族主义传统，但政权却将这场战争和民族主义据为己有。"
 AZE.Western_Autocracy: "£generic_Western_Autocracy_small (ADP) - 阿塞拜疆民主党"
 AZE.Western_Autocracy_desc: "（民粹主义）- 阿塞拜疆民主党\n\n阿塞拜疆民主党于1991年在纳希切万成立，是前巴库炼油厂厂长、议长拉苏尔·古利耶夫的政治工具。古利耶夫于1996年与盖达尔·阿利耶夫决裂，流亡美国。该党要求阿利耶夫家族下台，将石油财富归还人民，建立市场经济，并与西方结盟。该党认为，只有来自统治家族之外的强权才能推翻阿利耶夫政权。\n\n由于其主席身在国外，总书记萨达尔·贾拉洛格鲁时常进出监狱，该党是反对派力量中最具个人色彩的，维系其团结的纽带是古利耶夫的资金、他在美国的人脉以及他回国的承诺。当反对派团结一致时，该党会与人民阵线和穆萨瓦特党组成自由阵线；而当反对派分裂时，该党则会分崩离析。一个围绕流亡者建立的政党，在国内几乎无能为力。"
 AZE.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small (HÜSEYNÇİLƏR) - 阿塞拜疆伊斯兰抵抗运动"
 AZE.Vilayat_e_Faqih_desc: "（霍梅尼主义） - 阿塞拜疆伊斯兰抵抗运动\n\n阿塞拜疆伊斯兰抵抗运动，又称侯赛因运动，是由陶希德·易卜拉欣·贝格利和库姆、马什哈德的阿塞拜疆神学院学生发起的运动。他们前往叙利亚，在革命卫队的指挥下作战，并怀着在里海地区建立抵抗轴心的雄心壮志返回。该运动宣扬法学家的守护，主张进行伊斯兰革命，反对阿利耶夫政府和以色列在阿塞拜疆的存在，并以侯赛因的殉难命名。\n\n该组织总部设在伊朗，并受伊朗指挥，拥有少量训练有素的武装人员、一套阿塞拜疆语宣传机构，并在纳尔达兰和南部地区的什叶派青年中拥有一定数量的追随者，其返回者挤满了巴库的监狱。它的庇护者是它的力量所在，而这个庇护者恰恰是大多数阿塞拜疆人最不信任的外国势力。"
 AZE.Caliphate: "£generic_Caliphate_small (IS-CP) - 伊斯兰国 - 高加索省"
 AZE.Caliphate_desc: "（萨拉菲圣战主义）- 伊斯兰国 - 高加索省\n\n高加索省是伊斯兰国的一个分支，于2015年成立。当时，达吉斯坦、车臣和西北高加索地区的高加索酋长国指挥官从基地组织转而效忠于哈里发国。该组织奉行哈里发国的纲领，即建立一个实行伊斯兰教法的单一伊斯兰国家，向俄罗斯和什叶派宣战，并将参与世俗政治的穆斯林定为异教徒。该组织像在达吉斯坦一样，在阿塞拜疆北部地区的萨拉菲派社区招募成员。\n\n该组织在阿塞拜疆境内没有组织架构，只有一些小组、同情者以及从叙利亚和伊拉克返回的人员，安全部门在库萨尔和扎卡塔拉的逊尼派村庄搜捕这些人。这种意识形态传播时没有组织，但俄罗斯和阿塞拜疆的安全部门在其出现的地方都将其摧毁。"
 AZE.Caliphate_1: "£generic_Caliphate_small (IS-AP) - 伊斯兰国 - 阿塞拜疆省"
 JOR.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small 约旦伊斯兰抵抗运动"
 JOR.Vilayat_e_Faqih_desc: "（霍梅尼主义） - 约旦伊斯兰抵抗组织是一个以扩大伊朗在该地区的影响力并向以色列施压为明确目标的武装团体。该​​组织的意识形态与伊朗伊斯兰革命卫队直接相关，与伊朗国内更为激进的势力密切相关，支持建立一个基于霍梅尼主义思想的伊斯兰共和国。"
 NIG.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small 尼日利亚伊斯兰运动"
 NIG.Vilayat_e_Faqih_desc: "（霍梅尼主义） - 尼日利亚伊斯兰运动成立于20世纪70年代伊朗革命之后，该组织既不承认尼日利亚政府的权威，也不承认在该国北部活动的逊尼派伊斯兰团体的合法性。相反，它奉行基比主义和霍梅尼主义的混合体，旨在建立一个什叶派伊斯兰共和国。该组织的意识形态深受伊朗革命的影响，伊朗通过该组织在尼日利亚拥有一定程度的影响力。"
 PAK.Mod_Vilayat_e_Faqih: "£generic_Mod_Vilayat_e_Faqih_small 巴基斯坦穆罕默德军"
 PAK.Mod_Vilayat_e_Faqih_desc: "（什叶派伊斯兰主义）- 巴基斯坦穆罕默德军最初成立于1994年，是一个以保护什叶派社区免受教派袭击为宗旨的民兵组织。该组织一直积极打击反什叶派极端主义团体的成员，尽管该组织本身因其使用暴力以及与什叶派伊斯兰教更激进的元素存在意识形态联系而被认定为恐怖组织。"
 PAK.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small (TJP) 贾法里亚运动"
 PAK.Vilayat_e_Faqih_desc: "（霍梅尼主义） - 成立于1979年的贾法里亚运动是一个旨在促进巴基斯坦什叶派社群利益的组织。尽管其成立源于伊朗革命对伊斯兰世界的影响，但该组织内部在对伊朗的立场上存在分歧 - 内部冲突和斗争最终导致两大派系的形成，其中较为强势的派系采取了亲霍梅尼主义的立场。该组织的目标是代表巴基斯坦什叶派民众发声，而非建立一个什叶派伊斯兰共和国 - 尽管该组织本身公开宣扬伊斯兰主义。"
 TUR.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small 圣城军"
 TUR.Vilayat_e_Faqih_desc: "（霍梅尼主义） - 圣城军是一个据称存在于土耳其境内的组织，其运作原则深受伊朗革命的影响，旨在影响土耳其对伊朗的政治立场。该组织被指控与伊朗伊斯兰革命卫队有关联，但尽管进行了多次调查，关于该组织的真相却鲜为人知。"
 HAZ.Mod_Vilayat_e_Faqih: "£AFG_moderate_shiites 阿富汗伊斯兰统一党"
 HAZ.Vilayat_e_Faqih: "£AFG_hardline_shiites 阿富汗伊斯兰运动"
 HAZ.Neutral_Autocracy: "£AFG_moderate_shiites 阿富汗伊斯兰统一党（左翼）"
 HAZ.Neutral_Autocracy_desc: "（伊斯兰民主主义） - 该党成立于1989年，由几个小党合并而成，旨在反对苏联逐渐衰落的占领。它源于“德黑兰八党” - 一个由与什叶派伊斯兰教有着相似联系并得到伊朗支持的政党组成的联盟 - 力图建立一个联盟，以影响阿富汗政治并维护阿富汗境内什叶派少数群体的利益。自成立以来，该党也逐渐成为阿富汗主要民族哈扎拉族的代表。该党的“左翼”成员是阿富汗国内的左翼人士，他们因担心遭到新成立的伊斯兰政府的迫害而加入该党。尽管他们在党内的权力有限，难以担任要职，但他们的存在促使伊斯兰团结党内部出现了一个更为温和的派别。"
 HAZ.Nat_Autocracy: "£generic_Nat_Autocracy_small 哈扎拉防御部队"
 HAZ.Nat_Autocracy_desc: "（伊斯兰军政府） - 伊朗介入阿富汗内战后，由伊朗伊斯兰革命卫队支持的什叶派激进分子建立了一个以阿富汗哈扎拉族聚居区为中心的独立国家。哈扎拉国防军严重依赖伊朗，实际上充当着这个新国家的军事力量，并与亲伊朗的执政势力有着广泛的联系。"
 ALG.Western_Autocracy: "£ALG_Western_Autocracy_small (PRA) - 阿尔及利亚复兴党"
 ALG.Western_Autocracy_icon: "£ALG_Western_Autocracy_small"
 ALG.Western_Autocracy_desc: "（自由主义） - 阿尔及利亚复兴党\n\n阿尔及利亚复兴党是一个小型自由主义政党，由散文家努尔丁·布克鲁于1989年8月3日创立。该党认为，阿尔及利亚的问题在于其资源型国家体制和封闭的政治阶级，而解决之道在于经济自由化、私营企业以及与现代性相适应的伊斯兰教思想革新。该党拒绝接受民族解放阵线的社会主义遗产和伊斯兰主义方案，认为二者都是同一种威权主义诱惑。\n\n实际上，该党更注重理念而非选民。布克鲁在1995年总统选举中得票率不足4%，2002年和2017年各获得一个议席，2007年获得四个议席。该党的优势在于，它在从未给予自由主义政治回报的政治文化中，坚持不懈地进行批判。"
 ALG.conservatism_icon: "£ALG_conservatism_small"
 ALG.liberalism_icon: "£ALG_liberalism_small"
 ALG.socialism_icon: "£ALG_socialist_small"
 ALG.socialism_2012_icon: "£ALG_socialist_2012_small"
 ALG.Conservative_icon: "£ALG_Conservative_small"
 ALG.Caliphate_icon: "£ALG_Caliphate_small"
 ALG_FIS.Caliphate: "£ALG_FIS_Caliphate_small  (FIS)  - 伊斯兰救世阵线"
 ALG_FIS.Caliphate_icon: "£ALG_FIS_Caliphate_small"
 ALG_FIS.Caliphate_desc: "（伊斯兰主义） - 伊斯兰救世阵线\n\n伊斯兰救世阵线是一个群众性伊斯兰主义政党，由阿巴西·马达尼和阿里·贝勒哈吉于1989年2月18日创立，正值1988年10月骚乱之后。该党声称阿尔及利亚的独立被法语区的社会主义精英窃取，只有实行伊斯兰教法的国家才能恢复国家的民族认同。该党依靠清真寺、慈善机构和城市贫民建立势力，其两位领导人所代表的运动涵盖了从选举伊斯兰主义到公开号召圣战的各种形式。\n\n实际上，该党以54%的得票率赢得了1990年6月的地方选举，并在1991年12月的第一轮立法选举中以231个确定席位中的188个席位获胜，此时军队取消了投票，并于1992年3月4日解散了该党，并引发了内战。该党的武装派别于1997年宣布停火，其领导人于2003年被释放，但该党仍然被禁止，其回归将意味着该政权接受其在1992年推翻的判决。"
 ALG.Caliphate_2006_icon: "£generic_Caliphate_small"
 ALG.Caliphate_2006_desc: "（萨拉菲圣战主义） - 伊斯兰马格里布基地组织\n\n“伊斯兰马格里布基地组织”是萨拉菲宣教与战斗组织于2007年1月24日宣誓效忠奥萨马·本·拉登后使用的名称，它将阿尔及利亚的叛乱活动发展成为全球圣战的区域分支。该组织主张推翻马格里布各国政府，驱逐法国和西方的影响，并在北非和萨赫勒地区恢复伊斯兰统治，并将阿尔及利亚政权视为叛教者而非仅仅是腐败者。\n\n实际上，该组织在阿尔及利亚的核心力量在2007年4月阿尔及尔爆炸案后遭到削弱，其重心转移到撒哈拉沙漠。在那里，绑架勒索、走私以及与图阿雷格人和马里武装组织的结盟使其变得富有而危险。阿卜杜勒马利克·德鲁克德尔领导该组织直至2020年6月在马里被法国军队击毙。如今，在阿布·乌拜达·优素福·安纳比的领导下，该组织的筹码不再是阿尔及利亚本身，而是萨赫勒战争。"
 ALG.Neutral_Autocracy_icon: "£ALG_Neutral_Autocracy_small"
 ALG.Neutral_conservatism_icon: "£ALG_Neutral_conservatism_small"
 ALG.neutral_Social_icon: "£ALG_neutral_Social_small"
 ALG.Neutral_Communism_icon: "£ALG_Neutral_Communism_small"
 ALG.Nat_Populism_2011: "£ALG_Nat_Populism_2011_small (FJD) - 正义与发展阵线"
 ALG.Nat_Populism_2011_desc: "（伊斯兰保守主义） - 正义与发展阵线\n\n正义与发展阵线是阿卜杜拉·贾巴拉的第三个政党，于2011年7月阿拉伯之春重新开启阿尔及利亚政坛之际宣布成立，并于2012年2月10日在其成立大会上正式成立。该党自诩为效仿土耳其正义与发展党的伊斯兰主义政党，主张以伊斯兰教法为基础的法律、社会保守主义和廉洁政府，并拒绝穆斯林兄弟会与政权勾结的惯例。\n\n实际上，该党继承的是贾巴拉的忠实拥护者，而非群众基础。该党在2012年赢得7个席位，2017年与复兴运动党联合赢得15个席位，但在2021年跌至2个席位。该党的优势在于其创始人作​​为该政权从未收买的唯一一位伊斯兰主义领导人的声誉，而其弱点在于该党从未超越过他。"
 ALG.Nat_Populism_2011_icon: "£ALG_Nat_Populism_2011_small"
 ALG.Nat_Populism_icon: "£ALG_Nat_Populism_small"
 ALG.Nat_Populism_alt: "£ALG_Nat_Populism_alt_small (AMF) - 塔马兹加运动"
 ALG.Nat_Populism_alt_desc: "（阿马齐格民族主义）- 塔马兹加运动\n\n作为执政派别的塔马兹加运动代表着阿马齐格人的复兴之路，该运动认为阿尔及利亚的真正身份是柏柏尔人而非阿拉伯人，国家应该围绕塔马兹加（北非从加那利群岛到锡瓦的故土）的语言、符号和历史记忆重建。它将文化民族主义与保守的社会秩序相结合，并奉行对外政策，寻求与摩洛哥、突尼斯、利比亚和萨赫勒地区的阿马齐格运动建立共同目标。\n\n实际上，只有民族主义政府通过复兴而不是镇压来回答重新提出的卡比尔问题时，它才存在。它的优势是动员起来的卡比利亚人和侨民，它的弱点是阿拉伯多数派，他们将塔马兹加视为另一个名字的分裂。"
 ALG.Nat_Populism_alt_icon: "£ALG_Nat_Populism_alt_small"
 ALG.Nat_Fascism_icon: "£ALG_Nat_Fascism_small"
 ALG.Monarchist: "£ALG_Monarchist_small (KoA) - 阿尔及利亚王国"
 ALG.Monarchist_icon: "£ALG_Monarchist_small"
 ALG.Monarchist_desc: "（伊斯兰君主主义） - 阿尔及利亚王国\n\n阿尔及利亚王国作为执政派别，代表着一种复辟主义方案，旨在用一个自称源自法国征服前统治马格里布的埃米尔和王朝的王室取代1962年建立的共和国。该王室的血统可能来自复兴的柏柏尔家族、阿拔斯王朝，或是在阿尔及尔建立的新哈里发头衔。其信条认为共和国已经失败，只有受神授权的君主才能凌驾于军队、政党和氏族之上，信仰、秩序和传统应当在意识形态无法维系国家团结之处发挥作用。\n\n实际上，它既没有政党，也没有获得公认继承权的候选人，在自独立以来一直奉行共和制的阿尔及利亚政治传统中也找不到立足之地。它的力量将来自于民众对民族解放阵线政权的失望以及对伊斯兰教合法性的认同；而它的弱点则来自于军队和社会从未接受过君主制。"
 ALG.Nat_Autocracy_icon: "£ALG_Nat_Autocracy_small"
 ALG.Neutral_green: "£ALG_Neutral_green_small (MNND) - 全国自然与发展运动"
 ALG.Neutral_green_icon: "£ALG_Neutral_green_small"
 ALG.Neutral_green_desc: "(环保主义) - 全国自然与发展运动\n\n阿尔及利亚国家自然与发展运动是该国的绿色政党，认为阿尔及利亚对石油和天然气的依赖、水资源危机以及海岸和草原的退化，都要求该国建立在环境保护而非资源开采基础上的发展模式。该党将生态纲领与大致中间派、支持发展的立场相结合，从而避免了世俗阵营和伊斯兰阵营之间的对抗。\n\n实际上，该党的转机出现在2007年5月的立法选举中，当时它凭借政权允许分裂反对派的小党浪潮，以2%的得票率赢得了七个席位。此后，该党再未取得过类似的成功，其影响力也仅限于将环境问题边缘化，使其无法在以碳氢化合物为主导的议程中占据主导地位。"
 ALG.Neutral_Libertarian: "£ALG_neutral_libertarian_small (RCD) - 文化与民主集会"
 ALG.Neutral_Libertarian_icon: "£ALG_neutral_libertarian_small"
 ALG.Neutral_Libertarian_desc: "（世俗只有主义）- 文化与民主集会\n\n文化与民主集会是阿尔及利亚的世俗自由主义政党，由赛义德·萨迪于1989年2月9日创立，是从社会主义力量阵线分裂出来的。该党将世俗主义、柏柏尔文化权利和自由民主置于原社会主义阵线的社会主义之上。它主张建立一个政教分离的国家，赋予柏柏尔语官方地位，建立摆脱资源型国家的市场经济，并奉行亲西方的外交政策。在20世纪90年代，该党公开支持军队对抗伊斯兰主义者。\n\n其优势在于卡比利亚地区和受过良好教育的城市中产阶级，这使其在1997年和2007年两次赢得19个议席，并短暂进入政府，直到2001年5月1日因“黑春”运动中的屠杀事件而撤回其部长职位。其弱点同样在于其狭窄的选民基础以及长期抵制运动的记录，例如在2002年和2021年“人民运动”之后，萨迪的继任者莫赫辛·贝拉巴斯和阿特曼·马祖兹领导下，该党再次遭到抵制。"
 KBY.socialism: "£KBY_socialism_small 卡比利亚自决运动"
 KBY.socialism_icon: "£KBY_socialism_small"
 KBY.socialism_desc: "（民主社会主义）- 卡比利亚自决运动\n\n由费尔哈特·梅赫尼于2001年创立的卡比利亚运动倡导卡比利亚地区的自决和独立。该运动植根于阿玛济格人的身份政治和世俗民主价值观，在“黑色春天”抗议活动后迅速发展壮大，并已成为卡比利亚地区最主要的独立组织。"
 KBY.conservatism: "£generic_conservatism_small 卡比利亚集会"
 KBY.conservatism_icon: "£generic_conservatism_small"
 KBY.conservatism_desc: "（保守主义）- 卡比利亚集会\n\n这是一个保守的卡比利亚政治运动，主张地区自治和保护传统的阿玛济格文化价值观。它力求在权力下放和文化自治的框架内促进卡比利亚人的利益。"
 KBY.Nat_Populism: "£generic_Nat_Populism_small 阿玛济格世界大会"
 KBY.Nat_Populism_icon: "£generic_Nat_Populism_small"
 KBY.Nat_Populism_desc: "（右翼民粹主义）- 阿玛济格世界大会\n\n成立于1995年的阿玛济格世界大会是一个代表北非各地阿玛济格人的国际组织。它致力于争取承认阿玛济格语言、文化和政治权利，并拥有联合国经济及社会理事会的咨商地位。"
 KBY.liberalism: "£ALG_neutral_libertarian_small 文化与民主集会"
 KBY.liberalism_icon: "£ALG_neutral_libertarian_small"
 KBY.liberalism_desc: "（自由主义）- 文化与民主集会\n\n文化与民主集会由赛义德·萨迪于1989年创立，是一个植根于卡比利亚地区的世俗主义自由政党。它倡导民主改革、人权，并在现代多元的阿尔及利亚推广阿玛济格文化和语言。"
 KBY.Neutral_conservatism: "£generic_Neutral_conservatism_small 卡比利亚警报和预防中心"
 KBY.Neutral_conservatism_icon: "£generic_Neutral_conservatism_small"
 KBY.Neutral_conservatism_desc: "（中间派伊斯兰主义）- 卡比利亚警报和预防中心\n\n这是一个以卡比利亚地区地方治理、文化保护和公民参与为重点的社区组织。它强调基层动员和保护卡比利亚社区免受外部政治压力的影响。"
 KBY.neutral_Social: "£generic_neutral_Social_small 社会主义力量阵线"
 KBY.neutral_Social_icon: "£generic_neutral_Social_small"
 KBY.neutral_Social_desc: "（民主社会主义） - 社会主义力量阵线\n\n社会主义力量阵线由侯赛因·艾特·艾哈迈德于1963年创立，是阿尔及利亚历史最悠久的反对党之一。该党主要在卡比利亚地区活动，倡导社会民主、世俗主义和民主多元主义。该党曾抵制过几次其认为存在舞弊的选举，但至今仍是柏柏尔人政治代表权的重要力量。"
 KBY.Western_Autocracy: "£generic_Western_Autocracy_small 卡比利亚临时政府"
 KBY.Western_Autocracy_icon: "£generic_Western_Autocracy_small"
 KBY.Western_Autocracy_desc: "（亲西方专制主义） - 卡比利亚临时政府\n\n卡比利亚临时政府由费尔哈特·梅赫尼于2010年创立，是卡比利亚独立运动的政府机构。该组织寻求国际社会承认卡比利亚人民的自决权，并将自身定位为亲西方、世俗的、与阿尔及利亚中央政府相抗衡的替代力量。"
 KBY.Autocracy: "£ALG_liberalism_small 民主民族集会"
 KBY.Autocracy_icon: "£ALG_liberalism_small"
 KBY.Autocracy_desc: "（左翼专制主义）- 民主民族集会\n\n阿尔及利亚民主民族集会卡比利亚分支，代表中央政府在该地区的政治利益。它是卡比利亚的建制派政党，与阿尔及利亚国家机器保持联系，并主张国家统一而非地区自治。"
 KBY.anarchist_communism: "£generic_anarchist_communism_small 社会党"
 KBY.anarchist_communism_icon: "£generic_anarchist_communism_small"
 KBY.anarchist_communism_desc: "（无政府共产主义）- 社会党\n\n这是一个位于卡比利地区的极左政治组织，主张激进的社会变革、工人自治和废除等级森严的治理体系。该组织汲取阿玛济格人的社群传统和社会主义理论，倡导集体所有制和直接民主。"
 KBY.Neutral_Libertarian: "£generic_Neutral_Libertarian_small 卡比利亚民众行动协调组织"
 KBY.Neutral_Libertarian_icon: "£generic_Neutral_Libertarian_small"
 KBY.Neutral_Libertarian_desc: "（保守主义）- 卡比利亚民众行动协调组织\n\n卡比利地区的民众协调运动，倡导个人自由、自由企业和最小程度的国家干预。它源于旨在保护当地社区和促进该地区经济发展的基层行动主义。"
 KBY.Neutral_Muslim_Brotherhood: "£generic_Neutral_Muslim_Brotherhood_small 柏柏尔村庄集会公民运动"
 KBY.Neutral_Muslim_Brotherhood_icon: "£generic_Neutral_Muslim_Brotherhood_small"
 KBY.Neutral_Muslim_Brotherhood_desc: "（温和伊斯兰主义） - 柏柏尔村庄集会公民运动\n\n这是一场植根于卡比利亚传统村落集会的公民运动，融合了阿玛济格文化认同和温和的伊斯兰价值观。它在2001年“黑色春天”抗议活动中兴起，成为社区代表和争取政治改革及文化认可的平台。"
 JAP.Neutral_conservatism2: "£JAP_Neutral_conservatism (YP) - 众人之党"
 JAP.Neutral_conservatism2_icon: "£JAP_Neutral_conservatism"
 JAP.Neutral_conservatism2_desc: "（新自由主义） - 众人之党\n\n众人之党是一个改革导向的中右翼政党，成立于2009年8月，主要由渡边佳美等人领导。该党提出的建党纲领包括：通过减少公务员人数和降低其薪酬、全面禁止“从天而降”、通过放松管制促进竞争以及将国有企业私有化来“打破官僚控制”；通过将财政收入下放至地方政府并引入以地方主权为基础的“地方自治”制度来“维护地方主权”；以及通过经济增长创造就业机会和构建社会保障体系来“关注民生”。通过这些纲领，该党力图成为与日本两大政党抗衡的第三股力量。"
 JAP.Neutral_conservatism3: "£JAP_Neutral_conservatism (POH) - 希望之党"
 JAP.Neutral_conservatism3_icon: "£JAP_Neutral_conservatism"
 JAP.Neutral_conservatism3_desc: "（改革保守主义） - 希望之党\n\n希望之党是小池百合子领导的“全民第一会”于2017年9月成立的全国性政党。该党纲领主张摆脱“既得利益政治”，并提出以监管改革、小政府和行政改革为重点的改革路线。在政策方面，该党在强调日美同盟的同时，也主张修改宪法、冻结消费税增长，总体上具有强烈的亲美、改革保守主义倾向。小池百合子将该党定位为“宽容的改革保守主义”，并作为主要政党之外的另一种选择而获得支持。"
 JAP.Neutral_conservatism4: "£JAP_Neutral_conservatism (DPFP) - 国民民主党"
 JAP.Neutral_conservatism4_icon: "£JAP_Neutral_conservatism"
 JAP.Neutral_conservatism4_desc: "（改革中间主义） - 国民民主党\n\n国民民主党是在2020年反对党重组后重建的政党，其前身是成立于2018年5月的同名政党，该党由原民主党和原希望之党的部分成员合并而成。国民民主党在其党纲中将“自由”、“共存”和“对未来负责”列为基本原则，并将自身定位为“改革派中间政党”，其政治观点涵盖了从温和保守主义到自由主义的各个方面。在政治立场上，该党主张“以解决方案代替对抗”，并强烈倾向于更注重政策提案和问题解决，而非执政反对派之间的对抗。在经济政策方面，该党强调工资增长、提高家庭可支配收入和促进增长型投资，并力求采取务实的改革路线。在外交和安全政策方面，它强调务实的应对措施。尽管政策重点和党的性质会随着时期和党的内部组成而发生变化，但它被定位为一股倡导中间派改革路线的力量，作为现有政党的替代方案。"
 JAP.Nat_Autocracy2: "£JAP_autocracy_2 (JAF) - 日本武装力量"
 JAP.Nat_Autocracy2_icon: "£JAP_autocracy_2"
 JAP.Nat_Autocracy2_desc: "（军事国家主义） - 日本武装力量\n\n随着宪法第九条的废除，日本正式从受宪法约束的“自卫”模式过渡到正规化的国民军模式。原先的日本自卫队框架已被日本武装部队所取代，后者拥有明确的法律授权，负责捍卫国家主权、遏制地区威胁，并作为常规的国家权力工具运作。\n\n这一转变使得日本能够进行更广泛的兵力结构发展，提高战备水平和采购目标，并在统一的国防理论框架下整合指挥、情报和远征能力。其核心政治矛盾不再是宪法是否允许，而是日本重新军事化的规模、监督和战略方向。"
 JAP.Monarchist2: "£JAP_Monarchist (YAM) - 大和皇室"
 JAP.Monarchist2_icon: "£JAP_Monarchist"
 JAP.Monarchist2_desc: "（帝国君主主义） - 大和皇室\n\n大和皇室是一股君主主义政治思潮，它将皇权视为国家主权和延续的最终来源。该思潮力图恢复天皇在宪法中的最高权威，将皇位置于其他立法和行政机构之上，并围绕皇权重塑国家秩序。\n\n作为一个运动，它主要围绕制度重建而非日常政策治理展开。其纲领刻意狭窄：一旦达成理想的宪政解决方案，它便不会提出清晰的长期纲领来维持传统的政党统治，而是将自身定位为重建以帝国为中心的国家秩序的工具。"
 IND.Mod_Vilayat_e_Faqih: "£generic_Mod_Vilayat_e_Faqih_small 劳斯扬思想研究所"
 IND.Mod_Vilayat_e_Faqih_desc: "（进步什叶派伊斯兰民主主义） - 在印尼反什叶派迫害和威权主义盛行的背景下，劳斯扬思想研究所及其附属组织（包括伊斯兰哲学活动家网络和其他什叶派哲学文化组织）致力于倡导多元化。虽然这些组织并非明确的什叶派组织（成员面向所有人开放），但什叶派伊斯兰教在这些组织内部仍然占据重要地位。与一些类似团体一样，劳斯扬思想研究所也诞生于伊朗革命后什叶派伊斯兰教的复兴浪潮中，但其领导层并未强制成员接受任何固定的什叶派哲学教义。在意识形态上，该组织批判新自由主义资本主义和寡头政治，倡导社会和经济平等。"
 IND.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small 劳斯扬思想研究所（霍梅尼主义）"
 IND.Vilayat_e_Faqih_desc: "（左翼霍梅尼主义） - 在印尼反什叶派迫害和威权主义盛行的背景下，劳斯扬思想研究所及其附属组织（包括伊斯兰哲学活动家网络和其他什叶派哲学文化组织）致力于倡导多元化。虽然这些组织并非明确的什叶派组织（成员面向所有人开放），但什叶派伊斯兰教在这些组织内部仍然占据重要地位。与一些类似团体一样，劳斯扬思想研究所也诞生于伊朗革命后什叶派伊斯兰教的复兴浪潮中，但其领导层并未强制成员接受任何固定的什叶派哲学教义。在意识形态上，该组织批判新自由主义资本主义和寡头政治，倡导社会和经济平等。"
 IND.Caliphate: "£generic_Caliphate_small (DI/TII) 伊斯兰之家/印度尼西亚伊斯兰武装力量"
 IND.Caliphate_desc: "（伊斯兰原教旨主义） - 伊斯兰之家成立于1942年印尼民族革命期间，其参与国家解放的明确目标是在印尼境内建立一个伊斯兰国家。随着共和国的胜利和独立，该党将攻击目标转向新生的印尼，发动了一场持续到1962年的叛乱，直至其领导人被杀 - 这实际上瓦解了该组织作为一个整体的凝聚力。如今，该组织仍在以远逊于以往的规模运作，其分裂组织也层出不穷，其中不乏由伊斯兰之家成员组成的团体。"
 AFR.Autocracy: "£generic_Autocracy_small (RUF) - 革命联合战线"
 AFR.Autocracy_desc: "（革命民粹主义） - 革命联合战线\n\n革命联合阵线是福迪·桑科于1991年3月23日在查尔斯·泰勒的支持下，从利比里亚领导的叛军运动，进入塞拉利昂。该组织在其宣言《通往民主之路》中承诺结束腐败的一党制国家，让人民分享钻石财富，并实现模糊的泛非主义社会正义。然而，在实践中，它却沦为通过恐怖手段控制钻石矿区的机器，以残害平民肢体和绑架约11000名儿童兵而臭名昭著。\n\n其影响力源于钻石以及与非洲革命武装力量叛军的联盟。自1997年5月起，该组织与叛军共同统治弗里敦，直至1998年2月西非国家经济共同体将其驱逐。1999年7月的洛美协议使桑科成为副总统兼矿产资源委员会主席。2000年5月桑科被捕，2002年1月解除武装，该组织从此不再具有战斗力；其政党在2002年大选中仅获得2.2%的选票，桑科于2003年在狱中去世，其三名指挥官于2009年被判犯有战争罪。"
 KAC.Neutral_Autocracy_desc: "（务实民族主义） - 克钦独立组织成立于1961年，最初名为景颇独立组织，其成立的背景是对缅甸政府的不满以及国内局势的不断变化。该组织反对后殖民时代的政府以及1962年通过军事政变上台的奈温政权。克钦独立组织通过其武装力量 - 克钦独立军 - 控制着克钦邦的部分地区，并致力于与其他民族结盟，以维护安全和共同防御。该组织名义上倾向于左翼，但实际上是一个包容各方的组织，其核心是克钦民族主义，主张在联邦制的缅甸内实现自治，或争取克钦人民的完全独立。"
 KAC.Neutral_Communism: "£generic_Neutral_Communism_small (NDA-K) - 新民主军 - 克钦"
 KAC.Neutral_Communism_desc: "（民族共产主义） - 1989年从克钦独立组织分裂出来的克钦新民主军名义上是一个共产主义组织，但实际上与缅甸军政府结盟。除了模糊的纲领和标榜的理想之外，该组织几乎没有任何意识形态，除了在克钦邦施加政府影响力并试图扩大自身影响力之外，几乎没有其他实际行动。"
 KAR.Neutral_Autocracy_desc: "（务实民族主义） - 克伦民族联盟成立于1947年，即缅甸次年独立之前。1949年，该组织通过其武装力量对新政府发动起义，其活动强度随缅甸局势的变化而时而增强，时而减弱。尽管经历了内部分裂和领土损失，该组织仍在与亲政府和亲克伦族的竞争对手组织展开竞争，并继续运作。该组织名义上属于左翼，但由于其目标广泛，克伦民族主义占据主导地位。"
 KAR.Neutral_conservatism: "£generic_Neutral_conservatism_small (DKBO)  - 民主克伦佛教组织"
 KAR.Neutral_conservatism_desc: "（保守民族主义）- 由克伦民族联盟分裂而来，民主克伦佛教组织及其军事分支民主克伦佛教军旨在建立一个摆脱他们所称的克伦民族联盟内部亲基督教歧视的组织。成立后，他们迅速与克伦民族联盟彻底划清界限，放弃了对政府的反对，同时保留了更为保守的民族主义和克伦邦发展目标。"
 LAO.anarchist_communism: "£generic_anarchist_communism_small (LFND) 老挝建国阵线"
 LAO.anarchist_communism_desc: "（人民阵线） - 老挝建国阵线成立于1979年，是老挝人民民主共和国（老挝人民革命党）内部的一个群众组织，旨在联合各种小型团体和群众组织。该阵线协助协调各工会、宗教团体和其他小型组织，并为民众在老挝现有体制内参与政治提供渠道。老挝人民革命党领导该阵线，并在阵线内部占据主导地位。"
 SYR.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small 叙利亚伊斯兰抵抗运动"
 SYR.Vilayat_e_Faqih_desc: "（霍梅尼主义） - 叙利亚伊斯兰抵抗阵线成立于叙利亚境内，旨在对抗叙利亚境内的反对派势力。它是一个激进的什叶派准军事组织，公开宣称反对以色列对叙利亚的“占领”，以及叙利亚境内任何被视为亲西方利益的情绪。据称，叙利亚伊斯兰抵抗阵线得到了伊朗的支持，并与真主党及其他亲伊朗组织同属“抵抗轴心”。其意识形态主要受什叶派伊斯兰主义影响，但与伊朗的密切关系也深刻影响着叙利亚伊斯兰抵抗阵线的立场、目标和组织结构。"
 NKO.Neutral_Communism: "£generic_Neutral_Communism_small (DFRK)  - 朝鲜统一民主阵线"
 NKO.Neutral_Communism_desc: "（人民阵线） - 朝鲜民主主义人民阵线（简称“朝鲜阵线”）成立于1949年，实际上是朝鲜民主主义人民共和国的人民阵线，它将多个群众组织、团体、工会和小党派合并在朝鲜劳动党的旗帜下。朝鲜阵线的目标是组织和推动大韩民国和朝鲜民主主义人民共和国在朝鲜劳动党领导的统一共产主义统治下和平统一。最初，朝鲜阵线由韩国和朝鲜的团体组成，但由于朝鲜劳动党的统治地位及其极端民族主义的主体思想，它如今主要沦为朝鲜劳动党巩固自身控制和影响力的工具。"
 SWE.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small (HAYI) 伊斯兰之声运动"
 SWE.Vilayat_e_Faqih_desc: "（霍梅尼主义） - 伊斯兰之声运动是一个什叶派武装组织，据称在欧洲多个国家活动并吸纳成员。该组织成立于2026年左右，据称与伊朗伊斯兰革命卫队关系密切，其主要目的是作为伊朗在欧洲的代理人。该组织在意识形态上信奉霍梅尼主义，但其大部分活动本质上是军事性的而非政治性的。"
 SWE.Nat_Autocracy_desc: "（务实军政府）- 瑞典武装部队的历史可以追溯到1521年，其现行结构和框架于1971年确立。纵观其历史，瑞典军队曾参与多次战争、战役和内部冲突 - 主要集中在瑞典帝国时期。近代以来，瑞典军事行动较少，军队也相对保持政治中立，在两次世界大战中均保持中立，冷战期间也仅维持防御状态。冷战后，瑞典军队继续保持一定的战备水平，并与联合国等国际组织开展合作。"
 SWE.Monarchist_desc: "（君主立宪制）- 贝尔纳多特王朝始于1818年查理十四世·约翰时期，最初是瑞典和挪威的共同统治者，直至1905年。该王朝起源于法国 - 查理十四世在法国大革命期间担任法国元帅，之后加入反拿破仑联盟。虽然之前的王朝对瑞典的权力程度不一 - 包括一段实行选举君主制的时期 - 但贝尔纳多特王朝的统治本质上是君主立宪制的。19世纪君主与议会之间的权力斗争最终促成了两者之间权力平衡的局面，类似于其他欧洲君主制国家。"
 ADJ.Autocracy: "£generic_Autocracy_small (DUR) - 复兴民主联盟"
 ADJ.Autocracy_desc: "（区域专制主义） - 复兴民主联盟\n\n复兴联盟的前身是阿斯兰·阿巴希泽于1992年创立的“格鲁吉亚复兴阿扎尔联盟”。1992年，阿巴希泽就任阿扎尔最高委员会主席的第二年，该联盟正式更名为复兴联盟。复兴联盟与其说是一个独立的政党，不如说是阿巴希泽统治的政治工具。自1995年起，复兴联盟在历次议会选举中都赢得了阿扎尔地区95%的选票，并在1999年带领复兴联盟获得了四分之一的全国选票。其竞选纲领主张在实践中实行自治：该地区实行自由经济区制度，关税收入留在巴统；拥有自己的武装力量；并与俄罗斯保持密切联系。玫瑰革命后，复兴联盟在2004年3月的选举中得票率低于门槛。2004年5月，格鲁吉亚特种部队进入该地区，阿巴希泽辞职前往莫斯科，复兴联盟也在几天内解散。"
 JUB.Western_Autocracy: "£generic_Nat_Autocracy_small (ASF)  - 索马里全国同盟军§C亲西方派§!"
 JUB.Western_Autocracy_1: "£generic_Nat_Autocracy_small (JVA) - 朱巴谷联盟§C亲西方派§!"
 JUB.Western_Autocracy_desc: "（务实专制主义） - 1999年，索马里局势日益恶化，索马里盟军应运而生。该组织在朱巴兰地区与当地军阀穆罕默德·赛义德·赫尔西·摩根作战。其主要支持者来自马雷汉氏族，并与其他由马雷汉氏族主导的组织，如索马里民族阵线，存在一些联系。"
 JUB.Western_Autocracy_1_desc: "（务实专制主义） - 朱巴谷联盟起源于索马里盟军，其核心人物是巴雷·阿丹·希雷·希拉莱。该联盟整体上以马雷汉氏族为主导，但也支持建立索马里民族政府，并反对朱巴兰地区的地方军阀和伊斯兰势力。"
 GRN.conservatism: "£generic_conservatism_small (ATT) - 团结"
 GRN.conservatism_icon: "£generic_conservatism_small"
 GRN.conservatism_desc: "（古典自由主义） - 团结党\n\n团结党成立于20世纪70年代末，旨在反对当时占据主导地位的前进党。该党最初被视为支持丹麦王室统一、同时又主张自治的政党，但此后逐渐转向更为自由主义的方向。团结党支持公共产业私有化、公民收入、北约合作以及格陵兰加入欧盟，其自由主义倾向也使其支持对核心初级产业企业提供补贴。"
 GRN.liberalism: "£generic_liberalism_small (D) - 民主党"
 GRN.liberalism_icon: "£generic_liberalism_small"
 GRN.liberalism_desc: "（社会自由主义） - 民主党\n\n民主党成立于2002年，被认为是一个社会自由主义政党。其核心政治立场是，只有格陵兰岛能够证明自身可以自给自足，才能追求独立。这一立场使其与主要政治对手截然不同，后者倾向于走一条更直接的独立道路。"
 GRN.socialism: "£generic_socialism_small (S) - 前进党"
 GRN.socialism_icon: "£generic_socialism_small"
 GRN.socialism_desc: "（社会民主主义） - 前进党\n\n前进党成立于1977年，是社会党国际的观察员。其政治立场与丹麦社会民主党大致一致，自格陵兰获得自治以来，一直是格陵兰政坛的主导政党之一。"
 GRN.Neutral_conservatism: "£generic_Neutral_conservatism_small (PP) - 极地党"
 GRN.Neutral_conservatism_icon: "£generic_Neutral_conservatism_small"
 GRN.Neutral_conservatism_desc: "（民族保守主义） - 极地党\n\n极地党成立于20世纪80年代初，是一个传统的保守派独立政党。尽管在1987年的选举中表现不佳，但它在1991年保住了唯一的席位。1995年，该党失去了这个席位，从此在格陵兰政坛销声匿迹。许多人认为该党已经解散，但一些人心中仍然保留着传统的保守主义观点。"
 GRN.oligarchism: "£generic_oligarchism_small (Q) - 油灯党"
 GRN.oligarchism_icon: "£generic_oligarchism_small"
 GRN.oligarchism_desc: "（寡头） - 油灯党\n\n油灯党主张立即独立，并高度重视从格陵兰岛开采石油。许多人并不清楚该党究竟打算如何实现这些目标，但其支持者认为，现在是时候采取果断行动，为格陵兰岛开辟一条新的发展道路了。"
 GRN.neutral_Social: "£generic_neutral_Social_small (IA) - 因纽特人共同体"
 GRN.neutral_Social_icon: "£generic_neutral_Social_small"
 GRN.neutral_Social_desc: "（市场社会主义） - 因纽特人共同体\n\n因纽特人共同体成立于1978年，其根源可追溯至20世纪70年代席卷丹麦的青年激进主义运动。1982年，该党成功推动格陵兰退出欧洲经济共同体。它强烈倡导格陵兰独立，并被广泛认为是左翼民族主义政党。该党支持市场社会主义，力求建立更加社会主义的国内经济，同时坚持认为独立的格陵兰必须保持国际竞争力。"
 GRN.Nat_Populism: "£generic_Nat_Populism_small (N) - 定向党"
 GRN.Nat_Populism_icon: "£generic_Nat_Populism_small"
 GRN.Nat_Populism_desc: "（民族民粹主义） - 定向党\n\n定向党致力于通过更为强硬的手段推进格陵兰独立。该党成员自称政治立场偏向中间偏右，但其最显著的特征是强烈的民粹主义和亲格陵兰民族主义。许多人认为这是推动格陵兰独立的主要力量，而越来越多的格陵兰人希望在不久的将来看到格陵兰独立。"
 GRN.Nat_Autocracy: "£generic_Nat_Autocracy_small (GMM) - 格陵兰民兵运动"
 GRN.Nat_Autocracy_icon: "£generic_Nat_Autocracy_small"
 GRN.Nat_Autocracy_desc: "（民族专制主义） - 格陵兰民兵运动\n\n格陵兰民兵运动是一个极其松散的个人和小团体网络，他们团结一致，坚信格陵兰公民应该能够保卫家园免受外国侵略者（包括与外国结盟的政权）的侵害。虽然没有人主张以公开暴力手段争取独立，但这个分散的运动中的许多人表示，如果国家需要，他们会拿起武器。然而，大多数成员只是希望格陵兰能够建立一支正式的武装力量来辅助他们的行动。"
 GRN.Greenland_Armed_Services_Created: "£generic_Nat_Autocracy_small (ASG) - 格陵兰武装力量"
 GRN.Greenland_Armed_Services_Created_desc: "（民族专制主义） - 格陵兰武装力量\n\n随着独立尘埃落定，国家政府全面负责国家事务，格陵兰武装部队的组建时机已到。尽管几乎是从零开始建立这支部队，但新成立的军队及其支持者都致力于学习、成长，并打造一支无论国土面积大小都能令国家引以为傲的军队。"
 GRN.Monarchist: "£generic_Monarchist_small (HKN) - 格陵兰王室"
 GRN.Monarchist_icon: "£generic_Monarchist_small"
 GRN.Monarchist_desc: "（君主立宪制） - 格陵兰王室\n\n这个名为“格陵兰王室”的边缘君主主义政党内部存在两大主要思想流派。一派主张格陵兰作为公国继续留在丹麦主权之下，并建立格陵兰之家作为丹麦王室的附属君主制国家。另一派则寻求完全独立，建立格陵兰王国，其理念深受丹麦君主立宪制的影响。许多人认为该党只是边缘运动，但也有人质疑，这两种愿景是否能为格陵兰岛的发展提供一个更为连贯的框架。"
 TML.anarchist_communism: "£generic_anarchist_communism_small (LTTE)  - 泰米尔伊拉姆猛虎解放组织"
 NRY.conservatism: "£NRY_conservatism_small 右翼"
 NRY.conservatism_icon: "£NRY_conservatism_small"
 NRY.conservatism_desc: "保守主义 - 保守党是挪威占主导地位的保守党。他们致力于经济自由化和减税。他们支持加入欧盟，历史上一直亲美。"
 NRY.liberalism: "£NRY_liberalism_small 左翼"
 NRY.liberalism_icon: "£NRY_liberalism_small"
 NRY.liberalism_desc: "自由主义 - 自由党是挪威历史最悠久的政党，一直倡导自由权利以及教育、环境和文化。"
 NRY.socialism: "£NRY_socialism_small 工党"
 NRY.socialism_icon: "£NRY_socialism_small"
 NRY.socialism_desc: "社会民主主义 - 工党最初是一个共产主义政党，但通过转型为社会民主党而赢得了广泛支持。在二战后的几乎整个历史时期，工党一直是挪威止最大的政党，并主导了挪威的社会发展。他们自视为是福利国家的捍卫者，并且支持欧盟和北约。"
 NRY.Western_Autocracy: ""
 NRY.Western_Autocracy_desc: ""
 NRY.anarchist_communism: "£NRY_anarchist_communism_small 红党"
 NRY.anarchist_communism_icon: "£NRY_anarchist_communism_small"
 NRY.anarchist_communism_desc: "左翼激进派 - 红党由两个马克思列宁主义和毛主义政党合并而成。他们后来放弃了公开的共产主义立场，转而倾向于更民主的社会主义道路。他们希望终结资本主义并退出北约。"
 NRY.Conservative: "£generic_Conservative_small 气候现实主义者"
 NRY.Conservative_icon: "£generic_Conservative_small"
 NRY.Conservative_desc: ""
 NRY.Caliphate: "£generic_Caliphate_small 先知乌玛"
 NRY.Caliphate_icon: "£generic_Caliphate_small"
 NRY.Caliphate_desc: ""
 NRY.Neutral_conservatism: "£NRY_Neutral_conservatism_small 基督教人民党"
 NRY.Neutral_conservatism_icon: "£NRY_Neutral_conservatism_small"
 NRY.Neutral_conservatism_desc: "保守主义 - 基督教人民党是一个中右翼的基督教政党。他们希望国家将基督教作为官方宗教进行宣传。在外交政策上，他们希望促进和平，赞成增加对穷国的援助。"
 NRY.oligarchism: "£NRY_oligarchism_small 中间党"
 NRY.oligarchism_icon: "£NRY_oligarchism_small"
 NRY.oligarchism_desc: "农民党 - 中间党是一个以农村为主的政党。该党持欧洲怀疑论，不喜欢自由贸易。该党致力于扭转中央集权，并希望增加农业补贴。"
 NRY.neutral_Social: "£NOR_neutral_Social_small 社会左翼党"
 NRY.neutral_Social_icon: "£NOR_neutral_Social_small"
 NRY.neutral_Social_desc: "社会民主主义 - 社会左翼党作为工党的分裂派系而成立，他们希望终止北约成员资格。该党派比工党更为左倾，倡导女权主义、社会福利、环保主义和国家资本主义。"
 NRY.Neutral_Libertarian: "£NRY_Neutral_Libertarian_small 自由党"
 NRY.Neutral_Libertarian_icon: "£NRY_Neutral_Libertarian_small"
 NRY.Neutral_Libertarian_desc: "自由主义 - 自由党是一个相当新兴的自由主义政党，他们主张终结税收，削减福利和削弱国家权力。"
 NRY.Neutral_green: "£NRY_Neutral_green_small 环境绿党"
 NRY.Neutral_green_icon: "£NRY_Neutral_green_small"
 NRY.Neutral_green_desc: "环保主义 - 环境绿党是在受到德国绿党选举收益的启发下成立的，其主要原因是环保主义。"
 NRY.Nat_Fascism2: "£NRY_Nat_Fascism_small 联盟"
 NRY.Nat_Fascism2_icon: "£NRY_Nat_Fascism_small"
 NRY.Nat_Fascism2_desc: "法西斯主义 - 联盟的成立旨在建立一个反对欧洲共同市场和劳动力自由流动的广泛阵线，但其主要支持者来自希望终结一切移民的极右翼人士。他们持反伊斯兰立场，并时常煽动种族仇恨。"
 NRY.Nat_Fascism: "£NRY_vigrid_small 暴战"
 NRY.Nat_Fascism_icon: "£NRY_vigrid_small"
 NRY.Nat_Fascism_desc: "法西斯主义 - 暴战（来自古挪威神话，与诸神黄昏有关）是一个宣扬北欧异教的新纳粹政党与运动。他们是质疑大屠杀真实性并崇拜希特勒的白人至上主义者。"
 NRY.Nat_Populism: "£NRY_Nat_Populism_small 进步党"
 NRY.Nat_Populism_icon: "£NRY_Nat_Populism_small"
 NRY.Nat_Populism_desc: "右翼民粹主义 - 进步党的核心是民粹主义。他们在很大程度上赞成结束移民，特别是来自穆斯林国家的移民。他们支持强大的国家和军队，并倡导增加高速公路，老年人和健康方面的公共支出。"
 NRY.Monarchist: "£NRY_nationalist_monarchist 格吕克斯堡家族"
 NRY.Monarchist_icon: "£NRY_nationalist_monarchist"
 NRY.Monarchist_desc: ""
 LGN.Nat_Autocracy: "£generic_Nat_Autocracy_small 中非共和国复兴人民阵线"
 LGN.Nat_Autocracy_desc: "（军事叛乱组织）- 中非共和国复兴人民阵线\n中非复兴人民阵线是作为一个叛乱组织而成立的，是几个前塞雷卡叛乱派别之一。在努尔丁·亚当的领导下，该组织在中非共和国东北部建立了自己的平行国家，称为洛贡共和国（亦称达尔库提）。"
 SWI.Nat_Fascism: "£SWI_Nat_Fascism 国民阵线"
 SWI.Nat_Fascism_icon: "£SWI_Nat_Fascism"
 SWI.Nat_Fascism_desc: "瑞士国民阵线是20世纪30年代瑞士的一个极右翼政党。据《瑞士历史词典》记载，该党鼎盛时期拥有多达9000名成员；而据西蒙·维森塔尔中心估计，其成员人数可能达到25000人左右。该党由帝国宣传部资助。国民阵线于1940年解散，并于1943年被瑞士联邦委员会取缔。"
 SWI.Neutral_Autocracy: "£generic_Neutral_Autocracy_small (AVB)阿尔卑斯人民运动"
 SWI.Neutral_Autocracy_icon: "£generic_Neutral_Autocracy_small"
 SWI.Neutral_Autocracy_desc: "（泛阿尔卑斯民族主义）- 阿尔卑斯人民运动\n\n阿尔卑斯人民运动源于将瑞士的版图扩展到其旧国界之外的泛阿尔卑斯运动。该运动自诩为阿尔卑斯人民的守护者而非政党，并通过任命的地区委员会管理联邦各州。选举仍在继续，但任何与该运动构成真正竞争的候选人均被禁止参选。"
 BOS.Neutral_Libertarian_icon: "£generic_Neutral_Libertarian_small"
 BOS.Nat_Autocracy_icon: "£generic_Nat_Autocracy_small"
 SIA.Western_Autocracy: "£SIA_Western_Autocracy 看守政府"
 SIA.Western_Autocracy_desc: "（亲西方的专家统治） - 当民选政治陷入僵局或丑闻时，泰国屡次启用由技术官僚、高级公务员和商界人士组成的、经皇室认可的看守内阁，其中最著名的当属1991年和1992年阿南·班雅拉春领导的看守内阁。这些政府虽然未经选举产生，但总体上亲市场、亲西方，承诺廉洁奉公，迅速恢复稳定，之后再将权力交还给选民。"
 SIA.socialism_1: "£SIA_western_social_democrat (PP) - 人民党"
 SIA.socialism_desc_1: "（进步主义）- 人民党\n\n改革运动的第三次重组，在宪法法院解散其前身后数日内便已成立，并由同一批议员在新一届行政机构的领导下运作。其纲领未变：改革征兵制度、建立民选参议院、权力下放以及终止法院罢免政府的权力。每一次重组都导致运动失去领导层，选民也依然原地踏步。"
 SIA.Neutral_Muslim_Brotherhood: "£SIA_Neutral_Muslim_Brotherhood (PCC) - 民族党"
 SIA.Neutral_Muslim_Brotherhood_desc: "（进温和伊斯兰）- 民族党\n\n民族党源于马来穆斯林议员瓦达派系，该党主张通过选举而非武力，维护泰国南部穆斯林占多数的北大年府、也拉府和那拉提瓦府的利益。民族党奉行不结盟和多元主义，致力于在民主的泰国境内建立多元文化社会，争取更大的区域自治权，并争取国家承认少数宗教信仰，将自身定位为该地区武装分离主义势力之外的和平选举选择。"
 SIA.Neutral_Autocracy: "£SIA_Neutral_Autocracy 官僚保皇派建制（阿马特）"
 SIA.Neutral_Autocracy_desc: "（建制派威权主义） - 俗称阿马特的这个未经选举产生的网络，由高级官员、法官和枢密院内部人士组成，世世代代以来一直在幕后操控着泰国政治。它凌驾于政党竞争之上，维护着传统的等级制度和王室特权，通过法院、公务员队伍以及对民选政府的低调管理来行使权力，而非通过选票。"
 SIA.Neutral_conservatism_1: "£SIA_Neutral_conservatism_1 (BJT) - 泰自豪党"
 SIA.Neutral_conservatism_desc_1: "(民族保守主义) - 泰自豪党\n\n泰自豪党成立于 2008 年，是人民力量党的一个分裂体，该党强烈支持国家君主制，并坚持保守的政治纲领，而党内各派系则采取了更为民粹主义和福​​利导向的立场。"
 SIA.oligarchism: "£generic_oligarchism_small 大亨"
 SIA.oligarchism_desc: "(寡头政治) - 泰国政坛长期以来深受泰籍华裔商业家族 - “大亨”的影响，这些家族企业集团掌控着金融、农业、电信和零售等行业。务实且以利润为导向的这一财阀精英集团，为各党派提供资金支持，并左右政策走向，使其向自身商业利益靠拢，而不管谁正式执政。"
 SIA.Neutral_green: "£generic_Neutral_green_small 绿色运动"
 SIA.Neutral_green_desc: "（绿色政治） - 在以增长为先的政治文化中，环保人士、森林保护网络和反污染运动人士等分散的群体被边缘化。他们仅由泰国森林保护党等小型组织代表参加选举，泰国的绿色力量致力于可持续发展、社区对土地和水资源的控制，并抵制破坏乡村环境的水坝、矿山和大型工业项目。"
 SIA.neutral_Social_1: "£SIA_neutral_Social_1 (PPP) - 人民力量党"
 SIA.neutral_Social_desc_1: "（广泛民粹主义） - 人民力量党\n\n人民力量党成立于2007年，是泰爱泰党被法院下令解散后，其支持者的过渡组织。该党在总理沙马·顺达卫的领导下，使他信的盟友重新掌权。2008年12月，宪法法院以选举舞弊为由解散了人民进步党，迫使该运动再次重组。"
 SIA.neutral_Social_2: "£SIA_neutral_Social_2 (PTP) - 为泰党"
 SIA.neutral_Social_desc_2: "（民粹自由主义） - 为泰党\n\n受泰爱泰党影响，为泰党试图在社会和经济层面延续其民粹主义遗产，并推行更为自由化的民粹主义。该党主张民主改革，并限制军方权力。"
 SIA.Nat_Fascism: "£SIA_Nat_Fascism 极端民族主义右翼"
 SIA.Nat_Fascism_desc: "（极端民族主义）- 泰国极右翼的激进边缘群体，继承了上世纪70年代反共准军事组织（如纳瓦朋和红色野牛）的传统。他们将对国家、宗教和国王的狂热拥护与街头暴力嗜好相结合，把改革派、左翼人士和共和党人视为泰国秩序的叛徒，并寻求通过强人政权而非选举来清除他们。"
 FRA.Nat_Populism_2018: "£front_national (RN) - 国民联盟"
 FRA.Nat_Populism_2018_icon: "£front_national"
 FRA.Nat_Populism_2018_desc: "（民族民粹主义）- 国民联盟\n\n2018年，玛丽娜·勒庞将国民阵线更名为国民阵线，完成了长达十年的“去妖魔化”运动，而这场运动早已迫使她的父亲退出了他创立的政党。国民阵线保留了反移民和保护主义的核心立场，但放弃了退出欧元区的承诺，转而争取被左翼抛弃的工人阶级选民的支持。该党寻求与莫斯科而非华盛顿合作，并将欧盟视为一个需要从内部重新谈判的组织。"
 FRA.Monarchist3: "£FRA_Monarchist (MdO) - 奥尔良王室"
 FRA.Monarchist3_icon: "£FRA_Monarchist"
 FRA.Monarchist3_desc: "（奥尔良主义）- 奥尔良王室\n\n卡佩王朝的旁支是路易十四的弟弟路易·菲利普的后裔，奥尔良王朝在1830年至1848年间由路易·菲利普统治。奥尔良派认为，西班牙波旁王朝通过放弃法国国籍和入籍国外而丧失了其法国王位继承权，因此巴黎伯爵是合法的王位继承人。这一传统属于君主立宪制而非专制，这使得它一直以来都更容易被共和制的法国所接受。"
 RAJ.Autocracy: "£generic_Autocracy_small (CPI-毛派) - 印度共产党-毛派"
 RAJ.Autocracy_icon: "£generic_Autocracy_small"
 RAJ.Autocracy_desc: "（毛主义） - 印度共产党（毛派）\n\n印度共产党（毛主义）于2004年由人民战争集团和毛主义共产主义中心合并而成，将纳萨尔派叛乱活动统一在一个指挥之下。该组织在从贾坎德邦和恰蒂斯加尔邦延伸至安得拉邦的红色走廊森林密布的部落地区发动旷日持久的人民战争，并通过向承包商和采矿作业征税来筹集资金。在其控制区内，该组织设立平行法庭，重新分配土地，并彻底拒绝选举。印度已将其列为恐怖组织，并自2009年以来一直使用中央准军事部队与其作战。"
 RAJ.Mod_Vilayat_e_Faqih: "£generic_Mod_Vilayat_e_Faqih_small (AISPLB) - 全印度什叶派个人法委员会"
 RAJ.Mod_Vilayat_e_Faqih_icon: "£generic_Mod_Vilayat_e_Faqih_small"
 RAJ.Mod_Vilayat_e_Faqih_desc: "（温和什叶派教士主义） - 全印度什叶派个人法委员会\n\n全印什叶派个人法委员会于2005年在勒克瑙成立，由什叶派神职人员组成，他们认为全印穆斯林个人法委员会只代表逊尼派法理。该委员会负责将十二伊玛目派关于婚姻、继承和什叶派少数群体财产捐赠的教规编纂成法典，并就穆哈兰姆月游行和瓦克夫管理等事宜与政府进行谈判。其领导层在印度宪政框架内运作，并在阿约提亚争端问题上采取了与逊尼派机构截然不同的立场。"
 RAJ.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small (MUH) - 印度神职人员理事会"
 RAJ.Vilayat_e_Faqih_icon: "£generic_Vilayat_e_Faqih_small"
 RAJ.Vilayat_e_Faqih_desc: "（霍梅尼主义） - 印度神职人员理事会\n\n印度神职人员理事会是一个以孟买和勒克瑙为中心的什叶派宗教机构，其高级成员曾在库姆和纳杰夫的神学院接受培训。该机构在北方邦和马哈拉施特拉邦管理神学院、慈善信托基金和穆哈兰月庆祝活动，并遵循伊朗宗教权威的指示。其在巴勒斯坦和海湾君主国问题上的立场与德黑兰密切相关，这引起了官方对其资金来源的审查。"
 RAJ.Kingdom: "£generic_Kingdom_small (MJAH) - 印度圣训派中央协会"
 RAJ.Kingdom_icon: "£generic_Kingdom_small"
 RAJ.Kingdom_desc: "（静默萨拉菲主义） - 印度圣训派中央协会\n\n成立于1906年的印度圣训派中央协会是印度最大的萨拉菲组织，其清真寺、伊斯兰学校和出版社网络主要集中在北方邦、比哈尔邦和克什米尔地区。该组织奉行字面解读经文的教义，拒绝接受伊斯兰教四大教法学派，并谴责南亚伊斯兰教中常见的圣地崇拜。其领导层宣扬服从既定权威，并反对武装圣战，这使其得以合法存在，但其机构接受海湾国家资助一事仍引发政治争议。"
 RAJ.oligarchism: "£generic_oligarchism_small (BC) - 孟买俱乐部"
 RAJ.oligarchism_icon: "£generic_oligarchism_small"
 RAJ.oligarchism_desc: "（裙带资本主义） - 孟买俱乐部\n\n“孟买俱乐部”指的是1993年一群印度实业家的聚会，他们向政府施压，要求在1991年经济自由化之后保护本国企业免受外国竞争。该俱乐部成员接受废除许可证制度，但条件是国内企业集团必须继续享有信贷、土地和监管方面的特权。此后，“孟买俱乐部”一词被用来指代大型商业集团对频谱拍卖、矿业租赁和国有银行贷款等领域的影响力。"
 PHI.socialism_icon: "£PHI_socialism"
 PHI.Western_Autocracy: "£PHI_western_autocracy (PFP)菲律宾联邦党"
 PHI.Western_Autocracy_icon: "£PHI_western_autocracy"
 PHI.Western_Autocracy_desc: "联邦主义 - 菲律宾联邦党\n\n这是一个由前总统罗德里戈·杜特尔特的盟友于2018年创立的现代政党，其主要目标是将菲律宾转变为联邦制国家。该党倡导以爱国联邦主义、人的尊严和社会平等为核心的纲领，同时强烈反对腐败、犯罪、毒品和叛乱。尽管菲律宾联邦党仍在构建超越其领导层的长期凝聚力，但它代表了当代菲律宾政治格局中联邦主义改革、民粹主义治理和联盟政治的融合。\n"
 PHI.Neutral_Libertarian_icon: "£PHI_neutral_libertarian"
 PHI.Nat_Populism_icon: "£PHI_Nat_Populism"
 PHI.Monarchist: "£PHI_monarchist (RHoS) 苏禄皇室"
 PHI.Monarchist_icon: "£PHI_monarchist"
 PHI.Monarchist_desc: "民族君主主义 - 苏禄皇室是苏禄摩洛苏丹国的王朝。该苏丹国在西班牙总督辖区建立之前就已存在，直至1915年美国殖民政府终结其政治权力。因此，其历史在20世纪的大部分时间里都已湮没无闻。根据前总统费迪南德·马科斯承认穆埃祖尔·莱尔·坦·基拉姆之父穆罕默德·马哈库塔·阿卜杜拉·基拉姆为苏丹的法令，当代苏禄王朝普遍承认穆埃祖尔·莱尔·坦·基拉姆为现代苏禄苏丹。尽管菲律宾政府不承认现任苏丹穆埃祖尔，但苏禄王朝是所有前殖民时期王国中最具合法性的。\n"
 BNG.conservatism: "£BNG_conservatism (BAPA) 邦萨摩洛党"
 BNG.conservatism_icon: "£BNG_conservatism"
 BNG.conservatism_desc: "摩洛保守主义 - 邦萨摩洛党\n\n邦萨摩洛党是摩洛民族解放阵线15人执行委员会的政党，由穆斯林·塞马领导。该党主张通过民主制度、议会参与和继续推进邦萨摩罗和平进程来推进邦萨摩罗的利益，而非再次发动武装斗争。它倡导在邦萨摩罗框架内实现摩洛人的自决。\n邦萨摩罗党支持和平的政治参与、区域自治、前摩洛革命团体之间的和解，以及为邦萨摩罗的穆斯林、基督徒和原住民提供包容性的治理。作为塞马领导的摩洛民族解放阵线派系的主要选举工具，它代表着前革命运动向宪政政治的过渡。\n"
 BNG.liberalism: "£BNG_liberalism (MAP) 我是摩洛人党"
 BNG.liberalism_icon: "£BNG_liberalism"
 BNG.liberalism_desc: "摩洛自由主义 - 我是摩洛人党\n\n我是摩洛人党是一个总部位于马拉维的地区政党，主张通过民主机构让邦萨摩洛人民更多地参与政治。该组织最初在2022年全国选举期间以OK党团的身份活跃，后来转变为棉兰老穆斯林邦萨摩洛自治区地区政党，获准参加邦萨摩洛议会选举。\n"
 BNG.socialism: "£BNG_socialism (RDP) 拉亚特民主党"
 BNG.socialism_icon: "£BNG_socialism"
 BNG.socialism_desc: "社会民主主义 - 拉亚特民主党\n\n拉亚特民主党，又称邦萨摩洛人民民主党，是一个总部位于巴西兰省拉米坦的地区性政党。该党成立于2020年，旨在通过议会民主和地区治理来代表邦萨摩洛社区的利益，并在邦萨摩洛议会中​​以比例代表制竞选席位。\n"
 BNG.Caliphate: "£generic_Caliphate_small (AS) 阿布沙耶夫"
 BNG.Caliphate_desc: "伊斯兰国家主义 - 阿布沙耶夫是一个信奉逊尼派伊斯兰教瓦哈比教义的摩洛族武装组织。该组织被认定为恐怖组织，主要在菲律宾群岛南部各省活动。他们的最终目标是建立一个脱离菲律宾联邦政府的独立摩洛省，并为摩洛族人建立一个原教旨主义伊斯兰政府。"
 BNG.Autocracy: "£BNG_autocracy (MILF) 摩洛伊斯兰解放阵线"
 BNG.Autocracy_icon: "£BNG_autocracy"
 BNG.Autocracy_desc: "伊斯兰民族主义 - 摩洛伊斯兰解放阵线\n\n摩洛伊斯兰解放阵线是菲律宾最大的摩洛革命运动。该组织从摩洛民族解放阵线分裂出来后成立，旨在通过一场以伊斯兰教为导向的政治运动，为邦萨摩洛人民争取自决权，强调摩洛身份认同、正义和自治。\n虽然联合邦萨摩洛正义党是其官方选举工具，但摩洛伊斯兰解放阵线本身仍然是该党获得合法性的更广泛的社会政治运动和历史组织。"
 BNG.Kingdom: "£generic_Kingdom_small (BIFF) 邦萨摩洛伊斯兰自由战士"
 BNG.Kingdom_icon: "£generic_Kingdom_small"
 BNG.Kingdom_desc: "萨拉菲圣战主义 - 邦萨摩洛伊斯兰自由战士是一个伊斯兰叛乱组织，由阿梅里尔·乌姆布拉·卡托于2008年脱离摩洛伊斯兰解放阵线后创立。邦萨摩洛伊斯兰自由战士拒绝接受摩洛伊斯兰解放阵线与菲律宾政府的和平谈判，主张继续进行武装斗争，争取在邦萨摩洛建立一个独立的伊斯兰国家，并认为自治远不足以实现真正的摩洛自决。\n该组织奉行强硬的伊斯兰教义，反对邦萨摩洛和平进程，并多次试图通过武装袭击破坏停火和政治和解。在其创始人去世后，该组织分裂成多个派系。"
 BNG.Neutral_Muslim_Brotherhood: "£BNG_Neutral_Muslim_Brotherhood (UBJP) 联合邦萨摩洛正义党"
 BNG.Neutral_Muslim_Brotherhood_icon: "£BNG_Neutral_Muslim_Brotherhood"
 BNG.Neutral_Muslim_Brotherhood_desc: "温和伊斯兰主义 - 联合邦萨摩洛正义党\n\n联合邦萨摩洛正义党是摩洛伊斯兰解放阵线的官方政党，成立于2014年，旨在推动该组织从武装斗争过渡到民主治理。该党不寻求通过武装冲突实现分裂，而是致力于通过选举、议会民主以及继续推进邦萨摩罗和平进程来实现邦萨摩洛自治。\n秉持伊斯兰民主、道德治理和社会正义的原则，联合邦萨摩洛正义党倡导负责任的领导、区域自治、包容性发展以及保护邦萨摩罗民族认同。该党植根于伊斯兰价值观，但反对暴力极端主义，并倡导和平的政治参与，认为这是实现自决的合法途径。\n作为摩洛伊斯兰解放阵线的政治分支，该党已成为邦萨摩洛自治区的主要政治力量之一，标志着该运动从革命阵线向宪政政治组织的转变。\n"
 BNG.Neutral_Autocracy: "£BNG_Neutral_Autocracy (SIAP) 包容性服务-进步联盟"
 BNG.Neutral_Autocracy_icon: "£BNG_Neutral_Autocracy"
 BNG.Neutral_Autocracy_desc: "发展区域主义 - 包容性服务-进步联盟\n\n包容性服务-进步联盟是一个起源于南拉瑙省的区域性政党，由参与邦萨摩洛和平进程的政治领袖和商人于2002年创立。该联盟最初是一个省级政治组织，后来扩展到整个邦萨摩洛自治区，倡导包容性公共服务、区域发展以及通过民主制度实现有效的本地治理。\n与阿迪昂政治家族关系密切的包容性服务-进步联盟强调务实的领导、政治稳定以及邦萨摩洛各社区之间的合作。该党不推行僵化的意识形态纲领，而是致力于加强区域治理、拓展经济机遇，并通过宪法途径支持邦萨摩洛和平进程的持续推进。\n"
 BNG.Neutral_conservatism: "£BNG_neutral_conservatism (PBP) 进步邦萨摩洛党"
 BNG.Neutral_conservatism_icon: "£BNG_neutral_conservatism"
 BNG.Neutral_conservatism_desc: "摩洛区域主义 - 进步邦萨摩洛党\n\n进步邦萨摩洛党是一个旨在参与邦萨摩洛议会民主的地区性政党。该党倡导加强民主制度，促进政治参与，并在邦萨摩洛自治区内建立稳定的多党制。与武装运动不同，该党自诩为致力于宪政治理和区域发展的公民政治组织。\n进步邦萨摩洛党致力于通过民主手段推动政治现代化、体制改革和有效的区域治理。虽然该党尚未发布全面的意识形态宣言，但其公开宣传强调邦萨摩洛的良好治理、负责任的领导以及加强议会政治。\n"
 BNG.oligarchism: "£BNG_oligarchism (联合)棉兰老岛达鲁萨兰国-邦萨摩洛之声"
 BNG.oligarchism_icon: "£BNG_oligarchism"
 BNG.oligarchism_desc: "部落政治 - 联合-邦萨摩洛之声\n\n它是邦萨摩洛穆斯林棉兰老自治区的一个区域性政党，由苏哈托·曼古达达图创立。该党倡导区域主义、加强地方治理，并通过民主制度推动邦萨摩洛的持续发展。它致力于代表邦萨摩洛各社区的利益，同时促进政治稳定和区域合作。\n该党与颇具影响力的曼古达达图政治家族关系密切，体现了地方政治世家在邦萨摩洛政治中根深蒂固的作用。与武装革命运动不同，联合-邦萨摩洛之声通过选举政治和联盟建设运作，强调务实的治理和区域领导。\n"
 BNG.neutral_Social: "£BNG_neutral_Social (BPP) 邦萨摩洛人民党"
 BNG.neutral_Social_icon: "£BNG_neutral_Social"
 BNG.neutral_Social_desc: "摩洛进步主义 - 邦萨摩洛人民党\n\n邦萨摩洛人民党是由前穆斯林棉兰老自治区区长穆吉夫·哈塔曼创立的区域性政党。该党旨在参与邦萨摩洛议会制度，并通过宪法和选举手段促进民主治理、负责任的领导和包容性的区域发展。\n邦萨摩洛人民党主张加强邦萨摩洛自治区内的民主制度，同时促进经济发展、社会包容和提供响应迅速的公共服务。该党并非源于革命组织，而是一个以议会治理、组建联盟和改善邦萨摩洛社区福祉为核心的公民政治运动。\n"
 BNG.Nat_Populism: "£BNG_Nat_Populism (MP) 自由党"
 BNG.Nat_Populism_icon: "£BNG_Nat_Populism"
 BNG.Nat_Populism_desc: "摩洛自决主义 - 自由党\n\n它是摩洛民族解放阵线努尔·米苏阿里派的官方政党。该党成立的目的是参加邦萨摩洛议会选举，旨在通过民主参与推进邦萨摩洛人民的愿望，同时坚持摩洛自决原则和执行以往的和平协议。"
 BNG.Nat_Fascism: "£BNG_Nat_Fascism (MNLF) 摩洛民族解放阵线"
 BNG.Nat_Fascism_icon: "£BNG_Nat_Fascism"
 BNG.Nat_Fascism_desc: "摩洛民族主义 - 摩洛民族解放阵线\n\n摩洛民族解放阵线是菲律宾历史最悠久、最具影响力的摩洛革命运动。该组织由努尔·米苏阿里于1972年创立，旨在倡导邦萨摩洛人民的自决权，最初寻求建立独立的邦萨摩洛国，后来通过与菲律宾政府达成一系列和平协议，争取区域自治。\n与后来强调政治伊斯兰的摩洛运动不同，摩洛民族解放阵线建立在摩洛民族主义原则之上，主张邦萨摩洛人是一个拥有共同历史、家园和政治认同的独特民族。尽管该运动代表穆斯林社群的利益，但其历史上一直将自身斗争定位为民族解放而非宗教革命。\n1996年《最终和平协议》签署后，摩洛民族解放阵线从以武装叛乱为主的组织转型为政治组织。如今，该组织内部仍存在分歧：一部分派系支持继续与邦萨摩洛和平进程合作，另一部分派系则主张在努尔·米苏阿里领导下更严格地执行原有的和平协议。"
 BNG.Monarchist: "£PHI_monarchist (RHoS) 苏禄皇室"
 BNG.Monarchist_icon: "£PHI_monarchist"
 BNG.Monarchist_desc: "民族君主主义 - 苏禄皇室是苏禄摩洛苏丹国的王朝。该苏丹国在西班牙总督辖区建立之前就已存在，直至1915年美国殖民政府终结其政治权力。因此，其历史在20世纪的大部分时间里都已湮没无闻。根据前总统费迪南德·马科斯承认穆埃祖尔·莱尔·坦·基拉姆之父穆罕默德·马哈库塔·阿卜杜拉·基拉姆为苏丹的法令，当代苏禄王朝普遍承认穆埃祖尔·莱尔·坦·基拉姆为现代苏禄苏丹。尽管菲律宾政府不承认现任苏丹穆埃祖尔，但苏禄王朝是所有前殖民时期王国中最具合法性的。\n"
 SAU.Western_Autocracy: "£generic_Western_Autocracy_small (HoH)哈希姆王室"
 SAU.Western_Autocracy_icon: "£generic_Western_Autocracy_small"
 SAU.Western_Autocracy_desc: "（君主立宪制） - 哈希姆王室\n\n哈希姆王室是麦加谢里夫的王朝，曾是圣城的守护者，直到1925年被伊本·沙特驱逐出汉志。他们的支持者寻求恢复谢里夫王朝的统治，但并非以绝对君主制的形式，而是以立宪君主制为基础，建立民选政府，就像他们在约旦的同胞那样。该运动亲西方且性情宽容，希望以议会制度取代瓦哈比派的严苛统治，建立一个以礼仪性王位为基础的君主制国家。"
 SAU.liberalism: "£generic_liberalism_small (NDA) 全国民主大会"
 SAU.liberalism_icon: "£generic_liberalism_small"
 SAU.liberalism_desc: "（自由民主主义） - 全国民主大会\n\n全国民主大会汇聚了长期以来一直呼吁沙特阿拉伯政府建立民选议会、制定成文宪法并实行法治的世俗自由派人士。其成员涵盖学者、律师以及在2011年抗议活动后被监禁的活动人士。该大会既反对神权统治，也反对军事独裁，力求建立一个保障公民自由、并通过选举对公民负责的议会制共和国。"
 SAU.socialism: "£generic_socialism_small (SSDP) 沙特社会民主党"
 SAU.socialism_icon: "£generic_socialism_small"
 SAU.socialism_desc: "（社会民主主义） - 沙特社会民主党\n\n沙特社会民主党起源于工会和改革派团体，他们一直呼吁在君主制下建立民选议会和福利国家。该党倡导混合经济、强有力的劳动保护以及由国家石油财富资助的普惠公共服务，并主张充分的公民自由和议会民主制。作为坚定的共和主义者，该党的立场介于自由派的全国民主大会和马克思主义左翼之间。"
 SAU.Neutral_Autocracy: "£generic_Neutral_Autocracy_small (TNC) 过渡国家委员会"
 SAU.Neutral_Autocracy_icon: "£generic_Neutral_Autocracy_small"
 SAU.Neutral_Autocracy_desc: "（独裁主义） - 过渡国家委员会\n\n沙特君主制垮台后，由官员、法学家和部落显贵组成的看守政权接管了政权。该政权以法令统治，不声称拥有永久授权，并承诺举行自由选举，将权力移交给阿拉伯共和国选择的任何政权。"
 SAU.Neutral_Communism: "£generic_Neutral_Communism_small (NLF)民族解放阵线"
 SAU.Neutral_Communism_icon: "£generic_Neutral_Communism_small"
 SAU.Neutral_Communism_desc: "（不结盟共产主义） - 民族解放阵线\n\n民族解放阵线成立于1958年，是由共产党人、阿拉伯民族主义者和工会成员组成的广泛的反君主制联盟。1975年，其强硬的马克思主义派系分裂出去，组建了沙特共产党。残余的民族解放阵线奉行不结盟路线，将社会主义与阿拉伯民族主义相结合，拒绝服从莫斯科或华盛顿。"
 SAU.neutral_Social: "£generic_neutral_Social_small (PSM) 民众团结运动"
 SAU.neutral_Social_icon: "£generic_neutral_Social_small"
 SAU.neutral_Social_desc: "（不结盟改革主义） - 民众团结运动\n\n民众团结运动源于2000年代的公民社会请愿和抗议网络，它聚集了对宗教界和既有政党意识形态都不信任的改革派人士。该运动在国内和国际上奉行务实、不结盟的路线，重视社会福利、反腐败措施和广泛的公民参与，而非任何僵化的教条。它获得了专业人士、学生和城市贫民的支持，这些人渴望在不诉诸革命的情况下实现变革。"
 SIA.Western_Autocracy_icon: "£SIA_Western_Autocracy"
 SIA.Neutral_Muslim_Brotherhood_icon: "£SIA_Neutral_Muslim_Brotherhood"
 SIA.Neutral_Autocracy_icon: "£SIA_Neutral_Autocracy"
 SIA.Neutral_conservatism_icon_1: "£SIA_Neutral_conservatism_1"
