 SOV_Anti_Air_0: "9K32 스트렐라-2"
 SOV_Anti_Air_0_desc: "냉전 때부터 설계가 시작된 네비게이션을 사용하여 미국 핵폭격기를 락온 할 수 있습니다. 가장 기본적인 방공수단으로 3700-4200m에 달하는 사거리를 가지고 있습니다."
 SOV_Anti_Air_1: "9K38 이글라"
 SOV_Anti_Air_1_desc: "스트렐라를 개량한 것으로 2004년 배치되었습니다. 두 개 파장의 적외선 유도 방식을 사용하여 스텔라보다 정확도가 높습니다."
 SOV_Anti_Air_2: "9K333 베르바"
 SOV_Anti_Air_3: "9K335 베르바-S"
 SOV_Anti_Air_4: "9K48"
 SOV_APC_1: "BTR-60"
 SOV_APC_1_desc: "BTR-60은 14.5mm KPVT 중기관총에 500발을 장착했습니다. 보조 무기는 7.62mm 패킷 동축 기관총으로 3,00발입니다. 경보병 이동 및 QRF에 적합합니다."
 SOV_APC_1_short: "BTR-60"
 SOV_APC_2: "MT-LB"
 SOV_APC_2_desc: "1970년대에 만들어진 장비입니다. 싸고 빠르게 만들어졌으며, 소형 대공화기나 대보병용으로 운용했습니다."
 SOV_APC_2_short: "MT-LB"
 SOV_APC_3: "BTR-70"
 SOV_APC_3_desc: "BTR-70은 1972년 소련-아프가니스탄 전쟁에서 군대를 이동시켜 화력을 지원하는데 사용되었습니다. BTR-60과의 유일한 차이점은 장갑이 더 무겁다는 점입니다."
 SOV_APC_3_short: "BTR-70"
 SOV_APC_4: "BTR-80"
 SOV_APC_4_desc: "BTR-80은 8륜 수륙양용 병력 수송 장갑차(APC)로 소련에서 개발되었습니다. 1986년 배치되기 시작하여 이전의 차량인 BTR-60, BTR70들을 대체하기 시작했습니다. 아프가니스탄전에서 처음 그 실력을 발휘했습니다."
 SOV_APC_4_short: "BTR-80"
 SOV_APC_5: "BTR-90"
 SOV_APC_5_desc: "테러리스트와 싸우기 위해 1994년에 생산되었습니다. 강력한 무기인 30mm 시퍼노브 2A42 포를 500발의 포탄과 함께 장착하고 있습니다."
 SOV_APC_5_short: "BTR-90"
 SOV_APC_6: "쿠르가네츠-25"
 SOV_APC_6_desc: "One of the more modern Russian vehicles the Kurganets-25 was made in 2015. Made as an IFV has a Bumerang-BM light cannon, with a 12.7mm Kord Machine gun. Modeled closely to the American Bradley IFV."
 SOV_APC_6_short: "쿠르가네츠-25"
 SOV_APC_7: "쿠르가네츠-35"
 SOV_APC_7_desc: "Much like the 25, which is primarily an IFV, the 35, an APC, can carry 12 men and do about the same as the 25 in IFV operations."
 SOV_APC_7_short: "쿠르가네츠-35"
 SOV_APC_8: "쿠르가네츠-45"
 SOV_APC_8_desc: "이 슈퍼 APC에 대해 많이 알려진 것은 없지만, 40mm 대포를 가지고 있고 12명의 사람을 태울 수 있습니다."
 SOV_APC_8_short: "쿠르가네츠-45"
 SOV_Heavy_Anti_tank_1: "9P133 Malyutka"
 SOV_Heavy_Anti_tank_1_desc: "Used in many wars and on many vehicles. The effective range is 500-3,000m."
 SOV_Heavy_Anti_tank_2: "9P148 Konkurs"
 SOV_Heavy_Anti_tank_3: "9P157 Khrizantema"
 SOV_Heavy_Anti_tank_4: "Kornet-DM"
 SOV_IFV_1: "BMP-1"
 SOV_IFV_1_desc: "BMP-1은 소련제 수륙양용 궤도형 보병 전투 차량입니다. 소련-아프가니스탄 전쟁에서 병력 수송 및 지하디스트와의 전투에 사용되었습니다. 73mm 2A28 주포와 대전차 미사일 발사기를 장착하고 있습니다."
 SOV_IFV_1_short: "BMP-1"
 SOV_IFV_2: "BTR-T"
 SOV_IFV_2_desc: "BMP-2는 지하드 주의자들이 가장 두려워 하던 차량으로 30mm 캐논과 캐터필러를 가져 굉장히 빠르고 효율적입니다."
 SOV_IFV_2_short: "BTR-T"
 SOV_IFV_3: "BMP-2M"
 SOV_IFV_3_short: "BMP-2M"
 SOV_IFV_4: "BMP-3"
 SOV_IFV_4_desc: "BMP-3는 소련의 보병 전투 차량(IFV)로 BMP-1과 BMP-2를 계승하는 차량입니다. 100mm 포로 고폭탄을 발사합니다."
 SOV_IFV_4_short: "BMP-3"
 SOV_IFV_5: "BMP-3M"
 SOV_IFV_5_desc: "BMP-3M은 소련의 보병 전투 차량(IFV)로 BMP-1과 BMP-2를 계승하는 차량인 동시에 BMP-3의 개량형입니다. 포와 엔진을 향상시켰습니다."
 SOV_IFV_5_short: "BMP-3M"
 SOV_IFV_6: "T-15 아르마타"
 SOV_IFV_6_desc: ""
 SOV_IFV_6_short: "T-15"
 SOV_IFV_7: "T-15M"
 SOV_IFV_7_short: "T-15M"
 SOV_IFV_8: "T-16"
 SOV_IFV_8_short: "T-16"
 SOV_Anti_tank_1: "RPG-7"
 SOV_Anti_tank_1_desc: "Used in many wars and on many vehicles."
 SOV_Anti_tank_2: "9K111 Fagot"
 SOV_Anti_tank_2_desc: "Much lighter than the other ATGM-systems, and older. This ATGM can only hit at 70-2,500 m which compared to others is much lesser range than the others but also cheaper."
 SOV_Anti_tank_3: "9M133M Kornet-M"
 SOV_Anti_tank_4: "9M134M Bulat-M"
 SOV_MBT_1: "T-55"
 SOV_MBT_1_desc: "T-54/55는 아마도 세계에서 가장 많이 생산된 전차일 것입니다. 냉전 초기에 설계되고 생산되었으며, 그것은 붉은 군대의 힘이자 중추였습니다. 한때 러시아 세력의 상징으로 여겨졌던 이 기갑부대는 미국의 공습으로 파괴되는 중동 기갑부대의 상징이 되었습니다."
 SOV_MBT_1_short: "T-55"
 SOV_MBT_2: "T-72"
 SOV_MBT_2_desc: "T-72는 아마도 러시아가 생산한 가장 성공적인 디자인일 것입니다. 그것은 냉전 말기 소련군의 정점이었고, 수천 대가 생산되었으며, 오늘날까지도 러시아군의 중추 역할을 하고 있습니다. 비록 중동 분쟁에서 치명적인 실패로 악명이 높았지만, T-72는 미래의 러시아 전차 설계를 위한 개발 플랫폼으로 여전히 사용되고 있으며 오늘날 현대전의 기준에 부합하도록 끊임없는 수정과 업그레이드가 이루어졌습니다. 한때 소련군의 창이었던 전차를 과소평가하지 마십시오."
 SOV_MBT_2_short: "T-72"
 SOV_MBT_3: "T-80"
 SOV_MBT_3_desc: "2백만달러의 전차이자 전장의 야수는 T-72와 같은 포를 사용하며 장갑을 증설하고 코프라 대전차 유도 미사일(ATGM)을 탑재하고 있습니다."
 SOV_MBT_3_short: "T-80"
 SOV_MBT_4: "T-90"
 SOV_MBT_4_desc: "3개의 포중 하나를 장착할 수 있습니다. 125mm 구경의 포를 사용합니다."
 SOV_MBT_4_short: "T-90"
 SOV_MBT_5: "T-14 아르마타"
 SOV_MBT_5_desc: "최신 기술이 집약된 러시아 육군의 전차로 매끄러운 외관과 강력한 152mm 야포를 탑재하고 있습니다."
 SOV_MBT_5_short: "T-14"
 SOV_MBT_7: "T-14M"
 SOV_MBT_7_short: "T-14M"
 SOV_MBT_8: "T-99 블랙이글"
 SOV_MBT_8_short: "T-99"
 SOV_Rec_tank_0: "PT-76"
 SOV_Rec_tank_0_desc: "이 초고속의 수륙양용 경전차는 강이나, 험지를 건너가서 적을 기습할 수 있습니다. 76.2mm 56T 포가 탑재되어 있습니다."
 SOV_Rec_tank_0_short: "PT-76"
 SOV_Rec_tank_1: "2S25 Sprut-SD"
 SOV_Rec_tank_1_desc: "자체 추진식 수륙양용 구축전차로, 이 차량은 적의 탱크에 몰래 접근하여 t-72-80이 운반하는 125mm 대포를 발사할 수 있습니다."
 SOV_Rec_tank_1_short: "2S25 Sprut-SD"
 SOV_Rec_tank_2: "2S25 스프룻-SD"
 SOV_Rec_tank_2_desc: "수륙양용 대전차 차량으로 적을 기습하여 사격을 가할 수 있습니다. T-72에서 T-80이 탑재하고 다니는 125mm 포를 탑재하고 있습니다."
 SOV_Rec_tank_2_short: "2S25 스프룻-SD"
 SOV_Rec_tank_3: "K-18 Bumerang"
 SOV_SP_Anti_Air_0: "ZSU-23-4 실카"
 SOV_SP_Anti_Air_1: "9K35 스트렐라-10"
 SOV_SP_Anti_Air_2: "2K22 퉁구스카"
 SOV_SP_Anti_Air_2_desc: "최대 8발의 미사일을 발사할 수 있는 이 기체는 접근하는 모든 항공기를 격추할 수 있습니다. 뿐만 아니라 자동포로 수송기도 파괴할 수 있습니다."
 SOV_SP_Anti_Air_3: "판치르-S1M"
 SOV_SP_Anti_Air_4: "판치르-S4L"
 SOV_SP_R_arty_0: "BM-21 그라드"
 SOV_SP_R_arty_0_desc: "현대전에는 많이 사용되지 않은 지대공 미사일(SAMS)와 다련장 로켓포(MLRS)는 주로 2차 대전과 아프가니스탄에서 사용되었습니다. 20km 거리의 목표물을 파괴하는데 효율적입니다."
 SOV_SP_R_arty_1: "BM-30 스메르치"
 SOV_SP_R_arty_1_desc: "이 차량은 그라드 전차의 현대화된 버전입니다. 눈, 얼음, 사막 등 세계 어디든 갈 수 있으며, 유효 사거리는 35km입니다."
 SOV_SP_R_arty_2: "9A52-4 토르나도"
 SOV_SP_R_arty_2_desc: "An extremely heavy artillery battery that if not dealt with, it can destroy entire cities. With a maximum range of 90km."
 SOV_SP_arty_0: "2S1 Gvozdika"
 SOV_SP_arty_0_desc: "The 2S1 Gvozdika is a Soviet self-propelled howitzer based on the MT-LBu multi-purpose chassis, mounting a 122 mm 2A18 howitzer. \"2S1\" is its GRAU designation. An alternative Russian designation is SAU-122 but in the Russian Army it is commonly known as Gvozdika."
 SOV_SP_arty_1: "2S3 아카치야"
 SOV_SP_arty_1_desc: "필요하다면 태양도 쏠 수 있을 만큼 강력한 152.4mm D-22 대포로 무장한 이 포병대는 사거리가 50km에 달하는 놀라운 화력을 자랑합니다."
 SOV_SP_arty_2: "2S19M2 므스타-S"
 SOV_SP_arty_2_desc: "The 2S19 Msta-S was developed towards the end of the Cold War, incorporating new technologies and boasting an increased range compared to its predecessor."
 SOV_SP_arty_3: "2S35 코알리치야-SV"
 SOV_SP_arty_3_desc: "The 2S35 is a true 21st century artillery platform with widespread automation, automatic shell type selection and unified command-and-control systems."
 SOV_SP_arty_4: "2S38 코알리치야-M"
 SOV_artillery_1: "D-30"
