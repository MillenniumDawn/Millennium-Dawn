 PMR_russia_moldovian_way: "최고회의"
 PMR_russia_moldovian_way_desc: "\n\n\n\n\n\n£PMR_desctext_rusmlv \n\n\n\n\n\n\n\n\nThe Supreme Council of the Pridnestrovian Moldavian Republic is, according to the Constitution of the Pridnestrovian Moldavian Republic, the representative and only legislative body of state power of the unrecognized Pridnestrovian Moldavian Republic."
 PMR_moldova_refendum: "[MLV.GetFlag]§Y몰도바§! 가입에 대한 국민투표를 실시하세요!"
 PMR_russia_refendum: "[SOV.GetFlag]§Y러시아§! 가입에 대한 국민투표를 실시하세요!"
 PMR_kazaks_prepare: "흑해 카자크군"
 PMR_kazaks_prepare_desc: "\n\n\n\n\n\n£PMR_desctext_kazaki \n\n\n\n\n\n\n\n\n§YOrigins§! of the revival of the §YBlack Sea Cossack army§! originate in the history of the §GZaporozhye Cossacks§! and the §GZaporozhye Sich§!, §Rliquidated§! in 1775. Created at the end of 1787 from disparate groups of §GZaporozhian Cossacks§!, the §Y\"Army of Loyal Zaporozhian Cossacks\"§! became a reliable shield of [SOV.GetFlag]§YRussia§! in the south between the rivers Dniester and Bug, on lands, a significant part of which is now part of [PMR.GetFlag]§YTransnistria§!. §YThe Black Sea Cossacks§!, who were covered with the glory of victories in the [SOV.GetFlag][TUR.GetFlag]§RRussian-Turkish war§! of 1787-1791, were resettled by Decree of Empress Catherine II after the end of the war in 1792-1793 to the [KUB.GetFlag]§YKuban§!, where the §YBlack Sea Cossack Army§! continued to serve in the protection of the southern borders of [SOV.GetFlag]§YRussia§! until 1860, when it was merged with the §YCaucasian Line Army§! and became known as [KUB.GetFlag]§Ythe Kuban Cossack Army§!. Abrupt changes in the life of society in §Rthe Soviet Union§! and the looming threat to the integrity of the state caused in the late 80s a movement to revive §Ythe Cossacks§!, which throughout its centuries-old history has been a collector and a reliable shield of the §YFatherland§!. After more than half a century of oblivion and distortion of the essence of the §YCossacks§!, §Rrepression§! and §Rgenocide§!, the §YCossacks§! were once again talked about as an integral part of the history of the [SOV.GetFlag]§YRussian state§!. Now, in addition to the main army, [PMR.GetFlag]§YTransnistria§! also has the opportunity to mobilize §YCossack§! detachments for the §Rwar§!, which will become the support base of the army in the war against enemies"
 PMR_kazak_kamensk: "카멘시 지역의 코자키들을 §Y동원§!하기"
 PMR_kazak_ryibninsk: "리브니차 지구의 코자키들을 §Y동원§!하기"
 PMR_kazak_dubossar: "두버사리 지역의 코자키들을 §Y동원§!하다"
 PMR_kazak_slobodze: "슬로보제야 지역의 코자키들을 §Y동원§!하기"
 PMR_kazak_benderi: "벤데르의 코자키들을 §Y동원§!하기"
 PMR_smirnov_era: "스미르노프 시대"
 PMR_smirnov_era_desc: "이고르 스미르노프. 우리의 위대한 국가의 진정한 아이콘. 그는 우리에게 정해진 조국을 위해 봉사하고 있습니다. 우리는 그가 우리가 마땅히 받아야 할 아름다운 미래로 이끌어줄 것이라 믿습니다. 이 영웅은 우리가 여기에 존재하는 이유입니다. 스미르노프는 우리를 하나로 묶고 단일 목표에 집중하게 만드는 접착제입니다. 그가 없었다면 이 국가는 존재하지 않았을 것입니다. 우리는 소련의 마지막 진정한 공산주의 요새입니다."
 PMR_economy: "트란스니스트리아의 경제"
 PMR_economy_desc: "The Transnistrian economy is insufficient and flawed. To support our growing country and military, we must build a robust economy to sustain it. But the question is, how. Will we continue on the route of contraband, or will we find another path for our future? "
 PMR_father_of_the_nation: "우리 민족의 아버지"
 PMR_father_of_the_nation_desc: "이고르 스미르노프는 분명 우리 나라를 만든 사람입니다. 그 덕분에 우리 민족이 원칙적으로 존재할 수 있었습니다. 독립을 위한 투쟁 당시 우리를 이끌었던 사람도 바로 그였습니다."
 PMR_denomination: "Hold a Redenomination"
 PMR_denomination_desc: "Our currency has grown to such astronomical figures that it is physically impossible for our citizens to buy enough goods, so we will carry out an urgent redenomination."
 PMR_privatization: "민영화"
 PMR_privatization_desc: "우리는 기업의 민영화를 추진할 것이고, 더 이상 국가가 전면적으로 통제하지 않을 것입니다."
 PMR_internet: "인터넷 개발"
 PMR_internet_desc: "우리는 우리 나라에서 인터넷 네트워크 개발을 시작할 것입니다. 그러나 이 분야에서 즉시 검열 권리를 강화하는 것이 필요합니다."
 PMR_interrao: "인터라오"
 PMR_interrao_desc: "러시아 회사 인터 라오(Inter Rao)는 우리 수력 발전소를 인수하고, 이를 현대화하기 위해 상당한 자금을 투자하려고 합니다."
 PMR_railway: "인프라 복구"
 PMR_railway_desc: "몰도바와의 전쟁의 결과는 여전히 느껴지고 있습니다. 우리의 인프라는 아직 복구되지 않았습니다. 이제 고칠 때입니다."
 PMR_anti_opposition: "반대파 탄압"
 PMR_anti_opposition_desc: "우리나라에서의 반대 활동은 다른 나라들처럼 공개적으로는 아니더라도 적극적으로 탄압될 것입니다. 하지만 우리는 우리나라가 흔들리는 것을 허용하지 않을 것입니다."
 PMR_media: "TV에서의 검열"
 PMR_media_desc: "우리는 텔레비전을 통제해야 합니다. 우리는 반대 인사가 텔레비전에서 연설하는 것을 허용하지 않을 것입니다."
 PMR_imprison: "공격적인 반대자들에 대한 탄압"
 PMR_imprison_desc: "일부 반대파는 말 그대로 우리에게 몰로토프 칵테일을 던질 준비가 되어 있습니다. 우리는 그들을 감옥에 보낼 것입니다."
 PMR_dictatorship: "트란스니스트리아 독재"
 PMR_dictatorship_desc: "그들은 우리를 독재자라고 부를 것이고, 우리 정권은 독재 정권이 될 것이지만, 우리 국민은 편안히 잠들 것입니다."
 PMR_krasno: "바딤 크라스노셀스키"
 PMR_krasno_desc: "바딤 니콜라예비치 크라스노셀스키는 프리드네스트로비아의 정치인, 국가 지도자이자 내무부의 인물입니다. 그는 프리드네스트로비아 몰도바 공화국 최고 의회의 의장이며, 민병대 소장입니다."
 PMR_military_reform: "군제개혁"
 PMR_military_reform_desc: "우리 군대에는 군제 개혁이 필요합니다. 우리는 기술적, 전투 장비 면에서 이웃 나라들보다 분명히 뒤처져 있습니다."
 PMR_russian_flag: "러시아 국기를 두번째로"
 PMR_russian_flag_desc: "우리는 러시아 국기를 두 번째 국가 기기로 채택하여, 우리의 궁극적인 목표인 러시아와의 통합을 즉시 나타낼 것입니다."
 PMR_romanovs: "로마노프 가문의 숭배"
 PMR_romanovs_desc: "로마노프 가문의 비극은 전 러시아 제국의 모든 국가의 비극이며, 우리는 그들의 기억을 기릴 것입니다."
 PMR_soc_ref: "Reforming Our Care"
 PMR_soc_ref_desc: "우리의 새로운 사회 개혁은 주로 장애인 시민을 대상으로 하며, 우리는 그들이 사회에 완전히 통합되는 데 필요한 모든 것을 제공할 것입니다."
 PMR_cis_2: "독립국가연합과의 협력"
 PMR_cis_2_desc: "우리는 독립국가연합의 국가들과 우호적인 관계를 계속 강화해 나갈 것입니다. 그들은 누구보다도 우리의 정치적, 경제적 상황을 잘 알고 있습니다."
 PMR_deccomus: "비공산화 시작"
 PMR_deccomus_desc: "우리는 러시아 제국 당시의 도시와 마을의 실제 이름을 되찾기 위해 노력할 것입니다."
 PMR_free_internet: "A Free Net"
 PMR_free_internet_desc: "인터넷은 검열로부터 자유로워야 합니다. 독재 정권은 사람들이 어떻게 생각하는지 결정해서는 안 됩니다."
 PMR_orthodoxy: "정교회 지원"
 PMR_orthodoxy_desc: "우리는 우리 나라에서 정교회를 적극적으로 지원할 것입니다. 왜냐하면 그것이 우리의 정신적 기초이기 때문입니다."
 PMR_lgbt: "전통 가족을 위한 투쟁"
 PMR_lgbt_desc: "우리 나라에는 LGBT 가치가 필요 없습니다. 오직 러시아 제국의 가문만이 크고 친절할 뿐입니다."
 PMR_arms: "Allow The Free Carrying Of Weapons"
 PMR_arms_desc: "Bandits can get weapons in any way; why don't we give citizens the opportunity to defend themselves?"
 PMR_continues: "방향을 바꾸지 않고"
 PMR_continues_desc: "우리는 우리의 길을 계속 따라갈 것이고 그것을 바꾸지 않을 것입니다. 트란스니스트리아에는 급진적인 정치적 변화가 필요하지 않습니다."
 PMR_tourism: "관광개발"
 PMR_tourism_desc: "우리는 관광 부문을 개발해야 합니다. 우리 지역은 매력적이고 관광객들이 분명히 관심을 가질 것입니다."
 PMR_hate_mlv: "몰도바에 대한 비판"
 PMR_hate_mlv_desc: "우리는 확고하고 분명하게 말합니다. 우리의 길은 몰도바와 오랫동안 갈라져 있었습니다."
 PMR_vs_pmr: "트란스니스트리아 군대"
 PMR_vs_pmr_desc: "이처럼 작고 공인받지 못한 국가가 자체 군대를 보유하고 있다 하더라도, 우리는 독립에 대한 위협을 물리치기 위해 군대를 강화해야 합니다."
 PMR_ground: "The Armed Forces of Transnistria"
 PMR_ground_desc: "The Armed Forces of the Pridnestrovian Moldavian Republic, the armed forces of the unrecognized Pridnestrovian Moldavian Republic (PMR), were established on September 6, 1991 to protect the people, sovereignty, independence, and territorial integrity of the PMR."
 PMR_suvorov_academy: "국방부 군사연구소"
 PMR_suvorov_academy_desc: "우리는 국방부 산하 군사대학을 통해 군대의 장교를 정기적으로 보충해야 합니다."
 PMR_exer: "러시아군과의 군사훈련"
 PMR_exer_desc: "러시아군은 현대의 전투 경험을 전수하기 위해 우리 군대와 함께 정기적인 훈련을 할 준비가 되어 있습니다."
 PMR_upgrade: "군장비 개선"
 PMR_upgrade_desc: "우리는 독립 전쟁 이후로 군대의 장비를 현대화하지 않았기 때문에 이제 군대의 장비를 현대화할 준비가 되었습니다."
 PMR_chechen: "체첸 전쟁의 경험"
 PMR_chechen_desc: "러시아는 이치케리야 공화국과의 전쟁 경험을 공유할 준비가 되어 있습니다. 이는 우리에게 없어서는 안 될 정보와 경험입니다."
 PMR_military: "군수산업"
 PMR_military_desc: "우리는 창고에 있는 재고품이 영원히 지속되기를 바랄 것이 아니라, 무기 생산을 확립하는 것이 필요합니다."
 PMR_new_army: "트란스니스트리아의 새국군"
 PMR_new_army_desc: "우리의 개혁은 성과를 냈고, 우리 군대의 이미지가 바뀌었습니다."
 PMR_spec: "특수부대의 교리"
 PMR_spec_desc: "We will focus on our special forces to conduct combat operations against a conditional enemy."
 PMR_doctrine: "외교 정책 교리"
 PMR_doctrine_desc: "Such small states need to be always ready for an attack by larger neighbors, but we must be clearly aware of who will attack us?"
 PMR_iskander: "러시아 아즈칸데르 미사일 요청"
 PMR_iskander_desc: "러시아의 이스칸데르 미사일 시스템은 우리를 공격하는 것에 대한 훌륭한 억제력이 될 수 있습니다."
 PMR_euiqp: "러시아 무기 구매"
 PMR_euiqp_desc: "우리는 지상군을 업그레이드하기 위해 러시아에서 대량의 무기를 구매할 것입니다."
 PMR_air: "트란스니스트리아 공군"
 PMR_air_desc: "우리의 공군은 사실상 존재하지 않습니다. 우리 조국의 영공 국경을 보호하기 위해 최소한의 공군 함대를 만드는 것이 필요합니다."
 PMR_air_academy: "공군사관학교"
 PMR_air_academy_desc: "미래의 조종사들은 국내에서 훈련을 받아야 하며, 우리는 이를 위해 특별 아카데미를 만들 것입니다."
 PMR_instructors: "러시아 강사"
 PMR_instructors_desc: "우리의 미래 조종사들은 러시아 조종사의 지도를 받게 될 것입니다."
 PMR_vvs_rf: "러시아 공군과의 협력"
 PMR_vvs_rf_desc: "우리는 러시아 공군과의 협력을 최대한 확대할 것입니다."
 PMR_kazaks: "키자크 연대를 전투에 투입하다"
 PMR_kazaks_desc: "지난 세기 말부터 흑해 키자크 군이 우리 군대의 대열에 창설되었습니다. 이제 전쟁이 우리 문앞에 다가왔으므로, 그들은 전쟁에 나가야 합니다."
 PMR_shevchuk: "트란스니스트리아의 두 번째 대통령"
 PMR_shevchuk_desc: "The time has come for changes; now a new president will become the head of Transnistria. Who will lead us into a bright future, or maybe not?"
 PMR_anti_smirnov: "스미르노프에 대한 정치적 캠페인"
 PMR_anti_smirnov_desc: "Igor Smirnov has done a lot for the establishment of Transnistria as an independent state, but unfortunately, in recent years, he has already harmed the state more than he helped it. We will fight against his influence."
 PMR_prepare_for_russia: "러시아와의 통합 준비"
 PMR_prepare_for_russia_desc: "우리는 전임자의 친러시아 노선을 계속 이어 가며, 우리 법률을 러시아 법률과 통합하기 위한 준비에 관한 포고령을 발표할 것입니다."
 PMR_against_sheriff: "셰리프에 맞선 투쟁"
 PMR_against_sheriff_desc: "우리는 이 지주회사의 영향력에 맞서 싸울 것이며, 우리 공화국은 자유로워질 것입니다."
 PMR_mlv: "몰도바와의 관계 수립 시도"
 PMR_mlv_desc: "우리는 몰도바와 관계를 수립하고자 노력할 것입니다. 어쩌면 양국을 통합하는 방안까지 제안할 수 있을지도 모릅니다."
 PMR_pro_ukraine: "우크라이나로 가는 길"
 PMR_pro_ukraine_desc: "우리는 우리의 역사적 고향이 우크라이나라고 여기며, 우크라이나 가입을 위해 노력할 것입니다.."
 PMR_propaganda: "친우크라이나 선전"
 PMR_propaganda_desc: "우리는 우리 미디어 영역에서 친우크라이나 선전을 적극적으로 방송할 것입니다."
 PMR_contacts: "우크라이나 정부와의 접촉"
 PMR_contacts_desc: "우리는 우크라이나 정부와 접촉을 수립하고 그들의 나라에 통합되고자 하는 우리의 뜻을 알릴 것입니다."
 PMR_ref_join_ukr: "우크라이나 가입 국민투표"
 PMR_ref_join_ukr_desc: "우리는 우크라이나의 일부가 되고자 하는 우리의 뜻을 선언할 준비가 되었습니다."
 PMR_sheriff_pmc: "자체 민간 군사 기업 창설"
 PMR_sheriff_pmc_desc: "우리는 자체 민간 군사 기업을 창설할 준비가 되어 있습니다."
 PMR_sheriff_state: "국가는 기업이다"
 PMR_sheriff_state_desc: "우리는 위대한 계획을 완수했습니다."
 PMR_indust: "국내 중심 유지"
 PMR_indust_desc: "우리는 산업이 나아갈 방향을 결정해야 합니다."
 PMR_agro: "루스타스 유한회사"
 PMR_agro_desc: "우리나라가 작더라도 우리는 농업 산업을 발전시킬 것입니다."
 PMR_civil: "민간 산업"
 PMR_civil_desc: "우리 시민의 고용을 위해 새 공장이 필요합니다."
 PMR_sell_weapon: "무기 재고 매각"
 PMR_sell_weapon_desc: "소련 시절부터 남아 있는 우리 창고에는 많은 무기가 보관되어 있습니다. 이를 통해 돈을 벌 때입니다."
 PMR_new_legistation: "새로운 투자 규범"
 PMR_new_legistation_desc: "우리는 투자 분야에 새로운 법률을 채택할 것이며, 이는 우리 경제에 새로운 투자자를 끌어들일 수 있습니다."
 PMR_ukr_invest: "우크라이나 투자"
 PMR_ukr_invest_desc: "우크라이나 기업 여러 곳이 우리 경제에 투자하고 싶다는 뜻을 밝혔습니다."
 PMR_ita_invest: "이탈리아 투자"
 PMR_ita_invest_desc: "이탈리아 기업 여러 곳이 우리 경제에 투자하고 싶다는 뜻을 밝혔습니다."
 PMR_ge_invest: "독일 투자"
 PMR_ge_invest_desc: "독일 기업 여러 곳이 우리 경제에 투자하고 싶다는 뜻을 밝혔습니다."
 PMR_path: "몰도바 통합"
 PMR_path_desc: "우리는 구 몰도바 영토를 우리 국가에 통합하는 작업을 시작할 것입니다."
 PMR_integr_economy: "경제 통합"
 PMR_integr_economy_desc: "우선 장차 통합될 우리 경제의 모든 측면을 규율하며 경제 통합을 수행해야 합니다."
 PMR_political: "정치 통합"
 PMR_political_desc: "새 국가의 구조 문제와 여러 정치 통합 문제도 해결되어야 합니다."
 PMR_true: "우리가 진정한 몰도바다"
 PMR_true_desc: "우리는 한때 몰다비아 소비에트 사회주의 공화국이 그랬던 것처럼 몰도바 국가의 역할을 맡습니다."
 PMR_integrate_mlv_place: "몰도바 영토 통합"
 PMR_integrate_mlv_place_desc: "우리는 한때 몰도바의 통치 아래 있던 영토에 대한 우리의 권리를 충분히 인정합니다. 이곳은 우리의 땅이며 앞으로도 영원히 그럴 것입니다. 우리는 이를 통합할 준비가 되어 있습니다."
 PMR_full: "단일 국가"
 PMR_full_desc: "우리는 단일제의 길을 따를 것이며, 자치는 우리에게 해가 될 수 있습니다."
 PMR_no_autonomy: "자치 불허 원칙"
 PMR_no_autonomy_desc: "자치의 부재는 분리주의가 없는 우리 국가의 보증입니다."
 PMR_const: "전통적 개혁"
 PMR_const_desc: "우리나라는 체제를 근본적으로 바꾸고자 하며, 그 출발점으로 가장 중요한 헌법 개혁부터 시작할 것입니다."
 PMR_mon_const: "왕의 정부"
 PMR_mon_const_desc: "개혁이 완료되었으며, 이제 트란스니스트리아가 입헌 군주국이 되었음을 선포할 준비가 되었습니다."
 PMR_opponents: "야당과의 투쟁"
 PMR_opponents_desc: "야당은 새로운 국가 체제에 명백히 불만을 품고 시위를 적극적으로 확대했습니다. 이에 대처해야 합니다."
 PMR_church: "교회는 국가 기관이다"
 PMR_church_desc: "우리는 러시아 제국의 관행으로 돌아가 교회의 옛 지위를 복원할 것입니다."
 PMR_not_soviet: "우리는 소련의 잔재가 아니다"
 PMR_not_soviet_desc: "트란스니스트리아는 러시아 제국의 일부이며, 우리는 이러한 이미지를 적극적으로 가꿀 것입니다. 소련의 잔재로 여겨지는 것은 우리에게 치욕입니다."
 PMR_general: "장군. 기독교인. 군주주의자"
 PMR_general_desc: "이것은 우리 지도자에게 내재한 자질이며, 모든 러시아 애국자가 갖추어야 할 자질입니다."
 PMR_drozdov: "의용군 부활"
 PMR_drozdov_desc: "의용군은 러시아 내전 중에 창설되었습니다. 의용군은 백군 운동의 이익을 수호했으며 진정한 애국자와 러시아 수호자의 군대였습니다. 우리는 의용군을 부활시켜 우리의 깃발 아래 이끌 것입니다"
 PMR_kornilov: "코르닐로프 연대 부활"
 PMR_kornilov_desc: "우리는 코르닐로프 연대의 전사자들을 기리고 우리 군 대열에서 이 연대를 부활시킬 것입니다."
 PMR_revive: "드로즈도프 연대 부활"
 PMR_revive_desc: "우리는 드로즈도프 연대의 전사자들을 기리고 우리 군 대열에서 이 연대를 부활시킬 것입니다."
 PMR_commi: "소비에트 재결합"
 PMR_commi_desc: "공산주의가 트란스니스트리아에 다시 돌아왔습니다. 공산주의자들이 다시 나라를 통치하게 될 것입니까?"
 PMR_single: "단일한 방향"
 PMR_single_desc: "트란스니스트리아 공산당은 국가와 관련된 모든 분야에서 가장 잘 알고 있습니다. 다른 사람들이 비켜 준다면 우리는 진정한 공산주의 유토피아를 건설하는 일에 착수할 수 있으며, 이번에는 성공할 것입니다."
 PMR_collectivism: "집단주의 수사 활용"
 PMR_collectivism_desc: "집단화는 이미 한 번 효과를 보았으므로 우리는 그 경험을 되풀이할 것입니다."
 PMR_pioneer: "피오네리아"
 PMR_pioneer_desc: "젊은이들이 한가롭게 지내서는 안 되므로 우리는 피오네르를 부활시킬 것입니다."
 PMR_marxism: "학교의 마르크스주의"
 PMR_marxism_desc: "학교 교육과정에는 반드시 마르크스가 포함될 것입니다."
 PMR_education: "자유로운 교육"
 PMR_education_desc: "교육은 우리의 영광스러운 국가의 모든 시민에게 무상이어야 합니다."
 PMR_atheism: "교회 분쇄"
 PMR_atheism_desc: "종교는 인민의 아편이므로 종교와 싸울 때입니다."
 PMR_fixe: "제1차 5개년 계획"
 PMR_fixe_desc: "서방 국가들의 자유 경제 모델은 사회주의 국가의 미래가 아닙니다. 계획경제, 가급적이면 고전적인 소비에트식 5개년 계획의 형태로 돌아가는 것은 지금까지 통제되지 않던 경제에 대해 정부에 무제한의 영향력을 줄 것입니다."
 PMR_workers: "노동자 지원"
 PMR_workers_desc: "노동계급은 우리의 지지 기반이자 힘이며, 우리는 자본주의의 전염에 맞선 투쟁에서 언제나 그들을 지원할 것입니다!"
 PMR_anti_nationalism: "야당과의 투쟁"
 PMR_anti_nationalism_desc: "공산주의로 향하는 우리의 길을 지연시키려는 파괴적 요소들에게 자비는 없다!"
 PMR_chinese_economic: "중국의 경제 경험"
 PMR_chinese_economic_desc: "우리는 중국의 경제 체제를 경제 정책의 토대로 삼을 것이며, 우리가 보기에 이는 전망이 밝습니다."
 PMR_national_industry: "산업에 대한 직접 개입"
 PMR_national_industry_desc: "우리는 우리 산업을 지원하고 발전시킬 것입니다. 우리나라에는 소련 붕괴 후 사라진 기업들을 대체할 새로운 기업이 필요합니다."
 PMR_mobilise: "집단 동원"
 PMR_mobilise_desc: "우리 군대에는 당이 요구하는 곳 어디서든 우리나라의 이익을 수호할 인원이 필요합니다."
 PMR_people_militia_desc: "우리는 영토 방위를 위한 일종의 예비대가 될 인민 민병대 창설에 관한 법률을 채택할 준비가 되어 있습니다. 모든 마을에는 적에 맞설 훈련된 인원 집단이 있어야 하며, 이후 빨치산 운동으로 전환될 것입니다."
 PMR_soc_dem: "트란스니스트리아 사회민주주의"
 PMR_soc_dem_desc: "악몽에서 깨어나듯, 트란스니스트리아 주민들은 아주 오래된 망상의 끝을 맞이하며 깨어날 것입니다. 이 유사 국가가 현재의 형태로 연장되는 일은 끝나고, 최고회의를 제대로 된 입법 기관으로 개편하는 일을 시작으로 정화 작업이 시작될 것입니다."
 PMR_liberalism: "새로운 국가 기구"
 PMR_liberalism_desc: "이제 개혁의 기반이 마련되었으므로, 연방제를 향한 우리 계획을 가능하게 할 헌법 개정을 신속히 추진할 임무를 띤 §Y재통합 위원회§!의 설립을 시작할 수 있습니다. 그동안 새 행정부에 참여하기를 기다리는 야당 몇 곳의 활동 금지를 해제할 수 있습니다."
 PMR_freedom: "표현의 자유"
 PMR_freedom_desc: "투표함을 둘러싼 우리의 역사는 깨끗하지 않았고, 이곳의 인권 상황도 마찬가지였습니다. 우리의 최우선 과제는 316-1조를 폐지하고 표현의 자유에 대한 다른 제한 몇 가지를 해제하는 것입니다. 지방 선거가 올바르게 치러지도록 국제 기구와 접촉하고, 앞으로의 공정성을 보장하기 위해 엄격한 감독을 받을 것입니다."
 PMR_rhetoric: "친몰도바 수사"
 PMR_rhetoric_desc: "몰도바는 우리와 한 뿌리의 일부이자 형제 국가입니다. 관계를 녹이고 이 문제를 방송을 통해 밀어붙이면 우리가 필요로 하는 대중의 지지를 얻을 수 있을 것입니다."
 PMR_new_society: "꽃피는 사회"
 PMR_new_society_desc: "우리 국가를 세계에 개방하는 움직임은 불가피하게 일부 사람들을 뒤처지게 하겠지만, 전환을 더 쉽게 만들 수 있습니다. 필요한 이들을 위해 언어 학습과 디지털 교육을 제공하도록 기관을 확대하면 불만 일부를 확실히 누그러뜨리고 예산에 약간의 현금도 마련할 수 있습니다."
 PMR_partnership: "몰도바와의 정치 통합"
 PMR_partnership_desc: "이제 우리의 교류가 결실을 맺었으므로, 통합을 빙빙 돌려 말하는 일을 멈추고 전환을 시작할 수 있습니다. 우리는 몰도바의 단일 법체계를 받아들이고 정부에 남은 분리주의적 요소를 해체하여, 정치적으로 가능한 한 가장 긴밀하게 정렬할 것입니다."
 PMR_deccomuniz: "탈공산화"
 PMR_deccomuniz_desc: "우리가 마지막으로 확인한 바로는 철의 장막이 무너지고 소련이 폐지된 지 십 년이 넘었습니다. 동상과 기념물은 향수를 달래는 역할보다 우리 새 지도부에 대한 당혹감으로 작용해 왔습니다. 새로운 문화를 심는 데 진전을 이루려면 시대가 바뀌어야 합니다."
 PMR_contact_eu: "유럽의 집"
 PMR_contact_eu_desc: "우리나라는 현재 국제적으로 승인받지 못했을지 모르지만 우리 시민들까지 같은 운명을 겪을 필요는 없습니다. 우리는 몰도바와 협력하여 우리 국민이 유럽 연합에 접근할 수 있는 통로를 확보하고, 그에 수반되는 모든 자유를 누리도록 하겠습니다."
 PMR_federation: "연방 프로젝트"
 PMR_federation_desc: "\n\n\n\n\n\n£PMR_desctext_federation \n\n\n\n\n\n\n\n\n몰도바와의 연방화를 위한 우리의 초안을 위원회에 제안할 때가 왔습니다. 요청이 통과되면 마지막 관문은 국민투표입니다. 우리가 대중을 충분히 설득했기를 바랄 뿐입니다."
 PMR_investors: "투자자 환영"
 PMR_investors_desc: "큰 정치적 격변이 있을 때마다 변화를 이용하려는 이들이 자연스럽게 몰려듭니다. 몇몇 주목할 만한 인물들이 한몫을 챙기려 문을 두드렸습니다. \n\n손을 내밀어 주었을 때 그 손을 잡는 것이 마땅합니다."
 PMR_it: "인터넷 도입"
 PMR_it_desc: "지금까지 우리가 사용해 온 인터넷 기반시설은 대부분 90년대 초에 설치된 것입니다. 그래서 디지털 텔레비전과 쓸 만한 속도 같이 대부분의 유럽 국가가 누려 온 기술적 혜택 상당수가 우리에게는 없습니다. 외부 IT 투자에 대한 제한을 해제하면 이것이 바뀔 것입니다."
 PMR_west_markets: "투자자 환영"
 PMR_west_markets_desc: "최근의 연결로 우리는 이전에 볼 수 없었던 유럽 시장에 접근하게 되었습니다. 어항에서 바다로 던져진 물고기처럼 우리는 기회의 세계에서 헤엄치고 있다고 해도 과언이 아닙니다. 이제 악수를 나누고 최고의 비즈니스 얼굴을 할 때입니다."
 PMR_just: "공화주의 트란스니스트리아"
 PMR_just_desc: "우리 당은 사회주의와 애국심의 이념을 대중에게 전파할 것입니다. 트란스니스트리아는 독립국이었고 앞으로도 독립국일 것입니다!"
 PMR_patriotism: "트란스니스트리아 국가방위군"
 PMR_patriotism_desc: "다른 나라들의 사례를 본받아, 우리는 다른 군 조직에서 반란 기운이 일어날 경우의 예비 수단이 될 자체 국가방위군을 창설하고자 합니다.."
 PMR_guarantees: "Guarantee The Societies"
 PMR_guarantees_desc: "우리 시민들은 안전하다고 느낄 수 있도록 필요한 모든 사회적 보장을 누려야 합니다."
 PMR_democracy: "민주주의 원칙"
 PMR_democracy_desc: "민주주의의 기본 원칙이 우리나라 영토에서 존중될 것이며, 전체주의와 독재는 과거의 일입니다!"
 PMR_health: "보건 최우선"
 PMR_health_desc: "우리나라의 보건 부문은 말 그대로 마지막 나날을 보내고 있었습니다. 이를 바로잡고 이 부문에 현금을 투입할 때입니다."
 PMR_economic: "경제 개혁"
 PMR_economic_desc: "트란스니스트리아의 이전 지도자들은 우리에게 약화되고 부패한 경제 체제를 남겼습니다. 우리는 개혁과 규제 완화를 추진해야 합니다."
 PMR_family: "가족이 가장 중요한 가치"
 PMR_family_desc: "가족 지원은 우리의 주요 사회 프로그램 중 하나가 될 것입니다. 우리는 훌륭하고 대가족을 이룰 새로운 세대를 길러 낼 것입니다."
 PMR_corruptable: "부패는 여기서 끝난다"
 PMR_corruptable_desc: "부패한 관리들은 처벌받을 것입니다!"
 PMR_indep: "정치적 독립"
 PMR_indep_desc: "우리나라는 마침내 스스로 무엇이 필요한지 결정해야 하며 내외의 어떤 세력에도 굴복해서는 안 됩니다."
 PMR_mvd_true: "내무부"
 PMR_mvd_true_desc: "이제 내무부의 우리 기관들이 진정으로 공화국의 이익을 위해 일할 수 있게 되었으므로, 우리는 이 부처에서 모든 부패한 관리를 제거할 것입니다."
 PMR_banner: "단결하고 강한 국민"
 PMR_banner_desc: "우리 국민은 독립과 행복한 미래를 위해 계속 싸울 준비가 되어 있습니다."
 PMR_lebedev: "우리는 티라스폴에서 아침을 먹을 것이다"
 PMR_lebedev_desc: "우리는 레베드 장군의 가르침을 따라 문제를 급진적이고 공격적으로 해결할 것입니다."
 PMR_kishenev: "우리는 키시너우에서 점심을 먹을 것이다"
 PMR_kishenev_desc: "몰도바는 무너져야 하며, 우리는 이런 이웃을 너무 오래 참아 왔습니다."
 PMR_odessa: "우리는 오데사에서 점심을 먹을 것이다"
 PMR_odessa_desc: "오데사는 우리가 흑해로 접근할 기회입니다. 우리는 그곳에 분견대를 보내 폭동을 일으키려 할 것입니다."
 PMR_buharest: "우리는 부쿠레슈티에서 저녁을 먹을 것이다"
 PMR_buharest_desc: "우리는 주적과의 최후 결전을 기다리고 있습니다."
 PMR_kiev: "우리는 키이우에서 저녁을 먹을 것이다"
 PMR_kiev_desc: "우리는 주적과의 최후 결전을 기다리고 있습니다."
 transnistria.5.t: "조기 선거"
 transnistria.5.d: ""
 transnistria.5.a: "예브게니 셰프추크"
 transnistria.5.b: "이고리 스미르노프"
 transnistria.5.c: "아나톨리 카민스키"
 transnistria.6.t: "레닌 동상의 실종"
 transnistria.6.d: "러시아 혁명가 블라디미르 레닌의 동상이 수도 티라스폴에서 불가사의하게 사라졌습니다. 동상을 찾기 위한 수색을 시작해야 합니까, 아니면 완전히 포기해야 합니까."
 transnistria.6.a: "수색을 시작하라"
 transnistria.6.b: "시간 낭비다"
 transnistria.7.t: "블라디미르 레닌의 부활"
 transnistria.7.d: "수색은 동상을 찾는 데 치명적인 것으로 드러났고, [PMR.GetLeader] 대통령은 집무실에서 사망한 채 발견되었으며, 그 자리에는 블라디미르 레닌의 동상이 대통령으로서 놓여 있었습니다. 이제 그는 러시아 혁명 당시처럼 우리의 위대한 국가를 이끌고자 합니다. "
 transnistria.7.a: "그리고 레닌은 다시 젊어졌다"
 transnistria.8.t: "트란스니스트리아의 미래"
 transnistria.8.d: "몰도바가 최근 루마니아와 통합하면서 우리 국가는 그 어느 때보다 거대한 세력과 마주한, 가장 중대한 기로에 서 있습니다. 우리의 전통을 지키려면 국가의 미래를 결정해야 합니다. 우선 국민 상당수는 주로 역사적, 문화적 유대를 이유로 러시아 연방과의 통합에 대해 큰 지지를 표명했습니다. 또 다른 제안은 이웃 우크라이나와의 통합을 요구하며, 러시아는 트란스니스트리아와 육로로 연결되어 있지 않고 우리가 우크라이나 국민과 많은 유사점을 공유하므로 그편이 더 나은 선택이라고 주장합니다. 마지막으로 또 다른 제안은 트란스니스트리아의 독립과 다문화주의를 유지하여, 1992년 트란스니스트리아 전쟁에서 우리가 지키고자 싸웠던 우리 국가와 가치가 외세에 넘어가지 않도록 하자고 요구합니다. 나라는 분열되어 있으며 하나의 선택이 우리에게 좋은 쪽으로든 나쁜 쪽으로든 영구적인 영향을 미칠 수 있습니다."
 transnistria.8.a: "우리는 러시아 형제자매들과 통합할 것이다!"
 transnistria.8.b: "우리는 우크라이나 형제자매들과 통합할 것이다!"
 transnistria.8.c: "우리는 독립을 유지할 것이다!"
 transnistria.9.t: "트란스니스트리아의 통합 요청"
 transnistria.9.d: "몰도바가 최근 루마니아와 통합한 뒤, 루마니아에 흡수될 것을 우려한 트란스니스트리아가 [ROOT.GetName]의 영토가 되기를 요청했습니다. 이는 지역에서 우리의 영향력을 확대하고 군사력을 과시할 절호의 기회이지만, 트란스니스트리아는 여전히 루마니아가 영유권을 주장하는 지역이며 우리가 이를 통합한다면 루마니아와 갈등을 빚을 수 있으므로 현명하게 선택해야 합니다."
 transnistria.9.a: "트란스니스트리아를 [ROOT.GetName](으)로 통합한다 "
 transnistria.9.b: "트란스니스트리아의 제안을 거절한다"
 transnistria.10.t: "[FROM.GetName] 승인"
 transnistria.10.d: "오늘 [FROM.GetName](이)가 우리의 통합 요청을 승인했으며, 원활한 이행을 위해 우리 행정부와 협력하는 과정에 있습니다."
 transnistria.10.a: "형제자매들과 하나가 되자!"
 transnistria.11.t: "[FROM.GetName] 거절"
 transnistria.11.d: "오늘 [FROM.GetName](이)가 우리의 통합 요청을 거절했으므로 트란스니스트리아는 홀로 헤쳐 나가야 합니다."
 transnistria.11.a: "놓친 기회"
 transnistria.12.t: "[FROM.GetName] 승인"
 transnistria.12.d: "오늘 [FROM.GetName](이)가 우리의 통합 요청을 승인했으며, 원활한 이행을 위해 우리 행정부와 협력하는 과정에 있습니다."
 transnistria.12.a: "형제자매들과 하나가 되자!"
 transnistria.14.t: "신규 공장"
 transnistria.14.d: "우리 경제가 발전하려면 공장이 필요합니다. 그 자금을 군사력 강화에 쓸 수도 있습니다. 민간 산업과 군수 산업 중 어느 쪽을 지원해야 합니까?"
 transnistria.14.a: "민간 공장을 건설한다."
 transnistria.14.b: "군수 공장을 건설한다."
 transnistria.15.t: "정비된 경제"
 transnistria.15.d: "경제가 성장하고 있습니다. 우리가 원하는 미래를 결정할 때입니다. 계속 경제를 성장시켜 지역 경제 강국이 될 수도 있고, 현재의 경제력을 활용해 대규모 군대를 건설할 수도 있습니다. "
 transnistria.15.a: "민간 중심의 미래가 최선이다."
 transnistria.15.b: "우리는 군사 중심의 미래를 원한다."
 transnistria.16.t: "러시아 가입 국민투표"
 transnistria.16.d: "트란스니스트리아가 우리나라 가입에 관한 또 한 번의 국민투표를 실시했으며 국민은 만장일치로 \\"찬성\\"에 투표했습니다. 우리는 그들의 기대에 부응하겠습니까, 아니면 거절하겠습니까?"
 transnistria.16.a: "찬성"
 transnistria.16.b: "안된다"
 transnistria.17.t: "우리나라로의 복귀를 원하는 트란스니스트리아"
 transnistria.17.d: "트란스니스트리아가 가입에 관한 국민투표를 실시했습니다. 다만 몰도바로의 복귀라고 부르는 편이 더 정확할 것입니다. 결과는 찬성으로 나왔으며, 이제 우리는 마침내 트란스니스트리아 분쟁을 해결할 수 있습니다."
 transnistria.17.a: "Transnistria is ours"
 transnistria.17.b: "We don't need them."
 transnistria.18.t: "트란스니스트리아의 군사 교리"
 transnistria.18.d: "우리나라는 두 불길 사이에 끼어 있으며, 우리의 군사 교리는 나라의 상황을 반영해야 합니다. 누구를 잠재적 적으로 간주하겠습니까?"
 transnistria.18.a: "루마니아"
 transnistria.18.b: "우크라이나"
 transnistria.19.t: "트란스니스트리아, 이스칸데르 제공을 요청"
 transnistria.19.d: "트란스니스트리아 정부는 자국 영토의 안보를 더욱 강화하기 위해 자국 영토에 이스칸데르를 배치하도록 제안해 왔습니다. 이처럼 위험한 조치에 동의하겠습니까?"
 transnistria.19.a: "찬성"
 transnistria.19.b: "안된다"
 transnistria.20.t: "오데사 봉기"
 transnistria.20.d: "오늘 아침 우리는 전혀 예상치 못한 불쾌한 소식을 접했습니다. 오데사에서 이른바 오데사 공화국의 독립이라는 구호 아래 분리주의 봉기가 일어난 것입니다. 더욱이 분리주의자들의 흔적은 곧장 트란스니스트리아로 이어집니다"
 transnistria.20.a: "WTF"
 transnistria.21.t: "가가우지아의 충성파"
 transnistria.21.d: "같은 이름의 공화국에서 가가우즈 반란을 일으키게 하면 몰도바를 더욱 약화시킬 수 있지만, 비용이 들며, 게다가 제때 그들을 지원할 수 있을지 확실히 알 수 없습니다."
 transnistria.21.a: "반란을 일으킨다"
 transnistria.21.b: "안된다"
 transnistria.22.t: "오데사를 우리에게 넘긴 우크라이나"
 transnistria.22.d: "우크라이나 정부는 적극적인 조치를 취하지 않았고 우리와의 대립에 들어가지도 않았으며, 이는 우리조차 놀라게 했습니다."
 transnistria.22.a: "이건... 좋은 소식인가?"
 transnistria.23.t: "대통령 겸 장군"
 transnistria.23.d: "우리 대통령은 스스로를 최고 총사령관으로도 선포하고, 필요하다면 우리나라의 군사 작전에 직접 참여하기 위해 군 지휘권을 장악했습니다"
 transnistria.23.a: "좋아"
 transnistria.24.t: "러시아 법률의 통합"
 transnistria.24.d: "우리는 러시아 법률을 우리 법률에 통합하기로 결정했으며, 이제 러시아와의 통일이 훨씬 쉬워질 것입니다... 물론 통일이 이루어진다면 말입니다."
 transnistria.24.a: "좋아"
 transnistria.25.t: ""
 transnistria.25.d: ""
 transnistria.25.a: "좋아"
 transnistria.26.t: "우크라이나 가입 국민투표"
 transnistria.26.d: "트란스니스트리아가 우리나라 가입에 관한 또 한 번의 국민투표를 실시했으며 국민은 만장일치로 \\"찬성\\"에 투표했습니다. 우리는 그들의 기대에 부응하겠습니까, 아니면 거절하겠습니까?"
 transnistria.26.a: "찬성"
 transnistria.26.b: "안된다"
 transnistria.28.t: "공동 군사 행동"
 transnistria.28.d: "오데사 공화국이 즉시 우리에게 군사 원조를 요청했습니다. 이제 우리 부대는 양국 영토에서 이동할 수 있습니다"
 transnistria.28.a: "니스"
 PMR_general_monarchist_christian: "장군 군주주의자 기독교인"
 PMR_use_kobasna: "§Y[PMR.GetFlag]트란스니스트리아§! 무기고 비우기"
 PMR_sheriff_starting: "셰리프 지주회사"
 PMR_sheriff_starting_desc: "\n\n\n\n\n\n£PMR_desctext_sheriff \n\n\n\n\n\n\n\n\n셰리프는 미승인 분리 국가 트란스니스트리아에서 몰도바 제철소에 이은 두 번째로 큰 기업입니다. 티라스폴 시에 기반을 두고 있으며 KGB 출신인 빅토르 구샨과 일리야 카즈말리가 1990년대 초에 설립했습니다. 셰리프는 이 미승인국에서 수익성 있는 거의 모든 형태의 민간 사업을 아우르는 규모로 성장했으며, 현지 정치와 스포츠에도 상당히 깊이 관여하게 되어, 일부 논평가들은 이 기업의 충성파가 이 영토의 주요 정부 직책 대부분을 차지하고 있다고 말합니다."
 PMR_sheriff_phones: "인테르드네스트르콤"
 PMR_sheriff_phones_desc: "인테르드네스트르콤은 트란스니스트리아에 이동통신 서비스를 제공하는 트란스니스트리아의 통신 회사입니다. 트란스니스트리아는 국제적으로 몰도바의 일부로 인정받는 미승인 분리 국가입니다. 1998년에 설립되었으며 휴대전화 서비스 외에도 전화 접속 및 ISDN 인터넷 접속을 제공합니다."
 PMR_sheriff_oil: "석유 제품 창고"
 PMR_sheriff_oil_desc: "셰리프는 연료 부문의 자립을 보장하기 위해 석유 제품 창고를 건설하고자 합니다."
 PMR_sheriff_kvint: "크빈트"
 PMR_sheriff_kvint_desc: "크빈트는 프리드니스트로비아의 수도이자 산업 중심지인 티라스폴에 기반을 둔 와인 양조 및 증류 회사입니다. 크빈트 제품은 '몰도바산'으로 인증됩니다. 1897년에 설립된 이 회사는 1938년에 브랜디 생산을 시작하기 전까지 보드카만 생산했으며, 이 지역에서 지금도 운영 중인 가장 오래된 상업 기업입니다. 현지인들은 크빈트를 국보이자 나라의 상징으로 여깁니다. 이 회사의 공장은 프리드니스트로비아 5루블 지폐에 그려져 있습니다. 크빈트는 러시아와 우크라이나는 물론 이탈리아와 중국에도 수출하는 프리드니스트로비아 최대 수출업체 중 하나입니다"
 PMR_sheriff_bank: "농공은행 폐쇄형 주식회사"
 PMR_sheriff_bank_desc: "이 지주회사는 트란스니스트리아 전역에서 금융 서비스를 제공할 자체 은행도 설립할 계획입니다"
 PMR_sheriff_tiroteks: "티로텍스"
 PMR_sheriff_tiroteks_desc: "티로텍스는 트란스니스트리아에 기반을 두고 의류 및 기타 섬유 제품을 생산하는 섬유 회사입니다. 티라스폴에 위치해 있습니다. 이 회사는 1972년 공장 건설과 함께 설립되었으며 공장 완공에는 십 년이 걸렸습니다. 독립국가연합 남서부에서 가장 큰 섬유 기업이며 유럽 전체에서 두 번째로 큰 규모라고도 주장합니다. 단지 안에는 직조, 재봉, 마감, 방적 공정이 있습니다. 수출 지향적 기업으로서 제품의 70%가 해외로 수출됩니다"
 PMR_sheriff_agro: "지주회사 농공업"
 PMR_sheriff_agro_desc: "이 지주회사는 복구와 가동 개시를 위해 농공업 공장 몇 곳을 추가로 인수할 계획입니다"
 PMR_rail_road: "트란스니스트리아 철도"
 PMR_rail_road_desc: "트란스니스트리아 철도는 트란스니스트리아의 철도 운영사입니다."
 PMR_airport_back: "티라스폴 공항"
 PMR_airport_back_desc: "우리는 티라스폴 공항의 재건을 완료하고, 필요하다면 민간 및 군사 목적 모두에 사용할 계획입니다."
 PMR_economy_category: "트란스니스트리아 경제"
 PMR_economy_category_desc: "트란스니스트리아는 자국 산업의 지분을 팔아 연명합니다. 외국 파트너가 떠나면 티라스폴은 그들의 지분을 되사서 공화국에 돌려놓을 수 있습니다."
 PMR_destroy_sheriff: "£text_icon_pmr_sheriff §2셰리프§!의 독점 §R파괴§!"
 PMR_control_economic_idea: "통제 경제"
 PMR_collectivism_idea: "집단주의"
 PMR_marxist_reeducation_idea: "교육 속의 마르크스주의"
 PMR_revoult_spirits_idea: "혁명 정신"
 PMR_interbrigade_idea: "국제여단"
 PMR_peacerota_idea: "평화유지 대대"
 PMR_grivna_efffect_idea: "우크라이나 법률 통합"
 PMR_the_rights_of_the_worker_idea: "노동자 권리 확대"
 PMR_annex_gagauzia: "§Y[GGZ.GetNameWithFlag]§! 통합"
 PMR_sheriff_based: "셰리프의 영향력 지원"
 PMR_sheriff_based_desc: "셰리프 지주회사의 독점이 부정적 결과를 낳고 있지만, 우리는 이들이 우리 공화국에 행사하는 영향력을 유지하고 보존하고자 합니다."
 PMR_anti_moldav_rhetoric: "반몰도바 수사"
 PMR_anti_moldav_rhetoric_desc: "몰도바와의 통일은 결코 이루어지지 않을 것이며, 우리는 이를 허용할 생각이 없습니다. 언론과 기타 주민 영향력 수단을 통해 이러한 입장을 적극 알릴 것입니다."
 PMR_referendums: "트란스니스트리아 지위에 관한 국민투표"
 PMR_referendums_desc: "우리는 트란스니스트리아의 지위에 관한 국민투표를 실시하여, 국민이 마침내 우리나라의 미래를 어떻게 보고 싶은지 직접 결정하게 하고자 합니다.."
 PMR_lebed_academy: "국방부 군사 대학"
 PMR_lebed_academy_desc: "티라스폴에 위치하며 트란스니스트리아 군대의 군사 부서가 운영하는 고등 군사 교육기관입니다. 군대 내에서 가장 높은 교육기관입니다."
 PMR_pograncy: "국경 수비대"
 PMR_economist_from_russia: "러시아에 경제 전문가 요청"
 PMR_economist_from_russia_desc: "우리는 러시아 중앙은행의 전문가들을 초청하여 우리 경제 개혁을 돕게 하고자 합니다."
 PMR_agriculture_from_russia: "농업 분야에 대한 러시아의 지원"
 PMR_agriculture_from_russia_desc: "러시아의 농공 복합체는 우리 발전에 큰 도움을 줄 수 있습니다. 우리는 그 전문가들을 우리나라로 초청하고자 합니다."
 PMR_expel_russian: "평화유지군 추방"
 PMR_expel_russian_desc: "이 문제에서 러시아와 우리의 길은 갈라졌으며, 이제 그들의 평화유지군이 우리나라를 떠날 때입니다."
 PMR_invite_ukrainians: "우크라이나 평화유지군 초청"
 PMR_invite_ukrainians_desc: "We intend to invite Ukrainian peacekeepers to defend against Moldovan aggression."
 PMR_ukr_corps: "우크라이나 기업 유치"
 PMR_ukr_corps_desc: "우리는 우크라이나 기업들이 우리 시장에 진출하도록 허용할 것이며, 이는 우리 경제에 긍정적인 영향을 미칠 것입니다"
 PMR_ukr_law: "우크라이나 법률로의 통합"
 PMR_ukr_law_desc: "우리는 장차의 통합을 위해 우리 법률을 우크라이나 법률과 일치시키고자 합니다"
 PMR_ukraine_influency_TT: "[UKR.GetFlag] 우크라이나의 §Y[ROOT.GetNameWithFlag]§! 내 §H영향력 배수§!: §R+15%§!"
 PMR_ukr_army: "우크라이나 평화유지군"
 PMR_kabardiners: "카라비니에리 부대"
 PMR_kabardiners_desc: "카라비니에리 부대는 트란스니스트리아의 국가 헌병대입니다. 트란스니스트리아 카라비니에리는 경찰과 함께 또는 독자적으로 공공질서와 시민의 권리 및 자유, 소유주의 재산을 보호하고 법 위반을 예방하는 임무를 맡습니다. 이 기관의 구조는 이탈리아 카라비니에리를 모델로 하며 이름도 거기서 따왔습니다."
 PMR_peace_keaper: "평화유지 대대"
 PMR_peace_keaper_desc: "우리는 국제 임무에 참여할 자체 평화유지 대대를 창설할 것입니다."
 PMR_commi_ideology: "이념 재편"
 PMR_commi_ideology_desc: "소비에트 시대 교육의 이념적 방법을 되살려 현대적인 방식으로 옮겨야 할 때입니다"
 PMR_commi_promka: "산업 부흥"
 PMR_commi_promka_desc: "트란스니스트리아의 산업은 날마다 서서히 죽어 가고 있으며, 이 부정적인 과정을 되돌릴 때입니다"
 PMR_army_corruptions: "무기 판매 중단"
 PMR_army_corruptions_desc: "우리는 코바스나 창고에서의 무기 판매를 중단하고, 무기를 이리저리 나눠 주는 일을 멈추려 합니다."
 PMR_clean_governments: "정부 정화"
 PMR_clean_governments_desc: "부패하고 파괴적인 모든 요소는 우리 정부에서 쫓겨날 것입니다"
 PMR_ded_sheriff: "셰리프 지주회사 종식"
 PMR_ded_sheriff_desc: "셰리프 지주회사는 너무 오랫동안 우리 공화국을 지배해 왔습니다! 이제 끝낼 때입니다"
 PMR_revoult_spirit: "혁명 정신"
 PMR_revoult_spirit_desc: "혁명의 정신이 트란스니스트리아를 행진하고 있으며 우리는 이를 이어 갈 것입니다"
 PMR_interbrigade: "국제여단"
 PMR_interbrigade_desc: "우리 병사들은 다른 나라에서 고통받는 시민들을 보호하는 국제적 의무에 참여할 준비가 되어 있습니다"
 PMR_anti_corrupt_company: "부패 척결"
 PMR_anti_corrupt_company_desc: "부패한 관리들이 트란스니스트리아에 설 자리는 없다!"
 PMR_new_chinush: "신세대 관료"
 PMR_new_chinush_desc: "우리는 자신의 지갑이 아니라 나라에 충성하는 새로운 세대의 공무원을 길러 낼 것입니다"
 PMR_new_five: "5개년 계획 지속"
 PMR_new_five_desc: "5개년 계획 체계는 소비에트 시대에 스스로 실패하지 않았으며, 우리는 이를 다시 활용하고자 합니다"
 PMR_red_army_pmr: "트란스니스트리아 붉은 군대"
 PMR_red_army_pmr_desc: "우리 국가에는 강력한 군대가 필요하며, 가장 강력한 군대는 붉은 군대입니다!"
 PMR_new_trans: "트란스니스트리아의 새로운 시대"
 PMR_new_trans_desc: ""
 PMR_chinese_economic_tt: "[CHI.GetFlag] 중국 §H영향력 배수§!: §R+15%§!"
 transnistria.29.t: "트란스니스트리아 지위에 관한 국민투표"
 transnistria.29.d: "우리는 국민투표를 실시했고, 그 결과 우리 국민은 계속 독립을 유지하겠다는 의사를 표명했으며, 우리는 이 권리를 그들에게서 빼앗을 생각이 없습니다! 트란스니스트리아는 계속 독립을 위해 싸울 것입니다"
 transnistria.29.a: "알았다"
 transnistria.30.t: "중앙은행 전문가의 지원"
 transnistria.30.d: "트란스니스트리아 당국이 경제 개혁을 돕기 위해 우리 중앙은행 전문가들을 요청하고 있습니다. 이는 트란스니스트리아의 경제 상태를 개선하고 지역에서 우리의 영향력을 강화할 절호의 기회가 될 것입니다"
 transnistria.30.a: "그들을 돕겠다"
 transnistria.30.b: "아니요"
 transnistria.31.t: "러시아 중앙은행 전문가"
 transnistria.31.d: "러시아 당국이 우리를 돕기로 합의하고 경제 개혁을 돕기 위해 중앙은행 전문가들을 파견하기로 했습니다"
 transnistria.31.a: "좋다"
 transnistria.32.t: "러시아 중앙은행 전문가"
 transnistria.32.d: "러시아 당국이 우리를 돕고 경제 개혁을 위해 중앙은행 전문가를 파견하는 것을 거절했습니다"
 transnistria.32.a: "안타깝다"
 transnistria.33.t: "농업 분야 지원"
 transnistria.33.d: "트란스니스트리아 정부가 우리의 농공 사업을 통해 농업 발전을 지원해 달라고 요청하고 있습니다. 우리는 이 거래로 틀림없이 이익을 얻고 지역에서 영향력을 키울 것입니다"
 transnistria.33.a: "그들을 돕겠다"
 transnistria.33.b: "아니요"
 transnistria.34.t: "러시아 농업 전문가"
 transnistria.34.d: "러시아 당국이 우리를 돕기로 합의하고 우리 농공 산업의 발전을 돕기 위해 전문가들을 파견하기로 했습니다"
 transnistria.34.a: "좋다"
 transnistria.35.t: "러시아 농업 전문가"
 transnistria.35.d: "러시아 당국이 우리를 돕고 우리 농공 산업의 발전을 위해 전문가를 파견하는 것을 거절했습니다"
 transnistria.35.a: "안타깝다"
 transnistria.36.t: "우리 평화유지군을 초청한 트란스니스트리아"
 transnistria.36.d: "트란스니스트리아 공화국 당국은 외교 정책의 방향을 급격히 바꾸어 이제 러시아의 후견을 포기하려 하며, 이미 러시아 평화유지군을 쫓아내고 우리를 부르고 있습니다. 개입해야 합니까?"
 transnistria.36.a: "그렇다"
 transnistria.36.b: "아니요"
 transnistria.37.t: "우크라이나 평화유지군"
 transnistria.37.d: "우크라이나 당국은 자국 평화유지군이 우리나라에 주둔하기를 바라는 우리의 요청에 긍정적으로 응답했으며, 그 부대가 즉시 우리 영토에 도착할 것입니다"
 transnistria.37.a: "알았다"
 transnistria.38.t: "우크라이나 평화유지군"
 transnistria.38.d: "우크라이나 당국은 우리나라에 평화유지군을 보내 달라는 요청에 부정적으로 응답했으며, 우리는 모든 것을 잃은 듯합니다"
 transnistria.38.a: "안타깝다"
 transnistria.39.t: "트란스니스트리아 내 우리 평화유지군"
 transnistria.39.d: "트란스니스트리아 정부는 우리가 예상치 못한 조치를 취하여, 우리가 평화유지군을 트란스니스트리아에서 즉시 철수시켜야 한다고 발표했습니다. 이는 이 지역에서의 우리 영향력을 위태롭게 합니다."
 transnistria.39.a: "안타깝다"
 transnistria.40.t: "러시아 가입 국민투표"
 transnistria.40.d: "러시아 정부가 공식적으로 우리를 구성원으로 받아들였습니다! 이제 우리 모두는 위대한 유산을 지닌 위대한 나라의 일부가 되었습니다."
 transnistria.40.a: "만세!"
 transnistria.41.t: "러시아 가입 국민투표"
 transnistria.41.d: "러시아 정부가 우리의 가입을 허용하는 것을 거절했습니다. 우리는 크게 슬퍼하며 훗날 그들이 마음을 바꾸기를 바랍니다."
 transnistria.41.a: "안타깝다"
 transnistria_news.1.t: "러시아의 일부가 된 트란스니스트리아"
 transnistria_news.1.d: "미승인국인 프리드니스트로비아 몰다비아 공화국 당국이 러시아 가입에 관한 국민투표를 실시했으며 다수가 찬성표를 던졌습니다. 러시아 정부는 이 국민투표 결과를 받아들이고 트란스니스트리아의 러시아 편입을 발표했습니다."
 transnistria_news.1.a: "흥미롭군."
 PMR_sheriff_finish: "셰리프 종결"
 PMR_vs_reform: "군대 개혁"
 PMR_vs_reform_desc: "우리 군대는 우리의 작은 공화국을 방어할 준비가 되어 있지 않으며, 이를 시급히 개혁해야 합니다."
 PMR_army_corruption: "무기 판매 중단"
 PMR_army_corruption_desc: "우리는 콜바스나야 창고에서의 무기 판매를 중단하고, 무기를 이리저리 나눠 주는 일을 멈추려 합니다."
 PMR_clean_government: "정부 정화"
 PMR_clean_government_desc: "관리들은 늘 자기 주머니만 생각할 뿐 나라는 생각조차 하지 않습니다. 우리는 이런 인물들을 공화국 지도부에서 평화롭게, 혹은 가혹하게 제거할 것입니다"
 PMR_return_zavods: "공장 부활"
 PMR_return_zavods_desc: "이 지역의 산업적 잠재력은 장님이 보아도 분명하지만, 안타깝게도 소련의 붕괴는 한때 아름다웠던 이 나라의 시민들이 세운 모든 것을 파괴했습니다. 우리는 이를 되살릴 것입니다"
 PMR_clean_corruption: "반부패 전쟁"
 PMR_clean_corruption_desc: "부패는 히드라와 같아서 머리 하나를 자르면 또 하나가 자라납니다. 우리는 이 부패한 히드라의 모든 머리를 한꺼번에 자를 것입니다"
 PMR_commies_goes_home: "열렬한 반공주의"
 PMR_commies_goes_home_desc: "공산주의 사상은 트란스니스트리아의 주된 현실이 되어서는 안 됩니다. 그것은 오래전부터 현실과 이곳 사람들의 삶의 방식에 맞지 않았습니다. 사람들은 과거가 아니라 오직 현재와 미래에 살아야 합니다!"
 PMR_support_nationalism: "민족주의 정서 지원"
 PMR_support_nationalism_desc: "민족주의가 항상 나쁜 것만은 아닙니다. 특히 이렇게 작은 지역의 주민들이 자신을 한때 거대하고 위대했던 제국의 일부로 여길 때는 그렇습니다. 우리는 이러한 민족주의 정서의 확산을 지원할 것입니다."
 PMR_reform_special_services: "정보기관 개혁"
 PMR_reform_special_services_desc: "특수 기관 역시 돈을 위해 모든 문제를 해결하려는 온갖 사기꾼과 아마추어로부터 정화되어야 합니다."
 PMR_militarize_society: "사회 군사화"
 PMR_militarize_society_desc: "우리 지역의 존립 자체를 건 전투의 시간이 다가오고 있으므로 모든 시민은 총을 들 준비가 되어 있어야 합니다! 우리는 우리나라에서 군국주의적 수사를 적극적으로 대중화할 것입니다."
 PMR_zapad_sosat: "반서방 정서"
 PMR_zapad_sosat_desc: "서방은 언제나 우리의 적이었고 앞으로도 그럴 것입니다. 우리는 그들이 언젠가 우리에게, 특히 유럽 연합의 일부가 되는 것에 맞서 싸우는 작은 지역인 우리에게 좋은 것을 원하리라는 헛된 환상 속에서 살 생각이 없습니다."
 PMR_transnistia_legion: "트란스니스트리아 군단"
 PMR_transnistia_legion_desc: "트란스니스트리아 군단은 한때 러시아 영토에서 실행될 예정이었던 프로젝트이지만, 안타깝게도 당시 당국이 완전히 가로막았습니다. 모든 특수 기관은 조국을 지킬 뿐 아니라 공개적으로나 비밀리에 국제 임무에도 참여할 특수 부대로 통합될 것입니다"
 PMR_militarize_young: "청년 군사화"
 PMR_militarize_young_desc: "전쟁이 나면 젊은이들은 자비를 구걸하는 대신 기관총을 들고 조국을 지킬 준비가 되어 있어야 합니다. 우리는 우리 아이들을 진정한 조국의 수호자로 만들 것입니다"
 PMR_ded_sheriffs: "셰리프 지주회사 종식"
 PMR_ded_sheriffs_desc: "셰리프 지주회사의 기업 권력은 마침내 끝날 것이며, 우리는 단번에 그들을 끝장낼 것입니다. 그들을 어떻게 다룰지는 그들 하기에 달렸습니다. 투옥과 처형 중 어느 쪽이 그들에게 더 낫겠습니까?"
 PMR_totalitarian_economic: "경제에 대한 권위주의적 통제"
 PMR_totalitarian_economic_desc: "우리 국가의 경제 영역은 우연에 맡겨져 있었지만, 이제 강력한 지도자의 통제 아래로 되돌릴 것입니다.."
 PMR_nationalize_burjui: "외국 기업 국유화"
 PMR_nationalize_burjui_desc: "외국인이 소유한 산업 공장은 언제나 경제 안보의 위험 요소입니다. 외국이 경제 제재로 우리를 위협하는 상황에서, 산업 소유주들이 하룻밤 사이에 떠나며 공장의 핵심 부품을 가져가 버리는 것은 늘 위협입니다. 이를 막으려면 외국 정부의 심기를 거스르더라도 이 산업들을 국가의 것으로 만들어야 합니다."
 PMR_vpk: "군수 공장 부활"
 PMR_vpk_desc: "우리 군대에는 무기가 필요하고, 이를 생산하려면 최소한의 군수 산업이라도 갖추어야 하며, 소련의 유산이 그와 유사한 여건을 조성할 수 있게 해 줍니다"
 PMR_defenced: "국경 강화"
 PMR_defenced_desc: "적은 어느 쪽에서든 우리가 약해지기를 기다렸다가 공격하려 합니다. 따라서 우리 국경은 양쪽 모두에서 강화되어야 합니다"
 PMR_kazaki_more: "카자크 의용병 수용"
 PMR_kazaki_more_desc: "이곳 정부가 더 애국적인 정부로 바뀐 이래 많은 카자크가 트란스니스트리아로 이주해 왔습니다. 우리는 이들로 새 대대를 편성할 준비까지 되어 있으며, 이는 앞으로의 전투에서 우리를 도울 것입니다."
 PMR_sheriff_mobilize: "전 셰리프 직원 동원"
 PMR_sheriff_mobilize_desc: "전직 셰리프 관계자들은 조국 앞에서 자신의 죄를 속죄해야 합니다. 군 복무는 그러한 속죄에 꽤 어울립니다"
 PMR_moldova_weapons: "반군 무장"
 PMR_moldova_weapons_desc: "우리는 몰도바 영토의 잠재적 반군에게 무기를 제공하여 적절한 때에 그들이 우리를 돕게 할 것입니다"
 PMR_moldova_finish: "몰도바 문제 해결"
 PMR_moldova_finish_desc: "머지않아 몰도바가 우리 조국을 되찾으려 할 것임을 알면서 우리는 편히 잠들 수 없습니다. 따라서 그들의 존재 문제를 한 번에 영구히 해결해야 합니다."
 PMR_moldova_money: "반군 자금 지원"
 PMR_moldova_money_desc: "우리는 몰도바 영토의 잠재적 반군에게 재정적으로 지원하여 적절한 때에 그들이 우리를 돕게 할 것입니다"
 PMR_anti_west_idea: "반서방 교리"
 PMR_legion_idea: "트란스니스트리아 군단"
 PMR_lebed_policy_idea: "트란스니스트리아 군사정권의 정치 체제"
 PMR_corruption_dead_in_govern_idea: "정부 부패 소멸"
 ded_lebed: "레베드 장군 사망"
 transnistria.42.t: "트란스니스트리아 통합"
 transnistria.42.d: "우리는 마침내 트란스니스트리아를 우리나라에 통합할 준비가 되었습니다."
 transnistria.42.a: "드디어"
 transnistria_news.3.t: "몰도바의 일부가 된 트란스니스트리아"
 transnistria_news.3.d: "미승인국인 프리드니스트로비아 몰다비아 공화국 당국이 몰도바 가입에 관한 국민투표를 실시했으며 다수가 찬성표를 던졌습니다. 몰도바 정부는 이 국민투표 결과를 받아들이고 트란스니스트리아의 몰도바 편입을 발표했습니다."
 transnistria_news.3.a: "흥미롭군."
 transnistria_news.4.t: "몰도바를 병합한 트란스니스트리아"
 transnistria_news.4.d: "몰도바에서 뜻밖의 소식이 들려오고 있습니다. 한때 이 나라의 일부였던 트란스니스트리아가 몰도바 병합을 선언하고, 몰도바 국가성의 연속으로서 그 자리를 차지했습니다.."
 transnistria_news.4.a: "흥미롭군."
 PMR_moldova_economic: "레우 도입"
 PMR_moldova_economic_desc: "루블을 버리고 몰도바의 통화를 받아들이는 일은 엄청나게 비용이 드는 사업이 될 것입니다. 다행히 우리의 새 위원회가 은행들과 직접 협력하여 환전소를 설치하고 새 지폐를 즉시 유통시키기 시작했습니다."
 PMR_moldova_military: "동기화된 군대"
 PMR_moldova_military_desc: "몰도바의 요구 가운데 하나는 우리 군을 그들의 교리와 체계에 맞추는 것이었습니다. 새 군복과 훈련 연대가 지급될 것이며, 쓸모없는 인원을 데려가지 않도록 우리 지휘부는 위에서 아래까지 검토될 것입니다."
 PMR_annex_efffect_idea1: "경제 통합"
 PMR_army_efffect_idea1: "군 통합"
 PMR_MLV_influence_tt: "[MLV.GetFlag] 몰도바의 §Y[PMR.GetNameWithFlag]§! 내 §H영향력 배수§!: §R+15%§!"
 PMR_hun_invest: "헝가리 투자"
 PMR_hun_invest_desc: "헝가리 기업 여러 곳이 우리 경제에 투자하고 싶다는 뜻을 밝혔습니다."
 PMR_rom_invest: "루마니아 투자"
 PMR_rom_invest_desc: "루마니아 기업 여러 곳이 우리 경제에 투자하고 싶다는 뜻을 밝혔습니다."
 PMR_aus_invest: "오스트리아 투자"
 PMR_aus_invest_desc: "오스트리아 기업 여러 곳이 우리 경제에 투자하고 싶다는 뜻을 밝혔습니다."
 PMR_sov_invest: "러시아 투자"
 PMR_sov_invest_desc: "러시아 기업 여러 곳이 우리 경제에 투자하고 싶다는 뜻을 밝혔습니다."
 PMR_encouraged_foreign_investments_idea: "투자법"
 PMR_buy_german_investments: "[GER.GetFlag] §Y독일§! 투자 §G되사기§!"
 PMR_buy_italian_investments: "[ITA.GetFlag] §Y이탈리아§! 투자 §G되사기§!"
 PMR_buy_russian_investments: "[SOV.GetFlag] §Y러시아§! 투자 §G되사기§!"
 PMR_buy_ukraininan_investments: "[UKR.GetFlag] §Y우크라이나§! 투자 §G되사기§!"
 PMR_buy_austrian_investments: "[AUS.GetFlag] §Y오스트리아§! 투자 §G되사기§!"
 PMR_buy_romanian_investments: "[ROM.GetFlag] §Y루마니아§! 투자 §G되사기§!"
 PMR_buy_hungarian_investments: "[HUN.GetFlag] §Y헝가리§! 투자 §G되사기§!"
 PMR_pograncy_desc: "우리 국경은 적의 침공 위협에 끊임없이 노출되어 있으므로, 우리는 공화국 국경 수비대에 대한 재정과 지원을 개선할 것입니다.."
 PMR_red_moldova: "몰다비아 소비에트 사회주의 공화국 복원"
 PMR_red_moldova_desc: "몰도바 시민들은 오랫동안 서방 통치자들과 그 하수인들의 멍에 아래 고통받아 왔으며, 이들은 몰도바를 유럽과 세계에서 가장 가난한 나라 가운데 하나로 만들었습니다. 이제 그들을 자본주의의 억압에서 해방시킬 때입니다"
 PMR_social_program: "사회 지원 프로그램"
 PMR_luxury_tax_idea: "사치세"
 PMR_gos_plans_idea: "고스플란 2.0"
 PMR_small_business_support: "과학의 급속한 발전"
 PMR_small_business_support_desc: "과학은 언제나 진보의 엔진이었으며, 우리는 과학자가 아무리 적더라도 그들을 지원할 것입니다"
 PMR_infra: "기반시설 투자"
 PMR_infra_desc: "우리 주민들은 지뢰밭이 아니라 제대로 된 도로를 따라 이동해야 합니다"
 PMR_roskosh: "사치세"
 PMR_roskosh_desc: "부자들은 더 많은 세금을 내야 합니다. 우리 국고는 무한하지 않으며 오히려 지나치게 작기 때문입니다"
 PMR_selhoz: "농업 개발 계획"
 PMR_selhoz_desc: "농공 산업은 우리의 생존과 배부름의 열쇠이며, 우리는 이 산업에 대한 투자에 인색할 생각이 없습니다"
 PMR_gos_plan_2: "고스플란 2.0"
 PMR_gos_plan_2_desc: "소련의 5개년 계획에 빗대어, 우리는 이른바 고스플란 2.0이라는 우리만의 계획을 수립할 것입니다"
 PMR_army_prestige: "군의 위신 제고"
 PMR_army_prestige_desc: "우리 군의 위신을 높여야 합니다. 이 용감한 병사들이 없었다면 우리 공화국은 존재하지 않았을 것이기 때문입니다"
 PMR_expel_russians: "평화유지군 추방"
 PMR_expel_russians_desc: "우리에게는 우리 국민을 지킬 수 있는 자체 군대가 있습니다. 이곳에 남은 러시아인들은 우리 정부의 정당성에 계속 얼룩을 남길 뿐입니다. 그들은 떠나야 합니다."
 PMR_annex_odessa: "§Y[OPR.GetNameWithFlag]§! 통합"
 transnistria.43.t: "트란스니스트리아를 선택해 주셔서 감사합니다!"
 transnistria.43.d: "트란스니스트리아는 1년 전에 업데이트를 받았지만, 이 작은 나라의 게임플레이를 더욱 다채롭게 하기 위해 기존 콘텐츠를 전면 개편하기로 했습니다!\n 이번 패치에서 러시아와 트란스니스트리아는 이전보다 더 많이 협력하지만, 이것이 반드시 여러분의 길이 러시아에 있다는 뜻은 아닙니다. 몰도바와 우크라이나 어느 쪽이든 선택할 수 있습니다! 그리고 완전히 교활하다면 트란스니스트리아 제국을 세울 수도 있습니다!\n 트란스니스트리아는 제가 러시아 갈래에 적용한 저만의 콘텐츠 기준에 따라 업데이트되었으며, 그래서 경제 갈래조차 러시아 갈래와 매우 비슷합니다.\n 업데이트된 콘텐츠를 즐기시고 친구와 함께 트란스니스트리아로 흥미로운 게임을 하시기를 바랍니다!\n\n - 로드 보그다노프, 트란스니스트리아 개발자이자 러시아 리워크 팀 일원"
 transnistria.43.a: "스파시보"
 PMR_buy_general: "오데사 장성 매수"
 PMR_buy_general_desc: "우리는 오데사에 있는 우크라이나 장성 일부를 매수하여, 적절한 순간에 우리의 무장 봉기를 지지하게 할 것입니다."
 PMR_idea_national_guard: "국가방위군"
 PMR_Sheriff_yest_tt: "£text_icon_pmr_sheriff §2셰리프§!가 §R파괴되지§! 않았습니다"
 PMR_kobalsna_small_weapons_tt: "창고의 무기 재고가 §R비워지지§! 않았습니다"
 PMR_kobalsna_take_weapons_tt: "창고의 모든 전투 가능 무기가 §Y무기고§!에 추가됩니다"
 PMR_mvd: "안전한 트란스니스트리아"
 PMR_mvd_desc: "우리 공화국의 독립을 보장하는 것은 군대만이 아니라, 외부의 적에 맞선 내부 투쟁의 책임을 짊어진 특수 기관과 내무 기관도 마찬가지입니다.."
 PMR_mvdshka: "내무부"
 PMR_mvdshka_desc: "트란스니스트리아 내무부는 부분적으로 승인된 프리드니스트로비아 몰다비아 공화국의 공식 정부 기관입니다. 트란스니스트리아 군대의 방위 정책을 시행하는 집행 기관입니다."
 PMR_ubepik: "경제안보국"
 PMR_ubepik_desc: "경제안보 및 부패방지국은 경제 안보 분야의 국가 정책과 규제 법적 조치를 수립하고 시행합니다. 또한 공화국 법률과 대통령령, 내무부의 규제 법령에 따른 기타 기능도 수행합니다."
 PMR_dnestr: "독립 특수임무 여단"
 PMR_dnestr_desc: "드네스트르 독립 특수임무 여단은 프리드니스트로비아 몰다비아 공화국의 특수임무 민병 여단으로, 트란스니스트리아 분쟁 중인 1991년 8월 티라스폴에서 창설되어 공화국 내무부에 직접 예속되어 있습니다."
 PMR_mgb: "국가안보부"
 PMR_mgb_desc: "국가안보부는 트란스니스트리아의 국가 보안 기관입니다."
 PMR_delta: "델타 특수부대 대대"
 PMR_delta_desc: "델타 특수부대 대대는 1992년 봄 티라스폴에서 창설된 특수 대대로, 현재 트란스니스트리아 국가안보부에 직접 예속되어 있습니다. 이 부대는 프리드니스트로비아 군 총사령관의 예비대에 편입되었으며, 현재 프리드니스트로비아 몰다비아 공화국 국경 방호와 대테러 관련 임무를 수행하고 있습니다."
 PMR_mvd_category: "내무"
 PMR_mvd_category_desc: "우리 공화국의 독립을 보장하는 것은 군대만이 아니라, 외부의 적에 맞선 내부 투쟁의 책임을 짊어진 특수 기관과 내무 기관도 마찬가지입니다.\n£text_icon_pmr_sheriff §2셰리프의 독점§!을 §R파괴§!하려면 §Y부패§! 수준이 §G낮아야§! 합니다"
 PMR_emperess_maria: "황후 마리아 기관청"
 PMR_emperess_maria_desc: "우리는 이 기관을 복원할 것이며, 이 기관은 저렴한 요양원과 병원을 담당하여 시민들의 보건 지원을 개선할 것입니다"
 PMR_nationalized: "기업 국유화"
 PMR_nationalized_desc: "새로운 전통 규범을 관철할 수 있는 우리의 역량은 산업을 직접 관리할 수 있는 역량에 따라 결정될 것입니다."
 PMR_agri_sup: "농공 부문 지원"
 PMR_agri_sup_desc: "농민들이 생계 수단을 확보하지 못한다면 그들의 지지를 기대할 수 없습니다."
 PMR_lux_tax: "사치세 도입"
 PMR_lux_tax_desc: "부자들은 더 많은 세금을 내야 합니다. 우리 국고는 무한하지 않으며 오히려 지나치게 작기 때문입니다"
 PMR_monarchy_guard: "황실 근위대"
 PMR_dedd_sheriff: "셰리프 억제"
 PMR_emperess_maria_idea: "황후 마리아 기관청"
 PMR_royal_leib_guard_idea: "라이프 가드"
 PMR_monarchism: "군주제 헌법"
 PMR_monarchism_desc: "트란스니스트리아는 소련의 보존지로 여겨지지만 주민들의 시각은 오래전에 바뀌었습니다. 이제 소련은 폐허와 혼돈을 떠올리게 합니다. 어쩌면 러시아 제국의 유산이 우리에게 더 어울리지 않겠습니까?"
 PMR_monarchy_guard_desc: "근위대 없는 군주가 어디 있겠습니까? 국가와 황제를 보호하기 위해 성좌의 영토에 황실 근위대가 창설될 것입니다"
 PMR_dedd_sheriff_desc: "이 지주회사가 우리 공화국에 행사하는 영향력을 끝낼 때가 되었습니다. 우리는 자유로워질 것입니다!"
 transnistria.44.t: "우크라이나 전선 붕괴"
 transnistria.44.d: "러시아군 종대가 서쪽으로 진격하고 있으며 키이우의 사령부는 남부 축선의 통제력을 잃었습니다. 1990년 이래 우리를 바다와 갈라놓았던 해안 지대인 오데사 주는 예비군 정도만이 방어하고 있습니다. 우리 참모 장교들은 콜바스나의 보급창이 여전히 가득 차 있으며 티라스폴로 가는 길은 양방향으로 이어진다고 지적합니다. 티라스폴 지도부는 이 기회를, 우크라이나가 살아남는다면 누가 자신들을 상대로 움직였는지 기억하리라는 확실성과 저울질하고 있습니다."
 transnistria.44.a: "티라스폴은 방관하지 않을 것이다."
 transnistria.44.b: "이것은 우리의 전쟁이 아니다."
 transnistria.45.t: "크라스노야르스크의 장군"
 transnistria.45.d: "알렉산드르 레베드는 제14근위군이 티라스폴과 몰도바군의 진격 사이에 서 있던 당시 이를 지휘했으며, 이 공화국에는 스미르노프의 이름보다 그의 이름을 먼저 입에 올리는 장교들이 여전히 있습니다. 그는 현재 드네스트르 강에서 동쪽으로 6천 킬로미터 떨어진 크라스노야르스크 지방을 통치하며, 빌린 헬리콥터로 광산 도시들을 오가고 지방 예산을 두고 모스크바와 다투고 있습니다. 우리 참모진은 군인들이 세운 공화국은 군인이 이끌어야 하며 티라스폴의 초청에 그가 응하지 않을 리 없다고 주장합니다. 비용이 싸지는 않을 것입니다. 현직 러시아 주지사가 공짜로 거처를 옮기지는 않으며, 모스크바도 눈감아 주는 대가로 루블 이상을 원할 것입니다."
 transnistria.45.a: "장군을 고향으로 모셔 오라."
 transnistria.45.b: "티라스폴은 그가 지휘할 곳이 아니다."
 transnistria.46.t: "돌아오지 못하는 장군"
 transnistria.46.d: "알렉산드르 레베드를 태운 Mi-8 헬리콥터가 크라스노야르스크 지방의 구릉지대에서 송전선에 부딪혀 안개 속에 추락했습니다. 1992년 드네스트르 전선을 지켜낸 이 지방 주지사는 탑승자 7명과 함께 사망했습니다. 티라스폴은 모스크바에 조의를 전했습니다. 십 년간 그가 돌아오기를 기다려 온 장교들은 이제 더는 기다릴 이유가 없으며, 그의 지휘 아래 이 공화국에 군인 정부가 어떤 모습으로 들어섰을지는 몰라도 이제 그것은 세워지지 않을 것입니다."
 transnistria.46.a: "그는 노보데비치에 묻혔다."
 PMR_idea_national_guard_desc: "각 지구에서 모집되어 민병대가 아닌 국방부에 책임을 지는 영토군으로, 정규군이 병력을 할애할 수 없는 지역을 방어하기 위한 것입니다. 내무 예산에는 절감액보다 더 많은 비용이 들지만, 드네스트르 강을 따라 모든 정착지에 훈련된 소총수를 배치합니다.\n§W--------------§!\n이 국가 정신은 결코 §R제거§!되지 않습니다."
 PMR_peacerota_idea_desc: "공동통제위원회는 1992년 이래 러시아 및 몰도바 대대와 나란히 트란스니스트리아 파견대를 안보 지대에 주둔시켜 왔습니다. 이 병력을 제대로 편성하면 티라스폴은 자국 국경 너머로 배치할 수 있도록 훈련되고 장비를 갖춘 부대를 갖게 됩니다.\n§W--------------§!\n이 국가 정신은 결코 §R제거§!되지 않습니다."
 PMR_landforce_modifier: "트란스니스트리아 군대"
 PMR_landforce_modifier_desc: "티라스폴과 벤데리 일대의 정규군 약 4천 명은 1992년 소련 제14군이 남기고 간 장비로 무장했으며, 마지막으로 훈련장을 본 것이 다른 깃발 아래였던 장교들이 지휘합니다. 징집 규모는 작고, T-64와 BTR은 십 년째 정비되지 않았으며, 예비군 제도는 대부분 서류상으로만 존재합니다.\n§W--------------§!\n이 국가 정신은 결코 §R제거§!되지 않습니다. 우리가 §H육군§! 중점을 완료할 때마다 페널티가 §G개선§!되며, §H트란스니스트리아 신군대§!를 완료하면 §R완전히 사라집니다§!."
 PMR_airforce_modifier: "트란스니스트리아 공군"
 PMR_airforce_modifier_desc: "티라스폴의 비행장 하나, 제14군이 철수하며 넘겨준 Mi-8과 Mi-24 소수, 그리고 전투기는 전혀 없습니다. 편제상의 조종사들은 소련이 해체된 이후 제트기를 조종해 본 적이 없으며, 그 뒤를 받칠 레이더망이라 할 만한 것도 없습니다.\n§W--------------§!\n이 국가 정신은 결코 §R제거§!되지 않습니다. §H트란스니스트리아 공군§! 중점을 완료하면 페널티가 §G개선§!되며, §H공군 사관학교§! 중점을 완료하면 §R완전히 사라집니다§!."
 PMR_doctrine_romania_desc: "참모본부는 부쿠레슈티를 키시너우가 드네스트르 강에서 시도하는 모든 일의 후원자로 보고 그에 맞춰 계획을 세웁니다. 훈련은 루마니아 부대와 루마니아 장비, 몰도바군에 파견된 루마니아 장교를 상정하여 작성됩니다.\n§W--------------§!\n이 국가 정신은 결코 §R제거§!되지 않습니다."
 PMR_doctrine_ukraine_desc: "키이우는 티라스폴이 봉쇄할 수 없는 유일한 국경과 바깥 세계로 통하는 유일한 철도를 쥐고 있습니다. 참모본부는 그 국경이 전선이 되는 날을 대비해 계획하며, 몰도바군이 아닌 우크라이나군을 상대로 군을 훈련시킵니다.\n§W--------------§!\n이 국가 정신은 결코 §R제거§!되지 않습니다."
 PMR_kazachestvo_desc: "흑해 카자크 호스트는 1991년 드네스트르 계곡에서 부활하여 이듬해 전쟁에서 의용 분견대로 싸웠습니다. 이들의 지구는 지금도 아타만을 선출하고, 명령이 떨어지면 소집되며, 무기를 집에 보관하고, 공화국은 이들을 상비 예비대로 취급합니다.\n§W--------------§!\n이 국가 정신은 결코 §R제거§!되지 않습니다."
 PMR_denomination_idea_desc: "트란스니스트리아 루블은 1994년 덧인쇄한 소비에트 지폐를 바탕으로 도입되었으며 이를 뒷받침할 준비금을 가져 본 적이 없습니다. 초인플레이션이 두 차례 저축을 휩쓸어 갔고, 주민들은 모든 것을 달러로 가격 매기며, 중앙은행은 단 한 분기도 환율 고정을 유지하지 못합니다.\n§W--------------§!\n이 국가 정신은 §H화폐 개혁§! 중점을 완료하면 §R제거§!됩니다."
 PMR_encouraged_foreign_investments_idea_desc: "티라스폴은 해외에서 차입할 수 없고 이만큼 작은 경제에 과세하여 성장시킬 수도 없으므로, 대신 접근권을 판매합니다. 2002년 투자법은 인허가를 없애고 이익 송금을 보장하며, 셰리프가 아직 차지하지 않은 국영 기업을 들어오는 파트너에게 넘겨줍니다.\n§W--------------§!\n이 국가 정신은 우리가 다른 국가의 종속국이 되면 §R제거§!됩니다."
 PMR_economy_modifier: "트란스니스트리아 경제"
 PMR_economy_modifier_desc: "몰다비아 소비에트 사회주의 공화국 산업 지대에 남은 것들입니다. 르이브니차 시멘트 공장, 티라스폴 섬유 공장, 크빈트 증류소, 모든 것을 오데사로 실어 나르는 철도, 그리고 드네스트르 계곡의 농장들입니다. 생산에 복귀하는 모든 기업이 여기에 흔적을 남깁니다.\n§W--------------§!\n이 국가 정신은 결코 §R제거§!되지 않습니다. 그러나 더 많은 중점과 결정, 사건을 완료함에 따라 변동치가 점차 §G개선§!될 수 있습니다."
 PMR_foreign_investments_modifier: "외국인 투자"
 PMR_foreign_investments_modifier_desc: "해외 소유주에게 속한 트란스니스트리아 산업의 몫입니다. 민영화 과정에서 사들인 오스트리아, 독일, 헝가리의 지분, 루마니아와 이탈리아의 농업 자본, 그리고 르이브니차의 우크라이나 제철업체들이 있습니다. 이들의 자본이 공장을 계속 돌리며, 이들의 정부는 티라스폴에서 발언권을 갖습니다.\n§W--------------§!\n파트너와 전쟁을 벌이거나 그들이 소멸하면 그 파트너의 지분은 §R제거§!됩니다. 이후 §Y트란스니스트리아 경제§! 결정을 통해 그들의 지분을 §Y되사들일§! 수 있습니다."
 PMR_sheriff_modifier: "셰리프"
 PMR_sheriff_modifier_desc: "1993년 트란스니스트리아 민병대 출신 장교 두 명이 설립한 셰리프는 슈퍼마켓, 주유소, 이동통신망, 텔레비전 채널, 축구 클럽을 소유하며 오브노블레니예 당을 통해 최고회의까지 장악하고 있습니다. 이 공화국은 기업을 품은 국가라기보다 국가로 둘러싸인 기업에 가깝습니다.\n§W--------------§!\n이 국가 정신은 셰리프 중점을 완료할 때마다 §G강화§!되며, §Y셰리프의 독점 파괴§! 결정을 완료하거나 §H셰리프 지주회사 종식§! 중점 중 하나를 완료하면 §R제거§!됩니다."
 PMR_sheriff_grows_tt: "£text_icon_pmr_sheriff §Y셰리프§!의 공화국 장악력이 §R강화§!됨"
 PMR_sheriff_full_control_tt: "£text_icon_pmr_sheriff §Y셰리프§!가 공화국을 §R완전히 장악§!함"
 PMR_security_modifier: "트란스니스트리아 특수 기관"
 PMR_security_modifier_desc: "프리드니스트로비아 몰다비아 공화국의 국내 보안 기구입니다. 델타 대테러 대대를 거느린 티라스폴의 국가안보부, 드네스트르 특수임무 여단을 둔 내무부, 우크라이나와의 경계선과 안보 지대의 몰도바 쪽을 감시하는 국경 수비대, 그리고 경제안보 및 부패방지국이 포함됩니다. 이 기관들의 모든 개혁이 여기에 누적됩니다.\n§W--------------§!\n이 국가 정신은 결코 §R제거§!되지 않습니다. 그러나 기관 개혁에 관한 중점을 더 많이 완료함에 따라 변동치가 점차 §G개선§!될 수 있습니다."
 PMR_upgrade_services_tt: "§Y개혁§!할 수 있는 기관이 있습니다"
 PMR_upgrade_mgb_tt: "§Y국가안보부§!는 아직 개혁되지 않았습니다"
 PMR_legion_idea_desc: "외국인에게 개방된 의용 부대로, 군이 아닌 국가안보부가 운영합니다. 티라스폴이 파견했다고 인정하지 않고도 해외로 보낼 수 있는 인력을 제공하며, 징집군이 제공할 수 없는 국내 방첩 차단막도 제공합니다.\n§W--------------§!\n이 국가 정신은 결코 §R제거§!되지 않습니다."
 PMR_lebed_secured: "레베드 장군이 티라스폴로 귀환했다"