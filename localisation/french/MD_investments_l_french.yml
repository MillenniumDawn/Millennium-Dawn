 improve_local_conservation_efforts: "Actuellement §YAméliorer les efforts locaux de conservation§! dans §Y[THIS.GetName]§!."
 improve_local_conservation_efforts_tt: "§YAméliorer les efforts de conservation locaux§! dans §Y[THIS.GetName]§!\n---------\nNous devrions envisager d’améliorer les efforts de conservation locaux dans §Y[THIS.GetName]§! pour aider à protéger l’écosystème local et la faune tout en..."
 improve_local_conservation_efforts_delayed_tt: "§YPrérequis:§!\n[!improve_local_conservation_efforts_click_enabled]\n§YEffets:§!\n[!improve_local_conservation_efforts_click]"
 improve_local_conservation_efforts_click_tt: "Pendant 120 jours, nous gagnons ce qui suit dans §Y[THIS.GetName]§!:\nLes pénalités de §YLa forêt amazonienne - Efforts locaux de conservation§! sont réduites de §G-25%§!."
 state_owned_local_naval_infrastructure_modifier: "Développement des infrastructures navales locales"
 state_owned_local_naval_infrastructure_modifier_desc: "Les investissements dans la défense côtière et les infrastructures navales ont transformé les capacités maritimes de l'État. De nouvelles installations navales et des plateformes logistiques assurent désormais un soutien complet aux opérations navales dans la région."
 state_owned_local_fortification_efforts_modifier: "Efforts locaux de fortification"
 state_owned_local_fortification_efforts_modifier_desc: "D'importants ouvrages défensifs ont été construits dans tout l'État, notamment des bunkers, des fortifications côtières et des réseaux de places fortes. Ces installations militaires renforcent considérablement les capacités de défense de l'État face aux invasions et aux attaques terrestres."
 expand_local_coastal_infrastructure: "§YExpansion de l'infrastructure côtière locale§! en cours dans §Y[THIS.GetName]§!."
 expand_local_coastal_infrastructure_tt: "§YÉtendre les infrastructures côtières locales§! dans §Y[THIS.GetName]§!\n---------\nLes régions côtières de §Y[THIS.GetName]§! bénéficieraient grandement d'infrastructures améliorées. Nous devrions envisager d'étendre les ports, havres et défenses côtières pour stimuler le commerce maritime et les capacités navales."
 expand_local_coastal_infrastructure_delayed_tt: "§YEffets :§!\n[!expand_local_coastal_infrastructure_click]\n\n£click_right §YR Click§!: Toggle automatic repetition.\n[auto_repeat_internal_expand_coastal_infrastructure_status]"
