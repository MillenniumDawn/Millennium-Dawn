 SAU_corporate_policy_tt: "§H왕국이 기업을 어떻게 규제하고 기업이 누구를 고용할 수 있는지를 정합니다.§!"
 SAU_corporate_policy_2_tt: "§Y니타카트 할당제와 카팔라 규정은 어느 한 정부보다 오래 지속됩니다 - 이 조건들은 정권이 바뀌어도 유지됩니다.§!"
 SAU_shura_rebalanced_tt: "§Y세 의석군 모두 40석으로 초기화됩니다§! - 평의회는 계속 경합 상태에 놓이며 헌장은 발급되지 않습니다"
 SAU_shura_charter_ulema: "고위 학자 평의회"
 SAU_shura_charter_ulema_desc: "평의회의 종교 부문이 기본법에 명문화됩니다. 법안은 무엇보다 먼저 율법 부합 여부를 심사받으며, 학자들은 오직 국왕에게만 책임을 집니다.\n\n왕국은 움직이기 더 어려워지고 전복하기는 훨씬 더 어려워집니다. 동시에 이웃 나라들만큼 빠르게 배우지도 못하게 됩니다."
 SAU_shura_charter_technocrats: "기획 평의회"
 SAU_shura_charter_technocrats_desc: "평의회는 테크노크라트들이 줄곧 주장해 온 모습, 즉 재무제표를 읽을 줄 아는 이들로 구성되어 산업과 교육 정책에 대한 상설 권한을 지닌 기획 기구가 됩니다.\n\n왕국은 누구도 예상하지 못한 속도로 현대화됩니다. 더 이상 자문을 구하지 않게 된 이들은 이를 알아차립니다."
 SAU_shura_charter_notables: "가문 회의소"
 SAU_shura_charter_notables_desc: "거상 가문과 부족 가문들이 상설 의석을 차지하며, 평의회는 왕국의 후원 관계가 사적인 자리가 아니라 공개적으로 협상되는 장이 됩니다.\n\n운영은 원활하고 비용도 적게 듭니다. 그러나 국가에 어려운 것을 요구하지는 않을 것입니다."
 SAU_events.220.t: "위임을 요청하는 기획자들"
 SAU_events.220.d: "이제 테크노크라트들이 평의회를 완전히 장악했습니다. 그들은 이를 영구화하는 제안서를 작성했습니다. 산업, 교육, 예산에 대한 상설 기획 권한을 부여하고 평의회의 구성을 기본법에 고정하는 내용입니다.\n\n국왕은 서명하여 제대로 돌아가는 정부를 얻을 수도 있고, 거부하여 원할 때마다 재편할 수 있는 의회를 유지할 수도 있습니다."
 SAU_events.220.a: "기획 평의회에 헌장을 부여한다."
 SAU_events.220.b: "평의회는 내가 만드는 대로 남는다."
 SAU_events.221.t: "자신들의 주장을 펼치는 가문들"
 SAU_events.221.d: "명사들이 평의회를 장악했고, 한 세기 동안 이 왕가와 협상해 온 이들이 작성한 제안서를 들고 디완을 찾아왔습니다. 국왕이 줄곧 의지해 온 그들의 침묵을 대가로, 명문가에 영구 의석을 달라는 내용입니다.\n\n가장 저렴하게 운영되는 정부이자 가장 야심 없는 정부입니다."
 SAU_events.221.a: "가문 회의소에 헌장을 부여한다."
 SAU_events.221.b: "평의회는 내가 만드는 대로 남는다."
 SAU_events.222.t: "명문화를 요청하는 학자들"
 SAU_events.222.d: "울라마가 평의회를 장악하고 이를 기본법에 명시해 줄 것을 원하고 있습니다. 왕국이 통과시키는 모든 조치를 가장 먼저 검토하는 고위 학자들의 상설 기구입니다.\n\n이는 학자들에게 유리한 방향으로 한 세대 동안 왕국 내 종교적 권위 문제를 매듭짓게 될 것이며, 기분이 나쁜 훗날의 국왕이 되돌릴 수도 없습니다."
 SAU_events.222.a: "고위 학자 평의회에 헌장을 부여한다."
 SAU_events.222.b: "평의회는 내가 만드는 대로 남는다."
 SAU_junta_grip_firm: "평의회의 명령이 통한다"
 SAU_junta_grip_firm_desc: "리야드에서 내려진 명령은 같은 주 안에 자잔에서도 이행됩니다. 지방 총독들은 전화를 받고, 보안 기관은 옆이 아니라 위로 보고하며, 어느 쪽으로 흘러가는지 조용히 지켜보는 이는 아무도 없습니다.\n\n이것이 장교들의 정부가 그것이 대체한 정부보다 갖는 유일한 이점입니다."
 SAU_junta_grip_uneven: "고르지 못한 명령 체계"
 SAU_junta_grip_uneven_desc: "평의회는 수도와 동부 주는 제대로 통치하지만, 왕국의 나머지는 대충 통치할 뿐입니다. 지시는 누군가 지켜보는 곳에서만 이행됩니다.\n\n나라를 붙들기에는 충분하지만 나라를 바꾸기에는 충분하지 않습니다."
 SAU_junta_grip_slipping: "명령은 순환도로에서 멈춘다"
 SAU_junta_grip_slipping_desc: "리야드 바깥에서 평의회의 명령은 접수되고, 철해지고, 이 체제가 얼마나 갈지 계산하는 자들에 의해 무시됩니다. 주둔군 지휘관들은 수도가 아니라 서로 간에 서신을 주고받기 시작했습니다.\n\n복종받지 못하는 정부가 곧 무너진 정부는 아니지만, 그 경계가 점점 흐려지고 있습니다."
 SAU_regency_deadline_tt: "§Y5년 후 결산의 시기가 닥칩니다§! - 칙령을 갱신하거나, 연장하거나, 효력이 만료되도록 두어야 합니다"
 SAU_debug_shura_seat_jump: "§Y(디버그) 테크노크라트 +30석§!"
 SAU_debug_shura_seat_jump_desc: "테크노크라트 의석군을 헌장 기준인 70석 위로 올려 헌장 사건이 발생하도록 합니다."
 SAU_debug_corp_readout: "§Y(디버그) 기업 정책§!: 세금 [?SAU_corp_tax|%1] 이주 [?SAU_corp_migration|%1] 노동자 [?SAU_corp_civ_workers|%1] FDI [?SAU_corp_fdi_cost|%1]"
 SAU_debug_corp_readout_desc: "니타카트와 카팔라 경로가 값을 기록하는 기업 및 노동 정책 변수를 읽어 옵니다."
 SAU_debug_junta_control_up: "§Y(디버그) 군사정권 통제력 +25§!"
 SAU_debug_junta_control_up_desc: "평의회의 장악력을 높여 장악력 단계를 시험합니다."
 SAU_debug_junta_control_down: "§Y(디버그) 군사정권 통제력 -25§!"
 SAU_debug_junta_control_down_desc: "평의회의 장악력을 낮춰 명령 체계 약화 페널티를 시험합니다."
 SAU_water_national_company: "국가 수자원 공사"
 SAU_water_national_company_desc: "담수화, 배급, 요금 청구가 부처에 책임을 지는 하나의 국영 공익사업체로 통합됩니다. 이곳은 수익이 나는 곳이 아니라 왕국이 물을 필요로 하는 곳에 시설을 짓습니다. 그것이 설립 취지이자 동시에 문제점이기도 합니다.\n\n물이 내륙까지 닿습니다. 이 공사는 결코 흑자를 내지 못할 것이며, 애초에 그런 기대도 받지 않았습니다."
 SAU_water_foreign_operators: "외국 수자원 운영사"
 SAU_water_foreign_operators_desc: "플랜트는 이미 수백 번 같은 일을 해 본 기업들이 계약에 따라 건설, 운영, 유지 보수하며, 이는 왕국이 아직 자력으로 도달할 수 없는 수준입니다.\n\n물은 더 깨끗해지고 입방미터당 가격도 저렴해집니다. 계약은 달러로 표시되며, 그들이 떠나면 전문 기술도 함께 떠납니다."
 SAU_events.223.t: "왕국 안내, 간략히"
 SAU_events.223.d: "이 왕국을 어떻게 운영하는지에 관해, 이를 직접 이끌어야 할 이들이 남기는 짧은 안내입니다.\n\n§H왕국의 미래§! - 버튼이 아니라 균형입니다. 중점, 사건, 국왕이 시행하는 개혁에 따라 움직이며, 국가가 현대화를 얼마나 받아들이는지를 결정합니다. 지켜볼 수는 있지만 명령할 수는 없습니다.\n§H석유 의존도§! - 0에서 100 사이의 수치로, §Y석 달에 1포인트씩§! 저절로 상승합니다. 다각화 결정과 중점이 이를 끌어내립니다. 이것이 이번 캠페인 전체를 관통하는 오랜 논쟁입니다.\n§H기업 및 노동 정책§! - 경제 트리에 있습니다. §O니타카트 할당제§!(세금을 거두고 사우디인을 고용하는 대신 외국인 노동력을 잃음)와 §Y카팔라 자유화§!(값싼 노동자와 외국 자본을 얻는 대신 세수와 자국민 일자리를 잃음) 중에서 선택하십시오. 둘 다 왕국의 실질 실업률에 영향을 줍니다.\n§H평의회§! - 슈라 평의회는 시작부터 개회해 있습니다. §O울라마§!, §Y테크노크라트§!, §G명사§! 중 누구를 앉힐지 정하십시오. 어느 의석군이 주도하느냐에 따라 평의회의 성격이 정해지며, §Y70석§!을 넘으면 영구 헌장을 부여할 수 있습니다. 인민 평의회는 나중에 등장하여 법안을 통과시키며, 대가를 치르면 거부권을 행사할 수 있습니다.\n§H왕위 계승§! - 파흐드가 서거하면 왕자들이 책략을 펼치기 시작합니다. 왕세자 결정을 통해 한 명을 지지하십시오. 국왕이 서거했을 때 앞서 있는 이가 왕좌에 오르며, 각자 고유한 지침을 가져옵니다. §Y한 번에 하나의 지침만 궁정을 차지합니다.§!\n§H군대§! - 장교들은 자신들이 받아야 할 몫을 따로 장부에 적어 둡니다. 방치하면 그들은 행동에 나설 것입니다. §R불만 지표를 지켜보고, 너무 늦기 전에 해결하십시오§! - 쿠데타는 막을 수는 있지만 되돌릴 수는 없습니다.\n§H아랍의 봄§! - 지역에 번질 경우 불안은 수치로 쌓입니다. 임계점에서 국왕은 선택합니다. 버티며 안정도를 잃거나, §R군주제가 무너지도록 두고§! 과도 평의회에 나라를 넘기는 것입니다.\n§H아라비아 공화국§! - 왕좌는 영원하지 않으며, 그곳에서 내려오는 §Y길은 세 가지§!입니다. 장교들이 리야드를 장악하도록 두어 군사 통치 아래 §O공화국을 선포§!하는 길, 왕좌는 그대로 두되 §O사우드 가문이 아닌 정당을 집권시켜§! 왕실 허브에서 아라비아 공화국 선포를 여는 길, 혹은 §O아랍의 봄이 임계점에 이르도록 두고§! 물러나서 공화국이 대신 선포되게 하는 길입니다. §R군사의 길을 택하면 나머지 둘이 닫힙니다§! - 이미 쿠데타를 겪은 왕국은 민간의 길을 택할 수 없습니다.\n\n위의 모든 내용은 결정 탭에서 볼 수 있습니다. 이 중 어느 것도 외울 필요는 없습니다 - 모두 버튼에 적혀 있습니다."
 SAU_events.223.a: "알겠다. 시작하자."
 SAU_tadawul_needs_market_tt: "§R먼저 타다울이 상장되어 있어야 합니다§! - §H타다울, 사우디 증권거래소§!를 완료하면 이 갈래의 모든 중점이 한 단계씩 끌어올립니다:"
 SAU_trials_of_the_old_order_choice_tt: "§Y선택지가 이어집니다§! - '공개 법정에서, 생중계로' / '예전처럼 리츠에서 매듭짓는다' / '사면. 시세대로'. §H국가에 대한 장교들의 장악력과 군사정권의 정통성§!에 영향을 줍니다."
 SAU_crackdown_on_the_opposition_choice_tt: "§Y선택지가 이어집니다§! - '동부 주 위원회들부터 시작한다' / '설교를 심사 대상에 올린다' / '청원 서명자들부터 시작한다' / '세 건의 서류를 한꺼번에 처리한다'. §H국가에 대한 장교들의 장악력과 군사정권의 정통성§!에 영향을 줍니다."
 SAU_water_pride_open_tt: "§Y주권 수자원을 엽니다§! - '파국'에서 '승리'까지 총 아홉 등급입니다. 이 지표는 §H안정도§!를 따라갑니다. 자신감 있는 나라는 수도꼭지에서 물이 나올 것이라 믿고, 흔들리는 나라는 그렇지 않습니다. 매월 저절로 정산됩니다."
 SAU_unif_road_still_open_tt: "§Y평의회가 아직 다른 곳으로 돌아서지 않았습니다§! - 새로운 파트너에게 요청하거나 자치를 선언하면 미국의 길이 영구히 닫힙니다."
 SAU_unif_usa_refused_tt: "§Y워싱턴이 아직 걸프를 보호 아래 두지 않았습니다§! - 요청한 적이 없거나 미국이 §R거절했을§! 때 열립니다."
 SAU_unif_partners_refused_tt: "§Y외부 파트너가 걸프를 보호 아래 두지 않았습니다§! - 요청한 적이 없거나 그들이 §R거절했을§! 때 열립니다."
 SAU_unif_not_yet_autonomous_tt: "§Y평의회가 독립을 선언하지 않았습니다§! - 독자 노선을 택하면 이 길이 닫힙니다."
 SAU_unif_no_member_aligned_tt: "§Y평의회 회원국 중 외세를 끌어들인 나라가 없습니다§! - 튀르키예나 인도의 기지, 러시아 고문단, 외부 안보 보장, 무기 구매, 또는 외국 조달이 있으면 이 길이 닫힙니다."
 SAU_intel_surveillance_bypass_tt: "§Y기관 자체의 요건을 우회합니다§! - §H컴퓨팅 개선§! 연구도, §H부서 편성§! 업그레이드도 필요하지 않습니다"
 SAU_Intelligence_category_desc: "총정보청(GIP)은 왕국의 주요 정보 기관으로, 국내외 정보의 수집과 분석을 모두 담당합니다. 국가 안보, 대테러, 전략 기획에서 핵심적인 역할을 합니다.\n\n§GGIP를 해금하면§! 정보 역량을 강화하는 결정을 내릴 수 있게 되어, 국내외 사안 양쪽에서 귀중한 통찰과 이점을 얻습니다.\n\n한 국가에서 GIP 네트워크 침투율이 §G70%§!에 도달하면 결정이 열리며, 침투율이 높을수록 더 자주 나타납니다. 침투율이 70% 미만으로 떨어지면 사용할 수 없습니다."
 SAU_Foregin_affairs_category_desc: "§G 사우디아라비아 외교§!\n왕국의 외교 정책은 섬세한 외교적 줄타기로 규정됩니다. 지역 강국이자 이슬람 최고 성지의 수호자로서, 우리는 복잡한 동맹 관계를 헤쳐 나가고 경제적 이익을 확보하며 중동의 안정을 유지해야 합니다. 전통적인 서방 동맹국과 긴밀히 보조를 맞추든, 신흥 동방 시장으로 방향을 틀든, 독립적인 지역 패권국으로 자리매김하든, 우리의 외교단이 길을 열 것입니다.\n\n 외교 관련 결정을 더 열려면 중점을 완료하거나 진행 중에 특별 사건을 얻어야 합니다.\n\n 모든 결정은 선택한 지 1년이 지나면 다시 나타납니다."
 SAU_domestic_external_category_desc: "왕국의 내정, 석유, 그리고 그 너머의 미래를 움직이는 지렛대입니다.\n\n§H이 결정들이 나타나는 방식:§!\n§G국내§! 조치 - 건설 사업, 개발 기금, 노동력 개혁 - 는 §Y'경제 자유화'§!로 해금됩니다.\n§G석유§! 조치 - 생산량 증대, 신규 유전, 매장량 보존, 석유 금수, OPEC 지렛대 - 는 §Y'사우디 아람코'§!와 그 수출 교리로 해금됩니다.\n§G다각화§! 프로젝트 - PIF 투자, 초대형 프로젝트, 재생 에너지, 디지털 경제, 관광, 방위 산업 - 는 §Y'비전 2030'§! 트리를 완료함에 따라 해금됩니다.\n\n§H일부 결정은 더 많은 것을 요구합니다:§! §Y신규 유전§!에는 아람코 생산 전략이 필요하며, §Y석유 금수§!는 석유 경제가 가동 중일 때 §G평시에만§! 선포할 수 있습니다. 각각 시간과 국고가 들며, 대부분 §H석유 의존도§!를 올리거나 내립니다."
 SAU_vision2030_category_desc: "각자의 기한이 있는 사우디아라비아의 초대형 프로젝트들입니다. 기한 내에 자금을 대고 완공하여 비전 2030을 현실로 만드십시오. 기한을 넘기면 프로젝트는 야망을 기리는 값비싼 기념비로 전락하며 비전을 실패로 끌고 갑니다.\n\n 각 프로젝트를 건설하는 결정이 있으며, 프로젝트 위에 마우스를 올리면 각각의 기한이 표시됩니다. 기한은 주 단위로 갱신되는데, 예를 들어 1848이면 결정 기한의 다음 갱신은 1841(-7일)이 됩니다.\n\n 프로젝트를 수행하지 않은 채 기한이 끝나면 2030 비전에 디버프가 발생하고, 프로젝트를 완료하면 반대로 버프가 증가합니다."
 SAU_military_category_desc: "§L사막의 폭풍 작전§!의 충격 이후 왕국의 군대를 재건하는 장기 계획입니다. 싸우기 위해 §L미국§!의 공군력, 병참, 지휘가 필요했던 군대에서 현대적인 군대로, 그리고 §L이란§!에 대한 진정한 균형추로 거듭나는 과정입니다.\n\n§H작동 방식:§!\n모든 개혁은 군사 §Y중점§!으로 해금되는 §Y결정§!입니다. 각 개혁은 §G교리 선택§!을 열며, 모든 교리는 의도된 §R상충 관계§!를 지닙니다. 한 방향으로 군대를 강화하는 대신 다른 방향에서 대가를 치르게 합니다. 나중에 개혁을 다시 실행하여 §Y교리를 전환§!할 수 있습니다.\n\n§H세 단계:§!\n전투 준비 태세는 단계적으로 진행됩니다 - §R현대화되지 않음§!, §Y개혁 중§!, §Y현대화 중§!, §G현대화됨§!. 각 단계는 고유한 개혁 묶음을 드러내며, 다음 단계가 열리려면 §Y모두 완료§!해야 합니다. 모든 것은 §L워 게임: 걸프의 교훈§!에서 승리하는 것으로 시작됩니다.\n\n선택한 모든 교리는 §L사우디 군대§! 국가 정신에 반영되며, 그곳에서 종합 효과를 확인할 수 있습니다."
 SAU_crown_prince_category_desc: "[ROOT.GetSAUSuccessionPanel]"
 SAU_king_abdullah_category_desc: "압둘라는 첫해부터 왕국을 이끕니다 - 파흐드가 살아 있는 동안은 섭정으로, 2005년부터는 정식 국왕으로서입니다. 2015년 1월의 서거가 왕위 계승 경쟁을 매듭짓는데, §Y살만§!, §Y무함마드 빈 나이프§!, §Y무타입§! 중 가장 많은 영향력을 모은 이가 왕좌와 자신만의 지침 일체를 물려받습니다. 그의 치세 동안 §Y왕세자§! 결정을 사용하여 이를 정하십시오. 각 지침은 §Y60일§! 동안 궁정을 점유하며, 첫 번째 지침이 끝나기 전에는 두 번째 지침을 내릴 수 없습니다."
 SAU_king_salman_category_desc: "살만의 치세는 두 번째 경쟁, 즉 §Y무함마드 빈 살만§!과 §Y무함마드 빈 나이프§!의 대결을 엽니다. 이는 2017년 6월에 결판이 나며, 그때 승자를 즉시 왕위에 올리거나 왕세자로 남겨 둘 수 있습니다. 기다린다면 국왕의 건강이 마침내 악화될 때, 늦어도 2032년까지는 그가 왕좌에 오릅니다. §Y왕세자§! 탭에서 이를 지켜보며 원하는 대로 그를 띄우거나 깎아내리십시오. 각 지침은 §Y60일§! 동안 궁정을 점유하며, 첫 번째 지침이 끝나기 전에는 두 번째 지침을 내릴 수 없습니다."
 SAU_king_mbs_category_desc: "살만 국왕 치하의 왕세자 경쟁에서 무함마드 빈 살만을 지지하고, 2017년에 그를 곧바로 국왕으로 선포하거나 살만의 건강이 악화되기를 기다리면 도달합니다. 각 지침은 §Y60일§! 동안 궁정을 점유하며, 첫 번째 지침이 끝나기 전에는 두 번째 지침을 내릴 수 없습니다."
 SAU_king_mbn_category_desc: "두 가지 방법으로 도달합니다. 압둘라 시대의 왕위 계승 경쟁에서 무함마드 빈 나이프를 살만과 무타입보다 앞서게 하거나, 살만 국왕 치하에서 그를 왕세자로 지명시키고 국왕보다 오래 살게 하는 것입니다. 각 지침은 §Y60일§! 동안 궁정을 점유하며, 첫 번째 지침이 끝나기 전에는 두 번째 지침을 내릴 수 없습니다."
 SAU_king_mutaib_category_desc: "압둘라 시대의 왕위 계승 경쟁에서 살만과 무함마드 빈 나이프를 모두 제치고 압도적으로 승리해야만 도달합니다 - 아웃사이더의 길입니다. 그 뒤로는 어떤 후속 계승도 정해져 있지 않습니다. 각 지침은 §Y60일§! 동안 궁정을 점유하며, 첫 번째 지침이 끝나기 전에는 두 번째 지침을 내릴 수 없습니다."
 SAU_faisalite_category_desc: "파이살 이븐 압둘아지즈는 결코 고립주의자가 아니었습니다. 그는 무슬림 세계 연맹을 창설했고, 1969년 알아크사가 불탔을 때 불과 몇 주 만에 라바트에 무슬림 국가 원수들을 소집했습니다 - 이슬람 협력 기구는 그의 작품이었습니다. 1967년 이후 하르툼에서 이집트와 요르단에 국고를 열었고, 예멘의 산악 지대에서 나세르의 원정군을 교착 상태로 몰아넣었으며, 이슬람 개발 은행을 설립했고, 1973년에는 석유 자체를 무기로 삼아 서방이 그 힘을 실감하게 했습니다. 자립은 그의 목적지가 아니었습니다. 그것은 수단이었습니다 - 누구의 허락도 구하지 않고 움마를 대변하기 위해 왕국이 먼저 갖추어야 할 힘이었습니다.\n\n그의 후계자들은 그 인물 없이 교리만 물려받았고, 그와 함께 그가 답할 필요가 없었던 질문까지 물려받았습니다. §O고립주의§!는 자립을 그 자체로 보상으로 여깁니다. 봉쇄된 국경, 피보호국도 십자군도 없이 누구에게도 책임지지 않는 왕국입니다. §R개입주의§!는 파이살처럼 자립을 토대로 여깁니다. 리야드가 신실한 자들을 이끌고 어느 진영의 뒤에 서지 않은 채 무장하여 진영들 사이에 설 수 있도록 다져 놓은 기반입니다.\n\n§H오늘날 왕국의 위치§! - [ROOT.GetSAUFaisaliteLean]\n[ROOT.GetSAUFaisaliteLeanEffect]\n\n§H진행 중인 지침§!: §Y2§! 중 §Y[?SAU_faisalite_active|0]§!. 어느 쪽에서든 최대 둘까지 동시에 진행할 수 있으며, 각각은 끝까지 진행되어야만 보상을 줍니다.\n\n중점, 사건, 아래의 결정 모두가 이 수치를 움직이며, 여기서 값싸게 얻어지는 것은 아무것도 없습니다. 기둥들이 세워질 때 더 높은 쪽이 마지막 기둥을 결정합니다 - §R제3의 길 교리§! 또는 §O영광스러운 고립§!입니다."
 SAU_junta_category_desc: "평의회는 두 가지로 통치하지만 어느 것도 온전히 소유하지 못합니다. §H통제력§!은 평의회가 강제할 수 있는 것 - 주둔군, 검문소, 서류철, 호출하면 응답하는 사람들입니다. §H정통성§!은 평의회가 마땅히 받아야 하는 것인데, 받을 것이 아무것도 없습니다. 선거도, 파트와도, 왕위 계승도 없이 오직 기갑 부대가 먼저 도착했다는 사실뿐입니다.\n\n둘 중 하나를 올리는 모든 것은 다른 하나로 대가를 치릅니다. 정통성은 아무것도 하지 않아도 매월 1씩 감소합니다 - 그저 조용히 통치하기만 하는 군사정권은 시간이 다해 가는 군사정권입니다.\n\n§H0이 되면 평의회에는 존재할 이유를 찾을 시간이 90일 주어집니다. 찾지 못하면 왕국은 전장에서 이 문제를 결판 지을 것입니다.§!"
 SAU_officer_crisis_category_desc: "정규군은 폭락의 대가를 짊어졌고 국가방위대는 그러지 않았으며, 장교단은 이 사실 중 어느 쪽이 의도된 것인지 알아챘습니다. 이 모든 것이 올라야 거리에 전차가 들어서는 것으로 끝날 필요는 없습니다. 아무 조치도 취하지 않을 때만 그렇게 끝납니다.\n\n§H장교단§! - [ROOT.GetSAUArmyGrievance] (§Y100§! 중 §Y[?SAU_army_grievance|0]§!)\n[ROOT.GetSAUArmyGrievanceEffect]\n\n불만은 매월 저절로 상승합니다. §Y0§!까지 끌어내리면 장교들과 영구히 합의할 수 있으며, 배치 명령이 내려진 상태에서 §Y75§!를 넘기면 그들이 스스로 결판을 냅니다."
 SAU_modernisation_balance_of_power_category_desc: "두 개의 비전이 §L사우디아라비아 왕국§!의 영혼을 두고 다툽니다. §R전통주의§! 진영 - §L고위 학자 평의회§!, §L왕실 궁정§!, §L부족 원로§! - 은 옛 방식을 수호합니다. §G자유화§! 진영 - 테크노크라트, 외국에서 교육받은 기술자, §L비전 2030§! 옹호자 - 은 개방과 개혁, 그리고 현대 세계의 식탁에 자리 잡기를 밀어붙입니다. 균형은 중점을 완료하고 결정을 내릴 때마다 움직입니다."
 SAU_spread_revolution_category_desc: "아라비아 인민공화국은 첫 불꽃일 뿐입니다. 혁명은 모든 아랍 노동자가 사슬을 벗어던질 때까지 확산되어야 합니다.\n\n이 범주는 §Y아라비아 인민공화국§!이 완료되고 공산주의 정부가 통치할 때 해금됩니다. §Y혁명 방송§!은 아랍 국가 내 공산주의 지지율을 올리고, §Y아랍 코민테른 창설§!은 동료 노동자 국가들을 결집시킵니다. §Y사회주의 혁명 개시§! 결정은 각 아랍 국가의 공산주의자 지지율이 §Y30%§!에 이를 때까지 §R숨겨진§! 상태로 남으므로, 나타날 때까지 계속 방송하십시오. 나타나면 공격하십시오. §Y50%§! 이상이면 혁명이 국가를 단번에 장악하고, §Y30-50%§!이면 혁명 내전이 일어납니다. 동료 노동자 국가는 결코 전복되지 않으며, §Y아랍 코민테른 초청§!을 통해 §Y아랍 코민테른§!에 환영받을 뿐입니다."
 SAU_pipeline_sabotage_category_desc: "왕국의 석유는 송유관으로 나가며, 다른 모든 나라의 석유도 마찬가지입니다.\n\n§R경쟁국의 노선을 타격하면 원유 가격과 지역의 긴장이 똑같이 치솟습니다§!."
 SAU_coalition_member_category_desc: "우리는 리야드의 초청에 응했고 우리 항공기는 순환 배치에 들어가 있습니다. 그것이 어떤 가치를 지니는지, 그리고 얼마나 오래 그 대가를 치를 것인지는 우리만이 판단할 문제이며, 나가는 문은 잠겨 있지 않습니다."
 SAU_debug_category_desc: "왕위 계승, 치세, 살만 국왕 건강 시스템을 위한 테스트 도구입니다. 이 범주는 디버그 빌드에만 존재하며 - 일반 실행과 멀티플레이어에서는 보이지 않습니다."
 SAU_proxy_aggression_desc: "우리는 그들의 국민을 겨냥한 공격에 자금을 대고 있습니다. 그들은 이를 쉽게 잊지 않을 것입니다."
 SAU_traditionalist_bop_left_side_desc: "§L와하비 성직자§!, 보수적인 왕자, 부족 셰이크들입니다. 이들은 왕국의 정체성을 보존하지만 세계가 요구하는 변화에는 저항합니다."
 SAU_liberalisation_bop_right_side_desc: "§L테크노크라트§!, 외국에서 교육받은 기술자, 개혁파 왕자들입니다. 이들은 왕국의 문을 엽니다 - 기존 질서를 흔드는 대가를 치르면서."
 SAU_modernisation_bop_centre_range_desc: "전통도 개혁도 우세하지 않습니다. 왕국은 안정을 유지합니다 - 당분간은."
 SAU_traditionalist_bop_low_range_desc: "성직자와 보수파가 §Y근소한 우위§!를 점하고 있습니다. 왕국은 신중하게 움직입니다."
 SAU_traditionalist_bop_medium_range_desc: "전통이 §H길잡이§!입니다. 개혁안은 수 세기에 걸친 선례와 견주어 검토되고 - 대개 부족하다는 판정을 받습니다."
 SAU_traditionalist_bop_advanced_range_desc: "§L고위 학자 평의회§!가 의제를 정합니다. 현대화론자들은 §Y소외되거나§! §Y추방됩니다§!. 왕국은 안으로 눈을 돌립니다."
 SAU_traditionalist_bop_win_range_desc: "§L울라마§!가 이름만 빼고 모든 면에서 통치합니다. 세계가 부르지만 왕국은 응답하지 않습니다. 전통이 §R승리했고§!, 그 대가는 잃어버린 수십 년으로 치릅니다."
 SAU_liberalisation_bop_low_range_desc: "개혁파가 §G발판§!을 마련했습니다. 새로운 관청, 새로운 학교, 새로운 사상이 틈새로 스며듭니다."
 SAU_liberalisation_bop_medium_range_desc: "§L왕세자§!의 프로그램이 새로운 정통입니다. 대학이 늘어나고, 관광이 열리며, 여성이 운전합니다."
 SAU_liberalisation_bop_advanced_range_desc: "개혁이 개혁을 뒤따릅니다. §L울라마§!가 불평하고 §L부족§!이 불평하지만, §G속도§!는 늦춰지지 않습니다. 왕국은 국민이 소화할 수 있는 속도보다 빠르게 변하고 있습니다."
 SAU_liberalisation_bop_win_range_desc: "사우디아라비아는 2000년의 왕국과는 §G알아볼 수 없을 만큼§! 달라졌습니다. 외국 자본, 외국 관광, 외국 문화. 개혁파가 §G승리했습니다§! - 그러나 §Y성직자들§!은 잊지 않았습니다."
 SAU_Monarchy_house_of_al_saud_desc: "사우드 가문은 사우디아라비아 왕국의 통치 가문입니다. 1932년 압둘아지즈 이븐 사우드가 세웠으며, 이후 정치적 동맹, 종교적 정통성, 석유 부에서 비롯된 경제력의 결합으로 나라의 지배권을 유지해 왔습니다."
 SAU_Military_Rule_desc: "최고 군사 평의회가 왕국을 통치합니다. 왕좌는 남아 있으나 부처들은 다른 곳에 답하고 있으며, 리야드를 장악한 장교들은 나라를 붙들고 있는 것이 장악하는 것보다 훨씬 어렵다는 사실을 깨닫고 있습니다."
 SAU_gip_network: "§HGIP 지부 네트워크§!"
 SAU_gip_network_tt: "지부, 위장 신분, 담당관 - 총정보청의 상시 역량입니다.\n"
 SAU_gip_slots_cap_tt: "§Y총정보청은 최대 3명의 추가 요원만 운용할 수 있습니다§! - 지부는 이미 구축되었으며, 더 열 수 있는 자리가 없습니다."
 SAU_stage1_decision_gate_tt: "§Y이 결정은 1단계가 시작된 후에 나타납니다.§!"
 SAU_stage2_decision_gate_tt: "§Y이 결정은 2단계가 시작된 후에 나타납니다.§!"
 SAU_stage3_decision_gate_tt: "§Y이 결정은 3단계가 시작된 후에 나타납니다.§!"
 SAU_vision2030_commitment_tt: "§R왕국은 이제 약속에 묶였습니다. 프로젝트를 완수하거나, 깨진 약속의 반발에 직면해야 합니다.§!"
 SAU_tadawul_matured_tt: "§G타다울이 완전 상장에 도달했습니다§! - 거래소는 더 이상 끌어올릴 수 없으므로, 상장 자금은 대신 §H새로운 사무 공간§!에 투입됩니다:"
 SAU_events.402.t: "접어 둔 경쟁"
 SAU_events.402.d: "테헤란의 접근이 받아들여졌습니다. 대사관이 다시 문을 열고, 이슬람 공화국에 대한 공세는 축소되며, 우리를 찬탈자라 부르던 성직자들의 설교는 조용히 수정될 것입니다. 헤즈볼라의 총구도 후견국과 함께 우리에게서 돌아섭니다. 경쟁은 잊히지 않았지만, 당분간은 접어 두었습니다."
 SAU_events.402.a: "우정이라기보다는 차가운 평화이지만, 대안보다는 낫다."
 SAU_accession_to_the_sco: "SCO 가입"
 SAU_accession_to_the_sco_desc: "리야드는 2023년 상하이 협력 기구의 대화 파트너가 되었습니다. 정회원 가입은 중국 및 러시아와의 관계를 심화시키겠지만, 이란과의 더욱 긴밀한 협력도 요구하게 될 것입니다."
 SAU_the_royal_saudi_air_force: "사우디 왕립 공군"
 SAU_the_royal_saudi_air_force_desc: "사우디 왕립 공군(RSAF)을 걸프 지역 최강의 공군력으로 육성하십시오."
 SAU_peace_sun_f_15_eagle_program: "피스 선: F-15 이글 프로그램"
 SAU_peace_sun_f_15_eagle_program_desc: "미국과 함께 피스 선 프로그램을 개시하여 F-15 이글을 왕국에 도입합니다."
 SAU_f_15c_d_eagle_squadrons: "F-15C/D 이글 비행대대"
 SAU_f_15c_d_eagle_squadrons_desc: "F-15C/D 이글 비행대대를 배치하여 사우디 상공의 제공권을 장악하고 유지합니다."
 SAU_f_15s_eagle: "F-15S 이글"
 SAU_f_15s_eagle_desc: "피스 선 IX에 따라 제공 전투와 종심 타격이 모두 가능한 F-15S 이글을 도입합니다."
 SAU_tornado_gr4: "토네이도 GR4"
 SAU_tornado_gr4_desc: "영국과의 알 야마마 협정으로 토네이도 GR4가 사우디군에 도입됩니다. 그 타격 능력에는 영국의 훈련, 부품, 정비에 대한 장기적 의존이 따라옵니다."
 SAU_panavia_tornado: "파나비아 토네이도"
 SAU_panavia_tornado_desc: "타격, 정찰, 방공 임무를 수행하는 파나비아 토네이도 비행대대를 배치합니다."
 SAU_the_european_typhoon_al_salam_deal: "유럽의 타이푼: 알 살람 계약"
 SAU_the_european_typhoon_al_salam_deal_desc: "새로운 세기를 위한 현대적 다목적 전투기인 타이푼 도입을 위해 알 살람 계약에 서명합니다."
 SAU_f_15sa_advanced_eagle: "F-15SA 어드밴스드 이글"
 SAU_f_15sa_advanced_eagle_desc: "F-15SA는 단순한 구매가 아닙니다. 그 항전 장비, 무장, 정비 요건을 충족하려면 어드밴스드 이글을 계속 비행 가능한 상태로 유지할 수 있는 사우디의 지원 기반이 필요합니다."
 SAU_e_3_sentry_awacs: "E-3 센트리 AWACS"
 SAU_e_3_sentry_awacs_desc: "E-3 센트리 AWACS를 운용하여 전체 공중 상황을 파악 및 통제하고 전투기를 유도합니다."
 SAU_aerial_refueling_fleet: "공중 급유 편대"
 SAU_aerial_refueling_fleet_desc: "급유기 편대를 구축하여 사우디 전투기가 왕국 전역을 초계하고 원거리를 타격할 수 있도록 합니다."
 SAU_c_130_hercules_airlift: "C-130 허큘리스 공수"
 SAU_c_130_hercules_airlift_desc: "C-130 허큘리스 수송기 편대를 확대하여 병력과 물자를 어디로든 신속하게 이동시킵니다."
 SAU_king_abdulaziz_air_base: "킹 압둘아지즈 공군 기지"
 SAU_king_abdulaziz_air_base_desc: "다란의 킹 압둘아지즈 공군 기지를 개발하여 동부 지방과 걸프 지역을 방어합니다."
 SAU_king_khalid_air_base: "킹 칼리드 공군 기지"
 SAU_king_khalid_air_base_desc: "하미스 무샤이트의 킹 칼리드 공군 기지를 개발합니다. 이곳은 예멘 국경을 엄호하는 남부의 강화 기지입니다."
 SAU_prince_sultan_air_base: "프린스 술탄 공군 기지"
 SAU_prince_sultan_air_base_desc: "알하르즈의 프린스 술탄 공군 기지를 개발합니다. 이곳은 왕국 깊숙한 곳에 있는 중앙 거점입니다."
 SAU_precision_guided_munitions: "정밀 유도 무기"
 SAU_precision_guided_munitions_desc: "정밀 유도 폭탄과 미사일을 비축하여, 예전에는 여러 번의 출격이 필요했던 목표를 단 한 번의 출격으로 파괴할 수 있도록 합니다."
 SAU_saudi_uav_program: "사우디 UAV 프로그램"
 SAU_saudi_uav_program_desc: "장기 체공 감시 및 정밀 타격을 위한 사우디 드론 프로그램을 시작합니다."
 SAU_air_operations_command: "항공 작전 사령부"
 SAU_air_operations_command_desc: "중앙 항공 작전 사령부를 설립하여 전체 항공 작전을 하나로 계획하고 수행합니다."
 SAU_secure_support_in_the_al_madinah_province: "알 마디나 지방의 지지 확보"
 SAU_secure_support_in_the_al_madinah_province_desc: "메디나에는 예언자의 모스크가 있으며 영향력 있는 성직자 집단이 존재합니다. 그곳 학자들의 지지를 확보하면 평의회의 정통성을 확립하고 종교계의 반대를 줄이는 데 도움이 될 것입니다."
 SAU_the_house_of_al_saud: "알 사우드 가문"
 SAU_the_house_of_al_saud_desc: "압둘아지즈 이븐 사우드는 연장자 순으로 아들들에게 왕위를 물려주는 계승 체계를 확립했습니다. 여섯 명의 국왕과 70년이 지난 지금, 자격을 갖춘 남은 형제들은 고령에 접어들었으며 왕국은 다음 세대로의 계승을 준비해야 합니다."
 SAU_ground_broken_at_rabigh: "라비그 기공식"
 SAU_ground_broken_at_rabigh_desc: "왕국은 라비그에 68제곱킬로미터 규모의 경제 도시 건설을 시작합니다. 200만 명의 주민과 홍해의 주요 항구를 계획한 이 도시는 국가 자금과 함께 민간 투자를 유치하기 위한 여섯 개 경제 도시 중 가장 큰 규모입니다."
 SAU_hold_municipal_elections: "지방 선거 실시"
 SAU_hold_municipal_elections_desc: "21세 이상의 남성이 지방 의회 의석의 절반을 선출하고 나머지는 정부가 임명합니다. 의회는 배수, 가로등, 허가와 같은 서비스에 대해 제한된 권한만을 가지지만, 이 투표는 중요한 정치적 선례를 남깁니다."
 SAU_establish_the_peoples_council: "국민 평의회 설립"
 SAU_establish_the_peoples_council_desc: "왕국은 내정에 관한 법률을 발의할 권한을 가진 선출 평의회를 설립합니다. 국왕은 절대적 거부권을 유지하지만, 이를 행사하는 데는 눈에 띄는 정치적 대가가 따를 것입니다."
 SAU_securing_our_future: "우리의 미래 보장"
 SAU_securing_our_future_desc: "왕국은 허가제, 승인된 편집자, 민감한 주제에 대한 제한을 통해 출판물에 대한 통제를 강화합니다. 이는 조직적인 반대 세력을 약화시키고 체제를 강화하겠지만, 숙련된 졸업생들의 귀국을 막고 각 부처가 솔직한 비판을 받지 못하게 할 것입니다."
 SAU_intervention_in_bahrain: "바레인 개입"
 SAU_intervention_in_bahrain_desc: "반도 방패군은 2011년 3월 바레인 정부의 요청으로 바레인에 개입하여 마나마의 소요를 진압하는 데 일조했습니다. 왕국은 이 약속을 갱신하고, 또 한 번의 GCC 정상회담을 기다리지 않고 할리파 가문을 방어할 준비를 합니다."
 SAU_investigate_the_east: "동부 조사"
 SAU_investigate_the_east_desc: "카티프와 아와미야의 시위는 실업과 구금자 문제에 대한 요구에서 보다 광범위한 정치적 불만으로 확대되었습니다. 내무부는 동부 지방의 반대 활동을 조사하고 확인된 위협에 대응합니다."
 SAU_women_in_the_shura_council: "슈라 위원회의 여성"
 SAU_women_in_the_shura_council_desc: "기본법이 여성의 임명을 금지하지는 않지만, 자문 위원회에서 활동한 여성은 아직 없습니다. 국왕은 여성을 직접 임명할 수 있으나, 보수적인 학자들의 예상되는 반대를 무릅쓰고 임명해야 합니다."
 SAU_the_oil_defense_strategy: "석유 방어 전략"
 SAU_the_oil_defense_strategy_desc: "왕국은 걸프 연안의 소수 석유 시설에 의존하고 있습니다. 통합 석유 방어 전략은 국가가 대안을 개발하는 동안 예산을 조율하고 이들 시설을 보호할 것입니다."
 SAU_national_security_threats: "국가 안보 위협"
 SAU_national_security_threats_desc: "사우디의 국가 안보는 남부 국경의 전쟁, 지하디스트 모집, 유전 인근 시아파 인구의 소요, 왕국 국경 지대의 이란 지원 단체라는 서로 연결된 네 가지 위협에 직면해 있습니다. 네 가지 모두에 대한 정책을 평가하고 조율하기 위해 단일 기관에 자금을 지원합니다."
 SAU_the_riyadh_meeting_operation_decisive_storm: "리야드 회의: 결정적 폭풍 작전"
 SAU_the_riyadh_meeting_operation_decisive_storm_desc: "9개국 연합이 리야드에서 결집하여 2015년 3월 26일 항공 작전과 해상 봉쇄를 결합한 결정적 폭풍 작전을 개시했습니다. 분쟁을 잘 아는 예멘인들의 경고에도 불구하고, 사우디 기획자들은 단기전이 될 것으로 예상했습니다."
 SAU_the_tenth_five_year_plan: "제10차 5개년 계획"
 SAU_the_tenth_five_year_plan_desc: "제10차 5개년 계획은 비석유 부문 성장, 사우디 국민 고용, 경제 다변화를 위한 목표를 설정합니다. 이전의 계획들도 비슷한 약속을 했지만, 줄어드는 비축량 때문에 이행은 갈수록 시급해지고 있습니다."
 SAU_defying_the_ajam: "아잠에 맞서다"
 SAU_defying_the_ajam_desc: "님르 알님르의 처형, 테헤란 주재 사우디 대사관 방화, 외교 관계 단절로 이란과의 경쟁 관계는 급격히 격화되었습니다. 왕국은 양보하는 것처럼 보이느니 경제적, 외교적 대가를 감수할 것입니다."
 SAU_aramco_ipo: "아람코 IPO"
 SAU_aramco_ipo_desc: "사우디아라비아는 2019년 12월 아람코 지분의 1.5%를 타다울에 상장하여 약 250억 달러를 조달했습니다. 이 매각은 왕세자가 제안한 2조 달러의 기업 가치나 해외 상장을 달성하지는 못했지만, 여전히 이 지역에서 가장 큰 규모의 국유 자산 매각으로 남았습니다."
 SAU_vision_2030_announced: "비전 2030 발표"
 SAU_vision_2030_announced_desc: "비전 2030은 2016년 4월, 2조 달러 규모의 국부 펀드, 석유 의존도 감소, 민간 고용 확대, 광범위한 사회 개혁을 목표로 발표되었습니다. 이전의 다변화 계획과 달리 이행 시한을 명확히 정하고 있습니다."
 SAU_saudi_israel_normalization_track: "사우디-이스라엘 관계 정상화 경로"
 SAU_saudi_israel_normalization_track_desc: "사우디아라비아는 이스라엘과 조약이나 대사관 관계가 없지만, 이스라엘 항공기의 영공 통과를 허용하고 은밀한 정보 접촉을 유지하고 있습니다. 리야드는 공개적으로는 팔레스타인 문제의 진전을 계속 요구하면서, 사적으로는 다른 조건에서 관계 정상화를 논의하고 있습니다."
 SAU_establish_corruption_courts: "부패 전담 법원 설립"
 SAU_establish_corruption_courts_desc: "왕국은 전문 부패 전담 법원과 장관 및 왕자에 대한 관할권을 가진 상설 위원회를 설립합니다. 이들의 신뢰성은 일반 공직자뿐 아니라 고위 피고인도 기소하는지에 달려 있을 것입니다."
 SAU_the_ritz_carlton_purge: "리츠칼튼 숙청"
 SAU_the_ritz_carlton_purge_desc: "반부패 캠페인은 약 200명의 왕자와 사업가를 리츠칼튼에 구금하고 상당한 자산을 회수했습니다. 또한 왕실에 대한 왕세자의 권위를 공고히 했습니다."
 SAU_backdoor_deals: "물밑 거래"
 SAU_backdoor_deals_desc: "리츠칼튼 구금자들은 공개 재판 대신 비공개로 협상된 금전적 합의를 거쳐 석방됩니다. 이는 자산을 신속히 회수하게 해 주지만, 투명한 절차의 부재는 법치에 대한 신뢰를 훼손할 것입니다."
 SAU_a_new_kingdom: "새로운 왕국"
 SAU_a_new_kingdom_desc: "압둘라는 파흐드가 사망하기 전 약 10년간 파흐드의 이름으로 통치했습니다. 그의 즉위는 헌법 질서를 바꾸지 않지만, 이전에는 제안만 할 수 있었던 정책을 직접 실행할 권한을 그에게 부여합니다."
 SAU_consolidating_the_crown: "왕권 공고화"
 SAU_consolidating_the_crown_desc: "왕명으로 압둘아지즈의 아들과 손자들로 구성된 충성 위원회가 설치되어 왕세자를 승인하고 국왕의 적격 여부를 평가합니다. 이는 최초의 성문 계승 절차를 만들지만, 위원회가 국왕을 얼마나 제약할 수 있을지는 여전히 불확실합니다."
 SAU_scholarship_programs_abroad: "해외 장학 프로그램"
 SAU_scholarship_programs_abroad_desc: "장학 프로그램은 수만 명의 사우디인과 그 가족의 해외 유학을 지원합니다. 이는 왕국의 숙련 인력을 확대하겠지만, 학생들이 사우디아라비아와 다른 정치·사회 체제에 노출되게 할 것입니다."
 SAU_expand_the_national_guard: "국가방위대 확대"
 SAU_expand_the_national_guard_desc: "국가방위대는 역사적으로 압둘아지즈에게 충성해 온 부족에서 모집되며 정규 군 지휘 체계 밖에서 운영됩니다. 이를 확대하면 왕좌를 보호하고 정규 장교단이 왕국의 모든 무력을 장악하는 것을 막을 수 있습니다."
 SAU_joining_the_wto: "WTO 가입"
 SAU_joining_the_wto_desc: "12년간의 협상 끝에 왕국은 관세 상한 설정, 서비스 부문 개방, 외국 은행 및 보험사 허용, 상법 개정을 거쳐 WTO에 가입합니다. 회원 자격은 일부 상업적 자율성을 제한하지만, 사우디아라비아에 석유 수출을 규율하는 체제에 대한 발언권을 줍니다."
 SAU_al_saud_national_dialogue: "국민 대화"
 SAU_al_saud_national_dialogue_desc: "국민 대화는 시아파 성직자, 살라피 학자, 여성, 남성을 한자리에 모아 국가 현안을 논의하고 그 결론을 국왕에게 보고하게 합니다. 입법 권한은 없지만, 이례적으로 폭넓은 공개 토론을 가능하게 합니다."
 SAU_counter_terrorism_cooperation: "대테러 협력"
 SAU_counter_terrorism_cooperation_desc: "2003년 주거 단지 폭탄 테러는 알카에다가 왕국 내 미국인뿐 아니라 사우디 국가도 표적으로 삼고 있음을 보여 주었습니다. 사우디아라비아는 미국 정보기관과의 긴밀한 협력 아래 급습, 감시 대상 명단, 금융 수사, 전투원 재활 프로그램으로 대응합니다."
 SAU_the_atlantic_realignment: "대서양 재편"
 SAU_the_atlantic_realignment_desc: "평의회는 새 정부 아래에서도 사우디의 석유 수출이 계속될 것임을 강조하여 워싱턴의 인정과 지지를 구할 것입니다. 이는 미국이 축출된 군주제보다 사우디 국가와의 관계를 더 중시하는지 시험하는 계기가 될 것입니다."
 SAU_foreign_water_operators: "외국 수자원 운영사"
 SAU_foreign_water_operators_desc: "담수화 사업이 국제 입찰에 부쳐집니다. 플랜트는 왕국이 단독으로 건설한 그 어떤 것보다 빠르게 들어서지만, 이를 운영하는 이들은 해외 본사에 책임을 집니다.\n\n§G외국 수자원 운영사를 부여§!하고 §Y물 위기를 한 단계 완화§!하지만, 그 대가로 §R왕국 내 미국의 영향력§!이 커집니다.\n\n효율적이지만, 수도꼭지에는 영구적인 손길이 놓이게 됩니다."
 SAU_among_the_major_powers: "강대국들 사이에서"
 SAU_among_the_major_powers_desc: "석유는 왕국을 필수불가결한 존재로 만들지만, 필수불가결함이 안전을 뜻하지는 않습니다. 지역 밖으로 눈을 돌려 세계 질서를 형성하는 강대국들 가운데 리야드가 어느 나라에 의지할지 결정하십시오."
 SAU_anti_iranian_propaganda: "반이란 선전"
 SAU_anti_iranian_propaganda_desc: "왕국은 자국의 언론망을 활용하여 이슬람 공화국을 비판하고 이란의 영향력에 맞서는 수니파의 지지를 구축합니다."
 SAU_appoint_loyalists_in_the_provinces: "지방에 충성파 임명"
 SAU_appoint_loyalists_in_the_provinces_desc: "새 정부는 왕족 출신 지방 총독을 충성스러운 현역 장교들로 교체합니다. 이는 왕자들이 가진 중요한 권력의 원천을 제거하고 지방을 군의 통제 아래 둡니다."
 SAU_unity_freedom_socialism: "통일, 자유, 사회주의"
 SAU_unity_freedom_socialism_desc: "바트당의 세 구호가 국법이 됩니다. 아랍 민족의 통일, 식민 지배자로부터의 해방, 그리고 인민을 위한 사회주의입니다."
 SAU_cells_across_the_arab_world: "아랍 세계 전역의 세포 조직"
 SAU_cells_across_the_arab_world_desc: "당은 아랍 각국의 수도에 바트주의 세포 조직을 세워 미래의 혁명을 조직하고 지원합니다."
 SAU_the_sword_of_unity: "통일의 검"
 SAU_the_sword_of_unity_desc: "자발적 통합을 거부하는 아랍 국가들은 무력으로 새로운 질서에 편입됩니다."
 SAU_purge_the_reactionaries: "반동 분자 숙청"
 SAU_purge_the_reactionaries_desc: "혁명 정부는 바트당 통치를 위협하는 군주주의자, 이슬람주의자, 외국 첩자를 제거합니다."
 SAU_the_united_arab_republic: "아랍 연합 공화국"
 SAU_the_united_arab_republic_desc: "아랍의 땅들은 아랍 연합 공화국이라는 단일 혁명 국가로 통합됩니다."
 SAU_one_arab_nation: "하나의 아랍 민족"
 SAU_one_arab_nation_desc: "사이크스와 피코가 그은 국경을 지우고, 영원한 사명을 지닌 아랍 민족은 오직 하나뿐이라는 것을 한 세대에게 가르치십시오."
 SAU_the_vanguard_of_the_arabs: "아랍의 선봉"
 SAU_the_vanguard_of_the_arabs_desc: "아라비아는 대서양에서 걸프에 이르는 아랍 세계의 지도적 지위를 주장하고 더 넓은 민족주의 운동을 지휘합니다."
 SAU_expel_the_imperialists: "제국주의자 추방"
 SAU_expel_the_imperialists_desc: "아랍 땅에서 마지막 외국 기지와 고문단을 몰아내고 식민지 시대의 불평등 조약을 파기하십시오."
 SAU_industrialize_the_nation: "국가 산업화"
 SAU_industrialize_the_nation_desc: "국가 산업 계획으로 제철소, 댐, 공장을 건설하여 공화국이 필수 물자와 무기를 스스로 생산할 수 있도록 합니다."
 SAU_the_revolutionary_command_council: "혁명 지휘 평의회"
 SAU_the_revolutionary_command_council_desc: "당 지도자들로 구성된 평의회에 최고 권한을 부여하여 당과 국가를 하나의 혁명적 의지로 융합합니다."
 SAU_pan_arab_solidarity: "범아랍 연대"
 SAU_pan_arab_solidarity_desc: "팔레스타인에서 마그레브에 이르기까지 모든 아랍인의 투쟁에 함께하며, 아라비아를 민족주의 대의의 후원자로 만드십시오."
 SAU_build_the_party: "당 건설"
 SAU_build_the_party_desc: "혁명은 마을에서 전국 지도부에 이르는 세포 조직을 갖춘 규율 있는 정당을 조직합니다."
 SAU_arab_republic_secular_republic: "세속 공화국"
 SAU_arab_republic_secular_republic_desc: "모스크와 국가를 분리하고 종파가 아닌 아랍 정체성으로 국민을 결속시켜, 수니파와 시아파, 무슬림과 기독교인이 하나로 설 수 있도록 하십시오."
 SAU_the_arab_socialist_path: "아랍 사회주의의 길"
 SAU_the_arab_socialist_path_desc: "자본주의와 소련식 공산주의를 모두 거부하고 독자적인 아랍 사회주의를 추구합니다. 경제의 핵심 부문은 인민의 손에 두고, 소상인은 자유롭게 둡니다."
 SAU_nationalize_the_heights: "경제 핵심 부문 국유화"
 SAU_nationalize_the_heights_desc: "외국 이권 보유자와 구 가문들로부터 석유, 은행, 대기업을 몰수하여 그 부를 국가를 위해 사용하십시오."
 SAU_land_to_the_peasants: "농민에게 토지를"
 SAU_land_to_the_peasants_desc: "대토지를 해체하여 땅을 경작하는 펠라힌에게 나누어 주고, 농촌에 대한 봉건적 지배를 끝내십시오."
 SAU_the_officer_corps: "장교단"
 SAU_the_officer_corps_desc: "당은 젊은 장교들을 모집하고 군대를 통해 바트주의 교리를 가르치고 강제합니다."
 SAU_arm_the_vanguard: "선봉대 무장"
 SAU_arm_the_vanguard_desc: "정규군과 나란히 정치적으로 신뢰할 수 있는 당 민병대를 설립합니다."
 SAU_forge_the_national_army: "국군 건설"
 SAU_forge_the_national_army_desc: "아랍 민족에 걸맞고 혁명을 국경 너머로 이끌 수 있는 현대적 기계화 군대를 건설하십시오."
 SAU_saudi_aramco: "사우디 아람코"
 SAU_saudi_aramco_desc: "§Y사우디 아라비안 오일 컴퍼니§!는 지구상에서 가장 큰 석유 기업이자 왕국의 중추입니다. 이 갈래는 유전 하나하나씩 석유 부문을 구축한 뒤 아람코에 §Y전략 교리§! - §Y더 많이 생산하거나, 더 많이 정제하거나, 수익을 극대화하기 위해 수출하거나§! - 를 부여하며, 이는 모두 단일한 §Y사우디 아람코§! 국가 정신으로 이어집니다."
 SAU_arm_the_anti_iranian_groups: "반이란 단체 무장"
 SAU_arm_the_anti_iranian_groups_desc: "왕국은 이란의 발루치족과 아랍 소수 민족 가운데 반정부 단체를 무장시켜 분쟁을 이란 영토로 확대합니다."
 SAU_the_saudi_armed_forces: "사우디 군대"
 SAU_the_saudi_armed_forces_desc: "왕국의 육해공군을 단일한 전문 군대로 통합하고 현대화하십시오."
 SAU_lessons_of_the_gulf_war: "걸프전의 교훈"
 SAU_lessons_of_the_gulf_war_desc: "1990년 사담의 이라크가 쿠웨이트를 점령하고 우리 국경에 병력을 집결시켰습니다. 외국 연합군만이 왕국을 구했고, 하프지 전투는 사우디 영토에서 벌어졌습니다. 사막의 폭풍 작전은 우리가 얼마나 타국에 의존하고 있는지를 낱낱이 드러냈으며, 다시는 이런 일이 없어야 합니다."
 SAU_ministry_of_defence_and_aviation: "국방항공부"
 SAU_ministry_of_defence_and_aviation_desc: "국방항공부(MODA)를 전군을 기획하고 예산을 편성하며 지휘할 수 있는 현대적 지휘 기관으로 재편합니다."
 SAU_the_general_staff: "총참모부"
 SAU_the_general_staff_desc: "작전 계획을 작성하고 훈련을 실시하며 작전을 지휘할 전문 총참모부를 구축합니다."
 SAU_the_royal_saudi_land_forces: "사우디 왕립 지상군"
 SAU_the_royal_saudi_land_forces_desc: "사우디 왕립 지상군(RSLF)을 리야드에 본부를 둔 현대적이고 기동성 있는 육군으로 육성합니다."
 SAU_saudi_arabian_national_guard: "사우디아라비아 국가방위대"
 SAU_saudi_arabian_national_guard_desc: "왕좌에 충성하며 왕실과 성지를 지키는 부족 병력인 사우디아라비아 국가방위대(SANG)를 확대합니다."
 SAU_king_abdulaziz_royal_guard: "킹 압둘아지즈 왕실 근위대"
 SAU_king_abdulaziz_royal_guard_desc: "국왕의 신변을 보호하기로 서약한 정예 부대인 왕실 근위 연대를 강화합니다."
 SAU_m1a2_abrams_main_battle_tank: "M1A2 에이브럼스 주력 전차"
 SAU_m1a2_abrams_main_battle_tank_desc: "지역에서 가장 무겁고 가장 강력한 전차이자 사우디 기갑의 중추인 미국의 M1A2 에이브럼스를 도입합니다."
 SAU_armored_brigades: "기갑 여단"
 SAU_armored_brigades_desc: "광활한 사막에서의 결정적 기동전을 위한 중기갑 여단을 편성하고 장비를 갖춥니다."
 SAU_mechanized_infantry: "기계화 보병"
 SAU_mechanized_infantry_desc: "지역을 확보하고 기갑 선봉대를 지원할 기계화 보병을 편성합니다."
 SAU_m109_self_propelled_artillery: "M109 자주포"
 SAU_m109_self_propelled_artillery_desc: "M109 자주 곡사포를 배치하여 사단에 기동성과 방호력을 갖춘 화력 지원을 제공합니다."
 SAU_astros_ii_rocket_artillery: "ASTROS II 로켓 포병"
 SAU_astros_ii_rocket_artillery_desc: "브라질의 ASTROS II 다연장 로켓 시스템을 도입하여 대규모 장거리 포격을 가능하게 합니다."
 SAU_royal_saudi_strategic_missile_force: "사우디 왕립 전략 미사일군"
 SAU_royal_saudi_strategic_missile_force_desc: "전략 미사일군을 독립된 군종으로 창설하여 왕국의 전략적 억지력으로 삼습니다."
 SAU_df_3_ballistic_missiles: "DF-3 탄도 미사일"
 SAU_df_3_ballistic_missiles_desc: "1988년 중국제 DF-3 미사일의 극비 구매는 리야드에 어떤 이웃 수도도 무시할 수 없는 전략적 사정권을 부여했습니다. 그 억지력의 신뢰성을 유지할 부대를 구축하십시오."
 SAU_army_aviation_and_apache_gunships: "육군 항공대와 아파치 건십"
 SAU_army_aviation_and_apache_gunships_desc: "육군 항공 사령부를 창설하고 육군 자체 항공 전력의 전차 사냥꾼인 AH-64 아파치를 도입합니다."
 SAU_special_forces_command: "특수전 사령부"
 SAU_special_forces_command_desc: "급습, 대테러, 적 후방 정찰을 위한 특수전 사령부를 창설합니다."
 SAU_roll_back_iran_in_the_gulf: "걸프에서 이란 몰아내기"
 SAU_roll_back_iran_in_the_gulf_desc: "이란은 정치 및 민병대 네트워크를 이용해 바레인, 이라크 및 걸프 연안 곳곳에서 영향력을 확대하고 있습니다. 왕국은 그 영향력을 줄일 수 있는 현지 정부와 세력을 지원할 것입니다."
 SAU_the_basra_grid_connection: "바스라 전력망 연결"
 SAU_the_basra_grid_connection_desc: "이라크 남부는 이란의 전력을 수입하면서도 정전으로 찌는 듯한 무더위에 시달리고 있습니다. 바스라를 걸프 전력망에 연결하여 이란산 전기를 사우디산 전류로 대체하십시오."
 SAU_counter_iranian_influence: "이란의 영향력 대항"
 SAU_counter_iranian_influence_desc: "이란의 민병대와 자금이 사담이 남긴 공백으로 쏟아져 들어왔습니다. 이라크를 이슬람 공화국의 손아귀에서 떼어 내기 위한 긴 캠페인을 시작하십시오."
 SAU_buy_the_iraqi_parliament: "이라크 의회 매수"
 SAU_buy_the_iraqi_parliament_desc: "왕국은 재정적 후원을 이용해 이라크 의회 블록과 장관들의 지지를 확보할 것입니다. 목표는 바그다드를 테헤란에서 멀어지게 하고 리야드 쪽으로 기울게 하는 것입니다."
 SAU_chinese_mediation: "중국의 중재"
 SAU_chinese_mediation_desc: "중국은 사우디아라비아와 이란 양국의 주요 고객이며 두 나라 사이의 중재를 제안했습니다. 중국의 역할을 받아들이면 더 넓은 전략적 경쟁을 해소하지는 못하더라도 관계를 안정시킬 수 있습니다."
 SAU_the_agrarian_revolution: "농업 혁명"
 SAU_the_agrarian_revolution_desc: "농촌의 변혁이 완료되었으며, 그 잉여 생산물이 도시와 혁명을 먹여 살리고 있습니다."
 SAU_collectivization: "집단화"
 SAU_collectivization_desc: "사유 농장은 공동으로 경작되고 계획에 따르는 거대한 집단 농장으로 통합됩니다."
 SAU_dictatorship_of_the_proletariat: "프롤레타리아 독재"
 SAU_dictatorship_of_the_proletariat_desc: "권력은 어떠한 반대도 용납하지 않는 단일 혁명 정당을 통해 노동 계급에 집중됩니다."
 SAU_ignite_the_gulf: "걸프에 불을 붙이다"
 SAU_ignite_the_gulf_desc: "노동자 국가는 걸프 군주국들의 혁명 운동에 요원과 무기를 제공합니다."
 SAU_land_to_the_fellahin: "펠라힌에게 토지를"
 SAU_land_to_the_fellahin_desc: "대토지는 해체되어 땅을 갈아 온 농민들에게 넘겨집니다."
 SAU_embrace_moscow: "모스크바와의 포옹"
 SAU_embrace_moscow_desc: "아라비아는 소련 블록과 보조를 맞추고 석유를 무기 및 정치적 지원과 맞바꿉니다."
 SAU_nationalize_the_oil_fields: "유전 국유화"
 SAU_nationalize_the_oil_fields_desc: "모래 밑의 부는 왕자들이 아니라 인민의 것입니다. 아람코는 몰수되어 노동자의 통제 아래 놓입니다."
 SAU_the_new_arab_man: "새로운 아랍인"
 SAU_the_new_arab_man_desc: "구질서의 미신과 위계를 쓸어버리는 새로운 혁명 문화를 육성합니다."
 SAU_the_non_aligned_road: "비동맹의 길"
 SAU_the_non_aligned_road_desc: "아라비아는 독자적인 노선을 설정하여 제국주의와 소련의 지배 모두에 맞서는 비동맹 국가들을 이끕니다."
 SAU_soviets_of_the_oil_workers: "석유 노동자 소비에트"
 SAU_soviets_of_the_oil_workers_desc: "선출된 노동자 평의회가 유전을 통치하며 프롤레타리아 국가의 중심 기관을 이룹니다."
 SAU_toward_pan_arab_union: "범아랍 연합을 향하여"
 SAU_toward_pan_arab_union_desc: "혁명은 밖으로 뻗어 나가 다른 진보적 아랍 국가들과의 연합을 모색합니다."
 SAU_the_peoples_republic_of_arabia: "아라비아 인민공화국"
 SAU_the_peoples_republic_of_arabia_desc: "임시 질서는 완전히 구성된 노동자 국가인 아라비아 인민공화국에 자리를 내줍니다."
 SAU_progressive_islam: "진보적 이슬람"
 SAU_progressive_islam_desc: "당은 신앙을 짓밟는 대신 진보적 성직자들을 끌어들여 이슬람과 양립할 수 있는 사회주의를 설파하게 합니다."
 SAU_a_proletarian_nation: "프롤레타리아 국가"
 SAU_a_proletarian_nation_desc: "아라비아는 부족적 소속이나 군주제에 대한 충성이 아닌 노동자와 노동을 통해 국가 정체성을 정의합니다."
 SAU_form_the_red_guard: "적위대 결성"
 SAU_regularize_the_red_guard: "적위대 정규화"
 SAU_regularize_the_red_guard_desc: "혁명 민병대를 표준화된 장비, 훈련된 장교, 이들을 무장시킬 군수 산업을 갖춘 전문 적군으로 육성하십시오."
 SAU_the_peoples_militia: "인민 민병대"
 SAU_the_peoples_militia_desc: "모든 노동자와 농민을 공화국을 수호할 준비가 된 민병으로 무장시켜 혁명을 인민의 손에 두십시오."
 SAU_form_the_red_guard_desc: "석유 노동자와 도시 빈민으로 구성되어 혁명을 수호하기로 서약한 혁명 민병대입니다."
 SAU_rural_literacy_brigades: "농촌 문맹 퇴치 여단"
 SAU_rural_literacy_brigades_desc: "간부들이 농촌 전역으로 흩어져 읽기, 쓰기, 그리고 혁명 교리를 가르칩니다."
 SAU_state_atheism: "국가 무신론"
 SAU_state_atheism_desc: "종교는 대중의 아편이라고 선언됩니다. 성직자는 권력을 박탈당하고 모스크는 침묵에 빠집니다."
 SAU_state_industrialization: "국가 주도 산업화"
 SAU_state_industrialization_desc: "정부는 가속화된 국가 프로그램을 통해 아라비아 전역에 제철소, 댐, 공장을 건설합니다."
 SAU_vanguard_of_the_region: "지역의 선봉"
 SAU_vanguard_of_the_region_desc: "아라비아는 아랍 세계와 걸프 전역의 혁명 선봉으로 자리매김합니다."
 SAU_womens_emancipation: "여성 해방"
 SAU_womens_emancipation_desc: "여성은 법적, 정치적으로 평등한 존재로서 노동 현장과 당에 진출하며, 여성의 참여를 제한하던 구질서의 제약은 끝납니다."
 SAU_a_strategic_partnership_with_china: "중국과의 전략적 동반자 관계"
 SAU_a_strategic_partnership_with_china_desc: "워싱턴 대신 베이징을 왕국의 주요 강대국 파트너로 선택합니다. 중국의 자본과 무기는 훈계 없이 제공되지만, 과거 미국이 해 주던 보장 또한 없습니다."
 SAU_conscript_the_kingdom: "왕국 징병"
 SAU_conscript_the_kingdom_desc: "왕국은 전통적으로 징병이 아닌 신뢰할 수 있는 부족의 지원병에 의존해 왔습니다. 평의회는 가용 인력을 늘리기 위해 대규모 군대의 정치적 위험을 감수할 것입니다."
 SAU_oil_for_security: "안보를 위한 석유"
 SAU_oil_for_security_desc: "이 거래는 USS 퀸시호 회담만큼이나 오래되었습니다. 사우디 원유는 미국 경제를 돌아가게 하고, 미국의 무기는 왕국을 안전하게 지켜 줍니다. 왕국을 떠받치는 오일 달러 동반자 관계를 심화하십시오."
 SAU_cooperation_with_the_east: "동방과의 협력"
 SAU_cooperation_with_the_east_desc: "세계 경제의 무게중심은 아시아로 이동하고 있으며, 아시아는 석유에 목말라 있습니다. 왕국을 동방의 신흥 강국들에게 개방하고 신뢰할 수 없는 서방에 대비하십시오."
 SAU_cooperation_with_the_west: "서방과의 협력"
 SAU_cooperation_with_the_west_desc: "워싱턴과 그 동맹국들은 압둘아지즈 국왕 시절부터 걸프의 안보를 보장해 왔습니다. 왕국을 서방 진영에 확고히 묶고 세계의 석유를 세계의 보호와 맞바꾸십시오."
 SAU_engage_the_new_baghdad: "새로운 바그다드와의 관계 구축"
 SAU_engage_the_new_baghdad_desc: "바그다드에는 시아파가 주도하고 테헤란이 구애하는 새 정부가 들어섰습니다. 오랜 적대감을 삼키고 새로운 이라크를 아랍의 품으로 이끌어 오십시오."
 SAU_counter_the_baathist_remnant: "바트당 잔당 대응"
 SAU_counter_the_baathist_remnant_desc: "사담이 쓰러졌든 비틀거렸을 뿐이든, 바트당은 여전히 이라크의 그늘에서 하나의 세력으로 남아 있습니다. 구정권 강경파에게 권력으로 돌아갈 어떠한 길도 허용하지 마십시오."
 SAU_declare_the_republic_of_arabia: "아라비아 공화국 선포"
 SAU_declare_the_republic_of_arabia_desc: "군주제는 무너졌고 임시 평의회가 인민의 이름으로 권력을 쥐고 있습니다. 이제 낡은 왕국은 영원히 해체되고, 왕조의 혈통이 아닌 시민의 의지에 기반한 새로운 국가, 아라비아 공화국이 선포됩니다."
 SAU_the_defense_industries_act: "방위산업법"
 SAU_the_defense_industries_act_desc: "사우디아라비아는 오랫동안 수입 무기와 외국산 예비 부품에 의존해 왔습니다. 방위산업법은 비용이 더 들고 단기적 효율이 떨어지더라도, 가능한 경우 국내 생산을, 필요한 경우 면허 생산을 의무화합니다."
 SAU_disband_the_national_guard: "국가방위대 해체"
 SAU_disband_the_national_guard_desc: "국가방위대는 정규군에 맞서 왕좌를 보호하기 위해 충성스러운 부족으로 창설되었습니다. 평의회는 그 연대를 해체하고 병력에게 정규군의 자리를 제공하여 군주제의 독자적인 군사 기반을 제거할 것입니다."
 SAU_the_economy_under_military_order: "군사 질서 하의 경제"
 SAU_the_economy_under_military_order_desc: "장교들이 아람코, SABIC, 항만, 주요 계약업체의 통제권을 장악합니다. 석유 사업은 기존 기술자들 아래 계속될 수 있지만, 군정은 경제의 다른 부문에서 효율을 떨어뜨릴 가능성이 높습니다."
 SAU_emergency_tribunal: "비상 재판소"
 SAU_emergency_tribunal_desc: "군 당국 아래 소집되어 항소 없이 열리며, 일반 법원이 관할권을 부여받은 적 없는 범죄를 재판하는 법정입니다. 울라마에게는 재판 형식에 대해서만 자문을 구하고, 판결에 대해서는 구하지 않습니다."
 SAU_energy_subsidies_for_jordan: "요르단 에너지 보조금"
 SAU_energy_subsidies_for_jordan_desc: "요르단에는 자체 석유가 없어 시장의 모든 급등을 고스란히 겪고 있습니다. 값싼 연료와 할인된 원유로 요르단 왕국을 사우디의 관대함에 묶어 두십시오."
 SAU_aid_sudan: "수단 원조"
 SAU_aid_sudan_desc: "하르툼에는 테헤란이 제공하지 못한 자금이 필요합니다. 사우디의 원조는 이란과의 결별을 이끌어 낼 수 있지만, 이미 서방의 제재로 고립된 정부와 리야드를 묶어 놓게도 됩니다."
 SAU_side_with_algeria: "알제리 편들기"
 SAU_side_with_algeria_desc: "리야드는 알제와 라바트의 경쟁이 마그레브를 갈라놓는 상황에서 두 곳 모두에 똑같이 따뜻하게 구애할 수 없습니다. 알제리는 이슬람주의 반란에 맞서 힘겹게 얻은 경험을 제공하지만, 알제리를 택하면 같은 군주국인 모로코와의 관계가 식게 됩니다."
 SAU_back_the_brotherhood: "형제단 지원"
 SAU_back_the_brotherhood_desc: "이집트는 형제단의 발상지이자 아랍 세계의 중심입니다. 이 운동을 지원하면 리야드는 해외에서 대중적인 이슬람주의 네트워크를 얻게 되지만, 투표함에서의 형제단을 두려워하는 정부들과 마찰을 빚을 위험이 있습니다."
 SAU_back_the_strongman: "강권 통치자 지원"
 SAU_back_the_strongman_desc: "이집트의 장군들은 질서, 형제단에 대한 적대, 그리고 아랍 세계의 중심을 지탱할 만큼 강력한 국가를 약속합니다. 사우디의 자금은 그 질서를 유지하고 카이로를 리야드와 보조를 맞추게 할 수 있습니다."
 SAU_befriend_the_turks: "튀르키예와의 우호"
 SAU_befriend_the_turks_desc: "[befriend_the_turks_description]"
 SAU_contain_the_turks: "튀르키예 견제"
 SAU_contain_the_turks_desc: "튀르키예가 중동에서 자국의 이익을 추구하도록 내버려 둘 수 없습니다. [TUR.GetLeader]의 정치적 이슬람 지지는 우리 정부를 전복하려 할지도 모르는 위험한 포퓰리즘 운동을 강화할 위험이 있습니다."
 SAU_influence_muslim_europe: "무슬림 유럽에 영향력 행사"
 SAU_influence_muslim_europe_desc: "발칸에는 리야드를 바라볼 이유가 거의 없는 무슬림 공동체가 있습니다. 장학금, 모스크, 자선 네트워크는 공통의 신앙을 유럽에서의 지속적인 사우디 영향력으로 바꿀 수 있습니다."
 SAU_influence_north_africa: "북아프리카에 영향력 행사"
 SAU_influence_north_africa_desc: "마그레브는 동쪽의 리야드보다 북쪽의 유럽과 남쪽의 아프리카를 더 자주 바라봅니다. 사우디의 자금과 외교는 이를 바꿀 수 있지만, 모든 행보는 알제리와 모로코 사이의 경쟁에 휘말리게 됩니다."
 SAU_side_with_morocco: "모로코 편들기"
 SAU_side_with_morocco_desc: "모로코는 군주제 통치를 유지하고 알제리의 영향력을 제한한다는 왕국의 이해를 공유합니다. 라바트를 편들면 자연스러운 파트너를 강화하지만, 알제의 문은 닫힙니다."
 SAU_sanction_sudan: "수단 제재"
 SAU_sanction_sudan_desc: "[SUD.GetLeader]의 지도부는 국제적 논란에 시달려 왔습니다. 그의 통치 아래 수단은 테러 지원국이자 주요 인권 침해국이라는 비난을 받았습니다. 이후 서방 국가들이 이 불량 국가를 제재했으며, 우리도 이를 따라야 합니다."
 SAU_sanction_turkey: "튀르키예 제재"
 SAU_sanction_turkey_desc: "우리의 경고에도 불구하고 튀르키예는 아랍 세계에 계속 간섭하고 있습니다. 튀르키예가 제국주의적 야망을 더 키우지 못하도록 억제하기 위해 강압적 조치를 사용할 수밖에 없습니다."
 SAU_security_guarantees: "안보 보장"
 SAU_security_guarantees_desc: "앙카라와의 긴밀한 관계도 위기 속에서 사라진다면 별 가치가 없습니다. 상호 보장은 튀르키예와 사우디의 안보를 하나로 묶고, 한쪽을 공격하면 양쪽을 모두 상대해야 한다고 모든 적에게 경고할 것입니다."
 SAU_turkish_bases: "튀르키예 기지"
 SAU_turkish_bases_desc: "튀르키예에 군사적 접근을 허용하면 앙카라가 왕국을 보호할 직접적인 이유를 갖게 됩니다. 그러나 이는 경쟁 관계의 지역 강국에게 사우디 영토 위의 발판을 내주는 일이기도 합니다."
 SAU_libyan_arms_shipments: "리비아 무기 수송"
 SAU_libyan_arms_shipments_desc: "분열된 리비아는 외국 무기와 자금의 경매장이 되었습니다. 서방 강국들이 물러나는 가운데, 사우디의 수송은 우호적 파벌과 리비아의 석유 및 항구를 둘러싼 투쟁에서의 입지를 살 수 있습니다."
 SAU_the_faisalite_resurgence: "파이살주의의 부활"
 SAU_the_faisalite_resurgence_desc: "파이살주의 노선이 한 세대의 방치 끝에 돌아옵니다. 이는 긴축, 자립, 그리고 워싱턴에 의존하는 대신 움마를 대표하는 왕국을 요구합니다."
 SAU_centralization_of_the_provincial_emirates: "지방 에미리트 중앙집권화"
 SAU_centralization_of_the_provincial_emirates_desc: "지방 에미르들은 건국 이래 자신의 지역을 사유지처럼 운영해 왔습니다. 리야드는 그들의 칙허장을 회수하고 더 짧고 철회 가능하며 국왕이 서명한 새 칙허장을 발급합니다."
 SAU_the_sovereign_civil_service: "주권 공무원 제도"
 SAU_the_sovereign_civil_service_desc: "공무원 제도는 임명에 시험을, 승진에 근무 기록을 활용합니다. 이는 정부 고용에 대한 가문 연줄의 영향력을 줄일 것입니다."
 SAU_reorganization_of_the_majlis_ash_shura: "마즐리스 알슈라 재편"
 SAU_reorganization_of_the_majlis_ash_shura_desc: "무타입은 마즐리스 알슈라를 확대 및 재편하고 실질적인 정부 업무에 접근할 수 있게 합니다. 이는 국왕에게 종속된 채로 남겠지만, 더 명확한 자문 및 행정 역할을 얻을 것입니다."
 SAU_the_national_cadre_initiative: "국가 인재 양성 구상"
 SAU_the_national_cadre_initiative_desc: "왕국은 사우디 시민을 훈련시켜 전략적으로 중요한 직종의 외국인 노동자를 대체합니다. 자국 인력이 경험을 쌓는 동안 단기적 효율은 떨어질 수 있습니다."
 SAU_the_fortress_kingdom: "요새 왕국"
 SAU_the_fortress_kingdom_desc: "파이살주의 정부는 기관을 공고히 하고 반대 세력을 제거했으며 외세의 영향력을 줄였습니다. 이제 왕국은 이 자율성이 고립을 뒷받침할지, 더 적극적인 독자 정책을 뒷받침할지 결정해야 합니다."
 SAU_the_spirit_of_73: "73년의 정신"
 SAU_the_spirit_of_73_desc: "1973년의 석유 금수 조치는 사우디의 생산 정책이 서방 정부들에게 영향을 줄 수 있음을 보여 주었습니다. 왕국은 이 영향력을 이용해 추가적인 정치적 양보를 얻어 내는 방안을 검토할 것입니다."
 SAU_the_international_forums_question: "국제 포럼 문제"
 SAU_the_international_forums_question_desc: "왕국은 국제연합과 IMF 같은 기구를 통해 자국의 이익을 추구할지, 아니면 규칙 제정에 거의 역할을 하지 못한 체제에서 탈퇴할지 결정해야 합니다."
 SAU_the_superpower_engagement_question: "초강대국 관계 문제"
 SAU_the_superpower_engagement_question_desc: "두 초강대국 블록 모두 사우디의 편입을 원합니다. 리야드는 양쪽에서 구매하며 독립을 유지할 수도 있고, 자체 무기 생산을 개발하여 의존도를 줄일 수도 있습니다."
 SAU_eradicate_foreign_dependency: "외국 의존 근절"
 SAU_eradicate_foreign_dependency_desc: "왕국은 필수 수입품에 대한 의존을 전략적 취약점으로 간주합니다. 따라서 수입품이 더 저렴하더라도 국내 대체가 우선됩니다."
 SAU_the_foreign_wealth_question: "해외 자산 문제"
 SAU_the_foreign_wealth_question_desc: "사우디아라비아는 서방 은행과 국채에 수천억 달러를 보유하고 있습니다. 이 자산을 본국으로 송환하면 외국의 영향력은 줄어들지만, 해외에 두는 편이 여전히 더 안전하고 수익성이 높습니다."
 SAU_increase_the_ulemas_authority: "울라마의 권위 강화"
 SAU_increase_the_ulemas_authority_desc: "조용히 밀려났던 평의회에 학자들이 복귀합니다. 파이살은 울라마를 곁에 두고 통치했으며, 그의 후계자들도 달리 행세하지 않을 것입니다."
 SAU_the_domestic_supply_quota: "국내 조달 할당제"
 SAU_the_domestic_supply_quota_desc: "모든 부처, 계약업체, 정유소는 사우디산 제품을 일정 비율 이상 구매해야 합니다. 국산품은 처음에는 비용이 더 들고 성능이 떨어질 수 있지만, 할당제는 국가의 역량을 키울 것입니다."
 SAU_the_sovereign_aid_question: "국가 원조 문제"
 SAU_the_sovereign_aid_question_desc: "사우디의 원조는 무슬림 공동체에 대한 무조건적 지원으로 배분될 수도, 정치적 양보를 얻는 데 쓰일 수도 있습니다. 왕국은 종교적 연대와 전략적 영향력 중 어느 쪽이 원조를 좌우할지 결정해야 합니다."
 SAU_islamic_solidarity_conference: "이슬람 연대 회의"
 SAU_islamic_solidarity_conference_desc: "리야드는 이슬람 연대 회의를 소집하고 그 진행 비용을 부담합니다. 이 회의는 사우디가 후원하는 기관을 통해 무슬림 세계를 조율하던 파이살의 방식을 되살릴 것입니다."
 SAU_the_expatriate_workforce_question: "외국인 노동력 문제"
 SAU_the_expatriate_workforce_question_desc: "900만 명의 외국인 노동자가 사우디 경제를 떠받치고 있지만, 이는 국가적 자립이라는 파이살주의의 목표와 충돌합니다. 그 역할을 줄이는 데는 경제적 비용이 들고, 유지하면 사우디화가 제한될 것입니다."
 SAU_reclaim_the_oic_leadership: "OIC 지도력 회복"
 SAU_reclaim_the_oic_leadership_desc: "이슬람협력기구는 제다에 본부를 두고 있습니다. 리야드는 자금 지원과 개최국의 지위를 활용하여 기구의 의제를 더욱 적극적으로 이끌어 갈 것입니다."
 SAU_the_global_ummah_question: "세계 움마 문제"
 SAU_the_global_ummah_question_desc: "두 성지 모스크에 대한 왕국의 통제는 세계 무슬림 가운데 지도력을 주장할 독보적인 근거를 부여합니다. 왕국은 그 지위를 세계 움마에 대한 적극적인 책임으로 전환할지 결정해야 합니다."
 SAU_splendid_isolation: "영예로운 고립"
 SAU_splendid_isolation_desc: "왕국은 블록, 종속 관계, 해외 캠페인에서 물러납니다. 국경 방어, 신앙 수호, 석유 자원 관리에 집중할 것입니다."
 SAU_the_virtue_committees_return: "미덕 위원회의 귀환"
 SAU_the_virtue_committees_return_desc: "미덕 장려 및 악덕 방지 위원회가 잃었던 거리를 되찾습니다. 그들의 순찰대는 다시 눈에 띄게 되었고, 그들이 전하는 메시지도 마찬가지입니다."
 SAU_the_third_way_doctrine: "제3의 길 교리"
 SAU_the_third_way_doctrine_desc: "왕국은 워싱턴과 모스크바 양쪽과의 제휴를 거부하고 리야드가 이끄는 독립적인 무슬림 국가 블록을 조직합니다. 이 블록은 자체 무기 생산에 의존하며 오직 움마에만 응답할 것입니다."
 SAU_ban_foreign_media: "외국 언론 금지"
 SAU_ban_foreign_media_desc: "위성 안테나는 철거되고 지국은 문을 닫으며, 왕국의 뉴스는 왕국 안에서 쓰입니다. 세계가 사우디아라비아에 대해 말하는 내용은 더 이상 국내 문제가 아닙니다."
 SAU_the_closed_frontier: "닫힌 국경"
 SAU_the_closed_frontier_desc: "비자는 까다로워지고 계약은 만료되며 외국인 거주 구역은 비어 가기 시작합니다. 왕국은 더 가난하더라도 자기 자신이 되기를 택합니다."
 SAU_purge_the_westernized_elite: "서구화된 엘리트 숙청"
 SAU_purge_the_westernized_elite_desc: "각 부처는 보스턴이 아닌 리야드에서 교육받은 이들로 채워지기 시작합니다. 외국 학위와 외국 습관을 가지고 귀국한 이들은 자신의 기록이 재검토되고 사무실이 재배정되는 것을 보게 됩니다."
 SAU_the_foreign_bases_question: "외국 기지 문제"
 SAU_the_foreign_bases_question_desc: "외국군의 접근은 왕국에 외부의 보호를 제공하지만, 아라비아 내 외국 군대를 모욕으로 여기는 성직자들을 분노하게 합니다. 리야드는 그 보호가 주권과 종교적 정통성이라는 대가를 치를 만한 가치가 있는지 결정해야 합니다."
 SAU_sever_the_western_pact: "서방 협약 단절"
 SAU_sever_the_western_pact_desc: "왕국은 외국 기지를 폐쇄하고 그 주둔군의 철수를 요구합니다. 이는 사우디의 영토 통제권을 회복시키지만 중요한 외부 안보 보장을 끝냅니다."
 SAU_the_base_retention_edict: "기지 유지 칙령"
 SAU_the_base_retention_edict_desc: "외국 기지와 그 보급 체계는 유지됩니다. 정부는 울라마의 종교적 반대에도 불구하고 이 결정을 안보상 필요로 옹호할 것입니다."
 SAU_fight_iran_indirectly: "이란과의 간접 대결"
 SAU_fight_iran_indirectly_desc: "이슬람 공화국과의 공개 전투는 양측 모두를 파멸시킬 것입니다. 대신 대리 세력과 불안한 지방들을 통해 테헤란을 소모시키되, 공개적인 전쟁의 선은 결코 넘지 마십시오."
 SAU_modon_industrial_cities: "MODON 산업 도시"
 SAU_modon_industrial_cities_desc: "얀부, 라스 알하이르, 주바일에는 석유 터미널 이상의 공간이 있습니다. MODON은 이곳을 시멘트 공장, 알루미늄 제련소, 비료 공장으로 채워 수입품을 국내산 제품으로 대체할 것입니다."
 SAU_the_return_of_national_capital: "국가 자본의 귀환"
 SAU_the_return_of_national_capital_desc: "사우디의 재산은 국내 프로젝트가 자금을 기다리는 동안 해외 부동산, 은행, 증권에 묶여 있습니다. 상무부는 그 자본이 돌아와 왕국 안에서 일할 이유를 제공할 것입니다."
 SAU_jeddah_islamic_port_expansion: "제다 이슬람 항 확장"
 SAU_jeddah_islamic_port_expansion_desc: "제다는 왕국의 홍해 관문입니다. 새로운 로로선 터미널과 철도 연결이 더 많은 화물을 내륙으로 운반하고 항구가 늘어나는 무역을 앞서가도록 할 것입니다."
 SAU_the_supreme_economic_council: "최고 경제 위원회"
 SAU_the_supreme_economic_council_desc: "네 개의 부처가 경제 정책의 일부를 주장하지만 서로에게 책임을 지지 않습니다. 최고 경제 위원회는 이들에게 하나의 테이블, 하나의 의제, 분쟁을 해결할 하나의 권위를 제공합니다."
 SAU_sabics_global_expansion: "SABIC의 세계 확장"
 SAU_sabics_global_expansion_desc: "SABIC은 국내 시장을 넘어섰습니다. GE 플라스틱스와 같은 인수는 이 기업에 걸프 지역을 훨씬 넘어서는 새로운 소재, 특허, 고객을 가져다줄 것입니다."
 SAU_the_jubail_ii_expansion: "주바일 II 확장"
 SAU_the_jubail_ii_expansion_desc: "주바일 II는 석유화학 이상의 것을 중심으로 성장할 것입니다. 하디드 제철 단지의 확장은 사우디 건설업에 철근과 평판 강재의 국내 공급원을 제공할 것입니다."
 SAU_the_saudi_export_program: "사우디 수출 프로그램"
 SAU_the_saudi_export_program_desc: "사우디의 공장들은 국내 시장만으로는 성장할 수 없습니다. 수출 프로그램은 플라스틱, 정제 연료, 시멘트를 왕국을 주로 원유로만 알아 온 아시아, 아프리카, 라틴 아메리카 시장으로 실어 나를 것입니다."
 SAU_sabic_agri_nutrients: "SABIC 농업 영양소"
 SAU_king_abdullah_financial_district: "킹 압둘라 금융 지구"
 SAU_king_abdullah_financial_district_desc: "킹 압둘라 금융 지구는 은행, 투자 펀드, 다국적 파트너에게 리야드의 단일 주소를 제공합니다. 그 빌딩에서 체결되는 계약은 사우디 산업에 외국 자본과 전문 지식을 들여올 수 있습니다."
 SAU_sabic_agri_nutrients_desc: "SABIC은 이미 사우디의 가스를 화학 제품으로 바꾸고 있습니다. 암모니아와 요소 생산을 확대하면 왕국은 주요 비료 공급국이 되어 아라비아를 훨씬 넘어서는 농장들을 먹여 살릴 것입니다."
 SAU_economic_diversification: "경제 다변화"
 SAU_economic_diversification_desc: "석유는 계속 왕국의 최대 사업이겠지만, 모든 사업일 필요는 없습니다. 자본은 제조업, 서비스업, 물류로 이동하여 원유 가격의 하락이 더 이상 모든 사우디 급여 명부에 미치지 않도록 할 것입니다."
 SAU_non_oil_exports: "비석유 수출"
 SAU_non_oil_exports_desc: "유조선이 누구나 알아보는 유일한 사우디 수출품이어서는 안 됩니다. 플라스틱, 화학 제품, 시멘트, 기계류는 무역 장부에서 자기 자리를 차지하고 해외 소득이 원유에 덜 의존하게 만들 수 있습니다."
 SAU_economic_liberalization: "경제 자유화"
 SAU_economic_liberalization_desc: "민간 기업이 문을 열기 위해 왕자와 보조금, 그리고 일 년 치의 서명이 필요해서는 안 됩니다. 인허가의 미로를 줄이고 기업들이 특혜가 아닌 고객을 두고 경쟁하게 하십시오."
 SAU_sabic_technology_and_innovation: "SABIC 기술 및 혁신"
 SAU_sabic_technology_and_innovation_desc: "값싼 원료만으로는 SABIC이 영원히 경쟁력을 유지할 수 없습니다. 촉매, 폴리머, 생산 방식에 대한 연구는 사우디 공장 곁에 사우디 특허를 놓을 수 있습니다."
 SAU_the_2000s_oil_boom: "2000년대 석유 호황"
 SAU_the_2000s_oil_boom_desc: "유가가 오르며 국고를 채우고 타다울도 함께 끌어올리고 있습니다. 이 호황은 주기가 다시 뒤바뀌기 전에 왕국이 투자한다면 새로운 산업을 뒷받침할 수 있습니다."
 SAU_the_national_industrial_strategy: "국가 산업 전략"
 SAU_the_national_industrial_strategy_desc: "10개년 산업 전략은 부처와 기업을 철강, 기계, 사우디 고용, 수출 성장에 대한 공통 목표로 묶을 것입니다. 마침내 예산 규모 이상의 것으로 성과를 측정할 수 있게 됩니다."
 SAU_the_mining_sector: "광업 부문"
 SAU_the_mining_sector_desc: "1997년에 설립된 마아덴은 광업을 석유 및 석유화학과 나란히 경제의 §Y세 번째 기둥§!으로 만듭니다. 알잘라미드의 인산염, 마흐드 아드다하브의 금, 그리고 라스 알하이르로 향하는 보크사이트와 알루미늄이 그 대상입니다."
 SAU_the_tourism_sector: "관광 부문"
 SAU_the_tourism_sector_desc: "2000년에 설립된 §Y관광 최고 위원회§!는 왕국의 유산, 홍해 연안, 그리고 무엇보다도 §Y메카와 메디나 순례§!를 연중 지속되는 영구적인 산업으로 만듭니다."
 SAU_the_construction_boom: "건설 호황"
 SAU_the_construction_boom_desc: "석유 호황 투자로 리야드, 제다, 담맘에서 고층 빌딩, 쇼핑몰, 도로 및 기타 도시 기반시설을 포함한 대규모 건설이 이루어집니다."
 SAU_the_digital_economy: "디지털 경제"
 SAU_the_digital_economy_desc: "§Y통신정보기술위원회§!(2001)는 통신 독점을 끝내고 왕국을 연결합니다. 이동통신망, 광대역, 최초의 전자정부 서비스가 모든 지방에 도달합니다."
 SAU_the_eighth_development_plan: "제8차 개발 계획"
 SAU_the_eighth_development_plan_desc: "5년 동안의 지출에는 부처 목록 이상의 것이 필요합니다. 제8차 개발 계획은 2009년까지 정부의 경제 및 사회 프로젝트를 조율할 것입니다."
 SAU_the_industrial_path: "산업의 길"
 SAU_the_industrial_path_desc: "철강, 제련, 가공은 사무실보다 공장을 앞세웁니다. 산업의 길은 국내에 산업 역량을 만들어 내지만, 더 많은 자본, 노동력, 수입 기계를 요구합니다."
 SAU_the_services_path: "서비스의 길"
 SAU_the_services_path_desc: "은행, 물류, 금융, 관광은 새 제철소를 기다리지 않고도 사우디 졸업생을 고용할 수 있습니다. 서비스 중심 경제는 중공업에 대한 투자가 적게 필요하며 왕국의 물질적 필요 중 더 많은 부분을 수입에 맡기게 됩니다."
 SAU_the_balanced_path: "균형의 길"
 SAU_the_balanced_path_desc: "산업과 서비스가 함께 나아가며 투자를 양쪽에 분산합니다. 이 절충안은 한 부문에 대한 의존을 피합니다. 어느 쪽도 원하는 만큼의 자본을 모두 얻지는 못합니다."
 SAU_the_ninth_development_plan: "제9차 개발 계획"
 SAU_the_ninth_development_plan_desc: "2015년의 사우디 경제는 1995년의 경제와 전혀 다릅니다. 제조업만으로도 10년 전 석유 수출의 가치를 능가합니다."
 SAU_the_saudi_landbridge: "사우디 대륙 교량"
 SAU_the_saudi_landbridge_desc: "사우디 대륙 교량은 홍해의 제다 이슬람 항과 걸프의 리야드 및 담맘을 철도로 연결합니다. 화물은 아라비아를 돌아 항해하지 않고 반도를 가로지르게 됩니다."
 SAU_stc_privatization: "STC 민영화"
 SAU_stc_privatization_desc: "STC는 더 이상 정부 부처의 속도로 확장할 수 없습니다. 민영화는 광통신망과 이동통신망에 새로운 자본을 투입하겠지만, 국가 통신사에 대한 공공 통제는 약해질 것입니다."
 SAU_the_saudi_electricity_company: "사우디 전력 회사"
 SAU_the_saudi_electricity_company_desc: "공장과 도시는 전력망보다 빠르게 성장하고 있습니다. 사우디 전력 회사는 새로운 가스 터빈을 동서 횡단 송전망에 연결하여 정전이 개발의 한계를 정하지 못하게 할 것입니다."
 SAU_urban_development: "도시 개발"
 SAU_urban_development_desc: "리야드, 제다, 담맘은 도로, 공공 설비, 주택보다 빠르게 성장하고 있습니다. 혼잡이 왕국의 다음 병목이 되기 전에 도시 계획이 따라잡아야 합니다."
 SAU_the_real_estate_development_fund: "부동산 개발 기금"
 SAU_the_real_estate_development_fund_desc: "주요 도시의 주택은 평범한 사우디 가정이 감당할 수 없는 수준으로 치솟고 있습니다. 부동산 개발 기금은 새로운 주거지에 자금을 대고 주택 대기자 명단을 줄일 것입니다."
 SAU_the_north_south_railway: "남북 철도"
 SAU_the_north_south_railway_desc: "남북 철도는 북부 광산의 인산염과 보크사이트를 걸프로 실어 나르는 동시에, 오랫동안 도로에 의존해 온 내륙 도시들을 연결합니다. 철도는 왕국 전역의 화물 운송 비용을 줄일 것입니다."
 SAU_king_abdullah_economic_city: "킹 압둘라 경제 도시"
 SAU_king_abdullah_economic_city_desc: "라비그, 마디나, 자잔에 계획된 도시들은 나머지 경제의 속도를 늦추는 서류 절차에서 벗어나도록 만들어졌습니다. 이들의 간소화된 규칙은 새로운 도시가 낡은 관료제를 앞지를 수 있는지 시험할 것입니다."
 SAU_the_labour_law_of_2005: "2005년 노동법"
 SAU_the_labour_law_of_2005_desc: "외국인 노동력이 현대 왕국을 건설했지만, 후견인 제도는 노동자를 고용주에 묶어 두고 사우디인을 민간 급여 명부에서 배제합니다. 2005년 법은 카팔라의 일부를 완화하는 한편 기업이 시민을 고용하도록 압박할 것입니다."
 SAU_tatweer_education_reform: "타트위르 교육 개혁"
 SAU_tatweer_education_reform_desc: "주입식 학습으로는 새로운 경제가 필요로 하는 기술자와 관리자를 공급할 수 없습니다. 타트위르는 교육 과정을 개정하고, 종교 수업 시간을 줄이며, 4학년부터 교실에 영어를 도입할 것입니다."
 SAU_king_fahd_medical_city: "킹 파흐드 의료 도시"
 SAU_king_fahd_medical_city_desc: "전문 진료는 소수의 병원과 소수의 도시에 집중되어 있습니다. 킹 파흐드 의료 도시와 새로운 지방 시설은 치료를 위해 리야드까지 갈 수 없는 사우디인도 그 수준의 진료를 받을 수 있게 할 것입니다."
 SAU_kaust: "KAUST"
 SAU_kaust_desc: "대학은 정문 위의 이름이 아니라 그 안에서 이루어지는 연구로 명성을 얻습니다. KAUST, KFUPM, KAU의 더 큰 연구 예산은 사우디 학자들에게 해외에서 경쟁할 실험실과 연구비를 제공할 것입니다."
 SAU_k_a_care_renewable_energy: "K.A.CARE 재생 에너지"
 SAU_k_a_care_renewable_energy_desc: "왕국은 세계에서 가장 강한 햇빛 중 하나를 가졌음에도 전기를 만들기 위해 귀중한 석유를 태우고 있습니다. K.A.CARE는 사카카와 두마트 알잔달에서 태양광과 북부의 풍력을 결합하여 또 다른 미래를 시험할 것입니다."
 SAU_royal_decree_m_30_capital_market_law: "왕명 M/30, 자본 시장법"
 SAU_royal_decree_m_30_capital_market_law_desc: "2003년 7월 31일 파흐드 국왕이 발포한 왕명 M/30은 자본 시장법을 제정했습니다. 이는 타다울과 사우디 자본 시장 규제를 위한 현대적 법적 틀을 확립합니다."
 SAU_the_2007_legal_reforms: "2007년 법률 개혁"
 SAU_the_2007_legal_reforms_desc: "왕국의 2007년 법률 개혁은 정식 법인 설립을 성문화하고 공인된 법적 실체를 만드는 명확한 규칙을 확립합니다. 이제 기업은 더 예측 가능한 기업 체계 아래에서 운영될 수 있습니다."
 SAU_the_qualified_foreign_investor_program: "적격 외국인 투자자 프로그램"
 SAU_the_qualified_foreign_investor_program_desc: "§Y2015년 6월 15일§!, §Y자본시장청§!은 최초로 §Y타다울§!을 외국 기관 투자자의 직접 투자에 개방합니다. 운용 자산이 최소 §Y50억 달러§! 이상인 펀드는 현지 중개인 없이 사우디 주식을 매수할 수 있으며, 이는 §YMSCI 신흥 시장§! 편입으로 가는 길의 시작입니다."
 SAU_msci_emerging_markets_inclusion: "MSCI 신흥 시장 편입"
 SAU_msci_emerging_markets_inclusion_desc: "§Y2018년 6월§!, §YMSCI§!는 사우디아라비아를 독립 시장에서 신흥 시장으로 승격한다고 발표합니다. 이행은 §Y2019년 5월§!에 시작되어 §Y2019년 8월§!의 2단계로 마무리됩니다. 편입이 완료되면 §Y타다울§!은 지수에서 약 §G2.83%§!를 차지하게 되며 §G140억~160억 달러§!의 패시브 투자를 유치할 것으로 예상됩니다."
 SAU_the_kafalah_sme_program: "카팔라 중소기업 프로그램"
 SAU_the_kafalah_sme_program_desc: "카팔라 프로그램은 사우디 기업가들이 중소기업을 설립할 수 있도록 우대 대출, 간소화된 절차, 교육을 제공합니다."
 SAU_the_aramco_ipo: "아람코 IPO"
 SAU_the_aramco_ipo_desc: "§Y2019년 12월 11일§!, §Y사우디 아람코§!는 §Y타다울§!에 상장하여 초기에 §G256억 달러§!, 그린슈 옵션 이후 §G294억 달러§!를 조달합니다. 이는 §Y알리바바의 2014년 상장§!을 넘어선 §G역사상 최대 규모의 IPO§!가 되며, §Y뉴욕§!이나 §Y런던§!이 아닌 §Y리야드§!에 상장된 채로 남습니다."
 SAU_the_saudi_financial_and_banking_laws: "사우디 금융 및 은행법"
 SAU_the_saudi_financial_and_banking_laws_desc: "1966년의 은행 감독법과 2003년에 제정된 자본시장법 및 협동보험법은 사우디 금융의 주요 법적 틀을 제공합니다. 이들은 함께 은행, 보험사, 시장 참여자에 대한 명확한 의무와 처벌을 확립합니다."
 SAU_the_capital_market_authority: "자본시장청"
 SAU_the_capital_market_authority_desc: "사우디 가계의 재산이 주가에 달려 있는 한 증권 거래소는 스스로를 감시할 수 없습니다. 자본시장청은 상장 규칙을 정하고, 부정 행위를 조사하며, 타다울이 규제 기관에 책임을 지도록 할 것입니다."
 SAU_edaa_the_securities_depository: "에다아: 증권 예탁원"
 SAU_edaa_the_securities_depository_desc: "증권 예탁 센터인 §Y에다아§!는 타다울 거래를 결제하고 전자 소유 기록을 유지합니다. 이 현대적 기반시설은 국내외 투자자를 위한 시장의 신뢰성을 높일 것입니다."
 SAU_the_saudi_logistics_hub: "사우디 물류 거점"
 SAU_the_saudi_logistics_hub_desc: "왕국은 제다, 담맘, 리야드를 활용하여 아시아, 아프리카, 유럽 전역의 무역로를 잇는 물류 거점을 개발합니다."
 SAU_establish_joint_stock_conglomerates_jsc: "합자 회사 집단(JSC) 설립"
 SAU_establish_joint_stock_conglomerates_jsc_desc: "주요 국영 기업을 공개 주식회사로 전환하면 시민과 기관 투자자가 산업 확장을 위한 자본을 제공할 수 있습니다. 이는 신규 사업이 국고의 직접 자금 지원에 의존하는 정도를 줄여 줍니다."
 SAU_the_saudi_sukuk_programme: "사우디 수쿠크 프로그램"
 SAU_the_saudi_sukuk_programme_desc: "§Y2017년§!부터 §Y재무부§!는 지속적인 국채 수쿠크 프로그램을 시작하며, 첫 국제 발행만으로도 §G90억 달러§!에 이릅니다. 샤리아 준수 채권은 사우디 정부 재정과 기업 자본 조달의 주요 수단이 됩니다. 왕국과 §Y말레이시아§!가 세계 이슬람 채권 시장을 양분합니다."
 SAU_limited_liability_company_llc: "유한 책임 회사(LLC)"
 SAU_limited_liability_company_llc_desc: "2016년에 발효된 2015년 회사법은 주식회사와 함께 유한 책임 회사를 위한 현대적 법적 구조를 확립합니다. 보호된 자본과 공인된 법적 지위는 국내 기업이 공급망을 구축하고 국제 기업과 제휴하는 데 도움이 될 것입니다."
 SAU_the_gulfs_economic_engine: "걸프의 경제 엔진"
 SAU_the_gulfs_economic_engine_desc: "더욱 강해진 왕국 경제는 지역 노동자, 금융 전문가, 자본을 인접 시장에 빼앗기지 않고 리야드로 끌어들일 것입니다."
 SAU_one_stop_shop: "원스톱 숍"
 SAU_one_stop_shop_desc: "외국 기업들은 한때 사업 등록을 위해 여러 부처를 상대하며 §Y수년§!을 보냈습니다. SAGIA의 §Y원스톱 숍§!은 이러한 인허가 단계를 §G단일 창구§!로 통합하여 지연과 §Y부패§!의 기회를 줄입니다."
 SAU_open_strategic_sectors: "전략 부문 개방"
 SAU_open_strategic_sectors_desc: "§Y통신§!, §Y보험§!, §Y광업§!이 외국 자본에 개방됩니다. 새로운 경쟁자들은 §Y기술§!과 §Y전문 지식§!을 가져오는 동시에 국가가 후원하는 기업들이 현대화하도록 강제할 것입니다."
 SAU_foreign_investment_law_of_2000: "2000년 외국인 투자법"
 SAU_foreign_investment_law_of_2000_desc: "§Y2000년 4월§!의 외국인 투자법은 외국인이 대부분의 부문에서 사우디 기업의 §G100%§!를 소유하는 것을 허용합니다. 기존의 소유 제한을 없애는 것은 훨씬 더 많은 국제 자본을 유치하기 위함입니다."
 SAU_economic_cities_drive: "경제 도시 추진"
 SAU_economic_cities_drive_desc: "홍해의 §Y킹 압둘라 경제 도시§!, 메디나의 §Y지식 경제 도시§!, 하일의 §Y프린스 압둘아지즈 빈 무사이드 도시§!를 포함해 여섯 개의 새로운 경제 도시가 계획되어 있습니다. 각 도시는 주요 석유 생산 지역 밖에서 산업, 서비스, 무역을 위한 §Y목적형 거점§!이 될 것입니다."
 SAU_international_partnerships: "국제 파트너십"
 SAU_international_partnerships_desc: "§Y제너럴 일렉트릭§!, §Y다우 케미칼§!, §Y스미토모§!, §Y미쓰비시§!와의 합작 투자는 §Y기술§!과 §Y경영 전문 지식§!을 왕국에 들여올 것입니다. 사우디 기술자들은 이들 파트너와 함께 일하며 앞으로의 프로젝트를 국내에서 관리하는 데 필요한 역량을 개발할 것입니다."
 SAU_tax_incentive_package: "세제 혜택 패키지"
 SAU_tax_incentive_package_desc: "외국인 투자자에 대한 법인세율이 §Y45%§!에서 §G20%§!로 인하되며, 개인 소득은 §G비과세§!로 유지됩니다. SAGIA는 외국 자본을 유치하기 위해 이러한 조건을 국제적으로 홍보할 것입니다."
 SAU_saudi_arabia_open_for_business: "사우디아라비아, 사업을 환영합니다"
 SAU_saudi_arabia_open_for_business_desc: "이제 인허가는 여러 곳이 아닌 하나의 창구를 거치고, 외국 기업은 자신이 지은 것을 소유할 수 있으며, 새로운 경제 도시들은 그들의 자본을 두고 경쟁합니다. 사우디아라비아는 더 이상 투자자들에게 관료제를 눈감아 달라고 요구하지 않으며, 사업을 환영합니다."
 SAU_ras_tanura_and_abqaiq: "라스 타누라와 아브카이크"
 SAU_complete_nationalization: "완전 국유화"
 SAU_complete_nationalization_desc: "§Y1973년에서 1980년 사이§!, 왕국은 아라비안 아메리칸 오일 컴퍼니의 미국 측 파트너 지분을 모두 인수합니다. 아람코는 전적으로 사우디가 소유하게 되며, 이것이 §Y사우디 아람코§!입니다."
 SAU_the_master_gas_system: "마스터 가스 시스템"
 SAU_the_master_gas_system_desc: "§Y1975년§!에 시작된 마스터 가스 시스템은 한때 유정 입구에서 §Y태워 버리던§! 가스를 포집하여 왕국의 새로운 산업에 값싼 에너지와 원료를 공급합니다."
 SAU_saudi_petroleum_engineers: "사우디 석유 기술자"
 SAU_saudi_petroleum_engineers_desc: "다란의 §YKFUPM§!은 한 세대의 사우디 석유 기술자와 지질학자를 양성합니다. 아람코의 인력은 왕국에서 가장 §Y사우디화§!된 인력이 됩니다."
 SAU_the_ghawar_field: "가와르 유전"
 SAU_the_ghawar_field_desc: "§Y가와르§!는 지금까지 발견된 가장 큰 재래식 유전으로, 동부 지방 지하로 280km에 걸쳐 뻗어 있습니다. 수십 년 동안 이 유전 하나만으로 왕국 원유의 절반 이상을 생산합니다."
 SAU_ras_tanura_and_abqaiq_desc: "세계 최대의 석유 항구인 §Y라스 타누라§!와 §Y아브카이크§! 안정화 단지는 아람코 원유 생산의 상당 부분을 모으고, 처리하고, 수출합니다. 이들 시설을 확장하고 보호하는 것은 왕국의 석유 부문에 필수적입니다."
 SAU_downstream_integration: "다운스트림 통합"
 SAU_downstream_integration_desc: "원유 판매를 중단하십시오. §Y주바일, 얀부, 라비그§!의 정유소와 석유화학 단지는 모든 원유 한 배럴을 §Y국내에서§! 더 높은 부가가치의 연료와 플라스틱으로 바꾸며, SABIC에 원료를 공급합니다."
 SAU_petrorabigh_and_satorp: "페트로라비그와 SATORP"
 SAU_petrorabigh_and_satorp_desc: "(일본의 스미토모와 함께 2005년에 설립한) §Y페트로라비그§!와 (프랑스의 토탈과 함께하는) 주바일의 §YSATORP§!는 사우디 원유를 연료와 화학 제품으로 분해하는 세계적 규모의 합작 투자입니다. 왕국은 원유 수출을 멈추고 §Y제품§! 수출을 시작합니다."
 SAU_doctrine_maximize_production: "교리: 생산 극대화"
 SAU_doctrine_maximize_production_desc: "아람코의 지속 가능한 생산 능력을 §Y하루 1,200만 배럴§!에 가깝게 끌어올립니다. 동부 지방과 룹알할리 사막 전역에 새로운 유전을 개발합니다.\n\n왕국 전역에 §G석유를 생성§!하고 연료를 늘립니다. 이는 §Y전쟁 경제§!의 토대입니다.\n§Y나머지 두 교리와 동시에 선택할 수 없습니다.§!"
 SAU_doctrine_export_powerhouse: "교리: 수출 강국"
 SAU_doctrine_export_powerhouse_desc: "원유는 초대형 유조선에 실려 동서로 흘러갑니다. OPEC의 §Y스윙 생산국§!으로서 왕국은 석유를 세계에서 가장 신뢰할 수 있는 §Y오일 달러§! 수입원으로 바꿉니다.\n\n§G자원 수출 수입§!과 반복적인 국고 수입을 얻습니다. 이는 §Y화폐 경제§!의 토대입니다.\n§Y나머지 두 교리와 동시에 선택할 수 없습니다.§!"
 SAU_new_mega_fields: "신규 초대형 유전"
 SAU_new_mega_fields_desc: "룹알할리 사막 깊숙한 곳의 §Y샤이바§!(1998), §Y쿠라이스§!(2009), 해상의 §Y마니파§!(2013) 등 새로운 세대의 거대 유전이 아람코의 생산 능력을 더욱 끌어올립니다. §G더 많은 석유가 흘러나옵니다.§!"
 SAU_opec_swing_producer: "OPEC 스윙 생산국"
 SAU_opec_swing_producer_desc: "왕국의 여유 생산 능력은 OPEC의 §Y스윙 생산국§!으로서 행동하며 국제 유가에 영향을 미치게 해 줍니다. 이는 수입을 위해 가격을 올리거나 경쟁자를 압박하기 위해 가격을 낮추는 §YOPEC 석유 지렛대§! 결정을 잠금 해제합니다."
 SAU_the_council_of_economic_and_development_affairs: "경제개발위원회"
 SAU_the_council_of_economic_and_development_affairs_desc: "2015년에 설립된 §Y경제개발위원회§!는 각 부처를 조율하고 정부의 경제 개혁 프로그램의 이행을 감독합니다."
 SAU_the_worlds_most_valuable_company: "세계에서 가장 가치 있는 기업"
 SAU_the_worlds_most_valuable_company_desc: "사우디 아람코는 §Y지구상에서 가장 가치 있는 기업§!이 되었으며 여전히 왕국의 석유 부문과 공공 재정의 중심에 있습니다.\n§Y국가 GDP가 1조 8,000억 달러를 초과해야 합니다.§!"
 SAU_the_national_transformation_program: "국가 변혁 프로그램"
 SAU_the_national_transformation_program_desc: "비전 2030에는 발표 행사 이후에도 살아남을 기한이 필요합니다. §Y국가 변혁 프로그램§!은 각 부처에 목표, 예산, 그리고 성과를 냈는지에 대한 공개 척도를 부여할 것입니다."
 SAU_nazaha_the_anti_corruption_authority: "나자하: 반부패청"
 SAU_nazaha_the_anti_corruption_authority_desc: "국가반부패위원회인 §Y나자하§!는 2011년에 설립되어 공공 기관 전반의 재정 및 행정 부패를 조사합니다. 그 권한은 정부 기관과 공직자에 대한 감독을 강화합니다."
 SAU_the_judicial_reform_of_2007: "2007년 사법 개혁"
 SAU_the_judicial_reform_of_2007_desc: "압둘라 국왕의 §Y2007년 사법 개혁§!은 법원 절차를 성문화하고, 대법원과 전문 재판소를 설치하며, 기업에 더 예측 가능한 법 체계를 제공합니다."
 SAU_tayseer_regulatory_reform: "타이시르: 규제 개혁"
 SAU_tayseer_regulatory_reform_desc: "국가경쟁력센터(§Y타이시르§!)는 투자를 지연시키는 인허가, 승인 및 기타 행정 요건을 줄일 것입니다."
 SAU_the_ministry_of_investment_misa: "투자부(MISA)"
 SAU_the_ministry_of_investment_misa_desc: "SAGIA는 2020년에 §Y투자부§!가 되어 외국인 투자자를 위한 정부 서비스와 정책을 일원화합니다."
 SAU_expec_research_centre: "EXPEC 연구 센터"
 SAU_expec_research_centre_desc: "§Y탐사 및 석유 공학 센터§!는 국내 저류층 모델링 및 시추 기술을 개발합니다. 이는 아람코에 첨단 기술 역량을 부여하고 사우디 지질에 대한 이해를 높여 줍니다."
 SAU_strong_saudi_banks: "강한 사우디 은행"
 SAU_strong_saudi_banks_desc: "알 라지히, NCB, 리야드 은행, 삼바는 사우디 은행들이 세계 100대 은행에 들 때까지 확장할 것입니다."
 SAU_insurance_for_all: "모두를 위한 보험"
 SAU_insurance_for_all_desc: "왕국은 수십 년간의 제한적인 시장 발전 끝에 건강, 자동차, 재산 보험을 확대합니다."
 SAU_grow_the_capital_markets: "자본 시장 육성"
 SAU_grow_the_capital_markets_desc: "더 많은 IPO, 더 큰 유동성, 확대된 외국인 적격 투자자 접근은 타다울을 더 크고 성숙한 거래소로 발전시킬 것입니다."
 SAU_a_saudi_bond_market: "사우디 채권 시장"
 SAU_a_saudi_bond_market_desc: "왕국은 런던에서 도쿄에 이르는 투자자를 끌어들일 수 있는 국채 수쿠크, 회사채 수쿠크, 일반 채권 시장을 개발합니다."
 SAU_the_sakani_housing_program: "사카니 주택 프로그램"
 SAU_the_sakani_housing_program_desc: "§Y사카니§! 프로그램은 토지, 금융, 완공된 주택을 대규모로 공급하여 평범한 사우디인도 내 집 마련을 할 수 있게 합니다."
 SAU_the_national_housing_company: "국가 주택 회사"
 SAU_the_national_housing_company_desc: "§Y국가 주택 회사§!는 표준화된 건설과 마스터플랜 개발을 활용해 주요 도시 주변의 주택을 확대할 것입니다."
 SAU_the_saudi_cement_industry: "사우디 시멘트 산업"
 SAU_the_saudi_cement_industry_desc: "사우디 시멘트, 야마마 및 기타 국내 생산업체들이 건설 프로그램에 공급하고 시멘트 수입을 줄일 것입니다."
 SAU_glass_and_building_materials: "유리 및 건축 자재"
 SAU_glass_and_building_materials_desc: "왕국은 건설 부문에 공급하기 위해 판유리, 도자기, 구조용 강재를 국내에서 생산합니다."
 SAU_vision_2030: "비전 2030"
 SAU_vision_2030_desc: "§Y비전 2030§!은 관광, 산업, 엔터테인먼트, 대규모 개발 프로젝트를 통해 석유 의존도를 줄이려는 왕세자의 계획입니다. 공개된 2030년이라는 기한은 정부가 이러한 개혁을 이행할 직접적인 책임을 지게 만듭니다."
 SAU_qiddiya_and_the_line: "키디야와 더 라인"
 SAU_qiddiya_and_the_line_desc: "§Y키디야§!와 §Y더 라인§!은 왕국의 더 큰 기가 프로젝트 군에 앞서는 엔터테인먼트 및 도시 개발 구상을 도입합니다."
 SAU_the_red_sea_project: "홍해 프로젝트"
 SAU_the_red_sea_project_desc: "§Y홍해 프로젝트§!는 연안을 따라 고급 관광을 개발하고 일부 사우디 섬을 국제 방문객에게 개방합니다."
 SAU_king_salman_international_airport: "킹 살만 국제공항"
 SAU_king_fahd_international_airport: "킹 파흐드 국제공항"
 SAU_king_fahd_international_airport_desc: "담맘의 광대한 킹 파흐드 국제공항은 기록 보유자 이상이 될 여지가 있습니다. 활주로와 공항 수용력을 확장하여 사우디 여객과 화물의 동부 관문으로 만드십시오."
 SAU_king_salman_international_airport_desc: "리야드의 새로운 §Y킹 살만 국제공항§!은 연간 1억 명의 승객을 수용하도록 설계되어 왕국의 관광 및 물류 목표를 뒷받침할 것입니다."
 SAU_king_abdullah_port: "킹 압둘라 항"
 SAU_king_abdullah_port_desc: "지역 최초의 완전 민간 항구인 §Y킹 압둘라 항§!은 주요 컨테이너 거점으로 확장될 것입니다."
 SAU_the_digital_government_authority: "디지털 정부청"
 SAU_the_digital_government_authority_desc: "§Y디지털 정부청§!은 공공 서비스를 공통 온라인 플랫폼에 올리고 종이 기반 행정을 줄일 것입니다."
 SAU_the_e_commerce_boom: "전자상거래 호황"
 SAU_the_e_commerce_boom_desc: "살라, 눈 및 기타 스타트업의 성장은 더 많은 사우디 소매 활동을 온라인으로 옮기고 전자상거래 부문을 확대할 것입니다."
 SAU_fintech_saudi: "핀테크 사우디"
 SAU_fintech_saudi_desc: "STC Pay, 타마라, 오픈 뱅킹 체계는 §Y핀테크 사우디§!가 리야드를 지역 금융 기술 중심지로 발전시킬 수 있게 해 줄 것입니다."
 SAU_kacst_science_and_technology: "KACST: 과학 기술"
 SAU_kacst_science_and_technology_desc: "§Y킹 압둘아지즈 과학기술도시§!는 첨단 소재에서 우주에 이르기까지 왕국의 연구 기반을 떠받칩니다."
 SAU_the_human_capability_program: "인적 역량 프로그램"
 SAU_the_human_capability_program_desc: "새로운 산업에는 이를 운영할 훈련된 사우디인이 필요합니다. §Y인적 역량 개발 프로그램§!은 교실, 직업 학교, 전문 훈련을 왕국이 창출하려는 일자리와 연결할 것입니다."
 SAU_the_national_technology_development_program: "국가 기술 개발 프로그램"
 SAU_the_national_technology_development_program_desc: "국가 기술 개발 프로그램은 석유 수입이 줄어들 때 왕국에 필요한 스타트업과 딥테크에 자금을 지원합니다."
 SAU_the_saudi_space_commission: "사우디 우주 위원회"
 SAU_the_saudi_space_commission_desc: "2018년에 설립된 §Y사우디 우주 위원회§!는 우주비행사 임무, 발사 능력, 국제 우주 부문에서의 사우디의 참여를 발전시킬 것입니다."
 SAU_saudi_satellites_and_arabsat: "사우디 위성과 아랍샛"
 SAU_saudi_satellites_and_arabsat_desc: "SaudiSat 프로그램과 §Y아랍샛§!에 대한 왕국의 지분은 궤도상에서의 사우디 통신 및 관측 능력을 확대할 것입니다."
 SAU_sami_saudi_arabian_military_industries: "SAMI: 사우디아라비아 군수 산업"
 SAU_sami_saudi_arabian_military_industries_desc: "§Y사우디아라비아 군수 산업§!은 2017년에 국방을 현지화하기 위해 설립되었으며, 2030년까지 무기 예산의 절반을 국내에서 지출한다는 목표를 가지고 있습니다."
 SAU_gami_localise_the_arms_industry: "GAMI: 무기 산업 현지화"
 SAU_gami_localise_the_arms_industry_desc: "§Y군수산업총국§!은 거의 아무것도 없는 상태에서 국내 무기 부문을 허가하고 육성합니다."
 SAU_the_saudi_drone_program: "사우디 드론 프로그램"
 SAU_the_saudi_drone_program_desc: "왕국에서 설계하고 제작한 자폭 무기와 정찰 §Y드론§!입니다."
 SAU_the_national_cybersecurity_authority: "국가 사이버보안청"
 SAU_the_national_cybersecurity_authority_desc: "§Y국가 사이버보안청§!(2017)은 아람코와 각 부처에 대한 10년간의 공격 이후 왕국의 네트워크를 강화합니다."
 SAU_sdaia_data_and_artificial_intelligence: "SDAIA: 데이터 및 인공지능"
 SAU_sdaia_data_and_artificial_intelligence_desc: "2019년에 설립된 §Y사우디 데이터 인공지능청§!은 국가 AI 전략을 조율하고, 슈퍼컴퓨팅을 확대하며, 정부 데이터를 실용적으로 활용할 수 있도록 공개할 것입니다."
 SAU_the_national_data_centres: "국가 데이터 센터"
 SAU_the_national_data_centres_desc: "데이터 센터에는 풍부한 전력과 대규모 건설이 필요합니다. 왕국은 둘 다 제공할 수 있으며, 하이퍼스케일 캠퍼스는 더 넓은 지역에 서비스하는 국내 클라우드 산업을 뒷받침할 수 있습니다."
 SAU_the_5g_network: "5G 네트워크"
 SAU_the_5g_network_desc: "STC와 모빌리는 세계에서 가장 빠른 보급 속도 중 하나로 왕국 전역을 §Y5G§!로 뒤덮습니다."
 SAU_absher_and_yesser_e_government: "압셰르와 예세르 전자정부"
 SAU_absher_and_yesser_e_government_desc: "예세르, §Y압셰르§!, 타왁칼나는 정부 서비스를 모바일 플랫폼에 올리고 수백만 건의 대면 업무를 대체할 것입니다."
 SAU_the_health_sector_transformation: "보건 부문 변혁"
 SAU_the_health_sector_transformation_desc: "보건 부문 변혁은 병원을 책임 있는 클러스터로 조직하고, 세하 가상 병원을 확대하며, 민간 보험의 역할을 늘릴 것입니다."
 SAU_madrasati_and_curriculum_reform: "마드라사티와 교육 과정 개혁"
 SAU_madrasati_and_curriculum_reform_desc: "§Y마드라사티§! 플랫폼과 개정된 교육 과정은 암기식 학습에 대한 의존을 줄이는 한편 비판적 사고, 영어, 프로그래밍 교육을 늘릴 것입니다."
 SAU_the_riyadh_metro: "리야드 지하철"
 SAU_the_riyadh_metro_desc: "수도 지하를 달리는 여섯 개 노선, §Y리야드 지하철§!은 단일 단계로 건설된 도시 교통 프로젝트 중 가장 큰 규모에 속합니다."
 SAU_the_national_renewable_energy_program: "국가 재생 에너지 프로그램"
 SAU_the_national_renewable_energy_program_desc: "§Y국가 재생 에너지 프로그램§!은 수십 기가와트의 태양광 및 풍력 발전을 개발하여 전기를 만들기 위해 원유를 태우는 대신 더 많은 원유를 수출할 수 있게 합니다."
 SAU_the_sakaka_solar_plant: "사카카 태양광 발전소"
 SAU_the_sakaka_solar_plant_desc: "§Y사카카§! 발전소는 2018년에 건설을 시작하여 2021년에 왕국 최초의 대규모 태양광 시설로 공식 준공되었습니다. 낮은 전력 가격은 사우디 태양광 발전의 상업적 잠재력을 보여 줍니다."
 SAU_the_dumat_al_jandal_wind_farm: "두마트 알잔달 풍력 단지"
 SAU_the_dumat_al_jandal_wind_farm_desc: "400메가와트 규모의 §Y두마트 알잔달§! 풍력 단지는 북부의 강한 바람을 이용해 재생 전력을 공급하며 중동 최대의 풍력 시설이 될 것입니다."
 SAU_neom_green_hydrogen: "네옴 그린 수소"
 SAU_neom_green_hydrogen_desc: "네옴에는 세계 최대의 §Y그린 수소§! 공장이 들어섭니다. 이 프로젝트는 저렴한 재생 전력을 수출 가능한 연료로 전환하기 위한 것입니다."
 SAU_the_civil_nuclear_program: "민간 원자력 프로그램"
 SAU_the_civil_nuclear_program_desc: "태양광 발전은 매일 저녁 사그라들지만 전력과 담수에 대한 수요는 그렇지 않습니다. 민수용 원자력 계획은 이 둘을 하루 종일 공급할 수 있으나, 왕국은 원자로마다 따라붙는 비용과 감시를 감수해야 합니다."
 SAU_battery_energy_storage: "배터리 에너지 저장"
 SAU_battery_energy_storage_desc: "계통 규모의 배터리가 한낮의 태양광 발전량을 저장하여 저녁 수요 정점에 공급함으로써 재생 에너지의 신뢰성을 높일 것입니다."
 SAU_modernise_the_national_grid: "국가 전력망 현대화"
 SAU_modernise_the_national_grid_desc: "GCC 전력망과 연결된 스마트 §Y국가 전력망§!은 정전을 줄이고 변동성이 큰 재생 에너지 발전을 안정시킬 것입니다."
 SAU_ceer_the_saudi_electric_car: "씨어: 사우디 전기차"
 SAU_ceer_the_saudi_electric_car_desc: "2022년에 설립된 §Y씨어§!와 제다 인근의 루시드 공장은 국내 전기차 생산의 기반을 마련할 것입니다. 이를 통해 사우디아라비아는 수입에만 전적으로 의존하지 않고 차량을 직접 제조할 수 있게 됩니다."
 SAU_fund_vision_2030: "비전 2030 자금 조달"
 SAU_fund_vision_2030_desc: "이토록 거대한 계획은 발표만으로는 지탱할 수 없습니다. 국고 자금과 공공투자기금의 자본을 석유 의존도를 줄이고 민간 부문 일자리를 창출하며 비전 2030이 구상 단계를 넘어섰음을 입증할 사업에 투입하십시오."
 SAU_the_standardized_interest_law: "표준 이자법"
 SAU_the_standardized_interest_law_desc: "이자는 샤리아와 현대 은행업이 갈라지는 단층선에 놓여 있습니다. 왕국은 리바를 전면 금지할 것인지, 기존 대출을 허용할 것인지, 이슬람 형식의 이면에서 이자를 묵인할 것인지 선택해야 합니다."
 SAU_fractional_reserve_mandates: "부분지급준비 의무"
 SAU_fractional_reserve_mandates_desc: "지급준비율이 낮아지면 대출에 쓸 수 있는 예금이 늘어나지만 은행이 인출 사태를 견디는 힘은 약해집니다. 새 의무 규정은 사우디 은행이 예치된 리얄당 얼마만큼의 신용을 창출할 수 있는지 정해야 합니다."
 SAU_the_anti_speculation_directives: "투기 방지 지침"
 SAU_the_anti_speculation_directives_desc: "파생상품은 기업이 가격 변동에 대비해 위험을 분산하게 해 주지만, 같은 수단이 시장을 도박판으로 만들 수도 있습니다. 규제 당국은 유용한 위험 관리와 샤리아가 금지하는 과도한 가라르 사이에 선을 그어야 합니다."
 SAU_the_interbank_lending_code: "은행 간 대출 규약"
 SAU_the_interbank_lending_code_desc: "사우디 은행들은 서로 현금을 주고받을 하룻밤 시장이 필요합니다. 리야드는 이 유동성이 기존의 이자를 통해 흐를지, 상품 무라바하를 통해 흐를지, 아니면 두 체제를 병행할지 선택해야 합니다."
 SAU_the_banking_control_law: "은행 통제법"
 SAU_the_banking_control_law_desc: "은행업을 둘러싼 논쟁은 결국 권한의 문제로 귀결됩니다. SAMA가 독립적인 전문가 기구로서 규제할 것인가, 샤리아 위원회가 거부권을 쥘 것인가, 아니면 양측이 각자의 기관을 감독할 것인가?"
 SAU_bastion_of_islamic_finance: "이슬람 금융의 보루"
 SAU_bastion_of_islamic_finance_desc: "이슬람 금융은 보호받는 사우디의 정통 교리가 될 수도 있고, 더 넓은 무슬림 세계에 판매하는 사업이 될 수도 있습니다. 엄격한 규칙은 울라마의 신뢰를 확보하고, 실용적인 규칙은 더 많은 고객을 리야드로 끌어들입니다."
 SAU_the_secularization_of_finance: "금융의 세속화"
 SAU_the_secularization_of_finance_desc: "모든 서구 금융 상품을 개방하면 외국 자본이 유입되고 은행업이 성직자의 감독에서 벗어나게 됩니다. 점진적인 이행은 반발을 누그러뜨릴 수 있으나, 전통과의 단절은 여전히 남습니다."
 SAU_a_defensive_deal_with_pakistan: "파키스탄과의 방위 협정"
 SAU_a_defensive_deal_with_pakistan_desc: "파키스탄은 무슬림 세계에서 가장 큰 군대를 보유하고 있으며, 그 핵무기는 수니파 국가가 보유한 유일한 핵무기입니다. 이슬라마바드를 두 성원의 수호에 묶어 두십시오."
 SAU_sabic_industrialization: "SABIC 산업화"
 SAU_sabic_industrialization_desc: "§GSABIC§!(사우디 기초산업공사)는 1976년에 설립된 왕국의 석유화학 거대 기업입니다. 사우디의 석유를 플라스틱, 비료, 화학제품으로 바꾸어 현대 경제의 기초 소재를 만들어 냅니다."
 SAU_establish_sagia: "SAGIA 설립"
 SAU_establish_sagia_desc: "왕명으로 §Y사우디아라비아 총투자청§!을 설립하여 §G외국 자본§!을 유치합니다. SAGIA는 인허가 절차를 간소화하고 국제 투자자와 직접 협력하며, §Y리야드§!를 §Y글로벌 비즈니스§!의 중심지로 홍보할 것입니다."
 SAU_tadawul_the_saudi_stock_exchange: "타다울, 사우디 증권거래소"
 SAU_tadawul_the_saudi_stock_exchange_desc: "사우디의 주식 거래는 비공식 시장에서 §G타다울 거래소§!로 성장했습니다. 현대적인 자본 시장이 왕국의 투자 야망을 뒷받침하려면 먼저 공식적인 상장, 공시, 거래 규칙이 필요합니다."
 SAU_the_water_crisis: "물 위기"
 SAU_the_water_crisis_desc: "왕국의 대수층은 고갈되고 있고, §Y담수화 시설§!은 압박이 커지고 있으며, 1인당 물 사용량은 §Y세계 최고 수준§!입니다. 정부는 국가적 대응을 실행하기에 앞서 이 위기를 공식적으로 인정해야 합니다."
 SAU_saudi_foreign_policy: "사우디 외교 정책"
 SAU_saudi_foreign_policy_desc: "왕좌, 성지, 그리고 걸프를 떠나는 모든 유조선은 리야드가 해외에서 하는 행동에 달려 있습니다. 사우디 외교는 강대국들을 가까이 두되, 어느 한 나라도 왕국의 안보를 좌우하지 못하게 해야 합니다."
 SAU_fortify_the_kingdom: "왕국 요새화"
 SAU_fortify_the_kingdom_desc: "이란과의 냉전이 열전으로 바뀐다면 그 타격은 동부 주와 해협에 떨어질 것입니다. 억지력이 무너지는 날에 대비하여 왕국의 방어를 강화하십시오."
 SAU_freedom_or_death: "자유 아니면 죽음"
 SAU_freedom_or_death_desc: "시리아 전쟁은 리야드와 테헤란 사이의 의지 대결이 되었습니다. 반군을 전폭적으로 지원하고 아사드 정권의 몰락에 사우디의 위신을 거십시오."
 SAU_fund_the_jordanian_army: "요르단군 자금 지원"
 SAU_fund_the_jordanian_army_desc: "강력한 요르단군은 왕국의 긴 북쪽 측면을 지켜 줍니다. 암만의 병사들을 재정적으로 뒷받침하여 중요한 순간에 그들이 리야드의 뜻에 따르게 하십시오."
 SAU_fund_the_lebanese_army: "레바논군 자금 지원"
 SAU_fund_the_lebanese_army_desc: "레바논에서 국군은 헤즈볼라의 국가 내 국가에 맞설 유일한 균형추입니다. LAF를 이란 민병대에 맞설 경쟁 축으로 육성하도록 자금을 지원하십시오."
 SAU_fund_the_free_syrian_army: "자유 시리아군 자금 지원"
 SAU_fund_the_free_syrian_army_desc: "아사드 가문에 맞선 봉기는 이란이 바다로 향하는 다리를 끊을 기회입니다. 자유 시리아의 이름으로 싸우는 반군에게 자금과 무기를 보내십시오."
 SAU_guardians_of_the_two_mosques: "두 성원의 수호자"
 SAU_guardians_of_the_two_mosques_desc: "두 성원의 수호자라는 칭호는 국왕에게 다른 무슬림 통치자들에게는 없는 종교적 정당성을 부여합니다. 위원회가 이 칭호를 직접 취할 수는 없으나, 이 역할에서 국왕을 공개적으로 지지함으로써 자신들의 정통성을 강화할 수 있습니다."
 SAU_the_hormuz_shield: "호르무즈 방패"
 SAU_the_hormuz_shield_desc: "이란은 전쟁의 조짐이 보이는 즉시 해협을 봉쇄하겠다고 위협합니다. 테헤란이 무엇을 위협하든 유조선이 계속 항해할 수 있도록, 동맹의 도움을 받아 공군과 해군의 방패를 구축하십시오."
 SAU_the_india_middle_east_corridor: "인도-중동 회랑"
 SAU_the_india_middle_east_corridor_desc: "철도, 항구, 송유관으로 이루어진 새로운 길이 뭄바이에서 아라비아를 거쳐 유럽의 심장부까지 이어질 수 있습니다. 왕국을 이란의 영향권 밖에서 병목 지점을 우회하는 이 회랑의 필수 연결고리로 만드십시오."
 SAU_install_a_loyalist_in_the_government: "정부에 충성파 배치"
 SAU_install_a_loyalist_in_the_government_desc: "현역 장교가 모든 주요 부처에 배치되어 그 결정에 부서할 권한을 갖게 됩니다. 장관들은 직함을 유지하겠지만, 군이 공무원 조직을 직접 통제하게 됩니다."
 SAU_king_fahd_university_of_petroleum_and_minerals: "파흐드 국왕 석유광물대학교"
 SAU_king_fahd_university_of_petroleum_and_minerals_desc: "과학, 기술, 공학, 수학이 우선시됩니다. 왕국에 필요한 것은 성직자가 아니라 기술자입니다. 교육 과정은 그에 맞추어 바뀝니다."
 SAU_the_tatweer_education_project: "타트위르 교육 프로젝트"
 SAU_the_tatweer_education_project_desc: "타트위르 프로젝트는 암기보다 비판적 사고, 분석, 토론을 강조할 것입니다. 이 개혁은 교육 방식과 더 넓은 교육 문화를 모두 바꿉니다."
 SAU_english_language_education: "영어 교육"
 SAU_english_language_education_desc: "사우디 졸업생들이 세계 경제에 더 효과적으로 참여할 수 있도록 영어를 초등학교부터 가르칩니다."
 SAU_the_teachers_colleges: "교원 대학"
 SAU_the_teachers_colleges_desc: "교사들은 교육학, 학급 운영, 교육 기술에 대한 현대적인 훈련을 받게 됩니다."
 SAU_tatweer_smart_schools: "타트위르 스마트 스쿨"
 SAU_tatweer_smart_schools_desc: "타트위르 스마트 스쿨은 교실용 태블릿, 온라인 학습 플랫폼, AI 보조 개인 지도를 도입할 것입니다."
 SAU_king_abdulaziz_university: "압둘아지즈 국왕 대학교"
 SAU_king_abdulaziz_university_desc: "사우드 국왕 대학교, KAUST, KFUPM, 누라 공주 대학교를 비롯한 대학들이 왕국 전역으로 확대되어 고등교육에 대한 접근성을 높일 것입니다."
 SAU_king_abdullah_university_of_science_and_technology: "압둘라 국왕 과학기술대학교"
 SAU_king_abdullah_university_of_science_and_technology_desc: "MIT, 옥스퍼드, 소르본과의 협력과 사우디아라비아 내 외국 대학 캠퍼스는 국제적인 학문적 전문성을 왕국에 들여올 것입니다."
 SAU_the_king_abdullah_scholarship_program: "압둘라 국왕 장학 프로그램"
 SAU_the_king_abdullah_scholarship_program_desc: "압둘라 국왕 장학 프로그램은 수천 명의 사우디 학생이 해외 일류 대학에서 공부하도록 지원할 것입니다. 졸업생들은 고급 자격과 국제 경험을 갖추고 귀국할 것입니다."
 SAU_integrate_gosi_payrolls: "GOSI 급여 대장 통합"
 SAU_integrate_gosi_payrolls_desc: "사회보험총공단은 분담금을 징수하므로 왕국 내 모든 급여 대장에 누가 올라 있는지 이미 알고 있습니다. 그 데이터베이스를 쿼터 문제에 연결할 생각을 한 사람은 아무도 없었습니다.\n\n연결되는 순간 기업의 니타카트 등급이 자동으로 산출되며, 실제로 고용된 사우디인의 수는 더 이상 기업이 마지막으로 신고서에 적어 낸 숫자가 아니게 됩니다."
 SAU_reform_the_kafala_system: "카팔라 제도 개혁"
 SAU_reform_the_kafala_system_desc: "수백만 명의 외국인 노동자가 서류와 출국 허가를 쥔 단일 고용주에게 묶인 채 왕국에서 살고 있습니다. 개혁은 이 제도를 끝내지는 않으나, 더 투명하고 이전 가능하며 훨씬 쉽게 진입할 수 있도록 만듭니다.\n\n유입이 늘어나고 질서가 잡힙니다. 기업들은 누구도 공개적으로 옹호할 수 없던 제도를 우회하는 데 더 이상 돈을 쓰지 않게 됩니다."
 SAU_platinum_tier_privileges: "플래티넘 등급 특권"
 SAU_platinum_tier_privileges_desc: "최상위 등급의 기업은 허가를 즉시 갱신받고, 계약을 가장 먼저 승인받으며, 경쟁자들이 아직 줄을 서 있는 동안 사업 확장도 무사통과합니다.\n\n국고에는 비용이 들지 않으며, 부처가 지금까지 부과한 어떤 벌금보다도 더 많은 준수를 이끌어 냅니다."
 SAU_red_zone_visa_freezes: "적색 구역 비자 동결"
 SAU_red_zone_visa_freezes_desc: "최하위 등급의 기업은 그 등급에서 벗어날 때까지 노동 허가를 단 하나도 갱신할 수 없습니다. 제한이 아니라 동결입니다.\n\n일부는 분기 내에 구조조정을 합니다. 일부는 필요하지도 않은 사우디인을 고용합니다. 일부는 단순히 영업을 중단하며, 부처는 그것을 감수할 수 있다고 판단했습니다."
 SAU_launch_the_qiwa_platform: "키와 플랫폼 출범"
 SAU_launch_the_qiwa_platform_desc: "왕국의 모든 노동 관련 거래(계약, 이직, 쿼터 현황, 허가 신청)를 하나의 포털에서 처리합니다. 한 달 걸리던 우편 서류 작업이 하루 오후면 끝납니다.\n\n이 계획에서 가장 화려하지 않은 사업이지만, 양 진영이 모두 동의하는 유일한 사업이기도 합니다."
 SAU_repeal_the_expatriate_levy: "외국인 부과금 폐지"
 SAU_repeal_the_expatriate_levy_desc: "모든 외국인 노동자에게 매달 부과되던 금액은 사우디인을 다시 민간 급여 대장에 올리도록 가격을 조정하려는 것이었습니다. 실제로는 이윤이 가장 얇은 기업들을 문 닫게 했고 나머지는 장부 밖 고용으로 내몰았습니다.\n\n이를 폐지하면 경제가 돌아가는 데 필요한 노동력이 돌아오지만, 국고에는 아무것도 돌아오지 않습니다."
 SAU_high_skill_visa_fast_track: "고숙련 비자 신속 처리"
 SAU_high_skill_visa_fast_track_desc: "왕국이 아직 길러 내지 못한 기술자, 외과의, 시스템 설계자는 몇 달이 아닌 며칠 만에, 가족과 함께, 여권을 쥔 후견인 없이 입국이 허가됩니다.\n\n왕국은 아직 키워 내지 못한 전문성을 사들입니다."
 SAU_abolish_the_noc_requirement: "NOC 요건 폐지"
 SAU_abolish_the_noc_requirement_desc: "노동자는 현 고용주의 서면 허가 없이도 고용주를 바꿀 수 있습니다. 노동법에서 조항 하나를 삭제하는 것이지만, 이는 이 제도 전체를 지금의 모습으로 만들었던 장치를 끝냅니다.\n\n자본은 이를 알아차립니다. 낡은 규칙의 혜택을 누리던 모든 이들도 마찬가지입니다."
 SAU_the_doroob_training_initiative: "도루브 훈련 구상"
 SAU_the_doroob_training_initiative_desc: "민간 부문이 실제로 구인 공고를 내는 기술을 위한 국가 전자 학습 플랫폼으로, 이용 시점에 무료이며 국민 신분증이 있는 누구에게나 열려 있습니다.\n\n이것이 노동 시장을 고치지는 못합니다. 다만 교육받은 사람이 없었다는 핑계를 없앱니다."
 SAU_the_taqat_employment_portal: "타카트 고용 포털"
 SAU_the_taqat_employment_portal_desc: "국가 노동 관문입니다. 모든 구직자는 하나의 명부에, 규정을 준수하는 모든 일자리는 또 다른 명부에 올라 있어 부처가 마침내 둘 사이의 격차를 볼 수 있게 됩니다.\n\n자잔과 북부 국경 지역이 처음으로 데이터에 나타납니다."
 SAU_the_saudization_quotas: "사우디화 쿼터"
 SAU_the_saudization_quotas_desc: "쿼터는 하나의 국가 수치가 아니라 일정표가 됩니다. 건설, 소매, 통신, 운송 부문이 각각 하한선을 받으며, 해당 부문이 현실적으로 흡수할 수 있는 사우디인의 수에 따라 가중치가 부여됩니다.\n\n부처는 전에도 그 수치를 잘못 잡은 적이 있습니다."
 SAU_subsidize_sme_compliance: "중소기업 준수 보조금"
 SAU_subsidize_sme_compliance_desc: "대기업 집단은 쿼터를 감당할 수 있습니다. 직원 서른 명인 기업은 그럴 수 없으며, 이런 기업들은 왕국의 어떤 대기업 집단보다도 매출 1리얄당 더 많은 사우디인을 고용합니다.\n\n저리 융자, 가벼운 점검 일정, 그리고 성장해 들어갈 사무 공간이 제공됩니다."
 SAU_the_industrial_cadre_mandate: "산업 인력 의무화"
 SAU_the_industrial_cadre_mandate_desc: "중공업은 기술 인력 중 사우디인이 차지해야 할 비율을 통보받고 이를 달성할 10년의 기간을 부여받습니다. 석유화학 대기업들은 이를 감당할 수 있지만, 그 주변의 하청업체들은 배워 가야 할 것입니다.\n\n왕국은 송유관에 손대는 모든 기술자를 수입하는 일을 멈춥니다."
 SAU_hrdf_wage_subsidies: "HRDF 임금 보조금"
 SAU_hrdf_wage_subsidies_desc: "인적자원개발기금은 자국민과 외국인의 격차가 대체로 경험의 격차라는 이론에 따라, 고용 첫 몇 년간 사우디인 채용자의 급여 일부를 지급합니다.\n\n기업들은 보조금을 받습니다. 보조금이 끝난 뒤에도 그 채용자가 살아남는지는 아무도 해결하지 못한 부분입니다."
 SAU_the_wusool_transport_subsidy: "우술 교통 보조금"
 SAU_the_wusool_transport_subsidy_desc: "왕국 졸업생의 절반은 여성이지만 거의 아무도 고용되지 못하고 있으며, 결정적인 제약은 재능이나 허가가 아니라 사무실까지 갈 방법이 없다는 점입니다.\n\n국가가 이동을 보조합니다. 노동력은 어떤 이민 정책도 따라올 수 없는 규모로 늘어납니다."
 SAU_foreign_ownership_deregulation: "외국인 소유 규제 완화"
 SAU_foreign_ownership_deregulation_desc: "외국 기업은 사우디 사업체를 전부 소유할 수 있고, 이견 없이 이익을 본국으로 송금할 수 있으며, 서명 하나를 해 주고 3분의 1을 가져가던 현지 파트너를 건너뛸 수 있습니다.\n\n자본은 빠르게 들어옵니다. 왕국의 산업을 누가 소유하느냐는 질문도 함께 따라옵니다."
 SAU_secondary_education_expansion: "중등교육 확대"
 SAU_secondary_education_expansion_desc: "고등학교가 확대됩니다. 직업 훈련이 늘어납니다. 모든 사우디 청소년이 학문 계열이든 직업 계열이든 중등교육을 받을 수 있게 됩니다."
 SAU_technical_and_vocational_training_corporation: "기술직업훈련공사"
 SAU_technical_and_vocational_training_corporation_desc: "기술 대학은 배관공, 전기공, 정비공, 용접공을 양성합니다. 모든 사우디인에게 대학 학위가 필요한 것은 아닙니다. 경제에는 숙련된 기능직이 필요합니다."
 SAU_saudi_internal_affairs: "사우디 내정"
 SAU_saudi_internal_affairs_desc: "왕국의 내정은 치안, 교육, 보건, 경제 복지를 다룰 것입니다. 이 제도들은 장기적인 안정과 발전의 기반이 됩니다."
 SAU_confront_the_literacy_crisis: "문해력 위기 대응"
 SAU_the_anglo_style_curriculum: "영미식 교육과정"
 SAU_the_anglo_style_curriculum_desc: "영미식 교육과정은 비판적 사고, 과학적 탐구, 교실 토론을 사우디 학교에 더 많이 들여올 것입니다. 울라마가 이를 외부의 침입으로 보더라도, 경제에는 그러한 습관이 필요합니다."
 SAU_confront_the_literacy_crisis_desc: "2000년 현재 사우디인 다섯 명 중 한 명 이상이 글을 읽지 못하여, 왕국의 §Y문해율은 겨우 79%§!에 머물러 있습니다. 석유 자금만으로는 교사, 기술자, 사무원 없이 국가를 현대화할 수 없습니다. 리야드는 §Y영미식 교육과정§!과 §Y학문 계열과 직업 계열로 나뉜 국내 체제§! 중에서 선택해야 합니다.\n\n§G모든 교육 중점은 문해율을 완전 문해에 가깝게 끌어올립니다.§!"
 SAU_education_transformation_complete: "교육 개혁 완료"
 SAU_education_transformation_complete_desc: "대학이 확장되고 교육과정이 바뀌었으며 왕국 전역에서 문해율이 오르고 있습니다. 개혁이 모든 약점을 해결하지는 못했지만, 사우디의 교실은 앞으로의 과업에 더 잘 대비하게 되었습니다."
 SAU_domestic_secondary_tracks: "국내 중등 교육 계열"
 SAU_domestic_secondary_tracks_desc: "사우디의 중등학교는 국내에서 필요한 기술에 맞춰 학문 계열과 직업 계열로 나뉩니다. 이 체제는 외국 모델을 들여오는 것보다 구축 비용이 더 들지만, 사우디의 우선순위에 부응합니다."
 SAU_ministry_of_human_resources_mandate: "인력자원부 권한"
 SAU_the_nitaqat_decree: "니타카트 칙령"
 SAU_the_nitaqat_decree_desc: "왕국은 기업에 사우디인을 고용해 달라고 요청하는 일을 멈추고, 실제로 고용했는지를 등급으로 매기기 시작합니다. 모든 기업은 색깔을 부여받고, 그 색깔이 기업에 허용되는 행위를 결정하며, 색깔은 부처가 이미 들여다볼 수 있는 급여 대장에서 산출됩니다.\n\n이는 왕국 역사상 집행 장치가 붙은 최초의 노동 정책입니다."
 SAU_ministry_of_human_resources_mandate_desc: "부처는 늘 가지고 있다고 여겨져 온 권한을 부여받습니다. 부문별 쿼터를 정하고, 이유를 설명하지 않고 비자를 거부하며, 따르지 않는 기업을 폐쇄하는 권한입니다.\n\n수년간 엉뚱한 부서에 로비를 하던 기업들은 이제 올바른 부서가 생겼다는 사실과, 그 부서가 관심이 없다는 사실을 알게 됩니다."
 SAU_fast_track_government_contracts: "정부 계약 신속 처리"
 SAU_fast_track_government_contracts_desc: "국가가 인프라에 쓰는 모든 리얄이 노동 정책의 수단이 됩니다. 규정을 준수하는 기업이 가장 먼저 입찰하고 가장 먼저 대금을 받으며, 그 사실이 공개적으로 알려집니다.\n\n왕국은 왕국 내 최대 고객입니다. 마침내 그에 걸맞게 물건을 고르기로 결정한 것입니다."
 SAU_gip: "GIP"
 SAU_gip_desc: "GIP가 전문화됩니다. 훈련, 장비, 절차가 국제 표준에 부합하게 됩니다. 왕국의 내부 보안은 더 효과적이 되고, 또한 더 눈에 띄게 됩니다."
 SAU_the_open_market: "개방 시장"
 SAU_the_open_market_desc: "해답은 국가에 묻는 일을 그만두는 것입니다. 소유권 규정이 사라지고 자본 통제가 사라지며, 어떤 기업이 존재할 가치가 있고 어떤 사우디인이 필요한지는 시장이 결정합니다.\n\n더 빠른 길이지만 더 험한 길이기도 합니다. 그 길에서 일자리를 잃은 이를 받쳐 줄 것은 아무것도 없습니다."
 SAU_opec_agreement: "OPEC+ 합의"
 SAU_opec_agreement_desc: "모스크바와 리야드는 석유 시장에서는 경쟁자이고 시리아에서는 반대편에 서 있지만, 함께라면 원유 가격을 정할 수 있습니다. 두 나라의 카르텔을 유지할 거래를 성사시키십시오."
 SAU_command_of_the_gulf: "걸프 제해권"
 SAU_command_of_the_gulf_desc: "이란 해군이 무너지고 해협이 열린 채로 유지되면서, 왕국은 걸프 해역의 주인으로 우뚝 섰습니다. 바다를 둘러싼 오랜 다툼에서 승리를 거두었습니다."
 SAU_the_iraq_war: "이라크 전쟁"
 SAU_the_iraq_war_desc: "미군 전차들이 바그다드를 향해 진격하고 있으며, 메소포타미아의 구질서는 곧 쓸려 나갈 것입니다. 왕국은 잔해 속에서 무엇이 솟아오르든 대비해야 합니다."
 SAU_king_in_name_heir_in_uniform: "이름뿐인 국왕, 군복 입은 후계자"
 SAU_king_in_name_heir_in_uniform_desc: "왕좌는 그대로 유지되지만, 후계자는 왕자인 동시에 위원회가 받아들일 수 있는 현역 장교가 됩니다. 이 타협은 왕조를 보존하면서 계승을 군의 감독 아래 둡니다."
 SAU_the_kingdom_unbeholden: "누구에게도 빚지지 않는 왕국"
 SAU_the_kingdom_unbeholden_desc: "왕국은 외국의 안보 보장과 후견을 거부하고 오직 자국의 방위에만 의존합니다. 가장 비용이 많이 드는 선택이지만, 전략적 독립을 온전히 지킬 수 있습니다."
 SAU_martial_law_issues: "계엄령 선포"
 SAU_martial_law_issues_desc: "군 당국이 집회, 지역 간 이동, 언론을 통제합니다. 왕국에는 정지시킬 헌법이 없기 때문에 이러한 제한은 칙령으로 직접 부과될 수 있습니다."
 SAU_secure_support_in_the_mecca_province: "메카 주 지지 확보"
 SAU_secure_support_in_the_mecca_province_desc: "메카 주에는 제다, 순례 중심지, 영향력 있는 상인 가문, 그리고 사우디 통치보다 앞선 히자즈의 정체성이 있습니다. 위원회는 후원, 보안군, 정치적 양보를 동원하여 이 주를 확보할 것입니다."
 SAU_the_mecca_summit: "메카 정상회담"
 SAU_the_mecca_summit_desc: "왕국은 메카에서 협상을 주최하고, 이 정상회담을 통해 무슬림 세계의 중재자로서 리야드의 입지를 강화할 것입니다."
 SAU_memories_of_khafji: "카프지의 기억"
 SAU_memories_of_khafji_desc: "1991년 이라크의 기갑 부대가 사우디 국경 도시를 잠시 점령했으며, 왕국은 이 굴욕을 결코 잊지 않았습니다. 카프지의 기억이 같은 일의 재발에 맞선 왕국의 방어를 단단하게 하도록 하십시오."
 SAU_the_military_takeover: "군부 장악"
 SAU_the_military_takeover_desc: "군이 각 부처, 방송 권한, 왕궁으로 통하는 진입로를 장악했습니다. 이러한 쿠데타를 막기 위해 창설된 국가방위군은 포위되었고, 군이 왕국을 통제하게 되었습니다."
 SAU_the_monarchy_under_military_rule: "군부 통치하의 군주제"
 SAU_the_monarchy_under_military_rule_desc: "국왕은 궁에 머물며 계속 칙령에 서명하겠지만, 위원회가 군을 통제하고 정부 정책을 결정합니다. 군주제는 독자적 권력이 없는 형식적 제도로 살아남습니다."
 SAU_the_royal_saudi_naval_forces: "사우디 왕립 해군"
 SAU_the_royal_saudi_naval_forces_desc: "두 바다로 나뉜 사우디 왕립 해군(RSNF)을 증강하여 왕국의 긴 해안을 방어하십시오."
 SAU_eastern_fleet_jubail: "동부 함대(주바일)"
 SAU_eastern_fleet_jubail_desc: "동부 함대를 주바일에 배치하여 아라비아만을 장악하고 석유 터미널을 보호하십시오."
 SAU_western_fleet_jeddah: "서부 함대(제다)"
 SAU_western_fleet_jeddah_desc: "서부 함대를 제다에 배치하여 홍해 연안과 밥엘만데브 해협 접근로를 확보하십시오."
 SAU_sawari_ii_frigate_programme: "사와리 II 호위함 계획"
 SAU_sawari_ii_frigate_programme_desc: "사와리 II 계획에 따라 프랑스제 알리야드급 호위함을 도입하십시오. 이는 함대에서 가장 강력한 함선입니다."
 SAU_badr_class_corvettes: "바드르급 초계함"
 SAU_badr_class_corvettes_desc: "순찰, 호위, 연안 타격을 위해 미국제 바드르급 초계함을 배치하십시오."
 SAU_royal_saudi_marines: "사우디 왕립 해병대"
 SAU_royal_saudi_marines_desc: "상륙 작전과 해안 및 도서 방어를 위해 사우디 왕립 해병대를 창설하십시오."
 SAU_king_faisal_naval_base: "파이살 국왕 해군 기지"
 SAU_king_faisal_naval_base_desc: "제다와 주바일의 대형 해군 기지를 개발하여 2개 함대 해군을 뒷받침하십시오."
 SAU_neom_aqaba_synergy: "네옴-아카바 시너지"
 SAU_neom_aqaba_synergy_desc: "사우디의 거대 도시 네옴이 요르단의 항구 아카바와 만나는 곳에서는 두 곳 사이의 만을 가로지르는 단일 경제 구역이 형성될 수 있습니다. 두 해안을 하나의 성장 엔진으로 엮으십시오."
 SAU_deal_with_the_french: "프랑스와의 거래"
 SAU_deal_with_the_french_desc: "파리는 누구에게나 무기를 팔고 모두에게 훈계를 늘어놓지만, 장사는 장사입니다. 신중하게 울타리를 친 투자 협정은 왕국이 더 나은 선택지를 손 닿는 곳에 둔 채 프랑스 산업의 이익을 누리게 해 줍니다."
 SAU_a_new_iraqi_alignment: "새로운 이라크 노선"
 SAU_a_new_iraqi_alignment_desc: "수년에 걸친 인내심 있는 외교와 후원이 결실을 맺어, 바그다드가 마침내 리야드 쪽으로 기울었습니다. 새 노선이 테헤란 쪽으로 되돌아가기 전에 확고히 고정시키십시오."
 SAU_major_non_nato_ally: "주요 비나토 동맹국"
 SAU_major_non_nato_ally_desc: "조약 동맹에 못 미치는 선에서, 한 국가가 대서양 강대국들 곁에 설 수 있는 가장 가까운 자리는 특권적 파트너의 지위입니다. 왕국을 위해 주요 비나토 동맹국의 지위를 확보하십시오."
 SAU_the_palestine_question: "팔레스타인 문제"
 SAU_the_cause_above_all: "무엇보다 대의"
 SAU_the_cause_above_all_desc: "왕국은 팔레스타인 지원을 무슬림 세계 지도력에 대한 주장과 두 성원의 수호자로서의 역할의 중심에 놓을 것입니다."
 SAU_open_the_backchannel: "비공식 채널 개설"
 SAU_open_the_backchannel_desc: "제3국에 있는 조용한 인물들이 부인 가능한 방식으로 끈기 있게, 어느 쪽도 공개적으로 입을 열기 전에 텔아비브가 무엇을 받아들일지 타진합니다."
 SAU_the_arab_peace_initiative: "아랍 평화 구상"
 SAU_the_arab_peace_initiative_desc: "2002년 베이루트에서 제시되어 한 번도 철회되지 않은 왕국 자체의 계획으로, 1967년 경계선에 따른 독립 팔레스타인의 대가로 아랍 세계 전체와의 완전한 관계 정상화를 제안하는 것입니다. 리야드는 이를 공식적으로, 문서로 다시 테이블에 올립니다."
 SAU_sweeten_the_deal: "조건 보강"
 SAU_sweeten_the_deal_desc: "투자 기금, 기술 회랑, 개방된 하늘. 리야드는 걸프 최대 경제권과의 평화가 얼마나 가치 있는지 텔아비브에 보여 줍니다."
 SAU_the_talks_collapse: "협상 결렬"
 SAU_the_talks_collapse_desc: "이스라엘은 대가를 치르려 하지 않았고, 리야드는 그 대가를 낮추려 하지 않았습니다. 대표단은 귀국하고, 문제는 예전의 답으로 되돌아갑니다."
 SAU_the_riyadh_accords: "리야드 협정"
 SAU_the_riyadh_accords_desc: "이스라엘이 아랍 평화 구상을 수용했습니다. 1967년 경계선에 따른 국가 지위를 인정하고, 새로운 팔레스타인은 사우디아라비아와 요르단이 보장합니다. 리야드에서 서명된 세기의 거래입니다."
 SAU_embassies_and_trade: "대사관과 무역"
 SAU_embassies_and_trade_desc: "리야드와 텔아비브 사이에 항공편, 무역 사절단, 자본이 오갑니다. 평화가 스스로 수지를 맞추기 시작합니다."
 SAU_silicon_and_sand: "실리콘과 모래"
 SAU_silicon_and_sand_desc: "이스라엘의 기술과 사우디의 자본은 자연스러운 파트너입니다. 사이버, 수자원, 농업 기술 분야의 합작 사업이 두 사막에 뿌리를 내립니다."
 SAU_double_down_on_palestine: "팔레스타인 지원 강화"
 SAU_double_down_on_palestine_desc: "이스라엘이 국가 지위를 인정하지 않는다면, 왕국은 어떻게든 국가를 세울 것입니다. 라말라를 뒷받침하는 자금, 제도, 그리고 사우디의 영향력으로."
 SAU_rally_the_arab_league: "아랍 연맹 결집"
 SAU_rally_the_arab_league_desc: "결렬된 협상은 망설이던 모든 수도에 그 논점을 입증했습니다. 리야드는 연맹을 하나의 노선 아래 결집시킵니다. 팔레스타인 없는 정상화는 없다는 노선입니다."
 SAU_no_peace_without_palestine: "팔레스타인 없는 평화는 없다"
 SAU_the_fate_of_palestine: "팔레스타인의 운명"
 SAU_the_fate_of_palestine_desc: "조약을 통해서든 저항을 통해서든 왕국은 팔레스타인의 미래에 스스로를 묶었습니다. 두 성원의 수호자는 예루살렘을 저버리지 않습니다."
 SAU_no_peace_without_palestine_desc: "팔레스타인이 점령당한 상태로 남아 있는 한 텔아비브에 대사관은 없을 것입니다. 왕국은 아랍 세계가 2002년에 그은 선을 지킵니다."
 SAU_normalization_with_conditions: "조건부 정상화"
 SAU_normalization_with_conditions_desc: "리야드의 요구는 아랍 평화 구상 이후 변하지 않았습니다. 국가 지위의 인정과 맞바꾸는 것입니다. 이스라엘이 왕국의 손을 잡고 싶다면 독립 팔레스타인을 받아들여야 할 것입니다."
 SAU_normalization_without_conditions: "무조건 정상화"
 SAU_normalization_without_conditions_desc: "왕국은 팔레스타인 문제에 대한 양보를 요구하지 않고 이스라엘을 승인할 것입니다. 이는 미국과의 관계를 개선하고 무역을 촉진하겠지만, 아랍 세계 전역에서 상당한 반발을 일으킬 것입니다."
 SAU_normalization_champion_the_palestinian_cause: "팔레스타인 대의 옹호"
 SAU_normalization_champion_the_palestinian_cause_desc: "사우디의 자금이 라말라의 불을 밝히고 모든 아랍 수도에서 대의를 살려 둡니다."
 SAU_strengthen_the_resistance: "저항 강화"
 SAU_strengthen_the_resistance_desc: "점령에 맞서는 세력들은 리야드가 뒤에 서 있는 한 자금과 벗이 부족하지 않을 것입니다."
 SAU_boycott_israeli_goods: "이스라엘 상품 불매"
 SAU_boycott_israeli_goods_desc: "사우디 자금은 단 한 리얄도 이스라엘의 진열대에 닿지 않을 것입니다. 왕국의 시장은 문을 닫습니다."
 SAU_pressure_the_normalizers: "정상화 추진국 압박"
 SAU_pressure_the_normalizers_desc: "텔아비브의 악수에 마음이 흔들리는 아랍 정부는 누구든 리야드의 불쾌감을 가장 먼저 느끼게 될 것입니다. 왕국이 대열을 붙들고 있기에 대열이 유지됩니다."
 SAU_an_arab_consensus: "아랍의 합의"
 SAU_an_arab_consensus_desc: "라바트에서 바그다드까지, 왕국은 이스라엘에 대한 하나의 아랍 목소리를 만들어 냅니다. 승인도, 관계도, 예외도 없습니다."
 SAU_the_palestine_question_desc: "모든 아랍 수도는 이스라엘 문제에 대한 답을 가지고 있지만, 어느 것도 일치하지 않습니다. 리야드는 이제 자신의 답을 선택해야 합니다. 무조건적인 평화, 대가를 요구하는 평화, 혹은 평화 없음입니다."
 SAU_a_deal_with_south_korea: "대한민국과의 거래"
 SAU_a_deal_with_south_korea_desc: "한국의 조선소, 원자로, 건설 대기업들은 현대 걸프 지역의 상당 부분을 지었습니다. 원자력, 방위 산업, 비전 2030의 메가 프로젝트에서 서울을 파트너로 끌어들이십시오."
 SAU_saudi_china_deal: "사우디-중국 거래"
 SAU_saudi_china_deal_desc: "중국 기업들은 석유 계약과 걸프 지역 거점을 간절히 원합니다. 왕국에 대한 투자의 대가로 사우디의 농업 및 에너지 사업에 대한 접근권을 제공하십시오."
 SAU_operation_red_gulf: "붉은 걸프 작전"
 SAU_operation_red_gulf_desc: "냉전이 불붙는다면 왕국은 전투를 이란 해안까지 끌고 갈 준비가 되어 있어야 합니다. 걸프 해역에서의 결정적인 작전 계획을 수립하십시오."
 SAU_palestine_champion_the_palestinian_cause: "팔레스타인 대의 옹호"
 SAU_bankroll_the_resistance: "저항에 자금 대기"
 SAU_bankroll_the_resistance_desc: "말은 값싼 것입니다. 이란이 아니라 사우디의 영향력이 투쟁의 방향을 결정하도록, 팔레스타인 세력들에게 실제 자금과 무기를 보내십시오."
 SAU_arm_the_militants: "무장 세력 무장"
 SAU_arm_the_militants_desc: "무장 세력을 노골적으로 지원하십시오. 리야드는 총의 자금줄이 되어 가자의 모든 전투원의 충성을 두고 테헤란과 경쟁합니다."
 SAU_guardian_of_al_aqsa: "알아크사의 수호자"
 SAU_guardian_of_al_aqsa_desc: "사우디의 지원은 리야드에 팔레스타인에서의 지속적인 역할을 확보해 주었고 알아크사를 수호한다는 주장을 강화했습니다."
 SAU_broker_a_two_state_peace: "양국 해법 평화 중재"
 SAU_broker_a_two_state_peace_desc: "왕국은 양국 해법의 타결을 중재할 것입니다. 사우디가 주도한 합의가 성공한다면 아랍 세계 전역에서 리야드의 외교적 영향력이 확대될 것입니다."
 SAU_palestine_champion_the_palestinian_cause_desc: "팔레스타인은 아랍 세계에서 정치적으로 가장 중요한 쟁점 중 하나로 남아 있습니다. 팔레스타인의 대의를 지지하는 것은 무슬림 지도력에 대한 왕국의 주장을 강화하고 이란의 영향력에 맞서는 일이 될 것입니다."
 SAU_ceasefire_with_the_houthis: "후티와의 휴전"
 SAU_ceasefire_with_the_houthis_desc: "사우디의 손실을 멈추고 전선을 동결할 휴전을 후티에게 제안하십시오. 그들이 수락한다면, 평화란 남쪽 국경에서 무장한 적과 함께 살아간다는 뜻이 될 것입니다."
 SAU_the_great_pipeline_game: "거대한 송유관 게임"
 SAU_the_great_pipeline_game_desc: "사우디 석유 수출의 대부분은 호르무즈 해협을 통과하므로 이란의 방해에 취약합니다. 왕국은 세 가지 대체 송유관 경로를 검토할 것입니다. 예멘을 거쳐 아라비아해로, 시리아를 거쳐 지중해로, 또는 이라크와 튀르키예를 거쳐 유럽으로 가는 경로입니다. 각 경로는 불안정한 지역을 가로지르며 러시아의 에너지 이해관계와 경쟁합니다."
 SAU_prepare_defences_against_saddam: "사담에 대비한 방어 준비"
 SAU_prepare_defences_against_saddam_desc: "궁지에 몰린 사담은 위험합니다. 한때 쿠웨이트에 주둔했던, 유전에서 차로 하루 거리에 있던 군대에 맞서 북부 국경을 요새화하십시오."
 SAU_proclaim_the_republic: "공화국 선포"
 SAU_proclaim_the_republic_desc: "위원회는 군주제를 공식적으로 폐지하고 공화국을 선포할 것입니다. 새 국가의 제도는 아직 확정되지 않았으나, 알사우드 왕좌는 이 선언 이후 살아남지 못할 것입니다."
 SAU_reaffirming_the_quincy_agreement: "퀸시 협정 재확인"
 SAU_reaffirming_the_quincy_agreement_desc: "루스벨트와 압둘아지즈는 1945년 2월 USS 퀸시호 선상에서 사우디-미국 관계의 토대를 세웠습니다. 안정적인 사우디 석유의 대가로 미국이 안보를 지원한다는 것입니다. 위원회는 이 합의가 군주제뿐 아니라 사우디 국가에 적용된다는 확인을 구할 것입니다."
 SAU_the_regency_decree: "섭정 칙령"
 SAU_the_regency_decree_desc: "국왕은 무능력 상태가 지속되는 불특정 기간 동안 행정권과 국방권을 위원회에 이양하는 칙령에 서명할 것입니다. 이 칙령은 법적인 외양을 유지하면서 정부를 군의 통제 아래에 둡니다."
 SAU_master_the_crisis: "위기 극복"
 SAU_master_the_crisis_desc: "물이 어떤 방식으로 확보되었든 이제는 흐르고 있으며, 부처는 마침내 한 계절이 아니라 한 해를 내다보고 계획을 세울 수 있습니다.\n\n§Y물 위기의 마지막 잔재를 해소합니다§!. 라스알카이르 또는 슈아이바가 가동되면 이용할 수 있습니다.\n\n왕국은 배급을 멈추고 건설을 시작합니다."
 SAU_arm_the_faithful: "신도 무장"
 SAU_arm_the_faithful_desc: "혁명의 민병대에 무기와 훈련을 제공하십시오."
 SAU_hezbollah_brigades: "헤즈볼라 여단"
 SAU_hezbollah_brigades_desc: "레바논 저항 조직을 본떠 민병대를 규율 있는 여단으로 만드십시오."
 SAU_shia_civil_rights: "시아파 시민권"
 SAU_shia_civil_rights_desc: "시아파 공동체에 법 앞의 평등한 지위를 보장하여 수십 년간의 공식적 차별을 끝내십시오."
 SAU_sectarian_coexistence: "종파 공존"
 SAU_sectarian_coexistence_desc: "공동의 시민권에 기초한 수니파와 시아파 사이의 국민 협약을 이루십시오."
 SAU_the_constitutional_shia_republic: "입헌 시아파 공화국"
 SAU_the_federal_welfare_state: "연방 복지 국가"
 SAU_the_federal_welfare_state_desc: "입헌 공화국의 제도를 구축하십시오. 공동의 번영과 법치로 공동체들을 하나로 묶는 연방 복지 국가입니다."
 SAU_the_constitutional_shia_republic_desc: "다원적 질서 속에서 시아파의 권리를 보장하는 입헌 공화국으로 온건한 노선의 정점을 이루십시오."
 SAU_develop_the_eastern_province: "동부 주 개발"
 SAU_develop_the_eastern_province_desc: "공화국의 석유 부를 오랫동안 외면당해 온 동부의 시아파 중심지에 투입하십시오."
 SAU_export_the_revolution: "혁명 수출"
 SAU_export_the_revolution_desc: "혁명을 아라비아의 국경 너머 걸프의 시아파에게 전하십시오."
 SAU_federal_autonomy: "연방 자치"
 SAU_federal_autonomy_desc: "연방제의 다원적 연합 안에서 시아파 지역에 실질적인 권한을 이양하십시오."
 SAU_alliance_with_iran: "이란과의 동맹"
 SAU_alliance_with_iran_desc: "새 국가를 지역 전역에서 시아파 혁명의 후견인인 테헤란과 결속시키십시오."
 SAU_the_islamic_republic_of_arabia: "아라비아 이슬람 공화국"
 SAU_the_revolutionary_state: "혁명 국가"
 SAU_the_revolutionary_state_desc: "이슬람 공화국은 제도, 민병대, 성직자를 저항 세력과 보조를 맞추는 규율 있는 혁명 정부 아래 중앙집권화할 것입니다."
 SAU_the_islamic_republic_of_arabia_desc: "저항의 축과 보조를 맞추어, 법학자의 후견 아래 이슬람 공화국을 선포하십시오."
 SAU_shia_national_dialogue: "국민 대화"
 SAU_shia_national_dialogue_desc: "대결이 아닌 협상과 투표를 통해 시아파의 권리 구제를 추구하십시오."
 SAU_the_parliamentary_path: "의회의 길"
 SAU_the_parliamentary_path_desc: "운동을 선출 의회에 맡기고, 충성스러운 야당으로서 공개적으로 권력을 다투십시오."
 SAU_reconcile_with_the_republic: "공화국과의 화해"
 SAU_reconcile_with_the_republic_desc: "오랜 불만을 묻어 두고 혁명을 대의권과 맞바꾸어 국가 체제 안의 자리를 받아들이십시오."
 SAU_guarantee_religious_freedom: "종교의 자유 보장"
 SAU_guarantee_religious_freedom_desc: "관용적인 세속 공화국 아래 모든 공동체의 의례와 신학교를 보호하십시오."
 SAU_the_republic_endures: "공화국은 존속한다"
 SAU_the_republic_endures_desc: "임시 시기는 끝났습니다. 시아파 공화국은 이제 영구적인 제도를 통해 통치하며, 시민들은 이를 아라비아의 항구적인 국가로 받아들여야 합니다."
 SAU_the_resistance: "저항"
 SAU_the_resistance_desc: "히자즈 헤즈볼라의 정신에 따라 신도들을 무장 투쟁으로 결집시키십시오."
 SAU_the_revolutionary_vanguard: "혁명 전위"
 SAU_the_revolutionary_vanguard_desc: "무장한 성직자를 정당과 의회 위에서 국가의 정점에 두십시오."
 SAU_wilayat_al_faqih: "벨라야티 파키흐"
 SAU_wilayat_al_faqih_desc: "법학자의 후견을 명문화하여 최고 종교 지도자에게 궁극적인 권위를 부여하십시오."
 SAU_the_national_charter: "국가 헌장"
 SAU_the_national_charter_desc: "통치자와 피통치자 모두를 법에 구속하는 성문 헌법을 선포하십시오."
 SAU_liberalize_the_economy: "경제 자유화"
 SAU_liberalize_the_economy_desc: "폐쇄적인 경제를 경쟁과 민간 기업에 활짝 개방하십시오."
 SAU_privatize_the_state_sector: "국영 부문 민영화"
 SAU_privatize_the_state_sector_desc: "비대해진 국영 기업을 민간에 매각하고 시장이 작동하도록 하십시오."
 SAU_open_to_foreign_investment: "외국인 투자 개방"
 SAU_open_to_foreign_investment_desc: "왕국에 없던 공장을 세울 외국 자본을 환영하십시오."
 SAU_diversify_beyond_oil: "탈석유 다변화"
 SAU_diversify_beyond_oil_desc: "공화국이 원유에서 벗어나도록, 유정이 고갈된 뒤에도 존속할 경제를 구축하십시오."
 SAU_secure_property_rights: "재산권 보장"
 SAU_secure_property_rights_desc: "소유할 권리와 자신이 일군 것을 지킬 권리를 명문화하십시오."
 SAU_free_trade_agreements: "자유무역협정"
 SAU_free_trade_agreements_desc: "아라비아를 세계 시장과 묶는 개방적 무역 협정을 체결하십시오."
 SAU_an_independent_central_bank: "독립 중앙은행"
 SAU_an_independent_central_bank_desc: "통화 당국을 정치적 간섭에서 해방시키십시오."
 SAU_champion_the_private_sector: "민간 부문 육성"
 SAU_champion_the_private_sector_desc: "자유 경제를 이끄는 기업가와 소기업을 지원하십시오."
 SAU_equality_for_women: "여성의 평등"
 SAU_equality_for_women_desc: "후견법을 폐지하고 여성을 공적 생활의 동등한 구성원으로 인정하십시오."
 SAU_reform_the_schools: "학교 개혁"
 SAU_reform_the_schools_desc: "암기식 성직자 교육을 현대적이고 세속적인 교육과정으로 대체하십시오."
 SAU_an_elected_majlis_al_shura: "선출직 마즐리스 알슈라"
 SAU_an_elected_majlis_al_shura_desc: "임명제 자문 위원회를 자유롭게 선출되는 국민 의회로 바꾸십시오."
 SAU_freedom_of_religion: "종교의 자유"
 SAU_freedom_of_religion_desc: "모든 신앙에 자유롭고 공개적으로 예배할 권리를 보장하십시오."
 SAU_nda_secular_republic: "세속 공화국"
 SAU_nda_secular_republic_desc: "모스크와 국가 사이에 확고한 선을 그으십시오."
 SAU_empower_civil_society: "시민 사회 역량 강화"
 SAU_empower_civil_society_desc: "자유로운 국민을 하나로 엮어 주는 노조, 자선 단체, 결사를 합법화하십시오."
 SAU_guarantee_labor_rights: "노동권 보장"
 SAU_guarantee_labor_rights_desc: "조직할 권리, 파업할 권리, 정당한 임금을 받을 권리를 보장하십시오."
 SAU_a_human_rights_charter: "인권 헌장"
 SAU_a_human_rights_charter_desc: "공화국이 모든 국민의 보편적 권리를 준수하도록 구속하십시오."
 SAU_realign_with_the_west: "서방과의 재결속"
 SAU_realign_with_the_west_desc: "공화국을 민주주의 국가들 가운데 하나의 파트너로서 워싱턴과 브뤼셀로 향하게 하십시오."
 SAU_mend_the_gulf: "걸프 관계 복원"
 SAU_mend_the_gulf_desc: "군주제 국가들을 포함하여 같은 아랍 민족으로서 걸프 국가들과 화해하십시오."
 SAU_join_the_worlds_institutions: "국제 기구 가입"
 SAU_join_the_worlds_institutions_desc: "국제 질서의 협의체에서 아라비아의 자리를 차지하십시오."
 SAU_open_the_borders: "국경 개방"
 SAU_open_the_borders_desc: "더 자유로워진 국경을 가로지르는 사람과 물자의 흐름을 원활하게 하십시오."
 SAU_an_arab_democratic_league: "아랍 민주 연맹"
 SAU_an_arab_democratic_league_desc: "리야드가 이끄는 하나의 깃발 아래 아랍 세계의 민주주의 국가들을 결집시키십시오."
 SAU_the_first_free_elections: "최초의 자유 선거"
 SAU_the_first_free_elections_desc: "모든 시민에게 투표권을 열어 국민이 스스로 정부를 선택하게 하십시오."
 SAU_an_independent_judiciary: "독립된 사법부"
 SAU_an_independent_judiciary_desc: "법원을 궁정에서 해방시켜 오직 법에만 책임을 지는 사법부를 세우십시오."
 SAU_freedom_of_the_press: "언론의 자유"
 SAU_freedom_of_the_press_desc: "신문과 방송에서 검열관의 손길을 거두십시오."
 SAU_the_anti_corruption_commission: "반부패위원회"
 SAU_the_anti_corruption_commission_desc: "고위직의 부정부패를 뿌리뽑을 독립 감시 기구를 설립하십시오."
 SAU_decentralize_the_provinces: "지방 분권화"
 SAU_decentralize_the_provinces_desc: "전국의 선출직 지방 의회에 실질적인 권한을 이양하십시오."
 SAU_limit_the_executive: "행정부 제한"
 SAU_limit_the_executive_desc: "누구도 종신 집권하지 못하도록 대통령직에 임기 제한을 두십시오."
 SAU_the_provisional_government: "임시 정부"
 SAU_convene_the_national_assembly: "국민 의회 소집"
 SAU_convene_the_national_assembly_desc: "임시 정부는 신생 공화국의 정당들을 소집하여 어느 운동이 영구 국가를 이끌지 결정할 것입니다."
 SAU_the_communist_party: "공산당"
 SAU_the_communist_party_desc: "사우디 공산당은 40년을 지하에서, 망명지에서, 혹은 감옥에서 보냈습니다. 살아남은 지도부가 규모는 작지만 조직력이 탄탄한 운동을 이끌고 리야드로 돌아옵니다."
 SAU_the_national_democratic_assembly: "국민민주집회"
 SAU_the_national_democratic_assembly_desc: "신생 공화국을 국민민주집회의 자유주의 민주파에게 맡기십시오. 그들은 성문 헌법, 선출 의회, 그리고 투표함에 책임을 지는 개방 경제를 약속합니다."
 SAU_the_arab_baath_party: "아랍 바트당"
 SAU_the_arab_baath_party_desc: "공화국을 아랍 사회주의 바트당에게 맡기십시오. 하나로 통일된 아랍 민족을 꿈꾸는 세속적 범아랍 민족주의자들입니다."
 SAU_the_islamic_parties: "이슬람 정당들"
 SAU_the_islamic_parties_desc: "사흐와 성직자, 무슬림 형제단 조직망, 이슬람 자선 단체는 거듭된 금지 조치에도 살아남았으며 이제 혁명 이후 정부에서의 역할을 요구하고 있습니다."
 SAU_the_provisional_government_desc: "과도 국민 위원회는 헌법도, 선거도, 확정된 미래도 없는 나라를 통치합니다. 첫 번째 과제는 단지 질서를 유지하고 뒤이을 공화국의 토대를 마련하는 것입니다."
 SAU_restoration_of_relations: "관계 복원"
 SAU_restoration_of_relations_desc: "수년간 단절되었던 관계가 조심스럽게 대사관 재개설로 이어집니다. 왕국의 이익을 내주지 않으면서 이슬람 공화국과의 위태로운 긴장 완화를 관리하십시오."
 SAU_the_house_that_rules_the_kingdom: "왕국을 통치하는 가문"
 SAU_the_house_that_rules_the_kingdom_desc: "알사우드 왕조는 수 세대에 걸쳐 아라비아 중부를 통치해 왔습니다. 1995년 파흐드 국왕이 뇌졸중으로 쓰러진 이후 §Y실질적 권력§!은 계승을 장악하려 경쟁하는 원로 왕자들에게 넘어갔습니다."
 SAU_sanction_the_southern_bloc: "남부 블록 제재"
 SAU_sanction_the_southern_bloc_desc: "지역 전체에 걸쳐 이란과 연계된 세력의 재정을 조이십시오. 제재와 블랙리스트는 테헤란의 우군들이 충성을 유지하는 데 필요한 자금을 고갈시킵니다."
 SAU_saddam_falls: "사담의 몰락"
 SAU_saddam_falls_desc: "동상들이 쓰러지고 정권이 붕괴하여, 한때 위대한 아랍 국가가 서 있던 자리에 공백이 생겼습니다. 리야드는 테헤란이 그 공백을 메우기 전에 움직여야 합니다."
 SAU_saddam_endures: "사담의 생존"
 SAU_saddam_endures_desc: "바트당 정권은 폭풍을 이겨 냈고, 상처는 입었으나 꺾이지 않았습니다. 오랜 적은 북쪽 국경 너머에 여전히 남아 있으며, 왕국은 바그다드의 폭군과 한동안 더 함께 살아가야 합니다."
 SAU_saudi_economic_focus_tree: "사우디 경제 국가 중점 트리"
 SAU_saudi_economic_focus_tree_desc: "석유가 비용을 지불하고, 외국인 노동자가 일의 상당 부분을 하며, 사우디 자본은 너무 자주 국외로 빠져나갑니다. 다음 경제는 국내에서 더 많이 생산하고, 더 많은 사우디인을 고용하며, 리야드 밖의 도시들에도 성장의 몫을 나누어 주어야 합니다."
 SAU_national_water_company: "국영 물 회사"
 SAU_national_water_company_desc: "왕국이 자체적으로 물을 만들어 냅니다. 하나의 국영 기업, 하나의 임무, 그리고 상업적으로는 투자 가치가 없을 마을까지 이어지는 송수관입니다.\n\n§G국영 물 회사§!와 §G나즈드의 인프라 1개§!를 부여하고, §Y물 위기를 한 단계 완화합니다§!.\n\n외주를 주는 것보다 느리고 비용이 더 듭니다. 그래도 사우디의 것으로 남습니다."
 SAU_a_saudi_spanish_partnership: "사우디-스페인 파트너십"
 SAU_a_saudi_spanish_partnership_desc: "스페인 조선소는 왕국의 신형 초계함을, 스페인 기업은 메카로 가는 고속철도를 건설합니다. 마드리드를 통상적인 범위 밖의 유용한 유럽 파트너로 키우십시오."
 SAU_sermons_from_the_ministry: "부처가 내리는 설교"
 SAU_sermons_from_the_ministry_desc: "부처는 왕국 전역의 모스크에 배포되는 금요일 쿠트바를 개정할 것입니다. 약 1만 5천 개의 설교단에서 낭독되는 공통 원고는 정부에 종교 메시지에 대한 직접적인 영향력을 부여할 것입니다."
 SAU_recognize_the_shia_clergy: "시아파 성직자 인정"
 SAU_recognize_the_shia_clergy_desc: "§Y시아파 울라마§!에게 와하브파 기득권층과 나란히 공식 지위를 부여하십시오.\n\n§G+안정도, +시아파 인구§!."
 SAU_crackdown_on_shia_dissent: "시아파 반대 세력 탄압"
 SAU_crackdown_on_shia_dissent_desc: "반대 세력에 §Y마바히스§!와 §Y국가방위군§!으로 대응하십시오. 시아파는 감시당하고, 억제되고, 변방으로 밀려날 것이며, 수니파 다수는 그 덕분에 더 마음 편히 지낼 것입니다.\n\n§R+시아파 저항§!, §R-시아파 인구§!, §G+안정도, +전쟁 지지도§!."
 SAU_sunni_shia_dialogue: "수니-시아 대화"
 SAU_sunni_shia_dialogue_desc: "14세기에 걸친 분열의 치유를 시작하기 위한 국민 대화입니다.\n\n§G-시아파 저항, +안정도, +시아파 인구§!."
 SAU_invest_in_the_eastern_province: "동부 주 투자"
 SAU_invest_in_the_eastern_province_desc: "시아파 중심지에 오일달러를 쏟아붓습니다. 도로, 병원, 항만입니다.\n\n§G+안정도, +시아파 인구§!."
 SAU_resettling_the_eastern_province: "동부 주 재정착"
 SAU_resettling_the_eastern_province_desc: "시아파 문제가 마침내 해결되었습니다. §Y동부 주§!는 한 세대에 걸친 끈기 있는 재정착을 통해 잠잠해졌습니다.\n\n§R--시아파 인구§!, §G저항 분쇄§!, §G++안정도§!."
 SAU_economic_inclusion: "경제적 포용"
 SAU_economic_inclusion_desc: "유전 위에 사는 사람들과 유전의 부를 나누십시오. 종파 간의 상처가 마침내 아물기 시작합니다.\n\n§G저항 종식, +안정도, +시아파 인구§!."
 SAU_equal_educational_access: "평등한 교육 접근성"
 SAU_equal_educational_access_desc: "§Y카티프§!와 §Y알아흐사§!에 나즈드의 학교와 대학에 견줄 만한 학교와 대학을 세우십시오.\n\n§G+안정도, +시아파 인구§!."
 SAU_embrace_shia_citizens: "시아파 시민 포용"
 SAU_embrace_shia_citizens_desc: "시아파를 완전한 시민으로 환영하십시오. 이는 §Y사우드 가문§!이 억압하기 위해 세워졌던 신앙을 스스로 재고하게 될 수도 있는 여정의 시작입니다.\n\n§G+시아파 인구, -시아파 저항§!."
 SAU_sectarian_harmony: "종파 간 화합"
 SAU_sectarian_harmony_desc: "수니파와 시아파, 하나의 왕관 아래 하나의 국가입니다.\n\n§G저항 종식, +안정도, +시아파 인구§!."
 SAU_integrate_the_communities: "공동체 통합"
 SAU_integrate_the_communities_desc: "왕실에 충성을 맹세하는 시아파 시민들에게 군, 경찰, 관료 조직을 개방하십시오.\n\n§G-시아파 저항, +안정도, +시아파 인구§!."
 SAU_the_shia_question: "시아파 문제"
 SAU_the_shia_question_desc: "석유가 생산되는 §Y동부 주§!에는 약 200만 명의 §Y시아파§! 시민이 살고 있습니다. §Y사우드 가문§!은 탄압, 타협, 혹은 종교 정책의 근본적인 변화 중에서 선택해야 합니다."
 SAU_rehabilitate_the_detainees: "수감자 사회 복귀"
 SAU_rehabilitate_the_detainees_desc: "동부 주의 정치범을 석방하고 사우디 사회로 복귀시키십시오.\n\n§G-시아파 저항, +안정도§!."
 SAU_shia_political_representation: "시아파 정치 대표권"
 SAU_shia_political_representation_desc: "동부 주의 시아파에게 §Y슈라 위원회§!의 의석을 부여합니다.\n\n§G-시아파 저항, +안정도, +시아파 인구§!."
 SAU_security_clampdown: "보안 단속"
 SAU_security_clampdown_desc: "동부 주를 검문소, 정보원, 신속 대응 부대로 가득 채우십시오.\n\n§R+시아파 저항§!, §R-시아파 인구§!, §G+전쟁 지지도§!."
 SAU_sectarian_settlement: "종파 문제 정리"
 SAU_sectarian_settlement_desc: "왕국은 탄압, 타협, 혹은 개종을 통해 시아파 문제를 정리했으며, 이제 그 결과로 나온 정책을 공고히 할 수 있습니다.\n\n§G+안정도, +정치력§!."
 SAU_the_house_of_saud_embraces_shiaism: "사우드 가문의 시아파 수용"
 SAU_the_house_of_saud_embraces_shiaism_desc: "상상할 수 없던 일입니다. §Y왕실§!이 공식적으로 §Y12이맘파 시아§!를 채택합니다. 수 세기에 걸친 와하브파 정통성이 단 한 번의 칙령으로 뒤집힙니다. §Y동부 주§!는 환호하고, §Y나즈드§!와 §Y울라마§!는 휘청거립니다.\n\n§G++시아파 인구§!, §G저항 종식§!, §R시아파 신앙 채택§!, §R-안정도§!(당분간)."
 SAU_sunni_supremacy: "수니파 우위"
 SAU_sunni_supremacy_desc: "수니파의 우위를 법, 학교, 모스크에 명문화하십시오. 왕국에는 하나의 진정한 신앙이 있으며, 그것은 그들의 것이 아닙니다.\n\n§R-시아파 인구§!, §G+안정도, +전쟁 지지도§!."
 SAU_suppress_the_clerics: "성직자 탄압"
 SAU_suppress_the_clerics_desc: "§Y카티프§!와 §Y아와미야§!의 선동적인 설교자들이 설교를 구호로 만들기 전에 입을 막으십시오.\n\n§R+시아파 저항§!, §R-시아파 인구§!."
 SAU_sunni_shia_tolerance: "수니-시아 관용"
 SAU_sunni_shia_tolerance_desc: "박해도 개종도 하지 않고 단지 공존합니다. 제한을 완화하고, 시아파가 평화롭게 예배하도록 하며, 왕국이 숨을 쉬게 하십시오.\n\n§G-시아파 저항, +안정도, +시아파 인구§!(신앙 변화 없음)."
 SAU_stir_the_axis_of_resistance: "저항의 축 교란"
 SAU_stir_the_axis_of_resistance_desc: "이란의 힘은 레바논에서 예멘까지 이어지는 대리 세력의 사슬이며, 고리마다 불만이 있습니다. 시위와 균열에 자금을 대어 테헤란의 동맹을 짐으로 바꾸십시오."
 SAU_foreign_volunteers_for_the_rebels: "반군을 위한 외국인 의용병"
 SAU_foreign_volunteers_for_the_rebels_desc: "자금만으로는 전쟁에서 이길 수 없습니다. 국경을 넘어 전투원과 물자를 야권 전선으로 보내는 통로를 여십시오."
 SAU_direct_intervention_in_yemen: "예멘 직접 개입"
 SAU_direct_intervention_in_yemen_desc: "사우디군을 투입하십시오. 직접 작전은 더 빠른 결판과 더 분명한 승리를 약속하지만, 왕국이 수년간 피를 흘리는 수렁에 빠질 위험도 있습니다."
 SAU_a_proxy_war_in_yemen: "예멘 대리전"
 SAU_a_proxy_war_in_yemen_desc: "다른 이들을 통해 전쟁을 치르십시오. 망명 정부, 남부 민병대, 부족들에게 자금을 대고, 사우디 전투기가 하늘에서 지켜보는 동안 예멘인들이 죽게 하십시오."
 SAU_supreme_military_council: "최고 군사 위원회"
 SAU_supreme_military_council_desc: "임시 군사 위원회는 영구 헌장과 공식 구성원 규정을 부여받을 것입니다. 계급이 위원 자격을 결정하겠지만, 쿠데타 중의 지휘 이력은 계속해서 위원회 내의 영향력을 좌우할 것입니다."
 SAU_the_amman_bailout: "암만 구제 금융"
 SAU_the_amman_bailout_desc: "하심 왕국은 북쪽의 혼란에 맞선 취약한 완충지대이며, 파산 상태입니다. 왕국의 수표책으로 요르단의 지급 능력과 충성심을 유지하십시오."
 SAU_the_battle_for_the_straits: "해협을 둘러싼 전투"
 SAU_the_battle_for_the_straits_desc: "호르무즈 해협을 장악하는 자가 세계 석유의 5분의 1을 장악합니다. 세계에서 가장 중요한 수로에 대한 이란의 장악을 깨뜨릴 수 있도록 왕국과 동맹국을 준비시키십시오."
 SAU_the_islamic_rivalry: "이슬람 세계의 경쟁"
 SAU_the_islamic_rivalry_desc: "이란은 자국의 혁명 모델을 선전하며 레바논에서 예멘에 이르는 무장 단체를 지원합니다. 사우디아라비아는 언론, 지역 파트너, 그리고 걸프에서 벌어질 수 있는 충돌에 대한 대비를 통해 이란의 지도력에 맞설 것입니다."
 SAU_the_levant_strategy: "레반트 전략"
 SAU_the_levant_strategy_desc: "시리아는 불타고 요르단은 흔들리며, 그 너머에는 지중해로 가는 길이 있습니다. 이란과 그 우군이 먼저 손을 쓰기 전에 레반트를 사우디에 유리하게 만드십시오."
 SAU_the_new_order_over_the_kingdom: "왕국 위의 신질서"
 SAU_the_new_order_over_the_kingdom_desc: "비상 정부가 영구적인 정치 질서가 되었습니다. 군사 권한이 거듭 갱신되면서 임시 조치와 정상 통치 사이의 실질적인 구분이 사라졌습니다."
 SAU_the_silk_road_pivot: "실크로드로의 전환"
 SAU_the_silk_road_pivot_desc: "중국은 사우디 원유의 최대 구매국이며 경제 협력에 국내 정치 개혁을 조건으로 달지 않습니다. 일대일로는 항구, 철도, 자본을 제공하지만 관계는 여전히 주로 거래적입니다."
 SAU_the_silk_web_network: "실크 웹 네트워크"
 SAU_the_silk_web_network_desc: "정보는 무기이며, 왕국은 그것을 휘두를 작정입니다. 리야드의 메시지를 지역 전체에 전달할 언론 매체, 성직자, 온라인 목소리의 망을 엮으십시오."
 SAU_the_american_shield: "미국의 방패"
 SAU_the_american_shield_desc: "왕국의 방위를 되돌릴 수 없도록 미국과 결속시키십시오. 기지 사용, 정보, 그리고 리야드에 대한 공격은 워싱턴의 이익에 대한 공격이라는 암묵적 보장입니다. 대가는 단일 후견국에 대한 의존입니다."
 SAU_the_succession_question: "계승 문제"
 SAU_the_succession_question_desc: "수천 명의 왕자가 구질서 아래의 지위와 잠재적 권리 주장을 유지하고 있습니다. 정부는 이들에게 연금을 줄지, 추방할지, 기소할지, 아니면 정치적으로 주변화할지 결정해야 합니다."
 SAU_the_spirit_of_taif: "타이프 정신"
 SAU_the_spirit_of_taif_desc: "사우디가 중재한 타이프 협정은 한때 레바논 내전을 끝내고 왕국에 베이루트에 대한 영향력을 안겨 주었습니다. 그 역할을 되살려 레바논을 이란의 영향권에서 되찾으십시오."
 SAU_the_yemen_quagmire: "예멘의 수렁"
 SAU_the_yemen_quagmire_desc: "예멘 전쟁은 큰 비용을 치렀지만, 이란을 함정에 끌어들이기도 했습니다. 이란은 리야드에 떨어지는 후티 미사일의 후원자로 드러났습니다. 이 수렁을 외교의 무기로 바꾸십시오."
 SAU_the_yemeni_peace_talks: "예멘 평화 협상"
 SAU_the_yemeni_peace_talks_desc: "모든 전쟁은 탁자 위에서 끝납니다. 왕국의 남쪽 국경이 안전하게 유지되는 조건으로 예멘 세력들의 합의를 이끌어 내십시오."
 SAU_defeat_in_syria: "시리아에서의 패배"
 SAU_defeat_in_syria_desc: "정권은 러시아 전투기와 이란 민병대의 뒷받침 속에 버티고 있습니다. 왕국은 손실을 줄이고, 이길 수 없었던 전쟁에서 건질 수 있는 영향력이라도 건져야 합니다."
 SAU_total_victory_in_the_civil_war: "내전에서의 완전한 승리"
 SAU_total_victory_in_the_civil_war_desc: "후티를 완전히 분쇄하고 전적으로 리야드에 의존하는 단일 정부를 복원하십시오. 예멘은 이름만 아닐 뿐 사실상 사우디의 보호령이 됩니다."
 SAU_victory_in_syria: "시리아에서의 승리"
 SAU_victory_in_syria_desc: "다마스쿠스가 함락되고, 그와 함께 헤즈볼라로 통하는 이란의 육상 교량도 무너집니다. 시리아의 우호 정부는 레반트를 사우디의 영향력에, 지중해를 사우디의 송유관에 열어 줍니다."
 SAU_a_partnership_with_britain: "영국과의 파트너십"
 SAU_a_partnership_with_britain_desc: "알야마마 계약에서 사우디 장교 훈련에 이르기까지, 런던은 대부분의 나라보다 조용하지만 더 꾸준한 친구였습니다. 영국과의 전략적 파트너십을 공식화하십시오."
 SAU_benign_dominance: "온건한 패권"
 SAU_benign_dominance_desc: "리야드는 투자, 후원, 그리고 작은 에미리트들의 존엄에 대한 존중이라는 §G부드러운 손길§!로 이끕니다. 굴욕 없는 패권입니다."
 SAU_command_and_control: "지휘 및 통제"
 SAU_command_and_control_desc: "합동 지휘소, 통합 대공 방어, 공유된 정보는 반도 방패군에 통일된 작전 구조를 부여할 것입니다."
 SAU_common_market: "공동 시장"
 SAU_common_market_desc: "단일한 규제 체계입니다. 하나의 표준, 하나의 통관 서류, 하나의 §Y5천만 소비자§! 지역 시장입니다."
 SAU_cross_border_transit_systems: "국경 간 교통 체계"
 SAU_cross_border_transit_systems_desc: "고속도로, 철도, 송유관이 반도를 하나로 엮습니다. 오래도록 논의만 되었을 뿐 한 번도 건설되지 못했던 §YGCC 철도§!가 마침내 첫 삽을 뜹니다."
 SAU_economic_union: "경제 연합"
 SAU_economic_union_desc: "통합된 §Y관세 구역§!, 조화된 규제, 그리고 반도 전체에 걸친 §Y공동 시장§!의 토대입니다. §Y제다§!와 §Y두바이§!의 상인들은 한 세대를 기다렸습니다."
 SAU_exploit_authority: "권위 행사"
 SAU_exploit_authority_desc: "사우디아라비아는 §Y경제적 압박§!과 기타 강압적 조치를 통해 불응하는 회원국에 대해 자국의 패권을 관철할 것입니다. 동맹은 §G사우디가 지배하는 블록§!으로 기능하게 됩니다."
 SAU_the_gulf_cooperation_council: "걸프 협력 회의"
 SAU_the_gulf_cooperation_council_desc: "20년 동안 §YGCC§!는 주로 걸프 군주국들 간의 협의 포럼으로 운영되어 왔습니다. 리야드는 이를 더 효과적인 지역 기구로 확대할 것입니다."
 SAU_the_gulf_academy: "걸프 사관학교"
 SAU_the_gulf_academy_desc: "§Y리야드§!에 세워지는 통합 장교 훈련 학교입니다. 모든 GCC 국가의 미래 장군들이 한 교실, 하나의 교리, 그리고 §Y동맹에 대한 충성§!을 공유하게 됩니다."
 SAU_increase_autonomy: "자율성 확대"
 SAU_increase_autonomy_desc: "더 §Y독립적인 외교 정책§!입니다. GCC는 미국의 피후견국이 아니라 §Y지역 강국§!으로서 국제 무대에서 스스로를 대변합니다.\n\n§Y위원회의 후견국에 관한 세 갈래 길 중 하나§! - §Y워싱턴§!, §Y새로운 파트너§!, 또는 §Y아무도 없음§!. 이 순서대로 열립니다. 미국이 귀하를 §R거절§!한 뒤에야 새로운 파트너로 돌아설 수 있고, 둘 다 거절당한 뒤에야 홀로 설 수 있습니다. §R선택하는 길마다 그 위의 길은 영구히 닫힙니다.§!"
 SAU_intra_gcc_trade: "GCC 역내 무역"
 SAU_intra_gcc_trade_desc: "회원국 간 마지막 관세 장벽을 없앱니다. 상품, 자본, 노동이 §Y무스카트§!에서 §Y쿠웨이트시티§!까지 자유롭게 흐릅니다."
 SAU_joint_defense_agreement: "공동 방위 협정"
 SAU_joint_defense_agreement_desc: "§Y5조§! 방식의 상호 방위 조약입니다. 한 나라에 대한 공격은 모두에 대한 공격입니다. §Y이란§!이 이를 주시합니다."
 SAU_joint_research_initiatives: "공동 연구 구상"
 SAU_joint_research_initiatives_desc: "공동 §Y기술 기금§!이 담수화, 태양광, 석유화학 연구개발을 위한 자원을 모읍니다. §YKAUST§!가 지역 거점이 됩니다."
 SAU_gcc_joint_ventures: "GCC 합작 사업"
 SAU_gcc_joint_ventures_desc: "GCC는 방위 산업 생산, 조달, 정비를 조율할 것입니다. 사우디의 자본, §Y에미리트의 물류§!, §Y바레인의 조선소§!가 공동의 군수 산업 체계를 뒷받침할 것입니다."
 SAU_the_khaleeji_union: "칼리지 연합"
 SAU_the_khaleeji_union_desc: "여섯 군주국은 외교, 국방, 통화에 대한 공동 권한을 가진 연합체를 구성할 것입니다. §Y칼리지 연합§!은 §Y리야드§!에서 이끌게 됩니다."
 SAU_military_union: "군사 연합"
 SAU_military_union_desc: "§Y반도 방패군§!은 1984년부터 존재했지만 실질적 통합은 제한적이었습니다. 리야드는 합동 지휘부, 공동 조달, 공통 교리를 확립할 것입니다."
 SAU_new_partners: "새로운 파트너"
 SAU_new_partners_desc: "워싱턴을 넘어서, §Y베이징§!, §Y모스크바§!, §Y델리§!, §Y브뤼셀§!과의 거래입니다. 반도는 후견국을 다변화합니다.\n\n§Y위원회의 후견국에 관한 세 갈래 길 중 하나§! - §Y워싱턴§!, §Y새로운 파트너§!, 또는 §Y아무도 없음§!. 이 순서대로 열립니다. 미국이 귀하를 §R거절§!한 뒤에야 새로운 파트너로 돌아설 수 있고, 둘 다 거절당한 뒤에야 홀로 설 수 있습니다. §R선택하는 길마다 그 위의 길은 영구히 닫힙니다.§!"
 SAU_political_union: "정치 연합"
 SAU_political_union_desc: "조율된 외교 정책입니다. 공유된 외교 노선입니다. 작은 에미리트들은 §Y사우디의 지배§!를 두려워하지만, 리야드는 이것이 §Y군주들 사이의 동등한 자들§!의 파트너십이라고 주장합니다."
 SAU_solidify_pro_american_alignment: "친미 노선 공고화"
 SAU_solidify_pro_american_alignment_desc: "§YGCC§!가 워싱턴과의 안보 파트너십을 공식화합니다. 기지, 훈련, 무기, 정보가 모두 리야드를 거쳐 흐릅니다.\n\n§Y위원회의 후견국에 관한 세 갈래 길 중 하나§! - §Y워싱턴§!, §Y새로운 파트너§!, 또는 §Y아무도 없음§!. 이 순서대로 열립니다. 미국이 귀하를 §R거절§!한 뒤에야 새로운 파트너로 돌아설 수 있고, 둘 다 거절당한 뒤에야 홀로 설 수 있습니다. §R선택하는 길마다 그 위의 길은 영구히 닫힙니다.§!"
 SAU_pursue_hegemony: "패권 추구"
 SAU_pursue_hegemony_desc: "리야드는 비공식적 지도력을 다른 GCC 군주국에 대한 직접적 권위로 대체할 것입니다. 이들이 반대할 수도 있으나, 사우디의 경제적, 군사적 압박이 그들의 저항 능력을 제한할 것입니다."
 SAU_a_robust_alliance: "견고한 동맹"
 SAU_a_robust_alliance_desc: "§Y반도 방패군§!은 현대식 장비와 통일된 교리를 갖춘 10만 병력의 작전 부대가 될 것입니다."
 SAU_shared_currency: "공동 통화"
 SAU_shared_currency_desc: "§Y칼리지 디나르§!는 GCC의 단일 통화로, 달러가 아닌 통화 바스켓에 고정됩니다. 반도가 지금까지 내디딘 가장 대담한 경제적 발걸음입니다."
 SAU_the_yemeni_civil_war: "예멘 내전"
 SAU_the_yemeni_civil_war_desc: "후티가 수도를 장악하고 인정받는 정부를 망명으로 내몰았으며, 이란의 발판이 아라비아의 문턱에 뿌리내리고 있습니다. 왕국은 이를 되돌리기 위해 어디까지 갈지 결정해야 합니다."
 SAU_sabotage_the_regimes_backers: "정권 후원자 파괴 공작"
 SAU_sabotage_the_regimes_backers_desc: "왕국이 총 한 자루를 보낼 때마다 테헤란과 모스크바는 두 자루를 보냅니다. 다마스쿠스를 떠받치는 보급선과 대리 세력을 교란하기 위해 어둠 속에서 움직이십시오."
 SAU_the_national_industrial_strategy_gdp_tt: "국가 §YGDP§!가 §G$15000억§!를 초과해야 합니다"
 SAU_stc_privatization_gdp_tt: "국가 §YGDP§!가 §G$15000억§!를 초과해야 합니다"
 SAU_kaust_gdp_tt: "국가 §YGDP§!가 §G$16000억§!를 초과해야 합니다"
 SAU_the_gulfs_economic_engine_gdp_tt: "국가 §YGDP§!가 §G$15000억§!를 초과해야 합니다"
 SAU_the_worlds_most_valuable_company_gdp_tt: "국가 §YGDP§!가 §G$18000억§!를 초과해야 합니다"
 SAU_vision_2030_gdp_tt: "국가 §YGDP§!가 §G$16000억§!를 초과해야 합니다"
 SAU_sdaia_data_and_artificial_intelligence_gdp_tt: "국가 §YGDP§!가 §G$20000억§!를 초과해야 합니다"
 SAU_the_civil_nuclear_program_gdp_tt: "국가 §YGDP§!가 §G$17000억§!를 초과해야 합니다"
 SAU_fund_vision_2030_gdp_tt: "국가 §YGDP§!가 §G$18000억§!를 초과해야 합니다"
 SAU_the_dynamic_tiering_formula: "동적 등급 산정 공식"
 SAU_the_dynamic_tiering_formula_desc: "직원 9천 명의 기업과 9명의 기업에 같은 의미를 갖는 할당량은 하나의 숫자일 수 없습니다. 이 공식은 인원, 매출, 업종에 따라 요건을 조정하며 분기마다 다시 계산합니다.\n\n기업들이 회사를 둘로 쪼개어 기준을 피하는 꼼수를 더 이상 부리지 않게 됩니다."
 SAU_high_green_zone_incentives: "상위 녹색 구간 인센티브"
 SAU_high_green_zone_incentives_desc: "플래티넘 아래에는 왕국의 진지한 고용주 대부분이 실제로 속해 있는 구간이 있습니다. 그들은 규정을 준수하지만 뛰어나지는 않으며, 지금까지 제도는 그들에게 아무것도 주지 않았습니다.\n\n우선 처리와 완화된 감사 일정이 제공됩니다. 규정 준수에 근접한 기업을 보상하는 편이 처벌하는 것보다 저렴하다는 논리입니다."
 SAU_the_yellow_band_warnings: "노란 구간 경고"
 SAU_the_yellow_band_warnings_desc: "노란 구간에 속한 기업은 서면으로, 날짜를 명시하여 기준에 얼마나 못 미치는지, 그리고 분기가 마감되면 어떤 일이 벌어지는지를 정확히 통보받습니다.\n\n대부분의 기업은 문제를 바로잡습니다. 경고장 한 통이면 부처는 업무 동결을 피할 수 있습니다."
 SAU_the_secularization_of_finance_choice_tt: "§Y선택지가 이어집니다§! - '완전한 앵글로색슨식 - 모든 금융 상품 허용' / '점진적 - 샤리아의 외양을 두른 서구식 관행'."
 SAU_bastion_of_islamic_finance_choice_tt: "§Y선택지가 이어집니다§! - '엄격한 정통주의 - 타협 없음' / '실용주의 - 세계 이슬람 금융 시장을 선도'."
 SAU_the_banking_control_law_choice_tt: "§Y선택지가 이어집니다§! - 'SAMA - 독립적인 세속 규제 기관' / 'SAMA + 구속력 있는 거부권을 가진 샤리아 평의회' / '혼합 - 두 개의 병행 구조'."
 SAU_the_interbank_lending_code_choice_tt: "§Y선택지가 이어집니다§! - '이자에 기반한 전통적 은행 간 시장' / '무라바하에 기반한 이슬람 은행 간 시장' / '혼합 - 둘을 분리하여 운영'."
 SAU_the_anti_speculation_directives_choice_tt: "§Y선택지가 이어집니다§! - '가벼운 규제 - 파생상품과 선물 허용' / '엄격한 금지 - 가라르도 도박도 불허' / '규제된 파생상품만 허용 - 균형 잡힌 접근'."
 SAU_fractional_reserve_mandates_choice_tt: "§Y선택지가 이어집니다§! - '현대식 부분지급준비제 - 안정성을 희생한 성장' / '자산 담보만 허용 - 안정적이나 더 느림' / '온건한 지급준비 요건'."
 SAU_the_standardized_interest_law_choice_tt: "§Y선택지가 이어집니다§! - '전통적인 이자부 계좌 허용' / '엄격한 리바 금지 - 샤리아가 최우선' / '공개적으로는 수쿠크, 사적으로는 실용적 이자'."
 SAU_conscript_the_kingdom_choice_tt: "§Y선택지가 이어집니다§! - '보편 복무. 병역 연령의 모든 남성, 면제 없음' / '선별 복무. 부족들은 면제를 유지'. §H국가에 대한 장교들의 장악력과 군사정권의 정통성§!에 영향을 줍니다."
 SAU_emergency_tribunal_choice_tt: "§Y선택지가 이어집니다§! - '왕자들. 그들이 책임을 지는 모습을 국민이 지켜보게 하라' / '반체제 인사들. 서류는 이미 작성되어 있다' / '둘 다. 가려내려고 국가를 장악한 것이 아니다'. §H국가에 대한 장교들의 장악력과 군사정권의 정통성§!에 영향을 줍니다."
 SAU_the_defense_industries_act_choice_tt: "§Y선택지가 이어집니다§! - '설계를 면허 생산한다. 필요한 것은 자존심이 아니라 생산이다' / '광석부터 직접 만든다'. §H국가에 대한 장교들의 장악력과 군사정권의 정통성§!에 영향을 줍니다."
 SAU_martial_law_issues_choice_tt: "§Y선택지가 이어집니다§! - '모든 기구를 동원한다. 통금, 재판소, 검열관' / '비상 권한만 행사한다. 거리는 건드리지 않는다'. §H국가에 대한 장교들의 장악력과 군사정권의 정통성§!에 영향을 줍니다."
 SAU_the_regency_decree_choice_tt: "§Y선택지가 이어집니다§! - '제한적 섭정. 그는 왕좌와 두 성지를 유지한다' / '전면적 섭정. 예외 없이 모든 권한' / '5년 기한의 섭정. 날짜를 명시한다'. §H국가에 대한 장교들의 장악력과 군사정권의 정통성§!에 영향을 줍니다."
 SAU_the_succession_question_choice_tt: "§Y선택지가 이어집니다§! - '연금을 후하게, 그리고 영구히 지급한다' / '직계 본가를 추방한다' / '기소하고, 발견되는 것을 몰수한다' / '부유하되 장식에 불과한 존재로 남겨 둔다'. §H국가에 대한 장교들의 장악력과 군사정권의 정통성§!에 영향을 줍니다."
 SAU_the_silk_road_pivot_choice_tt: "§Y선택지가 이어집니다§! - '항만, 철도, 그리고 북부 회랑' / '자본, 그리고 아무 조건도 붙지 않음'. §H국가에 대한 장교들의 장악력과 군사정권의 정통성§!에 영향을 줍니다."
 SAU_guardians_of_the_two_mosques_choice_tt: "§Y선택지가 이어집니다§! - '국왕의 뒤에 선다. 칭호를 빌릴 뿐 차지하지는 않는다' / '수호권은 사람이 아니라 국가에 속한다'. §H국가에 대한 장교들의 장악력과 군사정권의 정통성§!에 영향을 줍니다."
 SAU_secure_support_in_the_al_madinah_province_choice_tt: "§Y선택지가 이어집니다§! - '그들의 마음을 얻는다. 양보해야 할 것은 양보한다' / '자리를 재배치한다. 지금 당장 문구가 필요하다'. §H국가에 대한 장교들의 장악력과 군사정권의 정통성§!에 영향을 줍니다."
 SAU_secure_support_in_the_mecca_province_choice_tt: "§Y선택지가 이어집니다§! - '상인 가문들에게 대가를 치른다. 헤자즈를 제대로 사들인다' / '주둔시킨다. 그들은 적응할 것이다'. §H국가에 대한 장교들의 장악력과 군사정권의 정통성§!에 영향을 줍니다."
 SAU_appoint_loyalists_in_the_provinces_choice_tt: "§Y선택지가 이어집니다§! - '고위 왕자들. 그들의 이름은 여전히 나라를 움직인다' / '소외된 사촌들. 감사는 위신보다 저렴하다' / '부유한 불평분자들. 일단 끌어들이고 감사는 나중에 한다'. §H국가에 대한 장교들의 장악력과 군사정권의 정통성§!에 영향을 줍니다."
 SAU_disband_the_national_guard_choice_tt: "§Y선택지가 이어집니다§! - '흡수한다. 우리 군복을 입게 한다' / '방위대를 완전히 해체한다. 집으로 돌려보낸다' / '잔존 병력을 우리 지휘 아래 유지한다'. §H국가에 대한 장교들의 장악력과 군사정권의 정통성§!에 영향을 줍니다."
 SAU_the_riyadh_meeting_operation_decisive_storm_choice_tt: "§Y선택지가 이어집니다§! - '그렇다면 합의된 것이다. 모두에게 물어보라' / '왕국이 예멘에 홀로 대응할 것이다'."
 SAU_the_oil_defense_strategy_choice_tt: "§Y선택지가 이어집니다§! - '퍼 올린다. 유전이 곧 전략이다' / '유정보다 오래 살아남을 산업을 키운다' / '탐사한다. 저 밖에 더 많은 매장량이 있다'."
 SAU_women_in_the_shura_council_choice_tt: "§Y선택지가 이어집니다§! - '왕명으로 30석' / '의회는 현재 그대로 유지'."
 SAU_hold_municipal_elections_choice_tt: "§Y선택지가 이어집니다§! - '의석의 절반, 그리고 유권자 명부에는 남성만' / '전원을 임명하고 자문이라 부른다' / '여성도 유권자 명부에 올린다'."
 SAU_counter_terrorism_cooperation_choice_tt: "§Y선택지가 이어집니다§! - '워싱턴의 제안을 전부 받아들인다' / '마바히스가 자체적으로 처리한다' / '교화한다. 감옥은 더 많은 테러범을 만들 뿐이다'."
 SAU_al_saud_national_dialogue_choice_tt: "§Y선택지가 이어집니다§! - '발언하게 하고, 발언 내용을 공개한다' / '모일 수는 있다. 의제는 우리가 정한다'."
 SAU_consolidating_the_crown_choice_tt: "§Y선택지가 이어집니다§! - '충성 서약 위원회가 왕위 계승을 결정하게 한다' / '국왕이 후계자를 지명한다. 위원회는 그에게 박수를 보낼 것이다' / '대신 왕가의 동의를 매수한다'."
 SAU_a_new_kingdom_choice_tt: "§Y선택지가 이어집니다§! - '부처들이 감당할 수 있는 한도까지 개혁한다' / '칙령에 적힌 이름만 바뀌었을 뿐이다' / '경제를 개방하고 정치가 뒤따르게 한다'."
 SAU_the_global_ummah_question_choice_tt: "§Y선택지가 이어집니다§! - '두 성지는 의무이지 권한이 아니다' / '우리가 신실한 자들을 대변한다'. §H왕국의 대외 노선§!에 영향을 줍니다."
 SAU_reclaim_the_oic_leadership_choice_tt: "§Y선택지가 이어집니다§! - '자금을 댄다' / '인력을 댄다'."
 SAU_the_expatriate_workforce_question_choice_tt: "§Y선택지가 이어집니다§! - '본국으로 돌려보낸다' / '쓸모 있는 이들을 귀화시킨다'. §H왕국의 대외 노선§!에 영향을 줍니다."
 SAU_islamic_solidarity_conference_choice_tt: "§Y선택지가 이어집니다§! - '메카에서 소집한다' / '해외에서 소집한다'."
 SAU_the_sovereign_aid_question_choice_tt: "§Y선택지가 이어집니다§! - '자발적으로 베푸는 구호' / '조건부 원조'. §H왕국의 대외 노선§!에 영향을 줍니다."
 SAU_the_domestic_supply_quota_choice_tt: "§Y선택지가 이어집니다§! - '엄격한 할당' / '단계적 할당'."
 SAU_the_foreign_wealth_question_choice_tt: "§Y선택지가 이어집니다§! - '전부 본국으로 가져온다' / '수익이 나는 곳에 그대로 둔다'. §H왕국의 대외 노선§!에 영향을 줍니다."
 SAU_eradicate_foreign_dependency_choice_tt: "§Y선택지가 이어집니다§! - '무기가 먼저' / '그 밖의 모든 것이 먼저'."
 SAU_the_superpower_engagement_question_choice_tt: "§Y선택지가 이어집니다§! - '자립 위임령' / '무장 등거리 외교'. §H왕국의 대외 노선§!에 영향을 줍니다."
 SAU_the_international_forums_question_choice_tt: "§Y선택지가 이어집니다§! - '우리가 쓰지 않은 것에서는 탈퇴한다' / '내부에서 활용한다'. §H왕국의 대외 노선§!에 영향을 줍니다."
 SAU_the_spirit_of_73_choice_tt: "§Y선택지가 이어집니다§! - '금수 조치를 공개적으로 위협한다' / '조용히 시행한다'."
 SAU_the_fortress_kingdom_choice_tt: "§Y선택지가 이어집니다§! - '해안을 요새화한다' / '내륙을 요새화한다'."
 SAU_the_national_cadre_initiative_choice_tt: "§Y선택지가 이어집니다§! - '기술 학원' / '군사 학교'."
 SAU_the_sovereign_civil_service_choice_tt: "§Y선택지가 이어집니다§! - '시험으로 임용한다' / '충성도로 임용한다'."
 SAU_centralization_of_the_provincial_emirates_choice_tt: "§Y선택지가 이어집니다§! - '그들의 특허장을 매입한다' / '아예 교체한다'."
 SAU_the_foreign_bases_question_choice_tt: "§Y선택지가 이어집니다§! - '외국 깃발을 내린다. 그들은 본국으로 돌아간다' / '현 체제를 유지한다. 원칙이 금하는 것을 필요가 허용한다'."
 SAU_purge_the_westernized_elite_choice_tt: "§Y선택지가 이어집니다§! - '추방한다' / '재교육한다'."
 SAU_the_closed_frontier_choice_tt: "§Y선택지가 이어집니다§! - '완전히 봉쇄한다' / '필요한 이들만 받아들인다'."
 SAU_ban_foreign_media_choice_tt: "§Y선택지가 이어집니다§! - '위성을 전파 방해한다' / '방송망을 사들인다'."
 SAU_the_virtue_committees_return_choice_tt: "§Y선택지가 이어집니다§! - '대규모로 순찰하게 한다' / '자문 기구로 유지한다'."
 SAU_increase_the_ulemas_authority_choice_tt: "§Y선택지가 이어집니다§! - '법원을 맡긴다' / '학교를 맡긴다'."
 SAU_the_faisalite_resurgence_choice_tt: "§Y선택지가 이어집니다§! - '설교단에서 선포한다' / '궁정에서 선포한다'."
 SAU_the_2007_legal_reforms_choice_tt: "§Y선택지가 이어집니다§! - '앵글로색슨식 체계' / '샤리아 우선 체계' / '혼합 모델'."
 SAU_royal_decree_m_30_capital_market_law_choice_tt: "§Y선택지가 이어집니다§! - '독립적인 테크노크라트' / '왕실의 감독이 필수적이다' / '외국 전문가를 영입한다'."
 SAU_establish_corruption_courts_choice_tt: "§Y치세가 재편됩니다§! - 법원이 부패를 줄이고, 세금과 정치력이 함께 상승합니다. §R투자자들은 새로운 위험을 가격에 반영하며§!, 기소된 이들에게는 후원자가 있습니다."
 SAU_the_ritz_carlton_purge_choice_tt: "§Y치세가 재편됩니다§! - 숙청은 정치력, 더 낮은 부패, 더 나은 정보를 가져옵니다. §R외국 자본은 이를 재산 몰수로 받아들이고§! 왕국을 그에 맞게 평가합니다."
 SAU_backdoor_deals_choice_tt: "§Y치세가 재편됩니다§! - 수익, 시장 소득, 투자가 모두 개선됩니다. §R부패는 이중으로 심화되며§!, 궁정은 정치력으로 그 대가를 치릅니다."
 SAU_new_partners_choice_tt: "§Y선택지가 이어집니다§! - 평의회가 걸프 바깥에서 보증국을 고릅니다: '튀르키예' / '이란' / '인도' / '파키스탄' / '러시아'. 선택된 국가에는 응답하라는 요청이 전달됩니다."
 SAU_the_khaleeji_union_choice_tt: "§G걸프가 하나의 국가가 됩니다§! - 남은 GCC 회원국이 모두 §H병력과 함께 병합되고§!, 그 영토가 중핵이 되며, 왕국은 §H할리즈§!라는 이름을 취합니다."
 SAU_ras_al_khair_complex: "라스 알카이르 단지"
 SAU_ras_al_khair_complex_desc: "주바일 북쪽의 걸프 해안에서 왕국은 누구도 시도한 적 없는 규모의 담수화 및 발전 단지에 콘크리트를 붓습니다. 국가의 자금, 국가의 토지, 국가의 노동력으로 지어지며, 이에 서명한 이들이 사라진 뒤에도 계속 가동될 것입니다.\n\n§G하사에 화력 발전소와 기반시설을 건설하고§! 나라를 안정시킵니다.\n\n§R비용 600억§!. 왕국이 짓고, 왕국이 소유합니다."
 SAU_the_shuaibah_iwpp: "슈아이바 IWPP"
 SAU_the_shuaibah_iwpp_desc: "제다 남쪽에서 컨소시엄이 수전력 플랜트를 자사 재무제표에 올리고, 20년 계약에 따라 생산물을 왕국에 되팔게 됩니다. 더 저렴하고 더 빠르지만, 계량기는 다른 나라의 수도에서 읽습니다.\n\n§G헤자즈에 화력 발전소와 에너지 기반시설을 건설합니다§!.\n\n§R비용 300억이며 미국의 영향력이 깊어집니다§!. 값은 절반이지만 온전히 우리 것은 아닙니다."
 SAU_the_sovereign_saudi_water_company: "사우디 주권 수자원 공사"
 SAU_the_sovereign_saudi_water_company_desc: "누가 관을 깔았든, 왕국은 이제 요금, 비축량, 주 간 배분을 포함한 그 전부를 관장하는 단일한 주권 기업을 세웁니다. 처음으로 '왕국에 물이 얼마나 있는가'라는 질문에 답할 수 있는 하나의 창구가 생깁니다.\n\n왕국의 수자원 위상인 §G주권 수자원§!을 열고 정치력을 부여합니다.\n\n이것은 물을 만들어 내지 않습니다. 왕국이 그에 대해 책임지게 만들 뿐입니다."
 SAU_throttle_pipeline_yemen: "아라비아해 송유관 감축"
 SAU_throttle_pipeline_yemen_desc: "남부 노선을 한 단계 축소합니다. 우리의 수출과 수입이 줄어들지만, 사나에 지급하는 통과 수수료도 함께 줄어들며, 그들은 우리보다 훨씬 먼저 압박을 느끼게 될 것입니다."
 SAU_throttle_pipeline_syria: "레반트 송유관 감축"
 SAU_throttle_pipeline_syria_desc: "지중해 노선을 한 단계 축소합니다. 암만과 다마스쿠스 모두 몫이 줄어들며, 두 나라는 송유관을 채우는 원유가 누구의 것인지 다시 떠올리게 됩니다."
 SAU_throttle_pipeline_iraq: "유럽 송유관 감축"
 SAU_throttle_pipeline_iraq_desc: "북부 노선을 한 단계 축소합니다. 바그다드가 받는 수수료도 그만큼 줄어듭니다 - 밸브를 완전히 잠그지 않고도 압박을 가하는 방법입니다."
 SAU_tt_pipeline_shutdown_dependence: "§G석유 의존도가 감소합니다.§! 노선이 폐쇄되면 왕국은 원유 수출에 덜 의존하게 됩니다."
 SAU_shutdown_pipeline_yemen: "아라비아해 송유관 폐쇄"
 SAU_shutdown_pipeline_yemen_desc: "알마흐라의 밸브를 잠급니다. 수출 수입이 끊기지만 사나에 지급하던 통과 수수료도 끊깁니다 - 그리고 예멘은 단절당한 것을 용서하지 않을 것입니다."
 SAU_shutdown_pipeline_syria: "레반트 송유관 폐쇄"
 SAU_shutdown_pipeline_syria_desc: "지중해 노선을 폐쇄합니다. 암만과 다마스쿠스 모두 통과 수수료를 잃게 되며, 두 나라는 누가 펌프를 껐는지 기억할 것입니다."
 SAU_shutdown_pipeline_iraq: "유럽 송유관 폐쇄"
 SAU_shutdown_pipeline_iraq_desc: "북부 간선을 폐쇄합니다. 튀르키예 연장 구간은 운반할 것이 없어지므로 함께 폐쇄되며, 바그다드와 앙카라 모두 수수료를 잃습니다."
 SAU_shutdown_pipeline_turkey: "튀르키예 연장 구간 폐쇄"
 SAU_shutdown_pipeline_turkey_desc: "이라크 국경 너머로의 송유를 중단합니다. 간선은 계속 열려 있으며 - 앙카라만 몫을 잃게 되고, 앙카라는 이를 알아차릴 것입니다."
 SAU_events.355.a: "판매를 승인한다."
 SAU_events.355.b: "요청을 거절한다."
 SAU_events.355.desc: "리야드는 팔라딘을 원하며, 그것도 대량으로 원합니다. 왕국은 1970년대부터 미국제 155mm를 사격해 왔으므로 승무원, 구경, 사격 지휘 체계 전체가 이미 우리 것입니다. 그들이 사려는 것은 포대가 사격 후 대포병 레이더가 응답하기 전에 이동할 수 있게 해 주는 디지털 포탑입니다. 사우디는 현금으로 제때 지불할 것이며, 이 거래는 우리가 30년간 지켜 온 포 보유고에 경쟁자가 들어오는 것을 막아 줍니다. 또한 우리 곡사포가 우리가 통제할 수 없는 국경 전쟁의 사정권에 들어가게 됩니다."
 SAU_events.355.t: "사우디의 미국산 야포 요청"
 SAU_events.356.a: "판매를 승인한다."
 SAU_events.356.b: "요청을 거절한다."
 SAU_events.356.desc: "리야드로부터 이례적인 요청이 도착했습니다. 사우디가 므스타-S를 원합니다. 왕국은 러시아제 포를 구매한 적이 없고 포병들은 평생 서방 구경으로 훈련받았으므로, 실무적 근거는 빈약합니다. 정치적 근거는 그렇지 않습니다. 걸프에서 가장 자금이 풍부한 군대에 판매하면 석유 금수 조치 이래 워싱턴이 닫힌 곳으로 취급해 온 시장이 열리게 되며, 다른 모든 걸프 수도는 리야드가 어느 쪽을 바라보았는지 알아차릴 것입니다."
 SAU_events.356.t: "사우디의 러시아산 야포 요청"
 SAU_events.357.a: "판매를 승인한다."
 SAU_events.357.b: "요청을 거절한다."
 SAU_events.357.desc: "리야드가 CAESAR를 요청했으며, 이번만큼은 판촉 문구가 저절로 쓰입니다. 트럭 탑재 포는 왕국의 넓은 거리를 자력으로 이동하고, 수송 차량이 필요 없으며, 마지막 사격 1분 뒤에 다시 이동할 수 있습니다. 사우디는 바퀴 달린 곡사포가 자국 남부 국경에서 하는 일을 지켜보았고 당연한 결론을 내렸습니다. 이 주문은 로안의 생산 라인을 수년간 가동 상태로 유지시키고, 리야드를 프랑스의 포탄, 프랑스의 포신, 프랑스의 기술자에 묶어 둘 것입니다."
 SAU_events.357.t: "사우디의 프랑스산 야포 요청"
 SAU_events.358.a: "판매를 승인한다."
 SAU_events.358.b: "요청을 거절한다."
 SAU_events.358.desc: "사우디는 PzH 2000을 원하며, 이는 영광스러우면서도 곤란한 일입니다. 이것은 세계 최고의 곡사포이며 업계의 모두가 그 사실을 알고 있습니다. 또한 연방의회가 이 포가 어디에 쓰일지를 두고 2주 동안 논쟁하게 될 이유이기도 합니다. 왕국은 남부 국경에 전쟁을 안고 있는 대금 지불 고객이며, 허가는 바로 그 점에 신중하겠다고 약속한 정부가 서명해야 합니다. 업계는 이 주문을 원합니다. 연립이 이를 승인하고도 살아남을지는 알 수 없습니다."
 SAU_events.358.t: "사우디의 독일산 야포 요청"
 SAU_events.364.a: "판매를 승인한다."
 SAU_events.364.b: "요청을 거절한다."
 SAU_events.364.desc: "리야드가 M270을 요청하고 있으며, 이는 또 하나의 야포 판매가 아닙니다. 1분 이내에 한 개 대대 분량의 철을 격자 한 칸에 쏟아붓는 발사기는 전략 무기이며, 그것이 발사하는 로켓은 왕국이 발사기를 보유하는 한 우리가 공급하거나 보류할 수 있습니다. 이것은 영향력이며 동시에 노출입니다. 이 발사기가 무엇에 쓰이든 우리 국기가 새겨진 상자와 함께 보도될 것입니다."
 SAU_events.364.t: "사우디의 미국산 로켓 야포 요청"
 SAU_events.365.a: "판매를 승인한다."
 SAU_events.365.b: "요청을 거절한다."
 SAU_events.365.desc: "리야드가 스메르치 구매를 요청했으며, 이 요청은 주문이 가져다줄 수익보다 더 많은 것을 알려 줍니다. 미국제를 살 수 있는 나라에 300mm 발사기를 파는 사람은, 그 나라가 거절당한 경우가 아니라면 없습니다. 왕국은 워싱턴에서 얻을 수 없는 사거리를 원하며, 그것을 찾으러 모스크바까지 올 의사가 있습니다. 포는 좋은 판매입니다. 선례는 더 좋은 판매입니다."
