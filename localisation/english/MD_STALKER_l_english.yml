l_english:
 STALKER.1.t: "The Zone Breaches Containment"
 STALKER.1.d: "Anomalous activity around Chornobyl has expanded beyond the old exclusion perimeter. The government must decide whether to seal the Zone under military authority or permit controlled scientific access."
 STALKER.1.a: "Seal the perimeter under military control."
 STALKER.1.b: "Open the Zone to scientific teams."
 STALKER.2.t: "An Emission Sweeps the Zone"
 STALKER.2.d: "A violent wave of anomalous energy has swept across [event_target:STALKER_zone_event_target.GetName]. Infrastructure has been disrupted and the Zone has become more active."
 STALKER.2.a: "Assess the damage."
 STALKER_zone_management_category: "Zone Administration"
 STALKER_zone_management_category_desc: "Balance containment, public safety, and scientific access in the anomalous territories under our control."
 STALKER_reinforce_zone_containment: "Reinforce the Perimeter in [FROM.GetName]"
 STALKER_reinforce_zone_containment_desc: "Deploy additional personnel and equipment to suppress anomalous activity in [FROM.GetName].\n\nCurrent activity: §Y[?FROM.STALKER_zone_activity|0]§!\nCurrent containment: §Y[?FROM.STALKER_zone_containment|0]§!\nCurrent exploitation: §Y[?FROM.STALKER_zone_exploitation|0]§!\nEmission outlook: §Y[FROM.STALKER_current_emission_risk]§!\n\nAfter the first emission, monthly risk is §Y(Activity + Exploitation - Containment) × 0.2§!, clamped between §Y2%§! and §Y20%§!."
 STALKER_zone_presence: "The Zone"
 STALKER_zone_presence_desc: "An expanding region of lethal anomalies, altered ecosystems, and unreliable physical laws."
 STALKER_emission_disruption: "Emission Disruption"
 STALKER_emission_disruption_desc: "A recent emission has disrupted military and economic activity."
 STALKER_zone_administration: "Zone Administration"
 STALKER_zone_administration_desc: "Maintaining the perimeter consumes national resources, while controlled exploitation of the Zone produces scientific insights."
 STALKER_military_policy_tt: "Costs §Y0.2%§! of GDP. Sets Zone §Ycontainment§! to §Y60§! and §Yexploitation§! to §Y0§!. The first emission is guaranteed after the §Y90-day§! grace period. These starting values give §Y2%§! recurring monthly risk before emission effects or further actions."
 STALKER_scientific_policy_tt: "Costs §Y0.2%§! of GDP. Sets Zone §Ycontainment§! to §Y30§! and §Yexploitation§! to §Y30§!, providing §G+1.5%§! research speed while this Zone remains under our control. The first emission is guaranteed after the §Y90-day§! grace period. These starting values give §Y12%§! recurring monthly risk before emission effects or further actions."
 STALKER_reinforce_zone_containment_tt: "Zone §Ycontainment§! increases by §G20§!, while §Yactivity§! falls by up to §G10§! and §Yexploitation§! falls by up to §R5§!."
 STALKER_current_emission_risk_value: "[?STALKER_emission_risk_display|.1]%"
 STALKER_first_emission_outlook: "Opening emission guaranteed on the first monthly pulse after the 90-day grace period and policy selection"
 STALKER_emission_cooldown_outlook: "No emission risk while the 180-day cooldown is active"
 STALKER_cordon_crackdown: "Cordon Crackdown in [FROM.GetName]"
 STALKER_cordon_crackdown_desc: "Sweep the Cordon's villages and checkpoints for bandit gangs and the traders who fence their goods.$STALKER_zone_society_readout$"
 STALKER_cordon_crackdown_tt: "Zone §YBandit§! influence falls by up to §G20§!, the §Ystalker§! population falls by up to §R10§!, and §Ycontainment§! rises by §G5§!."
 STALKER_license_cordon_trader: "License a Cordon Trader in [FROM.GetName]"
 STALKER_license_cordon_trader_desc: "Give one trader at the edge of the Zone a state license to buy artifacts from stalkers, so more of the haul reaches our laboratories instead of the gangs.$STALKER_zone_society_readout$"
 STALKER_license_cordon_trader_tt: "Zone §Yexploitation§! rises by §G10§!, §YBandit§! influence falls by up to §G10§!, the §Ystalker§! population rises by §Y10§!, and §YFreedom§! influence rises by §Y5§!."
 STALKER_back_duty: "Back Duty in [FROM.GetName]"
 STALKER_back_duty_desc: "Quietly arm and supply Duty, the disciplined faction that believes the Zone must be contained or destroyed. Duty influence keeps stalkers and bandits away from the Zone.$STALKER_zone_society_readout$"
 STALKER_back_duty_tt: "Zone §YDuty§! influence rises by §G20§! and §YFreedom§! influence falls by up to §Y10§!."
 STALKER_back_freedom: "Back Freedom in [FROM.GetName]"
 STALKER_back_freedom_desc: "Look the other way while Freedom, the faction that insists the Zone belongs to no government, opens paths for stalkers and researchers. Freedom influence draws more stalkers into the Zone.$STALKER_zone_society_readout$"
 STALKER_back_freedom_tt: "Zone §YFreedom§! influence rises by §G20§! and §YDuty§! influence falls by up to §Y10§!."
 STALKER_study_recovered_artifacts: "Study Recovered Artifacts"
 STALKER_study_recovered_artifacts_desc: "Send a batch of recovered artifacts to our laboratories for study.\n\nArtifact stockpile: §Y[?ROOT.STALKER_artifact_stockpile|1]§!"
 STALKER_study_recovered_artifacts_tt: "Spends §Y10§! artifacts from the national stockpile and grants §G+3%§! research speed for §Y180 days§!."
 STALKER_artifact_studies: "Artifact Studies"
 STALKER_artifact_studies_desc: "Our laboratories are studying artifacts recovered from the Zone."
 STALKER.3.t: "Duty and Freedom Clash"
 STALKER.3.d: "Gunfire has broken out between Duty and Freedom near [event_target:STALKER_zone_event_target.GetName]. Duty accuses Freedom of smuggling stalkers past the perimeter; Freedom says Duty is doing the government's work for free. Both sides are asking which way we will lean."
 STALKER.3.a: "Side with Duty."
 STALKER.3.a_tt: "Zone §YDuty§! influence rises by §G10§!, §YFreedom§! influence falls by up to §Y15§!, and the §Ystalker§! population falls by up to §Y5§!."
 STALKER.3.b: "Side with Freedom."
 STALKER.3.b_tt: "Zone §YFreedom§! influence rises by §G10§!, §YDuty§! influence falls by up to §Y15§!, and the §Ystalker§! population falls by up to §Y5§!."
 STALKER.3.c: "Let them fight it out."
 STALKER.3.c_tt: "Zone §YDuty§! and §YFreedom§! influence each fall by up to §Y10§!, the §Ystalker§! population falls by up to §Y10§!, and §YBandit§! influence rises by §R5§!."
 STALKER.4.t: "The Cordon Black Market"
 STALKER.4.d: "Our border guards report an open-air market on the edge of [event_target:STALKER_zone_event_target.GetName], where bandits sell artifacts to buyers from as far away as Kyiv and Minsk. Some of our own officers are among the customers."
 STALKER.4.a: "Raid the market."
 STALKER.4.a_tt: "Zone §YBandit§! influence falls by up to §G15§! and the §Ystalker§! population falls by up to §Y5§!."
 STALKER.4.b: "Buy through front companies."
 STALKER.4.b_tt: "Adds §G3§! artifacts to the national stockpile. Zone §YBandit§! influence rises by §R5§!."
 STALKER.5.t: "An Unusual Artifact"
 STALKER.5.d: "A group of Freedom stalkers has brought an artifact out of [event_target:STALKER_zone_event_target.GetName] unlike anything our scientists have catalogued. They want to keep it; our laboratories want it more."
 STALKER.5.a: "Send it to our laboratories."
 STALKER.5.a_tt: "Adds §G5§! artifacts to the national stockpile."
 STALKER.5.b: "Let the stalkers keep it."
 STALKER.5.b_tt: "Zone §YFreedom§! influence rises by §G10§! and the §Ystalker§! population rises by §Y5§!."
 STALKER_xlab_expedition: "Fund an X-Lab Expedition into [FROM.GetName]"
 STALKER_xlab_expedition_desc: "Hire stalker guides to lead a scientific team toward the sealed Soviet laboratories beneath the Zone.\n\nInvestigation: §Y[ROOT.STALKER_xlab_stage_name]§!\nProgress to the next discovery: §Y[?ROOT.STALKER_xlab_progress|0]§! / 100\nStalkers: §Y[?FROM.STALKER_zone_stalkers|0]§! | Exploitation: §Y[?FROM.STALKER_zone_exploitation|0]§!"
 STALKER_xlab_expedition_tt: "Adds §Y20§! investigation progress, plus §Y0.1§! for each point of Zone §Ystalkers§! and §Yexploitation§!. There is a §R25%§! chance the expedition loses its guides, reducing the §Ystalker§! population by up to §R5§!. At §Y100§! progress the investigation uncovers its next stage."
 STALKER_xlab_stage_reward_tt: "Adds §G5§! artifacts to the national stockpile and §G+1%§! research speed from our X-Lab findings."
 STALKER_xlab_stage_0: "No leads"
 STALKER_xlab_stage_1: "X-18 found in Dark Valley"
 STALKER_xlab_stage_2: "Project X uncovered at X-16"
 STALKER_xlab_stage_3: "C-Consciousness revealed at X-10"
 STALKER_xlab_stage_4: "Wider network suspected"
 STALKER_xlab_findings: "X-Lab Findings"
 STALKER_xlab_findings_desc: "Research recovered from the Soviet laboratories beneath the Zone."
 STALKER.10.t: "Laboratory X-18"
 STALKER.10.d: "Our expedition has found a sealed Soviet laboratory beneath an abandoned factory in Dark Valley, near [event_target:STALKER_zone_event_target.GetName]. Its only marking is X-18. Much of it is flooded, but the surviving equipment and the artifact samples in its vaults are decades ahead of anything the Soviet Union ever admitted to building."
 STALKER.10.a: "Strip the laboratory."
 STALKER.11.t: "Project X"
 STALKER.11.d: "At Yantar, a psi-emitter hidden in Laboratory X-16 has been turning stalkers into mindless wanderers. The documents beside it name the programme that built it: Project X. Its researchers were not studying the Zone; they appear to have been trying to create it."
 STALKER.11.a: "Shut the emitter down."
 STALKER.12.t: "The C-Consciousness"
 STALKER.12.d: "Laboratory X-10 powers the Brain Scorcher, the psi-installation that has kept everyone out of the northern Zone. Its files describe the C-Consciousness: scientists who linked their minds to one another and to something they called the noosphere. The Zone, the emissions and the Monolith were side effects of an experiment that never stopped running."
 STALKER.12.a: "Disable the Brain Scorcher."
 STALKER.13.t: "A Wider Network"
 STALKER.13.d: "Cross-referencing the X-Lab files has turned up something worse. Funding, personnel and equipment for Project X flowed through institutions far outside the Zone, and some of those channels may still be open. Our analysts believe other governments, including our own, may have been penetrated."
 STALKER.13.a: "Open a counterintelligence review."
 STALKER.13.a_tt: "Starts a quiet review of our own ministries and research institutes for surviving Project X channels. It reports in §Y180 days§!."
 STALKER.13.b: "Keep it inside a small circle."
 STALKER.13.b_tt: "Restricts the findings to a handful of officials. There is a §R40%§! chance they leak within a year."
 STALKER.10.a_tt: "Adds another §G5§! artifacts to the national stockpile."
 STALKER.10.b: "Seal it and post a guard."
 STALKER.10.b_tt: "Zone §Ycontainment§! rises by §G10§!."
 STALKER.11.a_tt: "Zone §Yactivity§! falls by up to §G10§!."
 STALKER.11.b: "Keep it running for study."
 STALKER.11.b_tt: "Our X-Lab findings grant another §G+1%§! research speed. The §Ystalker§! population falls by up to §R10§!."
 STALKER.12.a_tt: "Opens the northern Zone: §Yexploitation§! rises by §G10§! and the §Ystalker§! population rises by §Y10§!."
 STALKER.12.b: "Leave it running as a barrier."
 STALKER.12.b_tt: "Zone §Ycontainment§! rises by §G10§!."
 STALKER.14.t: "The Counterintelligence Review Reports"
 STALKER.14.d_found: "Our investigators have traced Project X money through a research institute and two defence suppliers to officials still on the state payroll. The network has been quietly dismantled, and the officials who exposed it have earned the government some credit."
 STALKER.14.d_dead_end: "The review has found nothing. Either the Project X channels closed long ago, or whoever still runs them covered their tracks better than our investigators could follow."
 STALKER.14.a: "Good work."
 STALKER.14.b: "Keep the file open."
 STALKER.15.t: "The X-Lab Files Leak"
 STALKER.15.d: "Extracts from our classified X-Lab findings have appeared in the foreign press. The public now knows the Zone was no accident, and wants to know how long the government has known."
 STALKER.15.a: "Deny everything."
 STALKER_request_international_containment: "Request an International Containment Force"
 STALKER_request_international_containment_desc: "Ask the major powers to help garrison the Zone perimeter. A multinational force brings money, troops and scientists, and every contributor will expect access in return."
 STALKER_request_international_containment_tt: "Every Zone we control gains §G10§! §Ycontainment§! and loses up to §G10§! §YBandit§! influence. Every major power at peace with us is invited to contribute; each contributor adds another §G5§! §Ycontainment§!, cuts §YBandit§! influence by up to §G5§! and gains research access to the Zone."
 STALKER_transfer_artifacts: "Transfer Artifacts to [FROM.GetName]"
 STALKER_transfer_artifacts_desc: "Send a consignment of recovered artifacts to [FROM.GetName]'s laboratories as a gesture of goodwill.\n\nArtifact stockpile: §Y[?ROOT.STALKER_artifact_stockpile|1]§!"
 STALKER_transfer_artifacts_tt: "Spends §Y5§! artifacts from the national stockpile. [FROM.GetName] gains §G+3%§! research speed for §Y180 days§! and a better opinion of us."
 STALKER_foreign_zone_access: "Zone Research Access"
 STALKER_foreign_zone_access_desc: "Our scientists have access to the anomalous Zone under an international agreement."
 STALKER_granted_zone_access: "Granted us access to the Zone"
 STALKER_refused_zone_access: "Refused us access to the Zone"
 STALKER_returned_artifacts: "Returned seized artifacts"
 STALKER_ipsf_contribution: "Contributed to the Zone containment force"
 STALKER_artifact_gift: "Gifted us Zone artifacts"
 STALKER.20.t: "Anomalous Artifacts Seized"
 STALKER.20.d: "Customs officers at one of our ports have opened a shipment of machine parts and found a dozen objects that glow, hum or float. The paperwork traces them back through three shell companies to the Zone."
 STALKER.20.d_usa: "The FBI has broken up a smuggling ring selling Zone artifacts to private collectors in New York and Los Angeles. The seized objects glow, hum or float, and the agents who handled them without gloves are now in hospital."
 STALKER.20.a: "Send them to our laboratories."
 STALKER.20.a_tt: "Grants §G+3%§! research speed for §Y90 days§!."
 STALKER.20.b: "Return them to [event_target:STALKER_zone_controller_target.GetName]."
 STALKER.21.t: "A Request for Zone Access"
 STALKER.21.d: "[event_target:STALKER_access_requester.GetName] has asked to send a scientific team into [event_target:STALKER_zone_event_target.GetName]. Their scientists would work alongside ours, and they are offering to share what they find."
 STALKER.21.a: "Grant them access."
 STALKER.21.a_tt: "[event_target:STALKER_access_requester.GetName] gains §G+1%§! research speed from Zone research access. Zone §Yexploitation§! rises by §G5§!."
 STALKER.21.b: "Refuse the request."
 STALKER.23.t: "A Force for the Zone"
 STALKER.23.d: "[event_target:STALKER_ipsf_host.GetName] has asked the major powers to help garrison the anomalous Zone on its territory. Contributors will share the cost of the perimeter and gain access for their scientists."
 STALKER.23.a: "Send a contingent."
 STALKER.23.a_tt: "Every Zone [event_target:STALKER_ipsf_host.GetName] controls gains §G5§! §Ycontainment§! and loses up to §G5§! §YBandit§! influence. We gain §G+1%§! research speed from Zone research access."
 STALKER.23.b: "This is not our problem."
 STALKER.24.t: "An International Force for the Zone"
 STALKER.24.d: "[event_target:STALKER_ipsf_host.GetName] has asked the world's major powers to help contain the anomalous Zone. Diplomats in several capitals say a multinational perimeter force could be in place within weeks."
 STALKER.24.a: "The Zone is everyone's problem now."
 STALKER_zone_society_readout: "\n\nStalkers: §Y[?FROM.STALKER_zone_stalkers|0]§!\nDuty: §Y[?FROM.STALKER_zone_duty|0]§! | Freedom: §Y[?FROM.STALKER_zone_freedom|0]§! | Bandits: §Y[?FROM.STALKER_zone_bandits|0]§!\nArtifacts last month: §Y[?FROM.STALKER_zone_artifact_haul|1]§!, of which §R[?FROM.STALKER_zone_black_market|1]§! reached the black market"
 STALKER_study_recovered_artifacts_available_tt: "Have at least §Y10§! artifacts in the national stockpile (currently §Y[?ROOT.STALKER_artifact_stockpile|1]§!)."
 STALKER_transfer_artifacts_available_tt: "Have at least §Y5§! artifacts in the national stockpile (currently §Y[?ROOT.STALKER_artifact_stockpile|1]§!)."
 STALKER_xlab_final_stage_reward_tt: "Our X-Lab findings grant another §G+1%§! research speed."
 STALKER.30.t: "The Battle for the Zone"
 STALKER.30.d: "A new emission storm has torn open paths into the heart of [event_target:STALKER_zone_event_target.GetName], and every faction is racing for the center: the Ward, the Spark, the resurgent Monolith and a lone stalker the others call Skif. Our perimeter is failing while they fight."
 STALKER.30.a: "Send in the army."
 STALKER.30.a_tt: "Costs §R50§! political power. Zone §Ycontainment§! rises by §G20§! and the §Ystalker§! population falls by up to §Y10§!."
 STALKER.30.b: "Back the Ward."
 STALKER.30.b_tt: "Zone §Ycontainment§! and §Yexploitation§! each rise by §G10§!, and §YFreedom§! influence falls by up to §Y10§!."
 STALKER.30.c: "Let the stalkers settle it."
 STALKER.30.c_tt: "The §Ystalker§! population rises by §Y10§! and §YBandit§! influence rises by §R10§!."
 STALKER.31.t: "Skif Enters the Eighth Pod"
 STALKER.31.d: "At the heart of the Zone, the stalker known as Skif has spared the Doctor and entered the eighth pod of the C-Consciousness. Scientists across the world report the same readings within the hour: the Zone is no longer tied to Chornobyl."
 STALKER.31.a: "What happens now?"
 STALKER.32.t: "Anomalies Reported Worldwide"
 STALKER.32.d: "Governments on every continent are reporting anomalous activity: dead birds in circles, compasses spinning, whole villages losing radio contact. The UN Security Council has called an emergency session, and no delegation yet knows what to ask for."
 STALKER.32.a: "The Zone is everywhere now."
 STALKER.33.t: "After the Eighth Pod"
 STALKER.33.d: "Whatever Skif did in the heart of the Zone, [event_target:STALKER_zone_event_target.GetName] is more violent than it has ever been. Our generals want a new perimeter; our scientists say the world will need what they learn inside."
 STALKER.33.a: "Rebuild the perimeter."
 STALKER.33.a_tt: "Costs §R50§! political power. Zone §Ycontainment§! rises by §G20§!."
 STALKER.33.b: "Open the Zone to the world's scientists."
 STALKER.33.b_tt: "Zone §Yexploitation§! rises by §G15§!, increasing our Zone research."
 STALKER.1.d_global: "Since the eighth pod opened, anomalies have been spreading far from Chornobyl, and now one has taken hold in [event_target:STALKER_zone_event_target.GetName]. The government must decide whether to seal the new Zone under military authority or permit controlled scientific access."
 STALKER.1.d_lake_mungo: "At Lake Mungo, among dry lakebeds and some of the oldest human remains ever found in Australia, instruments have gone silent and visitors report seeing people who are not there. The government must decide whether to seal the Lake Mungo Anomalous Zone under military authority or permit controlled scientific access."
 STALKER.31.d_contained: "At the heart of the Zone, the stalker known as Skif has spared the Doctor and entered the eighth pod of the C-Consciousness. The Zone has lashed out across the north of Ukraine, but instruments abroad register nothing unusual."
