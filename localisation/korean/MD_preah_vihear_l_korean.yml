l_korean:
 preah_vihear_decisions_category: "프레아비히어 국경 분쟁"
 preah_vihear_dispute: "프레아비히어 사원 분쟁"
 SIA_escalate_preah_vihear_tensions: "국경 긴장 고조"
 SIA_escalate_preah_vihear_tensions_desc: "대치를 본격적으로 개시합니다. 당렉 절벽 인근으로 병력을 재배치하도록 명령하고 민족주의 언론이 이를 부각하게 둡니다. 프놈펜은 메시지를 분명히 알아들을 것이며, 이 첫 수는 되돌릴 수 없습니다."
 SIA_request_asean_mediation: "아세안 중재 요청"
 SIA_request_asean_mediation_desc: "캄보디아와의 국경 분쟁을 중재해 달라고 아세안에 요청합니다. 이 외교적 접근은 긴장을 완화하고 평화적 해결책을 찾는 데 도움이 될 수 있습니다."
 SIA_accept_icj_ruling: "ICJ 판결 수용"
 SIA_accept_icj_ruling_desc: "프레아비히어 사원 분쟁에 대한 국제사법재판소 판결을 수용합니다. 분쟁은 끝나겠지만 외교적 패배로 비칠 수 있습니다."
 SIA_reject_icj_ruling: "ICJ 판결 거부"
 SIA_reject_icj_ruling_desc: "ICJ 판결을 거부하고 분쟁 지역에 대한 우리의 영유권 주장을 계속합니다. 국제적 긴장이 고조되겠지만 우리의 결의를 보여 줄 것입니다."
 CBD_protest_thai_actions: "외교적 항의"
 CBD_protest_thai_actions_desc: "태국 대사를 소환하고 아세안과 국제연합에 공식 항의를 제기하여, 정부가 입장을 굽히지 않는 모습을 국민에게 보여 줍니다. 이는 국내 정치적 자본을 결집하고 우리의 불만을 공식 기록에 남기지만, 방콕이 진정시킬 의사가 전혀 없는 국경을 진정시키는 척하지는 않습니다."
 CBD_request_asean_mediation: "아세안 중재 요청"
 CBD_request_asean_mediation_desc: "태국과의 국경 분쟁을 중재해 달라고 아세안에 요청합니다. 지역 차원의 외교적 해결은 우리의 영유권 주장을 지키는 데 도움이 될 수 있습니다."
 CBD_appeal_to_icj: "ICJ에 제소"
 CBD_appeal_to_icj_desc: "프레아비히어 사원과 주변 영토에 대한 캄보디아의 주권을 재확인하기 위해 국제사법재판소에 소송을 제기합니다."
 preah_vihear.100.t: "유네스코, 프레아비히어를 세계유산으로 지정"
 preah_vihear.100.d: "유엔 교육과학문화기구가 공식적으로 프레아비히어 사원을 세계유산으로 지정하고 캄보디아의 것으로 귀속시켰습니다. 태국 전역에서 민족주의 시위가 일어났으며, 시위대는 자신들이 태국 영토라고 여기는 곳을 지키기 위한 군사 행동을 요구하고 있습니다. 국경 지대의 상황이 급속히 악화되고 있습니다."
 preah_vihear.100.a: "이것은 분노할 일이다! 병력을 동원하라!"
 preah_vihear.100.b: "국제 사회의 결정을 존중해야 한다"
 preah_vihear.101.t: "유네스코, 프레아비히어를 인정"
 preah_vihear.101.d: "유네스코가 고대 프레아비히어 사원을 캄보디아 주권 하의 세계유산으로 공식 지정했습니다. 이는 1962년 ICJ 판결을 재확인하는 중대한 외교적 승리입니다. 그러나 태국의 민족주의 시위로 인해 국경 지대의 긴장이 고조될 수 있습니다."
 preah_vihear.101.a: "캄보디아에 위대한 날이다!"
 preah_vihear.1.t: "국경에서의 태국의 도발"
 preah_vihear.1.d: "태국이 프레아비히어 사원 인근 국경에서 긴장을 고조시켰습니다. 방콕의 민족주의 시위대가 군사 행동을 요구하고 있으며, 태국군은 분쟁 지역 가까이로 재배치되었습니다."
 preah_vihear.1.a: "경계를 늦추지 말아야 한다"
 preah_vihear.5.t: "태국군 공격!"
 preah_vihear.5.d: "태국군이 프레아비히어 사원 인근 분쟁 국경 지역으로 침공을 개시했습니다. 우리 병력이 공격자들과 교전 중입니다. 상황이 전면전으로 확대될 위기에 처한 가운데 국제 사회가 지켜보고 있습니다."
 preah_vihear.5.a: "우리 영토를 지켜라!"
 preah_vihear.6.t: "캄보디아의 반격"
 preah_vihear.6.d: "캄보디아군이 프레아비히어 사원 인근 우리 진지에 반격을 개시했습니다. 국경을 따라 포격과 소화기 사격 소리가 들리고 있습니다."
 preah_vihear.6.a: "진지를 사수해야 한다"
 preah_vihear.10.t: "국경 충돌 승리"
 preah_vihear.10.d: "우리 군이 프레아비히어 인근 국경 충돌에서 목표를 달성했습니다. 적은 격퇴되었으며, 우리는 이 지역에서 군사 능력을 입증했습니다."
 preah_vihear.10.a: "훌륭한 소식이다"
 preah_vihear.11.t: "국경 충돌 패배"
 preah_vihear.11.d: "우리 군이 프레아비히어 인근 국경 충돌에서 격퇴당했습니다. 교전은 실패로 끝났으며, 우리 병력은 사상자를 낸 채 이전 진지로 후퇴했습니다."
 preah_vihear.11.a: "쓰라린 좌절이다"
 preah_vihear.12.t: "결판 나지 않은 국경 충돌"
 preah_vihear.12.d: "프레아비히어 인근 국경 충돌이 교착 상태로 끝났습니다. 양측 모두 목표를 달성하지 못한 채 철수했지만, 둘 다 귀중한 전투 경험을 얻었습니다."
 preah_vihear.12.a: "재편성하고 재평가한다"
 preah_vihear.13.t: "반격 승리"
 preah_vihear.13.d: "우리의 반격이 적군을 밀어내는 데 성공했습니다. 우리 영토에 대한 침략에는 단호한 저항이 따른다는 것을 입증했습니다."
 preah_vihear.13.a: "우리의 주권은 수호되었다"
 preah_vihear.14.t: "반격 격퇴됨"
 preah_vihear.14.d: "우리의 반격이 적군에게 격퇴되었습니다. 최선의 노력에도 불구하고 분쟁 지역의 적 진지에서 그들을 몰아낼 수 없었습니다."
 preah_vihear.14.a: "우리는 회복할 것이다"
 preah_vihear.20.t: "아세안 중재 제안"
 preah_vihear.20.d: "태국이 프레아비히어 국경 분쟁에 대한 아세안의 중재를 요청했습니다. 아세안 의장국인 인도네시아는 국경 지역에 참관단을 파견하고 양측 간 협상을 촉진할 것을 제안하고 있습니다."
 preah_vihear.20.a: "중재를 수락한다"
 preah_vihear.20.b: "중재를 거부한다"
 preah_vihear.21.t: "아세안 중재 제안"
 preah_vihear.21.d: "캄보디아가 프레아비히어 국경 분쟁에 대한 아세안의 중재를 요청했습니다. 아세안 의장국인 인도네시아는 국경 지역에 참관단을 파견하고 양측 간 협상을 촉진할 것을 제안하고 있습니다."
 preah_vihear.21.a: "중재를 수락한다"
 preah_vihear.21.b: "중재를 거부한다"
 preah_vihear.22.t: "아세안 중재 수락됨"
 preah_vihear.22.d: "태국과 캄보디아 양측이 아세안의 중재에 동의했습니다. 인도네시아 참관단이 국경 지역에 배치되고, 분쟁의 평화적 해결을 모색하기 위한 외교 협상이 시작될 것입니다."
 preah_vihear.22.a: "평화로 가는 길"
 preah_vihear.23.t: "아세안 중재 거부됨"
 preah_vihear.23.d: "상대측이 프레아비히어 분쟁에 대한 아세안의 중재를 거부했습니다. 외교적 노력은 실패했으며 국경의 긴장은 여전히 높습니다."
 preah_vihear.23.a: "계속되는 대치에 대비해야 한다"
 preah_vihear.30.t: "캄보디아, ICJ에 제소"
 preah_vihear.30.d: "캄보디아가 프레아비히어 사원 분쟁과 관련하여 국제사법재판소에 소송을 제기했습니다. 재판소는 캄보디아의 잠정 조치 요청을 검토하고 최종적으로 주권 문제에 대해 판결할 것입니다."
 preah_vihear.30.a: "재판소의 결정을 기다린다"
 preah_vihear.31.t: "ICJ, 우리에게 유리한 판결"
 preah_vihear.31.d: "국제사법재판소가 프레아비히어 사원에 대한 캄보디아의 주권을 재확인하고 양측에 사원 주변 잠정 비무장 지대에서 군 인력을 철수하라고 명령했습니다."
 preah_vihear.31.a: "국제법은 우리 편이다"
 preah_vihear.32.t: "ICJ, 우리에게 불리한 판결"
 preah_vihear.32.d: "국제사법재판소가 프레아비히어 사원에 대한 캄보디아의 주권 주장을 인정하는 판결을 내렸습니다. 재판소는 분쟁 지역 주변에 비무장 지대를 설치할 것을 명령했습니다."
 preah_vihear.32.a: "이는 부당한 판결이다"
 preah_vihear.35.t: "태국, ICJ 판결 수용"
 preah_vihear.35.d: "태국이 프레아비히어 사원 분쟁에 대한 ICJ 판결을 수용했습니다. 태국군은 비무장 지대에서 철수할 것이며, 이로써 국경 위기는 사실상 종료됩니다."
 preah_vihear.35.a: "마침내 평화다"
 preah_vihear.36.t: "태국, ICJ 판결 거부"
 preah_vihear.36.d: "태국이 프레아비히어 사원 분쟁에 대한 ICJ 판결을 부당하다고 비난하며 재판소의 관할권을 인정하기를 거부했습니다. 국경의 긴장이 고조될 것으로 예상됩니다."
 preah_vihear.36.a: "계속되는 분쟁에 대비해야 한다"
 preah_vihear_news.1.t: "프레아비히어 분쟁 해결"
 preah_vihear_news.1.d: "프레아비히어 사원을 둘러싼 태국과 캄보디아의 오랜 국경 분쟁이 해결되었습니다. 태국은 사원 단지에 대한 캄보디아의 주권을 인정한 국제사법재판소 판결을 수용했습니다. 양국은 해당 지역에서 군을 철수하고 정상적인 외교 관계를 수립하기로 합의했습니다."
 preah_vihear_news.1.o1: "지역 안정 회복"
 preah_vihear_news.2.t: "아세안, 국경 분쟁 중재"
 preah_vihear_news.2.d: "아세안의 중재를 통해 태국과 캄보디아는 프레아비히어 사원을 둘러싼 국경 분쟁을 완화하기로 합의했습니다. 양국이 외교적 해결책을 모색하는 동안 인도네시아 참관단이 휴전을 감시할 것입니다."
 preah_vihear_news.2.o1: "외교의 승리"
 preah_vihear_news.3.t: "태국과 캄보디아 사이에서 국경 충돌 발발"
 preah_vihear_news.3.d: "분쟁 중인 프레아비히어 사원 인근 태국-캄보디아 국경을 따라 무력 충돌이 발생했습니다. 태국군이 이 지역에서 군사 작전을 개시했고, 캄보디아군이 대응하고 있습니다. 포격과 소화기 교전이 보고되었습니다. 유네스코 세계유산인 고대 사원 단지는 양국이 영토 분쟁을 확대하는 가운데 교전의 한복판에 놓였습니다."
 preah_vihear_news.3.o1: "위험한 확전"
 preah_vihear_decisions_category_desc: "11세기 크메르 성소인 프레아비히어 사원은 당렉 절벽 위에 자리하고 있으며, 프랑스 식민지 시대의 지도와 1962년 ICJ 판결이 캄보디아에 유리하게 확정했으나 태국은 이를 완전히 받아들인 적이 없는 국경에 걸쳐 있습니다. 2008년 유네스코 세계유산 등재는 이 상처를 다시 열었으며, 사원 주변 산비탈은 성소 자체가 아닌 곳에서도 여전히 분쟁 지대로 남아 있습니다. 확전은 절벽을 둘러싼 전투의 문을 엽니다. 모든 충돌은 양측이 아끼고 싶어 하는 자원을 소모합니다. \n\n§Y국경 긴장:§! [?GLOBAL.preah_vihear_tension]\n§Y우리의 준비 태세:§! [?THIS.preah_vihear_readiness]\n§Y우리의 분쟁 진행도:§! [?THIS.preah_vihear_war_progress]"
 preah_vihear_deescalation_goodwill: "긴장 완화 호의"
 SIA_pv_prepare_infantry_training: "보병 야전 훈련 실시"
 SIA_pv_prepare_infantry_training_desc: "당렉 절벽 일대 지형에서 최전선 보병 부대를 실사격 훈련에 순환 투입하며, 비축된 소화기와 지원 화기를 활용해 캄보디아와의 국경 대치에 대비한 즉응 태세를 갈고닦습니다."
 SIA_pv_prepare_armor_training: "기갑 야전 훈련 실시"
 SIA_pv_prepare_armor_training_desc: "기갑 부대를 프레아비히어 인근 산지로 이동시켜 기동 훈련을 실시하고, 어느 쪽에도 적합하지 않은 지형에서 수륙양용 전차와 중형 전차가 어떤 성능을 발휘하는지 시험합니다."
 SIA_pv_prepare_artillery_training: "포병 야전 훈련 실시"
 SIA_pv_prepare_artillery_training_desc: "사원이 내려다보이는 절벽을 향해 포병 중대를 사격 훈련시키며, 이 국경을 따라 이미 한 번 이상 벌어진 교전 양상을 예행연습합니다."
 SIA_pv_nationalist_rhetoric: "국내 민족주의 여론 결집"
 SIA_pv_nationalist_rhetoric_desc: "장관, 군 대변인, 국영 언론이 캄보디아와의 국경 분쟁을 두고 국내 민족주의 여론을 결집하도록 장려합니다. 국내 청중에게는 호응을 얻지만, 매번 국경의 긴장은 높아집니다."
 SIA_pv_military_posturing: "국경에 병력 재배치"
 SIA_pv_military_posturing_desc: "결의를 과시하기 위해 프레아비히어 인근 국경으로 추가 부대를 이동시킵니다. 캄보디아는 이를 있는 그대로 받아들일 것입니다."
 SIA_pv_attack_preah_vihear: "국경 침공 개시"
 SIA_pv_attack_preah_vihear_desc: "사원 단지 주변 땅을 장악하기 위해 육군 부대를 국경 너머로 파견합니다. 성공하면 분쟁 지역이 우리의 화력 아래 놓입니다. 실패하면 국내외 지지에서 막대한 대가를 치르게 됩니다."
 SIA_pv_extort_xp: "국경에서 교훈 얻기"
 SIA_pv_extort_xp_desc: "국경에서 전투를 겪은 장교들에게서 보고를 받고 그 경험을 상비군 교리에 반영합니다. 단, 그곳의 전투가 배울 만한 충분한 성과를 낳았어야 합니다."
 SIA_pv_decisive_victory: "결정적 승리 선언"
 SIA_pv_decisive_victory_desc: "전세가 결정적으로 우리에게 유리한 만큼 이점을 밀어붙입니다. 캄보디아를 굴욕적인 후퇴로 몰아넣고, 우리 병력에게 새 땅을 단 1미터도 유지하라고 요구하지 않은 채 대치를 국가적 승리로 선언합니다."
 SIA_pv_capture_northern_khmer: "북부 크메르 점령"
 SIA_pv_capture_northern_khmer_desc: "전투가 압도적으로 우리에게 유리하게 전개되어 분쟁 중인 절벽이 우리 앞에 열려 있습니다. 위신에 만족하지 말고 영구히 땅을 차지합니다. 북부 크메르 지방을 완전히 병합하고, 사원 위에 국기를 꽂고, 우리의 조건으로 국경 문제를 영구히 종결짓습니다. 캄보디아는 결코 용서하지 않을 것이며, 세계는 이를 정복이라 부를 것입니다."
 SIA_pv_de_escalate: "긴장 완화 제안"
 SIA_pv_de_escalate_desc: "프놈펜과의 비공식 접촉을 통해 자제의 신호를 보냅니다. 전진 배치된 부대를 후퇴시키고 수사를 누그러뜨립니다. 정치적 자본 외에는 아무것도 들지 않으며, 훗날 필요할지 모르는 호의를 얻을 수 있습니다."
 CBD_pv_prepare_infantry_training: "보병 야전 훈련 실시"
 CBD_pv_prepare_infantry_training_desc: "프레아비히어 단지 일대에서 최전선 보병 부대를 실사격 훈련에 순환 투입하며, 비축된 소화기와 지원 화기를 활용해 태국과의 국경 대치에 대비한 즉응 태세를 갈고닦습니다."
 CBD_pv_prepare_armor_training: "기갑 야전 훈련 실시"
 CBD_pv_prepare_armor_training_desc: "기갑 부대를 분쟁 중인 사원 인근 위치로 이동시켜 기동 훈련을 실시하고, 어느 쪽에도 적합하지 않은 지형에서 수륙양용 전차와 중형 전차가 어떤 성능을 발휘하는지 시험합니다."
 CBD_pv_prepare_artillery_training: "포병 야전 훈련 실시"
 CBD_pv_prepare_artillery_training_desc: "절벽 위 태국군 진지를 향해 포병 중대를 사격 훈련시키며, 이 국경을 따라 이미 한 번 이상 벌어진 교전 양상을 예행연습합니다."
 CBD_pv_nationalist_rhetoric: "국내 민족주의 여론 결집"
 CBD_pv_nationalist_rhetoric_desc: "장관, 군 대변인, 국영 언론이 태국과의 국경 분쟁을 두고 국내 민족주의 여론을 결집하도록 장려합니다. 국내 청중에게는 호응을 얻지만, 매번 국경의 긴장은 높아집니다."
 CBD_pv_military_posturing: "국경에 병력 재배치"
 CBD_pv_military_posturing_desc: "결의를 과시하기 위해 프레아비히어 인근 국경으로 추가 부대를 이동시킵니다. 태국은 이를 있는 그대로 받아들일 것입니다."
