 mercosur.02.t: "Приглашение присоединиться к МЕРКОСУР в качестве ассоциированного государства."
 mercosur.02.d: "[FROM.GetName] обратился к нам с предложением войти в МЕРКОСУР в качестве ассоциированного государства. Предложение не является полным вступлением, но оно позволило бы нам оказаться в орбите блока, который явно пытается возродить свои прежние амбиции. Принятие этого предложения означало бы, что наше будущее, по крайней мере частично, связано с южноамериканским проектом."
 mercosur.02.a: "Примите статус ассоциированного члена."
 mercosur.02.b: "Отклонить пока что."
 mercosur.03.t: "Принятие на ассоциированное членство."
 mercosur.03.d: "[FROM.GetName] принял наше приглашение и согласился вступить в МЕРКОСУР в качестве ассоциированного государства. На бумаге этот шаг выглядит скромным, но имеет важное политическое значение: еще одна столица решила, что оставаться рядом с блоком безопаснее, чем полностью дистанцироваться от него."
 mercosur.03.a: "Отличный."
 mercosur.04.t: "В приеме на ассоциированное членство отказано."
 mercosur.04.d: "[FROM.GetName] отклонил наше предложение, по крайней мере, на данный момент. Их правительство предпочитает дистанцироваться от конфликтов, и какой бы интерес ни существовал в более тесном сотрудничестве, он оказался недостаточно сильным, чтобы перевесить осторожность. Дверь остается открытой, но ее придется открыть снова позже."
 mercosur.04.a: "К сожалению."
 mercosur.05.t: "Начались переговоры о полноправном членстве."
 mercosur.05.d: "Начались официальные переговоры с [CHL.GetName]. Если эти переговоры пройдут успешно, МЕРКОСУР не просто заявит о своем континентальном значении; он докажет это, полностью вовлекая другое государство в свои институты."
 mercosur.05.a: "Продолжить."
 mercosur.06.t: "Приглашение стать полноправным членом"
 mercosur.06.d: "[FROM.GetName] предложил нам раз и навсегда решить вопрос о полноправном членстве в МЕРКОСУР. Мы можем вступить немедленно, настоять на более широком пакете поддержки и подготовки перед заключительным этапом или решить, что момент еще не подходящий. Какой бы выбор мы ни сделали, это решение покажет, насколько тесно мы намерены связать наше будущее с блоком."
 mercosur.06.a: "Принять полное членство немедленно."
 mercosur.06.b: "Принять, но запросить пакет документов для включения в реестр."
 mercosur.06.c: "Оставаться лишь ассоциированным государством."
 mercosur.07.t: "Запрошен пакет документов для доступа."
 mercosur.07.d: "[FROM.GetName] в принципе принял наше вступление, но предпочитает, чтобы полноправному членству предшествовал более широкий пакет инвестиций, координации и политических гарантий. Их присоединение теперь будет происходить поэтапно, и то, как мы это сделаем, определит характер их отношений с блоком на долгие годы вперед."
 mercosur.07.a: "Приступайте к работе."
 mercosur.08.t: "В полноправном членстве отказано."
 mercosur.08.d: "[FROM.GetName] временно отказался от полноправного членства. То ли из-за осторожности, то ли из-за гордости, то ли из-за внутренних опасений, они пока не готовы позволить МЕРКОСУР стать постоянной частью их политического горизонта."
 mercosur.08.a: "Мы вернемся к этому позже."
 mercosur.09.t: "Открыто обсуждение вопросов членства в качестве ассоциированного члена."
 mercosur.09.d: "Наши дипломаты начали переговоры с [PRU.GetName] о ассоциированном членстве в МЕРКОСУР. Предложение достаточно скромное, чтобы казаться практичным, но в то же время достаточно значимое, чтобы проверить, сохраняет ли язык южноамериканской солидарности свой вес в их столице."
 mercosur.09.a: "Продолжить."
