 OLV: "Lanceur orbital"
 OLV_desc: "Un lanceur ou une fusée porteuse est un véhicule propulsé par une fusée utilisé pour transporter une charge utile de la surface de la Terre vers l'espace, généralement vers l'orbite terrestre ou au-delà."
 OLV1: "Lanceur 1965"
 OLV1_desc: "Un lanceur ou une fusée porteuse est un véhicule propulsé par fusée utilisé pour transporter une charge utile de la surface de la Terre vers l'espace, généralement vers l'orbite terrestre ou au-delà.\n\nLanceur orbital (Lanceur orbital 1965):\n§YLancement spatial§!:\nMasse de Charge Utile: §Y2000§! kg | Fiabilité: §Y60%§!\n§YProduction§!:\nPrix par unité: §Y0.003§!$ milliards | Industries civiles par unité: §Y2§! | Jours de production par unité: §Y60§!"
 OLV2: "Lanceur 1975"
