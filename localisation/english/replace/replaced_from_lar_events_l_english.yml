l_english:
 occupied_countries.1.title: "The Provisional Government of [FROM.FROM.GetNameDef]"
 occupied_countries.1.desc: "Our occupation authorities in [FROM.FROM.GetNameDef] now work closely with local officials, and most of the population has accepted our presence. A provisional government of cooperative locals is ready to take over the administration under our guidance."
 occupied_countries.1.a: "They have our blessing."
 occupied_countries.1.b: "They are not ready yet."
 occupied_countries.1.c: "Stop bringing us these petitions."
