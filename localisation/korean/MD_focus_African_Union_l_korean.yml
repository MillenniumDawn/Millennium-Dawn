l_korean:
 african_union_common_political_agenda: "아프리카 연합: 공통 정치 의제 "
 african_union_common_political_agenda_desc: "아프리카 연합 회원국들은 아프리카 통합을 위한 공동 정치 의제와 체계를 합의했습니다."
 african_union_child_welfare: "아프리카 연합: 아동 복지"
 african_union_child_welfare_desc: "아프리카 연합 회원국들은 아프리카 전역의 아동 사망률과 아동 복지를 개선하기로 합의했습니다."
 african_union_improved_digitalisation: "아프리카 연합: 디지털화 개선"
 african_union_improved_digitalisation_desc: "아프리카 연합 회원국들은 대륙의 디지털화 수준을 향상시키고 더 나은 인터넷 인프라에 투자하기로 합의했습니다."
 african_union_human_rights_good_boy: "아프리카 연합: 인권 옹호받다"
 african_union_human_rights_good_boy_desc: "아프리카 연합 회원국들은 아프리카의 인권 상황에 더 많은 관심을 기울이기로 합의했습니다. 이 나라는 자국민을 잘 대우한 점(적어도 아프리카 기준으로)에서 다른 아프리카 국가들에 본보기가 되었다는 점에서 특히 찬사를 받았습니다."
 african_union_human_rights_bad_boy: "아프리카 연합: 인권 문제 비판받다"
 african_union_human_rights_bad_boy_desc: "아프리카 연합 회원국들은 아프리카의 인권 상황에 더 많은 관심을 기울이기로 합의했습니다. 이 나라는 열악한 인권 상황으로 인해 아프리카 연합의 질타를 받았으며, 이는 통치 정권에 수치를 안겼습니다."
 african_union_human_rights_bad_boy_no_elections_tt: "§R우리가 선거를 하지 않기 때문에, 우리는§!\n"
 african_union_human_rights_bad_boy_high_corruption_tt: "§R우리의 부패가 $corruption_level_06$보다 더 심하기 때문에, 우리는§!\n"
 african_union_improved_trade_relations: "아프리카 연합: 무역 관계 개선"
 african_union_improved_trade_relations_desc: "아프리카 연합 회원국들은 선진국들과 유리한 무역 협정을 함께 협상하기로 합의했습니다. 통합된 아프리카 국가들의 정치적 영향력이 증가함에 따라 더 나은 무역 조건을 이끌어낼 수 있었습니다."
 african_union_health_research: "아프리카 연합: 보건 연구"
 african_union_health_research_desc: "아프리카 연합 회원국들은 겸상적혈구빈혈 치료제 개발의 중요성을 강조하는데 동의했습니다. 겸상적혈구빈혈 치료는 말라리아와 HIV 감염 생존에서의 중요한 요소입니다."
 african_union_cultural_independence: "아프리카 연합: 문화 르네상스"
 african_union_cultural_independence_desc: "아프리카 연합 회원국들은 약탈된 모든 아프리카의 역사·문화 유물이 각각의 주인에게 반환되어야 한다는 필요성을 강조했습니다. 이탈리아가 악숨 오벨리스크를 에티오피아에 반환한 것처럼 일부 작업은 이미 이루어졌지만, 아프리카에서 유래한 수백 점의 유물이 아직 전 세계에 흩어져 있습니다."
 african_union_encourage_domestic_agriculture: "아프리카 연합: 국내 농업 장려"
 african_union_encourage_domestic_agriculture_desc: "아프리카 연합 회원국들은 아프리카의 농업 부문을 개선하기 위해 협력하기로 합의했으며, 신기술, 종자 생산업체, 유전자원 은행 등을 통해 선진국에 대한 의존도를 줄일 것입니다."
 african_union_aids_watch_funded: "아프리카 연합: 아프리카 에이즈 워치"
 african_union_aids_watch_funded_desc: "아프리카 연합 회원국들은 아프리카 에이즈 워치에 대한 재정 지원과 인지도를 높이기로 합의했습니다. 이 나라는 에이즈 유행으로 고통받고 있으므로, 질병에 대응하는 능력이 향상되었습니다."
 african_union_aids_watch_funder: "아프리카 연합: 아프리카 에이즈 워치"
 african_union_aids_watch_funder_desc: "아프리카 연합 회원국들은 아프리카 에이즈 워치에 대한 재정 지원과 인지도를 높이기로 합의했습니다. 이 나라는 에이즈 유행으로 고통받고 있지 않으므로, 자금의 일부를 도움이 필요한 나라들을 돕는 데 사용하고 있습니다."
 african_union_aids_watch_funder_tt: "에이즈 유행으로 고통받는 나라들을 돕기 위해, 다음을 얻습니다."
 african_union_decade_of_education: "아프리카 연합: 교육의 10년"
 african_union_decade_of_education_desc: "아프리카 연합 회원국들은 향후 몇 년을 아프리카를 위한 '교육의 10년'으로 명명했습니다. 연합은 아프리카 전역의 교육 수준을 높인다는 야심 찬 목표를 세우고 있습니다."
 african_union_declaration_of_fertilizers: "아프리카 연합: 비료 개발 센터"
 african_union_declaration_of_fertilizers_desc: "아프리카 연합 회원국들은 대륙의 농업 수확량을 개선하기 위해 아프리카 비료 개발 센터에 대한 지원 노력을 강화했습니다."
 african_union_research_focus: "아프리카 연합: 개발을 위한 과학 연구"
 african_union_research_focus_desc: "아프리카 연합 회원국들은 회원국의 기술 및 과학 발전을 위한 의제를 추진하기로 약속했습니다."
 african_union_renewable_investments: "아프리카 연합: 기후 변화 대응"
 african_union_renewable_investments_desc: "아프리카 연합 회원국들은 기후 변화에 맞서 대륙의 재생 에너지 역량을 확대하기로 약속했습니다. 기후 변화는 의심할 여지 없이 아프리카에 가장 심각한 영향을 미칠 것입니다."
 african_union_industrial_development: "아프리카 연합: 산업 발전"
 african_union_industrial_development_desc: "아프리카 연합 회원국들은 아프리카의 여러 산업을 개선하는 방안을 마련하기로 합의했습니다. 주된 목표는 아프리카 제조업체들이 세계 시장에서 더욱 경쟁력을 갖추도록 하는 것입니다."
 african_union_health_care_investment: "아프리카 연합: 모자 보건 및 아동 보건"
 african_union_health_care_investment_desc: "아프리카 연합 회원국들은 국제연합 및 국제 협력국들과 함께 대륙의 산모, 영아 및 아동 사망률을 낮추는 것을 최우선 과제로 삼았습니다."
 african_union_combat_human_trafficking: "아프리카 연합: 인신매매 퇴치"
 african_union_combat_human_trafficking_desc: "아프리카 연합 회원국들은 인신매매에 공동으로 맞서기 위한 체계를 마련하기로 합의했습니다."
 african_union_water_and_food_benefits: "아프리카 연합: 식수 및 식량 목표"
 african_union_water_and_food_benefits_desc: "아프리카 연합 회원국들은 대륙의 물 분배 문제와 높은 식량 가격에 공동으로 맞서기로 합의했습니다. 식량 및 식수 불안정은 아프리카의 가장 큰 문제 중 하나이므로, 이 문제들은 함께 해결해야 합니다."
 african_union_coup_defence: "아프리카 연합: 쿠데타의 재앙"
 african_union_coup_defence_desc: "아프리카 연합 회원국들은 대륙에서 발생하는 군사 쿠데타의 재앙에 맞서 협력하기로 합의했습니다. 최근 민주 정부가 전복되면서 평화안보이사회는 각국에 국내 치안을 강화하도록 독려하게 되었습니다."
 african_union_energy_investments: "아프리카 연합: 에너지 투자"
 african_union_energy_investments_desc: "아프리카 연합 회원국들은 다른 나라에 대한 의존도를 낮추기 위해 아프리카의 국내 에너지 시장을 개선하는 데 공동으로 투자하기로 합의했습니다."
 african_union_infra_investments: "아프리카 연합: 인프라 투자"
 african_union_infra_investments_desc: "아프리카 연합 회원국들은 대륙의 인프라를 개선하는 데 공동으로 투자하기로 합의했습니다. 도로와 철도를 개선하여 국가 간 연결을 강화하면 아프리카 경제가 더 빠르게 성장할 수 있을 것입니다."
 african_union_no_ransom: "아프리카 연합: 테러리스트와의 협상 불가"
 african_union_no_ransom_desc: "아프리카 연합 회원국들은 테러 단체에 몸값이나 그 밖의 금전적 요구를 지불하지 않기로 함께 합의했습니다. 연합에 따르면 몸값 지불은 테러 단체의 주요 자금 조달 방법 중 하나입니다. 따라서 몸값을 지불하지 않음으로써 연합은 테러 단체의 영향력을 줄이기를 희망합니다."
 african_union_financial_institutions: "아프리카 연합: 금융 수단"
 african_union_financial_institutions_desc: "아프리카 연합 회원국들은 아프리카 자체 금융 수단을 만드는 데 더 많은 노력을 기울이기로 합의했습니다. 이 프로그램의 목표는 아프리카 경제의 성장 속도를 높이는 것입니다."
 african_union_fight_corruption: "아프리카 연합: 부패 척결"
 african_union_fight_corruption_desc: "아프리카 연합 총회가 여러 회원국의 부패 실태에 대한 불편한 보고서를 공개한 이후, 아프리카 연합 회원국들은 대륙의 부패 척결에 더 많은 노력을 기울이기로 합의했습니다."
 african_union_fight_colonialism: "아프리카 연합: 식민주의 청산"
 african_union_fight_colonialism_desc: "아프리카 연합 회원국들은 아직도 많은 회원국을 괴롭히고 있는 식민주의에서 비롯된 구조적 문제를 해결하기로 합의했습니다."
 african_union_invest_defence: "아프리카 연합: 국방 투자"
 african_union_invest_defence_desc: "아프리카 연합 회원국들은 아프리카 방위 산업에 상당한 자금을 투자하기로 합의했습니다. 많은 아프리카 국가가 국방 수요를 오로지 선진국에 의존하고 있으며, 이를 바꾸는 것이 목표입니다."
 african_union_invest_sea_trade: "아프리카 연합: 해상 무역 투자"
 african_union_invest_sea_trade_desc: "아프리카 연합 회원국들은 해상 무역을 지원하는 시설에 더 많이 투자하기로 합의했습니다. 세계 물자의 상당수가 아프리카를 돌아 운송되므로, 이 물자의 흐름을 유지하려면 항구와 조선소가 양호한 상태를 유지해야 합니다."
 african_union_reforms_modifier: "아프리카 연합 개혁"
 african_union_reforms_modifier_desc: "아프리카 연합이 완전한 통합에 가까워질수록, 각국이 기꺼이 통합하려면 대륙이 개혁되어야 합니다. 일부 국가는 다른 국가보다 개혁으로 더 큰 이익을 얻을 것입니다..."
 african_union_headquarters: "아프리카 연합 본부"
 african_union_headquarters_desc: "아프리카 연합 본부가 이곳에 있습니다. 이곳은 연합의 회의 장소일 뿐만 아니라 비즈니스 포럼의 역할도 합니다."
 african_union_treaty_of_pelindaba: "펠린다바 조약"
 african_union_treaty_of_pelindaba_desc: "이 나라는 아프리카를 비핵지대로 만든 펠린다바 조약에 서명했습니다. 이곳에서는 핵무기의 연구, 개발, 생산, 제조, 비축, 취득, 시험, 보유, 통제 또는 배치가 이루어져서는 안 됩니다. 또한 이 조약은 평화적 목적의 핵 연구 및 개발에 최고 수준의 품질을 요구합니다."
 african_union_nuclear_armament: "아프리카 핵무장"
 african_union_nuclear_armament_desc: "아프리카 연합은 펠린다바 조약을 내팽개쳤습니다. 이 조약은 아프리카를 비핵지대로 만들기 위한 것이었으나, 커져가는 핵 위협에 대한 우려로 연합은 결정을 뒤집었습니다. 많은 나라가 이러한 전개를 우려하고 있으며, 아프리카 국가들과 핵 연구를 공유하는 것을 경계하고 있습니다."
 AFRICAN_UNION_shared_focus: "아프리카 연합의 탄생"
 AFRICAN_UNION_shared_focus_desc: "아프리카 연합이 첫 회기를 열어 아프리카 대륙에 평화와 번영의 시대를 알렸습니다. 아프리카는 식민주의의 잔재를 물리치기 위해 유럽처럼 협력해야 합니다."
 AFRICAN_UNION_shared_focus_trigger_tt: "이 중점은 §Y아프리카 통일 기구§!가 §Y아프리카 연합§!으로 개편되면 자동으로 완료됩니다. §Y아프리카 연합§!은 늦어도 2002년 중반까지, 또는 [LBA.GetNameDef](이)가 중점 §Y$LBA_strive_for_african_union$§!을(를) 완료할 때 결성됩니다."
 AFRICAN_UNION_shared_focus_create_investment_bank: "아프리카 투자 은행 설립"
 AFRICAN_UNION_shared_focus_create_investment_bank_desc: "현재 아프리카는 선진국으로부터 많은 자본을 받고 있습니다. 우리는 대륙 스스로에 투자할 자체 역량이 심각하게 부족합니다. 모든 회원국의 사업에 자금을 지원할 아프리카 투자 은행을 설립해야 합니다."
 AFRICAN_UNION_shared_focus_create_investment_bank_2_tt: "§Y아프리카 투자 은행은 주기적으로 아프리카 국가들에 투자하거나 회원국들에 투자금을 요청합니다§!"
 AFRICAN_UNION_shared_focus_create_central_bank: "아프리카 중앙은행 설립"
 AFRICAN_UNION_shared_focus_create_central_bank_desc: "아프리카 경제를 서로 통합하려면 공동의 아프리카 중앙은행을 설립해야 합니다. 이 은행은 장래의 공용 통화를 발행하는 유일한 기관이 될 것이며, 지역 은행들과 협력하여 회원국 정부는 물론 아프리카 합중국이 실현될 경우 그 정부까지 지원할 것입니다. 또한 선진국 은행들로부터 독립하는 데에도 도움이 될 것입니다."
 AFRICAN_UNION_shared_focus_create_monetary_fund: "아프리카 통화 기금 설립"
 AFRICAN_UNION_shared_focus_create_monetary_fund_desc: "아프리카의 많은 나라가 높은 부채와 열악한 경제 전망으로 어려움을 겪고 있습니다. 대륙의 경제 안정을 보장하고 부채가 높은 나라들을 돕기 위한 공동 통화 기금을 설립해야 합니다."
 AFRICAN_UNION_shared_focus_create_monetary_fund_2_tt: "§Y아프리카 통화 기금은 주기적으로 아프리카 국가들의 부채를 지원하거나 회원국들에 다른 나라의 부채를 떠안도록 요청합니다§!"
 AFRICAN_UNION_shared_focus_create_stock_exchange_south_africa: "[SAF.capital.GetCapitalVictoryPointName]에 증권거래소 설립"
 AFRICAN_UNION_shared_focus_create_stock_exchange_south_africa_desc: "현재 아프리카에는 십여 개의 서로 다른 증권거래소가 운영되고 있습니다. [SAF.GetNameDef]의 수도 [SAF.capital.GetCapitalVictoryPointName]에 범아프리카 거래소를 설립해야 합니다. [SAF.GetNameDef]은(는) 대륙에서 기술적으로 가장 앞서 있고 가장 다양한 경제를 갖추고 있어 증권거래소의 최적 후보지입니다."
 AFRICAN_UNION_shared_focus_create_stock_exchange_our_country: "[ROOT.capital.GetCapitalVictoryPointName]에 증권거래소 설립"
 AFRICAN_UNION_shared_focus_create_stock_exchange_our_country_desc: "범아프리카 증권거래소의 최적 입지는 당연히 우리 수도입니다. 이는 우리가 부패해서 하는 말이 아니며, 우리가 고용한 컨설턴트들도 이곳이 최적이라고 했습니다. 하지만 연합의 다른 회원국들은 동의하지 않을 수도 있습니다."
 AFRICAN_UNION_shared_focus_create_stock_exchange_egypt: "[EGY.capital.GetCapitalVictoryPointName]에 증권거래소 설립"
 AFRICAN_UNION_shared_focus_create_stock_exchange_egypt_desc: "현재 아프리카에는 십여 개의 서로 다른 증권거래소가 운영되고 있습니다. [EGY.GetNameDef]의 수도 [EGY.capital.GetCapitalVictoryPointName]에 범아프리카 거래소를 설립해야 합니다. [EGY.GetNameDef]은(는) 유럽과 가까워 더 많은 유럽의 관심을 끌 수 있습니다. 투자자의 관점에서도 [EGY.GetNameDef]은(는) 대체로 안정적이며 외부 이해관계자들의 지지를 잘 받는 것으로 평가됩니다."
 AFRICAN_UNION_shared_focus_create_oil_fund: "공동 석유 기금 설립"
 AFRICAN_UNION_shared_focus_create_oil_fund_desc: "아프리카의 천연자원은 매우 불공평하게 분포되어 있습니다. 석유가 풍부한 나라도 있지만 대부분의 나라는 석유 부족에 시달립니다. 가장 적게 가진 나라가 가장 큰 고통을 겪지 않도록 국가 간에 연료를 분배하고 균등하게 하는 공동 석유 기금을 설립해야 합니다."
 AFRICAN_UNION_shared_focus_common_currency_west_african_franc: "아프리카 통화: 서아프리카 프랑"
 AFRICAN_UNION_shared_focus_common_currency_west_african_franc_desc: "서아프리카 프랑(CFA)은 1945년부터 여러 서아프리카 국가, 주로 프랑스의 옛 식민지에서 사용되어 왔습니다. 이 통화는 안정성이 매우 높아, 냉전 기간 동안 이를 사용한 나라들은 지역 내 다른 나라보다 높은 경제 성장을 이루었습니다. 그러나 CFA는 유로에 고정되어 있으며, 프랑스는 이 통화를 사용하는 나라들에 외화 자산의 50%를 프랑스 재무부에 예치하도록 요구합니다."
 AFRICAN_UNION_shared_focus_common_currency_south_african_rand: "아프리카 통화: 남아프리카 랜드"
 AFRICAN_UNION_shared_focus_common_currency_south_african_rand_desc: "남아프리카 랜드는 1961년 파운드와 실링을 대체하여 십진법 화폐 체계로 도입되었습니다. 현재 남아프리카 조폐국이 발행을 담당하고 있으며, 이 통화는 남아프리카의 이웃 나라들에서 제한적으로 사용됩니다. 이 통화는 완전히 아프리카 고유의 것이지만, 최근 수십 년간 미국 달러 대비 가치가 급락했습니다. 하지만 이는 외국인에게 우리 상품을 더 저렴하게 만들어 주므로 오히려 이점이 될 수도 있습니다."
 AFRICAN_UNION_shared_focus_common_currency_dinar: "아프리카 통화: 리비아 디나르"
 AFRICAN_UNION_shared_focus_common_currency_dinar_desc: "리비아 디나르는 1971년부터 사용되어 왔습니다. 달러 대비 강세였던 적은 없으며, 주로 카다피가 미국 달러 중심 경제에 맞서 저항을 보여주는 수단이었습니다. 아프리카의 많은 아랍 국가들도 자체 디나르를 사용하고 있으며, 안타깝게도 이슬람주의자들이 우마이야 칼리파국의 '금 디나르'로 돌아가기를 원하면서 이 통화의 평판은 다소 나빠졌습니다."
 AFRICAN_UNION_shared_focus_common_central_african_franc: "아프리카 통화: 중앙아프리카 프랑"
 AFRICAN_UNION_shared_focus_common_central_african_franc_desc: "중앙아프리카 프랑(CFA)은 1945년부터 여러 중앙아프리카 국가, 주로 프랑스의 옛 식민지에서 사용되어 왔습니다. 이 통화는 서아프리카 프랑만큼 프랑스의 통제를 강하게 받지는 않지만, 통화에 대한 통제권의 일부는 석유가 풍부한 카메룬에 있습니다."
 AFRICAN_UNION_shared_focus_common_afriq: "아프리카 통화: 아프리크"
 AFRICAN_UNION_shared_focus_common_afriq_desc: "기존의 어떤 통화도 사용하지 않고, 아프리카 연합이 사용할 새로운 공용 통화를 만들어야 합니다. 아프리크를 통해 우리는 선진국들처럼 행동하여, 우리가 그들의 통화에 의존하는 대신 다른 나라들이 우리 통화에 의존하게 만들 수 있을 것입니다."
 AFRICAN_UNION_shared_focus_create_african_free_trade_area: "아프리카 자유 무역 지대 설립"
 AFRICAN_UNION_shared_focus_create_african_free_trade_area_desc: "아프리카는 거대한 시장이지만 안타깝게도 매우 분열되어 있습니다. 이제 공용 통화가 생겼으니, 상품이나 사람의 이동에 장벽이 없는 단일 자유 무역 지대로 아프리카를 통합하는 것이 타당합니다. 이는 각국의 무역과 부가가치 생산을 촉진할 것입니다."
 AFRICAN_UNION_shared_focus_coastal_protection: "아프리카 해안 보호"
 AFRICAN_UNION_shared_focus_coastal_protection_desc: "아프리카 연합의 영해와 경제 수역을 보호할 기구를 만들어야 합니다."
 AFRICAN_UNION_shared_focus_sign_treaty_of_pelindaba: "펠린다바 조약 비준"
 AFRICAN_UNION_shared_focus_sign_treaty_of_pelindaba_desc: "1996년 펠린다바 조약이 서명을 위해 개방되었습니다. 이 조약은 아프리카를 비핵지대로 만드는 것을 목표로 했습니다. 조약은 아프리카 국가들에서 핵무기의 연구, 개발, 제조, 비축, 취득, 시험, 보유, 통제 또는 배치를 금지하며, 평화적 목적의 핵 연구와 생산에 높은 기준을 적용합니다. 모든 연합 회원국을 위해 이 조약을 비준하고, 핵무기라는 발상을 거부함으로써 아프리카를 모범적인 대륙으로 만들어야 합니다."
 AFRICAN_UNION_shared_focus_nuclear_armament: "펠린다바 조약 무효화"
 AFRICAN_UNION_shared_focus_nuclear_armament_desc: "1996년 펠린다바 조약이 서명을 위해 개방되었습니다. 이 조약은 아프리카를 비핵지대로 만드는 것을 목표로 했습니다. 조약은 아프리카 국가들에서 핵무기의 연구, 개발, 제조, 비축, 취득, 시험, 보유, 통제 또는 배치를 금지하며, 평화적 목적의 핵 연구와 생산에 높은 기준을 적용합니다. 대륙을 핵전쟁으로부터 지킬 유일한 방법은 핵무기를 보유하는 것이므로 이 조약을 뒤집어야 합니다. 군비 경쟁에서 선진국을 이길 방법을 즉시 모색해야 합니다."
 AFRICAN_UNION_shared_focus_form_defence_council: "방위 이사회 구성"
 AFRICAN_UNION_shared_focus_form_defence_council_desc: "대륙의 안정을 높이기 위해 연합의 공동 방위 이사회를 구성해야 합니다. 이 이사회는 대륙에서의 합동 군사 작전을 조직하는 책임을 맡게 될 것입니다."
 AFRICAN_UNION_shared_focus_create_african_space_agency: "아프리카 우주국 설립"
 AFRICAN_UNION_shared_focus_include_african_diaspora: "아프리카 디아스포라 포용"
 AFRICAN_UNION_shared_focus_include_african_diaspora_desc: "아프리카 밖에는 그 뿌리를 아프리카 대륙에서 찾을 수 있는 사람이 약 1억 5천만 명 살고 있습니다. 현재 아프리카 연합은 5개 지역으로 나뉘어 있습니다. 아프리카 디아스포라를 정치적 실체로 공식 인정하기 위해 추가 지역을 만들어야 합니다. 이렇게 하면 이들 중 일부가 통일된 아프리카라는 우리의 꿈을 공유하도록 독려할 수 있습니다."
 AFRICAN_UNION_shared_focus_employ_local_defence: "지역 보안 부대 활용"
 AFRICAN_UNION_shared_focus_employ_local_defence_desc: "아프리카처럼 광활한 대륙에서는 분쟁 발생 시 지역 방어를 담당할 지역 국방 부대를 운용해야 합니다. 이렇게 하면 대륙 전역에 걸쳐 충분한 방어를 확보할 수 있습니다."
 AFRICAN_UNION_shared_focus_rapid_deployment_forces: "신속 배치군 의존"
 AFRICAN_UNION_shared_focus_rapid_deployment_forces_desc: "아프리카 각국 군대로 지역별 신속 배치 부대를 편성해야 합니다. 적의 침공이 발생하면 이 부대들이 신속히 현장에 배치되어 적의 진격을 격퇴할 것입니다."
 AFRICAN_UNION_shared_focus_hq_in_nigeria: "[NIG.capital.GetCapitalVictoryPointName]에 연합 유치"
 AFRICAN_UNION_shared_focus_hq_in_nigeria_desc: "아프리카 연합 본부의 위치를 정해야 합니다. 가장 좋은 곳은 [NIG.GetNameDef]의 수도 [NIG.capital.GetCapitalVictoryPointName]입니다. [FRA.GetAdjective] 정부로부터도 건설을 돕겠다는 제안을 받았습니다."
 AFRICAN_UNION_shared_focus_hq_in_our_country: "[ROOT.capital.GetCapitalVictoryPointName]에 연합 유치"
 AFRICAN_UNION_shared_focus_hq_in_our_country_desc: "아프리카 연합 본부를 짓기에 가장 좋은 곳은 당연히 우리 수도 [ROOT.capital.GetCapitalVictoryPointName]입니다. 비용은 우리가 직접 부담해야 하지만, 적어도 아프리카에는 외부 협력자가 필요 없다는 신호가 될 것입니다."
 AFRICAN_UNION_shared_focus_hq_in_ethiopia: "[ETH.capital.GetCapitalVictoryPointName]에 연합 유치"
 AFRICAN_UNION_shared_focus_hq_in_ethiopia_desc: "[ETH.GetAdjective] 수도 [ETH.capital.GetCapitalVictoryPointName]은(는) 연합 본부의 최적 입지입니다. [CHI.GetAdjective] 측은 건물 건설 자금까지 대겠다고 제안했습니다. 정말 훌륭한 거래입니다!"
 AFRICAN_UNION_shared_focus_african_energy_commission: "아프리카 에너지 위원회 설립"
 AFRICAN_UNION_shared_focus_african_energy_commission_desc: "대륙의 에너지 정책을 다룰 특별 위원회를 만들어야 합니다. 이 위원회는 아프리카 대륙의 에너지 자원의 조정, 조화, 보호, 보존, 개발, 합리적 이용, 상업화 및 통합을 책임질 것입니다."
 AFRICAN_UNION_shared_focus_common_disease_fight: "질병에 맞선 공동 투쟁"
 AFRICAN_UNION_shared_focus_common_disease_fight_desc: "아프리카 사람들은 대륙의 열악한 환경에서 비롯된 말라리아, 에볼라, HIV 등 많은 질병에 시달리고 있습니다. 이러한 질병에 맞서는 공동 전략을 세우기 위해 아프리카 질병통제예방센터를 설립해야 합니다."
 AFRICAN_UNION_shared_focus_speak_french: "프랑스어를 사용하라"
 AFRICAN_UNION_shared_focus_speak_french_desc: "현재 아프리카 연합의 사업과 정치는 아랍어, 영어, 프랑스어, 포르투갈어, 스페인어, 스와힐리어 및 '기타 아프리카 언어' 등 여러 공용어로 진행되고 있습니다. 이러한 다양성은 좋지만, 주된 언어를 하나 정해야 합니다. 프랑스어는 많은 서아프리카 국가의 공용어이지만 모국어 화자는 그리 많지 않습니다. 그래도 서아프리카 인구의 약 3분의 1이 이 언어를 구사할 수 있습니다. 프랑스어를 연합의 업무 언어로 사용하는 것이 가장 합리적입니다."
 AFRICAN_UNION_shared_focus_speak_english: "영어를 사용하라"
 AFRICAN_UNION_shared_focus_speak_english_desc: "현재 아프리카 연합의 사업과 정치는 아랍어, 영어, 프랑스어, 포르투갈어, 스페인어, 스와힐리어 및 '기타 아프리카 언어' 등 여러 공용어로 진행되고 있습니다. 이러한 다양성은 좋지만, 주된 언어를 하나 정해야 합니다. 영어는 식민 지배의 역사와 공용어로서의 지위 덕분에 아프리카에서 매우 널리 쓰입니다. 영어를 업무 언어로 사용하는 것이 가장 합리적입니다. 이는 아프리카 내부의 연결을 강화할 뿐만 아니라 대륙 밖과의 연결도 강화해 줄 것입니다."
 AFRICAN_UNION_shared_focus_speak_swahili: "스와힐리어를 사용하라"
 AFRICAN_UNION_shared_focus_speak_swahili_desc: "현재 아프리카 연합의 사업과 정치는 아랍어, 영어, 프랑스어, 포르투갈어, 스페인어, 스와힐리어 및 '기타 아프리카 언어' 등 여러 공용어로 진행되고 있습니다. 이러한 다양성은 좋지만, 주된 언어를 하나 정해야 합니다. 스와힐리어는 모든 아프리카 언어 가운데 가장 많이 쓰이는 언어입니다. 공용어로 우리 고유의 언어를 사용하는 것이 당연합니다."
 AFRICAN_UNION_shared_focus_speak_arabic: "아랍어를 사용하라"
 AFRICAN_UNION_shared_focus_speak_arabic_desc: "현재 아프리카 연합의 사업과 정치는 아랍어, 영어, 프랑스어, 포르투갈어, 스페인어, 스와힐리어 및 '기타 아프리카 언어' 등 여러 공용어로 진행되고 있습니다. 이러한 다양성은 좋지만, 주된 언어를 하나 정해야 합니다. 아랍어는 아프리카에서 가장 많이 쓰이는 언어이지만 지역별 변이가 많습니다. 아랍어가 이상한 선택처럼 보일 수도 있으나, 대륙의 많은 경제 중심지가 북아프리카에 있고 많은 아랍 국가가 선진국으로부터 독립하려는 우리의 생각을 공유하고 있으므로 타당한 선택입니다."
 AFRICAN_UNION_shared_focus_fight_corruption: "부패 척결"
 AFRICAN_UNION_shared_focus_fight_corruption_desc: "부패는 아프리카에 만연해 있으며 통일된 나라를 만드는 데 가장 큰 장애물 중 하나입니다. 사업과 정치에서 모든 수상한 거래를 없애기 위해 열심히 노력해야 합니다."
 AFRICAN_UNION_shared_focus_fight_corruption_tt_2: "§G§Y부패§!가 낮은 국가(5단계 이하)는 아프리카 통합을 수락할 가능성이 높아집니다§!\n§R§Y부패§!가 높은 국가(6단계 이상)는 아프리카 통합을 수락할 가능성이 낮아집니다§!\n\n"
 AFRICAN_UNION_shared_focus_embrace_corruption: "부패 수용"
 AFRICAN_UNION_shared_focus_embrace_corruption_desc: "부패가 아프리카의 사업과 정치의 일부라는 사실을 그냥 받아들여야 합니다. 그저 현실이 그렇습니다. 선진국들이 '로비 활동'이라고 부르는 것과 무엇이 다릅니까?"
 AFRICAN_UNION_shared_focus_embrace_corruption_tt_2: "§G§Y부패§!가 높은 국가(6단계 이상)는 아프리카 통합을 수락할 가능성이 높아집니다§!\n§R§Y부패§!가 낮은 국가(5단계 이하)는 아프리카 통합을 수락할 가능성이 낮아집니다§!\n\n"
 AFRICAN_UNION_shared_focus_pan_african_university: "범아프리카 대학"
 AFRICAN_UNION_shared_focus_pan_african_university_desc: "아프리카 대학들이 교육과정을 설계하고 대륙 전체의 교육을 개선할 수 있도록 대학 네트워크를 만들어야 합니다."
 AFRICAN_UNION_shared_focus_empower_parliament: "의회 권한 강화"
 AFRICAN_UNION_shared_focus_empower_parliament_desc: "아프리카 연합 의회, 즉 범아프리카 의회는 각 회원국에서 선출된 다섯 명의 의원으로 구성됩니다. 지금까지 의회는 자문 및 협의 권한만 가지고 있습니다. 의회가 연합의 통치 기관이 되도록 완전한 입법 권한을 부여해야 합니다."
 AFRICAN_UNION_shared_focus_empower_parliament_tt_2: "§G선거를 치르는 국가는 아프리카 통합을 수락할 가능성이 높아집니다§!\n§R선거를 치르지 않는 국가는 아프리카 통합을 수락할 가능성이 낮아집니다§!\n\n"
 AFRICAN_UNION_shared_focus_empower_assembly: "총회 권한 강화"
 AFRICAN_UNION_shared_focus_empower_assembly_desc: "아프리카 연합 총회는 회원국 국가원수들로 구성된 의사결정 기구입니다. 총회의 주요 임무는 연합의 목표 설정, 예산 통제, 판사 선출, 그리고 연합 전체의 진로를 이끄는 것입니다. 아프리카 연합이 올바른 방향으로 발전하도록 총회에 더 많은 입법 권한을 부여해야 합니다."
 AFRICAN_UNION_shared_focus_empower_assembly_tt_2: "§G선거를 치르지 않는 국가는 아프리카 통합을 수락할 가능성이 높아집니다§!\n§R선거를 치르는 국가는 아프리카 통합을 수락할 가능성이 낮아집니다§!\n\n"
 AFRICAN_UNION_shared_focus_federation_of_africa: "아프리카 연방"
 AFRICAN_UNION_shared_focus_federation_of_africa_desc: "아프리카 각국은 서로 매우 다릅니다. 대륙이 통일된 후에도 회원국들이 상당한 자치권을 유지하도록 하는 것이 최선입니다. 이것이 평화와 안정을 보장하는 가장 좋은 방법입니다."
 AFRICAN_UNION_shared_focus_federation_of_africa_tt: "§Y$AFRICAN_UNION_shared_focus_unite_africa$§! 중점이 완료되면, 모든 §Y다른 회원국§!은 §Y주도국§!의 §Y$autonomy_autonomous_state$§!이(가) 됩니다"
 AFRICAN_UNION_shared_focus_united_states_of_africa: "아프리카 연합 국가"
 AFRICAN_UNION_shared_focus_united_states_of_africa_desc: "아프리카 각국은 분열되어 있지만 그럼에도 우리는 하나의 나라를 이루어야 합니다. 분열된 채로는 선진국과 결코 경쟁할 수 없으며 계속 그들에게 착취당할 것입니다. 유일한 방법은 연방 정부가 주된 권력을 갖는 미국식 정치 체제입니다."
 AFRICAN_UNION_shared_focus_united_states_of_africa_tt: "§Y$AFRICAN_UNION_shared_focus_unite_africa$§! 중점이 완료되면, 모든 §Y다른 회원국§!은 §Y주도국§!에 §Y병합§!됩니다. §R다른 회원국들이 통합을 거부할 가능성이 더 높아집니다!§!"
 AFRICAN_UNION_shared_focus_unite_africa: "아프리카 통일"
 AFRICAN_UNION_shared_focus_unite_africa_desc: "때가 왔습니다! 이제 우리는 아프리카를 하나의 나라로 통합하여, 그 누구도 꿈꾸지 못했던 미래로 이 대륙을 이끌어야 합니다."
 AFRICAN_UNION_shared_focus_unite_africa_trigger_tt: "전쟁 중인 §Y회원국§!이 없음"
 AFRICAN_UNION_shared_focus_unite_africa_tt: "\n§Y모든 회원국이 통일 아프리카에 가입하도록 초대받습니다§!\n\n§G다음의 경우 국가가 수락할 가능성이 더 높습니다:\n- 같은 §Y이념 성향§!을 가짐\n- 우리에 대한 관계가 §Y+50§!보다 높음§!\n\n§R다음의 경우 국가가 수락할 가능성이 더 낮습니다:\n- §Y서방§!이고 우리가 §Y신흥국§!인 경우, 또는 그 반대\n- §Y살라피주의§! 또는 §Y민족주의§!이고 우리는 아닌 경우\n- 우리에 대한 관계가 §Y-50§!보다 낮음§!\n\n§Y수락 가능성은 이전의 중점 선택에도 영향을 받습니다§!"
 african_union_decisions_category: "아프리카 연합"
 african_union_decisions_category_desc: "아프리카 연합은 아프리카 대륙을 경제적, 정치적, 문화적으로 더욱 가깝게 만드는 것을 목표로 합니다. 연합은 아프리카 국가들이 공동의 목표를 달성하기 위해 협력하도록 돕는 여러 하위 기구로 구성되어 있습니다. 연합의 최종 목표는 대륙을 EU와 같은 연합체, 나아가 연방으로 통합하는 것입니다.\n\n매년 아프리카 연합은 다음 해의 주제와 의제를 정하는 §Y정상회의§!를 개최합니다. 각 정상회의는 아프리카 연합에 §Y권한 위임§!을 부여합니다. 아프리카 인구 과반수가 해당 이념 성향을 따르는 경우, 아프리카의 모든 §Y지역 강국§!은 §Y권한 위임§!을 사용하여 아프리카 연합 관련 중점을 완료할 수 있습니다.\n\n권한 위임: [african_union_mandate_status]\n\n현재 이념 성향:\n서방: [?global.african_union_western_outlook|0]백만 명 ([?global.african_union_western_outlook_share|%0])\n신흥국: [?global.african_union_emerging_outlook|0]백만 명 ([?global.african_union_emerging_outlook_share|%0])\n살라피주의: [?global.african_union_salafist_outlook|0]백만 명 ([?global.african_union_salafist_outlook_share|%0])\n비동맹: [?global.african_union_nonaligned_outlook|0]백만 명 ([?global.african_union_nonaligned_outlook_share|%0])\n민족주의: [?global.african_union_nationalist_outlook|0]백만 명 ([?global.african_union_nationalist_outlook_share|%0])\n\n1인당 평균 GDP: $$§Y[?global.average_gdp_of_africa]§!k"
 african_union_mandate_status_green: "§G부여됨§!"
 african_union_mandate_status_red: "§R부여되지 않음§!"
 African_Union_join_the_union: "아프리카 연합 가입"
 African_Union_join_the_union_desc: "대륙의 거의 모든 나라가 아프리카 연합의 일원입니다. 우리도 가입하여 아직 가능할 때 혜택을 누려야 합니다."
 African_Union_leave_the_union: "아프리카 연합 탈퇴"
 African_Union_leave_the_union_desc: "아프리카 연합은 우리가 원하지 않는 방향으로 나아가고 있습니다. 주권을 완전히 잃기 전에 지금 탈퇴해야 합니다."
 AfricanUnion.1.t: "아프리카 연합 출범"
 AfricanUnion.1.d: "오늘은 [SAF.GetAdjective] 대통령 [SAF.GetLeader]이(가) 연합 총회의 첫 회기에서 남아프리카 더반에서 아프리카 연합의 출범을 선언한 역사적인 날이었습니다. 첫 총회의 주제는 '평화, 발전, 번영: 아프리카의 세기'였습니다. 참가자들은 연합의 주요 목표와 지향점도 논의했습니다. 이는 대륙 통합을 향한 큰 걸음입니다."
 AfricanUnion.1.a: "아프리카의 역사적인 날"
 AfricanUnion.2.t: "통일된 아프리카"
 AfricanUnion.2.d: "오늘 [UAF.GetOldNameDef]이(가) 아프리카를 하나의 나라 [UAF.GetNameDef](으)로 통일하는 개혁안을 통과시켰습니다. 이 나라는 여전히 고도로 연방화될 것이며, 회원국들은 이 체제 아래에서 상당한 자치권을 갖게 됩니다. 우리는 아프리카를 새로운 미래로 이끌 준비가 되었습니까?"
 AfricanUnion.2.a: "아프리카의 역사적인 날"
 AfricanUnion.2.b: "결코 안 됩니다, 이것은 우리가 원한 바가 아닙니다"
 AfricanUnion.3.t: "통일된 아프리카"
 AfricanUnion.3.d: "오늘 [UAF.GetOldNameDef]이(가) 아프리카를 하나의 나라 [UAF.GetNameDef](으)로 통일하는 개혁안을 통과시켰습니다. 계획은 대륙을 단일제 국가로 통합하는 것이며, 각 주는 미국과 비슷하게 정책에 대해 제한적인 자치권만 갖게 됩니다. 우리는 아프리카를 새로운 미래로 이끌 준비가 되었습니까?"
 AfricanUnion.3.a: "아프리카의 역사적인 날"
 AfricanUnion.3.b: "결코 안 됩니다, 이것은 우리가 원한 바가 아닙니다"
 AfricanUnionRandomEvents.1.t: "아프리카 투자 은행, 산업에 투자"
 AfricanUnionRandomEvents.1.d: "아프리카 투자 은행이 [ROOT.GetAdjective] 산업에 대한 투자를 돕겠다고 제안했습니다. 비용의 절반은 우리가 투자하고 나머지 절반은 은행이 부담하자는 것입니다. 은행이 제안한 자금은 아프리카 연합의 다른 회원국과 연결되어 있으므로, 이를 통해 해당 회원국과의 유대가 더욱 깊어질 것입니다."
 AfricanUnionRandomEvents.1.a: "그 투자가 필요합니다"
 AfricanUnionRandomEvents.1.b: "없어도 괜찮을 것 같습니다"
 AfricanUnionRandomEvents.2.t: "아프리카 투자 은행, 기술 부문에 투자"
 AfricanUnionRandomEvents.2.d: "아프리카 투자 은행이 선진국에 대한 경쟁력을 높이기 위해 [ROOT.GetAdjective] 기술 부문에 대한 투자를 돕겠다고 제안했습니다. 비용의 절반은 우리가 투자하고 나머지 절반은 은행이 부담하자는 것입니다. 은행이 제안한 자금은 아프리카 연합의 다른 회원국과 연결되어 있으므로, 이를 통해 해당 회원국과의 유대가 더욱 깊어질 것입니다."
 AfricanUnionRandomEvents.2.a: "그 투자가 필요합니다"
 AfricanUnionRandomEvents.2.b: "없어도 괜찮을 것 같습니다"
 AfricanUnionRandomEvents.3.t: "아프리카 투자 은행, 자금 요청"
 AfricanUnionRandomEvents.3.d: "아프리카 투자 은행이 자체 자금 조달과 관련하여 우리에게 연락해 왔습니다. 은행은 다른 나라에 투자할 소액의 자금을 요청하고 있습니다. 자금의 일부는 투자 대상에게 전달되고, 일부는 장기적으로 우리에게 이익이 될 포트폴리오에 투입될 것입니다. 어떻게 답해야 합니까?"
 AfricanUnionRandomEvents.3.a: "아프리카 형제들을 돕겠습니다"
 AfricanUnionRandomEvents.3.b: "우리 돈은 지키겠습니다"
 AfricanUnionRandomEvents.4.t: "[FROM.GetNameDef]의 우리에 대한 투자 희망"
 AfricanUnionRandomEvents.4.d: "[FROM.GetAdjective] 정부가 아프리카 투자 은행과 협력하여 우리나라를 돕기 위한 소규모 투자 패키지를 준비했습니다. 이 제안을 수락해야 합니까?"
 AfricanUnionRandomEvents.4.a: "물론이지"
 AfricanUnionRandomEvents.4.b: "아니요, 괜찮습니다"
 AfricanUnionRandomEvents.5.t: "AMF, 우리의 부채 해결을 지원"
 AfricanUnionRandomEvents.5.d: "아프리카 통화 기금이 계속 늘어나는 우리의 부채를 해결하는 데 도움이 되도록 지원 패키지를 보내왔습니다. 이 자금은 아프리카 연합의 여러 다른 회원국에서 나온 것이며, 그중 한 곳의 대규모 기부자가 뚜렷하게 존재합니다."
 AfricanUnionRandomEvents.5.a: "뜻밖이지만 환영할 일입니다"
 AfricanUnionRandomEvents.5.b: "우리에게 적선은 필요 없습니다"
 AfricanUnionRandomEvents.6.t: "AMF, 부채 분담 요청"
 AfricanUnionRandomEvents.6.d: "아프리카 통화 기금이 다른 아프리카 연합 회원국의 부채를 해결하는 데 도움을 달라고 요청했습니다. 그 회원국은 부채의 일부를 우리가 처리하도록 이전할 것이며, 우리가 그렇게 해준다면 분명 고마워할 것입니다."
 AfricanUnionRandomEvents.6.a: "아프리카 형제들을 도와야 합니다"
 AfricanUnionRandomEvents.6.b: "우리도 관리해야 할 부채가 있습니다"
 AfricanUnionRandomEvents.7.t: "[FROM.GetNameDef]의 우리 부채 상환 희망"
 AfricanUnionRandomEvents.7.d: "[FROM.GetAdjective] 정부가 아프리카 통화 기금과 협력하여 우리 정부 부채의 일부를 떠안겠다고 제안했습니다. 어떻게 답해야 합니까?"
 AfricanUnionRandomEvents.7.a: "좋습니다"
 AfricanUnionRandomEvents.7.b: "도움은 필요 없습니다"
 AfricanUnionRandomEvents.8.t: "[FROM.GetNameDef]의 우리 투자 수락"
 AfricanUnionRandomEvents.8.d: "[FROM.GetAdjective] 정부가 아프리카 투자 은행의 도움을 받아 자국에 투자하겠다는 우리의 제안을 수락했습니다."
 AfricanUnionRandomEvents.8.a: "좋아"
 AfricanUnionRandomEvents.9.t: "[FROM.GetNameDef]의 우리 투자 거부"
 AfricanUnionRandomEvents.9.d: "[FROM.GetAdjective] 정부가 아프리카 투자 은행의 도움을 받아 자국에 투자하겠다는 우리의 제안을 거부했습니다."
 AfricanUnionRandomEvents.9.a: "그들의 손해입니다!"
 AfricanUnionRandomEvents.10.t: "우리의 부채 상환 제안을 수락한 [FROM.GetNameDef]"
 AfricanUnionRandomEvents.10.d: "[FROM.GetAdjective] 정부가 자국 부채의 일부를 갚아주겠다는 우리의 제안을 수락했습니다."
 AfricanUnionRandomEvents.10.a: "좋아"
 AfricanUnionRandomEvents.11.t: "우리의 부채 상환 제안을 거부한 [FROM.GetNameDef]"
 AfricanUnionRandomEvents.11.d: "[FROM.GetAdjective] 정부가 자국 부채의 일부를 갚아주겠다는 우리의 제안을 거부했습니다."
 AfricanUnionRandomEvents.11.a: "그들의 손해입니다!"
 AfricanUnion_news.1.t: "아프리카 연합 출범"
 AfricanUnion_news.1.d: "오늘은 [SAF.GetAdjective] 대통령 [SAF.GetLeader]이(가) 연합 총회의 첫 회기에서 남아프리카 더반에서 아프리카 연합의 출범을 선언한 역사적인 날이었습니다. 첫 총회의 주제는 '평화, 발전, 번영: 아프리카의 세기'였습니다. 참가자들은 연합의 주요 목표와 지향점도 논의했습니다. 이는 대륙 통합을 향한 큰 걸음입니다."
 AfricanUnionSummit.1.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.1.d: "올해 아프리카 연합 정상회의에서 대표들은 주로 아프리카 통합을 위한 기본 틀을 논의하는 데 집중했습니다. 연합의 목표가 무엇이어야 하는지, 그리고 각국이 어떻게 함께 그 목표를 달성할 수 있는지에 대해 많은 논의가 이루어졌습니다. 많은 아프리카 지도자들이 같은 목표와 이를 달성할 수단을 공유하고 있어, 내년에는 아프리카 국가 간 협력이 공유될 가능성이 높습니다."
 AfricanUnionSummit.1.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.2.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.2.d: "올해 아프리카 연합 정상회의에서 참가국들은 아동의 권리를 강조했습니다. 총회는 모든 회원국에 아동의 권리와 복지에 관한 아프리카 헌장에 서명하고 유니세프와 협력하여 아동 사망률과 아동 보건 문제를 해결할 것을 촉구했습니다."
 AfricanUnionSummit.2.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.3.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.3.d: "올해 아프리카 연합 정상회의에서 아프리카 연합 총회는 아프리카 사람들에게 디지털화와 인터넷 이용이 갖는 중요성이 커지고 있음을 인정했습니다. 아프리카 연합은 모든 회원국에 각국 간의 상호 연결성을 개선할 것을 촉구합니다."
 AfricanUnionSummit.3.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.4.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.4.d: "올해 아프리카 연합 정상회의에서 아프리카 연합 총회는 아프리카 인권 및 인민권 위원회에 아프리카 전역의 인권 발전에 더 많은 관심을 기울이고 더 많은 캠페인을 벌일 것을 촉구했습니다. 총회는 특히 회원국들에 아프리카 인권 및 인민권 헌장 제62조에 따라 정기 보고서를 제출할 것을 촉구했습니다."
 AfricanUnionSummit.4.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.5.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.5.d: "올해 아프리카 연합 정상회의에서 총회는 아프리카 각국 통상장관들이 WTO와의 협상을 성공적으로 이끈 데 대해 감사를 표했습니다. 총회는 아프리카 국가들이 특히 선진국과의 무역 협정을 협상할 때 아프리카에 최선의 조건을 얻을 수 있도록 더 적극적으로 나설 것을 촉구했습니다."
 AfricanUnionSummit.5.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.6.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.6.d: "올해 아프리카 연합 정상회의에서 총회는 [BFA.GetName], [SEN.GetName], [CNG.GetName]이(가) 말라리아와 HIV 감염으로 인한 사망률을 줄이는 데 겸상 적혈구 빈혈의 적절한 관리가 중요하다는 점을 우선시한 주도적 노력을 높이 평가했습니다. 총회는 평생 치료가 필요한 이 질병의 최선의 치료법을 찾아 달라고 국제사회에 요청했습니다."
 AfricanUnionSummit.6.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.7.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.7.d: "올해 아프리카 연합 정상회의에서 총회는 약탈당한 아프리카의 문화 및 역사 유물을 원래의 아프리카 소유주에게 돌려주어야 한다고 선언했습니다. 이 문제에서 이미 일부 진전이 있었지만(이탈리아가 악숨 오벨리스크를 에티오피아에 반환한 사례 등), 아직 해야 할 일이 많이 남아 있습니다. 총회는 관련된 모든 국가에 약탈한 문화재를 원래의 장소로 돌려보내기 위해 더욱 노력할 것을 촉구했습니다."
 AfricanUnionSummit.7.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.8.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.8.d: "올해 아프리카 연합 정상회의에서 총회는 아프리카의 식량 생산이 선진국에 의존하는 데 따른 위험을 인정했습니다. 그 요인 중 하나는 아프리카로의 종자 수입으로, 독점 및 법적·기술적 권리 문제와 함께 아프리카의 생물 다양성이 감소할 위험이 있습니다. 총회는 아프리카의 생물 다양성을 뒷받침하고 아프리카인을 선진국 종자 독점의 노예 상태에서 해방할 자체 종자 생산 산업을 만들어야 한다고 강조했습니다."
 AfricanUnionSummit.8.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.9.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.9.d: "올해 아프리카 연합 정상회의에서 7개국 국가 및 정부 수반 위원회는 아프리카 연합을 탄생시킨 시르트 선언의 중요성을 강조했습니다. 수반들은 모든 국가에 선언의 모든 목표를 달성하기 위해 노력을 배가할 것을 요청했습니다. 연합의 궁극적 목표는 완전한 정치적, 경제적 통합이어야 하며, 결국 아프리카 합중국으로 이어져야 합니다."
 AfricanUnionSummit.9.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.10.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.10.d: "올해 아프리카 연합 정상회의에서 총회는 아프리카 각국 정상들에게 아프리카 에이즈 워치(AWA)의 인지도와 재정 지원을 높일 것을 촉구했습니다. 총회는 위원회에 AWA 전략 기본 틀의 이행을 조율하고 점검하며, 그 진척 상황을 매년 총회 정기 회기에 보고할 것을 요청했습니다."
 AfricanUnionSummit.10.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.11.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.11.d: "올해 아프리카 연합 정상회의에서 총회는 아프리카 국가들이 국민의 교육과 문해율을 높인 성과를 치하했습니다. 총회는 대륙에서 문맹을 퇴치하기 위해 더 많은 노력을 기울일 것을 촉구하며, 향후 10년을 '교육의 10년'으로 명명했습니다."
 AfricanUnionSummit.11.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.12.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.12.d: "올해 아프리카 연합 정상회의에서 총회는 대륙 전역의 농업 수확량을 개선하기 위해 각국이 아프리카 비료 개발 센터에 참여할 것을 장려했습니다."
 AfricanUnionSummit.12.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.13.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.13.d: "올해 아프리카 연합 정상회의에서 총회는 과학, 기술 및 과학 연구를 논의했습니다. 총회는 이러한 분야가 대륙에 얼마나 중요한지 강조했습니다. 아프리카가 다른 지역과의 경쟁력을 유지하려면 대륙이 기술 혁신의 중심지가 되어야 합니다."
 AfricanUnionSummit.13.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.14.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.14.d: "올해 아프리카 연합 정상회의에서 총회는 기후 변화 대응의 중요성을 강조했습니다. 아프리카는 기온 상승으로 가장 큰 타격을 입을 지역 중 하나가 될 것입니다. 안타깝게도 다른 나라들이 기후 변화 대응을 꺼리고 있으므로 우리 스스로 나서야 합니다. 총회는 모든 아프리카 국가에 너무 늦기 전에 재생 에너지원에 더 많이 투자할 것을 장려했습니다."
 AfricanUnionSummit.14.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.15.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.15.d: "올해 아프리카 연합 정상회의에서 총회는 아프리카의 산업 부문을 개선하는 방법을 논의했습니다. 총회는 아프리카 제조업이 세계 시장에서 경쟁력을 갖추려면 신기술, 제조 방식, 그리고 더 잘 훈련된 노동자가 필요하다고 강조했습니다."
 AfricanUnionSummit.15.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.16.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.16.d: "올해 아프리카 연합 정상회의에서 총회는 회원국들에 자국 내 산모, 영아 및 아동 사망에 대한 조사를 제도화하기 위한 조치를 취할 것을 촉구했습니다. 총회는 또한 국제연합 기구들과 그 밖의 국제 협력국들에 산모, 영아 및 아동 사망률 감소를 가속화할 것을 요청했습니다."
 AfricanUnionSummit.16.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.17.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.17.d: "올해 아프리카 연합 정상회의에서 총회는 2000년 국제연합 초국가적 조직범죄 방지 협약과 그 의정서의 중요성을 강조했습니다. 열악한 환경 때문에 아프리카는 국제 인신매매범들의 주요 표적이 되고 있으며, 아프리카 연합 회원국들은 이들에 맞서기 위해 가능한 모든 노력을 기울여야 합니다."
 AfricanUnionSummit.17.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.18.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.18.d: "올해 아프리카 연합 정상회의에서 총회는 아프리카의 고르지 못한 물 분배와 때때로 치솟는 식량 가격 문제를 논의했습니다. 총회는 회원국들에 국민이 물이나 식량 부족으로 고통받지 않도록 필요한 조치를 취할 것을 장려했습니다."
 AfricanUnionSummit.18.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.19.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.19.d: "올해 아프리카 연합 정상회의에서 총회는 대륙에서 최근 잇따라 발생한 군사 쿠데타를 강력히 규탄했습니다. 총회는 이 재앙을 끝내기 위해 회원국들이 단호하고 분명하게 대응할 것을 촉구했습니다."
 AfricanUnionSummit.19.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.20.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.20.d: "올해 아프리카 연합 정상회의에서 총회는 회원국들에 대륙의 에너지 독립이 필요함을 상기시켰습니다. 아프리카 전력의 너무 많은 부분이 다른 곳에서 수입되고 있습니다. 대륙의 안보를 높이려면 국내 에너지원에 더 많이 투자해야 합니다."
 AfricanUnionSummit.20.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.21.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.21.d: "올해 아프리카 연합 정상회의에서 총회는 회원국들에 새로운 도로와 철도를 건설하여 대륙의 연결성을 개선할 것을 장려했습니다. 국가 간 연결망이 더 잘 갖춰지면 미래 성장을 위한 더 나은 기반이 마련될 것입니다."
 AfricanUnionSummit.21.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.22.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.22.d: "올해 아프리카 연합 정상회의에서 총회는 아프리카의 무력 분쟁을 논의했습니다. 총회는 이러한 분쟁이 평화적으로 종식되도록 회원국들이 더 적극적인 역할을 해야 한다고 밝혔습니다."
 AfricanUnionSummit.22.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.23.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.23.d: "올해 아프리카 연합 정상회의에서 총회는 해적 행위, 인질극, 그로 인한 몸값 요구 현상이 증가하는 데 대해 중대한 우려를 표명했습니다. 총회는 몸값 지불이 국제 테러 자금 조달의 주요 방법 중 하나라고 보았습니다. 총회는 테러 단체에 대한 몸값 지불을 강력히 규탄하고, 국제사회와 회원국들에 테러 단체에 대한 몸값 지불을 범죄로 간주할 것을 요청했습니다."
 AfricanUnionSummit.23.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.24.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.24.d: "올해 아프리카 연합 정상회의에서 총회는 아프리카 경제 성장에 도움이 될 아프리카 금융 수단의 필요성을 논의했습니다. 총회는 회원국들이 자국은 물론 다른 회원국의 경제 성장에도 도움을 주어야 한다고 밝혔습니다."
 AfricanUnionSummit.24.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.25.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.25.d: "올해 아프리카 연합 정상회의에서 총회는 대륙의 부패에 관한 보고서를 공개했습니다. 여러 나라가 '믿기 힘들 만큼 높은' 수준의 부패를 보이는 것으로 지목되어, 보고서의 결과는 많은 회원국에 불편한 것이었습니다."
 AfricanUnionSummit.25.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.26.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.26.d: "올해 아프리카 연합 정상회의에서 총회는 식민주의의 잔재가 여전히 회원국들을 어떻게 짓누르고 있는지 논의했습니다. 대형 다국적 기업, 은행, 선진국과 연줄이 있는 인사 등이 여전히 회원국의 의사결정에 큰 영향을 미치고 있습니다. 총회는 모든 회원국에 여전히 자신들을 괴롭히는 구조적 문제를 제거할 것을 장려했습니다."
 AfricanUnionSummit.26.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.27.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.27.d: "올해 아프리카 연합 정상회의에서 총회는 아프리카 국가들이 국방을 얼마나 의존하게 되었는지에 대해 우려를 표명했습니다. 대부분의 회원국이 선진국에서 무기를 공급받고 있어, 분쟁이 발생하면 방치될 수도 있습니다. 총회는 회원국들에 국내 군수 산업을 개선할 것을 장려했습니다."
 AfricanUnionSummit.27.a: "통일된 아프리카를 위하여"
 AfricanUnionSummit.28.t: "[GetYear]년 아프리카 연합 정상회의"
 AfricanUnionSummit.28.d: "올해 아프리카 연합 정상회의에서 총회는 회원국들에 국제 무역을 위한 시설을 개선할 것을 촉구했습니다. 수에즈, 지브롤터, 희망봉은 모두 해상 무역의 중요한 항로입니다. 아프리카 전역에서 무역이 원활하게 이루어지도록 항구와 조선소를 확장해야 합니다."
 AfricanUnionSummit.28.a: "통일된 아프리카를 위하여"
 AFRICAN_UNION_is_joint_member_tt: "자격이 정지되지 않은 아프리카 연합 회원국임"
