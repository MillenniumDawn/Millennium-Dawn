 MD_ftc_ex_capital_tt: "§Y$MD_ftc_exercise_capital$§!\n\n£navy_experience $NAVY_EXPERIENCE$: §R-450§!\nGains $POLITICS_NATIONAL_SPIRIT$ §Y$MD_ftc_exercise_capital$§! for §H90§! days:\n $MODIFIER_NAVY_FUEL_CONSUMPTION_FACTOR$: §R+25%§!\n $MODIFIER_NAVY_CAPITAL_SHIP_ATTACK_FACTOR$: §G+3%§!\n£doctrine_mastery §H$DOCTRINE_TRACK_CAPITAL$§! Mastery: [MD_ftc_exercise_mastery_tt_text] per day for §H90§! days\n\nRequires at least one $carrier$, $helicopter_operator$, $battleship$, $battle_cruiser$ or $cruiser$."
 MD_ftc_ex_escort_tt: "§Y$MD_ftc_exercise_escort$§!\n\n£navy_experience $NAVY_EXPERIENCE$: §R-450§!\nGains $POLITICS_NATIONAL_SPIRIT$ §Y$MD_ftc_exercise_escort$§! for §H90§! days:\n $MODIFIER_NAVY_FUEL_CONSUMPTION_FACTOR$: §R+25%§!\n $MODIFIER_NAVY_SCREEN_ATTACK_FACTOR$: §G+3%§!\n£doctrine_mastery §H$DOCTRINE_TRACK_ESCORT$§! Mastery: [MD_ftc_exercise_mastery_tt_text] per day for §H90§! days\n\nRequires at least one $destroyer$, $frigate$ or $corvette$."
