 no_more_nuke: "핵무기 포기에 동의함"
 raid_type_PER_raid_hezbollah_desc: "공습이 레바논 남부에서 여전히 헤즈볼라를 지휘하는 IRGC 지휘관들을 표적으로 삼아, 이 운동을 테헤란의 강경파 후원자들로부터 단절시킵니다."
