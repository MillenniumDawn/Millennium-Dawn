 SPR_idea_trade_focus_desc: "세계 무역망에 더욱 확고히 자리 잡으면 우리가 성장할 수 있습니다."
 SPR_idea_regional_autonomy: "자치 국가 체제"
 SPR_idea_regional_autonomy_desc: "스페인은 \\"자치 국가 체제\\"로 알려진 분권형 모델로 운영됩니다. 이 정부 형태는 스페인에 고유한 것으로 1978년 헌법에 따라 만들어졌으며, 스페인을 구성하는 민족주의 세력과 지역에 제한적인 자치를 보장하는 것을 목표로 했습니다. 현재 스페인에는 이러한 자치 공동체가 17개, 자치 도시가 2곳(세우타와 멜리야) 있습니다. 이 제도는 스페인의 최근 역사에서 여러 차례 검증 대상이 되었으며, 정부 내 일부 세력은 이를 개정하거나 완전히 폐지하려 합니다."
 SPR_idea_regional_autonomy_reduced: "약화된 자치 국가 체제"
 SPR_idea_regional_autonomy_reduced_desc: "스페인은 \\"자치 국가 체제\\"로 알려진 분권형 모델로 운영됩니다. 이 정부 형태는 스페인에 고유한 것으로 1978년 헌법에 따라 만들어졌으며, 스페인을 구성하는 민족주의 세력과 지역에 제한적인 자치를 보장하는 것을 목표로 했습니다. 현재 스페인에는 이러한 자치 공동체가 17개, 자치 도시가 2곳(세우타와 멜리야) 있습니다. 이 제도는 스페인의 최근 역사에서 여러 차례 검증 대상이 되었으며, 정부 내 일부 세력은 이를 개정하거나 완전히 폐지하려 합니다.\n\n과거의 통치 체제를 폐지하지는 않았지만, 각 지역의 자치권은 크게 축소되었습니다."
 SPR_idea_grey_market: "회색 시장"
 SPR_idea_grey_market_desc: "스페인의 회색 시장은 지하 경제로, 그리스나 이탈리아만이 이보다 규모가 큰 유럽 3위 수준으로 평가됩니다. 이 \\"회색 시장\\"이 스페인 경제 규모를 최대 20%가량 키울 수도 있습니다."
 SPR_oil_spill: "기름 유출"
 SPR_oil_spill_desc: "대형 유조선이 해안을 따라 기름을 유출했습니다."
 SPR_the_eta: "ETA"
 SPR_the_eta_desc: "에우스카디 타 아스카타수나(ETA)는 '바스크 조국과 자유'를 뜻합니다. 스페인 북부와 프랑스 남서부에서 활동하는 바스크 민족주의 및 분리주의 조직입니다. 1959년 공식 결성되었으며 처음에는 전통 바스크 문화를 장려하는 단체였으나, 이후 남부 바스크 지방과 스페인 영토 전역에서 폭탄 테러, 암살, 납치를 일삼는 폭력적 준군사 조직으로 변모했습니다."
 SPR_idea_democratic_constitutionalism: "민주적 입헌주의"
 SPR_idea_democratic_constitutionalism_desc: "스페인 왕국은 수많은 세부 사항이 얽힌 길고 활기찬 역사를 지니고 있습니다. 우리나라의 민주적 성격을 강화하면 새로운 시대로 나아가며 계속 성장할 수 있을 것입니다."
 SPR_idea_monarcho_revisionism: "군주제 수정주의"
 SPR_idea_monarcho_revisionism_desc: "군주제의 뜻에 맞게 법을 개정하는 일은 결코 쉽지 않지만 반드시 해내야 합니다. 더 큰 안정과 번영을 보장하려면 군주제가 다시 집권 세력이 되어야 합니다."
 SPR_idea_rights_of_the_king: "왕의 권한"
 SPR_idea_rights_of_the_king_desc: "국왕은 우리나라에서 최고의 존재입니다. 그의 권리는 명확히 규정되어야 하며, 그의 뜻에 예외 없이 명시되어야 합니다."
 SPR_idea_guardia_real: "왕실 근위대"
 SPR_idea_guardia_real_desc: "왕실 근위대(Guardia Real)는 스페인 국왕과 왕실 구성원의 보호를 전담하는 스페인군 연대입니다. 모든 지역에서 복무할 수 있도록 다양한 부대를 갖추고 있습니다."
 SPR_idea_monarcho_research_investments: "왕실 후원 연구"
 SPR_idea_monarcho_research_investments_desc: "연구를 후원하면 우리의 기술이 이웃 국가 및 경쟁국과 비교해 최신 수준을 유지할 수 있습니다."
 SPR_idea_the_new_spanish_monarchy: "새로운 스페인 군주들"
 SPR_idea_the_new_spanish_monarchy_desc: "국왕의 복귀는 좌파 성향이 강한 일부 국민에게는 민감한 문제였지만, 이들이 국민을 위한 군주임을 분명히 알려야 합니다. 지금도, 앞으로도 영원히 스페인 국민을 위한 군주입니다."
 SPR_a_benevolent_monarch_idea: "자애로운 군주제"
 SPR_a_benevolent_monarch_idea_desc: "군주는 스페인 국민에게 자애롭고 공정합니다. 군주는 자신이 아닌 스페인 국민을 위해 통치합니다."
 SPR_the_horizon_never_sets_idea: "지지 않는 지평선"
 SPR_the_horizon_never_sets_idea_desc: "우리나라의 야망은 위대하고 거대하므로 지평선은 결코 지지 않을 것입니다."
 SPR_the_a_loyal_military_idea: "충성스러운 군대"
 SPR_the_a_loyal_military_idea_desc: "군대에 충성심을 심어 주면 이탈자가 없을 것이며 우리의 힘을 영원히 유지할 수 있습니다. 군대는 왕실을 섬기고 그 뜻을 전 세계에 관철하기 위해 존재합니다."
 SPR_the_new_nobility_idea: "우리의 귀족"
 SPR_the_new_nobility_idea_desc: "우리의 귀족은 더 큰 체스판 위의 도구이자 졸에 지나지 않습니다. 이들을 가까이 두되 항상 일정한 거리를 유지해야 합니다."
 SPR_a_great_victory_for_spain_idea: "위대한 승리"
 SPR_a_great_victory_for_spain_idea_desc: "우리는 최근 위대한 승리를 거두었습니다. 스페인에 영광을!"
 SPR_unionization_of_faith_idea: "신앙의 노조화"
 SPR_unionization_of_faith_idea_desc: "우리의 노동조합에는 가톨릭적 요소가 있어야 합니다. 모든 것은 주님의 뜻이며, 우리가 하는 모든 일이 일상생활에 반영되도록 해야 합니다."
 SPR_a_party_of_the_people_idea: "국민의 정당"
 SPR_a_party_of_the_people_idea_desc: "우리는 국민의 정당입니다. 우리는 모든 것을 국민을 위해 합니다. 우리의 목적은 스페인 국민을 섬기는 것입니다."
 SPR_the_conservative_welfare_state_idea: "보수적인 복지 국가"
 SPR_the_conservative_welfare_state_idea_desc: "복지 국가는 유지되어야 하지만, 복지 국가가 계속 튼튼하게 유지되도록 일부 삭감과 제한이 필요합니다."
 SPR_the_spanish_patriot_act_idea: "스페인 애국법"
 SPR_the_spanish_patriot_act_idea_desc: "최근의 사건들로 인해 보안 절차에 더욱 강경한 조치가 필요해졌습니다."
 SPR_conservative_education_reforms_idea: "전통 교육 개혁"
 SPR_conservative_education_reforms_idea_desc: "학교에서 더욱 전통적인 가치가 교육되고 아이들이 바르게 자라도록 종교도 가르치게끔 교육을 쇄신해야 합니다."
 SPR_revival_of_golden_share_idea: "황금주 부활"
 SPR_revival_of_golden_share_idea_desc: "공통 통화에서 벗어나 황금주를 다시 도입하여 우리 통화를 뒷받침하는 것은 경제에 강력한 한 수입니다."
 SPR_spanish_intervention_abroad_idea: "스페인 개입주의"
 SPR_spanish_intervention_abroad_idea_desc: "다른 나라에 개입하는 것은 솔직히 이제 국민적 소일거리가 되어야 합니다."
 SPR_pro_lgbtqa_stance_idea: "성소수자에 우호적인 입장"
 SPR_pro_lgbtqa_stance_idea_desc: "우리 정부는 LGBT 친화적 입장을 취했습니다."
 SPR_anti_lgbtqa_stance_idea: "성소주자에 부정적인 입장"
 SPR_anti_lgbtqa_stance_idea_desc: "우리 정부는 LGBT 반대 입장을 취했습니다."
 SPR_family_first_idea: "가족 우선"
 SPR_family_first_idea_desc: "가족에 대한 중시와 보다 전통적인 사회를 유지하는 것이 우리가 미래로 나아가는 길입니다."
 SPR_spanish_deregulation_idea: "스페인 규제 완화"
 SPR_spanish_deregulation_idea_desc: "관료적 형식주의를 없애고 각종 규제를 대폭 줄이면 우리나라는 손쉽고 빠른 성장세를 누릴 수 있습니다."
 SPR_longer_work_less_siesta_idea: "더 긴 노동, 더 짧은 시에스타"
 SPR_longer_work_less_siesta_idea_desc: "한낮의 시에스타를 없애면 노동자의 생산성이 높아지고 더욱 엄격한 직업윤리가 자리 잡게 됩니다."
 SPR_the_natalist_view_idea: "출산 장려론"
 SPR_the_natalist_view_idea_desc: "$SPR_the_natalist_view_desc$"
 SPR_support_the_nationalist_front_idea: "민족 전선 지원"
 SPR_support_the_nationalist_front_idea_desc: "정부의 안보를 보장하려면 민족 전선을 지원해야 합니다."
 SPR_the_castle_doctrine_idea: "성채 원칙"
 SPR_the_castle_doctrine_idea_desc: "자기 집을 지키는 행위가 법의 처벌로 이어져서는 안 됩니다. 성채 원칙은 생명 보존의 원칙만큼 중요합니다."
 SPR_rigged_elections_idea: "조작된 선거"
 SPR_rigged_elections_idea_desc: "좌파 폭군이 권력을 잡지 못하도록 선거를 조작하는 것이 앞으로 나아가는 최선의 방법입니다."
 SPR_anti_immigration_policies_idea: "반이민 정책"
 SPR_anti_immigration_policies_idea_desc: "이민은 우리나라를 좀먹는 재앙이며, 앞으로 나아가기 전에 반드시 막아야 합니다."
 SPR_idea_increased_immigration: "이민 장려"
 SPR_idea_increased_immigration_desc: "이민을 장려하는 것은 우리나라에 이익만을 가져다줍니다."
 SPR_state_sponsored_unions_idea: "국가 후원 노조"
 SPR_state_sponsored_unions_idea_desc: "노조를 후원하면 정부에 대한 우리의 장악력이 굳건히 유지될 것입니다."
 SPR_funding_for_police_idea: "경찰 추가 예산"
 SPR_funding_for_police_idea_desc: "경찰력에 자금을 투입하면 충분한 재정 지원을 받고 어떤 사태에도 대비할 수 있게 됩니다."
 SPR_border_entrenchment_idea: "국경 요새화"
 SPR_border_entrenchment_idea_desc: "검문소와 방어 시설 등이 핵심입니다."
 SPR_the_true_identity_of_spain_idea: "스페인의 진정한 정체성"
 SPR_the_true_identity_of_spain_idea_desc: "스페인의 진정한 정체성은 민족주의와 자긍심입니다. 이제 우리의 정체성을 세계에 보여 줄 때입니다."
 SPR_glory_to_spain_idea: "스페인에 영광을!"
 SPR_glory_to_spain_idea_desc: "스페인의 영광과 힘이 다시 한번 드러나고 있습니다. 스페인 만세!"
 SPR_parental_choice_on_all_topics_idea: "전면적 학부모 선택권"
 SPR_parental_choice_on_all_topics_idea_desc: "스페인의 학부모는 자녀의 교육을 전적으로 통제합니다."
 SPR_parental_choice_on_controversial_idea: "논쟁 주제 선택권"
 SPR_parental_choice_on_controversial_idea_desc: "학부모는 성교육과 같은 논쟁적인 주제를 자녀가 공교육에서 배우게 할지 선택할 권리가 있습니다."
 SPR_a_harsh_nativism_stance_idea: "강경 토착주의"
 SPR_a_harsh_nativism_stance_idea_desc: "정부 정책에서 이민자는 후순위로 밀려나야 합니다. 어떤 상황, 어떤 정책에서든 자국 출생 시민이 무엇보다 우선해야 합니다."
 SPR_a_soft_nativism_stance_idea: "온건 토착주의"
 SPR_a_soft_nativism_stance_idea_desc: "이민자와 비자 소지자에 대한 비중을 줄이면 이들은 계속 정부 정책의 주목을 받겠지만, 우리는 여전히 자국 출생 시민을 우선시할 것입니다."
 SPR_the_falangist_youth_front_idea: "팔랑헤 소년단"
 SPR_the_falangist_youth_front_idea_desc: "보이스카우트와 비슷하지만 좀 더 과격합니다."
 SPR_spain_first_idea: "스페인 우선"
 SPR_spain_first_idea_desc: "스페인이 모든 것에 앞서며, 그 누구에게도 뒤처지지 않는다."
 SPR_rebuild_our_glory_idea: "영광의 재건"
 SPR_rebuild_our_glory_idea_desc: "이른바 민주주의 속에서 스스로 무력해진 이후 우리의 영광은 빛이 바랬습니다. 이제 영광을 재건하고 한때의 위상을 되찾을 때입니다. 스페인에 영광을!"
 SPR_the_hands_of_the_few_idea: "소수의 손"
 SPR_the_hands_of_the_few_idea_desc: "권력은 소수의 손에 있을 때 가장 잘 쓰입니다."
 SPR_the_new_spanish_clergy_idea: "새로운 스페인 성직자단"
 SPR_the_new_spanish_clergy_idea_desc: "스페인 성직자단을 부활시켜 국가의 도구로 개편하면 교회를 국가에 일치시킬 수 있습니다."
 SPR_pride_of_the_army_idea: "군의 자부심"
 SPR_pride_of_the_army_idea_desc: "군대는 우리의 최고 자부심을 받을 자격이 있습니다. 우리 군은 위대하고 강하며, 모든 스페인 시민은 복무하는 남녀 장병을 자랑스러워해야 합니다."
 SPR_una_espana_y_granda_libre_idea: "하나의 위대하고 자유로운 스페인!"
 SPR_una_espana_y_granda_libre_idea_desc: "스페인이 무엇보다 위에 있습니다."
 SPR_women_belong_on_the_homefront_idea: "여성의 자리는 후방"
 SPR_women_belong_on_the_homefront_idea_desc: "여성의 자리는 후방입니다. 여성과 남성의 역할을 명확히 구분하면 우리의 위대한 사회에 절실히 필요한 질서가 확립될 것입니다."
 SPR_women_choose_idea: "선택할 권리"
 SPR_women_choose_idea_desc: "여성은 원하는 바를 선택할 권리가 있어야 합니다. 새로운 팔랑헤 사회의 힘은 독실한 추종자들이 최선의 모습이 될 수 있도록 하는 데 있습니다."
 SPR_regulate_the_markets_idea: "시장 규제"
 SPR_regulate_the_markets_idea_desc: "시장을 규제하면 시장, 나아가 경제에 대한 통제력이 커집니다."
 SPR_separation_of_church_and_state_idea: "정교 분리"
 SPR_separation_of_church_and_state_idea_desc: "가톨릭 교회는 너무 오랫동안 우리나라를 좌지우지해 왔습니다. 정부를 교회로부터 분리하면 현대적인 사회민주주의 국가로 전환하면서 국가로서 성장할 수 있습니다."
 SPR_the_peoples_spain_idea: "인민의 스페인"
 SPR_the_peoples_spain_idea_desc: "스페인 사회당은 정부가 국민을 위해 존재한다는 이념을 따릅니다. 스페인은 국민의 것이며 언제나 그러했고, 앞으로도 영원히 그래야 합니다.\n"
 SPR_the_scandinavians_style_idea: "스칸디나비아식 모델"
 SPR_the_scandinavians_style_idea_desc: "우리의 복지 제도를 스칸디나비아 형제자매들의 제도와 비슷하게 본받아 개선하는 것이 현행 제도를 다루는 확실한 방법입니다."
 SPR_end_the_loophole_idea: "허점 폐쇄"
 SPR_end_the_loophole_idea_desc: "세법에 존재하는 세금 허점을 없애면 가장 가난한 시민의 세 부담을 덜고 이를 부유층의 어깨에 확실히 지울 수 있습니다."
 SPR_keynesian_economic_idea: "케인스주의 경제 정책"
 SPR_keynesian_economic_idea_desc: "통화주의 경제 모델에서 케인스 이론으로 전환하면 스페인 경제 성장에 큰 도움이 될 수 있습니다. 가격은 본질적으로 경직적이므로 경제에서 정부의 역할을 유지해야 합니다."
 SPR_collectiveness_egalitarianism_idea: "집단적 평등주의"
 SPR_collectiveness_egalitarianism_idea_desc: "모든 사람의 필요를 충족하고 충분한 기회를 보장하면 공동체가 강하고 번영하는 상태를 유지할 수 있습니다."
 SPR_libertad_idea: "자유"
 SPR_libertad_idea_desc: "지금도, 영원히 자유를. 우리나라는 결코 흔들리지 않을 것입니다."
 SPR_marxist_reeducation_idea: "마르크스-레닌주의 재교육"
 SPR_marxist_reeducation_idea_desc: "국민은 우리의 새로운 철학을 배워야 합니다. 국민이 참된 이념을 따르도록 재교육하는 것이 위대하고 훌륭한 국가를 이루기 위한 첫걸음입니다."
 SPR_the_rights_of_the_worker_idea: "노동자의 권리"
 SPR_the_rights_of_the_worker_idea_desc: "노동자의 권리가 무엇보다 우선되어야 합니다. 노동자를 지원하지 않는다면 국가로서 노동자들을 실망시키는 것이며 재고해야 합니다."
 SPR_the_peoples_militias_idea: "인민민병대"
 SPR_the_peoples_militias_idea_desc: "국민이 일어나 스페인을 지켜야 합니다."
 SPR_communistic_research_idea: "공산주의 연구"
 SPR_communistic_research_idea_desc: "집단의 이익을 위한 연구가 가장 강력한 전진의 길입니다."
 SPR_the_culture_of_proletarianism_idea: "프롤레타리아 문화"
 SPR_the_culture_of_proletarianism_idea_desc: "올바른 노동 계급 문화를 확립하면, 새로운 공산주의 이상향이라는 꿈을 향해 나아가는 우리나라가 계속 전진할 수 있습니다."
 SPR_the_great_confederation_idea: "대연합"
 SPR_the_great_confederation_idea_desc: "모든 공산주의 및 좌파 정당의 대연합은 우리 정부에 위대한 승리를 보장할 것입니다."
 SPR_union_of_working_youth_idea: "노동 청년 연맹"
 SPR_union_of_working_youth_idea_desc: "일하고자 하는 모든 청년은 자신에게 맞는 노조의 일원이 되어야 합니다. 일찍부터 노조에 가입하면 가장 어린 노동자들에게 최선의 결과를 보장할 수 있습니다."
 SPR_the_emancipation_of_the_woman_idea: "여성 해방"
 SPR_the_emancipation_of_the_woman_idea_desc: "여성 해방은 우리나라 여성들의 영광과 경이로움을 보여 주기 위한 것입니다. 이제 여성은 지금도, 앞으로도 영원히 우리와 하나입니다."
 SPR_a_holy_monarchy: "신성한 군주제"
 SPR_support_of_the_pope: "교황의 지지"
 SPR_dissolved_monasteries_HLS: "해산된 수도원"
 SPR_dissolved_monasteries: "해산된 수도원"
 SPR_islamophobic_rhetoric: "이슬람 혐오 수사"
 SPR_islamophobic_rhetoric_trade: "이슬람 혐오 수사"
 SPR_tried_to_annex_us: "우리를 합병 하려함!"
 SPR_spain_fosters_support_in_eu: "EU 내 지지 확보"
 SPR_declined_gibraltar_insult: "우리를 모욕했다!"
 SPR_declined_gibraltar: "지브롤터 거절"
 SPR_agreed_to_moroccan_deal: "모로코 합의 수락"
 SPR_failure_to_reach_a_deal: "합의 결렬"
 SPR_the_new_communist_general_secretary: "새로운 총서기"
 spain.247.a: "좋아"
 catalonians_loc: "카탈루냐 (카탈루니아)"
 basques_loc: "유스칼드나크 (바스크)"
 galicians_loc: "갈라고스 (갈리시아)"
 canarians_loc: "카나리오 (카나리아)"
 SPR_canarios_targeted_subsidies_decision: "§Y[CNR.GetFlag][CNR.GetAdjective]§! 맞춤형 보조금"
 SPR_canarios_targeted_subsidies_decision_desc: "갈리시아 주민을 대상으로 한 지역 맞춤형 보조금을 준비하면 주민들의 일시적인 호의를 얻을 수 있습니다."
 SPR_idea_spanish_mining_companies: "스페인 광업 기업"
 SPR_idea_spanish_mining_companies_desc: "우리는 외국 기업에 대한 의존도를 낮추기 위해 자국 광업 기업에 자금을 지원했습니다."
 SPR_idea_refinery_expansion: "정유 중점"
 SPR_idea_refinery_expansion_desc: "우리나라는 석유를 거의 채굴하지 않지만 수입 석유를 대량으로 정제하는 나라입니다. 정유 산업에 더 많은 관심을 기울여야 합니다."
 SPR_idea_spanish_oil_fever: "스페인 석유 열풍의 시작"
 SPR_idea_spanish_oil_fever_desc: "석유 채굴 작업이 시작되었으며 화석 연료 업계의 기대감이 커지고 있습니다."
 spain.264.t: "왕실과 탈세"
 spain.264.d: "우리 공주 크리스티나 왕녀에 대한 탈세 의혹이 처음으로 드러나 대중의 관심을 끈 지 1년이 넘게 지났습니다. 이제 크리스티나 왕녀가 팔마 데 마요르카 공작 작위에 대한 권리를 유지해야 하는지 결정할 때입니다."
 spain.264.a: "작위를 박탈한다"
 spain.264.b: "의혹을 무시한다"
 spain.265.t: "크리스티나 왕녀에 대한 부패 혐의"
 spain.265.d: "호세 카스트로 판사가 오늘 일찍 크리스티나 왕녀에 대한 혐의를 공식화했습니다. 탈세 혐의는 최근 부패와 탈세로 조사를 받은 남편과의 관계 때문에 제기되었습니다. 그녀는 최근 자신에 대한 모든 의혹을 부인했으며 남편의 거래에 대해 알지 못했다고 밝혔습니다. 물론 거짓말을 하고 있을 가능성도 있으나, 정당한 절차가 진행되도록 하는 것이 중요합니다."
 spain.265.a: "왕실의 오점"
 spain.266.t: "세우타와 멜리야 방문"
 spain.266.d: "세우타와 멜리야 두 도시는 우리나라 총리의 방문을 받은 지 오래되었습니다. 그곳 주민은 본질적으로 스페인인이며, 따라서 정부와 우리 총리의 관심을 받을 자격이 충분합니다. 이들이 다른 어느 지역과도 마찬가지로 나라의 핵심 부분임을 다시 한번 상기시켜 주는 것이 의미 있을 수 있습니다."
 spain.266.a: "도시들을 방문한다"
 spain.266.b: "음... 안 하는 게 낫겠다."
 spain.267.t: "스페인 총리, 세우타와 멜리야 방문"
 spain.267.d: "스페인 총리 [SPR.GetLeader]이(가) 세우타와 멜리야 도시를 방문했습니다. 이곳은 지도자의 방문을 자주 받지 못했으나 이번 방문은 나라의 여러 정당 사이에서 분노를 불러일으켰습니다. [Neutral_conservatism_L]이(가) 이들 정당 가운데 가장 목소리가 크며, 일부 지도부는 스페인이 자국의 민족주의적이고 제국주의적인 유산을 존중하고 지지한다고 공동으로 언급했습니다. 이들은 분노를 표명하도록 정부에 청원하고 있습니다."
 spain.267.a: "방문을 부인한다"
 spain.267.b: "그곳은 그들의 도시이니..."
 SPR_visited_ceuta: "세우타와 멜리야 방문"
 SPR_decommodify_the_basics_idea: "필수재의 탈상품화"
 SPR_decommodify_the_basics_idea_desc: "생활 필수재는 상품으로 취급되어서는 안 됩니다. 필수재는 필수재로 대우받아야 합니다."
 SPR_nuclear_acceptance_campaign_desc: "핵에 대한 반대에 맞서 싸우면 우리의 친환경 구상이 탄력을 받을 수 있습니다. 결국 이로 인해 이익을 보는 것은 스페인 국민입니다."
 SPR_reform_the_spanish_foreign_legion_decision: "외인부대 테르시오 업그레이드"
 SPR_reform_the_spanish_foreign_legion_decision_desc: "현재의 §Y외인부대 테르시오§!는 좋은 성과를 내고 있습니다. 일부 맞춤형 확장과 추가 투자를 통해 이들을 개선하는 것을 목표로 삼을 수 있습니다."
 SPR_political_tree_shortcut: "정치 트리"
 SPR_nuestra_identity_shortcut: "우리의 정체성"
 SPR_industry_shortcut: "스페인 산업"
 SPR_military_shortcut: "육군"
 SPR_culture_index_1: "[?SPR_culture_opinion^0|Y0]"
 SPR_culture_index_2: "[?SPR_culture_opinion^1|Y0]"
 SPR_culture_index_3: "[?SPR_culture_opinion^2|Y0]"
 SPR_culture_index_4: "[?SPR_culture_opinion^3|Y0]"
 SPR_culture_index_5: "[?SPR_culture_opinion^4|Y0]"
 SPR_expand_the_huelva_copper_mine: "리오틴토 구리 사업 확장"
 SPR_expand_the_huelva_copper_mine_desc: "우엘바에 위치한 리오틴토 구리 사업은 스페인 전체에서 가장 큰 광산 가운데 하나입니다. 연간 900만 미터톤이 넘는 양을 생산하며 그 대부분은 2만 톤이 넘는 구리입니다. 이 사업을 확장하면 우리가 자급자족하고 외국 자원 수입에 의존하지 않는 입지를 더욱 굳힐 수 있습니다."
 SPR_expand_the_los_santos_mine: "로스산토스 광산 확장"
 SPR_expand_the_los_santos_mine_desc: "스페인에서 가장 큰 텅스텐 광산 가운데 하나인 로스산토스 광산은 추가 텅스텐을 캐낼 수 있는 가장 수익성 높은 장소 가운데 하나였습니다. 새로운 방법으로 더 깊이 파면 추가 매장량을 개발하고 자급자족 역량을 한층 확대할 수 있을 것입니다."
 SPR_exploit_the_mediterranean_province: "스페인 지중해 보크사이트 지대 확장"
 SPR_exploit_the_mediterranean_province_desc: "지중해 보크사이트 지대는 세계에서 가장 큰 고품질 보크사이트 광석 매장지 가운데 하나입니다. 위대한 우리나라의 국경 안에도 이러한 매장량의 일부가 있으며, 경제 발전에 도움이 되도록 이 보크사이트 매장량을 개발하기 시작하는 것이 우리에게 최선입니다."
 SPR_expand_the_high_speed_rail_network: "고속철도망 확장"
 SPR_expand_the_high_speed_rail_network_desc: "우리나라의 낡고 시대에 뒤떨어진 철도망을 현대화해야 합니다. 그렇게 하지 못한다면 우리는 결코 진정으로 가능한 최고의 스페인이 될 수 없을 것입니다."
 SPR_establish_seville_cordoba_line: "세비야-코르도바 노선 확장"
 SPR_establish_seville_cordoba_line_desc: "세비야와 코르도바는 안달루시아 영토에서 가장 중요한 도시들입니다. 이 두 핵심 도시 사이의 철도를 확장하면 이 지역과 두 도시의 경제에 막대한 이익이 될 수 있습니다."
 SPR_establish_high_speed_madrid_to_toledo: "마드리드-톨레도 노선"
 SPR_establish_high_speed_madrid_to_toledo_desc: "고속철도망을 마드리드-톨레도까지 확장하면 우리나라 중부 지대의 경제 성장이 더욱 보장될 것입니다."
 SPR_establish_the_malaga_madrid_high_speed: "말라가-마드리드 노선"
 SPR_establish_the_malaga_madrid_high_speed_desc: "안달루시아를 더 빠른 철도로 나라 중부와 연결하면 안달루시아 국민과의 통합이 한층 진전될 수 있습니다."
 SPR_establish_the_madrid_to_valencia: "마드리드-발렌시아 노선 확장"
 SPR_establish_the_madrid_to_valencia_desc: "마드리드를 해안 도시 발렌시아와 연결하면 두 도시의 관계가 더욱 공고해지고 나라 중앙의 물자를 해안 항구 도시로 운반할 수 있습니다."
 SPR_establish_the_zaragoza_to_bilbao_high_speed_lines: "사라고사-빌바오 고속 노선"
 SPR_establish_the_zaragoza_to_bilbao_high_speed_lines_desc: ""
 SPR_the_northern_corridors: "북부 회랑"
 SPR_the_northern_corridors_desc: ""
 SPR_the_eastern_corridor: "동부 회랑"
 SPR_the_eastern_corridor_desc: ""
 SPR_the_french_pyrenees_line: "프랑스 피레네 노선"
 SPR_the_french_pyrenees_line_desc: ""
 SPR_oil_independence: "석유 독립"
 SPR_oil_independence_desc: "우리 석유 매장량 대부분이 개발되지 않은 채 남아 있어 우리나라는 외세의 영향에 취약합니다. 주권을 지키기 위해 석유 독립을 이루어야 합니다."
 SPR_nhindustries_desc: "NH인더스트리와 거래하면 최신 최고 성능의 헬리콥터를 확보하는 데 추가적인 이점을 얻을 수 있습니다."
 spain.24.t: "카나리아 제도 주민들의 지지"
 spain.24.d: "카나리아 제도 전역의 영향력 있는 인사와 단체가 중앙 정부에 대한 지지를 표명했습니다. 우리는 호의에 보답하여 이들에게 추가 자원을 제공할 수 있습니다."
 spain.24.a: "받을 수 있는 건 받아 두겠습니다"
 spain.24.b: "우리를 지지하는 이들을 지원한다"
 spain.25.t: "카나리아 제도의 시위"
 spain.25.d: "카나리아 제도 전역에서 대규모 시위가 일어났습니다. 라스팔마스와 산타크루스의 군중이 더 큰 자치 또는 독립을 요구하고 있어, 시위가 저절로 가라앉도록 둘 것인지 개입할 것인지 결정해야 합니다."
 spain.25.a: "속에 쌓인 것을 풀게 두자"
 spain.26.t: "카나리아 주민 폭동"
 spain.26.d: "카나리아 제도의 시위가 극단주의 세력과 기회주의자들에 의해 대규모 폭동으로 변질되며 파괴적으로 번졌습니다. 도시의 혼란 속에서 우리는 통제를 완화하거나, 폭도를 해산시키기 위해 특수 진압 부대를 투입해야 합니다."
 spain.26.a: "속에 쌓인 것을 풀게 두자"
 spain.26.b: "진압 경찰 투입"
 spain.27.t: "카나리아 제도에서의 경찰과의 충돌"
 spain.27.d: "카나리아 제도의 폭도들이 경찰의 투입에 폭력으로 맞섰습니다. 폭도들이 도시에 평화를 되찾으려는 경찰의 시도에 맞서 즉석 무기를 동원하면서 라스팔마스는 전쟁터처럼 보입니다. 도시에 광범위한 피해가 발생했으며 여러 명의 사망자가 보고되었습니다."
 spain.27.a: "잔해를 수습한다"
 SPR_canarios_opinion_above_20_tt: "[CNR.GetFlag] 카나리오스 관계 §Y20%§! 초과 (현재 관계: [?SPR.SPR_culture_opinion^4|Y%%0])"
 SPR_ban_andalusian: "안달루시아어 금지"
 SPR_ban_andalusian_desc: "안달루시아어는 진정한 스페인어의 사생아 방언에 불과합니다. 금지하십시오!"
 SPR_andalusian_compromise: "안달루시아 타협"
 SPR_andalusian_compromise_desc: "정부에 연대와 평화를 가져오기 위해 안달루시아인과 타협하는 것은 모두에게 이익을 줄 뿐입니다."
 SPR_adopt_andalusian: "안달루시아어 수용"
 SPR_adopt_andalusian_desc: "안달루시아어와 문화를 공식 체계 안으로 들이면 우리에게 큰 번영을 가져다줄 것입니다."
 SPR_andalusian_assimilation: "안달루시아 동화"
 SPR_andalusian_assimilation_desc: "안달루시아 문화는 활기차고 아름답습니다. 그들의 문화를 동화하고 그들이 지역의 틀을 넘어설 수 있도록 허용하는 것은 우리 국민 전체에게 이익을 줄 뿐입니다."
 SPR_andalusian_mines: "안달루시아 광산"
 SPR_andalusian_mines_desc: "안달루시아 지방에는 철광 지대와 귀금속이 넓게 분포합니다. 매장량은 해안 구릉 지대 근처에 집중되어 있어 개발이 다소 더 어렵습니다. 그럼에도 이 지역의 자원을 채굴하면 우리나라에서 더 가난한 이 지역이 더 번영할 수 있을 것입니다."
 SPR_andalusia_revolt_against_spain_mission: "[93.GetName]에서 임박한 §Y[SPA.GetFlag][SPA.GetAdjective]§! 반란"
 SPR_andalusia_revolt_against_spain_mission_desc: "안달루시아 주민들이 우리 정부에 맞서 싸우는 분리주의 세포를 지지하기 위해 떼를 지어 줄을 서고 있습니다. 이에 신속히 대응해야 합니다."
 SPR_revoke_andalusian_citizenship_decision: "§Y[SPA.GetFlag][SPA.GetAdjective]§! 시민권 박탈"
 SPR_revoke_andalusian_citizenship_decision_desc: "안달루시아인의 시민권을 박탈하면 이러한 민족주의가 어느 정도 가라앉을 것입니다. 허튼소리를 포기한다면 스페인 시민권을 되돌려줄 수 있습니다."
 SPR_andalusian_targeted_subsidies_decision: "§Y[SPA.GetFlag][SPA.GetAdjective]§! 맞춤형 보조금"
 SPR_andalusian_targeted_subsidies_decision_desc: "안달루시아 주민을 대상으로 한 지역 맞춤형 보조금을 준비하면 주민들의 일시적인 호의를 얻을 수 있습니다."
 SPR_andalusia_opinion_above_20_tt: "[SPA.GetFlag] 안달루세스(안달루시아인) 관계 §Y20%§! 초과 (현재 관계: [?SPR.SPR_culture_opinion^3|Y%%0])"
