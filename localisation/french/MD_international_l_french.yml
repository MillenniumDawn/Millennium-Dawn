 un_sc_volunteers_tt: "Les nations en guerre peuvent recevoir des forces de volontaires d'autres nations. Le §YConseil de sécurité§! peut restreindre l'envoi de nouvelles forces de volontaires, établissant des §Rsanctions§! sur les nations qui envoient des volontaires vers la nation restreinte après l'adoption de la résolution."
