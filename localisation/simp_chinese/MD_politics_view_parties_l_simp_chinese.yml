 SOV.socialism_dem: "£SOV_democratic_soyus (DU)民主联盟"
 SOV.socialism_dem_icon: "£SOV_democratic_soyus"
 SOV.socialism_dem_desc: "（激进自由主义）民主联盟\n\n民主联盟是历史最悠久的政治组织，由苏联异见人士和人权活动家于1988年创立。该联盟主张政治制度民主化、去共产主义化、和平主义，反对独裁主义。"
 SOV.Neutral_Communism_alt: "£SOV_kpss (CPSU) 苏联共产党 - §g强硬派§!"
 SOV.Neutral_Communism_alt_icon: "£SOV_kpss"
 SOV.Neutral_Communism_alt_desc: "（马克思列宁主义）苏联共产党\n\n苏共是苏联的执政党，进入21世纪后重新崛起的苏共，依然坚持马克思列宁主义和民主集中制。"
 SOV.Nat_Populism_alt: "£SOV_ldpss (LDPSS) 苏联自由民主党"
 SOV.Nat_Populism_alt_icon: "£SOV_ldpss"
 SOV.Nat_Populism_alt_desc: "（民族民粹主义）苏联自由民主党\n\n苏联自由民主党既不是自由党，也不是民主党，而是寻求一个在威权主义、民粹主义和民族主义下重生的大大扩张的俄罗斯帝国。"
 SOV.Nat_Autocracy_alt: "£SOV_comm_military_junta (AFSU) 苏联武装部队"
 SOV.Nat_Autocracy_alt_icon: "£SOV_comm_military_junta"
 SOV.Nat_Autocracy_alt_desc: "（社会主义军政府）苏联武装力量\n\n苏联武装力量的建立是为了捍卫共产主义思想、保护领土完整和主权并根据国际条约履行任务。"
 SOV.Nat_Autocracy_alty: "£SOV_nationalist_military_junta_alt (CPU)概念党‘联合’"
 SOV.Nat_Autocracy_alty_icon: "£SOV_nationalist_military_junta_alt"
 SOV.Nat_Autocracy_alty_desc: "（公共安全概念。死水）概念党‘联合’\n\n联合党是一个概念新颖的政党，它拒绝所有古典政治思想以及对整个宇宙的古典理解，称其为预言者修正者创造的虚构，其目标是通过世界观、时间顺序、意识形态、经济战争工具、种族灭绝武器和毁灭性武器来控制世界。该党主张与预言者修正者作斗争，寻找并摧毁它。"
 JAP.conservatism_icon: "£JAP_conservatism"
 JAP.Neutral_Communism_icon: "£JAP_Communist_State"
 CRO.Conservative_croatia: "£SER_conservatism_croatia (SDS) 塞尔维亚民主党"
 CRO.Conservative_croatia_icon: "£SER_conservatism_croatia"
 CRO.Conservative_croatia_desc: "（塞尔维亚民族主义） - 该政党于1995年南斯拉夫内战末期正式解散，但名义上仍以零散形式存在 - 主要流亡海外。其大部分领导层因各类战争罪和侵犯人权行为被通缉。该组织曾领导克罗地亚境内亲塞尔维亚的分离主义政权“塞尔维亚克拉伊纳共和国”，此前作为广泛代表克罗地亚境内塞尔维亚族利益的政治党派活跃于政坛。"
 ISR.liberalism_alt: "£ISR_liberalism_alt2 (Shinui) - 改变"
 ISR.liberalism_alt_desc: "(世俗自由主义) - 改变\n\n改变党由学者和商界人士于1974年赎罪日战争后创立，并由阿姆农·鲁宾斯坦领导了二十年。1999年，电视主持人汤米·拉皮德接任该党主席，并将其重新定位为一个世俗、自由市场、反教权主义的运动，反对哈雷迪派在政府中的影响力。2003年，改变党赢得15个议席，成为第三大党，并加入阿里埃勒·沙龙的联合政府，负责内政和司法事务。2006年，改变党领导层发生分裂，11名议员离任；该党当年仅获得0.16%的选票，此后再未重返议会。"
 ISR.liberalism_alt_icon: "£ISR_liberalism_alt2"
 ISR.liberalism_alt3: "£ISR_liberalism_alt3 (Yesh Atid) - 拥有未来"
 ISR.liberalism_alt3_desc: "(自由中间主义) - 拥有未来\n\n拥有未来党是新希望党领导人汤米·拉皮德之子，曾任电视记者。他于2012年4月29日创立了拥有未来党，其政纲包括廉洁政府、全民兵役制以及政教分离。该党在2013年首次参选便赢得19个席位，并执掌财政部。2019年和2020年，拥有未来党以蓝白联盟成员身份参选。2021年，该党领导变革联盟，成功推翻了本雅明·内塔尼亚胡的总理职位，拉皮德本人也于2022年7月至12月担任总理。2022年，未来党赢得24个席位，创下历史最佳战绩，成为最大的反对党。"
 ISR.liberalism_alt3_icon: "£ISR_liberalism_alt3"
 ISR.liberalism_alt4: "£ISR_liberalism_alt4 (Hosen LeYisrael) - 以色列韧性党"
 ISR.liberalism_alt4_desc: "(自由犹太复国主义) - 以色列韧性党\n\n本尼·甘茨曾于2011年至2015年担任以色列总参谋长，他于2018年12月27日创立了以色列韧性党，该党是一个中间派、自由主义的犹太复国主义政党，旨在挑战本雅明·内塔尼亚胡。2019年4月，该党成为蓝白联盟的核心力量，与利库德集团并列获得35个席位。2020年3月，甘茨率领其派系加入内塔尼亚胡的联合政府，该党保留了蓝白联盟的名称，并在2022年成为全国团结名单的骨干力量。"
 ISR.liberalism_alt4_icon: "£ISR_liberalism_alt4"
 ISR.liberalism_alt5: "£ISR_liberalism_alt5 (Kahol Lavan) - 蓝与白"
 ISR.liberalism_alt5_desc: "(自由犹太复国主义) - 蓝与白\n\n蓝白联盟于2019年2月21日由本尼·甘茨的以色列韧性党、亚伊尔·拉皮德的“拥有未来党”和摩西·亚阿隆的“民族国家运动党”组成，旨在推翻本雅明·内塔尼亚胡。作为一个中间派、自由主义的犹太复国主义联盟，蓝白联盟在2019年4月赢得了35个席位，并在2019年9月和2020年3月的选举中分别赢得了33个席位，但未能组建政府。2020年3月29日，甘茨同意与利库德集团轮流执政，而拉皮德和亚阿隆则继续留在反对派，蓝白联盟就此解散。"
 ISR.liberalism_alt5_icon: "£ISR_liberalism_alt5"
 ISR.liberalism_alt6: "£ISR_liberalism_alt6 (HaMahane HaMamlakhti) - 国家团结党"
 ISR.liberalism_alt6_desc: "(自由中间主义) - 国家团结党\n\n家团结党于2022年8月14日由本尼·甘茨的蓝白党、吉迪恩·萨尔的新希望党以及前总参谋长加迪·艾森科特和马坦·卡哈纳组建而成。该党在2022年大选中赢得12个席位，并在加沙战争爆发前一直处于反对党地位。2023年10月，甘茨和艾森科特加入战时内阁。新希望党于2024年3月退出政府，其余成员于2024年6月9日退出政府。艾森科特和卡哈纳离任后，该党于2025年7月7日恢复原名蓝白党。"
