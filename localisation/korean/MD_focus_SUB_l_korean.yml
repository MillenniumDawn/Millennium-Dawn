 CHE_Strengthen_com_partys_agendaz_arm: "아르메니아의 정치 노선 비판"
 CHE_Financing_of_protest_movementsz_arm: "시위 주도권 장악"
 CHE_Establish_connectionsz_arm: "아르메니아의 옛 유대 복원"
 CHE_we_are_at_war: "우리는 전쟁중이다!"
 CHE_we_are_at_war_desc: "우리는 우리 국가 자체의 존립을 위한 전쟁에 직면해 있으며, 우리는 그것을 구하기 위해 온 힘을 다해야 합니다."
 CHE_call_for_volunteers: "자원봉사자 모집"
 CHE_call_for_volunteers_desc: "다양한 국가의 많은 자원봉사자들이 자유를 향한 우리의 투쟁을 돕기 위해 우리에게 모여듭니다!"
 CHE_gain_support_from_saudis: "사우디의 도움"
 CHE_gain_support_from_saudis_desc: "아랍 군주국들은 우리에게 재정 지원을 제공할 준비가 되어 있습니다."
 CHE_gain_support_from_qatar: "카타르로부터의 도움"
 CHE_gain_support_from_qatar_desc: "카타르 역시 우리의 투쟁에 재정적인 지원을 제공할 준비가 되어 있습니다."
 CHE_raid_ingush_bases: "인구셰티야 기지 습격"
 CHE_raid_ingush_bases_desc: "우리는 더 많은 장비가 필요합니다. 인구셰티야의 러시아군 기지는 우리에게 완벽하게 맞을 것입니다."
 CHE_smuggle_guns_from_aze: "아제르바이잔 지원"
 CHE_smuggle_guns_from_aze_desc: "아제르바이잔의 친절한 사람들이 우리에게 장비를 보내주었습니다."
 CHE_smuggle_guns_from_geo: "조지아 지원"
 CHE_smuggle_guns_from_geo_desc: "조지아의 친절한 사람들이 우리에게 장비를 보내주었습니다."
 CHE_invite_grey_wolves: "\"회색 늑대들\" 초대"
 CHE_invite_grey_wolves_desc: "우리는 아무 도움에 의지해야 합니다."
 CHE_last_defense: "마지막 개척지"
 CHE_last_defense_desc: "우리는 승리할 희망이 없습니다. 하지만 우리는 끝까지 싸우고, 함께 뭉치고 과거의 차이를 거부할 것입니다."
 CHE_propose_peace_to_rus: "평화 조약"
 CHE_propose_peace_to_rus_desc: "이 전쟁은 양측 모두를 지치게 했습니다. 어쩌면 평화를 이룰 때가 된 것 같습니다."
 CHE_uprise_in_dagestan: "다게스탄에서 반란을 일으키다"
 CHE_uprise_in_dagestan_desc: "우리는 다게스탄에 전사들을 데려올 수 있었고, 그곳에서 반란을 일으킬 준비가 되었습니다."
 CHE_ahmat_start: "아흐마트 카디로프"
 CHE_ahmat_start_desc: "우리 공화국의 구세주, 체첸의 영웅, 국가의 국부께서 바로 우리 나라를 밝은 미래로 이끌어 주실 분입니다."
 CHE_ahmat_anti_vahhab: "와하비즘에 맞서 싸우다"
 CHE_ahmat_anti_vahhab_desc: "우리는 우리 선조들의 실수를 반복하지 않을 것이며 와하비즘의 가르침이 우리나라에 영향을 미치는 것을 허용하지 않을 것입니다."
 CHE_ahmat_social_med: "의학 분야의 회복"
 CHE_ahmat_social_med_desc: "전쟁은 의학을 포함해 삶의 모든 영역을 파괴했습니다. 이제 이를 되살릴 때가 되었습니다."
 CHE_ahmat_political: "정치권력 강화"
 CHE_ahmat_political_desc: "강력한 공화국에는 강력한 정부가 있어야 합니다."
 CHE_ahmat_infra: "인프라 복구"
 CHE_ahmat_infra_desc: "전쟁으로 인해 공화국의 모든 인프라가 파괴되었습니다. 우리는 이를 복원해야 합니다."
 CHE_ahmat_economic: "경제 회생"
 CHE_ahmat_economic_desc: "마침내 10년 뒤, 우리는 우리 공화국의 경제 성장을 보게 될 것입니다."
 CHE_ahmat_new_chechnya: "새로운 체첸"
 CHE_ahmat_new_chechnya_desc: "우리의 안정, 우리의 부활, 우리 자신과 러시아에 대한 우리의 충성심은 모스크바에서 분명히 무시되지 않았으며, 현재 방향을 지속하는 데 적극적으로 기여하고 있습니다."
 CHE_ask_qatar_for_invest: "카타르 투자자 초청"
 CHE_ask_qatar_for_invest_desc: "우리 경제에 자금을 댈 준비가 된 카타르 투자자들을 초청할 것입니다."
 CHE_saudi_aid_for_mosques: "사우디 투자"
 CHE_saudi_aid_for_mosques_desc: "사우디 군주국들은 오래전부터 우리 공화국에 관심을 보여 왔으며, 어쩌면 우리에게 자금을 지원할 준비가 되어 있을지도 모릅니다."
 CHE_reviving_industrial_basis: "과거 산업의 부흥"
 CHE_reviving_industrial_basis_desc: "우리 산업은 수년간 완전히 파괴되었으며, 최소한 90년대 수준으로 부분적으로나마 되돌리려면 노력을 기울여야 합니다."
 CHE_georgia_black_market: "조지아 암시장"
 CHE_georgia_black_market_desc: "조지아 영토를 통해 불법 무역을 시작할 것입니다."
 CHE_black_trade_link_to_arm: "아르메니아 암시장"
