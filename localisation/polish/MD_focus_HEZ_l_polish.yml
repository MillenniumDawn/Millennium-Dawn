 HEZ_Asymmetric_Warfare: "Asymmetric Warfare"
 HEZ_Asymmetric_Warfare_desc: "Our strength has never come from matching our enemies tank for tank or aircraft for aircraft. Through disciplined fighters, decentralized command, concealment, and the effective use of the terrain, we can turn every village and every hill into a battlefield. By perfecting the art of asymmetric warfare, even the most technologically advanced armies will struggle to defeat the Resistance."
 HEZ_The_Underground_Networks: "The Underground Networks"
 HEZ_The_Underground_Networks_desc: "Our enemies rely on overwhelming firepower to cripple our command structure and industry. By dispersing our factories, supply depots, command centers, and military assets into a vast underground network, we can ensure the Resistance continues to fight even under the heaviest bombardment. The more difficult we are to find, the harder we are to defeat."
 HEZ_al_manar_desc: "Al-Manar is Hezbollah's TV, used to project its views and announcements worldwide.\n§YNations can weaken its effects by jamming its broadcasts through their decisions.§!"
 HEZ_weaken_the_al_manar: "Weakening the Al-Manar"
 HEZ_weaken_the_al_manar_desc: "The Al-Manar TV has long served as one of Hezbollah's most influential media platforms, shaping public opinion through television broadcasts, online content, and regional satellite networks. By restricting its access to major broadcasting services, disrupting its distribution channels, and coordinating information campaigns, the government can reduce its reach and limit its effectiveness as a tool of political influence."
