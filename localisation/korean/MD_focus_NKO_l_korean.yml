 NKO_spa_chain_industry_tt: "§G당 진행 보고서 제출: §!§Y+1§!§G.§!\n§Y[?NKO_spa_chain_industry|0]§!§G / 이 권한 위임에 대해 보고서 1건 제출. 첫 번째 보고서는 일회성 후속 사건을 열며 §!§Y25%§!§G 확률로 추가 횡재를 가져옵니다. 이후에도 권한 위임은 계속 사용할 수 있습니다.§!"
 NKO_spa_chain_production_tt: "§G당 진행 보고서 제출: §!§Y+1§!§G.§!\n§Y[?NKO_spa_chain_production|0]§!§G / 이 권한 위임에 대해 보고서 1건 제출. 첫 번째 보고서는 일회성 후속 사건을 열며 §!§Y25%§!§G 확률로 추가 횡재를 가져옵니다. 이후에도 권한 위임은 계속 사용할 수 있습니다.§!"
 NKO_spa_chain_military_tt: "§G당 진행 보고서 제출: §!§Y+1§!§G.§!\n§Y[?NKO_spa_chain_military|0]§!§G / 이 권한 위임에 대해 보고서 1건 제출. 첫 번째 보고서는 일회성 후속 사건을 열며 §!§Y25%§!§G 확률로 추가 횡재를 가져옵니다. 이후에도 권한 위임은 계속 사용할 수 있습니다.§!"
 NKO_spa_chain_economy_tt: "§G당 진행 보고서 제출: §!§Y+1§!§G.§!\n§Y[?NKO_spa_chain_economy|0]§!§G / 이 권한 위임에 대해 보고서 1건 제출. 첫 번째 보고서는 일회성 후속 사건을 엽니다. 이 권한 위임을 채택할 때마다 §!§Y25%§!§G 확률로 광물이 발견됩니다. 이후에도 권한 위임은 계속 사용할 수 있습니다.§!"
 NKO_spa_chain_research_tt: "§G당 진행 보고서 제출: §!§Y+1§!§G.§!\n§Y[?NKO_spa_chain_research|0]§!§G / 이 권한 위임에 대해 보고서 1건 제출. 첫 번째 보고서는 일회성 후속 사건을 열며 §!§Y25%§!§G 확률로 추가 횡재를 가져옵니다. 이후에도 권한 위임은 계속 사용할 수 있습니다.§!"
 NKO_spa_chain_agriculture_tt: "§G당 진행 보고서 제출: §!§Y+1§!§G.§!\n§Y[?NKO_spa_chain_agriculture|0]§!§G / 이 권한 위임에 대해 보고서 1건 제출. 첫 번째 보고서는 일회성 후속 사건을 열며 §!§Y25%§!§G 확률로 추가 횡재를 가져옵니다. 이후에도 권한 위임은 계속 사용할 수 있습니다.§!"
 NKO_spa_chain_foreign_tt: "§G당 진행 보고서 제출: §!§Y+1§!§G.§!\n§Y[?NKO_spa_chain_foreign|0]§!§G / 이 권한 위임에 대해 보고서 1건 제출. 첫 번째 보고서는 일회성 후속 사건을 열며 §!§Y25%§!§G 확률로 추가 횡재를 가져옵니다. 이후에도 권한 위임은 계속 사용할 수 있습니다.§!"
 NKO_spa_chain_construction_tt: "§G당 진행 보고서 제출: §!§Y+1§!§G.§!\n§Y[?NKO_spa_chain_construction|0]§!§G / 이 권한 위임에 대해 보고서 1건 제출. 첫 번째 보고서는 평양에 70억 달러 규모의 일회성 4단계 레이더 사업을 제안하고 일회성 후속 사건을 엽니다. 또한 §!§Y25%§!§G 확률로 추가 횡재를 가져옵니다. 이후에도 권한 위임은 계속 사용할 수 있습니다.§!"
 NKO_spa_chain_exhausted_tt: "§Y일회성 보고서가 완료되었습니다. 이 권한 위임은 여전히 일반적인 혜택을 제공하지만, 더 이상의 후속 사건이나 횡재는 없습니다.§!"
