 TAJ_adds_tajik_drugs_TT: "（§H[SOV.GetNameWithFlag]§!）動的修正子を獲得：§Hタジク麻薬§!\n\n我々は[SOV.GetFlag]§Hロシア§!市場に入る§H麻薬§!の量を増減させて、彼らに対する影響力を得ることができる。"
