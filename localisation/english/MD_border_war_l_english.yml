 border_war_training_failure.1.t: "Training Accident"
 border_war_training_failure.1.d: "An accident during field exercises has left several soldiers wounded and raised questions about operational safety."
 border_war_training_failure.1.a: "Review the exercise"
 border_war_training_failure.2.t: "Combined Arms Accident"
 border_war_training_failure.2.d: "A collision during combined arms training damaged equipment and injured several soldiers."
 border_war_training_failure.2.a: "Suspend the drill"
 border_war_tension_failure.1.t: "Border Action Repulsed"
 border_war_tension_failure.1.d: "Rival forces answered the latest provocation with accurate fire, costing lives and disrupting local preparations."
 border_war_tension_failure.1.a: "Pull back"
 border_war_operation_blocked.1.t: "Operation Canceled"
 border_war_operation_blocked.1.d: "Ownership, control, troop presence, or diplomatic conditions changed before preparations finished. The operation has been canceled without spending progress."
 border_war_operation_blocked.1.a: "Understood"

 border_war_outcome.1.t: "Successful Push"
 border_war_outcome.1.d: "Our forces prevailed in the latest clash and gained momentum toward their local objective."
 border_war_outcome.1.a: "Consolidate the position"
 border_war_outcome.2.t: "Operation Repulsed"
 border_war_outcome.2.d: "Rival forces repelled the attack and reduced our momentum around the contested state."
 border_war_outcome.2.a: "Reassess the plan"
 border_war_outcome.3.t: "Stalemate on the Frontier"
 border_war_outcome.3.d: "The clash ended without a decisive result, costing some of our local momentum."
 border_war_outcome.3.a: "Hold the line"

 pak_raj_border_claim.1.t: "A Territorial Demand"
 pak_raj_border_claim.1.d_420: "[FROM.GetNameDefCap] has used repeated local victories to demand Azad Kashmir. Concession would transfer the state and lower tension. Refusal would open a broader crisis."
 pak_raj_border_claim.1.d_427: "[FROM.GetNameDefCap] has used repeated local victories to demand Jammu and Kashmir. Concession would transfer the state and lower tension. Refusal would open a broader crisis."
 pak_raj_border_claim.1.d_429: "[FROM.GetNameDefCap] has used repeated local victories to demand Eastern Punjab. Concession would transfer the state and lower tension. Refusal would open a broader crisis."
 pak_raj_border_claim.1.d_563: "[FROM.GetNameDefCap] has used repeated local victories to demand Central Punjab. Concession would transfer the state and lower tension. Refusal would open a broader crisis."
 pak_raj_border_claim.1.d_573: "[FROM.GetNameDefCap] has used repeated local victories to demand Southern Punjab. Concession would transfer the state and lower tension. Refusal would open a broader crisis."
 pak_raj_border_claim.1.d_426: "[FROM.GetNameDefCap] has used repeated local victories to demand Sindh. Concession would transfer the state and lower tension. Refusal would open a broader crisis."
 pak_raj_border_claim.1.d_987: "[FROM.GetNameDefCap] has used repeated local victories to demand West Gujarat. Concession would transfer the state and lower tension. Refusal would open a broader crisis."
 pak_raj_border_claim.1.d_984: "[FROM.GetNameDefCap] has used repeated local victories to demand West Rajasthan. Concession would transfer the state and lower tension. Refusal would open a broader crisis."
 pak_raj_border_claim.1.a: "Concede the disputed state"
 pak_raj_border_claim.1.b: "Reject the claim"

 pak_raj_border_crisis.1.t: "Border Crisis Erupts"
 pak_raj_border_crisis.1.d: "Our rejected territorial claim has hardened into a diplomatic and military crisis. Mobilization could force concessions, but it also narrows the path back."
 pak_raj_border_crisis.1.a: "Mobilize the frontier"
 pak_raj_border_crisis.1.b: "Stand down quietly"
 pak_raj_border_crisis.2.t: "The Rival Mobilizes"
 pak_raj_border_crisis.2.d: "Rival forces are moving toward the frontier. We can counter-mobilize or seek talks before the crisis becomes harder to contain."
 pak_raj_border_crisis.2.a: "Counter-mobilize"
 pak_raj_border_crisis.2.b: "Seek immediate talks"
 pak_raj_border_crisis.3.t: "A Territorial Ultimatum"
 pak_raj_border_crisis.3.d_420: "[FROM.GetNameDefCap] demands Azad Kashmir and threatens a limited war if we refuse."
 pak_raj_border_crisis.3.d_427: "[FROM.GetNameDefCap] demands Jammu and Kashmir and threatens a limited war if we refuse."
 pak_raj_border_crisis.3.d_429: "[FROM.GetNameDefCap] demands Eastern Punjab and threatens a limited war if we refuse."
 pak_raj_border_crisis.3.d_563: "[FROM.GetNameDefCap] demands Central Punjab and threatens a limited war if we refuse."
 pak_raj_border_crisis.3.d_573: "[FROM.GetNameDefCap] demands Southern Punjab and threatens a limited war if we refuse."
 pak_raj_border_crisis.3.d_426: "[FROM.GetNameDefCap] demands Sindh and threatens a limited war if we refuse."
 pak_raj_border_crisis.3.d_987: "[FROM.GetNameDefCap] demands West Gujarat and threatens a limited war if we refuse."
 pak_raj_border_crisis.3.d_984: "[FROM.GetNameDefCap] demands West Rajasthan and threatens a limited war if we refuse."
 pak_raj_border_crisis.3.a: "Accept and withdraw"
 pak_raj_border_crisis.3.b: "Reject the ultimatum"
 pak_raj_border_crisis.4.t: "Ultimatum Rejected"
 pak_raj_border_crisis.4.d: "The rival has refused our demand. We must either enforce the claim against the disputed state or absorb the political cost of backing down."
 pak_raj_border_crisis.4.a: "Force the issue"
 pak_raj_border_crisis.4.b: "Back down"
 pak_raj_border_crisis.5.t: "A Nuclear Signal"
 pak_raj_border_crisis.5.d: "Military planners propose a visible change in nuclear readiness to demonstrate resolve. Restraint would lower tensions but could be read as weakness."
 pak_raj_border_crisis.5.a: "Raise nuclear readiness"
 pak_raj_border_crisis.5.b: "Maintain restraint"
 pak_raj_border_crisis.6.t: "The Rival Signals Readiness"
 pak_raj_border_crisis.6.d: "The rival has visibly raised nuclear readiness. Matching the posture would create a nuclear standoff, while restraint would reduce immediate tension."
 pak_raj_border_crisis.6.a: "Respond in kind"
 pak_raj_border_crisis.6.b: "De-escalate unilaterally"
 pak_raj_border_crisis.7.t: "A Request for Mediation"
 pak_raj_border_crisis.7.d: "The Indo-Pakistani crisis is threatening regional stability. American diplomats can offer a channel for a negotiated climbdown."
 pak_raj_border_crisis.7.a: "Offer mediation"
 pak_raj_border_crisis.7.b: "Stay out of it"
 pak_raj_border_crisis.8.t: "American Mediation"
 pak_raj_border_crisis.8.d: "The United States has offered to broker a mutual climbdown. Acceptance would end the crisis and lower bilateral tension."
 pak_raj_border_crisis.8.a: "Accept mediation"
 pak_raj_border_crisis.8.b: "Reject outside interference"
 pak_raj_border_crisis.9.t: "The Crisis Passes"
 pak_raj_border_crisis.9.d: "The immediate confrontation has ended without open war. Forces along the frontier are returning to routine readiness."
 pak_raj_border_crisis.9.a: "Acknowledged"
 pak_raj_border_crisis.10.t: "A Diplomatic Victory"
 pak_raj_border_crisis.10.d: "The rival conceded the disputed state. The confrontation has ended on our terms."
 pak_raj_border_crisis.10.a: "Consolidate the victory"
 pak_raj_border_crisis.11.t: "The Claim Has Lapsed"
 pak_raj_border_crisis.11.d: "Control of the disputed state changed before the crisis could be resolved. The territorial demand is no longer valid."
 pak_raj_border_crisis.11.a: "Close the file"

