 ENG_royal_armed_forces_review: "왕립군 검토"
 ENG_royal_armed_forces_review_desc: "왕실의 군대는 의례적 위신 이상의 것을 누릴 자격이 있습니다. 3군 전체의 교리, 훈련 기준, 준비 태세에 대한 체계적인 검토를 통해 왕립 군대를 군주제에 걸맞은 신뢰할 만한 전투력으로 재건할 것입니다."
 ENG_household_division_revival: "근위 사단의 부활"
 ENG_household_division_revival_desc: "근위 사단은 오랫동안 영국 육군의 선봉이었습니다. 그 전통을 되살리고 역할을 확대하면 질, 규율, 단결심에서 일반 병력과 구별되는 정예 핵심 병력을 되찾게 됩니다."
 ENG_jewel_of_the_admiralty: "해군성의 보석"
 ENG_jewel_of_the_admiralty_desc: "영국 해군은 영국 전력 투사의 가장 오래된 상징입니다. 주력함에 재투자하고, 작전 범위를 넓히며, 조직 문화를 재건함으로써 브리타니아가 여전히 바다를 지배하고 있음을 세계에 알립니다."
 ENG_wings_of_the_crown: "왕실의 날개"
 ENG_wings_of_the_crown_desc: "영국 공군은 제1차 세계 대전의 시련 속에서 태어나 제2차 세계 대전에서 결정적인 역할을 했습니다. 조종사 훈련, 공중전 교리, 에이스 육성에 대한 새로운 투자는 제공권이 영국 방위의 초석으로 남도록 보장합니다."
 ENG_imperial_general_staff_restored: "제국 참모본부의 복원"
 ENG_imperial_general_staff_restored_desc: "제국 참모본부는 한때 세계적 제국 전역의 육해공 전력을 조율했습니다. 통합 합동 지휘 구조를 복원하면 군대가 단일한 전략적 비전 아래 놓여 그 합산 효율이 극대화됩니다."
 ENG_reservist_corps_act: "예비군단법"
 ENG_reservist_corps_act_desc: "영국의 예비군은 오랫동안 충분히 활용되지 못한 자산이었습니다. 새로운 예비군단법은 징집 목표를 공식화하고, 동원 절차를 가속하며, 예비 부대를 정규 육군 부대와 더욱 긴밀하게 연계합니다."
 ENG_global_anglosphere_initiative: "세계 앵글로스피어 구상"
 ENG_global_anglosphere_initiative_desc: "영어권 국가들은 공통 언어 이상의 것을 공유합니다. 법률 전통, 민주주의 제도, 수 세기에 걸쳐 형성된 역사적 유대가 그것입니다. 조율된 앵글로스피어 구상은 왕실에 이러한 유대를 심화하고 오타와에서 캔버라에 이르기까지 영국의 영향력을 강화할 외교적 발판을 제공합니다."
 ENG_crown_realm_status: "왕실 영연방 왕국"
 ENG_crown_realm_status_desc: "이 국가는 영국 군주를 국가 원수로 인정합니다. 이러한 헌법적 체제는 정치적 안정과 긴밀한 영연방 유대를 제공합니다."
 ENG_crown_realm_monthly_influence_tt: "월간 영국 영향력: §R+4%§!"
 ENG_crown_diplomatic_corps: "왕실 외교단"
 ENG_crown_diplomatic_corps_desc: "영국이 제공할 수 있는 최고의 외교 인재 중에서 선발된 전담 왕실 사절단이 외국 궁정과 수도에서 왕실의 이익을 직접 대변할 것입니다. 이들의 임무는 관계를 개선하고, 협상을 원활히 하며, 세계 구석구석에서 왕실의 목소리가 무게를 갖도록 하는 것입니다."
 ENG_royal_visits_abroad: "해외 왕실 방문"
 ENG_royal_visits_abroad_desc: "적절한 시기의 왕실 순방은 몇 달간의 조용한 외교로도 이루지 못하는 것을 이룰 수 있습니다. 군주가 해외에 직접 나서는 것은 의지를 나타내고, 호의를 낳으며, 정부와 국민 모두에게 오래 남는 인상을 남깁니다."
 ENG_pax_britannica_reborn: "되살아난 팍스 브리태니카"
 ENG_pax_britannica_reborn_desc: "19세기의 팍스 브리태니카는 해군 우위, 문화적 위신, 비견할 데 없는 외교적 영향력 위에 세워졌습니다. 군주제의 부활, 앵글로스피어의 재편, 세계적 관여에 대한 새로운 의지를 통해 영국은 현대판 팍스 브리태니카, 곧 영국의 힘과 목적이 뒷받침하는 안정의 시대를 복원할 수 있습니다."
 ENG_royal_visits.1.t: "왕실 순방"
 ENG_royal_visits.1.d: "군주의 고문들이 왕실 순방이 가장 큰 외교적 성과를 거둘 수 있는 지역의 후보 목록을 제시합니다. 이 선택에 따라 영국의 소프트 파워가 어디에 집중되고 어떤 정부가 왕실의 직접적인 관심을 받을지가 결정됩니다."
 ENG_royal_visits.1.a: "아프리카 순방"
 ENG_royal_visits.1.b: "남아시아 및 동남아시아 순방"
 ENG_royal_visits.1.c: "중동 순방"
 ENG_royal_visits.1.e: "라틴 아메리카 순방"
 ENG_crown_diplomatic_corps_idea: "왕실 외교단"
 ENG_crown_diplomatic_corps_idea_desc: "활동 중인 왕실 사절단이 해외에서 외국 정부와 개인적인 접촉을 유지하며 왕실의 외교 의제를 추진하고 있습니다. 이들의 존재는 관계 유지 비용을 줄이고 정치적 자본을 꾸준히 창출합니다."
 ENG_army_field_exercise: "연례 야전 훈련"
 ENG_army_field_exercise_desc: "영국 육군 여단들이 합동 병과 기량을 연마하고 준비 태세를 갖추기 위해 대규모 야전 훈련을 실시합니다."
 ENG_army_engineering_corps: "전투 공병 계획"
 ENG_army_engineering_corps_desc: "전투 공병 훈련과 장비에 대한 투자는 육군이 복잡한 지형에서 작전할 수 있는 능력을 향상시킵니다."
 ENG_armoured_tactics_programme: "기갑 전술 계획"
 ENG_armoured_tactics_programme_desc: "신형 장갑차량을 보병 및 포병과 통합하는 훈련은 현대 기갑전 교리를 한층 정교하게 다듬습니다."
 ENG_energy_transition_programme: "에너지 전환 계획"
 ENG_energy_transition_programme_desc: "저탄소 에너지로의 전환을 가속하는 범정부 전략은 국민의 신뢰와 산업 투자를 강화합니다."
 ENG_critical_materials_reserve: "핵심 물자 비축"
 ENG_critical_materials_reserve_desc: "정부가 뒷받침하는 핵심 산업 물자 비축분은 영국 제조업을 공급망 차질로부터 보호합니다."
 ENG_research_excellence_awards: "우수 연구 포상"
 ENG_research_excellence_awards_desc: "대학과 연구 기관을 대상으로 한 경쟁형 포상은 전자 및 디지털 기술의 발전을 이끕니다."
 ENG_case_by_case_intervention_desc: "더 큰 정부가 싫다는 이유만으로 공공의 중요한 사안에 발언할 수 있는 우리의 역량을 포기할 수는 없습니다. 오히려 각 사안을 개별적으로 살펴 더 나은 해결책을 향해 나아가야 합니다."
 ENG_the_wonga_coup: "웡가 명단"
 ENG_the_wonga_coup_desc: "적도 기니는 방대한 석유 매장량 위에 놓여 있으며, 마거릿 대처 전 총리의 아들 마크 대처를 비롯한 저명인사들을 포함한 영국 금융업자들은 $STATE_319$의 석유 우선권을 확보하고자 합니다. 테오도로 오비앙 응게마 음바소고는 고립된 처지에 있으며, 야당 지도자 세베로 모토 은사가 더 나은 대안으로 보입니다. 이를 달성하기 위해 공모자들은 용병을 이용하여 오비앙을 전복하고 모토를 대통령 자리에 앉히려 합니다.  "
 britain_md.40.t: "하라레 공항에서의 용병 구금"
 britain_md.40.d: "당국은 하라레 국제공항에서 중무장한 남성 집단을 구금했습니다. 이들은 공식적으로 콩고 민주공화국의 채굴 작업에 쓸 장비를 구매하는 경비 용역업체라고 주장하지만, 정보 보고서에 따르면 적도 기니 정부를 상대로 한 작전을 준비하고 있었을 가능성이 있습니다."
 britain_md.40.a: "계속 구금한다."
 britain_md.40.b: "조용히 석방한다"
 britain_md.41.t: "원가 쿠데타 실패"
 britain_md.41.d: "짐바브웨 당국은 사이먼 만이 이끄는 용병 혐의자 60여 명을 그들의 항공기가 하라레 국제공항에 착륙한 직후 체포했습니다. 당국은 이 집단이 적도 기니로 계속 이동하기 전에 군사 장비를 구매하려 했다고 주장합니다. 영국 금융업자들이 음모에 연루되었다는 의혹은 우리에게 망신으로 끝났습니다."
 britain_md.41.a: "불운한 결과입니다."
 britain_md.42.t: "원가 쿠데타 성공"
 britain_md.42.d: "작전이 성공했습니다. 테오도로 오비앙 응게마 음바소고 대통령이 전복되었고 야당 지도자 세베로 모토 은사가 스스로 새 정부의 수반임을 선언했습니다. 우리는 국제적인 비난에 직면했지만, 영국의 상업적 이익은 이제 아프리카에서 가장 석유가 풍부한 나라 중 하나에서 전례 없는 영향력을 누리고 있습니다."
 britain_md.42.a: "수익성 높은 투자입니다."
 britain_md.43.t: "외세의 음모 분쇄"
 britain_md.43.d: "당국은 외국 용병들이 정부를 전복하고 야당 인사 세베로 모토 은사를 대통령으로 옹립할 계획이었다는 보도를 확인했습니다. 짐바브웨에서의 체포 덕분에 이 음모는 우리 해안에 닿기도 전에 해체되었습니다."
 britain_md.43.a: "공화국은 건재하다"
 britain_md.44.t: "오비앙의 몰락"
 britain_md.44.d: "용병 부대와 야당 지지자들이 말라보와 기타 주요 정부 요직을 장악한 뒤 테오도로 오비앙 응게마 음바소고 대통령이 권좌에서 물러났습니다. 세베로 모토 은사가 새 과도 정부의 지도력을 맡았습니다."
 britain_md.44.a: "어머나"
 britain_md.45.t: "영국 자금을 받은 용병들의 적도 기니 정부 전복"
 britain_md.45.d: "용병 부대와 야당 지지자들이 말라보와 기타 주요 정부 요직을 장악한 뒤 테오도로 오비앙 응게마 음바소고 대통령이 권좌에서 물러났습니다. 세베로 모토 은사가 새 과도 정부의 지도력을 맡았습니다."
 britain_md.45.a: "특이한 휴가지로군."
 britain_md.46.t: "짐바브웨에서의 용병 체포"
 britain_md.46.d: "짐바브웨 당국은 용병 혐의자 60여 명을 그들의 항공기가 하라레 국제공항에 착륙한 직후 체포했습니다. 당국은 이 집단이 적도 기니로 계속 이동하기 전에 군사 장비를 구매하려 했다고 주장합니다. 전직 영국 육군 장교 사이먼 만이 이끈 것으로 알려진 이들은 중앙아프리카의 채굴 작업을 위한 경비 용역을 제공하고 있었다고 주장합니다. 그러나 수사관들은 이들이 적도 기니의 테오도로 오비앙 응게마 음바소고 대통령을 전복하려는 더 큰 음모의 일부였다고 주장합니다."
 britain_md.46.a: "특이한 휴가지로군."
 ENG_british_attempted_coup_on_us: "웡가 쿠데타"
 ENG_british_loyalist: "모토 행정부"
 ENG_british_loyalist_trade: "영국 석유 이권 (무역)"
 raid_type_ENG_Wonga_Coup: "대참사 작전"
 raid_type_ENG_Wonga_Coup_desc: "대참사 작전은 이름과는 정반대가 되도록 계획되었습니다. 소규모 용병, 금융업자, 현지 협력자들이 적도기니 정부를 제거하고 더욱 우호적인 행정부를 세우려 시도할 것입니다."
 ENG_seize_oil_wonga_coup_TT: "§H새로운 습격 해금§!: 대참사 작전\n - [ENG.GetFlag] 영국 특수 부대가 진입하여 [EGU.GetFlag] 적도기니의 [EGU.GetLeader]을(를) 축출하고, [ENG.GetFlag] 영국이 후원하는 강자 세베로 모토 은사로 대체할 수 있습니다.\n\n대참사 작전이 성공하면\n - §H$STATE_319$§!의 자원을 장악합니다"
 ENG_defence_industry_modifier: "영국 방위 산업"
 ENG_good_friday_agreement: "성금요일 협정"
 ENG_good_friday_agreement_desc: "1998년 4월 10일에 서명된 성금요일 협정은 북아일랜드의 지위를 둘러싼 분쟁과 관련된 대부분의 폭력을 종식시킨 일련의 소규모 합의들로 이루어져 있습니다. 충성파로도 불리는 연합파는 대부분 얼스터 개신교도로, 영국에 남기를 원합니다. 반대로 대부분 아일랜드 가톨릭교도인 아일랜드 공화파와 민족주의자들은 북아일랜드가 영국을 떠나 통일 아일랜드에 합류하기를 바랐습니다. 이 분쟁이 신학적 성격을 띠는 것처럼 보일 수 있으나 실제로는 정치적이고 민족적인 분쟁이었으며, 종교는 주로 정체성의 역할을 했습니다. 다당 협정에 따라 북아일랜드의 자치는 아일랜드 민족주의 진영과 연합파 진영 사이의 권력 분점 합의 형태로 복원되었습니다. 협정에 따라 시행된 개혁은 경찰 개편에서 준군사 조직의 무장 해제에 이르기까지 다양했습니다. 이러한 조치들은 보다 안정되고 평화로운 아일랜드의 토대를 놓기를 기대합니다."
 ENG_State_17_Paramilitary_Activity: "준군사 활동:"
 ENG_State_17_Paramilitary_Activity_desc: "성금요일 협정으로 이룬 진전에도 불구하고 수많은 공화파 및 충성파 준군사 조직이 북아일랜드 전역에서 여전히 활동하고 있습니다. 많은 조직이 공식적으로 휴전을 선언했지만, 이들은 조직 구조, 비축된 무기, 지역 사회 내 영향력을 계속 유지하고 있습니다. 상당수가 밀수, 마약, 갈취, 보복 폭행 등 조직범죄에 연루되어 있습니다. \n\n§Y$STATE_17$을(를) 더 이상 통제하지 못하게 되면 제거됩니다.§!"
 ENG_additional_expenditure_goodfriday_TT: "추가 지출: GDP의 §R+0.2%§!\n예상 경찰 지출: §R+0.15%§!\n안정도: §G+10.00%§!\n\n§Y종파 간 긴장도§!로 인한 모든 페널티를 단계당 §G0.2%§! 감소시킵니다.\n\n종파 간 긴장도 단계별:\n$ENG_additional_expenditure_goodfriday_info_TT$\n--------------\n§g$STATE_17$에 대한 통제권을 상실하면 이 국가 정신은 제거됩니다.§!"
 ENG_additional_expenditure_goodfriday_state_TT: "종파 간 긴장도 단계별: (§Y[?ENG_north_irish_agitation]§!/§R100§!)\n- 필요 수비대: §R+[?ENG_Paramilitary_required_garrison]%§!\n- 주 생산성 성장 계수: §R[?ENG_Paramilitary_state_productivity_growth]%§!\n- 현지 공장 파괴 공작 확률: §R[?ENG_Paramilitary_local_factory_sabotage]%§!"
 ENG_the_macabre_alliance: "섬뜩한 동맹"
 ENG_the_macabre_alliance_desc: "1980년대 후반부터 BP는 석유 매장량의 꾸준한 감소를 되돌리기 위한 고위험 고수익의 탐사인 개척 전략에 착수했습니다. 1991년, 카사나레에서 20여 년 만에 회사 최대의 석유가 발견되며 BP는 대박을 터뜨렸습니다. 그러나 게릴라 공격의 위험이 높았습니다. 불과 최근 몇 년 사이에도 콜롬비아의 게릴라 조직 중 하나인 민족해방군(ELN)은 옥시덴탈 페트롤리움의 송유관을 460번 넘게 폭파하여 이 미국 기업을 고갈시켰습니다. 비윤리적 작전으로 악명 높은 전문 육군 부대인 제16여단은 석유 이권을 보호하기 위해 특별히 창설되었으며 카사나레에서 BP의 개인 암살단이 되었습니다. 제16여단은 영국 정부와 깊은 관계를 맺은 전 SAS 대원들이 설립한 영국 민간 경비 업체 디펜스 시스템즈 리미티드의 자금 지원을 받으며 협력했습니다. 외무부는 입장을 분명히 했습니다. 대가가 얼마든 BP는 원활하게 운영되어야 한다는 것입니다. 알바로 벨란디아 우르타도 장군은 이를 '분쟁 해결'이라 부릅니다. 희생자의 가족들은 다른 이름으로 부릅니다."
 ENG_additional_expenditure_Colombia_TT: "£corruption_cost_factor_texticon  부패 수준 변경에 필요한 정치력 비용: §R+15%§!\n--------------\n[COL.GetFlag] §Y콜롬비아§!를 대상으로 한 §Y군사 원조§!:\n- 수락될 가능성이 높아집니다.\n- 상대국이 위협받고 있을 필요가 없습니다.\n\n[COL.GetFlag] §Y콜롬비아§!를 대상으로 한 §Y정치 조작§!:\n- 영향력 요구치: §G20%§! (기본 30%)\n- 정치력 비용: §G-25%§!\n\n[COL.GetFlag] §Y콜롬비아§!의 석유 수출 수익의 §G20%§!를 받습니다\n- 추가 수입: £treasury $$[?additional_income_ENG_columbia_oil|+3]\n--------------\n§g콜롬비아가 카르텔을 소탕하거나 부패 수준이 경미한 부패(2단계)보다 높아지면 이 국가 정신은 제거됩니다.§!"
 ENG_the_dissident_campaign: "IRA 반체제 파벌의 활동"
 ENG_the_dissident_campaign_desc: "성금요일 협정을 거부하는 리얼 IRA와 컨티뉴이티 IRA 같은 반체제 공화파 단체들은 북아일랜드에 대한 영국의 권위를 정당한 것으로 인정하기를 거부합니다. 리얼 IRA는 1997년 임시 IRA에서 갈라져 나와 자신들이 진정한 공화주의자라고 주장하며 평화 프로세스를 투항이라고 규탄했고, 프로보스를 공화국을 영국의 권위와 맞바꾼 협력자로 간주했습니다. 컨티뉴이티 IRA는 그보다 앞선 1986년, 신페인이 아일랜드 하원(달 에런) 의석 거부 방침을 종료하기로 결정한 데 따른 분열로 등장했으며, 지도부의 노선을 거부하고 기존 공화파 운동이 아일랜드 주권에 대한 진정한 헌법적 권리 주장을 저버렸다고 주장합니다. 두 파벌 모두 평화 프로세스의 정당성을 부정합니다. 이 단체들은 폭탄 테러, 총격, 표적 공격을 통해 영국 정부를 상대로 낮은 수준의 반란을 이어가는 한편, 얼스터 왕립 경찰대의 통제력이 제한적인 공화파 거점에서는 사실상의 치안 기구로도 활동합니다."
