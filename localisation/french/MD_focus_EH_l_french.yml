 EH_scientist_Jennifer_Doudna_tt: "§YJennifer Doudna§!"
 EH_scientist_Jennifer_Doudna_tt_delayed: "Jennifer Doudna est une biochimiste de renom, pionnière de la technologie d'édition génique CRISPR avec Emmanuelle Charpentier. Grâce au CRISPR, nous pourrons mieux comprendre le patrimoine génétique des Chimères et trouver un moyen d'exploiter leurs faiblesses.\n--------------\n§YEffets :§!\n[!EH_hire_Jennifer_Doudna_button_click]\n\n§YPrérequis :§!\n[!EH_scientist_Jennifer_Doudna_click_enabled]"
 EH_scientist_Fabiola_Gianotti_tt: "§YFabiola Gianotti§!"
 EH_scientist_Fabiola_Gianotti_tt_delayed: "Fabiola Gianotti est une physicienne des particules expérimentale italienne, et actuelle Directrice générale du CERN. Son expertise en physique des particules et son expérience des collaborations scientifiques de grande envergure seront inestimables pour comprendre les portails et leur lien avec une autre dimension.\n--------------\n§YEffets :§!\n[!EH_hire_Fabiola_Gianotti_button_click]\n\n§YPrérequis :§!\n[!EH_scientist_Fabiola_Gianotti_click_enabled]"
 EH_scientist_Lene_Hau_tt: "§YLene Hau§!"
 EH_scientist_Lene_Hau_tt_delayed: "Lene Hau est une physicienne danoise connue pour ses travaux pionniers sur le ralentissement et l'arrêt de la lumière. Son expertise en optique quantique et en physique de la matière condensée pourrait éclairer la nature des portails et de leurs émissions d'énergie.\n--------------\n§YEffets :§!\n[!EH_hire_Lene_Hau_button_click]\n\n§YPrérequis :§!\n[!EH_scientist_Lene_Hau_click_enabled]"
 EH_scientist_Emmanuelle_Charpentier_tt: "§YEmmanuelle Charpentier§!"
 EH_scientist_Emmanuelle_Charpentier_tt_delayed: "Emmanuelle Charpentier est une microbiologiste et biochimiste française. Avec Jennifer Doudna, elle a développé la technologie d'édition génique CRISPR-Cas9. Ses connaissances seront cruciales pour comprendre et, potentiellement, manipuler la biologie des Chimères.\n--------------\n§YEffets :§!\n[!EH_hire_Emmanuelle_Charpentier_button_click]\n\n§YPrérequis :§!\n[!EH_scientist_Emmanuelle_Charpentier_click_enabled]"
 EH_scientist_Andrzej_Trautman_tt: "§YAndrzej Trautman§!"
 EH_scientist_Andrzej_Trautman_tt_delayed: "Andrzej Trautman est un physicien théoricien polono-américain, connu pour ses travaux en relativité générale et physique des trous noirs. Son expertise pourrait nous aider à comprendre la physique fondamentale des portails et leurs effets sur notre monde.\n--------------\n§YEffets :§!\n[!EH_hire_Andrzej_Trautman_button_click]\n\n§YPrérequis :§!\n[!EH_scientist_Andrzej_Trautman_click_enabled]"
