 ARM_Raffi: "Triunfo da Herança"
 ARM_Raffi_desc: "Heritage (Herança) é um partido político liberal nacional armênio. Foi fundado por Raffi Hovhannisyan, o primeiro ministro das Relações Exteriores da Armênia independente."
 ARM_national_liberal_agenda: "Agenda Nacional-Liberal"
 ARM_national_liberal_agenda_desc: "A agenda de nosso partido deve ser a economia liberal e a preservação da herança nacional. Esses são nossos pilares para a grandeza!"
 ARM_freemrk_freppl: "Mercado Mais Livre - Povo Mais Livre"
 ARM_freemrk_freppl_desc: "É óbvio que devemos parar de tentar controlar o mercado além do necessário."
 ARM_armenian_traders_spir: "Espírito dos Comerciantes Armênios"
 ARM_armenian_traders_spir_desc: "Nosso povo foi comerciante de sucesso ao longo da história; devemos apoiar essa tradição."
 ARM_protect_armenian_heritage: "Proteger a Herança Armênia"
 ARM_protect_armenian_heritage_desc: "Devemos proteger nossa herança, nossa cultura, que nos faz quem e o que somos."
 ARM_diaspora_connect: "Laços com a Diáspora"
 ARM_diaspora_connect_desc: "Devemos usar nossos laços com a diáspora em benefício de nosso governo."
 ARM_part_of_western_civ: "Parte da Civilização Ocidental"
 ARM_part_of_western_civ_desc: "A Armênia não é apenas um país qualquer do Oriente Médio ou da Europa Oriental. Somos parte da civilização ocidental cristã, que devemos abraçar e emular!"
 ARM_befr_church: "Aproximar-se da Igreja Armênia"
 ARM_befr_church_desc: "Devemos apoiar a igreja armênia, pois ela é um dos aspectos fundamentais de nossa coesão social."
 ARM_liberty_soil_blood: "Liberdade, Solo, Sangue!"
 ARM_liberty_soil_blood_desc: "Devemos amar nosso solo pela liberdade que ele nos dá e respeitar todo o sangue que foi derramado pela liberdade de nosso povo."
 ARM_new_leader_image: "A Nova Imagem do Líder"
 ARM_new_leader_image_desc: "Raffi deve ser um novo ícone de líder popular honesto e genuíno para a Armênia!"
 ARM_anti_corrupt_mass: "Campanhas Anticorrupção em Massa"
 ARM_anti_corrupt_mass_desc: "A corrupção deve ser varrida de nosso país e uma nova polícia anticorrupção deve ser criada."
 ARM_foster_econ_growth: "Crescimento Econômico Mais Rápido"
 ARM_foster_econ_growth_desc: "Devemos acelerar o crescimento econômico a todo custo, pois ele é a chave para a prosperidade armênia."
 ARM_free_full_healthcare: "Saúde Gratuita e Completa"
 ARM_free_full_healthcare_desc: "Devemos oferecer aos nossos cidadãos a melhor saúde gratuita e completa, para cuidar deles."
 ARM_anti_braindead: "Esforço Contra a Fuga de Cérebros"
 ARM_anti_braindead_desc: "Devemos combater a fuga de cérebros que aflige a Armênia desde a queda da União Soviética."
 ARM_us_example: "Exemplo Americano"
 ARM_us_example_desc: "Os EUA são um grande exemplo de país democrático e capitalista, cuja prosperidade brilha até hoje. Devemos construir nosso país de acordo com esses ideais!"
 ARM_elect_reform: "Reforma Eleitoral"
 ARM_elect_reform_desc: "Devemos tornar nosso sistema eleitoral mais democrático e garantir a participação plena."
 ARM_united_states_armenia: "Estados Unidos da Armênia"
 ARM_united_states_armenia_desc: "Nossa inspiração no sistema americano alcançará seu auge! Estamos prontos para anunciar a criação dos Estados Unidos da Armênia!"
 ARM_true_air_force: "Verdadeira Força Aérea Armênia"
 ARM_true_air_force_desc: "Pretendemos construir a estrutura de nossa Força Aérea à semelhança da Força Aérea dos EUA e investir uma parcela significativa do orçamento do país em seu desenvolvimento."
 ARM_true_national_guard: "Verdadeira Guarda Nacional"
 ARM_true_national_guard_desc: "Pretendemos adaptar integralmente a experiência da Guarda Nacional dos EUA às realidades do Exército Armênio. Como o protótipo americano, a Guarda Nacional poderá participar de operações em outros países, e também será criada a Guarda Nacional da Força Aérea, o que permitirá que nossos pilotos participem de operações no exterior."
