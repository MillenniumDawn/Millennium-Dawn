 PRODUCTION_PRICE_10_TT: "Цена за единицу и §Rобщая§! сумма за всю партию.\n\nПроизводство §Yне оплачивается вперёд§!. Общая сумма списывается §Yеженедельно в течение всей постройки§!, сейчас это примерно §Y$[?var_space_week_10|C2] млрд в неделю§!.\n\nДополнительные параллельные линии сокращают срок, но увеличивают и общую сумму, и еженедельный платёж."
 PRODUCTION_PRICE_11_TT: "Цена за единицу и §Rобщая§! сумма за всю партию.\n\nПроизводство §Yне оплачивается вперёд§!. Общая сумма списывается §Yеженедельно в течение всей постройки§!, сейчас это примерно §Y$[?var_space_week_11|C2] млрд в неделю§!.\n\nДополнительные параллельные линии сокращают срок, но увеличивают и общую сумму, и еженедельный платёж."
 PRODUCTION_PRICE_12_TT: "Цена за единицу и §Rобщая§! сумма за всю партию.\n\nПроизводство §Yне оплачивается вперёд§!. Общая сумма списывается §Yеженедельно в течение всей постройки§!, сейчас это примерно §Y$[?var_space_week_12|C2] млрд в неделю§!.\n\nДополнительные параллельные линии сокращают срок, но увеличивают и общую сумму, и еженедельный платёж."
 PRODUCTION_PRICE_13_TT: "Цена за единицу и §Rобщая§! сумма за всю партию.\n\nПроизводство §Yне оплачивается вперёд§!. Общая сумма списывается §Yеженедельно в течение всей постройки§!, сейчас это примерно §Y$[?var_space_week_13|C2] млрд в неделю§!.\n\nДополнительные параллельные линии сокращают срок, но увеличивают и общую сумму, и еженедельный платёж."
 PRODUCTION_PRICE_14_TT: "Цена за единицу и §Rобщая§! сумма за всю партию.\n\nПроизводство §Yне оплачивается вперёд§!. Общая сумма списывается §Yеженедельно в течение всей постройки§!, сейчас это примерно §Y$[?var_space_week_14|C2] млрд в неделю§!.\n\nДополнительные параллельные линии сокращают срок, но увеличивают и общую сумму, и еженедельный платёж."
 SPACE_AUTO_TITLE: "§YАвтоматизация программы§!"
 SPACE_AUTO_TITLE_TT: "Ведёт вашу космическую программу без микроменеджмента: каждую неделю заказывает спутники и носители, предусмотренные выбранным планом, и запускает их, как только запасов хватает на полную ротацию.\n\nОна всегда строит §Yсамое новое исследованное вами поколение§! и никогда более старое, а по достижении максимальной ёмкости группировки останавливается сама.\n\nПри §Y3000 спутников всего§! или §Y1000 на тип§! успешные запуски автоматически сводят с орбиты подходящие спутники самого старого поколения того же типа, освобождая место для новых поколений. При неудачном запуске имеющиеся спутники сохраняются. Если подходящей замены нет, автоматика ждёт, не расходуя носитель и полезную нагрузку. Действующие разведывательные миссии защищены.\n\n§YПоказатели на этой панели пересчитываются раз в месяц§! и каждый раз при повторном открытии вкладки — так что если после завершения технологии значение выглядит устаревшим, переключите вкладку и вернитесь обратно.\n\n§RKILLSAT не автоматизируются§! — это орбитальное оружие, а не группировка покрытия, поэтому заполнять тут нечего."
 SPACE_AUTO_STATUS: "[space_auto_status_loc]"
 SPACE_AUTO_STATUS_TT: "§YОтключена§! — автоматика выключена.\n§YАктивна§! — идут заказы и запуски; цифра — текущие недельные расходы.\n§YОжидание§! — нужны запасы полезной нагрузки или свободная ёмкость, чтобы запуск не сорвал действующие разведывательные миссии.\n§YЁмкость исчерпана§! — все группировки плана заполнены; простой до исследования нового поколения.\n§YЗастопорена§! — ни одна полезная нагрузка из плана не подходит к носителю.\n§YПриостановлена§! — казна не тянет следующую партию; уменьшите ротацию или разрешите дефицитные расходы.\n§YОстановлена§! — казна пуста, а дефицитные расходы отключены.\n\nЭтот статус пересчитывается раз в месяц и при каждом повторном открытии вкладки."
 SPACE_AUTO_TOGGLE_TT: "[!space_auto_toggle_button_click_enabled]Включить или выключить автоматику."
 SPACE_AUTO_TOGGLE_TT_DELAYED: "Выключение останавливает только новые заказы. Уже запущенные партии достраиваются и продолжают списывать деньги до поставки, так что оплаченное не пропадает.\n\nПри повторном включении работа продолжится с того, в каком состоянии находятся ваши группировки."
 SPACE_AUTO_PRESET: "§gПлан:§! [space_auto_preset_name_loc]"
 SPACE_AUTO_PRESET_DESC: "[space_auto_preset_desc_loc]"
 SPACE_AUTO_PRESET_TT: "Какие спутники строит автоматика. Проектировать вручную не нужно — любой план сам берёт новейшее исследованное поколение.\n\n§YАвтоматически§! — сначала восстанавливается самая устаревшая сеть, затем очередь переходит к следующей.\n§YУпор§! — все места отдаются одному семейству.\n§YПарные§! и §Yсбалансированный§! планы делят сборку, передавая места тому семейству, которое отстало сильнее, по мере заполнения остальных.\n§YСвой вариант§! — запускается сборка, которую вы собрали выше и сохранили."
