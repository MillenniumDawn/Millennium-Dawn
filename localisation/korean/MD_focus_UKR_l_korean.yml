 ukraine_develop_btr4.6.desc: "BTR-4 IFV의 무장 모듈을 선택할 수 있습니다.\n\n§YBM-1B '흐림'§! 무장: 30mm 자동포 1문, 30mm 자동 유탄발사기 1정, 7.62mm 동축 기관총 1정, 9P135M '콘쿠르스' 또는 '바리에르' 대전차 미사일 4발.\n\n§YKBA-105 '시크발'§! 무장: 30mm 자동포 1문, 7.62mm 동축 기관총 1정, 9P135M '콘쿠르스' 또는 '바리에르' 대전차 미사일 4발 (선택 사양으로 30mm 자동 유탄발사기 1정을 장착할 수 있으나 대전차 미사일은 2발로 줄어듦).\n\n§YBAU 23x2§! 무장: 23x152mm 자동포 2문, 7.62mm 동축 기관총 1정."
