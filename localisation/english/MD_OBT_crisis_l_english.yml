l_english:
 # Operation Blue Tiger milestone 8: Hainan, arms package and US-Japan statement
 obt_crisis.1.t: "Crew Down on Hainan"
 obt_crisis.1.d: "One of our EP-3E reconnaissance aircraft and a Chinese J-8II fighter have collided over the South China Sea. Each government blames the other's pilot. The crippled EP-3E made an emergency landing at Lingshui on Hainan Island, and its 24 crew are now in Chinese custody. The Chinese pilot is missing."
 obt_crisis.1.a: "Demand the crew's prompt return."
 obt_crisis.1.b: "Express regret for the missing pilot."
 obt_crisis.2.t: "Taipei Watches Hainan"
 obt_crisis.2.d: "An American reconnaissance crew is being held on Hainan after a collision with a Chinese fighter. Washington and Beijing are trading accusations, and both are watching how Taipei responds."
 obt_crisis.2.a: "Quietly support Washington."
 obt_crisis.2.b: "Stay out of it."
 obt_crisis.3.t: "The Crew Question"
 obt_crisis.3.d: "Twenty-four American airmen are in our custody on Hainan, and the search for our pilot continues. Washington wants its crew back; our public wants an apology."
 obt_crisis.3.a: "Hold the crew until Washington apologizes."
 obt_crisis.3.b: "(Alternate history) Release them at once on humanitarian grounds."
 obt_crisis.3.c: "(Alternate history) Put the crew on trial."
 obt_crisis.4.t: "The Letter"
 obt_crisis.4.d: "Beijing will release the crew if we apologize. Our ambassador has drafted a letter saying we are very sorry for the loss of the Chinese pilot and that the aircraft landed without verbal clearance. It admits no fault for the collision."
 obt_crisis.4.a: "Send the letter."
 obt_crisis.4.b: "(Alternate history) Refuse any apology."
 obt_crisis.6.t: "The Standoff Drags On"
 obt_crisis.6.d: "(Alternate history) Three weeks on, the crew is still held on Hainan. Families are on television every night, business groups warn about trade with China, and Congress is divided over what to do next."
 obt_crisis.6.a: "Send the letter after all."
 obt_crisis.6.b: "Refuse again."
 obt_crisis.7.t: "The Crew on Trial"
 obt_crisis.7.d: "(Alternate history) Beijing has announced that our airmen will stand trial. The President faces demands for sanctions, for a carrier deployment and for restraint, often from the same senators."
 obt_crisis.7.a: "Rally our allies and wait them out."
 obt_crisis.7.b: "Threaten sanctions."
 obt_crisis.5.t: "The Crew Goes Home"
 obt_crisis.5.d_refused: "Washington still refuses to apologize, and the standoff is costing us abroad. Holding the crew longer gains nothing."
 obt_crisis.5.d_letter: "Washington's letter says it is very sorry for the loss of our pilot and for the landing without permission. Each side reads the words its own way, but the standoff can end."
 obt_crisis.5.d_settle: "Washington's letter says it is very sorry for the loss of our pilot and for the landing without permission. Each side reads the words its own way, but the standoff can end."
 obt_crisis.5.d_quick: "We have decided to send the American crew home without waiting for an apology."
 obt_crisis.5.d_trial: "The trial has made its point and cost us abroad. It is time to send the airmen home."
 obt_crisis.5.a: "Release the crew and keep the aircraft for inspection."
 obt_crisis.5.b: "(Alternate history) Release the crew and return the aircraft intact."
 obt_crisis.9.t: "The Aircraft Comes Home"
 obt_crisis.9.d: "The EP-3E has been taken apart on Hainan and flown home in pieces aboard a chartered Russian transport. Talks on reconnaissance flights and collision avoidance continue."
 obt_crisis.9.a: "Close the chapter."
 obt_crisis.20.t: "The Taiwan Arms Package"
 obt_crisis.20.d: "The annual arms talks with Taipei have reached the President's desk. On the table are four Kidd-class destroyers, eight diesel submarines and twelve P-3C patrol aircraft. Taipei also wants Aegis-equipped destroyers, which Beijing has warned against above all."
 obt_crisis.20.a: "Approve the package and defer Aegis."
 obt_crisis.20.b: "(Alternate history) Approve everything, including Aegis destroyers."
 obt_crisis.20.c: "(Alternate history) Postpone the package."
 obt_crisis.21.t: "Whatever It Takes?"
 obt_crisis.21.d: "A television interviewer asks the President whether the United States has an obligation to defend Taiwan if it is attacked by China."
 obt_crisis.21.a: "We will do whatever it takes to help Taiwan defend herself."
 obt_crisis.21.b: "(Alternate history) Reaffirm strategic ambiguity."
 obt_crisis.22.t: "Washington's Decision"
 obt_crisis.22.d_approved: "Washington has approved four Kidd-class destroyers, eight diesel submarines and twelve P-3C patrol aircraft. Aegis destroyers are deferred. The Legislative Yuan must now find the money, and the armed forces must learn to use what they buy."
 obt_crisis.22.d_aegis: "Washington has approved everything we asked for, including Aegis destroyers. Beijing is furious. The Legislative Yuan must now find the money, and the armed forces must learn to use what they buy."
 obt_crisis.22.d_postponed: "Washington has postponed this year's arms package. Officials say the door remains open, but the timing is wrong."
 obt_crisis.22.a: "Welcome the package."
 obt_crisis.22.b: "Buy only what we can absorb."
 obt_crisis.22.c: "Lobby Congress and wait."
 obt_crisis.22.e: "Invest in our own industry instead."
 obt_crisis.23.t: "Washington Arms Taipei"
 obt_crisis.23.d_approved: "Washington has approved destroyers, submarines and patrol aircraft for Taiwan, though not the Aegis destroyers we warned against. The Foreign Ministry calls it blatant interference in China's internal affairs."
 obt_crisis.23.d_aegis: "Washington has approved Aegis destroyers for Taiwan despite our warnings. The Foreign Ministry calls it blatant interference in China's internal affairs."
 obt_crisis.23.a: "Lodge a formal protest."
 obt_crisis.23.b: "Answer with exercises in the Strait."
 obt_crisis.30.t: "The Security Consultative Committee"
 obt_crisis.30.d: "Our foreign and defense ministers are meeting their American counterparts to agree on common strategic objectives for the alliance. The American side proposes listing the peaceful resolution of issues concerning the Taiwan Strait through dialogue."
 obt_crisis.30.a: "Name the Taiwan Strait among our common objectives."
 obt_crisis.30.b: "(Alternate history) Leave Taiwan out of the statement."
 obt_crisis.31.t: "Tokyo and Washington Speak"
 obt_crisis.31.d: "For the first time, Japan and the United States have named the Taiwan Strait among their common strategic objectives, calling for the peaceful resolution of its issues through dialogue."
 obt_crisis.31.a: "Welcome the statement."
 obt_crisis.31.b: "Respond with restraint."
 obt_crisis.32.t: "The 2+2 Statement"
 obt_crisis.32.d: "Tokyo and Washington have named the Taiwan Strait among their common strategic objectives. Our Foreign Ministry has expressed its resolute opposition to any interference in China's internal affairs."
 obt_crisis.32.a: "Lodge a formal protest."
 obt_crisis.32.b: "Play it down publicly."
 OBT_2001_package_postponed: "Washington has postponed the 2001 arms package"
 TAI_na_kidd_destroyers_aegis: "Aegis Combat System"
