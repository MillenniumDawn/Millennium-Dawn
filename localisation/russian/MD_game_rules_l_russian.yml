 RULE_RANDOM_IDEOLOGIES_NO_DESC: "Все страны сохранят свою историческую идеологию."
 RULE_RANDOM_IDEOLOGIES_YES_DESC: "Все страны теперь будут иметь случайную идеологию."
 RULE_RANDOM_RELIGION: "Случайные религии"
 RULE_RANDOM_RELIGION_NO_DESC: "Все страны сохранят свои исторические религии."
 RULE_RANDOM_RELIGION_YES_DESC: "Все страны теперь будут иметь случайную религию."
 RULE_RANDOM_INTERNAL_FACTIONS: "Случайные внутренние фракции"
