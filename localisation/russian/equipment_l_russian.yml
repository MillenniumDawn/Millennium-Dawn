 BLR_Rec_tank_0: "БРДМ-2"
 BLR_Rec_tank_0_desc: "Бронированная разведывательно-дозорная машина. Имеет низкую защищённость: её броня защищает только от пуль стрелкового оружия и осколков. Главная особенность машины — очень высокая проходимость."
 BLR_Rec_tank_0_short: "БРДМ-2"
 BLR_Rec_tank_1: "БРМ-1К"
 BLR_Rec_tank_1_desc: "Гусеничная боевая разведывательная машина, разработанная на базе БМП-1. Предназначена для ведения разведки на поле боя. Способна преодолевать водные преграды. Оснащена 73-мм пусковой установкой и 7,62-мм пулеметом. Вместимость машины - 6 человек."
 BLR_Rec_tank_1_short: "БРМ-1К"
 BLR_Rec_tank_2: "БРДМ «Кайман»"
 BLR_Rec_tank_2_desc: "Мобильная бронированная машина для разведки и подразделений спецназа. Объект предназначен для использования в качестве транспортного средства для проведения разведывательно-диверсионных операций, патрулирования и сопровождения колонн, проведения миротворческих и полицейских операций, проведения операций в чрезвычайных ситуациях."
 BLR_Rec_tank_2_short: "Кайман"
 BLR_APC_1: "БТР-60"
 BLR_APC_1_desc: "Одна из старейших машин, до сих пор находящихся на вооружении, БТР-60, оснащена 14,5-мм крупнокалиберным пулемётом КПВТ с боезапасом 500 патронов. Вспомогательное вооружение — спаренный пулемёт ПКТ калибра 7,62 мм с боезапасом 3,00 патрона. Отлично подходит для переброски лёгкой пехоты и сил быстрого реагирования (QRF)."
 BLR_APC_1_short: "БТР-60"
 BLR_APC_2: "МТ-ЛБ"
 BLR_APC_2_desc: "МТ-ЛБ был создан в 1970-х годах. Изготовлены дешево и быстро. Советы использовали их для легких противовоздушных и пехотных боев."
 BLR_APC_2_short: "МТ-ЛБ"
 BLR_APC_3: "БТР-70"
 BLR_APC_3_desc: "БТР-70 использовались с 1972 года, в советско-афганской войне они использовались для передвижения войск и последующей огневой поддержки. Единственное отличие от БТР-60 — более тяжелая броня."
 BLR_APC_3_short: "БТР-70"
 BLR_APC_4: "БТР-80"
 BLR_APC_4_desc: "БТР-80 — колесный БТР-амфибия с колесной формулой 8х8, разработанный в СССР. Он был принят на вооружение в 1986 году и заменил в Советской Армии предыдущие машины БТР-60 и БТР-70. Впервые он был применен во время советской войны в Афганистане."
 BLR_APC_4_short: "БТР-80"
 BLR_APC_5: "БТР-90"
 BLR_APC_5_desc: "Создан в 1994 году для борьбы с боевиками-террористами. Он оснащен мощной 30-мм пушкой Шипунова 2А42 с боезапасом 500 снарядов."
 BLR_APC_5_short: "БТР-90"
 BLR_APC_6: "Волат V2"
 BLR_APC_6_desc: "МЗКТ-690003 Volat V-2 — белорусский полноприводный бронетранспортёр с колёсной формулой 8х8."
 BLR_APC_6_short: "Волат V2"
 BLR_IFV_1: "БМП-1"
 BLR_IFV_1_desc: "БМП-1 — советская гусеничная плавающая боевая машина пехоты. Использовалась во время советско-афганской войны для перевозки войск и борьбы с джихадистами. Вооружена 73-мм орудием 2А28 и пусковой установкой ПТУР."
 BLR_IFV_1_short: "БМП-1"
 BLR_IFV_2: "БМП-2"
 BLR_IFV_2_desc: "Самый большой страх джихадистов - это БМП-2, чрезвычайно быстрая и эффективная с 30-мм пушкой и гусеницами."
 BLR_IFV_2_short: "БМП-2"
 BLR_IFV_3: "БМП-2М"
 BLR_IFV_3_short: "БМП-2М"
 BLR_IFV_4: "БМП-3"
 BLR_IFV_4_desc: "БМП-3 — советская боевая машина пехоты, преемница БМП-1 и БМП-2. Стрельба из 100-мм пушки тяжелыми фугасными снарядами."
 BLR_IFV_4_short: "БМП-3"
 BLR_IFV_5: "БМП-3М"
 BLR_IFV_5_desc: "БМП-3М — советская боевая машина пехоты, преемница БМП-1 и БМП-2 и вариант БМП-3. Использует модернизированную пушку и двигатель."
 BLR_IFV_5_short: "БМП-3М"
 BLR_MBT_1: "Т-62/64"
 BLR_MBT_1_desc: "Самый массовый советский танк в производстве. Разработанный и произведенный в первые годы Холодной войны, он был мощью и опорой Красной Армии. Когда-то его боялись как символа российской мощи, но теперь он стал культовым изображением бронетанковых сил Ближнего Востока, уничтоженных в результате воздушного удара США."
 BLR_MBT_1_short: "Т-62/64"
 BLR_MBT_2: "Т-72"
 BLR_MBT_2_desc: "Т-72, пожалуй, самая успешная разработка, созданная Россией. Это была вершина советской военной мощи на завершающем этапе Холодной войны, производившаяся тысячами, и служащая основой российской армии даже сегодня. Хотя она стала печально известной из-за своих катастрофических неудач в конфликтах на Ближнем Востоке, Т-72 по-прежнему используется в качестве платформы для разработки будущих российских танков и постоянно подвергается модификациям и обновлениям, чтобы соответствовать стандартам современной войны сегодня. Не стоит недооценивать танк, который когда-то был копьем советских войск."
 BLR_MBT_2_short: "Т-72"
 BLR_MBT_3: "Т-80"
 BLR_MBT_3_desc: "Танк с одной газотурбинной силовой установкой. Первый в мире основной танк со встроенной динамической защитой. Это гусеничная высокомобильная боевая машина с ракетно-пушечным и пулеметным вооружением, предназначенная для круглосуточного решения широкого круга боевых задач, в том числе в условиях применения оружия массового поражения."
 BLR_MBT_3_short: "Т-80"
 BLR_MBT_4: "Т-90"
 BLR_MBT_4_desc: "Российский основной боевой танк, принятый на вооружение в 1993 году. В период с 2001 по 2010 год Т-90 стал самым продаваемым новым основным танком в мире. Впоследствии были созданы две его основные модификации Т-90А «Владимир» и Т-90М «Прорыв»."
 BLR_MBT_4_short: "Т-90"
 BLR_MBT_5: "Объект 477"
 BLR_MBT_5_short: "Объект 477"
 BLR_Anti_tank_1: "РПГ-7"
 BLR_Anti_tank_1_desc: "Применялся во многих войнах и на многих машинах."
 BLR_Anti_tank_2: "АТ-4 «Фагот»"
 BLR_Anti_tank_2_desc: "Гораздо легче и старше других ПТРК. Эта ПТУР поражает цели лишь на дальности 70–2500 м, что значительно меньше, чем у других комплексов, зато она дешевле."
 BLR_Heavy_Anti_tank_1: "9П148 «Конкурс»"
 BLR_Heavy_Anti_tank_1_desc: "Комплекс «Конкурс» (по классификации НАТО — AT-5 Spandrel), созданный на базе бронированной разведывательно-дозорной машины БРДМ-2. Основное назначение — транспортировка, наведение и пуск противотанковых управляемых ракет. Способен поражать ракетами как движущиеся цели со скоростью до 60 км/ч, так и неподвижные, например доты и дзоты, в условиях оптической видимости."
 BLR_Heavy_Anti_tank_2: "9П148 «Конкурс»"
 BLR_Heavy_Anti_tank_2_desc: "Комплекс «Штурм-С» (по классификации НАТО — AT-6 Spiral) предназначен для поражения современных и перспективных танков, в том числе оснащённых динамической защитой, малотоннажных надводных целей, низколетящих воздушных целей, оборонительных сооружений и живой силы в укрытиях и на открытой местности днём и ночью, в простых и сложных метеоусловиях, а также при пылевых и дымовых помехах."
 BLR_SP_Anti_Air_0: "ЗСУ-23-4 «Шилка»"
 BLR_SP_Anti_Air_0_desc: "Советская зенитная самоходная установка. Вооружена счетверённой автоматической 23-мм пушкой. Скорострельность установки составляет 3400 выстрелов в минуту. Наведение на цель может осуществляться вручную, полуавтоматически и автоматически. Предназначена для непосредственного прикрытия сухопутных войск, поражения воздушных целей на дальностях до 2500 м и высотах до 1500 м, летящих со скоростью до 450 м/с, а также наземных (надводных) целей на дальностях до 2000 м."
 BLR_SP_Anti_Air_1: "9К33 «Оса»"
 BLR_SP_Anti_Air_1_desc: "SA-8 Gecko («Оса») — советский автоматизированный войсковой зенитный ракетный комплекс. Комплекс всепогодный и предназначен для прикрытия сил и средств мотострелковой (танковой) дивизии во всех видах боевых действий."
 BLR_SP_Anti_Air_2: "Тор-2М"
 BLR_SP_Anti_Air_2_desc: "SA-15 Gauntlet («Тор») — самоходный зенитный ракетный комплекс малой дальности «Тор-М2» предназначен для поражения самолётов, вертолётов, крылатых, противорадиолокационных и других управляемых ракет, планирующих и управляемых бомб, а также беспилотных летательных аппаратов в зоне поражения комплекса в условиях интенсивного огневого и радио- и оптико-электронного противодействия в любых погодных условиях днём и ночью."
 BLR_SP_R_arty_0: "БМ-21 «Град»"
 BLR_SP_R_arty_0_desc: "Советская реактивная система залпового огня (РСЗО) калибра 122 мм. Предназначена для поражения открытой и укрытой живой силы, небронированной техники и бронетранспортёров в районе сосредоточения, артиллерийских и миномётных батарей, командных пунктов и других целей. Количество снарядов в залпе — 40 штук."
 BLR_SP_R_arty_1: "БМ-27 «Ураган»"
 BLR_SP_R_arty_1_desc: "Советская реактивная система залпового огня (РСЗО) калибра 220 мм. По сравнению с «Градом» увеличилась не только дальность, но и площадь охвата до 42 гектаров, а также точность, которая превысила точность предшественника в полтора раза. Количество снарядов на залп 16 штук."
 BLR_SP_R_arty_2: "В-200 «Полонез»"
 BLR_SP_R_arty_2_desc: "Белорусская 301-мм реактивная система залпового огня. Комплекс предназначен для высокоточного поражения открыто расположенной и укрытой живой силы, небронированной и бронированной военной техники и других объектов. Дальность стрельбы первоначально составляла до 200 км, но позже, за счет применения новых ракет, была увеличена до 300 км."
 BLR_SP_arty_0: "2С3 «Акация»"
 BLR_SP_arty_0_desc: "Советская 152-мм дивизионная самоходная гаубица. Предназначена для подавления и уничтожения живой силы, артиллерийских и миномётных батарей, реактивных установок, танков, огневых средств, командных пунктов и средств тактического ядерного нападения."
 BLR_SP_arty_1: "2С19 «Мста-С»"
 BLR_SP_arty_1_desc: "Советская и российская 152-мм дивизионная самоходная гаубица. По сравнению с «Акацией» «Мста-С» имеет значительно увеличенную дальность поражения осколочно-фугасным и активно-реактивным снарядом, а также повышенную скорострельность. Кроме того, в боекомплект 2С19 входят снаряды повышенной мощности, которые по своей эффективности превосходят предыдущие в 1,3-1,5 раза."
 BLR_SP_arty_2: "2С19М2 Мста-СМ"
 BLR_SP_arty_2_desc: "Эта самоходная гаубица, оснащённая автоматизированной системой управления огнём и поддержкой ГЛОНАСС, переносит платформу «Мста-С» в XXI век. Скорострельность увеличена в 2,5 раза, улучшена точность прицеливания, введён режим огневого налёта, позволяющий одному орудию поразить цель сразу пятью выстрелами, а затем покинуть огневую позицию. Кроме того, улучшены условия обитаемости экипажа."
 BLR_SP_arty_3: "2С35 «Коалиция-СВ»"
 BLR_SP_arty_3_desc: "Российская 152-мм межвидовая артиллерийская система на базе танка Т-90. По сравнению с «Мстой-СМ» эта установка имеет значительно увеличенную максимальную дальность стрельбы (80 км против 29 км) и увеличенную в 1,5 раза скорострельность. Позволяет поражать цель одновременно несколькими снарядами, выпущенными из одной САУ и расположенными на разных траекториях полета. Стрельба полностью автоматизирована и не требует присутствия членов орудийного расчета в боевом отделении."
 BLR_artillery_1: "Д-30"
 BLR_artillery_1_desc: "122-мм советская буксируемая гаубица. Состоит на вооружении многих стран мира. Применялась и применяется во многих военных конфликтах. Максимальная дальность стрельбы — 22 км."
 BLR_artillery_2: "2А65 «Мста-Б»"
 BLR_artillery_2_desc: "Буксируемая 152-мм гаубица. По сравнению с предшественницей применено несколько кардинальных новшеств: длинный тонкий ствол, оснащённый двухщелевым дульным тормозом; двухстанинный лафет и гидродомкрат с поддоном для вывешивания колёс при стрельбе. Ударно-спусковой механизм и полуавтоматический затвор позволяют довести боевую скорострельность до семи выстрелов в минуту. Максимальная дальность — 28,9 км."
 BLR_artillery_3: "2А65М2 «Мста-БМ»"
 BLR_artillery_3_desc: "Модернизированная версия буксируемой гаубицы 2А65 «Мста-Б»."
 BLR_artillery_4: "2А88 «Коалиция-Б»"
