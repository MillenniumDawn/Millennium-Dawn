 SOV_tech_landing_craft_3: "LCAC clase Zubr"
 SOV_tech_landing_craft_4: "Clase Ivan Gren "
 nsb_light_nose_gun_tech_4: "Cañones de morro de vanguardia"
 nsb_light_nose_gun_tech_4_desc: "Los cañones de riel electromagnéticos montados en el morro dotan a los helicópteros de un arma de fuego directo con una velocidad de salida extrema y una alta penetración de blindaje. Destacan en ventanas de combate cortas y brutales contra vehículos ligeros, fortificaciones y objetivos de bajo vuelo, pero exigen una gran potencia de energía y una refrigeración robusta."
 nsb_light_nose_gun_tech_5: "Cañones de morro hiperavanzados"
 nsb_light_nose_gun_tech_5_desc: "Condensadores perfeccionados, materiales de tubo mejorados y una integración más estrecha del control de tiro permiten ráfagas sostenidas sin sufrir un desgaste crítico. Estos cañones de riel avanzados montados en el morro optimizan la precisión y la fiabilidad al tiempo que reducen el estrés por retroceso, convirtiendo al helicóptero en una plataforma de tiro precisa y de alta letalidad."
 nsb_light_nose_gun_tech_6: "Cañones de morro ultraavanzados"
 nsb_light_nose_gun_tech_6_desc: "Los diseños de próxima generación se centran en la eficiencia energética, la estabilidad térmica y la puntería automatizada para mantener la eficacia del fuego del cañón de riel bajo maniobras evasivas y la presión de la guerra electrónica. Con ciclos más rápidos y un manejo de munición más inteligente, los helicópteros pueden infligir un fuego directo consistente y devastador sin sacrificar su autonomía."
 tech_helicopter_hover_engine_1: "Helicópteros con motor de sustentación II"
 tech_helicopter_hover_engine_1_desc: "La integración temprana de motores de sustentación (hover) reemplaza la sustentación convencional por rotor con vectorización de empuje compacta, permitiendo un vuelo estable a baja altitud sin palas expuestas. Estas plataformas sacrifican algo de eficiencia a cambio de supervivencia y flexibilidad urbana, haciéndolas más difíciles de detectar y menos vulnerables a las armas ligeras y a los escombros."
 tech_helicopter_hover_engine_2: "Helicópteros con motor de sustentación III"
 tech_helicopter_hover_engine_2_desc: "Una densidad de potencia optimizada y un software de control mejorado hacen que las aeronaves con motor de sustentación sean más receptivas, silenciosas y capaces de transportar cargas útiles significativas. Una mejor gestión térmica y la estabilidad de vuelo amplían su utilidad para operaciones especiales, inserciones rápidas y entornos urbanos disputados."
 tech_helicopter_hover_engine_3: "Helicópteros con motor de sustentación IV"
 tech_helicopter_hover_engine_3_desc: "Los diseños avanzados de motores de sustentación ofrecen una mayor autonomía, mayores márgenes de elevación y un manejo fiable en todo tipo de clima gracias a una sólida automatización y fusión de sensores. Con firmas reducidas y una rápida aceleración, estas aeronaves redefinen los roles de ala rotatoria y permiten una movilidad vertical donde los helicópteros tradicionales estarían demasiado expuestos."
 nsb_drone_artillery_ammo_1: "Munición de artillería asistida por dron II"
 nsb_drone_artillery_ammo_1_desc: "Los proyectiles de artillería tempranos asistidos por drones utilizan guía a bordo y patrones de merodeo simples para corregir su trayectoria hacia los objetivos tras el lanzamiento. Esto incrementa la precisión y la efectividad contra objetivos puntuales, pero eleva el coste unitario en comparación con los proyectiles convencionales."
 nsb_drone_artillery_ammo_2: "Munición de artillería asistida por dron III"
 nsb_drone_artillery_ammo_2_desc: "Los buscadores y enlaces de datos mejorados permiten a las municiones dron recibir actualizaciones de rumbo a mitad de camino y reasignación de objetivos, reduciendo el fuego desperdiciado y permitiendo ataques de respuesta rápida contra objetivos móviles o de tiempo crítico. Un mejor empaquetado y propulsión optimizan el alcance sin sacrificar la precisión."
 nsb_drone_artillery_ammo_3: "Munición de artillería asistida por dron IV"
 nsb_drone_artillery_ammo_3_desc: "Los proyectiles dron avanzados se coordinan con los activos de detección y las redes de control de tiro, lo que permite una rápida transferencia de objetivos, búsquedas cooperativas y perfiles de ataque terminal más inteligentes. Esto convierte a la artillería en un sistema de precisión capaz de cazar, ajustar su trayectoria y acabar con los objetivos bajo la presión de contramedidas electrónicas y fuego de contrabatería."
 special_project_tech_smart_grid: "Red eléctrica inteligente"
 expanded_infantry_weapons_1_desc: "Añadir más armas, con funciones variadas, a nuestras unidades de infantería les dará más opciones a la hora de combatir contra múltiples tipos de unidades enemigas."
 production_line_improvements_1: "Líneas de producción mejoradas I"
 production_line_improvements_1_desc: "Los primeros perfeccionamientos en las líneas de producción industrial se centran en reducir las ineficiencias, mejorar la organización del flujo de trabajo e introducir una automatización básica. Estos cambios aumentan la consistencia de la producción al tiempo que reducen los tiempos de inactividad operativa."
 improved_building_constructions_1: "Enfoque en construcción de plantas I"
 improved_building_constructions_1_desc: "Las mejoras iniciales en la construcción de plantas industriales se centran en una mejor planificación de proyectos, diseños estandarizados y un uso más eficiente de los materiales de construcción."
 tech_rail_guns_5: "Cañones de riel 2060"
 tech_rail_guns_5_desc: "Los cañones de riel de defensa de la flota integran un almacenamiento de energía de alta capacidad, sistemas de recarga rápida y datos de puntería en red, lo que permite a los buques de guerra interceptar salvas de misiles y propulsar ataques cinéticos de largo alcance a gran volumen."
 tech_rail_guns_6: "Cañones de riel 2075"
 tech_rail_guns_6_desc: "Los futuros sistemas de cañones de riel utilizan proyectiles inteligentes adaptativos, control de combate asistido por IA y gestión de energía en todo el buque para proporcionar un apoyo de fuego electromagnético rápido, preciso y sostenido en entornos navales disputados."
 reactor11: "CFR"
 reactor11_desc: "The Compact Fusion Reactor uses high-temperature superconducting magnets strong enough to confine plasma in a vessel a fraction of the size of earlier tokamaks. Its small core is built in a factory and shipped as modules, so fusion plants go up in years instead of decades and fit on sites once used by coal and fission stations."
 reactor12: "Aneutronic Fusion"
 reactor12_desc: "Aneutronic reactors fuse hydrogen with boron-11, releasing almost all of their energy as charged particles instead of neutrons. Without neutron bombardment the reactor walls stay largely free of radioactivity, and the particles are converted straight into electricity with no steam turbines. The fuel needs a far hotter plasma than deuterium-tritium, which kept it out of reach until the last generation of magnet and heating technology."
 special_forces_tech_1: "Fuerzas de operaciones especiales"
 special_forces_tech_1_desc: "Las Fuerzas de Operaciones Especiales son la élite de cualquier ejército en el que figuren, con un entrenamiento más largo y duro que cualquier otro soldado. Son expertos en terrenos difíciles, operaciones aerotransportadas y desembarcos anfibios. Sin embargo, están equipados de forma muy ligera, ya que necesitan operar con gran movilidad detrás de las líneas del frente."
 nsb_SP_arty_5: "ART AP 2045"
 nsb_SP_arty_5_desc: "With its powerful indirect fire abilities, Self-Propelled Artillery provides sustained precision strikes where it's needed on the battlefield, and far beyond visual ranges. It can be reloaded directly by its crew, and its self-propulsion makes it mobile so they can move to avoid counter-strikes by enemy artillery."
 nsb_SP_arty_6: "ART AP 2055"
 nsb_SP_arty_6_desc: "With its powerful indirect fire abilities, Self-Propelled Artillery provides sustained precision strikes where it's needed on the battlefield, and far beyond visual ranges. It can be reloaded directly by its crew, and its self-propulsion makes it mobile so they can move to avoid counter-strikes by enemy artillery."
 nsb_SP_arty_7: "ART AP 2065"
 nsb_SP_arty_7_desc: "With its powerful indirect fire abilities, Self-Propelled Artillery provides sustained precision strikes where it's needed on the battlefield, and far beyond visual ranges. It can be reloaded directly by its crew, and its self-propulsion makes it mobile so they can move to avoid counter-strikes by enemy artillery."
 nsb_SP_arty_8: "ART AP 2075"
 nsb_SP_arty_8_desc: "With its powerful indirect fire abilities, Self-Propelled Artillery provides sustained precision strikes where it's needed on the battlefield, and far beyond visual ranges. It can be reloaded directly by its crew, and its self-propulsion makes it mobile so they can move to avoid counter-strikes by enemy artillery."
 AA_upgrade_5: "Buscadores adaptativos IIR"
 AA_upgrade_5_desc: "Los buscadores infrarrojos por imagen (IIR) adaptativos combinan el reconocimiento digital de objetivos y un rechazo mejorado de contramedidas, lo que permite a los sistemas antiaéreos de corto alcance distinguir las aeronaves de las bengalas, señuelos, drones y fuentes de calor de fondo."
 AA_upgrade_6: "Matrices de buscadores multiespectrales"
 AA_upgrade_6_desc: "Las matrices de buscadores multiespectrales combinan varias bandas ópticas e infrarrojas con un procesamiento a bordo más rápido, mejorando el rastreo de amenazas aéreas pequeñas, rápidas o enmascaradas por el terreno, tales como vehículos aéreos no tripulados (UAV), misiles de crucero y helicópteros."
 AA_upgrade_7: "Fusión de sensores asistida por red"
 AA_upgrade_7_desc: "La fusión de sensores asistida por red vincula los generadores de imágenes de los misiles con flujos de datos externos de radar, ópticos y de campo de batalla, mejorando la identificación de objetivos y la estabilidad del blocaje tanto para misiles lanzados desde el hombro (MANPADS) como para montajes antiaéreos de vehículos blindados."
 nsb_AA_upgrade_5: "Buscadores adaptativos IIR"
 nsb_AA_upgrade_5_desc: "Los buscadores infrarrojos por imagen (IIR) adaptativos combinan el reconocimiento digital de objetivos y un rechazo mejorado de contramedidas, lo que permite a los sitemas antiaéreos de corto alcance distinguir las aeronaves de las bengalas, señuelos, drones y fuentes de calor de fondo."
 nsb_AA_upgrade_6: "Matrices de buscadores multiespectrales"
 nsb_AA_upgrade_6_desc: "Las matrices de buscadores multiespectrales combinan varias bandas ópticas e infrarrojas con un procesamiento a bordo más rápido, mejorando el rastreo de amenazas aéreas pequeñas, rápidas o enmascaradas por el terreno, tales como vehículos aéreos no tripulados (UAV), misiles de de crucero y helicópteros."
 nsb_AA_upgrade_7: "Fusión de sensores asistida por red"
 nsb_AA_upgrade_7_desc: "La fusión de sensores asistida por red vincula los generadores de imágenes de los misiles con flujos de datos externos de radar, ópticos y de campo de batalla, mejorando la identificación de objetivos y la estabilidad del blocaje tanto para misiles lanzados desde el hombro (MANPADS) como para montajes antiaéreos de vehículos blindados."
 AT_upgrade_5: "Municiones antitanque en red"
 AT_upgrade_5_desc: "Las municiones antitanque en red combinan guiado de 'dispara y olvida', capacidad de blocaje tras el lanzamiento y transferencia externa de objetivos, lo que permite a los lanzadores entablar combate contra el blindaje moderno desde posiciones de disparo ocultas, indirectas o que cambian rápidamente."
 AT_upgrade_6: "Municiones de redireccionamiento multiespectral"
 AT_upgrade_6_desc: "Las municiones de redireccionamiento multiespectral utilizan buscadores infrarrojos, visuales y de baja luminosidad con control por operador (man-in-the-loop), lo que permite a los artilleros identificar, redirigir o abortar ataques contra blindados en movimiento, señuelos y objetivos ocultos."
 AT_upgrade_7: "Municiones de ataque contra APS"
 AT_upgrade_7_desc: "Las municiones de ataque contra sistemas de protección activa (APS) utilizan trayectorias de vuelo adaptativas, sincronización del momento del impacto y ángulos de ataque seleccionables para reducir la probabilidad de interceptación por parte de los APS y golpear las secciones más vulnerables del blindaje."
 AS_upgrade_4: "Control asistido por IA"
 AS_upgrade_4_desc: "La incorporación de sistemas de IA permite una mejor eficiencia operativa."
 AS_upgrade_5: "Control asistido por IA II"
 AS_upgrade_5_desc: "La incorporación de sistemas de IA permite una mejor eficiencia operativa."
 AS_upgrade_6: "Control asistido por IA III"
 AS_upgrade_6_desc: "La incorporación de sistemas de IA permite una mejor eficiencia operativa."
 MR_upgrade_4: "Control asistido por IA"
 MR_upgrade_4_desc: "La incorporación de sistemas de IA permite una mejor eficiencia operativa."
 MR_upgrade_5: "Control asistido por IA II"
 MR_upgrade_5_desc: "La incorporación de sistemas de IA permite una mejor eficiencia operativa."
 MR_upgrade_6: "Control asistido por IA III"
 MR_upgrade_6_desc: "La incorporación de sistemas de IA permite una mejor eficiencia operativa."
 microchip_production_6: "Producción de chips del futuro II"
 microchip_production_6_desc: "La producción mejorada de chips introduce suministro de energía posterior (backside power delivery), arquitecturas de transistores refinadas y los primeros procesos de fabricación a escala de ángstroms, aumentando el rendimiento al tiempo que reduce la pérdida de energía y la generación de calor."
 microchip_production_7: "Producción de chips del futuro III"
 microchip_production_7_desc: "La litografía de próxima generación, fotorresistencias avanzadas y un control de procesos más estricto permiten a las fundiciones imprimir circuitos con rasgos más finos y menos defectos, optimizando el rendimiento de fabricación y haciendo viables procesadores de alto rendimiento más complejos."
 microchip_production_8: "Producción de chips del futuro IV"
 microchip_production_8_desc: "La producción heterogénea de chips combina lógica, memoria, sensores y aceleradores a través de diseños basados en chiplets y empaquetado avanzado, lo que permite integrar componentes especializados en potentes procesadores modulares."
 microchip_production_9: "Producción de chips del futuro V"
 microchip_production_9_desc: "La fabricación tridimensional de semiconductores apila capas activas, memoria e interconexiones de manera vertical, lo que incrementa enormemente la densidad informática a la vez que exige técnicas avanzadas de refrigeración, unión de obleas y control de defectos."
 microchip_production_10: "Producción de chips del futuro VI"
 microchip_production_10_desc: "Las fundiciones del futuro, completamente automatizadas, utilizan un ajuste de procesos controlado por IA, materiales semiconductores novedosos e integración 3D de ultra alta densidad para producir chips estratégicos con un rendimiento, eficiencia y precisión de fabricación extremos."
 internet_access_4: "Acceso a internet por satélite avanzado"
 internet_access_4_desc: "Con los satélites volviéndose cada vez más predominantes en las comunicaciones y otras formas de transferencia de datos, internet es uno de los servicios que ha capitalizado el acceso satelital, lo que abre la posibilidad de que cada vez más personas estén conectadas a la red."
 internet_access_5: "Acceso a internet por satélite de vanguardia"
 internet_access_5_desc: "Con los satélites volviéndose cada vez más predominantes en las comunicaciones y otras formas de transferencia de datos, internet es uno de los servicios que ha capitalizado el acceso satelital, lo que abre la posibilidad de que cada vez más personas estén conectadas a la red."
 internet_access_6: "Acceso temprano a internet cuántico"
 internet_access_6_desc: "El acceso temprano a internet cuántico conecta redes de investigación, militares y gubernamentales limitadas a través de enlaces de comunicación cuánticos seguros, utilizando la distribución de entrelazamiento y el intercambio de claves cuánticas para proteger datos críticos."
 internet_access_7: "Acceso avanzado a internet cuántico"
 internet_access_7_desc: "El acceso avanzado a internet cuántico expande los repetidores cuánticos, la memoria cuántica y los enlaces de fibra y satélite, lo que permite una comunicación segura a larga distancia y una detección cuántica distribuida temprana a través de redes estratégicas."
 internet_access_8: "Acceso a internet cuántico de vanguardia"
 internet_access_8_desc: "El acceso a internet cuántico de vanguardia vincula computadoras cuánticas, sensores y nodos de comunicación seguros en una red más amplia, permitiendo la computación distribuida, la detección de precisión y comunicaciones estratégicas altamente resilientes."
 artificial_intelligence_1: "Renacimiento de las redes neuronales"
 artificial_intelligence_1_desc: "Las redes neuronales han existido desde finales del siglo XIX como una teoría para utilizar el poder de procesamiento del cerebro para mejorar a la humanidad. Deberíamos revivir esta idea para perfeccionar nuestras computadoras y nuestra búsqueda de la inteligencia artificial."
 artificial_intelligence_2: "Minería de datos"
 artificial_intelligence_2_desc: "La minería de datos es la práctica de examinar grandes bases de datos para generar nueva información. Esta práctica puede ayudar a mejorar nuestra capacidad para desarrollar y optimizar nuestro nivel tecnológico."
 artificial_intelligence_3: "Aprendizaje automático"
 artificial_intelligence_3_desc: "El desarrollo de la teoría del aprendizaje automático (Machine Learning) radica, en su esencia, en la capacidad de un algoritmo informático para mejorar automáticamente a través de la experiencia. Desarrollar esto dentro de nuestros protocolos de IA puede permitirles aprender nuevas tareas industriales más rápido, así como mejorar la investigación y el desarrollo."
 artificial_intelligence_4: "Máquinas sociables"
 artificial_intelligence_4_desc: "Las máquinas sociables constituyen un entorno que comprende a seres humanos y tecnología interactuando y produciendo resultados o acciones que no serían posibles sin la presencia de ambos."
 artificial_intelligence_5: "Robótica con IA temprana"
 artificial_intelligence_5_desc: "Artificial intelligence in robotics has been limited since the recent inception of machine learning and other forms of AI. The introduction of AI within industrial and other forms of robotics will allow the robots to improve their productivity."
 artificial_intelligence_6: "IA avanzada"
 artificial_intelligence_6_desc: "Una IA más avanzada que pueda registrar y adaptarse rápidamente a las situaciones puede marcar toda la diferencia."
 artificial_intelligence_7: "Aprendizaje profundo moderno"
 artificial_intelligence_7_desc: "El aprendizaje profundo (Deep Learning) es un subconjunto del aprendizaje automático que es capaz de aprender de forma no supervisada a partir de datos no estructurados o no etiquetados. Su funcionamiento interno es una funcionalidad de IA que imita el funcionamiento del cerebro humano en el procesamiento de datos para su uso en la detección de objetos y la toma de decisiones."
 artificial_intelligence_8: "IA de imitación humana"
 artificial_intelligence_8_desc: "La IA de imitación humana utiliza grandes redes neuronales y aprendizaje profundo para generar lenguaje, imágenes, decisiones y comportamientos similares a los humanos, permitiendo a las máquinas realizar tareas que antes requerían el juicio humano directo."
 artificial_intelligence_9: "Entrenamiento de IA a gran escala"
 artificial_intelligence_9_desc: "El entrenamiento de IA a gran escala utiliza conjuntos de datos masivos, aceleradores especializados y clústeres de computación distribuida para crear modelos fundacionales capaces de razonar, traducir, planificar, analizar y lograr el reconocimiento multimodal."
 artificial_intelligence_10: "Algoritmos avanzados de autoaprendizaje"
 artificial_intelligence_10_desc: "Los algoritmos avanzados de autoaprendizaje permiten que los sistemas de IA mejoren a través de la simulación, la retroalimentación y la experimentación autónoma, reduciendo la necesidad de un reentrenamiento humano constante y del diseño manual de reglas."
 artificial_intelligence_11: "Inteligencia Artificial General"
 artificial_intelligence_11_desc: "La inteligencia artificial general (AGI) puede transferir conocimientos a través de muchos dominios, resolver problemas desconocidos y coordinar tareas complejas con una flexibilidad a nivel humano, en lugar de limitarse a funciones especializadas y estrechas."
 artificial_intelligence_12: "Coordinación de mente colmena de IA"
 artificial_intelligence_12_desc: "La coordinación de mente colmena de IA vincula múltiples sistemas de IA especializados en una red de decisión compartida, lo que les permite intercambiar datos, dividir tareas y coordinar operaciones militares, industriales y logísticas en tiempo real."
 artificial_intelligence_13: "Superinteligencia artificial"
 artificial_intelligence_13_desc: "La superinteligencia artificial supera el rendimiento a nivel humano en investigación, estrategia, ingeniería y administración, lo que permite a los sistemas automatizados gestionar enormes cargas de trabajo y descubrir soluciones más allá de la capacidad humana normal."
 artificial_intelligence_14: "Superinteligencia cuántica"
 artificial_intelligence_14_desc: "La superinteligencia cuántica combina arquitecturas avanzadas de IA con computación acelerada cuánticamente, permitiendo la optimización a escala extrema, la simulación, el análisis criptográfico y la planificación estratégica más allá de la inteligencia de las máquinas clásicas."
 robotics_1: "Robot humanoide"
 robotics_1_desc: "La base del temor de muchas personas es también el fundamento de grandes avances en la robótica basada en IA. La llegada de varios robots de tipo 'humanoide' ha demostrado que se pueden automatizar mejor ciertos trabajos que normalmente consistirían en tareas rutinarias y mundanas."
 robotics_2: "Robótica industrial avanzada"
 robotics_2_desc: "Introducir una IA aún más sofisticada en nuestra robótica comercial e industrial puede mejorar la calidad, la entrega y la velocidad de nuestros productos y de nuestra producción."
 robotics_3: "Drones inteligentes"
 robotics_3_desc: "Los drones suelen estar tripulados por al menos una o dos personas que se encuentran a kilómetros de distancia. Si empezamos a instalar inteligencia artificial a bordo, podemos reducir el requisito de mano de obra a una sola persona o, en el futuro, a nadie, dejando que los sistemas informatizados tripulen estos drones."
 robotics_4: "Drones completamente automatizados"
 robotics_4_desc: "Los drones completamente automatizados solían ser cosa del futuro. Ahora podemos gestionar la logística y mucho más con drones totalmente autónomos para ir del punto A al punto B."
 robotics_5: "Nanorobots"
 robotics_5_desc: "Los nanorobots representan el concepto de máquinas o robots pequeños a una escala cercana o igual a la de un nanómetro. Los nanorobots podrían tener uso en muchos campos, desde la medicina o, en algunos casos, el combate en situaciones de deconstrucción."
 robotics_6: "Nanorobots médicos"
 robotics_6_desc: "Los nanorobots utilizados en conjunto con el campo médico pueden emplearse para atacar células específicas, virus y bacterias para combatir enfermedades u otras infecciones potencialmente mortales."
 robotics_7: "Drones controlados por IA"
 robotics_7_desc: "Los drones pueden esquivar perfectamente cualquier obstáculo y comunicarse con otras máquinas a su alrededor para maximizar la eficiencia logística."
 robotics_8: "Industria 4.0"
 robotics_8_desc: "La robótica ha llevado por completo la cuarta revolución industrial a todas las áreas de la humanidad."
 robotics_9: "Bots de IA médica avanzada"
 robotics_9_desc: "Estas IA pueden encargarse de cualquier enfermedad. Controlan un ejército de nanorobots e incluso pueden combatir los mecanismos del envejecimiento en los seres humanos."
 robotics_10: "Robótica cuántica"
 robotics_10_desc: "Quantum computing in robots reduces response time to near immediate, introducing precise micro-management of production chains."
 robotics_11: "Centros industriales superinteligentes"
 robotics_11_desc: "Parques industriales enteros pueden ser gestionados ahora por supervisores individuales con superinteligencia artificial."
 printing_1: "Estereolitografía"
 printing_1_desc: "La estereolitografía es una forma de impresión 3D que se utiliza principalmente para crear modelos, prototipos, patrones y piezas de producción capa por capa mediante procesos fotoquímicos."
 printing_2: "Primeras impresoras 3D"
 printing_2_desc: "La impresión 3D temprana resultó adecuada para crear prototipos funcionales o estéticos. Este proceso se denomina 'prototipado rápido'."
 printing_3: "Impresora 3D de cera"
 printing_3_desc: "Una impresora 3D de cera utiliza cera y otras formas de materiales termoplásticos."
 printing_4: "Impresión 3D a gran escala"
 printing_4_desc: "Escalar la impresión 3D a una dimensión mucho mayor puede ayudarnos a simplificar y expandir nuestra producción de artículos a pequeña escala como tornillos y clavos, o a fabricar artículos detallados que son insustituibles en el mercado."
 printing_5: "Impresora 3D autorreplicante"
 printing_5_desc: "Las impresoras 3D autorreplicantes están diseñadas para ayudar a producir y expandir el avance de la producción."
 printing_6: "Fabricación comercial"
 printing_6_desc: "La impresión 3D ha estado extremadamente limitada en el espacio comercial. Expandir las capacidades de la impresión 3D para incluir esta modalidad ayudará significativamente a nuestra capacidad de avanzar."
 printing_7: "Impresión 3D moderna"
 printing_7_desc: "Los avances en la impresión 3D nos han permitido cambiar los materiales para que sean más fuertes y eficientes."
 printing_8: "Nanofibras impresas en 3D"
 printing_8_desc: "Imprimir nanofibras puede ayudarnos a generar materiales más fuertes de lo que hemos sido capaces de producir hasta ahora, controlando cada nanita individual."
 printing_9: "Fabricación de nanocelulosa a gran escala"
 printing_9_desc: "Expandir la fabricación de nanocelulosa para que sea a gran escala nos puede ayudar a desarrollar elementos a un ritmo mucho más rápido."
 printing_10: "Nanocelulosa en la medicina"
 printing_10_desc: "El uso de nanocelulosa en la medicina puede ayudar a mejorar las tasas de supervivencia de pacientes con enfermedades debilitantes."
 printing_11: "Impresoras de construcción"
 printing_11_desc: "Los edificios se pueden construir utilizando impresoras capaces de producir materiales en el propio terreno, reduciendo los costes logísticos."
 printing_12: "Bioimpresión"
 printing_12_desc: "Combinar los avances en la biotecnología y la impresión 3D permite la fabricación de órganos enteros."
 printing_13: "Impresoras de micro a macro"
 printing_13_desc: "Las impresoras 3D se han vuelto tan versátiles que se pueden aplicar en todas las áreas de la vida humana, abarcando desde la producción de nanofibras hasta la construcción de edificios enteros."
 nanofibers_1: "Nanofibras poliméricas industriales electrohiladas"
 nanofibers_1_desc: "El electrohilado (electrospinning) de nanofibras es una de las formas más comunes de fabricarlas. Aumentar la producción nos permitirá producir más y con mayor frecuencia."
 nanofibers_2: "Nanotubos de carbono de pared múltiple"
 nanofibers_2_desc: "Los nanotubos se utilizan como conductores en aparatos eléctricos, antenas de radio y otros dispositivos electromagnéticos."
 nanofibers_3: "Electrohilado moderno"
 nanofibers_3_desc: "El electrohilado es un método de producción de fibras que utiliza la fuerza eléctrica para extraer hilos cargados de soluciones poliméricas o polímeros fundidos hasta alcanzar diámetros de fibra del orden de unos cientos de nanómetros."
 nanofibers_4: "Fabricación de fibras inorgánicas"
 nanofibers_4_desc: "El electrohilado se considera una de las técnicas más sencillas y eficaces para fabricar cantidades masivas de nanomateriales, logrando electrohilar con éxito diversas micro y nanofibras inorgánicas."
 nanofibers_5: "Producción industrial de nanofibras"
 nanofibers_5_desc: "Las nanofibras electrohiladas son objeto de un amplio estudio y sus aplicaciones potenciales están más que demostradas. Los equipos de electrohilado, las soluciones tecnológicas y los materiales electrohilados avanzan rápidamente hacia la comercialización. Empresas dedicadas a ello suministran componentes y aparatos a escala de laboratorio e industrial para el electrohilado."
 nanofibers_6: "Nanofibras en la medicina"
 nanofibers_6_desc: "Las nanofibras muestran un gran potencial en aplicaciones biomédicas y sanitarias debido a su combinación única de propiedades y funcionalidades intrínsecas. Entre las aplicaciones biomédicas importantes de las nanofibras se incluyen la filtración, los textiles médicos, la cicatrización de heridas, la ingeniería y regeneración de tejidos, los biosensores y la administración de fármacos."
 nanofibers_7: "Hilado centrífugo"
 nanofibers_7_desc: "La utilización de una configuración de alto voltaje y la baja tasa de producción se han convertido en barreras para el uso de técnicas de electrohilado en la producción a gran escala de nanofibras. El hilado centrífugo es un enfoque eficiente para producir nanofibras a partir de diversos materiales."
