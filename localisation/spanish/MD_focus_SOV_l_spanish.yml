 SOV_bars_close: "§GCerrar§! los §YBARS§!"
 SOV_first_bars_start: "§YBARS 1§! - Kuban Cossack Detachment Named After Z. Chepega"
 SOV_first_bars_start_desc: "Formado en el territorio de Kuban por voluntarios cosacos."
 SOV_second_bars_start: "§YBARS 2§! - Voluntarios de Yakutia"
 SOV_third_bars_start: "§YBARS 3§! - Rodina"
