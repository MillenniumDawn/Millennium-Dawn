 ENG_create_new_faction_TT: "새로운 세력을 창설합니다: 대서양 안보 기구\n\n[ADS.GetFlag] 알비오니스를 이용해 외국 정부를 전복할 수 있게 됩니다!\n - 이 능력은 3회 사용할 수 있으며, 영향력 메뉴의 쿠데타 버튼을 통해 사용할 수 있습니다. 유럽의 해당 정부를 [ADS.GetFlag] 알비오니스로 전복하고 괴뢰국이자 동맹으로 삼을 수 있는 추가 선택지가 나타납니다."
 ENG_collapse_of_society_TT: "£text_icon_kaldanger 이 선택지를 고르면 정부가 전복될 수 있습니다!\n - §H분열된 왕국, 통합된 국가§! 중점을 진행할 수 있게 됩니다\n - 일정 시점이 지나면 군부가 개입하여 국가를 장악합니다"
 ENG_do_fp_TT: "£GFX_text_icon_uk_flag 외교 정책 중점을 최소 §H3§!개 완료했음"
 ENG_core_desc_TT: "경제, 군사, 정치 패권을 달성하면 영연방의 주요 3개국에 우리가 그들을 뒷받침하고 보호할 수 있음을 보여줄 수 있습니다. 또한 우리의 여건이 더 좋으면 그 구성원들도 우리와 합류하려는 의향이 더 커질 것입니다."
 ENG_econ_hegemony_TT: "'돈이면 다 해결된다'\n\n경제 패권을 달성하면 영연방 국가를 비롯한 다른 경제권을 통합하기에 유리한 위치에 서게 됩니다. 이를 위해 필요한 조건은 다음과 같습니다.\n\n3개국 합산보다 높은 GDP\n- 우리의 GDP는 현재 $[?gdp_total|1]b입니다\n- 그들의 GDP는 현재 $[?commonwealth_total_gdp|1]b입니다"
 ENG_military_hegemony_TT: "'강한 군대가 곧 강한 통치다'\n\n군사 패권을 달성하면 우리가 영토와 국민을 방어할 능력이 있음을 보여줄 좋은 입지를 얻게 됩니다. 이를 위해 필요한 조건은 다음과 같습니다.\n\n3개국 합산보다 많은 배치 인력\n- 우리는 현재 [?ENG.deployed_army_manpower_k] (천 명)의 병력을 배치하고 있습니다\n- 그들은 현재 [?commonwealth_total_army] (천 명)의 병력을 배치하고 있습니다"
 ENG_political_hegemony_TT: "'뒤에서 줄을 당기는 것만으로 충분하다'\n\n정치 패권을 달성하면 웨스트민스터의 통치가 안정적이고, 연결되어 있으며, 모든 계층의 모든 국민과 소통하고 있음을 보여줄 수 있습니다. 이를 위해 필요한 조건은 다음과 같습니다.\n\n강력한 영향권\n- 3개국 모두에서 영향력 50% 이상"
 ENG_tooltip_TT: "경제 패권의 모든 요건을 충족했음"
 ENG_tooltip2_TT: "군사 패권의 모든 요건을 충족했음"
