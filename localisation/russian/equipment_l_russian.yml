 ITA_infantry_weapons_2: "AR70/223"
 ITA_infantry_weapons_2_desc: ""
 ITA_infantry_weapons_3: "AR70/90"
 ITA_infantry_weapons_3_desc: "Beretta AR70/90 — газоотводная штурмовая винтовка под патрон 5,56x45 мм НАТО, являющаяся стандартным штатным оружием Вооружённых сил Италии. Оружие также рассчитано на применение винтовочных гранат и оснащено гранатомётными прицелами."
 ITA_infantry_weapons_4: "SCP70/90"
 ITA_infantry_weapons_4_desc: "были приняты на вооружение варианты SC70/90 (специальный карабин) со складным прикладом, в основном используемые альпийскими войсками, и винтовка SCP70/90 (специальный карабин для парашютистов) для десантников со складным затыльником и более коротким, чем у SC, стволом, что позволяет убирать её в чехол для оружия, используемый при прыжках с парашютом."
 ITA_infantry_weapons_5: "ARX160"
 ITA_infantry_weapons_5_desc: "Beretta ARX160 — итальянская модульная штурмовая винтовка производства Beretta. Разработанная для Вооружённых сил Италии в рамках программы Soldato Futuro («Солдат будущего»), ARX160 была выпущена в 2008 году как коммерческая система вооружения, независимая от комплекта Soldato Futuro, вместе с однозарядным низкоскоростным гранатомётом 40x46 мм НАТО GLX160, который может устанавливаться под винтовкой или использоваться со специальным прикладом в качестве самостоятельного оружия."
 ITA_infantry_weapons_6: "ARX160A3"
 ITA_infantry_weapons_6_desc: "Beretta ARX160 A3 — это улучшенный вариант ARX160, который отличается некоторыми конструктивными изменениями. Изменения включают переработанный дизайн цевья, где прорези для выпуска воздуха в верхнем ряду были заменены на более крупные квадратные вырезы, хотя в вентиляционном отверстии нижнего ряда по-прежнему сохранены более тонкие прорези. Эти вырезы большего размера несколько уменьшают вес винтовки, позволяя большему количеству воздуха циркулировать вокруг ствола."
