 EU_news.52.t: "Résultat de l'élection [THIS.GetAdjFS] du Parlement européen de [GetYear]"
 EU_news.52.d: "This is the vote of the [THIS.GetAdjective] people. The [THIS.GetAdjective] political parties will send the following MEP to the European Parliament:\n [THIS.Western_Autocracy_L_icon] [?THIS.MEP_party_array^0], [THIS.conservatism_L_icon] [?THIS.MEP_party_array^1], [THIS.liberalism_L_icon] [?THIS.MEP_party_array^2], [THIS.socialism_L_icon] [?THIS.MEP_party_array^3], [THIS.communist_state_L_icon] [?THIS.MEP_party_array^4], [THIS.anarchist_communism_L_icon] [?THIS.MEP_party_array^5], [THIS.Conservative_L_icon] [?THIS.MEP_party_array^6], [THIS.Autocracy_L_icon] [?THIS.MEP_party_array^7], [THIS.Mod_Vilayat_e_Faqih_L_icon] [?THIS.MEP_party_array^8], [THIS.Vilayat_e_Faqih_L_icon] [?THIS.MEP_party_array^9], [THIS.Kingdom_L_icon] [?THIS.MEP_party_array^10], [THIS.Caliphate_L_icon] [?THIS.MEP_party_array^11], [THIS.Neutral_Muslim_Brotherhood_L_icon] [?THIS.MEP_party_array^12], [THIS.Neutral_Autocracy_L_icon] [?THIS.MEP_party_array^13], [THIS.Neutral_conservatism_L_icon] [?THIS.MEP_party_array^14], [THIS.oligarchism_L_icon] [?THIS.MEP_party_array^15], [THIS.Neutral_Libertarian_L_icon] [?THIS.MEP_party_array^16], [THIS.Neutral_green_L_icon] [?THIS.MEP_party_array^17], [THIS.neutral_Social_L_icon] [?THIS.MEP_party_array^18], [THIS.Neutral_Communism_L_icon] [?THIS.MEP_party_array^19], [THIS.Nat_Populism_L_icon] [?THIS.MEP_party_array^20], [THIS.Nat_Fascism_L_icon] [?THIS.MEP_party_array^21], [THIS.Nat_Autocracy_L_icon] [?THIS.MEP_party_array^22], [THIS.Monarchist_L_icon] [?THIS.MEP_party_array^23]"
 EU_news.52.a: "D'accord"
 EUU_idea_gdpr: "Règlement Général sur la Protection des Données"
 EUU_idea_gdpr_desc: "Le §YRèglement Général sur la Protection des Données§! (RGPD) est le règlement de l'Union européenne concernant la confidentialité des informations au sein de l'Union européenne et de l'Espace économique européen (EEE). Il est considéré comme une composante importante de la législation de l'UE en matière de protection de la vie privée et des droits de l'homme, et en particulier de l'article 8, paragraphe 1, de la §YCharte des droits fondamentaux de l'Union européenne§!. L'objectif principal du règlement est de renforcer le contrôle de l'individu sur ses données et informations personnelles et de simplifier les réglementations à des fins commerciales internationales."
 foreign_data_kraken: "Kraken de données étrangères"
 foreign_data_kraken_desc: "Le Kraken de données étrangères représente l'ensemble des lois qui ont précédé le Règlement Général sur la Protection des Données (RGPD). Cet ensemble de lois comportait plusieurs ouvertures et lacunes qui sont problématiques pour la sécurité à long terme des États membres de l'Union européenne."
 EU_copyright: "Directive sur le droit d'auteur dans le marché unique numérique"
 EU_copyright_desc: "La §YDirective sur le droit d'auteur dans le marché unique numérique§! est une directive de l'Union européenne qui a été adoptée pour garantir le bon fonctionnement du marché du droit d'auteur. Elle étend le droit d'auteur de l'Union européenne à un marché numérique unique."
 asylum_shopping: "Marchandage d'asile"
 asylum_shopping_desc: "Asylum seekers from all across the world continue to shop around the European Union for the most favorable asylum nation. It causes bureaucratic drain all across the European Union and it should be something we seek to remedy as soon as possible."
 relocation_asylum_seekers: "Relocalisation et réinstallation des demandeurs d'asile"
 relocation_asylum_seekers_desc: "Nous avons décidé de relocaliser et de réinstaller les demandeurs d'asile afin de limiter le nombre de migrants. Nous devons rechercher une solution plus permanente à ce problème croissant."
 EU_Turkey_deal: "Accord UE-Turquie"
 EU_Turkey_deal_desc: "L'Accord UE-Turquie vise à réduire le nombre de personnes voyageant de manière irrégulière de la Turquie vers les îles grecques. Il s'agit d'un accord monumental visant à freiner l'immigration clandestine dans l'Union européenne, mais il reste à voir s'il permettra d'endiguer la vague de demandeurs d'asile."
 European_Asylum_Agency: "Agence européenne pour l'asile"
 European_Asylum_Agency_desc: "L'§YAgence européenne pour l'asile§! est une agence de l'Union européenne chargée de renforcer la coopération entre les États membres de l'Union européenne en matière d'asile, d'améliorer la mise en œuvre du Système commun d'asile européen et de soutenir les États membres soumis à la pression des demandeurs d'asile."
 Frontex: "Frontex"
 Frontex_desc: "L'Agence européenne de garde-frontières et de garde-côtes, communément appelée Frontex, est une agence de l'Union européenne. En coordination avec les gardes-frontières et les gardes-côtes des États membres, elle exerce le contrôle des frontières de l'espace Schengen européen."
 European_Defence_Fund: "Fonds européen de la défense"
 European_Defence_Fund_desc: "Le §YFonds européen de la défense§! est l'une des composantes de la Politique de sécurité et de défense commune (PSDC) de l'Union européenne. La PSDC vise à coordonner et à accroître les investissements nationaux dans la recherche en matière de défense et l'interopérabilité entre les forces armées nationales des États membres de l'Union européenne. Le FED, en particulier, est un programme qui finance des projets de défense en collaboration."
 European_Security_Council: "Conseil européen de la sécurité"
 European_Security_Council_desc: "Le §YConseil européen de la sécurité§! est un conseil de sécurité qui vise à aider l'Union européenne à penser et à agir stratégiquement dans tout événement où l'Union européenne est impliquée, de manière rapide et efficace."
 EUU_cfr_eu: "Charte des droits fondamentaux de l'Union européenne"
 EUU_cfr_eu_desc: "The §YCharter of Fundamental Rights of the European Union§! enshrines political, social and economic rights for the European Union citizens and residents into European Law. The charter forms part of the area of freedom, security and justice (AFSJ) policy domain of the European Union. It applies to all bodies of the European Union and Euratom which must act and legislate by its provisions."
 european_spirit: "Esprit européen"
 european_spirit_desc: "À jamais, nous sommes plus forts unis que divisés. Nous devons continuer à renforcer l'Union européenne pour le bien de notre continent et du monde entier."
 ECB_zero_interest_rate_policy: "Politique de taux d'intérêt zéro de la BCE"
 ECB_zero_interest_rate_policy_desc: "La politique de taux d'intérêt zéro de la BCE fait partie des concepts macroéconomiques développés par la Banque centrale européenne pour mettre en œuvre les décisions de politique monétaire qu'elle a définies. La politique de taux d'intérêt zéro de la BCE a fait l'objet de certaines critiques car elle est souvent associée à une croissance économique lente, à la déflation et au désendettement."
 EUU_national_dept_crisis_eu: "Crise de la dette nationale"
 EUU_national_dept_crisis_eu_desc: "La grande récession aux États-Unis d'Amérique continue d'avoir des répercussions dans de nombreuses régions du monde. La crise de la dette nationale en Europe n'est qu'un exemple de cet effet de vague. La dette croissante de notre pays commence à menacer l'euro dans son ensemble."
 european_debt_crisis: "Crise de la dette européenne"
 european_debt_crisis_desc: "La grande récession aux États-Unis d'Amérique continue d'avoir des répercussions dans de nombreuses régions du monde. Plusieurs États membres de l'Union européenne sont en proie à des difficultés à la suite de la grande récession."
 euro_bonds: "Euro-obligations"
 euro_bonds_desc: "Les euro-obligations constituent une nouvelle option pour le financement de la dette publique. L'émission d'euro-obligations aux membres de la zone euro pour les aider à financer leur dette, et des opportunités d'investissement liquides pour les épargnants qui rivalisent avec le marché obligataire américain."
 euro_rescue_package: "Plan de sauvetage de l'euro"
 euro_rescue_package_desc: "La Banque centrale européenne a mis en place un plan de sauvetage pour tenter d'endiguer la crise de la dette et de la ramener sous contrôle. Il s'agit d'une mesure coûteuse, mais qui devrait stabiliser la situation économique actuelle de la zone euro."
 fiscal_union: "Union fiscale"
 fiscal_union_desc: "L'établissement d'une union fiscale pour l'Union européenne nous permettra de partager davantage un budget commun. Elle renforce le sentiment croissant d'unité au sein de l'Union européenne et les concessions qui sont faites pour faire avancer l'Union dans son ensemble."
 European_Economic_Government: "Gouvernement économique européen"
 European_Economic_Government_desc: "La création du gouvernement économique européen a créé un précédent et donné à l'ensemble de [EUU.GetFlag][EUU.GetNameDef] la possibilité de mettre en place une autorité fiscale et de fixer des objectifs de dépenses pour les États membres."
 withdrawal_treaty: "Traité de retrait"
 withdrawal_treaty_desc: "Alors que nous nous retirons de l'Union européenne, nous avons conclu un traité de retrait qui nous permet de sortir de l'Union européenne en maintenant des accords commerciaux ainsi que d'autres concessions politiques sur la table."
 no_deal_exit: "Sortie sans accord"
 no_deal_exit_desc: "Nous avons opté pour une sortie sans accord. Nous n'avons pas réussi à nous mettre d'accord sur les modalités de la sortie de notre pays de l'Union européenne."
 austerity: "Austérité"
 austerity_desc: "Nous avons atteint les objectifs des réformes de la troïka de la Commission européenne. Nous avons réalisé l'austérité pour le bien de notre nation et, à ce titre, notre économie continue de se stabiliser."
 EUU_voting_rights_suspended: "Suspension des droits de vote de l'UE au Conseil"
 EUU_voting_rights_suspended_desc: "Nos droits de vote au sein de l'Union européenne ont été suspendus en raison de violations répétées des valeurs européennes. Il est temps que nous changions la direction que nous donnons à notre pays ou que nous envisagions de quitter l'Union."
 EUU_subsidies_suspended: "Suspension des subventions de l'UE"
 EUU_subsidies_suspended_desc: "Les subventions de l'Union européenne dont nous profitions sont désormais suspendues. Il faudra s'habituer à ce changement soudain dans notre budget et nous devrions chercher à remédier à la situation pour profiter à nouveau des subventions qui nous sont allouées."
 euro_army: "Armée européenne"
 euro_navy: "Marine européenne"
 EU_office_category: "Bureaux de l'Union européenne"
 EU_office_category_desc: "Les principaux bureaux de [EUU.GetFlag] l'Union européenne :\n\n[EU_commission_president_Loc][EU_council_president_Loc][EU_foreign_minister_Loc][EU_parliament_president_Loc][ECB_president_Loc][EU_finance_minister_Loc][frontex_ExDir_Loc][EuroArmy_SC_Loc][EuroNavy_SC_Loc][EU_ambassador_UNSC_Loc][EU_president_Loc]\n\n[POTEF_polls_loc]"
 EU_Tech_Share_name: "Agence européenne de défense (AED)"
 EU_Tech_Share_desc: "Les États membres unissent leurs efforts de recherche. L'Agence européenne de défense (AED) coordonne les efforts des États membres de l'Union européenne."
 tooltip_ECB_Start_OMT_effect: "§GClic gauche :§! Le §Yprogramme OMT§! devient disponible.\n\n§GClic droit :§! §YLimite de taille des OMT§! > 0 $."
 tooltip_ECB_adjust_OMT_limit_effect: "§GClic gauche :§! §YLimite de taille des OMT§! : Ajoute §G+200 milliards§! de $200§! billion.\nAll member states with §Yinterest rate§! < §R4.0%§!: Add §R+5%§! Euroscepticism.\n\n§GOn Right Click:§! §YOMT Size Limit§!: Add §R-$.\nTous les États membres dont le §Ytaux d'intérêt§! est < §R4,0 %§! : Ajoute §G-5 %§! d'euroscepticisme.\n"
 tooltip_ECB_Outright_Monetary_Transactions_available: "§YLimite de taille des OMT§! > 0 $."
 tooltip_ECB_Outright_Monetary_Transactions_complete_effect: "All member states with §Yinterest rate§! > §R4.0%§!: Debt is reduced till §Yinterest rate§! < §R4.0%§! AND §GOMT Size Limit§! > §BOMT Total Value§!.\n"
 tooltip_ECB_Outright_Monetary_Transactions_remove_effect: "Tous les États membres dont le §Bcompte d'OMT§! est > à 0 $ : §RAjoute§! le §Bcompte d'OMT§! à la dette.\n"
 EU_exit_category: "Retrait de l'Union européenne"
 EU_exit_category_desc: "Avec la montée de l'euroscepticisme dans toute l'Union, certains États membres envisageront de quitter §C[EUU.GetFlag] l'Union européenne§!."
 Article_50: "[THIS.GetNameDefCap] a invoqué l'article 50"
 EU_Article_50: "Quittez l'Union européenne ! (Article 50)"
 EU_Article_50_desc: "« Tout État membre peut décider, conformément à ses règles constitutionnelles, de se retirer de l'Union. »\n- Article 50, paragraphe 1, du traité sur l'Union européenne.\n\nL'article 50 a d'abord été rédigé pour le traité constitutionnel de l'Union européenne. Après l'échec du processus de ratification de la Constitution européenne, la clause a été incorporée dans le traité de Lisbonne."
 EU_Revoke_Article_50: "Révoquer l'article 50"
 EU_Revoke_Article_50_desc: "Abroger l'article 50 et rester dans §C[EUU.GetFlag] l'Union européenne§!\n« L’article 50 TUE doit être interprété en ce sens que, lorsqu’un État membre a notifié au Conseil européen, conformément à cet article, son intention de se retirer de l’Union, ledit article permet à cet État membre, tant qu’un accord de retrait conclu entre ledit État membre et l’Union n’est pas entré en vigueur ou, à défaut d’un tel accord, tant que le délai de deux ans prévu au paragraphe 3 de ce même article, éventuellement prorogé conformément à ce paragraphe, n’a pas expiré, de révoquer unilatéralement, de manière univoque et inconditionnelle, cette notification par un écrit adressé au Conseil européen, après que l’État membre concerné a pris la décision de révocation conformément à ses règles constitutionnelles. Une telle révocation a pour objet de confirmer l’appartenance de cet État membre à l’Union dans des termes inchangés quant à son statut d’État membre, ladite révocation mettant fin à la procédure de retrait. »\n- Arrêt de la Cour de justice de l'Union européenne dans l'affaire C-621/18"
 EU_exit: "Sortir de l'UE..."
 EU_exit_desc: "§Y[ROOT.GetNameWithFlag]§! has notified the European Council of its intention to leave §C[EUU.GetFlag] The European Union§!. §Y[ROOT.GetNameWithFlag]§! will leave the Union two years after the notification."
 EU_extend_Article_50: "Extension de l'article 50"
 EU_extend_Article_50_desc: "Demander à §C[EUU.GetFlag] l'Union européenne§! une prolongation de l'article 50 et quitter l'Union à une date ultérieure."
 EU_exit_three_month: "Prolongation de trois mois..."
 EU_exit_three_month_desc: "§Y[ROOT.GetNameWithFlag]§! was granted a three-month extension of Article 50 by §C[EUU.GetFlag] The European Union§!. §Y[ROOT.GetNameWithFlag]§! will leave the Union after a period of three months."
 EU_withdrawal_treaty: "Traité de retrait"
 EU_withdrawal_treaty_desc: "§Y[ROOT.GetFlag] [ROOT.GetNameDefCap]§! et les États membres de §C[EUU.GetFlag] l'Union européenne§! se sont mis d'accord sur un traité de retrait."
 EU_prepared_no_deal_exit: "Se préparer à une sortie sans accord"
 EU_prepared_no_deal_exit_desc: "§C[EUU.GetFlag] L'Union européenne§!, ses laquais faibles et ses bureaucrates gonflés à bloc à Bruxelles refusent de nous donner un traité de retrait favorable. Nous devons préparer notre pays à l'inévitable sortie sans accord, à moins que quelque chose ne change."
 EU_article_50_available_click: "Conditions préalables :\n[!EU_Article_50_click_enabled]\nEffets :\n§Y[ROOT.GetFlag][ROOT.GetNameDefCap]§! commence à sortir de §C[EUU.GetFlag][EUU.GetNameDef]§!"
 EU_article_50_available_delayed: "« Tout État membre peut décider, conformément à ses règles constitutionnelles, de se retirer de l'Union. »\n- Article 50, paragraphe 1, du traité sur l'Union européenne. -\nL'article 50 a d'abord été rédigé pour le traité constitutionnel de l'Union européenne. Suite à l'échec de la ratification de la Constitution, la clause a été incorporée dans le traité de Lisbonne."
 tooltip_EU_exit_available: "§Y[ROOT.GetFlag][ROOT.GetNameDefCap]§! ne cherche pas actuellement à quitter §C[EUU.GetFlag][EUU.GetNameDef]§!"
 tooltip_EU_exit_cancel_trigger: "§Y[ROOT.GetFlag] [ROOT.GetNameDefCap]§! a activé la décision §YRévoquer l'article 50§!."
 tooltip_EU_Revoke_Article_50_available: "§Y[ROOT.GetFlag] [ROOT.GetNameDefCap]§! a pour vocation de §Yquitter l'UE...§! OU a pour vocation de §Yprolonger le délai de trois mois...§!"
 tooltip_EU_Revoke_Article_50_effect: "§Y[ROOT.GetFlag] [ROOT.GetNameDefCap]§! reste dans §Y[EUU.GetFlag] l'Union européenne§!. La mission de §Yquitter l'UE...§! ET la mission de §Yprolongation de trois mois...§! est supprimée.\nVous ne pourrez pas invoquer l'§Yarticle 50§! pendant les §Y180 prochains jours§!."
 tooltip_EU_extend_Article_50_available: "§Y[ROOT.GetFlag] [ROOT.GetNameDefCap]§! a pour vocation de §Yquitter l'UE...§! OU a une vocation de §Yprolonger de trois mois...§!\nET [ROOT.GetFlag] [ROOT.GetNameDef] doit avoir une influence de plus de 5 % sur tous les États membres."
 tooltip_EU_remove_laws_and_offices: "Supprime toutes les §Ylois et bureaux de l'Union européenne§!.\n"
 EU_defense_category: "Politiques de défense de l'UE"
 EU_defense_category_desc: "Dans les années 1950, l'idée de la Communauté européenne de défense s'est effondrée lorsqu'elle n'a pas été ratifiée par le Parlement français. Son successeur est devenu la Politique de sécurité et de défense commune de l'Union européenne. La majorité des pays européens étant membres de l'Organisation du traité de l'Atlantique nord (OTAN), il n'a pas été nécessaire de créer une organisation européenne de défense tout au long du XXème siècle. Mais avec la montée des tensions mondiales au XXIème siècle, cette situation est en train de changer..."
 EU_Frontex_take_control: "Prendre le contrôle des forces de Frontex"
 EU_Frontex_take_control_desc: "Ces dernières années, les frontières extérieures de l'Europe ont connu une augmentation sans précédent du nombre de migrants et de réfugiés souhaitant entrer dans l'UE. Les pays qui ont une frontière extérieure sont les seuls responsables du contrôle des frontières. Toutefois, Frontex peut apporter un soutien technique supplémentaire aux pays de l'UE confrontés à une forte pression migratoire.\nPour ce faire, elle coordonne le déploiement d'équipements techniques supplémentaires (avions et bateaux, par exemple) et de personnel frontalier spécialement formé."
 EU_EuroNavy_take_control: "Prendre le contrôle de l'EuroMarine"
 EU_EuroNavy_take_control_desc: "Les flottes et les forces opérationnelles multinationales devenant de plus en plus courantes et importantes au XXIème siècle, les États membres de §C[EUU.GetFlag] l'Union européenne§! ont décidé d'unir leurs forces et de transférer leurs navires de guerre à un commandement naval européen unifié, connu sous le nom d'§YEuroMarine§!."
 EU_EuroArmy_take_control: "Prendre le contrôle de l'EuroArmée"
 EU_EuroArmy_take_control_desc: "Les États membres de §C[EUU.GetFlag] l'Union européenne§! ont décidé de mettre sur pied des forces armées communes, connues sous le nom d'§YEuroArmée§!."
 EU_create_EDU: "Former l'Union européenne de la défense (UED)"
 EU_create_EDU_desc: "Afin d'acquérir l'autonomie stratégique nécessaire pour défendre leurs intérêts collectifs, répondre aux conflits et crises extérieurs et assurer la sécurité dans notre voisinage, les États membres ont décidé de former l'§YUnion européenne de la défense (UED)§! en tant qu'alliance militaire et de quitter collectivement l'§YOTAN§!."
