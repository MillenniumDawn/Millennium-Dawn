 UKR_delta: "델타"
 UKR_delta_desc: "The Ukrainian system of information support for decisions and situational awareness on the battlefield has access to the program for active military personnel who have passed verification. Login is carried out via the Internet through authorization and two-factor authentication on a special website.\n\nAuthorized users can view and enter data on known enemy positions, spotted enemy aircraft, ground equipment, and more."
 UKR_oplit: "국가 연구 및 설계 조선 센터"
 UKR_oplit_desc: "The T-84 is a Ukrainian main battle tank, based on the Soviet T-80 MBT introduced in 1976, specifically the diesel engine version: T-80UD. The T-84 was first built in 1994 and entered service in the Ukrainian Armed Forces in 1999.\n\nIts high-performance opposed-piston engine makes it a fast tank, comparable to other modern MBTs with a power-to-weight ratio of about 26 horsepower per tonne."
 UKR_sapsan: "흐림-2"
 UKR_sapsan_desc: "Ukrainian short-range ballistic missile system being developed by KB Pivdenne and PA Pivdenmash, designed to combine the features of a tactical missile system and a multiple rocket launcher.\n\nThe original Sapsan version of the missile, for Ukraine's own use, was to have a range of 500 kilometers. The later Hrim-2 version, developed for export, has a range limited to 280 kilometers, in order to fall within the 300-kilometre limit set by the Missile Technology Control Regime, which seeks to limit the proliferation of missiles and missile technology."
 UKR_our_ukraine_helsi: "헤르시"
 UKR_our_ukraine_helsi_desc: "Helsi - medical information system for healthcare institutions and medical portal for patients in Ukraine."
 UKR_our_ukraine_dia: "디아"
 UKR_our_ukraine_dia_desc: "우크라이나 디지털 전환부가 개발한 우크라이나의 전자 공공서비스입니다. 디지털 문서, 전자 서명 및 검증 기능을 갖춘 웹사이트이자 모바일 애플리케이션이며, 공공서비스 포털이기도 합니다."
 UKR_tsnap: "TSNAP"
 UKR_tsnap_desc: "다양한 사람들이 쾌적한 환경에서 폭넓은 행정 서비스를 받을 수 있는 기관입니다. 지방 의회와 지방 국가 행정청이 설립하며 개인과 법인에게 서비스를 제공합니다."
 UKR_monobank: "모노뱅크"
 UKR_monobank_desc: "모노뱅크는 우크라이나의 직접 은행입니다. 우크라이나에 존재하는 모든 네오뱅크와 마찬가지로 모기업 은행, 즉 TAS 그룹의 일원이자 우크라이나 사업가 세르히 티히프코의 소유인 유니버설 뱅크의 은행업 면허로 운영됩니다."
 UKR_tsnap_idea: "TSNAP"
 UKR_bronetank: "하르키우 장갑차 공장"
 UKR_bronetank_desc: "장갑차의 생산, 수리, 정비, 재장비 및 현대화를 수행하는 장갑 산업의 국영 기업입니다."
 UKR_avia_zavod: "하르키우 항공기 공장"
 UKR_avia_zavod_desc: "하르키우 시에 있는 항공 공학 기업입니다. 여객기, 수송기, 군용기를 생산합니다."
 UKR_priborostroy: "하르키우 계기 제작 공장"
 UKR_priborostroy_desc: "군용 전자 장비와 가정용 전기 기기를 생산하던 소련 최대 규모의 공장 중 하나입니다."
 UKR_tractor: "하르키우 트랙터 공장"
 UKR_tractor_desc: "궤도식 및 바퀴식 트랙터를 생산하는 기업입니다."
 UKR_agregat: "하르키우 아그레가트 설계국"
 UKR_agregat_desc: "항공 및 로켓 기술의 유압, 연료, 전기 계통 장치를 개발하고 제조하는 군산복합체의 과학·생산 기업입니다."
 UKR_morozova: "하르키우 기계설계국"
 UKR_morozova_desc: "장갑차량을 개발하는 기업입니다. 과거 KP KKBM은 소련의 궤도식 장갑차량 개발에서 핵심적인 역할을 했습니다."
 UKR_specmachine: "하르키우 특수기계 공장"
 UKR_specmachine_desc: "군산복합체의 국영 기업입니다."
 UKR_malichev: "말리셰프 공장"
 UKR_malichev_desc: "하르키우에 있는 교통 기계 공장으로, 엔진, 기관차, 탱크를 생산합니다."
 UKR_reborn_ser_and_molot: "\"망치와 낫\" 공장을 재건하다"
 UKR_reborn_ser_and_molot_desc: "A large enterprise of agricultural machinery in Kharkov, it was one of the most important enterprises of the Kharkov industry and one of the largest enterprises of agricultural machinery in the Russian Empire and the USSR."
 UKR_concers: "하르키우 방어 산업"
 UKR_concers_desc: "우리는 모든 군수 산업 기업을 하나의 컨소시엄으로 통합할 것입니다. 이를 통해 생산 조율을 강화하고 생산성을 향상시킬 것입니다."
 UKR_concern: "하르키우 군사 산업"
 UKR_zaporozhia_gold: "무지예보 금광"
 UKR_zaporozhia_gold_desc: "We will finally attract investors and start developing these mines with gold deposits."
 UKR_opfl_small_med_business: "중소기업을 위한 혜택"
 UKR_opfl_small_med_business_desc: "중소기업은 우리 경제의 중요한 부분입니다. 더 큰 성장을 위해서는 사람들이 사업을 할 수 있도록 인센티브를 제공하는 보너스를 주어야 합니다."
 UKR_neutrality_neutral_social_are_in_coalition_TT: "SPU는 연합에 속하지 않음"
 UKR_idea_orthodox_christian_church: "우크라이나 정교회"
 UKR_separatist_menace: "분리주의 위협"
 UKR_separatist_menace_desc: "분리주의 공화국들의 위협은 어디에서도 사라지지 않았으며, 우리는 이를 해결해야 합니다."
 UKR_polish_liberation_battalions: "폴란드 해방군"
 UKR_polish_liberation_battalions_desc: "많은 폴란드 주민이 자신들의 생각에 나라를 점령한 정부에 맞서 우리 편에서 싸울 준비가 되어 있습니다."
 UKR_economy_shortcut: "경제"
 UKR_security_and_expansion_shortcut: "안보와 팽창"
 UKR_military_shortcut: "군사"
 UKR_politics_shortcut: "정치"
 UKR_fedrada_category: "연방 라다"
 UKR_fedrada_category_desc: "연방 라다는 연방화된 우크라이나의 정부 기구로, 연방 구성체와 연방 중앙 간의 상호작용을 위해 만들어졌습니다.\n\n§Y우크라이나 연방의 구성체§!는 [UKR.GetFlag]우크라이나에 §G병합§!될 수 있으나, 구성체에 대한 §Y영향력§!이 §Y50%§! 이상이어야 합니다."
 ukraine_maidan_east.4.b: "의원들을 연행한다"
 UKR_maidan_temporary_attack_idea_desc: "거리의 소요는 군사력에 활력을 불어넣어 일시적으로 전투 준비 태세를 강화합니다."
 ukraine_maidan_overthrow.1.t: "정부 전복"
 ukraine_maidan_overthrow.1.d: "우리 정부가 전복되었습니다. 시위대의 후보가 권력을 잡았습니다.\n그의 이념 성향은 다음과 같습니다."
 ukraine_maidan_overthrow.1.a: "£democratic_group_small   $democratic$"
 ukraine_maidan_overthrow.1.b: "£communism_group_small   $communism$"
 ukraine_maidan_overthrow.1.c: "£neutrality_group_small   $neutrality$"
 ukraine_maidan_overthrow.1.e: "£nationalist_group_small   $nationalist$"
 ukraine_maidan_overthrow.2.t: "정부 전복 - 새로운 대통령"
 ukraine_maidan_overthrow.2.d: "시위대의 후보가 권력을 잡았습니다. 그의 정당은 다음과 같습니다."
 ukraine_maidan_overthrow.2.e: "이념 성향 메뉴로 돌아가기"
 ukraine_maidan_crm_annex.1.t: "크름 병합"
 ukraine_maidan_crm_annex.1.d: "크름 반도가 러시아에 병합되었습니다. 다음에는 어떻게 해야 하겠습니까?"
 ukraine_maidan_crm_annex.1.a: "일단은 물러서겠다"
 ukraine_maidan_crm_annex.1.b: "크름을 위해 싸우겠다"
 UKR_idea_government_in_need_desc: "우크라이나 정부는 만연한 부패와 비효율에 시달리고 있습니다. 부정 축재로 행정 비용이 두 배가 되었으며, 부실한 통치는 산업 생산성과 정치 역량을 떨어뜨립니다."
 UKR_modernization: "우크라이나 현대화"
 UKR_modernization_desc: "경제와 국가가 안정되면 경제를 현대화해야 합니다. 너무 늦기 전에 말입니다."
 UKR_agriculture: "농업 현대화"
 UKR_agriculture_desc: "우크라이나는 세계 최대의 농산물 생산국이자 수출국 가운데 하나이며 유럽의 곡창 지대로 알려져 있습니다. 우크라이나는 세계에서 가장 비옥한 흑토의 30%를 보유하고 있어 농업의 잠재력이 막대합니다. 약간의 투자를 하면 이러한 잠재력을 활용할 수 있습니다. "
 UKR_nibulon: "니불론"
 UKR_nibulon_desc: "니불론은 밀, 보리, 옥수수 등 곡물의 생산과 수출을 전문으로 하는 우크라이나 농업 기업입니다. 본사는 미콜라이우에 있습니다. 자체 선단과 조선소를 보유한 우크라이나 유일의 농업 기업입니다."
 UKR_pr_jsc_mhp: "PrJSC MHP"
 UKR_pr_jsc_mhp_desc: "PrJSC MHP(미로니우스키 흘리보프로둑트)는 우크라이나 최대의 가금류 생산업체이자 최대 규모의 농식품 지주회사 가운데 하나입니다. 이 회사의 확장을 국가가 지원하면 우리의 식품 가공 산업과 농촌 고용이 성장할 것입니다."
 UKR_fozzy: "포지 그룹"
 UKR_fozzy_desc: "포지 그룹 유한책임회사는 키이우에 본사를 둔 우크라이나 최대의 무역 및 산업 그룹 가운데 하나이며, 전국에 700개가 넘는 매장을 보유한 우크라이나 대표 소매업체입니다. 소매업 외에도 식품 제조, 금융, IT, 물류, 외식업에 사업 지분을 가지고 있습니다. "
 UKR_fin_it: "경제 현대화"
 UKR_fin_it_desc: "관련 부처에 지시하여 특히 금융과 IT 분야의 민간 부문 현대화를 지원하도록 합니다. "
 UKR_privatbank: "프리바트방크"
 UKR_privatbank_desc: "프리바트방크는 자산 기준 우크라이나 최대 은행이자 우크라이나 소매 금융 시장의 선두 주자입니다. 1992년 3월 19일에 등록되었습니다. 미래의 수익을 위해 국가가 개입해야 합니다. "
 UKR_it: "우크라이나 IT 산업 육성"
 UKR_it_desc: "우리나라에서 IT 부문이 성장하고 있으나 이를 유지하려면 어느 정도의 투자가 필요할 것입니다. "
 UKR_it_2: "우크라이나 IT 산업 확대"
 UKR_it_2_desc: "우리의 IT 산업이 경제의 핵심 요소가 될 수 있을 것으로 보입니다. 물론 적절한 투자가 뒷받침되어야 합니다."
 UKR_ukrtelekom: "우크르텔레콤"
 UKR_ukrtelekom_desc: "국영 우크르텔레콤은 통신망 용량을 더 빠르게 확대하는 데 도움이 될 것입니다."
 UKR_kyivstar: "키이우스타르"
 UKR_kyivstar_desc: "키이우스타르는 우크라이나 최대의 통신 기업 가운데 하나로, 우크라이나에서 4G(LTE) 서비스를 비롯한 폭넓은 유무선 기술에 기반한 통신 서비스와 데이터 전송을 제공합니다. "
 UKR_digital_education: "디지털 교육"
 UKR_digital_education_desc: "디지털 역량은 21세기의 개인에게 필수적입니다. 디지털 교육과 교육의 디지털화에 모두 투자하면 시간이 지남에 따라 성과를 거둘 것입니다. 노년층을 잊어서는 안 되며, 이들에 대한 교육은 현재에 대한 투자입니다."
 UKR_dig_sta: "우크라이나 디지털 국가"
 UKR_dig_sta_desc: "디야(우크라이나어: Дія, 직역하면 '행동'이며 우크라이나어 Держава і Я, '국가와 나'의 약자이기도 함)는 우크라이나의 모바일 앱, 웹 포털이자 전자정부 브랜드입니다. 2020년에 출시된 디야 앱을 통해 우크라이나 시민은 신분 확인과 공유 목적으로 실물 문서 대신 스마트폰의 디지털 문서를 사용할 수 있습니다.\n\n디야 포털에서는 50가지가 넘는 정부 서비스를 이용할 수 있습니다. 정부는 궁극적으로 모든 종류의 국가와 개인 간 상호작용을 디야를 통해 제공할 계획입니다."
 UKR_tax_avoidance: "탈세 문제 해결"
 UKR_tax_avoidance_desc: "이제 우리는 기업과 개인의 조세 회피라는 거대한 세계적 문제를 국내에서 해결할 수단을 갖추었습니다. \n\\"세금은 간과되고 심지어 외면받을 수 있지만, 실제로는 우리의 사회적 초능력입니다. 세금은 우리가 지역 및 국가 수준에서 공동체를 조직하여 모두가 함께 더 나은 삶을 살도록 선택할 수 있게 해 줍니다. 그러나 근본적인 장애물은 권력을 쥔 엘리트들이 사회적 의무, 즉 자신들이 속하여 이익을 취하는 사회에 대한 책임에서 손쉽게 벗어난다는 점입니다.\\" - 2023 조세 정의 보고서"
 UKR_energy: "우크라이나 에너지 전략"
 UKR_energy_desc: "국가 전력 공급 체계를 개선할 잠재력을 분석하고 주거용 에너지 현대화 프로그램을 시작할 때입니다."
 UKR_ukrenergo: "우크레네르고"
 UKR_ukrenergo_desc: "우크레네르고는 우크라이나의 송전 계통 운영사이자 국내 고압 송전선의 유일한 운영자입니다. 이 기업은 전체 전력망을 더욱 효율적으로 만들 수 있습니다."
 UKR_nuc_ener: "에네르고아톰"
 UKR_nuc_ener_desc: "에네르고아톰은 우크라이나의 원자력 발전소 네 곳(자포리자, 리우네, 남우크라이나, 흐멜니츠키 원전)을 모두 운영하는 국영 기업입니다. 우크라이나 최대의 전력 생산업체입니다. "
 UKR_nuc_ener_2: "원자력 용량 확대"
 UKR_nuc_ener_2_desc: "웨스팅하우스와의 계약에 따라 이 미국 기업이 흐멜니츠키 원전에 두 기를, 그리고 재개되어 마침내 완공된 체르카시의 치히린 원자력 발전소에 두 기를 더 건설할 것입니다."
 UKR_green_ener: "녹색 에너지 전략"
 UKR_green_ener_desc: "재생 에너지 사용을 장려한 이후에는 비원자력 분야의 잠재력을 살펴봐야 합니다."
 UKR_ukrhydroenergo: "우크르히드로에네르고"
 UKR_ukrhydroenergo_desc: "우크르히드로에네르고는 드니프로강과 드니스테르강 유역의 여러 주요 수력 발전소를 관리하는 우크라이나 국영 기업입니다. 우크라이나의 주요 수력 발전 기업입니다."
 UKR_solar: "태양광 발전소 건설"
 UKR_solar_desc: "우리 남부 지역은 동유럽에서 가장 햇볕이 잘 드는 곳에 속하므로 태양광 발전소를 건설하기에 가장 적합합니다."
 UKR_wind: "풍력 발전 단지 장려"
 UKR_wind_desc: "우리나라에는 풍력 터빈으로 고효율 발전을 하기에 적합한 곳이 있습니다."
 UKR_biomass: "바이오매스 발전소 투자"
 UKR_biomass_desc: "바이오매스 발전소에 대한 민간 투자의 성공을 보았으니, 국가가 이러한 시설을 건설할 자금을 제공해야 합니다."
 UKR_min_env_prot: "우크라이나 환경보호부"
 UKR_min_env_prot_desc: "이 부처는 우크라이나 중앙 정부 체계에서 생태 감시와 국가 개발을 책임지는 주무 기관입니다. 주요 임무 가운데 하나는 생활 폐기물 처리 체계를 구축하는 것입니다."
 UKR_waste_manangement_2: "재활용 체계 구축"
 UKR_waste_manangement_2_desc: "생활 폐기물 수거 문제가 마침내 해결되었으니, 재활용 자원 수거 체계의 기반을 닦고 확립할 때입니다. 많은 시간과 노력이 필요했지만 그 효과는 이미 눈에 보입니다."
 UKR_waste_manangement_3: "폐기물 관리 체계 현대화"
 UKR_waste_manangement_3_desc: "구축된 체계는 더욱 효율적으로 만들어져야 하며 나라의 가장 외진 구석까지 닿아야 합니다. 현대적인 폐기물 관리는 국민과 환경 모두에게 이익이 될 것입니다."
 UKR_forestry: "우크라이나 임업 관리"
 UKR_forestry_desc: "국토의 거의 20%가 숲으로 덮여 있습니다. 이를 유지하고 산림 파괴를 피하려면 미래에 대한 투자로서 임업에 투자해야 합니다."
 UKR_tourism: "관광에 투자"
 UKR_tourism_desc: "관광은 어느 나라에든 큰 기회가 될 수 있습니다. 우선 적절한 기반시설을 갖추어야 합니다. "
 UKR_nat_wonders: "우크라이나의 자연 경관"
 UKR_nat_wonders_desc: "2008년에 우크라이나의 수많은 그림 같은 장소 가운데 일곱 곳이 투표로 선정되었습니다. 이곳들은 우리나라의 다채로운 풍경을 대표하는 기수가 될 것입니다."
 UKR_wonders: "우크라이나의 불가사의"
 UKR_wonders_desc: "2007년에 우크라이나의 수많은 역사 및 문화 기념물 가운데 일곱 곳이 투표로 선정되었습니다. 이곳들은 우리나라의 건축 유산을 대표하는 기수가 될 것입니다."
 UKR_world_heritage: "우크라이나의 세계유산"
 UKR_world_heritage_desc: "2005년 현재 우크라이나에는 세 곳의 세계유산이 있으나, 이미 여러 곳이 잠정 목록에 올라 있어 시간이 지나면 늘어날 것입니다.\n\n문화유산은 기념물(건축물, 기념비적 조각, 비문 등), 건조물군, 유적지(고고학 유적지 포함)로 이루어집니다. 자연유산은 자연적 특징(물리적·생물학적 형성물로 구성), 지질학적·지형학적 형성물(멸종 위기 동식물의 서식지 포함), 그리고 과학, 보존 또는 자연미의 관점에서 중요한 자연 지역으로 정의됩니다."
 UKR_health_tourism: "우크라이나 의료 관광 장려"
 UKR_health_tourism_desc: "우리나라의 의료 서비스는 서방 수준에 부합하면서도 일반적으로 더 저렴하므로 의료 관광 부문에 투자하는 것이 유익할 수 있습니다."
 UKR_corruption_reforms: "부패 척결 개혁"
 UKR_corruption_reforms_desc: "부패는 1991년 소련 해체까지 거슬러 올라가는 우크라이나 사회의 문제입니다. 소련으로부터 독립을 선언한 이후 우크라이나는 정치 스펙트럼 각 편의 정치인들, 그리고 경찰과 정당, 산업계의 부패를 이용해 권력을 잡은 범죄 조직 두목과 과두 재벌들을 줄줄이 마주하였습니다.\n\n이를 바꿀 때입니다!"
 UKR_corruption_edu: "교육 분야 부패 척결"
 UKR_corruption_edu_desc: "2008년 트랜스페어런시 인터내셔널의 조사에 따르면 대학생의 47.3%가 뇌물을 요구받았다고 답하였으며, 그 가운데 29%는 자발적으로 뇌물을 냈습니다. 학생들은 대학 입학, 시험 성적, 박사 및 석사 논문 점수를 \\"살\\" 수 있었습니다."
 UKR_corruption_health: "의료 분야 부패 척결"
 UKR_corruption_health_desc: "국영 병원의 의료는 이론상 우크라이나인에게 무료이지만, 21세기 초에는 환자가 필요한 치료를 받기 위해 그곳에 돈을 지불하는 일이 만연하였습니다.\n\n2012년에 옹호 단체들은 보건부 관리들이 에이즈 환자 치료에 쓰여야 할 자금을 횡령하였다고 비난하였는데, 에이즈 의약품을 터무니없이 부풀린 가격에 구매한 뒤 리베이트를 챙겼다는 것입니다."
 UKR_corruption_police: "경찰 부패 척결"
 UKR_corruption_police_desc: "우크라이나 법 집행 기관 내의 부패에 맞서 싸워 국민의 신뢰와 효과적인 치안을 회복합니다."
 UKR_corruption_armed_forces: "우크라이나군 부패 척결"
 UKR_corruption_armed_forces_desc: "군대에서 부패를 일소하여 군기와 효율성을 높입니다."
 UKR_corruption_justice: "사법 부패 척결"
 UKR_corruption_justice_desc: "2010년대 초 우크라이나 정치인과 분석가들은 우크라이나의 사법 제도를 \\"뿌리까지 썩었다\\"고 묘사하였으며 판사들에게 가해지는 정치적 압력과 부패를 비판하였습니다. 독립적인 변호사와 인권 활동가들은 우크라이나 판사들이 특정 판결을 내리도록 정기적으로 압력을 받는다고 호소하였습니다.\n\n우크라이나의 법원 제도는 널리 부패한 것으로 여겨졌습니다. 2009년 우크라이나 법무부의 조사에 따르면 응답자의 10%만이 국가의 법원 제도를 신뢰하였습니다."
 UKR_corruption_spec_public_prosecutor: "특별반부패검찰청"
 UKR_corruption_spec_public_prosecutor_desc: "특별반부패검찰청은 우크라이나 검찰총장 산하의 독립된 구조 단위로, 주로 우크라이나 국가반부패수사국(NABU)이 개시한 형사 수사를 지원하고 감독할 책임이 있습니다."
 UKR_corruption_court: "우크라이나 고위반부패법원"
 UKR_corruption_court_desc: "독립적인 반부패 법원을 설립하여 고위급 부패 사건을 기소하고 도난당한 국가 자산을 회수합니다."
 UKR_corruption_asset_rec: "자산 회수"
 UKR_corruption_asset_rec_desc: "유엔 부패방지협약(UNCAC 제5장)에 명시된 자산 회수란 해외로 이전된 부패 수익을 회수하여 그것이 빼앗긴 국가 또는 정당한 소유자에게 반환하는 과정을 말합니다."
 UKR_corruption_gov: "국가 정부 정화"
 UKR_corruption_gov_desc: "정부 행정 내의 부패를 제거하고 제도의 청렴성을 회복하기 위해 전면적인 개혁을 도입합니다."
 UKR_end_kleptokracy: "부패 척결 개혁 마무리"
 UKR_end_kleptokracy_desc: "이 모든 개혁이 이루어지면 부패의 규모를 쉽게 줄일 수 있고 사회는 숨 막히는 부패의 영향 없이 살아갈 수 있을 것입니다."
 UKR_health_reform: "의료 개혁 착수"
 UKR_health_reform_desc: "우크라이나의 의료는 법에 따라 시민에게 무료여야 하지만, 실제로는 환자가 의료의 대부분 영역에서 비용의 일부를 부담합니다."
 UKR_health_smoke_alc: "흡연 및 음주 감소"
 UKR_health_smoke_alc_desc: "예방 가능한 질병의 주요 원인을 해결하기 위해 흡연과 음주를 줄이는 공중 보건 캠페인을 시작합니다."
 UKR_hiv_aids: "우크라이나의 HIV/에이즈"
 UKR_hiv_aids_desc: "2001년에 HIV/에이즈 퇴치를 위한 국가 계획이 승인되었으며, 그 목표에는 HIV의 추가 확산 방지, 감염자 치료 역량 개발, HIV/에이즈와 함께 살아가는 사람들에 대한 사회적 지원과 상담 제공이 포함되었습니다."
 UKR_vaccination: "예방접종 프로그램"
 UKR_vaccination_desc: "감염병 발생을 예방하고 인구의 면역력을 높이기 위해 예방접종 프로그램을 전국으로 확대합니다."
 UKR_mental_health: "정신 건강 프로그램"
 UKR_mental_health_desc: "인구 사이에서 늘어나는 정신 장애에 대응하기 위해 정신 건강 서비스와 지원 체계를 발전시킵니다."
 UKR_health_infra: "의료 기반시설 개선"
 UKR_health_infra_desc: "의료 기반시설을 현대화하고 확충하여 전국의 의료 시설을 개선합니다."
 UKR_health_equipment: "의료 장비 구매 프로그램"
 UKR_health_equipment_desc: "의료 서비스 제공과 치료 역량을 높이기 위해 현대적인 의료 장비와 진단 도구를 조달합니다."
 UKR_health_prevention: "건강 검진 프로그램"
 UKR_health_prevention_desc: "건강 이상을 조기에 발견하고 예방 진료를 개선하기 위해 포괄적인 건강 검진 프로그램을 마련합니다."
 UKR_health_rehabilitaion: "국가 재활 프로그램"
 UKR_health_rehabilitaion_desc: "삶의 질을 회복할 수 있도록 군인을 포함한 부상자와 장애인을 위한 재활 시설을 발전시킵니다."
 UKR_health_recreational_infra: "여가 기반시설 개선"
 UKR_health_recreational_infra_desc: "신체 활동을 장려하고 공중 보건을 개선하기 위해 여가 시설과 공공 공간에 투자합니다."
 UKR_health_final: "의료 개혁 마무리"
 UKR_health_final_desc: "서방 수준의 의료 서비스와 인구 건강 성과를 달성하기 위해 의료 개혁을 완수합니다."
 UKR_edu_plan: "교육 개혁 계획"
 UKR_edu_plan_desc: "우리나라의 교육은 비교적 높은 수준이지만, 그 수준을 유지하거나 높이기 위해 개선할 부분이 있습니다. 세계에서 진행 중인 디지털 전환에 대비해야 합니다."
 UKR_edu_infra: "교육 기반시설 개선"
 UKR_edu_infra_desc: "현대적인 학습 환경을 조성하기 위해 교육 시설과 학교 건물을 개선합니다."
 UKR_edu_ped_uni: "사범대학 지원"
 UKR_edu_ped_uni_desc: "전국의 교사 양성과 수업의 질을 높이기 위해 사범대학을 강화합니다."
 UKR_edu_universities: "대학 지원"
 UKR_edu_universities_desc: "학술 연구와 혁신을 강화하기 위해 고등 교육 기관에 추가 자원과 지원을 제공합니다."
 UKR_edu_infra_2: "교육 기반시설 개선: 다음 단계"
 UKR_edu_infra_2_desc: "현대적인 기술과 선진 학습 기반시설로 교육 시설을 계속 개선합니다."
 UKR_edu_final: "교육 개혁 마무리"
 UKR_edu_final_desc: "세계적 수준의 학습과 과학 발전을 달성하기 위해 교육 개혁을 완수합니다."
 UKR_bmz: "BMZ"
 UKR_bmz_desc: "베르디치우 기계 제작 공장(프로흐레스 공장으로도 알려짐)은 우크라이나 지토미르주 베르디치우시에 있는 기계 제작 기업입니다."
 UKR_nkmz: "NKMZ"
 UKR_nkmz_desc: "노보크라마토르스키 마시노부디우니 자보드(신 크라마토르스크 기계 제작 공장)는 우크라이나의 대형 중장비 제조업체입니다. 이 기업은 광산 장비, 야금 장비, 압연기, 단조 설비, 용광로, 광석 파쇄기, 프레스 및 기타 산업 공정 장비를 생산합니다.\n\n또한 쇄빙선용 프로펠러 축과 잠수함용 부품을 제조합니다. 이 기업의 웹사이트에 따르면 18개가 넘는 광산 복합 시설을 설계하고 건설하였습니다."
 UKR_oil_mining: "석유 채굴"
 UKR_oil_mining_desc: "국내 에너지 생산을 늘리고 해외 공급 의존도를 줄이기 위해 새로운 석유 채굴 시설을 개발합니다."
 UKR_mining2: "자원 채굴 개선"
 UKR_mining2_desc: "크롬, 텅스텐 및 기타 전략 광물의 채굴량을 늘리기 위해 광업 활동을 확대합니다."
 UKR_construction_kovalska: "코발스카"
 UKR_construction_kovalska_desc: "ICG 코발스카 유한책임회사는 우크라이나의 개발업체이자 건축 자재 제조업체입니다.\n\n생산품: 콘크리트, 레미콘, 건축 솔루션, 고전적인 철근 콘크리트 개별 구조 철근 콘크리트 제품, 팽창 점토 콘크리트 벽체 제품, 기포 콘크리트, 보도블록, 건식 건축 혼합물, 수분산 재료(페인트, 장식용 미장재, 폼, 접착제)."
 UKR_train_prod: "열차 생산"
 UKR_train_prod_desc: "크류키우 철도 차량 제조 공장은 우크라이나 크레멘추크에 있는 대규모 산업 기업으로, 기관차와 동력 분산식 열차를 제조합니다."
 UKR_kharkiv_tractor: "HTZ"
 UKR_kharkiv_tractor_desc: "하르키우 트랙터 공장(KhTZ 또는 HTZ)은 우크라이나 도시 하르키우의 농기계 제조업체입니다. 스탈린의 소련 산업화 제1차 5개년 계획(1928~32년)의 핵심 사업으로 1930~31년에 설립된 KhTZ는 우크라이나 최대의 트랙터 제조업체로서 바퀴형과 궤도형 트랙터를 모두 생산하였습니다.\n\n소련이 붕괴하고 우크라이나가 독립한 지 2년 뒤인 1994년에 이 공장은 공개 주식회사로 전환되었습니다. 범용 바퀴형 트랙터를 비롯한 트랙터를 생산합니다."
 UKR_agriculture2: "농업 현대화: 다음 단계"
 UKR_agriculture2_desc: "첨단 농업 기술을 도입하고 곡물 생산을 확대하여 우크라이나가 세계 식량 공급국이라는 입지를 굳힙니다."
 UKR_chumak: "추마크"
 UKR_chumak_desc: "추마크(우크라이나어: Чумак)는 헤르손주 카호우카에 있는 스웨덴-우크라이나 식품 가공 기업입니다. 제품으로는 케첩, 마요네즈, 파스타, 샐러드 드레싱, 요리용 소스, 채소 통조림, 절임 채소, 토마토 주스, 해바라기유 등이 있습니다."
 UKR_gsc_game_world: "GSC"
 UKR_gsc_game_world_desc: "GSC 게임 월드는 우크라이나의 비디오 게임 개발사입니다. 1995년 세르히 흐리호로비치가 키이우에서 설립하였으며, 코사크 시리즈와 S.T.A.L.K.E.R. 시리즈로 가장 잘 알려져 있습니다."
 UKR_national_bank: "우크라이나 국립은행"
 UKR_national_bank_desc: "우크라이나 헌법에 따르면 우크라이나 국립은행(NBU)의 주된 기능은 우크라이나 통화 단위(흐리우냐)의 안정을 보장하는 것입니다. 이를 수행하기 위해 국립은행은 은행 제도의 안정과, 자신의 권한 범위 내에서 물가 안정을 촉진합니다."
 UKR_darnytsia: "다르니차"
 UKR_darnytsia_desc: "다르니차는 우크라이나의 제약 회사입니다."
 UKR_farmak: "파르마크"
 UKR_farmak_desc: "JSC 파르마크는 우크라이나의 제약 회사입니다. 이 회사는 1925년에 설립되었습니다. 본사는 키이우에 있습니다."
 UKR_carpathian_tourism: "카르파티아 산맥 관광 장려"
 UKR_carpathian_tourism_desc: "해외 방문객을 유치하고 경제적 수익을 창출하기 위해 카르파티아 산맥의 관광 기반시설을 발전시킵니다."
 UKR_black_sea_tourism: "흑해 인근 관광 장려"
 UKR_black_sea_tourism_desc: "우크라이나를 일류 해변 휴양지로 자리매김하기 위해 흑해 연안의 리조트 기반시설을 확충합니다."
 UKR_infra_rail: "철도 개선"
 UKR_infra_rail_desc: "화물 수송과 여객 연결성을 개선하기 위해 국가 철도망을 현대화합니다."
 UKR_infra_rail_2: "철도 개선: 다음 단계"
 UKR_infra_rail_2_desc: "세계적 수준의 교통 기반시설을 구축하기 위해 포괄적인 철도 확장과 개량을 완수합니다."
 UKR_infra_southern_bug: "남부 부흐강 항행 가능화"
 UKR_infra_southern_bug_desc: "우크라이나의 곡물 수출 증가를 원활히 하기 위해 미콜라이우 상류의 남부 부흐강에서 상업 화물 항행을 되살립니다."
 UKR_pivdenne_db: "피우덴네 설계국"
 UKR_pivdenne_db_desc: "우크라이나 드니프로에 위치한 피우덴네 설계국은 위성과 로켓을 설계하는 곳이며, 과거에는 소련의 대륙간 탄도 미사일(ICBM)을 설계하였습니다."
 UKR_luch: "루치 설계국"
 UKR_luch_desc: "순항 미사일과 첨단 무기 기술 개발에서 루치 설계국의 역량을 확대합니다."
 UKR_mayak: "마야크"
 UKR_mayak_desc: "군에 현대적인 보병 무기를 공급하기 위해 마야크의 소형 화기 생산 시설을 현대화합니다."
 UKR_ukrainian_armor: "우크라이나 방탄복"
 UKR_ukrainian_armor_desc: "군 인력을 위한 첨단 방탄복과 보호 장비 기술을 개발합니다."
 UKR_large_construction1: "대규모 건설 프로그램"
 UKR_large_construction1_desc: "도시 기반시설과 전국의 경제 역량을 확대하기 위해 야심 찬 건설 사업을 시작합니다."
 UKR_large_construction2: "대규모 건설, 2단계"
 UKR_large_construction2_desc: "발전의 추진력과 고용을 유지하기 위해 확대된 프로그램으로 건설 붐을 이어 갑니다."
 UKR_tax_reform: "세제 개혁"
 UKR_tax_reform_desc: "세수를 늘리고 재정 행정을 현대화하기 위해 세금 제도를 재편합니다."
 UKR_pension_reform: "연금 개혁"
 UKR_pension_reform_desc: "장기적인 지속 가능성과 충분한 노후 보장을 확보하기 위해 포괄적인 연금 제도 개혁을 시행합니다."
 UKR_min_economy: "경제부"
 UKR_min_economy_desc: "시장 자유화를 촉진하고 정부의 경제 통제를 줄이기 위해 경제부를 강화합니다."
 UKR_cut_energy_subs: "에너지 보조금 삭감"
 UKR_cut_energy_subs_desc: "예산 균형을 맞추고 에너지 효율을 장려하기 위해 비효율적인 에너지 보조금을 폐지합니다."
 UKR_state_fund: "국가 기금"
 UKR_state_fund_desc: "예산 흑자를 개발 사업과 해외 자산에 투자하기 위해 국부 펀드를 설립합니다."
 UKR_air_improvements: "공군 개선"
 UKR_air_improvements_desc: "더 나은 훈련, 장비, 작전 교리로 공군을 현대화합니다."
 UKR_aa_mis_def_force: "대공 미사일 방어군"
 UKR_aa_mis_def_force_desc: "공중 위협으로부터 영공을 보호하기 위해 전문 대공 미사일 방어 부대를 창설합니다."
 UKR_radio_eng: "무선 공학군"
 UKR_radio_eng_desc: "첨단 군 통신을 위한 무선 공학 및 전자전 역량을 개발합니다."
 UKR_support_fac: "지원 시설"
 UKR_support_fac_desc: "공중 작전과 항공기 정비 역량을 높이기 위해 공군 기지 지원 기반시설을 확충합니다."
 UKR_army_imp: "육군 개선"
 UKR_army_imp_desc: "개선된 훈련, 교리, 전문적인 군사 육성으로 육군을 강화합니다."
 UKR_army_aviation: "육군 항공대"
 UKR_army_aviation_desc: "수송, 정찰, 근접 지원을 위한 회전익 항공기로 육군 항공 역량을 발전시킵니다."
 UKR_army_logistics: "육군 군수"
 UKR_army_logistics_desc: "작전을 지원하고 야전 효율성을 높이기 위해 육군의 군수 및 보급망 체계를 강화합니다."
 UKR_army_maintenance: "육군 정비 시설"
 UKR_army_maintenance_desc: "군 장비의 가용성을 극대화하기 위해 포괄적인 장비 정비 및 수리 시설을 설립합니다."
 UKR_medical_forces: "의무군"
 UKR_medical_forces_desc: "첨단 야전 병원과 외상 치료 역량을 갖춘 군 의무 사령부를 설립합니다."
 UKR_antonov: "안토노프"
 UKR_antonov_desc: "현대적인 수송기와 화물기를 생산하기 위해 안토노프의 항공기 제조 역량을 확대합니다."
 UKR_idea_pro_ukraine_reform_1_desc: "부패 척결 정부 개혁이 낭비와 비효율을 줄여 초기 전환 비용에도 불구하고 국민의 신뢰를 회복시킵니다."
 UKR_idea_shortened_general_staff_desc: "군 지휘 구조를 간소화하면 계획 수립의 효율성이 향상되고 장교 육성이 빨라집니다."
 UKR_uda_encouraged: "장려된 UDA"
 UKR_uda_encouraged_desc: "UDA 민병대를 군대에 편입하면 전투 능력이 향상되나 군기가 떨어집니다."
 UKR_uda_integrated: "통합된 UDA"
 UKR_uda_integrated_desc: "우크라이나 의용군이 정규군에 완전히 통합되어 군기와 민족주의 정서가 강화되었습니다."
 UKR_ukrtelekom_idea: "우크르텔레콤"
 UKR_ukrtelekom_idea_desc: "국영 통신 독점 기업 우크르텔레콤이 현대화되어 디지털 기반시설이 확대되고 생산성이 향상되었습니다."
 UKR_finance_and_it: "금융 및 IT 부문 지원"
 UKR_finance_and_it_desc: "금융 및 정보 기술 부문의 발전이 고부가가치 경제 활동을 창출하고 연구 역량을 향상시킵니다."
 UKR_digital_state: "우크라이나 디지털 국가"
 UKR_digital_state_desc: "디야(우크라이나어: Дія, 직역하면 '행동'이며 우크라이나어 Держава і Я, '국가와 나'의 약자이기도 함)는 우크라이나의 모바일 앱, 웹 포털이자 전자정부 브랜드입니다. 2020년에 출시된 디야 앱을 통해 우크라이나 시민은 신분 확인과 공유 목적으로 실물 문서 대신 스마트폰의 디지털 문서를 사용할 수 있습니다.\n\n디야 포털에서는 50가지가 넘는 정부 서비스를 이용할 수 있습니다. 정부는 궁극적으로 모든 종류의 국가와 개인 간 상호작용을 디야를 통해 제공할 계획입니다."
 UKR_tax_avoidance_idea: "미미한 조세 회피"
 UKR_tax_avoidance_idea_desc: "세금은 간과되고 심지어 외면받을 수 있지만, 실제로는 우리의 사회적 초능력입니다. 세금은 우리가 지역 및 국가 수준에서 공동체를 조직하여 모두가 함께 더 나은 삶을 살도록 선택할 수 있게 해 줍니다.\n\n그러나 근본적인 장애물은 권력을 쥔 엘리트들이 사회적 의무, 즉 자신들이 속하여 이익을 취하는 사회에 대한 책임에서 손쉽게 벗어난다는 점입니다. - 2023 조세 정의 보고서"
 UKR_nuclear_energy: "에네르고아톰"
 UKR_nuclear_energy_desc: "원자력 발전소에 대한 투자로 국내 에너지 발전량과 원자로 건설 산출량이 증가합니다."
 UKR_construction: "건설 노력"
 UKR_construction_desc: "건설 역량이 국가가 자금을 지원하는 긴급 사업에 할당되었습니다."
 UKR_demographic_boom: "인구 폭증"
 UKR_demographic_boom_desc: "우호적인 인구 추세와 인구 증가 정책으로 가용 인력과 노동력이 확대됩니다."
 UKR_demographic_crisis: "인구 위기"
 UKR_demographic_crisis_desc: "높은 이민율에 높은 사망률과 낮은 출산율이 겹쳐 1990년대부터 나라의 인구가 감소하고 있습니다. 1993년 이후 인구는 해마다 평균 30만 명 넘게 줄어들고 있습니다."
 UKR_tackle_corruption: "부패에 맞서라!"
 UKR_tackle_corruption_desc: "부패 척결 캠페인과 제도 개혁이 정부 효율성과 국가 생산성을 극적으로 향상시킵니다."
 UKR_corruption: "뿌리 깊은 부패"
 UKR_large_construction: "대규모 건설 프로그램"
 UKR_large_construction_desc: "야심 찬 기반시설 개발 프로그램이 건물 완공과 생산성을 가속하지만 에너지 소비가 크게 증가합니다."
 UKR_medical_reform: "의료 개혁"
 UKR_medical_reform_desc: ""
 UKR_aamdf: "대공 미사일군"
 UKR_aamdf_desc: "조직된 대공 미사일 방어군이 우리의 방공 역량을 크게 강화하고 적 근접 항공 지원의 효과를 감소시킵니다."
 UKR_radio_troops: "무선 공학 부대"
 UKR_radio_troops_desc: "공군의 무선 공학 및 통신 부대가 정찰과 요격을 강화하고 항공기 손실을 줄입니다."
 UKR_air_support_fac: "공군 지원 시설"
 UKR_air_support_fac_desc: "항공 지원 시설에 대한 투자가 연료 효율과 항공기 신뢰성을 개선하여 운영 비용을 줄이면서 성능을 높입니다."
 UKR_cut_subsidies: "에너지 보조금 삭감"
 UKR_cut_subsidies_desc: "에너지 보조금을 폐지하면 소비자가 실제 생산 비용을 부담하게 되어 재정 부담이 줄어들고 생산성이 향상됩니다."
 UKR_health_cost: "더 건강한 국가!"
 UKR_health_cost_desc: ""
 UKR_military_rehab: "군 재활 체계"
 UKR_military_rehab_desc: "퇴역 군인 재활 프로그램이 부대의 사기와 조직 결속력을 높이지만 의료 비용이 증가합니다."
 UKR_resource_extraction: "자원 채굴 증대"
 UKR_resource_extraction_desc: "자원 채굴 활동이 확대되어 광물과 연료의 국내 공급이 늘어납니다."
 UKR_research_boost: "우크라이나 연구 지원 프로그램"
 UKR_research_boost_desc: "중앙 집중식 연구 지원 프로그램이 군사 및 민간 부문 전반의 기술 발전을 가속합니다."
 UKR_economy_boost: "경제 개선"
 UKR_economy_boost_desc: "일시적인 경기 부양 프로그램이 생산성과 공장 효율을 높이지만 에너지 비용이 증가합니다."
 UKR_kolomoisky_help: "콜로모이스키의 도움"
 UKR_kolomoisky_help_desc: "유명한 과두 재벌 콜로모이스키가 우리 군의 전투 능력을 유지하기 위해 여러 대대 창설 자금을 대겠다는 제안을 가지고 접근하였습니다."
 UKR_kolomoisky_finish: "드니프로-1 경찰 연대"
 UKR_kolomoisky_finish_desc: "콜로모이스키가 자원하여 자금을 댄 마지막 사업은 드니프로페트롭스크 방위 연대를 경찰 연대로 재편성하는 것이었습니다."
 UKR_uda: "우크라이나 의용군"
 UKR_uda_desc: "의용병들을 하나의 군사 집단으로 조직해야 합니다."
 UKR_aidar: "아이다르 대대 창설"
 UKR_aidar_desc: "위험을 감수하고 그들이 우리 군의 대열에 합류하도록 합시다."
 UKR_russia_help_battalions_desc: "러시아 로스그바르디야와 바그너 부대의 배치가 점령 기간 중 치안과 대반란 작전을 개선합니다."
 UKR_economy: "경제 정책"
 UKR_economy_desc: "\n\n\n\n\n\n£GFX_ukr_economy\n\n\n\n\n\n\n\n\n§5경제개발무역부§!는 §8우크라이나§! 중앙 정부 체계에서 국가 경제 및 사회 발전 정책(기업 경제)의 수립과 실행, 소비자 물가 규제, 산업·투자·무역 경제 정책, 기업가 정신 육성, 기술 규제와 소비자 권리 보호, 그리고 §8우크라이나§!와 §8유럽 연합§! 간 경제·사회 협력의 부처 간 조율을 책임지는 주무 기관입니다."
 UKR_boost_economy: "경제 부양"
 UKR_boost_research: "연구 활동 지원"
 UKR_boost_resource: "자원 채굴 보조"
 UKR_add_resource: "깊이 파라"
 UKR_renewable_energy: "우크라이나 재생 에너지 잠재력 평가"
 UKR_renewable_energy_desc: "\n\n\n\n\n\n£GFX_UKR_energy_ukraine\n\n\n\n\n\n\n\n\n재생 에너지 생산 잠재력이 가장 높은 지역을 조사하여 지도로 작성합니다."
 UKR_energy_wind: "풍력 에너지"
 UKR_energy_solar: "태양광 발전"
 UKR_energy_geothermal: "지열 에너지"
 UKR_privatize_resource: "자원 채굴 산업 민영화"
 UKR_privatize_resource_desc: "자원 채굴 산업의 민영화는 국가의 통제와 자원 가용성을 감소시킵니다."
 UKR_restructure_debt: "부채 재조정 요청"
 UKR_ask_western_loans: "§7서방 국가§!에 대출 요청"
 UKR_ask_eastern_loans: "§t동방 국가§!에 대출 요청"
 UKR_natpolice_decision_category: "특수목적경찰 순찰대"
 UKR_natpolice_decision_category_desc: "우크라이나 특수목적경찰 순찰대는 공공 질서 수호를 위한 특수 부대 조직으로서 우크라이나 내무부 산하에 창설된 우크라이나 국가경찰 내 우크라이나 순찰경찰국 소속의 부서입니다.\n\n이 조직은 우크라이나 국가경찰의 일부가 되었습니다. 이 부서는 내무부의 기존 대대와 연대를 통합합니다."
 UKR_uda_decision_category: "우크라이나 의용군"
 UKR_uda_decision_category_desc: "우크라이나 의용군은 드미트리 야로시와 그의 동료들이 우파 섹터 운동에서 떠난 뒤 우크라이나 의용군단 부대를 바탕으로 결성된 의용 준군사 조직입니다."
 UKR_integrate_uda: "§YUDA§!를 §Y우크라이나군§!에 통합"
 UKR_small_arms: "§O소형 화기 §! §W중대§! 육성"
 UKR_equipment_funds: "§OKMDB 보병 장비§! §W사단§! 육성"
 UKR_heavy_equipment: "§G말리셰프§! §W공장§!에 자금 배정"
 UKR_heavy_equipment_research: "§G장갑차량§! §W연구§! 지원"
 UKR_fund_antonov: "§8안토노프§! 보조"
 UKR_air_equipment: "§8항공 §! §W연구§! 지원"
 UKR_nikolayev_funds: "§8미콜라이우 조선소§! 현대화"
 UKR_naval_equipment: "§8해군 장비 §! §W연구§! 지원"
 UKR_parti_regions_economic_committee_desc: "지역당의 경제위원회는 경기 순환을 완화하고 안정을 유지합니다."
 UKR_parti_regions_invest_open_window_desc: "기업 친화적인 투자 정책이 인구 증가와 법인세 징수를 촉진합니다."
 UKR_parti_regions_taxx_desc: "세법 개정이 개인과 법인 과세를 모두 낮추어 행정 비용을 높이는 한편 사회 불안을 완화합니다."
 UKR_parti_regions_laizes_desc: "세속화 조치가 성직자의 영향력을 줄이지만 종교 공동체를 불안정하게 하고 경제적 변동성을 높입니다."
 UKR_parti_regions_stability_reform_desc: "지역 안정 조치가 이념 방어를 높이지만 행정 간접비를 증가시킵니다."
 UKR_parti_regions_lustration_desc: "소련 시대 관리들을 제거하면 행정 및 보안 기구의 비용이 감소합니다."
 UKR_parti_regions_opposition_agree_desc: "야당과의 정치적 협력이 정부의 고립을 줄이고 야누코비치 시대의 이념 이탈을 억제합니다."
 UKR_parti_regions_titushki_desc: "정부가 후원하는 거리의 도발꾼들이 위협과 폭력으로 이념 이탈을 억제합니다."
 UKR_parti_regions_optimise_ministers_desc: "부처 관료제를 간소화하면 행정 비용이 줄어들고 정부 효율이 향상됩니다."
 UKR_parti_regions_inform_act_desc: "언론 통제 법률이 행정 비용을 들여 정치적 메시지를 안정시킵니다."
 UKR_parti_regions_pension_reform_desc: "연금 제도를 재편하면 사회 비용은 줄어들지만 급여 감소로 인해 인구 증가율이 낮아집니다."
 UKR_parti_regions_youth_regions_desc: "청년 참여 프로그램이 세대 간 지지를 구축하고 정치력과 이탈 방어를 소폭 향상시킵니다."
 UKR_our_ukraine_secretariat_of_president_desc: "대통령 비서실은 행정 연구 역량을 높이지만 관료주의적 간접비용을 증가시킵니다."
 UKR_our_ukraine_fight_with_corruption_idea_desc: "부패 단속은 관료주의적 간접비용과 불법적인 경제적 착취를 줄입니다."
 UKR_our_ukraine_education_reform_idea_desc: "교육과정 개혁은 연구 역량을 높이지만 일시적인 정치적, 안정도 비용을 초래합니다."
 UKR_our_ukraine_health_reform_idea_desc: "의료 체계 현대화는 비용을 줄이고 징집 적합도를 높입니다."
 UKR_our_ukraine_social_reform_idea_desc: "사회 지출의 합리화는 예산 부담을 줄이는 동시에 민주주의에 대한 지지를 강화합니다."
 UKR_our_ukraine_air_industry_idea_desc: "항공 부문 현대화는 군용 항공기의 생산 비용을 줄입니다."
 UKR_reform_sbu: "SBU 개혁"
 UKR_reform_sbu_desc: "SBU는 개혁이 필요합니다. 지난 수년간 이 조직은 부패에 깊이 빠져 있었으며 쇄신이 필요합니다."
 UKR_Yanu_Minister: "내각"
 UKR_Yanu_President: "대통령직"
 UKR_prepare_protest_tt: "§8마이단 대표자들§!의 지지를 얻거나 잃게 됩니다"
 UKR_donbass_concessions_tt: "우리의 입장에 따라 동부 또는 서부 지역의 지지를 얻을 수 있지만, 반드시 §8마이단 대표자들§!을 실망시키게 됩니다."
 UKR_azovsteel_desc: "아조우스탈 제철 단지를 장악하면 산업 및 군수 생산에 필요한 고품질 강철을 안정적으로 공급할 수 있습니다."
 UKR_yushenko_premier_idea_desc: "빅토르 유셴코는 쿠치마 아래에서 총리직을 수행하며 정치적 권한을 확대하고 정부를 중립 노선으로 이끌고 있습니다."
 UKR_yanuk_premier_idea_desc: "빅토르 야누코비치는 쿠치마 아래에서 총리직을 수행하며 정치적 권한을 확대하고 정부를 좌파 쪽으로 끌어당기고 있습니다."
 UKR_unstable_government_idea_desc: "정치적 불안정이 정부의 통제력을 약화시켜, 여러 이념 세력이 소요를 자신들의 목적에 이용할 수 있게 되었습니다."
 UKR_land_reform_idea3_desc: "지난 세기에 시작된 토지 개혁은 전국의 토지 보유를 완전히 재분배하는 결과로 이어져야 합니다. 현재까지는 진행 중입니다."
 UKR_zaims_desc: "단기 국제 대출은 경제를 안정시키고 세수를 늘렸으나, 상당한 미래 채무 부담을 만들어 냈습니다."
 UKR_social_discontent: "국민의 심각한 불만"
 UKR_social_discontent_desc: "의료, 교육, 복지 지출의 대폭적인 삭감은 국민의 신뢰를 대가로 국고의 부담을 덜어 줍니다."
 UKR_banks_lobbyst_liquidate_desc: "정부에서 은행권 이해관계를 제거하면 법인세 수입의 흐름이 바뀌고, 금융 엘리트가 정책에 미치는 영향력이 깨집니다."
 UKR_mining_company_help_desc: "광업 기업에 대한 세제 혜택은 경제적 압박 속에서 부담을 덜어 줍니다."
 UKR_privatization_idea_desc: "국영 기업의 민영화는 정치력을 대가로 공장 효율과 무역 관계를 개선합니다."
 UKR_without_kuchma_idea_desc: "'쿠치마 없는 우크라이나' 운동은 올리가르히적 부패와 권위주의적 통치로 인식되는 것에 맞서 민족주의 정서를 결집시켰습니다."
 UKR_left_opposition_idea_desc: "좌파 정치 운동이 노동자와 지식인을 결집하여 집권 정부에 맞서며 기존 질서를 불안정하게 만들고 있습니다."
 UKR_luaz_idea_desc: "국내 LuAZ 자동차 제조사에 대한 지원은 차량과 트럭의 생산 비용을 줄입니다."
 UKR_anti_socialist_media_desc: "국가와 보조를 맞추는 언론이 공산주의 및 중립 성향 정서를 억눌러, 여론에 대한 반동적 정부의 장악력을 강화합니다."
 ukraine_union.1.t: "완전한 연방 국가를 제안하는 우크라이나"
 ukraine_union.1.d: "키이우는 자국의 국가 체제를 우리 국가에 해소하고, 양국을 우크라이나의 지도 아래 하나의 연방 국가로 합치자고 제안했습니다. 모든 중핵, 모든 자산, 모든 병사가 그들의 것이 될 것입니다. 이 연방을 위해 우리의 독립을 내놓아야 할까요?"
 ukraine_union.1.a: "연방을 받아들인다"
 ukraine_union.1.b: "우리 국가를 내놓지 않겠다"
 ukraine_union.2.t: "연방을 거부한 러시아"
 ukraine_union.2.d: "모스크바는 우리의 연방 국가로 스스로를 해소하기를 거부했습니다. 카르파티아에서 태평양까지 하나의 민족이 되는 꿈은 미뤄야 할 것입니다."
 ukraine_union.2.a: "놓친 기회"
 ukraine_union.3.t: "함께 NATO에 가입하자고 제안하는 우크라이나"
 ukraine_union.3.d: "키이우는 우리에게 현재의 동맹을 떠나 그들과 함께 NATO에 가입하여 동유럽의 안보 질서를 재편하자고 권유합니다. 이 길을 함께 가야 할까요?"
 ukraine_union.3.a: "함께 NATO에 가입한다"
 ukraine_union.3.b: "우리의 자리는 NATO가 아니다"
 ukraine_union.4.t: "NATO 가입을 거부한 러시아"
 ukraine_union.4.d: "모스크바는 우리와 함께 NATO에 가입하기를 거절했습니다. 우리는 서방으로 가는 길을 홀로 개척해야 할 것입니다."
 ukraine_union.4.a: "그렇게 하자"
 ukraine_kommi.16.t: "동부의 공산주의 봉기"
 ukraine_kommi.16.d: "키이우가 후원한 공산주의 봉기가 우리 동부 지방 여러 곳을 장악하고 우크라이나의 지원 아래 독립을 선언했습니다. 우리는 이를 잊지 않을 것입니다."
 ukraine_kommi.16.a: "이를 기억하겠다"
 UKR_brotherhood_people_desc: "집단적 복지와 연대를 강조하는 공산주의 사회 운동은 소비재 부담을 줄이는 동시에 이념적 방어를 강화합니다."
 UKR_social_reform_desc: "사회 복지의 확대는 공산주의 통치 아래에서 생활 수준을 개선하면서 의료 및 사회 비용을 줄입니다."
 UKR_equal_rights_idea_desc: "모든 계층에 걸친 평등권 정책의 시행은 관료주의적 부담을 줄이고 정치적 단결을 강화합니다."
 UKR_west_investors_idea_desc: "서방 시장 참여자들이 자본과 경제 전문성을 제공하여 기업 발전과 경제에 대한 대중의 신뢰를 뒷받침했습니다."
 UKR_our_investors_idea_desc: "국내 투자자의 자본은 연구 역량을 자극하고 경기 순환을 안정시키며 외교 정책의 독립성을 강화합니다."
 UKR_socialist_effort_desc: "사회주의 생산을 위한 경제 동원은 안정도, 인구 증가, 소비재 공급을 높입니다."
 UKR_alpha: "알파"
 UKR_alpha_desc: "SBU의 알파 특수작전부대는 파괴 위협에 대한 우리의 방첩 및 보안 작전을 강화합니다."
 UKR_svr_desc: "대외정보국의 작전은 정보망 발전과 외국의 전복 공작에 대한 기관 방어를 강화합니다."
 UKR_sviaz_desc: "국가특수통신국은 개선된 암호화, 복호화 및 보안 통신 기반시설을 제공합니다."
 UKR_ukraine_always_right: "우크라이나는 언제나 옳다"
 UKR_ukraine_always_right_desc: "진정한 애국자들이 우크라이나에서 집권했습니다. 우크라이나는 언제나 옳으며, 우크라이나가 무엇보다 우선합니다."
 UKR_take_control_of_the_media: "언론 장악"
 UKR_take_control_of_the_media_desc: "언론 매체는 최근 몇 년간 너무 큰 자유를 누렸습니다. 그들은 우리나라가 얼마나 나쁘고 끔찍한지 선전하는 일에만 몰두해 왔으며, 우리는 이를 바로잡을 것입니다."
 UKR_prohibition_of_non_nationalist_organizations: "비민족주의 단체 금지"
 UKR_prohibition_of_non_nationalist_organizations_desc: "민족주의 대의를 거부하는 모든 단체는 새로운 질서에 대한 위협입니다. 이들을 모두 금지하고 우리 운동을 나라의 유일한 합법 정치 세력으로 남기십시오."
 UKR_anti_russian_policy: "반러시아 정책"
 UKR_anti_russian_policy_desc: "모스크바는 여전히 우크라이나 민족의 가장 큰 적입니다. 러시아에 대한 적대를 공식 국가 정책으로 명문화하고 우리 기구에서 러시아의 영향력을 일소하십시오."
 UKR_loyal_teachers_in_schools: "학교의 충성스러운 교사"
 UKR_loyal_teachers_in_schools_desc: "학교는 미래의 애국적인 우크라이나 시민의 기초입니다. 학교에는 진정한 우크라이나인만 남길 것입니다."
 UKR_ban_all_languages_except_ukrainian: "우크라이나어 외 모든 언어 금지"
 UKR_ban_all_languages_except_ukrainian_desc: "우크라이나화 프로그램을 시작할 것이며, 다른 모든 언어는 학교 교육과정, 업무상 의사소통 및 우크라이나 시민 생활의 기타 영역에서 제거될 것입니다."
 UKR_introduce_death_penalty_for_disloyal_persons: "불충한 자에 대한 사형 도입"
 UKR_introduce_death_penalty_for_disloyal_persons_desc: "충성은 모든 시민이 조국에 빚지고 있는 것입니다. 조국을 증오하는 자들, 조국을 모욕하려는 모든 자들을 필요한 모든 수단을 동원해 제거할 것입니다."
 UKR_united_council_of_ukrainian_nationalists: "우크라이나 민족주의자 통합 평의회"
 UKR_united_council_of_ukrainian_nationalists_desc: "마침내 우크라이나의 진정한 지지자들이 이끄는 진정한 애국주의와 민족주의가 나라를 다스립니다. 우리의 대회는 위대한 나라를 건설하기 위한 것입니다."
 UKR_right_sector: "우익 섹터"
 UKR_right_sector_desc: "우익 섹터는 새로운 우크라이나 국가의 내부 정치 부문을 책임질 것입니다."
 UKR_full_order_in_the_country: "나라의 완전한 질서"
 UKR_full_order_in_the_country_desc: "질서는 안정의 열쇠입니다. 혼돈, 무질서, 반란의 징후에 맞서 싸울 것입니다."
 UKR_ukrainian_assault_battalions: "우크라이나 돌격 대대"
 UKR_ukrainian_assault_battalions_desc: "특히 애국적인 시민들로 구성된 충격 대대를 창설하여 특수 임무를 수행하게 할 것입니다."
 UKR_make_government_jobs_only_for_ukrainians: "공직을 우크라이나인에게만 허용"
 UKR_make_government_jobs_only_for_ukrainians_desc: "오직 우크라이나인만이 조국의 이익을 위해 일해야 하며, 그 외의 모든 사람은 일할 권리가 없어야 합니다."
 UKR_complete_the_cleansing_of_the_ukrainian_state: "우크라이나 국가의 정화 완료"
 UKR_complete_the_cleansing_of_the_ukrainian_state_desc: "우리 조국은 적, 비방자, 기타 부정적 요소들로부터 정화되었습니다."
 UKR_limit_the_powers_of_the_mvd: "MVD 권한 제한"
 UKR_limit_the_powers_of_the_mvd_desc: "경찰과 기타 당국이 국가 내에서 너무 큰 권력을 쥐고 있으며, 이를 제한할 것입니다."
 UKR_night_of_the_long_knives: "장검의 밤"
 UKR_night_of_the_long_knives_desc: "개혁에 특히 저항하는 자들을 보다 급진적으로 제거할 것입니다."
 UKR_una_unso: "UNA-UNSO"
 UKR_una_unso_desc: "대외 정책 활동은 UNA-UNSO 조직의 어깨에 맡겨질 것입니다."
 UKR_external_intervention: "대외 개입"
 UKR_external_intervention_desc: "평화 정책을 추구하는 것을 멈출 때입니다. 우리는 세계의 흐름에 적극적으로 영향을 미칠 것입니다."
 UKR_resolve_the_moldovan_issue: "몰도바 문제 해결"
 UKR_resolve_the_moldovan_issue_desc: "몰도바와 트란스니스트리아는 오랫동안 우리의 앞길을 가로막아 왔으며, 그들의 독립은 한낱 실수일 뿐입니다. 우리가 이를 바로잡을 것입니다."
 UKR_dig_up_potatoes: "감자 캐기"
 UKR_dig_up_potatoes_desc: "벨라루스는 서쪽과 동쪽의 적들 모두가 우리를 공격하는 데 이용할 수 있습니다. 스스로를 지키는 최선의 방법은 먼저 치는 것입니다!"
 UKR_to_recall_the_volhynia_massacre: "볼히니아의 경험"
 UKR_to_recall_the_volhynia_massacre_desc: "우리는 다시 폴란드인들과 마주했으며, 다시 한번 그들에게 맞서 싸워야 합니다. 이제 우리나라가 폴란드의 위협을 끝낼 때입니다."
 UKR_secretly_sending_militants_to_kuban: "크림반도의 반란 조장"
 UKR_secretly_sending_militants_to_kuban_desc: "크림반도를 러시아에게 빼앗긴 것은 금세기 최대의 역사적 부당함입니다. 우리 당국의 나약함은 끔찍하고 수치스러운 것으로 드러났습니다. 우리가 이를 바로잡을 것입니다."
 UKR_agitation_of_radical_ukrainians_in_kuban: "쿠반의 반란 조장"
 UKR_agitation_of_radical_ukrainians_in_kuban_desc: "쿠반은 우리의 땅이며 앞으로도 그러할 것입니다. 우리는 이 땅을 러시아로부터 되찾으려 노력할 것입니다."
 UKR_liberate_green_klin: "그린 클린 \\"해방\\""
 UKR_liberate_green_klin_desc: "러시아 곰의 압제로부터 극동의 우리 형제들을 \\"해방\\"시킬 때입니다."
 UKR_shoot_a_russian_bear: "러시아 곰 사냥"
 UKR_shoot_a_russian_bear_desc: "러시아 곰은 우리의 깔개가 될 것입니다!"
 UKR_declare_a_great_ukraine: "대우크라이나 선포"
 UKR_declare_a_great_ukraine_desc: "우크라이나는 위대해졌으며, 온 세상이 이를 알게 하십시오."
 UKR_upa: "UPA"
 UKR_upa_desc: "나라의 민방위와 내부 방위 활동은 부활한 우크라이나 반군에게 맡겨질 것입니다."
 UKR_new_orders_of_formation_of_upa_groups: "UPA 집단 편성의 새로운 명령"
 UKR_new_orders_of_formation_of_upa_groups_desc: "제2차 세계 대전 당시 UPA의 경험을 참고하고 실수를 반영하여 새로운 여단을 창설할 것입니다."
 UKR_partisan_units: "빨치산 부대"
 UKR_partisan_units_desc: "앞으로 적에 적극적으로 저항하기 위해 전국에 UPA 유격 세포가 조직될 것입니다."
 UKR_partisanship_as_an_ideology: "이념으로서의 빨치산 정신"
 UKR_partisanship_as_an_ideology_desc: "우리 빨치산은 적에게 적극적으로 저항하기 위해 이념 교육을 받아야 합니다."
 UKR_make_military_exercises_in_the_country_compulsory_for_all: "전 국민 군사 훈련 의무화"
 UKR_make_military_exercises_in_the_country_compulsory_for_all_desc: "모든 우크라이나인은 조국을 지킬 수 있어야 합니다. UPA 전문가들이 일반 시민을 훈련시키면 우리나라의 전투력이 강화될 것입니다."
 UKR_to_arm_every_person_in_the_country: "전 국민 무장"
 UKR_to_arm_every_person_in_the_country_desc: "여성, 아이, 남성, 노인, 모두가 무기를 들고 적을 향해 쏠 수 있어야 합니다."
 UKR_form_an_alliance_of_right_wing_youth: "우익 청년 동맹 결성"
 UKR_form_an_alliance_of_right_wing_youth_desc: "우크라이나의 청년들은 무장하기에 앞서 조직되어야 합니다. 흩어져 있는 우익 청년 운동을 민족주의 대의에 충성하는 하나의 동맹으로 결집시키십시오."
 UKR_ukraine_is_a_land_of_partisans: "우크라이나는 빨치산의 땅"
 UKR_ukraine_is_a_land_of_partisans_desc: "적이 우리를 침공한다면 모든 마을, 모든 도시에 빨치산이 나타날 것입니다. 우리는 우크라이나 국민의 힘으로 그를 맞이할 것입니다."
 UKR_nationalists_right_sector_desc: "우익 섹터 민병대를 국가 기구에 통합하면 민족주의 정서와 정치적 권위가 강화됩니다."
 UKR_nationalists_una_unso_desc: "민족주의 운동 UNA-UNSO는 의용병 동원을 촉진하고 비정규전 능력을 향상시킵니다."
 UKR_nationalists_upa_desc: "역사적 UPA의 저항 전술을 활용하면 보급 효율과 중핵 영토 방어가 강화됩니다."
 UKR_nationalists_cleane_ukraine_desc: "전면적인 민족주의 결집 운동은 외세의 영향력에 대한 저항을 강화하고 계속 싸우겠다는 의지를 굳건히 합니다."
 UKR_nationalists_trizub_desc: "트리주브 조직은 민족주의 정서와 국방에 대한 헌신을 결집시킵니다."
 UKR_nabu: "우크라이나 국가반부패국"
 UKR_nabu_desc: "새로운 반부패국은 모든 수준의 부패 공직자들에 대한 투쟁을 몇 배로 강화하기 위해 설계되었습니다."
 UKR_poroh_deccomuniz: "포로셴코 대통령 체제"
 UKR_poroh_deccomuniz_desc: "포로셴코는 평가가 엇갈리는 인물이지만, 적 앞에서 우크라이나를 강하게 만들겠다는 그의 의지는 국민의 존경을 받을 만합니다."
 UKR_west_investors_desc: "서방 외국인 투자자들이 시장으로 유입되어 민주주의 제도를 강화하고 경제 성장과 안정을 이끌고 있습니다."
 UKR_operation_wall_desc: "이 동원 기간 동안 방어 요새 건설이 극적으로 가속화됩니다."
 UKR_ato_supports_desc: "대테러 작전 참전 용사에 대한 지원은 민족주의 정서를 강화하고 복무한 이들에 대한 우리의 책임을 굳건히 합니다."
 UKR_health_supports_desc: "의료 지원금의 확대는 공공 복지를 개선하고 민주적 통치에 대한 지지를 강화합니다."
 UKR_pivdenmash_idea_desc: "피우덴마시 국영 기업은 향상된 효율로 탄도 미사일 및 핵 미사일 생산을 전문으로 합니다."
 UKR_kyvarmor_idea_desc: "키이우 장갑차 공장은 개량형 중형 전차 차체와 수륙양용형 생산을 전문으로 합니다."
 UKR_tsnap_idea_desc: "TSNAP 국가 행정 기관은 중앙 정부의 관료 체계를 간소화하고 행정 간접비용을 줄입니다."
 UKR_concern_desc: "흩어져 있던 군수 제조업을 하르키우 군수 산업 단지로 통합하면 전차와 차량 생산 효율이 개선됩니다."
 UKR_zaz_idea_desc: "ZAZ 자동차 생산이 되살아나 차량 신뢰도가 개선되고 민수 및 군용 수송의 제조 비용이 줄어듭니다."
 UKR_kraz_idea_desc: "KrAZ 차량 생산은 트럭과 장갑차량의 국내 제조를 제공하여 수입 의존도를 줄입니다."
 UKR_motorsich_idea_desc: "모토르 시치 항공기 엔진 생산에 대한 국가 지원은 대형 항공기와 헬리콥터 제조 비용을 줄입니다."
 UKR_interlegion_decision_category: "영토방위 국제군단"
 UKR_interlegion_decision_category_desc: "우크라이나 영토방위 국제군단은 우크라이나군 영토 방위대의 일부로서 의용 부대를 구성하기 위해 외국인을 모집하려는 우크라이나 정부의 프로젝트입니다."
 UKR_vetrenko_surrort_nationalism_desc: "민족주의 운동이 국민을 결집시켜, 외부의 위협으로 인식되는 것에 맞서 우크라이나의 정체성과 문화적 주권을 강조하고 있습니다."
 UKR_vetrenko_pioneria_desc: "애국 교육을 장려하고 젊은 세대의 정치 의식을 높이기 위해 민족주의 청년 조직이 설립되었습니다."
 UKR_vetrenko_health_free_idea_desc: "전국적으로 무상 의료가 시행되어 인구 증가는 개선되었으나, 의료비 지출 증가로 재정에 부담이 되고 있습니다."
 UKR_economic_reforms_modifier: "우크라이나 경제 발전"
 UKR_economic_reforms_modifier_desc: "수십 년간의 과두 체제 정체는 우크라이나 경제를 소비에트 시대의 유물과 그림자 시장이 뒤섞인 누더기로 만들었습니다. 지속적인 개혁 프로그램이 관료제를 서서히 풀어내고, 외국 투자를 유치하며, 낡은 산업을 현대화하고 있습니다. 모든 진전은 재가동된 공장과 이행된 계약으로 측정됩니다."
 UKR_military_reforms_modifier: "우크라이나 군사 발전"
 UKR_military_reforms_modifier_desc: "우크라이나군은 예산 부족과 사기 저하 속에 녹슬어 가는 소련 비축 물자로 무장한 채 이 세기에 들어섰습니다. 개혁은 새 소총 이상의 의미를 지닙니다. 전문 장교, 현실적인 훈련, 그리고 우리가 실제로 맞닥뜨릴 전쟁을 위해 작성된 교리를 뜻합니다. 그 결과는 어느 후원자가 아닌 국가에 충성하는 더 날렵하고 강인한 군대일 것입니다."
 UKR_kuchma_shortcut: "쿠치마"
 UKR_kuchma_second_terms: "쿠치마 2기"
 UKR_kuchma_second_terms_desc: "쿠치마 대통령은 두 번째 임기째 우리나라를 통치하고 있습니다. 어쩌면 이번에는 재선되지 못할 수도, 혹은 나라를 혼란으로 이끌 수도 있습니다. 지켜봅시다."
 UKR_dissolve_rada: "라다 해산"
 UKR_restore_rada: "라다 복원"
 ukr_industry_points_cost_35_blocked: "산업 포인트 35 필요"
 ukr_industry_points_cost_50_blocked: "산업 포인트 50 필요"
 ukr_industry_points_cost_75_blocked: "산업 포인트 75 필요"
 UKR_wind_energy: "풍력 에너지 프로그램 완료"
 UKR_solar_energy: "태양광 발전 프로그램 완료"
 UKR_finance_vv_tt: "내무군이 해체되거나 다른 군종에 흡수되지 않고 개편된 전력을 유지하고 있어야 합니다"
 UKR_unite_with_russian_genshtab_tt: "군사 개혁 갈래가 두 번째 단계에 있지 않아야 합니다"
 UKR_nato_aid_donor_one: "[FROM.GetName]이(가) 우리의 전쟁 수행을 위한 지원을 전달하였습니다."
 UKR_nato_aid_donor_many: "[FROM.GetName]이(가) 이끄는 §Y[?UKR.UKR_aid_report_donors^num]§!개 동맹국 정부가 우리의 전쟁 수행을 위한 지원을 전달하였습니다."
 UKR_aid_report_money_tt: "[THIS.GetFlag][THIS.GetAdjective] §Y국고§!: $$[?UKR_aid_report_money|+] 십억"
 ukraine_revolution.30.t: "크름 최고회의"
 ukraine_revolution.30.d: "크름 최고회의가 키이우 권위의 한계를 시험하고 있습니다. 반도의 지위에 관한 국민투표를 허용해야 하겠습니까, 아니면 회의를 해산해야 하겠습니까?"
 ukraine_revolution.30.a: "국민투표를 허용한다"
 ukraine_revolution.30.b: "회의를 해산한다"
 ukraine_revolution.31.t: "모스크바의 개입"
 ukraine_revolution.31.d: "키이우가 크름의 지위 문제를 열었습니다. 모스크바는 우크라이나의 자치 방안을 수용하거나 독자적인 국민투표를 후원할 수 있습니다."
 ukraine_revolution.31.a: "우크라이나의 자치를 수용한다"
 ukraine_revolution.31.b: "국민투표를 후원한다"
 ukraine_revolution.32.t: "크름 국민투표"
 ukraine_revolution.32.d: "국민투표로 크름의 미래가 모스크바의 손에 넘어왔습니다. 러시아 보호령을 인정할지, 반도를 직접 병합할지 결정해야 합니다."
 ukraine_revolution.32.a: "러시아 보호령을 수립한다"
 ukraine_revolution.32.b: "크름을 직접 병합한다"
 ukraine_revolution.33.t: "모스크바의 대응"
 ukraine_revolution.33.d: "키이우가 크름 회의를 해산하였습니다. 모스크바는 압박으로 대응할지 물러설지 결정해야 합니다."
 ukraine_revolution.33.a: "외교적 압박을 가한다"
 ukraine_revolution.33.b: "물러선다"
 ukraine_revolution.40.t: "도네츠크의 정치적 미래"
 ukraine_revolution.40.d: "도네츠크 지역이 자신들의 정부에 대한 직접적인 발언권을 요구하고 있습니다. 키이우는 협상을 통한 해결, 강경 진압, 새로운 자치 공화국 가운데 선택해야 합니다."
 ukraine_revolution.40.a: "지방 자치를 협상한다"
 ukraine_revolution.40.b: "회의를 해산한다"
 ukraine_revolution.40.c: "도네츠크 공화국을 허용한다"
 ukraine_revolution.40.e: "돈바스가 무장 봉기하게 둔다"
 ukraine_revolution.41.t: "루한스크의 정치적 미래"
 ukraine_revolution.41.d: "루한스크의 회의들이 도네츠크의 선례를 따르고 있습니다. 그들의 요구는 타협, 무력, 또는 공화국 인정을 통해 억제할 수 있습니다."
 ukraine_revolution.41.a: "지방 자치를 협상한다"
 ukraine_revolution.41.b: "운동을 진압한다"
 ukraine_revolution.41.c: "루한스크 공화국을 허용한다"
 ukraine_revolution.42.t: "크름의 정치적 미래"
 ukraine_revolution.42.d: "나라가 이미 압박을 받고 있는 가운데 크름의 지위가 다시 논란이 되고 있습니다. 키이우는 지방 자치를 인정하거나, 회의를 해산하거나, 제한적인 크름 절차에 따를 수 있습니다."
 ukraine_revolution.42.a: "지방 자치를 협상한다"
 ukraine_revolution.42.b: "회의를 해산한다"
 ukraine_revolution.42.c: "크름 절차를 활용한다"
 ukraine_revolution.43.t: "하르키우 회의"
 ukraine_revolution.43.d: "하르키우의 지방 정치인들이 키이우 권위의 한계를 시험하고 있습니다. 정부는 협상할지, 회의를 진압할지, 지방 행정부를 용인할지 결정해야 합니다."
 ukraine_revolution.43.a: "지방 자치를 협상한다"
 ukraine_revolution.43.b: "회의를 진압한다"
 ukraine_revolution.43.c: "지방 행정부를 용인한다"
 ukraine_revolution.44.t: "자포리자 회의"
 ukraine_revolution.44.d: "자포리자가 지방 기관에 대한 보장을 요구하고 있습니다. 타협은 지역을 진정시킬 수 있으나 탄압은 위기를 확산시킬 수 있습니다."
 ukraine_revolution.44.a: "지방 자치를 협상한다"
 ukraine_revolution.44.b: "회의를 진압한다"
 ukraine_revolution.44.c: "지방 행정부를 용인한다"
 ukraine_revolution.45.t: "남부 회의들"
 ukraine_revolution.45.d: "헤르손과 미콜라이우가 지방 통제권 요구를 중심으로 결집하고 있습니다. 이들의 회의는 합의에 끌어들일 수도, 공공연한 반대 세력으로 내몰 수도 있습니다."
 ukraine_revolution.45.a: "지방 자치를 협상한다"
 ukraine_revolution.45.b: "회의들을 진압한다"
 ukraine_revolution.45.c: "지방 행정부들을 용인한다"
 ukraine_revolution.46.t: "오데사의 정치적 미래"
 ukraine_revolution.46.d: "오데사 회의는 자치와 키이우와의 완전한 결별 사이에서 저울질하고 있습니다. 정부가 통제력을 잃으면 기존의 오데사 공화국이 대안으로 등장할 수 있습니다."
 ukraine_revolution.46.a: "지방 자치를 협상한다"
 ukraine_revolution.46.b: "회의를 진압한다"
 ukraine_revolution.46.c: "오데사 공화국을 허용한다"
 ukraine_revolution.47.t: "드니프로의 정치적 미래"
 ukraine_revolution.47.d: "드니프로 공업 지대가 새로운 정치 질서에서의 발언권을 요구하고 있습니다. 키이우는 협상하거나, 회의를 진압하거나, 기존의 드니프로 공화국이 등장하도록 허용할 수 있습니다."
 ukraine_revolution.47.a: "지방 자치를 협상한다"
 ukraine_revolution.47.b: "회의를 진압한다"
 ukraine_revolution.47.c: "드니프로 공화국을 허용한다"
 ukraine_revolution.48.t: "수미 회의"
 ukraine_revolution.48.d: "수미의 지방 당국이 키이우에서 내려지는 결정에 대한 보장을 요구하고 있습니다. 협상을 통한 회의가 가장 혼란이 적은 길이지만 진압과 인정도 여전히 가능합니다."
 ukraine_revolution.48.a: "지방 자치를 협상한다"
 ukraine_revolution.48.b: "회의를 진압한다"
 ukraine_revolution.48.c: "지방 행정부를 용인한다"
 ukraine_revolution.49.t: "노보로시야의 미래"
 ukraine_revolution.49.d: "참여 공화국들이 노보로시야로 통합되었습니다. 키이우는 이를 우크라이나의 자치 구성체로 인정할지, 독립 연합을 받아들일지, 영토를 위해 싸울지 결정해야 합니다."
 ukraine_revolution.49.a: "우크라이나의 자치 구성체로 인정한다"
 ukraine_revolution.49.b: "독립 연합을 받아들인다"
 ukraine_revolution.49.c: "영토를 위해 싸운다"
 ukraine_revolution.50.t: "기억되는 대회"
 ukraine_revolution.50.d: "세베로도네츠크 대회는 지역의 정치적 기억의 일부가 되었습니다. 키이우의 결정에 대한 발언권을 요구한 그들의 주장은 지금도 공화국의 제도를 형성하고 있습니다."
 ukraine_revolution.50.a: "유산을 기록한다"
 ukraine_revolution.51.t: "제도가 된 회의"
 ukraine_revolution.51.d: "지방 회의의 물결은 막을 내렸습니다. 일부 회의는 억제되었고 다른 회의는 공화국이 되었으나, 모두 마이단 이후 체제에 지속적인 흔적을 남겼습니다."
 ukraine_revolution.51.a: "새로운 정치 지도"
 ukraine_revolution.52.t: "공화국의 형성"
 ukraine_revolution.52.d: "첫 번째 지방 공화국이 자체 정부를 수립하였습니다. 그 미래는 지방 행정이 자신을 탄생시킨 위기를 견뎌낼 수 있는지에 달려 있을 것입니다."
 ukraine_revolution.52.a: "전선을 지킨다"
 ukraine_revolution.53.t: "크름의 긴 그림자"
 ukraine_revolution.53.d: "크름의 2004년 합의가 마침내 정치 질서에 기록되었습니다. 이 결정이 모든 분쟁을 끝내지는 못하였으나, 반도의 지위에 무시할 수 없는 역사를 부여하였습니다."
 ukraine_revolution.53.a: "합의를 기억한다"
 ukraine_revolution.54.t: "노보로시야 합의"
 ukraine_revolution.54.d: "노보로시야 합의는 키이우, 지방 공화국들, 모스크바 사이의 균형을 바꾸었습니다. 새로운 체제는 그것이 내세우는 바가 아니라 지켜내는 바로 평가받을 것입니다."
 ukraine_revolution.54.a: "기록을 보존한다"
 ukraine_revolution.55.t: "자유 영토"
 ukraine_revolution.55.d: "새 국가 지도부 내의 아나키스트 투사들은 노보로시야가 훌랴이폴레 사람들에게 아무 의미도 없는 빌려온 이름이라고 주장합니다. 그들은 네스토르 마흐노의 옛 깃발을 되살리고 이 땅을 있는 그대로, 즉 자유 영토라 부르고자 합니다."
 ukraine_revolution.55.a: "자유 영토를 채택한다"
 ukraine_revolution.55.b: "노보로시야라는 이름을 유지한다"
 ukraine_regions.13.t: "하르키우 협정"
 ukraine_regions.13.d: "러시아가 천연가스 할인을 대가로 흑해 함대의 세바스토폴 임대 기간을 연장하자고 제안하고 있습니다."
 ukraine_regions.13.a: "협정에 서명한다"
 ukraine_regions.13.b: "협정을 거부한다"
 ukraine_regions.14.t: "티모셴코 사건"
 ukraine_regions.14.d: "율리야 티모셴코 전 총리가 2009년 러시아와의 가스 계약 문제로 기소되고 있습니다. 검찰은 그녀의 체포를 원하고 있습니다."
 ukraine_regions.14.a: "그녀를 체포한다"
 ukraine_regions.14.b: "그녀를 내버려 둔다"
 ukraine_regions.15.t: "지역 언어법"
 ukraine_regions.15.d: "러시아어와 기타 소수 언어에 지역 언어 지위를 부여하는 법안이 라다를 통과하였습니다. 이를 통과시키면 남동부는 기뻐하고 서부의 민족주의자들은 분노할 것입니다."
 ukraine_regions.15.a: "법을 통과시킨다"
 ukraine_regions.15.b: "법을 거부한다"
 ukraine_our_ukraine.10.t: "부쿠레슈티 정상회담"
 ukraine_our_ukraine.10.d: "부쿠레슈티에서 열린 NATO 정상회담에서 독일과 프랑스가 우크라이나에 대한 회원국 행동계획(MAP)을 가로막았습니다. 동맹의 문은 명목상으로는 열려 있으나, 그 문을 통과할 길은 마련되지 않았습니다."
 ukraine_our_ukraine.10.a: "NATO에 계속 구애한다"
 ukraine_our_ukraine.10.b: "거절을 규탄한다"
 UKR_hur_can_attack: "정부가 HUR 작전을 지지하고, HUR 개혁이 완료되었으며, 최소 하나의 HUR 부대가 편성되어 있어야 합니다"
 UKR_YUSHENKO_PATH: "게임 규칙으로 선택된 유셴코 노선"
 UKR_YANUK_PATH: "게임 규칙으로 선택된 야누코비치 노선"
 UKR_political_tension_tt: "정치적 긴장도가 §Y[?tension_change|0]§!만큼 변합니다 (현재 정치적 긴장도: §Y[?UKR.UKR_political_tension|0]§!)."
 UKR_seuar_balance: "SEUAR 자치 투쟁"
 UKR_seuar_balance_desc: "키이우의 기관들과 우크라이나 남동부 자치 운동 사이의 투쟁은 2004년 위기가 정치적 수준에 머물지, 아니면 새로운 공화국을 낳을지를 결정할 것입니다."
 UKR_seuar_kyiv_control: "키이우의 통제"
 UKR_seuar_autonomy_side: "자치 운동"
 UKR_seuar_negotiated_center: "협상에 의한 교착 상태"
 UKR_seuar_negotiated_center_desc: "키이우도 자치 운동도 결정적인 우위를 확보하지 못했습니다."
 UKR_seuar_kyiv_advantage: "키이우, 우세를 점하다"
 UKR_seuar_kyiv_advantage_desc: "반시위와 국가의 압박이 자치 운동을 억누르기 시작하고 있습니다."
 UKR_seuar_kyiv_dominance: "키이우의 압도적 우위"
 UKR_seuar_kyiv_dominance_desc: "자치 운동은 국가의 조직적 압박 아래 붕괴 직전에 놓여 있습니다."
 UKR_seuar_autonomy_advantage: "자치 운동, 우세를 점하다"
 UKR_seuar_autonomy_advantage_desc: "자치 운동은 키이우가 억제할 수 있는 속도보다 더 빠르게 조직화되고 있습니다."
 UKR_seuar_autonomy_dominance: "자치 운동의 압도적 우위"
 UKR_seuar_autonomy_dominance_desc: "자치 운동은 공식적인 자치 공화국을 요구할 만큼 충분한 지지를 확보했습니다."
 UKR_separatist_crisis_category: "분리주의 위기"
 UKR_separatist_crisis_category_desc: "[UKR.GetFlag]§Y우크라이나§!는 모든 지역 분쟁이 전쟁으로 번지지 않도록 하면서 지역 평의회와 분리주의 운동을 억제해야 합니다."
 UKR_separatist_fund_negotiations: "지역 협상 자금 지원"
 UKR_separatist_fund_negotiations_desc: "평의회가 공화국으로 변하기 전에 지역 중재자와 양보에 국고 자금을 투입합니다."
 UKR_separatist_internal_security: "내무 보안군 배치"
 UKR_separatist_internal_security_desc: "내무 보안군을 동원하여 정부 건물을 지키고 분리주의 조직자들을 억제합니다."
 UKR_separatist_recognize_councils: "자치 평의회 인정"
 UKR_separatist_recognize_councils_desc: "복종과 당면한 대치 종결의 대가로 평의회의 권한을 인정합니다."
 UKR_novorossiya_form: "노보로시야 통합"
 UKR_novorossiya_form_desc: "참여 공화국들과 지지를 받는 평의회들을 기존 노보로시야 태그 아래로 결집시킵니다."
 UKR_novorossiya_recognize: "노보로시야의 자치 인정"
 UKR_novorossiya_recognize_desc: "노보로시야가 평화를 유지하고 영토를 통제하는 동안 우크라이나의 자치 주체로 받아들입니다."
 UKR_separatist_crisis_active_tt: "2014년 지역 공화국 물결이 진행 중입니다."
 UKR_separatist_treasury_tt: "이 행동을 위해 국고에 충분한 자금이 있어야 합니다."
 SOV_backed_seuar: "러시아가 SEUAR 운동을 지원했습니다"
 UKR_crimea_2004_resolution: "2004년 크림반도 지위 문제 절차가 시작되었습니다"
 UKR_crimea_2004_pending: "2004년 크림반도 국민투표가 대기 중입니다"
 UKR_crimea_2004_departed: "크림반도가 2004년에 우크라이나를 떠났습니다"
 UKR_orange_2004_started: "2004년 정치 위기가 시작되었습니다"
 UKR_orange_2004_resolved: "2004년 정치 위기가 해결되었습니다"
 CRM_2004_content_unlocked: "2004년 크림반도 행정부가 활성화되었습니다"
 UKR_provisional_republic_focus_setup: "임시 공화국 행정부가 활성화되었습니다"
 UKR_crimea_2004_status: "크림반도 지위 해결"
 UKR_crimea_2004_status_desc: "크림 최고회의가 키이우에 도전하고 있으며 모스크바는 남동부 자치 운동을 지원하고 있습니다. 위기가 확대되기 전에 크림반도를 어떻게 처리할지 결정하십시오."
 SOV_seuar_intervention_category: "남동부 지원"
 SOV_seuar_intervention_category_desc: "모스크바는 우크라이나 남동부 자치 투쟁에 영향력을 행사할 수 있으나, 정치적 위기가 전쟁으로 번질 위험이 있습니다."
 UKR_seuar_counter_protests: "지역 반시위 지원"
 UKR_seuar_counter_protests_desc: "자치 운동을 거부하고 키이우의 영향력을 회복시키려는 지역 시위를 후원합니다."
 UKR_seuar_internal_troops: "내무군 배치"
 UKR_seuar_internal_troops_desc: "내무부 병력을 동원하여 공공 건물을 확보하고 자치 운동을 압박합니다."
 UKR_seuar_special_operations: "SBU-HUR 작전 수행"
 UKR_seuar_special_operations_desc: "정보 및 특수 작전을 활용하여 자치 운동을 교란합니다. 이는 러시아 개입의 위험을 높입니다."
 UKR_seuar_reintegrate: "헌법적 타협 제안"
 UKR_seuar_reintegrate_desc: "SEUAR에 헌법적 타협을 제안하고 우크라이나로 재통합합니다."
 UKR_seuar_force: "자치 문제의 강제 해결"
 UKR_seuar_force_desc: "자치 체제를 무력으로 끝냅니다. 이는 국경 전쟁과 러시아의 개입을 불러올 수 있습니다."
 SOV_seuar_fund_movement: "자치 운동 자금 지원"
 SOV_seuar_fund_movement_desc: "SEUAR 조직자들에게 정치적, 재정적 지원을 제공합니다."
 SOV_seuar_suborn_units: "현지 부대 매수"
 SOV_seuar_suborn_units_desc: "현지 우크라이나 부대가 명령을 거부하거나 자치 운동 편에 서도록 부추깁니다."
 SOV_seuar_send_volunteers: "의용병 파견"
 SOV_seuar_send_volunteers_desc: "자치 운동을 방어하기 위해 접경 지역에서 의용병을 파견합니다."
 UKR_seuar_active_tt: "SEUAR 자치 투쟁이 진행 중입니다."
 UKR_seuar_treasury_tt: "이 행동을 위해 국고에 충분한 자금이 있어야 합니다."
 SOV_seuar_treasury_tt: "이 행동을 위해 국고에 충분한 자금이 있어야 합니다."
 UKR_pro_russian_support_30_tt: "러시아가 우크라이나에 대해 최소 §Y30%§!의 영향력을 보유하고 있음"
 UKR_seuar_counter_protests_tt: "자치 투쟁을 키이우 쪽으로 §R0.10§!만큼 기울이며 안정도를 소모합니다."
 UKR_seuar_internal_troops_tt: "국고 §R3§!을 소모하고, 투쟁을 키이우 쪽으로 §R0.15§!만큼 기울이며, 안정도를 소모합니다."
 UKR_seuar_special_operations_tt: "국고 §R5§!를 소모하고, 투쟁을 키이우 쪽으로 §R0.08§!만큼 기울이며, 안정도를 소모합니다."
 UKR_seuar_reintegration_tt: "SEUAR가 재통합됩니다. 우크라이나는 러시아의 영향력을 얻고 긴장도가 §G15§!만큼 하락합니다."
 UKR_seuar_force_tt: "SEUAR가 독립하며 제한적인 국경 전쟁이 시작됩니다."
 UKR_seuar_intervention_risk_tt: "전쟁이 계속되면 러시아의 개입이 가능해집니다."
 UKR_seuar_no_intervention_tt: "모스크바는 분쟁에 개입하지 않을 수도 있습니다."
 SOV_seuar_fund_movement_tt: "국고 §R5§!를 소모하고 투쟁을 자치 쪽으로 §G0.10§!만큼 기울입니다."
 SOV_seuar_suborn_units_tt: "국고 §R4§!를 소모하고, 투쟁을 자치 쪽으로 §G0.12§!만큼 기울이며, 긴장 고조를 높입니다."
 SOV_seuar_send_volunteers_tt: "국고 §R8§!을 소모하고, 투쟁을 자치 쪽으로 §G0.18§!만큼 기울이며, 긴장 고조를 높입니다."
 UKR_prp_provisional_administration: "임시 행정부 수립"
 UKR_prp_provisional_administration_desc: "위기가 영구적 분열로 굳어지기 전에 새 공화국에는 제 기능을 하는 행정부가 필요합니다."
 UKR_prp_local_security: "지역 치안 조직"
 UKR_prp_local_security_desc: "지역 치안 위원회는 모든 정치적 분쟁을 전쟁으로 번지게 하지 않으면서 무질서를 줄일 수 있습니다."
 UKR_prp_volunteer_forces: "의용군 편성"
 UKR_prp_volunteer_forces_desc: "공화국의 제도와 정규군이 아직 검증되지 않은 동안에는 의용병들이 공화국을 방어할 것입니다."
 UKR_prp_utilities_repair: "공공시설 및 도로 복구"
 UKR_prp_utilities_repair_desc: "교통 및 공공시설망을 복구하면 임시 정부에 의존하는 지역 사회들이 다시 연결될 것입니다."
 UKR_prp_emergency_economy: "비상 경제 안정화"
 UKR_prp_emergency_economy_desc: "소규모 산업 기반과 비상 생산은 이행기 동안 공화국의 보급을 유지할 수 있습니다."
 UKR_prp_constitutional_choice: "헌법적 합의 선택"
 UKR_prp_constitutional_choice_desc: "임시 기구는 자신들이 키이우로 돌아가는 다리인지, 모스크바의 동반자인지, 아니면 별개 국가의 토대인지 결정해야 합니다."
 UKR_prp_negotiate_kyiv: "키이우와 협상"
 UKR_prp_negotiate_kyiv_desc: "키이우와의 직접적인 합의는 또 다른 무력 충돌을 피하면서 지역 기구를 보호할 수 있습니다."
 UKR_prp_seek_moscow_support: "모스크바의 지원 요청"
 UKR_prp_seek_moscow_support_desc: "모스크바는 외교적 후원을 제공할 수 있으나, 그 지원을 받아들이면 공화국의 장래 노선이 결정될 것입니다."
 UKR_prp_independent_republic: "독립 공화국 선포"
 UKR_prp_independent_republic_desc: "임시 정부는 종속적 지위를 끝내고 홀로 서는 위험을 감수할 수 있습니다."
 UKR_prp_regional_union: "지역 연합 구축"
 UKR_prp_regional_union_desc: "경쟁하는 또 다른 태그를 만드는 대신 기존 노보로시야 체제와 협력합니다."
 DRP_pivdenmash_rearmament: "피우덴마시 재가동"
 DRP_pivdenmash_rearmament_desc: "과거 유즈마시의 로켓 및 중장비 공장은 누군가 공장 문을 다시 열 의지만 있다면 여전히 무기를 생산할 수 있습니다."
 DRP_industrial_mobilization: "드니프로 산업 동원"
 DRP_industrial_mobilization_desc: "드니프로의 소련 시대 산업 기반을 공화국의 필요에 맞게 돌릴 수 있으나, 아직 남아 있는 민수 생산을 희생해야 합니다."
 DRP_dnieper_logistics: "드니프로강 물류 확보"
 DRP_dnieper_logistics_desc: "이 강은 언제나 지역의 물자를 실어 날랐습니다. 선착장과 진입로를 재건하면 그 물동량을 공화국의 통제 아래 둘 수 있습니다."
 DRP_kolomoisky_purge: "콜로모이스키 인맥망 숙청"
 DRP_kolomoisky_purge_desc: "이 올리가르히의 후원 연결망은 여전히 지방 행정과 기업을 관통하고 있습니다. 이를 뿌리 뽑으면 공화국 자체의 인물들을 위한 길이 열립니다."
 DRP_state_security_consolidation: "국가 보안 기구 통합"
 DRP_state_security_consolidation_desc: "특정 지역을 장악한 어느 파벌이 아니라 공화국에 책임을 지는 제대로 된 보안 기관의 설립은 이미 늦었습니다."
 DRP_moscow_alignment: "모스크바와의 연대"
 DRP_moscow_alignment_desc: "모스크바와의 군사적, 경제적 유대를 공식화하는 것은 공화국이 무너지게 두지 않을 후원자를 얻는 대신 행동의 독립성을 내주는 일입니다."
 UKR_seuar_autonomy_movement: "SEUAR 자치 운동"
 UKR_seuar_autonomy_movement_desc: "남동부 자치 운동이 키이우의 권위에 도전하고 있습니다. 그 미래는 지역 조직자들과 국가의 압박 사이의 균형에 달려 있습니다."
 UKR_western_crisis_idea: "서우크라이나 정부"
 UKR_western_crisis_idea_desc: "서부 주들은 부정 선거를 인정하기를 거부하고 자체 정부를 선포했습니다. 이 대치는 키이우가 서부 문제를 해결할 때까지 국가 정치를 마비시킵니다."
 UKR_constitutional_compromise_idea: "헌법적 타협"
 UKR_constitutional_compromise_idea_desc: "자치 위기를 종결시킨 헌법적 합의는 실질적 권력을 지역에 이양합니다. 이는 중앙 정부의 약화를 대가로 남동부를 진정시킵니다."
 ukraine_kuchma.14.t: "남동부의 시위"
 ukraine_kuchma.14.d: "선거 이후 남동부 활동가들이 키이우의 합의를 거부하고 푸른 마이단을 조직했습니다. 이 운동은 선거 위기를 지역 위기로 바꿔 놓을 위험이 있습니다."
 ukraine_kuchma.14.a: "상황이 악화되고 있다"
 ukraine_kuchma.15.t: "우크라이나의 푸른 마이단"
 ukraine_kuchma.15.d: "푸른 마이단은 모스크바에 지역 자치 요구를 인정해 달라고 요청하고 있습니다. 크렘린은 이 운동에 정치적 무게를 실어 줄지 결정해야 합니다."
 ukraine_kuchma.15.a: "자치 운동을 지원한다"
 ukraine_kuchma.15.b: "개입하지 않는다"
 ukraine_kuchma.16.t: "남동부 정부"
 ukraine_kuchma.16.d: "푸른 마이단은 조정 정부를 구성하고 키이우가 더 이상 남동부를 대표하지 않는다고 주장합니다. 지방 관리들은 공식적인 정치적 합의를 요구하고 있습니다."
 ukraine_kuchma.16.a: "대응을 준비한다"
 ukraine_kuchma.17.t: "푸른 혁명"
 ukraine_kuchma.17.d: "푸른 마이단 대표단이 우크라이나 남동부 자치 구상을 선포했습니다. 이 운동은 즉각적인 독립 선언이 아닌 대회 개최를 추구하고 있습니다."
 ukraine_kuchma.17.a: "대회가 결정해야 한다"
 ukraine_kuchma.18.t: "갈리치아의 시위"
 ukraine_kuchma.18.d: "논란이 된 선거로 서부 활동가들이 거리로 나섰습니다. 경찰과의 충돌은 대통령 위기를 더 광범위한 헌법적 대립으로 바꿔 놓을 위험이 있습니다."
 ukraine_kuchma.18.a: "상황이 악화되고 있다"
 ukraine_kuchma.19.t: "우크라이나의 붉은 마이단"
 ukraine_kuchma.19.d: "갈리치아 활동가들은 공정한 선거를 요구하며 폴란드에 자신들의 정치 운동을 지지할 것인지 묻고 있습니다. 외국의 지지는 위기를 심화시킬 수 있습니다."
 ukraine_kuchma.19.a: "민주 세력을 지원한다"
 ukraine_kuchma.19.b: "개입하지 않는다"
 ukraine_kuchma.20.t: "서우크라이나 정부"
 ukraine_kuchma.20.d: "서부 활동가들은 정치 조정 위원회를 구성하고 키이우의 선거 합의를 받아들이기를 거부하고 있습니다. 대립은 여전히 정치적 수준에 머물러 있으나, 나라를 통치하기가 점점 어려워지고 있습니다."
 ukraine_kuchma.20.a: "경찰을 보낸다"
 ukraine_kuchma.21.t: "붉은 혁명"
 ukraine_kuchma.21.d: "붉은 마이단은 키이우의 친러시아 정부에 맞선 저항 운동을 발표했습니다. 위기는 새로운 나라가 아닌 정치적 투쟁에 머물러 있습니다."
 ukraine_kuchma.21.a: "위기를 억제한다"
 ukraine_revolution.1.t: "오렌지 혁명의 시작"
 ukraine_revolution.1.d: "선거 위기가 한계점에 도달했습니다. 정부가 조치를 취하지 않으면 올해가 가기 전에 시위가 확산될 것입니다."
 ukraine_revolution.1.a: "오렌지 마이단을 연다"
 ukraine_revolution.10.t: "세베로도네츠크 대회"
 ukraine_revolution.10.d: "우크라이나 남동부의 대표단이 세베로도네츠크에 모였습니다. 이들은 역사적인 대회를 여는 데 그칠 수도, 공식적인 자치 절차를 요구할 수도 있습니다."
 ukraine_revolution.10.a: "대회를 개최한다"
 ukraine_revolution.10.b: "자치를 요구한다"
 ukraine_revolution.11.t: "자치 투쟁"
 ukraine_revolution.11.d: "자치 운동과 키이우는 수개월 동안 남동부의 통제권을 두고 다투었습니다. 이제 그 균형이 운동이 진압될지, 협상으로 무마될지, 아니면 공식 공화국을 부여받을지를 결정합니다."
 ukraine_revolution.11.a: "투쟁을 매듭짓는다"
 ukraine_revolution.12.t: "자치를 선포한 SEUAR"
 ukraine_revolution.12.d: "남동부 대회는 공식적인 자치 공화국을 요구했습니다. 키이우는 새로운 우크라이나 남동부 자치 공화국을 인정할지 결정해야 합니다."
 ukraine_revolution.12.a: "공화국을 인정한다"
 ukraine_revolution.13.t: "헌법적 타협"
 ukraine_revolution.13.d: "자치 운동은 우크라이나 안에 머물러 있지만, 별도의 기구들을 유지하기가 어려워지고 있습니다. 헌법적 타협은 단일한 우크라이나 국가를 회복시킬 수 있습니다."
 ukraine_revolution.13.a: "SEUAR를 재통합한다"
 ukraine_revolution.14.t: "SEUAR 휴전"
 ukraine_revolution.14.d: "우크라이나와 SEUAR 사이의 전투로 양측 모두 지쳤습니다. 휴전을 하면 새 공화국은 독립 상태로 남겠지만, 분쟁은 계속될 수 있습니다."
 ukraine_revolution.14.a: "휴전을 수락한다"
 ukraine_revolution.14.b: "전쟁을 계속한다"
 ukraine_revolution.15.t: "개입을 고려하는 모스크바"
 ukraine_revolution.15.d: "우크라이나의 무력 사용으로 SEUAR 분쟁이 모스크바의 주목을 받게 되었습니다. 크렘린은 전쟁에 참전할지 결정해야 합니다."
 ukraine_revolution.15.a: "SEUAR에 가담한다"
 ukraine_revolution.15.b: "전쟁에서 빠진다"
 ukraine_revolution.16.t: "SEUAR 국경 전쟁"
 ukraine_revolution.16.d: "키이우는 자치 체제를 거부하고 SEUAR의 별도 지위를 끝내라고 병력에 명령했습니다. 이 결정은 헌법 위기를 전쟁으로 바꿔 놓을 위험이 있습니다."
 ukraine_revolution.16.a: "자치를 끝낸다"
 ukraine_revolution.17.t: "서부 문제"
 ukraine_revolution.17.d: "스스로 선포한 서우크라이나 정부는 여전히 부정 선거를 인정하기를 거부하고 있습니다. 수개월간의 대치로 키이우는 양보와 무력 사이에서 선택해야 하는 처지가 되었습니다."
 ukraine_revolution.17.a: "서부와 협상한다"
 ukraine_revolution.17.b: "강경 진압한다"
 ukraine_revolution.20.t: "연합 협정 결정"
 ukraine_revolution.20.d: "유럽 연합 연합 협정이 정치적 결정을 앞두고 있습니다. 협정을 유예하면 거리가 들끓을 수 있으며, 서명하면 위기를 미룰 수 있습니다."
 ukraine_revolution.20.a: "협정을 유예한다"
 ukraine_revolution.20.b: "협정에 서명한다"
 ukraine_revolution.21.t: "재검토되는 협정"
 ukraine_revolution.21.d: "연합 협정이 서명된 지 수개월이 지났지만 정치적 긴장은 계속 쌓여 왔습니다. 정부는 이제 자신의 선택이 가져온 결과를 마주해야 합니다."
 ukraine_revolution.21.a: "결과를 마주한다"
 UKR_seuar_sov_support_tt: "우크라이나에 대한 러시아의 영향력이 증가하며, 자치 운동은 계속됩니다."
 UKR_seuar_sov_decline_tt: "모스크바는 자치 운동에 관여하지 않을 것입니다."
 UKR_western_poland_support_tt: "우크라이나에 대한 폴란드의 영향력이 증가하며, 서부 정치 운동은 계속됩니다."
 UKR_western_poland_decline_tt: "폴란드는 서부 정치 운동에 관여하지 않을 것입니다."
 UKR_crimea_2004_permit_tt: "크림 최고회의가 지위 국민투표를 조직합니다. 모스크바가 대응을 결정합니다."
 UKR_crimea_2004_restrain_tt: "크림반도는 자치 공화국으로서 우크라이나에 남습니다."
 UKR_crimea_2004_underwrite_tt: "모스크바가 크림반도의 우크라이나 분리를 뒷받침합니다."
 UKR_amber_wars_category: "호박 전쟁"
 UKR_amber_wars_category_desc: "[UKR.GetFlag]§Y우크라이나§!는 채굴꾼들이 호박을 찾아 볼히니아의 소나무 숲을 파헤치는 것을 외면하고 있으며, 지방 관리들은 수익의 일부를 챙길지 단속에 드는 비용을 감수할지 저울질하고 있습니다."
 UKR_amber_crackdown: "채굴꾼 단속"
 UKR_amber_crackdown_desc: "경찰과 국가방위대 병력을 호박 채굴장에 투입하여 불법 갱도를 정리하고, 장비를 압수하며, 채굴꾼을 체포합니다. 이것이 거래를 완전히 끝내지는 못하겠지만, 국가에 얼마간의 평온과 세수를 가져다줄 것입니다."
 UKR_amber_tolerate: "채굴 묵인"
 UKR_amber_tolerate_desc: "지방 관리들이 비공식적인 몫을 계속 챙기도록 두고 채굴꾼을 내버려 둡니다. 돈은 돌지만, 자기 몫을 챙기러 나타날 때만 모습을 보이는 국가에 대한 원성 또한 쌓여 갑니다."
 ukraine_amber.1.t: "스스로를 선포한 코파치 공화국"
 ukraine_amber.1.d: "볼히니아에서 국가의 권위가 이미 전쟁으로 공동화된 가운데, 호박 채굴꾼 무리와 지방 실력자들이 클레시우 일대의 갱도를 자신들의 일이라고 선언했다. 그들은 우크라이나어로 채굴꾼을 뜻하는 말을 따 이를 코파치 공화국이라 부르며, 사르니로 가는 길목에 검문소를 세웠다."
 ukraine_amber.1.a: "기록해 두고 넘어간다"
 UKR_amber_resentment: "호박 열풍의 무법 상태"
 UKR_amber_kopach_truce: "채굴꾼들의 휴전"
 ukraine_amber.2.t: "해체된 코파치 공화국"
 ukraine_amber.2.d: "스스로 선포한 채굴꾼 공화국에는 정부라 할 만한 것이 없었고, 검문소와 가격표만 있었다. 쉽게 캘 수 있는 호박이 바닥나고 신선함이 사라지자, 실력자들은 조용히 깃발 없이 다시 채굴하러 돌아간다."
 ukraine_amber.2.a: "알겠다"
 UKR_strategic_industry_chinese_capital_corridor: "중국 자본 회랑"
 UKR_strategic_industry_chinese_capital_corridor_desc: "중국 자본과 시장 접근권이 엔진 및 첨단 제조업에 대한 투자의 닻이 됩니다. 이 회랑은 규모를 제공하지만, 기술 이전과 통제에 대한 우려가 더욱 커지는 대가를 치릅니다."
 UKR_strategic_industry_independent_distributed_industry: "독립 분산 산업"
 UKR_strategic_industry_independent_distributed_industry_desc: "국내 기업, 정비 센터, 분산된 작업장으로 이루어진 네트워크는 우크라이나에 탄력적인 생산과 신속한 적응력을 제공합니다. 모든 중공업 기능을 재현할 수는 없지만, 전시 연속성에서는 뛰어납니다."
 UKR_strategic_industry_renewed_post_soviet_integration: "재개된 구소련권 통합"
 UKR_strategic_industry_renewed_post_soviet_integration_desc: "다시 열린 동방 공급망이 우크라이나 공장을 익숙한 시장, 부품, 규격과 재연결합니다. 효율은 돌아오지만 전략적 취약성도 다시 커집니다."
 UKR_strategic_industry_western_integrated_defense_industry: "서방 통합 방위 산업"
 UKR_strategic_industry_western_integrated_defense_industry_desc: "국내 기업과 전략 국영 기업이 서방의 규격, 투자, 정비 네트워크, 생산 제휴와 연결됩니다. 통합은 시장과 공급 접근성을 넓히는 한편, 현대화를 동맹과의 협력에 묶어 둡니다."
 ukraine_tech.300.a: "전략 복합 기업을 유지한다"
 ukraine_tech.300.b: "복합 기업을 민영화하고 시장에 맡긴다"
 ukraine_tech.300.d: "독립은 우크라이나에 안토노프, 모터 시치, 유즈마시와 그 주변의 설계국을 남겼으나, 이들을 지탱하던 완전한 시장과 공급망은 남기지 않았다. 전문가와 시설을 함께 유지하려면 국가가 감당하기 어려운 선택이 필요할 것이다."
 ukraine_tech.300.t: "시장 없는 유산"
 ukraine_tech.301.a: "구소련권 엔진 네트워크를 유지한다"
 ukraine_tech.301.b: "독립적인 엔진 생태계에 자금을 댄다"
 ukraine_tech.301.d: "이브첸코-프로그레스가 엔진을 설계하고, 모터 시치가 이를 제조한다. 이 연계된 자포리자 복합 단지는 여전히 물려받은 시장과 공급처에 의존하고 있어, 그 네트워크를 유지할 것인가 독립적인 네트워크를 구축하는 데 비용을 들일 것인가의 선택을 강요한다."
 ukraine_tech.301.t: "사라진 제국을 위한 엔진"
 ukraine_tech.302.a: "물려받은 네트워크에 더욱 집중한다"
 ukraine_tech.302.b: "신중하게 계약을 다변화한다"
 ukraine_tech.302.d: "모터 시치 엔진과 안토노프 기체에 대한 러시아의 주문이 공장을 계속 돌리고 있으나, 같은 네트워크가 부품, 인증, 고객을 쥐고 있다. 지금 다변화하는 데는 비용이 들지만, 의존은 훗날의 어떤 단절도 증폭시킬 것이다."
 ukraine_tech.302.t: "우리를 묶는 끈"
 ukraine_tech.303.a: "러시아 공급망을 즉시 끊는다"
 ukraine_tech.303.b: "중개자를 통해 여전히 작동하는 것을 유지한다"
 ukraine_tech.303.d: "정치적 단절로 안토노프, 모터 시치, 유즈마시가 토대로 삼았던 러시아와의 산업 관계가 끊어졌다. 당장의 충격은 앞서 감수한 취약성을 반영하며, 살아남은 기업들은 압박 속에서 공급처, 규격, 시장을 재건해야 한다."
 ukraine_tech.303.t: "단절"
 ukraine_tech.304.a: "매각을 막고 모터 시치를 우크라이나 기업으로 유지한다"
 ukraine_tech.304.b: "중국의 지배를 허용한다"
 ukraine_tech.304.d: "중국과 연계된 투자자들이 모터 시치의 경영권을 노리면서, 민간 소유권, 외국 자본, 항공 기술, 국가 안보가 하나의 분쟁으로 얽혔다. 모터 시치의 공장은 전략적이지만, 이브첸코-프로그레스 설계국과 같은 기관은 아니다."
 ukraine_tech.304.t: "모터 시치의 주인은 누구인가?"
 ukraine_tech.305.a: "포화 속에서 만들어 낸 우리만의 무기고"
 ukraine_tech.305.b: "중국 자본을 위한 회랑"
 ukraine_tech.305.c: "서방과 통합된 방위 산업"
 ukraine_tech.305.e: "재개된 구소련권 통합"
 ukraine_tech.305.d: "사반세기에 걸친 민영화, 단절, 외국 자본, 그리고 전면전은 안토노프, 모터 시치, 유즈마시가 어떻게 되었으며 무엇이 그것을 대체했는지를 정리했다. 무엇이 살아남았고, 무엇이 포화 속에서 만들어졌으며, 이제 누구에게 책임을 지는지가 우크라이나가 스스로 무엇을 만들 수 있는지를 결정한다."
 ukraine_tech.305.t: "우크라이나 산업의 변모"
 UKR_party_regions_inauguration: "야누코비치 취임식"
 UKR_party_regions_inauguration_desc: "우리의 새 대통령의 취임식을 거행할 때입니다."
 ukraine_tech.305.f: "독립적이고 분산된 산업"
 ukraine_tech.306.t: "불타는 므리야"
 ukraine_tech.306.d: "막대한 손실에도 불구하고 러시아군은 첫 몇 시간 만에 호스토멜의 안토노프 공항을 점령했다. 그들의 목표는 이곳을 추가 침공을 위한 전진 기지이자 보급 거점으로 삼는 것이었으나, 우크라이나군의 맹렬한 폭격으로 이 목표를 달성하지 못했다.\n호스토멜 일대의 치열한 전투 끝에 사상 최대의 항공기이자 우크라이나 항공 산업의 자랑이었던 An-225 므리야가 격납고 안에서 불타 버렸다.\n이는 우크라이나에 참으로 불행한 사태이다. 앞으로 이러한 실패를 막으려면 산업 이전을 생각하기 시작해야 한다. 생산을 쪼개어 서쪽의 더 작은 작업장과 지하로 옮길 수 있지만, 이는 복합 기업이 기반으로 삼았던 모든 규모의 경제를 포기하는 대가를 치러야 한다. 아니면 공장들이 현재 위치에서 계속 가동되게 할 수도 있다."
 ukraine_tech.306.a: "생산을 서쪽과 지하로 분산한다"
 ukraine_tech.306.b: "공장들을 현재 위치에서 계속 가동한다"
 ukraine_tech.307.t: "400만 대의 드론"
 ukraine_tech.307.d: "Brave1 클러스터는 차고 작업장을 조달 파이프라인으로 바꾸어 놓았으며, 우크라이나는 이제 대부분의 군대가 보유한 것보다 많은 공격 드론을 한 달에 생산한다. 라인메탈과 바이락타르 모두 우크라이나 땅에 합작 투자를 원하는데, 이는 자본, 규격, 그리고 나토의 주문 물량을 가져올 것이다. 국가는 이미 보유한 자국 드론 및 미사일 기반에 모든 것을 쏟아붓거나, 그 지분 일부를 내주고 동맹국의 생산 체계에 통합될 수 있다."
 ukraine_tech.307.a: "자주적 드론 및 미사일 기반에 자금을 댄다"
 ukraine_tech.307.b: "합작 투자와 동맹국의 주문 물량을 받아들인다"
 UKR_strategic_industry_wartime_drone_arsenal: "전시 드론 무기고"
 UKR_strategic_industry_wartime_drone_arsenal_desc: "우크라이나는 단 한 번의 공격으로는 폐쇄할 수 없는 수백 개의 분산된 작업장에서 자체 드론과 미사일을 만듭니다. 생산 능력은 국내에 있고, 개량 주기는 주 단위로 측정되며, 무엇을 만들지에 대해 거부권을 가진 자는 아무도 없습니다."
 UKR_lahuna_recon_ship_idea_1: "심페로폴 정찰함"
 UKR_lahuna_recon_ship_idea_1_desc: "어선처럼 보이는 선체로, 수평선 안의 모든 것을 청취합니다."
 UKR_lahuna_recon_ship_idea_2: "심페로폴 정찰함"
 UKR_lahuna_recon_ship_idea_2_desc: "어선처럼 보이는 선체로, 수평선 너머의 모든 것까지 청취합니다."
 UKR_lahuna_recon_ship_idea_3: "심페로폴 정찰함"
 UKR_lahuna_recon_ship_idea_3_desc: "민간 선박처럼 보이도록 특별 제작된 선체로, 수평선 안의 모든 것을 청취합니다."
 UKR_lahuna_recon_ship_idea_4: "심페로폴 정찰함"
 UKR_lahuna_recon_ship_idea_4_desc: "민간 선박처럼 보이도록 특별 제작된 선체로, 수평선 너머의 모든 것까지 청취합니다."
 UKR_lahuna_recon_ship: "라후나급 센서 체계"
 UKR_reorganize_navy_category: "우크라이나 해군 재편"
 UKR_reorganize_navy_category_desc: "\n\n\n\n\n\n£UKR_desctext_reorganize_navy\n\n\n\n\n\n\n\n\n이 범주의 결정은 우리 해군을 재편하고 개선하는 데 도움이 될 것입니다.\n이곳에서는 두 종류의 선택지가 모두 주어집니다. 소련이 설계한 구형 함정을 개수하거나 건조를 완료하는 것, 그리고 새로운 자국 설계안을 확정하는 것입니다.\n다만 우리가 선택하는 일부 결정에는 원치 않는 부정적 효과가 따를 수 있습니다."
 UKR_reorganize_navy_finish_ternopil_construction: "§GTernopil §YProject 1124MU§! 초계함§! 건조 완료"
 UKR_reorganize_navy_finish_ternopil_construction_desc: "\n\n\n\n\n\n£UKR_desctext_ternopil_corvette_for_tooltip\n\n\n\n\n\n\n\n\n§W일부 예산을 배정하여 §YU209 '테르노필'§! 'Project 1124MU' 초계함의 장기화된 건조를 마침내 끝낼 수 있습니다.§!"
 UKR_reorganize_navy_choose_future_corvette: "미래의 주력 초계함 유형 선택"
 UKR_reorganize_navy_choose_future_corvette_desc: "\n\n\n\n\n\n£UKR_desctext_future_corvette_for_tooltip\n\n\n\n\n\n\n\n\n§W우리 해군의 일꾼이 될 미래 초계함의 바람직한 크기와 유형을 선택할 수 있습니다.§!"
 UKR_reorganize_navy_build_project_58250_corvette: "§YProject 58250§! §G'볼로디미르 벨리키' 급§! 초계함 생산 개시"
 UKR_reorganize_navy_build_project_58250_corvette_desc: "\n\n\n\n\n\n£UKR_desctext_project_58250_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y'볼로디미르 벨리키'§! 급(또는 §YProject 58250§! 급)은 우크라이나 해군이 발주한 다목적 초계함 계열입니다.\n이 신형 함정은 초계함보다는 약간 크고 호위함보다는 작게 계획되었습니다.\n이 신규 사업은 2008년 국립 조선 연구설계센터가 개발하였습니다.\n사업 초기부터 이러한 함정 약 10척이 논의되었습니다.\n\n이 결정으로 건조할 초계함의 정확한 수를 선택할 수 있습니다.§!"
 UKR_reorganize_navy_restore_1124: "재가동 가능성을 위해 §G2척의 §YProject 1124§! 초계함§! 점검"
 UKR_reorganize_navy_restore_1124_desc: "\n\n\n\n\n\n£UKR_desctext_project_1124_for_tooltip\n\n\n\n\n\n\n\n\n§W퇴역한 'Project 1124' 초계함 2척을 복귀시킬 수 있는지 점검할 수 있습니다.\n1997년 소련 흑해 함대 분할 당시 §R'MPK-43'§!(§YU209 '수미'§!로 개명)과 §R'MPK-52'§!(§YU210 '헤르손'§!으로 개명)이 우크라이나로 이관되었으나, 러시아 측의 방해 공작으로 두 함정 모두 전투 불능 상태였습니다.\n필요한 대규모 정비와 수리에 쓸 자금이 부족하여, 두 함정은 우크라이나 해군에 편입된 직후 곧 제적되어 처분되었습니다.\n이 함정들이 아직 해체되지 않았으므로, 우리는 원래의 결정을 되돌려 자금을 마련하고 이들을 개수할 수 있습니다.\n다만 이 결정에는 막대한 비용이 들며, 현대식 함정 조달에 투자할 가능성 대신 보통 수준의 초계함 2척을 얻게 된다는 점에 유의하십시오.§!"
 UKR_reorganize_navy_buy_lithuanian_1124: "§G2척의 §YProject 1124§! 초계함§!\n리투아니아로부터 구매 의사 표명"
 UKR_reorganize_navy_buy_lithuanian_1124_desc: "\n\n\n\n\n\n£UKR_desctext_lithuanian_corvettes_for_tooltip\n\n\n\n\n\n\n\n\n§W리투아니아에 외교 요청을 보내 'Project 1124' 초계함 2척, §YF11 '제마이티스'§!와 §YF12 '아욱슈타이티스'§!를 우리에게 매각하는 방안을 검토해 달라고 요청할 수 있습니다.\n이 2척은 소련 붕괴 이후 리투아니아군에 이관된 비교적 오래된 전투 함정입니다.\n그럼에도 이들은 우리 해군이 이미 보유한 것과 같은 유형의 함정이므로, 훈련, 정비, 전투 운용에 문제가 없을 것입니다.\n그러나 이 함정들을 구매하면 더 신형 함정을 조달할 수 있는 가용 자금이 줄어듭니다.§!"
 UKR_reorganize_navy_maintain_1135: "§G3척의 §YProject 1135§! 호위함§! 유지"
 UKR_reorganize_navy_maintain_1135_desc: "\n\n\n\n\n\n£UKR_desctext_project_1135_for_tooltip\n\n\n\n\n\n\n\n\n§W해군에 자금을 지원하여 'Project 1135' 호위함 3척을 제대로 정비하고 현역으로 복귀시킬 수 있습니다.\n1997년 7월, 흑해 함대 분할에 관한 우크라이나-러시아 협정의 기준에 따라 소련 흑해 함대의 초계함 3척이 우크라이나로 이관되었습니다. §R'라지텔니'§!(§YU132 '세바스토폴'§!로 개명), §R'베주코리즈넨니'§!(§YU133 '미콜라이우'§!로 개명), §R'베자베트니'§!(§YU134 '드니프로페트롭스크'§!로 개명)입니다.\n그러나 세 척 모두 수리와 기술적 전투 준비태세 복구에 쓸 자금이 부족하여 전투 부대로 운용되지 못하였고, 곧 퇴역하였습니다.§!"
 UKR_reorganize_navy_maintain_1241: "§G3척의 §YProject 1241§! 소형 초계함§! 유지"
 UKR_reorganize_navy_maintain_1241_desc: "\n\n\n\n\n\n£UKR_desctext_project_1241_for_tooltip\n\n\n\n\n\n\n\n\n§W해군에 자금을 지원하여 'Project 1241' 소형 초계함 3척을 제대로 정비하고 현역으로 복귀시킬 수 있습니다.\n1997년 흑해 함대 분할 당시 우크라이나는 'Project 1241' 유형 초계함 4척을 두 가지 임무로 인수하였습니다. 미사일정 2척인 §YU155 '니코폴'§!과 §YU156 '크레멘추크'§!, 그리고 소형 대잠 초계함 2척인 §YU207 '우주호로드'§!와 §YU208 '흐멜니츠키'§!입니다. 오직 미사일정 §YU155 '니코폴'§!만 양호한 상태로 이관되었고, 나머지 3척은 전투 불능 상태로 인도되었으며 수리와 기술적 전투 준비태세 복구에 쓸 자금이 부족하여 지금도 현역 복귀를 하지 못하고 있습니다.§!"
 UKR_reorganize_navy_maintain_641_submarine: "§G자포리자 §YProject 641§! 잠수함§! 유지"
 UKR_reorganize_navy_maintain_641_submarine_desc: "\n\n\n\n\n\n£UKR_desctext_zaporizhzhia_submarine_for_tooltip\n\n\n\n\n\n\n\n\n§W해군에 자금을 지원하여 유일한 잠수함인 'Project 641'의 §YU01 '자포리자'§!를 제대로 정비하고 현역으로 복귀시킬 수 있습니다.\n1997년 러시아 해군 당국은 쓰이지 않던 이 잠수함을 고칠 수 없자 흑해 함대 분할 과정에서 우크라이나 해군에 넘겼습니다.\n불행히도 이 잠수함의 배터리는 영구적으로 고장 났으며, 가동하려면 완전한 정비와 배터리 교체가 필요했습니다.\n잠수함 수리를 진행하기 위해 일부 자금을 배정할 수 있습니다.§!"
 UKR_reorganize_navy_finish_11451: "§G2척의 §YProject 11451§! 초계함§! 건조 완료"
 UKR_reorganize_navy_finish_11451_desc: "\n\n\n\n\n\n£UKR_desctext_project_11451_for_tooltip\n\n\n\n\n\n\n\n\n§W'Project 11451'은 1987년부터 페오도시야 조선소 '모레'에서 건조된 소형 대잠함(초계함) 계열이며, 소련 해체 이전에 단 2척만 건조되었습니다.\n초계함 §YU201 '리비우'§!(건조 진척도 약 95%)와 §YU203 '루한스크'§!(건조 진척도 약 60%)는 페오도시야의 해군 조선소 '모레'의 선대에 계속 놓여 있습니다.\n국가 재정 지원이 중단되어 함정의 완성이 보류되었으나, 이제 마침내 이들의 앞날을 선택할 수 있습니다.§!"
 UKR_reorganize_navy_finish_ukrayina: "§GUkrayina§!\n§YProject 1164§! 순양함 건조 완료"
 UKR_reorganize_navy_finish_ukrayina_desc: "\n\n\n\n\n\n£UKR_desctext_ukrayina_cruiser_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y'우크라이나'§!는 소련이 설계한 'Project 1164 급' 순양함의 미완성함입니다.\n예산 제약으로 1990년대 초 이 순양함의 작업이 중단되었고 함정은 미완성인 채로 남았습니다. 1993년 이 순양함은 러시아 해군에서 제적되어 우크라이나로 넘어왔습니다.\n건조를 끝내는 데 약간의 자금을 투자할 수 있으며, 그러면 우리는 흑해에서 우크라이나의 진정한 해군력을 보여 줄 것입니다!\n\n§G특히 중요한 군사 사업:§! 완료되면 §Y최고라다§!가 더 높은 군사 예산을 승인할 의향이 커질 것입니다.§!"
 UKR_reorganize_navy_finish_ternopil_construction_flag: " 완료된 결정: §GTernopil§! §YProject 1124MU§! §G초계함§! 건조 완료"
 UKR_reorganize_navy_funded_project_58250_corvette_development_flag: " 완료된 사건: §Y다목적 초계함 중점§!, 선택한 선택지 §G예산을 배정하자§!"
 UKR_reorganize_navy_not_funded_project_58250_corvette_development_flag: " 완료된 사건: §Y다목적 초계함 중점§!, 선택한 선택지 §R지출을 줄이자§!"
 UKR_reorganize_navy_developed_project_58250_corvette_development_flag: " 완료된 사건: §YProject 58200 '하이두크-21' 급 초계함 건조§!"
 UKR_reorganize_navy_repair_rivne: "§GRivne§! §YProject 1171§! 대형 상륙함 수리"
 UKR_reorganize_navy_repair_rivne_desc: "\n\n\n\n\n\n£UKR_desctext_rivne_lst_for_tooltip\n\n\n\n\n\n\n\n\n§W해군에 자금을 지원하여 'Project 1171'의 대형 상륙함 §YU762 '리우네'§!를 제대로 정비하고 현역으로 복귀시킬 수 있습니다.\n1994년 4월 10일, 오데사 항 실습 부두에 있던 군 주둔지가 볼흐라드 출신 우크라이나 공수 돌격 중대에 의해 강제로 장악되었으며, 이곳에는 'Project 1171'의 '일리야 아자로프'와 'Project 773'의 SDK-137 전차양륙함이 있었고, 1994년 4월 18일 일방적 조치로 이 함정은 우크라이나군 해군에 편입되었습니다.\n불행히도 수리와 기술적 전투 준비태세 복구에 쓸 자금이 부족하여, 이 대형 함정은 전차양륙함 플랫폼으로서 운용이 불가능해졌고 군용 건화물 수송선으로 재분류되었으며 현재 전투 불능 상태입니다.\n수리를 진행하여 이 함정을 전차양륙함으로, 최소한 지원함으로라도 현역에 복귀시키기 위해 일부 자금을 배정할 수 있습니다.§!"
 UKR_reorganize_navy_repair_support_ships: "현재 전투 불능 상태인 §G3§!척의 §Y지원함§! 및 §Y수리함§! 수리"
 UKR_reorganize_navy_repair_support_ships_desc: "\n\n\n\n\n\n£UKR_desctext_support_ships_for_tooltip\n\n\n\n\n\n\n\n\n§W해군에 자금을 지원하여 대형 해상 유조선 §YU757 '마키이우카'§!, 중형 유조선 §YU758 '케르치'§!, 부유식 공작함 §Y'올비야'§! 등 지원함 몇 척을 제대로 정비하고 현역으로 복귀시킬 수 있습니다.\n2000년 언급된 세 척 모두 수리와 기술적 전투 준비태세 복구에 쓸 자금이 부족하여 현역 함정으로 운용되지 못했고 곧 퇴역하였습니다.\n전용 자원을 조금 더 투입하여 이들을 현역 함대로 복귀시킬 수 있습니다.§!"
 UKR_reorganize_navy_build_lahuna_recon_ship: "프로젝트 §YLahuna§!: §Y정찰§!함"
 UKR_reorganize_navy_build_lahuna_recon_ship_desc: "\n\n\n\n\n\n£UKR_desctext_simferopol_recon_for_tooltip\n\n\n\n\n\n\n\n\n§W해군은 신호정보함을 원하지만 전용으로 설계된 함정을 만들 자금이 없습니다. 쿠즈냐 나 리발스코무는 트롤어선 선체와 선대, 그리고 동일한 1,220톤급 선박을 거듭 건조해 온 40년의 경험을 갖추고 있습니다.\n\n길이 55미터, 승조원 29명, 항속거리 7,200마일, 해상 체류 28일. 이 함정의 무기는 안테나 배열입니다.§!"
 UKR_lahuna_needs_kuznya_tt: "키이우 조선소를 장악해야 합니다"
 UKR_lahuna_needs_black_sea_port_tt: "이 함정을 인수하려면 흑해 항구를 보유해야 합니다"
 ukraine_reorganize_navy_restore_1124.1.name: "'Project 1124' 초계함 2척 재가동"
 ukraine_reorganize_navy_restore_1124.1.desc: "우리는 'Project 1124' 초계함 선체 2척, 'U204 수미'(신형 초계함 '테르노필'이 U209 함번호를 가져가 번호가 변경됨)와 'U210 헤르손'을 점검하였으며, 이제 이들의 운명에 관한 결정을 어느 방향으로 진행할지 가장 적절한 쪽을 선택할 수 있습니다.\n자금을 더 투입하여 두 함정을 모두 재가동하거나, 상태가 더 나쁜 'U210 헤르손'을 해체하고 그 부품으로 'U204 수미'를 더 빨리 재가동할 수 있습니다."
 ukraine_reorganize_navy_restore_1124.1.a: "두 함정을 모두 재가동한다"
 ukraine_reorganize_navy_restore_1124.1.b: "'헤르손'의 부품을 떼어 '수미'를 재가동한다"
 ukraine_reorganize_navy_choose_future_corvette.1.name: "우크라이나 미래 초계함 사업"
 ukraine_reorganize_navy_choose_future_corvette.1.desc: "이제 우리 함대의 미래 주력을 선택하는 결정을 더는 미룰 수 없는 시점에 이르렀습니다.\n여러 자국 설계안 중에서 고를 수 있으나, 핵심 결정은 어떤 유형의 초계함에 자원을 집중할 것인가입니다. 더 저렴하고 생산이 쉬운 약 700톤급 경초계함, 1,200톤 이상의 표준 초계함, 또는 배수량 2,000톤 이상의 대형 다목적 초계함 중에서 선택해야 합니다."
 ukraine_reorganize_navy_choose_future_corvette.1.a: "경초계함"
 ukraine_reorganize_navy_choose_future_corvette.1.b: "표준 초계함"
 ukraine_reorganize_navy_choose_future_corvette.1.c: "다목적 초계함"
 ukraine_reorganize_navy_choose_future_corvette.2.name: "소형 초계함 중점"
 ukraine_reorganize_navy_choose_future_corvette.2.desc: "우리는 더 작은 함정을 계속 추진하기로 하였으며, 소형 초계함(누군가는 대형 미사일정이라 부를 수도 있겠지만, 우리는 결코 그렇게 부르지 않을 것입니다)을 우리 함대의 최신 보강 전력으로 삼을 것입니다.\n우리가 건조할 정확한 함급을 선택합시다."
 ukraine_reorganize_navy_choose_future_corvette.2.a: "'무손' 급"
 ukraine_reorganize_navy_choose_future_corvette.2.b: "'미라주' 급"
 ukraine_reorganize_navy_choose_future_corvette.3.name: "'무손' 급 초계함 건조"
 ukraine_reorganize_navy_choose_future_corvette.3.desc: "우리는 가능한 모든 선택지 중 가장 저렴한 안을 선택하였으며, '무손' 급 초계함을 우리 함대의 최신 보강 전력으로 삼을 것입니다.\n우리가 건조에 동의할 함정의 수를 선택합시다."
 ukraine_reorganize_navy_choose_future_corvette.3.a: "16척 (4x4)"
 ukraine_reorganize_navy_choose_future_corvette.3.b: "12척 (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.3.c: "8척 (2x4)"
 ukraine_reorganize_navy_choose_future_corvette.4.name: "'미라주' 급 초계함 건조"
 ukraine_reorganize_navy_choose_future_corvette.4.desc: "독자적인 입찰 절차의 결과, 우리는 '미라주' 급 초계함을 우리 함대의 최신 보강 전력으로 선정하였습니다.\n우리가 건조에 동의할 함정의 수를 선택합시다."
 ukraine_reorganize_navy_choose_future_corvette.4.a: "16척 (4x4)"
 ukraine_reorganize_navy_choose_future_corvette.4.b: "12척 (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.5.name: "표준 초계함 중점"
 ukraine_reorganize_navy_choose_future_corvette.5.desc: "우리는 가능한 모든 선택지 중 가장 명백한 안을 선택하였으며, 표준 크기의 초계함을 우리 함대의 최신 보강 전력으로 삼을 것입니다.\n우리가 건조할 정확한 함급을 선택합시다."
 ukraine_reorganize_navy_choose_future_corvette.5.a: "Project 58200 '하이두크-21' 급"
 ukraine_reorganize_navy_choose_future_corvette.5.b: "'미스트랄-1500T' 급"
 ukraine_reorganize_navy_choose_future_corvette.6.name: "Project 58200 '하이두크-21' 급 초계함 건조"
 ukraine_reorganize_navy_choose_future_corvette.6.desc: "독자적인 입찰 절차의 결과, 우리는 Project 58200 '하이두크-21' 급 초계함을 우리 함대의 최신 보강 전력으로 선정하였습니다.\n우리가 건조에 동의할 함정의 수를 선택합시다."
 ukraine_reorganize_navy_choose_future_corvette.6.a: "12척 (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.6.b: "8척 (4x2)"
 ukraine_reorganize_navy_choose_future_corvette.6.c: "6척 (2x3)"
 ukraine_reorganize_navy_choose_future_corvette.7.name: "'미스트랄-1500T' 급 초계함 건조"
 ukraine_reorganize_navy_choose_future_corvette.7.desc: "독자적인 입찰 절차의 결과, 우리는 '미스트랄-1500T' 급 초계함을 우리 함대의 최신 보강 전력으로 선정하였습니다.\n우리가 건조에 동의할 함정의 수를 선택합시다."
 ukraine_reorganize_navy_choose_future_corvette.7.a: "12척 (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.7.b: "8척 (4x2)"
 ukraine_reorganize_navy_choose_future_corvette.7.c: "6척 (2x3)"
 ukraine_reorganize_navy_choose_future_corvette.8.name: "다목적 초계함 중점"
 ukraine_reorganize_navy_choose_future_corvette.8.desc: "우리는 가능한 모든 선택지 중 가장 강력한 안을 선택하였으며, 더 큰 다목적 초계함을 우리 함대의 최신 보강 전력으로 삼을 것입니다.\n이는 Project 58250 '볼로디미르 벨리키' 급 초계함이 될 것입니다.\n안타깝게도 현재 정확히 개발이 완료된 모델이 없으므로, 이를 연구하는 데 약간의 자금과 시간을 들여야 합니다."
 ukraine_reorganize_navy_choose_future_corvette.8.a: "예산을 배정하자"
 ukraine_reorganize_navy_choose_future_corvette.8.b: "지출을 줄이자"
 ukraine_reorganize_navy_buy_lithuanian_1124.1.name: "리투아니아와의 회담 결과\n'Project 1124' 초계함 2척 구매 가능성에 관하여"
 ukraine_reorganize_navy_buy_lithuanian_1124.1.desc: "'Project 1124' 초계함 2척의 구매 가능성에 관한 리투아니아 측과의 회담 이후, 리투아니아가 이 결정에 찬성하고 있어 대체로 긍정적인 결과를 얻었습니다.\n다만 그들은 이 매각의 승인과 자국에 미칠 수 있는 결과를 협의하기 위해 러시아와 상의해야 합니다.\n이제 우리는 결정을 내려야 합니다. 모스크바의 의견을 무시하도록 설득하기 위해 더 많은 돈과 추가적인 무역 기회를 제시할 수도 있고, 그들의 협의가 자연스럽게 결론 나기를 기다릴 수도 있습니다."
 ukraine_reorganize_navy_buy_lithuanian_1124.1.a: "그들을 설득해 보겠다"
 ukraine_reorganize_navy_buy_lithuanian_1124.1.b: "기다리겠다"
 ukraine_reorganize_navy_buy_lithuanian_1124.2.name: "리투아니아와의 2차 협상\n초계함 구매에 관하여"
 ukraine_reorganize_navy_buy_lithuanian_1124.2.desc: "양국 간의 이전 협상으로는 기대한 긍정적 결과를 얻지 못하였으므로, 우리는 노력을 강화하기로 하였습니다.\n2차 협상의 결과 우리는 다음 조건으로 초계함 2척의 구매에 합의하였습니다. 양국 간 무역 확대와 일정량의 강철 및 석탄 공급 협정 체결, 리투아니아 함대의 신규 함정 구입을 위한 우리 측의 추가 보상, 그리고 그들이 이전에는 접할 수 없었던 일부 군사 기술의 이전입니다.\n이 조건을 수락하시겠습니까?"
 ukraine_reorganize_navy_buy_lithuanian_1124.2.a: "그렇다, 물론이다"
 ukraine_reorganize_navy_buy_lithuanian_1124.2.b: "아니다, 감당할 수 없다"
 ukraine_reorganize_navy_buy_lithuanian_1124.3.name: "리투아니아와 러시아의 협의 결과\n초계함 매각 가능성에 관하여"
 ukraine_reorganize_navy_buy_lithuanian_1124.3.desc: "리투아니아 측 파트너들은 소련제 초계함 2척을 우리에게 매각하는 방안에 관해 러시아 측과 원하던 협상을 진행하였습니다.\n불행히도 러시아는 우리와 리투아니아가 앞서 합의한 조건으로는 매각을 허용하지 않았으나, 우리와 추가 협의를 갖고 싶다는 뜻을 밝혔습니다.\n이제 사태의 추가 전개를 위한 선택지는 둘입니다. 처음 구상을 포기하거나, 러시아의 조건으로 러시아와의 협상을 계속하는 것입니다."
 ukraine_reorganize_navy_buy_lithuanian_1124.3.a: "초계함 구매를 포기한다"
 ukraine_reorganize_navy_buy_lithuanian_1124.3.b: "러시아와 협상을 진행한다"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.name: "우크라이나와 러시아의 협상 결과\n초계함 구매 가능성에 관하여"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.desc: "우리는 불편하지만 필요한 협상을 러시아와 진행하였습니다. 불행히도 그들은 이 협상에서 우월한 위치에서 이야기했고, 우리는 그들에게 대답할 것이 없었습니다.\n러시아는 리투아니아가 초계함 2척을 매각하도록 허가하는 대가로 다음과 같은 최후통첩을 제시하였습니다. 세바스토폴의 러시아 흑해 함대 기지 수요를 위한 추가 부지 배정, EU를 향한 우리의 움직임 둔화, 양국 간 무역 강화, 그리고 함정에 대한 러시아에의 추가 금전 보상입니다.\n이 조건을 수락하시겠습니까?"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.a: "구상을 포기한다"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.b: "러시아의 조건에 동의한다"
 ukraine_reorganize_navy_buy_lithuanian_1124.5.name: "리투아니아로부터의 초계함 구매 협정 확정"
 ukraine_reorganize_navy_buy_lithuanian_1124.5.desc: "우리는 마침내 모든 조건에 합의하였고 함정의 구매와 인도를 완료할 수 있게 되었습니다.\n이전 소유국에 대한 존중의 표시로, 한때 공동의 국가였던 리투아니아 대공국, 루테니아, 제마이티야에 속했던 현대 우크라이나 영토의 중요한 도시들을 기려 함정 이름을 '브라츨라우'와 '볼로디미르'로 짓기로 하였습니다."
 ukraine_reorganize_navy_buy_lithuanian_1124.5.a: "훌륭하다!"
 ukraine_reorganize_navy_maintain_1135.1.name: "'Project 1135' 호위함 3척 정비"
 ukraine_reorganize_navy_maintain_1135.1.desc: "우리는 'Project 1135' 호위함 선체 3척, '세바스토폴', '미콜라이우', '드니프로페트롭스크'를 점검하였으며, 이제 이들의 운명에 관한 결정을 어느 방향으로 진행할지 가장 적절한 쪽을 선택할 수 있습니다.\n자금을 더 투입하여 3척 모두를 수리하거나, 가장 현대적이고 강력한 함정들에만 집중할 수 있습니다."
 ukraine_reorganize_navy_maintain_1135.1.a: "3척 모두 정비한다"
 ukraine_reorganize_navy_maintain_1135.1.b: "'세바스토폴'과 '미콜라이우'만 정비한다"
 ukraine_reorganize_navy_maintain_1135.1.c: "가장 현대적인 '세바스토폴'만 정비한다"
 ukraine_reorganize_navy_finish_11451.1.name: "'Project 11451' 초계함 2척 건조 완료"
 ukraine_reorganize_navy_finish_11451.1.desc: "우리는 'Project 11451' 초계함 선체 2척, '리비우'와 '루한스크'를 점검하였으며, 이제 이들의 운명에 관한 결정을 어느 방향으로 진행할지 가장 적절한 쪽을 선택할 수 있습니다.\n\n자금을 더 투입하여 두 함정의 건조를 마치거나, 상태가 더 나쁜 '루한스크'를 해체하고 그 부품으로 '리비우'를 더 빨리 건조할 수 있습니다."
 ukraine_reorganize_navy_finish_11451.1.a: "두 함정을 모두 완성한다"
 ukraine_reorganize_navy_finish_11451.1.b: "'루한스크'의 부품을 떼어 '리비우'를 완성한다"
 ukraine_reorganize_navy_maintain_1241.1.name: "'Project 1241' 소형 초계함 3척 유지"
 ukraine_reorganize_navy_maintain_1241.1.desc: "우리는 'Project 1241' 소형 초계함 선체 3척, 미사일정 U156 '크레멘추크'와 소형 대잠 초계함 U207 '우주호로드', U208 '흐멜니츠키'를 점검하였습니다.\n이제 이들의 운명에 관한 결정을 어느 방향으로 진행할지 가장 적절한 쪽을 선택할 수 있습니다.\n자금을 더 투입하여 3척 모두를 수리하거나, 그중 수리 가능성이 가장 높은 한 척에만 집중할 수 있습니다."
 ukraine_reorganize_navy_maintain_1241.1.a: "3척 모두 정비한다"
 ukraine_reorganize_navy_maintain_1241.1.b: "U208 '흐멜니츠키'만 정비한다"
 ukraine_reorganize_navy_maintain_1241.2.name: "미사일정 'U156 '크레멘추크'' 수리 완료"
 ukraine_reorganize_navy_maintain_1241.2.desc: "미사일정 'U156 '크레멘추크''의 수리를 완료하였으며 이제 현역 복무가 가능합니다.\n이제 소형 대잠 초계함 U207 '우주호로드'와 U208 '흐멜니츠키'의 수리를 계속 진행할 것입니다."
 ukraine_reorganize_navy_maintain_1241.2.a: "훌륭하다, 계속하자"
 ukraine_reorganize_navy_maintain_1241.3.name: "소형 대잠 초계함 'U207 '우주호로드'' 수리 완료"
 ukraine_reorganize_navy_maintain_1241.3.desc: "소형 대잠 초계함 'U207 '우주호로드''의 수리를 완료하였으며 이제 현역 복무가 가능합니다.\n이제 소형 대잠 초계함 U208 '흐멜니츠키'의 수리 완료에 박차를 가할 것입니다."
 ukraine_reorganize_navy_maintain_1241.3.a: "훌륭하다, 계속하자"
 ukraine_reorganize_navy_maintain_1241.4.name: "소형 대잠 초계함 'U208 '흐멜니츠키'' 수리 완료"
 ukraine_reorganize_navy_maintain_1241.4.desc: "소형 대잠 초계함 'U208 '흐멜니츠키''의 수리를 완료하였으며 이제 현역 복무가 가능합니다.\n'Project 1241' 소형 초계함 4척 모두가 이제 현역으로 복무 중입니다."
 ukraine_reorganize_navy_maintain_1241.4.a: "훌륭하다, 모든 함정이 준비되었다"
 ukraine_reorganize_navy_maintain_1241.5.name: "소형 대잠 초계함 'U208 '흐멜니츠키'' 수리 완료"
 ukraine_reorganize_navy_maintain_1241.5.desc: "다른 'Project-1241' 소형 초계함 3척의 부품을 떼어 쓴 덕분에 소형 대잠 초계함 'U208 '흐멜니츠키''의 수리를 예상보다 일찍 완료하였습니다. 이제 현역 복무가 가능합니다."
 ukraine_reorganize_navy_maintain_1241.5.a: "좋다!"
 ukraine_reorganize_navy_maintain_641_submarine.1.name: "'자포리자' 잠수함 - 배터리 물색"
 ukraine_reorganize_navy_maintain_641_submarine.1.desc: "우리는 '자포리자'의 선체를 점검하였고 해야 할 작업이 많음을 확인하였습니다.\n 불행히도 현재 가장 큰 문제는 배터리의 부재입니다. 배터리가 없으면 잠수함은 움직일 수 없습니다.\n러시아에 비축된 배터리 하나를 팔아 달라고 요청하거나, 유럽(특히 그리스) 전역을 수소문하거나, 국내 산업에 이를 위한 자국산 배터리를 개발하도록 명령할 수 있습니다."
 ukraine_reorganize_navy_maintain_641_submarine.1.a: "러시아에서 구매한다"
 ukraine_reorganize_navy_maintain_641_submarine.1.b: "유럽에서 물색한다"
 ukraine_reorganize_navy_maintain_641_submarine.1.c: "자체 개발한다"
 ukraine_reorganize_navy_maintain_641_submarine_batteries_from_RUS_flag: " 완료된 사건: §Y'자포리자' 잠수함 - 배터리 물색§!, 선택한 선택지 §R러시아에서 구매한다§!"
 ukraine_reorganize_navy_maintain_641_submarine_batteries_from_GRE_flag: " 완료된 사건: §Y'자포리자' 잠수함 - 배터리 물색§!, 선택한 선택지 §B유럽에서 물색한다§!"
 ukraine_reorganize_navy_maintain_641_submarine.2.name: "'자포리자' 잠수함 - 배터리 구매"
 ukraine_reorganize_navy_maintain_641_submarine.2.desc: "마침내 우리는 파트너 국가와 구매 조건에 합의하였고, 선금 지급이 완료된 후 인도 대기가 시작되었습니다.\n믿기 어려울 수 있으나, 우리는 그토록 절실했던 장비를 사전에 합의한 기한 내에 받았습니다.\n이제 우리는 파트너에게 감사를 표하고 수리를 계속할 수 있을 뿐입니다."
 ukraine_reorganize_navy_maintain_641_submarine.2.a: "러시아에 감사한다, 수리를 계속하자"
 ukraine_reorganize_navy_maintain_641_submarine.2.b: "그리스에 감사한다, 수리를 계속하자"
 ukraine_reorganize_navy_maintain_641_submarine.3.name: "'자포리자' 잠수함 - 배터리 자체 개발"
 ukraine_reorganize_navy_maintain_641_submarine.3.desc: "'자포리자' 잠수함용 배터리를 국내에서 개발하는 일은 쉽지 않았습니다.\n마침내 우리는 원하던 것을 얻었으나, 실제 비용은 예상보다 높았습니다.\n그럼에도 우리는 잠수함 수리를 계속할 수 있습니다."
 ukraine_reorganize_navy_maintain_641_submarine.3.a: "이 이정표를 달성했다, 수리를 계속하자"
 ukraine_reorganize_navy_maintain_641_submarine.4.name: "'자포리자' 잠수함 - 수리 완료"
 ukraine_reorganize_navy_maintain_641_submarine.4.desc: "우리는 새 배터리를 설치하고 작동하지 않던 모든 장비를 수리 및 정비하는 데 성공하였으며, 마침내 실제 시운전을 시작할 수 있습니다.\n\n자금과 시간을 아끼는 기본 계획을 택할 수도 있고, 더 많은 자원이 필요하지만 추가 문제를 발견하여 신속히 해결할 수 있는 대규모 계획을 택할 수도 있습니다."
 ukraine_reorganize_navy_maintain_641_submarine.4.a: "기본 시운전을 시작한다"
 ukraine_reorganize_navy_maintain_641_submarine.4.b: "확장 시운전을 시작한다"
 ukraine_reorganize_navy_maintain_641_submarine_extended_sea_trials_bonus: "'자포리자' 잠수함의 확장 시운전으로 인한 추가 신뢰도"
 ukraine_reorganize_navy_maintain_641_submarine.5.name: "'자포리자' 잠수함 - 잠수함 취역"
 ukraine_reorganize_navy_maintain_641_submarine.5.desc: "마침내 '자포리자'가 우크라이나 해군에 정식으로 취역할 수 있도록 필요한 모든 구매, 교체, 설치, 정비, 수리 및 시운전을 마쳤습니다!"
 ukraine_reorganize_navy_maintain_641_submarine.5.a: "마침내!"
 ukraine_reorganize_navy_finish_ukrayina.1.name: "순양함 '우크라이나' 완성 - 누락 장비 문제"
 ukraine_reorganize_navy_finish_ukrayina.1.desc: "우리 대통령의 직접 통제 아래, 우리는 소련 'Project 1164 급' 순양함 '우크라이나'의 건조를 완료하기로 마침내 결정을 내렸습니다.\n우리는 선체를 점검하고 누락된 장비의 종합 목록을 작성하였습니다.\n이제 또 한 걸음을 내디뎌 어떻게 할지 결정해야 합니다. 러시아에 원래 장비(주로 대함 미사일 및 지대공 미사일 체계)의 조달 허가를 요청하거나, 서방 국가들에 연락하여 그 대체품을 구할 가능성을 모색하는 것입니다.\n서방 장비를 요청하려면 미국과의 관계가 40 이상이거나 프랑스와의 관계가 25 이상이어야 함에 유의하십시오.\n\n\n§G이는 §R3§!, §R4§! 또는 §R6§!단계 중 1단계입니다§!"
 ukraine_reorganize_navy_finish_ukrayina.1.a: "러시아 원래 장비를 고수한다"
 ukraine_reorganize_navy_finish_ukrayina.1.b: "서방 대체품을 검토한다"
 ukraine_reorganize_navy_finish_ukrayina.2.name: "순양함 '우크라이나' 완성 - 러시아 장비 구매"
 ukraine_reorganize_navy_finish_ukrayina.2.desc: "순양함 '우크라이나'의 건조를 마치면서 원래의 소련 설계를 고수하기로 하였으므로, 우리는 러시아와 누락 장비 조달 협상을 시작하였습니다.\n필요한 구성품을 받으려면 많은 자금과 시간이 들 것입니다.\n\n\n§G이는 3단계 중 2단계입니다§!"
 ukraine_reorganize_navy_finish_ukrayina.2.a: "대가를 치르고 기다리겠다"
 ukraine_reorganize_navy_finish_ukrayina.3.name: "순양함 '우크라이나' 완성 - 러시아 장비 수령"
 ukraine_reorganize_navy_finish_ukrayina.3.desc: "마침내 러시아가 필요한 구성품을 제공하였고, 우리는 설치 과정을 시작하여 건조를 마칠 수 있습니다. 오래 걸리지 않기를 바랍니다.\n\n\n§G이것이 마지막 단계입니다§!"
 ukraine_reorganize_navy_finish_ukrayina.3.a: "생산을 시작한다"
 ukraine_reorganize_navy_finish_ukrayina.4.name: "순양함 '우크라이나' 완성 - 미사일 교체"
 ukraine_reorganize_navy_finish_ukrayina.4.desc: "누락된 소련제 P-500 '그라니트' 대함 미사일과 S-300F '포트' 지대공 미사일을 대체할 수 있는 서방 장비의 모든 가능한 변형을 시장에서 찾아볼 수 있습니다.\n몇 가지 선택지 중에서 골라야 합니다.\n\n\n§G이는 §R4§! 또는 §R6§!단계 중 2단계입니다§!"
 ukraine_reorganize_navy_finish_ukrayina.4.a: "미국 미사일을 선택한다"
 ukraine_reorganize_navy_finish_ukrayina.4.b: "프랑스 미사일을 선택한다"
 ukraine_reorganize_navy_finish_ukrayina.4.c: "스웨덴 미사일을 선택한다"
 ukraine_reorganize_navy_finish_ukrayina.5.name: "순양함 '우크라이나' 완성 - 미국 미사일"
 ukraine_reorganize_navy_finish_ukrayina.5.desc: "'우크라이나' 순양함의 신형 미사일 공급국으로 미국을 선택하였으므로, 우리는 RGM-84D 하푼 Block 1C 대함 미사일과 RIM-66M-2 Block IIIA 지대공 미사일을 모두 조달하기 위해 미국과 협상을 시작하였습니다.\n필요한 구성품을 받으려면 많은 자금과 시간이 들 것입니다.\n\n\n§G이는 §R4§!단계 중 3단계입니다§!"
 ukraine_reorganize_navy_finish_ukrayina.5.a: "대가를 치르고 기다리겠다"
 ukraine_reorganize_navy_finish_ukrayina.6.name: "순양함 '우크라이나' 완성 - 프랑스 미사일"
 ukraine_reorganize_navy_finish_ukrayina.6.desc: "'우크라이나' 순양함의 신형 미사일 공급국으로 프랑스를 선택하였으므로, 우리는 엑조세 MM40 Block 2 대함 미사일과 아스테르 30 Block 2 지대공 미사일을 모두 조달하기 위해 프랑스와 협상을 시작하였습니다.\n필요한 구성품을 받으려면 많은 자금과 시간이 들 것입니다.\n\n\n§G이는 §R4§!단계 중 3단계입니다§!"
 ukraine_reorganize_navy_finish_ukrayina.6.a: "대가를 치르고 기다리겠다"
 ukraine_reorganize_navy_finish_ukrayina.7.name: "순양함 '우크라이나' 완성 - 스웨덴 대함 미사일"
 ukraine_reorganize_navy_finish_ukrayina.7.desc: "'우크라이나' 순양함의 신형 RBS 15 Mk. III 대함 미사일 공급국으로 스웨덴을 선택하였으므로, 우리는 해당 장비를 조달하기 위해 스웨덴과 협상을 시작하였습니다.\n필요한 구성품을 받으려면 많은 자금과 시간이 들 것입니다.\n\n\n§G이는 §R6§!단계 중 3단계입니다§!"
 ukraine_reorganize_navy_finish_ukrayina.7.a: "대가를 치르고 기다리겠다"
 ukraine_reorganize_navy_finish_ukrayina.8.name: "순양함 '우크라이나' 완성 - 지대공 미사일 교체"
 ukraine_reorganize_navy_finish_ukrayina.8.desc: "가장 현대적인 스웨덴 대함 미사일을 선택한 뒤에도, 소련제 S-300F '포트' 지대공 미사일을 어떤 장비로 대체할지 여전히 골라야 합니다.\n선택할 수 있는 안은 단 2가지뿐입니다.\n\n\n§G이는 §R6§!단계 중 4단계입니다§!"
 ukraine_reorganize_navy_finish_ukrayina.8.a: "미국 RIM-66M-2 Block IIIA를 선택한다"
 ukraine_reorganize_navy_finish_ukrayina.8.b: "프랑스 아스테르 30 Block 2를 선택한다"
 ukraine_reorganize_navy_finish_ukrayina.9.name: "순양함 '우크라이나' 완성 - 미국 RIM-66 지대공 미사일"
 ukraine_reorganize_navy_finish_ukrayina.9.desc: "'우크라이나' 순양함의 신형 지대공 미사일 공급국으로 미국을 선택하였으므로, 우리는 해당 장비를 조달하기 위해 미국과 협상을 시작하였습니다.\n필요한 구성품을 받으려면 많은 자금과 시간이 들 것입니다.\n\n\n§G이는 §R6§!단계 중 5단계입니다§!"
 ukraine_reorganize_navy_finish_ukrayina.9.a: "대가를 치르고 기다리겠다"
 ukraine_reorganize_navy_finish_ukrayina.10.name: "순양함 '우크라이나' 완성 - 프랑스 아스테르 30 지대공 미사일"
 ukraine_reorganize_navy_finish_ukrayina.10.desc: "'우크라이나' 순양함의 신형 지대공 미사일 공급국으로 프랑스를 선택하였으므로, 우리는 해당 장비를 조달하기 위해 프랑스와 협상을 시작하였습니다.\n필요한 구성품을 받으려면 많은 자금과 시간이 들 것입니다.\n\n\n§G이는 §R6§!단계 중 5단계입니다§!"
 ukraine_reorganize_navy_finish_ukrayina.10.a: "대가를 치르고 기다리겠다"
 ukraine_reorganize_navy_finish_ukrayina.11.name: "순양함 '우크라이나' 완성 - 모든 장비 수령"
 ukraine_reorganize_navy_finish_ukrayina.11.desc: "필요한 모든 구성품이 사전에 합의한 조건에 따라 생산자들로부터 제공되었으며, 우리는 설치 과정을 시작하여 건조를 마칠 수 있습니다. 오래 걸리지 않기를 바랍니다.\n\n\n§G이것이 마지막 단계입니다§!"
 ukraine_reorganize_navy_finish_ukrayina.11.a: "생산을 시작한다"
 ukraine_reorganize_navy_repair_rivne.1.name: "'리우네' 전차양륙함 수리 - 진행 방식 선택"
 ukraine_reorganize_navy_repair_rivne.1.desc: "'리우네' 전차양륙함의 현재 상태로 인해, 이 함정의 수리 및 정비를 어떻게 진행할지 결정해야 합니다.\n자금을 더 투입하여 원래의 전차양륙함 형태로 완전히 수리하거나, 가장 핵심적인 체계에만 집중하여 지원 수송함으로 운용 가능하게 만들 수 있습니다."
 ukraine_reorganize_navy_repair_rivne.1.a: "전차양륙함으로 수리한다"
 ukraine_reorganize_navy_repair_rivne.1.b: "지원함으로 수리한다"
 ukraine_reorganize_navy_repair_rivne.2.name: "'리우네'의 전차양륙함 수리 완료"
 ukraine_reorganize_navy_repair_rivne.2.desc: "'리우네'를 본격적인 상륙함으로 수리하기로 하였으므로, 필요한 모든 수리와 정비를 완료하였으며 이제 현역 복무가 가능합니다."
 ukraine_reorganize_navy_repair_rivne.2.a: "훌륭하다!"
 ukraine_reorganize_navy_repair_rivne.3.name: "'리우네'의 지원함 수리 완료"
 ukraine_reorganize_navy_repair_rivne.3.desc: "'리우네'를 지원함으로 수리하기로 하였으므로, 필요한 모든 수리와 정비를 완료하였으며 이제 현역 복무가 가능합니다."
 ukraine_reorganize_navy_repair_rivne.3.a: "훌륭하다!"
 ukraine_reorganize_navy_repair_support_ships.1.name: "지원함 수리 - 진행 방식 선택"
 ukraine_reorganize_navy_repair_support_ships.1.desc: "지원함들의 현재 상태로 인해, 이 함정들의 수리 및 정비를 어떻게 진행할지 결정해야 합니다.\n자금을 더 투입하여 3척 모두를 수리하거나, 중요도와 가용 자금에 따라 우선순위를 정할 수 있습니다."
 ukraine_reorganize_navy_repair_support_ships.1.a: "모두 필요하다"
 ukraine_reorganize_navy_repair_support_ships.1.b: "지원함 1척과 수리함 1척"
 ukraine_reorganize_navy_repair_support_ships.1.c: "1척만 감당할 수 있다"
 ukraine_reorganize_navy_repair_support_ships.2.name: "지원함 수리 - 3척 모두 수리 예정"
 ukraine_reorganize_navy_repair_support_ships.2.desc: "지원함 3척 모두를 수리하기로 결정하였으므로, 이제 바람직한 진행 방식을 선택할 때입니다.\n현재 정부가 이용할 수 있는 전용 조선소를 모든 함정에 배정하여 많은 자금을 들이지 않고 수리하거나, 더 많은 자금을 투입하여 추가로 민간 조선소를 이용해 더 빠르게 수리할 수 있습니다."
 ukraine_reorganize_navy_repair_support_ships.2.a: "정부 조선소만 이용한다"
 ukraine_reorganize_navy_repair_support_ships.2.b: "민간 조선소에 비용을 지불한다"
