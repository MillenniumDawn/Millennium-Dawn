 ALG_deep_state_category_desc: "Gerenciar a influência dos militares e dos serviços de inteligência (le pouvoir) na governança argelina.\n\n§YPoder Atual do Estado Profundo:§! [GetDeepStatePowerValue]/30\n§YNível de Risco:§! [GetDeepStateRiskLevel]\n\nLimiares:\n§G0-5: Baixo§! | §Y6-10: Moderado§! | §O11-15: Elevado§!\n§R16-20: Alto§! | §R21-27: Crítico§! | §R28+: Golpe Iminente!§!"
 ALG_assess_deep_state_desc: "Encomendar um relatório sigiloso sobre o nível atual de influência militar e da inteligência no governo.\n\n§YSituação Atual:§!\nPoder: [GetDeepStatePowerValue]/30\nNível: [GetDeepStatePower]\nRisco: [GetDeepStateRiskLevel]"
 deep_state_warning_low_tt: "§GInfluência do Estado Profundo: BAIXA ([GetDeepStatePowerValue]/30)\nOs militares têm influência política limitada. A situação é estável.§!"
 deep_state_warning_moderate_tt: "§YInfluência do Estado Profundo: MODERADA ([GetDeepStatePowerValue]/30)\nA influência militar está crescendo. Acompanhe a situação.§!"
 deep_state_warning_medium_tt: "§OInfluência do Estado Profundo: ELEVADA ([GetDeepStatePowerValue]/30)\nOs serviços de inteligência estão se tornando politicamente ativos. Considere agir.§!"
 deep_state_warning_high_tt: "§RInfluência do Estado Profundo: ALTA ([GetDeepStatePowerValue]/30)\nOs generais operam como um governo paralelo. Ação imediata recomendada.§!"
 deep_state_warning_critical_tt: "§R£generic_warning Influência do Estado Profundo: CRÍTICA ([GetDeepStatePowerValue]/30)\nO governo civil corre grave risco! Tome medidas drásticas imediatamente.§!"
 deep_state_warning_coup_imminent_tt: "§R£generic_warning GOLPE IMINENTE! ([GetDeepStatePowerValue]/30)\nOs militares tomarão o poder a qualquer momento! Medidas de emergência necessárias.§!"
 ALG_cabinet_category: "Gestão do Gabinete"
 ALG_cabinet_category_desc: "O gabinete é a face pública da governança argelina sob o presidente Bouteflika. Por trás de títulos e pastas, há um constante equilíbrio entre lealdade, competência e a influência de le pouvoir.\n\nLealdade do Gabinete: [GetCabinetLoyaltyLevel]\nCompetência do Gabinete: [GetCabinetCompetenceLevel]\nInfluência do Estado Profundo no Gabinete: [GetCabinetDeepStateLevel]"
 ALG_review_cabinet: "Revisar o Gabinete"
 ALG_review_cabinet_desc: "Revisar a composição atual do gabinete e seu equilíbrio político."
 ALG_replace_prime_minister: "Substituir o Primeiro-Ministro"
 ALG_replace_prime_minister_desc: "Escolher um novo Primeiro-Ministro para coordenar o governo e manter a estabilidade política.\n\nPrimeiro-Ministro Atual: [GetPMName]"
 ALG_replace_defense_minister: "Substituir o Ministro da Defesa"
 ALG_replace_defense_minister_desc: "Mudar o Ministro da Defesa. Este é um cargo altamente sensível e qualquer mudança pode alarmar o establishment militar.\n\nMinistro Atual: [GetMODName]"
 ALG_replace_interior_minister: "Substituir o Ministro do Interior"
