 AI_RACE_debug_repair: "DEBUG: Repair AI Race State"
 AI_RACE_debug_repair_desc: "Initializes missing AI Race state, rebuilds derived country and global state, and clamps bounded values. It does not advance the quarterly epoch."
 AI_RACE_category: "AI Race"
 AI_RACE_category_desc: "Develop our industrial capacity, electricity supply, and material supply to compete in the AI Race. Review each investment before committing national funds."
