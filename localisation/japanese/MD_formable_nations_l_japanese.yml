 ANTCONF_form_category: "アンティル連合"
 ANTCONF_form_category_desc: "The Antillean Confederation is a proposed state in the Caribbean with the unification of [CUB.GetNameWithFlag], [DOM.GetNameWithFlag], and [HAI.GetNameWithFlag]. It was initially formed as an idea from Ramón Emeterio Betances, a Puerto Rican independence activist, to unify all Spanish-speaking Caribbean nations into a single united entity. The original idea did not include [HAI.GetNameWithFlag]; however, it was quickly included by proponents of the idea. The idea mostly disappeared due to the American-Spanish war as the colonies of [CUB.GetNameWithFlag] and [PTR.GetNameWithFlag] were transferred to the United States. The idea would bring about a nation that would likely take the capital in Santo Domingo and its official language as Spanish."
 ANTCONF_integrate_start: "[GetANTCONFNameDef]形成の開始"
 ANTCONF_integrate_start_desc: "アンティル連合を形成する時が来た。我々はカリブ海の人々により明るい未来をもたらすために、今こそ団結しなければならない。\n\n"
 ANTCONF_integrate_cuba: "[GetANTCONFNameAdj][CUB.GetAdjective]地域の統合"
 ANTCONF_integrate_cuba_desc: "キューバは連合を構成する3つの主要国の中で最大の国だ。これを統合すれば、経済規模が拡大し、人口と国土面積はほぼ倍増するだろう。"
 ANTCONF_integrate_dominican_republic: "[GetANTCONFNameAdj][DOM.GetAdjective]地域の統合"
 ANTCONF_integrate_dominican_republic_desc: "ドミニカ共和国は、連合を構成する3大国の一つである。ハイチとイスパニョーラ島を共有し、多くの観光客と産業を有している。島の北側では軽鉱業も盛んで、共和国内で消費される鉄鋼も生産されている。ドミニカ共和国の統合は、新連合にとって非常に重要な意味を持つだろう。"
 ANTCONF_integrate_haiti: "[GetANTCONFNameAdj][HAI.GetAdjective]地域の統合"
 ANTCONF_integrate_haiti_desc: "ハイチは連合を構成する3つの主要国の中で最も小さい国である。旧フランス植民地国家であるため、キューバやドミニカ共和国とは大きく異なる。言語の違いから統合にはより長い時間がかかるだろう。しかし、ポルトープランスの産業基盤と天然の港は、カリブ海地域における経済活動と軍事活動にとって非常に貴重なものとなるだろう。"
 ANTCONF_update_flag: "[GetANTCONFNameDef]形成の完遂"
 ANTCONF_update_flag_desc: "すべての構成地域が統合されれば、我々は変革を完遂し、[GetANTCONFNameDef]を宣言するとともに、その統一された国旗と名称を採用することができる。"
 CANZUK_form_category: "CANZUK"
 CANZUK_form_category_desc: "CANZUK is a union of nations between Canada, Australia, New Zealand, and the United Kingdom. It differs from the British Empire as this union of states would be directly administered and be a properly united country. The nation would span several continents and become a major contender on the world stage. Perhaps we should entertain the idea and unify the nations?"
