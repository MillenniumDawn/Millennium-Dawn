l_spanish:
 GOH_CHOK_TONG_DESC: "Goh Chok Tong was first elected Prime Minister in 1991, winning with a comfortable majority. Goh's ascension to PM and his early years as PM are littered with abnormalities. Goh became Prime Minister after Lee Kuan Yew stepped down in late 1990. Goh proceeded to call a snap election then. It was a landslide for the PAP and allowed Goh to usher in a new mandate.\n\nAlthough he is not as notable as his predecessor Lee Kuan Yew, Goh made strides with his policies that supported 'little bohemias' within the city."
 SIN_government_of_singapore: "Alianza de Singapur"
 SIN_government_of_singapore_desc: "[SIN.GetName] se encuentra en una encrucijada. Estamos ubicados en la desembocadura de una de las rutas marítimas más rentables del mundo. Somos uno de los principales centros financieros mundiales, y la expansión masiva que hemos experimentado en las últimas décadas no tiene precedentes a nivel global. Esto también ha despertado el interés de numerosas potencias extranjeras.\n"
 SIN_replace_centralized_education_system: "Implementar el Sistema de Educación Centralizada"
 SIN_replace_centralized_education_system_desc: "The Centralized Education System was a good promise. It may be imperative to reinstate this policy to continue getting its benefits."
 SIN_repeal_centralized_education_system: "Derogar el Sistema de Educación Centralizada"
 SIN_repeal_centralized_education_system_desc: "El sistema educativo debe ser derogado. No es digno de Singapur y controlar la educación solo sirve para obstaculizar el bien común."
 SIN_singaporean_foreign_aid_target_decisions: "Paquete de Ayuda Externa en [FROM.GetNameWithFlag]"
 SIN_singaporean_foreign_aid_target_decisions_desc: "Entregar un paquete de ayuda externa a [FROM.GetNameWithFlag] mejorará las relaciones y también les ayudará económicamente mientras están pasando dificultades."
 western_alignment_title: "§HClic del Oeste§!"
 neutral_alignment_title: "§HClic Neutral§!"
 eastern_alignment_title: "§HClic del Este§!"
 western_clique_strength: "§C[?SIN.party_pop_array^1|%1]§!"
 eastern_clique_strength: "§C[?SIN.party_pop_array^7|%1]§!"
 neutral_clique_strength: "§C[?SIN.party_pop_array^13|%1]§!"
 SIN_western_pressure_tt: "Apoyar a [conservatismo_L]\n\n¡El §CClic del Oeste§! presionará para una mayor cooperación con Estados Unidos y otras potencias occidentales importantes."
 SIN_western_pressure_delayed_tt: "§YPrerrequisitos:§!\n[!western_pressure_click_enabled]\n§YEfectos:§!\n[!western_pressure_click]\n"
 SIN_eastern_pressure_tt: "Apoyar a [Autocracia_L]\n\nEl §GClic del Este§! del PAP busca mayores lazos con la RPC y Rusia, así como con otras potencias emergentes importantes.\n"
 SIN_eastern_pressure_delayed_tt: "§YPrerrequisitos:§!\n[!eastern_pressure_click_enabled]\n§YEfectos:§!\n[!eastern_pressure_click]\n"
 SIN_neutrality_pressure_tt: "Apoyar a [Neutral_Autocracia_L]\n\nEl §RClic No Alineado§! se centra principalmente en la ASEAN y Singapur manteniéndose firmes sin interferencias extranjeras. Normalmente son el grupo más numeroso de los tres cliques."
 SIN_fund_western_clique_tt: "Financiar a [conservatism_L]\n\nFinanciar [conservatism_L] es una forma segura de garantizar que sigan siendo la camarilla líder de nuestra política."
 SIN_fund_western_clique_delayed_tt: "§YPrerrequisitos:§!\n[!fund_western_clique_click_enabled]\n§YEfectos:§!\n[!fund_western_clique_click]\n"
 SIN_fund_eastern_clique_tt: "Financiar a [Autocracy_L]\n\nFinanciar a la [Autocracy_L] nos permitirá implementar políticas más agresivas. Quizás destinarles fondos sea una forma de fomentar su ascenso al poder.\n"
 SIN_fund_eastern_clique_delayed_tt: "§YPrerrequisitos:§!\n[!fund_eastern_clique_click_enabled]\n§YEfectos:§!\n[!fund_eastern_clique_click]\n"
 SIN_fund_neutral_clique_tt: "Fund [Neutral_Autocracy_L]\n\nMoving ourselves away from either clique will allow us to truly achieve self-governance.\n"
 SIN_fund_neutral_clique_delayed_tt: "§YPrerrequisitos:§!\n[!fund_neutral_clique_click_enabled]\n§YEfectos:§!\n[!fund_neutral_clique_click]\n"
 SIN_applied_support_clique: "No ha apoyado recientemente a un Clique (Días restantes: [?SIN_applied_support_clique:days_left|Y0])"
 SIN_funded_a_clique_flag: "No ha financiado recientemente a un Clique (Días restantes: [?SIN_funded_a_clique_flag:days_left|Y0])"
 singaporean_alignment_help_button_tt: "§YAyuda sobre la alineación de Singapur§!"
 SIN_government_help_tooltip_tt: "Si necesitas ayuda, haz clic aquí."
 SIN_expand_the_entreport_decision_categories: "Expand the Entrepot"
 SIN_expand_the_entreport_decision_categories_desc: "Singapore stands as one of the world's most important ports. The city has stood on the lifeblood of trade from east to west for centuries, making it the embodiment of an Entrepot. Perhaps expanding this is a way for Singapore to continue to grow as a nation.\n\n"
 SIN_facilitate_trade_expansion: "Facilitar la expansión del comercio con [FROM.GetNameWithFlag]"
 SIN_facilitate_trade_expansion_desc: "Expandir el comercio con [FROM.GetNameWithFlag] traerá beneficios adicionales y prosperidad para ambas naciones. Si continuamos ampliando nuestro comercio con otras naciones, podremos expandir aún más nuestra influencia y prosperidad y luego seguir haciendo crecer nuestra economía, lo que seguirá ayudándonos a promover nuestros intereses en Asia y el Pacífico."
 SIN_extend_finance_western_projects: "Ampliar la financiación de proyectos occidentales"
 SIN_extend_finance_western_projects_desc: "Ampliar los beneficios fiscales y financieros para los proyectos seguirá siendo una ventaja neta."
 SIN_repeal_decentralization_protocol_decision: "Revocar el Protocolo de Descentralización"
 SIN_repeal_decentralization_protocol_decision_desc: "The decentralization laws we have recently passed have become too cumbersome for our government to maintain."
 SIN_enact_decentralization_protocol_decision: "Promulgar el Protocolo de Descentralización"
 SIN_enact_decentralization_protocol_decision_desc: "El Protocolo de Descentralización, que fue derogado recientemente, sigue en trámite. ¿Deberíamos volver a implementarlo?"
 SIN_riau_islands_crisis_mission: "La Crisis de las Islas Riau"
 SIN_riau_islands_crisis_mission_desc: "El reciente debate sobre las islas Riau se está intensificando. Si no cedemos, es probable que estalle una guerra."
 SIN_repeal_the_migrant_worker_policy: "Revocar la política de los trabajadores migrantes"
 SIN_repeal_the_migrant_worker_policy_desc: "Revocar las políticas de los trabajadores migrantes ayudará a mitigar algunos problemas con la creciente división en nuestra nación."
 SIN_entrepot_trade: "El Entrepôt de Malaca"
 SIN_entrepot_trade_desc: "La posición de Singapur lo ha convertido en un centro de comercio global desde la época colonial. Se encuentra en una de las rutas de recursos más estratégicas del mundo, en el estrecho de Malaca. Cuanto más controlemos el flujo comercial de este a oeste y de oeste a este, más beneficios podremos obtener.\n"
 SIN_singaporean_bull: "El Toro Singapurense"
 SIN_singaporean_bull_desc: "Singapore's economy is booming. It is imperative we continue to maintain this expansion!\n\nThe economy can be expanded via decisions and add additional time to this modifier. However, if you do this multiple times, it can cause a market crash due to too much aggressive growth.\n"
 SIN_precious_metal_trade_boom: "Comercio de Metales Preciosos"
 SIN_precious_metal_trade_boom_desc: "El comercio de metales preciosos de Asia Oriental fluye a través de Singapur. Monopolizar este flujo de metales será lucrativo para nosotros y fortalecerá nuestra posición como centro de comercio en Asia Oriental.\n"
 SIN_support_for_the_workers: "Poder para los Trabajadores"
 SIN_support_for_the_workers_desc: "The workers are the most important cog wheel in our economy. The accusations that the people are not cared about by the government are absurd. We should push to change this mentality and empower our workers!\n"
 SIN_support_for_the_business: "Mentalidad Pro-Negocios"
 SIN_support_for_the_business_desc: "Es necesario apoyar a los empresarios y empresarias de Singapur. El fortalecimiento de las empresas impulsa el crecimiento económico de toda la nación."
 SIN_centralized_education_idea: "Sistema de Educación Centralizado"
 SIN_centralized_education_idea_desc: "El sistema educativo de Singapur está centralizado y es estrechamente monitoreado por la coalición gobernante. Esto nos brinda un método de enseñanza más efectivo, pero aumenta astronómicamente el costo de la educación."
 SIN_reeducation_idea: "Campaña de Reeducación"
 SIN_reeducation_idea_desc: "Nuestras fuerzas armadas mantienen el control, pero aún quedan algunos rezagados. Es hora de poner en marcha una campaña de reeducación."
 SIN_migrant_workers: "Trabajadores Migrantes"
 SIN_migrant_workers_desc: "Un gran número de trabajadores en Singapur son trabajadores migrantes. Trabajan por un salario más alto en Singapur y envían dinero de regreso a sus países de origen. Esto es motivo de conflicto tanto para las poblaciones malayas, chinas e indias locales como para los propietarios de negocios que prefieren esta mano de obra en lugar de los singapurenses locales."
 SIN_trade_influence_idea: "Nuestra Influencia Comercial"
 SIN_trade_influence_idea_desc: "Presionar nuestra influencia comercial lejos y ampliamente solo nos proporcionará más y más recursos aquí en casa."
 SIN_global_investment_idea: "Inversión Global"
 SIN_global_investment_idea_desc: "Invertir cada vez más en fondos y valores globales nos impulsará hacia adelante."
 SIN_defence_strategy_loc: "La Estrategia de Defensa"
 SIN_defence_strategy_loc_desc: "Nuestra estrategia de defensa está estructurada para asegurarnos de mantenernos firmes el mayor tiempo posible."
 SIN_loose_censorship_idea: "Leyes de Censura Moderada"
 SIN_medium_censorship_idea: "Leyes de Censura Moderada"
 SIN_harsh_censorship_idea: "Leyes de Censura Severa"
 SIN_extreme_censorship_idea: "Leyes de Censura Extrema"
 SIN_police_funding_expenditure: "Aumento de la financiación de la policía"
 SIN_police_funding_expenditure_desc: "Invertir más en nuestra fuerza policial puede ayudarnos a erradicar a los disidentes políticos y los espías extranjeros."
 SIN_finance_western_projects_idea: "Proyectos Financiados"
 SIN_finance_western_projects_idea_desc: "Financiar más proyectos occidentales significa una mayor inversión propia."
 SIN_singaporean_special_treatment: "Trato Especial a los Singapurenses"
 SIN_singaporean_special_treatment_desc: "El dominio político requiere un esfuerzo sostenido. Fortalecer el control del PAP sobre el poder mediante una mayor actividad política y una estrategia defensiva asegura la posición del gobierno."
 SIN_anti_opposition_laws_idea: "Leyes Contra la Oposición"
 SIN_anti_opposition_laws_idea_desc: "Reprimir a la oposición es fundamental para mantener la estabilidad en el gobierno. Reforzar el control sobre los rivales políticos consolida el poder y previene desafíos desestabilizadores al Estado."
 SIN_conservative_singapore_idea: "Singapur Conservador"
 SIN_conservative_singapore_idea_desc: "La estabilidad es la base del progreso. Un enfoque conservador de la gobernanza fortalece el orden político existente y protege el tejido social de Singapur."
 SIN_singaporean_identity_idea: "La Identidad Singapurense"
 SIN_singaporean_identity_idea_desc: "Una identidad nacional unificada es la mayor defensa de Singapur contra la influencia extranjera. Reforzar los valores y la soberanía de Singapur fortalece la cohesión social y la resiliencia."
 SIN_spy_agency_expansion_idea: "Expansión de la Agencia de Espionaje"
 SIN_spy_agency_expansion_idea_desc: "Expandir nuestra agencia de espionaje y capacidades nos permitirá proyectarnos más lejos alrededor del mundo."
 SIN_global_diplomacy_idea: "Diplomacia Global"
 SIN_global_diplomacy_idea_desc: "Aplicar presión en la política exterior es el camino a seguir para la nación."
 SIN_economic_champion_idea: "Campeón Económico"
 SIN_economic_champion_idea_desc: "No somos una nación grande en ningún sentido; sin embargo, nuestra destreza económica nos llevará hacia la dominancia en el Pacífico y el Océano Índico."
 SIN_the_invasion_of_sumatra_idea: "Invasión de Sumatra"
 SIN_the_invasion_of_sumatra_idea_desc: "Sumatra está al otro lado del estrecho de Malaca. Es hora de conquistar la isla y traer gloria a nuestra nación."
 SIN_the_invasion_of_malaysia_idea: "Invasión de Malasia"
 SIN_the_invasion_of_malaysia_idea_desc: "El gobierno de Malasia es débil y necesita ser derrotado."
 SIN_expanded_freight_transport: "Transporte de Carga Expandido"
 SIN_expanded_freight_transport_desc: "Expandir el transporte de carga debería permitirnos obtener fondos adicionales."
 SIN_decentralize_the_government_idea: "Descentralizar el Gobierno"
 SIN_decentralize_the_government_idea_desc: "La naturaleza misma de Singapur será siempre la de una nación altamente centralizada."
 SIN_administrative_reforms_idea: "Reformas Administrativas"
 SIN_administrative_reforms_idea_desc: "Una burocracia más competente es clave para una gobernanza eficaz. Las reformas administrativas aumentan la eficiencia del Estado y la capacidad del gobierno para implementar su agenda."
 SIN_economic_reform_idea: "Reformas Económicas"
 SIN_economic_reform_idea_desc: "La eficiencia económica impulsa la fortaleza nacional. Las reformas que reducen los costos y mejoran la productividad mantienen a Singapur competitivo en el mercado global."
 SIN_setting_our_sights_idea: "Fijando Nuestros Objetivos"
 SIN_setting_our_sights_idea_desc: "Singapur debe estar preparado para actuar en el escenario mundial. Preparar a las fuerzas armadas para operaciones expedicionarias y reducir las limitaciones logísticas proyecta poder más allá de nuestras fronteras."
 SIN_liberties_for_stability_idea: "Libertades para la Estabilidad"
 SIN_liberties_for_stability_idea_desc: "Es evidente que a veces es necesario cambiar algunas de nuestras libertades civiles por estabilidad en el país y en el gobierno."
 SIN_the_arms_export_idea: "Exportador de Armas"
 SIN_the_arms_export_idea_desc: "Singapur es uno de los mayores exportadores de armas y productores de bienes militares del mundo. El país es casi completamente autosuficiente en su producción militar y, como tal, exporta estos excedentes a otras naciones de todo el mundo."
 SIN_bankers_of_asia_idea_1: "Banqueros del Sudeste Asiático"
 SIN_bankers_of_asia_idea_1_desc: "Singapore is a major power in the banking sector in Southeast Asia and as such we should capitalize on this."
 SIN_singaporean_trade_strength: "Fortaleza a través del Comercio"
 SIN_singaporean_trade_strength_desc: "La posición de Singapur como centro de comercio importante solo puede fortalecerse aún más mediante la creación de extensas redes comerciales. Firmar acuerdos comerciales adicionales solo servirá para ayudar a la nación a prosperar.\n\n§CHint: Firmar acuerdos comerciales adicionales aumentará tu modificador de influencia extranjera y tu costo burocrático. También obtendrás ingresos adicionales en forma de aranceles.§!\n"
 SIN_the_republic_tt: "§Y[SIN.GetNameWithFlag]§! funciona como un eficaz estado de un solo partido. La mayoría de los partidos políticos que se oponen al partido mayoritario, el Partido de Acción Popular, están prohibidos o no se les permite participar en las elecciones. Algunos pocos tienen permitido participar en las elecciones, pero son escasos. La verdadera diversidad de ideologías políticas proviene de los grupos dentro del PAP. Hay tres grupos principales con los que lidiar:\n- [conservatism_L]\n- [Autocracy_L]\n- [Neutral_Autocracy_L]\n\nCada uno de ellos apoyará sus propias políticas individuales. [conservatism_L] es el más prominente de estos tres y será el jugador mayoritario en el sistema a menos que las cosas cambien.\n"
 SIN_centralized_education_idea_tt: "No se puede reducir el §Y$education_budget$§! por debajo de §Y$edu_03$§!\n"
 SIN_centralized_education_idea_trigger_tt: "§Y[SIN.GetNameWithFlag]§! no puede reducir el §Y$education_budget$§! por debajo de §Y$edu_03$§! mientras se encuentre en vigor §Y$SIN_centralized_education_idea$§!.\n"
 SIN_tariff_income_tt: "Acuerdos Comerciales Firmados Activamente: [?SIN.signed_trade_agreements|Y0]\nIngresos por Aranceles: $$[?SIN_tariff_income|+3]\n"
 SIN_singaporean_aid_tooltip: "Cada §YAcuerdo Comercial§! que firmemos con otro país nos permite enviar un §YPaquete de Ayuda Extranjera§! equivalente al §G5%§! de su §YProducto Interno Bruto (PIB)§!.\n\nAcuerdos Comerciales Firmados Activamente: [?SIN.signed_trade_agreements|Y0]\n"
 SIN_decentralize_the_government_idea_trigger_tt: "§Y[SIN.GetNameWithFlag]§! no puede aumentar el §Y$bureaucracy$§! por encima de §Y$bureau_03$§! mientras esté vigente §Y$SIN_decentralize_the_government_idea$§!.\n"
 SIN_decentralize_the_government_idea_tt: "No se puede aumentar el §Y$bureaucracy$§! por encima de §Y$bureau_03$§!\n"
 SIN_strength_of_trade_agreements_mechanic_tt: "§Y[SIN.GetNameWithFlag]§! obtiene el mecanismo de §Y$SIN_singaporean_trade_strength$§! al firmar el primer acuerdo comercial. Cuantos más acuerdos comerciales firmes con otras naciones, más ingresos por aranceles obtendrás a una tasa de $$§G0.075§! mil millones, y el §Yforeign_influence_modifier$§! aumentará a una tasa del §G2%§! con más acuerdos comerciales. Inversamente, el §Ybureaucracy_cost_multiplier_modifier$§! también aumentará a una tasa del §R2%§!.\n\n"
 SIN_encourage_migration_tt: "Esto empeorará los §YForeign Worker Riots§! §R§R.\n"
 SIN_encourage_migration_worse_tt: "Esto empeorará aún más los §YForeign Worker Riots§! §R§R.\n"
 SIN_tiger_of_the_peninsula: "Tigre de la Península"
 SIN_tiger_of_the_peninsula_desc: "Singapur es una de las cuatro economías tigre del este de Asia y es imperativo que mantengamos esta posición económica durante muchos años.\n"
 SIN_business_is_booming: "Los negocios están en auge"
 SIN_business_is_booming_desc: "¡Los negocios en Singapur están en auge! Es hora de mantener el flujo del mercado y mantener el gran auge de Singapur."
 SIN_expand_the_entrepot: "Expandir el Entrepot"
 SIN_expand_the_entrepot_desc: "Desde tiempos antiguos, la ubicación de Singapur en la desembocadura del estrecho de Malaca le ha permitido convertirse en un gran entrepósito y centro neurálgico del comercio desde Asia hacia otras áreas del mundo. Es de nuestro interés continuar expandiendo nuestro entrepósito para mantener nuestro interés económico central.\n"
 SIN_bankers_of_asia: "Banqueros de Asia"
 SIN_bankers_of_asia_desc: "En los últimos años, Singapur se ha convertido en un centro financiero que rivaliza con el de Hong Kong, Shanghái y Tokio. Bajas tasas impositivas e incentivos empresariales han contribuido a su crecimiento acelerado. Debemos mantener nuestra capacidad de ser los banqueros de Asia.\n"
 SIN_build_the_safety_net: "Financiar el Fondo Central de Providencia"
 SIN_build_the_safety_net_desc: "El Fondo Central de Previsión (CPF) se creó como respuesta a la necesidad de proporcionar beneficios adicionales a los habitantes de Singapur. Funciona como el sistema de bienestar social que rige la nación y ofrece beneficios a los jóvenes, los pobres y los ancianos para garantizar que su calidad de vida se mantenga constante. Tal vez valga la pena proporcionar fondos adicionales al CPF."
 SIN_the_singaporean_bull: "El Toro Singapurense"
 SIN_the_singaporean_bull_desc: "Our growth in the last few years following the great financial crisis has been impressive. We should try and maintain our bull market and keep the Singaporean Bull fed and charging.\n"
 SIN_mouth_of_malay: "La boca de Malasia"
 SIN_mouth_of_malay_desc: "The straits of Malacca are one of the world's primary shipping routes. Its location allows for quick access through the Indonesian Archipelago and allows for shipping to remain relatively unimpeded as it makes its way from the Indian Ocean to the Pacific. Singapore sits at the mouth of the straits and this position has allowed us to expand our Entrepot business and continues to help promote and foster growth. We must maintain this position and continue to be the center of trade.\n"
 SIN_extreme_financing: "Buscar fondos del partido"
 SIN_extreme_financing_desc: "The PAP has extensive connections within all walks of life in Singapore. We should call on some of those resources to gain some free spending in exchange for favors or greater rights in the country.\n"
 SIN_human_rights: "Derechos Humanosde Singapur"
 SIN_human_rights_desc: "A pesar de que Singapur es un referente de democracia y libertad en la región, nuestro sistema aún presenta algunas deficiencias, especialmente en lo que respecta a los derechos laborales. El progreso de la economía y la mejora de nuestro bienestar deberían ir acompañados de avances en los derechos y las libertades civiles de las personas."
 SIN_entice_foreign_investment: "Atraer inversión extranjera"
 SIN_entice_foreign_investment_desc: "Our economy is first built upon the trade with the rest of the world and it is still a key to keep our economy stable. However, with the rise of new economic powers during past decades, we should now decide which region of the world we should expand our partnership with."
 SIN_continue_the_rise: "Continuar el ascenso"
 SIN_continue_the_rise_desc: "With recent growth of our economy come many new benefits. We should encourage this growth to stay longer so we can benefit even more from it!"
 SIN_labour_rights: "Derechos de los Trabajadores"
 SIN_labour_rights_desc: "A pesar de nuestras reformas, los trabajadores aún se sienten oprimidos por las corporaciones. Debemos llegar a nuevos acuerdos con los empresarios para garantizar mejores condiciones laborales y mayor libertad para los sindicatos en nuestro país."
 SIN_eyeing_the_west: "Mirando hacia Occidente"
 SIN_eyeing_the_west_desc: "The US and Europe are, after all, the beacon of capitalism and freedom. Ensuring better relations with the West guarantees us access to a more stable and diverse market."
 SIN_sino_singaporean_discussion: "Discusión sino-singapurense"
 SIN_sino_singaporean_discussion_desc: "La economía china, en rápido crecimiento, se perfila como un excelente socio para nuestra economía y una oportunidad para reducir la influencia de las potencias occidentales en Singapur. Es hora de que estas dos potencias asiáticas forjen una nueva amistad para el nuevo siglo."
 SIN_the_worker: "Poder para los Trabajadores"
 SIN_the_worker_desc: "Es hora de que abracemos la cultura de la clase trabajadora y fortalezcamos y consolidemos los sindicatos. Con nuevas leyes laborales y mejores condiciones para los trabajadores, aumentará la productividad de nuestra gente."
 SIN_the_business: "Favorecer a las Empresas"
 SIN_the_business_desc: "Es necesario brindar a los trabajadores mejores condiciones laborales y mayor seguridad para su futuro, pero es peligroso otorgarles demasiado poder económico. Las corporaciones y los empresarios saben cómo funciona el mercado y cómo maximizar sus ganancias. Deben seguir siendo el pilar de nuestras políticas y nuestra dirección económica."
 SIN_expand_the_maritime_industry: "Expansión de la Industria Marítima"
 SIN_expand_the_maritime_industry_desc: "A pesar de ser un centro de comercio naval, nuestra capacidad de producción naval interna, tanto en barcos civiles como militares, es insuficiente. Deberíamos comenzar a construir nuevos astilleros para aumentar nuestra producción de barcos."
 SIN_expand_the_shipyards: "Fortalecimiento del Transporte Marítimo en el Pacífico Oriental"
 SIN_expand_the_shipyards_desc: "Impulsados ​​por la innovación y un compromiso con la excelencia, no sólo estamos fortaleciendo nuestra posición; estamos transformando el futuro del transporte marítimo. Nuestra visión estratégica nos impulsa a convertirnos en un líder mundial, rivalizando con gigantes del sector como Maersk. Estamos invirtiendo en tecnología de punta, optimizando las operaciones y ampliando nuestro alcance global para ofrecer un servicio y una eficiencia inigualables. Únase a nosotros mientras navegamos hacia un futuro donde Envíos del Pacífico Oriental establece el estándar de la industria."
 SIN_machinery_improvements: "Invertir en la Compañía de Maquinaria de Singapur"
 SIN_machinery_improvements_desc: "Expanding our industrial machinery industry helps us keep our industrial complexes running and profiting, and also gives us a chance to export this product to less industrialized nations in the region."
 SIN_precious_metal_trade: "El comercio de Degussa"
 SIN_precious_metal_trade_desc: "Degussa Goldhandel GmbH is a trading branch of Degussa bank in Germany. By inviting them to set up a new base of operation in Singapore, we could use their help to start our gold excavation projects."
 SIN_port_of_singapore: "Aumentar el convoy logístico"
 SIN_port_of_singapore_desc: "Envíos del Pacífico Oriental no es sólo una naviera, sino una fuerza que está transformando el sector. Estamos reforzando nuestra infraestructura, ampliando nuestra flota y optimizando nuestras operaciones para convertirnos en un líder mundial. Nuestra visión es clara: rivalizar con los gigantes del sector y establecer un nuevo estándar de excelencia en el transporte marítimo mundial."
 SIN_restrict_the_market: "Restricciones al Mercado"
 SIN_restrict_the_market_desc: "Aunque esto va en contra de nuestra antigua forma de mantener el libre mercado y los bajos impuestos dentro de nuestro país, necesitamos algunas limitaciones y restricciones contra las empresas extranjeras de metalurgia y construcción, para garantizar que nuestra industria local tenga la oportunidad de competir y sobrevivir en el mercado."
 SIN_energy_efforts: "Esfuerzos energéticos"
 SIN_energy_efforts_desc: "Our city's future thrives on the security of our most important infrastructure. Energy is one such issue we must solve and secure ourselves so our children's children may never have to be concerned."
 SIN_fossil_power_plants: "Ampliar las plantas de combustibles fósiles"
 SIN_fossil_power_plants_desc: "Expanding the fossil fuel power plants in the city will help offset some of the rolling issues we may potentially face."
 SIN_fossil_fuel_efficiency: "Mejorar la eficiencia de las centrales eléctricas"
 SIN_fossil_fuel_efficiency_desc: "Las mejoras en la eficiencia de nuestras centrales eléctricas de combustibles fósiles podrían ser extremadamente ventajosas para nuestros recursos limitados."
 SIN_reinforce_our_infrastructure: "Reforzar la infraestructura eléctrica"
 SIN_reinforce_our_infrastructure_desc: "Reforzar la infraestructura eléctrica puede ayudar a garantizar que nuestra red nunca falle."
 SIN_nuclear_reactor: "El primer reactor"
 SIN_nuclear_reactor_desc: "Es hora de establecernos como una nación que ve el valor de construir energía nuclear."
 SIN_total_defence: "Defensa Total"
 SIN_total_defence_desc: "Defensa Total es el nombre de la estrategia integral de defensa de Singapur. El marco de Defensa Total abarca seis pilares fundamentales de la sociedad singapurense: defensa militar, civil, económica, social, psicológica y digital. Esta estrategia global ha demostrado ser efectiva en las décadas de 1980 y 1990."
 SIN_st_kinetics_investments: "ST Kinetics"
 SIN_st_kinetics_investments_desc: "ST Engineering is the only domestic supplier of Singapore defense forces providing our army with rifles and submachine guns all the way to APCs and IFVs. Expanding the size of its manufacturing plants helps us provide our armed forces with more domestic equipment, in shorter time."
 SIN_city_defenses: "Defensas de la Ciudad"
 SIN_city_defenses_desc: "Dado que nuestra nación es de tamaño muy reducido, proteger cada centímetro de nuestro suelo es de enorme importancia para nosotros. Necesitamos establecer nuevas líneas defensivas alrededor de nuestra nación para tener una mejor oportunidad de detener el avance de posibles enemigos antes de que puedan llegar a nuestra capital."
 SIN_singaporean_armor: "Blindaje Singapurense"
 SIN_singaporean_armor_desc: "One of the few areas where our armed forces are lacking technologically is armoured warfare. We need to acquire and study modern foreign tank models and eventually develop our domestically made MBT to fit into service."
 SIN_outsourced_military_industry: "Externalización de la Industria Militar"
 SIN_outsourced_military_industry_desc: "Tenemos limitaciones en cuanto a la capacidad de nuestra industria militar debido al tamaño de nuestra nación y nuestra pequeña población. Podemos establecer líneas de producción en otros países o contar con la capacidad industrial de productores extranjeros a cambio de nuestro apoyo económico."
 SIN_shorad_anti_air: "Defensa Antiaérea SHORAD"
 SIN_shorad_anti_air_desc: "Los sistemas SHORAD (Short Range Air Defense) son eficaces contra aeronaves que vuelan a baja altitud y atacan a nuestros soldados y nuestra capacidad industrial. Necesitamos adquirir nuevas baterías antiaéreas para tener una mayor ventaja táctica contra los bombarderos enemigos, más ligeros pero más rápidos."
 SIN_mechanized_combined_arms: "Armas Combinadas Mecanizadas"
 SIN_mechanized_combined_arms_desc: "Desde que adoptamos la doctrina de armas combinadas, convertimos la mayor parte de nuestra infantería regular en infantería mecanizada. Con el desarrollo de nuevos modelos de tanques, también necesitamos desarrollar nuevos modelos de vehículos blindados de combate para asegurarnos de que puedan competir mejor con los tanques y proteger mejor a nuestros soldados que llegan al campo de batalla."
 SIN_expanded_military_research: "Investigación Militar Ampliada"
 SIN_expanded_military_research_desc: "Con la expansión de nuestra capacidad militar e industrial, también necesitamos ampliar nuestros centros de Investigación y Desarrollo para mantener a nuestro ejército actualizado con los mejores avances tecnológicos."
 SIN_arms_exporter: "El Exportador de Armas"
 SIN_arms_exporter_desc: "Expansion of our domestic military industry also provides us with a surplus of modern equipment which we can export to other nations in exchange for profits."
 SIN_defensive_force: "Fuerza Defensiva"
 SIN_defensive_force_desc: "Our military forces have one major goal: to defend the motherland. Therefore our high command and Junior officers should be trained to enact better defensive strategies."
 SIN_entrenched_singapore: "La Ciudad-Estado Fortificada"
 SIN_entrenched_singapore_desc: "La segunda fase de expansión necesaria para las líneas defensivas de nuestro país, de modo que aún tengamos una oportunidad incluso después de la pérdida inicial de nuestras primeras líneas de defensa."
 SIN_punching_above_our_weight: "Golpeando Por Encima de Nuestro Peso"
 SIN_punching_above_our_weight_desc: "At first glance, Foreigners could think that Singapore is weak and vulnerable to enemy aggression, but they would be surprised when they see our glorious Armed forces in action. Long live the motherland!"
 SIN_sinister_ideas: "Ideas Siniestras"
 SIN_sinister_ideas_desc: "El ejército está ansioso por ir más allá de los límites. El gobierno es débil y los militares pueden llevarnos hacia adelante, donde los pomposos diplomáticos y burócratas no pueden."
 SIN_a_new_march: "Una Nueva Marcha"
 SIN_a_new_march_desc: "The military loyal to the government has started mounting a form of defence around the capital. These are trying times."
 SIN_military_politicians: "Políticos Militares"
 SIN_military_politicians_desc: "The coup has succeeded. The generals' corps has begun to be installed in key positions in the government."
 SIN_propaganda_campaigns: "Campañas de Propaganda"
 SIN_propaganda_campaigns_desc: "La gente aún mantiene la idea de que merecen representación. La representación se gana a través del servicio militar. Martillea esto en sus delgados cráneos."
 SIN_reeducation: "Singapur Reeducado"
 SIN_reeducation_desc: "La transición de Singapur hacia una nueva junta militar ha finalizado. El golpe de Estado está resuelto y es hora de comenzar de nuevo en nuestra gran marcha hacia adelante."
 SIN_the_republic: "La República"
 SIN_the_republic_desc: "The Republic of Singapore was established in 1965 during the decolonization of the British Empire. It was formerly a part of the Federation of Malaysia but split apart to become the modern-day nation of Singapore. Its ruling party the People's Action Party has remained firmly in control over the nation's government for the past forty years as it has effectively established itself as a one-party state."
 SIN_centralized_education: "Educación Centralizada"
 SIN_centralized_education_desc: "La educación en Singapur es en su mayoría manejada a nivel gubernamental, pero existe cierta elección local. Eliminar este sistema multifacético nos brindará una amplia oportunidad de elegir de manera más efectiva cómo debe ser la educación de nuestro pueblo."
 SIN_decentralize_the_government: "Protocolo de Descentralización"
 SIN_decentralize_the_government_desc: "Centrarse en nuestra fuerza de defensa y canalizar fondos hacia las Fuerzas de Defensa de Singapur siempre es una apuesta segura. Garantizará que nuestras fronteras y aguas estén seguras de aquellos que deseen hacernos daño."
 SIN_reinforce_the_state: "Reforzar el Estado"
 SIN_reinforce_the_state_desc: "Reforzar el estado es el primer paso para llevar a cabo reformas administrativas."
 SIN_reform_the_monetary_system: "Reformar el Sistema Monetario"
 SIN_reform_the_monetary_system_desc: "Reformar el sistema monetario de Singapur debería permitir un mayor desarrollo económico."
 SIN_military_budget_amendment: "Enmienda Presupuestaria Militar"
 SIN_military_budget_amendment_desc: "Aumentar el presupuesto militar debería permitirnos mejorar aún más nuestras fuerzas armadas y nuestra posición en el Sudeste Asiático."
 SIN_faith_in_the_establishment: "Fe en el Establecimiento"
 SIN_faith_in_the_establishment_desc: "The people have faith in our government. It is of the utmost importance to continue to capitalize on that faith and do what is right for the people of Singapore."
 SIN_administrative_reforms: "Reformas Administrativas"
 SIN_administrative_reforms_desc: "Removing red tape and optimizing administrative processes shall improve the performance of our government."
 SIN_economic_equality: "Igualdad Económica"
 SIN_economic_equality_desc: "Proporcionar igualdad económica a la gente de nuestra nación es imperativo."
 SIN_the_status_quo: "Estancamiento Electoral"
 SIN_the_status_quo_desc: "El proceso electoral en Singapur está estancado. El Partido de Acción Popular mantiene su férreo control sobre la nación."
 SIN_electoral_reform: "Reforma del Proceso Electoral"
 SIN_electoral_reform_desc: "El proceso de nuestras elecciones está manipulado y permitir que más miembros de terceros partidos ingresen al parlamento será el primer paso hacia un nuevo mañana."
 SIN_defence_strategy: "Estrategia de Defensa"
 SIN_defence_strategy_desc: "Es algo bastante simple. La defensa es nuestra prioridad."
 SIN_conservative_singapore: "Singapur Conservador"
 SIN_conservative_singapore_desc: "Progress is a facade. Singapore is best when it moves towards conservatism."
 SIN_anti_corruption_measures: "Medidas contra la Corrupción"
 SIN_anti_corruption_measures_desc: "Reducir la corrupción en nuestra nación será un beneficio permanente para nuestro pueblo y la nación."
 SIN_fair_and_free: "Justo y Libre"
 SIN_fair_and_free_desc: "Asegurar que nuestras elecciones sean justas y libres es la clave para un nuevo Singapur."
 SIN_support_the_opposition: "Apoyar a la Oposición"
 SIN_support_the_opposition_desc: "Aunque parezca contradictorio, apoyar a la oposición de nuestro gobierno es un paso crítico para avanzar."
 SIN_expand_the_total_defence_strategy: "Expansión de la Estrategia de Defensa Total"
 SIN_expand_the_total_defence_strategy_desc: "La estrategia de Defensa Total nos ha servido perfectamente en las décadas desde su establecimiento. Expandir esta estrategia es una de las mejores cosas que podemos hacer."
 SIN_maintain_singapore: "Mantener Nuestro Singapur"
 SIN_maintain_singapore_desc: "La estabilidad es mucho más progresiva que tener un gobierno nuevo y en constante cambio."
 SIN_increase_police_funding: "Aumento de la Financiación Policial"
 SIN_increase_police_funding_desc: "La fuerza policial es una de las estructuras más importantes dentro de nuestro gobierno, dado que somos una ciudad-estado. Invertir y aumentar los fondos que se les asignan ayuda en última instancia a todas las personas."
 SIN_encourage_the_multi_party_system: "Fomentar el sistema multipartidista"
 SIN_encourage_the_multi_party_system_desc: "Lifting restrictions against minor parties and encouraging greater participation in the government is the exact way forward."
 SIN_liberalization: "Liberalización"
 SIN_liberalization_desc: "La liberalización de la esfera política es una de las opciones."
 SIN_autocracy_for_democracy: "Autocracia para la Democracia"
 SIN_autocracy_for_democracy_desc: "La autocracia es el medio más perfecto para la democracia."
 SIN_new_singapore: "Un Nuevo Singapur"
 SIN_new_singapore_desc: "Reducir el umbral electoral en Singapur es el primer paso hacia un nuevo Singapur."
 SIN_impose_harder_censorship: "Imponer una Censura Más Dura"
 SIN_impose_harder_censorship_desc: "Ningún medio será difundido en Singapur sin ser evaluado en cuanto a su adecuación. Una censura más dura tiene un precio, pero la estabilidad está por encima de todo."
 SIN_greater_control: "Mayor Control"
 SIN_greater_control_desc: "Dictar un mayor control sobre las personas y sus vidas es la forma de avanzar."
 SIN_liberties_for_stability: "Libertades para la Estabilidad"
 SIN_liberties_for_stability_desc: "¿No pueden las personas renunciar a algunas libertades a cambio de estabilidad nacional?"
 SIN_expand_freedom_of_press: "Expandir la Libertad de Prensa"
 SIN_expand_freedom_of_press_desc: "La libertad de prensa en la nación es imperativa para alejarnos de nuestro pasado autocrático."
 SIN_grant_lgbtq_rights: "Conceder Derechos LGBTQ"
 SIN_grant_lgbtq_rights_desc: "Históricamente, Singapur ha mantenido leyes estrictas con respecto a las personas LGBTQ+. La modernización de estas leyes mejorará los derechos humanos y alineará a Singapur con los estándares internacionales."
 SIN_address_human_rights: "Abordar las Violaciones de los Derechos Humanos"
 SIN_address_human_rights_desc: "Es necesario abordar las violaciones de los derechos humanos que sufren los trabajadores migrantes y las comunidades de bajos ingresos para mantener la armonía social y cumplir con las obligaciones internacionales."
 SIN_the_alignment: "La Alineación Singapurense"
 SIN_the_alignment_desc: "La alineación de nuestro partido finalmente decidirá nuestro futuro."
 SIN_western_identity: "A Western Identity"
 SIN_western_identity_desc: "Buscar políticas y diplomacia exterior más centradas en Occidente nos ayudará a evitar el dominio de China y la influencia del Bloque del Este. Es imperativo que sigamos promoviendo esta narrativa para mantenernos en el camino correcto."
 SIN_singapore_alone: "Singapore Alone"
 SIN_singapore_alone_desc: "Singapur ha elegido históricamente un camino constante de apoyo a Occidente con elementos neutrales. Si mantenemos este camino, podremos seguir manteniendo nuestra postura sólida en el sudeste asiático."
 SIN_strength_in_asia: "Strength in Asia"
 SIN_strength_in_asia_desc: "Es hora de revisar nuestra política exterior. Presionarnos para estar a la vanguardia asegurará que la victoria sea nuestra. Singapur se convertirá en la nueva Fortaleza en Asia, un líder para los desanimados mientras encontramos una nueva posición."
 SIN_soften_citizenship: "Flexibilizar los Requisitos de Ciudadanía"
 SIN_soften_citizenship_desc: "Citizenship requirements for Singapore are notoriously hard to pass. Softening these requirements should see our population continue to grow more and more."
 SIN_allow_foreign_media: "Permitir Medios Extranjeros"
 SIN_allow_foreign_media_desc: "Foreign media has never been truly outright banned in Singapore. They do have to adhere to strict regulations which does cause some issues where sites are blocked from access in Singapore. Rolling back some of these more harsh regulations could see more media allowed and shown within the city-state."
 SIN_strength_in_straits: "Fortaleza en el Estrecho"
 SIN_strength_in_straits_desc: "La posición estratégica de Singapur en el estrecho de Malaca le otorga una influencia única sobre los flujos comerciales mundiales. Aprovechar al máximo esta posición es fundamental para nuestra seguridad y prosperidad a largo plazo."
 SIN_nationalize_foreign_companies: "Nacionalizar Empresas Extranjeras"
 SIN_nationalize_foreign_companies_desc: "Las empresas extranjeras que operan en el país no están en condiciones de hacerlo sin una mano más dura por parte de nuestro gobierno. Deberíamos nacionalizar estas empresas y asegurarnos de tener el control total sobre sus asuntos."
 SIN_return_from_flawed_democracy: "Regresar de una Democracia Defectuosa"
 SIN_return_from_flawed_democracy_desc: "Es hora de que Singapur regrese de ser una democracia defectuosa. El pueblo merece el derecho de votar por el partido que apoya."
 SIN_finance_western_projects: "Financiar Proyectos Occidentales"
 SIN_finance_western_projects_desc: "Los países occidentales nos ofrecen proyectos e ideas para incorporar a nuestra nación, pero somos nosotros los que tenemos la obligación de financiar esos proyectos."
 SIN_singaporean_identity: "Identidad Singapurense"
 SIN_singaporean_identity_desc: "La identidad de Singapur es clara. Es importante garantizar que nuestra identidad no se desvanezca."
 SIN_befriend_the_sco: "Hacer Amistad con la SCO"
 SIN_befriend_the_sco_desc: "Hacer amistad con los estados miembros de la Organización de Cooperación de Shanghai resultará muy beneficioso."
 SIN_anti_opposition_laws: "Leyes Contra la Oposición"
 SIN_anti_opposition_laws_desc: "Es imperativo aprobar leyes para asegurar que la oposición no sea permitida en el poder a cualquier costo."
 SIN_european_democracy: "Democracia Europea"
 SIN_european_democracy_desc: "Abrazar la democracia europea permitirá que se representen más partidos en nuestro parlamento."
 SIN_greater_ties_with_europe: "Mayores Lazos con Europa"
 SIN_greater_ties_with_europe_desc: "Deeper ties with the Eurozone and Europe should bring us greater prosperity and strength. If we wish to become a stronger financial sector than London then we should press this more and more."
 SIN_the_pap: "El PAP"
 SIN_the_pap_desc: "El Partido de Acción Popular es el partido dominante de la pequeña ciudad-estado. Asegurar la dominancia del partido nos permitirá tener y mantener la estabilidad en nuestra ciudad."
 SIN_the_chinese_media_model: "El Modelo de Medios Chino"
 SIN_the_chinese_media_model_desc: "Es hora de tomar una página del libro chino. Es hora de aplicar el modelo de medios chino aquí en Singapur."
 SIN_harsher_state: "Estado Más Severo"
 SIN_harsher_state_desc: "Prohibir todos los partidos que se opongan al Partido de Acción Popular y al ejército asegurará un régimen estable."
 SIN_global_initiative: "Global Initiative"
 SIN_global_initiative_desc: "Es hora de que la nación se embarque en la nueva iniciativa global: Singapur para siempre."
 SIN_singapore_on_the_rise: "Singapore On The Rise"
 SIN_singapore_on_the_rise_desc: "El soft power es la nueva forma de ejercer nuestra fuerza e influencia en el extranjero."
 SIN_pressure_the_south_asian_seas: "Pressure The South Asian Seas"
 SIN_pressure_the_south_asian_seas_desc: "Las fuerzas militares de Singapur están ansiosas por pelear. El nuevo imperio singapurense crecerá y se expandirá."
 SIN_operation_enticement: "Operación Atracción"
 SIN_operation_enticement_desc: "Utilizando nuestra superior agencia de inteligencia, podemos atraer a naciones para que estén más cerca de nuestra ideología política."
 SIN_political_maneuvering: "Maniobras Políticas"
 SIN_political_maneuvering_desc: "Las maniobras políticas y el servilismo son excelentes formas de conseguir lo que queremos en cualquier diálogo."
 SIN_demand_special_treatment: "Prioridades Económicas"
 SIN_demand_special_treatment_desc: "La economía es todo lo que importa aquí en la ciudad. Si no mantenemos nuestra prosperidad, nunca lograremos la grandeza que merecemos."
 SIN_economic_champion: "Campeón Económico"
 SIN_economic_champion_desc: "El poderío económico de Singapur supera con creces el tamaño del país. Aprovechando su dominio comercial y su perspicacia financiera, la ciudad-estado aspira a convertirse en la principal potencia económica del sudeste asiático."
 SIN_demand_malaysian_concessions: "Inversión Militar"
 SIN_demand_malaysian_concessions_desc: "Invertir en nuestras fuerzas armadas y en nuestra infraestructura militar debería permitir un mayor expansionismo."
 SIN_the_archipelago: "El Archipiélago"
 SIN_the_archipelago_desc: "Las Islas Riau están listas para ser tomadas. Los indonesios simplemente no saben que les conviene mantener esta cadena de islas."
 SIN_prioritize_diplomacy: "Priorizar la Diplomacia"
 SIN_prioritize_diplomacy_desc: "Priorizar la diplomacia sobre el conflicto es imperativo. Es algo que impulsa nuestra influencia en el extranjero para instaurar la supremacía singapurense."
 SIN_condemn_aggression: "Condenar la Agresión"
 SIN_condemn_aggression_desc: "Ahora es política oficial condenar la agresión de cualquier actor estatal que intimide a otro."
 SIN_require_unfair_treaties: "El Banco del Sudeste Asiático"
 SIN_require_unfair_treaties_desc: "Tener los activos de otras naciones solo servirá para empoderarnos."
 SIN_nationalistic_rise: "Auge Nacionalista"
 SIN_nationalistic_rise_desc: "Las mareas crecientes en nuestras costas están comenzando a revelar algo inusual. El nacionalismo en la nación está empezando a ser el punto central de nuestra política. Un nuevo rugido comienza a escucharse en las calles de Singapur."
 SIN_seize_the_peninsula: "Tomar la Península"
 SIN_seize_the_peninsula_desc: "Invadir la Península Malaya nos proporcionará recursos, apoyo y una multitud de cosas diferentes para expandirnos. Tomar la península es el primer paso hacia la grandeza."
 SIN_invade_sumatra: "Invadir Sumatra"
 SIN_invade_sumatra_desc: "Sumatra tiene muchos recursos de todo tipo y una gran población. Están más cerca de nuestro gobierno que el de Yakarta. Tomar la isla y prepararse para futuras conquistas contra Indonesia."
 SIN_singapore_for_peace: "Singapur por la Paz"
 SIN_singapore_for_peace_desc: "La guerra es un esfuerzo inútil. Singapur busca simplemente hacer la paz en el mundo para siempre."
 SIN_economic_empire: "Imperio Económico"
 SIN_economic_empire_desc: "Nuestro imperio se levantará, pero no de manera normal. El país comenzará a construir un imperio de dominio económico en todo el territorio nacional."
 SIN_set_our_sights: "Fijar Nuestros Objetivos"
 SIN_set_our_sights_desc: "It is time we set our sights on pursuing additional conquests and expansionism. Set our sights abroad."
 SIN_restrict_migration: "Restringir Trabajadores Migrantes"
 SIN_restrict_migration_desc: "Restringir la entrada de trabajadores migrantes al país significa que esos puestos de trabajo pueden ser dados a las personas locales."
 SIN_encourage_migration: "Fomentar la Migración"
 SIN_encourage_migration_desc: "Los trabajadores migrantes son el pilar de nuestra construcción y nuestra fuerza laboral. Es imperativo fomentar esta migración."
 SIN_singaporeans_first: "Singapurenses Primero"
 SIN_singaporeans_first_desc: "Los ciudadanos singapurenses tienen la prioridad absoluta."
 SIN_restrictive_citizenship: "Poner Fin a los Trabajadores Migrantes"
 SIN_restrictive_citizenship_desc: "Restringir aún más a los trabajadores migrantes y depender más de la población local podría seguir enfocándonos en los intereses de Singapur."
 SIN_import_cheap_labour: "Importar Mano de Obra Barata"
 SIN_import_cheap_labour_desc: "La mano de obra en Singapur es mucho más cara que importar trabajadores migrantes al país. Ellos pueden hacer más por mucho menos."
 SIN_singapore_south_east_asia: "Centro de Comercio del Sudeste Asiático"
 SIN_singapore_south_east_asia_desc: "Singapore is a major financial, and major trading port between the west and east. It sits on the vital Malacca straits, ensuring more trade flows through Singapore will only bring prosperity to itself and the nations around it."
 SIN_asean_commentary: "Comentario sobre la ASEAN"
 SIN_asean_commentary_desc: "El diálogo con los Estados miembros de la ASEAN redundará en beneficio de todos. Brindarles mayor apoyo fortalecerá la cooperación regional y la posición de Singapur dentro del bloque."
 SIN_expand_trade_with_india: "Expandir el Comercio con India"
 SIN_expand_trade_with_india_desc: "India is one of the largest importers and exporters of goods in the South Asian region. Ensuring we have properly allocated trade routes with India will allow us to net in more revenue and profit."
 SIN_south_asian_countries: "Países del Asia Meridional"
 SIN_south_asian_countries_desc: "Mejorar las relaciones con otros países del Asia Meridional podría hacer crecer nuestra capacidad económica."
 SIN_influence_the_members: "Influir en los Miembros"
 SIN_influence_the_members_desc: "Preparar propaganda pro-singapurense y difundirla entre los Estados miembros de la ASEAN debería mantenernos en la cima."
 SIN_trade_with_sri_lanka: "Comerciar con Sri Lanka"
 SIN_trade_with_sri_lanka_desc: "El comercio entre Sri Lanka y Singapur es una rama más pequeña de los acuerdos comerciales generales; sin embargo, el comercio de Singapur a Sri Lanka es lucrativo de todos modos."
 SIN_singaporean_foreign_aid: "Ayuda Extranjera Singapurense"
 SIN_singaporean_foreign_aid_desc: "Preparar paquetes de ayuda extranjera para las naciones con las que tenemos acuerdos comerciales solo beneficiará nuestra red de amigos y aliados."
 SIN_madagascan_trade_routes: "Rutas Comerciales con Madagascar"
 SIN_madagascan_trade_routes_desc: "Singapur y Madagascar han mantenido vínculos históricamente amigables durante muchos años, incluso durante la época colonial. Hoy en día, los dos países tienen una relación comercial saludable y rentable."
 SIN_the_philippines: "Las Filipinas"
 SIN_the_philippines_desc: "Uno de los mayores socios comerciales de Singapur, las Filipinas y Singapur disfrutan de una colaboración significativa. Brindándose mutuamente apoyo financiero y político en la ASEAN."
 SIN_demand_asean_concessions: "Exigir Concesiones de la ASEAN"
 SIN_demand_asean_concessions_desc: "It is time Singapore is treated like the nation it deserves to be treated as. Demanding concessions and special treatment is how we will rise."
 SIN_control_the_straits: "Controlar los Estrechos"
 SIN_control_the_straits_desc: "Afianzar nuestra fortaleza en los estrechos y asegurarnos de controlarlos es nuestro camino hacia la gloria."
 SIN_global_free_trade: "Comercio Global Libre"
 SIN_global_free_trade_desc: "Mejorar las relaciones comerciales y el alcance político con nuestros vecinos significa más comercio, lo que a su vez significa más dinero para nosotros."
 SIN_dictate_trade_agreements: "Dictar Acuerdos Comerciales"
 SIN_dictate_trade_agreements_desc: "Singapur es quien debe redactar los acuerdos comerciales."
 SIN_strong_arm_the_asean: "Presionar a la ASEAN"
 SIN_strong_arm_the_asean_desc: "Further putting the ASEAN's arm behind its back ensures a stronger position for Singapore in the Association."
 SIN_japanese_free_trade_agreement: "Acuerdo de Libre Comercio con Japón"
 SIN_japanese_free_trade_agreement_desc: "Firmar un acuerdo de comercio con Japón tiene una importancia estratégica."
 SIN_usa_singaporean_agreements: "Acuerdos Singapurense-EE. UU."
 SIN_usa_singaporean_agreements_desc: "The USA and Singapore have signed multiple trade agreements in the past including ones regarding trade and financial agreements."
 SIN_singaporean_trade_influence: "Influencia Comercial Singapurense"
 SIN_singaporean_trade_influence_desc: "Ampliar nuestra influencia comercial es la forma más segura de consolidar nuestra fortaleza económica."
 SIN_pressure_the_japanese: "Nacionalizar los Activos Japoneses"
 SIN_pressure_the_japanese_desc: "Japan has a substantial amount of assets in our nation. If we take their assets and bring them into the government we can properly administer our nation."
 SIN_global_investment: "Inversión Global"
 SIN_global_investment_desc: "Cuanto más inversiones globales busquemos, más fuerte será nuestra economía. Si mantenemos este camino y presionamos para que haya más inversiones en el exterior, sólo veremos más y más ganancias."
 SIN_regional_investment: "Inversiones Globales Expandidas"
 SIN_regional_investment_desc: "The new investment plans have been profitable; however pursuing more and more is nothing but a benefit for the city."
 SIN_expand_foreign_reserve: "Expandir las Reservas Extranjeras"
 SIN_expand_foreign_reserve_desc: "Las arcas en el extranjero están un poco vacías, presionar por más fondos de la población para expandir nuestras reservas será beneficioso para el Estado."
 singapore.0.t: "El Tigre del Sudeste Asiático"
 singapore.0.d: "Nos encontramos en una de las posiciones geográficas más importantes del sudeste asiático. El comercio fluye libremente a través de nosotros y hemos crecido gradualmente hasta convertirnos en uno de los centros financieros más grandes del mundo. ¡Es hora de que Singapur haga honor a su nombre y se convierta verdaderamente en el tigre que estamos destinados a ser!"
 singapore.0.a: "Ellos Oirán Nuestro Rugido"
 singapore.3.t: "Una Nueva Marcha Singapurense"
 singapore.3.d: "Nuestras fuerzas militares marchan por las calles de la ciudad, buscando apoyo de todos los ámbitos de la vida. Vehículos blindados y unidades militares fuertemente armadas se han apostado fuera del edificio del parlamento. Un discurso emocionante resonó en la multitud reunida frente al edificio del parlamento. Se escucharon aplausos y abucheos mientras una parte de las fuerzas atravesaba la puerta del edificio. El ejército arrestó a políticos y burócratas mientras caminaban por el edificio del parlamento.\n\n¿Cómo debería proceder nuestro nuevo gobierno? ¿Debería permitir el ejército que el Partido de Acción Popular colabore con el nuevo gobierno?"
 singapore.3.a: "El Ejército Toma el Poder"
 singapore.3.b: "Colaboración con el PAP"
 singapore.4.t: "La Marcha del Ejército Singapurense"
 singapore.4.d1: "El Ejército Singapurense ha tomado el control del estado de la ciudad y ahora está tomando rápidamente el control total sobre el gobierno y los últimos bastiones de resistencia. [SIN.GetLeader] ahora tiene el control total del gobierno en la ciudad."
 singapore.4.d2: "La colaboración entre facciones del Partido de Acción Popular y el ejército ha permitido un cambio de gobierno en Singapur. El ejército y una pequeña facción del PAP han tomado el control del parlamento y ahora están preparando el gobierno."
 singapore.4.a: "Un Nuevo Rumbo para Singapur"
 singapore.5.t: "Singapur Exige [627.GetName]"
 singapore.5.d: "Riau Islands are an island chain just off the coast of Singapore. It has natural resources and building space, which Singapore is quickly running out of in the city-state. However, this is an island that has been ours for centuries. Should we concede this strategically important island chain?"
 singapore.5.a: "Ceder las Islas"
 singapore.5.b: "Rechazar la Demanda"
 singapore.6.t: "Indonesia Cede las Islas"
 singapore.6.d: "Indonesia ha cedido [627.GetName] a nosotros. Esta es una gran victoria para Singapur y su pueblo."
 singapore.6.a: "Fantástico"
 singapore.7.t: "Indonesia Rechaza las Concesiones"
 singapore.7.d: "Indonesia ha rechazado la concesión de la cadena de islas. Podemos optar por retroceder o podemos intensificar la situación."
 singapore.7.a: "Comienza la crisis en las islas Riau"
 singapore.8.t: "Las Islas Riau Cambian de Manos"
 singapore.8.d: "Indonesia ha cedido las islas al gobierno de Singapur."
 singapore.8.a: "Desarrollo interesante"
 singapore.9.t: "Comienza la Crisis de las Islas Riau"
 singapore.9.d: "Indonesia ha rechazado las demandas del gobierno de Singapur. El tiempo dirá qué ocurrirá exactamente con esta amenaza inminente en el Sudeste Asiático."
 singapore.9.a: "Preocupante"
 singapore.101.t: "Vuelo 006 de Singapore Airlines"
 singapore.101.d: "As of several hours ago, Flight 006 of Singapore Airlines has crashed killing eighty-one of the one hundred seventy nine of the passengers. Taiwanese officials are on site in Taipei investigating the cause of the issue and performing rescue operations for the remaining survivors."
 singapore.101.a: "Investigar a la aerolínea"
 singapore.101.b: "¿A quién le importa?"
 singapore.101.c: "Enviar fondos de ayuda a las víctimas"
 singapore.101.e: "Enviar fondos a Taiwán para reparar el aeropuerto"
 singapore.102.t: "Complot de Ataques a las Embajadas de Singapur"
 singapore.102.d: "La policía de Singapur ha desarticulado un complot de Jemaah Islamiyah para atentar contra las embajadas de Estados Unidos, Reino Unido, Australia e Israel. El complot fue descubierto hace unas semanas gracias a la información proporcionada por un informante. Quince personas han sido arrestadas en relación con este plan de ataque."
 singapore.102.a: "Ejecutar al grupo"
 singapore.102.b: "Prisión de por vida"
 singapore.103.t: "Disputas de Pedra Branca"
 singapore.103.d: "Pedra Branca is a small granite outcrop in the territorial waters of Malaysia with a lighthouse that is administered by Singapore. Minor disputes and discussions over the sovereignty of the Island resulted in a court case going to the International Court of Justice in the '90s. After nearly a decade the Pedra Branca disputes are finally coming to a close after many rounds of discussions and court hearings. Pedra Branca's lighthouse and the island belong firmly to Singapore."
 singapore.103.a: "Un día glorioso para la diplomacia"
 singapore.104.t: "Tifón Vamei"
 singapore.104.d: "La tormenta tropical Vamei ha atravesado la ciudad. La infraestructura de la ciudad no se vio afectada en gran medida; sin embargo, los aeropuertos presentan daños menores e interrupciones en los controles de flujo de aire."
 singapore.104.d1: "La tormenta Vamei ha arrasado la península malaya. Los daños en las zonas aledañas a Singapur, a pocos kilómetros de Kuala Lumpur, son considerables: inundaciones y árboles derribados."
 singapore.104.a: "Reparar los daños"
 singapore.104.b: "Proporcionar ayuda adicional"
 singapore.105.t: "El Teatro Esplanade"
 singapore.105.d: "Hoy se celebra la gran inauguración del teatro Esplanade. Consta de una sala de conciertos con una capacidad de mil seiscientas personas y un teatro con una capacidad de dos mil para las artes escénicas. El Esplanade fue encargado por el Ministerio de Arte y Cultura para fomentar el desarrollo cultural de la ciudad."
 singapore.105.a: "Visitar el teatro"
 singapore.105.b: "Programar algunos eventos"
 singapore.106.t: "Brote del virus SARS"
 singapore.106.d: "Una enfermedad relativamente nueva se ha propagado en nuestros hospitales durante la última semana. El virus del SARS se propagó en el Hospital Tan Tock Seng, afectando a varios cientos de personas. Fue rápidamente controlado y su impacto se redujo al mínimo poco después de su aparición. Se registraron varias muertes antes de que se lograra controlar la enfermedad."
 singapore.106.a: "Financiar el hospital"
 singapore.106.b: "Iniciar un bloqueo"
 singapore.106.c: "Las máscaras son para perdedores"
 singapore.107.t: "Inauguración del Centro de Investigación Biopolis"
 singapore.107.d: "Biopolis es un centro de investigación y desarrollo en ciencias biomédicas que ha sido inaugurado en one-North Buona Vista. Está muy cerca de la Universidad Nacional de Singapur y otros importantes centros de investigación y desarrollo. El campus está dedicado a proporcionar un espacio para actividades de investigación y desarrollo biomédico en la ciudad."
 singapore.107.a: "Un día maravilloso para la ciencia"
 singapore.107.b: "Subsidiar aún más el centro de investigación"
 singapore.108.t: "Goh Chok Tong renuncia"
 singapore.108.d: "Goh Chok Tong ha decidido dimitir como primer ministro y ceder el liderazgo a Lee Hsien Loong. Lee Hsien Loong es hijo del ex primer ministro Lee Kuan Yew y un político de larga trayectoria. Esta transición de poder, de Goh Chok Tong a Lee Hsien Loong, sentará un nuevo precedente en la gobernanza de Singapur."
 singapore.108.a: "Un gran líder se retira"
 singapore.109.t: "Derrumbe de Nicoll Highway"
 singapore.109.d: "Hoy temprano ocurrió un accidente de construcción en el que se derrumbó un túnel de las líneas del MRT. Las estructuras de apoyo en el túnel fallaron, afectando seis carriles de la Nicoll Highway. Se reportaron cuatro muertes y tres heridos no fatales a causa del derrumbe."
 singapore.109.a: "Investigar a la empresa de construcción"
 singapore.109.b: "No hacer nada"
 singapore.109.c: "Issue Funds to the Bereaved and Employ Greater Oversight"
 singapore.110.t: "Plataforma Flotante de Marina Bay"
 singapore.110.d: "The Marina Bay Floating Platform has officially opened this year to host sporting events and other events for the city. Although this was originally intended to be temporary, it appears that it is slowly becoming permanent."
 singapore.110.a: "Reducir el financiamiento de la plataforma flotante"
 singapore.110.b: "Patrocinar eventos adicionales"
 singapore.110.c: "¡Hurra por la cultura!"
 singapore.111.t: "Ejecución de dos hombres africanos"
 singapore.111.d: "Dos hombres africanos están programados para ser ejecutados por contrabando de drogas. Las súplicas internacionales de clemencia han sido respondidas con silencio, ya que Singapur continúa su política de ejecutar a aquellos que introducen drogas en la ciudad. Es otro ejemplo del autoritarismo presente en la ciudad. ¿Deberíamos otorgar clemencia a los hombres?"
 singapore.111.a: "Conceder clemencia"
 singapore.111.b: "La ley es la ley"
 singapore.112.t: "El Gran Premio de Singapur"
 singapore.112.d: "El Gran Premio de Singapur no se ha celebrado desde las carreras de Fórmula Libre de 1973. Este año, el Gran Premio ha regresado a la ciudad de Singapur. La Junta de Turismo de Singapur ha decidido firmar un acuerdo de cinco años para mantener abierto el Gran Premio y devolver a Singapur al ciclo de carreras de F1."
 singapore.112.a: "La Fórmula 1 trae delincuencia, trae drogas."
 singapore.112.b: "¡Maravilloso! ¡Más eventos en la ciudad!"
 singapore.113.t: "Escape de Mas Selamat Kastari"
 singapore.113.d: "Mas Selamat Kastari, the alleged head of Jemaah Islamiyah's Singapore branch, has escaped today from Whitley Road Detention Centre. The cause of the actual escape is shrouded in mystery. Kastari's family was visiting at the time and then he asked to use the toilet. He ran away from the guards and ultimately escaped. The Gurkha Contingent, the Police and Military have all failed to locate the man."
 singapore.113.a: "Fracaso de la policía"
 singapore.114.t: "50 años de autogobierno"
 singapore.114.d: "En 1965, Singapur se separó de la Federación de Malasia. Este año se cumplen cincuenta años de esa separación y Singapur puede celebrar medio siglo de autogobierno. Es un día maravilloso para Singapur y para todas las naciones más pequeñas del mundo."
 singapore.114.a: "La Ciudad del León sigue siendo fuerte"
 singapore.115.t: "Caso de la Iglesia City Harvest"
 singapore.115.d: "El caso de la Iglesia City Harvest es el mayor caso de abuso de confianza en Singapur desde principios del siglo XXI. El fundador, Kong Hee, fue declarado culpable de malversar unos cincuenta millones de dólares singapurenses con la ayuda de líderes clave de la iglesia. Aproximadamente veinticuatro millones se invirtieron en bonos ficticios para financiar la carrera musical de su esposa. El uso indebido de los fondos resultó en el arresto y la condena de numerosas personas por fraude y falsificación de cuentas."
 singapore.115.a: "Intervenir para obtener una parte del pastel"
 singapore.115.b: "Un día de justicia"
 singapore.116.t: "Alan Shadrake condenado"
 singapore.116.d: "Alan Shadrake is a British author who has been convicted of contempt of court for scandalising the Singapore judicial system, his published views of the system. The publication 'Singapore Justice in the Dock' attacked and criticized Singapore's judicial system. Internationally it has been universally accepted we should release Alan. How should we proceed?"
 singapore.116.a: "Liberar a Alan"
 singapore.116.b: "Darle un castigo más severo"
 singapore.116.c: "Seguir la decisión del jurado"
 singapore.117.t: "Huelga de conductores de autobuses chinos"
 singapore.117.d: "Las tensiones raciales alcanzaron su punto álgido hoy con la primera huelga en veinticinco años. Los conductores de autobús inmigrantes chinos protestan contra la discriminación que sufren sus colegas malasios y singapurenses. Alegan que reciben un treinta por ciento menos de salario. El impacto está interrumpiendo el transporte público en la ciudad y causando pérdidas a muchos singapurenses."
 singapore.117.a: "Enviar a los Gurkhas"
 singapore.117.b: "Proporcionar fondos de apoyo"
 singapore.117.c: "No hacer nada"
 singapore.118.t: "Disturbios en Little India"
 singapore.118.d: "Los disturbios comenzaron tras un accidente mortal en el cruce de Race Course Road y Hampshire Road, en Little India, Singapur. Se desplegaron oficiales del Comando de Operaciones Especiales y del Contingente Gurkha para sofocar los disturbios. ¿Debemos actuar con mayor contundencia o permitir que el despliegue se desarrolle con normalidad?"
 singapore.118.a: "Que intervenga el ejército"
 singapore.118.b: "Permitir que la policía use la fuerza letal"
 singapore.118.c: "No hacer nada"
 singapore.119.t: "Disturbios de los trabajadores extranjeros"
 singapore.119.d: "La elección del gobierno de permitir requisitos de ciudadanía más laxos para los trabajadores migrantes ha tenido un costo grave. Los singapurenses han iniciado huelgas y disturbios más intensos contra el gobierno. ¿Qué debemos hacer para proceder?"
 singapore.119.a: "Las consecuencias de mis acciones"
 singapore.119.b: "Derogar las leyes de migración"
 singapore.120.t: "Manifestaciones contra los trabajadores migrantes"
 singapore.120.d: "The government has produced a new plan to increase the city's population by allowing lighter restrictions on the citizenship requirements for migrant workers. This would in theory increase migration to the city-state, but it could put strain on the natural born people of Singapore. Thousands have taken to the streets in peaceful protest. Should we step back from our stance?"
 singapore.120.a: "Dar un paso atrás"
 singapore.120.b: "Continuar en el camino"
 singapore.121.t: "Difamación del CPF"
 singapore.121.d: "El Primer Ministro de Singapur [SIN.GetLeader] ha demandado al bloguero Roy Ngerng por sus críticas. Esta es la primera vez que la ciudad emprende acciones legales contra un crítico en línea. El blog implicaba a [SIN.GetLeader] en irregularidades relacionadas con la gestión de los fondos del Fondo Central de Previsión (CPF). El CPF es un plan central de ahorro para la jubilación de la ciudad de Singapur y su participación es obligatoria para todos. ¿Debemos silenciar al crítico o permitirle publicar?"
 singapore.121.a: "Permitirle publicar"
 singapore.121.b: "Encarcelarlo"
 singapore.122.t: "Construcción de la línea MRT"
 singapore.122.d: "The MRT Line is a proposed high capacity freight line to relieve congestion on the existing East West Line and slated to begin at Changi on Singapore's eastern coast. It would pass through major eastern towns including Pasir Ris, Hougang, and Ang Mo Kio. The line was planned to be fifty kilometers long and open in 2030. It will cost the city an estimated fifty seven billion dollars. The line however should have a net profit of upwards to eighty billion dollars due to the increased throughput of materials."
 singapore.122.a: "Denegar el proyecto"
 singapore.122.b: "Aprobar el proyecto"
 singapore.123.t: "Fallecimiento de Lee Kuan Yew"
 singapore.123.d: "Lee Kuan Yew, el primer ministro de Singapur, falleció hoy. Lee Kuan Yew murió a causa de una neumonía grave después de luchar contra ella durante casi un mes. [SIN.GetLeader] ha anunciado formalmente la pérdida. Se ha comenzado a organizar un funeral para las próximas semanas, financiado por el estado. Se espera que miles de personas asistan al funeral desde toda la ciudad."
 singapore.123.a: "El héroe de Singapur"
 singapore.124.t: "Presuntos militantes de Jemaah Islamiyah"
 singapore.124.d: "Quince presuntos militantes del grupo terrorista Jemaah Islamiyah han sido detenidos hoy. Tenían en su posesión armas, dinero en efectivo y mucho más, lo que parece indicar que estaban preparando algún tipo de ataque contra el gobierno de Singapur. ¿Cómo debemos proceder?"
 singapore.124.a: "Ejecutarlos"
 singapore.124.b: "Cadena perpetua"
 singapore.125.t: "Reducción de libros prohibidos"
 singapore.125.d: "En un giro inesperado, Singapur decidió que ya era hora de reducir el número de publicaciones prohibidas de doscientos cincuenta y siete libros a diecisiete. El cambio permite algunos temas comunistas y para adultos, pero mantiene la prohibición de las publicaciones de los testigos de Jehová. Algunos de los libros incluyen \"Fanny Hill\" o \"La larga marcha\"."
 singapore.125.a: "Desprohibirlos todos"
 singapore.125.b: "El Parlamento tiene razón"
 singapore.126.t: "Arresto de ocho hombres bangladesíes"
 singapore.126.d: "Ocho hombres bangladesíes fueron arrestados hoy por el Ministerio del Interior. Los detenidos están vinculados al Estado Islámico en Bangladesh (ISB) y se les acusa de planear atentados terroristas en Bangladesh para derrocar al gobierno. No tenían intención de atacar Singapur."
 singapore.126.a: "Condenar a muerte"
 singapore.126.b: "Extraditar a Bangladesh"
 singapore.127.t: "Protestas contra Halimah Yacob"
 singapore.127.d: "Singaporeans have taken to the streets after the recent presidential election. Halimah Yacob ran unopposed for the presidency, and as such many believe she came to power in a moment of corruption. Four other potential presidents applied yet they were rejected. The power of authorities are running unchecked for far too long in the city-state."
 singapore.127.a: "Infundado"
 singapore.127.b: "Investigar por fraude electoral"
 singapore_alignment_help.0.t: "Ayuda para la alineación de Singapur"
 singapore_alignment_help.0.d: "The Singaporean Alignment mechanic is intended to simulate the divide between the three different cliques within the £SIN_conservatism People's Action Party (PAP). The interactions below allow you to sway the alignment of the party. A different alignment will allow you to make unique decisions and event choices throughout your gameplay as Singapore. The scripted GUI itself has tooltips explaining what each of the actions do."
 singapore_alignment_help.0.a: "De acuerdo"
 singapore_elections.0.t: "Elecciones [GetYear] concluidas"
 singapore_elections.0.desc: "Otro año y otra elección aquí en la grandiosa ciudad de Singapur."
 singapore_elections.0.a: "El grupo pro-occidental es victorioso"
 singapore_elections.0.b: "El grupo emergente es victorioso"
 singapore_elections.0.c: "El grupo no alineado es victorioso"
 singapore_elections.0.d: "Elecciones concluidas"
 LEE_HSIEN_LOONG_DESC: "Lee Hsien Loong, el actual Primer Ministro de Singapur, ha desempeñado un papel fundamental en la configuración de la trayectoria de la nación desde que asumió el cargo en 2004. Miembro destacado del Partido de Acción Popular (PAP), su liderazgo se ha caracterizado por un enfoque en la diversificación económica, la innovación tecnológica y la cohesión social. Su administración también ha priorizado la sostenibilidad a largo plazo, abordando el cambio climático y promoviendo la inclusión social. El énfasis de Lee en las políticas pragmáticas y su compromiso con el mantenimiento de la estabilidad de Singapur han sido fundamentales para afrontar desafíos regionales y globales complejos. Sigue guiando a Singapur a través de las complejidades del siglo XXI, centrándose en el crecimiento económico, el progreso social y la seguridad nacional. Su legado como líder de Singapur aún se está escribiendo, pero sus contribuciones al desarrollo económico y social de la nación son innegables."
 LAWRENCE_WONG_DESC: "Lawrence Wong, último Primer Ministro. Su liderazgo se caracteriza por un enfoque pragmático de la gobernanza, que equilibra el crecimiento económico con el bienestar social. Aboga por la innovación tecnológica, reconociendo su potencial para impulsar a Singapur a nuevas alturas. El enfoque de Wong va más allá de la economía; prioriza la armonía social y la inclusión, garantizando que todos los singapurenses se beneficien del progreso nacional. Sus políticas reflejan un compromiso con el desarrollo sostenible, garantizando la prosperidad de Singapur para las generaciones futuras. Fomenta la colaboración, forjando alianzas sólidas tanto a nivel nacional como internacional. La visión de Wong es la de un Singapur resiliente y próspero, una nación que acepta el cambio preservando sus valores fundamentales. Su liderazgo inspira confianza, posicionando a Singapur como un modelo de estabilidad y progreso en un mundo dinámico. Es un defensor de la movilidad social, garantizando oportunidades para todos. Su claro estilo de comunicación fomenta la transparencia y la confianza, uniendo a la nación en torno a una visión compartida para un futuro mejor. Bajo su liderazgo, Singapur continúa su camino como líder mundial, abrazando la innovación y esforzándose por alcanzar la excelencia en todos los aspectos de la vida nacional. Es un líder visionario que guía a Singapur hacia un futuro de crecimiento sostenible y prosperidad duradera."
 SIN_education_efforts: "Esfuerzo educativo"
 SIN_education_efforts_desc: "El sistema educativo de Singapur es líder mundial, reconocido por sus rigurosos estándares y énfasis en la innovación. Desde la educación infantil hasta las instituciones terciarias, el sistema prioriza la formación de una fuerza laboral altamente calificada y adaptable. La inversión continua en infraestructura y capacitación docente garantiza que el sistema se mantenga a la vanguardia de la innovación, adaptándose a las necesidades cambiantes de la economía del siglo XXI. Este enfoque holístico garantiza que Singapur se mantenga a la vanguardia de la excelencia educativa, logrando constantemente las mejores clasificaciones a nivel mundial."
 gateway_to_asia: "Puerta de entrada a Asia"
 gateway_to_asia_desc: "The strategic location of the city-state at the straits of Malacca quantifies the nation's influence globally. Trade from East to West passes by this important juncture, and many thousand companies have their regional headquarters in the city.\n\nThe business-friendly environment and excellent location make Singapore punch well above its own weight."
 SIN_lee_kuan_yew_legacy: "El legado de Lee Kuan Yew"
 SIN_lee_kuan_yew_legacy_desc: "El liderazgo visionario de Lee Kuan Yew transformó a Singapur en una nación moderna. Mediante políticas económicas pragmáticas, impulsó un crecimiento sin precedentes y consolidó a Singapur como un centro financiero global. Su compromiso con el bienestar social garantizó viviendas asequibles y atención médica de calidad, al tiempo que fomentó una fuerte identidad nacional. Las inversiones estratégicas en educación y tecnología cultivaron una fuerza laboral altamente calificada, impulsando el avance tecnológico de Singapur. El legado de Lee Kuan Yew es testimonio de su planificación magistral y su inquebrantable dedicación a la construcción de la nación, dejando una marca indeleble en el desarrollo y la prosperidad de Singapur."
 SIN_temasek_holdings: "Temasek Holdings"
 SIN_temasek_holdings_desc: "Temasek Holdings (Private) Limited es una empresa de inversión multinacional de propiedad estatal de Singapur. Fundado el 25 de junio de 1974, opera como accionista e inversor activo, guiado por cuatro tendencias estructurales clave en la construcción de su cartera a largo plazo: digitalización, vida sostenible, futuro del consumo y vidas más largas. La diversa cartera de Temasek abarca múltiples sectores, con especial atención a los de consumo, medios y tecnología, ciencias biológicas y agroalimentación, y servicios financieros no bancarios."
 SIN_reform_singapore_urban_redevelopment_authority_idea: "Autoridad de Reurbanización Urbana de Singapur"
 SIN_reform_singapore_urban_redevelopment_authority_idea_desc: "La Autoridad de Reurbanización Urbana (ARU) ha sido fundamental en la transformación de Singapur en una metrópolis vibrante y moderna. Como agencia gubernamental fundamental, ARU ejerce una autoridad significativa sobre la planificación del uso de la tierra, las estrategias de desarrollo y el crecimiento sostenible en toda la nación insular. Su mandato integral abarca todos los aspectos de la gestión de la tierra, incluido el desarrollo estratégico de las áreas recuperadas para convertirlas en comunidades prósperas. A través de su compromiso con la sostenibilidad y la participación comunitaria, ARU continúa impulsando la notable historia de éxito urbano de Singapur."
 SIN_singapore_masterplan_idea: "Plan Maestro de Singapur"
 SIN_singapore_masterplan_idea_desc: "La influencia del Plan Maestro de Singapur permea cada faceta del paisaje urbano de la ciudad-estado, desde su red de transporte público de clase mundial hasta sus frondosos espacios verdes. Este plan integral sirve como piedra angular del desarrollo sostenible de Singapur y orienta las decisiones estratégicas sobre el uso de la tierra, la infraestructura y el diseño urbano. Gracias a su enfoque vanguardista, el Plan Maestro garantiza que Singapur mantenga su condición de ejemplo mundial de excelencia urbana y de ciudad vibrante y habitable para las generaciones futuras."
 gateway_to_asia_income: "Additional Income: $$§G[?gateway_to_asia_income|+3]§!, scaling with world GDP"
 temasek_dividend_income: "Ingresos por dividendos de Temasek: $§G0.250§!"
 singapore_military: "Ejército de Singapur"
 singapore_military_desc: "El ejército de Singapur representa una formidable fuerza de defensa, que combina una poderosa Armada, un Ejército tecnológicamente avanzado y una Fuerza Aérea competente. Las agencias de inteligencia del país proporcionan información estratégica vital que salvaguarda la seguridad nacional. Las inversiones estratégicas en tecnología satelital basada en el espacio fortalecen aún más las capacidades de vigilancia y comunicación, ampliando el alcance de defensa de Singapur hacia el futuro. Esta fuerza integral y tecnológicamente sofisticada garantiza la soberanía y la seguridad de la nación en medio de un entorno geopolítico cada vez más complejo."
 SIN_unlocks_balance_of_power_tt: "Desbloquea la mecánica §YBalance de poder§!, $SIN_power_balance$.\n"
 SIN_renewable_energy: "Esfuerzo en Energía Renovable"
 SIN_renewable_energy_desc: "Singapur, una nación reconocida por su visión de futuro, está logrando avances significativos en materia de energía renovable. Frente al doble desafío de satisfacer sus demandas energéticas y mitigar el cambio climático, el estado insular está buscando activamente una combinación energética diversificada. La energía solar está a la vanguardia, y los parques solares a gran escala y las instalaciones en tejados se están volviendo cada vez más comunes. El gobierno está invirtiendo fuertemente en investigación y desarrollo, explorando tecnologías innovadoras como paneles solares flotantes y soluciones de almacenamiento de energía. Además de la energía solar, Singapur también está investigando otras fuentes renovables, incluida la energía geotérmica, y explorando asociaciones regionales para aprovechar los recursos hidroeléctricos. Si bien aún existen desafíos, el compromiso de Singapur con la sustentabilidad es evidente en sus ambiciosos objetivos de energía renovable y su dedicación a crear un futuro más limpio y verde para las generaciones venideras. Este compromiso no es simplemente una respuesta a las presiones globales; es un imperativo estratégico para la seguridad económica y ambiental de Singapur a largo plazo."
 SIN_aapowerlink: "Australia Asia Power Link"
 SIN_aapowerlink_desc: "El Australia Asia Power Link (AAPowerLink) es un proyecto de infraestructura eléctrica que se prevé que incluya la planta solar más grande del mundo, la batería más grande del mundo y el cable eléctrico submarino más largo del mundo. Los planes iniciales prevén que un nuevo parque solar en el Territorio del Norte de Australia produciría hasta 20 gigavatios de electricidad, la mayoría de la cual se exportaría a Singapur y, más adelante, a Indonesia, mediante una línea de transmisión HVDC de 3 GW y 4.300 km (2.700 mi). Una batería de gran tamaño almacenaría energía para equilibrar la disponibilidad energética a medida que la luz solar varía a lo largo del día. AAPowerLink fue desarrollado por la empresa australiana Sun Cable, inicialmente respaldada por Andrew Forrest y Mike Cannon-Brookes."
 SIN_EDU_education_effort: "Esfuerzo educativo"
 SIN_EDU_education_effort_desc: "El sistema educativo de Singapur es líder mundial, reconocido por sus rigurosos estándares y énfasis en la innovación. Desde la educación infantil hasta las instituciones terciarias, el sistema prioriza la formación de una fuerza laboral altamente calificada y adaptable. La inversión continua en infraestructura y capacitación docente garantiza que el sistema se mantenga a la vanguardia de la innovación, adaptándose a las necesidades cambiantes de la economía del siglo XXI. Este enfoque holístico garantiza que Singapur se mantenga a la vanguardia de la excelencia educativa, logrando constantemente las mejores clasificaciones a nivel mundial."
 SIN_EDU_nanyang_technological_university: "Universidad Tecnológica de Nanyang (NTU)"
 SIN_EDU_nanyang_technological_university_desc: "La Universidad Tecnológica de Nanyang (NTU) es otra universidad líder de Singapur, conocida por su investigación de vanguardia y sus sólidas alianzas con la industria. Su enfoque en la innovación y la tecnología ha dado lugar a numerosos avances y contribuciones en diversos sectores. El compromiso de la NTU con la sostenibilidad y el vibrante entorno de su campus lo convierten en un destino deseable para estudiantes e investigadores de todo el mundo."
 SIN_EDU_university_patent_and_journal: "Financiar la investigación universitaria"
 SIN_EDU_university_patent_and_journal_desc: "La financiación de la investigación en patentes y revistas universitarias es crucial para impulsar la innovación y el crecimiento económico. La inversión en investigación no solo genera descubrimientos revolucionarios, sino que también fomenta una cultura de curiosidad intelectual y colaboración. Esta financiación garantiza que Singapur se mantenga competitivo a nivel mundial y atraiga a investigadores y talentos de primer nivel. Las patentes y publicaciones resultantes contribuyen significativamente al progreso nacional."
 SIN_EDU_south_east_asia_education_center: "Centro de Educación de la ASEAN"
 SIN_EDU_south_east_asia_education_center_desc: "Singapur aspira a ser un centro educativo líder para la región de la ASEAN, ofreciendo oportunidades de educación y capacitación de alta calidad a estudiantes de todo el sudeste asiático. Esta iniciativa fomenta la colaboración regional y fortalece el capital humano de toda la región. Al brindar acceso a una educación de primer nivel, Singapur busca contribuir al desarrollo y la prosperidad general de los países de la ASEAN."
 SIN_singapore_armed_forces: "Ejército de Singapur"
 SIN_singapore_armed_forces_desc: "El ejército de Singapur se transforma constantemente para mantenerse como una fuerza de defensa altamente eficaz y relevante. Adaptándose a las amenazas cambiantes y a los avances tecnológicos, las Fuerzas Armadas de Singapur modernizan continuamente su equipo, entrenamiento y estrategias. Este compromiso con la innovación garantiza que las fuerzas armadas de Singapur sigan siendo un escudo potente y adaptable, que protege la seguridad nacional en un panorama global en constante cambio. Desde armamento avanzado hasta sofisticadas capacidades de guerra cibernética, la dedicación de las Fuerzas Armadas de Singapur a la modernización garantiza su continua eficacia en la protección de los intereses de la nación."
 SIN_navy: "Armada de la República de Singapur (ARS)"
 SIN_navy_desc: "Just like our land forces, our Navy's main objective is also to defend the coasts of Singapore. Our naval doctrine therefore should be built upon smaller vessels to have a better chance of protecting our coastline."
 SIN_navy_corvettes: "Corbetas"
 SIN_navy_corvettes_desc: "Las corbetas modernas son buques de guerra ágiles y tecnológicamente avanzados, equipados con sensores y armamento avanzados, lo que garantiza el dominio marítimo ante amenazas cambiantes. Son cruciales para la defensa costera y la proyección de poder."
 SIN_navy_frigate: "Fragatas"
 SIN_navy_frigate_desc: "Las fragatas representan un avance significativo en el poder naval, al incorporar sofisticadas capacidades antisubmarinas y antiaéreas. Su versatilidad y mayor potencia de fuego son vitales para mantener una sólida presencia naval y salvaguardar los intereses nacionales."
 SIN_navy_carrier: "Portaaviones"
 SIN_navy_carrier_desc: "Los portaaviones son poderosos símbolos de la fuerza nacional, proporcionando una base aérea móvil capaz de desplegar una amplia gama de aeronaves tanto para operaciones ofensivas como defensivas. Su transformación refleja el compromiso de una nación con la proyección de poder global."
 SIN_navy_naval_exercise: "Ejercicio diario naval"
 SIN_navy_naval_exercise_desc: "Los rigurosos ejercicios navales diarios perfeccionan las habilidades de los marineros singapurenses, garantizando su máxima preparación para afrontar cualquier amenaza marítima. Estos ejercicios, que abarcan diversos escenarios, mantienen un alto nivel de competencia y preparación."
 SIN_navy_efficient_sailor: "Marinero eficaz"
 SIN_navy_efficient_sailor_desc: "El marinero singapurense eficaz está altamente capacitado, es adaptable y tiene un gran dominio de la tecnología. Sus habilidades, perfeccionadas mediante un riguroso entrenamiento y experiencia práctica, son cruciales para defender los intereses marítimos de Singapur."
 SIN_army: "Fuerzas Armadas de Singapur (SAF)"
 SIN_army_desc: "Una gran pregunta sigue en la mente de la gente: ¿deberíamos transformar nuestras fuerzas armadas en un ejército pequeño, moderno y profesional, o necesitamos ampliar nuestro personal militar para alcanzar el tamaño de nuestros vecinos?"
 SIN_army_military_resilience: "Resiliencia militar"
 SIN_army_military_resilience_desc: "La resiliencia militar de Singapur se basa en su personal altamente capacitado, tecnología avanzada y estrategias adaptables. Esto garantiza la capacidad de la nación para resistir y superar cualquier amenaza a su soberanía."
 SIN_army_army_daily_activity: "Actividad diaria del ejército"
 SIN_army_army_daily_activity_desc: "La jornada de un soldado singapurense implica un intenso entrenamiento físico, manejo de armas, ejercicios tácticos y simulacros. Esta preparación constante garantiza la preparación del ejército para defenderse de cualquier invasión terrestre."
 SIN_army_foreign_intervention: "Intervención extranjera"
 SIN_army_foreign_intervention_desc: "La estrategia de defensa de Singapur incorpora sólidas alianzas y asociaciones, lo que permite respuestas eficaces a las amenazas externas. La colaboración con países amigos fortalece su capacidad para abordar los desafíos de seguridad regional."
 SIN_army_expand_special_operation_force: "Ampliar la Fuerza de Operaciones Especiales (FOE)"
 SIN_army_expand_special_operation_force_desc: "La expansión de la Fuerza de Operaciones Especiales es clave para la estrategia de defensa de Singapur. Las capacidades únicas de la FOE permiten acciones precisas y decisivas contra amenazas asimétricas, protegiendo así los intereses nacionales."
 SIN_air_force: "Fuerza Aérea de Singapur (RSAF)"
 SIN_air_force_desc: "After expansion of our Tank and Mechanized forces we now have the capacity to upgrade our old aircraft and produce our new domestic variants to better suit our needs."
 SIN_air_force_helicopter: "Helicóptero"
 SIN_air_force_helicopter_desc: "Los helicópteros modernos son plataformas versátiles que se utilizan para diversas funciones, desde el transporte de tropas y la búsqueda y rescate hasta la guerra antisubmarina. Su versatilidad y capacidades avanzadas son cruciales para las operaciones militares modernas."
 SIN_air_force_fighter: "Aviones de combate"
 SIN_air_force_fighter_desc: "La tecnología furtiva, los sensores avanzados y la mayor maniobrabilidad son características distintivas de los aviones de combate modernos, que proporcionan superioridad aérea y garantizan una defensa eficaz contra amenazas aéreas. Su velocidad y precisión son vitales para la defensa nacional."
 SIN_air_force_drone: "Dron"
 SIN_air_force_drone_desc: "Los drones están transformando la guerra gracias a su versatilidad, asequibilidad y avanzadas capacidades de vigilancia. Su uso para reconocimiento, vigilancia y ataques selectivos los convierte en un recurso invaluable para los ejércitos modernos."
 SIN_air_force_pilot_daily_exercise: "Ejercicio diario del piloto"
 SIN_air_force_pilot_daily_exercise_desc: "Las simulaciones de vuelo diarias y el riguroso entrenamiento mantienen a los pilotos de la Fuerza Aérea de Singapur en su máximo rendimiento. Estos ejercicios los preparan para diversos escenarios, garantizando la superioridad aérea sobre el espacio aéreo de Singapur."
 SIN_air_force_efficient_pilot: "Piloto Eficiente"
 SIN_air_force_efficient_pilot_desc: "Los pilotos de la Fuerza Aérea de Singapur son altamente eficientes y manejan con maestría aeronaves y armamento avanzados. Su precisión y habilidad son esenciales para proteger el espacio aéreo de Singapur y proyectar su poderío."
 SIN_air_force_pilot_fast_learner: "Piloto de aprendizaje rápido"
 SIN_air_force_pilot_fast_learner_desc: "La capacidad de adaptarse rápidamente a nuevas tecnologías y tácticas es crucial para los pilotos de la Fuerza Aérea de Singapur. Esto les garantiza mantenerse a la vanguardia del combate aéreo y mantener la superioridad aérea."
 SIN_air_force_malacca_traits_air_superiority: "Superioridad aérea de Malaca"
 SIN_air_force_malacca_traits_air_superiority_desc: "Mantener la superioridad aérea en la región del Estrecho de Malaca es fundamental para la defensa de Singapur. Aviones de combate avanzados y robustos sistemas de defensa aérea son cruciales para proteger las rutas marítimas vitales y los intereses nacionales."
 SIN_SID_intelligence: "Seguridad e Inteligencia (SID)"
 SIN_SID_intelligence_desc: "Las agencias de Seguridad e Inteligencia de Singapur operan a la vanguardia de la seguridad nacional, empleando tecnología de vanguardia y agentes altamente calificados para contrarrestar las amenazas y salvaguardar los intereses nacionales. Su vigilancia es crucial para mantener la estabilidad y proteger la soberanía de Singapur."
 SIN_SID_overseas_operation: "Operativo en el extranjero"
 SIN_SID_overseas_operation_desc: "Los agentes de Singapur en el extranjero son profesionales altamente capacitados que operan discretamente en todo el mundo, recopilando inteligencia vital y manteniendo una vigilancia vigilante sobre las amenazas potenciales a la nación."
 SIN_SID_intelligent_agile_transformation: "Transformación ágil inteligente"
 SIN_SID_intelligent_agile_transformation_desc: "La comunidad de inteligencia de Singapur adopta una transformación ágil, adaptándose rápidamente a las amenazas en constante evolución y a los avances tecnológicos. Este enfoque dinámico garantiza que las capacidades de inteligencia del país se mantengan a la vanguardia de la seguridad global."
 SIN_SSA_space_agency: "Agencia Espacial de Singapur (SSA)"
 SIN_SSA_space_agency_desc: "La Agencia Espacial de Singapur (SSA) lidera el avance de Singapur en tecnología espacial, impulsando la innovación y desarrollando capacidades para la seguridad nacional y el crecimiento económico. Sus esfuerzos son vitales para asegurar el futuro de Singapur."
 SIN_SSA_satellite_imagery: "Utilización de imágenes satelitales"
 SIN_SSA_satellite_imagery_desc: "Singapur aprovecha las imágenes satelitales para mejorar sus capacidades de inteligencia, proporcionando información en tiempo real para la planificación estratégica, la vigilancia de la seguridad y la respuesta ante desastres. Esta tecnología ofrece una ventaja crucial en un mundo dinámico."
 SIN_SSA_space_technology_effort: "Esfuerzo de desarrollo espacial"
 SIN_SSA_space_technology_effort_desc: "La inversión continua de Singapur en el desarrollo espacial fortalece su infraestructura de inteligencia, lo que le proporciona una ventaja crucial en vigilancia, comunicación y planificación estratégica. Este esfuerzo es vital para la seguridad nacional y la estabilidad regional."
 SIN_nuclear_weapon_for_defence: "Defence Nuclear Weapon"
 SIN_nuclear_weapon_for_defence_desc: "Si bien defendemos la paz, nuestro compromiso con nuestra soberanía es inquebrantable. El posible despliegue de una fuerza disuasoria nuclear no se trata de agresión; se trata de asegurar nuestra supervivencia. Es un escudo, no una espada, una declaración contundente para cualquier nación que contemple una agresión contra nuestra isla natal. El coste de atacar Singapur sería demasiado alto. Nuestra defensa es nuestro compromiso con nuestro pueblo, nuestro futuro y nuestra independencia. Estamos preparados para defender nuestra nación. Nuestro compromiso con la paz solo es comparable a nuestra determinación de protegernos a nosotros mismos y a nuestro futuro. Esto no es una amenaza, es una promesa."
 SIN_reform_singapore_urban_redevelopment_authority: "Autoridad de Reurbanización Urbana (URA)"
 SIN_reform_singapore_urban_redevelopment_authority_desc: "Autoridad de Reurbanización Urbana de Singapur (URA): Forjando el futuro. La URA impulsa el desarrollo urbano sostenible, garantizando la prosperidad a largo plazo de Singapur mediante la planificación estratégica del uso del suelo y el desarrollo de infraestructura. Un enfoque con visión de futuro para un futuro próspero."
 SIN_economic_planning: "Planificación económica"
 SIN_economic_planning_desc: "La planificación económica de Singapur es un proceso dinámico centrado en el crecimiento sostenible y la prosperidad. Implica la asignación estratégica del uso del suelo para facilitar el desarrollo comercial, industrial y residencial. Esto incluye atraer inversiones extranjeras, fomentar la innovación y el espíritu emprendedor y desarrollar una fuerza laboral calificada para satisfacer las demandas de una economía moderna. El objetivo es crear una economía robusta y competitiva que ofrezca empleos de alta calidad y mejore el nivel de vida general."
 SIN_social_need_planning: "Planificación de necesidades sociales"
 SIN_social_need_planning_desc: "La planificación de necesidades sociales en Singapur prioriza el bienestar de sus ciudadanos. Esto abarca diversas iniciativas centradas en la educación, la atención médica, la vivienda y los sistemas de apoyo social. El uso estratégico del suelo garantiza la prestación de servicios y comodidades esenciales, creando comunidades vibrantes e inclusivas. El proceso de planificación considera factores como la demografía de la población, la accesibilidad y la asequibilidad para garantizar un acceso equitativo a los recursos y oportunidades para todos los residentes."
 SIN_environment_planning: "Planificación ambiental"
 SIN_environment_planning_desc: "La planificación ambiental en Singapur es crucial para mantener el paisaje verde y limpio del país. Implica una gestión cuidadosa del uso del suelo para equilibrar el desarrollo con la conservación del medio ambiente. Esto incluye la preservación de los hábitats naturales, la promoción de prácticas sostenibles y la inversión en infraestructura verde. El objetivo general es crear un entorno sostenible y resiliente que apoye la biodiversidad, mejore la calidad del aire y del agua y mejore la calidad de vida general de todos."
 SIN_singapore_masterplan: "Plan Maestro de Singapur"
 SIN_singapore_masterplan_desc: "La influencia del plan es evidente en todos los aspectos del paisaje urbano de Singapur, desde el eficiente sistema de transporte público hasta la abundancia de espacios verdes. Es un testimonio del compromiso de la nación con la visión a largo plazo y el desarrollo urbano sostenible, garantizando que Singapur siga siendo un faro de progreso y un modelo para las ciudades de todo el mundo."
 SIN_expand_changi_airport_area_phase1: "Ampliación del área del aeropuerto de Changi: fase 1"
 SIN_expand_changi_airport_area_phase1_desc: "El Aeropuerto Changi de Singapur, un centro de aviación global, ¡se está expandiendo!. La primera fase del ambicioso proyecto recupera terreno, ampliando el territorio de Singapur. Esta medida estratégica mejora la capacidad del aeropuerto, impulsando el comercio y el turismo, a la vez que aborda la escasez de terrenos del país. Es un testimonio del enfoque innovador de Singapur hacia el crecimiento y el desarrollo."
 SIN_expand_changi_airport_area_phase2: "Ampliación del área del aeropuerto de Changi: fase 2"
 SIN_expand_changi_airport_area_phase2_desc: "La fase 2 del proyecto de ampliación del área del aeropuerto de Changi es una iniciativa de Singapur para aumentar el espacio o terreno dentro del país. Este proyecto tiene como objetivo mejorar la capacidad y las instalaciones del aeropuerto, respaldar la creciente demanda de viajes aéreos y reforzar la posición de Singapur como un centro de aviación clave en la región."
 SIN_expand_changi_bay: "Expand Changi Bay"
 SIN_expand_changi_bay_desc: "El proyecto estratégico de recuperación de tierras de Singapur, Expand Changi Bay, ya está en marcha. Esta iniciativa aporta valiosos terrenos a la nación insular, creando interesantes oportunidades de desarrollo y crecimiento. El proyecto no sólo aborda la escasez de tierras de Singapur, sino que también promete abrir nuevas posibilidades de infraestructura, vivienda y expansión económica. Es un testimonio del enfoque innovador de Singapur para gestionar sus recursos y asegurar su futuro. ¡Un paso audaz hacia un futuro más prometedor!"
 SIN_ubin_island_development: "Desarrollo de la isla Ubin"
 SIN_ubin_island_development_desc: "Si bien no se trata estrictamente de una recuperación de tierras, el desarrollo de Pulau Ubin ofrece un enfoque único para ampliar el espacio utilizable de Singapur. Este proyecto se centra en el desarrollo sostenible, equilibrando la preservación de la belleza natural de la isla con la creación de nuevas áreas recreativas e infraestructura. Es un testimonio del compromiso de Singapur con la sostenibilidad ambiental junto con el desarrollo urbano, ofreciendo un modelo diferente de expansión que prioriza tanto la naturaleza como el progreso."
 SIN_long_island_coastal_defence: "Defensa Costera de Long Island"
 SIN_long_island_coastal_defence_desc: "La iniciativa de Defensa Costera de Long Island de Singapur tiene como objetivo recuperar 800 hectáreas de tierra frente al Parque de la Costa Este. Este proyecto estratégico no solo mejora la protección costera contra el aumento del nivel del mar, sino que también crea nuevas oportunidades para el desarrollo residencial y recreativo. ¡Un paso audaz hacia un futuro sostenible y resiliente!"
 SIN_tekong_island_expansion: "Expansión de la isla de Tekong"
 SIN_tekong_island_expansion_desc: "El proyecto de expansión de la isla Tekong de Singapur es una iniciativa importante que recupera tierras para abordar las limitaciones de espacio del país. Esta medida estratégica no sólo aumenta el tamaño de la isla, sino que también libera potencial para diversos desarrollos, contribuyendo al crecimiento general y a las oportunidades económicas de Singapur. Es un testimonio del enfoque innovador de Singapur en la gestión de la tierra y su compromiso de garantizar un futuro próspero."
 SIN_reclamation_sanyongkong_island: "Reclamación de la isla de Sanyongkong"
 SIN_reclamation_sanyongkong_island_desc: "El proyecto estratégico de recuperación de tierras de Singapur en la isla Sanyongkong está en marcha, añadiendo tierras valiosas a la nación insular. Esta iniciativa crea oportunidades interesantes para el desarrollo y el crecimiento, abordando la escasez de tierras de Singapur y abriendo nuevas posibilidades para la infraestructura, la vivienda y la expansión económica. Es un testimonio del enfoque innovador de Singapur para gestionar sus recursos y asegurar su futuro. ¡Un paso audaz hacia un futuro más prometedor!"
 SIN_tekong_kechil_island_development: "Desarrollo de la isla Tekong Kechil"
 SIN_tekong_kechil_island_development_desc: "La expansión de la isla de Tekong es más que una mera recuperación de tierras; es una inversión estratégica en el futuro de Singapur. Este ambicioso proyecto aborda la escasez de tierras del país y al mismo tiempo crea oportunidades para el crecimiento y el desarrollo económico. Al aumentar el tamaño de la isla, Singapur asegura tierras valiosas para diversos propósitos, fortaleciendo aún más su posición como centro global líder."
 SIN_tekong_island_development: "Desarrollo de la isla de Tekong"
 SIN_tekong_island_development_desc: "La expansión de la isla de Tekong por parte de Singapur representa una visión audaz de futuro. Este proyecto estratégico no se trata solo de añadir terreno, sino de crear nuevas posibilidades. El aumento de la superficie terrestre abre las puertas a diversos desarrollos, contribuyendo al crecimiento económico de Singapur y mejorando su infraestructura. Es un testimonio del enfoque innovador de Singapur en la gestión de recursos y su compromiso inquebrantable con el progreso."
 SIN_sajahat_island_reclamation: "Reclamación de la isla Sajahat"
 SIN_sajahat_island_reclamation_desc: "El proyecto estratégico de recuperación de tierras de Singapur en la isla Sajahat está en marcha, añadiendo tierras valiosas a la nación insular. Esta iniciativa crea oportunidades interesantes para el desarrollo y el crecimiento, abordando la escasez de tierras de Singapur y abriendo nuevas posibilidades para la infraestructura, la vivienda y la expansión económica. Es un testimonio del enfoque innovador de Singapur para gestionar sus recursos y asegurar su futuro."
 SIN_psa_pasir_panjang_terminal_devlopment: "Desarrollo de la terminal PSA Pasir Panjang"
 SIN_psa_pasir_panjang_terminal_devlopment_desc: "El desarrollo de la terminal PSA Pasir Panjang está transformando la infraestructura portuaria de Singapur, creando una puerta de entrada más eficiente y sólida para el comercio global. Esta ampliación aumenta significativamente la capacidad, pudiendo manejar buques de mayor tamaño y mayores volúmenes de carga. Se trata de una inversión estratégica que subraya el compromiso de Singapur de mantener su posición como centro marítimo líder, impulsar el crecimiento económico y asegurar su futuro como centro de comercio global."
 SIN_jurong_island_reclamation_project: "Proyecto de recuperación de la isla Jurong"
 SIN_jurong_island_reclamation_project_desc: "El Proyecto de Recuperación de la Isla Jurong de Singapur es una iniciativa estratégica para ampliar la capacidad de la isla como centro petroquímico mundial. Esta expansión proporciona un espacio crucial para nuevas instalaciones e infraestructura, impulsando el crecimiento de la industria y fortaleciendo la posición de Singapur como líder en el sector. Es un testimonio del enfoque progresista de Singapur hacia el desarrollo económico y su compromiso de asegurar su futuro como un actor importante en el mercado energético mundial."
 SIN_psa_pasir_panjang_terminal_devlopment_phase_2: "Fase 2 de desarrollo de la terminal PSA Pasir Panjang"
 SIN_psa_pasir_panjang_terminal_devlopment_phase_2_desc: "El desarrollo de la terminal PSA Pasir Panjang de Singapur es una audaz declaración de intenciones. Esta ambiciosa expansión no se limita a aumentar la capacidad, sino que busca asegurar el futuro de Singapur como un importante centro marítimo mundial. Al invertir en infraestructura de última generación, Singapur refuerza su posición como actor fundamental en el comercio internacional, impulsando la prosperidad económica y asegurando su éxito continuo en el escenario mundial."
 SIN_jurong_island_development_project: "Proyecto de desarrollo de la isla Jurong"
 SIN_jurong_island_development_project_desc: "El Proyecto de Desarrollo de la Isla Jurong de Singapur es una iniciativa estratégica que transformará la isla en una potencia mundial de las industrias petroquímica y química. Este ambicioso proyecto amplía la superficie terrestre y crea un centro vibrante para la fabricación, la investigación y la innovación. Es un paso audaz para asegurar el futuro económico de Singapur y fortalecer su posición como actor líder en el mercado global. No se trata solo de desarrollo territorial; se trata de construcción nacional."
 SIN_semakau_island_reclamation_project: "Proyecto de recuperación de la isla Semakau"
 SIN_semakau_island_reclamation_project_desc: "El proyecto estratégico de recuperación de tierras de Singapur en la isla Semakau está en marcha, añadiendo tierras valiosas a la nación insular. Esta iniciativa crea oportunidades interesantes para el desarrollo y el crecimiento, abordando la escasez de tierras de Singapur y abriendo nuevas posibilidades para la infraestructura, la vivienda y la expansión económica."
 SIN_tuas_reclamation_project_phase_1: "Proyecto de recuperación de Tuas: fase 1"
 SIN_tuas_reclamation_project_phase_1_desc: "La fase 1 del Proyecto de Recuperación de Tuas de Singapur está en marcha, ampliando la superficie del país y creando una plataforma para el crecimiento futuro. Esta iniciativa estratégica creará nuevas oportunidades en diversos sectores, abordando las limitaciones de tierra y fomentando el desarrollo económico."
 SIN_tuas_dock_development_project_phase_1: "Proyecto de desarrollo del muelle de Tuas: fase 1"
 SIN_tuas_dock_development_project_phase_1_desc: "La primera fase del proyecto de desarrollo del muelle de Tuas está transformando la infraestructura portuaria de Singapur, creando una puerta de entrada más grande y eficiente para el comercio mundial. Esta ambiciosa expansión aumenta significativamente la capacidad, permitiendo el manejo de buques de mayor tamaño y mayores volúmenes de carga."
 SIN_tuas_reclamation_project_phase_2: "Proyecto de recuperación de Tuas: fase 2"
 SIN_tuas_reclamation_project_phase_2_desc: "El Proyecto de Recuperación de Tuas de Singapur: fase 2, es más que una mera expansión de tierras; es una base para el crecimiento futuro. Este ambicioso proyecto está creando tierras valiosas para infraestructura vital, impulsando oportunidades económicas y asegurando el futuro de Singapur."
 singapore.128.t: "Lee Hsien Loong dimite"
 singapore.128.d: "Tras casi dos décadas al mando, el primer ministro de Singapur, Lee Hsien Loong, está a punto de dimitir. Su mandato, marcado por el crecimiento económico, el progreso social y la estabilidad del país en el escenario internacional, llega a su fin. Esta transición marca un momento significativo en la historia de Singapur, mientras la nación se prepara para una nueva era de liderazgo. El legado de Lee será sin duda objeto de amplio análisis y debate durante los próximos años y dará forma a la narrativa de la trayectoria futura de Singapur. Si bien su partida marca el final de una era, también señala el comienzo de un nuevo capítulo, mostrando el sólido sistema de gobierno y planificación de la sucesión de Singapur. La nación espera una transición sin problemas y un progreso continuo bajo su nuevo liderazgo."
 singapore.128.a: "Otro gran líder se retira"
 SIN_power_balance: "§YInterés nacional de Singapur§!"
 SIN_power_balance_desc: "Singapore's national interest is a complex interplay between Singapore First and global engagement. While the nation prioritizes its citizens' well-being and economic stability, a core tenet of the Singapore First policy, it also recognizes the importance of international collaboration and influence. This approach isn't about Singapore World Dominance, but rather a strategic balancing act. Singapore leverages its economic strength and geopolitical position to secure its interests on the world stage, ultimately aiming to create a stable and prosperous environment both domestically and internationally. This nuanced approach ensures the long-term security and prosperity of the nation."
 SIN_external_focus_left_side: "§CDominio mundial de Singapur§!"
 SIN_external_focus_left_side_desc: "Singapore, a nation brimming with ambition, punches far above its weight on the world stage. Its economic prowess is undeniable, a thriving hub of finance and trade. Diplomatically, it navigates complex geopolitical waters with deft precision, fostering strong relationships across the globe. While not a military giant, Singapore's strategic defense approach ensures its security and stability, contributing to regional peace. Its commitment to innovation, education, and sustainability solidifies its position as a global leader, influencing policy and shaping the future. Singapore's influence isn't just felt. It's respected, admired, and emulated."
 SIN_internal_focus_right_side: "§2Singapore First§!"
 SIN_internal_focus_right_desc: "Singapur, una nación conocida por su visión de futuro, prioriza el desarrollo interno para garantizar un futuro seguro y próspero. La educación es fundamental, fomentando una fuerza laboral altamente cualificada e impulsando la innovación. La seguridad alimentaria es un objetivo fundamental, garantizando la autosuficiencia y la resiliencia. Se adoptan los avances tecnológicos, lo que sitúa a Singapur a la vanguardia de la innovación. La nación también prioriza la resiliencia ante las influencias externas, salvaguardando sus valores e intereses. Y, por supuesto, la defensa nacional sigue siendo una prioridad absoluta, garantizando la seguridad de sus ciudadanos. El compromiso de Singapur con estos pilares internos sienta las bases para un futuro fuerte y sostenible, un futuro en el que Singapur siga prosperando y contribuyendo al mundo."
 SIN_mid_range: "Interés equilibrado"
 SIN_mid_range_desc: "§gSingapore's success story is a testament to its ability to deftly balance competing priorities. The 'Singapore First' policy, prioritizing internal strength through education, technological advancement, and robust national defense, isn't mutually exclusive with its ambition for global influence. Instead, a strong internal foundation of economic prosperity, social stability, and technological innovation fuels Singapore's ability to project its influence on the world stage. This balanced approach ensures that external ambitions are underpinned by a secure and resilient nation, allowing Singapore to pursue its global interests effectively while safeguarding its own. It's a strategy of calculated risk and well-placed investments, showcasing a pragmatic approach to both national and international goals.§!"
 SIN_phase1_left_side_range: "§CDominio del estrecho de Malaca§!"
 SIN_phase1_left_side_range_desc: "§gSingapore establishes itself as the critical maritime hub in Southeast Asia by commanding influence over the Malacca Straits, one of the world's busiest shipping lanes. Through strategic port operations, maritime security, and trade facilitation, Singapore lays the foundation for regional control and economic strength.§!"
 SIN_phase2_left_side_range: "§CDominio de la ASEAN§!"
 SIN_phase2_left_side_range_desc: "§gBasándose en su liderazgo marítimo, Singapur expande su influencia en toda la ASEAN a través de la integración económica, el liderazgo tecnológico y el compromiso diplomático. Al posicionarse como un nodo central en la cooperación del Sudeste Asiático, Singapur se convierte en una voz confiable y un tomador de decisiones clave en asuntos regionales.§!"
 SIN_phase3_left_side_range: "§CDominio asiático§!"
 SIN_phase3_left_side_range_desc: "§gSingapore steps onto the larger Asian stage by fostering strong ties with economic giants and emerging powers. Through innovation, financial services, and thought leadership, it becomes a bridge between East and West, a compact yet powerful influencer in shaping Asia's future.§!"
 SIN_phase4_left_side_range: "§CGran Dominio§!"
 SIN_phase4_left_side_range_desc: "§gAt this stage, Singapore is recognised as a major power despite its size, a city-state with global clout. It sets standards in digital governance, sustainability, and strategic foresight, participating in shaping major international frameworks and commanding respect across continents.§!"
 SIN_phase5_left_side_range: "§CDominio mundial§!"
 SIN_phase5_left_side_range_desc: "§gLa visión de Singapur culmina en convertirse en un líder mundial. A través de sus valores de excelencia, innovación e integridad, ejerce influencia y poder político en instituciones globales. Defiende las causas globales, marcando la pauta para la colaboración, la confianza y un liderazgo visionario en todo el mundo.§!"
 SIN_phase1_right_side_range: "§2Del pueblo para el pueblo de Singapur§!"
 SIN_phase1_right_side_range_desc: "§gEl camino de Singapur comienza con una base sólida arraigada en su gente. Las políticas se elaboran escuchando las necesidades de los ciudadanos, fomentando la confianza y la participación. Esta fase se centra en el desarrollo inclusivo, el acceso equitativo a las oportunidades y la construcción de una nación al servicio de todos los singapurenses, por los singapurenses.§!"
 SIN_phase2_right_side_range: "§2El orgullo de ser singapurense§!"
 SIN_phase2_right_side_range_desc: "§gSe fomenta una profunda identidad nacional donde cada ciudadano se siente orgulloso de ser singapurense. Se hace hincapié en los valores compartidos, la educación nacional y el orgullo cultural. Esta fase fortalece la resiliencia emocional, la unidad y el sentido de pertenencia para proteger el estilo de vida de Singapur desde dentro.§!"
 SIN_phase3_right_side_range: "§2La unión hace la fuerza§!"
 SIN_phase3_right_side_range_desc: "§gSingapur prospera cuando su gente se mantiene unida. Esta fase fortalece la cohesión social, conectando comunidades y fortaleciendo las redes de apoyo. Las inversiones en salud pública, educación y seguridad alimentaria garantizan que nadie quede atrás y aseguran una sociedad estable y preparada para enfrentar las crisis externas.§!"
 SIN_phase4_right_side_range: "§2Unidos en acción§!"
 SIN_phase4_right_side_range_desc: "§gSingapur se moviliza al unísono para afrontar los desafíos estratégicos. Desde la innovación tecnológica hasta la preparación para la defensa, cada ciudadano, sector e institución desempeña un papel. Esta fase prioriza la preparación nacional a través de políticas ágiles, cooperación público-privada y respuestas nacionales coordinadas a las presiones externas.§!"
 SIN_phase5_right_side_range: "§2Singapur primero§!"
 SIN_phase5_right_side_range_desc: "§gSingapore stands firm in its interests while engaging the world. National sovereignty, economic resilience, and security are protected at all costs. This phase ensures Singaporeans remain the top priority in decision-making, preserving the nation's independence, dignity, and continued success on the global stage.§!"
 SIN_BOP_promote_singapore_asian_value: "Promover el valor asiático de Singapur"
 SIN_BOP_promote_singapore_asian_value_desc: "Una campaña de diplomacia blanda para difundir el modelo de eficiencia burocrática y políticas públicas de Singapur."
 SIN_BOP_establish_asean_innovation_hub: "Establecer un centro de innovación de la ASEAN"
 SIN_BOP_establish_asean_innovation_hub_desc: "Convertir a Singapur en un centro de innovación e investigación tecnológica de la ASEAN para ampliar la influencia intelectual y económica."
 SIN_BOP_expand_global_diplomatic_footprint: "Expandir la presencia diplomática global"
 SIN_BOP_expand_global_diplomatic_footprint_desc: "Abrir más embajadas y consulados en África, Oriente Medio y América Latina para ampliar el alcance de la diplomacia."
 SIN_BOP_maintenance_no1_strongest_world_passport: "Mantenimiento del pasaporte más fuerte del mundo"
 SIN_BOP_maintenance_no1_strongest_world_passport_desc: "Mantener las relaciones y la diplomacia con todos los países para mantener el Pasaporte de Singapur como el pasaporte número uno más fuerte del mundo."
 SIN_BOP_found_singapore_strategic_investment_authority: "Fundar la Autoridad de Inversión Estratégica de Singapur (SSIA)"
 SIN_BOP_found_singapore_strategic_investment_authority_desc: "Aumentar la inversión extranjera a través del fondo soberano de riqueza para fortalecer su posición geopolítica."
 SIN_BOP_establish_singapore_armed_forces_training_partnerships: "Establecer alianzas para el entrenamiento de las Fuerzas Armadas de Singapur"
 SIN_BOP_establish_singapore_armed_forces_training_partnerships_desc: "Military training cooperation with friendly countries, such as the SAF program in Brunei and Taiwan."
 SIN_BOP_build_global_tech_corridor: "Construir un corredor tecnológico global"
 SIN_BOP_build_global_tech_corridor_desc: "Cooperación tecnológica con países desarrollados y en desarrollo para establecer el dominio digital."
 SIN_BOP_host_asia_global_security_summit: "Organizar la Cumbre de Seguridad Global de Asia"
 SIN_BOP_host_asia_global_security_summit_desc: "Posicionar a Singapur como anfitrión permanente de conferencias internacionales de seguridad."
 SIN_BOP_launch_smart_southeast_asia_initiative: "Lanzamiento de la iniciativa “Sudeste Asiático Inteligente”"
 SIN_BOP_launch_smart_southeast_asia_initiative_desc: "Suministrar infraestructura digital y de ciudades inteligentes a los países vecinos para fortalecer la influencia económica."
 SIN_BOP_initiate_maritime_silk_reconnect: "Iniciar la reconexión de la seda marítima"
 SIN_BOP_initiate_maritime_silk_reconnect_desc: "Convertir a Singapur en un importante centro de comercio marítimo en el Indo-Pacífico."
 SIN_BOP_fund_regional_think_tanks: "Financiar centros de investigación regionales"
 SIN_BOP_fund_regional_think_tanks_desc: "Financiar instituciones de investigación en otros países para moldear la opinión regional pro-Singapur."
 SIN_BOP_establish_singaporean_cultural_institutes_abroad: "Establecer institutos culturales singapurenses en el extranjero"
 SIN_BOP_establish_singaporean_cultural_institutes_abroad_desc: "Como el Goethe-Institut o el British Council, difundiendo los valores y la cultura singapurenses en el mundo."
 SIN_BOP_secure_overseas_port_access_agreements: "Acuerdos de acceso seguro a puertos extranjeros"
 SIN_BOP_secure_overseas_port_access_agreements_desc: "Firma de acuerdos estratégicos para el acceso logístico militar y civil en puertos de ultramar."
 SIN_BOP_launch_global_green_finance_diplomacy: "Lanzamiento de la Diplomacia Global de Finanzas Verdes"
 SIN_BOP_launch_global_green_finance_diplomacy_desc: "Aprovechar la posición de Singapur como centro de finanzas verdes para liderar los estándares ESG en Asia."
 SIN_BOP_singapore_citizenship_journey_program: "Programa de viaje hacia la ciudadanía de Singapur"
 SIN_BOP_singapore_citizenship_journey_program_desc: "Abrir oportunidades para que personas de otros países cambien legalmente su ciudadanía para convertirse en singapurenses"
 SIN_BOP_reclaim_throne_tiger_of_the_peninsula: "Reclama el Trono Tigre de la Península"
 SIN_BOP_reclaim_throne_tiger_of_the_peninsula_desc: "Una política proactiva de diplomacia regional con un enfoque estratégico, independiente y pragmático para dar forma a un nuevo orden asiático."
 SIN_BOP_gold_card_visas_for_billionaire_program: "Programa Visa Tarjeta Dorada para Multimillonarios"
 SIN_BOP_gold_card_visas_for_billionaire_program_desc: "Programa de visa de tarjeta dorada para multimillonarios que ofrece doble ciudadanía y abre oportunidades de inversión y potencial comercial en Singapur."
 SIN_BOP_overseas_intelligence_activity: "Impulsar la actividad de inteligencia en el extranjero"
 SIN_BOP_overseas_intelligence_activity_desc: "Para mantener la resiliencia del país frente a países con opiniones opuestas y poner en peligro a Singapur"
 SIN_BOP_promote_singapore_business_environment: "Promover el entorno empresarial de Singapur"
 SIN_BOP_promote_singapore_business_environment_desc: "Promover un entorno empresarial limpio y una burocracia clara en Singapur, libre de fraude y corrupción."
 SIN_BOP_scholarship_for_bachelor_master_and_doctoral_education: "Becas para estudios de licenciatura, maestría y doctorado"
 SIN_BOP_scholarship_for_bachelor_master_and_doctoral_education_desc: "Brindar acceso gratuito a educación avanzada para ingeniería y habilidades requeridas para futuros trabajos."
 SIN_BOP_national_skills_future_movement: "Movimiento Nacional de Habilidades Futuras"
 SIN_BOP_national_skills_future_movement_desc: "Inversión en formación profesional y aprendizaje permanente para la fuerza laboral nacional."
 SIN_BOP_enhance_cpf_and_housing_grants: "Mejorar el CPF y las subvenciones de vivienda"
 SIN_BOP_enhance_cpf_and_housing_grants_desc: "Aumentar los fondos de pensiones y los subsidios de vivienda para los ciudadanos."
 SIN_BOP_local_enterprise_growth_scheme: "Plan de Crecimiento de Empresas Locales"
 SIN_BOP_local_enterprise_growth_scheme_desc: "Iniciativa de apoyo para que las PYMES locales crezcan en el mercado nacional."
 SIN_BOP_boost_birth_rate_incentive_package: "Paquete de incentivos para aumentar la tasa de natalidad"
 SIN_BOP_boost_birth_rate_incentive_package_desc: "Incentivos financieros para familias jóvenes y prestaciones por hijo."
 SIN_BOP_green_singapore_movement: "Movimiento Verde Singapur"
 SIN_BOP_green_singapore_movement_desc: "Inversión en energía limpia, espacios verdes y políticas verdes nacionales."
 SIN_BOP_public_transport_excellence_scheme: "Plan de Excelencia en el Transporte Público"
 SIN_BOP_public_transport_excellence_scheme_desc: "Garantizar el acceso a Internet y a la tecnología para todos los grupos sociales."
 SIN_BOP_national_food_resilience_strategy: "Estrategia Nacional de Resiliencia Alimentaria"
 SIN_BOP_national_food_resilience_strategy_desc: "Diversificación de las fuentes alimentarias locales y seguridad de la cadena de suministro."
 SIN_BOP_cybersecurity_for_citizens_initiative: "Iniciativa de Ciberseguridad para los Ciudadanos"
 SIN_BOP_cybersecurity_for_citizens_initiative_desc: "Campaña de alfabetización digital y protección de datos personales."
 SIN_BOP_support_local_talent_first_act: "Apoyar el talento local: primer acto"
 SIN_BOP_support_local_talent_first_act_desc: "Una regulación que prioriza a los trabajadores locales en empleos estratégicos."
 SIN_BOP_singaporean_culture_preservation_fund: "Fondo para la Preservación de la Cultura de Singapur"
 SIN_BOP_singaporean_culture_preservation_fund_desc: "Apoyo a la cultura local y a las comunidades tradicionales en medio de la modernización."
 SIN_BOP_financial_wellness_national_campaign: "Campaña Nacional de Bienestar Financiero"
 SIN_BOP_financial_wellness_national_campaign_desc: "Programa de alfabetización financiera y gestión financiera para todos los ciudadanos"
 SIN_BOP_give_incentives_for_domestic_companies: "Dar incentivos a las empresas nacionales"
 SIN_BOP_give_incentives_for_domestic_companies_desc: "Proporcionar incentivos financieros para aumentar la productividad tiene un impacto en el aumento de los ingresos fiscales."
 SIN_BOP_fight_foreign_influence: "Combatir la Influencia Extranjera"
 SIN_BOP_fight_foreign_influence_desc: "Lucha contra las influencias extranjeras en el país que colonizan económicamente"
 SIN_BOP_masterplan_for_land_allocation: "Plan Maestro de Asignación de Tierras"
 SIN_BOP_masterplan_for_land_allocation_desc: "Aborda de frente la limitación de nuestros recursos territoriales. Prioriza el desarrollo sostenible de alta densidad, equilibrando los espacios residenciales, comerciales y verdes. El uso estratégico del suelo maximiza la eficiencia, garantizando una asignación óptima para el crecimiento futuro y preservando a la vez nuestro valioso patrimonio natural. Este plan es crucial para mantener la habitabilidad y la competitividad económica de Singapur."
 SIN_BOP_masterplan_for_civilian_industry_development: "Plan Maestro para el Desarrollo de la Industria Civil"
 SIN_BOP_masterplan_for_civilian_industry_development_desc: "Nos centramos en impulsar la innovación y las industrias de alto valor. Atrayendo estratégicamente la inversión extranjera y fomentando el talento local, buscamos crear una economía robusta y diversificada. Este plan apoya el crecimiento de sectores clave, promueve el avance tecnológico y garantiza que Singapur siga siendo un centro mundial de innovación y emprendimiento, incluso con una disponibilidad limitada de terrenos."
 SIN_BOP_masterplan_for_miliatary_industry_development: "Plan Maestro para el Desarrollo de la Industria Militar"
 SIN_BOP_masterplan_for_miliatary_industry_development_desc: "Prioriza la autosuficiencia y el avance tecnológico en defensa. Dada nuestra limitada disponibilidad de territorio, este plan se centra en la asignación eficiente de recursos y las alianzas estratégicas para garantizar nuestra seguridad nacional. Se trata de desarrollar tecnologías de vanguardia y fomentar una fuerza laboral calificada, garantizando que nuestras capacidades de defensa sigan siendo sólidas y adaptables a las amenazas futuras."
 SIN_BOP_masterplan_for_naval_yard_development: "Plan Maestro para el Desarrollo del Astillero Naval"
 SIN_BOP_masterplan_for_naval_yard_development_desc: "Aborda los desafíos del espacio limitado centrándose en una infraestructura eficiente y la innovación tecnológica. Este plan garantiza que nuestras capacidades navales se mantengan a la vanguardia, apoyando nuestra seguridad nacional e intereses marítimos. Implica una expansión y modernización estratégica, optimizando la utilización del espacio e incorporando prácticas sostenibles."
 SIN_BOP_masterplan_for_offices_development: "Plan Maestro para el Desarrollo de Oficinas"
 SIN_BOP_masterplan_for_offices_development_desc: "Aborda la necesidad de soluciones de espacio de trabajo eficientes y sostenibles dentro de nuestra limitada superficie. Este plan promueve desarrollos de alta densidad y uso mixto, integrando oficinas con zonas residenciales y comerciales. Prioriza las tecnologías de construcción inteligentes y las iniciativas ecológicas, creando entornos de trabajo vibrantes y productivos al tiempo que optimiza el uso de la tierra y promueve la sostenibilidad."
 SIN_singapore_problem: "Problema geográfico de Singapur"
 SIN_singapore_problem_desc: "Singapur enfrenta una serie de desafíos geográficos, incluida la falta de recursos naturales, la escasez de tierras, una crisis de agua y una escasez de viviendas para sus ciudadanos."
 singapore.76.t: "Compra de aeronaves estadounidenses"
 singapore.76.d: "Singapore has approached us looking to buy aircraft for their national defense."
 singapore.76.a: "Aceptar la compra"
 singapore.76.b: "Rechazar la compra"
 singapore.77.t: "Compra de Equipo Militar Estadounidense"
 singapore.77.d: "Singapur se ha acercado a nosotros buscando comprar diversas armas y armas pequeñas para su ejército."
 singapore.77.a: "Aceptar la compra"
 singapore.77.b: "Rechazar la compra"
 SIN_gold_market_standard: "Estándar del mercado del oro de Singapur"
 SIN_gold_market_standard_desc: "El Estándar del Mercado de Oro de Singapur (SGMS) garantiza la máxima calidad y pureza, garantizando la confianza del inversor. Con el respaldo de una infraestructura sofisticada y un sólido sistema legal, invertir en oro a través de Singapur ofrece seguridad y liquidez inigualables."
 SIN_army_infantry_equipment: "Equipamiento de Infantería"
 SIN_army_infantry_equipment_desc: "El equipo de infantería moderno prioriza el uso de material ligero, adaptable y tecnológicamente avanzado, lo que mejora la supervivencia y la eficacia en combate del soldado. Los materiales ligeros y los sistemas de comunicación avanzados mejoran la eficiencia operativa."
 SIN_neutrality_pressure_delayed_tt: "§YPrerrequisitos:§!\n[!reduce_foreign_pressure_click_enabled]\n§YEfectos:§!\n[!reduce_foreign_pressure_click]\n"
 SIN_tuas_business_area_development: "Desarrollo del área comercial de Tuas"
 SIN_tuas_business_area_development_desc: "Se trata de una visión estratégica de futuro. Este ambicioso proyecto amplía la capacidad industrial de Singapur, creando un centro moderno y eficiente para la logística y la manufactura. Es un paso audaz para asegurar el futuro económico de Singapur y fortalecer su posición como líder mundial en comercio e innovación."
 SIN_world_diplomacy_effort: "Esfuerzo diplomático mundial"
 SIN_world_diplomacy_effort_desc: "Como pequeño Estado rodeado de grandes potencias, la seguridad de Singapur se basa en su diplomacia. Nos comprometemos plenamente a interactuar con el mundo, construyendo las relaciones que mantienen a la ciudad-estado segura y próspera."
 SIN_go_west: "Ir al oeste"
 SIN_go_west_desc: "Singapur estrechará sus lazos con las potencias occidentales. Sus mercados, su capital y sus garantías de seguridad ofrecen la base más sólida para una nación comercial."
 SIN_go_east: "Ve al este"
 SIN_go_east_desc: "Singapur se volverá hacia sus vecinos asiáticos y las potencias en ascenso del Este. Una alineación más estrecha con la región promete comercio, inversión y una voz en los asuntos de nuestro propio continente."
 SIN_go_third_world_country: "Liderar el mundo en desarrollo"
 SIN_go_third_world_country_desc: "Singapur defenderá la causa de las naciones en desarrollo. Un líder entre ellas ejerce una influencia que trasciende su tamaño, y un amigo de muchos no le debe nada a nadie."
 SIN_free_active_politic: "Política exterior libre y activa"
 SIN_free_active_politic_desc: "Singapur seguirá una política exterior independiente, libre de alineamientos con bloques y guiada únicamente por el interés nacional. Nos relacionamos con todos, pero no respondemos ante nadie."
 SIN_nautral_army: "Fuerzas Armadas Neutrales"
 SIN_nautral_army_desc: "Una Singapur neutral necesita, sin embargo, una defensa creíble. Las Fuerzas Armadas de Singapur se organizarán en torno a la disuasión, serán ágiles y profesionales, capaces de hacer que cualquier agresión resulte demasiado costosa como para siquiera considerarla."
 SIN_ally_with_nato: "Convertirse en un aliado importante no perteneciente a la OTAN"
 SIN_ally_with_nato_desc: "Singapur formalizará una estrecha cooperación en materia de defensa con las potencias de la OTAN como Aliado Principal No Miembro de la OTAN. Su protección en materia de seguridad ofrece una sólida garantía contra cualquier amenaza a la ciudad-estado, sin las obligaciones de la membresía plena."
 SIN_join_brics: "Únete al BRICS"
 SIN_join_brics_desc: "Singapur se unirá al grupo BRICS, sumándose así a las economías emergentes que están transformando el orden mundial. Un puesto entre ellos representa una apuesta por el futuro."
 SIN_join_brics_faction: "Únete a la facción BRICS"
 SIN_join_brics_faction_desc: "Singapur irá más allá de la asociación económica y formalizará su alianza con las potencias BRICS. La ciudad-estado vincula su seguridad al emergente bloque multipolar."
 SIN_join_sco: "Unirse a la SCO"
 SIN_join_sco_desc: "Singapur se adherirá a la Organización de Cooperación de Shanghái. Esta membresía vincula a la ciudad-estado con el orden económico y de seguridad euroasiático liderado por Pekín y Moscú."
 SIN_navy_sailor_fast_learner: "Aprendices rápidos"
 SIN_navy_sailor_fast_learner_desc: "La Armada de la República de Singapur invierte en la formación acelerada de sus tripulaciones. Los marineros que dominan rápidamente su oficio convierten una pequeña flota en una unidad de élite."
 SIN_navy_sailor_daily_activity: "Ejercicios diarios"
 SIN_navy_sailor_daily_activity_desc: "El entrenamiento constante mantiene a la flota preparada. Los ejercicios rutinarios de navegación, control de daños y artillería garantizan que la Armada de la República de Singapur nunca sea sorprendida desprevenida."
 SIN_ri_invest_to_malaysia: "Invest in Malaysia"
 SIN_ri_invest_to_malaysia_desc: "Singapore will direct investment across the Causeway into Malaysia. Closer economic ties with our nearest neighbour bring shared prosperity and a steadier border."
 SIN_ri_invest_to_indonesia: "Invest in Indonesia"
 SIN_ri_invest_to_indonesia_desc: "Singapore will pour capital into Indonesia's vast and growing economy. The archipelago is too large a market, and too close a neighbour, to ignore."
 SIN_ri_invest_to_thailand: "Invest in Thailand"
 SIN_ri_invest_to_thailand_desc: "Singapore will expand its investment in Thailand, anchoring its position in mainland Southeast Asia and deepening the bonds of regional trade."
 SIN_gi_invest_to_europian_union_country: "Invest in the European Union"
 SIN_gi_invest_to_europian_union_country_desc: "Singapore will channel its reserves into the markets of the European Union. Access to the world's largest single market repays the investment many times over."
 SIN_gi_invest_to_csto_nation: "Invest in the CSTO States"
 SIN_gi_invest_to_csto_nation_desc: "Singapore will extend its capital into the CSTO states. New markets in Eurasia diversify the city-state's economic reach and open doors that competitors have left shut."
 SIN_gi_invest_to_africa_nation: "Invest in Africa"
 SIN_gi_invest_to_africa_nation_desc: "Singapore will seek opportunity on the African continent. Early investment in fast-growing economies positions the city-state ahead of the field."
 SIN_efr_invest_to_america: "Invest in the United States"
 SIN_efr_invest_to_america_desc: "Singapore will place its foreign reserves in the United States. The deepest and most liquid markets in the world offer both returns and security for the city-state's wealth."
 SIN_efr_invest_to_swiss: "Invest in Switzerland"
 SIN_efr_invest_to_swiss_desc: "Singapore will direct its foreign reserves into Switzerland. The stability of Swiss finance is a natural home for the savings of a careful trading nation."
 SIN_deepen_western_defense: "Profundizar los lazos de defensa con Occidente"
 SIN_deepen_western_defense_desc: "Singapur ampliará los ejercicios conjuntos, el intercambio de inteligencia y la adquisición de armamento con sus socios occidentales. Una cooperación más estrecha consolida la seguridad de la ciudad-estado sin comprometerla con una alianza distante."
 SIN_neutral_army: "Ejército Neutral"
 SIN_neutral_army_desc: "The Singapore Armed Forces are built for deterrence and territorial defence, not conquest. A small but well-drilled force, backed by careful planning, keeps the city-state secure without alarming its neighbours."
 singapore.129.t: "Jeyaretnam muere de un ataque al corazón."
 singapore.129.d: "J. B. Jeyaretnam, veterano miembro de la oposición, falleció hace unas horas a causa de un infarto. La oposición está de luto por la pérdida de un líder tan querido por el Partido de los Trabajadores y una figura destacada que luchaba activamente contra el PAP y por mayores libertades políticas en el gobierno de Singapur. Es solo cuestión de tiempo que otros miembros de la oposición comiencen a ocupar su lugar."
 singapore.129.a: "Oren por la familia."
 SIN_harsher_state_tt: "Bans all parties aside from [conservatism_L], [Autocracy_L], [Neutral_Autocracy_L], and [Nat_Autocracy_L].\n"
 SIN_energy_efforts_idea: "Energy Efforts"
 SIN_energy_efforts_idea_desc: "Our city's future thrives on the security of our most important infrastructure. Energy is one such issue we must solve and secure ourselves so our children's children may never have to be concerned."
 SIN_pro_lgbtqa_stance_idea: "Pro-LGBTQIA Stance"
 SIN_pro_lgbtqa_stance_idea_desc: "Our government has taken a pro-LGBT stance."
