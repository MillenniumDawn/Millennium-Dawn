 CPD_FULL_PUPPET_BTN: "Pełne państwo marionetkowe"
 CPD_resource_rights_button_TT: "§Y Prawa do zasobów §!"
 CPD_resource_rights_button_TT_DELAYED: "Uzyskanie §Y praw do eksploatacji zasobów §! sprawia, że ​​wydobywane przez wybrane państwa surowce trafiają do nas. Same państwa pozostają pod władzą dotychczasowego właściciela; do naszej gospodarki płyną jedynie produkowane przez nie ropa, stal, aluminium, kauczuk, wolfram i chrom. Układ ten obowiązuje do czasu jego anulowania w ramach kolejnego traktatu pokojowego."
 CPD_military_basing_button_TT: "§Y Rozmieszczenie baz wojskowych §!"
 CPD_military_basing_button_TT_DELAYED: "§Y Prawa do z baz wojskowych §! zapewniają naszym siłom swobodę przemieszczania się przez terytorium tego państwa. Nasze wojska mogą się przemieszczać i stacjonować bez ograniczeń, dopóki prawo dostępu nie zostanie cofnięte."
 CPD_full_puppet_button_TT: "§Y Pełna Marionetka §!"
 CPD_full_puppet_button_TT_DELAYED: "Żądanie §YPełnego statusu marionetki§! czyni cały ten naród naszym poddanym. Zachowują oni swoje granice i ludność, lecz tracą niezależność w polityce zagranicznej; ich gospodarka, zasoby ludzkie i siły zbrojne podlegają nam. Wszelkie zawarte już w tej umowie żądania ustanowienia marionetkowego państwa zostają tym samym wchłonięte."
 CPD_ceasefire_button_TT: "§Y Zawieszenie broni §!"
 CPD_ceasefire_button_TT_DELAYED: "§YZawieszenie broni§! kończy wojnę w oparciu o aktualny przebieg linii frontu. Każda ze stron zachowuje kontrolę nad terytoriami, które obecnie zajmuje, niezależnie od tego, kto sprawował nad nimi władzę wcześniej. Rozejm obowiązuje przez §Y720 dni§!, zanim którakolwiek ze stron będzie mogła ponownie wypowiedzieć wojnę drugiej.\n\nZawieszenie broni i żądania terytorialne nie mogą współistnieć w ramach jednego porozumienia. Uruchomienie zawieszenia broni usuwa z bieżącej propozycji wszystkie zapisy dotyczące szczebla państwowego."
 CPD_war_reparations_button_TT: "§Y Reparacje Wojenne §!"
 CPD_war_reparations_button_TT_DELAYED: "§YReparacje wojenne§! zobowiązują stronę przegraną do comiesięcznego przekazywania części swojego PKB przez okres jednego roku. Kwota ta stanowi nowy wydatek w budżecie płatnika oraz nowy dochód w budżecie odbiorcy.\n\n[CPD_reparations_preview]"
 CPD_reparations_preview_TT: "Prognozowany transfer w ramach tej transakcji: §Y$$[?CPD_rep_preview_temp|.2]mld tygodniowo §! (~§Y$$[?CPD_rep_preview_total_temp|.0]mld§! rocznie)"
 CPD_forced_neutrality_button_TT: "§Y Wymuszenie Neutralności §!"
 CPD_forced_neutrality_button_TT_DELAYED: "§YWymuszona neutralność§! usuwa ten naród z jego frakcji w momencie podpisania i uniemożliwia mu dołączenie do innej lub utworzenie nowej przez §Ypięć lat§!."
 CPD_regime_change_button_TT: "§Y Zmiana Reżimu §!"
 CPD_regime_change_button_TT_DELAYED: "§YZmiana reżimu§! zastępuje partię rządzącą u celu tą, która aktualnie sprawuje władzę w naszym kraju. Ich koalicja zostaje rozwiązana, a władzę przejmuje przywódca o poglądach zbieżnych z naszymi. Nowy rząd przez dwa lata zmaga się z §Ypowojenną niestabilnością§!, a w państwach islamskich może dojść do §Ysalafickiego sprzeciwu§! wobec rządów narzuconych z zewnątrz."
 additional_income_war_reparations_tt: "$$[?CPD_reparations_weekly|+3] z §YReparacji wojennych§!\n"
 additional_expense_war_reparations_tt: "$$[?CPD_reparations_weekly|-3] z §YReparacji wojennych§!\n"
 CPD_war_reparations_payer: "Reparacje wojenne (spłata)"
 CPD_war_reparations_payer_desc: "Wypłacamy reparacje wojenne na mocy porozumienia pokojowego. Cotygodniowy transfer gotówki stanowi dodatkowy wydatek w naszym budżecie przez §Y1 rok§!."
 CPD_war_reparations_receiver: "Reparacje wojenne (otrzymywanie)"
 CPD_war_reparations_receiver_desc: "Otrzymujemy reparacje wojenne w wyniku zawarcia traktatu pokojowego. Cotygodniowy transfer gotówki stanowi dodatkowy dochód w naszym budżecie przez §Y1 rok§!."
 CPD_forced_neutrality_spirit: "Wymuszona neutralność"
 CPD_forced_neutrality_spirit_desc: "Zgodnie z warunkami porozumienia pokojowego naszemu krajowi zabrania się przystępowania do sojuszy wojskowych lub ich tworzenia."
 CPD_regime_change_instability: "Powojenna niestabilność polityczna"
 CPD_regime_change_instability_desc: "Wymuszona zmiana władzy zdestabilizowała nasz system polityczny."
 CPD_liberate_in_state_button_TT: "[CPD_LIBERATE_TT_LOC]"
 CPD_liberate_in_state_button_TT_DELAYED: "[CPD_LIBERATE_TT_DELAYED_LOC]"
 CPD_liberate_in_state_button_TT_DEMAND: "Wyzwolenie Państw"
 CPD_liberate_in_state_button_TT_CONCESSION: "Przyznanie niepodległości"
 CPD_liberate_in_state_button_TT_DELAYED_DEMAND: "Żądanie §YWyzwolenia§! skutkuje zwrotem wybranych terytoriów narodowi, któremu one prawnie przysługują. Jeśli pierwotny właściciel (posiadacz rdzennych praw do ziemi) nadal istnieje, przejmuje on terytorium bezpośrednio; w przeciwnym razie zostaje przywrócony do istnienia, by je przejąć. Gdy nie ma już pierwotnego właściciela, z pozostałości terytorium obecnego posiadacza tworzone jest nowe państwo wydzielone."
 CPD_liberate_in_state_button_TT_DELAYED_CONCESSION: "Zrzeczenie się §YNiepodległości§! przekazuje wybrane państwa, które kontrolujemy, ich prawowitemu pretendentowi – niezależnie od tego, czy naród ten nadal istnieje, czy też musi zostać przywrócony do życia."
