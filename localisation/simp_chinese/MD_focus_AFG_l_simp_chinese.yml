 GULBUDDIN_HEKMATYAR_DESC: "古尔布丁·赫克马蒂尔是阿富汗政治家和前圣战者领袖。他是“我的队伍抵达贾尔布丹”政党的创始人和领导人，在1979年穆罕默德·尤努斯·哈利斯与伊斯兰党分裂成立党后被称为伊斯拉米·哈利斯。他在1990年代曾两次担任总理。赫克马蒂亚尔在1970年代初以学生身份加入穆斯林青年组织，在那里他以被该组织大部分人拒绝的伊斯兰激进主义而闻名。\n\n他在巴基斯坦度过了一段时间在1979年苏阿战争开始时返回阿富汗之前，当时中央情报局开始通过巴基斯坦情报机构 ISI 资助他迅速发展的伊斯兰党组织，ISI 是阿富汗最大的圣战组织之一。他获得了更多的中央情报局在苏阿战争期间，获得的资金比任何其他圣战组织领导人都多。\n\n在1992年苏联支持的阿富汗总统穆罕默德·纳吉布拉下台后，赫克马蒂亚尔拒绝加入新的行动与其他军阀一起参与阿富汗内战，仅在喀布尔就导致约50,000名平民丧生。赫克马蒂亚尔被指控对该市的火箭袭击负有最大责任。与此同时，作为艾哈迈德·沙阿·马苏德领导的和平与权力分享努力的一部分，赫克马蒂亚尔于1993年至1994年和1996年至1997年再次担任阿富汗总理。"
 MOHAMMED_ZAHIR_SHAH_DESC: "查希尔在位40年，是自18世纪杜兰尼帝国建立以来阿富汗在位时间最长的统治者。他扩大了阿富汗与许多国家的外交关系，包括与冷战双方的外交关系。20世纪50年代，查希尔·沙阿开始推动国家现代化，最终制定了新宪法和君主立宪制。他表现出无党派立场，他的长期统治给国家带来了和平，但后来却失去了和平。\n\n1973年，查希尔·沙阿在意大利接受治疗时，他的政权被他的表弟、前总理穆罕默德·达乌德·汗发动政变推翻，建立了一个一党制共和国，结束了连续统治超过225年的君主制政府。 \n\n查希尔·沙阿是复兴君主制阿富汗并延长其家族对王位的继承权的最佳人选。"
 raid_taliban_hideouts: "突袭塔利班藏身处"
 raid_taliban_hideouts_desc: "我们的突击队已经找到了塔利班武装分子的位置，我们可以派遣一支突击队进行突袭，以消灭或抓捕这些塔利班武装分子。"
 bomb_taliban_targets: "轰炸塔利班基地"
 bomb_taliban_targets_desc: "我们的情报机构已经确定了几个塔利班集中地，我们可以使用我们的空军反叛乱战机轰炸这些武装分子。"
 secure_afghan_pakistani_border: "安全的阿富汗-巴基斯坦边界"
 secure_afghan_pakistani_border_desc: "我们难以消灭塔利班叛乱的一个主要原因是塔利班武装分子逃往巴基斯坦，重新集结，然后又回来继续在国内叛乱。我们与巴基斯坦的大部分边境无人看守，我们需要加大力度在边境建立安全机制。"
 afghan_unity_propaganda: "阿富汗统一宣传"
 afghan_unity_propaganda_desc: "塔利班主要由阿富汗人组成，阿富汗人都是同胞，但由于意识形态差异，我们长期处于内战之中，我们可以努力说服塔利班武装分子放下武器，为国家发展做出贡献，承诺原谅他们过去的行为。"
 show_supporting_counter_insurgency_countries: "显示支持我们反叛乱的国家"
 show_supporting_counter_insurgency_countries_desc: "这表明，支持我们对塔利班进行反叛乱任务的国家，不仅会向我们提供军事行动，还会提供技术支持。"
 eliminate_taliban_insurgency: "消灭塔利班叛乱"
 eliminate_taliban_insurgency_desc: "现在，随着我们的军队部署到关键地区和边境地区的安全，我们可以尽最后的努力粉碎塔利班叛乱，结束这场持久的冲突。"
 isaf_raid_taliban_hideouts: "反塔利班袭击"
 isaf_raid_taliban_hideouts_desc: "我们在阿富汗的军事情报部门已经成功定位了几个塔利班集中地，我们可以进行突袭以追捕那些叛乱分子。"
 isaf_launch_drone_strike: "发射无人机打击"
 isaf_launch_drone_strike_desc: "我们在阿富汗的军事情报部门已经成功地在市区附近找到了许多塔利班藏身之处，我们可以发动无人机袭击，削弱他们对阿富汗政府目标或我们驻阿富汗部队发动攻击的能力。"
 isaf_bomb_taliban_hotspots: "轰炸塔利班热点"
 isaf_bomb_taliban_hotspots_desc: "塔利班叛乱分子的力量已经发展到临界水平，而阿富汗军队在反击他们的能力如此之低，我们需要部署我们的战略轰炸机轰炸他们的热点。"
 isaf_provide_technical_equipment: "提供反叛乱装备"
 isaf_provide_technical_equipment_desc: "虽然阿富汗本身没有相关的反叛乱装备，但我们可以为他们提供这些设备，这可能会提高阿富汗国民军和阿富汗国家警察开展反叛乱行动的效率。"
 isaf_withdraw_from_afghanistan: "从阿富汗撤军"
 isaf_withdraw_from_afghanistan_desc: "我们在阿富汗的任务已经完成，是时候让我们的军队退出这场永无止境的战争了。"
 TT_AFG_NOT_FACTION_WITH_PAK: "不与任何巴基斯坦派系结盟"
 TT_AFG_BORDER_WAR_WARN_OF_WAR: "§R如果我们占领了这片土地，我们的敌人很可能就会向我们宣战！§!"
 AFG_Baluchistan: "已宣称的俾路支斯坦"
 AFG_invasion: "入侵巴基斯坦"
 claim_pashtunistan: "宣称普什图斯坦"
 claim_pashtunistan_desc: "普什图斯坦地区包括巴基斯坦西北部和阿富汗东部。由于该地区处于极端分子的控制之下，我们可以声称自己是该地区真正的保护者。"
 claim_baluchistan: "宣称俾路支斯坦"
 claim_baluchistan_desc: "通常，统一的普什图斯坦言论也包括巴基斯坦西部的俾路支地区。该地区居住着长期争取独立的俾路支人。该地区曾经属于阿富汗，它将为我们提供出海通道，这对我们至关重要。"
 afg_claims_advance_to_baluchistan: "挺进俾路支斯坦"
 afg_claims_advance_to_baluchistan_desc: "俾路支省北部和主要城市奎达应当是我们的第一个目标，这将使我们能够继续向大海前进。"
 afg_claims_advance_to_the_sea: "完成对俾路支斯坦的征服"
 afg_claims_advance_to_the_sea_desc: "我们需要通过推进和占领港口城市瓜德尔来完成对俾路支斯坦的占领。"
 afg_claims_advance_into_tribal_areas: "挺进普什图族部落地区"
 afg_claims_advance_into_tribal_areas_desc: "我们的第一个目标应该是通过联邦直辖部落地区，我们将从消灭巴基斯坦塔利班的据点开始。"
 afg_claims_clear_tribal_areas: "清理部落地区"
 afg_claims_clear_tribal_areas_desc: "下一阶段是在塔利班基地已经解决之后，安抚部落地区的其他地区。"
 afg_claims_invade_peshawar: "占领白沙瓦"
 afg_claims_invade_peshawar_desc: "巴基斯坦普什图地区的宝石白沙瓦就在我们的眼前，我们不能再犹豫了！"
 afg_invade_pakistan: "入侵巴基斯坦"
 afg_invade_pakistan_desc: "不是缓慢前进占领领土，而是直接入侵，使敌人措手不及。然而，国际社会将对此表示不满，巴基斯坦的保护者可能会进行干预。"
 afg_integrate_pashtunistan: "整合普什图斯坦"
 afg_integrate_pashtunistan_desc: "尽管普什图人与阿富汗有着共同的主要民族，但新地区的许多普什图人仍然憎恨我们的政府。我们需要花费资源来说服他们，他们和我们在一起会更好。"
 unite_with_pakistan_taliban: "与巴基斯坦塔利班联合起来"
 unite_with_pakistan_taliban_desc: "我们在巴基斯坦的兄弟们正在为解放穆斯林而战斗。我们要和他们联手！"
 AFG_technical_specialists: "技术专家"
 AFG_technical_specialists_desc: "俄罗斯已计划派遣技术专家协助我们的努力，为我们的作战计划提供必要的规划和后勤支持，以及提供训练和操作设备所需的专业知识。"
 AFG_symbolic_new_start: "象征性的新开始"
 AFG_symbolic_new_start_desc: "一些人认为这是阿富汗重组政府、迈向新时代的一个机遇。"
 AFG_cautious_approach: "谨慎行事"
 AFG_cautious_approach_desc: "一些人曾认为阿富汗将进入快速增长时代，随后进行大规模改革，但事实上，阿富汗只经历了温和的增长和更为谨慎的改革方式。"
 AFG_local_military_pressure: "局部军事压力"
 AFG_local_military_pressure_desc: "一种被称为“局部军事压力”的战术理论。该战略侧重于对敌军施加持续的局部压力，扰乱其行动并削弱其士气。"
