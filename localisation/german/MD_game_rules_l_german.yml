 RULE_OPTION_RISE_OF_BOKO_HARAM: "Aufstieg von Boko Haram"
 RULE_OPTION_RISE_OF_BOKO_HARAM_AI_DESC: "Übt Druck auf Nigeria aus, damit Boko Haram die Kontrolle über das Land übernimmt."
 RULE_OPTION_PDP_EMPOWERED: "Demokratische Volkspartei"
 RULE_OPTION_PDP_EMPOWERED_AI_DESC: "Die People's Democratic Party ist eine der größten Parteien Nigerias. Sie vertritt vor allem das christliche Ende des religiösen Spektrums und blockfreie Ideologien."
 RULE_OPTION_ANPP_EMPOWERED: "Allnigerianische Volkspartei"
 RULE_OPTION_ANPP_EMPOWERED_AI_DESC: "Die Allnigerianische Volkspartei (oder Progressive Demokratischer Kongress im Jahr 2017) ist die wichtigste Oppositionspartei im Jahr 2000 in Nigeria. Es ist wichtig zu beachten, dass sie der Sozialdemokratie in Europa sehr ähnlich ist und sich für umfassende Reformen im Land Nigeria einsetzt."
 FRA_AI_BEHAVIOR_MD: "@FRA France"
 RULE_OPTION_FRA_HISTORICAL: "Historical"
 RULE_OPTION_FRA_HISTORICAL_DESC: "The Fifth Republic holds its course as the presidency passes from Chirac to Sarkozy, then Hollande and Macron, with the §8Republicans§! and the centre trading office between them. France anchors European integration and keeps its hand on the Françafrique sphere."
