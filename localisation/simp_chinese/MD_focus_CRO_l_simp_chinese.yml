 CRO_political.1.t: "海牙起诉戈托维纳"
 CRO_political.1.d: "前南斯拉夫问题国际刑事法庭已公布对安特·戈托维纳将军在“风暴行动”期间所犯罪行的起诉书。在逮捕行动开始前，他已潜逃。退伍军人协会正在集会抗议，布鲁塞尔方面也明确表示，与该法庭合作是欧洲一体化的先决条件。"
 CRO_political.1.a: "我们必须与法庭合作。"
 CRO_political.1.b: "克罗地亚不引渡英雄"
 CRO_political.2.t: "戈托维纳在特内里费岛被捕"
 CRO_political.2.d: "西班牙警方在逃亡四年后，于加那利群岛一家酒店餐厅逮捕了安特·戈托维纳。萨格勒布方面提供的情报帮助警方追踪到了他的下落。退伍军人在主广场点燃蜡烛，但通往欧洲的最后一个障碍已被清除。"
 CRO_political.2.a: "这是一个痛苦但必要的步骤"
 CRO_political.3.t: "申请加入欧盟"
 CRO_political.3.d: "克罗地亚总理伊维察·拉坎已在雅典正式提交克罗地亚加入欧盟的申请。克罗地亚政府希望赶上其北部邻国已经开始的入盟浪潮，并彻底摆脱过去十年战争的阴影。"
 CRO_political.3.a: "我们的归宿本就在欧洲。"
 CRO_political.4.t: "加入谈判开启"
 CRO_political.4.d: "在首席检察官确认克罗地亚将与法庭全面合作后，欧盟已启动入盟谈判。欧盟立即开始对克罗地亚法律与欧盟法律体系的比对，外国投资者也对此高度关注。"
 CRO_political.4.a: "大幕拉开"
 CRO_political.5.t: "布加勒斯特峰会邀请"
 CRO_political.5.d: "在布加勒斯特举行的北约峰会正式向克罗地亚和阿尔巴尼亚发出入盟邀请。入盟议定书将于年内签署。此次邀请是对克罗地亚十年国防改革的肯定，也巩固了克罗地亚在西方联盟中的地位。"
 CRO_political.5.a: "高官厚禄"
 CRO_political.6.t: "克罗地亚国家石油公司-匈牙利石油天然气集团事务"
 CRO_political.6.d: "匈牙利前总理伊沃·萨纳德在逃避起诉后于奥地利被捕。调查人员指控他收受匈牙利石油天然气集团的贿赂，以换取该公司对克罗地亚国家石油公司的管理权。此案牵涉到执政党的高层。"
 CRO_political.6.a: "贵人犯法，庶民同罪"
 CRO_political.6.b: "遏制损害"
 CRO_political.7.t: "戈托维纳上诉后被判无罪"
 CRO_political.7.d: "前南斯拉夫问题国际刑事法庭上诉庭推翻了对安特·戈托维纳将军和姆拉登·马尔卡奇将军的定罪，并下令立即释放他们。萨格勒布的主要广场挤满了欢迎他们回家的民众。在贝尔格莱德和巴尼亚卢卡，这一裁决引发了民众的强烈愤慨。"
 CRO_political.7.a: "将军们回家了"
 CRO_political.8.t: "欢迎加入欧盟"
 CRO_political.8.d: "午夜时分，克罗地亚正式成为欧盟第28个成员国，结束了长达12年的入盟进程，这一进程甚至超过了六届政府的更迭。斯洛文尼亚和匈牙利边境的海关检查站正在被拆除。"
 CRO_political.8.a: "欧洲的未来"
 CRO_political.9.t: "申根区和欧元"
 CRO_political.9.d: "克罗地亚在同一天加入了欧元区并成为申根区成员国，成为首个同时完成这两项步骤的成员国。与欧盟其他成员国之间的边境管制取消，克罗地亚库纳也退出了历史舞台。旅游业预计将迎来创纪录的旅游旺季。"
 CRO_political.9.a: "终于完全整合了"
 CRO_political.10.t: "黑塞哥维那-波斯尼亚宣布独立"
 CRO_political.10.d: "黑塞哥维那的克罗地亚族州宣布成立自治的黑塞哥维那-波斯尼亚，并切断了与萨拉热窝的联系。萨格勒布必须决定在支持这一分裂运动方面走多远。"
 CRO_political.10.a: "承认黑塞哥维那-波斯尼亚"
 CRO_political.10.b: "默默支持"
