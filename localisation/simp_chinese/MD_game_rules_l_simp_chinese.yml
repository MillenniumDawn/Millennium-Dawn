 RULE_OPTION_GREAT_COLLAPSE: "大崩溃"
 RULE_OPTION_GREAT_COLLAPSE_AI_DESC: "随着苏联于91年解体，美国猖獗的军国主义逐渐成为纳税人的负担。1995-99年间发生的一系列抗议活动导致伤亡人数不断增加，民众的不满情绪不断增加，联邦政府陷入了冷战的泥潭。在世纪之交，抗议活动达到了沸点，再加上对千年虫问题的担忧，有关全国铁路罢工的谣言越来越多，这次罢工可能会使经济陷入瘫痪，并削弱联邦政府协调反抗议行动的能力。"
 USB_AI_BEHAVIOR: "@USB 美利坚自由邦"
 RULE_OPTION_REVANCHIST_PATH: "重申天命"
 RULE_OPTION_REVANCHIST_PATH_AI_DESC: "联邦的影响将促使自由州调整其外交政策，以实现对大陆四十八州的复仇主义。§R必须设定美国规则为后联合时代或大崩溃§!"
 RULE_OPTION_ISOLATION_PATH: "大停摆"
 RULE_OPTION_ISOLATION_PATH_AI_DESC: "美国梦已破灭，世界似乎是一个不断扩大的虚空。因此，人民和政治领导人决定，最好的办法是远离世界，享受他们那一小角落可能带来的甜蜜和平与安宁。§R必须设定美国规则为后联合时代或大崩溃§!"
 RULE_OPTION_ARCADIA_PATH: "东方身份"
 RULE_OPTION_ARCADIA_PATH_AI_DESC: "随着美国梦变成噩梦，联邦影响力逐渐减弱。因此，人们决定走一条新路才是正确的，并希望通过阿卡迪亚计划创造一种新的“东方身份”。§R必须设定美国规则为后联合时代或大崩溃§!"
 CSA_AI_BEHAVIOR: "@CSA 美利坚南方共和国"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH: "美国南部"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH_AI_DESC: "美国梦仍然在南方人民的心中燃烧，许多人影响了政府的意见，改革了旧日的辉煌，并着手创建一个新的美国。一个南方的美国。§R必须设定美国规则为后联合时代或大崩溃§!"
 RULE_OPTION_GOLDEN_CIRCLE_PATH: "金环"
 RULE_OPTION_GOLDEN_CIRCLE_PATH_AI_DESC: "许多南方人认为他们应该创造一种新的命运，一种具有南方特色的命运。因此，许多当权者希望重新审视邦联的旧观念，以此来巩固这个自由的新时代。§R必须设定美国规则为后联合时代或大崩溃§!"
 RULE_OPTION_SOUTHERN_ARCADIA_PATH: "东方身份"
 RULE_OPTION_SOUTHERN_ARCADIA_PATH_AI_DESC: "随着美国梦的破灭，许多人不愿再深陷“南部邦联耻辱”的泥潭。许多南方人希望从卡宏和克里奥尔人的法国影响中塑造一种新的身份。这种身份既不是美国人，也不是南部邦联人，但仍然是我们自己的。§R必须设定美国规则为后联合时代或大崩溃§!"
