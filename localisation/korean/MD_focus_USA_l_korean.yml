 USA_FOCUS.3.e: "흥미롭군."
 usa.89.o3: "아니, 다시는 묻지 마라!"
 usa.95.t: "F-35 계획 신청 거부 및 블랙리스트 등재"
 usa.95.d: "미국은 우리가 아직 그러한 기술을 보유할 만큼 신뢰할 수 없다며 F-35 계획 가입을 허락하지 않았습니다. 또한 우리가 블랙리스트에 올라 다시는 계획에 가입할 수 없게 될 것이라는 통보도 받았습니다."
 usa.95.o1: "좋다"
 USA_disable_casualty_report: "아프가니스탄 월간 사상자 보고 비활성화"
 USA_disable_casualty_report_desc: "아프가니스탄의 사상자와 관련된 월간 사건을 더 이상 받지 않게 됩니다. 대신 그 효과가 통지 없이 적용됩니다."
 USA_enable_casualty_report: "아프가니스탄 월간 사상자 보고 재활성화"
 USA_enable_casualty_report_desc: "아프가니스탄의 사상자와 관련된 월간 사건을 다시 받기 시작합니다."
 USA_UKR_aid: "미국-우크라이나 원조"
 USA_ISR_military_cooperation: "미국-이스라엘 군사 협력"
 USA_CHI_trade_war: "중국과의 경제 협력 거리 두기"
 USA_SAU_aid: "미국 군사 정보 공유"
 USA_tariff: "미국 무역 관세"
 USA_SSU_aid: "미국 군사 지원"
 USA_afghan_mission_cost: "O.E.F. 임무 - 아프가니스탄"
 USA_afghan_mission_cost_desc: "항구적 자유 작전(Operation Enduring Freedom)에 대한 우리의 헌신과 아프가니스탄에서의 임무는 우리를 특수한 상황에 놓이게 했습니다. 우리의 경제, 정부, 군대는 아프가니스탄의 통제와 안정을 유지하는 데 드는 비용의 상당 부분을 감당하게 될 것입니다.\n§W--------------§!\n§Y아프가니스탄 철수§! 결정을 내리면 이 국가 정신은 §R제거§!됩니다."
 USA_afghan_mission_TT: "[USA.GetFlag] 미군을 [AFG.GetFlag] §H아프가니스탄§!에 파병합니다.\n - 경제 투자를 통해 §H국가 건설§!에 자금을 지원하며, 철수 전에 나라를 안정시키지 못하면 [TAL.GetFlag] §H탈레반§!이 다시 부상할 위험이 있습니다.\n - 우리가 [AFG.GetFlag] §H아프가니스탄§!에 주둔하는 동안 우리 병력은 반군의 §R공격§!을 받게 됩니다."
 USA_attack_tal_strength_TT: "£AFG_salafist_jihadism §H아프가니스탄 내 탈레반 월간 세력§!: §G-2.00%§!"
 USA_disable_report_TT: "§H국내 정책§! 결정 메뉴에서 월간 사상자 보고를 비활성화할 수 있습니다"
 usa.100.t: "항구적 자유 작전 - 아프가니스탄"
 usa.100.d: "[USA.GetLeader] 대통령이 오늘 오전 백악관에서 항구적 자유 작전(OEF)의 개시를 발표했습니다. 그는 이 임무의 목표가 아프가니스탄 영토에서 탈레반과 알카에다 잔당을 뿌리 뽑고, 혼란스러운 이 나라에 평화와 안정을 되찾는 것이라고 밝혔습니다. 아프가니스탄에 대한 이러한 헌신은 미국 외교 정책의 중대한 전환점으로, 이제 미국은 작전의 목표가 달성되고 있는지 확인하기 위해 다른 나라의 내정에 더 적극적인 입장을 취해야 합니다. 아프가니스탄에 대규모 병력을 배치하는 것은 미군을 위험에 빠뜨린다는 뜻이기도 하며, 이는 본토에서 미국 기성 체제의 신뢰를 심각하게 훼손할 수 있습니다. 아프가니스탄에서의 항구적 자유 작전이 무엇을 이룰지는 두고 봐야 하지만, 지금으로서 미군은 임무 목표가 달성될 것이라고 낙관하는 듯합니다."
 usa.100.a: "흥미롭군"
 usa.100.b: "미국 제국이 확장된다"
 usa.101.t: "탈레반 반군과 교전하는 병사들"
 usa.101.d: "정례 순찰 후 우리 병력은 산악 지대에 숨어 있던 여러 탈레반 반군에게 매복 공격을 받았습니다. 짧은 교전 끝에 여러 병사가 부상을 입었고, 일부는 안타깝게도 목숨을 잃었습니다. 그러나 탈레반 병력은 우리 군을 저지하려던 이번 시도에서 큰 타격을 입었습니다. 이 승리만으로는 본국의 언론이 우리가 입은 손실에서 눈을 돌리게 하기에 충분하지 않습니다."
 usa.101.a: "우리는 신을 믿는다"
 department_of_state.123.t: "녹색 협력 노력을 시작한 미국"
 department_of_state.123.d: "미국이 이전 클린턴 행정부가 추진한 녹색 에너지 협정을 진전시키자고 우리 정부에 요청하고 있습니다. 이 협정은 미국이 자금을 대는 태양광 발전소를 대가로 우리가 여러 유전의 시추 작업을 포기하도록 요구합니다. 미국 대통령 [USA.GetLeader]은(는) 이 조치가 '주요 도시의 오염을 크게 줄일' 것이므로 우리에게 최선의 이익이 된다고 밝혔습니다. 미국 자신은 왜 국경 내의 여러 채굴 작업을 포기하지 않느냐고 의심하는 이들도 있지만, 이는 평생 한 번 있을 기회입니다."
 department_of_state.123.a: "어디에 서명합니까?"
 department_of_state.123.b: "절대 안 된다"
 department_of_state.2.t: "녹색 법안에 서명한 중국"
 department_of_state.2.d: "중국 정부가 우리가 제안한 녹색 법안에 서명하기로 결정했습니다. 중국의 합의 가능성에 대한 기대가 낮았던 만큼 일부 각료들에게는 충격이었습니다. 그러나 이 법안이 비준되면서 미국의 투자가 중국으로 흘러들 것이고, 미국 녹색 부문의 잠재적 호황이 다가올 수 있습니다."
 department_of_state.2.a: "훌륭하다!"
 department_of_state.3.t: "우리 법안을 무시한 중국"
 department_of_state.3.d: "중국 정부가 우리의 녹색 법안 제안을 단칼에 무시했습니다. 이 법안은 중국의 에너지 부문을 더 친환경적인 방향으로 이끌 것이었지만, 베이징의 하늘은 아직 충분히 검지 않은 모양입니다."
 department_of_state.3.a: "그들의 손해다"
 department_of_state.4.t: "거대한 녹색 에너지 호황"
 department_of_state.4.d: "녹색 에너지 계약업체에 거액의 자금이 투입된 뒤, 사업이 중국에서 미국 일부 지역으로까지 퍼졌습니다. 시장에 투입된 자금의 규모 덕분에 녹색 에너지 기업들이 성장할 수 있었고, 이제 이들이 세계 다른 지역과 미국에서도 사업을 이어 가는 모습을 보고 있습니다."
 department_of_state.4.a: "우리 정책 수립의 결실이다"
 department_of_state.5.t: "민간 전환 구상을 제안하는 미국"
 department_of_state.5.d: "미국 정부가 전혀 새로운 제안을 내놓았습니다. 군수 공장 8개를 해체하는 협정에 서명하면 그 대신 미국이 이를 대체할 16개의 새 민간 산업을 건설해 주겠다는 것입니다. 제안은 상당히 솔깃해 보이지만, 러시아의 군수 산업을 서서히 약화시키려는 미국의 더 큰 계획의 일부가 아닌가 하는 우려가 있습니다. 그럼에도 이 산업들을 다시 건설하지 못한다고 명시된 것은 없으므로, 실제로 이 구상에 호응하는 편이 우리에게 더 이득입니다."
 department_of_state.5.a: "좋다, 서명하라"
 department_of_state.5.b: "우리를 바보로 아는가?"
 department_of_state.6.t: "우리 구상에 서명하기로 동의한 러시아"
 department_of_state.6.d: "러시아 정부가 우리가 제시한 최근 구상에 서명하겠다고 발표했습니다. 예상 밖이지만, 우리는 이 계획에 자금을 대고 완료할 준비가 되어 있습니다. 러시아는 공장들이 제대로 전환되도록 미국 계약업체의 진입과 감독을 이미 허가했습니다."
 department_of_state.6.a: "좋다"
 department_of_state.7.t: "우리 제안을 거절한 러시아"
 department_of_state.7.d: "러시아 정부가 러시아 전환 구상에 대한 우리의 제안을 거절하기로 결정했습니다. 이 구상은 러시아 정부가 여러 군수 공장을 해체하고 그 자리를 미국 산업이 대신하도록 하는 것이었습니다."
 department_of_state.7.a: "그들의 손해다"
 department_of_state.8.t: "소말리아에 대한 미국의 개입을 승인하는 [USA.GetLeader]"
 department_of_state.8.d: "[USA.GetLeader]은(는) 오늘 소말리아 지역에 평화와 안정을 되찾기 위해 군이 개입하겠다고 발표했습니다. 이 조치는 미국 선박에 대한 소말리아 해적의 공격이 증가한 데 영향을 받았을 가능성이 높습니다. 이 조치는 미국 안팎에서 엇갈린 반응을 얻고 있습니다. 미군이 이 지역에 진정으로 평화를 되찾을 수 있을지는 여전히 논란의 여지가 있습니다. 다음에 무슨 일이 벌어질지는 시간만이 말해 줄 것입니다."
 department_of_state.8.a: "흥미롭군"
 department_of_state.8.b: "제국주의에는 한계가 없다"
 department_of_state.900.t: "남수단을 지원하는 미국!"
 department_of_state.900.d: "미국은 자신들이 낄 자리가 없는 우리의 분쟁에 개입하기로 결정했습니다. 그들은 남수단에 지원을 보내고 우리나라를 공격할 계획입니다."
 department_of_state.900.a: "젠장"
 department_of_state.10.t: "남수단 지원"
 department_of_state.10.d: "수단의 범죄 정권은 내전을 연장하기로 결정했습니다. 명분도 없고 반인도적 범죄로 얼룩진 내전입니다. 남수단이 궁극적인 목표인 해방을 이루려면 우리의 지원이 필요합니다."
 department_of_state.10.a: "전면 지원을 승인한다"
 department_of_state.01.t: "우리 화물선을 공격하는 소말리아 해적"
 department_of_state.01.d: "소말리아 해적들이 물자를 실은 여러 화물선을 잔혹하게 나포했습니다. 현재 승무원들과 연락이 닿지 않으며, 화물이 어떻게 될지 알 수 없습니다."
 department_of_state.01.a: "젠장"
 department_of_state.9.t: "수단에 대한 공습을 승인한 미국"
 department_of_state.9.d: "미국은 수단 인민해방군에 맞서 싸우는 수단의 능력을 약화시키기 위해 수단 내 목표물을 타격하는 방향으로 움직일 것입니다. [USA.GetLeader]은(는) 이 조치가 수단 정부가 남부 반군과의 평화 협정으로 나아가도록 압박하기 위한 것이라고도 밝혔습니다. 수단은 수십 년간 내전의 수렁에 빠져 있으며, 나라는 날로 불안정해지고 있습니다. 미국의 폭탄이 평화를 가져올 수 있을지는 의문이지만, 미국 정부는 이를 필요한 조치로 판단했습니다."
 department_of_state.11.t: "우리의 지원을 요청하는 미국"
 department_of_state.11.d: "워싱턴 정부가 자원병과 무기 수출을 통해 남수단을 지원해 달라고 요청했습니다. 동의하면 우리의 지원에 대해 상당한 대가를 지불하겠다고 제안하고 있습니다."
 department_of_state.11.a: "알겠다, 어떻게 할 수 있을지 알아보겠다"
 department_of_state.11.b: "아니요"
 department_of_state.12.t: "병력 동원을 시작한 [FROM.GetName]"
 department_of_state.12.d: "[FROM.GetName]이(가) 우리의 요청에 따라 행동 호소를 지원하기 위해 부대를 동원하기 시작했습니다. 그들의 도움은 잊히지 않을 것이며, 약속받은 것을 받게 될 것입니다."
 department_of_state.12.a: "좋다"
 department_of_state.13.t: "우리 요청을 거절한 [FROM.GetName]"
 department_of_state.13.d: "[FROM.GetName]은(는) 수단에서의 우리 대의를 돕는 일에 아무런 관여도 하지 않기로 결정하고 본국에 머무르는 쪽을 택했습니다."
 department_of_state.13.a: "알겠다"
 department_of_state.14.t: "채굴 구상을 제안하는 미국"
 department_of_state.14.d: "미국은 우리나라의 비교적 '자원이 빈약한' 지역에서 자원을 채굴하겠다고 제안하고 있습니다. 작업 비용 전체를 부담하며, 10년 뒤 남는 것은 우리가 가져도 된다고 주장합니다."
 department_of_state.14.a: "진행하라"
 department_of_state.14.b: "아니요"
 department_of_state.15.t: "채굴 계약에 동의한 [FROM.GetName]"
 department_of_state.15.d: "[FROM.GetName]이(가) 미국 채굴 기업들이 자국의 낙후 지역에 투자해 귀금속을 채굴하는 것을 허용하기로 동의했습니다. 그들은 우리의 조건에 동의했는데, 발견된 모든 것은 10년간 우리가 보유하고 그 후 자원 권리는 그들의 지도부에 이전된다는 것입니다."
 department_of_state.15.a: "좋다"
 department_of_state.16.t: "채굴 계약을 거절한 [FROM.GetName]"
 department_of_state.16.d: "[FROM.GetName]이(가) 미국 채굴 기업들과의 계약 체결을 거절하여, 그들의 나라에서 의미 있는 채굴 사업을 시작하려던 우리의 계획에 차질이 생겼습니다."
 department_of_state.16.a: "유감이다"
 department_of_state.17.t: "계약 종료"
 department_of_state.17.d: "미국과의 계약이 오늘 자정에 만료되며, 미국이 채굴한 모든 자원의 통제권이 우리 정부로 이전됩니다."
 department_of_state.17.a: "알겠다"
 department_of_state.18.t: "계약 종료"
 department_of_state.18.d: "[FROM.GetName]과(와)의 계약이 자정에 종료되며, 우리가 채굴 작업을 해 온 지역의 모든 자원 권리를 [FROM.GetName]에 되돌려 주어야 합니다."
 department_of_state.18.a: "알겠다"
 department_of_state.19.t: "상실한 영토 회복을 위한 우리나라 지원을 제안하는 미국"
 department_of_state.19.d: "미국은 압하지야와 남오세티야에 대한 우리의 영유권 주장을 지지하며, 우리에게 '조지아 국가에 해를 끼친 자들에게 결단력 있는 조치를 취하라'고 촉구했습니다. 미국은 우리 군을 지원할 용의가 있으며, 러시아가 군사적으로 보복할 경우 NATO의 개입까지 요청하겠다고 밝혔습니다. 또한 우리의 목표 달성을 위해 대량의 무기와 탄약을 제공하겠다고 제안하고 있습니다."
 department_of_state.19.a: "미국이 또 해냈군요, 한번 해 봅시다"
 department_of_state.19.b: "아니, 미국은 믿을 수 없다"
 department_of_state.20.t: "작전 개시"
 department_of_state.20.d: "분리주의 지역을 상대로 한 우리의 계획을 실행하고 정당하게 우리의 것이었던 땅을 되찾을 때가 왔습니다."
 department_of_state.20.a: "전진하라"
 department_of_state.21.t: "북쪽으로 타격하는 조지아"
 department_of_state.21.d: "조지아가 분리주의 지역으로 간주하는 영토에 대한 일련의 공격을 시작했으며, 자국 군대에 대규모 동원을 시작하라고 요구하고 있습니다. 이 공격은 서방의 추가 착취의 문을 열어 주므로 캅카스에서의 우리 영향력에 직접적인 위협이 됩니다. 우리가 아무것도 하지 않으면 약해 보일 위험이 있습니다. 개입하면 나머지 서방과 대립하게 될 수 있습니다."
 department_of_state.21.a: "조지아인들은 지옥에나 가라!"
 department_of_state.21.b: "우리의 문제가 아니다"
 department_of_state.22.t: "조지아의 공격에 대응하는 러시아"
 department_of_state.22.d: "러시아가 조지아의 북부 영토에 대한 최근 일련의 공격에 대응하기로 결정했습니다. 그들은 '조지아 국가가 선을 넘었다'고 선언했으며, 이번 조치가 어떻게든 러시아 국가의 존립에 대한 직접적인 위협이라고 주장합니다. 우리는 러시아가 대응할 경우 조지아 동맹국에 도움의 손길을 내밀겠다고 약속했고, 이제 그때가 왔습니다."
 department_of_state.22.a: "NATO 정상회의 개최를 요청한다"
 department_of_state.22.b: "마음이 바뀌었다"
 department_of_state.23.t: "우리의 지원을 요청하는 미국"
 department_of_state.23.d: "조지아가 러시아와 분쟁에 들어갔으며, 외국의 지원 없이는 거의 아무것도 이룰 수 없어 보입니다. 미국은 조지아가 작전 목표를 달성하도록 돕기 위해 NATO에 자원병과 무기를 보내 달라고 요청하고 있습니다."
 department_of_state.23.a: "우리가 가고 있다"
 department_of_state.23.b: "이것은 우리의 분쟁이 아니다"
 department_of_state.24.t: "조지아 사태에 관한 NATO 회의 개최"
 department_of_state.24.d: "조지아가 러시아와 전면 분쟁에 들어가자 NATO는 상황을 평가하고 대응을 조율하기 위한 긴급 회의를 소집했습니다. 조지아군이 전선을 지키기 위해 고전하는 가운데, 미국은 회원국들에게 군사 원조, 자원병, 무기 선적으로 조지아를 지원할 것을 촉구했습니다. 러시아 정치인들은 이를 자국의 존립에 대한 직접적인 위협으로 간주하며 비난을 쏟아내고 있습니다. 사태가 전개되는 동안 이 지역은 계속 긴장 상태에 있으며, 현재로서는 누구도 어떻게 끝날지 알지 못합니다."
 department_of_state.24.a: "조지아에게는 자국의 이익을 지킬 권리가 있다!"
 department_of_state.24.b: "서방 제국주의의 또 다른 희생자다"
 department_of_state.25.t: "우리를 버린 미국!"
 department_of_state.25.d: "갑작스럽고 예상치 못한 조치로 미국이 우리를 배신하고 약속을 번복했습니다. 그들은 '의회의 반대' 때문에 분쟁에서 승리하는 데 필요한 지원을 충분히 보낼 수 없다고 주장합니다."
 department_of_state.25.a: "그 배신자들"
 department_of_state.26.t: "작전 개시에 나선 조지아"
 department_of_state.26.d: "우리가 약속한 것을 조지아에 제공하고, 눈앞의 위협에 맞서는 데 필요한 무장 지원을 보낼 때가 왔습니다."
 department_of_state.26.a: "알겠다"
 department_of_state.27.t: "우리 요청을 거절한 조지아"
 department_of_state.27.d: "조지아 정부는 고국의 재통일을 위해서라 하더라도 이웃 나라들과 분쟁을 시작하는 데 관심이 없어 보입니다. 당분간 그들은 서방 대신 러시아와 더 긴밀한 관계를 모색하려는 듯합니다."
 department_of_state.27.a: "알겠다"
 department_of_state.28.t: "SHORAD 사업을 제안하는 미국"
 department_of_state.28.d: "미국 정부가 모든 NATO 회원국을 위한 전국 규모의 SHORAD 사업 비용을 부담하겠다고 제안했습니다. 이 계약에는 SHORAD 기지를 미국 인력이 운용해야 한다는 조건이 붙어 있지만, 그럼에도 세계의 다른 대공 방어 체계와는 비교할 수 없는 수준의 방호를 제공할 것입니다."
 department_of_state.28.a: "어디에 서명합니까?"
 department_of_state.28.b: "아니, 우리의 독립에 대한 이 위협을 거부한다!"
 department_of_state.29.t: "정부 청사를 점거한 벨라루스 반체제 인사들"
 department_of_state.29.d: "오늘 오전 9시 34분경, 소형 화기로만 무장한 수십 명의 벨라루스 반체제 인사들이 여러 정부 청사에 유유히 들어가 점거했습니다. 벨라루스 군과 경찰은 이 무장 반군을 막기 위해 거의 아무것도 하지 못했습니다. 직후 반체제 인사들은 국영 TV 방송망을 통해 '부패한 자들의 정부'가 무너졌다고 선언하는 성명을 방송했습니다. 러시아 정부는 이 상황에 대해 공식 논평을 내지 않았지만, 이 갑작스러운 사태에 전 세계가 놀란 것으로 보입니다. 미국 정부가 벨라루스 정부를 전복하려 모의했다고 손가락질하는 이들도 있지만, 워싱턴에서는 어떤 논평도 나오지 않았습니다."
 department_of_state.29.a: "변화의 바람이 다시 한번 분다"
 department_of_state.30.t: "벨라루스 전역에서 울리는 총성"
 department_of_state.30.d: "민스크와 벨라루스 전역의 도시 주민들은 벨라루스 반군과 정부군 사이로 추정되는 총격전이 벌어졌다고 보고했습니다. 이는 조직된 벨라루스 반군이 서부 도시들의 여러 정부 초소를 점거하기 시작하고, 이 지역들을 '벨라루스 자유 구역'으로 선포하면서 벌어진 일입니다. 반군은 [BLR.GetLeader]의 정권을 무너뜨리는 것 외에는 아무 목표도 없다고 주장합니다. 반군이 미국에 의해 무장, 자금 지원, 훈련을 받았을 것으로 의심됩니다. 크렘린은 '벨라루스와 러시아의 주권 영토'에 대한 침공을 막기 위해 벨라루스 정부와 협력하겠다고 밝혔습니다. 러시아의 발언에 이어 [USA.GetLeader]은(는) 벨라루스 반군에 대한 지지를 약속했으며, 여러 NATO 회원국에 반군 지원을 요청했습니다."
 department_of_state.30.a: "또 하나의 국가가 무너진다"
 department_of_state.31.t: "서방 세력에 함락된 벨라루스"
 department_of_state.31.d: "벨라루스에서 혼란을 조장한 미국 세력이 성공을 거두어 이제 우리 국경에 도사리고 있는 듯합니다. 이러한 지도부 교체는 우리 국가 내의 여러 집단과 파벌을 불안하게 했으며, 미국이 벨라루스를 우리 주권에 대한 추가 공격의 발판으로 삼을까 우려하고 있습니다. 우리는 서방에 우리가 그들을 두려워하지 않음을 보여 주어야 하며, 신속하고 결단력 있는 조치를 취해야 합니다. 그러나 그들이 단념할지 여부는 우리의 다음 행보에 크게 달려 있습니다."
 department_of_state.31.a: "우리의 동맹을 확장해야 한다!"
 department_of_state.31.b: "같은 수준으로 보복해야 한다!"
 department_of_state.32.t: "우리를 자국 동맹에 초대하는 러시아"
 department_of_state.32.d: "러시아 정부가 서방의 최근 침략이 우리 국가를 위험에 빠뜨릴 수 있다며 우리를 자국 동맹에 초대했습니다."
 department_of_state.32.a: "어디에 서명합니까?"
 department_of_state.32.b: "러시아여, 우리는 당신의 친구이지만 바보는 아니다!"
 department_of_state.33.t: "초대를 거절한 세르비아"
 department_of_state.33.d: "세르비아 정부가 그렇게 하면 세계의 긴장만 더 높아질 뿐이라며 우리 동맹으로의 초대를 거절했습니다."
 department_of_state.33.a: "좋다"
 department_of_state.34.t: "발트 지역에 전면 공격을 개시한 러시아"
 department_of_state.34.d: "러시아 정부가 발트 지역 국가들에 대한 전면 공격을 개시했으며, 이는 벨라루스의 최근 사태에 대한 보복으로 간주되고 있습니다. NATO가 이 최신 사태에 전면적으로 대응할지는 아직 알 수 없지만, 여러 NATO 회원국은 러시아에 맞선 싸움을 돕기 위해 발트 국가들을 무장시킬 준비가 되어 있다고 밝혔습니다. [SOV.GetLeader]은(는) 텔레비전 연설에서 이 조치가 발트 지역에서 '러시아의 국가 주권을 지키고' '서방 제국주의에 맞서 싸우기' 위한 것이라고 밝혔습니다. 이 침공은 전 세계에서 즉각 비난을 받고 있으며, 세계 대전이 임박했다는 공포를 불러일으키고 있습니다."
 department_of_state.34.a: "세계가 다시 한번 벼랑 끝에 서 있다"
 department_of_state.35.t: "시베리아에서 국가 권력 붕괴"
 department_of_state.35.d: "한때 러시아 국가가 철저히 지켜 온 동시베리아가 이제 전례 없는 수준의 외세 착취에 노출되어 있습니다. 서방 여러 국가가 이 새로 탄생한 '국가'에 대한 승인 절차에 착수했으며, 다른 독립국들도 뒤따르라고 요청하고 있습니다. 국가 안보와 영광스러운 우리 국경의 수호를 위해, 우리는 서방이 우리 국경을 잠식하는 것을 막기 위한 선제적 조치를 취해야 합니다."
 department_of_state.35.a: "시베리아로 진군하여 질서를 확립한다"
 department_of_state.35.b: "우리끼리 지내는 것이 최선이다"
 department_of_state.36.t: "동시베리아 점령에 나선 중국"
 department_of_state.36.d: "중국 정부가 공식적으로 나서서 동시베리아가 중국과 중국 국민의 핵심 이익이라고 밝혔습니다. [CHI.GetLeader]은(는) 옛 러시아 지역의 '평화와 안정을 보장'하기 위해 이 지역에 병력을 투입하겠다는 의사를 밝혔습니다. 겉으로는 중국 정부가 신중을 기해 이 조치를 취하는 것처럼 보이지만, 전문가들은 이를 중국의 세계 경제적 영향력을 넓히려는 움직임이라 부릅니다. 시베리아는 석유와 천연자원이 가득한 지역이어서 중국 기업과 투자자들에게 최적의 사냥터입니다. 이 조치는 서방 국가들로부터 즉각 비난을 받고 있으며, 곧 이 문제에 관한 회의가 열릴 예정입니다."
 department_of_state.36.a: "중국이 전쟁의 전리품을 거둔다"
 department_of_state.37.t: "중국의 공격으로 위협받는 국가 안보"
 department_of_state.37.d: "중국이 한때 러시아령이던 시베리아를 장악한 뒤 이 지역의 지정학은 상당히 극적으로 바뀌었습니다. 한때 승리의 열매를 거두던 NATO 동맹국들은 중국이 영향력을 서쪽으로 더 넓힐 수 있다는 점에서 이제 공황 상태입니다. 이 커져 가는 문제에 대한 영구적인 해법을 요구하는 목소리가 나오고 있습니다."
 department_of_state.37.a: "긴급 정상회의를 소집한다"
 department_of_state.37.b: "그럴 필요 없다, 중국은 해를 끼칠 뜻이 없다"
 department_of_state.38.t: "RUSFOR 선포: 변모한 우리의 종주국"
 department_of_state.38.d: "워싱턴이 소련의 해체와 RUSFOR의 후계 국가 수립을 공식화했습니다. 옛 소련 국가의 종속국으로서 우리는 이제 새로운 현실과 마주하여 이 전환을 받아들일지 저항할지 결정해야 합니다."
 department_of_state.38.a: "새 질서에 협력한다"
 department_of_state.3800.t: "RUSFOR 선포: 소련 시대의 종말"
 department_of_state.3800.d: "미국이 RUSFOR를 소련의 정당한 후계자로 공식 인정했습니다. 옛 제국 전역에 대한 소련의 영유권 주장은 러시아 연방으로 이전됩니다. 모스크바는 이제 이 역사적 전환을 어떻게 관리하고 국가의 미래를 위한 진로를 어떻게 설정할지 결정해야 합니다."
 department_of_state.3800.a: "소련 시대는 끝났다. 러시아는 존속한다"
 department_of_state.39.t: "RUSFOR"
 department_of_state.39.d: "NATO 파트너들은 새롭고 재통일된 친NATO 러시아를 만들기 위해 옛 러시아 영토에 대한 우리의 영유권 주장을 포기하라고 요청하고 있습니다. 장기적으로는 협력의 길로 가는 것이 우리에게 더 이득이 될 것입니다."
 department_of_state.39.a: "RUSFOR가 장악하게 하라"
 department_of_state.39.b: "아니요"
 department_of_state.40.t: "긴급 정상회의를 소집한 NATO"
 department_of_state.40.d: "NATO 수뇌부가 오늘 일찍 긴급 정상회의를 소집했으며, 주된 논의 안건은 러시아의 미래였습니다. NATO 국가들에게 참패한 뒤 러시아 중앙 권력이 붕괴하고 옛 지방 다수가 독립국으로 떨어져 나갔습니다. 중국 정부는 주저 없이 러시아가 남긴 권력 공백을 이용하기로 하고 동시베리아 일부를 점령하여 동시베리아 특별행정구(S.A.R.)를 선포했습니다. 사무총장을 비롯한 여러 NATO 지도자는 상트페테르부르크에 통합 중앙 지휘부를 둔 러시아 NATO군(RUSFOR)이 창설될 것이라고 주장하고 있습니다."
 department_of_state.40.a: "러시아는 실패한 국가가 될 것인가?"
 department_of_state.41.t: "RUSFOR를 창설한 NATO군"
 department_of_state.41.d: "지난주 초 NATO가 연 긴급 정상회의 이후, 과도기 러시아 정부를 위한 필수 기반을 마련하는 임무가 위원회에 맡겨졌습니다. 그 결과 RUSFOR 임무가 수립되었고, 한때 서부 러시아였던 일부 지역에 NATO 복구 구역이 설치되었습니다. 당초 의도는 반동 효과를 막기 위해 분열되고 흩어진 잔존 러시아를 유지하는 것이었지만, 중국의 침략으로 NATO 지도부는 입장을 재평가하게 되었습니다. 여러 국가가 점령 구역을 NATO 복구 구역에 넘겨주고 있으며, 러시아를 동맹에 편입시키고 민간 지도부를 세우는 계획이 추진되고 있습니다."
 department_of_state.41.a: "이 이야기는 전에도 들은 적이 있다..."
 department_of_state.45.t: "커지는 국제적 압력"
 department_of_state.45.d: "러시아 영토에 대한 우리의 통제 때문에 우리를 향한 국제적 압력이 커지고 있습니다. 영유권 주장을 포기하지 않으면 제재를 받을 수 있으며, 협력한다면 골칫거리 땅의 대가로 더 나은 것을 얻을 수도 있습니다."
 department_of_state.45.a: "영유권 주장을 포기한다"
 department_of_state.45.b: "절대 안 된다!"
 department_of_state.47.t: "'칼리닌그라드 회의'를 개최한 NATO"
 department_of_state.47.d: "NATO군에 러시아군이 패배한 뒤, 일부가 '제3차 세계대전'이라 부르기 시작한 전쟁의 승자들이 새로운 러시아의 운명을 결정하기 위해 칼리닌그라드 회의를 주최하고 있습니다. 앞으로 나아갈 최선의 방침을 결정하기 위해 비NATO 국가를 포함한 여러 국가 정상들이 참석하고 있습니다. 현재 논의 중인 계획은 서부 러시아의 중심부에 과도 정부를 수립하고 러시아 내 여러 동부 및 남부 주에 독립을 부여하는 것입니다."
 department_of_state.47.a: "러시아는 국가가 아니라 전리품으로서 탁자 위에 놓여 있다"
 department_of_state.48.t: "러시아 지도부의 새 시대"
 department_of_state.48.d: "러시아 지도자 알렉세이 나발니의 취임식을 거행할 때가 왔습니다. 유일하고도 최선의 선택인 나발니는 러시아를 더 밝고 민주적이며 포용적인 국가로 이끌겠다고 약속했습니다."
 department_of_state.48.a: "환영합니다, 나발니"
 department_of_state.49.t: "요청을 가지고 접근한 미국"
 department_of_state.49.d: "미국이 매우 흥미로운 요청을 가지고 우리에게 접근했습니다. 그들은 NATO와 같은 공식 동맹을 태평양에 수립하자고 제안하고 있습니다. 이 세력의 잠재적 지도국으로서 우리에게 접근한 그들은, 이 지역에서 커져 가는 중국의 영향력에 맞설 동맹을 위한 필수 문서와 기반을 준비해 달라고 요청하고 있습니다. 또한 대만과 한국을 이 세력의 첫 회원국으로 초대해 달라고 요청했습니다."
 department_of_state.49.a: "수락한다"
 department_of_state.49.b: "아니, 우리는 중국에 맞설 수 없다"
 department_of_state.50.t: "우리에게 제안을 가지고 접근한 일본"
 department_of_state.50.d: "일본 정부가 새로 결성된 EAST 동맹에서 우리만의 자리와 안보 지위를 제공하겠다고 제안했습니다. 그들은 이 동맹이 동아시아 안보를 강화하고 중국의 팽창을 저지하는 데 도움이 될 것이라고 주장합니다. 세력에 가입하면 경쟁국들에 대한 우위를 점할 수 있지만, 그들의 표적 한가운데에 놓일 수도 있습니다."
 department_of_state.50.a: "가입한다"
 department_of_state.50.b: "너무 위험해 보인다"
 department_of_state.51.t: "EAST 결성을 발표한 일본"
 department_of_state.51.d: "미국 정치인들의 집요한 로비 끝에 일본 정부가 이번 주 초 미국의 요구에 굴복하여 NATO와 같은 세력을 결성하겠다고 발표했습니다. 이 동맹은 '동아시아 안보 조약'을 뜻하는 'EAST'라 불리며, 벌써 아시아의 NATO로 불리고 있습니다. 이 세력은 중국 주변에 안보 장벽을 만들고 날로 커지는 중국의 영향력을 늦추기 위해 활동할 것입니다. 일본과 미국은 이 세력이 중국에 줄 수 있는 명백한 위협을 부인했지만, 중국 관리들은 이미 이 조치에 대한 대응을 준비하고 있다고 전해졌습니다."
 department_of_state.51.a: "새로운 블록이 부상한다"
 department_of_state.51.b: "서방의 퇴폐가 지구의 또 다른 구석을 집어삼킨다."
 department_of_state.52.t: "이란에 대항할 정보와 원조를 제공하는 미국"
 department_of_state.52.d: "미국은 커져 가는 이란의 위협에 맞서는 데 도움이 될 정보에 접근할 수 있도록 하겠다고 제안했습니다. 수락하면 우리는 이란에 대한 우위를 얻고, 그 대가로 미국은 우리나라에 대한 영향력을 얻게 됩니다."
 department_of_state.52.a: "알겠다"
 department_of_state.52.b: "아니요"
 department_of_state.53.t: "[FROM.GetName]의 우리 제안 수락"
 department_of_state.53.d: "[FROM.GetName]이(가) 우리의 제안을 받아들이기로 결정했으며, 우리가 제공한 자원을 이미 요긴하게 쓰기 시작했습니다."
 department_of_state.53.a: "미국의 친구가 되면 이득이다"
 department_of_state.54.t: "우리 제안을 거절한 [FROM.GetName]"
 department_of_state.54.d: "[FROM.GetName]은(는) 우리가 제공하려던 자원을 마다하는 것이 자국에 최선이라고 결정했습니다."
 department_of_state.54.a: "그들의 손해다"
 department_of_state.55.t: "우리에게 트란스니스트리아에 대한 조치를 촉구하는 미국"
 department_of_state.55.d: "미국은 우리에게 트란스니스트리아가 국가라는 개념을 즉시 해체하는 조치를 취하고, 트란스니스트리아의 방어 진지에 즉각 전면 공격을 개시하라고 촉구했습니다. 이 조치를 미루면 나중에는 아무것도 할 수 없을 만큼 늦을 수 있다고 말합니다. 또한 필요하다면 물자와 인력 지원을 제공하겠다고 밝혔습니다."
 department_of_state.55.a: "군을 준비시킨다"
 department_of_state.55.b: "너무 위험한 조치다"
 department_of_state.56.t: "트란스니스트리아로 진격하는 몰도바"
 department_of_state.56.d: "몰도바 정부가 우리의 조언을 받아들여 트란스니스트리아 분리주의자들에 대한 전면 공격을 개시하는 현명한 결정을 내렸습니다. 이 조치는 모스크바를 화나게 할 수 있지만, 그들을 상당히 약화시키기도 할 것입니다."
 department_of_state.56.a: "좋다"
 department_of_state.57.t: "우리의 조언을 따르지 않기로 한 몰도바"
 department_of_state.57.d: "몰도바 정부는 현 상황상 트란스니스트리아에 대한 공격에 나설 수 없다고 결정했습니다. 그들은 이 조치가 너무 위험하며 정부가 우선시하는 일이 아니라고 말합니다."
 department_of_state.57.a: "알겠다"
 department_of_state.58.t: "트란스니스트리아 분리주의자 제거를 준비하는 몰도바"
 department_of_state.58.d: "몰도바군은 오늘 동쪽의 트란스니스트리아 분리주의자들에 대한 작전을 개시하겠다고 발표했습니다. 트란스니스트리아가 모스크바의 알려진 위성국이라는 점에서 이 조치는 충격으로 다가옵니다. 크렘린은 이 공격에 대해 아직 논평하지 않았지만, 러시아군이 트란스니스트리아군을 지원할 것으로 예상됩니다. 몰도바 내부의 여러 소식통이 이 결정에 대해 전혀 통보받지 못했다고 밝혔기 때문에, 미국의 압력과 관여가 이 공격을 낳았을 수 있다는 추측이 많습니다."
 department_of_state.58.a: "몰도바는 다시 통일될 것인가?"
 department_of_state.58.b: "서방은 계속 확장한다"
 department_of_state.59.t: "경고를 발한 미국"
 department_of_state.59.d: "미국이 우리의 핵 계획에 대해 경고를 발했습니다. 향후 몇 년 안에 우리가 계획을 해체하기 위한 어떤 조치도 취하지 않으면 행동에 나설 수밖에 없다고 밝혔습니다. 미국이 정말로 행동할지 예측하기는 어렵지만, 한 가지는 확실합니다. 그들은 우리의 진전을 방해하기 위해 가용한 모든 수단을 동원할 것입니다."
 department_of_state.59.a: "알겠다, 두고 보자"
 USA_withdraw_from_afghanistan: "[AFG.GetFlag] [TAL.GetFlag] 아프가니스탄 철수"
 USA_withdraw_from_afghanistan_desc: "이제 짐을 싸서 [AFG.GetFlag] 아프가니스탄에서 나올 때가 왔습니다. 우리는 주둔 기간 동안 강력하고 제 기능을 하는 유능한 군대를 뒷받침해 왔습니다. [AFG.GetFlag] 아프간인들이 자신들의 땅에서 평화와 안정을 유지하지 못한다면, 우리로서는 더 이상 할 수 있는 일이 없습니다."
 USA_chinese_environmentalist_cooperation: "[CHI.GetFlag] [USA.GetFlag] 미중 녹색 법안"
 USA_chinese_environmentalist_cooperation_desc: "[CHI.GetFlag] 중국의 화석 연료 의존은 우리가 무시할 수 없는 전략적 자원 기반을 그들에게 부여합니다. 베이징을 녹색 에너지로 유도함으로써 우리는 그들의 지렛대를 줄이는 동시에 미국 산업이 전환을 주도하도록 보장합니다. 더 친환경적인 중국은 덜 위험한 중국입니다."
 USA_the_russian_transition: "[SOV.GetFlag] 러시아 전환 구상"
 USA_the_russian_transition_desc: "[SOV.GetFlag] 소련은 무너졌고, [SOV.GetFlag] 러시아의 비대한 군수 부문은 무기상 외에는 누구에게도 이롭지 않습니다. 우리는 러시아 지도부에 낡은 무기 공장을 민간 생산으로 전환하도록 압박할 것이며, 이는 지역의 긴장을 완화하고 앞으로 진정한 협력의 문을 여는 구체적인 첫걸음입니다."
 USA_authorize_intervention_in_somalia: "[SOM.GetFlag] [JUB.GetFlag] [SWS.GetFlag] 소말리아 군사 개입 승인"
 USA_authorize_intervention_in_somalia_desc: "소말리아 분쟁이 우리의 화물 컨테이너를 위험에 빠뜨렸고, 우리 항로에 대한 끊임없는 공격으로 인해 무역이 꾸준히 감소하고 있습니다. 적절한 개입으로 이를 신속히 끝내고, 세계에서 꽤 불안한 이 지역에 안정을 되찾을 수 있습니다."
 USA_airstrikes_against_sudan: "[SUD.GetFlag] [SSU.GetFlag] 수단 공습 승인"
 USA_airstrikes_against_sudan_desc: "[SUD.GetFlag] 수단 내전은 한동안 이어져 왔으며, 아무 조치도 취하지 않으면 이 지역을 계속 황폐화하는 장기전을 보게 될 수 있습니다. 우리는 [SUD.GetFlag] 수단 정부가 물러서거나 외교적 해법을 모색하도록 압박하기 위해 [SSU.GetFlag] 남수단을 군사적으로 지원해야 합니다."
 USA_call_on_tanzania_and_kenya: "[KEN.GetFlag] [TNZ.GetFlag] [SSU.GetFlag] 케냐와 탄자니아의 지원 요청"
 USA_call_on_tanzania_and_kenya_desc: "우리는 이 어려운 시기에 [SSU.GetFlag] 남수단을 지원해 달라고 아프리카 동맹국들에 요청해야 하며, 서둘러야 합니다."
 USA_our_backyard: "[BRA.GetFlag] [COL.GetFlag] [CHL.GetFlag] 우리 뒷마당에 대한 투자"
 USA_our_backyard_desc: "우리의 남쪽 이웃들은 현재보다 훨씬 더 위대해질 무한한 잠재력을 지니고 있습니다. 미국의 투자로 우리는 그들의 잠재력을 온전히 끌어내고 근대화로 이끌 수 있습니다. 물론 우리도 이를 통해 얻는 것이 있을 것이며, 공짜는 없는 법입니다."
 USA_uniting_georgia: "[GEO.GetFlag] [SOO.GetFlag] [ABK.GetFlag] 조지아 통일"
 USA_uniting_georgia_desc: "[GEO.GetFlag] 조지아는 러시아의 곰에게 착취당하고 파괴되고 있으며, 우리는 이를 용납하지 않을 것입니다. 우리는 트빌리시에 우리가 그들의 뒤에 있음을 확신시키고, [SOV.GetFlag] 모스크바에 이 지역에서 처벌받지 않고 행동할 수 없음을 보여 주어야 합니다. 조지아가 [ABK.GetFlag] 압하지야와 [SOO.GetFlag] 남오세티야를 되찾도록 압박하면, 러시아의 이른바 '막강한 군대'가 할 수 있는 일에 한계가 있음을 보여 줄 것입니다."
 USA_natos_man: "[ENG.GetFlag] [GER.GetFlag] NATO의 사나이"
 USA_natos_man_desc: "우리의 NATO 동맹국들은 무방비 상태입니다. 단거리 대공 방어가 없다면 대규모 공중 공격이 우리가 한 발 쏘기도 전에 전방 진지를 무너뜨릴 수 있습니다. 그 기회가 닫히고 비용이 훨씬 더 커지기 전에, 모든 동맹국 전선에 지금 SHORAD 체계를 갖추어 주어야 합니다."
 USA_belarus_reauthorization_act: "[BLR.GetFlag] 벨라루스 민주주의 재승인법"
 USA_belarus_reauthorization_act_desc: "벨라루스의 민주주의와 인권에 대한 우리의 지지는 흔들려서는 안 됩니다. 우리는 벨라루스 내부의 자유 운동에 대한 지지를 재확인하고 잔혹한 루카셴코 독재 정권을 무너뜨려야 합니다."
 USA_setting_the_pacific_groundwork: "[JAP.GetFlag] [TAI.GetFlag] [KOR.GetFlag] 태평양 방패 구축"
 USA_setting_the_pacific_groundwork_desc: "동아시아의 우리 동맹국들은 대담해지고 공격적이 된 [CHI.GetFlag] 중국에 맞서야 하는데, 혼자서는 할 수 없습니다. 베이징이 자신의 조건으로 문제를 강요하기 전에 [JAP.GetFlag] 도쿄가 지역 안보 조약을 세우도록 압박하는 것이 우리의 최선의 이익입니다."
 USA_a_strong_east: "[ISR.GetFlag] [SAU.GetFlag] 보호받는 중동"
 USA_a_strong_east_desc: "중동에서 가장 가까운 두 동맹국인 사우디아라비아와 이스라엘은 이란군의 끊임없는 위협에 시달리고 있습니다. 이 지역의 동맹국들을 무장시키고 힘을 북돋우는 것이 우리의 최선의 이익입니다."
 USA_fighting_little_green_men: "[UKR.GetFlag] [MLV.GetFlag] [PMR.GetFlag] [SOV.GetFlag] 녹색 난쟁이들과의 싸움"
 USA_fighting_little_green_men_desc: "러시아군은 트란스니스트리아 같은 위성국을 통해 동유럽으로 너무 멀리 밀고 들어왔습니다. 몰도바인들에게 자국 영토의 주인은 러시아인이 아니라 자신들임을 알려 줄 때입니다."
 USA_push_iran: "[PER.GetFlag] 테헤란에 경고"
 USA_push_iran_desc: "이란은 지구가 도는 한 핵폭탄을 쫓아왔습니다. 우리가 나서지 않으면 실제로 무기를 손에 넣기까지 몇 달밖에 남지 않았다는 소문이 있습니다. 미리 압박하고 경고함으로써, 그들이 외교와 협상의 길로 나아가지 않을 경우 향후 개입을 정당화할 수 있습니다."
 USA_two_percent: "[GER.GetFlag] [ENG.GetFlag] [POL.GetFlag] 그 2%가 중요하다!"
 USA_two_percent_desc: "NATO의 동맹국들은 동맹 기준이 정한 가장 기본적인 지출 수준조차 충족하기를 거듭 거부해 왔습니다. 이제 어떤 방식으로든 그들에게 지출을 늘리도록 압박하기 시작할 때입니다. 그렇지 않으면 자업자득의 결과를 맞게 될 것입니다!"
 USA_tehrans_ultimatum: "[PER.GetFlag] [PER.capital.GetCapitalVictoryPointName]의 최후통첩"
 USA_tehrans_ultimatum_desc: "이란은 핵무기를 향해 질주하면 칼로 응징받을 것이라는 경고를 거듭 받아 왔습니다. 이란은 아직도 교훈을 얻지 못한 듯하며, 굴복할 때까지 두들겨 패야 합니다."
 USA_economic_destruction_of_beijing: "[CHI.GetFlag] [CHI.capital.GetCapitalVictoryPointName] 경제 파괴"
 USA_economic_destruction_of_beijing_desc: "중국은 너무 많이, 너무 빨리 발전했습니다. 이 성장을 당장 억제하기 위해 신속히 행동해야 하며, 그렇지 않으면 너무 늦을 수 있습니다. 우리는 서방과 보조를 맞추는 모든 국가가 중국에 대한 경제 보이콧에 참여하도록 하여 그들의 경제적 신제국주의가 신속히 막을 내리게 할 것입니다."
 USA_freedom_in_venezuela: "[VEN.GetFlag] 피로 얻는 자유"
 USA_freedom_in_venezuela_desc: "우리가 무엇을 시도했든, 바퀴벌레 같은 [VEN.GetLeader]은(는) 번번이 우리의 조준경을 빠져나갔습니다. 이제 마침내 그의 정권을 완전히 끝장낼 때입니다."
 USA_russian_reset: "[SOV.GetFlag] 러시아 리셋"
 USA_russian_reset_desc: "러시아 친구들과 화해하고 끝나지 않는 갈등에 매듭을 지을 때가 되었습니다. 관계 '재설정'을 추진함으로써 우리는 러시아에 해를 끼칠 뜻이 없으며 대화와 협상에 열려 있음을 증명할 것입니다."
 USA_intervention_in_libya: "[LBA.GetFlag] 리비아 개입"
 USA_intervention_in_libya_desc: "리비아 국가는 민간인을 보호할 기반시설이나 안보 장벽이 거의 없는 채 붕괴 직전에서 흔들리고 있습니다. 우리는 스스로 나서서 개입하고 이 지역의 질서를 회복하는 것을 도와야 합니다."
 USA_moving_in_on_africa: "[DRC.GetFlag] [SAF.GetFlag] [NIG.GetFlag] 아프리카 진출"
 USA_moving_in_on_africa_desc: "중국은 수년간 사실상 견제받지 않고 아프리카 시장과 내정에 접근해 왔으며, 이제 마침내 우리를 따라잡기 시작했습니다. 세계의 지배적 세력으로 남고자 한다면 중국의 영향력에 맞서고 우리 자신의 영향력을 행사해야 합니다."
 USA_another_10_trillion_to_israel: "[ISR.GetFlag] 강한 이스라엘, 강한 미국"
 USA_another_10_trillion_to_israel_desc: "이스라엘은 중동에서 우리와 가장 가깝고 어쩌면 유일한 동맹국이어서 우리 적들의 표적이 됩니다. 세계에서 우리 영향력의 기둥 하나를 잃지 않도록 이스라엘을 무장시키고 보호하는 데 가능한 모든 노력을 기울여야 합니다."
 USA_backing_ukraine: "[UKR.GetFlag] 우크라이나 지원"
 USA_backing_ukraine_desc: "러시아의 부당하고 불법적이며 도발적인 우크라이나 침공은 우리 정치인들 사이에 논쟁을 일으켰습니다. 고립주의를 지지하든 아니든, 우크라이나가 집어삼켜지는 것을 가만히 앉아 지켜보면 머지않아 워싱턴에서 러시아인들을 보게 될지도 모릅니다."
 USA_iraq_most_wanted: "이라크 최고 수배자"
 USA_iraq_most_wanted_desc: "£IRQ_Nat_Autocracy_small 바트당 국가 수뇌부는 중동 전역으로 흩어졌습니다. 사담 후세인과 그의 아들들을 포함한 도망자 네 명이 현재 [IRQ.GetFlag] 이라크에 숨어 있으며, 다른 네 명은 인접국으로 달아났습니다. [IRQ_dlc_check] 우리는 [IRQ.GetFlag] 이라크 내에서 §H바트당 사냥 작전§!을 수행하여 에이스 넷의 은신처를 찾아내야 합니다. 이들은 어느 주에든 있을 수 있으므로 수색은 광범위해야 합니다. 5년 이내에 도망자를 최소 네 명 제거하지 못하면 바트당의 대규모 반격이 일어납니다.\n"
 IRQ_la_res: "[IRQ.GetFlag] 이라크 인접국에 [IRQ.GetFlag] 이라크 바트당원들이 해당 국가의 허가 없이 도피해 있는지 확인하려면, 해당 국가 중 어느 곳에서든 최소 §H85% 네트워크 강도§!가 필요합니다. 확인되면 진입하여 그들을 체포할 수 있습니다."
 IRQ_influence: "[IRQ.GetFlag] 이라크 인접국에 [IRQ.GetFlag]  이라크 바트당원들이 해당 국가의 허가 없이 도피해 있는지 확인하려면, 해당 국가 중 어느 곳에서든 최소 §H20% 영향력§!이 필요합니다. 확인되면 진입하여 그들을 체포할 수 있습니다."
 USA_execute_saddam: "사담 후세인 처형"
 USA_execute_saddam_desc: "이 범죄자가 정의의 심판을 받게 할 때입니다. 그가 자국민에게서 박탈했던 바로 그 정의 말입니다."
 USA_execute_qusay: "쿠사이 후세인 처형"
 USA_execute_qusay_desc: "형만큼 광인은 아니지만, 쿠사이 역시 풀려나서는 안 되는 위험한 범죄자입니다."
 USA_execute_uday: "우다이 후세인 처형"
 USA_execute_uday_desc: "우다이는 악명 높은 행적이 입증하듯 완전한 괴물입니다. 그가 저지른 범죄는 어떤 돈으로도 씻을 수 없습니다."
 USA_execute_abid: "아비드 하미드 마무드 처형"
 USA_execute_abid_desc: "바트당의 중심인물인 아비드 하미드 마무드는 탄압당한 정치범들의 피로 손을 붉게 물들였습니다."
 USA_execute_majid: "알리 하산 알마지드 처형"
 USA_execute_majid_desc: "'화학자 알리'는 쿠르드 민족에 대한 제노사이드를 정당화하며 자신은 아무런 잘못도 하지 않았다고 일관되게 주장해 왔습니다."
 USA_execute_walter: "이자트 이브라힘 알두리 처형"
 USA_execute_walter_desc: "사담의 오른팔이었던 이브라힘 알두리는 셀 수 없이 많은 반인도적 범죄를 저질렀습니다. 그는 직간접적으로 수천, 어쩌면 수백만 명의 죽음에 가담했습니다."
 USA_execute_tilfah: "하니 압둘라티프 틸파 처형"
 USA_execute_tilfah_desc: "틸파는 1991년 봉기 당시 다수의 이라크인 살해에 가담한 혐의를 받고 있습니다. 다만 지금까지 증거는 불충분합니다."
 USA_execute_salih: "아지즈 살레 알누만 처형"
 USA_execute_salih_desc: "'더티 더즌'의 일원인 아지즈 살레는 셀 수 없이 많은 이라크인에 대한 고문과 살해에 책임이 있습니다."
 USA_SYR_baathists: "[SYR.GetFlag] 시리아의 이라크 바트당원 추적"
 USA_SAU_baathists: "[SAU.GetFlag] 사우디아라비아의 이라크 바트당원 추적"
 USA_JOR_baathists: "[JOR.GetFlag] 요르단의 이라크 바트당원 추적"
 USA_KUR_baathists: "[KUR.GetFlag] KDP 쿠르디스탄의 이라크 바트당원 추적"
 USA_PUK_baathists: "[PUK.GetFlag] PUK 쿠르디스탄의 이라크 바트당원 추적"
 USA_PER_baathists: "[PER.GetFlag] 이란의 이라크 바트당원 추적"
 USA_fugitive_countdown: "바트당의 반격"
 USA_fugitive_countdown_desc: "이 카운트다운이 끝날 때까지 바트당 수뇌부를 최소 4명 처형하지 못하면, 대규모 바트당 반격이 일어날 수 있다고 정보기관이 경고하고 있습니다."
 USA_close_this_menu: "바트당 작전 종료"
 USA_close_this_menu_desc: "바트당 표적에 대한 추적을 마무리할 때입니다. 우리는 필요한 목표를 달성했습니다."
 USA_SI_green_china_TT: "우리와의 관계가 §H0§! 이상이면 수락할 가능성이 §H더 높아집니다§!.\n\n이 조치의 전략적 중요성:\n - [CHI.GetFlag] §H중국§!이 녹색 에너지를 위해 여러 £oil_texticon §H유전§!을 §H포기§!하도록 만들면, 향후 그들이 군대에 효율적으로 보급하는 능력을 저해할 수 있습니다.\n - 그러나 약 §R$480b§!에 달하는 이 프로젝트의 비용 전액을 우리가 감당해야 합니다."
 USA_RU_transition_TT: "우리와의 관계가 §H0§! 이상이면 수락할 가능성이 §H더 높아집니다§!.\n\n이 조치의 전략적 중요성:\n - [SOV.GetFlag] §H러시아§!가 §G군사§! 산업을 줄이고 §H민간§! 산업을 늘리는 것이 이익이 된다고 설득하면, 그들의 §G군산 복합체§!를 약화시켜 분쟁 시 신속하게 무기를 생산하는 능력을 무력화할 수 있습니다. 러시아는 §H군수 공장 8개를 잃고 그 대가로 16개를 얻습니다§!.\n - 그러나 약 §R$120b§!에 달하는 이 프로젝트의 비용 전액을 우리가 감당해야 합니다."
 USA_somalia_intervention_TT: "세계 긴장도와 관계없이 [SOM.GetFlag] §H소말리아§!에 §H의용군§!을 파견할 수 있게 됩니다.\n\n이 조치의 전략적 중요성:\n - [SOM.GetFlag] §H소말리아§! 분쟁을 신속히 종결시키면, 해당 지역을 지나는 우리의 §H화물선§!과 무역에 대한 공격을 끝낼 수 있습니다.\n - 분쟁이 저절로 끝나기를 기다릴 수도 있지만 언제 끝날지는 알 수 없습니다. 분쟁이 계속되는 동안 §H우리 화물에 대한 공격이 계속됩니다§!."
 USA_sudan_intervention_TT: "[SSU.GetFlag] §H남수단§!에 [SUD.GetFlag] §H수단§!에 대한 방어 변동치를 부여합니다.\n - [KEN.GetFlag] §H케냐§!와 [TNZ.GetFlag] §H탄자니아§!가 의용군으로 [SSU.GetFlag] §H남수단§!을 지원하도록 압박할 수 있습니다.\n - [SUD.GetFlag] §H수단§! 영토를 급습하여\n[SSU.GetFlag] §H남수단§!을 지원할 수 있습니다.\n\n이 조치의 전략적 중요성:\n - [SUD.GetFlag] §H수단§!을 휴전으로 몰아넣으면 아프리카와 인접국에서 동방 진영의 세력을 약화시킬 수 있습니다."
 USA_sudan_intervention2_TT: "[KEN.GetFlag] §H케냐§!와 [TNZ.GetFlag] §H탄자니아§!에 의용군으로 [SSU.GetFlag] §H남수단§!을 지원하여 \n[SUD.GetFlag] §H수단§!이 평화 협정에 응하도록 압박할 것을 요청합니다. 관련된 모든 당사자에게 손실에 대한 보상으로 국고에서 §R$19.00§!를 지급합니다."
 USA_south_america_investments_TT: "우리와의 관계가 §H20§! 이상이면 수락할 가능성이 §H더 높아집니다§!.\n\n[BRA.GetFlag] §H브라질§!, [COL.GetFlag] §H콜롬비아§!, [CHL.GetFlag] §H칠레§!에서 §H귀금속§!을 채굴합니다. 각국에 §G$50B§!를 투자하며, 각국에서 약 §H20§! 단위 분량의 §H귀금속§!을 채굴합니다.\n\n - 우리는 10년 동안 이 금속을 통제하며, 그 이후에는 계약이 만료됩니다.\n - 계약이 만료되면 금속은 각 해당 국가가 통제하게 됩니다.\n\n이 조치의 전략적 중요성:\n - 이들 국가에 투자하면 일정 기간 동안 우리의 기존 §H귀금속§! 비축량을 §H두 배§! 이상으로 늘릴 수 있습니다."
 USA_georgian_peer_pressure_TT: "우리와의 관계가 §H20§! 이상이고 [SOV.GetFlag] §H러시아§!의 괴뢰국이 아니면 수락할 가능성이 §H더 높아집니다§!.\n\n이 조치의 전략적 중요성:\n - [GEO.GetFlag] §H조지아§!는 한동안 분리주의로 분열되고 고통받아 왔습니다. 이는 옛 소련 국가들에서 신 노릇을 하려는 크렘린의 신제국주의적 압박이 직접 낳은 부작용입니다.\n - 우리는 [SOO.GetFlag] §H남오세티아§!와 [ABK.GetFlag] §H압하지야§!를 되찾을 수 있도록 [GEO.GetFlag] §H조지아§!에 무기를 지원합니다.\n - [GEO.GetFlag] §H조지아§!에 우리의 최신 자유 수호 수단을 제공하는 것 외에도, 크렘린이 잘못된 수를 둘 경우 조지아를 대신해 개입하겠다는 보장을 줄 것입니다.\n - 크렘린이 우리를 자극하기로 한다면, [GEO.GetFlag] §H조지아§!에 대한 나토의 개입을 요청할 것이며, 최종 목표는 [SOV.GetFlag] §H러시아§!가 점령한 캅카스 지역 국가들의 해방입니다."
 USA_russian_defeat_TT: "모든 작전 목표가 달성되면 다음 지역이 독립합니다.\n - [DAG.GetFlag] 다게스탄\n - [CHE.GetFlag] 체첸\n - [ING.GetFlag] 인구셰티야\n - [KBK.GetFlag] 카바르디노발카리야\n - [KCC.GetFlag] 카라차예보체르케시야"
 USA_stalemate_TT: "가능한 결과:\n - [GEO.GetFlag] 조지아가 [ABK.GetFlag] 압하지야 또는 [SOO.GetFlag] 남오세티아를 장악하면, 해당 영토는 조지아의 통제하에 놓입니다.\n - [GEO.GetFlag] 조지아가 어떤 영토도 지켜내지 못하면, 분쟁 이전의 국경이 복원되고 크렘린은 영향력을 확대합니다."
 USA_bolstering_nato_TT: "모든 §C나토§! 동맹국의 각 주에 §HSHORAD 1기§! 부지를 건설합니다.\n\n이 조치의 전략적 중요성:\n - §C나토§! 동맹국에 첨단 SHORAD 부지를 갖춰 주면, 외세의 대규모 공습이 있을 경우 더 잘 대비할 수 있습니다.\n - 각 §C나토§! 국가에 대한 우리의 영향력이 크게 증가하여, 외세가 우리 동맹 내부에 균열을 만드는 것을 막을 수 있습니다."
 USA_belarus_decision_TT: "[BLR.GetFlag] §H벨라루스§! 정부를 축출하기 위해 움직입니다.\n\n이 조치의 전략적 중요성:\n - §H[BLR.GetLeader]§!을(를) 축출하면 동유럽에서 [SOV.GetFlag] §H러시아§!의 영향력이 심각하게 타격을 입고, 그들의 가장 가까운 동맹 중 하나가 무너집니다.\n - 크렘린의 코앞에 우호적인 [BLR.GetFlag] §H벨라루스§!를 두면 지역 전반에 §C나토§!의 영향력을 투사할 수 있습니다."
 USA_blr_coup_TT: "[BLR.GetFlag] [BLR.GetLeader] 축출"
 USA_blr_civilwar_TT: "[BLR.GetFlag] 벨라루스에서 내전 발발"
 USA_ven_civilwar_TT: "[VEN.GetFlag] §H[VEN.GetName]§!의 야권을 승인하고 §H확고한 결의 작전§!을 개시합니다.\n - §H[VEN.GetLeader]§!을(를) 생포하기 위한 새로운 §R특수 급습§!이 잠금 해제됩니다.\n\n이 조치의 전략적 중요성:\n - [VEN.GetFlag] §H베네수엘라§!는 오랫동안 우리 반구의 눈엣가시였습니다. 정권의 수뇌부를 제거하는 것이 민주적 전환으로 가는 가장 깔끔한 길입니다."
 USA_creates_new_russia_TT: "새로운 [RUS.GetFlag] 러시아 국가를 수립하기 위해 움직입니다.\n - [RUS.GetFlag] 러시아에서 우리가 점령한 영토를 잃을 수 있습니다.\n - 이 새로운 [RUS.GetFlag] 러시아는 나토의 일원이 됩니다.\n - 이 선택지를 택하지 않으면 예기치 못한 결과가 초래될 수 있습니다."
 USA_pacific_alliance_TT: "우리와의 관계가 §H20§! 이상이고 §B민주주의§! 국가이면 수락할 가능성이 §H더 높아집니다§!.\n\n이 조치의 전략적 중요성:\n - 태평양 지역은 갈수록 지배력을 키우는 §H[CHI.GetFlag] [CHI.GetName]§!의 영향권에 빠르게 들어가고 있으며, 이는 우리 정보기관을 우려하게 하기 시작했습니다.\n - §H[JAP.GetFlag] 일본§!과 §H[KOR.GetFlag] 한국§! 같은 다른 역내 주요 국가들이 이 커져가는 위협에 맞서 세력을 결성하도록 하면, §H[CHI.GetFlag] 중국§!의 역내 영향력을 크게 약화시키고 각국의 안전을 보장하는 방어 조약을 만들 수 있습니다."
 USA_arming_saud_TT: "이 조치의 전략적 중요성:\n - 오늘날 중동은 [ISR.GetFlag] §H이스라엘§!과 [SAU.GetFlag] §H사우디아라비아§! 같은 걸프 국가들을 제외하면 안정적인 역내 행위자가 거의 없는, 혼란스럽고 전쟁으로 얼룩진 지역이 되었습니다. 불안정을 초래하는 세력이 공격적인 파괴 작전에 나설 경우를 대비해, 이 몇 안 되는 국가들을 무장시키는 것이 필수적입니다."
 USA_backing_moldova_TT: "이 조치의 전략적 중요성:\n - §H[MLV.GetFlag] 몰도바§!와 §H[UKR.GetFlag] 우크라이나§!는 동유럽, 특히 구소련 국가들에 대한 모스크바의 영토회복주의적 접근의 희생자입니다. 우리는 이들 국가의 주권을 지지하고 자국 영토의 주인이 스스로임을 확인시켜 줄 것입니다.\n - 특히 우리의 모든 목표가 달성된다면, 역내 §H[SOV.GetFlag] 러시아§!의 영향력과 통제력을 크게 약화시킬 것입니다."
 USA_pressuring_iran_TT: "이 조치의 전략적 중요성:\n - §H[PER.GetFlag] 이란§!은 핵무기를 향해 질주하고 있으며 이는 의심의 여지가 없습니다. 우리는 §H[PER.GetFlag] 이란§!이 핵무기를 보유하는 것을 막기 위해 가능한 모든 수단을 동원해야 하며, 여기에는 그들의 경제가 급락하도록 제재하는 것도 포함됩니다.\n - 지금 경고를 발하면, 이란이 외교를 무시하고 가학적인 야욕을 계속 추구할 경우 향후 §H[PER.GetFlag] 이란§! 영토에 대한 공격을 정당화할 수 있습니다."
 USA_2_percent_TT: "이 조치의 전략적 중요성:\n - §C나토§! 국가들은 너무 오랫동안 미국의 원조에 무임승차해 왔으며, 이제는 지출을 늘리라고 요구하거나 다가올 정치적 파장을 감수하게 할 때입니다.\n - §C나토§! 동맹국들에게 지출을 늘리도록 압박하면 유럽 대부분이 일어서서 외세의 잠재적 침공에 대비할 수 있게 됩니다."
 USA_if_iran_loses_TT: "[PER.GetFlag] 이란이 패배할 경우:\n - [USA.GetFlag] 미국이 이란의 모든 주요 유전을 통제합니다.\n - [USA.GetFlag] 미국이 아부무사 섬들을 장악합니다.\n - [PER.GetFlag] 이란 정부가 UN의 통제하에 놓입니다."
 USA_if_iran_wins_TT: "[PER.GetFlag] 이란이 버텨낼 경우:\n - [PER.GetFlag] 이란 정부의 인기가 급상승합니다.\n - [USA.GetFlag] 미국이 중동에서 많은 영향력을 잃습니다.\n - [PER.GetFlag] 이란이 핵 프로그램을 확대할 수 있게 됩니다."
 USA_PER_war_TT: "이 조치의 전략적 중요성:\n - §H[PER.GetFlag] 이란§!은 핵 프로그램에 관한 협상을 너무 오래 끌어 왔습니다. 이제 우리가 직접 사태를 해결할 때입니다.\n - §H[PER.GetFlag] 이란§!을 무너뜨리거나 양보를 강요하는 데 성공하면, 그들은 더 이상 핵무기를 손에 넣을 수 없게 됩니다.\n - §H[PER.GetFlag] 이란§!에 대한 군사 행동이 불가피하다면, 이 지역에 다시 우호적인 §H[PER.GetFlag] 이란§!을 두게 될 가능성이 높습니다."
 USA_CHI_trade_war_TT: "우리와의 관계가 §H20§! 이상인 국가들은 수락할 가능성이 §H더 높아집니다§!.\n\n이 조치의 전략적 중요성:\n - §H[CHI.GetFlag] 중국§!은 세계에 대한 경제적 장악력을 서서히 키워 왔으며, 여기에는 우리 동맹국들과의 무역을 확대하여 그 수출이 우리를 능가할 정도에 이른 것도 포함됩니다. 이를 바꾸고 §H[USA.GetFlag] 미국§!의 경제적 패권을 다시 세울 때입니다.\n - 우리는 §H[CHI.GetFlag] 중국§!에 대한 무역 전쟁을 개시하고, §C서방 진영§! 국가들이 §H[CHI.GetFlag] 중국§! 정부와의 무역을 끊도록 할 것입니다.\n - 이는 §H[CHI.GetFlag] 중국§!의 경제에 심각한 타격을 주고 우리 경제를 강화할 것입니다."
 USA_beating_gaddafi_TT: "이 조치의 전략적 중요성:\n - 적대적인 §H[LBA.GetFlag] 리비아§!는 곧 적대적인 북아프리카를 의미합니다. 이 지역에 대한 어떤 형태의 통제력도 없다면, 세계의 중요한 거점을 잃을 수 있는 취약한 처지가 됩니다.\n - §H[LBA.GetFlag] 리비아§! 정부를 무너뜨림으로써, §H[LBA.GetFlag] 리비아§! 분쟁의 심각성에 따라 믿을 수 있고 안정적인 동맹국 하나 또는 여럿을 얻기를 기대합니다."
 USA_kicking_china_out_TT: "이 조치의 전략적 중요성:\n - §H[CHI.GetFlag] 중국§!은 아프리카 대부분에 대한 영향력을 빠르게 확대했습니다. 이는 이 지역과 세계 대부분에 대한 우리의 경제적 패권을 위협하며, 지금 행동하지 않으면 §H[CHI.GetFlag] 중국§!이 세계 초강대국으로서 우리를 추월할 수 있다는 뜻입니다.\n - 아프리카 전역에서 §H[CHI.GetFlag] 중국§!의 영향력을 공격하면 이 지역을 잠재적인 적대적 장악으로부터 구할 수 있습니다. 우리의 영향력이 §H[CHI.GetFlag] 중국§!의 자리를 대체한다는 부수적 이득도 있지만, 우리가 이 일을 하는 이유가 그것은 아니지 않습니까?"
 USA_russian_reset_TT: "우리와의 관계가 §H0§! 이상이면 수락할 가능성이 §H더 높아집니다§!.\n\n이 조치의 전략적 중요성:\n - 우리는 기억하는 한 오래전부터 §H[SOV.GetFlag] 러시아§!와 경쟁 관계였으며, 양국 간 공식 조약을 체결하려는 노력은 거의 없었습니다.\n - 관계를 '재설정'함으로써 더 나은 미래를 기대하며 세계의 긴장을 완화할 수 있습니다.\n - 조약의 일환으로 핵무기와 운반 수단의 군축을 요구하여, 세계의 핵무기 수를 크게 줄일 것입니다."
 USA_support_ISR_TT: "이 조치의 전략적 중요성:\n - [ISR.GetFlag] §H이스라엘§!은 외국, 특히 중동과 북아프리카 국가들의 공격에 취약합니다. 그들의 상황을 외면하기로 한다면 그들은 공격의 희생양이 될 수 있습니다.\n - [ISR.GetFlag] §H이스라엘§!을 군사적으로 지원하면 강력한 동맹을 얻을 뿐 아니라 그들에 대한 상당한 영향력도 얻게 되어 영향력을 훨씬 쉽게 확산시킬 수 있습니다. "
 department_of_state.60.t: "미국, 군사비 증액 요구"
 department_of_state.60.d: "미국 대통령 [USA.GetLeader]이(가) 우리에게 동맹 기준이 정한 최소 2%를 충족하도록 군사비를 증액할 것을 요구했습니다. 미국은 우리가 증액을 거부할 경우 경제적 보복을 하겠다고 위협하고 있습니다. "
 department_of_state.60.a: "선택의 여지가 없습니다"
 department_of_state.60.b: "절대 안 됩니다"
 department_of_state.61.t: "[FROM.GetName]이(가) 기준 충족을 거부"
 department_of_state.61.d: "[FROM.GetName]이(가) 군사비 증액에 대한 우리의 요구를 충족하지 못했으며, 이에 백악관에서는 분노가 일고 있습니다. 그 대가로 모종의 조치를 검토하고 있으나 아직 결정되지 않았습니다."
 department_of_state.61.a: "관세를 부과하라!"
 department_of_state.61.b: "어차피 허세였다"
 department_of_state.62.t: "워싱턴의 최후통첩 전달"
 department_of_state.62.d: "미국이 우리에게 선택을 제시했습니다. 미군이 이란에 진입하여 우리의 핵 기술을 해체하고 감시하도록 허용하거나, 전장에서 그들을 맞이하는 것입니다. 이는 우리가 아무리 협상하려 해도 그들이 결국 원하는 대로 할 것임을 보여주는 미국의 침략과 제국주의의 또 다른 징후입니다."
 department_of_state.62.a: "좋다, 들여보내라"
 department_of_state.62.b: "군에 대비 태세를 갖추도록 명령한다"
 department_of_state.63.t: "이란, 우리의 조건을 거부"
 department_of_state.63.d: "거의 자살행위에 가까운 행보로, 이란 정부는 이번 주 초에 우리가 발부한 공식 최후통첩을 찢어 버리기로 결정했습니다. 이는 그들이 핵 프로그램을 계속하려는 의도임을 거의 확실하게 의미하며, 우리는 직접 사태를 해결하는 것 외에 선택지가 없습니다."
 department_of_state.63.a: "이란, 큰 실수를 했구나"
 department_of_state.63.b: "허세였다"
 department_of_state.64.t: "이란, 양보"
 department_of_state.64.d: "그다지 놀랍지 않은 행보로, 이란 정부는 오늘 미국의 요구를 받아들여 미국 전문가들이 핵 프로그램을 해체하도록 허용하겠다고 발표했습니다."
 department_of_state.64.a: "현명한 판단이다, 이란"
 department_of_state.65.t: "이란군 동원"
 department_of_state.65.d: "이란군은 오늘 자국 영토에 대한 미국의 어떠한 침략에도 맞서기 위해 전국의 모든 부대에 총동원령을 선포했습니다. 이 조치는 미국이 이란에게 핵 기술을 해체하기 위한 감시단과 전문가의 입국을 허용하라고 요구한 데 따른 것입니다. 이 요구는 당연히 거부되었으며, 미국 정부의 즉각적인 대응을 불러왔습니다. 미국 의회는 오늘 이란 영토에 대한 공격을 승인했으며, 수십 년 동안 미국 사회에서 반전 정서가 높았던 만큼 이는 온 나라에 충격을 주었습니다."
 department_of_state.65.a: "이란 침공이라고? 미쳤군"
 department_of_state.65.b: "제국주의의 독수리가 다시 한번 희생자를 노린다"
 department_of_state.66.t: "미군, 이란에서 철수"
 department_of_state.66.d: "[USA.GetLeader]은(는) 오늘 굴욕적인 기자회견에서 이란으로부터의 전면 철수와 양국 간의 즉각적인 휴전을 요청한다고 발표했습니다. 미군이 작전 목표를 거듭 달성하지 못하여 이란의 험준한 지역에서 교착 상태에 빠진 데 따른 것입니다. 높은 사상자 수와 과도한 비용도 이 조치의 원인이 되었으며, 대중의 압력이 분쟁에 대한 지속적인 지지에 부담을 주었습니다. 이란 국영 매체와 방송은 이미 승리를 축하하기 시작했으며 새롭게 높아진 인기와 지지의 물결을 타고 있습니다. 또한 이란이 핵 야망에 대한 전쟁 이전의 입장을 계속 유지할 것이라고 보도되었으며, 이는 이번 분쟁이 불필요한 유혈 사태 외에는 거의 아무것도 이루지 못했음을 의미합니다."
 department_of_state.66.a: "누가 이럴 줄 알았겠는가?"
 department_of_state.67.t: "이란군, 미국의 압박에 붕괴"
 department_of_state.67.d: "오늘 이른 시간에 이란군 공식 대변인이 분쟁에 대한 공식 항복 조건을 발표하고 즉시 작전을 중단하도록 명령하는 데 동의했습니다. 이 발표로 이란 정부는 붕괴했으며, 여러 고위 관료가 오늘 세계 곳곳으로 도피했습니다. 항복 조건에 따라 이란군은 해체되지 않지만, 적절한 대체 정부가 마련될 때까지 다른 이란 정부 자산과 함께 UN의 감독 아래에 놓이게 됩니다."
 department_of_state.67.a: "이란은 분열할 것인가?"
 department_of_state.68.t: "이란에 대한 승리"
 department_of_state.68.d: "이란에서의 승리는 우리가 빈손으로 돌아가지 않는다는 것을 의미합니다. 우리는 이란 유전 주변에 보안 구역을 설정했으며, 올해 후반에 사업을 시작하도록 여러 대기업과 계약을 체결했습니다. 또한 해군력을 더욱 투사하기 위한 수단으로 호르무즈 해협의 전략적으로 중요한 아부무사 섬들을 장악했습니다."
 department_of_state.68.a: "핵무기는 검은 황금만큼 중요하지 않다"
 department_of_state.69.t: "침략자에 대한 승리"
 department_of_state.69.d: "우리는 불가능을 극복하고 침공한 미군을 물리쳤습니다. 오늘은 앞으로 수 세기 동안 승전의 날로 기념될 것입니다."
 department_of_state.69.a: "전진!"
 department_of_state.70.t: "권력에 오른 레자 팔레비"
 department_of_state.70.d: "UN 이란 임무단은 레자 팔레비에게 국가의 통제권을 부여하기로 결정했습니다. 이 조치는 우리 정부와 여러 동맹국 전반에서 폭넓은 지지를 받고 있습니다."
 department_of_state.70.a: "알겠다"
 department_of_state.71.t: "호라산의 반란"
 department_of_state.71.d: "미국의 졸속 침공이 호라산에서 봉기를 불러일으킨 것으로 보이며, 이는 국가 전체가 붕괴하고 이란이 다시 한번 급진적 시아파 통치 아래 놓일 위험을 초래하고 있습니다."
 department_of_state.71.a: "젠장"
 department_of_state.71.b: "좋다.. (이쪽으로 플레이)"
 department_of_state.72.t: "이란 동부의 반란"
 department_of_state.72.d: "오늘 이른 시간에 이란 호라산 지역의 마슈하드와 여러 도시에서 총성이 울려 주민들과 평화유지군이 동요했습니다. 미국의 침공 이후 반란에 대한 소문이 퍼져 왔으며, 전직 IRGC 장교와 부대가 시골에 은신한 성직자들의 느슨한 연합 아래 결집하고 있었습니다. 이들은 이달 말까지 병력을 이끌고 테헤란으로 진군하겠다고 맹세한 급진적 아야톨라 모함마드타기 메스바흐야즈디 아래 공식적으로 결집한 것으로 보입니다. 책임 소재를 두고 사방에서 손가락질이 이어지고 있지만, 주된 비난은 미국에 쏟아지고 있으며, 졸속 평화 프로세스를 수립하고 지금 보는 것과 같은 반란을 막는 데 필요한 안보 조치를 마련하지 않았다는 비판을 받고 있습니다."
 department_of_state.72.a: "이런 젠장"
 department_of_state.73.t: "미국, 중국과의 거래 축소 요청"
 department_of_state.73.d: "미국 정부가 수십 개 국가에 중국과의 모든 무역 및 경제 협력을 즉시 중단할 것을 요청하는 공식 서한을 발송했습니다. 미국은 단기간 동안 우리가 약소국에 대한 부채의 덫을 비롯한 중국의 신제국주의와 불투명한 관행에 대한 전 세계적 항의에 동참해야 한다고 밝혔습니다."
 department_of_state.73.a: "중국은 자신들의 행동에 대가가 따른다는 것을 배워야 한다"
 department_of_state.73.b: "우리의 중국 친구들을 화나게 하지 않겠다"
 department_of_state.74.t: "미국, 위험한 무역 전쟁을 시작"
 department_of_state.74.d: "미국이 오늘 이른 시간에 수십 개 국가에 우리나라와의 모든 경제 활동을 즉시 중단할 것을 요청하는 서한과 요구를 보냈습니다. 이 조치는 미국인들의 사악하고 시기심 많으며 권력에 굶주린 본성을 보여줍니다. 우리는 누가 우리와 우리의 신뢰를 배신하는지 기록할 것이며, 미국이 우리에게 안기려 한 굴욕을 잊지 않을 것입니다."
 department_of_state.74.a: "미국, 대체 무슨 짓이냐?"
 department_of_state.75.t: "내전에 휩싸인 베네수엘라"
 department_of_state.75.d: "장기간의 정보 평가 끝에, 미국은 민주주의를 지향하는 베네수엘라 반군이 머지않아 [VEN.GetLeader] 정권에 맞서 봉기할 것이라고 예측했습니다. 예상대로 그들의 예측은 적중했고 미국이 예측한 결과와 거의 완벽하게 일치했습니다. 이 소름 끼치는 정확성 때문에 일각에서는 미국이 지금 베네수엘라를 집어삼키고 있는 혼란의 배후에 있다고 믿고 있습니다. 레오폴도 로페스를 중심으로 단결한 야권 세력이 베네수엘라 집권 체제를 상대로 전면전을 벌이고 있습니다. 미국은 반군 세력을 지원하겠다고 서약하며, 베네수엘라 정권의 전복은 타협할 수 없는 목표라고 밝혔습니다."
 department_of_state.75.a: "또 하나의 나라가 한낱 전장이 되어간다"
 department_of_state.75.b: "서방의 탐욕에는 끝이 없다"
 department_of_state.76.t: "미국과 중국 사이에 무역 전쟁 발발"
 department_of_state.76.d: "이번 주 초 [USA.GetLeader]은(는) 중국 국가에 대한 미국의 불만 사항을 열거한 여러 문서의 공개를 승인했습니다. 이 문서들의 주요 쟁점은 중국의 '경제적 제국주의'에 대한 미국의 우려였습니다. 문서 공개에 이어 미국은 전 세계 수십 개국에 중국과의 경제 협력을 줄이고 대신 '더 믿을 만한 실적'을 가진 국가들로 선회할 것을 공식 요청했습니다. [CHI.GetLeader]은(는) 이 조치를 비난하며 유치하다고 일축하는 성명을 발표했습니다."
 department_of_state.76.a: "그래도 내 해외 계좌는 아직 안전하다"
 department_of_state.76.b: "골치 아픈 미국 놈들"
 department_of_state.77.t: "관계 '재설정'을 원하는 미국"
 department_of_state.77.d: "미국 정부가 우리에게 와서 그들의 '재설정' 의제에 동참할 것을 요청했습니다. 이 움직임은 갑자기 나온 것이 아니라 수개월 동안 미국 정치인들 사이에서 논의되고 토론되어 왔습니다. 하지만 이제 그들은 마침내 결심을 굳힌 것으로 보이며, 우리가 그들의 조약에 서명하는 데 그 어느 때보다 단호한 모습입니다. '재설정' 프로그램의 핵심 축은 핵무기와 운반 수단의 군축이며, 우리 국내에서는 많은 이들이 이를 꺼리고 있습니다. 그러나 미국은 우리가 조약에 서명하고 언론 앞에 선다면 자신들도 뒤따라 비축량의 일부를 군축하겠다고 약속했습니다."
 department_of_state.77.a: "좋다, 서명하겠다"
 department_of_state.77.b: "그런 단계는 한참 지났다, 미국"
 department_of_state.78.t: "미국, 리비아에 개입"
 department_of_state.78.d: "미국 정부는 리비아의 통치자 [LBA.GetLeader]을(를) 축출하는 것을 돕기 위해 리비아에 대한 개입을 시작하는 것이 자국의 최선의 이익이라고 판단했습니다. 미국은 지상에 병력을 상륙시키고 있으나 그 수는 많지 않습니다. 이 병력은 주로 평화 유지를 돕고 [LBA.GetLeader]의 병력에 맞서 싸우기 위해 파견되었습니다. 본국에서는 반전 시위대와 고립주의자들이 '안정'을 위해 미국이 다른 나라의 분쟁에 개입해서는 안 된다고 믿으며 이 조치를 강력히 비판하고 있습니다. 그럼에도 미국 대통령 [USA.GetLeader]은(는) 더 이상의 유혈 사태가 발생하지 않도록 하기 위해 필요한 조치라고 주장하고 있습니다."
 department_of_state.78.a: "알겠다, 그렇게 주장한다면"
 department_of_state.79.t: "미국, 아프리카에서 우리의 영향력에 심각한 타격"
 department_of_state.79.d: "미국이 아프리카에서 우리의 모든 영향력을 몰아내기 위한 대규모 캠페인을 개시했습니다. 이를 위해 상당한 규모의 작전을 수행했으며, 우리가 영향력을 갖고 있던 모든 국가가 영향을 받았습니다."
 department_of_state.79.a: "빌어먹을 놈들"
 department_of_state.80.t: "러시아, 관계 '재설정'에 동의!"
 department_of_state.80.d: "러시아 정부가 외교 관계를 '재설정'하는 데 동의했으며, 핵무기 비축량의 일부를 군축하기로 합의했습니다. 약속한 대로 우리 역시 비축량의 일부를 군축해야 합니다. 또한 이번 주 후반에 러시아 지도부와 만나 이 조치를 공개적으로 발표할 예정입니다."
 department_of_state.80.a: "좋다!"
 department_of_state.81.t: "러시아, 관계 '재설정'을 거부!"
 department_of_state.81.d: "러시아 정부는 관계 '재설정'에 관심이 없는 것으로 보이며, 현재 양국 관계는 회복이 불가능한 지경이라고 밝혔습니다. 또한 지도부가 끊임없이 바뀌는 우리 정부는 신뢰할 수 없다고 주장했습니다."
 department_of_state.81.a: "뭔가 꿍꿍이가 있는 게 분명하다.."
 department_of_state.82.t: "미국과 러시아, 관계 '재설정'"
 department_of_state.82.d: "오늘 러시아와 미국 외무장관이 주최한 기자회견에서 미국과 러시아가 공식적으로 관계를 '재설정'한다는 발표가 있었습니다. '재설정'이라는 단어가 적힌 버튼을 양측이 함께 들고 동시에 눌러 두 경쟁 강대국 간 관계의 공식 재설정을 상징했습니다. 수십 년 동안 미국과 러시아는 세계를 판으로, 개별 국가들을 말로 삼아 끝없는 체스 게임을 벌이며 정면으로 맞서 왔습니다. 오늘은 희망이 보이는 듯합니다. 더 밝은 미래에 대한 희망, 핵 문제의 평화적 해결에 대한 희망, 그리고 세계 강대국 간 협력에 대한 희망입니다. 다만 이 구상이 무산되어 세계가 관계 '재설정' 이전의 적대 단계로 돌아갈 수도 있다는 점은 짚어 두어야 합니다."
 department_of_state.82.a: "인류를 위한 엄청난 진전이다!"
 department_of_state.83.t: "미국, 군사 지원 제공"
 department_of_state.83.d: "미국은 적대 국가들의 희생양이 되는 것에서 이스라엘을 구할 수 있는 것은 오직 미국의 전문성뿐이라고 주장하며, 사실상 우리 부대를 대신 훈련해 주겠다고 제안했습니다."
 department_of_state.83.a: "알겠다"
 department_of_state.83.b: "아니요"
 department_of_state.84.t: "나토, 우크라이나에 무장 지원 개시"
 department_of_state.84.d: "미국을 포함한 여러 나토 회원국이 나서서 우크라이나에 대한 전면적이고 무조건적인 지지를 선언했습니다. 이들은 러시아의 침략으로 인해 국제 사회에 법과 질서가 있음을 모스크바에 보여주기 위해 우크라이나에 즉시 무기를 보내는 것 외에 선택지가 없다고 밝히고 있습니다. 러시아 정부는 이 조치가 도발적이며 전쟁으로 이어질 수 있다고 밝혔으나, 서방 지도자들은 이에 대한 [SOV.GetLeader]의 허세를 간파하고 있습니다. 우크라이나 지도자 [UKR.GetLeader]은(는) 러시아의 침략에 맞서 우크라이나의 독립을 지지하는 것은 '마땅한 일'이라며 이 조치를 지지했습니다."
 department_of_state.84.a: "우크라이나에게는 스스로를 방어할 권리가 있다!"
 department_of_state.84.b: "우크라이나는 체스 게임의 한낱 말일 뿐이다"
 department_of_state.85.t: "미국, 우크라이나에 대한 일방적 지원 요청"
 department_of_state.85.d: "우크라이나는 러시아의 공격을 받고 있으며, 미국은 오직 동맹으로서의 나토만이 러시아의 전쟁 기계를 멈추는 데 도움이 될 수 있다고 밝히고 있습니다. 우리 역시 우크라이나 외국인 부대의 일원으로서 우크라이나군을 군사적으로 지원할 외국인 의용군을 보내 달라는 요청을 받고 있습니다."
 department_of_state.85.a: "즉시 실행하겠다!"
 department_of_state.85.b: "아니요"
 department_of_state.86.t: "러시아에 대한 핵폭격"
 department_of_state.86.d: "말로 할 수 없는 일이 벌어졌습니다. 오늘 이른 시간에 미국의 핵미사일 여러 발이 사일로에서 발사되어 연합군이 점령하지 않은 러시아의 주요 도시들을 향했고 이를 초토화했습니다. 사망자 수는 공식적으로 집계되지 않았지만, 피격된 도시들은 방사능에 오염되어 사실상 사람이 살 수 없는 곳이 되었다고 합니다. 수십 년에 걸친 냉전 외교는 헛된 것이 되었고 많은 도시가 폐허로 남았습니다. 크렘린의 대응이 예상됩니다."
 department_of_state.86.a: "\\"제4차 세계대전은 막대기와 돌멩이로 치러질 것이다\\""
 department_of_state.87.t: "미국에 대한 핵폭격"
 department_of_state.87.d: "말로 할 수 없는 일이 벌어졌습니다. 오늘 이른 시간에 러시아의 핵미사일 여러 발이 사일로에서 발사되어 그들의 병력이 점령하지 않은 미국의 주요 도시들을 향했고 이를 초토화했습니다. 사망자 수는 공식적으로 집계되지 않았지만, 피격된 도시들은 방사능에 오염되어 사실상 사람이 살 수 없는 곳이 되었다고 합니다. 수십 년에 걸친 냉전 외교는 헛된 것이 되었고 많은 도시가 폐허로 남았습니다. 워싱턴의 대응이 예상됩니다."
 department_of_state.87.a: "\\"제4차 세계대전은 막대기와 돌멩이로 치러질 것이다\\""
 department_of_state.88.t: "유럽에 대한 핵폭격"
 department_of_state.88.d: "말로 할 수 없는 일이 벌어졌습니다. 오늘 이른 시간에 러시아의 핵미사일 여러 발이 사일로에서 발사되어 그들의 병력이 점령하지 않은 유럽의 주요 수도들을 향했고 이를 초토화했습니다. 사망자 수는 공식적으로 집계되지 않았지만, 피격된 도시들은 방사능에 오염되어 사실상 사람이 살 수 없는 곳이 되었다고 합니다. 수십 년에 걸친 냉전 외교는 헛된 것이 되었고 많은 도시가 폐허로 남았습니다. 이들 국가의 대응이 예상됩니다. 러시아에 맞선 분쟁에 참여한 국가들만 피격된 것으로 알려졌습니다."
 department_of_state.88.a: "\\"제4차 세계대전은 막대기와 돌멩이로 치러질 것이다\\""
 department_of_state.89.t: "핵 공격을 받은 우리의 수도!"
 department_of_state.89.d: "오늘 러시아의 ICBM이 우리 수도를 강타하여 도시에 헤아릴 수 없는 파괴를 초래했습니다. 이 지역은 방사능에 오염되었고 그 결과 많은 이들이 사망했습니다. 전체 사망자 수는 현재까지 알려지지 않았습니다."
 department_of_state.89.a: "빌어먹을 러시아 놈들!"
 department_of_state.90.t: "핵 공격을 받은 이스탄불!"
 department_of_state.90.d: "오늘 러시아의 ICBM이 이스탄불을 강타하여 도시에 헤아릴 수 없는 파괴를 초래했습니다. 이 지역은 방사능에 오염되었고 그 결과 많은 이들이 사망했습니다. 전체 사망자 수는 현재까지 알려지지 않았습니다."
 department_of_state.90.a: "빌어먹을 러시아 놈들!"
 department_of_state.91.t: "러시아 ICBM에 여러 도시 피격"
 department_of_state.91.d: "우리의 주요 도시 여러 곳이 러시아 ICBM에 피격되었습니다. 피격된 도시는 워싱턴 D.C., 로스앤젤레스, 뉴욕, 마이애미, 오스틴입니다. 이 도시들은 방사능에 오염되었으며 피해 규모는 현재까지 알려지지 않았습니다."
 department_of_state.91.a: "빌어먹을 러시아 놈들"
 department_of_state.92.t: "미국 ICBM에 여러 도시 피격"
 department_of_state.92.d: "우리의 주요 도시 여러 곳이 미국 ICBM에 피격되었습니다. 피격된 도시는 모스크바, 상트페테르부르크, 볼고그라드, 예카테린부르크, 케메로보입니다. 이 도시들은 방사능에 오염되었으며 피해 규모는 현재까지 알려지지 않았습니다."
 department_of_state.92.a: "빌어먹을 미국 놈들"
 saddam_TT: "§H스페이드 에이스§!\n사담 후세인 알티크리티\n대통령\n\n§g사담은 2개월마다 은신처를 옮깁니다!§!"
 qusay_TT: "§H클럽 에이스§!\n쿠사이 사담 후세인\n사담 후세인의 아들"
 uday_TT: "§H하트 에이스§!\n우다이 사담 후세인\n사담 후세인의 아들"
 abid_TT: "§H다이아몬드 에이스§!\n아비드 하미드 마무드\n대통령 비서관"
 majid_TT: "§H스페이드 킹§!\n알리 하산 알마지드 '화학자 알리'\n대통령 고문/혁명지휘평의회 위원"
 walter_TT: "§H클럽 킹§!\n이자트 이브라힘 알두리\n혁명지휘평의회 부의장"
 tilfah_TT: "§H하트 킹§!\n하니 압둘라티프 틸파\n국장: 특별보안기구"
 salih_TT: "§H다이아몬드 킹§!\n아지즈 살레 알누만\n바트당 지부 지휘 의장"
 IRQ_kill_3_baathists_TT: "바트당 지도자가 최소 4명 체포되어 처형됨"
 raid_type_raid_baath: "바트당 표적 추적"
 USA_foreign_policy: "국무부"
 USA_foreign_policy_desc: "[USA.GetFlag] 미국 국무부는 1789년 행정부의 행정 기관으로 설립되었습니다. 정부 내에서 가장 강력한 기관 중 하나로 여겨지는 국무부는 국무장관이 이끌며, [USA.GetFlag] 미국 대통령에게만 직접 보고하고 외교 업무를 담당합니다.\n\n선거가 있을 때마다 해당 후보를 위한 새로운 결정들이 잠금 해제됩니다. 이전의 결정들은 새 선거와 함께 사라지며, 세계의 특정 변화에 따라 새로운 결정이 나타날 수도 있습니다."
 USA_doing_decision: " 다른 결정을 수행 중"
 USA_KUW_baathists: "[KUW.GetFlag] 쿠웨이트의 이라크 바트당원 추적"
 department_of_state.94.t: "탈레반, 공세 재개"
 department_of_state.94.d: "탈레반은 오늘 [AFG.GetLeader] 정부에 대한 공세를 재개하겠다고 발표했습니다. 현 행정부에 가해진 국내 압력으로 인한 미국의 성급한 철군 이후이므로 이 움직임은 놀랍지 않습니다. 남은 것은 훨씬 더 흉포한 적에 맞서 홀로 방어해야 하는 분열되고 만신창이가 된 약화된 아프가니스탄입니다. 여러 국가가 필요할 경우 아프가니스탄의 방어를 다시 돕겠다고 맹세했지만, 그들의 말은 그러한 약속을 이행하려는 의지만큼의 가치밖에 없습니다. 아프가니스탄 정부가 탈레반을 단독으로 저지할 수 있을지는 아직 알 수 없으나, 군이 별다른 저항을 하지 못할 가능성이 높습니다."
 department_of_state.94.a: "아프가니스탄 정부는 다시 한번 무너질 것인가?"
 department_of_state.200.t: "아프가니스탄 사상자 보고"
 department_of_state.200.d: "우리는 아프가니스탄 전투에서 용감한 남녀 장병들을 잃었으며, 그들의 관이 정중한 장례를 위해 미국으로 돌아오고 있습니다."
 department_of_state.200.a: "셈퍼 파이"
 department_of_state.31.c: "어차피 무엇이든 해서 무슨 소용이 있는가"
 department_of_state.95.t: "키드급 구축함 판매"
 department_of_state.95.d: "최근 [USA.GetName]이(가) 몇 년 전 퇴역한 키드급 구축함을 우리에게 판매하겠다고 제안했습니다. 이 함정들은 원래 이란 제국 해군이 주문했으나 1979년 이란 혁명으로 취소된 강력한 유도미사일 구축함 시리즈입니다. 이후 이 함정들은 판매를 위해 미 해군의 퇴역 비축분에서 현대화되고 재가동되었습니다. 본토가 우리나라를 침공할 경우에 대비해 입지를 강화하기 위해 이 함정들을 구매해야 할까요?"
 department_of_state.95.a: "수표에 서명한다"
 department_of_state.95.b: "넘기겠다"
 USA_sale_of_the_kidd_destroyer: "[TAI.GetFlag] [TAI.GetName]에 키드급 구축함 판매"
 USA_sale_of_the_kidd_destroyer_desc: "우리는 키드급 구축함을 팔기 위해 애써 왔는데, [TAI.GetNameWithFlag]이(가) [CHI.GetNameWithFlag]에 맞선 방어 전략에 도움이 되도록 이 함선들을 구매하는 데 관심을 보였습니다."
 department_of_state.96.t: "확고한 결의 작전: 성공"
 department_of_state.96.d: "대통령이 상황실에서 지켜보는 가운데, 특수부대가 베네수엘라의 독재자 니콜라스 마두로의 관저를 급습했습니다. 그가 안전실로 도피를 시도하던 중 신속하게 붙잡은 미군은 그를 비행기에 태워 미국 본토로 이송했습니다. 그는 미국 법정에서 재판을 받고 마약 혐의에 따른 형을 선고받을 것으로 예상됩니다. 급습 전체는 불과 몇 시간 만에 끝난 것으로 알려졌습니다."
 department_of_state.96.a: "3시간짜리 작전은 이렇게 하는 것이다"
 department_of_state.97.t: "미국, 급습 감행"
 department_of_state.97.d: "미국이 노골적인 전쟁 행위를 저질렀습니다. 그들은 우리나라에 폭격을 가했고 우리 대통령을 납치했습니다. 이러한 행위는 응징 없이 넘어가서는 안 되며, 우리 군은 어떠한 점령 시도에도 저항할 준비를 점점 갖추고 있습니다. 그러나 미국은 우리가 협력한다면 추가 행동을 자제하겠다고 제안했습니다. 다만 협력한다면 그들이 일시적으로 국가를 통제하도록 허용하는 것을 의미합니다."
 department_of_state.97.a: "우리는 무릎 꿇지 않겠다!"
 department_of_state.97.b: "선택의 여지가 없다, 어쩔 수 없다"
 department_of_state.98.t: "미국, 베네수엘라 지도자를 체포"
 department_of_state.98.d: "미국이 남미의 산유국 베네수엘라에 대한 야간 급습을 감행했습니다. 이 조치는 베네수엘라 지도자가 마약 확산을 방조하여 지역을 불안정하게 만드는 요인이라는 미국 대통령의 수주에 걸친 비난 끝에 나온 것입니다. '확고한 결의 작전'이라는 암호명이 붙은 이번 급습은 성공했으며, 베네수엘라의 장기 독재자 니콜라스 마두로가 체포되었습니다. 미국은 권력 이양을 어떻게 추진할 것인지 구체적으로 밝히지 않았지만, 이제 자신들이 주도권을 쥐고 있음을 매우 분명히 했으며, 후임이 정해질 때까지 베네수엘라 정부의 잔존 세력에게 협조할 것을 요구하고 있습니다."
 department_of_state.98.a: "우려스러운 사태이다"
 raid_type_USA_raid_venezuela: "확고한 결의 작전"
 raid_type_USA_raid_venezuela_desc: "이 작전의 목표는 베네수엘라 지도자를 붙잡아 재판을 받게 하기 위해 안전하게 미국으로 데려오는 것입니다. 정보기관은 상황이 악화될 경우 권력 공백으로 인해 반란이 시작될 수 있다고 경고했습니다."
 USA_invasion_in_iraq_mission: "이라크 침공"
 USA_invasion_in_iraq_mission_desc: "기다릴수록 이라크를 침공할 명분은 점점 약해집니다. 침공을 강행하고자 한다면 내년 안에 침공해야 하며, 그렇지 않으면 전쟁 명분이 더는 유효하지 않게 됩니다."
 USA_failed_to_invade_iraq_idea: "국가적 굴욕"
 USA_failed_to_invade_iraq_idea_desc: "근본적인 이유가 무엇이든 이라크에 대한 군사 작전을 개시하지 못한 우리의 실패는 테러 공격에 대한 응징 없이 남아 있음을 의미합니다. 이러한 무대응은 우리의 신뢰를 심각하게 훼손하고 앞으로 수년간 적들을 대담하게 만들 것입니다."
 USA_early_2000s_energy_crisis: "에너지 위기"
 USA_early_2000s_energy_crisis_desc: "세계 석유 시장의 혼란과 중동의 불안정으로 사람들이 최선의 가격과 휘발유를 찾으면서 소비가 급증했고, 이는 역으로 석유 및 석유 기반 제품의 소비 증가로 이어져 추가적인 부족과 문제를 일으키고 있습니다."
 usa_economic_events.36.t: "대불황의 여파"
 usa_economic_events.36.d: "미국 언론과 경제는 분 단위로 점점 더 충격적인 수치를 보도하고 있습니다. 붕괴는 세계 경제의 핵심과 토대를 계속해서 뒤흔들며 아르헨티나에서 그리스, 뉴질랜드에 이르기까지 곳곳에 파문을 일으키고 있습니다. 전 세계 누구도 이 소대공황의 영향을 받지 않은 이가 없습니다. 이 피해가 얼마나 멀리 미칠지는 시간이 말해 줄 것입니다..."
 usa_economic_events.36.a: "유동성을 투입하라!"
 usa_economic_events.36.b: "자유 시장은 자유로워야 한다..."
 usa_economic_events.37.t: "미국 자동차 산업 위기"
 usa_economic_events.37.d: "이미 판매 감소와 누적되는 부채로 어려움을 겪고 있던 자동차 산업은 신용 위기가 심화되면서 이제 파국적인 붕괴에 직면했습니다. 빅3 자동차 제조사(제너럴 모터스, 포드, 크라이슬러)는 수십억 달러를 쏟아내며 출혈을 겪고 있으며, 정부의 즉각적인 개입이 없다면 몇 달 안에 파산에 몰릴 수 있다고 경고하고 있습니다. 디트로이트뿐만 아니라 전국에 걸친 공급망 전체에서 수천 개의 일자리가 위태로운 상황입니다. 이제 문제는 워싱턴이 많은 이들이 미국 제조업 역량의 상징으로 여기는 산업을 구제할 것인지, 아니면 시장의 힘이 그 운명을 결정하게 놔둘 것인지입니다..."
 usa_economic_events.37.a: "이보다 더 나빠질 수 있을까?"
 usa_economic_events.38.t: "2000년대 에너지 위기"
 usa_economic_events.38.d: "세계적 수요 증가, 중동의 지정학적 불안정, 상품 시장의 투기에 힘입어 유가가 전례 없는 수준으로 치솟았습니다. 휘발유 가격이 끊임없이 오르면서 미국 소비자들은 주유소에서 고통을 느끼고 있으며, 이미 경기 침체로 타격을 입은 가계 예산은 더욱 압박받고 있습니다. 에너지 위기는 경제 전반에 파문을 일으키고 있습니다. 운송비는 치솟고, 항공사들은 고전하며, 연료에 의존하는 기업들은 이윤 폭이 증발하는 것을 지켜보고 있습니다. 한편 미국인들이 변동성 큰 석유 시장에 대한 취약성을 깨달으면서 에너지 독립과 대체 연료원에 대한 요구가 커지고 있습니다. 문제는 이것이 일시적인 급등인지, 아니면 값비싼 에너지의 새로운 시대의 시작인지입니다..."
 usa_economic_events.38.a: "글쎄, 휘발유 가격은 분명 2달러를 넘을 것이다!"
 usa_economic_events_news.7.t: "2000년대 에너지 위기"
 usa_economic_events_news.7.d: "유가가 전 세계 시장에서 사상 최고치에 도달했습니다. 에너지 분석가들은 수요가 계속 공급을 앞지르고 있어 연료 비용이 당분간 높은 수준을 유지할 것으로 예측합니다. 세계가 이 높은 유가를 그저 더 지불해야 할지, 아니면 끊임없이 변하는 이 세계에서 대안을 찾게 될지 정말 흥미로울 것입니다."
 usa_economic_events_news.7.a: "또 하루... 또 다른 경제 위기..."
 usa_economic_events.37.b: "돈을 퍼부어 해결되는지 보자..."
