 poland.300.t: "산업 유산"
 poland.300.d: "폴란드는 그단스크와 슈체친 조선소, 카토비체 제철소, 비드고슈치와 노비손치의 철도 공장, 그리고 부마르 무기 공장을 보유한 채 새 세기에 들어섰으나, 이 모두는 이제 존재하지 않는 경제를 위해 지어진 것들입니다. 이를 매각하면 현금이 확보되고 보조금 지출이 끝납니다. 유지하면 매년 비용이 들지만 국내에 기술이 남습니다."
 poland.300.a: "콤바인을 민영화하고 수익을 챙긴다"
 poland.300.b: "콤바인을 국영으로 유지한다"
 poland.301.t: "가입 조건"
 poland.301.d: "유럽 회원국 자격에는 조건이 따릅니다. 국가 보조금 한도, 조선 및 철강 생산 할당량, 그리고 공공 계약을 연합 내 어느 기업에나 개방하는 것입니다. 이를 수용하면 폴란드 산업은 대륙 최대의 시장에 접근하게 되지만, 그단스크, 그디니아, 슈체친은 견뎌 내지 못할 수도 있는 국가 보조금 조사를 받게 됩니다. 이에 맞서 싸우면 손해를 볼 조선소와 공장을 보호할 수 있습니다."
 poland.301.a: "조건을 수용하고 시장을 차지한다"
 poland.301.b: "전략 산업에 대한 예외를 위해 싸운다"
 poland.302.t: "철도 차량 조달"
 poland.302.d: "철도에는 새 열차와 트램이 필요합니다. 비드고슈치의 페사가 이를 제작할 수 있으나 가격은 더 높고 일정은 더 길며, 이 계약은 페사가 진정한 수출 기업이 되기에 충분한 물량을 줄 것입니다. 지멘스와 알스톰은 더 빠르고 저렴하게 납품합니다."
 poland.302.a: "폴란드 제작사에 계약을 준다"
 poland.302.b: "가장 빨리 납품하는 곳에서 구매한다"
 poland.303.t: "방위 산업 거버넌스"
 poland.303.d: "무기 공장들은 수십 개의 개별 기업에 흩어져 있으며, 각 기업은 현대적인 사업에 입찰하기에는 너무 작고 저마다의 경영진이 자기 공장을 지키고 있습니다. 부마르, 메스코, 후타 스탈로바 볼라 등을 하나의 폴란드 무기 그룹으로 통합하면 경쟁력이 생기지만 매우 많은 사람이 일자리를 잃게 됩니다."
 poland.303.a: "공장들을 하나의 그룹으로 통합한다"
 poland.303.b: "공장들을 각자의 경영 아래 둔다"
 poland.304.t: "에너지 회복력"
 poland.304.d: "폴란드 가스의 거의 전부가 가스프롬의 야말 파이프라인을 통해 들어옵니다. 시비노우이시치에 LNG 터미널을 세우면 어디서든 물량을 들여올 수 있게 되지만, 몇 년의 시간과 수십억의 비용이 듭니다. 더 저렴한 방법은 지금의 조건으로 계속 구매하는 것입니다."
 poland.304.a: "해안 터미널을 건설한다"
 poland.304.b: "현재의 조건으로 계속 구매한다"
 poland.305.t: "폴란드의 산업 모델"
 poland.305.d: "한 세대에 걸친 민영화, 가입, 조달, 통합은 조선소, 제철소, 페사, 무기 그룹이 어떻게 되었는지, 그리고 폴란드 산업이 누구에게 책임을 지는지를 정리했습니다. 이제 이 나라가 스스로 만들 수 있는 것은 수십 년 전의 선택에서 비롯됩니다."
 poland.305.a: "주권 산업 공화국"
 poland.305.b: "방위 및 디지털 무기고"
 poland.305.c: "유럽의 생산 허브"
 poland.305.e: "파편화된 조립 경제"
 POL_sovereign_industrial_republic: "주권 산업 공화국"
 POL_sovereign_industrial_republic_desc: "폴란드는 공장을 유지하고, 자국 제품을 사들이고, 자국 사업에 입찰할 수 있는 그룹을 키워 냈습니다. 생산물은 수입업자가 치를 값보다 비싸지만, 그것을 만든 나라의 것입니다."
 POL_defence_digital_arsenal: "방위 및 디지털 무기고"
 POL_defence_digital_arsenal_desc: "무기 공장들은 조립뿐 아니라 설계도 할 수 있는 조직으로 통합되었습니다. 폴란드 방위 산업은 이제 자국 군대에 공급하는 데 그치지 않고 해외에도 판매합니다."
 POL_european_production_hub: "유럽의 생산 허브"
 POL_european_production_hub_desc: "폴란드는 조건을 받아들이고 시장을 차지하여, 유럽 산업이 물량이 필요할 때 생산하는 장소가 되었습니다. 공장들은 효율적이지만 이에 관한 결정은 다른 곳에서 내려집니다."
 POL_fragmented_assembly_economy: "파편화된 조립 경제"
 POL_fragmented_assembly_economy_desc: "콤바인은 사라졌고 계약은 해외로 넘어갔으며, 남은 것은 다른 이들의 설계를 조립하는 일입니다. 일감은 꾸준하나 그 뒤에 있던 엔지니어링은 돌아오지 않을 것입니다."
 POL_microchips_production_category_desc: "외국 공급업체와 협정을 맺어 우리나라에 최초의 마이크로칩 공장을 짓게 되었으므로, 이제 더 많은 공장을 확보해 현대 제조업의 중심지로서 입지를 더욱 굳힐 수 있습니다."
 poland.306.t: "PZL 미엘레츠 매각"
 poland.306.d: "시코르스키가 미엘레츠 공장에 대해 5,610만 즈워티를 입찰했습니다. 미엘레츠는 국내 최대의 항공기 공장으로 An-2, 이스크라, M28을 제작한 곳입니다. 구매자는 자본, 블랙호크 최종 조립 라인, 그리고 미국 모기업이 가져오는 구조 작업을 들여옵니다. 그러나 이는 공장에 대한 폴란드의 소유권이 끝남을 뜻하기도 하며, 이후 군이 이곳에서 구매하는 모든 헬리콥터는 스트랫퍼드에서 정해진 가격에 사게 됩니다."
 poland.306.a: "시코르스키에 대한 매각을 승인한다"
 poland.306.b: "미엘레츠를 국영으로 유지한다"
