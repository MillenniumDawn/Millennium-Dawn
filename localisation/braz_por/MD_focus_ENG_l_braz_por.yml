 ENG_the_inner_circle_tt_ascended_advisor_2: "§Y[ENGGetAscendedAdvisorName2]§! como [ENGGetAscendedAdvisorDesc2] \n"
 ENG_the_inner_circle_tt_ascended_advisor_3: "§Y[ENGGetAscendedAdvisorName3]§! como [ENGGetAscendedAdvisorDesc3] \n"
 ENG_inner_circle_cd_flag: "Nomeou outro §Y$ENG_inner_circle_member_title$§!"
 ENG_inner_circle_member_title: "Conselheiro de Estado"
 ENG_queen_family_inner_circle_tt: "Ativa a Mecânica do §YCírculo Íntimo§!.\n\n"
 ENG_the_inner_circle_dm: "O Círculo Íntimo"
 ENG_the_inner_circle_dm_desc: "O Círculo Íntimo da Rainha reúne a casa real e as figuras de maior confiança de [ENG.GetNameDef], leais em sustentar a autoridade da Rainha $ENG_elizabeth_queen$ e proteger os interesses da Coroa. Unidos por dever e prestígio, competem por proximidade, nomeações e pela confiança da Soberana, sabendo que a influência na corte pode moldar políticas muito além da vista do público. Suas mãos alcançam decisões militares, industriais e políticas, conduzindo a Grã-Bretanha por meio de patrocínio, acesso e direção discreta."
