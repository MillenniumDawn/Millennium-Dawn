 USA_MBT_4_desc: "1986년에 생산을 시작하여 1992년에 서비스를 시작했습니다(미국을 위해 77대, M1A2로 600대 이상 업그레이드된 M1은 사우디아라비아에서 315대, 쿠웨이트에서 218대). M1A2는 독립적인 열 시야와 순차적으로 두 개의 표적을 획득할 필요 없이 빠르게 발사할 수 있는 능력을 전차장에게 제공합니다."
