 Sweden_foci.3001.t: "공격 헬리콥터 도입을 요청하는 스웨덴"
 Sweden_foci.3001.d1: "스웨덴 정부가 공중 전투 능력을 강화하고 더욱 긴밀한 방위 관계를 구축할 목적으로 미국에 AH-64 아파치 헬리콥터 조달을 공식 요청했습니다."
 Sweden_foci.3001.d2: "스웨덴 정부가 공격 헬리콥터 전력을 다변화하고 새로운 방위 협력 관계를 모색할 목적으로 Ka-52 앨리게이터 헬리콥터 구매를 공식 요청했습니다."
 Sweden_foci.3001.d3: "스웨덴 정부가 공격 헬리콥터 전력의 현대화를 공식 요청했습니다."
 Sweden_foci.3001.o1: "아니요"
 Sweden_foci.3001.o2: "받아들인다"
 Sweden_foci.3002.t: "승인된 스웨덴의 공격 헬리콥터 도입 요청"
 Sweden_foci.3002.d1: "미국이 AH-64 아파치 헬리콥터를 조달하겠다는 스웨덴의 요청을 승인했으며, 이는 양국 간 방위 협력의 중요한 진전입니다."
