 kosovo.3.t: "A Luta pelo Reconhecimento"
 kosovo.3.d: "We will continue to fight for recognition as an independent state, even though we are not recognized as such now, but we do not intend to stop in our struggle."
 kosovo.3.a: "Avançar, rumo ao objetivo"
 kosovo.4.t: "Kosovo pede garantias de não agressão"
 kosovo.4.d: "Kosovo asks us to confirm its intention not to attack us by concluding a non-aggression pact, as a sign of its non-aggressive manners towards us."
 kosovo.4.a: "Para o inferno com eles!"
 kosovo.4.b: "Ok"
 kosovo_rec.7.t: "Kosovo solicita reconhecimento"
 kosovo_rec.7.d: "Diplomatas do Kosovo vieram até nós e solicitaram que nós os reconheçamos como um país. Isso será um processo complicado, mas não teríamos prejuízos em reconhecê-los."
