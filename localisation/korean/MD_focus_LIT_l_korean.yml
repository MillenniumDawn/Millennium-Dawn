l_korean:
 lithuania.1.t: "마제이키우 나프타 문제"
 lithuania.1.d: "리투아니아의 유일한 정유 시설인 마제이키우 나프타가 지정학적 분쟁의 불씨가 되었습니다. 폴란드의 에너지 대기업 PKN 오를렌과 러시아 컨소시엄 모두 이 시설을 인수하는 데 관심을 보였습니다. 국가 소유로 유지하는 방안도 여전히 선택지이지만, 비용이 많이 듭니다."
 lithuania.1.a: "PKN 오를렌에 매각"
 lithuania.1.b: "러시아 컨소시엄에 매각"
 lithuania.1.c: "국유 상태를 유지"
 lithuania.2.t: "PKN 오를렌, 리투아니아 정유소 인수"
 lithuania.2.d: "PKN 오를렌이 리투아니아의 마제이키우 나프타 정유소 인수를 완료하여, 발트해 지역에서 폴란드의 에너지 이권을 확대했습니다."
 lithuania.2.a: "건전한 투자입니다"
 lithuania.3.t: "마제이키아이 정유소 화재"
 lithuania.3.d: "마제이키아이 정유소에서 수상한 화재가 발생했습니다. 러시아 측에 매각된 직후라는 시점은 사보타주 의혹을 불러일으켰으며, 리투아니아 에너지 기반시설의 안보에 대한 의문을 제기했습니다."
 lithuania.3.a: "모스크바를 지목한다"
 lithuania.3.b: "조용히 조사에 착수한다"
 lithuania.10.t: "이그날리나의 미래"
 lithuania.10.d: "유럽 연합은 리투아니아에 체르노빌에서 사고를 일으킨 것과 같은 설계의 RBMK 원자로 두 기를 보유한 이그날리나 원자력 발전소를 폐쇄할 것을 요구했습니다. 폐쇄는 EU 가입의 조건이지만, 이그날리나는 리투아니아 전력의 대부분을 공급합니다. 대체 발전소는 폴란드 및 발트 3국과 공동으로 건설할 수 있습니다."
 lithuania.10.a: "이웃 나라들과 공동 대체 발전소를 협상한다"
 lithuania.10.b: "이그날리나를 계속 가동한다"
 lithuania.10.c: "대체 시설 없이 폐쇄한다"
 lithuania.11.t: "리투아니아의 원자력 협력 제안"
 lithuania.11.d: "리투아니아는 노후화된 이그날리나 시설을 대체하기 위해 폴란드가 비사기나스 원자력 발전소 건설에 공동으로 자금을 지원할 것을 제안했습니다. 이 사업은 발트 지역의 에너지 독립을 강화하고 지역적 유대를 심화시키겠지만, 상당한 투자가 필요합니다."
 lithuania.11.a: "사업에 공동으로 자금을 지원하기로 합의한다"
 lithuania.11.b: "우리에게는 다른 우선순위가 있습니다"
 lithuania.12.t: "폴란드, 원자력 협력에 합의"
 lithuania.12.d: "폴란드가 비사기나스 원자력 발전소에 공동으로 자금을 지원하기로 합의했습니다. 건설을 시작할 수 있으나, 사업을 완료하는 데에는 수년이 걸리며 막대한 자원이 필요할 것입니다."
 lithuania.12.a: "건설을 시작한다"
 lithuania.13.t: "폴란드, 원자력 협력을 거절"
 lithuania.13.d: "폴란드가 비사기나스 사업에 참여하기를 거절했습니다. 이제 리투아니아는 이그날리나의 운명을 스스로 결정해야 합니다."
 lithuania.13.a: "위험을 감수하고 이그날리나를 계속 가동한다"
 lithuania.13.b: "폐쇄한다. 없어도 버텨낼 것이다"
 lithuania.14.t: "비사기나스 원자력 발전소 국민투표"
 lithuania.14.d: "수년간의 건설 끝에, 비사기나스 원자력 발전소 사업은 국민투표에 직면했습니다. 여론은 이를 에너지 안보에 필수적이라고 보는 쪽과 원자력 안전과 비용 초과를 우려하는 쪽으로 갈려 있습니다."
 lithuania.14.a: "국민이 발전소를 승인한다"
 lithuania.14.b: "국민이 사업을 거부한다"
 lithuania.15.t: "비사기나스 발전소 완공"
 lithuania.15.d: "리투아니아와 폴란드가 공동으로 건설한 비사기나스 원자력 발전소가 가동을 시작했습니다. 이 사업은 발트 지역의 에너지 협력과 러시아산 가스로부터의 지역적 독립에서 이정표가 됩니다."
 lithuania.15.a: "협력의 승리"
 lithuania.16.t: "이그날리나에 대한 국제적 압력"
 lithuania.16.d: "유럽 연합은 리투아니아가 이그날리나 원자력 발전소를 계속 가동하는 것에 대해 공식 경고를 발했습니다. 체르노빌형 원자로를 폐쇄하지 않을 경우 제재와 EU 구조 기금의 상실이 논의 대상에 올라 있습니다."
 lithuania.16.a: "선택의 여지가 없습니다. 폐쇄하십시오"
 lithuania.16.b: "압력에 저항한다"
 LIT_refinery_sale_revenue: "정유소 매각 수익"
 LIT_refinery_sale_revenue_desc: "마제이키우 나프타 매각 대금이 국가 예산에 일시적인 활력을 불어넣고 있습니다."
 LIT_russian_energy_leverage: "러시아의 에너지 지렛대"
 LIT_russian_energy_leverage_desc: "리투아니아의 유일한 정유소를 러시아 측에 매각함으로써, 모스크바는 리투아니아의 에너지 정책에 대한 경제적 지렛대를 확보했습니다."
 LIT_nationalized_refinery: "국유화된 정유소"
 LIT_nationalized_refinery_desc: "리투아니아는 마제이키우 나프타의 국가 소유를 유지하여, 운영 효율성을 희생하는 대신 자원 안보를 확보했습니다."
 LIT_energy_deficit: "에너지 부족"
 LIT_energy_deficit_desc: "대체 시설 없이 이그날리나 원자력 발전소를 폐쇄함으로써, 리투아니아는 값비싼 에너지 수입에 의존하게 되었습니다."
 LIT_visaginas_nuclear_plant: "비사기나스 원자력 발전소"
 LIT_visaginas_nuclear_plant_desc: "새로운 비사기나스 발전소는 청정하고 안정적인 에너지를 공급하며 발트 지역 협력의 상징으로 자리하고 있습니다."
 lithuania_news.1.t: "마제이키우 나프타 매각"
 lithuania_news.1.d_poland: "리투아니아가 유일한 정유소인 마제이키우 나프타를 폴란드의 에너지 대기업 PKN 오를렌에 매각했습니다. 이 거래는 발트-폴란드 경제 관계를 심화시키며, 브뤼셀에서는 지역의 러시아 에너지 의존도를 낮추는 한 걸음으로 평가받고 있습니다."
 lithuania_news.1.d_russia: "리투아니아가 유일한 정유소인 마제이키우 나프타를 러시아가 후원하는 컨소시엄에 매각했습니다. 비판자들은 이 거래가 모스크바에 리투아니아 에너지 기반시설에 대한 전략적 지렛대를 쥐여준다고 경고합니다."
 lithuania_news.1.a: "우리 에너지 미래의 초석"
 lithuania_news.1.b: "발트 시장으로의 반가운 확장"
 lithuania_news.1.c: "지역에서 또 한 걸음 나아갔습니다"
 lithuania_news.1.d: "발트 지역의 에너지 안보가 변화하다"
 lithuania_news.1.e: "유럽 에너지 정치의 각주"
 lithuania_news.2.t: "이그날리나 원자력 발전소 폐쇄"
 lithuania_news.2.d: "리투아니아가 소련 시대의 마지막 RBMK 원자로를 해체하며 이그날리나 원자력 발전소를 폐쇄했습니다. 이 폐쇄는 EU 가입의 핵심 요건을 충족시키지만, 대체 에너지원을 찾을 때까지 이 나라는 에너지 수입에 의존하게 됩니다."
 lithuania_news.2.a: "어떻게든 불은 계속 켜져 있을 것입니다"
 lithuania_news.2.b: "유럽 원자력 안전의 승리"
 lithuania_news.2.c: "세상에서 원자로가 하나 줄었습니다"
 lithuania_news.3.t: "비사기나스 원자력 발전소 완공"
 lithuania_news.3.desc: "폴란드의 공동 출자로 건설된 리투아니아의 새로운 비사기나스 원자력 발전소가 가동을 시작했습니다. 이 시설은 이 나라의 에너지 자급자족을 회복시키며, 발트 지역 협력의 획기적인 성과로 기록됩니다."
 lithuania_news.3.a: "마침내 에너지 독립을 이루었습니다"
 lithuania_news.3.b: "지역에 대한 우리의 투자가 결실을 맺었습니다"
 lithuania_news.3.c: "발트 에너지 정책의 새로운 장"
 lithuania_news.3.d: "발트 국가들이 에너지의 미래를 확보하다"