 ROM.socialism_psd: "£ROM_socialism 社会民主党"
 ROM.socialism_psd_icon: "£ROM_socialism"
 ROM.socialism_psd_desc: "（大帐篷）- 社会民主党\n\n社会民主党的根源可以追溯到前罗马尼亚共产党，它是罗马尼亚社会民主党与两个较小的左翼政党合并的结果，是民主救国阵线的继承者，后者是由尼古拉·齐奥塞斯库政权垮台后不久掌权的共产党前官员领导的政党。虽然社会民主党名义上具有中左翼和亲欧洲的观点，但实际上它采取了更务实的立场，结合了左翼民族主义、劳工主义、第三条道路社会民主主义和民粹主义。与其他欧洲同僚相比，社会民主党还具有更保守的社会和民族主义立场，党内许多人持欧洲怀疑论立场，但总体而言，社会民主党的主要优势在于它能够采取务实的立场，这确保了它在罗马尼亚政治中的持续实力。该党在后共产主义时期的执政初期还被指控犯下多起腐败丑闻，并窝藏多名前齐奥塞斯库官员，而这些官员是齐奥塞斯库政权的关键部分。"
 ROM.Neutral_green: "£ROM_neutral_green 罗马尼亚生态党"
 ROM.Neutral_green_icon: "£ROM_neutral_green"
 ROM.Nat_Autocracy: "£ROM_nat_autocracy 罗马尼亚武装力量"
 ROM.Nat_Autocracy_icon: "£ROM_nat_autocracy"
 ROM.Neutral_conservatism_pd: "£ROM_neutral_social 民主党"
 ROM.Neutral_conservatism_pd_icon: "£ROM_neutral_social"
 ROM.Neutral_conservatism_pd_desc: "（自由保守主义）- 民主党\n\n民主党成立于1993年，由罗马尼亚1989年革命后第一位非共产党总理彼得·罗曼接替救国党。民主党以前交通部长特拉扬·伯塞斯库为核心，致力于巩固自由市场并维持罗马尼亚16%的统一税率。他们还支持改革罗马尼亚宪法，以实现行政权力下放并赋予八个发展区更大的权力。"
 ROM.Neutral_conservatism_pdl: "£ROM_neutral_conservatism_PDL 民主自由党"
 ROM.Neutral_conservatism_pdl_icon: "£ROM_neutral_conservatism_PDL"
 ROM.Neutral_conservatism_pdl_desc: "（自由保守主义）- 民主自由党\n\n民主自由党成立于2007年，由民主党与国家自由党分离的自由民主党合并而成。民主自由党以前交通部长特拉扬·伯塞斯库为核心，致力于巩固自由市场并维持罗马尼亚16%的统一税率。他们还支持改革罗马尼亚宪法，以实现行政权力下放并赋予八个发展区更大的权力。"
 ROM.Neutral_conservatism_pmp: "£ROM_neutral_conservatism 人民运动党"
 ROM.Neutral_conservatism_pmp_icon: "£ROM_neutral_conservatism"
 ROM.Neutral_conservatism_pmp_desc: "（自由保守主义）- 人民运动党\n\n人民运动党成立于2014年，由特拉扬·伯塞斯库领导的一群前人民自由联盟成员创立，反对民主自由党与民族自由党合并。人民运动党以前总统特拉扬·伯塞斯库为核心，奉行基督教民主、保守和经济自由政策。"
 ROM.neutral_Social_fd: "£ROM_neutral_social_pro 民主力量"
 ROM.neutral_Social_fd_icon: "£ROM_neutral_social_pro"
 ROM.neutral_Social_fd_desc: "（社会民主主义）- 民主力量\n\n民主力量成立于2004年，由罗马尼亚1989年革命后第一位非共产党总理彼得·罗曼领导，当时民主党保守派和社会主义派别分裂。民主力量正在推动罗马尼亚采用欧洲社会民主模式，重点是进一步发展罗马尼亚民主机构，并且它反对民族主义言论，这与过去曾使用过这种言论的罗马尼亚社会民主党不同。"
 ROM.Nat_Fascism_prm: "£ROM_nat_populism 大罗马尼亚党 - §G新军团主义派§!"
 ROM.Nat_Fascism_prm_icon: "£ROM_nat_populism"
 ROM.Nat_Fascism_prm_desc: ""
 ROM.Neutral_Autocracy_frn: "£generic_Nat_Autocracy_small 民族复兴阵线"
 ROM.Neutral_Autocracy_frn_icon: "£generic_Nat_Autocracy_small"
 ROM.Neutral_Autocracy_frn_desc: "（威权保守主义）- 民族复兴阵线\n\n罗马尼亚国王卡罗尔二世于1938年创建了民族复兴阵线，作为其一党独大的政治垄断力量。此前，卡罗尔二世下令取缔所有政党并中止1923年宪法。如今，复兴后的民族复兴阵线依然秉持着同样的宗旨，成为保罗国王的政治工具。该党的主要意识形态包括民族主义、保守主义、君主主义以及社团主义。"
 SLV.Western_Autocracy_Modern_Centre_Party: "£SLV_Modern_Centre_Party 现代中心党(SMC)"
 SLV.Western_Autocracy_Modern_Centre_Party_icon: "£SLV_Modern_Centre_Party"
 SLV.Western_Autocracy_Modern_Centre_Party_desc: "亲西方专制主义 - 现代中心党是一个自由派的中左翼政党。它提倡法治、自由化经济、减少官僚作风，以减少国家机构的官僚流失。创始人米罗斯拉夫·采拉尔创建了该党，声称议会党派需要为克服社会危机提供必要的基础。该党希望成为广大温和选民的包容性政党，他们对目前的执政联盟感到失望。"
 SLV.Western_Autocracy_Konkretno: "£SLV_Concretely 具体党"
 SLV.Western_Autocracy_Konkretno_icon: "£SLV_Concretely"
 SLV.Western_Autocracy_Konkretno_desc: "亲西方专制主义- 具体党是一个保守自由派政党，由现代中心党和经济活动党合并而成，并吸收了一些较小的当地政党。合并后，具体党在欧洲自由民主联盟党的成员资格被终止。"
 SLV.liberalism_Liberal_Democracy_of_Slovenia: "£SLV_Liberal_Democracy_of_Slovenia 斯洛文尼亚自由民主党(LDS)"
 SLV.liberalism_Positive_Slovenia: "£SLV_Positive_Slovenia 积极的斯洛文尼亚(PS)"
 SLV.liberalism_Positive_Slovenia_desc: "自由主义 - 积极斯洛文尼亚党是一个社会自由主义政党，由卢布尔雅那市长佐兰·扬科维奇于2011年创立。该党在2011年12月的选举中赢得了最多的席位，但未能组建政府。之后，该党在阿伦卡·布拉图舍克的领导下于2013年至2014年执政，但随后因领导权之争而分裂。"
 SLV.liberalism_List_of_Marjan: "£SLV_List_of_Marjan_sarec 马里安·萨雷克名单(LMS)"
 SLV.liberalism_List_of_Marjan_icon: "£SLV_List_of_Marjan_sarec"
 SLV.liberalism_List_of_Marjan_desc: "自由主义 - 马里安·沙雷茨名单是一个社会自由主义和民粹主义政党，由前记者、演员和喜剧演员马里安·沙雷茨创立。该党最初是马里安·沙雷茨第一任市长任期内成立的，以参加2014年斯洛文尼亚卡姆尼克市议会的地方选举，最初是一个地方政党。随着时间的推移，马里安·沙雷茨名单扩大了影响力，并于2018年进入国家政治舞台，迅速在民意调查中名列前茅。"
 SLV.liberalism_ZDEJ: "£ZDEJ 绿色行动(Z.DEJ)"
 SLV.liberalism_icon_ZDEJ: "£ZDEJ"
 SLV.liberalism_ZDEJ_desc: "自由主义 - 绿色行动党是一个社会自由主义、绿色自由主义、进步主义和亲欧洲的政党，具有中左倾向。该党寻求通过各种环境措施来平衡工业进步和环境保护。其活动促进医疗保健的普及，旨在增加就业。此外，该党主张改革教育体系和数字化学校。根据前党主席莱本的说法，斯洛文尼亚应该力争在世界经济论坛上跻身全球最具竞争力的20个国家之列。"
 SLV.liberalism_Freedom: "£SLV_freedom 自由运动"
 SLV.liberalism_icon_Freedom: "£SLV_freedom"
 SLV.liberalism_ZDEJ_Freedom_desc: "自由主义 - 斯洛文尼亚自由党是一个社会自由主义、绿色自由主义、进步主义和亲欧主义的政党，具有中左倾向。该党寻求通过各种环境措施来平衡工业进步和环境保护。其活动促进医疗保健的普及，旨在增加就业。此外，该党主张改革教育体系和数字化学校。根据前党主席莱本的说法，斯洛文尼亚应该力争在世界经济论坛上跻身全球最具竞争力的20个国家之列。"
 SLV.anarchist_communism_IFDS: "£SLV_Initiative_for_Democratic_Socialism 民主社会主义倡议"
 SLV.anarchist_communism_IFDS_icon: "£SLV_Initiative_for_Democratic_Socialism"
 SLV.anarchist_communism_IFDS_desc: "左翼激进主义 - 民主社会主义倡议党是一个左翼马克思主义政党，采用集体领导结构，没有个人领导人。该党的成立受到“占领华尔街”运动的启发，这是一场反对经济不平等和企业贪婪的左翼民粹主义运动，总部位于纽约市。该党的纲领基于工人和朋克大学的经济分析，主张在短期内通过提高税率、将资金用于公共工程以降低失业率等社会民主思想来规范新自由主义。\n从长远来看，该党的目标是通过工作场所民主和国有化等政策，用民主社会主义取代资本主义。该党与欧洲左翼党以及其他欧洲反资本主义政党有联系，包括德国左翼党、法国左翼阵线和葡萄牙左翼集团。"
 SLV.anarchist_communism_The_Left: "£SLV_The_Left 左翼"
 SLV.anarchist_communism_The_Left_icon: "£SLV_The_Left"
 SLV.anarchist_communism_The_Left_desc: "左翼激进主义 - 左翼是一个生态社会主义和民主社会主义政党，由斯洛文尼亚可持续发展党和民主社会主义倡议党合并而成。著名哲学家和拉康派心理分析学家斯拉沃热·齐泽克对该党表示支持。我敢发誓只有讲德语的苏格兰人会同意这个家伙的观点。"
 SLV.Conservative: "£SLV_Resnicca 严肃/真相"
 SLV.Conservative_icon: "£SLV_Resnicca"
 SLV.Conservative_desc: "反动主义 - 严肃/真相，是一个反对封锁、反对5G的亲克里姆林宫政党。据其创始人佐兰·斯特万诺维奇称，该党的名字代表了“真相”和“严肃”两个词。该党认为所有主要政党都是腐败的。佐兰强调，该党 (严肃) 正在实现其目标。严肃/真相的知名度引发了人们的猜测，即该党可能是斯洛文尼亚民主党的卫星党或特洛伊木马，为斯洛文尼亚民主党赢得支持。斯特万诺维奇还提议斯洛文尼亚成为避税天堂，废除所有福利金，最后赋予无条件言论自由的能力。"
 SLV.Autocracy: "£SLV_Peoples_Royalist_Party 人民保皇党(LKS)"
 SLV.Autocracy_icon: "£SLV_Peoples_Royalist_Party"
 SLV.Autocracy_desc: "独裁主义 - 人民保皇党是由鲍里斯·瓦伦契奇创立的政党，他于1989年宣布自己为斯洛文尼亚第一任国王。该党的政纲强烈反美、反北约、反左派和反共产主义。它分为长篇大论批评西方帝国主义征服，同时表达强烈的反塞尔维亚和反共产主义情绪，经常将乔治·W·布什和萨达姆·侯赛因等人物进行比较。瓦伦契奇还声称1990年选举在第一轮完全是伪造的，声称大多数斯洛文尼亚人听从了他的号召抵制选举，导致据报道投票率仅为29%。他指控当时斯洛文尼亚电视台的台长通过操纵数据来显示参与率达到90%，从而策划了一场政变。该党的党章以一颗代表地球各大洲的七角星为标志，体现了创造性思维和国家主权的原则。它强调思想的自由表达、文化认同和民族自决的权利。"
 SLV.Kingdom: "£generic_Kingdom_small 艾尔·伊曼协会与米尔萨德·奥梅罗维奇兄弟"
 SLV.Kingdom_desc: "亲建制派 - 艾尔·伊曼协会与米尔萨德·奥梅罗维奇兄弟，他是欧洲著名的圣战分子招募者，与阿布·贝克尔·巴格达迪和比拉尔·博斯尼奇有联系。该组织还包括来自斯洛文尼亚叶塞尼采的伊斯兰神学家阿里姆·哈桑吉奇。"
 SLV.Caliphate: "£generic_Caliphate_small 斯洛文尼亚的伊斯兰教法"
 SLV.Caliphate_desc: "圣战 - 斯洛文尼亚的伊斯兰教法。欧洲刑警组织报告称，斯洛文尼亚存在伊斯兰教法运动的一个分支。（伊斯兰教法是一个跨国激进伊斯兰组织，总部设在英国和比荷卢三国）。该运动唯一公开的事件是亵渎位于斯玛纳戈拉山的一座天主教教堂，斯玛纳戈拉山是卢布尔雅那附近一个受欢迎的徒步旅行目的地。教堂三面被破坏，上面写着阿拉伯文，还有两句用拉丁文写着“斯洛文尼亚的伊斯兰教法”和“真主至大”的标语。"
 SLV.Neutral_Muslim_Brotherhood: "£SLV_Democrati_Action_Party_of_Slovenia 民主行动党斯洛文尼亚支部(SDA)"
 SLV.Neutral_Muslim_Brotherhood_icon: "£SLV_Democrati_Action_Party_of_Slovenia"
 SLV.Neutral_Muslim_Brotherhood_desc: "斯洛文尼亚民主行动党是一个温和保守的泛伊斯兰主义政党，也是波斯尼亚民主行动党的一个分支，该党由波斯尼亚民族主义者和伊斯兰信仰倡导者阿利雅·伊泽特贝戈维奇创立。伊泽特贝戈维奇成立该党是为了吸引居住在巴尔干半岛的少数波斯尼亚人，该党在塞尔维亚、克罗地亚和马其顿也有其他分支。据推测，该党与穆斯林兄弟会以及伊朗现政权关系密切。尽管有这些联系，该党也倾向于大西洋主义，支持北约和欧盟等组织。除了在上次选举中获得微弱的选票优势外，人们对斯洛文尼亚分支知之甚少。"
 SLV.Neutral_Autocracy: "£SLV_New_Slovenia 新斯洛文尼亚(NSi)"
 SLV.Neutral_Autocracy_icon: "£SLV_New_Slovenia"
 SLV.Neutral_Autocracy_desc: "不结盟独裁主义 - 新斯洛文尼亚 - 基督教民主党是一个基督教保守党，从斯洛文尼亚人民党分裂而来。该党积极倡导传统社会价值观，并在道德问题上捍卫天主教会的立场。它反对同性婚姻和同性伴侣收养孩子，尽管它支持并投票支持当前赋予已登记同性伴侣某些权利的立法。虽然该党总体上是自由派，但它捍卫社会市场经济。新斯洛文尼亚是一个支持现政权的亲欧洲政党。"
 SLV.Neutral_conservatism: "£SLV_western_conservative 斯洛文尼亚社会民主党(SDSS)"
 SLV.Neutral_conservatism_icon: "£SLV_western_conservative"
 SLV.Neutral_conservatism_desc: "保守主义 - 斯洛文尼亚社会民主党是一个中右翼保守党。它最初是斯洛文尼亚民主反对派的一部分，该联盟于1990年在斯洛文尼亚共产党政府允许多党政治生活后成立，旨在挑战共产主义。该党大体上支持市场，其经济政策具有新自由主义的特点，主张降低税收并加速私有化进程。"
 SLV.oligarchism: "£SLV_Democratic_Party_of_Pensioners_of_Slovenia 退休人士民主党(DeSUS)"
 SLV.oligarchism_icon: "£SLV_Democratic_Party_of_Pensioners_of_Slovenia"
 SLV.oligarchism_desc: "寡头政治 - 斯洛文尼亚退休人员民主党是一个关注退休和老年公民利益的政党。尽管该党自成立以来一直参与政府联盟，但从历史上看，该党获得的选票份额相对较小。"
 SLV.Neutral_Libertarian: "£SLV_Pirate_Party 海盗党"
 SLV.Neutral_Libertarian_icon: "£SLV_Pirate_Party"
 SLV.Neutral_Libertarian_desc: "自由主义 - 斯洛文尼亚海盗党是一个基于与世界其他海盗党（尤其是瑞典海盗党）相同的理由和原则成立的政党。它也是国际海盗党的成员。它提倡隐私和数据保护、自由和中立的互联网、政府和政治透明度以及最终的自由软件。"
 SLV.Neutral_green_party: "£SLV_Greens_of_Slovenia 斯洛文尼亚绿党"
 SLV.Neutral_green_party_icon: "£SLV_Greens_of_Slovenia"
 SLV.Neutral_green_party_desc: "绿色政治 - 斯洛文尼亚绿党是一个绿色自由保守党，成立于1989年革命期间，当时斯洛文尼亚处于南斯拉夫统治之下。然而，1996年，该党因领导能力不足的指控而与国民议会发生分歧。"
 SLV.Neutral_green_coalition: "£SLV_non_aligned_greens  斯洛文尼亚绿党"
 SLV.Neutral_green_coalition_icon: "£SLV_non_aligned_greens"
 SLV.Neutral_green_coalition_desc: "绿色政治 - 联合绿党是斯洛文尼亚青年党与斯洛文尼亚绿党于2007年合并后成立的联合绿色平台。它致力于环境保护、可持续发展和欧洲一体化，将该国较小的生态政党团结在同一面旗帜下。"
 SLV.Neutral_green_Youth_party: "£slv_youth_party 青年党"
 SLV.Neutral_green_Youth_party_icon: "£slv_youth_party"
 SLV.Neutral_green_youth_party_desc: "绿色政治 - 斯洛文尼亚青年党是一个绿色青年政党，成立于2000年，旨在代表年轻选民和环境保护事业。该党在2000年大选后进入议会，后与斯洛文尼亚绿党合并，组建了欧洲绿党联盟。"
 SLV.neutral_Social: "£SLV_Zares 真实党"
 SLV.neutral_Social_icon: "£SLV_Zares"
 SLV.neutral_Social_desc: "社会民主党 - 真实党是一个亲欧洲的社会自由党。该党从斯洛文尼亚自由民主党中分离出来，当时由前经济部长马泰·拉霍夫尼克领导的6名国民议会议员离开斯洛文尼亚自由民主党并成立了真实党。"
 SLV.Neutral_Communism: "£SLV_ecosocialism_and_sustainable 可持续发展的斯洛文尼亚"
 SLV.Neutral_Communism_icon: "£SLV_ecosocialism_and_sustainable"
 SLV.Neutral_Communism_desc: "共产主义 - 斯洛文尼亚可持续发展党是一个社会主义政党，成立于大酒店联盟，是同名运动的政治分支。斯洛文尼亚共和国前人权监察员马特贾兹·汉泽克当选为该党主席。他们的愿景是从新自由资本主义转向民主生态社会主义。此外，他们主张斯洛文尼亚非军事化以及该国退出北约。"
 SLV.Nat_Fascism: "£SLV_Here_Is_Slovenija 这里是斯洛文尼亚"
 SLV.Nat_Fascism_icon: "£SLV_Here_Is_Slovenija"
 SLV.Nat_Fascism_desc: "法西斯主义 - 这里是斯洛文尼亚是一个极右翼组织，运营着一个积极招募年轻人的网络论坛。该组织利用其在线形象来宣传其意识形态并吸引年轻人加入其事业。"
 SLV.Monarchist: "£SLV_Barbo_von_Waxenstein 巴博·冯·瓦克森斯坦"
 SLV.Monarchist_icon: "£SLV_Barbo_von_Waxenstein"
 SLV.Monarchist_desc: "君主主义 - 巴博·冯·瓦克森斯坦家族/巴博家族。巴博家族起源于威尼托，后来迁往奥地利内陆，特别是卡尼奥拉（现代斯洛文尼亚）。1547年，该家族定居在哈布斯堡王朝伊斯特拉边境的科日利亚克（瓦克森斯坦）。该家族在卡尼奥拉公国培养了数名高级官员和政治家。最后一位男性成员罗伯特·巴博·冯·瓦克森斯坦伯爵于1977年去世。他有一个女儿，伯爵夫人莉维亚·巴博·冯·瓦克森斯坦，后来成为冯·雷登男爵夫人。"
 CAS.Western_Autocracy: "£generic_Western_Autocracy_small 卡斯卡迪亚消费者党"
 CAS.Western_Autocracy_icon: "£generic_Western_Autocracy_small"
 CAS.Western_Autocracy_desc: "£generic_Western_Autocracy_small 卡斯卡迪亚消费者党 - (CCP) 卡斯卡迪亚消费者党是一个亲商业党，其主要纲领是经济第一。虽然许多人喜欢一个相对扎实的政党，尤其是拥有一些有趣的亲消费者信众的政党，但更多的人对此持怀疑态度，因为有传言称，卡斯卡迪亚消费者党的大部分资金来自卡斯卡迪亚矿业公司，这是一家规模相当大且不断发展壮大的爱达荷州建筑材料和综合矿业公司。"
 CAS.conservatism: "£generic_conservatism_small 新保守党"
 CAS.conservatism_icon: "£generic_conservatism_small"
 CAS.conservatism_desc: "£generic_conservatism_small 太平洋保守党 - (PCP) 太平洋保守党是一个意图相当温和的政党，其政纲大部分从现代视角来看是标准的中右翼立场。"
 CAS.liberalism: "£generic_liberalism_small 卡斯卡迪亚自由党"
 CAS.liberalism_icon: "£generic_liberalism_small"
 CAS.liberalism_desc: "£generic_liberalism_small 卡斯卡迪亚自由党 - (LPC) 与保守党类似，卡斯卡迪亚自由党是一个现代自由党，它希望在某些社会和经济政策自由化方面取得进展，尽管进展缓慢。右翼稻草人通常会说卡斯卡迪亚自由党是‘通往社会主义的门户党’，但大多数人并不这么认为。"
 CAS.socialism: "£generic_socialism_small 社会进步党"
 CAS.socialism_icon: "£generic_socialism_small"
 CAS.socialism_desc: "£generic_socialism_small 社会进步党 - (SPP) 许多人亲切地称其为‘进步党’，这是一个相当标准的社会民主党。该党希望更加支持工人阶级，并支持强大的经济基础。社会进步党希望改善工作条件，并希望更多地关注小型企业，而不是依靠企业实体来发展经济。"
 CAS.anarchist_communism: "£generic_anarchist_communism_small 卡斯卡迪亚人民党"
 CAS.anarchist_communism_icon: "£generic_anarchist_communism_small"
 CAS.anarchist_communism_desc: "£generic_anarchist_communism_small 卡斯卡迪亚人民党 - (PPC) 卡斯卡迪亚人民党，简称 PPC，是一个传统的无政府主义政党。该党认为，中央权力的缓慢分散将使人们更有动力互相帮助，照顾家人和朋友，而不是使用中央权力的武力。"
 CAS.Conservative: "£generic_Conservative_small 卡斯卡迪亚保守党"
 CAS.Conservative_icon: "£generic_Conservative_small"
 CAS.Conservative_desc: "£generic_Conservative_small 卡斯卡迪亚保守党 - (CfC) 卡斯卡迪亚保守党是一个混合党派，一方面它主要是右翼党派，但它认为这种‘右翼力量’来自该国的蓝领男女。因此，虽然他们有相当多的保守观点，但他们也对人们如何为经济做出贡献以及他们如何为自己做出贡献持有这种奇怪的平等主义观点。"
 CAS.Autocracy: "£generic_Autocracy_small 为了更大的卡斯卡迪亚党"
 CAS.Autocracy_icon: "£generic_Autocracy_small"
 CAS.Autocracy_desc: "£generic_Autocracy_small 为了更大的卡斯卡迪亚党 - (PGC) 大卡斯卡迪亚党和为了更大的卡斯卡迪亚党让选民们头疼不已。他们都想要同一个东西，那就是一个更强大的卡斯卡迪亚国家。然而，一个将目光投向太平洋海岸，另一个则将目光投向更远的大陆。就为了更大的卡斯卡迪亚党而言，他们希望通过占领加利福尼亚、阿拉斯加和加拿大不列颠哥伦比亚省来建立一个更强大的国家。无论他们的目标是什么，许多人都认为他们和他们的反对派（好吧，不知何故是反对派）是激进的扩张主义者，因此他们不敢真正投票给他们。"
 CAS.Neutral_Muslim_Brotherhood: "£generic_Neutral_Muslim_Brotherhood_small 伊斯兰国"
 CAS.Neutral_Muslim_Brotherhood_icon: "£generic_Neutral_Muslim_Brotherhood_small"
 CAS.Neutral_Muslim_Brotherhood_desc: "£generic_Neutral_Muslim_Brotherhood_small 伊斯兰国 - 伊斯兰国是一个非裔美国人文化团体，其目标是提升和确保黑人在白人主导的美国社会中的地位。在南方共和国，他们的影响力更大，因为黑带地区几乎占了新国家的一半甚至超过一半。因此，伊斯兰国的激进成员实际上寻求为黑人创建一个新国家，并将这个新国家视为大陆黑人的救赎。"
 CAS.Neutral_Autocracy: "£generic_Neutral_Autocracy_small 大卡斯卡迪亚党"
 CAS.Neutral_Autocracy_icon: "£generic_Neutral_Autocracy_small"
 CAS.Neutral_Autocracy_desc: "£generic_Neutral_Autocracy_small 大卡斯卡迪亚党 - (GCP) 大卡斯卡迪亚党和为了更大的卡斯卡迪亚党让选民们头疼不已。他们都想要同一个东西，那就是一个更强大的卡斯卡迪亚国家。然而，一个将目光投向太平洋海岸，另一个则将目光投向更远的大陆。就大卡斯卡迪亚党而言，他们希望通过占领美国大陆的西半部（从加利福尼亚到堪萨斯）来建立一个更强大的国家。无论他们的目标是什么，许多人都认为他们和他们的反对派（不知何故是反对派）是激进的扩张主义者，因此他们不敢真正投票给他们。"
 CAS.Neutral_conservatism: "£generic_Neutral_conservatism_small 塞勒姆的救世主党"
 CAS.Neutral_conservatism_icon: "£generic_Neutral_conservatism_small"
 CAS.Neutral_conservatism_desc: "£generic_Neutral_conservatism_small 塞勒姆救世主党 - (SSP) 许多反对派戏称其为‘骑墙派’，这是一个具有矛盾倾向的政党。尽管这个党的名字听起来很自私，但它是一个相当封闭的基督教右翼政党。他们主要被视为一个单一问题的政党，即实践和进行宗教活动的能力。有些人认为他们有点疯狂，尤其是在当今这个科技时代。但其他人明白，多元化本身就是一种权利，所以只要他们保持自我，不强迫人们以某种​​方式行事，那么他们现在这样就很好了。"
 CAS.oligarchism: "£generic_oligarchism_small 博伊西商务党"
 CAS.oligarchism_icon: "£generic_oligarchism_small"
 CAS.oligarchism_desc: "£generic_oligarchism_small 博伊西商务党 - (BPP) 博伊西商业党是一个亲商业党，其总部设在爱达荷州博伊西市。有些人对该党的意图持谨慎态度，因为该党的大多数成员和党的领导都来自全国各地的主要企业。但有些人认为这是启动我们这个年轻国家经济效率和成功的一种方式。无论他们做什么，他们都必须先当选才能做任何事情。"
 CAS.Neutral_Libertarian: "£generic_Neutral_Libertarian_small 卡斯卡迪亚自由党"
 CAS.Neutral_Libertarian_icon: "£generic_Neutral_Libertarian_small"
 CAS.Neutral_Libertarian_desc: "£generic_Neutral_Libertarian_small 卡斯卡迪亚自由党 - (CLP) 卡斯卡迪亚自由党是一个相当温和的自由主义政党，它更倾向于所谓的市场自由主义，而不是更现代的社会自由主义。然而，尽管该党的经济意识比社会意识更强，但他们确实相信一种“自己活也让别人活”的心态，因此许多人希望政府不会对社会政策要求太高，事情可以和平进行。"
 CAS.Neutral_green: "£generic_Neutral_green_small 绿山运动"
 CAS.Neutral_green_icon: "£generic_Neutral_green_small"
 CAS.Neutral_green_desc: "£generic_Neutral_green_small 绿山运动 - (GMM) 绿山运动是一场政治运动，旨在更加环保地保护我们国家所拥有的原始自然和环境。相当多的人了解这场运动想要什么，但是通过真正的技术创新，能够限制和颠覆绿山运动提出的一些更激进的政策。作为政党，有很多人对他们敬而远之。"
 CAS.neutral_Social: "£USA_democratic_socialist 卡斯卡迪亚罗宾党"
 CAS.neutral_Social_icon: "£USA_democratic_socialist"
 CAS.neutral_Social_desc: "£USA_democratic_socialist 卡斯卡迪亚罗宾党 - (RPC) 正式名称为红色民主党太平洋西北分会，卡斯卡迪亚罗宾党是被视为‘一般左翼’政党的延伸。它寻求改善工作条件，以每周4天工作制为主要原则之一，它希望通过了解社会差异和分歧来创造一个更具凝聚力的社会，以便改善并创造一个新的基线，让每个卡斯卡迪亚人都可以说，‘我曾经在那里，所以我了解你’。有些人称他们为尘土清扫者，因为他们的起源讲述了一个不同的时代，但无论如何，该党都坚定不移，并希望赢得每一次选举，以造福人民。"
 CAS.Neutral_Communism: "£generic_Neutral_Communism_small 紫旗党"
 CAS.Neutral_Communism_icon: "£generic_Neutral_Communism_small"
 CAS.Neutral_Communism_desc: "£generic_Neutral_Communism_small 紫旗党 - (PPB) 紫旗党，很多人喜欢简称为紫旗党，是一个激进的社会主义政党，他们希望利用民兵力量来煽动和准备革命。尽管他们的党员人数不多，但许多人担心他们和猩红旅会发生冲突，并造成整体损失或附带损害。"
 CAS.Nat_Populism: "£generic_Nat_Populism_small 力量与团结党"
 CAS.Nat_Populism_icon: "£generic_Nat_Populism_small"
 CAS.Nat_Populism_desc: "£generic_Nat_Populism_small 力量与团结党 - (SUP) 力量与团结党是一个典型的右翼政党，支持本土主义、支持自给自足，并且总体上反对移民。尽管该党倾向于淡化那些在移民问题上态度强硬的成员，但许多人想知道力量与团结党到底想要什么方向。这种分歧意味着，如果该党掌权，移民问题辩论很可能会成为焦点，因为成员们会争论实际移民改革的严重性。"
 CAS.Nat_Fascism: "£generic_Nat_Fascism_small 猩红旅"
 CAS.Nat_Fascism_icon: "£generic_Nat_Fascism_small"
 CAS.Nat_Fascism_desc: "£generic_Nat_Fascism_small 猩红旅 - (TSB) 猩红旅是一个极右翼政党，旨在打造一个‘纯粹的卡斯卡迪亚’。大多数人并不觉得他们有吸引力，但许多成员都是前军人或执法人员，因此他们的伪民粹主义集会往往会吸引大量旁观者，不管是好是坏。无论如何，卡斯卡迪亚的构成相当多样化，所以即使他们尝试，也很难掌权。"
 CAS.Nat_Autocracy: "£generic_Nat_Autocracy_small 卡斯卡迪亚军队"
 CAS.Nat_Autocracy_icon: "£generic_Nat_Autocracy_small"
 CAS.Nat_Autocracy_desc: "£generic_Nat_Autocracy_small 卡斯卡迪亚军队 - (CM) 卡斯卡迪亚军队是一支防御型军队，山脉和一般地形更利于守住阵地，而非进攻。因此，大多数军事领导人更关注政治，而非扩张。然而，只需要一位领导人就能掌控治理。"
 CAS.Monarchist: "£generic_Monarchist_small 奥林匹亚王室"
 CAS.Monarchist_icon: "£generic_Monarchist_small"
 CAS.Monarchist_desc: "£generic_Monarchist_small 奥林匹亚王室 - (HoO) 奥林匹亚王室是一场君主主义运动，旨在将太平洋西北部国家变成君主立宪制国家。然而，这个君主立宪制的主要原则却出人意料地将君主本身变成了选举君主制。本质上就是一个总统，但并没有被称为总统。有些人觉得这个想法很有吸引力，主要是出于自尊心，但尽管如此，该运动确实希望在现代性方面保持现状，正如其名言‘过去之所以成为过去，是有原因的，现在是时候抓住美好时刻，将它们转化为未来的伟大时刻了’。"
 NEN.Western_Autocracy: "£generic_Western_Autocracy_small 康科德创意党"
 NEN.Western_Autocracy_icon: "£generic_Western_Autocracy_small"
 NEN.Western_Autocracy_desc: "£generic_Western_Autocracy_small 康科德创意党 - (CCP) 康科德创意党是一个总部位于新罕布什尔州的亲商党，其目标是放宽商业法规，并在小型企业和大公司之间建立起一个有凝聚力的体系。然而，许多人对此感到担忧，因为该党的相当一部分领导人来自康科德混凝土公司，该公司是美国最大的建筑和建筑材料公司之一。"
 NEN.conservatism: "£generic_conservatism_small 保守派协会党"
 NEN.conservatism_icon: "£generic_conservatism_small"
 NEN.conservatism_desc: "£generic_conservatism_small 保守派协会党 - (CAP) 保守党协会党被认为是一个中右翼政党，其目标是维持低管制的经济，并在政府建筑和土地之外的社会政策中发挥较小的政府作用。"
 NEN.liberalism: "£generic_liberalism_small 新英格兰自由团结党"
 NEN.liberalism_icon: "£generic_liberalism_small"
 NEN.liberalism_desc: "£generic_liberalism_small 新英格兰自由团结党 - (NELUP) 自由团结党是一个中左翼政党，被认为是保守派协会党的主要反对党。尽管他们在经济甚至社会方面都比较放任不管，但他们并不害怕诉诸法庭和法律系统来阻止对少数群体和LGBT社区成员的无理歧视。"
 NEN.socialism: "£USA_progressive_party 民主与进步党"
 NEN.socialism_icon: "£USA_progressive_party"
 NEN.socialism_desc: "£USA_progressive_party 民主与进步党 - (DPP) 奇怪的是，民主与进步党是复兴的公麋党的一个复兴篇章。许多人认为他们是社会和经济机会平等的良好中间立场，同时又不像传统的‘社会主义’政党那样具有革命性或分裂主义。"
 NEN.anarchist_communism: "£generic_anarchist_communism_small 黑旗协会"
 NEN.anarchist_communism_icon: "£generic_anarchist_communism_small"
 NEN.anarchist_communism_desc: "£generic_anarchist_communism_small 黑旗协会 - (BBA) 黑旗协会是一个相当温和的政党，但讽刺的是，它的核心是无政府主义。该党相信利用体制来‘自我毁灭’，因此许多人想知道，如果掌权，这样一个政党到底能做什么，甚至会做什么。"
 NEN.Conservative: "£generic_Conservative_small 新保守党"
 NEN.Conservative_icon: "£generic_Conservative_small"
 NEN.Conservative_desc: "£generic_Conservative_small 新保守党 - (NCP) 新保守党是一个较为传统的右翼政党，主张反对堕胎、严格移民监管以及限制或不干预政府对经济的干预。有些人认为他们更像是更具吸引力的共同农业政策的幌子，但他们总体上仍然吸引了各种各样的人。"
 NEN.Autocracy: "£generic_Autocracy_small 新英格兰力量协会"
 NEN.Autocracy_icon: "£generic_Autocracy_small"
 NEN.Autocracy_desc: "£generic_Autocracy_small 新英格兰力量协会 - (NESS) 力量协会是一种假旗政党。虽然在社会和经济政策等传统问题上并没有真正采取强硬立场。该协会认为，国家进步依赖于加强国家认同和人民。这实际上意味着什么，没有人完全确定，但他们通过社区所推行的温和民族主义确实不时吸引了一些不错的会员。"
 NEN.Neutral_Muslim_Brotherhood: "£generic_Neutral_Muslim_Brotherhood_small 伊斯兰国"
 NEN.Neutral_Muslim_Brotherhood_icon: "£generic_Neutral_Muslim_Brotherhood_small"
 NEN.Neutral_Muslim_Brotherhood_desc: "£generic_Neutral_Muslim_Brotherhood_small 伊斯兰国 - 伊斯兰国是一个非裔美国人文化团体，旨在提升并维护黑人在美国白人主导社会中的地位。在新英格兰地区，该运动规模较小，因为当地少数族裔人口本来就很少。直到纽约出现后，人们才开始认为新英格兰是一个多元文化的天堂。然而，尽管人数不多，伊斯兰民族中仍有许多激进成员，他们试图建立一个完全由黑人组成的新国家。他们认为这个新国家是生活在北美大陆的黑人的救赎。"
 NEN.Neutral_Autocracy: "£generic_Neutral_Autocracy_small 新社会党"
 NEN.Neutral_Autocracy_icon: "£generic_Neutral_Autocracy_small"
 NEN.Neutral_Autocracy_desc: "£generic_Neutral_Autocracy_small 新社会党 - (NSP) 新社会党是一个自相矛盾的政党。他们相信在经济机会和流动性方面采取更平等的手段，但也倾向于对移民和某些社会政策进行更多的监管。该党与原则与传统党一起倾向于形成国内所谓的‘僵局者联盟’。"
 NEN.Neutral_conservatism: "£generic_Neutral_conservatism_small 原则与传统党"
 NEN.Neutral_conservatism_icon: "£generic_Neutral_conservatism_small"
 NEN.Neutral_conservatism_desc: "£generic_Neutral_conservatism_small 原则与传统党 - (PTP) 有些人称其为传统党，这是一个相当标准的右翼政党。总体而言，它在捍卫传统社会政策手段方面并没有过分强调所谓的‘虔诚的赦免’。然而，他们往往是新英格兰政治舞台上的刺头党，因为他们在立场上不会真正妥协，有时会导致投票失败或陷入僵局。他们确实试图与其他保守党合作，但更愿意与新捍卫者党等政党合作。"
 NEN.oligarchism: "£generic_oligarchism_small 经济成功党"
 NEN.oligarchism_icon: "£generic_oligarchism_small"
 NEN.oligarchism_desc: "£generic_oligarchism_small 经济成功党 - (ESP) 经济成功党是一个坚定的亲商党，力求尽一切努力确保经济流动性和增长。有些人担心这种狭隘的政策决策方式可能会导致不为人知的过度行为。然而，有些人希望该党能随着时间的推移推动国家进入区域市场甚至国际市场。"
 NEN.Neutral_Libertarian: "£generic_Neutral_Libertarian_small 新自由党"
 NEN.Neutral_Libertarian_icon: "£generic_Neutral_Libertarian_small"
 NEN.Neutral_Libertarian_desc: "£generic_Neutral_Libertarian_small 新自由党 - (NLP) 新自由党是一个相当传统的自由党。该党平衡了国家对社会和经济进步的需求，但将大部分需求转移到了州和地方，只通过国家的法律体系直接解决可能被视为滥用的问题。"
 NEN.Neutral_green: "£generic_Neutral_green_small 林业协会"
 NEN.Neutral_green_icon: "£generic_Neutral_green_small"
 NEN.Neutral_green_desc: "£generic_Neutral_green_small 林业协会 - (FA) 林业协会是一个软性环保党派，其理念是利用技术来提高保护和扩大自然资源及其利用的能力。林业协会并非许多人认为的那种‘绿色活动家’，尽管其平台是保护和利用，但林业协会却更倾向于商业，这被认为是一种矛盾的说法。"
 NEN.neutral_Social: "£USA_democratic_socialist 社会主义民主党"
 NEN.neutral_Social_icon: "£USA_democratic_socialist"
 NEN.neutral_Social_desc: "£USA_democratic_socialist 社会主义民主党 - (SDP) 社会主义民主党在德国政坛中算是异类。其大部分政纲都来自其德国‘姊妹党’ - 德国社会民主党（SPD），尽管德国这个名字听起来很讽刺。两党都相信利用体制获得公众支持，并通过立法程序缓慢全面地推行社会主义经济政策，以免突然变化给人们带来任何冲击。"
 NEN.Neutral_Communism: "£generic_Neutral_Communism_small 新英格兰社会主义党"
 NEN.Neutral_Communism_icon: "£generic_Neutral_Communism_small"
 NEN.Neutral_Communism_desc: "£generic_Neutral_Communism_small 新英格兰社会主义党 - (SPNE) 社会主义党是一个相当标准的马克思主义政党，他们相信工人的斗争，并相信现行制度本质上将他们困在现代农奴制中。然而，主要区别在于，虽然他们非常支持工人，但他们并不完全反对商业。这意味着温和派和类似的左翼人士往往会根据国家需求的总体趋势涌入或离开该党。他们最大的盟友是社会主义民主党。"
 NEN.Nat_Populism: "£generic_Nat_Populism_small 新捍卫者党"
 NEN.Nat_Populism_icon: "£generic_Nat_Populism_small"
 NEN.Nat_Populism_desc: "£generic_Nat_Populism_small 新捍卫者党 - (NDP) 新捍卫者党被嘲笑为‘软弱的面条阴谋集团’。他们之所以这样做，是因为他们的大多数组织都召开了混乱的会议，发表了相当平淡无奇的民粹主义演讲。尽管如此，该党仍然相信亲军国主义、亲移民，并塑造经济以造福整个社会，以确保其主要关注点是军队。新捍卫者党通常由前军人甚至一些现役军人组成。"
 NEN.Nat_Fascism: "£generic_Nat_Fascism_small 绿衫会"
 NEN.Nat_Fascism_icon: "£generic_Nat_Fascism_small"
 NEN.Nat_Fascism_desc: "£generic_Nat_Fascism_small 绿衫会 - (GSS) 许多人称绿衫军为国家社会主义团体，他们致力于打造一个纯粹、自由的新英格兰。虽然他们确实相信一些更激进的方法，但温和派……是的，他们团体中的温和派不知何故认为，以付费离开计划的形式提出的对等方案在外国人看来更有利。虽然许多人不确定这样一个小众而过时的团体能有多受欢迎，但更多的人不想知道。"
 NEN.Nat_Autocracy: "£generic_Nat_Autocracy_small 新英格兰武装力量"
 NEN.Nat_Autocracy_icon: "£generic_Nat_Autocracy_small"
 NEN.Nat_Autocracy_desc: "£generic_Nat_Autocracy_small 新英格兰武装力量 - (AFNE) AFNE 或简称武装力量，是一个相对中立的政治实体。如果他们确实发挥或获得任何值得一提的软实力，他们的主要重点是为军队提供更好的资金和征兵改革，以确保一支团结、总体稳定的军事力量，确保国家战备。"
 NEN.Monarchist: "£generic_Monarchist_small 奇科皮王室"
 NEN.Monarchist_icon: "£generic_Monarchist_small"
 NEN.Monarchist_desc: "£generic_Monarchist_small 奇科皮王室 - (HoC) 有些人喜欢称奇科皮王室为现代君主制的本土产物。这个所谓的王室认为，应该用小众但具有历史意义的奇科皮镇来代表王室。成员们认为，它足够独特，既能代表新英格兰，又能尊重新英格兰文化生活的各个方面。当然，他们的运动是现代君主主义运动的一部分，这意味着他们希望保留现行制度的思想和做法，只是将头衔改为旧头衔。本质上，这是让国家成为选举君主制和君主立宪制的混合体。"
 CZE.Western_Autocracy_2004: "£CZE_western_autocracy_2004 市长和独立人士"
 CZE.Western_Autocracy_2004_icon: "£CZE_western_autocracy_2004"
 CZE.Western_Autocracy_2004_desc: "市长与独立人士党 (STAN) 是捷克共和国的一个自由主义政党，关注地方主义、区域主义和辅助性。该党由四个小党派发展而来，包括地区独立市长党和自由保守派SNK 欧洲民主党。直到2016年，该党与另一个自由保守党TOP 09合作。市长与独立人士党作为海盗和市长联盟的一部分与捷克海盗党一起参加2021年捷克议会选举。"
 CZE.Western_Autocracy_pavel: "£generic_Western_Autocracy_small 彼得·帕维尔的政府"
 CZE.Western_Autocracy_pavel_icon: "£generic_Western_Autocracy_small"
 CZE.Western_Autocracy_pavel_desc: "彼得·帕维尔赢得总统选举后，新政府成立。与其他政治家的合作将使新总统能够完成他的选举计划并实施捷克军备计划的新理论。"
 CZE.liberalism_2010: "£CZE_western_liberal_2010 TOP 09"
 CZE.liberalism_2010_icon: "£CZE_western_liberal_2010"
 CZE.liberalism_2010_desc: "该党由离开基督教民主联盟-捷克斯洛伐克人民党的米罗斯拉夫·卡卢舍克于2009年6月11日创立。其首任领导人是卡雷尔·施瓦岑贝格，他曾在2007年1月至2009年3月的第二届托波拉内克内阁中担任外交部长。"
 CZE.Neutral_Autocracy: "£CZE_neutral_Social_2011 不满公民行动(ANO)"
 CZE.Neutral_Autocracy_icon: "£CZE_neutral_Social_2011"
 CZE.Neutral_Autocracy_desc: "不满公民行动党，通常称为是的2011，是捷克共和国的一个民粹主义政党，由商人安德烈·巴比什领导。是的2011于2011年11月成立，最初是一个协会，并于2012年5月11日成为捷克共和国的正式政党。"
 CZE.Conservative_2015: "£CZE_emerging_reactionary_2015 自由和直接民主(SPD)"
 CZE.Conservative_2015_icon: "£CZE_emerging_reactionary_2015"
 CZE.Conservative_2015_desc: "自由与直接民主党是由冈村富夫领导的政党。该党在政治光谱上被描述为右翼或极右翼。该党也被描述为拥护右翼民粹主义，反对移民，坚定地持欧洲怀疑论，而在其政治纲领中，他们表示支持直接民主。"
 CZE.Nat_Fascism: "£CZE_Nat_Fascism 社会公正工人党(DSSS)"
 CZE.Nat_Fascism_icon: "£CZE_Nat_Fascism"
 CZE.Nat_Fascism_desc: "社会正义工人党通常被描述为捷克共和国的主要极右翼极端主义政党。该党在捷克共和国的任何立法机构中都没有代表，迄今为止其最大的选举胜利是在捷克立法选举中获得了1.14%的选票。包括布拉格党领袖在内的一些高级党员与新纳粹组织有联系，例如民族抵抗，这是一个国际激进新纳粹组织的捷克分支。"
 CZE.Neutral_Libertarian_2009: "£CZE_Neutral_libertarian 捷克海盗党"
 CZE.Neutral_Libertarian_2009_icon: "£CZE_Neutral_libertarian"
 CZE.Neutral_Libertarian_2009_desc: "捷克海盗党是捷克共和国的一个自由进步政党，成立于2009年。该党成立时是一场由学生推动的草根运动，旨在争取政治透明、公民权利和直接民主。"
 SYR.Neutral_green: "£generic_Neutral_green_small 叙利亚绿色联邦运动"
 SYR.Neutral_green_desc: "叙利亚绿色联邦主义运动是在大马士革之春后成立的，这场运动为叙利亚政党的重建铺平了道路。该运动反对官僚主义的政府模式，旨在建立一个联邦制且生态友好的叙利亚。由于该党库尔德族成员比例较高，许多组织指责其与库尔德工人党有联系，但事实上，该党内部对于库尔德工人党的立场存在分歧。"
 SYR.Nat_Fascism_desc: "（伊拉克复兴党）- 叙利亚复兴党是一个复兴党政党，其总部设在伊拉克巴格达，直至2003年。1966年，原复兴党分裂为两部分：一部分由复兴党大马士革领导层在叙利亚建立，另一部分则由巴格达领导层领导。这两个复兴党保留了相同的名称，并在阿拉伯世界维持着平行的组织结构。然而，两国关系日趋敌对，以至于在血腥的两伊战争中，叙利亚支持伊朗对抗伊拉克；在海湾战争中，叙利亚也加入了美国领导的反伊拉克联盟。复兴党于1963年首次在伊拉克夺取政权，但几个月后便被推翻。"
 GER.Nat_Fascism_alt: "£GER_nat_fascism_alt 祖国"
 GER.Nat_Fascism_alt_icon: "£GER_nat_fascism_alt"
 GER.Nat_Fascism_alt_desc: "（法西斯主义）祖国党是一个极右翼极端民族主义政党，被贴上了新纳粹的标签。尽管该党已被国家情报部门大量渗透，但禁止该党的尝试却以失败告终。他们持排犹主义观点，并宣扬对移民的仇恨。"
 ENG.Nat_Populism_alty: "£ENG_nat_populism (RUK) - 英国改革党"
 ENG.Nat_Populism_alty_icon: "£ENG_nat_populism"
 ENG.Nat_Populism_alty_desc: "(右翼民粹主义) - 英国改革党\n\n英国改革党是一个右翼民粹主义政党，由脱欧党发展而来，并更名为一个更广泛的反建制组织。该党以主权、边境管制、减税以及反对其所谓的精英共识政治为竞选纲领，将媒体驱动的对抗与改革国家的承诺相结合。即使其席位有限，其影响力也来自于议程设置和分裂右翼的能力，同时还能引导全国辩论朝着其预期的方向发展。"
 SOV.Neutral_Communism_alty_desc: "（民粹社会主义）左翼阵线\n\n左翼阵线是支持俄罗斯社会主义建设的左翼组织的广泛阵线。该组织还与主流政党合作并积极开展活动。"
 SOV.neutral_Social_1_desc: "（进步自由主义）新人\n\n新人党是由商人兼法布里克公司创始人阿列克谢·涅恰耶夫创建的政党。该党提倡市场改革、言论自由、公共管理数字化，并支持电子民主理念"
 SOV.Neutral_Muslim_Brotherhood_desc: "（穆斯林行动主义）俄罗斯穆斯林全国组织\n\n俄罗斯穆斯林是一个宗教组织，旨在代表信奉伊斯兰教的俄罗斯族人的利益。他们还倡导在俄罗斯人和其他土著民族中和平传播伊斯兰教及其价值观"
 SLV.liberalism_icon_Positive_Slovenia: "£SLV_Positive_Slovenia"
 BRA.conservatism_2007: "£BRA_conservatism (DEM) - 民主党"
 BRA.conservatism_2007_desc: "（自由保守主义）- 民主党\n\n民主党（原名自由阵线党，2007年更名）是巴西主要的中右翼反对党，主张自由市场、财政紧缩、私营企业以及在公共秩序问题上采取保守路线。此次更名旨在摆脱该党与军政府的关联，并将其塑造成与劳工党政府抗衡的现代民主替代方案。\n\n该党在巴伊亚州和东北部地区拥有强大的群众基础，并在国会中占据要职，其在众议院和参议院的领导地位使其影响力远超党内其他地区。该党隶属于中间派民主国际和国际民主联盟。"
 ISR.liberalism_alt7: "£ISR_liberalism_alt7 (Tikva Hadasha) - 新希望"
 ISR.liberalism_alt7_desc: "(民族自由主义) - 新希望\n\n前利库德集团部长吉迪恩·萨尔于2020年12月8日创立了“新希望”党，这是一个反对本雅明·内塔尼亚胡继续执政的中右翼全国性自由主义政党。该党在2021年赢得6个席位，并加入贝内特-拉皮德联合政府，萨尔担任司法部长。2022年，“新希望”党加入“民族团结”联盟，赢得12个席位中的4个。2024年3月，“新希望”党退出该联盟，并于同年9月重新加入内塔尼亚胡的联合政府，萨尔担任外交部长。2025年，“新希望”党同意重新并入利库德集团。"
 ISR.liberalism_alt7_icon: "£ISR_liberalism_alt7"
 ISR.socialism_alt: "£ISR_democrats (HaDemokratim) - 民主党 - 劳工派"
 ISR.socialism_alt_desc: "（社会民主主义）- 民主党\n\n民主党成立于2024年，由工党和梅雷茨党于6月30日达成合并协议，并于7月12日在时任副总参谋长亚伊尔·戈兰的领导下完成合并。该党自诩为以色列自由民主阵营的代表，融合了工党的社会民主和工会传统以及梅雷茨党的公民自由和两国方案。该党占据了工党在2022年赢得的4个席位。"
 ISR.socialism_alt_icon: "£ISR_democrats"
 ISR.Neutral_conservatism_bibi: "£ISR_conservatism (利库德集团) - 民族自由运动（内塔尼亚胡）"
 ISR.Neutral_conservatism_bibi_desc: "（保守民粹主义）- 利库德集团 - 全国自由运动\n\n这是2005年11月阿里埃勒·沙龙带领利库德集团温和派脱离该党，另立前进党时留下的那部分利库德集团。该集团以本雅明·内塔尼亚胡为核心重建，2006年席位跌至12席，2009年回升至27席，重返执政地位。此后，内塔尼亚胡领导的利库德集团定义了以色列右翼，其政治主张包括经济自由主义、毫不妥协的安全立场、反对巴勒斯坦建国以及日益高涨的针对法院、媒体和法律机构的民粹主义运动。"
