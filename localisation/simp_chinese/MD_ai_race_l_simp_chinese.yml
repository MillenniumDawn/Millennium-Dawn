 AI_RACE_investment_complete: "所有竞赛阶段完成。\n保持能力以维持我们的收益。\n未偿还贷款仍需支付。"
 AI_RACE_outcomes_only: "仅评估结果：评估国家能力和排名。\n阶段性投资和融资已停止。"
