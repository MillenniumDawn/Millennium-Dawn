 BOS_bnttmih_mio_trait_m60_recoilless: "M60 무반동총"
 BOS_bnttmih_mio_trait_gun_125_m84: "M-84 125mm 포"
 BOS_bnttmih_mio_trait_gun_100_t55: "T-55 100mm 포"
 BOS_bnttmih_mio_trait_m84_recoilless: "M84 무반동총"
 BOS_bnttmih_mio_trait_at_gun_100: "100mm 대전차포"
 BOS_bnttmih_mio_trait_mountain_gun_100: "100mm 산악포"
 BOS_croat_secession_crisis: "크로아티아계 분리 독립 위기"
 BOS_croat_secession_crisis_desc: "헤르체그-보스나 기관들이 탈퇴 법안을 기초하고 자체 부대를 훈련시키고 있습니다. 대치가 끝나기 전에 크로아티아계의 불만이 해소되지 않으면, 남부는 무장 반란과 함께 이탈할 것입니다."
 BOS_dayton_two: "개정 데이턴 합의"
 BOS_dayton_two_desc: "재협상된 헌법적 합의는 전투 종식의 대가로 자치체에 더 폭넓은 자치권을 내주었습니다. 안정도는 얻지만, 중앙의 결속력은 느슨해집니다."
 BOS_srpska_secession_crisis_opens_tt: "스릅스카 공화국이 분리 독립 위기를 촉발합니다. 기한이 끝나기 전에 해결하지 못하면 자치체가 전쟁에 돌입합니다."
 BOS_croat_secession_crisis_opens_tt: "헤르체그-보스나가 분리 독립 위기를 촉발합니다. 기한이 끝나기 전에 크로아티아계 신뢰도를 우호적 수준으로 끌어올려 남부를 국가 안에 붙들어 두십시오."
 bos_srpska_reconciliation_full_tt: "자치체가 중앙 권위 아래로 완전히 복귀하면서 정부에 대한 세르비아계 신뢰도가 적대적 수준으로 재설정됩니다."
 bos_srpska_negotiated_autonomy_tt: "협상된 자치 조건에 따라 정부에 대한 세르비아계 신뢰도가 우호적 수준으로 설정됩니다."
 BOS_croat_deescalation_hint_tt: "위기가 만료되기 전에 세력 결정을 통해 크로아티아계 신뢰도를 우호적 수준으로 끌어올려 사태를 진정시키십시오."
 BOS_rotate_presidency_hint_tt: "대통령직 순환 실시 결정을 사용하여 대통령직을 넘기고 차례를 기다리는 공동체의 인내심을 재설정하십시오."
 BOS_croat_neutrality_pact_honored_tt: "크로아티아계 중립 협정이 지켜집니다. 헤르체그-보스나는 전쟁에 개입하지 않으며 분리 독립하지 않습니다."
 BOS_political.82.t: "스릅스카 공화국, 분리 독립 준비"
 BOS_political.82.d: "자치체 의회가 국가 기관에서 탈퇴할 날짜를 정했습니다. 독립이 완전히 선포되기 전에 이를 되돌릴 수 있는 좁은 기회가 아직 남아 있습니다."
 BOS_political.82.a: "사태를 진정시킬 방도를 찾는다"
 BOS_political.83.t: "헤르체고비나, 이탈 위협"
 BOS_political.83.d: "남부의 크로아티아계 지도자들은 수년간 표결에서 밀려왔음을 이유로 분리 독립으로 기울고 있습니다. 지금 관계를 회복하는 것만이 이들을 국가 안에 붙들어 두는 유일한 방법입니다."
 BOS_political.83.a: "크로아티아계 공동체에 손을 내민다"
 BOS_political.84.t: "대통령직 순환 정체"
 BOS_political.84.d: "자리가 교체될 예정이었으나 인수인계가 계속 미뤄지고 있습니다. 차례를 기다리는 공동체는 이 지연을 고의적인 것으로 보기 시작했습니다."
 BOS_political.84.a: "그들의 불만을 주지한다"
 BOS_offer_amnesty: "사면 제안"
 BOS_offer_amnesty_desc: "무기를 내려놓는 전투원들에게 사면을 부여합니다. 세르비아계 공동체의 입지가 안정되지만, 국내에서는 나약함으로 비칩니다."
 BOS_forced_requisition: "강제 징발"
 BOS_forced_requisition_desc: "전쟁 수행 자금을 마련하기 위해 자치체들로부터 물자와 군수품을 몰수합니다. 국고는 채워지지만 세르비아계의 분노는 굳어집니다."
 BOS_sign_croat_neutrality_pact: "크로아티아계 중립 협정 체결"
 BOS_sign_croat_neutrality_pact_desc: "중립을 대가로 크로아티아계의 자치를 보장합니다. 이슬람 장악이 뒤따르더라도 헤르체고비나는 분열하지 않고 국가 안에 남게 됩니다."
 BOS_canton_pressure_campaign: "주 압박 운동"
 BOS_canton_pressure_campaign_desc: "보스니아크계와 크로아티아계 주들이 중앙의 방침에 따르도록 압박합니다. 국가는 안정되지만 양 공동체의 호의를 잃게 됩니다."
 BOS_serbian_alignment_overtures: "세르비아 밀착 행보"
 BOS_serbian_alignment_overtures_desc: "베오그라드와의 정치적, 경제적 유대를 심화합니다. 보스니아 내 세르비아의 영향력이 커지고, 세르비아계 공동체는 정부에 호감을 느끼며, 보스니아크계의 인내심은 바닥나 갑니다."
 BOS_srpska_supremacy_measures: "세르비아계 우위 조치"
 BOS_srpska_supremacy_measures_desc: "세르비아 민족주의 및 안보 우선 사항을 정부 정책과 기관에서 장려합니다."
 BOS_bosniak_governing_partner: "보스니아크계 집권 파트너"
 BOS_bosniak_governing_partner_desc: "충성스러운 보스니아크계 파트너가 연립 정치를 안정시키고 불안을 낮춥니다."
 BOS_croat_governing_partner: "크로아티아계 집권 파트너"
 BOS_croat_governing_partner_desc: "충성스러운 크로아티아계 파트너가 경제 개혁을 지지하지만 국내 연립의 유연성을 줄입니다."
 BOS_srpska_governing_partner: "세르비아계 집권 파트너"
 BOS_srpska_governing_partner_desc: "충성스러운 세르비아계 파트너가 안보 협력을 개선하지만 연방 감독을 약화시킵니다."
 BOS_reconstruction_dividends: "재건 배당"
 BOS_reconstruction_dividends_desc: "재건 프로그램에 협력하는 전후 연립은 단기적인 경제적 이득을 창출할 수 있습니다."
 BOS_governing_partner_dividends_tt: "§G연립 집권 파트너가 충성스러운 경우:§! 재건이 180일 동안 배당을 가져옵니다."
 BOS_internal_faction_balance_stability_tt: "§Y공동체 신뢰도:§! 신뢰도가 §R25§! 미만인 공동체마다 국가 안정도에 §R-15%§!가 적용되고, §G50§! 초과인 공동체마다 §G+5%§!, §G74§! 초과인 공동체마다 §G+10%§!가 부여됩니다."
 BOS_internal_faction_balance_manpower_tt: "§Y공동체 인력:§! 신뢰도가 §R25§! 미만인 공동체마다 징집 가능 인구에 §R-15%§!가 적용되고, §G50§! 초과인 공동체마다 §G+15%§!, §G74§! 초과인 공동체마다 §G+20%§!가 부여됩니다."
 BOS_revanchism_peacekeepers_warning_tt: "§Y참고:§! 민족 각성이 진행되려면 EUFOR 평화유지군이 먼저 나라를 떠나야 합니다."
 BOS_national_awakening_consequences_tt: "§R이는 우리를 스릅스카 공화국과의 전쟁에 몰아넣습니다. 이후 이슬람 장악을 선포하면 정부는 이슬람주의로 돌아서고, 헤르체고비나는 군 일부와 함께 분리 독립합니다.§!"
 BOS_islamic_takeover_consequences_tt: "§R정부는 이슬람주의로 돌아서고, 헤르체고비나는 군 일부를 데리고 분리 독립합니다.§!"
 BOS_eufor_withdrawal_threat: "보스니아가 EUFOR의 철수를 요구함"
 BOS_csto_accept_tt: "보스니아가 우리 편에서 CSTO에 가입합니다."
 BOS_csto_reject_tt: "우리는 보스니아의 CSTO 가입 신청을 거절합니다."
 BOS_euro_defence_accept_tt: "우리는 보스니아에 방위 보장을 제공하며 EUFOR 임무는 종료됩니다."
 BOS_euro_defence_decline_tt: "우리는 보스니아의 안보를 보장하기를 거절합니다."
 BOS_events.56.t: "보스니아크계 블록, 중앙 권위 강화 압박"
 BOS_events.56.d: "국가 의회의 보스니아크계 정당들이 자치체의 희생을 감수하고 중앙 기관을 강화하도록 압박하고 있으며, 정부가 자신들을 지지해 주기를 기대하고 있습니다."
 BOS_events.56.a: "중앙집권 추진을 지지한다"
 BOS_events.56.b: "자치체에 대한 입장을 고수한다"
 BOS_events.56.c: "대신 연방 내 개발에 자금을 댄다"
 BOS_events.57.t: "크로아티아계 블록, 자치체 보장 요구"
 BOS_events.57.d: "헤르체고비나의 크로아티아계 지도자들은 크로아티아계 대표권에 대한 더 확고한 보장을 원하며, 그렇지 않으면 국가 기관을 방해하겠다고 경고하고 있습니다."
 BOS_events.57.a: "크로아티아계 블록을 수용한다"
 BOS_events.57.b: "새로운 보장을 거부한다"
 BOS_events.57.c: "대신 헤르체고비나에 투자한다"
 BOS_events.58.t: "스릅스카 공화국, 권한 요구"
 BOS_events.58.d: "바냐루카는 국가에 이양된 권한을 다시 자치체에 돌려줄 것을 재차 요구하고 있으며, 이를 데이턴 합의의 문제로 포장하고 있습니다."
 BOS_events.58.a: "제한적 이양을 협상한다"
 BOS_events.58.b: "요구를 단호히 거부한다"
 BOS_events.58.c: "세입 권한을 자치체에 이양한다"
 BOS_events.61.t: "스릅스카 공화국을 향한 중국의 제안"
 BOS_events.61.d: "스릅스카가 주도하는 정부는 자치체 내 중국 자금 인프라 사업을 승인하고자 합니다. 베이징은 발판을 얻게 되며, 사라예보의 보스니아크계 정당들은 거기에 딸린 조건을 경계하고 있습니다."
 BOS_events.61.a: "사업을 승인한다"
 BOS_events.61.b: "자금 조달을 막는다"
 BOS_events.62.t: "재정 자치 추진"
 BOS_events.62.d: "크로아티아계 인사가 정부 수반이 되자, 헤르체고비나의 지도자들은 사실상 제3의 자치체나 다름없는 세입 권한의 추가 이양을 압박하고 있습니다."
 BOS_events.62.a: "권한을 이양한다"
 BOS_events.62.b: "재정 통제를 중앙에 둔다"
 BOS_events.63.t: "중앙 예산 확대"
 BOS_events.63.d: "보스니아크계가 이끄는 정부는 자치체들이 오랫동안 굶겨 온 국가 기관에 자금을 대기 위해 중앙 예산을 확대하고자 합니다. 바냐루카는 태환 마르크 한 닢마다 분개할 것입니다."
 BOS_events.63.a: "예산을 확대한다"
 BOS_events.63.b: "예산을 그대로 둔다"
 BOS_events.64.t: "계속 떠나는 버스들"
 BOS_events.64.d: "이민은 더 이상 외면할 수 없는 문제가 되었습니다. 교대 근무조 전체가 채워지지 않고 젊은 가족들이 가산을 팔고 떠나고 있습니다. 일자리 프로그램, 청년 정착 보조금, Vc 회랑 무역 연결, 해외 동포 송금이 유출을 늦출 수 있는 수단입니다."
 BOS_events.64.a: "우리 국민을 고국에 붙들어야 한다"
 BOS_events.65.t: "텅 비어 가는 나라"
 BOS_events.65.d: "이탈 행렬이 위기 수준에 이르렀습니다. 간호사가 부족해 병원이 문을 닫고 마을은 반쯤 비어 있습니다. 일자리 프로그램, 청년 정착 보조금, Vc 회랑 연결, 송금에 대한 지속적인 노력만이 압박을 다시 낮출 수 있습니다."
 BOS_events.65.a: "쇠퇴를 되돌린다"
 BOS_entity_competency_transfer: "이양된 자치체 권한"
 BOS_entity_competency_transfer_desc: "세입 징수 권한이 자치체에 이양되어 정치적 평온을 얻었으나, 중앙 정부는 더 느리고 분쟁이 잦아졌습니다."
 BOS_corruption_hits_weakest_tt: "§R정부에 대한 신뢰가 가장 낮은 공동체는 스캔들이 터지면서 더욱 입지를 잃습니다.§!"
 BOS_eu_accession_push: "EU 가입 추진"
 BOS_eu_accession_push_desc: "공식 후보국 지위를 확보하고 모든 공동체가 신청을 지지하는 지금, 가입 의제를 앞으로 밀어붙입니다. 국제 대부 기관들은 이 추진력에 보답하고 개혁 정부에 대한 신뢰가 높아집니다."
 BOS_electoral_reform_package: "선거 개혁 패키지"
 BOS_electoral_reform_package_desc: "모든 공동체가 국가를 신뢰하게 되면, 차별적인 대통령직 구조를 마침내 교체할 수 있습니다. 민족 할당제를 끝내면 옛 순환 직책에 드리웠던 분리 독립의 위협이 사라지는 동시에 그 안정화 효과는 유지됩니다."
 BOS_open_balkan_initiative: "열린 발칸 구상"
 BOS_open_balkan_initiative_desc: "상품, 노동, 자본의 자유로운 이동을 위한 세르비아 주도의 지역 시장에 참여합니다. 베오그라드는 사라예보에서 영향력을 얻지만, 세르비아계 대표들은 더 긴밀한 유대를 환영하고 소기업은 번성합니다."
 BOS_berlin_process_commitment: "베를린 프로세스 참여"
 BOS_berlin_process_commitment_desc: "베오그라드의 영향권이 아닌 독일이 후원하는 베를린 프로세스에 지역 협력의 닻을 내립니다. 친유럽 노선은 크로아티아계와 보스니아크계 파트너를 안심시키고 서방의 자금 조달로 가는 문을 엽니다."
 BOS_confront_entity_obstruction: "자치체의 방해에 맞서기"
 BOS_confront_entity_obstruction_desc: "스릅스카 공화국은 수년간 국가 기관을 가로막고 탈퇴를 위협해 왔습니다. 방해에 정면으로 맞설지, 양보로 평온을 살지 결정하십시오."
 BOS_energy_transition_strategy: "에너지 전환 전략"
 BOS_energy_transition_strategy_desc: "석탄 대 수력의 구도를 넘어 양쪽 자치체에 걸쳐 재생 에너지 용량을 확충합니다. 공동 사업은 크로아티아계와 세르비아계 공동체를 안심시키고 젊은 노동자들이 남을 이유를 줍니다."
 BOS_digital_diaspora_economy: "디지털 해외 동포 경제"
 BOS_digital_diaspora_economy_desc: "기술 부문을 해외의 대규모 이민자 공동체와 연결합니다. 원격 근무와 인재 귀환이 이민 압박을 완화하고 중소기업 소유주들의 마음을 얻습니다."
 BOS_census_2023: "2023년 인구 조사"
 BOS_census_2023_desc: "오랫동안 지연된 인구 조사를 실시합니다. 결과는 각 공동체의 규모를 둘러싼 논쟁을 종결시키겠지만, 정부가 강조하는 쪽은 경쟁 공동체의 희생 위에서 인정받는다고 느낄 것입니다."
 BOS_eu_candidacy_momentum: "EU 후보국 동력"
 BOS_eu_candidacy_momentum_desc: "공식 후보국 지위가 개혁 진영에 활력을 불어넣고 정부에 대한 국민의 신뢰를 안정시켰습니다."
 BOS_reformed_presidency: "개혁된 대통령직"
 BOS_reformed_presidency_desc: "순환 민족 대통령직이 모든 시민에게 열린 체제로 대체되었습니다. 통치는 더 평온하고 정통성이 높아졌으며, 자치체 분리 독립의 끊임없는 위협은 사라졌습니다."
 BOS_open_balkan_market: "열린 발칸 시장"
 BOS_open_balkan_market_desc: "지역 시장 참여로 보스니아 기업의 수출 기회가 넓어졌으며, 국내 소비는 다소 줄어드는 대가를 치릅니다."
 BOS_digital_economy_idea: "디지털 경제"
 BOS_digital_economy_idea_desc: "연결성과 소프트웨어에 대한 투자로 연구 성과가 늘었고 공장들이 현대적인 관행을 도입하는 데 도움이 되었습니다."
 BOS_events.66.t: "자치체의 방해"
 BOS_events.66.d: "스릅스카 공화국 지도부가 다시 국가 입법을 가로막았고 연방 기관에서 탈퇴하겠다고 내비쳤습니다. 정부는 마비가 확산되기 전에 대응해야 합니다."
 BOS_events.66.a: "강경하게 나간다"
 BOS_events.66.b: "양보를 제안한다"
 BOS_events.67.t: "2023년 인구 조사"
 BOS_events.67.d: "인구 조사 수치가 발표 준비를 마쳤습니다. 각 공동체의 지도자들은 공식 결과에서 자신들의 수치가 부각되도록 로비하고 있습니다."
 BOS_events.67.a: "보스니아크계 인구를 강조한다"
 BOS_events.67.b: "크로아티아계 인구를 강조한다"
 BOS_events.67.c: "세르비아계 인구를 강조한다"
 BOS_confront_entity_obstruction_choice_tt: "§Y선택지를 엽니다: 스릅스카 공화국에 직접 맞서거나 타협을 모색합니다.§!"
 BOS_hardline_rs_crisis_warning_tt: "§R밀로라드 도디크가 스릅스카 공화국을 이끄는 동안 세르비아계 신뢰도가 25 미만으로 떨어지면 대치가 분리 독립 위기로 확대될 수 있습니다.§!"
 BOS_reformed_presidency_tt: "§G현재의 순환 대통령직을 개혁된 대통령직으로 대체하여, 안정화 효과는 유지하면서 분리 독립 위험을 끝냅니다.§!"
 BOS_emigration_eased_energy_tt: "§G이민 압박이 5 감소합니다.§!"
 BOS_emigration_eased_digital_tt: "§G이민 압박이 10 감소합니다.§!"
 BOS_digital_diaspora_synergy_tt: "§G해외 동포 송금이 국고 부담 없이 새로운 민간 공장 건설 자금을 댑니다.§!"
 RSK_requisition_the_mines: "광산 징발"
 RSK_requisition_the_mines_desc: "전쟁 자금을 위해 자치체 광산의 생산물을 몰수합니다. 노동자들은 우리에게 고마워하지 않을 것입니다."
 RSK_appeal_to_belgrade: "베오그라드에 호소"
 RSK_appeal_to_belgrade_desc: "세르비아에 자치체를 공개적으로 지지해 달라고 요청하여 사기를 높이고 베오그라드와의 관계를 개선합니다."
 HZG_war_levy: "헤르체고비나 전쟁 부과금"
 HZG_war_levy_desc: "전쟁 자금을 대기 위해 주들에 긴급 부과금을 매깁니다. 안정도가 하락합니다."
 HZG_appeal_to_zagreb: "자그레브에 호소"
 HZG_appeal_to_zagreb_desc: "크로아티아에 헤르체그-보스나를 지지해 달라고 요청하여 사기를 높이고 자그레브와의 관계를 개선합니다."
 BOS_events.68.t: "자치체의 호소"
 BOS_events.68.d: "스릅스카 공화국이 세르비아에 무기와 지원병을 요청했습니다. 베오그라드는 공개적인 지원과 전쟁 확대의 위험을 저울질해야 합니다."
 BOS_events.68.a: "무기와 지원병을 보낸다"
 BOS_events.68.b: "개입하는 모습을 보여서는 안 된다"
 BOS_events.69.t: "베오그라드의 응답"
 BOS_events.69.d: "세르비아의 보급 상자가 전선에 도착했습니다. 자치체의 병사들이 용기를 얻었습니다."
 BOS_events.69.a: "세르비아 민족을 위하여"
 BOS_events.70.t: "주들의 호소"
 BOS_events.70.d: "헤르체그-보스나가 전선을 지키기 위해 크로아티아에 무기와 지원병을 요청했습니다."
 BOS_events.70.a: "주들을 무장시킨다"
 BOS_events.70.b: "자그레브는 이 일에서 빠져야 한다"
 BOS_events.71.t: "자그레브의 응답"
 BOS_events.71.d: "크로아티아의 무기가 헤르체그-보스나에 도착했습니다. 주 방어군이 용기를 얻었습니다."
 BOS_events.71.a: "크로아티아 민족을 위하여"
 RSK_serbian_support_accept_tt: "§G스릅스카 공화국에 보병 무기 2000정을 보내고 지원병 지원을 공개합니다.§!"
 RSK_serbian_support_decline_tt: "§R스릅스카 공화국의 전쟁 지지도가 하락합니다.§!"
 HZG_croat_support_accept_tt: "§G헤르체그-보스나에 보병 무기 1500정을 보내고 지원병 지원을 공개합니다.§!"
 HZG_croat_support_decline_tt: "§R헤르체그-보스나의 전쟁 지지도가 하락합니다.§!"
 BOS_thermal_chinese_financing_tt: "§Y베이징에 대출이 체결되었음이 통보되며, 그 대가로 보스니아에서의 영향력을 확보하게 됩니다.§!"
 BOS_events.72.t: "사라예보, 투즐라 사업에 서명"
 BOS_events.72.d: "보스니아가 투즐라 갈탄 발전소 확장을 위한 신용 한도에 서명했습니다. 우리 장부에서 0.10십억이 나가고 우리 계약업체들이 현장에 투입됩니다. 발전소는 작은 소득일 뿐입니다. 이 대출이 진정으로 사는 것은 사라예보에서의 발언권, 그리고 우리에게 빚진 발칸의 파트너입니다."
 BOS_events.72.a: "훌륭하군."
 BOS_court_turkish_investment_tt: "§Y앙카라에 시장이 열려 있음이 통보되며, 그 대가로 보스니아에서의 영향력을 확보하게 됩니다.§!"
 BOS_court_gulf_investment_tt: "§Y리야드에 자금을 환영한다는 뜻이 통보되며, 그 대가로 보스니아에서의 영향력을 확보하게 됩니다.§!"
 BOS_events.73.t: "사라예보의 문호 개방"
 BOS_events.73.d: "보스니아가 우리 건설사와 은행들에 길을 열어 주었습니다. 고속도로 구간, 주택, 사라예보의 지점망이 그것입니다. 우리 계약업체들에게는 일감이, 여전히 우리를 혈족으로 바라보는 나라에는 발판이 생겼습니다. 이제 앙카라의 말은 연방 내에서 무게를 가질 것입니다."
 BOS_events.73.a: "훌륭하군."
 BOS_events.74.t: "후원자를 얻은 부로이 오존"
 BOS_events.74.d: "사라예보가 부동산, 관광, 금융 분야에 걸프 자본을 초청했습니다. 트르노보의 휴양 도시가 간판 사업이지만, 자금은 더 멀리 닿습니다. 아파트, 호텔, 그리고 그 어음을 쥔 은행들이 그것입니다. 사업이 무엇을 가져다주든, 보스니아의 무슬림 지도부는 어느 쪽의 자금이 도착했는지 기억할 것입니다."
 BOS_events.74.a: "근사하군."
