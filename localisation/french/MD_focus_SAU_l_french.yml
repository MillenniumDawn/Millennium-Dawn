 SAU_tornado_approved: "§GLondres a approuvé la vente des Tornado§!"
 SAU_traditionalist_bop_advanced_range: "§HRoyaume orthodoxe§!"
 SAU_traditionalist_bop_left_side: "§HTraditionaliste§!"
 SAU_traditionalist_bop_low_range: "§HTraditionalisme modéré§!"
 SAU_traditionalist_bop_medium_range: "§HRoyaume conservateur§!"
 SAU_traditionalist_bop_win_range: "§RRester fidèle aux traditions§!"
 SAU_transitional_council_desc: "Un organe de transition d'officiers, de juristes et de notables qui a pris le pouvoir après la chute de la monarchie. Il ne gouverne que jusqu'à ce que la République d'Arabie puisse choisir son propre cours."
 SAU_tt_extend_turkey: "[TUR.GetFlag]§HLa Turquie sera priée de porter le pipeline jusqu'en Europe. Ils doivent accepter.§!"
 SAU_tt_not_houthi: "§RLes Houthis ne doivent pas contrôler le sud du Yémen.§!"
 SAU_tt_pipeline_oil_dependence: "§RAugmente la dépendance pétrolière.§! Le Royaume s'engage davantage à exporter son pétrole."
 SAU_tt_sabotage_chance: "§Y50 % de chances§! de couper le pipeline. En cas de succès, l'Arabie saoudite perd la route et tous ses bénéfices."
 SAU_tt_saddam_talks: "§HBagdad recevra notre proposition. On n'attend pas que Saddam accepte.§!"
 SAU_tt_via_jordan: "§HLa route passe d'abord par la Jordanie. Amman doit accepter avant que Damas ne soit approché.§!"
 SAU_typhoon_approved: "§GLa vente des Eurofighter a été approuvée§!"
 SAU_UK_stratgic_friendship_loc: "[ENG.GetFlag]Le partenariat saoudo-britannique\n Modificateur de coût d'§Hinvestissement étranger§! : §G-2,00 %§!\n§HRetour sur investissement§! : §G+2,00 %§!"
 SAU_UK_stratgic_friendship_UKOne: "Le partenariat saoudo-britannique"
 YEM_south_yemen: "Yémen du Sud"
 SAU_corporate_policy: "Politique des entreprises et du travail"
 SAU_corporate_policy_tt: "§HComment le Royaume réglemente ses entreprises et qui elles ont le droit d'embaucher.§!"
 SAU_corporate_policy_2_tt: "§YLes quotas Nitaqat et les règles de la kafala survivent à tout gouvernement - ces termes survivent à un changement de régime.§!"
 SAU_shura_rebalanced_tt: "§YLes trois bancs reviennent à 40 sièges§! - le Conseil reste contesté et aucune charte n'est délivrée"
 SAU_shura_charter_ulema: "Le Conseil des oulémas seniors"
 SAU_shura_charter_ulema_desc: "L'aile religieuse du Conseil est inscrite dans la Loi fondamentale. La législation est lue d'abord pour sa conformité, et les oulémas ne répondent qu'au roi.\n\nLe Royaume est plus difficile à bouger et bien plus difficile à subvertir. Il cesse aussi d'apprendre aussi vite que ses voisins."
 SAU_shura_charter_technocrats: "Le Conseil de planification"
 SAU_shura_charter_technocrats_desc: "Le Conseil devient ce que ses technocrates ont toujours soutenu qu'il devrait être — un organe de planification doté de gens capables de lire un bilan, avec un mandat permanent sur la politique industrielle et éducative.\n\nLe Royaume se modernise plus vite que quiconque ne l'attendait. Les hommes qu'il a cessé de consulter le remarquent."
 SAU_shura_charter_notables: "La Chambre des familles"
 SAU_shura_charter_notables_desc: "Les grandes maisons marchandes et tribales prennent des sièges permanents, et le Conseil devient la pièce où le patronage du Royaume se négocie au grand jour plutôt qu'en privé.\n\nIl tourne sans heurt et à bon marché. Il ne demandera rien de difficile au pays."
 SAU_events.220.t: "Les planificateurs demandent un mandat"
 SAU_events.220.d: "Les technocrates tiennent désormais le Conseil sans partage. Ils ont rédigé une proposition qui rendrait cela permanent — un mandat de planification permanent sur l'industrie, l'éducation et le budget, avec la composition du Conseil figée dans la Loi fondamentale.\n\nLe roi peut la signer et obtenir un gouvernement qui fonctionne, ou refuser et garder une chambre qu'il peut encore rééquilibrer quand cela lui convient."
 SAU_events.220.a: "Charter le Conseil de planification."
 SAU_events.220.b: "Le Conseil reste ce que j'en fais."
 SAU_events.221.t: "Les familles présentent leur cause"
 SAU_events.221.d: "Les notables tiennent le Conseil, et ils sont venus au Diwan avec une proposition rédigée par des hommes qui négocient avec cette famille depuis un siècle — des sièges permanents pour les grandes maisons, en échange du calme sur lequel le roi s'est toujours reposé.\n\nC'est le gouvernement le moins cher disponible et le moins ambitieux."
 SAU_events.221.a: "Charter la Chambre des familles."
 SAU_events.221.b: "Le Conseil reste ce que j'en fais."
 SAU_events.222.t: "Les savants demandent à être inscrits"
 SAU_events.222.d: "Les oulémas tiennent le Conseil et veulent l'inscrire dans la Loi fondamentale : un organe permanent de savants éminents, avec première lecture de chaque mesure que le Royaume promulgue.\n\nCela réglerait la question de l'autorité religieuse dans le Royaume pour une génération, en faveur des savants, et un roi d'humeur maussade ne pourrait plus l'annuler."
 SAU_events.222.a: "Charter le Conseil des oulémas seniors."
 SAU_events.222.b: "Le Conseil reste ce que j'en fais."
 SAU_junta_grip_firm: "L'édit du Conseil court"
 SAU_junta_grip_firm_desc: "Les ordres donnés à Riyad sont exécutés à Jizan la même semaine. Les gouverneurs provinciaux décrochent le téléphone, les services de sécurité rendent compte vers le haut et non de côté, et personne n'attend plus de voir de quel côté ça penche.\n\nC'est le seul avantage qu'un gouvernement d'officiers a sur celui qu'il a remplacé."
 SAU_junta_grip_uneven: "Un bref inégal"
 SAU_junta_grip_uneven_desc: "Le Conseil gouverne vraiment la capitale et la province orientale, et le reste du Royaume à peu près. On obéit là où quelqu'un surveille.\n\nCela suffit à tenir le pays. Cela ne suffit pas à le changer.\nC'est assez pour tenir le pays. Ce n'est pas assez pour le changer."
 SAU_junta_grip_slipping: "L'édit s'arrête au périphérique"
 SAU_junta_grip_slipping_desc: "Hors de Riyad, les ordres du Conseil sont reçus, classés et ignorés par des hommes qui calculent combien de temps cela durera. Les commandants de garnison ont commencé à s'écrire entre eux plutôt qu'avec la capitale.\n\nUn gouvernement qu'on n'obéit pas n'est pas encore un gouvernement tombé, mais la distinction s'amincit."
 SAU_regency_deadline_tt: "§YUn règlement de comptes échoit dans cinq ans§! - le décret doit être renouvelé, prolongé ou laissé caduquer"
 SAU_debug_shura_seat_jump: "§Y(DEBUG) Technocrates +30 sièges§!"
 SAU_debug_shura_seat_jump_desc: "Pousse le banc technocrate au-delà du seuil de charte de 70 sièges pour que l'événement de charte se déclenche."
 SAU_debug_corp_readout: "§Y(DEBUG) Politique des entreprises§! : impôt [?SAU_corp_tax|%1] migr [?SAU_corp_migration|%1] travailleurs [?SAU_corp_civ_workers|%1] IDE [?SAU_corp_fdi_cost|%1]"
 SAU_debug_corp_readout_desc: "Lit les variables de politique des entreprises et du travail dans lesquelles écrivent les voies Nitaqat et Kafala."
 SAU_debug_junta_control_up: "§Y(DEBUG) Contrôle de la Junte +25§!"
 SAU_debug_junta_control_up_desc: "Augmente l'emprise du Conseil pour tester les paliers d'emprise."
 SAU_debug_junta_control_down: "§Y(DEBUG) Junta Control -25§!"
 SAU_debug_junta_control_down_desc: "Abaisse l'emprise du Conseil pour tester les pénalités de l'édit qui glisse."
 SAU_water_national_company: "La Compagnie nationale des eaux"
 SAU_water_national_company_desc: "Dessalement, distribution et facturation sont regroupés en une régie d'État responsable devant le ministère. Elle construit là où le Royaume a besoin d'eau, non là où la marge est, ce qui est tout l'intérêt et tout le problème.\n\nL'eau atteint l'intérieur. La régie ne fera jamais de profit et on ne le lui a jamais demandé."
 SAU_water_foreign_operators: "Opérateurs étrangers de l'eau"
 SAU_water_foreign_operators_desc: "Les usines sont construites, exploitées et entretenues sous contrat par des firmes qui l'ont fait cent fois, à un standard que le Royaume ne pouvait encore atteindre seul.\n\nL'eau est plus propre et moins chère au mètre cube. Les contrats sont libellés en dollars et le savoir-faire part avec eux."
 SAU_events.223.t: "Le Royaume, brièvement"
 SAU_events.223.d: "Une note brève sur la façon de jouer ce Royaume, par ceux qui devront le diriger.\n\n§HL'avenir du Royaume§! - un équilibre, pas un bouton. Il bouge avec les focuses, les événements et les réformes que le roi promulgue, et il décide de l'accueil du pays à la modernisation. Surveillez-le ; vous ne pouvez pas l'ordonner.\n§HDépendance pétrolière§! - un chiffre de 0 à 100 qui grimpe §Yd'un point tous les trois mois§! tout seul. Les décisions de diversification et les focuses le font baisser. C'est le long débat de toute la campagne.\n§HPolitique des entreprises et du travail§! - dans l'arbre économique. Choisissez les §Oquotas Nitaqat§! (taxer et embaucher des Saoudiens, perdre la main-d'œuvre étrangère) ou la §Ylibéralisation de la kafala§! (ouvriers bon marché et capitaux étrangers, au prix des recettes fiscales et des emplois pour les nationaux). Les deux alimentent le vrai chômage du Royaume.\n§HLes Conseils§! - le Majlis ash-Shura siège dès le départ. Asseyez les §Ooulémas§!, les §Ytechnocrates§! ou les §Gnotables§! ; le banc qui mène donne le caractère, et passé §Y70 sièges§! vous pouvez le charte définitivement. Le Conseil du peuple arrive plus tard, vote des lois, et peut être veté - à un prix.\n§HLa succession§! - à la mort de Fahd les princes manœuvrent. Soutenez-en un via les décisions de prince héritier ; qui mène à la mort du roi prend le trône, et chacun apporte ses directives. §YUne seule directive occupe la cour à la fois.§!\n§HL'armée§! - les officiers tiennent leur propre compte de ce qu'on leur doit. Laissez courir et ils agiront. §RSurveillez le compteur de griefs, et réglez avant qu'il ne soit trop tard§! - le putsch peut être empêché, pas inversé.\n§HLe Printemps arabe§! - si la région s'embrase, l'agitation monte en chiffre. Au point de rupture le roi choisit : tenir et saigner la stabilité, ou §Rlaiser tomber la monarchie§! et remettre le pays à un conseil de transition.\n§HLa République d'Arabie§! - le trône n'est pas éternel, et il y a §Ytrois chemins pour en sortir§! : laisser les officiers prendre Riyad et §OProclamer la République§! sous régime militaire ; garder le trône intact mais §Omettre au pouvoir un parti autre que la Maison d'Al Saoud§!, ce qui ouvre Déclarer la République d'Arabie depuis le Hub royal ; ou laisser le §OPrintemps arabe aller jusqu'au point de rupture§! et s'écarter, ce qui la déclare pour vous. §RLa voie militaire ferme les deux autres§! - un Royaume qui a déjà eu son putsch ne peut plus prendre la voie civile.\n\nTout ce qui précède est visible dans vos onglets de décisions. Rien n'a besoin d'être mémorisé : c'est écrit sur les boutons."
 SAU_events.223.a: "Compris. Commençons."
 SAU_tadawul_needs_market_tt: "§RExige d'abord que le Tadawul soit coté§! - achevez §HTadawul, la Bourse saoudienne§! et chaque focus de cette branche le fera monter d'un palier :"
 SAU_trials_of_the_old_order_choice_tt: "§YUn choix suit§! - « En audience publique, et télévisée » / « Le régler au Ritz, comme avant » / « Des grâces, au tarif en vigueur ». Cela déplace §Hl'emprise des officiers sur l'État et la légitimité de la junte§!."
 SAU_crackdown_on_the_opposition_choice_tt: "§YUn choix suit§! - « Commencer par les comités de la province orientale » / « Placer les prêches sous revue » / « Commencer par les signataires de pétitions » / « Prendre les trois dossiers ensemble ». Cela déplace §Hl'emprise des officiers sur l'État et la légitimité de la junte§!."
 SAU_water_pride_open_tt: "§YOuvre Eaux souveraines§! - neuf rangs de Catastrophique à Triomphant. Cela suit la §Hstabilité§! : un pays confiant croit que les robinets couleront, un pays ébranlé non. Cela se règle chaque mois de soi-même."
 SAU_unif_road_still_open_tt: "§YLe Conseil ne s'est pas encore tourné ailleurs§! - demander de nouveaux partenaires ou déclarer l'autonomie ferme définitivement la voie américaine."
 SAU_unif_usa_refused_tt: "§YWashington n'a pas déjà pris le Golfe sous son aile§! - ouvert si vous n'avez jamais demandé, ou si les Américains ont §Rrefusé§!."
 SAU_unif_partners_refused_tt: "§YAucun partenaire extérieur n'a pris le Golfe sous son aile§! - ouvert si vous n'avez jamais demandé, ou s'ils ont §Rrefusé§!."
 SAU_unif_not_yet_autonomous_tt: "§YLe Conseil n'a pas déclaré son indépendance§! - y aller seul ferme cette voie."
 SAU_unif_no_member_aligned_tt: "§YAucun membre du Conseil n'a invité une puissance étrangère§! - bases turques ou indiennes, conseillers russes, garanties de sécurité extérieures, achats d'armes ou marchés étrangers ferment tous cette voie."
 SAU_intel_surveillance_bypass_tt: "§YContourne les exigences propres de l'agence§! - aucune recherche §HInformatique améliorée§! et aucune amélioration §HFormer un département§! nécessaires"
 SAU_Intelligence_category_desc: "La Présidence générale du renseignement (GIP) est l'agence principale du Royaume, chargée du recueil et de l'analyse du renseignement intérieur et extérieur. Elle joue un rôle crucial dans la sécurité nationale, la lutte antiterroriste et la planification stratégique.\n\n§GDébloquer la GIP§! vous permettra de prendre des décisions qui renforcent vos capacités de renseignement, offrant des aperçus et des avantages précieux, au pays comme à l'étranger.\n\nUne décision s'ouvrira lorsque vous atteindrez §G70 %§! de pénétration du réseau GIP dans un pays, et sera d'autant plus probable que la pénétration est élevée. Elle sera indisponible si la pénétration retombe sous 70 %."
 SAU_Foregin_affairs_category_desc: "§G Affaires étrangères de l'Arabie saoudite§!\nLa politique étrangère du Royaume est un délicat exercice d'équilibre diplomatique. Puissance régionale et gardienne des lieux saints de l'islam, nous devons naviguer des alliances complexes, sécuriser nos intérêts économiques et maintenir la stabilité au Moyen-Orient. Que nous nous alignions étroitement sur nos alliés occidentaux traditionnels, que nous basculions vers les marchés orientaux émergents, ou que nous nous affirmions comme hégémon régional indépendant, notre corps diplomatique ouvrira la voie.\n\n Pour ouvrir davantage de décisions liées aux affaires étrangères, vous devez achever des focuses ou obtenir un événement spécial en avançant\n\n Toutes les décisions réapparaîtront un an après votre choix."
 SAU_domestic_external_category_desc: "Les leviers du Royaume sur le front intérieur, le pétrole, et l'avenir au-delà.\n\n§HComment ces décisions apparaissent :§!\nMesures §Gintérieures§! - campagnes de construction, fonds de développement et réforme de la main-d'œuvre - se débloquent avec §Y« Libéralisation économique »§!.\nMouvements §Gpétroliers§! - hausse de la production, nouveaux champs, conservation des réserves, embargo pétrolier et leviers de l'OPEP - se débloquent avec §Y« Saudi Aramco »§! et sa doctrine d'export.\nProjets de §Gdiversification§! - investissements du FPI, giga-projets, renouvelables, économie numérique, tourisme et industrie de défense - se débloquent à mesure que vous achevez l'arbre §Y« Vision 2030 »§!.\n\n§HCertaines décisions exigent davantage :§! un §Ynouveau champ pétrolier§! nécessite la stratégie de production d'Aramco ; l'§Yembargo pétrolier§! ne peut être proclamé qu'§Gen temps de paix§! tant que l'économie pétrolière tourne. Chacune coûte du temps et du Trésor, et la plupart font monter ou baisser votre §Hdépendance pétrolière§!.\n§HCertaines décisions exigent davantage :§! un §Ynouveau champ pétrolier§! nécessite la stratégie de production d'Aramco ; l'§Yembargo pétrolier§! ne peut être proclamé qu'§Gen temps de paix§! tandis que votre économie pétrolière tourne. Chacune coûte du temps et du Trésor, et la plupart font monter ou baisser votre §Hdépendance pétrolière§!."
 SAU_vision2030_category_desc: "Les giga-projets de l'Arabie saoudite, chacun avec son échéance. Financez-les et achevez-les à temps pour faire de Vision 2030 une réalité. Laissez passer les délais et les projets deviennent des monuments coûteux à l'ambition, tirant la Vision vers l'échec.\n\n Il y aura une décision pour construire chaque projet ; chaque projet a une échéance visible au survol ; elle se met à jour chaque semaine : si c'est 1848, la prochaine mise à jour de l'échéance de la décision sera 1841 (-7 jours)\n\n si vous n'avez pas fait le projet et que l'échéance est passée, cela inflige un malus à la Vision 2030 ; sinon, une fois le projet achevé, le bonus augmente\nsi vous n'avez pas fait le projet et que le délai expire, cela inflige un malus à Vision 2030 ; sinon, lorsque vous achevez le projet, le bonus augmente à la place"
 SAU_military_category_desc: "Le long programme de reconstruction des forces armées du Royaume après le choc de l'§Lopération Tempête du désert§! - d'une armée qui avait besoin de la puissance aérienne, de la logistique et du commandement §Laméricains§! pour combattre, vers une force moderne et un vrai contrepoids à l'§LIran§!.\n\n§HComment ça marche :§!\nChaque réforme est une §Ydécision§! débloquée par un §Yfocus§! militaire. Chacune ouvre un §Gchoix de doctrines§! - et chaque doctrine est un §Rcompromis§! délibéré, renforçant les forces d'un côté et les coûtant de l'autre. Vous pouvez relancer une réforme plus tard pour §Ychanger de doctrine§!.\n\n§HLes trois stades :§!\nLa préparation avance par stades - §RNon modernisé§! à §YEn réforme§! à §YModernisation§! à §GModernisé§!. Chaque stade révèle son lot de réformes, et vous devez §Ytoutes les achever§! avant que le suivant s'ouvre. Tout commence en gagnant les §Lmanœuvres : leçons du Golfe§!.\n\nChaque doctrine choisie alimente l'esprit national §LLes forces armées saoudiennes§!, où l'effet combiné est affiché.\n§HComment cela fonctionne :§!\n§HLes trois étapes :§!"
 SAU_crown_prince_category_desc: "[ROOT.GetSAUSuccessionPanel]"
 SAU_king_abdullah_category_desc: "Abdallah tient le Royaume dès l'année d'ouverture - régent tant que Fahd vit, roi de plein droit à partir de 2005. Sa mort en janvier 2015 résout la course à la succession, et celui de §YSalmane§!, §YMohammed ben Nayef§! ou §YMoutaïb§! qui a rassemblé le plus d'influence hérite à la fois du trône et de son propre jeu de directives. Utilisez les décisions §YPrince héritier§! pendant son règne pour décider lequel. Chaque directive occupe la cour §Y60 jours§!, et aucune seconde directive ne peut être émise tant que la première n'a pas suivi son cours."
 SAU_king_salman_category_desc: "Le règne de Salmane ouvre une seconde contestation, §YMohammed ben Salmane§! contre §YMohammed ben Nayef§!, réglée en juin 2017 - où vous pouvez couronner le vainqueur immédiatement ou le laisser prince héritier. Si vous attendez, il prend le trône lorsque la santé du roi finit par céder, en 2032 au plus tard. Surveillez-le dans l'onglet §YPrince héritier§!, et étayez-le ou usez-le à votre guise. Chaque directive occupe la cour §Y60 jours§!, et aucune seconde directive ne peut être émise tant que la première n'a pas suivi son cours."
 SAU_king_mbs_category_desc: "Atteint en soutenant Mohammed ben Salmane dans la course au prince héritier sous le roi Salmane, puis soit en le déclarant roi d'emblée en 2017, soit en attendant que la santé de Salmane cède. Chaque directive occupe la cour §Y60 jours§!, et aucune seconde directive ne peut être émise tant que la première n'a pas suivi son cours."
 SAU_king_mbn_category_desc: "Atteint de deux façons : pousser Mohammed ben Nayef devant Salmane et Moutaïb dans la course à la succession de l'ère Abdallah, ou le faire nommer prince héritier sous le roi Salmane et survivre au roi. Chaque directive occupe la cour §Y60 jours§!, et aucune seconde directive ne peut être émise tant que la première n'a pas suivi son cours."
 SAU_king_mutaib_category_desc: "Atteint seulement en gagnant franchement la course à la succession de l'ère Abdallah, devant Salmane et Mohammed ben Nayef - la voie de l'outsider. Aucune succession ultérieure n'est scriptée au-delà de lui. Chaque directive occupe la cour §Y60 jours§!, et aucune seconde directive ne peut être émise tant que la première n'a pas suivi son cours."
 SAU_faisalite_category_desc: "Fayçal ibn Abdelaziz n'a jamais été isolationniste. Il fonda la Ligue du monde musulman, et quand al-Aqsa brûla en 1969 il réunit les chefs d'État musulmans à Rabat en quelques semaines - l'Organisation de la conférence islamique fut son œuvre. Il ouvrit le Trésor à l'Égypte et à la Jordanie à Khartoum après 1967, cloua l'armée expéditionnaire de Nasser dans les montagnes du Yémen, charte la Banque islamique de développement, et en 1973 fit de l'huile elle-même une arme et la fit sentir à l'Occident. L'autosuffisance n'était jamais sa destination. C'était son moyen - la force dont un Royaume a besoin avant de parler pour l'Oumma sans demander congé à personne.\n\nSes héritiers reçoivent la doctrine sans l'homme, et avec elle une question qu'il n'eut jamais à trancher. L'§Oisolationnisme§! prend l'autosuffisance pour sa propre récompense : frontière scellée, pas de clients, pas de croisades, un Royaume responsable devant personne. L'§Rinterventionnisme§! la prend comme Fayçal - une fondation, posée pour que Riyad mène les fidèles et se tienne armée entre les blocs plutôt que derrière l'un d'eux.\n\n§HOù le Royaume se tient aujourd'hui§! - [ROOT.GetSAUFaisaliteLean]\n[ROOT.GetSAUFaisaliteLeanEffect]\n\n§HDirectives en cours§! : §Y[?SAU_faisalite_active|0]§! sur §Y2§!. Deux peuvent courir à la fois, de chaque côté, et chacune ne paie qu'une fois son cours achevé.\n\nFocuses, événements et les décisions ci-dessous font tous bouger ces compteurs, et rien ici n'est bon marché. Celui qui sera le plus haut quand les piliers seront dressés tranche le dernier d'entre eux - §RLa doctrine de la troisième voie§! ou §OL'isolation splendide§!.\nFocuses, événements et les décisions ci-dessous font tous bouger ces comptes, et rien ici n'est acheté à bon marché. Celui qui se tient plus haut lorsque les piliers sont dressés règle le dernier d'entre eux - §RLa doctrine de la troisième voie§! ou §OL'isolement splendide§!."
 SAU_junta_category_desc: "Le Conseil gouverne par deux choses et n'en possède aucune franchement. Le §Hcontrôle§! est ce qu'il peut imposer - garnisons, checkpoints, dossiers, hommes qui répondent à l'appel. La §Hlégitimité§! est ce qu'on lui doit, et on ne lui doit rien : pas d'élection, pas de fatwa, pas de succession, seulement le fait que l'acier est arrivé le premier.\n\nTout ce qui élève l'un se paie sur l'autre. La légitimité tombe d'un point chaque mois quoi qu'il arrive - une junte qui gouverne simplement en silence est une junte à court de temps.\n\n§HÀ zéro, le Conseil a quatre-vingt-dix jours pour trouver une raison d'exister. S'il ne le peut, le Royaume tranchera la question sur le terrain.§!"
 SAU_officer_crisis_category_desc: "L'armée régulière a porté le coût du krach et la Garde nationale non, et le corps des officiers a compris lequel de ces faits est délibéré. Rien de tout cela n'a à finir par des chars sur Olaya Street. Cela n'y finit que si l'on ne fait rien.\n\n§HLe corps des officiers§! - [ROOT.GetSAUArmyGrievance] (§Y[?SAU_army_grievance|0]§! sur §Y100§!)\n[ROOT.GetSAUArmyGrievanceEffect]\n\nLe grief grimpe chaque mois tout seul. Ramenez-le à §Y0§! et vous pouvez régler définitivement avec les officiers ; laissez-le passer §Y75§! avec l'ordre de déploiement donné et ils régleront eux-mêmes."
 SAU_modernisation_balance_of_power_category_desc: "Deux visions luttent pour l'âme du §LRoyaume d'Arabie saoudite§!. Le camp §Rtraditionaliste§! - le §LConseil des oulémas seniors§!, la §Lcour royale§!, les §Lanciens tribaux§! - garde les anciennes voies. Le camp de la §Glibéralisation§! - les technocrates, les ingénieurs formés à l'étranger, les avocats de §LVision 2030§! - pousse à l'ouverture, à la réforme, et à une place à la table du monde moderne. L'équilibre bascule avec chaque focus achevé et chaque décision prise."
 SAU_spread_revolution_category_desc: "La République populaire d'Arabie n'est que la première étincelle. La révolution doit s'étendre jusqu'à ce que chaque travailleur arabe ait brisé ses chaînes.\n\nCette catégorie se débloque une fois §YLa République populaire d'Arabie§! achevée et un gouvernement communiste au pouvoir. §YDiffuser la révolution§! élève le soutien communiste dans les pays arabes, tandis que §YFonder le Komintern arabe§! rassemble les États ouvriers frères. Une décision §YLancer la révolution socialiste§! reste §Rcachée§! sur chaque pays arabe jusqu'à ce que ses communistes atteignent §Y30 %§! de soutien : continuez de diffuser jusqu'à ce qu'elle apparaisse. Une fois là, frappez : à §Y50 %§! ou plus la révolution s'empare de l'État d'emblée, tandis que §Y30-50 %§! allume une guerre civile révolutionnaire. Les États ouvriers frères ne sont jamais renversés, seulement accueillis dans le §YKomintern arabe§! via §YInviter au Komintern arabe§!."
 SAU_pipeline_sabotage_category_desc: "Le pétrole du Royaume part par oléoduc, et celui de tout le monde aussi.\n\n§RFrapper la ligne d'un rival fait monter le prix du brut et la température de la région§! à parts égales."
 SAU_coalition_member_category_desc: "Nous avons répondu à l'invitation de Riyad et nos appareils sont dans la rotation. Ce que cela vaut - et combien de temps nous entendons continuer à le payer - est une question pour nous seuls, et la porte de sortie n'est pas verrouillée."
 SAU_debug_category_desc: "Outils de test pour les systèmes de succession, de règne et de santé du roi Salmane. Cette catégorie n'existe que dans une build de débogage - elle est invisible dans un lancement normal et en multijoueur."
 SAU_proxy_aggression_desc: "Nous finançons des attaques contre leur peuple. Ils ne l'oublieront pas de sitôt."
 SAU_traditionalist_bop_left_side_desc: "Le §Lclergé wahhabite§!, les princes conservateurs et les cheikhs tribaux. Ils préservent le caractère du Royaume mais résistent aux changements que le monde exige."
 SAU_liberalisation_bop_right_side_desc: "Les §Ltechnocrates§!, les ingénieurs formés à l'étranger et les princes réformateurs. Ils ouvrent les portes du Royaume - au prix de déranger l'ordre établi."
 SAU_modernisation_bop_centre_range_desc: "Ni la tradition ni la réforme ne dominent. Le Royaume tient bon - pour l'instant."
 SAU_traditionalist_bop_low_range_desc: "Le clergé et les conservateurs ont un §Yléger avantage§!. Le Royaume avance avec prudence."
 SAU_traditionalist_bop_medium_range_desc: "La tradition est la §Hmain qui guide§!. Les propositions de réforme sont pesées contre des siècles de précédent - et généralement trouvées insuffisantes."
 SAU_traditionalist_bop_advanced_range_desc: "Le §LConseil des oulémas seniors§! fixe l'agenda. Les modernisateurs sont §Ymarginalisés§! ou §Yexilés§!. Le Royaume se tourne vers l'intérieur."
 SAU_traditionalist_bop_win_range_desc: "Les §Loulémas§! gouvernent en tout sauf le nom. Le monde appelle ; le Royaume ne répond pas. La tradition a §Rgagné§!, et le prix se paie en décennies perdues."
 SAU_liberalisation_bop_low_range_desc: "Les réformateurs ont un §Gpied dans la porte§!. De nouveaux bureaux, de nouvelles écoles, de nouvelles idées s'infiltrent par les fissures."
 SAU_liberalisation_bop_medium_range_desc: "Le programme du §Lprince héritier§! est la nouvelle orthodoxie. Les universités s'étendent, le tourisme s'ouvre, les femmes conduisent."
 SAU_liberalisation_bop_advanced_range_desc: "Réforme sur réforme. Les §Loulémas§! grognent ; les §Ltribus§! grognent ; mais le §Grythme§! ne ralentit pas. Le Royaume change plus vite que son peuple ne peut métaboliser."
 SAU_liberalisation_bop_win_range_desc: "L'Arabie saoudite est §Gméconnaissable§! par rapport au Royaume de 2000. Capital étranger, tourisme étranger, culture étrangère. Les réformateurs ont §Ggagné§! - mais les §Yclercs§! n'ont pas oublié."
 SAU_Monarchy_house_of_al_saud_desc: "La maison des Al Saoud est la famille régnante du Royaume d'Arabie saoudite. Elle fut fondée par Abdelaziz Ibn Saoud en 1932 et a depuis maintenu le contrôle du pays par un mélange d'alliances politiques, de légitimité religieuse et de puissance économique tirée de la richesse pétrolière."
 SAU_Military_Rule_desc: "Le Conseil militaire suprême gouverne le Royaume. Le trône demeure, les ministères répondent ailleurs, et les officiers qui ont pris Riyad découvrent que tenir un pays est considérablement plus dur que d'en saisir un."
 SAU_gip_network: "§HRéseau de stations GIP§!"
 SAU_gip_network_tt: "Stations, couvertures et officiers traitants - la capacité permanente de la Présidence.\n"
 SAU_gip_slots_cap_tt: "§YLa Présidence ne peut faire tourner que 3 officiers supplémentaires au plus§! - les stations sont bâties, et il n'y en a plus à ouvrir."
 SAU_stage1_decision_gate_tt: "§YCette décision apparaît une fois l'étape I commencée.§!"
 SAU_stage2_decision_gate_tt: "§YCette décision apparaît une fois l'étape II commencée.§!"
 SAU_stage3_decision_gate_tt: "§YCette décision apparaît une fois l'étape III commencée.§!"
 SAU_vision2030_commitment_tt: "§RLe Royaume est désormais engagé : livrer les projets, ou affronter le backlash des promesses rompues.§!"
 SAU_tadawul_matured_tt: "§GLe Tadawul a atteint sa cotation maximale§! - la bourse ne peut plus être relevée, donc l'introduction en bourse finance de §Hnouveaux bureaux§! à la place :"
 SAU_events.402.t: "La rivalité mise de côté"
 SAU_events.402.d: "L'ouverture de Téhéran a été acceptée. Les ambassades rouvriront, la campagne contre la République islamique est réduite, et les clercs qui nous appelaient usurpateurs trouveront leurs sermons discrètement édités. Les armes du Hezbollah se détournent de nous avec celles de leur patron. La rivalité n'est pas oubliée — mais elle est, pour l'heure, mise de côté."
 SAU_events.402.a: "Une paix plus froide que l'amitié, et meilleure que l'alternative."
 SAU_accession_to_the_sco: "Adhésion à l'OCS"
 SAU_accession_to_the_sco_desc: "Riyad est devenu partenaire de dialogue de l'Organisation de coopération de Shanghai en 2023. Une adhésion pleine approfondirait les relations avec la Chine et la Russie, mais exigerait aussi une coopération plus étroite avec l'Iran."
 SAU_the_royal_saudi_air_force: "La Force aérienne royale saoudienne"
 SAU_the_royal_saudi_air_force_desc: "Développer la Force aérienne royale saoudienne (RSAF) en la plus puissante force aérienne du Golfe."
 SAU_peace_sun_f_15_eagle_program: "Peace Sun : programme F-15 Eagle"
 SAU_peace_sun_f_15_eagle_program_desc: "Lancer le programme Peace Sun avec les États-Unis pour faire entrer le F-15 Eagle dans le Royaume."
 SAU_f_15c_d_eagle_squadrons: "Escadrons F-15C/D Eagle"
 SAU_f_15c_d_eagle_squadrons_desc: "Mettre en ligne des escadrons de F-15C/D Eagle pour conquérir et tenir la supériorité aérienne au-dessus des cieux saoudiens."
 SAU_f_15s_eagle: "F-15S Aigle"
 SAU_f_15s_eagle_desc: "Acquérir le F-15S Eagle au titre de Peace Sun IX, capable de disputer le ciel et de frapper en profondeur."
 SAU_tornado_gr4: "Tornade GR4"
 SAU_tornado_gr4_desc: "L'accord Al-Yamamah avec la Grande-Bretagne fera entrer le Tornado GR4 en service saoudien. Sa capacité de frappe s'accompagne d'une longue dépendance à la formation, aux pièces et à la maintenance britanniques."
 SAU_panavia_tornado: "Panavia Tornade"
 SAU_panavia_tornado_desc: "Mettre en ligne des escadrons Panavia Tornado pour la frappe, la reconnaissance et la défense aérienne."
 SAU_the_european_typhoon_al_salam_deal: "Le Typhoon européen : accord Al Salam"
 SAU_the_european_typhoon_al_salam_deal_desc: "Signer l'accord Al Salam pour le Typhoon, chasseur polyvalent moderne pour le nouveau siècle."
 SAU_f_15sa_advanced_eagle: "F-15SA Aigle Avancé"
 SAU_f_15sa_advanced_eagle_desc: "Le F-15SA est plus qu'un achat. Son avionique, ses armes et ses exigences de maintenance requièrent une base de soutien saoudienne capable de tenir l'Advanced Eagle en l'air."
 SAU_e_3_sentry_awacs: "E-3 Sentinelle AWACS"
 SAU_e_3_sentry_awacs_desc: "Mettre en œuvre l'AWACS E-3 Sentry pour voir et contrôler toute l'image aérienne et diriger les chasseurs."
 SAU_aerial_refueling_fleet: "Flotte de ravitaillement aérien"
 SAU_aerial_refueling_fleet_desc: "Constituer une flotte de ravitailleurs afin que les jets saoudiens patrouillent tout le Royaume et frappent à longue distance."
 SAU_c_130_hercules_airlift: "Transport aérien C-130 Hercules"
 SAU_c_130_hercules_airlift_desc: "Étendre la flotte de C-130 Hercules pour déplacer troupes et ravitaillement n'importe où, à grande vitesse."
 SAU_king_abdulaziz_air_base: "Base aérienne du roi Abdulaziz"
 SAU_king_abdulaziz_air_base_desc: "Développer la base aérienne Roi-Abdulaziz à Dhahran, gardienne de la province orientale et du Golfe."
 SAU_king_khalid_air_base: "Base aérienne du roi Khalid"
 SAU_king_khalid_air_base_desc: "Développer la base aérienne Roi-Khalid à Khamis Mushait, base durcie du sud couvrant la frontière yéménite."
 SAU_prince_sultan_air_base: "Base aérienne Prince Sultan"
 SAU_prince_sultan_air_base_desc: "Développer la base aérienne Prince-Sultan à Al Kharj, plaque tournante centrale au cœur du Royaume."
 SAU_precision_guided_munitions: "Munitions à guidage de précision"
 SAU_precision_guided_munitions_desc: "Stocker bombes et missiles guidés de précision afin qu'une seule sortie détruise ce qui en exigeait autrefois beaucoup."
 SAU_saudi_uav_program: "Programme de drones saoudien"
 SAU_saudi_uav_program_desc: "Lancer un programme de drones saoudiens pour la surveillance longue endurance et la frappe de précision."
 SAU_air_operations_command: "Commandement des opérations aériennes"
 SAU_air_operations_command_desc: "Établir un commandement central des opérations aériennes pour planifier et conduire toute la campagne aérienne comme un tout."
 SAU_secure_support_in_the_al_madinah_province: "S'assurer le soutien de la province d'Al-Madinah"
 SAU_secure_support_in_the_al_madinah_province_desc: "Médine abrite la mosquée du Prophète et un établissement clérical influent. S'assurer le soutien de ses oulémas aidera à légitimer le Conseil et à réduire l'opposition religieuse."
 SAU_the_house_of_al_saud: "La maison d'Al Saoud"
 SAU_the_house_of_al_saud_desc: "Abdulaziz ibn Saoud établit un système de succession qui faisait passer le trône parmi ses fils par séniorité. Après six rois et soixante-dix ans, les frères encore éligibles vieillissent et le Royaume doit préparer la succession à la génération suivante."
 SAU_ground_broken_at_rabigh: "Pose de la première pierre à Rabigh"
 SAU_ground_broken_at_rabigh_desc: "Le Royaume entamera la construction d'une ville économique de 68 kilomètres carrés à Rabigh, prévue pour deux millions d'habitants et un grand port de mer Rouge. C'est la plus vaste des six villes économiques destinées à attirer l'investissement privé aux côtés du financement public."
 SAU_hold_municipal_elections: "Organiser des élections municipales"
 SAU_hold_municipal_elections_desc: "Les hommes de plus de vingt et un ans éliront la moitié des sièges des conseils municipaux, le gouvernement nommant le reste. Les conseils n'ont qu'une autorité limitée sur des services comme le drainage, l'éclairage et les permis, mais le vote établit un précédent politique important."
 SAU_establish_the_peoples_council: "Établir le Conseil du peuple"
 SAU_establish_the_peoples_council_desc: "Le Royaume établira un conseil élu habilité à proposer des lois sur les affaires intérieures. Le roi conservera un veto absolu, mais l'exercer aura un coût politique visible."
 SAU_securing_our_future: "Assurer notre avenir"
 SAU_securing_our_future_desc: "Le Royaume resserrera le contrôle des publications par des licences, des rédacteurs agréés et des restrictions sur les sujets sensibles. Cela affaiblira l'opposition organisée et renforcera le régime, mais découragera aussi le retour des diplômés qualifiés et empêchera les ministères de recevoir une critique honnête."
 SAU_intervention_in_bahrain: "Intervention à Bahreïn"
 SAU_intervention_in_bahrain_desc: "La Force du bouclier de la Péninsule est intervenue à Bahreïn en mars 2011 à la demande du gouvernement bahreïni et a aidé à réprimer les troubles à Manama. Le Royaume renouvellera cet engagement et se préparera à défendre la maison de Khalifa sans attendre un autre sommet du CCG."
 SAU_investigate_the_east: "Enquêter à l'est"
 SAU_investigate_the_east_desc: "Les protestations à Qatif et Awamiyah sont passées des revendications sur le chômage et les détenus à des griefs politiques plus larges. Le ministère de l'Intérieur enquêtera sur l'activité oppositionnelle dans la province orientale et agira contre les menaces identifiées."
 SAU_women_in_the_shura_council: "Des femmes au Conseil de la choura"
 SAU_women_in_the_shura_council_desc: "Aucune femme n'a siégé au Conseil consultatif, bien que la Loi fondamentale n'interdise pas leur nomination. Le roi peut nommer des femmes directement, mais il devra le faire malgré l'opposition attendue des oulémas conservateurs."
 SAU_the_oil_defense_strategy: "La stratégie de défense pétrolière"
 SAU_the_oil_defense_strategy_desc: "Le Royaume dépend d'un petit nombre d'installations pétrolières le long de la côte du Golfe. Une stratégie unifiée de défense pétrolière coordonnera le budget et protégera ces installations tandis que l'État développera des alternatives."
 SAU_national_security_threats: "Menaces à la sécurité nationale"
 SAU_national_security_threats_desc: "La sécurité nationale saoudienne affronte quatre menaces liées : la guerre à la frontière sud, le recrutement djihadiste, les troubles parmi la population chiite près des champs pétroliers, et les groupes soutenus par l'Iran aux frontières du Royaume. Un service unique sera financé pour évaluer et coordonner la politique contre les quatre."
 SAU_the_riyadh_meeting_operation_decisive_storm: "La réunion de Riyad : opération Tempête décisive"
 SAU_the_riyadh_meeting_operation_decisive_storm_desc: "Une coalition de neuf États s'est réunie à Riyad et a lancé l'opération Tempête décisive le 26 mars 2015, combinant opérations aériennes et blocus naval. Les planificateurs saoudiens attendaient une campagne brève, malgré les mises en garde de Yéménites familiers du conflit."
 SAU_the_tenth_five_year_plan: "Le dixième plan quinquennal"
 SAU_the_tenth_five_year_plan_desc: "Le dixième plan quinquennal fixe des objectifs de croissance hors pétrole, d'emploi saoudien et de diversification économique. Les plans précédents promettaient déjà cela, mais le déclin des réserves rend l'exécution de plus en plus urgente."
 SAU_defying_the_ajam: "Défier les Ajam"
 SAU_defying_the_ajam_desc: "L'exécution de Nimr al-Nimr, l'incendie de l'ambassade saoudienne à Téhéran et la rupture des relations diplomatiques ont fortement aggravé la rivalité avec l'Iran. Le Royaume acceptera les coûts économiques et diplomatiques plutôt que de paraître céder."
 SAU_aramco_ipo: "Introduction en bourse d'Aramco"
 SAU_aramco_ipo_desc: "L'Arabie saoudite a introduit 1,5 % d'Aramco au Tadawul en décembre 2019, levant environ 25 milliards de dollars. La vente n'a pas atteint la valorisation de deux mille milliards proposée par le prince héritier ni une cotation étrangère, mais elle reste la plus grande cession d'un actif d'État de la région."
 SAU_vision_2030_announced: "Vision 2030 annoncée"
 SAU_vision_2030_announced_desc: "Vision 2030 a été annoncée en avril 2016, avec pour cibles un fonds souverain de deux mille milliards de dollars, une moindre dépendance au pétrole, plus d'emploi privé et une vaste réforme sociale. Contrairement aux plans de diversification antérieurs, elle fixe une échéance ferme de livraison."
 SAU_saudi_israel_normalization_track: "La voie de normalisation entre l’Arabie saoudite et Israël"
 SAU_saudi_israel_normalization_track_desc: "L'Arabie saoudite n'a ni traité ni relations d'ambassade avec Israël, mais elle autorise les survols israéliens et maintient des contacts discrets du renseignement. Riyad continue d'exiger publiquement des progrès sur la Palestine tout en discutant en privé d'une normalisation à d'autres conditions."
 SAU_establish_corruption_courts: "Établir des tribunaux anticorruption"
 SAU_establish_corruption_courts_desc: "Le Royaume établira des tribunaux spécialisés anticorruption et une commission permanente compétente à l'égard des ministres et des princes. Leur crédibilité dépendra de ce qu'ils poursuivront aussi bien les prévenus de haut rang que les fonctionnaires ordinaires."
 SAU_the_ritz_carlton_purge: "La purge du Ritz-Carlton"
 SAU_the_ritz_carlton_purge_desc: "La campagne anticorruption a détenu environ deux cents princes et hommes d'affaires au Ritz-Carlton et récupéré d'importants avoirs. Elle a aussi consolidé l'autorité du prince héritier sur la famille royale."
 SAU_backdoor_deals: "Offres de porte dérobée"
 SAU_backdoor_deals_desc: "Les détenus du Ritz-Carlton seront libérés après des règlements financiers négociés en privé plutôt que des procès publics. Cela récupère vite les avoirs, mais l'absence de procédures transparentes entamera la confiance dans l'État de droit."
 SAU_a_new_kingdom: "Un nouveau royaume"
 SAU_a_new_kingdom_desc: "Abdallah a gouverné au nom de Fahd pendant une grande partie de la décennie avant la mort de celui-ci. Son avènement laisse l'ordre constitutionnel inchangé mais lui donne l'autorité directe d'appliquer des politiques qu'il n'avait jusqu'alors que proposées."
 SAU_consolidating_the_crown: "Consolider la Couronne"
 SAU_consolidating_the_crown_desc: "Un décret royal créera le Conseil d'allégeance, composé de fils et petits-fils d'Abdulaziz, pour confirmer les princes héritiers et évaluer l'aptitude d'un roi. Cela crée la première procédure écrite de succession, bien que la capacité du Conseil à contraindre le roi reste incertaine."
 SAU_scholarship_programs_abroad: "Programmes de bourses à l'étranger"
 SAU_scholarship_programs_abroad_desc: "Le programme de bourses financera des dizaines de milliers de Saoudiens et leurs familles pour étudier à l'étranger. Il élargira la main-d'œuvre qualifiée du Royaume, tout en exposant les étudiants à des systèmes politiques et sociaux différents de ceux de l'Arabie saoudite."
 SAU_expand_the_national_guard: "Étendre la Garde nationale"
 SAU_expand_the_national_guard_desc: "La Garde nationale est recrutée parmi les tribus historiquement loyales à Abdulaziz et opère hors du commandement militaire régulier. L'étendre protège le trône et empêche le corps des officiers réguliers de contrôler toute la force armée du Royaume."
 SAU_joining_the_wto: "Adhérer à l'OMC"
 SAU_joining_the_wto_desc: "Après douze ans de négociations, le Royaume adhérera à l'OMC en consolidant les tarifs, ouvrant des secteurs de services, admettant banques et assureurs étrangers et révisant le droit commercial. L'adhésion limite une partie de l'autonomie commerciale mais donne à l'Arabie saoudite une voix dans le système qui régit ses exportations pétrolières."
 SAU_al_saud_national_dialogue: "Dialogue national"
 SAU_al_saud_national_dialogue_desc: "Le Dialogue national réunit oulémas chiites, savants salafistes, femmes et hommes pour discuter des questions nationales et en rapporter les conclusions au roi. Il n'a aucune autorité législative, mais il permet un débat public inhabituellement large."
 SAU_counter_terrorism_cooperation: "Coopération antiterroriste"
 SAU_counter_terrorism_cooperation_desc: "Les attentats de 2003 contre les compounds ont montré qu'Al-Qaïda visait l'État saoudien autant que les Américains dans le Royaume. L'Arabie saoudite répondra par des raids, des listes de surveillance, des enquêtes financières et des programmes de réhabilitation des combattants, en étroite coopération avec le renseignement américain."
 SAU_the_atlantic_realignment: "Le réalignement atlantique"
 SAU_the_atlantic_realignment_desc: "Le Conseil cherchera reconnaissance et soutien à Washington en soulignant que les exportations pétrolières saoudiennes continueront sous le nouveau gouvernement. Cela testera si les États-Unis tiennent plus à leur relation avec l'État saoudien qu'à la monarchie déposée."
 SAU_foreign_water_operators: "Opérateurs étrangers de l'eau"
 SAU_foreign_water_operators_desc: "Le programme de dessalement est mis en appel d'offres international. Les usines s'élèvent plus vite que tout ce que le Royaume a jamais construit seul, et ceux qui les font tourner répondent à un siège à l'étranger.\n\n§GAccorde Opérateurs hydriques étrangers§! et §Yatténue la crise de l'eau d'un cran§!, au prix de l'§Rinfluence américaine dans le Royaume§!.\n\nEfficace, et une main permanente sur le robinet."
 SAU_among_the_major_powers: "Parmi les grandes puissances"
 SAU_among_the_major_powers_desc: "Le pétrole rend le Royaume indispensable, mais l'indispensabilité n'est pas la sécurité. S'étendre au-delà de la région vers les puissances qui façonnent l'ordre mondial et décider sur laquelle Riyad s'appuiera."
 SAU_anti_iranian_propaganda: "Propagande anti-iranienne"
 SAU_anti_iranian_propaganda_desc: "Le Royaume usera de ses réseaux médiatiques pour critiquer la République islamique et bâtir un soutien sunnite contre l'influence iranienne."
 SAU_appoint_loyalists_in_the_provinces: "Nommer des loyalistes dans les provinces"
 SAU_appoint_loyalists_in_the_provinces_desc: "Le nouveau gouvernement remplacera les gouverneurs provinciaux royaux par des officiers en service loyaux. Cela ôte une source importante de pouvoir princier et place les provinces sous contrôle militaire."
 SAU_unity_freedom_socialism: "Unité, Liberté, Socialisme"
 SAU_unity_freedom_socialism_desc: "Les trois mots du Baas deviennent la loi du pays : l'unité de la nation arabe, la libération du colonisateur, et le socialisme pour le peuple."
 SAU_cells_across_the_arab_world: "Des cellules à travers le monde arabe"
 SAU_cells_across_the_arab_world_desc: "Le parti établira des cellules baasistes dans les capitales arabes pour organiser et soutenir les révolutions à venir."
 SAU_the_sword_of_unity: "L'épée de l'unité"
 SAU_the_sword_of_unity_desc: "Les États arabes qui rejettent l'union volontaire seront ramenés dans le nouvel ordre par la force."
 SAU_purge_the_reactionaries: "Purger les réactionnaires"
 SAU_purge_the_reactionaries_desc: "Le gouvernement révolutionnaire écartera monarchistes, islamistes et agents étrangers qui menacent le règne baasiste."
 SAU_the_united_arab_republic: "La République arabe unie"
 SAU_the_united_arab_republic_desc: "Les terres arabes seront unies en un seul État révolutionnaire appelé la République arabe unie."
 SAU_one_arab_nation: "Une nation arabe"
 SAU_one_arab_nation_desc: "Effacer les frontières tracées par Sykes et Picot et enseigner à une génération qu'il n'est qu'une nation arabe porteuse d'un message éternel."
 SAU_the_vanguard_of_the_arabs: "L'avant-garde des Arabes"
 SAU_the_vanguard_of_the_arabs_desc: "L'Arabie revendiquera le leadership du monde arabe de l'Atlantique au Golfe et dirigera le mouvement nationaliste plus large."
 SAU_expel_the_imperialists: "Expulser les impérialistes"
 SAU_expel_the_imperialists_desc: "Chasser les dernières bases et conseillers étrangers du sol arabe et déchirer les traités inégaux de l'âge colonial."
 SAU_industrialize_the_nation: "Industrialiser la nation"
 SAU_industrialize_the_nation_desc: "Un plan industriel national construira aciéries, barrages et usines afin que la république produise elle-même ses biens essentiels et ses armes."
 SAU_the_revolutionary_command_council: "Le Conseil de commandement de la révolution"
 SAU_the_revolutionary_command_council_desc: "Confier l'autorité suprême à un conseil des dirigeants du parti, fusionnant parti et État en une seule volonté révolutionnaire."
 SAU_pan_arab_solidarity: "Solidarité panarabe"
 SAU_pan_arab_solidarity_desc: "Se tenir aux côtés de chaque lutte arabe, de la Palestine au Maghreb, et faire de l'Arabie la patronne de la cause nationaliste."
 SAU_build_the_party: "Bâtir le parti"
 SAU_build_the_party_desc: "La révolution organisera un parti discipliné dont les cellules s'étendront des villages à la direction nationale."
 SAU_arab_republic_secular_republic: "Une République laïque"
 SAU_arab_republic_secular_republic_desc: "Séparer la mosquée de l'État et lier la nation par l'identité arabe plutôt que par la confession, afin que sunnites et chiites, musulmans et chrétiens, ne fassent qu'un."
 SAU_the_arab_socialist_path: "La voie du socialisme arabe"
 SAU_the_arab_socialist_path_desc: "Rejeter à la fois le capitalisme et le communisme soviétique pour un socialisme distinctement arabe : les hauteurs de commande aux mains du peuple, le petit commerçant laissé libre."
 SAU_nationalize_the_heights: "Nationaliser les hauteurs"
 SAU_nationalize_the_heights_desc: "Saisir le pétrole, les banques et les grandes entreprises aux concessionnaires étrangers et aux vieilles familles, et tourner leur richesse vers la nation."
 SAU_land_to_the_peasants: "La terre aux paysans"
 SAU_land_to_the_peasants_desc: "Briser les grands domaines et donner le sol aux fellahs qui le travaillent, mettant fin à l'emprise féodale sur la campagne."
 SAU_the_officer_corps: "Le corps des officiers"
 SAU_the_officer_corps_desc: "Le parti recrutera de jeunes officiers et usera des forces armées pour enseigner et imposer la doctrine baasiste."
 SAU_arm_the_vanguard: "Armer l'avant-garde"
 SAU_arm_the_vanguard_desc: "Une milice du parti politiquement fiable sera établie aux côtés de l'armée régulière."
 SAU_forge_the_national_army: "Forger l'armée nationale"
 SAU_forge_the_national_army_desc: "Bâtir une armée mécanisée moderne digne de la nation arabe et capable de porter la révolution au-delà de nos frontières."
 SAU_saudi_aramco: "Aramco saoudienne"
 SAU_saudi_aramco_desc: "La §YSaudi Arabian Oil Company§! est la plus grande entreprise pétrolière de la Terre et l'épine dorsale du Royaume. Cette branche bâtit le secteur pétrolier champ par champ, puis engage Aramco dans une §Ydoctrine stratégique§! - §Ypomper davantage, raffiner davantage, ou exporter pour un revenu maximal§! - le tout alimentant le seul esprit national §YSaudi Aramco§!."
 SAU_arm_the_anti_iranian_groups: "Armer les groupes anti-iraniens"
 SAU_arm_the_anti_iranian_groups_desc: "Le Royaume armera des groupes antigouvernementaux parmi les minorités baloutches et arabes d'Iran, étendant le conflit sur le territoire iranien."
 SAU_the_saudi_armed_forces: "Les Forces armées saoudiennes"
 SAU_the_saudi_armed_forces_desc: "Unifier et moderniser les forces terrestres, navales et aériennes du Royaume en une seule armée professionnelle."
 SAU_lessons_of_the_gulf_war: "Leçons de la guerre du Golfe"
 SAU_lessons_of_the_gulf_war_desc: "En 1990, l'Irak de Saddam s'empara du Koweït et se massait à notre frontière ; seule une coalition étrangère sauva le Royaume, et la bataille de Khafji se livra sur le sol saoudien. L'opération Tempête du désert révéla notre dépendance aux autres - plus jamais."
 SAU_ministry_of_defence_and_aviation: "Ministère de la Défense et de l'Aviation"
 SAU_ministry_of_defence_and_aviation_desc: "Réorganiser le ministère de la Défense et de l'Aviation (MODA) en un commandement moderne capable de planifier, budgéter et diriger toutes les forces armées."
 SAU_the_general_staff: "L'état-major général"
 SAU_the_general_staff_desc: "Bâtir un état-major général professionnel pour rédiger les plans de guerre, conduire les exercices et commander les opérations."
 SAU_the_royal_saudi_land_forces: "Les Forces terrestres royales saoudiennes"
 SAU_the_royal_saudi_land_forces_desc: "Faire des Forces terrestres royales saoudiennes (RSLF) une armée moderne et mobile, dont le quartier général est à Riyad."
 SAU_saudi_arabian_national_guard: "Garde nationale saoudienne"
 SAU_saudi_arabian_national_guard_desc: "Étendre la Garde nationale saoudienne (SANG), force tribale loyale au trône qui garde la famille royale et les villes saintes."
 SAU_king_abdulaziz_royal_guard: "Garde royale du roi Abdulaziz"
 SAU_king_abdulaziz_royal_guard_desc: "Renforcer le régiment de la Garde royale, unité d'élite jurée de protéger la personne du roi."
 SAU_m1a2_abrams_main_battle_tank: "Char de combat principal M1A2 Abrams"
 SAU_m1a2_abrams_main_battle_tank_desc: "Acquérir l'américain M1A2 Abrams, le char le plus lourd et le plus capable de la région, épine dorsale de l'arme blindée saoudienne."
 SAU_armored_brigades: "Brigades blindées"
 SAU_armored_brigades_desc: "Lever et équiper des brigades blindées lourdes pour la manœuvre décisive dans le désert ouvert."
 SAU_mechanized_infantry: "Infanterie mécanisée"
 SAU_mechanized_infantry_desc: "Former une infanterie mécanisée pour tenir le terrain et appuyer les fers de lance blindés."
 SAU_m109_self_propelled_artillery: "Artillerie automotrice M109"
 SAU_m109_self_propelled_artillery_desc: "Mettre en ligne l'obusier automoteur M109 pour donner aux divisions un appui-feu mobile et protégé."
 SAU_astros_ii_rocket_artillery: "Artillerie de fusée ASTROS II"
 SAU_astros_ii_rocket_artillery_desc: "Acquérir le lance-roquettes multiple brésilien ASTROS II pour le bombardement massif à longue portée."
 SAU_royal_saudi_strategic_missile_force: "Force de missiles stratégiques royale saoudienne"
 SAU_royal_saudi_strategic_missile_force_desc: "Établir la Force de missiles stratégiques comme branche distincte, dissuasion stratégique du Royaume."
 SAU_df_3_ballistic_missiles: "Missiles balistiques DF-3"
 SAU_df_3_ballistic_missiles_desc: "L'achat secret de 1988 de missiles chinois DF-3 donna à Riyad une portée stratégique qu'aucune capitale voisine ne pouvait ignorer. Bâtir la force qui maintient cette dissuasion crédible."
 SAU_army_aviation_and_apache_gunships: "Aviation de l'armée et canonnières Apache"
 SAU_army_aviation_and_apache_gunships_desc: "Lever un commandement d'aviation de l'armée et acquérir l'AH-64 Apache, tueur de chars pour l'arme aérienne de l'armée."
 SAU_special_forces_command: "Commandement des forces spéciales"
 SAU_special_forces_command_desc: "Forger un commandement des forces spéciales pour les raids, la contre-terrorisme et la reconnaissance derrière les lignes ennemies."
 SAU_roll_back_iran_in_the_gulf: "Refouler l'Iran dans le Golfe"
 SAU_roll_back_iran_in_the_gulf_desc: "L'Iran use de réseaux politiques et miliciens pour étendre son influence à Bahreïn, en Irak et ailleurs le long du Golfe. Le Royaume soutiendra les gouvernements et factions locaux capables de réduire cette influence."
 SAU_the_basra_grid_connection: "Le raccordement au réseau de Bassorah"
 SAU_the_basra_grid_connection_desc: "Le sud irakien étouffe sous les coupures tout en important l'électricité iranienne. Brancher Bassorah au réseau du Golfe et remplacer le courant iranien par le courant saoudien."
 SAU_counter_iranian_influence: "Contrer l’influence iranienne"
 SAU_counter_iranian_influence_desc: "Les milices et l'argent de l'Iran ont envahi le vide laissé par Saddam. Entamer la longue campagne pour arracher l'Irak à l'emprise de la République islamique."
 SAU_buy_the_iraqi_parliament: "Acheter le parlement irakien"
 SAU_buy_the_iraqi_parliament_desc: "Le Royaume usera du patronage financier pour s'assurer le soutien de blocs parlementaires et de ministres irakiens. Le but est de détourner Bagdad de Téhéran vers Riyad."
 SAU_chinese_mediation: "Médiation chinoise"
 SAU_chinese_mediation_desc: "La Chine est un client majeur de l'Arabie saoudite comme de l'Iran et a proposé de médier entre eux. Accepter son rôle pourrait stabiliser les relations sans résoudre la rivalité stratégique plus large."
 SAU_the_agrarian_revolution: "La révolution agraire"
 SAU_the_agrarian_revolution_desc: "La transformation de la campagne est achevée, son surplus nourrissant les villes et la révolution."
 SAU_collectivization: "Collectivisation"
 SAU_collectivization_desc: "Les fermes privées sont fusionnées en vastes collectives travaillées en commun et répondant au plan."
 SAU_dictatorship_of_the_proletariat: "Dictature du prolétariat"
 SAU_dictatorship_of_the_proletariat_desc: "Le pouvoir se concentre dans la classe ouvrière par un parti révolutionnaire unique qui n'admet aucune opposition."
 SAU_ignite_the_gulf: "Enflammer le Golfe"
 SAU_ignite_the_gulf_desc: "L'État ouvrier fournira agents et armes aux mouvements révolutionnaires des monarchies du Golfe."
 SAU_land_to_the_fellahin: "La terre aux fellahs"
 SAU_land_to_the_fellahin_desc: "Les grands domaines sont brisés et remis aux paysans qui les labourent."
 SAU_embrace_moscow: "Embrassez Moscou"
 SAU_embrace_moscow_desc: "L'Arabie s'alignera sur le bloc soviétique et échangera le pétrole contre des armes et un soutien politique."
 SAU_nationalize_the_oil_fields: "Nationaliser les champs pétroliers"
 SAU_nationalize_the_oil_fields_desc: "La richesse sous les sables appartient au peuple, non aux princes. ARAMCO est saisie et placée sous contrôle ouvrier."
 SAU_the_new_arab_man: "L'homme arabe nouveau"
 SAU_the_new_arab_man_desc: "Une nouvelle culture révolutionnaire est cultivée, balayant les superstitions et hiérarchies de l'ancien ordre."
 SAU_the_non_aligned_road: "La voie non alignée"
 SAU_the_non_aligned_road_desc: "L'Arabie trace une route indépendante, menant les nations non alignées contre l'impérialisme autant que contre la domination soviétique."
 SAU_soviets_of_the_oil_workers: "Soviets des ouvriers du pétrole"
 SAU_soviets_of_the_oil_workers_desc: "Des conseils ouvriers élus gouverneront les champs pétroliers et formeront une institution centrale de l'État prolétarien."
 SAU_toward_pan_arab_union: "Vers une union panarabe"
 SAU_toward_pan_arab_union_desc: "La révolution s'étend au-dehors, cherchant l'union avec les autres États arabes progressistes."
 SAU_the_peoples_republic_of_arabia: "La République populaire d'Arabie"
 SAU_the_peoples_republic_of_arabia_desc: "L'ordre provisoire cède la place à un État ouvrier pleinement constitué : la République populaire d'Arabie."
 SAU_progressive_islam: "Islam progressiste"
 SAU_progressive_islam_desc: "Plutôt que d'écraser la foi, le parti enrôle des clercs progressistes pour prêcher un socialisme compatible avec l'islam."
 SAU_a_proletarian_nation: "Une nation prolétarienne"
 SAU_a_proletarian_nation_desc: "L'Arabie définira l'identité nationale par les ouvriers et le travail plutôt que par l'affiliation tribale ou la loyauté à la monarchie."
 SAU_form_the_red_guard: "Former la Garde rouge"
 SAU_regularize_the_red_guard: "Régulariser la Garde rouge"
 SAU_regularize_the_red_guard_desc: "Forger les milices révolutionnaires en une Armée rouge professionnelle, avec un équipement standardisé, des officiers formés et une industrie de guerre pour les armer."
 SAU_the_peoples_militia: "La milice du peuple"
 SAU_the_peoples_militia_desc: "Garder la révolution aux mains du peuple, armant chaque ouvrier et chaque paysan comme milicien prêt à défendre la république."
 SAU_form_the_red_guard_desc: "Une milice révolutionnaire tirée des ouvriers du pétrole et des pauvres urbains, jurée de défendre la révolution."
 SAU_rural_literacy_brigades: "Brigades d'alphabétisation rurale"
 SAU_rural_literacy_brigades_desc: "Des cadres se répandent à travers la campagne pour enseigner lecture, écriture et doctrine révolutionnaire."
 SAU_state_atheism: "Athéisme d'État"
 SAU_state_atheism_desc: "La religion est déclarée opium du peuple. Le clergé est dépouillé de son pouvoir et les mosquées se taisent."
 SAU_state_industrialization: "Industrialisation de l’État"
 SAU_state_industrialization_desc: "Le gouvernement usera de programmes d'État accélérés pour bâtir aciéries, barrages et usines à travers l'Arabie."
 SAU_vanguard_of_the_region: "Avant-garde de la région"
 SAU_vanguard_of_the_region_desc: "L'Arabie se pose en avant-garde de la révolution à travers le monde arabe et le Golfe."
 SAU_womens_emancipation: "L'émancipation des femmes"
 SAU_womens_emancipation_desc: "Les femmes entreront dans la main-d'œuvre et le parti comme égales juridiques et politiques, mettant fin aux restrictions de l'ancien ordre sur leur participation."
 SAU_a_strategic_partnership_with_china: "Un partenariat stratégique avec la Chine"
 SAU_a_strategic_partnership_with_china_desc: "Choisir Pékin plutôt que Washington comme principal partenaire parmi les grandes puissances du Royaume. Capitaux et armes chinois viennent sans sermons, mais aussi sans la vieille garantie américaine."
 SAU_conscript_the_kingdom: "Conscrire le Royaume"
 SAU_conscript_the_kingdom_desc: "Le Royaume s'est traditionnellement reposé sur des volontaires de tribus de confiance plutôt que sur la conscription. Le Conseil acceptera les risques politiques d'une armée de masse afin d'augmenter la main-d'œuvre disponible."
 SAU_oil_for_security: "Pétrole contre sécurité"
 SAU_oil_for_security_desc: "Le marché est aussi vieux que la rencontre à bord de l'USS Quincy : le brut saoudien fait tourner l'économie américaine, et les armes américaines gardent le Royaume. Approfondir le partenariat pétrodollar qui sous-tend le royaume."
 SAU_cooperation_with_the_east: "Coopération avec l'Est"
 SAU_cooperation_with_the_east_desc: "Le centre de gravité de l'économie mondiale dérive vers l'Asie, et l'Asie a soif de pétrole. Ouvrir le Royaume aux puissances montantes de l'Est et se couvrir contre un Occident peu fiable."
 SAU_cooperation_with_the_west: "Coopération avec l'Occident"
 SAU_cooperation_with_the_west_desc: "Washington et ses alliés garantissent la sécurité du Golfe depuis les jours du roi Abdulaziz. Ancrer fermement le Royaume dans le camp occidental et échanger le pétrole du monde contre la protection du monde."
 SAU_engage_the_new_baghdad: "S'engager auprès du nouveau Bagdad"
 SAU_engage_the_new_baghdad_desc: "Un nouveau gouvernement siège à Bagdad, dirigé par des chiites et courtisé par Téhéran. Avaler les vieilles inimitiés et ramener le nouvel Irak vers le giron arabe."
 SAU_counter_the_baathist_remnant: "Contrecarrer le reliquat baasiste"
 SAU_counter_the_baathist_remnant_desc: "Que Saddam soit tombé ou seulement chancelé, le Baas reste une force dans l'ombre irakienne. Refuser aux irréductibles de l'ancien régime tout chemin de retour au pouvoir."
 SAU_declare_the_republic_of_arabia: "Proclamer la République d'Arabie"
 SAU_declare_the_republic_of_arabia_desc: "La monarchie est tombée et le conseil provisoire détient le pouvoir au nom du peuple. Désormais l'ancien royaume est dissous pour de bon et un nouvel État est proclamé : la République d'Arabie, bâtie sur la volonté de ses citoyens plutôt que sur le sang d'une dynastie."
 SAU_the_defense_industries_act: "La loi sur les industries de défense"
 SAU_the_defense_industries_act_desc: "L'Arabie saoudite dépend depuis longtemps d'armes importées et de pièces étrangères. La loi sur les industries de défense exigera une production intérieure là où c'est possible et une production sous licence là où c'est nécessaire, malgré des coûts plus élevés et une moindre efficacité à court terme."
 SAU_disband_the_national_guard: "Dissoudre la Garde nationale"
 SAU_disband_the_national_guard_desc: "La Garde nationale fut créée à partir de tribus loyales pour protéger le trône contre l'armée régulière. Le Conseil dissoudra ses régiments et offrira à leur personnel des places dans les forces armées régulières, ôtant à la monarchie sa base militaire indépendante."
 SAU_the_economy_under_military_order: "L'économie sous l'ordre militaire"
 SAU_the_economy_under_military_order_desc: "Des officiers prendront le contrôle d'Aramco, de SABIC, des ports et des grands contractants. Les opérations pétrolières peuvent continuer sous leurs ingénieurs existants, mais l'administration militaire réduira probablement l'efficacité ailleurs dans l'économie."
 SAU_emergency_tribunal: "Tribunal d'urgence"
 SAU_emergency_tribunal_desc: "Des tribunaux convoqués sous autorité militaire, siégeant sans appel, jugent des infractions dont les cours ordinaires n'ont jamais reçu juridiction. Les oulémas sont consultés sur la forme de la procédure, non sur les verdicts."
 SAU_energy_subsidies_for_jordan: "Subventions énergétiques pour la Jordanie"
 SAU_energy_subsidies_for_jordan_desc: "La Jordanie n'a pas de pétrole et ressent chaque pic du marché. Lier le royaume à la générosité saoudienne par un carburant bon marché et un brut à tarif réduit."
 SAU_aid_sudan: "Aide au Soudan"
 SAU_aid_sudan_desc: "Khartoum a besoin d'un financement que Téhéran n'a pas fourni. L'aide saoudienne peut acheter une rupture avec l'Iran, mais elle lie aussi Riyad à un gouvernement déjà isolé par les sanctions occidentales."
 SAU_side_with_algeria: "Prendre parti pour l'Algérie"
 SAU_side_with_algeria_desc: "Riyad ne peut courtiser Alger et Rabat avec une égale chaleur tandis que leur rivalité divise le Maghreb. L'Algérie offre une expérience chèrement acquise contre les insurrections islamistes, mais la choisir signifie refroidir les relations avec une monarchie sœur au Maroc."
 SAU_back_the_brotherhood: "Soutenir les Frères"
 SAU_back_the_brotherhood_desc: "L'Égypte est à la fois le berceau des Frères et le centre du monde arabe. Soutenir le mouvement donnerait à Riyad un réseau islamiste populaire à l'étranger, mais risquerait des frictions avec les gouvernements qui craignent les Frères aux urnes."
 SAU_back_the_strongman: "Soutenir l'homme fort"
 SAU_back_the_strongman_desc: "Les généraux égyptiens promettent l'ordre, l'hostilité aux Frères et un État assez fort pour tenir le centre du monde arabe. L'argent saoudien peut maintenir cet ordre debout et aligner Le Caire sur Riyad."
 SAU_befriend_the_turks: "Se lier d'amitié avec les Turcs"
 SAU_befriend_the_turks_desc: "[befriend_the_turks_description]"
 SAU_contain_the_turks: "Contenir les Turcs"
 SAU_contain_the_turks_desc: "Nous ne pouvons laisser la Turquie poursuivre ses intérêts au Moyen-Orient. Le soutien de [TUR.GetLeader] à l'islam politique risque de renforcer un mouvement populiste dangereux, qui pourrait chercher à renverser notre gouvernement."
 SAU_influence_muslim_europe: "Influencer l’Europe musulmane"
 SAU_influence_muslim_europe_desc: "Les Balkans abritent des communautés musulmanes qui n'ont guère de raison de regarder vers Riyad. Bourses, mosquées et réseaux charitables peuvent transformer une foi partagée en une influence saoudienne durable en Europe."
 SAU_influence_north_africa: "Influencer l’Afrique du Nord"
 SAU_influence_north_africa_desc: "Le Maghreb regarde plus souvent vers l'Europe au nord et l'Afrique au sud que vers Riyad à l'est. L'argent et la diplomatie saoudiens peuvent changer cela, mais chaque geste entre dans la rivalité entre l'Algérie et le Maroc."
 SAU_side_with_morocco: "Prendre parti pour le Maroc"
 SAU_side_with_morocco_desc: "Le Maroc partage l'intérêt du Royaume à préserver le régime monarchique et à limiter l'influence algérienne. Prendre parti pour Rabat renforce un partenaire naturel, mais ferme des portes à Alger."
 SAU_sanction_sudan: "Sanctionner le Soudan"
 SAU_sanction_sudan_desc: "La direction de [SUD.GetLeader] a été minée par la controverse internationale. Sous son règne, le Soudan a été accusé d'être un État commanditaire du terrorisme autant qu'un grand violeur des droits de l'homme. Les nations occidentales ont ensuite sanctionné cet État voyou, un exemple que nous devrions suivre."
 SAU_sanction_turkey: "Sanctionner la Turquie"
 SAU_sanction_turkey_desc: "Malgré nos avertissements, la Turquie a continué de s'immiscer dans le monde arabe. Nous n'avons d'autre choix que d'user de mesures coercitives pour dissuader la Turquie de poursuivre ses ambitions impérialistes."
 SAU_security_guarantees: "Garanties de sécurité"
 SAU_security_guarantees_desc: "Des relations étroites avec Ankara ne valent guère si elles disparaissent dans une crise. Une garantie mutuelle lierait la sécurité turque et saoudienne et avertirait tout ennemi qu'attaquer l'un, c'est affronter les deux."
 SAU_turkish_bases: "Bases turques"
 SAU_turkish_bases_desc: "Accorder à la Turquie un accès militaire donnerait à Ankara une raison directe de protéger le Royaume. Cela donnerait aussi à une puissance régionale rivale un pied-à-terre sur le sol saoudien."
 SAU_libyan_arms_shipments: "Livraisons d’armes libyennes"
 SAU_libyan_arms_shipments_desc: "L'État libyen fracturé est devenu une enchère d'armes et d'argent étrangers. Les puissances occidentales se retirant, les livraisons saoudiennes peuvent acheter une faction amie et une place dans la lutte pour son pétrole et ses ports."
 SAU_the_faisalite_resurgence: "La résurgence faisalite"
 SAU_the_faisalite_resurgence_desc: "Le programme faisalite revient après une génération de négligence. Il appelle à l'austérité, à l'autosuffisance et à un Royaume qui représente l'Oumma au lieu de dépendre de Washington."
 SAU_centralization_of_the_provincial_emirates: "Centralisation des émirats provinciaux"
 SAU_centralization_of_the_provincial_emirates_desc: "Les émirs provinciaux ont géré leurs régions comme des domaines privés depuis la fondation. Riyad rappelle leurs chartes et en délivre de nouvelles - plus courtes, révocables, et signées par le roi."
 SAU_the_sovereign_civil_service: "La fonction publique souveraine"
 SAU_the_sovereign_civil_service_desc: "La fonction publique usera d'examens pour les nominations et de dossiers de service pour l'avancement. Cela réduira l'influence des liens familiaux sur l'emploi public."
 SAU_reorganization_of_the_majlis_ash_shura: "Réorganisation du Majlis ash-Shura"
 SAU_reorganization_of_the_majlis_ash_shura_desc: "Miteb élargira et réorganisera le Majlis ash-Shura et lui donnera accès aux affaires substantielles du gouvernement. Il restera subordonné au roi, mais gagnera un rôle consultatif et administratif plus clair."
 SAU_the_national_cadre_initiative: "L'initiative des cadres nationaux"
 SAU_the_national_cadre_initiative_desc: "Le Royaume formera des citoyens saoudiens pour remplacer les travailleurs étrangers dans les métiers stratégiquement importants. L'efficacité à court terme pourra décliner tandis que la main-d'œuvre nationale gagne de l'expérience."
 SAU_the_fortress_kingdom: "Le Royaume forteresse"
 SAU_the_fortress_kingdom_desc: "Le gouvernement faisalite a consolidé ses institutions, écarté ses opposants et réduit l'influence étrangère. Le Royaume doit maintenant décider si cette autonomie soutiendra l'isolement ou une politique indépendante plus active."
 SAU_the_spirit_of_73: "L'esprit de 73"
 SAU_the_spirit_of_73_desc: "L'embargo pétrolier de 1973 a montré que la politique de production saoudienne pouvait influencer les gouvernements occidentaux. Le Royaume envisagera d'user de ce levier pour obtenir de nouvelles concessions politiques."
 SAU_the_international_forums_question: "La question des forums internationaux"
 SAU_the_international_forums_question_desc: "Le Royaume doit décider s'il poursuivra ses intérêts par des institutions comme les Nations unies et le FMI ou s'il se retirera d'un système dont il n'a guère rédigé les règles."
 SAU_the_superpower_engagement_question: "La question de l'engagement des superpuissances"
 SAU_the_superpower_engagement_question_desc: "Les deux blocs superpuissances cherchent l'alignement saoudien. Riyad peut rester indépendant tout en achetant aux deux, ou réduire sa dépendance en développant une production d'armement intérieure."
 SAU_eradicate_foreign_dependency: "Éradiquer la dépendance étrangère"
 SAU_eradicate_foreign_dependency_desc: "Le Royaume traitera la dépendance aux importations essentielles comme une vulnérabilité stratégique. La substitution intérieure prendra donc le pas même lorsque les biens importés seraient moins chers."
 SAU_the_foreign_wealth_question: "La question de la fortune étrangère"
 SAU_the_foreign_wealth_question_desc: "L'Arabie saoudite détient des centaines de milliards de dollars dans les banques occidentales et les titres d'État. Rapetrier cette fortune réduirait le levier étranger, mais la laisser à l'étranger reste plus sûr et plus profitable."
 SAU_increase_the_ulemas_authority: "Accroître l'autorité des oulémas"
 SAU_increase_the_ulemas_authority_desc: "Les savants sont rétablis dans les conseils dont on les avait discrètement écartés. Fayçal gouverna avec les oulémas à son épaule, et ses héritiers ne feindront pas le contraire."
 SAU_the_domestic_supply_quota: "Le quota d'approvisionnement intérieur"
 SAU_the_domestic_supply_quota_desc: "Chaque ministère, contractant et raffinerie devra acheter une part minimale de biens fabriqués en Arabie saoudite. Les produits intérieurs pourront d'abord coûter plus cher et moins bien performer, mais les quotas bâtiront la capacité nationale."
 SAU_the_sovereign_aid_question: "La question de l'aide souveraine"
 SAU_the_sovereign_aid_question_desc: "L'aide saoudienne peut être distribuée comme soutien inconditionnel aux communautés musulmanes ou servir à obtenir des concessions politiques. Le Royaume doit décider si la solidarité religieuse ou l'influence stratégique gouvernera son assistance."
 SAU_islamic_solidarity_conference: "Conférence de solidarité islamique"
 SAU_islamic_solidarity_conference_desc: "Riyad convoquera une conférence de solidarité islamique et en financera les travaux. La réunion ravivera l'approche de Fayçal, qui usait d'institutions sponsorisées par l'Arabie saoudite pour coordonner le monde musulman."
 SAU_the_expatriate_workforce_question: "La question de la main-d'œuvre expatriée"
 SAU_the_expatriate_workforce_question_desc: "Neuf millions de travailleurs étrangers soutiennent l'économie saoudienne mais contredisent l'objectif faisalite d'autosuffisance nationale. Réduire leur rôle coûtera cher, les retenir limitera la saoudisation."
 SAU_reclaim_the_oic_leadership: "Reprendre le leadership de l'OCI"
 SAU_reclaim_the_oic_leadership_desc: "L'Organisation de la coopération islamique a son siège à Djeddah. Riyad usera de son financement et de sa position de pays hôte pour diriger plus activement l'agenda de l'organisation."
 SAU_the_global_ummah_question: "La question de l'Oumma mondiale"
 SAU_the_global_ummah_question_desc: "Le contrôle du Royaume sur les Deux Saintes Mosquées lui donne une revendication unique au leadership parmi les musulmans du monde. Il doit décider s'il transformera ce statut en une responsabilité active envers l'Oumma mondiale."
 SAU_splendid_isolation: "Splendide isolement"
 SAU_splendid_isolation_desc: "Le Royaume se retirera des blocs, des relations de clientèle et des campagnes étrangères. Il se concentrera sur la défense de ses frontières, la préservation de la foi et la gestion de ses ressources pétrolières."
 SAU_the_virtue_committees_return: "Le retour des comités de la vertu"
 SAU_the_virtue_committees_return_desc: "Le Comité pour la promotion de la vertu et la prévention du vice reprend les rues qu'il avait perdues. Ses patrouilles sont à nouveau visibles, et le message qu'elles portent aussi."
 SAU_the_third_way_doctrine: "La doctrine de la troisième voie"
 SAU_the_third_way_doctrine_desc: "Le Royaume rejettera l'alignement sur Washington comme sur Moscou et organisera un bloc indépendant d'États musulmans dirigé depuis Riyad. Ce bloc s'appuiera sur sa propre production d'armes et ne répondra qu'à l'Oumma."
 SAU_ban_foreign_media: "Interdire les médias étrangers"
 SAU_ban_foreign_media_desc: "Les paraboles descendent, les bureaux ferment, et les nouvelles du Royaume s'écrivent dans le Royaume. Ce que le monde dit de l'Arabie saoudite n'est plus une affaire intérieure."
 SAU_the_closed_frontier: "La frontière fermée"
 SAU_the_closed_frontier_desc: "Les visas se resserrent, les contrats expirent, et les quartiers d'expatriés commencent à se vider. Le Royaume décide qu'il préfère être plus pauvre et à soi."
 SAU_purge_the_westernized_elite: "Purger l'élite occidentalisée"
 SAU_purge_the_westernized_elite_desc: "Les ministères commencent à se remplir d'hommes formés à Riyad plutôt qu'à Boston. Ceux qui sont rentrés avec des diplômes étrangers et des habitudes étrangères voient leurs dossiers réexaminés et leurs bureaux réassignés."
 SAU_the_foreign_bases_question: "La question des bases étrangères"
 SAU_the_foreign_bases_question_desc: "L'accès militaire étranger offre au Royaume une protection extérieure, mais irrite les clercs qui voient dans les troupes étrangères en Arabie une insulte. Riyad doit décider si cette protection vaut le coût pour sa souveraineté et sa légitimité religieuse."
 SAU_sever_the_western_pact: "Rompre le pacte occidental"
 SAU_sever_the_western_pact_desc: "Le Royaume fermera les bases étrangères et exigera le départ de leurs garnisons. Cela rétablit le contrôle saoudien sur son territoire mais met fin à une importante garantie de sécurité extérieure."
 SAU_the_base_retention_edict: "L'édit de maintien des bases"
 SAU_the_base_retention_edict_desc: "Les bases étrangères et leurs arrangements d'approvisionnement demeureront. Le gouvernement défendra cette décision auprès des oulémas comme une nécessité de sécurité malgré leurs objections religieuses."
 SAU_fight_iran_indirectly: "Combattre l’Iran indirectement"
 SAU_fight_iran_indirectly_desc: "Une bataille ouverte avec la République islamique ruinerait les deux camps. À la place, saigner Téhéran par ses proxies et ses provinces agitées, sans jamais tout à fait franchir la ligne de la guerre ouverte."
 SAU_modon_industrial_cities: "Villes industrielles MODON"
 SAU_modon_industrial_cities_desc: "Yanbu, Ras al-Khair et Jubail ont de la place pour plus que des terminaux pétroliers. MODON les remplira d'usines de ciment, de fonderies d'aluminium et d'usines d'engrais, remplaçant les importations par des biens faits au pays."
 SAU_the_return_of_national_capital: "Le retour du capital national"
 SAU_the_return_of_national_capital_desc: "Les fortunes saoudiennes gisent dans l'immobilier, les banques et les titres étrangers tandis que les projets au pays attendent l'argent. Le ministère du Commerce donnera à ce capital une raison de rentrer et de travailler dans le Royaume."
 SAU_jeddah_islamic_port_expansion: "Expansion du port islamique de Djeddah"
 SAU_jeddah_islamic_port_expansion_desc: "Djeddah est la porte du Royaume sur la mer Rouge. De nouveaux terminaux rouliers et des liaisons ferroviaires feront entrer davantage de fret vers l'intérieur et tiendront le port en tête d'un commerce croissant."
 SAU_the_supreme_economic_council: "Le Conseil économique suprême"
 SAU_the_supreme_economic_council_desc: "Quatre ministères revendiquent une part de la politique économique, et aucun ne répond aux autres. Un Conseil économique suprême leur donne une table, un ordre du jour et une autorité pour régler les différends."
 SAU_sabics_global_expansion: "Expansion mondiale de SABIC"
 SAU_sabics_global_expansion_desc: "SABIC a dépassé le marché intérieur. Des acquisitions comme GE Plastics donneront à l'entreprise de nouveaux matériaux, brevets et clients bien au-delà du Golfe."
 SAU_the_jubail_ii_expansion: "L'extension Jubail II"
 SAU_the_jubail_ii_expansion_desc: "Jubail II croîtra autour de plus que la pétrochimie. Étendre le complexe sidérurgique Hadeed donnera à la construction saoudienne une source intérieure de fers à béton et d'acier plat."
 SAU_the_saudi_export_program: "Le programme d'exportation saoudien"
 SAU_the_saudi_export_program_desc: "Les usines saoudiennes ne peuvent croître sur le seul marché intérieur. Le programme d'exportation portera plastiques, carburants raffinés et ciment vers les marchés d'Asie, d'Afrique et d'Amérique latine qui n'ont connu le Royaume que pour le brut."
 SAU_sabic_agri_nutrients: "SABIC Agri-Nutrients"
 SAU_king_abdullah_financial_district: "Quartier financier du roi Abdallah"
 SAU_king_abdullah_financial_district_desc: "Le quartier financier Roi-Abdallah donnera aux banques, fonds d'investissement et partenaires multinationales une seule adresse à Riyad. Les accords signés dans ses tours peuvent faire entrer capitaux et expertise étrangers dans l'industrie saoudienne."
 SAU_sabic_agri_nutrients_desc: "SABIC transforme déjà le gaz saoudien en produits chimiques. Étendre la production d'ammoniac et d'urée fera du Royaume un grand fournisseur d'engrais et nourrira des fermes bien au-delà de l'Arabie."
 SAU_economic_diversification: "Diversification économique"
 SAU_economic_diversification_desc: "Le pétrole restera la plus grande affaire du Royaume, mais il n'a pas à être toute affaire. Le capital ira vers l'industrie, les services et la logistique afin qu'une chute des cours du brut n'atteigne plus chaque feuille de paie saoudienne."
 SAU_non_oil_exports: "Exportations non pétrolières"
 SAU_non_oil_exports_desc: "Un tanker ne devrait pas être la seule exportation saoudienne que quiconque reconnaisse. Plastiques, produits chimiques, ciment et machines peuvent gagner leur place au livre de commerce et rendre le revenu étranger moins dépendant du brut."
 SAU_economic_liberalization: "Libéralisation économique"
 SAU_economic_liberalization_desc: "Une firme privée ne devrait pas avoir besoin d'un prince, d'une subvention et d'un an de signatures pour ouvrir ses portes. Couper le labyrinthe des licences et laisser les entreprises se disputer les clients plutôt que les faveurs."
 SAU_sabic_technology_and_innovation: "Technologie et innovation SABIC"
 SAU_sabic_technology_and_innovation_desc: "Une matière première bon marché ne suffira pas à garder SABIC compétitive pour toujours. La recherche sur les catalyseurs, les polymères et les méthodes de production peut placer des brevets saoudiens à côté des usines saoudiennes."
 SAU_the_2000s_oil_boom: "Le boom pétrolier des années 2000"
 SAU_the_2000s_oil_boom_desc: "Le prix du pétrole grimpe, remplissant le Trésor et emportant le Tadawul avec lui. Le boom peut financer une nouvelle industrie, si le Royaume investit avant que le cycle ne tourne à nouveau."
 SAU_the_national_industrial_strategy: "La stratégie industrielle nationale"
 SAU_the_national_industrial_strategy_desc: "Une stratégie industrielle de dix ans liera ministères et entreprises à des cibles partagées pour l'acier, les machines, l'emploi saoudien et la croissance des exportations. Le progrès pourra enfin se mesurer à autre chose que la taille du budget."
 SAU_the_mining_sector: "Le secteur minier"
 SAU_the_mining_sector_desc: "Ma'aden, fondée en 1997, fait de l'extraction le §Ytroisième pilier§! de l'économie aux côtés du pétrole et de la pétrochimie - phosphate à Al-Jalamid, or à Mahd adh-Dhahab, bauxite et aluminium destinés à Ras al-Khair."
 SAU_the_tourism_sector: "Le secteur du tourisme"
 SAU_the_tourism_sector_desc: "La §YCommission suprême du tourisme§!, créée en 2000, transforme le patrimoine du royaume, sa côte de mer Rouge et - surtout - le §Ypèlerinage à La Mecque et Médine§! en une industrie permanente, toute l'année."
 SAU_the_construction_boom: "Le boom de la construction"
 SAU_the_construction_boom_desc: "L'investissement du boom pétrolier financera une vaste construction à Riyad, Djeddah et Dammam, y compris tours, centres commerciaux, routes et autres infrastructures urbaines."
 SAU_the_digital_economy: "L'économie numérique"
 SAU_the_digital_economy_desc: "La §YCommission des communications et de l'informatique§! (2001) met fin au monopole des télécoms et câble le royaume - réseaux mobiles, haut débit et premiers services d'e-gouvernement atteignent chaque province."
 SAU_the_eighth_development_plan: "Le huitième plan de développement"
 SAU_the_eighth_development_plan_desc: "Cinq années de dépenses exigent plus qu'une liste de ministères. Le huitième plan de développement coordonnera les projets économiques et sociaux du gouvernement jusqu'en 2009."
 SAU_the_industrial_path: "La voie industrielle"
 SAU_the_industrial_path_desc: "L'acier, la fonderie et la fabrication mettent les usines avant les bureaux. La voie industrielle crée une capacité industrielle au pays, mais exige davantage de capital, de main-d'œuvre et de machines importées."
 SAU_the_services_path: "La voie des services"
 SAU_the_services_path_desc: "Banque, logistique, finance et tourisme peuvent employer des diplômés saoudiens sans attendre de nouvelles aciéries. Une économie tirée par les services exige moins d'investissement dans l'industrie lourde et laisse davantage des besoins physiques du Royaume aux importations."
 SAU_the_balanced_path: "La voie équilibrée"
 SAU_the_balanced_path_desc: "Industrie et services avanceront ensemble, répartissant l'investissement. Le compromis évite la dépendance à un seul secteur. Aucun des deux n'obtient tout le capital qu'il veut."
 SAU_the_ninth_development_plan: "Le neuvième plan de développement"
 SAU_the_ninth_development_plan_desc: "L'économie saoudienne de 2015 ne ressemble en rien à celle de 1995. La seule industrie manufacturière dépasse ce que valaient les exportations pétrolières il y a dix ans."
 SAU_the_saudi_landbridge: "Le pont terrestre saoudien"
 SAU_the_saudi_landbridge_desc: "Le pont terrestre saoudien reliera le port islamique de Djeddah sur la mer Rouge à Riyad et Dammam sur le Golfe par le rail. Le fret traversera la péninsule sans contourner l'Arabie par mer."
 SAU_stc_privatization: "Privatisation de STC"
 SAU_stc_privatization_desc: "STC ne peut plus s'étendre au rythme d'un ministère. La privatisation mettra de nouveaux capitaux derrière la fibre et les réseaux mobiles, mais le contrôle public sur l'opérateur national s'affaiblira."
 SAU_the_saudi_electricity_company: "La Saudi Electricity Company"
 SAU_the_saudi_electricity_company_desc: "Usines et villes croissent plus vite que le réseau électrique. La Saudi Electricity Company liera de nouvelles turbines à gaz à une transmission d'une côte à l'autre et empêchera les coupures de plafonner le développement."
 SAU_urban_development: "Développement urbain"
 SAU_urban_development_desc: "Riyad, Djeddah et Dammam croissent plus vite que leurs routes, leurs réseaux et leur logement. L'urbanisme doit rattraper son retard avant que la congestion ne devienne le prochain goulot du Royaume."
 SAU_the_real_estate_development_fund: "Le Fonds de développement immobilier"
 SAU_the_real_estate_development_fund_desc: "Un logement dans les grandes villes échappe aux familles saoudiennes ordinaires. Le Fonds de développement immobilier financera de nouveaux quartiers et entamera la liste d'attente du logement."
 SAU_the_north_south_railway: "Le chemin de fer nord-sud"
 SAU_the_north_south_railway_desc: "Le chemin de fer nord-sud transportera phosphate et bauxite des mines du nord vers le Golfe tout en reliant des villes de l'intérieur longtemps dépendantes de la route. Le rail réduira le coût du fret à travers le Royaume."
 SAU_king_abdullah_economic_city: "Cité économique du roi Abdallah"
 SAU_king_abdullah_economic_city_desc: "Des villes planifiées à Rabigh, Médine et Jazan visent à échapper à la paperasse qui ralentit le reste de l'économie. Leurs règles allégées testeront si une ville nouvelle peut distancer la vieille bureaucratie."
 SAU_the_labour_law_of_2005: "La loi du travail de 2005"
 SAU_the_labour_law_of_2005_desc: "La main-d'œuvre expatriée a bâti le Royaume moderne, mais le système de parrainage lie les travailleurs aux employeurs et tient les Saoudiens hors des paies privées. La loi de 2005 assouplira des parties de la kafala tout en pressant les entreprises d'embaucher des citoyens."
 SAU_tatweer_education_reform: "Réforme éducative Tatweer"
 SAU_tatweer_education_reform_desc: "Le par cœur ne peut fournir les ingénieurs et managers dont la nouvelle économie a besoin. Tatweer révisera le programme, réduira les heures d'enseignement religieux et fera entrer l'anglais dans les classes dès la quatrième année."
 SAU_king_fahd_medical_city: "Cité Médicale Roi Fahd"
 SAU_king_fahd_medical_city_desc: "Les soins spécialisés sont concentrés dans quelques hôpitaux et quelques villes. La Cité médicale Roi-Fahd et de nouveaux établissements provinciaux mettront cette norme à portée des Saoudiens qui ne peuvent se rendre à Riyad pour se soigner."
 SAU_kaust: "KAUST"
 SAU_kaust_desc: "Une université gagne sa réputation par le travail fait à l'intérieur, non par le nom au-dessus de sa porte. Des budgets de recherche plus larges à KAUST, KFUPM et KAU donneront aux savants saoudiens laboratoires et subventions pour rivaliser à l'étranger."
 SAU_k_a_care_renewable_energy: "Énergies renouvelables K.A.CARE"
 SAU_k_a_care_renewable_energy_desc: "Le Royaume brûle un pétrole précieux pour faire de l'électricité malgré l'un des plus forts ensoleillements du monde. K.A.CARE testera un autre avenir à Sakaka et Dumat al-Jandal, associant le solaire au vent du nord."
 SAU_royal_decree_m_30_capital_market_law: "Décret royal M/30, loi sur le marché des capitaux"
 SAU_royal_decree_m_30_capital_market_law_desc: "Le décret royal M/30, émis par le roi Fahd le 31 juillet 2003, a promulgué la loi sur le marché des capitaux. Elle établit un cadre juridique moderne pour le Tadawul et la régulation du marché des capitaux saoudien."
 SAU_the_2007_legal_reforms: "Les réformes juridiques de 2007"
 SAU_the_2007_legal_reforms_desc: "Les réformes juridiques de 2007 du Royaume codifient la constitution formelle des sociétés et établissent des règles claires pour créer des entités juridiques reconnues. Les entreprises peuvent désormais opérer sous un cadre corporatif plus prévisible."
 SAU_the_qualified_foreign_investor_program: "Le programme d'investisseur étranger qualifié"
 SAU_the_qualified_foreign_investor_program_desc: "Le §Y15 juin 2015§!, l'§YAutorité du marché des capitaux§! ouvre le §YTadawul§! à l'investissement institutionnel étranger direct pour la première fois. Les fonds gérant au moins §Y5 milliards de dollars§! d'actifs peuvent acheter des actions saoudiennes sans intermédiaires locaux, ouvrant la voie à l'inclusion dans les §Ymarchés émergents MSCI§!."
 SAU_msci_emerging_markets_inclusion: "Inclusion du MSCI Marchés émergents"
 SAU_msci_emerging_markets_inclusion_desc: "En §Yjuin 2018§!, §YMSCI§! annonce le passage de l'Arabie saoudite du statut Standalone à celui de marchés émergents. La mise en œuvre commence en §Ymai 2019§! et s'achève avec la seconde phase en §Yaoût 2019§!. L'inclusion achevée donne au §YTadawul§! environ §G2,83 %§! de l'indice et devrait apporter §G14 à 16 milliards de dollars§! d'investissement passif."
 SAU_the_kafalah_sme_program: "Le programme Kafalah pour les PME"
 SAU_the_kafalah_sme_program_desc: "Le programme Kafalah fournira des prêts favorables, des procédures plus simples et de la formation pour aider les entrepreneurs saoudiens à fonder des petites et moyennes entreprises."
 SAU_the_aramco_ipo: "L'IPO d'Aramco"
 SAU_the_aramco_ipo_desc: "Le §Y11 décembre 2019§!, §YSaudi Aramco§! s'introduit au §YTadawul§!, levant §G25,6 milliards de dollars§! d'abord et §G29,4 milliards de dollars§! après l'option greenshoe. C'est la §Gplus grande IPO de l'histoire§!, dépassant l'introduction d'§YAlibaba en 2014§!, et elle reste cotée à §YRiyad§! plutôt qu'à §YNew York§! ou §YLondres§!."
 SAU_the_saudi_financial_and_banking_laws: "Les lois financières et bancaires saoudiennes"
 SAU_the_saudi_financial_and_banking_laws_desc: "La loi de contrôle bancaire de 1966 et les lois sur le marché des capitaux et l'assurance coopérative de 2003 fournissent le cadre juridique principal de la finance saoudienne. Ensemble elles établissent des obligations et des peines claires pour les banques, les assureurs et les acteurs du marché."
 SAU_the_capital_market_authority: "L'Autorité du marché des capitaux"
 SAU_the_capital_market_authority_desc: "Une bourse ne peut se policer elle-même tandis que les fortunes des foyers saoudiens pendent à ses cours. L'Autorité du marché des capitaux fixera les règles de cotation, enquêtera sur les abus et fera répondre le Tadawul à un régulateur."
 SAU_edaa_the_securities_depository: "Edaa : le dépositaire de titres"
 SAU_edaa_the_securities_depository_desc: "§YEdaa§!, le Centre de dépôt de titres, réglera les transactions du Tadawul et tiendra les registres électroniques de propriété. Cette infrastructure moderne améliorera la fiabilité du marché pour les investisseurs intérieurs et étrangers."
 SAU_the_saudi_logistics_hub: "Le hub logistique saoudien"
 SAU_the_saudi_logistics_hub_desc: "Le Royaume usera de Djeddah, Dammam et Riyad pour développer un hub logistique reliant les routes commerciales à travers l'Asie, l'Afrique et l'Europe."
 SAU_establish_joint_stock_conglomerates_jsc: "Créer des conglomérats par actions (JSC)"
 SAU_establish_joint_stock_conglomerates_jsc_desc: "Convertir les grandes entités d'État en sociétés anonymes permettra aux citoyens et aux investisseurs institutionnels de fournir du capital à l'expansion industrielle. Cela réduit la dépendance des nouveaux projets au financement direct du Trésor."
 SAU_the_saudi_sukuk_programme: "Le programme saoudien de sukuk"
 SAU_the_saudi_sukuk_programme_desc: "À partir de §Y2017§!, le §Yministère des Finances§! lance un programme souverain soutenu de sukuk - §G9 milliards de dollars§! pour la seule émission internationale inaugurale. Les obligations conformes à la charia deviennent un véhicule premier du financement public saoudien et de la levée de capitaux des entreprises. Le Royaume et la §YMalaisie§! se partagent le marché mondial de l'obligation islamique."
 SAU_limited_liability_company_llc: "Société à responsabilité limitée (SARL)"
 SAU_limited_liability_company_llc_desc: "La loi sur les sociétés de 2015, en vigueur en 2016, établit une structure juridique moderne pour les sociétés à responsabilité limitée aux côtés des sociétés anonymes. Un capital protégé et un statut juridique reconnu aideront les firmes intérieures à bâtir des chaînes d'approvisionnement et à entrer en partenariat avec des entreprises internationales."
 SAU_the_gulfs_economic_engine: "Le moteur économique du Golfe"
 SAU_the_gulfs_economic_engine_desc: "L'économie plus forte du Royaume attirera travailleurs régionaux, professionnels de la finance et capitaux vers Riyad au lieu de les perdre aux marchés voisins."
 SAU_one_stop_shop: "Guichet unique"
 SAU_one_stop_shop_desc: "Les entreprises étrangères passaient autrefois des §Yannées§! à traiter avec plusieurs ministères pour s'enregistrer. Le §Yguichet unique§! de SAGIA combine ces étapes de licence à un §Gseul comptoir§!, réduisant les délais et les occasions de §Ycorruption§!."
 SAU_open_strategic_sectors: "Ouvrir les secteurs stratégiques"
 SAU_open_strategic_sectors_desc: "Les §Ytélécommunications§!, l'§Yassurance§! et les §Ymines§! s'ouvriront au capital étranger. De nouveaux concurrents apporteront §Ytechnologie§! et §Yexpertise§! tout en forçant les firmes soutenues par l'État à se moderniser."
 SAU_foreign_investment_law_of_2000: "Loi sur l'investissement étranger de 2000"
 SAU_foreign_investment_law_of_2000_desc: "La loi sur l'investissement étranger d'§Yavril 2000§! permet aux ressortissants étrangers de détenir §G100 %§! des sociétés saoudiennes dans la plupart des secteurs. Lever les restrictions de propriété antérieures vise à attirer substantiellement plus de capital international."
 SAU_economic_cities_drive: "Offensive des villes économiques"
 SAU_economic_cities_drive_desc: "Six nouvelles villes économiques sont prévues, dont la §YKing Abdallah Economic City§! sur la mer Rouge, la §YKnowledge Economic City§! à Médine et la §YPrince Abdulaziz bin Mousaed City§! à Hail. Chacune sera un §Ycentre conçu à dessein§! pour l'industrie, les services et le commerce hors des principales zones pétrolières."
 SAU_international_partnerships: "Partenariats internationaux"
 SAU_international_partnerships_desc: "Des coentreprises avec §YGeneral Electric§!, §YDow Chemical§!, §YSumitomo§! et §YMitsubishi§! apporteront §Ytechnologie§! et §Yexpertise managériale§! dans le Royaume. Les ingénieurs saoudiens travailleront avec ces partenaires et développeront les compétences nécessaires à gérer les projets futurs au pays."
 SAU_tax_incentive_package: "Programme d'incitations fiscales"
 SAU_tax_incentive_package_desc: "Le taux d'impôt sur les sociétés pour les investisseurs étrangers tombera de §Y45 %§! à §G20 %§!, tandis que le revenu personnel reste §Gnon imposé§!. SAGIA promuvra ces termes à l'étranger pour attirer le capital étranger."
 SAU_saudi_arabia_open_for_business: "Arabie saoudite, ouverte aux affaires"
 SAU_saudi_arabia_open_for_business_desc: "Les licences passent désormais par un seul bureau au lieu de plusieurs, les firmes étrangères peuvent posséder ce qu'elles bâtissent, et de nouvelles villes économiques se disputent leur capital. L'Arabie saoudite ne demande plus aux investisseurs de fermer les yeux sur la bureaucratie ; elle est ouverte aux affaires."
 SAU_ras_tanura_and_abqaiq: "Ras Tanura et Abqaïq"
 SAU_complete_nationalization: "Nationalisation complète"
 SAU_complete_nationalization_desc: "Entre §Y1973 et 1980§!, le Royaume rachète les partenaires américains de l'Arabian American Oil Company. ARAMCO devient entièrement saoudienne - §YSaudi Aramco§!."
 SAU_the_master_gas_system: "Le Master Gas System"
 SAU_the_master_gas_system_desc: "Lancé en §Y1975§!, le Master Gas System capte le gaz autrefois §Ybrûlé à la torche§! aux têtes de puits, alimentant en énergie et matières premières bon marché les nouvelles industries du Royaume."
 SAU_saudi_petroleum_engineers: "Ingénieurs pétroliers saoudiens"
 SAU_saudi_petroleum_engineers_desc: "§YKFUPM§! à Dhahran forme une génération d'ingénieurs pétroliers et de géologues saoudiens. La main-d'œuvre d'Aramco devient la plus §Ysaoudisée§! du Royaume."
 SAU_the_ghawar_field: "Le champ de Ghawar"
 SAU_the_ghawar_field_desc: "§YGhawar§! - le plus grand champ pétrolier conventionnel jamais découvert, s'étendant sur 280 km sous la province orientale. Pendant des décennies, il produit à lui seul plus de la moitié du brut du Royaume."
 SAU_ras_tanura_and_abqaiq_desc: "§YRas Tanura§!, le plus grand port pétrolier du monde, et le complexe de stabilisation d'§YAbqaiq§! rassemblent, traitent et exportent une grande part de la production de brut d'Aramco. Étendre et protéger ces installations est essentiel au secteur pétrolier du Royaume."
 SAU_downstream_integration: "Intégration en aval"
 SAU_downstream_integration_desc: "Cesser de vendre le brut brut. Raffineries et complexes pétrochimiques à §YJubail, Yanbu et Rabigh§! transforment chaque baril en carburants et plastiques à plus haute valeur §Yau pays§! - et alimentent SABIC."
 SAU_petrorabigh_and_satorp: "PetroRabigh & SATORP"
 SAU_petrorabigh_and_satorp_desc: "§YPetroRabigh§! (avec le japonais Sumitomo, 2005) et §YSATORP§! à Jubail (avec le français Total) sont des coentreprises de classe mondiale qui craquent le brut saoudien en carburants et produits chimiques. Le Royaume cesse d'exporter des barils bruts et commence à exporter des §Yproduits§!."
 SAU_doctrine_maximize_production: "Doctrine : maximiser la production"
 SAU_doctrine_maximize_production_desc: "Porter la capacité soutenable d'Aramco vers §Y12 millions de barils par jour§!. Ouvrir de nouveaux champs dans la province orientale et le Quart vide.\n\n§GFait apparaître du pétrole§! à travers le Royaume et booste le carburant - le fondement d'une §Yéconomie de guerre§!.\n§YMutuellement exclusive avec les deux autres doctrines.§!"
 SAU_doctrine_export_powerhouse: "Doctrine : puissance exportatrice"
 SAU_doctrine_export_powerhouse_desc: "Le brut circule vers l'est et l'ouest par superpétrolier. En tant que §Yproducteur d'appoint§! de l'OPEP, le Royaume transforme son pétrole en le flux de recettes §Ypétrodollars§! le plus fiable du monde.\n\n§GRevenus d'exportation de ressources§! et trésorerie récurrente - le fondement d'une §Yéconomie monétaire§!.\n§YMutuellement exclusive avec les deux autres doctrines.§!"
 SAU_new_mega_fields: "Nouveaux méga-champs"
 SAU_new_mega_fields_desc: "§YShaybah§! (1998) au fond du Quart vide, §YKhurais§! (2009) et §YManifa§! offshore (2013) - une nouvelle génération de champs géants pousse toujours plus haut la capacité d'Aramco. §GPlus de pétrole s'écoule.§!"
 SAU_opec_swing_producer: "Producteur de swing de l'OPEP"
 SAU_opec_swing_producer_desc: "La capacité de production de réserve du Royaume lui permet d'agir comme §Yproducteur d'appoint§! de l'OPEP et d'influencer les prix mondiaux du pétrole. Cela débloque les décisions du §Ylevier pétrolier de l'OPEP§! pour hausser les prix au profit des recettes ou les baisser pour presser les concurrents."
 SAU_the_council_of_economic_and_development_affairs: "Le Conseil des affaires économiques et du développement"
 SAU_the_council_of_economic_and_development_affairs_desc: "Créé en 2015, le §YConseil des affaires économiques et du développement§! coordonne les ministères et supervise la mise en œuvre du programme de réforme économique du gouvernement."
 SAU_the_worlds_most_valuable_company: "L'entreprise la plus précieuse du monde"
 SAU_the_worlds_most_valuable_company_desc: "Saudi Aramco est devenue la §Ysociété la plus valorisée de la Terre§! et demeure au cœur du secteur pétrolier et des finances publiques du Royaume.\n§YRequiert un PIB national supérieur à 1 800 milliards de $.§!"
 SAU_the_national_transformation_program: "Le programme de transformation nationale"
 SAU_the_national_transformation_program_desc: "Vision 2030 a besoin d'échéances qui survivent à la cérémonie d'annonce. Le §Yprogramme de transformation nationale§! donnera à chaque ministère une cible, un budget et une mesure publique de ce qu'il a livré."
 SAU_nazaha_the_anti_corruption_authority: "Nazaha : l'autorité anticorruption"
 SAU_nazaha_the_anti_corruption_authority_desc: "§YNazaha§!, la Commission nationale anticorruption, est établie en 2011 pour enquêter sur la corruption financière et administrative dans les organismes publics. Son mandat renforce le contrôle des agences et des fonctionnaires."
 SAU_the_judicial_reform_of_2007: "La réforme judiciaire de 2007"
 SAU_the_judicial_reform_of_2007_desc: "La §Yréforme judiciaire de 2007§! du roi Abdallah codifiera les procédures des cours, créera une Cour suprême et des tribunaux spécialisés, et donnera aux entreprises un système juridique plus prévisible."
 SAU_tayseer_regulatory_reform: "Tayseer : réforme réglementaire"
 SAU_tayseer_regulatory_reform_desc: "Le Centre national de compétitivité (§YTayseer§!) réduira les licences, agréments et autres exigences administratives qui retardent l'investissement."
 SAU_the_ministry_of_investment_misa: "Le ministère de l'Investissement (MISA)"
 SAU_the_ministry_of_investment_misa_desc: "SAGIA deviendra le §Yministère de l'Investissement§! en 2020, centralisant les services publics et la politique à l'égard des investisseurs étrangers."
 SAU_expec_research_centre: "Centre de recherche EXPEC"
 SAU_expec_research_centre_desc: "Le §YCentre d'exploration et d'ingénierie pétrolière§! développera une technologie intérieure de modélisation des réservoirs et de forage. Cela donne à Aramco des capacités techniques avancées et améliore sa compréhension de la géologie saoudienne."
 SAU_strong_saudi_banks: "Des banques saoudiennes solides"
 SAU_strong_saudi_banks_desc: "Al Rajhi, NCB, Riyad Bank et Samba s'étendront jusqu'à ce que les banques saoudiennes figurent parmi les cent plus grandes du monde."
 SAU_insurance_for_all: "Assurance pour tous"
 SAU_insurance_for_all_desc: "Le Royaume étendra l'assurance santé, automobile et immobilière après des décennies de développement limité du marché."
 SAU_grow_the_capital_markets: "Faire croître les marchés de capitaux"
 SAU_grow_the_capital_markets_desc: "Plus d'IPO, une plus grande liquidité et l'accès des QFI étrangers développeront le Tadawul en une bourse plus large et plus mature."
 SAU_a_saudi_bond_market: "Un marché obligataire saoudien"
 SAU_a_saudi_bond_market_desc: "Le Royaume développera des marchés de sukuk souverains, de sukuk d'entreprise et d'obligations conventionnelles capables d'attirer des investisseurs de Londres à Tokyo."
 SAU_the_sakani_housing_program: "Le programme de logement Sakani"
 SAU_the_sakani_housing_program_desc: "Le programme §YSakani§! met l'accession à la propriété à portée des Saoudiens ordinaires - terrain, financement et logements prêts livrés à grande échelle."
 SAU_the_national_housing_company: "La Société nationale du logement"
 SAU_the_national_housing_company_desc: "La §YSociété nationale du logement§! usera d'une construction standardisée et de développements planifiés pour étendre le logement autour des grandes villes."
 SAU_the_saudi_cement_industry: "L'industrie saoudienne du ciment"
 SAU_the_saudi_cement_industry_desc: "Saudi Cement, Yamama et d'autres producteurs intérieurs fourniront le programme de construction et réduiront les importations de ciment."
 SAU_glass_and_building_materials: "Verre et matériaux de construction"
 SAU_glass_and_building_materials_desc: "Le Royaume produira verre flotté, céramiques et acier de construction au pays pour alimenter son secteur du bâtiment."
 SAU_vision_2030: "Vision 2030"
 SAU_vision_2030_desc: "§YVision 2030§! est le plan du prince héritier pour réduire la dépendance au pétrole par le tourisme, l'industrie, le divertissement et de grands projets de développement. Son échéance publique de 2030 rend le gouvernement directement responsable de livrer ces réformes."
 SAU_qiddiya_and_the_line: "Qiddiya et The Line"
 SAU_qiddiya_and_the_line_desc: "§YQiddiya§! et §YThe Line§! introduiront les concepts de divertissement et d'urbanisme qui précèdent le plus grand groupe de giga-projets du Royaume."
 SAU_the_red_sea_project: "Le projet mer Rouge"
 SAU_the_red_sea_project_desc: "Le §Yprojet mer Rouge§! développera le tourisme de luxe le long de la côte et ouvrira certaines îles saoudiennes aux visiteurs internationaux."
 SAU_king_salman_international_airport: "Aéroport international Roi Salman"
 SAU_king_fahd_international_airport: "Aéroport international du Roi Fahd"
 SAU_king_fahd_international_airport_desc: "Le vaste aéroport international Roi-Fahd de Dammam a de la place pour devenir plus qu'un record. Étendre ses pistes et sa capacité aérodrome en une porte orientale pour passagers et fret saoudiens."
 SAU_king_salman_international_airport_desc: "Le nouvel §Yaéroport international Roi-Salman§! à Riyad sera conçu pour 100 millions de passagers par an et soutiendra les objectifs touristiques et logistiques du Royaume."
 SAU_king_abdullah_port: "Port du roi Abdallah"
 SAU_king_abdullah_port_desc: "Le §Yport Roi-Abdallah§!, premier port entièrement privé de la région, s'étendra en un grand hub de conteneurs."
 SAU_the_digital_government_authority: "L'Autorité du gouvernement numérique"
 SAU_the_digital_government_authority_desc: "L'§YAutorité du gouvernement numérique§! placera les services publics sur une plateforme en ligne commune et réduira l'administration papier."
 SAU_the_e_commerce_boom: "Le boom du commerce électronique"
 SAU_the_e_commerce_boom_desc: "La croissance de Salla, Noon et d'autres start-up fera passer davantage d'activité commerciale saoudienne en ligne et étendra le secteur du e-commerce."
 SAU_fintech_saudi: "Fintech saoudienne"
 SAU_fintech_saudi_desc: "STC Pay, Tamara et un cadre de banque ouverte permettront à §YFintech Saudi§! de développer Riyad comme centre régional de technologie financière."
 SAU_kacst_science_and_technology: "KACST : Science et technologie"
 SAU_kacst_science_and_technology_desc: "La §YCité du roi Abdulaziz pour la science et la technologie§! ancre la base de recherche du Royaume, des matériaux avancés à l'espace."
 SAU_the_human_capability_program: "Le programme des capacités humaines"
 SAU_the_human_capability_program_desc: "Les nouvelles industries ont besoin de Saoudiens formés pour les faire tourner. Le §Yprogramme de développement des capacités humaines§! liera salles de classe, écoles professionnelles et formation aux emplois que le Royaume cherche à créer."
 SAU_the_national_technology_development_program: "Le programme national de développement technologique"
 SAU_the_national_technology_development_program_desc: "Le programme national de développement technologique finance les start-up et les technologies de pointe dont le Royaume aura besoin lorsque le revenu pétrolier s'amenuisera."
 SAU_the_saudi_space_commission: "La Commission spatiale saoudienne"
 SAU_the_saudi_space_commission_desc: "Établie en 2018, la §YCommission spatiale saoudienne§! développera des missions d'astronautes, une capacité de lancement et la participation saoudienne au secteur spatial international."
 SAU_saudi_satellites_and_arabsat: "Satellites saoudiens et Arabsat"
 SAU_saudi_satellites_and_arabsat_desc: "Le programme SaudiSat et la participation du Royaume à §YArabsat§! étendront les capacités saoudiennes de communication et d'observation en orbite."
 SAU_sami_saudi_arabian_military_industries: "SAMI : Industries militaires saoudiennes"
 SAU_sami_saudi_arabian_military_industries_desc: "§YSaudi Arabian Military Industries§! est fondée en 2017 pour localiser la défense - la moitié du budget d'armement, dépensée au pays, d'ici 2030."
 SAU_gami_localise_the_arms_industry: "GAMI : localiser l'industrie d'armement"
 SAU_gami_localise_the_arms_industry_desc: "L'§YAutorité générale des industries militaires§! licence et fait croître un secteur d'armement intérieur presque à partir de rien."
 SAU_the_saudi_drone_program: "Le programme de drones saoudien"
 SAU_the_saudi_drone_program_desc: "Munitions rôdeuses et §Ydrones§! de reconnaissance, conçus et construits dans le Royaume."
 SAU_the_national_cybersecurity_authority: "L'Autorité nationale de cybersécurité"
 SAU_the_national_cybersecurity_authority_desc: "L'§YAutorité nationale de cybersécurité§! (2017) durcit les réseaux du Royaume après une décennie d'attaques contre Aramco et les ministères."
 SAU_sdaia_data_and_artificial_intelligence: "SDAIA : Données et Intelligence Artificielle"
 SAU_sdaia_data_and_artificial_intelligence_desc: "L'§YAutorité saoudienne des données et de l'IA§!, établie en 2019, coordonnera la stratégie nationale d'IA, étendra le supercalcul et mettra les données publiques à disposition d'un usage pratique."
 SAU_the_national_data_centres: "Les centres de données nationaux"
 SAU_the_national_data_centres_desc: "Les centres de données exigent une abondance d'énergie et une construction majeure. Le Royaume peut fournir les deux, et des campus hyperscale peuvent soutenir une industrie cloud intérieure au service de la région."
 SAU_the_5g_network: "Le réseau 5G"
 SAU_the_5g_network_desc: "STC et Mobily couvrent le Royaume de §Y5G§!, parmi les déploiements les plus rapides du monde."
 SAU_absher_and_yesser_e_government: "Absher et Yesser : e-gouvernement"
 SAU_absher_and_yesser_e_government_desc: "Yesser, §YAbsher§! et Tawakkalna placeront les services publics sur des plateformes mobiles et remplaceront des millions de transactions en personne."
 SAU_the_health_sector_transformation: "La transformation du secteur de la santé"
 SAU_the_health_sector_transformation_desc: "La transformation du secteur de la santé organisera les hôpitaux en grappes responsables, étendra l'hôpital virtuel Seha et accroîtra le rôle de l'assurance privée."
 SAU_madrasati_and_curriculum_reform: "Madrasati et réforme des programmes"
 SAU_madrasati_and_curriculum_reform_desc: "La plateforme §YMadrasati§! et des programmes révisés accroîtront l'enseignement de l'esprit critique, de l'anglais et de la programmation tout en réduisant la dépendance au par cœur."
 SAU_the_riyadh_metro: "Le métro de Riyad"
 SAU_the_riyadh_metro_desc: "Six lignes sous la capitale - le §Ymétro de Riyad§!, l'un des plus grands projets de transport urbain jamais bâtis en une seule phase."
 SAU_the_national_renewable_energy_program: "Le programme national d'énergies renouvelables"
 SAU_the_national_renewable_energy_program_desc: "Le §Yprogramme national d'énergies renouvelables§! développera des dizaines de gigawatts de production solaire et éolienne, permettant d'exporter davantage de brut au lieu de le brûler pour l'électricité."
 SAU_the_sakaka_solar_plant: "La centrale solaire de Sakaka"
 SAU_the_sakaka_solar_plant_desc: "La construction de la centrale de §YSakaka§! a commencé en 2018, et elle a été officiellement inaugurée en 2021 comme première installation solaire à l'échelle industrielle du Royaume. Son bas prix de l'électricité démontre le potentiel commercial de la production solaire saoudienne."
 SAU_the_dumat_al_jandal_wind_farm: "Le parc éolien de Dumat al-Jandal"
 SAU_the_dumat_al_jandal_wind_farm_desc: "Le parc éolien de 400 mégawatts de §YDumat al-Jandal§! usera des vents forts du nord pour fournir de l'électricité renouvelable et devenir la plus grande installation éolienne du Moyen-Orient."
 SAU_neom_green_hydrogen: "NEOM Hydrogène Vert"
 SAU_neom_green_hydrogen_desc: "NEOM accueillera la plus grande usine d'§Yhydrogène vert§! du monde. Le projet vise à convertir une électricité renouvelable à bas coût en un carburant exportable."
 SAU_the_civil_nuclear_program: "Le programme nucléaire civil"
 SAU_the_civil_nuclear_program_desc: "Le solaire s'éteint chaque soir, tandis que la demande d'électricité et d'eau dessalée ne s'éteint pas. Un programme nucléaire civil peut fournir les deux jour et nuit, pourvu que le Royaume accepte le coût et le regard qui suivent chaque réacteur."
 SAU_battery_energy_storage: "Stockage d'énergie par batteries"
 SAU_battery_energy_storage_desc: "Des batteries à l'échelle du réseau stockeront la production solaire de midi pour le pic de demande du soir, améliorant la fiabilité de l'électricité renouvelable."
 SAU_modernise_the_national_grid: "Moderniser le réseau national"
 SAU_modernise_the_national_grid_desc: "Un §Yréseau national§! intelligent, interconnecté avec le réseau du CCG, réduira les coupures et équilibrera une production renouvelable variable."
 SAU_ceer_the_saudi_electric_car: "Ceer : la voiture électrique saoudienne"
 SAU_ceer_the_saudi_electric_car_desc: "§YCeer§!, fondée en 2022, et l'usine Lucid près de Djeddah établiront une production intérieure de véhicules électriques. Cela permet à l'Arabie saoudite de fabriquer des véhicules plutôt que de s'en remettre entièrement aux importations."
 SAU_fund_vision_2030: "Fonds Vision 2030"
 SAU_fund_vision_2030_desc: "Un plan de cette ampleur ne peut vivre des seules annonces. Engager les fonds du Trésor et le capital du Fonds d'investissement public dans des projets capables de réduire la dépendance au pétrole, de créer des emplois privés et de prouver que Vision 2030 a quitté la planche à dessin."
 SAU_the_standardized_interest_law: "La loi normalisée sur l'intérêt"
 SAU_the_standardized_interest_law_desc: "L'intérêt siège à la faille entre la charia et la banque moderne. Le Royaume doit choisir s'il interdit le riba purement et simplement, autorise le crédit conventionnel, ou tolère l'intérêt derrière des formes islamiques."
 SAU_fractional_reserve_mandates: "Mandats de réserve fractionnaire"
 SAU_fractional_reserve_mandates_desc: "Des réserves plus basses libèrent davantage de dépôts pour le crédit mais laissent les banques moins capables de résister aux retraits. Le nouveau mandat doit décider combien de crédit les banques saoudiennes peuvent créer à partir de chaque riyal déposé."
 SAU_the_anti_speculation_directives: "Les directives anti-spéculation"
 SAU_the_anti_speculation_directives_desc: "Les dérivés permettent aux firmes de se couvrir contre les à-coups de prix, mais les mêmes instruments peuvent transformer les marchés en casino. Les régulateurs doivent tracer la ligne entre une gestion utile du risque et le gharar excessif interdit par la charia."
 SAU_the_interbank_lending_code: "Le code du prêt interbancaire"
 SAU_the_interbank_lending_code_desc: "Les banques saoudiennes ont besoin d'un marché au jour le jour pour déplacer le cash entre elles. Riyad doit choisir si cette liquidité circule par l'intérêt conventionnel, la murabaha de matières, ou deux systèmes tenus côte à côte."
 SAU_the_banking_control_law: "La loi de contrôle bancaire"
 SAU_the_banking_control_law_desc: "Le débat sur la banque s'achève sur une question d'autorité. La SAMA régulera-t-elle comme un organe technocratique indépendant, un conseil de la charia détiendra-t-il le veto, ou chacun supervisera-t-il ses propres institutions ?"
 SAU_bastion_of_islamic_finance: "Bastion de la finance islamique"
 SAU_bastion_of_islamic_finance_desc: "La finance islamique peut être une orthodoxie saoudienne protégée ou une affaire vendue au monde musulman plus large. Des règles strictes assurent la confiance des oulémas ; des règles pragmatiques amènent davantage de clients à Riyad."
 SAU_the_secularization_of_finance: "La sécularisation de la finance"
 SAU_the_secularization_of_finance_desc: "Ouvrir chaque instrument financier occidental attirerait le capital étranger et séparerait la banque de la tutelle cléricale. Une transition graduelle pourra adoucir le contrecoup, mais la rupture avec la tradition demeure."
 SAU_a_defensive_deal_with_pakistan: "Un accord défensif avec le Pakistan"
 SAU_a_defensive_deal_with_pakistan_desc: "Le Pakistan aligne la plus grande armée du monde musulman, et sa bombe est la seule qu'un État sunnite possède. Lier Islamabad à la défense des Deux Saintes Mosquées."
 SAU_sabic_industrialization: "Industrialisation SABIC"
 SAU_sabic_industrialization_desc: "§GSABIC§! (Saudi Basic Industries Corporation) est le géant pétrochimique du Royaume, fondé en 1976. Il transforme le pétrole saoudien en plastiques, engrais et produits chimiques - les briques d'une économie moderne."
 SAU_establish_sagia: "Créer la SAGIA"
 SAU_establish_sagia_desc: "Un décret royal établira l'§YAutorité générale saoudienne de l'investissement§! pour attirer le §Gcapital étranger§!. SAGIA simplifiera les licences, travaillera directement avec les investisseurs internationaux et promuvra §YRiyad§! comme centre des §Yaffaires mondiales§!."
 SAU_tadawul_the_saudi_stock_exchange: "Tadawul, la Bourse saoudienne"
 SAU_tadawul_the_saudi_stock_exchange_desc: "Le commerce des actions saoudiennes a grandi d'un marché informel en la §Gbourse Tadawul§!. Un marché des capitaux moderne a désormais besoin de règles formelles de cotation, de divulgation et de négoce avant de porter les ambitions d'investissement du Royaume."
 SAU_the_water_crisis: "La crise de l'eau"
 SAU_the_water_crisis_desc: "Les aquifères du Royaume s'épuisent, les §Yusines de dessalement§! sont sous une pression croissante, et l'usage d'eau par habitant est parmi les §Yplus élevés du monde§!. Le gouvernement doit reconnaître formellement la crise avant de pouvoir mettre en œuvre une réponse nationale."
 SAU_saudi_foreign_policy: "Politique étrangère saoudienne"
 SAU_saudi_foreign_policy_desc: "Le trône, les villes saintes et chaque tanker quittant le Golfe dépendent de ce que Riyad fait à l'étranger. La diplomatie saoudienne doit garder les grandes puissances proches sans laisser aucune d'elles posséder la sécurité du Royaume."
 SAU_fortify_the_kingdom: "Fortifier le Royaume"
 SAU_fortify_the_kingdom_desc: "Si la guerre froide avec l'Iran tourne au chaud, le coup tombera sur la province orientale et le Détroit. Durcir les défenses du royaume pour le jour où la dissuasion échoue."
 SAU_freedom_or_death: "La liberté ou la mort"
 SAU_freedom_or_death_desc: "La guerre syrienne est devenue une épreuve de volonté entre Riyad et Téhéran. S'engager pleinement dans la rébellion et miser le prestige saoudien sur la chute du régime Assad."
 SAU_fund_the_jordanian_army: "Financer l'armée jordanienne"
 SAU_fund_the_jordanian_army_desc: "Une armée jordanienne forte garde le long flanc nord du Royaume. Soutenir les soldats d'Amman afin que, le moment venu, ils répondent à Riyad."
 SAU_fund_the_lebanese_army: "Financer l'armée libanaise"
 SAU_fund_the_lebanese_army_desc: "Au Liban, l'armée nationale est le seul contrepoids à l'État dans l'État du Hezbollah. Financer les FAL comme pôle rival de la milice de l'Iran."
 SAU_fund_the_free_syrian_army: "Financer l'Armée syrienne libre"
 SAU_fund_the_free_syrian_army_desc: "Le soulèvement contre la maison d'Assad est une chance de briser le pont de l'Iran vers la mer. Canaliser argent et armes vers les rebelles qui se battent au nom d'une Syrie libre."
 SAU_guardians_of_the_two_mosques: "Gardiens des Deux Mosquées"
 SAU_guardians_of_the_two_mosques_desc: "Le titre de Serviteur des Deux Saintes Mosquées donne au roi une revendication religieuse indisponible aux autres souverains musulmans. Le Conseil ne peut assumer le titre, mais il peut renforcer sa légitimité en soutenant publiquement le roi dans ce rôle."
 SAU_the_hormuz_shield: "Le bouclier d'Ormuz"
 SAU_the_hormuz_shield_desc: "L'Iran menace de fermer le Détroit au premier signe de guerre. Bâtir le bouclier aérien et naval, avec l'aide des alliés, qui maintient les tankers en mer quoi que Téhéran menace."
 SAU_the_india_middle_east_corridor: "Le corridor Inde-Moyen-Orient"
 SAU_the_india_middle_east_corridor_desc: "Une nouvelle route de rails, de ports et d'oléoducs pourrait courir de Mumbai à travers l'Arabie jusqu'au cœur de l'Europe. Faire du Royaume le maillon indispensable du corridor qui contourne les goulots d'étranglement de la portée iranienne."
 SAU_install_a_loyalist_in_the_government: "Installer un loyaliste au gouvernement"
 SAU_install_a_loyalist_in_the_government_desc: "Un officier en service sera affecté à chaque ministère important, avec autorité de contreseing de ses décisions. Les ministres garderont leurs titres, mais l'armée gagnera le contrôle direct de la fonction publique."
 SAU_king_fahd_university_of_petroleum_and_minerals: "Université du roi Fahd du pétrole et des minéraux"
 SAU_king_fahd_university_of_petroleum_and_minerals_desc: "Science, technologie, ingénierie et mathématiques priment. Le royaume a besoin d'ingénieurs, non de clercs. Le programme s'en trouve modifié."
 SAU_the_tatweer_education_project: "Le projet éducatif Tatweer"
 SAU_the_tatweer_education_project_desc: "Le projet Tatweer mettra l'accent sur l'esprit critique, l'analyse et le débat plutôt que sur la mémorisation. Cette réforme change à la fois les méthodes d'enseignement et la culture éducative plus large."
 SAU_english_language_education: "Enseignement de l'anglais"
 SAU_english_language_education_desc: "L'anglais sera enseigné dès l'école primaire afin que les diplômés saoudiens participent plus efficacement à l'économie mondiale."
 SAU_the_teachers_colleges: "Les écoles normales"
 SAU_the_teachers_colleges_desc: "Les enseignants recevront une formation moderne en pédagogie, gestion de classe et technologie éducative."
 SAU_tatweer_smart_schools: "Écoles intelligentes Tatweer"
 SAU_tatweer_smart_schools_desc: "Les écoles intelligentes Tatweer introduiront tablettes en classe, plateformes d'apprentissage en ligne et tutorat assisté par l'IA."
 SAU_king_abdulaziz_university: "Université Roi Abdulaziz"
 SAU_king_abdulaziz_university_desc: "Des universités dont le roi Saoud, KAUST, KFUPM et l'université Princesse Nourah s'étendront à travers le Royaume et amélioreront l'accès à l'enseignement supérieur."
 SAU_king_abdullah_university_of_science_and_technology: "Université du roi Abdallah pour la science et la technologie"
 SAU_king_abdullah_university_of_science_and_technology_desc: "Des partenariats avec le MIT, Oxford et la Sorbonne, ainsi que des campus étrangers en Arabie saoudite, feront entrer l'expertise académique internationale dans le Royaume."
 SAU_the_king_abdullah_scholarship_program: "Le programme de bourses du roi Abdallah"
 SAU_the_king_abdullah_scholarship_program_desc: "Le programme de bourses du roi Abdallah financera des milliers d'étudiants saoudiens dans les universités étrangères de premier plan. Les diplômés reviendront avec des qualifications avancées et une expérience internationale."
 SAU_integrate_gosi_payrolls: "Intégrer la paie GOSI"
 SAU_integrate_gosi_payrolls_desc: "L'Organisation générale de l'assurance sociale sait déjà qui figure sur chaque paie du Royaume, puisqu'elle encaisse les cotisations. Personne n'avait pensé à pointer cette base sur la question des quotas.\n\nDès qu'elle est connectée, la bande Nitaqat d'une entreprise se calcule toute seule, et le nombre de Saoudiens réellement employés cesse d'être ce que la firme avait écrit en dernier sur un formulaire."
 SAU_reform_the_kafala_system: "Réformer le système de kafala"
 SAU_reform_the_kafala_system_desc: "Des millions de travailleurs étrangers vivent dans le Royaume liés à un seul employeur qui détient leurs papiers et leur permission de partir. La réforme ne met pas fin au dispositif - elle le rend lisible, portable et bien plus facile à entrer.\n\nLes flux croissent et s'ordonnent. Les entreprises cessent de payer pour contourner un système que personne ne pouvait défendre en public."
 SAU_platinum_tier_privileges: "Privilèges du niveau Platine"
 SAU_platinum_tier_privileges_desc: "Les entreprises de la bande supérieure voient leurs permis renouvelés sur place, leurs contrats approuvés en premier, et leur expansion validée pendant que la concurrence fait encore la queue.\n\nCela ne coûte rien au Trésor, et achète plus de conformité que n'importe quelle amende jamais infligée par le ministère."
 SAU_red_zone_visa_freezes: "Gel des visas en zone rouge"
 SAU_red_zone_visa_freezes_desc: "Les entreprises de la bande inférieure ne peuvent renouveler aucun permis de travail tant qu'elles n'en sont pas sorties. Pas restreintes - gelées.\n\nCertaines se restructurent dans le trimestre. D'autres embauchent des Saoudiens dont elles n'ont pas besoin. D'autres cessent simplement d'opérer, et le ministère a décidé qu'il pouvait vivre avec."
 SAU_launch_the_qiwa_platform: "Lancer la plateforme Qiwa"
 SAU_launch_the_qiwa_platform_desc: "Un portail unique pour chaque transaction de travail dans le Royaume - contrats, mutations, statut de quota, demandes de permis. Ce qui prenait un mois de paperasse par courrier se fait en un après-midi.\n\nC'est la mesure la moins glamour du programme et celle sur laquelle les deux camps s'accordent."
 SAU_repeal_the_expatriate_levy: "Abroger la taxe sur les expatriés"
 SAU_repeal_the_expatriate_levy_desc: "La redevance mensuelle sur chaque travailleur étranger visait à ramener les Saoudiens dans les paies du privé. Ce qu'elle a réellement fait, c'est fermer les entreprises aux marges les plus minces et pousser les autres à embaucher au noir.\n\nLa lever rend la main-d'œuvre dont l'économie vit, et ne rend rien au Trésor."
 SAU_high_skill_visa_fast_track: "Procédure accélérée pour les visas de haute compétence"
 SAU_high_skill_visa_fast_track_desc: "Les ingénieurs, chirurgiens et architectes de systèmes que le Royaume ne produit pas encore passent en quelques jours plutôt qu'en quelques mois, avec leurs familles, et sans parrain qui retient leur passeport.\n\nLe Royaume achète l'expertise qu'il n'a pas fini de faire pousser."
 SAU_abolish_the_noc_requirement: "Abolir l'exigence de NOC"
 SAU_abolish_the_noc_requirement_desc: "Un travailleur peut changer d'employeur sans l'autorisation écrite de l'employeur actuel. C'est une clause rayée du code du travail, et elle met fin au dispositif qui faisait tout le système.\n\nLe capital le remarque. Tout comme ceux qui profitaient de l'ancienne règle."
 SAU_the_doroob_training_initiative: "L'initiative de formation Doroob"
 SAU_the_doroob_training_initiative_desc: "Une plateforme nationale d'e-learning pour les compétences que le privé affiche réellement, gratuite à l'usage et ouverte à quiconque possède une carte d'identité nationale.\n\nElle ne réparera pas le marché du travail. Elle ôte l'excuse selon laquelle personne n'était formé."
 SAU_the_taqat_employment_portal: "Le portail de l'emploi Taqat"
 SAU_the_taqat_employment_portal_desc: "Le portail national de l'emploi : chaque demandeur d'emploi dans un registre, chaque vacance conforme dans un autre, et un ministère qui peut enfin voir l'écart entre les deux.\n\nJizan et les Frontières du Nord apparaissent dans les données pour la première fois."
 SAU_the_saudization_quotas: "Les quotas de saoudisation"
 SAU_the_saudization_quotas_desc: "Le quota cesse d'être un chiffre national unique et devient un barème - construction, commerce, télécoms et transport reçoivent chacun un plancher, pondéré par le nombre de Saoudiens que le secteur peut plausiblement absorber.\n\nLe ministère s'est déjà trompé sur ce chiffre."
 SAU_subsidize_sme_compliance: "Subventionner la conformité des PME"
 SAU_subsidize_sme_compliance_desc: "Un conglomérat peut porter un quota. Une firme de trente personnes ne le peut pas, et ces firmes emploient plus de Saoudiens par riyal de chiffre d'affaires que n'importe quel conglomérat du Royaume.\n\nCrédit bon marché, inspections allégées, et de l'espace pour grandir.\nCrédit bon marché, calendrier d'inspections allégé, et des bureaux pour grandir."
 SAU_the_industrial_cadre_mandate: "Le mandat des cadres industriels"
 SAU_the_industrial_cadre_mandate_desc: "L'industrie lourde se voit dire quelle part de son personnel technique doit être saoudienne, et reçoit une décennie pour y parvenir. Les géants pétrochimiques peuvent l'absorber ; les sous-traitants autour d'eux devront apprendre.\n\nLe Royaume cesse d'importer chaque ingénieur qui touche un oléoduc."
 SAU_hrdf_wage_subsidies: "Subventions salariales du HRDF"
 SAU_hrdf_wage_subsidies_desc: "Le Fonds de développement des ressources humaines paie une part du salaire d'un Saoudien embauché pendant les premières années, sur la théorie que l'écart entre un national et un expatrié est surtout un écart d'expérience.\n\nLes entreprises prennent la subvention. Que l'embauche survive à son expiration, c'est la part que personne n'a résolue."
 SAU_the_wusool_transport_subsidy: "La subvention de transport Wusool"
 SAU_the_wusool_transport_subsidy_desc: "La moitié des diplômés du Royaume sont des femmes et presque aucune n'est employée, et la contrainte n'est ni le talent ni la permission - c'est qu'elles ne peuvent pas se rendre au bureau.\n\nL'État subventionne le trajet. La main-d'œuvre croît d'un nombre qu'aucune politique migratoire ne pourrait égaler."
 SAU_foreign_ownership_deregulation: "Déréglementation de la propriété étrangère"
 SAU_foreign_ownership_deregulation_desc: "Une firme étrangère peut posséder son opération saoudienne en propre, rapatrier les profits sans discussion, et se passer du partenaire local qui apportait une signature et prenait un tiers.\n\nLes capitaux arrivent vite. La question de qui possède l'industrie du Royaume aussi."
 SAU_secondary_education_expansion: "Expansion de l'enseignement secondaire"
 SAU_secondary_education_expansion_desc: "Les lycées s'étendent. La formation professionnelle croît. Chaque adolescent saoudien a accès à l'enseignement secondaire - académique ou professionnel."
 SAU_technical_and_vocational_training_corporation: "Corporation de formation technique et professionnelle"
 SAU_technical_and_vocational_training_corporation_desc: "Les collèges techniques forment plombiers, électriciens, mécaniciens et soudeurs. Tous les Saoudiens n'ont pas besoin d'un diplôme universitaire. L'économie a besoin de métiers qualifiés."
 SAU_saudi_internal_affairs: "Affaires intérieures saoudiennes"
 SAU_saudi_internal_affairs_desc: "La politique intérieure du Royaume traitera de la sécurité publique, de l'éducation, de la santé et du bien-être économique. Ces systèmes fournissent la base de la stabilité et du développement à long terme."
 SAU_confront_the_literacy_crisis: "Affronter la crise de l'alphabétisation"
 SAU_the_anglo_style_curriculum: "Le programme de style anglo-saxon"
 SAU_the_anglo_style_curriculum_desc: "Un programme de style anglo-saxon fera entrer davantage d'esprit critique, d'enquête scientifique et de débat en classe dans les écoles saoudiennes. L'économie a besoin de ces habitudes, même si les oulémas y voient une intrusion étrangère."
 SAU_confront_the_literacy_crisis_desc: "En 2000, plus d'un Saoudien sur cinq ne sait pas lire, laissant le Royaume avec un §Ytaux d'alphabétisation de seulement 79 %§!. L'argent du pétrole ne modernise pas un pays sans enseignants, ingénieurs et clercs. Riyad doit choisir entre un §Ycurriculum à l'anglo-saxonne§! et un §Ysystème intérieur de filières académiques et professionnelles§!.\n\n§GChaque focus d'éducation relève le taux d'alphabétisation§! vers l'alphabétisation complète."
 SAU_education_transformation_complete: "Transformation éducative achevée"
 SAU_education_transformation_complete_desc: "Les universités se sont étendues, les programmes ont changé, et l'alphabétisation monte à travers le Royaume. Les réformes n'ont pas résolu chaque faiblesse, mais les salles de classe saoudiennes sont mieux préparées au travail à venir."
 SAU_domestic_secondary_tracks: "Pistes secondaires nationales"
 SAU_domestic_secondary_tracks_desc: "Les lycées saoudiens se diviseront en filières académiques et professionnelles, chacune bâtie autour des compétences nécessaires au pays. Le système coûte plus cher à construire que d'importer un modèle étranger, mais il répond aux priorités saoudiennes."
 SAU_ministry_of_human_resources_mandate: "Mandat du ministère des Ressources humaines"
 SAU_the_nitaqat_decree: "Le décret Nitaqat"
 SAU_the_nitaqat_decree_desc: "Le Royaume cesse de demander aux entreprises d'embaucher des Saoudiens et commence à les noter sur le fait qu'elles l'ont fait. Chaque firme reçoit une couleur, la couleur décide de ce qu'elle a le droit de faire, et la couleur se calcule à partir d'une paie que le ministère voit déjà.\n\nC'est la première politique du travail de l'histoire du Royaume dotée d'un mécanisme d'application."
 SAU_ministry_of_human_resources_mandate_desc: "Le ministère reçoit l'autorité qu'on lui a toujours prêtée : fixer des quotas par secteur, refuser un visa sans s'expliquer, et fermer une firme qui n'obtempère pas.\n\nLes entreprises qui ont passé des années à lobbyer le mauvais service découvrent qu'il y en a désormais un bon, et qu'il n'est pas intéressé."
 SAU_fast_track_government_contracts: "Accélérer les marchés publics"
 SAU_fast_track_government_contracts_desc: "Chaque riyal que l'État dépense en infrastructure devient un instrument de politique du travail. Les firmes conformes enchérissent les premières, sont payées les premières, et on le leur dit publiquement.\n\nLe Royaume est le plus gros client du Royaume. Il a enfin décidé d'acheter en conséquence."
 SAU_gip: "GIP"
 SAU_gip_desc: "Le GIP se professionnalise. Formation, équipement et procédures atteignent les normes internationales. La sécurité intérieure du royaume devient plus efficace - et plus visible."
 SAU_the_open_market: "Le marché ouvert"
 SAU_the_open_market_desc: "La réponse est de cesser de demander à l'État. Les règles de propriété tombent, les contrôles de capitaux tombent, et le marché décide quelles firmes méritent d'exister et de quels Saoudiens elles ont besoin.\n\nC'est la voie la plus rapide et la plus dure. Quiconque y perd un emploi ne sera rattrapé par rien."
 SAU_opec_agreement: "Accord OPEP+"
 SAU_opec_agreement_desc: "Moscou et Riyad sont rivaux sur le marché pétrolier et de camps opposés en Syrie, pourtant ensemble ils peuvent fixer le prix du brut. Conclure le marché qui maintient le cartel de deux intact."
 SAU_command_of_the_gulf: "Le commandement du Golfe"
 SAU_command_of_the_gulf_desc: "La marine iranienne brisée et le Détroit tenu ouvert, le Royaume se dresse maître des eaux du Golfe. Le long contest pour la mer est gagné."
 SAU_the_iraq_war: "La guerre d'Irak"
 SAU_the_iraq_war_desc: "Les chars américains roulent vers Bagdad, et l'ancien ordre en Mésopotamie est sur le point d'être balayé. Le Royaume doit se préparer à ce qui s'élèvera des décombres."
 SAU_king_in_name_heir_in_uniform: "Roi de nom, héritier en uniforme"
 SAU_king_in_name_heir_in_uniform_desc: "Le trône demeurera, mais l'héritier sera à la fois un prince et un officier en service acceptable pour le Conseil. Ce compromis préserve la dynastie tout en plaçant la succession sous supervision militaire."
 SAU_the_kingdom_unbeholden: "Le Royaume sans redevable"
 SAU_the_kingdom_unbeholden_desc: "Le Royaume rejettera les garanties de sécurité étrangères et les patrons, et s'appuiera entièrement sur sa propre défense. C'est l'option la plus coûteuse, mais elle préserve une pleine indépendance stratégique."
 SAU_martial_law_issues: "Questions de loi martiale"
 SAU_martial_law_issues_desc: "Les autorités militaires contrôleront les assemblées publiques, les déplacements entre provinces et la presse. Le Royaume n'ayant pas de constitution à suspendre, ces restrictions peuvent être imposées directement par décret."
 SAU_secure_support_in_the_mecca_province: "S'assurer le soutien de la province de La Mecque"
 SAU_secure_support_in_the_mecca_province_desc: "La province de La Mecque comprend Djeddah, les centres de pèlerinage, des familles marchandes influentes et une identité hejazie antérieure à la domination saoudienne. Le Conseil usera du patronage, des forces de sécurité et de concessions politiques pour s'assurer la province."
 SAU_the_mecca_summit: "Le sommet de La Mecque"
 SAU_the_mecca_summit_desc: "Le Royaume accueillera des négociations à La Mecque et usera du sommet pour renforcer la position de Riyad comme médiateur dans le monde musulman."
 SAU_memories_of_khafji: "Souvenirs de Khafji"
 SAU_memories_of_khafji_desc: "En 1991, les blindés irakiens s'emparèrent brièvement d'une ville frontalière saoudienne, une humiliation que le Royaume n'a jamais oubliée. Que le souvenir de Khafji trempe les défenses du royaume contre toute répétition."
 SAU_the_military_takeover: "La prise de pouvoir militaire"
 SAU_the_military_takeover_desc: "Les forces armées se sont emparées des ministères, de l'autorité de radiodiffusion et des abords des palais royaux. La Garde nationale créée pour prévenir un tel coup a été encerclée, laissant l'armée maîtresse du Royaume."
 SAU_the_monarchy_under_military_rule: "La monarchie sous le régime militaire"
 SAU_the_monarchy_under_military_rule_desc: "Le roi demeurera au palais et continuera de signer des décrets, mais le Conseil contrôlera les forces armées et déterminera la politique du gouvernement. La monarchie survit comme institution formelle sans pouvoir indépendant."
 SAU_the_royal_saudi_naval_forces: "Les Forces navales royales saoudiennes"
 SAU_the_royal_saudi_naval_forces_desc: "Renforcer les Forces navales royales saoudiennes (RSNF), partagées entre deux mers, pour garder les longues côtes du Royaume."
 SAU_eastern_fleet_jubail: "Flotte de l'Est (Jubail)"
 SAU_eastern_fleet_jubail_desc: "Baser la flotte de l'Est à Jubail pour dominer le golfe Arabique et protéger les terminaux pétroliers."
 SAU_western_fleet_jeddah: "Flotte occidentale (Djeddah)"
 SAU_western_fleet_jeddah_desc: "Baser la flotte de l'Ouest à Djeddah pour sécuriser la côte de mer Rouge et les approches de Bab-el-Mandeb."
 SAU_sawari_ii_frigate_programme: "Programme de frégates Sawari II"
 SAU_sawari_ii_frigate_programme_desc: "Acquérir les frégates de classe Al Riyadh construites en France au titre du programme Sawari II, les navires les plus puissants de la flotte."
 SAU_badr_class_corvettes: "Corvettes de classe Badr"
 SAU_badr_class_corvettes_desc: "Mettre en ligne les corvettes de classe Badr construites aux États-Unis pour la patrouille, l'escorte et la frappe côtière."
 SAU_royal_saudi_marines: "Marines royales saoudiennes"
 SAU_royal_saudi_marines_desc: "Lever une force de marines royaux saoudiens pour les débarquements amphibies et la défense de la côte et des îles."
 SAU_king_faisal_naval_base: "Base navale du roi Fayçal"
 SAU_king_faisal_naval_base_desc: "Développer les grandes bases navales de Djeddah et de Jubail pour soutenir une marine à deux flottes."
 SAU_neom_aqaba_synergy: "Synergie NEOM-Aqaba"
 SAU_neom_aqaba_synergy_desc: "Là où la mégacité saoudienne de NEOM rencontre le port jordanien d'Aqaba, une zone économique unique pourrait chevaucher le golfe entre elles. Tresser les deux rives en un seul moteur de croissance."
 SAU_deal_with_the_french: "Traiter avec les Français"
 SAU_deal_with_the_french_desc: "Paris vend des armes à quiconque et fait la leçon à tout le monde, mais les affaires sont les affaires. Un pacte d'investissement soigneusement clôturé permet au Royaume de profiter de l'industrie française tout en gardant de meilleures options à portée."
 SAU_a_new_iraqi_alignment: "Un nouvel alignement irakien"
 SAU_a_new_iraqi_alignment_desc: "Des années de diplomatie patiente et de patronage portent leurs fruits : Bagdad penche enfin vers Riyad. Ancrer le nouvel alignement avant qu'il ne glisse à nouveau vers Téhéran."
 SAU_major_non_nato_ally: "Allié majeur non-OTAN"
 SAU_major_non_nato_ally_desc: "Hors d'une alliance par traité, le plus près qu'une nation puisse se tenir des puissances atlantiques est le statut de partenaire privilégié. Obtenir pour le Royaume le rang d'allié majeur non-OTAN."
 SAU_the_palestine_question: "La question palestinienne"
 SAU_the_cause_above_all: "La cause avant tout"
 SAU_the_cause_above_all_desc: "Le Royaume fera du soutien à la Palestine le centre de sa revendication au leadership du monde musulman et de son rôle de Serviteur des Deux Saintes Mosquées."
 SAU_open_the_backchannel: "Ouvrir le canal discret"
 SAU_open_the_backchannel_desc: "Des hommes discrets dans des pays tiers, déniables et patients, sondent ce que Tel-Aviv pourrait accepter avant que l'un ou l'autre camp ne dise rien à haute voix."
 SAU_the_arab_peace_initiative: "L'Initiative de paix arabe"
 SAU_the_arab_peace_initiative_desc: "Le plan propre du Royaume, offert à Beyrouth en 2002 et jamais retiré : une normalisation pleine avec tout le monde arabe en échange d'une Palestine indépendante sur les lignes de 1967. Riyad le remet sur la table, formellement et par écrit."
 SAU_sweeten_the_deal: "Adoucir l'accord"
 SAU_sweeten_the_deal_desc: "Fonds d'investissement, corridors technologiques et ciels ouverts. Riyad montre à Tel-Aviv ce que vaut la paix avec la plus grande économie du Golfe."
 SAU_the_talks_collapse: "L'effondrement des pourparlers"
 SAU_the_talks_collapse_desc: "Israël n'a pas payé le prix, et Riyad ne l'a pas baissé. Les délégations rentrent, et la question retrouve sa vieille réponse."
 SAU_the_riyadh_accords: "Les accords de Riyad"
 SAU_the_riyadh_accords_desc: "Israël a accepté l'Initiative de paix arabe. La reconnaissance contre un État sur les lignes de 1967, la nouvelle Palestine garantie par l'Arabie saoudite et la Jordanie : l'accord du siècle, signé à Riyad."
 SAU_embassies_and_trade: "Ambassades et commerce"
 SAU_embassies_and_trade_desc: "Vols, missions commerciales et flux de capitaux entre Riyad et Tel-Aviv. La paix commence à se payer d'elle-même."
 SAU_silicon_and_sand: "Silicium et sable"
 SAU_silicon_and_sand_desc: "La technologie israélienne et le capital saoudien font des partenaires naturels. Des coentreprises en cyber, eau et agritech prennent racine dans les deux déserts."
 SAU_double_down_on_palestine: "Redoubler d'engagement en faveur de la Palestine"
 SAU_double_down_on_palestine_desc: "Si Israël n'accorde pas un État, le Royaume en bâtira un quand même : argent, institutions et poids saoudien derrière Ramallah."
 SAU_rally_the_arab_league: "Rassembler la Ligue arabe"
 SAU_rally_the_arab_league_desc: "L'échec des pourparlers a prouvé le point à chaque capitale hésitante. Riyad rassemble la Ligue derrière une seule ligne : pas de normalisation sans Palestine."
 SAU_no_peace_without_palestine: "Pas de paix sans la Palestine"
 SAU_the_fate_of_palestine: "Le destin de la Palestine"
 SAU_the_fate_of_palestine_desc: "Par traité ou par défi, le Royaume s'est lié à l'avenir de la Palestine. Le Serviteur des Deux Saintes Mosquées n'abandonne pas Jérusalem."
 SAU_no_peace_without_palestine_desc: "Il n'y aura pas d'ambassade à Tel-Aviv tant que la Palestine restera occupée. Le Royaume tient la ligne que le monde arabe a tracée en 2002."
 SAU_normalization_with_conditions: "Normalisation sous conditions"
 SAU_normalization_with_conditions_desc: "Le prix de Riyad n'a pas changé depuis l'Initiative de paix arabe : la reconnaissance contre un État. Si Israël veut la main du Royaume, il acceptera une Palestine indépendante."
 SAU_normalization_without_conditions: "Normalisation sans conditions"
 SAU_normalization_without_conditions_desc: "Le Royaume reconnaîtra Israël sans exiger de concessions sur la Palestine. Cela améliorera les relations avec les États-Unis et encouragera le commerce, mais provoquera une opposition substantielle à travers le monde arabe."
 SAU_normalization_champion_the_palestinian_cause: "Défendre la cause palestinienne"
 SAU_normalization_champion_the_palestinian_cause_desc: "L'argent saoudien maintient les lumières à Ramallah et la cause vivante dans chaque capitale arabe."
 SAU_strengthen_the_resistance: "Renforcer la résistance"
 SAU_strengthen_the_resistance_desc: "Les factions qui résistent à l'occupation ne manqueront ni de fonds ni d'amis tant que Riyad se tiendra derrière elles."
 SAU_boycott_israeli_goods: "Boycottez les produits israéliens"
 SAU_boycott_israeli_goods_desc: "Pas un riyal d'argent saoudien ne touchera un rayon israélien. Le marché du Royaume ferme ses portes."
 SAU_pressure_the_normalizers: "Presser les normalisateurs"
 SAU_pressure_the_normalizers_desc: "Tout gouvernement arabe tenté par la poignée de main de Tel-Aviv sentira d'abord le mécontentement de Riyad. Les rangs tiennent parce que le Royaume les tient."
 SAU_an_arab_consensus: "Un consensus arabe"
 SAU_an_arab_consensus_desc: "De Rabat à Bagdad, le Royaume forge une seule voix arabe sur Israël : pas de reconnaissance, pas de relations, pas d'exceptions."
 SAU_the_palestine_question_desc: "Chaque capitale arabe a une réponse à la question israélienne ; aucune ne s'accorde. Riyad doit maintenant choisir la sienne : la paix sans conditions, la paix à un prix, ou pas de paix du tout."
 SAU_a_deal_with_south_korea: "Un accord avec la Corée du Sud"
 SAU_a_deal_with_south_korea_desc: "Les chantiers, réacteurs et géants de la construction coréens ont bâti une grande part du Golfe moderne. Courtiser Séoul comme partenaire pour le nucléaire civil, l'industrie de défense et les mégaprojets de Vision 2030."
 SAU_saudi_china_deal: "Accord Saoudien-Chine"
 SAU_saudi_china_deal_desc: "Les firmes chinoises ont faim de contrats pétroliers et d'un pied-à-terre dans le Golfe. Leur offrir l'accès aux projets agricoles et énergétiques saoudiens en échange d'investissements dans le Royaume."
 SAU_operation_red_gulf: "Opération Golfe Rouge"
 SAU_operation_red_gulf_desc: "Si la guerre froide s'enflamme, le Royaume doit être prêt à porter le combat jusqu'au rivage iranien. Dresser les plans d'une campagne décisive dans les eaux du Golfe."
 SAU_palestine_champion_the_palestinian_cause: "Défendre la cause palestinienne"
 SAU_bankroll_the_resistance: "Financer la résistance"
 SAU_bankroll_the_resistance_desc: "Les mots sont bon marché. Canaliser de l'argent et des armes réels vers les factions palestiniennes afin que l'influence saoudienne, non iranienne, façonne la lutte."
 SAU_arm_the_militants: "Armer les militants"
 SAU_arm_the_militants_desc: "Soutenir les factions armées sans détour. Riyad devient le payeur du fusil, disputant à Téhéran la loyauté de chaque combattant à Gaza."
 SAU_guardian_of_al_aqsa: "Gardien d'Al-Aqsa"
 SAU_guardian_of_al_aqsa_desc: "Le soutien saoudien a assuré à Riyad un rôle durable en Palestine et renforcé sa revendication à garder Al-Aqsa."
 SAU_broker_a_two_state_peace: "Négocier une paix à deux États"
 SAU_broker_a_two_state_peace_desc: "Le Royaume médiera un règlement à deux États. Un accord réussi sponsorisé par l'Arabie saoudite étendrait l'influence diplomatique de Riyad à travers le monde arabe."
 SAU_palestine_champion_the_palestinian_cause_desc: "La Palestine reste l'une des questions politiquement les plus importantes du monde arabe. Soutenir la cause palestinienne renforcera la revendication du Royaume au leadership musulman et contrera l'influence iranienne."
 SAU_ceasefire_with_the_houthis: "Cessez-le-feu avec les Houthis"
 SAU_ceasefire_with_the_houthis_desc: "Offrir aux Houthis un cessez-le-feu qui arrêterait les pertes saoudiennes et gèlerait le front. S'ils acceptent, la paix voudra dire vivre avec un ennemi armé à la frontière sud."
 SAU_the_great_pipeline_game: "Le grand jeu des oléoducs"
 SAU_the_great_pipeline_game_desc: "La plupart des exportations pétrolières saoudiennes passent par le détroit d'Ormuz, les laissant vulnérables à la perturbation iranienne. Le Royaume envisagera trois routes alternatives d'oléoduc : par le Yémen vers la mer d'Arabie, par la Syrie vers la Méditerranée, ou par l'Irak et la Turquie vers l'Europe ; chacune traverse une région instable et concurrence les intérêts énergétiques russes."
 SAU_prepare_defences_against_saddam: "Préparer les défenses contre Saddam"
 SAU_prepare_defences_against_saddam_desc: "Un Saddam acculé est un Saddam dangereux. Fortifier la frontière nord contre l'armée qui s'est autrefois dressée au Koweït, à une journée de route des champs pétroliers."
 SAU_proclaim_the_republic: "Proclamer la République"
 SAU_proclaim_the_republic_desc: "Le Conseil abolira formellement la monarchie et proclamera une république. Les institutions du nouvel État restent indécises, mais le trône des Al Saoud ne survivra pas à la déclaration."
 SAU_reaffirming_the_quincy_agreement: "Réaffirmer l'accord du Quincy"
 SAU_reaffirming_the_quincy_agreement_desc: "Roosevelt et Abdulaziz établirent la base des relations saoudo-américaines à bord de l'USS Quincy en février 1945 : un soutien de sécurité américain en échange d'un pétrole saoudien fiable. Le Conseil cherchera confirmation que cet arrangement s'applique à l'État saoudien plutôt qu'à la seule monarchie."
 SAU_the_regency_decree: "Le décret de régence"
 SAU_the_regency_decree_desc: "Le roi signera un décret transférant les pouvoirs exécutif et de défense au Conseil pour une période d'incapacité non précisée. Le décret préserve une apparence légale tout en plaçant le gouvernement sous contrôle militaire."
 SAU_master_the_crisis: "Maîtriser la crise"
 SAU_master_the_crisis_desc: "Quelle que soit la façon dont l'eau a été construite, elle coule désormais, et le ministère peut enfin planifier pour une année plutôt que pour une saison.\n\n§YLève le reste de la crise de l'eau§!. Disponible une fois Ras Al-Khair ou Shuaibah en ligne.\n\nLe Royaume cesse de rationner et se met à construire."
 SAU_arm_the_faithful: "Armer les fidèles"
 SAU_arm_the_faithful_desc: "Distribuer armes et formation aux milices de la révolution."
 SAU_hezbollah_brigades: "Brigades du Hezbollah"
 SAU_hezbollah_brigades_desc: "Forger les milices en brigades disciplinées modelées sur la résistance libanaise."
 SAU_shia_civil_rights: "Droits civiques chiites"
 SAU_shia_civil_rights_desc: "Garantir à la communauté chiite l'égalité devant la loi, mettant fin à des décennies de discrimination officielle."
 SAU_sectarian_coexistence: "Coexistence sectaire"
 SAU_sectarian_coexistence_desc: "Forger un pacte national entre sunnites et chiites, fondé sur une citoyenneté partagée."
 SAU_the_constitutional_shia_republic: "La république chiite constitutionnelle"
 SAU_the_federal_welfare_state: "L'État-providence fédéral"
 SAU_the_federal_welfare_state_desc: "Bâtir les institutions de la république constitutionnelle : un État-providence fédéral qui lie les communautés par une prospérité partagée et l'État de droit."
 SAU_the_constitutional_shia_republic_desc: "Couronner la voie modérée d'une république constitutionnelle garantissant les droits chiites au sein d'un ordre pluraliste."
 SAU_develop_the_eastern_province: "Développer la province orientale"
 SAU_develop_the_eastern_province_desc: "Canaliser la richesse pétrolière de la république vers le cœur chiite longtemps négligé de l'est."
 SAU_export_the_revolution: "Exporter la révolution"
 SAU_export_the_revolution_desc: "Porter la révolution au-delà des frontières de l'Arabie vers les chiites du Golfe."
 SAU_federal_autonomy: "Autonomie fédérale"
 SAU_federal_autonomy_desc: "Déléguer un vrai pouvoir aux provinces chiites au sein d'une union fédérale et pluraliste."
 SAU_alliance_with_iran: "Alliance avec l'Iran"
 SAU_alliance_with_iran_desc: "Lier le nouvel État à Téhéran, patron de la révolution chiite à travers la région."
 SAU_the_islamic_republic_of_arabia: "La République islamique d'Arabie"
 SAU_the_revolutionary_state: "L'État révolutionnaire"
 SAU_the_revolutionary_state_desc: "La République islamique centralisera ses institutions, milices et clergé sous un gouvernement révolutionnaire discipliné aligné sur la résistance."
 SAU_the_islamic_republic_of_arabia_desc: "Proclamer la République islamique sous la tutelle du juriste, alignée sur l'axe de la résistance."
 SAU_shia_national_dialogue: "Dialogue national"
 SAU_shia_national_dialogue_desc: "Chercher réparation pour les chiites par la négociation et les urnes plutôt que par la confrontation."
 SAU_the_parliamentary_path: "La voie parlementaire"
 SAU_the_parliamentary_path_desc: "Engager le mouvement dans une assemblée élue, disputant le pouvoir ouvertement comme opposition loyale."
 SAU_reconcile_with_the_republic: "Se réconcilier avec la République"
 SAU_reconcile_with_the_republic_desc: "Enterrer les vieux griefs et accepter une place dans le cadre national, échangeant la révolution contre la représentation."
 SAU_guarantee_religious_freedom: "Garantir la liberté religieuse"
 SAU_guarantee_religious_freedom_desc: "Protéger les rites et séminaires de chaque communauté sous une république tolérante et laïque."
 SAU_the_republic_endures: "La République endure"
 SAU_the_republic_endures_desc: "Les années provisoires sont finies. La république chiite gouverne désormais par des institutions permanentes, et les citoyens doivent la tenir pour l'État durable de l'Arabie."
 SAU_the_resistance: "La résistance"
 SAU_the_resistance_desc: "Rassembler les fidèles à la lutte armée, dans l'esprit du Hezbollah du Hedjaz."
 SAU_the_revolutionary_vanguard: "L'avant-garde révolutionnaire"
 SAU_the_revolutionary_vanguard_desc: "Placer le clergé armé à la tête de l'État, au-dessus du parti et du parlement."
 SAU_wilayat_al_faqih: "Wilayat al-Faqih"
 SAU_wilayat_al_faqih_desc: "Inscrire la tutelle du juriste, investissant l'autorité ultime dans le guide religieux suprême."
 SAU_the_national_charter: "La Charte nationale"
 SAU_the_national_charter_desc: "Proclamer une constitution écrite qui lie gouvernants et gouvernés également à la loi."
 SAU_liberalize_the_economy: "Libéraliser l'économie"
 SAU_liberalize_the_economy_desc: "Ouvrir l'économie fermée à la concurrence et à l'entreprise privée."
 SAU_privatize_the_state_sector: "Privatiser le secteur d'État"
 SAU_privatize_the_state_sector_desc: "Vendre les firmes d'État hypertrophiées à des mains privées et laisser le marché travailler."
 SAU_open_to_foreign_investment: "Ouverture à l'investissement étranger"
 SAU_open_to_foreign_investment_desc: "Accueillir le capital étranger pour bâtir les usines que le royaume n'a jamais eues."
 SAU_diversify_beyond_oil: "Diversifier au-delà du pétrole"
 SAU_diversify_beyond_oil_desc: "Sevrer la république du brut, bâtissant une économie qui survive aux puits."
 SAU_secure_property_rights: "Droits de propriété sécurisés"
 SAU_secure_property_rights_desc: "Inscrire le droit de posséder, et le droit de garder ce que l'on a bâti."
 SAU_free_trade_agreements: "Accords de libre-échange"
 SAU_free_trade_agreements_desc: "Signer des pactes de libre-échange qui lient l'Arabie aux marchés du monde."
 SAU_an_independent_central_bank: "Une banque centrale indépendante"
 SAU_an_independent_central_bank_desc: "Libérer l'autorité monétaire de l'ingérence politique."
 SAU_champion_the_private_sector: "Défendre le secteur privé"
 SAU_champion_the_private_sector_desc: "Soutenir les entrepreneurs et les petites entreprises qui font tourner une économie libre."
 SAU_equality_for_women: "Égalité pour les femmes"
 SAU_equality_for_women_desc: "Abattre les lois de tutelle et asseoir les femmes comme égales dans la vie publique."
 SAU_reform_the_schools: "Réformer les écoles"
 SAU_reform_the_schools_desc: "Remplacer l'instruction cléricale par cœur par un programme moderne et laïque."
 SAU_an_elected_majlis_al_shura: "Un Majlis al-Shura élu"
 SAU_an_elected_majlis_al_shura_desc: "Transformer le Conseil consultatif nommé en un parlement national librement élu."
 SAU_freedom_of_religion: "Liberté de religion"
 SAU_freedom_of_religion_desc: "Garantir à chaque foi le droit de pratiquer librement et au grand jour."
 SAU_nda_secular_republic: "Une République laïque"
 SAU_nda_secular_republic_desc: "Tracer une ligne ferme entre la mosquée et l'État."
 SAU_empower_civil_society: "Autonomiser la société civile"
 SAU_empower_civil_society_desc: "Légaliser les syndicats, les œuvres et les associations qui tissent un peuple libre."
 SAU_guarantee_labor_rights: "Garantir les droits du travail"
 SAU_guarantee_labor_rights_desc: "Assurer le droit de s'organiser, de faire grève et à un salaire équitable."
 SAU_a_human_rights_charter: "Une Charte des Droits de l'Homme"
 SAU_a_human_rights_charter_desc: "Lier la république aux droits universels de tout son peuple."
 SAU_realign_with_the_west: "Se réaligner sur l'Occident"
 SAU_realign_with_the_west_desc: "Tourner la république vers Washington et Bruxelles comme partenaire parmi les démocraties."
 SAU_mend_the_gulf: "Réparer le Golfe"
 SAU_mend_the_gulf_desc: "Se réconcilier avec les États du Golfe comme nation arabe sœur, monarchies comprises."
 SAU_join_the_worlds_institutions: "Rejoindre les institutions du monde"
 SAU_join_the_worlds_institutions_desc: "Prendre le siège de l'Arabie dans les conseils de l'ordre international."
 SAU_open_the_borders: "Ouvrir les frontières"
 SAU_open_the_borders_desc: "Faciliter le flux des personnes et des biens à travers une frontière plus libre."
 SAU_an_arab_democratic_league: "Une Ligue arabe démocratique"
 SAU_an_arab_democratic_league_desc: "Rassembler les démocraties du monde arabe sous une seule bannière dirigée depuis Riyad."
 SAU_the_first_free_elections: "Les premières élections libres"
 SAU_the_first_free_elections_desc: "Ouvrir le bulletin à chaque citoyen et laisser le peuple choisir son propre gouvernement."
 SAU_an_independent_judiciary: "Un pouvoir judiciaire indépendant"
 SAU_an_independent_judiciary_desc: "Libérer les cours du palais, fondant une justice ne répondant qu'à la loi."
 SAU_freedom_of_the_press: "La liberté de la presse"
 SAU_freedom_of_the_press_desc: "Lever la main du censeur des journaux et des ondes."
 SAU_the_anti_corruption_commission: "La commission anticorruption"
 SAU_the_anti_corruption_commission_desc: "Fonder un chien de garde indépendant pour déraciner le trafic d'influence des hautes fonctions."
 SAU_decentralize_the_provinces: "Décentraliser les provinces"
 SAU_decentralize_the_provinces_desc: "Déléguer un vrai pouvoir à des conseils provinciaux élus à travers le royaume."
 SAU_limit_the_executive: "Limiter l'exécutif"
 SAU_limit_the_executive_desc: "Lier la présidence par des limites de mandat, afin qu'aucun dirigeant ne règne à vie."
 SAU_the_provisional_government: "Le gouvernement provisoire"
 SAU_convene_the_national_assembly: "Convoquer l'Assemblée nationale"
 SAU_convene_the_national_assembly_desc: "Le gouvernement provisoire convoquera les partis politiques de la nouvelle république et déterminera quel mouvement dirigera l'État permanent."
 SAU_the_communist_party: "Le Parti communiste"
 SAU_the_communist_party_desc: "Le Parti communiste saoudien a passé quatre décennies dans la clandestinité, l'exil ou la prison. Sa direction survivante rentre à Riyad avec un mouvement petit mais bien organisé."
 SAU_the_national_democratic_assembly: "L'Assemblée démocratique nationale"
 SAU_the_national_democratic_assembly_desc: "Remettre la nouvelle république aux démocrates libéraux de l'Assemblée démocratique nationale. Ils promettent une constitution écrite, un parlement élu et une économie ouverte responsable devant les urnes."
 SAU_the_arab_baath_party: "Le Parti Baas arabe"
 SAU_the_arab_baath_party_desc: "Remettre la république au Parti Baas socialiste arabe, les nationalistes panarabes laïcs qui rêvent d'une seule nation arabe unie."
 SAU_the_islamic_parties: "Les partis islamiques"
 SAU_the_islamic_parties_desc: "Clercs de la Sahwa, réseaux des Frères musulmans et sociétés charitables islamiques ont survécu à des interdictions répétées et exigent désormais un rôle dans le gouvernement post-révolutionnaire."
 SAU_the_provisional_government_desc: "Le Conseil national de transition gouverne un pays sans constitution, sans élections et sans avenir fixé. Sa première tâche est simplement de maintenir l'ordre et de poser les bases de la république qui suivra."
 SAU_restoration_of_relations: "Rétablissement des relations"
 SAU_restoration_of_relations_desc: "Des années de rupture cèdent, avec prudence, à la réouverture des ambassades. Gérez la dangereuse détente avec la République islamique sans céder les intérêts du Royaume."
 SAU_the_house_that_rules_the_kingdom: "La Maison qui règne sur le Royaume"
 SAU_the_house_that_rules_the_kingdom_desc: "La dynastie Al Saoud règne sur l'Arabie centrale depuis des générations. Depuis l'AVC du roi Fahd en 1995, le §Ypouvoir effectif§! est passé aux princes aînés qui se disputent le contrôle de la succession."
 SAU_sanction_the_southern_bloc: "Sanctionner le bloc du Sud"
 SAU_sanction_the_southern_bloc_desc: "Étranglez les finances des factions alignées sur l'Iran dans toute la région. Sanctions et listes noires privent les amis de Téhéran de l'argent qui les retient."
 SAU_saddam_falls: "Chutes de Saddam"
 SAU_saddam_falls_desc: "Les statues tombent et le régime s'effondre, laissant un vide là où se tenait un grand État arabe. Riyad doit agir avant que Téhéran ne le comble."
 SAU_saddam_endures: "Saddam endure"
 SAU_saddam_endures_desc: "Le régime baasiste survit à la tempête, blessé mais debout. Le vieil ennemi demeure au-delà de la frontière nord, et le Royaume doit encore cohabiter avec le tyran de Bagdad."
 SAU_saudi_economic_focus_tree: "Arbre de focuses économiques saoudien"
 SAU_saudi_economic_focus_tree_desc: "Le pétrole paie les factures, les travailleurs étrangers font une grande part du travail, et trop souvent les capitaux saoudiens quittent le pays. L'économie suivante doit produire davantage chez soi, employer davantage de Saoudiens, et donner aux villes hors de Riyad une part de la croissance."
 SAU_national_water_company: "Compagnie nationale des eaux"
 SAU_national_water_company_desc: "Le Royaume construit sa propre eau. Une entreprise d'État, un mandat, et des canalisations jusqu'aux villes que l'investissement commercial n'aurait jamais justifiées.\n\n§GAccorde la Compagnie nationale des eaux§! et §Gune infrastructure au Najd§!, et §Yallège la crise de l'eau d'un cran§!.\n\nPlus lent et plus coûteux que de sous-traiter. Cela reste saoudien."
 SAU_a_saudi_spanish_partnership: "Un partenariat saoudo-espagnol"
 SAU_a_saudi_spanish_partnership_desc: "Les chantiers espagnols construisent les nouvelles corvettes du Royaume et les firmes espagnoles son TGV vers La Mecque. Cultivez Madrid comme partenaire européen utile, hors du cercle habituel."
 SAU_sermons_from_the_ministry: "Sermons du ministère"
 SAU_sermons_from_the_ministry_desc: "Le ministère révisera la khutba du vendredi diffusée dans les mosquées du Royaume. Un texte commun lu depuis quelque quinze mille chaires donnera au gouvernement une influence directe sur le message religieux."
 SAU_recognize_the_shia_clergy: "Reconnaître le clergé chiite"
 SAU_recognize_the_shia_clergy_desc: "Accordez aux §Yulémas chiites§! un statut officiel aux côtés de l'establishment wahhabite.\n\n§G+Stabilité, +Population chiite§!."
 SAU_crackdown_on_shia_dissent: "Répression de la dissidence chiite"
 SAU_crackdown_on_shia_dissent_desc: "Répondez à la contestation par les §YMabahith§! et la §YGarde nationale§!. Les chiites seront surveillés, contenus et relégués en marge — et la majorité sunnite s'en trouvera plus tranquille.\n\n§R+Résistance chiite§!, §R-Population chiite§!, §G+Stabilité, +Soutien à la guerre§!."
 SAU_sunni_shia_dialogue: "Dialogue sunnite-chiite"
 SAU_sunni_shia_dialogue_desc: "Un dialogue national pour commencer à cicatriser quatorze siècles de schisme.\n\n§G-Résistance chiite, +Stabilité, +Population chiite§!."
 SAU_invest_in_the_eastern_province: "Investir dans la province orientale"
 SAU_invest_in_the_eastern_province_desc: "Versez les pétrodollars dans le cœur chiite — routes, hôpitaux, ports.\n\n§G+Stabilité, +Population chiite§!."
 SAU_resettling_the_eastern_province: "Repeupler la province orientale"
 SAU_resettling_the_eastern_province_desc: "La question chiite est enfin réglée. La §Yprovince orientale§! est apaisée par un repeuplement patient, pour une génération.\n\n§R--Population chiite§!, §Grésistance brisée§!, §G++Stabilité§!."
 SAU_economic_inclusion: "Inclusion économique"
 SAU_economic_inclusion_desc: "Partagez la richesse des champs pétrolifères avec ceux qui vivent au-dessus. La plaie confessionnelle commence enfin à se fermer.\n\n§Grésistance terminée, +Stabilité, +Population chiite§!."
 SAU_equal_educational_access: "Égalité d’accès à l’éducation"
 SAU_equal_educational_access_desc: "Bâtissez écoles et universités à §YQatif§! et §YAl-Ahsa§! à la hauteur de celles du Najd.\n\n§G+Stabilité, +Population chiite§!."
 SAU_embrace_shia_citizens: "Embrassez les citoyens chiites"
 SAU_embrace_shia_citizens_desc: "Accueillez les chiites comme citoyens à part entière — et entamez un chemin qui pourrait mener la §YMaison des Saoud§! elle-même à reconsidérer la foi qu'elle fut bâtie pour réprimer.\n\n§G+Population chiite, -Résistance chiite§!."
 SAU_sectarian_harmony: "Harmonie sectaire"
 SAU_sectarian_harmony_desc: "Sunnites et chiites, une nation sous une couronne.\n\n§Grésistance terminée, +Stabilité, +Population chiite§!."
 SAU_integrate_the_communities: "Intégrer les communautés"
 SAU_integrate_the_communities_desc: "Ouvrez l'armée, la police et la bureaucratie aux citoyens chiites qui jurent fidélité à la couronne.\n\n§G-Résistance chiite, +Stabilité, +Population chiite§!."
 SAU_the_shia_question: "La question chiite"
 SAU_the_shia_question_desc: "Environ deux millions de citoyens §Ychiites§! vivent dans la §Yprovince orientale§! productrice de pétrole. La §YMaison des Saoud§! doit choisir entre répression, accommodation, ou un changement fondamental de sa politique religieuse."
 SAU_rehabilitate_the_detainees: "Réhabiliter les détenus"
 SAU_rehabilitate_the_detainees_desc: "Libérez les prisonniers politiques de la province orientale et réintégrez-les dans la société saoudienne.\n\n§G-Résistance chiite, +Stabilité§!."
 SAU_shia_political_representation: "Représentation politique chiite"
 SAU_shia_political_representation_desc: "Des sièges au §YConseil de la Choura§! pour les chiites de la province orientale.\n\n§G-Résistance chiite, +Stabilité, +Population chiite§!."
 SAU_security_clampdown: "Tour de vis sécuritaire"
 SAU_security_clampdown_desc: "Inondez la province orientale de checkpoints, d'indicateurs et de forces d'intervention rapide.\n\n§R+Résistance chiite§!, §R-Population chiite§!, §G+Soutien à la guerre§!."
 SAU_sectarian_settlement: "Règlement sectaire"
 SAU_sectarian_settlement_desc: "Le Royaume a réglé la question chiite par la répression, l'accommodation ou la conversion, et peut désormais consolider la politique qui en résulte.\n\n§G+Stabilité, +Pouvoir politique§!."
 SAU_the_house_of_saud_embraces_shiaism: "La Maison des Saoud embrasse le chiisme"
 SAU_the_house_of_saud_embraces_shiaism_desc: "L'impensable : la §Yfamille royale§! adopte formellement le §Ychiisme duodécimain§!. Des siècles d'orthodoxie wahhabite sont renversés d'un décret. La §Yprovince orientale§! jubile ; le §YNajd§! et les §Yulémas§! vacillent.\n\n§G++Population chiite§!, §Grésistance terminée§!, §Radopter la foi chiite§!, §R-Stabilité§! (pour l'heure)."
 SAU_sunni_supremacy: "Suprématie sunnite"
 SAU_sunni_supremacy_desc: "Inscrivez la primauté sunnite dans la loi, les écoles et la mosquée. Il n'y a qu'une vraie foi dans le Royaume, et ce n'est pas la leur.\n\n§R-Population chiite§!, §G+Stabilité, +Soutien à la guerre§!."
 SAU_suppress_the_clerics: "Réprimer les clercs"
 SAU_suppress_the_clerics_desc: "Faites taire les prédicateurs enflammés de §YQatif§! et d'§YAwamiyah§! avant que leurs sermons ne deviennent des slogans.\n\n§R+Résistance chiite§!, §R-Population chiite§!."
 SAU_sunni_shia_tolerance: "Tolérance sunnite et chiite"
 SAU_sunni_shia_tolerance_desc: "Ni persécuter ni convertir — simplement coexister. Assouplissez les restrictions, laissez les chiites prier en paix, et laissez le Royaume respirer.\n\n§G-Résistance chiite, +Stabilité, +Population chiite§! (pas de changement de foi)."
 SAU_stir_the_axis_of_resistance: "Agiter l'Axe de la résistance"
 SAU_stir_the_axis_of_resistance_desc: "La force de l'Iran est une chaîne de proxies du Liban au Yémen, et chaque maillon a ses mécontents. Financez les protestations et les fractures qui transforment les alliés de Téhéran en fardeaux."
 SAU_foreign_volunteers_for_the_rebels: "Volontaires étrangers pour les rebelles"
 SAU_foreign_volunteers_for_the_rebels_desc: "L'argent seul ne gagnera pas la guerre. Ouvrez les filières qui amènent combattants et matériel par-delà les frontières jusqu'aux lignes de l'opposition."
 SAU_direct_intervention_in_yemen: "Intervention directe au Yémen"
 SAU_direct_intervention_in_yemen_desc: "Envoyez l'armée saoudienne. Une campagne directe promet une décision plus rapide et une victoire plus nette, et risque un bourbier qui saignera le Royaume pendant des années."
 SAU_a_proxy_war_in_yemen: "Une guerre par procuration au Yémen"
 SAU_a_proxy_war_in_yemen_desc: "Menez la guerre par procuration. Financez le gouvernement en exil, les milices du Sud et les tribus, et laissez les Yéménites mourir pendant que les jets saoudiens observent d'en haut."
 SAU_supreme_military_council: "Conseil militaire suprême"
 SAU_supreme_military_council_desc: "Le conseil militaire provisoire recevra une charte permanente et des règles d'adhésion formelles. Le grade déterminera l'appartenance, tandis que le commandement durant le coup continuera de façonner l'influence au sein du Conseil."
 SAU_the_amman_bailout: "Le sauvetage d'Amman"
 SAU_the_amman_bailout_desc: "Le Royaume hachémite est un tampon fragile contre le chaos au nord, et il est fauché. Maintenez la Jordanie solvable et loyale avec le chéquier du Royaume."
 SAU_the_battle_for_the_straits: "La bataille des détroits"
 SAU_the_battle_for_the_straits_desc: "Qui commande le détroit d'Ormuz commande un cinquième du pétrole mondial. Préparez le Royaume et ses alliés à briser l'emprise iranienne sur la voie d'eau la plus importante du monde."
 SAU_the_islamic_rivalry: "La rivalité islamique"
 SAU_the_islamic_rivalry_desc: "L'Iran promeut son modèle révolutionnaire et soutient des groupes armés du Liban au Yémen. L'Arabie saoudite disputera le leadership iranien par les médias, les partenaires régionaux et les préparatifs d'un possible conflit dans le Golfe."
 SAU_the_levant_strategy: "La stratégie du Levant"
 SAU_the_levant_strategy_desc: "La Syrie brûle et la Jordanie vacille, et au-delà s'ouvre la route vers la Méditerranée. Façonnez le Levant à l'avantage saoudien avant que l'Iran et ses amis ne le fassent."
 SAU_the_new_order_over_the_kingdom: "Le nouvel ordre sur le Royaume"
 SAU_the_new_order_over_the_kingdom_desc: "Le gouvernement d'urgence est devenu un ordre politique permanent. Les renouvellements répétés de l'autorité militaire ont effacé toute distinction pratique entre mesures temporaires et règle normale."
 SAU_the_silk_road_pivot: "Le pivot de la Route de la soie"
 SAU_the_silk_road_pivot_desc: "La Chine est le premier acheteur de brut saoudien et ne conditionne pas la coopération économique à une réforme politique intérieure. Les Nouvelles routes de la soie offrent ports, chemins de fer et capitaux, mais la relation reste surtout transactionnelle."
 SAU_the_silk_web_network: "Le réseau de la Toile de soie"
 SAU_the_silk_web_network_desc: "L'information est une arme, et le Royaume entend s'en servir. Tissez une toile de médias, de clercs et de voix en ligne qui porte le message de Riyad à travers la région."
 SAU_the_american_shield: "Le bouclier américain"
 SAU_the_american_shield_desc: "Liez irréversiblement la défense du Royaume aux États-Unis : bases, renseignement, et la garantie tacite qu'une attaque contre Riyad est une attaque contre les intérêts de Washington. Le prix est la dépendance à un seul protecteur."
 SAU_the_succession_question: "La question de la succession"
 SAU_the_succession_question_desc: "Des milliers de princes conservent statut et prétentions potentielles sous l'ancien ordre. Le gouvernement doit décider de les pensionner, les exiler, les poursuivre ou les marginaliser politiquement."
 SAU_the_spirit_of_taif: "L'esprit de Taëf"
 SAU_the_spirit_of_taif_desc: "L'accord de Taëf, négocié par les Saoudiens, mit jadis fin à la guerre civile libanaise et donna au Royaume une main à Beyrouth. Ravivez ce rôle et reprenez le Liban à l'orbite iranienne."
 SAU_the_yemen_quagmire: "Le bourbier yéménite"
 SAU_the_yemen_quagmire_desc: "La guerre au Yémen a été coûteuse, mais elle a aussi attiré l'Iran dans un piège, exposé comme le parrain des missiles houthistes qui tombent sur Riyad. Transformez le bourbier en arme diplomatique."
 SAU_the_yemeni_peace_talks: "Les pourparlers de paix yéménites"
 SAU_the_yemeni_peace_talks_desc: "Toute guerre finit à une table. Amenez les factions yéménites à des termes qui laissent la frontière sud du Royaume en sécurité."
 SAU_defeat_in_syria: "Défaite en Syrie"
 SAU_defeat_in_syria_desc: "Le régime tient, étayé par les jets russes et les milices iraniennes. Le Royaume doit couper ses pertes et sauver ce qu'il peut d'influence d'une guerre qu'il n'a pu gagner."
 SAU_total_victory_in_the_civil_war: "Victoire totale dans la guerre civile"
 SAU_total_victory_in_the_civil_war_desc: "Écrasez les Houthis net et rétablissez un gouvernement unique entièrement redevable à Riyad. Le Yémen devient un protectorat saoudien en tout sauf le nom."
 SAU_victory_in_syria: "Victoire en Syrie"
 SAU_victory_in_syria_desc: "Damas tombe, et avec lui le pont terrestre iranien vers le Hezbollah. Un gouvernement ami en Syrie ouvre le Levant à l'influence saoudienne et la Méditerranée aux oléoducs saoudiens."
 SAU_a_partnership_with_britain: "Un partenariat avec la Grande-Bretagne"
 SAU_a_partnership_with_britain_desc: "Des contrats Al-Yamamah à la formation des officiers saoudiens, Londres a été un ami plus discret mais plus constant que la plupart. Formalisez un partenariat stratégique avec le Royaume-Uni."
 SAU_benign_dominance: "Dominance bénigne"
 SAU_benign_dominance_desc: "Riyad mène d'une §Gmain plus légère§! : investissement, patronage, et respect de la dignité des petits émirats. L'hégémonie sans l'humiliation."
 SAU_command_and_control: "Commandement et contrôle"
 SAU_command_and_control_desc: "Un centre de commandement conjoint, une défense aérienne intégrée et un renseignement partagé donneront au Bouclier de la Péninsule une structure opérationnelle unifiée."
 SAU_common_market: "Marché commun"
 SAU_common_market_desc: "Un cadre réglementaire unique : un seul ensemble de normes, un seul document douanier, un marché régional de §Y50 millions de consommateurs§!."
 SAU_cross_border_transit_systems: "Systèmes de transit transfrontalier"
 SAU_cross_border_transit_systems_desc: "Autoroutes, chemins de fer et oléoducs tissent la péninsule. Le §Ychemin de fer du CCG§! — longtemps discuté, jamais construit — voit enfin le premier coup de pioche."
 SAU_economic_union: "Union économique"
 SAU_economic_union_desc: "Une §Yzone douanière§! unifiée, des réglementations harmonisées, et les fondations d'un §Ymarché commun§! à travers la péninsule. Les marchands de §YDjeddah§! et de §YDubaï§! ont attendu une génération."
 SAU_exploit_authority: "Autorité d’exploitation"
 SAU_exploit_authority_desc: "L'Arabie saoudite imposera son hégémonie par la §Ypression économique§! et d'autres mesures coercitives contre les États membres non conformes. L'Alliance fonctionnera comme un §Gbloc dominé par l'Arabie saoudite§!."
 SAU_the_gulf_cooperation_council: "Le Conseil de coopération du Golfe"
 SAU_the_gulf_cooperation_council_desc: "Depuis deux décennies, le §YCCG§! a surtout fonctionné comme un forum de consultation entre monarchies du Golfe. Riyad l'élargira en organisation régionale plus efficace."
 SAU_the_gulf_academy: "L'Académie du Golfe"
 SAU_the_gulf_academy_desc: "Une académie unifiée de formation des officiers à §YRiyad§!. Les futurs généraux de chaque État du CCG partageront une salle de classe, une doctrine, et une §Yloyauté à l'Alliance§!."
 SAU_increase_autonomy: "Accroître l'autonomie"
 SAU_increase_autonomy_desc: "Une §Ypolitique étrangère plus indépendante§!. Le CCG parle pour lui-même dans les forums internationaux - non comme client américain, mais comme §Ypuissance régionale§!.\n\n§YUne des trois voies pour le patron du Conseil§! - §YWashington§!, §Ynouveaux partenaires§!, ou §Yaucun§!. Elles s'ouvrent dans cet ordre : on ne peut se tourner vers de nouveaux partenaires que lorsque les Américains vous ont §Rrefusé§!, et n'aller seul que lorsque les deux l'ont fait. §RChaque voie empruntée ferme définitivement celles au-dessus.§!\n§YL'une des trois voies pour le patron du Conseil§! — §YWashington§!, §Yde nouveaux partenaires§!, ou §Yaucun du tout§!. Elles s'ouvrent dans cet ordre : on ne se tourne vers de nouveaux partenaires qu'une fois que les Américains ont §Rrefusé§!, et on ne va seul qu'une fois les deux tentés. §RChaque voie empruntée ferme définitivement celles qui sont au-dessus.§!"
 SAU_intra_gcc_trade: "Commerce intra-CCG"
 SAU_intra_gcc_trade_desc: "Lever les dernières barrières tarifaires entre États membres. Biens, capitaux et main-d'œuvre circulent librement de §YMascate§! à §YKoweït City§!."
 SAU_joint_defense_agreement: "Accord de défense commune"
 SAU_joint_defense_agreement_desc: "Un pacte de défense mutuelle de type §Yarticle 5§! : une attaque contre l'un est une attaque contre tous. §YL'Iran§! le remarque."
 SAU_joint_research_initiatives: "Initiatives de recherche conjointes"
 SAU_joint_research_initiatives_desc: "Un §Yfonds technologique§! partagé met en commun les ressources pour le dessalement, le solaire et la R&D pétrochimique. §YKAUST§! devient le pôle régional."
 SAU_gcc_joint_ventures: "Coentreprises du CCG"
 SAU_gcc_joint_ventures_desc: "Le CCG coordonnera production de défense, achats et maintenance. Le capital saoudien, la §Ylogistique émiratie§! et les §Ychantiers bahreïnis§! soutiendront un système militaro-industriel partagé."
 SAU_the_khaleeji_union: "L'Union khaleeji"
 SAU_the_khaleeji_union_desc: "Les six monarchies formeront une confédération avec une autorité partagée sur la politique étrangère, la défense et la monnaie. L'§YUnion khaleeji§! sera dirigée depuis §YRiyad§!."
 SAU_military_union: "Union militaire"
 SAU_military_union_desc: "Le §YBouclier de la Péninsule§! existe depuis 1984 mais n'a qu'une intégration pratique limitée. Riyad établira un commandement conjoint, des achats partagés et une doctrine commune."
 SAU_new_partners: "Nouveaux partenaires"
 SAU_new_partners_desc: "Au-delà de Washington : des accords avec §YPékin§!, §YMoscou§!, §YDelhi§! et §YBruxelles§!. La péninsule diversifie ses patrons.\n\n§YUne des trois voies pour le patron du Conseil§! - §YWashington§!, §Ynouveaux partenaires§!, ou §Yaucun§!. Elles s'ouvrent dans cet ordre : on ne peut se tourner vers de nouveaux partenaires que lorsque les Américains vous ont §Rrefusé§!, et n'aller seul que lorsque les deux l'ont fait. §RChaque voie empruntée ferme définitivement celles au-dessus.§!\n§YL'une des trois voies pour le patron du Conseil§! — §YWashington§!, §Yde nouveaux partenaires§!, ou §Yaucun du tout§!. Elles s'ouvrent dans cet ordre : on ne se tourne vers de nouveaux partenaires qu'une fois que les Américains ont §Rrefusé§!, et on ne va seul qu'une fois les deux tentés. §RChaque voie empruntée ferme définitivement celles qui sont au-dessus.§!"
 SAU_political_union: "Union politique"
 SAU_political_union_desc: "Une politique étrangère coordonnée. Une ligne diplomatique partagée. Les petits émirats craignent la §Ydomination saoudienne§! — mais Riyad insiste : c'est un partenariat d'§Yégaux parmi les monarques§!."
 SAU_solidify_pro_american_alignment: "Solidifier l’alignement pro-américain"
 SAU_solidify_pro_american_alignment_desc: "Le §YCCG§! formalise son partenariat de sécurité avec Washington. Bases, formation, armes, renseignement - tout transite par Riyad.\n\n§YUne des trois voies pour le patron du Conseil§! - §YWashington§!, §Ynouveaux partenaires§!, ou §Yaucun§!. Elles s'ouvrent dans cet ordre : on ne peut se tourner vers de nouveaux partenaires que lorsque les Américains vous ont §Rrefusé§!, et n'aller seul que lorsque les deux l'ont fait. §RChaque voie empruntée ferme définitivement celles au-dessus.§!\n§YL'une des trois voies pour le patron du Conseil§! — §YWashington§!, §Yde nouveaux partenaires§!, ou §Yaucun du tout§!. Elles s'ouvrent dans cet ordre : on ne se tourne vers de nouveaux partenaires qu'une fois que les Américains ont §Rrefusé§!, et on ne va seul qu'une fois les deux tentés. §RChaque voie empruntée ferme définitivement celles qui sont au-dessus.§!"
 SAU_pursue_hegemony: "Poursuivre l’hégémonie"
 SAU_pursue_hegemony_desc: "Riyad remplacera le leadership informel par une autorité directe sur les autres monarchies du CCG. Elles pourront objecter, mais la pression économique et militaire saoudienne limitera leur capacité à résister."
 SAU_a_robust_alliance: "Une alliance robuste"
 SAU_a_robust_alliance_desc: "Le §YBouclier de la Péninsule§! deviendra une force opérationnelle de 100 000 hommes, avec un équipement moderne et une doctrine unifiée."
 SAU_shared_currency: "Devise partagée"
 SAU_shared_currency_desc: "Le §Ydinar khaleeji§! — une monnaie unique pour le CCG, indexée non sur le dollar mais sur un panier. Le pas économique le plus audacieux que la péninsule ait jamais franchi."
 SAU_the_yemeni_civil_war: "La guerre civile yéménite"
 SAU_the_yemeni_civil_war_desc: "Les Houthis ont saisi la capitale et chassé le gouvernement reconnu en exil, et un point d'appui iranien s'enracine au seuil de l'Arabie. Le Royaume doit décider jusqu'où il ira pour l'inverser."
 SAU_sabotage_the_regimes_backers: "Saboter les soutiens du régime"
 SAU_sabotage_the_regimes_backers_desc: "Pour chaque arme que le Royaume envoie, Téhéran et Moscou en envoient deux. Agir dans l'ombre pour perturber les lignes d'approvisionnement et les proxys qui étayent Damas."
 SAU_the_national_industrial_strategy_gdp_tt: "Le §YPIB§! national dépasse §G1 500 milliards $§!"
 SAU_stc_privatization_gdp_tt: "Le §YPIB§! national dépasse §G1 500 milliards $§!"
 SAU_kaust_gdp_tt: "Le §YPIB§! national dépasse §G1 600 milliards $§!"
 SAU_the_gulfs_economic_engine_gdp_tt: "Le §YPIB§! national dépasse §G1 500 milliards $§!"
 SAU_the_worlds_most_valuable_company_gdp_tt: "Le §YPIB§! national dépasse §G1 800 milliards $§!"
 SAU_vision_2030_gdp_tt: "Le §YPIB§! national dépasse §G1 600 milliards $§!"
 SAU_sdaia_data_and_artificial_intelligence_gdp_tt: "Le §YPIB§! national dépasse §G2 000 milliards $§!"
 SAU_the_civil_nuclear_program_gdp_tt: "Le §YPIB§! national dépasse §G1 700 milliards $§!"
 SAU_fund_vision_2030_gdp_tt: "Le §YPIB§! national dépasse §G1 800 milliards $§!"
 SAU_the_dynamic_tiering_formula: "La formule de palier dynamique"
 SAU_the_dynamic_tiering_formula_desc: "Un quota qui signifie une chose pour une firme de neuf mille et une autre pour une firme de neuf ne peut être un seul chiffre. La formule fait varier l'exigence avec les effectifs, le chiffre d'affaires et le secteur, et la recalcule chaque trimestre.\n\nLes firmes cessent de jouer le seuil en se scindant en deux."
 SAU_high_green_zone_incentives: "Incitations aux zones vertes élevées"
 SAU_high_green_zone_incentives_desc: "Sous le platine se trouve la bande où vivent réellement la plupart des employeurs sérieux du Royaume. Ils sont conformes, ils ne sont pas exceptionnels, et jusqu'ici le système ne leur donnait rien pour cela.\n\nTraitement prioritaire et calendrier d'audit allégé, sur la théorie que récompenser les presque conformes coûte moins cher que de les punir."
 SAU_the_yellow_band_warnings: "Les avertissements de la bande jaune"
 SAU_the_yellow_band_warnings_desc: "Une firme en jaune se voit dire, par écrit et avec une date, exactement de combien elle manque et ce qui se passe à la clôture du trimestre.\n\nLa plupart s'y conforment. L'avertissement coûte au ministère une lettre et lui épargne un gel."
 SAU_the_secularization_of_finance_choice_tt: "§YUn choix suit§! - « Plein anglo-saxon - tous les instruments autorisés » / « Graduel - pratique occidentale avec un vernis de charia »."
 SAU_bastion_of_islamic_finance_choice_tt: "§YUn choix suit§! - « Orthodoxie stricte - aucun compromis » / « Pragmatique - diriger le marché mondial de la finance islamique »."
 SAU_the_banking_control_law_choice_tt: "§YUn choix suit§! - « SAMA - régulateur laïc indépendant » / « SAMA + conseil de la charia avec veto contraignant » / « Hybride - deux structures parallèles »."
 SAU_the_interbank_lending_code_choice_tt: "§Le choix YA suit§! - « Marché interbancaire conventionnel basé sur les intérêts » / « Marché interbancaire islamique basé sur la Mourabaha » / « Hybride – les deux fonctionnent séparément »."
 SAU_the_anti_speculation_directives_choice_tt: "§YUn choix suit§! - « Régulation légère - autoriser dérivés et futures » / « Interdiction stricte - pas de gharar, pas de jeu » / « Dérivés réglementés seulement - approche équilibrée »."
 SAU_fractional_reserve_mandates_choice_tt: "§YUn choix suit§! - « Réserve fractionnaire moderne - croissance au prix de la stabilité » / « Uniquement adossé à des actifs - stable mais plus lent » / « Exigences de réserve modérées »."
 SAU_the_standardized_interest_law_choice_tt: "§YUn choix s'ensuit§! - 'Autoriser les comptes à intérêts classiques' / 'Interdiction stricte du riba - la charia est suprême' / 'Sukuk en public, intérêt pragmatique en privé'."
 SAU_conscript_the_kingdom_choice_tt: "§YUn choix suit§! - « Service universel. Tout homme en âge, aucune exemption » / « Service sélectif. Les tribus gardent leurs exemptions ». Cela déplace §Hl'emprise des officiers sur l'État et la légitimité de la junte§!."
 SAU_emergency_tribunal_choice_tt: "§YUn choix suit§! - « Les princes. Que le pays les voie rendre des comptes » / « Les dissidents. Les dossiers sont déjà écrits » / « Les deux. Nous n'avons pas saisi l'État pour être sélectifs ». Cela déplace §Hl'emprise des officiers sur l'État et la légitimité de la junte§!."
 SAU_the_defense_industries_act_choice_tt: "§YUn choix suit§! - « Licencier les modèles. Nous avons besoin de production, pas d'orgueil » / « Le bâtir nous-mêmes, depuis le minerai ». Cela déplace §Hl'emprise des officiers sur l'État et la légitimité de la junte§!."
 SAU_martial_law_issues_choice_tt: "§YUn choix suit§! - « L'appareil complet. Couvre-feu, tribunaux, censeurs » / « Pouvoirs d'urgence seulement. Laisser les rues tranquilles ». Cela déplace §Hl'emprise des officiers sur l'État et la légitimité de la junte§!."
 SAU_the_regency_decree_choice_tt: "§YUn choix suit§! - « Une régence étroite. Il garde le trône et les Mosquées » / « Une régence totale. Tous les pouvoirs, sans exception » / « Une régence de cinq ans. Mettre une date dessus ». Cela déplace §Hl'emprise des officiers sur l'État et la légitimité de la junte§!."
 SAU_the_succession_question_choice_tt: "§YUn choix suit§! - « Les pensionner, généreusement et pour toujours » / « Exiler les lignées aînées » / « Poursuivre, et confisquer ce que l'on trouve » / « Les laisser riches et ornementaux ». Cela déplace §Hl'emprise des officiers sur l'État et la légitimité de la junte§!."
 SAU_the_silk_road_pivot_choice_tt: "§YUn choix suit§! - « Ports, rail et le corridor nord » / « Du capital, sans conditions ». Cela déplace §Hl'emprise des officiers sur l'État et la légitimité de la junte§!."
 SAU_guardians_of_the_two_mosques_choice_tt: "§YUn choix suit§! - « Se tenir derrière le roi. Emprunter le titre, ne pas le prendre » / « La tutelle appartient à l'État, pas à l'homme ». Cela déplace §Hl'emprise des officiers sur l'État et la légitimité de la junte§!."
 SAU_secure_support_in_the_al_madinah_province_choice_tt: "§YUn choix suit§! - « Les courtiser. Concéder ce qu'il faut concéder » / « Réattribuer les chaires. Nous avons besoin du libellé maintenant ». Cela déplace §Hl'emprise des officiers sur l'État et la légitimité de la junte§!."
 SAU_secure_support_in_the_mecca_province_choice_tt: "§YUn choix suit§! - « Payer les maisons marchandes. Acheter le Hedjaz proprement » / « Y mettre garnison. Ils s'adapteront ». Cela déplace §Hl'emprise des officiers sur l'État et la légitimité de la junte§!."
 SAU_appoint_loyalists_in_the_provinces_choice_tt: "§YUn choix suit§! - « Les princes aînés. Leurs noms portent encore le pays » / « Les cousins oubliés. La gratitude coûte moins cher que le prestige » / « Les mécontents fortunés. Les faire entrer et les auditer plus tard ». Cela déplace §Hl'emprise des officiers sur l'État et la légitimité de la junte§!."
 SAU_disband_the_national_guard_choice_tt: "§YUn choix suit§! - « Les absorber. Ils peuvent porter notre uniforme » / « Dissoudre entièrement la Garde. Les renvoyer chez eux » / « Garder un reliquat, sous notre commandement ». Cela déplace §Hl'emprise des officiers sur l'État et la légitimité de la junte§!."
 SAU_the_riyadh_meeting_operation_decisive_storm_choice_tt: "§YUn choix suit§! - « Alors c'est convenu. Posez-leur la question à tous » / « Le Royaume répondra au Yémen seul »."
 SAU_the_oil_defense_strategy_choice_tt: "§YUn choix suit§! - « Pomper. Les champs sont la stratégie » / « Bâtir l'industrie qui survit aux puits » / « Prospecter. Il y en a davantage là-dehors »."
 SAU_women_in_the_shura_council_choice_tt: "§YUn choix suit§! - « Trente sièges, par décret royal » / « La chambre reste telle qu'elle est »."
 SAU_hold_municipal_elections_choice_tt: "§YUn choix suit§! - « La moitié des sièges, et les hommes sur les listes » / « Les nommer tous et appeler cela consultation » / « Inscrire aussi les femmes sur les listes »."
 SAU_counter_terrorism_cooperation_choice_tt: "§YUn choix suit§! - « Prendre l'offre de Washington en entier » / « Le Mabahith s'occupera des siens » / « Les réhabiliter. Les prisons n'en font que davantage »."
 SAU_al_saud_national_dialogue_choice_tt: "§YUn choix suit§! - « Qu'ils parlent, et publier ce qu'ils disent » / « Ils peuvent se réunir. L'ordre du jour est le nôtre »."
 SAU_consolidating_the_crown_choice_tt: "§YUn choix suit§! - « Laisser le Conseil d'allégeance statuer sur la succession » / « Le roi nomme son héritier. Le Conseil l'applaudira » / « Acheter plutôt le consentement de la famille »."
 SAU_a_new_kingdom_choice_tt: "§YUn choix suit§! - « Réformer autant que les ministères le supporteront » / « Seul le nom sur les décrets a changé » / « Ouvrir l'économie et laisser la politique suivre »."
 SAU_the_global_ummah_question_choice_tt: "§YUn choix suit§! - « Les Mosquées sont un devoir, pas un mandat » / « Nous parlons pour les fidèles ». Cela déplace §Hle cours du Royaume à l'étranger§!."
 SAU_reclaim_the_oic_leadership_choice_tt: "§Le choix YA suit§! - « Financez-le » / « Personnellez-le »."
 SAU_the_expatriate_workforce_question_choice_tt: "§YUn choix suit§! - « Les renvoyer chez eux » / « Naturaliser les utiles ». Cela déplace §Hle cours du Royaume à l'étranger§!."
 SAU_islamic_solidarity_conference_choice_tt: "§YUn choix s'ensuit§! - 'La convoquer à La Mecque' / 'La convoquer à l'étranger'."
 SAU_the_sovereign_aid_question_choice_tt: "§YUn choix suit§! - « L'aumône, donnée librement » / « L'aide avec conditions ». Cela déplace §Hle cours du Royaume à l'étranger§!."
 SAU_the_domestic_supply_quota_choice_tt: "§Le choix YA suit§! - « Un quota strict » / « Un quota progressif »."
 SAU_the_foreign_wealth_question_choice_tt: "§YUn choix suit§! - « Tout ramener au pays » / « Le laisser là où il rapporte ». Cela influe sur §Hle cap du Royaume à l'étranger§!."
 SAU_eradicate_foreign_dependency_choice_tt: "§YUn choix suit§! - « Les armes d'abord » / « Tout le reste d'abord »."
 SAU_the_superpower_engagement_question_choice_tt: "§YUn choix suit§! - « Le mandat d'autosuffisance » / « L'équidistance armée ». Cela déplace §Hle cours du Royaume à l'étranger§!."
 SAU_the_international_forums_question_choice_tt: "§YUn choix suit§! - « Se retirer de ce que nous n'avons pas écrit » / « Les travailler de l'intérieur ». Cela déplace §Hle cours du Royaume à l'étranger§!."
 SAU_the_spirit_of_73_choice_tt: "§YUn choix suit§! - « Menacer l'embargo ouvertement » / « L'appliquer en silence »."
 SAU_the_fortress_kingdom_choice_tt: "§YUn choix suit§! - « Fortifier la côte » / « Fortifier l'intérieur »."
 SAU_the_national_cadre_initiative_choice_tt: "§YUn choix suit§! - « Instituts techniques » / « Académies militaires »."
 SAU_the_sovereign_civil_service_choice_tt: "§YUn choix s'ensuit§! - 'Nommer par concours' / 'Nommer par loyauté'."
 SAU_centralization_of_the_provincial_emirates_choice_tt: "§YUn choix suit§! - « Racheter leurs chartes » / « Les remplacer tout de go »."
 SAU_the_foreign_bases_question_choice_tt: "§YUn choix suit§! - « Abaisser les couleurs étrangères. Ils rentrent » / « L'arrangement tient. La nécessité permet ce que le principe interdit »."
 SAU_purge_the_westernized_elite_choice_tt: "§YUn choix suit§! - « Les exiler » / « Les rééduquer »."
 SAU_the_closed_frontier_choice_tt: "§YUn choix suit§! - « La sceller entièrement » / « Admettre ceux dont nous avons besoin »."
 SAU_ban_foreign_media_choice_tt: "§YUn choix suit§! - « Brouiller les satellites » / « Acheter les réseaux »."
 SAU_the_virtue_committees_return_choice_tt: "§YUn choix suit§! - « Qu'ils patrouillent en force » / « Les garder en rôle consultatif »."
 SAU_increase_the_ulemas_authority_choice_tt: "§YUn choix suit§! - « Leur donner les tribunaux » / « Leur donner les écoles »."
 SAU_the_faisalite_resurgence_choice_tt: "§YUn choix suit§! - « Le proclamer de la chaire » / « Le proclamer du palais »."
 SAU_the_2007_legal_reforms_choice_tt: "§YUn choix suit§! - « Le cadre anglo-saxon » / « Le cadre charia d'abord » / « Un modèle hybride »."
 SAU_royal_decree_m_30_capital_market_law_choice_tt: "§YUn choix s'ensuit§! - 'Technocrates indépendants' / 'La supervision royale est essentielle' / 'Faire appel à des experts étrangers'."
 SAU_establish_corruption_courts_choice_tt: "§YLe règne est refaçonné§! - les tribunaux réduisent la corruption, et l'impôt et le pouvoir politique montent avec. §RLes investisseurs intègrent le nouveau risque§!, et les accusés ont des amis."
 SAU_the_ritz_carlton_purge_choice_tt: "§YLe règne est refaçonné§! - la purge achète du pouvoir politique, une corruption moins chère et un meilleur renseignement. §RLe capital étranger y voit une expropriation§! et tarife le Royaume en conséquence."
 SAU_backdoor_deals_choice_tt: "§YLe règne est refaçonné§! - rendements, revenus de marché et investissement s'améliorent tous. §RLa corruption s'approfondit deux fois§!, et la cour le paie en pouvoir politique."
 SAU_new_partners_choice_tt: "§YUn choix suit§! - le Conseil choisit un garant hors du Golfe : « Turquie » / « Iran » / « Inde » / « Pakistan » / « Russie ». Celui qui est choisi est prié de répondre."
 SAU_the_khaleeji_union_choice_tt: "§GLe Golfe devient un seul État§! - chaque membre restant du CCG est §Hannecté avec ses forces§!, ses terres sont cœurs, et le Royaume prend le nom de §HKhaleej§!."
 SAU_ras_al_khair_complex: "Complexe Ras Al-Khair"
 SAU_ras_al_khair_complex_desc: "Sur la côte du Golfe au nord de Jubail, le Royaume coule le béton d'un complexe de dessalement et d'électricité à une échelle que personne n'a tentée. Argent d'État, terre d'État et main-d'œuvre d'État, et il tournera encore quand les signataires seront partis.\n\n§GConstruit une centrale fossile et des infrastructures à Hasa§! et calme le pays.\n\n§RCoûte 60 milliards§!. Bâti par le Royaume, possédé par le Royaume."
 SAU_the_shuaibah_iwpp: "L'IWPP de Shuaibah"
 SAU_the_shuaibah_iwpp_desc: "Au sud de Djeddah, un consortium prend l'usine d'eau et d'électricité à son bilan et revend la production au Royaume sous contrat de vingt ans. C'est moins cher, plus rapide, et le compteur se lit dans une autre capitale.\n\n§GConstruit une centrale fossile et des infrastructures énergétiques au Hedjaz§!.\n\n§RCoûte 30 milliards et approfondit l'influence américaine§!. La moitié du prix, et pas tout à fait à vous."
 SAU_the_sovereign_saudi_water_company: "La Compagnie souveraine saoudienne des eaux"
 SAU_the_sovereign_saudi_water_company_desc: "Qui qu'ait posé le tuyau, le Royaume met désormais une seule société souveraine au-dessus de tout : tarifs, réserves, allocation entre provinces. Pour la première fois, un bureau peut répondre à la question « combien d'eau a le Royaume ».\n\n§GOuvre les Eaux souveraines§!, le standing hydrique du Royaume, et accorde du pouvoir politique.\n\nCela ne fait pas l'eau. Cela rend le Royaume responsable d'elle."
 SAU_throttle_pipeline_yemen: "Étrangler le pipeline de la mer d'Arabie"
 SAU_throttle_pipeline_yemen_desc: "Ramener la ligne sud d'un palier. Nous expédions moins et gagnons moins - mais le droit de transit de Sanaa chute avec, et ils sentiront l'étau bien avant nous."
 SAU_throttle_pipeline_syria: "Étrangler le pipeline du Levant"
 SAU_throttle_pipeline_syria_desc: "Ramener la ligne méditerranéenne d'un palier. Amman et Damas prennent tous deux une part moindre, et tous deux se voient rappeler à qui appartient le brut qui remplit le tuyau."
 SAU_throttle_pipeline_iraq: "Étrangler le pipeline vers l'Europe"
 SAU_throttle_pipeline_iraq_desc: "Ramener la ligne nord d'un palier. La redevance de Bagdad se réduit d'autant - une pression sans fermer tout à fait les vannes."
 SAU_tt_pipeline_shutdown_dependence: "§GRéduit la dépendance pétrolière.§! La ligne fermée, le Royaume s'appuie moins sur l'exportation de brut."
 SAU_shutdown_pipeline_yemen: "Fermer le pipeline de la mer d'Arabie"
 SAU_shutdown_pipeline_yemen_desc: "Fermer les vannes à Al Mahrah. Les recettes d'exportation s'arrêtent, mais aussi les droits de transit que nous versons à Sanaa - et le Yémen ne pardonnera pas d'être coupé."
 SAU_shutdown_pipeline_syria: "Fermer le pipeline du Levant"
 SAU_shutdown_pipeline_syria_desc: "Fermer la ligne méditerranéenne. Amman et Damas perdent tous deux leurs droits de transit, et tous deux se souviendront de qui a arrêté les pompes."
 SAU_shutdown_pipeline_iraq: "Fermer le pipeline vers l'Europe"
 SAU_shutdown_pipeline_iraq_desc: "Fermer le tronc nord. L'extension turque n'a plus rien à porter et s'arrête avec ; Bagdad et Ankara perdent tous deux leurs redevances."
 SAU_shutdown_pipeline_turkey: "Fermer l'extension turque"
 SAU_shutdown_pipeline_turkey_desc: "Cesser de pomper au-delà de la frontière irakienne. Le tronc reste ouvert - seule Ankara perd sa part, et Ankara le remarquera."
 SAU_events.355.a: "Approuver la vente."
 SAU_events.355.b: "Décliner la demande."
 SAU_events.355.desc: "Riyad veut le Paladin, et le veut en nombre. Le Royaume tire de l'américain 155 mm depuis les années 1970, si bien que les équipages, le calibre et toute la chaîne de direction de tir sont déjà nôtres ; ce qu'ils achètent, c'est la tourelle numérique qui permet à une batterie de tirer et de se déplacer avant que le radar de contre-batterie ne réponde. Les Saoudiens paieront cash et à l'heure, et l'accord tient un concurrent hors d'un parc de canons que nous tenons depuis trente ans. Cela met aussi nos obusiers à portée d'une guerre de frontière que nous ne contrôlons pas."
 SAU_events.355.t: "Demande saoudienne d'artillerie américaine"
 SAU_events.356.a: "Approuver la vente."
 SAU_events.356.b: "Décliner la demande."
 SAU_events.356.desc: "Une demande inhabituelle est arrivée de Riyad : les Saoudiens veulent le Msta-S. Le Royaume n'a jamais acheté un canon russe, et ses artilleurs ont passé toute leur carrière sur des calibres occidentaux, si bien que le dossier pratique est mince. Le dossier politique ne l'est pas. Vendre à l'armée la mieux financée du Golfe fendrait un marché que Washington tient pour fermé depuis l'embargo pétrolier, et chaque autre capitale du Golfe remarquerait de quel côté Riyad a regardé."
 SAU_events.356.t: "Demande saoudienne d'artillerie russe"
 SAU_events.357.a: "Approuver la vente."
 SAU_events.357.b: "Décliner la demande."
 SAU_events.357.desc: "Riyad a demandé le CAESAR, et pour une fois l'argument se rédige tout seul. Un canon monté sur camion franchit les distances du Royaume par ses propres moyens, n'a besoin d'aucun transporteur, et peut être remis en route une minute après le dernier coup. Les Saoudiens ont vu ce qu'un obusier à roues fait sur leur frontière sud et en ont tiré la conclusion évidente. La commande tiendrait la ligne de Roanne au chaud des années et lierait Riyad aux obus, aux tubes et aux techniciens français."
 SAU_events.357.t: "Demande saoudienne d'artillerie française"
 SAU_events.358.a: "Approuver la vente."
 SAU_events.358.b: "Décliner la demande."
 SAU_events.358.desc: "Les Saoudiens veulent le PzH 2000, ce qui est flatteur et gênant à parts égales. C'est le plus bel obusier du monde et tout le métier le sait ; c'est aussi la raison pour laquelle le Bundestag passera quinze jours à discuter de l'endroit où ces canons aboutiront. Le Royaume est un client payant avec une guerre sur sa frontière sud, et la licence doit être signée par un gouvernement qui a promis d'être prudent précisément là-dessus. L'industrie veut la commande. La coalition peut ne pas survivre à l'accorder."
 SAU_events.358.t: "Demande saoudienne d'artillerie allemande"
 SAU_events.364.a: "Approuver la vente."
 SAU_events.364.b: "Décliner la demande."
 SAU_events.364.desc: "Riyad demande le M270, et ce n'est pas une autre vente d'artillerie. Un lanceur qui pose l'équivalent d'un bataillon d'acier sur un carreau de grille en moins d'une minute est une arme stratégique, et les roquettes qu'il tire sont à nous de fournir ou de retenir tant que le Royaume possède les lanceurs. C'est un levier, et c'est aussi une exposition : quoi que ces lanceurs servent, on le rapportera avec notre drapeau sur la caisse."
 SAU_events.364.t: "Demande saoudienne d'artillerie-roquettes américaine"
 SAU_events.365.a: "Approuver la vente."
 SAU_events.365.b: "Décliner la demande."
 SAU_events.365.desc: "Riyad a demandé d'acheter le Smerch, et la demande nous dit plus que la commande ne rapporterait. Personne ne vend un lanceur de 300 mm à un pays qui peut acheter américain, à moins que ce pays n'ait été refusé. Le Royaume veut une portée qu'il ne peut obtenir à Washington, et il est prêt à venir à Moscou la trouver. Les canons sont une bonne vente. Le précédent en est une meilleure."
 SAU_events.365.t: "Demande saoudienne d'artillerie-roquettes russe"