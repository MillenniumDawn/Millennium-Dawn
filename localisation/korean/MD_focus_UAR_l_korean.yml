l_korean:
 form_UAR_category: "아랍의 통일"
 form_UAR_category_desc: "\n£LBA_desctext_federation\n\n\n\nSince the early 1900s, some people have had a dream of uniting the Arabs under a single state. None have been so strong in the idea as the Ba'athists, supporters of an anti-colonial Arab socialist and nationalist movement. Several attempts were made to unite various Arab countries during the Cold War, but all of these failed due to political disagreements. Today, the Ba'athist movement is separated into two camps; a pro-Syrian (neo-Ba'athist) faction and a pro-Iraqi faction."
 UAR_announce_neo_baathist_uar: "아랍 공화국 연방의 창설을 발표하기"
 UAR_announce_neo_baathist_uar_desc: "아랍 세계에서 지배적인 지위를 확보하였으니, 이제 다른 아랍 국가들로 우리 바트당 민족 지도부의 영향력을 확대하기 시작하는 것이 현명할 것입니다."
 UAR_announce_baathist_uar: "아랍 연합 공화국의 건국을 선언하기"
 UAR_announce_baathist_uar_desc: "아랍 세계에서 지배적인 지위를 확보하였으니, 이제 다른 아랍 국가들로 우리 바트당 민족 지도부의 영향력을 확대하기 시작하는 것이 현명할 것입니다."
 UAR_invite_country_neo_baathist_uar: "[FROM.GetNameDef]을(를) [ROOT.GetNameDef]에 초청"
 UAR_invite_country_baathist_uar: "[FROM.GetNameDef]을(를) [ROOT.GetNameDef]에 초청"
 UAR_country_leaves_neo_baathist_uar: "[FROM.GetNameDef], 분리 독립 위협"
 UAR_country_leaves_neo_baathist_uar_desc: "최근 [FROM.GetNameDef] 정부에 대한 우리의 영향력이 줄어들고 있습니다. [FROM.GetAdjective] 사람들은 더 이상 우리의 아랍 통일 목표가 자신들과 부합한다고 느끼지 않습니다. 이들을 다시 우리 품으로 데려와야 합니다."
 UAR_country_leaves_baathist_uar: "[FROM.GetNameDef], 분리 독립 위협"
 UAR_country_leaves_baathist_uar_desc: "최근 [FROM.GetNameDef] 정부에 대한 우리의 영향력이 줄어들고 있습니다. [FROM.GetAdjective] 사람들은 더 이상 우리의 아랍 통일 목표가 자신들과 부합한다고 느끼지 않습니다. 이들을 다시 우리 품으로 데려와야 합니다."
 UAR_neo_baathist_uar_falls_apart: "[ROOT.GetNameDef]의 붕괴"
 UAR_neo_baathist_uar_falls_apart_desc: "현 정권은 더 이상 통일 아랍 국가라는 과거의 꿈을 지지하지 않습니다. 아랍 형제들이 우리에 대한 믿음을 잃는 것은 시간문제입니다."
 UAR_campaign_for_arab_unity: "[FROM.GetNameWithFlag]에서의 아랍 통합 캠페인"
 UAR_campaign_for_arab_unity_desc: "아랍 국가들에서 아랍 민족주의는 수십 년 동안 그다지 강하지 않았습니다. 선전 및 영향력 캠페인을 벌여 적대적인 제국주의에 맞서려면 단결해야 한다고 아랍 형제들을 설득할 수 있습니다."
 UAR_unite_neo_baathist_uar: "아랍 통일을 선포하라!"
 UAR_unite_neo_baathist_uar_desc: "때가 왔습니다! 우리는 아랍 형제들 가운데 지배적인 국가이며, 이제 모든 아랍인을 다스릴 우리의 권리를 되찾는 일을 그 무엇도 막을 수 없습니다. 일부는 저항하겠지만 짓밟힐 것입니다!"
 UAR_unite_baathist_uar: "아랍 통일을 선포하라!"
 UAR_unite_baathist_uar_desc: "때가 왔습니다! 우리는 아랍 형제들 가운데 지배적인 국가이며, 이제 모든 아랍인을 다스릴 우리의 권리를 되찾는 일을 그 무엇도 막을 수 없습니다. 일부는 저항하겠지만 짓밟힐 것입니다!"
