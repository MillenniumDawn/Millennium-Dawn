 Rec_tank_6: "Лёгкий танк 2045 года"
 Rec_tank_6_desc: "Лёгкие танки, основа армий Второй мировой войны, теперь применяются лишь во второстепенных ролях — там, где масса и размеры основных боевых танков не позволяют их использовать. Лёгкие танки состоят на вооружении наиболее тяжело бронированных разведывательных подразделений; кроме того, их можно десантировать с воздуха, и они часто используются как плавающие. Нередко их создают на базе корпусов БМП, а не разрабатывают с нуля. В сложной местности, например в горах и лесах, они действуют гораздо лучше основных боевых танков."
