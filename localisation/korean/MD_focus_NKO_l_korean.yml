 NKO_naval_mobilize_nampo_shipyards_tt: "조선소 작업이 끝나면 해군 증강 포인트: §G+2§!  (보유 §Y[?NKO_naval_points|0]§!)"
 NKO_naval_juche_drive_tt: "해군 증강 포인트: §G+4§! (보유 §Y[?NKO_naval_points|0]§!)"
