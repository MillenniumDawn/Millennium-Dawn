ast_international_missions: "International Missions"
ast_international_missions_desc: "Our doctrine represents a flexibility to explore new opportunities we deem fruitful, while respecting the old ones. Australia is at the precipice of a brilliant new future. We just need to give it a little push."
aus_us_visit: "State visit to America"
aus_china_visit: "State visit to China"
