 CHI_local_government_debt: "Deuda de los gobiernos locales"
 CHI_local_government_debt_desc: "Los gobiernos provinciales y municipales no pueden endeudarse abiertamente, por lo que recaudan dinero a través de vehículos de financiación que comprometen futuras ventas de tierras contra préstamos bancarios y bonos. Los ingresos financian las fábricas, los parques empresariales y las infraestructuras que recompensan las evaluaciones de los cuadros, y cada proyecto que va más allá de lo que el sistema fiscal puede soportar se suma a una pila de deuda que el gobierno central nunca ha garantizado formalmente. Los bancos renuevan los préstamos en lugar de condonarlos, los intereses absorben una parte creciente de los presupuestos locales y el verdadero tamaño de los pasivos permanece oculto en productos de fideicomiso y préstamos fuera de balance. Cuando Pekín se ve obligado a desapalancarse, el crédito se endurece, la construcción se estanca y el modelo de crecimiento basado en los ingresos por tierras prestadas comienza a desmoronarse.\n§W--------------§!\nLa presión de la deuda local aumenta cada mes mientras nuestras fábricas y parques de oficinas superen la tolerancia fiscal, y disminuye lentamente cuando no es así. Enfoques como §Y$CHI_shadow_banking_cleanup$§!, §Y$CHI_three_red_lines_crackdown$§! y §Y$CHI_common_prosperity$§! reducen la presión; enfoques como §Y$CHI_policy_banks_cdb$§! y §Y$CHI_wto_commercial_bank_reform$§! aumentan la tolerancia, y la decisión §Y$CHI_provincial_debt_swap$§! la liquida directamente. Enfoques de estímulo como §Y$CHI_four_trillion_stimulus$§! la aumentan. Este espíritu nacional §GMejorará§! una vez que la presión caiga por debajo de §Y90§!."
