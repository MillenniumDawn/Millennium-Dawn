 AST_the_lucky_country: "Le pays chanceux"
 AST_the_lucky_country_desc: "Après que Donald Horne a inventé l'expression en 1964, la plupart des Australiens l'ont mal interprétée comme décrivant le succès fortuné du pays dans le minier. S'il est vrai que nous avons reçu une très vaste masse terrestre, pleine de minerais rares et précieux, Donald l'employait pour se moquer des dirigeants de l'époque, trop investis dans cette voie et négligeant d'autres opportunités économiques. En bref : nous ne diversifions pas assez. Cela nous a laissés dans une situation où l'Australie n'est qu'à quelques usines de tech ou de manufacture d'être un État rentier à part entière. Nous dépendons entièrement de nos exportations, et soit nous l'acceptons, soit nous commençons le processus de désengagement."
 AST_fuel_the_mining_boom: "Alimenter le boom minier"
 AST_fuel_the_mining_boom_desc: "Le minier est le pivot de l'économie australienne littéralement depuis qu'elle est devenue colonie. De la ruée vers l'or à aujourd'hui, le minier a fait tourner et croître notre économie. Tout cela consomme une quantité inouïe d'essence pour camionner et expédier le minerai. Si la situation au Moyen-Orient s'aggrave encore, nous pourrions voir notre économie s'arrêter net. Avant d'étendre davantage, nous devons sécuriser nos réserves stratégiques chez nous et tenir l'approvisionnement prêt pour les jours de pluie."
 AST_acis_scheme: "Programme ACIS"
 AST_acis_scheme_desc: "Le Automotive Competitiveness and Investment Scheme a été créé pour fournir à nos industries automobiles un allègement de droits et un financement pour stimuler investissement, recherche et développement. Notre industrie a manqué à la comparaison avec celles autour de nous, aussi un coup de pouce à nos compagnies nationales ne sera pas malvenu."
 AST_a_sea_of_panels: "Une mer de panneaux"
 AST_a_sea_of_panels_desc: "Nos centrales solaires rurales sont un spectacle à voir. Comme une œuvre d'art circulaire, absorbant les rayons qui d'habitude ne font que brûler les touristes. Notre mix actuel d'énergies renouvelables et fossiles manque un peu de santé, et une extension de nos parcs solaires rétablira l'équilibre."
 AST_commit_to_renewables: "S'engager dans les énergies renouvelables"
 AST_commit_to_renewables_desc: "L'avenir de notre production énergétique ne doit pas être dicté par notre offre de charbon ou de gaz. Notre développement des technologies renouvelables a progressé étonnamment vite ces dernières années. Il est grand temps d'en tirer parti."
 AST_harness_the_wind: "Harnesser le vent"
 AST_harness_the_wind_desc: "Dans la mythologie grecque, Éole était le dieu chargé par Zeus de contrôler les vents, ne relâchant les terribles tempêtes que sur ordre. Si nous ne pouvons contrôler les vents, grâce à nos scientifiques, nous pouvons harnesser leur puissance. Installer davantage de turbines là où elles profitent le plus nous donnera une belle source d'énergie propre et conséquente."
 AST_rewire_the_nation: "Recâbler la nation"
 AST_rewire_the_nation_desc: "Il y a peu de problèmes dans cette nation qu'on puisse résoudre en y déversant un tas d'argent. Celui-ci en est un. Les ingénieurs ont déjà eu leurs comités et leur planification, et nous sommes prêts à déployer une modernisation des réseaux électriques à travers la nation, les adaptant à nos besoins de capacité actuels."
 AST_fix_the_potholes: "Réparer les nids-de-poule"
 AST_fix_the_potholes_desc: "Le fléau de la conduite dans ce pays a toujours été les nids-de-poule. Demandez à n'importe quel conducteur, urbain ou rural : ils racontent réparations de voitures, quasi-accidents et autres horreurs. Comme le devoir de protéger nos citoyens incombe au gouvernement, c'est notre responsabilité d'éradiquer ce fléau."
 AST_north_west_shelf_expansion: "Expansion du plateau nord-ouest"
 AST_north_west_shelf_expansion_desc: "Le Northwest Shelf a été l'une de nos plus longues et plus réussies usines de gaz de la péninsule, traitant une part massive de toutes nos extractions de pétrole et de gaz. La proposition actuelle suggère d'étendre la durée opérationnelle du projet jusqu'en 2070, nous fournissant le traitement dont nous avons tant besoin d'ici là."
 AST_its_just_coal: "C'est juste du charbon !"
 AST_its_just_coal_desc: "Certains opposants à notre expansion pourraient craindre les fossiles. À eux nous disons : n'ayez pas peur, n'ayez pas peur, ça ne vous fera pas de mal. C'est du charbon. Le miner en Australiens est presque dans notre sang. Nous chérissons ce minerai sombre et poussiéreux et il alimente nos foyers. Les renouvelables peuvent être la nouveauté, mais le charbon sera toujours là pour nous, brûlant."
 AST_high_speed_focus_ast: "Train à grande vitesse"
 AST_high_speed_focus_ast_desc: "La malédiction du train à grande vitesse hante nos États depuis les années 80. Chaque fois qu'un gouvernement fédéral commence le processus de construire un rail au-dessus de 200 km/h, le projet ne dépasse jamais le stade de la planification. Pas cette fois. Nous intervenons maintenant, et nous irons jusqu'au bout. Nous avons la technologie et le tracé : Brisbane-Sydney-Melbourne. Rien ne se dresse sur notre chemin."
 AST_dig_deep: "Creusez profondément"
 AST_dig_deep_desc: "Le raffinage d'alumine a fait un certain nombre de percées récentes dans nos centres miniers reculés. Si nous mettons directement la pression pour accélérer l'approbation des droits miniers, ils pourront forer plus tôt et plus profond."
 AST_lng_megaprojects: "Mégaprojets GNL"
 AST_lng_megaprojects_desc: "Nos installations GNL sont l'une de nos méthodes les plus modernes de transporter le gaz naturel vers d'autres nations, et cela nous a énormément économisé en coûts d'expédition. Le processus de refroidir le gaz à très basse température pour le liquéfier réduit le volume de gaz de 600 %. Travailler avec les compagnies pour étendre ces installations, et en un sens porter les coûts de construction, les fera démarrer plus tôt."
 AST_the_boom_never_ends: "Le boom ne s'arrête jamais"
 AST_the_boom_never_ends_desc: "Parfois on a de la chance, et parfois on est simplement l'Australie. Les choses explosent ici dans le secteur minier, et nous aimerions que ça continue. Investissements, stimuli, le tout. Nos compagnies vont continuer de forer avec notre approbation et tout ce que nous avons à faire, c'est nous asseoir et en profiter."
 AST_treat_the_farmers: "Traiter les fermiers"
 AST_treat_the_farmers_desc: "Les fermiers de cette nation se trouvent être parmi les plus durs à la tâche. En fin de journée leurs mains sont couvertes de terre pour que les nôtres puissent porter une bague de diamant. Ou du moins c'est ce que j'ai entendu. Quoi qu'il en soit, nous devons les récompenser pour leur travail. Un cadeau, si l'on veut."
 AST_enjoy_the_prosperity: "Profiter de la prospérité"
 AST_enjoy_the_prosperity_desc: "Quand on grille les experts, tous s'accordent : notre secteur minier ne va nulle part. En ce moment les exportations alimentent cette nation comme jamais auparavant, et les récompenses sont à nous. Nous pouvons investir substantiellement dans l'infrastructure pour soutenir les futures entreprises minières et la production de carburant tant que le fer est chaud. Pour tirer le maximum du boom."
 AST_heavy_industry_projects: "Projets d'industrie lourde"
 AST_heavy_industry_projects_desc: "Nos compagnies de construction d'État ont travaillé dur pour bâtir ce merveilleux pays, mais la demande d'une plus grande capacité est assez évidente. Déployer les plans d'une expansion sera coûteux, mais simple. Le monde verra l'Australie que nous sommes destinés à être."
 AST_urban_expansion_initiative: "Initiative d'expansion urbaine"
 AST_urban_expansion_initiative_desc: "On ne peut construire sans terre, et cette proposition a été rédigée pour nous permettre de contourner beaucoup des exigences habituelles d'acquisition foncière que certains protestataires appellent « saisie », ce qu'elle n'est pas. La terre sera payée, bien sûr, le processus sera simplement plus rapide."
 AST_defy_the_mantra: "Défier le mantra"
 AST_defy_the_mantra_desc: "Nous ne resterons pas asservis à un surnom. L'Australie évoluera ou elle mourra. Lorsque les mines s'épuiseront ou que le prochain désastre économique viendra, notre économie tiendra parce que nous aurons investi dans son avenir. En nous étendant vers un certain nombre de voies économiques, nous pouvons diversifier notre production nationale. Nous ne serons pas un État rentier, mais une nation robuste."
 AST_global_weapons_manufacturing: "Expanding Mulwala"
 AST_global_weapons_manufacturing_desc: "Since World War 2 our weapons manufacturing has remained fairly limited. In fact most of our explosives production has resided within the small fishing town of Mulwala. If diversification is necessary, increasing our domestic production to ease the supply for our army might make the investment worthwhile."
 AST_overseas_opportunities: "Opportunités à l'étranger"
 AST_overseas_opportunities_desc: "Beaucoup de nos plus grandes compagnies d'énergies fossiles opèrent déjà lourdement à l'étranger partout où l'opportunité se présente. Des opérations que l'on peut encourager si nous assouplissons les codes actuels et plantons quelques incitations ici et là."
 AST_the_white_paper: "Le Livre blanc"
 AST_the_white_paper_desc: "After our success during the East Timor intervention in '99, it laid bare a number of inadequacies in our military. A complete expansion and restructuring will be needed to amend those shortfalls. Our senior staff has recommended we begin with a target to set the tone, and they've offered us a few options to get things moving."
 AST_hardening_our_units: "Endurcir nos unités"
 AST_hardening_our_units_desc: "Pendant la guerre du Golfe et d'autres interventions depuis, les menaces asymétriques sont devenues une forme de guerre nouvelle et effrayante que nous avons dû affronter. Parfois une plus grande puissance de feu ne suffit pas, et pour les malheureux qui ont connu ces nouvelles attaques, surtout les engins explosifs improvisés, ceux qui ont survécu l'ont fait parce que leurs véhicules ont tenu. Développer notre durcissement peut faire la différence dont nos troupes ont besoin pour rester en vie et poursuivre les opérations."
 AST_a_networked_army: "Une armée en réseau"
 AST_a_networked_army_desc: "The digital landscape has been a wonder for our industries so far. Similarly, transforming land forces into a digitally connected, sensor-to-shooter force allows for faster decision making and instant relaying with command. Our joint-forces will be more unified than ever, and operations can be managed directly by command to ensure the right decisions are made at the right time."
 AST_diisr_ast: "DIISR"
 AST_diisr_ast_desc: "For one reason or another we don't have a singular, government guided research institute. We do have quite a few private ones, and even some led at a state level, but the demand for a facility to undergo the research we require needs something grander. Plans for a Department of Innovation, Industry, Science and Research have landed on our desk, and construction is simply awaiting approval."
 AST_rnd_tax_incentive: "Incitations fiscales à la R&D"
 AST_rnd_tax_incentive_desc: "Maintenant que le DIISR est opérationnel, dédier une part du financement à la recherche et développement, et un certain nombre de subventions pour lancer des projets, assure que nous soyons à la pointe de l'innovation."
 AST_our_beloved_bushmaster: "Nos bien-aimés Bushmaster"
 AST_our_beloved_bushmaster_desc: "Les Bushmaster sont une icône de notre armée qui a capturé le cœur de nombreux experts militaires pour leur polyvalence, leur design signature et leurs capacités de terrain. Ils nous ont bien servis à l'étranger, et en produire davantage devrait être une priorité. Heureusement cette demande était déjà incluse dans le Livre blanc."
 AST_the_special_forces: "Qui ose gagne"
 AST_the_special_forces_desc: "Le SAS australien est devenu une source de fierté pour beaucoup, et à juste titre. Le régiment d'élite, originellement modelé sur l'unité britannique, s'est révélé fort utile pour des opérations sensibles à l'étranger. Les équiper de la meilleure technologie que nous ayons assure que leur succès continue."
 AST_lessons_from_the_middle_east_ast: "Leçons du Moyen-Orient"
 AST_lessons_from_the_middle_east_ast_desc: "Nous avons appris un certain nombre de choses d'un certain nombre d'opérations au Moyen-Orient. Notamment l'incompatibilité entre nos uniformes et le temps poussiéreux courant dans la région. S'ils sont conçus pour la chaleur australienne, ils peuvent être améliorés."
 AST_remembering_the_anzacs: "Se souvenir des ANZAC"
 AST_remembering_the_anzacs_desc: "Notre cérémonie ANZAC a toujours commémoré ceux « qui ont servi et sont morts dans toutes les guerres, conflits et opérations de maintien de la paix ». Cela inclut non seulement ceux qui ont péri dans la Grande Guerre, mais nos troupes dans des conflits récents comme la guerre du Golfe et en Indonésie. La leçon que nous en tirons est le devoir sacré de garder nos troupes en sécurité. Désormais, alors que la guerre change constamment, nous aussi devons changer et innover pour donner à nos forces la plus grande chance sur le champ de bataille. Sinon nous nous souviendrons d'eux à la prochaine cérémonie."
 AST_never_another_darwin: "Jamais un autre Darwin"
 AST_never_another_darwin_desc: "Le 19 février 1942, un raid de quelque 188 appareils japonais a déchiré Darwin. Outre la destruction de notre infrastructure militaire, la perte de personnel et de vies civiles a été catastrophique, la plus grande de toute attaque unique contre nous pendant la guerre. Les règles de la guerre ont changé, mais les leçons sont restées les mêmes."
 AST_new_tools: "Nouveaux outils"
 AST_new_tools_desc: "Si le XXIe siècle nous a prouvé quelque chose, c'est que la complaisance tue. Bien sûr nous pourrions garder les mêmes fusils, garder nos doctrines, mais nos ennemis ne le feront pas. L'innovation de l'autre côté de l'Atlantique et du Pacifique a produit de meilleures armes, conçues pour une plus grande gamme d'environnements et de types de menaces. Quelque chose que nous ne pouvons nous permettre d'ignorer."
 AST_old_reliable: "Vieux fiable"
 AST_old_reliable_desc: "Nous avons déjà regardé à l'étranger pendant la guerre froide, et nous avons choisi les Autrichiens. Steyr a vu juste avec l'AUG. Une arme épurée, élégante, que nos fabricants ont passé des décennies à perfectionner depuis. Pourquoi changer une bonne chose ? Nous pouvons plutôt investir dans l'extension de la production actuelle, assurant que nous soyons prêts à toute demande surprise."
 AST_lithgow_arms: "Armes de Lithgow"
 AST_lithgow_arms_desc: "The Lithgow Arms plant has been a symbol of our determination and endurance since 1912. It served us faithfully through the first and second war and has produced well over a million rifles for us in that time. That's why the sad state of it now is difficult to behold. Something needs to be done."
 AST_grow_our_command: "Développer notre commandement"
 AST_grow_our_command_desc: "The Special Operations Command is designed to unite all our special forces units into a singular command structure, SOCOMD. With the constantly increasing threat that terror has posed, along with the usual challenges of the times, our special forces are going to need to fight under unified guidance, and this covers it."
 AST_the_second_white_paper: "Le 2e Livre blanc"
 AST_the_second_white_paper_desc: "With the more-or-less success of the 2000 White Paper, the administration has given us a new directive much similar to the previous. Continued expansion and development across the board to keep us, pound for pound, on par with the giants. We've stepped up to the plate before, we can do it again."
 AST_strategic_reform: "Réforme stratégique"
 AST_strategic_reform_desc: "The current state of our departments isn't going to cut it. A top to bottom reform of our strategic forces will be carried out to trim some of the inefficiencies that have grown in the last few decades. The DMO and the CDG will be shelved and reorganised into the Capability Acquisition and Sustainment Group. An enterprise approach will be adopted for our production management. All to allow us to evolve into a much more tactile, responsive force that can manage an ever-changing military."
 AST_incorporate_the_peacekeeping_training_ast: "Intégrer l'entraînement de maintien de la paix"
 AST_incorporate_the_peacekeeping_training_ast_desc: "L'Australie a fait partie des efforts de maintien de la paix des Nations unies depuis la fin de la Seconde Guerre mondiale, fournissant personnel et ressources. Pendant ces décennies, et surtout l'intervention récente au Timor oriental, nous avons gagné un certain nombre de leçons de guerre qui pourraient être mieux implémentées dans notre propre doctrine, gardant nos troupes protégées même dans les environnements les plus improbables."
 AST_recruitment_campaigns: "Campagnes de recrutement"
 AST_recruitment_campaigns_desc: "Depuis l'affiche « Coo-ee-won't YOU come? », nous avons le don des campagnes de recrutement. Avec les avancées d'Internet, tout un nouveau domaine d'opportunité s'est présenté à nous. Nous pouvons diffuser un certain nombre d'annonces qui tirent parti de l'espace, et atteindre ceux moins enclins à regarder la télévision ordinaire."
 AST_land_one_two_one: "TERRAIN 121"
 AST_land_one_two_one_desc: "Rheinmetall has presented us with a proposal to replace many of our aged, unprotected medium and heavy trucks with enhanced designs. The specifics detail plans to improve their logistics and technical capabilities to support a range of operations. \n\nConsidering how old some of our gear is getting, the project is worth some consideration."
 AST_stop_panicking: "ARRÊTEZ DE PANIQUER"
 AST_stop_panicking_desc: "Tout le monde doit se CALMER. Nous sommes le gouvernement, nous ne contrôlons pas l'économie. Si les choses vont mal, même un instant, soudain tout le monde pointe du doigt vers nous. Pire, ils commencent à paniquer. Des stimuli pour à peu près tout le monde devraient nous acheter un peu plus de calme jusqu'à ce que nous puissions maîtriser cela."
 AST_guarantee_the_banks: "Garantir les banques"
 AST_guarantee_the_banks_desc: "Si les banques ont peur, nous les garderons dans le vert. Nous ferons ce qu'il faut pour les faire tenir, diable, nous garantirons TOUS les dépôts bancaires. Aucune banque ne coulera dans ce pays et nous mettrons assez de pansements fiscaux pour que le PIB tienne par la seule dépense publique."
 AST_grab_the_securities: "Saisir les titres"
 AST_grab_the_securities_desc: "Le marché immobilier américain a été le déclencheur de tout cela, et des milliers de propriétaires en Australie se demandent si la même chose leur arrivera. Nous pouvons rassurer le public en achetant les titres adossés à des hypothèques pour soutenir nos finances immobilières, et assurer qu'elles ne fassent pas faillite."
 AST_turn_things_around: "Changer les choses"
 AST_turn_things_around_desc: "The Nation Building and Jobs Plan has become the single largest economic package we've ever put together. It covers school infrastructure, social housing, home building, tax breaks, rail projects and more stimulus payments than you can count. The peak of our support for the nation should show that we're serious about getting things back on track, and simmer everyone's nerves."
 AST_the_royal_australian_navy: "La Royal Australian Navy"
 AST_the_royal_australian_navy_desc: "Our pride and joy moving about off our coast is the RAN. If it wasn't obvious Australia is an island nation. For centuries the only way any invasion force could reach our shores was through a fleet, and protected from that we once were by the Royal British Navy. Now of course we could be hit by an intercontinental missile, and far more damage could be done without anyone having to land on our shores, but that's hardly the point. As an ode to the role they once had, and with a job no less important, we name our navy royal, and dispatch it to keep the waves secure as they once did. To protect our glorious nation."
 AST_embrace_the_support_role: "Embrasser le rôle d'appui"
 AST_embrace_the_support_role_desc: "Embrasser le rôle d'appui — La réalité de notre position dans le Pacifique est celle du colmatage. Seuls, un contre un, nous n'avons aucune chance contre une flotte chinoise ou russe. Nous nous battrons, mais le seul moyen de gagner la guerre est par nos alliés. Notre rôle a toujours été de jouer les seconds violons des Américains, et cela a bien fonctionné jusqu'ici. Tout ce que nous avons à faire, c'est tenir jusqu'à ce qu'ils arrivent, et alors nous gagnons. Il n'y a aucune honte à jouer le rôle d'appui, surtout si nous le faisons bien."
 AST_we_are_the_pacific: "Nous sommes le Pacifique"
 AST_we_are_the_pacific_desc: "Les temps ont changé. L'Union soviétique n'est plus, et la Chine n'est pas encore sa successeure. En réalité une guerre navale est très peu probable à l'horizon. Si elle l'était, nous ne tiendrions peut-être pas. Pas avec cette marine. Si nous nous engageons à l'étendre, nous pouvons créer une force que peu oseraient affronter. En utilisant tout ce dont nous disposons, le rôle de notre nation n'est peut-être pas gravé dans le marbre."
 AST_trade_support: "Soutien au commerce"
 AST_trade_support_desc: "L'une de nos responsabilités vitales a été de protéger le commerce entre nous et nos précieux partenaires. Garder le flux de marchandises à l'abri de l'interdiction par nos rivaux navals, comme la Chine, assure que le commerce avec nos plus grands importateurs, comme la Chine, continue de prospérer."
 AST_multidimensional_warfare: "Opérations multi-domaines"
 AST_multidimensional_warfare_desc: "En intégrant la puissance militaire à travers les domaines terre, mer, air, espace et cyber, nous avons un avantage significatif sur des ennemis pris au dépourvu dans ces champs. Les départements aérien et naval doivent travailler ensemble là-dessus."
 AST_whetstone_training: "Formation à la pierre à aiguiser"
 AST_whetstone_training_desc: "Comme une épée laissée inactive, si notre marine n'est pas constamment éprouvée et affûtée, elle rouillera. Les exercices de combat naval vont forger nos cadets et marins, ou que je sois damné. Ils seront prêts à tout engagement à tout moment parce que c'est le métier, et ils nous feront honneur."
 AST_wide_scanning: "Numérisation large"
 AST_wide_scanning_desc: "Le Jindalee Operational Radar Network (JORN) a passé sa période de prototype et est passé à la phase 5 de mise en œuvre, ce qui signifie essentiellement qu'il est très probablement le radar le plus avancé autour, surveillant à des portées au-delà de 3 000 kilomètres. Inventer la chose était la partie facile, la mettre dans nos navires est la partie dure."
 AST_an_outside_review: "Force 2030"
 AST_an_outside_review_desc: "In order to measure our seafaring ability we've commissioned a review of our navy forces. The results are a somewhat startling critique on our production capacity and deployment limitations. We'll need to follow the recommended amendments if we're going to get anywhere developing a serious navy."
 AST_the_middle_ships: "Les navires du milieu"
 AST_the_middle_ships_desc: "Beaucoup de sueur et de larmes ont été versées pour développer nos destroyers de classe Hobart. Remplaçant nos navires de classe Perth des années 60, et conçus pour restaurer nos capacités de missiles guidés, ils sont peut-être notre modernisation la plus importante de tout le tableau."
 AST_screening_role: "Rôle de sélection"
 AST_screening_role_desc: "Si nous appuyons nos alliés dans le Pacifique, nous devons être leurs yeux et leurs oreilles. Notre capacité à voir les menaces avant qu'elles ne soient à notre porte n'est pas seulement un bénéfice tactique pour eux non plus, elle nous aide à préparer et contrôler le champ de jeu. Plus nous serons bons à cela, mieux nous performerons."
 AST_below_the_enemy: "Sous l'ennemi"
 AST_below_the_enemy_desc: "Si certains de nos sous-marins ont été mis en service plus récemment, une grande part de notre flotte est très ancienne. Des modernisations ont été faites à la majorité, mais cela ne change pas le fait qu'ils nous placent activement en désavantage technologique, surtout lorsque notre meilleure chance passe par le combat indirect."
 AST_containment_theory: "Théorie du confinement"
 AST_containment_theory_desc: "Pendant la guerre froide, nous opérions selon la pratique de la « théorie de l'endiguement », aux côtés des Américains. Une théorie conçue explicitement pour bloquer l'expansion soviétique. L'échiquier géopolitique a changé, mais à certains égards la mission n'a pas changé. Nos ennemis poursuivent un objectif expansionniste très réel. Que ce soit par la diplomatie ou la construction d'îles, notre souveraineté est incontestablement menacée si nous ne pouvons y résister, ou du moins la freiner. Une présence navale constante, ainsi qu'une action diplomatique réussie, est le seul moyen de voir un avenir sans guerre directe, ce qui signifie que c'est notre seule option."
 AST_the_groundwork: "Les fondations"
 AST_the_groundwork_desc: "Le dur travail doit être mis à poser l'infrastructure de ce que nous essayons de faire. Une expansion à grande échelle de nos chantiers navals et espaces départementaux actuels devra être rapidement employée, ce qui sera comme on peut s'y attendre un peu coûteux."
 AST_expand_command_capabilities: "Étendre les capacités de commande"
 AST_expand_command_capabilities_desc: "Avec l'ampleur de ce que nous visons, nous allons devoir étendre le quartier général naval et le ministère de la Défense pour le gérer. Garder les deux branches étroitement connectées pendant la transition, tout en supervisant l'augmentation de production, sera coûteux, mais nécessaire."
 AST_carrier_project: "Projet transporteur"
 AST_carrier_project_desc: "Il n'y a pas si longtemps, l'Australie avait ses propres porte-avions. Le HMAS Sydney et le Melbourne étaient prêts à tout engagement et de vraies beautés de la mer. Les temps ont changé et nos dépenses militaires ont rétréci, de tels behemoths n'étaient plus viables. Jusqu'à maintenant. Les porte-avions reviendront à notre flotte et l'héritage de nos navires retirés vivra."
 AST_like_submarines_in_a_barrel: "Comme des sous-marins dans un baril"
 AST_like_submarines_in_a_barrel_desc: "Nous devons combler le fossé des porte-avions, et pour ce faire nous allons devoir utiliser nos hélicoptères. Le MH-60R Seahawk est un exemple de premier plan pour accomplir nos objectifs de mobilité. Nous pouvons investir dans le projet pour développer le design, et commencer la production."
 AST_ship_to_air: "Ne pas nourrir les destroyers"
 AST_ship_to_air_desc: "Nos destroyers ont faim de missiles, et le seul moyen de les nourrir, c'est plus de missiles. Pas la vieille tech, ça ne fera pas l'affaire. Nous allons avoir besoin de quelque chose de tout neuf pour nourrir ces créatures."
 AST_adf_academies: "Académies ADF"
 AST_adf_academies_desc: "Notre institut de premier plan pour combiner formation militaire et éducation universitaire est à Canberra. Ce n'est qu'un bâtiment, mais pour nos demandes de défense ce nombre va devoir grimper. Nous en construirons un certain nombre dans toutes nos grandes villes, et peut-être assouplirons-nous aussi quelques exigences."
 AST_the_raaf: "La Royal Australian Air Force"
 AST_the_raaf_desc: "Ah, la Royal Australian Air Force. Notre principal département de guerre aérienne, continuant de garder les cieux d'Australie sûrs et sécurisés. Ils ont les meilleurs uniformes, la meilleure nourriture, et le job le plus cool de l'ADF. Mais ne nous attardons pas sur les avantages. Le mandat a été émis, et le focus est simple. Supériorité aérienne dans le Pacifique, et appui à nos opérations expéditionnaires. Comment nous y prenons est à notre discrétion."
 AST_fourth_generation_striking: "Frappe de 4e génération"
 AST_fourth_generation_striking_desc: "Mettre la main sur des appareils de quatrième génération ne sera pas facile, et nous devrons pleinement utiliser nos connexions et notre capacité technologique pour y arriver. L'écart entre les chasseurs de 3e et 4e génération n'est pas si massif, mais au rythme auquel la 5e génération approche, il est évident que nous ne voulons pas rester en arrière."
 AST_globemasters: "Maîtres du globe"
 AST_globemasters_desc: "Le Boeing Globemaster III est notre premier avion cargo pour les ponts aériens stratégiques et le transport de troupes. Boeing a certainement livré sur celui-ci. Le modèle est plus grand et bien plus puissant que le précédent, mais devinez quoi, nous en voulons un autre. Nous enverrons les specs et espérerons que les résultats suffisent."
 AST_shadow_in_the_sky: "Ombre dans le ciel"
 AST_shadow_in_the_sky_desc: "L'AAI RQ-7 Shadow est notre unité de reconnaissance et drone de combat sans pilote le plus efficace actuellement développé. Une autre tech astucieuse reprise des Américains qui marque un changement net dans la nature de la guerre. À mesure que notre infrastructure mobile augmente, et la portée de nos opérations, la capacité de combattre a effectivement été accrue bien au-delà de ce dont nous étions auparavant capables."
 AST_the_roulettes: "Les Roulettes"
 AST_the_roulettes_desc: "Les Roulettes sont l'équipe de voltige aérienne de l'armée de l'air. Elles ont volé autour du monde en réalisant un certain nombre de spectacles audacieux et ont naturellement capturé l'admiration de ceux assez chanceux pour les voir. Le fond, c'est que si chaque fois qu'elles volent cela fait du bien à notre réputation, alors par tous les moyens nous les laissons voler."
 AST_employ_ballistic_missiles: "Employ Ballistic Deterrence"
 AST_employ_ballistic_missiles_desc: "Les missiles de frappe de précision à longue portée sont souvent employés pour dissuader les conflits. Ils sont l'outil magique utilisé pour danser le long de la ligne grise entre non-confrontation et guerre totale. Si, par exemple, l'une de nos bases à l'étranger était frappée, nous pourrions déployer une « réponse proportionnelle » où nous les frapperions à un site également stratégique avec nos missiles à longue portée, et tout le monde rentrerait content avec seulement des egos légèrement meurtris et sans crainte de guerre. En théorie."
 AST_project_wedgetail: "Projet Wedgetail"
 AST_project_wedgetail_desc: "Le projet Boeing E-7 est l'une de nos entreprises plus récentes de centres de commandement mobiles. Il nous fournit un système d'alerte précoce, grâce au radar collé dessus, et un renseignement de localisation en temps réel sur le champ de bataille. L'appareil peut bien sûr être réaménagé et utilisé à d'autres fins aériennes à notre discrétion."
 AST_keep_them_out: "Les tenir à l'écart"
 AST_keep_them_out_desc: "Si les détecter est une chose, réellement dissuader les appareils ennemis de mitrailler les villes australiennes en est une autre. Nos avions ne peuvent pas toujours être en l'air, aussi des systèmes NASAMS portables et fixes serviront à leur place. Accompagnés de radar, ils sont une puissante force défensive à contempler."
 AST_preserve_the_super_hornets: "Préserver les Super Hornet"
 AST_preserve_the_super_hornets_desc: "Depuis le retrait des F-111, les 24 F/A-18F Super Hornet ont pris le relais, eux-mêmes commençant à dater. Nous pouvons améliorer le modèle et actualiser un certain nombre de systèmes internes pour aider le changement afin d'assurer qu'ils soient prêts pour le nouveau rôle."
 AST_masters_of_command: "Maîtres du commandement"
 AST_masters_of_command_desc: "Utiliser la logistique d'hélicoptères pour les opérations a révolutionné notre potentiel mobile. Sans besoin d'aéroports, ils représentent le meilleur cas d'usage pour les zones de haute tension et les champs de bataille évolutifs. Implémenter une agence dédiée aux opérations logistiques d'hélicoptères renforcera leur maîtrise de bout en bout."
 AST_reopen_cockatoo_island: "Rouvrir l’île aux cacatoès"
 AST_reopen_cockatoo_island_desc: "Le besoin croissant de chantiers de réparation a commencé à user notre infrastructure actuelle. Cockatoo Island, qui n'a fermé que récemment dans les années 90 mais est devenue une sorte de destination touristique, devra être reconstruite de fond en comble pour réparer la plus récente génération de navires cassés."
 AST_the_howard_government: "Le gouvernement Howard"
 AST_the_howard_government_desc: "Le soleil se lève sur notre nation. Riche en beauté, de sol doré, et vraiment ceinte par la mer. L'Australie est unique en sa place de puissance régionale dans le Pacifique ; un pays avec beaucoup d'amis et peu d'ennemis. Pourtant les Australiens aspirent à un meilleur demain, et beaucoup sont tombés dans les failles de la société. La classe ouvrière s'est rassemblée autour du gouvernement Howard aux dernières élections, laissant les Libéraux jouir d'une majorité confortable. \n\nDésormais un mandat de changement prudent nous a été remis et nous sommes censés le suivre. Le gouvernement Keating nous a laissé un trou considérable dans le budget que, si nous avons été rigoureux à le colmater, nous laisse encore le travail de le ramener davantage dans le vert. Des protestations ont jonché les rues exigeant une action, et nos propres entreprises appellent à une réforme économique. \n\nLe pays chanceux est entre nos mains."
 AST_new_millennium_economics: "L’économie du nouveau millénaire"
 AST_new_millennium_economics_desc: "Le budget a été remis et approuvé. Discipline fiscale et excédent budgétaire sont nos politiques les plus demandées, mais cela ne signifie pas que nous ne puissions pas dépenser un peu pour gagner plus tard. Divers actifs gonflés du gouvernement sont mûrs à vendre, et bien des coupes peuvent encore être faites pour financer l'expansion d'autres programmes. \n\nLa banque de réserve a déjà relevé le taux directeur. C'est à nous de suivre. Nous serons durs, mais justes comme toujours."
 AST_trim_taxes: "Réduire les impôts"
 AST_trim_taxes_desc: "Lors des dernières élections, nous avons promis de baisser les impôts pour les Australiens qui travaillent dur. Notre position n'a pas changé. Les résidents plus âgés et les hauts revenus peuvent être les premiers à recevoir un flux de baisses d'impôts, laissant plus d'argent affluer vers les entreprises locales et plus à la banque."
 AST_restrict_welfare: "Couper les profiteurs d'allocations"
 AST_restrict_welfare_desc: "Nos extensions de l'allocation-chômage ont laissé les plus soucieux du budget du parti nerveux. Sans moyen de ralentir le gonflement, nous déferons notre dur travail d'équilibrage des comptes ces dernières années. Si nous commençons par limiter la portée du programme, et en mettant des exigences dures pour y rester, nous pourrions nous en sortir. Accroître les obligations mutuelles coupera aussi certains des participants les moins productifs."
 AST_another_round_of_tax_cuts: "Une nouvelle série de baisses d'impôts"
 AST_another_round_of_tax_cuts_desc: "Quelle sorte de gouvernement serions-nous si nous ne pensions pas à nos entreprises. Beaucoup de croissance a été faite pendant notre mandat, mais certaines petites entreprises, et même quelques grandes, ont montré un ralentissement de productivité. Nous pouvons alléger leur fardeau par de nouvelles baisses d'impôts et un peu de réforme pour attirer la concurrence."
 AST_launch_the_gst: "Lancer la GST"
 AST_launch_the_gst_desc: "La législation a passé et la « Goods and Services Tax » peut désormais remplacer les systèmes archaïques d'antan. Lees et les autres détracteurs peuvent grogner, mais la GST a passé ses épreuves. Les entreprises peuvent bénéficier d'une taxe de gros rationalisée, et cela ne fera pas de mal au budget non plus."
 AST_cater_to_the_seniors: "Prendre soin des aînés"
 AST_cater_to_the_seniors_desc: "Tout gouvernement sain s'adonne de temps en temps au crossbenching. Même des politiques de camps opposés devraient être considérées dans le meilleur intérêt de notre peuple. La GST a fourni un coup de pouce substantiel au budget, mais beaucoup de nos aînés n'en sentent pas le bénéfice. Exempter l'alimentation de base du programme, et une généreuse compensation aux pensionnés, devrait adoucir le coup. Les Libéraux ne seront pas sacrifiés sur le bûcher de la pureté idéologique."
 AST_rethink_negative_gearing: "Repenser l'engrenage négatif"
 AST_rethink_negative_gearing_desc: "Our changes to boost negative gearing have not been without controversy. Home owners and especially our older voting base have lauded the changes, however, those unable to afford homes have seen the prices rocket in only a short period. The more Labor inclined in our government are seeing effects spiral before our term is even up. It might destroy our good will with the older class, but a long term healthy economy could salvage the damage. We can only hope the battlers stay loyal."
 AST_first_home_first_served: "Premier logement, premier servi"
 AST_first_home_first_served_desc: "Une autre des victimes projetées de la GST est les primo-accédants. Avec le prix des matériaux de construction qui monte, nous avons alloué une subvention de 7 000 $ à délivrer aux primo-accédants. Les aidant à prendre un coup d'avance sur un marché de plus en plus compétitif."
 AST_meeting_the_mining_giants: "Rencontrer les géants miniers"
 AST_meeting_the_mining_giants_desc: "Il n'est pas rare qu'un dirigeant de nation rencontre les grands acteurs. La Boulder Chamber of Commerce and Industry a demandé une réunion en personne, probablement suscitée par nos récentes baisses d'impôts. Nous ne pouvons qu'attendre qu'ils soient assez enhardis pour faire plus de demandes. En fin de compte, c'est à nous de les écouter ou non."
 AST_proud_and_free: "Fiers et libres"
 AST_proud_and_free_desc: "Si nous regardons les régions qui souffrent le plus de pénuries de compétences et de chômage, nous pouvons nous concentrer sur l'établissement de jusqu'à 24 collèges techniques ciblant les jeunes ayant quitté l'école tôt et les chômeurs. En étendant aussi le Work for the Dole aux apprentis, cela les mettra sur le même pied que les étudiants universitaires. Les forces de défense se sont aussi engagées à allouer une part d'équipement et de maintenance à une formation de compétences supplémentaire. \n\nLes étudiants seront plus libres de poursuivre leurs passions de carrière tandis que notre industrie manufacturière est renforcée. Cela coche plus ou moins une douzaine de bases à bas revenus en même temps, et élargit certainement notre base électorale avec la jeunesse TAFE."
 AST_invest_in_people: "Investir dans les gens"
 AST_invest_in_people_desc: "Ceux qui touchent le fond peuvent trouver dur de se relever. Sans encourager le chômage de long terme, nous pouvons éviter de les pénaliser en incluant des incitations à suivre des programmes de formation au TAFE et d'autres projets de défense et communautaires. Moins un don gratuit qu'un investissement dans l'avenir de nos travailleurs."
 AST_beef_up_the_dole: "Renforcer l'allocation"
 AST_beef_up_the_dole_desc: "Jusqu'ici notre programme Work for the Dole a été un succès retentissant. Moins d'Aussies sont au chômage, et ceux du programme s'emploient à améliorer leur aptitude au travail. Nous pouvons étendre l'allocation pour incorporer des travaux publics et élargir la tranche d'âge des candidats adaptés."
 AST_the_baby_bonus: "La prime bébé"
 AST_the_baby_bonus_desc: "Avoir un enfant ne s'accompagnera plus d'un risque financier. En remplaçant l'allocation de maternité, les nouvelles mères recevront un paiement unique de 3 000 $. Encourager les jeunes familles à se lancer et adoucir le fardeau qui vient avec la nouvelle parentalité."
 AST_protect_the_water: "Protéger l'eau"
 AST_protect_the_water_desc: "Certaines des rivières les plus reculées de l'intérieur ne sont qu'à une semaine de mauvais temps de s'assécher complètement, privant fermes et villes entières d'eau. La National Water Initiative est le premier pas de notre poursuite de durabilité. Gérer l'usage de l'eau et maintenir des niveaux d'extraction durables dans les communautés les plus reculées garde l'approvisionnement en eau disponible pour des millions."
 AST_the_kyoto_protocol_ast: "Le protocole de Kyoto"
 AST_the_kyoto_protocol_ast_desc: "Nous avons déjà négocié des termes justes dans la proposition de l'ONU. Le ratifier nous mettrait avec les 84 autres pays déjà engagés à réduire nos gaz à effet de serre. Quel que soit l'effet que nous ayons sur le réchauffement climatique, soyez sûrs que nous le minimisons, et que l'Australie est une nation responsable en la matière."
 AST_the_carbon_pollution_reduction_scheme: "Le Carbon Pollution Reduction Scheme"
 AST_the_carbon_pollution_reduction_scheme_desc: "Rudd a proposé un schéma pour réduire les niveaux de carbone actuels émis par nos industries d'un total de 25 %, en utilisant des « plafonds » que les compagnies devraient respecter. Rudd est un homme typiquement ambitieux, et un râleur quand il s'agit de changement climatique, mais le public le soutient. Si nous ajustons le schéma juste assez pour éviter de nuire à notre avantage compétitif dans les fossiles, nous pourrions nous en tirer."
 AST_the_drought_force: "La force sécheresse"
 AST_the_drought_force_desc: "Jusqu'ici la transition vers le nouveau siècle a été cahoteuse. Peut-être le plus grand signe d'inquiétude a été la « sécheresse du millénaire », qui peut être la pire sécheresse que nous ayons connue dans l'histoire de notre nation. Nos intervenants d'urgence déjà occupés à y répondre, nous sommes étirés à chercher des options plus proches de notre gouvernement. Nous avons déjà incorporé nos participants au Work for the Dole dans les travaux publics, et maintenant nous pouvons les concentrer sur les terres privées touchées par cette catastrophe naturelle."
 AST_a_nation_worth_preserving: "Une nation qui mérite d'être préservée"
 AST_a_nation_worth_preserving_desc: "Nous avons apporté des améliorations durables à la durabilité de notre nation. Peut-être que cela n'affectera pas le monde dans son ensemble, mais pour les Aussies, la nation qu'ils aiment persévérera. Les eaux sont plus claires, le smog urbain a disparu. Il reste peut-être plus à faire, plus de méthodes d'énergie plus propre ou de moyens de préservation, mais pour l'instant nous pouvons nous reposer comme une nation plus fière."
 AST_practical_reconciliation: "Réconciliation pratique"
 AST_practical_reconciliation_desc: "« J'aimerais commencer par reconnaître les Propriétaires traditionnels de la terre sur laquelle nous nous réunissons aujourd'hui. J'aimerais aussi rendre hommage aux Anciens passés et présents. » \n\nCela peut sonner comme du verbiage, mais la relation avec les Australiens autochtones n'a pas été sans strife. Chaque gouvernement doit reconnaître son histoire avec dignité et respect, et le leadership n'est pas sans responsabilité. Quelle que soit la voie que nous prenons, nous reconnaissons le passé et embrassons l'avenir. Unissant les Australiens par une approche mesurée."
 AST_walk_the_journey: "Marcher le chemin"
 AST_walk_the_journey_desc: "Ça a été un long chemin, et je sais un chemin difficile, pour beaucoup d'Australiens. Autant il y en a que nous avons aidés, il est naïf de quiconque parmi nous de prétendre que certains ne restent pas. Nos efforts pour combler cet écart, et relever ceux laissés derrière, doivent commencer par des programmes centrés sur la santé, l'éducation, le logement et l'emploi. Des programmes déjà discutés au parlement seront financés et étendus. Les défavorisés et la coalition marcheront main dans la main."
 AST_a_national_apology: "Des excuses nationales"
 AST_a_national_apology_desc: "Keating veut nous couper l'herbe sous le pied. Très bien, nous jouerons le Labor à son propre jeu. Je donnerai à ces galahs du Guardian ce qu'ils veulent. Je prendrai la responsabilité des générations précédentes, et ensuite nous POURRONS AVANCER. Les Aussies autochtones auront leur juste part, et personne ne dira que je ne les ai pas aidés."
 AST_its_mabo_its_the_vibe: "It's Mabo, it's the Vibe"
 AST_its_mabo_its_the_vibe_desc: "L'affaire Mabo a été une décision historique de la High Court. Eddie s'est battu pour le Native Title, l'existence de terres précoloniales, et a mis fin à la terra nullius pour de bon. \n\nEn travaillant avec les communautés autochtones, et en proposant un amendement pour inclure une Déclaration de réconciliation dans le préambule de la constitution, nous reconnaîtrions leurs droits à la terre, étendant l'Aboriginal Land Rights Act existant. C'est symbolique, peut-être, mais cela montre que nous prenons l'égalité au sérieux. Tous les électeurs auront également leur mot à dire."
 AST_the_civil_partnership_act: "Loi sur le partenariat civil"
 AST_the_civil_partnership_act_desc: "Currently states and territories restrict same-sex couples from being recognised as even being in a relationship, which can cause a number of minor issues for them legally. While we refrain from approaching the topic of same sex marriage as a moral stance, we can assist those who don't wish to marry, and at the very least put the decision to a vote."
 AST_avoid_the_speech: "Éviter le discours"
 AST_avoid_the_speech_desc: "Je ne crois pas, par principe, qu'une génération puisse accepter la responsabilité des actes d'une génération antérieure. Je ne l'accepte pas par principe. Ce gouvernement ne distribuera pas de gestes vides, ni ne sera pris à cocher la question autochtone pour des points politiques. La coalition devrait apparaître unie là-dessus. Toute discussion d'assister à la marche de réconciliation devrait être nippée dans l'œuf."
 AST_crack_down_on_protests: "Réprimer les manifestations"
 AST_crack_down_on_protests_desc: "Les huées, les manifestations, tout cela doit cesser. Tout le monde doit se calmer ! Je me fiche de comment. Déplacer les gros titres, amplifier le policing. Tout ce que nous pouvons faire pour que les vrais enjeux aient le projecteur et que ces voyous soient sous contrôle. Je n'écouterai pas leur auto-glorification. En fait, je n'y prêterai aucune attention du tout ! Notre politique sera louée comme un rejet du chantage à la culpabilité et de la politique de la foule. J'en suis sûr."
 AST_abolish_the_atsic: "Abolir l'ATSIC"
 AST_abolish_the_atsic_desc: "Jusqu'ici, l'expérience d'une représentation séparée a été un échec. Une décennie de financements y a été versée sans aucun bénéfice pratique pour la communauté autochtone. Pire encore : allégations de mauvaise gestion, corruption, fraude, la liste s'allonge. Plus maintenant. Nous supprimerons l'agence et récupérerons ce que nous pourrons de son financement."
 AST_with_safer_communities: "Des communautés plus sûres"
 AST_with_safer_communities_desc: "Les signalements d'abus d'enfants et d'effondrement des communautés autochtones isolées du nord sont, pour le dire poliment, un désastre national. Un soutien bipartisan à une intervention morale a été facile à obtenir. Nous déploierons les troupes, restreindrons les aides, imposerons des contrôles sanitaires obligatoires et de la surveillance. La pornographie et l'alcool seront interdits dans les communautés, et nous pourrons enfin ramener les droits fonciers au gouvernement. Certains éléments exigeront de suspendre le Racial Discrimination Act, ce qui fera râler les députés d'arrière-ban et les associations, mais une fois l'ordre rétabli, les habitants ne seront pas les seuls à nous remercier."
 AST_we_are_many: "Nous sommes nombreux"
 AST_we_are_many_desc: "We are, without a doubt, a diverse country. Even during the days of the 'White Australia' policy the nation was inundated by Europeans of no two similar descents. Now the country has opened its doors to many, and we are responsible for that intake. How we govern the matter will define the makeup for Australia decades to come. Whether rich or strong, we decide the policy and the lives of millions."
 AST_widen_our_net: "Élargir nos filets"
 AST_widen_our_net_desc: "The immigration office has come a long way since the 'White Australia Policy,' but let's face it, the number is still low, very low. At the rate our economy is booming, worker shortages will be a newly developing issue. To fix this we're widening the intake of foreign workers, and to balance this out, stricter emphasis on skilled migrants will be enforced with reduced access to welfare for new migrants. This should simultaneously please both sides of the aisle, while appealing to large businesses."
 AST_with_open_arms: "À bras ouverts"
 AST_with_open_arms_desc: "Cette nation a toujours été multiculturelle, et a toujours nécessité l'arrivée par mer. Tous n'ont pas emprunté les bons canaux, pourtant ils ont demandé l'asile depuis tous les coins du monde, souhaitant un jour faire partie des millions qui jouissent de notre pays généreux. L'inefficacité de nos politiques actuelles peut être rationalisée pour raccourcir la détention des véritables demandeurs d'asile. Les familles avec enfants seront sorties des centres de détention vers des logements communautaires, et des enquêtes privées seront mises en place pour ceux détenus plus de deux ans."
 AST_girt_by_border_patrol: "Entouré par les patrouilles frontalières"
 AST_girt_by_border_patrol_desc: "Australia might be an island, but that leaves it vulnerable to invasion by sea. Incidences in the water have put our existing border patrol in hotter waters than usual. Without a clear ability to safeguard our shores how can we expect our forces to keep this nation safe? With the Border Protection Bill there will be no doubt in our fleet's power to turn ships back, protecting officers from unjust legal action if they do."
 AST_the_pacific_solution: "La solution du Pacifique"
 AST_the_pacific_solution_desc: "Alors que l'immigration légale s'est tassée, l'immigration illégale n'a pas suivi. Des milliers de migrants débarquent chaque année sans papiers, et ce nombre ne semble qu'augmenter. Les infrastructures existantes étant débordées, des sites de détention offshore seront construits à Nauru et sur l'île de Manus, pour héberger les demandeurs d'asile le temps de statuer. Les deux nations seront équitablement indemnisées. Nous réduirons ensuite le territoire continental où une demande d'asile peut être valable, décourageant encore les resquilleurs."
 AST_for_bright_minds: "Pour les esprits brillants"
 AST_for_bright_minds_desc: "Les étudiants étrangers deviennent rapidement une source de revenus non négligeable pour nos meilleures universités. Seuls quelques-uns passent actuellement par nos visas d'études limités, mais si nous assouplissons un peu les critères, bien plus d'étudiants viendront de l'étranger, et bien plus d'argent ira au secteur éducatif."
 AST_strong_in_difference: "Fort dans la différence"
 AST_strong_in_difference_desc: "We've managed a population of different, culturally diverse peoples, that have amalgamated into a new Australian identity. We all look different and each have our different strengths, yet altogether we're building Australia. The workplaces are filled to the brim with bright minds and those who have been successful in their pursuit for this nation's dream. The dream of belonging, and as we also have, getting along."
 AST_tear_out_the_roots: "Éradiquer les racines"
 AST_tear_out_the_roots_desc: "It's well known many of our security troubles begin and end in Indonesia. Our strongest immediate neighbour, and one very much vulnerable to extremist elements. If an understanding could be reached between us, in particular a collaboration to root out insurgency cells within their nation, both parties would benefit. Laying the groundwork for closer cooperation in the future."
 AST_welcome_the_experts: "Accueillir les experts"
 AST_welcome_the_experts_desc: "Nous avons déjà certains des esprits les plus brillants, mais en inviter d'autres de l'étranger ne nous ferait pas de mal. Cela pourrait même lisser certains des obstacles que nous rencontrons en R&D. En utilisant le système SkillSelect déjà en place, nous pouvons étendre les visas aux migrants qualifiés de tous les coins du monde moderne."
 AST_protected_on_all_sides: "Protégé de tous côtés"
 AST_protected_on_all_sides_desc: "Tandis que le soleil se couche sur nos océans dorés, notre peuple peut se détendre en sachant que de tous les côtés de leur nation, patrouillant les eaux, nos patrouilles les protègent. Quand la presse sème la peur qu'un autre peuple débarque sur nos plages, ils sauront que ce n'est que de l'affolement, car le gouvernement les a dans le dos. Que leur avenir est assuré."
 AST_the_howard_doctrine: "La doctrine Howard"
 AST_the_howard_doctrine_desc: "Après notre intervention au Timor oriental en 1999, quelques journalistes ont commencé à forger ce terme, censé nous décrire comme un pourvoyeur de premier recours pour de nombreuses nations du Pacifique. Si c'est un constat juste, je crois que notre doctrine ne se limite pas à cette posture. \n\nAvant que je ne devienne Premier ministre, cette nation définissait trop étroitement sa place dans le monde. Notre gouvernement a la capacité de rééquilibrer la politique étrangère australienne pour mieux refléter le croisement unique de cultures et d'histoire que nous habitons. Le temps n'a fait que renforcer ma conviction : nous n'avons pas à choisir entre notre histoire et notre géographie. Nous occupons une position unique de souplesse, où nous pouvons rester fidèles à nos alliés et allégeances traditionnels tout en bâtissant et renforçant de nouveaux partenariats dans la région."
 AST_deputy_peacekeepers: "Casques bleus adjoints"
 AST_deputy_peacekeepers_desc: "Dans The Andy Griffith Show, Barney Fife est l'adjoint du shérif de la ville, Andy Taylor. Quand le shérif n'est pas là, c'est à Barney de maintenir l'ordre et de faire tourner la boutique. Le rôle de gendarme mondial des États-Unis est devenu incontesté depuis la chute du mur de Berlin, mais de nouvelles menaces apparaissent chaque jour, certaines trop près de l'Australie. Comme Barney, l'Australie est chargée de patrouiller le Pacifique pendant que les États-Unis sont ailleurs. Ce n'est pas une position facile, mais nous la tenons avec brio."
 AST_war_on_the_terrible: "Guerre contre l'horreur"
 AST_war_on_the_terrible_desc: "À notre époque, les définitions classiques et nos méthodes de lutte contre le terrorisme sont lamentablement dépassées. Ceux qui veulent nuire aux Australiens s'adaptent bien plus vite aux technologies d'aujourd'hui. Introduire une législation pour amender nos définitions juridiques du terrorisme et modifier les lois qui le punissent est un premier pas efficace. Renforcer les pouvoirs de détention et de surveillance de l'ASIO sera nécessaire pour rester à niveau, et donner à nos unités la réaction mobile pour étouffer les menaces avant qu'elles n'émergent."
 AST_new_wave_counter_terrorism: "Nouvelle vague de lutte contre le terrorisme"
 AST_new_wave_counter_terrorism_desc: "Même nos nouveaux amendements ne suffisent pas. Plus nous recevons d'informations sur des attentats imminents sur le sol australien, plus il est évident que nos pouvoirs doivent être multipliés. L'ASIO et la police devront être élargis. Des raids antiterroristes, la détention préventive et l'audace donnée à la police locale avec le « stop and search » feront sortir la menace. Nous savons que ce sera controversé, mais notre situation exige bien plus que des demi-mesures."
 AST_commit_to_foreign_intervention: "S'engager dans l'intervention étrangère"
 AST_commit_to_foreign_intervention_desc: "Le conflit a grandi sur presque tous les continents. L'exception, c'est l'Australie. La seule façon de garder les choses ainsi, et de continuer, c'est d'empêcher que le conflit ouvert ne déborde dans nos eaux. Pouvoir intervenir avant que ces menaces ne dégénèrent est essentiel. Le Moyen-Orient et l'Asie du Sud-Est sont des foyers de cellules terroristes, mais nous pouvons choisir où et comment intervenir si cela sert les intérêts de sécurité de notre nation."
 AST_place_rudd_in_the_fire: "Mettre Rudd au feu"
 AST_place_rudd_in_the_fire_desc: "Kevin Rudd semble devenir un nuisance croissante dans l'opposition alors que nous tentons de faire passer la législation. Pire, il gagne du terrain dans l'opinion. Il est actuellement ministre fantôme des Affaires étrangères, mais et si nous l'affections à notre propre comité étranger ? Le mettre à travailler sur la diplomatie dans le Pacifique. Non seulement cela nous protégerait des retours de flamme, mais cela détournerait son regard de la législation antiterroriste."
 AST_our_capacity_for_peace: "Notre capacité pour la paix"
 AST_our_capacity_for_peace_desc: "Rudd's efforts to get a dialogue going with the Chinese have actually borne fruit. They're willing to negotiate a combined peacekeeping initiative in the Pacific. An opportunity like this doesn't come often, and could allow us to demonstrate ourselves as equals to the Chinese, defining future cooperations. Less bending the knee, more sharing a common interest in safekeeping the Pacific."
 AST_off_to_delhi: "En route vers Delhi"
 AST_off_to_delhi_desc: "L'uranium reste notre plus grande réserve minérale inexploitée, et nos entreprises sont impatientes de trouver un nouveau partenaire d'exportation avant le début des forages. De toute évidence, l'Inde est le client évident. Une superpuissance émergente en Asie du Sud, assez forte pour imposer sa volonté sur la mer d'Arabie. Elle pourrait être un allié très utile à mesure que notre sphère s'étend, ou du moins un importateur fiable de notre uranium."
 AST_marks_gambit: "Le pari de Mark"
 AST_marks_gambit_desc: "Ever since Singapore's independence, the relationship we share has been nothing but cordial. It's only natural that we take the next steps. Our trusty trade minister Mark Vaile has been working on the first serious bilateral trade deal we've offered them in two decades. Simultaneously he's been making overtures to Thailand with a similar agreement for majority tariff free trade. Freeing the movement of goods in and out of Australia has been a core tenet for our reelection, and while the party will try to scoop up as much publicity for it as they can, the Australian people will be reaping the benefits."
 AST_fossil_fuels_for_yuan: "Combustibles fossiles contre yuans"
 AST_fossil_fuels_for_yuan_desc: "Our diplomacy with China has been going off without a hitch. Their latent efforts to rapidly industrialise have given them a hunger for coal, which is fortunately something we're plentiful of. Broaching a deal with them seems like a win win, and might make us a more appealing trade partner to other Asian nations."
 AST_partner_with_the_japanese: "S'associer aux Japonais"
 AST_partner_with_the_japanese_desc: "Le commerce asiatique dépasse rapidement celui de nos liens européens. À raison, nos intérêts s'étant déplacés bien plus localement. En affaires, les Japonais sont parmi les adversaires les plus rusés que l'on puisse rencontrer. Tout autant en diplomatie. Ils sont ouverts à nos exportations agricoles en échange de concessions de notre part. Abaisser les droits sur leurs électroniques et voitures était une demande évidente, mais nous soupçonnons qu'ils en demanderont davantage."
 AST_to_promote_our_spirit: "Promouvoir notre esprit"
 AST_to_promote_our_spirit_desc: "Nos efforts à l'étranger ont bien payé. Davantage voient l'Australie sous un nouveau jour, et comme un partenaire majeur dans le Pacifique. Le peuple devrait aussi voir nos réussites, et célébrer l'esprit australien pour ce qu'il est. Nous pouvons financer des publicités télévisées et des publications en ligne pour promouvoir notre nation, faisant aussi office de marketing touristique. Placer le logo de notre parti dans le coin inférieur ne fera pas de mal. C'est le moins que nous puissions obtenir pour nos efforts."
 AST_the_coalition_convention: "La convention de la Coalition"
 AST_the_coalition_convention_desc: "The convention is often where careers come to die, as their speeches and pleas for relevance go unheeded, while the other person is chosen as the next leader for the coalition. Sometimes, however, perseverance pays off. Now the coalition already has a leader strong enough to take the charge, and this time it's simply a matter of making a good speech."
 AST_wholesale_economics: "Économie de gros"
 AST_wholesale_economics_desc: "Le terme « wholesale » s'applique d'ordinaire aux détaillants ou aux débouchés industriels, mais certains l'ont utilisé pour décrire la privatisation d'actifs publics. Nous n'avons pas été impitoyables dans le dégraissage des inefficacités gouvernementales. Loin de là. C'est pourquoi nous devrions un peu accélérer. Il y a de nombreuses agences à tailler, et bien des recettes si nous trouvons les bons enchérisseurs. En contrepartie, quelques pistes d'investissement dans nos secteurs de la main-d'œuvre, si nous choisissons bien, ne mettront pas à mal nos beaux revenus."
 AST_finalize_the_telstra_sale: "Finaliser la vente de Telstra"
 AST_finalize_the_telstra_sale_desc: "The sale of Telstra has been a multi-year ordeal for the government accountants charged with untangling all of the corroded elements that had come to be a burden for us to manage. ASX has offered us a more than fair deal for the remaining assets, and any economic rationalist would have this finalized before they change their mind, which is what we intend to do."
 AST_allow_foreign_interests: "Autoriser les intérêts étrangers"
 AST_allow_foreign_interests_desc: "Comme Faust, parfois il faut pactiser avec le diable. Les optimistes du Parlement voudraient vous faire croire que l'Australie peut survivre seule. Qu'en quelque sorte cette nation insulaire pourrait devenir autosuffisante face à la mondialisation. Ils se trompent. Nos industries ne dureront que si nous laissons le capital étranger alimenter notre machine économique affamée de dollars, et les médias n'y font pas exception. Pour survivre, ils ont besoin d'investissement."
 AST_crush_the_unions: "Écraser les syndicats"
 AST_crush_the_unions_desc: "The union's presence in our economy and even in our politics has grown too wide and too brazenly in recent years. No organisation like theirs should be meddling in any of our affairs, let alone those of our workers. The Workchoice Act aims to amend that disregard and strip the unions of their presence in the factories. It won't completely kick them out, but it'll give business owners a fighting chance."
 AST_carve_up_medicare: "Découpez l’assurance-maladie"
 AST_carve_up_medicare_desc: "Something we never got around to in our first term was reexamining medicare. The program admittedly provides many Australians with reliable, state of the art medical services free of charge, but some do seem to be taking advantage of that offer. Inefficiencies plaguing the program have also ballooned its cost under Labor mismanagement. Like a well sharpened knife, we can cut off the fat that's hung on for just too long."
 AST_broadband_blueprint: "Schéma du haut débit"
 AST_broadband_blueprint_desc: "Nous avons la technologie. Nous pouvons reconstruire notre infrastructure réseau pour offrir à tous les Australiens des services internet de pointe, entreprises comme foyers. Si nous appliquons ce que nous savons et l'intégrons à l'infrastructure actuelle, nous pourrions concevoir un plan de déploiement national en très peu de temps."
 AST_curb_outside_interference: "Limiter les interférences extérieures"
 AST_curb_outside_interference_desc: "Ouvrir le marché et l'économie australiens au reste du monde a été une aubaine jusqu'ici, mais il y a une ligne que nous traçons dans la gestion de la nation. Approuver l'investissement étranger est le pain quotidien des affaires dans la plupart des secteurs, sauf les médias. L'effet de Kerry Packer sur nos médias d'information ne peut être exagéré, et nous pouvons trop bien imaginer quels intérêts étrangers pires nous pourrions inviter si les portes s'ouvraient. Pour l'instant, ces portes restent fermées."
 AST_bat_for_the_battlers: "Jouer pour les battlers"
 AST_bat_for_the_battlers_desc: "L'Australie ne devrait jamais être une nation définie par la classe ou l'envie, mais unie par la camaraderie et la réussite. Nos battlers, les Australiens de la classe moyenne, nous ont menés au bout plus souvent qu'à leur tour. Il n'est que juste de leur rendre un peu au travail. Sans les laisser aller trop loin dans les revendications, nous prêterons l'oreille aux syndicats pour quelques mesures modestes. Celles qui comptent vraiment."
 AST_back_australias_ability: "Soutenez la capacité de l’Australie"
 AST_back_australias_ability_desc: "Notre « crème de la crème » en matière de politique économique a été le programme Back Australia's Ability. Un vaste programme de renouvellement pour stimuler nos grands travaux sur quatre ans, ce qui devrait réduire drastiquement le chômage et remettre en circulation une grande part des recettes fiscales que nous avons absorbées."
 AST_feel_the_heef_ast: "Ressentir le HEEF"
 AST_feel_the_heef_ast_desc: "Le Higher Education Endowment Fund est l'un de nos récents projets de loi visant à canaliser l'investissement vers les établissements d'enseignement supérieur et nos sites de R&D. Au départ, nous serons les seuls à investir dans le fonds, mais à terme il est censé revenir au gouvernement, d'une façon ou d'une autre. Cela sonne un peu comme du vent, mais si les deux partis le soutiennent, il y a peut-être quelque chose qui en vaut la peine."
 AST_if_we_build_it: "Si nous le construisons"
 AST_if_we_build_it_desc: "Notre promesse de réélection de construire 21 nouveaux hôpitaux est arrivée à échéance, et les coûts ont malheureusement augmenté depuis nos précédentes estimations. Nos experts fiscaux recommandent d'externaliser la construction au secteur privé, ce qui nous coûtera encore cher. En contrepartie, nous pourrions économiser sur les coûts médicaux publics grâce à toutes ces nouvelles installations."
 AST_australian_made: "Fabriqué en Australie"
 AST_australian_made_desc: "Le logo Australian Made a été l'une des stratégies marketing les plus réussies jamais lancées par le gouvernement. L'icône était facile à reconnaître, et davantage de gens achetaient local grâce à elle. Désormais les dépenses publiques ont chuté, et il est difficile de choisir le local plutôt que les importations bon marché du Vietnam ou de Chine. Si nous intensifions la campagne, non seulement en local mais à l'étranger, pour dire qu'Australian Made est une garantie de qualité, nous pourrions bien trouver un nouveau débouché."
 AST_preserve_the_old_forests: "Préserver les vieilles forêts"
 AST_preserve_the_old_forests_desc: "L'une de nos fiertés a été les forêts anciennes de Tasmanie. On y trouve certains des plus hauts arbres à fleurs du monde, dépassant même 90 mètres ! C'est un trésor à contempler, aussi important pour cette nation que la Grande Barrière de corail à bien des égards. Étendre les protections actuelles à 170 000 hectares supplémentaires devrait bien empêcher leur perte, sans étouffer notre industrie du bois."
 AST_ets: "Échanger des émissions"
 AST_ets_desc: "Another piece of climate legislation making news in Parliament is the 'Emissions Trading Scheme.' Somehow Labor is still concocting these things, and for some reason there's a few in the party listening. Right now they've offered us a softball to preempt the scheme with a number of grants towards nuclear energy development. Nuclear energy isn't something we're supporting at present, but we can't kill it in the cradle, and if we can get anything from them to soften up the climate loons to our policy, we'll take it."
 AST_the_new_liberals: "Les nouveaux libéraux"
 AST_the_new_liberals_desc: "Like it or not, the party has changed. No more are we the small \"l\" Liberals of the 90s, but a professional force for traditional values. We've successfully blended economic liberalism with fiscal conservatism. The reality of the geopolitical issues are being acknowledged and dealt with, and Australians are being left with more in their pocket and less going to taxes. Frankly the nation is better off for it, and we're enjoying that with the mainstream voters support. The direction we move the party now could make or break our momentum, but it'll also have resounding effects for the generations relying on our guiding hand."
 AST_keep_them_in_line: "Les tenir en ligne"
 AST_keep_them_in_line_desc: "Notre parti a trop longtemps été miné par les complots et les coups internes. Comment le public peut-il avoir confiance en notre coalition si nous ne nous faisons même pas confiance ? Nous devrons « restructurer » le code du parti pour les contestations de leadership et restreindre la pratique aux circonstances les plus graves. Il ne faudra encourager que quelques Nationals à soutenir le changement."
 AST_secure_the_coalition: "Assurer la Coalition"
 AST_secure_the_coalition_desc: "While we don't always see eye-to-eye, our National friends have walked the line with us for almost a century. We're just like those peas in the pod. It's unlikely now, but a coalition split would damn our parties to never win another federal election again. Something like that shouldn't be left to fate. Rewriting the clauses for a split to make it virtually impossible for either side will keep them in our graces, good or not. Then we'll really be united, in spirit and written in stone."
 AST_entice_crossbenchers: "Attirer les crossbenchers"
 AST_entice_crossbenchers_desc: "Notre système politique s'appuie depuis des décennies sur le travail des indépendants. Ces mous du genou nous ont aidés à faire passer quelques lois, oscillant entre nous, l'opposition, ou l'abstention totale. Certains n'ont besoin que d'une petite douceur pour rentrer dans le rang. Quelques poignées de main ici, un peu d'investissement là, et nous en fidéliserons assez."
 AST_broaden_our_beliefs: "Élargir nos convictions"
 AST_broaden_our_beliefs_desc: "C'est presque un cliché de dire que notre parti s'est enlisé dans ses convictions. Après tout, nous sommes traditionalistes, c'est une position raisonnable. L'inconvénient, c'est que nous passons peut-être à côté de politiques précieuses que tout le parti ne soutient pas. Il est peut-être temps de s'asseoir et de parler avec les petits partis. Nous pourrions en apprendre deux ou trois."
 AST_axe_the_governor_general: "Écarter le gouverneur général"
 AST_axe_the_governor_general_desc: "Le référendum républicain a pu échouer en 99, mais cela ne veut pas dire qu'il nous faut un représentant d'un pays à l'autre bout du monde qui se mêle de nos décisions. Ils ont déjà limogé l'un de nos dirigeants, ils peuvent recommencer. Il est grand temps de les limoger. En passant par-dessus leur tête, directement auprès de la Reine, nous formulerons la demande officiellement, avec quelques « rapports » de malversation pour nous appuyer, et nous nous en débarrasserons nous-mêmes."
 AST_our_own_kings: "Nos propres rois"
 AST_our_own_kings_desc: "Now that the monarchy are moving to find a replacement, we can begin using the current processes to grind down the transition as much as possible. They'll be swimming in a sea of legal disputes and official inquiries so long it might be years before they can swear in another, and we'll have free rein over our policies, without any eyes from the crown."
 AST_prepare_the_successor: "Préparer le successeur"
 AST_prepare_the_successor_desc: "Parfois, mieux vaut s'arrêter tant que tout va bien. J'avais promis au mandat précédent de me retirer avant la prochaine élection. L'occasion est passée, mais il n'est pas trop tard de raccrocher et de préparer le prochain dirigeant à nous emmener plus loin. Je me souviens d'avoir lutté pour en arriver là, et voilà que j'envisage de tout lâcher."
 AST_peace_with_honour: "Paix dans l'honneur"
 AST_peace_with_honour_desc: "Et l'avenir du Parti libéral fut décidé..."
 AST_the_sydney_declaration: "La déclaration de Sydney"
 AST_the_sydney_declaration_desc: "The declaration was originally drafted and should be presented as Australia's commitment to meeting the Climate Change demands of the world at APEC. However, it serves a greater purpose than virtue signalling to our eastern friends that we're progressive in our causes. The very declaration itself demonstrates the weight we wield in diplomatic action. It announces that Australia is ready to engage with the world, and that we have the effect of causing real change when we do. We might be barely scraping into the top 10, but we're here now, and we're only moving up."
 AST_the_quad: "Le Quad"
 AST_the_quad_desc: "Les discussions avec le Japon et l'Inde sur l'aide aux catastrophes ont été si fructueuses qu'ils laissent entendre un canal diplomatique plus permanent. Le vice-président américain s'est même montré favorable à un pacte pour planifier et surveiller les récentes actions de la Chine dans le Pacifique. On a fini par retenir le nom de « Dialogue quadrilatéral de sécurité », mais pour l'instant on l'appelle le « Quad »."
 AST_negotiate_with_our_northern_neighbours: "Nos voisins du nord"
 AST_negotiate_with_our_northern_neighbours_desc: "Notre histoire avec la Papouasie-Nouvelle-Guinée a été largement positive ces dernières décennies, malgré quelques accroc. Ils sont restés l'un de nos plus grands partenaires commerciaux pour le caoutchouc, et maintenir cet arrangement est devenu une question de sécurité nationale. Nous avons invité leur Premier ministre pour sceller un accord en béton."
 AST_anzus_collaboration: "Collaboration ANZUS"
 AST_anzus_collaboration_desc: "Le traité ANZUS a, sans aucun doute, connu des moments difficiles. Il n'y a pas si longtemps, la Nouvelle-Zélande s'est fait éjecter pour avoir refusé l'entrée des sous-marins nucléaires américains dans ses ports. Quoi qu'il en soit, le traité est un peu comme un lien fraternel. Malgré le virage de la politique américaine, loin de l'Europe vers le Moyen-Orient : s'ils y sont, nous y sommes. Notre attention peut s'éloigner des voisins, mais c'est de toute façon un effort mondial."
 AST_an_american_treaty: "Un traité américain"
 AST_an_american_treaty_desc: "Since the Millennium Drought our farming lobbies have been urging us to make an agricultural deal with the Americans with the intent on lightening tariffs between us. A more liberal marketplace between us could create a sizeable new avenue for our produce, whilst our farmers are still recovering, and what better place to do it than with our friends in the states."
 AST_howard_of_arabia: "Howard d'Arabie"
 AST_howard_of_arabia_desc: "L'Australie reste une nation majoritairement chrétienne. Notre morale a ses origines au Moyen-Orient. Israël est l'un de nos plus solides partenaires là-bas depuis des décennies, et ils ont montré encore et encore leur détermination pour une démocratie de principe. On ne peut pas les laisser tomber quand ils ont besoin de nous. Une camaraderie plus forte avec eux est notre impératif religieux."
 AST_keep_security_regional: "Garder la sécurité régionale"
 AST_keep_security_regional_desc: "Autant nous nous sommes aventurés outre-mer au Moyen-Orient, nos priorités ont toujours été nos voisins immédiats. Les nations insulaires du Pacifique regardent vers nous pour leur sécurité désormais, et c'est bien ainsi. L'Australie a l'obligation morale de les garder en sécurité et à l'abri des éléments radicaux tandis que nous grandissons en puissance régionale. Nos démarches auprès d'eux doivent le refléter."
 AST_preventative_measures: "Mesures préventives"
 AST_preventative_measures_desc: "On ne met pas ses bottes après la morsure du serpent. Dans le bush, la première chose à avoir, ce sont les bottes, et la deuxième un gros bâton. Cette idée, aussi rudimentaire soit-elle, doit servir pour notre défense à l'étranger. On ne part pas les mains vides, et on ne laisse pas nos voisins en danger sans un peu de protection."
 AST_dissuade_the_middle_kingdom: "Réclamations en Papouasie"
 AST_dissuade_the_middle_kingdom_desc: "Our dominance in the region hinges on preventing Indonesia from surpassing us geopolitically, and it's a situation that may be easier to manage if we isolate them. The nationalists in Papua New Guinea have been petitioning us to recognise their claim on West Papua for years now. Stirring up some border tension between them might be just the thing we need to brittle the friendship, and bring Papua New Guinea closer to the fold."
 AST_the_indonesian_ultimatum: "Ultimatum indonésien"
 AST_the_indonesian_ultimatum_desc: "Conflict with Indonesia has become a common occurrence as of late. No matter our stance, or the extent of our collaboration, they cannot seem to grapple with the radical elements within the nation. We can issue them an ultimatum allowing us to send our own peacekeeping operation to Aceh and effectively occupy the region until it can manage itself as an independent nation. We've done it before, successfully, we can do it again. If they refuse we can use every sanction under the sun until it gets them back at the table."
 AST_a_visit_from_malaysia: "Une visite de la Malaisie"
 AST_a_visit_from_malaysia_desc: "Peu de pays ont été aussi francs et sincères dans leurs communications que la Malaisie. Ils nous ont rendus visite maintes fois, des dirigeants aux ministres subalternes, et les pourparlers commerciaux se sont toujours bien passés. Peut-être est-ce notre héritage commun du Commonwealth, mais un profond respect s'est tissé entre nos nations. Cette fois, les discussions portent sur nos exportations agricoles, qui ont certes été restrictives pour des raisons de sécurité. Ils demanderont probablement d'assouplir les lois."
 AST_peacekeeping_in_somalia: "Maintien de la paix en Somalie"
 AST_peacekeeping_in_somalia_desc: "Bien que d'abord prometteur, le gouvernement de transition somalien est dans une position précaire après le conflit des seigneurs de guerre, et le pays s'est de fait disloqué. La crise humanitaire en cours a suffi à nous alerter, et le gouvernement implore désormais une intervention extérieure. Ce pourrait être l'occasion d'exercer nos casques bleus sans s'impliquer directement dans le conflit."
 AST_the_coal_family: "La famille du charbon"
 AST_the_coal_family_desc: "Just like the American dream of the 50s, many idyllic Australians are living a traditional life of self determination. Frankly they probably make up a good chunk of our voterbase, and why not? It's just the sort of way we encourage Aussie families to live. Independent and happy. We can return the favor by chipping away at the policies that prevent homes from being built, as well as cutting a few land taxes to ease the burden. Our families shouldn't be punished for owning their own bit of our beautiful land."
 AST_the_abbott_government: "Le gouvernement Abbott"
 AST_the_abbott_government_desc: "À compter d'aujourd'hui, je déclare que l'Australie change de direction et qu'elle est de nouveau ouverte aux affaires. Ouverte et dirigée par un gouvernement qui maximise le potentiel de chacun. Pas seulement de ceux qui ont voté pour nous. \n\nUn gouvernement, pour le dire simplement, pour tous et pour le plus grand nombre. Ceux que le grand Menzies décrivait comme des « porteurs, pas des assistés ». Les familles oubliées seront entendues. Les impôts pesants disparaîtront, les bateaux seront stoppés, et le budget reviendra vers un excédent comme on n'en a jamais vu ni entendu. \n\nSans perdre davantage de temps, au travail.\nSans plus perdre de temps, au travail."
 AST_expand_the_executive: "Élargir l'exécutif"
 AST_expand_the_executive_desc: "A paradox exists between our mission to decrease the size of government, while increasing our capability to get the job done. When the captain is steering the ship, his calls need to be heeded without wasting time consulting the entirety of Parliament."
 AST_honour_the_party: "Honorer le parti"
 AST_honour_the_party_desc: "Notre cabinet doit refléter l'héritage du parti si nous voulons être acceptés à l'avenir. L'œuvre de John Howard pour redéfinir le Parti libéral a été monumentale pour s'adapter à cette nouvelle ère de la politique moderne, et embaucher du personnel de son gouvernement apporte une multitude d'expérience."
 AST_building_stronger: "Construire plus fort"
 AST_building_stronger_desc: "Nous savons au plus profond de nous qu'il n'y a pas de société sans une économie pour la soutenir, et pas d'économie sans des entreprises qui peuvent faire du profit. De même, la confiance dans la solidité de nos finances a atteint un point bas, malgré notre optimisme habituel. Notre tâche maintenant est de reconstruire, assez fort pour rendre n'importe quel Australien fier."
 AST_the_advisory_council: "Le conseil consultatif"
 AST_the_advisory_council_desc: "The Liberals shouldn't be seen as the party against reconciliation. After all, it was Harold Holt who ended the White Australia Policy. A Council will be formed to keep us in the know on Indigenous affairs, and keep the narrative focused on practical changes."
 AST_cut_the_programs: "Supprimer les programmes"
 AST_cut_the_programs_desc: "We can't endlessly subsidize the remote communities that aren't contributing to the government's reconciliation efforts. Indigenous communities that are receiving funding, and don't toe the line will have their budgets cut. Pure and simple."
 AST_its_the_constitution: "C'est la Constitution"
 AST_its_the_constitution_desc: "Ce qu'il nous faut maintenant, c'est mettre fin à ce silence retentissant dans notre Constitution, l'omission des peuples autochtones. Un tel sentiment exige une décision hors du Parlement, avec un référendum pour reconnaître les Aborigènes et les insulaires du détroit de Torres comme nos Premières Nations."
 AST_compete_on_the_farms: "Concourir sur les fermes"
 AST_compete_on_the_farms_desc: "L'agriculture familiale est l'épine dorsale du secteur agricole du pays depuis la Fédération. Des fermes de la Tasmanie à l'Australie-Occidentale, tenues par des générations d'Australiens, se font écraser par de plus grandes entreprises. Nous ne resterons pas compétitifs sans soigner nos agriculteurs par des prêts accessibles et l'amélioration de l'approvisionnement en eau. Notre politique doit prioriser leur indépendance."
 AST_develop_the_northern_territory: "Développer le grenier"
 AST_develop_the_northern_territory_desc: "Un plan a été avancé pour plusieurs projets de développement du Territoire du Nord, visant à en faire une puissance industrielle et agricole. En le signant, nous cultiverons un État trop souvent ignoré par les gouvernements précédents, et créerons potentiellement le grenier de l'Australie et du Pacifique pour des décennies."
 AST_getting_in_there: "Entrer là-dedans"
 AST_getting_in_there_desc: "Malheureusement, les routes d'entrée et de sortie du Territoire du Nord sont dans un triste état. En plus, la ligne ferroviaire The Ghan devra être modernisée pour soutenir les matériaux qui y entreront."
 AST_funnel_in_workers: "Entonnoir chez les travailleurs"
 AST_funnel_in_workers_desc: "Manpower is going to be needed to get our operations underway. Nothing that a few preferential visas and relocation grants can't fix."
 AST_project_manton: "Projet Manton"
 AST_project_manton_desc: "The Manton Dam used to be the premier supply of water and electricity in the region until Darwin built their own dam. The costs for renovating and reactivating the dam to supply the nearby communities is surprisingly within budget, and would tangibly demonstrate our commitment to building up NT."
 AST_compassionate_government: "Un départ équitable"
 AST_compassionate_government_desc: "Dans ce pays, si tu t'y mets, tu auras ta chance. Cela pourrait bien être le mantra du parti sous notre direction. Notre peuple doit être récompensé pour ses efforts, et pour ceux qui ne sont pas au mieux pour démarrer, nous les soutiendrons d'une main légère. Ce n'est pas un droit, c'est l'équité."
 AST_keep_the_fire_burning: "Garder le feu allumé"
 AST_keep_the_fire_burning_desc: "Le trou que l'aide sociale brûle dans la caisse de l'État nous coulera si nous n'y mettons pas le holà. En même temps, les programmes commencent à avoir de sérieux résultats positifs sur la population. S'arrêter maintenant pourrait annuler des années de travail. Il faudra plutôt réaffecter des fonds pour couvrir les coûts actuels, et espérer que Keynes avait raison à long terme."
 AST_national_curriculum_review: "Révision du programme"
 AST_national_curriculum_review_desc: "Outre le biais politique habituel qui s'infiltre dans nos programmes, le financement public semble devenu déséquilibré en excluant nos écoles rurales. Chaque école d'Australie mérite une chance équitable, et chaque élève une éducation qui vante le succès de la civilisation occidentale, pas seulement ses problèmes. Nous devrions tous être fiers de la nation où nous avons grandi, et du système éducatif qui y va avec."
 AST_another_baby_boom: "Un autre baby-boom"
 AST_another_baby_boom_desc: "L'amour est une belle chose. Notre gouvernement le sait mieux que la plupart. Pendant la campagne, nous avons promis une refonte du congé parental payé, offrant aux nouvelles mères 26 semaines de congé au niveau de leur salaire. Beaucoup de résistances se sont élevées dans le parti, mais mettre les mères de la nation en premier est la plus grande priorité."
 AST_responsible_governance: "Gouvernement responsable"
 AST_responsible_governance_desc: "Les dépenses insouciantes de notre gouvernement appellent pratiquement une crise budgétaire. La plus grande responsabilité du parti au pouvoir est de prendre les décisions difficiles. On ne peut pas continuer à payer le crédit immobilier avec la carte de crédit."
 AST_the_welfare_bloat: "Il n'y a pas de telle société"
 AST_the_welfare_bloat_desc: "Public welfare is simply too easy to access on the existing system. Anyone with bad luck and a bad back can get the full benefits of Centrelink and Medicare. The level of entry needs to be tightened, and a few needless programs are going to be phased out if we're getting anywhere with cutting down on the budget bloat."
 AST_cashless_welfare: "Paiements sans numéraire"
 AST_cashless_welfare_desc: "With the trials in the Northern Territory communities coming to a close, we're confident that a small scale rollout is feasible. Replacing direct deposits with government made bank cards, and keeping expenses limited to essentials is going to keep the vulnerable of our community out of the casinos or passed out on the streets."
 AST_up_the_gst: "Une taxe de plus"
 AST_up_the_gst_desc: "La plus grande réforme de notre système fiscal n'a que quelques années, mais a déjà d'immenses bénéfices pour le pays. Bien que controversée à l'époque, nos entreprises jouissent désormais d'un système plus simple et les recettes supplémentaires ont financé nos programmes les plus coûteux. L'augmenter un tout petit peu permettra de percer les douleurs budgétaires actuelles."
 AST_national_audit_commission: "Commission nationale d'audit"
 AST_national_audit_commission_desc: "Les dépenses inutiles dans l'administration sont devenues comme la boue sous les bottes, tant il est difficile de s'en débarrasser. Créer une commission générationnelle dédiée à les nettoyer dans toute l'administration est la meilleure voie. Tout sera sur la sellette."
 AST_investigate_union_corruption: "Guerre aux syndicats"
 AST_investigate_union_corruption_desc: "Que les tabloïds sachent que nous déclarons la guerre aux méfaits. Guerre à la corruption, et déclaration qu'il y a certaines normes dans notre société. Que vous soyez dirigeant d'entreprise ou syndical, vous devez obéir à la loi."
 AST_the_energy_crisis: "La crise énergétique"
 AST_the_energy_crisis_desc: "L'obsession de la protection climatique nous a tiré dans le pied juste à la porte d'un armageddon énergétique. Même quand nous pouvons le contrôler, les besoins de notre peuple ne sont pas satisfaits, et la hausse des coûts a mis plus de gens en péril financier que toute autre crise que cette nation a connue. Notre gouvernement doit enfin mettre le pied sur le problème."
 AST_duttons_plan_focus: "Plan de Dutton"
 AST_duttons_plan_focus_desc: "Notre ministre de la Santé, Peter Dutton, s'est aventuré dans le débat énergétique avec une solution pour le moins clivante. Assouplir les restrictions nucléaires australiennes pour permettre la construction de centrales et régler une bonne fois la pénurie. Nous avons passé de bonnes décennies à fuir cette perspective, et pour de bonnes raisons, mais ce pourrait être la solution radicale que nous cherchons."
 AST_look_below: "Regardez ci-dessous"
 AST_look_below_desc: "The answer to all our problems has always been beneath our feet. Greenies fear it, Labor ignores it, but the Coalition respects it. No renewable source is going to replace our God-given source of power, cultivated for us since the death of the dinosaurs."
 AST_build_it: "Construisez-le"
 AST_build_it_desc: "L'un des atouts du charbon, c'est sa beauté. Nous avons certaines des plus belles centrales à gaz de ce côté du monde, bien plus agréables que ces éoliennes bruyantes et laides. En activant les mesures d'urgence de l'AEMO pour procurer plus de générateurs et construire nos propres centrales, nous pouvons en bâtir davantage en très peu de temps."
 AST_deny_it: "Niez-le"
 AST_deny_it_desc: "Un malaise spirituel sape le moral et l'ambition de ce qui fut un pays sans limites. Les concessions au changement climatique ont sabordé notre production d'énergie, tout en encourageant nos voisins à ramasser l'industrie que nous avons perdue. On ne peut pas remonter le temps, mais on peut ôter les chaînes."
 AST_friend_of_the_mines: "Ami des mines"
 AST_friend_of_the_mines_desc: "After a chat with our friend at Newscorp, it's clear that the squeeze on our mining corporations needs to be tended to. Starting with shifting our approach to mining rights. The Caval Ridge coal mine in Queensland has been awaiting approval for awhile now. It'd show a whole lot of promise if we went down there and approved the opening ourselves."
 AST_light_on_the_hill: "Une lumière sur la colline"
 AST_light_on_the_hill_desc: "L'Australie a été un phare démocratique dans le Pacifique pendant des décennies, et maintenant c'est une lumière au sens propre. Les Australiens pourront dormir tranquilles avec un accès à une électricité abordable et abondante, chauffant et refroidissant les foyers du pays. Un testament des accomplissements de notre gouvernement, et du progrès de la nation."
 AST_acquire_enrichement: "Petites roches vertes"
 AST_acquire_enrichement_desc: "C'est une honte que nous extrayions tant de ce minerai sans aucune installation d'enrichissement pour réellement l'utiliser. Nous pouvons rapidement en importer et assembler une chez nos amis américains, tout en court-circuitant quelques recommandations pour la mettre en service à temps."
 AST_convert_the_ansto_reactor: "Convertir le réacteur ANSTO"
 AST_convert_the_ansto_reactor_desc: "De toute évidence, nous avons déjà un réacteur à Sydney. Ce n'est peut-être pas exactement le modèle qu'il faut pour produire de l'électricité, mais nous pouvons faire travailler nos têtes scientifiques pour le préparer à la production. Ce n'est pas de la physique nucléaire, après tout."
 AST_tweak_the_restrictions: "Plus jamais retenu"
 AST_tweak_the_restrictions_desc: "Beaucoup de choses retiennent le pays loin d'une énergie sans émissions. En particulier les voix écolos qui dressent des « zones dénucléarisées » un peu partout. En matière d'urgence nationale, ces zones doivent DISPARAÎTRE."
 AST_first_stop_jakarta: "Premier arrêt à Jakarta"
 AST_first_stop_jakarta_desc: "Nous pouvons commencer notre mandat en envoyant un message fort : la politique étrangère australienne reste régionale. Nous ne pouvons pas nous permettre de patiner en Europe quand les nations d'ici ont plus que jamais besoin de nous. Moins Genève, plus Jakarta."
 AST_sail_steady: "Voile stable"
 AST_sail_steady_desc: "Julie Bishop, notre ministre des Affaires étrangères, a insisté sur une « diplomatie économique » pour ce mandat, axée sur les programmes d'aide et le libre-échange. Franchement, ce n'est pas trop différent des gouvernements avant nous, mais quand des millions de vies sont entre vos mains, mieux vaut ne pas trop agiter le bateau."
 AST_the_anglosphere: "L'Anglosphère"
 AST_the_anglosphere_desc: "L'Australie a un héritage autochtone, une fondation britannique et un caractère multiculturel. Ainsi, notre lien avec les Anglais est aussi proche que celui de frères. Nous parlons la même langue, nous aimons le rugby, et nous luttons pour les mêmes idéaux démocratiques. Notre camaraderie est sacrée, et elle doit le rester."
 AST_o_canada: "Ô Canada!"
 AST_o_canada_desc: "Nos frères du Commonwealth. Si loin, et pourtant nos liens sont aussi profonds que ceux de deux vieux amis. Cela ne ferait pas de mal de reprendre contact et de discuter de l'opportunité d'investissement que nos diplomates mijotent."
 AST_swell_the_support: "Gonfler le soutien"
 AST_swell_the_support_desc: "It's no secret that our defense recruitment has slumped since the 90s. Widening the eligibility requirements, recruitment campaigns and opening up defense internships is an appropriate first step to filling our mandatory roles."
 AST_of_knights_and_dames: "Des chevaliers et des dames"
 AST_of_knights_and_dames_desc: "Les « chevaliers et dames de l'ordre d'Australie » étaient autrefois la plus haute distinction pour un service extraordinaire au pays. Comme d'habitude avec la plupart des gouvernements travaillistes, le titre a été jeté sous leur règne. Maintenant que nous sommes de retour, nous devons restaurer une part de notre héritage qui n'aurait pas dû être oubliée."
 AST_american_integration: "Intégration américaine"
 AST_american_integration_desc: "Nos alliés de l'autre côté du Pacifique évoquent depuis un moment l'idée d'un exercice d'entraînement conjoint. Les bénéfices de pouvoir utiliser notre nouvel équipement en situation réelle seraient déjà inestimables pour nos forces, et cela pourrait nous rapprocher des États-Unis."
 AST_square_kilometre_array: "Tableau de kilomètres carrés"
 AST_square_kilometre_array_desc: "In a bid between us and New Zealand to be a part of the project, as expected, we won out. Between us, South Africa and the United Kingdom, we get to be part of one of the most ambitious astronomy projects in our lifetime. Our job is to construct over 130,000 tree-like antennas over a 21 kilometre area. In theory allowing us to survey the sky over 10,000 times quicker than we can now. It's all very high tech, and it's an exciting opportunity for our scientists in the field."
 AST_joint_defense_tech: "Technologies de défense conjointes"
 AST_joint_defense_tech_desc: "L'alliance Five Eyes est devenue l'un de nos plus solides atouts dans la guerre contre la terreur, et dans le renseignement en général depuis près de 60 ans. Établir une division de recherche serait assez simple, et cela aidera à combler les écarts technologiques entre nous."
 AST_the_submarine_corporation: "La société des sous-marins"
 AST_the_submarine_corporation_desc: "Dans nos efforts pour doter la flotte de nouveaux sous-marins, l'ASC vient à notre aide. Premier constructeur naval depuis les années 80, récemment nationalisé, la société est à notre disposition."
 AST_new_columbo_plan: "Nouveau plan Colombo"
 AST_new_columbo_plan_desc: "Après la Seconde Guerre mondiale, le plan de Colombo visait à reconstruire une Asie dévastée, en envoyant nos experts techniques et en laissant les leurs étudier chez nous. Nous pouvons appliquer les mêmes principes pour aider une Asie en développement, en permettant à leurs étudiants de fréquenter nos universités avec des visas accélérés."
 AST_growing_demands: "Relever le défi"
 AST_growing_demands_desc: "Aucun gouvernement ne peut être économiquement responsable au détriment de la sécurité nationale. L'ADF doit toujours pouvoir répondre à l'appel de n'importe quel conflit. Moins que cela nous mettrait en mauvaise posture."
 AST_visiting_the_rainbow_nation: "La nation arc-en-ciel"
 AST_visiting_the_rainbow_nation_desc: "Nous avons une histoire colorée avec l'Afrique du Sud, jusqu'à soutenir leurs troupes pendant la seconde guerre des Boers. Près de 200 000 d'entre eux vivent en Australie, et le nombre continue de croître avec l'afflux récent de demandes d'asile. Alors que les tensions montent, la pression s'accroît pour que nous prenions position."
 AST_indonesian_intervention: "Sécuriser l'archipel"
 AST_indonesian_intervention_desc: "La situation en Indonésie s'est détériorée trop longtemps. Si nos efforts de 1999 furent, dans l'ensemble, un succès, une implication plus poussée sera nécessaire pour étouffer la menace du fondamentalisme islamique."
 AST_an_oceanic_alliance: "Une alliance océanienne"
 AST_an_oceanic_alliance_desc: "Les affaires de ceux du Pacifique sont ressenties et gérées par nous ici. Nous avons dû compter les uns sur les autres plus souvent qu'à notre tour, et cela a cultivé une unité profonde entre nous."
 AST_aukus_abbott: "AUKUS"
 AST_aukus_abbott_desc: "Notre engagement commun pour un ordre international fondé sur des règles avec le Royaume-Uni et les États-Unis est des plus solides. Nous avons traversé les tranchées dans presque tous les grands conflits du siècle dernier. Approfondir cette coopération est donc le meilleur chemin vers un monde plus sûr."
 AST_the_greatest_statesman: "Le plus grand homme d'État"
 AST_the_greatest_statesman_desc: "La position de l'Australie s'est solidifiée dans le Pacifique. Une belle nation qui n'est plus observatrice de la croissance asiatique, mais participante active de son essor. Les historiens verront que c'est à ce moment que nous avons engagé le pays sur la bonne voie."
 AST_the_asian_century: "Le siècle asiatique"
 AST_the_asian_century_desc: "Quoi qu'en disent les critiques, nous ne fonçons pas en Asie sans plan. Il n'en faut pas beaucoup pour voir que les pays d'Asie du Nord ont accompli une transformation économique sans égale dans l'histoire humaine en quelques décennies seulement. Nous devons leur signaler que l'Australie est ouverte aux affaires, et prête à prendre sa part de cette transformation."
 AST_our_greatest_partner: "Notre partenaire le plus proche"
 AST_our_greatest_partner_desc: "La Chine a accompli un miracle en sortant des centaines de millions de la pauvreté vers la classe moyenne. De même, notre partenariat avec elle continue de s'épanouir bien au-delà de celui de toute autre nation du Pacifique. Malgré ceux au gouvernement qui poussent l'Australie à choisir entre intérêts économiques et sécuritaires, le fait demeure : on ne se fait pas de nouveaux amis en perdant les anciens ; et on ne renforce pas certaines amitiés en en affaiblissant d'autres."
 AST_indian_investments: "Investissement indien"
 AST_indian_investments_desc: "Quelques sociétés indiennes ont indiqué leur intérêt à étendre leur production dans le pays et à s'installer à Sydney. Les restrictions actuelles sur les entreprises étrangères ont ralenti le processus, mais une approbation directe du [GetASTLeaderTitle] suffirait à démarrer rapidement et à créer des emplois."
 AST_sanpou_yoshi: "Sanpo Yoshi"
 AST_sanpou_yoshi_desc: "Sanpo Yoshi is an old Japanese term dictating that every transaction must benefit the seller, the buyer and society at large. A \"triple-win\" if you will. Our current agreements with the Japanese in regards to trade are anything but a win. A serious trade imbalance exists between us that, until rectified, is driving a wedge between our nations."
 AST_seoul_refineries: "Raffineries de Séoul"
 AST_seoul_refineries_desc: "Depuis la guerre de Corée, nous avons conservé des liens très étroits avec le gouvernement sud-coréen, militairement et économiquement. Avec le succès de leur nouvelle base industrielle à Séoul, un accord pour raffiner notre propre pétrole nous épargnerait bien des ennuis, et mettrait les choses en marche bien plus tôt."
 AST_australian_exceptionalism: "Exceptionnalisme australien"
 AST_australian_exceptionalism_desc: "Un ensemble unique de vertus existe dans cette nation. Plutôt qu'un mandat divin ou une qualité innée non méritée, les nôtres reposent sur les générations qui ont fait les choix difficiles et les sacrifices pour nous mener à l'aube nouvelle. Cette tradition doit continuer, et l'Australie sera préservée à tout prix."
 AST_stop_the_boats: "Stoppez les bateaux"
 AST_stop_the_boats_desc: "Le volume d'entrées illégales et de noyades en mer, alimenté par les passeurs, est la plus grande crise que la nation ait connue depuis des années. Notre spécialiste des frontières, Scott Morrison, a conçu une opération de type militaire pour garder nos côtes en sécurité et inverser la marée, avec des patrouilles renforcées et la suppression des visas de protection permanente pour dissuader les resquilleurs de prendre le risque."
 AST_raise_the_threat_level: "Relever le niveau de menace"
 AST_raise_the_threat_level_desc: "La menace terroriste est hélas devenue un fait de la vie, et malheureusement certains citoyens et résidents australiens nous veulent du mal. Employer plus de sécurité dans les aéroports, bases, bâtiments gouvernementaux et grands événements publics va devenir une nécessité."
 AST_tighten_the_flow: "Resserrer le flux"
 AST_tighten_the_flow_desc: "L'idée d'une Australie multiculturelle n'a peut-être pas échoué, mais à nos niveaux actuels l'afflux est tout simplement trop élevé pour être soutenable. Compte tenu des besoins de nos citoyens, durcir ce flux est la seule prochaine étape."
 AST_prevention_measures: "Mesures de prévention"
 AST_prevention_measures_desc: "Il faut une main ferme au volant en matière d'intervention. Le bon coup décisif peut arrêter une menace dans l'œuf. À tout le moins, garder l'option d'agir quand on le peut, disponible au moment où nous en avons le plus besoin."
 AST_wielding_the_stick: "Brandir le bâton"
 AST_wielding_the_stick_desc: "Working alongside one of the largest and most trusted weapons producers we've organised the construction of two new manufacturing plants, aimed at supplying us with the weapons of today, for the battles tomorrow. It's a nifty motto, I know."
 AST_deployment_mandate: "Mandat de déploiement"
 AST_deployment_mandate_desc: "Notre mobilisation rapide pour la préparation au combat a été cadencée avec quelques objectifs pour rester sur la bonne voie. Les atteindre donnera la confiance nécessaire pour justifier la hausse soudaine des dépenses, et démontrera ce dont nous sommes vraiment capables."
 AST_employ_reserves: "Employer des réservistes"
 AST_employ_reserves_desc: "Le devoir premier des réserves de la nation est d'assister lors des catastrophes naturelles et urgences intérieures. Considérant que notre défense est une urgence intérieure, nous les emploierons dans les zones non couvertes par le personnel à temps plein, libérant des forces pour le déploiement."
 AST_let_them_serve: "Laissez-les servir"
 AST_let_them_serve_desc: "La politique de recrutement actuelle est trop restrictive pour nos plans d'expansion. Ouvrir le programme aux stages de défense et offrir un allègement de dette aux postulants fera gonfler nos effectifs aux niveaux requis."
 AST_incorporate_them: "Incorporez-les"
 AST_incorporate_them_desc: "We already have a substantial program aimed at putting welfare participants to work on public works. Now we can redirect them to our military industries, taking some of the weight off our ADF forces."
 AST_a_shining_fleet: "Une flotte brillante"
 AST_a_shining_fleet_desc: "Depuis la fin de la guerre froide, nos infrastructures navales ont été laissées à la décrépitude jusqu'à devenir une vulnérabilité. Notre capacité à construire des navires a virtuellement disparu. En commençant par relancer nos chantiers d'État, l'effort sera mené par la nouvelle Australian Naval Infrastructure, et bientôt notre nation reviendra sur les flots."
 AST_assistance_from_langley: "Aide de Langley"
 AST_assistance_from_langley_desc: "L'Oncle Sam a déjà mis la main à la poche pour nous ; si nous le demandons, ils seront sûrement prêts à nous aider côté renseignement. Comme on dit, savoir, c'est déjà la moitié de la bataille."
 AST_our_fight: "Notre combat"
 AST_our_fight_desc: "Our journey ahead is one we must make on our own. Not strictly on our own, of course, but we need to show that Australia has the capability to arm itself and fight its own battles. We are a nation of doers after all."
 AST_asian_partnership: "Partenariat asiatique"
 AST_asian_partnership_desc: "On n'est que la moitié de soi sans ses amis. Les pays d'Asie ont été plus que des amis au fil des ans, et le Japon en particulier nous a accompagnés main dans la main pendant notre réarmement. Nous mijotons un accord pour leur acheter un certain nombre de sous-marins afin de densifier la flotte, et il est primordial de le mener à bien."
 AST_accelerate_the_timeline: "Accélérer le calendrier"
 AST_accelerate_the_timeline_desc: "Alors que notre fenêtre de préparation se referme, une production de dernière minute devra être accélérée. Il faut cuire nos œufs un peu plus vite."
 AST_in_our_backyard: "Dans notre jardin"
 AST_in_our_backyard_desc: "La Royal Navy sillonne l'Indo-Pacifique depuis près d'un siècle, depuis sa formation en 1911. Au fil de deux guerres mondiales, nous avons appris des leçons inestimables, y compris comment projeter la force au large de ces côtes. Cette expérience sera mise à l'épreuve pour les épreuves à venir."
 AST_counter_the_island_chain: "Contrer la chaîne d'îles"
 AST_counter_the_island_chain_desc: "Ever since the 1940s China has employed a campaign of intimidation and island grabbing to solidify their claim on the South China Sea. While expansion was somewhat manageable in the past, their latest success with artificial islands has amplified the threat. If we don't put our foot down while we can, anywhere north of us could become the next 'South China Sea.'"
 AST_dealings_in_kuala_lumpur: "Tractations à Kuala Lumpur"
 AST_dealings_in_kuala_lumpur_desc: "Mineral trade between us and Malaysia has risen to the point that their diplomats have contacted us to discuss a trade agreement. Potentially streamlining an already highly profitable flow of goods. While we do, we could introduce terms for a neutrality agreement between us. Keeping them from engaging with China's growing sphere."
 AST_guadalcanal_garrison: "Garnison de Guadalcanal"
 AST_guadalcanal_garrison_desc: "Après le début de la Seconde Guerre mondiale et l'invasion des îles Salomon par le Japon impérial, ils tentèrent d'utiliser l'île comme rampe de lancement contre notre pays. Certains des combats les plus intenses eurent lieu sur ces îles, et nous ne pouvons pas risquer qu'un autre pays y prenne pied à nouveau."
 AST_mutual_defense: "Défense mutuelle"
 AST_mutual_defense_desc: "Nous ne pouvons pas patrouiller le Pacifique seuls, et l'un de nos plus proches alliés depuis la fin de la guerre froide, malgré une histoire mitigée, a été le Japon. La façon dont ils se sont, pour ainsi dire, réinventés, n'est rien moins qu'admirable. Nous aurons besoin d'eux pour le conflit à venir."
 AST_due_reparations: "Réparations en retard"
 AST_due_reparations_desc: "Si la sécurité conjointe est tentante, obtenir ce qui nous est dû pour la Seconde Guerre mondiale est un peu plus haut dans nos priorités. Plus de 27 000 Australiens ont perdu la vie, dont plus de 64 % en combattant les forces japonaises, et nous avons dépensé près de 3 milliards de livres pendant la guerre. Sans même parler du bombardement de Darwin. Une réparation doit être versée."
 AST_pukpuk_treaty: "Le traité Pukpuk"
 AST_pukpuk_treaty_desc: "Nous tournons autour de l'idée d'une coopération de défense plus étroite avec la Papouasie-Nouvelle-Guinée depuis des années. Combiner nos commandements militaires offre une occasion efficace de contrer la sphère d'influence croissante de la Chine, et d'affirmer une influence plus directe sur notre voisin amical."
 AST_the_indonesian_solution: "Prendre l'Indonésie"
 AST_the_indonesian_solution_desc: "L'Indonésie est une épine dans notre pied depuis des décennies, et le temps des négociations est révolu. Une gestion directe sera nécessaire. Nous rétablirons l'ordre dans la région."
 AST_island_leasing: "Location d'île"
 AST_island_leasing_desc: "Les îles de Nouvelle-Calédonie occupent une position stratégiquement cruciale sur notre flanc nord-est. Pouvoir y positionner nos troupes nous permettrait de créer une sorte de mur de fer autour de toute la mer de Corail. Heureusement, nous sommes en position de louer des droits de basage sur les îles auprès de nos amis français."
 AST_the_middle_power: "La puissance moyenne"
 AST_the_middle_power_desc: "Getting South Korea on our side would produce an 'achilles heel,' so to speak, on China. A knife right in the gut if a conflict were to erupt between us, and the opportunity is too good not to pursue."
 AST_fuel_the_grudge: "Nourrir la rancune"
 AST_fuel_the_grudge_desc: "La dernière pièce sur l'échiquier. Une fois le seuil franchi, plus de retour en arrière. Notre politique devra s'éloigner de la Chine et se tourner vers Taïwan. Si nous les embarquons, tout le reste devrait s'emboîter."
 AST_shirt_front_the_dragon: "Plaquer le dragon"
 AST_shirt_front_the_dragon_desc: "La flotte chinoise tente depuis quelques semaines de forcer les Philippines à quitter l'atoll contesté de Scarborough. Comme la plupart des brutes, si nous montrons notre soutien aux Philippines avec nos propres navires et établissons un périmètre autour de l'île, la bravade chinoise se dissipera vite."
 AST_the_canberra_treaty: "Le traité de Canberra"
 AST_the_canberra_treaty_desc: "La guerre a été évitée, et le Dragon a compris que les pays du Pacifique ne s'inclinent pas devant la coercition."
 AST_the_lottery_draft: "La conscription par tirage"
 AST_the_lottery_draft_desc: "La dernière fois que nous avons instauré le National Service Scheme, le geste fut moins que populaire. Il nous faut pourtant plus de forces prêtes si nous voulons sortir vainqueurs de cette guerre. Le « tirage au sort des anniversaires » devra revenir."
 AST_stock_up: "Faites le plein"
 AST_stock_up_desc: "Notre marine ne peut pas être partout. Il y aura des pénuries, et nous ne pouvons que prier d'avoir d'ici là assez de biens critiques en stock."
 AST_border_commanders: "Commandants des frontières"
 AST_border_commanders_desc: "Techniquement, notre pays n'a pas de garde-côtes. Le Maritime Border Command assure généralement la protection des frontières, mais sans force dédiée, en mélangeant souvent des unités de l'ADF et de la RANPF. Nous pouvons y remédier en intégrant les réserves restantes en une force de combat propre, mandatée pour protéger nos côtes contre toute menace."
 AST_remember_the_squander_bug: "Souvenez-vous du Squander Bug"
 AST_remember_the_squander_bug_desc: "Indulgent spending whilst the nation is facing its greatest financial challenge since WW2 is tantamount to treason. We can bring back an old classic to ridicule our money grubbish citizens from over spending during the conflict, and sell our warbonds in the meantime."
 AST_secure_a_landing: "Sécurisez un atterrissage"
 AST_secure_a_landing_desc: "Vu notre isolement distinct, toute invasion se fera par mer. Il faudra réquisitionner pas mal de navires privés pour répondre aux exigences logistiques, et muscler notre savoir-faire amphibie."
 AST_all_in: "Tout en"
 AST_all_in_desc: "Les industries de la nation doivent être entièrement dédiées à la menace actuelle. Un état de guerre totale sera décrété. Certaines libertés pourront être suspendues temporairement, mais les exigences de l'État et de l'armée doivent primer."
 canberra_treaty_idea: "Traité de Canberra"
 AST_the_rudd_government: "Le gouvernement Rudd"
 AST_the_rudd_government_desc: "L'Australie a tourné les yeux vers l'avenir. Le peuple a décidé que nous, en tant que nation, irons de l'avant : planifier l'avenir, l'embrasser ensemble. Unis pour écrire une nouvelle page de l'histoire du pays, et rendre ce grand pays encore plus grand. \n\nNous ne pouvons pas tenir pour acquis cette confiance sacrée. \n\nLes améliorations du système éducatif se font trop attendre. La capacité de nos hôpitaux publics et de la protection sociale exige une attention urgente. Notre infrastructure n'est pas à la hauteur du XXIe siècle, et l'absence d'initiative face à la crise climatique nous a fait reculer de décennies. Nous ne venons pas comme gardiens du statu quo, mais comme instrument du peuple. Traiter ces domaines et les menaces plus graves qui pèsent sur le pays n'est que le début. \n\nNotre politique doit rester en phase avec les Australiens et leurs besoins. Beaucoup dépend de notre capacité à mener la nation dans la nouvelle décennie."
 AST_mend_the_rift: "Réparer la faille"
 AST_mend_the_rift_desc: "La négligence du gouvernement de coalition a laissé ceux qui pendaient au-dessus des fissures de la société y tomber. Les défavorisés, les marginalisés ; à mesure qu'ils ont été écartés, les fissures se sont aussi élargies. Nous pouvons commencer le voyage de rassemblement des Australiens en visitant les pires zones touchées. Communautés reculées subissant le plus dur de la crise du logement, sans-abri, agriculteurs et ouvriers en difficulté. Si nous éclairons leur situation, nous pouvons leur montrer que le gouvernement se soucie d'eux, et que le changement arrive."
 AST_heal_the_people: "Guérir le peuple"
 AST_heal_the_people_desc: "En ce moment, notre santé publique est un chaos. Les délais d'attente mettent des gens ayant besoin d'une chirurgie vitale en attente jusqu'à un an parfois, et les urgences sont saturées au point que des patients n'arrivent même pas au bloc. Avec un décret d'urgence de normes nationales, nous pouvons immédiatement élargir les exigences de capacité hospitalière publique et relever les effectifs minimaux dans tout le pays."
 AST_unite_the_country: "Unir le pays"
 AST_unite_the_country_desc: "C'est désormais notre travail de gouverner le navire, et si nous ne pouvons pas garder tout le monde à bord, nous le faisons mal. Un fossé existe encore entre les Australiens qui nous empêche d'être entiers, et un refus de reconnaître le passé nous empêche d'embrasser l'avenir. Pour les deux, il faut examiner l'inégalité devenue une malice indéracinable dans ce pays depuis des siècles. Nous ne pourrons peut-être pas la démanteler complètement, mais nous pouvons essayer."
 AST_economic_revolution: "Révolution économique"
 AST_economic_revolution_desc: "It doesn't take much to recognise the great neo-liberal experiment of the past 30 years has failed. The free-market fundamentalism it has produced has been revealed as little more than personal greed dressed up as an economic philosophy. Ironically, it now falls to the social democracy folks to prevent this form of capitalism from cannibalising itself. \n\nWe need to chart a new system of social capitalism, accountable to the people, that balances private incentive with public responsibility. Through regulation and greater fundamental safety nets for our people, we can achieve a stronger, more nation-serving economy."
 AST_a_voice_for_all_australians: "Une voix pour tous les Australiens"
 AST_a_voice_for_all_australians_desc: "We weren't put here to pass lukewarm reform. However we go forth the party will follow, and if they don't we'll find a way to whip them into shape. The real battle is going to be the senate, for which we don't have a majority in. Pumping those numbers up with votes from the opposition parties and the independents is going to be needed to pass anything. \n\nIf we shake the tree hard enough, and sell our plans just right, a few votes might fall into our basket, and we can finally pass something meaningful."
 AST_work_with_the_party: "Travailler avec le parti"
 AST_work_with_the_party_desc: "Le Parti travailliste a prouvé encore et encore qu'il est le meilleur espoir de l'Australie. Par un leadership sage et une empathie morale éprouvée, nous poursuivons le vote de lois qui profitent non seulement au peuple d'aujourd'hui, mais à ceux à venir. \n\nUn dirigeant sage sait aussi écouter son parti. Nous ne ferons pas passer nos réformes sans un parti uni, et la voie actuelle est trop étroite pour manquer de prudence. Présenter une politique raisonnable est le seul moyen de la faire passer à la Chambre et au Sénat."
 AST_form_the_pact: "Former le pacte"
 AST_form_the_pact_desc: "Si nous voulons faire passer nos propositions les plus radicales, il faudra approcher les Verts. Ce sont les hippies trop optimistes du Parlement. Une rencontre avec leur chef, Bob Brown, pourrait suffire à les rassembler tous, même si cela aliénera complètement tout soutien libéral, et que nous pourrions même perdre certains de nos propres membres. \n\nMalgré cela, nous aurons besoin de leur aide pour franchir la ligne d'arrivée."
 AST_something_has_to_give: "Il faut que ça cède"
 AST_something_has_to_give_desc: "Il y a une pourriture sous les planches de notre société. Malgré tous nos progrès et nos efforts sociaux, n'importe qui en Australie peut tomber si les circonstances sont assez mauvaises, et beaucoup tombent. Il y a des filets de sécurité, bien sûr, mais quand nos propres allocations sont sous le seuil de pauvreté, et que même les personnes âgées doivent chercher un emploi pour échapper à la famine, quelque chose doit céder. \n\nNos systèmes de soutien sont cassés, et beaucoup dans le pays le sentent déjà. Nous ne pouvons plus rester les bras croisés."
 AST_meet_with_the_unions: "Rencontrer les syndicats"
 AST_meet_with_the_unions_desc: "Si nous voulons avancer dans nos réformes, le meilleur point de départ, ce sont les syndicats. Le Parti travailliste a été fondé par les syndicats, après tout, et ce sont nos plus grands soutiens. \n\nCela nous aidera à renouer avec les travailleurs, et à signaler que nous sommes ouverts à la collaboration."
 AST_earnest_cheques_for_the_needy: "Chèques sincères pour les nécessiteux"
 AST_earnest_cheques_for_the_needy_desc: "Pour ceux qui vivent au bord de la pauvreté, un seul accident ou une facture surprise peut les faire basculer. Une partie de notre soutien au public comprend plusieurs bonus en espèces uniques pour amortir le bas de l'échelle, et protéger les vulnérables d'une ruine financière soudaine."
 AST_new_consensus: "Nouveau consensus"
 AST_new_consensus_desc: "Le Consensus de Washington est la prescription standard pour les économies depuis les années 1980. Désormais, avec l'aube de nouvelles économies mondialisées qui le contestent, l'Australie doit aussi trouver son propre consensus. Moins libre que celui de Washington, moins autoritaire que celui de Pékin, le nôtre sera une intervention avec finesse."
 AST_insulate_the_homes: "Isoler les foyers"
 AST_insulate_the_homes_desc: "C'est une honte que chaque nuit des milliers de familles australiennes dorment dans le froid. Nos estimations tournent autour de 40 % de foyers non isolés, ce qui mène à des factures d'électricité plus élevées gaspillées en chauffage pour ceux qui peuvent se le permettre, et encore moins pour ceux qui ne le peuvent pas. Nous déploierons un programme national pour couvrir le coût d'installation de l'isolation pour les propriétaires."
 AST_fair_shake_of_the_sauce_bottle: "Une juste part de la bouteille de sauce"
 AST_fair_shake_of_the_sauce_bottle_desc: "Le plus grand obstacle pour un couple qui souhaite un enfant, ce sont les contraintes financières. Prendre le temps de s'arrêter de travailler pour s'occuper d'un enfant dans ses années les plus cruciales est quelque chose que peu peuvent même envisager, surtout dans l'économie actuelle. Puisqu'il est de notre devoir de veiller sur les Australiens, nous devons les soutenir autant que possible. \n\nChaque parent en Australie, y compris ceux qui adoptent, aura droit à 26 semaines de congé parental payé. Quiconque le souhaite aura une chance équitable de devenir parent, car c'est le gouvernement de l'équité."
 AST_housing_initiative: "Déployer les logements"
 AST_housing_initiative_desc: "Nous avons conclu un accord avec des entrepreneurs privés pour nous aider à construire plus de 20 000 logements sociaux et réparer environ 12 000 biens inhabitables à travers l'Australie sur les 10 prochaines années. Cela logera des milliers de sans-abri dès la première année."
 AST_the_care_act: "L'amendement à la sécurité sociale"
 AST_the_care_act_desc: "Après de longues négociations avec le parti et les libéraux, nous avons réussi à boucler notre législation sociale. En refondant l'éligibilité et les programmes d'emploi, Centrelink sera accessible à près d'un million d'Australiens de plus. Les pensionnés verront une hausse notable de leurs versements, compensée par un relèvement de l'âge d'éligibilité et un resserrement de Medicare pour calmer l'opposition. Des centaines de bourses supplémentaires et des hausses des allocations d'invalidité. \n\nDe plus en plus d'Australiens vivront plus facilement, le gouvernement à leurs côtés."
 AST_shelter_for_all: "Un toit pour tous"
 AST_shelter_for_all_desc: "Si notre investissement actuel dans le pays n'était pas déjà assez ambitieux, nos plans contre le sans-abrisme ont jeté les faucons budgétaires dans l'hystérie. Nous avons abandonné le plan initial de 20 000 logements sociaux en 10 ans pour 100 000 sur la même période. Les premiers, construits l'année prochaine, iront directement à ceux qui sont le plus en danger. \n\nMême les plus progressistes du parti parlent d'un plan audacieux, certains d'un plan impossible. La majeure partie de notre capacité de construction devra être mobilisée dès le départ pour que ce soit faisable."
 AST_root_and_branch_approach: "Approche racine et branches"
 AST_root_and_branch_approach_desc: "Much of our more widescale reforms can be described as \"root and branch\" changes, wherein the approach to overhauling something like healthcare or housing has to begin at the roots. Instituting independent reviews or completely redesigning the process to help far more Australians and operate with greater efficiency. Our plans for a redesign of the welfare system have come up more expensive than we can currently facilitate, which leaves us with a sizable deficit. \n\nAs much as we'd like to please everyone, the funding has to come from somewhere."
 AST_a_stronger_net: "Un réseau plus solide"
 AST_a_stronger_net_desc: "Avec l'apport des Verts, nous avons assemblé ce qui pourrait être la plus vaste législation sociale que le pays ait jamais vue. Une réforme d'ampleur de notre capacité d'aide et de l'éligibilité, avec des programmes à grande échelle visant des millions de personnes dans la pauvreté et relevant les versements à un niveau décent, tout en augmentant le salaire minimum public. Cela va sans aucun doute bouleverser le monde du travail, et ce pourrait être le plus proche d'un revenu universel qu'une nation de notre taille puisse offrir, mais si nous voulons un changement social qui survive à notre génération, c'est cela. \n\nNous perdrons quelques faucons budgétaires du parti, mais cela vaudra le coup pour ce que nous aurons accompli."
 AST_bill_of_rights: "Notre déclaration des droits"
 AST_bill_of_rights_desc: "After our election a number of voices made known their desire for a 'bill of rights' that would fundamentally shape our government's focus on the rights of our citizens. Now we have the opportunity to propose a Commonwealth statute that would bring forth just that. Implementing protective rights, changes to our judicial system and authority agencies, and presenting a charter to our parliament with the responsibility we hold to Australians to maintain their equality, freedom and safety. Essentially the whole nine yards."
 AST_the_social_contract: "Le contrat social"
 AST_the_social_contract_desc: "Les systèmes de soins et de soutien se sont tellement étiolés et dégradés que le nombre croissant de ceux qui n'ont rien est devenu le plus grand nombre. Il n'est pas plus vrai que les Australiens sont libres qu'un système qui les a trahis encore et encore les a réduits à dépendre de l'État pour le strict nécessaire. Ailleurs, ce même système a négligé ceux qui ont besoin de soins. \n\nC'est désormais notre responsabilité de changer les choses. Les ignorés et les défavorisés seront entendus. Ce système ne peut continuer."
 AST_a_national_congress: "Un congrès national"
 AST_a_national_congress_desc: "Bien que l'ATSIC ait été un pas vers un progrès unifié, quelque part en chemin elle s'est égarée, et son but de vraie représentation n'a jamais vraiment été réalisé. En travaillant avec la Commission australienne des droits de l'homme, nous pouvons organiser un nouveau Congrès national des Premiers Peuples d'Australie pour la remplacer. Nous permettant de travailler plus activement aux côtés des Australiens autochtones pour mettre en œuvre une politique axée sur l'égalité et le changement proactif."
 AST_visit_the_schools: "Visiter les écoles"
 AST_visit_the_schools_desc: "Comme notre révolution économique, une réforme descendante du système scolaire sera nécessaire. Nous avons déjà dressé des plans pour investir lourdement dans la rénovation et la construction de nouvelles écoles de métiers, et nous pouvons commencer en visitant quelques écoles locales au Queensland pour sentir la situation sur le terrain."
 AST_digital_education: "Éducation numérique"
 AST_digital_education_desc: "La percée d'Internet a été quelque chose à voir pour les Australiens, et surtout notre jeunesse. Si on leur apprend tôt à mieux l'utiliser, la prochaine génération sera équipée pour le nouveau monde numérique, et évitera les dangers qu'il peut présenter. Installer un certain nombre d'ordinateurs dans les salles de classe, avec nos autres rénovations, nous préparera à l'ère moderne."
 AST_a_national_agreement: "Un accord national"
 AST_a_national_agreement_desc: "Un certain nombre de membres de l'opposition sont enclins à travailler avec nous sur la politique autochtone. Si nous pouvons les convaincre de considérer ces questions comme la crise qu'elles sont, nous pourrons faire passer des lois en mesures d'urgence. Employer rapidement des programmes ciblant les maladies chroniques, l'alphabétisation et l'accès aux soins primaires dans les zones reculées."
 AST_state_health_reform: "Réforme sanitaire des États"
 AST_state_health_reform_desc: "Habituellement, les États gèrent les hôpitaux publics sur leurs propres deniers. Or récemment ils se sont relâchés ou souffrent de graves problèmes de financement, car les soins actuels sont loin d'être suffisants. Le seul moyen de réussir une réforme du financement est de reprendre la gestion du financement hospitalier, tout en laissant les opérations courantes au niveau local.  \n\nNous pourrons mener nos propres revues pour voir quels domaines améliorer, puis avancer. S'ils font du bruit, nous les menacerons d'un référendum constitutionnel pour donner au gouvernement fédéral le plein contrôle des hôpitaux publics, et nous verrons s'ils aboient encore. \n\nPour une fois, c'est nous qui tranchons.\nPour une fois, le seau s'arrête chez nous."
 AST_equal_opportunity: "Égalité des chances"
 AST_equal_opportunity_desc: "Nous n'avons pas le droit de nous opposer à la demande d'égalité du mariage. Même si nous n'en sommes pas les champions, nous pouvons encore soumettre la question à un référendum, et jauger où en est la perception publique. S'il passe, et que l'opposition est encore contre nous, nous pourrons en faire du carburant pour la prochaine élection."
 AST_respect_traditional_values: "Respecter les valeurs traditionnelles"
 AST_respect_traditional_values_desc: "Un gouvernement équitable a la responsabilité d'écouter les besoins du plus grand nombre, tout en respectant les modes de vie de quelques-uns. L'Australie a prospéré grâce à un leadership mesuré et prudent. Nous ne forcerons personne à cuire un gâteau contraire à sa religion, et nous n'agiterons pas le chaudron des guerres culturelles. Il est temps de reculer d'un pas, pour changer."
 AST_clean_feed: "Alimentation propre"
 AST_clean_feed_desc: "Even with our digital education programs we can't prevent the worst of the internet from affecting the youth. Even now online bullying and cybercrime threaten the very fabric of Australian lives. We'll delegate the duty to our internet service providers, requiring social media platforms like Facebook and the like to ensure that those using their platforms are of the appropriate age."
 AST_close_the_gap: "Réduire l'écart"
 AST_close_the_gap_desc: "Notre politique centrale et continue en matière d'affaires autochtones a été de combler l'écart d'espérance de vie, de réussite scolaire et d'opportunité économique. L'espérance de vie des Australiens autochtones est en particulier inférieure de près de 10 ans à celle des non-autochtones. Les taux d'alphabétisation sont aussi bien plus bas, et la mortalité infantile double. \n\nVous voyez l'idée. Il faut proposer une législation comprenant un large éventail de programmes dédiés, avec des objectifs fermes pour améliorer la vie de nos Premiers peuples."
 AST_tackle_the_mining_oligarchy: "S'attaquer à l'oligarchie minière"
 AST_tackle_the_mining_oligarchy_desc: "The insidious forces that have influenced our government continue to do so to this day thanks to the wealth they've drained from our soil. For centuries they amassed a fortune and refused to share it, while the workers they hired are paid too little and disposed of too easily. It's past time they paid their share, and that the Australian people are rewarded for the ore that comes out of their ground."
 AST_draft_the_legislation: "Rédiger la législation"
 AST_draft_the_legislation_desc: "Vu l'ampleur de ce que nous visons, il nous faudra rédiger la pièce ultime de législation fiscale, sans aucune faille, et rassembler tous les experts possibles. Si nous le faisons, nous le ferons comme il faut."
 AST_tax_the_super_profits: "Taxer les superprofits"
 AST_tax_the_super_profits_desc: "Bien des nuits tardives au Parlement nous ont récompensés d'une lance brillante à utiliser contre les grandes entreprises. Un taux d'imposition dynamique, ciblant les plus grandes sociétés, et ne taxant que les « superprofits » obtenus quand une entreprise dépasse largement son taux de revenu normal, fera enfin ruisseler une part des gains du boom minier. Cela devrait aussi éviter l'étiquette d'impôt injuste, puisque la taxe sera nulle si l'entreprise a sous-performé, ou si ses coûts opérationnels dépassent les retours."
 AST_throw_businesses_a_bone: "Jeter un os à Corps"
 AST_throw_businesses_a_bone_desc: "La régulation entre nos propres États est pour le moins écrasante. Elle coûte cher aux entreprises grandes et petites, et ralentit beaucoup le commerce, ce qui ne fait qu'augmenter le coût des biens localement. Si nous voulons jeter un os aux industries et montrer que nous ne sommes pas seulement là pour les coincer, nous pouvons travailler avec le conseil des entreprises pour créer une économie nationale fluide. Une qui coupe la montagne de paperasse en échange d'une circulation plus facile et d'un plus grand flux."
 AST_tear_off_special_interests: "Détachez les intérêts particuliers"
 AST_tear_off_special_interests_desc: "Interest groups have become a malignant presence in our political system that should've been dealt with long ago. Having unfair influence on our election cycle and political process. We can't speak for the other side of the aisle, but by investigating our own party for unfair influence we might be able to cut some of the tendrils loose. It might not rid them forever, but it'll make removing them in future easier."
 AST_own_our_resources: "Posséder nos ressources"
 AST_own_our_resources_desc: "One of the government's biggest mistakes was allowing foreign ownership of our resources without having a stake in them ourselves. Granted we have profited nicely off their continued growth, and the global economy is a success for a reason, but we shouldn't neglect the interests of our own nation either. \n\nWe already receive royalties from the mining corps for mining our land, if we hike the cost they might protest it in the short term, but eventually they'll come to the table, and we can better negotiate how our country's minerals are handled."
 AST_spirit_of_gough: "L'esprit de Gough"
 AST_spirit_of_gough_desc: "Le tragique récit de Gough Whitlam est de ceux qui restent dans l'histoire. Un homme trop ambitieux, abattu par les pouvoirs qui l'entouraient. Malgré un mandat court, il brilla comme un grand révolutionnaire de la politique progressiste, et ce fut seulement sa tentative de brider le contrôle croissant des industries minières qui le perdit. \n\nIl est peut-être trop tard pour réaliser l'échelle de propriété qu'il projetait, mais nous pouvons encore l'honorer. En créant la première société minière d'État, nous contournerons les corporations et extraireons le minerai de nos propres mines, en prenant tous les profits et toutes les récompenses pour nous.\nIl est peut-être trop tard pour instaurer l'échelle de propriété qu'il projetait, mais nous pouvons encore lui faire honneur. En créant la première société minière gérée par l'État, nous pouvons contourner les corporations et extraire le minerai de nos propres mines, prenant tous les profits et toutes les récompenses pour nous."
 ast_spirit_of_gough_tt: "Crée l'§0Autorité du pétrole et des minéraux.§!"
 AST_twenty_twenty_summit: "Sommet 2020"
 AST_twenty_twenty_summit_desc: "The 2020 Summit has been the brainchild for our government's more involved stance on governing. An open democratic forum, inviting 1,000 community leaders, experts and citizens to brainstorm a strategy for the nation's future. Australians deciding their own future is a great way to kick off our term, and shows we're committed to change."
 AST_kyoto_accords: "L'engagement de Kyoto"
 AST_kyoto_accords_desc: "Ratifier le protocole de Kyoto n'est que le début. Pour qu'il tienne son potentiel, il faudra pousser plus loin. Pas un morceau de charbon laissé de côté."
 AST_big_australia: "Grande Australie"
 AST_big_australia_desc: "Le concept a été lancé pendant le sommet 2020. Notre plus petite population a été l'une des seules choses à nous retenir sur le chemin des grands. Pour l'instant, il n'y a qu'un nombre limité de bébés que nous puissions faire. Le nouveau plan inclut des étapes pour atteindre 36 millions d'ici 2050, essentiellement en augmentant l'accueil de notre système migratoire. Tout doit être rationalisé."
 AST_seasonal_labour_scheme: "Régime de travail saisonnier"
 AST_seasonal_labour_scheme_desc: "The chokehold of our smaller population can only be amended in the short term with a stream of imported labour. Easing the restrictions to funnel more foreign workers towards our industries will keep them growing in the meantime, and hold off the shrinkage we might expect down the line."
 AST_our_sibling_state: "Notre État frère"
 AST_our_sibling_state_desc: "Peu pourraient mesurer la rivalité intense entre nous et le pays dont la population est plus petite que Sydney. Que ce soit le sport ou à peu près n'importe quoi d'autre, vous n'en entendrez jamais la fin s'ils l'emportent. Nos économies sont déjà assez synchronisées, mais nous travaillons à un accord commercial pour lier efficacement nos nations financièrement. Le commerce et l'investissement couleront entre nous comme l'eau s'il réussit."
 AST_pacific_islands_forum: "Forum des îles du Pacifique"
 AST_pacific_islands_forum_desc: "Tous les quelques années, notre nation, la Nouvelle-Zélande et celles des nations insulaires se réunissent pour discuter des intérêts régionaux et des défis qui les confrontent. C'est un moyen efficace de garder un œil sur nos voisins océaniens. Cette année, le sujet des permis de travail est clairement à l'ordre du jour, et quelques nations ont discuté de permis temporaires pour un développement horticole conjoint. Que nous acceptions de les prendre ou non, le plan a certainement ses mérites."
 AST_end_the_imperialism: "En finir avec l'impérialisme"
 AST_end_the_imperialism_desc: "S'asseoir dans le plus grand siège de la nation a peut-être apporté une certaine clarté. Dans l'environnement enraciné que nos prédécesseurs ont créé, parfois nous avons vraiment le choix. Continuer à infliger une ingérence et un mal inutiles à travers le monde, ou au contraire reculer et respecter les frontières qui ont grandi autour de nous."
 AST_maintain_obligations: "Maintenir les obligations"
 AST_maintain_obligations_desc: "Nous conservons un certain niveau de responsabilité pour les gouvernements qui sont venus avant, et les intérêts qu'ils ont créés dans le Pacifique et au-delà. Quand notre politique, aussi souvent, affecte la vie de millions, il faut aborder les choses d'une main légère. Prendre un marteau-piqueur à nos relations si tôt ne peut que mal finir. Mieux vaut garder ce que nous avons, et l'améliorer là où c'est possible."
 AST_the_free_trade_area: "Zone de libre-échange"
 AST_the_free_trade_area_desc: "Des mois de négociations avec les États de l'ASEAN nous ont valu une opportunité incroyablement lucrative. Si notre pays et la Nouvelle-Zélande ne remplissent pas les critères pour rejoindre le bloc commercial, nous pouvons encore accéder à certains de ses bénéfices en devenant « partenaires » extérieurs, créant essentiellement une zone de libre-échange entre nous et l'Asie."
 AST_the_beginning_of_something_new: "Le début de quelque chose de nouveau"
 AST_the_beginning_of_something_new_desc: "Bien que le pacte de l'ASEAN ait bien unifié les États asiatiques ces dernières décennies, les trois plus grandes économies du Pacifique restent à peine liées. Le Japon, l'Inde et la Chine peuvent avoir leurs accords individuels, mais cela pâlit face à l'union établie en Europe. \n\nC'est certes ambitieux, mais si nous pouvions unir ces pays, y compris le nôtre, en une union économique commune, la prospérité financière ne serait que le début. La paix dans le Pacifique s'obtiendrait avec une simple monnaie unifiée."
 AST_address_the_tiger: "S'adresser au tigre"
 AST_address_the_tiger_desc: "Les relations avec l'Inde volent en ce moment. Certains diraient même qu'elles sont au beau fixe. Nous ne devrions pas gâcher une bonne chose, mais qui dit que nous ne pouvons pas l'améliorer ? Leur disposition vis-à-vis de la Chine est l'un des plus gros obstacles à la formation de l'union. Si nous pouvons obtenir une percée, le reste du travail sera un jeu d'enfant."
 AST_an_asian_pacific_union: "Une Union Asie-Pacifique"
 AST_an_asian_pacific_union_desc: "Chaque pièce doit être à sa place parfaite pour ce que nous tentons. Jusqu'où nous irons et quelle empreinte nous laisserons dans l'histoire géopolitique sera défini par ces pourparlers. Notre travail portera enfin ses fruits."
 AST_renegotiate_with_papua: "Gérer la crise des bateaux"
 AST_renegotiate_with_papua_desc: "Des milliers de migrants débarquent chaque année sur nos côtes sans papiers, et ce nombre ne semble qu'augmenter. L'infrastructure existante étant débordée, la solution offshore devra être réexaminée pour servir la crise actuelle."
 AST_keep_the_gears_turning: "Garder les rouages en marche"
 AST_keep_the_gears_turning_desc: "Nous sommes trop interconnectés au monde pour simplement nous retirer. La politique d'endiguement par procuration ne marche que si nous continuons à graisser les rouages, et à montrer que nos promesses tiennent. Le risque de tourner le dos est trop élevé. Pas de plus grand bien. Pas de juste cause."
 AST_world_hold_on: "Le monde tient bon"
 AST_world_hold_on_desc: "Nous devons envoyer un message aux autres pays : l'Australie n'a pas atteint son sommet. Nous sommes toujours là, et nous partons à l'étranger. Promouvoir l'investissement extérieur en réduisant la régulation qui retient nos grandes entreprises, c'est le type de colonialisme économique dont nous pouvons être fiers. Fox News et Outback Steakhouse n'étaient qu'un aperçu de ce dont nous sommes capables. Ils verront."
 AST_assure_the_other_side: "Rassurer l'autre camp"
 AST_assure_the_other_side_desc: "Nous ne pouvons pas survivre sans nos entreprises. Le commerce agit comme les globules qui parcourent notre industrie. Obligations de parti mises à part, sans un intérêt réel à les soutenir à travers le virage financier actuel, le cœur battant de notre économie pourrait se gripper. Un équilibre doit être trouvé pour les soutenir, tout comme elles nous soutiennent indirectement."
 AST_forward_with_fairness: "En avant avec l'équité"
 AST_forward_with_fairness_desc: "Nous sommes pour améliorer la vie de nos travailleurs, mais étouffer la croissance des entreprises en ces temps n'est simplement pas une option. Abolir les AWA et introduire la négociation collective montrera que nous sommes prêts à travailler dans l'intérêt des entreprises. Après tout, le droit de travailler doit rester au travailleur, pas au syndicat."
 AST_represent_the_worker: "Représenter le travailleur"
 AST_represent_the_worker_desc: "Le travail est fondamentalement fait d'êtres humains à la dignité intrinsèque plutôt que d'une simple marchandise économique. Si nos travailleurs ne croient pas que nous les soutenons, comment s'attendre à ce qu'ils défendent leurs propres droits ? Nous ne pouvons pas passer pour favoriser les vœux des entreprises au détriment de notre peuple."
 AST_the_emissions_trading_scheme: "Système d'échange de droits d'émission"
 AST_the_emissions_trading_scheme_desc: "Climate change has become the greatest moral challenge of our time. Not just for us, but worldwide. Hundreds of nations now find themselves being warned of the impending danger, yet their strength to act is being challenged. Can the comforts of our industries be put aside for those of future generations? Can we truly bear the burden of carrying the economy to new heights whilst preserving our environment? For us the answer will always be yes. \n\nThe scheme has been one of our longest campaign promises, introducing caps on a company's CO2 output. If companies wish to expel more they would need doled-out permits from the government, or pay highly for them, resulting in less energy production in the short term. It aims to decrease our output to pre-2000 levels, while incentivising renewable energy, but no doubt it will raise us a fair amount in new revenue."
 AST_cut_the_csiro: "Couper le CSIRO"
 AST_cut_the_csiro_desc: "Malheureusement, l'Organisation de recherche scientifique et industrielle du Commonwealth n'a pas fait son poids. On s'attendrait à ce que assez de subventions gonflées pour financer entièrement d'autres agences aient produit quelque chose, mais ces dernières décennies les coûts ont grandi, pour très peu de valeur. Il faudra en éviscérer assez pour remettre les choses sur les rails, et cela ne fera pas de mal à nos caisses."
 AST_green_energy_incentives: "Incitations aux énergies vertes"
 AST_green_energy_incentives_desc: "If fossil fuels are on the decline, renewables must be on the up. More than that, they need to be encouraged if we're meeting any kind of nation-wide adoption in the future. Developing our geothermal energy and investing into a Green Car Innovation Fund will get us going in the right direction."
 AST_fair_work_australia: "Travail équitable en Australie"
 AST_fair_work_australia_desc: "Vu le décalage entre nos entreprises et le gouvernement, le parti a conseillé la création d'un bureau des relations, travaillant pour les intérêts des entreprises afin de mieux aligner notre focus. Cela devrait mettre fin au Workplace Relations Act et aux redoutées réformes WorkChoices. Si nous l'implémentons avec le retour des syndicats, nous pourrons y intégrer certaines protections habituelles des travailleurs, tout en apaisant les deux camps."
 AST_snip_the_red_tape: "Couper la paperasse"
 AST_snip_the_red_tape_desc: "Malgré notre Commonwealth assez unifié, nos gouvernements d'État ne travaillent certainement pas ensemble aussi bien que nous le voudrions. Si une entreprise veut s'enregistrer, elle doit naviguer parmi les formulaires et frais de chaque État où elle opère : deux États, deux fois les frais et deux fois les formulaires. Créer un registre national unique en ligne permettra à quiconque dans le pays de s'enregistrer une fois pour toutes, puis de passer aux affaires."
 AST_for_the_common_farmer: "Pour le fermier ordinaire"
 AST_for_the_common_farmer_desc: "Depuis le tournant du siècle, nos agriculteurs l'ont eu dur. Logiquement, la pire cause d'inquiétude a été la sécheresse du Millénaire qui, malgré nos politiques, continue d'entraver la reprise agricole. S'asseoir avec les défenseurs nous aidera à travailler sur de vraies solutions."
 AST_walkable_cities: "Villes à 20 minutes"
 AST_walkable_cities_desc: "Notre plus grand combat s'est joué dans les rues. Au début de la révolution industrielle, les citoyens furent poussés dans des ruelles étroites et forcés d'adopter les paysages d'asphalte comme lieux de sociabilité. Depuis, le sens de la communauté s'est ratatiné, sacrifié au divertissement intérieur. On ne peut forcer les gens à sortir, mais on peut les y inviter. \n\nEn intégrant le plan de la ville des 20 minutes, conçu par le conseil de Melbourne, nous pouvons assouplir les restrictions sonores du centre-ville et financer des projets créatifs et des festivals pour ramener les gens dans les rues, reconstruisant un sentiment de communauté. Ajoutez des programmes jeunesse gratuits et des extensions d'infrastructure, et nos quartiers seront de vibrants centres de culture en quelques années.\nEn intégrant le plan de la ville des 20 minutes, développé par le conseil de Melbourne, nous pouvons assouplir les restrictions de bruit des rues principales et financer des projets créatifs et festivals pour ramener les gens dans les rues, reconstruisant un sens de la communauté. Ajoutez des programmes jeunesse gratuits et des expansions d'infrastructure, et nos quartiers seront des centres culturels grouillants en quelques années."
 AST_keep_them_safe: "Les tenir en sécurité"
 AST_keep_them_safe_desc: "Australia doesn't have a national animal, although most would argue it's the Red Kangaroo. An almost universally recognised symbol, and yet just as many know about the cute critters that hang about our outback forests. Whether it's logging companies or diseases, every year the population decline for Koalas gets worse, and yet little is done to protect them. If we nominate them as a protected species, more can finally be done to keep these memorable marsupials around and safe from extinction."
 AST_industry_research_bank: "Banque de recherche du Commonwealth"
 AST_industry_research_bank_desc: "Notre recherche n'a ralenti que parce que nous l'avons laissé faire. Un manque d'investissement dans des domaines critiques empêche nos organisations de faire le travail même pour lequel elles ont été créées : franchir les barrières. Augmentez le budget et augmentez les objectifs."
 AST_natos_best_friend: "Le meilleur ami de l'OTAN"
 AST_natos_best_friend_desc: "L'Australie est déjà l'un des alliés non membres les plus proches de l'OTAN. Nous nous entraînons avec eux, nous faisons du maintien de la paix avec eux, et nous partageons le renseignement. Notre position dans le Pacifique pourrait être bien plus renforcée avec le bon appui, et bien que notre neutralité ait ses avantages, il est temps d'un engagement plus proche."
 AST_from_the_ashes: "Des cendres"
 AST_from_the_ashes_desc: "Now that we're back in command we need to focus on winning the next election. Our policy needs to be keyed into the short term, and rallying the party behind us is going to require an ounce of inspiration and an abundance of arm-twisting."
 AST_a_new_dawn: "Une nouvelle aube"
 AST_a_new_dawn_desc: "Le public doit voir le Travailliste comme un parti né de nouveau. La vieille peau des luttes internes doit être rejetée, et une nouvelle image de compétence et de fiabilité sera rédigée pour sauver l'électorat."
 AST_repair_the_party: "Réparer le parti"
 AST_repair_the_party_desc: "Nos anciennes relations avec les factions du parti sont plus ou moins en lambeaux. Pire, le système qui a permis notre renversement est toujours là. Déraciner les mécanismes actuels pour rendre les coups d'État internes moins courants et réécrire les règles du parti est le seul moyen de réparer les choses."
 AST_fight_back: "Riposter"
 AST_fight_back_desc: "Si les médias de News Corp pensaient pouvoir continuer à nous traîner dans la boue sans que nous ayons de réponse, ils rêvent. L'arène du débat est une rue à double sens, et nous allons frapper fort en retour."
 AST_on_the_campaign_trail: "Sur la piste de campagne"
 AST_on_the_campaign_trail_desc: "Vraiment, les dernières années n'ont pas été idéales, et le Travailliste a certainement perdu son chemin. Visiter les Australiens ruraux et urbains, à travers la nation, et comprendre les vrais problèmes qui les touchent montre que nous sommes prêts à redevenir le parti qui écoute. En commençant par annoncer notre candidature à la conférence nationale."
 AST_win_manufacturers: "Gagner les fabricants"
 AST_win_manufacturers_desc: "Nous lançons notre second mandat en force avec l'Australian Jobs Act. Un paquet de 2 milliards de dollars pour recycler 7 000 ouvriers de la manufacture, les aidant à transiter vers les secteurs de production tandis que nos marchés automobiles et textiles traditionnels font face à des réductions. Une solution pratique au marasme industriel en cours."
 AST_cast_the_die: "Jeter les dés"
 AST_cast_the_die_desc: "Nos jetons sont en place, et le peuple australien est prêt à choisir son prochain dirigeant. Nous avons tout fait pour nous préparer et présenter notre vision, nous ne pouvons qu'espérer que les électeurs soient à bord."
 AST_the_gillard_gov: "Le gouvernement Gillard"
 AST_the_gillard_gov_desc: "Ce gouvernement croit à récompenser ceux qui travaillent le plus dur, pas ceux qui se plaignent le plus fort. Il croit à récompenser ceux qui, jour après jour, travaillent dans nos usines et nos fermes, nos mines et nos moulins, nos salles de classe et nos hôpitaux, qui récompense ce travail, cette décence et cet effort. Les gens qui jouent selon les règles, mettent le réveil tôt, envoient leurs enfants à l'école, soutiennent leurs voisins et aiment leur pays. \n\nNotre pays est béni de bien des façons, mais l'état des finances nationales s'est corrodé et gonflé jusqu'à la négligence. J'assure à chaque Australien que le budget retrouvera la santé sous notre direction. Prenant le devoir de ceux qui nous ont précédés, nous nous engageons à un gouvernement fiscalement responsable et fort, qui comprend les besoins de plus que les quelques voix bruyantes. \n\nLa politique médiatique cessera. L'indifférence aux besoins de nos industries cessera, et les qualités de dignité et de bon sens reviendront."
 AST_form_the_minority_coalition: "Former la coalition minoritaire"
 AST_form_the_minority_coalition_desc: "L'avenir du Travailliste repose désormais sur notre capacité à former un gouvernement."
 AST_go_green: "Passez au vert"
 AST_go_green_desc: "Quand ils ne nous poignardent pas dans le dos, les Verts ont été un parti utile à notre cause. Négocier avec eux ne sera guère un problème, et la plupart de leurs préférences politiques s'alignent avec les nôtres. Certes, il faudra quelques réformes de façade ici et là, mais ils nous soutiendront quand cela compte."
 AST_wrangle_liberal_defectors: "Lutter contre les transfuges libéraux"
 AST_wrangle_liberal_defectors_desc: "A few current members of the Liberal and National Party have shown interest in our agenda, and some have already jumped ship in light of the recent party drama. Finding them and offering them a place in our government in exchange for support should be easy enough, and show we're not above working with the opposition in preserving conservative values."
 AST_clean_energy_act: "Loi sur l'énergie propre"
 AST_clean_energy_act_desc: "Après l'échec du lancement du système d'échange d'émissions, un substitut moins clivant a été rédigé pour traiter nos émissions de carbone croissantes. La portée de la loi n'est pas encore entièrement définie, mais, comme l'ETS, le but est de limiter les émissions de CO2 par de nouvelles taxes et d'encourager la production d'énergie propre."
 AST_clean_energy_creation: "Création d'énergie propre"
 AST_clean_energy_creation_desc: "Nous sommes sur une lancée contre la crise climatique, et il est temps d'investir une part de nos fonds pour poursuivre le plan. L'objectif de long terme a toujours été d'atteindre l'indépendance renouvelable vis-à-vis de nos réserves de charbon. Commençons la transition."
 AST_address_the_stolen_generations: "S'adresser aux Générations volées"
 AST_address_the_stolen_generations_desc: "There's enough support in the opposition to deliver an address on the Stolen Generations without appearing to ride the coattails of the National Apology. It will certainly make us appear very bipartisan, and might be a source of solace for some in the community."
 AST_correct_the_mouthboxes: "Corriger les porte-voix"
 AST_correct_the_mouthboxes_desc: "Les entreprises et les militants politiques ont été autorisés à mentir ouvertement en ligne et à la télévision, avec peu ou pas de conséquences. S'il est difficile de prouver une malveillance, ou un préjudice causé par ce relâchement de la vérité, nous ne pouvons pas laisser cette tendance troublante continuer. Introduire une législation qui punit les publicités ou publications trompeuses devrait freiner la tendance, et ramener un semblant de réalité en politique."
 AST_let_debate_decide: "Laissons le débat décider"
 AST_let_debate_decide_desc: "L'un des projets de loi que les Verts nous ont remis vise à élargir les libertés des couples de même sexe. Notre gouvernement est encore assez hésitant, sinon opposé à des mouvements soudains dans cette direction, mais nous pouvons laisser l'assemblée en décider de manière équitable."
 AST_ndis: "Former le NDIS"
 AST_ndis_desc: "La vérité simple, c'est que le handicap peut toucher n'importe lequel d'entre nous, et donc tous. Rarement quelqu'un est financièrement prêt aux conséquences, et aujourd'hui ceux qui font face à l'isolement, à la pauvreté et à la perte de dignité ne peuvent compter que sur le peu que nos services sociaux offrent spécifiquement aux personnes handicapées. \n\nL'introduction du régime national d'assurance invalidité pourrait être le soutien le plus significatif depuis l'introduction des soins universels par Gough Whitlam. Des millions de personnes dans le besoin auront le soutien nécessaire, et la nation en sera plus fière.\nL'introduction du National Disability Insurance Scheme pourrait être le soutien le plus significatif depuis l'introduction des soins universels par Gough Whitlam. Des millions dans le besoin auront le soutien dont ils ont besoin, et la nation en sera plus fière."
 AST_the_gonski_review: "La revue Gonski"
 AST_the_gonski_review_desc: "Au début de notre mandat, nous avons commandé une revue du système scolaire pour trouver les lacunes à colmater. Le rapport a révélé un écart croissant des résultats scolaires, lié au statut socio-économique et aux inefficacités de financement. En bref, les écoles publiques moins financées obtenaient de moins bons scores partout. \n\nIl faut redessiner sérieusement le financement éducatif pour traiter le problème et aider nos élèves. Ils sont l'avenir de la nation, après tout."
 AST_take_less: "Prenez moins"
 AST_take_less_desc: "Il y a très peu de choses sur lesquelles le Parti libéral a raison, mais ce qu'ils voient juste, c'est de garder les impôts bas. Comment s'attendre à ce que l'Australien moyen valorise les fruits de son travail si nous en prenons le gros. Une population plus forte est une population avec plus dans la poche."
 AST_get_more: "Obtenez plus"
 AST_get_more_desc: "Sin taxes have been utilised since our nation's inception, although lately they've been forsaken for the right of the lower class to indulge in degenerate activities. The choice between appearing 'socially accepting,' and carrying any sort of moral backbone is an easy one for us to make."
 AST_regulate_the_unions: "Réguler les syndicats"
 AST_regulate_the_unions_desc: "Qu'on le veuille ou non, les syndicats sont, par définition, un obstacle à la croissance économique. Ils érodent les libertés mêmes des travailleurs à travailler, et le droit des entreprises d'embaucher. Nous sommes pratiquement tenus à la gorge par le pouvoir politique que les syndicats ont brandi pour contrôler le gouvernement et étouffer la prospérité. \n\nIl faut permettre une législation limitant leur portée et gardant la politique de cette nation au sein du gouvernement, non dominée par ces petits bureaucrates d'extrême gauche."
 AST_national_broadband_network: "Réseau national haut débit"
 AST_national_broadband_network_desc: "Le NBN est en développement depuis près d'une décennie, avec des milliards déjà investis pour aligner les débits du réseau australien sur l'époque moderne. Si quelque chose, le projet a pris plus longtemps que nécessaire, et l'opposition crie encore au coût. Si nos coupes ont servi à quelque chose, des dépenses comme celles-ci valent bien l'étiquette de prix."
 AST_back_in_black: "De retour en noir"
 AST_back_in_black_desc: "Sans pointer personne du doigt, nos dépenses sont devenues insouciamment excessives. Le gaspillage ronge notre budget, et aucun gouvernement ne devrait payer pour les péchés du précédent. Tous les moyens doivent être employés pour nous ramener dans le vert, et garder l'inflation basse. Pas de « si », pas de « mais ». L'échec n'est pas une option ici et nous n'échouerons pas."
 AST_slam_the_door_on_them: "Leur claquer la porte"
 AST_slam_the_door_on_them_desc: "Vu à quel point notre aide sociale a gonflé, notre premier ordre du jour devrait être d'examiner les critères d'éligibilité de nos services d'invalidité. Relever les exigences à un niveau raisonnable devrait écarter quelques profiteurs qui n'ont pas nécessairement besoin du soutien, et élaguer quelques programmes gaspilleurs ramènera les dépenses à un niveau plus acceptable."
 AST_scrounge_a_penny: "Gagnez un centime"
 AST_scrounge_a_penny_desc: "Dans la quête d'économies par tous les moyens, il faut parfois être créatif, surtout pour augmenter les impôts. Annoncer bruyamment une hausse est un moyen sûr de réduire notre soutien alors que nous commençons à peine. Au lieu de cela, si nous relevons discrètement la cotisation Medicare de 1,5 % à 2 %, ceux qui la paient l'auront à peine remarqué, et nous aurons accumulé un joli surplus de financement pour le budget."
 AST_digitise_the_tvs: "Numériser les chaînes"
 AST_digitise_the_tvs_desc: "Après le succès du programme pilote à Mildura, nous déployons le reste de la bascule dans tout le pays, remplaçant les anciennes connexions par des décodeurs. Le déploiement est entièrement géré par nous, et devrait permettre même aux Australiens ruraux d'accéder à une gamme de nouvelles chaînes en bien meilleure qualité. La grande égalisation du divertissement commence ici."
 AST_our_own_white_paper: "Notre propre livre blanc"
 AST_our_own_white_paper_desc: "La Force de défense australienne a joué un rôle central comme bouclier sacré d'innombrables nations, proches et lointaines. À mesure que les demandes de protection ont grandi, le budget aussi, et aucune partie du gouvernement n'est à l'abri du gaspillage. L'armée restera aussi efficace que jamais, mais un dur nettoyage des déficiences devra être mené."
 AST_plain_cigarette_packaging: "Emballage de cigarettes ordinaire"
 AST_plain_cigarette_packaging_desc: "En dehors de nos coupes budgétaires, traiter la crise du cancer a été l'une de nos plus grandes priorités. Les publicités gouvernementales ont fait leur part, mais la disponibilité des cigarettes dans presque tous les commerces reste un problème central. Plutôt qu'interdire purement le tabac, remplacer les paquets de marque par de mini-avertissements sur les dangers du tabagisme rendra l'association avec le cancer impossible à ignorer. \n\nCela gardera les parents responsables, et fera peur à la jeunesse."
 AST_put_the_squeeze_on_them: "Serrer la vis"
 AST_put_the_squeeze_on_them_desc: "Une partie de notre réforme sanitaire des États a consisté à revoir les dépenses actuelles gérées par les États, et à les amender pour mieux délivrer des soins de façon opportune et efficace. Cette fois, nous proposerons une revue d'un autre genre, ciblée sur l'élimination du gaspillage. Comme la dernière fois, ils se battront probablement, mais finalement nous presserons jusqu'à la dernière goutte pour la ramener au budget."
 AST_australia_works: "L'Australie fonctionne"
 AST_australia_works_desc: "Aptly named, the program aims to incorporate the basis of 'Work For the Dole' into a government run, state-wide construction service, providing consistent work for those on welfare, and creating new jobs to keep the currently shrinking construction industry afloat. It's incredibly ambitious, but necessary to bring our country back on track."
 AST_free_the_market: "Un marché plus libre"
 AST_free_the_market_desc: "En ce moment, notre belle nation est étouffée par un gouvernement surchargé et un secteur privé tondue. Nous sommes ralentis et refusons simultanément de laisser les entreprises grandir d'elles-mêmes. Limiter cette emprise en réduisant l'étau fiscal, et en privatisant nos bureaux inutilisés, sera la relance dont nous avons besoin, et laissera le marché libre suivre son cours."
 AST_mediate_with_the_mines: "Médier avec les mines"
 AST_mediate_with_the_mines_desc: "La relation entre le Parti travailliste et les mines nous a été transmise dans un état moins qu'idéal. Un sérieux virage doit se produire si nous voulons travailler à leurs côtés pour la réforme, et le lieu pour commencer est au milieu. Organiser divers événements pour discuter des demandes et de l'opportunité de collaboration posera les fondations de notre travail à venir."
 AST_endorse_the_magnates: "Endorse the Magnates"
 AST_endorse_the_magnates_desc: "L'une de nos plus grandes PDG minières, Gina Rinehart, a directement approché l'administration pour aplanir sa demande d'amener 1 700 travailleurs étrangers qualifiés, complétant les mines nouvellement créées en Australie-Occidentale. Gina n'a été que supportive de notre nouveau gouvernement jusqu'ici, et bien démarrer avec elle pourrait être le bon point de départ si nous voulons danser avec les mines."
 AST_entice_competition: "Attirer la concurrence"
 AST_entice_competition_desc: "Si les syndicats s'inquiètent de la formation de monopoles, ouvrez le marché aux entreprises étrangères. La concurrence a modéré les économies pendant des siècles, et l'économie australienne n'est pas différente. Être un creuset d'idées fait partie de ce qui a construit ce pays dès le départ."
 AST_minerals_resource_tax: "Taxe sur les ressources minérales"
 AST_minerals_resource_tax_desc: "La taxe sur les superprofits était bien trop ambitieuse et livrée au pire moment possible. Nous devons coopérer avec les industries minières si nous voulons sortir de cette averse en un seul morceau. La coopération nous a d'ailleurs fourni cette petite législation. Vraiment, ce n'est pas assez pour entamer la monopolisation de nos ressources, mais il faudra faire avec pour l'instant."
 AST_bauxite_investment: "Investissement dans la bauxite"
 AST_bauxite_investment_desc: "L'aluminium s'avère l'un des métaux les plus importants du XXIe siècle. Il est partout, incroyablement utile, et nous en avons largement ici. Heureusement, une proposition pour une telle mine a atterri sur notre bureau, livrée à notre considération avec une demande d'investissement. Quand une telle occasion se présente, il est sage de ne pas la refuser."
 AST_pilbara_expansion: "Extension de Pilbara"
 AST_pilbara_expansion_desc: "La plupart des demandes de terres minières se gèrent au niveau local, cependant une demande est arrivée pour un site dans le Pilbara qui traverse la frontière d'un des parcs nationaux. Le site est assez loin de tout lieu de préservation, mais l'affaire est actuellement coincée à la Haute Cour. Nous pourrions peser de notre poids et accélérer son approbation, dans l'intérêt de notre économie bien sûr."
 AST_ease_on_restrictions: "Assouplissement des restrictions"
 AST_ease_on_restrictions_desc: "Beaucoup de projets miniers sont abandonnés chaque année à cause des restrictions environnementales. Même le plus mineur des sites de fouille peut être scrappé pour des zones de protection ou une nouvelle législation climatique. À ce stade, le plus grand frein à la croissance économique est un manque de disponibilité. Un concept ridicule vu la taille de l'Australie. Cela doit être amendé."
 AST_train_it_out: "Entraînez-le"
 AST_train_it_out_desc: "La scène minière d'Australie-Occidentale implore pratiquement des lignes ferroviaires lourdes en accès ouvert, reliant des mines reculées, comme le Pilbara, aux ports. Construire nos propres lignes gérées par l'État briserait le monopole que les géants détiennent sur l'infrastructure ferroviaire, et permettrait à des dizaines de mineurs de taille moyenne et juniors d'acheminer leur produit au port, augmentant drastiquement nos volumes d'exportation nationaux."
 AST_champion_the_mets_sector: "Défendre les METS"
 AST_champion_the_mets_sector_desc: "À force de fluidifier le pays pour l'exploitation minière, les corporations ont commencé à le traiter comme une « carrière du monde », pour ainsi dire. L'extraction des ressources est devenue une poursuite étroite. L'Australie doit être vue comme la Silicon Valley de la technologie minière. \n\nFinancer les organisations METS (équipement, technologie et services miniers), et orienter notre propre R&D vers l'exploitation à distance, accélérera le développement du transport autonome et fera évoluer nos techniques d'extraction. L'avenir minier se fera ici.\nFinancer les organisations METS (équipement, technologie et services miniers), et diriger notre propre R&D vers l'exploitation minière opérationnelle à distance, accélérera le développement du haulage autonome, et fera évoluer nos techniques d'extraction actuelles. L'avenir de la mine se fera ici."
 AST_the_australian_century: "Le siècle australien"
 AST_the_australian_century_desc: "Les âges d'or se rencontrent rarement par hasard, ou par un heureux concours. Ils sont le résultat d'un travail sur des décennies, voire des siècles, et rarement, s'ils le font jamais, ils se matérialisent. Contrairement aux nations de l'histoire, notre gouvernement ne tâtonne pas dans le noir. Tout ce que nous faisons aujourd'hui a été préparé des années à l'avance, et notre succès a été soigneusement planifié dès le début. C'est notre moment."
 AST_the_foreign_ministry: "Le ministère des Affaires étrangères"
 AST_the_foreign_ministry_desc: "La montée de l'Asie, et en particulier de la Chine, a placé l'Australie dans une position économique perpétuellement « à un cran en dessous » de ceux autour de nous. Bien que cela puisse alarmer certains, le XXIe siècle ne sera pas une continuation de l'unipolarité, et cela apporte un vent d'opportunités. Si nous sommes prêts à concourir et à surmonter nos prédispositions, le Pacifique se dresse comme un nouveau monde à exploiter ou à embrasser au bénéfice de notre nation."
 AST_foreign_minister_rudd: "Ministre des Affaires étrangères Rudd"
 AST_foreign_minister_rudd_desc: "The former leader might be the most experienced in foreign matters that we have in our roster. Kevin Rudd has spent decades cultivating a dialogue with the Asian nations, and has already played a crucial role for the government in growing more interlinked. Rudd has proposed a series of diplomatic tours to strengthen our position, and present Australia as the olive branch of the Pacific."
 AST_papua_residency: "Résidence en Papouasie"
 AST_papua_residency_desc: "L'économie papoue s'est lentement incorporée à la nôtre, à défaut d'un accord officiel. Rectifier cela en négociant un pacte économique complet scellera enfin l'affaire."
 AST_soften_the_emerald: "Adoucir l'émeraude"
 AST_soften_the_emerald_desc: "Pour une nation voisine si proche, on s'attendrait à une relation mutuellement enjouée. Malheureusement, le fossé n'a fait que grandir récemment, et envoyer Rudd pour aplanir les choses pourrait être le seul moyen de sauver les relations."
 AST_the_new_bear: "Le nouvel ours"
 AST_the_new_bear_desc: "Toute la nature de la Russie a changé dans ses années post-soviétiques. Le pays a lentement accepté l'idéologie du capitalisme, et permis des intérêts étrangers sous son manteau de fourrure. Ce pourrait être notre occasion de planter notre drapeau diplomatiquement, et d'arranger quelque chose qui nous favorise, malgré la distance."
 AST_entente_with_north_korea: "Entente avec la Corée du Nord"
 AST_entente_with_north_korea_desc: "Rudd a proposé un voyage dans la zone démilitarisée coréenne pour rencontrer le dirigeant nord-coréen, dans l'espoir de rapprocher les deux nations d'une coexistence pacifique. Il vise un peu les étoiles, mais le plan est plutôt solide, et ce seront les premières ouvertures que nous aurons faites directement avec les Nord-Coréens."
 AST_foreign_minister_smith: "Ministre des Affaires étrangères Smith"
 AST_foreign_minister_smith_desc: "Stephen Smith est un membre éminent du parti depuis Keating, et il a été le premier à offrir ses services au ministère des Affaires étrangères. Sa politique s'aligne assez bien avec la nôtre en ce que Smith veut que l'Australie émerge comme le point d'intersection du commerce dans le Pacifique. Utiliser le nouveau monde comme point de croissance de notre pertinence économique à l'étranger, de quelque façon que ce soit au bénéfice du pays."
 AST_our_glowing_deposits: "Nos gisements lumineux"
 AST_our_glowing_deposits_desc: "Les gisements sont là, il nous suffit de les exporter. Notre client actuel nous harcèle pour des droits miniers depuis un moment, et il n'est que juste que nous offrions la marchandise."
 AST_the_best_of_both_worlds: "Le meilleur des deux mondes"
 AST_the_best_of_both_worlds_desc: "Nous naviguons un acte d'équilibriste complexe, maintenant une alliance profonde de sécurité et de défense avec les États-Unis, tout en poursuivant une interdépendance commerciale stabilisée avec la Chine. Éviter d'être forcés de choisir entre les deux est la façon dont nous sommes restés à flot."
 AST_made_in_vietnam: "Fabriqué au Vietnam"
 AST_made_in_vietnam_desc: " C'était un sentiment étrange pour beaucoup d'Australiens de regarder les biens qu'ils achetaient toujours et de voir soudain le petit texte en bas leur disant que ce n'était pas fait ici, mais dans un endroit appelé « Vietnam ». Ce n'était pas facile à avaler, mais quand leurs poches étaient plus pleines et les magasins plus variés, ils s'en sont vite remis."
 AST_foreign_minister_carr: "Ministre des Affaires étrangères Carr"
 AST_foreign_minister_carr_desc: "Bob Carr est peut-être le plus grand réaliste de notre liste, ou du moins le plus pragmatique. Au fond, Carr croit que la politique étrangère est une série d'improvisations. L'Australie doit simultanément jongler avec sa quête de paraître le centre moral du Pacifique, tout en n'ayant pas peur de se salir les mains pour protéger nos intérêts. Comment nous équilibrons cela est le vrai test."
 AST_smother_the_pot: "Remuer le chaudron"
 AST_smother_the_pot_desc: "Les intérêts australiens sont devenus si enchevêtrés au Moyen-Orient que tout ce qui s'y passe nous affecte ici. La dernière décennie a transformé un chaudron bouillant de tumulte en un feu furieux dont nous ne pouvons pas rester à l'écart."
 AST_the_big_boys_club: "Le club des grands"
 AST_the_big_boys_club_desc: "There are 5 permanent seats in the United Nations Security Council, and 10 non-permanent positions, cycled in and out every few years. Policy that affects the entire world is decided in the UN's chambers between those countries. With our own responsibilities so heavily intertwined with the rest of the world, it's only fair we get a seat at the table. We need to work on increasing our odds of getting in."
 AST_global_weapon_trading: "Commerce mondial d’armes"
 AST_global_weapon_trading_desc: "Carr utilise notre position à l'ONU pour plaider fortement un traité mondial sur le commerce des armes, visant à suivre et réduire l'approvisionnement d'armes aux États défavorables et aux groupes terroristes, tout en rendant les ventes d'armes de notre part et d'autres nations occidentales plus attrayantes. C'est audacieux, mais il rassemble actuellement du soutien à New York pour le faire passer."
 AST_myanmar_intervention: "Intervention du Myanmar"
 AST_myanmar_intervention_desc: "L'effondrement du Myanmar s'est transformé en cauchemar humanitaire. Quel que soit le choix que nous fassions de nous impliquer, il aura ses propres conséquences, tout autant que rester à l'écart."
 AST_consuls_of_peace: "Consuls de la paix"
 AST_consuls_of_peace_desc: "Le destin de l'Australie est fermement ancré dans la coopération mondiale. Nos missions à l'étranger et le maintien de la paix ont invariablement visé à encourager, et parfois restaurer, un ordre fondé sur des règles. C'est un rôle dans lequel nous excellons, et une réputation que nous devons préserver."
 AST_centurians_of_the_pacific: "Pacific Centurions"
 AST_centurians_of_the_pacific_desc: "Les règles de l'intervention mondiale ont changé depuis le tournant du nouveau siècle. La sécurité nationale a pris la place des libertés civiles traditionnelles, et le cadre de prévention a été adopté par presque tous les pays occidentaux à la suite d'attaques fondamentalistes. On ne se fait pas de nouveaux amis ni ne protège ce pays en se limitant aux règles d'antan, mais on se fait une cible si l'on ne réagit pas de façon appropriée."
 AST_the_costello_government: "Le gouvernement Costello"
 AST_the_costello_government_desc: "Australia is over 100 years old now, and it's come a long way since federation. With a population only a fraction of our neighboring nation's, our economy is rapidly becoming one of the largest in the world in spite of that. Our people have seen the country around them grow richer and more prosperous than previous generations ever dreamed, and yet the real riches remain untapped. \n\nOur potential remains just below the surface, like an oil vein, waiting to be cracked open. Monetary management of the mines has seized up, and many of our biggest industries have become complacent. Welfare has become a dead weight on our budget, and small businesses still fight an uphill battle to access an ever shrinking market. \n\nThe way of our governance has to change."
 AST_a_bastion_for_commerce: "Un bastion du commerce"
 AST_a_bastion_for_commerce_desc: "À mesure que les nations reliées par le Pacifique se rapprochent, la demande d'un point médian pour le commerce est devenue plus apparente. L'Australie a maintenant l'occasion de se dresser comme un phare du commerce, liant diverses économies en un port, comme Constantinople et Venise avant elle."
 AST_bring_in_the_chains: "Faire entrer les chaînes"
 AST_bring_in_the_chains_desc: "Nous avons grandement bénéficié de l'importation de cultures de près et de loin. Les entreprises n'y font pas exception. Nous avons déjà une file à la porte de ceux qui demandent à s'installer. Je dis qu'on les laisse faire."
 AST_domestic_demands: "Demandes intérieures"
 AST_domestic_demands_desc: "L'opinion que nous et les cols bleus de notre nation partageons, c'est que l'industrie locale compte. Une industrie intérieure forte devrait pouvoir affronter n'importe quel ralentissement économique mondial, et ainsi, avec un peu de soin, elle le fera."
 AST_outsource_the_troubles: "Sous-traiter les ennuis"
 AST_outsource_the_troubles_desc: "Les pénuries de main-d'œuvre sont devenues notre plus grand obstacle à une croissance continue ces dernières années. Nous n'avons tout simplement pas assez de travailleurs pour combler le fossé, et toute solution à long terme laissera passer nos meilleures années d'expansion. Il faut regarder à l'étranger."
 AST_come_one_come_all: "Que tous viennent"
 AST_come_one_come_all_desc: "Notre argent doit rester en Australie, du moins nos salaires. Le meilleur moyen de boucher le trou de l'emploi est de s'occuper du bas de l'échelle. Des milliers veulent tenter leur chance de travailler en Australie. Il n'y a qu'à ouvrir la porte."
 AST_off_with_tariffs: "Soulager le marché"
 AST_off_with_tariffs_desc: "L'économie libérale a donné naissance au concept d'« abondance ». L'idée que des marchés plus libres et une plus libre opportunité de dépenser mènent inévitablement à une société mieux lotie. Un concept tentant que nos entreprises sont impatientes d'essayer. Les taxes pesantes qui restent encore doivent être arrachées."
 AST_negotiate_with_the_rba_ast: "Négocier avec la RBA"
 AST_negotiate_with_the_rba_ast_desc: "Un peu de douce persuasion auprès de la Reserve Bank pourrait nous donner la marge dont nous avons besoin pour un flux économique. Heureusement, nous avons les connexions pour persuader la banque de baisser les taux d'intérêt, et d'inciter la dépense des consommateurs en attendant."
 AST_fix_the_trade_woes: "Réparer les maux du commerce"
 AST_fix_the_trade_woes_desc: "Si l'import et l'export de biens à travers notre nation ont atteint des niveaux énormes en très peu de temps, la confusion générale avec notre système commercial a aussi grandi parmi nos entreprises. Les déficits commerciaux et une gestion inefficace handicapent nos marges, et ralentissent les processus du commerce. La création d'une nouvelle agence sera nécessaire. Une dédiée à lisser tout le processus."
 AST_adventure_in_the_usa: "Aventure aux USA"
 AST_adventure_in_the_usa_desc: "America has always been, and may always be, our biggest investor. The land of the big mac, home of the free, and friend to all. We would be remiss if we didn't go to them for the next step in our economic evolution."
 AST_im_an_oil_man: "Je suis un homme du pétrole"
 AST_im_an_oil_man_desc: "Cela crie que nous devrions avoir notre propre développement pétrolier dans ce pays. Nous avons les puits, et nous avons le paysage pour cela. Le processus a simplement trop duré, et par notre gouvernement ces lacets seront tirés. Plus de pétrole coulera."
 AST_for_queen_and_company: "Pour la Reine et la compagnie"
 AST_for_queen_and_company_desc: "Nos ouvertures aux États-Unis ont assez appâté les eaux pour inciter quelques sociétés anglaises à étendre leur part dans notre secteur agricole."
 AST_rail_endeavors: "Efforts ferroviaires"
 AST_rail_endeavors_desc: "We've worked alongside the Bechtel Corporation for our long distance rail lines before, now they and the state governments are looking to broach a development research project together. They've already offered specs for new electric and diesel models. Now we just need to sign off on it."
 AST_the_miracle_economy: "L'économie miracle"
 AST_the_miracle_economy_desc: "Déjà les médias parlent du succès de notre économie comme d'un miracle en ces temps. Bien sûr, ce n'est pas un miracle du tout. Notre succès a toujours reposé sur la solidité de notre jugement et de notre soin. Ainsi, comme un jardin bien entretenu, le résultat de notre gestion a fleuri en quelque chose de spectaculaire."
 AST_ride_the_bubble: "Surfer sur la bulle"
 AST_ride_the_bubble_desc: "Quand la bulle internet a frappé il y a quelques années, on avait l'impression que le ciel nous tombait littéralement dessus. Des cours d'actions bâtis sur des milliards d'investissements informatiques éclataient soudain, et des milliards de plus étaient perdus. Cette fois, nous nous assurons que le sol est ferme pour les investissements informatiques, avec l'infrastructure pour soutenir la croissance et la régulation la plus légère nécessaire pour empêcher le système de s'effondrer à nouveau."
 AST_silicon_dreams: "Rêves de silicium"
 AST_silicon_dreams_desc: "L'ambition de devenir un jour une nation technologiquement indépendante commence par notre capacité à fabriquer des puces commerciales. En commençant à petite échelle, nous pouvons dispenser des fonds aux groupes de recherche sur les puces, et permettre une installation d'essai à Victoria pour lancer les choses."
 AST_jobs_for_the_needy: "Des emplois pour les nécessiteux"
 AST_jobs_for_the_needy_desc: "L'erreur d'avoir instauré le Work For the Dole est quelque chose dont nous payons encore le prix. Les travailleurs n'auraient jamais dû être retirés des industries privées pour des travaux publics. Tout le point de l'aide sociale devrait être de mettre au travail ceux qui peuvent travailler. Un nouveau programme devra prendre sa place."
 AST_keep_it_competitive: "Restez compétitif"
 AST_keep_it_competitive_desc: "Plus nous grandissons industriellement, plus le risque d'un marché biaisé augmente. Les monopoles peuvent devenir des fléaux si on les laisse faire, et le triste fait est que la régulation est la chose la plus proche d'une défense sûre contre eux. Nous pouvons travailler au niveau des États pour coordonner la politique et partir de là."
 AST_shatter_the_iron_curtain: "Briser le rideau de fer"
 AST_shatter_the_iron_curtain_desc: "La guerre froide s'est terminée pour l'Australie quand nous avons serré la main de Mao en 73. Nous avons joui d'une amitié qui a survécu à tout partisanisme de parti ou crise mondiale depuis. Un forum devra être créé pour assurer que l'avenir de nos collaborations reste sûr et au-dessus de tout soupçon."
 AST_our_man_in_beijing: "Notre homme à Pékin"
 AST_our_man_in_beijing_desc: "Alexandre Downer, notre ministre des Affaires étrangères de longue date et désormais vice-Premier ministre, s'est rapproché assez du gouvernement chinois et de sa classe d'affaires pour que certains dans notre propre parti se demandent où sont ses loyautés. Quoi qu'il en soit, nous aurons besoin de son insight pour tirer quelque chose de significatif de notre nouveau partenariat. En commençant par le prochain vol pour Pékin."
 AST_the_lithium_projects: "Greenbushes Projects"
 AST_the_lithium_projects_desc: "Greenbushes' Lithium Projects have become a promising development for our Western Australian communities. Aiming to produce 1 million tonnes annually of lithium by the project's end, making us one of the world's biggest processed lithium exporters by then. All they need now is a little fiscal push."
 AST_cater_to_investors: "Flatter les investisseurs"
 AST_cater_to_investors_desc: "Les promoteurs chinois représentent plus de 60 pour cent de nos propriétaires fonciers basés à l'étranger. Ce type d'investissement commence à former l'épine dorsale de notre industrie du développement foncier, et garder leurs intérêts alignés est nécessaire pour que cette relation se poursuive en douceur."
 AST_the_future_fund: "Le Future Fund"
 AST_the_future_fund_desc: "The initial idea for the fund was to help cover our public servants' superannuations, but the concept could very well be used to power our nation's foreign investments. Already it's brought in a surprising amount from overseas investors, in particular the Belgium-based group Euroclear, and it's time to put it into action."
 AST_a_friendly_union: "Un syndicat plus convivial"
 AST_a_friendly_union_desc: "Un syndicat qui ne nous a pas aboyé dans le dos, c'est le genre européen. Des progrès ont été faits pour organiser la levée des limitations sur les ventes de voitures européennes dans notre pays, du moins pour les prochaines années. Une visite au siège de l'UE pourrait lancer les choses pour nous, et offrir à nos consommateurs de belles nouvelles options."
 AST_fechado: "Fechado!"
 AST_fechado_desc: "La prospérité croissante de l'économie minière brésilienne n'a pas échappé à nos industriels miniers, qui nous ont pétitionnés pour assouplir les réglementations d'import d'équipement minier. Cela ne nous coûterait presque rien, et nous rapprocherait de nos copains du G20."
 AST_the_republic_question: "La question républicaine"
 AST_the_republic_question_desc: "Since our federation, Australia has remained the de facto subject of the English crown. Our constitution is a monarchical one, and our head of state is still that of the United Kingdom. While it worked for a period, the temper of the times is democratic. We don't appoint people to office by heredity. In our society and our time we prefer appointments by merit. \n\nAustralia will have its day as a truly independent nation."
 AST_how_we_sell_it: "Comment on le vend"
 AST_how_we_sell_it_desc: "Obtenir le soutien populaire pour notre référendum sera le dernier obstacle de la course. Une majorité nationale de tous les électeurs, et le soutien de 4 des 6 États et territoires seront nécessaires. Un exploit impossible si nous ne gagnons pas les cœurs et les esprits du public. Il faut lancer les machines médiatiques et commencer à rassembler le soutien en personne."
 AST_send_it_through: "Envoyez-le via"
 AST_send_it_through_desc: "Après l'échec du référendum de 1999, le sujet d'une république a aigri pour la plupart du Parlement comme un présage de malchance. Nous sommes en net désavantage par rapport à la dernière fois. Il faudra peut-être tordre quelques poignets pour le faire avancer."
 AST_our_commonwealth: "Notre Commonwealth"
 AST_our_commonwealth_desc: "On ne peut pas jeter au vent près de deux siècles d'histoire et de parenté. Surtout pendant une période de transition comme celle-ci. Réaffirmer notre engagement envers le Commonwealth pourrait apaiser les craintes de certains royalistes encore indécis."
 AST_free_from_binds: "Libres de nos liens"
 AST_free_from_binds_desc: "Notre départ de la monarchie ne peut pas se mesurer à moitié. Nos liens avec la Couronne doivent être coupés, et avec eux la couverture douce qui nous a tenus au chaud toutes ces années. Le changement dont nous avons besoin est celui qui laisse des coupures et des bleus après avoir percé le plafond de verre. Ce ne sera pas facile."
 AST_run_the_games: "Organiser les Jeux"
 AST_run_the_games_desc: "Every four years our athletes suit up to compete in the Commonwealth Games, a multi-sport spectacle not that dissimilar to the Olympic Games, assembling those across the world within the Commonwealth of Nations. The timing might be just right for us to petition to host the upcoming games."
 AST_kowtow_to_the_crown: "S'incliner devant la Couronne"
 AST_kowtow_to_the_crown_desc: "Recevoir une bénédiction officielle de la monarchie mettra enfin un terme à la faction d'opposition, certes au prix d'aliéner quelques-uns de nos propres républicains, mais quand les voix commenceront à arriver, ils resteront à peine critiques."
 AST_crossing_the_floor: "Traverser l'hémicycle"
 AST_crossing_the_floor_desc: "Les têtes travaillistes vont rire en allant à la banque quand ils apprendront que nous avons besoin d'eux pour le vote. Ce ne sera pas facile de les humilier, et sans doute ils feront leurs demandes, mais le chemin est en avant. Qu'on le veuille ou non, ce sont nos nouveaux alliés pour le moment."
 AST_approaching_the_governor: "Approcher le gouverneur"
 AST_approaching_the_governor_desc: "La dernière étape du processus. La situation est un peu gênante, vu la nature de remettre au gouverneur général sa propre démission. Nous ne pouvons qu'espérer qu'ils le prennent bien."
 AST_a_shining_example: "Un exemple brillant"
 AST_a_shining_example_desc: "Nous devons nous dresser comme l'exemple d'une démocratie réussie pour les nations du Pacifique. Notre succès dans cette grande tâche sera un testament pour ceux non seulement de la région, mais bien au-delà. Même à l'âge de notre pays, nous pouvons jeter les chaînes du contrôle."
 AST_no_kings: "Pas de rois"
 AST_no_kings_desc: "Les mécanismes de notre nouvelle Constitution doivent refléter les réalités des virages politiques modernes. Aucun système n'est immunisé contre sa propre perte, mais ils peuvent être rendus résilients. Les pouvoirs seront séparés et il y aura une surveillance, avec des garanties tierces pour s'assurer que les idées autoritaires et réactionnaires soient tenues en échec."
 AST_endow_the_arts: "Doter les arts"
 AST_endow_the_arts_desc: "La liberté d'expression est l'un des piliers de la démocratie, et l'est depuis l'Eureka Stockade. Franchement, tout investissement dans les arts est typiquement un gaspillage, mais s'il y a une chose dont nous devons paraître sensibles en ce moment, c'est la culture."
 AST_hold_onto_the_wild: "Tenir le sauvage"
 AST_hold_onto_the_wild_desc: "Dans un effort pour encourager plus de sylviculture en banlieue, les propriétaires qui choisissent de mettre de côté une partie ou la totalité de leur terre pour la conservation à perpétuité se verront accorder une moindre charge fiscale dans le cadre de l'impôt sur les plus-values. Pendant ce temps, nous pourrons nous assurer que les protections des parcs nationaux sont codifiées dans notre nouvelle Constitution. Les garder en sécurité pour les décennies à venir."
 AST_a_generation_to_persevere: "Une génération pour persévérer"
 AST_a_generation_to_persevere_desc: "L'avenir de notre nation est entièrement entre les mains des générations après nous. S'occuper d'elles et s'assurer qu'elles reçoivent le savoir suffisant pour prospérer est primordial pour que notre mode de vie prévale. L'éducation doit devenir un droit constitutionnel, octroyé par notre Commonwealth."
 AST_enshrine_the_protections: "Consacrer les protections"
 AST_enshrine_the_protections_desc: "La prochaine étape de modification de notre constitution doit être mémorable. Pas seulement dans les systèmes de gouvernance, mais aussi pour nos citoyens. Nos plus vulnérables ne devraient pas voir le niveau de leurs droits déterminé par qui occupe le plus grand fauteuil à Canberra. Ils doivent être inscrits dans la constitution, et rendus permanents pour l'avenir prévisible. \n\nL'Australie n'est pas un pays où les uns sont protégés, mais où tout le monde l'est. Point."
 AST_modernize_the_communities: "Moderniser les communautés"
 AST_modernize_the_communities_desc: "Nous avons un certain nombre de programmes en préparation visant à diriger plus de contrats vers nos communautés à bas revenus, destinés à apporter plus de travail à ceux qui n'en ont pas, et à améliorer l'image des plus petites villes en difficulté."
 AST_with_heritage_to_remember: "Un héritage à se souvenir"
 AST_with_heritage_to_remember_desc: "Le chemin de la réconciliation atteint à bien des égards sa prochaine phase. La main du soutien devra encore se tendre, mais cette fois pour se transmettre. \n\nAmender la constitution pour permettre aux propriétaires traditionnels locaux de négocier des traités formels relatifs à la préservation et à la souveraineté foncière, ainsi que des droits d'approbation du développement, remet les rênes de la réconciliation à la communauté. Donner aux communautés locales le droit à leur propre avenir, et la capacité de sauvegarder leur passé."
 AST_one_last_push: "Un dernier coup de pouce"
 AST_one_last_push_desc: "Nous avons le mandat. Les voix sont en train d'être comptées. Nous ne pouvons qu'espérer que l'histoire soit de notre côté cette fois."
 AST_a_new_constitution: "Une nouvelle Constitution"
 AST_a_new_constitution_desc: "The next era of Australian governance lies ahead. The step we make now, boisterous, maybe even a little foolhardy, sets the stage for the history books. Upon this rock we are building the future of the nation, our new constitution."
 AST_the_mining_snag: "L'accroche minière"
 AST_the_mining_snag_desc: "Vraiment, l'industrie minière a été traitée de façon mesquine plus d'une fois ces dernières années, bien que nous ne puissions ignorer les péchés du secteur. Un accord doit être trouvé entre nous, entre les besoins du gouvernement et les droits des industriels. Une trêve sera négociée."
 AST_a_little_of_this: "Un peu de ceci"
 AST_a_little_of_this_desc: "A few big companies with stakes in the mines are also invested in the logging industry. An industry which after years of pushback by environmental groups has stripped it of its earnings. Opening up some of the state forests for harvest and dropping a regulation or two can win us some of the favor we need."
 AST_formal_investigation: "Enquête formelle"
 AST_formal_investigation_desc: "La coercition systémique et le clientélisme sont le résultat plus courant de l'industrie minière devenue trop politisée. Nous ne pouvons pas éliminer toute la pourriture, mais nous pouvons agiter les choses avec une commission formelle sur les mines, visant à découvrir une part de la corruption la plus ostensible en surface."
 AST_for_a_bit_of_that: "Pour un peu de ça"
 AST_for_a_bit_of_that_desc: "Chaque plainte des mines porte généralement sur une régulation trop pesante. Elles font du lobbying contre, leurs campagnes médiatiques s'y opposent. Elles sont pratiquement à notre porte en tapant pour les retirer. Tant qu'elles y sont, leur offrir un recul temporaire pourrait ouvrir leur esprit à la réforme."
 AST_training_the_next_miners: "Former les prochains mineurs"
 AST_training_the_next_miners_desc: "L'enseignement professionnel au TAFE devrait nous fournir la mesure la plus rapide pour former de nouvelles recrues pour l'industrie, à peu de frais pour eux, et même un peu d'incitation pour ceux qui le choisissent."
 AST_when_opportunity_calls: "Quand l’opportunité se présente"
 AST_when_opportunity_calls_desc: "Le ministère des Affaires étrangères est revenu du Moyen-Orient avec une offre directement de la maison des Saoud, pour une collaboration intéressante dans nos entreprises minières. C'est la première interaction que nous ayons eue avec eux sur le sujet, et quoi qu'ils aient en tête, cela pourrait être trop lucratif pour le laisser passer."
 AST_tussle_with_the_media: "Se battre avec les médias"
 AST_tussle_with_the_media_desc: "Nous ne pouvons pas laisser les corps miniers avoir tout le mot. Même avec les médias Murdoch contre nous, nous pouvons encore faire passer notre mot dans la presse et exposer certaines de nos découvertes à la télévision nationale."
 AST_war_with_the_party: "Guerre avec le parti"
 AST_war_with_the_party_desc: "Avec la force actuelle de la campagne contre nous, certains membres du parti commencent à se disperser. Soit en rejoignant les médias pour fustiger notre gouvernement, soit en tentant de s'en distancier. Nous devons passer à l'offensive. Rassembler les déserteurs et isoler les grandes gueules des médias. Leur faire comprendre que nous sommes encore aux commandes."
 AST_no_gas_all_breaks: "Pas d'essence, toutes les pauses"
 AST_no_gas_all_breaks_desc: "Nous devons rompre avec la tradition du parti de patronage aux mines. Les opportunités dans notre secteur renouvelable évoluent et s'améliorent chaque jour. Iberdrola a une série de centrales réussies à Victoria actuellement. Avec un peu de financement et d'approbation gouvernementaux, elles s'installeront à travers la nation."
 AST_the_processing_debacle: "La débâcle du traitement"
 AST_the_processing_debacle_desc: "À la suite de nos constatations, un grand poids a été placé sur nous pour trouver une solution pour ces immigrants. Ce ne sera pas un choix facile, mais pour nous ça l'est rarement."
 AST_bowen_expansion: "Extension Bowen"
 AST_bowen_expansion_desc: "BHP have made a request for an express approval of their new pipeline in Queensland's Bowen Basin. Built to massively speed up their steel production there. A bit of kickback has come up from environmental groups regarding the route going through Koala habitats, but the project reps have assured us the damage will be minimal."
 AST_fortescue_lines: "Lignes de secours"
 AST_fortescue_lines_desc: " Notre plus grand pôle minier de minerai de fer est situé en Australie-Occidentale et géré par la société Fortescue. Ils nous ont invités à investir conjointement dans leur projet Magnétite, livrant de plus grands volumes de minerai avec moins d'émissions. Dans ce cas, cela pourrait nous retirer un peu de chaleur si nous plaisons à la fois aux mines et aux écologistes."
 AST_secure_resource_tax: "Taxe sur les ressources sécurisée"
 AST_secure_resource_tax_desc: "Enfin notre première taxe complète sur la rente des ressources, visant à s'attaquer à certaines inefficacités fiscales pendant le boom minier. Avec des dispositions pour s'assurer que nos plus petites entreprises et mines ne soient pas gênées, un nouveau flux de recettes coulera dans notre budget sans affecter la productivité."
 AST_an_open_ear: "Une oreille ouverte"
 AST_an_open_ear_desc: "Les restrictions climatiques de nos prédécesseurs ont jeté toute l'industrie hors de ses gonds, tant elles sont devenues limitantes. Comment même espérer concourir quand les nations autour paient si peu du coût. Une main plus douce de régulation doit être édictée, et un répit des restrictions actuelles sera mis en place jusqu'à ce que nous trouvions quelque chose de sensé."
 AST_olympic_dam_developments: "Développements du barrage olympique"
 AST_olympic_dam_developments_desc: "La Western Mining Corporation nous a approchés pour une entreprise de recherche conjointe, utilisant la mine d'uranium d'Olympic Dam. Nous avons aussi reçu de très fortes protestations contre la mine, de l'intérieur et de l'extérieur du Parlement, concernant ses effets sur la communauté locale. Toute expansion de la mine et des installations là-bas entraînera un retour de bâton, mais ce n'est guère quelque chose que nous ne puissions encaisser."
 AST_changing_the_system: "Changer le système"
 AST_changing_the_system_desc: "Nous avons fait du chemin dans notre gestion de l'industrie. Les profits arrivent désormais plus propres et en plus grand volume que jamais. Beaucoup peut encore être fait pour en améliorer la nature, mais pour l'instant nous pouvons regarder en arrière et admirer le travail."
 AST_the_turnbull_government: "Le gouvernement Turnbull"
 AST_the_turnbull_government_desc: "Ce focus est un placeholder. Un arbre de focus Turnbull est en développement et sera bientôt publié !"
 corroboree_event.1.t: "Le discours à Corroboree"
 corroboree_event.1.d: "Howard se tenait derrière l'aîné alors qu'il faisait la présentation du [GetASTLeaderTitle]. Il prononcerait son discours à Corroboree. Une chose qui était devenue une signature de son style de campagne et de gouvernance depuis son élection. Cette fois-ci, cependant, la foule serait froide. Il n'y eut pas de cris passionnés alors qu'il délivrait sa rhétorique de « réconciliation pratique » et d'approche mesurée. Une grande partie de la foule attendait depuis des heures, et il semblait que personne n'était impressionné par ce qui ressemblait à des promesses creuses de progrès. Quelques-uns s'éloignèrent, et certains huèrent en tournant le dos en signe de protestation. \n \nAprès le discours, et des applaudissements mitigés, Howard s'entretint longuement avec les aînés. Il n'accorda aucune concession pour des excuses, ni aucun geste qu'il considérait comme des « gestes vides ». Les parties finirent par se séparer, et une atmosphère de déception persista pendant un certain temps."
 corroboree_event.1.a: "Ça aurait pu être pire..."
 mining_giants_talk.1.t: "Une rencontre avec les géants"
 mining_giants_talk.1.d: "Comme prévu, les divers dirigeants miniers ont demandé que nous prolongions nos réductions d'impôts pour profiter du boom minier en cours. Ils justifient leur demande en affirmant que les fonds économisés leur permettraient d'étendre leurs opérations à long terme. La réduction supplémentaire est minime et ne devrait pas compromettre nos finances, mais nous pourrions refuser la demande et simplement garder les choses en l'état. Alternativement, nous pourrions augmenter le taux d'imposition pour récolter nous-mêmes une partie de ce boom, avec peu de conséquences immédiates."
 mining_giants_talk.1.a: "Accordez-leur la réduction d'impôt."
 mining_giants_talk.1.b: "Gardons les choses en l'état."
 mining_giants_talk.1.c: "Augmentez le taux d'imposition et prenons notre part."
 civil_partnership_act.1.t: "La loi sur les partenariats civils adoptée à l'échelle nationale"
 civil_partnership_act.1.d: "Rassemblés devant Capital Hill, des milliers de militants furent les premiers à voir Peter Costello annoncer que la première loi sur la reconnaissance des mariages avait été adoptée presque à l'unanimité. Le projet de loi transpartisan fut adopté après qu'un sondage postal national ait donné à la réforme un élan sans précédent. Présenté par la Coalition, qui n'avait auparavant reconnu que les concepts du mariage traditionnel, et soutenu par presque tous les membres du Parti travailliste et des Verts, l'adoption fut un choc pour une grande partie de la foule, qui réagit avec un mélange de larmes et de joie. Costello déclara que la loi n'était pas seulement un pas pour les droits des homosexuels, mais « les droits de tous les Australiens », et que la porte était ouverte à des réformes futures. Bien que les couples doivent encore se marier en dehors du pays, ceux déjà mariés pourront désormais lier légalement leur partenariat."
 civil_partnership_act.1.a: "Tant mieux pour eux."
 the_national_apology.1.t: "Les excuses nationales"
 the_national_apology.1.d: "Après ce qui semblait être des atermoiements, John Howard a présenté des excuses nationales officielles pour les torts historiques causés à la population indigène du pays : les Aborigènes et les Insulaires du détroit de Torrès. \nLe geste historique, basé sur le rapport « Bringing Them Home » de 1997, a été présenté au Parlement par le [GetASTLeaderTitle] et a envoyé une onde de choc émotionnelle à travers l'Australie. Des foules dans la Grande Salle et sur les pelouses devant le Parlement ont acclamé et applaudi. Plusieurs milliers de personnes se sont rassemblées sous la pluie pour regarder le discours mémorable dans les rues de Sydney. Un profond sentiment de soulagement et de guérison a été ressenti par la communauté, et beaucoup saluent les efforts de réconciliation de la Coalition comme un succès incontestable."
 the_national_apology.1.a: "Il est temps d'avancer."
 pacific_solution.1.t: "La solution pacifique"
 pacific_solution.1.d: "The Australian government has approached us with a proposal regarding asylum seeker processing facilities. In exchange for hosting these sites, they have offered to significantly upgrade our local infrastructure and naval port facilities to support operations."
 pacific_solution.1.a: "Acceptez l'investissement australien."
 pacific_solution.1.b: "Notre souveraineté n'est pas à vendre."
 pacific_solution.3.t: "La Papouasie-Nouvelle-Guinée accepte"
 pacific_solution.3.d: "Heureusement, le gouvernement papouan-néo-guinéen a accepté notre proposition. La construction des nouvelles installations de traitement commencera rapidement."
 pacific_solution.3.a: "Comme prévu."
 pacific_solution.4.t: "La Papouasie-Nouvelle-Guinée refuse"
 pacific_solution.4.d: "Nos voisins ont refusé la proposition, invoquant des inquiétudes concernant la souveraineté et l'opposition locale. Nous devrons trouver un autre moyen."
 pacific_solution.4.a: "Décevant."
 pacific_solution.5.t: "Nauru accepte"
 pacific_solution.5.d: "Le gouvernement régional de Nauru a accepté notre proposition. Une autre étape de nos opérations dans le Pacifique s'est déroulée sans accroc."
 pacific_solution.5.a: "Comme prévu"
 pacific_solution.6.t: "La solution pacifique rejetée"
 pacific_solution.6.d: "Nauru declined the proposal. It appears they won't be helpful in our immigration problems and have instead resigned themselves to remaining isolated in the Pacific."
 pacific_solution.6.a: "C'est désastreux..."
 stomp_out_the_roots.1.t: "L'Australie propose une coopération antiterroriste"
 stomp_out_the_roots.1.d: "The Australian government has proposed a joint security initiative focused on countering and eliminating extremist cells within our country. They are offering extensive tactical support and intelligence sharing."
 stomp_out_the_roots.1.a: "Coopérez pour une Indonésie plus sûre."
 stomp_out_the_roots.1.b: "Nous pouvons gérer notre propre sécurité intérieure."
 stomp_out_the_roots.2.t: "L'Indonésie accepte la coopération"
 stomp_out_the_roots.2.d: "Jakarta a officiellement accepté notre proposition. Nos opérations sur leur territoire peuvent commencer immédiatement, et nos agences de renseignement gèrent déjà le transfert."
 stomp_out_the_roots.2.a: "Le début d'un partenariat solide."
 stomp_out_the_roots.3.t: "Jakarta rejette l'initiative conjointe"
 stomp_out_the_roots.3.d: "Le gouvernement indonésien a refusé notre offre de coopération militaire, préférant gérer les affaires seul."
 stomp_out_the_roots.3.a: "Leur perte."
 state_visit: "Visite d'État"
 ast_off_to_delhi.1.t: "Une visite en Inde"
 ast_off_to_delhi.1.d: "Après que Howard soit descendu de l'avion, ce fut sourires et poignées de main jusqu'au podium. Après leur indépendance, nous avons maintenu des relations tièdes. Assez pour ne pas offenser. Maintenant nous nous rencontrions pour la quatrième fois ce mois-ci. Les médias locaux savouraient l'occasion de montrer l'attrait de l'Inde auprès des dirigeants étrangers, et n'ont pas perdu de temps à éreinter Howard pour ses politiques chez lui. Cela n'allait pas suffire à détourner le gouvernement. Nous exporterions de l'uranium à un rythme plus élevé que n'importe quelle autre nation voisine, et ils souriaient et hochaient la tête avec la promesse de non-enrichissement, tandis que nous souriions avec eux. En fin de compte, c'était un autre « coup de pouce » pour l'Australie. C'est nous qui récoltions les bénéfices, et chaque poignée de main nous rapprochait d'être le plus grand exportateur du Pacifique."
 ast_off_to_delhi.1.a: "Gagnant-gagnant pour les deux nations."
 ast_trade_deal: "Accord commercial majeur"
 ast_trade_agreement: "Accord commercial"
 refused_trade_deal: "A refusé notre accord commercial"
 marks_trade.1.t: "Offres commerciales de l'Australie"
 marks_trade.1.d: "Dans le but de renforcer les liens économiques régionaux, le gouvernement australien a proposé un accord commercial « sans droits de douane ». La proposition inclut une réduction des restrictions sur l'importation de nos produits électroniques en échange de droits miniers exclusifs. Nos deux nations ont tout à gagner de l'augmentation des échanges de biens entre nous, cependant, le choix nous appartient."
 marks_trade.1.a: "Un partenariat prospère nous attend."
 marks_trade.1.b: "Nos marchés doivent rester protégés."
 ast_our_capacity_for_peace.1.t: "L'Australie propose une initiative de maintien de la paix"
 ast_our_capacity_for_peace.1.d: "Visant à sauvegarder la stabilité du Pacifique, le gouvernement de Canberra nous a approchés avec un plan d'opérations conjointes de maintien de la paix. La proposition serait effectivement une fondation de coopération militaire entre nous, spécifiquement antiterroriste. La proposition inclut aussi des plans futurs de partage du renseignement. Nous pourrions accepter l'offre maintenant et traiter tout changement qu'ils suggèrent plus tard, ou la refuser purement et simplement."
 ast_our_capacity_for_peace.1.a: "La paix est le seul chemin."
 ast_our_capacity_for_peace.1.b: "Nous décidons seuls comment le Pacifique est sauvegardé."
 ast_our_capacity_for_peace.2.t: "Accord conclu"
 ast_our_capacity_for_peace.2.d: "Pékin a répondu favorablement à notre proposition. Notre initiative de maintien de la paix est officiellement en cours, et ils se sont engagés à nous rejoindre sous peu pour solidifier le geste."
 ast_our_capacity_for_peace.2.a: "Nous les surveillerons de près."
 ast_our_capacity_for_peace.3.t: "Proposition rejetée"
 ast_our_capacity_for_peace.3.d: "Nos ouvertures pour un pacte mutuel de maintien de la paix ont été accueillies avec une indifférence froide par le gouvernement de Pékin. Leurs diplomates ont répondu avec des préoccupations pour leur propre souveraineté dans le Pacifique."
 ast_our_capacity_for_peace.3.a: "Nous resterons seuls, alors."
 fossil_fuels.1.t: "Des combustibles fossiles contre du yuan"
 fossil_fuels.1.d: "L'Australie a proposé une expansion massive des exportations de charbon pour alimenter nos secteurs industriels en croissance. En échange de taux de change favorables, ils sont prêts à devenir notre principal partenaire énergétique."
 fossil_fuels.1.a: "Les moteurs de l'industrie ont besoin de carburant."
 fossil_fuels.1.b: "Nous sécuriserons le charbon à notre manière."
 fossil_fuels.2.t: "Des combustibles fossiles contre du yuan"
 fossil_fuels.2.d: "S'appuyant sur notre initiative de maintien de la paix existante, l'Australie a suggéré un pacte commercial complet. En sécurisant nos lignes d'approvisionnement énergétique grâce à ce programme « Combustibles fossiles contre yuan », nous consolidons davantage notre sécurité et notre approvisionnement énergétiques."
 fossil_fuels.2.a: "Notre partenariat devient encore plus solide."
 fossil_fuels.2.b: "Leur coopération suffira."
 fossil_fuels.3.t: "Accord sur le charbon signé"
 fossil_fuels.3.d: "The Chinese government has been reluctant to agree to any longterm fossil fuel commitments. For now they have accepted a modest export proposal to supply their reserves. Our mining sector is already making the preparations for the agreement."
 fossil_fuels.3.a: "Excellent."
 fossil_fuels.4.t: "Proposition sur les combustibles fossiles refusée"
 fossil_fuels.4.d: "La Chine a refusé toutes nos offres d'expansion des exportations de charbon, invoquant son désir d'indépendance énergétique."
 fossil_fuels.4.a: "Une occasion manquée."
 fossil_fuels.5.t: "La contre-proposition chinoise"
 fossil_fuels.5.d: "Surprisingly, upon receiving our proposal for expanding coal exports, the Chinese delegates countered with an offer of their own. A priority trade agreement covering a vast range of Chinese electronics and goods in exchange for virtually tariff-free trade on our coal and other mineral exports. The outcome could not have been better for us. Our industry heads are scrambling to secure the exports while the deal stands."
 fossil_fuels.5.a: "Notre séquence de chance continue."
 ast_jap_trade.1.t: "Négociations commerciales avec l'Australie"
 ast_jap_trade.1.d: "Des semaines de négociations avec les Australiens ont produit la première version d'un accord commercial complet. Les détails incluent l'exportation de grandes quantités de produits agricoles vers nos côtes en échange d'une réduction de leurs droits de douane sur nos produits électroniques et automobiles. Cela pourrait fournir un approvisionnement alimentaire stable, mais nous pourrions saisir l'occasion pour pousser à plus."
 ast_jap_trade.1.a: "Acceptez les termes proposés"
 ast_jap_trade.1.b: "Exigez des droits prioritaires sur leurs minéraux précieux"
 ast_jap_trade.1.c: "Les termes sont défavorables"
 ast_jap_trade.2.t: "Accord commercial avec le Japon signé"
 ast_jap_trade.2.d: "La délégation à Tokyo a annoncé que les négociations avaient été un succès. C'est la première fois que le Japon négocie un accord de partenariat économique complet ou un accord de libre-échange avec une grande économie, et encore moins avec nous. Cela marque un tournant sérieux pour nos relations, et pourrait sous-tendre une relation plus solide pour de nombreuses années à venir."
 ast_jap_trade.2.a: "Santé à cela !"
 ast_jap_trade.3.t: "Le Japon exige des droits miniers"
 ast_jap_trade.3.d: "Les négociations ont pris un tournant. Ils exigent désormais un accès prioritaire à nos gisements de minéraux précieux pour soutenir leur industrie technologique en croissance et compenser le coût de la baisse des droits de douane. Cela mettrait à rude épreuve notre propre disponibilité en ressources domestiques et rendrait l'accord globalement moins favorable. Nous pourrions les pousser à revenir à l'accord initial, mais cela pourrait mettre en péril l'ensemble des négociations."
 ast_jap_trade.3.a: "Acceptez leurs nouvelles conditions et concluez l'accord"
 ast_jap_trade.3.b: "Restez fermes. Exigez l'accord initial"
 ast_jap_trade.4.t: "Proposition commerciale refusée"
 ast_jap_trade.4.d: "La délégation à Tokyo a annoncé que les négociations avaient échoué. Il semble qu'ils aient quitté la salle de réunion sans grande indication de discussions ultérieures. Nos plans pour un accord sont essentiellement morts dans l'œuf. Bien que cela freine sérieusement nos plans commerciaux, il existe peut-être d'autres voies à explorer."
 ast_jap_trade.4.a: "A setback for now"
 ast_jap_trade.5.t: "L'Australie reste ferme"
 ast_jap_trade.5.d: "Les délégués de Canberra restent fermes sur l'offre initiale, refusant toute négociation sur les droits miniers. Ils ont clairement indiqué que l'offre d'accord sur les importations agricoles en échange d'une baisse des droits de douane est définitive."
 ast_jap_trade.5.a: "Nous avons peut-être été trop hâtifs."
 ast_jap_trade.5.b: "Alors il n'y a pas d'accord à conclure."
 base_state_visit.1.t: "Visite aux États-Unis"
 base_state_visit.1.d: "Howard had previously visited the White House in 1999 during some discussions on tariffs. It was raining then and, as if symbolically, it was raining again. He made his way through the front doors, after meeting the president, to a troupe of reporters with umbrellas. Everything was large in the US. Their shops were large, their churches were large. The residence for the president was especially large. Australia didn't have anything to that equivalent in size, and definitely not as grand. One could say they were compensating for something, but they really had it all, and eventually we would have to come to the table to get our share of that. Whether it was guarantees for pacific defense or trade procurement, Australia would have to prove itself as a valuable partner. As we had with Vietnam and Korea, we would be there for the next one."
 base_state_visit.1.a: "Pour notre tranquillité d'esprit."
 base_state_visit.2.t: "Visite en Chine"
 base_state_visit.2.d: "When Howard landed in Beijing the first to meet him was the Chinese Premier. Past the Chinese media hovering around them, the premier led them to a restaurant cordoned off nearby to discuss their options for trade. China was a very eager partner to negotiate with, but there were always caveats to working with them. The reality of their authoritarianism was not forgotten by Howard, and it was apparent in every discussion the Chinese had to feel like they were getting the upper hand. Negotiations with them became a fine dance of outlining the future Australia wanted and somehow aligning it with theirs. Every card needed to be played before their next trade talks to keep us on a fair footing. When they both got up to leave Howard felt confident he'd played just well enough."
 base_state_visit.2.a: "Et la scène était plantée."
 base_state_visit.3.t: "Normaliser les Nord-Coréens"
 base_state_visit.3.d: "Les discussions avec les Nord-Coréens étaient uniques dans le sens où le terrain n'avait pas été établi avec la nation depuis quelques décennies, et Howard était plus ou moins en train d'entrer en territoire inconnu. Pire était le fossé entre eux. Chaque engagement serait indirectement géré par nos relations avec la Chine, qui les transmettrait ensuite aux Coréens. Il n'y avait jamais d'attente d'une conversation en face à face, mais le fait que Howard lui-même ne parlait jamais à un véritable représentant donnait à l'ensemble une tonalité étrange. Finalement, ils acceptèrent une ambassade à Canberra, ce qui dès le départ mit Howard mal à l'aise, mais si les pourparlers devaient continuer, cela devait être fait."
 base_state_visit.3.a: "Mieux que rien."
 base_state_visit.4.t: "Une visite de la Corée du Sud"
 base_state_visit.4.d: "Le président sud-coréen arriva tôt ce matin-là à Canberra avec un objectif très singulier. L'Australie arriva main dans la main avec les Américains lorsque la guerre de Corée éclata. Depuis lors, nous avons été un choix facile pour la certitude de défense dans le Pacifique, et tant que leur voisin du nord aurait des armes nucléaires, nous resterions ainsi. Maintenant, cette question même fut soulevée. Le président était courtois à ce sujet, mais éventuellement nous devrions solidifier quelque chose. En se promenant dans les jardins botaniques, [KOR.GetLeader] parla des difficultés économiques actuelles et de la manière dont les pourparlers avec la Corée du Nord avaient stagné. En attendant, un pacte commercial serait convenu, mais rien d'autre ne fut promis."
 base_state_visit.4.a: "Cela devra suffire pour l'instant."
 base_state_visit.5.t: "La cérémonie de Gallipoli"
 base_state_visit.5.d: "Le peuple turc a toujours été attentionné envers la tradition de l'Anzac. Je suppose que c'est facile quand on était le camp gagnant ce jour-là, mais ils ont été assez compréhensifs pour désigner un site que nous pouvons visiter chaque année et honorer les morts. La plupart voient la cérémonie comme un moment de deuil, ou en tirent le sens que la guerre est inutile et ainsi de suite. Peu considèrent ce jour comme une erreur des alliances internationales, et que sans que les Britanniques nous aient débarqués sur la péninsule, quelques centaines de milliers ne seraient peut-être pas morts ce jour-là. Nos dirigeants précédents l'ont fait, alors que nous passions de l'Angleterre à l'Amérique, et depuis lors, l'accent sur les alliances a été ancré dans la politique de chaque parti. Heureusement, la Turquie est restée un ami fidèle."
 base_state_visit.5.a: "N'oublions jamais."
 base_state_visit.6.t: "La visite de la monarchie"
 base_state_visit.6.d: "Sa Majesté la reine Élisabeth II, accompagnée de Son Altesse Royale le duc d'Édimbourg, est arrivée en Australie dans le cadre des célébrations de son jubilé d'or. \n\nLe couple royal a atterri à Adélaïde le 27 février 2002 et visitera plusieurs villes, dont Cairns et Canberra, coïncidant avec la réunion des chefs de gouvernement du Commonwealth. \n\nDes foules agitant le drapeau britannique de l'Union Jack ont acclamé depuis la tribune publique installée pour la 13e visite de la reine, et se sont alignées le long du parcours de 5 miles de l'aéroport à l'Amirauté. Le [GetASTLeaderTitle] devrait l'accueillir sous peu, et il est possible que le référendum républicain raté soit sur la liste des sujets."
 base_state_visit.6.a: "Restons courtois."
 rudd_state_visit.1.t: "Visite en Russie"
 rudd_state_visit.1.d: "There were few countries on earth bigger than Australia geographically. None would argue the Russian Federation was one of them. Howard wasn't ready for the cold when he stepped off the plane. After two days in the country it still hollowed him out when he stepped outside and the icy wind blew through him. A number of people had gathered outside the hotel with Australian and Russian flags, which was reassuring. Kevin Rudd had organized this meeting, and Howard felt like he was thrown in the deep end. Was wrestling with the bear really the right way? They were still reeling from the economic shock of the 90s. Theoretically the Russian president would be looking for any trade assistance to keep them afloat, but Howard hardly felt welcome since his arrival. He'd have to work to convince them that Australian uranium was worth the negotiations."
 rudd_state_visit.1.a: "Le début de quelque chose..."
 leaked_memo.1.t: "La note divulguée"
 leaked_memo.1.d: "Somehow one of those journos got their hands on a letter by one of our party men, Shane Stone, which happened to include a number of harsh criticisms of our government. The Guardian is already painting the phrase \"Mean and Tricky Howard\" as their headline. I don't know how it got out but the media is running a circus out of it, and now we're having to play catch up to cover our ends. Some of the party, including Peter, is demanding we string up Stone politically like some kind of desperate mob hunt. Until the news of it dies down we can't do a thing, and this sorely slows down our momentum for change. If anything I can't imagine it could get worse."
 leaked_memo.1.a: "Vraiment ?"
 reconciliation_journey.1.t: "Le voyage vers la réconciliation"
 reconciliation_journey.1.d: "Howard et l'équipe des médias se sont engouffrés dans la petite pièce où l'un des conseillers aborigènes attendait. D'autres papiers furent signés, puis ils posèrent pour les caméras. Alors que le conseiller se tournait et serrait la main d'Howard, le [GetASTLeaderTitle] remarqua à quel point ses mains étaient dures. Couvertes de callosités et osseuses. Son visage semblait aussi dur, mais ses yeux étaient larmoyants. Howard pouvait voir les années de difficultés sur le visage de cet homme, et l'espoir qu'il chérissait maintenant. Prenant soin de ne pas le perdre. « Merci, Monsieur le Premier ministre », dit-il avant de partir avec les journalistes. \n \nIl était seul maintenant, et il resta un moment perdu dans ses pensées. Il avait changé d'avis sur les politiques de réconciliation plus de fois qu'il ne le souhaitait, et pourtant le pays semblait s'en mieux porter. Après tout ce qu'il avait fait, petit à petit, l'Australie avançait enfin. Un sentiment de satisfaction l'envahit alors qu'il restait là en silence. Finalement, d'autres gens des médias entrèrent et la journée continua normalement."
 reconciliation_journey.1.a: "Il y a encore à faire."
 ast_the_coalition_convention.1.t: "La convention de la Coalition"
 ast_the_coalition_convention.1.d: "« Nous avons accompli beaucoup, nous avons vaincu l'opposition. L'Australie se tient fière et droite dans le monde. On nous respecte pour ce que nous avons accompli avec notre économie, et on nous voit comme une nation prête à prendre position sur les questions internationales. Un fil d'or traverse tant de politiques de la Coalition, et c'est ce grand principe du choix. Plus de choix pour tous les Australiens de choisir leur avenir. Notre nation est plus libre qu'elle ne l'a jamais été. Son peuple gagne plus, achète plus, et vit plus fièrement. » \n\n« Le défi devant nous est tout aussi grand qu'il l'était lorsque nous avons cherché à revenir au pouvoir en 1996 et que nous le cherchons de nouveau à la prochaine élection. En attendant, beaucoup peut être fait pour continuer à améliorer l'état de nos dépenses et l'économie en croissance. Beaucoup de partisans attendent davantage de politiques pour améliorer leur vie et celle de bien d'autres, en Australie et ailleurs. Notre fardeau est inhérent à notre noyau moral. Nous sommes une nation qui donne à chacun une « chance équitable ». Chacun de nous connaît sa responsabilité de diriger. Cette responsabilité n'a pas cessé. »\n« Le défi devant nous est tout aussi grand que lorsqu'nous avons cherché à revenir au pouvoir en 1996 et que nous cherchons à nouveau à la prochaine élection. En attendant, beaucoup peut être fait pour continuer d'améliorer l'état de nos dépenses et l'économie croissante. Beaucoup de partisans attendent plus de politiques pour améliorer leur vie et celle de bien d'autres, en Australie et au-delà. Notre fardeau est inhérent à notre noyau moral. Nous sommes une nation qui donne à chacun une « fair go ». Chacun de nous connaît notre responsabilité de diriger. Cette responsabilité n'a pas cessé. »"
 ast_the_coalition_convention.1.a: "Le défi n'est pas fini."
 the_white_paper.1.t: "Mise en œuvre du livre blanc"
 the_white_paper.1.d: "The Defense 2000 paper was made as a comprehensive review of our current military capabilities, and those that the current administration demands. With more weight on the defensive capabilities of Australia as a major supplier of security and peacekeeping in the Pacific, the demands have predominantly been to expand. Not just personnel. Command, technologically, our weapon manufacturing, all need to be improved or expanded. Thankfully, we have a number of programs in development that could help us achieve this."
 the_white_paper.1.a: "Notre production est ce qui compte le plus."
 the_white_paper.1.b: "Nous ne pouvons pas combattre sans nos forces."
 the_white_paper.1.c: "Ils peuvent gérer la demande."
 the_white_paper.2.t: "Mise en œuvre du deuxième livre blanc"
 the_white_paper.2.d: "Whether we are suffering from success or not, we are once again tasked with beginning the restructuring with an initial target. The first suggestion has been an overhaul of the movement methods field units incorporate to make them more efficient. Changes to our reinforcement policy were also suggested. Otherwise we could fall back on high command to speed up their current research on our doctrines."
 the_white_paper.2.a: "Le mouvement sera notre clé."
 the_white_paper.2.b: "Les renforts sont toujours nécessaires."
 the_white_paper.2.c: "Retour à la planche à dessin."
 lithgow_arms.1.t: "La vente d'armes légères de Lithgow"
 lithgow_arms.1.d: "Thales a offert une somme pour acheter et rénover la vieille usine pour qu'elle soit utilisée pour nos moyens de production. Ils ont été fiables dans nos efforts de production d'armes auparavant, et l'usine est dans un certain état. Lui donner une nouvelle vie avec eux pourrait être la meilleure chose. Nous pourrions cependant rénover le bâtiment nous-mêmes."
 lithgow_arms.1.a: "Vendez-la."
 lithgow_arms.1.b: "Nous pouvons la réparer."
 governor_general_sacked.1.t: "Gouverneur général limogé"
 governor_general_sacked.1.d: "For perhaps the first time in Australian history the Governor General has been removed from their position by Queen Elizabeth herself. The surprising news has come after a series of talks between the UK correspondence and the Prime Minister, and whether intended or not, has seemingly resulted in the removal. How this will affect the ongoing policy-making of the current government isn't clear, but it has come as a shock to many royal family supporters in the country. Spokesmen from the Liberal government have yet to comment on the sacking."
 governor_general_sacked.1.a: "Bon débarras."
 solomon_islands_intervention.1.t: "L'effondrement des îles Salomon"
 solomon_islands_intervention.1.d: "Suite à une série de soulèvements militants et de désarmements ratés, le gouvernement des îles Salomon s'est effectivement effondré, laissant un état d'anarchie à sa place. Des combats généralisés ont lieu maintenant entre les groupes militants belligérants pour des tensions ethniques, et les services publics se sont complètement effondrés, laissant beaucoup vulnérables à la violence et entraînant une crise humanitaire croissante. Le premier ministre Allan Kemakeza a officiellement lancé un appel désespéré à l'aide des pays voisins pour assister l'État défaillant, ce à quoi le gouvernement Howard n'a pas encore commenté une éventuelle intervention. Sans aucun changement, la situation dans les îles devrait s'aggraver."
 solomon_islands_intervention.1.a: "Un développement inquiétant."
 solomon_islands_intervention.2.t: "Intervention aux îles Salomon"
 solomon_islands_intervention.2.d: "Depuis les attentats de Bali, tout le monde au sénat est sensible au sujet du terrorisme. En ce moment, la situation aux îles Salomon n'a fait qu'inquiéter. Il est très probable que plus les choses empirent, plus cela pourrait déborder sur nos eaux et créer un nouveau terreau pour les fabricants de bombes. Le premier ministre sur place nous a déjà demandé une intervention ; si nous soumettons l'idée à un vote, le résultat serait presque unanime. Nous avons l'impératif moral, mais y aller pourrait nous enfermer dans un bourbier pire que tout ce que nous avons connu, et cela pourrait n'empirer les choses. Quelle que soit la manière dont nous nous y prenons, cela ne sera pas facile."
 solomon_islands_intervention.2.a: "Nous devons intervenir."
 solomon_islands_intervention.2.b: "Ce n'est pas notre conflit."
 sol_intervention_tt: "§2Des décisions pour intervenir dans les îles Salomon seront débloquées.§!"
 sol_intervention_failure_tt: "§RLa situation ne fera qu'empirer...§!"
 solomon_islands_intervention.3.t: "L'intervention est un succès"
 solomon_islands_intervention.3.d: "So far the situation on the ground has improved to the point where shops are beginning to reopen, the roads are clear of militants, and reconstruction efforts have begun. Our forces will need to remain in the country for some years, but we can take some relief that the nation is stabilising, and hopefully beginning to heal. The Solomon Islands government is indebted to us and will continue to work closely with organising the provisional state. Meanwhile the international reaction to our efforts has been nothing but positive. We continue to reap in good optics whilst our security in the Pacific gets stronger."
 solomon_islands_intervention.3.a: "Du bon travail."
 solomon_islands_intervention.4.t: "Une nation sans espoir"
 solomon_islands_intervention.4.d: "La situation aux îles Salomon n'a fait qu'empirer pendant nos efforts d'intervention et est devenue si instable que nous avons été forcés de récupérer nos pertes et d'abandonner l'intervention. Les militants continuent de se battre dans les rues et le gouvernement restant s'est dissous, provoquant de grandes masses de demandeurs d'asile tentant de fuir la violence vers les pays voisins. La réaction internationale a été un choc calme, les autres pays participant à l'intervention interrompant également leurs efforts. Il reste peu d'espoir pour ceux qui endurent aux îles Salomon maintenant."
 solomon_islands_intervention.4.a: "Quel désastre..."
 solomon_islands_intervention.6.t: "Un seigneur de guerre s'empare du pouvoir aux îles Salomon"
 solomon_islands_intervention.6.d: "Jimmy Lusibaea, chef du groupe militant notoire « Malaita Eagle Force », a pris d'assaut le bâtiment du parlement hier en fin d'après-midi et s'est installé comme dirigeant par intérim. Après des mois de combats au sol à Guadalcanal entre les derniers restes de la police d'État et les forces de Lusibaea, un cessez-le-feu a été négocié, permettant au groupe d'entrer dans la capitale, aboutissant au coup. \n\nDepuis l'effondrement effectif du gouvernement des mois plus tôt et l'état de non-droit sur les îles, la paralysie du gouvernement est devenue un terreau de combats militants, et a déclenché une crise migratoire dans la région. Le chef rebelle affirme que le nouveau gouvernement s'efforcera de mettre fin à la crise actuelle, et de ramener sur l'île principale les Malaitans de la diaspora forcés de fuir les années précédentes.\nDepuis l'effondrement effectif du gouvernement des mois plus tôt et l'état de non-droit sur les îles, la paralysie du gouvernement est devenue un terreau pour les combats militants, et a déclenché une crise migratoire dans la région. Le chef rebelle affirme que le nouveau gouvernement travaillera à mettre fin à la crise actuelle, et à ramener les Malaitans diasporiques sur l'île principale, forcés de fuir les années précédentes."
 solomon_islands_intervention.6.a: "L'obscurité tombe sur les îles."
 walk_for_reconciliation.1.t: "La marche pour la réconciliation"
 walk_for_reconciliation.1.d: "Over 250,000 Indigenous and non-indigenous protestors have marched across the Sydney Harbour Bridge today in a public act of support for reconciliation. In a continuous stream lasting nearly six hours the political demonstration has been the largest in Australian history. \n\nOne of the organisers, Evelyn Scott, has admitted that the crowds were far more than they expected, and that they hoped the act was not missed by the administration, who has appeared out of step with public sentiment regarding reconciliation. During the demonstration, marchers cheered as a skywriter wrote the word \"sorry\" in the sky above the harbour. According to the organiser, more marches are being planned to follow up on the walk's success."
 walk_for_reconciliation.1.a: "Ils sont libres de le faire."
 sydney_olympic_games.1.t: "Les Jeux olympiques de Sydney commencent"
 sydney_olympic_games.1.d: "The Summer Olympic Games have officially begun in Sydney, Australia. Broadcasted in 220 countries and territories, giving this Games the highest coverage in Olympic history. \n\nThe opening featured sprinter Cathy Freeman delivering the torch, who also grabbed the country's 100th gold medal in the 400-metre final. 199 countries are taking part in the event, including North Korea, who was seen marching together with South Korea under a single flag, marking their symbolic unity for the first time in half a century. The event is expected to continue for another two weeks during which the participating countries will compete against each other."
 sydney_olympic_games.1.a: "Très bien."
 shell_takeover.1.t: "Le rachat de Woodside Petroleum par Shell"
 shell_takeover.1.d: "News has made it our way that Royal Dutch Shell has been pursuing a takeover of Woodside Petroleum worth $10 billion. Both companies have shared a close relationship over the last few years, and Shell has made it apparent that their technical support for the North-West LNG project would move to a more involved expansion of the facilities. Our deputy leader and treasurer for the party Peter Costello, however, has been vocally against the move and is advising us to block the deal on the grounds that such a large company owning the majority of gas projects opposes our national interests."
 shell_takeover.1.a: "Bloquez l'offre."
 shell_takeover.1.b: "Autorisez le rachat."
 tampa_affair.1.t: "L'affaire Tampa"
 tampa_affair.1.d: "The government's new policy on asylum seekers has become a catalyst for a political storm that erupted after a Norwegian vessel was turned away off the coast of Christmas Island. The commander of the freighter MV Tampa, Captain Arne Rinnan, had rescued hundreds of stranded asylum seekers from an Indonesian fishing boat and was attempting to bring them to safety in Australia. \n\nDespite the poor health of the 433 asylum seekers on the Tampa, the ship was boarded by SAS troops and ordered to turn around. A mostly negative response has come from the Norwegian embassy regarding the shift to target illegals by the Howard government. How far the policy may go is anyone's guess."
 tampa_affair.1.a: "Une circonstance malheureuse."
 bali_bombings.1.t: "Les attentats de Bali"
 bali_bombings.1.d: "Terror has spread across the Indonesian island of Bali as three bombs were detonated killing an estimated 202 people, including 88 Australians. The sense of peace and distance the nation has had during the growth of terrorist activity overseas has been suddenly shattered last night. Two of the bombs were reportedly located in busy nightspots, where Australian tourism is commonplace, whilst the third exploded in front of the American consulate in Denpasar. While the connection to al-Qaida is unclear, the attack was certainly perpetrated in an act of terrorism. \n\nOver 50 bodies lay covered in white sheets on the footpath of the once busy street the following morning. A harsh message that Australia is no longer a bystander in the ongoing fight against terror."
 bali_bombings.1.a: "Mon Dieu..."
 embassy_attacked.1.t: "Attentat contre l'ambassade d'Australie"
 embassy_attacked.1.d: "Reports are coming in that an explosion occurred outside one of our embassies in Indonesia this morning at about 10am. Thankfully none of our staff were killed, but so far 9 people have been killed and around 150 are wounded from what was likely a car bomb. It seems evident that this was aimed at us, and we're unsure right now if this is connected to the previous bombings in Bali, although it is a similar attack. The Indonesian government has personally been in touch with us to organise an investigation. This might only be the beginning of more targeted attacks."
 embassy_attacked.1.a: "C'est en train de devenir un cauchemar."
 asian_earthquakes.1.t: "Aide à l'Inde"
 asian_earthquakes.1.d: "Plus de 11 000 personnes ont été tuées par les tremblements de terre en Asie en ce moment. Des milliers de maisons et de voitures ont été emportées par des tsunamis ravageant les côtes, entraînant des pannes de communication massives dans les régions touchées et une quantité incalculable de dégâts sur les routes et les voies ferrées. En particulier, l'Inde est confrontée à certains des pires, bien que l'ampleur des dégâts soit inconnue pour le moment. La Croix-Rouge mondiale a lancé un appel d'urgence pour une aide immédiate aux pays touchés. Nous pourrions saisir cette occasion pour envoyer un ensemble de soutien à l'Inde et renforcer nos liens existants."
 asian_earthquakes.1.a: "Nous les soutiendrons."
 asian_earthquakes.1.b: "Ils se débrouilleront seuls."
 asian_earthquakes.2.t: "L'Australie offre son aide"
 asian_earthquakes.2.d: "In response to the earthquakes affecting us and the rest of Asia right now, Canberra has offered us an aid package to support the recovery."
 asian_earthquakes.2.a: "Une surprise, certes, mais agréable."
 cronulla_riots.1.t: "Émeutes raciales de Cronulla"
 cronulla_riots.1.d: "Dans la banlieue balnéaire de Cronulla, des gangs locaux de jusqu'à 200 hommes ont affronté la police locale devant une mosquée dans ce qui est décrit comme des émeutes raciales. Cela fait suite à un certain nombre d'affrontements, dont l'un a vu quelque 5 000 membres d'un rassemblement attaquer des individus d'apparence moyen-orientale. Les combats se sont étendus à d'autres zones de Sydney dans une série d'attaques de vengeance par des membres de la communauté musulmane. Les émeutes ont depuis fait plus de 30 blessés, y compris des policiers et du personnel médical, et ont conduit à 16 arrestations. De multiples groupes religieux ont critiqué ouvertement les attaques, et la police locale a fait du retour à l'ordre une priorité, mais les tensions élevées dans les rues de Sydney persistent."
 cronulla_riots.1.a: "Cette situation s'aggrave."
 cronulla_riots.1.b: "Sévir contre eux."
 rip_steve_irwin.1.t: "Mort d'une icône"
 rip_steve_irwin.1.d: "Naturalist Steve Irwin, who gained worldwide fame as TV's Crocodile Hunter, has tragically died during a diving accident in which a stingray pierced his chest. The incident occurred whilst filming an underwater documentary off Port Douglas. The crew attempted to bring him to an emergency rescue helicopter, but he died before paramedics could arrive. The death has been a shock to many Australians, and fans around the world. \n\n\"It's a dreadful loss for the tourism industry and for nature conservation. Everybody who met Steve was impressed with his energy and his enthusiasm, he was a real Aussie larrikin.\" The Queensland tourism minister, Margaret Keech explained. The death of the national icon has prompted deeply affected reactions from even those in parliament, who addressed the death with condolence speeches by both [AST.GetLeader] and members of the opposition."
 rip_steve_irwin.1.a: "L'Australie a perdu un fils merveilleux et coloré."
 a_global_financial_crisis.1.t: "Une crise financière mondiale"
 a_global_financial_crisis.1.d: "L'effondrement du marché immobilier américain et la fermeture bancaire qui a suivi ont traversé les eaux jusqu'à nous. Déjà, notre dollar se déprécie rapidement et la confiance des consommateurs s'effondre. La banque de réserve a déjà réagi et réduit le taux d'escompte, des dizaines d'entreprises ferment face à la récession. Si nous ne maîtrisons pas cela et ne ralentissons pas la chute, le chômage pourrait exploser et nous pourrions faire face à une dépression comme nous n'en avons pas vue depuis des décennies."
 a_global_financial_crisis.1.a: "Ça s'est aggravé."
 rus_deal_ast.1.t: "Un accord des Australiens"
 rus_deal_ast.1.d: "Canberra has offered us a trade deal for favorable export rights to their uranium deposits. The Australians have been insistent that minerals be used for energy projects, and not for weapons enrichment. Indeed the deal would go well in fueling our reactors, and we can always change our minds later. On the other hand do we trust them to supply us?"
 rus_deal_ast.1.a: "Très bien."
 rus_deal_ast.1.b: "Non merci."
 rus_deal_ast.2.t: "L'accord commercial russe"
 rus_deal_ast.2.d: "Moscou a accepté notre accord commercial. Nous leur enverrons notre uranium à un prix équitable, et les roubles afflueront dans le trésor australien. Ils ont déjà commencé à organiser les expéditions avec leur bureau commercial."
 rus_deal_ast.2.a: "Excellent."
 rus_deal_ast.3.t: "L'accord commercial russe"
 rus_deal_ast.3.d: "Moscow has declined our trade deal and have argued that their uranium source will remain more localised."
 rus_deal_ast.3.a: "Eh bien, nous avons essayé."
 isr_ast_visit.1.t: "Une visite en Terre Sainte"
 isr_ast_visit.1.d: "Howard was fond of the Israelis. Their resilience wasn't unlike that found in Australians, and their diplomats were some of the best around. Though they never wasted the opportunity to tell you of their plight in the middle east. A constantly suffering nation, yet their dedication to the values of democracy was admirable. \n\nHe stood in front of the wall now, and a great sadness flowed through Howard. This must've been the third time he'd visited the country, but this was his first time seeing the Wailing Wall. The emotion in seeing it was almost overwhelming, and it welled within him. Perhaps this was how the Israelis felt all the time. Such loss. One of the aides asked Howard if he wished to touch the wall, as was tradition. Without a word he nodded and they approached it. A thin, circular hat was placed on his head, and as he touched the wall he felt the spirit of it blow into him."
 isr_ast_visit.1.a: "Une expérience biblique."
 adf_acq_astuirement.1.t: "Candidats à l’acquisition de l’ADF"
 adf_acq_astuirement.1.d: "Nos choix pour principal fournisseur d'acquisition ont été réduits à trois options. Le premier, et le plus facile à justifier, ce sont les États-Unis. Ils ont fait de bons progrès avec leurs fusils de combat principaux, et leur expérience outre-mer, ainsi que nos engagements de défense partagés, en font un choix facile sur le plan stratégique. La deuxième option est l'Allemagne. Si nous ne prenons pas l'Autriche, autant prendre leur voisin. Heckler und Koch est devenu l'un des meilleurs fabricants de fusils au monde. Nous ne ferions pas fausse route. Enfin, la vieille fiable Belgique. Personne ne rejettera la série FN comme un bel équipement, et nos amis du Commonwealth au Royaume-Uni ont développé leur propre ligne selon leurs besoins. Nous pouvons facilement faire de même."
 adf_acq_astuirement.1.a: "Rester avec les Américains."
 adf_acq_astuirement.1.b: "Miser sur la qualité."
 adf_acq_astuirement.1.c: "Ancien et éprouvé"
 ast_high_speed_rail.1.t: "Le projet à grande vitesse fait face à des retards"
 ast_high_speed_rail.1.d: "Comme on pouvait s'y attendre, le projet a rencontré une complication. L'itinéraire au sud de Brisbane traverse une longue chaîne de montagnes. Les estimations de la densité des montagnes étaient erronées et l'excavation actuelle va coûter considérablement plus cher."
 ast_high_speed_rail.1.a: "C'était prévu."
 ast_high_speed_rail.1.b: "Abandonnez le projet."
 ast_high_speed_rail.2.t: "Les problèmes d'acquisition de terrains entravent le train à grande vitesse"
 ast_high_speed_rail.2.d: "D'autres problèmes sont survenus dans les zones suburbaines nécessaires au passage du rail. Un certain nombre de groupes NIMBY (Pas dans mon arrière-cour) s'opposent à la proposition de développement et les batailles juridiques pourraient arrêter le projet indéfiniment. Contourner la zone signifiera abandonner l'itinéraire actuel et en rédiger un autre."
 ast_high_speed_rail.2.a: "Qu'est-ce que les NIMBY ont jamais fait pour nous ?"
 ast_high_speed_rail.2.b: "Absolument pas."
 ast_high_speed_rail.3.t: "Les coûts des ressources ralentissent le rail"
 ast_high_speed_rail.3.d: "Another setback for the High Speed Rail Project. The orders for iron previously established have suddenly fallen through after steel costs have skyrocketed. Now the distributors are asking for three times the previous rate, which considering how much the original cost was, is a sizeable chunk of the whole budget."
 ast_high_speed_rail.3.a: "C'était combien déjà ?"
 ast_high_speed_rail.3.b: "Dites-lui qu'il rêve."
 ast_high_speed_rail.4.t: "Les coûts du train à grande vitesse sont révisés"
 ast_high_speed_rail.4.d: "After almost five years of construction for the project the original, and additional funding, has almost been used up. With the costs for labour, permits and materials at an all time high the investment into the project is being redrafted to include another 80 billion dollars. Some of the planners are convinced the light is at the end of the tunnel, but after so many setbacks nothing about the project is assured."
 ast_high_speed_rail.4.a: "S'il vous plaît, que ce soit fini."
 ast_high_speed_rail.4.b: "Je ne vais pas tomber dans le panneau une autre fois."
 ast_high_speed_rail.5.t: "Le train à grande vitesse dévoilé"
 ast_high_speed_rail.5.d: "Après un certain nombre de revers et de dépassements de budget, le réseau de train à grande vitesse a été dévoilé, le premier train quittant la gare de Brisbane. La ligne ferroviaire, présentée comme étant à la pointe de la technologie, relie actuellement Brisbane à Melbourne et devrait effectuer le trajet en un peu moins de 6 heures. De nombreuses personnes se sont rassemblées autour de la gare, qui a été remodelée pour accueillir la ligne transformée, pour assister à l'arrivée du train. \n \nLe projet représente sans aucun doute une modernisation de la nation ces dernières années et devrait transporter plus de 200 000 voyageurs chaque jour. Transformant la façon dont beaucoup d'Australiens vont voyager."
 ast_high_speed_rail.5.a: "Une merveille d'ingénierie !"
 base_state_visit.7.t: "Un voyage en Indonésie"
 base_state_visit.7.d: "Things were pretty tense after the bombings, such to the point where Howard couldn't take a step in either direction without a cordon of troops following once he hopped off the plane. The Indonesians were careful to keep appearances, but the ongoing insurgency in Aceh was a sore look. The President of Indonesia seemed more than happy to discuss the ongoing security commitments, despite negotiations of that very topic falling through again and again. Things between our nations had grown tenuous now, far from the 'kumbaya' of post-colonialism years, and the cracks were very much showing."
 base_state_visit.7.a: "À la prochaine fois."
 generic_bushfires_ast.1.t: "Widespread Bushfires in [ast_bushfire_state.GetName]"
 generic_bushfires_ast.1.d: "An unusually hot and dry summer has sparked rampant bushfires across [ast_bushfire_state.GetName]. Over 1 million hectares of land has burnt so far as many of the smaller fires across the state have merged into a front. The fires have been limited to mostly uninhabited forests and national parks, although, evacuation efforts in the surrounding regions are still underway, with likely hundreds of rural homes and livestock having been lost. Firefighters have so far been successful in limiting the burning from reaching towns. Despite this smoke is currently causing disruptions to flights in the state."
 generic_bushfires_ast.1.a: "Inquiétant."
 papua_affair.1.t: "Les pourparlers diplomatiques s'enflamment"
 papua_affair.1.d: "Il semble qu'une complication soit survenue à l'aéroport de Brisbane lorsque le premier ministre de Papouasie-Nouvelle-Guinée, [PAP.GetLeader], est arrivé pour des pourparlers. Un membre du personnel de l'aéroport a demandé au dirigeant de retirer ses chaussures lors des contrôles de sécurité typiques, ce qui a apparemment été considéré comme humiliant par la PNG. Le premier ministre a fait demi-tour et est reparti, et il semble que la réunion officielle avec Howard ait été annulée. De petites manifestations à Port Moresby demandent déjà des excuses de notre part. Le programme d'aide et toute future discussion sur la défense pourraient être complètement compromis maintenant."
 papua_affair.1.a: "Essayez de récupérer quelque chose."
 papua_affair.1.b: "C'est une cause perdue."
 ast_howard_of_arabia.1.t: "Howard d'Arabie"
 ast_howard_of_arabia.1.d: "The car bounced over another deep pothole and Howard almost hit his head on the top of the jeep. The diplomat in the front seat spun around and began to quickly explain how the road here was damaged by debris from falling missiles, as a result of the Iron Dome. While Howard nodded and agreed that it was better than the alternative, he couldn't help but think the image of the country he'd developed in the city was not the same as the reality out here. The IDF seemed to be around every corner as the car was turning into the consulate, where Howard was to deliver his speech on regional security. \n\nAustralia had already sunk its boots into the middle east, and now it was going to be stationing a permanent base to assist the Israelis keep a lid on things. In many ways it seemed despite the very western outlook they were holding, Israel was still a developing nation without the groundwork for any peaceful future. Even their fears of an Iranian invasion paled to the disunity they had with their immediate neighbour, the Palestinians, and suddenly Howard was rethinking the whole agreement."
 ast_howard_of_arabia.1.a: "Notre avenir est avec Israël."
 ast_howard_of_arabia.1.b: "Nous ne pouvons rien promettre pour l'instant..."
 indonesian_ultimatum.1.t: "L'ultimatum australien"
 indonesian_ultimatum.1.d: "Australia has outright demanded that we hand over the province of Aceh to their peacekeepers, effectively allowing one of our territories to be occupied by their forces. They have claimed that this would lead to an eventual independence for the region, free from insurgents, but we have no way of guaranteeing that, and it would still be loss of our own soil. If we refuse they have threatened us with sanctions."
 indonesian_ultimatum.1.a: "Nous n'avons pas le choix."
 indonesian_ultimatum.1.b: "C'est scandaleux !"
 indonesian_ultimatum.2.t: "L'Indonésie se conforme"
 indonesian_ultimatum.2.d: "Jakarta a accepté les termes qui lui ont été présentés et a abandonné le territoire d'Aceh. Nos casques bleus partiront bientôt et rétabliront l'ordre dans la province. Le peuple indonésien sera bientôt libéré de l'insurrection."
 indonesian_ultimatum.2.a: "La paix a triomphé !"
 indonesian_ultimatum.3.t: "Indonesia Refuses the Ultimatum"
 indonesian_ultimatum.3.d: "Jakarta a rejeté nos termes et refuse de permettre à nos casques bleus d'entrer à Aceh. Ils ont obstinément juré d'éliminer l'insurrection par eux-mêmes."
 indonesian_ultimatum.3.a: "Ainsi soit-il."
 indonesian_ultimatum.4.t: "L'ultimatum australien"
 indonesian_ultimatum.4.d: "L'Australie a carrément exigé que nous cédions la province d'Aceh à leurs casques bleus, permettant effectivement à l'un de nos territoires d'être occupé par leurs forces. Ils ont affirmé que cela mènerait à une indépendance éventuelle de la région, libérée des insurgés, mais nous n'avons aucun moyen de le garantir, et ce serait toujours une perte de notre propre sol. Si nous refusons, ils nous ont menacés de sanctions."
 indonesian_ultimatum.4.a: "Nous n'avons pas le choix."
 indonesian_ultimatum.4.b: "C'est scandaleux !"
 us_aus_trade_howrd.1.t: "Agricultural Trade Discussions with Australia"
 us_aus_trade_howrd.1.d: "The government in Canberra has reached out to discuss eliminating tariffs on nearly all manufacturing and agricultural trade between us. The proposal is likely a hail mary for the Australians' recent drought problems, and would provide a sizeable boost to our agricultural exports, but so far our sugar and beef lobbies are disputing the deal. \n\nThe lobbyists have remained insistent that we carve out parts of the deal that would put our own farmers at risk. Exempting beef and sugar from the list of reduced tariffs. This would be a fair blow to the Australians, but what choice do we really have?"
 us_aus_trade_howrd.1.a: "Ce sont des conditions favorables."
 us_aus_trade_howrd.1.b: "Exclude sugar and beef."
 us_aus_trade_howrd.2.t: "The United States Agrees to the Agricultural Pact"
 us_aus_trade_howrd.2.d: "Without any disagreement, the Americans have agreed to remove tariffs on farming machinery and produce between us, creating a new and bountiful market for our farmers to dip into. The deal has not only rewritten our trade dynamic, but has set the seeds for closer economic ties."
 us_aus_trade_howrd.2.a: "Santé à l'amitié !"
 us_aus_trade_howrd.3.t: "Les pourparlers commerciaux se refroidissent avec les États-Unis"
 us_aus_trade_howrd.3.d: "Il semble que toute avancée dans les pourparlers commerciaux ait été infructueuse. Les Américains ne cèdent pas sur la modification des droits de douane, et nous nous retrouvons un peu démunis."
 us_aus_trade_howrd.3.a: "Un ralentissement inattendu."
 trip_to_malaysia_ast.1.t: "Une visite de la Malaisie"
 trip_to_malaysia_ast.1.d: "La ministre malaisienne du Commerce et de l'Industrie, Rafidah Aziz, nous a approchés avec un avenant à notre traité actuel sur les exportations de viande. Le nouvel accord propose des contrats sur les exportations en échange de l'assouplissement de quelques taxes et réglementations à leur encontre. C'est une offre solide, bien que les exigences puissent présenter une faille qu'ils pourraient exploiter plus tard. Cela nous offre toujours un prix favorable pour nos marchandises."
 trip_to_malaysia_ast.1.a: "Pour nos amis, bien sûr !"
 trip_to_malaysia_ast.1.b: "Pas aujourd'hui."
 internal_talk_liberal.1.t: "Une querelle entre collègues"
 internal_talk_liberal.1.d: "Howard avait l'impression que Peter Costello, son fidèle adjoint du parti depuis les premières élections, avait toujours une dent contre lui. Ils semblaient s'affronter à chaque occasion, mais cela ne les avait pas empêchés de travailler ensemble pour le mieux, et Peter était en partie responsable de la positivité économique actuelle. Maintenant, ils se disputaient à propos de l'immigration. Peter était très ferme sur les avantages économiques, mais Howard, inquiet du « flou » du multiculturalisme, restait ferme sur l'intégration. \n \nRenforcer la patrouille frontalière avait également l'avantage de réduire la traite des êtres humains, qui était devenue un sujet d'actualité dans les informations. Peter affirmait plutôt que l'idée était susceptible de se retourner contre nous et finirait par être un gaspillage du budget. Aucun accord n'était en vue entre eux."
 internal_talk_liberal.1.a: "Et pourtant, une décision devait être prise."
 internal_talk_liberal.2.t: "Une visite de Tony"
 internal_talk_liberal.2.d: "Howard était occupé à classer les papiers pour le changement de règle du parti quand on frappa à la porte. Il savait qu'il avait environ 2 heures avant la prochaine réunion, ce fut donc une surprise quand le ministre de la Santé, Tony Abbott, entra. L'homme qui avait fait un excellent travail de gestion du département et de gestion des syndicalistes difficiles, présenta à Howard d'autres modifications à Medicare. Quelques-uns dans le parti étaient enclins à qualifier Abbott de zélote du parti, mais Howard ne voyait pas les choses ainsi. Pour lui, Abbott semblait dévoué au peuple. Un nationaliste par tous les critères. \n \nSans aucun doute, il avait l'ambition de devenir premier ministre, mais cela ne l'avait jamais empêché de montrer sa loyauté envers Howard, et une estime mutuelle s'était développée entre eux. Quand il quitta la pièce, Howard retourna à ses écritures, et une pensée persista. Peut-être, après ces dernières années au pouvoir, pourrait-il considérer Tony comme un bon ami."
 internal_talk_liberal.2.a: "Retour au travail alors."
 internal_talk_liberal.3.t: "Choisir le successeur"
 internal_talk_liberal.3.d: "Il semblait plus souvent qu'autrement que le némésis d'Howard au parlement était son propre adjoint, Peter Costello. Ils s'étaient affrontés plus souvent qu'avec le Parti travailliste, mais encore une fois, cela arrive généralement quand on travaille en étroite collaboration. Peter n'avait pas fait un travail particulièrement mauvais, en fait il avait fait un assez bon travail, mais cela agaçait John quand même. Peter était toujours en lice pour le poste, et en tant qu'adjoint, il avait naturellement la priorité, et cela ne faisait pas de mal qu'il ait une bonne position avec le reste du parti. Avec lui aux commandes, l'économie était également assurée de continuer à tourner en douceur. \n \nIl y avait cependant un autre choix que John Howard envisageait. Tony Abbott avait été à bien des égards un protégé d'Howard depuis un certain temps maintenant, et il était fermement décidé à ce que le premier ministre serve un autre mandat. Bien qu'Abbott soit considéré comme un peu un acolyte dans le parti, et un peu dépassé, John voyait en lui une conviction qui lui rappelait presque lui-même. Aborder les prochaines élections, la décision ferait ou déferait le parti."
 internal_talk_liberal.3.a: "Peter est le successeur naturel."
 internal_talk_liberal.3.b: "Tony a ce qu'il faut."
 internal_talk_liberal.3.c: "Finalement..."
 internal_talk_liberal.4.t: "Howard démissionne de son poste de leader"
 internal_talk_liberal.4.d: "« Ç'a été un privilège immense chaque jour de ma vie d'avoir été [GetASTLeaderTitle] de ce beau pays et je veux remercier le peuple australien pour ce privilège. Je le respecte et je l'honore. Après des années de poursuite, diriger cette nation a été l'expérience la plus incroyable d'une vie. » \n \n« J'accepte l'entière responsabilité du Parti libéral, des succès et des quelques pertes que nous avons eues, et par conséquent je démissionne de mon poste de leader du parti. Je tiens à remercier les habitants de Bennelong et le peuple australien de m'avoir élu pour représenter cette nation. » \n \n« Alors que je passe les rênes à mon propre adjoint et trésorier, Peter Costello, je lui dois une dette de gratitude très spéciale. Il a été un merveilleux intendant de l'économie australienne et l'avenir de notre parti est très lié à Peter. Il est vraiment notre avenir. » \n \n« Je souhaite bonne chance à la nation, je crois très profondément que les meilleures années de l'Australie sont devant elle. »"
 internal_talk_liberal.4.a: "Vers de nouveaux horizons..."
 internal_talk_liberal.5.d: "\"It has been an immense privilege every day of my life over these last years to have been [GetASTLeaderTitle] of this beautiful country and I want to thank the Australian people for the privilege. I respect it and I honour it. After years of pursuit, leading this nation has been the most unbelievable experience of a lifetime.\" \n\n\"I accept full responsibility for the Liberal Party, the successes and the few losses we've had, and therefore I am stepping down as leader of the party. I do want to thank the people of Bennelong, and the people of Australia for electing me to represent this nation.\" \n\n\"As I hand the reins to the next leader, my own Minister for Health and proud colleague Tony Abbott, I owe a very special debt of gratitude. He's been a wonderful representative for many Australians, and the future of our party is very much tied up with Tony. He is very much our future.\" \n\n\"I wish the nation well, I believe very profoundly that Australia's best years lie ahead of her.\""
 solomon_islands_intervention.5.t: "Nettoyer"
 solomon_islands_intervention.5.d: "Les habitants se dirigèrent vers le tas et y déversèrent une autre cargaison d'armes. Principalement des fusils. Une autre milice s'était rendue à la 3e armée australienne ce jour-là et était emmenée par les officiers. Demain, le régiment du génie viendrait les détruire devant une foule. Ils le feraient dans l'un des stades encore fonctionnels comme une démonstration publique que l'ordre était rétabli. Que cet ordre vienne de chez eux ou non, le soldat de l'ADF ne le savait pas, mais il continua à regarder le tas grandir. \n \nPar dizaines à la fois, ils s'entrechoquaient et le tas grossissait. Lui et le reste de la compagnie avaient traqué le groupe dont ceux-ci provenaient pendant environ un mois, et ils avaient été les premiers à se rendre à vue. Il commençait à sembler que les choses touchaient à leur fin, plus tôt qu'il ne l'avait prévu. Les combats se calmaient, mais peu de lumières fonctionnaient même dans la ville voisine, et tous les malades étaient évacués de l'île. Si les habitants devaient rester, il fallait faire plus une fois les tirs arrêtés. \n \nLa radio sur son épaule s'alluma et il partit, se dirigeant vers la ville suivante."
 solomon_islands_intervention.5.a: "Le travail n'est pas fini."
 a_global_financial_crisis.2.t: "Bouleversement financier"
 a_global_financial_crisis.2.d: "A number of middle-sized businesses backed by loans have fallen under in the last recent weeks and declared bankruptcy. The blow to our unemployment figures is one negative aspect, but the quietness of it has been a bit concerning. The air of economic downturn is beginning to upset our fiscal experts, who are requesting we be prepared to take immediate action if anything pops up. Except nothing has for now, which leaves us in the awkward position of waiting."
 a_global_financial_crisis.2.a: "Ne nous inquiétons pas pour rien."
 black_saturday_ast.1.t: "Samedi noir"
 black_saturday_ast.1.d: "Au cours de quelques jours, un certain nombre de feux ont pris de l'ampleur pour atteindre des centaines à Victoria dans ce qui a été appelé le pire jour de feux de brousse jamais enregistré. Des milliers de pompiers de tout le pays se sont rassemblés dans une tentative désespérée de contenir les feux, qui ont déjà coûté la vie à 25 personnes. \n \nDes jours d'air chaud et sec en provenance du centre de l'Australie ont créé les conditions parfaites pour que les feux se propagent incroyablement vite. Des pans entiers de maisons et de terres ont déjà été détruits, déclenchant un état d'urgence alors que les militaires se précipitent pour évacuer les zones à risque. Bien que peu de choses puissent être faites alors qu'ils traversent les forêts domaniales et les parcs nationaux, avec des flammes enregistrées atteignant 30 mètres de hauteur."
 black_saturday_ast.1.a: "Ce n'est vraiment pas notre année."
 black_saturday_ast.2.t: "Les feux de Victoria continuent de brûler"
 black_saturday_ast.2.d: "Skies over Victoria have remained black for weeks now as the fires haven't let up, raising the death toll to 173. Control lines have been successful in slowing the spread, although an estimated 400,000 hectares have been burned, decimating local wildlife. \n\nThe [GetASTLeaderTitle], who has been in and out of the area visiting those affected and appeared visibly upset upon seeing the damage, was present to provide some comfort to those now without homes. A number which is likely now in the thousands. Exhausted firefighters continue their efforts, with favorable weather expected to arrive in the coming week. \n\nThe darkest days for Victoria in decades may slowly be coming to an end, although not without an overwhelming loss for the country."
 black_saturday_ast.2.a: "Une tragédie au-delà des mots."
 ast_elections_howard_placeholders.1.t: "Victoire surprise du gouvernement Howard"
 ast_elections_howard_placeholders.1.d: "La hausse des prix du carburant et les réactions vives à plusieurs politiques de John Howard n'ont pas suffi à empêcher le dirigeant de remporter un troisième mandat. Sortant de la course avec 82 sièges à la Chambre des représentants, le Parti libéral a connu peut-être le retournement de fortune politique le plus rapide de l'histoire du pays. \n\nPendant ce temps, le gouvernement mené par Kim Beazley a subi son plus bas score primaire depuis 1934, et certaines sources au sein du Parti travailliste affirment que le chef de l'opposition devrait se retirer. Howard a remercié ses partisans, en particulier les petites entreprises, pour sa victoire, dans son discours à l'hôtel Wentworth de Sydney, et a exposé ses plans de nouvelles réformes."
 ast_elections_howard_placeholders.1.a: "C'est si facile !"
 ast_elections_howard_placeholders.2.t: "Le gouvernement Howard décroche un autre mandat"
 ast_elections_howard_placeholders.2.d: "While Mark Latham struggled to make ground as the new Labor leader, [AST.GetLeader] has soared, winning another term for the Coalition and securing a majority. The Liberals enjoyed a comfortable increase in polls after the Bali Bombings tragedy, signaling a preference for cautious and steady governance. \n\nThe success of the Nationals rural water management policies, brought in to combat the Millennium Drought, has no doubt also contributed to the Coalition victory. This win marking the second longest serving streak for the party. \n\nThe ALP did make some gains, winning back a seat from the Greens and a few from the Nationals. Although this is likely to result in another shakeup for the party."
 ast_elections_howard_placeholders.2.a: "Encore trois ans !"
 election_outcomes_ast.1.t: "Victoire historique du travailliste Rudd"
 election_outcomes_ast.1.d: "Le chef libéral [AST.GetLeader] a été évincé hier soir tandis que Kevin Rudd menait les travaillistes à une victoire écrasante, obtenant un swing de 5,7 % à l'échelle nationale. Pour la première fois dans l'histoire australienne, le Parti travailliste détient désormais le gouvernement dans chaque État et territoire. L'ascension de la vice-cheffe Julia Gillard marque aussi la première fois qu'une femme occupera la deuxième plus haute charge publique du pays. \n\nLe chef de la coalition a déjà démissionné, appelant Rudd dans la nuit pour le féliciter. Le nouveau [GetASTLeaderTitle] a fait campagne sur l'amélioration des relations industrielles, les droits autochtones et une action rapide sur le climat, visant à emmener le pays dans une nouvelle direction, ce qu'il a souligné dans son discours de victoire : « Aujourd'hui, le choix a été remis au peuple, et l'Australie a tourné les yeux vers l'avenir. »"
 election_outcomes_ast.1.a: "Et l'avenir, c'est maintenant."
 election_outcomes_ast.2.t: "Une victoire surprise pour la Coalition"
 election_outcomes_ast.2.d: "Les prédictions d'une victoire travailliste ont été balayées tandis que la Coalition s'envole pour un nouveau mandat consécutif. [GetASTLeaderTitle] [AST.GetLeader] a commenté les résultats comme une victoire de la majorité silencieuse, et a exposé des plans d'investissements économiques supplémentaires dans son discours. Bien que la coalition reste au gouvernement, l'ALP a fait des gains significatifs dans presque tous les États et territoires, laissant le gouvernement actuel avec une majorité étroite. \n\nKevin Rudd aurait appelé le [GetASTLeaderTitle] pour le féliciter, et devrait s'exprimer sur la défaite plus tard dans la soirée. La Coalition assume désormais la responsabilité de guider le pays, tout en maintenant la foi renouvelée du public dans le parti.\nKevin Rudd aurait appelé le [GetASTLeaderTitle] pour le féliciter de la victoire, et devrait s'adresser à la défaite plus tard dans la nuit. La Coalition mène désormais avec la responsabilité de guider le pays, tout en maintenant la foi renouvelée du public dans le parti."
 election_outcomes_ast.2.a: "Stable, elle s'en va !"
 a_global_financial_crisis.3.t: "Les effets de la crise s'estompent"
 a_global_financial_crisis.3.d: "Les effets persistants de la crise financière se sont presque tous estompés ces dernières semaines. L'économie s'est surtout normalisée aux niveaux précédents, et le sentiment public s'est élevé en soutien de nos efforts. Il semble que notre réponse à la crise a finalement payé, et a même rendu notre économie plus résiliente à de telles averses économiques à l'avenir."
 a_global_financial_crisis.3.a: "Nous sommes de retour aux affaires."
 turnbull_letter_ast.1.t: "La lettre Turnbull"
 turnbull_letter_ast.1.d: "L'actuel chef du Parti libéral, Malcolm Turnbull, s'est élevé contre notre gouvernement en prétendant posséder un e-mail prouvant notre corruption. Ce que contient exactement la lettre, on ne peut que spéculer, mais cela semble assez grave pour convaincre les médias de s'en emparer. Nos propres gens affirment que la source de Turnbull vient de l'intérieur du gouvernement, ce qui signifie que nous pourrions avoir une taupe dans le parti. \n\nMalcolm Turnbull devrait révéler la lettre au parlement dans les semaines à venir. Pour l'instant, on ne peut que croiser les doigts et espérer que les dégâts ne soient pas trop graves."
 turnbull_letter_ast.1.a: "Qu'avons-nous fait ?"
 turnbull_letter_ast.2.t: "Une fausse lettre"
 turnbull_letter_ast.2.d: "Il s'avère que le tristement célèbre e-mail de Malcolm Turnbull n'était qu'un faux. Pendant l'audit national de la revendication, la propre source de Turnbull a admis qu'il avait tout inventé. La taupe du parti, Godwin Grech, nourrissait de fausses informations à Turnbull pour la gloire. Le retour de bâton a pratiquement coulé les cotes d'approbation de Turnbull, et réduit le Parti libéral à un chaos querelleur. Pendant ce temps, nos sondages sont de nouveau en hausse, et Grech a été promptement éjecté du parti."
 turnbull_letter_ast.2.a: "Nous n'y avons jamais cru une seconde !"
 oceanic_viking_ast.1.t: "Dilemme viking océanique"
 oceanic_viking_ast.1.d: "Il semble qu'un de nos navires actuellement utilisé pour la protection des frontières a appréhendé 78 demandeurs d'asile sri-lankais tentant d'entrer en Australie. Une fois à bord, conformément à notre politique actuelle, ils ont été emmenés sur l'île indonésienne de Bintan pour traitement, sauf qu'ils refusent désormais de débarquer, comme une forme de protestation. \n\nC'est la 49e interception de navire rien que cette année, et comme d'habitude les médias s'y précipitent. Jusqu'ici l'équipage de l'Oceanic Viking n'a pas réussi à les faire descendre, et plus le navire reste là, plus cela nous dessert. L'opposition s'en sert déjà pour nous peindre comme faibles face à la migration illégale, et quelques demandeurs d'asile à bord auraient besoin de soins. \n\nNous pouvons négocier, ou les forcer à sortir."
 oceanic_viking_ast.1.a: "Accordons-leur un traitement préférentiel."
 oceanic_viking_ast.1.b: "Envoyer les troupes."
 oceanic_viking_ast.2.t: "Les manifestations anti-immigration se multiplient"
 oceanic_viking_ast.2.d: "Des manifestations ont éclaté dans la plupart de nos grandes villes suite à l'issue de l'affaire Oceanic Viking, surtout encouragées par des élus de droite. Le parti One Nation en particulier a été très vocalement critique, encore plus agressivement que l'opposition, et malgré sa petite taille a attiré une attention notable en ligne. \n\nSon ancienne chef, Pauline Hanson, qui a bâti sa carrière sur une rhétorique controversée, a aussi flambé notre gouvernement lors d'un rassemblement au Queensland, qualifiant notre gouvernement d'« anti-australien ». En réponse, des contre-manifestations se sont aussi allumées, plus petites, aboutissant à plusieurs heurts."
 oceanic_viking_ast.2.a: "Pourquoi tout le monde ne peut-il pas se calmer ?"
 oceanic_viking_ast.3.t: "Accident opérationnel"
 oceanic_viking_ast.3.d: "Conformément à nos directives, le SAS a été rassemblé pour extraire de force les demandeurs d'asile du navire. Il semble que, à l'approche de l'opération, nos connaissances aient été limitées. Quand notre unité a abordé le bateau, elle a découvert qu'un des migrants sri-lankais s'était armé d'un pistolet, et un échange de tirs a éclaté. Heureusement un seul de nos hommes a été blessé, mais quatre migrants à bord ont été tués et deux blessés. Les autres ont été extraits et transférés au centre de rétention de Bintan. \n\nUne session des Nations unies a été convoquée en réaction, et le retour de bâton est, comme prévu, sévère. Des manifestations ont éclaté dans la plupart de nos grandes villes, qui ont aussi suscité leurs contre-manifestations. Si l'on peut y voir un réconfort, l'opposition reste relativement silencieuse."
 oceanic_viking_ast.3.a: "Comment cela a-t-il pu arriver ?"
 great_barrier_reef.1.t: "Marée noire sur la Grande Barrière de corail"
 great_barrier_reef.1.d: "Un vraquier chinois de charbon s'est échoué à l'est de Rockhampton, dans le Queensland central. Le navire se trouvait à plus de 10 km hors du chenal lorsqu'il a heurté le récif, le râclant sur une distance considérable avant de s'arrêter, et a fuité plus de 2 milles nautiques de fioul lourd. \n\nDes remorqueurs ont été envoyés pour extraire le navire, bien que l'on craigne qu'il ne se brise dans la mer agitée. L'UNESCO et nos gestionnaires du récif sont furieux que le navire ait été si loin de sa route, et que la zone autour puisse désormais être contaminée. Nous travaillons avec eux pour minimiser les dégâts, mais c'est un processus lent."
 great_barrier_reef.1.a: "Très malheureux."
 ast_elections.3.t: "Jour d'élection"
 ast_elections.3.d: "Les stands sont démontés, les publicités s'essoufflent, et les sièges de parti sont en alerte maximale. La saison de campagne est terminée et les bureaux de vote ont été installés en prévision du jour du scrutin. Les Australiens de tout le pays se rassembleront bientôt pour voter l'avenir de Parliament House, et la décision pour notre prochain dirigeant est désormais entre leurs mains."
 ast_elections.3.a: "Que le meilleur candidat l'emporte."
 dissolution_election_rudd.3.t: "Rudd gagne gros"
 dissolution_election_rudd.3.d: "Au siège travailliste, on célèbre la victoire de Kevin Rudd : c'est la première victoire consécutive du parti depuis 1993, et elle confirme les espoirs de nombreux partisans du [GetASTLeaderTitle]. Le Labor est DE RETOUR. \n\nAprès des mois de campagne sur la poursuite des réformes, les résultats ont confirmé le mandat de Rudd. Ils donnent au Labor un gouvernement majoritaire, attendu dans les semaines à venir grâce à une ribambelle de nouveaux élus. Presque tout le Queensland a viré au rouge. \n\nLes résultats ont aussi donné aux Verts deux sièges de plus, signe d'un soutien public croissant à l'action climatique."
 dissolution_election_rudd.3.a: "Retour aux affaires."
 dissolution_election_rudd.4.t: "Tony Abbott vogue vers la victoire"
 dissolution_election_rudd.4.d: "The crowd chanted \"Tony, Tony, Tony\" inside the packed hall of the Four Seasons Hotel as the Liberal party clawed victory in one of the tightest elections in the nation's history. The conservative leader, who rode the campaign on a trail of fiery rhetoric amid promises to \"Stop the Boats\", announced he was \"humbled\" to take the wheel of government. \"From today I declare that Australia is under new management and Australia is once more open for business.\" \n\nThe climate-critical Abbott garnered attention during the campaign with a strong opposition to the direction of public opinion, and yet voters have spoken. Strong stances on immigration and fiscal conservatism are expected to follow as Labor packs their bags, and the Liberals set up shop once again."
 dissolution_election_rudd.4.a: "Les Libéraux sont de retour !"
 ast_elections.1.t: "Le blitz électoral"
 ast_elections.1.d: "La saison électorale approche et le temps de la campagne commence. Selon la loi électorale, nous n'avons que 8 semaines pour faire passer notre message. Qu'on sature les médias, qu'on parcoure le pays ou qu'on débatte face à l'opposition, l'horloge tourne. Il faut sortir et s'activer si l'on compte gagner."
 ast_elections.1.a: "Fermes avec les Libéraux !"
 ast_elections.1.b: "Une chance équitable avec le Labor !"
 ast_elections.1.c: "L'Australie d'abord avec One Nation !"
 ast_elections.1.e: "Lutter pour le changement avec les Verts !"
 special_gillard_election.1.t: "Convocation de la nouvelle élection"
 special_gillard_election.1.d: "Le seul moyen de sceller la légitimité de notre nouveau gouvernement est une nouvelle élection générale. Si nous rallions les voix et sécurisons le prochain mandat, cela posera le mandat dont nous avons besoin pour continuer à diriger, et potentiellement atténuer le retour de bâton de l'opposition lors du vote des lois. Toute élection comporte un risque, aussi faudra-t-il s'activer pendant les 60 prochains jours."
 special_gillard_election.1.a: "En avant et vers le haut."
 election_outcomes_ast.5.t: "Voting Results: A Hung Parliament!"
 election_outcomes_ast.5.d: "Dans une surprise électorale inédite depuis 1940, aucun parti n'est sorti vainqueur net. La Coalition et le Labor ont obtenu 72 sièges au dépouillement, soit 4 de moins pour former un gouvernement. Cela a mené à une conclusion gênante dans la nuit, les deux candidats montant sur scène pour déclarer que, malgré le décompte, l'élection n'était pas terminée. \n\nDans les jours suivants, les partis devront s'affronter à la Chambre des représentants et négocier avec les élus restants pour sécuriser un gouvernement."
 election_outcomes_ast.5.a: "Une nation divisée."
 election_outcomes_ast.4.t: "Encore une victoire pour le gouvernement Rudd"
 election_outcomes_ast.4.d: "Crowds wandered the Sydney streets last night as the results for a Labor election win came in. After another term of strong policy, Kevin Rudd has once again won the goodwill of the public, gaining 48% of the vote and securing a number of Coalition held seats in Queensland, piercing the previous pro-mining strongholds around the Bowen Basin. \n\nRudd addressed the win at the Gabba cricket ground, along with his family, to celebrate the third win. \n\n\"My family have given their all in public life, and their all for my campaign. In the days ahead, Thérèse and I will be spending the next few days together, with the kids as well, and then it's back to it. The show isn't over yet.\""
 election_outcomes_ast.4.a: "Et les beaux jours continuent."
 election_outcomes_ast.6.t: "Gillard obtient un autre mandat"
 election_outcomes_ast.6.d: "Australia's first female [GetASTLeaderTitle] has defied early polling, winning the support of the public once again, and garnering a minority government. Gillard thanked her supporters at the Melbourne Convention and Exhibition Centre, outlining her plans for fiscally responsible leadership and further reforms to healthcare. \n\nOpposition leader, Tony Abbott, called Gillard shortly after the results to congratulate her on the win. After another loss, Abbott is expected to step down from party leadership, indicating a change in party policy in light of the failure to shift the party to the right."
 election_outcomes_ast.6.a: "Une victoire pour une politique raisonnable."
 new_governor_general_ast.1.t: "La nouvelle gouverneure générale"
 new_governor_general_ast.1.d: "Pour la première fois dans l'histoire de notre nation, une femme a prêté serment comme gouverneure générale. Quentin Bryce, 65 ans, ancienne avocate et gouverneure du Queensland, est la 25e gouverneure générale d'Australie, première femme dans ce rôle en 107 ans. \n\nLors d'une cérémonie à Parliament House à Canberra, Bryce a prêté serment d'allégeance à la Reine tandis qu'une salve de 21 coups de canon retentissait dehors. \n\n« Je veux que vous sachiez que j'assume ce rôle avec solennité, impartialité, énergie et un amour profond pour le pays que nous partageons », a-t-elle dit. « Je promets d'être ouverte, réactive et fidèle à la pensée et au fonctionnement contemporains de la société australienne. »"
 new_governor_general_ast.1.a: "Les temps changent vraiment."
 indo_cattle_drama.1.t: "Dilemme des exportations de bétail indonésien"
 indo_cattle_drama.1.d: "ABC a récemment diffusé son émission Four Corners exposant la cruauté systémique de l'industrie bovine indonésienne. Les images sont très graphiques, et un vaste cri public exige que nous cessions immédiatement nos exportations de bétail vers l'Indonésie. Nous pouvons suspendre les exportations de bétail vivant jusqu'à ce qu'ils acceptent de nouveaux cadres réglementaires, mais l'interdiction ruinera financièrement nos fermes du nord."
 indo_cattle_drama.1.a: "Suspendre les exportations."
 indo_cattle_drama.1.b: "Cela n'en vaut pas la peine."
 malaysia_solution_ast.1.t: "La solution malaisienne"
 malaysia_solution_ast.1.d: "Compte tenu de l'état délabré de nos centres de rétention, la Malaisie nous a proposé de lui transférer 800 demandeurs d'asile que nous détenons, en échange de l'accueil de 4 000 réfugiés déjà traités. Cela réglerait nos problèmes de rétention immédiats et calmerait une partie des plaintes, mais la Malaisie n'est pas signataire de la Convention de l'ONU sur les réfugiés, ce qui rend l'accord juridiquement douteux."
 malaysia_solution_ast.1.a: "On se serre la main là-dessus."
 malaysia_solution_ast.1.b: "Ce n'est pas juridiquement solide."
 malaysia_solution_ast.2.t: "La Haute Cour bloque un accord avec la Malaisie"
 malaysia_solution_ast.2.d: "Malheureusement, la Haute Cour d'Australie a jugé l'échange illégal au titre du Migration Act et a bloqué le transfert. La réaction immédiate a été une volée d'accusations de l'opposition, et les réactions du public n'ont fait qu'empirer. Il faudra peut-être chercher d'autres méthodes pour résoudre notre problème de rétention."
 malaysia_solution_ast.2.a: "Pas si simple."
 embassy_tent_protests.1.t: "Les protestations de l'ambassade sous tente"
 embassy_tent_protests.1.d: "Pour célébrer le 40e anniversaire de l'Aboriginal Tent Embassy, occupation de protestation pour les droits autochtones devant le Parlement en 1972, une cérémonie de distinctions se tient près du site, au Lobby Restaurant. Un groupe de manifestants rassemblés sur le site s'est dirigé vers le restaurant. Quelque chose les a échauffés : certains commencent même à frapper aux vitres. \n\nComme le [GetASTLeaderTitle] et le chef de l'opposition sont présents, la sécurité a conseillé une évacuation immédiate par un hélicoptère à proximité. La foule a l'air assez agitée, mais ouvrir le dialogue pourrait peut-être calmer les choses."
 embassy_tent_protests.1.a: "Sortez-moi d'ici !"
 embassy_tent_protests.1.b: "Parlons à la foule."
 embassy_tent_protests.2.t: "Le [GetASTLeaderTitle] blessé"
 embassy_tent_protests.2.d: "Un cauchemar sécuritaire s'est déroulé lorsque les gardes de Gillard ont ouvert un passage dans la foule, lui permettant de sortir et de parler. Une minute plus tard, un objet lancé par un manifestant a touché le [GetASTLeaderTitle], la jetant à terre et la blessant à l'œil. Police et gardes sont descendus sur la foule et ont évacué Julia Gillard, mais après un passage à l'hôpital, les dégâts à son œil droit semblent permanents. \n\nLe chef de l'opposition Tony Abbott a un instant, en séance, salué le courage du [GetASTLeaderTitle] et condamné l'attaque."
 embassy_tent_protests.2.a: "Oh non..."
 embassy_tent_protests.3.t: "Apaiser la foule"
 embassy_tent_protests.3.d: "Une fois Rudd sorti du pavillon, heureusement rien n'a mal tourné : la foule s'est calmée dès qu'il a commencé à mêler. Un commentaire de Tony Abbott avait déclenché le tumulte, et comme le chef de l'opposition avait été évacué, les tensions s'étaient apaisées. \n\nLe [GetASTLeaderTitle] a passé une heure avec la foule et les journalistes avant de revenir à la cérémonie. Une belle publicité positive."
 embassy_tent_protests.3.a: "Voilà comment on procède."
 embassy_tent_protests.4.t: "Bagarre avec les manifestants"
 embassy_tent_protests.4.d: "Après que la sécurité a ouvert un passage pour que Tony sorte du pavillon et parle aux manifestants, l'un d'eux s'est jeté sur lui, visiblement ivre, et en réaction le [GetASTLeaderTitle] a renvoyé un coup de poing. Le manifestant n'a pas de blessures graves, et il est évident qu'Abbott se défendait, mais les journalistes à l'intérieur ont pris toutes les photos nécessaires et voilà le [GetASTLeaderTitle] qui se bat littéralement avec des manifestants."
 muslim_protests_sydney.1.t: "Des émeutes islamiques éclatent à Sydney"
 muslim_protests_sydney.1.d: "Dans une série de manifestations de masse du Moyen-Orient à Londres, des musulmans ont défilé en colère contre la sortie controversée du film « Innocence of Muslims ». Sydney n'a pas fait exception : les protestations se sont étendues au CBD. Plus de 150 policiers ont été appelés et 6 ont été hospitalisés après que cela a dégénéré en émeutes. \n\nJusqu'ici 8 personnes ont été arrêtées, et après un affrontement tendu devant le consulat américain, les foules ont commencé à se disperser."
 muslim_protests_sydney.1.a: "Ici n'est pas le lieu de l'extrémisme."
 murrawarri_republic_event.1.t: "La république de Murrawarri proclame son indépendance"
 murrawarri_republic_event.1.d: "Le Parlement a reçu une lettre annonçant l'indépendance d'un État se nommant République murrawarri. La lettre stipule que le « Conseil des peuples murrawarri » revendique un territoire à cheval sur la frontière entre la Nouvelle-Galles du Sud et le Queensland comme terre souveraine, et exige la reconnaissance. \n\nFranchement, c'est la chose la plus étrange que notre personnel ait jamais vue, et ils ne semblent avoir aucune base juridique pour formuler la demande, ni pour que nous y répondions."
 murrawarri_republic_event.1.a: "Les Murra-quoi ?"
 shark_attacks_ast.1.t: "Les attaques de requins inquiètent l'opinion"
 shark_attacks_ast.1.d: "À environ 270 kilomètres au sud de Perth, près de Gracetown, un homme de 35 ans a été tué par un requin. Six jours plus tard, un autre surfeur, Zac Young, 18 ans, est mort dans une attaque près de Coffs Harbour. Cette série soudaine de décès liés aux requins a poussé le gouvernement d'Australie-Occidentale à promettre une approche plus agressive de la chasse aux requins dans les zones de baignade populaires. \n\nMalgré un risque d'attaques en baisse ces dernières années, le gouvernement d'AO a dépensé plus de 20 millions de dollars en patrouilles aériennes et abattages pour réduire la population de requins, une mesure que les biologistes marins jugent excessive."
 shark_attacks_ast.1.a: "On est des amis, pas de la nourriture !"
 election_outcomes_ast.3.t: "Les travaillistes obtiennent un autre mandat"
 election_outcomes_ast.3.d: "Les Australiens se sont rassemblés dans tout le pays pour voter et décider de l'orientation future de la nation. Cette fois, ils ont choisi que la gouvernance de [AST.GetLeader] continue, accordant au parti un autre mandat. Le [GetASTLeaderTitle] a prononcé son discours électoral au siège de Barton, entouré d'une foule travailliste en liesse, et a exposé les plans pour les trois prochaines années. La « malédiction de l'incumbent » du Labor semble levée, devenue plutôt un atout, détournant les électeurs du changement au profit d'une stabilité continue."
 election_outcomes_ast.3.a: "Pourquoi arrêter une bonne chose ?"
 election_outcomes_ast.7.t: "Le Parti libéral est réélu"
 election_outcomes_ast.7.d: "As the election parties wound down and the counting came to a close, the incumbent [AST.GetLeader] is expected to decisively win reelection. The mandate for their government has continued to win over the majority of voters, and solidified their position in the House and Senate, with small gains across the nation. Business in Parliament is expected to convene as usual, with the new term beginning next month."
 election_outcomes_ast.7.a: "Les beaux jours continuent !"
 election_outcomes_ast.9.t: "Malcolm Turnbull arrache de justesse la victoire"
 election_outcomes_ast.9.d: "Le chef libéral Malcolm Turnbull a revendiqué la victoire à l'élection fédérale, la Coalition s'approchant d'une mince majorité au parlement. \n\n« C'est un grand jour aujourd'hui », a dit Turnbull à la presse avant son discours de la soirée. \n\nAprès une campagne pour un gouvernement plus technocratique, le nouveau [GetASTLeaderTitle] a prononcé son discours d'acceptation dans cet esprit. \n\n« Nous devons être plus compétitifs, plus productifs et — plus innovants. » \n\nLe gouvernement Turnbull devrait s'attaquer à la demande énergétique croissante du pays et aux secteurs technologiques en expansion, avec, selon ses mots, « une volonté de trouver un terrain d'entente avec le peuple et nos industries. Le progrès, c'est aider tout le monde, — je sais que nous pouvons accomplir quelque chose de grand si nous y mettons nos meilleurs esprits. »"
 election_outcomes_ast.9.a: "À une direction plus lumineuse !"
 detention_centres_full.1.t: "Les centres de détention atteignent leur capacité"
 detention_centres_full.1.d: "The centres in Papua New Guinea and Nauru have begun to reach capacity, despite their initial scope and success, causing a bottleneck in our migrant processing operations. Although funding is already being directed to the centres to amend the current deficiencies, further improvements or options will need to be pursued if we're going to solve the problem long-term. This comes at a time when unauthorised arrivals have risen to their highest level in years."
 detention_centres_full.1.a: "Rien ne dure ?"
 migration_event_ast.1.t: "L'immigration clandestine atteint un nouveau record"
 migration_event_ast.1.d: "Le nombre de migrants illégaux tentant d'atterrir sur nos côtes a explosé ces derniers mois. Qu'ils soient poussés par les crises en cours ou par l'envie de notre prospérité, les migrants viennent de loin, et beaucoup sautent la file. Nos patrouilles frontalières ont atteint un record d'interceptions, et cela commence à tendre nos capacités opérationnelles."
 migration_event_ast.1.a: "Des temps troublants."
 aukus_formed_ast.1.t: "Partenariat AUKUS en action"
 aukus_formed_ast.1.d: "The leaders of Australia, the United Kingdom and the United States met in Washington, D.C, at the Pentagon earlier today to discuss forming the trilateral alliance. Cyber capabilities, artificial intelligence and protecting supply chains were reportedly a part of the discussion, all with the aim of deepened diplomatic and defense cooperation between the three states. \n\n\"For more than 70 years, Australia, the United Kingdom, and the United States, have worked together... Today - we recommit ourselves to this vision.\" \n\nThe partnership will apparently work as an addition to the three nations' current alliances. [AST.GetLeader] has indicated that the first intention of AUKUS is strengthening defense proliferation."
 aukus_formed_ast.1.a: "À deux c'est une entreprise, à trois c'est un partenariat."
 pukpuk_treaty_event.1.t: "Traité historique PNG-Australie entré en vigueur"
 pukpuk_treaty_event.1.d: "Le traité historique « Pukpuk » entre la Papouasie-Nouvelle-Guinée et l'Australie a été finalisé, et a été salué par le [GetASTLeaderTitle] comme une élévation de nos relations, soulignant qu'ils se joignent « comme voisins, comme mates, et désormais comme alliés ». \n\nLe traité, nommé d'après le terme local pour crocodile, amorcera l'intégration de l'armée papoue dans les Forces de défense australiennes, et permettra jusqu'à 10 000 nationaux papous de servir. Les deux s'engageront aussi à se soutenir si l'un des pays est attaqué. Un atout considérable pour la projection de sécurité et la stabilité régionales."
 pukpuk_treaty_event.1.a: "À nos partenaires et amis !"
 ast_taiwan_recognition.1.t: "L'Australie reconnaît la République de Chine"
 ast_taiwan_recognition.1.d: "Dans un revirement historique de la politique bipartisane, [AST.GetLeader] a formellement reconnu Taïwan comme État souverain et indépendant. Premier pivot du pays loin de la ligne continentale chinoise depuis la visite de Gough Whitlam en 1971. Dans le cadre d'un « élan pour la paix » en Indo-Pacifique, le [GetASTLeaderTitle] a indiqué que la reconnaissance est un « constat de la réalité », avec une poussée pour le concept des deux Chines. \n\nLes réactions de la Chine ont été rapides et cinglantes. Des ministres chinois ont fustigé l'Australie comme une « nation à deux visages » en ligne, et le ministère des Affaires étrangères a immédiatement commencé à instituer une série de restrictions commerciales, à un cheveu d'un embargo total."
 ast_taiwan_recognition.1.a: "Un ami en effet."
 howard_rumblings_in_dark.1.t: "Remous dans le parti"
 howard_rumblings_in_dark.1.d: "Il y a toujours eu une certaine belligerance dans le Parti libéral, et à chaque controverse on la voyait remonter à la surface. Howard savait que la seule différence entre un collègue et un mécontent, c'était de bons sondages, et depuis peu les sondages étaient misérablement bas. Les grognements en coulisses avaient fini dans les journaux, mais même sans les tabloïds on entendait les critiques. \n\nCertains disaient que Howard était simplement trop vieux, d'autres qu'il était « déconnecté ». Il savait qu'au contraire, il était parfaitement au fait des manigances. Son propre adjoint, Peter Costello, faisait déjà des mouvements pour le prochain ballot de leadership. Deals et voix, et si Howard ne parvenait pas à reprendre la main, il serait hors du Premier ministère, et Costello dedans. Telle était la nature de la politique de parti."
 howard_rumblings_in_dark.1.a: "Il faut réparer ça."
 howard_rumblings_in_dark.2.t: "Trahisons au cabinet"
 howard_rumblings_in_dark.2.d: "Cela n'était pas sorti de nulle part, mais c'est aux petites heures qu'il a eu la nouvelle. Plutôt que de se laisser traîner dans la boue jusqu'au ballot, Howard allait partir à ses conditions. Il avait ramené le parti du bord du gouffre, et maintenant on le mettait à la porte. \n\n« Ce fut un immense privilège, chaque jour de ces dernières années, d'avoir été [GetASTLeaderTitle] de ce beau pays, et je veux remercier le peuple australien du privilège qu'il m'a accordé. Je le respecte et je l'honore. Après des années de quête, diriger cette nation a été l'expérience la plus incroyable d'une vie. » \n\n« Je veux remercier le peuple australien du privilège de servir. J'assume l'entière responsabilité du Parti libéral, des succès et des défaites. Ce n'est pas facile de perdre sa place dans le parti. Pourtant, je leur dois plus que le parti ne me doit. » \n\nIl a fini par un petit signe de la main, puis c'était le retour à Bennelong. Vers des pâturages plus verts…"
 howard_rumblings_in_dark.2.a: "Pourtant, ça piquait toujours."
 abbott_gov_event.1.t: "Le gouvernement Abbott dévoile un cabinet à dominante masculine"
 abbott_gov_event.1.d: "Le [GetASTLeaderTitle] élu, Tony Abbott, a révélé un cabinet lourd d'expérience, avec 15 vétérans du gouvernement Howard — mais léger en représentation féminine, la vice-[GetASTLeaderTitle] Julie Bishop étant la seule femme d'un cabinet de 19. \n\nAbbott a déclaré qu'il était déçu qu'il n'y ait pas « au moins deux » femmes au cabinet, mais s'attendait à des promotions avec le temps, de « bonnes et talentueuses » femmes du ministère extérieur « frappant à la porte » du cabinet. Pourtant, sur les 11 membres du ministère extérieur, seules quatre sont des femmes. \n\nLe déséquilibre a attiré de nombreuses critiques des partis d'opposition, qu'Abbott a vite balayées pour parler des « vrais sujets »."
 abbott_gov_event.1.a: "C'est une méritocratie, après tout."
 abbott_gov_event.2.t: "L'Australie vote « oui » à la reconnaissance autochtone"
 abbott_gov_event.2.d: "À la suite d'un vote national de 74 %, les Autochtones australiens et les insulaires du détroit de Torrès seront inscrits dans la Constitution dans le cadre de la nouvelle approche du gouvernement Abbott à la reconnaissance autochtone. Au festival culturel annuel de Garma avant le référendum, Abbott a déclaré que « la reconnaissance autochtone ne changera pas notre Constitution mais la complétera », décrivant l'amendement comme un moment de guérison. \n\nDepuis les résultats, Abbott a aussi réitéré son plan de passer une semaine dans une communauté autochtone. \n\n« Le fait est que si ces lieux sont le foyer des premiers Australiens, pourquoi ne seraient-ils pas le foyer du [GetASTLeaderTitle] de notre pays ? »"
 abbott_gov_event.2.a: "Très vrai."
 abbott_gov_event.3.t: "L'incident de l'oignon"
 abbott_gov_event.3.d: "Tony Abbott descended to rural Tasmania, meeting with the local farmers as part of his agricultural project. Reporters gathered around the pavilion as Tony shook hands and gave a short speech alongside one of the farmers. \n\nIn front of him was a square basket bursting with produce, each as ripe and shiny as the next. While the farmer was explaining the project to the reporters, Abbott's mind was on the onions. \n\nWould the journos believe he was really dedicated to the farmers if he didn't show it? How could they see that Australian produce was really the best in the world? \n\nAs he looked down at the onions, someone beside him began to heckle. \"You can take a bite out of it now if you're keen!\" \n\nHad they really said that, or was it Tony's own thoughts egging him on? Before he knew it an onion was in his hand. The cameras flashed, and a few jeers rang out, as he took a bite from the raw onion. The farmer turned in disbelief as Tony only paused to nod before taking in another bite. \"Very good\" was all he could muster, watching Tony continue to munch away."
 abbott_gov_event.3.a: "Pourquoi a-t-il fait cela ?"
 abbott_gov_event.4.t: "Se promener"
 abbott_gov_event.4.d: "Un autre moustique a trouvé son chemin dans la tente, malgré le filet et les pulvérisations incessantes. Il faisait trop sombre pour le voir, alors il a tenté de l'ignorer. Il passait la plus grande partie d'une semaine sur la Terre d'Arnhem avec les dirigeants locaux, dans le Territoire du Nord reculé, et l'expérience était jusqu'ici très paisible, hormis le bavardage constant de l'ordinateur portable près de son lit. \n\nLe lendemain, les cérémonies habituelles, et des tête-à-tête avec le chef du clan Gumatji. Le chef était très impatient de discuter de l'offre reçue de Rio Tinto, une proposition de nouvelle mine de bauxite à proximité. On avait déjà foré dans la région, mais la nouvelle mine serait sur une terre sacrée, aussi le [GetASTLeaderTitle] devait-il donner son accord. \n\nLe chef de clan devait recevoir 75 pour cent des redevances, et Rio Tinto affirmait que l'opération donnerait aux Gumatji « des carrières réussies dans l'industrie minière ». Douteux, vu que toutes ces années de mines Rio sur les terres Yolngu n'ont produit qu'un seul apprenti autochtone qualifié."
 abbott_gov_event.4.a: "Approuver la mine."
 abbott_gov_event.4.b: "C'est une terre sacrée."
 abbott_gov_event.5.t: "Dérapages dans le programme"
 abbott_gov_event.5.d: "Tony Abbott se tenait au pupitre devant la même salle comble où il avait fait campagne il n'y a pas si longtemps. Derrière lui, une bannière du Parti libéral et le drapeau australien, qu'il avait insisté pour faire accrocher aussi. Il a commencé par les civilités habituelles avant de s'en prendre aux manques du système éducatif actuel. Tony était peut-être le plus à l'aise quand il déchirait les choses. C'est ce qui en faisait un si bon chef de l'opposition, et maintenant il essayait de vendre sa réforme des programmes. \n\nSans doute sa rhétorique les gagnait, mais à mesure que le discours avançait, quelque chose de très malencontreux s'est produit. \n\n« Personne, si intelligent, si bien éduqué, si expérimenté… n'est le suppositoire de toute sagesse. » \n\nQuelques rires ont retenti tandis qu'Abbott réalisait lentement qu'il avait confondu le mot « réceptacle » avec le nom d'un outil médical rectal. Il a poursuivi sans autre accroc, mais dès le lendemain cette petite erreur était à la une."
 abbott_gov_event.5.a: "Ils se ressemblent effectivement..."
 abbott_gov_event.6.t: "Résultats de la commission"
 abbott_gov_event.6.d: "L'audit a livré une revue exhaustive de nos dépenses, et un plan assez radical pour les faire baisser. Coupes aux pensions, à la santé publique, à l'éducation et aux allocations : tout y est. Si nous allons au bout de la proposition, le cri public pourrait être trop fort pour s'en remettre, mais cela donnerait un énorme coup de pouce au budget. Sinon nous pourrions l'adoucir et livrer quelque chose de plus palatable aux électeurs."
 abbott_gov_event.6.a: "Arrosez-le."
 abbott_gov_event.6.b: "Aller jusqu'au bout."
 malcolm_abbott_event.1.t: "La visite de Malcolm"
 malcolm_abbott_event.1.d: "Our minister for communication, Malcolm Turnbull, has approached us in quiet regarding our policy direction, warning that any continued cost-cutting is going to have serious ramifications. Whether he means party reactions in particular or public perception is unclear, but Malcolm does have a flair for the theatrics. This may just be another one of his overreactions, and he has been vocally opposed to our fiscal restrictions before."
 malcolm_abbott_event.1.a: "Annoncer publiquement la fin des coupes."
 malcolm_abbott_event.1.b: "Il réagit de manière excessive."
 malcolm_abbott_event.2.t: "Le « budget cruel » d'Abbott suscite des protestations dans tout le pays"
 malcolm_abbott_event.2.d: "Des milliers de personnes ont assisté à des rassemblements à travers l'Australie pour protester contre le dernier round de coupes. De grandes manifestations « Bust the Budget » se sont tenues dans presque toutes les grandes villes, notamment avec le Conseil australien des syndicats. Le trésorier Joe Hockey a tenté de défendre les coupes, affirmant que le pays a « dérivé vers les lignes de guerre des classes des années 1970 » et que son budget parlait d'égalité des chances, non d'égalité des résultats. \n\nQuoi qu'il en soit, les manifestants ont indiqué qu'ils prévoyaient de continuer le mois entier. Le plus récent s'est tenu sur les pelouses de Parliament House, avec une marionnette plus grande que nature du [GetASTLeaderTitle]."
 malcolm_abbott_event.2.a: "Je n'ai pas cette tête-là !"
 malcolm_abbott_event.3.t: "Le spill de leadership"
 malcolm_abbott_event.3.d: "Après le récent retour de bâton public, lors de la dernière réunion du parti, un membre a voté un « spill » de leadership, déclenchant un nouveau vote pour savoir si Tony devait rester chef. Comme personne n'a le cran de défier, le seul autre candidat que Tony était une chaise vide. \n\nQuand les voix sont arrivées, le [GetASTLeaderTitle] l'a emporté avec 61 voix, bien qu'un nombre non négligeable de 39 voix soit allé à la chaise vide. Il est clair que la chute du soutien du parti est préoccupante, et si nous ne retournons pas la situation, un autre vote pourrait bien plus mal tourner."
 malcolm_abbott_event.3.a: "Il est encore temps."
 abbott_jakarta_event.1.t: "Mener le bon combat"
 abbott_jakarta_event.1.d: "Dans l'esprit d'Abbott, s'arrêter à Jakarta était le bon point de départ. Beaucoup d'Australiens oubliaient que l'Indonésie est une nation à majorité musulmane de plus de 230 millions d'habitants, à un saut de la métropole. Depuis les attentats de Bali, chaque mois semblait apporter une nouvelle attaque. Il n'était jamais sûr que la suivante ne serait pas plus près de chez lui, et la pensée ne le quittait pas. \n\nQuand Tony a parlé au président, [IND.GetLeader], il a abordé le sujet. Bien sûr, son but était de vendre l'idée d'opérations australiennes de maintien de la paix dans le pays, quelque chose qu'il visait depuis un moment, au grand dam du gouvernement indonésien. \n\nAuparavant, le soft power avait été la stratégie pendant des décennies, programmes éducatifs et autres aides pour tenir les tensions ethniques, abondantes, à un niveau modéré. Ce n'était guère une solution à la menace du fondamentalisme. Au mieux, Tony est parti avec la promesse de poursuivre les coopérations actuelles, et que la porte resterait ouverte pour l'avenir."
 abbott_jakarta_event.1.a: "Bref, un résultat décevant."
 o_canada_abbott.1.t: "L'Australie propose une coopération minière"
 o_canada_abbott.1.d: "Le gouvernement de Canberra nous a proposé d'échanger des experts techniques miniers pour rapprocher nos nations et tirer parti des riches ressources naturelles que nous héritons tous deux. L'accord est assez simple et, en surface, nous bénéficierait tous deux, même si le gouvernement australien actuel n'a pas été très proche du nôtre."
 o_canada_abbott.1.a: "Nous accueillons nos frères du Commonwealth."
 o_canada_abbott.1.b: "Non merci."
 o_canada_abbott.2.t: "A Few Gaffes In Ottawa"
 o_canada_abbott.2.d: "Debout dans l'aile aérienne du Musée canadien de la guerre à Ottawa, Tony s'est adressé à la foule de reporters, dont beaucoup étaient australiens malgré le lieu. Il ne pouvait même pas quitter le pays sans une ribambelle de journalistes. [CAN.GetLeader] se tenait à ses côtés. Tout en essayant de ne pas tomber dans les stéréotypes, il n'a pu s'empêcher de dire qu'ils étaient en effet un peuple amical. Un peu trop à gauche à son goût, toutefois. \n\nL'esprit de Tony est revenu à la clôture de son discours. Il s'est tourné et a serré la main de leur dirigeant avant de partir, et s'il a trébuché quelques fois, une fois en parlant du pays comme « Canadia », les choses se sont passées sans accroc majeur. Le gouvernement canadien a accepté un investissement minier, et en échange nous envoyons nos propres experts pour aider au forage."
 o_canada_abbott.2.a: "C'est cette communauté du Commonwealth."
 abbott_china_trade.1.t: "Coopération commerciale renforcée de l'Australie"
 abbott_china_trade.1.d: "Le dirigeant australien, [AST.GetLeader], a été très impatient d'élargir le champ de notre commerce avec leur nation en avançant vers un accord de libre-échange. L'accord inclurait jusqu'à 95 % d'importations de nos biens sans tarif, un échange de ressources plus fluide, ainsi que des clauses permettant à nos entreprises privées d'investir plus facilement en Australie. En surface, cela semble un gagnant-gagnant à tous les égards."
 abbott_china_trade.1.a: "Un effort digne"
 abbott_china_trade.1.b: "Pas dans notre intérêt."
 abbott_china_trade.2.t: "L'accord de libre-échange de [GetYear] signé"
 abbott_china_trade.2.d: "La Chine a accepté notre accord bilatéral de libre-échange, renforçant grandement le flux de minerais et de biens manufacturés entre nous. Presque une décennie de négociations pour un pacte plus vaste a enfin abouti. Vu la position du pays comme notre plus grande source de recettes d'exportation, les effets devraient se sentir immédiatement dans l'économie. Avec un document tout juste signé et une poignée de main, le Pacifique est soudain plus proche, plus uni."
 abbott_china_trade.2.a: "La magie des intérêts alignés."
 abbott_china_trade.3.t: "La Chine refuse toute nouvelle collaboration commerciale"
 abbott_china_trade.3.d: "Malheureusement, la Chine a refusé nos offres de collaboration accrue et a fermé les portes diplomatiques pour l'instant. Il semble que nous devrons chercher d'autres voies à l'avenir."
 abbott_china_trade.3.a: "Pas le pire résultat, mais certainement pas bon."
 abbott_navy_exercises_event.1.t: "Les fruits des exercices"
 abbott_navy_exercises_event.1.d: "Les exercices avec nos amis américains se sont achevés et ont livré des résultats utiles. Outre une pratique bienvenue pour nos forces, les exercices ont pointé des lacunes technologiques de nos unités. Après avoir partagé les données avec nos divisions R&D, il semble que nous puissions appliquer certains de ces constats à notre développement de recherche."
 abbott_navy_exercises_event.1.a: "C'est certainement utile."
 knights_and_dames_ast_event.1.t: "Réactions mitigées au titre de chevalier du prince Philip"
 knights_and_dames_ast_event.1.d: "Les collègues seniors du [GetASTLeaderTitle] ont vocalement affiché un mélange de stupeur, de colère et de consternation face à sa décision de rétablir la tradition en attribuant un knighthood australien au prince Philip, un non-Australien. \n\nDes ministres du cabinet ont dit à l'ABC que le [GetASTLeaderTitle] n'avait consulté aucun du groupe de direction avant d'annoncer la distinction. Un geste qui semble avoir divisé le parlement entre partisans de la république. \n\n« Je suis vraiment heureux qu'à plus de 90 ans, vers la fin d'une vie de service et de devoir, nous puissions dans ce pays reconnaître ce qu'il a fait pour nous. » Tony Abbott a dit dans sa déclaration. Si la réaction du Royaume-Uni a été une gratitude un peu étouffée, les réactions chez nous sont tout sauf cela."
 knights_and_dames_ast_event.1.a: "On ne peut pas plaire à tout le monde."
 abbott_japan_trade_deal.1.t: "Renégociations commerciales depuis Canberra"
 abbott_japan_trade_deal.1.d: "The [GetASTLeaderTitle] of Australia, [AST.GetLeader], has contacted us directly to discuss renegotiating the trade commitments we currently have with their nation to further \"rectify\" some inadequacies. Whether they're referring to some from our side or theirs is unclear, but some ironing out of the agreement could provide a smoother transit of goods between us. In particular agricultural imports."
 abbott_japan_trade_deal.1.a: "Cela semble juste."
 abbott_japan_trade_deal.1.b: "Non merci."
 abbott_japan_trade_deal.2.t: "Negotiations with Japan Bear Historic Deal"
 abbott_japan_trade_deal.2.d: "The renegotiations have struck economic gold, presenting us with a much fairer agreement. The tariffs Japan has on our beef will be practically removed, along with a slew of other agricultural products. The only produce they weren't willing to budge on was the rice, however. \n\nThey're also signing onto a priority resource contract. Meanwhile, as promised, we're slashing a number of tariffs on their electronics and vehicles. The boost this will deliver to our farming sector can't be overstated. A serious win for us compared to the original deal."
 abbott_japan_trade_deal.2.a: "Ça, c'est une chance équitable."
 abbott_saf_event.1.t: "Les malheurs du Cap"
 abbott_saf_event.1.d.a: "Curieusement, l'Afrique du Sud a trois capitales différentes. Un fait qu'Abbott peinait à comprendre. Pour ne pas ralentir, Johannesburg a été choisi par simplicité, et à l'arrivée l'arrêt était le tout nouveau stade FNB. Ils étaient visiblement impatients de montrer leurs efforts de modernisation, bien que Tony ne pût douter d'être dans un pays en développement. \n\nL'éléphant qu'il devrait finir par aborder était le problème des réfugiés. Des milliers d'agriculteurs principalement blancs, fuyant les affrontements ethniques, protestaient contre l'inaction du gouvernement sud-africain. Les officiels, toutefois, insistaient qu'ils faisaient tout ce qu'ils pouvaient, et que le sujet était gonflé. \n\nTout ce qu'Abbott savait, c'est que le nombre de réfugiés croissait, et qu'ils exigeaient une condamnation."
 abbott_saf_event.1.d.b: "Curiously, the nation of South Africa has three different capitals. A fact that Abbott struggled to comprehend. As to not slow things down, Johannesburg was picked for simplicity's sake, and when he arrived the first stop was the Nelson Mandela memorial. There was a deep respect Abbott had for the man, even requesting that the flags in Australia be lowered to half mast for the day. \n\nAlthough the elephant that he'd eventually have to address was the refugee problem. Thousands of predominantly white farmers, who were fleeing the ongoing ethnic clashes, had been protesting the inaction from the South African government. The officials, however, were insistent that they were doing everything they could, and that issue was being blown out of proportion. \n\nAll Abbott knew was that the number of refugees was growing, and they were demanding condemnation."
 abbott_saf_event.1.b: "Condamner le gouvernement et accélérer les visas de réfugiés."
 abbott_saf_event.1.a: "Ils ont notre soutien."
 indonesian_intervention_abbott.2.t: "Jakarta refuse notre demande"
 indonesian_intervention_abbott.2.d: "Comme prévu, le gouvernement indonésien a refusé notre demande d'autoriser des opérations de maintien de la paix dans le pays, et a fermé nos diplomates à toute discussion ultérieure. La réponse nous laisse peu d'options pour faire respecter l'exigence hors une action directe. Entre-temps, toute coopération semble gelée."
 indonesian_intervention_abbott.2.a: "Ils nous forcent la main."
 indonesian_intervention_abbott.3.t: "Jakarta approuve nos efforts de maintien de la paix"
 indonesian_intervention_abbott.3.d: "It seems hell has frozen over, or perhaps Jakarta has. The Indonesian government has approved our request for peacekeeping operations in the nation. This will do wonders for our anti-terrorism, and with us able to directly intervene on threats, the chance of another attack in the future has been drastically reduced."
 indonesian_intervention_abbott.3.a: "C'est une excellente nouvelle !"
 oceanic_alliance_ast.1.t: "Pourparlers d'une alliance océanienne"
 oceanic_alliance_ast.1.d: "Le gouvernement de Canberra a envoyé une délégation pour discuter de la formation d'une alliance océanique officielle, avec l'intention expresse que nous y adhérions. Adhérer signifierait effectivement combiner nos militaries pour maintenir des mesures défensives dans le Pacifique, et les Australiens insistent que le pacte écarterait le potentiel de conflit dans la région pour un avenir prévisible s'il se réalisait. Nous abandonnerions toutefois un certain niveau d'autonomie, et nous lierions peut-être à contre-cœur à la politique étrangère toujours changeante de l'Australie."
 oceanic_alliance_ast.1.a: "Un effort louable."
 oceanic_alliance_ast.1.b: "Notre indépendance est plus importante."
 oceanic_alliance_ast.2.t: "La Nouvelle-Zélande refuse l'alliance"
 oceanic_alliance_ast.2.d: "Il semble que le gouvernement néo-zélandais n'ait pas jugé bon de formaliser une alliance pour l'instant, estimant ses capacités défensives actuelles suffisantes. C'est un résultat décevant, mais d'autres voies restent peut-être à explorer."
 oceanic_alliance_ast.2.a: "Convient à eux-mêmes."
 oceanic_alliance_ast.3.t: "L'Indonésie refuse l'alliance"
 oceanic_alliance_ast.3.d: "Il semble que le gouvernement indonésien n'ait pas jugé bon de formaliser une alliance pour l'instant, estimant ses capacités défensives actuelles suffisantes. C'est un résultat décevant, mais d'autres voies restent peut-être à explorer."
 oceanic_alliance_ast.4.t: "La Papouasie-Nouvelle-Guinée refuse l'alliance"
 oceanic_alliance_ast.4.d: "Il semble que le gouvernement de Port Moresby n'ait pas jugé bon de formaliser une alliance pour l'instant, estimant ses capacités défensives actuelles suffisantes. C'est un résultat décevant, mais d'autres voies restent peut-être à explorer."
 oceanic_alliance_ast.5.t: "Le Vanuatu refuse l'alliance"
 oceanic_alliance_ast.5.d: "Il semble que la République de Vanuatu n'ait pas jugé bon de formaliser une alliance pour l'instant, estimant ses capacités défensives actuelles suffisantes. C'est un résultat décevant, mais d'autres voies restent peut-être à explorer."
 operation_sovereign_abbott.1.t: "Opération Frontières Souveraines"
 operation_sovereign_abbott.1.d: "Scott Morrison s'est penché vers Abbott et lui a pris la main, la serrant sous les flashes. Scott était plus grand de quelques centimètres, et sa main est restée coincée dans celle de Scott un peu plus longtemps qu'il n'était à l'aise. En privé, Morrison avait vendu le projet comme une étape impopulaire mais nécessaire pour combattre la tension croissante de la migration illégale, et s'était proposé d'en être le visage en cas de retour de bâton. Abbott était assez expérimenté pour savoir qu'il y avait plus en jeu. \n\nMorrison s'était fait un nom pour son travail en coulisses, agissant comme whip du parti en tout sauf le titre. Il était efficace, et très prompt à offrir une solution aux problèmes que lui seul avait le flair de voir. Jusqu'ici il avait fait ses preuves. S'il voulait un peu de crédit, c'était juste, c'était sa politique après tout. Aussi Abbott a-t-il accepté, et le lancement est devenu un grand coup de pub pour leur gouvernement."
 operation_sovereign_abbott.1.a: "Dites fromage !"
 japan_subs_abbott.1.t: "Décider de l'achat"
 japan_subs_abbott.1.d: "Le plan d'origine était d'acheter 6 sous-marins de classe Harushio pour remplacer notre flotte Collins vieillissante. Toutefois, compte tenu du besoin de puissance de feu au-dessus des vagues, nous pourrions demander l'achat de 3 destroyers légers à hélicoptères à la place. \n\nLes sous-marins gonfleraient bien nos effectifs, et les modèles ont été mis à jour aux dernières technologies. D'un autre côté, les destroyers de classe Murasame pourraient nous donner l'avantage dans les airs et en puissance de feu brute."
 japan_subs_abbott.1.a: "Rester sur les sous-marins."
 japan_subs_abbott.1.b: "Opter pour les destroyers."
 japan_subs_abbott.2.t: "Demande d'achat de navires de l'Australie"
 japan_subs_abbott.2.d: "Les Australiens nous ont contactés avec une proposition intéressante. Ils ont offert d'acheter six de nos sous-marins vieillissants de classe Harushio pour étoffer leur flotte, contre une somme substantielle. Cela renforcerait nos liens de défense et fournirait un financement supplémentaire pour les sous-marins de remplacement."
 japan_subs_abbott.2.a: "Approuver l'accord."
 japan_subs_abbott.2.b: "Ce n'est pas dans notre intérêt."
 japan_subs_abbott.3.d: "Les Australiens nous ont contactés avec une proposition intéressante. Ils ont offert d'acheter trois de nos destroyers légers vieillissants de classe Murasame pour étoffer leur flotte, contre une somme substantielle. Cela renforcerait nos liens de défense et fournirait un financement supplémentaire pour les navires de remplacement."
 japan_subs_abbott.4.t: "Le Japon refuse la vente"
 japan_subs_abbott.4.d: "Unexpectedly the Japanese government has refused our deal, preferring to keep their fleet to its current size. At this rate they're going to be calling us the UNLUCKY country."
 japan_subs_abbott.4.a: "Ce n'est pas possible…"
 japan_subs_abbott.5.t: "Le Japon approuve la vente"
 japan_subs_abbott.5.d: "Le Japon a approuvé la demande de vente, et les navires seront bientôt transférés à notre flotte. Nous fournissant une puissance de feu supplémentaire bienvenue sur les mers."
 japan_subs_abbott.5.a: "Excellente nouvelle."
 abbott_condemns_china.1.t: "Tony Abbott dénonce l'expansion de la Chine"
 abbott_condemns_china.1.d: "La récente position du [GetASTLeaderTitle] australien sur la Chine a inquiété les vétérans du Parti libéral, et réveillé le soutien des électeurs, prenant une nouvelle stance contre la construction d'îles artificielles du pays. \n\nLors d'une conférence de presse hier, le dirigeant a réprouvé les récents mouvements de la Chine comme « la plus grande expansion militaire de l'histoire en temps de paix ». Exigeant un renforcement urgent des propres forces de l'Australie pour maintenir la dissuasion. Soulignant le positionnement de plus de navires et d'avions en Asie de l'Est pour extraire le pays des chaînes d'approvisionnement critiques. \n\nDepuis l'annonce, des officiels chinois ont condamné la position et décrit Tony Abbott comme suscitant une « hystérie anti-Chine ». Quelle que soit l'intention, les tensions semblent atteindre un point haut entre les deux pays."
 abbott_condemns_china.1.a: "Serait-ce des nuages d'orage ?"
 kuala_lumpur_abbott.1.t: "Pacte commercial pour la neutralité"
 kuala_lumpur_abbott.1.d: "Mineral trade between us and Australia has risen to the point that the Australian government has contacted us to discuss enacting a free trade agreement between us. The specifics of the deal include us lowering coal, aluminium and other mineral tariffs, along with some on produce imports. In exchange Australia will decrease their tariffs on our crude oil, electronic and transport equipment exports. \n\nPart of the deal, however, has stipulated that we declare our neutrality in their current disagreements with China, which only amounts to us signing a non-aggression pact with them."
 kuala_lumpur_abbott.1.a: "Un accord équitable."
 kuala_lumpur_abbott.1.b: "C'est trop demander."
 kuala_lumpur_abbott.2.t: "La Malaisie signe le pacte"
 kuala_lumpur_abbott.2.d: "Our friends in Malaysia have signed the trade agreement and have formally signed the pact to remain diplomatically neutral in our matters. Allowing the exchange of minerals and produce to flow smoothly between us. Another part of the Island Chain has been taken out of the picture."
 kuala_lumpur_abbott.2.a: "Très bien."
 kuala_lumpur_abbott.3.t: "La Malaisie refuse l'accord de neutralité"
 kuala_lumpur_abbott.3.d: "Despite our best intentions, Malaysia has refused to make any promises, and has refused our trade agreement. A piece of the Island Chain regrettably remains on the table."
 kuala_lumpur_abbott.3.a: "Qui savait que la diplomatie pouvait être si dure."
 jap_repar_abbott.1.t: "L'Australie exige des réparations pour la Seconde Guerre mondiale"
 jap_repar_abbott.1.d: "Curieusement, le gouvernement australien nous a contactés pour organiser des paiements très tardifs pour leurs dépenses pendant la Seconde Guerre mondiale. La demande a déconcerté la plupart des officiels, qui ont vu nos relations avec le pays largement positives dans les décennies depuis la guerre. Quoi qu'il en soit, leur gouvernement semble sérieux, et nous a envoyé une facture plutôt salée."
 jap_repar_abbott.1.a: "Payez-le simplement."
 jap_repar_abbott.1.b: "C'est une blague ?"
 jap_repar_abbott.2.t: "Japan Agrees to Pay Reparations"
 jap_repar_abbott.2.d: "Il semble que leur gouvernement comprenne nos peines, et a accepté un paiement forfaitaire directement à nous pour couvrir le coût de la guerre. Ils ne font pas les choses à moitié. Une cérémonie officielle se tiendra avec la délégation japonaise dans le port de Darwin, et un département sera formé pour faciliter le transfert des réparations. Malgré l'irrégularité de l'ensemble, les médias le prennent bien, et les partis d'opposition restent largement silencieux."
 jap_repar_abbott.2.a: "Les vieilles blessures peuvent désormais cicatriser."
 jap_repar_abbott.3.t: "Le Japon refuse les réparations"
 jap_repar_abbott.3.d: "Dans un tournant un peu embarrassant, le gouvernement japonais a refusé la demande et nous a fustigés à leur télévision nationale. Bien sûr, la nôtre doit être de mèche, car toutes les grandes chaînes se moquent de toute l'affaire, seulement surpassé par la raclée que nous recevons à la Chambre et au Sénat. Quelques manifestations ont même été vues devant le Parlement, avec des pancartes dépeignant Abbott en mendiant assis devant l'ambassade japonaise."
 jap_repar_abbott.3.a: "Inutile d'en remettre une couche."
 jap_alliance_abbott.1.t: "Alliance mutuelle venue d'en bas"
 jap_alliance_abbott.1.d: "L'Australie a proposé un pacte de sécurité mutuelle, dont les détails déclencheraient un appel à la guerre si un conflit éclatait entre l'un de nous et la Chine. Le pacte vise apparemment à dissuader de nouveaux affrontements avec la Chine, pour sauvegarder le Pacifique."
 jap_alliance_abbott.1.a: "Là-dessus, nous sommes alignés."
 jap_alliance_abbott.1.b: "Cela va trop loin."
 jap_alliance_abbott.2.t: "L'accord de Yokohama"
 jap_alliance_abbott.2.d: "Le gouvernement de Tokyo a signé le pacte, créant une alliance de sécurité entre nous. Si un conflit éclatait entre nous et la Chine, le Japon serait appelé à rejoindre le combat. Une autre pièce a été ajoutée de notre côté de l'échiquier."
 jap_alliance_abbott.2.a: "Une alliance honorable."
 jap_alliance_abbott.3.t: "Le Japon refuse le pacte"
 jap_alliance_abbott.3.d: "After an unusual silence from the Japanese delegates, the [GetASTLeaderTitle] received a facetime from his Japanese counterpart. It was a long and winded call, and only mumbled yelling could be heard outside of the PM's office, but after eventually devolving into a dance-off of sorts the negotiations have been called off."
 jap_alliance_abbott.3.a: "Peut-être le pire résultat."
 france_abbott_ast.1.t: "Location d'île"
 france_abbott_ast.1.d: "Le gouvernement australien nous a proposé de louer des terres sur les îles de Nouvelle-Calédonie à usage militaire, sur une période de 5 ans. Ils nous ont assuré que le bail garantirait une stabilité continue dans le Pacifique, dans le cadre de leurs récents efforts de maintien de la paix, et ont offert 39 milliards pour les terres et les droits de basage."
 france_abbott_ast.1.a: "Un accord équitable."
 france_abbott_ast.1.b: "Les îles sont à nous seuls."
 france_abbott_ast.2.t: "Bail néo-calédonien"
 france_abbott_ast.2.d: "La France a joyeusement approuvé le bail, nous donnant le droit de facto d'étendre notre présence militaire et nos infrastructures sur les îles environnantes pour les 5 prochaines années."
 france_abbott_ast.2.a: "Notre portée s'étend."
 france_abbott_ast.3.t: "Le bail de l’île échoue"
 france_abbott_ast.3.d: "La France a refusé notre offre de louer les îles pour l'instant, et nous a effectivement laissés stratégiquement dans le froid. Il nous faudra trouver un autre moyen de sécuriser notre flanc est."
 france_abbott_ast.3.a: "C'était un bel accord !"
 france_abbott_ast.4.t: "Le bail des îles touche à sa fin"
 france_abbott_ast.4.d: "La période de bail que l'Australie a sur les îles néo-calédoniennes pour le positionnement militaire approche de sa fin. Nous pouvons leur offrir une prolongation de 5 ans, ou demander qu'elles nous soient rendues."
 france_abbott_ast.4.a: "Qu'ils prolongent le bail."
 france_abbott_ast.4.b: "Il est temps qu'elles reviennent au bercail."
 france_abbott_ast.5.t: "La France propose une prolongation"
 france_abbott_ast.5.d: "Alors que la fin de notre bail sur les îles néo-calédoniennes approche, la France nous a contactés pour offrir une prolongation de 5 ans."
 france_abbott_ast.5.a: "Une offre raisonnable."
 france_abbott_ast.5.b: "Ils peuvent les récupérer."
 france_abbott_ast.6.t: "Fin du bail de l’île"
 france_abbott_ast.6.d: "As the end of our lease on the New Caledonian islands approaches, France has requested we return the islands and remove our troops currently stationed there."
 france_abbott_ast.6.a: "Une demande raisonnable."
 france_abbott_ast.6.b: "Ils sont à NOUS maintenant."
 france_abbott_ast.7.t: "Les îles de Nouvelle-Calédonie restituées"
 france_abbott_ast.7.d: "L'Australie a promptement rendu les îles louées et nous a remerciés de manière coutumière pour leur usage."
 france_abbott_ast.7.a: "Une transaction fructueuse."
 france_abbott_ast.8.t: "L'Australie refuse de céder les îles"
 france_abbott_ast.8.d: "In what can only be described as unwieldy arrogance, the Australian government has refused to relinquish the islands. They've even refused to pay for a lease extension, effectively illegally occupying the islands. While a diplomatic dispute bordering on military intervention would be out of the question, we will have to protest the occupation on the global stage."
 france_abbott_ast.8.a: "C'est scandaleux !"
 middlepower_abbott.1.t: "L'Australie cherche une alliance"
 middlepower_abbott.1.d: "Une offre de sécurité mutuelle nous est parvenue d'Australie, dont les détails déclencheraient un appel à la guerre si un conflit éclatait entre l'un de nous et la Chine. Le cœur de la proposition est une tentative d'isoler la Chine et de contenir sa sphère d'influence dans le Pacifique.  \n\nL'accord n'inclut toutefois pas la Corée du Nord, et pourrait nous mettre une cible dans le dos vu notre proximité avec la Chine. Malgré cela, l'Australie nous a assuré que le pacte n'a été créé que comme dissuasion."
 middlepower_abbott.1.a: "Une poursuite qui en vaut la peine."
 middlepower_abbott.1.b: "Ce n'est pas assez."
 middlepower_abbott.2.t: "Complications d'alliance"
 middlepower_abbott.2.d: "La Corée du Sud pousse pour plus d'assurances défensives concernant le traité, vu sa proximité avec la Corée du Nord alignée sur la Chine. Nous pouvons les rassurer avec des programmes d'entraînement de troupes et un soutien à la production, mais ce serait certainement coûteux. Notre choix dépend de la valeur que nous accordons au soutien coréen."
 middlepower_abbott.2.a: "Un traité modéré pour les faire entrer."
 middlepower_abbott.2.b: "Tout, absolument tout."
 middlepower_abbott.2.c: "C'est trop cher."
 middlepower_abbott.3.t: "L'Australie contre-offre une assistance de défense"
 middlepower_abbott.3.d: "Pour sauver le traité, les Australiens ont contre-offert un programme d'entraînement coopératif des troupes, et leurs experts pour aider notre production d'armes. C'est une offre substantielle, sans aucun doute. Ils espèrent clairement que nous acceptons."
 middlepower_abbott.3.a: "Nous accueillons leur soutien."
 middlepower_abbott.3.b: "Cela n'en vaut toujours pas la peine."
 middlepower_abbott.4.t: "L'Australie contre-offre une assistance substantielle"
 middlepower_abbott.4.d: "Pour sauver le traité, les Australiens ont contre-offert une offre très substantielle. Un vaste programme d'entraînement coopératif des troupes, et un soutien à la production d'armes, y compris des contrats d'assemblage d'usines, des prêts d'acquisition, et des experts techniques pour aider à la mise en œuvre. Ils y vont clairement à fond dans l'espoir que nous acceptons."
 middlepower_abbott.4.a: "Nous accueillons leur soutien."
 middlepower_abbott.4.b: "Cela n'en vaut toujours pas la peine."
 middlepower_abbott.5.t: "Le KAMAT entre en vigueur"
 middlepower_abbott.5.d: "À l'ambassade de Séoul, nos diplomates et ceux de la Corée du Sud ont signé le traité d'assurance mutuelle Corée-Australie, garantissant que nos deux nations se soutiendraient en cas de guerre menaçant la sécurité de ce pays. Nous sommes désormais plus alignés que jamais, et un autre pays est venu à notre soutien dans la bataille pour le Pacifique."
 middlepower_abbott.5.a: "Bienvenue à bord."
 middlepower_abbott.6.t: "Les négociations heurtent un mur"
 middlepower_abbott.6.d: "Les discussions entre nous et les Coréens semblent avoir échoué. Malgré un bon départ, ils se sont retirés pour leurs propres préoccupations de sécurité. Notre travail pour encager le dragon devra continuer sans eux."
 middlepower_abbott.6.a: "Le tigre coréen dort."
 abbott_china_occupation.1.t: "La stratégie du déni"
 abbott_china_occupation.1.d: "Dans la pièce sombre, Tony Abbott et le reste du cabinet de guerre regardaient l'écran lumineux couper entre des plans aériens, des images satellite et des films de surveillance de transports de troupes. Il faisait nuit et les images étaient saccadées, mais l'emblème de l'Armée populaire de libération était clair comme de l'eau de roche. L'ennemi avait touché terre. \n\nLe cœur d'Abbott a chuté. Il s'est reculé dans son fauteuil et a passé les paumes sur le front. Le reste de la pièce était silencieux, seulement rompu quand l'analyste a mis l'image en pause et commencé le briefing. Leur première priorité était de contrôler le récit, mais sans doute la vidéo circulait déjà en ligne, et cela s'annonçait comme le pire fiasco de défense nationale de l'histoire du pays. Désormais le combat serait en montée. \n\nUn silence gênant tandis que l'analyste s'arrêtait et attendait l'avis du PM. Le visage d'Abbott, tordu par la réflexion, mêlait sévérité et vide. Enfin il s'est tourné vers la pièce. « Écoutez, à ce stade c'est assez évident que euh, bon, merde arrive. »"
 abbott_china_occupation.1.a: "Dans ce cas, oui."
 abbott_shirtfronting_china.1.t: "Point de tension en mer"
 abbott_shirtfronting_china.1.d: "Des rapports sporadiques affluent de notre flotte en mer de Chine méridionale. Si la plupart des comptes sont lacunaires, et la situation encore floue, il semble y avoir eu une confrontation au haut-fond. \n\nAprès le déploiement de nos navires pour patrouiller le haut-fond de Scarborough, ils ont été confrontés à une flotte chinoise proche. Cette flotte a exigé que nos navires quittent la zone et, peu après notre refus, l'un des navires chinois a ouvert le feu. Il y a eu un échange momentané avant que les nôtres ne reculent. Deux de nos frégates ont été perdues, avec quatre tués jusqu'ici. \n\nComme nous l'apprenons en direct, il n'y a pas encore de réponse de la Chine. La balle est dans notre camp. Nous sommes sur le fil du rasoir."
 abbott_shirtfronting_china.1.a: "Obtenir une ligne directe avec Pékin."
 abbott_shirtfronting_china.1.b: "C'est une attaque flagrante. Nous ne pouvons pas montrer de faiblesse."
 abbott_shirtfronting_china.2.d: "A direct line has come through from the Australian [GetASTLeaderTitle] to discuss the matter unfolding in the South China Sea. While our reports are still coming through, it's apparent that a skirmish occurred between our fleet stationed there and an Australian patrol, occurring near the Scarborough Shoal. \n\nAccording to the report, one of our destroyers fired a warning shot over the Australian ships, which prompted the exchange. There's been three casualties so far, and the fleet has received minor damage. The Australians, however, appear to have lost two ships and may have lost five of their own. \n\nTheir leader is now demanding that we withdraw our ships from the area, and commit to deescalation talks. The audacity is certainly irritating, but the situation could turn into a nightmare on the world stage if we don't give concessions."
 abbott_shirtfronting_china.2.a: "N'importe quoi pour éviter une guerre."
 abbott_shirtfronting_china.2.b: "Le dragon ne s'agenouille pas avec les moutons."
 abbott_shirtfronting_tt: "Nous retirerons nos navires du haut-fond pour l'instant"
 abbott_shirtfronting_china.3.t: "Se retirer"
 abbott_shirtfronting_china.3.d: "Le gouvernement chinois a accepté de retirer ses navires de la région. Un instant, nos nations semblaient sur une voie inévitable vers la guerre, mais nous l'avons de justesse évitée. Si les tensions restent hautes, ils ont proposé d'envoyer une délégation à Canberra pour forger quelque chose de solide afin d'empêcher que cela se reproduise. Nous avons beaucoup souffert pour cela, mais c'est une petite victoire."
 abbott_shirtfronting_china.3.a: "Une autre guerre évitée."
 abbott_shirtfronting_china.4.t: "Silence"
 abbott_shirtfronting_china.4.d: "La ligne a cliqué et le son à l'autre bout s'est éteint. Les Chinois refusent de discuter de tout terme de désescalade, malgré qu'ils soient pleinement conscients de l'incident. Nous sommes à la croisée des chemins. Si la Chine poursuit ce niveau d'escalade incontestée, nous sommes essentiellement à un niveau de guerre sans riposter. D'un autre côté, il y a peu de retour en arrière d'une déclaration à blanc."
 abbott_shirtfronting_china.4.a: "Nous devons reculer."
 abbott_shirtfronting_china.4.b: "S'ils veulent la guerre..."
 call_japan_to_our_side_ast: "Appeler le Japon à nos côtés"
 call_kor_to_our_side_ast: "Appeler la Corée du Sud à nos côtés"
 call_roc_to_our_side_ast: "Appeler Taïwan à nos côtés"
 abbott_call_to_arms.1.t: "L'Australie nous appelle aux armes"
 abbott_call_to_arms.1.d: "Conformément à l'accord signé entre nos nations, en raison du conflit actuel entre eux et la Chine, l'Australie nous a appelés à honorer le pacte et à rejoindre le combat."
 abbott_call_to_arms.1.a: "À la guerre, alors."
 malcolm_abbott_event.4.t: "Dans la salle du Monkey Pod"
 malcolm_abbott_event.4.d: "Tony était assis dans la salle vide du Parlement, avec seulement le bourdonnement d'une ampoule mourante au-dessus pour lui tenir compagnie. Ses pensées s'attardaient sur son temps à Uluru, lors de sa première course de longue distance. Tout le voyage avait été agonisant. Tony n'était en aucune forme pour accepter le défi, et il a failli abandonner plus d'une fois, mais il ne s'était jamais senti plus libre qu'à cet instant. \n\nIl n'y avait rien autour de vous là-bas dans l'outback. Seulement le sifflement du buisson Witchiti dans le vent, et le soleil battant. Quand il a fini, cela avait marqué le début de son long amour des marathons et des épreuves « ironman ». La nature harassante des actes était devenue un test de caractère, et maintenant au pouvoir il y avait un niveau d'agonie similaire, mais le travail en valait toujours la peine. \n\nCette fois, toutefois, ce ne serait pas le cas. La course arrivait à sa fin. Tandis que tous les parlementaires libéraux entraient pour le vote, Tony serait battu 44 à 54. Malcolm Turnbull prenant les rênes comme nouveau chef. La politique nourrissait la déloyauté, mais cela restait un coup dans le dos. Il se consolait du fait que, fidèle à sa parole, il était devenu un perdant, pas un lâcheur."
 malcolm_abbott_event.4.a: "Le marathon était terminé."
 malcolm_abbott_event.5.t: "Malcolm Turnbull investi comme [GetASTLeaderTitle]"
 malcolm_abbott_event.5.d: "Sur la pelouse avant de Parliament House, Malcolm Turnbull a prononcé sa première allocution comme nouveau chef du Parti libéral, et PM, promettant des changements « étendus » pour faire advenir un « gouvernement du XXIe siècle ». Turnbull a annoncé un mélange de nouveaux venus et de vétérans du parti pour accompagner la transition, dont Scott Morrison et Christopher Pyne, attirant l'attention sur l'arrivée de cinq femmes supplémentaires au cabinet. \n\n« Nous devons être plus compétitifs, plus productifs et — plus innovants », a déclaré le nouveau [GetASTLeaderTitle], préparant le gouvernement à une direction plus technocratique. \n\nSi les plaies sont encore fraîches aux yeux des durs conservateurs du parti, la majorité a soutenu l'ascension de Turnbull, avec un premier coup de pouce aux sondages pour les Libéraux depuis le renversement."
 malcolm_abbott_event.5.a: "À l'avenir."
 aus_war_on_terror_abbott.1.t: "Un prétexte de guerre"
 aus_war_on_terror_abbott.1.d: "Tony wiped the sweat off his forehead and looked around the room of busy media personnel, all rushing around for the address. The lights they'd brought in were hideously hot, and Tony was hoping the whole thing could be over fast. In the last month there'd been too many press and intelligence meetings for his comfort, and now it was his job to sell the nation on it. \n\nThe teleprompter was wheeled forward and everyone went quiet. Tony cleared his throat. As he gave the address to the nation he would mention a name that the news media had been bombarding the public with for months. That name was Jemaah Islamiyah. \n\nJemaah Islamiyah was an Al-Qaeda linked terrorist network ASIS was confidently blaming for the Bali Bombings and the Embassy attack. They had hit us again and again, and when we finally found their hidey hole, the Indonesians refused our troops entry. In essence becoming 'harborers of terrorists' as Tony would claim. \n\nWhether the public fully believed or not was largely irrelevant. The decision was made before the address. This was simply laying track work."
 aus_war_on_terror_abbott.1.a: "« Il est temps de riposter. »"
 the_canberra_treaty_abbott.1.t: "Le traité de Canberra"
 the_canberra_treaty_abbott.1.d: "Après l'arrivée à Canberra, les termes du traité ont clarifié la démilitarisation des îles Spratleys, une limitation de notre production de flotte, et un accord de non-confrontation entre nous, l'Australie et les Philippines. Cela lisserait l'issue désastreuse de la rencontre de flottes, toutefois cela revient à une humiliation qui limite le mouvement dans notre propre territoire. \n\nSi le traité n'est que temporaire, il a le soutien de certains de nos grands partenaires commerciaux. Le retour de bâton d'un retrait serait substantiel."
 the_canberra_treaty_abbott.1.a: "Pour préserver la paix."
 the_canberra_treaty_abbott.1.b: "Ils rêvent s'ils croient que nous signerons."
 the_canberra_treaty_abbott.2.t: "Signer le traité"
 the_canberra_treaty_abbott.2.d: "Les délégués chinois et philippins sont arrivés à Canberra aux toutes premières heures pour précéder la réunion. Quand elle a commencé, on n'entendait qu'un bouillonnement silencieux entre eux. Le fait que les représentants chinois n'aient pas quitté la salle à la première vue du traité était bon signe. C'était une sorte de rituel d'humiliation pour eux, mais avec des répercussions trop hautes pour l'éviter. \n\nLe résultat final a été une démilitarisation convenue des eaux autour du haut-fond de Scarborough et des îles Spratleys. La Chine s'est aussi engagée à limiter sa production de flotte et ses opérations de patrouille, ainsi qu'un accord de non-confrontation. \n\nCe n'était pas le coup de grâce que nous aurions pu souhaiter, mais nous avons réussi aujourd'hui à briser l'illusion de la suprématie chinoise. Leur armure de porcelaine a été ébréchée, et la sphère chinoise contenue. Du moins pour l'instant."
 the_canberra_treaty_abbott.2.a: "La paix de notre temps !"
 the_canberra_treaty_abbott.3.t: "Les Chinois quittent la salle"
 the_canberra_treaty_abbott.3.d: "Dans un résultat peu surprenant, pendant l'exposé des termes du traité, les délégués chinois se sont simplement levés et ont quitté la salle de conférence. Nous savons qu'ils ont déjà atteint les aéroports pour rentrer. C'est audacieux, mais nous savions que les termes étaient risqués. \n\nCe n'était pas le KO que nous aurions pu souhaiter, et le départ a été un bel échec diplomatique, mais nous avons réussi aujourd'hui à briser l'illusion de la suprématie chinoise. Leur armure de porcelaine a été ébréchée, et la sphère chinoise a montré sa vulnérabilité. \n\nPour l'instant, les États-Unis, ainsi qu'une ribambelle d'autres nations, nous ont rejoints pour sanctionner la Chine en réponse."
 the_canberra_treaty_abbott.3.a: "Nous avons fait de notre mieux."
 starbucks_event_ast.1.t: "Difficulté à préparer"
 starbucks_event_ast.1.d: "Les draps opaques ont été levés des nouvelles tables brillantes, et les sièges déballés et installés. La sirène verte était arrivée dans les rues de Sydney, avec 87 magasins en fait déployés à travers la nation, et dès 5 h du matin il y avait déjà une file autour du pâté de maisons. Starbucks faisait partie de la récente vague de chaînes américaines de restauration rapide atterrissant dans le pays, et les gérants, venus aussi des États-Unis, étaient impatients de participer au lancement. \n\nQuand les portes se sont ouvertes, un flot de clients a inondé, avec des reporters pour documenter l'événement. Le magasin était bondé, puis, après quelques heures, il ne l'était plus. Quand la fête d'ouverture est partie, le magasin, comparé à la foule ebbante dehors, était étrangement vide. \n\nUne poignée de gens, surtout des touristes, entraient de temps en temps, mais pour l'essentiel c'était calme. Cela continuerait le reste de la semaine, puis, après quelques mois de sous-performance dans tout le pays, la plupart des magasins fermeraient."
 starbucks_event_ast.1.a: "Seuls les plus aptes survivent."
 econ_costello_events.1.t: "Terre rouge et feux de la rampe"
 econ_costello_events.1.d: "Tandis que Costello se tenait là sous le soleil battant, avec une odeur terrible dans l'air, et le dos trempé de sueur, il était dans son élément. \n\nLa tour géante derrière eux, pompant bruyamment du pétrole, était le décor de leur accord momentueux. La plupart des pièces avaient été expédiées des États-Unis et assemblées ici en moins d'un mois. Des dizaines d'autres comme elle seraient plantées à travers le Queensland et l'Australie-Méridionale. Lufkin Industries gérait toute l'opération, donc pas un sou ne venait de l'État. Pourtant nous en récolterions les fruits. \n\nLa poussière commençait à souffler et à coller à leurs costumes, aussi Costello et les représentants d'entreprise ont-ils rapidement clôturé la photo. Un nombre surprenant de sociétés frappaient à la porte maintenant que le gouvernement était vu comme ostensiblement pro-pétrole, et Lufkin n'était que la première. \n\nDans l'esprit de Peter, le charbon était devenu un atout si temporaire. Il gardait les lumières allumées, et les foyers au chaud, mais ce n'était pas le carburant qui faisait brûler le reste du monde. La prochaine ruée minière serait sur le pétrole."
 econ_costello_events.1.a: "Ce n'est que de bonnes affaires."
 econ_costello_events.2.t: "Boom des exportations"
 econ_costello_events.2.d: "À mesure que nos liens avec la Chine se sont resserrés, notre économie d'exportation a explosé. Les volumes commerciaux avec eux ont augmenté de façon notable en un temps relativement court, charbon et minerais critiques circulant entre nous à des taux historiques. Probablement pour encore quelques mois."
 econ_costello_events.2.a: "À nous le butin."
 econ_costello_events.3.t: "Une nuit à Pékin"
 econ_costello_events.3.d: "When Peter and the rest of the foreign cabinet arrived in Beijing, it'd been the first time he'd seen the city since the G20, and in those few years the cityscape was already vastly different. China's determination to bridge the gap economically had seen it practically soar past its neighbours, and its cities had become sprawls of imposing glass monoliths. Any piece of that growth Australia could get was a bonus. \n\nA short car ride delivered them from the airport to the 'Great Hall of the People.' A brutalist, almost soviet-esque building in Peter's eyes. Admittedly the city smog was less apparent than they'd expected, and there were curiously very few cars outside. \n\nThey got to the room where the foreign minister and the Chinese delegates were supposed to meet them, but almost two hours had passed and no one came. Finally an unkempt Alexander Downer came stumbling in. Huffing and straightening his tie, he apologised for the delay and the meeting finally kicked off. \n\nIt would amount to be the biggest single investment in the nation's history, and a godsend for our agricultural exports. A dozen companies would be setting up shop in our cities and suburbs, and jobs would flow down to the workers, orchestrated to target the areas in most need. As they shook hands and left, the trip had certainly been the strangest in Peter's memory."
 econ_costello_events.3.a: "Mais toujours le plus fructueux."
 econ_costello_events.4.t: "Le marché immobilier inondé d'argent sale"
 econ_costello_events.4.d: "Les tentatives du gouvernement de stimuler les ventes immobilières en séduisant les investisseurs chinois semblent avoir attrapé plus qu'une offre d'acheteurs empressés. La descente d'hier dans une tour récemment vendue à Perth a révélé un réseau de blanchiment et de financement illicite qui remonte jusqu'à la collecte de fonds du Parti libéral, l'un des investisseurs pincés s'étant révélé un donateur majeur du parti. \n\nDes groupes surveillant le réseau avant le coup de filet ont noté qu'il pourrait y avoir des dizaines d'acheteurs étrangers venant de Chine utilisant le marché immobilier pour contourner les restrictions de fuite des capitaux de Pékin. La réponse de la Chine a été une demande d'extradition immédiate pour les impliqués. Une réponse qui peut indiquer que le réchauffement des relations pourrait s'arrêter net."
 econ_costello_events.4.a: "Nul bon investissement ne reste impuni..."
 costello_in_the_mines.1.t: "Les sociétés minières contre-attaquent"
 costello_in_the_mines.1.d: "Avant même que l'enquête puisse être annoncée, la nouvelle a fuité vers les grandes sociétés minières qui nous lancent maintenant tout ce qu'elles peuvent pour ralentir la commission. Une douzaine de recours juridiques ont déjà été envoyés, et quelques mines ont déjà fermé en protestation. Pire, les médias semblent se joindre à elles. \n\nSans même une condamnation formelle, toute bienveillance que nous avions avec les mines s'est pratiquement évaporée, et certains magnats ont commencé à financer l'opposition et des partis plus nationalistes comme One Nation, laissant le parti dans une position gênante pour le financement futur. Nous avons bel et bien donné un coup de pied dans le nid de frelons."
 costello_in_the_mines.1.a: "La pourriture doit être arrachée à tout prix."
 costello_in_the_mines.2.t: "Résultats de l'enquête"
 costello_in_the_mines.2.d: "The commission has finally presented its findings to us and the result is startling. Across dozens of mines, particularly in the transport sectors, hundreds of workers have been found to be illegally hired. Some having even worked for the companies for years. The reaction from the mining corporations has expectedly remained quiet, and while the legal proceedings are underway we're left with the difficult decision of suddenly handling hundreds of new migrants in the country."
 costello_in_the_mines.2.a: "Une industrie trouble."
 costello_in_the_mines.3.t: "Gérer les travailleurs"
 costello_in_the_mines.3.d: "Over three hundred migrants have been found living in the country as a result of the investigation. Almost half of that number have been working in the mining sector for over two years. The media, and a few in our cabinet, are adamant that we use our current ability to deport them immediately. However, considering the training level of the migrants, we could grant temporary visas to allow for continued work. That would prevent any sudden loss of revenue for the mines, but it wouldn't be a popular move."
 costello_in_the_mines.3.a: "Expulsez-les."
 costello_in_the_mines.3.b: "Laissez-les rester."
 costello_in_the_mines.4.t: "Offres d'Arabie"
 costello_in_the_mines.4.d: "Le prince héritier et Premier ministre, [SAU.GetLeader], nous a directement approchés au sujet de la demande. Ils offrent un lourd investissement dans notre extraction actuelle de minerais critiques, en échange d'un assouplissement de certaines restrictions contre l'investissement de leur nation en Australie. Ils ont montré un intérêt particulier pour nos sports, et les laisser investir pourrait grandement accroître la portée de notre industrie du divertissement, bien que nous ouvrions la porte à un pays moins que scrutable."
 costello_in_the_mines.4.a: "Une offre équitable."
 costello_in_the_mines.4.b: "Ne nous approchons pas trop."
 costello_republic_events.1.t: "Escalader les murs du Sénat"
 costello_republic_events.1.d: "Contrairement à notre dernière tentative de faire passer la question républicaine au Parlement, les voix ne sont tout simplement pas en notre faveur jusqu'ici. Le dur Tony Abbott a de nouveau rejoint la foule anti-républicaine comme en 1999, agissant comme porte-parole pendant le Question Time et divisant effectivement le parti. Son aptitude à nous causer des problèmes dans les médias s'est aussi pleinement déployée, saisissant toute occasion de faire campagne contre nous. \n\nSi nous ne pouvons pas le faire passer au Sénat avant même de le mettre au référendum, nos chances sont mortes, et notre soutien limité restant au sein du parti commence à s'effriter. Il faudra peut-être chercher d'autres moyens de ramasser des voix."
 costello_republic_events.1.a: "Un chemin difficile nous attend."
 costello_republic_events_abbott_tt: "§YL'opposition travaillera contre nous désormais.§!"
 costello_republic_events.2.t: "Obtenir les voix"
 costello_republic_events.2.d: "Kevin Rudd était sans doute le politicien le plus mielleux du parlement. Howard le détestait, son propre parti ne semblait même pas l'aimer. D'une façon ou d'une autre il s'était faufilé jusqu'au sommet du Parti travailliste, et maintenant il était notre plus grand obstacle pour obtenir les voix. \n\nRudd avait demandé qu'ils se rencontrent dans l'un des cafés juste hors de Parliament House, probablement dans le but exprès de donner aux paparazzis à proximité l'occasion de le photographier avec le [GetASTLeaderTitle]. Tout pour se hisser et nous jeter de la boue. \n\nIl est arrivé en retard, comme d'habitude, et a insisté pour rester pour le repas. Crêpes au canard et steak, que diable c'est, ont été commandés, puis Rudd s'y est enfin mis. Le Labor essayait de faire passer sa nouvelle extension de Medicare, qui allait sans doute se faire descendre par notre parti. C'était du donnant-donnant au plus simple, et d'une poignée de main il nous donnerait les voix pour passer au Sénat et un peu de soutien. \n\nBien que le coût fût un peu dur à avaler."
 costello_republic_events.2.a: "Avons-nous le choix ?"
 costello_republic_events.3.t: "Assentiment non conventionnel"
 costello_republic_events.3.d: "En livrant la législation au gouverneur général, surprise, ils ont signé sans accroc. Ils semblent même impatients de nous aider, allant jusqu'à soutenir l'idée d'une république dans les médias. Maintenant que nous avons leur accord, nous pouvons envisager d'ajouter d'autres ajouts à la nouvelle constitution. Le travail n'est bien sûr pas fini. Il nous faudra encore le soutien du public avant de le renvoyer au Sénat. Contrairement à 1999, cette fois nous devons continuer à rallier le public et ne pas laisser l'élan mourir."
 costello_republic_events.3.a: "Let's get to it then."
 costello_republic_events.4.t: "Les Australiens abolissent la monarchie"
 costello_republic_events.4.d: "Des bannières vertes, jaunes et bleues ont parsemé Sydney et d'autres grandes villes aujourd'hui. Un effort du mouvement République d'Australie en anticipation des résultats du référendum. Tels qu'ils sont arrivés aujourd'hui, le vote a totalisé 63 % en faveur d'une république, quatre des cinq États requis la soutenant. Bien que la législation doive encore passer au Parlement avant d'être reconnue comme loi, le résultat a effectivement aboli le monarchisme australien. \n\nLe rôle du gouverneur général sera retiré, un nouveau drapeau devra être institué, et le titre de Premier ministre changera bientôt pour refléter le nouveau modèle de gouvernement. Les républicains ont passé le reste de la journée à célébrer dans les rues, et bien que le mouvement d'opposition n'ait pas réussi à garder le statu quo, leur chef, le politicien libéral Tony Abbott, a admis que le changement mettait l'Australie sur la voie d'un « avenir radieux »."
 costello_republic_events.4.a: "Enfin."
 costello_republic_events.4.b: "Un changement surprenant."
 costello_in_the_mines.5.t: "Une rencontre avec le magnat"
 costello_in_the_mines.5.d: "Getting a meeting with Rupert Murdoch wasn't hard. It so happened the Newscorp CEO had been contacting Peter's office regularly, and was eager to meet and discuss policy. Somehow it had been half a decade since they last spoke, but when they met again Rupert looked like he hadn't aged a day. \n\nMost knew that he was the head of newscorp, and half the newspapers with that, but few knew how many mining projects he was tied to. When Peter tried to broach the idea of a mining tax reform Rupert would swat it away each time. Getting the mogul's approval was supposed to kick things off, but the opportunity was quickly sinking. \n\nWhen they finally did get to the mines Rupert would go on and on about Geelong and blue collar voters. Peter's electorate was Geelong, so the point wasn't lost on him, but if he was going to salvage a point he needed to make it now. \n\n\"Surely after five years of growth a tax reform isn't that far reaching. There should be some kind of reward for the rest of us-\" \n\n\"Reward?\" Rupert hung on the word like it was a slur in the old man's mouth. \"I remember when the party used to oppose 'big government.' I'm sure you know what the party needs now.\" \n\nWith that end Rupert thanked him for his time and they made their goodbyes. It wasn't quite the stepping stone he'd hoped it would be, in fact Costello wasn't really sure what to make of the meeting at all. He could only hope he wasn't doing any worse than Howard."
 costello_in_the_mines.5.a: "Un sentiment de malaise."
 costello_republic_events.5.t: "Aube au Parlement"
 costello_republic_events.5.d: "With an energy that Costello could only imagine was last felt during federation, the entirety of Parliament House was in a state of jubilee. Streamers and banners were hanging from almost every work place. Half the building had been abandoned as politicians were either at the local pubs or celebrating in the dining areas. \n\nAs he had to push through a crowd grouped around a portable TV, he glimpsed what they were watching. A lightshow around the Harbor Bridge, with a fiery rendition of the new flag was hanging from it as the fireworks shot overhead. It was apparent that even the opposition was celebrating in some way or another. Our country had finally taken its next big leap. We had crawled out of our adolescence. \n\nThe ballroom was suitably extravagant for the occasion, and when Costello arrived and began sorting through his cards for the speech, he noticed a familiar face in the crowd. John Howard himself had shown up for the party. Costello couldn't help but take a step off the podium and walk to meet the former Prime Minister, his old partner. \n\nTheir hands clasped in a shake and Howard, with a weathered but proud look on his face, smiled."
 costello_republic_events.5.a: "\\"Bravo, mon pote. Bien joué.\\""
 commonwealth_games_ast.1.t: "Les Jeux du Commonwealth de [GetYear]"
 commonwealth_games_ast.1.d: "Plus de 5 000 athlètes de 71 pays, territoires et organismes se sont rassemblés à Melbourne, en Australie, pour concourir aux Jeux du Commonwealth cette année. Ouverture au même endroit que les Jeux olympiques d'été de 1956, et avec un certain nombre de spectacles dont un tram volant et le feu d'artifice central, 17 sports sont attendus. \n\nPour la première fois dans l'histoire des Jeux, le relais du bâton de la Reine a visité chaque nation et territoire du Commonwealth prenant part aux Jeux, un voyage de 180 000 km (112 500 miles). Démontrant l'engagement à long terme et les liens profonds entre les nations du Commonwealth."
 commonwealth_games_ast.1.a: "Nos valeurs partagées vivent dans le sport de compétition."
 commonwealth_games_ast.1.b: "Quel spectacle."
 costello_republic_events.6.t: "L'épaule à la roue"
 costello_republic_events.6.d: "Alexander Downer, the Prime Minister's deputy, reclined in his chair as Costello laid out his plans. Downer had a knack for poker faces. You never really knew what he was thinking until he opened his mouth, and Costello had picked him because he did so rarely, but this time he could see the surprise in his face. After the pitch Downer leaned forward and delivered the line that the PM was expecting. \"How do you know this won't be a repeat of '99?\" \n\nThe question had hung on Costello's head throughout the whole process. He couldn't be sure that they could avoid another failure like the 1999 referendum, or that they could even get it through the chambers again. None of it was guaranteed, but he had to try. \n\nAfter a short bout of arguing, Downer shrugged and agreed to help. They were stumbling into either uncharted territory, or an all-familiar quagmire. At the very least they were going down in this ship together. There was one thing Downer couldn't figure, however. \n\n\"Would I have to call you Prime Minister, or Mr President?\""
 costello_republic_events.6.a: "Et puis la dispute a continué."
 labor_factionalism.1.t: "Fractionnisme au Parti travailliste"
 labor_factionalism.1.d: "The Labor party may not be a coalition, but it does have its own factions. Two have the most say. On the left are the democratic socialists, advocating for socially progressive policies like the increase to welfare, strengthening medicare and economic intervention. Kevin Rudd more-or-less represents this side. On the other side is the more centrist variety. Many of them follow 'Third Way' economic principles; fiscally conservative programs that aim to give people a 'hand-up' not a 'hand-out,' and more prone to business interests. \n\nRepresenting the Labor Right is Julia Gillard, currently serving as the deputy [GetASTLeaderTitle]. While in the interests of the nation, Rudd and Gillard work steadily together on policy making, a silent agreement exists between them not to step on each other's toes. Angling too much one way or the other could strain the alliance, or even break the party entirely. \n\nDuring our campaigning we also made promises to enact the §YEmissions Trading Scheme§!, in line with our climate policy direction. We should ensure that we pass the scheme during our first term, lest the party begin to question our leadership."
 labor_factionalism.1.a: "Une tâche délicate."
 rudd_apology.1.t: "Des excuses nationales"
 rudd_apology.1.d: "Seulement quelques mois dans le nouveau mandat de Kevin Rudd, et le [GetASTLeaderTitle] s'est adressé à la nation avec des « excuses » officielles pour les torts historiques contre les Premiers Peuples d'Australie : les Aborigènes et les insulaires du détroit de Torrès. \n\nLe geste historique, fondé sur le rapport Bringing Them Home de 1997, a été présenté à Parliament House par le [GetASTLeaderTitle], et a depuis envoyé une onde émotionnelle à travers l'Australie. Les foules dans le Great Hall et sur les pelouses devant le Parlement ont applaudi. Plusieurs milliers de personnes se sont rassemblées sous la pluie pour regarder le discours momentueux dans les rues de Sydney. \nUn profond sentiment de soulagement et de guérison a été ressenti par la communauté, et beaucoup en elle saluent les efforts de Rudd pour corriger l'inaction des administrations précédentes."
 rudd_apology.1.a: "Il était temps."
 tackle_mining_oligarchy_ast.1.t: "Discuter des impôts"
 tackle_mining_oligarchy_ast.1.d: "Rudd détestait la marche de son bureau à celui de Ken. Les couloirs de Parliament House étaient d'un blanc plat comme un service d'hôpital, et cela évoquait un certain nombre de mauvais souvenirs à l'intérieur et à l'extérieur. Il a tapé à la porte juste sous la plaque nouvellement installée, « Ken Henry ». \n\nQuand il est entré, Ken était encore occupé à travailler sur la revue fiscale que le reste du comité appelait gracieusement la « Henry Review ». Ken n'avait que quelques années de plus que Rudd, mais il avait un air de vieille garde. Cela n'aidait pas qu'il ait tendance à distiller des conseils au nouveau [GetASTLeaderTitle] souvent. \n\nLa revue devait toucher aux profits miniers, et Rudd voulait tout savoir des détails. Tous deux ont discuté pendant de bonnes heures de l'idée de super-taxes et d'une mise en œuvre équitable avant que Ken ne jette l'éponge et rentre. Pas Rudd. Sa nuit ne faisait que commencer, mais il aurait besoin d'aide pour lancer la machine."
 tackle_mining_oligarchy_ast.1.a: "Quelqu'un qui connaît le jeu."
 tackle_mining_oligarchy_ast.2.t: "Pas de recul"
 tackle_mining_oligarchy_ast.2.d: "Une autre soirée tardive au Parlement pour Rudd se passait avec Wayne Swan. Swan était l'un du « gang des quatre » que les médias appelaient le cercle intérieur de Rudd. Les deux autres étaient Julia Gillard et Lindsay Tanner. \n\nKevin avait passé un bon moment sur le plan législatif, et il avait déjà rassemblé une équipe d'aides qui y travaillaient dans son bureau, mais Swan était crucial au succès du plan. Non seulement parce qu'il avait l'expérience de trésorier pour repérer ce que les autres pourraient manquer, mais il ajoutait de la validité à l'ensemble. Rudd semblait encore un peu un outsider politique. Personne ne questionnait les titres de Swan. \n\n« Tu t'attaques vraiment à l'épine dorsale de notre politique là. Beaucoup de nos gars sont soutenus par les mines. On fait ça et ils ne seront pas contents. Ils nous tomberont dessus avec tout ce qu'ils ont. Ça va être moche. » \n\n« On a connu pire, non ? » Kevin s'est nerveusement gratté le nez et a souri, mais Wayne n'a pas bronché. Il a juste regardé Kevin avec cet air inquiet, mais a néanmoins accepté d'aider. \n\nÀ un certain point, ils étaient tous dans le même bateau, et Kevin croyait que Wayne ne voudrait pas voir son administration couler. Ils navigueraient dans la tempête ensemble."
 tackle_mining_oligarchy_ast.2.a: "Cela n'était jamais censé être facile."
 pink_batts_ast.1.t: "Le fiasco des isolants roses"
 pink_batts_ast.1.d: "Il semble que le pire scénario se soit produit concernant notre programme d'isolation des foyers. Plus que quelques installations ont échoué à long terme, et pire, quatre ouvriers sont morts pendant l'installation. Trois par électrocution et un par hyperthermie. Une commission royale a déjà été demandée, et un important recours collectif des fournisseurs et installateurs qui semblent avoir subi des dommages financiers nous est parvenu. \n\nDire que c'est un désastre serait peut-être un euphémisme. Les retombées politiques seules ont le potentiel de nous faire sombrer. Il faudra cesser immédiatement le dispositif et suivre avec un programme de rappel."
 pink_batts_ast.1.a: "Comment cela a-t-il pu arriver ?"
 bob_brown_event.1.t: "L'éclectique Bob Brown"
 bob_brown_event.1.d: "Bob Brown était un homme curieux. Son activisme et son obsession pour l'environnement faisaient passer Rudd pour un industriel en comparaison, et les écolos l'adoraient pour ça. Il n'était pas surprenant qu'il soit le fondateur de facto du Parti des Verts. Plus d'une décennie plus tard, il était encore entièrement incontesté dans le parti. Au lieu de cela, ils le tenaient comme leur chef-affiche, ce qui frôlait un culte de la personnalité aux yeux de Rudd. \n\nBrown avait accepté de monter à la capitale pour déjeuner avec Rudd et discuter de la coopération, jusqu'ici légèrement antagoniste. À son arrivée, Brown était tout sourire, et s'est vite avancé pour une poignée de main. Ils déjeunaient dans l'un des cafés proches, les mettant malheureusement dehors à la merci du temps de Canberra, presque toujours affreux. Peut-être était-ce pourquoi tous les politiciens étaient grincheux. \n\nAu téléphone, le soutien des Verts semblait déjà dans la poche, mais quand Rudd a repris, Brown a simplement hoché la tête. Malgré l'ampleur déjà grande, il voulait qu'ils aillent plus loin, et chaque fois qu'il tentait de ramener le chef à la réalité de ce qui pouvait raisonnablement passer au Sénat, Brown ne cédait pas. \n\nQuel que soit le microcosme de levier que les Verts avaient, il l'utilisait maintenant, et cela commençait à user la patience de Rudd. Quand ils se sont enfin serré la main, Rudd a réalisé que le Labor irait grand ou rentrerait les mains vides."
 bob_brown_event.1.a: "Et il n'y avait pas de milieu."
 school_visit_rudd.1.t: "Une promenade à travers Coorparoo"
 school_visit_rudd.1.d: "Kevin and his entourage had rocked up to the school at midday to meet the principal, and get a tour of the place. Someone had evidently tipped off the press, because just as they entered a crowd of reporters poured in as well, and soon they were completely surrounded. \n\nThe usual questions piped out of the journalist's mouths: \"Is the government backpedalling on reform? Was the Labor failing their promise to be fiscally conservative?\" \n\nRudd tried his best to ignore them, and to get at least a word in with the principal about the renovations. They managed to shuffle out one of the doors and into the courtyard where the new basketball court had been built, and was doubling as the assembly hall. The new structure was nice and all, but a tad sore to the eyes when contrasted to the much older buildings beside it. \n\nThe plague of modern design had finally found Coorparoo State School. Yet the new upgrades would be a boon to schools like this, more so for the schools worse off. As they went in, a cordon of kids followed, and pushed past the reporters for question time. The [GetASTLeaderTitle] started it off. \n\n\"Well this is terrific being here. Put your hands up, what do you like best about this new hall?\" \n\n\"We can sit on seats,\" one student responded. \n\n \"You can sit on seats - that's a big difference!\""
 school_visit_rudd.1.a: "En effet, c'était le cas..."
 gayvote_rudd.1.t: "L'Australie vote OUI à l'égalité du mariage"
 gayvote_rudd.1.d: "Après que la légalisation du mariage entre personnes de même sexe a été mise à un référendum volontaire, 61,6 % des Australiens ont dit oui, donnant le feu vert à la loi pour passer à la Chambre et au Sénat. Avec une participation de 79,5 %, des millions ont voté pour décider du changement, et le passage de la loi devrait être ratifié dans les mois à venir, au grand bonheur des couples de même sexe du pays cherchant à se marier.\n\nLe ministre travailliste Bill Shorten était dans les foules à Sydney pour célébrer le changement, et a salué les efforts du [GetASTLeaderTitle], et du membre de l'opposition Malcolm Turnbull, pour avoir porté la législation. \n\n« Quelle journée formidable d'être Australien – que les deux côtés de l'hémicycle soient prêts au changement, et soutiennent la voix du public. »"
 gayvote_rudd.1.a: "L'amour gagne !"
 unite_the_nation_speech_ast.1.t: "Kevin Rudd s'adresse à la nation"
 unite_the_nation_speech_ast.1.d: "The new [GetASTLeaderTitle] has outlined a commitment to writing a \"new page\" in Australia's history, and one that aims to close the gap of inequality that currently exists across the nation. Plans for new social and economic programs were outlined, as Rudd announced they aimed to far exceed the accomplishments of the previous generation, after which personal stories from Australia's First Peoples were read out. \n\nThe [GetASTLeaderTitle] ended the speech by emphasising a closer partnership with Aboriginal and Torres Strait Islander peoples, to \"close the gap between promise and performance.\" \n\nSo far the speech has gone down well, although who can say how long this good will lasts without concrete change."
 unite_the_nation_speech_ast.1.a: "Je m'appelle Kevin, je viens du Queensland, et je suis là pour aider."
 something_to_give_ast.1.t: "Quelque chose à donner"
 something_to_give_ast.1.d: "La sonnerie de Centrelink a bourdonné de son téléphone tandis qu'elle arpentait le petit appartement. Elle était en attente depuis presque une heure pour un opérateur, mais à mesure que l'horloge approchait 17 h ses espoirs s'asséchaient. Elle sortait à peine des cours, mais si elle n'avait personne au téléphone cette fois, ce serait à recommencer demain. Le cycle semblait sans fin. \n\nEnfin le téléphone a craqué et une voix est passée. Elle n'a pas perdu de temps à déverser sa situation. Elle étudiait à temps plein et, sans chance de trouver du travail, ses factures s'empilaient. Même avec l'aide sociale, les versements ne suffisaient pas, et la peur de devoir déménager et abandonner devenait de plus en plus réelle. Il lui fallait juste un peu plus de temps. \n\nLa voix à l'autre bout était sympathique, bien qu'elle sonnât presque aussi fatiguée qu'elle, mais il semblait qu'elle ne remplissait rien. Elle a glissé le long du plan de travail jusqu'au sol. Il n'y avait pas d'issue. L'opérateur a demandé s'ils pouvaient la remettre en attente, et une fois de plus elle était seule. Elle était trop fatiguée pour pleurer, et cela ne changerait rien. C'était toujours comme ça. \n\nSoudain l'opérateur est revenu. Un nouveau dispositif avait été lancé seulement cette semaine, permettant aux bénéficiaires de demander des versements d'urgence. Les remboursements seraient prélevés sur les versements suivants par morceaux, et ce n'était pas grand-chose, mais cela couvrirait le loyer, et elle pourrait continuer à étudier. La nouvelle était écrasante. Après l'appel elle a sauté d'excitation, et des larmes ont commencé à couler sur ses joues."
 something_to_give_ast.1.a: "Un peu d'aide va loin."
 bill_of_rights_ast.1.t: "Faire passer le statut"
 bill_of_rights_ast.1.d: "Au bout du compte, les deux côtés de la Chambre et du Sénat se battaient bec et ongles pour nous empêcher de le faire passer. Nous avons dilué les choses à des niveaux appropriés, mais c'est déjà un début. Le « Commonwealth of Australia Human Rights Act », offrant des extensions à nos lois sur la liberté d'expression, le droit de réunion, un procès équitable, l'égalité devant la loi, la liberté de la torture, la liste continue. \n\nNon seulement nous mettons en œuvre le plus grand texte de droits civils de notre histoire, avec de larges protections pour les peuples aborigènes et insulaires du détroit de Torrès, mais c'est quelque chose qui posera le socle pour que toutes les générations futures d'Australiens soient protégées par la loi. \n\nPour l'instant il faut encore tout ratifier et commencer la mise en œuvre dans les mois à venir, mais cela ressemble certainement à un grand pas pour la maturité de notre nation."
 bill_of_rights_ast.1.a: "À ceux qui en goûteront les fruits."
 rudd_nz_deal.1.t: "En route vers Wellington"
 rudd_nz_deal.1.d: "Rudd was taking one of the early morning flights so as not to miss the view of the mountains from above. If there was anything the land of kiwis was beating Australia on, it was the scenery. Their foreign ministry loved to remind you that they filmed the Lord of the Rings there, and it wasn't a mystery why. The Trans-Tasman trade agreement he was there to sign was going to tie our economies practically together, which surprised Rudd that it hadn't been established earlier. \n\nThe Prime Minister, [NZL.GetLeader], was quick enough to be the first hand he shook getting off the plane, leading the talks into the airport's diplomacy lounge. Going over it together everything in the paperwork looked good; eliminating virtually all tariffs and trade barriers on goods and services, the usual. Now was the moment their Prime Minister was waiting for. \nThey suggested that the first act of the agreement be an investment into New Zealand's industrial centres by Australia, and went on to list the returns over the next few decades. It was all sound, but would it really be worth investing so much right away?"
 rudd_nz_deal.1.a: "Fine."
 rudd_nz_deal.1.b: "L'accord commercial suffit pour l'instant."
 rudd_visit_ast.1.t: "Approcher les Sud-Coréens"
 rudd_visit_ast.1.d: "After landing in the country, one of the first stops was a photo op at the memorial cemetery in Busan. Rudd was lucky enough to have never fought in any wars. None of the Australian ministers still serving were even around for the Korean War, and chief among his priorities was avoiding another such conflict. \n\nThe memorial was massive, and quite powerful up close. The entire cemetery was a garden, and almost every headstone had a flower or hedge. Flags from all over the world accompanied them. The South Koreans had the threat of war looming over their heads every day, so naturally they kept their allies very close. \n\nWhen they finally returned to the National Assembly, the South Korean President, [KOR.GetLeader], had responded positively to the idea of a pacific union but was forthright about the caveat. As usual, defensive assurances from us was the requirement, and they seemed fairly set in stone. They wanted to be sure that if North Korea ever threw a missile, we'd throw a missile, and if they sent a fleet, we'd have ours waiting. The idea certainly had its merits, but was it worth shaking up the status quo?"
 rudd_visit_ast.1.a: "Nous sommes dans le même bateau."
 rudd_visit_ast.1.b: "Le risque n'en vaut pas la peine."
 rudd_visit_ast.1.c: "« Nous sommes déjà avec vous. »"
 rudd_visit_ast.2.t: "Survoler Osaka"
 rudd_visit_ast.2.d: "Le Japon avait embrassé le nouvel ordre économique à grands pas. Leur course au sommet des classements de PIB dans les années 90 était très admirable, mais leurs villes étaient le vrai testament. Survoler Osaka, c'était comme regarder une douzaine de Times Square. Même nos villes les plus urbanisées ne leur arrivaient pas à la cheville, brillant comme une lettre d'amour néon au capitalisme. \n\nIls ont atterri à Tokyo et les délégations ont commencé. Les Japonais traitaient les pourparlers comme si le sujet venait d'être soulevé, et non discuté en long un mois plus tôt. Rudd se demandait s'ils temporisaient, mais ils ont fini par poser une exigence. \n\nTout prétexte à une union économique dans le Pacifique devait inclure des garanties que la Chine s'engagerait à cartographier ses territoires en mer. Leur habitude de construction d'îles et d'expansion de leur contrôle naval inquiétait les Japonais, qui croyaient que nous servant d'intermédiaire pourrait bien lancer les choses."
 rudd_visit_ast.2.a: "Nous présenterons les termes, rien de plus."
 rudd_visit_ast.3.t: "La réponse de Pékin"
 rudd_visit_ast.3.d: "Après un long vol de retour, Rudd ne pouvait s'empêcher de se sentir un peu vaincu. L'équipe chinoise de ministres des Affaires étrangères l'avait presque ri hors de la salle de conférence. Malgré des discussions qui allaient bien, Pékin était pessimiste sur le concept d'une union économique du Pacifique. Les mérites de l'ASEAN suffisaient actuellement, et [CHI.GetLeader] n'était pas disposé à négocier quoi que ce soit de nouveau avec les puissances voisines. \n\nSans être une perte totale, les pourparlers ont abouti à quelque chose au moins. L'équipe a longuement discuté d'un accord commercial plus ouvert entre nos nations, et nous en a proposé un nouveau. Le nouvel accord couvre une vaste gamme d'importations chinoises en échange d'un commerce pratiquement sans tarif sur notre charbon et autres exportations minérales. \n\nUne consolation acceptable pour l'échec des pourparlers."
 rudd_visit_ast.3.a: "Pas mal."
 rudd_visit_ast.4.t: "Fleurs de prunier"
 rudd_visit_ast.4.d: "The Chinese foreign minister has relayed to us that Beijing is open to renegotiating their territorial lines with Japan. This might just be a start, but the fact that they are receptive to the demand shows how far we've come. They've requested that we partake in the discussions as a sort of neutral observer, which no doubt will take some years. \n\nWe may be a while off from an actual Pacific Union, but the strides we've made to obtain peace in the pacific, even if temporary, can't be overstated. Beijing has also motioned at improving our existing trade agreement, tying our nations even closer together economically, along with promises of future naval defense talks."
 rudd_visit_ast.4.a: "La paix de notre temps"
 gillard_talk.1.t: "J'ai tiré sur le vice"
 gillard_talk.1.d: "Selon leurs réunions habituelles, Julia Gillard briefait Rudd sur son côté du gouvernement. Depuis sa prestation de serment comme vice-[GetASTLeaderTitle], Julia était en charge du « super ministère », le département de l'éducation, de l'emploi et des relations de travail réunis. C'était beaucoup à gérer, mais Rudd lui faisait confiance. En 8 ans de connaissance, elle lui avait paru l'une des politiciens les plus rusés de Canberra, et très capable. \n\nJulia avait commencé le briefing en informant Rudd des dernières plaintes des nombreuses entreprises qui se sentaient lésées par un gouvernement très favorable aux syndicats. Bien sûr, la plupart pouvait être ignorée, mais Julia insistait pour rester en bons termes avec elles. Jusqu'où nous irions avec nos politiques sociales importait peu, tant que nous ne déviions pas de notre stance actuelle pro-business. \n\nQuand elle a fini, Rudd sentait ses yeux le transpercer. Même en parlant casualement, il avait l'impression qu'elle l'analysait. Rudd a accepté d'envisager la recommandation et ils se sont quittés pour la journée, bien qu'il se demandât à quel point elle était sérieuse."
 gillard_talk.1.a: "Quelque chose à considérer."
 papua_talks_rudd.1.t: "Rénovations des centres de rétention"
 papua_talks_rudd.1.d: "Australia has offered to renovate the detention centres they constructed here in exchange for minor foreign grants. The centres have indeed begun to dwindle since they were almost entirely emptied out, and the effects on us will be very little. This seems to be in an effort to fix their ongoing immigration issues."
 papua_talks_rudd.1.a: "Fine."
 papua_talks_rudd.1.b: "Pas cette fois."
 papua_talks_rudd.2.t: "La Papouasie-Nouvelle-Guinée accepte les rénovations"
 papua_talks_rudd.2.d: "Malgré l'expiration du bail, le gouvernement de Port Moresby a accepté de nous laisser accès aux centres pour que les rénovations commencent. Cela devrait nous permettre de relocaliser les sauteurs de file en Papouasie-Nouvelle-Guinée, et d'espérer dissuader de futurs atterrissages sur notre sol."
 papua_talks_rudd.2.a: "Comme prévu."
 papua_talks_rudd.3.t: "La Papouasie refuse les pourparlers"
 papua_talks_rudd.3.d: "Malgré l'offre de compensation financière, le gouvernement de Port Moresby a refusé toute discussion sur la rénovation des centres de rétention. Ils semblent bloqués sur la moralité de l'ensemble. Nous devrons maintenant continuer à héberger les demandeurs d'asile ici."
 papua_talks_rudd.3.a: "Une déception inattendue"
 address_the_tiger_event_ast.1.t: "Négocier la paix au Bharat"
 address_the_tiger_event_ast.1.d: "The talks with India have been predetermined since the beginning of Kevin Rudd's term, or even before that. Our strategic goals for the Pacific are well aligned, and they've been eager to work alongside the ADF in fine tuning their army. Now we simply had to introduce the idea of working with China. \n\nIn New Delhi the red carpet was truly rolled out. [RAJ.GetLeader] was perhaps making a bigger deal out of the thing than Rudd expected, after all, most of their communications were handled by the phone on his desk. The official state visit was merely a spectacle, but an enjoyable one surely. \n\nWhen they assembled in Hyderabad House to discuss the deal the military partnership was immediately scoped out, and of course they were in agreement. Then the real negotiations began. As soon as China was mentioned the tone in the conference room shifted. You would have found a more appeasable crowd with the Taiwanese delegation on the topic of China than here. \n\nRudd tried his best to ease them into it over the next few hours, but the best he could get was a promise of considering the economic union 'once the other countries had agreed to work with China,' which was basically a no. Although, officially Rudd would say he had brought them to the table."
 address_the_tiger_event_ast.1.a: "Et cela suffisait."
 legislation_rudd_blocked.1.t: "Législation bloquée au Sénat"
 legislation_rudd_blocked.1.d: "It seems that the entire Liberal party is standing against our passage. They're throwing everything in the book at us, and have even wrangled a number of independents to their cause. We won't be able to pass the bill like this, and unless we can shore up the support we need during resubmission, the legislation is dead in the Senate. \n\nTypically we'll need to wait 3 months before it can be sent through again. During that time we could use our reach to secure more votes and obtain a majority, as unlikely as it seems. We might not be able to approach the Liberals, but the Greens could be amenable to our reforms if we haven't already brought them on board, and the Independent members could go either way."
 legislation_rudd_blocked.1.a: "Adieu le bipartisme..."
 legislation_rudd_blocked.2.t: "Le second vote"
 legislation_rudd_blocked.2.d.a: "Malgré nos efforts, la majorité libérale tient encore bon. En dépit de tous leurs retards procéduraux et exigences d'amendements, nous avons tout de même atteint le stade du vote, pendant lequel nous avons perdu 34-42. Il semble que tous les indépendants se soient alignés sur les Libéraux, et les Verts n'ont pas été assez séduits pour voter avec nous. \n\nNous ne sommes toutefois pas complètement à court d'options. Nous pourrions demander une double dissolution, dissolvant la Chambre et le Sénat et déclenchant une élection anticipée. C'est une manœuvre très risquée, qui porterait le risque de perdre des sièges si le timing n'est pas bon. Ce pourrait aussi être le seul moyen d'obtenir les sièges nécessaires à une majorité. \n\nCela n'a pas été déclenché depuis 1987, et Gillard nous l'a fortement déconseillé. Nous pourrions toujours attendre la prochaine élection. L'option reste toutefois disponible si nous voulons le faire passer avant."
 legislation_rudd_blocked.2.d.b: "Malgré nos efforts, la majorité libérale tient encore bon au Sénat. En dépit de tous leurs retards procéduraux et exigences d'amendements, nous avons tout de même atteint le stade du vote, pendant lequel nous avons perdu de justesse 37-39, grâce au soutien des Verts. Il semble que tous les indépendants se soient alignés sur les Libéraux. \n\nNous ne sommes toutefois pas complètement à court d'options. Nous pourrions demander une double dissolution, dissolvant la Chambre et le Sénat et déclenchant une élection anticipée. C'est une manœuvre très risquée, et actuellement nous sommes en baisse de quelques points par rapport à l'élection précédente. Entrer dans une autre élection si tôt pourrait nous faire perdre le Premier ministère. Ce pourrait aussi être notre seul moyen d'obtenir une majorité. \n\nCela n'a pas été déclenché depuis 1987, et Gillard nous l'a fortement déconseillé, suggérant d'attendre notre prochain mandat. L'option reste toutefois disponible si nous voulons le faire passer maintenant, tant que nous avons l'élan."
 legislation_rudd_blocked.2.a: "Il est temps d'agir."
 legislation_rudd_blocked.2.b: "C'est trop risqué."
 legislation_rudd_blocked.3.t: "La double dissolution"
 legislation_rudd_blocked.3.d: "Now that the dominos have fallen and the dissolution has been triggered, an early election will be scheduled. With the first hurdle down, we need to focus on the campaign. Our party is going steady in the polls, but the Liberals could swing the public if we let them. Right now they're led by Tony Abbott, one of our more staunch critics. He hasn't held any punches so far, so we shouldn't refrain from hitting back. \n\nWith 60 days till election day, we'll need to keep the country in check and keep up our campaigning if we're aiming to pull ahead."
 legislation_rudd_blocked.3.a: "La pression monte."
 legislation_rudd_blocked.4.t: "Victoire"
 legislation_rudd_blocked.4.d.a: "Rudd s'est laissé tomber dans son fauteuil et a poussé un soupir de soulagement. La législation est passée. C'était enfin fini. Le reste du Parti travailliste et les Verts ont éclaté en applaudissements. L'autre côté de l'hémicycle semblait plutôt rester assis, les bras croisés, mais au premier rang Rudd a aperçu Malcolm Turnbull qui le regardait droit, et il aurait juré que Malcolm souriait. \n\nIl a senti une tape dans le dos, et en se tournant il a vu Gillard lui sourire. Même elle devait admettre que c'était un accomplissement pour le parti. Le parti faisait enfin quelque chose de vraiment grand, et la brèche qu'ils faisaient dans le sans-abrisme voudrait vraiment dire quelque chose. Le Labor était enfin devenu le parti de la réforme. Cela ne durerait peut-être pas, mais aujourd'hui ils avaient gagné la première bataille. \n\nIl s'est essuyé la sueur du front et s'est levé pour applaudir avec le parti. Il était temps d'en profiter tant que ça durait."
 legislation_rudd_blocked.4.d.b: "Rudd s'est laissé tomber dans son fauteuil et a poussé un soupir de soulagement. La législation est passée. C'était enfin fini. Le reste du Parti travailliste et les Verts ont éclaté en applaudissements. L'autre côté de l'hémicycle semblait plutôt rester assis, les bras croisés, mais au premier rang Rudd a aperçu Malcolm Turnbull qui le regardait droit, et il aurait juré que Malcolm souriait. \n\nIl a senti une tape dans le dos, et en se tournant il a vu Gillard lui sourire. Même elle devait admettre que c'était un accomplissement pour le parti. Combien d'années les sociétés minières avaient-elles rendu impossible toute vraie réforme, et pourtant maintenant elles paieraient leur dû. Sans doute les campagnes de dénigrement continueraient quelques mois, mais aujourd'hui il avait gagné la première bataille. \n\nIl s'est essuyé la sueur du front et s'est levé pour applaudir avec le parti. Il était temps d'en profiter tant que ça durait."
 legislation_rudd_blocked.4.d.c: "Rudd s'est laissé tomber dans son fauteuil et a poussé un soupir de soulagement. La législation est passée. C'était enfin fini. Le reste du Parti travailliste et les Verts ont éclaté en applaudissements. L'autre côté de l'hémicycle semblait plutôt rester assis, les bras croisés, mais au premier rang Rudd a aperçu Malcolm Turnbull qui le regardait droit, et il aurait juré que Malcolm souriait. \n\nIl a senti une tape dans le dos, et en se tournant il a vu Gillard lui sourire. Même elle devait admettre que c'était un accomplissement pour le parti. Le Labor tenait ses promesses. L'Australie serait le pays à monter au créneau quand aucun autre ne le ferait. Les générations futures seraient sécurisées grâce à nous. \n\nIl s'est essuyé la sueur du front et s'est levé pour applaudir avec le parti. Il était temps d'en profiter tant que ça durait."
 legislation_rudd_blocked.4.a: "Bien mérité."
 approach_parties_rudd.1.t: "Approcher les Libéraux"
 approach_parties_rudd.1.d: "Le Parti libéral et les Nationals sont actuellement engagés dans une stratégie de « non sans exception », apparemment en protestation de notre manque d'inclusion dans la planification. S'ils avaient leur mot à dire, le projet serait vidé de sa substance. Quoi qu'il en soit, ils refusent de travailler sur tout amendement maintenant."
 approach_parties_rudd.1.a: "On ne peut pas tout gagner."
 approach_parties_rudd.2.t: "Apaiser les Verts"
 approach_parties_rudd.2.d: "Le seul problème pour embarquer les Verts, c'étaient leurs exigences. Pour un si petit parti, leur aptitude à nous causer des problèmes ne pouvait être sous-estimée. Si nous ne négociions pas, ils voteraient contre en protestation, et ils insistaient pour durcir un projet déjà controversé. En usant de tout ce que nous avions dans nos manches pour quelques compromis, ils ont accepté de soutenir essentiellement le même projet, avec quelques ajouts mineurs."
 approach_parties_rudd.2.a: "Espérons qu'ils tiennent parole."
 approach_parties_rudd.3.t: "Les outsiders"
 approach_parties_rudd.3.d: "Both the senator from the Democratic Labour Party and the independent, Nick Xenophon, were hard sells on the bill. Nick has been especially critical of our administration since the beginning, and both of their voting history has been mostly Liberals sided, but after promising to work on future amendments with them they've agreed to back the bill."
 approach_parties_rudd.3.a: "Excellent."
 mad_katter_ast.1.t: "Le fou Katter"
 mad_katter_ast.1.d: "Bob Katter was the de facto king of northern Queensland, having served for almost 20 years as their representative. He was a firebrand politician by every meaning of the word, and particularly in no way ordinary. Not the way he dressed, nor his opinions, and especially not the way he spoke. If Katter caught your ear you'd be on a journey, with no sure way of knowing where it'd go. \n\nThey had started the meeting with the pretence of collaborating on a new bill, but Katter had gone on a tangent about the plight of farmers and the importation of bananas. He eventually got quite emotional, to which Rudd had to rein him in. He was clearly very passionate about the human cost of the ongoing droughts. \n\nRudd couldn't decide if the man was a socialist or a conservative, or maybe a strange mix of the two. Either way they were going to figure out something to help the farmers."
 mad_katter_ast.1.a: "C'est le moins que l'on puisse faire."
 whispers_in_the_crowd_ast.1.t: "Chuchotements dans la foule"
 whispers_in_the_crowd_ast.1.d: "By now Kevin Rudd was used to the nature of Parliament House. How the status quo was decided in an afternoon, and nothing stayed permanent. Now that things were in full swing he felt comfortable with the pace the government was making, however, something had changed between now and when he was sworn in, and it was beginning to wear on him. \n\nHe seemed to get along with almost everyone in his cabinet, but occasionally he had the feeling that their goodwill was waning. Where before they took his orders with strides, now more frequently, they were second-guessing him. He was having to explain his reasoning more and more, and it pulled the direction of his policy into question. \n\nWas he being paranoid? Possibly. Perhaps it was everything going on that was weighing on them. Besides, he still trusted his cabinet to keep the party going. \n\nRudd shrugged it off and continued with his work. It was probably nothing."
 whispers_in_the_crowd_ast.1.a: "Ou l'était-ce ?"
 mining_smear_campaign_ast.1.t: "La campagne médiatique"
 mining_smear_campaign_ast.1.d: "La campagne de dénigrement médiatique bat son plein maintenant que les grandes sociétés minières ont découvert ce que nous préparons. Des dizaines de publicités différentes inondent chaque chaîne et fréquence. Des banderoles au bord des routes. Au lieu de payer leur dû, elles déversent des millions pour défigurer notre gouvernement. Tout n'accroche pas, mais quand ça accroche, cela nuit à notre capacité de gouverner, et la perception publique décline. \n\nLa coalition est déjà montée dans le wagon pour nous critiquer. Si nous ne faisons rien pour calmer ça bientôt, les choses n'iront qu'en empirant."
 mining_smear_campaign_ast.1.a: "Pas terrible."
 corruption_outcome_aus.1.t: "La main dans le pot"
 corruption_outcome_aus.1.d: "Le résultat de nos récentes enquêtes de parti a livré assez de munitions pour écarter l'influence étrangère du parti pour de bon, ou du moins pour l'instant. Toutefois, quelques constats sans lien avec les ingérences de groupes d'intérêt sont sortis, et cela peint notre parti sous un mauvais jour. \n\nRien n'est encore lié à nous, mais c'est assez pour perdre un peu de crédibilité aux yeux du public. Il faudra garder le nez propre à l'avenir, jusqu'à ce que nous soyons hors des projecteurs."
 corruption_outcome_aus.1.a: "Oops!"
 aus_gillard_overthrow.1.t: "Un coup à la porte"
 aus_gillard_overthrow.1.d: "Rudd was going through the usual paperwork in his office when a knock rang from the door. He recognised the pattern, and so he called in Julia Gillard, who entered in a slow but deliberate way. As opposed to their usual routine she remained standing, and as Rudd looked up at her she delivered the news. \n\nTo Rudd it felt as though the office walls around them were falling inwards. As she continued on his world was collapsing, and all he could do was watch in shock as she was delivering the dagger. Gillard was going to trigger a leadership challenge. He couldn't believe it, his own running mate overthrowing him, let alone someone he considered a friend. The worst wasn't over. She was demanding his resignation. \n\nHe had already been overthrown in all but writing, but she was offering him the option of saving face and avoiding the process in Parliament. As she listed all the cabinet members backing her Rudd realised every ally he had she'd flipped. He was alone in the party now."
 aus_gillard_overthrow.1.a: "C'était fini."
 aus_gillard_overthrow.2.t: "Dawn"
 aus_gillard_overthrow.2.d: "Les caméras entouraient le podium extérieur, attendant l'annonce. À présent tout le monde savait ce qui se passait. Toute nouvelle sortant du Parlement voyageait vite, et c'était un coup en préparation depuis un bon moment. Dès le lendemain matin c'était déjà fini, et tandis que les reporters attendaient maladroitement le moment, les portes se sont enfin ouvertes et le [GetASTLeaderTitle] est sorti avec sa famille. \n\n« J'ai été élu par le peuple australien comme [GetASTLeaderTitle] de ce pays pour ramener une chance équitable pour tous les Australiens et j'ai donné mon meilleur absolu pour cela, j'y ai mis tout ce que j'avais. Dans cet esprit, je suis fier des accomplissements que nous avons livrés pour rendre ce pays plus juste. » \n\nSes yeux commençaient déjà à s'embuer. Peut-être Rudd était-il le bon [GetASTLeaderTitle] au mauvais moment. Il y avait peu qu'il eût pu faire pour éviter ce qui s'annonçait comme une porte tournante de parti, où les renversements devenaient une triste norme. \n\n « Ça a été deux ans et demi très chargés. Nous y avons mis tout ce que nous avions et je crois que, quand nous regarderons en arrière, ces réformes dureront dans l'avenir et rendront l'Australie, je le crois, un lieu plus juste et meilleur qu'elle n'aurait été autrement. » \n\nIl y a eu des applaudissements avant que Rudd ne salue. Il ne pouvait qu'espérer avoir raison, et que son travail pour changer les choses tienne."
 aus_gillard_overthrow.2.a: "Au revoir mon doux prince."
 the_new_look_rudd.1.t: "Le nouveau look"
 the_new_look_rudd.1.d: "As the hum of election season began to creep back into his day to day, Rudd found he had much less time to focus on his own grooming. It wasn't unlikely that he found himself staying overnight in Parliament, going over proposals and the usual, only to be out on the campaign trail the next day. \n\nToday he was quite a way out of the capital and in his own electorate of Griffith, Queensland. While the sun was barely out he was already going over notes, and appreciating the quiet before everyone was up. A rarity in recent days. As if on cue, however, the calm was broken, and the fly screen door into the campervan swung open to reveal a huffing Anthony Albanese. \n\nAnthony was a portly, sort of clumsy man, yet it wasn't that long ago that the two of them were at each other's throats for leadership of the party, and Rudd made sure never to forget it. Anthony stumbled in and propped a coffee on the table beside Rudd, who thanked him with a nod. \n\n\"Geez you're looking gruff.\" He gestured at Rudd's chin. Rudd touched it and realised he hadn't shaved in two or three days, and his white stubble had grown into a beard. \n\n\"It seems I am. How do I look?\" \n\n\"I mean it's not bad. Might be a surprise to the voters.\" Anthony said with a chuckle. \n\n\"Hmm. I suppose I don't want to be looking disheveled.\" \n\n\"I don't know. Maybe they'll like it.\""
 the_new_look_rudd.1.a: "Alors je le garde."
 the_new_look_rudd.1.b: "L'heure de se raser."
 rudd_the_next_leader.1.t: "L'avenir du parti"
 rudd_the_next_leader.1.d: "There comes a time in any leader's life when they must think of the next generation. Julia Gillard was not so much a younger generation compared to Rudd, but she may very well be the future of the party. Under the agreement they made going into the 2007 election, Rudd had promised Gillard that at some point he'd step down, letting her run after him. \n\nThe responsibility was heavy for Rudd, but Gillard hadn't let him down yet. She was the business side of the party. It seemed uncommon that her concerns of budget deficits and economic growth weren't voiced, and her plans for a national mining overhaul had piqued Rudd's interest. She clearly cared enough. Whether she was fit for the job or not, at some point Rudd would need to decide."
 rudd_the_next_leader.1.a: "Quelque chose à considérer."
 rudd_the_next_leader.1.b: "Jamais !"
 rudd_the_next_leader.2.t: "Démissionner"
 rudd_the_next_leader.2.d: "« Ce pays, qui peut gérer ses différences politiques pacifiquement, et résoudre notre politique pacifiquement et avec civilité, voilà pourquoi ce pays est un si grand pays. Que dans cette merveilleuse tapisserie de l'Australie moderne, la mosaïque de notre nation multiculturelle, ce qui forge une telle unité hors de la diversité, là réside le grand miracle australien. » \n\n« Le peuple australien, je le crois, mérite un nouveau départ avec notre leadership. Je sais que ce ne sera pas une nouvelle bienvenue pour certains d'entre vous, mais ma responsabilité a été de maintenir le Labor comme une force combative pour l'avenir, afin que nous puissions nous unir derrière le prochain chef de notre parti, Julia. » \n\n« Alors, amis, vous n'entendrez pas ma voix dans les affaires publiques de la nation pendant quelque temps. » \n\n« J'ai eu l'honneur de servir comme votre [GetASTLeaderTitle] et comme chef de votre parti, mais il vient un moment où l'on sait qu'on a tout donné, et un moment pour que le parti renouvelle encore son leadership pour l'avenir. »"
 rudd_the_next_leader.2.a: "« Pour moi, ce moment, c'est maintenant. »"
 rudd_campaigning_round_two.1.t: "Tourner en rond au palais des congrès"
 rudd_campaigning_round_two.1.d: "As Rudd walked down the aisle of the Labor National Conference the crowd was hitting a fever pitch. Even party veteran Paul Keating was there to cheer him on, giving the event a dream-like feeling. It was as if he never left. The past few years had simply been a bad dream and now he had awoken to the applause of his colleagues. The same that had applauded his downfall. \n\nIt was odd how fickle politics was. You were always on a knife's edge with the public, and even the people in your own party. Yet he still shook their hands if it meant getting their support for the next election. It was all far too close to get comfortable. \n\nHe would need to pull off a miracle to get another term, but it was far from over, and Rudd would give it his all."
 rudd_campaigning_round_two.1.a: "Nous sommes de retour, et nous restons."
 gillard_gov_event.1.t: "Une nouvelle direction"
 gillard_gov_event.1.d: "In the tight conference room Julia Gillard gave her first press talk as [GetASTLeaderTitle]. The reporters and fellow politicians had all gathered to hear her speak, and waited with bated breath for the mandate she was about to unveil. The weight was truly on her now. Months of work to arrive at this exact position, all the cards had to be carefully stacked and the cabinet members courted into giving their support. All to get right here. \n\nGillard was now one of the most powerful women in the world, and yet her position never felt more precarious. Any fault she made would be scrutinized and mulled over for days by the opposition or the media, or really anyone that felt she didn't have the fortitude to take up the position of her peers. Every step needed to be made carefully. \n\nPassing any reasonable policy was to be put on the backburner until the election could be called, which was to be soon. Until then she'd have to look the part, and hope that the public believed that she could do the job."
 gillard_gov_event.1.a: "Des questions ?"
 papua_residency_ast.1.t: "Offre de pacte économique de l'Australie"
 papua_residency_ast.1.d: "Dans un effort pour renforcer les liens économiques régionaux, le gouvernement australien a proposé un accord commercial « sans tarif ». La proposition inclut des restrictions allégées sur nos biens et services en échange de droits minéraux mutuellement exclusifs. Nos deux nations ont beaucoup à gagner du flux accru de biens entre nous ; toutefois, le choix reste le nôtre."
 papua_residency_ast.1.a: "Pour eux, bien sûr !"
 papua_residency_ast.1.b: "Non merci."
 papua_residency_ast.2.t: "Intégration économique de la Papouasie"
 papua_residency_ast.2.d: "La Papouasie-Nouvelle-Guinée a accepté le pacte proposé pour lier nos économies par le commerce. Les négociations sont en cours de finalisation, permettant un commerce sans tarif sur les biens et services papous, des investissements simplifiés et des droits de ressources prioritaires des deux côtés. L'Océanie est un pas plus près de devenir une union économique régionale."
 papua_residency_ast.2.a: "Excellent."
 papua_residency_ast.3.t: "Échec de la connexion avec la Papouasie"
 papua_residency_ast.3.d: "La Papouasie-Nouvelle-Guinée a malheureusement refusé le pacte, et préfère garder nos relations commerciales actuelles."
 papua_residency_ast.3.a: "Décevant."
 indo_ast_trade_deal.1.t: "L'Australie propose un accord commercial"
 indo_ast_trade_deal.1.d: "Dans un effort pour réchauffer nos relations froides, l'Australie a proposé un accord de libre-échange avec la promesse d'une coopération militaire à l'avenir. Pour l'instant l'accord assurerait une transition fluide des biens et services avec nous, très probablement un atout économique, mais l'accord militaire est plutôt ouvert."
 indo_ast_trade_deal.1.a: "Une proposition juste."
 indo_ast_trade_deal.1.b: "Non merci."
 indo_ast_trade_deal.2.t: "Bonnes nouvelles de Rudd"
 indo_ast_trade_deal.2.d: "Kevin Rudd est rentré d'Indonésie avec des résultats favorables. L'Indonésie a réagi positivement à un accord de libre-échange à condition que notre ADF s'engage dans des efforts de sécurité conjoints. Nous avons déjà travaillé sur des efforts antiterroristes aux côtés des Indonésiens, donc ce ne serait rien de nouveau, et la demande a été laissée volontairement ouverte, nous permettant de définir les engagements à l'avenir. Pour l'instant l'accord donnera un bel élan au commerce entre nos nations."
 indo_ast_trade_deal.2.a: "Splendide."
 indo_ast_trade_deal.3.t: "L'Indonésie refuse l'offre commerciale"
 indo_ast_trade_deal.3.d: "The government in Jakarta has unfortunately refused the pact, responding coldly to Rudd's efforts, and has preferred to keep our current trade relations going."
 indo_ast_trade_deal.3.a: "Pas terrible, mais peut-être attendu."
 forming_government_gil.1.t: "Choisissez votre poison"
 forming_government_gil.1.d: "The results of the election have made it abundantly clear that we need to form a coalition government if we want to stay in the job. Right now the opposition is moving quickly to grab their own seats from the House. The left faction of the party has encouraged us to seek a pact with the Greens. We've worked with them before, and they seem willing, but some of our conservative members are iffy on going that far, and more than likely the Greens will put forward some demands of their own. \n\nOn the other hand a number of Liberal defectors have approached us with support for some of our agenda, and are willing to join us in a coalition. With ex-Liberal support we may come off as more bi-partisan to the general populace. Considering the results of the election, appearing more in the middle might not be a bad choice."
 forming_government_gil.1.a: "Aller avec les Verts"
 forming_government_gil.1.b: "Ce sera une coalition libérale-travailliste."
 gillard_gov_event.2.t: "Remplir le cabinet"
 gillard_gov_event.2.d: "The cabinet was sizing up to be quite the competent group of Labor's finest, at least in Julia's eyes, and more important the loyal variety. Wayne Swan, the new deputy [GetASTLeaderTitle], had agreed to meet with Gillard to discuss forming the foreign ministry. \n\nWhen they met in her office, Gillard explained that she was much keener to focus on the domestic issues of the nation, and allow the foreign ministry to manage of their own accord. Together they went over the options and there were two obvious options. Stephen Smith was the first to offer his services to the new [GetASTLeaderTitle], having previously served under Keating, and had remained a loyal Laborite since. Swan was confident that Smith would toe the party line and more or less keep us on the straight path. \n\nThe other option was Bob Carr. Carr had actually been out of parliament for some time working as a consultant, and was gaining popularity over his fiery public debates. His policy tended towards the more daring variety, and his nomination would no doubt leave a mark, if that was the angle Julia was going for. Still, there was time to decide, and with everything going on there was no rush to resume things overseas."
 gillard_gov_event.2.a: "Beaucoup à considérer."
 forced_adoptions_gillard.1.t: "Le gouvernement Gillard s'exprime sur les adoptions forcées"
 forced_adoptions_gillard.1.d: "[GetASTLeaderTitle] Julia Gillard delivered a national apology this evening for the historic acts of government policy, between 1950 and 1975, that forced the separation of thousands of Indigenous mothers from their children. \n\n\"We acknowledge the profound effects of these policies and practices on fathers and we recognise the hurt these actions caused to brothers and sisters, grandparents, partners and extended family members,\" Gillard told the audience full of over 800 people inside of Parliament House, many of which were in tears. \n\nAn estimated 100,000 to 150,000 infants were forcibly or coercively removed from mothers, mostly young unmarried women."
 forced_adoptions_gillard.1.a: "Nos pensées les accompagnent."
 let_debate_decide_gillard.1.t: "La législation sur le mariage homosexuel rejetée"
 let_debate_decide_gillard.1.d: "Dans un résultat peu surprenant, la Chambre des représentants a massivement voté contre la législation sur le mariage de même sexe, 98-42, le projet a été rejeté. La plateforme de notre parti s'est typiquement opposée au concept, et la plupart des réponses ont été les défenses habituelles des valeurs traditionnelles et ainsi de suite. Nous avons déjà attiré beaucoup de critiques des électeurs progressistes en ligne, et sans doute cela se répandra jusqu'à la prochaine élection."
 let_debate_decide_gillard.1.a: "Welp."
 let_debate_decide_gillard.2.t: "L'amendement antidiscrimination passe au Sénat"
 let_debate_decide_gillard.2.d: "In a surprise act of bipartisanship, our same-sex protections legislation has shot through the House and Senate with overwhelming support. The amendment included wide ranging protections against discrimination on the grounds of sexual orientation, along with Commonwealth-funded programs to protect and support those vulnerable, and provide educational services, strengthening the already existing act. \n\nOnly mild complaints came from the opposition leaders regarding nitpicks in the guidelines, but for the most part this seems like a generational win for the party. The support we're already receiving online from progressives is overwhelming."
 let_debate_decide_gillard.2.a: "Encore une victoire !"
 opposition_attacks_ast.1.t: "L'opposition tire des coups de feu"
 opposition_attacks_ast.1.d: "La rhétorique habituelle de Tony Abbott a toujours été en partie inflammatoire, en partie excessive, mais récemment il a porté les attaques à de nouveaux sommets. Après qu'une foule de manifestants est apparue devant Parliament House brandissant des pancartes assez « obscènes », Abbott en a profité pour aller se mêler à eux, invitant des journalistes à filmer l'affaire. \n\nCe qui aurait pu rester un rassemblement marginal a reçu assez d'attention pour que les journaux portent maintenant « DITCH THE WITCH », et certains même « BURN THE BITCH ». C'est vulgaire, même pour Abbott, et maintenant les médias Newscorp s'y mettent."
 opposition_attacks_ast.1.a: "Tout simplement génial."
 opposition_attacks_ast.2.t: "Abbott lance une tournée médiatique pour démolir notre gouvernance"
 opposition_attacks_ast.2.d: "Une fois de plus Tony Abbott a pris les projecteurs seulement pour critiquer notre politique. Récemment, au Today Show, Abbott n'en finissait plus sur l'infeasibilité de notre planification budgétaire, la taxant de « gaspilleuse », « crâneuse » et les piques habituelles. Cela n'aurait pas frappé si fort si un Newspoll la veille ne nous avait pas peints comme le gouvernement le moins préféré, à 5 points derrière Abbott dans les sondages. Tandis que notre soutien s'érode, quoi que nous répondions n'a plus vraiment de jambe à tenir."
 opposition_attacks_ast.2.a: "On ne peut pas avoir un répit ?"
 ast_fm_rudd_focus.5.t: "Kevin Rudd quitte le Cabinet"
 ast_fm_rudd_focus.5.d: "During a press conference in Washington, DC, Rudd seemingly announced to the crowd there that he'd be formally stepping down as our foreign minister. A shock for the crowd there, and it's certainly not a great look on our government, but it got worse when Rudd then went on to blame us for his decision. Claiming he didn't have our backing. \n\nIt's very likely the next opportunity he gets, Rudd will attempt a leadership challenge against us. There's already talk of dissension in the party, so we'll need to be ready for anything. For now we'll need a new foreign minister."
 ast_fm_rudd_focus.5.a: "Manque de soutien ? Mais c'est nous qui l'avons choisi !"
 opposition_attacks_ast.3.t: "Les SMS de Peter Slipper"
 opposition_attacks_ast.3.d: "Notre actuel président de la Chambre, Peter Slipper, est sous le feu récemment après que des centaines de SMS privés qu'il a envoyés ont été rendus publics dans le cadre de procédures juridiques contre lui. Peter était auparavant membre du Parti libéral, qui a sauté le navire pour nous rejoindre comme indépendant. Les SMS sont assez mauvais, bien qu'il s'agisse d'une affaire personnelle pour le président, mais maintenant les Libéraux nous peignent comme sexistes pour ne pas avoir largué Peter sur-le-champ. \n\nTony Abbott a rallié un vote de censure contre nous à moins que nous ne limogions Peter Slipper, sinon nous avons une occasion à l'assemblée de nous défendre. Si les SMS ne sont pas terribles, ils ne sont guère pires que les remarques libérales habituelles, et cela ne ferait pas de mal de dire son fait à Abbott."
 opposition_attacks_ast.3.a: "Allons-y à l'assemblée."
 opposition_attacks_ast.3.b: "Pantoufle de sac."
 opposition_attacks_ast.4.t: "Le discours de Gillard sur la misogynie devient viral"
 opposition_attacks_ast.4.d: "Lors d'une journée vitriolique de débat parlementaire hier, le [GetASTLeaderTitle] s'est déchaîné sur le caractère du chef de l'opposition Tony Abbott après que les tensions autour des SMS de Slipper ont atteint un point de rupture de leur querelle en cours. Pendant le vote de censure à l'assemblée, Gillard a commencé à fustiger Abbott pour sa propre rhétorique sexiste ces dernières années. \n\n« Je ne me ferai pas donner de leçons sur le sexisme et la misogynie par cet homme, je ne le ferai pas. Et le gouvernement ne se fera pas donner de leçons sur le sexisme et la misogynie par cet homme. Pas maintenant, pas jamais. » \n\nLe discours de Gillard a été immédiatement bien reçu non seulement à travers la nation, mais aussi mondialement en ligne. Les journaux britanniques et américains ont vite commenté le théâtre politique, saluant « l'attaque contre le sexisme » de Gillard comme « cinglante » mais « brillante », selon le Telegraph."
 opposition_attacks_ast.4.a: "Content que ça ait payé."
 rudd_events_gillard.1.t: "Kevin Rudd offre des services"
 rudd_events_gillard.1.d: "Tandis que nous finalisons encore notre cabinet, Rudd nous a approchés avec l'offre de servir comme ministre des Affaires étrangères. Sans aucun doute, Rudd pourrait être le ministre le plus expérimenté et démontrablement efficace en affaires étrangères, et cela pourrait servir de coup de pouce politique d'avoir quelqu'un de l'ancien bureau avec nous maintenant. Toutefois, nous pourrions vouloir séparer notre cabinet de l'ancien si nous voulons paraître comme le nouveau visage du Labor."
 rudd_events_gillard.1.a: "Bienvenue à bord."
 rudd_events_gillard.1.b: "Nous allons bien, merci."
 rudd_events_gillard.2.t: "Le drame de Q&A"
 rudd_events_gillard.2.d: "Des nouvelles nous sont parvenues que Kevin Rudd a fait une apparition surprise à l'émission Q+A, répondant à un certain nombre de questions relatives à son mandat. En surface, l'émission n'avait rien d'inquiétant, mais quelques membres du cabinet ont noté le ton « critique » que Rudd a donné à quelques questions, blâmant certains « collègues » de l'avoir miné pendant son mandat. \n\nAussi impartial que cela sonne, les journalistes font le lien directement avec nous et blâment des membres de notre cabinet pour la chute de Rudd. Malgré le ridicule des accusations, cela nous donne encore un mal de tête dans les sondages."
 rudd_events_gillard.2.a: "Le fait-il exprès ?"
 rudd_events_gillard.3.t: "Kevin Rudd en campagne"
 rudd_events_gillard.3.d: "Récemment Rudd a été vu dans des élections locales soutenant d'autres membres du Labor. En soi le soutien est apprécié par le parti, mais Rudd en fait presque exprès une affaire personnelle. Transformant les visites en séances photo, et prenant le projecteur aux candidats pour donner ses propres interviews. Il rassemble du soutien autour de lui plutôt que de notre administration, et cela pourrait marcher. \n\nLe soutien à Rudd dans les Newspolls monte bien plus haut que le nôtre, et si nous faisons quoi que ce soit pour arrêter sa petite tournée, cela pourrait seulement empirer les choses."
 rudd_events_gillard.3.a: "Bon sang Kevin !"
 rudd_events_gillard.4.d: "Rudd a été vu fréquentant un certain nombre de circonscriptions locales en soutien à nos candidats travaillistes. C'est une activité assez standard pour des membres chevronnés du parti, sauf que Rudd semble se donner du mal pour mettre en lumière nos politiques, les portant à la presse. \n\nQue les médias s'y mettent vraiment est une chose, mais cela fait des merveilles pour nos chiffres de sondage, et cela va certainement nous aider aux prochaines élections d'État."
 rudd_events_gillard.4.a: "Comme c’est attentionné."
 rudd_events_gillard.5.t: "Rudd se prononce contre notre gouvernement"
 rudd_events_gillard.5.d: "Comme prévu, Kevin Rudd a rôdé autour du parlement cherchant à retourner plus de nos ministres contre nous. Malheureusement les médias relaient une conversation « fuitée » où Rudd a proclamé qu'il ne croyait pas en notre gouvernement pour gagner la prochaine élection, et qu'il envisageait un défi de leadership avec un sérieux soutien. \n\nComme d'habitude, c'est probablement un stratagème de Kevin pour nous ébranler, et convoquer un ballot de leadership pourrait le remettre à sa place, mais cela vaut-il même de lui donner du grain ?"
 rudd_events_gillard.5.a: "Convoyer le ballot de leadership."
 rudd_events_gillard.5.b: "C'est un rien-burger."
 rudd_events_gillard.6.t: "Appel au scrutin à la direction"
 rudd_events_gillard.6.d: "À la suite de l'élection de leadership travailliste, Kevin Rudd a été nettement battu 71 à 31. Rudd a promis de cesser tout défi ultérieur contre nous, et de soutenir tout ballot futur, quel que soit le mérite de cette parole. Les résultats montrent que, malgré tout, le parti nous a encore dans le dos. Ce gouvernement va continuer sa mission auprès du peuple australien, aussi dur que cela devienne. Il est temps de retourner dans le ring et de continuer à sortir notre politique."
 rudd_events_gillard.6.a: "Écoutez, écoutez !"
 rudd_events_gillard.7.t: "Démissions en masse au cabinet"
 rudd_events_gillard.7.d: "Trois de nos principaux membres du cabinet ont remis leur démission dans la même semaine, ce que nous ne pouvons que supposer comme une sorte de protestation contre notre gouvernement. Des sympathisants de Rudd du cabinet inférieur ont aussi démissionné en réponse. La situation ne pourrait être plus grave en termes d'unité du parti. Il faudra trouver des remplaçants d'urgence et faire une annonce bientôt pour sauver la face. \n\nSi ces sabotages n'étaient pas si fréquents, nous pourrions pousser de sérieuses réformes, et vraiment nous engager dans le travail pour lequel nous avons été élus."
 rudd_events_gillard.7.a: "Comme des rats fuyant un navire en perdition."
 rudd_events_gillard.8.t.a: "Les Verts rompent l'alliance"
 rudd_events_gillard.8.t.b: "Les ex-libéraux indépendants se rassemblent autour de [GetASTLeaderTitle]"
 rudd_events_gillard.8.d.a: "Amid the recent departures in the cabinet, the new Greens party leader, Christine Milne, has announced their party will also ditch us, disbanding the alliance. They cited some hokey excuse over a disagreement in policy, but we knew this would happen eventually. Labor is poised to enter the next election alone."
 rudd_events_gillard.8.d.b: "Au milieu des critiques des partis d'opposition, des indépendants se sont ralliés autour du [GetASTLeaderTitle], portant la politique de notre gouvernement face au drame en cours. Malgré des allers-retours à l'hôpital, Tony Windsor est même apparu devant les caméras pour se vanter des réformes positives qu'il a aidé à faire passer, ayant soutenu nos chiffres à la Chambre. Honnêtement, il était temps qu'on nous apprécie un peu."
 rudd_events_gillard.8.a: "Typique."
 rudd_events_gillard.8.b: "Un geste bienvenu."
 rudd_events_gillard.9.t: "Un autre défi de leadership"
 rudd_events_gillard.9.d: "As our standing in the polls worsens, our critics in parliament have emerged, like sharks smelling blood, and have begun to prepare a leadership challenge. Since the last one our backing has severely diminished. Despite Kevin Rudd's promise, he's rumored to be putting his name forward for the vote if a challenge is made, and no doubt he's been scheming with his loyalists for a while now. \n\nIn spite of our victory in the last ballot, we might not walk away from this one unscathed."
 rudd_events_gillard.9.a: "Dans la brèche."
 gillard_goodbye_ast.1.t: "Rideau final"
 gillard_goodbye_ast.1.d: "Lors d'une réunion avant le vote, Rudd s'est engagé à se retirer de la politique s'il perdait, non que sa parole eût un vrai poids à ce stade. Ce serait satisfaisant de le voir s'éloigner lentement à l'horizon, pour ne plus jamais souiller ces couloirs. Malheureusement nous n'avons pas eu cette chance. Par une marge de 57 à 45, Rudd était le vainqueur clair. \n\nL'Australie était-elle vraiment prête pour une [GetASTLeaderTitle] femme ? Ils ne le montraient certainement pas, à l'intérieur comme à l'extérieur du parlement. Soudain Julia avait perdu tout ce qu'elle avait mis si longtemps à obtenir, et il n'y avait même pas le temps de le digérer. Ils étaient hors de la salle du caucus travailliste et droit dans la salle de conférence. \n\nGillard a fait son dernier discours à une foule similaire à celle qui l'avait vue prêter serment. C'était court et simple. Gillard ne contesterait pas les résultats. À quoi bon ? Parfois on joue ses cartes et on perd. \n\nEt Gillard ne serait pas une mauvaise perdante."
 gillard_goodbye_ast.1.a: "C'est fini maintenant."
 gillard_goodbye_ast.2.t: "Le dernier ballot"
 gillard_goodbye_ast.2.d: "Pendant le ballot, Gillard est restée froide. Elle ne voulait pas leur donner la satisfaction d'avoir l'air inquiète. Rudd était assis au fond de la pièce, affalé. Il n'avait rien à dire, il irradiait simplement la suffisance. Dans ses derniers instants comme [GetASTLeaderTitle], Julia l'honorerait avec dignité, sinon elle aurait adoré traverser la pièce et lui claquer un peu de sens dans la tête. \n\nLe ballot a été appelé et les noms lentement égrenés. 47… 51… 55… 63. Le tally final était 63 à 39. Gillard avait gagné. \n\nSon cabinet s'est levé et a commencé à applaudir derrière elle. Elle pouvait à peine bouger, mais elle s'est forcée à se lever pour accepter le toast, tandis que son esprit courait à travers le raisonnement. Le parti l'avait-il enfin acceptée ? Dans une sorte de protestation finale, Kevin Rudd s'est levé aussi et a commencé à applaudir. Avant le vote, Rudd s'était engagé à se retirer de la politique s'il perdait. Elle n'aurait plus jamais à le voir. \n\nIls sont sortis de la salle du caucus travailliste et dans la salle de conférence proche rapidement, et Gillard a annoncé les résultats, confirmant qu'elle se présenterait à la prochaine élection."
 gillard_goodbye_ast.2.a: "C'est fini ?"
 uranium_trade_deal_ast.1.t: "Proposition commerciale d'uranium de l'Australie"
 uranium_trade_deal_ast.1.d: "Le gouvernement australien nous a présenté un accord économique pour exporter de l'uranium vers nous à des volumes accrus, en échange de la minimisation des tarifs sur leurs exportations vers nous. Leur gouvernement a accepté de baisser de même les tarifs sur nos exportations, et d'ouvrir les termes à des engagements commerciaux plus coopératifs à l'avenir. L'accord stipule que l'uranium ne doit pas servir à un enrichissement de grade militaire, mais une fois le minerai dans nos frontières, c'est vraiment à nous."
 uranium_trade_deal_ast.1.a: "Un accord fructueux."
 uranium_trade_deal_ast.1.b: "Ce n'est pas dans notre intérêt."
 uranium_trade_deal_ast.2.t: "L'Inde accepte l'accord sur l'uranium"
 uranium_trade_deal_ast.2.d: "L'Inde a accepté les nouveaux termes et signé le pacte commercial ! Nous pouvons attendre une gamme de biens et services d'eux à un rythme accru et simplifié, tandis qu'ils baissent les tarifs sur notre uranium. Crucial au succès de l'accord, ils ont aussi accepté d'adopter les normes de l'Agence internationale de l'énergie atomique (AIEA), stipulant que l'uranium ne servira pas à un enrichissement de grade militaire. En échange, nous coopérerons avec eux sur la recherche énergétique."
 uranium_trade_deal_ast.2.a: "Un gagnant-gagnant !"
 uranium_trade_deal_ast.3.t: "L'Inde refuse le pacte commercial"
 uranium_trade_deal_ast.3.d: "India has refused our overtures for trade, and has opted to instead continue the current commitments. Prime Minister [RAJ.GetLeader] has not commented on the outcome, but it seems we are not in good favor with their government. This is certainly a step back for pacific trade, and an unfortunate oversight."
 uranium_trade_deal_ast.3.a: "Nous perdons la main."
 uranium_trade_deal_ast.5.t: "Moscou signe le pacte"
 uranium_trade_deal_ast.5.d: "Le gouvernement de Moscou a accepté nos termes commerciaux et retirera une gamme de tarifs sur nos biens en échange d'exportations accrues d'uranium vers eux. S'ils sont restés vagues sur l'usage de l'uranium, ils se sont engagés à ne pas l'utiliser pour un enrichissement de grade militaire. L'accord marque une percée de coopération qui n'avait pas été atteinte à ce niveau depuis avant la chute du mur de Berlin, et ils semblent impatients de poursuivre la coopération entre nous."
 uranium_trade_deal_ast.5.a: "Sortez le bortsch !"
 uranium_trade_deal_ast.6.t: "Moscou quitte les négociations"
 uranium_trade_deal_ast.6.d: "La Russie a refusé nos ouvertures commerciales, et a choisi de poursuivre les engagements actuels. Le président [SOV.GetLeader] n'a pas commenté le résultat, mais il semble que nous ne soyons pas en faveur auprès de leur gouvernement. C'est certainement un recul pour le commerce du Pacifique, et un oubli malheureux."
 uranium_trade_deal_ast.6.a: "Mieux vaut laisser l'ours tranquille."
 rudd_in_korea.1.t: "Un crochet depuis le pays d'en bas"
 rudd_in_korea.1.d: "Le ministre australien des Affaires étrangères mène des négociations avec nous, via la Chine, afin d'organiser un réchauffement des relations entre nous et la Corée du Sud. Le schéma est audacieux, et quelque peu naïf. Les Australiens ont demandé que nous nous engagions sur un calendrier où nous cesserions la production d'armes à longue portée, sans démanteler aucune de nos armes actuelles, en échange d'un allègement des sanctions et d'un soutien à l'aide au développement. Puisque notre guerre avec la Corée du Sud n'est pas techniquement terminée, ils ont proposé de résoudre le différend au checkpoint de la DMZ. Cela pourrait être une opportunité de propagande qui en vaut la peine."
 rudd_in_korea.1.a: "Une occasion unique."
 rudd_in_korea.1.b: "Ce n'est pas dans notre intérêt."
 rudd_in_korea.2.t: "Le triomphe de Kevin Rudd en Corée"
 rudd_in_korea.2.d: "Slowly walking through the demilitarized zone checkpoint between North and South Korea, Kevin Rudd was met by the North Korean leader, [NKO.GetLeader], and the two shook hands. Each of them on their own side of the border, marking a symbolic leap in Korean relations, and signifying a dramatic change to the greater status quo in Asia. Rudd then crossed over, becoming the first member of the Australian government, and former leader, to enter the country. \n\nAfter four months of intense negotiations, passing back and forth through China, a breakthrough was achieved. [NKO.GetLeader] has agreed to a timeline for ending long range weapons development, and a resolution to the Korean war, which has technically been ongoing since 1950, in exchange for sanction relief and development aid support. Rudd and the Supreme Leader spoke at a press conference later in the day, emphasising the mutual friendship our two nations are hoping to achieve. \n\nThe South Korean President, [KOR.GetLeader], who accompanied Rudd to the DMZ, lauded Rudd's effort as genuine success and a boon for international peace."
 rudd_in_korea.2.a: "Une diplomatie solide gagne encore."
 vietnam_trade_gillard_ast.1.t: "Avances commerciales de l'Australie"
 vietnam_trade_gillard_ast.1.d: "Le gouvernement australien nous a présenté un accord économique pour simplifier le commerce entre nous à des volumes accrus, et minimiser les tarifs des deux côtés. Nous avons jusqu'ici joui d'un commerce constamment sain entre nous, et ils semblent intéressés par des arrangements plus coopératifs à l'avenir."
 vietnam_trade_gillard_ast.1.a: "Une proposition juste."
 vietnam_trade_gillard_ast.1.b: "Cela ne nous convient pas."
 vietnam_trade_gillard_ast.2.t: "Le Vietnam accepte les négociations commerciales"
 vietnam_trade_gillard_ast.2.d: "Le gouvernement vietnamien a accepté les nouveaux termes et signé le pacte commercial. Nous pouvons attendre une gamme de biens et services d'eux à un rythme accru et simplifié, et plus d'Australiens pourront profiter de biens moins chers dans les magasins près de chez eux."
 vietnam_trade_gillard_ast.2.a: "Tout se met en place."
 vietnam_trade_gillard_ast.3.t: "Le Vietnam refuse les négociations commerciales"
 vietnam_trade_gillard_ast.3.d: "Le Vietnam a refusé nos ouvertures commerciales, et a choisi de poursuivre les engagements actuels. Une pression externe a peut-être empêché la signature, mais le secrétaire général [VIE.GetLeader] n'a pas commenté le résultat. C'est certainement un recul pour le commerce du Pacifique, et un résultat malheureux."
 vietnam_trade_gillard_ast.3.a: "Un résultat décevant."
 stir_the_pot_event.1.t: "L'Australie exige une zone d'exclusion aérienne"
 stir_the_pot_event.1.d: "Après un certain nombre d'incidents impliquant nos chasseurs frappant accidentellement des infrastructures civiles, le gouvernement australien a exigé que nous adhérions à une « zone d'exclusion aérienne » imposée au-dessus de la Libye, instituant que nos avions restent dans leurs bases sous peine d'être engagés par l'armée de l'air australienne. Qu'ils aient l'intention de vraiment faire respecter cette demande n'est pas à nous de le dire, mais ils sont très loin, et exigent beaucoup."
 stir_the_pot_event.1.a: "Céder à leurs exigences."
 stir_the_pot_event.1.b: "L'espace aérien libyen est libyen !"
 stir_the_pot_event.2.t: "La Libye cède à nos demandes"
 stir_the_pot_event.2.d: "Sous la menace d'une intervention australienne, [LBA.GetLeader] a accepté d'instituer une « zone d'exclusion aérienne » sur l'espace aérien libyen pour la durée de leur conflit civil. Cela devrait, on l'espère, limiter les victimes civiles au minimum, et empêcher tout débordement vers les États voisins."
 stir_the_pot_event.2.a: "La realpolitik en action."
 stir_the_pot_event.3.t: "La Libye refuse notre requête"
 stir_the_pot_event.3.d: "Malgré la perte continue de vies civiles, [LBA.GetLeader] a refusé notre demande d'une « zone d'exclusion aérienne » sur l'espace aérien libyen. Leur conflit civil en cours continuera de présenter un danger pour les populations de la région, et le risque de débordement vers les États voisins croît. Comment nous faisons respecter nos exigences nous appartient maintenant."
 stir_the_pot_event.3.a: "Ils connaissaient l'alternative."
 myanmar_intervention_gillard.1.t: "L'Australie exige une coopération en matière de maintien de la paix"
 myanmar_intervention_gillard.1.d: "Le gouvernement australien nous a envoyé une demande d'autoriser leurs casques bleus dans le pays et de nous aider à gérer la crise insurgée actuelle. L'aide serait appréciée, toutefois leurs termes feraient essentiellement de nous un État client politique de leur gouvernement jusqu'à la levée de la crise, laquelle n'est pas définie par leurs termes. Ils semblent complètement déterminés à faire respecter la demande, au point que si nous refusons, une invasion militaire n'est pas hors de question."
 myanmar_intervention_gillard.1.a: "Absolument pas."
 myanmar_intervention_gillard.1.b: "Nous n'avons pas d'alternative."
 myanmar_intervention_gillard.2.t: "Le Myanmar accepte les conditions"
 myanmar_intervention_gillard.2.d: "In face of the growing insurgent threat, [BRM.GetLeader] has agreed to allowing our peacekeepers into Myanmar to contain the crisis. A sizable component of our armed forces will begin the occupation shortly. Ultimately this is a great win in the fight against terrorism."
 myanmar_intervention_gillard.2.a: "C'est pour leur bien."
 myanmar_intervention_gillard.3.t: "Le Myanmar refuse les conditions de maintien de la paix"
 myanmar_intervention_gillard.3.d: "Despite our delegation getting off on good terms with the Burmese, [BRM.GetLeader] has outright refused our offer to assist in combating the growing insurgent crisis. The nation has continued to unravel to the brink of collapse, presenting a real risk of becoming a hotbed for terrorist cells. Considering how bad things could get, our response must be proportional to the danger this presents."
 myanmar_intervention_gillard.3.a: "Les sanctionner jusqu'à la coopération."
 myanmar_intervention_gillard.3.b: "Nous devons intervenir."
 ast_myanmar_intervention_rejection_outcomes_tt: "Si le Myanmar refuse, l'Australie peut imposer des sanctions et un embargo ou préparer un casus belli de marionnette."
 reconciliation_discontent: "Mécontentement face à la réconciliation"
 reconciliation_discontent_desc: "A persistent disadvantage permeates the lives of Indigenous Australians. While the Mabo Case reinvigorated the spirit of many, consistently indifferent leadership over the last decade has ground down much of the hope few still had, and even fewer are seeing the benefits from it today. A small vocal minority still appeals to the government for desperate change."
 reform_despair_ast: "Désespoir de la réconciliation"
 reform_despair_ast_desc: "Sans espoir de changement, l'esprit de réconciliation a été étouffé. Les Autochtones australiens continuent de vivre en marge sans avenir garanti, et beaucoup d'autres se sentent désenchantés de l'orientation de notre politique. L'égalité pour tous dans notre nation semble désormais hors de portée. On peut s'attendre à ce que des électeurs désabusés soutiennent des mouvements plus radicaux à l'avenir."
 rekindled_hope_ast: "Espoir ravivé"
 rekindled_hope_ast_desc: "Un poids a été levé de beaucoup d'Australiens. D'une façon petite mais mesurable, la nation a avancé vers la guérison. Si la route est encore longue, le voyage pour y arriver a été rendu plus facile. Plus d'opportunités sont offertes à ceux dans le besoin. Les lieux de travail et les écoles sont devenus plus unifiés et solidaires pour tous les Australiens. La communauté regarde désormais vers l'avant avec espoir."
 economic_radical: "Radical économique"
 john_howard: "John Howard"
 the_rba_ast: "La RBA"
 the_rba_ast_desc: "La Reserve Bank of Australia est notre banque centrale et l'autorité d'émission des billets. Cela signifie essentiellement qu'elle contrôle le taux d'intérêt. Si nous jouons le jeu avec nos politiques, faisons baisser les dépenses et le chômage, ils joueront le jeu."
 work_for_the_dole: "Travailler pour les allocations"
 work_for_the_dole_desc: "L'une de nos politiques clés pendant la campagne électorale. Le programme visait à former les participants et à les mettre au travail pour aider les communautés locales si possible. Ils continueraient à recevoir un soutien de revenu pendant le travail, et nous continuerions à les former."
 work_for_the_dole_2: "Travailler pour les allocations"
 work_for_the_dole_2_desc: "The program aims to train participants and put them to work helping local communities if they are able. They'll continue to receive income support during the work while we continue to train them. As it's grown we've incorporated a number of state construction roles to the list of opportunities, to assist with our construction works."
 baby_bonus_idea_ast: "Bonus bébé"
 baby_bonus_idea_ast_desc: "Le dispositif vise à compenser les dépenses qui pèsent sur les nouveaux parents élevant leur enfant. Une somme forfaitaire de 3 000 $ est versée aux parents par enfant éligible. Cela devrait encourager une population croissante pour atténuer le vieillissement des Australiens."
 negative_gearing_tooltip_tt: "Détruit considérablement notre relation avec les §Ypropriétaires fonciers§! et nos chances de réélection, mais cela pourrait prévenir une crise du logement à l'avenir."
 tafe_investment: "Investissements dans l'enseignement technique"
 signed_the_kyoto_protocol_ast: "Protocole de Kyoto signé"
 kyoto_protocol_ast: "Le protocole de Kyoto"
 kyoto_protocol_ast_desc: "Adopté à l'origine par d'autres nations en 1997, le Protocole a été une pierre de guidage pour réduire les émissions de gaz à effet de serre des industries, fondé sur le dernier consensus scientifique concernant le réchauffement climatique. Si toutes ses restrictions ne sont pas en vigueur, nous les introduisons progressivement dans l'espoir d'atteindre un jour une émission nette nulle de gaz à effet de serre."
 ast_avoid_the_speech_tt: "Le parti recevra l'ordre de rester impartial dans l'intérêt de l'unité de la coalition. On ne peut qu'espérer que le public perde intérêt."
 national_water_initiative_ast: "§GInitiative nationale de l'eau§!"
 national_water_initiative_ast_2: "§GInitiative nationale de l'eau§!"
 ast_a_nation_worth_preserving_tt: "Les effets de notre §Gsuccès§! se feront sentir dans les générations suivantes."
 police_and_security_increase_tt: "Notre §Yfinancement de la police et de la sécurité§! sera augmenté pour lutter contre les manifestations."
 police_and_security_increase_2_tt: "Notre §Yfinancement de la police et du renseignement§! sera augmenté pour élargir nos pouvoirs judiciaires."
 asio: "ASIO"
 asio_desc: "The Australian Security Intelligence Organisation is responsible for protecting our citizens from any and all internal threats. Originally created over five decades prior, the organisation has been adapted to counter the growing threats Australia faces in the new millennium."
 streamlined_asylum_policy_ast: "Politique d'asile simplifiée"
 encourage_foreign_students_ast: "Étudiants étrangers encouragés"
 foreign_industrial_experts_ast: "Experts techniques étrangers"
 foreign_industrial_experts_ast_desc: "Experts from overseas have been granted additional preferential visas. Bringing in some of the brightest minds from around the world to work and teach in Australia."
 border_protection_bill_ast: "Projet de loi sur la protection des frontières"
 our_ast_deputy_peacekeepers: "Nos adjoints casques bleus"
 australian_political_system: "Système politique australien"
 king_of_the_battlers: "Roi des combattants"
 tourism_campaign_ast: "Campagne nationale"
 accepted_pacific_solution: "Accepté la solution pacifique"
 denied_pacific_solution: "Refusé la solution pacifique"
 IND_extremist_suppression_bonus: "Efforts conjoints antiterroristes australiens"
 rudd_in_the_fire_tt: "Kevin Rudd will be put to work finding opportunities abroad for us. More §2decisions§! will become available in the International Missions tab over time."
 sino_aus_peacekeeping: "Maintien de la paix sino-australien"
 sino_aus_peacekeeping_desc: "While only the beginning of such an initiative, the agreement sets the foundation for future peacekeeping operations in the Pacific. By cooperating in intelligence gathering, counter-terrorism and trade protection, we can continue to keep the oceans between us safe, and bridge the gap between our two nations. \n§W--------------§!\nThis national spirit will be §RRemoved§! if we are at war with China."
