l_russian:
 charoenchai_hinthao: "Чароенчай Хинтао"
 charoenchai_hinthao_desc: "Начальник Королевской тайской армии поколения 2020-х, построивший свою репутацию на оборонительной доктрине и горьких уроках южной границы. Он натаскивает свои соединения удерживать рубежи и обескровливать наступающего."
 songwit_noonpakdee: "Сонгвит Нунпакди"
 songwit_noonpakdee_desc: "Высокопоставленный офицер Королевской тайской армии, известный скорее штабной работой и организаторскими способностями, чем показухой. Он обеспечивает укомплектованность, снабжение и боеготовность армейских формирований и легко адаптируется к политическим интригам, сопутствующим высшему командованию."
 adung_phaniam: "Адунг Фан-иам"
 adung_phaniam_desc: "Флагманский офицер Королевских ВМС Таиланда, командующий современным флотом, хорошо знакомый с линейными кораблями и доктриной надводных действий. Он выступает за военно-морской флот, влияние которого ощущается за пределами Сиамского залива."
 punpakdee_pattanakul: "Панпакди Паттанакул"
 punpakdee_pattanakul_desc: "Офицер Королевских ВВС Таиланда, представитель поколения реформ, который продвигает службу к профессиональным стандартам, современным летательным аппаратам и системе подготовки, которая выпускает летный состав, а не просто парадные построения."
 intel_chief_nia: "Директор Национального разведывательного агентства"
 intel_chief_nia_desc: "Глава Национального разведывательного агентства Таиланда руководит гражданской разведкой страны, объединяя информацию из провинций, приграничных районов и дворцовых структур в единую картину для правительства."
 thailand_focus: "Тайское дерево фокусировки"
 SIA_the_2001_election_shortcut: "Выборы 2001 года"
 SIA_lost_territories_shortcut: "Затерянные территории"
 SIA_armed_forces_modernization_shortcut: "Модернизация вооруженных сил"
 SIA_recover_from_97_crisis_shortcut: "Кризис Том Ям Кунг"
 SIA_asean_centrality_shortcut: "Центральная роль АСЕАН"
 SIA_the_southern_question_shortcut: "Южный вопрос"
 SIA_kra_gateway_shortcut: "Кра Гейтвей"
 SIA_recover_from_97_crisis: "Восстановление после кризиса Том Ям Кунг"
 SIA_recover_from_97_crisis_desc: "В 1997 году в Бангкоке начался кризис Том Ям Кунг. После того, как Таиланд истощил свои валютные резервы на защиту фиксированной ставки бата, он был вынужден перейти на плавающий курс валюты и принять предложение МВФ о предоставлении резервного кредита. Этот пакет мер позволил стране сохранить платежеспособность, но ценой чрезмерного контроля и потери экономического достоинства. Остается последний шаг: завершить восстановление, досрочно погасить долг перед Фондом и восстановить полный суверенитет."
 SIA_the_1997_constitution: "Народная конституция"
 SIA_the_1997_constitution_desc: "Конституция 1997 года пишется при небывалом участии общества и обещает избираемый Сенат, гарантии прав человека и сильные антикоррупционные органы. Переживёт ли она тайскую политику?"
 SIA_repay_the_imf: "Досрочное погашение долга перед МВФ"
 SIA_repay_the_imf_desc: "В июле 2003 года Таиланд погасил остаток резервного кредита на два года раньше срока. Досрочная выплата важна не столько суммой, сколько сигналом. Рынки перестают закладывать в тайский долг риск финансовой помощи, и Королевство снова занимает дешевле."
 SIA_amazing_thailand: "Удивительный Таиланд"
 SIA_amazing_thailand_desc: "Туристическая кампания, которая помогла нам пережить кризисные годы, становится национальной стратегией. От Пхукета до Чиангмая весь мир приглашается в Страну улыбок, и мир платит твердой валютой."
 SIA_rice_and_rubber: "Рисовая чаша Азии"
 SIA_rice_and_rubber_desc: "Таиланд является ведущим мировым экспортером риса и каучуковой сверхдержавой. Необходимо модернизировать сельскохозяйственную экономику регионов Исан и Юг и превратить сельскохозяйственный потенциал в экспортную выручку."
 SIA_detroit_of_asia: "Детройт Азии"
 SIA_detroit_of_asia_desc: "Японские и американские автопроизводители выбрали Восточное побережье в качестве своей региональной производственной площадки. Нужно удвоить усилия в автомобильной промышленности и сделать маркировку «сделано в Таиланде» мировым стандартом."
 SIA_suvarnabhumi_airport: "Аэропорт Суварнабхуми"
 SIA_suvarnabhumi_airport_desc: "Новый аэропорт Бангкока, строительство которого велось десятилетиями, станет крупным авиационным центром Юго-Восточной Азии. Провинциальные аэропорты, такие как Пхукет, будут направлять туда пассажиропоток и, если мы сможем завершить строительство, поднимут тайскую авиацию в целом."
 SIA_eastern_economic_corridor: "Восточное побережье"
 SIA_eastern_economic_corridor_desc: "Развитие промышленного коридора от Чонбури до Районга с портами, нефтеперерабатывающими заводами, фабриками и железными дорогами. Двигатель тайской экономики."
 SIA_medical_hub: "Медицинский центр Азии"
 SIA_medical_hub_desc: "Больницы мирового класса по ценам развивающихся стран. Медицинский туризм привлекает пациентов и повышает престиж медицинских учреждений со всего мира."
 SIA_education_for_the_future: "Просвещение Королевства"
 SIA_education_for_the_future_desc: "В тайских школах по-прежнему больше ценят механическое запоминание, чем решение задач, а качество преподавания сильно различается между Бангкоком и провинциями. Современная учебная программа, более квалифицированные учителя и профессиональные программы, соответствующие потребностям промышленности, являются основой любых усилий по созданию экономики с высоким уровнем дохода."
 SIA_asean_centrality: "Центральная роль АСЕАН"
 SIA_asean_centrality_desc: "Именно в Бангкоке в 1967 году была основана АСЕАН. Инвестируйте в этот регион, потому что стабильная и дружественная Юго-Восточная Азия — лучшая гарантия безопасности для Таиланда."
 SIA_treaty_ally: "Крупный союзник, не входящий в НАТО"
 SIA_treaty_ally_desc: "Самые давние договорные отношения США в Азии. Укрепляйте позиции Cobra Gold, приветствуйте американскую технику и наслаждайтесь гарантией безопасности, пока она действует."
 SIA_bamboo_bends_east: "Бамбук изгибается на восток"
 SIA_bamboo_bends_east_desc: "Тайская дипломатия гнется под ветром, а ветер дует из Пекина. Китайские инвестиции, китайские железные дороги, китайские рынки — все это по цене, которая до сих пор обсуждается."
 SIA_the_2001_election: "Выборы 2001 года"
 SIA_the_2001_election_desc: "Первые выборы в рамках Народной Конституции. Кризис разрушил прежний консенсус. Новые популистские силы, традиционная сеть власти и демократы теперь борются за направление развития страны."
 SIA_thai_rak_thai: "Тай Рак Тай"
 SIA_thai_rak_thai_desc: "Тайцы любят тайцев. Разгромная победа Таксина Шинаватры перекроила избирательную карту. Теперь сельские районы Севера и Северо-Востока сами определяют, кто будет править, и они выбрали своего защитника."
 SIA_thaksinomics: "Таксиномика"
 SIA_thaksinomics_desc: "Двухступенчатая экономика. Первый путь отдает приоритет мировому экспорту, а второй – предпринимательству на низовом и внутреннем уровнях. Такой подход способствует росту, но критики утверждают, что он увеличивает разрыв в уровне благосостояния."
 SIA_30_baht_healthcare: "30-батное здравоохранение"
 SIA_30_baht_healthcare_desc: "Любая болезнь, любая больница, тридцать бат. Всеобщее медицинское страхование меняет жизнь миллионов сельских жителей Таиланда и укрепляет их лояльность к партии Шинаватры."
 SIA_village_fund: "Фонд «Деревня за миллион бат»"
 SIA_village_fund_desc: "Предоставление каждому населенному пункту Королевства возобновляемого микрокредита в размере миллиона бат – одна из крупнейших программ микрофинансирования, когда-либо предпринятых."
 SIA_otop: "Один тамбон — один продукт"
 SIA_otop_desc: "Каждый микрорайон разрабатывает, продвигает и экспортирует уникальный местный продукт. Кустарное производство становится частью национальной стратегии."
 SIA_dual_track_economy: "Двухпутная экономика"
 SIA_dual_track_economy_desc: "Экспорт вырос, доходы сельского населения выросли, долг погашен досрочно. Что бы ни говорили критики о том, как это было сделано, итоговый результат склоняется в пользу правительства."
 SIA_war_on_drugs: "Война с наркотиками"
 SIA_war_on_drugs_desc: "Трехмесячная кампания по пресечению торговли метамфетамином. Она будет пользоваться популярностью. Но она также привлечет серьезное внимание к нарушению прав человека, которое будет преследовать правительство на протяжении многих лет."
 SIA_ceo_premier: "Премьер — генеральный директор"
 SIA_ceo_premier_desc: "Управлять страной как компанией. Показатели эффективности для министерств, выездные заседания кабинета министров в провинциях, нетерпение по отношению к бюрократии. Эффективно и разрушительно для любого учреждения, призванного говорить «нет»."
 SIA_dominant_party_state: "Одна партия, один Таиланд"
 SIA_dominant_party_state_desc: "Поглотить партнеров по коалиции, доминировать в эфире, выиграть все дополнительные выборы. Избирательная политика продолжается, но есть лишь один подавляющий выбор."
 SIA_consolidate_democracy: "Укрепить демократию"
 SIA_consolidate_democracy_desc: "Завоевать власть путем голосования, удержать ее на основе результатов выборов и сохранить институты власти. Популистская машина подчиняется Народной конституции."
 SIA_normalization_friction: "Нормализация трения"
 SIA_normalization_friction_desc: "Патронажные сети старой машины не рассыпаются по расписанию. Они сопротивляются снятию с учёта даже тогда, когда партия берётся за ум, и расчистка занимает больше времени, чем кто-либо обещал."
 SIA_thaksin_forever: "Таксин навсегда"
 SIA_thaksin_forever_desc: "Оппозиция не имеет значения, поскольку суды подкуплены, а сенат лоялен. Зачем этому проекту когда-либо заканчиваться? Доминирующая партия становится постоянной партией."
 SIA_shinawatra_dynasty: "Династия Шинаватра"
 SIA_shinawatra_dynasty_desc: "Движение переживает любого отдельного лидера. Лицо партии может смениться на сестру или дочь, но реальная власть по-прежнему принадлежит Таксину Шинаватре и его людям."
 SIA_the_old_order: "Сетевая монархия"
 SIA_the_old_order_desc: "Дворец, армия, суд, бюрократия. Именно эти институты проводили Таиланд через каждую бурю. Они не пережили бы семь десятилетий потрясений, если бы позволяли гражданским выборам решать всё."
 SIA_privy_council: "Тайный совет"
 SIA_privy_council_desc: "Советники короля, отставные генералы, судьи и государственные деятели находятся в тихом центре сети влияния истеблишмента. Укрепите каналы, которые обходят выборное правительство."
 SIA_royal_guidance: "Слово Царя"
 SIA_royal_guidance_desc: "Каждый декабрь король произносит речь, и нация слушает. Поздравительное обращение может благословить правительство или же молчаливо лишить его благословения — сила уважения, с которой не смеет бороться ни один голос или министр. Голос престола выводит страну из политического безумия."
 SIA_three_pillars: "Нация, религия, король"
 SIA_three_pillars_desc: "Чат, Сасана, Пхра Маха Касат — трёхцветный флаг, превращенный в гражданский катехизис. Монахи в школах, король на каждой стене, нация как единое нравственное тело. Это мощный клей, за исключением тех мест, где мечети переполнены, и катехизис воспринимается как закрывающаяся дверь."
 SIA_yellow_shirts: "Народный альянс проводит митинги"
 SIA_yellow_shirts_desc: "Народный альянс за демократию заполнил улицы Бангкока ярко-желтыми цветами, требуя отставки избранного правительства. Городской средний класс выбрал свою сторону."
 SIA_the_2006_coup: "Сентябрьский переворот"
 SIA_the_2006_coup_desc: "Пока премьер-министр за границей, в Бангкок входят танки. Действие конституции приостановлено, управление берёт на себя Совет демократических реформ. Политический круг замыкается снова."
 SIA_guardian_of_the_nation: "Хранитель нации"
 SIA_guardian_of_the_nation_desc: "Самовосприятие армии стало доктриной. Она стоит выше политики, но при этом имеет право положить конец любой политике, угрожающей нации. Необходимо институционализировать право вето армии."
 SIA_judicial_activism: "Судебная система"
 SIA_judicial_activism_desc: "Зачем посылать танки, если достаточно решения суда? Лишение партийных полномочий и дисквалификация становятся излюбленным инструментом правящей элиты."
 SIA_the_2014_coup: "НСПО"
 SIA_the_2014_coup_desc: "Сначала военное положение, потом переворот. Национальный совет мира и порядка приостанавливает политику на неопределённый срок и устраивает «корректировку взглядов» всей стране."
 SIA_lese_majeste_enforcement: "Защитите священный институт."
 SIA_lese_majeste_enforcement_desc: "Статья 112 Уголовного кодекса защищает монархию от оскорблений. Применяйте её без ограничений, и вы увидите, как каждое оппозиционное движение взвесит свои слова."
 SIA_isoc_state: "Государство ISOC"
 SIA_isoc_state_desc: "Командование по операциям внутренней безопасности, политический орган армии в каждой провинции, превращается в параллельное правительство по вопросам «безопасности», причем прежде всего в отношении Глубокого Юга."
 SIA_isoc_overreach_backlash: "Тихое общественное беспокойство"
 SIA_isoc_overreach_backlash_desc: "Аппарат внутренней безопасности влезает в повседневную жизнь далеко за пределами одного лишь Глубокого Юга. Обычные тайцы начинают замечать патрули, блокпосты и усиленную охрану при перемещениях войск."
 SIA_the_2017_constitution: "Управляемая демократия"
 SIA_the_2017_constitution_desc: "Полностью укомплектованный Сенат, положение о неизбираемом премьер-министре, двадцатилетняя национальная стратегия, обязывающая будущие правительства. Выборы возобновятся, но в закрытом режиме."
 SIA_perpetual_guardianship: "Пожизненная опека"
 SIA_perpetual_guardianship_desc: "Оформить то, что всегда подразумевалось. Вооружённые силы становятся постоянным конституционным арбитром. Своего рода устойчивость, теперь высеченная в конституции."
 SIA_royal_restoration: "Восстановление престола"
 SIA_royal_restoration_desc: "Пойти дальше, чем решалось любое правительство. Собрать нити политической сети и формально передать их в руки дворца. Династия Чакри возвращает себе прямое управление державой как абсолютная монархия."
 SIA_seeds_of_reform: "Семена реформ"
 SIA_seeds_of_reform_desc: "За пределами старой связки популистов и роялистов собирается третья сила. Молодая, городская, сетевая и сытая переворотами.\n\nСтавка на третью силу закрывает любой иной политический путь, на котором находилось Королевство, и ведёт его по реформистской ветви."
 SIA_future_forward: "Будущее впереди"
 SIA_future_forward_desc: "Новая партия впервые пришедших в политику людей обещает разорвать порочный круг. Демилитаризация, децентрализация, демократизация. Истеблишмент тянется к привычным инструментам и обнаруживает, что эта новая оппозиция собирает вокруг себя больше сил, чем он ожидал."
 SIA_three_demands: "Три требования"
 SIA_three_demands_desc: "Распустить парламент. Прекратить запугивать народ и разработать новую конституцию. Студенты говорят вслух то, что нельзя было сказать, и потолок тайской политики поднимается."
 SIA_demilitarize_politics: "Солдаты вне политики"
 SIA_demilitarize_politics_desc: "Прекратите злоупотребления в сфере призыва на военную службу, сократите медиаимперии генералов и их места в советах директоров, а также выведите армию из политики. Они нас за это не поблагодарят."
 SIA_civilian_control: "Гражданское превосходство"
 SIA_civilian_control_desc: "Министерство обороны, управляемое гражданскими лицами, повышение по службе, проверяемое парламентом, и военный бюджет, подотчетный аудиторам. Радикалы только в Бангкоке."
 SIA_amend_section_112: "Внести поправки в раздел 112."
 SIA_amend_section_112_desc: "Необходимо реформировать закон об оскорблении величества. Ограничить круг лиц, имеющих право подавать жалобы, установить предельные сроки наказания и прекратить его применение против политических высказываний. Этот законопроект считается самым опасным в Таиланде, и, возможно, пути к его принятию и возврату не будет."
 SIA_decentralize: "За пределами Бангкока"
 SIA_decentralize_desc: "Губернаторы каждой провинции избираются, а бюджеты не проходят через столицу. Бангкок слишком долго был центром всей страны."
 SIA_break_the_monopolies: "Разрушьте монополии"
 SIA_break_the_monopolies_desc: "Алкогольные дуополии, телекоммуникационные концессии, конгломератные перекрестные владения. Нужно открыть узкие места в тайской экономике и обеспечить честную конкуренцию."
 SIA_welfare_state: "Тайское государство всеобщего благосостояния"
 SIA_welfare_state_desc: "От разрозненной системы субсидий до реальной системы социальной защиты, включающей пенсии, уход за детьми и пособия по безработице. Дорогостоящая система, и ни одно правительство после этого не осмелится её отменить."
 SIA_marriage_equality: "Первое место в Юго-Восточной Азии"
 SIA_marriage_equality_desc: "Закон о равенстве браков принят, это первый подобный закон в Юго-Восточной Азии. Реформа, которую замечает весь мир, и редкий случай, когда истеблишмент не сопротивляется."
 SIA_deep_south_peace: "Мир на Глубоком Юге"
 SIA_deep_south_peace_desc: "Автономия в рамках Королевства, справедливость за прошлые злоупотребления, уважение патани-малайской идентичности. Восстание заканчивается за столом переговоров, а не на контрольно-пропускном пункте."
 SIA_consolidated_democracy: "Объединенная демократия"
 SIA_consolidated_democracy_desc: "Конституция, написанная гражданами, солдаты в казармах, суды, которые судят, а не правят. Череда переворотов наконец прервана и стала немыслимой."
 SIA_reform_transition_costs: "Налоговая база в переходный период"
 SIA_reform_transition_costs_desc: "Реорганизация институтов подразумевает и перестройку системы их финансирования. Сбор доходов отстает от новой системы, пока она не устоятся."
 SIA_a_new_republic: "Новая Республика"
 SIA_a_new_republic_desc: "Вопрос, который так и не был задан, вынесен на голосование. Каким бы ни был результат, Таиланд, который в итоге сложится, будет неузнаваемым, если вообще сохранит единство."
 SIA_lost_territories: "Затерянные территории"
 SIA_lost_territories_desc: "1893. 1904. 1907. 1909. Каждый тайский школьник учит даты, когда имперские Франция и Британия кроили Сиам. Поколение Пибуна однажды уже шло возвращать эти земли. Настоящие карты Сиама до сих пор лежат в архивах."
 SIA_pan_thai_movement: "Единая тайская раса"
 SIA_pan_thai_movement_desc: "Возродим грандиозный тезис Вичита Ватакана. Тайцы, лаосцы, шаны, один тайский народ, разделённый колониальными границами, ожидающий воссоединения под тайским флагом."
 SIA_rearmament: "Перевооружить Королевство"
 SIA_rearmament_desc: "Для достижения амбиций нужна сталь. Необходимо увеличить оборонный бюджет до уровня, недостижимого для аудиторов, и поставить промышленность Королевства на военное положение."
 SIA_modernize_the_rta: "Модернизировать Королевскую армию Таиланда"
 SIA_modernize_the_rta_desc: "Новые основные боевые танки, новые БМП, профессиональные солдаты вместо призывников по лотерее. Королевская армия Таиланда готовится к войнам, выходящим за рамки выполнения задач по борьбе с переворотами."
 SIA_blue_water_navy: "Военно-морской флот, состоящий из двух океанов"
 SIA_blue_water_navy_desc: "Авианосец «Чакри Наруэбет» наконец-то получает настоящее авиационное крыло и настоящее сопровождение, а программа подводных лодок перестает быть поводом для насмешек. Два побережья, два флота."
 SIA_gripen_squadrons_rearm: "Мир Суварнабхуми"
 SIA_gripen_squadrons_rearm_desc: "Истребители Gripen, самолёты ДРЛО, средства противовоздушной обороны с передачей данных. Небольшие военно-воздушные силы, созданные для победы в первую неделю региональной войны."
 SIA_dti_self_reliance: "Самостоятельность DTI"
 SIA_dti_self_reliance_desc: "Выпускники Института оборонных технологий переходят от научных работ к производству. Тайские винтовки, тайская бронетехника, тайские ракеты, и никакое эмбарго не остановит то, что мы создаём сами."
 SIA_thai_yai: "Наши братья Тай Яй"
 SIA_thai_yai_desc: "Шаны Бирмы говорят на языке, понятном тайцам. Их ополчения воюют с Рангуном не одно поколение. Им не хватает лишь покровителя и флага, под которым сражаться."
 SIA_mekong_destiny: "Судьба на Меконге"
 SIA_mekong_destiny_desc: "Сайньябули и Чампасак еще совсем недавно были сиамцами, а лаосцы — ближайшие родственники тайцев. Река, разделяющая нас, могла бы протекать через одну страну."
 SIA_preah_vihear: "Храм принадлежит нам."
 SIA_preah_vihear_desc: "Решение Международного суда 1962 года по Прэахвихеару до сих пор жжёт сердца многих тайцев. На памяти живущих над Баттамбангом и Сиемреапом развевался тайский флаг. Пограничные споры с Пномпенем перестают быть управляемыми и заново поднимают старые обиды."
 SIA_lost_sultanates: "Договор 1909 года недействителен."
 SIA_lost_sultanates_desc: "Келантан, Теренггану, Кедах, Перлис. Подданные Бангкока перешли под власть Британской империи без консультации с ни одним жителем. Осуждаем англо-сиамский договор."
 SIA_suwannaphum: "Суваннапхум Юнайтед"
 SIA_suwannaphum_desc: "Суваннапхум, Золотая земля древности, вновь едина под тайским флагом. Начать включение возвращённых территорий в состав Королевства."
 SIA_victory_monument: "Новый монумент Победы"
 SIA_victory_monument_desc: "Обелиск на улице Ратчавити установлен в память о погибших в 1940-41 годах, последней войне за утраченные территории. Постройте его преемника, и пусть регион сам сделает выводы."
 SIA_thailand_4_0: "Таиланд 4.0"
 SIA_thailand_4_0_desc: "Все с добавленной стоимостью. Робототехника, биотехнологии, цифровые услуги. Четвертая промышленная революция, спланированная из Дома правительства и доказавшая свою эффективность в Восточном экономическом коридоре. Каждая провинция получает дивиденды от повышения производительности благодаря реализации национальной стратегии."
 SIA_three_airport_rail: "Железнодорожная линия, соединяющая три аэропорта"
 SIA_three_airport_rail_desc: "Дон Муанг, Суварнабхуми, У-Тапао — все они соединены одной высокоскоростной линией, прохождение которой занимает час. Это самая дорогая железная дорога в истории Таиланда и основа Восточного экономического коридора."
 SIA_u_tapao_aerotropolis: "Аэротрополис У-Тапао"
 SIA_u_tapao_aerotropolis_desc: "Аэродром ВМС США времен войны во Вьетнаме превращается в транспортный узел с пассажиропотоком в 60 миллионов человек, с ангарами для технического обслуживания, зоной свободной торговли и процветающим городом, построенным вокруг этой взлетно-посадочной полосы."
 SIA_eastern_aviation_city: "Восточный Авиационный Город"
 SIA_eastern_aviation_city_desc: "Взлетно-посадочная полоса была лишь началом. Airbus и Thai Airways разместили в свободной экономической зоне комплекс по техническому обслуживанию и ремонту самолетов, авиационная академия готовит механиков, а грузовые терминалы превращают У-Тапао в региональную аэрокосмическую мастерскую, а не только в его въездные ворота. Высокооплачиваемая работа, и обеспечивать ее всем необходимым — задача непростая."
 SIA_eec_take_off: "Коридор набирает обороты"
 SIA_eec_take_off_desc: "Заводы по производству электромобилей в Районге, биотехнологии в Чонбури, авионика в Чачонсао. Восточный экономический коридор перестает быть планом и становится регионом."
 SIA_hedge_the_bets: "Хеджирование ставок"
 SIA_hedge_the_bets_desc: "Бамбук гнется на ветру и возвращается в исходное положение. Что бы ни обещали Таиланд Вашингтон или Пекин, Таиланд не обещал ничего, что он не мог бы переосмыслить."
 SIA_armed_forces_modernization: "Королевские вооруженные силы Таиланда"
 SIA_armed_forces_modernization_desc: "Армия, флот и военно-воздушные силы под одной короной, мечом и щитом Королевства. Кризис 1997 года заморозил закупки на полпути, оставив наполовину поставленные эскадрильи и авианосец без самолетов. Возьмите вооруженные силы в свои руки и определите курс на грядущие десятилетия."
 SIA_gripen_deal: "Сделка с Gripen"
 SIA_gripen_deal_desc: "Компания Saab предлагает то, чего не предложит Вашингтон. Полная передача технологий, компенсационные соглашения в промышленном секторе, самолет раннего предупреждения Erieye — все это включено в пакет, плюс никаких лекций о государственных переворотах."
 SIA_gripen_ef_program: "Gripen E/F"
 SIA_gripen_ef_program_desc: "От проекта F-35 было отказано, а F-16 старше своих пилотов. Следующее поколение Gripen E/F сохраняет экосистему, уже знакомую тайским экипажам, и поддерживает работу шведской производственной линии."
 SIA_eyes_in_the_sky: "Глаза в небе"
 SIA_eyes_in_the_sky_desc: "Израильские беспилотные системы Searcher, Hermes и Dominator предоставляют тайским командирам то, чего им всегда не хватало в джунглях и на границах: постоянный визуальный контакт."
 SIA_chinese_steel: "Китайская сталь"
 SIA_chinese_steel_desc: "Танк VT-4 от NORINCO стоит вдвое дешевле западного танка и поставляется без каких-либо назидательных объяснений для конечного пользователя. Американские танки M60 на вооружении армии стареют, а её поставщики всё больше ориентируются на Восток."
 SIA_s26t_program: "Подводная лодка S26T"
 SIA_s26t_program_desc: "Было обещано три подводные лодки класса «Юань». Одна из них, возможно, действительно прибудет. Между немецкими двигателями, которые нельзя экспортировать, и бюджетами, которые невозможно защитить, мечта военно-морского флота о подводных лодках испытывает терпение всех."
 SIA_chakri_modernization: "Западная модернизация флагмана"
 SIA_chakri_modernization_desc: "Западный путь продолжается на борту флагмана. HTMS Chakri Naruebet, построенный в Испании и долгое время находившийся у причала в Саттахипе, получает американские и европейские боевые системы и датчики. Модернизация по стандартам НАТО, наконец, дает авианосцу королевства работу, достойную его экипажа."
 SIA_uxv_carrier_conversion: "Западное крыло беспилотника"
 SIA_uxv_carrier_conversion_desc: "Истребители «Харриер» — музейные экспонаты, но трамплин остался. Благодаря закупке западных беспилотных систем у союзных подрядчиков, флагманский корабль можно переоборудовать для запуска беспилотных летательных аппаратов, надводных кораблей и подводных лодок. Первый носитель необитаемых аппаратов в Юго-Восточной Азии, использующий технику партнеров."
 SIA_telecom_empire: "Телекоммуникационная концессия"
 SIA_telecom_empire_desc: "Спутники, мобильные сети, медиаимперия — все это процветает при правительстве телекоммуникационных магнатов. Граница между национальным лидером и семейным бизнесом никогда не была такой тонкой."
 SIA_prayuth_premiership: "Премьерство генерала"
 SIA_prayuth_premiership_desc: "Лидер переворота меняет свою форму на костюм, а титул хунты — на выборный. 250 назначенных сенаторов, голосующих за премьер-министра, упрощают расчеты."
 SIA_senate_of_appointees: "Сенат назначенных лиц"
 SIA_senate_of_appointees_desc: "Двести пятьдесят сенаторов, каждый из которых избирается военным советом, каждый из которых имеет право голоса при определении того, кто будет управлять страной. Оппозиция может победить на выборах. Завоевание власти — это уже другой вопрос."
 SIA_2020_protest_response: "Молодежь на улицах"
 SIA_2020_protest_response_desc: "Студенты вывешивают у памятников три требования и показывают жест тремя пальцами. Каждый вариант, будь то разгон протеста, диалог или отсрочка, учит следующее поколение чему-то новому о государстве."
 SIA_orange_wave: "Оранжевая волна"
 SIA_orange_wave_desc: "Новое политическое поколение организуется в интернете, финансирует себя за счет небольших пожертвований и рассматривает старые патронажные сети как проблему, которую следует искоренить, а не унаследовать."
 SIA_digital_democracy: "Цифровая демократия"
 SIA_digital_democracy_desc: "Открытые данные, онлайн-сервисы, государство, отвечающее на электронные письма. Прозрачность как инфраструктура, а инфраструктуру, в отличие от обещаний, трудно отменить."
 SIA_creative_economy: "Креативная экономика"
 SIA_creative_economy_desc: "Кино, еда, фестивали, дизайн. Тайская «мягкая сила» становится экспортным сектором, привлекающим внимание министерства и имеющим собственную финансовую отчетность."
 SIA_truth_and_reconciliation: "Истина и примирение"
 SIA_truth_and_reconciliation_desc: "Погибшие в войне с наркотиками, репрессии, без вести пропавшие Глубокого Юга. Комиссия с правом вызова свидетелей составляет официальный отчёт, потому что демократия сама ведёт летопись своих дел."
 SIA_the_2005_landslide: "Разгром на 377 местах"
 SIA_the_2005_landslide_desc: "Партия «Тай Рак Тай» получила 377 из 500 мест в парламенте, что стало крупнейшим однопартийным большинством в истории Таиланда. Представители старой элиты молча наблюдают за подсчетом голосов."
 SIA_rice_pledging_scheme: "Программа гарантированного производства риса"
 SIA_rice_pledging_scheme_desc: "В рамках флагманской программы правительства Инглук, направленной на развитие сельских районов, государство закупает рис у фермеров по ценам выше рыночных и хранит запасы. Выгоду получают деревни. Финансирование зависит от сотрудничества в установлении мировых цен."
 SIA_red_shirts_mobilized: "Улицы за избирательным бюллетенем"
 SIA_red_shirts_mobilized_desc: "Вывести сельскую базу на улицы. Сотни тысяч боевиков в красных рубашках маршируют по всему Северо-востоку, но популистская толпа, заполнившая столицу, не запугивает генералов. Она встревоживает дворец и высшее командование и дает им предлог. Столкновение, которое заканчивается танками у Дома правительства, приближается. §RРиск государственного переворота возрастает.§!"
 SIA_heartland_development: "Развивайте Красную Сердцевину"
 SIA_heartland_development_desc: "Деревни Исаана и севера страны обеспечили сокрушительную победу, и теперь они получают свою долю в виде политических решений. Новые дороги и железные дороги пересекают плато Корат и ведут в долины Чиангмая, а провинциальные управления размещают административные помещения и рабочие места там, где фактически проживает база движения, а не в столице, которая никогда за него не голосовала."
 SIA_crown_property_bureau: "Бюро по управлению государственной собственностью"
 SIA_crown_property_bureau_desc: "Бюро управляет миллиардными активами королевской семьи, от отелей и недвижимости до крупных промышленных предприятий. Для того чтобы эти доходы приносили пользу национальному развитию, необходимы тихие переговоры на самом высоком уровне."
 SIA_eastern_tigers: "Восточные тигры"
 SIA_eastern_tigers_desc: "2-й армейский округ и бронетанковые войска, «Бурафа Пхаяк», «Тигры Востока». Их преданность — это основа роялистского государства, а их командиры — это генералы нового поколения."
 SIA_buddhist_nationalism: "Буддийская нация"
 SIA_buddhist_nationalism_desc: "Военная хунта рассматривает монахов как партнеров в поддержании общественного порядка. Шафрановые одеяния на государственных церемониях, буддизм в школьной программе и негласное возведение Сангхи в ранг морального авторитета. Глубокий Юг не принимает это спокойно."
 SIA_royal_succession_managed: "Переход власти"
 SIA_royal_succession_managed_desc: "Дворец и правительство готовят переходный период за несколько лет вперед, это институциональная передача власти, а не внезапный шок. Когда заканчивается девятое правление, монархическая система передается в неизменном виде, а не рушится до своей низшей формы, период траура сокращается, и монархическая элита сплачивается вокруг нового трона. Управляемый переход обходится дешевле, чем альтернативный вариант."
 SIA_conscription_abolished: "Профессиональная армия"
 SIA_conscription_abolished_desc: "Отменить обязательную военную службу. Добровольческие силы будут меньше по численности, лучше оплачиваться и лучше подготовлены, и они будут верны Конституции, а не генералам, которые их призвали."
 SIA_open_skies_open_borders: "Открытое небо, открытые границы"
 SIA_open_skies_open_borders_desc: "Либерализуйте права на въезд, упростите визовые правила и дайте авиакомпаниям возможность конкурировать. Туристы приносят деньги, а рабочие — навыки. Граница — это главное достояние Таиланда, поэтому перестаньте относиться к ней как к крепости."
 SIA_chao_phraya_megaprojects: "Контроль над наводнениями в бассейне реки Чао Прайя и экологически чистая энергетика"
 SIA_chao_phraya_megaprojects_desc: "Река, дважды выходившая из берегов столицы, будет обуздана с помощью водохранилищ, противопаводковых сооружений и цепочки гидротурбин. Проект дорогостоящий. Следующее крупное наводнение обойдется недорого."
 SIA_asean_customs_window: "Таможенная система «Единое окно» АСЕАН"
 SIA_asean_customs_window_desc: "Необходимо унифицировать таможенные декларации, сертификаты безопасности и фитосанитарные правила среди всех членов Ассоциации. Грузовик, следующий из Чианг Рая в Куала-Лумпур, останавливается у меньшего количества окон, чем раньше."
 SIA_the_southern_question: "Южный вопрос"
 SIA_the_southern_question_desc: "Паттани, Яла и Наратхиват на протяжении целого поколения были охвачены повстанческим движением. Поджоги мечетей, обезглавливания и взрывы придорожных бомб унесли жизни тысяч людей и настроили малайско-мусульманский юг против буддийского Бангкока. Королевство больше не может рассматривать южные регионы как второстепенный вопрос в полицейской практике. Оно должно решить, как ответить на накал страстей на юге. Форма этого ответа будет определяться тем, кто будет править в Бангкоке."
 SIA_kra_gateway: "Кра Гейтвей"
 SIA_kra_gateway_desc: "Столетняя мечта возвращается на стол кабинета министров, но на этот раз с подведением итогов. Создана комиссия по оценке целесообразности, на перешеек направлены землемеры, и в Сонгкхле освобождается первое место для строительства общего здания. Пока ничего не решено окончательно. Следующее решение — кто, если вообще кто-либо, будет за это платить."
 SIA_kra_patron_china: "Финансирование в рамках ОПОП"
 SIA_kra_patron_china_desc: "Предложение Пекина — самое дешевое из всех, что были предложены, с полным финансированием в рамках инициативы «Один пояс и один путь», китайскими инженерными командами и каналом «под ключ» в рекордно короткие сроки. Условия сейчас выгодные, но в будущем — обременительные. Долг выражен в юанях, залогом является сам канал, и может наступить день, когда Пекин потребует погашения кредита."
 SIA_kra_patron_japan: "Японская качественная инфраструктура"
 SIA_kra_patron_japan_desc: "JICA и консорциум японских мегабанков строят медленно, дорого и безупречно. Никакой долговой ловушки, никаких скрытых пунктов об аренде, только более высокая первоначальная стоимость и партнер, который ожидает получить отдачу в виде доброй воли, а не только в батах. Соответственно, уважение Токио к Бангкоку растет."
 SIA_kra_patron_consortium: "Международный консорциум"
 SIA_kra_patron_consortium_desc: "Многосторонний консорциум под руководством Азиатского банка развития распределяет затраты и риски между многими участниками и настаивает на прагматичной последовательности действий, которую всегда предпочитали инженеры. Сначала поэтапное создание сухопутного моста, затем полное снижение уровня моря. Ни один кредитор не владеет узким местом, и Вашингтон, Токио и Манила от этого могут вздохнуть с облегчением."
 SIA_kra_patron_solo: "Иди сам"
 SIA_kra_patron_solo_desc: "Никаких иностранных кредиторов, никаких оговорок об иностранных правах, никакого иностранного флага у шлюзов. Королевство финансирует строительство канала из собственных средств и собственного рынка облигаций и принимает эту колоссальную стоимость как цену абсолютного суверенитета над новейшим стратегическим водным путем мира."
 SIA_kra_debt_trap_warning_tt: "Финансирование в рамках инициативы «Один пояс и один путь» сейчас недорогое, но перерасход средств на строительство открывает цепочку кризисов дефолта «§RПекин требует погашения кредита§!»."
 SIA_two_oceans_one_kingdom: "Два океана, одно королевство"
 SIA_two_oceans_one_kingdom_desc: "Последний временный барьер демонтирован. Впервые на вершине горы смешались соленые воды Андаманского моря и Сиамского залива. Таиланд теперь занимает не одну береговую линию, а две."
 SIA_kra_militarize: "Крепость на двух морях"
 SIA_kra_militarize_desc: "Канал слишком ценен, чтобы оставлять его без защиты. Береговые батареи, укрепленная военно-морская база и действующий мандат на контроль за движением судов превращают водный путь в крепость, которую Королевский военно-морской флот Таиланда может удержать против любого противника. Мир замечает орудия, а плательщики сборов ворчат по поводу милитаризации."
 SIA_kra_internationalize: "Канал для всех наций"
 SIA_kra_internationalize_desc: "Объявить канал Кра нейтральным международным транзитным режимом, открытым для всех флагов на равных условиях и гарантированным договором. Таиланд отказывается от права закрывать канал. Взамен он получает поток судов, инвестиции и тихую благодарность всех морских держав, опасавшихся узкого места в руках одной страны."
 SIA_gateway_of_asia: "Ворота Азии"
 SIA_gateway_of_asia_desc: "Раньше корабли проходили мимо Таиланда. Теперь они останавливаются здесь. Завершить трансформацию необходимо за счет международных инвестиций, более глубокого порта на юге и, если будет выбран маршрут канала, обязательного патрулирования, которое обеспечит безопасность этого узкого места для всех, кто платит пошлину."
 SIA_ghosts_of_the_jungle: "Призраки джунглей"
 SIA_ghosts_of_the_jungle_desc: "В глубине холмов Исана и северного высокогорья кадры Коммунистической партии Таиланда так и не исчезли по-настоящему. Они преподавали в деревенских школах, вели работу в профсоюзах, помнили. Теперь, когда страна трещит по швам, стабильность стала воспоминанием, а правительство разговаривает только само с собой, их слово находит новое поколение, готовое его услышать.\n\nВыбор красного пути закрывает любой иной политический путь, на котором находилось Королевство."
 SIA_isaan_soviets: "Советы Исаана"
 SIA_isaan_soviets_desc: "Северо-восток — это сердце региона, самый бедный регион, наиболее политически неспокойный, тот, к которому бангкокская элита всегда относилась как к источнику дешевой рабочей силы и дешевых голосов. Сельские комитеты, профсоюзные залы и кооперативные советы становятся организационным каркасом движения. Партия не требует лояльности. Она просит людей управлять собой и наблюдать за тем, что происходит."
 SIA_general_strike: "Всеобщая забастовка"
 SIA_general_strike_desc: "Чтобы это движение стало чем-то большим, чем просто сельской сноской, оно должно парализовать города. Докеры, рабочие заводов, водители автобусов, учителя — все должны выйти на протест одновременно. Риск огромен. Если правительство не сможет функционировать достаточно долго, оно либо капитулирует, либо усилит давление. Середины нет."
 SIA_general_strike_tt: "Объявляет всеобщую забастовку и открывает решения §YКрасного пути§! на 365 дней.\n - Доведите накал забастовки до §Y100§! — и правительство капитулирует, открывая мирный путь к власти\n - Остановка работы стоит §R0.5%§! стабильности за каждую неделю\n - Если 365 дней закончатся, а до 100 не хватит, генералы раздавят забастовку и возьмут власть переворотом"
 SIA_people_seize_power: "Народ захватывает власть"
 SIA_people_seize_power_desc: "Со старым правительством покончено — рухнуло ли оно в ходе переговоров или на поле боя. Новая власть в стране — Коммунистическая партия Таиланда. О новом флаге ещё не договорились, но государственный аппарат уже в руках людей, которые десятилетиями в джунглях размышляли, как им распорядиться."
 SIA_land_to_the_tiller: "Земля в руках земледельца"
 SIA_land_to_the_tiller_desc: "Обширные поместья Центральных равнин, рисовые поля Исаана, каучуковые плантации Юга. Система, породившая их, исчерпала себя. Перераспределение земли, реальное перераспределение, а не государственная схема, которая прекратит свое существование с приходом следующего правительства, — это одновременно и обещание движения, и его самый опасный акт. Семьи, владевшие этими поместьями, не уйдут без боя."
 SIA_five_year_plan: "Пятилетний план"
 SIA_five_year_plan_desc: "Рынок распределил выпуск страны ни справедливо, ни равномерно. Новое государство будет распределять осознанно. Заводы, сталь, химия, станки — всё планируется из центра и строится трудом мобилизованной нации. Торговый дефицит превращается в структурный избыток физического капитала. Цена, видная уже в статистике потребительских товаров за первый год, — изоляция."
 SIA_red_chakri_dilemma: "Дилемма Чакри"
 SIA_red_chakri_dilemma_desc: "Вопрос, который руководство партии откладывало так долго, как могло, больше нельзя обходить стороной. Каково конституционное положение монархии в коммунистическом Таиланде? История предлагает два прецедента судьбы королевского института."
 SIA_positive_trade_relations: "Позитивные торговые отношения"
 SIA_nuclear_proliferation_concern: "Тайское обогащение урана"
 SIA_nuclear_proliferation_tt: "§RВсе страны за пределами наших союзов с тревогой смотрят на новую тайскую программу обогащения урана.§!"
 SIA_tt_has_reclaimed: "Мы владеем возвращённой территорией, которая ещё не интегрирована."
 SIA_tt_has_unpacified_reclaimed: "Восстановленная территория по-прежнему не соответствует требованиям §Y90%§!."
 SIA_tt_has_corable_reclaimed: "Возвращенная территория соответствует или превосходит уровень соответствия §Y80%§!."
 SIA_bamboo_curtain: "Бамбуковая занавеска"
 SIA_bamboo_curtain_desc: "Революция в Таиланде не может существовать как изолированный эксперимент. Вьетнам и Лаос — соседи, попутчики и потенциальные партнеры. Региональная солидарность, основанная на взаимном признании и скоординированном сопротивлении экономическому давлению Запада, является архитектурой устойчивого революционного государства в Юго-Восточной Азии."
 SIA_protracted_peoples_war: "Затяжная народная война"
 SIA_protracted_peoples_war_desc: "Партия 1970-х не победила в городах. Своему ремеслу она выучилась в холмах, где власть Бангкока была тонка, а винтовка значила больше манифеста. Создать опорные районы в высокогорье и дать деревне окружить город. Там, где всеобщая забастовка ставит на то, что города дрогнут, этот путь решает вопрос силой оружия.\n\nПартия выходит на поле: §RКоммунистическая партия Таиланда§! поднимается против правительства, а вы командуете восстанием. Требуется §Y20%§! поддержки партии, стоит §Y150§! политической мощи."
 SIA_peoples_tribunals: "Народные трибуналы"
 SIA_peoples_tribunals_desc: "Революция, не способная защитить себя, длится лишь сезон. Доносчики, финансисты и полковники, выжидавшие, куда подует ветер, всё ещё на своих местах. Революционные суды, как упрощенные, так и публичные, решают вопрос о лояльности ещё до того, как его можно будет задать партии."
 SIA_broad_united_front: "Широкий Объединенный Фронт"
 SIA_broad_united_front_desc: "Революция, правящая страхом, каждый год управляет всё меньшей страной. Более сложный путь — это согласие. Соберите под одним шатром крестьянские лиги, профсоюзы, реформаторскую интеллигенцию, мелких торговцев и деревенских монахов, и пусть они почувствуют, что построили новое государство, а не пережили его. Власть на бумаге разделена, а на практике охраняется, но движению, способному править по соглашению, не нужно править с помощью оружия."
 SIA_peoples_army: "Народная армия"
 SIA_peoples_army_desc: "План построил заводы — теперь он куёт щит. Революционному государству во враждебном регионе нужна армия многочисленная и преданная, с призывниками, воспитанными по образу партии, и вооружённая из тайских арсеналов, а не чужой доброй волей. Каждый, кто способен держать винтовку, — гражданин-солдат, и каждая мастерская, способная выточить ствол, — звено в цепи снабжения. Соседи дважды подумают, прежде чем что-то предпринять."
 SIA_socialist_education: "Каждый учит каждого"
 SIA_socialist_education_desc: "План уже построил заводы. Теперь он готовит людей, которые будут ими управлять. Массовая кампания по повышению грамотности достигает последней деревни в Исаане, а кадровые школы превращают крестьян в инженеров, а клерков — в администраторов, которые отвечают за свои заслуги, а не за то, от кого они родились. Грамотное, организованное население труднее обмануть и дешевле управлять им, а гниль патронажа, которая подорвала старое королевство, не находит себе места для пускания."
 SIA_the_beijing_road: "Пекинская дорога"
 SIA_the_beijing_road_desc: "У выживания есть спонсор, и сидит он в Чжуннаньхае. Принять объятия Пекина целиком: китайцы достроят наши промышленные планы, китайские рынки заменят закрытые Западом, а над нами ляжет тень великой державы, которую не оспорит ни один сосед. Цена написана мелким шрифтом. Голос Китая в тайских советах звучит громче, чем прежде допустил бы любой таец. Младший партнёр — всё же партнёр, а сытая нация переживёт гордую."
 SIA_indochina_federation: "Индокитайская федерация"
 SIA_indochina_federation_desc: "Или отказаться от роли клиента и занять роль лидера. Лаос, Вьетнам и Камбоджа — три революции, пролившие кровь за одну и ту же идею, ни одна из которых не была связана с промышленностью Таиланда или его центральным положением. Федерация трех рек, где Бангкок является старшим партнером, а не младшим партнером Пекина, превращает Юго-Восточную Азию в объект переговоров, а не раздела. Это более серьезная и более гордая позиция."
 SIA_kingmaker_coalition: "Коалиция «Создатель королей»"
 SIA_kingmaker_coalition_desc: "Партия «Бхумджайтай» Анутина Чарнвиракула обладает решающим голосом на парламентских выборах 2019 года. Формирование коалиции с ними влечет за собой сокращение министерских постов и политические уступки, но также обеспечивает правящее большинство и доступ к сельской базе партии на северо-востоке страны."
 SIA_cannabis_decriminalized: "Декриминализация каннабиса"
 SIA_cannabis_decriminalized_desc: "В 2022 году Бхумджайтхай приняла ключевую политику, исключив каннабис из списка наркотических веществ. Фермеры в Бурираме и по всему Исаану переходят на новую товарную культуру. Доходы казначейства растут. Консерваторы предупреждают о моральном риске. И те, и другие правы."
 SIA_million_rai_farms: "Один миллион рай современных ферм"
 SIA_million_rai_farms_desc: "Платформа развития сельских районов Bhumjaithai внедряет точное орошение, сертификацию контрактного земледелия и субсидии на пересадку каучуковых деревьев на юге страны. Северо-восток получает новые отрасли промышленности, а юг — расширение плантаций. Экспорт сельскохозяйственной продукции Таиланда растет."
 SIA_defence_industry_act: "Закон об оборонной промышленности"
 SIA_defence_industry_act_desc: "Правовая рамка для отечественного оборонного производства: преимущество при закупках для систем местного изготовления, обязательная передача технологий по всем иностранным контрактам и оборонно-промышленный секретариат внутри министерства. Первый завод, который из этого вырастет, будет скромным. Институциональная основа — нет."
 SIA_dti_expansion: "Расширение DTI"
 SIA_dti_expansion_desc: "Институт оборонных технологий получает финансовые вливания и поручение на разработку прототипов ракет, барражирующих боеприпасов и модернизированной бронетехники. Предприятие в Исаане переходит из стадии конструкторского бюро в производственную линию, и параллельно с ним запускается новая линия по выпуску вооружений. Научные бонусы выделяются после выпуска техники."
 SIA_chaiseri_and_friends: "Чайзери и друзья"
 SIA_chaiseri_and_friends_desc: "Первый бронеавтомобиль MRAP компании Chaiseri Metal and Rubber уже продан в Индонезию и на Филиппины. Благодаря принятию Закона об оборонной промышленности, группа частных поставщиков оборонной продукции, в которую входят Chaiseri, Thonburi Automotive и Thai Optical, расширяется. То, что начиналось как внутренние закупки, перерастает в экспорт, и собственная производственная линия Chaiseri наращивает объемы производства за счет выручки."
 SIA_arms_exporter: "Арсенал стран АСЕАН"
 SIA_arms_exporter_desc: "Таиланд создал производственную базу, правовую базу и экспортные связи, чтобы стать предпочтительным поставщиком вооружений второго эшелона в регионе. Не танки и истребители, а бронированные машины повышенной проходимости, артиллерийские взрыватели, беспилотники и боеприпасы. Надежные, доступные по цене, с доставкой в срок. Повторяющиеся экспортные контракты становятся неотъемлемой частью бюджета."
 SIA_regional_defense_pact: "Региональный оборонный пакт"
 SIA_regional_defense_pact_desc: "Экспортная отчетность стала дипломатическим инструментом. Бангкок формализует существующие соглашения о поставках вооружений со своими партнерами по АСЕАН, включая гарантированные каналы закупок, совместные программы технического обслуживания и постоянную консультативную структуру по региональной безопасности. Заводы работают на полную мощность, атташе возвращаются домой с подписанными соглашениями, а влияние Таиланда в Юго-Восточной Азии измеряется распределением боеприпасов и контрактами на поставку запасных частей."
 SIA_stream_of_the_navy: "Поток ВМФ"
 SIA_stream_of_the_navy_desc: "Королевская морская пехота Таиланда получает инвестиции в укрепление доктрины десантных операций и береговой обороны. Расширение верфи на юге страны поддерживает новую десантную эскадру. Тайские морские пехотинцы тренируются вместе со своими индонезийскими и филиппинскими коллегами в учениях, которые перестали быть чисто церемониальными."
 SIA_cavalry_of_the_sky: "Кавалерия Небес"
 SIA_cavalry_of_the_sky_desc: "Армейская авиация получает приоритет в ближайших военных бюджетах. Новые транспортные вертолёты для аэромобильной пехоты, ударные модификации для поддержки наземных действий в горах и десантно-штурмовая доктрина, признающая, что местность в Таиланде — скорее джунгли, чем степь."
 SIA_cyber_command: "Киберкомандование"
 SIA_cyber_command_desc: "Отдельное командование киберопераций по образцу американского CYBERCOM и израильского подразделения 8200. Защита сетей, радиоэлектронная разведка и — в неприметном приложении к заявке на финансирование — развитие наступательных возможностей. Если система слежки ISOC уже существует, командование наследует её и распространяет свой охват на цифровую среду."
 SIA_us_coin_legacy: "Наследие американских монет"
 SIA_us_coin_legacy_desc: "Тайская армия усвоила суровые уроки американской контрповстанческой доктрины в десятилетия после войны во Вьетнаме, включая программы обороны деревень, психологические операции и интеграцию разведывательной информации с ISOC. Эта структура до сих пор определяет методы борьбы Таиланда со своими внутренними врагами. Систематизация этих методов приносит результаты."
 SIA_development_is_security: "Развитие – это безопасность."
 SIA_development_is_security_desc: "Дороги, школы и клиники на неспокойном севере и северо-востоке — это самый дешевый способ борьбы с повстанцами. Инфраструктура, которая доходит до деревни раньше, чем это сделают повстанцы, как правило, остается там надолго. Новые железнодорожные терминалы в Исаане и на севере ускоряют реализацию всех последующих проектов."
 SIA_post_cold_war_professionalization: "Профессионализация после холодной войны"
 SIA_post_cold_war_professionalization_desc: "Холодная война сформировала офицерский корпус Таиланда в сторону антикоммунистических операций, верности внутреннему порядку и уважения к дворцу. Новое поколение офицеров, прошедших подготовку в рамках совместных учений с западными партнерами и знакомых с международным правом, переосмысливает предназначение Королевских вооруженных сил Таиланда."
 SIA_multi_domain_operations: "Многодоменные операции"
 SIA_multi_domain_operations_desc: "Поле боя больше не является линией на карте. Кибервойна, радиоэлектронная борьба, космическая съемка и высокоточные удары беспилотников сливаются с традиционными маневрами. Концепция многодоменных операций Таиланда, разработанная совместно с американскими и австралийскими партнерами, признает, что следующая война будет вестись одновременно во всех сферах."
 SIA_mdo_integration_strain: "Интеграционное напряжение"
 SIA_mdo_integration_strain_desc: "Создание междоменных командных структур, от кибербезопасности до космической съемки, требует значительных финансовых затрат задолго до того, как доктрина начнет окупаться."
 SIA_ministry_of_defence: "Министерство обороны"
 SIA_ministry_of_defence_desc: "Оборона Королевства всегда осуществлялась самими родами войск, каждый из которых отвечал за свой бюджет, свою доктрину и свою территорию. Наконец, мы создаем для нее институциональную основу: министерство, которое стоит выше армии, флота и военно-воздушных сил и объединяет территориальную оборону, политику национальной безопасности и разведку в единый аппарат, подотчетный государству."
 SIA_comprehensive_security: "Комплексная безопасность"
 SIA_comprehensive_security_desc: "Внутренние, оборонные и разведывательные ведомства десятилетиями следят за одними и теми же границами, имея три разных досье и не имея привычки делиться ими. Их объединяет одна доктрина, которая одновременно открывает три направления деятельности: экономика, внутренний фронт и вооруженные силы."
 SIA_protector_of_the_realm_focus: "Защитник Королевства"
 SIA_protector_of_the_realm_focus_desc: "После освящения Монумента Победы земли шаньцев, лаосцев, кхмеров и малайцев оказались под тайским флагом. Завоевание этих земель и управление ими — это разные задачи. Администрация на отвоеванной территории создается за гарнизонами, и начинается работа по ее умиротворению, развитию и, со временем, закреплению на ней своих границ."
 SIA_atoms_for_peace: "Атомы за мир"
 SIA_atoms_for_peace_desc: "Таиланд подписывает протоколы МАГАТЭ о мирном использовании ядерного топлива и начинает долгий путь к созданию необходимых институтов. Создан орган по ядерной безопасности, заключены соглашения об отработанном топливе и построен первый отечественный исследовательский реактор. Гражданская программа основана на убеждении, что базовая электроэнергия, получаемая из урана, дешевле, чище и более суверенна, чем нефть, импортируемая по геополитическим ценам."
 SIA_smr_initiative: "Инициатива SMR"
 SIA_smr_initiative_desc: "Малые модульные реакторы — это технология, которая делает атомную энергетику жизнеспособной для страны, не имеющей возможности позволить себе капитальные затраты на строительство полномасштабной электростанции. В рамках этой инициативы финансируются технико-экономические обоснования, оценка площадок на восточном побережье и соглашение о передаче технологий с южнокорейским или французским консорциумом. До начала строительства еще десять лет. Решение принимается сегодня."
 SIA_nuclear_power_program: "Программа развития атомной энергетики"
 SIA_nuclear_power_program_desc: "Кульминацией является национальная программа развития атомной энергетики с установленной датой ввода в эксплуатацию, суверенной системой топливного цикла и первым реактором, подключенным к энергосистеме. Таиланд становится первым государством в Юго-Восточной Азии, подключившим гражданский реактор к энергосистеме, присоединившись к Японии, Южной Корее, Китаю, Индии, Пакистану и Тайваню в числе региональных операторов атомной энергетики. Энергетическая независимость перестала быть теоретической."
 SIA_bangkok_phnom_penh_axis: "Ось Бангкок-Пномпень"
 SIA_bangkok_phnom_penh_axis_desc: "Географическое положение Камбоджи делает ее естественным экономическим коридором Таиланда к морю, а ее политическая траектория – естественным дипломатическим противовесом Бангкока Вьетнаму. Эта направленность укрепляет отношения посредством торговых миссий, дорожного сообщения и общей системы безопасности, которая удерживает Пномпень близко к Бангкоку и отдаляет его от влияния Пекина."
 SIA_jakarta_dialogue: "Джакартский диалог"
 SIA_jakarta_dialogue_desc: "Индонезия — демографический гигант Юго-Восточной Азии и важнейший центр двусторонних отношений Таиланда после Куала-Лумпура. Джакартский диалог — это платформа, объединяющая министров двусторонних отношений, совместные военные учения и откровенный разговор о том, кто возглавит АСЕАН в следующем десятилетии. Результат зависит от того, будет ли Бангкок рассматривать Джакарту как партнера или как соперника."
 SIA_asean_crossroads: "Перекресток АСЕАН"
 SIA_asean_crossroads_desc: "Перед Королевством лежат два пути. Первый — это партнерство, порядок под руководством Таиланда, связывающий АСЕАН на основе согласия. Второй — это господство, установление контроля Таиланда над Юго-Восточной Азией силой оружия."
 SIA_the_2001_election_choice_tt: "Поддержите одну из сил в кампании 2001 года. Выборы определяют, кто будет править, и путь к власти откроется только победителю.\n - £SIA_neutral_Social §YThai Rak Thai§!\n - £SIA_Nat_Autocracy §YСеть дворцов и её генералы§!\n - £SIA_western_conservative §YДействующие демократы§!"
 SIA_the_2006_coup_choice_tt: "Сентябрьский переворот заменяет правящую партию на §Y[Nat_Autocracy_L]§!. Гражданской войны не будет: армия просто забирает власть."
 SIA_a_new_republic_choice_tt: "Выберите судьбу монархии.\n - §YAbolish§!: Пережить потрясения\n - §YDraw back§!: Сохранить корону для стабильности и политической власти"
 SIA_the_southern_question_choice_tt: "Идти можно лишь по одной из трёх южных доктрин. Выбор одной навсегда закрывает две другие."
 SIA_red_chakri_dilemma_choice_tt: "Выберите ответ революции на вопрос о троне.\n - §YОтменить монархию§!: столкнуться с роялистским восстанием\n - §YСохранить конституционного монарха как символ§!: пойти по пути Лаоса и принять гнев сторонников жёсткой линии"
 SIA_lost_territories_choice_tt: "Выберите, насколько открыто будет отстаиваться ваше требование.\n - §YОткрытый ирредентизм§!: Поддержка войны ценой потери авторитета\n - §YТихий отрицаемый ревизионизм§!: Защита стабильности"
 SIA_nuclear_power_program_choice_tt: "Выберите направление топливного цикла.\n - §YБросьте вызов инспекторам§!: Обогащение, содержащее скрытое оружие, под санкциями\n - §YПримите гарантии МАГАТЭ§!: Восстановите отношения с Вашингтоном"
 SIA_prayuth_premiership_choice_tt: "Выберите, как генерал планирует свою преемственность.\n - §YУправляемый переход§!: Укрепить существующий порядок\n - §YИнституционализировать урегулирование§!: Возвращение к гражданскому облику"
 SIA_2020_protest_response_choice_tt: "Выберите ответ на протесты.\n - §YПодавление протестов§!: Подрывает стабильность и повышает риск государственного переворота\n - §YПризнание реформ§!: Спокойствие и поддержка реформаторского движения\n - §YВыждать их§!"
 SIA_found_the_pact: "Основал Организацию договора Юго-Восточной Азии."
 SIA_found_the_pact_desc: "Таиланд возрождает название, от которого отказались его основатели в 1977 году, и даёт ему регионального хозяина: Организация Договора Юго-Восточной Азии — пакт о взаимной обороне с Бангкоком в центре и соседями в качестве участников. Таиланд берёт на себя роль основателя и лидера. Флаг поднят. Пакт существует."
 SIA_invite_mainland: "Пригласите партнеров с материка."
 SIA_invite_mainland_desc: "Вьетнам, Лаос, Камбоджа и Мьянма граничат с Таиландом и сталкиваются с общими угрозами. Бангкок направляет официальные приглашения континентальным государствам, утверждая, что безопасность во внутренних районах континента зависит от общих целей, а не от конкурирующих мер."
 SIA_invite_mainland_tt: "Приглашаем наших материковых соседей присоединиться к СЕАТО.\n - Каждый сам решает, принимать ли предложение.\n - Член, принявший предложение, обретает дух, поддерживающий его приверженность пакту."
 SIA_invite_maritime: "Пригласить морских партнеров"
 SIA_invite_maritime_desc: "Индонезия, Филиппины, Малайзия, Сингапур и Бруней контролируют моря, от которых зависит торговля Таиланда. Морским партнерам предлагается присоединиться к соглашению, объединяющему архипелаг и полуостров в единое стратегическое сообщество."
 SIA_invite_maritime_tt: "Приглашает морские государства Юго-Восточной Азии присоединиться к СЕАТО.\n - Каждое из них самостоятельно решает, принимать ли приглашение.\n - Член, принявший приглашение, обретает дух приверженности пакту."
 SIA_invite_breakaways: "Пригласите пограничные государства"
 SIA_invite_breakaways_desc: "Южный Шан, Карен и Ва занимают территорию между Таиландом и сердцем Бирмы, и ни одна из этих территорий не может выжить в одиночку. Бангкок предлагает им то, чего никогда не предложит Нейпьидо: место за столом переговоров, подписание договора и статус государства, а не повстанческого движения."
 SIA_invite_breakaways_tt: "Приглашает отколовшиеся от Мьянмы государства присоединиться к СЕАТО там, где они существуют.\n - Каждое государство самостоятельно решает, принимать ли приглашение.\n - Член, принявший приглашение, обретает дух приверженности пакту."
 SIA_seato_invite_line_tt: "- §Y[THIS.GetNameDefCap]§! приглашен присоединиться к SEATO"
 SIA_seato_accession_category: "Присоединение к SEATO"
 SIA_seato_accession_category_desc: "Первая Организация Договора Юго-Восточной Азии была подписана в Маниле в 1954 году и управлялась из Бангкока, но из восьми её членов только двое были из Юго-Восточной Азии, и она распалась в 1977 году, так и не будучи активирована. Этот региональный пакт — это то, чего не было в первом: Таиланд председательствует, соседи являются членами, а гарантия распространяется на защиту Юго-Восточной Азии, а не на стратегию сдерживания кого-либо ещё. Места нужно заполнять по одному.\n\nПрежде чем приглашать каждую страну в эту организацию, оцените её готовность к сотрудничеству."
 SIA_renew_seato_invitation: "Возобновить приглашение"
 SIA_renew_seato_invitation_desc: "Отправьте делегацию обратно в [FROM.GetNameDefCap] с текстом договора и новым предложением. Отказ не является окончательным, и условия не изменились."
 SIA_seato_charm_offensive_major: "Суд [FROM.GetNameDefCap]"
 SIA_seato_charm_offensive_major_desc: "Государственные визиты, кредитная линия, стипендии для их офицеров и тайский павильон на их торговой ярмарке. Министерство иностранных дел три месяца не занимается ничем другим. Ничто из этого не является договором. Всё это облегчает подписание договора в следующий раз, когда мы об этом попросим."
 SIA_seato_charm_offensive_minor: "Суд [FROM.GetNameDefCap]"
 SIA_seato_charm_offensive_minor_desc: "Государственные визиты, кредитная линия, стипендии для их офицеров и тайский павильон на их торговой ярмарке. Министерство иностранных дел три месяца не занимается ничем другим. Ничто из этого не является договором. Всё это облегчает подписание договора в следующий раз, когда мы об этом попросим."
 SIA_courting_mission: "Заигрывание с соседями"
 SIA_courting_mission_desc: "Высокопоставленные дипломаты, министерский календарь и большая часть дискреционного бюджета сосредоточены в одной столице до окончания миссии. Все остальное в правительстве ждет своей очереди."
 SIA_seato_rec_opinion_yes: "§GМнение о Таиланде выше 40§! (+25)"
 SIA_seato_rec_opinion_no: "§RМнение о Таиланде: 40 или ниже§! (+25)"
 SIA_seato_rec_faction_yes: "§GНе принадлежит к другой фракции§! (+20)"
 SIA_seato_rec_faction_no: "§RУже в другой фракции§! (+20)"
 SIA_seato_rec_influence_yes: "§GТаиланд входит в тройку крупнейших источников влияния, контролируя 20 процентов или более.§! (+20)"
 SIA_seato_rec_influence_no: "§RТаиланд не входит в тройку крупнейших источников влияния, на него приходится 20 процентов или более.§! (+20)"
 SIA_seato_rec_threat_yes: "§GНаходятся в состоянии войны либо граничат со страной, которая находится в состоянии войны.§! (+15)"
 SIA_seato_rec_threat_no: "§RНи они, ни какая-либо страна, с которой они граничат, не находятся в состоянии войны.§! (+15)"
 SIA_seato_rec_trade_yes: "§GИмеет торговое соглашение с Таиландом§! (+10)"
 SIA_seato_rec_trade_no: "§RНет торгового соглашения с Таиландом§! (+10)"
 SIA_seato_rec_momentum_yes: "§GSEATO уже имеет три или более участников§! (+10)"
 SIA_seato_rec_momentum_no: "§RSEATO имеет менее трёх участников§! (+10)"
 SIA_seato_rec_total: "§YSEATO Восприимчивость§!: §Y[?SIA_seato_temp|0]§!/100. Они принимают приглашение в §Y60§!."
 SIA_joint_command: "Объединенное командование АСЕАН"
 SIA_joint_command_desc: "В Бангкоке создается постоянная объединенная командная структура, объединяющая доктрину, логистику и разведку всех государств-членов. Тайские офицеры занимают высшие должности, но штаб действительно многосторонний. Учения становятся оперативными. Планы воплощаются в жизнь."
 SIA_asean_rapid_reaction: "Силы быстрого реагирования АСЕАН"
 SIA_asean_rapid_reaction_desc: "Следующий шаг в рамках пакта – создание постоянной бригады быстрого реагирования, сформированной из представителей всех государств-членов и способной в течение 72 часов развернуться в любой точке Юго-Восточной Азии. Это меч пакта – маленький, быстрый и, несомненно, реальный."
 SIA_arsenal_integration: "Интеграция арсеналов АСЕАН"
 SIA_arsenal_integration_desc: "Оборонная промышленность Таиланда, уже являющаяся своего рода мастерской Юго-Восточной Азии, стандартизирует вооружение и боеприпасы во всех вооруженных силах стран-участниц. Винтовки, транспортные средства и артиллерийские снаряды тайского производства заменяют собой разнородную технику советского, китайского и западного производства. Теперь армии стран-участниц используют одни и те же пули."
 SIA_pax_aseana: "Pax Aseana"
 SIA_pax_aseana_desc: "Работа выполнена, и пакт в силе. Таиланд создал то, что не под силу ни одной внешней силе: подлинную архитектуру безопасности, укоренившуюся в регионе и достаточно сильную, чтобы сдержать любого претендента. Соседи подписали пакт, потому что хотели этого, и именно поэтому он будет действовать."
 SIA_war_economy_push: "Военная экономика подталкивает"
 SIA_war_economy_push_desc: "Страна находится в состоянии войны. Заводы, производившие товары народного потребления, переоборудуются для производства артиллерийских снарядов и стволов для винтовок. Снимается потолок военных расходов, контракты на закупки подписываются без обычных задержек, и на спешно расчищенных участках в столичном регионе Бангкока вырастают три новых завода по производству оружия."
 SIA_friends_abroad: "Друзья за границей"
 SIA_friends_abroad_desc: "Вооруженные силы Таиланда десятилетиями проводили тренировки совместно с зарубежными партнерами. Двусторонние связи, сформированные в ходе совместных учений, обмена офицерами и поставок оружия, являются негласной опорой безопасности Таиланда, менее заметной, чем альянсы, но более прочной, чем большинство других. Пришло время формализовать то, что уже работает."
 SIA_cobra_gold_focus: "Кобра Голд"
 SIA_cobra_gold_focus_desc: "«Кобра Голд» — крупнейшие ежегодные совместные военные учения в Азии, проводимые Таиландом и США. Расширение программы учений позволяет Королевской тайской армии получить доступ к американской доктрине, логистической подготовке и знакомиться с техникой, а также укрепляет позиции Бангкока как ключевого партнера Вашингтона в континентальной Юго-Восточной Азии."
 SIA_partner_japan: "Оборонные связи Японии"
 SIA_partner_japan_desc: "Реформы Японии в сфере экспорта оборонной продукции открыли новые каналы для закупок Таиланда. Токио предлагает ноу-хау в области высокоточной обработки, электронику двойного назначения и финансирование инфраструктуры, которые дополняют возможности Таиланда, не создавая политических условий, характерных для китайских или американских пакетов."
 SIA_partner_korea: "Оборонительное партнерство Республики Корея"
 SIA_partner_korea_desc: "Республика Корея за одно поколение создала конкурентоспособную оружейную промышленность. Танки К-2, истребители ФА-50 и гаубицы К9 продаются по конкурентоспособным ценам партнерам по всей Юго-Восточной Азии. Таиланд присоединяется к ним, внедряя корейские стандарты подготовки летчиков и методы промышленного производства."
 SIA_partner_australia: "Сосед Пяти Глаз"
 SIA_partner_australia_desc: "Австралия является ближайшим англоязычным партнером Таиланда и союзником США, не входящим в НАТО. Совместные учения в Андаманском море и Сиамском заливе укрепили связи между военно-морскими силами разных стран. Расширение партнерства обеспечивает оперативное взаимодействие армий и сотрудничество в области морского наблюдения, чего ни одна из стран не смогла бы достичь в одиночку."
 SIA_partner_taiwan: "Тихое оборонное сотрудничество"
 SIA_partner_taiwan_desc: "Тайваньская оборонная промышленность отличается скрытностью, технической сложностью и политической мотивацией к поиску союзников. Бангкок не признает Тайбэй, но Королевская армия Таиланда и военные Китайской Республики давно поддерживают неформальные каналы обмена оборудованием и обучения. Формализовать это сотрудничество, пусть и незаметно, — это просчитанный риск. Пекин это заметит."
 SIA_hedging_partners: "Друзья на Дальнем Востоке"
 SIA_hedging_partners_desc: "Токио, Сеул и Пекин предлагают Бангкоку то, чего Вашингтон не может: долгосрочный капитал, технологии двойного назначения, огромный соседний рынок. Ни один из них не требует эксклюзивности. Таиланд стремится к эксклюзивности во всех трех сферах и поддерживает высокие цены, отказываясь быть чьим-либо якорем или клиентом. Королевство, уже приверженное хеджированию рисков, получает от этих связей двойную выгоду."
 SIA_national_grid: "Обеспечение энергией Королевства"
 SIA_national_grid_desc: "Стремительная индустриализация Таиланда опередила развитие его энергосистемы. Восточное побережье кипит жизнью благодаря многочисленным заводам, но энергосистема устаревает, потери при передаче электроэнергии огромны, а следующее десятилетие роста требует создания прочной основы, способной выдержать нагрузку. Правительство обязуется модернизировать национальную инфраструктуру, построив новые подстанции, модернизировав линии электропередачи и возведя новые заводы в регионах, которые наконец-то смогут обеспечить электроэнергией из энергосистемы."
 SIA_renewable_push: "Развитие возобновляемой энергетики"
 SIA_renewable_push_desc: "Ветер с Сиамского залива, солнечная энергия на Центральных равнинах, малые гидроэлектростанции на севере. Географическое положение Таиланда — это богатый ресурс возобновляемой энергетики, который хронически недоиспользовался. Эта программа предусматривает ввод в эксплуатацию крупных установок возобновляемой энергетики в каждом регионе Королевства и прямое подключение их генерации к национальной энергосистеме."
 SIA_green_grid: "Зелёная сеть"
 SIA_green_grid_desc: "Возобновляемые источники энергии — это одно, а энергосеть, способная их использовать, — совсем другое. Системы хранения энергии, интеллектуальное управление и модернизированная передача электроэнергии объединяют солнечные электростанции и ветровые электростанции Королевства в надежную сеть, и каждая новая панель или турбина устанавливается быстрее на усиленной магистрали. Энергетическая независимость Королевства начинается здесь."
 SIA_fossil_fuels_deal: "Партнерство Gulf Energy"
 SIA_fossil_fuels_deal_desc: "Нефтеперерабатывающие заводы Королевства работают на нефти из Персидского залива, а электростанции сжигают импортный газ. Вместо того чтобы бороться с зависимостью, Бангкок формализует её. Долгосрочные соглашения о поставках с Саудовской Аравией, Катаром и ОАЭ обеспечивают ценовую стабильность, умеренный прирост топливной эффективности за счет модернизации электростанций и дипломатическую поддержку, которую оказывает чек."
 SIA_gulf_energy_ties: "Стратегические топливные резервы"
 SIA_gulf_energy_ties_desc: "Танкер, который никогда не выходит в море, — это электростанция, которая никогда не запускается. В южном промышленном коридоре и на восточном побережье строятся два стратегически важных хранилища топлива. Партнеры из стран Персидского залива финансируют половину строительства, а тайские инженеры возводят остальную часть."
 SIA_iron_fist_doctrine: "Доктрина Железного Кулака"
 SIA_iron_fist_doctrine_desc: "Разговоров о недовольстве больше не будет. Три провинции наводнены войсками, блокпостами и чрезвычайными полномочиями. Повстанческое движение – это проблема безопасности, и на нее будет дан единый ответ: быстро, жестко и без извинений. Мир будет протестовать. Юг будет молчать."
 SIA_martial_law_south: "Введение военного положения на юге"
 SIA_martial_law_south_desc: "Введение чрезвычайного положения переводит Паттани, Ялу и Наратхиват под военное управление. Комендантский час, обыски без ордера и задержания без предъявления обвинений становятся обыденностью на юге страны. Армия теперь может действовать на основании разведывательных данных сразу по прибытии, а население узнает цену укрывательства вооруженных людей."
 SIA_search_and_destroy: "Поиск и уничтожение"
 SIA_search_and_destroy_desc: "Спецназ и авиация проводят тактические зачистки предполагаемой сети ячеек. Операции носят решающий характер, а число жертв велико. Каждый рейд, достигший цели, немного ослабляет повстанческое движение, а каждый рейд, попавший на свадьбу, наоборот, дает им новое поколение новобранцев."
 SIA_pacification_complete: "Умиротворение завершено"
 SIA_pacification_complete_desc: "Придорожные бомбы затихли, блокпосты убраны. Мечети находятся под наблюдением, школы контролируются, и недовольство, скрывавшееся за молчанием, не угасло. Орудия замолкают, но тлеющие угли остаются."
 SIA_royal_development_projects: "Королевские проекты развития"
 SIA_royal_development_projects_desc: "По инициативе короля, модель развития, принятая короной, распространяется на юг, включая ирригацию, сельское хозяйство, дороги и кооперативы, спонсируемые королевской семьей. Посыл таков: монархия, а не повстанческое движение, обеспечивает благополучие малайско-мусульманского юга. Покровительство и присутствие, а не просто патрулирование."
 SIA_isoc_southern_command: "Южное командование ISOC"
 SIA_isoc_southern_command_desc: "Командование операций по обеспечению внутренней безопасности принимает на себя единую власть над южным театром военных действий, объединяя под одной крышей гражданско-военную координацию, обмен разведывательной информацией и аппарат «мягкой силы». Если сеть ISOC уже достаточно развита, южное командование может перейти от реагирования к упреждающему наблюдению."
 SIA_winning_hearts_royally: "Завоевывая сердца, по-королевски"
 SIA_winning_hearts_royally_desc: "Стипендии, реконструкция мечетей, зоны развития, сертифицированные по стандарту халяль, и целенаправленное возвышение местных малайско-мусульманских деятелей до уровня покровительства. Государство приходит не как оккупант, а как благодетель, и постепенно, местами, расчеты молодых людей меняются."
 SIA_southern_calm: "Южное спокойствие"
 SIA_southern_calm_desc: "Насилие утихло, уступив место контролируемому, сдержанному затишью. Нет ни договора, ни автономии, но провинции функционируют, и королевский покровитель держится. Спокойствие поддерживается присутствием и покровительством."
 SIA_peace_dialogue_initiative: "Инициатива мирного диалога"
 SIA_peace_dialogue_initiative_desc: "Бангкок официально открывает путь, аналогичный тому, что был в Куала-Лумпуре, при посредничестве Малайзии. Впервые государство садится за стол переговоров с теми, кого оно преследовало, и признает, что будущее Юга — это вопрос переговоров, а не только применения силы. Это стоит политического капитала внутри страны, но открывает путь, который никогда не смогли бы открыть пули."
 SIA_mara_patani_talks: "Переговоры с MARA Patani"
 SIA_mara_patani_talks_desc: "Начинаются официальные переговоры с головной организацией MARA Patani. На повестке дня — меры по укреплению доверия, зоны безопасности и подлинный механизм прекращения огня. Куала-Лумпур проявляет инициативу, и руководство повстанцев, хоть и раздробленное, но реальное, начинает верить в возможность урегулирования конфликта."
 SIA_autonomy_framework: "Особая автономия"
 SIA_autonomy_framework_desc: "Участники переговоров разрабатывают закон о создании специального административного аппарата для трех провинций, предусматривающий выборный региональный совет, обучение на местном языке, религиозные суды и сохранение доли доходов от развития на юге. Это самая масштабная уступка в истории Королевства, и правящие круги в Бангкоке уже мобилизуются против нее."
 SIA_pattani_peace_accord: "Паттанское мирное соглашение"
 SIA_pattani_peace_accord_desc: "Подписанное соглашение положило конец самому продолжительному восстанию в современной истории Королевства. Юг получил определенную степень самоуправления в рамках единого Таиланда, оружие было сдано, а перемещенные лица вернулись. Соглашение несовершенно, спорно и имеет историческое значение. Конфликт окончен."
 SIA_ds_tier_to_1: "§G На юге страны наступает затишье (Уровень 1, -2% стабильности).§!"
 SIA_ds_tier_to_2: "§YВ Паттани (Уровень 2, -4% стабильности, -5% политической власти) растет уровень насилия.§!"
 SIA_ds_tier_to_3: "§RЮг в огне (Уровень 3, -7% стабильности, -10% политической власти, -5% поддержки войны).§!"
 SIA_ds_intensity_down: "§GНакал мятежа [?ds_delta|0+]§!"
 SIA_ds_intensity_up: "§RНакал мятежа [?ds_delta|0+]§!"
 SIA_ds_grievance_up: "§RОбида общины [?ds_grievance_delta|0+]§!, что повышает порог накала."
 SIA_ds_grievance_down: "§GОбида общины [?ds_grievance_delta|0+]§!, что снижает порог накала."
 SIA_pacification_complete_tt: "Завершает мятеж на Глубоком Юге как §Yсиловое§! решение. Шкалы мятежа и связанные с ним решения закрываются навсегда."
 SIA_isoc_southern_command_tt: "Дополнительно §G-4§! к накалу мятежа, если §Yсеть ISOC§! уже развёрнута."
 SIA_southern_calm_tt: "Завершает мятеж на Глубоком Юге как §Yсиловое§! решение. Шкалы мятежа и связанные с ним решения закрываются навсегда."
 SIA_pattani_peace_accord_tt: "Завершает мятеж на Глубоком Юге как §Yурегулирование путём переговоров§!. Шкалы мятежа и связанные с ним решения закрываются навсегда."
 SIA_anti_narcotics_bureau: "Бюро по борьбе с наркотиками"
 SIA_anti_narcotics_bureau_desc: "Управление по контролю за наркотиками Таиланда расширено и получило дополнительные полномочия: выделен специальный бюджет, защищенные следственные полномочия и формальный мандат на преследование сетей наркоторговли, а не уличных торговцев. Бюро нацелено на цепочку поставок, от лабораторий в штате Шан до распределительных центров в Бангкоке."
 SIA_golden_triangle_interdiction: "Запрет «Золотого треугольника»"
 SIA_golden_triangle_interdiction_desc: "Приграничный регион, где сходятся границы Таиланда, Мьянмы и Лаоса, является источником большей части героина и метамфетамина, поступающих в тайские города и транзитом направляющихся на мировые рынки. Усилены подразделения пограничного патрулирования, расширено воздушное наблюдение, а также создана совместная оперативная группа с партнерами из ополчения Шан для перехвата партий наркотиков до их пересечения Меконга. Наркобароны, как всегда, адаптируются, но это повышает цену."
 SIA_anti_graft_push: "Кампания против коррупции"
 SIA_anti_graft_push_desc: "Национальная антикоррупционная комиссия получает дополнительные полномочия: расширенный мандат на проведение расследований, целевой бюджет и юридическую защиту для осведомителей. В первую очередь пресекаются нарушения в сфере закупок в оборонной, строительной и таможенной отраслях — трех наиболее прибыльных направлениях коррупции. Создание системы честных контрактов занимает больше времени, чем ее закрепление в прежних структурах. Ее внедрение требует значительных политических вложений и дестабилизирует общественность, привыкшую к старым методам."
 SIA_transparency_watchdog: "Надзорный орган по обеспечению прозрачности"
 SIA_transparency_watchdog_desc: "Создается независимое Управление по обеспечению фискальной прозрачности, подчиняющееся непосредственно парламенту, а не Министерству финансов. Обязательное раскрытие информации об активах высокопоставленных государственных служащих, отчетность о государственных закупках в режиме реального времени и портал для аудита граждан устраняют лазейки, позволявшие систематическому извлечению ренты. Коррупция не исчезает, но ее поддержание становится значительно дороже, и в течение шести месяцев сети, которые она выявляет, сопротивляются посредством процедур и задержек."
 SIA_watchdog_backlash: "Машина даёт отпор"
 SIA_watchdog_backlash_desc: "Разоблаченные новым режимом прозрачности сети никуда не исчезли. В течение шести месяцев они борются с реформами, используя процедурные методы, затягивая процесс и тайное препятствование, истощая политическую власть и, в провинциях, наиболее тесно с ними связанных, подрывая доверие общественности."
 SIA_decentralize_governance: "Расширить полномочия провинций"
 SIA_decentralize_governance_desc: "В результате антикоррупционной кампании полномочия по управлению и распределению бюджетных средств перераспределяются из Бангкока в провинции. Провинциальные административные организации получают расширенные полномочия, избранные губернаторы контролируют расходы на местную инфраструктуру, а Чиангмай, Кхон Каен и Сонгкхла становятся подлинными второстепенными центрами экономической активности. Рост замедляется, но более спокойный и устойчивый темп обеспечивает стабильность страны."
 SIA_bangkok_primacy: "Бангкок Первый"
 SIA_bangkok_primacy_desc: "Вырученные от борьбы с коррупцией средства реинвестируются в столицу. Промышленные районы Бангкока модернизируются, научно-исследовательские институты концентрируются в одном месте, а инфраструктура общественного транспорта расширяется. Эффективность и объемы исследований резко возрастают, но критики отмечают, что процветание сосредоточено в десятимиллионном городе, в то время как провинции ждут, и порождаемое этим недовольство серьезно негативно сказывается на настроении в стране."
 SIA_asean_hegemony: "Гегемония АСЕАН"
 SIA_asean_hegemony_desc: "Проект «Великий Таиланд» завершен на материковой части. Теперь Королевство обращает свой взор на остальную часть Юго-Восточной Азии. АСЕАН всегда был проектом, возглавляемым Таиландом, по духу. Пусть он станет таковым и на практике, если потребуется, мечом. Генеральный штаб разрабатывает планы действий на случай подчинения архипелага и города-государства."
 SIA_maritime_claims: "Морской рубеж"
 SIA_maritime_claims_desc: "За перешейком лежат великие архипелажные государства: Манила, Джакарта и богатый нефтью султанат Бруней. Для проведения операций в открытом море потребуется вся мощь Королевского военно-морского флота и морской пехоты Таиланда. Адмиралтейство начинает планировать десантные операции в Южно-Китайском море и на подходах к Яве."
 SIA_maritime_claims_threat: "Наращивание военно-морских сил Таиланда на архипелаге"
 SIA_claim_philippines: "Подчинить Филиппины"
 SIA_claim_philippines_desc: "Филиппинский архипелаг контролирует восточные подходы к Южно-Китайскому морю. Подчинение Манилы власти Бангкока обеспечивает морской фланг и труд ста миллионов филиппинцев для нового порядка. Мы заявляем свои права на каждый остров Республики."
 SIA_claim_indonesia: "Подчинить Индонезию"
 SIA_claim_indonesia_desc: "Индонезия — гигант юга, раскинувшаяся на обширных территориях, густонаселенная и богатая ресурсами. Чтобы покорить АСЕАН, Бангкок должен покорить Джакарту. Путь будет долгим, а островов много, но наградой станет крупнейшая экономика и население в Юго-Восточной Азии."
 SIA_claim_brunei: "Захватить Бруней"
 SIA_claim_brunei_desc: "Крошечный Бруней расположен на территории, обладающей одними из самых богатых запасов углеводородов в регионе. Богатство султаната и его стратегическое положение на Борнео делают его непреодолимой добычей. Мы предлагаем включить султанат в состав Королевства."
 SIA_mainland_claims: "Урегулирование на материке"
 SIA_mainland_claims_desc: "Две державы на материке до сих пор не склонили колени. Вьетнам, давний соперник по другую сторону Аннамского хребта, и Сингапур, богатый город-государство, охраняющий Малаккский пролив. Обе должны быть поставлены на колени, чтобы завершить установление первенства Таиланда в Юго-Восточной Азии."
 SIA_mainland_claims_threat: "Таиландская мобилизация против сопротивляющихся позиций на материковой части страны"
 SIA_claim_vietnam: "Подчинить Вьетнам"
 SIA_claim_vietnam_desc: "Вьетнам долгое время оспаривал территорию материковой Юго-Восточной Азии с Таиландом, начиная с дворов старого Сиама и заканчивая полями смерти XX века. Теперь историческое соперничество будет разрешено. Мы отстаиваем свои права от Меконга до Аннамского побережья."
 SIA_claim_singapore: "Захватите Сингапур"
 SIA_claim_singapore_desc: "Сингапур — жемчужина пролива, финансовый центр и привратник самого оживленного в мире морского пути. Тот, кто владеет Городом Льва, контролирует азиатскую торговлю. Мы стремимся сделать его тайским."
 SIA_asean_protector: "Защитник АСЕАН"
 SIA_asean_protector_tt: "Путь партнерства открыт для любого правительства, включая §Yмандат Большого Таиланда§!."
 SIA_asean_protector_desc: "Великий Таиланд не обязательно должен быть империей завоеваний. Обеспечив безопасность материковой части страны, Королевство может вместо этого стать гарантом безопасности Юго-Восточной Азии, доброжелательным гегемоном, защищающим своих соседей, а не аннексирующим их. Бангкок распространяет свою защиту на весь регион, связывая АСЕАН с тайской короной посредством союза, а не оккупации."
 SIA_guarantee_maritime: "Щит архипелага"
 SIA_guarantee_maritime_desc: "Таиланд предоставляет официальные гарантии безопасности морским государствам: Филиппинам, Индонезии и Брунее. Королевский военно-морской флот Таиланда будет гарантировать их независимость, а взамен Бангкок станет незаменимой державой в южных морях."
 SIA_guarantee_mainland: "Хранитель материка"
 SIA_guarantee_mainland_desc: "Бангкок гарантирует безопасность Вьетнама, Сингапура и Малайзии, положив конец многовековому соперничеству благодаря урегулированию конфликта под руководством Таиланда. Старый враг, богатый город-государство и соседний полуостров находятся под защитой Королевства, а материковая часть страны живет в мире на условиях Таиланда."
 SIA_guarantee_indochina: "Зонт над Индокитаем"
 SIA_guarantee_indochina_desc: "Самые бедные и уязвимые соседи Таиланда — это те, кого гегемон обычно обходит стороной. Бангкок, тем не менее, гарантирует им защиту: Лаосу, Камбодже и Мьянме, а также приграничным бирманским государствам, где они находятся. Защита, которая распространяется на слабых, — единственный вид защиты, который доказывает, что Королевство действительно выполняет свои обещания."
 SIA_protector_of_asean_focus: "Один АСЕАН, один Щит"
 SIA_protector_of_asean_focus_desc: "Одного подписанного соглашения достаточно, чтобы изменить политическую динамику региона. Какую бы гарантию Бангкок ни предоставил первой, Королевство выступает в роли защитника Юго-Восточной Азии, и возглавляемая Таиландом архитектура безопасности начинает заменять прежний баланс страха. Оборона региона становится неделимой, и Бангкок играет в ней ключевую роль."
 SIA_professional_officer_corps_focus: "Профессиональный офицерский корпус"
 SIA_professional_officer_corps_focus_desc: "Фракция реформаторов выигрывает спор. Продвижение по службе на основе компетенций, реальная система подготовки кадров в штабных училищах и командная культура, основанная на доктрине, а не на покровительстве. Привычка к переворотам исчезает, поскольку армия учится гордиться своей военной службой, а не политикой."
 SIA_martial_prestige_focus: "Слава меча"
 SIA_martial_prestige_focus_desc: "Традиционалисты одерживают верх. Вооруженные силы почитаются как душа нации, плац — как священный храм. Моральный дух и воинственность взлетают до небес, но культ военной формы удерживает генералов вблизи центра власти."
 SIA_jointness_reform: "Реформа совместного использования"
 SIA_jointness_reform_desc: "Объединенные силы командования объединяют три вида вооруженных сил в единый боевой инструмент. Благодаря объединению штабов, обмену доктринами и унификации цепочки командования, параллельная структура командования превращается в сплоченные силы, способные к операциям в различных областях."
 SIA_defense_export_office: "Управление по экспорту оборонной продукции"
 SIA_defense_export_office_desc: "Специализированное агентство, занимающееся выводом тайских систем на мировой рынок путем посредничества в заключении контрактов, организации финансирования и превращения оборонно-промышленной базы в источник дохода, а не в источник расходования бюджета."
 SIA_self_reliant_defense_base: "Самодостаточная оборонительная база"
 SIA_self_reliant_defense_base_desc: "Новые заводы по производству оружия и углубление цепочки поставок освобождают Королевство от зависимости от иностранных поставщиков. Таиланд может вооружать себя и своих клиентов на собственных заводах, по собственным проектам и в соответствии со своим собственным графиком."
 SIA_total_defense_doctrine: "Доктрина тотальной обороны"
 SIA_total_defense_doctrine_desc: "Оборона становится общенациональным делом, с расширением призыва на военную службу, регулярными учениями по гражданской обороне и укреплением тыла. Королевство готовит не просто армию, но и общество, готовое к сопротивлению."
 SIA_doctrine_professional_tt: "Обновляет §YПрофессиональные силы§! выводит идею на новый уровень и направляет Королевство по пути профессионализации."
 SIA_doctrine_prestige_tt: "Дарует §YВоенную славу§! и направляет Королевство на путь престижа, обеспечивая высокую поддержку войны и командную мощь ценой стабильности."
 SIA_national_rnd_network: "Постройте научные парки"
 SIA_national_rnd_network_desc: "Государственные лаборатории, партнерство с университетами и специализированный научный парк в Патхум Тани обеспечивают Королевству собственную научно-исследовательскую базу. Национальное агентство по развитию науки и технологий возглавляет сеть научно-исследовательских центров, которая ускоряет внедрение технологий и способствует развитию экономики в направлении создания более высокодоходных отраслей."
 SIA_civilian_rnd_center: "Центр гражданских исследований и разработок"
 SIA_civilian_rnd_center_desc: "Специализированный гражданский научно-исследовательский и опытно-конструкторский центр с лабораториями, испытательными стендами и группой инженеров, готовых решать любые задачи, стоящие перед Королевством. Четвертый исследовательский центр в противовес единственной военно-морской верфи, с которой начиналось Королевство, и место для разработки собственных проектов."
 SIA_air_rnd_center: "Центр исследований и разработок в области аэронавтики"
 SIA_air_rnd_center_desc: "Центр авионики и аэронавтики с аэродинамическими трубами, оборудованным полигоном для летных испытаний и инженерами для их обслуживания. Тайская промышленность получает возможность создавать прототипы авиационных систем на родине, вместо того чтобы покупать готовые решения за рубежом."
 SIA_army_rnd_center: "Центр исследований и разработок в области сухопутной войны"
 SIA_army_rnd_center_desc: "Наземный полигон для испытаний бронетехники, полигонов для испытаний вооружения и конструкторского бюро. Армия может разрабатывать и создавать прототипы собственной техники и оборудования, вместо того чтобы ждать поставок от иностранных поставщиков и их условий."
 SIA_gistda_space_agency: "Расширьте возможности GISTDA"
 SIA_gistda_space_agency_desc: "Агентство по развитию геоинформатики и космических технологий получает реальный мандат и реальный бюджет. Созданное для анализа спутниковых данных, GISTDA становится космическим институтом Королевства, управляя наземными станциями, обучая инженеров и предоставляя тайским исследованиям возможность наблюдать за всем с высоты птичьего полета. Небольшая космическая программа перестает быть иностранной роскошью и становится национальной возможностью."
 SIA_theos_earth_observation: "THEOS Наблюдение за Землей"
 SIA_theos_earth_observation_desc: "Первый тайский спутник дистанционного зондирования Земли, THEOS, открывает глаза королевству на орбите, составляя карты местности, отслеживая наводнения и состояние посевов, а также предоставляя разведывательным службам изображения, которые не смогут им отказать ни один сосед. Последующая программа углубляет экспертизу агентства в области оптики, передачи данных и обработки изображений, превращая необработанные данные в оперативную разведку."
 SIA_space_krenovation_park: "Парк реконструкции космоса"
 SIA_space_krenovation_park_desc: "На восточном побережье вырастает аэрокосмический индустриальный парк с чистыми помещениями, сборочными цехами и цепочкой поставок компонентов для спутников и малых ракет-носителей. То, что начиналось как научно-исследовательское агентство, теперь является основой отечественной аэрокосмической отрасли, привлекая частные фирмы и предоставляя тайскому машиностроению высокодоходный сектор."
 SIA_sovereign_launch_capability: "Суверенная возможность запуска"
 SIA_sovereign_launch_capability_desc: "Королевство намерено устранить последний пробел — способность проектировать, строить и выводить на орбиту собственные спутники, не спрашивая ни у кого разрешения. Программа запуска и создания спутниковой группировки, разработанная внутри страны, венчает два десятилетия работы, выводя Таиланд в число немногих государств, обладающих суверенным присутствием в космосе и разведывательными возможностями, неподотчетными никому другому."
 SIA_ptt_energy_champion: "PTT, Национальный чемпион в области энергетики"
 SIA_ptt_energy_champion_desc: "Государственный энергетический концерн выходит на фондовую биржу и превращается в коммерческого гиганта. Обладая значительным капиталом для IPO и мандатом на разведку месторождений от Сиамского залива до Мьянмы, PTT обеспечивает Королевству бесперебойные поставки топлива и становится крупнейшей корпорацией страны."
 SIA_scg_industrial_titan: "Siam Cement Group"
 SIA_scg_industrial_titan_desc: "Старейший и крупнейший промышленный конгломерат Королевства расширяет свою деятельность от производства цемента до нефтехимии, строительных материалов и упаковки. Портфель заказов SCG обеспечивает строительный бум и является основой внутренней цепочки поставок, без которой не может обойтись ни одна инфраструктурная программа, а налоговые поступления растут вместе с ним, даже несмотря на то, что группа все больше полагается на бюрократию, занимающуюся выдачей разрешений."
 SIA_packaging_empire: "Империя упаковки"
 SIA_packaging_empire_desc: "Упаковочное подразделение SCG выходит на биржу и закупает продукцию по всему региону, включая предприятия от Индонезии до Вьетнама, пока не начнет производить и формовать продукцию для половины Юго-Восточной Азии. Основной посыл — циклическая экономика: переработанное волокно, более легкий пластик, меньший выброс углерода. Затраты ложатся на плечи мелких типографий и производителей коробок, которых компания выкупает или продает по более низким ценам."
 SIA_cp_agribusiness_giant: "Группа компаний Чароен Покфанд"
 SIA_cp_agribusiness_giant_desc: "От комбикормовых заводов до сети 7-Eleven — конгломерат CP становится агропромышленным и торговым колоссом Таиланда. Контрактное земледелие поднимает доходы села и наполняет полки, а экспортная мощь CP разносит тайскую еду по всем рынкам Азии и Европы. Производительность товарного сельского хозяйства растёт по всей сети контрактного земледелия, а в рисовом поясе Исана появляется второй район."
 SIA_buffer_states: "Пояс буферных состояний"
 SIA_buffer_states_desc: "Вместо того чтобы поглотить их, Таиланд будет сохранять шан и каренов живыми и вооруженными, создавая своего рода буферную зону из дружественных сил, которая будет поглощать давление со стороны Бирмы, прежде чем оно достигнет Королевства. Трансграничные линии снабжения, тренировочные лагеря и негласные гарантии превращают повстанцев на границе в щит."
 SIA_protectorate_doctrine: "Доктрина протектората"
 SIA_protectorate_doctrine_desc: "Генеральный штаб выбирает более мягкий инструмент империи — не завоевания, а вассалитетизм. Приграничные государства будут взяты под защиту Таиланда как зависимые государства, а их знамена будут развеваться над столицами, подчиняющимися Бангкоку."
 SIA_annexation_doctrine: "Доктрина аннексии"
 SIA_annexation_doctrine_desc: "Никаких полумер. Приграничные территории будут полностью захвачены, их территория включена в состав Королевства, а сепаратистские правительства распущены. Бангкок предъявляет свои претензии на центральные районы земель шанов и каренов и готовит армию для их защиты."
 SIA_subdue_the_shan: "Покорите Шан"
 SIA_subdue_the_shan_desc: "Королевская тайская армия продвигается к штату Южный Шан. Останется ли он тайским протекторатом или тайской провинцией, зависит от выбранной доктрины, но в любом случае власть Бангкока распространится на Салуин."
 SIA_subdue_the_karen: "Усмирить Карен"
 SIA_subdue_the_karen_desc: "Тайские войска входят в Каренские холмы. Десятилетия убежища и спокойного покровительства заканчиваются, и теперь Королевство приходит как хозяин, чтобы управлять страной или аннексировать её в зависимости от политических решений."
 SIA_burma_breakaway_question: "Отколовшиеся государства"
 SIA_burma_breakaway_question_desc: "По другую сторону реки Салуин власть Бирмы распалась на лоскутное одеяло из вооруженных государств — шаньцев, каренов и ва. Они слабы, разобщены и находятся в пределах досягаемости Таиланда. Бангкоку предстоит решить, что эти отколовшиеся земли значат для Королевства: щит, трофей или проблема, которую нужно решить."
 SIA_subdue_the_wa: "Покорите Ва"
 SIA_subdue_the_wa_desc: "Объединенная армия штата Ва является самой грозной и наиболее пропитанной наркотиками из всех отколовшихся армий. Подчинение холмов Ва означает тяжелую борьбу, но это перекрывает канал распространения наркотиков у границ Королевства и водружает тайский флаг глубоко в приграничных районах Бирмы."
 SIA_rta_looks_abroad: "Шестьдесят лет M48"
 SIA_rta_looks_abroad_desc: "Королевская армия Таиланда до сих пор использует танки и бронетранспортеры, выпущенные еще в прошлом веке. Вопрос перевооружения уже не в том, будет ли техника вообще перевооружена, а в том, чья сталь пройдет через ворота Кората и какие связки к ней будут приварены. Новая производственная линия запускается там, где позволяют мощности."
 SIA_stryker_brigades: "Колеса Запада"
 SIA_stryker_brigades_desc: "Бригады «Страйкер», американская доктрина и логистическая цепочка, напрямую связанная с самой боеспособной армией мира. Комплект превосходен, а совместимость бесценна, но каждый снаряд оплачивается в долларах и из уважения к Вашингтону."
 SIA_eda_blackhawks: "Одежда, доставшаяся по наследству от сверхдержавы."
 SIA_eda_blackhawks_desc: "Благодаря программе реализации избыточных оборонных товаров и программе зарубежных военных продаж, отремонтированные вертолеты Black Hawk и Cobra поставляются по цене, значительно ниже прейскурантной. Эти самолеты уже использовались ранее, но возможность использования авиационной техники в рамках ограниченного бюджета – это выгодное предложение, которое становится возможным благодаря этому альянсу."
 SIA_vn1_mechanization: "БТР для каждого взвода"
 SIA_vn1_mechanization_desc: "Бронетранспортёры ВН1 и ВН16 сходят с китайского конвейера сотнями, по цене, сопоставимой со стоимостью нескольких западных машин. Пехота наконец-то передвигается на бронетехнике, и заводы, которые её производят, получают оплату до конца года."
 SIA_norinco_fires: "Полный каталог NORINCO"
 SIA_norinco_fires_desc: "Гаубицы SH1, реактивная артиллерия SR5 — весь каталог по цене «все в одном». Огневая мощь реальна, но так же реальны очереди за запчастями и поломки трансмиссий в полевых условиях. Дешевая сталь не дает спать интенданту."
 SIA_tavor_standard: "Винтовка собственного образца"
 SIA_tavor_standard_desc: "Лицензионное производство винтовки Tavor превращает тайские заводы в поставщика стандартной винтовки для армии. Никакого эмбарго, никаких очередей, никакого иностранного вето на то, кого мы вооружаем, только первый кирпичик арсенала, который подчиняется исключительно Бангкоку."
 SIA_oplot_and_rotors: "Базарная дипломатия"
 SIA_oplot_and_rotors_desc: "Украинские корпуса «Оплота», российские винты Ми-17 — всё, что рынок предлагает покупателю, не занимающему определённую позицию. Возможности поступают отовсюду одновременно и раздражают Вашингтон и Пекин в равной, но управляемой мере."
 SIA_dti_black_widow: "Паук Черная Вдова"
 SIA_dti_black_widow_desc: "Собственная разработка Института оборонных технологий — пулемет 8x8, наряду с проверенным в боях First Win Чайсери. Разработан и произведен в Таиланде, и настолько хорош, что другие хотят их купить. Арсенал начал окупать себя."
 SIA_first_army_modernized: "Новая Королевская армия Таиланда"
 SIA_first_army_modernized_desc: "Каким бы путем ни проходила перевооружение, результат наконец-то предстает на плацу. Современная Королевская армия Таиланда, переоснащенная, переподготовленная и готовая к столетию боевых действий."
 SIA_gripen_globaleye: "Глаза всего неба"
 SIA_gripen_globaleye_desc: "Система ДРЛО GlobalEye от Saab превращает несколько истребителей Gripen в сетевую силу, которая первой видит и первой стреляет. Бортовой радар — это тот множитель, который позволяет небольшим военно-воздушным силам значительно превосходить свои численность."
 SIA_j10_squadrons: "Драконы над Дон Муангом"
 SIA_j10_squadrons_desc: "Многоцелевые истребители J-10CE, выпускаемые эскадрильями, по цене, которую Вашингтон никогда не смог бы себе позволить и которую Вашингтон никогда не простит. Выбор Чэнду вместо Форт-Уорта меняет воздушное пространство Королевства и его альянсы."
 SIA_hq9_air_defense: "Крыша, усеянная ракетами"
 SIA_hq9_air_defense_desc: "Зенитные батареи большой дальности HQ-9 и FK-3 образуют своего рода зонтик над Центральной равниной. Дешевые, компактные и интегрированные. Запрет на использование территории по-китайски."
 SIA_wing_loong_uav: "Терпеливые охотники"
 SIA_wing_loong_uav_desc: "Беспилотники Wing Loong и CH-серии барражируют в течение суток и наносят удары по команде. Массированная беспилотная разведка и высокоточный удар, приобретенные по цене одной пилотируемой эскадрильи."
 SIA_f5th_super_tigris: "Новые трюки для старого тигра"
 SIA_f5th_super_tigris_desc: "Израильская авионика, радар с активной фазированной антенной решеткой и ракеты Python-5 превращают почтенный F-5 в F-5TH «Супер Тигрис». Это не новый самолет, а боевая мощь, выжатая из уже оплаченных планеров, не имеющая никакого отношения к сверхдержавам."
 SIA_dti_uav_command: "Суверенные Глаза"
 SIA_dti_uav_command_desc: "Разработанное и испытанное в стране беспилотное крыло, созданное Институтом оборонных технологий, обеспечивает Таиланду собственную разведывательную картину и возможность продавать свою продукцию соседним странам."
 SIA_air_dominance_doctrine: "Мастера тайского неба"
 SIA_air_dominance_doctrine_desc: "Независимо от оснащения, Королевские ВВС Таиланда в конечном итоге представляют собой современную, объединенную в сеть, многоцелевую силу, являющуюся хозяином воздушного пространства, которое она поклялась защищать."
 SIA_korean_frigates: "Бхумибол Стандарт"
 SIA_korean_frigates_desc: "Выбор Запада для флота. Современный фрегат DW3000 из Кореи, оснащенный западными боевыми системами, системой противовоздушной обороны и являющийся самым боеспособным надводным боевым кораблем, когда-либо находившимся на вооружении флота. Качество имеет свою цену, и Сеул называет ее в долларах."
 SIA_chinese_engine_compromise: "Китайское сердце"
 SIA_chinese_engine_compromise_desc: "Немецкие двигатели так и не появятся, а лодка ждала уже десять лет. Примите китайскую силовую установку CHD620, и подводная лодка наконец-то выйдет в море — дешево, уверенно, но с периодом доработки, во время которого инженеры будут проклинать все на свете целый год."
 SIA_type071_flotilla: "Корпуса из Худуна"
 SIA_type071_flotilla_desc: "Десантный док типа 071E и несколько патрульных кораблей китайской постройки позволяют флоту в одночасье создать десантную линию, стоимость которой сопоставима с затратами на один западный корабль."
 SIA_krabi_class_opv: "Наши собственные кили"
 SIA_krabi_class_opv_desc: "Независимый выбор для флота. Патрульный корабль класса «Краби», построенный на верфи Bangkok Dock, является воплощением суверенной судостроительной отрасли. Он развивается медленно, но не подчиняется ни одной иностранной верфи."
 SIA_european_propulsion: "Лицензированные сердца, тайские халлы"
 SIA_european_propulsion_desc: "Покупка, а не партнерство. Купить дизельные двигатели и боевые системы MTU по лицензии, один раз, а затем разобрать их до болтов и собрать остальное дома. Импортированные ноу-хау, поглощенные суверенной программой, которая ничего не должна ни одному покровителю."
 SIA_naval_self_reliance: "Фрегаты из дока Бангкока"
 SIA_naval_self_reliance_desc: "Тайские верфи теперь закладывают военные корабли собственной конструкции, располагая военно-морской оборонно-промышленной базой, которая занимается переработкой и экспортом продукции. Флот, наконец, строится внутри страны."
 SIA_command_of_the_seas: "Два залива, один флот"
 SIA_command_of_the_seas_desc: "Как бы она ни была построена, Королевский военно-морской флот Таиланда представляет собой настоящую силу, способную действовать в открытом море, контролировать Персидский залив и выходить в Андаманское море, господствуя на морях, омывающих два побережья Королевства."
 SIA_the_western_anchor: "Опорный рубеж Вашингтона в Азии"
 SIA_the_western_anchor_desc: "Армия, военно-воздушные силы и военно-морские силы — все они закупили западную технику, и этот альянс стал краеугольным камнем национальной обороны."
 SIA_the_bamboo_bloc: "В тени дракона"
 SIA_the_bamboo_bloc_desc: "Три вида вооружения, оснащенные Пекином, делают Таиланд главным клиентом Китая в регионе. Дешевое массовое производство, общая система C4ISR и влиятельный покровитель — все это ценой доверия Запада."
 SIA_strategic_autonomy: "Никому не обязан"
 SIA_strategic_autonomy_desc: "Силы, создаваемые, все больше, внутри страны и продаваемые за рубеж. Институт оборонных технологий превращается в региональный центр вооружений, и Королевство не зависит от иностранного капитала в вопросах обеспечения собственной обороны."
 SIA_the_bamboo_doctrine: "Согнуться под ветром"
 SIA_the_bamboo_doctrine_desc: "Шведские истребители, китайские танки, подводная лодка из Пекина и фрегат из Сеула. Таиланд покупает у всех и никому не принадлежит. Тростник, гнущийся в буре, переживает её. Старейшая тайская стратегия, воплощенная в боевом порядке."
 SIA_dual_use_threshold: "Порог двойного назначения"
 SIA_dual_use_threshold_desc: "У любой гражданской ядерной программы те же возможности, что нужны программе военной. Тихо освоить топливный цикл, обогащая уран под прикрытием энергетической независимости, — и Королевство сохраняет открытыми все варианты, не объявляя ни одного."
 SIA_minimum_deterrent: "Минимальный сдерживающий фактор"
 SIA_minimum_deterrent_desc: "Несколько боеголовок, не больше, но этого достаточно, чтобы ни один сосед и ни одна великая держава больше никогда не могли воспринимать Королевство как нечто само собой разумеющееся. Таиланд вступает в ядерный клуб на своих собственных условиях, и теперь кабинету министров предстоит вслух решить, для чего, по его словам, предназначены его бомбы."
 SIA_the_democrats_endure: "Демократы выстояли"
 SIA_the_democrats_endure_desc: "Демократическая партия, старейшая в Королевстве, сохраняет контроль над правительством, не поддаваясь популистской волне. Никакой сокрушительной победы, никакого харизматичного миллиардера, только терпеливое, неброское дело управления в составе широкой гражданской коалиции. Партия строит свое будущее на институтах, а не на одном лидере."
 SIA_chuan_clean_government: "Чистое правительство"
 SIA_chuan_clean_government_desc: "Во главе партии стоит «Мистер Чистота». Репутация личной неподкупности становится визитной карточкой партии, с открытыми бюджетами, профессиональными министерствами и борьбой с коррупцией. Это не будет показным, но создаст механизм, который превратит честное управление в прочную поддержку избирателей."
 SIA_rule_of_law: "Верховенство права"
 SIA_rule_of_law_desc: "Правительство, живущее в соответствии с конституцией, которую оно поклялось соблюдать. Надлежащая правовая процедура, предсказуемое управление и суды, подотчетные закону, а не казармам. Каждый переворот начинается с приостановления действия свода правил, чтобы Королевство научилось его соблюдать."
 SIA_judicial_independence: "Независимая скамья"
 SIA_judicial_independence_desc: "Необходимо оградить судебную систему как от влияния дворцовых кругов, так и от влияния генералов. Судебная скамья, на которую нельзя опереться, является самым надежным тормозом цикла роспуска и переворотов, а любимое оружие истеблишмента, судебный активизм, притупляется в самом источнике."
 SIA_strengthen_parliament: "Укрепить парламент"
 SIA_strengthen_parliament_desc: "Предоставьте избранной палате персонал, комитеты и полномочия для реального управления. Работающий законодательный орган позволяет партии править путем голосования, а не посредством чрезвычайных указов, и дает общественности возможность влиять на результаты каждой сессии."
 SIA_liberal_market_stewardship: "Либеральное управление рынком"
 SIA_liberal_market_stewardship_desc: "Надежная денежная система, открытая торговля и государство, которое регулирует, а не тратит. Демократы предлагают технократический противовес «таксиномике», где рост обеспечивается финансами, экспортом и частным предпринимательством, а не денежными субсидиями сельскому населению."
 SIA_southern_stronghold: "Южная крепость"
 SIA_southern_stronghold_desc: "Основной опорой партии является Юг, а у Юга есть свои претензии. Ответить на них нужно дорогами, школами и клиниками, а не блокпостами, финансируемыми из казны, а не обещанными на бумаге. Мир должен достигаться за счет развития, которое сохраняет лояльность сторонников и истощает ряды повстанцев."
 SIA_coalition_government: "Правительство коалиционного типа"
 SIA_coalition_government_desc: "Власть была собрана трудным путем, путем объединения партнеров, региональных блоков и небольших партий в рабочее большинство. Это медленный и компромиссный процесс, но именно против такой формы правления танкам труднее всего оправдать свои действия. Избранный порядок выживает благодаря разделению власти."
 SIA_mature_democracy: "Зрелая демократия"
 SIA_mature_democracy_desc: "Королевство переходит грань мирной передачи власти при наличии лояльной оппозиции, и общественность может считать перевороты историей. Институты важнее любой отдельной кампании: более чистое управление и прочная власть, которые можно приобрести, медленно набирая популярность в опросах, в отличие от более широкой коалиции."
 SIA_grand_coalition: "Великая коалиция"
 SIA_grand_coalition_desc: "Вместо того чтобы бороться со старым порядком, нужно его поглотить. Демократы становятся избранным лицом консервативного истеблишмента, завоевывая расположение землевладельцев и бизнеса, в то время как дворцы, бюрократия и советы директоров управляют посредством избирательных урн, а не казарм. Стабильность, купленная на основе консенсуса, ценой подпитки тех же самых патронажных сетей, против которых партия когда-то боролась."
 SIA_coalition_overhead: "Накладные расходы коалиции"
 SIA_coalition_overhead_desc: "Каждый партнер, привлеченный в большую коалицию, хочет получить свою долю. Сохранение целостности коалиции требует больше политического капитала, чем когда-либо требовалось для управления страной в одиночку."
 SIA_democrat_revival: "Возвращение демократов"
 SIA_democrat_revival_desc: "Из оппозиционного лагеря партия пробивается обратно на пост премьер-министра через коалиционные соглашения после 2019 года. Демократы снова у власти, на этот раз постаревшие, смирившиеся и полные решимости укрепить гражданский порядок."
 SIA_answer_thaksinomics: "Ответ Таксиномики"
 SIA_answer_thaksinomics_desc: "Гений Таксина был в том, что он сплотил деревню, чего Бангкок так и не сумел. Не стоит презирать деревенский фонд — лучше построить фонд получше и вытащить людей из растущих долгов и сужающихся возможностей. Программа Демократической партии по сельскому кредиту, отсрочке долгов крестьян и дешёвой медицине, запущенная раньше, чем это сделает «Тай Рак Тай», бьёт по популизму в самом его источнике, а не отдаёт деревню и возвращает власть только через суды.\n\n§GПопулистская волна отступает.§!"
 SIA_pracha_wiwat: "Народная повестка дня"
 SIA_pracha_wiwat_desc: "«Прача Виват» — это девять мер, представленных в качестве новогодних подарков. Бесплатное электричество для беднейших домохозяйств, субсидия на сжиженный газ, социальная помощь и регистрация для водителей мототакси и уличных торговцев неформальной экономики, а также возможность накопления средств для работников, не входящих в систему. Доказательство того, что либерально-консервативная партия может удовлетворять потребности, не разоряя казну.\n\n§GПопулистская волна отступает.§!"
 SIA_contest_every_election: "Оспаривать каждые выборы"
 SIA_contest_every_election_desc: "Какими бы ни были провокации, будь то сфальсифицированные досрочные выборы, амнистия для беглеца или предвзятый состав суда, партия остается в демократической игре. Она оспаривает каждые выборы и принимает каждый результат. Именно от этой дисциплины партия отказалась в 2006 и 2014 годах, и она опровергает единственное обвинение популистов, которое действительно имело место, — что демократы побеждают только тогда, когда за них побеждают солдаты и судьи.\n\n§GПопулистская волна отступает.§! И дверь на улицу закрыта навсегда."
 SIA_the_street_over_the_ballot: "Улица над избирательным бюллетенем"
 SIA_the_street_over_the_ballot_desc: "Хватит проигрывать на выборах. Партия отказывается от своих мест и выходит на улицы. Протесты парализуют столицу и делают страну неуправляемой до тех пор, пока не падет избранное правительство. Это срабатывает, и столица погружается в хаос. Генералы используют предоставленный им предлог, танки движутся вперед, и партия, которая когда-то выступала за честное гражданское правление, вспоминается как повитуха переворота.\n\n§RКоролевство переходит под военное правление. На этом демократический путь заканчивается, и новый порядок имеет свою собственную основу.§!"
 SIA_break_into_isan: "Прорыв на северо-восток"
 SIA_break_into_isan_desc: "Партия так и не предприняла структурных мер. Целое поколение демократы владели Югом и Бангкоком, а обширный, бедный Северо-Восток по умолчанию уступил Таксину. Вместо этого проведите там десятилетие. Создайте отделения, выдвиньте кандидатов, сделайте убедительное предложение по перераспределению ресурсов в Исане на его собственных условиях. Завоюйте хотя бы плацдарм в популистском центре, и прилив угаснет. Это самый трудный путь к прочной власти, и единственный, который не зависит от судов.\n\n§GС этого момента популистская волна будет набирать силу гораздо медленнее.§!"
 SIA_board_of_investment: "Расширить полномочия Совета по инвестициям"
 SIA_board_of_investment_desc: "Совет по инвестициям всегда был незаметным двигателем Таиланда, привлекающим иностранный капитал и направляющим тайские фирмы за рубеж. Дайте ему реальные полномочия и реальный бюджет. Инвестиции станут дешевле и быстрее, и каждый бат, вложенный Бангкоком за границу, вернется с большей отдачей."
 SIA_regional_trade_network: "Региональная торговая сеть"
 SIA_regional_trade_network_desc: "Превратить разрозненные двусторонние соглашения в подлинную сеть соглашений о свободной торговле в рамках АСЕАН и за ее пределами. Каждое соглашение, подписанное Таиландом, теперь приносит в казну таможенные пошлины и расширяет влияние тайской «мягкой силы» за рубежом."
 SIA_mekong_soft_power: "Мягкая сила Меконга"
 SIA_mekong_soft_power_desc: "Бангкок расположен в верховьях Меконга, а река протекает через Лаос, Камбоджу и Мьянму. Торговля, помощь и инвестиции становятся инструментами тихого лидерства в соседних странах. Теперь Таиланд может использовать свои преимущества за рубежом, а не просто защищать свои собственные."
 SIA_regional_trade_network_tt: "Теперь каждое подписанное торговое соглашение предусматривает ежемесячные выплаты из казначейства и увеличивает влияние Таиланда за рубежом, при этом оба показателя ограничены."
 SIA_trade_dividend_tt: "Таиланд получает ежемесячные дивиденды от своей сети торговых соглашений."
 SIA_trade_diplomacy_network: "Торговая дипломатия"
 SIA_trade_diplomacy_network_tt: "Влияние иностранных государств возрастает с увеличением числа подписанных торговых соглашений, но не без предела."
 SIA_crisis_modifier: "Наследие кризиса 1997 года"
 SIA_crisis_modifier_desc: "Кризис, связанный с Том Ям Кунгом, в одночасье разрушил чудо-экономику: бат резко упал, банки погрязли в невозвратных кредитах, МВФ стоит на пороге. Каждый этап восстановления заживляет часть раны. Королевство извлекает уроки из прошлого и становится более устойчивым, чем прежде."
 SIA_economy_modifier: "Тайская экономика"
 SIA_economy_modifier_desc: "Текущий отчет об экономических программах королевства: от экспортной базы и ЕЭС до национальных лидеров и цифровой трансформации. Каждая реформа и экономический подъем оставляют здесь свой след."
 SIA_military_modifier: "Королевские вооруженные силы Таиланда"
 SIA_military_modifier_desc: "Состояние войск, моряков и летчиков королевства: закупки, доктрина, подготовка и стоящая за ними оборонная промышленность. Здесь же собраны программы модернизации."
 SIA_politics_modifier: "Тайское политическое тело"
 SIA_politics_modifier_desc: "Институциональная основа тайского государственного управления: суды, парламент, бюрократия и договорённости, которые скрепляют политическую систему королевства. Реформы и ответные меры оставляют свой след."
 SIA_armed_forces_state: "Старая гвардия"
 SIA_armed_forces_state_desc: "На каждые несколько сотен солдат приходится один генерал, а точное число скрывается от парламента. Повышение по службе происходит на основе ежегодного списка перестановок, по классам и фракциям подразделений, а не по заслугам. Офицерский корпус владеет телеканалом, полями для гольфа, землей и программами социального обеспечения, в которых солдаты работают на безвозмездной основе. Боевая готовность и обучение покрывают все расходы, и фонд заработной платы только растет."
 SIA_clean_the_banks: "Очистим банки"
 SIA_clean_the_banks_desc: "Пятьдесят шесть закрытых финансовых компаний ликвидируются через Управление по реструктуризации финансового сектора, а Тайская корпорация по управлению активами списывает проблемные кредиты с баланса. Благодаря чистым балансам банки снова начинают выдавать кредиты, и строительные краны возвращаются на горизонт."
 SIA_dual_track_recovery: "Возобновить внутренний спрос"
 SIA_dual_track_recovery_desc: "Погасив долги, направьте восстановление экономики внутрь страны. Дешевые кредиты, программы поддержки сельских районов и помощь малому бизнесу позволят направить деньги в руки тех, кто тратит их быстрее всего. Рост возобновится быстро и будет стремительным, а счета и долги будут накапливаться так же быстро."
 SIA_sufficiency_path: "Устойчивое восстановление"
 SIA_sufficiency_path_desc: "Выбирайте стабильность, а не скорость. Диверсифицированное сельское хозяйство, умеренное заимствование и самодостаточная местная экономика восстанавливают более спокойную базу, способную пережить следующий кризис. Бум никогда не бывает стремительным, но работа по его ликвидации затрагивает и систему управления."
 SIA_frontier_integration: "Интегрировать границу"
 SIA_frontier_integration_desc: "Завершены кампании, и тайские солдаты удерживают плато Шан, холмы Карен и высокогорье Ва. Завоевание территорий и управление ими — это разные задачи. Мы создаем администрацию на отвоеванных маршах, закладываем первые дороги и гарнизоны и начинаем медленную работу по превращению покоренных народов в граждан. Отвоеванные земли теперь можно усмирить, освоить и со временем полностью объявить собственностью Королевства."
 SIA_the_new_order: "Новый порядок на Юге"
 SIA_the_new_order_desc: "Претензии на территории простираются от Манилы до Малаккского пролива, и там, где прошли наши армии, старые флаги спущены. Объявленная гегемония не гарантирует её сохранения. Мы создаём имперский механизм, губернаторов, гарнизоны и управления по восстановлению, чтобы захваченные провинции управлялись, а не просто оккупировались. Возвращённые земли теперь можно усмирить, освоить и навсегда включить в состав Великого Таиланда."
 SIA_industrial_estates: "Промышленные зоны"
 SIA_industrial_estates_desc: "Амата, Хемарадж и Роджана строят частные промышленные зоны вдоль восточного побережья и напрямую налаживают отношения с японскими и западными заводами. Таиланд становится центром экспортного бума, предоставляя готовые земельные участки и электросети любому прибывшему производителю."
 SIA_hard_disk_of_the_world: "Жесткий диск мира"
 SIA_hard_disk_of_the_world_desc: "Компании Seagate, Western Digital и местные поставщики, такие как Delta и Hana, превращают Таиланд в крупнейшего в мире производителя жестких дисков и ведущего экспортера электроники. Это тихий гигант, стоящий за туристическими открытками, незаметно поставляющий четверть всех накопителей в мире."
 SIA_thai_union_seafood: "Короли банки"
 SIA_thai_union_seafood_desc: "Компания Thai Union покупает Chicken of the Sea и становится крупнейшим в мире предприятием по консервированию тунца, а предприятия по переработке морепродуктов в Самут-Сакхоне превращают тайские воды и дешевую рабочую силу в глобальную империю морепродуктов. Замороженные креветки и консервированная рыба поступают на полки супермаркетов по всему миру, а рыболовецкий порт Самут-Сакхона получает военно-морскую базу, соответствующую его новому значению."
 SIA_retail_kings: "Короли розничной торговли"
 SIA_retail_kings_desc: "Компания Central Group, принадлежащая семье Чиративат, и сеть гипермаркетов перестраивают внутреннюю экономику вокруг торговых центров и современной розничной торговли. CentralWorld открывается в 2006 году, и растущий потребительский средний класс начинает тратить деньги не только на экспорт."
 SIA_beverage_empire: "Бангкокский пивовар"
 SIA_beverage_empire_desc: "Компания ThaiBev Чароена Сиривадханабхакди, производитель пива Chang и напитка SangSom, превратилась в регионального гиганта в сфере напитков и недвижимости. Из-за протестов буддистов против алкоголя компания не смогла выйти на биржу в Бангкоке, поэтому вместо этого она привлекла капитал в Сингапуре и вложила вырученные средства обратно в страну. Полученная прибыль от корпоративного налога реальна, как и вызванная ею негативная реакция на движение за трезвость."
 SIA_fta_decade: "Десятилетие соглашений о свободной торговле"
 SIA_fta_decade_desc: "Волна двусторонних торговых соглашений подпитывает экспортную машину региона. Соглашение с Австралией 2005 года, партнерство с Японией в 2007 году и соглашение с Китаем о раннем урожае сельскохозяйственной продукции — все они отменяют пошлины. Это действительно межведомственная работа, подписанная соперниками, которые мало в чем согласны."
 SIA_sugar_and_ethanol: "Сахарные бароны"
 SIA_sugar_and_ethanol_desc: "Митр Пхол и тайская группа Roong Ruang развивают плантации сахарного тростника, превращая их в сердце азиатского сахарного рынка, а сахар и маниоку – в экспортные товары и этанол для программы производства газохола. Сельское хозяйство наконец-то диверсифицируется, выходя за рамки выращивания риса, а биотопливо напрямую поступает в национальную топливную инфраструктуру."
 SIA_gems_and_gold: "Драгоценные камни и золото"
 SIA_gems_and_gold_desc: "Благодаря огранщикам из Чантабури и ювелирной торговле Бангкока Таиланд является мировой столицей огранки цветных драгоценных камней и их экспорта. Это своеобразная, высокорентабельная и экологически безопасная отрасль, которая зарабатывает твердую валюту за счет мастерства, а не масштабов, и экспортный оборот растет с каждым камнем, вывезенным из страны."
 SIA_map_ta_phut: "Мап Та Пхут"
 SIA_map_ta_phut_desc: "PTT и SCG строят свою нефтехимическую империю в Районге, и дымящиеся трубы Мап Та Пхут становятся сердцем восточного побережья. Промышленность процветает, в то время как общины, живущие рядом с заводами, платят за это загрязнением воздуха и воды, а порт, обслуживающий комплекс, наращивает свои мощности, чтобы справиться с наплывом клиентов."
 SIA_ignite_thailand: "IGNITE Таиланд"
 SIA_ignite_thailand_desc: "Правительство принимает двадцатилетнюю национальную стратегию и концепцию центра IGNITE, наконец-то объявляя ловушку среднего дохода врагом. Таиланд разбогател настолько, что рост остановился. Заработная плата выросла выше уровня дешевых заводских площадей, но так и не достигла инновационного рубежа, а Вьетнам стремительно приближается к нему."
 SIA_digital_kingdom: "Цифровое Королевство"
 SIA_digital_kingdom_desc: "Таиланд позиционирует себя как цифровой центр АСЕАН, и крупные облачные компании начинают это замечать. Оптоволоконная связь, облачная политика и молодое интернет-население превращают страну в серьезного кандидата на рынок передачи данных в регионе."
 SIA_data_center_hub: "Облачная гонка"
 SIA_data_center_hub_desc: "Amazon, Google, Microsoft и TikTok вкладывают миллиарды в центры обработки данных в Чонбури и Районге. Серверы прибывают быстрее, чем появляется электроэнергия и вода для их работы, и энергосистема начинает испытывать перегрузку."
 SIA_virtual_banks: "PromptPay и виртуальные банки"
 SIA_virtual_banks_desc: "PromptPay делает Таиланд практически безналичным расчетом: девяносто миллионов пользователей регистрируются и ежедневно совершают десятки миллионов переводов. Центральный банк выдает лицензии цифровым банкам, и деньги, которые когда-то превращались в наличные, теперь оставляют следы, которые может прочитать налоговая инспекция."
 SIA_bcg_economy: "Био-циркулярно-зеленый"
 SIA_bcg_economy_desc: "Биоциркуляционно-зеленая модель превращает биоразнообразие и сельскохозяйственную базу Таиланда в высокодоходную биоиндустрию. Биотопливо, биохимические вещества и функциональные продукты питания начинают вытеснять низкорентабельные товарные культуры, которые обрекали сельскую местность на бедность."
 SIA_future_food: "Кухня мира 2.0"
 SIA_future_food_desc: "Компания CP Foods и другие пищевые гиганты продвигаются вверх по цепочке создания стоимости, переходя к функциональным продуктам питания и альтернативным источникам белка. Таиланд прекращает продавать сырые калории и начинает продавать научные разработки, на которых они основаны."
 SIA_durian_road: "Дорога Дуриана"
 SIA_durian_road_desc: "Экспорт дуриана и тропических фруктов в Китай превышает шесть миллиардов долларов в год. Урожай доставляется на север через Лаос с помощью рефрижераторных грузовиков, в то время как Вьетнам и Малайзия борются за одни и те же полки в Гуанчжоу."
 SIA_capital_of_capital: "Капитал капитала"
 SIA_capital_of_capital_desc: "Таиландская фондовая биржа укрепляется, фонд Vayupak растет, а такие конгломераты, как Gulf, переориентируются с энергетики на цифровые технологии и финансы. Бангкок начинает функционировать не просто как транзитный пункт для капитала, а как региональный финансовый центр."
 SIA_make_thailand_investor: "Экспортер капитала"
 SIA_make_thailand_investor_desc: "Таиланд переходит от получения иностранных инвестиций к отправке собственных средств за рубеж. Central закупает продукцию в Европе, CP развивает сельское хозяйство по всему миру, а ThaiBev владеет сингапурским гигантом по производству напитков. Страна-получатель стала страной-инвестором."
 SIA_escape_the_trap: "Королевство с высоким уровнем дохода"
 SIA_escape_the_trap_desc: "Национальная стратегия приносит свои плоды, и Таиланд переходит грань и становится страной с высоким уровнем дохода. Ловушка, которая удерживала его на уровне аутсайдеров на протяжении целого поколения, наконец-то преодолена, и страна превратилась в богатое королевство."
 SIA_fta_decade_tt: "Укрепляет сеть торговой дипломатии и подписывает соглашения о свободной торговле на десятилетие."
 SIA_escape_trap_two_sectors_tt: "Требуется два из трех итоговых проектов по выбранным отраслям: центры обработки данных, пищевая промышленность будущего или страна-инвестор."
 SIA_data_center_grid_strain_tt: "Расширение сети крупных операторов создает дополнительную нагрузку на энергосистему. Инвестируйте в энергоснабжение, чтобы обеспечить бесперебойное электроснабжение."
 SIA_sufficiency_and_the_crown: "Достаточность и Корона"
 SIA_sufficiency_and_the_crown_desc: "Философия экономики достаточности короля Пумипона рождается из пепла кризиса «том ям кунг» и становится направляющим общенациональным принципом. Умеренность, самозащищённость и разумность вместо безоглядного роста. Дворец и министерство планирования говорят в один голос, а деревня, живущая по средствам, при следующем потрясении просит у государства меньше."
 SIA_sufficiency_gov_gate_tt: "§Y[communist_state_L]§! или §Y[socialism_L]§! не является правящей партией."
 SIA_new_theory_agriculture: "Новая теория"
 SIA_new_theory_agriculture_desc: "«Новая теория» короля делит крестьянский надел на рис, сад, пруд и усадьбу — цельное хозяйство, которое сперва надёжно кормит семью, а уж потом везёт товар на рынок. Рисовый пояс Исана перенимает эту модель район за районом, меняя немного экспортных объёмов на крестьянина, который не голодает и в неурожайный год."
 SIA_doi_tung_highlands: "Модель Дои Тунг"
 SIA_doi_tung_highlands_desc: "В холмах над Чианг Раем проект принцессы-матери выкорчевывает опийный мак и заменяет его кофе, макадамией и изделиями ручной работы. Старая товарная культура Золотого треугольника уступает место высокогорной экономике, которая привлекает туристов, а не наркоторговцев, — одна долина за другой."
 SIA_chaipattana_water: "Аэратор Чайпаттана"
 SIA_chaipattana_water_desc: "Аэратор, запатентованный самим королем, — дешевое лопастное колесо, которое можно позволить себе в любом деревенском пруду, — очищает воду, засоренную водорослями и отходами, в бассейне реки Чао Прайя. Это изобретение, призванное служить королевской власти, и благодаря ему рисовые поля Исаана и юга страны стали немного лучше дренироваться."
 SIA_crown_property_portfolio: "Бюро по управлению государственной собственностью"
 SIA_crown_property_portfolio_desc: "Владения Бюро, начиная от земли под башнями Siam Commercial Bank и заканчивая акциями Siam Cement Group, делают Корону одним из крупнейших землевладельцев и акционеров королевства. Управляемая как конгломерат и облагаемая налогами как конгломерат, она незаметно превосходит по доходам половину министерств, которым подчиняется."
 SIA_deepen_sufficiency: "Самодостаточное Королевство"
 SIA_deepen_sufficiency_desc: "Концепция достаточности перестает быть просто страховкой для сельской местности и становится всей стратегией. Местные цепочки поставок, умеренное потребление и настороженность по отношению к иностранному капиталу превращаются в доктрину. Автаркия обеспечивает устойчивость к потрясениям, но банкиры и конгломераты наблюдают, как снижаются их целевые показатели роста, и это их не радует."
 SIA_pragmatic_balance: "Срединный путь"
 SIA_pragmatic_balance_desc: "Достаточность не обязательно означает изоляцию. Малые и средние предприятия продолжают вести торговлю за рубежом, а принцип достаточности смягчает лишь излишества, представляя собой умеренный синтез, а не отступление. Потолок ниже, чем у полной самодостаточности, но и риск того, что она когда-либо понадобится, тоже ниже."
 SIA_resilient_kingdom: "Стойкое Королевство"
 SIA_resilient_kingdom_desc: "Корона и сельская местность, дворец и рисовые поля сплетены в единую модель устойчивости. Что бы ни принес следующий кризис, будь то валютный кризис, пандемия или шок предложения, королевство, живущее по средствам, останется целым и невредимым после его окончания."
 SIA_sufficiency_resilience: "Экономика достаточности"
 SIA_sufficiency_resilience_desc: "Умеренность, самозащита и местная устойчивость, заложенные по инициативе государства в сельской экономике."
 SIA_sufficiency_resilience_2: "Углубленная экономика самодостаточности"
 SIA_sufficiency_resilience_2_desc: "Самостоятельность, превратившаяся из системы социальной защиты в доктрину, обменяла дальнейший рост на повышение устойчивости к потрясениям."
 SIA_resilient_kingdom_idea: "Стойкое Королевство"
 SIA_resilient_kingdom_idea_desc: "Коронативное покровительство и экономика достаточности слились воедино, образовав прочный национальный буфер против следующего потрясения."
 SIA_tourism_masterplan: "Генеральный план развития туризма"
 SIA_tourism_masterplan_desc: "Туризм уже поддерживает экономику, но функционирует на основе импровизации: курорты строятся до появления хорошей инфраструктуры, отели – до появления квалифицированной рабочей силы. Национальный генеральный план устанавливает региональные цели, обеспечивает взаимодействие между министерствами и рассматривает гостиничный бизнес как отрасль, подобную любой другой."
 SIA_phuket_andaman: "Жемчужина Андаманского моря"
 SIA_phuket_andaman_desc: "Пхукет уже привлекает на свои пляжи весь мир, а новый аэропорт и улучшенные дороги позволяют острову принять гораздо больше туристов. От Андаманских островов требуется, чтобы они несли растущую долю валютных поступлений страны, и чтобы гораздо больше приезжих меняли облик побережья, на которое они прибывают."
 SIA_pattaya_eastern_riviera: "Восточная Ривьера"
 SIA_pattaya_eastern_riviera_desc: "Отели и ночная жизнь Паттайи в основном держатся на дешевой неформальной рабочей силе. Если формализовать офисную и сервисную экономику вдоль восточного побережья, каждый работник, принятый на работу по контракту, будет ожидать, что государство всеобщего благосостояния действительно оправдает его ожидания."
 SIA_chiang_mai_lanna: "Роза Севера"
 SIA_chiang_mai_lanna_desc: "Храмы, холмистая местность и неспешный темп жизни уже привлекают на север туристов с рюкзаками и цифровых кочевников. Развитие туристической инфраструктуры Чиангмая приведет к притоку толп, а вместе с этим и к росту арендной платы, которая сделает недоступными районы, которые туристы приехали посмотреть."
 SIA_rebuild_the_andaman: "После волны"
 SIA_rebuild_the_andaman_desc: "Цунами, обрушившееся на побережье Андаманского моря в День подарков, давно прошло, но последствия любых недочётов, допущенных при восстановлении, всё ещё ощущаются. Надлежащее финансирование восстановления завершает работу, которую не удалось выполнить экстренным службам, и окончательно ставит точку в этой катастрофе."
 SIA_medical_wellness_hub: "Скальпель Азии"
 SIA_medical_wellness_hub_desc: "В настоящее время частные больницы мирового класса принимают пациентов, прибывающих самолетами со всего региона. Дальнейшее развитие оздоровительного и хирургического туризма позволит тайским клиникам напрямую конкурировать с лучшими в Сингапуре по гораздо более низким ценам, в то время как местные пациенты будут ждать своей очереди, отставая от иностранцев, готовых платить больше."
 SIA_volume_tourism: "Игра чисел"
 SIA_volume_tourism_desc: "Больше рейсов, более дешевые туристические пакеты, больше прибытий. Если стремиться к увеличению общего числа посетителей, то валютные резервы растут, но пляжи и старые города, построенные для гораздо меньшего потока туристов, не выдерживают нагрузки, и местные жители ощущают последствия задолго до того, как это отразится на финансовом балансе."
 SIA_high_value_tourism: "Качество важнее количества."
 SIA_high_value_tourism_desc: "Меньше туристов, которые тратят гораздо больше. Привлечь рынок роскошных курортов и бутик-отелей вместо туристов, предпочитающих пакетные туры, обменяв количество прибывающих туристов на туристический сектор, который платит реальные налоги и переживет следующий экономический спад без потерь."
 SIA_tourism_capital: "Самое любимое место отдыха в мире"
 SIA_tourism_capital_desc: "От уличной еды Бангкока до пляжей Пхукета и храмов Чиангмая, Таиланд становится образцом развития, основанного на туризме. Министерство туризма переходит от маркетинговых кампаний к разработке постоянной промышленной политики, и соответствующие решения принимаются в соответствии с ней."
 SIA_tourism_boom: "Туристический бум"
 SIA_tourism_boom_desc: "Огромный поток прибывающих заполняет отели и аэропорты. Однако с наступлением нового сезона этот наплыв спадает."
 SIA_host_major_international_event: "Проведение крупного международного мероприятия"
 SIA_host_major_international_event_desc: "Подайте заявку на проведение саммита, всемирной выставки или крупного спортивного чемпионата, и Таиланд будет на экране каждого телеканала на планете в течение недели. Сумма реальна, но и бесплатная реклама тоже."
 SIA_new_resort_zone: "Открытие новой курортной зоны"
 SIA_new_resort_zone_desc: "Выделить зонирование и разрешение на освоение новых участков побережья или сельской местности под курортную застройку, чтобы перенаправить избыточные инвестиции с уже перенасыщенных прибрежных районов."
 SIA_global_amazing_thailand_campaign: "Глобальная кампания «Удивительный Таиланд»"
 SIA_global_amazing_thailand_campaign_desc: "Перезапустите главный слоган туристического управления с помощью новой волны зарубежной рекламы, участия в туристических выставках и привлечения влиятельных лиц в социальных сетях, которым платят за то, чтобы они выглядели так, будто прекрасно проводят время."
 SIA_baht_and_bourse: "Бат и биржа"
 SIA_baht_and_bourse_desc: "Банки Бангкока и Таиландская фондовая биржа давно вышли за рамки ростовщических лавок, существовавших ранее, но рынки капитала здесь по-прежнему более поверхностны и неформальны, чем у соседних стран, с которыми Таиланд конкурирует. Скоординированные усилия расширяют круг лиц, имеющих право привлекать и предоставлять средства, но при этом один и тот же растущий объем капитала распределяется между теми, кто быстрее сможет взаимодействовать с регулирующими органами."
 SIA_tamc_workout: "Корпорация по управлению активами"
 SIA_tamc_workout_desc: "Тайская корпорация по управлению активами была создана в 2001 году для поглощения проблемных кредитов, оставшихся после кризиса 1997 года, и в течение двух десятилетий она постепенно распродавала то, что могла, и списывала то, что не могла. Полное закрытие реестра фонда высвободит капитал, все еще заблокированный в нем, при условии, что убытки, все еще числящиеся на его балансе, будут наконец признаны, а не перенесены на следующий год."
 SIA_consumer_credit_boom: "Кредиты для простого народа"
 SIA_consumer_credit_boom_desc: "Кредитные карты, потребительские кредиты и рассрочка платежей распространились из торговых центров Бангкока в провинции, позволяя обычным домохозяйствам тратить сегодняшние деньги, рассчитывая на завтрашнюю зарплату. Потребление растет, и государственные доходы следуют за ним, но население с таким объемом новых потребительских кредитов быстро учится ожидать, что государство позаботится о погашении задолженности, когда придет время платить."
 SIA_responsible_lending: "Макропруденциальная дисциплина"
 SIA_responsible_lending_desc: "Банк Таиланда ужесточает ограничения по соотношению кредита к стоимости залога и стандарты кредитования на рынках ипотечного и потребительского кредитования, выбирая более медленный и устойчивый темп роста вместо быстрого. Банки остаются платежеспособными, а домохозяйства — в рамках своих возможностей, но доступный потребительский кредит, подпитывающий бум потребительских расходов, так и не получает возможности поступить."
 SIA_deepen_the_set: "Углубить обмен"
 SIA_deepen_the_set_desc: "Всё больше компаний размещают свои акции на Таиландской фондовой бирже, иностранные управляющие портфелями открывают новые каналы сбыта тайских акций, и рынок становится как более глубоким, так и более ликвидным. Более крупная и взаимосвязанная биржа также означает более сильный шок в тот день, когда выяснится, что аудированная отчетность зарегистрированного на бирже конгломерата стоит меньше, чем бумага, на которой она напечатана."
 SIA_vayupak_stabilization: "Фонд Ваюпака"
 SIA_vayupak_stabilization_desc: "Государственный фонд Vayupak готов покупать акции, когда индекс упадет слишком сильно и слишком быстро, обеспечивая розничным инвесторам защиту во время следующей паники. Поддержание цен на акции за счет государственных средств не равнозначно развитию экономики, стоящей за ними, и расходы на вмешательства фонда оплачиваются из того же бюджета, что и все остальное."
 SIA_bank_consolidation: "Вопрос Крунгсри"
 SIA_bank_consolidation_desc: "Японская компания MUFG владеет контрольным пакетом акций Bank of Ayudhya, что является одним из нескольких признаков консолидации банковского сектора Таиланда вокруг нескольких крупных, часто иностранных, банков, которые остаются на плаву. Более крупные балансы поглощают более сильные потрясения, но мелкие и средние кредитные учреждения, которые когда-то обслуживали мелких и средних заемщиков, продолжают исчезать, переходя в чужие филиальные сети."
 SIA_financial_center: "Передовой финансовый центр"
 SIA_financial_center_desc: "Бангкок позиционирует себя как самостоятельный региональный финансовый центр, конкурент Сингапура и Гонконга, а не просто рынок, который их подпитывает. Развитые рынки капитала, стабилизированная валютная система и консолидированный банковский сектор объединяются в центр, способный оценивать риски и привлекать капитал для всего региона, а не только для Таиланда."
 SIA_financial_center_idea: "Передовой финансовый центр"
 SIA_financial_center_idea_desc: "Развитые рынки капитала, стабилизированная валютная система и консолидированный банковский сектор обеспечивают Таиланду финансовый центр, который оценивает риски и привлекает капитал для всего региона, а не только для себя."
 SIA_the_ground_beneath: "Земля под землей"
 SIA_the_ground_beneath_desc: "Национальная геологическая служба ставит перед собой задачу каталогизировать то, что фактически находится под землей и континентальным шельфом Королевства, от калийных месторождений на северо-востоке до газоносных бассейнов Персидского залива. Узнать, что там находится, — это простая задача. Следующий шаг — решить, с какой силой нужно это извлечь и кто будет платить в случае неудачной попытки извлечения."
 SIA_extractive_drive: "Копай, детка, копай"
 SIA_extractive_drive_desc: "Разрешения выдаются быстро, и ресурсному сектору предписывается производить продукцию в максимальных объемах с минимальными задержками. Экспортные доходы растут, и лобби ископаемого топлива получает все, что запрашивало, но теперь каждой шахте и скважине требуется больше рабочих рук, чем предыдущей, и фермеры, чьи земли и водоемы находятся ближе всего к буровым работам, замечают это первыми."
 SIA_stewarded_extraction: "Шахта для нации"
 SIA_stewarded_extraction_desc: "Добыча руды осуществляется на условиях государства, а не рынка: более медленный процесс получения разрешений, реальная экологическая экспертиза и меньшая площадь, занимаемая каждой концессией. Земля отдается в меньшем объеме, чем при более свободной трактовке, но фермеры и землевладельцы, живущие рядом с карьерами и скважинами, не рассматриваются как сопутствующие жертвы."
 SIA_udon_potash: "Калийная соль Исана"
 SIA_udon_potash_desc: "Обширные калийные месторождения Исана, одни из крупнейших в мире и в значительной степени нетронутые, наконец-то введены в эксплуатацию. Новые шахты и перерабатывающие заводы обещают развитие отечественной промышленности по производству удобрений, но границы концессии проходят прямо через земли, которые мелкие землевладельцы и рисовые кооперативы обрабатывали на протяжении поколений."
 SIA_chatree_gold_tin: "Золото, олово и гипс"
 SIA_chatree_gold_tin_desc: "Комплекс Чатри и его окрестности добывают золото, олово и гипс на центральных равнинах, создавая реальный, хотя и не самый привлекательный, горнодобывающий сектор, параллельно с торговлей драгоценными камнями, которой уже славится Бангкок. Жители деревень, расположенных ниже по течению от хвостохранилищ, внимательно и все более громко следят за тем, что попадает в грунтовые воды."
 SIA_gulf_gas_oca: "Зона перекрывающихся претензий"
 SIA_gulf_gas_oca_desc: "Таиланд и Камбоджа десятилетиями позволяли богатому газом участку Персидского залива оставаться неразработанным, вместо того чтобы урегулировать вопрос о его принадлежности. Одностороннее продвижение в зоне перекрывающихся претензий означает капиталоемкое бурение на новых месторождениях задолго до того, как до берега дойдут хотя бы один кубометр газа, и при этом сосед не дал на это ни малейшего согласия."
 SIA_resource_sovereignty: "Ресурсный суверенитет"
 SIA_resource_sovereignty_desc: "Калий, цветные металлы и газ сливаются в ресурсный сектор, который подчиняется Бангкоку, а не тем, кто покупает этот участок земли. История, когда концессии продавались по частям, превращается в королевство, которому больше не нужно спрашивать разрешения на добычу ресурсов на собственной территории."
 SIA_resource_sovereignty_2of3_tt: "Завершил как минимум 2 из 3 ресурсных проектов."
 SIA_the_digital_consumer: "Цифровой потребитель"
 SIA_the_digital_consumer_desc: "В Таиланде все чаще люди совершают банковские операции, покупки и бронирования онлайн, вместо того чтобы стоять в очередях у кассы. Agoda, платформа для бронирования путешествий, выросшая из небольшого офиса на Пхукете, показывает, что местный цифровой бизнес может конкурировать с кем угодно. Создание инфраструктуры, доверия и налоговой базы в рамках этих изменений теперь стало национальным проектом."
 SIA_promptpay_rails: "PromptPay"
 SIA_promptpay_rails_desc: "PromptPay позволяет переводить деньги между номерами телефонов и национальными идентификационными номерами за считанные секунды, без посещения банковского отделения или промежуточных комиссий за перевод. Формализация такого большого количества транзакций выводит на свет часть наличной экономики, и брокеры, которые раньше получали прибыль от этой непрозрачности, сразу же это замечают."
 SIA_super_app_economy: "Супер-приложение"
 SIA_super_app_economy_desc: "Grab, LINE MAN и их конкуренты объединяют услуги такси, доставки еды и курьерской работы в одном приложении, которое уже открыто у каждого тайца. Повышение эффективности реально, но также очевидно и отсутствие каких-либо контрактов, льгот или возможности вести переговоры с водителями и пассажирами, чья работа обеспечивают функционирование этих приложений."
 SIA_ecommerce_marketplaces: "Привлечение малых и средних предприятий"
 SIA_ecommerce_marketplaces_desc: "Lazada и Shopee предоставляют мелким производителям и продавцам на рынках витрину, которая охватывает покупателей далеко за пределами их собственной провинции, а зачастую и за пределами Таиланда. Для этого необходимо строить склады и службы доставки, и их строительство в первую очередь сокращает объем услуг, которые должны предоставлять эти торговые площадки."
 SIA_national_digital_champions: "Две группы, один рынок"
 SIA_national_digital_champions_desc: "Вместо того чтобы выступать арбитром в открытом соревновании, государство поддерживает небольшое количество национальных платформ и позволяет им консолидировать рынок. Концентрированный цифровой сектор эффективно облагать налогами и легко регулировать, но рынок, на котором не осталось реальных конкурентов, имеет мало причин поддерживать честные цены."
 SIA_open_digital_market: "Разрушьте дуополию"
 SIA_open_digital_market_desc: "Антимонопольные правила и требования к открытой переносимости данных позволяют небольшим платформам конкурировать, вместо того чтобы позволить двум крупнейшим приложениям разделить рынок между собой. Потребители сохраняют преимущества реальной конкуренции за счет значительных налоговых поступлений, которые мог бы обеспечить национальный лидер."
 SIA_the_outward_turn: "Внешний поворот"
 SIA_the_outward_turn_desc: "На протяжении десятилетий тайский капитал текал в одном направлении — в заводы и отели, построенные для иностранцев. Новое поколение конгломератов теперь ищет возможности для собственного роста за рубежом, скупая доли и строя заводы в регионе, который раньше был клиентом Таиланда, а не его целевой аудиторией."
 SIA_leveraged_expansion: "Купите мир"
 SIA_leveraged_expansion_desc: "Заимствуйте средства под залог устойчивого баланса и быстро совершайте покупки за рубежом. Приобретения, финансируемые за счет заемных средств, быстро увеличивают портфель, но каждый актив, купленный в кредит, так же быстро может оказаться обесцененным."
 SIA_organic_expansion: "Выращивайте то, что у нас есть."
 SIA_organic_expansion_desc: "Вместо того чтобы брать кредиты на покупку, следует расширять то, что уже контролируется тайскими конгломератами: больше филиалов, больше производственных мощностей, больше рынков, финансируемых за счет собственных доходов. Это более медленный процесс, и он никогда не попадает на первые полосы журналов о сделках, но ничто из купленного таким образом не нужно продавать в спешке."
 SIA_cp_into_china: "Сертификат 0001"
 SIA_cp_into_china_desc: "В 1990 году Чароен Покпханд стал первым иностранным инвестором, купившим долю на вновь открытой Шанхайской фондовой бирже, получив сертификат номер 0001. Три десятилетия спустя портфель CP в Китае охватывает всё — от страховой компании Ping An Insurance до комбикормовых заводов по всей стране, — ставка, которая продолжала приносить свои плоды, даже несмотря на то, что она истощила часть того, что CP когда-то выращивала на родине."
 SIA_thaibev_conquers_asean: "Империя пивного барона"
 SIA_thaibev_conquers_asean_desc: "В 2017 году вьетнамское подразделение ThaiBev, занимающееся производством напитков, приобрело контрольный пакет акций Saigon Beer за сумму, близкую к пяти миллиардам долларов, а затем объединило сингапурскую империю Фрейзера и Нива, занимающуюся производством напитков и недвижимостью, с той же компанией. Теперь один тайский конгломерат владеет значительной долей рынка напитков в регионе."
 SIA_scg_long_son: "Подъём Лонгшона"
 SIA_scg_long_son_desc: "Нефтехимический комплекс Siam Cement Group на полуострове Лонгшон во Вьетнаме перерабатывает нафту в сырье для производства пластмасс, которое тайским заводам компании всегда приходилось импортировать. Построенный за рубежом, этот комплекс, после окончательного застывания бетона, обеспечивает более дешевую и стабильную цепочку поставок, что делает его более доступным для отечественных производителей."
 SIA_central_minor_abroad: "Торговые центры и номера за границей"
 SIA_central_minor_abroad_desc: "Central Group приобретает доли в Selfridges, KaDeWe и Illum через австрийскую Signa Group, а гостиничные бренды Minor International распространяются от Бангкока до Мальдив и Лиссабона. Тайские инвесторы в сфере розничной торговли и гостиничного бизнеса теперь владеют магазинами и вестибюлями отелей, в которых их собственные покупатели никогда не бывали."
 SIA_ptt_banpu_resources: "Бурение мира"
 SIA_ptt_banpu_resources_desc: "Месторождения PTTEP, расположенные выше по течению, простираются от Омана до Мозамбика и до вод, которые страна делит с Малайзией, а угольные концессии Банпу проходят через Австралию и Индонезию. Таиланд получает ресурсы, которых у него нет внутри страны, и эти ресурсы привязаны к тому же товарному циклу, что и ресурсы отечественной шахты."
 SIA_outbound_statecraft: "Инвестиции как инструмент государственного управления"
 SIA_outbound_statecraft_desc: "Сделки перестают быть отдельными ставками и становятся единой национальной политикой, где тайский капитал выступает как инструмент внешней политики, так и инструмент получения прибыли. Теперь специализированный офис управляет процессом приобретений, а советы директоров половины стран АСЕАН частично подчиняются Бангкоку."
 SIA_outbound_statecraft_3of5_tt: "Завершил как минимум 3 из 5 сделок по расширению за рубежом."
 SIA_thai_multinationals: "Тайские многонациональные корпорации"
 SIA_thai_multinationals_desc: "Тайские фирмы перерастают внутренний рынок и начинают вести себя как транснациональные корпорации, которым они когда-то лишь служили. Влияние за рубежом реально, но каждый бат и каждый час работы руководителя, отправленного за границу, — это время, не потраченное на развитие внутри страны."
 SIA_overseas_deal_boom: "Бум зарубежных сделок"
 SIA_overseas_deal_boom_desc: "Завершилась еще одна сделка по приобретению, и прибыль, полученная за пределами Таиланда, возвращается в трубопровод, который ее завершил."
 SIA_overseas_acquisitions_category: "Зарубежные приобретения"
 SIA_overseas_acquisitions_category_desc: "Тайские конгломераты продолжают расширять свою деятельность за рубежом. Они ищут следующую цель, заключают сделку или, если позволяют средства, организуют глобальное роуд-шоу со всем своим портфелем."
 SIA_scout_overseas_targets: "Разведка зарубежных целей"
 SIA_scout_overseas_targets_desc: "Отправьте команды специалистов по сделкам осмотреть помещения, предназначенные для следующей покупки, прежде чем кто-либо что-либо подпишет. Небольшая, короткая заметка о том, куда следует направить тайский капитал в будущем."
 SIA_close_the_deal: "Завершите сделку"
 SIA_close_the_deal_desc: "Подпишите документы на следующую долю, дочернюю компанию или концессию. Деньги, уходящие из казны, — реальные, ведь речь идёт об активе, который ещё не доказал свою ценность."
 SIA_global_ma_roadshow: "Глобальное роуд-шоу по слияниям и поглощениям"
 SIA_global_ma_roadshow_desc: "Отправьте представителей крупных инвестиционных конгломератов в турне по Сингапуру, Гонконгу и Лондону, чтобы они предлагали тайский капитал банкирам и целевым советам директоров. Одна только реклама подогреет интерес к следующему раунду сделок."
 thailand.1.t: "Всеобщие выборы 2001 года"
 thailand.1.d: "6 января 2001 года тайцы проголосовали на первых всеобщих выборах в соответствии с Народной конституцией. В выборах участвовали три силы. Платформа Тай Рак Тая, включающая в себя деревенские фонды, мораторий на выплату долгов и всеобщее здравоохранение, произвела фурор в сельской местности. Дворцовая сеть и её союзники на военных базах предпочитают держать под контролем тех, кто находится у власти. Действующие демократы обещают стабильные, но не слишком привлекательные руки. То, на что мы сейчас положимся, определит, кого выберет страна."
 thailand.1.a: "Поддержать «Тай Рак Тай» и сельский электорат."
 thailand.1.b: "Сплотить дворцовые структуры и генералов."
 thailand.1.c: "Поддержать демократов у власти."
 thailand.2.t: "Правительство генеральных директоров"
 thailand.2.d: "Новое правительство вступает в должность, обещая управлять Таиландом как успешной компанией. Бизнесмены заполняют кабинет министров, министерствам ставят целевые показатели эффективности, а политика развивается с невиданной ранее скоростью для бюрократии."
 thailand.2.a: "Таиланд открыт для бизнеса."
 thailand.3.t: "Война с наркотиками"
 thailand.3.d: "В феврале 2003 года правительство объявило о начале трехмесячной кампании по искоренению торговли метамфетамином. Были составлены провинциальные черные списки и установлены квоты. К концу кампании правозащитные организации задокументировали 2800 убийств, многие из которых так и не были должным образом расследованы. Кампания пользовалась популярностью в СМИ, но была осуждена за рубежом."
 thailand.3.a: "Продолжайте кампанию без ограничений."
 thailand.3.b: "Сбавьте обороты потихоньку."
 thailand.4.t: "Сентябрьский переворот"
 thailand.4.d: "19 сентября 2006 года премьер-министр находится в Нью-Йорке на Генеральной Ассамблее ООН. Тем временем танки патрулируют Бангкок, конституция отменяется, а Совет за демократические реформы объявляет о мирном принятии контроля над правительством. Толпы приносят цветы солдатам, а сельское большинство молча наблюдает за происходящим."
 thailand.4.a: "Пусть армия возьмет на себя ответственность."
 thailand.4.b: "Установить правительство гражданского фронта."
 thailand.5.t: "Судебный роспуск"
 thailand.5.d: "Конституционный суд рассматривает дело о фальсификации выборов против крупнейшей оппозиционной партии. Роспуск партии лишит ее исполнительный совет возможности заниматься политикой на пять лет, что приведет к ликвидации движения, не оставив ни одного солдата в казармах."
 thailand.5.a: "Распустить партию."
 thailand.5.b: "Пусть угроза висит над ними."
 thailand.6.t: "НСПО приходит к власти"
 thailand.6.d: "22 мая 2014 года, после нескольких месяцев протестов и двух дней объявленного военного положения, командующий армией вызывает противоборствующие фракции в Армейский клуб и арестовывает их в конференц-зале. Командующий армией объявляет, что Национальный совет мира и порядка возьмет контроль над правительством. До стабилизации демократических институтов не будет установлен четкий график выборов."
 thailand.6.a: "Порядок восстановлен."
 thailand.7.t: "Красные рубашки занимают площадь"
 thailand.7.d: "Объединенный фронт за демократию против диктатуры наводняет коммерческий центр Бангкока, требуя отставки правительства и новых выборов. На улице Ратчапрасонг возводятся баррикады, по всему городу горят шины и здания. Камеры всего мира следят за дальнейшими действиями армии."
 thailand.7.a: "Очистите площадь."
 thailand.7.b: "Вести переговоры и ждать."
 thailand.8.t: "Захват аэропорта"
 thailand.8.d: "В ноябре 2008 года протестующие в желтых рубашках оккупировали аэропорты Суварнабхуми и Дон Муанг, оставив без пассажиров 300 000 человек и парализовав авиаперевозки в стране. Осада закончилась только тогда, когда решение суда привело к свержению правительства, которому они противостояли."
 thailand.8.a: "Подсчитать издержки."
 thailand.9.t: "Три требования"
 thailand.9.d: "Студенческие толпы, численность которых превысила все с 1992 года, выдвинули три требования: распустить парламент, прекратить запугивание критиков и разработать новую конституцию. Со сцены в Бангкоке за один вечер были нарушены табу, регулировавшие публичные выступления в Таиланде на протяжении поколений."
 thailand.9.a: "Поддержите все три требования."
 thailand.9.b: "Продвигайте только те законы, которые сможет принять парламент."
 thailand.10.t: "Раздел 112 на пленарном заседании"
 thailand.10.d: "В парламент поступил законопроект о внесении поправок в закон об оскорблении величества. Он ограничивает круг лиц, имеющих право подавать жалобы, устанавливает предельные размеры наказаний и прекращает его применение против политических высказываний. Ни один тайский законодательный орган никогда не осмеливался проводить поименное голосование по этому вопросу. Все институты старого порядка теперь приведены в движение."
 thailand.10.a: "Пригласите к голосованию."
 thailand.11.t: "Кризис распада"
 thailand.11.d: "Конституционный суд признал кампанию по внесению поправок попыткой свержения демократического режима, в котором главой государства является король. Партия распущена, ее руководство запрещено. Движение должно начаться заново под новым названием, с теми же людьми, что и всегда."
 thailand.11.a: "Мы зарегистрируем новую партию к пятнице."
 thailand.12.t: "Власть наносит ответный удар"
 thailand.12.d: "Военные подразделения передвигаются по столице без приказов правительства. Старые порядки решили, что эксперимент зашел слишком далеко. От того, что произойдет в следующие шесть часов, зависит, продолжится ли эра реформ или пополнит длинный список прерванных тайских демократий."
 thailand.12.a: "Призовите людей на улицы."
 thailand.12.b: "Спуститесь вниз, чтобы сохранить движение."
 thailand.13.t: "Вопрос о республике"
 thailand.13.d: "Правительство назначает референдум по конституционной форме самого государства — вопросу, который ни одно тайское правительство никогда не выносило на народ. Каким бы ни был результат, Королевство уже никогда не будет прежним."
 thailand.13.a: "Предложите это людям."
 thailand.13.b: "Отменить референдум."
 thailand.14.t: "Новое правление"
 thailand.14.d: "13 октября 2016 года Управление Королевского двора объявило о смерти Его Величества короля Пхумипона Адульядеджа, Рамы IX, после семидесяти лет правления, что стало самым долгим периодом в истории Таиланда. Наследный принц взошел на престол как король Маха Вачиралонгкорн, Рама X. Как правительство отметит этот переход и как быстро оно продолжит свою работу, теперь решать Бангкоку."
 thailand.14.a: "Заявите о новом правлении открыто."
 thailand.14.b: "Пусть обряды пройдут свой путь."
 thailand.14.c: "Сохраняйте баланс между церемонией и ее преемственностью."
 thailand.15.t: "Династия продолжается"
 thailand.15.d: "Основатель движения больше не может лично возглавлять его, но название сохраняет свою привлекательность для избирателей. Вопрос, стоящий перед партией, заключается в том, кто поведет ее на следующие выборы."
 thailand.15.a: "Инглук Шинаватра возглавляет избирательный список."
 thailand.15.b: "Лидером списка является Сретха Тависин, магнат в сфере недвижимости, представляющая бизнес-крыло."
 thailand.15.c: "Паэтонгтарн Шинаватра возглавляет избирательный список, и это имя сохранилось в памяти нового поколения."
 thailand.15.e: "Разместите изображение аппарата над названием."
 thailand.16.t: "Таксин навсегда"
 thailand.16.d: "Ежегодный партийный съезд голосует за отмену внутренних ограничений на срок полномочий и предоставление руководству чрезвычайных полномочий в отношении отбора кандидатов, партийного списка и коалиционной политики. В оппозиции нет никого, кто имел бы значение. Выборы будут продолжаться, и победы будут продолжаться."
 thailand.16.a: "Один лидер, одна партия, один Таиланд."
 thailand.17.t: "Восстановление престола"
 thailand.17.d: "Парламент, Тайный совет и вооруженные силы совместно обращаются к дворцу с просьбой взять на себя непосредственное управление государственными институтами. Конституционная фикция прошлого века отменяется. Династия Чакри возобновляет свою роль, которую она играла до 1932 года."
 thailand.17.a: "Да здравствует Король!"
 thailand.18.t: "Система 2017 года"
 thailand.18.d: "Новая конституция проходит референдум в условиях ограничений, связанных с проведением кампаний, которые сделали оппозицию уголовным преступлением. Полностью назначаемый Сенат будет участвовать в выборе будущих премьер-министров, а двадцатилетняя Национальная стратегия обязательна для каждого будущего правительства. Выборы возобновятся, но уже за пределами избирательного округа."
 thailand.18.a: "Это управляемая демократия."
 thailand.19.t: "Королевство отправляется на выборы."
 thailand.19.d: "Избирательные участки открываются во всех семидесяти шести провинциях 6 января 2001 года. Это первые выборы, проведенные в соответствии с Народной конституцией, подсчет голосов на которых осуществляется независимой комиссией, а не Министерством внутренних дел, и первые, на которых партия, одержавшая безоговорочную победу, может управлять страной без многомесячных коалиционных переговоров."
 thailand.19.a: "Начинаем подсчет голосов."
 thailand.20.t: "Трибунал распускает партию."
 thailand.20.d: "Конституционный трибунал постановил, что правящая партия платила более мелким партиям за выдвижение кандидатов на аннулированных выборах, и распорядился о её роспуске. Сто одиннадцать членов её исполнительного комитета отстранены от политической деятельности на пять лет. Вердикт аннулирует название партии, её регистрацию и руководство, и не затрагивает ни одного из её избирателей. Через несколько недель те же самые члены парламента подают документы на новую регистрацию под новым названием, и политическая машина на северо-востоке не потеряла ни одного округа."
 thailand.20.a: "Перерегистрация прошла успешно, под новым руководством."
 thailand.20.b: "Отстраненные руководители продолжат управлять компанией извне."
 thailand.21.t: "Суд освобождает зал."
 thailand.21.d: "Второй роспуск парламента, и на этот раз вместе с ним падает и правящая партия. Решение также отменяет действие старого национал-консервативного блока, чьи лидеры провинциальных фракций теперь контролируют ситуацию в парламенте и находятся под давлением обеих сторон. Их лидеру запрещено участвовать в выборах, но он не замолкает, и он ведет переговоры из дома в Бурираме. Если его члены уйдут, оппозиция сформирует правительство без выборов. Если же их удастся удержать, коалиция сохранится, и все точно узнают, чего это стоило."
 thailand.21.a: "Пусть уходят, и пусть демократы попробуют управлять страной."
 thailand.21.b: "Предложите им то же, что и они."
 SIA_bench_hands_power_to_democrats_tt: "Зал возобновляет свою работу с §YДемократической партией§! в правительстве."
 thailand.50.t: "Выход из кризиса Том Ям Кунг"
 thailand.50.d: "Спустя три года после обвала бата экономика снова растет. Заводы на восточном побережье возобновляют набор персонала, а программа МВФ, начавшаяся с позора, опережает график."
 thailand.50.a: "Самое худшее уже позади."
 thailand.51.t: "МВФ выходит из состава"
 thailand.51.d: "В июле 2003 года Таиланд досрочно, на два года, погасил последний транш своих обязательств перед МВФ. Премьер-министр отметил это событие телевизионным обращением, в котором объявил о восстановлении экономической независимости страны."
 thailand.51.a: "Никогда больше."
 thailand.52.t: "Цунами в День подарков"
 thailand.52.d: "26 декабря 2004 года подводное землетрясение у берегов Суматры вызвало цунами на Андаманском побережье Таиланда. Города Као Лак и Пхукет были опустошены, в Таиланде погибло более 5000 человек, многие из которых были иностранными туристами. Весь мир следил за реакцией властей."
 thailand.52.a: "Не жалейте сил в оказании помощи."
 thailand.52.b: "Минимальный ответ."
 thailand.53.t: "Великий потоп"
 thailand.53.d: "Муссонные воды, движущиеся вниз по бассейну реки Чао Прайя, затопили две трети провинций страны и подступили к промышленным зонам к северу от Бангкока. Мировое производство жестких дисков в затопленных тайских заводах остановилось. В столице возводят стены из мешков с песком и ждут."
 thailand.53.a: "Мобилизуйте все ресурсы."
 thailand.53.b: "Защитите Бангкок и дайте провинциям осушиться."
 thailand.54.t: "Программа гарантированного производства риса"
 thailand.54.d: "Правительство предлагает выкупить весь урожай риса по цене в полтора раза выше рыночной, перечислив миллиарды фермерским хозяйствам и рассчитывая на то, что мировые цены последуют за этим ростом. Экономисты предупреждают, что склады заполнятся, а убытки будут беспрецедентными. Фермеры, которые нас избрали, ждут."
 thailand.54.a: "Обещайте отдать каждую крупинку."
 thailand.54.b: "Тихонько отложите этот проект."
 thailand.55.t: "Детройт Азии"
 thailand.55.d: "Производство автомобилей превысило миллион единиц. Таиланд в настоящее время является крупнейшим автопроизводителем в Юго-Восточной Азии и ведущим мировым производителем однотонных пикапов."
 thailand.55.a: "Уговорите Toyota и Honda открыть двери."
 thailand.56.t: "Год посещения Таиланда"
 thailand.56.d: "Бангкок — один из самых посещаемых городов мира. От улицы Као Сан до пляжа Карон, Королевство принимает гостей со всего мира, а туристические расходы обеспечивают средствами к существованию миллионы тайцев."
 thailand.56.a: "Савасди."
 thailand.56.b: "Инвестируйте в саму отрасль."
 thailand.57.t: "Вопрос о подводных лодках"
 thailand.57.d: "Контракт ВМС Таиланда на поставку китайских подводных лодок S26T стал предметом общенациональных дискуссий. Станут ли это первые корабли флота, способного действовать в двух океанах, или же это миллиарды, потраченные на двигатели, которые поставщик не может поставить? Решение о закупке находится на рассмотрении правительства."
 thailand.57.a: "Купите лодки."
 thailand.57.b: "Отмените программу."
 thailand.100.t: "Затерянные территории"
 thailand.100.d: "Государственные СМИ возрождают старые карты. Провинции были переданы Франции в 1893, 1904 и 1907 годах, султанаты — Великобритании в 1909 году. В школьные учебники возвращается нарратив о национальном унижении времен правления Фибуна, и вновь пробуждается движение, которое ни одно правительство не инициировало с 1945 года."
 thailand.100.a: "То, что было украдено, можно вернуть."
 thailand.101.t: "Братья по другую сторону Салуина"
 thailand.101.d: "Бангкок официально заявляет о своей заинтересованности в судьбе народа тай-яй из штата Шан, родственного тайцам по языку и крови, воюющего с бирманской хунтой на протяжении поколений. Заявление почти не доходит до территориальных претензий. Никто в регионе не ошибается в его смысле."
 thailand.101.a: "Тайцы — один народ."
 thailand.102.t: "Меконг — река, протекающая по территории Таиланда."
 thailand.102.d: "Правительство официально отвергает франко-сиамские договоры 1893 и 1904 годов как документы, подписанные под принуждением. Непосредственные претензии касаются Чампасака, но представители правящей партии задаются вопросом, почему претензии должны ограничиваться провинциями, которые Франция случайно включила в свои карты."
 thailand.102.a: "Заявите права на территории, захваченные в 1904 году."
 thailand.102.b: "Объявить весь Лаос землей народа тай."
 thailand.103.t: "Противостояние Преах Вихеар"
 thailand.103.d: "Артиллерийские перестрелки вокруг храма на вершине скалы, самые масштабные с 2011 года, дают Бангкоку повод для этого. Правительство объявляет, что больше не признает решение Международного суда 1962 года, и заявляет о своих претензиях на Баттамбанг и Сиемреап, сиамские провинции, существовавшие еще на памяти ныне живущих."
 thailand.103.a: "Изложите свои утверждения."
 thailand.103.b: "Претензии и ультиматум."
 thailand.104.t: "Осуждая 1909 год"
 thailand.104.d: "Министерство иностранных дел официально денонсирует англо-сиамский договор 1909 года, согласно которому малайские данники Бангкока были переданы Британской империи. Упоминаются непосредственно Келантан и Теренггану. Куала-Лумпур отзывает своего посла в течение часа."
 thailand.104.a: "Завладейте Келантаном и Теренггану."
 thailand.104.b: "Требуйте возвращения всех уступленных султанатов."
 thailand.105.t: "Суваннапхум"
 thailand.105.d: "Золотая земля из летописей, тайский мир, собравшийся под одним флагом. Правительство провозглашает программу объединения в принципе завершенной. Остается лишь сделать возвращенные территории тайскими как в административном, так и в номинальном отношении."
 thailand.105.a: "Поднимите один флаг от Салуина до моря."
 thailand.105.b: "Пауза. Дайте сначала военным укрепить свои позиции."
 thailand.106.t: "Интеграция земель Шан"
 thailand.106.d: "Административные структуры, системы образования и инфраструктура Таиланда достигли плато Шан. Интеграционная комиссия сообщает о готовности новых провинций к полному включению в состав Королевства."
 thailand.106.a: "Добро пожаловать домой."
 thailand.107.t: "Интеграция земель Лаоса"
 thailand.107.d: "Провинции Меконга завершают свою административную интеграцию. Река больше не является границей."
 thailand.107.a: "Добро пожаловать домой."
 thailand.108.t: "Интеграция кхмерских провинций"
 thailand.108.d: "Баттамбанг и Сиемреап, а также Пхра Табонг и Сиеммарат, упомянутые в старых географических справочниках, впервые с 1946 года возвращаются под управление Таиланда."
 thailand.108.a: "Добро пожаловать домой."
 thailand.109.t: "Интеграция южных провинций"
 thailand.109.d: "Бывшие султанаты завершили свою интеграцию. Столетие британского и малайзийского управления подошло к концу. Начинается более сложная задача — наладить его функционирование."
 thailand.109.a: "Добро пожаловать домой."
 thailand.110.t: "Реакция мира"
 thailand.110.d: "Экстренные заседания в каждой соседней столице. Один из основателей АСЕАН отвергает основополагающий принцип АСЕАН — нерушимость границ колониальной эпохи. Посольства отозваны, учения приостановлены, а старые друзья начинают описывать Таиланд, используя новые выражения."
 thailand.110.a: "Они адаптируются."
 thailand.150.t: "Пожар на юге"
 thailand.150.d: "4 января 2004 года боевики совершили нападение на армейский склад в Наратхивате, убив солдат и захватив сотни единиц оружия. За этим последовали скоординированные поджоги в малайско-мусульманских провинциях Глубокого Юга. Сепаратистское повстанческое движение, дремавшее два десятилетия, возобновилось."
 thailand.150.a: "Юг станет для нас испытанием."
 thailand.151.t: "Инцидент на Глубоком Юге"
 thailand.151.d: "Ещё неделя, ещё фугас на обочине, ещё стрельба на блокпосту в Яле, Паттани или Наратхивате. Конфликт перемалывает людей в ритме, который Бангкок научился не замечать, а Юг оставлен один на один со своей новой реальностью насилия."
 thailand.151.a: "Терпеть."
 thailand.152.t: "Жесткий"
 thailand.152.d: "Операция по обеспечению безопасности на Глубоком Юге заканчивается гибелью задержанных и оправданием армией своих методов. Обещаны расследования, но судебных преследований не последовало. По ту сторону границы и по всему мусульманскому миру эти кадры работают против нас."
 thailand.152.a: "У заказа есть своя цена."
 thailand.153.t: "Переговоры в Куала-Лумпуре"
 thailand.153.d: "За столом, организованным малазийскими посредниками, сидят тайские чиновники и представители BRN. Повестка дня скромная и охватывает зоны безопасности, благополучие заключенных и признание самого диалога. После многих лет отрицания существования войны, переговоры стали уступкой."
 thailand.153.a: "Продолжайте с ними разговаривать."
 thailand.154.t: "Мирное соглашение"
 thailand.154.d: "Подписано соглашение об автономии провинций Патани. Оно предусматривает выборное региональное управление, обучение на малайском языке наряду с тайским, механизмы правосудия в отношении нарушений, связанных с конфликтом, и поэтапное прекращение присутствия сил безопасности. Самая продолжительная война в пределах границ Таиланда завершилась подписанием соглашения."
 thailand.154.a: "Мир на Юге."
 thailand_news.1.t: "Государственный переворот в Бангкоке"
 thailand_news.1.d: "Королевская армия Таиланда захватила власть в Бангкоке, приостановив действие конституции и распустив избранное правительство. Военные советы неоднократно правили Таиландом с 1932 года, и рынки, и канцелярии подсчитывают, как долго этот совет намерен оставаться у власти."
 thailand_news.1.a: "Снова?"
 thailand_news.2.t: "Таиланд заявляет о своих «потерянных территориях»."
 thailand_news.2.d: "Бангкок официально заявил о своих правах на территории, переданные Франции и Великобритании столетие назад, возродив ирредентистскую программу, о которой не было слышно со времен Второй мировой войны. Столицы стран Юго-Восточной Азии реагируют на это с тревогой."
 thailand_news.2.a: "Касательно."
 thailand_news.3.t: "Республика в Сиаме?"
 thailand_news.3.d: "В Таиланде состоится референдум о будущем монархии — вопрос, беспрецедентный в современной истории Королевства. Регион затаил дыхание."
 thailand_news.3.a: "Беспрецедентный."
 thailand_news.4.t: "Таиланд скорбит по королю Пхумипону."
 thailand_news.4.d: "Король Пхумипон Адульядет, самый долгоправящий монарх в мире, скончался в Бангкоке в возрасте 88 лет. Таиланд начинает год траура по единственному королю, которого когда-либо знало большинство тайцев. Его сын унаследовал престол как король Маха Вачиралонгкорн, Рама X."
 thailand_news.4.a: "Заканчивается эпоха."
 thailand.58.t: "Болото кобр"
 thailand.58.d: "«Болото Кобры» в Нонг Нгу Хао поглощает деньги с 1970-х годов. Теперь из него фактически вырастает новый аэропорт, и растут затраты. Проблемы с дренажем, трещины на рулежных дорожках, подрядчики выставляют счета дважды за один и тот же бетон. Совет директоров хочет больше денег или больше времени."
 thailand.58.a: "Вложить средства и открыть в срок."
 thailand.58.b: "Пусть расписание сдвинется с места."
 thailand.59.t: "Ворота в Азию"
 thailand.59.d: "Суварнабхуми распахивает двери огромного терминала из стекла и стали — одного из крупнейших в мире, построенного, чтобы поставить Бангкок в центр всех азиатских маршрутов. Первые табло прилётов загораются, как звёзды в мечтах министерства туризма."
 thailand.59.a: "У Королевства появилась новая входная дверь."
 thailand.60.t: "Начало строительства на востоке"
 thailand.60.d: "Восточный экономический коридор существует на бумаге, и кто-то должен заплатить за бетон и сталь. Делегации Пекина приезжают с предложениями финансирования, завёрнутыми в язык «Пояса и пути». Министерство финансов может занять деньги и внутри страны — медленнее, зато без обязательств."
 thailand.60.a: "Суд в китайской столице."
 thailand.60.b: "Выпустить внутренние облигации."
 thailand.61.t: "Перерасход средств на строительство железнодорожной линии"
 thailand.61.d: "Прокладка тоннеля под тремя аэропортами изначально обещала быть дорогой, но никто трезво не оценил, насколько дорогой она окажется для кабинета. Линии трёх аэропортов нужна либо новая кредитная линия, либо проект поскромнее."
 thailand.61.a: "Платите. Позвоночник формируется целиком."
 thailand.61.b: "Подкорректируйте прицел."
 thailand.62.t: "Инициатива «Один пояс и один путь» зовёт!"
 thailand.62.d: "Высокоскоростная линия из Куньмина через Вьентьян в Бангкок. Недостающее звено китайского Индокитайского коридора проходит через территорию Таиланда, и Пекин очень хотел бы его профинансировать. Условия щедрые. Условия также являются условиями."
 thailand.62.a: "Подпишите железнодорожный меморандум."
 thailand.62.b: "Пересматривайте условия постепенно, по-тайски."
 thailand.63.t: "Вопрос о концессиях"
 thailand.63.d: "Сенаторы от оппозиции подводят итоги того, как изменились телекоммуникационные концессии штата с тех пор, как их крупнейший держатель сформировал правительство. Налоги скорректированы, лицензии продлены, конкуренты проверены. В официальных ответах часто используется слово «совпадение»."
 thailand.63.a: "Продайте эти активы. Примите потери от падения цен на государственные облигации, купите акции компаний с безупречной репутацией."
 thailand.63.b: "Дерзко действуйте. Цифры выигрывают выборы, юристы выигрывают время."
 thailand.64.t: "Расчет задолженности домохозяйств"
 thailand.64.d: "Сельские фонды строили магазины, мотоциклы и рисовые мельницы, используя только кредиты. Средний уровень задолженности сельских домохозяйств почти удвоился, и финансовое положение кооперативов начинает шататься. Банки хотят получить рекомендации до начала сезона пролонгации кредитов."
 thailand.64.a: "Окажите финансовую помощь кооперативам. Мораторий обходится нам дорого, но спасает деревни."
 thailand.64.b: "Пусть кредит дорожает. Рынок сам поправится, а издержки примут на себя деревни."
 thailand.65.t: "Смещение и Эриэйс"
 thailand.65.d: "Окончательное предложение Saab оказывается на столе. Gripens предлагает полный доступ к исходному коду, бортовой радар Erieye, партнерство с университетами и разработку компонентов для тайской промышленности — и все это за определенную цену. Или те же истребители, но без дополнительных опций, за значительно меньшую сумму."
 thailand.65.a: "Возьмите полный комплект."
 thailand.65.b: "Только фюзеляжи. Учитывайте бюджет."
 thailand.66.t: "Проблема с двигателем"
 thailand.66.d: "Германия не выдаст лицензию на дизельные двигатели для экспортной подводной лодки китайской постройки, в результате чего наполовину оплаченный корпус S26T в Ухане ожидает установки двигателя. Пекин предлагает свои собственные двигатели и скидку. Военно-морской флот ставит перед кабинетом министров выбор между двумя неприятными ситуациями."
 thailand.66.a: "Примите китайские двигатели и заберите их."
 thailand.66.b: "Требуйте в качестве компенсации корпус фрегата."
 thailand.66.c: "Полностью расторгнуть договор."
 thailand.67.t: "Возрождение флагмана"
 thailand.67.d: "Беспилотные летательные аппараты на трамплине, беспилотные катера в ангаре, пульты управления там, где раньше ржавели запасные части для истребителей Harrier. HTMS Chakri Naruebet возвращается в Саттахип с миссией, которую не сможет повторить ни один другой флот в регионе."
 thailand.67.a: "Проведите её мимо камер."
 thailand.67.b: "Спокойное возобновление работы, возвращение к прежнему режиму."
 thailand.68.t: "Девяносто дней страха"
 thailand.68.d: "Черные списки превратились в подсчет жертв. Более двух тысяч погибших за три месяца, многие из которых, по мнению следователей, не имеют никакой связи с наркотиками. Сельская местность аплодирует, больницы переполнены, а почтовый ящик министерства иностранных дел заполняется еще быстрее."
 thailand.68.a: "Продолжайте. Кампания приносит результаты."
 thailand.68.b: "Успокойтесь и закажите обзоры."
 thailand.69.t: "В офицерском клубе раздаются разговоры."
 thailand.69.d: "Здесь есть все знаки, которые умеет читать любое правительство Бангкока. Необычные ротации в Первом армейском округе, отставные генералы, внезапно полюбившие телевизионные интервью, и встреча выпускников в кавалерийских казармах, на которой присутствовала половина высшего командования."
 thailand.69.a: "Уберите все лишнее с высшего руководства."
 thailand.69.b: "Уступите место генералам."
 thailand.69.c: "Опровергните их публично."
 thailand.70.t: "Танки у Дома правительства"
 thailand.70.d: "Начинается все так же, как и всегда. Обычная программа сменяется патриотической музыкой, на перекрестках стоят бронированные машины, зачитывается сообщение от какого-то «совета», о котором вчера никто не слышал. У правительства есть несколько минут, чтобы решить, сколько оно готово потратить."
 thailand.70.a: "Сплотите лоялистов и оказывайте сопротивление."
 thailand.70.b: "Признайте свою ошибку и садитесь в самолет."
 thailand.70.c: "Наладьте переговоры о создании правительства национального единства."
 thailand.70.c_tooltip: "§YГенералы входят в кабинет, а не во дворец.§!\nВыборы сохраняются (§Gбез приостановки выборов§!), а давление переворота падает до §Y35§!. Королевство становится менее устойчивым и ограниченным в политической воле, а §Yшаткий компромисс§! давит на правительство 180 дней."
 thailand.71.t: "Молодежь на улицах"
 thailand.71.d: "Они организуются в Telegram, цитируют «Хамтаро» и «Голодные игры» и заполняют памятники десятками тысяч человек. Их требования написаны на бумажных самолётиках, которые перебрасывают через заграждения. Распустить парламент, переписать конституцию, реформировать неприкасаемые институты."
 thailand.71.a: "Разгоните митинги. Порядок не терпит отлагательств."
 thailand.71.b: "Начните диалог. Уступайте в тоне, а не в содержании."
 thailand.71.c: "Подождите. Они устанут раньше нас."
 thailand.155.t: "Охваченный пламенем регион"
 thailand.155.d: "Скоординированные поджоги в трех провинциях за одну ночь. Блокпосты атаковали средь бела дня. Учителей держали под конвоем, школы были закрыты до конца учебного года. Юг не горел так долго, и Совет национальной безопасности хочет определить направление действий."
 thailand.155.a: "Наводнить юг войсками."
 thailand.155.b: "Позвоните в Куала-Лумпур и расширьте диалог."
 thailand.156.t: "Тихие дороги в Паттани"
 thailand.156.d: "На карте ежемесячных происшествий больше белого пространства, чем красного. Рынки работают после наступления темноты, контрольно-пропускные пункты пропускают транспорт, а мужчины за столом переговоров в Куала-Лумпуре осторожно обсуждают, как может выглядеть окончательная ситуация."
 thailand.156.a: "Настаивайте на достижении окончательного соглашения."
 thailand.156.b: "Сохраняйте спокойствие и статус-кво."
 thailand.350.t: "Пожар на юге"
 thailand.350.d: "Карта трех южных провинций — это созвездие красных булавок, на которых отмечены взрывы, засады, поджоги и убийства. Тысячи погибших, а силы безопасности теряют людей, которых невозможно заменить. Кризис больше нельзя решать на периферии. Правительство должно решить, каким государством оно хочет быть на Юге: кулаком, благодетелем или партнером за столом переговоров."
 thailand.350.a: "Раздавите их. Юг узнает, что такое порядок."
 thailand.350.b: "Королевский мир. Развивайте Юг, отвоюйте его обратно."
 thailand.350.c: "Поговорите с ними. Даже старые враги могут подписать документ."
 thailand.350.e: "У нас нет четкой политики. Действуем по мере поступления информации."
 thailand.356.t: "Грузовики"
 thailand.356.d: "Очередная облава и очередная толпа у очередного районного полицейского участка. В итоге сотни задержанных были сложены лицом вниз в армейских грузовиках, а десятки погибли от удушья к тому времени, как их доставили в лагерь. Эти кадры распространяются по мусульманскому миру еще до того, как Бангкок успевает выступить с заявлением. Какими бы ни были результаты операции на местах, она лишь радикализировала целое поколение и дала повстанческому движению его основополагающий миф."
 thailand.356.a: "Катастрофа. Юг этого не забудет."
 thailand.357.t: "Умиротворение завершено"
 thailand.357.d: "Генералы докладывают о выполнении миссии. Придорожные бомбы обезврежены, камеры сломлены, блокпосты закрываются. По всем показателям, которые измеряет армия, Глубокий Юг умиротворен. Под молчанием не угасло негодование. Оно просто научилось ждать."
 thailand.357.a: "Орудия молчат. Мы будем наблюдать за тлеющими углями."
 thailand.358.t: "Южное спокойствие"
 thailand.358.d: "Договора не было, автономии тоже, но насилие утихло, сменившись контролируемым затишьем. Королевское развитие идет полным ходом, местные знатные люди находятся под контролем, и легитимность монархии на юге тихо восстанавливается. Это спокойствие поддерживается присутствием и покровительством, за ним скорее наблюдают, чем разрешают конфликты."
 thailand.358.a: "Корона сохраняет мир, которого она добилась."
 thailand.359.t: "Истеблишмент оказывает сопротивление"
 thailand.359.d: "Проект закона о специальной автономии просочился в прессу, и реакция в Бангкоке оказалась яростной. Генералы предупреждают о расчленении, консерваторы при дворце бормочут о прецеденте, а националистическая пресса называет это капитуляцией. Переговорщики готовы подписать закон, но правительство должно решить, потратит ли оно политический капитал на удержание позиции или смягчит рамочный документ до уровня, приемлемого для центра."
 thailand.359.a: "Держитесь. Соглашение должно быть настоящим."
 thailand.359.b: "Смягчите формулировки. Сохраняйте мир, отбросьте принципы."
 thailand.360.t: "Паттанское соглашение"
 thailand.360.d: "Подписи на одной странице положили конец самой продолжительной войне в пределах современных границ Королевства. Юг получил подлинное самоуправление в рамках единого Таиланда, оружие было сдано, и перемещенные лица начали возвращаться. Это несовершенный, спорный и исторический документ, и впервые за целое поколение дети Паттани будут расти без комендантского часа."
 thailand.360.a: "Наконец-то мир на Юге."
 thailand_news.24.t: "Резня в Так-Бае"
 thailand_news.24.d: "Кадры, на которых запечатлены задушенные в армейских грузовиках под Так-Баем, достигли всех столиц мусульманского мира. Куала-Лумпур, Джакарта и Анкара вызвали послов Таиланда, а правозащитные организации требуют расследования. Политика Бангкока в отношении юга страны теперь стала синонимом зверств, а повстанцам никогда не было так легко вербовать новобранцев."
 thailand_news.24.a: "Весь мир наблюдает за Югом."
 thailand_news.25.t: "В Паттани воцарился мир."
 thailand_news.25.d: "После целого поколения кровопролития в южной части Таиланда затихли выстрелы. Завершилось самое продолжительное восстание в современной истории Королевства, будь то руками солдат или пером переговорщика. Дороги открыты, рынки полны, и в Паттани, Яле и Наратхивате возвращается настороженная нормальность."
 thailand_news.25.a: "Долгая война закончилась."
 thailand_news.23.t: "Правительство национального единства"
 thailand_news.23.d: "Танки ушли с перекрестков, но достигнутая ночью сделка переживет кризис. Избранное правительство сохраняет свой мандат, а избирательная урна — свое место, однако руководители силовых структур теперь сидят за столом кабинета министров, и все в Бангкоке понимают, кто гарантировал мир. Это компромисс, который никому не нравится и который никто не смеет нарушать, — национальное правительство, в котором армия находится под контролем."
 thailand_news.23.a: "Власть, разделяемая и контролируемая."
 thailand.3.c: "Сельскохозяйственные культуры, а не мак. Финансируйте альтернативные методы развития."
 thailand.361.t: "Тела на обочине дороги"
 thailand.361.d: "Трехмесячная кампания завершена, подсчет завершен. Правозащитные организации задокументировали около 2800 погибших, подавляющее большинство из которых так и не были обвинены ни в чем, а имена многих даже не были названы. Черные списки свели старые счеты, и квоты были выполнены путем расправы над убитыми. Улицы стали тише, а результаты опросов выше, чем когда-либо, но в казармах и дворце мужчины записывают данные о правительстве, которое убивает по расписанию."
 thailand.361.a: "Цифры есть цифры. Мы не приносим извинений."
 thailand.362.t: "Урожай, а не мак."
 thailand.362.d: "Одних лишь мер по пресечению торговли недостаточно, чтобы перебросить её через следующий горный хребет. Агрономы и специалисты по общественному здравоохранению предлагают другое решение. Платить фермерам, живущим в горах, за выращивание кофе, макадамии и фруктов вместо опиума, рассматривать наркоманию как болезнь, а не как преступление, и позволить легальным товарным культурам делать то, чего никогда не могли сделать вертолёты. Это медленнее, дешевле, и это требует от государства прекратить стрельбу и начать закупать."
 thailand.362.a: "Финансируйте альтернативные методы развития. Завоевывайте холмы с помощью рынков."
 thailand.362.b: "Продолжайте перехватывать. Держите оборону, мы её держим."
 thailand_news.5.t: "Таиланд представил Восточный экономический коридор."
 thailand_news.5.d: "В Бангкоке официально открылась флагманская зона развития на Восточном побережье, включающая высокоскоростную железную дорогу к трем аэропортам, расширенный аэротрополис У-Тапао и пакеты стимулов, направленные на развитие электромобилей, аэрокосмической отрасли и биотехнологий. Аналитики называют это самым амбициозным экономическим проектом Таиланда со времен программы развития Восточного побережья в 1980-х годах."
 thailand_news.5.a: "Страна улыбок настроена серьезно."
 thailand.50.b: "Смягчить удар и защитить людей."
 thailand.55.b: "Постройте национальный автомобиль."
 thailand.200.t: "Народная конституция"
 thailand.200.d: "Организации гражданского общества, ученые и лидеры общин празднуют принятие конституции, написанной при подлинном участии общественности. Впервые за десятилетия простые тайцы почувствовали, что сами принимали участие в разработке своего основного закона, и улицы Бангкока неожиданно наполнились праздничной атмосферой."
 thailand.200.a: "Демократия пускает корни."
 thailand.201.t: "Записи в Дон Муанге"
 thailand.201.d: "Количество пассажиров в аэропорту Дон Муанг превзошло все предыдущие рекорды, а кампания «Удивительный Таиланд» превзошла все ожидания. Руководители авиакомпаний объявляют о новых прямых маршрутах, а туроператоры уже бронируют места на следующие два сезона. Вопрос, стоящий перед нами, — что делать с полученной прибылью."
 thailand.201.a: "Вложите эти средства в курорты на юге страны."
 thailand.201.b: "Отложите неожиданную прибыль."
 thailand.202.t: "Мир, испытывающий острую нехватку риса"
 thailand.202.d: "Засуха на Индийском субконтиненте и неурожаи в Юго-Восточной Азии привели к тому, что мировые цены на рис достигли десятилетнего максимума. Таиланд располагает запасами высококачественных сортов риса Хом Мали и Жасмин, которые срочно нужны каждому импортеру зерна. Министерство торговли ждет от нас ответа."
 thailand.202.a: "Продайте запасы по завышенным ценам."
 thailand.202.b: "Оставляйте рис дома и субсидируйте внутренние цены."
 thailand.203.t: "Запрос на размещение базы"
 thailand.203.d: "Тихоокеанское командование США направило негласный, но официальный запрос на расширение прав доступа к авиабазе У-Тапао для обеспечения логистики, наблюдения и предварительного размещения войск. Американцы готовы заплатить за это денежными переводами, модернизацией оборудования и политическим прикрытием. Подробности останутся неизвестными для общественности."
 thailand.203.a: "Предоставьте доступ и возьмите деньги."
 thailand.203.b: "Вежливо откажитесь. Тайская земля, тайский суверенитет."
 thailand_news.6.t: "Бамбук гнется, но не ломается"
 thailand_news.6.d: "Таиланд заключил знаковое соглашение о двусторонней дипломатической стратегии, одновременно углубляя договорные отношения с Вашингтоном и подписывая новое рамочное соглашение об экономическом партнерстве с Пекином. Министерство иностранных дел Бангкока называет это «бамбуковой дипломатией» — гибкой, устойчивой и основанной прежде всего на интересах Таиланда."
 thailand_news.6.a: "Удивительное умение балансировать."
 thailand_news.7.t: "Таиланд погасил задолженность перед МВФ на два года раньше срока."
 thailand_news.7.d: "Бангкок полностью погасил свои обязательства перед Международным валютным фондом на два года раньше запланированного срока. Досрочное погашение, объявленное без лишней помпы Министерством финансов, закрывает главу, связанную с азиатским финансовым кризисом 1997 года, и освобождает Таиланд от последних условий, связанных с программой финансовой помощи 1997 года."
 thailand_news.7.a: "Страна улыбок выплачивает свои долги."
 thailand.205.t: "Технократы против старой гвардии"
 thailand.205.d: "Новый кабинет министров, сформированный по типу «генерального директора», установил целевые показатели эффективности для каждого министерства, а несколько постоянных секретарей были заменены руководителями из сферы бизнеса. Старая бюрократия не в восторге. Между технократами, продвигающими концепцию «Таиландской корпорации», и кадровыми чиновниками, управлявшими министерствами в течение тридцати лет, идёт тихая война."
 thailand.205.a: "Поддержите технократов. Проведите реформу министерств."
 thailand.205.b: "Защитите карьерную бюрократию. Обеспечьте бесперебойную работу министерств и поддерживайте хорошие отношения с генералами."
 thailand.207.t: "Усталость Праюта"
 thailand.207.d: "Спустя три года обещания генералов о реформах исчерпывают себя. Комитет по разработке конституции был реорганизован дважды. Дата выборов дважды переносилась. Студенту с плакатом перед зданием парламента предъявлено семнадцать обвинений. Медовый месяц закончился."
 thailand.207.a: "Мы будем тщательно контролировать процесс перехода."
 thailand.208.t: "Противостояние продолжается"
 thailand.208.d: "Проходят дни, потом недели. Протесты не рассыпались, но и не разрослись. Правительство не уступает и не зачищает площадь. Рано или поздно моргнут обе стороны. Кто сломается первым?"
 thailand.208.a: "Стремитесь к мирному урегулированию с уступками."
 thailand.208.b: "Протестующие берут на себя ответственность. Правительство берет на себя вину."
 thailand_news.8.t: "Дворец берет управление в свои руки."
 thailand_news.8.d: "Тайская королевская власть формализовала свою роль в управлении активами Бюро королевской собственности, объединив полномочия по коммерческим активам на сотни миллиардов бат в структуру, подчиняющуюся непосредственно дворцу. Аналитики в Бангкоке спорят, является ли это конституционной новинкой или просто юридическим упорядочением договоренностей, существовавших неофициально на протяжении десятилетий."
 thailand_news.8.a: "Династия Чакри продолжает своё существование."
 thailand.209.t: "Дети в сети"
 thailand.209.d: "В Бангкоке, Чиангмае и трех провинциальных университетах одновременно вспыхнуло молодежное протестное движение. Их требования транслируются в прямом эфире еще до того, как полиция успевает развернуть свои заграждения. Правительству предстоит решить, вступать ли в диалог или ждать."
 thailand.209.a: "Поддержите их дело."
 thailand.209.b: "Продолжайте управлять страной. Не торопитесь."
 thailand.210.t: "Письмо из казармы"
 thailand.210.d: "Анонимный документ, распространенный среди высокопоставленных офицеров, а затем просочившийся в прессу, описывает планы по организованному гражданскими лицами сокращению влияния военных на продвижение по службе и закупки. Текст содержит предупреждение. Армия наблюдает, и терпению есть предел. Это может быть настоящий заговор с целью государственного переворота на ранней стадии или блеф. Выбор реакции определяет, что это за страна."
 thailand.210.a: "Действуйте немедленно и устраните заговорщиков, прежде чем они смогут организоваться."
 thailand.210.b: "Действуйте тихо. Мы не будем удостаивать утечки информации ответом."
 thailand.211.t: "Провинции высказались"
 thailand.211.d: "Результаты подсчета голосов на северо-востоке и севере страны получены, и один округ за другим переходит на сторону реформаторского списка. Депутаты-ветераны с тридцатилетним стажем проиграли двадцативосьмилетним, которые проводили предвыборную кампанию в социальных сетях. Избирательная карта перерисовывается избирателями, которые никогда не сталкивались с тем, чтобы местный депутат отвечал на их звонки."
 thailand.211.a: "Воспользуйтесь предоставленным правом."
 thailand.211.b: "Управляйте в интересах всех, а не только наших избирателей."
 thailand.212.t: "Конгломераты отвечают"
 thailand.212.d: "Аукцион по продаже ранее монополизированных блоков частотного спектра принес именно ту прибыль, которую предсказывали реформаторы. На той же неделе скоординированный судебный иск от трех крупнейших конгломератов попал в Конституционный суд, а в одной из роялистских газет в статье министерство финансов было названо «идеологически одержимым». Политика разделения работает, и у нее есть могущественные враги."
 thailand.212.a: "Продолжайте. Закон на нашей стороне."
 thailand.212.b: "Предложите урегулирование спора, постепенное прекращение отношений, а не принудительный разрыв."
 thailand.213.t: "Первый год Республики"
 thailand.213.d: "Прошло двенадцать месяцев с момента объявления, а страна всё ещё здесь, израненная, полная энергии и спорящая, но всё же здесь. Роялистское движение не исчезло. Оно трансформировалось в юридическую и культурную кампанию. Назначены первые президентские выборы. Перед кабинетом министров стоит вопрос: считать ли их успехом, признать раскол или просто продолжать управлять страной."
 thailand.213.a: "Мы создали нечто, что прослужит долго."
 thailand.213.b: "Дело Чакри еще не закончено. Люди помнят."
 thailand.213.c: "Республика пока существует. Но многое еще предстоит защитить."
 thailand.214.t: "Колонна проходит мимо памятника."
 thailand.214.d: "Три часа артиллерийских, бронетанковых и пехотных боев, вооруженные силы в полном строю шествовали по проспекту Ратчадамноен. Толпа оказалась больше, чем ожидали организаторы. Для страны, которая забыла о своих войнах и восприняла перевороты как нечто обыденное, это зрелище производит необычайное впечатление."
 thailand.214.a: "Нация приветствует своих защитников."
 thailand_news.9.t: "В Таиланде легализованы однополые браки."
 thailand_news.9.d: "Парламент Таиланда принял Закон о равенстве браков большинством в две трети голосов, став первой страной в Юго-Восточной Азии, предоставившей полные права на брак независимо от пола. Закон вступает в силу немедленно. Празднования в районах Силом в Бангкоке и Нимман в Чиангмае собрали десятки тысяч человек. Правительства нескольких соседних стран выступили с заявлениями, выражая «обеспокоенность»."
 thailand_news.9.a: "Знаковое событие для Азии."
 thailand_news.10.t: "Весна держится"
 thailand_news.10.d: "Спустя три года после прихода к власти реформаторского правительства на волне молодежных протестов, Таиланд сегодня завершает полный демократический переход. Формализован гражданский контроль над вооруженными силами, распущен назначенный сенат, и проведены первые за два десятилетия свободные выборы без инцидентов. Результаты выборов подтверждены международными наблюдателями из семнадцати стран."
 thailand_news.10.a: "Демократия пускает корни."
 thailand_news.11.t: "Тайская волна прокатилась по Азии."
 thailand_news.11.d: "От Токио до Тайбэя и Куала-Лумпура — тайский контент повсюду. Сериалы на стриминговых платформах, хип-хоп исполнители, модные бренды и целая машина кулинарной дипломатии, которую правительство не планировало и за создание которой не может полностью взять на себя ответственность. Культурное наследие Таиланда превзошло своих соседей как по ценности, так и по охвату."
 thailand_news.11.a: "Мир хочет того, что производит Таиланд."
 thailand.215.t: "Подведение итогов Королевства"
 thailand.215.d: "Первый внутренний анализ нового правительства завершен. Чиновники собрали данные: соотношение долга к ВВП, дефицит инфраструктуры, торговый баланс и моральный дух населения, и по результатам анализа выделились три основных направления. Правительству предстоит выбрать свой первоочередной приоритет. Какой бы выбор ни был сделан сейчас, он определит траекторию развития страны на следующие два года."
 thailand.215.a: "Сосредоточьтесь на восстановлении. Восстановите экономику с нуля."
 thailand.215.b: "Сосредоточьтесь на порядке. Укрепляйте институты, прежде чем проводить их реформы."
 thailand.215.c: "Сосредоточьтесь на мире. Руководствуйтесь дипломатией и торговлей."
 thailand.216.t: "Генералы переместились"
 thailand.216.d: "Правительственный призыв к сопротивлению обратился к лояльным ему сотрудникам полиции, пограничной службы, организациям гражданского общества и на улицах. Откликнется ли народ – вот вопрос, который определит следующее десятилетие тайской политики. В оперативном центре сотрудники следят за размещением подразделений на карте и ведут подсчет."
 thailand.216.a: "Не вешайте трубку."
 thailand.217.t: "Пекин подает сигнал о недовольстве"
 thailand.217.d: "Нота китайского посольства сформулирована дипломатично, но, несомненно, холодно. Углубляющаяся сплоченность Таиланда с Вашингтоном не осталась незамеченной. Государственные СМИ в Пекине упоминают «противоречивую позицию» Таиланда. Инвестиционные делегации тихо откладывают свои визиты. Перед Бангкоком стоит вопрос: насколько это приемлемо, а насколько – отвлечь внимание."
 thailand.217.a: "Пусть отношения остынут. Мы сделали свой выбор."
 thailand.217.b: "Успокойте Пекин, направив личное послание от премьер-министра."
 thailand.218.t: "Вашингтон корректирует"
 thailand.218.d: "Госдепартамент США публично отметил новую позицию Таиланда в рамках инициативы «Один пояс и один путь», основанную на продуманном нейтралитете, однако сотрудники Конгресса начали задавать острые вопросы о финансировании Cobra Gold и договорных обязательствах. В оценке Пентагона, просочившейся в вашингтонский аналитический центр, Таиланд описывается как страна с «стратегически неоднозначной позицией». Бангкок должен управлять этими отношениями."
 thailand.218.a: "Примите похолодание. Мы — суверенное государство."
 thailand.218.b: "Личные заверения послу. Это ничего существенного не меняет."
 thailand.219.t: "Генералы на постоянной основе"
 thailand.219.d: "Решение о введении военной опеки в ведение государства получило освещение в международных редакционных статьях. Financial Times называет это «управляемым авторитаризмом». В течение той же недели три европейских посла запросили встречи с министерством иностранных дел. В стране же ученые и студенты, настроенные на реформы, читают публикации и делают собственные выводы."
 thailand.219.a: "Мы управляем, руководствуясь собственными взглядами. Иностранные комментарии не имеют значения."
 thailand.219.b: "Критики ошибаются насчет Таиланда. Мы докажем им обратное на своих условиях."
 thailand.220.t: "Юг вновь приветствует гостей"
 thailand.220.d: "Спустя два года после того, как цунами закрыло пляжи Андаманского побережья для всех, кроме ремонтных бригад, последний курорт вновь открылся. Управление по туризму Таиланда провело тщательную кампанию по восстановлению, и данные о бронированиях свидетельствуют о том, что она увенчалась успехом. Юг вернулся."
 thailand.220.a: "Таиланд открыт."
 thailand.221.t: "Реконструкция Юга завершена."
 thailand.221.d: "Международные группы гуманитарных организаций и правительственные инженеры завершили программу восстановления прибрежной инфраструктуры. Дороги восстановлены, рыболовные причалы отремонтированы, а электросеть восстановлена. Выражена благодарность партнерам по оказанию помощи, и демонтируются строительные леса."
 thailand.221.a: "Юг вновь встал на ноги."
 thailand.222.t: "Глобальный финансовый кризис"
 thailand.222.d: "Крах Lehman Brothers в Нью-Йорке потряс азиатские рынки. Экспортный сектор Таиланда внимательно следит за своими заказами. Для Бангкока вопрос заключается в том, выдержат ли финансовые резервы, созданные за последнее десятилетие, или же кризис пробьет себе путь сквозь береговую стену."
 thailand.222.a: "Таиланд выстоял. Наша осмотрительность оправдала себя."
 thailand.222.b: "Буря наступила. Нам предстоит подготовиться к трудным двум годам."
 thailand.223.t: "Триста семьдесят семь"
 thailand.223.d: "В читальном зале Тайного совета и коридорах отдела внутренней разведки армии аналитики обрабатывают результаты выборов. Триста семьдесят семь мест. Однопартийное большинство. Беспрецедентный мандат в истории тайской демократии, и у сети нет надежных инструментов для его противодействия. Не сегодня."
 thailand.223.a: "Жители деревень высказали свое мнение. Пока что."
 thailand.224.t: "Расчёт риса"
 thailand.224.d: "Мировые цены на рис не соответствуют ожиданиям. Избыток предложения на мировом рынке вынудил правительство хранить миллионы тонн риса, закупленного значительно выше рыночной цены, а арбитраж, который должен был финансировать эту программу, так и не состоялся. Министерство финансов предложило три варианта решения проблемы. Два из них политически осуществимы."
 thailand.224.a: "Покрыть убытки и дефицит бюджета за счет казначейства."
 thailand.224.b: "Пусть план рухнет, и мы сразу же примем на себя политический удар."
 thailand.225.t: "Дороги ведут в деревни."
 thailand.225.d: "Министры в касках перерезают ленточки на новых автомагистралях, пересекающих плато Корат, и железнодорожных ветках, ведущих в северные долины. Провинциальные управления открывают свои двери в городах, которые раньше отправляли своих сыновей строить столицу. На этот раз блага развития достаются тем, кто обеспечил оглушительную победу на выборах."
 thailand.225.a: "Центральные регионы страны будут вознаграждены."
 thailand.226.t: "Правление короля Ваджиралонгкорна"
 thailand.226.d: "Год траура подходит к концу. Новый король ведет себя на троне иначе, чем его отец. Он более заметен на публике, жестче контролирует королевскую собственность и обладает иной королевской харизмой. Сеть, которая служила девятому правлению, должна научиться служить десятому. Это уже не та же самая сеть."
 thailand.226.a: "Королевство вступает в новую эру."
 thailand.227.t: "Ветераны возражают"
 thailand.227.d: "Объявление о поэтапной отмене воинской повинности вызвало скоординированную реакцию со стороны отставных офицеров и ветеранских организаций. В казармах старшие сержанты ворчат по поводу «опустевшей» армии. Пресса публикует фотографии старых генералов в парадной форме, выглядящих недовольными. Правительство ожидало этого, но масштабы протеста оказались выше, чем предполагали прогнозы."
 thailand.227.a: "Твердо стойте на своем. Реформа правильная."
 thailand.227.b: "Проведите церемонию чествования ветеранов и символически примите критику."
 thailand.228.t: "Туристический дивиденд"
 thailand.228.d: "Первый сезон после заключения соглашения об открытом небе завершился. Показатели Управления по туризму впечатляют. Число прибывших увеличилось на двенадцать процентов, средние суточные расходы выросли на девятнадцать процентов, а южные курорты, которые больше всего выигрывают от новых маршрутов бюджетных авиакомпаний, сообщают о лучшем квартале за десятилетие."
 thailand.228.a: "Баты текут рекой."
 thailand_news.13.t: "Таиланд, Ворота Азии"
 thailand_news.13.d: "Правительство Таиланда официально объявило, что его южный инфраструктурный коридор, будь то канал или сухопутный мост, «открыт для всех стран на справедливых условиях». Международные инвестиции уже начали поступать в Южную экономическую зону, и Бангкок принимает делегации из двенадцати стран, добивающихся льготных условий транзита."
 thailand_news.13.a: "Страна улыбок контролирует морские пути."
 thailand.250.t: "Правительство моргает"
 thailand.250.d: "Забастовка слишком долго парализовала страну, и цена за это стала невыносимой для власть имущих. Порты, железные дороги, министерства — всё остановилось, и улицы принадлежат движению. Вместо того чтобы рисковать тем, что армия начнет стрелять по собственному народу, кабинет министров открывает двери для переговоров. Это мирный путь к власти, завоеванный скорее мужеством, чем оружием."
 thailand.250.a: "Мы завоевали улицы. Теперь мы захватим государство."
 thailand.259.t: "Генералы восстанавливают порядок"
 thailand.259.d: "Забастовка затянулась, но так и не сломила волю правительства, и терпение высшего командования иссякло первым. Танки на улицах, лидеров забастовки арестовывают, введен комендантский час. Революция подавлена еще до того, как она смогла захватить власть, и теперь люди в форме правят во имя порядка. Красная дорога перекрыта."
 thailand.259.a: "Революция сломлена."
 thailand.251.t: "Мир содрогается"
 thailand.251.d: "Новое правительство Таиланда заявило о себе миру. Ответ Вашингтона последовал еще до того, как высохли чернила на учредительных документах партии. Экономические санкции, заморозка потока помощи и заявление Госдепартамента, которое одновременно было снисходительным и угрожающим. Пекин и Ханой, напротив, направили поздравления."
 thailand.251.a: "Пусть вводят санкции. Мы совершили эту революцию не для того, чтобы получить их одобрение."
 thailand.252.t: "Роялисты уходят"
 thailand.252.d: "Земельная реформа ответила на вопрос, который благопристойное бангкокское общество предпочитало не задавать. Те, кто сколотил свое состояние на старой системе, отсутствующие землевладельцы, инвестиционная сеть вокруг дворца, провинциальные семьи, владевшие десятью тысячами раи земли на имя каждого из своих детей, сделали свой выбор. Большинство из них уже летят в Сингапур, Лондон и Лос-Анджелес."
 thailand.252.a: "Страна не является своими землевладельцами."
 thailand.253.t: "Дилемма Чакри"
 thailand.253.d: "Династия Чакри правила Сиамом и Таиландом более двух столетий. Институт монархии, независимо от того, как относятся к людям, которые его занимали, вплетен в гражданский календарь, правовую систему, географию Бангкока и эмоциональную структуру значительной части населения. Партия должна решить, что она будет с ним делать.\n\nПриверженность партии целям революции не вызывает сомнений. Вопрос лишь в том, что лучше для них: чистый разрыв или управляемый переход."
 thailand.253.a: "Отменить монархию. Ей нет места в народной республике."
 thailand.253.b: "Сохраните конституционного главу государства на время правления партии."
 thailand_news.14.t: "Бамбуковый занавес падает"
 thailand_news.14.d: "Таиланд официально оформил свою ориентацию на союз с Лаосом и Вьетнамом в рамках региональной солидарности, которую аналитики уже называют «бамбуковым занавесом». Впервые со времен Камбоджи при Пол Поте правительство Юго-Восточной Азии заявило о своей ориентации на коммунистический блок. Западные столицы пересматривают свои приоритеты. Пекин приветствует это. Тайский бат был заменен новой валютой за одну ночь."
 thailand_news.14.a: "Карта Юго-Восточной Азии изменилась."
 thailand_news.31.t: "Город окружен сельской местностью."
 thailand_news.31.d: "После многих лет повстанческого движения, которое Бангкок называл пережитком проигранной войны, Коммунистическая партия Таиланда объявила открытую народную войну. Базы в северных высокогорных районах и на плато Исаан теперь находятся вне досягаемости сил безопасности, и новобранцы прибывают из деревень, которые государство давно перестало обслуживать. Военные аналитики, которые ранее считали это движение невозможным, теперь тихо пересматривают свои оценки."
 thailand_news.31.a: "Теперь эти холмы принадлежат им."
 thailand_news.32.t: "Таиланд присоединяется к «следу дракона»"
 thailand_news.32.d: "Бангкок подписал масштабное партнерское соглашение с Пекином. Оно приносит инвестиции, открывает доступ к торговле и обеспечивает понимание вопросов безопасности, прочно интегрируя революционный Таиланд в орбиту влияния Китая. Государственные СМИ называют это естественным сближением двух социалистических соседей. Западные дипломаты называют это сближением спутника с Солнцем. Строительные краны, возвышающиеся над Бангкоком, свидетельствуют о том, что деньги, по крайней мере, реальные."
 thailand_news.32.a: "Орбита установлена."
 thailand_news.33.t: "Федерация Трех Рек"
 thailand_news.33.d: "Таиланд, Лаос, Вьетнам и Камбоджа объявили о создании рамочного соглашения о создании индокитайской социалистической федерации, промышленным и дипломатическим центром которой станет Бангкок. Впервые революции Меконга говорят в один голос, и этот голос достаточно громкий, чтобы великие державы должны были ответить на него, а не игнорировать. Остается открытым вопрос, смогут ли четыре гордые столицы реализовать один проект."
 thailand_news.33.a: "Индокитай говорит как единое целое."
 thailand.260.t: "Красные рубашки берут Ратчапрасонг"
 thailand.260.d: "В Бангкоке настала очередь сельских избирателей. Десятки тысяч активистов в красных рубашках заняли перекресток Ратчапрасонг, коммерческий центр столицы, и возвели баррикады из заточенного бамбука и сложенных шин. Торговые центры закрыты, движение остановлено, и движение заявляет, что останется до тех пор, пока правительство не объявит выборы. Армия ждет указаний."
 thailand.260.a: "Пусть остаются. Город может пережить занятый перекресток."
 thailand.260.b: "Освободите перекресток. Столица не может оставаться закрытой бесконечно."
 thailand.270.t: "Создатель королей"
 thailand.270.d: "Партия Анутина Чарнвиракула занимает решающую позицию в новом парламенте. Его цена за вступление в коалицию не является необоснованной: несколько министерских постов, обязательство по расходам на развитие сельских районов и одно очень конкретное политическое обещание. Но коалиции всегда обходятся дороже, чем предполагает первоначальное предложение."
 thailand.270.a: "Сформируйте коалицию. Правящее большинство стоит этой цены."
 thailand.270.b: "Откажитесь. Мы можем управлять без них или не управлять вовсе."
 thailand.271.t: "Министерство министерств"
 thailand.271.d: "Переговоры на уровне кабинета министров завершены. Бхумджайтай получает посты министра здравоохранения, министра сельского хозяйства и заместителя премьер-министра. Документы подписаны, коалиция официально сформирована, и переговоры начинаются немедленно."
 thailand.271.a: "Коалиция держится. Пока что."
 thailand.272.t: "Движение за отмену"
 thailand.272.d: "Консервативные члены коалиции, а также связанные с роялистами группы гражданского общества вне её, развернули официальную кампанию по отмене закона о декриминализации каннабиса. Они собрали достаточно подписей, чтобы инициировать парламентские дебаты. Вопрос в том, будет ли правительство бороться за сохранение этой политики или предпочтёт её политическому миру."
 thailand.272.a: "Отмените закон. Стабильность важнее «зелёной лихорадки»."
 thailand.272.b: "Стойте на своем. Политика остается в силе. Пусть они доведут дело до суда."
 thailand.273.t: "Предложение из Бангкока"
 thailand.273.d: "Таиланд протягивает руку шану. Признание, оружие и функционирующая казна — вот что предлагается штату шан, который присоединится к Королевству. Автономия будет реальной. Как и связанная с ней зависимость, и Нейпьидо не простит такого выбора."
 thailand.273.a: "Примите защиту Бангкока."
 thailand.273.b: "Мы сами справимся."
 thailand.280.t: "Первая победа на выезде"
 thailand.280.d: "Первый внедорожник Win 4x4 от Chaiseri Metal and Rubber нашел покупателей по всей ассоциации. Среди них индонезийская морская пехота, филиппинская полиция, малайский пограничный полк. Первая партия уже отправлена. Комиссия экспортного агента меньше, чем дивиденды от повышения репутации. Теперь Юго-Восточная Азия знает, что Таиланд производит товары, которые стоит покупать."
 thailand.280.a: "Подпишите контракты. Рынок АСЕАН — наш."
 thailand.281.t: "Морские пехотинцы тренируются в Саттахипе"
 thailand.281.d: "В ходе первых за десятилетие специализированных десантных учений Королевской морской пехоты Таиланда батальон прошел десантные пути на военно-морской базе Саттахип. Разработана новая доктрина, выделено финансирование на расширение верфи, а командующий Корпусом перестал извиняться за бюджет и начал планировать следующие учения."
 thailand.281.a: "С моря."
 thailand_news.15.t: "Таиланд, развивающийся арсенал стран АСЕАН"
 thailand_news.15.d: "Волна контрактов на экспорт оборонной продукции, подписанных в Бангкоке в этом квартале, заставила региональных аналитиков пересмотреть позицию Таиланда на рынке вооружений Юго-Восточной Азии. Бронемашины First Win MRAP находятся на вооружении Филиппин и Индонезии, а артиллерийские взрыватели тайского производства — на складах Малайзии. Королевский тайский арсенал перестал быть программой внутренних закупок и стал региональным поставщиком."
 thailand_news.15.a: "Заводы Королевства работают."
 thailand_news.16.t: "Бангкок объявил о доктрине многодоменных операций."
 thailand_news.16.d: "Верховное командование Королевских Вооруженных сил Таиланда опубликовало первую официальную доктрину многодоменных операций, объединяющую кибервойну, радиоэлектронную борьбу, удары беспилотников и обычные наземные маневры в единую оперативную структуру. Разработанная в ходе совместных учений с американскими и австралийскими партнерами, доктрина многодоменных операций свидетельствует о том, что Таиланд больше не рассматривает войну как противостояние в одной области."
 thailand_news.16.a: "Королевство воюет на всех фронтах."
 thailand.310.t: "Реактор переходит в критическое состояние."
 thailand.310.d: "В 3:47 утра показания приборов в диспетчерской поднимаются выше нуля. Первый в Таиланде реактор с водой под давлением достиг критического состояния. Главный инженер называет это технической вехой, а кабинет министров – энергетической безопасностью. Оба правы. К утру национальная энергосистема будет выглядеть иначе."
 thailand.310.a: "Новая эра базовой мощности."
 thailand.311.t: "Пномпень отвечает"
 thailand.311.d: "Министерство иностранных дел Камбоджи ответило на предложения Бангкока более официально, чем ожидалось, и более тепло, чем опасались. Расчеты правительства Пномпеня ясны. Тесные отношения с Таиландом — это страховка от чрезмерной зависимости от Пекина и источник дохода, который может обеспечить самая быстрорастущая экономика региона."
 thailand.311.a: "Приветствуем наше партнерство."
 thailand.311.b: "Действуйте осторожно. Прогресс требует времени."
 thailand.312.t: "Джакартский диалог"
 thailand.312.d: "Индонезийская делегация прибыла без подготовленного совместного коммюнике. Джакарта хочет знать, каковы намерения Бангкока. Подлинное партнерство на региональном уровне или конкуренция за лидерскую роль в АСЕАН, которую Индонезия давно считает своей? Оба варианта рассматриваются. И ни один из них не является дешевым."
 thailand.312.a: "Партнерство. Совместные учения, общая доктрина, взаимная выгода."
 thailand.312.b: "Конкуренция. Мы превзойдём Джакарту по влиянию в её собственном регионе."
 thailand.313.t: "Китайский контрактный файл"
 thailand.313.d: "Оценка Министерства финансов однозначна. Подписанные в рамках инициативы «Один пояс и один путь» инфраструктурные контракты обеспечили строительство необходимых Таиланду дорог и железных дорог, но условия финансирования закрепляют влияние Пекина в проектах на целое поколение. Перед кабинетом министров стоит вопрос: продолжать ли привлекать китайский капитал или смириться с краткосрочными трудностями, связанными с пересмотром условий."
 thailand.313.a: "Сохраните финансирование. Проекты окупаются."
 thailand.313.b: "Пересмотрите условия. Суверенитет стоит денег."
 thailand.314.t: "Вашингтон запрашивает пересмотр"
 thailand.314.d: "Тихоокеанское командование США официально запросило двусторонний обзор вопросов безопасности. На практике это приглашение углубить приверженность Таиланда договору, принять программы обучения и смириться с политической значимостью, которая сопутствует статусу самого надежного партнера Америки в Юго-Восточной Азии. Альтернатива — сохранение этой позиции."
 thailand.314.a: "Укрепляйте альянс. Принимайте участие в обучении и берите на себя обязательства."
 thailand.314.b: "Дистанцироваться. Такая страховка больше отвечает интересам Таиланда."
 thailand_news.17.t: "В Таиланде запущен первый ядерный реактор."
 thailand_news.17.d: "Королевское правительство Таиланда ввело в полную эксплуатацию первую в стране коммерческую атомную электростанцию, став первой страной в Юго-Восточной Азии, эксплуатирующей гражданскую атомную энергетику. Реактор с водой под давлением мощностью 600 мегаватт, расположенный в провинции Чаченгсао, будет обеспечивать примерно восемь процентов национальной потребности в электроэнергии. Аналитики отмечают двойную полезность реактора. Он обеспечивает энергетическую безопасность и открывает новые возможности для развития техники в регионе, где ядерный потенциал все чаще становится показателем амбиций средних держав."
 thailand_news.17.a: "Королевство вступает в ядерную эпоху."
 thailand.315.t: "Мина в Та-Муен-Том"
 thailand.315.d: "В результате взрыва мины вблизи спорного храмового комплекса Та Муен Том ранены трое солдат Королевской тайской армии. Обе стороны обвиняют друг друга в установке мины. Инцидент вызвал националистические протесты в Бангкоке и Пномпене."
 thailand.315.a: "Требуйте ответов и мобилизуйте националистические настроения."
 thailand.315.b: "Обратитесь к АСЕАН за посредничеством и позвольте дипломатам возглавить процесс."
 thailand.316.t: "В Та Муен Томе произошла стрельба."
 thailand.316.d: "Вдоль спорной границы вспыхнули столкновения. Оба правительства находятся под давлением со стороны своих вооруженных сил и националистических движений. Генеральный секретарь АСЕАН выступил с заявлением, призывающим к сдержанности."
 thailand.316.a: "Воспользуйтесь преимуществом."
 thailand.316.b: "Примите соглашение о прекращении огня, достигнутое в рамках АСЕАН."
 thailand.317.t: "Июльская война, полномасштабное военное столкновение"
 thailand.317.d: "В течение недели тайские и камбоджийские войска вели пограничные бои вблизи Та Муен Том и Преах Вихеар. Артиллерийские перестрелки привели к жертвам с обеих сторон. АСЕАН созвала экстренный саммит."
 thailand.317.a: "Примите соглашение о прекращении огня в рамках АСЕАН после демонстрации силы."
 thailand.317.b: "Окопайтесь и удерживайте достигнутые позиции."
 thailand.318.t: "На границе вновь обострилась напряженность."
 thailand.318.d: "Несмотря на соглашение о прекращении огня, столкновения вдоль спорной границы возобновились. Декабрьская вспышка конфликта станет проверкой того, смогут ли две страны сдержать достигнутое соглашение или снова скатятся к открытому конфликту."
 thailand.318.a: "Подтвердить прекращение огня."
 thailand.318.b: "Возобновить боевые действия."
 thailand.319.t: "Вашингтон отклонил заявку на F-35."
 thailand.319.d: "Соединенные Штаты отклонили официальный запрос Таиланда на истребители F-35 Lightning II, сославшись на ограничения в передаче технологий и опасения по поводу отношений Таиланда с Китаем."
 thailand.319.a: "Продолжайте программу Gripen E/F."
 thailand.319.b: "Вместо этого выберите F-16V Block 70."
 thailand.319.c: "Переходим на J-10CE. Пекин обеспечит поставки."
 thailand.320.t: "Паэтонгтарн отстранен судом от должности."
 thailand.320.d: "Конституционный суд Таиланда отстранил премьер-министра Паетонгтарн Шинаватру от должности после утечки телефонного разговора, в котором она, по всей видимости, подрывала независимое ведомство. Анутин Чарнвиракул из Бхумджайтхая назначен исполняющим обязанности премьер-министра."
 thailand.320.a: "Примите вердикт."
 thailand.320.b: "Оспорьте решение суда."
 thailand.321.t: "Анутин берет бразды правления в свои руки."
 thailand.321.d: "Анутин Чарнвиракул возглавляет временное правительство, пользующееся поддержкой Народной партии. Он пообещал провести новые выборы в течение четырех месяцев."
 thailand.321.a: "Временное правительство приступает к своей работе."
 thailand.322.t: "В Таиланде выборы состоятся в феврале 2026 года."
 thailand.322.d: "В Таиланде пройдут всеобщие выборы, которые определят политическое направление страны на следующие четыре года. Пограничная война усилила националистические настроения в отношении Бхумджайтхая. Народная партия лидирует в опросах среди городского населения."
 thailand.322.a: "Бхумджайтай побеждает, и мандат Анутина подтверждается."
 thailand.322.b: "Коалиция Народной партии приходит к власти."
 thailand_news.18.t: "Брокеры АСЕАН Тайско-камбоджийское перемирие"
 thailand_news.18.d: "Ассоциация государств Юго-Восточной Азии (АСЕАН) успешно выступила посредником в достижении соглашения о прекращении огня между Таиландом и Камбоджей, положив конец многонедельным пограничным столкновениям вблизи храмового комплекса Та Муен Том. Генеральный секретарь АСЕАН приветствовал этот результат как доказательство того, что региональные институты могут сдерживать двусторонние конфликты до того, как они перерастут в открытую войну."
 thailand_news.18.a: "Регион пока держится."
 thailand_news.19.t: "Партия Анутина доминирует на выборах в Таиланде."
 thailand_news.19.d: "На всеобщих выборах в Таиланде в феврале 2026 года партия Бхумджайтай получила 193 места, обеспечив Анутину Чарнвиракулу убедительный мандат и положив конец многомесячной неопределенности в отношении временного правительства. Результат укрепляет консервативно-популистский политический центр Таиланда и создает предпосылки для полного четырехлетнего срока полномочий."
 thailand_news.19.a: "Новый мандат для Королевства."
 thailand.330.t: "Душа офицерского корпуса"
 thailand.330.d: "В Генеральном штабе разгорается тихий спор. Одна фракция хочет профессиональную, аполитичную армию из компетентных специалистов. Другая — прославленную военную касту, гордость и меч нации. Выбор, сделанный сейчас Королевством, определит офицерский корпус на целое поколение."
 thailand.330.a: "Создайте профессиональный корпус."
 thailand.330.b: "Развивайте воинской доблесть."
 thailand.334.t: "Подводная лодка введена в строй"
 thailand.334.d: "Спустя годы после споров вокруг двигателя, первая подводная лодка S26T наконец-то принята на вооружение Королевского военно-морского флота Таиланда. Экипаж упорно тренировался ради этого дня. Какими бы ни были политические аспекты закупки, Таиланд теперь располагает современной подводной лодкой, и региональный баланс немного смещается в сторону юга."
 thailand.334.a: "Флот выходит в море."
 thailand_news.26.t: "Недовольный из-за Бангкока"
 thailand_news.26.d: "Королевские ВВС Таиланда получили свои первые многоцелевые истребители JAS 39 Gripen, совершив на них показательный полет над столицей в честь этого знаменательного события. Эти самолеты шведского производства обеспечивают Таиланду реальные возможности воздушного боя четвертого поколения и плацдарм в современной воздушной войне с использованием передачи данных."
 thailand_news.26.a: "Небо над Королевством находится под охраной."
 thailand_news.27.t: "Тайское оружие на мировом рынке"
 thailand_news.27.d: "Новое Управление по экспорту оборонной продукции Таиланда объявило о первой волне зарубежных контрактов. Бронетехника, артиллерия и боеприпасы предназначены для покупателей в Юго-Восточной Азии и за ее пределами. Оборонная промышленность Королевства, когда-то бывшая бюджетной статьей расходов, становится источником экспортных доходов."
 thailand_news.27.a: "Сделано в Таиланде, продается по всему миру."
 thailand_news.28.t: "Нация в оружии"
 thailand_news.28.d: "В Бангкоке представлена программа тотальной обороны. Она предусматривает расширение резервов, проведение учений гражданской обороны в каждой провинции и доктрину, рассматривающую все общество как последнюю линию сопротивления. Критики называют это милитаризацией, а правительство — благоразумием."
 thailand_news.28.a: "Вся страна готова."
 SIA_expansionism_threat: "Тайский экспансионизм"
 thailand.380.t: "Инженеры на перешейке"
 thailand.380.d: "Вердикт комиссии по оценке целесообразности вынесен. Сокращение затрат жесткое, но возможное. Остается только тот вопрос, который стоил проекту столетие, — кто за него заплатит. На столе в кабинете министров лежат три предложения от иностранных компаний, а также вариант финансирования собственными силами. Каждое из них имеет свою цену, измеряемую не только в батах."
 thailand.380.a: "Принять финансирование Пекина в рамках инициативы «Один пояс и один путь». Дёшево, быстро, а об условиях подумаем позже."
 thailand.380.b: "Выбирайте Японию. Более медленный и дорогой путь, но зато надежный и без скрытых условий."
 thailand.380.c: "Привлечь международный консорциум. Поэтапный, совместный и не зависящий от какой-либо одной державы."
 thailand.380.e: "Построим сами. Канал будет тайским до последнего столбика."
 thailand.381.t: "Начало строительства"
 thailand.381.d: "Ограждения заложены, подняты первые кубометры грунта, и масштабная выемка на Кра-Истме началась в полную силу. Работы будут проводиться поэтапно, каждый этап станет новым испытанием для стойкости казначейства."
 thailand.381.a: "Начинаем копать!"
 thailand.382.t: "Этап завершен."
 thailand.382.d: "Завершен и утвержден инженерами очередной этап строительства канала. Выемка стала глубже, работы продвинулись дальше, и кабинет министров позволяет себе на мгновение осторожную гордость перед тем, как поступит следующий счет."
 thailand.382.a: "Переходим к следующему этапу."
 thailand.383.t: "Перерасход средств"
 thailand.383.d: "Последний этап проекта вышел за рамки бюджета. Твердые породы, затопленная галерея и пересмотренная смета подрядчика вынудили проектный офис обратиться к правительству за решением. Найти деньги или смириться с тем, что канал откроется позже, чем было обещано."
 thailand.383.a: "Вкладывайте деньги и придерживайтесь графика."
 thailand.383.b: "Примите задержку. Казначейство — на первом месте."
 thailand.384.t: "Канал готов."
 thailand.384.d: "Последняя шлюзовая задвижка установлена, вершина канала затоплена, и лоцманы совершили свои первые проходы в балласте. Строительство канала Кра завершено, за исключением церемонии перерезания ленточки. Королевство может объявить этот мегапроект завершенным."
 thailand.384.a: "Перережьте ленту и откройте канал."
 thailand.385.t: "Саботаж на участке Кат"
 thailand.385.d: "Взрыв на насосной станции и разрушенная подъездная дорога несут на себе отпечаток восстания на юге страны. Канал проходит через спорную территорию, и противники Бангкока нашли цель, достойную заголовка в прессе. Проектный офис хочет принять решение: усилить укрепления или поговорить с местными жителями."
 thailand.385.a: "Усилить меры безопасности вдоль коридора."
 thailand.385.b: "Ведите переговоры с местными лидерами. Покупайте мир, а не просто охранников."
 thailand.386.t: "Пекин требует погашения кредита"
 thailand.386.d: "Перерасход средств привел к нарушению одного из пунктов соглашения «Один пояс и один путь», и переговорщики из Пекина прибыли в Бангкок с папкой вариантов, все из которых выгодны Китаю. Долг в юанях стал рычагом давления, а сам канал — залогом. Кабинету министров предстоит решить, как отреагировать на этот призыв."
 thailand.386.a: "Предоставьте Пекину операционную аренду и пусть он возьмет на себя часть платы за проезд."
 thailand.386.b: "Провести реструктуризацию на жестких условиях. Погасить долг и сохранить тайский канал."
 thailand.386.c: "Дефолт. Канал наш, так что пусть рынки делают всё, что в их силах."
 thailand.388.t: "Бегство капитала"
 thailand.388.d: "Дефолт напугал рынки. Иностранные инвесторы уходят, бат падает, а центральный банк тратит резервы, чтобы смягчить панику. Ущерб серьезный, но государство, которое выстояло, со временем его преодолеет."
 thailand.388.a: "Переждите бурю."
 thailand.389.t: "Вашингтон и Дели, обратите внимание!"
 thailand.389.d: "Передача Китаем права эксплуатации месторождения Кра вызвала тревогу от Вашингтона до Нью-Дели. Обе столицы опасаются, что Пекин может создать для них узкое место в своей юрисдикции, и обе наблюдают за тем, успокоит ли их Бангкок или же склонится еще дальше на восток."
 thailand.389.a: "Успокойте обе стороны и используйте политический капитал, чтобы удержать их на своей стороне."
 thailand.389.b: "Настройтесь на Пекин. Партнерство уже налажено, так что позвольте Западу адаптироваться."
 thailand.390.t: "Пролив теряет свою монополию"
 thailand.390.d: "Первые загруженные танкеры проходят через пролив Кра, и крупные порты Малаккского пролива подсчитывают убытки. Сингапур и Куала-Лумпур, сколотившие свои состояния на этом старом узком проходе, наблюдают, как их транзитные доходы утекают на север, и они еще долго не простят Королевству, которое их истощило."
 thailand.390.a: "Теперь Бангкоку отвечают два океана."
 thailand.391.t: "Какой именно канал?"
 thailand.391.d: "Канал открыт, но каким он станет? Крепостью, которую военно-морской флот удерживает силой, закрытой для соперников и ощетинившейся батареями? Или нейтральным международным проходом, открытым для всех флагов и гарантированным договором? Этот выбор определит место Таиланда среди морских держав на целое поколение."
 thailand.391.a: "Укрепите Кра, чтобы обороняться и закрыть доступ для чужих."
 thailand.391.b: "Откройте Кра для всех, кто мирно платит дань."
 thailand_news.20.t: "Два океана, одно королевство"
 thailand_news.20.d: "После долгих лет работы, миллиардов бат и геополитических событий, которые не мог предвидеть ни один инженер, канал Кра открыт. Впервые суда проходят между Андаманским морем и Сиамским заливом, не огибая Малайский полуостров. Карта азиатской торговли перерисована, и Бангкок держит перо в своих руках."
 thailand_news.20.a: "Канал, строительство которого заняло столетие."
 thailand.393.t: "Изгой региона"
 thailand.393.d: "Маска снята. Стремление Бангкока подчинить себе соседей лишило его всяких претензий на лидерство в АСЕАН. Столицы Юго-Восточной Азии отшатнулись, и мир в целом переосмыслил свою стратегию. Таиланд больше не является председателем региона. Он представляет угрозу для всего региона, и дипломатические и экономические барьеры уже возводятся."
 thailand.393.a: "Пусть боятся нас. Империю никогда не завоевывали друзья."
 thailand.394.t: "Вашингтон осуждает Бангкок"
 thailand.394.d: "Соединенные Штаты резко осудили агрессию Таиланда в Юго-Восточной Азии. Вашингтон дает понять, что будет на стороне находящихся под угрозой государств региона, рассматривая гарантии и призывая своих партнеров сплотиться против потенциального гегемона. Американское влияние, на которое когда-то рассчитывал Бангкок, ослабевает."
 thailand.394.a: "Неодобрение со стороны американцев не остановит марш."
 thailand.395.t: "Открытая ладонь Пекина"
 thailand.395.d: "Там, где Вашингтон отступает, Пекин наступает. Китай видит в изолированном, агрессивном Таиланде полезного партнера, державу, которая сожгла мосты с Западом и регионом и теперь ей больше некуда обратиться. Изгойский статус Бангкока — это возможность для Пекина, и протянутая рука подразумевает определенные условия, от которых Королевство больше не может отказаться."
 thailand.395.a: "Если Восток нас примет, пусть так и будет."
 thailand.431.t: "Приглашение из Бангкока"
 thailand.431.d: "Таиланд направил официальное приглашение присоединиться к Организации Договора о Юго-Восточной Азии (АСЕАН). Соглашение предусматривает совместное командование, взаимную безопасность и единый региональный голос под руководством Бангкока. Однако АСЕАН всегда оберегала свою независимость, и привязать свою судьбу к Таиланду — это немалый шаг. Выбор за нами, и мы можем отменить его, если он больше нам не служит."
 thailand.431.a: "Мы согласны. Наша безопасность сильнее, если ею пользоваться на двоих."
 thailand.431.b: "Мы отказываемся. Наша независимость не предназначена для торговли."
 thailand.425.t: "[FROM.GetNameDefCap] подписывает договор"
 thailand.425.d: "Ответ от [FROM.GetNameDefCap]: да. Их делегация направляется в Бангкок для подписания соглашения, и Организация Договора Юго-Восточной Азии пополнится членом. Каждая подпись облегчает получение следующей."
 thailand.425.a: "Ещё одно место за столом."
 thailand.426.t: "[FROM.GetNameDefCap] отклоняет приглашение"
 thailand.426.d: "[FROM.GetNameDefCap] поблагодарил нас за предложение и отказался от него. Язык общения теплый, и ответ — нет. Подобный договор никому не может быть навязан, и дверь остается открытой."
 thailand.426.a: "Это их выбор. Предложение остается в силе."
 SIA_kra_fortress_threat: "Укрепления канала Кра"
 SIA_kra_default_threat: "Суверенный дефолт Таиланда"
 SIA_kra_chokepoint_threat: "Узкое место Кра"
 SIA_asean_hegemon_threat: "Таиланд претендует на гегемонию в АСЕАН."
 thailand.410.t: "Карта Великого Королевства"
 thailand.410.d: "Вновь появились старые карты, на которых Лан На, холмы Шан, утраченные провинции Камбоджи и Лаоса, а также малайский юг по праву обозначены как тайские территории. Пантайское движение теперь имеет свой голос в правительстве и прямо задает вопрос: должно ли Королевство провозгласить миру свои территориальные притязания, или добиваться тех же целей более мягкими методами? Все великие державы наблюдают за ответом Бангкока."
 thailand.410.a: "Заявите об этом. Эти земли принадлежат Таиланду, и об этом должен знать весь мир."
 thailand.410.b: "Тихо. Мы занимаем позицию, не бряцая саблей."
 thailand.411.t: "Один народ, одна судьба"
 thailand.411.d: "Идея пантайского движения перестала быть маргинальным увлечением офицеров и историков. На Санам Луанг проходят митинги, а пресса распространяет знамена единого тайского государства, простирающегося от Юньнани до перешейка. У движения теперь есть публичное лицо, и правительство тоже решило его ему придать."
 thailand.411.a: "Пусть народ услышит своё собственное имя."
 thailand.412.t: "Бамбук на ветру"
 thailand.412.d: "Таиланд гнется, но не ломается. Отказываясь выбирать между Вашингтоном и Пекином, Бангкок поддерживает постоянный контакт с обеими странами, применяя старую «бамбуковую дипломатию» в современном ключе. Обе столицы посылают теплые сигналы, и ни одна из них не может позволить себе подтолкнуть Королевство в объятия другой."
 thailand.412.a: "Мы оставляем за собой право выбора, а друзьям — гадать."
 thailand.413.t: "Вопрос о топливном цикле"
 thailand.413.d: "Новые реакторы Таиланда работают на основе суверенного топливного цикла, а суверенный топливный цикл подразумевает обогащение урана, а обогащение урана означает, что грань между гражданской энергетикой и вариантом создания оружия становится всё тоньше. МАГАТЭ требует усиления гарантий, Вашингтон — гарантий, а регион хочет знать, каковы намерения Бангкока. Программы создания бомбы пока нет, но возможность её создания уже достижима, и Королевству предстоит решить, насколько далеко оно готово пройти."
 thailand.413.a: "Бросьте им вызов. Суверенное обогащение — наше право, независимо от того, защищено оно или нет."
 thailand.413.b: "Успокойте их. Примите все необходимые меры предосторожности и сохраните доверие."
 thailand.413.a_tooltip: "§RТревога по поводу распространения.§! Таиланд получает статус угрозы §YСопротивление суверенному обогащению§!, Соединенные Штаты резко выступают против Бангкока, в то время как Индия становится настороженной, а §Rвлияние США в Таиланде падает на 15%§!."
 thailand.414.t: "Устав Стражей"
 thailand.414.d: "Конституция переписана так, что стражам никогда не приходится спать. Назначенные советы, зарезервированные полномочия и сенат, подотчетный казармам. Глубинное государство перестало быть неформальной привычкой и стало письменной гарантией. Порядок обеспечен, и цена за это — тихая смерть ничем не ограниченной политики."
 thailand.414.a: "Стабильность, ставшая постоянной."
 SIA_guardianship_cost_tt: "Международное сообщество содрогается от постоянного закрепления роли защитников.\n - §RКазна -20§!\n - §RОтношение США и Великобритании ухудшается§!"
 thailand.415.t: "Pax Aseana"
 thailand.415.d: "От Манилы до Джакарты, от Ханоя до Сингапура, столицы Юго-Восточной Азии поднимают бокалы за Бангкок. Там, где раньше они опасались стремления Таиланда к господству, теперь они видят гаранта, Королевство, которое руководит на основе доверия, строит свой пакт на согласии и соблюдает обещанный мир. Это Pax Aseana, и Таиланд во главе его стоит не как завоеватель, а как партнер."
 thailand.415.a: "Мирный регион, и Таиланд — его краеугольный камень."
 thailand.416.t: "После генерала"
 thailand.416.d: "Генералу еще предстоит пройти свой премьерский срок, медовый месяц и осуществить плавный переходный период. Истеблишмент может еще больше укрепить свои позиции, заполнив государственные структуры и усилив контроль партии над государственным аппаратом, или же он может оценить ситуацию, институционализировать достигнутые успехи и вернуться к более ориентированной на гражданскую общественность позиции, прежде чем терпение общественности иссякнет."
 thailand.416.a: "Укрепиться. Власть усиливает свою хватку."
 thailand.416.b: "Внедрить на институциональном уровне. Закрепить достигнутые результаты, смягчить облик."
 thailand.417.t: "Восточный двигатель запускается"
 thailand.417.d: "Вдоль восточного побережья постоянно ведутся строительные работы. Новые железные дороги, новые взлетно-посадочные полосы, новые индустриальные парки. Восточный экономический коридор набирает обороты, и инвестиции начинают накапливаться. Чонбури, Районг и Чачоенгсао становятся движущей силой тайской экономики."
 thailand.417.a: "В коридоре царит оживленная атмосфера."
 SIA_nuclear_defiance_threat: "Противодействие суверенному обогащению"
 SIA_tsunami_warning: "Сеть предупреждений о цунами"
 thailand.363.t: "Ловушка производительности"
 thailand.363.d: "Годы экономического роста закончились. Поколение окончило университет и оказалось в застое экономики с низкими зарплатами, работой на заводах, переведенной за границу, и рынком недвижимости, на который им никогда не удастся попасть. Это самое образованное поколение в истории Таиланда, и они никуда не двинутся, и они точно знают, кого винить. Перекрестки Бангкока заполняются жестами, а хэштеги набирают популярность быстрее, чем полиция успевает их читать. Движение вперед говорит на их языке. Медленная, комфортная политика прошлого их не удержит."
 thailand.363.a: "Откройте систему. Признайте необходимость реформ, дайте новой политике возможность развиваться."
 thailand.363.b: "Сначала порядок. Освободите улицы и переключитесь на ситуацию в стране."
 thailand.363.c: "Выиграйте время, обеспечив рост. Переключитесь на стимулирующие меры и смягчите давление."
 thailand.364.t: "Два Таиланда"
 thailand.364.d: "Внутри королевства существуют две страны. Одна — это Бангкок и столицы провинций, выпускники вузов, офисные небоскребы, кафе, где реформы — само собой разумеющееся. Другая — это рисоводческий пояс и северо-восток, где популисты построили свою машину на деревенских средствах и субсидиях на рис и никогда от этого не отказывались. Они хотят разного, боятся разного будущего и голосуют за разные партии. Правительство должно выбрать, где оно водрузит свой флаг, или притвориться, что может стоять совершенно выше линии фронта."
 thailand.364.a: "Привлечение столицы и выпускников – будущее урбанизации Таиланда."
 thailand.364.b: "Завоюйте расположение рисоводческого пояса, высокогорной базы, обеспечивающей поставки."
 thailand.364.c: "Поднимитесь над пропастью. Только трон объединяет два Таиланда."
 thailand.365.t: "Эхо репрессий"
 thailand.365.d: "Очистка улиц не утихомирила недовольство. Она лишь обострила его. Движение, распавшееся на части, перегруппировалось, стало больше и гневнее, его лидеры теперь стали мучениками, а требования – не подлежащими обсуждению. То, что было протестом, становится определяющим делом целого поколения, и каждая эстафетная палочка, зажженная в прошлом году, в этом году привлекла еще десять человек."
 thailand.365.a: "Это уже не вернуть назад. Переждите бурю."
 thailand.418.t: "Джунгли оживают"
 thailand.418.d: "Страдания затянулись слишком надолго. В отдалённых районах, о которых государство забыло, всплывают старые имена. Кадры, носившие винтовки в составе Коммунистической партии Таиланда до амнистии, теперь поседели, но не забыты, и поколение их внуков, которым нечего терять. Кружки изучают историю при свете лампы, и красный флаг, сложенный сорок лет назад, встряхивают. Джунгли, поглотившие последнее восстание, всё ещё там. И горечь, которая его наполняла, тоже."
 thailand.418.a: "Пусть ячейки организуются. Сельская местность принадлежит нам, и мы можем её потерять."
 thailand.418.b: "Разгромите подполье. Соберите боевиков, прежде чем это распространится."
 thailand.418.c: "Осушите болото недовольства. Вложите деньги в районы."
 thailand.74.t: "Дело об активах"
 thailand.74.d: "Конституционный суд рассматривает вопрос о том, скрывал ли премьер-министр свои акции за спиной своей домработницы, водителя и охранника. Обвинительный вердикт ставит крест на премьерстве еще до его начала. Мнения судей расходятся, и дворец, пресса и генералы внимательно следят за тем, как будет вынесен вердикт."
 thailand.74.a: "Надавите на судей. Вердикт будет в нашу пользу."
 thailand.74.b: "Подчинитесь процессу и позвольте суду принять решение."
 thailand.75.t: "Так Бай"
 thailand.75.d: "На мусульманском юге солдаты сажают сотни связанных протестующих в армейские грузовики. К моменту прибытия колонны восемьдесят пять человек погибли, большинство из них задохнулись. Кадры облетели весь мир. Офицерский корпус сплотился вокруг своих, и вопрос в том, осмелится ли гражданское правительство спросить, что произошло."
 thailand.75.a: "Поддержите армию. Никаких расследований."
 thailand.75.b: "Назначьте расследование. Армия подотчётна нам."
 thailand.76.t: "Сканеры CTX"
 thailand.76.d: "Затраты на сканеры для обнаружения бомб в новом аэропорту утроились, а наценка исчезла в цепочке посредников, близких к кабинету министров. Честная проверка поставила бы правительство в неловкое положение. Замалчивание разницы лишь подпитывает растущую историю об администрации, которая относится к казначейству как к семейному счету."
 thailand.76.a: "Скройте результаты аудита, а разницу отложите на банковский счет."
 thailand.76.b: "Расторгните контракт и минимизируйте убытки."
 thailand.77.t: "Заставить замолчать критиков"
 thailand.77.d: "Ежедневные трансляции медиамагната стали символом объединения антиправительственных настроений, и независимая телекомпания iTV теряет контроль над ситуацией. Иски о клевете, давление со стороны лицензионных органов и лояльные владельцы могут заставить их подчиниться, но это лишь подтвердит все заявления критиков о ползучем господстве одного человека."
 thailand.77.a: "Приручите прессу."
 thailand.77.b: "Пусть пресса продолжает свою работу и отвечает словами."
 thailand.78.t: "Парламент из одного человека"
 thailand.78.d: "Правящая партия получила абсолютное большинство, сформировав первое в истории Таиланда однопартийное правительство. Отсутствие коалиции и наличие в независимых органах лояльных сторонников позволяют премьер-министру править бесконтрольно. Для рисоводческого пояса это мандат, а для бангкокской элиты и военных казарм — зарождающаяся выборная диктатура."
 thailand.78.a: "Управлять бесконтрольно. Это нам дали сами люди."
 thailand.78.b: "Заигрывайте с оппозицией и садитесь за стол переговоров."
 thailand.73.t: "Продажа компании Shin Corp."
 thailand.73.d: "Семья премьер-министра продает свою телекоммуникационную империю сингапурскому государственному фонду примерно за семьдесят три миллиарда бат и, благодаря удобной реструктуризации, не платит ни копейки налогов. Законность безупречна, но внешний вид катастрофичен. Через несколько дней улицы заполняются людьми в желтых рубашках, и армия начинает вслух задавать вопрос, обязывает ли конституция по-прежнему человека, продавшего национальное достояние без уплаты налогов."
 thailand.73.a: "Заберите миллиарды себе. Всё было законно."
 thailand.73.b: "Заплатите налог и утихомирьте ярость."
 thailand.420.t: "Популистский мандат"
 thailand.420.d: "Власть перешла к популистскому лагерю. Рисоводческий пояс и городская беднота вновь обрели своё правительство, а вместе с ним и таксинскую программу: деревенские фонды, дешёвое здравоохранение и лидер, говорящий на их языке. Дух старой элиты иссяк, дворцовые связи и реформаторская фракция исчезают, и новая машина берёт рычаги управления в свои руки. Казармы, как всегда, наблюдают."
 thailand.420.a: "В сельской местности есть своё правительство."
 thailand.421.t: "Возвращение истеблишмента"
 thailand.421.d: "Рычаги управления перешли к роялистской элите, будь то путем голосования, дворцовых сделок или танковых атак на рассвете. Сетевая монархия вновь утверждает себя. Тайные советники, генералы и великие дома сплачиваются вокруг трона. Дух популистской машины угасает вместе с ее мандатом, а реформаторское движение сметается со стола переговоров. Королевство стабилизируется под знакомыми руками."
 thailand.421.a: "В королевстве воцарился порядок."
 thailand.422.t: "Волна реформ"
 thailand.422.d: "К власти пришло новое поколение. Реформаторское движение, выходившее на улицы с протестами, теперь заседает в кабинете министров, и повестка дня смещается в сторону демонтажа старого порядка: воинской повинности, монополий, неприкасаемых институтов. Боевой дух предыдущего правительства угасает, а его лидеры уходят. Вопрос в том, позволит ли истеблишмент продолжить этот эксперимент."
 thailand.422.a: "Будущее уже здесь."
 thailand.423.t: "Суд выносит решение."
 thailand.423.d: "Конституционный суд нацелился на правящую партию. Готовится постановление о роспуске, и исполнительная власть может быть смещена судебным указом, как это уже случалось до этого. Правительство может подчиниться вердикту и передать власть своим соперникам, или же бросить вызов суду и рискнуть столкнуться с последствиями."
 thailand.423.a: "Примите приговор и с достоинством отойдите в сторону."
 thailand.423.b: "Бросьте вызов суду. Мы отвечаем перед избирателями, а не перед судьями."
 thailand.424.t: "Демократы выстояли"
 thailand.424.d: "Власть вернулась к Демократической партии, старейшей в Королевстве, будь то изменение результатов выборов или решение суда, передавшего исполнительную власть оппозиции. Никакой сокрушительной победы, никакого харизматичного миллиардера, только терпеливое, непривлекательное управление в рамках широкой гражданской коалиции, ставящее будущее на институты, а не на одного лидера. Дух предыдущего правительства угасает вместе с его мандатом. А в рисоводческом поясе машина Таксина уже набирает силу для следующего раунда."
 thailand.424.a: "Власть имущие не сдаются."
 thailand.430.t: "Для чего нужны бомбы?"
 thailand.430.d: "Первые боеголовки в Таиланде существуют, но незаявленное оружие никого не останавливает. Совет национальной безопасности должен ответить на вопрос, на который должна ответить каждая ядерная держава: при каких обстоятельствах Королевство когда-либо применит их? Наша позиция определит, как регион и великие державы воспримут наши намерения."
 thailand.430.a: "Только ответный удар. Мы наносим удары только в случае применения стратегического оружия."
 thailand.430.b: "Тактический и стратегический ответ. Мы отвечаем на любую ядерную атаку аналогичным образом."
 thailand.430.c: "Заявлено о первом применении. Пусть наши враги гадают и боятся."
 thailand_news.30.t: "Таиланд вступил в ядерный клуб"
 thailand_news.30.d: "Бангкок подтвердил слухи, которые спецслужбы выдвигали на протяжении нескольких месяцев. Королевство Таиланд обладает ядерным оружием. Столицы стран Азии и других регионов пытаются пересмотреть баланс сил, поскольку новый игрок переступает порог."
 thailand_news.30.a: "Карта изменилась."
 SIA_threat_thai_bomb: "Программа Таиланда по созданию ядерного оружия"
 SIA_threat_thai_enrichment: "Программа обогащения урана в Таиланде"
 SIA_threat_thai_first_use: "Заявленная Таиландом позиция первого применения"
 thailand.432.t: "Стратегия не терпит отлагательств"
 thailand.432.d: "Годы работы в рамках семинаров сделали Таиланд достаточно богатым, чтобы затянуть процесс, и министерства слишком долго спорят о плане выхода. Граница не ждет, и Вьетнам сокращает разрыв. Национальную стратегию необходимо принять сейчас."
 thailand.432.a: "Принять это указом"
 thailand.432.b: "Сначала достигните консенсуса."
 thailand.433.t: "Щит с севера"
 thailand.433.d: "Бангкок обратился к Пекину с просьбой предоставить официальные гарантии в отношении Королевства. Китайское обязательство закрепило бы стремление Таиланда к сближению с материком и предотвратило бы любые попытки соперников проверить границы страны. Цена за это – постоянное обязательство, действующее далеко от дома."
 thailand.433.a: "Расширьте нашу защиту"
 thailand.433.b: "Бангкок может существовать самостоятельно."
 SIA_frontier_overextension_idea: "Перерасширение границ"
 SIA_frontier_overextension_idea_desc: "Подразделения, сосредоточенные на западных маршах, не следят за Бангкоком. Королевская тайская армия перенапряжена сильнее, чем правительство готово признать, и общественность ощущает напряжение от взятых на себя обязательств, принятых еще до первого выстрела."
 SIA_regional_pariah: "Региональный изгой"
 SIA_regional_pariah_desc: "Бангкок полностью принял марши бирманцев. Вашингтон и Пекин осуждают захват земель, столицы стран АСЕАН с тревогой смотрят на свои границы, а тайские экспортеры расплачиваются за запятнанную репутацию королевства каждым контрактом за рубежом."
 SIA_frontier_partners: "Приграничные партнёры"
 SIA_frontier_partners_desc: "Возвращенные приграничные территории управляются через систему зависимостей и соглашений, а не путем оккупации. Мягкая сила обходится дешевле, чем гарнизоны. Администрация работает в ограниченном режиме, а строительные бригады свободно перемещаются, избегая дипломатической негативной реакции, которую вызвала бы аннексия."
 SIA_royal_guidance_idea: "Под королевским взором"
 SIA_royal_guidance_idea_desc: "Ежегодные распоряжения дворца стабилизируют королевство и защищают его от иностранного вмешательства, но избранное правительство, подчиняющееся трону, обнаруживает, что его власть ограничена."
 SIA_three_pillars_idea: "Нация, религия, король"
 SIA_three_pillars_idea_desc: "Официальный национализм неразрывно связан с троном и Сангхой. Буддийское большинство жестко противостоит подрывной деятельности и чужеземным идеям, что достигается ценой более притупленного и почтительного общественного мнения."
 SIA_deep_south_grievance: "Недовольство на Юге"
 SIA_deep_south_grievance_desc: "В малайско-мусульманских провинциях буддийско-роялистская идеология воспринимается как дискриминация. Недовольство Патани усиливается, и Бангкок платит стабильностью и политическим капиталом, чтобы скрыть происходящее."
 SIA_scarred_coast: "Израненное побережье"
 SIA_scarred_coast_desc: "Без государственной поддержки на восстановление курорты Андаманского моря годами стоят полуразрушенными. Отели пустуют, завалы не убраны, и туристы уезжают в другие места."
 SIA_new_reign_mourning: "Королевство в трауре"
 SIA_new_reign_mourning_desc: "Страна скорбит по покойному королю. Общественная жизнь затихла, развлечения приостановлены, а в политике царит непрочное перемирие."
 SIA_ninth_reign_barami: "Барами Девятого Правления"
 SIA_ninth_reign_barami_desc: "Король Пхумипон правит уже более полувека, дольше, чем любой другой монарх на земле. Его авторитет, моральный авторитет, заработанный за эти десятилетия, возвышается над каждым политиком и генералом. В момент кризиса слово из дворца решает то, что не может решить ни один кабинет министров, а трон защищает королевство от иностранных замыслов."
 SIA_ninth_reign_zenith: "Восходящая сетевая монархия"
 SIA_ninth_reign_zenith_desc: "Дворец больше не просто правит. Через Тайный совет, суды и сеть лояльных чиновников и бизнесменов корона проникает во все государственные институты. Слово короля имеет вес закона, инакомыслие не находит поддержки, а иностранное влияние пробивает стену роялистского консенсуса."
 SIA_tenth_reign_barami: "Барами Десятого правления"
 SIA_tenth_reign_barami_desc: "Трон перешёл к королю Ваджиралонгкорну, но почтение к нему не передалось по наследству. Новый монарх занимает пост, который ранее занимал его отец, но лишён того морального авторитета, который когда-то им обладал. Дворец по-прежнему стабилизирует положение в королевстве и защищает от иностранного вмешательства, однако каждый рычаг — это всё более слабый отголосок Девятого правления."
 SIA_two_thailands: "Два Таиланда"
 SIA_two_thailands_desc: "Внутри одной границы находятся две страны. Бангкок и центральные равнины владеют богатством страны, министерствами и старой элитой. Сельские районы Севера и Северо-Востока обладают голосами избирателей и все более укоренившейся убежденностью в том, что их голоса сфальсифицированы судами и государственными переворотами. Пропасть между ними поляризует каждые выборы и вынуждает казну покупать мир, который она едва может себе позволить."
 SIA_three_pillars_start: "Нация, религия, король"
 SIA_three_pillars_start_desc: "$SIA_three_pillars_idea_desc$"
 SIA_populist_machine: "Популистская машина"
 SIA_populist_machine_desc: "Сельские фонды, медицинские карты, списание долгов. Политический механизм, который из цикла в цикл превращает предоставление государственных услуг в лояльность избирателей."
 SIA_yellow_shirts_idea: "Желтые рубашки"
 SIA_yellow_shirts_idea_desc: "Народный альянс за демократию — это роялистская, городская, буржуазная организация, убежденная в том, что электоральное большинство покупается. Когда они выходят на улицы, правительства начинают колебаться."
 SIA_red_shirts_idea: "Красные рубашки"
 SIA_red_shirts_idea_desc: "Объединенный фронт за демократию против диктатуры охватывает сельские районы, северные и северо-восточные регионы. Они выигрывали все выборы, в которых участвовали, и проигрывали все сформированные ими правительства. Они составляют большинство, и они это знают."
 SIA_junta_government: "Правительство хунты"
 SIA_junta_government_desc: "Военный совет управляет посредством указов. Порядок обеспечивается, инакомыслие «корректируется», а на вопрос о том, когда возобновятся выборы, отвечают улыбкой и переносом."
 SIA_guided_democracy: "Система 2017 года"
 SIA_guided_democracy_desc: "Назначенный Сенат, обязательная двадцатилетняя стратегия и надежные суды. Проводятся выборы, но поле для голосования ограничено."
 SIA_network_monarchy_idea: "Сетевая монархия"
 SIA_network_monarchy_idea_desc: "Дворец, Тайный совет, армия и судебная система образуют неформальную сеть власти, которая действует вне рамок избирательной политики и переживает любое правительство."
 SIA_reform_momentum: "Импульс реформ"
 SIA_reform_momentum_desc: "Впервые за целое поколение энергия в тайской политике сосредоточена на тех, кто хочет изменить систему, а не управлять ею."
 SIA_consolidated_democracy_idea: "Консолидированная демократия"
 SIA_consolidated_democracy_idea_desc: "Гражданский контроль, конституционное правительство и общественность, ожидающая, что перевороты останутся в прошлом. Демократические институты Таиланда наконец-то встали на собственные фундаменты."
 SIA_republic_turmoil: "Конституционные потрясения"
 SIA_republic_turmoil_desc: "Вопрос о республике расколол все институты, все провинции и многие семьи. Государство сохранилось, но консенсус, лежащий в его основе, утрачен."
 SIA_pan_thai_irredentism: "Пантайский ирредентизм"
 SIA_pan_thai_irredentism_desc: "Нарратив об утраченных территориях снова стал государственной доктриной. Народ тай является единой нацией, уступки 1893-1909 годов незаконны, и история обязана исправить ситуацию в отношении Таиланда."
 SIA_drug_war_stain: "Международное порицание"
 SIA_drug_war_stain_desc: "Тысячи внесудебных убийств, совершенных во время войны с наркотиками, преследуют Таиланд на всех форумах по защите прав человека и во всех дипломатических переговорах."
 SIA_tourism_powerhouse: "Туристический центр"
 SIA_tourism_powerhouse_desc: "Ежегодно десятки миллионов туристов делают туризм опорой экономики, а тайский бренд — глобальным активом."
 SIA_tourism_powerhouse_2: "Промышленная политика в сфере туризма"
 SIA_tourism_powerhouse_2_desc: "Туризм из сезонного источника дохода превращается в регулируемый столп государственной политики. Диверсифицированная база туристов с более высокими расходами платит реальные корпоративные налоги и в меньшей степени подчиняется иностранным туристическим конгломератам, чем когда-либо прежде."
 SIA_tourism_luxury_boom: "Резкий рост числа поездок класса люкс"
 SIA_tourism_luxury_boom_desc: "Наплыв состоятельных туристов заполняет пятизвездочные курорты и увеличивает доходы. Однако с наступлением нового сезона этот всплеск спадает."
 SIA_credit_boom_overheating: "Перегрев кредитного бума"
 SIA_credit_boom_overheating_desc: "Дешевых денег поступало в банковскую систему быстрее, чем она могла их поглотить, и теперь заемщики выплачивают разницу в виде более высоких процентных ставок. Давление ослабевает по мере замедления экономического роста."
 SIA_sustainable_extraction: "Рационально управляемые ресурсы"
 SIA_sustainable_extraction_desc: "Выдача разрешений идет медленно, а условия концессий остаются ограниченными, но государство более жестко контролирует, кто получает прибыль от добычи полезных ископаемых, и меньше подчиняется иностранному капиталу, который финансирует более быструю добычу в других местах."
 SIA_digital_national_champions: "Национальные чемпионы в области цифровых технологий"
 SIA_digital_national_champions_desc: "На рынке по своей сути доминирует несколько платформ, пользующихся поддержкой государства: их легко облагать налогами и регулировать, но они настолько уверены в своем положении, что перестают стремиться к совершенствованию."
 SIA_detroit_of_asia_idea: "Детройт Азии"
 SIA_detroit_of_asia_idea_desc: "На восточном побережье Таиланда производится сборка пикапов для всего мира. Автомобильные цепочки поставок являются основой тайского производства и обеспечивают стабильный экспорт."
 SIA_bamboo_diplomacy: "Бамбуковая дипломатия"
 SIA_bamboo_diplomacy_desc: "Гнуться под ветром, никогда не ломаться. Бангкок одновременно сохраняет связь с США, китайские инвестиции и собственные интересы."
 SIA_war_on_drugs_campaign: "Война с наркотиками"
 SIA_war_on_drugs_campaign_desc: "Черные списки, квоты и неопределенность применения оружия на поражение. Торговля метамфетамином идет на спад, как и верховенство закона."
 SIA_deep_south_insurgency_1: "Южный мятеж (тлеет)"
 SIA_deep_south_insurgency_1_desc: "Вооружённое сепаратистское восстание в Паттани, Яле и Наратхивате притихло и едва тлеет. Происшествия единичны, бремя для Королевства невелико. Накал ниже §Y30§!."
 SIA_deep_south_insurgency_2: "Южный мятеж (разгорается)"
 SIA_deep_south_insurgency_2_desc: "Вооружённое сепаратистское восстание в Паттани, Яле и Наратхивате разгорается. Еженедельные происшествия бьют ощутимо, а власть Бангкока на Юге явно оспаривается. Накал держится между §Y30§! и §Y59§!."
 SIA_deep_south_insurgency_3: "Южный мятеж (пылает)"
 SIA_deep_south_insurgency_3_desc: "Вооружённое сепаратистское восстание в Паттани, Яле и Наратхивате пылает открытым пламенем. Взрывы и засады стали обыденностью, а цена теперь достаёт и армию, и общество. Накал §Y60§! или выше."
 SIA_pacified_but_smoldering: "Умиротворенный, но тлеющий"
 SIA_pacified_but_smoldering_desc: "«Железный кулак» сработал. По единственному показателю, который принимает армия, на Юге тихо. Но целое поколение выросло в условиях комендантского часа и блокпостов, и недовольство ушло в подполье, а не исчезло. Иногда всё же случаются отдельные инциденты, и потоки новобранцев не иссякают."
 SIA_royal_pacification: "Королевское умиротворение"
 SIA_royal_pacification_desc: "Контролируемое, управляемое спокойствие, поддерживаемое покровительством и присутствием под королевской эгидой. Развитие идет полным ходом, местные знатные лица привлекаются на свою сторону, и легитимность монархии на Юге тихо восстанавливается. Не поселение, а управление."
 SIA_pattani_autonomy: "Автономия Паттани"
 SIA_pattani_autonomy_desc: "Самоуправляемая специальная администрация в рамках унитарного Таиланда с выборным региональным советом, обучением на местном языке и долей доходов Юга, остающейся в распоряжении самого Юга. Преимущества мира реальны, и этот прецедент беспокоит централистов Бангкока."
 SIA_limited_devolution: "Ограниченная деволюция"
 SIA_limited_devolution_desc: "Рамки автономии были смягчены, чтобы угодить истеблишменту. Это своего рода местное управление, но не подлинное самоуправление. Сейчас стрельба затихла, но достигнутое соглашение вызывает недовольство как на Юге, так и в центре страны."
 SIA_hearts_minds_education_strain: "Программа «Сердца и умы»"
 SIA_hearts_minds_education_strain_desc: "Работа с населением трёх провинций оплачивается из бюджета образования, а не из бюджета безопасности. Счёт целый год несёт министерство школ."
 SIA_southern_development_levy: "Налог на развитие южных регионов"
 SIA_southern_development_levy_desc: "Рывок в развитии трёх провинций отвлекает гражданскую промышленность от выпуска потребительских товаров. Деньги целый год текут на юг, и полки в остальной стране это чувствуют."
 SIA_peoples_constitution: "Народная Конституция"
 SIA_peoples_constitution_desc: "Новый основной закон, разработанный при широком участии граждан, закрепляет права, предусматривает гражданский надзор за вооруженными силами и независимость институтов, восстанавливая доверие общественности к конституционному порядку."
 SIA_worlds_rice_bowl: "Мировая рисовая чаша"
 SIA_worlds_rice_bowl_desc: "Тайский рис сортов Хом Мали и Жасмин пользуется высоким спросом на всех континентах. Доходы от сельскохозяйственного экспорта обеспечивают стабильный баланс, а каждый сезон сбора урожая восстанавливает дипломатический вес Бангкока."
 SIA_bri_debt: "Доля долга в программе «Один пояс и один путь»"
 SIA_bri_debt_desc: "Инфраструктурные кредиты в рамках инициативы «Один пояс и один путь» покрывают пробелы, которые не может заполнить бюджет, но условия погашения определяются в Пекине. Фискальный суверенитет Таиланда уменьшается с каждым подписанным соглашением."
 SIA_landslide_mandate: "Мандат народа"
 SIA_landslide_mandate_desc: "Убедительная победа обеспечила правительству подлинный народный мандат. Партийный аппарат полон энергии, сельская база мобилизована, оппозиция отступает, но генералы очень внимательно следят за цифрами."
 SIA_ceo_state: "Генеральный директор государства"
 SIA_ceo_state_desc: "Кабинет министров превратился в зал заседаний, а министерства — в холдинговую компанию. Решения принимаются быстро, а подотчетность — медленнее. Система сдержек и противовесов никуда не исчезла. Она просто реструктурируется."
 SIA_cult_of_the_ceo: "Культ генерального директора"
 SIA_cult_of_the_ceo_desc: "Премьер-министр отказался от театральных консультаций. Его рейтинги одобрения — это оружие, его критики — препятствие, а внутренние процедуры партии — это то, что он сам назовет на этой неделе. Королевская сеть проводит встречи несколько чаще, чем обычно."
 SIA_dynasty_politics: "Династическая политика"
 SIA_dynasty_politics_desc: "Имя Шинаватра теперь представляет собой династию, бренд, сеть покровительства и план преемственности, объединенные в рамках одной семьи. Преданность партии и преданность семье стали неразличимы."
 SIA_institutionalized_party: "Институционализированная партия"
 SIA_institutionalized_party_desc: "Движение пережило изгнание, два переворота и семнадцать роспусков партий. Оно стало чем-то более долговечным, чем любой отдельный лидер, подлинным политическим институтом, корни которого уходят в каждую провинцию."
 SIA_judicialization: "Политика в зале суда"
 SIA_judicialization_desc: "Конституционный суд сам по себе стал политическим игроком. Каждое ходатайство – это оружие, а каждое решение – победа одной фракции и рана для другой. Оппозиция изучает право, чтобы выжить."
 SIA_isoc_network: "Сеть ISOC"
 SIA_isoc_network_desc: "Командование по операциям внутренней безопасности охватывает все провинции и подчиняется армии, а не избранным министрам. Его разведывательная сеть делает влияние государства невидимым, повсеместным и удивительно эффективным."
 SIA_crown_property_idea: "Бюро государственной собственности"
 SIA_crown_property_idea_desc: "Коммерческое подразделение дворца владеет долями в земле, банковском секторе и страховании на сотни миллиардов бат. Абсолютная монархия закончилась. Экономическая монархия процветает."
 SIA_uncle_tu_honeymoon: "Медовый месяц Праюта"
 SIA_uncle_tu_honeymoon_desc: "Порядок восстановлен, протестующие НКДР (Народного комитета за демократическую реформу) ушли с улиц, и правительство разработало двадцатилетний план. На данный момент стремление общественности к стабильности позволяет новому премьер-министру проявлять необычайную терпимость."
 SIA_uncle_tu_fatigue: "Усталость Праюта"
 SIA_uncle_tu_fatigue_desc: "Премьер-министр, обещавший сделать политику скучной, преуспел — но не так, как хотелось бы. Программа реформ застопорилась, обещанные выборы постоянно откладываются, а молодые тайцы начали спрашивать, когда же, собственно, должен был закончиться этот «временный» период."
 SIA_reform_spring: "Весна реформ"
 SIA_reform_spring_desc: "Волна гражданской энергии захлестнула реформаторское движение. Новые лица, новые требования и настроения на улицах, которых не было у политиков старшего поколения уже целое поколение. Истеблишмент это замечает, и не всегда с удовольствием."
 SIA_youthquake: "Молодежное восстание"
 SIA_youthquake_desc: "Университетские кампусы, ленты социальных сетей и уличные уголки бурлят политической энергией. Молодые тайцы, которые никогда не голосовали, теперь баллотируются на выборные должности, работают в партийных офисах и собирают деньги в интернете. Формирующиеся технократы образованы лучше, чем любое предыдущее поколение."
 SIA_barracks_pushback: "Выдворение из казарм"
 SIA_barracks_pushback_desc: "Высокопоставленные офицеры, через вышедших на пенсию посредников, намеренное молчание и язвительные пресс-конференции, ясно дали понять, что темпы гражданских реформ испытывают терпение военных. Армия по-прежнему контролирует собственные повышения по службе, бюджеты и распределение по базам."
 SIA_thai_republic: "Республика Таиланд"
 SIA_thai_republic_desc: "Самая долгоживущая в мире конституционная монархия претерпела трансформацию. Президент избирается прямым голосованием, парламент обладает полным суверенитетом, а конституция написана без права военного вето. Перемены не прошли бескровно, но они сохранились."
 SIA_mandate_recovery: "Мандат восстановления"
 SIA_mandate_recovery_desc: "Правительство объявило экономическую реконструкцию своим первоочередным приоритетом. Потребительские расходы снижаются, а строительные программы ускоряются. Каждый бат производительных инвестиций получает полную поддержку правительства в течение следующих двух лет."
 SIA_mandate_order: "Мандат порядка"
 SIA_mandate_order_desc: "Первоочередная задача правительства — стабилизация перед реформами. Укрепление институтов, уважение к судам и подавление политических колебаний. Риск заключается в том, что порядок, убедительно установленный, завоюет доверие, необходимое для последующих реформ."
 SIA_mandate_outreach: "Мандат информационно-просветительской работы"
 SIA_mandate_outreach_desc: "Приоритетами правительства, согласно официальным заявлениям, являются дипломатия и торговля. Посольства укомплектованы полностью, делегации министров прибывают часто, а Министерству торговли выделен расширенный бюджет и обеспечена прямая связь с графиком премьер-министра."
 SIA_uneasy_compromise: "Непростой компромисс"
 SIA_uneasy_compromise_desc: "Генералы заседают в кабинете министров, а политики сохраняют свой мандат — национальное правительство, которое скрепляет Королевство исключительно взаимным недоверием. Стабильность достигается ценой решительных действий. За каждым министерством ведется наблюдение, каждая инициатива обсуждается дважды. Такая структура стабилизирует страну (§G+5% стабильности§!), но подавляет свободу действий правительства (§R-10% прирост политической власти§!) до тех пор, пока сделка не завершится."
 SIA_gfc_headwinds: "Негативное влияние глобального финансового кризиса"
 SIA_gfc_headwinds_desc: "Обвал западных кредитных рынков замедлил рост экспортных заказов в Таиланде и ужесточил торговое финансирование. Цены на потребительские товары растут, а объемы торговли сокращаются. В этом кризисе виноват не Таиланд, но экономика будет ощущать его последствия еще два года."
 SIA_coup_risk_modifier: "Давление, связанное с риском государственного переворота"
 SIA_coup_risk_modifier_desc: "Повышенный риск государственного переворота подрывает политическую стабильность и препятствует накоплению политической власти. Чем выше риск, тем сильнее негативное воздействие. Каждый пункт на шкале риска отражается на способности правительства управлять страной."
 SIA_coup_tier_watchful: "Казарма бдительная"
 SIA_coup_tier_watchful_desc: "Генералы пока довольны. Они читают газеты, подсчитывают бюджетные статьи и хранят молчание. Никаких последствий, но уровень недовольства повышается или понижается с каждым решением правительства.\n\n§YРиск государственного переворота§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_coup_tier_restless: "Бараки Беспокойные"
 SIA_coup_tier_restless_desc: "Острые редакционные статьи в принадлежащей армии прессе, недовольство отставных офицеров на ток-шоу, перестановки в кабинете министров, по поводу которых высшее командование не было проконсультировано. Настроение в штабах испортилось. Управляйте честно или выкупите их обратно, прежде чем станет еще хуже.\n\n§YCoup Risk§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_coup_tier_plotting: "Генералы плетут интриги"
 SIA_coup_tier_plotting_desc: "Необычная ротация войск, ужины, на которые премьер-министра не пригласили, прием гостей во дворце в военной форме. Все в Бангкоке видят эти признаки. Правительство еще может отступить от края пропасти, но окно возможностей закрывается.\n\n§YРиск государственного переворота§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_coup_tier_tanks: "Танки прогреваются"
 SIA_coup_tier_tanks_desc: "Колонны заправлены, сценарий трансляции написан. Высшее командование находится в одном шаге от нападения на Дом правительства. Снизьте риск государственного переворота ниже 70, и быстро, иначе миссия §RУспокойте Высшее командование§! закончится, и прибудут танки.\n\n§YРиск государственного переворота§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_rice_pledge: "Программа «Обещание риса»"
 SIA_rice_pledge_desc: "Правительство гарантирует фермерам цены выше рыночных за урожай риса и поддерживает стратегический запас. Доходы сельского населения растут, и вместе с ними увеличивается и подверженность казначейства влиянию мировых цен на сырьевые товары."
 SIA_red_shirts_mobilized_idea: "Красные рубашки на марше"
 SIA_red_shirts_mobilized_idea_desc: "Сельская сеть мобилизована и выходит на улицы. Массовые демонстрации в Удон Тхани, Кхон Каене и на окраинах Бангкока сплачивают сторонников и убеждают дворец и высшее командование в том, что избранное правительство утратило контроль. Каждый марш приближает расплату с армией."
 SIA_kings_moral_authority_2: "Новое правление"
 SIA_kings_moral_authority_2_desc: "Десятое правление утвердилось на троне, но это уже другая власть. Более заметная, более коммерчески успешная, более противоречивая, чем предыдущая. Моральный груз шестидесяти лет правления одного человека не передается в одной коронации."
 SIA_kra_mobilization: "Национальная мобилизация в поддержку канала Кра"
 SIA_kra_mobilization_desc: "Все краны, экскаваторы и инженерные батальоны, которые только может собрать Королевство, задействованы в строительстве коридора Кра. Потребительские цены растут, политический капитал истощается, а рейтинг одобрения правительства падает под тяжестью обстоятельств, но темпы строительства поразительны. Эта мысль развеется, когда канал будет завершен."
 SIA_kra_canal: "Канал Кра"
 SIA_kra_canal_desc: "Канал, соединяющий Сиамский залив с Андаманским морем, делает Таиланд узким местом на втором по загруженности в мире судоходном маршруте. Сборы поступают в казну, военно-морские силы вежливо выстраиваются в очередь за правом транзита, а мнение Бангкока теперь стоит того, чтобы его услышать в каждой азиатской столице."
 SIA_kra_debt_trap: "Долг ОПОП"
 SIA_kra_debt_trap_desc: "Строительство канала изначально обошлось недорого, потому что за него заплатил Пекин. График погашения выражен в юанях, залогом служит сам водный путь, и каждый перерасход средств увеличивает долг. Потребительские цены растут, политический капитал утекает, а долг накапливается незаметно."
 SIA_kra_debt_serviced: "Реструктуризация долга"
 SIA_kra_debt_serviced_desc: "Условия кредита были пересмотрены на жестких, но приемлемых условиях. Кризис миновал, канал стал тайским, и правительство заслужило определенный авторитет, противостоя Пекину за столом переговоров, а не в закулисных кругах."
 SIA_kra_default_pariah: "Суверенный дефолт"
 SIA_kra_default_pariah_desc: "Таиланд отказался от кредита по инициативе «Один пояс и один путь». Канал принадлежит ему, но международные кредитные рынки это помнят, торговые партнеры используют хеджирование рисков, а цена капитала высока для страны, которая показала, что готова отказаться от долга, когда этого требуют политические обстоятельства."
 SIA_kra_lease_concession: "Пекин предоставляет концессию на аренду земли"
 SIA_kra_lease_concession_desc: "Для погашения долга китайскому государственному предприятию была предоставлена долгосрочная концессия на эксплуатацию части канала. Королевство по-прежнему поднимает флаг над шлюзами, но часть всех сборов теперь отправляется в Пекин, и мир обратил внимание на то, кто на самом деле владеет правом аренды."
 SIA_kra_capital_flight: "Отток капитала"
 SIA_kra_capital_flight_desc: "Дефолт напугал рынки. Иностранный капитал устремляется наружу, бат находится под давлением, а центральный банк сжигает резервы, чтобы замедлить утечку капитала. Шок сильный, но временный, и доверие вернется, как только ситуация стабилизируется."
 SIA_kra_delay: "Задержка строительства"
 SIA_kra_delay_desc: "Вместо того чтобы вкладывать дополнительные средства в этап, который вышел за рамки бюджета, правительство согласилось на более медленный график. Скорость строительства пострадала, а имидж оказался не самым лучшим, но казначейство избежало худших последствий перерасхода средств."
 SIA_kra_canal_sovereign: "Суверенный канал"
 SIA_kra_canal_sovereign_desc: "Построенный без участия иностранных кредиторов или каких-либо оговорок об иностранных правах, канал является тайским до последнего столбика. Премия, уплаченная за абсолютный суверенитет, обеспечивает более развитую военно-морскую и промышленную базу, более жесткий режим взимания платы за проезд и национальный престиж, которому не сможет сравниться ни одна концессия."
 SIA_kra_fortress: "Крепостной канал"
 SIA_kra_fortress_desc: "Береговые батареи, укрепленные бункеры и постоянный военно-морской гарнизон делают Кра водным путем, который Королевский военно-морской флот Таиланда может контролировать силой. Флот оттачивает свои навыки охраны этого узкого места, но милитаризация прохода обходится Бангкоку в некоторую потерю доверия со стороны судоходных компаний."
 SIA_kra_neutral_transit: "Нейтральный транзитный режим"
 SIA_kra_neutral_transit_desc: "Канал Кра открыт для всех флагов на равных условиях, гарантированных договором и пользующихся доверием всех морских держав. Движение судов и доброжелательность неразрывно связаны. Плата за проход высока, мнение торговых стран улучшается, и канал становится глобальным достоянием, а не национальным оружием."
 SIA_red_revival: "Призраки КПТ"
 SIA_red_revival_desc: "Кадры Коммунистической партии Таиланда, пережившие борьбу 1970-х годов, их дети, их ученики вышли из тени. Партия обладает политической энергией, теорией истории и жаждой власти. У нее также есть враги, и ее присутствие в национальном диалоге обходится стране в несколько процентных пунктов стабильности каждый месяц, пока она отказывается работать в рамках существующей системы."
 SIA_general_strike_idea: "Всеобщая забастовка (продолжается)"
 SIA_general_strike_idea_desc: "Страну намеренно парализуют. Порты, железные дороги, школы, больницы работают на голом минимуме. Пока забастовка держится, стабильность падает на полпроцента в неделю. Доведите её накал до 100 через решения «Красного пути» — и правительство капитулирует. Дайте 365 дням истечь, не дотянув, — и власть возьмёт армия.\n\n§RНакал забастовки§!: [?ROOT.SIA_strike_momentum|0]/100"
 SIA_western_sanctions: "Западные экономические санкции"
 SIA_western_sanctions_desc: "Соединенные Штаты и их союзники ввели пакет санкций против Таиланда после смены правительства. Инвестиции заморожены, финансирование торговли затруднено, а ряд двусторонних соглашений приостановлены. Цена реальна, как и политическая выгода от наличия явного внешнего врага."
 SIA_asean_pariah: "Изгой региона"
 SIA_asean_pariah_desc: "Стремление Таиланда подчинить себе соседей превратило его в изгоя в Юго-Восточной Азии и за ее пределами. Партнеры по АСЕАН исключили Бангкок из региональной торговли, иностранный капитал покинул страну, и теперь стоимость каждого кирпича и бочки отражает состояние королевства, воюющего с регионом, которым оно когда-то управляло. Изоляция имеет свою цену, и тайская экономика ее платит."
 SIA_peoples_siam: "Блок народной солидарности"
 SIA_peoples_siam_desc: "Таиланд прочно закрепил за собой региональную связь с Лаосом и Вьетнамом. Рамки взаимного признания обеспечивают дипломатическую защиту, уменьшают изоляцию и, для страны, которая недавно национализировала свои основные отрасли промышленности, создают торговые отношения, позволяющие поддерживать запасы продовольствия. Сотрудничество между военными ведомствами в рамках блока является основой подлинно независимой оборонной стратегии."
 SIA_green_rush: "Зелёная лихорадка"
 SIA_green_rush_desc: "Декриминализация каннабиса открыла новый рынок сельскохозяйственной продукции. Фермеры из региона Исаан диверсифицируют свою деятельность, экспортеры растительной продукции регистрируются быстрее, чем лицензирующее агентство успевает обрабатывать заявки, а часть индустрии гостеприимства Бангкока незаметно переориентировалась. Критики называют это социальным экспериментом. В казначейских отчетах это называют доходом."
 SIA_war_plan_brm: "Военный план Бирмы"
 SIA_war_plan_brm_desc: "Тайские оперативные планировщики детально отработали тактику кампании в Салуине. Были созданы коридоры для проникновения, логистические узлы, а также задействованы шанские иррегулярные формирования в качестве множителя силы. План актуален, инфраструктура для размещения войск создана, а офицерский корпус хорошо знает местность."
 SIA_war_plan_lao: "Военный план Лаоса"
 SIA_war_plan_lao_desc: "Переправы через Меконг, горные перевалы, уязвимость Вьентьяна для наступления со стороны Нонг Кхая. План кампании есть в каждом оперативном документе штаба 3-й армии. Пограничная инфраструктура была незаметно модернизирована для обеспечения быстрого продвижения."
 SIA_war_plan_cbd: "Военный план Камбоджи"
 SIA_war_plan_cbd_desc: "Коридор Преах Вихеар, обрыв Дангрек, пологие подъездные пути к Сиемреапу. Тайские планировщики определили оперативные границы и трижды провели логистические учения. Подготовка завершена."
 SIA_war_plan_may: "Военный план Малайзии"
 SIA_war_plan_may_desc: "Граница 1909 года — это ограничение, продиктованное планированием, а не данностью. Подробные распоряжения по проведению кампаний на подходе к Наратхивату и в коридоре Келантан хранятся в красной папке с пометкой «Ограничено». Инвестиции в инфраструктуру Глубокого Юга одновременно служат плацдармами для размещения войск."
 SIA_protector_of_the_realm: "Защитник Королевства"
 SIA_protector_of_the_realm_desc: "Вооруженные силы Таиланда теперь обеспечивают оккупацию отвоеванной границы, поддерживая порядок на территориях, захваченных в ходе пантайских войн, на территориях шанов, лаосцев, кхмеров и малайцев, в то время как гражданская администрация наверстывает упущенное. Усталость от войны утихает с одержанной победой, а гордость за воссоединившееся государство стабилизирует ситуацию в тылу."
 SIA_comprehensive_security_idea: "Комплексная безопасность"
 SIA_comprehensive_security_idea_desc: "Интегрированная система национальной безопасности сокращает дублирование функций между ведомствами внутренних дел, обороны и разведки. Накладные расходы на потребителей снижаются по мере улучшения координации. Переход к услугам любого внешнего покровителя становится значительно сложнее осуществить."
 SIA_cambodia_partnership: "Партнерство с Камбоджей"
 SIA_cambodia_partnership_desc: "Структурированные двусторонние отношения с Пномпенем включают в себя упрощение торговых процедур, создание совместных зон развития и дипломатическое соглашение, которое позиционирует Таиланд как предпочтительного экономического партнера Камбоджи. Влияние распространяется в обоих направлениях, а торговые поступления – в одном."
 SIA_fuel_reserves: "Стратегические топливные резервы"
 SIA_fuel_reserves_desc: "Запас топлива, рассчитанный на три месяца национального потребления, хранится в стратегическом резерве на распределенных резервуарных парках во всех пяти регионах. Этот запас сглаживает скачки цен, обеспечивает буфер на случай кризисов и сигнализирует партнерам о том, что военная логистика Таиланда не зависит от единого маршрута снабжения."
 SIA_medical_tourism_boom: "Бум медицинского туризма"
 SIA_medical_tourism_boom_desc: "Слухи распространились. Частные больницы Бангкока полностью заполнены иностранными пациентами, а выздоравливающие остаются в городе как туристы. Поступления и число прибывших растут месяц за месяцем, палаты переполнены, а местные жители все дольше ждут своей очереди."
 SIA_aec_tailwind: "Попутный ветер интеграции АСЕАН"
 SIA_aec_tailwind_desc: "Инициатива по упрощению торговых процедур приносит свои плоды во всем регионе. Снижается трение на границах, углубляются цепочки поставок, тайские заводы выигрывают региональные контракты. Рост, обусловленный экспортом, накапливается с годами, даже несмотря на то, что адаптация сокращает производственные мощности по выпуску потребительских товаров внутри страны."
 SIA_arms_export_orders: "Портфель экспортных заказов на оборонную продукцию"
 SIA_arms_export_orders_desc: "Портфель заказов полон. Бронемашины MRAP, боеприпасы, барражирующие беспилотники и системы, производимые по лицензии, поставляются покупателям из стран АСЕАН по установленному графику. Производственные мощности работают на пределе возможностей, и положение Таиланда как предпочтительного поставщика в регионе укрепляется, но ценой дипломатических трений, которые всегда сопровождают вооружение соседних стран."
 SIA_royal_development_lands: "Королевские земли развития"
 SIA_royal_development_lands_desc: "Проекты, финансируемые государством, открыли новые земли для обработки и добычи ресурсов и стабилизировали ситуацию в провинциях, к которым они относятся. Сельская местность стала спокойнее, а ресурсная база расширилась, хотя сами работы истощают национальные ресурсы."
 SIA_eec_construction_boom: "Резкий рост строительства в ЕЭС"
 SIA_eec_construction_boom_desc: "Восточный экономический коридор — это действующая строительная площадка: краны работают над портами, выравниваются железнодорожные пути, возводятся каркасы заводов. Строительство идет быстрее, объемы производства растут, но этот всплеск спроса блокирует производственные мощности по выпуску потребительских товаров на весь период."
 SIA_asean_chair_spotlight: "В центре внимания председатель АСЕАН"
 SIA_asean_chair_spotlight_desc: "В Бангкоке находится и молоток председателя, и камеры. Председательство обеспечивает легкое завоевание расположения и более дешевую дипломатическую позицию в рамках Ассоциации, пока сохраняется внимание общественности."
 SIA_purge_disruption: "Срыв антикоррупционной кампании"
 SIA_purge_disruption_desc: "Масштабные меры по обеспечению соблюдения законодательства заморозили закупки и поставили на место патронажные сети. Контрактная деятельность застопорилась, а политическая машина недовольна. Такова цена более чистой системы, которую нужно оплатить заранее."
 SIA_army_wage_inflation: "Завышенная заработная плата офицеров"
 SIA_army_wage_inflation_desc: "Предоставление услуг позволило подкупить начальство, но ценой стал раздутый фонд заработной платы. Офицерские зарплаты, пособия и фиктивные назначения были завышены по всем званиям, и военный фонд заработной платы будет оставаться высоким, пока бюджет не будет приведен в порядок."
 SIA_chuan_leekpai_desc: "Ветеран Демократической партии, политик и видный государственный деятель, занимавший пост премьер-министра с 1992 по 1995 год и с 1997 по 2001 год. Во время своего второго срока он вывел Таиланд из азиатского финансового кризиса в рамках программы МВФ. Известен своей безупречной личной честностью в системе, погрязшей в коррупции."
 SIA_thaksin_shinawatra_desc: "Миллиардер, телекоммуникационный магнат, основатель партии «Тай Рак Тай», одержавший убедительную победу на выборах 2001 года. Его популистские программы, такие как программа здравоохранения за 30 бат и фонды развития деревень, преобразили сельскую политику. Свергнутый в результате военного переворота 2006 года, он управлял Таиландом из изгнания через несколько марионеточных партий."
 SIA_bhumibol_adulyadej_desc: "Рама IX, девятый монарх династии Чакри и самый долгоправящий глава государства в мире. Его моральный авторитет как объединяющий символ использовался во всех политических кризисах. Его кончина в октябре 2016 года положила конец 70-летнему правлению и положила начало периоду глубокого национального траура."
 SIA_vajiralongkorn_desc: "Рама X, Маха Вачиралонгкорн, взошедший на трон после смерти своего отца в 2016 году, осуществлял прямой контроль над активами короны и Королевской гвардией, а также более активно вмешивался в политические дела, чем его предшественники. Его правление совпадает с самым бурным периодом в истории тайского конституционного права."
 SIA_abhisit_vejjajiva_desc: "Лидер демократической партии, получивший образование в Оксфорде, стал премьер-министром в результате парламентского голосования в 2008 году после роспуска Конституционным судом партии «Народная власть». Его правительство руководило подавлением протестов «краснорубашечников» в Бангкоке в апреле-мае 2010 года."
 SIA_yingluck_shinawatra_desc: "Лидер партии «Феу Тай» и младшая сестра Таксина Шинаватры, победившего на выборах в июле 2011 года с самым большим перевесом голосов с 2001 года. Ее правительство запустило программу гарантированного распределения риса, которая впоследствии обернулась крупным коррупционным скандалом. В 2014 году она была отстранена от должности Конституционным судом и бежала из страны до вынесения уголовного приговора."
 SIA_prayut_chanocha_desc: "Командующий Королевской тайской армией, возглавивший государственный переворот в мае 2014 года, двенадцатый по счету в Таиланде, и занимавший пост премьер-министра в течение девяти лет при хунте Национального совета мира и порядка (НСМП) и партии «Паланг Прачарат». Архитектор пропорциональной системы выборов смешанного состава, предусмотренной конституцией 2017 года, призванной расколоть оппозиционные партии."
 SIA_sonthi_boonyaratglin_desc: "Командир армии, возглавивший государственный переворот в сентябре 2006 года, в результате которого был свергнут Таксин Шинаватра, пока премьер-министр находился за границей. Возглавлял Совет национальной безопасности до установления временного гражданского правительства. Позже занялся избирательной политикой в качестве лидера небольшой партии."
 SIA_anutin_charnvirakul_desc: "Лидер партии «Бхумджайтай» и потомок семьи, занимавшейся строительством, получивший известность на посту заместителя премьер-министра. Стратегическое положение его партии между военным и гражданским блоками сделало её влиятельным игроком в трёх последовательных коалиционных правительствах. В конце 2025 года стал исполняющим обязанности премьер-министра после отстранения Паэтонгтарна от должности Конституционным судом."
 SIA_pita_limjaroenrat_desc: "Лидер партии «Двигайся вперед», чья партия одержала победу на выборах в мае 2023 года, получив наибольшее количество голосов, но которой был заблокирован назначенным военными Сенатом в процессе формирования правительства. Впоследствии Конституционный суд распустил партию и запретил ему заниматься политикой в течение пяти лет."
 SIA_natthaphong_ruengpanyawut_desc: "Преемник Питы Лимджароенрата на посту лидера реорганизованной Народной партии и самый молодой избранный губернатор Бангкока. Олицетворяет собой смену поколений в тайской прогрессивной политике в сторону местного самоуправления и климатической политики наряду с конституционной реформой."
 SIA_songkhram_phaendin_desc: "Маршал пантайской школы, носивший имя, означающее «война за землю». Он продвигался по службе в офицерском корпусе, проповедуя, что уступки 1893 и 1909 годов — это незажившие раны, и что только правительство, основанное на воинских принципах, сможет их залечить."
 SIA_somchai_ratchaphruek_desc: "Ветеран «джунглей» Коммунистической партии, получивший прозвище в честь дерева золотого дождя. Он пережил амнистии, освободившие лагеря, и вернулся к организаторской деятельности на северо-востоке, утверждая, что революция провалилась не в своих целях, а во времени."
 SIA_banharn_silpaarcha_desc: "Лидер партии «Чарт Тай» и покровитель строительной отрасли из Супханбури, занимавший пост премьер-министра с 1995 по 1996 год. Его правительство настолько активно вкладывало средства в развитие инфраструктуры провинции, что пресса прозвала его «ходячим банкоматом». Коалиция распалась в течение года на фоне обвинений в коррупции и экономических тревожных сигналов, предшествовавших кризису 1997 года."
 SIA_chavalit_yongchaiyudh_desc: "Основатель и лидер партии «Новые устремления», бывший главнокомандующий Королевской тайской армией, ставший премьер-министром в ноябре 1996 года. Его правительство находилось у власти, когда в середине 1997 года разразился кризис бата, и он подал в отставку в ноябре того же года под давлением из-за обвала валюты, который его администрация не смогла предотвратить."
 SIA_thanathorn_juangroongruangkit_desc: "Магнат в сфере автозапчастей, соучредитель партии «Будущее вперед» в 2018 году и лицо ее молодежной реформаторской политики. Его стремительный взлет встревожил истеблишмент. Конституционный суд распустил партию в феврале 2020 года и запретил ему занимать государственные должности в течение десяти лет за кредит, взятый партией у него лично."
 SIA_virot_paoin_desc: "Генерал-лейтенант полиции, возглавивший партию «Пхеу Тай» после того, как линия Таксина изменилась, продолжил популистскую коалицию партии, выступая в военной форме, а не на митинговой трибуне. Его стиль управления опирается на институциональную лояльность внутри полиции и гражданской службы, а не на массовую мобилизацию сельского населения, на которой его предшественник построил партию."
 SIA_srettha_thavisin_desc: "Руководитель девелоперской компании и кандидат в премьер-министры от партии Pheu Thai на выборах 2023 года, который стал премьер-министром в августе того же года в коалиции партии с бывшими соперниками, вернувшейся к власти. Конституционный суд отстранил его от должности в августе 2024 года за нарушение этических норм, связанное с назначением в кабинет министров, что стало одним из самых коротких сроков пребывания в должности избранного премьера Таиланда за последнее десятилетие."
 SIA_paetongtarn_shinawatra_desc: "Младшая дочь Таксина Шинаватры и третий премьер-министр от партии Пхеу Тай, вступившая в должность в августе 2024 года в ответ на решение суда об отстранении ее предшественника. Утечка телефонного разговора с камбоджийским политиком Хун Сеном по поводу пограничного спора лишила ее премьерства в течение года, вновь подняв вопросы о том, насколько сильно руководство правительством по-прежнему находится в руках ее отца."
 SIA_greater_thailand_consolidated: "Объединенный Большой Таиланд"
 SIA_greater_thailand_consolidated_desc: "Ирредентистские кампании завершились. Королевство стало больше и сильнее, чем прежде, его людские резервы увеличились, промышленность обрела силу, а народ объединен общими жертвами и общей победой. Государственный аппарат, ведший войну, теперь руководит строительством."
 SIA_pax_aseana_idea: "Pax Aseana"
 SIA_pax_aseana_idea_desc: "Таиланд возглавляет стабильный, сплоченный и самодостаточный блок в сфере безопасности. Политический капитал поступает из столиц союзников, а стабильность подкрепляется пониманием того, что Бангкок не останется в одиночестве, как и любой союзник. Мир в регионе обеспечивается силой Таиланда."
 SIA_asean_defense_member: "Член SEATO"
 SIA_asean_defense_member_desc: "Эта страна по собственной инициативе решила присоединиться к региональному оборонному пакту Таиланда. Общее командование и общая цель стабилизируют ситуацию внутри страны и укрепляют оборону. Связанная согласием, а не принуждением, она сохраняет свою приверженность сообществу там, где принудительный союз рухнул бы."
 SIA_rally_round_flag: "Сплотимся вокруг флага"
 SIA_rally_round_flag_desc: "Инцидент на границе сплотил тайское общество вокруг вооруженных сил. Националистические настроения усилились, очереди на призыв выстроились в длинные очереди, но обстановка нестабильна, и медовый месяц не будет длиться вечно."
 SIA_anti_graft_idea: "Борьба с коррупцией"
 SIA_anti_graft_idea_desc: "Получившая полномочия Национальная антикоррупционная комиссия взялась разбирать закупочные и таможенные схемы, вытягивающие доходы из тайского государства. Подрядчики снова соревнуются по существу, и это видно обществу. Полгода сама кампания тяжело давит на политическую мощь — такова цена борьбы с укоренившимися интересами."
 SIA_strait_patrol_posture: "Положение патрульного в проливе"
 SIA_strait_patrol_posture_desc: "Королевский военно-морской флот Таиланда усилил патрулирование в проливе. Корабли сопровождения следят за судоходными путями, сторожевые посты наблюдают за подходами к проливу, а флот отходит дальше от порта, пока сохраняется боеготовность."
 SIA_asean_security_pledge: "Обязательства АСЕАН в области безопасности"
 SIA_asean_security_pledge_desc: "Таиланд заявил о своей приверженности роли щита Юго-Восточной Азии, а не её завоевателя. Первые гарантии предоставляются соседям, принявшим защиту Бангкока, и дипломатический корпус терпеливо занимается успокоением. Гарантии обходятся дешевле, отношения сохраняются с меньшими затратами, и силы Королевства прилагают все усилия, чтобы сделать обещание убедительным."
 SIA_protector_of_asean: "Защитник АСЕАН"
 SIA_protector_of_asean_desc: "Таиланд выбрал роль гаранта, а не завоевателя. Расширяя зону своей безопасности на всю Юго-Восточную Азию, Королевство завоевывает доверие соседей и укрепляет свой статус региональной великой державы. Постоянно действующий дипломатический корпус теперь распространяет тайское влияние сразу на несколько столиц стран АСЕАН, финансируемый за счет стабильного политического капитала, которым обладает эта роль. Дипломатия обходится дешевле, оборона — надежнее, а добрая воля АСЕАН распространяется на Бангкок."
 SIA_frontier_buffer_idea: "Приграничные буферные состояния"
 SIA_frontier_buffer_idea_desc: "Народы шан и карен поддерживают вооруженные и дружественные отношения, выступая в качестве живого щита вдоль бирманской границы. Более дешевые гарантии, более стабильная граница и преимущество в обороне против любого наступления со стороны Нейпьидо."
 SIA_shan_campaign: "Кампания Шан"
 SIA_shan_campaign_desc: "Армия мобилизована и ориентирована на операции в южной части штата Шан, с предоставлением бонусов за боевые действия против сил штата Шан на протяжении всей кампании."
 SIA_karen_campaign: "Кампания Карен"
 SIA_karen_campaign_desc: "Тайские войска продвигаются в холмы Карен, получая бонусы за боевые действия против сил Карен на протяжении всей кампании."
 SIA_wa_campaign: "Кампания Ва"
 SIA_wa_campaign_desc: "Тайские войска продвигаются в холмы Ва против UWSA, получая боевые бонусы против сил Ва на протяжении всей кампании."
 SIA_us_mech_standard: "Механизация по стандартам НАТО"
 SIA_us_mech_standard_desc: "Американская доктрина и западная техника обеспечивают превосходную организацию, разведку и надежность в полевых условиях, но это достигается ценой, заложенной в оборонный бюджет."
 SIA_reliability_woes: "Проблемы с надежностью"
 SIA_reliability_woes_desc: "Дешевая масса сопровождалась дешевой поддержкой. Сбои в работе трансмиссии и задержки с поставками запасных частей подрывают моральный дух и снижают надежность оборудования до тех пор, пока не будет упорядочен парк техники."
 SIA_chd620_teething: "Проблемы с двигателем на начальном этапе эксплуатации"
 SIA_chd620_teething_desc: "Заменяющая китайская силовая установка работает с перегревом и не прошла проверку. Пока не будут устранены неполадки, суда движутся медленнее, а их экипажи менее уверены в своих силах."
 SIA_bamboo_doctrine: "Доктрина бамбука"
 SIA_bamboo_doctrine_desc: "Дружелюбное отношение ко всем и отсутствие каких-либо обязательств. Дипломатическая гибкость, широкая доброжелательность и внутренняя стабильность нации, которая отказывается выбирать чью-либо сторону."
 SIA_loyal_opposition: "Верная оппозиция"
 SIA_loyal_opposition_desc: "Победа или поражение – партия продолжает существовать. Столетняя организация, корни которой уходят в каждую провинцию, и сплоченное ядро избирателей, не колеблющихся в зависимости от политической конъюнктуры. Это самый стабильный электорат в тайской политике, и его труднее всего отвоевать у любого конкурирующего движения, популистского или дворцового."
 SIA_democratic_institutionalism: "Демократический институционализм"
 SIA_democratic_institutionalism_desc: "Теперь правила переживают правителей. Независимые суды, функционирующий парламент, профессиональные министерства и общественность, ожидающая смены власти на выборах. Тайская демократия стала не временным явлением, а системой, и она противостоит захвату власти на улицах, во дворце или казармах."
 SIA_pt_tier_dormant: "Наблюдение за волной популизма"
 SIA_pt_tier_dormant_desc: "Пока что голоса сельских избирателей сохраняются, и демократы правят мирно. Но машина Таксина никогда по-настоящему не спит. На севере и северо-востоке старые сторонники ждут, готовые собраться вместе, как только правящая партия проявит самоуспокоение. Если же опережать события с помощью работы с избирателями на местах, ситуация останется такой же спокойной.\n\n§YПопулистская волна§!: [?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_pt_tier_rising: "Популистская волна набирает силу"
 SIA_pt_tier_rising_desc: "На северо-востоке снова развеваются красные знамена. Машина Таксина набирает силу, и правительство, неспособное противостоять ей, начинает выглядеть как временное правительство, ожидающее отставки.\n\n§YPopulist Tide§!: [?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_red_shirt_encampment: "Лагерь Ратчапрасонг"
 SIA_red_shirt_crackdown: "Репрессии против Ратчапрасонга"
 SIA_red_shirt_encampment_desc: "Десятки тысяч людей в красных рубашках удерживают торговый район в центре Бангкока за баррикадами из бамбука и шин. Торговые центры закрыты, офисы пустуют, а деловой район остановил свою работу. Правительство решило выждать."
 SIA_red_shirt_crackdown_desc: "Армия очистила перекресток боевыми патронами. Баррикады снесены, оккупация прекращена, но здания сожжены, расходы на полицию возросли, а страна наблюдала по телевизору, как солдаты расстреливают мирных жителей."
 SIA_pt_tier_surge: "Надвигается популистский триумф."
 SIA_pt_tier_surge_desc: "Опросы общественного мнения предвещают разгром. «Красные рубашки» говорят о своем намерении приехать в Бангкок, и правительство, которое позволит ситуации выйти из-под контроля, узнает, действительно ли они этого хотели.\n\n§YПопулистская волна§!: [?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_thaksin_ascendant: "Восхождение Тай Рак Тай"
 SIA_thaksin_ascendant_desc: "Кризис 1997 года разрушил старые партии, и в образовавшийся вакуум вошёл Таксин Шинаватра с состоянием в телекоммуникационной отрасли, дисциплинированным аппаратом и обещанием, которого жители деревень Севера и Северо-Востока ждали целое поколение. Дешевое здравоохранение, списание долгов и фонд развития для каждой деревни. Месяц за месяцем сельские избиратели всё больше поддерживают его партию «Тай Рак Тай», и демократы Чуана правят, словно на заёмное время.\n\nЕжемесячно партия «Тай Рак Тай» и более широкий неприсоединившийся блок получают около 2% поддержки, привлеченной голосами правящей элиты, до тех пор, пока в результате перегруппировки 2001 года этот вопрос не будет решен.\n\n§YМесяцев до развязки§!: [?ROOT.SIA_thaksin_rise_months|0]/12"
 SIA_broad_coalition_idea: "Широкая коалиция"
 SIA_broad_coalition_idea_desc: "Министерские посты переданы небольшим партиям и провинциальным лидерам в обмен на парламентскую защиту. Широкий и стабильный состав, но каждое решение — это результат переговоров, и кабинет министров действует со скоростью своего самого неохотного партнера. Сделка действительна в течение года."
 SIA_mekong_soft_power_idea: "Мягкая сила Меконга"
 SIA_mekong_soft_power_idea_desc: "Тайские банки, строительные компании и телевещательные фирмы распространяют влияние Бангкока вверх по Меконгу. Это дает им более громкий голос в регионе и дипломатические возможности для налаживания отношений еще с одной страной."
 SIA_occupation_administration: "Оккупационная администрация"
 SIA_occupation_administration_desc: "Военные губернаторы, комиссии по переселению и управления по реконструкции теперь управляют захваченными провинциями. Уровень подчинения растет быстрее, вооруженное сопротивление подавляется, а дороги и железные дороги, необходимые для интеграции, строятся быстрее. Создается аппарат для удержания того, что захватила армия."
 SIA_deep_south_category: "Глубокий Юг"
 SIA_deep_south_category_desc: "Малайско-мусульманские провинции Паттани, Яла и Наратхиват охвачены мятежом. У подавления, развития и диалога есть свои сторонники — и своя цена.\n\n§YНакал мятежа§! — это сила восстания. Чем он выше, тем смертоноснее еженедельные происшествия и тяжелее бремя для Юга. Сила, развитие и диалог сбивают его вниз. Зверства и невнимание толкают вверх.\n\n§YОбида общины§! — отчуждение, лежащее в основе мятежа. Жёсткие методы её усиливают, уступки ослабляют, и она удерживает накал не ниже §Yпорога обиды§!, равного 60% её величины. Подавление восстания силой повышает обиду, а вместе с ней и порог.\n\n§YНакал мятежа§!: [?ROOT.SIA_insurgency_intensity|0]/100\n§YОбида общины§!: [?ROOT.SIA_ds_grievance|0]/100\n§YПорог обиды§!: [?ROOT.SIA_ds_intensity_floor|0]/100"
 SIA_greater_thailand_category: "Большой Таиланд"
 SIA_greater_thailand_category_desc: "Программа по возвращению утраченных территорий. Ополчение, претензии и интеграция возвращенных земель."
 SIA_ds_security_operations: "Проверки безопасности"
 SIA_ds_security_operations_desc: "Операции по оцеплению и прочёсыванию в южных провинциях. После зачисток порядок возвращается. А заканчивают ли они мятеж или подпитывают его — спорят в каждом отчёте по итогам."
 SIA_ds_development_fund: "Фонд развития Юга"
 SIA_ds_development_fund_desc: "Дороги, школы и рабочие места для беднейших провинций страны. Медленнее, чем солдаты, дешевле, чем война."
 SIA_ds_emergency_decree: "Чрезвычайный указ"
 SIA_ds_emergency_decree_desc: "Особые полномочия для сил безопасности в южных провинциях. Задержание без предъявления обвинений, положения об иммунитете, комендантский час. Эффективно и разрушительно."
 SIA_ds_peace_dialogue: "Открытый мирный диалог"
 SIA_ds_peace_dialogue_desc: "Разрешить официальные переговоры с сепаратистским движением при посредничестве Малайзии. Разговаривая с ними, мы признаём, что они существуют. И это же — кратчайший путь закончить всё за столом."
 SIA_arm_shan_militias: "Вооружите ополчение Шан"
 SIA_arm_shan_militias_desc: "Незаметно снабжайте армии штата Шан через бирманскую границу. Каждый конвой покупает влияние на то, каким станет штат Шан."
 SIA_shan_client_state: "Спонсируйте штат Шан"
 SIA_shan_client_state_desc: "Признать и поддержать государство Шан, союзное Бангкоку. Наши братья получат свою страну, а мы — её верность."
 SIA_integrate_shan: "Интегрировать земли Шан"
 SIA_integrate_shan_desc: "Расширить сферу действия тайской администрации на плато Шан, включив туда губернаторов, школы и бат. Население должно быть достаточно усмирено, прежде чем Бангкок сможет укрепить свой контроль."
 SIA_integrate_laos: "Интегрировать земли Лаоса"
 SIA_integrate_laos_desc: "Расширить сферу действия тайского управления на территории, на которые претендует Лаос. Для начала формальной интеграции необходимы высокая степень подчиненности и низкое сопротивление в центральном государстве."
 SIA_integrate_cambodia: "Объединить кхмерские провинции"
 SIA_integrate_cambodia_desc: "Расширить действие тайского управления на Баттамбанг и Сиемреап, как это было в 1941-1946 годах. Кхмерское население должно принять тайское управление, прежде чем можно будет установить формальное административное устройство."
 SIA_integrate_malaya: "Объединить южные провинции"
 SIA_integrate_malaya_desc: "Расширить сферу действия тайского управления на бывшие султанаты, уступившие свои территории в 1909 году. Интеграция требует, чтобы население было прочно подчинено влиянию Бангкока до формальной аннексии."
 SIA_cost_1_0: "£treasury 1.0"
 SIA_cost_1_5: "£treasury 1.5"
 SIA_thaksinite_party_governs_tt: "§Y[neutral_Social_L]§! — правящая партия."
 SIA_cost_2_0: "£treasury 2.0"
 SIA_cost_2_0_blocked: "£treasury 2.0 §R(недостаточно)§!"
 SIA_otpc_education_strain: "Внедрение программы «Один планшет для каждого ребёнка»"
 SIA_otpc_education_strain_desc: "Зарядные устройства, поломки, замена устройств и бюджет на обучение, который никто не подсчитал. Министерство образования берет на себя реальные затраты на эту программу."
 SIA_packed_senate: "Наш собственный Сенат"
 SIA_packed_senate_desc: "Лоялисты в верхней палате и независимых агентствах. Пока что правительственный законопроект проходит одобрение."
 SIA_cost_5_0: "£treasury 5.0"
 SIA_economy_category: "Стратегические и экономические решения Таиланда"
 SIA_economy_category_desc: "Туризм, медицина, промышленность, вооружения и мегапроекты, наряду с рычагами дипломатии и высокой стратегии АСЕАН. Двигатели тайского государства реагируют на инвестиции и политический капитал, когда казначейство и кабинет министров могут их выделить."
 SIA_ds_hearts_and_minds: "Сердца и умы"
 SIA_ds_hearts_and_minds_desc: "Обучение на малайском языке, религиозная работа, комиссии по выплате компенсаций и сельские посредники. Никто не устраивает по этому поводу торжества, но на карте происшествий становится тише."
 SIA_contain_the_crisis: "Сдержать кризис"
 SIA_contain_the_crisis_desc: "Глубокий Юг вскипел. Снизьте накал мятежа ниже §Y60§! в течение полугода, иначе насилие пойдёт по нарастающей, а цена в стабильности и легитимности будет расти."
 SIA_choose_a_path: "Выберите путь на юге"
 SIA_choose_a_path_desc: "Кризис в разгаре, у правительства есть ясный политический мандат, но никакой южной стратегии так и не принято. Выберите в течение года силу, королевское развитие или диалог — иначе промедление обойдётся Королевству очень дорого."
 SIA_medical_tourism_campaign: "Кампания медицинского туризма"
 SIA_medical_tourism_campaign_desc: "Рекламируйте тайские больницы всему миру, предлагая хирургические операции и реабилитацию по ценам, значительно ниже западных, с собственным пляжем. Кампания окупится сама собой, если палаты смогут выдержать нагрузку."
 SIA_eec_investment_phase: "Инвестиционный этап ЕЭС"
 SIA_eec_investment_phase_desc: "Выделить следующий транш средств Восточного экономического коридора на расчистку земель, коммунальные услуги, портовые и железнодорожные работы в восточных провинциях."
 SIA_cost_3_0: "£treasury 3.0"
 SIA_cost_4_0: "£treasury 4.0"
 SIA_cost_6_0: "£treasury 6.0"
 SIA_cost_7_0: "£treasury 7.0"
 SIA_cost_1_0_blocked: "£treasury 1.0 §R(недостаточно)§!"
 SIA_cost_1_5_blocked: "£treasury 1.5 §R(недостаточно)§!"
 SIA_cost_3_0_blocked: "£treasury 3.0 §R(недостаточно)§!"
 SIA_cost_4_0_blocked: "£treasury 4.0 §R(недостаточно)§!"
 SIA_cost_5_0_blocked: "£treasury 5.0 §R(недостаточно)§!"
 SIA_cost_6_0_blocked: "£treasury 6.0 §R(недостаточно)§!"
 SIA_cost_7_0_blocked: "£treasury 7.0 §R(недостаточно)§!"
 SIA_family_holdings: "Семейные холдинги"
 SIA_family_holdings_desc: "Семья Шинаватра контролирует значительные доли в телекоммуникациях, спутниковых услугах, спутниковом телевидении и десятке связанных с ними предприятий. Превращение государственных связей в дивиденды — это семейная традиция и источник дохода, на который рассчитывает партия."
 SIA_royal_projects: "Королевские проекты развития"
 SIA_royal_projects_desc: "Королевские группы по развитию направляются в сельские провинции для создания демонстрационных ферм, мобильных медицинских пунктов, управления водными ресурсами и профессиональной подготовки. Каждый проект сопровождается личным престижем короля, и старосты деревень помнят, кто их послал."
 SIA_isoc_surveillance_sweep: "Обследование в рамках системы мониторинга ISOC"
 SIA_isoc_surveillance_sweep_desc: "Направить разведывательные группы ISOC для проверки мобильных сетей, сетей информаторов в деревнях и пунктов пересечения границы на Глубоком Юге. Никаких ордеров, никаких документов, и картина Юга, которой армия никогда не располагала."
 SIA_isoc_grid_disruption: "Сбой в работе сети ISOC"
 SIA_isoc_grid_disruption_desc: "Цель — нейтрализовать каналы финансирования, командные узлы и курьерские сети, поддерживающие оперативный темп повстанческого движения. Каждый нарушенный узел — это бомба, которая не взорвется."
 SIA_ds_cordon_and_search: "Оцепление и обыск"
 SIA_ds_cordon_and_search_desc: "Оцепление деревень и поквартирные облавы на поиски оружия и боевиков. Это сбивает темп повстанцев, но каждая выбитая дверь и каждый задержанный родственник усугубляют недовольство, которым питается движение."
 SIA_ds_fund_religious_schools: "Профинансируйте школы Пондока"
 SIA_ds_fund_religious_schools_desc: "Государственные субсидии для религиозных школ и культурных учреждений малайско-мусульманского происхождения, которые так дороги Югу, предоставляются на условиях самого Юга. Это мало влияет на насилие на этой неделе, но наносит серьезный удар по отчуждению, которое его поддерживает."
 SIA_asean_rotating_summit: "Проведение саммита АСЕАН"
 SIA_asean_rotating_summit_desc: "Используйте председательство Таиланда для проведения масштабного саммита, демонстрирующего Бангкок как дипломатическую столицу Юго-Восточной Азии. Возникшее в результате этого благоприятное отношение обернется политическим капиталом внутри страны и престижем за рубежом."
 SIA_asean_mediate_myanmar: "Урегулирование кризиса в Мьянме путем посредничества"
 SIA_asean_mediate_myanmar_desc: "Представьте Таиланд как честного посредника между военной хунтой Мьянмы и международным сообществом. Тихий успех укрепляет долгосрочное влияние в Нейпьидо. Публичный провал, тем не менее, служит полезным сигналом для остального региона."
 SIA_asean_free_trade_push: "Продвигайте меры свободной торговли АСЕАН."
 SIA_asean_free_trade_push_desc: "Используйте председательство для продвижения мер по упрощению торговых процедур, таких как гармонизация таможенных правил, снижение нетарифных барьеров и создание цифровых торговых коридоров. Подготовка требует времени, но экспортные поступления поступают в срок. Соседи по АСЕАН отмечают конструктивное лидерство Бангкока."
 SIA_retry_section_112: "Поправка вновь внесена на рассмотрение."
 SIA_retry_section_112_desc: "Первая попытка реформировать статью 112 провалилась в законодательном органе. Общественная реакция была громкой, но не менее активной была и контрмобилизация молодых избирателей. Вторая попытка, лучше подготовленная и более узко сформулированная, все еще может быть принята, если время будет выбрано удачно."
 SIA_ds_autonomy_framework: "Рамочная программа автономии Юга"
 SIA_ds_autonomy_framework_desc: "Предложить пилотный проект скромной схемы административной автономии для малайско-мусульманских провинций, включающей региональный консультативный совет, официальный статус малайского языка и передачу финансирования школ на местный уровень. Не независимость, даже близко, но достаточно, чтобы показать, что Бангкок готов прислушаться. Шесть месяцев на разработку, целое поколение на оценку."
 SIA_isr_persistent_sweep: "Непрерывный обзор средствами разведки и наблюдения"
 SIA_isr_persistent_sweep_desc: "Направьте силы «Глаза в небе» на постоянное наблюдение за Глубоким Югом: контроль пограничных переходов, движения транспорта, передвижений транспортных средств. Повстанцы потеряют возможность передвигаться незаметно, и ни одному солдату не придётся заходить в деревню."
 SIA_political_gambits_category: "Политические гамбиты"
 SIA_political_gambits_category_desc: "Между ключевыми направлениями правительство по-прежнему располагает рычагами влияния: перестановки министров, назначение прокуроров, перевод денег вглубь страны, а в конечном итоге — либо сделка с дворцом, либо судебное разбирательство.\n\n§YДавление реформ§!: [?ROOT.SIA_reform_pressure|0]/100. Недовольство среди населения и молодежи постепенно переходит в движение «Двигайся вперед». После 60 лет оно выливается в протесты.\n§YПопулистская волна§!: [?ROOT.SIA_pheu_thai_pressure|0]/100. Сельская местность возвращается к Пхеу Тай. Только демократическое правительство может это обеспечить."
 SIA_cabinet_reshuffle: "Перестановки в кабинете министров"
 SIA_cabinet_reshuffle_desc: "Меняйте министров, подкупайте критиков, убирайте из телепрограммы самого слабого кандидата. Усталость от Праюта или политика судебных заседаний уходит вместе с ним, в зависимости от того, что в данный момент висит на волоске правительства. Партия заявляет о обновлении, ничего существенного не меняя."
 SIA_lese_majeste_lever: "Нажмите рычаг оскорбления величества."
 SIA_lese_majeste_lever_desc: "Избирательное применение статьи 112 против самых ярых критиков реформ. Обвинения предъявлены, залог отклонен, показания отозваны. Оппозиция теряет голос, и все, кто наблюдает за происходящим, отдаляются от системы."
 SIA_coup_watch_category: "Казармы наблюдают."
 SIA_coup_watch_category_desc: "Каждый избранный популист в истории Таиланда правил в тени армии. Быстрые победы, такие как льготы в телекоммуникациях, завышенные контракты и коррупция в семьях, сейчас покупают деньги и голоса, но каждая из них приносит прибыль. §YРиск государственного переворота§!Кроме того, он сам по себе растет каждую неделю, обычно на 0,5, а когда уровень стабильности ниже 50%, на 1,0, и никогда не падает без принятия мер. Приведенные ниже решения снижают риск, и каждое из них что-то вам стоит. Дождитесь, пока он превысит 85, и... §RУспокойте высшее командование§! Миссия вооружения. Обезвредьте это, иначе армия захватит власть.\n\n§YРиск государственного переворота§!: [?ROOT.SIA_coup_risk|0]/100"
 SIA_shin_corp_tax_holiday: "Настройте налоговые льготы для телекоммуникаций под свои нужды"
 SIA_shin_corp_tax_holiday_desc: "Тихо перепишите условия концессии так, чтобы семейная телекоммуникационная империя почти ничего не заплатила за свою следующую крупную прибыль. Выиграют и казна, и партия. Генералы ведут подсчет."
 SIA_school_milk_contract: "Присудить контракт на поставку школьного молока"
 SIA_school_milk_contract_desc: "Общенациональная программа бесплатного молока для сельских школьников, пользующаяся огромной популярностью в деревнях, финансируется через картель поставщиков, который точно знает, кого благодарить. Деревни благодарны. Сотрудники — нет."
 SIA_otpc_tablet_procurement: "Выпускайте по одному планшету на каждого ребенка."
 SIA_otpc_tablet_procurement_desc: "Эффектная схема по обеспечению каждого первоклассника планшетом. Камеры в восторге, и число сторонников растет. Финансирование осуществляется наличными, школьный бюджет покрывает расходы в течение полугода, а закупка ведется по схеме откатов, о которой знают все в военной форме."
 SIA_family_business_favors: "Передача контрактов семейной фирме"
 SIA_family_business_favors_desc: "Государственные строительные работы, импортные лицензии, одна-две концессии на порты — всё это достаётся компаниям, которыми владеют родственники премьер-министра. Деньги поступают в казну и в семью. Армия добавляет их к делу против вас."
 SIA_court_the_generals: "Уговаривайте генералов"
 SIA_court_the_generals_desc: "Сдержанные бюджетные статьи, престижные должности и несколько удачно расположенных повышений по службе. Всё это требует времени, но довольный офицерский корпус – это терпеливый коллектив. Это снижает риск государственного переворота."
 SIA_military_budget_boost: "Одобрить щедрые расходы на оборонные закупки"
 SIA_military_budget_boost_desc: "Подводные лодки, истребители, новое штабное крыло. Одобрите список пожеланий армии, и командование вспомнит, кто оплачивает счета. Гражданская экономика немного больше нуждается в этом, но риск государственного переворота резко снижается."
 SIA_anti_corruption_gesture: "Передайте дело своего приспешника прокурорам."
 SIA_anti_corruption_gesture_desc: "Выберите какого-нибудь второстепенного союзника, передайте дело в антикоррупционную комиссию и пусть камеры работают. Сторонники партии наблюдают, как друга продают ради сенсационных заголовков, а рейтинги падают. Генералы видят правительство, которое наказывает своих же."
 SIA_promote_loyalists: "Поощряйте лояльных офицеров"
 SIA_promote_loyalists_desc: "Перетасовка ежегодного списка повышений по службе с целью назначения надежных кадров в наиболее важные подразделения: Первую армию, Королевскую гвардию, столичный гарнизон. Это требует политического капитала, но позволяет разместить более лояльных людей между правительством и танками. Снижает риск государственного переворота."
 SIA_reassure_high_command: "Успокойте высшее командование"
 SIA_reassure_high_command_desc: "Колонки подпитываются, и сценарий для трансляции написан. Необходимо снизить риск государственного переворота ниже 70% до истечения таймера, используя бюджеты, повышения по службе или публичное противостояние с приближенными. В случае неудачи армия захватит власть."
 SIA_canal_tolls: "Взимание платы за проход по каналу"
 SIA_canal_tolls_desc: "Через канал Кра проходит один из самых дорогостоящих морских грузов в мире. Сборы с коммерческих судов, таких как контейнеровозы, танкеры, балкеры и круизные лайнеры, поступают непосредственно в государственную казну каждые шесть месяцев."
 SIA_kra_construction: "Канал Кра"
 SIA_kra_construction_desc: "Кра-канал на протяжении всего своего существования. Сначала поэтапные работы по строительству большого канала на Кра-перешейке, каждый этап которых финансировался по очереди, приводили к перерасходу средств и, на спорных территориях, к саботажу. Затем военно-морское управление завершенным проливом: графики патрулирования, протоколы транзита и безопасность новейшего в мире узкого места.\nСтроительство большого канала ведется в три финансируемых этапа. §YПрогресс строительства§!: [?ROOT.SIA_kra_progress|0]%"
 SIA_kra_phase_1: "Этап I, пересечение перешейка"
 SIA_kra_phase_1_desc: "Первые масштабные раскопки. Проложить канал через хребет полуострова. Профинансировать этот этап до окончания строительного сезона, иначе проектный офис вернется с перерасходом средств."
 SIA_kra_phase_2: "Этап II, работы по устройству шлюзов и каналов."
 SIA_kra_phase_2_desc: "Оборудуйте канал, постройте шлюзы и возведите фарватер, который сможет сдержать два моря. Не позволяйте бюджету отставать от графика, иначе вас ждет очередной перерасход."
 SIA_kra_phase_3: "Этап III, морские испытания"
 SIA_kra_phase_3_desc: "Затопить верхнюю часть канала, установить затворы и пропустить лоцманов через него в балласте. Заключительный этап перед открытием канала. Профинансируйте его, и мегапроект будет завершен."
 SIA_strait_patrol: "Патруль пролива"
 SIA_strait_patrol_desc: "Организуйте регулярное патрулирование транзитного коридора Кра кораблями Королевского военно-морского флота Таиланда. Такое присутствие сдерживает пиратство, успокаивает судоходство и дает флоту возможность провести больше времени в море, чем ему когда-либо требовалось."
 SIA_red_path_category: "Красный путь"
 SIA_red_path_category_desc: "Коммунистическая партия Таиланда строит свою опору через деревенские комитеты, ячейки на предприятиях и объединения по месту жительства, а не через парламентскую борьбу. Каждый укоренившийся комитет расширяет народную поддержку движения и испытывает пределы официальной терпимости.\n\nКогда объявлена всеобщая забастовка, её инструменты появляются в этой же категории. Забастовка удаётся, если §RНакал забастовки§! достигнет 100 в течение 365 дней: тогда правительство уступает и партия берёт власть без вооружённого восстания. Если срок истечёт раньше, армия подавит забастовку и возьмёт власть сама.\n§RНакал забастовки§!: [SIA_strike_momentum_status]"
 SIA_spread_flame_isaan: "Организовать деревни Исаана"
 SIA_spread_flame_isaan_desc: "Партийные кадры направляются в деревни и районные городки по всему Исану, где создают деревенские комитеты, кружки ликбеза и кооперативные сети. Северо-восток — беднейший и самый населённый регион Таиланда, и именно он давал партии ядро поддержки во время мятежа 1960-х и 1970-х годов, так что работа там закрепляет землю, которую движение уже держит."
 SIA_spread_flame_north: "Организовать северные общины"
 SIA_spread_flame_north_desc: "У северных провинций давняя история крестьянских протестов и рабочей самоорганизации — от федераций арендаторов 1970-х до сменивших их кооперативных движений. Партийные организаторы работают через горные кооперативы и профсоюзы лесорубов. Вторая опорная база за пределами Исана придаёт движению общенациональный, а не чисто северо-восточный характер."
 SIA_mass_education_campaign: "Кампания массового политического просвещения"
 SIA_mass_education_campaign_desc: "Партия ведёт общенациональную программу политического просвещения, охватывающую историю рабочего движения, экономическую теорию и летопись иностранного вмешательства в Юго-Восточной Азии. Занятия идут через близкие партии профсоюзы, кооперативы и общественные центры, а не через государственные школы. Кампания занимает партийных организаторов и преподавателей и создаёт слой сторонников, которые понимают программу, поддерживать которую их просят."
 SIA_asean_arms_export: "Контракт на экспорт вооружений АСЕАН"
 SIA_asean_arms_export_desc: "Оборонные предприятия Таиланда обладают производственными мощностями и региональными связями, позволяющими поддерживать регулярную экспортную программу. Каждый ежегодный контракт, будь то бронемашины MRAP, взрыватели для артиллерии, партии боеприпасов или барражирующие боеприпасы, напрямую пополняет казну и укрепляет позиции Таиланда как предпочтительного поставщика второго эшелона в регионе."
 SIA_defense_export_contract: "Контракт на экспорт продукции оборонного назначения"
 SIA_defense_export_contract_desc: "Благодаря действующему Управлению по экспорту оборонной продукции и сертификации арсеналов королевства для продажи, кабинет министров может утвердить новый экспортный контракт. Боеприпасы Chaiseri First Win, ракеты и боеприпасы DTI, а также системы, производимые по лицензии, регулярно поставляются покупателям из стран АСЕАН. Политический капитал, затраченный на заключение сделки, возвращается в казну в виде реальной экспортной выручки, при этом оборонно-промышленное подразделение покрывает свои расходы самостоятельно."
 SIA_counter_chinese_influence: "Противодействие китайскому влиянию"
 SIA_counter_chinese_influence_desc: "Необходимо задействовать дипломатические, экономические и информационные ресурсы, чтобы ослабить влияние Пекина в окрестностях Бангкока. Операция займет месяцы и потребует затрат, но альтернативой является попустительство."
 SIA_counter_indian_influence: "Противодействие индийскому влиянию"
 SIA_counter_indian_influence_desc: "«Мягкое влияние» Нью-Дели в Юго-Восточной Азии, от инвестиций и культурных программ до стратегического партнерства, незаметно расширяется. Скоординированная кампания по противодействию влиянию перенаправляет региональных партнеров в сторону Бангкока."
 SIA_renegotiate_china_contracts: "Пересмотреть китайские контракты"
 SIA_renegotiate_china_contracts_desc: "В рамках инициативы «Один пояс и один путь» были построены необходимые Таиланду дороги и железные дороги, но условия финансирования закрепляют влияние Пекина на целое поколение. Кабинет министров может смириться с этой зависимостью или заплатить политическую цену за пересмотр условий."
 SIA_us_security_review: "Обзор безопасности США и Таиланда"
 SIA_us_security_review_desc: "Вашингтон запросил официальный двусторонний обзор вопросов безопасности. Результат этого обзора определит, будет ли Таиланд углублять свою приверженность договору, включая программы обучения, доступ к закупкам и политическое влияние, или же сохранит стратегическую защиту."
 SIA_strategic_fuel_reserve: "Создать стратегический топливный резерв"
 SIA_strategic_fuel_reserve_desc: "Ввести в эксплуатацию трехмесячный национальный запас топлива в распределенных резервуарных парках. Эти инвестиции сглаживают колебания цен, обеспечивают резерв военной логистики и демонстрируют региональным партнерам устойчивость цепочки поставок."
 SIA_anti_corruption_drive: "Кампания по борьбе с коррупцией"
 SIA_anti_corruption_drive_desc: "Целенаправленная кампания по борьбе с коррупцией в сфере государственных закупок, таможенным мошенничеством и кумовскими сетями, укоренившимися в провинциальном правительстве. Внедрение честных контрактов на начальном этапе занимает больше времени, но в долгосрочной перспективе обходится дешевле."
 SIA_tax_modernization: "Модернизация налоговой системы"
 SIA_tax_modernization_desc: "Замените бумажную систему оценки налогов в Налоговом управлении на обязательную электронную подачу документов, алгоритмический аудит и стимулирование оценщиков на основе доходности. Внедрение будет болезненным. Однако постоянный эффект от повышения эффективности окупит капитальные затраты в течение пяти лет."
 SIA_gripen_ef_upgrade: "Контракт на Gripen E/F"
 SIA_gripen_ef_upgrade_desc: "Контракт на поставку 12 истребителей Gripen E/F, подписанный в августе 2025 года, подтверждает стремление ВВС Таиланда к созданию истребителя пятого поколения. Первые поставки ожидаются в 2029 году. Контракт укрепляет долгосрочные отношения ВВС Таиланда с компанией SAAB и гарантирует шведскую техническую поддержку до 2040-х годов."
 SIA_imf_program_active: "Действующая программа выплат МВФ, начатая через §Y$SIA_recover_from_97_crisis$§!"
 SIA_ds_active: "На Глубоком Юге продолжается повстанческое движение."
 SIA_ds_resolved_force: "Глубокий Юг был умиротворён силой."
 SIA_not_ruled_by_communists_tt: "§Y[communist_state_L]§! не является правящей партией."
 SIA_not_ruled_by_democrats_tt: "§Y[conservatism_L]§! не является правящей партией."
 SIA_not_ruled_by_royalists_tt: "§Y[Nat_Autocracy_L]§! и §Y[Monarchist_L]§! не являются правящей партией."
 SIA_ds_intensity_below_25_tt: "Интенсивность повстанческого движения на Глубоком Юге ниже §Y25§! (в настоящее время §Y[?SIA_insurgency_intensity|0]§!)"
 SIA_ds_intensity_below_30_tt: "Интенсивность повстанческого движения на Глубоком Юге ниже §Y30§! (в настоящее время §Y[?SIA_insurgency_intensity|0]§!)"
 SIA_ds_intensity_below_35_tt: "Интенсивность повстанческого движения на Глубоком Юге ниже §Y35§! (в настоящее время §Y[?SIA_insurgency_intensity|0]§!)"
 SIA_ds_intensity_below_40_tt: "Интенсивность повстанческого движения на Глубоком Юге ниже §Y40§! (в настоящее время §Y[?SIA_insurgency_intensity|0]§!)"
