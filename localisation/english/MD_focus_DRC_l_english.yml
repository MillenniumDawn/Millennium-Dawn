 MDRC_maritime_radar_research_bonus: "Matadi Coastal Navigation Programme"
 MDRC_patrols_research_bonus: "Joint River Patrol Communications"
 MDRC_programme_accounts: "Treasury Reconstruction Team"
 MDRC_programme_accounts_desc: "A temporary team restores revenue records and contract oversight. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_programme_works: "Reconstruction Works Programme"
 MDRC_programme_works_desc: "Coordinated tenders and engineering teams accelerate construction for the duration of the programme. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_programme_industry: "Industrial Rehabilitation Programme"
 MDRC_programme_industry_desc: "Maintenance teams and supplier credit improve factory output and efficiency growth temporarily. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_programme_rural: "Rural Recovery Programme"
 MDRC_programme_rural_desc: "Extension services and safe rural markets improve public confidence and agricultural construction. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_programme_health: "Community Health Campaign"
 MDRC_programme_health_desc: "A temporary public-health campaign trains local staff and improves confidence in essential services. Trained staff support productivity growth but require additional administrative expenditure."
 MDRC_programme_science: "Research Partnerships Programme"
 MDRC_programme_science_desc: "Laboratory exchanges and technical fellowships improve research for the duration of the programme. Trained staff support productivity growth but require additional administrative expenditure."
 MDRC_programme_diplomacy: "Active Diplomatic Missions"
 MDRC_programme_diplomacy_desc: "Funded delegations make sustained diplomatic contact less expensive. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_programme_liaison: "Ceasefire Liaison Network"
 MDRC_programme_liaison_desc: "Joint liaison teams support confidence and command coordination while negotiations continue. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_programme_operations: "Coordinated Field Operations"
 MDRC_programme_operations_desc: "A temporary operational planning effort improves land attack and supply discipline. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_programme_return: "Return and Reconciliation Programme"
 MDRC_programme_return_desc: "Civilian documentation and community mediation improve confidence during resettlement. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_programme_frontier: "Frontier Readiness Exercises"
 MDRC_programme_frontier_desc: "A temporary border training programme improves organization recovery and defensive preparation. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_diplomatic_service: "Congolese Diplomatic Service"
 MDRC_diplomatic_service_desc: "A permanent foreign service rebuilds regular contact with other governments. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_diplomatic_network: "Regional Diplomatic Network"
 MDRC_diplomatic_network_desc: "Neighbouring capitals and trading partners now have established channels to Kinshasa. Reporting and oversight improve production-efficiency growth while adding administrative expenditure."
 MDRC_customs_network: "Regional Trade and Customs Network"
 MDRC_customs_network_desc: "Standard documents and permanent liaison offices support diplomacy and market access."
 MDRC_regional_diplomatic_power: "An Established Regional Voice"
 MDRC_regional_diplomatic_power_desc: "A professional foreign service and functioning customs institutions sustain the Republic regional influence."
 MDRC_social_compact: "A Funded Social Compact"
 MDRC_social_compact_desc: "Teachers, health workers and local administrators form a lasting public-service settlement. Trained staff support productivity growth but require additional administrative expenditure."
 mdrc_policy.1.t: "The First Reconstruction Budget"
 mdrc_policy.1.d: "The reconstruction council cannot fund every priority at once. Its first limited budget can restore treasury offices, repair productive infrastructure, or support farming communities. This choice gives a temporary programme; the rest of the national focus tree remains open."
 mdrc_policy.1.a: "Restore the treasury offices."
 mdrc_policy.1.b: "Put engineers and workshops to work."
 mdrc_policy.1.c: "Begin with rural livelihoods."
 MDRC_accounts_programme_bonus: "Digital Public Accounting"
 mdrc_policy.2.t: "A Settlement with the Creditors"
 mdrc_policy.2.d: "The reconciled register has already secured a limited debt write-down. Creditors now offer a further settlement for an immediate payment. Alternatively, we can keep the funds at home and publish the register to strengthen budget oversight."
 mdrc_policy.2.a: "Pay 0.5 treasury for a further 1 debt reduction."
 mdrc_policy.2.b: "Publish the register and reinforce budget oversight."
 MDRC_plan_construction_programme_bonus: "National Construction Standards"
 MDRC_plan_energy_programme_bonus: "National Energy Planning"
 MDRC_plan_agriculture_programme_bonus: "National Agricultural Planning"
 mdrc_policy.3.t: "Sequence the Development Plan"
 mdrc_policy.3.d: "The plan needs a first technical priority. Engineers propose construction standards, utilities request modern energy technology, and local producers seek agricultural research. We can accelerate one programme now; our investment model remains a separate decision."
 mdrc_policy.3.a: "Start with construction methods."
 mdrc_policy.3.b: "Start with energy systems."
 mdrc_policy.3.c: "Start with agricultural productivity."
