 cnc_equipment_8: "Оборудование C6I"
 cnc_equipment_8_desc: "Оборудование командования и управления — это система, позволяющая командованию осуществлять руководство и контроль над подчинёнными силами для выполнения боевых задач и миссий. Эффективное командование и управление повышает организованность и боевой дух. C6I (командование, управление, связь, вычислительная техника, совместная работа, разведка, оперативная совместимость, наблюдение, обнаружение целей и рекогносцировка) — оборудование C2 восьмого поколения."
