 UKR_modernize_su27up2m: "Modernize §YSu-27UB§! fighter aircraft"
 UKR_modernize_su27up2m_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_su271m_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YSu-27UP2M§! is a Ukrainian modernization of the §RSoviet§! §YSu-27UB§! two-seat combat trainer, developed by the Zaporizhzhia State Aircraft Repair Plant §LMiGremont§!.\nThe modernization introduces an improved navigation and information system, a helmet-mounted targeting and display system, an automatic chaff and flare dispenser, and an upgraded combat employment computer.\nThese improvements enhance the aircraft's targeting capabilities and expand its ability to engage both aerial and ground targets using a wider range of air-launched weapons.\nThe aircraft is using the Omut-KM EWS in game instead of the updated Countermeasures.§!"
 UKR_modernize_su24mu: "Modernize §YSu-24M§! Strike aircraft"
 UKR_modernize_su24mu_desc: "§WThe §YSu-24MU§! is a Ukrainian modernization of the §RSoviet§! §YSu-24M§! frontline low altitude attack aircraft, adapted to meet the requirements of modern warfare.\nThe modernization incorporates the §YOmut-KM§! airborne electronic countermeasures system, designed to improve the aircraft's survivability against enemy radar-guided air defence systems.\nThe aircraft is also adapted to employ modern precision-guided weapons, including the British-French §YStorm Shadow§! and a domestic §YR-360L Neptun-D§! cruise missiles and other advanced air-launched munitions, significantly expanding its strike capabilities.§!"
 UKR_modernize_l39_m1: "Modernize L-39C Albatros trainer aircraft"
 UKR_developed_l39_m1_flag: "Completed decision §YModernize L-39 Albatros trainer aircraft§!"
 UKR_modernize_l39_m: "Further Modernize L-39C Albatros trainer aircraft"
 UKR_modernize_l39_m1_desc: "The §YL-39M1 Albatros§! is a Ukrainian modernization of the §RCzechoslovak§! §YL-39C§! jet trainer, developed to improve its flight performance and extend its service life.\nThe modernization includes an overhaul of the airframe, replacement of the original AI-25TL engine with the more powerful AI-25TLSH, and upgrades to the engine control system.\nAn integrated satellite navigation system and an updated flight data recorder improve navigation accuracy, flight monitoring, and operational reliability.\nThese improvements enhance the aircraft's performance and extend the service life of Ukraine's existing fleet of §RSoviet-era§! training aircraft."
 UKR_modernize_l39_m_desc: "The §YL-39M Albatros§! is a further Ukrainian modernization of the §RCzechoslovak§! §YL-39C§! jet trainer, designed to improve pilot training for modern combat aircraft.\nIn addition to the improvements introduced by the §YL-39M1§!, the aircraft incorporates the §YBTK-39§! onboard training complex, featuring multifunctional cockpit displays, a head-up display, and dedicated controls for simulating combat modes.\nThe system reproduces elements of the MiG-29 fighter's targeting and combat systems, allowing pilots to practice procedures and develop combat skills in a dedicated training aircraft.\nBy providing a more advanced training environment at significantly lower operating costs than a frontline fighter, the §YL-39M§! improves pilot preparation while preserving the utility of Ukraine's existing trainer fleet."
 UKR_develop_horlytsia: "Develop §YAn-BK-1 Horlytsia§! UAV"
 UKR_develop_horlytsia_desc: "§WThe §YAn-BK-1 Horlytsia§! is a Ukrainian tactical reconnaissance and strike unmanned aerial vehicle developed by the §YAntonov§! State Enterprise.\nDesigned to support ground forces, the aircraft combines day-and-night aerial reconnaissance with real-time intelligence gathering and target acquisition.\nIts onboard surveillance systems enable the detection and tracking of enemy targets, providing valuable information for artillery units and battlefield commanders.\nThe platform was also designed to carry weapons for engaging ground targets, offering an additional precision-strike capability while reducing the risks to manned aircraft.§!"
