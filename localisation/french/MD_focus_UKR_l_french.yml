 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_wait_tt: "§YNVK Techimpex§! presents its work in about §Y$DAYS$§! days."
 ukraine_modernize_sov_equipment_btr_60_modernization_convert_tt: "We can now §Gconvert§! our older first-generation armored vehicles to this variant on a production line."
