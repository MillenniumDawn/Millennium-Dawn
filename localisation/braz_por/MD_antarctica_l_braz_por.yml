 antarctica_reports_warning_tt: "§RAtenção:§!\nSe a quantidade de relatórios ultrapassar 7, as Partes Consultivas do Tratado da Antártica poderão tomar medidas diplomáticas contra a sua nação, incluindo potenciais sanções pesadas e perda do status de ATCP, se presente. É recomendado manter a quantidade de relatórios abaixo de 7 para evitar consequências negativas.\n\nSe a violação ocorrer enquanto houver uma pesquisa nuclear detectada, cada nação do Tratado da Antártica receberá um evento para impor um embargo à sua nação."
