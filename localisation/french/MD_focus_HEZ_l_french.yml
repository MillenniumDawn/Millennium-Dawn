 hezbollah_events.15.d: "With the help of almighty Allah and the bravery of our fighter's will, we have damaged the Enemy's Armed Forces slightly!"
 hezbollah_events.15.o1: "Subhan Allah !"
 hezbollah_events.10.t: "Les raiders du Hezbollah ont été vaincus !"
 hezbollah_events.10.d: ""
 hezbollah_events.10.o1: "Très bien."
 hezbollah_events.11.t: "Les raiders du Hezbollah ont pillé nos équipements avec succès !"
