 JAP_sony_events.9.a_tt: "Treasury: §R-$3.00 billion§!\nGain one §G10%§! research bonus for §YComputing Technology§!\nGain one §G10%§! research bonus for §YInternet Technology§!\nGain one §G10%§! research bonus for §YMicrochip Technology§!."
 JAP_sony_events.9.b_tt: "Treasury: §R-$1.00 billion§!\nPolitical Power: §G+5§!\nGain one §G15%§! research bonus for §YIndustry Technology§!."
 JAP_sony_events.9.c_tt: "Treasury: §R-$6.00 billion§!\nGain one §G15%§! research bonus for §YMicrochip Technology§!\nGain one §G15%§! research bonus for §YIndustry Technology§!\nGain §YFoundry Expansion§! for §Y1,095 days§!."
 JAP_sony_events.10.a_tt: "Treasury: §G+$3.00 billion§!\nPolitical Power: §G+10§!\nGain one §G10%§! research bonus for §YIndustry Technology§!."
 JAP_sony_events.10.b_tt: "Treasury: §R-$3.00 billion§!\nGain one §G15%§! research bonus for §YComputing Technology§!\nGain one §G10%§! research bonus for §YIndustry Technology§!."
