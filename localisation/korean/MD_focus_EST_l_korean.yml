 EST_immigration_con: "이민에 맞서기"
 EST_immigration_con_desc: "우리 모두 이민자들이 우리에게 좋은 것을 줄 수 없다는 데 동의해야 합니다. 이민자를 많이 받아들이는 다른 나라들을 보십시오. 아니, 우리는 그들에게 맞서 집으로 돌아가라고 말해야 합니다."
