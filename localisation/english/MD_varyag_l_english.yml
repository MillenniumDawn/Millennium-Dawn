l_english:
 varyag_dispute_category: "The Varyag Dispute"
 varyag_dispute_category_desc: "Ankara's refusal to clear the unfinished §YVaryag§! for passage through the Turkish Straits put its future in doubt. The decision on where to send the hull will determine who can finish it."
 CHI_varyag_negotiate_transit: "Negotiate Passage for the Varyag"
 CHI_varyag_negotiate_transit_desc: "Offer Ankara payment for pilots, tugs, and traffic control. We can sweeten the offer with technical assistance for its missile program."
 UKR_varyag_buy_back_hull: "Reclaim the Varyag"
 UKR_varyag_buy_back_hull_desc: "Cancel the sale to Chong Lot, reimburse the buyer through Beijing, and pay Ankara to arrange the return tow to Mykolaiv."
 TUR_varyag_propose_joint_completion: "Propose Joint Completion"
 TUR_varyag_propose_joint_completion_desc: "Offer Kyiv paid work for its shipyards and design offices. If Kyiv accepts, we will reimburse the original buyer and tow the hull to Gölcük."
 varyag_complete_the_carrier: "Complete the Varyag"
 varyag_complete_the_carrier_desc: "Refit the unfinished carrier and commission it into our navy. The work will take two years. If we lose control of the shipyard, the project will stop and its funding will be lost."
 varyag_chinese_funds_tt: "We have at least §Y$2.00 billion§! in the treasury to cover the more expensive offer."
 varyag_turkish_funds_tt: "We have at least §Y$2.70 billion§! in the treasury to cover the agreement."
 varyag_transit_offer_tt: "Turkey can accept §Y$2.00 billion§!, accept §Y$1.00 billion§! with missile assistance, or end the talks."
 varyag_transit_approved_tt: "The §YVaryag§! will leave for China. The voyage will take about four months."
 varyag_transit_refused_tt: "China keeps the carrier drawings. Ukraine can reclaim the hull and pay for its return tow."
 varyag_offer_lapsed_tt: "The offer has lapsed. The hull's status or the funds available have changed."
 varyag_buyback_tt: "China receives a §Y$0.20 billion§! refund and Turkey receives §Y$0.50 billion§! for the return tow. The §YVaryag§! returns to Mykolaiv, and China's opinion of us falls."
 varyag_joint_offer_tt: "If Ukraine agrees, we receive the unfinished carrier and a research bonus for its hull. We pay Ukraine §Y$2.50 billion§! and refund China §Y$0.20 billion§!."
 varyag_joint_deal_tt: "Turkey receives the unfinished carrier. China is reimbursed and its opinion of both governments falls."
 varyag_carrier_protests_tt: "Russia and current NATO members will object to our carrier program."
 CHI_varyag_hull_acquired_tt: "The unfinished §YVaryag§! has arrived in China."
 varyag_chinese_refit_tt: "The §YVaryag§! is available for the §Y$CHI_the_varyag_refit$§! focus once its other requirements are met."
 varyag_blueprints_tt: "The drawings provide a §G25%§! research bonus for the §Y1985 carrier hull§!."
 varyag_blueprints: "Varyag Design Documentation"
 varyag_hull_studies: "Varyag Hull Studies"
 varyag_missile_assistance: "Chinese Missile Assistance"
 varyag_joint_shipbuilding: "Turkish-Ukrainian Carrier Engineering"
 varyag_contract_cancelled: "Varyag Sale Canceled"
 varyag_carrier_concern: "Concern over the Varyag Refit"
 varyag.2.t: "The Varyag Is Held Up"
 varyag.2.d: "The unfinished Soviet carrier Varyag has left Mykolaiv under tow for a Macau company that says it plans to open a floating casino. Ankara has withheld clearance through the Turkish Straits, citing the risk of towing a ship of that size without power and questions about its status under the Montreux Convention."
 varyag.2.d_ukraine: "Turkey has stopped the Varyag's tow at the approaches to the Bosporus. Our naval commanders call the delay a sign from above and urge us to reverse the sale while the hull is still in the Black Sea. They want the engineers who built it to survey the ship at Mykolaiv and determine what it would take to finish it for our navy."
 varyag.2.a: "Review the available options"
 varyag.4.t: "Beijing Requests Passage"
 varyag.4.d: "Chinese negotiators are prepared to fund a controlled tow through the Bosporus and the Dardanelles. They have also offered a smaller payment with technical cooperation on mobile missiles."
 varyag.4.a: "Accept the full payment"
 varyag.4.b: "Accept payment and missile assistance"
 varyag.4.c: "Deny passage and drop the matter"
 varyag.5.t: "The Varyag Reaches China"
 varyag.5.d: "After a long voyage, the tugs have delivered the unfinished carrier. Our naval engineers can now compare the drawings with the hull and prepare a plan for its refit."
 varyag.5.a: "Send our engineers aboard"
 varyag.6.t: "Ankara Offers a Joint Refit"
 varyag.6.d: "Turkey proposes to reimburse the buyer and take the hull to Gölcük. The Black Sea Shipyard and Ukrainian design bureaus would supply engineering work and components while Turkish yards complete the carrier."
 varyag.6.a: "Accept the shipbuilding contract"
 varyag.6.b: "Stand by the existing sale"
 varyag.7.t: "The Varyag Passes the Bosporus"
 varyag.7.d: "With traffic halted and escort tugs in position, the Varyag has begun its passage through the Turkish Straits. The tow is bound for China under the original sale."
 varyag.7.a: "Let the tow proceed"
 varyag.8.t: "The Varyag Returns to Mykolaiv"
 varyag.8.d: "Kyiv has reimbursed the buyer and paid Ankara to arrange the return tow. The unfinished carrier is back at the Black Sea Shipyard."
 varyag.8.a: "Acknowledge the return"
 varyag.9.t: "The Varyag Enters Service"
 varyag.9.d: "The yard has finished the refit and the navy has accepted the carrier. Its crew can now begin deck trials and work up with the fleet."
 varyag.9.a: "Commission the ship"
 varyag.10.t: "The Carrier Will Not Arrive"
 varyag.10.d: "The attempt to bring the Varyag to China has ended. The engineers have secured a copy of the design documentation and can use it to study the carrier's layout."
 varyag.10.a: "Put the drawings to work"
 varyag.11.t: "The Varyag Offer Is Declined"
 varyag.11.d: "The other government has declined our terms. The unfinished carrier remains in the Black Sea while the passage dispute continues."
 varyag.11.a: "Await further developments"
 varyag.12.t: "The Varyag Is Bound for Gölcük"
 varyag.12.d: "Kyiv has accepted our offer. Turkish crews will prepare the hull for completion at Gölcük while Ukrainian yards deliver components and technical assistance."
 varyag.12.a: "Receive the unfinished carrier"
 varyag.13.t: "Ankara Rules Out Passage"
 varyag.13.d: "Talks between Ankara and Beijing have broken down. Turkey has denied passage through the straits and ruled out acquiring the carrier for itself. Its authorities are willing to arrange a tow back to Mykolaiv if we reimburse the buyer and cover the cost of the tow."
 varyag.13.a: "Consider bringing the hull home"
