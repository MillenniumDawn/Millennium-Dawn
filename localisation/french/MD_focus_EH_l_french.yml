 EH_any_controlled_state_1500_to_any_portal_TT: "Un État contrôlé par §Y[ROOT.GetNameWithFlag]§! ou un de ses alliés se trouve à au plus §Y1500 km.§! de tout §RPortail.§!"
 EH_any_controlled_state_1000_to_any_portal_TT: "Un État contrôlé par §Y[ROOT.GetNameWithFlag]§! ou un de ses alliés se trouve à au plus §Y1000 km.§! de tout §RPortail.§!"
 EH_drone_mission_unlock_TT: "Active la catégorie de décisions §YMission de drones§!, qui permettra de préparer et d'envoyer une mission de reconnaissance vers le §Rportail§! voisin. Le succès de l'opération apportera des informations supplémentaires sur la structure du §Rportail§!, rendant les troupes plus efficaces au combat."
 EH_research_sites_enabled_TT: "La distance pas trop grande jusqu'aux §Rportails§! a rendu possible l'installation de §Ysites de recherche§! à une distance à la fois sûre et assez efficace pour rassembler davantage d'informations sans trop de risque.\n\n10 §Ysites de recherche§! peuvent être maintenus en même temps, chacun fournissant un bonus de recherche pour les projets spéciaux, ainsi que les §Yscientifiques§! les plus qualifiés disponibles à l'embauche.\n\nLes §Ysites de recherche§! peuvent être attaqués par les forces §Rchimères§! : il vaut donc la peine de prendre le temps de les sécuriser correctement."
