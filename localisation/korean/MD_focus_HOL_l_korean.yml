 faction_manifest_hol_germanic_union: "고대 북방의 아들딸인 우리는 정신과 유산으로 맺어진, 국경을 넘어선 연합 게르만 형제단의 부활을 선언한다. 뿌리 없는 쇠퇴의 시대에, 우리는 언어와 문화, 그리고 조상들의 영원한 부름으로 묶인 동포 민족의 존엄을 되찾기 위해 일어선다. 우리는 분열과 부패, 강요된 제국의 나약함을 거부한다. 우리의 충성은 국가에 있지 않고 게르만 혼의 영속하는 본질에 있다. 피오르에서 숲까지, 저지대에서 산악까지, 우리는 한때 유럽의 운명을 빚었던 정신을 보존하고, 강화하며, 일깨우기 위해 하나의 살아 있는 의지로 뭉친다."
 HOL_restoring_royal_authority_nationalist: "왕권 복원 중"
 HOL_restoring_royal_authority_nationalist_desc: "군주제가 정당한 자리로 복귀하는 과정은 난관 없이 이루어지지 않았습니다. 전통적 제도가 통제권을 되찾으려 애쓰는 가운데 관료적 비효율과 정치적 불안정이 국가를 괴롭히고 있습니다. 그러나 시간과 노력이 더해지면 왕권은 다시 한번 네덜란드 국가에 단결과 힘을 되찾아줄 수 있을 것입니다."
 HOL_wic_war_preparations: "흐로트 데세인 부활"
 HOL_wic_war_preparations_desc: "아메리카와 아프리카에서 네덜란드의 패권을 확립하려 했던 17세기의 야심 찬 계획인 흐로트 데세인에서 영감을 받아, 우리는 서인도 회사의 유산을 복원하기 위한 전쟁을 준비해야 합니다. 병력을 동원하고 핵심 영토를 확보함으로써 우리는 네덜란드의 세계적 우위라는 비전을 실현하고 해양 강국으로서의 자리를 되찾을 수 있습니다."
 HOL_wic_war_preparations_tt: "§YWIC§!의 §Y흐로트 데세인 전략§!을 선택하면 잠금 해제됩니다"
 HOL_focus_can_only_be_completed_by_coalition_tt: "이 중점은 §Y$CHARACTER$§!이(가) 우리 연립 정부에 속해 있을 때에만 시작할 수 있습니다"
 HOL_oranje_nassau-mines: "오라녀-나사우 탄광 재가동"
 HOL_oranje_nassau-mines_desc: "헤이를런의 오라녀-나사우 탄광은 국가 에너지 전환의 일환으로 1974년에 폐쇄된 네덜란드 최후의 석탄 광산이었습니다. 이를 다시 열면 국내 철강 및 알루미늄 원료 공급이 복원되어 수입 의존도가 줄어들지만, 그 대가로 탄소 노출이 증가합니다."
 HOL_military.114.t: "네덜란드, F-35 프로그램 참여"
 HOL_military.114.d: "네덜란드는 합동 타격 전투기 프로그램에 공식적으로 참여하기로 하고 F-35 라이트닝 II를 차세대 다목적 전투기로 도입합니다. 이는 대서양 횡단 방위 유대를 심화하고 NATO 상호 운용성을 강화합니다."
 HOL_military.114.a: "프로그램에 반가운 동반자다."
 HOL_military.115.t: "네덜란드 F-35 조달 진행 중"
 HOL_military.115.d: "네덜란드는 F-35 라이트닝 II의 조달 협상을 시작했습니다. 최종 인도 일정은 프로그램의 개발 일정에 달려 있지만, 이 약속은 네덜란드 공군 현대화의 중요한 진전입니다."
 HOL_military.115.a: "항공기가 준비되면 추진할 것이다."
 BEL_referendum_mission: "벨기에 국민투표"
 BEL_referendum_mission_desc: "벨기에가 나라의 미래를 두고 국민투표를 실시하기로 동의했습니다. 그 결과에 따라 벨기에가 통일 국가로 남을지, 네덜란드에 흡수될지가 결정됩니다."
