 SAU_events.316.b: "해군: 외양 해군의 야망"
 SAU_events.316.c: "해군: 연안 방어"
 SAU_events.316.desc: "사우디 왕립 해군은 어떤 임무를 중심으로 건설되어야 합니까? 각각의 길은 지속적인 맞교환이며, 한 방향에서는 우리를 강하게 하고 다른 방향에서는 약하게 합니다.\n\n§Y선택지에 마우스를 올리면 그것이 무엇을 부여하고 무엇을 요구하는지 정확히 볼 수 있습니다.§!"
