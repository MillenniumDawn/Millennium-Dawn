 gulf_exploitation: "이주민 착취"
 gulf_exploitation_desc: "우리는 이민자 중 일부를 추방하기로 결정했습니다. 남은 사람들 중 일할 수 있는 사람들은 훨씬 더 많이 일하고 훨씬 더 적은 돈을 받게 될 것입니다."
