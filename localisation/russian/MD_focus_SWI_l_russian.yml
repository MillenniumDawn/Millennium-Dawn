 SWI_mowag_duro_tire_inflation: "Централизованная система накачивания шин"
 SWI_mowag_duro_gmtf: "Модульная система GMTF"
 SWI_mowag_yak_armoured: "Бронированный Як DURO"
 SWI_mowag_duro_durability: "Программа обеспечения долговечности DURO"
 SWI_mowag_duro_production_scale: "Масштабы производства DURO"
 SWI_mowag_duro_fleet_logistics: "DURO Fleet Logistics"
 SWI_mowag_duro_support_network: "Сеть поддержки DURO"
 SWI_ruag_cargo_munition: "Грузовые боеприпасы"
 SWI_ruag_fire_control: "Система управления пожаром"
 SWI_ruag_large_calibre_line: "Линия крупнокалиберных винтовок"
 SWI_ruag_ammunition_plant: "Завод по производству боеприпасов"
 SWI_ruag_land_systems: "Отдел наземных систем"
 SWI_ruag_sidepro_ke: "SidePRO-KE/IED"
 SWI_ruag_sidepro_lasso: "SidePRO-LASSO"
 SWI_ruag_sidepro_atr: "SidePRO-ATR"
 SWI_ruag_drive_systems: "Приводные системы"
 SWI_ruag_mine_protection: "Комплект противоминной защиты"
 SWI_ruag_heavy_weapons_mro: "Техническое обслуживание и ремонт тяжелого вооружения"
 SWI_ruag_integration_centre: "Интеграционный центр"
 SWI_the_bank_of_the_world: "Банк мира"
 SWI_the_bank_of_the_world_desc: "Швейцарская банковская тайна превратила Цюрих и Женеву в хранилища мирового значения. Необходимо формализовать эту роль и позволить иностранному капиталу обосноваться здесь, а не в Лондоне или Франкфурте."
 SWI_strengthening_swiss_cooperation: "Укрепление швейцарского сотрудничества"
 SWI_strengthening_swiss_cooperation_desc: "Совместные учения, общая доктрина и стандартизированное оборудование связывают швейцарское ополчение с его новыми партнерами по Альянсу."
 SWI_bastion_of_democracy: "Оплот демократии"
 SWI_bastion_of_democracy_desc: "Нейтралитет никогда не означал безразличия. Швейцария является наглядным примером самоуправления и ясно об этом заявляет."
 SWI_eu_investments: "Европейские инвестиции"
 SWI_eu_investments_desc: "Швейцарский капитал поступает на Единый рынок. Наши банки обеспечивают рост европейского экономики, а европейский рост обеспечивает рост наших банков."
 SWI_on_our_own_path: "На собственном пути"
 SWI_on_our_own_path_desc: "ЕС — лишь один из многих клиентов. Швейцарские финансовые учреждения обслуживают всех, кто платит, и подчиняются исключительно Берну."
 SWI_staple_of_democracy: "Основа демократии"
 SWI_staple_of_democracy_desc: "Западные столицы обращаются к нам за банковскими услугами, потому что наши институты предсказуемы. Эта предсказуемость сама по себе является преимуществом."
 SWI_eu_candidacy: "Кандидатура на пост президента Европейского союза"
 SWI_eu_candidacy_desc: "Берн подает официальное заявление в Брюссель. Присоединение положит конец двусторонним разрозненным отношениям и привяжет Швейцарию к Союзу, к которому она стремилась десятилетиями."
 SWI_eu_candidacy_tt: "Швейцария становится кандидатом на получение статуса §YEU§!"
 SWI_friend_for_all: "Друг всем"
 SWI_friend_for_all_desc: "Нет блока, нет альянса, нет постоянных друзей. Швейцария предлагает свои добрые услуги каждой стране и пользуется доверием всех."
 SWI_trust_in_the_eu: "Доверие к ЕС"
 SWI_trust_in_the_eu_desc: "Выдвижение кандидатуры не означает членство. Углубление сотрудничества с государствами-членами доказывает приверженность Швейцарии принципам вступления в ЕС."
 SWI_trust_in_the_eu_tt: "Каждый §Yгосударство-член ЕС§! выигрыши §G+30§! мнение Швейцарии"
 SWI_swiss_independence: "Швейцарская независимость"
 SWI_swiss_independence_desc: "Иностранные лобби чувствуют себя в Берне вполне комфортно. Их влияние ослабевает, а внутренние институты вновь утверждают свой контроль."
 SWI_mutual_defence_training: "Тренировка по взаимной обороне"
 SWI_mutual_defence_training_desc: "Альпийские школы военной подготовки открыты для европейских партнеров. Их солдаты изучают наши горы, а наши ополченцы учатся сражаться бок о бок с ними."
 SWI_invest_in_eu: "Инвестируйте в ЕС"
 SWI_invest_in_eu_desc: "Швейцарские пенсионные фонды и банки напрямую инвестируют в европейскую промышленность, превращая финансовый вес в политическое влияние."
 SWI_national_investments: "Национальные инвестиции"
 SWI_national_investments_desc: "Капитал, который в противном случае ушел бы за границу, направляется внутрь страны, в швейцарскую инфраструктуру, швейцарскую промышленность и швейцарские исследования."
 SWI_defence_training_in_the_alps: "Оборонительная подготовка в Альпах"
 SWI_defence_training_in_the_alps_desc: "Каждый новобранец изучает местность, которую ему предстоит защищать. Курсы повышения квалификации проводят тренировки ополченцев в долинах, которые им поручено удерживать."
 SWI_european_defence: "Европейская оборона"
 SWI_european_defence_desc: "Формируется единая европейская система обороны, в центре которой, а не на периферии, находятся швейцарские инженерные разработки и швейцарский нейтралитет."
 SWI_swiss_banking: "Швейцарский банкинг"
 SWI_swiss_banking_desc: "Наши банки переросли масштабы страны, в честь которой они названы. Необходимо консолидировать этот сектор и позволить ему работать в том масштабе, которого он заслуживает."
 SWI_swiss_banking_two: "Мировое хранилище"
 SWI_swiss_banking_two_desc: "Вклады поступают со всех континентов. Швейцария перестаёт конкурировать с крупными финансовыми центрами и становится местом, где они хранят свои резервы."
 SWI_last_man_standing: "Последний выживший"
 SWI_last_man_standing_desc: "Доктрина исходит из худшего сценария: все дороги перекрыты, все союзники потеряны. Ополчение обучено продолжать борьбу, несмотря ни на что."
 SWI_swiss_neutrality: "Швейцарский нейтралитет"
 SWI_protect_alps: "Защитник Альп"
 SWI_protect_alps_desc: "Альпы – это не просто пейзаж. Федеральная защита высоких долин сохраняет ландшафт, который на протяжении шести веков сдерживал вторжения захватчиков."
 SWI_Expanding_nuclear_research_desc: "Швейцарские реакторы выходят за рамки простого производства электроэнергии. Исследовательские программы федеральных институтов направлены на изучение топливных циклов и материаловедения."
 swiss_political_system4: "Политическая система Швейцарии"
 swiss_political_system4_desc: "Власть возвращается к кантонам. Берн координирует, а не командует, и местные власти решают то, что могут решать местные власти. Принятие решений на федеральном уровне замедляется, но строительство и администрация подотчетны людям, которые живут с последствиями."
 SWI_milita: "Вооруженное ополчение"
 SWI_milita_desc: "Гражданская армия политизирована и вооружена. Служба становится не только школой стрельбы, но и школой государства."
 SWI_multilingual_workers: "Многоязычные работники"
 SWI_multilingual_workers_desc: "Рабочие из Германии, Франции, Италии и Республиканской Республики объединяются, преодолевая языковые барьеры, которые долгое время разделяли швейцарское рабочее движение."
 SWI_propaganda_idea: "Государственная пропаганда"
 SWI_propaganda_idea_desc: "Федеральная пресс-служба перестает информировать и начинает убеждать. Радио, печатные СМИ и школьные программы передают одно и то же сообщение."
 SWI_true_neutral: "Истинный нейтралитет"
 SWI_true_neutral_desc: "§YОсобые правила:§!\n\n§YМы§! §RНЕ МОЖЕМ§! §Yприсоединиться к фракции!§!\n--------------\nНе вооруженный нейтралитет, не доброжелательный нейтралитет. Швейцария не занимает чью-либо сторону, не размещает базу и не подписывает никаких гарантий.\n--------------\nЭтот национальный дух может быть §RУдален§! посредством решения §HAотказаться от истинного нейтралитета§!."
 SWI_sig_sauer_ag: "SIG Sauer AG"
 SWI_sig_sauer_ag_desc: "Завод в Нойхаузене вооружает милицию. В каждом швейцарском доме, где есть служебная винтовка, хранится часть продукции SIG."
 SWI_rheinmetall_cooperation: "Рейнметалл Кооператив"
 SWI_rheinmetall_cooperation_desc: "Компания Rheinmetall Air Defence из Цюриха, наследница Oerlikon, связывает швейцарские разработки в области артиллерии и радаров с крупнейшим оружейным заводом Германии."
 SWI_thales_cooperation: "Сотрудничество Thales"
 SWI_thales_cooperation_desc: "Компания Thales Suisse поставляет радары, оптико-электронные системы и системы управления, которые превращают ополчение в сетевую силу."
 SWI_local_production1: "Местное производство"
 SWI_local_production1_desc: "Оружие, приобретенное за границей, может быть подвергнуто эмбарго. Оружие, произведенное в Туне, — нет. Основные поставки осуществляются внутри страны."
 SWI_pilatus_aircraft_manufacturer_trainer_header: "Учебный самолет"
 SWI_pilatus_aircraft_manufacturer_attack_header: "Легкая атака"
 SWI_pilatus_aircraft_manufacturer_utility_header: "Коммунальные услуги и транспорт"
 switzerland.18.t: "Вопрос о НАТО"
 switzerland.18.desc: "Протоколы о вступлении лежат на столе Федерального совета. Подписание их положит конец вооруженному нейтралитету, который пережил все империи Европы."
 switzerland.18.a: "Подпишите протоколы."
 switzerland.18.b: "Нейтралитет не подлежит обсуждению."
 switzerland.22.t: "Наше место в Европе"
 switzerland.22.desc: "Брюссель предлагает более широкий доступ к торговле на условиях, которые бы привязали швейцарское законодательство к праву ЕС. Кантоны разделены."
 switzerland.22.a: "Укрепить связи с ЕС."
 switzerland.22.b: "Торгуйте со всеми на равных условиях."
 switzerland.23.t: "Швейцарское предложение"
 switzerland.23.desc: "Берн предлагает княжеству присоединиться к Альпийской федерации. Лихтенштейн уже использует франк и имеет отношение к нашему таможенному союзу. Остается только корона."
 switzerland.23.a: "Примите профсоюз."
 switzerland.23.b: "Княжество стоит особняком."
 switzerland.24.t: "Лихтенштейн получает"
 switzerland.24.desc: "Вадуц согласился. Княжество вступает в Федерацию в качестве полноправного члена, и последний независимый анклав Альп прекращает свое существование."
 switzerland.24.a: "Альпы целы."
 switzerland.25.t: "Лихтенштейн отказывается"
 switzerland.25.desc: "Принц отказался. Вадуц сохранит свою корону, свой парламент и свою независимость, какой бы незначительной она ни была."
 switzerland.25.a: "Пусть будет так."
 switzerland.26.t: "Альпийский ультиматум"
 switzerland.26.desc: "Берн выдвинул ультиматум: княжество должно войти в Альпийскую федерацию, по возможности по соглашению сторон и силой, если это необходимо. Швейцарские войска сосредоточиваются вдоль границы, которая никогда не нуждалась в обороне. Теперь Ландтаг должен решить, подчинится ли Лихтенштейн своему соседу или бросит ему вызов."
 switzerland.26.a: "Мы не можем противостоять Швейцарии."
 switzerland.26.b: "Княжество не преклонит колени!"
 SWI_un_member_tt: "Швейцария должна быть §Yчлен Организации Объединенных Наций§! (присоединиться через §GПрисоединяйтесь к Организации Объединенных Наций§! решение)"
 SWI_bank_established_tt: "Швейцария должна была создать §Yкрупный финансовый центр§! через §GБанк Запада§!, §GБанк мира§!, §GЕвропейские инвестиции§! или §GНа собственном пути§!"
 SWI_world_bank_established_tt: "Швейцария, должно быть, создала §Yмировой финансовый центр§! через §GБанк мира§!, §GЕвропейские инвестиции§! или §GНа собственном пути§!"
 SWI_fiscal_equalization_council: "Фонд фискального выравнивания"
 SWI_fiscal_equalization_council_desc: "Реформу проводит Совет штатов, а новый федеральный фонд перераспределяет богатства от самых богатых кантонов к самым бедным, обеспечивая равномерное развитие и высокий уровень жизни по всей Федерации, сохраняя при этом региональную автономию."
 SWI_idea_mass_produced_firearms: "Огнестрельное оружие массового производства"
 SWI_idea_mass_produced_firearms_desc: "Стандартизированные производственные линии и взаимозаменяемые детали позволили снизить стоимость стрелкового оружия, одновременно повысив его надежность и оборонительные характеристики."
 SWI_idea_gunship_development: "Разработка боевого вертолета"
 SWI_idea_gunship_development_desc: "Тяжеловооруженные боевые вертолеты обеспечивают непосредственную авиационную поддержку и разведку, интегрируя воздушную мобильность в оборонительную доктрину армии."
 switzerland.27.t: "Запрос на закупку истребителя «Еврофайтер»"
 switzerland.27.d: "Швейцария обратилась к нашей оборонной промышленности с просьбой о закупке истребителей Eurofighter Typhoon."
 switzerland.27.a: "Одобрить продажу."
 switzerland.27.b: "Спад, наши производственные линии загружены."
 switzerland.28.t: "Запрос на покупку истребителя Rafale"
 switzerland.28.d: "Швейцария обратилась к нашей оборонной промышленности с просьбой о закупке истребителей Rafale."
 switzerland.28.a: "Одобрить продажу."
 switzerland.28.b: "Спад, наши производственные линии загружены."
 switzerland.29.t: "Запрос на закупку самолета C-130J"
 switzerland.29.d: "Швейцария обратилась к оборонной промышленности с просьбой о закупке транспортных самолетов C-130J Super Hercules."
 switzerland.29.a: "Одобрить продажу."
 switzerland.29.b: "Спад, наши производственные линии загружены."
 switzerland.30.t: "Покупка одобрена."
 switzerland.30.d: "Наша заявка на покупку одобрена. Самолеты находятся в процессе поставки."
 switzerland.30.a: "Отличный."
 switzerland.31.t: "От покупки отказано"
 switzerland.31.d: "Наш запрос на покупку отклонен. Поставка самолёта не состоится."
 switzerland.31.a: "Это стало препятствием для программы."
 SWI_heer_modifier: "Швайцер Хеер"
 SWI_heer_modifier_desc: "Швейцарская армия — это ополчение, сформированное на основе всеобщей воинской повинности, где гражданин хранит своё ружьё дома, а горы рассматриваются как первая линия обороны. Она не имеет постоянной полевой армии значительного масштаба, полагаясь вместо этого на быструю мобилизацию, подготовленные подрывные работы и укреплённую альпийскую местность."
 SWI_schweizerische_luftwaffe_modifier: "Швейцарские ВВС"
 SWI_schweizerische_luftwaffe_modifier_desc: "Швейцарские ВВС существуют для того, чтобы контролировать воздушное пространство над территорией Конфедерации и ничего за её пределами. Их самолёты базируются на укреплённых альпийских базах и в ангарах-пещерах, выполняя задачи перехвата и воздушного патрулирования, а не демонстрации силы."
 SWI_military_industry_modifier: "Швейцарская военная промышленность"
 SWI_military_industry_modifier_desc: "Швейцарское производство вооружений невелико, отличается высокой точностью и ревностной независимостью. Такие фирмы, как RUAG, MOWAG и SIG Sauer, поставляют продукцию для ополчения и экспортируют ее за рубеж, поддерживая оборонно-промышленную базу, значительно превосходящую по размерам масштабы страны."
 SWI_politica_estera_svizzera_modifier: "Швейцарская внешняя политика"
 SWI_politica_estera_svizzera_modifier_desc: "Зарубежная политика Берна, включающая в себя множество решений — от вооруженного нейтралитета и миротворческих операций ООН до банковских связей и сближения с Европой или НАТО, — каждый шаг в этой внешнеполитической программе формирует положение Конфедерации, ее финансы и боеготовность ее ополчения."
 SWI_alps_treaty: "Альпийский договор"
 SWI_alps_treaty_trade: "Условия торговли по Альпийскому договору"
 SWI_geneva_climate_accord: "Женевское климатическое соглашение"