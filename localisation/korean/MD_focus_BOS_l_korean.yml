 BOS_trb_mio_trait_vihor_cost_efficient: "비용 효율적 생산"
 BOS_trb_mio_trait_vihor_prototyping: "신속 시제품 제작"
 BOS_trb_mio_trait_vihor_partner_expo: "파트너 박람회 계약"
 BOS_bnttmih_header_towed: "견인포"
 BOS_bnttmih_header_rockets: "로켓 및 자주포"
 BOS_bnttmih_header_antitank: "대전차포"
 BOS_bnttmih_mio_trait_bratstvo_foundry: "브라트스트보 전통"
 BOS_bnttmih_mio_trait_m56_howitzer: "M-56 곡사포"
 BOS_bnttmih_mio_trait_mortar_foundry: "박격포 주조소"
