 EU_USoE_category: "Соединённые Штаты Европы"
 EU_USoE_category_desc: "Государства-члены Европейского союза объединились в единое сверхгосударство."
 EU_USoE_capital_of_europe: "Европейская столица"
 EU_USoE_capital_of_europe_desc: "Брюссель считался фактической столицей Европейского союза, имея долгую историю размещения ряда основных институтов ЕС в своём Европейском квартале. У ЕС не было официальной столицы, но в Брюсселе находились официальные резиденции Европейской комиссии, Совета Европейского союза и Европейского совета, а также место (официально второе, но фактически самое важное) Европейского парламента. Давайте сделаем Брюссель столицей нового государства."
 EU_USoE_westernize_decision: "Вестернизация [FROM.GetName]"
 EU_USoE_westernize_decision_desc: "Вестернизировать [FROM.GetName] дипломатией или силой — зависит от [FROM.GetName]."
 EU_USoE_create_eurosphere_decision: "Создать Евросферу"
 EU_USoE_create_eurosphere_decision_desc: "[ROOT.GetNameWithFlag] распространит своё влияние, чтобы создать Евросферу."
 EU_environmental_imperialism_category: "Экологический империализм"
 EU_environmental_imperialism_category_desc: "Европа зелёная, но мир всё ещё тёмный и серый. Европе необходимо распространить свою политику и технологии по всему миру и дать отпор ископаемым энергетическим империям, которые разрушают планету."
 EU_USoE_environmental_imperialism_decision: "Требование экологических реформ"
 EU_USoE_environmental_imperialism_decision_desc: "Мы должны спасти планету. Если §Y[FROM.GetNameWithFlag]§! не проведёт необходимые §GЭкологические реформы§! самостоятельно, мы должны заставить их сделать это. Они должны иметь по меньшей мере один §YБиотопливный завод§! на каждый регион, которым они владеют. Если §Y[FROM.GetNameWithFlag]§! не выполнит наши требования в течение месяца, мы наложим на них §Rэкологические санкции§!."
 EU_USoE_environmental_imperialism_mission: "Экологические реформы"
 EU_USoE_environmental_imperialism_mission_desc: "§YЕвропа§! требует от нас §GЭкологических реформ§! для спасения планеты. Если в течение месяца мы не построим или не реконструируем хотя бы один §YБиотопливный завод§! для каждого региона, которым мы владеем, они наложат на нас §Rэкологические санкции§!."
 EU_USoE_environmental_imperialism_restructure_industry_decision: "Переход на зелёную энергетику"
 EU_USoE_environmental_imperialism_restructure_industry_decision_desc: "Для выполнения требований европейской §GЭкологической реформы§! нам необходимо перестроить часть нашей §YГражданской промышленности§! в производство возобновляемой энергии (§YБиотопливный завод§!)."
 EU_USoE_break_environmental_sanctions_decision: "Прорвать экологические санкции"
 EU_USoE_break_environmental_sanctions_decision_desc: "Европа наложила на нас экологические санкции. Мы должны прорвать их всеми средствами — политическими и военными. Но это даст [FROM.GetNameWithFlag] цель войны против нас. Поэтому нам нужно заключить союз с другими странами, против которых [FROM.GetNameWithFlag] ввела санкции."
