 tur_ynzma_leg3: "YNZMA Leg 3 Development"
 tur_ynzma_leg3_desc: "\n\n\n\n\n\n£TUR_ynzma_leg3_for_tooltip\n\n\n\n\n\n\n\n\n§WDevelopment of a new §Yarmoured personnel carrier§! for the Turkish mechanised infantry under the third leg of the §YYNZMA§! programme, the stage-by-stage effort to replace the ageing §YACV-15§! fleet. The winning design will be ready in §Y120 days§!§W.\n§W--------------§!\n§LFNSS§! §YPars Alpha§!: wheeled carrier with §Ggreat agility§! and §Gproven mobility§!, but §Rmoderate price§!.\n§LOtokar§! §YArma 2§!: 8x8 wheeled carrier with §Ghigh payload§! and §Gstrong mine protection§!, but §Rheavier§! and §Rthe highest price§!.\n§LBMC§! §YAltuğ§!: compact wheeled carrier with §Glow cost§! and §Gfast development§!, but §Rless proven§!.\n§W--------------§!\n§WMain features:\n- §GChoice of armament§! between a §Y12.7mm§! gun and a §Y25mm§! cannon.\n- §GChoice of turret§! between a §Ymanned§! and an §Yunmanned§! turret.\n- §GChoice of engine§! between §Ydiesel§! and §Yhybrid§!.\n§W--------------§!\n§RHigher options increase the cost of the programme.§!"
 tur_ynzma_leg3.1.name: "YNZMA Leg 3: Choose a Vehicle"
 tur_ynzma_leg3.1.desc: "§WThe §YYNZMA§! programme is replacing the §YACV-15§! family one stage at a time, and the third leg covers the troop carrier that will move the infantry itself. Three Turkish manufacturers have submitted proposals, each with the same §LAselsan§! weapon station and fire control on offer.\n\n§LFNSS§! §YPars Alpha§!: carrier built on the §YPars§! family, with §Ggreat agility§! and §Gproven mobility§!, but §Rmoderate price§!.\n\n§LOtokar§! §YArma 2§!: 8x8 carrier with §Ghigh payload§!, §Gstrong mine protection§! and §Gplenty of room to grow§!, but §Rheavier§! and §Rthe most expensive§!.\n\n§LBMC§! §YAltuğ§!: compact carrier with §Glow cost§! and §Gfast development§!, but §Rless proven§! than its rivals.\n\nThe chosen design will take §Y120 days§! to complete.§!"
 tur_ynzma_leg3.1.a: "§LFNSS§! §YPars Alpha§! §G(Agile and proven)§! §R(Moderate price)§!"
 tur_ynzma_leg3.1.b: "§LOtokar§! §YArma 2§! §G(Payload and protection)§! §R(Heavier and costlier)§!"
 tur_ynzma_leg3.1.c: "§LBMC§! §YAltuğ§! §G(Cheap and fast)§! §R(Less proven)§!"
 tur_ynzma_leg3.2.name: "YNZMA Leg 3: Gun"
 tur_ynzma_leg3.2.desc: "§WThe old carrier fought with a simple machine gun, and the army wants more fire support for the infantry it carries. §LAselsan§!, our leading maker of weapon stations and turrets, has offered two options, which the manufacturer will fit to the hull.\n\nA §Y12.7mm§! gun §Gis light§!, §Gproven§! and §Ginexpensive§!, but §Rgives only limited firepower§!. A §Y25mm§! cannon §Gis far more lethal against light armour and fortifications§!, but §Rcosts more§! and §Rcarries more weight§!.§!"
 tur_ynzma_leg3.2.a: "§Y12.7mm§! gun §G(Light and cheap)§! §R(Limited firepower)§!"
 tur_ynzma_leg3.2.b: "§Y25mm§! cannon §G(Lethal)§! §R(Costly and heavy)§!"
 tur_ynzma_leg3.3.name: "YNZMA Leg 3: Turret"
 tur_ynzma_leg3.3.desc: "§WA carrier's turret decides how well its gunner survives and how much room is left inside the hull. §LAselsan§! has offered modern sights and fire control for either layout.\n\nA §Ymanned turret§! §Gis proven§! and §Gcheap§!, but §Rtakes up space in the hull§! and §Rleaves the gunner exposed to turret damage§!. An §Yunmanned turret§! §Gkeeps the gunner protected in the hull§! and §Gfrees up internal space for troops§!, but §Rcosts more§! and §Ris complex to integrate§!.§!"
 tur_ynzma_leg3.3.a: "§YManned turret§! §G(Proven and cheap)§! §R(Gunner exposed)§!"
 tur_ynzma_leg3.3.b: "§YUnmanned turret§! §G(Protected and spacious)§! §R(Costly)§!"
 tur_ynzma_leg3.4.name: "YNZMA Leg 3: Engine"
 tur_ynzma_leg3.4.desc: "§WThe armament, armour and electronics of the new carrier add weight to the hull, and the engine must carry it across rough terrain with a full squad aboard. The manufacturer has offered two powertrains.\n\nA §Ydiesel engine§! §Gis proven§!, §Gcheap§! and §Gkeeps the logistics chain unchanged§!, but §Ruses more fuel§! and §Ris louder§!. A §Yhybrid engine§! §Gimproves efficiency§! and §Gallows quiet running§!, but §Rcosts more§! and §Ris more complex to maintain§!.§!"
 tur_ynzma_leg3.4.a: "§YDiesel engine§! §G(Proven and cheap)§! §R(Louder)§!"
 tur_ynzma_leg3.4.b: "§YHybrid engine§! §G(Efficient and quiet)§! §R(Costly)§!"
 tur_ynzma_leg3.5.name: "YNZMA Leg 3: Design Delivered"
 tur_ynzma_leg3.5.desc: "§WAfter 120 days of work, the manufacturer and §LAselsan§! have delivered the final design of the §YYNZMA§! armoured personnel carrier. The first vehicles are ready to join the mechanised infantry units of the Land Forces.§!"
 tur_ynzma_leg3.5.a: "Excellent."
 tur_ynzma3_requires_ynzma2: "Complete the §YYNZMA IFV Leg 2§! Development"


 tur_ynzma_leg4: "YNZMA Leg 4 Development"
 tur_ynzma_leg4_desc: "\n\n\n\n\n\n£TUR_ynzma_leg4_for_tooltip\n\n\n\n\n\n\n\n\n§WDevelopment of a new §Yinfantry fighting vehicle§! for the Turkish mechanised infantry under the fourth leg of the §YYNZMA§! programme, the stage-by-stage effort to replace the ageing §YACV-15§! fleet. The winning design will be ready in §Y150 days§!§W.\n§W--------------§!\n§LFNSS§! §YKaplan IFV§!: tracked infantry fighting vehicle with §Ggreat agility§! and §Gproven mobility§!, but §Rthe higher price§!.\n§LOtokar§! §YTulpar IFV§!: tracked infantry fighting vehicle with §Gstrong protection§! and §Gplenty of room to grow§!, but §Rheavier§!.\n§W--------------§!\n§WMain features:\n- §GChoice of armament§! between a §Y35mm§! and a §Y40mm§! cannon, with an optional turret-mounted §YATGM§!.\n- §GChoice of turret§! between a §Ymanned§! and an §Yunmanned§! turret.\n- §GChoice of armor§! between §Ystandard§! and §Yheavy§! armor.\n§W--------------§!\n§RHigher options increase the cost of the programme.§!"
 tur_ynzma_leg4.1.name: "YNZMA Leg 4: Choose a Vehicle"
 tur_ynzma_leg4.1.desc: "§WThe §YYNZMA§! programme is replacing the §YACV-15§! family one stage at a time, and the fourth leg covers the infantry fighting vehicle that will fight alongside our tanks. Two Turkish manufacturers have submitted proposals, each with §LAselsan§! turret and fire control on offer.\n\n§LFNSS§! §YKaplan IFV§!: infantry fighting vehicle built on the §YKaplan§! family, with §Ggreat agility§! and §Gproven mobility§!, but §Rthe higher price§!.\n\n§LOtokar§! §YTulpar IFV§!: infantry fighting vehicle built on the §YTulpar§! family, with §Gstrong protection§! and §Gplenty of room to grow§!, but §Rheavier§! and §Rof moderate cost§!.\n\nThe chosen design will take §Y150 days§! to complete.§!"
 tur_ynzma_leg4.1.a: "§LFNSS§! §YKaplan IFV§! §G(Agile and proven)§! §R(Higher price)§!"
 tur_ynzma_leg4.1.b: "§LOtokar§! §YTulpar IFV§! §G(Protected and spacious)§! §R(Heavier)§!"
 tur_ynzma_leg4.2.name: "YNZMA Leg 4: Gun"
 tur_ynzma_leg4.2.desc: "§WThe gun is what lets the IFV support its infantry and threaten enemy vehicles. §LAselsan§!, our leading maker of turrets and fire control, has offered stabilised sights for either calibre, and the manufacturer will fit the gun to the hull.\n\nA §Y35mm§! cannon §Gis proven§! and §Grelatively inexpensive§!, but §Rhas less reach against armoured targets§!. A §Y40mm§! cannon §Ggives greater range and firepower against armour§!, but §Rcosts more§! and §Rcarries more weight§!.§!"
 tur_ynzma_leg4.2.a: "§Y35mm§! gun §G(Proven and cheap)§! §R(Less reach)§!"
 tur_ynzma_leg4.2.b: "§Y40mm§! gun §G(Range and firepower)§! §R(Costly and heavy)§!"
 tur_ynzma_leg4.3.name: "YNZMA Leg 4: Anti-Tank Missiles"
 tur_ynzma_leg4.3.desc: "§WThe cannon alone cannot reach the enemy tanks that sit beyond its range. §LAselsan§! has proposed fitting an anti-tank guided missile launcher to the turret, linked to the same fire control as the cannon.\n\nA §Yturret-mounted ATGM§! §Gallows the vehicle to engage tanks at long range§! and §Gadds flexibility on the battlefield§!, but §Radds cost§! and §Rtakes up turret space§!. Without it, the vehicle stays §Gsimpler§! and §Gcheaper§!, but §Rdepends on tanks and other units to deal with enemy armour§!.§!"
 tur_ynzma_leg4.3.a: "§YNo ATGM§! §G(Simple and cheap)§! §R(No long-range answer)§!"
 tur_ynzma_leg4.3.b: "§YTurret-mounted ATGM§! §G(Long-range anti-armour)§! §R(Costly)§!"
 tur_ynzma_leg4.4.name: "YNZMA Leg 4: Turret"
 tur_ynzma_leg4.4.desc: "§WThe turret decides how well the gunner survives and how much room is left in the hull for the embarked squad. §LAselsan§! has offered modern sights and fire control for either layout.\n\nA §Ymanned turret§! §Gis proven§! and §Gcheap§!, but §Rtakes up space in the hull§! and §Rleaves the gunner exposed to turret damage§!. An §Yunmanned turret§! §Gkeeps the entire crew protected in the hull§! and §Gfrees up internal space§!, but §Rcosts more§! and §Ris complex to integrate§!.§!"
 tur_ynzma_leg4.4.a: "§YManned turret§! §G(Proven and cheap)§! §R(Crew exposed)§!"
 tur_ynzma_leg4.4.b: "§YUnmanned turret§! §G(Protected and spacious)§! §R(Costly)§!"
 tur_ynzma_leg4.5.name: "YNZMA Leg 4: Armor"
 tur_ynzma_leg4.5.desc: "§WAn IFV must survive long enough to put its infantry on the objective, and the army must decide how far to trade weight for protection. Both manufacturers can fit either package.\n\n§YStandard armor§! §Gkeeps the vehicle light, mobile and cheap§!, but §Rleaves the crew and embarked infantry vulnerable to heavy weapons§!. §YHeavy armor§! §Ggives far better protection§! and §Gimproves survivability on the modern battlefield§!, but §Rcosts more§! and §Radds weight that slows the vehicle§!.§!"
 tur_ynzma_leg4.5.a: "§YStandard armor§! §G(Light and cheap)§! §R(Vulnerable)§!"
 tur_ynzma_leg4.5.b: "§YHeavy armor§! §G(Protected)§! §R(Costly and heavy)§!"
 tur_ynzma_leg4.6.name: "YNZMA Leg 4: Design Delivered"
 tur_ynzma_leg4.6.desc: "§WAfter 150 days of work, the manufacturer and §LAselsan§! have delivered the final design of the §YYNZMA§! infantry fighting vehicle. The first vehicles are ready to join the mechanised infantry units of the Land Forces.§!"
 tur_ynzma_leg4.6.a: "Excellent."
 tur_ynzma4_requires_ynzma3: "Complete the §YYNZMA IFV Leg 3§! Development"

 tur_ynzma_leg5: "YNZMA Leg 5 Development"
 tur_ynzma_leg5_desc: "\n\n\n\n\n\n£TUR_ynzma_leg5_for_tooltip\n\n\n\n\n\n\n\n\n§WDevelopment of a new §Ylight tank§! for the Turkish Land Forces under the §YYNZMA§! programme, with candidates from §LFNSS§! and §LOtokar§!. The winning design will be ready in §Y120 days§!§W.\n§W--------------§!\n§LFNSS§! §YKaplan Light Tank§!: light tank with §Ggreat agility§! and §Gproven mobility§!, but §Rthe higher price§!.\n§LOtokar§! §YTulpar Light Tank§!: light tank with §Gstrong protection§! and §Gplenty of room to grow§!, but §Rheavier§!.\n§W--------------§!\n§WMain features:\n- §GChoice of armament§! between a §Y105mm§! and a §Y120mm§! cannon.\n- §GChoice of turret§! between a §Ymanned§! and an §Yunmanned§! turret.\n- §GChoice of armor§! between §Ystandard§! and §Yheavy§! armor.\n§W--------------§!\n§RHigher options increase the cost of the programme.§!"
 tur_ynzma_leg5.1.name: "YNZMA Leg 5: Choose a Vehicle"
 tur_ynzma_leg5.1.desc: "§WThe army wants a light tank that can keep pace with the mechanised infantry and still hit hard. Two Turkish manufacturers have submitted proposals.\n\n§LFNSS§! §YKaplan Light Tank§!: light tank built on the §YKaplan§! family, with §Ggreat agility§! and §Gproven mobility§!, but §Rthe higher price§!.\n\n§LOtokar§! §YTulpar Light Tank§!: light tank built on the §YTulpar§! family, with §Gstrong protection§! and §Gplenty of room to grow§!, but §Rheavier§! and §Rof moderate cost§!.\n\nThe chosen design will take §Y120 days§! to complete.§!"
 tur_ynzma_leg5.1.a: "FNSS Kaplan Light Tank"
 tur_ynzma_leg5.1.b: "Otokar Tulpar Light Tank"
 tur_ynzma_leg5.2.name: "YNZMA Leg 5: Cannon"
 tur_ynzma_leg5.2.desc: "§WThe cannon decides what the light tank can fight. §LAselsan§!, our leading defence electronics house, has offered a stabilised fire control system for either gun, and the manufacturer will integrate it with the turret.\n\nA §Y105mm§! cannon §Gis proven§!, §Glighter§! and §Ginexpensive§!, but §Rstruggles against modern main battle tanks§!. A §Y120mm§! cannon §Gis far more lethal§! and §Gcan defeat heavily armoured targets§!, but §Rcosts more§! and §Rputs more strain on the light hull§!.§!"
 tur_ynzma_leg5.2.a: "105mm cannon"
 tur_ynzma_leg5.2.b: "120mm cannon"
 tur_ynzma_leg5.3.name: "YNZMA Leg 5: Turret"
 tur_ynzma_leg5.3.desc: "§WThe turret decides how the crew fights and how well it survives. §LAselsan§! has offered modern sights and fire control for either layout, while the manufacturer handles integration with the hull.\n\nA §Ymanned turret§! §Gis proven§! and §Gcheap§!, but §Rleaves the crew exposed to turret damage§!. An §Yunmanned turret§! §Gkeeps the entire crew protected in the hull§! and §Gallows a lower silhouette§!, but §Ris costly§! and §Rcomplex to integrate§!.§!"
 tur_ynzma_leg5.3.a: "Manned turret"
 tur_ynzma_leg5.3.b: "Unmanned turret"
 tur_ynzma_leg5.4.name: "YNZMA Leg 5: Armor"
 tur_ynzma_leg5.4.desc: "§WA light tank trades protection for speed, and the army must decide how far to push that balance. Both manufacturers can fit either package.\n\n§YStandard armor§! §Gkeeps the vehicle light, fast and cheap§!, but §Rleaves the crew vulnerable to heavy weapons§!. §YHeavy armor§! §Gprovides far better protection§! and §Gimproves survivability on the modern battlefield§!, but §Rcosts more§! and §Radds weight that slows the vehicle§!.§!"
 tur_ynzma_leg5.4.a: "Standard armor"
 tur_ynzma_leg5.4.b: "Heavy armor"
 tur_ynzma_leg5.5.name: "YNZMA Leg 5: Design Delivered"
 tur_ynzma_leg5.5.desc: "§WAfter 120 days of work, the manufacturer and §LAselsan§! have delivered the final design of the §YYNZMA§! light tank. The first vehicles are ready to join the armoured units of the Land Forces.§!"
 tur_ynzma_leg5.5.a: "Excellent."
 tur_ynzma5_requires_ynzma4: "Complete the §YYNZMA IFV Leg 4§! Development"


 tur_spg_tender: "Hold a tender for §YSelf-Propelled Howitzers§!"
 tur_spg_tender_desc: "\n\n\n\n\n\n£TUR_desctext_spg_tender_for_tooltip\n\n\n\n\n\n\n\n\n§WTender to replace our aging towed and self-propelled artillery with a modern 155mm self-propelled howitzer.\n§W--------------§!\n[KOR.GetFlag]§YK9 Thunder§!: §Gproven§!, §Gmoderately priced§! and offered with §Glicensed domestic production§!, but §Rforeign design§!.\n[GER.GetFlag]§YPzH 2000§!: §Gthe most capable howitzer in its class§!, but §Rvery expensive§! and §Rpurchased abroad only§!.\n[ENG.GetFlag]§YAS-90D§!: §Gcheaper off-the-shelf purchase§!, but §Rno license production§! and §Rolder design§!.\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the development of §Ynewer versions§! of these systems.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_spg_tender.1.name: "The Self-Propelled Howitzer Tender"
 tur_spg_tender.1.desc: "§WThe trials for the §YSelf-Propelled Howitzer Tender§! have concluded. Our artillery can no longer keep pace with the mechanized columns it is meant to support, and three partners have put proposals on the table.\n\n[KOR.GetFlag]§YK9 Thunder§!: a §Gproven§! and §Gaffordable§! system with a §Gmodern autoloader§!, offered with §Gfull license production§! so that our own industry can build it, but it remains a §Rforeign design§!.\n\n[GER.GetFlag]§YPzH 2000§!: widely regarded as the §Gbest howitzer in the world§!, with a §Ghigh rate of fire§! and §Gexcellent accuracy§!, but §Rvery expensive§! and offered as a §Rdirect sale only§!.\n\n[ENG.GetFlag]§YAS-90D§!: a §Gsolid§! and §Gcheaper§! system available immediately, but §Rolder§! and §Rwithout any license production§!.\n\nLicense and industry, raw capability, or a cheap purchase? The delivery or production start will take §Y120 days§!.§!"
 tur_spg_tender.1.a: "[KOR.GetFlag]§YK9 Thunder§! §G(License production, good system)§! §R(Foreign design)§!"
 tur_spg_tender.1.b: "[GER.GetFlag]§YPzH 2000§! §G(Best in class)§! §R(Very expensive, no license)§!"
 tur_spg_tender.1.c: "[ENG.GetFlag]§YAS-90D§! §G(Cheaper)§! §R(Older, no license)§!"
 tur_spg_tender.10.name: "§YT-155 Firtina§! Enters Production"
 tur_spg_tender.10.desc: "The first license-built §YT-155 Firtina§! howitzers have rolled out of the Turkish workshops. Based on the Korean §YK9 Thunder§!, the Firtina combines a reliable chassis and modern autoloader with a Turkish production line, and our engineers have already begun working on improvements of their own.\n\n§GStrengths:§! Domestic production, good rate of fire, reasonable cost, room for local modifications.\n§RWeaknesses:§! Early production is slow and still depends on some Korean components.\n\nThe lines are open and the first batches are headed for the artillery regiments."
 tur_spg_tender.10.a: "Made in Türkiye."
 tur_spg_tender.11.name: "§YPzH 2000§! Delivered"
 tur_spg_tender.11.desc: "The §YPzH 2000§! howitzers have arrived from Germany, 280 of them, and our gunners have wasted no time in trying them out. Their rate of fire and accuracy are unmatched, and the crews who have used them speak of them with something close to reverence.\n\n§GStrengths:§! Outstanding firepower, range and precision.\n§RWeaknesses:§! The most expensive option, with no license to build more ourselves.\n\nThe guns are being distributed to the artillery regiments."
 tur_spg_tender.11.a: "A very fine piece of engineering."
 tur_spg_tender.12.name: "§YAS-90D§! Delivered"
 tur_spg_tender.12.desc: "The §YAS-90D§! howitzers have arrived from Britain, 280 of them, and are being inspected at the depots. They are a solid and well-tested design that brings a clear improvement over our aging artillery without breaking the budget.\n\n§GStrengths:§! Proven design, cheaper than the alternatives, available immediately.\n§RWeaknesses:§! Older technology, and no license to build more ourselves.\n\nThe guns are being distributed to the artillery regiments."
 tur_spg_tender.12.a: "Good enough for the price."

 TUR_develop_asya: "Develop the §YAsya TTO§!"
 TUR_develop_asya_desc: "\n\n\n\n\n\n£TUR_develop_asya_for_tooltip\n\n\n\n\n\n\n\n\n§WNew equipment: §YAsya TTO§!, 155-mm wheeled self-propelled howitzer.\nDeveloper: §LASELSAN§!.\nFeatures: §Gfully domestic design§! and §Gfast move, fire and relocate§!, and other smaller features.\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the §YNext Generation Self-Propelled Howitzers Tender§!.\nIf you §Rskip§! it, it will §Rnot§! be available to you.§!"
 tur_asya_requires_spg: "Complete the §YSelf-Propelled Howitzer Tender§!"

 TUR_develop_firtina2: "Develop the §YFirtina 2§!"
 TUR_develop_firtina2_desc: "\n\n\n\n\n\n£TUR_develop_firtina2_for_tooltip\n\n\n\n\n\n\n\n\n§WNew equipment: §YFirtina 2§!, 155-mm tracked self-propelled howitzer.\nDeveloper: §LMKE§! and §LASELSAN§!.\nFeatures: §Gmodernised T-155 Firtina§!, §Glonger range§! and §Gdigital fire control§!, and other smaller features.\n§W--------------§!\n§RWarning:§! This Decision is §Rrequired§! to unlock the development of §Ynewer self-propelled howitzers§!.\nIf you §Rskip§! it, they will §Rnot§! be available to you.§!"
 tur_firtina2_requires_asya: "Complete the §YAsya TTO Development§!"



 tur_howitzer_dev: "Develop a New §YHowitzer§!"
 tur_howitzer_dev_desc: "\n\n\n\n\n\n£TUR_develop_arpan_for_tooltip\n\n\n\n\n\n\n\n\n§WProgram to develop a modern domestic 155mm howitzer for our artillery corps.\n§W--------------§!\n[TUR.GetFlag]§YArpan§!: §Gcheaper§! and §Glow risk§!, but §Rmodest performance§!.\n[TUR.GetFlag]§YYavuz§!: §Gbetter performance§!, but §Rmore expensive§!.\n§W--------------§!\nOnly §Yone§! of the two can be developed, and the design will take §Y120 days§! to complete.§!"
 tur_howitzer_dev.1.name: "Next-Generation Howitzer"
 tur_howitzer_dev.1.desc: "Turkish engineers have two competing 155mm howitzer proposals on the table. The Arpan is the more economical and conservative design, while the Yavuz is more ambitious and costs more to develop. Only one can receive funding. Development will take roughly four months."
 tur_howitzer_dev.1.a: "Develop the §YArpan§!"
 tur_howitzer_dev.1.b: "Develop the §YYavuz§!"
 tur_howitzer_dev.10.name: "The Arpan Howitzer is Ready"
 tur_howitzer_dev.10.desc: "After months of testing, the Arpan design has passed its acceptance trials. It is reliable, affordable and ready for our artillery planners to use."
 tur_howitzer_dev.10.a: "A solid piece of work."
 tur_howitzer_dev.11.name: "The Yavuz Howitzer is Ready"
 tur_howitzer_dev.11.desc: "After months of testing, the Yavuz design has passed its acceptance trials. Its range and rate of fire exceed our earlier systems, and the design is now available to our artillery planners."
 tur_howitzer_dev.11.a: "A fine addition to the arsenal."


