 system_of_eu_values_tt: "Système de valeurs européennes :\nValeur de l'UE :\nProblème de non-respect - Niveau de non-respect\n\nÉtat de droit :\nCorruption paralysante - 5\nCorruption handicapante - 4\nCorruption endémique - 3\nCorruption sans restriction - 2\nCorruption systématique - 1\n\nRespect de la dignité humaine et de la liberté :\na mené une guerre offensive contre un État membre de l'UE - 10\na un gouvernement communiste - 2\na un gouvernement réactionnaire - 2\ncoalition communiste - 1\na une coalition réactionnaire - 1\n\nDémocratie :\nPas d'élections - 5\nDictature - 5\nDictature communiste - 5\nDictature fasciste - 5\nest une marionnette - 4\nNéo-impérialisme - 1\n\nDroits des femmes et des minorités :\nService interdit aux femmes - 1\nSeuil électoral de 10% - 1\n\nPas de clause de sauvetage :\nBanqueroute - 1\nRenflouement accordé - 1"
