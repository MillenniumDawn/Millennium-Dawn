 CHI_bop_drift_zeng: "쩡칭훙 파벌 영향력"
 CHI_infantry_general: "보병 장군"
 CHI_infantry_general_desc: "신 파이 장군은 대규모 보병 작전 전문가로서 중국 인민해방군 지상군에서 지위를 높여 왔습니다. 그는 신속한 전개와 수적 우위를 중시하며 홍위병과 돌격 보병의 대규모 부대를 지휘합니다."
 CHI_jiang_legacy_secured: "확보된 유산"
