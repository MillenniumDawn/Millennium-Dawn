 israel_economy.179.b: "아니."
 israel_likud.57.b: "관심 없다."
 israel.103.a: "그런가?"
 israel.149.b: "어쩌면 협력은 하되 지위를 높여 주지는 말아야 한다."
 ISR_fortress_egy_pal_border_TT: "이집트 및 가자와의 국경에 레벨 2 육상 요새 추가"
 dealed_with_isr: "우리는 이전에 이스라엘과 거래를 한 적이 있다!"
 ISR_storm_tulkarm_fort: "툴카렘 요새 급습"
 ISR_dakar_desc: "새로운 함선과 잠수함 건조에 대비하여 산업을 준비하기 위해 새로운 조선소를 건설해야 합니다."
 ISR_effect_corruptible_leader_TT: "§H우리 지도자가 부패에 취약하므로:§!"
 ISR_saudi_donations_desc: "사우디가 가자 개발 비용을 부담하게 합시다. 물론 이는 그들에게 어느 정도의 영향력을 줄 것입니다."
 ISR_emirati_donations_desc: "아랍에미리트가 가자 개발 비용을 부담하게 합시다. 물론 이는 그들에게 어느 정도의 영향력을 줄 것입니다."
 israel_mechanic.16.a: "아, 젠장..."
