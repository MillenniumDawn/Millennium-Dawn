 ###MILITAR
 EGY_military_anger1: "Unsatisfied Military"
 EGY_military_anger1_desc: "The officer corps is unsatisfied with the government. Complaints are voiced in private and no action is taken for now.\n§W--------------§!\nThis national spirit applies while the opinion of §YThe Military§! is between §Y40§! and §Y49§!. It is removed if §YThe Military§! is removed."
 EGY_military_happy: "Pleased Military"
 EGY_military_happy_desc: "The armed forces are content with the government and back it without reservation. Officers see their budgets, status, and business interests as secure.\n§W--------------§!\nThis national spirit applies while the opinion of §YThe Military§! is §G70§! or higher. It is removed if §YThe Military§! is removed."
 EGY_military_anger2: "Frustrated Army"
 EGY_military_anger2_desc: "The officer corps is frustrated with the government. Training and readiness suffer as senior commanders withhold cooperation.\n§W--------------§!\nThis national spirit applies while the opinion of §YThe Military§! is between §Y30§! and §Y39§!. It is removed if §YThe Military§! is removed."
 EGY_military_anger3: "Furious Army"
 EGY_military_anger3_desc: "The officer corps is furious with the government. Orders are carried out slowly and units are poorly maintained.\n§W--------------§!\nThis national spirit applies while the opinion of §YThe Military§! is between §Y20§! and §Y29§!. It is removed if §YThe Military§! is removed."
 EGY_military_anger4: "Disloyal Army"
 EGY_military_anger4_desc: "The officer corps is disloyal. Commanders openly disregard the government and the armed forces are badly disorganized.\n§W--------------§!\nThis national spirit applies while the opinion of §YThe Military§! is between §Y10§! and §Y19§!. It is removed if §YThe Military§! is removed."
 EGY_military_anger5: "Crippled Army"
 EGY_military_anger5_desc: "The armed forces are crippled by the breakdown of trust between the officer corps and the government. They are barely able to function.\n§W--------------§!\nThis national spirit applies while the opinion of §YThe Military§! is below §R10§!. It is removed if §YThe Military§! is removed."
 EGY_guards_of_secularism: "Opportunistic Military"
 EGY_guards_of_secularism_desc: "The Egyptian military has not been hesitant to take the first opportunity that would grant them more power, either politically or logistically. The military will oppose parties that threaten their influence over the government. For example, the military will seize any opportunity to oust a government that aligns themselves with the Muslim Brotherhood, as they go against the military's influence over the central government.\n\nThe military opposes non-secular political parties such as the §W[Neutral_Muslim_Brotherhood_L]§!. The military's §YStanding§! with the government is affected by multiple factors, such as §GMilitary Spending§! or §RCorruption§!. If our §YStanding§! with them drops below §Y-100§!, the military will take actions to topple the government.\n\n§YThe Military§! will also resist attempts to reduce its power but if we manage to remove them, they won't be able to interfere with us."
 egypt.141.t: "Military Coup in Egypt!"
 egypt.141.d: "Today, higher command of Egyptian military rolled down the streets of Cairo and Alexandria and occupied several government buildings. They demand our government to resign!"
 egypt.141.a: "We should give up..."
 egypt.141.b: "No step back!"


 egypt_sahar.1.t: "Help from Egypt"
 egypt_sahar.1.d: "We have received an offer from Egypt, they are willing to provide us with military assistance and help us prepare for the resumption of hostilities, in exchange for participation in the process of establishing the UAR. Should we accept Egypt's support?"
 egypt_sahar.1.a: "We must accept!"
 egypt_sahar.1.b: "No way we will become their puppets!"
 egypt_sahar.2.t: "Peace Agreement"
 egypt_sahar.2.d: "We couldn't contain the rebels, they took over all of Western Sahara. Should we offer the rebels a peace treaty and surrender the territory?"
 egypt_sahar.2.a: "Send them the offer"
 egypt_sahar.2.b: "We must crush them!"
 egypt_sahar.3.t: "Offer from Morocco"
 egypt_sahar.3.d: "Morocco has sent us a peace treaty proposal, this statement can be considered a full-fledged act of surrender! We can accept the surrender or we can march in a broad front to liberate the peoples of Northern Maghreb!"
 egypt_sahar.3.a: "We won!"
 egypt_sahar.3.b: "Onward to People's Federation!"
 egypt_sahar.4.t: "The War Continues"
 egypt_sahar.4.d: "Morocco apparently is not going to make concessions, they don't want to give freedom to our people. Then we will liberate not only our people, but also the people of all Morocco!"
 egypt_sahar.4.a: "Onward to People's Federation!"
 egypt_sahar.5.t: "Peace at last."
 egypt_sahar.5.d: "We signed a peace treaty with Sarawi and the war is over."
 egypt_sahar.5.a: "Our Darkest times.."
 egypt_sahar.6.t: "They rejected!"
 egypt_sahar.6.d: "Sarawi has rejected our peace treaty! The war continues!"
 egypt_sahar.6.a: "We will win!"
 egypt_sahar.7.t: "Sarawi accepts!"
 egypt_sahar.7.d: "Sarawi accepts our offer."
 egypt_sahar.7.a: "Onward to UAR!"
 egypt_sahar.8.t: "They rejected!"
 egypt_sahar.8.d: "Sarawi has rejected our offer."
 egypt_sahar.8.a: "What a shame."

