 HBL_form_category: "Los Países Bajos, Bélgica y Luxemburgo"
 HBL_form_category_desc: "El Benelux es una unión político-económica integrada por los Países Bajos, Bélgica y Luxemburgo. Históricamente, los tres países miembros mantienen relaciones amistosas y cordiales entre sí. La organización actual es una mera unión de estados en cuestiones políticas y económicas a nivel mundial. Se habla en voz baja de la posibilidad de formalizar esta unión de estados en algo más concreto: una nueva nación que represente a los pueblos de las Tierras Bajas, proponga un nuevo futuro para el pueblo y lo guíe hacia ese futuro brillante."
 HBL_integrate_start: "Begin forming [GetHBLNameDef]"
 HBL_integrate_start_desc: "It is time to begin forming the Benelux.\n\n"
 HBL_integrate_belgium: "Integrate [GetHBLNameAdj] [BEL.GetAdjective] Territories"
 HBL_integrate_belgium_desc: "Bélgica no es el país más grande ni el más pequeño de las naciones Benelux. Se encuentra cómodamente en el centro, similar a su posición entre los otros dos estados miembros. Acoge varios centros de burocracia de la Unión Europea en la ciudad de Bruselas y es un destino turístico muy popular para los turistas neerlandeses, franceses y no pertenecientes a la UE."
 HBL_integrate_netherlands: "Integrate [GetHBLNameAdj] [HOL.GetAdjective] Territories"
 HBL_integrate_netherlands_desc: "Los Países Bajos son el país más grande de los tres miembros de Benelux. Comprende la mayoría de la población, la superficie terrestre y el tamaño económico, y cuenta con varias posesiones en el extranjero. La integración de los Países Bajos aporta la mayor parte de Benelux al nuevo estado y fortalece significativamente la legitimidad de nuestra nueva unión."
 HBL_integrate_luxembourg: "Integrate [GetHBLNameAdj] [LUX.GetAdjective] Territories"
 HBL_integrate_luxembourg_desc: "Luxemburgo es el país más pequeño de los tres. Tiene el mayor PIB per cápita y cuenta con varios destinos turísticos más pequeños. En el país se hablan una gran variedad de idiomas, siendo los más destacados el francés, el alemán y el inglés. Integrar a Luxemburgo no es una gran tarea, dado el tamaño del Estado, pero planteará algunos desafíos burocráticos."
 HBL_update_flag: "Finish Forming [GetHBLNameDef]"
 HBL_update_flag_desc: "With every constituent territory integrated, we can complete our transformation and proclaim [GetHBLNameDef], adopting its unified flag and name."
 is_HBL: "Has formed [GetHBLNameDef]"
 USNA_form_category: "Unir América del Norte"
 USNA_form_category_desc: "The North American continent has historically repelled foreign influence since Mexico, the United States, and Canada were founded as nation-states. They form the backbone of the world's economy, with a collective eleven trillion GDP at the beginning of the new millennium. Uniting the nations and setting our sights on the grander tomorrow will see us go forward to the future."
 USNA_integrate_start: "Begin forming [GetUSNANameDef]"
 USNA_integrate_start_desc: "It is time to begin forming the North American Federation.\n\n"
 USNA_integrate_canada: "Integrate [GetUSNANameAdj] [CAN.GetAdjective] Territories"
 USNA_integrate_canada_desc: "Canadá es la nación más grande por área terrestre dentro de la nueva unión y cuenta con muchas reservas de petróleo sin explotar. Estos dos hechos por sí solos hacen de Canadá una pieza integral del nuevo rompecabezas de la Unión de América del Norte. Con su integración en la nueva nación, esperemos que se minimicen los estereotipos y prejuicios hacia ellos."
 USNA_integrate_usa: "Integrate [GetUSNANameAdj] [USA.GetAdjective] Territories"
 USNA_integrate_usa_desc: "Estados Unidos constituye la mayor parte de la Unión de Estados de América del Norte. Tiene la mayor economía, la segunda mayor superficie terrestre, un ejército y más. La integración de Estados Unidos conlleva una gran cantidad de desafíos debido a su gran tamaño y peso en el escenario mundial; sin embargo, esta integración nos colocará económicamente como la superpotencia más grande del mundo."
 USNA_integrate_mexico: "Integrate [GetUSNANameAdj] [MEX.GetAdjective] Territories"
 USNA_integrate_mexico_desc: "Mexico is the second most populous nation of the three nations forming the new state. It brings to bear a large military. The nation has several challenges, such as the density of cartels. Nevertheless, integrating Mexico will be one of the main focal points for the new nation."
 USNA_update_flag: "Finish Forming [GetUSNANameDef]"
 USNA_update_flag_desc: "With every constituent territory integrated, we can complete our transformation and proclaim [GetUSNANameDef], adopting its unified flag and name."
 is_USNA: "Has formed [GetUSNANameDef]"
 UTS_form_category: "Unir Territorios Turcos"
 UTS_form_category_desc: "Los Territorios Turcos Unidos es una unión de naciones de habla turca, incluyendo Turquía, Uzbekistán, Kirguistán, Kazajistán y Tayikistán. Otros grupos de personas de habla turca fuera de los países, como los tártaros y uigures, existen en Rusia y China. Son una meta para nuestra unión, pero no la inicial. Uniremos a los estados-nación que existen actualmente y alentaremos a nuestro pueblo a regresar a casa o unirse nuevamente."
