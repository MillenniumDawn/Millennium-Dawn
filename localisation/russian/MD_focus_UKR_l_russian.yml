 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_early: "Заказать раннюю модернизацию §YБРДМ-2§! в Николаеве"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_early_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2ld_for_tooltip\n\n\n\n\n\n\n\n\n§W§YНиколаевский танкоремонтный завод§! и харьковское КБ имени Морозова подготовили две похожие модернизации. Обе добавляют боковые люки для экипажа. §YБРДМ-2ЛД§! также получает новый дизельный двигатель, а §YБРДМ-2М§! сохраняет старый бензиновый.\n\nПредложение действует до конца §Y2001§! года. Если мы откажемся, завод вернётся с более глубокой модернизацией в §Y2004§! году.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_early_mission: "Последний шанс: ранняя модернизация §YБРДМ-2§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_early_mission_desc: "$ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_early_desc$\n\n§RКогда таймер истечёт, завод отзовёт предложение.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_developed: "Заказать модернизацию §YБРДМ-2ДИ «Хазар»§! в Николаеве"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_developed_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2di_for_tooltip\n\n\n\n\n\n\n\n\n§WНаши зарубежные миссии показали, что нужно современной разведывательной машине. §YНиколаевский танкоремонтный завод§! предлагает §YБРДМ-2ДИ «Хазар»§! с дизелем IVECO, тепловизором, системой видеонаблюдения и дополнительным люком для десанта. За доплату завод может также установить новый боевой модуль §Y«Буг»§!.\n\nПредложение действует до конца §Y2005§! года.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_developed_mission: "Последний шанс: §YБРДМ-2ДИ «Хазар»§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_developed_mission_desc: "$ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_developed_desc$\n\n§RКогда таймер истечёт, завод отзовёт предложение.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.10.name: "Следующий шаг для БРДМ-2Т"
 ukraine_modernize_sov_equipment_brdm_2_modernization.10.desc: "«Техимпекс» может развивать БРДМ-2Т в двух направлениях. Облегчённая версия лишается башни ради открытых пулемётных установок и люков в стиле БТР-70, а улучшенная сохраняет башню и получает кевларовый противоосколочный подбой и новую коробку передач."
 ukraine_modernize_sov_equipment_brdm_2_modernization.10.a: "Разработать облегчённую §YБРДМ-2Т обр. 2013§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.10.b: "Разработать улучшенную §YБРДМ-2Т обр. 2015§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.11.name: "БРДМ-2Т обр. 2013 готова"
 ukraine_modernize_sov_equipment_brdm_2_modernization.11.desc: "«Техимпекс» завершила §YБРДМ-2Т обр. 2013§!. Без башни и средних колёс она получила широкие боковые люки, крупнокалиберный пулемёт НСВТ и ПКТ на открытых установках."
 ukraine_modernize_sov_equipment_brdm_2_modernization.11.a: "Принять на вооружение §YБРДМ-2Т обр. 2013§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.12.name: "БРДМ-2Т обр. 2015 готова"
 ukraine_modernize_sov_equipment_brdm_2_modernization.12.desc: "«Техимпекс» завершила §YБРДМ-2Т обр. 2015§!. Она сохраняет башню и получает люки в стиле БРДМ-2ЛД, пятиступенчатую коробку передач, шины «Росава», радиостанцию Motorola и кевларовый противоосколочный подбой."
 ukraine_modernize_sov_equipment_brdm_2_modernization.12.a: "Принять на вооружение §YБРДМ-2Т обр. 2015§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.13.name: "«Маяк» предлагает БРДМ-2ДП"
 ukraine_modernize_sov_equipment_brdm_2_modernization.13.desc: "Киевский завод §Y«Маяк»§! разработал собственную облегчённую §YБРДМ-2ДП§! с дизельным двигателем, боковыми дверями и съёмными противокумулятивными экранами. «Маяк» просит финансирования, чтобы завершить работу и передать нам проект."
 ukraine_modernize_sov_equipment_brdm_2_modernization.13.a: "Профинансировать «Маяк»"
 ukraine_modernize_sov_equipment_brdm_2_modernization.13.b: "Остаёмся с «Техимпекс»"
