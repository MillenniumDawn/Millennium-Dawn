l_japanese:
 muslim_brotherhood_sponsor: "ムスリム同胞団ネットワーク"
 muslim_brotherhood_suppressor: "ムスリム同胞団に対抗せよ"
 MB_build_network_hub: "国際機関の構築"
 MB_build_network_hub_desc: "ムスリム同胞団は国境を越えた運動で、その関連組織はこの地域全体に散在しており、単一の中枢は存在しない。[Root.GetNameDef]をその中心とし、ネットワークを調整し、海外にいる兄弟たちを支援する手段を提供しよう。"
 MB_fund_affiliates: "同胞団支部に対する資金援助"
 MB_fund_affiliates_desc: "[FROM.GetNameDef]のムスリム同胞団は意欲はあるものの、資金が乏しい。資金、組織者、そして継続的な支援があれば、彼らを排除したいと願う政府に対して、彼らの立場を強めることができるだろう。"
 MB_diplomatic_solidarity: "同胞団へ連帯を呼びかける"
 MB_diplomatic_solidarity_desc: "ムスリム同胞団に連なる各国政府は、バラバラであるよりも団結した方がより強くなれる。それらを一堂に集め、共通の目的を再確認し、我々の間に流れる温もりがブロック全体に感じられるようにしよう。"
 MB_bankroll_crackdown: "海外での取り締まりへの資金提供"
 MB_bankroll_crackdown_desc: "[FROM.GetNameDef]は、ムスリム同胞団が自国の領土内で勢力を拡大していくのを打つ手もなくただ見守っている。この運動が国家を脅かすほどの力を蓄える前に、先制攻撃を行うための資金と情報を彼らに提供せよ。"
 MB_designate_terrorist_organization: "ムスリム同胞団をテロ組織に指定"
 MB_designate_terrorist_organization_desc: "我々がそう断定している通り、ムスリム同胞団をテロ組織として指定すべきだ。この指定は国内でのコストはほとんどかからず、[Root.GetNameDef]を同様の線引きを行ったあらゆる政府と肩を並べる立場に置くことになる。"
 MB_counter_sponsor_influence: "同胞団の資金源を暴く"
 MB_counter_sponsor_influence_desc: "[FROM.GetNameDef]では誰かがムスリム同胞団に資金を提供しているが、その資金の流れは追跡可能だ。それを暴き、活動を妨害すれば、支援者たちが明るみに出されるにつれて、この運動の勢いは衰えていくのを目の当たりにできるだろう。"
 MB_rescind_terrorist_designation: "テロ組織指定の撤回"
 MB_rescind_terrorist_designation_desc: "テロ組織指定を静かに失効させるべきだ。ムスリム同胞団に対するこの姿勢はすでにその役割を果たしており、過去の恨みを法的に残しておいても得るものはほとんどない。"
 MB_sponsored_network: "ムスリム同胞団運動への支援"
 MB_funding_subversion: "海外におけるムスリム同胞団の破壊活動への資金提供"
 MB_solidarity: "ムスリム同胞団への連帯"
 MB_crackdown_patron: "取り締まり費用の負担"
 MB_funding_repression: "ムスリム同胞団に対する弾圧活動への資金提供"
 MB_counter_bloc: "ムスリム同胞団に対する共通の姿勢"
 MB_branded_terrorist: "ムスリム同胞団をテロ組織と指定した"
 brotherhood.6.c: "穏健派を政府に引き入れる。"
 brotherhood.11.t: "取り締まりへの資金提供の申し出"
 brotherhood.11.d: "[FROM.GetNameDef]は、ムスリム同胞団がさらに勢力を拡大する前に抑え込むため、資金と情報を密かに提供してきた。彼らの使節団は回答を待っている。"
 brotherhood.11.a: "資金を受け入れ、彼らに対して行動を起こせ。"
 brotherhood.11.b: "申し出を断ってくれ。"