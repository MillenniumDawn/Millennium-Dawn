 UKR_APC_1: "BTR-60"
 UKR_APC_1_desc: "BTR-60은 14.5mm KPVT 중기관총에 500발을 장착했습니다. 보조 무기는 7.62mm 패킷 동축 기관총으로 3,00발입니다. 경보병 이동 및 QRF에 적합합니다."
 UKR_APC_1_short: "BTR-60"
 UKR_APC_2: "MT-LB"
 UKR_APC_2_desc: "MT-LB는 1970년대에 만들어진 모델입니다. 저렴하고 빠르게 만들어졌기에, 소련은 가벼운 대공 및 보병 전투에 해당 차량을 사용했습니다."
 UKR_APC_2_short: "MT-LB"
 UKR_APC_3: "BTR-70"
 UKR_APC_3_desc: "BTR-70은 1972년 소련-아프가니스탄 전쟁에서 군대를 이동시켜 화력을 지원하는데 사용되었습니다. BTR-60과의 유일한 차이점은 장갑이 더 무겁다는 점입니다."
 UKR_APC_3_short: "BTR-70"
 UKR_APC_4: "BTR-80"
 UKR_APC_4_desc: "BTR-80은 8륜 수륙양용 병력 수송 장갑차(APC)로 소련에서 개발되었습니다. 1986년 배치되기 시작하여 이전의 차량인 BTR-60, BTR70들을 대체하기 시작했습니다. 아프가니스탄전에서 처음 그 실력을 발휘했습니다."
 UKR_APC_4_short: "BTR-80"
 UKR_APC_5: "BTR-3"
 UKR_APC_5_desc: "The BTR-3 is a Ukrainian 8x8 wheeled armored personnel carrier. It is an improved version of the Soviet BTR-80, featuring enhanced armor protection, mobility, and firepower. The BTR-3 is equipped with a 30mm automatic cannon and a 7.62mm coaxial machine gun, making it suitable for both troop transport and combat support roles."
 UKR_APC_5_short: "BTR-3"
 UKR_APC_6: "BTR-4"
 UKR_APC_6_desc: "The BTR-4 is a Ukrainian 8x8 wheeled armored personnel carrier. It is an improved version of the Soviet BTR-80, featuring enhanced armor protection, mobility, and firepower. The BTR-4 is equipped with a 30mm automatic cannon and a 7.62mm coaxial machine gun, making it suitable for both troop transport and combat support roles."
 UKR_APC_6_short: "BTR-4"
 UKR_APC_7: "BTR-4MV"
 UKR_APC_7_desc: "The BTR-4MV is a modernized version of the BTR-4, designed to provide enhanced protection and firepower. It features improved armor, a more powerful engine, and advanced weapon systems, including a 30mm automatic cannon and anti-tank guided missiles. The BTR-4MV is capable of carrying a full infantry squad and is suitable for various combat scenarios."
 UKR_APC_7_short: "BTR-4MV"
 UKR_APC_8: "BMP-V"
 UKR_APC_8_desc: "The BMP-V is a Ukrainian amphibious tracked infantry fighting vehicle. It is designed to transport infantry to the battlefield while providing fire support. The BMP-V is equipped with a 30mm automatic cannon, a coaxial machine gun, and can carry anti-tank guided missiles. It offers improved armor protection and mobility compared to its predecessors, making it suitable for modern combat operations."
 UKR_APC_8_short: "BMP-V"
 UKR_IFV_1: "BMP-1"
 UKR_IFV_1_desc: "BMP-1는 소련의 수륙양용 보병 전투 차량(IFV)입니다. 소비에트-아프가니스탄 전쟁에서 병력을 수송하면서 지하드 주의자들과 싸웠습니다. 73mm 2A28 포와 대전차 유도 미사일(ATGM)을 사용합니다."
 UKR_IFV_1_short: "BMP-1"
 UKR_IFV_2: "BMP-1U"
 UKR_IFV_2_desc: "An upgraded version of the BMP-1, featuring improved firepower."
