the_white_paper: "The 2000 White Paper"
the_white_paper_desc: "The Defense 2000 paper was made as a comprehensive review of our current military capabilities, and those that current administration demands. With more weight on the strength of Australia as a major supplier of security and peacekeeping in the Pacific, the demands have predominantly been to expand. Not just personnel. Command, technologically, our weapon manufacturing, all need to be improved or expanded. Thankfully, we have a number of programs in development that could help us achieve this."
the_second_white_paper_1: "The 2nd White Paper"
the_second_white_paper_1_desc: "Following up on the success of the first paper, the ADF has been charged with undertaking a serious of more expansive programs and restructuring to continue to meet the demands of Pacific defense."
ast_we_are_many_tt: "The §Gfuture§! of our nation's demographics is in our hands."
sol_islands_intervention: "Regional Assistance Mission to the Solomon Islands"
sol_islands_intervention_desc: "The Situation in the country right now is certainly less than ideal. Banditry and militant fighting is commonplace, public services have broken down, and the remaining police have been factionalised between the warring groups. If we are to restore order to the Islands a major stability and reconstruction effort must take place and soon."
sol_situation_countdown: "The situation is deteriorating..."
organise_occupation_force: "Organise Occupation Force"
organise_occupation_force_desc: "An occupational force will need to be created before we launch any major operations. Currently a number of other nations have pledged their support, but the bulk of the force will need to be ours. Two thousand troops and around two hundred peacekeeping-trained personnel will serve as law enforcement on the island."
operation_anode: "Operation Anode"
operation_anode_desc: "Our major offensive onto the Islands will be carried out in a number of stages, partly by sea and partly by air with our Chinooks. The first objective will be seizing a number of key positions on the island to act as logistical and forward operation hubs. Then we can roll out the reconstruction work. We're calling it 'Operation Helpem Fren' for good optics, a phrase that in their language means 'helping a friend.'"
secure_honiara: "Secure Honiara"
secure_weather_coast: "Secure Weather Coast"
secure_rural_guadalcanal: "Secure Rural Tambea"
secure_malaita_province: "Secure Malaita Province"
sol_disarm_the_militias: "Disarm the Militias"
sol_red_cross: "Coordinate with the Red Cross"
sol_red_cross_desc: "The Red Cross already has a significant presence on the island. Coordinating with them could allow our teams to treat and evacuate civilians at risk."
negotiate_with_the_militias: "Negotiate with the Militants"
negotiate_with_the_militias_desc: "Negotiating with armed militants is hardly a stabilising mission, but if we approach the more reasonable ones to organise ceasefires it could buy us more time."
disband_the_local_police: "Disband the Local Police"
disband_the_local_police_desc: "The local policeforce on the Islands has become rampant with corruption and factionalism to the point where they no longer serve the people. We will need to pull apart the current law enforcement structure if we are to fix anything."
rebuild_the_local_policeforce: "Rebuild the Local Policeforce"
rebuild_the_local_policeforce_desc: "If we are to rebuild the law enforcement in the country we'll need to create a multinational board of commissioners to begin vetting and instructing the new recruits of officers, and enforce safeguards to keep things running in the future."
run_anticorruption_campaign: "Run Anti-corruption Campaign"
run_anticorruption_campaign_desc: "Currently the political scape in the nation is barely function, let alone collapsed house of corruption. Few of those remaining in government are without mark. A nationwide crackdown on illegal practices will need to be started, and then we can look at setting up the new foundations."
recruit_public_servants: "Recruit Public Servants"
recruit_public_servants_desc: "Following in our efforts to clear the board, public servants from the participating international nations will be hired to serve in the new government for the time being, whilst plans are made to eventually replace them with locals. This outside expertise will help the government with its rapid rebuilding."
reorganise_the_army: "Reorganise the Army"
reorganise_the_army_desc: "The country hasn't has an effective standing military since it's independence in 1978. What little it did have included a maritime surveillance unit and a few troops handed over from the defunct police force. While our peacekeepers will take the roll of a standing army, we can begin training local units to take the pressure of us and assist operations."
loans_to_the_new_government: "Loans to the New Government"
loans_to_the_new_government_desc: "While we continue to develop a new system of governance for the Solomon Islands, their international debt remains outstanding. We'll loan them the funding to pay new personnel and rebuild the government."
send_our_reconstruction_teams: "Send our Reconstruction Teams"
send_our_reconstruction_teams_desc: "The state of things has improved enough that we can safely send our reconstruction teams to assist in rebuilding and public services construction."
