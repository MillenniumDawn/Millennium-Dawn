 asean_centrality_goal_name: "아세안 중심성"
 asean_centrality_goal_desc: "열 개 국가가 이 반도와 이 바다를 공유하고 있으며, 50년 동안 열강이 이들의 안보를 대신 결정해 왔습니다. SEATO는 그 결정을 지역의 손에 되돌리기 위해 존재합니다. 아세안 회원국이 이 조약 안에 들어와야 비로소 조약은 그 이름값을 하게 됩니다."
 seato_regional_stability_goal_name: "방콕 합의"
 seato_regional_stability_goal_desc: "불안정한 정부들의 조약은 아무것도 보장하지 못합니다. 모든 회원국을 안정된 기반 위에 올려놓고 그중 다섯 나라를 동맹에 유지하면 조약은 더 이상 종잇조각이 아닙니다. 모든 회원국은 정치력, 안정도, 그리고 2년간 더 저렴한 소비재를 얻습니다."
