 TOP_redesign.11.t: "Battle Damage Assessment"
 TOP_redesign.11.d_confirmed: "The 14-day assessment has positively confirmed that §Y[TOP_bda_notice_name]§! was killed. This report reads the operation's already-resolved physical outcome; it does not reroll it."
 TOP_redesign.11.d_inconclusive: "The 14-day assessment could not positively establish the fate of §Y[TOP_bda_notice_name]§!. The operation's physical outcome remains fixed, but the available identity evidence supports only an inconclusive report."
 TOP_redesign.11.a: "Archive the assessment."
 TOP_redesign.20.t: "Targeted Operations Oversight"
 TOP_redesign.20.d: "A credibly attributed political operation, serious civilian harm, a leader capture, or a compromised operation has triggered domestic oversight. The response modifies the same operation record and its attribution investigation rather than creating a parallel result."
 TOP_redesign.20.a: "Disclose the operation and accept scrutiny."
 TOP_redesign.20.b: "Contain the inquiry within government."
 TOP_redesign.20.c: "Suppress disclosure and risk a stronger attribution finding."
 TOP_redesign.20.g: "Order an internal security review."
 TOP_redesign.20.e: "Scapegoat the operational service."
 TOP_redesign.20.f: "Purge officials and suppress the record."
 TOP_redesign.30.t: "Liaison Dossier Request"
 TOP_redesign.30.d: "[?TOP_incoming_liaison_actor.GetName] has requested a one-time dossier snapshot on §Y[TOP_incoming_liaison_subject_name]§!. Sharing transfers three belief axes, location, age, date, and reliability only. It grants no authorization, methods, preparation, custody rights, or hidden source identities."
 TOP_redesign.30.a: "Share a trusted snapshot."
 TOP_redesign.30.b: "Share a mixed-reliability snapshot."
 TOP_redesign.30.c: "Share only suspect reporting."
 TOP_redesign.30.f: "Supply a deceptive location report."
 TOP_redesign.30.e: "Refuse the request."
 TOP_redesign.40.t: "Custody Exploitation Window"
 TOP_redesign.40.d: "[TOP_custody_event_name] is in custody. One exploitation action may be taken within 14 days, once in this person's lifetime. Custody remains available afterward for detention, prosecution, transfer, exchange, or release."
 TOP_redesign.40.a: "Develop two linked target dossiers."
 TOP_redesign.40.b: "Exploit the affiliated organization."
 TOP_redesign.40.c: "Disrupt command and communications."
 TOP_redesign.40.e: "Defer exploitation and manage custody later."
 TOP_locate_facilities_name: "Locate Organization Facilities"
 TOP_locate_facilities_desc: "Use our operatives and intelligence network to locate the selected organization's command, training and financial facilities. The operation reports only on the organization selected when it began."
 TOP_facilities_located_tt: "Receive location and activity evidence for the recorded organization dossier. Execution still requires a reviewed native raid."
 TOP_defensive_deception: "Defensive Deception Program"
 TOP_defensive_deception_desc: "A temporary counterintelligence program improves native operative detection and capture and protects against infiltrating raid teams. National security funding remains in Counter-Terror."
 top_covert_killing_name: "Covert Killing"
 top_covert_killing_desc: "Infiltrate the target network and attempt a deniable lethal action. The ordinary native outcome leaves the target at large; the native bonus outcome achieves the objective. Operatives remain subject to the normal detection, capture and injury risks."
 top_covert_killing_phase_desc: "Infiltrate the target network and attempt a deniable lethal action."
 top_rendition_name: "Rendition"
 top_rendition_desc: "Locate and seize the reviewed target, then transport them into our custody. The ordinary native outcome leaves the target at large; the native bonus outcome achieves the objective. Operatives remain subject to the normal detection, capture and injury risks."
 top_rendition_phase_desc: "Locate and seize the reviewed target, then transport them into our custody."
 top_host_arrest_name: "Host-Assisted Arrest"
 top_host_arrest_desc: "Coordinate with consenting host authorities to take the reviewed target into host custody. The ordinary native outcome leaves the target at large; the native bonus outcome achieves the objective. Operatives remain subject to the normal detection, capture and injury risks."
 top_host_arrest_phase_desc: "Coordinate with consenting host authorities to take the reviewed target into host custody."
 top_poisoning_name: "Poisoning"
 top_poisoning_desc: "Infiltrate the reviewed target environment and attempt the authorized poisoning. The ordinary native outcome leaves the target at large; the native bonus outcome achieves the objective. Operatives remain subject to the normal detection, capture and injury risks."
 top_poisoning_phase_desc: "Infiltrate the reviewed target environment and attempt the authorized poisoning."
 top_agency_outcome_tt: "The native bonus outcome achieves the reviewed objective. An ordinary outcome leaves the target at large. This operation resolves the case that was recorded when execution began."
 top_agency_phase_outcome: "The team attempts the reviewed objective and reports the native operation outcome."
 top_agency_phase_risk: "Our operatives face the standard risks of detection, injury, capture or death."
 top_agency_placement: "Place the Team"
 top_agency_placement_desc: "Commit the prepared intelligence team and arrange access to the reviewed target. The short action follows prior intelligence collection and authorization; the target must remain present through completion."

