 artillery_5: "АРТ 2065 года"
 artillery_5_desc: "Благодаря мощным возможностям ведения огня с закрытых позиций артиллерия наносит непрерывные точные удары там, где это необходимо на поле боя, и далеко за пределами прямой видимости. Её может перезаряжать непосредственно расчёт. Поскольку для перемещения ей нужны тягачи, менять позицию между ударами бывает непросто, что делает её уязвимой для контрбатарейного огня противника. Лёгкие системы меньшего калибра можно перемещать вручную; они подходят для воздушно-десантных операций, поскольку помещаются в транспортные самолёты."
 SP_arty_5: "САУ 2045 года"
 SP_arty_5_desc: "Благодаря мощному огню с закрытых позиций самоходная артиллерия наносит непрерывные точные удары там, где это нужно на поле боя, причём далеко за пределами прямой видимости. Расчёт перезаряжает орудия сам, а собственный ход позволяет уходить из-под контрбатарейного огня противника."
 SP_R_arty_5: "РСЗО 2045 года"
 SP_R_arty_5_desc: "Самоходные реактивные системы залпового огня способны быстро выпускать залпы реактивных снарядов, накрывающие целые большие площади. Их часто применяют против районов сосредоточения противника. Из-за массовых разрушений, которые они вызывают, их минимальная дальность стрельбы больше, чем у обычной артиллерии. Кроме того, они менее точны и потому не подходят для точечных ударов. Для перезарядки им нужны специальные транспортно-заряжающие машины."
 SP_arty_6: "САУ 2055 года"
 SP_arty_6_desc: "Благодаря мощному огню с закрытых позиций самоходная артиллерия наносит непрерывные точные удары там, где это нужно на поле боя, причём далеко за пределами прямой видимости. Расчёт перезаряжает орудия сам, а собственный ход позволяет уходить из-под контрбатарейного огня противника."
