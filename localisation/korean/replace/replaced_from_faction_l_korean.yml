 cento_alliance: "중앙조약기구"
 faction_cento_alliance: "중앙조약기구 회원국"
 faction_cento_alliance_desc: "CENTO, also known as the Central Treaty Organization is a military alliance recently revived to safeguard secular and democratic values in the middle east. Though the alliance was not very effective during the cold war, its members have vowed to change that and bring about more change in the region."
 faction_cento_TT: "§RFaction Special Rules§!:\n- Only select countries in the Middle East, Africa, Central Asia, and Pakistan may join the faction\n- Countries can only be called to defensive wars"
 faction_cento_alliance_call_ally_rule_tt: "§R중앙조약기구 (CENTO) 회원국은 오직 방어 전쟁에만 동맹국을 호출할 수 있습니다!§!"
 faction_cento_alliance_join_ally_rule_tt: "§R중앙조약기구 회원국은 오직 방어 전쟁에만 참전할 수 있습니다!!§!"
 faction_cento_alliance_join_faction_rule_tt: "§ROnly select countries in the Middle East, Africa, Central Asia, and Pakistan can join CENTO!§!"
 faction_cento_alliance_offer_join_faction_rule_tt: "§ROnly select countries in the Middle East, Africa, Central Asia, and Pakistan can join CENTO!§!"
 imperial_bloc_alliance: "제국주의 연합"
 faction_imperial_bloc_alliance: "제국주의 연합국"
 faction_imperial_bloc_alliance_desc: "The Imperial Bloc, often referred to as the neo-Central Powers has been formed by Germany to compete against CSTO and NATO domination in the region. Though Germany's formation of the pact was forceful in nature, it has led to a shift in a more bipolar world."
 faction_imperial_bloc_TT: "§R세력 특수 조건§!:\n- 오직 유럽 국가들만 가입이 가능함\n- §H공격 전쟁§!에 참전 가능함"
 faction_imperial_bloc_join_faction_rule_tt: "§R오직 유럽의 일부 국가만 제국주의 연합에 가입할 수 있습니다!§!"
 faction_imperial_bloc_alliance_offer_join_faction_rule_tt: "§R오직 유럽의 일부 국가만 제국주의 연합에 가입할 수 있습니다!§!"
 brics_alliance: "브릭스 (BRICS)"
 faction_brics_alliance: "BRICS 회원국"
 faction_brics_alliance_desc: "브릭스(BRICS)는 여러 지역에 걸쳐 있는 여러 국가의 집합체입니다. 이 협정은 처음에는 본질적으로 좀 더 경제적으로 설계되었지만 회원국들은 NATO와 같은 경쟁 동맹에 대해 방어 협정을 체결하는 것이 최선이라고 결정했습니다."
 faction_brics_TT: "§RFaction Special Rules§!:\n- Anyone that is approved by the core members is allowed in the faction\n- Countries can only be called to defensive wars"
 faction_brics_alliance_call_ally_rule_tt: "§R 브릭스 회원국은 오직 방어 전쟁에만 동맹국을 호출할 수 있습니다!§!"
 faction_brics_alliance_join_ally_rule_tt: "§R 브릭스 회원국은 오직 방어 전쟁에만 참전할 수 있습니다!§!"
 faction_brics_alliance_join_faction_rule_tt: "§R오직 승인받은 국가들만이 브릭스 (BRICS)에 가입할 수 있습니다!§!"
 faction_brics_alliance_offer_join_faction_rule_tt: "§R오직 승인받은 국가들만이 브릭스 (BRICS)에 가입할 수 있습니다!§!"
 mto_alliance: "지중해 연합 (MTO)"
 faction_mto_alliance: "지중해 연합 (MTO) 회원국"
 faction_mto_alliance_desc: "This country is a member of MTO (Mediterranean Treaty Organization), which partakes in the mutual defense of other Islamic nations that are in the MTO. The MTO also partakes in various economic projects across the Middle East and nearby areas, with the main goal of improving the economic wellbeing of Muslims"
 faction_mto_alliance_call_ally_rule_tt: "§R 지중해 연합 회원국은 오직 방어 전쟁에만 동맹국을 호출할 수 있습니다!§!"
 faction_mto_alliance_join_ally_rule_tt: "§R 지중해 연합 회원국은 오작 벙어 전쟁에만 참전할 수 있습니다!§!"
 faction_mto_alliance_join_faction_rule_tt: "§ROnly select countries in the Middle East and North Africa, plus Afghanistan, Pakistan, and Turkmenistan, can join MTO!§!"
 faction_mto_alliance_offer_join_faction_rule_tt: "§ROnly select countries in the Middle East and North Africa, plus Afghanistan, Pakistan, and Turkmenistan, can join MTO!§!"
