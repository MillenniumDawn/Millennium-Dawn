l_korean:
 ENG_royal_army: "British Army"
 ENG_royal_army_desc: "The British Army is the primary land force of the British Armed Forces, it can trace its roots back to the Scottish and English armies in 1707 when they were joined together in the Act of Union. It has been involved in almost all major wars, including the Seven Years War, Revolutionary War, Napoleonic Wars, Crimean War, and First & Second World Wars. In this time, it has evolved from a primarily Infantry force to a highly advanced and mechanised force with varying support elements and its world-class special forces, which have served as a benchmark for other international services"
 ENG_irish_referendum: "[GetYear] [NIR.GetFlag] Northern Irish Referendum for Independence"
 ENG_irish_referendum_desc: "The [NIR.GetFlag] Northern Irish people will vote on a referendum that will determine their future as a nation, constituent, and a player in the British Isles. The campaign runs until polling day, and the result will be whatever Northern Irish opinion has become by the time it is counted. Westminster can spend political capital and Treasury money to move it.\n\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_scottish_referendum: "[GetYear] [SCO.GetFlag] Scottish Referendum for Independence"
 ENG_scottish_referendum_desc: "The [SCO.GetFlag] Scottish people will vote on a referendum that will determine their future as a nation, constituent, and a player in the British Isles. The campaign runs until polling day, and the result will be whatever Scottish opinion has become by the time it is counted. Westminster can spend political capital and Treasury money to move it.\n\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 united_kingdom_focus: "영국 중점 계통도"
 britain_md.1.t: "영국을 향한 우리의 포부"
 britain_md.1.d: "국민이 목소리를 냈으며, 앞으로 국민을 대표할 정당으로 노동당이 선택되었습니다. 영국이 진정으로 최고가 되리라는 우리의 비전과 포부에는 한계가 없으며, 우리는 위대한 연합왕국의 문제들을 즉시 해결하기 시작할 것입니다."
 britain_md.2.t: "운에 맡길 것인가?"
 britain_md.2.d: "우리는 특정 틈새 산업에 대한 투자를 장려함으로써 국내 시장에 막대한 영향을 미칠 수 있습니다. 그러나 그렇게 하면 경쟁 산업에 투자한 투자자들에게 두려움을 심어 주어 경기가 소폭 침체될 수도 있습니다. 내각은 현재 이 조치가 지금 취할 수 있는 최선인지를 두고 의견이 갈려 있습니다."
 britain_md.3.t: "Making A Grand Promise"
 britain_md.3.d: "더 폭넓은 유권자층을 사로잡으려면 우리 내부 파벌 중 하나에 호소해야 합니다. 그렇게 하면 우리가 정부의 여러 부문을 효율적으로 운영할 수 있음을 보여 줄 뿐만 아니라 다른 사업에 투입할 약간의 추가 자금도 확보할 수 있습니다. 또한 이 파벌들에 대해 새로 얻은 영향력으로 향후 선거에서 정치적 경쟁자들에게 맞서 판세를 뒤집을 수 있을 것입니다."
 britain_md.4.t: "Who Do We Tax?"
 britain_md.4.d: "우리 정부는 특수한 상황에 직면해 있습니다. 정부의 세입을 늘리려면 사회 지출 사업을 위한 자금 조달을 위해 세금을 인상해야 합니다. 그러나 그렇게 하면 어떤 방식으로든 인구의 한 계층을 분노하게 만들 것이며, 전면적 과세는 우리의 평판에 가장 큰 타격을 줄 가능성이 높아 경고를 받아 왔습니다. 대신 우리 내각은 모두의 반감을 사지 않도록 인구의 한 계층에만 세금을 부과할 것을 제안하고 있습니다."
 britain_md.5.t: "영국은 뒤가 아닌 앞으로"
 britain_md.5.d: "우리는 일부 정치적 반대자들이 계속 요구하는 억압의 나락으로 사회가 퇴행하는 것을 막아야 합니다. 우리는 영국이 중단 없이 미래로 나아가도록 싸울 것입니다. 우리의 가치, 질서, 안정은 어떠한 상황에서도 훼손되어서는 안 되며, 우리는 투표에서 계속 선두를 지키기 위해 싸울 것입니다."
 britain_md.6.t: "영국 하늘 긁어내기"
 britain_md.7.t: "아무도 뒤처지지 않도록"
 britain_md.7.d: "유럽, 아시아, 아프리카, 아메리카 등 전 세계 어디에서나 불평등이 계속 심화되고 있습니다. 임금은 정체되고 물가는 치솟아 살아가는 것 자체가 고된 일이 되었습니다. 그러나 영국 시민들에게는 그럴 필요가 없습니다! 신속한 개혁과 새로운 정책으로 우리는 이러한 불평등 심화의 추세에 굴복할 필요가 없음을 세계에 입증할 것입니다."
 britain_md.8.t: "둘 사이의 연관성?"
 britain_md.8.d: "정치 스펙트럼의 우파에 속한 많은 사람들이 범죄 증가가 최근 몇 년간의 이민 증가와 직접적으로 연관되어 있다고 주장했습니다. 많은 이들이 이러한 주장을 외국인 혐오적이고 편협하다고 규정하며 반박하지만, 일부 이민자와 난민이 [ENG.GetAdjective] 문화에 동화하지 못하는 것이 원인이라고 주장하는 이들도 있습니다."
 britain_md.9.t: "언제나 더 나아질 수 있다는 가능성"
 britain_md.9.d: "영국이 다른 세계와 같을 필요는 없으며 더 나아질 수 있습니다. 진지한 정치 개혁을 통해 우리는 민주주의 후퇴의 흐름을 거스르고 영국을 가능한 최선의 모습으로 만들 수 있습니다. 이번에 노동당은 급진적인 사회 및 정치 개혁을 이루겠다고 공약했으며, 우리의 메시지는 그 어느 때보다도 영국 국민에게 가닿고 있습니다."
 britain_md.10.t: "로비 활동법 재검토?"
 britain_md.10.d: "우리 내각의 일부는 로비 활동법을 재검토할 것을 점점 더 강하게 요구하고 있습니다. 물론 그러한 조치는 소란을 일으킬 것이며 정부 내 부패 사례가 증가할 수 있습니다. 그러나 당을 위한 신속한 지지와 자금을 확보하고자 한다면, 최소한 법안의 일부 수정을 검토해 볼 만합니다.."
 britain_md.11.t: "영국에 상식을 되찾아 주자"
 britain_md.11.d: "혼란으로 가득한 이 나라에 어느 정도의 정상 상태를 되찾아 줄 때가 되었습니다. 노동당 인사들이 돌이킬 수 없는 피해를 초래하는 개혁을 통과시키기 시작하면서 상식은 완전히 내팽개쳐진 듯합니다. 우리 정부는 브뤼셀이나 좌파 내각이 이끄는 국가가 아니라, 더 강하고 더 독립적인 국가를 향해 영국을 이끌 것입니다."
 britain_md.12.t: "[FROM.GetName] Requests Military Access"
 britain_md.12.d: "유럽을 방위에 있어 보다 유연한 대륙으로 만들기 위한 노력의 일환으로 보이는데, [ENG.GetAdjective]은(는) 통행권을 요청하는 서한을 보내기로 결정했습니다. 우리가 이로써 얻는 것은 사실상 없겠지만, 잃는 것도 기본적으로 없을 것입니다."
 britain_md.13.t: "영국의 개입"
 britain_md.13.d: "영국 정부는 우리가 적과 싸우고 국가의 주권을 수호하는 것을 돕겠다고 약속했습니다. 그들이 대가로 무엇을 기대하는지는 분명히 밝히지 않았습니다. 믿을 만한 정보원으로부터 입수한 정보에 따르면, 영국 정부는 우리에 대한 상당한 영향력을 보유할 경우 프리타운에 있는 우리의 자원을 500일 동안 장악할 계획입니다. 우리가 그들의 병력 배치를 허용하는지 여부와 관계없이 이를 실행할 의도입니다."
 britain_md.14.t: "우리 자원을 장악한 영국!"
 britain_md.14.d: "영국은 우리에 대한 상당한 영향력을 보유하고 있다는 이유로 우리의 자원을 장악했습니다. 이는 그들이 철수할 때까지 500일간 지속될 것입니다."
 britain_md.15.t: "임무 종료: 바라스"
 britain_md.15.d: "시에라리온에서의 우리의 임무가 끝나가고 있으며, 시에라리온의 자원을 영국의 수입을 위해 수출용으로 이전해 오던 기관들을 철수시킬 준비를 시작했습니다."
 britain_md.16.t: "감비아 쿠데타?"
 britain_md.16.d: "감비아에서 [GAM.GetLeader]이(가) 이끄는 폭압적 국가에 마침내 종지부를 찍을 때가 왔습니다. 우리는 그 정부를 전복시킬 계획을 조직할 것이나, 너무 무리하면 내전으로 번져 우리의 손을 벗어날 수도 있습니다."
 britain_md.17.t: "감비아 쿠데타 성공"
 britain_md.17.d: "우리는 감비아의 억압적인 정권을 성공적으로 축출하고 우리가 선호하는 정부를 집권시켰습니다. 감비아 국민은 더 이상 불필요한 억압 아래서 고통받지 않을 것입니다."
 britain_md.18.t: "감비아 쿠데타 실패"
 britain_md.18.d: "우리는 [GAM.GetLeader]을(를) 축출하는 데 실패했으며, 그 결과 영국 군인 여러 명을 잃었습니다. 우리의 쿠데타 시도는 국제적으로 가혹한 감시를 받고 있으며, 감비아 정부와의 관계도 악화되었습니다."
 britain_md.19.t: "감비아에서의 대성공을 거둔 쿠데타"
 britain_md.19.d: "우리는 감비아에서의 노력에서 기대 이상의 성공을 거두었습니다. 억압적인 정부를 전복했을 뿐 아니라 이 국가에 대한 확고한 통제권도 확립하여, 사실상 위성국으로 만들 수 있었습니다."
 britain_md.20.t: "델타 수비 작전: 성공"
 britain_md.20.d: "우리는 델타 지역의 전략적 유전을 확보하는 데 성공했으며, 나이지리아군이 수도를 향해 북쪽으로 후퇴하는 모습이 목격되었습니다. 그들이 보복할지 여부는 현재로서는 알 수 없으나, 지금은 전리품을 누리고 있습니다."
 britain_md.21.t: "델타 지역의 석유를 장악한 영국군"
 britain_md.21.d: "영국군은 우리의 주권을 심각하게 침해했으며, 우리 정부가 불안정하고 신뢰할 수 없다고 주장하면서 우리의 신성한 유전을 '임시 보호' 아래 있다고 선언했습니다. 그들이 왜 군사 행동이 향후 최선의 방책이라고 판단했는지는 알 수 없으나, 한 가지 분명한 것은 우리가 이를 가만히 누워 당하고 있을 수는 없다는 것입니다."
 britain_md.22.t: "나이지리아의 보복"
 britain_md.22.d: "나이지리아군의 보복 공격으로 영국 군인 여러 명이 부상을 입었고 몇몇은 사망하기까지 했습니다. 이는 우리가 델타 지역의 여러 유전을 장악하여 불안정한 나이지리아 정부로부터 중요한 석유 접근권을 확보한 데 대한 대응입니다. 그들에게 분수를 알려 주기 위해 나이지리아의 수도를 점령해야 합니다."
 britain_md.23.t: "영국군 철수"
 britain_md.23.d: "위대한 나이지리아군의 위세와 [NIG.GetLeader]의 용맹한 지도력이 두려웠는지, 비겁한 영국군은 델타 지역에서 철수하고 모든 석유 작전을 중단했습니다. 이 점에서 우리는 승리했으며 더 이상의 영국의 보복은 예상하지 않습니다."
 britain_md.24.t: "의제를 선택하십시오"
 britain_md.24.d: "우리 당이 선거에서 승리했으며, 이제 의제를 선택할 때가 되었습니다."
 britain_md.25.t: "영국 - 안내, 꼭 읽어 주십시오"
 britain_md.25.d: "안녕하세요! 영국을 플레이 국가로 선택하신 것 같습니다. 즐거운 시간 되시기를 바랍니다!\n\n현재 플레이 중인 것은 영국 리워크의 1단계로, 개편된 중점 트리, 결정 모음, 군주제 메커니즘이 포함되어 있습니다. 더 나올 것이 있는지 궁금하실 수 있는데, 답은 그렇다는 것입니다. 앞으로 더 추가될 예정입니다.\n\n2단계:\n2단계에서는 훨씬 더 심화된 분권 시스템과 개선된 하원 시스템을 기대하실 수 있습니다.\n\n3단계:\n3단계에서는 확장된 외교 정책 트리, 추가 정치 노선 등을 기대하실 수 있습니다!\n\n트리에 대한 의견이 있으시면 저희 디스코드, 레딧 또는 깃허브에서 알려 주십시오!\n\n - MD 영국 팀"
 britain_md.26.t: "새로운 포클랜드 정책을 향해"
 britain_md.26.d: "현재 포클랜드 제도의 통합을 위한 노력을 더 기울이거나 추가 조치를 추진하자는 요구가 높아지고 있습니다. 후자는 다소 공격적일 수 있으나 결국 장기적으로는 우리에게 이익이 될 것입니다. 또한 남아메리카 지역에서 우리의 이미지를 공고히 하기 위해 포클랜드를 반환해야 한다고 바라는 이들도 있습니다."
 ENG_british_flag_on_the_moon: "달 위의 영국 국기"
 ENG_british_flag_on_the_moon_desc: "영국이 달에 영국 기지를 건설하려는 야심 찬 달 탐사 임무에 착수합니다. 이 달 탐사 계획은 우주 탐사에 대한 국가의 헌신을 의미하며, 기술력을 과시하고 과학 혁신을 촉진합니다. 우주 개척의 선구자가 되어 우주 탐사 분야에서 영국의 국제적 위상을 높이십시오."
 ENG_set_sail_to_mars: "화성을 향한 출항"
 ENG_set_sail_to_mars_desc: "지구의 경계를 넘어, 영국은 과감하게 화성에 거점을 마련하는 것을 목표로 합니다. 이 선구적인 계획은 화성 탐사를 개척하고 우주 기술의 한계를 넓히며, 붉은 행성에 도달하려는 인류의 여정에서 영국을 핵심 주체로 자리매김하는 데 초점을 둡니다. 화성 정복이라는 도전에 나서 행성 간 탐사의 미래에서 영국의 역할을 규정하십시오."
 ENG_new_thirteen_colonies: "새로운 13개 식민지"
 ENG_new_thirteen_colonies_desc: "새로운 개척지를 향한 항로를 그리며, 영국은 역사에서 영감을 얻어 화성에 새로운 13개 식민지를 건설하는 구상을 합니다. 본래의 13개 식민지의 정신을 되살리는 이 야심 찬 계획은 화성 정착에 대한 영국의 의지와 행성 간 식민지화라는 도전을 받아들이는 자세를 보여 줍니다. 붉은 행성에 새로운 유산을 만드는 일을 선도하십시오. 그곳에서 영국의 개척자들은 국가의 역사적 뿌리를 떠올리게 하는 여정에 오를 것입니다."
 ENG_asteroid_mining: "소행성 채굴"
 ENG_asteroid_mining_desc: "영국이 천체 자원 수확을 받아들이면서 영국 왕립 소행성 채굴 회사와 함께 우주로 나아가십시오. 소행성에서 귀중한 자원을 추출하는 것을 목표로 하는 이 계획은 우주 자원 활용과 첨단 기술을 개척하려는 국가의 헌신을 상징합니다."
 ENG_standardized_space_parts: "표준화된 우주 부품"
 ENG_standardized_space_parts_desc: "영국에서 추진하는 표준화된 우주 부품을 통해 우주 탐사의 경제성에 혁신을 일으키십시오. 구성품을 간소화하고 표준화함으로써 이 계획은 우주 사업의 비용 효율을 높이는 것을 목표로 하며, 접근성 높고 경제적인 우주 사업을 촉진하려는 국가의 의지를 보여 줍니다."
 ENG_virgin_galactic: "버진 갤럭틱"
 ENG_virgin_galactic_desc: "우주 관광 산업의 선두 주자로서 버진 갤럭틱은 우주를 모두에게 열린 곳으로 만들고자 노력합니다. 혁신적인 우주선과 우주 탐사의 한계를 넓히려는 의지를 바탕으로, 버진 갤럭틱은 민간 우주 모험의 미래를 만들어 가는 영국의 역할을 상징합니다."
 ENG_british_commercial_spaceport: "영국 상업 우주항"
 ENG_british_commercial_spaceport_desc: "우주를 향한 세계적 경쟁이 가열되면서, 영국은 우주 탐사의 최전선에서 입지를 확보하는 것이 필수적임을 인식합니다. 영국 상업 우주항의 건설은 상업 우주 사업에서 국가의 발판을 넓히는 핵심 중점입니다. 전용 우주항의 건설과 개발에 투자함으로써 영국은 혁신을 촉진하고 국제 협력을 유치하며 항공우주 산업을 새로운 높이로 끌어올려, 우주 개척의 핵심 주체로서 유망한 미래를 보장하고자 합니다."
 ENG_united_kingdom_space_command: "영국 우주사령부"
 ENG_united_kingdom_space_command_desc: "우주가 전략적 영향력의 새로운 무대가 되면서, 영국은 우주 작전 분야의 노력을 통합할 필요성을 인정합니다. 영국 우주사령부의 설립은 국가의 우주 역량을 통합하고 강화하기 위한 결정적인 중점입니다. 지휘 체계를 일원화하고 합동 작전을 촉진하며 첨단 기술에 투자함으로써, 영국은 우주 영역에서 자국의 이익을 확보하고 별들 사이에서 강력한 존재감을 보장하며 우주 시대의 국가 안보를 수호하고자 합니다."
 ENG_istari_programme: "ISTARI 계획"
 ENG_istari_programme_desc: "변화하는 세계 정세에 대응하여, 영국은 사이버 영역에서의 정보, 감시, 표적 획득 및 정찰에 전념하는 야심 찬 중점인 ISTARI 계획을 도입합니다."
 ENG_space_red_coats: "우주 퓨질리어"
 ENG_space_red_coats_desc: "영광스러운 과거에서 영감을 얻어, 영국은 21세기 우주 퓨질리어와 함께 레드코트의 유산을 되살립니다. 역사적 불굴의 정신을 불러일으키는 이 중점은 영국의 우주 탐사를 새로운 시대로 이끕니다. 상징적인 붉은색 군복을 입은 우주 퓨질리어는 우주를 탐사하며 탐험의 전통을 구현하고 천공 전역에 영국의 영향력을 투사하고자 합니다."
 ENG_1st_space_force_division: "제1 우주군 사단"
 ENG_1st_space_force_division_desc: "지상의 경계를 넘어서는 항로를 그리며, 영국은 영국 우주군 사단을 창설하는 대담한 길을 개척합니다. 역사상 유례없는 이 일은 영국이 최초의 전담 우주 사단을 편성하는 새로운 시대의 도래를 알립니다. 천체의 이익을 수호하고 미지를 받아들이는 임무를 맡은 우주군 사단은 영국 국기가 별들 사이에서 휘날릴 우주 개척지를 탐사하고 확보하려는 국가의 의지를 상징합니다."
 ENG_space_capabilities: "사이버 공간 역량"
 ENG_space_capabilities_desc: "디지털 영역의 막중한 중요성을 인식한 영국은 사이버 공간 역량 강화에 중점을 둡니다. 정보가 곧 힘인 시대에, 이 계획은 사이버 공간 작전에서 국가의 역량을 강화하려는 의지를 보여 줍니다."
 ENG_strategic_defence_review: "[GetYear]년 국방 백서"
 ENG_strategic_defence_review_desc: "우리의 우선순위와 위협은 끊임없이 변하며, 우리의 군 관료 체계도 이에 대응하도록 진화해야 합니다. 정부 전반의 파트너 및 동맹국과 함께 새로운 국가 안보 대응을 조율함으로써, 우리 군이 변화에 적응하고 영국의 안보를 겨냥한 위협에 대응할 준비를 유지하도록 보장할 수 있습니다."
 ENG_AS90: "AS90 '브레이브하트'"
 ENG_AS90_desc: "1990년대용 포병 체계(Artillery System for the 1990s)이자 155mm L131 포 장비라고도 불리는 AS90은 영국 육군이 사용하는 주력 장갑 자주포입니다. 1982년부터 1987년까지 비커스 조선·기술 회사의 무기 부문이 설계 및 제작했으며, 1992년에 생산이 이어져 179대가 생산되었습니다. 낡은 105mm FV433 애벗과 더 오래된 M109 155mm 자주포를 대체했습니다. 52구경 화기를 발사할 수 있는 더 긴 포신을 갖추어 지원 없이도 사거리를 늘리고 사거리 연장탄을 쓰도록 AS90을 현대화하려는 노력이 제안되었습니다."
 ENG_operation_excellence: "특별 사령부"
 ENG_utility_vehicle_modernisation: "다목적 차량 현대화"
 ENG_utility_vehicle_modernisation_desc: "분쟁기 북아일랜드에서의 경험을 통해, 스내치 랜드로버와 같이 육군이 운용하는 현 군용 보병 다목적 차량은 급조폭발물과 지뢰에 대해 거의 또는 전혀 방호를 제공하지 못하며, 생존 보고에 따르면 오히려 최초 폭발의 생존자에게 해를 입힌다는 점이 분명해졌습니다. 이에 국방부는 미국의 '쿠거' MRAP와 같이 지뢰 방호 및 매복 방호 장갑을 갖춘 현대 차량을 도입하는 방안을 모색하기 시작했습니다."
 ENG_nlaw_anti_tank_system: "NLAW 대전차 체계"
 ENG_nlaw_anti_tank_system_desc: "사브 보포르스 다이내믹스의 NLAW, MBT LAW 또는 R85는 보병용으로 설계된 발사 후 망각식의 경량 견착 발사식 일회용 직사 미사일 체계입니다. 영국과 스웨덴 국방부를 위해 사브가 설계했으며, 영국에서 팀 NLAW 아래 여러 하청업체가 참여했고 탈레스 에어 디펜스가 크게 관여했습니다."
 ENG_startstreak_anti_air_system: "스타스트리크 대공 체계"
 ENG_startstreak_anti_air_system_desc: "스타스트리크는 영국의 단거리 지대공 미사일로, 휴대용 방공 시스템(MANPADS)이면서 기동 방공을 위해 헬리콥터와 차량에 다양한 형태로 탑재됩니다. 북아일랜드 벨파스트의 탈레스 에어 디펜스가 제조합니다. 발사 후 미사일은 마하 4를 넘는 속도로 가속하여 현존하는 가장 빠른 단거리 지대공 미사일이 됩니다. 또한 레이저 빔 라이딩 방식의 자탄 3발을 표적에 발사하여 명중 가능성을 높이는 방식으로 잠재력을 키웠습니다."
 ENG_M270: "M270 재무장"
 ENG_M270_desc: "국방부는 유도 다연장 로켓 체계 탄약 구매를 보완하기 위해 현역 M270 궤도형 미사일 발사 체계의 전면 개량과 이들 체계에서 운용할 각종 미사일에 투자할 계획입니다. 새로운 엔진, 장갑 방호, 현대화된 사격 통제 체계를 도입하려 합니다."
 ENG_mobile_fires_platform_program: "기동 화력 플랫폼 계획"
 ENG_mobile_fires_platform_program_desc: "냉전의 종식과 독일 평원에서의 분쟁에 대한 예상이 흐려진 이후 육군의 155mm 포병 체계 보유량은 감소했으나, 새로운 위협이 지평선에 떠오른 지금 국방부는 이 능력을 되살리기 위한 조치를 취하기로 결정했습니다. 이 계약을 이행하겠다는 수많은 후보가 나섰지만 성공하는 것은 단 하나뿐일 것입니다."
 ENG_fres_program: "FRES 계획"
 ENG_fres_program_desc: "FRES(미래 신속 효과 체계, Future Rapid Effect System) 계획은 군사 역량 개발에 대한 미래 지향적 접근을 나타냅니다. 기민성과 적응력에 중점을 둔 FRES는 영국군에 장갑차량과 지원 체계를 포함한 다목적 지상 플랫폼 일체를 제공하는 것을 목표로 합니다."
 ENG_fix_civil_servant: "'공무원' 고치기"
 ENG_fix_civil_servant_desc: "원래 병사들 사이에서 잦은 불만과 성능 문제에 시달리던 L85A1 소총은 까다로운 정비와 불안정한 작동에 대응하여 포괄적인 개량을 거쳤습니다. 신뢰성이 낮고 기능이 복잡하다는 인식 때문에 흔히 '공무원'이라 불린 이 우려는 2000년부터 2002년까지 대대적인 개조를 촉발했습니다. 기존 L85A1 자동 소총 32만 정 중 약 20만 정이 개량되었습니다."
 ENG_modern_littoral_force: "현대 연안 전력"
 ENG_trident_nuclear_program: "트라이던트 핵 계획"
 ENG_general_dynamics_ajax: "제너럴 다이내믹스 아약스"
 ENG_general_dynamics_ajax_desc: "최첨단 정찰 차량인 제너럴 다이내믹스 아약스는 영국군 현대화 노력의 핵심으로 부상했습니다. 현대전의 까다로운 요구를 충족하도록 설계된 이 기민하고 선진적인 장갑차량은 첨단 기술을 통합하여 비길 데 없는 정찰 능력을 가능케 했습니다."
 ENG_challenger_lethality_improvement_programme: "챌린저 치명성 개선 계획"
 ENG_challenger_lethality_improvement_programme_desc: "챌린저 치명성 개선 계획은 현재의 L30A1 강선포를 레오파르트 2와 M1 에이브럼스가 사용하는 라인메탈 120mm 활강포로 교체하려던 계획이었습니다. 활강포를 사용하면 챌린저 2가 열화우라늄탄에 대한 것과 같은 정치적·환경적 반대에 부딪히지 않는 텅스텐계 운동에너지 관통탄을 포함한 NATO 표준 탄약을 사용할 수 있었을 것입니다."
 ENG_challenger_3: "챌린저 3"
 ENG_challenger_3_desc: "영국이 자랑스럽게 개발한 챌린저 3 전차는 최첨단 기갑전의 정수를 보여 줍니다. 최신 기술, 막강한 화력, 강화된 방호력으로 챌린저 3은 우월한 전장 지배력을 보장합니다. 이 현대화된 전차는 현대전의 도전에 맞설 준비가 된 강력한 기갑 전력을 유지하려는 영국의 의지를 강조합니다."
 ENG_modern_landing_craft: "현대식 상륙정"
 ENG_mechanised_amphibious_assault: "기계화 상륙 강습"
 ENG_aircraft_ai_integration: "항공기 AI 통합"
 ENG_aircraft_ai_integration_desc: "양보다 질이라는 원칙에 따라 영국은 군대의 우수성과 기술적 우위를 우선시합니다. 이 국가 정신은 첨단의 정교한 장비 조달을 강조하여 막강하고 기술적으로 발전된 방위 태세를 보장합니다. 질에 집중함으로써 영국은 군의 효율을 극대화하고 현대적 도전 앞에서 전략적 우위를 만들고자 합니다."
 ENG_strike_brigades: "타격 여단"
 ENG_future_soldier_armed_forces: "미래 병사 군대"
 ENG_future_soldier_armed_forces_desc: "미래 병사 구상은 영국을 포함한 군대들이 채택한 미래 지향적 전략입니다. 병사들에게 최첨단 기술과 능력을 갖추게 하여 현대 전장에서의 효율을 높이는 데 중점을 둡니다."
 ENG_joint_expeditionary_force: "합동 원정군"
 ENG_joint_expeditionary_force_desc: "2012년에 시작되어 당시 국방참모총장 데이비드 리처즈 경 대장이 도입한 합동 원정군(JEF)은 영국이 아프가니스탄과 이라크 작전을 중시하던 시기에 합동 신속 대응군(JRRF)이 해체되면서 등장했습니다. 영국 해군, 영국 해병대, 영국 육군, 영국 공군의 인원과 장비로 구성되는 JEF의 영국 구성군은 한층 높은 통합을 우선시합니다. 이 통합은 특히 다른 나라 군대와 함께 활동할 때 강조되며, 이전 모델에서의 중대한 전환을 나타냅니다."
 ENG_carrier_group_debate: "항공모함 전단 논쟁"
 ENG_worldwide_reach: "전 세계적 투사력"
 ENG_worldwide_reach_desc: "영국은 한때 자국의 이익을 지키기 위해 전 세계에 영향력을 미치던 초강대국이었습니다. 전 지구에서 우리의 이익을 유지하려면 그 힘을 되찾아야 합니다."
 ENG_national_service_debate: "국민 병역 논쟁"
 ENG_national_service_debate_desc: "지원병에 기반한 군대로는 전 세계에서 늘어나는 영국군 수요를 감당할 수 없습니다. 수요를 충족하려면 징병을 늘려야 합니다."
 ENG_army_special_operations_brigade: "육군 특수작전 여단"
 ENG_reestablish_far_east_command: "극동 사령부 재건"
 ENG_reestablish_far_east_command_desc: "영국의 극동 사령부 재건은 이 중요한 지역의 군사 역량을 강화하기 위한 전략적 방향 전환을 의미합니다. 이 계획에는 변화하는 안보 역학에 효과적으로 대응하기 위한 지휘 구조, 작전 부대, 병참 지원의 배치가 포함됩니다. 극동에서의 주둔과 협조를 강화함으로써 영국군은 지역적 도전에 능숙히 대응하고 동맹국과의 협력을 증진하며, 세계에서 전략적으로 중요한 이 지역의 전반적인 안정에 크게 기여하고자 합니다."
 ENG_britannia_armed_forces: "브리타니아 군"
 ENG_britannia_armed_forces_desc: "세계적인 군사력을 되살리려는 우리의 노력 끝에, 마침내 전 세계에서 영국의 이익을 방어할 수 있는 군대를 갖추었다고 말할 수 있습니다."
 ENG_allied_basing_efforts: "연합 기지 구축 노력"
 ENG_allied_basing_efforts_desc: "연합 기지 구상은 동맹 내 회원국 간 전략적 역량을 강화하기 위한 단합된 의지를 나타냅니다. 이 구상 아래 영국은 철도, 공군 기지, 항만 등 기반시설의 지속적이고 상당한 개선 혜택을 받습니다. 이 지속적인 개선은 영국의 병참 역량과 전반적인 작전 효율을 높여 줍니다."
 ENG_reactivate_naval_defense_act_1889: "1889년 해군 방위법 재가동"
 ENG_reactivate_naval_defense_act_1889_desc: "역사적 해양 강국의 위상에 대한 상징적 경의의 표현으로, 1889년 해군 방위법의 재가동은 해군 역량 강화에 대한 미래 지향적 의지를 나타냅니다. 이 법안은 과거의 정신을 현대 해군 대비 태세로 이어 가는 것을 목표로 합니다. 원래 법의 원칙을 되살림으로써 영국은 강력하고 기술적으로 발전된 해군을 유지하려는 의지를 알립니다. 이 법에는 해군 자산의 현대화, 해군 기반시설의 확장, 영국 해군이 세계 무대에서 막강한 존재로 남도록 보장하기 위한 전략적 투자 조항이 포함될 수 있습니다."
 ENG_royal_navy: "영국 해군"
 ENG_royal_navy_desc: "영국 해군은 수 세기에 걸친 영광스러운 유산을 지닌 세계 최고의 해군력 중 하나입니다. 적응력과 기술력으로 명성이 높은 영국 해군은 영국의 해양 이익을 수호하고 세계적으로 힘을 투사하는 데 중요한 역할을 합니다. "
 ENG_british_foreign_legion: "영국 외인부대"
 ENG_british_foreign_legion_desc: "국제적 복무 모델을 받아들여, 이 부대는 영국군에서 복무하기를 원하는 외국 국적자를 환영합니다. 동료애, 다양성, 공동의 목적의식을 키우도록 설계된 영국 외인부대는 다양한 배경의 사람들이 영국의 방위에 기여할 수 있는 독특한 통로가 됩니다."
 ENG_multi_ocean_navy: "다대양 해군"
 ENG_multi_ocean_navy_desc: "전 세계에서 영국의 이익을 보호하려면 대양 전역에 타격을 가할 수 있도록 해군 역량을 늘려야 합니다."
 ENG_Strategic_Aircraft_Training: "전략 항공기 훈련"
 ENG_Strategic_Aircraft_Training_desc: "현대에는 모든 대양을 가로질러 타격할 수 있는 공군을 보유하는 것이 필수적입니다. 이를 가능케 하려면 전략 항공기 작전을 늘려야 합니다."
 ENG_field_army_expansion: "야전군 확장"
 ENG_field_army_expansion_desc: "야전군 확장 구상은 강력하고 적응력 있는 군사 역량을 보장하기 위해 지상군을 강화하려는 영국의 전략적 의지를 나타냅니다. 이 확장에는 영국 육군의 핵심 지상군을 아우르는 야전군의 규모와 역량 증대가 포함됩니다."
 ENG_type_31_frigate_inspiration_class: "31형 호위함 인스퍼레이션급"
 ENG_type_31_frigate_inspiration_class_desc: "31형은 호위함 전력 가운데 범용 임무를 맡는 쪽으로, 2019년에 척당 2억 5천만 파운드의 고정 가격으로 발주되었습니다. 밥콕이 로사이스에서 다섯 척 모두를 덴마크 이버 휘트펠트급에서 파생된 애로헤드 140 설계로 건조합니다. 이 설계는 57mm 보포르스 함포와 시 셉터를 갖추고 향후 개량을 위한 여유를 의도적으로 남겨 둔 대형 디젤 전기 추진 선체입니다. 벤처러, 액티브, 불독, 캠벨타운, 포미더블은 함대 역사 전반의 이름을 되살린 것입니다."
 ENG_multi_role_support_ship_project: "다목적 지원함 사업"
 ENG_multi_role_support_ship_project_desc: "다목적 지원함은 올비언, 불워크, 베이급을 하나의 유연한 선체로 대체하려는 함정입니다. 한 번의 대규모 상륙을 위해 건조된 도크함이 아니라 임무 격납고, 비행 갑판, 모듈식 거주 공간을 중심으로 설계되어, 같은 함정이 코만도 급습 부대를 수송하거나 재난 구호 작전을 수행하거나 무인 체계의 전방 기지 역할을 할 수 있습니다."
 ENG_expanded_carrier_wing_procurement: "항공모함 항공단 확대 조달"
 ENG_expanded_carrier_wing_procurement_desc: "확대된 항공모함 항공단에 투자함으로써 영국은 힘을 투사하고 해양 이익을 보호하며 국제 안보 노력에 크게 기여하고자 합니다. 이 구상은 급변하는 세계 안보 환경 속에서 현대적이고 유능한 해군 항공 전력을 유지하려는 국가의 의지를 반영합니다."
 ENG_strategic_aircraft_strategy: "전략 항공기 전략"
 ENG_strategic_aircraft_strategy_desc: "전략 항공기 전략은 전략 항공 자산의 획득, 배치, 운용에 대한 영국의 접근 방식을 개괄합니다. 이 포괄적 전략에는 국가 방위 우선순위, 세계 안보 도전, 기술 발전 등 다양한 고려 사항이 포함됩니다."
 ENG_continent_operational_considerations: "대륙 작전 고려 사항"
 ENG_continent_operational_considerations_desc: "우리는 군과 동맹국에 대한 우리의 책무를 우선해야 합니다. 따라서 육군 중 어느 병과를 전문화할지 선택해야 합니다."
 ENG_astute_class: "애스튜트급 잠수함"
 ENG_astute_class_desc: "애스튜트급은 영국 해군에서 운용되는 최신 원자력 추진 함대 잠수함급입니다. 이 잠수함들은 배로인퍼니스의 BAE 시스템즈 서브마린스가 건조하고 있습니다."
 ENG_type_45_destroyer_upgrades: "45형 구축함 개량"
 ENG_type_45_destroyer_upgrades_desc: "45형 구축함 개량 사업은 첨단 기술과 체계 개선을 통해 영국 해군 45형 구축함의 능력을 향상시키는 것을 목표로 합니다. 주요 중점 분야는 레이더, 전투 체계, 추진 체계, 미사일 방어 강화입니다."
 ENG_dreadnought_class: "드레드노트급 잠수함"
 ENG_dreadnought_class_desc: "드레드노트급 잠수함 사업은 영국 해군을 위한 차세대 탄도 미사일 잠수함의 설계, 건조, 통합을 포함합니다. 이 잠수함들은 첨단 스텔스, 추진, 전략 무기 능력을 갖추어 영국의 신뢰할 수 있는 핵 억지 능력을 보장할 것입니다."
 ENG_type_26_frigate: "26형 호위함"
 ENG_type_26_frigate_desc: "글래스고, 카디프, 벨파스트와 그 자매함들의 이름을 딴 시티급이라 불리는 26형은 호위함 전력 가운데 대잠수함 임무를 맡는 쪽입니다. 2017년부터 클라이드에서 BAE 시스템즈가 건조하며, 음향 저감을 중심으로 구성되어 있습니다. 방진 가대에 장착된 디젤 전기 및 가스터빈 추진 설비, 소나 2087 예인 배열, 함 중앙부의 보트·컨테이너·무인 체계용 임무 격납고가 그것입니다. 8척이 항공모함과 억지력을 호위할 것이며, 추가 선체는 오스트레일리아와 캐나다에 판매됩니다."
 ENG_type_83_destroyer: "83형 구축함"
 ENG_type_83_destroyer_desc: "83형 구축함은 2030년대 중후반에 영국 해군 함대에 합류할 예정인 차세대 유도 미사일 구축함급입니다. 이 제안된 함급은 변화하는 해군 요구를 충족하는 첨단 능력과 현대화된 특징을 약속합니다. 다목적성과 강력함을 염두에 두고 설계된 83형 구축함은 영국 해군의 해양 역량에서 중대한 진전을 나타내며, 미래 작전 환경에서의 대비 태세와 효율을 보장합니다."
 ENG_qinetiq_dragonfire_system: "키네틱 드래곤파이어 체계"
 ENG_qinetiq_dragonfire_system_desc: "드래곤파이어는 영국의 최첨단 레이저 지향성 에너지 무기 기술 시연체를 대표합니다. 2017년 런던에서 열린 국제 방위·안보 장비 박람회에서 공개되었으며, MBDA UK, 레오나르도 UK, 키네틱, 국방과학기술연구소가 협력하는 UK 드래곤파이어가 개발합니다. 핵심 기술 시연체로서 드래곤파이어는 레이저 지향성 에너지 무기와 영국군 내 잠재적 활용을 평가하기 위한 엄격한 시험을 거칠 것이며, 이는 군사 혁신과 역량 개발의 중대한 진전을 의미합니다."
 ENG_auxiliary_royal_navy: "보조 영국 해군"
 ENG_auxiliary_royal_navy_desc: "보조 영국 해군은 역사적으로 분쟁이나 위기 시 영국 해군의 작전을 지원하고 보충하는 민간 인원 운용 함선을 가리킵니다."
 ENG_revitalise_merchant_navy: "상선단 재활성화"
 ENG_revitalise_merchant_navy_desc: "영국 제국은 한때 통상 위에 세워졌으며, 우리의 전 세계 상선단은 우리의 영광이자 토대입니다. 우리 상선단이 다시 한번 전 세계로 뻗어 나가게 합시다."
 ENG_bay_slass_landing_ships: "베이급 상륙함"
 ENG_bay_slass_landing_ships_desc: "베이급 상륙함은 인도적 지원, 재난 구호, 상륙 강습 임무를 포함한 다양한 군사 작전을 지원하도록 설계된 다목적 상륙 함정입니다. 이 함정들은 넓은 비행 갑판과 상륙정 및 수륙양용 차량을 발진·회수하기 위한 웰 데크를 갖추고 있습니다."
 ENG_river_class_patrol_boat: "리버급 초계정"
 ENG_river_class_patrol_boat_desc: "리버급 초계정은 해양 보안, 국경 방위, 법 집행 임무에 투입되는 다목적 외해 초계 함정입니다. 첨단 감시·통신 체계를 갖춘 이 초계정들은 연안 해역을 효과적으로 순찰하며 영토 보전과 해양 이익을 수호합니다. 지구력과 유연성을 염두에 두고 설계된 리버급 함정은 영국 해역 안팎에서 해양 안보를 강화하고 해양법을 수호하는 데 중요한 역할을 합니다."
 ENG_point_class_sealift_ships: "포인트급 해상 수송선"
 ENG_point_class_sealift_ships_desc: "포인트급 해상 수송선은 원정 작전을 지원하기 위해 군 화물과 장비를 수송하도록 설계된 영국 왕립 함대 보조대의 핵심 자산입니다. 이 롤온/롤오프 선박은 다양한 항만과 해양 환경에서 차량과 보급품을 효율적으로 선적·하역할 수 있는 다목적 화물 취급 능력을 갖추고 있습니다. 전략 수송 능력을 갖춘 포인트급 선박은 영국의 병참 역량에 크게 기여하며, 평시와 분쟁 상황 모두에서 군 병력과 장비의 신속한 전개를 가능케 합니다."
 ENG_bae_cv90_MkIV: "BAE CV90 Mk IV"
 ENG_bae_cv90_MkIV_desc: "BAE CV90 Mk IV는 CV90 보병전투차의 개량형으로, 현대전을 위한 첨단 기술과 개선 사항을 갖추었습니다. 기동성, 생존성, 화력이 향상되어 전장에서 기갑 보병 부대의 강력한 자산이 됩니다."
 ENG_expand_sandhurst_academy: "샌드허스트 사관학교 확장"
 ENG_expand_sandhurst_academy_desc: "샌드허스트 왕립 육군사관학교(RMAS)는 엄격한 과정과 탁월한 군 지도자 양성에 대한 헌신으로 명성이 높은 세계 최고의 군사 교육 기관 중 하나입니다. 1802년에 설립된 RMAS는 영국 육군은 물론 여러 해외 동맹국과 협력국의 주요 장교 양성 기관 역할을 합니다."
 ENG_soldier_welfare_initiative: "병사 복지 구상"
 ENG_soldier_welfare_initiative_desc: "병사와 그 가족의 복지를 우선시함으로써, 이 구상은 그들의 복무와 희생을 예우하고 서로 돕고 회복력 있는 군 공동체를 육성하려는 우리의 의지를 보여 줍니다."
 ENG_mgcs_program: "MGCS 계획"
 ENG_mgcs_program_desc: "주력 지상 전투 체계(MGCS)는 현대전 시나리오에서 지상군에 첨단 능력을 제공하도록 설계된 차세대 장갑 전투 차량 계획입니다. 독일과 프랑스의 공동 사업으로서 MGCS는 다양한 전장 환경에서 효과적으로 작전할 수 있는 다목적이며 기술적으로 진보한 주력 전차를 개발하는 것을 목표로 합니다."
 ENG_royal_airforce_modernisation: "영국 공군 현대화"
 ENG_royal_airforce_modernisation_desc: "영국 공군은 RAF 현대화를 통해 점점 더 복잡하고 경쟁이 치열해지는 세계 안보 환경 속에서 제공권을 유지하고, 힘을 투사하며, 국가 이익을 수호하겠다는 의지를 재확인합니다."
 ENG_watchkeeper_wk450: "워치키퍼 WK450"
 ENG_watchkeeper_wk450_desc: "워치키퍼 WK450은 정보, 감시, 정찰(ISR) 작전을 위해 설계된 첨단 무인 항공 체계입니다. 탈레스 그룹이 개발한 이 중고도 장기 체공(MALE) 무인기는 실시간 감시와 표적 획득을 위한 정교한 센서와 카메라 일체를 제공합니다. 체공 능력과 자율 비행 능력 덕분에 워치키퍼 WK450은 군에 향상된 상황 인식과 다양한 작전 환경에서 핵심 정보를 수집할 능력을 제공합니다."
 ENG_reaper_purchase: "리퍼 구매"
 ENG_reaper_purchase_desc: "세계 각국의 군은 정보, 감시, 정찰(ISR) 능력을 높이고 고가치 표적에 대한 정밀 타격을 수행하기 위해 MQ-9 리퍼를 도입했습니다. 표적 지역 상공에서 장시간 체공할 수 있는 리퍼의 능력과 첨단 센서군은 실시간 정보를 수집하고 지상군을 지원하는 귀중한 자산이 되게 합니다."
 ENG_missile_development: "미사일 개발"
 ENG_missile_development_desc: "현대적인 공군으로 남으려면 우리의 미사일 능력을 현대화해야 합니다."
 ENG_electronic_warfare_measures: "전자전 대책"
 ENG_electronic_warfare_measures_desc: "사이버 해킹으로부터 안전을 지키려면 우리의 컴퓨팅 체계를 현대화해야 합니다."
 ENG_nato_joint_airforce_training: "NATO 합동 공군 훈련"
 ENG_nato_joint_airforce_training_desc: "모의 시나리오, 실기동 훈련, 합동 훈련 행사를 통해 참가 공군은 공중전, 대지 작전, 공중 급유, 방공 같은 분야의 능력을 개발하고 다듬습니다. 이러한 훈련 활동은 동맹 공군 간의 상호 이해, 신뢰, 협력을 증진하여, 연합 환경에서 원활히 함께 작전하고 지역적·세계적 안보 도전에 효과적으로 대응할 수 있도록 보장합니다."
 ENG_c19_globemasters: "C-17 글로브마스터"
 ENG_c19_globemasters_desc: "C-17 글로브마스터 III는 신속한 장거리 수송 임무를 위해 전 세계 공군이 운용하는 다목적 전략 공수기입니다. 보잉이 제조한 이 대형 수송기는 병력, 차량, 인도적 구호품을 포함한 대형 화물을 외딴 지역과 열악한 비행장까지 실어 나를 수 있습니다. 첨단 항전 장비, 고익 설계, 단거리 이착륙(STOL) 능력을 갖춘 C-17 글로브마스터 III는 전 세계의 군사 및 인도적 작전을 지원하는 데 핵심적인 역할을 합니다."
 ENG_airbus_a400m: "에어버스 A400M"
 ENG_airbus_a400m_desc: "에어버스 A400M은 전 세계 여러 공군의 작전 요구를 충족하도록 설계된 현대적 군용 수송기입니다. 고익 구성과 첨단 터보프롭 엔진을 갖춘 A400M은 단거리 이착륙(STOL) 능력, 장거리 능력, 간이 활주로에서 운용할 수 있는 능력을 포함한 탁월한 성능을 제공합니다."
 ENG_nimrod_mra4: "님로드 MRA4"
 ENG_nimrod_mra4_desc: "님로드 MRA4는 상징적인 님로드 해상 초계기의 현대화형으로, 대잠수함전, 해양 감시, 수색 및 구조 임무를 위한 향상된 능력을 제공하려는 것이었습니다. 첨단 센서, 통신 체계, 임무 장비를 갖춘 님로드 MRA4는 전작에 비해 향상된 성능과 다목적성을 제공했습니다."
 ENG_apache_wah64: "어거스타웨스트랜드 아파치"
 ENG_apache_wah64_desc: "어거스타웨스트랜드 아파치 헬리콥터의 도입과 배치는 영국 공중 전투 전력의 중대한 진전을 의미했습니다. 표준 아파치 설계에 롤스로이스 엔진 개량, 보관을 위한 접이식 블레이드 기구, 로터 방빙 장치, 로켓 탑재량 증대 등 여러 변경이 가해졌습니다. 국가의 항공 역량을 강화하기 위해 도입된 이 정교한 공격 헬리콥터는 군사 항공 기술과 전략적 작전 효율의 도약을 상징합니다."
 ENG_boeing_p8_poseidon: "보잉 P-8 포세이돈"
 ENG_boeing_p8_poseidon_desc: "보잉 P-8 포세이돈은 장거리 대잠수함전, 대수상전, 정보·감시·정찰 작전을 위해 설계된 다임무 해상 초계기입니다. 보잉 737 여객기를 기반으로 한 P-8 포세이돈은 첨단 센서, 통신 체계, 무장 능력을 갖추어 해상 초계 임무에 매우 효과적인 플랫폼이 됩니다."
 ENG_revive_p125_project: "P125 사업 부활"
 ENG_revive_p125_project_desc: "부활한 P125 사업은 제공권, 근접 항공 지원, 정찰, 훈련을 포함한 다양한 역할을 수행할 수 있는 다목적이며 비용 효율적인 항공기 플랫폼을 개발하는 것을 목표로 합니다. 최첨단 항전 장비, 센서, 무기 체계를 도입함으로써 현대화된 P125 항공기는 향상된 성능, 생존성, 임무 효율을 제공할 것입니다."
 ENG_joint_strike_fighter_project: "통합 타격 전투기 사업"
 ENG_joint_strike_fighter_project_desc: "첨단 스텔스 능력, 센서 융합 기술, 다임무 능력을 갖춘 F-35 통합 타격 전투기는 공대공 및 공대지 작전에서 비할 데 없는 상황 인식과 치명성을 제공합니다."
 ENG_bae_systems_tempest: "BAE 시스템즈 템페스트"
 ENG_bae_systems_tempest_desc: "BAE 시스템즈 템페스트는 현대 공중전의 변화하는 요구를 충족하도록 설계된 최첨단 6세대 전투기 구상입니다. 첨단 스텔스 기술, 센서 융합 능력, 자율 체계를 갖춘 템페스트는 경합 공역 환경에서 향상된 성능, 생존성, 치명성을 제공할 태세를 갖추고 있습니다."
 ENG_defence_industrial_policy: "방위 산업 정책"
 ENG_defence_industrial_policy_desc: "영국 방위 산업 정책은 국가 방위 산업 기반의 개발, 관리, 지속 가능성을 이끄는 전략적 틀을 개괄합니다. 풍부한 혁신과 탁월함의 유산을 지닌 영국의 방위 산업은 국가 안보 목표를 뒷받침하고 경제 번영을 증진하며 세계 무대에서 기술적 선도 지위를 유지하는 데 중추적인 역할을 합니다."
 ENG_cayman_enterprise_city: "케이맨 엔터프라이즈 시티"
 ENG_cayman_enterprise_city_desc: "케이맨 엔터프라이즈 시티는 케이맨 제도의 경제특구로, 국제 기업이 조세 중립 관할권에 물리적 거점을 설립할 수 있는 독특한 플랫폼을 제공합니다. 간소화된 절차와 유인책을 통해 기술, 생명공학, 미디어 등의 산업에 속한 기업이 번성하고 성장하기에 적합한 환경을 조성합니다."
 ENG_illex_fishery: "일렉스 어장"
 ENG_illex_fishery_desc: "일렉스 어장은 포클랜드 제도 경제의 핵심 부분으로, 일렉스 오징어 종의 지속 가능한 어획에 중점을 둡니다. 장기적 존속을 보장하도록 신중하게 관리되는 이 어장은 지역 주민의 생계를 지탱하고 지역의 식량 안보와 경제 안정에 기여합니다."
 ENG_north_mole_power_plant: "노스 몰 발전소"
 ENG_north_mole_power_plant_desc: "지브롤터에 위치한 노스 몰 발전소는 이 영토의 에너지 수요를 충족하는 데 중요한 역할을 합니다. 현대적 기술과 기반시설을 갖춘 이 발전소는 안정적인 전력 생산을 제공하여 지브롤터 주민과 기업의 일상생활과 경제 활동을 뒷받침합니다."
 ENG_biras_creek_resort: "비라스 크리크 리조트"
 ENG_biras_creek_resort_desc: "영국령 버진아일랜드에 자리한 비라스 크리크 리조트는 아름다운 자연 속에서 호화로운 휴양을 제공합니다. 한적한 해변, 고급 숙소, 맞춤형 서비스로 유명한 이곳은 열대 낙원에서 휴식과 재충전을 원하는 여행객에게 이상적인 도피처를 제공합니다."
 ENG_bermuda_innovation_sprint: "버뮤다 혁신 스프린트"
 ENG_bermuda_innovation_sprint_desc: "버뮤다 혁신 스프린트는 섬의 혁신과 창업을 촉진하기 위한 구상입니다. 액셀러레이터 프로그램, 멘토링, 자금 지원 기회를 통해 스타트업과 기술 벤처가 혁신적 해법을 개발하고 버뮤다의 경제 성장을 이끌도록 지원합니다."
 ENG_princes_lodge_plantation: "프린시스 로지 농장"
 ENG_princes_lodge_plantation_desc: "프린시스 로지 농장은 세인트헬레나에 있는 역사적인 저택으로, 섬의 풍부한 문화유산과 농업 전통을 보여 줍니다. 그림 같은 환경과 보존된 식민지 건축물로 방문객에게 섬의 과거를 엿볼 수 있게 하면서 문화 관광과 지역 유산 보존 노력에 기여합니다."
 ENG_beaches_turks_caicos: "비치스 터크스 케이커스"
 ENG_beaches_turks_caicos_desc: "비치스 터크스 케이커스는 때묻지 않은 해변, 고급 편의 시설, 가족 친화적인 분위기로 유명한 고급 올인클루시브 리조트입니다. 다양한 활동과 오락 시설을 제공하여 터크스 케이커스 제도에서 모든 연령대의 투숙객에게 잊을 수 없는 휴가 경험을 선사합니다."
 ENG_little_bay_port_development_project: "리틀 베이 항만 개발 사업"
 ENG_little_bay_port_development_project_desc: "리틀 베이 항만 개발 사업은 리틀 베이에 현대식 항만 시설을 개발하여 몬트세랫의 기반시설과 경제 전망을 향상시키는 것을 목표로 합니다. 개선된 교통 및 물류 능력으로 섬의 무역, 관광, 투자 기회를 자극하고자 합니다."
 ENG_pitcairn_islands_study_center: "핏케언 제도 연구 센터"
 ENG_pitcairn_islands_study_center_desc: "핏케언 제도 연구 센터는 핏케언 제도의 역사, 문화, 생물 다양성의 연구와 보존에 전념하는 연구 기관입니다. 기록 보관소, 출판물, 교육 프로그램을 통해 이 외딴 독특한 영토에 대한 인식과 이해를 증진합니다."
 ENG_share_vtol_research: "수직 이착륙 연구 공유"
 ENG_share_vtol_research_desc: "수직 이착륙(VTOL) 연구 공유는 수직 이착륙 기술을 발전시키기 위한 산업 이해관계자와 연구 기관 간의 협력 및 지식 공유 구상을 포함합니다."
 ENG_channel_homegrown_innovation: "자국산 혁신 육성"
 ENG_channel_homegrown_innovation_desc: "자국산 스타트업, 연구 기관, 소기업을 지원함으로써 이 구상은 업계의 핵심 과제와 기회를 다루는 최첨단 기술과 해법의 개발을 촉진하고자 합니다. 협력, 자금 지원, 생태계 구축을 통해 영국을 항공 혁신의 세계적 선도국으로 자리매김시켜 경제 성장과 경쟁력을 이끄는 것을 목표로 합니다."
 ENG_revive_british_aviation_industry: "영국 항공 산업 부흥"
 ENG_revive_british_aviation_industry_desc: "투자, 혁신, 기술 개발을 촉진함으로써 이 구상은 국내 생산 능력을 되살리고 공급망 회복력을 높이며 전국에 양질의 일자리를 창출하고자 합니다."
 ENG_focus_on_component_manufacturing: "부품 제조에 집중"
 ENG_focus_on_component_manufacturing_desc: "첨단 제조 기술, 인력 훈련, 공급망 회복력 조치에 투자함으로써 이 구상은 세계 항공우주 시장에서 더 큰 가치와 경쟁력을 확보하는 것을 목표로 합니다. 주문자 상표 부착 생산업체(OEM), 협력 업체, 연구 기관과의 파트너십을 통해 항공우주 부품 생태계 전반의 혁신, 효율, 품질을 촉진하고자 합니다."
 ENG_us_uk_collaboration: "미영 협력"
 ENG_us_uk_collaboration_desc: "미국은 항상 좋은 파트너를 찾고 있습니다. 영국 항공 사업을 받아들이면 우리는 함께 더 많은 자금을 확보하고 우리의 혁신 일부를 그들에게 제공할 수 있습니다."
 ENG_skylon_engine: "스카이론 엔진"
 ENG_skylon_engine_desc: "스카이론 엔진은 차세대 추진 체계 개발에 중점을 둔 영국 항공우주 산업의 획기적인 도전을 나타냅니다. 첨단 공학, 재료 과학, 전산 모델링을 통해 이 구상은 탁월한 효율, 신뢰성, 지속 가능성을 제공하는 고성능 제트 엔진을 설계하고 제조하는 것을 목표로 합니다."
 ENG_rebirthing_black_arrow: "블랙 애로우의 부활"
 ENG_rebirthing_black_arrow_desc: "블랙 애로우의 부활은 영국의 역사적 우주 발사체 사업인 블랙 애로우 계획의 유산을 기립니다. 이 구상은 첨단 발사 능력과 위성 기술을 개발하여 영국의 우주 탐사 정신을 되살리고 현대화하는 것을 목표로 합니다."
 ENG_lightweight_fire_platform_artillery: "경량 화력 플랫폼 포병"
 ENG_lightweight_fire_platform_artillery_desc: "경량 화력 플랫폼 포병 사업은 신속한 전개와 정밀 화력 지원에 최적화된 다목적 기동 포병 체계를 개발하고 배치하는 것을 목표로 합니다. 경량 소재, 모듈식 설계 원칙, 첨단 사격 통제 체계를 활용하여 다양한 작전 환경에서 포병 부대의 기민성, 대응성, 치명성을 높이고자 합니다."
 ENG_harpoon_replacement: "하푼 대체"
 ENG_harpoon_replacement_desc: "하푼 대체 계획은 영국군 무기고의 노후화된 하푼 미사일을 대체할 차세대 대함 미사일 체계 개발에 중점을 둡니다. 첨단 유도, 추진, 표적 획득 기술을 활용하여 해상 환경의 수상 위협에 대해 해군 전력에 향상된 사거리, 정확도, 치명성을 제공하는 것을 목표로 합니다."
 ENG_codify_service_economy: "서비스 주도 경제의 명문화"
 ENG_codify_service_economy_desc: "수십 년간 영국은 서비스 주도 모델로 흘러왔습니다. 금융, 컨설팅, 미디어가 문을 닫은 공장들이 남긴 공백을 채웠습니다. 이제 이 표류를 명시적인 전략으로 삼을 때입니다."
 ENG_gate_burton_energy: "게이트 버턴 에너지 파크 건설"
 ENG_gate_burton_energy_desc: "게이트 버턴 에너지 파크는 링컨셔 게이트 버턴 인근의 농지를 대규모 태양광 및 배터리 부지로 바꾸어, 청정 전력을 국가 전력망에 공급하고 노후한 석탄 및 가스 발전을 대체하는 데 기여할 것입니다."
 ENG_gate_burton_energy_tt: "§Y배터리 파크§! §G1§! 추가"
 ENG_ai_white_collar: "사무직을 위한 AI"
 ENG_ai_white_collar_desc: "법률 사무소에서 회계 법인에 이르기까지 AI 체계가 일상적인 분석과 문서 업무를 처리하기 시작합니다. 일자리는 사라지고 수익률은 오릅니다."
 ENG_empower_city_london: "런던 시티 강화"
 ENG_empower_city_london_desc: "계획 규제를 완화하고 스퀘어 마일의 신규 고층 건물을 지원함으로써 은행과 서비스 기업이 사업 규모를 확장하도록 장려합니다. 시티의 새로운 프라임급 사무 공간이 더 빨리 들어서 런던의 세계 금융 중심지로서의 역할을 굳건히 할 것입니다."
 ENG_empower_edinburgh: "에든버러 금융 지구 강화"
 ENG_empower_edinburgh_desc: "뉴타운과 익스체인지 지구 일대의 새로운 프라임급 사무실과 기반시설을 지원함으로써 에든버러의 은행과 자산 운용사가 사업 규모를 확장하도록 돕고, 런던 외 영국의 제2 금융 중심지를 강화합니다."
 ENG_found_invest_northern_ireland: "인베스트 노던아일랜드 설립"
 ENG_found_invest_northern_ireland_desc: "해외에 지역을 홍보하고 새로운 공장, 사무실, 조선소를 꾸준히 유치하기 위해 인베스트 노던아일랜드를 설립합니다."
 ENG_digital_government: "디지털 정부 개편"
 ENG_digital_government_desc: "공공 서비스, 세무, 인허가, 복지 급여를 디지털화하여 서류 작업을 줄이고 비용을 절감합니다."
 ENG_invest_silicon_glenn: "실리콘 글렌 투자"
 ENG_invest_silicon_glenn_desc: "스코틀랜드의 실리콘 글렌에 자금을 투입하여 연구소와 기술 단지를 확장하고 컴퓨팅, 인터넷, 인공지능 분야의 연구를 가속합니다."
 ENG_cross_border_cooperation: "국경 간 협력"
 ENG_cross_border_cooperation_desc: "북아일랜드와 아일랜드 간의 실질적 협력을 심화하여 번거로운 절차를 줄이고 국경 간 무역과 영향력을 증대합니다."
 ENG_national_data_infrastructure: "국가 데이터 인프라"
 ENG_national_data_infrastructure_desc: "전국적인 광케이블, 데이터 허브, 기간망을 구축하여 디지털 연결 속도를 높이고, 보급 범위를 넓히며, 경제 전반의 생산성을 끌어올립니다."
 ENG_admiral_group: "애드미럴 그룹과 제휴"
 ENG_admiral_group_desc: "카디프에 본사를 둔 애드미럴 그룹과 협력하여 민간 보험의 보장 범위를 넓히고, 복지 및 의료 예산에 대한 부담을 덜어냅니다."
 ENG_fintech_open_banking: "핀테크 및 오픈 뱅킹 허브"
 ENG_fintech_open_banking_desc: "영국을 선도적인 핀테크 및 오픈 뱅킹 허브로 육성하여 법인세 수입을 늘리는 한편 정부의 차입 비용을 낮춥니다."
 ENG_global_consulting_state: "글로벌 컨설팅 국가"
 ENG_global_consulting_state_desc: "전 세계에서 활동하는 영국 컨설팅 업체와 로펌을 지원하여 우리의 영향력을 넓히고, 연구 협력을 심화하며, 더 많은 외국인 투자를 유치합니다."
 ENG_lean_manufacturing: "린 생산 방식"
 ENG_lean_manufacturing_desc: "공장 전반에 로봇, 센서, 적시 생산 방식의 작업 흐름을 도입하여 단순 노동을 자동화 라인으로 대체합니다. 공장은 더 많은 전력을 소모하지만 필요한 인력은 줄어들며, 생산을 거듭할수록 산출량과 효율이 향상됩니다."
 ENG_cloud_isles: "클라우드 아일즈"
 ENG_cloud_isles_desc: "영국을 대규모 데이터 센터와 클라우드 단지의 거점으로 만듭니다. 서버 팜을 가동하느라 사무 시설의 전력 소모가 늘어나지만, 이곳에서 제공되는 디지털 서비스는 더 많은 세수를 창출하고 연구 성과를 앞당깁니다."
 ENG_algorithmic_finance: "알고리즘 금융"
 ENG_algorithmic_finance_desc: "첨단 리스크 엔진과 자동화된 재정 시스템을 도입하여 현금 흐름, 부채, 결제를 관리함으로써 관료주의를 줄이고 정부 운영 비용을 낮춥니다."
 ENG_invest_harland_wolff: "하랜드 앤 울프에 투자"
 ENG_invest_harland_wolff_desc: "벨파스트를 비롯한 하랜드 앤 울프의 조선소에 새로운 자본을 투입하여 선대를 다시 가동하고, 숙련 노동자를 채용하며, 우리 조선소의 생산량을 늘립니다."
 ENG_critical_minerals_strategy: "핵심 광물 전략"
 ENG_critical_minerals_strategy_desc: "국가 핵심 광물 전략을 출범시켜 콘월, 웨일스 등지의 신규 사업을 지원함으로써 주요 광석을 확보하고 영국의 핵심 자원 접근성을 개선합니다."
 ENG_dogger_bank_offshore: "도거 뱅크 해상 에너지 허브"
 ENG_dogger_bank_offshore_desc: "북해의 도거 뱅크 해상 풍력 단지를 지원하여 세계 최대의 풍력 발전 단지를 건설하고, 수백만 영국 가정에 청정 전력을 공급합니다."
 ENG_hinkley_point_c: "힝클리 포인트 C 완공"
 ENG_hinkley_point_c_desc: "서머싯의 쌍둥이 원자로 사업인 힝클리 포인트 C를 계속 추진하여 3GW가 넘는 장기적인 저탄소 기저 전력을 전력망에 추가합니다."
 ENG_acknowledge_industrial_collapse: "산업 붕괴를 인정하다"
 ENG_acknowledge_industrial_collapse_desc: "티스사이드의 레드카에서 사우스웨일스의 포트 탤벗에 이르기까지 용광로의 불은 꺼졌고, 지역 사회 전체가 산업의 근간을 잃었습니다. 영국의 중공업이 얼마나 쇠퇴했는지를 마침내 인정해야만 이를 재건할 수 있습니다."
 ENG_building_brittain_fit_future: "미래에 걸맞은 영국 건설"
 ENG_building_brittain_fit_future_desc: "영국 전역의 아이디어, 사람, 인프라, 지역에 투자하여 생산성과 소득 창출 능력을 높이는 장기 산업 전략을 시작합니다."
 ENG_northern_powerhouse: "노던 파워하우스 및 미들랜즈 엔진"
 ENG_northern_powerhouse_desc: "노던 파워하우스와 미들랜즈 엔진을 하나의 성장 회랑으로 연결하고, 교통, 기술, 기업 투자를 지원하여 리버풀과 맨체스터에서 버밍엄을 거쳐 이스트미들랜즈에 이르는 지역의 생산성을 끌어올립니다."
 ENG_aerospace_wales: "웨일스 항공우주 산업"
 ENG_aerospace_wales_desc: "에어버스 브로턴, 세인트 애선, 그리고 더 넓은 MRO 허브를 중심으로 한 웨일스의 항공우주 클러스터를 지원하여 현지의 날개 생산, 정비 작업, 고부가가치 항공 일자리를 늘립니다."
 ENG_marine_power_systems: "마린 파워 시스템즈 지원"
 ENG_marine_power_systems_desc: "웨일스에 기반을 둔 마린 파워 시스템즈가 부유식 풍력 및 파력 발전 플랫폼의 규모를 키울 수 있도록 지원하여, 현지 조선소와 항만을 차세대 해양 에너지의 거점으로 탈바꿈시킵니다."
 ENG_develop_edinburgh_west_end: "에든버러 웨스트 엔드 개발"
 ENG_develop_edinburgh_west_end_desc: "웨스트 엔드의 익스체인지 지구를 사무실, 연구실, 현대식 작업장이 더 촘촘하게 들어선 지구로 개선하여 현지의 연구 성과와 생산 효율을 높이는 동시에, 주요 세력이 확장할 새로운 공간을 확보합니다."
 ENG_develop_bae_aerospace: "스코틀랜드 BAE 항공우주 개발"
 ENG_develop_bae_aerospace_desc: "프레스트윅을 비롯한 스코틀랜드 각지에서 BAE의 항공우주 거점을 확장하고, 새로운 격납고, 작업장, 엔지니어링 팀을 추가하여 첨단 전투기와 미래 사업을 뒷받침합니다."
 ENG_glasgow_shipbuilidng: "글래스고 조선 허브"
 ENG_glasgow_shipbuilidng_desc: "고번과 스코츠턴의 클라이드 조선소를 현대화하여 글래스고를 군함 건조와 해군 수출의 장기적인 거점으로 만듭니다."
 ENG_high_value_manufacturing_zones: "고부가가치 제조 구역"
 ENG_high_value_manufacturing_zones_desc: "카타펄트 방식의 센터와 과학 단지를 중심으로 고부가가치 제조 구역을 지정하여, 기업이 연구실, 기술, 현대적 시설에 더 빠르게 접근하도록 하고 생산성과 첨단 산출량을 끌어올립니다."
 ENG_high_value_manufacturing_zones_tt: "주에 §G5§! §Y$infrastructure$§!, 최소 §G10§! §Y$industrial_complex$§!, 최소 §G5§! §Y$offices$§!, 그리고 최소 §G5§! §Y$arms_factory$§! 또는 §G5§! §Y$dockyard$§!이(가) 있다면 주마다 다음을 추가합니다:"
 ENG_steel_guarantee: "철강 보증"
 ENG_steel_guarantee_desc: "저탄소 철강 사업에 장기 자금과 보증을 약속하여, 투자자들이 확신을 가지고 공장을 현대화하고 앞으로 수십 년 동안 국내 철강 생산을 지켜낼 수 있도록 합니다."
 ENG_steel_guarantee_tt: "§Y[10.GetName],[11.GetName],[12.GetName]§! 또는 §Y[1191.GetName]§!은(는) 다음을 얻습니다:\n§Y4개 초과의 $industrial_complex$§!: §G+6§! §Y$country_resource_steel$§!.\n§Y4개 초과의 $offices$§!: §G+3§! §Y$country_resource_tungsten$§!.\n§Y시설§! 및 §Y$sp_improved_synthetic_diamonds$§!이(가) 완료된 경우: 추가로 §G+3§! §Y$country_resource_chromium$§!."
 ENG_celsa_steel: "카디프 셀사 철강 지원"
 ENG_celsa_steel_desc: "카디프에 있는 셀사의 전기로 제철소와 봉강·선재 압연 공장을 지원하여 저탄소 철근과 선재 생산량을 늘리는 한편, 웨일스의 주요 재활용 업체이자 고용주가 최대 가동률로 운영되도록 합니다."
 ENG_expand_scottish_steel: "스코틀랜드 철강 확장"
 ENG_expand_scottish_steel_desc: "댈젤과 클라이드브리지 제철소에 투자하여 후판 생산을 재개하고, 군함과 해상 풍력에 쓰일 스코틀랜드산 철강을 확보하며, 경계 북쪽에 현대적인 중공업 기반을 키웁니다."
 ENG_refine_natural_bauxite: "천연 보크사이트 정제"
 ENG_refine_natural_bauxite_desc: "에든버러 일대에 알루미나 시설을 건설하여 수입 보크사이트를 고급 원료로 정제함으로써 스코틀랜드의 국내 알루미늄 생산량을 늘립니다."
 ENG_deep_mining_coal: "스코틀랜드 심부 탄광 부활"
 ENG_deep_mining_coal_desc: "스코틀랜드의 옛 탄전에서 깊은 탄층을 다시 열고, 새 수직갱을 파고 탄광 기반시설을 재건하여 경계 북쪽의 지하 석탄 생산을 되살립니다."
 ENG_opencast_mining: "스코틀랜드 노천 채굴 확대"
 ENG_opencast_mining_desc: "스코틀랜드의 탄전에서 새로운 노천 채굴지를 허가하고, 표토를 걷어내어 얕은 탄층에 접근함으로써 국내 석탄 공급을 늘립니다."
 ENG_cononish_gold_silver: "코노니시 금·은 광산"
 ENG_cononish_gold_silver_desc: "틴드럼 인근의 코노니시 광산을 지원하여, 스코틀랜드의 유일한 상업용 금·은 광상을 국가에 귀금속을 꾸준히 공급하는 원천으로 만듭니다."
 ENG_national_productivity_commission: "국가 생산성 위원회"
 ENG_national_productivity_commission_desc: "국가 생산성 위원회를 설립하여 투자, 인프라, 혁신 정책을 영국 전역의 생산성 향상이라는 하나의 사명 아래 조율합니다."
 ENG_infrastructure_for_productivty: "국가 인프라 전략"
 ENG_infrastructure_for_productivty_desc: "생산성을 가로막는 대신 끌어올리는 도로, 철도, 디지털 네트워크를 목표로 하는 국가 인프라 전략을 시행합니다."
 ENG_universaties_engines_of_growth: "지역 강점 기금"
 ENG_universaties_engines_of_growth_desc: "지역 강점 기금 방식의 기금을 마련하여 잉글랜드 전역의 대학과 기업 간 협력을 지원함으로써, 지역 연구 역량을 일자리, 투자, 성장으로 연결합니다."
 ENG_hs2: "고속철도 2 착공"
 ENG_hs2_desc: "고속철도 2(HS2)를 승인하여 런던과 미들랜즈를 잇는 1단계 구간을 허가하고, 새로운 고속철도에 수십 년간 투자할 것을 약속합니다."
 ENG_northern_powerhouse_rail: "노던 파워하우스 철도"
 ENG_northern_powerhouse_rail_desc: "리버풀, 맨체스터, 리즈 및 북부 전역을 더 빠르고 더 잦은 열차와 더 큰 여객·화물 수송 능력으로 연결하는 새롭고 개량된 동서 노선망인 노던 파워하우스 철도를 추진합니다."
 ENG_euston_canary_wharf_integration: "유스턴과 카나리 워프 통합"
 ENG_euston_canary_wharf_integration_desc: "유스턴의 HS2 종착역을 런던의 동서 철도 및 지하철망과 연결하여 시티와 카나리 워프로 끊김 없이 이어지게 함으로써, 고속철도 승객이 몇 분 만에 수도의 금융 지구에 닿을 수 있도록 합니다."
 ENG_midland_main_lines: "미들랜드 본선 개량"
 ENG_midland_main_lines_desc: "런던과 이스트미들랜즈를 잇는 미들랜드 본선의 개량 및 전철화를 추진하여 이동 시간을 단축하고 여객 및 화물 수송 여력을 확보합니다."
 ENG_russel_group: "러셀 그룹 대학교"
 ENG_russel_group_desc: "연구 중심 대학들로 이루어진 러셀 그룹과의 관계를 심화하고, 세계 최고 수준의 과학을 전국적인 성장으로 연결하는 공동 사업을 지원합니다."
 ENG_golden_triangle_research: "골든 트라이앵글 연구 지대"
 ENG_golden_triangle_research_desc: "옥스퍼드, 케임브리지, 런던의 유수 대학 사이의 연계를 강화하여, 세계적 수준의 연구실, 인재, 자금을 하나의 파급력 높은 혁신 회랑에 집중시키는 골든 트라이앵글 연구 지대를 조성합니다."
 ENG_imperial_king_tech_clusters: "임페리얼 및 킹스 기술 클러스터"
 ENG_imperial_king_tech_clusters_desc: "임페리얼의 화이트 시티 혁신 캠퍼스를 킹스의 기술 및 의료 거점과 연결하여, 연구실, 스타트업, 투자자가 최첨단 연구를 상업적 성과로 전환할 수 있는 밀집된 클러스터를 조성합니다."
 ENG_skill_england_technical: "스킬즈 잉글랜드 및 기술 경로"
 ENG_skill_england_technical_desc: "스킬즈 잉글랜드와 협력하여 기술 격차를 파악하고 기술직 진로와 견습 제도를 확대함으로써, 더 많은 사람에게 숙련 직종으로 가는 명확하고 질 높은 경로를 제공합니다."
 ENG_closing_britains_productivity_gap: "영국의 생산성 격차 해소"
 ENG_closing_britains_productivity_gap_desc: "인프라, 대학, 기술에 대한 수년간의 집중 투자 끝에 마침내 우리의 생산성 격차가 좁혀지기 시작하여, 노동자 1인당 산출량이 늘어나고 경제에는 임금 인상과 더 나은 서비스를 위한 여력이 생깁니다."
 ENG_closing_britains_productivity_gap_tt: "§Y$CAT_infrastructure$§!을(를) 연구하면 생산성 페널티를 되돌릴 수 있습니다"
 ENG_ambitions_for_britain: "영국을 위한 포부"
 ENG_ambitions_for_britain_desc: "시대가 흘러가는 동안 영국을 썩게 내버려 둘 수는 없습니다. 영국은 야심을 품어야 하며, 이를 위해 영국 국민에게는 노동당이 필요합니다. 노동당은 결단력으로 영국을 우리 시대 최고의 세계적 강국 중 하나로 도약시킬 것입니다. 새로운 천년은 우리의 것이 될 것입니다."
 ENG_deeper_prosperity: "더 깊은 번영"
 ENG_deeper_prosperity_desc: "더 많은 일자리를 창출하고 국민이 취업 기회를 찾도록 장려함으로써 더 깊은 번영을 이룰 것입니다. 이는 지속 가능한 환경, 특히 적절한 인프라를 조성해야만 달성할 수 있습니다."
 ENG_every_region_of_the_country: "나라의 모든 지역"
 ENG_every_region_of_the_country_desc: "우리의 노력은 사회의 주요 중심지에만 국한되지 않을 것이며, 나라의 모든 지역을 우선시할 것입니다. 결국 우리는 하나의 연합체입니다. 자원이 고르게 분배되지 않으면 국가는 분열되고, 대규모 도시 인구와 농촌 인구 사이에 불평등이 생겨날 것입니다."
 ENG_the_foundation: "근간"
 ENG_the_foundation_desc: "이 나라의 근간이자 기둥이며 중추는 조국을 위해 셀 수 없는 시간을 바치는 성실한 노동자입니다. 휴가, 휴무, 병가와 관련하여 일터에서 더 많은 유연성을 허용하는 개혁을 추진하는 것은 사회의 이 기둥을 굳건히 유지하는 중요한 변화가 될 것입니다."
 ENG_nhs_reform: "NHS 개혁"
 ENG_nhs_reform_desc: "국민보건서비스(NHS)는 개혁이 절실합니다. 새 병원과 의료 시설의 건설을 요구하는 표면적인 변화가 아니라, 민간과 공공 부문의 연계를 추진하여 NHS를 개선함으로써 대기 시간을 줄이고, 기존 시설을 현대화하며, 더 많은 환자를 더 신속하게 받아들일 수 있도록 할 것입니다."
 ENG_reinassaince_of_status: "지위의 르네상스"
 ENG_reinassaince_of_status_desc: "우리 국민은 사회적 사다리를 오르고 경제적으로 성장할 수 있어야 합니다. 따라서 삶의 초기 단계부터 개입해야 합니다. 고등 교육 기관에 필요한 수단을 제공함으로써 국민이 사회에서 성공하는 데 필요한 자원을 더 쉽게 마련해 줄 수 있을 것입니다."
 ENG_a_grand_promise: "원대한 약속"
 ENG_a_grand_promise_desc: "우리 당에 대한 지지를 유지하려면 유권자를 사로잡을 원대한 약속을 해야 합니다. 이 약속을 이행함으로써 우리 연립의 신뢰를 공고히 하고 야당에 큰 타격을 줄 수 있을 것입니다."
 ENG_more_frontline_staff: "더 많은 일선 인력"
 ENG_more_frontline_staff_desc: "더 많은 일선 인력이 일터로 나서도록 독려하여 농업 생산성을 증진해야 합니다. 장려 프로그램을 통해 우리나라에서 흔들리고 있는 농업 정신을 재건할 수 있을 것입니다."
 ENG_foster_the_tech_revolution: "실리콘 혁명 육성"
 ENG_foster_the_tech_revolution_desc: "새로운 혁명이 바로 우리 눈앞에서 펼쳐지고 있습니다. 실리콘 혁명입니다. 기술을 통해 세계 경제는 전례 없는 방식으로 변화하기 시작했습니다. 과거의 농촌·농업 사회가 마이크로칩과 전자 제품을 통해 가장 강력한 경제로 탈바꿈하기 시작했습니다. 우리도 하루빨리 이 새로운 흐름을 활용하기 시작해야 합니다."
 ENG_uplift_traditional_industry: "전통 산업 진흥"
 ENG_uplift_traditional_industry_desc: "세계 대부분이 빠져 있는 전자 산업의 유행은 우리에게 필요하지 않습니다. 대신 역사적으로 효과가 입증된 냉혹한 산업에 집중할 수 있습니다. 경제를 위태롭게 할 수 있는 하찮은 일에 왜 도박을 걸어야 합니까?"
 ENG_prioritize_the_teachers: "교육자 우선"
 ENG_prioritize_the_teachers_desc: "사회에서 교육자의 역할을 높이는 것은 국가와 지역 전반에 울려 퍼질 막대한 이익을 가져올 것입니다. 평범한 [ENG.GetAdjective] 시민의 삶에서 교육자의 위치를 확고히 함으로써, 사람들은 마침내 교육을 그 진정한 가치대로 높이 평가하기 시작할 것입니다."
 ENG_prioritize_the_doctors: "의사 우선"
 ENG_prioritize_the_doctors_desc: "의사는 사람들이 죽지 않게 막고, 질병의 확산을 막으며, 우리나라의 전반적인 안전감을 유지하는 존재입니다. 의사와 의료진의 역할을 높임으로써, 심각한 인력 부족에 시달리는 NHS의 일자리를 더 많은 사람이 채우도록 장려할 수 있을 것입니다."
 ENG_strengthening_communities: "지역 사회 강화"
 ENG_strengthening_communities_desc: "지역 사회를 강화하고, 이를 통해 영국의 정체성을 강화하는 것은 더 큰 국민적 단합을 도모할 수 있게 해 줄 것입니다. 이를 통해 우리가 가장 소중히 여기는 가치를 지키는 동시에 더 효율적인 차원에서 사회적 결속을 이룰 수 있습니다."
 ENG_to_europa_and_beyond: "유럽, 그리고 그 너머로!"
 ENG_to_europa_and_beyond_desc: "우리는 먼저 유럽인이며, 그다음이 영국인입니다. 우리가 속한 지역의 터전을 잊는 것은 우리가 누구인지를 잊는 것입니다. 모든 유럽 민족의 더 큰 비전을 뒷받침할 수 있도록 유럽 대륙, 나아가 유럽 연합 전체와의 더 깊은 통합을 추구해야 합니다."
 ENG_no_one_left_behind: "누구도 뒤처지지 않도록"
 ENG_no_one_left_behind_desc: "위대함을 향한 우리의 질주에서 영국인 단 한 명도 뒤처지지 않을 것입니다. 모두가 도움을 받아 사회의 결승선까지 나아갈 것이며, 우리는 함께 성공을 향한 이 위대한 투쟁을 견뎌낼 것입니다."
 ENG_criminal_justice_reform: "형사 사법 개혁"
 ENG_criminal_justice_reform_desc: "사법 체계를 강화하면 오랜 민주주의 규범도 함께 강화될 것입니다. 사법 절차를 간소화하면 민주주의 제도에 대한 신뢰도 높아지고, 정부에 대한 장기적인 지지가 확립될 가능성이 더 커질 것입니다."
 ENG_welfare_reform: "복지 개혁"
 ENG_welfare_reform_desc: "유권자와 신뢰할 수 있는 관계를 맺으려면 복지 제도를 개혁하는 수밖에 없습니다. 우리가 그들의 일상에 관심을 갖고 있음을 보여줌으로써, 앞으로도 계속 우리에게 표를 던져 집권하게 해야 할 수많은 이유를 제시할 수 있을 것입니다."
 ENG_tax_reform: "세제 개혁"
 ENG_tax_reform_desc: "§R'내, 내 돈이 다 어디로 갔지?!'§!\n\n세제 개혁안을 통과시키면 경제와 국고를 강화할 수 있을 뿐만 아니라, 사회 개혁 프로그램의 재원 마련에도 진전을 이룰 수 있습니다. 세금을 내야 하는 이들에게는 다소 인기가 없을 수 있겠지만 말입니다."
 ENG_productivity_challenge: "생산성 과제"
 ENG_productivity_challenge_desc: "일부 노동자들이 제대로... 일하게 만드는 것이 갈수록 어려워지고 있습니다. 몇 가지 변화를 추진하면 그들이 다시 생산적인 일을 하도록 유도할 수 있을지도 모릅니다."
 ENG_britain_forward_not_back: "영국은 후퇴가 아닌 전진"
 ENG_britain_forward_not_back_desc: "우리가 어디로 향하는지 알려면 앞을 내다보기만 하면 됩니다. 우리가 미래를 직접 책임지지 않는다면 우리의 운명은 운명의 손에 맡겨질 것입니다. 우리는 그것을 원하지 않습니다. 우리는 나라를 위대함으로 이끌고자 하며, 그러려면 그곳에 도달하기 위해 먼저 무엇을 해야 하는지부터 정립해야 합니다."
 ENG_competition_planning_and_regulation: "경쟁 계획 및 규제"
 ENG_competition_planning_and_regulation_desc: "규제 없는 경쟁은 있을 수 없습니다. 적절한 안전장치가 없으면 기업은 궤도를 이탈해 소규모 기업을 흡수할 것이며, 결국 수천, 어쩌면 수백만 명의 수입원을 말살하게 될 것입니다."
 ENG_new_rights_new_choices: "새로운 권리, 새로운 선택"
 ENG_new_rights_new_choices_desc: "국민이 언제 일할지에 관해 더 많은 권리를 부여하면 전국적인 생산성을 높일 수 있습니다. 현재 일부 직장은 은퇴 연령을 넘은 사람의 근무를 제한하여 그들을 서서히 밀어내고 있습니다. 은퇴 연령 기준을 넘은 이들이 다시 일할 수 있게 하면 경제적 안정이 더욱 커질 것입니다."
 ENG_supporting_science: "과학 지원"
 ENG_supporting_science_desc: "새로운 과학적 발굴 방법을 지원하면 국내 연구 프로그램에 공급할 수 있는 역량이 늘어나고, 국제 무대에 더 많은 물자를 수출할 역량도 커질 것입니다."
 ENG_codify_key_of_convetions: "핵심 관례의 성문화"
 ENG_codify_key_of_convetions_desc: "핵심 관례를 마침내 성문화함으로써 정치적 규칙을 법적 규칙으로 바꿀 것입니다. 우리 정치는 더 이상 전통이 아니라 법에 의해 좌우될 것이며, 이를 통해 더 나은 민주주의를 향해 한 걸음 더 나아갈 수 있을 것입니다."
 ENG_generations_of_tomorrow: "내일의 세대"
 ENG_generations_of_tomorrow_desc: "연금 제도를 개혁하면 현재와 미래 세대를 위한 확고한 안전망을 마침내 구축할 수 있습니다. 지금은 많은 이들이 지나치게 적은 급여를 받거나 아예 받지 못하고 있으며, 이제는 이에 대해 조치를 취해야 할 때입니다."
 ENG_fostering_entrepreneurship: "기업가 정신 육성"
 ENG_fostering_entrepreneurship_desc: "우리는 혁신가들이 이 나라로 밀려들기를 원하며, 이를 위해 투자하려는 이들이 들어올 수 있는 지속 가능한 환경을 조성하는 데 정부 재원을 일부 배정하기 시작해야 합니다."
 ENG_modern_transport_infrastructure: "교통 인프라 현대화"
 ENG_modern_transport_infrastructure_desc: "도로가 엉망이고 부서져 있다면 운전이 무슨 소용이겠습니까? 혁신적인 새 인프라 프로그램에 투자하면 더 낫고 더 제 기능을 하는 영국으로 나아가는 길이 열릴 것입니다."
 ENG_thriving_rural_scene: "번영하는 농촌"
 ENG_thriving_rural_scene_desc: "우리의 농촌 마을을 역사의 바람에 내맡겨 잊히게 둘 수는 없습니다. 대신 이 농촌 지역을 끌어안고 그곳의 활동을 더욱 장려할 것입니다."
 ENG_scraping_the_skies: "하늘을 찌르는 마천루"
 ENG_scraping_the_skies_desc: "국제 무대에서 우리의 이미지를 구축하려면 탑이 필요합니다. 그것도 그 웅장함으로 세계를 경탄하게 만들 탑이어야 합니다."
 ENG_creative_cities: "창조 도시"
 ENG_creative_cities_desc: "문화적 영향력을 활용해 새로운 도시 공간을 설계함으로써, 국민이 어디를 가든 그들의 정신과 사기를 북돋울 최적의 여건을 조성할 것입니다."
 ENG_party_of_pensior_poverty: "연금 빈곤의 정당"
 ENG_party_of_pensior_poverty_desc: "보수당, 즉 토리당, 우리가 '연금 빈곤의 정당'이라 부르는 그들은 복지 부문의 건전성을 훼손하고 있으며, 연금으로 살아가는 이들의 생계를 적극적으로 망가뜨리고 있습니다. 국민이 그들의 퇴행적인 행태를 확실히 알도록 조치를 취해야 합니다."
 ENG_fostering_home_ownership: "주택 소유 장려"
 ENG_fostering_home_ownership_desc: "사람들이 정부 지원금에 기대어 살도록 장려하는 대신, 그들과 사랑하는 이들이 살 집을 마련하도록 돕겠습니다. 그렇게 하면 자기 소유가 아닌 땅에서 살고 있지 않다는 사실을 알고 마음 편히 지낼 수 있을 것입니다."
 ENG_social_housing: "사회 주택 프로그램"
 ENG_social_housing_desc: "현실적으로 생각해 봅시다. 집값은 치솟기 시작했고 멈출 기미가 보이지 않습니다. 유권자들에게 머리 위의 지붕과 자연의 위협으로부터의 보호를 제공할 사회 주택 프로그램을 추진해야 합니다."
 ENG_copyright_in_a_digital_age: "디지털 시대의 저작권"
 ENG_copyright_in_a_digital_age_desc: "우리의 저작권법은 현재 있어야 할 수준에 미치지 못하고 있으며, 많은 조항이 누락되었거나 모호하게 남아 있습니다. 관련 규정을 성문화하고 언론에 더 많은 보호를 부여해야 합니다."
 ENG_strengthening_our_grids: "전력망 강화"
 ENG_strengthening_our_grids_desc: "국민이 하루를 보내려면 강력하고 신뢰할 수 있으며 일관된 에너지가 필요합니다. 여기저기서 발생하는 불시의 정전은 불가피하지만, 그것이 일상이 되어서는 안 됩니다. 주요 전력망을 강화하여 에너지 부문의 신뢰성을 확보하겠습니다."
 ENG_strengthen_pension_credit: "연금 크레딧 강화"
 ENG_strengthen_pension_credit_desc: "국가 연금 수급 연령을 넘긴 저소득층에게 정부 급여 제도를 제공함으로써, 이들의 주 소득을 최소 수준까지 끌어올리고 주거비와 기타 비용을 지원할 수 있을 것입니다."
 ENG_the_workers_of_yesterday: "어제의 노동자들"
 ENG_the_workers_of_yesterday_desc: "어제의 노동을 헛되이 보내서는 안 됩니다. 은퇴한 이들을 위한 연금 프로그램을 확대하고, 그들이 새로운 세대에게 전문 지식을 전수하기로 한다면 추가 혜택까지 제공할 수도 있습니다."
 ENG_tenant_regulation: "임차인 규제"
 ENG_tenant_regulation_desc: "다른 사람들에게 임대하기 위해 부동산을 내놓은 집주인들을 저버려서는 안 됩니다. 재산은 존중되어야 하며, 따라서 모두가 만족하도록 보장하려면 규제가 필요한 요소입니다."
 ENG_a_future_fair_for_all: "모두를 위한 공정한 미래"
 ENG_a_future_fair_for_all_desc: "세상이 발전할수록 사람들의 생활 여건은 오히려 퇴보하는 듯합니다. 새천년의 여명과 함께 찾아온 설렘 속에서 세계 사람들은 각국 정부가 마침내 더 나은 방향으로 변화하리라는 희망을 품었습니다. 그러나 현실은 그렇지 않았습니다. 민주주의의 후퇴, 치솟는 생활비, 전반적인 혼란이 세상을 제 길에서 벗어나게 했습니다. 영국이 이 죽음의 소용돌이에 빠지지 않도록 가능한 모든 노력을 기울여야 합니다."
 ENG_crime_and_immigration: "범죄와 이주"
 ENG_crime_and_immigration_desc: "우파 진영에서는 이주민에 대한 규제 강화를 요구하는 목소리가 나오고 있습니다. 그들이 왜 그런 주장을 하는지는 이해하지만, 그들의 요구에 굴복한다면 우리 당의 핵심 원칙에서 더 멀어지고 보다 보수적인 방향으로 나아가게 될 것입니다."
 ENG_democratic_reform: "민주주의 개혁 추진"
 ENG_democratic_reform_desc: "현재 주 차원에서 보다 권위주의적인 결정이 내려질 수 있게 하는 허점이 존재합니다. 이제 우리가 직접 나서서 이 정치적 모호함으로 이익을 보는 자들을 압박할 법안을 마침내 의회에 상정해야 할 때입니다."
 ENG_a_global_future: "세계적 미래"
 ENG_a_global_future_desc: "국가 내부의 문제에만 집중할 수는 없으며, 세계적인 문제에도 관심을 기울여야 합니다. 타국의 주권을 고려하면서 [ENG.GetAdjective] 영향력을 전 세계로 확산시키는 것을 목표로 삼겠습니다."
 ENG_national_renewal: "국가 쇄신"
 ENG_national_renewal_desc: "[ENG.GetAdjective] 정치의 재편은 일종의 국가 쇄신 운동으로 이어졌으며, 사람들은 계속해서 변화를 요구하고 있습니다. 우리는 멈추지도 쉬지도 않을 것이며, 변화를 이뤄내는 일을 계속할 것입니다. 물론, 좋은 변화를 말입니다."
 ENG_with_open_arms: "두 팔 벌려"
 ENG_with_open_arms_desc: "이주민의 중요성을 인식해야 합니다. 두 팔 벌려 맞이하든 그렇지 않든, 계속해서 그들을 밀어낸다면 달리 얻을 수 없는 상당한 인재를 놓치게 될 것입니다."
 ENG_community_payback: "지역 사회 보상 프로그램"
 ENG_community_payback_desc: "지역 사회 보상 프로그램은 범죄자를 어떻게 처벌할지를 지역 사회가 정할 수 있도록 하는 것을 목표로 합니다. 복역 기간에서 사회봉사의 종류에 이르기까지 모든 것이 해당됩니다. 모든 것은 지역 사회에 달려 있지만, 그 혜택은 온 나라가 누리게 될 것입니다."
 ENG_checks_on_migration: "이주 심사"
 ENG_checks_on_migration_desc: "이주민이 아무리 필요하더라도 사전 심사 없이 그냥 들여보낼 수는 없습니다. 이주민이 진정으로 해를 끼칠 의도가 없는지 확인하기 위한 심사를 도입하겠습니다."
 ENG_australian_style_point_system: "오스트레일리아식 점수제"
 ENG_australian_style_point_system_desc: "우리의 오스트레일리아 친구들의 선례를 따라, 기술과 국가에 기여할 능력에 따라 이주민을 받아들이는 점수제를 도입하겠습니다."
 ENG_tough_on_anti_social_behavior: "반사회적 행동에 대한 강경 대응"
 ENG_tough_on_anti_social_behavior_desc: "국민이 일하도록 동기를 부여해야 합니다. 하루 종일 집에 앉아 있어서는 아무것도 이룰 수 없습니다. 청년들이 경찰과 군, 특히 방위 산업에서 인턴으로 근무할 수 있게 하여 그들이 일하도록 이끌 수 있습니다."
 ENG_renewed_police_budget: "경찰 예산 재편성"
 ENG_renewed_police_budget_desc: "경찰이 예산 부족에 시달려서는 안 됩니다. 지역 사회의 안전을 지켜줄 강력하고 탄탄한 경찰력의 중요성을 인식해야 합니다."
 ENG_established_refugee_programs: "난민 프로그램 수립"
 ENG_established_refugee_programs_desc: "제대로 된 난민 프로그램이 없다면 고향을 떠나온 이들은 아무것도 가진 것 없이 우리에게 올 것입니다. 난민이 사회에 통합되고 국가 경제에 기여하는 방향으로 일하도록 하는 종합 계획을 수립하겠습니다."
 ENG_streamlined_citizenship_process: "간소화된 시민권 절차"
 ENG_streamlined_citizenship_process_desc: "본론으로 들어갑시다. 시민권을 취득하려는 사람들이 거쳐야 할 관문을 추가로 늘리는 것은 불필요합니다. 더 빠른 통합을 허용하는 편이 장기적으로 모두에게 더 이로울 것입니다."
 ENG_neighbourhood_police_teams: "지역 방범 팀"
 ENG_neighbourhood_police_teams_desc: "치안 비용을 늘리는 대신 정반대로 할 수 있습니다. 주민들에게 방범 팀을 꾸리도록 요청함으로써, 범죄가 적절한 당국에 신고되어 처리될 수 있는 수준까지 사법을 분산시킬 수 있으며, 순찰 부대가 모든 곳에 동시에 있을 필요도 없어집니다."
 ENG_cctv_reduce_fear: "CCTV가 두려움을 줄인다"
 ENG_cctv_reduce_fear_desc: "공공장소의 카메라는 국가 및 시민 안보를 유지하는 데 필수적인 요소입니다. 범죄자가 붙잡힌다는 것을 국민이 알면 안심하게 되고, 범죄자는 범행을 저지르기 전에 한 번 더 생각하게 됩니다."
 ENG_britain_can_be_better: "영국은 더 나아질 수 있다"
 ENG_britain_can_be_better_desc: "적절한 변화와 개혁이 이루어진다면 영국은 더 나아질 수 있습니다. 지금의 영국이 나쁘다는 뜻이 아니라, 개선의 여지는 언제나 있다는 뜻입니다. 영국 국민은 우리 당인 노동당에게 개혁을 향한 영국의 전진을 이끌어 달라고 맡겼습니다. 우리는 그들을 실망시킬 수 없으며, 그들의 목소리가 반영되도록 모든 힘을 다해야 합니다."
 ENG_more_power_to_people: "국민에게 더 많은 권력을"
 ENG_more_power_to_people_desc: "정부의 권력은 국민의 손에 있어야 합니다. 결국 정치인도 국민 속에서 나온 사람들입니다. 정치적 세습 가문이 부상하여 권력을 장악하도록 놔두어서는 안 됩니다."
 ENG_westminster_reinforced: "웨스트민스터 강화"
 ENG_westminster_reinforced_desc: "때로는 국민이 자신이 정확히 무엇을 요구하는지 알지 못합니다. 이런 경우에는 정부의 관여를 늘리고, 정치 전문가들이 나서서 국민을 대신해 결정을 내려야 합니다."
 ENG_further_digital_governance: "디지털 행정 확대"
 ENG_further_digital_governance_desc: "국민은 정부와 더 자유롭게 소통할 수 있어야 합니다. 인터넷은 이를 위한 완벽한 도구이며, 국민이 디지털 공간을 통해 정부 자원에 접근하게 함으로써 큰 문제 없이 통치 역량을 더욱 확대할 수 있을 것입니다."
 ENG_a_union_of_nations: "국가들의 연합"
 ENG_a_union_of_nations_desc: "영국은 하나의 민족 국가가 아니라 여러 민족 국가의 연합입니다. 각 구성국이 정확하게 대표되도록 보장할 것이며, 이는 그들에게 경제적 기회에 대한 접근권을 부여하는 역량을 통해 이루어질 것입니다."
 ENG_reconsider_the_lobbying_act: "로비법 재검토"
 ENG_reconsider_the_lobbying_act_desc: "로비법은 로비 단체가 자금 출처를 공개하도록 하고 지출 가능 금액을 규제하는 등의 조치로 정부 투명성을 크게 높였다는 평가를 자주 받아 왔습니다. 그러나 이는 우리의 활동에도 영향을 미쳤으며, 일각에서는 이 법안의 재검토를 요구하고 있습니다."
 ENG_people_led_constitutional_convention: "국민 주도 제헌 회의"
 ENG_people_led_constitutional_convention_desc: "국민이 제헌 회의를 이끌도록 요청하여 단일성을 다원성으로 대체할 것입니다. 국민의 표를 통해 우리에 대한 그들의 신뢰는 영원히 보장될 것입니다."
 ENG_corporaet_led_constitutional_convention: "기업 주도 제헌 회의"
 ENG_corporaet_led_constitutional_convention_desc: "기업은 영국에 무엇이 최선인지 알고 있습니다. 따라서 나라를 이끄는 데 있어 그 누구보다 기업의 이익을 우선시해야 합니다. 결국 돈을 가진 것은 그들이니까요."
 ENG_revised_town_laws: "도시 조례 개정"
 ENG_revised_town_laws_desc: "일부 도시 조례에는 여전히 상당히 낡은 규칙과 규정이 남아 있습니다. 이를 정비하기 시작하는 것이 좋으며, 특히 일부 조례는 특정 산업의 활동에 차질을 빚고 있습니다."
 ENG_replacing_the_house_of_lords: "상원 교체"
 ENG_replacing_the_house_of_lords_desc: "상원은 세계에서 가장 오래된 기관 중 하나이지만, 동시에 가장 퇴행적인 기관 중 하나이기도 합니다. 의회에 대한 그들의 끊임없는 간섭은 법안 통과에 골칫거리가 되었으며, 이에 대한 조치가 필요합니다."
 ENG_ulift_peerages: "귀족 작위 격상"
 ENG_ulift_peerages_desc: "영국이 전통에서 멀어지는 것을 막기 위한 첫걸음은 귀족 작위를 격상하는 것입니다. 귀족 작위를 통해 우리의 전통과 궁정 문화를 지킬 수 있습니다."
 ENG_abolish_life_peerages: "종신 귀족 작위 폐지"
 ENG_abolish_life_peerages_desc: "귀족 작위는 선출되는 것이 아니라 전적으로 세습되거나 임명됩니다. 귀족 작위에는 민주적인 요소가 전혀 없으며, 이를 폐지하면 귀족층의 영향력이 크게 억제될 것입니다."
 ENG_common_expertise: "평범한 이들의 전문성"
 ENG_common_expertise_desc: "우리에게 필요한 것은 기업이나 정치인, 외국인의 전문성이 아니라 평범한 사람들의 전문성입니다. 평범한 계층의 진짜 사람들이 나라를 이끌어 더 밝고 나은 미래로 나아가야 합니다."
 ENG_technocratic_expertise: "기술 관료의 전문성"
 ENG_technocratic_expertise_desc: "스스로 능력을 입증한 이들은 거의 예외 없이 부유하고 교육 수준이 높습니다. 그들의 전문성을 정부에 도입하면 영국의 발전이 열 배로 가속될 것입니다."
 ENG_labour_for_workers_and_ceos_alike: "노동당: 노동자와 CEO 모두를 위하여"
 ENG_labour_for_workers_and_ceos_alike_desc: "CEO와 사회 상류층을 소외시키는 일은 삼가야 합니다. 대신 그들을 달래고, 더 나은 노동 규제를 가능하게 할 협상과 타협을 향해 나아가야 합니다."
 ENG_the_queens_family: "여왕의 가족"
 ENG_the_queens_family_desc: "군주의 힘은 법이나 전통에만 있는 것이 아니라, 국가가 위기에 처했을 때 그녀의 뒤에 서는 측근들에게도 있습니다. 여왕의 최측근 모임에 초대받은 이들은 그녀의 이름으로 영향력을 행사하겠지만, 가까움을 권위로 착각해서는 결코 안 됩니다. 왕실은 유일한 불변의 존재이며, 가족이 어떻게 왕실을 섬길지는 여왕이 결정할 것입니다."
 ENG_the_prince_trust: "프린스 트러스트"
 ENG_the_prince_trust_desc: "왕실이 존속하는 것은 적응하기 때문이며, 프린스 트러스트만큼 실용적인 수단도 드뭅니다. 그 활동 범위를 넓힘으로써 왕실의 후원을 측정 가능한 기회, 훈련, 견습 제도, 그리고 소외된 이들이 사회로 돌아올 수 있는 사다리로 바꿀 수 있습니다. 이는 확실한 성과를 내는 연성 권력이며, 군주제에 가장 중요한 곳, 즉 평범한 영국인의 삶 속에서 군주제를 강화합니다."
 ENG_harmony_doctrine: "조화 교리"
 ENG_harmony_doctrine_desc: "양극화의 시대에 군주제의 권위는 통치하지 않고도 통합할 수 있는 능력에 있습니다. 정부, 산업계, 신앙 공동체, 시민 사회 사이의 조용한 중재인 조화 교리를 추진하여 분열을 줄이고 국민적 결속을 재건할 것입니다. 국가는 명령할 수 있지만, 왕실은 화해시킬 수 있습니다."
 ENG_climate_alarm_bell: "기후 경종을 울리다"
 ENG_climate_alarm_bell_desc: "경고는 더 이상 이론에 그치지 않으며, 지금의 지연은 국가적 대가를 치르게 합니다. 왕위 계승자의 영향력을 활용하여 에너지 안보에서 식량 회복력, 인프라 계획에 이르기까지 모든 의제에 기후 위험을 올려놓겠습니다. 왕궁이 명확하게 말하면 가장 소극적인 부처도 귀를 기울입니다."
 ENG_duchy_originals: "더치 오리지널스"
 ENG_duchy_originals_desc: "공작령은 전통 이상의 존재가 될 수 있습니다. 현대적인 관리가 수익성이 있음을 보여주는 증거가 될 수 있습니다. 더치 오리지널스를 지속 가능한 생산, 윤리적 공급망, 지역 공동체를 공동화하지 않고도 유지하는 농촌 기업의 모범으로 확대하겠습니다. 왕실이 본보기를 보여야 한다면, 스스로 수지를 맞추는 본보기여야 할 것입니다."
 ENG_heir_of_the_realm: "왕국의 후계자"
 ENG_heir_of_the_realm_desc: "엘리자베스의 치세는 한 시대를 규정했지만, 왕국은 언제나 다음에 올 것을 내다보아야 합니다. 후계자의 국가적 역할, 즉 더 높은 가시성, 국정 보고에 대한 더 깊은 접근권, 연합 전역에서의 더 뚜렷한 존재감을 공식화하겠습니다. 연속성은 저절로 주어지는 것이 아니라 준비하는 것입니다."
 ENG_naval_prince: "해군의 왕자"
 ENG_naval_prince_desc: "왕실의 복무는 연극이 아니라 군복을 입고 얻은 신뢰에 대한 주장입니다. 요크 공작의 해군 정체성을 의례 행사와 모병 활동의 전면에 내세워 왕실과 함대 사이의 유대를 강화하겠습니다. 불확실한 바다에서도 의무의 상징은 여전히 국가를 안정시킬 수 있습니다."
 ENG_naval_prince_tt: "§Y$ENG_prince_andrew_leader_name$§!을(를) §Y군 최고 사령부§!로 해금합니다"
 ENG_appoint_trade_representative: "왕실 무역 대표 임명"
 ENG_appoint_trade_representative_desc: "영국의 영향력은 정부의 위임과 왕실의 권위를 함께 갖출 때 가장 멀리 뻗어 나갑니다. 왕실 무역 대표를 임명하여 문을 열고, 협력국을 안심시키며, 수출업자들에게 협상에서 주목받는 대변인을 제공하겠습니다. 장관들이 흥정하는 곳에서 왕실은 수여할 수 있습니다."
 ENG_emerging_markets_circuit: "신흥 시장 순방"
 ENG_emerging_markets_circuit_desc: "세계의 성장 축이 이동하고 있으며, 영국은 늦게 도착하는 손님이 되어서는 안 됩니다. 영국 기업이 다음 세계 수요의 물결에 자리 잡을 수 있도록 설계된 방문, 투자 포럼, 전략적 소개로 이루어진 신흥 시장 순방을 추진하겠습니다. 목표는 단순합니다. 지금은 관계를, 나중에는 지렛대를 얻는 것입니다."
 ENG_digital_enterprise_patronage: "디지털 기업 후원"
 ENG_digital_enterprise_patronage_desc: "무역은 점점 화물이 아니라 코드로 쓰이고 있습니다. 왕실의 후원을 활용하여 영국의 디지털 기업, 핀테크, 사이버 보안, 첨단 서비스, 그리고 이를 키워내는 스타트업의 위상을 높여, 위신을 투자로, 투자를 일자리로 바꾸겠습니다. 왕궁이 현대화할 수 있다면 경제도 그럴 수 있습니다."
 ENG_duty_of_the_crown: "왕실의 의무"
 ENG_duty_of_the_crown_desc: "왕실의 직위는 방패가 아니라 의무입니다. 공작의 공적 역할을 눈에 보이는 봉사, 절제된 대외 활동, 그리고 국가 생활에서 이 제도의 위치를 정당화하는 성과를 중심으로 짜겠습니다. 군주제에서 의무는 결코 가치가 떨어지지 않는 유일한 화폐입니다."
 ENG_workhorse_of_the_crown: "왕실의 일꾼"
 ENG_workhorse_of_the_crown_desc: "군주제는 볼거리만으로 존속하는 것이 아니라 끊임없고 눈에 보이는 봉사로 존속합니다. 빽빽한 일정, 지역 방문, 조용한 후속 조치로 이루어진 프린세스 로열의 의무 모델을, 대중이 진짜 일로 인정하는 표준으로 끌어올리겠습니다. 왕실이 의심받을 때 내놓아야 할 답은 바로 이것입니다."
 ENG_carers_recognition_campaign: "돌봄 제공자 인정 캠페인"
 ENG_carers_recognition_campaign_desc: "영국의 돌봄은 인정은 거의 받지 못하고 휴식은 더더욱 없는 이들에 의해 제공되는 경우가 많습니다. 왕실의 후원 아래 전국적인 돌봄 제공자 인정 캠페인을 시작하여, 정부와 시민 사회가 무보수 돌봄 제공자에게 실질적인 부담 경감과 사회적 존중을 제공하도록 촉구하겠습니다. 해외에서의 복무를 기리는 나라는 국내에서의 봉사 또한 기려야 합니다."
 ENG_discipline_service: "복무에서의 규율"
 ENG_discipline_service_desc: "표류하는 왕실은 표적이 되지만, 규율이 선 왕실은 다시 하나의 제도가 됩니다. 행동 기준을 강화하고, 왕실 가정의 일과를 다잡으며, 모든 공적 의무에서 전문적인 수행을 요구하겠습니다. 앤의 본보기는 화려하지 않지만 오래갑니다."
 ENG_princess_admiral_royal_navy: "왕립 해군 공주 제독"
 ENG_princess_admiral_royal_navy_desc: "왕립 해군은 단순한 장비가 아니라 전통이자 정체성이며 국가의 영향력 범위입니다. 프린세스 로열의 해군 내 역할을 심화하여 사기, 모병, 그리고 군과 국가 사이의 유대를 강화하겠습니다. 평시에도 위기에도 함대는 왕실이 함께한다는 것을 알아야 합니다."
 ENG_princess_admiral_royal_navy_tt: "§Y$ENG_princess_anne_leader_name$§!을(를) §Y군 최고 사령부§!로 해금합니다"
 ENG_colonel_of_horse_logistics: "기병 및 병참 대령"
 ENG_colonel_of_horse_logistics_desc: "군대는 연설이 아니라 규율과 병참으로 움직입니다. 프린세스 로열의 군 직위를 공식화하여 전투 준비 태세, 유지 능력, 그리고 작전의 승리를 가져오는 화려하지 않은 역량을 강조하겠습니다. 현대의 군대에는 전선 뒤의 노고를 존중하는 옹호자가 필요합니다."
 ENG_quiet_professionalism: "조용한 전문성"
 ENG_quiet_professionalism_desc: "절제에는 힘이 있고 일관성에는 신뢰가 있습니다. 조용한 전문성을 왕궁의 운영 철학으로 삼겠습니다. 연극은 줄이고 성과는 늘리며, 연합 전역에서 꾸준한 존재감을 보이겠습니다. 영국이 제 몫을 하는 군주제를 원한다면, 이것이 그 방법입니다."
 ENG_chairman_international_award: "국제 어워드 회장"
 ENG_chairman_international_award_desc: "유산은 어느 한 치세보다 오래 존속하는 제도에 의해 보존됩니다. 공작의 국제 어워드 지도력을 강화하여 다음 세대의 실용적 기술, 시민적 자신감, 리더십을 길러내겠습니다. 청소년에게 투자하는 군주제는 스스로의 미래에 투자하는 것입니다."
 ENG_trustee_network: "수탁자 네트워크"
 ENG_trustee_network_desc: "영향력은 선언되는 것이 아니라 이사회, 자선 단체, 그리고 공적 생활의 조용한 기구를 통해 유지됩니다. 신뢰할 만한 기관을 왕실 후원과 연결하는 수탁자 네트워크를 확대하여 조율을 개선하고 업계 전반의 기준을 끌어올리겠습니다. 왕실이 책임을 조직할 때 권위를 얻습니다."
 ENG_commonwealth_youth_outreach: "영연방 청년 교류"
 ENG_commonwealth_youth_outreach_desc: "영연방은 의례만으로는 존속할 수 없으며, 젊은 세대에게도 의미 있게 느껴져야 합니다. 교류, 훈련 프로그램, 공동 시민 사업으로 이루어진 지속적인 교류 활동을 시작하여 영국의 유대가 미래 지도자들의 삶 속에서 살아 있게 하겠습니다. 연성 권력은 개인적일 때 가장 강력합니다."
 ENG_production_guild_patronage: "생산 길드 후원"
 ENG_production_guild_patronage_desc: "산업은 상업인 만큼 문화이기도 하며, 영국의 창작 및 제작 부문은 전략적 자산입니다. 왕실 후원을 활용하여 영국의 제작물이 세계적 경쟁력을 갖추도록 하는 길드, 스튜디오, 숙련 직종을 지원하겠습니다. 위신은 주목을 끌고, 주목은 투자를 부릅니다."
 ENG_steady_hand: "듬직한 손길"
 ENG_steady_hand_desc: "끊임없는 감시를 받는 가문에서 안정은 전략적 미덕이 됩니다. 공작을 헤드라인이 아니라 봉사에 집중하는 믿음직하고 예측 가능한 듬직한 손길로 내세우겠습니다. 때로는 제도가 흔들리지 않게 지키는 것이 가장 가치 있는 왕실의 역할입니다."
 ENG_duke_charities: "공작의 자선 단체"
 ENG_duke_charities_desc: "에든버러 공작의 유산은 행한 연설이 아니라 세운 제도로 평가됩니다. 그의 자선 사업을 통합하고 전문화하여 장기적인 자금, 더 정교한 거버넌스, 지속적인 대중의 신뢰를 확보하겠습니다. 군주제가 존중받으려면 그 자선 활동은 의례만큼이나 엄정해야 합니다."
 ENG_international_award_conference: "국제 어워드 총회"
 ENG_international_award_conference_desc: "어워드의 강점은 언제나 세계적인 네트워크와 공유된 기준이었습니다. 국제 어워드 총회를 소집하여 협력 기관을 조율하고, 참여를 확대하며, 새로운 세대를 위해 프로그램을 현대화하겠습니다. 왕실의 유산은 국제적으로 조직될 때 하나의 체계가 됩니다."
 ENG_wwf_president_emeritus: "WWF 명예 총재"
 ENG_wwf_president_emeritus_desc: "자연 보전은 더 이상 틈새 사안이 아니며, 이름만 다른 국가 안보입니다. 공작이 WWF 명예 총재로서 지닌 위상을 활용하여 야생 동물 보호, 생물 다양성, 환경 관리를 중대한 정책 우선순위로 끌어올리겠습니다. 왕궁이 자연을 전략적 사안으로 규정하면 정부도 이를 외면하기 어렵습니다."
 ENG_prince_phillip_medal: "필립 공 메달"
 ENG_prince_phillip_medal_desc: "상징은 올바른 미덕에 보답할 때 의미를 가집니다. 실용적 봉사, 공학, 산업, 비상 대응, 그리고 영국이 돌아가게 하는 화려하지 않은 역량을 기리는 필립 공 메달을 제정하겠습니다. 이는 금속에 새긴 왕실의 메시지, 즉 중요한 것은 결과라는 메시지입니다."
 ENG_strength_and_stay: "강인함과 버팀"
 ENG_strength_and_stay_desc: "군주제는 압박 속에서도 흔들리지 않음으로써 존속합니다. 공작의 오랜 철학, 즉 규율, 회복력, 스쳐 가는 유행에 굽히지 않는 태도를 왕실 가문의 대외적 자세에 투영하겠습니다. 폭풍이 닥칠 때 왕실은 흔들림 없어 보여야 합니다."
 ENG_from_sandhurst_to_service: "샌드허스트에서 봉사로"
 ENG_from_sandhurst_to_service_desc: "왕실의 다음 세대는 의례 이상의 면에서도 신뢰를 얻어야 합니다. 왕자의 공적 역할을 절제된 봉사, 군사적 전문성, 의무, 그리고 어렵게 배운 실천적 리더십에 두겠습니다. 샌드허스트는 배지가 아니라 기준입니다."
 ENG_royal_foundation: "왕립 재단"
 ENG_royal_foundation_desc: "현대의 군주제는 전통이 아니라 영향력으로 평가됩니다. 왕립 재단을 왕자의 주된 수단으로 확대하여 전문적인 프로그램, 측정 가능한 성과, 정치적 교체에도 살아남을 수 있는 협력 관계를 구축하겠습니다. 왕궁이 이끌려면 성과를 내야 합니다."
 ENG_heads_together: "헤즈 투게더"
 ENG_heads_together_desc: "회복력 있는 국가에는 튼튼한 국경뿐 아니라 튼튼한 정신도 필요합니다. 헤즈 투게더를 정신 건강 이해 증진, 낙인 해소, 말없이 고통받는 이들을 위한 실질적 지원을 위한 전국적 운동으로 격상하겠습니다. 왕실이 연민을 법으로 정할 수는 없지만, 그것을 당연한 것으로 만들 수는 있습니다."
 ENG_veteran_armed_forces_support: "참전 용사 지원"
 ENG_veteran_armed_forces_support_desc: "복무는 군복을 벗는다고 끝나지 않습니다. 자선 단체, 고용주, 정부 간 조율을 통해 참전 용사와 군인 지원을 강화하여, 짐을 짊어졌던 이들이 이후에 버려지지 않도록 하겠습니다. 희생을 요구하는 나라는 존엄을 보장해야 합니다."
 ENG_bridge_to_the_future: "미래로 가는 다리"
 ENG_bridge_to_the_future_desc: "엘리자베스의 치세는 연속성을 상징합니다. 윌리엄은 전환을 상징해야 합니다. 왕자를 방식은 현대적이고, 어조는 절제되며, 봉사라는 정당성에 뿌리를 둔 미래로 가는 다리로 만들어 가겠습니다. 군주제의 다음 장은 왕관이 넘어가기 전에 시작됩니다."
 ENG_queen_eldest: "장자 계통의 조언"
 ENG_queen_eldest_desc: "여왕은 대외적으로는 연속성을, 국내에서는 자신감을 보여주기 위해 장자 계통에 의지합니다. 후계자의 대중적 영향력과 왕실 특사의 접근권을 통해 왕실은 장관들이 열지 못하는 문을 열 수 있고, 모든 수도에서 영국의 목소리가 들리게 할 수 있습니다."
 ENG_queen_middle: "중간의 기둥"
 ENG_queen_middle_desc: "여왕은 제도가 규율과 성과로 돌아가도록 중간 세대에 의존합니다. 그들의 강점은 볼거리가 아니라 일정, 기준, 그리고 왕실을 스캔들과 표류로부터 지켜주는 조용한 역량입니다."
 ENG_queen_youngest: "내일로 가는 다리"
 ENG_queen_youngest_desc: "여왕은 검증된 안정감으로 왕실 가문의 중심을 잡으면서, 다음 시대를 공공연히 준비하고 있습니다. 노련한 배우자의 제도적 무게와 차기 후계자의 현대적 복무 이력을 통해, 군주제는 쇄신이 혼란스럽지 않고 통제되고 있음을 알립니다."
 ENG_triumph_of_the_crown: "왕실의 승리"
 ENG_triumph_of_the_crown_desc: "균형은 기울었고, 왕실은 더 이상 전통만으로 군림하지 않습니다. 군주제가 국가를 지휘하게 되면서 영국은 충성이 보상받고, 반대는 관리되며, 국가의 방향이 왕궁에서 정해지는 새로운 체제에 들어섭니다. 이제 왕국은 하나의 목적으로 움직일 것이며, 세계는 왕실이 통치하러 돌아왔음을 알게 될 것입니다."
 ENG_the_queens_speech_title: "여왕의 연설"
 ENG_the_queens_speech_desc: "[ENG_the_queens_speech_focus_description]"
 ENG_the_kings_speech_title: "국왕의 연설"
 ENG_restore_civil_liberties: "시민적 자유 회복"
 ENG_restore_civil_liberties_desc: "통치하는 왕실은 스스로를 억제할 수 있음도 증명해야 합니다. 비상 권한을 철회하고, 적법 절차를 복원하며, 영국의 권위를 정당하게 만드는 권리를 재확인하겠습니다. 반대자들은 이를 나약함이라 부르겠지만, 왕국은 이를 자신감이라 부를 것입니다."
 ENG_rule_sword_sceptre: "검과 홀에 의한 통치"
 ENG_rule_sword_sceptre_desc: "낡은 제약은 실패했으며 왕국은 망설임으로 통치될 수 없습니다. 왕실의 권위를 국가 권력의 수단과 결합하여 왕실의 뜻이 지체 없이 집행되도록 하겠습니다. 영국은 질서 정연하고 단호할 것이며, 예의를 나약함으로 착각하는 자들에게 두려움의 대상이 될 것입니다."
 ENG_royal_prerogative_activation: "왕권 대권 발동"
 ENG_royal_prerogative_activation_desc: "헌법의 그늘에는 아껴 쓰고 조심스럽게 언급되는 권한이 존재합니다. 왕권 대권을 발동하여 마비 상태를 우회하고 정부 기구를 강제로 정렬시켜 국가를 신속하게 움직이겠습니다. 왕실이 움직이면 왕국이 따릅니다."
 ENG_a_bid_soft_power: "연성 권력을 향한 도전"
 ENG_a_bid_soft_power_desc: "권력은 함선과 예산으로만 측정되는 것이 아니라 위신, 접근성, 그리고 국제 사회의 분위기를 정하는 능력으로도 측정됩니다. 왕실을 영국 연성 권력의 원동력으로 삼아, 문화 외교, 해외에서의 왕실 후원, 어떤 내각보다 오래 지속되는 영향력 네트워크를 확대하겠습니다. 남들이 헤드라인을 쫓을 때 우리는 서사를 만들어 가겠습니다."
 ENG_commonwealth_summit: "영연방 정상회의 개최"
 ENG_commonwealth_summit_desc: "영연방은 제국의 메아리가 아니라 전략으로 다듬을 수 있는 네트워크입니다. 왕실의 주도 아래 영연방 정상회의를 개최하여 무역, 안보 협력, 공동 개발에 관한 새로운 약속을 확보하겠습니다. 영국이 다시 이끌려면 먼저 친구들을 한자리에 모으는 것에서 시작해야 합니다."
 ENG_crown_procurement_program: "왕실 조달 프로그램"
 ENG_crown_procurement_program_desc: "통치하는 군주제는 더딘 계약과 장관들의 영역 다툼에 의존할 수 없습니다. 왕실 조달 프로그램을 설립하여 구매를 중앙 집중화하고, 재무장을 가속하며, 기한 내에 대규모로 납품하는 기업에 보상하겠습니다. 왕궁이 서명하면 산업이 움직일 것입니다."
 ENG_modernize_royal_navy: "왕립 해군 현대화"
 ENG_modernize_royal_navy_desc: "영국의 영향력은 언제나 바다에서 비롯되었으며, 왕실은 해상 교통로를 통제하지 못하는 왕국을 통치하지 않을 것입니다. 새 함체, 더 정교한 교리, 본국 해역에서 멀리 떨어진 작전을 지탱할 병참으로 왕립 해군을 현대화하겠습니다. 경쟁자들이 우리 항구를 지켜보며 거기서 무엇이 떠나는지 헤아려 보게 하십시오."
 ENG_raf_army_overhaul: "RAF와 육군 쇄신"
 ENG_raf_army_overhaul_desc: "항공 엄호와 지상 전력이 없는 함대는 방패가 아니라 상징일 뿐입니다. 현대적인 지휘 체계, 개량된 장비, 고강도 전쟁에 맞춘 훈련으로 RAF와 육군을 쇄신하겠습니다. 왕실은 낡은 전력에 자신의 권위를 걸지 않을 것입니다."
 ENG_leverage_crown_estate: "크라운 에스테이트 활용"
 ENG_leverage_crown_estate_desc: "크라운 에스테이트는 유산 이상의 전략적 수단입니다. 그 자산을 활용하여 국가 사업의 자금을 대고, 핵심 산업을 안정시키며, 파운드마다 의회에 구걸하지 않고도 장기 개발의 기틀을 놓겠습니다. 군주제가 통치하려면 투자하는 법도 배워야 합니다."
 ENG_national_service_act: "국민 복무법 통과"
 ENG_national_service_act_desc: "안보를 원하는 왕국은 자기 몫을 짊어질 각오가 되어 있어야 합니다. 국민 복무법을 통과시켜 인력, 규율, 그리고 온 나라에 걸친 공동의 책무 의식을 구축하겠습니다. 누군가는 이를 강제라 부르겠지만, 왕실은 이를 의무라 부를 것입니다."
 ENG_new_constitutional_charter: "새 헌법 헌장 기초"
 ENG_new_constitutional_charter_desc: "낡은 체제는 다른 영국을 위해 쓰인 것이며 압박 속에서는 더 이상 버티지 못합니다. 왕실의 권위, 의회의 한계, 정치를 넘어서 존속하는 권리를 규정하는 새 헌법 헌장을 기초하겠습니다. 일단 봉인되면 왕국은 명확함을 얻을 것이며, 명확함은 곧 힘입니다."
 ENG_secure_succession: "왕위 계승 확보"
 ENG_secure_succession_desc: "통치하는 군주제는 정상의 불확실성을 감당할 수 없습니다. 명확한 법, 치밀한 계획, 후계자의 위임에 대한 공개적 확인을 통해 왕위 계승을 확보하겠습니다. 연속성은 저절로 주어지는 것이 아니라 강제되는 것입니다."
 ENG_rule_councillorship: "자문관 통치"
 ENG_rule_councillorship_desc: "의회 통치는 파벌을 낳지만, 왕실은 신뢰하는 이들의 손을 통해 통치할 수 있습니다. 왕실 자문관 위원회가 정책을 입안하고, 부처를 감독하며, 국가가 왕궁과 보조를 맞추도록 권한을 부여하겠습니다. 영국은 정당 간 흥정이 아니라 역량과 충성으로 통치될 것입니다."
 ENG_convene_foreign_secretary_cabinet: "외무장관 내각 소집"
 ENG_convene_foreign_secretary_cabinet_desc: "왕실의 권위가 걸려 있을 때 외교는 즉흥적으로 할 수 없습니다. 외무장관 내각을 소집하여 대사, 정보, 무역 특사, 국방 기획자를 하나의 지휘 아래 조율하겠습니다. 영국은 해외에서 한목소리로 말할 것이며, 그것은 올바른 목소리일 것입니다."
 ENG_champion_liberal_values: "자유주의 가치 옹호"
 ENG_champion_liberal_values_desc: "군주제가 통치하려면 영국이 자신의 것으로 인정할 수 있는 원칙에 따라 통치해야 합니다. 자유주의 가치를 옹호하고, 자유로운 제도를 수호하며, 왕실의 권위가 권리 및 절제와 공존할 수 있음을 증명하겠습니다. 왕실은 강력할 것이며, 또한 정당할 것입니다."
 ENG_european_outreach: "유럽 대화 확대"
 ENG_european_outreach_desc: "영국은 코앞에서의 고립을 감당할 수 없습니다. 유럽 대화 확대 운동을 시작하여 소통 창구를 재건하고, 이해관계가 겹치는 곳에서 협력을 확보하며, 경쟁자들이 우리 없이 대륙의 조건을 정하지 못하도록 막겠습니다. 왕실이 직접 교섭할 것이며, 유럽은 이를 주목하게 될 것입니다."
 ENG_close_proximity_nato: "NATO와의 긴밀한 관계"
 ENG_close_proximity_nato_desc: "NATO는 단순한 조약이 아니라 억지력과 접근성을 얻는 지렛대입니다. 왕실의 행동의 자유는 온전히 유지하면서 정보 공유, 상호 운용성, 전략적 종심을 확보하기 위해 동맹과 긴밀한 관계로 나아가겠습니다. 영국은 동맹이 되겠지만, 결코 종속되지는 않을 것입니다."
 ENG_joint_operational_command: "합동 작전 사령부 창설"
 ENG_joint_operational_command_desc: "군종 간의 경쟁은 시간을 낭비하며, 시간은 사람을 죽입니다. 합동 작전 사령부를 창설하여 해군, 육군, RAF 전반의 계획, 병참, 실행을 단일한 전투 교리 아래 통합하겠습니다. 왕실이 행동을 명령하면 모든 군종이 하나로 움직일 것입니다."
 ENG_reaffirm_special_relationship: "특수 관계 재확인"
 ENG_reaffirm_special_relationship_desc: "힘은 힘을 존중하며, 미국은 여전히 왕국의 가장 결정적인 협력국입니다. 정보 협력, 국방 조율, 최고위급의 공동 전략 기획을 통해 특수 관계를 재확인하겠습니다. 왕실은 세계의 운명이 결정되는 자리에서 영국의 좌석을 지킬 것입니다."
 ENG_royal_charitable_initiative: "왕실 자선 구상"
 ENG_royal_charitable_initiative_desc: "왕국이 보살핌을 받는다고 믿을 때 통치는 더 쉬워집니다. 왕실 자선 구상을 시작하여 자금, 자원봉사자, 대중의 관심을 어려움에 처한 지역 사회로 돌려, 왕실이 연민으로 통치할 수 있음을 증명하겠습니다. 충성은 도움이 가장 먼저 닿는 곳에서 가장 빠르게 자랍니다."
 ENG_time_for_common_sense: "상식의 시대가 왔다"
 ENG_time_for_common_sense_desc: "상식의 시대는 바로 지금입니다. 수년간의 노동당 주도 정부는 국민을 한때 영국을 영국답게 만들었던 이상에서 멀어지게 했습니다. 윈스턴 처칠 같은 위대한 인물들의 노력을 헛되이 할 수는 없습니다. 우리는 영국을 본래 되어야 했던 모습, 곧 강대국으로 빚어낼 것입니다."
 ENG_knowing_who_we_are: "우리가 누구인지 알기"
 ENG_knowing_who_we_are_desc: "우리는 먼저 영국인이며, 그다음이 유럽인입니다. 우리가 누구인지 잊어서는 안 됩니다. 우리는 세계가 일찍이 본 적 없는 초강대국의 후계자입니다. 대영 제국에는 정말로 해가 지지 않았으며, 우리가 할 수 있는 한 앞으로도 그러할 것입니다."
 ENG_a_world_leader: "세계의 지도자"
 ENG_a_world_leader_desc: "우리는 영국인이며, 누구에게도 뒤지지 않는 세계 지도자이자 자유의 수호자입니다. 세계 지도자로서의 장악력이 미끄러지게 놔둘 수 없습니다. 대신 우리는 세계 리더십의 최전선으로서 스스로를 다시 내세울 것입니다."
 ENG_fighting_the_power_of_brussels: "브뤼셀의 권력에 맞서다"
 ENG_fighting_the_power_of_brussels_desc: "브뤼셀은 행정 권능에서 선을 넘었습니다. 그들은 수사를 앞세워 우리 국가의 독립을 적극적으로 훼손하고 있으며, 영국이 원하는 바를 스스로 선택할 능력을 위협하고 있습니다!"
 ENG_a_civilized_society: "문명 사회"
 ENG_a_civilized_society_desc: "문명 사회로서 영국은 타인의 선전에 휘둘리지 않을 것입니다. 따라서 우리의 생활 방식에 급진적 변화를 가져오려는 이들의 영향력을 꺾기 위한 노력은 신속히 처리되어야 합니다."
 ENG_a_stronger_society: "더 강한 사회"
 ENG_a_stronger_society_desc: "우리 사회는 그 어느 때보다 강하고 단결될 것입니다. '개혁'이라는 미명 아래 타인이 우리의 단결을 갈라놓게 둘 수 없습니다. 우리의 핵심 가치를 계속 지켜야만 우리 사회는 더 강해질 수 있습니다."
 ENG_a_staunch_ally: "확고한 동맹"
 ENG_a_staunch_ally_desc: "우리는 NATO의 협력국들에게 확고한 동맹 그 자체입니다! 감히 우리를 무임승차자니, 느슨한 고리니, 그 사이의 무엇이니 하고 비난하는 자들은 왔던 곳으로 돌아가도 좋습니다."
 ENG_town_and_country: "도시와 농촌"
 ENG_town_and_country_desc: "우리는 작고 소박한 농촌 마을을 잊을 수 없는 나라입니다. 이들을 온 힘을 다해 기억하고, 계속 나아갈 수 있도록 장려해야 합니다."
 ENG_a_more_flexible_europe: "더 유연한 유럽"
 ENG_a_more_flexible_europe_desc: "유럽은 전반적으로 외교 정책 목표에서 더 유연해질 필요가 있습니다. 대륙 전체가 더 강해지려면 유럽은 '통합'이라는 의제를 버리고 더 유연해지는 방향으로 나아가야 합니다."
 ENG_rural_friendly_transport_services: "농촌 친화적 교통 서비스"
 ENG_rural_friendly_transport_services_desc: "우리의 교통 서비스는 농촌 지역 사회에 그다지 친화적이지 않습니다. 이들을 만족시킬 방법을 찾아야 합니다."
 ENG_industrial_friendly_transport_services: "산업 친화적 교통 서비스"
 ENG_industrial_friendly_transport_services_desc: "일하는 사람이 문제없이 출퇴근할 수 있어야 합니다. 산업 지역으로 향하는 교통 서비스를 개편하거나 최소한 개선하는 방안을 검토해야 합니다."
 ENG_no_army_outside_of_europe: "유럽 밖에 군대는 없다"
 ENG_no_army_outside_of_europe_desc: "영국 군인들이 왜 유럽 경계 밖에 있습니까? 아시아에, 아프리카에, 중동에 그들이 있을 자리가 어디 있습니까? 우리는 대신 우리 병력을 유럽 안에 두는 데 집중해야 합니다."
 ENG_abolish_centrally_planned_housing: "중앙 계획 주택 폐지"
 ENG_abolish_centrally_planned_housing_desc: "중앙 계획 주택 의제에 예산을 배정하는 데 집중하는 대신, 그 자금을 더 중요한 일에 돌릴 수 있습니다."
 ENG_coming_to_the_aid_of_others: "타인을 돕기 위해 나서다"
 ENG_coming_to_the_aid_of_others_desc: "세상에는 우리의 도움이 절실한 이들이 있으며, 우리는 그들에게 도움을 제공하기 위해 여기 있습니다."
 ENG_global_matters_global_problems: "세계의 일은 세계의 문제"
 ENG_global_matters_global_problems_desc: "남들이 무엇을 겪고 있는지 우리가 왜 신경 써야 합니까? 그것은 그들의 문제이지 우리의 문제가 아닙니다! 그들 스스로 해결해야 합니다."
 ENG_credit_based_public_transport: "크레딧 기반 대중교통"
 ENG_credit_based_public_transport_desc: "일하고 계십니까? 좋습니다, 요금 걱정은 하지 않으셔도 됩니다. 일하는 사람이 무료로 대중교통을 이용할 수 있게 하여, 사람들이 일자리를 찾고 일하도록 동기를 부여할 수 있을 것입니다."
 ENG_safe_haven_not_safe_touch: "안전한 피난처, 안전한 접촉은 아님"
 ENG_safe_haven_not_safe_touch_desc: "우리는 진정으로 도움이 필요한 이들을 위한 안전한 피난처입니다. 아무나 들어오게 내버려 둔다면 그들이 우리나라를 파멸로 썩게 만들 것입니다."
 ENG_are_you_thinking_what_were_thinking: "우리와 같은 생각이십니까?"
 ENG_are_you_thinking_what_were_thinking_desc: ""
 ENG_power_to_the_bank_of_england: "영란은행에 힘을"
 ENG_power_to_the_bank_of_england_desc: "현재 영란은행은 그 어느 때보다 악화된 상태에 있습니다. 따라서 우리가 나서서 이 기관을 강화할 필요가 있습니다."
 ENG_british_dream: "영국의 꿈"
 ENG_british_dream_desc: "영국의 꿈은 이제 오랫동안 많은 이들이 품지 못한 꿈입니다. 공동체의 손실이라는 결과를 감내하지 않고도 모든 영국인이 번영하리라는 꿈이자 포부입니다."
 ENG_whats_wrong_with_discipline: "규율이 뭐가 문제입니까?"
 ENG_whats_wrong_with_discipline_desc: "우리 학교가 물러졌고 필요한 징계 조치를 취하기를 꺼리기 시작한 것으로 보입니다. 젊은이들에게 예절을 가르치는 것은 우리의 의무이며, 교육자들이 이를 알도록 하겠습니다."
 ENG_across_the_board_tax_slashes: "전면적 감세"
 ENG_across_the_board_tax_slashes_desc: "세금을 전면적으로 인하하면 사회 각계각층의 국민이 짊어진 부담이 크게 달라지는 것을 느낄 것입니다. 차별해서는 안 됩니다!"
 ENG_tax_slashes_only_for_some: "일부만을 위한 감세"
 ENG_tax_slashes_only_for_some_desc: "모두를 위해 세금을 인하할 예산도 의지도 없습니다. 우리에게 이익이 되는 곳에 한해서만 세금을 인하하도록 조율해야 할 것입니다."
 ENG_icnreased_control_for_administrators: "관리자 권한 강화"
 ENG_icnreased_control_for_administrators_desc: "학교에서 일하는 이들은 자신이 속한 기관의 사안에 발언권을 가질 수 있어야 합니다. 그렇게 하면 새로운 학자들이 성장하도록 할 수 있을 것입니다."
 ENG_keeping_hospitals_clean: "병원을 깨끗하게 유지"
 ENG_keeping_hospitals_clean_desc: "병원은 겉모습뿐만 아니라 신뢰성 면에서도 깨끗하게 유지되어야 합니다."
 ENG_corporate_invitations: "기업 초청"
 ENG_corporate_invitations_desc: "기업을 초청하여 경제 정책 결정을 돕게 해야 합니다. 그들은 우리 경제의 심장이며, 그들이 없다면 우리는 아무것도 아닐 것입니다."
 ENG_more_police_less_crime: "경찰은 늘리고 범죄는 줄이고"
 ENG_more_police_less_crime_desc: "너무나 명백하지 않습니까? 거리를 순찰하는 경찰이 늘어나면 범죄는 분명 훨씬 줄어들 것입니다."
 ENG_cutting_wait_times: "대기 시간 단축"
 ENG_cutting_wait_times_desc: "사람들은 의료 서비스를 받기까지 너무 오래 기다립니다. 이제 이에 대해 조치를 취하여 대기 시간을 절반으로 줄여야 할 때입니다!"
 ENG_turnaround_schools: "교정 학교"
 ENG_turnaround_schools_desc: "학생들이 수업 중에 제대로 앉아서 교사의 말을 듣지 못한다면 다른 방법을 생각해야 합니다. 교정 학교에 보내면 일부 소수 학생들과 관련된 이 문제를 마침내 해결할 수 있을 것입니다."
 ENG_structural_overhaul_of_nhs: "NHS 구조 개편"
 ENG_structural_overhaul_of_nhs_desc: "현 상태로는 NHS가 존속할 수 없습니다. NHS는 우리 돈을 모조리 빨아들이면서도 환자들을 아픈 채로 문밖에서 기다리게 하고 있습니다. NHS를 밑바닥부터 재건할 일련의 개혁을 시작해야 합니다."
 ENG_trusting_local_professionals: "전문가를 믿다"
 ENG_trusting_local_professionals_desc: "고장 나지 않았다면 왜 고치려 합니까? 의료 문제는 의료 전문가에게 맡기고, NHS가 몇 가지 소소한 조정만 거쳐 운영되도록 하겠습니다."
 ENG_keeping_up_our_guard: "경계를 늦추지 않기"
 ENG_keeping_up_our_guard_desc: "지금 상황이 평온하다고 해서 경계를 늦춰서는 안 됩니다. 안정과 번영의 시기에도 온갖 시나리오를 예상해야 합니다."
 ENG_benefitting_the_taxpayer: "납세자를 위하여"
 ENG_benefitting_the_taxpayer_desc: "납세자가 아니라면 우리는 누구를 섬기고 있습니까? 납세자들이 자신의 돈이 낭비되지 않는다고 안심할 수 있도록 하는 정책을 시행해야 합니다."
 ENG_invitation_to_the_government_of_britain: "영국 정부로의 초대"
 ENG_invitation_to_the_government_of_britain_desc: ""
 ENG_get_britain_moving_again: "영국을 다시 움직이게"
 ENG_get_britain_moving_again_desc: "영국을 다시 움직이게 할 때가 왔습니다. 경제가 저절로 회복되기를 기다리는 느리고 체계적이며 관습적인 전략은 다시는 쓰지 않을 것입니다. 우리가 직접 나서서 해결하겠습니다."
 ENG_cleanup_westminster: "웨스트민스터 정화"
 ENG_cleanup_westminster_desc: "웨스트민스터는 번거로운 절차와 관료적 월권으로 포화 상태에 빠진 엉망진창입니다. 이제 쇠망치를 들고 모든 것을 때려 부수어 이곳을 정화해야 할 때입니다."
 ENG_big_society_not_big_government: "큰 사회, 큰 정부가 아닌"
 ENG_big_society_not_big_government_desc: "왜 큰 정부가 필요합니까? 우리 사회가 충분히 훌륭하다면, 왜 그들 삶의 모든 면을 감시하고, 관리하고, 지시해야 합니까? 대신 우리는 정부를 줄이고 사회가 스스로 제 몫을 하도록 두겠습니다."
 ENG_household_debt_management_programs: "가계 부채 관리 프로그램"
 ENG_household_debt_management_programs_desc: "때로는 사람들이 빚을 갚을 수 없는 경우도 있으며, 그것은 괜찮습니다. 부채의 일부를 떠안거나 상환 계획을 도와주는 부채 관리 프로그램을 마련하겠습니다."
 ENG_bigger_place_for_educators: "교육자를 위한 더 큰 자리"
 ENG_bigger_place_for_educators_desc: "나라는 교육자들에게 더 많이 문을 열어야 합니다. 우리는 그들에게 마땅히 보여야 할 만큼 감사하지 못하고 있으며, 특히 그들이 하는 일에 대해 그렇습니다."
 ENG_the_most_family_friendly_country: "가장 가족 친화적인 나라"
 ENG_the_most_family_friendly_country_desc: "우리나라는 가족과 가정을 꾸리는 사람들을 받아들이는 데 더 열려 있어야 합니다. 인구가 정체되고 적은 상태로 머물러서는 안 되며, 우리는 성장하고 좋은 가치를 길러야 합니다."
 ENG_knowledge_for_industry: "산업을 위한 지식"
 ENG_knowledge_for_industry_desc: "지식이 다른 곳에서 낭비되도록 놔두는 대신, 그 두뇌의 힘 일부를 새로운 산업, 어쩌면 군수 산업으로 돌릴 수 있을 것입니다."
 ENG_power_of_recall: "소환권"
 ENG_power_of_recall_desc: "일부 총리가 거짓말을 한다는 것은 분명하며, 따라서 약속을 지키지 못하는 총리는 물러나야 합니다. 국민이 더 이상 앞장서 이끌기를 원하지 않는 총리를 소환할 수 있도록 허용해야 합니다."
 ENG_a_more_balanced_economy: "더 균형 잡힌 경제"
 ENG_a_more_balanced_economy_desc: "수십 년간의 노동당의 무능으로 우리 경제는 형편없는 상태입니다. 이제 상황을 다시 정상 궤도로 되돌려 놓을 때입니다!"
 ENG_bye_bye_bureaucracy: "관료주의여 안녕"
 ENG_bye_bye_bureaucracy_desc: "큰 자유를 누릴 수 있는데 누가 큰 정부를 필요로 하겠습니까? 유권자들의 일상에 관료주의는 필요 없으며, 필요한 것은 확대된 자유입니다."
 ENG_case_by_case_intervention: "사안별 개입"
 ENG_protecting_childhood: "유년기 보호"
 ENG_protecting_childhood_desc: "현재 우리 청소년은 인터넷이든 거리든 여러 경로를 통해 악질적인 자들에게 해를 입을 심각한 위험에 놓여 있습니다. 아이들이 자라나고 꽃피울 수 있도록 유년기를 보호하기 위한 추가 조치를 취해야 합니다."
 ENG_investigate_lost_funds: "사라진 자금 조사"
 ENG_investigate_lost_funds_desc: "어떤 이유에서인지 몇 년 전 막대한 정부 자금이 사라졌습니다. 이제 제대로 된 조사를 시작하여 무슨 일이 있었는지 밝혀낼 때입니다."
 ENG_a_more_transparent_government: "더 투명한 정부"
 ENG_a_more_transparent_government_desc: "우리 정부는 충분히 투명하지 않으며, 유권자들이 웨스트민스터에서 무슨 일이 일어나고 있는지 알 수 있도록 추가 조치를 취해야 합니다."
 ENG_petitions_for_debate: "토론을 위한 청원"
 ENG_petitions_for_debate_desc: "변화를 요구하는 청원에 상당수의 서명이 모이도록 허용한다면, 이를 의회에 올려 검토하게 하고 국민의 의견을 보다 직접적으로 반영할 수 있을 것입니다."
 ENG_public_reading_stage: "공개 독회 단계"
 ENG_public_reading_stage_desc: "투명성과 정부의 대민 접촉을 높이기 위해, 국민이 의회에서 통과되는 변화에 의견을 달고 토론할 수 있는 인터넷 포럼을 허용하겠습니다."
 ENG_for_the_common_man: "평범한 사람을 위하여"
 ENG_for_the_common_man_desc: "우리 정부는 판을 쥐고 흔드는 자들이 아니라 평범한 사람을 위한 정부입니다. 평범한 계층의 정치 활동을 늘릴 수 있는 맞춤형 개혁을 통과시키겠습니다."
 ENG_for_the_wealthy_man: "부유한 사람을 위하여"
 ENG_for_the_wealthy_man_desc: "도대체 가난한 사람들이 정부와 무슨 상관이 있습니까? 그들 대부분은 일하지 않으려고 정부 보조금만 바라는 좌익 건달들입니다. 우리는 실제로 일하고 경제에 기여하는 사회 구성원들을 우선하겠습니다."
 ENG_a_brighter_more_secure_future: "더 밝고 안전한 미래"
 ENG_a_brighter_more_secure_future_desc: ""
 ENG_operation_dagger: "단검 작전"
 ENG_operation_dagger_desc: "페르시아만은 한때 우리 군이 장악했으며, 무엇이 드나들지를 결정하는 우리의 능력은 거의 빈틈이 없었습니다. 그러나 오늘날 우리는 지역 세력들과 협상하기에 불리한 처지에 있으며, 무엇이든 해내려면 오히려 우리의 협상 카드에 의존해야 합니다. 무산담을 장악하면 다시 한번 걸프에서 우위를 점할 수 있을 것입니다."
 ENG_operation_barras: "바라스 작전"
 ENG_operation_barras_desc: "언론인과 방송인들 사이에서 흔히 '웨스트 사이드 보이즈'로 알려진 민병대 '웨스트 사이드 니거즈'가 영국 군인 여러 명을 붙잡아 인질로 억류하고 있다는 보고를 받았습니다. 우리는 이들의 목숨을 구하기 위해 어떤 형태로든 개입하라는 압박을 받고 있으며, 군 지휘부는 이를 수행할 바라스 작전을 입안했습니다. 작전 중 핵심 자원을 장악하는 추가 행동을 취할 수도 있으나, 이는 필수가 아닙니다."
 ENG_operation_coastal_star: "해안의 별 작전"
 ENG_operation_coastal_star_desc: "감비아가 위험하게도 권위주의와 불안정으로 표류하기 시작했으며, 분명 우리의 궤도에서도 벗어나고 있습니다. 어떤 형태로든 개입하여 방향을 바꾸게 해야 하며, 그렇지 않으면 서아프리카의 나머지 지역도 뒤따를 수 있습니다."
 ENG_operation_delta_guard: "델타 가드 작전"
 ENG_operation_delta_guard_desc: "나이지리아인들은 국가를 운영하는 법을 전혀 모르는 것이 분명하며, 우리는 델타 지역을 둘러싼 검은 황금이 낭비되는 상황에 대해 무언가 해야 할 의무가 있습니다. 그렇지 않으면 그저 낭비되도록 내버려 두는 셈이며, 누구도 그것을 원하지 않습니다. 델타 가드 작전은 나이지리아에서 경제적 우위를 재확립하게 해 줄 것이며, 그 수익은 분명 국가에 이로울 것입니다."
 ENG_the_sun_which_never_set: "지지 않는 태양"
 ENG_the_sun_which_never_set_desc: "대영 제국에는 정말로 해가 지지 않으며, 앞으로도 그러하도록 만들 것입니다."
 ENG_operation_resolute_banner: "단호한 깃발 작전"
 ENG_operation_resolute_banner_desc: "세르비아 정부가 코소보에 대한 위협을 계속하고 있으며, 그 결과 우리는 개입하여 금을 그을 수밖에 없게 되었습니다."
 ENG_falklands_policy: "포클랜드 정책"
 ENG_falklands_policy_desc: "수십 년 전 포클랜드를 두고 아르헨티나와 벌인 사소한 충돌에도 불구하고, 그 분쟁의 기억은 여전히 많은 이들의 마음에 생생합니다. 우리는 섬에 대한 새로운 정책으로 나아갈 수 있으며, 어쩌면 추가 조치를 취할 수도 있습니다."
 ENG_regime_change_in_zimbabwe: "보호 작전"
 ENG_regime_change_in_zimbabwe_desc: "오랫동안 집권해 온 짐바브웨의 독재자 [ZIM.GetLeader]을(를) 어떤 수단을 써서라도 타도해야 합니다. 영국인과 짐바브웨 국민에 대한 그의 억압을 묵과할 수 없으며, 정의가 신속히 구현되어야 합니다."
 ENG_operation_east_divide: "동부 분할 작전"
 ENG_operation_east_divide_desc: "수에즈는 영국의 정당한 땅이며, 수에즈가 없는 탓에 우리는 '국제 무역 규정'이라는 고초를 겪어야 했습니다. 따라서 이집트와 시나이 일부에 대한 통제권을 두고 합의를 시도할 것이며, 그렇지 않으면 이에 대해 조치를 취하는 수밖에 없습니다."
 ENG_operation_ninety_seven: "'97 작전"
 ENG_operation_ninety_seven_desc: "홍콩을 중국에 넘긴 것은 실수였으며, 그것도 중대한 실수였습니다. 경제적 패권국으로서 위상을 되찾으려면 홍콩이 다시 우리의 영향권에 들어오도록 할 새로운 방법을 찾아야 합니다."
 devolution.1.t: "구성국들, 의존도 감소를 위한 법안 통과 추진"
 devolution.1.d: "최근 국내 상황의 전개로 인해 우리 구성국들은 중앙 정부에 대한 의존도를 낮추는 정책을 통과시키려 하고 있습니다. 우리에게는 이 법안들을 거부할 권한이 있으나, 그렇게 하면 불만이 더욱 커질 수 있습니다."
 devolution.1.a: "승인한다"
 devolution.1.b: "거부한다"
 devolution.1.c: "개별 법안을 보여 달라"
 devolution.2.t: "스코틀랜드의 법안"
 devolution.2.d: "스코틀랜드 의회가 자치권을 높이고 더 분권화된 국가로 나아가게 하는 법안을 정부에 제출했습니다. 이 법안을 거부하면 그들의 분노를 살 수 있지만, 승인하면 권한 이양으로 나아가게 됩니다."
 devolution.2.a: "승인한다"
 devolution.2.b: "거부한다"
 devolution.3.t: "북아일랜드의 법안"
 devolution.3.d: "북아일랜드 의회가 자치권을 높이고 더 분권화된 국가로 나아가게 하는 법안을 정부에 제출했습니다. 이 법안을 거부하면 그들의 분노를 살 수 있지만, 승인하면 권한 이양으로 나아가게 됩니다."
 devolution.3.a: "승인한다"
 devolution.3.b: "거부한다"
 devolution.4.t: "웨일스의 법안"
 devolution.4.d: "웨일스 의회가 자치권을 높이고 더 분권화된 국가로 나아가게 하는 법안을 정부에 제출했습니다. 이 법안을 거부하면 그들의 분노를 살 수 있지만, 승인하면 권한 이양으로 나아가게 됩니다."
 devolution.4.a: "승인한다"
 devolution.4.b: "거부한다"
 devolution.5.t: "스코틀랜드 독립 요구 확산"
 devolution.5.d: "하루가 다르게 뉴스 앵커들이 스코틀랜드가 [ENG.GetName]에 남을지 여부를 결정할 국민투표를 실시하라고 요구하는 군중 앞에 서고 있습니다. 웨스트민스터는 당연히 이 발상에 대체로 반대하지만, 이를 정면으로 거부하면 불안정을 일으킬 수 있습니다."
 devolution.5.a: "좋다, 어떻게 되는지 지켜보자"
 devolution.5.b: "거부한다"
 devolution.6.t: "북아일랜드 독립 요구 확산"
 devolution.6.d: "하루가 다르게 뉴스 앵커들이 북아일랜드가 [ENG.GetName]에 남을지 여부를 결정할 국민투표를 실시하라고 요구하는 군중 앞에 서고 있습니다. 웨스트민스터는 당연히 이 발상에 대체로 반대하지만, 이를 정면으로 거부하면 불안정을 일으킬 수 있습니다."
 devolution.6.a: "좋다, 어떻게 되는지 지켜보자"
 devolution.6.b: "거부한다"
 devolution.7.t: "웨일스 독립 요구 확산"
 devolution.7.d: "하루가 다르게 뉴스 앵커들이 웨일스가 [ENG.GetName]에 남을지 여부를 결정할 국민투표를 실시하라고 요구하는 군중 앞에 서고 있습니다. 웨스트민스터는 당연히 이 발상에 대체로 반대하지만, 이를 정면으로 거부하면 불안정을 일으킬 수 있습니다."
 devolution.7.a: "좋다, 어떻게 되는지 지켜보자"
 devolution.7.b: "거부한다"
 devolution.10.t: "구성국 선거"
 devolution.10.d: "구성국들의 선거가 열릴 때가 왔습니다. 각 구성국은 각자의 의회에서 독립 지지파 또는 [ENG.GetName] 지지파 의원을 새로 선출합니다. 독립 지지파 인사들이 당선될 가능성은 각 구성국의 불만 수준에 따라 결정됩니다."
 devolution.10.a: "알겠다"
 britain_md.100.t: "단검 작전 접근"
 britain_md.100.d: "무산담은 페르시아만의 단검이라 할 만큼 매우 전략적인 지역에 위치해 있습니다. 수많은 유조선과 호송대가 매일 호르무즈 해협을 통과하며, 지역의 불안정이 갈수록 커지는 탓에 우리는 해상 항로가 보호된다고 장담할 수 없습니다. 이 지방을 우리 통제 아래 둘 수 있다면 이 지역의 우리 함대와 자산을 더 잘 보호할 수 있을 것입니다."
 britain_md.100.a: "오만과 거래를 시도한다"
 britain_md.100.b: "협상할 시간이 없다, 진입하라"
 britain_md.101.t: "[ENG.GetName], 무산담을 요구하며 접근"
 britain_md.101.d: "영국이 우리와 대화하러 왔습니다. 정확히는 우리 영토를 노리고 왔습니다. 영국의 제안을 들은 우리 외교관들은 영국이 무산담을 두고 협상하러 왔다는 말에 화를 억누르지 못하고 격분하여 자리를 박차고 나갔습니다. 이처럼 공격적인 요구는 우리 국민을 상상 이상으로 분노하게 할 것이 분명합니다. 그러나 영국은 이러한 요구를 거절하면 '다른 수단을 강구'할 수밖에 없다고 재차 밝혔습니다."
 britain_md.101.a: "절대 안 된다!"
 britain_md.101.b: "우리에게 무슨 선택지가 있겠는가?"
 britain_md.102.t: "오만, 협상 거부"
 britain_md.102.d: "오만 정부는 어떤 형태의 협상에도 관심이 없음을 분명히 했으며, 오히려 우리 외교관들을 질책하는 쪽을 택했습니다."
 britain_md.102.a: "선택의 여지를 주지 않는군"
 britain_md.102.b: "잊어버리자"
 britain_md.103.t: "오만, 조건을 제시"
 britain_md.103.d: "오만 정부는 현명하게도 우리와 협상하는 길을 택했으며, 조건까지 제시했습니다. 우리는 거액의 선금을 지불하고 일정 기간 오만의 보호를 보장하도록 요구받았습니다. 이 제안을 거절하면 오만은 우리에게 무산담에 대한 권리를 넘기지 않을 것입니다."
 britain_md.103.a: "좋다"
 britain_md.103.b: "아니다, 다른 방법으로 얻겠다"
 britain_md.103.c: "잊어버리자"
 ENG_western_allies_western_ideals: "서방 동맹, 서방의 이상"
 ENG_western_allies_western_ideals_desc: ""
 ENG_out_with_the_new_in_with_the_old: "새것은 물러가고 옛것이 돌아온다"
 ENG_out_with_the_new_in_with_the_old_desc: ""
 royal_workers_idea: "왕실 노동자"
 ENG_crown_procurement_program_idea: "왕실 조달 프로그램"
 ENG_recent_defections: "최근의 이탈"
 ENG_recent_defections_desc: "병사, 장군, 숙련된 조종사들이 우리를 국가의 위협으로 간주하여 정부와 관계를 끊기를 바라며 대열에서 이탈하고 있습니다."
 ENG_war_of_independence: "독립 전쟁"
 ENG_war_of_independence_desc: "높은 사기와 의지로 무장한 우리 병사들은 런던의 폭압적 통치가 끝나는 모습을 볼 준비가 되어 있습니다."
 ENG_typhoon_debate1: "유로파이터 타이푼 생산 확대"
 ENG_resistance_against_westminster: "웨스트민스터에 대한 저항"
 ENG_resistance_against_westminster_desC: "국민투표 제안이 거부되자 이 주의 주민들은 불만을 드러내기 위해 시민 불복종과 소규모 폭력 사태의 형태로 강력한 저항을 벌이고 있습니다."
 ENG_political_modifier: "웨스트민스터 체제"
 ENG_two_party_system_idea: "양당제"
 ENG_economy_modifier: "[ENG.GetName]의 경제"
 ENG_building_britain_idea: "미래에 걸맞은 영국 건설"
 ENG_building_britain_idea_desc: "장기 산업 전략은 아이디어, 사람, 인프라, 지역에 대한 투자를 조율하여 생산성을 서서히 끌어올리고, 기업들이 전국에서 계획하고 고용하며 건설할 자신감을 갖게 합니다."
 ENG_ireland_border_cooperation_idea_IRE: "아일랜드 국경 협력"
 ENG_ireland_border_cooperation_idea_IRE_desc: "실무적인 국경 간 기구와 공동 프로그램이 북아일랜드와 아일랜드를 무역, 인프라, 서비스 분야에서 연결하여 서류 절차를 완화하고 상품, 사람, 아이디어가 국경을 넘어 더 자유롭게 이동하도록 돕습니다."
 ENG_Space_Command0: "영국 우주 역량"
 ENG_Space_Command0_desc: "영국은 우주 분야의 역량을 향상시키고 이익을 확보하기 위해 노력하고 있습니다."
 ENG_Space_Command2: "영국 우주사령부"
 ENG_Space_Command3: "영국 우주사령부"
 ENG_Space_Command3_desc: "영국 우주사령부는 우주 작전, 우주 인력, 우주 역량을 총괄하는 국방 부문의 주무 기관입니다. RAF 하이 위컴에 기반을 둔 합동 사령부이며, 왕립 해군, 영국 육군, 왕립 공군의 인원과 더불어 공무원 및 계약 인력으로 구성되어 있습니다. 제1우주사단이 편성됨에 따라 이 조직은 전 세계에서 기대를 뛰어넘는 성과를 냈고, 영국은 새로운 드레드노트의 시대를 맞고 있습니다."
 ENG_standardized_space_parts1: "표준화된 우주 부품"
 ENG_standardized_space_parts1_desc: "상업 기업이 우주를 접근 가능하고 저렴하게 만들도록 지원함으로써 우주 제품 제작 비용이 감소했습니다."
 ENG_Historical_Valor1: "역사적 용맹"
 ENG_Historical_Varlor1_desc: "전통에 깊이 뿌리내린 영국군은 유서 깊은 유산에 자부심을 느끼고 있습니다. 그러나 참모진은 검증되지 않은 전술을 의심하며 전통적 전략을 고수합니다. 군이 변화의 문턱에 선 지금, 자부심과 적응력 사이의 균형을 맞추는 것이 국가 방위의 본질이 됩니다."
 ENG_Aging_Military1: "노후한 군대"
 ENG_Aging_Military1_desc: "자금 지원이 소홀했던 탓에 영국 육군은 심각한 노후화 문제에 직면해 있으며, 낡은 장비와 떨어지는 질적 수준과 씨름하고 있습니다. 재정적 방치의 여파는 대열 전체에 울려 퍼지며, 현대적이고 효과적인 방위군을 유지하는 데 어려움을 초래합니다."
 ENG_desert_hawk: "데저트 호크"
 ENG_desert_hawk_desc: "록히드 마틴 데저트 호크 III는 록히드 마틴 항공 부문의 스컹크 웍스가 설계한 무인기입니다. 레이더 관측, 신호 정보, 통신 감청은 물론 야간 투시, 열화상, 광학 센서를 이용한 원격 관측이 가능한 소형 감시 드론입니다."
 ENG_archer_artillery_alliance: "아처 포병 동맹"
 ENG_archer_artillery_alliance_desc: "스웨덴이 개발한 아처 포병 동맹은 장거리 정밀 화력의 돌파구를 의미합니다. 자동 장전과 신속한 전개를 갖춘 이 포병 체계는 전장에서 정확하고 유연한 지원을 보장합니다. 모듈식 설계는 군사 작전을 강화하여 스웨덴과 영국에 전투에서의 전략적 우위를 제공합니다."
 ENG_Boxer_Program: "복서 계획"
 ENG_Boxer_Program_desc: "독일과 네덜란드의 협력 사업인 복서 장갑차 계획은 장갑 병력 수송차의 새로운 시대를 열었습니다. 복서의 모듈식 설계는 병력 수송과 의무 후송을 포함한 다양한 임무에 쉽게 적응할 수 있게 합니다. 첨단 방호 기능과 뛰어난 기동성으로 이 차량은 다양한 작전 환경에서 군 인원의 안전과 효율을 높입니다."
 ENG_warrior_capability_sustainment_programme: "워리어 장갑차 성능 유지 계획"
 ENG_warrior_capability_sustainment_programme_desc: "워리어의 구식 30mm 라든 기관포는 이동 중 정확한 사격이 불가능하여, 전투 수명을 연장하기 위한 새로운 무기 체계와 포탑 설계 연구를 촉발했습니다. 현재 계획은 완전 안정화된 40mm CT40 기관포 포탑, 강화된 전자 구조, 신속 장착 키트를 갖춘 모듈식 장갑 방호 체계를 추가하는 것입니다. 동시에 기갑 전투단 지원 차량 계획은 이 플랫폼을 장갑 병력 수송차로 개조하여 FV432를 대체할 것을 제안했습니다."
 ENG_warrior_ajax_upgrades: "워리어 장갑차 아약스 개량"
 ENG_warrior_ajax_upgrades_desc: "영국이 주도하는 워리어 아약스 개량 사업은 상징적인 워리어 보병 전투차량의 상당한 성능 향상을 의미합니다. 화력 개선, 통신 체계 강화, 장갑 개량을 포함한 첨단 개조를 통해 워리어 아약스는 우수한 전장 성능을 보장합니다. 이러한 개량은 영국의 군사 역량을 강화하여 다양한 작전 시나리오에서 지상군에 현대화되고 다재다능한 기갑 지원을 제공합니다."
 ENG_fres_program_Idea: "FRES 계획"
 ENG_fres_program_Idea_desc: "영국의 FRES(미래 신속 효과 체계) 계획은 다재다능한 지상 플랫폼으로 군의 기민성을 높이는 선진적인 구상입니다. 신속 대응을 위한 최첨단 기술을 통합하여 다양한 임무에 대한 영국의 대비 태세를 보장합니다."
 ENG_fixing_civil_servant_idea: "공무원 바로잡기"
 ENG_fixing_civil_servant_idea_desc: "우리 병사들에게는 믿을 수 있는 장비가 필요합니다. 우리는 그 요구를 충족하기 위해 노력하고 있습니다."
 ENG_special_command1: "특수 사령부"
 ENG_special_command1_desc: "육군의 전문화와 효율성을 다듬는 데 집중함으로써 우리는 군의 전투 역량을 강화하고자 합니다. 그러나 이러한 노력에는 지출 증가와 더 까다로운 자원 요구라는 대가가 따릅니다."
 ENG_special_command2: "특수 사령부"
 ENG_special_command2_desc: "육군의 전문화와 효율성을 다듬는 데 집중함으로써 우리는 군의 전투 역량을 강화하고자 합니다. 그러나 이러한 노력에는 지출 증가와 더 까다로운 자원 요구라는 대가가 따릅니다."
 ENG_special_command3: "특수 사령부"
 ENG_special_command3_desc: "육군의 전문화와 효율성을 다듬는 데 집중함으로써 우리는 군의 전투 역량을 강화하고자 합니다. 그러나 이러한 노력에는 지출 증가와 더 까다로운 자원 요구라는 대가가 따릅니다."
 ENG_UKSF1: "영국 특수부대"
 ENG_UKSF1_desc: "SAS와 SBS 같은 정예 부대로 구성된 이 고도로 훈련된 요원들은 은밀 작전, 대테러, 비정규전에서 탁월한 능력을 발휘합니다. 정예 특수부대의 존재는 영국의 전략적 기민성과 대테러 역량을 끌어올리며, 정밀함과 적응력의 탁월함을 구현합니다."
 ENG_UKSF2: "영국 특수부대"
 ENG_UKSF2_desc: "SAS와 SBS 같은 정예 부대로 구성된 이 고도로 훈련된 요원들은 은밀 작전, 대테러, 비정규전에서 탁월한 능력을 발휘합니다. 정예 특수부대의 존재는 영국의 전략적 기민성과 대테러 역량을 끌어올리며, 정밀함과 적응력의 탁월함을 구현합니다."
 ENG_aircraft_ai_idea: "항공기 AI 통합"
 ENG_aircraft_ai_idea_desc: "기술이 발전함에 따라 영국은 최첨단 인공지능을 항공 역량과 결합하는 항공기 AI 통합을 선도합니다. 이 국가 정신은 향상된 항공기 성능, 자율 체계, 적응형 임무 수행 능력을 위해 AI를 활용하겠다는 의지를 나타냅니다."
 ENG_quality_over_quantity: "양보다 질"
 ENG_worldwide_command1: "세계 사령부"
 ENG_worldwide_command1_desc: "영국 세계 육군 사령부 구상은 영국 육군이 작전 범위를 전 세계로 확장하는 전략적 접근을 상정합니다. 이 구상은 전 세계적 규모로 군사 작전을 조율하고 수행할 수 있는 지휘 체계의 수립을 포함합니다. 다양한 지역에 병력을 배치함으로써 영국군은 세계적 영향력을 높이고, 새로운 위협에 대응하며, 국제 안보에 기여하고자 합니다. 영국 세계 육군 사령부는 선제적이고 다재다능한 군사적 관여에 대한 의지를 나타내며, 변화하는 세계 안보 도전의 성격에 부합합니다."
 ENG_worldwide_command2: "세계 사령부"
 ENG_worldwide_command2_desc: "영국 세계 육군 사령부 구상은 영국 육군이 작전 범위를 전 세계로 확장하는 전략적 접근을 상정합니다. 이 구상은 전 세계적 규모로 군사 작전을 조율하고 수행할 수 있는 지휘 체계의 수립을 포함합니다. 다양한 지역에 병력을 배치함으로써 영국군은 세계적 영향력을 높이고, 새로운 위협에 대응하며, 국제 안보에 기여하고자 합니다. 영국 세계 육군 사령부는 선제적이고 다재다능한 군사적 관여에 대한 의지를 나타내며, 변화하는 세계 안보 도전의 성격에 부합합니다."
 ENG_worldwide_command3: "세계 사령부"
 ENG_worldwide_command3_desc: "영국 세계 육군 사령부 구상은 영국 육군이 작전 범위를 전 세계로 확장하는 전략적 접근을 상정합니다. 이 구상은 전 세계적 규모로 군사 작전을 조율하고 수행할 수 있는 지휘 체계의 수립을 포함합니다. 다양한 지역에 병력을 배치함으로써 영국군은 세계적 영향력을 높이고, 새로운 위협에 대응하며, 국제 안보에 기여하고자 합니다. 영국 세계 육군 사령부는 선제적이고 다재다능한 군사적 관여에 대한 의지를 나타내며, 변화하는 세계 안보 도전의 성격에 부합합니다."
 ENG_worldwide_command4: "세계 사령부"
 ENG_worldwide_command4_desc: "영국 세계 육군 사령부 구상은 영국 육군이 작전 범위를 전 세계로 확장하는 전략적 접근을 상정합니다. 이 구상은 전 세계적 규모로 군사 작전을 조율하고 수행할 수 있는 지휘 체계의 수립을 포함합니다. 다양한 지역에 병력을 배치함으로써 영국군은 세계적 영향력을 높이고, 새로운 위협에 대응하며, 국제 안보에 기여하고자 합니다. 영국 세계 육군 사령부는 선제적이고 다재다능한 군사적 관여에 대한 의지를 나타내며, 변화하는 세계 안보 도전의 성격에 부합합니다."
 ENG_naval_defense_act_1889_1: "1889년 해군 방위법"
 ENG_naval_defense_act_1889_1_desc: "1889년 해군 방위법은 영국 의회의 법률이었습니다. 1889년 5월 31일 왕실 재가를 받았으며, 2국 표준을 공식 채택하고 영국의 해군력을 증강했습니다. 이 표준은 왕립 해군이 세계에서 그다음으로 큰 두 해군의 전함 수를 합친 것 이상을 유지하도록 요구했습니다"
 ENG_naval_defense_act_1889_1_tt: "§R우리가 대륙의 해군 강국이 되면 2년간의 임시 국가 정신으로 바뀝니다§!"
 ENG_army_special_operations_brigade_idea: "육군 특수작전여단"
 ENG_army_special_operations_brigade_idea_desc: "영국 육군 특수작전여단은 영국군 내에서 정예이자 고도로 전문화된 부대입니다. 여러 부대에서 선발된 전문 훈련을 받은 병사들로 구성된 이 여단은 비정규적이고 위험도 높은 임무를 위해 특별히 설계되었습니다. 첨단 무기, 특수 훈련, 그리고 다재다능함에 대한 헌신을 갖춘 육군 특수작전여단은 복잡한 위협에 대응하고, 정밀 작전을 수행하며, 국가의 전반적인 방위 전략에 기여하는 데 핵심적인 역할을 합니다."
 ENG_allied_basing_efforts_Idea: "동맹 기지 구축 노력"
 ENG_allied_basing_efforts_Idea_desc: "동맹 기지 구축 노력 구상은 동맹 회원국의 인프라와 전략 자산을 강화하기 위한 종합적인 접근을 제시합니다. 이 프로그램은 교통망, 공군 기지, 항만 및 기타 핵심 시설의 필수적인 개선을 포함합니다. 동맹의 주요 기여국인 영국은 인프라에서 상당하고 지속적인 향상을 누리며, 병참 효율과 전략적 대비 태세를 높입니다."
 ENG_royal_navy_Idea1: "영국 왕립 해군"
 ENG_royal_navy_Idea1_desc: "영국 왕립 해군은 수 세기에 걸친 유서 깊은 유산을 지닌 세계 최고의 해상 전력 중 하나입니다. 뛰어난 적응력과 기술력으로 명성이 높은 왕립 해군은 영국의 해양 이익을 수호하고 전 세계에 힘을 투사하는 데 중요한 역할을 합니다."
 ENG_royal_navy_Idea2: "영국 왕립 해군"
 ENG_royal_navy_Idea2_desc: "영국 왕립 해군은 수 세기에 걸친 유서 깊은 유산을 지닌 세계 최고의 해상 전력 중 하나입니다. 뛰어난 적응력과 기술력으로 명성이 높은 왕립 해군은 영국의 해양 이익을 수호하고 전 세계에 힘을 투사하는 데 중요한 역할을 합니다."
 ENG_royal_navy_Idea3: "영국 왕립 해군"
