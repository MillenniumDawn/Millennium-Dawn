l_korean:
 algeria_focus: "알제리 중점계통도"
 ALG_political_tree_shortcut: "정치 계통도"
 ALG_foreign_policy_shortcut: "대외정책"
 ALG_industry_shortcut: "경제 재건"
 ALG_military_shortcut: "알제리군"
 ALG_the_nation_stands_at_a_crossroads: "국가가 기로에 서다"
 ALG_restore_the_presidency_desc: "정치적 격변의 여파로 대통령의 권한이 약화되었습니다. 이제 선출된 지도자의 권위를 회복하고 침식된 민주적 규범을 복원해야 할 때입니다. 대통령직의 위상을 재확립함으로써, 우리는 정부에 대한 안정과 신뢰를 되찾을 수 있습니다."
 ALG_emergency_rule_continues: "§R비상사태의 지속§!"
 ALG_emergency_rule_continues_desc: "국가가 여전히 혼란에 빠져있는 상황에서, 정부는 비상사태를 연장하기로 결정했습니다. 이는 질서 유지를 위해 필요한 조치이지만, 시민의 자유와 민주적 절차의 희생을 대가로 합니다. 우리는 이 격동의 바다를 항해하며 신중하게 대처해야 합니다."
 ALG_national_reconciliation: "국민 화해"
 ALG_national_reconciliation_desc: "분열과 갈등의 상처를 치유하기 위해 우리는 국민 화해의 길을 추구해야 합니다. 모든 파벌 간의 대화를 촉진하고 불만을 해소함으로써 우리는 더 통합된 사회를 건설하고 영구적인 평화의 기초를 다질 수 있습니다."
 ALG_moderate_islamist_talks: "온건 이슬람주의자 회담"
 ALG_moderate_islamist_talks_desc: "분열을 메우고 안정을 촉진하기 위한 노력의 일환으로 온건 이슬람 파벌과의 회담을 시작합니다. 건설적인 대화에 참여함으로써 우리는 공통점을 찾고 다양한 목소리가 평화롭게 공존할 수 있는 정치적 환경을 조성하는 것을 목표로 합니다."
 ALG_charter_for_civil_peace: "시민 평화 헌장"
 ALG_charter_for_civil_peace_desc: "지속적인 안정과 사회적 조화를 보장하기 위해 우리는 시민 평화 헌장을 제안합니다. 이 문서는 모든 시민의 권리와 책임을 규정하여 사회 내 여러 집단 사이의 관용, 이해, 협력을 증진할 것입니다."
 ALG_open_democratic_path: "민주주의의 길 개방"
 ALG_open_democratic_path_desc: "민주주의를 온전히 받아들이고 더 밝은 미래로 가는 길을 열어야 할 때입니다. 시민에게 힘을 실어 주고 정치 참여를 촉진하는 개혁을 시행함으로써, 우리는 국민의 뜻을 반영하는 활기찬 민주 사회를 만들 수 있습니다."
 ALG_clamp_down_on_extremism: "극단주의 단속"
 ALG_clamp_down_on_extremism_desc: "정부는 군사 재판소와 정보 기관을 동원하여 남아 있는 모든 급진 이슬람주의 및 정치적 위협을 제거할 것입니다."
 ALG_counterterrorism_program: "대테러 프로그램"
 ALG_counterterrorism_program_desc: "위협이 알제리를 불안정하게 만들기 전에 이를 추적하고, 침투하고, 제거할 수 있는 현대적 보안 기구를 구성해야 합니다."
 ALG_authoritarian_restoration: "권위주의 복원"
 ALG_authoritarian_restoration_desc: "안정은 확고한 중앙 집권적 통치를 통해서만 보장될 수 있습니다. 군이 국가의 미래를 전적으로 책임질 것입니다."
 ALG_counterterrorism_agency: "대테러 기관"
 ALG_extremism_crackdown_modifier: "극단주의 단속"
 ALG_extremism_crackdown_modifier_desc: "우리 나라를 불안정하게 만들려는 극단주의 단체들의 위협이 커지는 데 대응하여, 우리는 급진주의에 대한 포괄적 단속을 시행하고 있습니다. 이 계획은 극단주의 조직망을 해체하고, 감시를 강화하며, 법 집행 역량을 강화하는 것을 목표로 합니다. 관용과 이해의 문화를 증진함으로써 극단주의의 근본 원인을 해결하는 동시에 시민의 안전과 안보를 보장하고자 합니다. 이러한 조치를 통해 보다 결속력 있는 사회를 조성하고 우리의 민주적 가치를 지킬 것입니다."
 ALG_military_regime_restored: "군사 정권 복원"
 ALG_military_regime_restored_desc: "수년간의 정치적 불안정 끝에 군이 통제권을 되찾고 질서를 회복했습니다. 이 정권은 국가의 힘과 단결을 재건하기 위해 규율, 국가 안보, 엄격한 통치에 중점을 둡니다."
 ALG_reconciliation_path_category: "국민 화해"
 ALG_reconciliation_path_category_desc: "\n£AFG_menu1\n\n\n\n분열과 갈등의 상처를 치유하려면 국민 화합의 길을 추구해야 합니다. 모든 파벌 간의 대화를 촉진하고 불만을 해소함으로써 보다 단합된 사회를 건설하고 지속적인 평화의 기반을 마련할 수 있습니다."
 ALG_pardon_moderate_islamist: "온건 이슬람주의자 사면"
 ALG_pardon_moderate_islamist_desc: "비폭력 노선의 전직 이슬람주의자들에게는 무장 해제와 정치적 폭력 포기를 대가로 조건부 사면을 제의할 수 있습니다."
 ALG_initiate_national_dialogues: "국민 대화 개시"
 ALG_initiate_national_dialogues_desc: "전직 반군, 정당, 시민 사회가 새로운 알제리를 건설하는 데 참여하도록 하는 국가 포럼이 출범합니다."
 ALG_reintegrate_former_fighter: "전직 전투원 재통합"
 ALG_reintegrate_former_fighter_desc: "투항한 반군을 일자리, 주거, 국가 복무를 통해 민간 생활로 복귀시키는 프로그램입니다."
 ALG_crackdown_category: "권위주의적 탄압"
 ALG_crackdown_category_desc: "\n£TAJ_desctext_pamir\n\n\n\n국가의 안정을 보장하려면 체제 전복 세력을 억압하고 국내 보안군을 강화해야 합니다."
 ALG_arrest_political_opponents: "정치적 반대 세력 체포"
 ALG_arrest_political_opponents_desc: "급진 정치 세력을 공공 영역에서 제거함으로써 내부 위협을 무력화할 것입니다."
 ALG_expand_surveillance_services: "감시 기관 확대"
 ALG_expand_surveillance_services_desc: "강력한 정보망이 국민을 감시하여 소요가 번지기 전에 이를 예방할 것입니다."
 ALG_ban_opposition_parties: "야당 금지"
 ALG_ban_opposition_parties_desc: "국민 단결에 부합하지 않는 모든 정당은 정치 참여가 금지됩니다."
 ALG_economic_recovery_category: "경제 회복 프로그램"
 ALG_economic_recovery_category_desc: "\n£MAIN_desctext_dept\n\n\n\nIMF가 조건부 지원을 제공하며, 알제리는 이제 더 광범위한 개혁, 대출, 민영화를 시작할 수 있습니다."
 ALG_accept_imf_loan: "IMF 대출 수락"
 ALG_accept_imf_loan_desc: "통화를 안정시키고 개혁을 시작하기 위해 IMF의 금융 지원을 받아들일 수 있습니다. 이는 장기 부채와 조건이라는 대가를 수반합니다."
 ALG_start_oil_licensing: "외국 기업에 석유 면허 개방"
 ALG_start_oil_licensing_desc: "다국적 기업에 석유 매장량에 대한 접근을 허용하면 성장을 가속할 수 있지만 외세의 영향력도 커질 것입니다."
 ALG_repay_imf_loan: "IMF 대출 상환"
 ALG_repay_imf_loan_desc: "재정이 안정되고 있으므로 대출금을 갚아 국제적 의존도를 낮출 수 있습니다."
 ALG_improve_public_services: "공공 서비스 개선"
 ALG_improve_public_services_desc: "보건, 교육, 전쟁 피해자 지원을 확대할 것입니다."
 ALG_international_aid_effort: "국제 원조 노력"
 ALG_international_aid_effort_desc: "국제연합 및 원조 공여국과 협력하면 기본 서비스와 재건을 신속히 시작할 수 있습니다."
 ALG_building_civil_society: "시민 사회 구축"
 ALG_building_civil_society_desc: "공동체에 힘을 실어 주고 사회 프로그램을 시행하면 분쟁의 재발을 막는 데 도움이 될 수 있습니다."
 ALG_economic_recovery_program: "경제 회복 프로그램"
 ALG_economic_recovery_program_desc: "외국의 지원과 국가 개혁을 바탕으로 성장을 위한 국가 계획을 시작합니다."
 ALG_remove_international_monitors: "국제 감시단 철수"
 ALG_remove_international_monitors_desc: "알제리는 경제 노선에 대한 완전한 주권을 되찾을 만큼 충분히 회복되었습니다."
 ALG_postwar_recovery_program: "전후 회복 프로그램"
 ALG_postwar_recovery_program_desc: "전쟁은 끝났습니다. 이제 국가, 경제, 사회를 재건하기 시작합니다."
 ALG_un_aid_mission: "국제연합 원조 임무단"
 ALG_un_aid_mission_desc: "국제연합의 원조와 NGO가 기본 공공 서비스를 지원할 것입니다."
 ALG_social_healing_programs: "사회 치유 프로그램"
 ALG_social_healing_programs_desc: "전후의 트라우마와 불신은 사회 프로그램과 화해를 통해 해결해야 합니다."
 ALG_public_services_funding: "공공 서비스 재원"
 ALG_public_services_funding_desc: "보건, 주거, 고용 프로그램에 대한 접근성을 복구할 것입니다."
 ALG_finalize_recovery_phase: "회복 단계 마무리"
 ALG_finalize_recovery_phase_desc: "안정이 회복되었으므로 외국의 감독을 줄이고 경제적 자율성을 되찾을 수 있습니다."
 ALG_change_the_economy: "경제 모델 전환"
 ALG_change_the_economy_desc: "선택할 때가 왔습니다. 국가 통제를 유지할 것인가, 아니면 자유화할 것인가?"
 ALG_preserve_state_controlled_oil: "석유에 대한 국가 통제 유지"
 ALG_preserve_state_controlled_oil_desc: "소나트라크는 계속해서 우리 주권과 경제의 근간이 되어야 합니다."
 ALG_industrial_expansion_plan: "산업 확장 계획"
 ALG_industrial_expansion_plan_desc: "인프라와 공장을 통해 국내 생산을 늘릴 것입니다."
 ALG_open_market_reforms: "시장 개방 개혁"
 ALG_open_market_reforms_desc: "알제리는 핵심 부문의 규제를 완화하여 투자를 유치하고 성장을 촉진할 수 있습니다."
 ALG_oil_licensing_program: "석유 면허 프로그램 개시"
 ALG_oil_licensing_program_desc: "외국 기업은 면허 계약에 따라 유전 개발을 신청할 수 있습니다."
 ALG_urban_or_rural_development: "부족인가, 도시인가?"
 ALG_urban_or_rural_development_desc: "전후 우리의 중점을 부족 지역에 둘 것인가, 주요 도시에 둘 것인가?"
 ALG_empower_rural_provinces: "농촌 지방 육성"
 ALG_empower_rural_provinces_desc: "농촌인 남부와 카빌리아 중심지에 직접 투자가 이루어질 것입니다."
 ALG_tribal_consultative_council: "부족 자문 위원회 구성"
 ALG_tribal_consultative_council_desc: "지역 원로와 지방 지도자들이 개발 우선순위를 정하는 데 도움을 줄 것입니다."
 ALG_urbanization_initiative: "도시화 구상 개시"
 ALG_urbanization_initiative_desc: "알제와 오랑 같은 도시 중심지는 우리 현대화의 열쇠입니다."
 ALG_expand_the_capital: "수도 확장"
 ALG_expand_the_capital_desc: "알제의 인프라와 관공서를 확장하여 진정한 현대적 중심지로 만들 것입니다."
 ALG_foreign_policy_review: "외교 정책 교리 재검토"
 ALG_foreign_policy_review_desc: "국내 안정이 회복됨에 따라 알제리는 세계 무대에서의 역할을 재정립해야 합니다."
 MSP_foreign_policy_review: "외교 정책 교리 재검토"
 MSP_foreign_policy_review_desc: "국내 안정이 회복됨에 따라 알제리는 세계 무대에서의 역할을 재정립해야 합니다."
 ALG_africa_and_arab_nations: "아프리카 및 아랍 국가"
 ALG_africa_and_arab_nations_desc: "아프리카와 아랍 세계 모두에서 외교와 개발을 주도하는 데 집중할 것입니다."
 ALG_western_sahara_position: "서사하라 지지"
 ALG_western_sahara_position_desc: "모로코의 영유권 주장에 맞서 사하라위 독립에 대한 지지를 재확인합니다."
 ALG_african_union_engagement: "아프리카 연합 가입"
 ALG_african_union_engagement_desc: "알제리는 대륙 외교에 복귀하여 주도적 역할을 맡아야 합니다."
 ALG_sahel_initiatives: "사헬 지역 진출"
 ALG_sahel_initiatives_desc: "소프트 파워와 방위를 통해 사헬의 불안정과 테러에 맞서 싸울 것입니다."
 ALG_choose_global_partner: "세계적 파트너 선택"
 ALG_choose_global_partner_desc: "우리는 세계 초강대국 중 한 곳과 경제적, 군사적으로 보조를 맞추어야 합니다."
 ALG_align_with_us: "미국과 제휴"
 ALG_align_with_us_desc: "미국과의 협력은 안보와 경제적 영향력을 가져올 수 있습니다."
 ALG_align_with_china: "중화인민공화국과 제휴"
 ALG_align_with_china_desc: "중국은 불간섭 방식의 경제 개발과 깊은 투자 잠재력을 제공합니다."
 ALG_align_with_russia: "러시아 연방과 제휴"
 ALG_align_with_russia_desc: "러시아는 군사 기술을 제공하며 서방의 지배에 대한 알제리의 회의론을 공유합니다."
 ALG_non_aligned_revival: "비동맹 외교 정책 부활"
 ALG_non_aligned_revival_desc: "1960년대와 마찬가지로 중립과 남반구 연대의 정신을 되살릴 것입니다."
 ALG_global_south_solidarity: "글로벌 사우스 연대"
 ALG_global_south_solidarity_desc: "알제리는 무역, 외교, 원조를 통해 탈식민 국가들과의 유대를 강화할 것입니다."
 ALG_future_national_policy: "§G 알제리의 미래§!"
 ALG_future_national_policy_desc: "내전이 끝난 지금, 우리는 알제리의 새로운 정치적 방향을 정립해야 합니다.\n §R참고§!: §Y이 국가 중점을 선택하면 마지막에 현재의 국가 중점 트리를 각 정당별로 맞춤화된 트리로 덮어쓰는 국가 중점으로 이어지므로, 이를 마치기 전에 다른 중요한 국가 중점을 먼저 완료하십시오§!"
 ALG_approach_nato: "§CNATO 접근§!"
 ALG_approach_nato_desc: "서방과의 제휴는 경제 성장과 안보 보장을 가져올 수 있습니다."
 ALG_aspire_nato_support: "NATO 파트너십 추구"
 ALG_aspire_nato_support_desc: "조건을 충족하면 알제리는 주요 비NATO 동맹국이 될 수 있습니다."
 ALG_invite_western_investors: "서방 투자자 유치"
 ALG_invite_western_investors_desc: "민주주의 국가들로부터 자본과 교역을 유치합니다."
 ALG_request_us_protection: "미국의 보호 요청"
 ALG_request_us_protection_desc: "알제리는 미국에 군사적 보호 또는 보장을 요청할 것입니다."
 ALG_remain_neutral: "§g중립 유지§!"
 ALG_remain_neutral_desc: "비동맹은 외교의 자유와 국내 안정을 가져다 줍니다."
 ALG_economy_first: "경제 우선"
 ALG_economy_first_desc: "군사비를 줄이고 교육과 장기적 발전을 촉진합니다."
 ALG_seek_un_protection: "국제적 보호 모색"
 ALG_seek_un_protection_desc: "위협이 커지면 국제연합 안전보장이사회에 보호를 요청할 것입니다."
 ALG_align_with_china1: "§t중국 및 러시아와 제휴§!"
 ALG_align_with_china1_desc: "동방 강국들은 NATO와의 제휴에 대한 대안을 제공합니다."
 ALG_join_sco: "SCO 가입 신청"
 ALG_join_sco_desc: "상하이 협력 기구는 경제적, 안보적 이점을 제공합니다."
 ALG_invite_eastern_investors: "동방 투자 유치"
 ALG_invite_eastern_investors_desc: "중국과 러시아의 인프라 기업들과 협력합니다."
 ALG_request_chinese_protection: "중국의 보호 요청"
 ALG_request_chinese_protection_desc: "베이징은 알제리의 독립과 투자를 보장하는 데 동의할 수 있습니다."
 ALG_reform_the_military: "군 개혁"
 ALG_reform_the_military_desc: "알제리군은 21세기의 도전에 대응하기 위해 깊은 구조적 개혁이 필요합니다."
 ALG_military_academy_upgrade: "사관학교 개선"
 ALG_military_academy_upgrade_desc: "교육에 대한 투자는 유능하고 전문적인 장교를 양성하는 열쇠입니다."
 ALG_internal_security_brigade: "내무 보안 여단 창설"
 ALG_internal_security_brigade_desc: "전문 내무 보안 부대를 통해 국내 질서를 확보해야 합니다."
 ALG_military_industry_support: "군수 산업 지원"
 ALG_military_industry_support_desc: "군수 산업 기반을 강화하면 자급자족을 확보하는 데 도움이 될 것입니다."
 ALG_anti_air_force: "대공 사령부 설립"
 ALG_anti_air_force_desc: "방공 능력은 우리의 영공을 지키는 데 필수적입니다."
 ALG_mechanized_modernization: "기계화 부대 현대화"
 ALG_mechanized_modernization_desc: "현대적인 기계화 부대는 효과적인 지상군의 핵심입니다."
 ALG_uav_development: "드론 개발 프로그램"
 ALG_uav_development_desc: "무인 항공 체계는 우리에게 감시 및 정밀 타격 능력을 제공할 것입니다."
 ALG_national_guard_initiative: "국가 방위대 구상"
 ALG_national_guard_initiative_desc: "시민 기반의 방위 부대는 농촌과 변경 지역을 안정시키는 데 도움이 될 수 있습니다."
 ALG_air_force_reform: "공군 개혁"
 ALG_air_force_reform_desc: "교리와 장비를 쇄신하는 것은 우리의 제공권 확보에 매우 중요합니다."
 ALG_infantry_equipment_project: "보병 장비 현대화"
 ALG_infantry_equipment_project_desc: "우리 보병은 최신 무기와 보호 장구를 갖출 자격이 있습니다."
 ALG_ballistic_program: "탄도 미사일 프로그램"
 ALG_ballistic_program_desc: "미사일 능력을 확대하면 전략적 억지력이 강화될 것입니다."
 ALG_simulation_center: "군사 시뮬레이션 센터"
 ALG_simulation_center_desc: "현대적인 훈련 센터를 설립하면 전투 준비 태세가 크게 향상될 것입니다."
 ALG_logistics_command: "군수 사령부 설립"
 ALG_logistics_command_desc: "군수를 간소화하면 우리 병력이 전투력을 유지할 수 있습니다."
 ALG_military_doctrine_finalization: "군사 교리 확정"
 ALG_military_doctrine_finalization_desc: "개혁을 현대적 교리로 통합해야 합니다."
 ALG_foreign_arms_contracts: "외국 무기 계약"
 ALG_foreign_arms_contracts_desc: "전략적 파트너십은 우리 무기고의 공백을 신속히 메우는 데 도움이 될 수 있습니다."
 ALG_local_armor_production: "자국 장갑 차량 생산"
 ALG_local_armor_production_desc: "자국 APC와 전차 생산을 시작하면 자립과 성장이 보장됩니다."
 ALG_military_university_program: "군사 대학 프로그램"
 ALG_military_university_program_desc: "사관학교에 투자하면 차세대 지도자들을 준비시킬 수 있습니다."
 ALG_heavy_artillery_project: "중포 구상"
 ALG_heavy_artillery_project_desc: "국산 중포의 연구 개발을 우선시할 것입니다."
 ALG_special_operations_command: "특수 작전 사령부"
 ALG_special_operations_command_desc: "정예 부대를 위한 중앙 집중식 지휘부는 협조와 효율을 높입니다."
 ALG_joint_command_center: "합동 지휘 센터 설립"
 ALG_joint_command_center_desc: "각 군을 합동 작전 중추로 통합하면 전략적 통합이 강화될 것입니다."
 ALG_indigenous_rifle_program: "자국산 소총 프로그램"
 ALG_indigenous_rifle_program_desc: "독자적인 첨단 소형 화기를 개발하는 것은 국가적 최우선 과제입니다."
 ALG_integrated_defense_network: "통합 방어망"
 ALG_integrated_defense_network_desc: "통합된 레이더 및 통신 체계는 국방을 강화합니다."
 ALG_advanced_command_structure: "첨단 지휘 체계"
 ALG_advanced_command_structure_desc: "디지털 전장을 위한 현대적인 C4ISR 지휘 체계를 도입할 것입니다."
 ALG_military_modernization_complete: "군 현대화 완료"
 ALG_military_modernization_complete_desc: "개혁을 향한 우리의 긴 여정이 마침내 결실을 맺었습니다. 알제리는 이제 현대적이고 응집력 있는 군대를 보유하게 되었습니다."
 ALG_idea_non_aligned_policy: "비동맹 외교 정책"
 ALG_idea_non_aligned_policy_desc: "우리의 독자 노선은 어떤 블록에도 속하지 않으면서 모든 블록으로부터 이익을 얻을 수 있게 해 줍니다."
 ALG_presidential_succession_crisis: "대통령 승계 위기"
 ALG_presidential_succession_crisis_desc: "안정이 무너지면서 지도력의 문제가 다시 불거졌습니다. 옛 체제 아래 계속할 것인가, 새로운 길을 개척할 것인가?"
 ALG_stay_with_bouteflika: "부테플리카 지도부 유지"
 ALG_stay_with_bouteflika_desc: "부테플리카는 연속성과 부패를 상징합니다. 재정적 안정은 얻을 수 있겠지만 정통성을 대가로 치러야 합니다."
 ALG_choose_tebboune: "테분 임명"
 ALG_choose_tebboune_desc: "안정 지향적 개혁을 추진하는 온건한 기술 관료이지만, 국고에 큰 부담을 줄 인물입니다."
 ALG_choose_msp: "MSP 지도자 임명"
 ALG_choose_msp_desc: "무슬림 형제단과 연계된 이슬람주의 대안입니다. 일부 계층에서 인기를 얻겠지만, 기득권을 가진 군부 엘리트와 내전을 일으킬 위험이 있습니다."
 ALG_random_president: "무작위 대통령 선택"
 ALG_random_president_desc: "예측할 수 없는 선택입니다. 이 새 대통령은 알제리를 구할 수도, 파멸시킬 수도 있습니다."
 ALG_resolve_presidency_crisis: "대통령직 위기 해결"
 ALG_resolve_presidency_crisis_desc: "지도력의 문제에 답이 나왔습니다. 이제 앞으로 나아갈 때입니다."
 ALG_idea_bouteflika_legacy: "부테플리카의 유산"
 ALG_idea_bouteflika_legacy_desc: "뿌리 깊은 부패와 불신에도 불구하고 부테플리카의 시대는 여전히 알제리의 과거 통치와 동의어로 남아 있습니다. 그의 인맥은 여전히 영향력을 유지하고 있습니다."
 ALG_idea_tebboune_moderate: "테분의 온건 대통령직"
 ALG_idea_tebboune_moderate_desc: "안정과 점진적 개혁의 이미지를 지닌 테분은 통치를 정화하면서 질서를 유지하고자 합니다."
 ALG_idea_msp_presidency: "MSP 대통령직"
 ALG_idea_msp_presidency_desc: "평화를 위한 사회 운동이 권력을 잡았습니다. 이것이 평화로운 변혁을 의미하는지 갈등으로의 추락을 의미하는지는 두고 봐야 합니다."
 ALG_idea_random_good: "유능한 신임 대통령"
 ALG_idea_random_good_desc: "운이든 전략이든, 새 대통령은 유능하고 의욕적이며 개혁과 방향을 제시합니다."
 ALG_idea_random_bad: "무능한 신임 대통령"
 ALG_idea_random_bad_desc: "이 지도자는 준비가 부족하고 감당하지 못하며 부패했을 가능성도 있습니다. 중대한 시기에 잘못된 선택입니다."
 ALG_presidency.1.t: "군부와의 긴장"
 ALG_presidency.1.d: "MSP 지도자가 대통령으로 임명된 뒤 군부 엘리트는 격노했습니다. 그들은 이를 오랜 권력 장악에 대한 위협으로 보고 있습니다. 비밀 동원에 대한 소문이 무성하며, 구세력에 충성하는 무장 부대가 움직이기 시작했습니다. 군부는 이 변화를 받아들일 것인가, 아니면 반란을 일으킬 것인가?"
 ALG_presidency.1.a: "군부가 새 정부를 받아들인다"
 ALG_presidency.1.b: "군부 반란 – 내전 발발!"
 ALG_presidency_army_accepts_tt: "육군은 마지못해 MSP 정부를 받아들입니다. 당분간 평화가 유지됩니다."
 ALG_presidency_army_civilwar_tt: "군사 쿠데타가 공공연한 내전으로 번집니다!"
 ALG_economy_digital_initiative: "디지털 경제 구상"
 ALG_economy_digital_initiative_desc: "알제리는 경제를 현대화하기 위해 디지털 시대를 받아들여야 합니다. 기술 인프라, 전자정부 서비스, 디지털 소양 프로그램에 대한 투자는 우리를 21세기 경제에 걸맞은 위치에 올려놓을 것입니다."
 ALG_digital_initiative_tt: "§G알제리가 포괄적인 디지털 전환 프로그램을 시작합니다:§!\n- 정부 서비스 현대화\n- 인터넷 인프라 확대\n- 기술 스타트업 육성\n- 노동력의 디지털 기술 교육"
 ALG_digital_economy_initiative: "디지털 경제 구상"
 ALG_digital_economy_initiative_desc: "디지털 인프라와 기술 교육에 대한 우리의 투자가 결실을 맺고 있습니다. 정부 서비스는 더욱 효율적이 되었고, 기업들은 현대적 관행을 도입하고 있으며, 기술에 능숙한 새로운 세대의 노동자들이 노동 시장에 진입하고 있습니다."
 ALG_arpt_regulatory_framework: "ARPT 규제 당국 설립"
 ALG_arpt_regulatory_framework_desc: "우편통신규제청(ARPT)이 경쟁적인 통신 시장을 보장하고 소비자 권리를 보호할 것입니다."
 ALG_algerie_telecom_expansion: "알제리 텔레콤 현대화"
 ALG_algerie_telecom_expansion_desc: "알제리 텔레콤의 인프라를 현대화하고 확장하여 광대역 접근성과 공공 통신을 개선합니다."
 ALG_nedjma_and_mobilis: "네즈마와 모빌리스의 경쟁"
 ALG_nedjma_and_mobilis_desc: "네즈마와 모빌리스 같은 통신 사업자 간의 건전한 경쟁을 장려하면 가격이 낮아지고 서비스 품질이 향상될 것입니다."
 ALG_fiber_optic_program: "광섬유 인프라"
 ALG_fiber_optic_program_desc: "전국적인 광섬유 설치에 투자하여 전국의 연결성과 네트워크 속도를 높입니다."
 ALG_4g_rollout: "4G 서비스 도입"
 ALG_4g_rollout_desc: "4G 모바일 인터넷을 개시하면 연결성이 바뀌어 더 나은 전자 서비스와 디지털 생산성이 가능해질 것입니다."
 ALG_air_algerie_modernization: "에어 알제리 현대화"
 ALG_air_algerie_modernization_desc: "에어 알제리의 기단과 노선을 강화하면 관광이 촉진되고 국제 물류가 개선될 것입니다."
 ALG_international_airports_upgrade: "주요 공항 개선"
 ALG_international_airports_upgrade_desc: "알제, 오랑, 콩스탕틴 같은 공항에 투자하여 지역 및 세계 항공 교통의 중심지로 만듭니다."
 ALG_aadl_housing_projects: "AADL 주택 프로그램"
 ALG_aadl_housing_projects_desc: "주택 개선 및 개발 국가청(AADL) 사업은 늘어나는 도시 인구를 위한 보조금 지급 주택과 도시 개발을 제공할 것입니다."
 ALG_urbanization_initiatives: "도시 개발 구상"
 ALG_urbanization_initiatives_desc: "도로, 공공 설비, 건설 구역을 확장하면 성장하는 도시를 뒷받침하고 삶의 질을 높일 수 있습니다."
 ALG_arpt_regulation: "ARPT 규제 당국"
 ALG_arpt_regulation_desc: "ARPT는 통신 부문에서 공정한 시장 관행, 경쟁, 소비자 보호를 보장합니다."
 ALG_algerie_telecom_program: "알제리 텔레콤 프로그램"
 ALG_algerie_telecom_program_desc: "국영 통신 사업자를 위한 포괄적인 현대화 계획입니다."
 ALG_mobile_operator_competition: "통신 경쟁 개혁"
 ALG_mobile_operator_competition_desc: "네즈마와 모빌리스 간의 시장 경쟁이 혁신과 합리적인 가격을 촉진했습니다."
 ALG_4g_coverage: "4G 전국 커버리지"
 ALG_4g_coverage_desc: "고도화된 모바일 광대역은 통신을 향상시키고 디지털 경제를 뒷받침합니다."
 ALG_national_innovation_push: "국가 혁신 추진"
 ALG_national_innovation_push_desc: "모든 부문에서 혁신과 기술 발전을 촉진하기 위한 정부 주도의 구상입니다."
 ALG_highway_project: "동서 고속도로 사업"
 ALG_highway_project_desc: "동부와 서부를 잇는 130억 달러 규모의 사업으로 교통을 현대화하고 이동 시간을 단축할 것입니다."
 ALG_air_algerie_investment: "에어 알제리 투자"
 ALG_air_algerie_investment_desc: "알제리 국적 항공사를 확장하면 새로운 무역 및 여행 기회가 열립니다."
 ALG_air_hub_status: "알제 지역 항공 허브"
 ALG_air_hub_status_desc: "알제는 아프리카, 유럽, 중동을 잇는 중심 허브가 될 잠재력이 있습니다."
 ALG_aadl_program: "AADL 주택 구상"
 ALG_aadl_program_desc: "주택 개선 및 개발 국가청은 알제리 전역의 수천 가구를 위한 저렴한 주택을 건설하는 것을 목표로 합니다."
 ALG_kabylia_unrest: "카빌리아 불안"
 ALG_kabylia_unrest_desc: "1980년 '베르베르의 봄' 이래 카빌리아는 주기적인 시위, 문화적 요구, 중앙 정부에 대한 불신으로 점철되어 왔습니다. 이러한 긴장은 수면 아래에서 끓어오르며 안정을 해치고, 해결하지 않으면 더 광범위한 소요로 번질 위험이 있습니다. 해결되지 않으면 향후 사태가 극적으로 확대될 수 있습니다."
 ALG_black_spring.1.t: "카빌리아의 소요"
 ALG_black_spring.1.d: "마시니사 게르마가 헌병대에 의해 살해된 뒤 카빌리아에서 대규모 시위가 발발했습니다. 소요는 날이 갈수록 커지고 있습니다."
 ALG_black_spring.1.a: "이 문제를 해결해야 한다."
 ALG_black_decade: "암흑의 10년"
 ALG_black_decade_desc: "알제리에서 '암흑의 10년'으로 불리는 알제리 내전은 1992년 1월 11일(이슬람주의자들의 선거 승리를 무효화한 쿠데타 이후)부터 2002년 2월 8일까지 알제리 정부와 여러 이슬람주의 반군 단체 사이에서 벌어진 내전입니다. 정부가 이슬람주의 운동을 성공적으로 분쇄한 것처럼 보였기에 전쟁은 서서히 시작되었으나, 무장 단체들이 등장해 지하드를 선포했고 1994년에는 폭력이 정부가 버티지 못할 수도 있어 보이는 수준에 이르렀습니다. 1996~97년에 이르러서는 이슬람주의 저항 세력이 민중의 지지를 잃었음이 분명해졌으나, 전투는 이후에도 수년간 계속되었습니다."
 ALG_maghreb_invite.1.t: "마그레브 연합 초청"
 ALG_maghreb_invite.1.d: "알제리가 북아프리카 경제·군사 동맹을 제안했습니다. 우리는 가입할 것인가?"
 ALG_maghreb_invite.1.a: "연합에 가입한다"
 ALG_maghreb_invite.1.b: "거부한다 (모로코 한정)"
 ALG_maghreb_trade_hub: "마그레브 무역 중심지"
 ALG_maghreb_trade_hub_desc: "우리 경제는 북아프리카 상업의 중심지로서 번영하고 있습니다."
 ALG_maghreb_diplomacy: "마그레브 외교"
 ALG_maghreb_diplomacy_desc: "알제리는 북아프리카의 지도국으로 자리매김하며 무역과 공동 안보를 통해 단결을 도모하고 있습니다."
 ALG_maghreb_union_tt: "마그레브 연합 결성\n알제리, 튀니지 및 기타 북아프리카 국가들이 이제 우리의 주도 아래 경제적, 군사적 유대를 공유합니다."
 ALG_trade_allies: "무역 동맹국"
 ALG_egypt_algiers_axis: "이집트-알제 축"
 ALG_egypt_algiers_axis_desc: "이집트와 우리의 관계는 오랜 역사를 지니고 있습니다. 우리는 아프리카에서의 입지를 계속 강화하고 이 대륙을 이끌어야 합니다."
 FIS_Are_Terrorists: "FIS는 테러리스트"
 ALG_un_peacekeepers: "국제연합 평화유지군 배치"
 ALG_un_peacekeepers_desc: "국제연합은 이 지역을 안정시키고 추가 분쟁을 막기 위해 평화유지군을 파견했습니다. 이들의 임무는 질서를 유지하고, 민간인을 보호하며, 지속적 평화를 위한 외교 노력을 지원하는 것입니다."
 ALG_civil_war_recovered: "내전 극복"
 ALG_civil_war_recovered_desc: "국가는 내전의 혼란에서 벗어나 치유와 재건이라는 긴 과정을 시작했습니다. 단결을 회복하고, 인프라를 재건하며, 향후의 내부 분쟁을 막는 데 노력이 집중되고 있습니다."
 ALG_sonatrach_restructure: "소나트라크 구조 조정"
 ALG_sonatrach_restructure_desc: "국영 석유 회사 소나트라크는 효율을 높이고, 생산을 늘리며, 경제적 안정성을 강화하기 위해 대대적인 구조 조정을 진행 중입니다. 이 개편은 국가의 에너지 부문을 활성화하고 장기적 성장을 뒷받침하는 것을 목표로 합니다"
 ALG_investment_boom_modifier: "투자 붐"
 ALG_investment_boom_modifier_desc: "국내외 투자가 급증하여 급속한 경제 성장과 발전을 이끌고 있습니다. 이 붐은 산업 역량, 인프라, 전반적 번영을 향상시킵니다."
 ALG_foreign_oil_licensing_bonus: "외국 석유 면허"
 ALG_foreign_oil_licensing_bonus_desc: "외국 기업에 우리 유전에 대한 임시 접근을 허용하여 석유 생산 능력을 늘립니다."
 ALG_idea_pro_palestinian_campaign: "친팔레스타인 캠페인"
 ALG_idea_pro_palestinian_campaign_desc: "팔레스타인 단체들과의 관계를 높이고, 이 지역 알제리 독립 운동에 대한 지지를 높일 수 있습니다."
 ALG_idea_palestinian_backing: "알제리의 팔레스타인 권리 지지"
 ALG_idea_palestinian_backing_desc: " 외교적 입장, 원조 계획, 폭넓은 정치적 관여를 포함한, 팔레스타인 권리에 대한 알제리의 역사적이고 지속적인 지지에 관한 분석입니다."
 ALG_idea_palestinian_aid_fund: "알제리 팔레스타인 원조 기금"
 ALG_idea_palestinian_aid_fund_desc: "알제리가 팔레스타인 국민에게 인도적 지원과 개발 원조를 제공하기 위해 설립한 기금입니다. 긴급 구호, 인프라 개발, 교육, 경제적 역량 강화 사업이 포함될 수 있습니다."
 ALG_crackdown_backfired: "탄압의 역효과"
 ALG_idea_refoming_education1: "교육 개혁"
 ALG_idea_refoming_education: "교육 개혁"
 ALG_university_expansion: "대학 확장"
 ALG_basic_income_support: "기본 소득 지원"
 ALG_housing_support_idea: "주거 지원"
 ALG_childcare_reform: "보육 개혁"
 ALG_civil_rights: "시민권 부여"
 ALG_public_admin_reform: "무료 대중교통"
 MSP_switch_to_morocco: "사하라위 포기"
 MSP_switch_to_morocco_desc: "사하라위 지지는 모로코와의 관계를 악화시켰습니다. 모로코는 바로 이웃한 신흥 경제 강국입니다. 사하라위에 대한 무의미한 지지를 접고 대신 모로코와 우호적 관계를 구축하는 것이 가장 합리적입니다."
 MSP_influence_mauritania: "모리타니 영향력 행사"
 MSP_influence_mauritania_desc: "모리타니는 스페인이 이 지역에서 철수한 뒤 서사하라를 두고 모로코와 짧은 전쟁을 벌였습니다. 지금은 해당 영토를 주장하지 않지만 서사하라 분쟁을 면밀히 주시해 왔으며 폴리사리오 전선의 지지자 중 하나입니다. 서사하라 분쟁을 해결하려면 이들에 대한 우리의 통제력을 높이는 것이 중요합니다."
 MSP_casablanca_accords: "카사블랑카 협정"
 MSP_casablanca_accords_desc: "서사하라 분쟁은 수십 년간 누구도 해결하지 못한 채 교착 상태에 놓여 있습니다. 이 지역에서의 우리 영향력을 활용해 분쟁을 해결해야 합니다."
 ALG_influence_mauritania: "모리타니 영향력 행사"
 ALG_influence_mauritania_desc: "모리타니는 스페인이 이 지역에서 철수한 뒤 서사하라를 두고 모로코와 짧은 전쟁을 벌였습니다. 지금은 해당 영토를 주장하지 않지만 서사하라 분쟁을 면밀히 주시해 왔으며 폴리사리오 전선의 지지자 중 하나입니다. 서사하라 분쟁을 해결하려면 이들에 대한 우리의 통제력을 높이는 것이 중요합니다."
 ALG_energy_reform: "에너지 개혁"
 ALG_energy_reform_desc: "우리의 에너지 문제를 해결해야 합니다. 에너지 산업을 개혁함으로써 전국에 에너지를 공급할 수 있습니다."
 ALG_focus_on_oil: "석유 집중"
 ALG_focus_on_oil_desc: "알제리 전역에는 개발되지 않은 유맥이 많으며, 일부 연구에 따르면 알제리는 세계에서 석유가 가장 풍부한 나라 중 하나일 수 있고 그 대부분은 아직 개발되지 않았습니다. 따라서 우리는 석유에 집중해야 합니다"
 ALG_focus_on_oil_tt: "§C석유에 집중하면 이웃 나라에 에너지를 판매하여 더 많은 이익을 얻을 수 있지만 하시 메사우드에는 재앙이 될 것입니다!§!"
 ALG_focus_on_renewables: "재생 에너지 집중"
 ALG_focus_on_renewables_desc: "알제리는 아무리 작은 마을에도 태양이 닿는 나라입니다. 우리는 세계 다른 나라에 모범을 보이고 지속 가능한 에너지망을 구축해야 합니다. 비용이 많이 들겠지만 다음 세대를 위해 그만한 가치가 있을 것입니다"
 ALG_focus_on_renewables_tt: "§C재생 에너지에 집중하면 석유를 이용할 때만큼의 이익은 내지 못하지만 하시 메사우드에는 더 좋을 것입니다!§!"
 ALG_oil_production: "소나트라크와 협력"
 ALG_oil_production_desc: "알제리의 주요 석유·가스 기업은 국영 기업인 소나트라크입니다. 이 회사는 세계 에너지 시장의 주요 참여자이며 석유·가스 부문의 투자와 파트너십을 적극적으로 모색합니다. 소나트라크는 탐사와 생산에서 정제와 유통에 이르기까지 탄화수소 가치 사슬의 모든 측면에 관여하고 있습니다."
 ALG_grid_expansion: "전력망 확장"
 ALG_grid_expansion_desc: "자체적으로 전기를 생산할 수 있다는 것은 좋은 일이지만, 전기를 전국과 이웃 나라로 보내기 위한 튼튼한 전력망도 필요합니다"
 ALG_solar_panel_grid: "태양광 패널 전력망"
 ALG_solar_panel_grid_desc: "우리의 지리적 위치를 고려하면 알제리에는 거의 언제나 햇빛이 풍부합니다. 이는 태양광 발전소를 세우기에 놀라운 입지입니다"
 ALG_hassi_massoud_exploitation: "하시 메사우드 개발"
 ALG_resource_excavation_research: "석유 시추 연구"
 ALG_resource_excavation_research_desc: "일부 석유는 접근하기 어려운 곳에 있습니다. 알제 제1대학과 협력하여 가능한 모든 석유를 시추할 방법을 찾아야 합니다"
 ALG_wind_turbine_research: "풍력 터빈 연구"
 ALG_wind_turbine_research_desc: "현재 기술로는 알제리에 풍력 단지를 세우는 것이 불가능합니다. 바람 조건이 현대 터빈에 맞지 않기 때문입니다. 이 문제의 해결책을 연구하는 데 투자해야 합니다"
 ALG_ethanol_power_plant: "에탄올 발전소"
 ALG_ethanol_power_plant_desc: "소 분뇨에서 얻은 에탄올을 사용하면 지속 가능한 방식으로 전기를 생산할 수 있습니다"
 ALG_algeria_steelworks: "알제리 제철소"
 ALG_algeria_steelworks_desc: "석유를 더 많이 캐내야 합니다! 석유가 넉넉해지면 제철소도 세울 수 있습니다"
 ALG_Adrar_wind_park: "아드라르 풍력 단지"
 ALG_Adrar_wind_park_desc: "아드라르 풍력 단지는 알제리 남부에 있는 천연 지대입니다. 이 인근의 지형은 풍력 단지를 세우기에 적합하며, 바로 이곳에 알제리 최초의 풍력 단지를 세울 것입니다"
 ALG_national_space_program: "국가 우주 프로그램"
 ALG_national_space_program_desc: "알제리는 우주 개발국의 반열에 오르기 위해 국가 우주 프로그램을 수립해야 합니다. 이 구상은 우주 탐사와 위성 기술에서 미래의 성과를 위한 토대를 마련할 것입니다."
 ALG_arab_world_outreach: "아랍 외교 관계 심화"
 ALG_arab_world_outreach_desc: "아랍 세계에서 알제리의 영향력을 강화하려면 외교적 접촉과 조율 노력을 되살려야 합니다. 양자 방문, 정상회담, 무역 구상을 통해 알제리는 이 지역의 통합 세력으로 자리매김할 수 있습니다."
 ALG_join_arab_league: "아랍 연맹 참여 강화"
 ALG_join_arab_league_desc: "기존 아랍 연맹 회원국으로서 알제리는 단순한 참여를 넘어 주도적인 외교 역할을 맡을 수 있습니다. 경제 조율, 방위 협의, 문화적 연대를 촉진하면 아랍 세계에서 우리의 위상이 높아질 것입니다."
 ALG_support_palestine: "팔레스타인 대의 지지"
 ALG_support_palestine_desc: "팔레스타인과 알제리의 오랜 관계는 공통된 역사적 경험과 정치적 연대에 뿌리를 두고 있습니다. 이러한 유대는 팔레스타인 민족 자결에 대한 외교적 지지와 인도적 지원을 비롯한 다양한 형태로 나타납니다. 팔레스타인 대의에 대한 알제리의 헌신은 외교 정책의 핵심 측면입니다."
 ALG_algeria_algiers_axis: "이집트-알제 축 구축"
 ALG_algeria_algiers_axis_desc: "이집트와 더 긴밀히 제휴함으로써 알제리는 아랍 통합을 이끌고, 북아프리카의 안정을 확보하며, 외세의 영향력에 균형을 이룰 수 있는 강력한 지역 블록을 형성하는 데 기여할 수 있습니다."
 ALG_condemn_israel: "이스라엘의 행동 규탄"
 ALG_condemn_israel_desc: "지속되는 침략과 인권 침해에 비추어, 알제리는 국제 무대에서 이스라엘의 행동을 공식적으로 규탄하고 정의로운 평화를 위한 지지를 결집하며 해결 없는 관계 정상화에 반대할 것입니다."
 ALG_palestinian_aid_package: "팔레스타인 원조 패키지"
 ALG_palestinian_aid_package_desc: "팔레스타인 지역에 인도적, 경제적, 기술적 지원을 제공하기 위해 자원을 배정하여, 알제리의 헌신이 말에 그치지 않고 실질적이고 영향력 있는 원조로 이어지도록 할 것입니다."
 ALG_pan_african_defense_initiative: "범아프리카 방위 구상"
 ALG_pan_african_defense_initiative_desc: "아프리카의 주권을 보호하고 대륙의 안정을 높이기 위해, 알제리는 공동의 위협에 맞서는 집단 군사 대비 태세를 구축하는 아프리카 방위 조율 구상을 제안할 것입니다."
 ALG_send_troops_to_sahel: "사헬에 병력 파견"
 ALG_send_troops_to_sahel_desc: "사헬의 불안정이 커지는 데 대응하여, 알제리는 지역 정부들과 협력해 평화 유지 작전, 국경 방어, 대테러 작전을 지원할 병력을 파견할 것입니다."
 ALG_sahel_stabilization_force: "사헬 안정화군"
 ALG_sahel_stabilization_force_desc: "알제리는 이 지역의 반란과 범죄 조직에 대응하는 아프리카 주도의 안보 체계인 상설 사헬 안정화군 창설을 주도할 것입니다."
 ALG_exploit_sahel_resources: "사헬 자원 개발"
 ALG_exploit_sahel_resources_desc: "사헬에서의 알제리의 영향력은 개발되지 않은 천연자원에 대한 접근을 제공합니다. 광업 및 인프라 계약을 협상함으로써 이 지역에서 경제적 이익과 전략적 파트너십을 확보할 수 있습니다."
 ALG_propose_maghreb_union: "마그레브 연합 제안"
 ALG_propose_maghreb_union_desc: "통합된 마그레브라는 비전을 되살릴 때입니다. 알제리는 경제 협력, 공동 인프라, 외교적 보조에 초점을 맞춘 새로운 통합 노력을 주도적으로 제안할 것입니다."
 ALG_economic_integration_initiative: "마그레브 경제 통합"
 ALG_economic_integration_initiative_desc: "관세 인하, 인프라 투자, 통화 정책 조율 논의를 통해 알제리는 모든 회원국에 이익이 되는 마그레브 공동 경제권을 만들기 위한 노력을 이끌 것입니다."
 ALG_maghreb_joint_defense_pact: "마그레브 공동 방위 조약"
 ALG_maghreb_joint_defense_pact_desc: "안전한 마그레브를 위해서는 집단 방위가 필요합니다. 국경 방어, 정보 공유, 합동 군사 훈련에 초점을 맞춘 지역 군사 조약을 제안할 것입니다."
 ALG_idea_joint_military_arab: "아랍 합동군"
 palestine_issue_very_positive: "팔레스타인 문제 지지"
 ALG_algerian_airforce: "알제리 공군 현대화"
 ALG_algerian_airforce_desc: "현대적이고 유능한 공군은 국방에 필수적입니다. 항공 대비 태세를 높이기 위해 구조 개편, 조종사 훈련, 장비 조달에 투자할 것입니다."
 ALG_buy_russia_su_27: "러시아산 Su-27 조달"
 ALG_buy_russia_su_27_desc: "공군 현대화의 일환으로 러시아와 협상하여 Su-27 전투기 한 개 단위를 구매하고, 제공권과 전략적 억지력을 강화할 것입니다."
 ALG_oum_el_bouaghi_airbase: "움 엘 부아기 공군 기지 확장"
 ALG_oum_el_bouaghi_airbase_desc: "전략적으로 동부에 위치한 움 엘 부아기는 알제리 공군의 주요 작전 거점으로 확장되어 신속 전개 능력을 높일 것입니다."
 ALG_protect_the_skies: "영공 수호"
 ALG_protect_the_skies_desc: "지역 내 공중 위협이 커지는 가운데, 알제리는 모든 침범을 탐지하고 요격할 수 있도록 해야 합니다. 방공망 강화는 국가 안보의 최우선 과제입니다."
 ALG_russia_mig_servicing: "러시아 MiG 정비 계약"
 ALG_russia_mig_servicing_desc: "MiG 기단을 유지하고 개량하려면 러시아 계약업체들과 더 깊은 협력이 필요합니다. 이러한 정비 협정은 기존 항공기의 운용 수명을 보장할 것입니다."
 ALG_bosnian_parts: "보스니아산 예비 부품 확보"
 ALG_bosnian_parts_desc: "알제리는 보스니아 방위 산업의 잉여 부품을 확보하여 노후한 기체를 지원하고 개조함으로써 비용 효율적인 정비와 수리를 보장할 것입니다."
 ALG_comprehensive_radar_installations: "레이더 커버리지 확대"
 ALG_comprehensive_radar_installations_desc: "전국 레이더 커버리지를 완성하기 위해 알제리의 국경과 해안 전역에 첨단 레이더 시설을 건설하여 영공의 모든 사각지대를 없앨 것입니다."
 ALG_reform_or_control: "개혁인가 통제인가"
 ALG_reform_or_control_desc: "알제리는 정치적 갈림길에 서 있습니다. 진정한 민주적 개혁과 권위주의적 통제 강화 사이의 선택이 국가의 미래를 결정할 것입니다."
 ALG_legalize_moderate_islamists: "온건 이슬람주의자 합법화"
 ALG_legalize_moderate_islamists_desc: "온건 이슬람주의 정당을 인정하면 포용을 통한 안정의 길이 열립니다. 신중히 감시되는 선거 참여는 급진적 정서를 누그러뜨릴 수 있습니다."
 ALG_restore_elections: "선거 절차 복원"
 ALG_restore_elections_desc: "국가의 정통성을 되살리려면 알제리는 자유롭고 공정한 선거를 재개해야 합니다. 투명성과 책임성이 새로운 정치 시대의 기둥이 될 것입니다."
 ALG_public_media_and_transparency: "공영 언론과 투명성 강화"
 ALG_public_media_and_transparency_desc: "국영 언론 개혁과 언론의 자유는 국민의 신뢰를 회복하는 데 필수적입니다. 정보를 갖춘 시민은 민주적 발전에 필수적입니다."
 ALG_crackdown_on_opposition: "반대 세력 탄압"
 ALG_crackdown_on_opposition_desc: "불안정화를 막으려면 반대 의견을 억눌러야 합니다. 감시, 검열, 표적 체포로 반정부 세력을 무력화할 것입니다."
 ALG_state_surveillance_network: "국가 감시망"
 ALG_state_surveillance_network_desc: "정치 활동을 감시하기 위해 국가 정보망이 확대되어, 위협이 확산되기 전에 무력화되도록 할 것입니다."
 ALG_joint_governance_experiment: "공동 통치 실험"
 ALG_joint_governance_experiment_desc: "분쟁의 재발을 막기 위해 세속 세력과 종교 세력 간의 새로운 권력 분점 형태를 시험할 것입니다. 이 위험한 실험은 평화를 가져올 수도, 마비를 가져올 수도 있습니다."
 ALG_a_radical_reorientation: "급진적 방향 전환"
 ALG_a_radical_reorientation_desc: "기존 질서는 실패했습니다. 신의 명령과 이념적 명료함을 통해 새로운 길이 열립니다. 이는 타협 없는 신앙과 세속 국가의 정통성에 대한 부정이 이끄는 길입니다."
 ALG_covert_support_for_islamist_radicals: "이슬람 급진파 은밀 지원"
 ALG_covert_support_for_islamist_radicals_desc: "급진 조직망은 여전히 그림자 속에서 활동하고 있습니다. 전략적 자금과 은밀한 군수 지원으로 이들이 내부에서 정권에 맞서 행동하도록 힘을 실어 줄 수 있습니다."
 ALG_tolerate_radical_preachers: "급진 설교자 묵인"
 ALG_tolerate_radical_preachers_desc: "설교단은 강력한 도구입니다. 선동적인 설교를 못 본 체함으로써 이념이 모스크와 언론을 통해 자연스럽게 퍼지게 하고, 우리에게 유리하도록 국민을 급진화합니다."
 ALG_welcome_militants: "외국 무장대원 환영"
 ALG_welcome_militants_desc: "우리의 대의는 국경을 초월합니다. 우리 이념에 동조하는 외국인 전투원들을 안전하게 숨겨 주고 현지 세포 조직에 편입시켜 전투 경험과 확고한 헌신을 얻을 수 있습니다."
 ALG_arms_smuggling: "무기 밀수 작전"
 ALG_arms_smuggling_desc: "미래의 대결에 대비하여 무기와 탄약을 위한 비밀 공급망을 구축해야 합니다. 초국적 무기상들과의 제휴가 우리의 필요를 충족시킬 것입니다."
 ALG_start_the_uprising: "봉기 개시"
 ALG_start_the_uprising_desc: "지금이 그때입니다. 조직망이 가동되고, 전투원들이 무장하고, 이념이 퍼지고 있으니 정권에 맞서 봉기하여 새로운 이슬람 질서를 선포할 것입니다."
 ALG_clamp_down_on_vices: "악습 단속"
 ALG_clamp_down_on_vices_desc: "도박, 음주, 도덕적 타락은 우리 사회에 설 자리가 없습니다. 이러한 악습을 없애기 위한 전면적인 캠페인으로 국가를 정화하고 종교적 권위를 확립할 것입니다."
 ALG_revolutionize_the_ulema: "울라마 혁명화"
 ALG_revolutionize_the_ulema_desc: "종교 기득권층은 혁명의 대의에 보조를 맞추어야 합니다. 전통적인 울라마는 숙청되거나 재교육될 것이며, 충성스러운 성직자들이 국가의 영적 지도자로 그 자리를 대신할 것입니다."
 ALG_traditional_gender_roles: "전통적 성 역할 강화"
 ALG_traditional_gender_roles_desc: "현대는 자연의 질서를 타락시켰습니다. 우리는 신이 정한 남성과 여성의 역할로 돌아가 이러한 가치를 반영하는 엄격한 법적 틀을 마련할 것입니다."
 ALG_pledge_allegiance_to_al_qaeda: "알카에다에 충성 서약"
 ALG_pledge_allegiance_to_al_qaeda_desc: "세계 지하드가 성공하려면 단결이 필수입니다. 알카에다에 충성을 맹세하여 그들의 비전에 보조를 맞추고 보다 넓은 이슬람주의 조직망의 지원을 얻을 것입니다."
 ALG_pledge_allegiance_to_daesh: "이슬람 국가에 충성 서약"
 ALG_pledge_allegiance_to_daesh_desc: "알카에다는 노쇠하고 쇠락한 운동으로, 세계 지하드를 벌인다는 원래의 목표를 잊은 채 지역 차원의 사안에 매몰되어 있습니다. 새로운 목적의식을 지닌 새로운 운동이 그 자리를 대신해야 할 때입니다."
 ALG_secure_the_loyalty_of_aqim: "AQIM의 충성 확보"
 ALG_secure_the_loyalty_of_aqim_desc: "이슬람 마그레브의 알카에다는 우리의 지도력을 인정하고 우리 국가와 협력하여 활동해야 합니다. 이들의 충성은 지역 지하디스트 작전에 대한 지속적인 통제를 보장할 것입니다."
 ALG_war_on_daesh: "다에시와의 전쟁"
 ALG_secure_the_loyalty_effect_tt: "다음 국가 중 하나를 괴뢰국으로 두고 있는지에 따라 효과가 달라집니다: [AQY.GetNameWithFlag], [NUS.GetNameWithFlag], [TTP.GetNameWithFlag]"
 ALG_war_on_daesh_desc: "이른바 \\"이슬람 국가\\"는 세계 지하디스트 운동에 대한 우리 지도력에 분명한 위협입니다. 우리의 권위에 대한 그들의 거부와 비정형적 전술은 더 이상 용납할 수 없습니다. 신흥 세력 다에시에 맞서 총력전을 벌일 때입니다."
 ALG_jihad_in_the_maghreb: "마그레브 지하드"
 ALG_jihad_in_the_maghreb_desc: "모로코, 튀니지, 알제리의 세속 정권은 무너져야 합니다. 우리는 무력으로 칼리파국을 확장하며 종교 전쟁과 영토 팽창의 지역 작전을 개시할 것입니다."
 ALG_jihad_in_arabia: "아라비아 지하드"
 ALG_jihad_in_arabia_desc: "메카와 메디나 성지의 고향인 아라비아 반도는 어쩌면 세계에서 종교적으로 가장 중요한 영토입니다. 따라서 신앙심이 부족하고 부패한 정부가 계속 통치하도록 내버려 둘 수 없습니다."
 ALG_jihad_in_the_levant: "이라크와 알샴 지하드"
 ALG_jihad_in_the_levant_desc: "이라크와 레반트는 식민지 시대 이래 외세에 의해 찢겨 온 지역입니다. 레반트의 십자군과 시온주의 점령자들을 몰아낼 수 있는 길은 오직 무력뿐입니다."
 ALG_jihad_in_west_africa: "서아프리카 지하드"
 ALG_jihad_in_west_africa_desc: "우리의 혁명은 마그레브에서 멈추지 않습니다. 지하드를 서아프리카로 수출할 때가 왔으며, 남쪽으로 진군하며 말리, 니제르, 모리타니의 정권을 무너뜨릴 것입니다."
 AlgeriaFocus.56.t: "[FROM.GetNameDef], 우리의 독립 지지"
 AlgeriaFocus.56.d: "[FROM.GetNameDef]은(는) 모로코로부터의 우리 독립에 대한 지지를 재확인했으며, 앞으로 우리와 더욱 긴밀하게 협력하고 싶다는 뜻을 밝혔습니다."
 AlgeriaFocus.56.a: "훌륭하다"
 AlgeriaFocus.57.t: "우리를 저버린 [FROM.GetNameDef]"
 AlgeriaFocus.57.d: "[FROM.GetNameDef]은(는) 우리 독립에 대한 지지를 거두었습니다. 수십 년간 우리를 지지해 왔으나, 이제 모로코와 관계를 개선하기 위해 우리를 저버린 것으로 보입니다."
 AlgeriaFocus.57.a: "배신자들!"
 algeria_algerian_foreign_policy: "알제리 외교 정책"
 AlgeriaFocus.64.t: "[FROM.GetNameDef], 크레타 자치 요구"
 AlgeriaFocus.64.d: "[FROM.GetAdjective] 정부는 크레타 섬에 대한 우리의 입장을 우려한다고 밝혔습니다. 그들에 따르면 우리가 섬을 단단히 장악하고 있는 것이 그들의 안보를 위협한다고 합니다. 그들은 이 지역에서 우리의 군사적, 정치적 존재를 줄이도록 크레타에 제한적 자치를 부여할 것을 요구하고 있습니다."
 AlgeriaFocus.64.a: "그럴 수도 있겠지"
 AlgeriaFocus.64.b: "터무니없다"
 AlgeriaFocus.65.t: "[FROM.GetNameDef], 수락"
 AlgeriaFocus.65.d: "[FROM.GetAdjective] 정부가 크레타 주민의 자치 확대를 요구하는 우리의 요구를 수락했습니다."
 AlgeriaFocus.65.a: "성공"
 AlgeriaFocus.66.t: "[FROM.GetNameDef], 거부"
 AlgeriaFocus.66.d: "[FROM.GetAdjective] 정부가 크레타 주민의 자치 확대를 요구하는 우리의 요구를 거부했습니다."
 AlgeriaFocus.66.a: "후회하게 될 것이다"
 AlgeriaFocus.66.b: "때를 기다리겠다"
 AlgeriaFocus.67.t: "하마스, 새로운 인티파다 개시"
 AlgeriaFocus.67.d: "하마스가 우리에 맞선 새로운 인티파다를 선포했습니다. 하마스 무장대원들의 움직임이 늘고 있으며, 팔레스타인에 대한 우리의 지배에 반대하는 시위가 이미 여러 차례 벌어졌습니다. 알제리가 이번 새로운 투쟁을 위해 하마스를 무장시키고 동기를 부여하고 있다는 보고가 있습니다."
 AlgeriaFocus.67.a: "후회하게 될 것이다"
 AlgeriaFocus.68.t: "[FROM.GetNameDef], 새로운 인티파다 후원"
 AlgeriaFocus.68.d: "[FROM.GetNameDef]은(는) 우리가 이스라엘에 맞선 새로운 인티파다를 시작할 수 있도록 무기와 자금을 보내 주었습니다. 우리 사무소 근처에는 이미 신규 지원자들의 줄이 늘어서 있으며, 사람들은 이스라엘 점령자들에 항의하기 위해 결집하고 있습니다."
 AlgeriaFocus.68.a: "알제리에 감사한다"
 AlgeriaFocus.69.t: "하마스 봉기"
 AlgeriaFocus.69.d: "하마스 전투원들이 가자 지구의 주요 기관과 건물을 장악하고 있다는 보고가 들어오고 있습니다. 그들은 이스라엘이 새로운 인티파다로 고통받을 것이라고 맹세했습니다."
 AlgeriaFocus.69.a: "젠장"
 AlgeriaFocus.69.b: "그들을 제압하라!"
 AlgeriaFocus.70.t: "[FROM.GetNameDef], 투부와 접촉"
 AlgeriaFocus.70.d: "알제리가 우리나라 북부의 투부 반군을 무장시키기 시작했다는 보고를 받았습니다. 알제리가 침공한다면 이 반군은 분명 그들의 대의에 합류할 것입니다."
 AlgeriaFocus.70.a: "우려스럽다"
 AlgeriaFocus.71.t: "[FROM.GetNameDef], 공동 채굴 제안"
 AlgeriaFocus.71.d: "[FROM.GetAdjective] 정부가 아오주 지대에서의 공동 우라늄 채굴 사업을 제안했습니다. 이는 장래에 양국 모두에게 자원을 제공할 것입니다. 어떻게 대응해야 하는가?"
 AlgeriaFocus.71.a: "훌륭한 생각이다!"
 AlgeriaFocus.71.b: "관심 없다"
 AlgeriaFocus.72.t: "[FROM.GetNameDef], 우리의 제안 수락"
 AlgeriaFocus.72.d: "[FROM.GetAdjective] 정부가 공동 채굴에 관한 우리의 제안을 수락했습니다"
 AlgeriaFocus.72.a: "훌륭하다"
 AlgeriaFocus.73.t: "[FROM.GetNameDef], 우리의 제안 거부"
 AlgeriaFocus.73.d: "[FROM.GetAdjective] 정부가 공동 채굴에 관한 우리의 제안을 거부했습니다"
 AlgeriaFocus.73.a: "젠장"
 AlgeriaFocus.74.t: "[FROM.GetNameDef], 우라늄 채굴 개시"
 AlgeriaFocus.74.d: "[FROM.GetNameDef]은(는) 아오주 지대에서 우라늄 채굴을 시작했습니다. 자원의 대부분은 그들에게 돌아가지만 우리도 소량의 몫을 얻으며, [FROM.GetAdjective] 측은 채굴에 드는 모든 비용을 부담하기로 합의했습니다."
 AlgeriaFocus.74.a: "알겠다"
 AlgeriaFocus.91.t: "정부 확대"
 AlgeriaFocus.91.d: "이제 우리가 집권한 만큼, 지지 기반을 넓혀 추가 개혁을 추진할 수 있도록 입지를 굳혀야 합니다. 두 정당이 일정한 조건을 걸고 우리와 동맹을 맺겠다고 제안했습니다. 규모는 작지만 야심 찬 한 정당은 권력 이양과 직접 민주주의 구상을 도입하려는 분권주의자들이 이끌고 있습니다. 다른 정당은 질서와 정의를 이끄는 유능한 통합 세력으로 기능할 수 있는 중앙 집권적 관료 권력 기반을 추구하는 포퓰리스트 공화주의자들이 이끌며, 분권화에 전적으로 반대합니다. 우리는 다음과 동맹을 맺을 것입니다:"
 AlgeriaFocus.91.a: "분권주의자들"
 AlgeriaFocus.91.b: "포퓰리스트 공화주의자들"
 AlgeriaFocus.91.c: "그래, 그 얘기는 나중에 하자"
 ALG_claim_jerusalem_for_arabs: "아랍인을 위한 예루살렘 영유권 주장"
 ALG_claim_jerusalem_for_arabs_desc: "이스라엘인도 팔레스타인인도 이 지역을 차지할 자격이 없습니다. 그들은 이 지역을 엉망으로 만들 뿐임을 보여 주었습니다. 이 지역을 통치하며 평화와 안정을 가져오는 것은 진정한 아랍인의 몫이어야 합니다."
 ALG_claim_jerusalem_for_arabs_tt: "레반트의 §Y영유권 주장§! 중인 주를 §Y중핵§!으로 전환할 수 있게 됩니다"
 ALG_approach_hamas: "하마스 접근"
 ALG_approach_hamas_desc: "하마스는 시온주의를 저지하려는 유일한 진정한 세력입니다. 이스라엘을 무너뜨릴 준비를 하기 위해 그들과 더 나은 관계를 구축해야 합니다."
 ALG_send_fighters_to_hamas: "하마스에 전투원 파견"
 ALG_send_fighters_to_hamas_desc: "팔레스타인인들이 시온주의 침략자들에 용감히 저항하고 있지만, 단순한 진실은 그들이 수적으로 열세라는 것입니다. 팔레스타인으로 가서 하마스의 대열에 합류할 자원자 집단을 모집해야 합니다."
 MSP_claim_jerusalem_for_arabs: "아랍인을 위한 예루살렘 영유권 주장"
 MSP_claim_jerusalem_for_arabs_desc: "이스라엘인도 팔레스타인인도 이 지역을 차지할 자격이 없습니다. 그들은 이 지역을 엉망으로 만들 뿐임을 보여 주었습니다. 이 지역을 통치하며 평화와 안정을 가져오는 것은 진정한 아랍인의 몫이어야 합니다."
 MSP_approach_hamas: "하마스 접근"
 MSP_approach_hamas_desc: "하마스는 시온주의를 저지하려는 유일한 진정한 세력입니다. 이스라엘을 무너뜨릴 준비를 하기 위해 그들과 더 나은 관계를 구축해야 합니다."
 MSP_send_fighters_to_hamas: "하마스에 전투원 파견"
 MSP_send_fighters_to_hamas_desc: "팔레스타인인들이 시온주의 침략자들에 용감히 저항하고 있지만, 단순한 진실은 그들이 수적으로 열세라는 것입니다. 팔레스타인으로 가서 하마스의 대열에 합류할 자원자 집단을 모집해야 합니다."
 MSP_condemn_china: "중국 규탄"
 MSP_condemn_china_desc: "중국이 자국 내 무슬림을 대하는 방식은 혐오스러우며 규탄받아야 합니다"
 MSP_improve_relations_with_algeria: "이집트와 관계 개선"
 MSP_improve_relations_with_algeria_desc: "알제리는 주로 과거의 분쟁 탓에 이집트와 순탄치 않은 역사를 가지고 있습니다. 우리는 모두 같은 편이므로 이집트인들을 이렇게 냉랭하게 대해서는 안 됩니다"
 MSP_work_together_with_BSEC: "BSEC와 협력"
 MSP_work_together_with_BSEC_desc: "BSEC(흑해 경제 협력 기구)는 흑해 주변에 번영을 가져오는 것을 목표로 하는 기구입니다. 이 기구는 흑해 연안 국가들과 남부 발칸의 일부 국가들로 구성되어 있습니다. 더 큰 이익을 위해 이들 국가와 협력해야 합니다"
 MSP_fixing_ideals: "이상 복원"
 AlgeriaInvestment.1.t: "[ALG.GetNameDef], 자국 사업에 대한 투자 요청"
 AlgeriaInvestment.1.desc: "10년간의 내전에서 벗어난 [ALG.GetNameWithFlag] 정부가 자국 전역의 여러 사업에 우리가 투자하도록 초청하고 있습니다. 자본을 투입할지는 우리에게 달려 있습니다. 투자는 알제에서의 영향력을 가져다주겠지만, 내륙에는 무장한 이슬람주의 단체들이 여전히 활동하고 있어 우리 자산에 대한 위험이 현실적으로 존재합니다."
 AlgeriaInvestment.1.a: "인프라에 투자한다!"
 AlgeriaInvestment.1.b: "민간 산업에 투자한다!"
 AlgeriaInvestment.1.c: "서비스 산업에 투자한다!"
 AlgeriaInvestment.1.d: "위험을 감수하지 않는 편이 낫다."
 AlgeriaInvestment.2.t: "[FROM.GetNameDef], 우리 인프라에 투자"
 AlgeriaInvestment.2.d: "며칠간의 협상 끝에 [FROM.GetNameWithFlag]은(는) 약간의 최소한의 양보를 대가로 우리 인프라에 투자하는 데 동의했습니다. 이 투자는 국내 농촌 인구에게 이익이 될 것입니다."
 AlgeriaInvestment.2.a: "그들의 도움에 감사한다!"
 AlgeriaInvestment.3.t: "[FROM.GetNameDef], 우리 민간 산업에 투자"
 AlgeriaInvestment.3.d: "며칠간의 협상 끝에 [FROM.GetNameWithFlag]은(는) 약간의 사소한 양보를 대가로 민간 공장 몇 곳을 짓는 것을 돕기로 동의했습니다. 이 투자는 우리나라의 산업 부문에 이익이 되고 국가 현대화를 촉진할 것입니다."
 AlgeriaInvestment.3.a: "그들의 도움에 감사한다!"
 AlgeriaInvestment.4.t: "[FROM.GetNameDef], 우리 서비스 산업에 투자"
 AlgeriaInvestment.4.d: "며칠간의 협상 끝에 [FROM.GetNameWithFlag]은(는) 약간의 사소한 양보를 대가로 사무실 몇 곳을 지어 우리 서비스 산업에 투자하기로 동의했습니다. 이 투자는 우리나라의 금융 부문에 이익이 되고 국가 현대화를 촉진할 것입니다."
 AlgeriaInvestment.4.a: "그들의 도움에 감사한다!"
 AlgeriaInvestment.5.t: "[FROM.GetNameDef], 투자 거절"
 AlgeriaInvestment.5.d: "며칠간의 협상 끝에 [FROM.GetNameWithFlag]은(는) 우리나라의 사업 환경이 아직 충분히 안전하지 않다는 이유로 우리의 투자 초청을 거절했으며, 앞으로 우리와의 투자 계약을 신중히 평가하겠다고 밝혔습니다."
 AlgeriaInvestment.5.a: "더 노력해야 하겠군!"
 AlgeriaInvestment.6.t: "알제리, WTO 가입 후 중동 투자 모색"
 AlgeriaInvestment.6.d: "최근 세계무역기구(WTO)에 가입한 알제리는 경제 발전을 촉진하기 위해 자본 유입 확대를 노리고 있습니다. 관리들은 중동 국가들에 접촉하여 핵심 부문에서 더 큰 협력과 투자를 호소하고 있습니다. 이러한 움직임은 지역의 성장과 안정을 이끌기 위해 국제 파트너십을 활용하겠다는 알제리의 의지를 보여 줍니다."
 AlgeriaInvestment.7.t: "무역 협정 체결"
 AlgeriaInvestment.7.d: "그들은 더 큰 협력을 촉진하고 향후 투자의 문을 열어 두기 위해 무역 협정을 제안하고자 합니다"
 AlgeriaInvestment.7.a: "좋다"
 AlgeriaInvestment.6.a: "무역 협정에 서명한다"
 AlgeriaInvestment.6.b: "공장에 투자하라."
 AlgeriaInvestment.6.c: "No, Thank you"
 Algeria.11.t: "[ALG.GetNameDef], 우리의 보호 요청"
 Algeria.11.d: "수십 년간의 불안 끝에 알제리 정부는 전쟁의 재발 또는 외세의 간섭과 침공을 우려하고 있으며, [ALG.GetNameWithFlag]의 [ALG.GetLeader] 대통령이 중난하이를 방문해 [CHI.GetLeader] 총서기에게 방위 조약을 요청했습니다. 우리가 이들을 보호하는 데 동의한다면 이들이 우리의 영향권 안에 머물도록 할 수 있지만, 외부 위협으로부터 [ALG.GetNameWithFlag]을(를) 방어하고 국가의 안정 유지, 특히 £ALG_Caliphate_small 이슬람 극단주의 반란 진압을 지원할 의무도 지게 됩니다. 우리나라의 상황을 감안할 때 [ALG.GetLeader]와(과) 방위 조약을 체결해야 할까요?"
 Algeria.11.a: "또 한 명의 철의 형제다!"
 Algeria.11.b: "조약에 쓸 여력이 없다!"
 Algeria.12.t: "[CHI.GetNameDef], 우리를 보호하기로 동의"
 Algeria.12.d: "우리의 외교적 노력 덕분에 [CHI.GetNameWithFlag]의 [CHI.GetLeader] 총서기가 우리 [ALG.GetLeader] 대통령과 공식적으로 방위 조약을 체결했습니다. 이 방위 조약을 체결함으로써 [FROM.GetNameWithFlag]은(는) 외부 침략으로부터 우리를 보호할 뿐 아니라 우리의 내부 안정 유지도 지원할 것입니다."
 Algeria.12.a: "훌륭하다!"
 Algeria.13.t: "[CHI.GetNameDef], 서명 거부"
 Algeria.13.d: "우리 [ALG.GetLeader] 대통령이 안보 지원을 요청하러 [CHI.GetNameWithFlag]을(를) 방문했음에도 불구하고, [CHI.GetLeader]은(는) 어떠한 조약에 대해서도 입을 닫았습니다. [CHI.GetLeader]은(는) 우리 대통령에게 \\"우리는 언제나 지역의 안보와 안정에 헌신할 것입니다.\\"라고 말했습니다. 그러나 [CHI.GetLeader]의 헌신이 말뿐이라는 점은 매우 분명하며, 우리는 홀로 스스로를 지켜야 합니다."
 Algeria.13.a: "실망스럽다"
 ALG_join_nato_partnership: "NATO 파트너십 가입"
 ALG_eu_trade_agreements: "EU 무역 협정"
 ALG_expand_russian_gas_investments: "러시아 가스 투자 확대"
 ALG_expand_russian_gas_investments_desc: "러시아와의 거래를 확대하여 더 많은 가스를 확보하고 국가를 건설합니다."
 ALG_join_belt_and_road: "일대일로 가입"
 ALG_join_belt_and_road_desc: "중국 철도 체계에 가입하고 아프리카 최초의 지하철역을 건설합니다."
 ALG_tech_exchange_with_china: "중국과 기술 교류"
 ALG_tech_exchange_with_china_desc: "중국의 기술을 확보하여 국가를 발전시킵니다."
 ALG_mediterranean_dialogue: "지중해 대화"
 ALG_military_takes_control: "군부 장악"
 ALG_install_tebboune: "테분을 정부에 영입"
 ALG_tebboune: "압델마지드 테분 대통령"
 ALG_military: "군부 장악"
 ALG_reformist_path: "사건에서 개혁주의 노선을 선택함"
 ALG_hardliner_control: "사건에서 강경파 통제를 선택함"
 ALG_islamist_path: "사건에서 이슬람주의 노선을 선택함"
 ALG_oil_focused_energy_tt: "추가 수입: $§G0.050§!"
 ALG_oil_focused_energy_self_sufficient: "자급자족 석유 국가"
 ALG_oil_focused_energy_self_sufficient_desc: "알제리는 개발되지 않은 석유 자원을 활용해 에너지 생산을 자급자족하기로 결정했습니다. 석유는 저렴하고 접근하기 쉽지만 환경에 가장 친화적인 방식은 아닙니다."
 ALG_oil_focused_energy_small_profit: "수익성 있는 석유 국가"
 ALG_oil_focused_energy_small_profit_desc: "알제리는 개발되지 않은 석유 자원을 활용해 에너지 생산을 자급자족하기로 결정했습니다. 석유는 저렴하고 접근하기 쉽지만 환경에 가장 친화적인 방식은 아닙니다."
 ALG_oil_focused_energy_small_profit_tt: "추가 수입: $0.050!"
 ALG_oil_focused_energy_rich: "부유한 석유 국가"
 ALG_oil_focused_energy_rich_desc: "알제리는 개발되지 않은 석유 자원을 활용해 에너지 생산을 자급자족하기로 결정했습니다. 석유는 저렴하고 접근하기 쉽지만 환경에 가장 친화적인 방식은 아닙니다."
 ALG_oil_focused_energy_rich_tt: "추가 수입: $§G0.100§!"
 ALG_renewable_focused_energy: "초기 재생 에너지 국가"
 ALG_renewable_focused_energy_desc: "알제리는 재생 에너지 생산의 막대한 잠재력을 활용하기로 결정했습니다. 비용이 많이 들고 에너지 밀도가 낮지만, 재생 에너지를 이용하면 환경에 도움이 됩니다."
 ALG_renewable_focused_energy_self_sufficient: "자급자족 재생 에너지 국가"
 ALG_renewable_focused_energy_self_sufficient_desc: "알제리는 재생 에너지 생산의 막대한 잠재력을 활용하기로 결정했습니다. 비용이 많이 들고 에너지 밀도가 낮지만, 재생 에너지를 이용하면 환경에 도움이 됩니다."
 ALG_renewable_focused_energy_small_profit: "수익성 있는 재생 에너지 국가"
 ALG_renewable_focused_energy_small_profit_desc: "알제리는 재생 에너지 생산의 막대한 잠재력을 활용하기로 결정했습니다. 비용이 많이 들고 에너지 밀도가 낮지만, 재생 에너지를 이용하면 환경에 도움이 됩니다."
 ALG_renewable_focused_energy_small_profit_tt: "추가 수입: $§G0.040§!"
 ALG_renewable_focused_energy_rich: "부유한 재생 에너지 국가"
 ALG_renewable_focused_energy_rich_desc: "알제리는 재생 에너지 생산의 막대한 잠재력을 활용하기로 결정했습니다. 비용이 많이 들고 에너지 밀도가 낮지만, 재생 에너지를 이용하면 환경에 도움이 됩니다."
 ALG_renewable_focused_energy_rich_tt: "추가 수입: $§G0.080§!"
 ALG_oil_focused_energy: "초기 석유 국가"
 ALG_oil_focused_energy_desc: "알제리는 개발되지 않은 석유 자원을 활용해 에너지 생산을 자급자족하기로 결정했습니다. 석유는 저렴하고 접근하기 쉽지만 환경에 가장 친화적인 방식은 아닙니다."
 ALG_unlock_FLN_focus_tt: "§4FLN을 지배 정당으로 설정하고, 이후 연립을 구성할지 단독으로 집권할지 선택합니다§!"
 ALG_fln_coalition_tt: "대통령 연립을 구성했으며 다른 정당들로부터 자금을 얻습니다"
 ALG_fln_no_coalition_tt: "단독으로 집권하기로 선택했습니다"
 FLN_focus: "FLN의 지배"
 ALG_crackdown_path: "§8탄압 노선 선택§!"
