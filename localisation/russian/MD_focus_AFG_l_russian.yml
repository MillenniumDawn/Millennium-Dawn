 AFG_ai_Weight_effect_Airlift: "Их готовность принять предложение по умолчанию §Gвысокая§!\n\nОни с большей вероятностью согласятся, если:\n §G-[USA.GetLeader] объявил операцию \"Несокрушимая свобода\"§!\n\nОни с меньшей вероятностью согласятся, если:\n §R-Мы не придерживаемся одинакового мировоззрения\n -У них плохое мнение о нас§!"
 AFG_ai_Weight_effect_Iran: "Их готовность принять предложение по умолчанию §Gвысокая§!\n\nОни с меньшей вероятностью согласятся, если:\n §R-Мы не придерживаемся одинакового мировоззрения\n -У них плохое мнение о нас\n -Мы сунниты§!"
 AFG_ai_Weight_effect_div_usa: "Их готовность принять предложение по умолчанию §Rнизкая§!\n\nОни с большей вероятностью согласятся, если:\n §G-Одобрено использование беспилотников \"Хищник\" ЦРУ\n -Мы придерживаемся одинакового мировоззрения\n -У них хорошее мнение о [AFG.GetNameDefCap]§!"
