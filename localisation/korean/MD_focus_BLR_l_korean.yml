 BLR_agriculture: "벨라루스의 농업"
 BLR_agriculture_desc: "Thanks to state subsidies and legal legislation, state farms and collective farms, which play an important role in this sector, have been preserved since Lukashenko's time. There are also private farms, but they also play a significant role."
 BLR_villages: "죽어가는 마을"
 BLR_villages_desc: "도시화의 압력 속에서 농촌 마을 자체가 머지않아 사라질 것입니다."
