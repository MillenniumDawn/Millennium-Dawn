 DESIGNER_REGIMENTAL_SUPPORT_COLUMN_TITLE: "Compagnies d'appui de bataillon. Ce sont des troupes d'appui et de combat rattachées directement au niveau du bataillon.\n\nLes compagnies d'appui de bataillon §Raffectent§! la §Yvitesse maximale§! de la division, et §Raugmentent§! la §Ylargeur de combat§!."
 DESIGNER_SUPPORT_COLUMN_TITLE: "Compagnies d'appui de brigade et de division. Ce sont des troupes d'appui tenues en arrière de la ligne de front pour aider.\n\nVous ne pouvez sélectionner qu'§Rune§! de chaque type.\n\n Les compagnies d'appui §Raffectent§! la §Yvitesse maximale§! de la division, et §Raugmentent§! sa §Ylargeur de combat§!."
