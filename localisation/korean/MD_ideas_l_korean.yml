 corruption_decreased_police_spending: "부패한 경찰"
 corruption_decreased_mil_spending: "부패한 방산 업계"
 corruption_decreased_edu_spending: "부패한 교육 업계"
 corruption_decreased_health_spending: "부패한 의료 복지 분야"
 corruption_decreased_social_spending: "부패한 사회 서비스 분야"
 corruption_civ_construction: "민간 건설 계획"
 corruption_mil_construction: "군수 건설 계획"
 corruption_construction_buff_idea: "건설 계획"
 corruption_military_prod_buff_idea: "군수 생산 계획"
 corruption_resource_buff_idea: "자원 수출 계획"
 post_war_recovery_effort: "전후 회복"
 zoroastrian: "조로아스터교"
 zoroastrian_desc: "조로아스터교는 세계에서 가장 오래된 유일신교이며, 가르침은 세계의 선과 악의 이원성을 설파한 이란의 예언자 조로아스터에 기반합니다. 조로아스터교의 세 가지 핵심 원칙은 선한 생각, 선한 행동, 선한 말입니다."
 ceremony_in_khentii_1: "헨티에서의 의식"
 ceremony_in_khentii_1_desc: "헨티 산맥에서의 승리는 지금도 우리가 잃어버린 땅을 되찾도록 고무합니다."
 ceremony_in_khentii_2: "헨티에서의 의식"
 ceremony_in_khentii_2_desc: "헨티 산맥에서의 승리는 지금도 우리가 잃어버린 땅을 되찾도록 고무합니다."
 Basic_Law_MAC: "마카오 특별행정구의 기본 법률"
 Basic_Law_MAC_desc: "중화인민공화국 마카오특별행정구 기본법은 마카오 헌법문서로서 마카오법령을 대체한다. 중화인민공화국 헌법 제31조에 따라 마카오는 특별행정구역 지위를 가지며, 이는 '일국양제' 정책 실시를 위한 헌법적 보장과 마카오 기본법 제정의 헌법적 근거를 제공한다. 특별 행정 구역."
 City_Of_Casino: "카지노의 도시"
 City_Of_Casino_desc: "카지노의 도시, 즉 마카오는 아시아에서 카지노 밀도가 가장 높은 곳 중 하나인 마카오시를 일컫는 속칭입니다. 이러한 현상 때문에 아시아의 라스베이거스 또는 \\"중국의 베가스\\"로 애칭되기도 합니다. 카지노가 도시에 가져다주는 수입은 견줄 데가 없으며, 도박 산업을 정부의 손에서 떼어 놓으면서도 도시에 훌륭한 수입원이 됩니다."
 civil_war_disorganised_military_1: "통제되지 않는 군대"
 civil_war_disorganised_military_1_desc: "내전의 발발로 우리는 군과의 연락이 끊겼습니다. 누가 누구 편인지, 보급 창고가 어디에 있는지, 심지어 누가 우리에게 무기를 공급하는지조차 확실하지 않습니다.\n\n§R이 국가 정신이 만료되면 상황이 약간 개선됩니다.§!\n\n현재 군 상태:\n§Y통제 불능§!\n혼돈\n혼란\n무질서\n무규율"
 civil_war_disorganised_military_2: "혼돈 상태의 군대"
 civil_war_disorganised_military_2_desc: "내전 초기의 충격에서는 회복했지만, 지휘 계통이 혼란스럽고 군수 관리가 엉망이어서 여전히 매우 혼돈스럽습니다.\n\n§R이 국가 정신이 만료되면 상황이 약간 개선됩니다.§!\n\n현재 군 상태:\n통제 불능\n§Y혼돈§!\n혼란\n무질서\n무규율"
 civil_war_disorganised_military_3: "혼란스러운 군대"
 civil_war_disorganised_military_3_desc: "우리는 군을 단순한 오합지졸 지원병 집단 이상의 무언가로 정비했습니다. 그러나 지도력은 여전히 부재하며 군은 주요 전략이나 목표 없이 움직이는 경향이 있습니다.\n\n§R이 국가 정신이 만료되면 상황이 약간 개선됩니다.§!\n\n현재 군 상태:\n통제 불능\n혼돈\n§Y혼란§!\n무질서\n무규율"
 civil_war_disorganised_military_4: "비조직적인 군대"
 civil_war_disorganised_military_4_desc: "초기 혼란의 가장 심한 시기는 지나갔으며, 군은 이제 대체로 진짜 군대처럼 행동하고 있습니다.\n\n§R이 국가 정신이 만료되면 상황이 약간 개선됩니다.§!\n\n현재 군 상태:\n통제 불능\n혼돈\n혼란\n§Y무질서§!\n무규율"
 civil_war_disorganised_military_5: "무질서한 군대"
 civil_war_disorganised_military_5_desc: "우리 군은 내전 이전의 전문적인 상태로 거의 돌아왔습니다. 현재 가장 큰 과제는 그동안 규합한 여러 민병대를 통합하는 것입니다.\n\n§R이 국가 정신이 만료되면 상황이 약간 개선됩니다.§!\n\n현재 군 상태:\n통제 불능\n혼돈\n혼란\n무질서\n§Y무규율§!"
 the_rubber_baron_of_africa: "아프리카의 강도남작 (Rubber Baron)"
 the_rubber_baron_of_africa_desc: "[CDI.GetName]은(는) 천연자원의 보고이며, 그 자원 중 하나가 우리 위대한 나라의 고무나무입니다. 우리는 아프리카 고무 대부분을 생산하며, 이처럼 유망한 자원을 국민을 위해 계속 독점해야 합니다. 이는 우리 위대한 나라의 성장과 번영에 도움이 될 뿐입니다."
 party_commands_gun: "당이 지휘하는 군대"
 party_commands_gun_desc: "인민해방군의 최우선 충성은 중국 공산당이다. 이러한 충성심은 엄격한 이념적 훈련과 군대 내 고위직에 있는 정치 간부들을 통해 보장됩니다."
 party_commands_gun_new_era: "당이 지휘하는 군대"
 party_commands_gun_new_era_desc: "인민해방군의 최우선 충성은 중국 공산당이다. 이러한 충성심은 엄격한 이념적 훈련과 군대 내 고위직에 있는 정치 간부들을 통해 보장됩니다."
 state_system: "중화"
 state_system_desc: "대체로 빗자루가 닿지 않는 곳의 먼지는 저절로 사라지지 않습니다. 비판의 무기는 무기에 의한 비판을 대신할 수 없습니다. 중국군은 더 이상 국경의 장벽 뒤에 숨어 떨지 않았습니다."
 chastity_paifang: "평화적 공존"
 chastity_paifang_desc: "중화인민공화국 건국 이래 중국의 대외 정책은 평화공존 5원칙을 지침으로 삼아 왔습니다. 이 원칙에는 주권과 영토 보전의 상호 존중, 상호 불가침, 타국 내정 불간섭, 평등과 호혜, 평화 공존이 포함됩니다. 이러한 원칙에 따라 중국은 웨스트팔리아식 국가 주권을 옹호하면서 반개입주의 입장을 유지해 왔습니다."
 prosperity_of_borderland: "국경 지역의 번성"
 prosperity_of_borderland_desc: "내륙과 변경은 밀접하게 연결되어 있으며, 둘 다 중국의 불가분한 일부입니다."
 jebtsundamba_khutuktu: "젭춘담바 후툭투 (Jebtsundamba Khutuktu)"
 jebtsundamba_khutuktu_desc: "젭춘담바 쿠툭투는 외몽골 지역에서 티베트 불교 겔룩파의 정신적 지도자에게 주어지는 칭호입니다. 그는 우리 몽골 민족에게 축복을 내릴 것입니다."
 mongolia_rely_to_china: "Mongolia Relies On China"
 mongolia_rely_to_china_desc: "내륙국이라는 처지 때문에 우리 경제는 중국과 긴밀하게 통합되어 있습니다."
 factory_of_the_world_desc: "세계의 공장은 세계 시장에 대규모 공산품을 공급하는 제조 기지입니다."
 a_new_leap_forward_desc: "공산주의로의 변질"
 CHI_megacity_development_desc: "국제연합은 현재 32억 명인 세계 도시 인구가 2030년에는 50억 명으로 증가할 것으로 예측합니다. 2030년에는 세계 인구의 5분의 3이 도시에 살게 됩니다."
 CHI_western_development_desc: "서부 대개발은 중화인민공화국 중앙 정부의 전반적이고 조율된 지역 발전 전략으로, 정책적 우대와 재정 투자를 통해 동부와 서부 지역 간의 경제 발전 격차를 좁히고 중서부 지역의 종합적인 경제력을 높이는 것을 목표로 합니다."
 CHI_new_boundary_desc: "In Chinese history books, leaders who obtained new territories will always leave a great mark."
 CHI_promoting_innovation_desc: "혁신은 발전을 이끄는 첫째 동력입니다."
 CHI_improving_rd_desc: ""
 CHI_dominant_tech_industry_desc: "과학 기술은 제1의 생산력입니다."
 CHI_idea_high_speed_railway_modifier: "중국 고속철"
 CHI_idea_high_speed_railway_modifier_desc: "중화인민공화국 고속철도는 현재 세계 최대의 고속철도망이다."
 idea_focus_energy_preferred_fossil: "화석연료 발전 선호"
 idea_focus_energy_preferred_fossil_desc: "우리는 더 비용 효율적이고 당면한 문제를 완화하는 데 도움이 되므로 녹색 에너지보다 화석 연료 발전을 선호하기로 결정했습니다."
 idea_focus_energy_preferred_renewable: "재생에너지 장려"
 idea_focus_energy_preferred_renewable_desc: ""
 idea_focus_unemployment_program: "실업 프로그램"
 idea_focus_unemployment_program_desc: ""
 corruption_decreased_adm_spending_desc: "우리 정부의 행정부는 부패했지만 이로 인해 장부에서 일부 비용을 \"절감\"할 수 있게 되었습니다."
 corruption_decreased_police_spending_desc: "제도에 몇 가지 변화를 주면 경찰이 더 적은 예산으로 운영될 수 있어 우리가 원하는 대로 할 여지가 늘어납니다."
 corruption_decreased_mil_spending_desc: "방위 산업의 권력 요직에 적절한 인물을 앉히면 더 유리한 조건으로 협상할 수 있습니다."
 corruption_decreased_edu_spending_desc: "교육은 정부의 도구일 뿐입니다. 이제 그 도구를 활용하여 그동안 쏟아부은 돈의 일부를 되찾을 때입니다."
 corruption_decreased_health_spending_desc: "어차피 의료는 폰지 사기입니다."
 corruption_decreased_social_spending_desc: "복지라니요? 효과적인 복지는 필요하지 않으며, 지원금을 삭감할 때입니다!"
 corruption_civ_construction_desc: "불필요한 규제를 일부 없애고 못 본 척하면 지어져서는 안 될 건물 몇 채를 지을 수 있습니다."
 corruption_mil_construction_desc: "군수 생산을 조금 더 끌어들여 한두 명의 친구에게 넘겨주는 것도 좋겠습니다."
 fuel_structure_building_efforts: "국가 연료 저장소 확립"
 assianism: "아시아주의"
 assianism_desc: "아시아니즘은 알란 부족의 스키타이인 후예인 오세티아인의 전통 신화에서 유래한 민속 종교로, 고대 스키타이 종교의 연속으로 여겨집니다. 이 종교는 러시아어를 사용하는 신도들 사이에서는 \\"아시아니즘\\"으로, 오세티아인들 자신의 언어로는 간단히 이론 딘으로 알려져 있습니다. 1980년대에 오세티아인의 민족 종교로서 의식적으로 제대로 재조직되기 시작했습니다."
 old_hatreds: "오래된 증오"
 old_hatreds_desc: "수천 년간 이어진 중국과 일본의 반목은 마침내 끝내야 합니다."
 CHI_electric_car_project_idea: "중국 전기차 프로젝트"
 CHI_electric_car_project_idea_desc: "전기차와 기타 산업 프로젝트에 투자하면 위대한 우리나라는 계속 전진할 수 있습니다. 우리는 차량 분야의 선도적인 제조국이 될 것이며, 이는 그 목표를 달성하기 위한 한 걸음일 뿐입니다."
 idea_generic_temporary_debt_refactoring: "일시적 부채 재편"
 idea_generic_temporary_debt_refactoring_desc: "우리 정부의 현재 부채 상황은 상당히 지속 불가능합니다. 현재 정부 부채를 약간 조정하면 전체 상환 부채를 줄일 수 있습니다."
 fighter_production_bonus_desc: "자원과 자금을 몇 가지 신중히 배분하면 전투기 생산 속도를 향상시킬 수 있습니다."
 august_1st: "8월 1일 훈장"
 august_1st_desc: "8월 1일 훈장은 중국 인민해방군, 인민무장경찰부대, 공안부 소속 군인과 민간인에게 수여되는 최고 군사 훈장입니다."
 CHI_bilibili_idea: "빌리빌리"
 CHI_bilibili_idea_desc: "네 삼촌, 나 정말 화났어."
 USA_usaid_idea_2_tt: "§Y[USA.GetNameWithFlag]§!의 영향을 받을 때 §Y[THIS.GetFlag] [THIS.GetAdjective]§!의 $foreign_influence_defense_modifier$이(가) §R5%§! §R감소§!합니다.\n"
 cfa_franc: "CFA 프랑"
 cfa_franc_desc: "CFA 프랑은 제2차 세계 대전 이후 식민지를 급격한 평가절하로부터 보호하기 위해 만들어졌습니다. 원래는 프랑스 정부의 관대한 조치로 소개되었으나, 탈식민 이후 종속을 이어가는 또 하나의 도구로 여겨지게 되었습니다. 통화의 경제적 이점과 안정성이 프랑스가 우리에게 유지하는 영향력과 통화 정책에 대한 통제를 언제나 상쇄하는 것은 아닙니다."
 china_reunification: "중국 통일"
 china_reunification_desc: "수많은 고된 전투 끝에 중국은 마침내 통일을 이루었습니다. 중국은 세계 강국이 되기 위한 또 한 걸음을 내디뎠습니다."
 two_child_policy: "두 자녀 정책"
 two_child_policy_desc: "30년 가까이 이어진 한 자녀 정책 끝에 중국은 출산율 하락을 겪고 있습니다. 이러한 추세에 신속히 대응하고 출산율을 정상 수준으로 되돌리기 위해 중국 정부는 출산 제한 정책을 다소 완화하려 합니다."
 fate_of_mongolian_area: "북쪽에서 온 불길한 예감"
 fate_of_mongolian_area_desc: "몽골 지방은 중화민국 대륙 시기 외몽골 지역의 공식 행정 구역 명칭이었습니다. 우리가 중국 대륙을 잃었을 때 몽골 지방도 함께 잃었습니다. 이제 대륙 정부가 갑자기 외몽골에 관심을 보이고 있으며, 이는 우리에게 좋은 일이 아닌 것으로 보입니다. "
 fate_of_mongolian_area_1: "몽골 지방의 운명"
 fate_of_mongolian_area_1_desc: " 뜻밖에도 우리가 잃은 몽골 지방을 중국 대륙 정부가 되찾아 갔으니, 다음 목표는 자명합니다."
 chinese_khalkha: "중국의 방패"
 chinese_khalkha_desc: "할하라는 단어는 몽골어로 방패를 뜻하며, 우리는 북쪽의 튼튼한 방패를 되찾았습니다."
 CHI_electric_car_project_idea_1: "샤오미의 지원을 받는 중국 전기차 프로젝트"
 CHI_electric_car_project_idea_1_desc: "중국의 전기차 프로젝트는 샤오미의 지원으로 차량 산업의 도약이 될 것입니다."
 CHI_studyding_strengthen: "학습강국"
 CHI_studyding_strengthen_desc: "마오 주석 어록의 디지털 버전"
 socialist_vietnam: "베트남 사회주의 공화국"
 socialist_vietnam_desc: "베트남 사회주의 공화국은 일당 독재를 시행하며 베트남 공산당의 지도를 따릅니다."
 lao_vietnan_treaty: "라오스-베트남 우호 협력 조약"
 lao_vietnan_treaty_desc: "1977년 7월 18일 비엔티안에서 라오스 공산당과 베트남 공산당이 체결한 이 조약은 당시 베트남이 \\"인도차이나 연방\\" 수립을 구상하는 데 중요한 밑그림이었습니다."
 VIE_VPA_Business_Ventures: "베트남 인민군 사업체"
 VIE_VPA_Business_Ventures_desc: "1990년대의 급격한 국방비 삭감으로 베트남은 중국의 선례를 따라 군이 상업 사업을 추진하도록 허용했습니다. 수익은 부채를 갚고 군 장비와 복지를 개선하는 데 도움이 되었으나 군의 주의를 분산시켰습니다. 이 국가 정신은 §Y$the_military$§!이(가) 내부 파벌이 되고, §Y$communist_cadres$§!이(가) 내부 파벌이 아니며, 부패가 5단계 이하이고, 최소 100,000명의 인력이 배치되면 제거됩니다."
 dominance_of_the_cpp: "캄보디아 인민당의 지배"
 dominance_of_the_cpp_desc: "캄보디아 인민당은 캄보디아 헌법 개정 이래 캄보디아 정치 무대를 지배해 왔습니다.\n"
 full_control_of_hormuz_idea_TT: "추가 수입: $§G0.800§!"
 generic_increased_military_support: "군사 지원 증대"
 idea_generic_reaching_to_the_global_market: "세계 시장 진출"
 idea_generic_reaching_to_the_global_market_desc: "세계 시장으로 진출하여 우리의 투자를 비용 면에서나 시간 면에서 더 효율적으로 만드는 것은 우리나라에 더 많은 이익을 가져다줄 뿐입니다."
 idea_generic_the_manpower_solution: "인력 해결책"
 idea_generic_the_manpower_solution_desc: "더 많은 사람을 노동력으로 끌어들이도록 장려하면 나라의 모든 경제 부문을 개선할 수 있습니다."
 idea_generic_worker_productivity: "1인당 생산성 향상"
 idea_generic_worker_productivity_desc: "우리 노동자들은 매우 생산적이며, 최근의 기술 개선 덕분에 우리나라에서 이러한 변화와 전환을 계속 장려해야 합니다."
 MNC_city_of_casino: "부자들을 위한 카지노 도시"
 MNC_city_of_casino_desc: "모나코는 수많은 카지노 때문에 유럽에서 \\"카지노 도시\\"라는 애칭으로 불립니다. 특히 모나코의 카지노는 억만장자와 부유층의 놀이터인 이 도시와 함께 부자들의 취향에 맞춰져 있습니다."
 naval_power_of_the_continent: "대륙의 해군력"
 naval_power_of_the_continent_desc: "우리는 대륙에서 가장 큰 해군력을 보유하고 있으며, 현재 대륙 최대의 해군 강국입니다. 다른 국가의 §Y배치된 해군 인력§!이 우리보다 많아지면 그 국가가 우리를 추월할 수 있습니다."
 OAU_member: "아프리카 통일 기구 회원국"
 OAU_member_desc: "아프리카 통일 기구(OAU)는 1963년 당시 독립한 아프리카 국가들이 창설했습니다. 이 기구의 목표는 아프리카의 정치적, 경제적 통합을 장려하고 식민주의와 신식민주의에 맞서 싸우는 것이었습니다. 그러나 회원국 간에 공동의 군사, 사법, 정치 부서가 설립되지 않아 이 기구는 주로 '탁상공론의 장'에 머물렀습니다. 1999년 리비아 지도자 무아마르 카다피의 주도 아래 OAU 회원국들은 늦어도 2002년까지 OAU를 아프리카 연합으로 대체하여 마침내 아프리카 대륙을 통합할 수 있는 기구를 만들겠다는 의도로 시르테 선언에 서명했습니다."
 SHA_libyan_education: "리비아의 교육"
 SHA_libyan_education_desc: "리비아는 1980년대부터 사하라위 독립의 열렬한 지지자였습니다. 리비아가 폴리사리오 전선을 지원하는 핵심 방법 중 하나는 많은 사하라위 청년들에게 교육을 제공하는 것입니다. 덕분에 우리 국민은 모로코인들이 우리에게 허락하지 않는 교육을 받을 수 있습니다."
 idea_overlord_subsidies: "종주국 보조금"
 idea_overlord_subsidies_desc: "종주국이 우리의 경제적 이익을 위해 제공하는 보조금 때문에 우리는 경제를 점점 더 그들에게 의존하게 되어 서서히 자치권을 잃고 있습니다."
 SUD_humiliated_army: "모욕당한 군대"
 SUD_humiliated_army_desc: "The recent raid by Darfuri rebels at El Fasher has been a major military and psychological hit to the Sudanese Army. A much smaller group of rebels managed to destroy several aircraft, kill multiple soldiers and capture a major general who was a commander of an air base. It will take time before the army can recover from this."
 CHI_highspeed_railway_construction: "중국 고속철도 건설"
 CHI_highspeed_railway_construction_desc: "중국은 인구가 많고 이동이 잦아 대중적인 교통수단인 고속철도에 대한 수요가 막대합니다. 고속철도의 발전은 국가의 교통 여건을 크게 개선할 것입니다."
 idea_focus_import_additional_military_equipment: "추가 군사 장비 수입"
 idea_focus_import_additional_military_equipment_desc: "추가 군사 장비를 수입하기 시작할 때입니다. 그렇지 않으면 장비 부족 속에서 싸우다 전장에서 패배할 것입니다."
 political_power_bonus_desc: "구체적인 개선과 불필요한 규제 철폐로 행정부가 추가적인 정치적 결정과 법률 개정을 수행할 수 있게 됩니다."
 CIS_member_state_idea: "CIS 회원국"
 CIS_member_state_idea_desc: "독립국가연합(CIS)은 유라시아의 지역 정부 간 기구입니다. 1991년 소련 해체 이후 결성되었습니다. 면적은 20,368,759 km2이며 추정 인구는 246,200,194명입니다. CIS는 경제, 정치, 군사 분야의 협력을 장려하며, 국경을 넘나드는 범죄 예방을 포함하여 무역, 금융, 입법, 안보의 조정과 관련된 일정한 권한을 가집니다."
 CIS_united_anti_air_idea: "CIS 공동 방공 체계"
 CIS_united_anti_air_idea_desc: ""
 CIS_anti_terror_idea: "CIS 대테러 센터"
 CIS_anti_terror_idea_desc: ""
 CIS_bank_idea: "CIS 국가간 은행"
 CIS_bank_idea_desc: ""
 CIS_council_leaders_idea: "CIS 국가원수 이사회"
 CIS_council_leaders_idea_desc: ""
 CIS_anti_air_loc1: "\n§gCIS 공동 방공 체계§!:\n£supply_consumption_core_texticon  중핵 영토 내 보급 전투 페널티: §G-3.00%§!\n£attack_core_texticon  중핵 영토 내 사단 공격력: §G+1.00%§!\n£defence_core_texticon  중핵 영토 내 사단 방어력: §G+2.00%§!\n"
 CIS_anti_terrorism_loc1: "\n§gCIS 대테러 센터§!:\n£salafist_outlook_campaign_cost_modifier_texticon 살라피스트 일일 지지: §G-0.01§!\n£stability_texticon  안정도: §G+1.00%§!\n"
 CIS_bank_loc1: "\n§gCIS 국가간 은행§!:\n£econ_cycle_upg_cost_multiplier_modifier_texticon §Y경제 업그레이드 주기 비용§! 배율: §G-2.00%§!\n£trade_deal_opinion_texticon  무역 협정 관계 요인: §Y+10.00%§!\n"
