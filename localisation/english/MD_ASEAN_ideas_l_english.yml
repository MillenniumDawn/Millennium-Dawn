l_english:

 ASEAN_Member_drifting: "A Distant Chair"
 ASEAN_Member_drifting_desc: "We still hold a seat at the table. Our present course conflicts with the Association's founding principles, and the other capitals know that. The seat stays ours. We are spending the credibility that comes with it."

 ASEAN_Member_detached: "The Empty Chair"
 ASEAN_Member_detached_desc: "We hold a chair we do not fill. Government policy has taken us out of the room in every way that counts. The shared modifier is gone, and so is the vote weight. The ability to block a decision is gone with them. The other members are learning that this absence works in their favour."

 ASEAN_Member_estranged: "One Foot Out"
 ASEAN_Member_estranged_desc: "We remain members in name only. The others no longer expect us to attend. An exit decision is available, and the other governments have left that path open. The Charter has no expulsion procedure. If we leave, we have to leave on our own decision."

 ASEAN_suspended: "Suspended from the Summits"
 ASEAN_suspended_desc: "ASEAN has voted to bar our government from summits and ministerial meetings. The seat stays in the hall, the flag stays on the pole, and the foreign ministry receives no invitation. The Charter has no expulsion clause. The summit used a suspension vote instead."

 ASEAN_secretariat_hq: "The Secretariat in Jakarta"
 ASEAN_secretariat_hq_desc: "The Association's Secretariat sits here. Other capitals second staff to it, drafters work in the next office, and the meeting rooms fill every week. Hosting a quiet institution still gives this capital leverage, even when the government does not spend that leverage in public."

 ASEAN_chair_this_year: "In the Chair"
 ASEAN_chair_this_year_desc: "The chairmanship rotates to us for the year. We set the agenda inside the limits the Secretariat and the other members will accept. Some small members have used their year to unusual effect. Others have used theirs to no effect. We now decide which of those patterns to follow."

 ASEAN_currency_swap_net: "The Chiang Mai Line"
 ASEAN_currency_swap_net_desc: "We hold a line of credit against the common pool. The rate beats the Fund's rate, the surveillance is lighter, and the paperwork follows a template every finance ministry in the region already uses. The next crisis meets a government that already has that line in place."

 ASEAN_aicur_body: "AICHR Ratified"
 ASEAN_aicur_body_desc: "We have ratified the strengthened Commission. Its mandate covers our conduct on the same terms as every other member's. The difficult reviews we voted for will now take place, and the record of those reviews will be public."

 ASEAN_reforms_modifier: "ASEAN Integration"
 ASEAN_reforms_modifier_desc: "This records the benefit already built up from ASEAN work: ratified trade agreements, access to the safety net, and the diplomatic weight of centrality. It is a status, not an argument. We hold it because we still stand with the other members."

 ASEAN_chinese_doctrine: "The Chinese Doctrine"
 ASEAN_chinese_doctrine_desc: "Our procurement, training, and doctrine now run on Chinese lines. Arms production moves faster and the army hits harder for it, but Washington and Tokyo have taken note, and holding this course costs us political capital at home."

 ASEAN_american_doctrine: "The American Doctrine"
 ASEAN_american_doctrine_desc: "Our air and naval doctrine now run on American lines, interoperable down to the radio frequencies. Our pilots coordinate tighter and our coastline holds firmer for it, but Beijing has taken note, and holding this course costs us political capital at home."

 ASEAN_bebas_aktif_doctrine: "Bebas Aktif"
 ASEAN_bebas_aktif_doctrine_desc: "We hold to bebas aktif, the free and active policy that keeps our foreign relations independent of any single patron. Neither Washington nor Beijing supplies us, so our own arms lines and our own defences carry the weight, and our course holds steadier against outside pressure for it."
