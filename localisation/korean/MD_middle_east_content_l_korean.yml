 kuwait.1.t: "반도의 사자들 해체"
 kuwait.1.desc: "쿠웨이트 보안군이 1월에 조직원들과 벌인 일련의 총격전 끝에, 알카에다와 연계된 조직 '반도의 사자들'을 소탕했습니다. 조직의 지도자로 지목된 인물은 구금 중 사망했고, 생존한 무장 요원들은 미군과 쿠웨이트 보안 요원을 노린 공격을 모의한 혐의로 재판을 받게 됩니다."
 kuwait.1.a: "조직이 와해되었다."
 kuwait.2.t: "쿠웨이트 진보 운동"
 kuwait.2.desc: "좌파 파벌이 쿠웨이트 민주 포럼에서 갈라져 나와, 포럼 지도부가 신자유주의로 기울고 있다고 비난했습니다. 이 새 단체는 스스로를 마르크스-레닌주의 조직이라 규정하며 쿠웨이트 좌파에 독자적인 목소리를 부여하려 합니다."
 kuwait.2.a: "좌파가 제 갈 길을 간다."
 kuwait.3.t: "인민행동 운동"
 kuwait.3.desc: "인민행동 블록과 연대한 야권 청년들이 '하시드'로 알려진 인민행동 운동으로 새롭게 출범했습니다. 이 운동은 선출된 정부, 이전 투표 제도로의 복귀, 정당의 합법화를 요구합니다."
 kuwait.3.a: "야당이 재편된다."