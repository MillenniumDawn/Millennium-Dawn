 ALG_renewable_focused_energy: "Nación en vías de energías renovables"
 ALG_renewable_focused_energy_desc: "Argelia ha decidido aprovechar su gran potencial para la producción de energía renovable. Aunque es costosa y tiene una baja densidad energética, el uso de energía renovable ayudará al medio ambiente."
 ALG_renewable_focused_energy_self_sufficient: "Nación autosuficiente en energías renovables"
 ALG_renewable_focused_energy_self_sufficient_desc: "Argelia ha decidido aprovechar su gran potencial para la producción de energía renovable. Aunque es costosa y tiene una baja densidad energética, el uso de energía renovable ayudará al medio ambiente."
