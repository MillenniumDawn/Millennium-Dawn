 BLZ.oligarchism_desc: ""
 BOL.conservatism: "£BOL_western_conservative (ADN) - 民族民主行动"
 BOL.conservatism_desc: "（自由保守主义）- 民族民主行动\n\n民族民主行动党是雨果·班泽尔的政党，也是前军方势力和圣克鲁斯右翼的政治中心。该党主张秩序、私营企业和安全至上的国家理念，并通过“超级联盟”进行执政。该联盟是由革命左翼运动、公民团结联盟、祖国良心、新共和力量和基督教民主党等政党组成的广泛联盟，以政府部长职位换取国会选票。\n\n其外交政策坚定亲美：尊严计划在美国的资助下推行根除古柯种植的行动，该党也是国际民主联盟的成员。其影响力源于军官团、东部商业精英以及总统职位带来的庇护关系。"
 BOL.liberalism: "£BOL_non_aligned_conservative (MNR) - 革命民族主义运动"
 BOL.liberalism_desc: "（自由民主主义）- 革命民族主义运动\n\n革命民族主义运动是玻利维亚民族革命时期历史悠久的政党，后来发展成为玻利维亚市场经济的缔造者。该党主张私人投资、国有企业资本化和宏观经济稳定，并通过与其他老牌政党结盟进行执政。贡萨洛·桑切斯·德·洛萨达的第二个总统任期在2003年的天然气冲突中结束，此后该党实力萎缩，沦为右翼的一个次要盟友，并于2025年加入豪尔赫·基罗加领导的自由联盟。\n\n它亲西方，是拉丁美洲和加勒比政党常设会议的成员。它的影响力在于它的品牌、它的地区领袖以及它为二十年的改革输送的技术官僚。"
 BOL.socialism: "£BOL_neutral_social_mir (MIR-NM) - 革命左翼运动 - 新多数派"
 BOL.socialism_desc: "（社会民主主义）- 革命左翼运动 - 新多数派\n\n革命左翼运动 - 新多数派是海梅·帕斯·萨莫拉的社会民主党，也是社会党国际的成员。该党已摆​​脱了马克思主义的根源，主张温和的改革纲领，并将组建联盟视为其核心业务，曾与乌戈·班泽尔的超级联盟合作，后来又与贡萨洛·桑切斯·德·洛萨达合作，以换取部长职位和议长职位。\n\n它亲西方，并且乐于接受它曾经反对的市场改革。它的影响力在于其议会联盟、在塔里哈的庇护网络以及其领导人的交易能力。"
 BOL.anarchist_communism: "£BOL_anarchist_communism (MAS-IPSP) - 社会主义运动"
 BOL.anarchist_communism_desc: "（革命社会主义，原住民主义）- 社会主义运动\n\n社会主义运动是查帕雷可卡因种植者联盟和玻利维亚统一工会农工联合会的政治工具，也是埃沃·莫拉莱斯和路易斯·阿尔塞执政时期的主导群众运动。它主张建立多民族国家，实行国家对油气资源的控制和再分配，并通过动员其工会在街头和国会进行治理。\n\n它奉行反帝国主义，于2008年驱逐了美国大使和美国缉毒局，并带领玻利维亚加入美洲玻利瓦尔联盟。即使在2023年埃维斯塔派和阿尔西斯塔派分裂之后，它的影响力仍然来自于玻利维亚总工会、农民联盟和查帕雷运动。"
 BOL.Neutral_conservatism: "£BOL_Neutral_Conservatism_nfr (NFR) - 新共和力量"
 BOL.Neutral_conservatism_desc: "（右翼民粹主义）- 新共和力量\n\n新共和力量是曼弗雷德·雷耶斯·维拉的个人政治工具。维拉曾是陆军上尉，也曾担任科恰班巴市市长，后来脱离了民族民主行动党。该党主张强硬手段、公共工程，并融合了市场务实主义和维护法律秩序的民粹主义言论，其竞选策略主要围绕其领导人的市政政绩展开。该党曾是雨果·班泽尔领导的超级联盟成员，后来独立竞选总统，但在2006年解散。其领导人随后通过争取玻利维亚进步计划－国家趋同和“玻利维亚自治党-加入重返政坛。\n\n它亲西方，敌视争取社会主义运动党。它的影响力在于科恰班巴的城市选民和雷耶斯·维拉的个人支持者。"
 BOL.neutral_Social: "£generic_neutral_Social_small (MSM) - 无畏行动"
 BOL.neutral_Social_desc: "（民主社会主义）- 无畏行动\n\n无畏运动是由人权律师胡安·德尔·格拉纳多创立的政党，他曾于2000年至2010年担任拉巴斯市市长，也是执政首都的城市进步左翼力量。该党主张民主社会主义、多民族国家和廉洁政府，并于2005年与争取社会主义运动结盟，后于2010年与其决裂，成为左翼批评力量。该党于2014年失去注册资格，随后衍生出路易斯·雷维利亚的主权与自由党，并于2025年在团结联盟内部重新崛起。\n\n它奉行不结盟和改革主义。它的影响力在于拉巴斯市政府、首都的中产阶级以及其廉洁的声誉。"
 BOL.Neutral_green: "£BOL_Neutral_green (PVB) - 玻利维亚绿党"
 BOL.Neutral_green_desc: "（环保主义）- 玻利维亚绿党\n\n玻利维亚绿党是一个小型环保政党，由玛格特·索里亚于2007年创立，是全球绿党成员。该党主张保护森林、水源和原住民领地免受资源开采，并与科利亚苏尤艾路和马克自治社区全国委员会合作开展活动，曾于2014年推举伊西博罗-塞屈雷原住民领地与国家公园领导人费尔南多·巴尔加斯竞选总统，但同年被取消注册资格。\n\n它对争取社会主义运动的资源掠夺模式和农产品出口权都持批判态度。它的影响力在于，每当道路、水坝或种植园威胁到受保护的土地时，环保运动和原住民运动都会动员起来。"
 BOL.Nat_Autocracy: "£BOL_Nat_Autocracy (FF.AA.) - 玻利维亚武装部队"
 BOL.Nat_Autocracy_desc: "（军政府）- 玻利维亚武装部队\n\n玻利维亚武装部队并非政党，而是在文官统治动摇时屡次介入政治的机构。在军政府统治下，各部委向最高统帅部负责，秩序由军方强制执行而非协商达成，国家安全凌驾于党派政治之上。2024年，陆军司令胡安·何塞·苏尼加试图用装甲车占领穆里略广场，但由于其他军种和警察拒绝配合，这一行动在数小时内便宣告失败。\n\n它的影响力在于拉巴斯和圣克鲁斯的驻军、军官团以及人们对兵营决定统治者的时代的记忆。"
 BOL.oligarchism: "£generic_oligarchism_small (Comité) - 圣克鲁斯公民委员会"
 BOL.oligarchism_desc: "（区域寡头政治）- 圣克鲁斯公民委员会\n\n圣克鲁斯公民委员会是由该省东部约三百个机构组成的联盟，其成员主要由当地的农业工业和银行业精英把持。该委员会主张省自治、维护圣克鲁斯人的身份认同，并保护低地经济免受拉巴斯的影响。其行动方式包括公民罢工、召开市政委员会会议以及圣克鲁斯青年联盟的突击队。该委员会主导了2008年的自治公投、导致埃沃·莫拉莱斯辞职的2019年罢工以及2022年的人口普查罢工。\n\n从鲁本·科斯塔斯到路易斯·费尔南多·卡马乔，其历任主席都转而竞选公职。该组织的影响力在于圣克鲁斯的商业商会及其瘫痪该地区的能力。"
 BOS.conservatism_sbih: "£bosnia_sbih (SBiH) - 波斯尼亚和黑塞哥维那党"
 BOS.conservatism_sbih_desc: "（民族保守主义） - 波斯尼亚和黑塞哥维那党\n\n哈里斯·西拉伊季奇于1996年离开民主行动党后创立了波斯尼亚和黑塞哥维那党。该党主张加强国家机构建设、倡导公民意识和推进欧洲一体化。其支持者主要集中在波黑联邦的波斯尼亚族选民中。"
 BOS.Neutral_conservatism_SDS: "£bosnia_sds (SDS) - 塞尔维亚民主党"
 BOS.Neutral_conservatism_SDS_desc: "（民族保守主义） - 塞尔维亚民主党\n\n成立于1990年的塞尔维亚民主党曾领导波斯尼亚塞族战时政府，并在代顿协议后仍是塞族共和国的主要政党之一。该党强调塞族民族代表权、实体自治和保守的社会政策。国际压力和战争遗留问题限制了其在国家机构中的参与。"
 BOS.Neutral_conservatism_PDP: "£Bosnian_Neutral_conservatism (PDP) - 民主进步党"
 BOS.Neutral_conservatism_PDP_desc: "（自由保守主义） - 民主进步党\n\n姆拉登·伊万尼奇于1999年9月创立了民主进步党，旨在成为塞尔维亚民主党之外的温和选择。该党支持市场改革、议会制政府和欧洲一体化，同时捍卫塞族共和国的宪法地位。2000年，该党以一支新兴但组织严密的塞尔维亚反对派力量的身份参加了总统竞选。"
 BOS.neutral_SocialSNSD: "£Bosnian_neutral_Social (SNSD) - 独立社会民主党"
 BOS.neutral_SocialSNSD_desc: "（社会民主主义） - 独立社会民主党\n\n独立社会民主党于1996年在米洛拉德·多迪克的领导下成立，最初以温和的社会民主主义政党自居，与塞族共和国的塞尔维亚民主党形成对比。该党支持塞族共和国的宪法权力，并参与波黑的联合机构。在2000年波黑成立之前，该党已在塞族共和国执政。"
 BOS.neutral_SocialDF: "£bosnia_DF (DF) - 民主阵线"
 BOS.neutral_SocialDF_desc: "（社会民主主义） - 民主阵线\n\n泽利科·科姆希奇于 2013 年离开波斯尼亚和黑塞哥维那党后创立了民主阵线。该党主张建立一个公民的、多民族的国家，加强中央机构建设，完善社会福利，并融入欧洲-大西洋一体化进程。该党并非在2000年波黑政治变革之初就出现，而是在波黑政治轮替后期才出现的。"
 BOS.conservatism: "£Bosnian_conservatism (SDA) - 民主行动党"
 BOS.conservatism_desc: "（保守主义） - 民主行动党\n\n民主行动党由阿利雅·伊泽特贝戈维奇于1990年创立，在波斯尼亚独立战争和波黑战争期间成为波斯尼亚族的主要政党。该党融合了保守的社会政策、波斯尼亚族的政治代表权以及对波黑主权国家的支持。战后，该党成为国家和联邦机构的核心参与者。"
 BOS.Caliphate: "£BOS_salafist_jihadism (El Mudžahid) - 波斯尼亚圣战者"
 BOS.Caliphate_desc: "（萨拉菲圣战主义） - 波斯尼亚圣战者\n\n在波斯尼亚战争期间，波斯尼亚圣战者将外国伊斯兰武装分子引入波斯尼亚和黑塞哥维那共和国军队。代顿协议后，该组织被解散，多名成员因战时暴行接受调查。它只有通过后来的伊斯兰叛乱才能重现江湖。"
 BOS.socialism: "£Bosnian_socialism (SDP BiH) - 社会民主党"
 BOS.socialism_desc: "（社会民主主义） - 社会民主党\n\n波黑社会民主党成立于1992年，是波黑共产主义联盟的继承者。该党倡导建立多民族公民国家、世俗政府、社会福利和欧洲一体化。尽管其支持者主要来自联邦的城市地区，但该党的竞选活动跨越了实体和民族界限。"
 BOS.Neutral_Libertarian: "£generic_Neutral_Libertarian_small (LDS) - 自由民主党"
 BOS.Neutral_Libertarian_desc: "（自由主义） - 自由民主党\n\n自由民主党成立于1990年，致力于促进公民自由、市场改革、世俗政府和多民族波斯尼亚国家。战后它仍然是一个小党，但在2000年初提供了一个既定的自由主义替代方案。"
 BOS.Nat_Fascism: "£Bosnian_Nat_Fascism (BPS) - 波斯尼亚爱国党"
 BOS.Nat_Fascism_desc: "（超民主主义） - 波斯尼亚爱国党\n\n波斯尼亚和黑塞哥维那共和国陆军前指挥官塞弗·哈利洛维奇于1996年创立了波斯尼亚爱国党。该党融合了波斯尼亚民族主义、退伍军人利益以及对建立更强大的波斯尼亚国家的支持。其最激进的支持者占据了战后政治中极端民族主义的边缘。"
 BOS.Nat_Populism: "£bosnia_hdz (HDZ BiH) - 克罗地亚民主联盟"
 BOS.Nat_Populism_desc: "（民族保守主义） - 克罗地亚民主联盟\n\n克罗地亚民主联盟成立于1990年，在战争期间及代顿协议后成为波黑克罗地亚族的主要代表政党。该党支持克罗地亚族政治代表权、权力下放的机构、保守的社会政策以及与克罗地亚的紧密关系。该党经常参与国家和联邦的执政联盟。"
 BOS.Nat_Autocracy: "£generic_Nat_Autocracy_small (OSBiH) - 波斯尼亚和黑塞哥维那武装力量"
 BOS.Nat_Autocracy_desc: "（军政府） - 波斯尼亚和黑塞哥维那武装力量\n\n波黑联邦和塞族共和国的军事机构于2005年合并，组建了统一的武装力量。该部队通常对文职机构和集体主席团负责。只有通过波黑后来的军政府道路，才有可能出现军政府。"
 BOT.liberalism: "£generic_liberalism_small (BAM) - 博茨瓦纳联盟运动"
 BOT.liberalism_desc: "（进步主义） - 博茨瓦纳联盟运动\n\n博茨瓦纳联盟运动是一个小型进步联盟，它将一些小型反对党聚集在同一面旗帜下，挑战博茨瓦纳民主党的统治地位。该联盟的竞选纲领包括廉洁政府、权力下放和更公平地分配钻石收入，并通过选举协议与博茨瓦纳国会党合作，将选区划分给双方。\n\n它的影响力主要依靠少数几个地方据点，而非全国范围，其领导层将建立联盟视为获得权力的唯一现实途径。该运动在它参与的任何合作中都处于从属地位，它对盟友的价值在于它能够争取到的选民基础。"
 BOT.liberalism_2017: "£BOT_liberalism_2017 (AP) - 进步联盟"
 BOT.liberalism_2017_icon: "£BOT_liberalism_2017"
 BOT.liberalism_2017_desc: "（社会自由主义） - 进步联盟\n\n进步联盟是一个中间派社会自由主义政党，由博茨瓦纳民主运动中追随恩达巴·加奥拉特的派系于2017年组建。该党主张廉洁政府、减少对钻石的依赖、促进私营部门就业、加强公民机构建设，并自诩为执政集团和传统左翼之外的技术官僚替代方案。\n\n该党隶属于民主变革联盟，为该联盟提供大量经济政策方面的专业知识。其影响力在于拥有城市职业选民，以及其作为社会民主党人和自由改革派之间桥梁的角色。"
 BOT.socialism: "£BOT_socialism (BNF) - 博茨瓦纳民族阵线"
 BOT.socialism_icon: "£BOT_socialism"
 BOT.socialism_desc: "（社会民主主义） - 博茨瓦纳民族阵线\n\n博茨瓦纳民族阵线是该国历史最悠久的反对党，也是社会民主左翼的支柱。该党曾明确奉行社会主义，如今则主张加强福利国家建设、加大对住房和就业的公共投资、重新分配矿产财富，并进行宪法改革以限制总统权力。其支持者包括工会成员、学生和城市选民，而其长期存在的派系分裂也塑造了整个反对派的格局。\n\n该党是民主变革联盟的最大成员，并为其提供领导层。在外交政策上，该党奉行不结盟路线，与西方伙伴保持密切联系，同时以务实的态度与中国和俄罗斯开展合作。"
 BOT.anarchist_communism: "£BOT_anarchist_communism (BPP) - 博茨瓦纳人民党"
 BOT.anarchist_communism_icon: "£BOT_anarchist_communism"
 BOT.anarchist_communism_desc: "（泛非洲主义） - 博茨瓦纳人民党\n\n博茨瓦纳人民党是一个民主社会主义和泛非主义政党，扎根于该国北部弗朗西斯敦和巴卡兰加社区周围。它致力于部落之间的平等、土地和矿产资源的国有化、工人权利以及结束茨瓦纳语中心地区的政治统治。\n\n该党是民主变革联盟的创始成员，并在该联盟下参与执政。其影响力源于其忠实的地区支持者群体，以及其自诩为边缘群体的历史代言人，这使其影响力远超其规模。"
 BOT.Neutral_conservatism: "£BOT_Neutral_conservatism (BDP) - 博茨瓦纳民主党(A组)"
 BOT.Neutral_conservatism_icon: "£BOT_Neutral_conservatism"
 BOT.Neutral_conservatism_desc: "（家长式保守主义） - 博茨瓦纳民主党\n\n博茨瓦纳民主党是一个包容各方的保守派政党，自独立以来一直执政，它将自由市场经济的正统理念、对钻石收入的谨慎管理、家长式的福利国家体制以及对传统权威的尊重相结合。该党的核心区域是讲塞茨瓦纳语的中部地区，其农村支持者则主要依靠酋长和国家庇护。\n\n围绕总统的“A组”派系掌控着党内机器，重视忠诚和纪律，而与之竞争的巴拉塔-帕蒂派系则力主内部民主。外交政策坚定地奉行西方路线，与美国保持着密切的安全联系，并享有“非洲民主典范”的美誉。"
 BOT.Neutral_conservatism_split: "£BOT_Neutral_conservatism (BDP) - 博茨瓦纳民主党"
 BOT.Neutral_conservatism_split_desc: "（家长式保守主义） - 博茨瓦纳民主党\n\n博茨瓦纳民主党是一个包容各方的保守派政党，自独立以来一直执政，它将自由市场经济的正统理念、对钻石收入的谨慎管理、家长式的福利国家体制以及对传统权威的尊重相结合。该党的核心区域是讲塞茨瓦纳语的中部地区，其农村支持者则主要依靠酋长和国家庇护。\n\n随着改革派爱党者的瓦解，该党团结在总统周围，其领导层几乎不容许任何异议。批评者称其为威权主义；支持者则指出其数十年来保持稳定。该党的外交政策坚定地奉行西方路线，与美国保持着密切的安全联系，并享有“非洲民主典范”的美誉。"
 BOT.Neutral_Libertarian: "£BOT_Neutral_conservatism (BDP) - 博茨瓦纳民主党(爱党者)"
 BOT.Neutral_Libertarian_icon: "£BOT_Neutral_conservatism"
 BOT.Neutral_Libertarian_desc: "（自由保守主义） - 博茨瓦纳民主党\n\n爱党者是执政的博茨瓦纳民主党内部的改革派。它认同党的保守经济政策，但要求党内民主，建立一个更强大的中央委员会来制衡总统，并限制行政部门对安全部门的使用。其力量主要来自资深干部和选区组织者，他们对“A组”掌控候选人遴选权感到不满。\n\n该派系在党的代表大会上展开斗争，大会决定中央委员会的控制权和候选人的遴选权。"
 BOT.Neutral_Libertarian_split: "£BOT_Neutral_Libertarian (BMD) - 博茨瓦纳民主运动"
 BOT.Neutral_Libertarian_split_icon: "£BOT_Neutral_Libertarian"
 BOT.Neutral_Libertarian_split_desc: "（自由主义） - 博茨瓦纳民主运动\n\n博茨瓦纳民主运动是一个自由主义政党，由博茨瓦纳民主党巴拉塔-帕蒂派系的成员于2010年组建。该派系成员因国内民主问题和行政权力日益增长而与总统决裂。该党主张通过宪法限制总统权力、对安全部门进行独立监督、建立市场经济和实行择优录用的公务员制度。\n\n该运动是民主变革联盟的创始成员，并将前执政党选民纳入反对派阵营。其影响力在于对国家内部运作的了解，以及左翼和执政党都未能完全掌控的中间派城市选民群体。"
 BOT.neutral_Social: "£BOT_neutral_Social (BCP) - 博茨瓦纳大会党"
 BOT.neutral_Social_icon: "£BOT_neutral_Social"
 BOT.neutral_Social_desc: "（社会民主主义） - 博茨瓦纳大会党\n\n博茨瓦纳大会党是一个温和的社会民主党，它由博茨瓦纳民族阵线发展而来，并将自身定位为执政党和老牌左翼之外的纪律严明、专业化的替代选择。该党的竞选纲领包括提供高质量的公共服务、反腐败、通过经济多元化创造就业机会以及建立一个比总统权力更大的议会。\n\n该党多年来吸收了多个较小的反对派团体，并曾加入和退出民主变革联盟，更倾向于按照自己的方式参与选举。其优势在于强大的组织、在城市和北部地区的支持，以及作为可信的执政替代方案的地位。"
 BOT.neutral_Social_UDC: "£BOT_neutral_Social_UDC (UDC) - 民主变革保护伞"
 BOT.neutral_Social_UDC_icon: "£BOT_neutral_Social_UDC"
 BOT.neutral_Social_UDC_desc: "（社会民主主义） - 民主变革保护伞\n\n民主变革保护伞是由反对党组成的联盟，成立于2012年，旨在通过在每个选区推出一名候选人来结束博茨瓦纳民主党的长期执政。其核心是博茨瓦纳民族阵线，博茨瓦纳民主运动、博茨瓦纳人民党、博茨瓦纳国会党、进步联盟和博茨瓦纳爱国阵线也曾多次加入该联盟。\n\n该联盟的竞选纲领包括扩大福利、重新分配矿产财富、进行宪法改革以及奉行不结盟外交政策。其优势在于反对党的团结，但这种团结十分脆弱，一旦出现席位分配或领导层纠纷，成员党就会退出。"
 BOT.Neutral_Communism: "£BOT_Neutral_Communism (ISBO) - 博茨瓦纳国际社会主义者"
 BOT.Neutral_Communism_icon: "£BOT_Neutral_Communism"
 BOT.Neutral_Communism_desc: "（托洛茨基主义） - 博茨瓦纳国际社会主义者\n\n博茨瓦纳国际社会主义者是一个小型托洛茨基主义团体，隶属于国际社会主义倾向，而非注册政党。该团体出版《自下而上的社会主义》报纸，在学生和矿工中开展组织活动，为被解雇的德布斯瓦纳公司员工争取权益，并反对将桑人强行从中央卡拉哈里野生动物保护区迁走。\n\n它既不承认执政党，也不承认议会反对派是资本主义的管理者，并呼吁工人进行自我组织和国际团结。它的影响力仅限于鼓动、罢工和校园活动，其影响力随着劳工动荡的起伏而起伏。"
 BOT.Nat_Populism: "£generic_Nat_Populism_small (BWF) - 博茨瓦纳工人阵线"
 BOT.Nat_Populism_desc: "（民族民粹主义） - 博茨瓦纳工人阵线\n\n博茨瓦纳工人阵线是一个小党，它因博茨瓦纳民族阵线对巴卡拉哈迪人和其他西南部少数族裔社区的边缘化而分裂出来。该党将镰刀锤子标志和劳工言论与基督教保守主义和民族主义相结合，要求获得土地权、矿业工作机会以及对八个主要茨瓦纳部落以外的人民的承认。\n\n该党在大部分时间里都处于休眠状态，除了创始人的家乡地区外，既没有席位，组织也十分薄弱。它的影响力在于一个大党未能解决的民怨：博茨瓦纳的民主典范形象与其少数族裔的实际处境之间存在着巨大的差距。"
 BOT.Nat_Autocracy: "£BOT_Nat_Autocracy (BDF) - 博茨瓦纳国防军"
 BOT.Nat_Autocracy_icon: "£BOT_Nat_Autocracy"
 BOT.Nat_Autocracy_desc: "（军政府） - 博茨瓦纳国防军\n\n博茨瓦纳国防军是该国统一的军队，是一支以陆军为主、规模较小的空军的专业化部队，直接向担任三军统帅的文职总统负责。其日常任务包括在北部边境开展反偷猎行动、救灾以及参与联合国和非洲联盟的维和行动。该部队与美国进行广泛的联合训练，并从西方供应商采购大部分装备。\n\n军队从未干预政治，但其前任指挥官却能轻易进入执政党领导层，甚至最终担任总统。军政府会利用这种威望，将自己塑造成对抗政治派系斗争、维护稳定的卫士。"
 BOT.Monarchist: "£generic_Monarchist_small (Dikgosi) - 酋长特别会议"
 BOT.Monarchist_desc: "（传统主义） - 酋长特别会议\n\n酋长特别会议是主要部落的咨询机构，由世袭酋长与选举产生和任命的酋长共同组成。该机构于2007年根据一项旨在保持部落中立的宪法修正案设立。酋长特别会议就习惯法、部落土地和宪法改革提供咨询，但没有立法权，许多酋长对这种将他们边缘化的制度感到不满。\n\n作为执政派别，酋长特别会议代表着酋长制回归国家中心，最高酋长凌驾于民选政府之上。其影响力源于博茨瓦纳农村居民仍然对其酋长的忠诚。"
 BRA.conservatism_icon: "£BRA_conservatism"
 BRA.liberalism: "£BRA_liberalism (PSDB) - 巴西社会民主党"
 BRA.liberalism_icon: "£BRA_liberalism"
 BRA.liberalism_desc: "（社会自由主义） - 巴西社会民主党\n\n巴西社会民主党是一个中间派政党，自称秉持“第三条道路”传统的社会民主主义，但其执政方式却以市场导向的改革派为主导，主张私有化、货币稳定、财政责任和国家现代化。该党是劳工党在总统选举中的主要竞争对手，并拒绝在任何层面上与其结成联盟。\n\n该党的优势在于其选举核心地圣保罗（也是州政府所在地）、米纳斯吉拉斯州以及城市中产阶级。它是中间民主国际的成员，并倾向于与美国和南方共同市场伙伴保持密切联系。"
 BRA.socialism: "£BRA_socialism (PDT) - 民主工党"
 BRA.socialism_icon: "£BRA_socialism"
 BRA.socialism_desc: "（民主社会主义）- 民主工党\n\n民主工党秉承巴西劳工主义的传统：民主社会主义、经济民族主义以及保护国家工业、公共教育和工人权益的发展型国家理念。它是社会党国际中唯一的巴西正式成员，并将自身定位为左翼劳工党之外的温和、主权主义替代选择。\n\n其势力范围是区域性的而非全国性的，主要集中在南里奥格兰德州、里约热内卢州和塞阿拉州，在这些州，该党掌控着州长、市长职位，并拥有一批忠实的工会支持者。在国会中，该党在支持和反对左翼政府之间摇摆不定，以选票换取部长职位和州级联盟。"
 BRA.Conservative: "£BRA_communism_Conservative (PRTB) - 巴西劳工复兴党"
 BRA.Conservative_icon: "£BRA_communism_Conservative"
 BRA.Conservative_desc: "（民族保守主义）- 巴西劳工复兴党\n\n巴西劳工复兴党是一个规模较小的右翼政党，它将社会保守主义和维护法律秩序的政治理念包裹在参与式劳工主义的外衣之下。该党反对堕胎和同性婚姻，要求军队在国家生活中发挥更大的作用，并将单轨铁路和高速铁路等民粹主义基础设施项目标榜为国家革新的象征。\n\n由于几乎没有民选官员，该组织的筹码在于向更大的保守派联盟提供候选人和电视广告时间，以及争取宗教右翼的抗议选票。在任何总统竞选中，它都坚定地支持最民族主义的候选人。"
 BRA.anarchist_communism: "£BRA_left_wing_radical (PT) - 劳工党"
 BRA.anarchist_communism_icon: "£BRA_left_wing_radical"
 BRA.anarchist_communism_desc: "（民主社会主义）- 工人党\n\n工人党是拉丁美洲最大的左翼政党，它起源于圣保罗工业带的金属工人工会、天主教基层社区和知识分子左翼。该党原则上主张民主社会主义，实践中则奉行再分配型社会民主主义：包括收入转移、提高最低工资、扩建公立大学以及在石油、银行和基础设施领域发挥强有力的国家作用。\n\n在外交政策上，它倾向于南方共同市场、南南合作以及对美国采取独立路线。它的影响力主要来自巴西全国工人统一工会、无地农民和住房运动，以及在东北部贫困人口中无可比拟的群众基础。"
 BRA.Neutral_conservatism: "£BRA_Neutral_conservatism (PHS) - 人文主义团结党"
 BRA.Neutral_conservatism_icon: "£BRA_Neutral_conservatism"
 BRA.Neutral_conservatism_desc: "（基督教民主主义）- 人文主义团结党\n\n人文主义团结党是一个小型基督教民主党，其政治理念基于团结主义、基督教人文主义和分配主义经济学，主张财产和企业应广泛分散，而非集中在国家或大型企业手中。该党捍卫家庭、宗教教育和辅助性原则，并致力于争取那些希望秉持道德保守主义但又不至于走向极端右翼的天主教和福音派选民的支持。\n\n由于其全国性政党数量很少，其影响力在于联盟的算计：它将自己的选票和电视时间借给更大的中右翼联盟，并且偶尔会通过支持强大的地方候选人来选举市长或州长。"
 BRA.oligarchism: "£BRA_MDB (PMDB) - 巴西民主运动党"
 BRA.oligarchism_desc: "（中间主义）- 巴西民主运动党\n\n巴西民主运动党是巴西中产阶级的典型代表：一个由地方领导人、市长和参议员组成的包罗万象的政党，除了紧跟权力之外，没有任何固定的意识形态。无论左翼还是右翼总统，该党都会加入其执政联盟，并将其席位转化为各部委、国有企业以及为其地方机器修改预算的渠道。\n\n它拥有的市长职位和州政府席位比任何其他政党都多，其参议员也掌控着大部分立法议程。它的影响力是实实在在的：没有它，国会就不可能获得多数席位；没有它的参与，任何改革都无法通过。"
 BRA.neutral_Social: "£BRA_neutral_Social (PPS) - 人民社会党"
 BRA.neutral_Social_icon: "£BRA_neutral_Social"
 BRA.neutral_Social_desc: "（社会民主主义）- 人民社会党\n\n人民社会党是巴西共产党主流派的继承者，该党放弃了马克思列宁主义，转而奉行民主、社会自由主义的改革路线。人民社会主义党捍卫议会制、联邦制、世俗主义和有管制的市场经济，并强烈批评工人党，指责其搞裙带关系，容忍国外的威权盟友。\n\n其基础是正在经历现代化变革的城市知识分子群体，在塞阿拉州和南里奥格兰德州拥有强大的影响力。由于其成员规模不大，该党的优势在于与中左翼和中间派建立联盟，为对抗工人党的联盟提供候选人和理念。"
 BRA.Neutral_Communism: "£BRA_Neutral_Communism (PSTU) - 统一工人社会党"
 BRA.Neutral_Communism_icon: "£BRA_Neutral_Communism"
 BRA.Neutral_Communism_desc: "（托洛茨基主义）- 统一工人社会党\n\n统一工人社会党是莫雷诺主义传统的托洛茨基主义政党，也是国际工人联盟中最大的派别。它呼吁建立工人政府，拒绝偿还公共债务，将银行和战略性产业国有化并置于工人控制之下，并与其所认为的工人党的阶级合作决裂。\n\n它不选举任何人，也不寻求任何联盟。它的影响力在于工会反对派（目前是工会和人民中心），在于学生和公共部门的罢工，以及利用免费电视时间攻击所有主流左翼候选人的总统竞选活动。"
 BRA.Neutral_green: "£BRA_Neutral_green (PV) - 绿党"
 BRA.Neutral_green_icon: "£BRA_Neutral_green"
 BRA.Neutral_green_desc: "（环保主义）- 绿党\n\n巴西绿党是巴西的环保政党，由前流亡者和记者创立，他们将保护亚马逊雨林与公民自由、权力下放、和平主义和大麻合法化联系起来。该党倡导可持续发展、可再生能源、原住民土地权利，并奉行以气候外交而非权力集团为基础的外交政策。\n\n作为全球绿党成员，该党的选票主要来自里约热内卢和圣保罗受过良好教育的城市中产阶级以及环保运动人士。当有知名人士代表该党参选时，该党便能在全国范围内获得支持。在国会中，该党的小部分议员的立场会根据政府的环境记录在左翼和中间派之间摇摆不定。"
 BRA.Nat_Autocracy: "£BRA_Nat_Autocracy (FFAA) - 巴西武装部队"
 BRA.Nat_Autocracy_icon: "£BRA_Nat_Autocracy"
 BRA.Nat_Autocracy_desc: "（军政府）- 巴西武装部队\n\n巴西武装部队作为统治集团，代表着军营式政府，其存在的理由是维护秩序，抵御腐败、共产主义和民众骚乱。其信条将陆军、海军和空军置于党派政治之上，并将宪法置于国家安全之下，各部委、国有企业和亚马逊边境地区均由军官掌控。\n\n在实践中，这意味着发展型经济、对犯罪和左翼势力采取强硬立场，以及奉行主权和不干涉主义的外交政策。其影响力源于军队作为国家最值得信赖的机构所拥有的威望，以及构成民族主义右翼力量的预备役军官。"
 BRA.Nat_Populism: "£BRA_Nat_Populism (PSL) - 社会自由党"
 BRA.Nat_Populism_icon: "£BRA_Nat_Populism"
 BRA.Nat_Populism_desc: "（右翼民粹主义）- 社会自由党\n\n社会自由党最初是一个规模较小的自由市场政党，后来发展成为巴西民族主义右翼的代表，它将经济自由主义与在犯罪、枪支拥有权、家庭价值观和反共等问题上的强硬立场相结合。该党抨击劳工党是一个腐败且危险的既得利益集团，并承诺带来秩序、美德和规模更小、更廉洁的国家。\n\n其基础涵盖福音派教会、安全部队、农业综合企业以及保守反主流文化的社交媒体网络。其影响力在于能够动员大规模抗议投票，并在传统中右翼阵营瓦解时左右总统选举结果。"
 BRA.Monarchist: "£BRA_Monarchist (Pró-Monarquia) - 拥护君主制运动"
 BRA.Monarchist_icon: "£BRA_Monarchist"
 BRA.Monarchist_desc: "（君主制）- 拥护君主制运动\n\n拥护君主制运动是一个民间协会，既是巴西皇室的秘书处，也是君主主义运动的组织中心。它致力于在奥尔良-布拉干萨家族的瓦苏拉斯分支领导下恢复议会君主制，认为超越党派的世袭国家元首将为巴西带来稳定、延续和道德中心。\n\n其成员包括传统天主教徒、保守派学生和帝国时代的拥护者，他们以地方团体的形式组织活动，例如举办纪念活动、讲座和社交媒体宣传。该组织没有议席，其影响力主要体现在文化层面：它使皇室家族继续活跃于公共生活，并将君主制符号借给民族主义右翼。"
 BRM.Neutral_Libertarian: "£BRM_Neutral_Libertarian 全国民主联盟"
 BRM.Neutral_Libertarian_desc: "自由主义派 - 全国民主联盟是一个自由派民主政党，由昂山素季在1988年8888起义后成立。全国民主联盟迅速成长为对军事统治的最大威胁。"
 BRM.neutral_Social: "£generic_neutral_Social_small 人民党"
 BRM.neutral_Social_desc: "民主社会主义 - 人民党是一个新的左翼政党，由经验丰富的亲民主活动家哥哥基创立。它是一个赞成更大的民主改革和建立联邦联盟以解决缅甸内战的政党。"
 BRM.Neutral_Communism: "£BRM_Neutral_Communism 国家统合党"
 BRM.Neutral_Communism_desc: "共产主义 - 国家统合党最初是作为军政府的选举工具成立的。然而，自从在1990年的议会选举中惨败给全国民主联盟后，它已经偏离其根源，成为最重要的反对党之一，即使不是成功的反对党。"
 BRM.Neutral_conservatism: "£generic_Neutral_conservatism_small 掸族民主联盟"
 BRM.Neutral_conservatism_desc: ""
 BRM.Nat_Autocracy: "£BRM_Nat_Autocracy 缅甸国防军"
 BRM.Nat_Autocracy_desc: "军政府-自1960年代以来，缅甸国防军一直是缅甸最有影响力的政治力量。民族叛乱，尤其是克伦族的叛乱，以及逃离内战的中国国民党军队占领缅甸领土，对独立后的缅甸提出了挑战，军方曾利用缅甸扩大其政治重要性并最终接管政府。然而，近几十年来，民主运动削弱了缅甸国防军的政治地位，迫使其考虑新的选择。"
 BRM.Nat_Populism: "£BRM_Nat_Populism 联邦巩固与发展党"
 BRM.Nat_Populism_desc: "右翼民粹主义派 - 联邦巩固与发展党成立于2010年，是亲军方政党。在继续支持缅甸国防军在政府中发挥作用的同时，联邦巩固与发展党表明自己比其前任对缅甸的政治变革更加开放。"
 BRM.Nat_Fascism: "£generic_Nat_Fascism_small 若开民族党"
 BRM.Nat_Fascism_desc: "法西斯派 - 若开民族党是若开民族发展党和若开民主联盟合并的结果。该党可能是缅甸最强大的民族政党，得到若开邦佛教徒的支持，并保护其利益。然而，该党对若开邦的罗兴亚穆斯林持强硬态度，导致一些外部观察员将该党贴上极右翼甚至法西斯的标签。"
