 terror.threat: "테러 위협"
 terror.1.t: "성공적인 기습 작전으로 인한 테러리스트 생포 및 사살"
 terror.1.d1: "오늘 이른 시간에 [ROOT.GetAdjective]측의 특수부대가 여러 명의 지하디스트 무장세력이 거주하는 아파트를 급습했습니다. 의외의 공격에 당황한 테러리스트들은 대부분, 작전 초반에 우리 군이 그들의 리더를 사살한 후 항복했습니다. 전문가들은 이 작전의 성공을 우리 군이 상대적으로 적은 대테러 훈련을 받은 것보다 유리한 상황 때문이라고 평가했습니다. 일부 지역 주민들은 작전의 폭력성에 분노하고 지하디스트들과 동조하지만, 대부분의 [ROOT.GetAdjective]인들은 그 성공에 긍정적으로 반응했습니다."
 terror.1.d2: "이른 아침에 [ROOT.GetAdjective] 특수부대가 여러 명의 지하디스트 무장단체가 거주하는 아파트를 급습했습니다. 짧은 총격전이 벌어지자 여러 명의 특수부대원이 부상을 입었지만, 살아남은 테러리스트들은 우리 군대에 항복했습니다. 전문가들은 이번 급습의 성공을 우리가 상당한 대테러 훈련을 받았기 때문이라고 분석하고 있습니다. 하지만, 우리 특수부대원들이 급습 중 저지른 몇 가지 실수는 진정한 엘리트 대테러 부대라면 저지르지 않았을 것이라고 지적되었습니다. 일부 지역 주민들은 급습의 폭력에 분노하고 지하디스트들에 동조했지만, 대부분의 [ROOT.GetAdjective]들은 이번 급습의 성공에 긍정적으로 반응했습니다."
 terror.1.d3: "오늘 이른 아침, [ROOT.GetAdjective] 특수부대가 여러 지하디스트 무장 대원을 은신시키고 있던 한 아파트를 급습했습니다. 짧은 총격전 끝에 모든 테러리스트는 사망하거나 체포되었으며, 공격 부대는 사상자를 내지 않았습니다. 전문가들은 이번 작전의 성공을 철저한 대테러 훈련을 받은 특수부대의 높은 수준 덕분으로 평가하고 있습니다. 일부 지역 주민들은 급습 과정에서 발생한 폭력에 분노하며 지하디스트들에게 동정심을 보이고 있지만, 대부분의 [ROOT.GetAdjective]들은 작전 성공에 긍정적으로 반응하고 있습니다."
 terror.1.a: "우리 치안 시스템이 제대로 효과를 발휘하는군!"
 terror.2.t: "실패한 대테러 공습의 후폭풍으로 사망한 무고한 시민들"
 terror.2.d1: "In the early hours of this morning [ROOT.GetAdjective] special forces raided an apartment housing several jihadist militants. However, the clumsy insertion of our operators alerted the terrorists, who promptly ambushed the attacking force, killing several operators before fleeing. Even worse, the terrorists detonated a bomb to cover their escape, killing multiple civilians who were caught up in the blast radius. Experts have criticized the lack of professionalism demonstrated by our forces, which is being viewed as directly responsible for this disastrous failure. The civilian deaths have provoked a significant backlash against the government, causing some to sympathize more with the jihadists' cause."
 terror.2.d2: "In the early hours of this morning [ROOT.GetAdjective] special forces raided an apartment housing several jihadist militants. Despite managing to enter the safehouse undetected, our operators encountered stiffer resistance than expected and took several casualties. While some of the jihadists were wounded and captured, the vast majority of the militants escaped unscathed. Moreover, multiple civilians were killed and wounded in the crossfire during the protracted gunfight. Experts have criticized the standard of our security services, as despite receiving some counter-terrorism training, our most elite operators cannot meet the same standards as their counterparts in other countries. The civilian deaths have provoked a significant backlash against the government, causing some to sympathize more with the jihadists' cause."
 terror.2.d3: "이른 아침 [ROOT.GetAdjective]의 특수부대가 여러 명의 이슬람 극단주의 무장세력을 수용한 아파트를 급습했습니다. 우리 보안 서비스의 뛰어난 수준에도 불구하고, 예상치 못한 수많은 시민들의 존재로 인해 우리의 작전 수행자들은 소수의 이슬람 극단주의자를 사살하거나 체포하지 못했습니다. 다수의 시민이 교전에 휘말려 사망한 비극적인 사건이 발생했는데, 대부분의 극단주의자들은 단거리 격전 끝에 무사히 탈출했습니다. 이로 인해 우리 작전 수행자들의 최선의 노력에도 불구하고, 일부 민간인들의 희생이 발생했습니다. 전문가들은 급습 과정에서 전문성을 유지한 특수부대의 능력을 칭찬했으며 민간인 피해를 최소화하기 위해 노력했습니다. 그러나 발생한 민간인 사망 사건으로 인해 정부에 대한 상당한 반발이 일어나, 일부는 극단주의자들의 입장에 공감하는 사람도 생겼습니다."
 terror.2.a: "지하드와 또 다시 결전을 치뤄야한다…"
 terror.3.t: "테러 계획를 잡아낸 정보 기관"
 terror.3.d: "우리 정보 기관이 찾아낸 정보를 통해서, [ROOT.GetAdjective] 경찰들은 테러 공격을 준비하고 있었던 여러 지하디스트들을 체포했습니다. 만약 공격이 계획대로 감행되었다면, 수많은 사람들이 죽거나 다쳤을 것이며 더 많은 극단주의자들을 테러로 끌어들였을 것입니다."
 terror.3.a: "우리는 재난을 피했다!"
 terror.4.t: "지하디스트의 집중 공격으로 인해 수많은 민간인 사상자 발생"
 terror.4.d1a: "지하디스트 무장 세력이 감행한 총기와 폭탄 공격으로 인해 정부 청사에서 수십 명의 민간인과 여러 경찰관이 목숨을 잃었습니다. [ROOT.GetAdjective] 보안 당국은 이번 공격을 사전에 막지 못한 점과 이후 부실한 대응으로 인해 비판을 받고 있습니다. 대테러 훈련의 부족으로 인해 보안군은 민간인을 제대로 보호하지 못했을 뿐 아니라, 때로는 민간인 사망에 직접적으로 기여하기도 했습니다. 정부의 이번 공격 대응 실패와 공격의 성공은 대중의 정부에 대한 불만을 더욱 심화시키며, 급진 이슬람주의자들에 대한 지지를 증가시키고 있습니다."
 terror.4.d1b: "지하디스트 무장 세력이 감행한 심각한 폭탄 공격으로 정부 청사에서 10여 명의 민간인이 사망했습니다. [ROOT.GetAdjective] 보안군은 추가 희생을 막았으며, 공격이 시작된 지 몇 시간 만에 대부분의 공격자를 사살하거나 체포하는 데 성공했습니다. 그럼에도 불구하고 일부는 보안 당국이 더 신속히 대응하지 못한 점을 비판하고 있습니다. 이는 기존에 존재하던 [ROOT.GetAdjective] 정부에 대한 불만을 부추겼으며, 이번 공격은 급진적 근본주의자들을 더욱 결집시키는 계기가 되었습니다."
 terror.4.d1c: "여러 명의 이슬람 극단주의자들이 차량 폭탄으로 [ROOT.GetAdjective]측 정부 건물을 공격하려 시도했으나, 그들이 목표지점에 도달하기 전에 보안 요원들에 의해 막혔습니다. 폭발 전 대부분의 시민들은 주위 지역이 대부분 비워지도록 보안 요원들에 의해 대피시켜졌지만, 폭발로 인해 몇 명이 중상을 입어 현재 위중한 상태입니다. 대부분의 [ROOT.GetAdjective]들은/는 [ROOT.GetAdjective]측의 보안 요원들의 전문적인 대응에 대해 칭찬했으나, 이러한 공격이 진행될 수 있었다는 사실은 일부 이슬람 극단주의자들에게 더욱 대담해지게 했습니다."
 terror.4.d2a: "이슬람 극단주의 무장단원들에 의한 잔인한 총기와 폭탄 공격으로 수십 명의 시민과 여러 명의 경찰관이 사망한 사건이 발생했습니다. [ROOT.GetAdjective]측 안보 기관은 이 공격을 막지 못한데 대해 비난을 받고 있으며, 또한 무력한 대응으로 인해 비난받고 있습니다. 엄격한 대테러 훈련 부족으로 인해 보안군들은 민간인들을 충분히 보호할 수 없었으며 때로는 민간인들의 사망에 직접적으로 기여하기도 했습니다. 정부의 이 사건 처리 실패와 공격 자체의 성공으로 인해 대중의 정부에 대한 의견이 단호해지고 이슬람 극단주의자들에 대한 지지가 증가했습니다."
 terror.4.d2b: "지하디스트 무장 세력이 감행한 폭탄 공격으로 시아파 모스크에서 10여 명의 민간인이 사망했습니다. [ROOT.GetAdjective] 보안군은 추가 희생을 막았으며, 공격이 시작된 지 몇 시간 만에 대부분의 공격자를 사살하거나 체포하는 데 성공했습니다. 그럼에도 불구하고 일부는 보안 당국이 더 신속히 대응하지 못한 점을 비판하고 있습니다. 이는 기존에 존재하던 [ROOT.GetAdjective] 정부에 대한 불만을 더욱 부추겼으며, 이번 공격은 급진적 근본주의자들을 더욱 결집시키는 계기가 되었습니다."
 terror.4.d2c: "이슬람 극단주의자들 몇 명이 차량 폭탄을 이용해 시아파 모스크를 공격하려 했으나, 경찰이 그들의 목표에 도달하기 전에 방어했습니다. 경찰은 폭탄이 폭발하기 전 대부분의 주변 지역에서 민간인들을 대부분 대피시키지만, 여러 명이 폭발로 부상을 입어 위중한 상태입니다. 대부분의 [ROOT.GetAdjective] 사람들은 [ROOT.GetAdjective] 안전 당국의 전문성을 칭찬하지만, 이번 공격이 성사되었다는 사실은 이슬람 극단주의자들의 용기를 불러일으켰습니다."
 terror.4.d3a: "지하디스트 무장 세력이 감행한 총기와 폭탄 공격으로 교회에서 수십 명의 민간인과 여러 경찰관이 목숨을 잃었습니다. [ROOT.GetAdjective] 보안 당국은 이번 공격을 사전에 막지 못한 점과 이후 부실한 대응으로 인해 비판을 받고 있습니다. 대테러 훈련의 부족으로 인해 보안군은 민간인을 제대로 보호하지 못했을 뿐 아니라, 때로는 민간인 사망에 직접적으로 기여하기도 했습니다. 정부의 이번 공격 대응 실패와 공격의 성공은 대중의 정부에 대한 불만을 더욱 심화시키며, 급진 이슬람주의자들에 대한 지지를 증가시키고 있습니다."
 terror.4.d3b: "지하디스트 무장 세력이 감행한 심각한 폭탄 공격으로 교회에서 10여 명의 민간인이 사망했습니다. [ROOT.GetAdjective] 보안군은 추가 희생을 막았으며, 공격이 시작된 지 몇 시간 만에 대부분의 공격자를 사살하거나 체포하는 데 성공했습니다. 그럼에도 불구하고 일부는 보안 당국이 더 신속히 대응하지 못한 점을 비판하고 있습니다. 이는 기존에 존재하던 [ROOT.GetAdjective] 정부에 대한 불만을 부추겼으며, 이번 공격은 급진적 근본주의자들을 더욱 결집시키는 계기가 되었습니다."
 terror.4.d3c: "여러 명의 지하디스트들이 자동차 폭탄으로 교회를 공격하려 했으나, 목표지점에 도달하기 전에 보안군에 의해 저지되었습니다. 보안군은 폭탄이 폭발하기 전에 주변 지역의 민간인들을 대부분 대피시킬 수 있었으나, 폭발로 여러 명이 부상을 입었고 현재 중태에 있습니다. 대부분의 [ROOT.GetAdjective]들이 [ROOT.GetAdjective] 보안군의 대응 전문성을 칭찬했으나, 이번 공격이 실행될 수 있었던 사실은 일부 이슬람 극단주의자들을 더욱 대담하게 만들었습니다."
 terror.4.a: "우리는 그들을 어떻게든 소탕할 것이다…"
 terror.5.t: "지역 경찰대를 기습한 지하디스트"
 terror.5.d1: "Radical Islamist militants have launched a devastating attack on a [ROOT.GetAdjective] army patrol, wiping out the majority of the soldiers who were caught entirely by surprise. The lack of training that our troops have received in counter-insurgency warfare meant that they were easy prey for the guerrilla tactics of the jihadists, who escaped largely unscathed. Word of the attack has spread throughout [ROOT.GetNameDef], reducing confidence in the government's ability to provide security and raising the profile of the jihadists, who some are beginning to see as a more effective fighting force than our army."
 terror.5.d2: "급진 이슬람 무장세력들이 [ROOT.GetAdjective] 군 순찰대에 공격을 감행하여, 치열한 총격전 끝에 10명 이상의 군인이 사망했습니다. 우리 군은 상당한 피해를 피할 만큼 충분히 훈련을 받았으나, 지하디스트들이 후퇴한 후 반격을 감행할 자신이 없었습니다. 공격 소식은 [ROOT.GetNameDef] 전역에 퍼졌고, 정부의 안보 제공 능력에 대한 신뢰를 약화시키며, 일부는 지하디스트들을 효과적인 전투력으로 보기 시작했습니다."
 terror.5.d3: "급진 이슬람 무장세력들이 [ROOT.GetAdjective] 군 순찰대에 공격을 감행했으나, 빠르게 물리쳐졌고, 많은 피해를 입었습니다. 우리 군은 고도로 훈련되어 있어 지하디스트들과 충분히 맞설 수 있었고, 피해는 몇 명에 불과했습니다. 공격 소식은 [ROOT.GetNameDef] 전역에 퍼졌고, 우리 보안군의 성공적인 대응은 긍정적으로 받아들여졌지만, 공격의 대담함은 일부 정부 반대자들을 지하디스트 대의로 이끌었습니다."
 terror.5.a: "그들은 우리 군의 희생에 대한 대가를 치뤄야할 것이다!"
 terror.6.t: "[FROM.GetNameDef]의 지하드 집단에 의해 사살된 외국인 집단"
 terror.6.d1: "외국인 노동자들의 주거 단지에 감행된 지하디스트들의 총격과 폭격으로 인해 수십 명의 사상자가 발생하였습니다. 들리는 소문에 의하면, 주거지를 방어하라는 명령을 받은 [FROM.GetAdjective] 방위군은 중무장한 군대가 도착하자마자 그들의 위치를 버리고 달아나 버렸으며, 외국인들과 그 가족들이 극단주의자들에 의해 학살되도록 내버려 뒀다고 합니다. [FROM.GetAdjective]의 실패는 [FROM.GetAdjective] 방위군이 매우 낮은 수준의 대태러 훈련을 받은 결과라고 보여지고 있습니다. 이 테러는 국제 사회를 충격에 빠트렸고 이와 동시에 급진적 이슬람주의자들은 전 지역에 걸쳐 날뛰고 있습니다. \n\n[FROM.GetAdjective]의 지도자, [FROM.GetLeader]는 피해자들과 그들의 가족들에게 애도를 표하였고, 또한 [FROM.GetNameDef]의 극단주의자 군대를 공격할 수 있는 방안을 마련하고, 이 테러의 가해자들이 정의의 심판을 받도록 하겠다며 약속하였습니다."
 terror.6.d2: "Tens of people have been killed or wounded following a jihadist gun and bomb attack on a housing complex for expatriate workers. [FROM.GetAdjective] security forces tasked with defending the complex reportedly managed to buy some time for civilians to be evacuated, but were eventually overwhelmed by the attackers. The inability of the security forces to perform better has been attributed to the limited level of counter-terrorism training they have received. The attack has shocked the international community while encouraging radical Islamists across the region.\n\nThe [FROM.GetAdjective] leader, [FROM.GetLeader], has expressed condolences to the victims and their families, and has promised to step up measures to combat extremist militants in [FROM.GetNameDef] and bring the perpetrators of this attack to justice."
 terror.6.d3: "외국인 노동자들의 주거 단지에 감행된 지하디스트들의 총격과 폭격으로 인해 소수의 사상자가 발생하였습니다. 들리는 소문에 의하면, 주거지를 방어하라는 명령을 받은 [FROM.GetAdjective]의 방위군은 길어지는 총격전에도 불구하고 그들을 막아내었습니다. 그러나 혼돈 속에서 몇 명의 시민들이 불행하게도 적군에게 포착되고 말았습니다. 비교적 성공적이었던 [FROM.GetAdjective] 방위군의 작전은 그들이 받은 높은 수준의 대태러 훈련에서 부터 비롯되었다고 여겨집니다. 이 테러는 국제 사회를 충격에 빠트렸고 이와 동시에 급진적 이슬람주의자들을 더욱 부추기고 있습니다. \n\n[FROM.GetAdjective]의 지도자, [FROM.GetLeader]는 피해자들과 그들의 가족들에게 애도를 표하였고, 또한 [FROM.GetNameDef]의 극단주의자 군대를 공격할 수 있는 방안을 마련하고, 이 테러의 가해자들이 정의의 심판을 받도록 하겠다며 약속하였습니다."
 terror.6.a: "테러 행위는 인류에게 재앙과 같은 것이다..."
 terror.6.b: "이슬람 적들에 대한 또 한번의 일격이다!"
 terror.6.c: "우리 국민들의 목숨을 앗아갔다..."
 terror.7.t: "대담한 공습으로 해외 군사 기지를 공격한 지하디스트"
 terror.7.d1: "이슬람 극단주의자들의 공격으로 [FROM.GetNameDef]에 주둔 중이던 수백 명의 외국군이 사망하거나 부상을 입었습니다. 소형 무기, 로켓 추진 수류탄, 심지어 일부 장갑 차량으로 무장한 무장 세력은 철수하기 전 기지에 큰 피해를 입혔습니다. 높은 사상자 비율은 [FROM.GetAdjective] 군대의 부진한 대응 탓으로 돌려지고 있습니다. 이들은 기지에 닥칠 위협을 경고하지 않았고, 지원 요청에도 불구하고 별다른 조치를 취하지 않았습니다. [FROM.GetAdjective] 군대는 상대적으로 낮은 수준의 대테러 훈련을 받고 있는 것으로 알려져 있으며, 이는 그들의 비효율성을 설명하는 주요 요인으로 여겨지고 있습니다."
 terror.7.d2: "이슬람 극단주의자들의 공격으로 인해 [FROM.GetNameDef]에 주둔한 외국군 대원들이 대거 사망하거나 부상했습니다. 소총, 로켓 추진 방식의 수류탄, 일부 방탄 차량 등으로 무장한 극단주의자들은 기지에 중간 정도의 피해를 입히고 후퇴했습니다. 공격 초기 단계에서 대부분의 피해가 발생했으며, [FROM.GetAdjective] 추가 군력의 도착으로 극단주의자들은 더 많은 피해를 입히기 전에 철수해야 했습니다. [FROM.GetAdjective] 안보군력은 테러리즘에 대한 대응에서 일정한 효과를 발휘했지만, 국제적인 카운터테러 부대 수준에는 미치지 못합니다."
 terror.7.d3: "이슬람 극단주의자들의 공격으로 [FROM.GetNameDef]에 주둔 중인 수십 명의 외국군이 사망하거나 부상을 입었습니다. 소형 무기, 로켓 추진 수류탄, 심지어 일부 장갑 차량으로 무장한 무장 세력은 기지에 가벼운 피해를 입힌 후 [FROM.GetAdjective] 증원군에 의해 격퇴되었습니다. [FROM.GetAdjective] 보안군은 빠르고 효율적인 대응으로 공격의 파괴력을 최소화하는 데 도움을 주었다는 찬사를 받고 있습니다. [FROM.GetAdjective] 부대는 상대적으로 높은 수준의 대테러 훈련을 받고 있으며, 그 덕분에 이 지역에서 가장 효과적인 대테러 부대 중 하나로 평가받고 있습니다."
 terror.8.t: "[FROM.GetAdjective] 국경을 넘어 [ROOT.GetNameDef](으)로 잠입한 지하디스트 집단"
 terror.8.d: "우리 방어의 틈을 이용하여, [FROM.GetAdjective] 지하디스트들이 [ROOT.GetNameDef]로 침입했습니다. 그들의 의도는 거의 확실히 적대적이며, 그들이 초래하는 위협을 해결하기 위해 우리의 내부 보안 서비스는 이미 이 외국 무장세력들을 추적하기 시작했습니다. 앞으로 [FROM.GetAdjective] 국경에 더 많은 군을 배치하는 것이 이와 같은 사건의 재발 위험을 줄이는 데 도움이 될 것입니다."
 terror.8.a: "그들을 꼭 잡아내기를 바란다..."
 terror.9.t: "성공적으로 검거된 해외 지하디스트 집단!"
 terror.9.d: "완벽하게 실행된 작전 덕분에, [ROOT.GetAdjective] 특수부대는 최근 우리 나라에 침입한 외국 지하디스트들을 모두 처치하거나 체포하는 임무에 성공했습니다. 만약 작전이 실패했다면, [ROOT.GetNameDef]는 불가피한 공격에 대비해야 했을 것입니다."
 terror.9.a: "테러리스트는 이제 [ROOT.GetNameDef]에게 아무런 위협이 되지 않는다!"
 terror.10.t: "국경을 넘어 잠입한 해외 지하디스트 집단의 검거!"
 terror.10.d: "유감스럽게도 최근 국경을 넘어온 이슬람 극단주의자를 죽이거나 잡기 위해 파견된 부대는 임무를 수행하지 못했습니다. 우리 군은 이슬람 극단주의자들을 발견하고 공격했지만, 그들을 방지하지 못하고 대부분 무사히 도망쳐버렸습니다. 이제 이 극단주의자들은 국내에서 테러 공격을 수행할 수 있습니다. 한편, 우리는 안보 기관 내에서 반테러 훈련을 실시하여 앞으로 이와 같은 실패를 줄이도록 노력해야 합니다."
 terror.10.a: "이제 그들이 공격하는 것은 시간 문제다..."
 terror.11.t: "정보 기관의 노력으로 성공적으로 발견된 해외 지하디스트 본부!"
 terror.11.d: "The [ROOT.GetAdjective] internal security services have, following a massive investment of time and resources, managed to pinpoint the exact location of the foreign jihadists who recently crossed the border into [ROOT.GetNameDef]. Special forces will now be deployed to kill or capture the militants before they can carry out an attack on our territory."
 terror.11.a: "그들을 잡아낼 수 있기를 바란다..."
 terror.12.t: "[ROOT.GetNameDef] 내부 지하디스트 반란의 전조"
 terror.12.d: "보도에 따르면, [ROOT.GetNameDef]의 지하디스트 무장세력들이 정부를 전복시키기 위한 대규모 무장 봉기를 준비하고 있다고 합니다. 이 증가하는 위협을 무시한다면, [ROOT.GetNameDef]는 곧 내전의 소용돌이에 휘말릴 것입니다."
 terror.12.a: "우리는 조치를 취해야 한다…"
 terror.14.t: "잠정적으로 소멸된 하디스트 반란 위협 "
 terror.14.d: "우리 최근 반테러 작전은 규모가 큰 반란이 더 이상 임박하지 않을 정도로 이슈를 감소시키는 데 성공했다."
 terror.14.a: "다시금 안정을 취할 수 있겠군."
 terror.15.t: "성공적인 공습으로 사살된 테러리스트"
 terror.15.d1: "Earlier today [ROOT.GetAdjective] aircraft managed to locate and destroy several jihadist hideouts located in rural areas. Caught by surprise, the terrorists were reportedly unprepared for the raid and were almost completely wiped out by the strike. Experts have attributed the success of this raid to the complacency of the jihadists and favorable weather conditions rather than the effectiveness of our pilots, who have received relatively little counter-terrorism training. Some local residents have been angered by the destructiveness of the strike and sympathize with the jihadists, but other [ROOT.GetAdjective]s have reacted positively to its success."
 terror.15.d2: "Earlier today [ROOT.GetAdjective] aircraft managed to locate and destroy several jihadist hideouts located in rural areas. While the raid took longer than expected due to the quick response of the jihadist militants to the attack, our pilots eventually managed to locate and eliminate all of their targets. Experts have attributed the success of this raid to the preparedness of our pilots, who have received substantial counter-terrorism training. However, it has been pointed out that some mistakes made by our pilots during the raid would not have been made by a truly elite counter-terrorism force. Some local residents have been angered by the destructiveness of the strike and sympathize with the jihadists, but other [ROOT.GetAdjective]s have reacted positively to its success."
 terror.15.d3: "Earlier today [ROOT.GetAdjective] aircraft managed to locate and destroy several jihadist hideouts located in rural areas. The operation was quickly concluded despite the formidable capabilities of the jihadist militants. Experts have attributed the success of this strike to the expertise of our pilots, who have received rigorous counter-terrorism training. Some local residents have been angered by the destructiveness of the strike and sympathize with the jihadists, but other [ROOT.GetAdjective]s have reacted positively to its success."
 terror.15.a: "우리 자랑스런 파일럿들의 작품이다!"
 terror.16.t: "실패한 공습으로 인한 민간인 사상자 발생"
 terror.16.d1: "Earlier today [ROOT.GetAdjective] aircraft attempted to locate and destroy several jihadist hideouts located in rural areas. However, the inexperience of our pilots led to the mistaken targeting of a [ROOT.GetAdjective] village, resulting in the killing and wounding of dozens of civilians. Experts have criticized the lack of professionalism demonstrated by our pilots, which is being viewed as directly responsible for this disastrous failure. The civilian deaths have provoked a significant backlash against the government, causing many to sympathize more with the jihadists' cause."
 terror.16.d2: "Earlier today [ROOT.GetAdjective] aircraft attempted to locate and destroy several jihadist hideouts located in rural areas. However, a combination of poor weather conditions and lack of expertise led to the mistaken targeting of a [ROOT.GetAdjective] village, resulting in the killing and wounding of dozens of civilians. Experts have criticized the standard of our pilots, as despite receiving some counter-terrorism training, our most highly trained pilots cannot meet the same standards as their counterparts in other countries. The civilian deaths have provoked a significant backlash against the government, causing many to sympathize more with the jihadists' cause."
 terror.16.d3: "오늘 아침, [ROOT.GetAdjective]의 항공기가 은둔 지역에 위치한 여러 지하디스트 은신처들의 표적 및 파괴를 시도하였습니다. 그러나, 예측할 수 없는 일련의 사건들이 발생하면서, [ROOT.GetAdjective]의 민간 지역이 표적으로 잡히며 수십 명의 민간인들이 죽거나 다치는 일이 발생하였습니다. 이 사건에 대해, 전문가들은 공습 중에도 프로페셔널함을 유지하고, 표적의 결함을 알아차렸을 때 최대한 민간 사상자가 발생하지 않도록 최선을 다한 우리 조종사들을 칭찬하였습니다. 그럼에도 불구하고, 민간 사상자의 발생했다는 사실은 정부에 큰 반발을 불러 일으켰으며, 지하디스트들을 동정하는 여론이 더욱 커지게 되었습니다."
 terror.16.a: "지하드와 또 다시 결전을 치뤄야할 것이다…"
 gulf.5.t: "[fossil_fuel_industry_name] 기업 상장"
 gulf.5.d: "[FROM.GetAdjective] 국가의 수익성 높은 석유 회사에 대한 오랫동안 기다려 온 기업공개(IPO)가 [FROM.GetLeader]에 의해 공식 발표되었습니다. 이 위험한 사업의 성공 여부는 아직 알 수 없으며, 일부 분석가들은 이번 IPO에 대한 투자자들의 관심이 제한적일 것으로 전망하고 있습니다. [FROM.GetAdjective] 정부는 이러한 전망을 일축하고, 불확실한 시기에 신뢰를 유지하고자 국내외 투자자들에게 주식 매입을 촉구했습니다."
 gulf.5.a: "오늘은 [FROM.GetNameDef]의 날이다!"
 gulf.7.t: "[fossil_fuel_industry_name] 기업의 대호황"
 gulf.7.d: "[fossil_fuel_industry_name]에 대한 투자자 신뢰가 상당히 높았던 덕분에 우리의 IPO는 막대한 자금을 모았으며, 국내외에서 정부의 평판이 크게 높아졌습니다. 더욱 중요한 것은, 모금된 자금이 우리 국부 펀드에 절실히 필요했던 자본을 제공했다는 점입니다."
 gulf.7.a: "완벽하다!"
 gulf.8.t: "[fossil_fuel_industry_name] 기업의 실패"
 gulf.8.d: "[fossil_fuel_industry_name]에 대한 투자자 신뢰가 낮았던 탓에 우리의 IPO는 상당한 자금을 모으지 못했으며, 국내외에서 정부의 평판이 손상되었습니다. 이러한 실패는 우리 국부 펀드에 출연할 자산이 상대적으로 적다는 것을 의미합니다."
 gulf.8.a: "최악의 날이다..."
 gulf.9.t: "새로운 [FROM.GetAdjective] 정부의 이념적 친선 요청"
 gulf.9.d: "[FROM.GetNameDef] 정부의 급진적인 변화 이후, 그 나라의 새 지도부는 우리 정부와 이념적으로 긴밀한 관계를 맺고 있습니다. 그 나라의 지도자 [FROM.GetLeader]은(는) 두 나라 사이에 긴밀한 군사 파트너십을 맺자는 제안을 조용히 전해 왔습니다. 이 특별한 제안을 수락할지 거절할지 결정해야 합니다."
 gulf.9.a: "형제들이여!"
 gulf.9.b: "이런 동맹은 필요하지 않다."
 gulf.10.t: "성사된 형제의 동맹!"
 gulf.10.d: "우리나라와 [FROM.GetNameDef](은)는 이제 끊을 수 없는 친선 관계를 함께하게 되었습니다!"
 gulf.10.a: "실로 경축할 일이다!"
 gulf.11.t: "우리의 요청 거부"
 gulf.11.d: "[FROM.GetNameDef] 정부는 동맹을 맺자는 우리의 제안에 답변하는 최소한의 예의조차 보이지 않았습니다."
 gulf.11.a: "다른 동맹국을 찾아보자..."
 gulf.12.t: "우리의 주권을 위협하는 [FROM.GetAdjective]의 민족통일주의"
 gulf.12.d: "[FROM.GetAdjective] 정부에 큰 변화가 생긴 후, 그 나라의 새 지도자 [FROM.GetLeader]이(가) 정당하게 우리 것인 영토에 대한 [FROM.GetNameDef]의 영유권 주장을 되살리는 연설을 했습니다. 많은 [ROOT.GetAdjective] 국민들은 이 연설이 [FROM.GetAdjective]이(가) 무력으로 우리 영토를 병합하려는 시도의 서막이 아닐까 우려하고 있습니다."
 gulf.12.a: "우리는 이 선언을 비판해야만 한다!"
 gulf.12.b: "공격이 먼저이다!"
 gulf.13.t: "[FROM.GetNameDef]의 설립"
 gulf.13.d: "불과 몇 년 전만 해도 지금은 공식적으로 [FROM.GetNameDef](으)로 알려진 이 나라는 억압적인 군주국이었습니다. 이후 이 나라는 큰 변화를 겪었고, 군주제는 정치에서 한 발 물러나 완전한 민주적 선거에 자리를 내주었습니다. 이제 [FROM.GetLeader] 정부는 한 걸음 더 나아가 [FROM.GetAdjective] 군주제의 해체를 발표하여 외부 관측통 다수를 놀라게 했습니다."
 gulf.13.a: "공화당의 승리이다."
 gulf.14.t: "터키와 [FROM.GetNameDef] 간의 고위급 정상회담"
 gulf.14.d: "최근 몇 주간의 비공개 협상 이후, 터키의 대통령 [TUR.GetLeader](은)는 협상단 대표인, [FROM.GetLeader](을)를 만나기 위해 [FROM.GetNameDef]에 도착하였습니다. 많은 이들이 오늘 정상 회담은 [FROM.GetAdjective]-터키 간 협력의 첫걸음이 될 것이라 보고 있으며, 이를 통해 중동아시아의 상당한 지정학적 변화를 예고하고 또한 터키의 주변 영향력을 확대시킬 수 있는 기회가 될 것이라 예상하고 있습니다."
 gulf.14.a: "권력의 체계가 변하고 있다."
 gulf.15.t: "터키 외교정책을 비난하는 [FROM.GetLeader]"
 gulf.15.d: "Amid a notable increase in Turkish activity in the Middle East, the leader of [FROM.GetNameDef] has lambasted Turkish \"meddling\" and \"interference\" in the affairs of Arab states. [FROM.GetLeader] accused Turkey of seeking to \"revive the Ottoman Empire\" through its actions, drawing a hostile response from [TUR.GetLeader]. World leaders, including [USA.GetLeader] and [SOV.GetLeader], have called on both sides to exercise restraint and preserve regional stability."
 gulf.15.a: "터키의 야망은 벽에 부딪혔습니다.."
 gulf.16.t: "시리아의 정권 변화를 불러일으키는 [FROM.GetAdjective]의 영향력"
 gulf.16.d: "[FROM.GetLeader]이(가) [SYR.GetLeader]을(를) 축출하기 위한 연합에 대한 우리의 지지를 요청했습니다. 시리아의 정권 교체를 추구하면 우리의 이익에 더 부합하는 정부가 들어설 수 있겠지만, 그러한 조치가 국제적, 국내적으로 미칠 파장을 고려해야 합니다."
 gulf.16.a: "독재자를 끌어내릴 시간이다!"
 gulf.16.b: "위험이 너무 크다."
 gulf.17.t: "반-아사드 연합의 지원을 거부한 [USA.GetLeader]!"
 gulf.17.d: "미국은 시리아 국민의 의견보다 러시아 정부의 견해를 우선시한 것이 분명하며, 시리아에 대한 인도적 개입을 요청한 우리의 제안을 거절했습니다."
 gulf.17.a: "어쩔 수 없다. 우리 스스로 모든걸 해결하자!"
 gulf.17.b: "지금 이 상태로는 우리 스스로 작전을 수행할 수 없다..."
 gulf.18.t: "시리아에서의 작전을 시작한 국제 연합"
 gulf.18.d: "[USA.GetLeader]은(는) 오늘 시리아 민간인 보호를 위한 논란의 다자간 작전인 결정적 수호자 작전의 개시를 발표했습니다. 여러 NATO 및 아랍 연맹 회원국이 미국 주도의 연합에 병력을 제공했으며, 이 연합은 걸프 군주국들의 집요한 로비 활동 끝에 결성된 것으로 알려졌습니다. [USA.GetLeader]은(는) 이번 작전의 우선순위가 정권 교체가 아닌 민간인 보호라고 주장해 왔지만, 대부분의 분석가들은 민간인 보호 임무를 아사드 제거를 위한 얄팍한 명분으로 보고 있습니다. 비판자들은 이 연합이 자신들의 행동을 정당화할 안전보장이사회 결의 없이 움직이고 있어 이번 작전이 국제법상 불법이라는 우려를 제기했습니다. 러시아와 중국 등은 [SYR.GetLeader]을(를) 지지하며 이번 작전을 시리아 주권 침해라고 규탄했습니다. 게다가 시리아에 러시아군이 주둔하고 있어, 결정적 수호자 작전이 러시아군과 NATO군 간의 충돌로 이어질 수 있다는 우려도 커졌습니다."
 gulf.18.d_NATO_only: "[USA.GetLeader]은(는) 오늘 시리아 민간인 보호를 위한 논란의 다자간 작전인 결정적 수호자 작전의 개시를 발표했습니다. 여러 NATO 회원국이 미국 주도의 연합에 병력을 제공했으며, 이 연합은 걸프 군주국들의 집요한 로비 활동 끝에 결성된 것으로 알려졌습니다. [USA.GetLeader]은(는) 이번 작전의 우선순위가 정권 교체가 아닌 민간인 보호라고 주장해 왔지만, 대부분의 분석가들은 민간인 보호 임무를 아사드 제거를 위한 얄팍한 명분으로 보고 있습니다. 비판자들은 이 연합이 자신들의 행동을 정당화할 안전보장이사회 결의 없이 움직이고 있어 이번 작전이 국제법상 불법이라는 우려를 제기했습니다. 러시아와 중국 등은 이번 작전을 시리아 주권 침해라며 강하게 규탄했습니다. 게다가 시리아에 러시아군이 주둔하고 있어, 결정적 수호자 작전이 러시아군과 NATO군 간의 충돌로 이어질 수 있다는 우려도 커졌습니다."
 gulf.18.a: "인간의 권리는 무슨일이 있어도 지켜져야 한다!"
 gulf.18.b: "국가의 자주권을 위협하는 용납할 수없는 도발이다!"
 gulf.19.t: "비밀 군사 기술 교환 협정을 요청한 [FROM.GetAdjective] 정부"
 gulf.19.d: "우리는 헤즈볼라와 테헤란에 있는 그 배후 세력이라는 공동의 적을 [FROM.GetNameDef]과(와) 공유하고 있습니다. 따라서 [FROM.GetAdjective]과(와) 협력하는 것은 우리의 지역적 이익에 매우 도움이 될 수 있으며, 특히 헤즈볼라를 궁극적으로 파괴하겠다는 [FROM.GetLeader]의 결의를 고려하면 더욱 그렇습니다. 그러나 외국 세력과 기술을 공유하기 전에 이 제안을 신중히 검토해야 합니다. 그 나라의 이익이 영원히 우리와 일치하리라는 보장은 없기 때문입니다."
 gulf.19.a: "우리 함께 헤즈볼라가 모든 책임을 지도록 만들자!"
 gulf.19.b: "이런 협력 관계는 필요하지 않다."
 gulf.20.t: "군사 기술 공유를 수락한 이스라엘!"
 gulf.20.d: "처음에는 망설였으나, 이스라엘은 함께하면 헤즈볼라라는 재앙을 물리칠 가능성이 더 높다고 판단했습니다. 앞으로 다가올 전쟁에서 우리는 이스라엘의 능력을 활용할 수 있게 될 것입니다."
 gulf.20.a: "우리 함께 헤즈볼라가 모든 책임을 지도록 만들자!"
 gulf.21.t: "군사 기술 공유를 거절한 이스라엘!"
 gulf.21.d: "이스라엘은 헤즈볼라가 자국민에게 가하는 위협을 확신하지 못한 것이 분명하며, 양국 간 군사 협력 확대를 거절했습니다."
 gulf.21.a: "우린 그들의 도움이 전혀 필요없다."
 gulf.22.t: "헤즈볼라 박멸을 위한 합동 작전을 제안하는 [FROM.GetAdjective] 정부"
 gulf.22.d: "[FROM.GetNameDef]의 대표들은 우리 두 나라에 대한 헤즈볼라의 심각한 위협을 감안하여, 이 위험한 테러리스트 그룹에 대한 군사 작전에 참여할 의향이 있는지 물었습니다. 우리는 이 작전에 서명할지 아니면 평화를 유지할지를 고려해야 합니다."
 gulf.22.d1: "[FROM.GetNameDef]의 대표들은 그들과 이스라엘이 레바논에서 헤즈볼라에 대한 군사 작전을 시작할 계획이라고 우리에게 알렸습니다. 우리는 헤즈볼라를 테러리스트 조직으로 지정했으며 이스라엘의 자위권을 지지하고 있지만, 이 군사 작전은 중동에서 더 큰 불안정을 초래할 수 있습니다. 우리는 그에 따른 옵션을 신중히 고려해야 합니다."
 gulf.22.d2: "[FROM.GetNameDef]의 대표들은 레바논에서 헤즈볼라에 대한 군사 작전을 시작할 계획이라고 알려왔습니다. 우리는 헤즈볼라를 테러 조직으로 지정하고 이스라엘의 안보를 보호하는 데 전념하고 있지만, 이 군사 작전은 중동에서 추가적인 불안정을 초래할 수 있습니다. 우리는 이에 따라 우리의 옵션을 신중히 고려해야 합니다."
 gulf.22.d3: "미국이 NATO에 레바논의 헤즈볼라에 대한 공동 군사 작전에 참여할 것을 요청했습니다. 틀림없이 어려운 군사 작전이 될 이 사업에 우리 병력을 투입할지 신중히 생각해야 합니다."
 gulf.22.a: "우리 합동군은 테러리스트를 박멸시킬 것이다!"
 gulf.22.b: "우리는 전쟁을 원하지 않는다"
 gulf.22.c: "우리는 이 작전에 NATO를 부를 것이다!"
 gulf.22.e: "그들이 원하는대로 하게 해라."
 gulf.22.f: "이 작전은 허락없이 먼저 진행돼서는 안된다!"
 gulf.23.t: "헤즈볼라에 대한 공동 작전에 동의한 이스라엘!"
 gulf.23.d: "이스라엘이 레바논의 헤즈볼라 장악 지역에 대한 침공에 병력을 투입하기로 동의한 만큼, 우리는 작전을 진행할 수 있습니다. 그러나 먼저 미국에 우리의 작전을 알리고, 공동의 적을 격멸하는 데 참여하도록 초청하는 것이 우리에게 이로울 수 있습니다. 단점은 미국이 우리 작전에 거부권을 행사할 수 있다는 것이며, 그럴 경우 그래도 강행할지 여부를 결정해야 하는 처지에 놓이게 됩니다."
 gulf.23.a: "먼저 미국에 알려야 합니다!"
 gulf.23.b: "기다릴 여유가 없습니다."
 gulf.24.t: "헤즈볼라에 대한 군사 작전 참여를 거부한 이스라엘!"
 gulf.24.d: "비겁한 이스라엘인들은 헤즈볼라와의 전투에서 잃을 것이 너무 많습니다. 그러나 헤즈볼라에게는 다른 적들도 있습니다. 미국의 지지를 확보한다면 헤즈볼라는 NATO 전체의 분노에 직면해야 할 수도 있습니다. 그렇다 해도 이스라엘의 참여 거부는 중대한 차질이며, 우리는 물러서는 방안도 고려해야 할 수 있습니다."
 gulf.24.a: "미국에 접근해야 합니다."
 gulf.24.b: "단독으로 진행해야 합니다."
 gulf.24.c: "이스라엘 없이는 이 사업은 실패할 운명입니다."
 gulf.25.t: "우리의 작전에 반대하지 않을 미국!"
 gulf.25.d: "[USA.GetLeader]는 헤즈볼라에 대한 우리의 작전에 대해 승인했습니다. 더 좋은 소식은, 미국이 자원하는 NATO 회원국들과 함께 테러리스트들을 처치하는 연합을 구성하겠다고 약속했다는 것입니다!"
 gulf.25.d1: "[USA.GetLeader]은(는) 헤즈볼라에 대한 우리의 작전에 승인을 내주었습니다. 미국은 우리의 정당한 전쟁을 가로막지 않을 것입니다."
 gulf.25.a: "작전을 진행할 수 있습니다!"
 gulf.26.t: "우리에게 물러서라고 요구하는 미국!"
 gulf.26.d: "[USA.GetLeader]은(는) 헤즈볼라에 대한 군사 작전을 승인하기를 거부하고, 외교적 수단으로 갈등을 해결할 것을 촉구했습니다. 미국을 무시하고 강행할 수도 있지만, 이는 중요한 동맹국과의 관계를 틀림없이 손상시킬 것입니다."
 gulf.26.a: "그래도 강행해야 합니다!"
 gulf.26.b: "미국에 맞설 여유가 없습니다."
 gulf.27.t: "헤즈볼라에 대한 선전포고 이후 레바논에서 전쟁 발발"
 gulf.27.d: "이스라엘과 [FROM.GetNameDef]의 지도자들은 [ISR.GetLeader]와 [FROM.GetLeader]가 헤즈볼라를 지역 안정에 대한 위협으로 비난하는 공동 성명 발표 후 군사 작전을 시작했습니다. [USA.GetLeader]는 이 작전을 공개적으로 지지하며 NATO 회원국들에게 헤즈볼라에 대한 공격을 지원할 군사 지원을 제공할 것을 촉구했습니다. 헤즈볼라는 여러 유럽, 북미 및 중동 국가들에 의해 테러 조직으로 지정된 단체입니다. 레바논 정부는 [ISR.GetAdjective]와 [FROM.GetAdjective]의 적대 행위 선언에 분노하며 반응했으며, 헤즈볼라의 지도자 [HEZ.GetLeader]와 그의 이란 지지자들 역시 강하게 반발했습니다."
 gulf.27.d1: "이스라엘과 [FROM.GetNameDef]의 지도자들은 [ISR.GetLeader]와 [FROM.GetLeader]가 헤즈볼라를 지역 안정에 대한 위협으로 비난하는 공동 성명 발표 후 군사 작전을 시작했습니다. [USA.GetLeader]는 이 작전을 명시적으로 지지하지 않았지만, 여러 유럽, 북미 및 중동 국가들에 의해 테러 조직으로 지정된 헤즈볼라의 폭력 행위는 비난했습니다. 레바논 정부는 [ISR.GetAdjective]와 [FROM.GetAdjective]의 적대 행위 선언에 분노하며 반응했으며, 헤즈볼라의 지도자 [HEZ.GetLeader]와 그의 이란 지지자들 역시 강하게 반발했습니다."
 gulf.27.d2: "이스라엘과 [FROM.GetNameDef]의 지도자들은 [ISR.GetLeader]와 [FROM.GetLeader]가 헤즈볼라를 지역 안정에 대한 위협으로 비난하는 공동 성명 발표 후 군사 작전을 시작했습니다. [USA.GetLeader]는 이 작전에 대해 언급하지 않았지만, 보고에 따르면 [ISR.GetAdjective]와 [FROM.GetAdjective] 지도자들에게 헤즈볼라에 대한 작전을 수행하지 말라고 지시했다고 합니다. 헤즈볼라는 여러 유럽, 북미 및 중동 국가들에 의해 테러 조직으로 지정된 단체입니다. 레바논 정부는 [ISR.GetAdjective]와 [FROM.GetAdjective]의 적대 행위 선언에 분노하며 반응했으며, 헤즈볼라의 지도자 [HEZ.GetLeader]와 그의 이란 지지자들 역시 강하게 반발했습니다."
 gulf.27.d3: "[FROM.GetNameDef] 정부는 [FROM.GetLeader]가 헤즈볼라를 지역 안정에 대한 위협으로 비난하는 성명 발표 후 군사 작전을 시작했습니다. [USA.GetLeader]는 이 작전을 공개적으로 지지하며 NATO 회원국들에게 헤즈볼라에 대한 공격을 지원할 군사 지원을 제공할 것을 촉구했습니다. 헤즈볼라는 여러 유럽, 북미 및 중동 국가들에 의해 테러 조직으로 지정된 단체입니다. 레바논 정부는 [FROM.GetAdjective]의 적대 행위 선언에 분노하며 반응했으며, 헤즈볼라의 지도자 [HEZ.GetLeader]와 그의 이란 지지자들 역시 강하게 반발했습니다."
 gulf.27.d4: "[FROM.GetNameDef] 정부는 [FROM.GetLeader]가 헤즈볼라를 지역 안정에 대한 위협으로 비난하는 성명 발표 후 군사 작전을 시작했습니다. [USA.GetLeader]는 이 작전을 명시적으로 지지하지 않았지만, 여러 유럽, 북미 및 중동 국가들에 의해 테러 조직으로 지정된 헤즈볼라의 폭력 행위는 비난했습니다. 레바논 정부는 [FROM.GetAdjective]의 적대 행위 선언에 분노하며 반응했으며, 헤즈볼라의 지도자 [HEZ.GetLeader]와 그의 이란 지지자들 역시 강하게 반발했습니다."
 gulf.27.a: "테러리스트들은 그리워지지 않을 것이다."
 gulf.27.b: "이는 레바논 주권에 대한 명백한 침해입니다!"
 gulf.28.t: "[FROM.GetLeader], 이스라엘의 점령을 규탄"
 gulf.28.d: "최근 몇 년간 걸프 국가들은 이스라엘과의 대립을 피하고 실용적인 접근을 선호하는 경향이 있었지만, [FROM.GetNameDef]은(는) 관례에서 벗어나 이스라엘이라는 국가를 공개적으로 규탄하기 시작했습니다. 이러한 경향은 오늘 [FROM.GetLeader]의 이례적으로 강경한 성명으로 정점에 달했습니다. 많은 이들이 이 성명을 공허한 수사로 일축했지만, 다른 이들은 연설의 폭력적인 이미지를 폭력적인 행동 노선에 대한 지지를 암시하는 것으로 해석했습니다."
 gulf.28.a: "아랍-이스라엘 갈등이 고조되고 있습니다."
 gulf.29.t: "이란의 침략을 규탄하는 [FROM.GetLeader]"
 gulf.29.d: "최근 사건들은 이란이 지역 불안정성이 크게 증가한 후 중동에서의 개입을 급격히 늘리고 있음을 보여주고 있습니다. 이란은 자신의 활동이 방어적이고 적대적이지 않다고 주장하고 있지만, [FROM.GetNameDef]을 비롯한 일부는 이러한 활동을 점점 더 우려하며, 오늘은 [FROM.GetLeader]로부터 이란의 외교 정책에 대한 강력한 비판이 있었습니다.\n\n이 성명은 이전에 미온적인 관계가 공개적인 적대감으로 악화된 [FROM.GetAdjective]-이란 관계에서 중요한 하락을 따릅니다. 이 관계가 얼마나 더 악화될지, 그리고 그 결과가 무엇일지는 앞으로 지켜봐야 할 문제입니다."
 gulf.29.a: "이란에 맞서는 이가 나올 때가 되었습니다!"
 gulf.29.b: "이란은 자국의 국익을 보호할 권리가 있다!"
 gulf.30.t: "[FROM.GetNameDef], 이란에 대한 선제공격 제안"
 gulf.30.d: "이란 정권의 적대적이고 불안정을 초래하는 행위를 들어, [FROM.GetLeader]은(는) 너무 늦기 전에 행동에 나설 것을 촉구하며 우리나라에 [FROM.GetNameDef]과(와) 함께 이란에 대한 선제공격에 동참할 것을 요청했습니다. 이란의 행동이 [ROOT.GetAdjective] 국민에게 우려스러울 수는 있으나, 그 위협이 불안정한 법적 근거 아래 공세적 군사 행동을 요구할 만큼 충분한지 신중히 고려해야 합니다."
 gulf.30.a: "이란의 위협은 제거되어야 합니다!"
 gulf.30.b: "중동 정치는 우리가 관여할 일이 아닙니다."
 gulf.30.c: "[FROM.GetAdjective]의 모험주의에서 우리가 얻을 것은 없습니다."
 gulf.31.t: "[USA.GetLeader], 이란과의 전쟁 지지를 거부!"
 gulf.31.d: "미국은 지역의 안보보다 사소한 국내 정치에 더 신경을 쓰는 것이 분명하며, 억압적인 이란 정권에 대한 선제 조치를 촉구한 우리의 제안을 거절했습니다."
 gulf.31.a: "우리 손으로 해결해야 합니다!"
 gulf.31.b: "우리는 이 정도 규모의 작전을 수행할 준비가 되어 있지 않습니다..."
 gulf.32.t: "의지의 연합, 이란 침공 개시"
 gulf.32.d: "[FROM.GetLeader]은(는) 오늘 이란의 핵 시설을 영구적으로 폐쇄하고 이란 이슬람 공화국이 개입주의적 외교 정책을 계속할 능력을 무력화하기 위한 의지의 연합 결성을 발표했습니다. 이 연합은 역내 이란의 활동에 위협을 느낀 한 아랍 군주국의 요청으로 결성된 것으로 알려졌습니다. [PER.GetLeader]은(는) 연합 결성을 강하게 규탄하며, 국제 사회에 이를 극심한 국제법 위반이자 국가 주권 규범에 대한 명백한 공격이라고 비난할 것을 촉구했습니다. 이란 혁명수비대는 연합을 철저히 소모시키겠다고 공언했으며, 혁명수비대 지휘관은 이란 땅을 밟는 외국군 병사는 단 한 명도 살아서 나가지 못할 것이라고 경고했습니다."
 gulf.32.d1: "[FROM.GetLeader]은(는) 오늘 이란의 핵 시설을 영구적으로 폐쇄하고 이란 이슬람 공화국이 개입주의적 외교 정책을 계속할 능력을 무력화하기 위한 의지의 연합 결성을 발표했습니다. 이 연합은 역내 이란의 활동에 위협을 느낀 한 아랍 군주국의 요청으로 결성된 것으로 알려졌습니다. [PER.GetLeader]은(는) 연합 결성을 강하게 규탄하며, 국제 사회에 이를 극심한 국제법 위반이자 국가 주권 규범에 대한 명백한 공격이라고 비난할 것을 촉구했습니다. 이란 혁명수비대는 연합을 철저히 소모시키겠다고 공언했으며, 혁명수비대 지휘관은 이란 땅을 밟는 외국군 병사는 단 한 명도 살아서 나가지 못할 것이라고 경고했습니다. 그러나 쿠제스탄주의 아랍인들이 정부에 맞서 무장 봉기를 일으켰다는 보도가 나오고 있으며, 이는 이미 한계에 이른 이란군에 중대한 위협이 되고 있습니다."
 gulf.32.d2: "[FROM.GetLeader]은(는) 오늘 이란의 핵 시설을 영구적으로 폐쇄하고 이란 이슬람 공화국이 개입주의적 외교 정책을 계속할 능력을 무력화하기 위한 의지의 연합 결성을 발표했습니다. 이 연합은 역내 이란의 활동에 위협을 느낀 한 아랍 군주국의 요청으로 결성된 것으로 알려졌습니다. [PER.GetLeader]은(는) 연합 결성을 강하게 규탄하며, 국제 사회에 이를 극심한 국제법 위반이자 국가 주권 규범에 대한 명백한 공격이라고 비난할 것을 촉구했습니다. 이란 혁명수비대는 연합을 철저히 소모시키겠다고 공언했으며, 혁명수비대 지휘관은 이란 땅을 밟는 외국군 병사는 단 한 명도 살아서 나가지 못할 것이라고 경고했습니다. 그러나 시스탄-발루치스탄주의 발루치인들이 정부에 맞서 무장 봉기를 일으켰다는 보도가 나오고 있으며, 이는 이미 한계에 이른 이란군에 중대한 위협이 되고 있습니다."
 gulf.32.d3: "[FROM.GetLeader]은(는) 오늘 이란의 핵 시설을 영구적으로 폐쇄하고 이란 이슬람 공화국이 개입주의적 외교 정책을 계속할 능력을 무력화하기 위한 의지의 연합 결성을 발표했습니다. 이 연합은 역내 이란의 활동에 위협을 느낀 한 아랍 군주국의 요청으로 결성된 것으로 알려졌습니다. [PER.GetLeader]은(는) 연합 결성을 강하게 규탄하며, 국제 사회에 이를 극심한 국제법 위반이자 국가 주권 규범에 대한 명백한 공격이라고 비난할 것을 촉구했습니다. 이란 혁명수비대는 연합을 철저히 소모시키겠다고 공언했으며, 혁명수비대 지휘관은 이란 땅을 밟는 외국군 병사는 단 한 명도 살아서 나가지 못할 것이라고 경고했습니다. 그러나 쿠제스탄주의 아랍인들과 시스탄-발루치스탄주의 발루치인들이 정부에 맞서 동시에 무장 봉기를 일으켰다는 보도가 나오고 있으며, 이는 이미 한계에 이른 이란군에 중대한 위협이 되고 있습니다."
 gulf.32.a: "이란 정권의 날도 얼마 남지 않았다..."
 gulf.32.b: "이는 터무니없는 침략 행위다!"
 gulf.33.t: "[FROM.GetNameDef], 외세의 간섭 규탄"
 gulf.33.d: "수십 년간 신식민주의 세력의 손에 아랍 국가들이 겪은 억압을 개탄하며, [FROM.GetNameDef]의 지도자 [FROM.GetLeader]은(는) 향후 10년 안에 이 지역에서 외세의 영향력을 일소하겠다고 공약했습니다. 정권 교체 이전에는 역내의 믿을 만한 파트너로 여겨졌던 나라에서 나온 이번 발표에 미국과 그 동맹국들은 충격과 분노로 반응했습니다. 러시아와 이란은 [FROM.GetNameDef]의 반제국주의 의제를 명목상 지지하지만, 이번 발언이 서방뿐 아니라 아랍 세계에서의 자신들의 이익도 겨냥한 것이 아니냐고 우려하는 것으로 알려졌습니다. [FROM.GetLeader]이(가) 이 공약을 어떻게 실행에 옮길 것인지는 여전히 불분명합니다."
 gulf.33.a: "다음에는 무슨 일이 벌어질까?"
 gulf.34.t: "[FROM.GetNameDef], 외국군 추방 요구"
 gulf.34.d: "[FROM.GetNameDef]은(는) 자신들의 편이 아니면 적이라고 선언하며, [ROOT.GetNameDef]을(를) 포함한 모든 아랍 국가에 영토 내 외국군을 즉각 추방할 것을 요구했습니다. [FROM.GetNameDef]의 요구를 따르면 동맹국들의 반감을 사고 외부 공격에 더 취약해지겠지만, 거부하면 전쟁으로 이어질 수 있습니다."
 gulf.34.a: "양보해야 합니다."
 gulf.34.b: "우리는 충성이 전부다!"
 gulf.35.t: "[FROM.GetNameDef], \\"외세의 앞잡이\\"들에 선전포고"
 gulf.35.d: "중동에서 외국군을 추방하겠다는 공약을 지키기 위해, [FROM.GetNameDef]은(는) 외세의 군사 기지를 계속 수용하는 모든 중동 국가를 침공하겠다고 공언했습니다. \\"제국주의는\\" [FROM.GetLeader]은(는) [FROM.Capital.GetName]발 방송에서 이렇게 선언했습니다. \\"21세기에 설 자리가 없다. 우리는 아랍 형제들에게 우리와 함께 싸울 기회를 주었으나, 그들은 외세보다 자국민을 우선하지 않기로 선택했으며 이제 그 대가를 치르게 될 것이다. 우리는 어떤 수단을 쓰더라도 아랍 민족을 해방할 것이다.\\""
 gulf.35.a: "불길에 휩싸인 지역."
 gulf.36.t: "비밀리에 군사 장비를 보내온 [FROM.GetAdjective]!"
 gulf.36.d: "[FROM.GetNameDef] 정부가 우리 군이 통제하는 지역에 상당한 양의 경무기를 밀반입하는 데 성공했습니다. 이 무기들은 공동의 적에 맞선 투쟁에 도움이 될 것입니다."
 gulf.36.a: "도움에 감사한다."
 shia_terror.1.t: "\"헤즈볼라\" 공세의 일원으로 대규모 폭동이 발생한 [FROM.GetAdjective]의 수도"
 shia_terror.1.d: "오늘 아침 일찍, [FROM.GetAdjective] 정부 사무소 앞에서 차량 폭탄이 폭발하여 여러 공무원이 사망하고 부상당했습니다. 정부 관계자들은 이 공격에 대해 헤즈볼라의 지역 지부를 책임자로 지목하며, 이로 인해 해당 단체의 활동에 대해 더 강력한 단속을 다짐했습니다. 그러나 국제 전문가들은 [FROM.GetNameDef] 내에서 조직화된 시아 무장 단체의 존재에 대해 의문을 제기하고 있습니다.\n\n수니파 정부의 압박을 받아온 시아파의 반대가 커지고 있습니다. [FROM.GetAdjective] 정부는 자국민을 학대했다는 비난을 거부하며, 대신 시아 무장 세력을 테러리스트와 테헤란 및 레바논 헤즈볼라의 지도자 [HEZ.GetLeader]의 괴뢰로 비난했습니다. [FROM.GetLeader]는 이란과 헤즈볼라가 [FROM.GetNameDef]에서 이슬람 혁명을 일으키려 한다고 비난했습니다."
 shia_terror.1.d1: "오늘 이른 아침 [FROM.GetAdjective] 정부 청사 앞에서 차량 폭탄이 터져 공무원 여러 명이 사망하거나 부상을 입었습니다. 정부 당국은 시아파 무장 단체 헤즈볼라 알히자즈를 이번 공격의 배후로 지목하고 이 조직의 활동을 더욱 강력히 단속하겠다고 공언했습니다.\n\n수니파가 주도하는 정부가 시아파를 억압한다는 인식이 퍼지면서 이에 대한 시아파의 반발이 커졌습니다. [FROM.GetAdjective] 정부는 자국민을 부당하게 대우했다는 비난을 일축하고, 시아파 무장 세력을 테러리스트이자 테헤란과 레바논 헤즈볼라 지도자 [HEZ.GetLeader]의 꼭두각시라고 맹비난했습니다. [FROM.GetLeader]은(는) 이란과 헤즈볼라가 [FROM.GetNameDef]에서 이슬람 혁명을 촉발하려 한다고 비난했습니다."
 shia_terror.1.a: "[FROM.GetNameDef]의 암울한 하루다..."
 shia_terror.3.t: "조직적 공격 이후 [FROM.GetAdjective] 군 배치"
 shia_terror.3.d: "시아파 무장 세력이 [FROM.GetNameDef] 전역의 여러 목표물을 동시에 공격하여 이 나라의 지도자 [FROM.GetLeader]이(가) 비상사태를 선포했습니다. 이들 무장 세력은 잘 훈련되어 있고 군용 무기를 보유한 것으로 알려졌으며, 로켓추진유탄과 중기관총을 이용해 [FROM.GetAdjective] 특수 부대에 맞서 장시간 버텼습니다. 경찰서와 정부 청사, 심지어 군 기지까지 지방 정부가 헤즈볼라의 [FROM.GetAdjective] 지부로 규정한 조직의 표적이 되었는데, 이 조직은 차별적이라고 인식되는 정부 정책 이후 인기가 급증한 것으로 알려졌습니다. [FROM.GetLeader]은(는) [FROM.GetAdjective] 국민들에게 \\"외세가 뒷받침하는 테러\\"라고 규탄한 사태 앞에서 단결을 유지할 것을 촉구했는데, 이는 현지 시아파 무장 세력이 이란과 레바논의 헤즈볼라의 지원을 받고 있다는 [FROM.GetAdjective]의 주장을 암시한 것입니다."
 shia_terror.3.a: "지금은 애도합니다. 곧 반격할 것입니다."
 shia_terror.5.t: "정부에 맞서 무기를 든 시아파 혁명 세력!"
 shia_terror.5.d: "레바논 헤즈볼라의 구호를 내세우는 무장 세력이 우리 정부를 전복하고 이란 이슬람 공화국을 본뜬 정부로 교체하겠다는 목표를 공공연히 내걸고 대규모로 동원되기 시작했습니다. 우리 군은 고도로 조직되고 무장이 잘 갖춰진 이 운동 앞에서 녹아내리고 있으며, 혁명 세력에 굴복하거나 외부의 개입을 요청해야 하는 상황입니다."
 shia_terror.5.d1: "헤즈볼라 알히자즈에 충성을 맹세한 무장 세력이 시아파가 다수인 카티프 지역에 대한 [ROOT.GetAdjective]의 통치를 끝내고 이란 이슬람 공화국을 본뜬 독립 국가를 수립하겠다는 목표를 공공연히 내걸고 대규모로 동원되기 시작했습니다. 무장 세력은 동부 주 전역의 전략적 요충지를 장악하여 사실상 우리 군을 이 지역에서 몰아냈습니다. 평화적으로 철수할지, 아니면 군에 시아파 반군과의 교전을 명령할지 결정해야 합니다."
 shia_terror.5.a: "반란에 굴복한다."
 shia_terror.5.b: "페닌슐라 실드군의 개입을 요청한다."
 shia_terror.5.c: "반란을 진압할 것이다!"
 shia_terror.5.e: "공개적인 충돌은 감당할 수 없다..."
 shia_terror.5.f: "카티프로 전환한다."
 gcc.1.t: "걸프협력회의 최고 위원회"
 gcc.1.d: "[FROM.GetNameDef]의 대표단이 GCC 최고 이사회에 GCC의 공동 연구 노력을 증진하기 위한 기술 공유 구상을 수립하자는 제안을 가져왔습니다. 이는 우리의 연구 계획에도 도움이 되겠지만, 우리가 시간과 자원을 들여 키워 온 연구 성과를 잠재적 경쟁자들과 공유하는 것은 우리의 이익에 부합하지 않을 수 있습니다. 이 제안을 지지할지 거부할지 신중히 고려해야 합니다."
 gcc.2.d: "[FROM.GetNameDef]의 대표단이 GCC 최고 이사회에 공동 시장을 수립하자는 제안을 가져왔습니다. 이렇게 되면 GCC 시민들이 걸프 전역에서 일할 수 있게 되고 GCC 회원국 간 재화와 서비스 무역이 활성화될 것입니다. 이 제안을 지지할지 거부할지 신중히 고려해야 합니다."
 gcc.3.d: "[FROM.GetNameDef]의 대표단이 GCC 최고 이사회에 단일 통화를 도입하자는 제안을 가져왔습니다. 칼리지라고 불릴 이 공동 통화는 세계 금융 시장에서 GCC의 집단적 영향력을 높여 주겠지만, 우리는 통화 정책의 통제권을 포기해야 합니다. 이 제안을 지지할지 거부할지 신중히 고려해야 합니다."
 gcc.4.d: "[FROM.GetNameDef]의 대표단이 GCC 최고 이사회에 공동 방위 협정을 체결하자는 제안을 가져왔습니다. 이 협정에 따라 모든 GCC 회원국은 한 회원국에 대한 공격을 모든 회원국에 대한 공격으로 간주하게 됩니다. 협정에 서명하면 외부 위협으로부터 우리의 안보를 지킬 수 있겠지만, 우리 군이 감당하기 어려울 수도 있는 추가적인 책임을 지게 됩니다. 이 제안을 지지할지 거부할지 신중히 고려해야 합니다."
 gcc.6.d: "[FROM.GetNameDef]의 대표단이 GCC 최고 이사회에 GCC 군 장교의 훈련을 개선하고 표준화하기 위한 걸프 전략안보연구원을 설립하자는 제안을 가져왔습니다. 이 제안을 지지할지 거부할지 신중히 고려해야 합니다."
 gcc.7.d: "[FROM.GetNameDef]의 대표단이 GCC 최고 이사회에 통합 군사 지휘부를 수립하자는 제안을 가져왔습니다. 이렇게 되면 GCC 회원국이 연루된 전쟁이 발생했을 때 GCC 각국의 군대가 더욱 효과적으로 협조할 수 있게 됩니다. 이 제안을 지지할지 거부할지 신중히 고려해야 합니다."
 gcc.8.d: "[FROM.GetNameDef]의 대표단이 GCC 최고 이사회에 견고한 군사 동맹을 수립하자는 제안을 가져왔습니다. 이 야심 찬 사업은 GCC를 NATO보다도 더 긴밀히 통합된 동맹으로 만들어, 방어적 수단과 선제적 수단 모두로 걸프 아랍 국가들을 지킬 효과적이고 단일한 군사력을 만들어 낼 것입니다. 이 제안이 추진되면 우리의 안보는 보장되겠지만, 우리 군이 [FROM.GetAdjective]의 공세적인 전쟁에 끌려 들어갈 수도 있습니다. 이 제안을 지지할지 거부할지 신중히 고려해야 합니다."
 gcc.1.a: "우린 이 계획을 지지한다!"
 gcc.1.b: "우린 이 계획을 거부한다!"
 gcc.5.t: "[FROM.GetAdjective] 대표단이 우리 제안에 대한 지원을 거부하다!"
 gcc.5.d: "[FROM.GetNameDef]은(는) 자국의 주권 사안에 대한 통제권을 포기하지 않겠다며 GCC 최고 이사회에서 우리의 최근 제안에 거부권을 행사했습니다. 이 거부로 인해 당분간 최고 이사회에서 새로운 제안을 내놓기 어려워질 것입니다."
 gcc.5.a: "걸프의 통합이 한 발짝 멀어지고 있다..."
 gcc.11.t: "걸프 협력 회의의 보호 요청"
 gcc.11.d: "GCC 대표단이 오늘 우리 수도를 방문하여 GCC와 [ROOT.GetAdjective] 국민 사이의 유대를 재확인했습니다. 걸프 국가 정부들은 그 충성에 대한 보답으로, 역내 공격적 행위자들의 외부 위협으로부터 걸프 국가들을 보호하겠다는 우리의 공약을 성문화할 것을 요청했습니다."
 gcc.11.a: "[ROOT.GetNameDef](은)는 우리의 동맹을 따른다."
 gcc.11.b: "그들의 이유는 우리의 가치와 다르다."
 gcc.12.t: "걸프협력회의의 보호 제안을 거절한 [FROM.GetAdjective]!"
 gcc.12.d: "[FROM.GetLeader]은(는) [FROM.GetAdjective] 국민이 우리와의 관계를 소중히 여기지만, 외부 위협으로부터 GCC를 보장하여 GCC의 안보에 스스로를 구속할 의사는 없다고 알려 왔습니다."
 gcc.12.a: "어쩌면 우린 보호를 위해 다른 국가에 관심을 가져야 할지도 모른다..."
 gcc.13.t: "우리를 보증할 수 있는 새로운 국가 선택"
 gcc.13.d: "미국은 더 이상 GCC를 적으로부터 방어해 줄 것이라고 믿을 수 없으므로, 우리는 다른 곳에서 보호를 구해야 합니다."
 gcc.13.a: "터키와 함께가자."
 gcc.13.b: "이란과 함께하자."
 gcc.13.c: "인도와 함께하자."
 gcc.13.e: "파키스탄과 함께하자."
 gcc.13.f: "러시아와 함께하자."
 gcc.14.t: "걸프협력회의가 통화의 공유를 선언하다"
 gcc.14.d: "[FROM.GetNameDef]의 지도자 [FROM.GetLeader]은(는) 오늘 GCC 최고 이사회가 GCC 전역에서 사용할 단일 통화를 도입하기로 합의했다고 발표했습니다. 이번 조치는 역사적으로 합의에 도달하기 어려웠던 지역 기구인 GCC의 통합 측면에서 큰 진전을 의미합니다. 더욱이 걸프 국가들은 경제 구조가 지나치게 비슷하여 압도적으로 GCC 비회원국과 무역을 하기 때문에, 경제 협력을 늘리려는 과거의 구상에도 불구하고 걸프 국가 경제의 상호 연계는 제한적인 수준에 머물러 있습니다. 새 통화인 칼리지는 GCC 회원국 간의 이러한 제한적인 경제 협력을 더욱 증진하고 세계 시장에서 GCC의 영향력을 높이는 데 도움이 될 것으로 기대됩니다."
 gcc.14.a: "걸프 국가들은 더욱 가까워지고 있다."
 gcc.15.t: "아랍 걸프 지역 국가들이 공동 방위 협정에 서명하다"
 gcc.15.d: "걸프 협력 회의 회원국 지도자들이 수십 년 만에 GCC 군사 협력에서 가장 중요한 진전을 이룬 역사적인 협정에 서명하기로 합의했습니다. 이 협정에 따라 모든 회원국은 외부 위협으로부터 공격을 받은 GCC 회원국을 도울 의무를 집니다. 그러나 외국 분석가들은 이 협정이 별개의 지휘 체계, 조직 문화, 장비 유형을 유지하고 있는 GCC 각국 군대를 통합하려는 실질적인 노력과 병행되지 않았다고 지적했습니다. 따라서 GCC가 완전한 군사 동맹 수준의 결속력에 도달하기까지는 갈 길이 멉니다."
 gcc.15.a: "우리는 더욱 강력해질 것이다"
 gcc.16.t: "걸프 국가들이 충격적인 모습으로 그들의 주권을 내주다"
 gcc.16.d: "걸프 협력 회의에서 [FROM.GetNameDef]의 영향력이 눈에 띄게 증가한 이후, [FROM.GetLeader]이(가) 이 영향력을 이용해 다른 GCC 회원국들이 외교 정책 통제권을 포기하도록 압박했다는 보도가 나오고 있습니다. [FROM.GetAdjective]이(가) 이 기구를 장악한 탓에 다른 걸프 국가들은 이러한 주권 침식에 저항하지 못했고, [FROM.GetLeader] 정부에 통제권을 넘겨줄 수밖에 없었습니다. 이로써 [FROM.GetNameDef]은(는) 걸프 지역의 패권국으로서의 입지를 굳혔고, 중동에서 가장 두드러진 행위자 중 하나로서의 위상을 공고히 했습니다."
 gcc.16.a: "걸프 만에서 힘의 균형이 영원히 바뀔지도 모른다..."
 gcc.17.t: "걸프 국가들이 칼리즈의 국가를 형성하기 위해 단결하다"
 gcc.17.d: "걸프 아랍 국가들은 걸프 협력 회의의 지역화 구상을 논리적 귀결까지 밀고 나가, 최근 몇 달 사이 GCC 내부의 통제권을 공고히 한 [FROM.GetLeader]의 지도 아래 통합했습니다. 아랍어로 \\"걸프\\"를 뜻하는 이름의 신생국 칼리지는 세계 전체 석유 매장량의 거의 절반을 통제하는 중동의 강력한 세력입니다. 칼리지의 탄생은 걸프 아랍 국가들이 외세 후원자에 의존하지 않고 국제 무대에서 자신들의 입지를 확보하려는 열망의 상징으로 선전되고 있습니다."
 gcc.17.a: "칼리즈 만세! 오늘은 우리 국가의 날이다!"
 gcc.18.t: "비밀 회의를 소집하는 [FROM.GetLeader]"
 gcc.18.d1: "[FROM.GetNameDef] 정부는 [BHR.GetNameDef] 내부에서 벌어지고 있는 정치적 혼란에 대해 예의주시 할 것을 당부하였습니다. 이런 우려로 인해, [FROM.GetAdjective](은)는 걸프협력회의에 큰 혼란을 가져다줄 수 있는 [BHR.GetNameDef]의 부정적인 결과를 완화하고 새로운 [BHR.GetAdjective] 정부를 처벌하기 위해 [BHR.GetNameDef](을)를 걸프협력회의에서 추방해야한다는 의견을 제시하였습니다. [BHR.GetAdjective](이)가 초대되지 않은 이 비밀 회의의 결과를 통해, 걸프협력회의의 회원국으로써 [BHR.GetNameDef]의 미래가 결정될 것입니다."
 gcc.18.d2: "[FROM.GetNameDef] 정부는 [KUW.GetNameDef]이(가) 겪고 있는 정치적 혼란을 점점 커지는 우려 속에 주시해 왔습니다. 이러한 우려에 따라 [FROM.GetAdjective]은(는) [KUW.GetNameDef]의 혼란이 GCC 결속력에 미치는 부정적 영향을 완화하고 새로운 [KUW.GetAdjective] 정부를 응징하기 위해 [KUW.GetNameDef]을(를) GCC에서 제명할 것을 제안했습니다. [KUW.GetAdjective]이(가) 초청받지 못한 이 비밀 회동의 결과가 [KUW.GetNameDef]의 GCC 회원 자격의 미래를 좌우할 것입니다."
