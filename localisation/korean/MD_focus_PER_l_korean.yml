 PER_money_all_over: "도처의 돈"
 PER_money_all_over_desc: "우리는 국제 프로젝트에 막대한 자금을 투자했습니다.\n§W--------------§!\n이 국가 정신은 국제 투자액이 $500B 미만이 되면 취소됩니다. "
