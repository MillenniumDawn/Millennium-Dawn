 egypt.151.d: "[EGY.GetNameWithFlag]의 대표단이 흥미로운 제안을 들고 우리나라에 도착했습니다. 그들은 막대한 돈을 대가로 자국을 위한 함선 몇 척을 건조해 달라고 제안합니다."
