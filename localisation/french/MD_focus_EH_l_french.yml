 EH_electric_trap_remove_country_resource_cost_tungsten_TT: "§YRetirer ce piège remboursera §G1 métal technologique§!.§!"
 EH_battlefield_adaptation_idea_TT: "§YAjouter le modificateur Adaptation au champ de bataille§!\n§YLes bonus augmentent de §G+2 %§! chaque mois, jusqu'à un bonus de §G+12 %§!.§!\n§YDure jusqu'à ce que les déclencheurs du focus soient remplis.§!"
