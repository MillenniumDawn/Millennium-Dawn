 iraq_md.200.t: "Obecność USA w Iraku"
 iraq_md.200.d: "Misja amerykańska w naszym narodzie trwa już od wielu lat i w ocenie naszego narodu jego pobyt tutaj musi dobiec końca. Mimo że część delegacji amerykańskiej upierała się, że ich obecność jest konieczna w celu zwalczania terroryzmu i ekstremizmu, widzimy inaczej. Najwyższy czas, aby nasz rząd dokonał wyboru w tej sprawie."
 iraq_md.200.a: "Wyślij im prośbę"
 iraq_md.200.b: "Czas nie jest odpowiedni"
 iraq_md.201.t: "Rząd iracki żąda naszego wycofania"
 iraq_md.201.d: "The Iraqi government has requested that we withdraw our forces from their nation, citing that our mission has been long due for a closure. Their diplomats have assured us that the state is able to completely operate on its own, not being in need of our assistance to maintain the Iraqi state."
 iraq_md.201.a: "Zabierzmy naszych chłopców do domu"
 iraq_md.201.b: "Nie, nie są jeszcze gotowi"
 iraq_md.202.t: "United States Withdraws Its Forces"
 iraq_md.202.d: "The United States has decided to agree with our request, and have begun withdrawing their troops. The withdrawal will be gradual, but they have already signed into effect the transfer of all government posts currently manned by American experts."
 iraq_md.202.a: "Wreszcie！"
 iraq_md.203.t: "Stany Zjednoczone odmawiają wycofania się"
 iraq_md.203.d: "Rząd amerykański odrzucił naszą prośbę, powołując się na to, że nasz rząd nie jest przygotowany do utrzymania stabilnej kontroli nad rządem."
 iraq_md.203.a: "Niefortunny"
 iraq_md.74.b: "NIE! Saddam jest naszym wiecznym przywódcą!"
 iraq_md.744.t: "Śmierć Saddama Husajna!"
 iraq_md.744.d: "Today 6:00 AM the president was reported dead in his bed, surrounded by close family members. His life was one with many ups and downs, surviving several wars with the United States and other nations. However, with his death, comes a new beginning. Saddam had appointed one of his sons to lead the nation, though it has been widely unknown until recently."
 iraq_md.744.a: "Spoczywaj w pokoju."
 iraq_md.300.t: "Saddam chce aktualnych informacji na temat naszych postępów w Iranie?"
 iraq_md.300.d: "Saddam Husajn wtargnął do biura Połączonych Szefów Sztabów, żądając informacji, jak postępują nasze postępy w wojnie z Iranem. Podszedł strażnik i oświadczył: „Panie Prezydencie, wojna zakończyła się kilkadziesiąt lat temu! Z Iranem nie ma wojny”. Saddam natychmiast zastrzelił strażnika na miejscu."
 iraq_md.300.a: "Uh.. Yeah it's going great"
 iraq_md.301.t: "Uh.. Tak, idzie świetnie"
 iraq_md.301.d: "During a routine hospital visit, Saddam mistook the hospital as a torture chamber and began fighting with the nurses who were preparing him for his check. He demanded that he be freed immediately, but his personal assistant re-assured him that they were not in a torture chamber. The assistant was fired yesterday, and for some reason his records such as birth certificate, and otherwise, no longer appear on our systems."
 iraq_md.301.a: "Gówno"
 iraq_md.302.t: "Saddam szturmuje konsulat brytyjski"
 iraq_md.302.d: "Whilst he was on a walk, Saddam Hussein had convinced a small group of soldiers he saw on the road to help him storm the British Consulate in Baghdad. Upon attempting to breach the compound, British guards detained the soldiers aiding Saddam and demanded for someone to come get Saddam. As Saddam was being dragged away, he started frantically kicking and screaming \"Today the colonizers have been colonized! Glory to the Iraqi nation! Glory to the Iraqi people!\". The British consulate have issued a statement, declaring they will be leaving for the time being."
 iraq_md.302.a: "Ups."
 iraq_md.303.t: "Saddam myli latarkę z bombą"
 iraq_md.303.d: "Z jakiegoś powodu wczoraj wieczorem jeden z dozorców pałacu Saddama umieścił latarkę na stoliku nocnym Saddama, gdy ten spał. Dziś rano kilku strażników wbiegło gorączkowo do pokoju Saddama, ponieważ krzyki dochodzące z pokoju Saddama bardzo ich zaniepokoiły. Przedstawiono im przerażonego Saddama, który stał w przeciwległym rogu pokoju, wskazując na latarkę i krzycząc: „Amerykanie i syjoniści przemycili bombę do mojego pokoju!”. Strażnicy szybko wyłączyli latarkę i Saddam ponownie zapadł w sen. Dozorca nie pracuje już w pałacu."
 iraq_md.303.a: "Co do cholery?"
 iraq_md.304.t: "Saddam próbuje przekupić sprzedawcę sklepu, biorąc go za zagranicznego dyplomatę"
 iraq_md.304.d: "For several days, Saddam had been complaining about the lack of Chocolate in the palace. Because of this, his assistants could not put up with his complaining for much longer, and eventually just took him to the store as he insisted he wanted to personally pick out the brand of chocolate himself. As the guards and assistants were distracted by the crowd forming outside, one of them noticed that Saddam was trying to whisper into the ear of the clerk, and overheard him saying \"Listen, if you ensure that our ships flow through Hormuz without problem, and you go back on your deal with the Omanis and Iranians, then I will give you a very favorable price for any future oil deals\". The Guards then swiftly bought the chocolate, and escorted Saddam back to the palace."
 iraq_md.304.a: "Co do cholery?"
 iraq_md.305.t: "Saddam pisze emocjonalne wyznanie za zbrodnie, których nie popełnił"
 iraq_md.305.d: "In a moment of considerable guilt and confusion, Saddam began writing a very emotional and apologetic address to the nation about crimes that he did not commit. He went on to describe how he felt sorry for tainting a local town's water supply with apple-cider vinegar. A nosey maid came across this letter, and reported it to one of Saddam's close assistants, who immediately went on to have a talk with Saddam about how he did not commit such a crime. Saddam insisted that he did, and that he could no longer stand the guilt. The assistant then reluctantly brought a nutritionist to inform Saddam about the health benefits of apple-cider vinegar, and how instead he helped the locals rather than harm. Saddam then secretly wrote and published a patriotic letter pleading with everyone to drink apple-cider vinegar so that Iraq may have \"The Earth's Finest Soldiers\"."
 iraq_md.305.a: "O nie.."
 iraq_md.306.t: "Saddam planuje rewolucję przeciwko swoim opiekunom"
 iraq_md.306.d: "Upon being denied exit from the palace, Saddam thought that he was under house arrest as he believed that his party had failed the coup they launched in 1963. He then began trying to sway the guards to his side, explaining to them in detail about his plot to overthrow his care-givers, and break free from the palace. The guards then realized something was wrong, and took him under their protection momentarily until he fell asleep."
 iraq_md.306.a: "Dlaczego?"
 iraq_md.307.t: "Saddam przygotowuje kolację dyplomatyczną z resztek jedzenia"
 iraq_md.307.d: "Saddam, nie informując o tym kuchni pałacowej ani nikogo innego, zaczął układać talerze na pałacowym stole i wezwał kilku regionalnych dyplomatów, aby zorganizowali kolację dyplomatyczną w celu omówienia problemów regionalnych. W rezultacie goście zostali przesłuchani przez strażników stacjonujących w pałacu po ich przybyciu, co wywołało zamieszanie, którego można było całkowicie uniknąć, gdyby Saddam po prostu poinformował innych o swoich planach. W końcu wpuszczono gości, zapominając, że to on ich zaprosił. Saddam nie przygotował dla nich żadnego jedzenia, więc podano im zimne resztki jedzenia, które gorączkowo wyniósł z kuchni."
 iraq_md.307.a: "Jakie to żenujące"
 iraq_md.308.t: "Saddam godzinami ćwiczy przemówienie transmitowane wcześniej w telewizji"
 iraq_md.308.d: "For hours, Saddam's care-givers had not seen him leave his room, as they believed he was rehearsing a quick speech that he had planned for later that day. Out of concern, they began trying to listen to what he was saying and one of them recognized the speech as his previous one about the American invasion. An assistant was later told to enter the room to inform Saddam that he had already given the speech years ago, and he did so with fear and reluctance. Saddam then furiously threw the papers against the wall and told the assistant to get out. Later that day the sounds of a crying Saddam could be heard throughout the palace."
 iraq_md.308.a: "Cholera"
 iraq_md.309.t: "Saddam myli lodówkę z sejfem"
 iraq_md.309.d: "Dziś rano Saddam wywrócił pałac do góry nogami, gorączkowo szukając pieniędzy, które przechowywał w zabezpieczonym sejfie w skarbcu. Nie pamiętając tego, Saddam wziął lodówkę za swój sejf, wierząc, że ktoś ukradł mu pieniądze i ukrył je gdzie indziej. Następnie poinformowano Saddama o lokalizacji sejfu i zażądał zabrania pieniędzy na zakup luksusów."
 iraq_md.309.a: "Gówno"
 iraq_md.310.t: "Saddam wznieca pożar!"
 iraq_md.310.d: "Dzisiaj rano, kiedy Saddam odwiedzał lokalną wioskę na obrzeżach Rutbah, Saddam zapalił cygaro, które zapomniał zgasić ani nawet zapalić. To samo cygaro zetknęło się z jednym z domów, który się zapalił, a stamtąd ogień ostatecznie rozprzestrzenił się na większą część wioski. Saddam został poinformowany o przyczynie zdarzenia, jednakże stale upierał się, że nie pali od wielu lat."
 iraq_md.310.a: "Jakie są szkody?"
 iraq_md.311.t: "Saddam wsiada do złego lotu!"
 iraq_md.311.d: "Saddam had been adamant about meeting the President of France, [FRA.GetLeader]. The meeting was agreed upon, and the flight was prepared. During the flight, Saddam insisted that he knew the way to France as he in his own words, \"had been to France many times\". As a result, the pilot had to agree to Saddam's verbal directions and ended up in the middle of French Guiana instead. The meeting was then promptly cancelled."
 iraq_md.311.a: "Czy możemy go odzyskać, proszę?"
 iraq_md.312.t: "Saddam opuścił kluczowy szczyt bezpieczeństwa"
 iraq_md.312.d: "Saddam had arranged plans for a national security summit, where his top generals and officers were asked to attend. Yesterday was when the summit was meant to take place, and upon the arrival of all the officials, they were greeted with silence as they all patiently waited for Saddam Hussein to address the room. To their surprise, Saddam Hussein never showed up. Instead it was revealed that Saddam was busy on a fishing trip with Qusay and Uday at the Euphrates river."
 iraq_md.312.a: "Dobrze dla niego"
 iraq_md.313.t: "Saddam myli paradę festiwalową z marszem wojskowym"
 iraq_md.313.d: "This morning, Saddam was being driven to an official's office for a meeting that they had arranged. On his way there, he saw a street being blocked off for a planned parade being held there, which he mistook for a military parade. He then told his driver to pull over, and Saddam rushed to the podium on the side of the street, kicking the announcer off the stage. He then began saluting in anticipation for the soldiers, but instead he was caught saluting cartoon characters as he swiftly realized that he was at a children's parade."
 iraq_md.313.a: "Gówno"
 iraq_md.314.t: "Saddam nakazuje budowę 500 nowych bunkrów!"
 iraq_md.314.d: "Obawiając się nieuchronnego ataku nuklearnego ze strony Stanów Zjednoczonych, Saddam nakazał budowę 500 nowych bunkrów w całym Iraku. Stało się tak, ponieważ wierzył, że Irak nadal jest w stanie wojny ze Stanami Zjednoczonymi i dlatego wpadł w panikę. Zamówienia zostały anulowane, ale firmy budowlane nadal traciły pieniądze i dlatego należy im się sprawiedliwa rekompensata."
 iraq_md.314.a: "Gówno"
 iraq_md.315.t: "Saddam nakazuje rozmieszczenie setek min przeciwpiechotnych w regionie Kurdystanu w celu zwalczania powstańców!"
 iraq_md.315.d: "Bez konsultacji ze swoimi doradcami wojskowymi Saddam nakazał rozmieszczenie setek min na granicy Kurdystanu w celu zwalczania lokalnych grup powstańczych. Nakaz ten został szybko wykonany przez tych, którzy go otrzymali, ponieważ uważali, że jest on poważny ze względu na niedawny wzrost liczby ataków. Ale teraz najważniejsi doradcy Saddama ostrzegają, że miny mogą wyrządzić poważne szkody naszym żołnierzom."
 iraq_md.315.a: "O o..."
 iraq_md.316.t: "Saddam Husajn zostaje zabity przez minę"
 iraq_md.316.d: "Kilka miesięcy temu Saddam Husajn zdecydował, że chce umieścić setki min lądowych w pobliżu granicy z Kurdami, aby zapobiec atakom lokalnych powstańców. Czując, że Kurdowie go nie lubią, Saddam poczuł się zmuszony odwiedzić ten region samotnie i spotkać się z miejscowymi w ramach okazania dobrej wiary. Następnie Saddam wziął samochód z pałacu i godzinami jechał do granicy z Kurdystanem. Paliwa w samochodzie wystarczyło, aby dowieźć go do granicy, a gdy w samochodzie skończyło się paliwo, Saddam ruszył pieszo. Zapominając o minach, gdzieś po drodze Saddam nadepnął na minę i zginął na miejscu."
 iraq_md.316.a: "Spoczywaj w pokoju, nasz ukochany przywódco"
 IRQ_temp_medical_cost: "Opłaty szpitalne"
 IRQ_saddam_ages_TT: "§HSaddam Husajn§! będzie się starzeć i §RZerży na chorobę Alzheimera!§!"
 IRQ_saddam_is_saddened_TT: "§HSaddam staje się smutny§!"
 IRQ_alzheimers_TT: "Due to §RSaddam's Alzheimer's§!, we may get events about §HSaddam's§! erratic behavior!"
 IRQ_saddams_pissfits: "£SOV_paranoia_text_icon Wściekłość [IRQ.GetLeader]"
 IRQ_saddams_pissfits_desc: "Przez całe życie §H[IRQ.GetLeader]§! nie był w stanie kontrolować swojego £SOV_paranoia_text_icon §RWściekłość§!. Często kieruje swoją złość w stronę personelu wojskowego £personnel_cost_multiplier_modifier_texticon lub ludzi mieszkających w [IRQ.GetFlag] §HIraq§!. Jego £SOV_paranoia_text_icon §RWściekłość§! wzbudza w ludziach strach, co może sprawić, że będą mniej skłonni do potknięć, ale ma to swoją cenę.\n\n£SOV_paranoia_text_icon §RWściekłość§! wzrośnie poprzez pewne §HWydarzenia, decyzje i cele§! Jeśli £stability_texticon §HStabilność§! jest niższa niż §H40%§!, wówczas £SOV_paranoia_text_icon §RWściekłość§! będziesz mieć szansę na zaznaczenie §H1§! co miesiąc. Jeśli £SOV_paranoia_text_icon §RWściekłość§! jest wyższa niż §H25%§!, wystąpią zdarzenia losowe z konsekwencjami, które zostaną wywołane. Jeśli £SOV_paranoia_text_icon §RWściekłość§! kiedykolwiek trafi §H50%§!, §H[IRQ.GetLeader]§! wykona losową £personnel_cost_multiplier_modifier_texticon General.£SOV_paranoia_text_icon §RWściekłość§! będzie stopniowo spadać, jeśli £stability_texticon §HStabilność§! wynosi §H40%§! lub wyższy.\n\n£SOV_paranoia_text_icon  §RWściekłość§!: [?IRQ_saddam_pissboy|%]"
