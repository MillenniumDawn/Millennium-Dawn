 Sweden_foci.3002.d3: "프랑스가 AS565 팬서 헬리콥터를 조달하겠다는 스웨덴의 요청을 승인했으며, 이는 양국 간 방위 협력의 중요한 진전입니다."
 Sweden_foci.3002.o1: "도입 및 현대화 계획을 진행한다"
 Sweden_foci.3003.t: "거부된 스웨덴의 공격 헬리콥터 도입 요청"
 Sweden_foci.3003.d1: "미국이 전략적 고려와 기존 약속을 이유로 AH-64 아파치 헬리콥터를 조달하겠다는 스웨덴의 요청을 거절했습니다."
 Sweden_foci.3003.d2: "러시아가 지정학적 파장과 전략적 우선순위를 이유로 Ka-52 앨리게이터 헬리콥터를 구매하겠다는 스웨덴의 제안을 거절했습니다."
