 GRAND_DOCTRINE_EQUIPMENT_SPEARHEAD_DESC: "Эта грандиозная доктрина обеспечивает вооружение сил таким образом, что каждый элемент штурмового эшелона перемещается под бронёй, концентрируя защищённую мобильность вокруг единого проникающего удара. Концепции оснащения передового отряда делают упор на механизированную глубину и поддержание инерции в точке основного действия за счёт снижения возможностей пешего удержания."
