 bos_srpska_gui_info_TOOLTIP: "§Y塞尔维亚人§!大多位于塞族共和国境内，这是属于波斯尼亚-黑塞哥维那联邦的部分土地，从东部至北部。塞族共和国是波斯尼亚和黑塞哥维那境内的一个自治实体。他们主要信奉东正教。"
 bos_bosniak_gui_info_TOOLTIP: "§Y波斯尼亚人§!是一个共同拥有波斯尼亚和黑塞哥维那联邦实体的民族群体，不要与波斯尼亚和黑塞哥维尼亚这个国名相混淆。他们大多居住在波斯尼亚中部地区，信仰也主要是穆斯林。"
 bos_croat_gui_info_TOOLTIP: "§Y克罗地亚人§!是波斯尼亚和黑塞哥维那联邦中的少数族群。他们大多生活在波斯尼亚西南沿克罗地亚南部海岸线线的边界，信仰主要是天主教。"
