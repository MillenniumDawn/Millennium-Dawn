 CZE_attack_helicopter_1: "밀 Mi-171Š"
 CZE_attack_helicopter_1_desc: "자체 개조한 Mi-8/Mi-17/Mi-18을 날개 하부 파일런에 공대지 미사일(AGM)과 공대공 미사일(AAM)을 장착한 기본 공격 헬리콥터로 만든 기종입니다. 기체 내부에 여전히 승객 16명을 수송할 수 있습니다."
 CZE_attack_helicopter_2: "Mi-24D"
 CZE_attack_helicopter_2_desc: "소련 Mi-24의 자국 생산 수출형으로, 새로운 체코산 소프트웨어와 하드웨어를 적용했으며 새 센서 배열, 광학 장비, 헬리콥터 전체의 네트워크 구성을 현대 표준으로 단순화하는 개량이 포함됩니다."
 CZE_attack_helicopter_3: "Mi-35M"
 CZE_attack_helicopter_3_desc: "Mi-35M은 이 기체의 1차 현대화 개량형입니다. 날개 하부에 파일런 6개를 갖추어 최신 세대의 다양한 유도 및 무유도 무기 체계나 건포드를 탑재할 수 있습니다."
 CZE_attack_helicopter_4: "BV-38 블레스크"
 CZE_attack_helicopter_4_desc: "과거 헬리콥터 개량 및 사업에서 얻은 경험 덕분에 독자적인 전투 헬리콥터를 설계할 수 있었습니다. 그 결과가 BV-38 블레스크로, 주 회전익 외에 추진식 프로펠러를 갖추어 시속 450km라는 놀라운 속도로 비행할 수 있습니다. 이는 기체 형상을 매우 유선형이자 공기역학적으로 만들고 모든 무장을 내부 무장창에 넣음으로써 달성되었습니다. 비상 상황에서는 이 내부 공간에서도 헬리콥터 전방 90도 반경으로 발사할 수 있는 공대공 미사일 두 발이 항상 대기하고 있습니다."
 CZE_attack_helicopter_5: "BV-43 비흐르"
 CZE_attack_helicopter_5_desc: "코드명 BV-40, 41, 42의 초기 스텔스 헬리콥터 시제기들의 능력을 결합하여 이 기체가 탄생했습니다. BV-38의 여러 특징을 이어받았으며, BV-38과 달리 필요할 때에도 외부 파일런이 전혀 없도록 미사일용 내부 자동 재장전 장치를 갖추고 있습니다. 미사일용 발사통 4개에는 공대지 미사일 2발과 공대공 미사일 2발이 장전되어 있으며, 자동 재장전 장치에 각 종류가 16발씩 더 들어 있습니다."
 CZE_transport_helicopter_1: "밀 Mi-4 CZ"
 CZE_transport_helicopter_1_desc: "소련 Mi-4의 자국 생산형으로 각종 화물 수송과 병력 공수 강하에 사용되며, 새 엔진을 장착하고 기체 내부 공간을 개조하여 더 넓은 화물 공간과 새로운 조종석 설계를 갖추었습니다."
 CZE_transport_helicopter_2: "밀 Mi-17M CZ"
 CZE_transport_helicopter_2_desc: "소련 Mi-8의 자국 생산형으로 승객 16명과 조종사 2명을 수송할 수 있는 대형 화물 수송기로 쓰입니다. 새로운 디지털 조종석과 측면 장착 기관총을 갖추고 있습니다."
 CZE_transport_helicopter_3: "V-5 콜로브라테크"
 CZE_transport_helicopter_3_desc: "과거 헬리콥터 개량 및 사업에서 얻은 경험 덕분에 기체를 처음부터 직접 설계할 수 있었습니다. 그 결과가 V-1, 2, 3, 4 시제기이며, 첫 양산형이 V-5입니다. 26m 로터 블레이드를 갖추어 수 톤의 화물이나 소형 차량을 운반할 수 있습니다."
 CZE_transport_helicopter_4: "V-15 스코칸"
 CZE_transport_helicopter_4_desc: "이 헬리콥터는 날개에 로터 두 개를 장착하여 더 많은 화물이나 승객을 목적지까지 수송할 수 있습니다. 방어용 무장과 공대공 미사일도 갖추고 있습니다."
 CZE_transport_helicopter_5: "V-41 소콜"
 CZE_transport_helicopter_5_desc: "레이더 흡수 소재를 입힌 공기역학적 기체를 갖춘 스텔스 헬리콥터로, 화물과 선택 장착 무장을 내부 무장창에 수납합니다."
