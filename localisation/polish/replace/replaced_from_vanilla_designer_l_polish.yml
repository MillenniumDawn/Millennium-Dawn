 DIVISION_MODIFICATION_LESS_EQUIPMENT_NEEDED: "\t- $AMOUNT|H0$ mniej $EQUIPMENT|H$ potrzebnych do skompletowania brygad"
 DIVISION_MODIFICATION_NEED_NOT_FILLED_GARRISON: "\t- $AMOUNT|H0$ dodatkowy $EQUIPMENT|H$ potrzebny do uzupełnienia brygad i garnizonów (§R$STOCK_AMOUNT|H0^$ dostępny§!)"
 DIVISION_MODIFICATION_NEED_FILLED_GARRISON: "\t- $AMOUNT|H0$ dodatkowych $EQUIPMENT|H$ potrzebnych do uzupełnienia brygad i garnizonów ( $STOCK_AMOUNT|H0^$ dostępnych )"
