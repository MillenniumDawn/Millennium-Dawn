 MER_invite_PRU_full_member_desc: "페루를 준회원국에서 메르코수르 정회원국으로 격상하기 위한 협상을 시작합니다.$MER_full_membership_acceptance_hint_desc$$MER_full_membership_invite_process_desc$"
