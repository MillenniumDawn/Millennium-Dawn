 landmark_binnenhof: "Le Binnenhof"
 landmark_binnenhof_desc: "Le Binnenhof, un centre historique de la gouvernance néerlandaise, est depuis des siècles un symbole de démocratie et de leadership. Servant de cœur de la vie politique des Pays-Bas, il continue de façonner l'avenir de la nation tout en préservant sa riche histoire."
