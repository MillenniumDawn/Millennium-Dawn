 hongkong.8.t: "L'année du Dragon"
 hongkong.8.d: "Trois ans se sont écoulés depuis la réunification avec le continent. Hong Kong a traversé la crise financière asiatique sans le déclin que l'Occident prédisait. Alors que le nouveau millénaire se lève, la ville continuera de prouver que l'intégration à la Chine n'est pas une mauvaise chose."
 hongkong.8.a: "San Nin Faa Lok! (Bonne année !)"
 hongkong.9.t: "Hong Kong cherche notre matériel"
 hongkong.9.d: "La police de Hong Kong a passé commande d'armes légères de fabrication chinoise. Le volume est modeste, mais le symbolisme est grand : c'est le premier achat de sécurité formel de HKG auprès d'un fournisseur continental. Les médias d'État présentent déjà l'accord comme un signe de la confiance croissante de la RAS dans l'industrie de la mère patrie."
 hongkong.9.a: "Approuver à des taux avantageux"
 hongkong.9.b: "Utiliser le moment pour la propagande d'État"
 hongkong.13.t: "Pékin répond"
 hongkong.13.d: "Un mois après l'appel du LegCo à libérer les dissidents du continent, le bureau de liaison adresse une vive réprimande. Les médias d'État accusent les politiciens de Hong Kong d'« ingérence dans les affaires intérieures de la République populaire ». Une poignée de détenus de bas profil sont discrètement libérés ; bien davantage restent derrière les barreaux. Le camp pan-démocrate est furieux, le camp patriotique triomphant."
 hongkong.13.a: "Saluer les libérations partielles"
 hongkong.13.b: "Condamner les reproches de Pékin"
 hongkong.13.c: "Laisser tomber l'affaire en silence"
 HKG_aukus_request_tt: "§Y[ROOT.GetNameDef]§! §Ydemandera§! un accès au partage de renseignement à §H[ENG.GetName]§!, §H[USA.GetName]§! et §H[AST.GetName]§!. Ils peuvent refuser."
 HKG_uk_garrison_request_tt: "§H[ENG.GetName]§! sera invité à stationner des forces à Hong Kong. Ils peuvent refuser."
 hongkong.14.t: "La question de Hong Kong"
 hongkong.14.d: "Deux millions dans les rues de Hong Kong. Le mouvement anti-extradition a ébranlé l'ordre politique de la RAS jusqu'au cœur. Les responsables pro-Pékin exigent une action plus ferme ; les pragmatiques du Conseil d'État préviennent qu'un excès d'autorité fera fuir les capitaux étrangers. Le Comité permanent du Politburo décidera de la réponse."
 hongkong.14.a: "Serrer notre emprise : statut de marionnette formel"
 hongkong.14.b: "Faire preuve de retenue : préserver le cadre"
 hongkong.15.t: "Hong Kong cherche à accéder à AUKUS"
 hongkong.15.d: "Le gouvernement pro-occidental de Hong Kong a formellement demandé un partage de renseignement et un accès de basing. La valeur stratégique d'un port ami au bord sud de la Chine est substantielle, mais Pékin y verra un acte hostile, et les implications sécuritaires coupent dans les deux sens. La question va au Conseil de sécurité nationale."
 hongkong.15.a: "Accorder l'accès : Hong Kong est un atout stratégique."
 hongkong.15.b: "Refuser : tenir Pékin à distance"
 hongkong.16.t: "Hong Kong invite une garnison britannique"
 hongkong.16.d: "Le gouvernement de Hong Kong a formellement invité le Royaume-Uni à rétablir une garnison militaire permanente dans la RAS. Le symbolisme serait extraordinaire ; les retombées diplomatiques avec Pékin, sévères. Le dossier du secrétaire à la Défense atterrit sur la table du Cabinet."
 hongkong.16.a: "Accepter : rétablir la présence britannique"
 hongkong.16.b: "Décliner : le coût diplomatique est trop élevé"
 hongkong.10.t: "La question du suffrage universel"
 hongkong.10.d: "Aux termes de la Loi fondamentale, les deux premiers chefs de l'exécutif et les trois premiers Conseils législatifs ont été désignés par le comité électoral plutôt que par le suffrage universel. L'élection du chef de l'exécutif de 2007 et l'élection du LegCo de 2008 présentent l'occasion de décider si le système démocratique de Hong Kong doit être réformé, le suffrage universel intégral étant l'objectif ultime."
 hongkong.10.a: "Le système électoral de Hong Kong maintiendra le statu quo."
 hongkong.10.b: "Nous ne sommes pas favorables au suffrage universel immédiat, mais nous soutiendrons une réforme électorale graduelle et ordonnée."
 hongkong.10.c: "Autant être radicaux et simplement autoriser le suffrage universel !"
 hongkong.11.t: "PCCW fusionne avec HKT"
 hongkong.11.d: "Cable & Wireless a annoncé des plans de vente de Hong Kong Telecom à SingTel, malgré les objections du gouvernement chinois. PCCW, contrôlé par Li Tzar-kai, fils de Li Ka-shing, est entré dans les enchères et l'a emporté. Après l'annonce de la fusion, le cours de PCCW a bondi de quelques cents à 28,50 HKD à la clôture, poussant brièvement sa capitalisation au-dessus de 250 milliards de HKD."
 hongkong.11.a: "Internet est une si grande chose !"
 hongkong.12.t: "L'impact de l'éclatement de la bulle Internet"
 hongkong.12.d: "À l'éclatement de la bulle Internet, le cours de PCCW s'est effondré de 98 %, quelques mois seulement après que la fusion avec Hong Kong Telecom l'avait fait s'envoler. La société s'est retrouvée avec des fonds propres nettement négatifs et n'a eu d'autre choix que de planifier la vente de son activité principale pour alléger ses difficultés financières."
 hongkong.12.a: "Nouveau millénaire, nouveaux problèmes."
 hongkong_legco.1.t: "Les sièges du LegCo de [GetYear]"
 hongkong_legco.1.d: "Le Conseil législatif se réunit pour la nouvelle législature. Les sièges des circonscriptions géographiques et fonctionnelles ont été décomptés et les majorités de travail de la chambre sont désormais connues. Les votes de motion exigeront [?HKG_legco_required_seats] sièges pour passer ; les motions constitutionnelles exigeront [?HKG_legco_specially_required_seats]."
 hongkong_legco.1.a: "Je l'ai compris."
 hongkong_news.4.t: "L'Alliance démocratique 123 est dissoute aujourd'hui"
 hongkong_news.4.d: "Établie en 1994 par un groupe de politiciens pro-Taïwan, pro-démocratie et pro-affaires, l'Alliance démocratique 123 a été dissoute faute de soutien financier du gouvernement taïwanais après la défaite du Kuomintang à l'élection présidentielle."
 hongkong_news.4.a: "Bonne nouvelle, n'est-ce pas ?"
 hongkong_news.4.b: "Je l'ai compris."
 hongkong_news.5.t: "Épidémie de SRAS"
 hongkong_news.5.d: "Une épidémie d'un virus de pneumonie sévère dit « SRAS » s'est produite au Guangdong et à Hong Kong. Malgré les affirmations des responsables continentaux qu'elle a été efficacement contenue, l'épidémie se poursuit à Hong Kong. L'OMS a désormais émis un avertissement aux voyageurs pour la Chine du Sud et Hong Kong. Elle dit que cela pose une menace sanitaire mondiale. Jusqu'à présent une personne en est morte. Le gouvernement de Hong Kong a commencé des mesures de quarantaine obligatoire pour les personnes soupçonnées d'être infectées."
 hongkong_news.5.a: "Notre secteur touristique est en difficulté."
 hongkong_news.5.b: "Arrêter les responsables incompétents et gérer l'épidémie en toute transparence."
 hongkong_news.5.c: "Nous devons continuer de cacher les vraies données pour préserver la stabilité sociale."
 hongkong_news.5.e: "Une évolution inquiétante."
 hongkong_news.6.t: "La disparition de Leslie Cheung"
 hongkong_news.6.d: "Le chanteur, acteur et icône hongkongais de renommée mondiale Leslie Cheung s'est suicidé à 46 ans en sautant d'un immeuble de l'hôtel Mandarin à Hong Kong, miné par la dépression. Leslie Cheung a conquis d'innombrables fans par ses chansons, son jeu et son charisme unique. Sa mort a choqué toute la communauté chinoise, plongeant beaucoup dans une profonde tristesse.\nLa disparition de Leslie Cheung n'est pas seulement une perte majeure pour le monde du spectacle, mais aussi un choc culturel et spirituel. Sa musique et ses films continueront d'influencer et d'inspirer artistes et publics à venir, mais son absence laissera à jamais un vide impossible à combler.\nLa disparition de Leslie Cheung n'est pas seulement une perte significative pour l'industrie du divertissement, mais aussi un choc culturel et spirituel. Sa musique et ses films continueront d'influencer et d'inspirer artistes et publics à venir, mais son absence laissera à jamais un vide impossible à combler.\nLa disparition de Leslie Cheung n'est pas seulement une perte majeure pour le divertissement, mais aussi un choc culturel et spirituel. Sa musique et ses films continueront d'influencer et d'inspirer artistes et publics à venir, mais son absence laissera à jamais un vide impossible à combler."
 hongkong_news.6.a: "Nous avons perdu un grand artiste aujourd'hui."
 hongkong_news.7.t: "La disparition d'Anita Mui"
 hongkong_news.7.d: "Anita Mui Yim-fong, largement connue comme la « Madonna de l'Asie », est morte à 40 ans après un combat courageux contre un cancer du col de l'utérus.\n\nNée en 1963, Anita Mui s'est imposée dans les années 1980, figure centrale de la cantopop, laissant un héritage durable. Son engagement caritatif et sa force face à la maladie lui ont valu une profonde admiration.\nNée en 1963, Anita Mui s'est imposée dans les années 1980, figure centrale de la scène cantopop, laissant un héritage durable à des millions de fans. Son dévouement à la charité et sa force inébranlable face à la maladie lui ont valu une profonde admiration. Alors que la nouvelle de sa disparition se répand, une atmosphère sombre enveloppe le pays, et le peuple s'unit pour honorer la bien-aimée Fille de Hong Kong.\nNée en 1963, Anita Mui s'est élevée à la célébrité dans les années 1980, devenant une figure pivot de la scène cantopop et laissant un héritage durable à des millions de fans. Son dévouement à la charité et sa force inébranlable face à la maladie lui ont valu une profonde admiration. Tandis que la nouvelle de sa disparition se répand, une humeur sombre enveloppe la nation, les gens se rassemblant pour honorer la bien-aimée « fille de Hong Kong ».\nNée en 1963, Anita Mui s'est élevée dans les années 1980, devenant une figure pivot de la scène cantopop et laissant un héritage durable à des millions de fans. Son dévouement à la charité et sa force inébranlable face à la maladie lui ont valu une profonde admiration. À mesure que la nouvelle se répand, une humeur sombre enveloppe la nation, les gens se réunissant pour honorer la bien-aimée « Fille de Hong Kong »."
 hongkong_news.7.a: "La fin d'une grande ère."
 hongkong_news.8.t: "Forte tempête tropicale Utor"
 hongkong_news.8.d: "Le 4 juillet à 17 h 45, le typhon Yuet entre dans la zone d'alerte de 800 kilomètres, ce qui pousse l'observatoire de Hong Kong à émettre le signal de veille n° 1. Le 5 juillet à 19 h 30, le signal est relevé au signal de coup de vent ou de tempête n° 8, première émission de ce signal au XXIe siècle. En raison des ondes de tempête, la combinaison de la surcote et de la marée haute du matin porte le niveau de la mer à 3,4 mètres à Quarry Bay, le plus haut depuis le passage du typhon Wanda à Hong Kong en 1962. Cela provoque de graves inondations à Tai O et dans le nord-ouest des Nouveaux Territoires le 6 juillet. Certaines rues principales de Tai O se transforment en rivières, avec des hauteurs d'eau allant jusqu'à trois mètres. Le marché de gros des fruits de mer de Lau Fau Shan est également inondé, forçant de nombreuses boutiques à fermer."
 hongkong_news.8.a: "L'Observatoire a fait son travail."
 hongkong_news.9.t: "Forte tempête tropicale Yutu (Lapin lunaire)"
 hongkong_news.9.d: "La tempête tropicale Yutu a pénétré la zone d'alerte de l'Observatoire de Hong Kong, déclenchant un signal de veille n°1. Les horaires de transport public ont été ajustés, les écoles mises en veille de tempête, et les services de drainage et d'urgence de la ville ont été activés. L'Observatoire s'attend au pire dans les vingt-quatre prochaines heures."
 hongkong_news.9.a: "S'abriter et attendre que ça passe."
 HKG_european_bussiness_opinion: "Améliorer le commerce avec les hommes d'affaires européens"
 HKG_chinese_entrepreneurs_opinion: "Améliorer le commerce avec nos entrepreneurs du continent"
 HKG_protest_movement_rises: "Les manifestations commencent"
 HKG_protest_movement_rises_desc: "Des centaines de milliers déferlent dans les rues. Le monde regarde. Pékin aussi."
 HKG_loyalist_consolidation: "Consolidation loyaliste"
 HKG_loyalist_consolidation_desc: "Les factions pro-Pékin resserrent leur emprise sur le Conseil législatif et les nominations de la fonction publique."
 HKG_umbrella_revolution: "La révolution des parapluies"
 HKG_umbrella_revolution_desc: "Étudiants et militants occupent les artères principales de la ville. Les parapluies jaunes deviennent le symbole des espoirs d'une génération."
 HKG_democratic_opposition_network: "Réseau de l'opposition démocratique"
 HKG_democratic_opposition_network_desc: "Partis pan-démocrates et groupes de la société civile forment une large coalition pour contester les empiétements de Pékin."
 HKG_nsl_imposed: "Loi sur la sécurité nationale"
 HKG_nsl_imposed_desc: "Pékin contourne entièrement le Conseil législatif. Du jour au lendemain, manifestation, subversion, sécession et collusion avec des forces étrangères deviennent des crimes passibles de la prison à vie."
 HKG_press_freedom_crackdown: "Faire taire la presse"
 HKG_press_freedom_crackdown_desc: "Apple Daily est perquisitionné et fermé. L'indépendance éditoriale de RTHK est ôtée. Les dernières voix libres sont éteintes."
 HKG_police_state_apparatus: "Police de la main de fer"
 HKG_police_state_apparatus_desc: "La police étend ses pouvoirs sous les dispositions de la LNS. Escouades anti-émeute, opérations sous couverture et arrestations de masse deviennent routine."
 HKG_dialogue_with_protesters: "Commission de dialogue"
 HKG_dialogue_with_protesters_desc: "Une dernière tentative désespérée de médiation avant que la répression ne devienne totale. Des observateurs indépendants sont invités à examiner la conduite de la police."
 HKG_anti_extradition_bill: "La crise du projet de loi d'extradition"
 HKG_anti_extradition_bill_desc: "Une loi proposée permettant l'extradition vers la Chine continentale enflamme les plus grandes manifestations de l'histoire de Hong Kong. Deux millions défilent."
 HKG_youth_resistance_cells: "Résistance des jeunes"
 HKG_youth_resistance_cells_desc: "De vaillants jeunes Hongkongais forment des unités de première ligne. La génération vêtue de noir combat avec bombes à essence et parapluies contre gaz lacrymogènes et balles en caoutchouc."
 HKG_emigration_wave: "Le grand exode"
 HKG_emigration_wave_desc: "Des centaines de milliers partent pour le Royaume-Uni, le Canada et l'Australie sous les régimes BN(O). Hong Kong se vide de sa classe professionnelle."
 HKG_preserve_financial_hub: "Préserver la plaque financière"
 HKG_preserve_financial_hub_desc: "Les élites des affaires font pression sur Pékin : la valeur de Hong Kong tient à son cadre juridique distinct et à ses connexions internationales. Détruire cela, c'est tout détruire."
 HKG_foreign_business_exodus: "Fuite des capitaux étrangers"
 HKG_foreign_business_exodus_desc: "Banques, cabinets d'avocats et multinationales déplacent discrètement leurs sièges régionaux vers Singapour et Tokyo. La couronne financière glisse."
 HKG_western_sanctions_threat: "Menace de sanctions occidentales"
 HKG_western_sanctions_threat_desc: "Les États-Unis, le Royaume-Uni et l'UE examinent le statut commercial spécial de Hong Kong. L'accès privilégié de la ville aux marchés occidentaux est en jeu."
 HKG_deeper_mainland_integration: "Intégration plus approfondie du continent"
 HKG_deeper_mainland_integration_desc: "L'initiative de la Grande baie attire Hong Kong dans l'orbite économique de la Chine. Infrastructures, finance et gouvernance convergent lentement."
 HKG_patriotic_education: "Éducation patriotique"
 HKG_patriotic_education_desc: "Un nouveau programme réécrit l'histoire. La prochaine génération apprendra que Hong Kong a toujours été, et sera toujours, chinois."
 HKG_last_stand_opposition: "Le dernier stand démocratique"
 HKG_last_stand_opposition_desc: "Les figures pro-démocratie survivantes refusent d'être réduites au silence. Depuis l'exil à Londres et Washington, elles continuent de faire pression sur le monde, sachant qu'elles ne rentreront peut-être jamais."
 HKG_absorption_complete: "Absorption terminée"
 HKG_absorption_complete_desc: "Un pays. Un système. L'expérience est terminée. L'identité unique de Hong Kong n'existe plus que dans la mémoire et la diaspora."
 HKG_city_of_resistance: "Cité de la résistance"
 HKG_city_of_resistance_desc: "Contre toute attente, l'esprit de résistance endure. Hong Kong devient un symbole pour les démocraties du monde, la preuve que certaines choses valent d'être défendues même quand les chances sont impossibles."
 HKG_silenced_press: "Presse silencieuse"
 HKG_silenced_press_desc: "Faire taire la presse facilitera l'intégration, mais il faut agir vite avant que la colère publique n'atteigne le point de rupture."
 HKG_annexation: "Annexion de Hong Kong"
 HKG_annexation_desc: "Hong Kong est devenu la région administrative spéciale modèle de Pékin — obéissante, prospère, intégrée. Le Politburo récompense la loyauté par un accès commercial préférentiel, des flux de main-d'œuvre du continent et des investissements d'infrastructure. Les privilèges tiennent tant que Hong Kong reste une partie de la République populaire."
 HKG_democratic_reform_initiative: "Initiative de réforme démocratique"
 HKG_democratic_reform_initiative_desc: "La voie pacifique a porté ses fruits. Avec une société civile organisée, une presse protégée et le LegCo qui s'ouvre, la RAS s'engage formellement dans un programme de réforme démocratique. Les institutions existent ; il s'agit désormais de les renforcer."
 HKG_universal_suffrage_amendment: "Amendement sur le suffrage universel"
 HKG_universal_suffrage_amendment_desc: "Chaque Hongkongais adulte obtient un bulletin, chaque mandat électif se dispute, et le comité de nomination est dissous. L'amendement passe au LegCo et devient un droit constitutionnel. Pékin proteste ; Hong Kong célèbre."
 HKG_independent_judiciary_reform: "Réforme d'une justice indépendante"
 HKG_independent_judiciary_reform_desc: "La Cour d'appel final est affranchie des vetos politiques, les procureurs opèrent à distance de l'exécutif, et les nominations judiciaires sont examinées par une commission indépendante. Une magistrature digne de l'État de droit qu'elle interprète."
 HKG_freedom_of_information_act: "Loi sur l'accès à l'information"
 HKG_freedom_of_information_act_desc: "Les dossiers gouvernementaux deviennent accessibles au public par défaut. Les lanceurs d'alerte bénéficient d'une protection légale. L'idée de presse muselée est abandonnée, et le journalisme à Hong Kong devient la denrée la plus rare de la région : une presse libre dans une ville chinoise."
 HKG_democratic_consolidation: "Consolidation démocratique"
 HKG_democratic_consolidation_desc: "Le suffrage universel, une magistrature indépendante et une presse libre se renforcent désormais mutuellement. Hong Kong s'impose comme la société chinoise la plus démocratique de l'histoire. Les réformes ne sont plus réversibles par ordonnance ; elles sont le nouveau fondement."
 HKG_infrastructure_megaproject: "Mégaprojet d'infrastructure"
 HKG_infrastructure_megaproject_desc: "Le Lands Department dresse un plan directeur : la croissance de Hong Kong pour la décennie à venir dépend d'une construction vers l'extérieur, vers le haut et sous terre. Le Trésor s'ouvre. Les contrats sont signés. Les grues arrivent."
 HKG_mtr_expansion_phase_2: "Phase 2 d’extension du MTR"
 HKG_mtr_expansion_phase_2_desc: "Prolongements de la West Rail Line, du Shatin-Central Link, et un corridor North Island promis de longue date. Les temps de trajet chutent, les valeurs immobilières montent le long des nouvelles stations, et le réseau MTR atteint des quartiers qui attendaient depuis l'ère britannique."
 HKG_third_runway_chek_lap_kok: "Troisième piste à Chek Lap Kok"
 HKG_third_runway_chek_lap_kok_desc: "Les travaux de poldérisation seuls prennent des années et le coût est colossal, mais Hong Kong International ne peut rester un aéroport à deux pistes tandis que Singapour et Shanghai s'étendent. La troisième piste assure à la ville sa place de hub aérien régional."
 HKG_lantau_tomorrow_vision: "Vision de demain de Lantau"
 HKG_lantau_tomorrow_vision_desc: "Le projet de poldérisation le plus ambitieux de l'histoire de Hong Kong : des îles artificielles à l'est de Lantau, des logements pour des centaines de milliers de personnes, un nouveau quartier d'affaires. Les écologistes s'y opposent ; les mal-logés acclament. Le coût politique est réel, le gain en terres utilisables est énorme."
 HKG_smart_city_initiative: "Initiative de ville intelligente"
 HKG_smart_city_initiative_desc: "La 5G à l'échelle de la ville, une gestion intégrée du trafic, une identité numérique pour chaque résident, et une API de services publics qui permet aux start-up de s'appuyer sur les données de la RAS. Hong Kong passe de prospère à programmable."
 HKG_world_class_infrastructure: "Infrastructure de classe mondiale"
 HKG_world_class_infrastructure_desc: "Routes, rails, port, aéroport, fibre et terres gagnées sur la mer, tous modernisés de concert. L'infrastructure d'une ville conçue pour la seconde moitié du XXIe siècle, enfin livrée."
 HKG_hospital_authority_reform: "Réforme de l'autorité hospitalière"
 HKG_hospital_authority_reform_desc: "L'Hospital Authority est restructurée pour plus de transparence, d'efficacité et un financement fondé sur les résultats. Les délais d'attente commencent à baisser, l'écart entre soins publics et privés se réduit, et les bases d'un système moderne sont posées."
 HKG_pandemic_preparedness: "Préparation à une pandémie"
 HKG_pandemic_preparedness_desc: "Le SRAS a enseigné à la ville une leçon brutale ; le nouveau Centre de protection de la santé veille à ce qu'elle ne s'oublie pas. Stocks d'EPI, capacité de traçage des contacts et surveillance intégrée avec l'OMS. La prochaine épidémie ne prendra pas Hong Kong au dépourvu."
 HKG_chinese_medicine_integration: "Intégration de la médecine chinoise"
 HKG_chinese_medicine_integration_desc: "La médecine traditionnelle chinoise est intégrée au système de santé public : praticiens réglementés, ailes hospitalières, subventions universitaires. Les patients qui veulent les deux univers les obtiennent, et Pékin y voit un respect culturel."
 HKG_universal_healthcare_voucher: "Chèque Santé Universel"
 HKG_universal_healthcare_voucher_desc: "Chaque résident reçoit un bon annuel valable en clinique publique ou privée. La couverture devient universelle dans les faits autant que dans le nom, et les travailleurs pauvres cessent de choisir entre le loyer et une consultation."
 HKG_public_health_modernisation: "Modernisation de la santé publique"
 HKG_public_health_modernisation_desc: "Nouveaux centres de cancérologie, services de santé mentale élargis, hôpitaux modernisés à travers les New Territories. La médecine elle-même rattrape la réforme institutionnelle."
 HKG_healthcare_excellence: "Excellence des soins de santé"
 HKG_healthcare_excellence_desc: "L'espérance de vie de Hong Kong figure déjà parmi les plus élevées au monde ; le système qui l'a produite est désormais à la hauteur de ce chiffre. Un modèle que les régions voisines commencent à étudier et à imiter."
 HKG_labour_reform_charter: "Charte de réforme du travail"
 HKG_labour_reform_charter_desc: "La première révision d'ensemble du code du travail hongkongais depuis des décennies. Ateliers de misère, heures supplémentaires non payées, abus dans les dortoirs et exploitation du secteur informel sont nommés, mesurés et inscrits à l'agenda législatif. Les syndicats s'en avisent."
 HKG_minimum_wage_ordinance: "Ordonnance sur le salaire minimum"
 HKG_minimum_wage_ordinance_desc: "Un salaire minimum légal, révisé tous les deux ans. Les conglomérats protestent au nom de la compétitivité ; les agents d'entretien et les employés de restauration voient leurs fiches de paie croître pour la première fois en une génération."
 HKG_collective_bargaining_rights: "Droits de négociation collective"
 HKG_collective_bargaining_rights_desc: "Les syndicats obtiennent une reconnaissance légale, les conventions collectives des dents juridiques, et le droit de grève est codifié plutôt que toléré. La Confederation of Trade Unions devient un véritable contrepoids aux chambres de commerce."
 HKG_foreign_domestic_helpers_protections: "Protections des aides domestiques étrangères"
 HKG_foreign_domestic_helpers_protections_desc: "Les travailleurs domestiques logés sur place, surtout philippines et indonésiennes, obtiennent des protections exécutoires contre les pires abus patronaux. Jours de repos obligatoires, clauses de contrat transparentes, et un régulateur doté de vrais pouvoirs. Une reconnaissance trop longtemps différée : ce sont des travailleurs, pas des domestiques."
 HKG_pension_scheme_reform: "Réforme du régime de retraite"
 HKG_pension_scheme_reform_desc: "Les pires traits du Mandatory Provident Fund — frais élevés, récupérations patronales, lacunes de cotisation — sont réformés. La pauvreté des personnes âgées à Hong Kong cesse d'être un scandale feutré."
 HKG_labour_dignity: "Dignité du travail"
 HKG_labour_dignity_desc: "Un plancher légal sous les salaires, des syndicats reconnus, des aides protégées, et une retraite qui verse vraiment une retraite. Travailler à Hong Kong devient enfin quelque chose qui ressemble à un emploi digne."
 HKG_renminbi_offshore_hub: "Hub offshore en renminbi"
 HKG_renminbi_offshore_hub_desc: "Pékin confie à Hong Kong le plus grand gisement de renminbi offshore au monde. Émissions d'obligations Dim Sum, swaps de devises et services de compensation pour toute la région transitent par Central. La proximité du continent paie."
 HKG_belt_and_road_financing: "Financement des Nouvelles routes de la soie"
 HKG_belt_and_road_financing_desc: "Hong Kong devient la porte financière des infrastructures des Nouvelles routes de la soie à travers l'Eurasie. Financement de projets, syndication d'obligations, règlement des différends : l'expertise de la RAS s'exporte aux côtés des capitaux chinois."
 HKG_green_finance_centre: "Centre de Finance Verte"
 HKG_green_finance_centre_desc: "Le HKEX lance un compartiment d'obligations vertes, la SFC publie des règles de divulgation climatique qui ont des dents, et Hong Kong se positionne comme la porte asiatique des capitaux ESG. Les fonds de pension européens s'en avisent. Les développeurs d'énergies renouvelables aussi."
 HKG_fintech_revolution: "Révolution Fintech"
 HKG_fintech_revolution_desc: "Licences de banques virtuelles, bacs à sable réglementaires et un système de paiements plus rapides qui tire enfin la finance de détail dans l'ère numérique. La prochaine génération de firmes financières naît à Cyberport, pas à Central."
 HKG_global_wealth_management: "Gestion de patrimoine mondiale"
 HKG_global_wealth_management_desc: "Compensation du renminbi, capitaux verts, rails fintech : Hong Kong se tient au centre des trois. La fortune mondiale se gère à travers la RAS. Les commissions à elles seules justifieraient l'existence de la ville."
 HKG_tourism_board_revival: "Relance de l'Office du tourisme"
 HKG_tourism_board_revival_desc: "Après la rétrocession, après le SRAS, après tout, le Tourism Board se relance : meilleur marketing, services aux visiteurs élargis, une marque cohérente pour la ville au-delà des platitudes d'« Asia's World City ». Les visiteurs s'en aperçoivent."
 HKG_disney_hong_kong: "Disneyland de Hong Kong"
 HKG_disney_hong_kong_desc: "L'île de Lantau accueille le plus petit des parcs Disney — et le plus accessible aux touristes du continent. La facture de construction est salée, le ruban est coupé dans le scintillement, et la RAS gagne un ancrage familial pour son économie touristique."
 HKG_cantopop_revival: "La renaissance du cantopop"
 HKG_cantopop_revival_desc: "Une vague d'investissement public, de quotas de diffusion et de soutien aux festivals ramène la musique populaire cantonaise à une pertinence commerciale. La confiance culturelle que le Cantopop incarnait jadis revient avec la musique."
 HKG_film_industry_renaissance: "Renaissance de l’industrie cinématographique"
 HKG_film_industry_renaissance_desc: "Les studios TVB s'étendent, les auteurs indépendants trouvent des financements, et le cinéma hongkongais retrouve l'aplomb des années quatre-vingt et quatre-vingt-dix. Pas seulement arts martiaux et polar : drame sérieux, comédie familiale, et une génération de nouveaux réalisateurs qui ont des histoires à raconter."
 HKG_west_kowloon_cultural_district: "Quartier culturel de Kowloon Ouest"
 HKG_west_kowloon_cultural_district_desc: "M+, le Palace Museum, le Xiqu Centre et une dizaine d'institutions plus petites sur ce qui n'était que des terres gagnées sur la mer. Un véritable quartier culturel qui permet à la ville de se raconter elle-même, dans des galeries et des théâtres plutôt que dans les halls de tours de verre."
 HKG_world_class_destination: "Destination de classe mondiale"
 HKG_world_class_destination_desc: "Tourisme, infrastructure, cuisine et culture au sommet ensemble. Hong Kong n'est plus seulement une escale ou une réservation financière, mais une destination à part entière — le genre de ville autour de laquelle les voyageurs construisent tout un séjour."
 HKG_consolidated_democracy: "Démocratie consolidée"
 HKG_consolidated_democracy_desc: "Les institutions démocratiques de Hong Kong se renforcent désormais d'elles-mêmes : presse libre, tribunaux indépendants, élections disputées. Une démocratie qui n'a plus besoin de la permission du gouvernement central pour fonctionner."
 HKG_modernised_infrastructure_idea: "Infrastructure modernisée"
 HKG_modernised_infrastructure_idea_desc: "Routes, rails, port et colonne numérique de Hong Kong sont portés aux normes mondiales de premier rang. Chaque secteur bénéficie du multiplicateur."
 HKG_modern_healthcare_system: "Système de santé moderne"
 HKG_modern_healthcare_system_desc: "Couverture universelle, hôpitaux modernisés et soins public-privé intégrés produisent certains des meilleurs résultats sanitaires au monde, à un coût soutenable."
 HKG_renminbi_hub_idea: "Hub du renminbi offshore"
 HKG_renminbi_hub_idea_desc: "Hong Kong est le premier centre mondial de compensation du renminbi offshore. Flux commerciaux, d'investissement et de couverture de change transitent par les banques et les Bourses de la RAS."
 HKG_green_finance_idea: "Centre de Finance Verte"
 HKG_green_finance_idea_desc: "La porte asiatique des capitaux alignés sur le climat. Obligations vertes, actions notées ESG et financement de projets renouvelables transitent par Central."
 HKG_tourism_boom: "Boom du tourisme"
 HKG_tourism_boom_desc: "Hong Kong est de nouveau une destination mondiale de premier rang. Les dépenses des visiteurs alimentent le commerce, l'hôtellerie et la culture ; l'humeur sociale s'élève avec les recettes."
 HKG_modernised_police_force: "Force de police modernisée"
 HKG_modernised_police_force_desc: "La police de Hong Kong opère avec une formation, un équipement et des normes procédurales à jour. Le maintien de l'ordre courant est plus efficace, le coût de la lutte contre le crime baisse, et la confiance du public dans la force se mesure dans les sondages."
 HKG_counter_terrorism_capability: "Capacité antiterroriste"
 HKG_counter_terrorism_capability_desc: "L'unité de réponse antiterroriste donne à la RAS une capacité spécialisée crédible face aux menaces organisées. Les services de renseignement étrangers ont plus de mal à opérer sans être détectés, et la Force dispose d'un petit cadre permanent d'opérations spéciales."
 HKG_riot_control_capability: "Capacité de contrôle des émeutes"
 HKG_riot_control_capability_desc: "La police dispose de véhicules blindés, de boucliers, de gaz et de protocoles de gestion des foules répétées. Les troubles sont contenus plus sûrement ; l'équipement de protection rappelle aussi visiblement que la RAS a choisi une certaine approche de l'ordre public."
 HKG_clean_police_force: "Une police propre"
 HKG_clean_police_force_desc: "Enquêtes internes, supervision de l'ICAC et un engagement public pour l'intégrité ont mesurablement réduit la corruption au sein de la Force. Les agents pris à recevoir des paiements des triades en subissent de vraies conséquences. La réputation de la Force — et son efficacité — s'améliorent toutes deux."
 hongkong_order.1.t: "Pressions liées à la transition civique"
 hongkong_order.1.d: "Les incidents d'ordre public de routine augmentent dans toute la RAS. Les causes varient — pression du logement, migration transfrontalière, frictions linguistiques et culturelles, incertitude économique dans certains quartiers. Aucun grief unique ne domine. On demande à la police comment répondre à une situation plus sociale que criminelle."
 hongkong_order.1.a: "Renforcer les patrouilles de quartier."
 hongkong_order.1.b: "Établir des programmes de liaison communautaire."
 hongkong_order.1.c: "Maintenir la posture actuelle."
 hongkong_order.2.t: "Coordination de la criminalité transfrontalière"
 hongkong_order.2.d: "L'unité de réponse antiterroriste a identifié des réseaux de crime organisé opérant de part et d'autre de la frontière RAS-continent. Une interdiction efficace exige une coordination avec la sécurité publique continentale, mais les cadres juridiques diffèrent et la Basic Law pose des limites à l'intégration opérationnelle. Le commissaire demande des orientations."
 hongkong_order.2.a: "Approfondir les opérations conjointes avec les autorités du continent."
 hongkong_order.2.b: "Maintenir des opérations indépendantes dans notre juridiction."
 hongkong_order.2.c: "Limiter la coopération aux seuls canaux formels."
 hongkong_order.3.t: "Manifestations devant Government House"
 hongkong_order.3.d: "Plusieurs milliers de manifestants se sont rassemblés devant Government House. Les griefs sont mêlés — accessibilité du logement, emploi, frustrations civiques plus difficiles à formuler. Certaines banderoles évoquent la rétrocession ; beaucoup non. La foule est bruyante mais pas violente. La Force doit décider d'une réponse."
 hongkong_order.3.a: "Ouvrir le dialogue avec les organisateurs."
 hongkong_order.3.b: "Maintenir un périmètre visible et attendre les événements."
 hongkong_order.3.c: "Autoriser la dispersion de la foule."
 hongkong_order.4.t: "Allégations de coopération entre la police et les triades"
 hongkong_order.4.d: "Le rapport d'un lanceur d'alerte allègue que des membres de la Force reçoivent des paiements pour fermer les yeux sur certaines opérations des triades. La pression politique pour enquêter est forte ; le syndicat de police met en garde contre le bouc émissaire avant toute procédure. On ne peut ignorer l'affaire."
 hongkong_order.4.a: "Ouvrez une enquête formelle via l’ICAC."
 hongkong_order.4.b: "Uniquement un examen disciplinaire interne."
 hongkong_order.4.c: "Traitez comme des incidents isolés."
 HKG_new_development_idea_buff: "Nouveau plan de développement"
 HKG_new_development_idea_buff_desc: "La phase transitoire du New Development Plan de la RAS. La recherche et les institutions politiques reçoivent un premier coup de pouce, mais l'économie supporte le coût de la restructuration — bureaux et biens de consommation sont temporairement perturbés le temps que le nouveau cadre entre en service."
 HKG_new_development_idea_buff_complete: "Nouveau plan de développement"
 HKG_new_development_idea_buff_complete_desc: "Le New Development Plan est pleinement opérationnel. Vitesse de recherche, efficacité de l'éducation et productivité des bureaux sont toutes durablement élevées. Les coûts de transition de la première phase sont récupérés, et l'économie de la connaissance de Hong Kong est désormais vraiment de premier rang."
 hongkong_housing.1.t: "La crise du logement à Hong Kong"
 hongkong_housing.1.d: "Les prix immobiliers médians ont dépassé le revenu médian des ménages d'un facteur vingt. Des dizaines de milliers de Hongkongais vivent dans des appartements subdivisés et des cage homes. La liste d'attente pour le logement public dépasse six ans et s'allonge. Le gouvernement a reconnu la crise et s'est engagé dans un programme de réforme — mais quelle réforme, et aux dépens de qui, demeure la question centrale de la politique hongkongaise."
 hongkong_housing.1.a: "Nous devons agir avec fermeté."
 hongkong_housing.2.t: "Un logement pour tous les Hongkongais"
 hongkong_housing.2.d: "Après des années de construction, de réforme et de combats politiques, les derniers objectifs du programme de logement ont été atteints. Les cage homes se vident. Les locataires du logement public accèdent à la propriété. La liste d'attente est tombée sous les deux ans pour la première fois en une génération. La crise qui a défini l'ère post-rétrocession est enfin derrière nous."
 hongkong_housing.2.a: "Un toit pour chaque Hongkongais."
