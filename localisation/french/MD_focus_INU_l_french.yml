l_french:
 inuit_nunangat_focus: "Arbre de concentration des Inuits"
 INU_Learning_from_Crested_Ice: "Tirer les leçons de Crested Ice"
 INU_Learning_from_Crested_Ice_desc: "Dans les années 1950 et 1960, les États-Unis firent opérer une série de B-52 Stratofortress armés d'armes nucléaires au-dessus du Haut-Arctique dans une opération connue sous le nom de Chrome Dome. En 1968, un Stratofortress s'écrasa en tentant d'atterrir à la base aérienne de Thulé, contaminant l'environnement, et l'affaire fut étouffée par les autorités. Nous devons maintenant revenir en arrière et analyser l'éthique de la situation, avant de jouer avec le feu nucléaire."
 INU_Buy_Spare_Parts: "Acheter des pièces de rechange"
 INU_Buy_Spare_Parts_desc: "Pour développer davantage notre programme de remise en état nucléaire, nous devons tenter d'obtenir pièces et machines afin de recréer ou restaurer les armes que nous prévoyons d'utiliser."
 INU_Project_S: "Projet Sanna"
 INU_Project_S_desc: "Sanna ou Sedna est le nom de la déesse inuite de la mer et maîtresse de la vie marine. En hommage à son rôle de source importante de subsistance, nous nommerons notre programme de sous-marins balistiques en son honneur."
 INU_Project_Ice_Shield: "Projet Bouclier de Glace"
 INU_Project_Ice_Shield_desc: "Il est temps de mettre notre travail à l'épreuve. Montrons au monde ce dont nous sommes capables lorsqu'une nation sait manier une arme nucléaire et l'utiliser comme outil diplomatique, non comme moyen de menacer autrui. Nous l'emploierons pour protéger les intérêts des peuples autochtones de l'Arctique."
 INU_Project_N: "Projet Nuutuittuq"
 INU_Project_N_desc: "Nuutuittuq est le nom de l'étoile du pôle Nord, Polaris. En hommage à cela, nous nommerons notre programme de missiles balistiques d'après elle, car il nous rapprochera toujours plus des étoiles."
 INU_Looking_to_the_Stars: "Regarder vers les étoiles"
 INU_Atmospheric_Monitoring: "Surveillance atmosphérique"
 INU_Lidar_Climate_Research: "Recherche climatique LIDAR"
 INU_Recover_B52_Thermonuclear_Arm: "Récupérer l'armement thermonucléaire du B-52"
 INU_Qaanaaq_Space_base: "Base spatiale Qaanaaq"