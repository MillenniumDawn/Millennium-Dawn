 MD_ftc_exercise_capital: "Aircraft Carrier and Surface Group Exercise"
 MD_ftc_exercise_capital_desc: "Aircraft Carrier strike group workups and surface action drills. Flight deck cycles, air defense coordination and replenishment at sea are rehearsed together."
 MD_ftc_ex_capital_short: "Capital ship doctrine mastery for 90 days."
 MD_ftc_exercise_escort: "Escort Exercise"
 MD_ftc_exercise_escort_desc: "Convoy screening and anti-submarine drills for frigates, corvettes and patrol boats. Sonar handling, helicopter coordination and formation station keeping are practiced at sea."
 MD_ftc_ex_escort_short: "Escort doctrine mastery for 90 days."
 MD_ftc_exercise_submarine: "Submarine Exercise"
 MD_ftc_exercise_submarine_desc: "Patrol and torpedo firing exercises for the submarine service. Crews rehearse quiet running, evasion against surface escorts and coordinated attacks."
 MD_ftc_ex_submarine_short: "Submarine doctrine mastery for 90 days."
 MD_ftc_exercise_operations: "Fleet Readiness Exercise"
 MD_ftc_exercise_operations_desc: "A fleet-wide readiness cycle covering command and control, logistics and damage control. Ships train to sustain operations far from home ports."
 MD_ftc_ex_operations_short: "Naval operations mastery for 90 days."
 MD_ftc_staff_course_name: "Staff Course"
 MD_ftc_staff_course_short: "Every navy leader gains experience, and one may gain a new trait."
 MD_ftc_staff_course_cooldown: "Staff Course in Session"
 MD_ftc_staff_course_cooldown_desc: "Navy staff officers are attending the fleet staff course. The next intake opens when this class graduates."
 MD_ftc_flag_officer_course_name: "Flag Officer Course"
 MD_ftc_flag_officer_course_short: "One navy leader gains a skill level."
 MD_ftc_flag_officer_course_cooldown: "Flag Officer Course in Session"
 MD_ftc_flag_officer_course_cooldown_desc: "Senior officers are completing command training for flag rank. A new course can begin once this class has finished."
 MD_ftc_rnd_liaison_name: "Naval R&D Liaison"
 MD_ftc_rnd_liaison_short: "Gain a naval breakthrough point."
 MD_ftc_rnd_liaison_cooldown: "Naval R&D Liaison Active"
 MD_ftc_rnd_liaison_cooldown_desc: "Fleet officers are seconded to naval research establishments, turning operational lessons into development requirements."
