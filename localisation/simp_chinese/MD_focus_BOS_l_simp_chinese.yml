 BOS_motor_influence_tt: "外国制造商将通过投资获得对波斯尼亚的§R影响力§!。"
 BOS_union_serbia_accept_tt: "塞尔维亚吞并波斯尼亚并接管其武装部队。"
 BOS_union_serbia_reject_tt: "波斯尼亚保持独立，与塞尔维亚的关系恶化。"
 BOS_military_supplies_accept_tt: "一个响应国向波斯尼亚运送步兵武器。"
 BOS_military_supplies_reject_tt: "做出回应的国家可能会保留其库存，从而恶化与波斯尼亚的关系。"
 BOS_turkish_supplies_accept_tt: "土耳其从其库存中向波斯尼亚运送了2500件步兵武器。"
 BOS_albanian_supplies_accept_tt: "阿尔巴尼亚从其库存中向波斯尼亚运送了750件步兵武器。"
 BOS_military_supplies_decline_tt: "波斯尼亚没有收到我们提供的任何设备，将会对这种拒绝行为持负面态度。"
 BOS_civil_war_over: "波斯尼亚内战已经结束"
 civil_war_focus: "在内战"
 BOS_air_chief: "波斯尼亚空军参谋部"
 BOS_air_chief_desc: "联合空军参谋部负责协调波斯尼亚有限的作战航空兵、运输直升机和地面支援需求。"
 novica_simic: "诺维卡·西米奇"
 novica_simic_desc: "一位波斯尼亚塞族高级指挥官专注于领土防御和保持战斗力。"
 cvjetko_savic: "茨维特科·萨维奇"
 cvjetko_savic_desc: "一位具有改革意识的军官，致力于重建波斯尼亚战后指挥体系。"
 novak_dukic: "诺瓦克·杜基奇"
 novak_dukic_desc: "经验丰富的野战指挥官，适合特种作战和复杂地形作战。"
 miladin_milojcic: "米拉丁·米洛伊契奇"
 miladin_milojcic_desc: "一名专注于机动、机动和作战计划的参谋军官。"
 anto_jelec: "安托·耶莱奇"
 anto_jelec_desc: "一位在防御作战和部队组织方面经验丰富的波斯尼亚克罗地亚族指挥官。"
 senad_masovic: "塞纳德·马绍维奇"
 senad_masovic_desc: "一位专注于训练标准和军事一体化的专业军官。"
 BOS_operation_althea: "木槿花行动"
 BOS_operation_althea_desc: "木槿花行动是欧盟于2004年接替驻波黑稳定部队的任务。它支持代顿和解，并将安全责任移交给波斯尼亚机构。"
 BOS_draft_EUFOR: "欧洲联盟军草案"
 BOS_draft_EUFOR_desc: "用欧盟领导的维和行动取代即将到期的北约领导的驻波黑稳定部队任务授权。"
 BOS_demand_eufor_withdrawal: "要求欧洲联盟军撤军"
 BOS_demand_eufor_withdrawal_desc: "减少国际军事存在，检验波斯尼亚能否维持独立的内部安全。"
 BOS_SFOR_title: "波斯尼亚和黑塞哥维那稳定部队"
 BOS_SFOR_title_desc: "北约领导的稳定部队负责执行《代顿协议》的军事条款，并支持波斯尼亚战后安全。其任务期限可在危机期间延长，也可随着国家机构的恢复而缩短。"
 BOS_peacekeeper_oversight: "维和人员监督"
 BOS_peacekeeper_oversight_desc: "欧洲使团仍驻扎在波斯尼亚，而改革却滞后于国内安全需求。"
 BOS_civil_war_operations: "内战行动"
 BOS_civil_war_operations_desc: "在波斯尼亚内战持续期间，协调冲突地区各处的紧急战时行动。"
 BOS_rotating_presidency: "轮换主席制"
 BOS_rotating_presidency_desc: "波斯尼亚的主席职位由波斯尼亚族、克罗地亚族和塞尔维亚族代表轮流担任。这种安排限制了任何一个组成群体的主导地位，但频繁的权力交接可能会中断立法进程。\n\n塞族态度：[ROOT.BOS_srpska_attitude]\n波斯尼亚族态度：[ROOT.BOS_bosniak_attitude]\n克族态度：[ROOT.BOS_croat_attitude]"
 BOS_more_sfor: "请求延长驻波黑稳定部队期限"
 BOS_more_sfor_desc: "在波斯尼亚政治或经济局势仍然不稳定的情况下，请求北约延长驻波黑稳定部队的任务期限。"
 BOS_lower_sfor: "请求缩短波黑稳定部队驻军时间"
 BOS_lower_sfor_desc: "缩短驻波黑稳定部队的任务期限，因为波斯尼亚各机构准备承担全部安全责任。"
 BOS_attack_upon_nato_desc: "波斯尼亚军队在与北约成员国的作战中处于严重劣势。"
 BOS_sfor_vol_troops: "驻波黑维和部队志愿者承诺"
 BOS_sfor_vol_troops_desc: "如果波斯尼亚再次陷入内战，维和行动参与者可以迅速部署志愿者。"
 BOS_SER_vol_troops: "塞尔维亚志愿者承诺"
 BOS_SER_vol_troops_desc: "塞尔维亚可以迅速派遣志愿者支持塞族共和国应对再次爆发的波斯尼亚冲突。"
 BOS_idea_muslim_nationalism: "动员起来的穆斯林民族主义"
 BOS_idea_muslim_nationalism_desc: "宗教民族主义支持动员和外国干预，同时使政权更加顽固地抵制政治变革。"
 BOS_idea_srpska_supremacy: "塞族共和国至高无上"
 BOS_idea_srpska_supremacy_desc: "塞族机构主导着国家，并指导着国家的资源政策，但权力分享实际上已经结束。"
 BOS_dominant_entity_idea: "主导实体"
 BOS_dominant_entity_idea_desc: "塞族共和国对中央政府的控制稳定了政府，并使其能够抵御外国政治影响。"
 BOS_workers_front_idea: "工人阵线"
 BOS_workers_front_idea_desc: "有组织的劳工已成为一支独立的政治力量。它的动员既加强了政府的力量，又动摇了现有的制度。"
 BOS_workers_compact: "国家工会契约"
 BOS_workers_compact_desc: "国家以劳动和平与更高的运营成本为交换，保障了劳动者的权利和社会支出。"
 BOS_worker_managed_economy: "工人管理经济"
 BOS_worker_managed_economy_desc: "工人委员会与企业管理者共享权力。该制度提高了税收收入，但初期会扰乱工业生产。"
 BOS_mechanical_modernization: "机械现代化"
 BOS_mechanical_modernization_desc: "现代机械和技术培训使工人管理模式转变为更高效的工业模式。"
 BOS_workers_republic_idea: "工人共和国"
 BOS_workers_republic_idea_desc: "委员会代表指导国家及其工业发展。既定的社会主义秩序加快了建设和公共管理的速度。"
 BOS_mechanical_production_bonus: "机械化生产"
 BOS_idea_prepping_an_offensive: "准备进攻"
 BOS_idea_prepping_an_offensive_desc: "储备物资和详细的人员计划暂时改善了作战准备。"
 BOS_idea_commence_the_offensives: "进攻势头"
 BOS_idea_commence_the_offensives_desc: "武装部队致力于在整个内战战线上发起协调一致的进攻。"
 BOS_idea_rally_the_troops: "集结部队"
 BOS_idea_rally_the_troops_desc: "预备役部队和当地新兵维持着公众对战争的支持。"
 BOS_idea_mobilize_the_nation: "全国动员"
 BOS_idea_mobilize_the_nation_desc: "紧急动员加快了军事行动和特许步兵装备的生产。"
 BOS_idea_dig_in: "准备防御"
 BOS_idea_dig_in_desc: "工兵部队和野战部队正在迅速构筑防御阵地。"
 BOS_idea_fight_or_perish: "或战或亡"
 BOS_idea_fight_or_perish_desc: "政府正在调集更多人力以防止在内战中战败。"
 BOS_idea_national_sentiment: "战时国民情绪"
 BOS_idea_national_sentiment_desc: "国家宣传在冲突期间维持着民族主义动员。"
 BOS_religious_identity_idea: "宗教认同"
 BOS_religious_identity_idea_desc: "政府通过伊斯兰机构和宗教民族主义纲领来定义国家。"
 BOS_low_police_budget: "低警察预算"
 BOS_low_police_budget_desc: "减少警务经费虽然降低了日常开支，但也削弱了国家打击有组织犯罪的能力。"
 BOS_bosniak_balkan_aspiration_desc: "波斯尼亚克军队被动员起来，以保卫国家并击败塞尔维亚和克罗地亚的分裂军队。"
 BOS_srpska_balkan_aspiration_desc: "塞族共和国被动员起来，击败波斯尼亚中央政府和与之竞争的克罗地亚军队。"
 BOS_croat_balkan_aspiration_desc: "波斯尼亚克罗地亚军队已动员起来，保卫其领土免受波斯尼亚克族和塞尔维亚族军队的攻击。"
 BOS_police_high_desc: "增加警务经费可以加强执法和政治控制，但代价是巨大的财政支出。"
 BOS_air_doctrine_review: "重视空军学说"
 BOS_air_doctrine_review_desc: "临时人员研究和演习正在加速实用空军理论的采纳。"
 BOS_internal_investment_desc: "国内投资激励措施支持民用工业，同时减少从生产性用途转移的产出比例。"
 BOS_crime_increase_desc: "执法不力导致有组织犯罪扩张，增加了行政成本和消费者成本。"
 BOS_idea_mechanization_of_the_army: "机械化部队"
 BOS_idea_mechanization_of_the_army_desc: "防护车辆和机动规划使波斯尼亚的小规模军队能够以可控的人员成本获得更大的作战范围。"
 BOS_idea_transportation_methods: "现代军事运输"
 BOS_idea_transportation_methods_desc: "标准多用途车辆和运输直升机降低了军事后勤的成本和复杂性。"
 BOS_idea_the_land_fleet: "综合机械化车队"
 BOS_idea_the_land_fleet_desc: "通用车辆系列能够支持运输机和装甲运输车的均衡部署，而无需承担过高的采购成本。"
 BOS_idea_aerial_dominance: "空中霸权"
 BOS_idea_aerial_dominance_desc: "波斯尼亚正在加大对战斗机战备、飞行员素质以及与地面部队密切协调的投入。"
 BOS_idea_air_defence_initiative: "防空计划"
 BOS_idea_air_defence_initiative_desc: "地面防空和监视系统为城市、基地和野战部队提供了可靠的保护屏障。"
 BOS_idea_apc_armament: "装甲输送车"
 BOS_idea_apc_armament_desc: "标准化装甲运输车提高了步兵防护能力和联合兵种机动性。"
 BOS_idea_main_battle_line: "现代反装甲学说"
 BOS_idea_main_battle_line_desc: "机动反装甲部队使波斯尼亚能够在不维持昂贵的坦克部队的情况下与更强大的敌军对抗。"
 BOS_idea_boots_on_the_ground: "侧重步兵的军队"
 BOS_idea_boots_on_the_ground_desc: "训练有素的步兵和预备役部队构成了适合波斯尼亚地形和预算的防御力量的核心。"
 BOS_eu_development_loans: "欧盟发展贷款"
 BOS_eu_development_loans_desc: "欧洲信贷正在为重建提供资金并缓解消费经济压力，但还款条款带来了更沉重的利息负担，使波斯尼亚更容易受到外国杠杆的影响。"
 BOS_election_stimulus: "大选年支出"
 BOS_election_stimulus_desc: "投票前的紧急支出稳定了家庭预算，并提升了公众对政府的信心。"
 BOS_reconstruction_drive: "国家重建运动"
 BOS_reconstruction_drive_desc: "一项协调一致的重建计划正在加快全国范围内的建设，并逐步恢复公众对国家的信心。"
 BOS_national_mobilization: "国家动员框架"
 BOS_national_mobilization_desc: "明确的预备役义务扩大了训练有素的人力库，而制定的防御计划意味着任何被占领的波斯尼亚领土都将更加激烈地抵抗占领者。"
 BOS_idea_detain_ratko_mladic: "拉特科·姆拉迪奇被拘留"
 BOS_idea_detain_ratko_mladic_desc: "与国际司法机构的合作提高了西方对波斯尼亚机构的信心。"
 BOS_idea_civilian_training: "扩充后备训练"
 BOS_idea_civilian_training_desc: "一项临时性国家训练计划正在为预备役人员的动员和领土防御做好准备。"
 BOS_idea_post_war_clean_up: "战后的清理工作"
 BOS_idea_post_war_clean_up_desc: "协调一致的清理和重建工作正在暂时加快对受损社区的投资。"
 BOS_pro_bosnia: "组建波斯尼亚克族支持的政府"
 BOS_pro_bosnia_desc: "由波斯尼亚克族支持的政府领导国家机构，并降低了国家行政成本。"
 BOS_pro_srpska: "组建塞族支持的政府"
 BOS_pro_srpska_desc: "一个由塞族支持的政府领导国家机构，并将与塞族共和国的安全合作列为优先事项。"
 BOS_civil_war_recovery: "内战恢复"
 BOS_civil_war_recovery_desc: "内战重燃，损害了生产、公众信心以及波斯尼亚吸引合作伙伴的能力。"
 BOS_post_war_efforts: "战后重建工作"
 BOS_post_war_efforts_desc: "税收和重建激励措施正在支撑战后投资的暂时性激增。"
 BOS_milorad_dodik_idea: "米洛拉德·多迪克"
 BOS_milorad_dodik_idea_desc: "米洛拉德·多迪克的政治网络阻碍了中央机构的运作，同时加强了塞族共和国的自治权。"
 BOS_farming_improvements: "农业改进"
 BOS_farming_improvements_desc: "现代化的设备和更安全的土地正在提高农业产量和农村稳定性。"
 BOS_farming_powerhouse: "农业强国"
 BOS_farming_powerhouse_desc: "如今，高效的农业部门支撑着农村收入、人口增长和税收基础。"
 BOS_mining_development: "矿业发展"
 BOS_mining_development_desc: "现代化矿山增加了资源开采量和当地的应税活动。"
 BOS_mining_industry: "采矿工业"
 BOS_mining_industry_desc: "整合投资造就了规模更大、效率更高的采矿业。"
 BOS_lumber_harvesting_idea: "木材采伐"
 BOS_lumber_harvesting_idea_desc: "林业和加工投资正在扩大农村资源产出和税收活动。"
 BOS_dayton_accords_desc: "《代顿和解协议》限制了波斯尼亚的扩张，并限制了与塞尔维亚和克罗地亚的军事对抗，同时保持了波斯尼亚的和平。"
 BOS_land_mine_removal_efforts_desc: "排雷队正在减轻受污染土地带来的健康和经济负担，但该计划需要持续的资金支持。"
 BOS_trade_deal_with_russia: "萨拉热窝-莫斯科贸易协定 I"
 BOS_trade_deal_with_russia_desc: "与俄罗斯达成的有限协议既能支持投资，又能降低消费者成本，同时还能增强东方的政治影响力。"
 BOS_trade_deal_with_russia_expanded: "萨拉热窝-莫斯科贸易协定 II"
 BOS_trade_deal_with_russia_expanded_desc: "俄罗斯扩大贸易和信贷，加深了经济合作，并巩固了波斯尼亚东部的政治联盟。"
 BOS_trade_deal_with_eu: "欧盟贸易协定 I"
 BOS_trade_deal_with_eu_desc: "与欧盟达成有限协议可以降低消费者成本，并支持民主和金融一体化。"
 BOS_trade_deal_with_eu_expanded: "欧盟贸易协定 II"
 BOS_trade_deal_with_eu_expanded_desc: "扩大进入欧洲市场和获得信贷的渠道，加强了波斯尼亚与西方的经济联系。"
 BOS_trade_with_nato: "北约援助方案"
 BOS_trade_with_nato_desc: "北约伙伴国提供经济援助，降低短期成本，并促进西方政治结盟。"
 BOS_trade_with_usa: "美国与波斯尼亚联合贸易条约"
 BOS_trade_with_usa_desc: "与美国的双边协议有利于能源生产、消费者获取能源以及与西方国家的政治联盟。"
 BOS_gov_old_name: "波斯尼亚议会"
 BOS_islamic_revolt: "波斯尼亚圣战军叛乱"
 BOS_islamic_upper: "波斯尼亚哈里发国"
 bos_workers_republic: "波斯尼亚和黑塞哥维那工人共和国"
 BOS_events.1.t: "波斯尼亚内战"
 BOS_events.1.d: "塞族共和国宣布独立，波斯尼亚再次陷入内战。中央政府必须击败分裂势力，否则将面临国家永久分裂的风险。"
 BOS_events.1.a: "保卫波斯尼亚和黑塞哥维那"
 BOS_events.1.b: "与塞族共和国站在一起"
 BOS_events.2.t: "克罗地亚族宣布独立"
 BOS_events.2.d: "黑塞哥维那境内的波斯尼亚克罗地亚族领导人宣布独立，而此时该国已深陷战争泥潭。中央政府必须在不放弃对抗塞族共和国的战线的情况下，恢复对南部的控制。"
 BOS_events.2.a: "恢复国家领土完整"
 BOS_events.2.b: "站在克罗地亚分裂分子一边"
 BOS_events.4.t: "战争的结束"
 BOS_events.4.d: "政府已恢复对波斯尼亚和黑塞哥维那的控制，结束了再次爆发的内战。现在可以开始复员、重建和政治和解工作。"
 BOS_events.4.a: "完全整合"
 BOS_events.4.b: "自治权谈判"
 BOS_events.4.c: "将监督权移交给国际管理部门"
 BOS_events.59.t: "对峙演变为战争"
 BOS_events.59.d: "分裂危机最终无果而终。塞族共和国已公开宣布独立，国家再次陷入战争。"
 BOS_events.59.a: "用武力维持国家统一"
 BOS_events.60.t: "黑塞哥维那分裂"
 BOS_events.60.d: "由于未能达成协议，黑塞哥维那的克罗地亚领导人宣布独立，并拿起武器对抗萨拉热窝。"
 BOS_events.60.a: "恢复对南方的控制"
 BOS_events.11.t: "外国武器抵达"
 BOS_events.11.d: "一位区域合作伙伴已向我方部队交付了步兵武器。这批武器将加强前线力量，并巩固后方合作关系。"
 BOS_events.11.a: "Distribute the weapons"
 BOS_events.12.t: "Farmers Strike"
 BOS_events.12.d: "Farmers facing low prices, unsafe land, and weak state support have begun a national strike. Their organizers demand agricultural investment and a change in economic policy."
 BOS_events.12.a: "Accept a change of government"
 BOS_events.12.b: "Negotiate with the farmers"
 BOS_events.13.t: "Agreement with the Strikers"
 BOS_events.13.d: "The government and strike leaders have accepted a settlement covering wages, workplace protections, and future negotiations. The agreement ends the immediate protests but commits the state to new obligations."
 BOS_events.13.a: "Honor the agreement"
 BOS_events.14.t: "Miners Strike"
 BOS_events.14.d: "Mine workers have stopped production to demand safer conditions, reliable wages, and shorter shifts. The strike is spreading through communities that depend on the industry."
 BOS_events.14.a: "Accept a change of government"
 BOS_events.14.b: "Negotiate with the miners"
 BOS_events.9.t: "Bosnia Requests Arms"
 BOS_events.9.d: "[FROM.GetName]请求提供步兵武器用于其内战。援助将扩大我们在巴尔干地区的影响力，但这些装备必须来自我们自身的储备。"
 BOS_events.9.a: "Send the weapons"
 BOS_events.9.b: "Preserve our stockpiles"
 BOS_events.34.t: "Bosnia Seeks CSTO Membership"
 BOS_events.34.d: "[FROM.GetName]已申请加入集体安全条约组织。加入该组织将使联盟范围扩展至西巴尔干地区，但也可能将波斯尼亚未解决的争端引入该组织。"
 BOS_events.34.a: "Admit Bosnia"
 BOS_events.34.b: "Reject the application"
 BOS_events.35.t: "CSTO Membership Approved"
 BOS_events.35.d: "Russia has approved our application. Bosnia now shares the CSTO's collective defense obligations."
 BOS_events.35.a: "Accept the obligations"
 BOS_events.36.t: "CSTO Membership Rejected"
 BOS_events.36.d: "Russia has rejected our application and declined to extend the alliance into the Balkans."
 BOS_events.36.a: "Reconsider our eastern policy"
 BOS_events.15.t: "Bosnian Arms Cooperation Offer"
 BOS_events.15.d: "[FROM.GetName]已提出一项国防工业合作方案，请求获得塞尔维亚飞机和步枪的生产许可证。更紧密的军事联系将把萨拉热窝与贝尔格莱德捆绑在一起，尽管波斯尼亚的一些人会对这种依赖感到不满。"
 BOS_events.15.a: "Grant the production licenses"
 BOS_events.15.b: "Decline the request"
 BOS_events.16.t: "Belgrade Grants Arms Licenses"
 BOS_events.16.d: "Serbia has approved the transfer of production licenses. Bosnian factories may now build Serbian designs, though pro-Serbian sentiment among Bosniak communities has stirred unrest."
 BOS_events.16.a: "Begin licensed production"
 BOS_events.17.t: "Belgrade Declines"
 BOS_events.17.d: "Serbia has turned down the arms cooperation offer, unwilling to share its defense industry on these terms."
 BOS_events.17.a: "Look elsewhere"
 BOS_events.18.t: "Bosnian Investment Invitation"
 BOS_events.18.d: "[FROM.GetName]正在邀请外国汽车制造商在波斯尼亚建厂。建厂将开拓新市场，并扩大我们对波斯尼亚经济的商业影响力。"
 BOS_events.18.a: "Build a factory in Bosnia"
 BOS_events.18.b: "Decline the invitation"
 BOS_events.19.t: "Foreign Automaker Invests"
 BOS_events.19.d: "[FROM.GetName]已同意在波斯尼亚建厂。这项投资将带来就业机会和资金，但制造商所在国的政府也将在我们的产业政策中获得一定的影响力。"
 BOS_events.19.a: "Welcome the investment"
 BOS_events.20.t: "Investment Declined"
 BOS_events.20.d: "[FROM.GetName]目前拒绝投资波斯尼亚的汽车工业。"
 BOS_events.20.a: "Approach another manufacturer"
 BOS_events.21.t: "Bosnia Seeks to Buy Rifles"
 BOS_events.21.d: "[FROM.GetName]希望购买一批现代化的德国步兵武器。这笔交易将为萨拉热窝带来硬通货和良好声誉。"
 BOS_events.21.a: "Approve the sale"
 BOS_events.21.b: "Refuse the sale"
 BOS_events.22.t: "German Rifles Delivered"
 BOS_events.22.d: "德国已批准这笔军售。一批现代化步兵武器正在运往我们的仓库途中。"
 BOS_events.22.a: "Distribute the weapons"
 BOS_events.23.t: "Germany Declines the Sale"
 BOS_events.23.d: "柏林目前拒绝向波斯尼亚出售步兵武器。"
 BOS_events.23.a: "Seek another supplier"
 BOS_events.24.t: "Bosnia Seeks Russian Rifles"
 BOS_events.24.d: "[FROM.GetName]希望购买大量俄罗斯步兵武器。这笔订单对俄罗斯工业来说将是一笔可观的销售。"
 BOS_events.24.a: "Approve the sale"
 BOS_events.24.b: "Refuse the sale"
 BOS_events.25.t: "Russian Rifles Delivered"
 BOS_events.25.d: "Russia has approved the sale. A large consignment of infantry weapons is en route to our stockpiles."
 BOS_events.25.a: "Distribute the weapons"
 BOS_events.26.t: "Russia Declines the Sale"
 BOS_events.26.d: "Moscow has declined to sell infantry weapons to Bosnia at this time."
 BOS_events.26.a: "Seek another supplier"
 BOS_political.4.t: "Bosnia's Postwar Election"
 BOS_political.4.d: "Bosnia and Herzegovina's first national election of the new century will determine which coalition directs the country's fragile postwar institutions."
 BOS_political.4.a: "Keep the Bosniak-led government"
 BOS_political.4.a_tt: "The §YParty of Democratic Action§! will lead the government. The next presidential rotation will pass to a Serb representative."
 BOS_political.4.b: "Back a Serb-led coalition"
 BOS_political.4.b_tt: "The §YAlliance of Independent Social Democrats§! will lead a coalition with the §YSerbian Democratic Party§!. The next presidential rotation will pass to a Croat representative."
 BOS_political.20.t: "Settlement After the Civil War"
 BOS_political.20.d: "The war is over. Bosnia and Herzegovina has been recentered under one authority, and the immediate task is stabilizing the state while the former factions are dismantled."
 BOS_political.20.a: "Establish Greater Srpska"
 BOS_political.20.b: "Establish a Croat-Led Government"
 BOS_political.20.c: "Reunite Bosnia Under Sarajevo Control"
 BOS_political.1.t: "The Postwar State"
 BOS_political.1.d: "Bosnia and Herzegovina enters the new century with damaged institutions, divided authority, and an unfinished recovery. The government must decide how much power should remain with the entities."
 BOS_political.1.a: "Define the new state"
 BOS_political.2.t: "Expanded Entity Autonomy"
 BOS_political.2.d: "The government has transferred additional domestic authority to Herzegovina and Republika Srpska while retaining a common foreign and defense policy. Bosnia now functions as a looser federation."
 BOS_political.2.a: "Implement the settlement"
 BOS_political.3.t: "Federal Reunification"
 BOS_political.3.d: "Expanded autonomy has created overlapping jurisdictions in mixed communities and weakened common services. Entity leaders have accepted reunification under a federal settlement that preserves local representation."
 BOS_political.3.a: "Reunify the federation"
 BOS_political.5.t: "The Financial Crisis"
 BOS_political.5.d: "The global financial crisis has reduced exports, tightened credit, and pushed Bosnian employers toward layoffs. Recovery will require coordinated fiscal and industrial policy."
 BOS_political.5.a: "Prepare a recovery program"
 BOS_political.6.t: "米洛拉德·多迪克"
 BOS_political.6.d: "Milorad Dodik has consolidated leadership in Republika Srpska and made entity autonomy the center of his political program. His growing network will complicate every attempt to strengthen national institutions."
 BOS_political.6.a: "Sarajevo must respond"
 BOS_political.8.t: "Segregation Dispute Turns Violent"
 BOS_political.8.d: "A dispute over integrating Serb and Bosniak pupils has escalated into a march on the municipal assembly. Vandalism and attacks on returnee-owned businesses have forced riot police to intervene."
 BOS_political.8.a: "The divisions remain deep"
 BOS_political.9.t: "Peacekeepers Plan Force Reduction"
 BOS_political.9.d: "NATO has announced a reduction in its Bosnian peacekeeping presence as the security situation improves. Local leaders disagree over whether national forces are ready to assume the mission."
 BOS_political.9.a: "Review our readiness"
 BOS_political.10.t: "Report Documents Press Attacks"
 BOS_political.10.d: "A new report records a rise in threats and assaults against Bosnian journalists during 2002. Nationalist organizations and local political patrons are blamed for much of the intimidation."
 BOS_political.10.a: "Protect independent reporting"
 BOS_political.11.t: "Nikolić Sentenced to 23 Years"
 BOS_political.11.d: "A court has sentenced Bosnian Serb officer Dragan Nikolić to 23 years in prison for crimes committed at the Sušica detention camp. The judgment has reopened political disputes over wartime accountability."
 BOS_political.11.a: "Justice must be enforced"
 BOS_political.13.t: "Refugee Returns Reach New High"
 BOS_political.13.d: "More displaced citizens are returning as security improves and homes are rebuilt. Local authorities must provide services and protect returnees in communities where wartime tensions remain."
 BOS_political.13.a: "Support their return"
 BOS_political.14.t: "Severe Cold Strikes Refugees and Returnees"
 BOS_political.14.d: "Severe cold has struck refugee and returnee communities across Bosnia and Herzegovina. Domestic agencies and the United Nations are struggling to deliver heating fuel, shelter, and food."
 BOS_political.14.a: "Mobilize emergency relief"
 BOS_political.15.t: "Blast Damages Alija Izetbegović's Grave"
 BOS_political.15.d: "An explosive device has damaged the grave of former president Alija Izetbegović in Sarajevo. The attack has provoked public outrage and renewed fears of politically motivated violence."
 BOS_political.15.a: "Investigate the attack"
 BOS_political.17.t: "Southeast Europe Floods"
 BOS_political.17.d: "Record rainfall has flooded towns, damaged infrastructure, and triggered landslides across Bosnia and neighboring states. Emergency services face a prolonged relief and reconstruction effort."
 BOS_political.17.a: "Coordinate disaster relief"
 BOS_events.55.t: "Alija Izetbegović Dies"
 BOS_events.55.d: "Former president Alija Izetbegović has died from complications of heart disease. His death closes a defining chapter in Bosniak politics and Bosnia and Herzegovina's struggle for independence."
 BOS_events.55.a: "Honor his legacy"
 BOS_events.55.b: "The state must move forward"
 BOS_political.21.t: "Bosnia Requests a Guarantee"
 BOS_political.21.d: "[FROM.GetName]要求我们保证其独立性，因为欧盟驻波黑部队将安全责任移交给波斯尼亚机构。"
 BOS_political.21.a: "Guarantee Bosnia"
 BOS_political.21.b: "Decline the commitment"
 BOS_political.22.t: "Bosnia Proposes Union"
 BOS_political.22.d: "由塞族共和国领导的[FROM.GetName]政府已提议并入塞尔维亚。如果该提议被接受，波斯尼亚的领土和武装力量将移交给我国。"
 BOS_political.22.a: "Approve the union"
 BOS_political.22.b: "Preserve separate states"
 BOS_zivko_radisic: "Živko Radišić"
 BOS_ante_jelavic: "Ante Jelavić"
 BOS_halid_genjac: "Halid Genjac"
 BOS_sulejman_tihic: "Sulejman Tihić"
 BOS_mirko_sarovic: "Mirko Šarović"
 BOS_dragan_covic: "Dragan Čović"
 BOS_haris_silajdzic: "Haris Silajdžić"
 BOS_nebojsa_radmanovic: "Nebojša Radmanović"
 BOS_zeljko_komsic: "Željko Komšić"
 BOS_bosnia_random: "A new Bosniak representative will assume the rotating presidency."
 BOS_serb_random: "A new Serb representative will assume the rotating presidency."
 BOS_croat_random: "A new Croat representative will assume the rotating presidency."
 BOS_events.45.a: "Open negotiations"
 BOS_events.45.d: "Public employees have joined the labor unrest and demanded reliable wages, collective bargaining, and an end to patronage appointments."
 BOS_events.45.t: "Public Sector Walkout"
 BOS_events.46.a: "The movement is spreading"
 BOS_events.46.d: "Demonstrations have expanded from workplaces into city centers as unions coordinate demands across entity lines."
 BOS_events.46.t: "Nationwide Labor Protests"
 BOS_events.47.a: "Protect public institutions"
 BOS_events.47.d: "A confrontation outside a government building has turned violent. Union leaders blame provocateurs, while security officials demand emergency powers."
 BOS_events.47.t: "Protests Turn Violent"
 BOS_events.48.a: "Recognize the new government"
 BOS_events.48.d: "The old coalition has lost control of parliament. A worker-backed cabinet now claims the authority to reorganize the state and economy."
 BOS_events.48.t: "Workers Enter Government"
 BOS_eu_accession: "European Union Accession"
 BOS_eu_accession_desc: "Membership requires closing negotiation chapters one at a time. Every step needs agreement from all three constituent groups, and Republika Srpska can stall the process whenever its leadership turns hostile."
 BOS_eu_judicial_reform: "Close the Judiciary Chapter"
 BOS_eu_judicial_reform_desc: "Align court procedure, appellate review, and prosecutorial independence with EU accession benchmarks."
 BOS_eu_anti_corruption_commitments: "Adopt Anti-Corruption Commitments"
 BOS_eu_anti_corruption_commitments_desc: "Commit to EU-monitored anti-corruption benchmarks. Brussels will not open this chapter while state capture remains severe."
 BOS_eu_market_alignment: "Align with the Single Market"
 BOS_eu_market_alignment_desc: "Adopt EU product standards, customs procedures, and competition rules. Compliance is expensive, but it unlocks pre-accession funding."
 BOS_eu_candidate_status: "Secure Candidate Status"
 BOS_eu_candidate_status_desc: "Petition the European Council to recognize Bosnia and Herzegovina as an official membership candidate."
 BOS_eu_open_negotiations: "Open Accession Negotiations"
 BOS_eu_open_negotiations_desc: "Begin formal membership negotiations with the European Commission. Expect resistance from Banja Luka as state-level obligations expand."
 BOS_eu_sign_accession_treaty: "Sign the Accession Treaty"
 BOS_eu_sign_accession_treaty_desc: "Conclude negotiations and sign the treaty of accession. Membership itself still requires a formal application to the European Union."
 BOS_treasury_5_tt: "The treasury holds at least £treasury 5.0"
 BOS_treasury_2_tt: "The treasury holds at least £treasury 2.0"
 BOS_judiciary_meets_eu_standards_tt: "The judiciary meets EU accession benchmarks"
 BOS_anti_corruption_framework_tt: "An EU-monitored anti-corruption framework is in place"
 BOS_market_aligned_with_eu_tt: "Domestic regulation is aligned with the single market"
 BOS_recognized_eu_candidate_tt: "Bosnia and Herzegovina becomes a recognized EU membership candidate"
 BOS_eu_application_open_tt: "Bosnia and Herzegovina may now apply for European Union membership"
 BOS_economic_development: "Economic Development"
 BOS_economic_development_desc: "Foreign-financed investment, privatization, and reconstruction programs for the postwar economy.\n Entity-level patronage networks control appointments, contracts, and much of the economy. Dismantling them is slow and angers the groups that profit from them."
 BOS_court_turkish_investment: "Court Turkish Investment"
 BOS_court_turkish_investment_desc: "Open the door to Turkish construction firms and banks. Ankara's money flows in, and with it Turkish influence over Sarajevo."
 BOS_court_gulf_investment: "Court Gulf Investment"
 BOS_court_gulf_investment_desc: "Invite Gulf funds into property, tourism, and finance. The capital lifts the treasury and steadies the mood, and Riyadh's standing in Bosnia grows."
 BOS_rapid_privatization: "Rapid Privatization"
 BOS_rapid_privatization_desc: "Sell state firms quickly to whoever will buy. The sales fill the treasury and lift output, but the bargains feed corruption and unsettle the workforce."
 BOS_transparent_privatization: "Transparent Privatization"
 BOS_transparent_privatization_desc: "Sell state firms through audited, open tenders. The proceeds are smaller and the process slower, but graft falls and public trust holds."
 BOS_thermal_plant_chinese_financing: "Chinese-Financed Thermal Plant"
 BOS_thermal_plant_chinese_financing_desc: "Take a Chinese loan to expand a lignite power station. Output rises at once, but the debt and Beijing's influence come with it."
 BOS_hydro_refurbishment: "Refurbish the Hydro Plants"
 BOS_hydro_refurbishment_desc: "Overhaul the aging dams and turbines on the Neretva and Drina. The upfront bill is real, but reliable power steadies industry."
 BOS_end_brcko_supervision: "End Brcko Supervision"
 BOS_end_brcko_supervision_desc: "Wind down the international supervisory regime over Brcko District and hand it fully to local institutions. Republika Srpska will test the new arrangement at once."
 BOS_police_restructuring: "Restructure the Police"
 BOS_police_restructuring_desc: "Consolidate the fragmented entity police under a state framework, an EU precondition for closer ties. Republika Srpska resents the loss of control."
 BOS_anti_corruption_investigations: "Anti-Corruption Investigations"
 BOS_anti_corruption_investigations_desc: "Direct state prosecutors against entrenched patronage networks. Corruption will fall, but the constituent group whose officials are indicted will grow restless."
 BOS_judicial_appointments: "Depoliticize Judicial Appointments"
 BOS_judicial_appointments_desc: "Transfer control of judicial appointments from party leaderships to an independent council."
 BOS_depoliticized_judiciary_tt: "Judicial appointments are insulated from party control"
 BOS_public_procurement_reform: "Public Procurement Reform"
 BOS_public_procurement_reform_desc: "Introduce open tendering for state contracts. Publishing the books costs money up front and ends several comfortable arrangements."
 BOS_transparent_procurement_tt: "State contracts are awarded through open tendering"
 BOS_diaspora_investment_drive: "Diaspora Investment Drive"
 BOS_diaspora_investment_drive_desc: "Invite diaspora business associations to co-finance public projects and place a one-off bond issue with emigrant savers."
 BOS_dual_citizenship_outreach: "Dual Citizenship Outreach"
 BOS_dual_citizenship_outreach_desc: "Simplify dual citizenship procedures and consular registration so emigrants keep formal ties to the country. A larger registered diaspora sends more money home."
 BOS_expanded_dual_citizenship_tt: "Diaspora remittance income rises by 20%"
 BOS_diaspora_return_program: "Diaspora Return Program"
 BOS_diaspora_return_program_desc: "Fund resettlement grants and job placement for families returning from abroad. Expensive, but the country needs people more than it needs the money."
 BOS_treasury_1_tt: "The treasury holds at least £treasury 1.0"
 BOS_dayton_pressure: "Dayton Under Pressure"
 BOS_dayton_pressure_desc: "Republika Srpska is challenging state institutions and threatening secession. Sarajevo can concede autonomy, ask the High Representative to impose a settlement, or seek international arbitration."
 BOS_concede_to_srpska_demands: "Concede to Entity Demands"
 BOS_concede_to_srpska_demands_desc: "Return contested competencies to Republika Srpska. The crisis ends, at the price of central authority."
 BOS_invoke_bonn_powers: "Invoke the Bonn Powers"
 BOS_invoke_bonn_powers_desc: "Ask the High Representative to impose the disputed legislation and remove obstructing officials. Effective, and deeply resented in Banja Luka."
 BOS_request_international_arbitration: "Request International Arbitration"
 BOS_request_international_arbitration_desc: "Refer the dispute to international arbitration. Slow and costly, but it ends the standoff without rewarding either side."
 BOS_phase_out_ohr_supervision: "Phase Out OHR Supervision"
 BOS_phase_out_ohr_supervision_desc: "With entity relations stable, negotiate the transfer of the High Representative's remaining powers to domestic institutions."
 BOS_dayton_pressure_decisions_available_tt: "Crisis responses are available in the Dayton Under Pressure decisions"
 BOS_eu_candidate: "EU Membership Candidate"
 BOS_eu_candidate_desc: "Candidate status gives Bosnia and Herzegovina a formal path to membership, regular progress reporting, and easier relations with member states."
 BOS_eu_negotiations: "EU Accession Negotiations"
 BOS_eu_negotiations_desc: "Accession chapters are open and EU technical assistance flows into state institutions, speeding administrative and infrastructure work."
 BOS_eu_accession_treaty: "EU Accession Treaty Signed"
 BOS_eu_accession_treaty_desc: "The accession treaty is signed and ratification is underway. Markets treat membership as settled, and the state apparatus works with clear direction."
 BOS_eu_accession_funds: "Pre-Accession Assistance"
 BOS_eu_accession_funds_desc: "Instrument for Pre-Accession Assistance funds finance infrastructure, administrative capacity, and cheaper state borrowing."
 BOS_republika_srpska_secession_crisis: "Secession Crisis"
 BOS_republika_srpska_secession_crisis_desc: "Republika Srpska is boycotting state institutions and preparing referendum legislation. Foreign patrons watch for an opening while the standoff continues."
 BOS_ohr_supervision: "OHR Supervision"
 BOS_ohr_supervision_desc: "The High Representative is exercising the Bonn powers directly. Imposed rulings keep the state functional but sideline elected institutions."
 BOS_national_reconciliation: "National Reconciliation"
 BOS_national_reconciliation_desc: "All three constituent groups back the state government. Cross-entity cooperation is routine rather than exceptional."
 BOS_political.24.t: "Candidate Status Granted"
 BOS_political.24.d: "The European Council has formally recognized Bosnia and Herzegovina as a candidate for membership. The decision rewards years of reform and obliges Brussels to report on our progress each year."
 BOS_political.24.a: "A European future"
 BOS_political.25.t: "Banja Luka Blocks the Talks"
 BOS_political.25.d: "Republika Srpska delegates have walked out of the state parliament, refusing to ratify the negotiation framework unless entity competencies are guaranteed in writing."
 BOS_political.25.a: "Negotiate their return"
 BOS_political.25.b: "Ratify without them"
 BOS_political.26.t: "Procurement Scandal Breaks"
 BOS_political.26.d: "Journalists have published contracts tying senior entity officials to rigged public tenders. The network reaches into ministries, state enterprises, and at least one governing party."
 BOS_political.26.a: "Prosecute the network"
 BOS_political.26.b: "Bury the story"
 BOS_political.27.t: "Republika Srpska Threatens Secession"
 BOS_political.27.d: "The entity assembly in Banja Luka has scheduled a vote on withdrawing from state institutions, and its leadership is openly discussing a referendum on independence."
 BOS_political.27.a: "The state must respond"
 BOS_political.28.t: "The Standoff Hardens"
 BOS_political.28.d: "Months of boycott have passed without a settlement. Entity institutions now operate as if state authority were optional, and moderates on all sides have lost ground."
 BOS_political.28.a: "A dangerous precedent"
 BOS_diaspora_remittances: "Diaspora Remittances"
 BOS_diaspora_remittances_desc: "Money sent home by Bosnians working abroad is worth roughly a tenth of GDP. It reaches households in every part of the country, including those the state budget never does."
 BOS_diaspora_returnees: "Returning Diaspora"
 BOS_diaspora_returnees_desc: "Resettlement grants are bringing families back from Germany, Austria, and Scandinavia. They arrive with savings, skills, and children."
 BOS_nato_interoperability: "NATO Interoperability"
 BOS_nato_interoperability_desc: "Joint exercises, alliance standards, and Partnership for Peace programs are rebuilding the armed forces along Western lines."
 BOS_political.29.t: "Diaspora Money Comes Home"
 BOS_political.29.d: "The investment drive has closed with commitments from diaspora business owners across Europe and North America. The sums are modest by international standards, but they arrive in municipalities that foreign investors ignore."
 BOS_political.29.a: "Welcome news"
 BOS_political.30.t: "Karadžić Is in Custody"
 BOS_political.30.d: "News from Belgrade has spread through Sarajevo within the hour. Radovan Karadžić, wartime leader of the Bosnian Serbs, has been arrested and faces transfer to The Hague. Survivors' associations and victims' families are gathering in quiet vigils from Sarajevo to Srebrenica. In Banja Luka the mood is darker."
 BOS_political.30.a: "Thirteen years too late"
 BOS_political.31.t: "Mladić Is in Custody"
 BOS_political.31.d: "Ratko Mladić, commander of the army that carried out the Srebrenica massacre, has been arrested at a farmhouse in northern Serbia. For the mothers of Srebrenica the arrest ends sixteen years of waiting. Across the Inter-Entity Boundary Line, some still speak of him as a defender."
 BOS_political.31.a: "Justice reaches Lazarevo"
 BOS_political.32.t: "The Sejdić-Finci Ruling"
 BOS_political.32.d: "The European Court of Human Rights has ruled that the constitution's ethnic eligibility rules violate the European Convention. Dervo Sejdić and Jakob Finci, a Roma activist and a Jewish community leader, cannot stand for the presidency because they belong to none of the three constituent peoples. Croat parties add that the current arrangement lets others elect their member of the presidency for them. Implementing the ruling requires constitutional change that no one is eager to negotiate."
 BOS_political.32.a: "Amending Dayton is easier said than done"
 BOS_sejdic_finci_ruling_tt: "§YStrasbourg has ruled against the constitution's ethnic eligibility rules. Judicial reform that addresses the ruling will carry extra weight in Brussels.§!"
 BOS_sejdic_finci_addressed_tt: "§GThe reform addresses the Sejdić-Finci ruling, closing a standing demand from Brussels.§!"
 BOS_serbia_reaction_tt: "Serbia will decide whether to back Republika Srpska."
 BOS_croatia_reaction_tt: "Croatia will decide whether to back Herzeg-Bosnia."
 BOS_political.33.t: "EUFOR Takes Over"
 BOS_political.33.d: "At a ceremony in Camp Butmir the NATO-led Stabilisation Force has formally handed its mission to the European Union. Operation Althea inherits SFOR's troops, bases, and mandate under the Berlin Plus arrangements. For most Bosnians the only visible change is the flag on the sleeve."
 BOS_political.33.a: "The flags change at Butmir"
 BOS_political.34.t: "The First Census Since the War"
 BOS_political.34.d: "Enumerators have begun the first population count since 1991. Every question of ethnicity, language, and faith is contested ground, and Republika Srpska has already announced it will not accept the methodology for counting citizens living abroad. Behind the forms stands the question nobody asks aloud: who is still here."
 BOS_political.34.a: "Count what remains"
 BOS_political.35.t: "Tuzla Is Burning"
 BOS_political.35.d: "Protests that began outside Tuzla's bankrupt factories have spread to Sarajevo, Zenica, and Mostar. Government buildings are on fire, and the crowds are not chanting ethnic slogans but demanding jobs and the prosecution of privatization fraud. Citizens' plenums are forming to put their demands directly to the cantonal governments."
 BOS_political.35.a: "Meet the plenums' demands"
 BOS_political.35.b: "Restore order first"
 BOS_political.36.t: "Application Submitted in Brussels"
 BOS_political.36.d: "The chairman of the Council of Ministers has handed Bosnia's application for membership of the European Union to the Dutch presidency of the Council. Years of adaptation lie ahead before candidate status is in reach, but the application commits every level of government, on paper at least, to the same direction."
 BOS_political.36.a: "The road will be long"
 BOS_political.37.t: "The High Representative Bans Genocide Denial"
 BOS_political.37.d: "In one of his final acts in office, the outgoing High Representative has imposed criminal penalties for denying the Srebrenica genocide and glorifying war criminals. Banja Luka has erupted. Entity leaders declare the decision void, announce a boycott of state institutions, and speak openly of taking back what Dayton gave away."
 BOS_political.37.a: "The law applies to everyone"
 BOS_political.37.b: "Keep the state out of it"
 BOS_political.38.t: "Banja Luka Votes to Withdraw"
 BOS_political.38.d: "The entity assembly has instructed its government to pull Republika Srpska out of the state army, the tax authority, and the judiciary within six months. The conclusions are declaratory for now, but they map the road to dissolution in plain language. Embassies are drafting statements, and the guarantors of Dayton are being asked what the agreement is still worth."
 BOS_political.38.a: "Take it to the guarantors"
 BOS_political.38.b: "Wait for Banja Luka to blink"
 BOS_political.40.t: "Kosovo Declares Independence"
 BOS_political.40.d: "Pristina has proclaimed independence from Serbia. The declaration divides Bosnia: Bosniak and Croat leaders lean toward recognition, while Republika Srpska warns it is a precedent for its own separation."
 BOS_political.40.a: "Voice support for self-determination"
 BOS_political.40.b: "Reject the unilateral declaration"
 BOS_political.40.c: "Stay neutral to hold the state together"
 BOS_political.41.t: "Migrants Mass in the Una-Sana"
 BOS_political.41.d: "Thousands moving along the Western Balkans route are stranded near the Croatian border. Authorities in the Una-Sana Canton say the camps are overflowing and they cannot cope alone."
 BOS_political.41.a: "Request European Union assistance"
 BOS_political.41.b: "Tighten the border and clear the camps"
 BOS_political.42.t: "Association Agreement With Europe"
 BOS_political.42.d: "Bosnia and Herzegovina has signed the Stabilisation and Association Agreement with the European Union. It is the first contractual step on the long road to membership."
 BOS_political.42.a: "A milestone toward Europe"
 BOS_political.43.t: "A State Value Added Tax"
 BOS_political.43.d: "A single state-level VAT replaces the old patchwork of entity sales taxes. Collection is centralized and the revenue is shared through one national account."
 BOS_political.43.a: "Implement the unified tax"
 BOS_political.43.b: "Let the entities keep their own rates"
 BOS_political.44.t: "The April Package"
 BOS_political.44.d: "A negotiated set of constitutional amendments would strengthen the central state and streamline the presidency. It stands two votes short in the House of Representatives."
 BOS_political.44.a: "Spend capital to pass the reforms"
 BOS_political.44.b: "Let the package fail"
 BOS_political.45.t: "The Butmir Talks"
 BOS_political.45.d: "American and European mediators have gathered the party leaders at a base near Sarajevo to break the constitutional deadlock. The proposals ask the entities to cede powers to the state."
 BOS_political.45.a: "Engage with the mediators"
 BOS_political.45.b: "Defend the entity prerogatives"
 BOS_political.46.t: "Brcko District in Question"
 BOS_political.46.d: "Republika Srpska threatens to withdraw its officials from the shared institutions of Brcko District, the self-governing corridor placed under state supervision after the war."
 BOS_political.46.a: "Defend the district's shared status"
 BOS_political.46.b: "Concede ground to keep the peace"
 BOS_political.47.t: "Mostar Without a Government"
 BOS_political.47.d: "Croat and Bosniak parties cannot agree on a city statute, and Mostar has gone years without valid local elections. The divided city drifts without a council."
 BOS_political.47.a: "Impose a unified city statute"
 BOS_political.47.b: "Leave the parties to their standoff"
 BOS_political.48.t: "The Exodus Accelerates"
 BOS_political.48.d: "Buses and budget flights out of Sarajevo, Tuzla, and Banja Luka run full in one direction. Young graduates, tradesmen, and whole families are leaving for Germany, Austria, and Croatia faster than the state can replace them."
 BOS_political.48.a: "Commission a report on the causes"
 BOS_political.48.b: "Dismiss it as ordinary EU-era mobility"
 BOS_political.49.t: "Komšić Wins the Croat Seat"
 BOS_political.49.d: "Željko Komšić has won the Croat seat of the presidency on Bosniak-majority votes, defeating HDZ's Dragan Čović. Croat-majority towns are declaring him unwelcome, and Zagreb is protesting a result its own community rejects."
 BOS_political.49.a: "A multiethnic mandate, fairly won"
 BOS_political.49.b: "Croat voters were outvoted, not represented"
 BOS_political.50.t: "The NATO Programme Deadlock"
 BOS_political.50.d: "SNSD ministers refuse to let the state submit an Annual National Programme to NATO, and without one the Council of Ministers cannot form. Months are passing with no government at all."
 BOS_political.50.a: "Submit the programme regardless"
 BOS_political.50.b: "Offer a relabeled Reform Programme instead"
 BOS_political.51.t: "A Government, at Last"
 BOS_political.51.d: "Fourteen months after the election, the Council of Ministers has been sworn in. Sarajevo has a government again, bought with a face-saving compromise nobody is fully happy with."
 BOS_political.51.a: "Back to work"
 BOS_political.52.t: "A High Representative Without a Mandate"
 BOS_political.52.d: "Christian Schmidt has taken office as High Representative, but the UN Security Council never endorsed his appointment. Russia, China, and Republika Srpska's leadership have seized on the gap to call his authority illegitimate."
 BOS_political.52.a: "Business as usual in Sarajevo"
 BOS_political.53.t: "Reforms Imposed at the Ballot Box"
 BOS_political.53.d: "As the polls closed, the High Representative used his Bonn powers to impose amendments to the Federation constitution and the election law, enlarging the House of Peoples and setting deadlines for forming governments. Critics call it an imposed constitution; HDZ calls it overdue."
 BOS_political.53.a: "A pragmatic fix, however it arrived"
 BOS_political.53.b: "An illiberal overreach"
 BOS_political.53.c: "Stay out of the argument"
 BOS_political.54.t: "Banja Luka Voids the Court"
 BOS_political.54.d: "The entity assembly has passed laws declaring that rulings of the state Constitutional Court do not apply in Republika Srpska, and barring publication of the High Representative's decisions in the entity's official gazette. Sarajevo's writ now stops at the Inter-Entity Boundary Line."
 BOS_political.54.a: "Contest it through every channel available"
 BOS_political.54.b: "Let the moment pass"
 BOS_hr_legitimacy_disputed_tt: "§RRepublika Srpska treats the High Representative's decisions as void, deepening the crisis§!"
 BOS_political.55.t: "Brussels Opens the Talks"
 BOS_political.55.d: "Eight years after Bosnia applied, the European Council has agreed to open accession negotiations. The road to membership is still long, but for the first time it runs through Brussels rather than around it."
 BOS_political.55.a: "Celebrate the milestone"
 BOS_political.55.b: "Temper the celebrations"
 BOS_political.57.t: "Dodik Convicted and Banned"
 BOS_political.57.d: "The Court of Bosnia and Herzegovina has convicted Milorad Dodik for defying the High Representative's decisions and barred him from holding office. Republika Srpska's institutions must decide whether to accept the ruling or defy it."
 BOS_political.57.a: "The ruling stands"
 BOS_political.57.b: "Republika Srpska will not be told who leads it"
 BOS_reject_third_entity_demand: "Reject the Third-Entity Demand"
 BOS_reject_third_entity_demand_desc: "Rule out restructuring the Federation into a separate Croat-majority entity. Bosniak parties are relieved; Croat parties call it proof Sarajevo will never listen."
 BOS_concede_partial_croat_autonomy: "Concede Partial Croat Autonomy"
 BOS_concede_partial_croat_autonomy_desc: "Grant Croat-majority cantons expanded self-governance short of a full third entity. It answers HNS's core grievance, at the cost of another layer of government to coordinate."
 BOS_register_defence_property: "Register Defence Property as State-Owned"
 BOS_register_defence_property_desc: "Transfer the military sites still claimed by the entities onto the state's books, the precondition NATO has set for activating a Membership Action Plan."
 BOS_request_nato_waiver: "Request a NATO Waiver"
 BOS_request_nato_waiver_desc: "Ask NATO to waive the defence-property condition outright rather than wait for Republika Srpska's consent. It works, and Banja Luka does not forget who asked."
 BOS_activate_map: "Activate the Membership Action Plan"
 BOS_activate_map_desc: "With the property question settled, take up NATO's Membership Action Plan and begin the formal path toward accession."
 BOS_expand_arms_exports: "Expand Ammunition and Arms Exports"
 BOS_expand_arms_exports_desc: "Back the state-linked arms plants as they scale up exports to buyers across Europe and beyond. The order books are full, and so is the argument over where the shipments end up."
 BOS_gulf_investment_delivered_tt: "§GBuroj Ozone breaks ground on schedule§!"
 BOS_gulf_investment_stalled_tt: "§RBuroj Ozone stalls well short of what was promised§!"
 BOS_host_sarajevo_film_festival: "Host the Sarajevo Film Festival"
 BOS_host_sarajevo_film_festival_desc: "Back Southeast Europe's largest film festival with state funds and logistics. It draws tourists and press to Sarajevo every summer and keeps the city's cultural profile well ahead of its neighbors."
 BOS_federation_development_grant: "Federation Development Grant"
 BOS_federation_development_grant_desc: "Channel treasury funds into infrastructure across the Bosniak-majority Federation cantons. The Bosniak community welcomes the investment, though Republika Srpska reads it as favoritism."
 BOS_herzegovina_development_grant: "Herzegovina Development Grant"
 BOS_herzegovina_development_grant_desc: "Fund roads and utilities in Croat-majority Herzegovina. Croat leaders take it as recognition, while Bosniaks resent money flowing to the nationalist strongholds."
 BOS_srpska_development_grant: "Republika Srpska Development Grant"
 BOS_srpska_development_grant_desc: "Direct treasury funds into infrastructure in Republika Srpska. The gesture buys Serb goodwill, but Bosniaks bristle at rewarding the entity that keeps threatening to leave."
 BOS_croat_grievance: "Croat Political Grievance"
 BOS_croat_grievance_desc: "Croat parties say the presidency's Croat seat was decided by Bosniak votes, not Croat ones, and demand an electoral system that cannot be outvoted from outside the community."
 BOS_third_entity_demand: "Federal Restructuring"
 BOS_third_entity_demand_desc: "Croat-majority cantons hold expanded self-governance, won at the cost of a state apparatus that is one layer more complicated to run."
 BOS_contested_high_representative: "High Representative's Disputed Mandate"
 BOS_contested_high_representative_desc: "The High Representative took office without a UN Security Council endorsement. Republika Srpska treats the gap as license to ignore his rulings, and every use of the Bonn powers now invites a legitimacy fight as well as a policy fight."
 BOS_map_participant: "NATO Membership Action Plan"
 BOS_map_participant_desc: "Bosnian officers train and plan alongside NATO counterparts under the Membership Action Plan, the formal track toward eventual accession."
 BOS_arms_export_boom: "Arms Export Boom"
 BOS_arms_export_boom_desc: "State-linked arms plants are running at capacity to fill NATO-caliber and Warsaw Pact-caliber orders alike. The treasury benefits, and so does the argument over who the shipments really reach."
 BOS_brain_drain_1: "Mass Emigration"
 BOS_brain_drain_1_desc: "Hundreds of thousands have left since the visa-free travel era began, and the educated and the young are overrepresented among them. Classrooms, clinics, and factory floors all feel the gap."
 BOS_brain_drain_eased_tt: "§GReturning families are easing the mass emigration problem§!"
 BOS_economic_reconstruction: "Rebuild the Economy"
 BOS_economic_reconstruction_desc: "Postwar Bosnia never finished rebuilding. A generation on, the state still needs a coherent economic program instead of ad hoc privatization and foreign loans taken one at a time."
 BOS_reform_agenda_adoption: "Adopt the Reform Agenda"
 BOS_reform_agenda_adoption_desc: "Commit to the socioeconomic reform program the EU has set as the price of reactivating the accession track. Judicial and market reforms move faster once Brussels can point to a formal plan."
 BOS_growth_plan_negotiations: "Negotiate the Growth Plan"
 BOS_growth_plan_negotiations_desc: "Open talks on drawing from the EU's Reform and Growth Facility. The money is real, but so are the conditions attached to it."
 BOS_corridor_vc_northern_construction: "Build the Northern Corridor"
 BOS_corridor_vc_northern_construction_desc: "Push construction of Corridor Vc through Doboj, Zenica, and Sarajevo. It is the country's largest infrastructure project since the war, financed mostly from Brussels."
 BOS_corridor_vc_southern_construction: "Extend the Corridor South"
 BOS_corridor_vc_southern_construction_desc: "Carry the motorway on toward Mostar, closing the gap between the Federation's industrial north and its Adriatic-facing south."
 BOS_corridor_vc_opening: "Open Corridor Vc"
 BOS_corridor_vc_opening_desc: "Cut the ribbon on the completed route from the Hungarian border to the port of Ploče. It is the clearest deliverable of two decades of EU-financed development."
 BOS_east_energy_partnership: "Court Chinese Energy Financing"
 BOS_east_energy_partnership_desc: "Lean on Chinese state loans and contractors to keep the country's coal-fired plants running and expanding, whatever it costs the EU accession file."
 BOS_west_energy_partnership: "Align Energy Policy with the EU"
 BOS_west_energy_partnership_desc: "Steer investment toward hydropower and EU-financed grid upgrades rather than new coal capacity, keeping the energy sector inside European state-aid rules."
 BOS_defense_industry_revival: "Revive the Defense Plants"
 BOS_defense_industry_revival_desc: "Put state backing behind Igman Konjic and Unis Ginex, the ammunition plants that once supplied half of Yugoslavia and now sit well under capacity."
 BOS_arms_industry_capacity_expansion: "Expand Production Capacity"
 BOS_arms_industry_capacity_expansion_desc: "Retool the arms plants to run both NATO- and Warsaw Pact-caliber production lines at once, the combination that makes Bosnian ammunition sellable almost anywhere."
 BOS_defense_export_drive: "Chase the Export Boom"
 BOS_defense_export_drive_desc: "Back the plants as they scale up for the export markets opened by renewed demand abroad. The order books are full and getting fuller."
 BOS_national_jobs_program: "Launch a National Jobs Program"
 BOS_national_jobs_program_desc: "Fund job creation and training at home to give the hundreds of thousands who have left since the visa-free era began a reason to consider staying, or coming back."
 BOS_youth_retention_initiative: "Invest in Youth Retention"
 BOS_youth_retention_initiative_desc: "Extend the jobs program with grants and housing support aimed squarely at the young graduates and tradespeople who make up most of the outflow."
 BOS_brain_drain_reversed_tt: "§GThe mass emigration problem has been resolved§!"
 BOS_corridor_vc_trade_boost: "Corridor Vc Open"
 BOS_corridor_vc_trade_boost_desc: "The completed motorway link cuts freight times across the country and out to the Adriatic, easing trade with the rest of Europe."
 BOS_defense_industrial_base: "Revived Defense Industrial Base"
 BOS_defense_industrial_base_desc: "Igman Konjic and Unis Ginex are running closer to their old capacity, though the extra output still competes with civilian goods for the same factories."
 BOS_jobs_program_idea: "National Jobs Program"
 BOS_jobs_program_idea_desc: "State-funded job creation is giving workers a reason to stay rather than join the queue for a Germany-bound bus."
 BOS_youth_retention_idea: "Youth Retention Grants"
 BOS_youth_retention_idea_desc: "Housing and career grants aimed at young graduates are keeping some of them in the country long enough to start families and careers here."
 BOS_mostar_industrial_decline: "Mostar Smelter Closure"
 BOS_mostar_industrial_decline_desc: "The aluminium plant that was once the Federation's single largest power consumer sits dark, and Mostar's economy is short several thousand jobs it has not replaced."
 BOS_mostar_industrial_revival: "Mostar Under New Management"
 BOS_mostar_industrial_revival_desc: "A strategic investor has taken over the Mostar smelter's operations, restarting production at reduced but workable capacity."
 BOS_zenica_industrial_decline: "Zenica Steelworks Wind-down"
 BOS_zenica_industrial_decline_desc: "The blast furnace that anchored Zenica's economy for over a century has gone cold, and the region is absorbing the loss of thousands of jobs."
 BOS_zenica_industrial_revival: "Zenica Under New Ownership"
 BOS_zenica_industrial_revival_desc: "A buyer has taken over the Zenica steelworks, keeping part of the old workforce employed under new management."
 BOS_eu_growth_plan_tranche: "Draw an EU Growth Plan Tranche"
 BOS_eu_growth_plan_tranche_desc: "Request the next disbursement from the EU's Reform and Growth Facility. Corruption above the threshold or a government too unstable to negotiate will forfeit the tranche."
 BOS_political.58.t: "The Mostar Smelter Goes Dark"
 BOS_political.58.d: "Aluminij Mostar, the Federation's single largest power consumer, has been cut off over hundreds of millions in unpaid debt to the electric utility. Glencore walked away from a takeover months ago, and restarting a smelter this size after a full shutdown may not even be possible."
 BOS_political.58.a: "Let the plant close"
 BOS_political.58.b: "Court a strategic investor"
 BOS_political.59.t: "Zenica's Blast Furnace Goes Cold"
 BOS_political.59.d: "ArcelorMittal has idled the blast furnace at its Zenica steelworks, a plant that has anchored the town's economy for over a century. Weak European demand and high energy costs have made the line unprofitable to run."
 BOS_political.59.a: "Let the furnace stay cold"
 BOS_political.59.b: "Find a new owner"
 BOS_political.60.t: "Tuzla Block 7 Falls Through"
 BOS_political.60.d: "The Chinese-financed lignite unit at Tuzla is officially dead. The state guarantee behind the loan breached EU state-aid rules years ago, and the government has finally confirmed what Brussels was already saying. China Gezhouba wants its contract honored regardless."
 BOS_political.60.a: "Accept the cancellation"
 BOS_political.60.b: "Contest the termination"
 BOS_political.61.t: "Free Travel to Europe"
 BOS_political.61.d: "The EU has abolished short-stay Schengen visas for Bosnian biometric passport holders. For the first time since the war, crossing into the EU means nothing more than showing a passport at the border."
 BOS_political.61.a: "Celebrate the milestone"
 BOS_political.61.b: "Warn where this road leads"
 BOS_visa_era_emigration_tt: "§YVisa-free travel to the EU has made leaving easier than ever§!"
 BOS_political.62.t: "The 2010 Election's Civic Moment"
 BOS_political.62.d: "Zlatko Lagumdžija's multiethnic SDP has topped the Federation vote for the first time since the war, while Milorad Dodik's SNSD sweeps Republika Srpska. Six parties now have to build a government neither side can dominate."
 BOS_political.62.a: "Build on the civic breakthrough"
 BOS_political.62.b: "Let the entities hold their ground"
 BOS_political.63.t: "A Coalition, Sixteen Months Late"
 BOS_political.63.d: "Sixteen months after the polls closed, a six-party coalition has finally formed a Council of Ministers. It took most of that time just to agree who would chair it."
 BOS_political.63.a: "Back to governing"
 BOS_paralysis_lifted_tt: "§GThe government-formation paralysis has been resolved§!"
 BOS_political.64.t: "Return of the Nationalists"
 BOS_political.64.d: "The SDA has reclaimed the largest-party title in the Federation, Dragan Čović holds the Croat presidency seat, and Dodik has narrowly kept Republika Srpska. The multiethnic experiment of 2010 has all but collapsed."
 BOS_political.64.a: "The old blocs are back for a reason"
 BOS_political.64.b: "Try the civic path again"
 BOS_political.65.t: "Mostar Votes Again"
 BOS_political.65.d: "After a European court ruling forced Sarajevo's hand and Izetbegović and Čović struck a new city statute, Mostar has held local elections for the first time in twelve years. The divided city finally has an elected council."
 BOS_political.65.a: "A fresh mandate for the city"
 BOS_political.65.b: "A fragile truce, nothing more"
 BOS_political.66.t: "Republika Srpska's Foreign Agents Law"
 BOS_political.66.d: "Days after Dodik's conviction, the entity assembly has rushed through a law forcing foreign-funded NGOs and independent media to register as foreign agents and report every donation. The OSCE and the Venice Commission call it a rollback of civil society."
 BOS_political.66.a: "Condemn the crackdown"
 BOS_political.66.b: "Republika Srpska answers to itself"
 BOS_political.67.t: "A Warrant Nobody Will Serve"
 BOS_political.67.d: "Dodik has ignored a national and Interpol arrest warrant, traveling through Belgrade and Israel to Moscow. When the state security agency tried to arrest him inside Republika Srpska, entity police stood in the way."
 BOS_political.67.a: "Press the arrest through"
 BOS_political.67.b: "Let the confrontation cool"
 BOS_rs_police_standoff_tt: "§RRepublika Srpska police are shielding Dodik from arrest, deepening the crisis§!"
 BOS_political.68.t: "A Snap Election for Dodik's Chair"
 BOS_political.68.d: "With Dodik stripped of the presidency by the electoral commission, Republika Srpska has held a snap presidential election. SNSD loyalist Siniša Karan and SDS challenger Branko Blanuša finish within three points of each other."
 BOS_political.68.a: "The SNSD machine holds"
 BOS_political.68.b: "The opposition breaks through"
 BOS_political.69.t: "The Ljubić Ruling"
 BOS_political.69.d: "The Constitutional Court has struck down the guarantee of at least one delegate per ethnic group per canton in the Federation's House of Peoples. Parliament has no majority to write a replacement, so election law stays frozen."
 BOS_political.69.a: "Warn that this will come back to bite"
 BOS_political.69.b: "Note it and move on"
 BOS_political.49.d_ljubic: "Željko Komšić has won the Croat seat of the presidency on Bosniak-majority votes, defeating HDZ's Dragan Čović. The same election-law gap the Constitutional Court left open in the Ljubić ruling two years ago is now the center of HDZ's case that Croat voters can always be outvoted. Croat-majority towns are declaring him unwelcome, and Zagreb is protesting a result its own community rejects."
 BOS_political.70.t: "The Bugojno Police Station Bombing"
 BOS_political.70.d: "A homemade bomb has torn through the police station in Bugojno, killing one officer and wounding six. The Salafist cell behind it is the first major domestically grown jihadist network the country has faced since the war."
 BOS_political.70.a: "Treat it as an isolated cell"
 BOS_political.70.b: "Sound the alarm on radicalization"
 BOS_counter_radicalization_available_tt: "§YA counter-radicalization decision is now available§!"
 BOS_political.71.t: "Gunfire at the US Embassy"
 BOS_political.71.d: "A gunman from the Wahhabist enclave of Gornja Maoča has fired more than a hundred rounds at the American embassy in Sarajevo before a police sniper brought him down. The country's radicalization problem is no longer a domestic story."
 BOS_political.71.a: "Absorb the diplomatic fallout"
 BOS_political.71.b: "Demand answers on the enclaves"
 BOS_salafi_enclave_decision_available_tt: "§YA decision to monitor the Salafi enclaves is now available§!"
 BOS_political.72.t: "Attack on the Zvornik Police Station"
 BOS_political.72.d: "A gunman has killed a police officer at the Zvornik station in Republika Srpska before being shot dead himself, the first Islamist attack to strike inside the Serb entity. Some of his known associates fought in Syria."
 BOS_political.72.a: "The threat respects no entity line"
 BOS_political.73.t: "Washington Sanctions Dodik's Network"
 BOS_political.73.d: "The US Treasury has sanctioned Milorad Dodik and widened the net around his family and patronage network, citing corruption and the deliberate obstruction of Dayton. It is the sharpest Western coercive tool aimed at Republika Srpska so far."
 BOS_political.73.a: "Overdue accountability"
 BOS_political.73.b: "An attack on Republika Srpska itself"
 BOS_sanctions_deepen_crisis_tt: "§RThe sanctions compound the ongoing Republika Srpska secession crisis§!"
 BOS_political.74.t: "The Babylution"
 BOS_political.74.d: "Parliament let the citizen ID law lapse in the deadlock, so newborns have gone without ID numbers, passports, or medical cards for months. After a gravely ill baby died waiting for treatment abroad, ten thousand people have marched in Sarajevo, the largest civic protest since the war."
 BOS_political.74.a: "Promise a fast fix"
 BOS_political.74.b: "Let parliament work it out"
 BOS_political.75.t: "Bosnia Qualifies for the World Cup"
 BOS_political.75.d: "A 1-0 win in Lithuania has sent Bosnia and Herzegovina to its first World Cup as an independent nation. For a few weeks, Edin Džeko's squad has the whole country cheering for the same thing."
 BOS_political.75.a: "A country united, if briefly"
 BOS_political.81.t: "The SAA Finally Takes Effect"
 BOS_political.81.d: "Nine years after signature, the Stabilisation and Association Agreement has entered into force. It restarts a European path that had been stalled for years and sets up the Reform Agenda now taking shape in the Council of Ministers."
 BOS_political.81.a: "A fresh start with Brussels"
 BOS_political.77.t: "B&H Airlines Grounded for Good"
 BOS_political.77.d: "The Federation government has liquidated the flag carrier B&H Airlines under debts it could never repay. For the first time since independence, the country has no national airline."
 BOS_political.77.a: "Let it go"
 BOS_political.77.b: "Bail it out"
 BOS_political.78.t: "Buroj Ozone Announced"
 BOS_political.78.d: "Dubai's Buroj Property Development has unveiled plans for a 4.3-billion-euro resort city at Trnovo, just outside Sarajevo, promising thousands of jobs. Gulf capital is eyeing Bosnia's real estate and tourism sectors like never before."
 BOS_political.78.a: "Welcome the announcement"
 BOS_political.76.t: "EFT Stanari Comes Online"
 BOS_political.76.d: "The 300-megawatt Stanari lignite plant near Banja Luka has reached commercial operation, the first new thermal plant built anywhere in Bosnia since the war. Republika Srpska now has its own steady source of power, financed and built with Chinese money."
 BOS_political.76.a: "A point of Republika Srpska pride"
 BOS_political.80.t: "The First Sarajevo Pride"
 BOS_political.80.d: "Roughly two thousand people have marched through Sarajevo for the country's first-ever Pride, the last former Yugoslav capital to hold one. A small counter-protest gathered under a \"traditional values\" banner, but the march passed without violence."
 BOS_political.80.a: "Guarantee the marchers protection"
 BOS_political.80.b: "Keep the state's distance"
 BOS_political.79.t: "Floods and Landslides Bury Jablanica"
 BOS_political.79.d: "Flash floods and landslides have torn through central and southern Bosnia, the worst disaster the country has seen in a decade. Donja Jablanica has been hit hardest, with a debris flow burying homes and killing dozens."
 BOS_political.79.a: "Appeal for EU solidarity aid"
 BOS_political.79.b: "Rebuild on our own"
 BOS_pass_jmbg_law: "Pass the JMBG Law"
 BOS_pass_jmbg_law_desc: "Push a replacement citizen ID law through parliament, ending the registration lapse that has left newborns without identity documents."
 BOS_jmbg_law_passed_tt: "§GThe citizen ID law has been replaced, and the protests have subsided§!"
 BOS_counter_radicalization_program: "Launch a Counter-Radicalization Program"
 BOS_counter_radicalization_program_desc: "Fund outreach and monitoring aimed at the Salafist networks behind the recent bombing, rolling back some of the damage to domestic security."
 BOS_monitor_salafi_enclaves: "Monitor the Salafi Enclaves"
 BOS_monitor_salafi_enclaves_desc: "Put villages like Gornja Maoča under sustained surveillance. It improves detection, and it tells the Bosniak communities living there exactly how the state sees them."
 BOS_repatriate_foreign_fighters: "Repatriate and Prosecute Foreign Fighters"
 BOS_repatriate_foreign_fighters_desc: "Bring home the citizens who fought for ISIS in Syria and Iraq and try them under the 2014 terrorism law. Reintegration is expensive, and not every case ends cleanly."
 BOS_reintegration_success_tt: "§GThe returnees have been successfully reintegrated§!"
 BOS_reintegration_relapse_tt: "§RSome returnees have drifted back toward radical networks§!"
 BOS_government_formation_paralysis: "Government Formation Paralysis"
 BOS_government_formation_paralysis_desc: "No coalition commands enough seats to form a Council of Ministers. Ministries run on caretaker budgets while the parties negotiate."
 BOS_civil_society_crackdown: "Civil Society Crackdown"
 BOS_civil_society_crackdown_desc: "Republika Srpska's foreign agents law forces NGOs and independent media to register, report their funding, and label their own output. Watchdogs and donors alike are pulling back from the entity."
 BOS_domestic_terror_threat_1: "Domestic Terror Threat"
 BOS_domestic_terror_threat_1_desc: "A small but active Salafist network operates largely outside the state's view, drawing recruits from a handful of isolated communities."
 BOS_counter_radicalization_measures: "Counter-Radicalization Measures"
 BOS_counter_radicalization_measures_desc: "Outreach programs and expanded monitoring are chipping away at the networks that produced the Bugojno bombing."
 BOS_salafi_enclave_monitoring: "Salafi Enclave Monitoring"
 BOS_salafi_enclave_monitoring_desc: "Security services keep a standing watch over Gornja Maoča and similar communities. It catches more plots than it used to, at the cost of trust in the neighborhoods being watched."
 BOS_foreign_fighter_reintegration: "Foreign Fighter Reintegration"
 BOS_foreign_fighter_reintegration_desc: "Returnees convicted and released under the repatriation program are being steered into work and away from the networks that recruited them the first time."
 BOS_eufor_deterrence: "EUFOR Reinforcement"
 BOS_eufor_deterrence_desc: "A larger EUFOR Althea garrison stands as a visible reminder that Bosnia's peace has outside guarantors, a fact that weighs on anyone in Banja Luka thinking about secession."
 BOS_eufor_deterrence_tt: "§YEUFOR's reinforced presence dampens the risk of a Republika Srpska secession bid§!"
 BOS_jmbg_crisis: "The JMBG Crisis"
 BOS_jmbg_crisis_desc: "Newborns are going without identity documents while parliament fails to agree a replacement citizen ID law. The longer it drags on, the larger the protests get."
 BOS_world_cup_unity: "World Cup Fever"
 BOS_world_cup_unity_desc: "The national team's run to its first World Cup has given Bosniaks, Croats, and Serbs alike something to cheer for at the same time."
 BOS_stanari_plant_online: "Stanari Plant Online"
 BOS_stanari_plant_online_desc: "The Chinese-built Stanari lignite plant is feeding steady power into Republika Srpska's grid, the first new thermal capacity built anywhere in the country since the war."
 BOS_national_carrier_pride: "National Carrier Pride"
 BOS_national_carrier_pride_desc: "The state-subsidized flag carrier is still flying, a small point of pride in a country that has otherwise gone without one since 2015."
 BOS_trb_header_despot: "Despot Armoured Programme"
 BOS_trb_header_vihor: "Vihor Tactical Programme"
