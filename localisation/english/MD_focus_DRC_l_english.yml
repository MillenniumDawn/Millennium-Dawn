 MDRC_form_crown_1: "Proclaim the Restored Kingdom of Kongo"
 MDRC_form_crown_1_desc: "Constitute Restored Kingdom of Kongo through a regional charter. Requires the listed political programme, an eligible governing party, peace, and all highlighted territory under direct or puppet ownership and control. Costs 5 treasury and 200 political power. Puppets remain separate countries. The new national spirit brings shared institutions and ongoing administrative or military costs; territorial cores require later integration decisions. This is an alternate-history political union, not a reconstruction of exact historical borders."
 MDRC_union_crown_1: "Restored Kingdom of Kongo: Founding Charter"
 MDRC_union_crown_1_desc: "Shared institutions support the union but require ongoing expenditure. This replaces the earlier union charter, if present. Puppets retain their autonomy until a separately chosen and accepted accession offer."
