 tooltip_remove_productivity_from_state: "§WПроизводительность этого штата будет §Rуменьшился§! к §R$PRODUCTIVITY_AMOUNT$§! баллов.\n §!"
 UKR_develop_t64_strazh_desc: "БМПТ «Страж» — экспериментальная украинская машина поддержки танков, разработанная на шасси танка Т-64.\nПроект был разработан совместно Житомирским бронетанковым заводом, Киевским бронетанковым заводом и Государственным холдингом «Артем» и представлен в 2017 году.\nОригинальная башня Т-64 была заменена украинским дистанционно управляемым боевым модулем «Дуплет», что придало машине совершенно иную роль по сравнению с оригинальным танком.\nПроект был призван обеспечить огневую поддержку с усиленной защитой, используя при этом существующее шасси Т-64 и боевую технику украинской разработки.\n«Страж» остался экспериментальным проектом и не был принят на серийное производство, §Gно мы можем это изменить, верно?§!"
 UKR_develop_t72amt_desc: "Т-72АМТ представлял собой украинскую модернизацию танка Т-72А, разработанную Киевским бронетанковым заводом для Вооруженных Сил Украины.\nВ ходе модернизации были установлены двигатель В-84-1, улучшены приборы ночного видения, прицел 1К13 и украинская система динамической защиты «Ниж».\nТанк также получил современное оборудование связи и навигационную систему СН-3003 «Базальт», а элементы ходовой части были модернизированы с использованием компонентов, разработанных для Т-80.\nПрицел 1К13 позволил модернизированному танку использовать управляемый ракетный комплекс «Комбат».\nТ-72АМТ задумывался как относительно экономичный способ приближения существующих танков Т-72 к современным оперативным требованиям Украины."
 UKR_modernize_zsu_23_4m_a1_spaa_desc: "ЗСУ-23-4М-А1 «Рокач» — это украинская модернизация советской самоходной зенитной артиллерийской установки ЗСУ-23-4 «Шилка».\nВ ходе модернизации устаревшее оборудование управления огнём и наблюдения заменено современной цифровой системой, что повышает возможности машины по обнаружению и сопровождению воздушных целей.\nСистема сохраняет четыре 23-мм автоматические пушки, но получает улучшенную электронику и четыре зенитных ракеты малой дальности.\nЭти изменения значительно повышают боевую эффективность ЗСУ-23-4 против низколетящих целей."
 UKR_modernize_s125_spaa_desc: "С-125-2Д — это украинская модернизация советского зенитно-ракетного комплекса С-125.\nМодернизация направлена на замену устаревших электронных компонентов и повышение устойчивости системы к радиоэлектронной борьбе и современным средствам противодействия.\nМодернизируются радар и средства наведения, а также улучшаются возможности системы по обнаружению, сопровождению и поражению воздушных целей.\nМодернизация призвана продлить срок службы С-125 и повысить его эффективность на современном поле боя."
 UKR_modernize_s125m_spaa_desc: "Программа С-125М представляла собой украинскую программу модернизации, направленную на продление срока службы и расширение возможностей советского зенитного ракетного комплекса С-125 «Печора».\nПрограмма осуществлялась украинскими оборонными компаниями, включая КБ «Луч» и «Радионикс», и была сосредоточена на модернизации ракеты, а также оборудования наведения и управления огнем системы.\nМодернизация включала в себя модернизацию ракет 5В27Д и радиолокационной системы ФКР-125, заменив важные элементы оригинального оборудования советской эпохи.\nПроект С-125М предоставил Украине возможность значительно продлить срок службы существующих систем С-125 без разработки совершенно нового зенитного комплекса."
 UKR_modernize_kvadrat_spaa_desc: "2К12М1-2Л «Квадрат-2Л» — это украинская модернизация советского зенитно-ракетного комплекса 2К12М1 «Куб».\nВ ходе модернизации ряд устаревших электронных компонентов заменен современным оборудованием украинского производства.\nСистема получила улучшенные радиолокационные возможности и системы управления огнем, что повысило ее способность обнаруживать, отслеживать и поражать воздушные цели.\nМодернизация призвана продлить срок службы оставшихся комплексов 2К12М1, а также повысить их эффективность против современных угроз."
 UKR_develop_t38_stylet_spaa_desc: "Т-38 «Стилет» — украинский зенитно-ракетный комплекс малой дальности, разработанный Арсенальным заводом совместно с белорусскими партнерами.\nВ комплексе используется ракета Т-382, предназначенная для поражения самолетов, вертолетов, крылатых ракет и других низколетящих воздушных целей.\nКомплекс установлен на гусеничном шасси, что обеспечивает ему высокую мобильность и возможность действовать совместно с механизированными подразделениями.\nРазработка Т-38 предоставляет Украине современную замену устаревающим советским зенитно-ракетным комплексам малой дальности «Оса»."
 UKR_modernize_rk10_spaa_desc: "РК-10 — это украинская зенитная управляемая ракета, разработанная как альтернатива устаревшим ракетам, использовавшимся в советских зенитных ракетных комплексах малой дальности.\nИнтеграция РК-10 в систему «Стрела-10» позволит использовать более современную ракету на пусковых установках, сохранив при этом существующую инфраструктуру машины и пусковой установки.\nНовая ракета обеспечивает улучшенные возможности поражения цели и позволяет системе оставаться в рабочем состоянии, не полагаясь на всё более устаревающие советские боеприпасы.\nЭта модернизация продлит срок службы парка ракет «Стрела-10» и повысит их боевую эффективность."
 UKR_develop_kentavr_spaa_desc: "ЗРАК «Кентавр» — это украинская концепция новой самоходной зенитной установки, разработанной как дальнейшее развитие более раннего проекта «Переч».\nПроект был переработан вокруг двух парных 40-мм автоматических пушек, заменив более раннюю концепцию на основе 57-мм зенитной пушки, при этом сохранив ракетный компонент и специализированное оборудование управления огнём.\nКонцепция «Кентавр» предполагала сочетание радиолокационного обнаружения целей с электрооптической системой управления огнём, что позволило бы машине поражать воздушные цели, используя как артиллерийское, так и ракетное вооружение.\nСистема была разработана на основе гусеничного шасси, созданного на базе перспективной украинской танковой платформы, разработанной Харьковским конструкторским бюро Морозова в рамках программы развития «Молот»/«Боксер»."
 UKR_modernize_planes_category: "Модернизировать наши боевые самолеты"
 UKR_modernize_planes_category_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_main\n\n\n\n\n\n\n\n\nМы можем потратить время и деньги на исследование и тестирование модернизаций самолетов и вертолетов советской эпохи, используемых нашими ВВС. А когда пройдет некоторое время и мы наберемся опыта, мы, возможно, даже попробуем создать уникальные отечественные разработки."
 UKR_modernize_su25_m1_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_su25m1_for_tooltip\n\n\n\n\n\n\n\n\nСу-25М1 — это украинская модернизация советского самолёта непосредственной авиационной поддержки Су-25.\nМодернизация включает в себя улучшенное навигационное, коммуникационное и целеуказательное оборудование, сохраняя при этом существующий планер и вооружение самолёта.\nМодернизированные системы повышают точность неуправляемого оружия и позволяют самолёту более эффективно действовать в современных боевых условиях.\nМодернизация также продлевает срок службы украинского парка Су-25."
 UKR_modernize_su27_1m_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_su271m_for_tooltip\n\n\n\n\n\n\n\n\nСу-27-1М — это украинская модернизация советского истребителя Су-27.\nВ рамках программы были внедрены улучшенные системы навигации, связи, идентификации и бортовой электроники для повышения боевой эффективности самолета.\nМодернизированная авионика обеспечивает лучшую ситуационную осведомленность и улучшает возможности самолета по применению современного вооружения.\nМодернизация позволяет Су-27 оставаться на вооружении, одновременно снижая ограничения, накладываемые его первоначальным оборудованием советской эпохи."
 UKR_modernize_mig29_mu2_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_mig29mu1_for_tooltip\n\n\n\n\n\n\n\n\nМиГ-29МУ2 — это украинская модернизация советского истребителя МиГ-29, разработанная Львовским государственным авиаремонтным заводом.\nМодернизация основана на более ранней программе МУ1 и включает в себя более масштабные усовершенствования авионики, навигационных и целеуказательных систем самолета.\nСамолет получает улучшенные возможности применения современного управляемого и неуправляемого оружия против воздушных и наземных целей.\nПрограмма МУ2 призвана превратить МиГ-29 в более совершенный многоцелевой боевой самолет."
 UKR_modernize_mig29_mu1_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_mig29mu2_for_tooltip\n\n\n\n\n\n\n\n\nМиГ-29МУ1 — это украинская модернизация советского истребителя МиГ-29.\nПрограмма предусматривает усовершенствованную бортовую электронику и модернизированную систему радиолокационного предупреждения и навигации.\nМодернизированное оборудование повышает ситуационную осведомленность пилота и позволяет самолету более эффективно действовать в современных боевых условиях.\nМодернизация МУ1 также служит промежуточным этапом на пути к более масштабной модернизации МиГ-29."
 UKR_develop_an_bfv_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_an_bfv_development_for_tooltip\n\n\n\n\n\n\n\n\nПредложенный истребитель Антонова представлял собой концептуальный проект разработки боевого самолёта украинской разработки.\nЦелью проекта было использование опыта Украины в авиастроении и производстве для создания современного истребителя, не полагаясь полностью на зарубежные разработки.\nСамолёт должен был включать в себя современную авионику, вооружение и аэродинамические решения, будучи адаптированным к возможностям украинской авиационной промышленности.\nХотя проект оставался на стадии предложения, его разработка может заложить основу для будущего поколения украинских боевых самолётов."
 UKR_develop_bm21_k_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bm21k_for_tooltip\n\n\n\n\n\n\n\n\nБМ-21К — это украинская модернизация советской реактивной системы залпового огня БМ-21 «Град».\nСистема установлена на современном украинском шасси грузовика КрАЗ и получила улучшенное навигационное, коммуникационное и противопожарное оборудование.\nМодернизация повышает мобильность системы и позволяет экипажам более эффективно готовиться к выполнению огневых задач и проводить их.\nБМ-21К представляет собой относительно недорогой способ модернизации большого парка украинских пусковых установок «Град» советской эпохи."
 UKR_develop_bastion03_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bastion03_for_tooltip\n\n\n\n\n\n\n\n\n«Бастион-03» — это украинский реактивный ракетный комплекс, разработанный на Шепетовском ремонтном заводе в качестве модернизации советского БМ-27 «Ураган».\nСистема основана на современном шасси грузовика.\nМодернизация повышает мобильность и сокращает время, необходимое для подготовки пусковой установки к стрельбе.\n«Бастион-03» позволит Украине продолжать использовать существующие 220-мм ракеты, заменив устаревшие шасси советской эпохи."
 UKR_develop_Vilkha_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_vilkha_for_tooltip\n\n\n\n\n\n\n\n\n«Вильха» — это украинский реактивный ракетный комплекс, разработанный конструкторским бюро «Луч» на основе советской БМ-30 «Смерч».\nВ рамках проекта оригинальные неуправляемые ракеты заменены новыми управляемыми ракетами, оснащенными украинской системой наведения.\nСистема разработана для обеспечения значительно улучшенной точности при сохранении высокого разрушительного потенциала и дальности действия тяжелой реактивной системы залпового огня.\nРазработка «Вильхи» представляет собой переход от неуправляемой реактивной артиллерии советской эпохи к современным возможностям высокоточного поражения целей."
 UKR_develop_bureviy_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bureviy_for_tooltip\n\n\n\n\n\n\n\n\n«Буревий» — украинская реактивная система залпового огня, задуманная как современная замена стареющему семейству БМ-27 «Ураган».\nСистема смонтирована на современном шасси Tatra T815-7T3R2T и оснащена цифровыми системами управления огнём и навигации.\n«Буревий» рассчитан на применение как имеющихся 220-мм реактивных снарядов «Смерч», так и новых боеприпасов украинской разработки.\nСочетание современной электроники, повышенной подвижности и совместимости с имеющимися боеприпасами делает систему практичной модернизацией украинской реактивной артиллерии."
 UKR_modernize_mi24pu1_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mi24pu1_for_tooltip\n\n\n\n\n\n\n\n\nМи-24ПУ-1 — украинская модернизация Ми-24П, разработанная Конотопским авиаремонтным заводом «Авиакон» совместно с предприятиями украинского ОПК.\nВертолёт получил более мощные двигатели ТВ3-117ВМА-СБМ1В-02 производства «Мотор Сич», модернизированную авионику и навигационное оборудование, а также системы для работы с приборами ночного видения.\nВ ходе модернизации установлены система защиты «Адрос КТ-01АВ», лазерная прицельная система ФПМ-01КВ и доработанный прицел АСП-17ВПМ-В.\nВ программе участвовали «Мотор Сич», «Адрон», ЦКБ «Арсенал» и Изюмский приборостроительный завод, а в поздних версиях применялась и украинская оптико-электронная аппаратура.\nТаким образом, Ми-24ПУ-1 соединил капитальный ремонт исходного вертолёта с новыми украинскими двигателями, авионикой, защитой и прицельными системами."
 UKR_develop_nota_desc: "Объект 477А1 «Нота» — это передовой советский экспериментальный основной боевой танк, оснащенный необитаемой башней, изолированным боевым отделением и мощным 152-мм основным орудием."
 UKR_modernize_nota_desc: "Объект 477А1 «Нота» — украинская разработка советского проекта основного боевого танка «Молот» (Объект 477).\nКонструкция включает в себя хорошо защищенное отделение экипажа, беспилотное боевое отделение и мощное основное вооружение.\nМодернизация предполагала внедрение обновленной электроники, систем защиты и других компонентов, а также адаптацию конструкции к технологиям, доступным украинской оборонной промышленности.\nХотя проект так и не дошел до серийного производства, дальнейшая разработка может стать основой для создания передового украинского основного боевого танка."
 ukr_history.63.t: "Арест Юлии Тимошенко"
 ukr_history.63.d: "Бывшая заместитель премьер-министра по вопросам топлива и энергетики была доставлена в Лукьяновскую тюрьму по обвинению в контрабанде газа и подделке документов, относящихся к периоду ее работы в компании «Объединенные энергетические системы». Она была уволена в январе после протестов против бартерных схем в этом секторе, и дело было возбуждено в течение нескольких недель. Суд признает задержание незаконным и освободит ее через сорок два дня; к тому времени она уже не будет министром, поссорившимся с президентом, а станет лицом оппозиции ему."
 ukr_history.63.a: "Пусть будет так."
 UKR_reorganize_navy_finish_project_133: "Достроить §G2 сторожевых корабля §Yпроекта 133§!§! для Морской охраны"
 UKR_reorganize_navy_finish_project_133_desc: "\n\n\n\n\n\n£UKR_desctext_project_133_for_tooltip\n\n\n\n\n\n\n\n\nМы можем выделить средства, чтобы наконец завершить затянувшуюся постройку §G2§! сторожевых кораблей советского проекта 133 для нашей морской охраны."
 UKR_reorganize_navy_finish_11451_construction_flag: "Событие §YДостроить 2 корвета проекта 11451§! завершено"
 ukraine_reorganize_navy_finish_project_133.1.name: "Достроить 2 сторожевых корабля проекта 133 для морской охраны"
 ukraine_reorganize_navy_finish_project_133.1.desc: "Мы осмотрели два корпуса сторожевых кораблей проекта 133 для морской охраны — БГ53 «Полесье» и БГ54 «Слобожанщина» — и теперь можем выбрать, как поступить с их судьбой.\n\nМы можем вложить больше денег и провести капитальный ремонт обоих кораблей либо списать тот, что в худшем состоянии, — БГ54 «Слобожанщину», — и использовать его узлы, чтобы быстрее восстановить БГ53 «Полесье»."
 ukraine_reorganize_navy_finish_project_133.1.a: "Достроить оба корабля"
 ukraine_reorganize_navy_finish_project_133.1.b: "Разобрать «Слобожанщину» ради достройки «Полесья»"
 ukr_economy_rate.1.t: "НБУ снижает учётную ставку на 1%"
 ukr_economy_rate.1.d: "Национальный банк Украины снизил учётную ставку, сославшись на замедление роста цен и стабилизацию гривны. Ожидается, что вслед за ним коммерческие банки удешевят кредиты, а иностранные фонды, списавшие Украину со счетов после 1998 года, тихо возвращаются на рынок. Промышленность, десятилетие сидевшая без оборотных средств, наконец сможет занимать по ставкам, которые не съедают всю маржу."
