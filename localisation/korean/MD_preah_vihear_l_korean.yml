 preah_vihear.40.t: "국경 훈련 사고"
 preah_vihear.40.d: "국경 인근의 실탄 사격 훈련에 문제가 생겼습니다. 장비가 손상되고 여러 병사가 근무 불능 상태가 되었으며, 이 차질로 인해 즉응 태세 프로그램에 대한 신뢰가 흔들렸습니다."
 preah_vihear.40.a: "실수에서 배운다"
 preah_vihear.41.t: "도발의 역효과"
 preah_vihear.41.d: "최근의 수사와 병력 이동이 국내에서 원치 않는 주목을 끌었습니다. 야당 인사들과 언론은 정부가 통제할 수 없는 위기를 조장하고 있는 것 아니냐고 묻고 있으며, 정부는 긴장 수위를 낮출 수밖에 없었습니다."
 preah_vihear.41.a: "교훈을 새긴다"
 preah_vihear.110.t: "노파돈 공동성명"
 preah_vihear.110.d: "노파돈 파타마 외무장관이 프레아비히어에 대한 캄보디아의 유네스코 등재 신청을 지지하는 공동성명에 공동 서명했으며, 이 문서는 국내에서 거센 논란을 불러일으켰습니다. 헌법재판소는 이 합의가 적절한 의회 승인 없이 이루어졌는지 여부를 심리 중이며, 민족주의 비판자들은 장관의 목을 요구하고 있습니다."
 preah_vihear.110.a: "공동성명을 지지한다"
 preah_vihear.110.b: "공동성명을 철회하고 장관을 해임한다"
 preah_vihear.111.t: "프놈펜의 탁신"
 preah_vihear.111.d: "훈 센 총리가 도피 중인 탁신 시나왓을 개인 경제 고문으로 임명했으며, 이는 방콕 정부에 대한 계산된 모욕입니다. 캄보디아는 송환 검토를 거부했고, 이 임명은 국경 양측의 결집 구심점이 되었습니다."
 preah_vihear.111.a: "대사를 소환한다"
 preah_vihear.111.b: "공식 항의만 제기한다"
 preah_vihear.112.t: "국경의 황색 셔츠"
 preah_vihear.112.d: "민주주의를 위한 인민동맹이 국경 분쟁을 정부가 프놈펜에 너무 가깝고 국가 주권에 너무 무르다는 새로운 증거로 삼았습니다. 정부청사 밖의 집회는 줄어들 기미를 보이지 않습니다."
 preah_vihear.112.a: "시위를 견뎌 낸다"
 preah_vihear.120.t: "분쟁, 국제연합 안전보장이사회에 상정"
 preah_vihear.120.d: "국경 위기가 확대되어 이제 안전보장이사회 의제에 올랐습니다. 회원국들은 양측에 자제를 촉구했지만, 구속력 있는 조치는 예상되지 않습니다."
 preah_vihear.120.a: "논의 과정을 주시한다"
 preah_vihear.121.t: "인도네시아, 참관단 제안"
 preah_vihear.121.d: "아세안 의장국인 인도네시아가 국경을 감시하고 휴전 위반을 보고할 비무장 참관단을 파견하겠다고 제안했습니다. 자카르타는 이를 중재를 통한 해결이 아닌 신뢰 구축 조치로 규정하고 있습니다."
 preah_vihear.121.a: "참관단을 받아들인다"
 preah_vihear.121.b: "제안을 거절한다"
 preah_vihear.130.t: "결정적 패배"
 preah_vihear.130.d: "상대측이 프레아비히어 대치에서 결정적 승리를 거두었으며, 이제 굴욕을 각인시키기 위해 모든 외교 및 선전 수단을 동원하고 있습니다. 땅이 넘어간 것은 아니지만, 국경에서의 우리 입지는 수년 만에 가장 약해 보입니다."
 preah_vihear.130.a: "일단 좌절을 받아들인다"
 preah_vihear.130.b: "전면전을 준비한다"
 preah_vihear.131.t: "절벽 상실"
 preah_vihear.131.d: "태국군이 분쟁 지역을 점령했으며 방콕은 사원을 포함한 북부 크메르 지방을 공식 병합했습니다. 우리 것이어야 했던 1962년 판결도 고지대의 병력 앞에서는 아무 의미가 없습니다. 국민은 충격에 빠져 있으며, 우리가 줄 수 없을지도 모르는 답을 요구하고 있습니다."
 preah_vihear.131.a: "국가의 암울한 날이다"
 preah_vihear.131.b: "되찾을 것이다"
