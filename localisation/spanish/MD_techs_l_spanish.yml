 module_naval_ammo_drone_swarm_1: "Carga de enjambre de drones I"
 module_naval_ammo_drone_swarm_1_desc: "A magazine load of loitering munitions and attack drones launched in coordinated swarms against surface and shore targets. Requires either Missile Mounts or VLS Banks for use. Ammunition loads can also be quickly refitted to change ammo loads for mission flexibility."
