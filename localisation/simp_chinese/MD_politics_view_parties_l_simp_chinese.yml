 SLV.conservatism: "£SLV_Slovenian_Peoples_Party 斯洛文尼亚人民党(SLS)"
 SLV.conservatism_desc: "保守主义 - 斯洛文尼亚人民党是一个基督教和农业政党，成立于1988年，最初称为斯洛文尼亚农民联盟。斯洛文尼亚农民联盟是斯洛文尼亚自1945年以来第一个公开的非共产党政党，它的成立被认为是1988年斯洛文尼亚之春的关键事件之一。\n1991年，该党更名为现在的斯洛文尼亚人民党，以纪念战前的天主教保守派斯洛文尼亚人民党。此次更名引起了斯洛文尼亚基督教民主党的争议，该党认为自己是战前斯洛文尼亚人民党的正式继承者，并在流亡期间与历史上的斯洛文尼亚人民党合并。"
 SLV.liberalism_desc: "自由主义 - 斯洛文尼亚自由民主党是一个支持欧洲的社会自由党。斯洛文尼亚自由民主党由社会主义联盟 (自由党) 于1992年成立，是斯洛文尼亚执政联盟的一部分。"
 SLV.socialism: "£SLV_western_social_democrat 社会民主党(SD)"
 SLV.socialism_desc: "社会民主主义 - 社会民主党联合名单是一个亲欧洲的社会民主主义平台，也是斯洛文尼亚共产主义者联​​盟的继承者。20世纪90年代初，随着共产党人气迅速下降，该党进行了重大转型以保持相关性。它改组为一个中左翼政党联盟，称为联合名单。最初，新成立的联盟获得了13.6%的民众选票，成为斯洛文尼亚第三大政治实体。然而，1993年，社会福利政策的内部争议导致联盟内部出现分裂。几位知名成员离开了该党，并重振了最初的联盟伙伴之一斯洛文尼亚退休人员民主党。这种分裂导致联合名单的选举支持率下降，降至9%。在博鲁特·帕霍尔当选为新任党主席的领导下，该党经历了重大转变。随着时间的推移，该党逐渐转向更为温和的立场，与其共产主义起源保持距离。如今，该党几乎已经与其早期的共产主义根源大相径庭。"
 SLV.Nat_Autocracy: "£SLV_nationalist_military_junta 斯洛文尼亚武装力量(SAF/SV)"
 SLV.Nat_Autocracy_desc: "军政府 - 斯洛文尼亚武装部队源自于斯洛文尼亚领土防卫军，该部队于1990年成立，由最初于1968年作为南斯拉夫境内准军事部队成立的领土防卫军合并而成。斯洛文尼亚于1991年宣布独立，斯洛文尼亚领土防卫军和警察在十日战争期间与南斯拉夫人民军交战。斯洛文尼亚武装部队于1994年正式成立，重组了斯洛文尼亚领土防卫军。"
 SLV.Nat_Populism: "£SLV_nationalist_right_wing_populist 斯洛文尼亚民族党(SNS)"
 SLV.Nat_Populism_desc: "右翼民粹主义 - 斯洛文尼亚民族党是由兹马戈·耶林契奇·普莱梅尼蒂创立的民族民粹主义政党。1993年，持不同意见的派系脱离该党，成立了斯洛文尼亚民族右翼和民族劳动党，许多持不同意见的成员是斯洛文尼亚国民卫队的支持者，他们反对耶林契奇支持斯洛文尼亚游击队。该党的意识形态强烈反对教权主义，主张坚定的世俗主义立场，并反对LGBT权利。它也反对国有企业的私有化。此外，该党呼吁修改国旗和国徽，认为当前的象征与某些二战准军事组织有关，缺乏明显的斯洛文尼亚历史特征。斯洛文尼亚民族党同情斯洛文尼亚人民反抗法西斯主义和前南斯拉夫共产主义政权铁托的斗争。该党反对斯洛文尼亚加入欧盟和北约。该党领导人被指责对某些少数民族，尤其是斯洛文尼亚的罗姆人，抱有沙文主义甚至种族主义态度。"
