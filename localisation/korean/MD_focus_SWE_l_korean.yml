 Sweden_foci.6002.d1: "독일이 212형 잠수함을 조달하겠다는 스웨덴의 요청을 승인했습니다. 이 결정은 양국 간 방위 협력의 중요한 진전이며 스웨덴의 해군력을 강화할 것입니다."
 Sweden_foci.6002.d2: "러시아가 라다급 잠수함을 구매하겠다는 스웨덴의 제안을 수락했으며, 이는 군사 협력의 새로운 길을 열고 스웨덴의 잠수함 전력을 강화합니다."
 Sweden_foci.6002.d3: "미국이 시울프급 잠수함을 조달하겠다는 스웨덴의 요청을 승인했습니다. 이 결정은 방위 관계를 강화하고 스웨덴의 수중전 능력을 크게 향상시킵니다."
