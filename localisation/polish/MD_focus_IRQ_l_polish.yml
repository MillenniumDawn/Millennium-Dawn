 iraqi_MNF.17.t: "Aziz Salih Captured!"
 iraqi_MNF.17.d: "After weeks of being on the run, Aziz Salih was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.17.a: "Dobrze"
 iraqi_MNF.170.t: "Iraq's Most Wanted"
 iraqi_MNF.170.d: "Fifty-two of the former government's officials have been printed onto a deck of playing cards and issued to every unit in the country, with the aces and the face cards reserved for the men who actually ran the state. Some are still inside Iraq, moving between safe houses and relatives on a schedule nobody outside the family knows. Others crossed into neighbouring capitals that will go on denying they are there for exactly as long as it is convenient. The intelligence assessment is that the ones left at large are already organising, and that every month the deck stays unturned is another month of planning we are handing them."
 iraqi_MNF.170.a: "The swift hand of justice will snatch them"
 iraqi_MNF.200.t: "Wielki kontratak partii Baas na bazę morską w Kuwejcie!"
 iraqi_MNF.200.d: "Siły partii Baas przypuściły potężny atak na naszą kuwejcką bazę morską, niszcząc znaczną część infrastruktury. Ataki te upokorzyły, zdemoralizowały i zrozpaczyły nasze siły, a nasza reputacja w regionie została poważnie nadszarpnięta. Na kontynencie nasza partia jest pod silnym ostrzałem prasy i ludności. Podobno główną przyczyną była nasza niezdolność do schwytania działaczy partii Baas ukrywających się w Iraku i poza nim, którzy od kilku lat bez większych opóźnień planowali ten atak."
 iraqi_MNF.200.a: "Unbelievable"
 IRQ_request_british_withdrawal: "Request British Withdrawal"
 IRQ_request_british_withdrawal_desc: "Brytyjczycy muszą spakować swoje rzeczy i opuścić Południe. To nasza ziemia, a oni na niej siedzą bez naszej zgody."
 IRQ_request_polish_withdrawal: "Zleć wypłatę środków"
 IRQ_request_polish_withdrawal_desc: "Polacy muszą spakować swoje rzeczy i opuścić centralne obszary. To nasza ziemia, a oni na niej siedzieli bez naszej zgody."
 IRQ_5_years_TT: "They will gain §Hoil concessions§! for §H5§! years!"
 IRQ_MNF_VOLUNTEER_TT: "- We will be able to send volunteers to the §HMulti-National Force§! in [IRQ.GetFlag] §HIraq§! to aid with the war effort"
 IRQ_increase_pol_inf_15_TT: "Increases §HSunni Political Influence§! by §H15§!\n(Current Influence: §H[?IRQ_sunni_political_influence]§!)"
 iraq_md.319.t: "A Holy Inquiry Into Advanced Deterrence"
 iraq_md.319.d: "In the holy city of Najaf, Grand Ayatollah Ali al-Sistani has reportedly spent several days in private reflection. Yesterday, the Grand Ayatollah reportedly asked a single question of whether the state possessed 'a man of sufficient learning to bring theory into form'. His aides, uncertain whether this referred to theology or physics, forwarded the question through the usual clerical channels. This confusion was cleared up rather quickly as through a rare written statement, Grand Ayatollah Sistani declared that the nation must develop 'special means of strategic persuasion'. Due to extensive Ba'ath purges in previous years, Sistani's aides were unable to locate any 'trustworthy' scientists capable of developing these 'special means of strategic persuasion'. Instead, they were able to locate a recent college graduate who had #OpenToNetwork on his LinkedIn page, and an offer has been extended to bring him to Iraq and provide him with a laboratory to conduct his research."
 iraq_md.319.a: "Inshallah Iraq will be safe"
 IRQ_renovation_of_baiji_refinery: "Renovation of Baiji Refinery"
 IRQ_renovation_of_baiji_refinery_desc: "The Baiji refinery was the center of much conflict and many different battles, and due to this, it has become quite run down. It's up to our budget to repair and rebuild the refinery."
 iraq_war.24.t: "The Afghan Question"
 iraq_war.24.d: "Our failure in Iraq has shaken public confidence in our overseas commitments. With the military stretched thin and war fatigue mounting at home, there are growing calls to end our mission in Afghanistan as well. The costs of maintaining our presence there are becoming increasingly difficult to justify to a war-weary public."
 iraq_war.24.a: "Withdraw from Afghanistan"
 iraq_war.24.b: "We will stay the course"
 IRQ_commie_paper: "Publish Al-Qaidah"
 IRQ_invite_hezbollah: "Invite [HEZ.GetFlag] [HEZ.GetName]"
 IRQ_receive_iranian_planes_TT: "We receive §G7§! §YMiG-29 Fulcrums§! from Iran."
 IRQ_resistance_jewel_aid_TT: "Each accepting ally builds infrastructure or a fossil fuel power plant in Iraq."
 IRQ_saudi_trade_refusal_TT: "Saudi Arabia refuses to expand trade relations, blocking §YRevive Basra Port§!."
 IRQ_demand_kuwait_naval_base: "Demand the [KUW.GetFlag] Kuwait Naval Base"
 IRQ_demand_kuwait_naval_base_desc: "The [KUW.GetFlag] Kuwaitis have let the Americans plant a naval base right on our doorstep. §H[IRQ.GetLeader]§! demands that [KUW.GetFlag] Kuwait hand over control of the base to us, or face the consequences."
 IRQ_propose_kurdistan_defensive_pact: "Propose a Defensive Pact with [KUR.GetFlag] Kurdistan"
 IRQ_propose_kurdistan_defensive_pact_desc: "§H[IRQ.GetLeader]§! wishes to secure our northern flank by offering [KUR.GetFlag] Kurdistan a mutual defensive pact, renouncing our claims over their territory in exchange for their guarantee of our own."
 IRQ_expel_economic_union_members_decision: "Expel Union Members"
 IRQ_expel_economic_union_members_decision_desc: "Several members of our §HUnion of Islamic Prosperity§! have grown lax in their commitments. We will expel every current member from the union, dissolving its trade and industrial benefits until new partners are brought in."
 IRQ_members_in_union_TT: "There is §Hat least one member§! currently in the §HUnion of Islamic Prosperity§! to expel."
 IRQ_demanded_kuwait_naval_base: "Already Demanded the Kuwait Naval Base"
 IRQ_proposed_kurdistan_pact: "Already Proposed the Kurdistan Defensive Pact"
 iraqi_MNF.26.t: "The Compound Was Empty"
 iraqi_MNF.26.d: "The assault element cleared the compound room by room and found bedding still warm, a satellite phone with the battery taken out, and nobody in the building. Someone was paid for a warning and earned it. By the time the site is exploited the network will have moved him somewhere else in the country, and the search starts again from whatever the documents left behind are worth."
 iraqi_MNF.26.a: "Find out who talked"
 IRQ_qusay_hussein_idea: "Qusay Hussein"
 IRQ_qusay_hussein_idea_desc: "With Qusay designated as Saddam's successor, we draw on his leadership of the Special Republican Guard to strengthen our armed forces and secure the regime."
 IRQ_demand_kuwait_naval_base_TT: "[KUW.GetFlag] §HKuwait§! will answer our demand when this decision ends. They are §Gmuch more likely§! to give in if our £foreign_influence_modifier_texticon  §HInfluence§! in [KUW.GetFlag] §HKuwait§! is still §H30%§! or more at that time.\n§RWe can only make this demand once.§!"