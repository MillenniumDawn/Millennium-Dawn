 nhmrc_grants: "Гранты NHMRC"
 nhmrc_grants_desc: "Национальный совет по здравоохранению и медицинским исследованиям — это ведущее медицинское исследовательское агентство. Наши стандарты здравоохранения зависят от результатов проводимых им исследований. Предоставление им краткосрочных грантов могло бы принести многообещающие результаты для отрасли."
 encourage_electrical_vehicles_ast: "Поощряйте развитие электромобилей."
 encourage_electrical_vehicles_ast_desc: "Создание основы для производства гибридных и экологически чистых автомобилей — важная работа, если мы хотим обеспечить осуществимость будущего, к которому стремимся. Это также поможет нам добиться краткосрочного нормирования потребления топлива."
 launch_worker_safety_courses_ast: "Запуск курсов по технике безопасности для работников"
 launch_worker_safety_courses_ast_desc: "Мы работаем над рядом новых обучающих видеороликов для тех, кто проходит курс получения «Белой карты», делая визуальное обучение обязательной частью курса и, как мы надеемся, побуждая молодых специалистов к снижению рисков."
 collaborate_with_foodbanks: "Сотрудничайте с продовольственными банками"
 collaborate_with_foodbanks_desc: "Сотрудничество с такими организациями, как SecondBite, позволит снизить нагрузку на наши социальные службы и облегчить положение получателей помощи."
