 econ_forum_standing_7: "\n§YTransatlantic Technology Forum§!: prestige [?global.econ_forum_prestige^7|0]. Its last summit drew [?global.econ_forum_last_heads^7|0] heads of government and [?global.econ_forum_last_ministers^7|0] ministerial delegations, and signed [?global.econ_forum_last_ceremonies^7|0] agreements."
 econ_forum_standing_7_vacant: "\n§YTransatlantic Technology Forum§!: vacant until the owner of its seat is free to host it. Prestige [?global.econ_forum_prestige^7|0]."
 econ_forum_standing_8: "\n§YIndependent Economic Forum§!: prestige [?global.econ_forum_prestige^8|0]. Its last summit drew [?global.econ_forum_last_heads^8|0] heads of government and [?global.econ_forum_last_ministers^8|0] ministerial delegations, and signed [?global.econ_forum_last_ceremonies^8|0] agreements."
 econ_forum_standing_8_vacant: "\n§YIndependent Economic Forum§!: vacant until the owner of its seat is free to host it. Prestige [?global.econ_forum_prestige^8|0]."
 econ_forum_standing_unfounded: ""
 econ_forum_news.6.t: "The [econ_forum_name_founded] Changes Hands"
 econ_forum_news.6.d: "With its host city now under a new flag, the [econ_forum_name_founded] will be convened by [FROM.GetName] from now on. This year's preparations have been abandoned."
 econ_forum_news.6.a: "The show goes on"
 econ_forum_screen_standings: "Forum Standings"
 econ_forum_screen_intro: "Forums compete every year for governments, companies and headline speakers. Each summit's score pulls its forum's prestige toward it, and a forum with §Y60§! or more prestige invites every regional power automatically."
