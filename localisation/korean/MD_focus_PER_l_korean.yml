 PER_appoint_new_prime_minister: "새 총리 임명"
 PER_vezarate_niru: "베자라테 니루"
 PER_vezarate_niru_desc: "1936년 10월 17일에 설립된 에너지부는 전력 관리를 담당했으며, 이후 1943년 5월 20일에 수자원 관리까지 담당 범위가 확대되었습니다. 최근에는 신규 원자력 발전소 건설을 감독하는 임무도 맡게 되었습니다."
 PER_bushehr_nuclear_power_plant: "부셰르 원자력 발전소 개보수"
 PER_bushehr_nuclear_power_plant_desc: "부셰르 원자력 발전소는 이란의 페르시아만 연안, 할릴레와 반다르게 어촌 마을 사이에 위치해 있습니다. 이 발전소의 건설은 1975년 독일 기업들에 의해 시작되었으나, 1979년 이란 이슬람 혁명 이후 중단되었습니다. 청정 에너지 확대를 뒷받침하기 위해 발전소를 개보수하는 것이 좋을 것입니다."
 PER_SATBA: "SATBA"
 PER_SATBA_desc: "이란 재생 에너지 및 에너지 효율 기구(SATBA)는 에너지부의 차관 기관 역할을 합니다. 에너지 효율을 높이고 이란 재생 에너지의 새로운 지평을 넓히는 것을 목표로 합니다."
 PER_deputy_for_energy_electricity: "에너지 및 전력 규제"
 PER_deputy_for_energy_electricity_desc: "에너지와 전력 생산에 관한 새로운 규제를 도입한다면 전국의 전력 생산을 안정화하는 데 크게 도움이 될 것입니다."
 PER_daryan_dam: "다리안 댐"
 PER_daryan_dam_desc: "다리안 댐은 길이 48km의 노우수드 도수 터널에 매년 물을 공급하여 이란 남서부 지역에 관개용수를 대게 됩니다."
 PER_american_naval_purchase: "미국 해군 장비 구매"
 PER_american_naval_purchase_desc: "우리 해군은 오랫동안 뒤처져 왔습니다. 미국의 전문 지식과 장비는 신뢰할 만한 해군 현대화 계획의 중추가 될 수 있습니다."
 PER_dismantle_arab_dominance: "아랍 우위 해체"
 PER_dismantle_arab_dominance_desc: "아랍 세계의 인위적인 우위는 진정한 지역 균형을 억눌러 왔습니다. 우리 자신을 중심에 두고 저울을 바로잡을 것입니다."
 PER_european_partners: "유럽 파트너"
 PER_european_partners_desc: "프랑스와 독일은 우리의 방위 현대화에 소중한 파트너입니다. 라팔 전투기와 레오파르트 전차를 조달하면 우리 군이 강화되고 새로운 전략적 방향을 상징하게 됩니다."
 PER_invite_european_military_companies: "유럽 군수 기업 초청"
 PER_invite_european_military_companies_desc: "유럽 무기 제조업체에 시장을 개방하는 것은 낡은 군산복합체를 쇄신하는 열쇠입니다. 합작 투자가 뒤따를 수도 있습니다."
 PER_request_pahlavi_tomb: "모하마드 레자 팔레비의 유해 회수"
 PER_request_pahlavi_tomb_desc: "전 샤의 유해를 다시 모셔오고 테헤란에 새로운 묘를 건립해야 합니다."
