 TUR_request_crimea_cooperation_with_ukraine: "[TUR.GetFlag] §Y[TUR.GetAdjective]§! Aid to §YCrimean Tatars§!"
 TUR_request_crimea_cooperation_with_ukraine_desc: "§WPropose that [TUR.GetFlag] §Y[TUR.GetNameDef]§! fund schools, housing and resettlement for §YCrimean Tatars§! in §Y[669.GetName]§!. Approval from [UKR.GetFlag] §Y[UKR.GetNameDef]§! is required.§!\n\n§GOn approval:§! new funded programs become available to [TUR.GetFlag] §Y[TUR.GetNameDef]§!. §ROn refusal:§! another request is temporarily blocked. §LAvailable to both the player and AI.§!"
 ukraine_crimea_balance.400.name: "[TUR.GetFlag] §Y[TUR.GetAdjective]§! Proposal to Assist §YCrimean Tatars§!"
 ukraine_crimea_balance.400.desc: "§W[TUR.GetFlag] §Y[TUR.GetNameDef]§! proposes to finance the education, housing and repatriation of §YCrimean Tatars§! in §Y[669.GetName]§!. The plan would strengthen local minority institutions while coordinating with [UKR.GetFlag] §Y[UKR.GetNameDef]§!.§!"
 ukraine_crimea_balance.400.a: "§GApprove§! cooperation with [TUR.GetFlag] §Y[TUR.GetNameDef]§!"
 ukraine_crimea_balance.400.b: "§RDecline§! the [TUR.GetFlag] §Y[TUR.GetAdjective]§! proposal"
 SOV_crimea_request_fleet_privileges: "Demand Expanded Fleet Privileges from [UKR.GetFlag] §Y[UKR.GetNameDef]§!"
 SOV_crimea_request_fleet_privileges_desc: "§W[SOV.GetFlag] §Y[SOV.GetNameDef]§! seeks additional rights at §Y[1112.GetName]§!. [UKR.GetFlag] §Y[UKR.GetNameDef]§! must approve the agreement.§!\n\n§GIf approved:§! increased §Y[SOV.GetAdjective]§! political leverage in §Y[669.GetName]§!. §RIf rejected:§! the proposal is blocked and bilateral relations may deteriorate."
 UKR_crimean_bop_fleet_deal_mission: "New [SOV.GetFlag] §Y[SOV.GetAdjective]§! Fleet Privileges"
 UKR_crimean_bop_fleet_deal_mission_desc: "§WThe new naval basing provisions are being implemented around §Y[1112.GetName]§!.§!\n\n§GExpected result:§! §G+5 influence points§! to [SOV.GetFlag] §Y[SOV.GetName]§! and §R−5 influence points§! to [UKR.GetFlag] §Y[UKR.GetName]§!, subject to influence caps."
 ukraine_crimea_balance.401.name: "[SOV.GetFlag] §Y[SOV.GetAdjective]§! Request for Fleet Privileges"
 ukraine_crimea_balance.401.desc: "§W[SOV.GetFlag] §Y[SOV.GetNameDef]§! requests expanded rights for the §YBlack Sea Fleet§! around §Y[1112.GetName]§!. Accepting will strengthen [SOV.GetFlag] §Y[SOV.GetAdjective]§! leverage; refusing may worsen relations between [UKR.GetFlag] §Y[UKR.GetNameDef]§! and [SOV.GetFlag] §Y[SOV.GetNameDef]§!.§!"
 ukraine_crimea_balance.401.a: "§GAccept§! the revised fleet arrangement"
 ukraine_crimea_balance.401.b: "§RRefuse§! additional [SOV.GetFlag] §Y[SOV.GetAdjective]§! basing rights"
 ukraine_crimea_balance.10.name: "A Joint [UKR.GetFlag] §Y[UKR.GetAdjective]§!–§YCrimean Tatar§! Administration"
 ukraine_crimea_balance.10.desc: "§W[UKR.GetFlag] §Y[UKR.GetNameDef]§! and representatives of the §YCrimean Tatar§! community have reached a position strong enough to constrain [SOV.GetFlag] §Y[SOV.GetAdjective]§! political networks in §Y[669.GetName]§!. A political settlement can safeguard Ukrainian claims, while a demand to withdraw the §YBlack Sea Fleet§! from §Y[1112.GetName]§! may trigger a §Rdiplomatic confrontation§!.§!"
 ukraine_crimea_balance.10.a: "§GEstablish§! a joint [UKR.GetFlag] §Y[UKR.GetAdjective]§!–§YCrimean Tatar§! administration"
 ukraine_crimea_balance.10.b: "Demand [SOV.GetFlag] §Y[SOV.GetAdjective]§! fleet withdrawal from §Y[1112.GetName]§!"
 ukraine_crimea_balance.11.name: "§YCrimean Tatar§! Autonomy Settlement"
 ukraine_crimea_balance.11.desc: "§W§YCrimean Tatar§! representatives have gained decisive influence in §Y[669.GetName]§!. A settlement can establish a [CRM.GetFlag] §Y[CRM.GetName]§! autonomous subject with the §YCrimean Tatar§! cosmetic flag or retain direct [UKR.GetFlag] §Y[UKR.GetAdjective]§! institutions. §RCore and claim changes§! depend on the selected territorial outcome.§!"
 ukraine_crimea_balance.11.a: "Offer §YCrimean Tatar§! self-government within the existing settlement"
 ukraine_crimea_balance.11.b: "Seek a §Gcompromise§! preserving [UKR.GetFlag] §Y[UKR.GetAdjective]§! control"
 ukraine_crimea_balance.12.name: "[UKR.GetFlag] §Y[UKR.GetAdjective]§!–[SOV.GetFlag] §Y[SOV.GetAdjective]§! Crimean Agreement"
 ukraine_crimea_balance.12.desc: "§WTwo prior concessions enable Kyiv and Moscow to negotiate an arrangement for §Y[669.GetName]§!. Accepting may release [CRM.GetFlag] §Y[CRM.GetName]§! as a subject, while [SOV.GetFlag] §Y[SOV.GetNameDef]§! retains §Y[1112.GetName]§!. §R[UKR.GetNameDefCap] may lose cores or claims§! on the affected states.§!"
 ukraine_crimea_balance.12.a: "§GAccept§! the bilateral settlement with [SOV.GetFlag] §Y[SOV.GetNameDef]§!"
 ukraine_crimea_balance.12.b: "§RReject§! the proposed territorial arrangement"
 ukraine_crimea_balance.13.name: "The §RCrimean Crisis§!"
 ukraine_crimea_balance.13.desc: "§WFollowing the political crisis after November 2013, [SOV.GetFlag] §Y[SOV.GetAdjective]§! aligned forces have gained control of the political environment in §Y[669.GetName]§!. Choosing accommodation may transfer control and core rights to [SOV.GetFlag] §Y[SOV.GetNameDef]§!. §RArmed resistance§! can lead to a wider war.§!"
 ukraine_crimea_balance.13.a: "§RAccept§! the loss of direct control over §Y[669.GetName]§!"
 ukraine_crimea_balance.13.b: "§ROrganize military resistance§! to foreign intervention"
 ukraine_crimea_balance.14.name: "[SOV.GetFlag] §Y[SOV.GetAdjective]§!–§YCrimean Tatar§! Understanding"
 ukraine_crimea_balance.14.desc: "§W[SOV.GetFlag] §Y[SOV.GetNameDef]§! and part of the §YCrimean Tatar§! political establishment have agreed on an external arrangement. Supporting it may result in a §YCrimean autonomous subject§! under foreign influence; challenging it may entail §Rseparatist instability or military escalation§!.§!"
 ukraine_crimea_balance.14.a: "Accept the §YCrimean Tatar§!–[SOV.GetFlag] §Y[SOV.GetAdjective]§! autonomy plan"
 ukraine_crimea_balance.14.b: "§RChallenge§! the arrangement and restore [UKR.GetFlag] §Y[UKR.GetAdjective]§! institutions"
 UKR_crimean_bop_voluntary_fleet_concessions: "Offer [SOV.GetFlag] §Y[SOV.GetNameDef]§! Additional Fleet Privileges"
 UKR_crimean_bop_voluntary_fleet_concessions_desc: "§WOffer [SOV.GetFlag] §Y[SOV.GetNameDef]§! additional basing concessions at §Y[1112.GetName]§!. The agreement increases external leverage in §Y[669.GetName]§! and counts toward a potential bilateral settlement.§!\n\n§YCost:§! §R$300 million§! + §R45 Political Power§!\n§YImplementation:§! 90 days\n§YPolitical effect (maximum):§! §G+5 influence points§! to [SOV.GetFlag] §Y[SOV.GetNameDef]§!, §R−5 influence points§! to [UKR.GetFlag] §Y[UKR.GetNameDef]§!.\n§RAdditional naval pressure may follow.§!"
 UKR_crimean_bop_request_repatriation_from_russia: "Negotiate Return of §YCrimean Tatars§! from [SOV.GetFlag] §Y[SOV.GetNameDef]§!"
 UKR_crimean_bop_request_repatriation_from_russia_desc: "§WOffer [SOV.GetFlag] §Y[SOV.GetNameDef]§! compensation for organized migration of §YCrimean Tatar§! families from Russia to §Y[669.GetName]§!. The receiving government must approve.§!\n\n§YCost:§! §R$400 million§!\n§YMission:§! 180 days\n§GIf accepted:§! up to §G3,000 residents§! return and §YCrimean Tatar§! influence may rise by §G4 influence points§!. §RIf refused:§! no population transfer occurs."
 UKR_crimean_bop_repatriation_from_russia_mission: "Repatriation from [SOV.GetFlag] §Y[SOV.GetNameDef]§!"
 UKR_crimean_bop_repatriation_from_russia_mission_desc: "§WApproved repatriation from [SOV.GetFlag] §Y[SOV.GetNameDef]§! to §Y[669.GetName]§! is under way.§!\n\n§YDuration:§! 180 days\n§GExpected result:§! 3,000 people resettled and increased §YCrimean Tatar§! influence, subject to state-population and influence limits."
 ukraine_crimea_balance.402.name: "[UKR.GetFlag] §Y[UKR.GetAdjective]§! Request for Repatriation from [SOV.GetFlag] §Y[SOV.GetNameDef]§!"
 ukraine_crimea_balance.402.desc: "§W[UKR.GetFlag] §Y[UKR.GetNameDef]§! is requesting permission and offering compensation for the organized return of §YCrimean Tatar§! families living in [SOV.GetFlag] §Y[SOV.GetNameDef]§! to §Y[669.GetName]§!. Accepting changes the population of the source state and §Y[669.GetName]§! when the migration mission completes.§!"
 ukraine_crimea_balance.402.a: "§GAllow§! the repatriation of families to §Y[669.GetName]§!"
 ukraine_crimea_balance.402.b: "§RReject§! the [UKR.GetFlag] §Y[UKR.GetAdjective]§! repatriation request"
 UKR_crimean_bop_category: "Political Balance in §Y[669.GetName]§!"
 UKR_crimean_bop_category_desc: "§WThe balance between [UKR.GetFlag] §Y[UKR.GetNameDef]§!, the §YCrimean Tatar§! community and [SOV.GetFlag] §Y[SOV.GetNameDef]§! shapes the future of §Y[669.GetName]§! and §Y[1112.GetName]§!.§!\n\n§YCurrent balance:§! [UKR.GetFlag] §G[?UKR.UKR_crimean_bop_ukrainian_influence|0]%§! / §YCrimean Tatars§! §G[?UKR.UKR_crimean_bop_crimean_tatar_influence|0]%§! / [SOV.GetFlag] §R[?UKR.UKR_crimean_bop_russian_influence|0]%§!\n§YStart:§! 30% / 10% / 60%. §YMaximum for one side:§! 65%.\n\n§WTo resettle families from Central Asia, all five governments must approve the current wave. A refusal unlocks a country-specific renegotiation. Approval requires a minimum [UKR.GetFlag] §Y[UKR.GetAdjective]§! diplomatic influence and no more than §Rthree times§! that amount for [SOV.GetFlag] §Y[SOV.GetNameDef]§!.§!\n§YTracked returnees:§! §G[?UKR_crimean_bop_returnees_population|0]§!\n§LPolitical settlements may change control, cores and claims on states 669 and 1112.§!"
 SOV_crimea_balance_of_power_category: "[SOV.GetFlag] §Y[SOV.GetAdjective]§! Influence in §Y[669.GetName]§!"
 SOV_crimea_balance_of_power_category_desc: "§WAs [SOV.GetFlag] §Y[SOV.GetNameDef]§!, finance media, local councils and investment in §Y[669.GetName]§!. Both §Yhuman players§! and §YAI§! may take these decisions. The resulting balance is shared with [UKR.GetFlag] §Y[UKR.GetNameDef]§!.§!\n\n§GOpportunity:§! increase §Y[SOV.GetAdjective]§! leverage. §RRisk:§! [UKR.GetFlag] §Y[UKR.GetNameDef]§! may counteract with administrative measures, diplomacy and a §YCrimean Tatar§! alliance."
 TUR_crimea_balance_of_power_category: "[TUR.GetFlag] §Y[TUR.GetAdjective]§! Support for §YCrimean Tatars§!"
 TUR_crimea_balance_of_power_category_desc: "§WAs [TUR.GetFlag] §Y[TUR.GetNameDef]§!, fund the settlement, education and housing of §YCrimean Tatars§! in §Y[669.GetName]§!. These programs can be taken by §Yhuman players§! or §YAI§! after [UKR.GetFlag] §Y[UKR.GetNameDef]§! agrees to cooperation.§!\n\n§GOpportunity:§! strengthen the §YCrimean Tatar§! community. §RRisk:§! excessive local autonomy may reduce central control by [UKR.GetFlag] §Y[UKR.GetNameDef]§!."
