 EU_budget_mff_draft_desc: "L'État membre qui rédige le Cadre Financier Pluriannuel doit mettre le projet à l'ordre du jour du Parlement européen à la fin des négociations. En récompense, l'État membre rédacteur obtient le pouvoir politique total investi, lorsque le Cadre Financier Pluriannuel est approuvé et mis en œuvre."
