l_russian:
 free_states_of_america_focus: "Древо фокусов Свободных Штатов Америки"
 the_dust_settles: "Пыль осела... Что нам теперь делать?"
 FS_established_elections: "Выборы были восстановлены"
 FS_continued_election_ban: "Выборы были остановлены"
 USB_UFSR_desc: "[USB.GetFlag]§YСвободные Штаты Америки§! Меняет название на §YСоюз Свободных Социалистических Республик§!"
 USB_MidAtlantic_Union_desc: "[USB.GetFlag]§YСвободные Штаты Америки§! Меняет название на §YСреднеатлантический федеральный союз§!"
 USB_MidAtlantic_States_desc: "[USB.GetFlag]§YСвободные Штаты Америки§! Меняет название на §YСреднеатлантический федеральный союз§!"
 USB_second_american_republic_desc: "[USB.GetFlag]§YСвободные Штаты Америки§! Меняет название на §YВторая американская республика§!"
 free_states_idea_isolationist_focused_foreign_office: "Министерство иностранных дел изоляционистского толка"
 free_states_idea_isolationist_focused_foreign_office_desc: "При абсолютном состоянии нашей страны большинство назначений в министерство иностранных дел рассматриваются как легкие деньги. Это является причиной тяжелой апатии, которая возникает из-за того, что мы перестраиваем само общество. Тем не менее, по мере того, как мы развиваемся и начинаем процветать, мы можем смотреть на более светлые горизонты в будущем."
 free_states_idea_neighborhood_foreign_policy: "Внешняя политика соседства"
 free_states_idea_neighborhood_foreign_policy_desc: "С нацией, находящейся на пике в плане экономики, а также военных и политических событий, у нас недавно произошел всплеск иностранного интереса. Таким образом, поскольку нам все еще нужно выяснить, что мы действительно хотим делать, мы подготовимся к тому, чтобы иметь дело с соседями так, как мы сочтем нужным. Эта ступенька — всего лишь простой факт, что вскоре мы достигнем величия и снова станем частью мировой сцены."
 free_states_idea_naval_budget_priorities: "Приоритет военно-морского бюджета"
 free_states_idea_naval_budget_priorities_desc: "Поскольку большинство оставшихся военных от старого порядка в той или иной степени вовлечены в флот, наши бюджетные приоритеты начали отражать такие влияния. Но насколько хорошо такое влияние, когда мы повернуты спиной к континенту, а не обязательно к морю."
 free_states_idea_army_defensive_budgeting: "Армейский оборонный бюджет"
 free_states_idea_army_defensive_budgeting_desc: "Современные войны могут быть выиграны очень быстро или очень медленно. Современный гражданский человек имеет больше власти в своем распоряжении, чем большинство осознает, и в то же время мы осознаем это. Наша современная доктрина будет сочетать аспекты войны четвертого поколения с традиционной доктриной истощения. Это обеспечит нам возможность мобильной обороны с наименьшими возможными расходами как на материальные ресурсы, так и на личный состав. Эта новая доктрина называется DEW (Defensive Expenditure Warfare) — Оборонная война за счет расходов."
 free_states_idea_foreign_relations_act: "Закон о международных отношениях"
 free_states_idea_foreign_relations_act_desc: "Закон о международных отношениях — это дипломатическая инвестиция в обращение к иностранным державам с целью получения лучших торговых соглашений и программ обмена рабочей силой. В целом наша экономика будет расти, но наши политические возможности будут напряжены из-за необходимости выполнять такие обязательства."
 free_states_idea_domestic_priority_policy: "Внутренняя приоритетная политика"
 free_states_idea_domestic_priority_policy_desc: "DPP — это идеал осуществления внутренней политики, а благополучие нации и ее граждан — главный приоритет. Мы должны гарантировать, что наша национальная оборона будет защищена, принимая этот более внутренний подход, мы должны сделать так, чтобы внешняя политика была приоритетной для безопасности нашей нации. Поэтому такие вещи, как торговля и национальная оборона, являются идеей этого плана."
 free_states_idea_diplomatic_corps: "Дипломатический корпус"
 free_states_idea_diplomatic_corps_desc: "Враги, как и друзья, бывают разных форм и размеров, поэтому, чтобы убедиться и понять, кто есть кто, нам нужен первоклассный дипломатический корпус, который позволит быстрее всего получать информацию об отношениях, когда происходят радикальные изменения."
 free_states_idea_national_labor_corps: "Национальный трудовой корпус"
 free_states_idea_national_labor_corps_desc: "Сочетание исправительного и гражданского корпуса, предназначенного для помощи тем, кто нуждается в работе или доходе, и возможность использовать тех, кто пытался отнять у общества, теперь может вернуть больше. В целом NLC будет использоваться для роста и поддержания постоянно расширяющегося аппарата нашей справедливой нации."
 FSA_america_military_surplus_jobs: "Излишки рабочих мест в армии"
 FSA_america_military_surplus_jobs_desc: "Производство оборудования для армии, будь то оружие или что-то такое простое, как фляги, из которых пьет пехота, по-своему важно. Поэтому какой лучший способ справиться с проблемой безработицы в качестве подставы, чем пассивное использование военной промышленности как способа не только получить больше оборудования и поставок нашим национальным защитникам, но и доход в руки тех, кто все еще ищет нормальную гражданскую работу."
 free_states_idea_extreme_mining_projects: "Экстремальные горнодобывающие проекты"
 free_states_idea_extreme_mining_projects_desc: "Хотя некоторые могут назвать это безрассудной добычей, мы, тем не менее, взлетели до почти международного признания посредством обширных и часто экстремальных горнодобывающих операций. Хотя изрядное количество людей не любит такого рода «безжалостную добычу», мы не можем игнорировать потенциальные рычаги, которые мы можем иметь по отношению к другим странам в плане торговых сделок и предоставления выгод нашим гражданам с помощью торговых товаров."
 free_states_idea_strategic_autarky: "Стратегическая автаркия"
 free_states_idea_strategic_autarky_desc: "Программа SAP или стратегической автаркии — это национальная стратегическая инициатива, призванная гарантировать, что наши торговые сделки в лучшем случае ограничены, а еще лучше, что те сделки, которые мы делаем, защищены для улучшения положения наших граждан. Это может быть не самая приемлемая стратегия с точки зрения международных отношений, но мы должны сохранить себя."
 free_states_idea_consumer_complex_initiative: "Инициатива потребительского комплекса"
 free_states_idea_consumer_complex_initiative_desc: "CCI — это экономическая модель, которая ставит потребительские отрасли в качестве первичной основы и организации экономики. Имея это в виду, оборонные отрасли или специальные отрасли в том, что рассматривается как цитата, «Офицерский сектор» экономики, рассматриваются как вторичные и являются скорее дополнительными частями Потребительского комплекса, основанного на национальных потребностях. Это означает, что, однако, строительство таких вещей страдает, но с хорошей заботой о наших людях, кого это волнует."
 free_states_idea_economic_efficiency_model: "Модель экономической эффективности"
 free_states_idea_economic_efficiency_model_desc: "Когда говорили «строить вверх», большинство думали просто о более высокой плотности зданий для размещения большего числа людей на одной территории. Однако с нашим новым экономическим планом EEM мы можем обеспечить, чтобы строительство высотных зданий стало также экономической моделью. Сосредоточив внимание на отраслях с целью увеличения производства при меньших затратах, мы сможем обеспечить рациональное использование ограниченных ресурсов, одновременно поддерживая сбалансированный и эффективный рост"
 free_states_idea_military_readiness_model: "Модель военной готовности"
 free_states_idea_military_readiness_model_desc: "MRM — это экономическая модель, которая фокусируется на упреждающей милитаризации экономики. Это означает, что фабрики и предприятия строятся с предубеждением, что их можно превратить в производственные мощности военного времени. Это позволяет нашей экономике функционировать устойчивым образом, но может быть очень адаптивной, если когда-нибудь возникнет такая необходимость."
 free_states_idea_department_for_synthetic_development: "Отдел синтетических разработок"
 free_states_idea_department_for_synthetic_development_desc: "Всем известно, что запасы ископаемого топлива ограничены, но что, если бы мы могли расширить эти границы настолько, насколько это возможно с научной точки зрения. Давайте обратимся к DSD, отделу исследований и разработок, чтобы выяснить, где именно находятся эти границы и какие синтетические материалы будущего мы можем производить, будь то пластик, нейлон, определённые химические вещества или смазочные материалы для нефтехимической промышленности. Мы используем прошлое, чтобы создать будущее."
 free_states_idea_department_for_energy_innovation: "Департамент энергетических инноваций"
 free_states_idea_department_for_energy_innovation_desc: "Чтобы утверждать, что мы используем будущее, мы должны гарантировать, что с научной точки зрения это действительно будущее. Поэтому DEI посвятил себя задаче раскрытия и открытия инноваций в производстве энергии, а также более эффективных способов потребления энергии без потерь, где это возможно."
 free_states_idea_infrastructure_readiness_act: "Закон о готовности инфраструктуры"
 free_states_idea_infrastructure_readiness_act_desc: "Закон о готовности инфраструктуры сам по себе является объявлением войны недовольству и лени, когда дело касается сохранения инфраструктуры нашей страны. Установление интервалов инспекций и предварительное планирование дат строительства, а также приобретение материалов позволят быстро ремонтировать и поддерживать нашу инфраструктуру, одновременно ограничивая общее воздействие, которое она может оказать на повседневную жизнь местного населения."
 free_states_idea_defensive_officers_school: "Школа офицеров обороны"
 free_states_idea_defensive_officers_school_desc: "Мы должны понимать, как проводить собственную специализированную подготовку, направленную на то, чтобы извлечь больше из меньшего и быть способными по-настоящему управлять собственными оборонительными инициативами против безрассудного врага."
 free_states_idea_the_bulwark_doctrine: "Доктрина оплота"
 free_states_idea_the_bulwark_doctrine_desc: "Доктрина «Оплота» — это наш фундаментальный сдвиг в сохранении обороны и духа нашей нации. Понимание того, как использовать местность, логистику и способность защищаться до смерти, не давая всем умереть. Эта коллекция определит, выживем ли мы или будем потеряны в испытаниях самого времени."
 free_states_idea_the_fighter_defense_doctrine: "Доктрина обороны истребителей"
 free_states_idea_the_fighter_defense_doctrine_desc: "Защита нашего неба позволяет нам обеспечить безопасность наших наземных сил. Поэтому мы должны специализировать нашу воздушную подготовку и производство, чтобы обеспечить превосходство наших воздушных возможностей."
 free_states_idea_the_increasing_defensive_capabilites: "Повышение обороноспособности"
 free_states_idea_the_increasing_defensive_capabilites_desc: "Программа IDC — это использование наших методов производства самолетов для того, чтобы принести пользу и помочь нашим пилотам-людям делать в воздухе то, что обычные пилоты делать не могли. Инновации в области радаров, усовершенствования тяги и управления полетом и т. д. Мы будем защитниками воздушных трасс нашей страны, и каждый день будет ясным."
 free_states_idea_naval_mining_warfare_refinement_program: "Программа совершенствования методов минирования на море"
 free_states_idea_naval_mining_warfare_refinement_program_desc: "Программа совершенствования методов ведения минной войны на море — это специализированное учебное заведение, цель которого — обучение и совершенствование наших ВМС в области применения морских мин и минного оружия."
 free_states_idea_armored_assault_assist_groups: "Группы поддержки бронетанковых атак"
 free_states_idea_armored_assault_assist_groups_desc: "AAAG или тройная AG — это боевая доктрина, направленная на локализацию и специализацию бронетанковых подразделений, которые помогут нашей основной армии прорваться сквозь вражеские силы и разделить их."
 free_states_idea_aggressive_officer_corps: "Агрессивный офицерский корпус"
 free_states_idea_aggressive_officer_corps_desc: "Переоснащение наших программ подготовки офицеров и военных академий позволит нашему руководству быть агрессивным в таких формах, которых мы не видели раньше. Это, очевидно, будет иметь свою цену, но тем не менее мы обеспечим, что если на нас нападут, враг пожалеет о таком выборе."
 free_states_idea_material_not_human_loss: "Материальные, а не человеческие потери"
 free_states_idea_material_not_human_loss_desc: "Оборудование можно заменить, но опытных и обученных солдат заменить нельзя. Мы обеспечим такие стили обучения, которые будут способствовать тому, что потенциальная потеря оборудования неизбежна, а потеря товарищей по оружию невосполнима."
 free_states_idea_survivability_program: "Программа выживания"
 free_states_idea_survivability_program_desc: "Мы должны обеспечить инновации в области живучести, в связи с этим мы рассмотрим возможность совершенствования и разработки таких способов, которые позволят максимизировать не только выживаемость персонала, но и, по возможности, живучесть оборудования."
 free_states_idea_admirable_admiralty: "Замечательное Адмиралтейство"
 free_states_idea_admirable_admiralty_desc: "Мастерство и несомненные таланты наших военно-морских лидеров являются вершиной того, как мы обеспечиваем наше превосходство на море."
 FSA_america_hit_and_hit_again: "Бей их, а затем бей их снова"
 FSA_america_hit_and_hit_again_desc: "Вы когда-нибудь пробовали играть в психологическую войну с лодками, ну, теперь мы можем. Специализируясь и понимая слабости нашего собственного вида, мы можем направлять наши боевые действия вокруг нанесения критических ударов после дезориентации вражеских экипажей. Это азартная игра, но в случае успеха она приведет к критическим ударам по возможностям вражеского флота."
 free_states_idea_the_assimilation_program: "Программа ассимиляции"
 free_states_idea_the_assimilation_program_desc: "Создание новой идентичности из старых идей, как правило, не пользуется популярностью у отдельных людей и идеалистических народов. Поэтому мы должны изменить эти предубеждения и работать над тем, чтобы подавить прогресс таких отвлекающих тенденций."
 free_states_idea_the_second_american_republic: "Вторая Американская Республика"
 free_states_idea_the_second_american_republic_desc: "Через кровь, пот, слезы и многие другие испытания мы нашли мантию и обеспечили свою судьбу. Возрождение американской мечты и создание Второй американской республики, наконец-то перевернута глава в этой книге свободы, которую основатели впервые написали еще в 1776 году. К новой эпохе, новому свету и новому будущему для нашей новой республики."
 free_states_idea_the_self_made_embargo: "Самодельное эмбарго"
 free_states_idea_the_self_made_embargo_desc: "Современные технологии, которыми мы располагаем, и методы синтетики позволяют лучше, чем когда-либо, реализовывать автаркические и изоляционистские убеждения. Этим мы создадим современный прецедент, невиданный со времен сёгуната Японии."
 free_states_idea_ground_to_air_dominance: "Господство на земле и в Воздухе"
 free_states_idea_ground_to_air_dominance_desc: "Нам некуда бежать, так что перестаньте бежать и начинайте сражаться. Значительные инвестиции в практические возможности наземного и воздушного боя позволят нам выстоять в любой современной воздушной войне за наши законные земли. Плюс дополнительное оборудование может также помочь в любой подземной войне, если части нашей территории будут осаждены."
 free_states_idea_graveyard_warfare_doctrine: "Доктрина кладбищенской войны"
 free_states_idea_graveyard_warfare_doctrine_desc: "GWD или Graveyard Warfare Doctrine — это всеобъемлющая доктрина, связанная с асимметричной войной или войной 4-го поколения. Эта гражданская доктрина войны превратит в ад любую иностранную державу, которая захочет подчинить нас и наш народ аду своего собственного права."
 free_states_divided_we_fell: "Разделенные, мы пали"
 free_states_divided_we_fell_desc: "Республики больше нет, теперь мы - тень того, чем были когда-то. Земли горят, люди умирают, бегут или выживают в любой точке зрения. Однако это означает, что, хотя мы, по сути, предоставлены сами себе, наши соседи на севере и юге получают некоторую помощь в связи с крупнейшим гуманитарным кризисом, охватившим континенты Нового Света. Дорога разбита, на ней множество препятствий, но мы должны идти вперед и, надеюсь, искать какой-то горизонт."
 free_states_federal_budgets: "Федеральная бюджетная политика"
 free_states_federal_budgets_desc: "Чтобы обеспечить процветание, мы должны сбалансировать счета. Мы должны учиться у окружающего нас мира и понимать, что долг — это число, которое нужно понимать, а не игнорировать."
 free_states_domestic_policies: "Внутренняя политика"
 free_states_domestic_policies_desc: "Мы должны стремиться к улучшению жизни нашего народа, развивать не только нашу страну, но и граждан и культуру, которые составляют то, что мы называем домом."
 free_states_industrial_policies: "Департамент по промышленным вопросам"
 free_states_industrial_policies_desc: "DoIA или иногда называемое IAA, Industrial Affairs Administration, является ветвью правительства, призванной помогать регулировать, упорядочивать и формировать нашу экономику. Она работает рука об руку с DoM в создании сбалансированных правил и планов по росту, диверсификации и поддержанию под контролем экономики нашей страны. Но в то время как DoM занимается строгим распределением ресурсов и организацией указанных ресурсов, IAA занимается планированием и инновациями в рамках предприятий, которые используют эти ресурсы."
 free_states_resource_management_policies: "Департамент управления ресурсами"
 free_states_resource_management_policies_desc: "Департамент управления ресурсами или просто Департамент управления, DoM, является правительственным агентством, призванным перестроить и переоснастить само общество. Полностью сосредоточившись на ресурсах, доступных нам, или в данном случае на том, что нам недоступно, департамент позволяет устанавливать приоритеты и находить способы создания гораздо большего с гораздо меньшими затратами. Этот департамент будет играть ключевую роль в определении курса нашего развития и нашего следа, который мы оставим в истории."
 free_states_tax_policies: "Налоговая политика"
 free_states_tax_policies_desc: "Чтобы оценить наш прогресс, нам нужен стабильный и адаптивный налоговый кодекс. Этот кодекс должен адаптироваться к нуждам нашего народа и национальным интересам, которые обеспечат наше будущее и дорогу, которую мы проложим, чтобы его достичь."
 free_states_army_service_branch: "Подразделение армейской службы"
 free_states_army_service_branch_desc: "Основа национальной обороны и ядро ​​наших вооруженных сил, армия. Чтобы сохранить нашу нацию и ее народ, мы должны реформироваться и создать боевую силу, которая сможет не только удерживать нашу родину, но и бороться с врагами, которые угрожают нашему образу жизни."
 free_states_air_force_service_branch: "Служебное подразделение ВВС"
 free_states_air_force_service_branch_desc: "Хотя костяк — армия, королева поля боя находится не на земле, а в воздухе с военно-воздушными силами. Мы должны идти в ногу с нашими врагами, если мы действительно хотим защитить нашу землю. То, что они не могут атаковать на земле, они, безусловно, могут атаковать и бомбить с воздуха."
 free_states_navy_service_branch: "Служебное подразделение ВМФ"
 free_states_navy_service_branch_desc: "Флот — это экран, который задерживает и предупреждает нас о намерениях врага. У нас должен быть сильный флот, чтобы создать сдерживающий фактор и быть в состоянии защитить нашу родину от угроз за пределами земель, с которыми мы делимся."
 free_states_idea_hit_them_again_doctrine: "Доктрина «Ударь их снова»"
 free_states_idea_hit_them_again_doctrine_desc: "Когда вы бросаете все в кого-то, они либо паникуют, либо отступают, либо теряют сплоченность. Поэтому давайте воспользуемся этой идеей, но установим новый вид игры против врага. Подготавливая флот или военно-морской корабль к тому, чтобы иметь возможность бросать буквально все сразу во врага, эта дезориентация позволит быстро подготовить точный удар для нанесения критических ударов и/или нокаутов вражеским судам."
 USA_colorado_capital: "Гора Колумбия"
 USA_kansas_capital: "Нью-Арлингтон"
 USA_missouri_capital: "Уинфилд"
 post_united_event.1.t: "Фракционность раскалывает свободные государства"
 post_united_event.1.d: "В спешном следствии подобия общества, известного как Свободные Штаты Америки, председательствующее федеральное правительство этой развалившейся нации развило ряд сильных фракционностей. Эта фракционность разделена на то, что многие видят как четыре группы. Эти группы состоят из Социалистов на Севере, Милитаристов на Востоке, Монархистов на Юге и Центральных/Западных федералистов. Эти фракции объединились в две основные фракции, и их будет больше, когда мы найдем новые подробности."
 post_united_event.1.o1: "Разве мы недостаточно разделились?"
 post_united_event.2.t: "Группа «Про выборы»"
 post_united_event.2.d: "В растущей политической фракционности в последнее время мы увидели рост провыборных групп, таких как Федералистская партия, Свободная социалистическая партия и Партия современного монархизма. Эти партии, хотя и отличаются конечными целями и по сути не имеют ничего общего, все они каким-то образом договорились о принципе выборов. Понимая, что система голосования должна быть настолько представительной, насколько это возможно, учитывая текущее положение вещей. Многие все еще цепляются за надежду, что голосование за будущее в долгосрочной перспективе объединит нас больше, чем разделит, но только время может это показать."
 post_united_event.2.o1: "Давайте проголосуем за будущее, которое мы хотим"
 post_united_event.3.t: "Антивыборная группа"
 post_united_event.3.d: "С другой стороны, у нас есть антивыборные партии, в их число входят Федералистская партия, Свободная социалистическая партия и Партия объединенных служб. Как можно заметить по фракционности, разделяющей две основные партии, Федералистская и Свободная социалистическая партии, похоже, фундаментально разделяют потенциальные будущие билеты, если выборы состоятся. Хотя мы мало знаем о состоянии этих разделений, посмотрим, что из этого выйдет в ближайшие дни, поскольку дебаты продолжаются."
 post_united_event.3.o1: "Нам нужно сосредоточиться, а не спорить."
 post_united_event.4.t: "Разделительный опрос"
 post_united_event.4.d: "За последние пару недель социологи и журналисты охватил всю страну, как в своего рода псевдо-схеме голосования, которая называется «Национальный опрос», и многие разделились по поводу того, в каком направлении нам следует двигаться. В конце концов многие согласились, что выборы, тем более в это время, служат лишь отвлекающим маневром в ослабленном и искалеченном государстве, в котором мы находимся. Теперь дело за четырьмя основными партиями, чтобы склонить общественное мнение в свою пользу. Федералистская партия и ее более консервативная фракция, государственническая фракция Свободной социалистической партии, изоляционистская фракция Среднеатлантической партии или милитаристская фракция Национальной сервисной партии. Все хотят разного, но все хотят одного и того же. Никаких выборов и более самодостаточная идентичность в обозримом будущем."
 post_united_event.4.o1: "Федералисты выходят победителями"
 post_united_event.4.o2: "FSP Объединяет Победу"
 post_united_event.4.o3: "Изоляционистская безопасная власть «МАР»"
 post_united_event.4.o4: "NSP выиграли еще одну битву"
 post_united_event.5.t: "Первые выборы"
 post_united_event.5.d: "С возобновлением выборов настало время для голосования и выбора людьми направления, в котором они хотят двигаться. Таким образом, Федералистская, Свободная социалистическая, Среднеатлантическая и Национальная сервисная партии стремятся получить общественную поддержку, чтобы получить гарантированное большинство на выборах. Но по мере того, как время идет, а голоса подсчитываются, победителем первых официальных выборов становится..."
 post_united_event.5.o1: "Федералисты победили"
 post_united_event.5.o2: "Победа свободного социализма"
 post_united_event.5.o3: "Среднеатлантическая партия, очевидно, победила"
 post_united_event.5.o4: "Партия национальной службы одерживает победу"
 post_united_event.1000.t: "Великий вопрос"
 post_united_event.1000.d: "С переменой ветра в нашу пользу мы сделали национальный большой жест и объявили о возможной смене названия страны. Поскольку было организовано общенациональное голосование, и как таковые результаты будут вскоре подведены. Большая игра уже близко, и мы увидим, чего на самом деле хотят люди... давайте просто надеяться, что они хотят нас."
 post_united_event.1000.o1: "Мы Аркадия!!!"
 post_united_event.1000.o2: "По крайней мере, мы едины... верно?"
 post_united_event.2000.t: "Кризис капитала"
 post_united_event.2000.d: "После 2-го Манифеста Судьбы глаза и уши народа страны обращаются к столице, которая все еще находится в старой лачуге на восточном побережье. Многие считают, что столица не должна меняться из-за ее символичности, тогда как еще больше людей считают, что она должна меняться, чтобы символизировать изменение нации в целом. Новая столица позволит лучше планировать с точки зрения роста Палаты представителей, что, по мнению многих, является одним из главных недостатков политического застоя старого порядка. Плюс новая столица, вероятно, будет более центральной, давая свет, внимание и доступ людям, которые никогда бы не подумали даже подумать о том, что делает федеральное правительство. Тем не менее, на выбор есть несколько кандидатов, и выбор должен сделать народ и его лидеры."
 post_united_event.2000.o1: "Зачем что-то менять, все хорошо."
 post_united_event.2001.t: "Скалистые горы"
 post_united_event.2001.d: "Многие утверждают, что создание столичного региона вблизи или практически на Скалистых горах. Это создало бы естественный форт, подобный аппарату, если и когда бы наша страна ни подверглась нападению. Другие утверждают, что это может рассматриваться как немного более изолирующее, чем предполагалось. Независимо от этого, планировщики уже начали закладывать основу для некоего поселения на севере Колорадо."
 post_united_event.2001.o1: "Можно ли купить Rocky Road по низкой цене?"
 post_united_event.2002.t: "«Центральное» правительство"
 post_united_event.2002.d: "Планировщики Канзаса утверждают, что предлагаемое ими место для новой столицы — одно из наиболее центрально расположенных предложений. Это было бы справедливо и не отвечало бы менталитету сторонников восточного побережья против западного. Тем не менее, нам придется оценить остальные варианты, чтобы убедиться в обоснованности нашего выбора."
 post_united_event.2002.o1: "Но они правы."
 post_united_event.2003.t: "Вариант речного барьера"
 post_united_event.2003.d: "Многие в последние дни увидели, что более целесообразно иметь столицу около реки Миссисипи, большой и выделенный барьер от вражеских наземных атак. Символ предполагаемого континентального разделения нашей страны и позиция более безопасная, если учесть несколько вертикальную реку, которая будет покрывать ее южный фланг, в то время как ее восток и почти север также будут покрыты. Вариант более восточный, чем два других варианта, но он расположен на западной стороне Миссисипи. Независимо от этого, все еще идет планирование того, как будет выглядеть новое здание, а также что мы планируем делать с Палатой представителей."
 post_united_event.2003.o1: "По крайней мере, много воды."
 post_united_event.2004.t: "Окончательное решение"
 post_united_event.2004.d: "После недель обсуждений и планирования, опросов общественности и многих других аспектов ситуации. Наконец, пришло время решить, где будет новая столица и как она будет называться. В Колорадо есть предложение о горе Колумбия, в Миссури у нас есть город Уинфилд, который используется в качестве базы с его окрестностями рек Миссури и Миссисипи для естественных границ. Наконец, у нас есть предложение о Нью-Арлингтоне на севере Канзаса, просторном, открытом и более или менее пустом, он был бы, вероятно, чистым холстом для разработки."
 post_united_event.2004.o1: "Старая столица просто прекрасна."
 post_united_event.2004.o2: "Скалистые горы защитят свободу."
 post_united_event.2004.o3: "Очевидно, это должность центрального правительства."
 post_united_event.2004.o4: "Миссисипи защитит свободу."
 post_united_event.2005.t: "Новая Америка"
 post_united_event.2005.d: "С провозглашением Второй Американской Республики мы теперь стремимся реформировать и адаптировать нашу администрацию к масштабу, который мы также увеличили. Очевидно, что будут неэффективные действия, потому что есть так много всего, что нужно командовать и контролировать, тем не менее, мы победим. Орел упал, но он снова поднялся, чтобы взлететь еще выше."
 post_united_event.2005.o1: "Novus Americanus, Новый Американский Век"
 free_states_idea_naval_renovations_budget: "Бюджет реконструкции ВМС"
 free_states_idea_naval_renovations_budget_desc: "При нашем положении и нашей береговой линии, которая в лучшем случае невелика, а в худшем — чудовищна. Мы должны инвестировать в обновление и реконструкцию всего нашего флота, если мы хотим хотя бы подумать о защите от огромных океанов и тех, кто пытается высадиться на наших берегах."
 free_states_idea_military_high_command: "Объединенное военное командование"
 free_states_idea_military_high_command_desc: "Благодаря такому централизованному «высшему руководству» мы теперь можем расширять, обучать, развивать и совершенствовать наши вооруженные силы и их возможности."
 USB_decisions_war_time_mobilization_category: "Мобилизация военного времени"
 USB_decisions_war_time_mobilization_category_desc: "Придет время защищать наши земли и творить нашу судьбу. Берите в руки оружие и защищайте наши земли и памятники, которые выдержат испытание временем."
 USB_war_time_mobilization: "Первая Волна Мобилизации"
 USB_war_time_mobilization_desc: "Пришло время защищать Вашингтон и наши федеральные свободы, за которые мы верны. Мы будем защищать!"
 USB_war_second_wave_defenders: "Вторая Волна Защитников"
 USB_war_second_wave_defenders_desc: "Враг наступает, поэтому мы должны призвать еще одну волну защитников. Моральный дух нации пострадает, но нам нужны войска."
 USB_war_desperate_defenders: "Отчаянные Защитники"
 USB_war_desperate_defenders_desc: "Дела становятся мрачными, нам нужны все доступные тела, способные или нет, чтобы держать оборону. Может быть, просто может быть, мы все еще сможем победить."
 USB_america_economy_what_economy: "Экономика... Какая экономика?"
 USB_america_economy_what_economy_desc: "С учётом абсолютного состояния... ну, всего, мы должны создать понимание базовых основ. Такой основой является установление законодательных реформ в области экономических регуляций, а также увеличение бюджетирования программ социальной помощи, образования и обучения, а также административных программ в части целевых инвестиционных грантов. В целом, мы установим административный и бюджетный стандарт, чтобы обеспечить наилучший подход к экономическому строительству."
 USB_america_department_of_labor_affairs: "Министерство трудовых дел"
 USB_america_department_of_labor_affairs_desc: "Министерство трудовых дел (МТД) — это специализированный департамент, занимающийся улучшением трудовых законов и регуляций с целью повышения эффективности при меньшем числе работников. Также МТД контролирует программы помощи по безработице, и поэтому финансирование делится на две основные части: программы помощи по безработице и программы реинтеграции, которые позволяют безработным участвовать в организованных ярмарках вакансий или программах, обеспечивающих временный доход до того, как они найдут новую постоянную работу и доход."
 USB_america_ensuring_the_modern_four_day_week: "Современная четырехдневная неделя"
 USB_america_ensuring_the_modern_four_day_week_desc: "В современную эпоху мы видим, что автоматизация и технологии позволяют нашей рабочей силе быть более эффективной, чем даже десять-двадцать лет назад. Таким образом, современная четырехдневная рабочая неделя является золотым стандартом для обеспечения настоящего баланса между работой и социальной жизнью, а также позволяет понять, что использование этой модели позволяет получить ещё большую производительность и ценность занятости от существующей рабочей силы."
 USB_america_ensuring_enforced_job_fairs: "Обеспечение обязательных ярмарок вакансий"
 USB_america_ensuring_enforced_job_fairs_desc: "Обеспечение создания и проведения ярмарок вакансий является важным для того, чтобы работодатели знали, какой трудовой ресурс имеется в их регионе, а также чтобы рабочая сила могла узнать о вакансиях, о которых они могли даже не знать. Это потребует некоторых затрат, но для обеспечения гибкости процесса поиска работы оно того стоит."
 USB_america_automation_and_advancements_act: "Закон об автоматизации и прогрессе"
 USB_america_automation_and_advancements_act_desc: "Тройной A, или как его официально называют, Закон об автоматизации и прогрессе, представляет собой бюджетный пакет для образования и НИОКР, направленный на то, чтобы привести отрасли к современным стандартам в области таких технологий, как робототехника, автоматизация и программы на базе ИИ, которые помогают повышать производительность и эффективность в отраслях по всему миру. Хотя это может вызвать опасения среди суеверных людей по поводу временной потери рабочих мест, мы можем смягчить последствия, инвестируя в модернизацию нашей образовательной системы, чтобы люди с раннего возраста становились более осведомлёнными о таких профессиях."
 USB_america_national_labour_corps: "Национальный трудовой корпус"
 USB_america_national_labour_corps_desc: "Национальный трудовой корпус (НТК) — это федеральный гражданский трудовой корпус, в котором безработные граждане, а также в отдельном подразделении — трудовой корпус заключённых, будут работать над инфраструктурными и строительными проектами. Это также даст нам возможность поддерживать в хорошем состоянии такие объекты, как инфраструктура."
 USB_america_military_surplus_jobs: "Работа для военных запасов"
 USB_america_military_surplus_jobs_desc: "Сотрудничество между военным и гражданским секторами обеспечит более своевременное решение проблем с занятостью, с которыми сталкивается наше новое государство."
 USB_america_slashing_regulations_for_new_regulations: "Сокращение старых регуляций для введения новых"
 USB_america_slashing_regulations_for_new_regulations_desc: "Если мы хотя бы хотим задуматься о росте нашей экономики, нам нужно понять, какие регуляции нам действительно нужны, а какие нет. Быть дружелюбным к бизнесу — это одно, а быть пассивными к личной жажде наживы оппортунистов и индивидуалистов — совершенно другая история. Поэтому мы должны сократить существующие регуляции и заменить их на лучшие, более понятные и гибкие, если хотим стимулировать рост, не ставя под угрозу то, что этот рост может означать."
 USB_america_department_for_strategic_resource_collection: "Министерство сбора ресурсов"
 USB_america_department_for_strategic_resource_collection_desc: "Министерство стратегического сбора ресурсов (МССР) — это специализированное административное подразделение Министерства управления ресурсами (МССР), отвечающее за сбор стратегического резерва и/или поставок жизненно важных ресурсов для обеспечения национальной сплоченности. Это такие ресурсы, как сталь для строительства, ископаемое топливо для энергетики и другие. С этим департаментом мы обеспечим будущее."
 USB_america_aggressive_extraction_methods: "Агрессивные методы добычи"
 USB_america_aggressive_extraction_methods_desc: "Дело AEM в департаменте вызвало значительное политическое сопротивление, однако экономический бум, который последует, приведет к гораздо большему восстановлению, если мы сыграем свои карты правильно."
 USB_america_targeted_resource_extraction: "Целевая добыча ресурсов"
 USB_america_targeted_resource_extraction_desc: "В противоположность методам AEM, департамент будет сосредотачиваться на стратегически важных ресурсах, которые необходимы для функционирования нашей экономики. Эта целевая добыча будет работать в тандеме с Министерством энергетики, чтобы обеспечить согласованность в подходе к проектам экономического роста и расширения ресурсов."
 USB_america_rusting_sheets_to_polished_metals: "От ржавых листов к полированным металлам"
 USB_america_rusting_sheets_to_polished_metals_desc: "Пора превратить часть нашей страны, известную как «Пояс ржавчины», в новый блестящий центр металлургического производства. От алюминиевых заводов на побережье Джерси до сталелитейных заводов Пенсильванского комплекса Эри, мы создадим новое из того, что когда-то было заброшено."
 USB_america_strategic_metallurgic_expansions: "Стратегическое расширение металлургической промышленности"
 USB_america_strategic_metallurgic_expansions_desc: "Программы SME в бывших штатах «Пояса ржавчины» — это хорошая начальная инициатива для роста стратегической важности и рабочих мест в этих когда-то забытых центрах производства."
 USB_america_the_capital_gemstones: "Закон о капиталовых драгоценных камнях"
 USB_america_the_capital_gemstones_desc: "Штаты Мэриленд и Делавэр не особо известны чем-то, кроме глины, песка и камня для строительных материалов. Однако угольная промышленность Мэриленда и нефтехимическая промышленность Делавэра могут работать в тандеме, а также мы постараемся усилить рост ограниченных операций по добыче драгоценных камней в этих штатах. Кто бы мог подумать, что самый маленький штат и наш столичный штат окажутся... недооцененными, если честно, хех."
 USB_america_from_coal_to_petrochemicals: "От угля к нефтехимии"
 USB_america_from_coal_to_petrochemicals_desc: "С точки зрения ресурсов, штаты Мэриленд и Делавэр довольно скромны, или, по крайней мере, не впечатляют. Поэтому, чтобы воспользоваться ограниченными возможностями, мы расширим угольную промышленность в Мэриленде, чтобы стимулировать развитие научной и промышленной нефтехимической базы в Делавэре. Это поможет обоим штатам и даст нам дополнительные причины для инвестиций в НИОКР."
 USB_america_the_dynamic_ming_duo: "Динамичный горнорудный дуэт"
 USB_america_the_dynamic_ming_duo_desc: "Виргиния, когда-то единый штат, теперь две части нашего целого государства. С ограниченным разнообразием ресурсов Виргинии мы должны расширить каждый ресурс и подчеркнуть ключевые отрасли, такие как сталь, медь и другие основные минералы. Однако с Западной Виргинией дела обстоят иначе — в штате есть только уголь, поэтому его называют «Штат Черной Жемчужины». Так что давайте начнем добычу жемчугов, кстати, вы знали, что они также добывают драгоценные камни? Хороший дополнительный бизнес в рамках наших грандиозных проектов."
 USB_america_black_pearls_fuel_valley_industries: "Черные жемчужины, питающие промышленность долины"
 USB_america_black_pearls_fuel_valley_industries_desc: "Через прямое развитие угольной и ископаемой топливной добычи в Западной Виргинии мы сможем обеспечить энергетические потребности промышленности Виргинии и металлургических заводов, таких как сталелитейные и титаново-обрабатывающие заводы. Особенно учитывая, что правительство признало некоторые минералы, добываемые в Виргинии, «жизненно важными ресурсами», так что нужно поддерживать поставки этих важных ресурсов."
 USB_america_the_trade_guru: "Торговый гуру"
 USB_america_the_trade_guru_desc: "Вершина наших проектов по развитию и расширению ресурсов привела не только к росту нашей экономики и процветанию в пределах страны. Но мы также должны смотреть за пределы наших границ, потому что существует множество стран, которые могут заинтересоваться нашими ресурсами. Поэтому нам нужно искать этих потенциальных партнеров, чтобы обеспечить наше выгодное будущее."
 USB_america_strategic_autarky_program: "Стратегическая программа автарксии"
 USB_america_strategic_autarky_program_desc: "Обеспечив подлинную форму национальной безопасности, мы должны быть проактивными в вопросах безопасности ресурсов и торговли с другими странами мира. Таким образом, мы внедрим программу САП (Стратегическая программа автарксии), которая будет направлять нашу торговую политику в соответствии с ресурсной безопасностью нашей страны. Многие, вероятно, будут безразличны или разочарованы нашими действиями, но это небольшая цена за обеспечение благосостояния нашей нации."
 USB_america_industrial_development_planning_board: "Установить ИДПБ"
 USB_america_industrial_development_planning_board_desc: "Планировочный совет по промышленному развитию, специализированный орган в рамках Министерства промышленности, занимающийся планированием и развитием экономики вне зависимости от того, что делает частный сектор. Его основная функция — находить баланс в соответствии с национальными потребностями, например, как снизить уровень безработицы, при этом не создавая «зомби-бизнесов», которые на самом деле не способствуют удовлетворению потребностей людей."
 USB_america_civilian_development_administration: "Администрация гражданского развития"
 USB_america_civilian_development_administration_desc: "АГР (Администрация гражданского развития) IDPB отвечает за разработку гражданских экономических инициатив, которые были предусмотрены IDPB для стабильного и продолжительного роста нации, дополняя развитие частного сектора."
 USB_america_erie_hudson_initiative: "Инициатива Эри-Гудзон"
 USB_america_erie_hudson_initiative_desc: "IDPB одобрило Инициативу Эри-Гудзон, которая представляет собой план возрождения нашей части старых «Ржавых Поясов». Это немного, но это честный труд."
 USB_america_cumberland_wilmington_initiative: "Инициатива Камберленд и Уилмингтон"
 USB_america_cumberland_wilmington_initiative_desc: "Нам дали зелёный свет на развитие штатов Мэриленд и Делавэр. Мы начнём работы и установим необходимые условия как можно скорее и с учётом безопасности."
 USB_america_the_sisters_initiative: "Инициатива Sister"
 USB_america_the_sisters_initiative_desc: "Совет только что утвердил планы по развитию Вирджинии. Благодаря этому мы обеспечим индустриализацию и рабочие места для жителей Аппалачского региона и некоторых других."
 USB_america_rustic_services_plan: "План обслуживания услуг в деревенском стиле"
 USB_america_rustic_services_plan_desc: "IDPB планирует улучшить и расширить услуги и офисные сети в штатах Пенсильвания и Нью-Джерси. Мы сразу же приступим к работе и начнём диверсифицировать местную экономику в этих штатах."
 USB_america_mid_atlantic_tech_plan: "Среднеатлантический технический план"
 USB_america_mid_atlantic_tech_plan_desc: "После рассмотрения и доработки Совет утвердил план MAT. Это план и схема развития штатов Мэриленд и Делавэр, которые позволят привлечь в регион специалистов в области технологий и других офисных сетей. Мы надеемся, что это расширит наши возможности в области исследований и разработок."
 USB_america_virginia_tech_expansions: "Расширение технологического института Вирджинии"
 USB_america_virginia_tech_expansions_desc: "В сотрудничестве с Технологическим институтом Вирджинии Совет директоров планирует разработать планы развития и расширения, чтобы вывести на новый уровень сектор технологий и услуг в штатах-побратимах Вирджинии. Мы надеемся, что это приведёт к появлению новых инноваций, а также множества рабочих мест для местных жителей."
 USB_america_military_development_administration: "Администрация военного развития"
 USB_america_military_development_administration_desc: "MDA — это военный аналог CDA. Этот департамент отвечает за реализацию любых военно-промышленных планов, одобренных IDPB, для развития и поддержания обороноспособности нашей страны от иностранных вторжений или прямого нападения."
 USB_america_altoona_tanks_and_jersey_jumpers: "Майки и трикотажные джемперы Altoona"
 USB_america_altoona_tanks_and_jersey_jumpers_desc: "Местные предприятия по производству оружия и вспомогательного оборудования, такого как униформа и так далее, расширят свои производственные мощности. Основные заводы будут расположены в Алтуне, штат Пенсильвания, а также в Ньюарке, штат Нью-Джерси. Совет надеется, что эти заводы создадут рабочие места, увеличат заработную плату и повысят уровень безопасности в случае нападения иностранного государства."
 USB_america_maryland_munitions: "Боеприпасы штата Мэриленд"
 USB_america_maryland_munitions_desc: "Штат Мэриленд, а также Делавэр станут отличным местом для разработки военной вспомогательной техники, особенно с учётом их близости к столице. Таким образом, Совет одобрил план по производству боеприпасов в Мэриленде для развития местных цепочек поставок в военной сфере."
 USB_america_appalachian_arms: "Герб Аппалачей"
 USB_america_appalachian_arms_desc: "IDPB одобрила планы строительства некоторых объектов по производству вооружений в Аппалачском регионе Западной Вирджинии и Вирджинии. Есть надежда, что эти естественные горы также можно будет использовать для хранения запасов, а также для сокрытия и/или частичной защиты заводов в этом районе."
 USB_america_philly_shipyards: "Верфи Филадельфии"
 USB_america_philly_shipyards_desc: "Район залива к югу от Филадельфии — отличное место для строительства судостроительного комплекса. Совет одобрил строительство этих «Больших Филадельфийских верфей» к югу от Филадельфии и вдоль западного побережья Нью-Джерси."
 USB_america_delaware_destroyers: "Эсминец \"Делавэр\""
 USB_america_delaware_destroyers_desc: "Несмотря на название, предполагаемый план развития, ориентированный на Делавэр, на самом деле является более масштабной военно-морской программой. Верфи будут построены вдоль полуострова, который занимают Мэриленд и Делавэр, чтобы лучше использовать это обширное побережье для укрепления береговой обороны."
 USB_america_norfolk_navies: "Военно-морские силы Норфолка"
 USB_america_norfolk_navies_desc: "Порт Норфолк в штате Вирджиния имеет долгую историю строительства и ремонта кораблей. Именно поэтому Совет директоров решил расширить порт, а также построить вспомогательные верфи в относительной близости от комплекса в Норфолке. Они надеются, что весь военно-морской комплекс сможет защищать наши прибрежные воды, как это было на протяжении веков."
 USB_america_idpb_economic_direction_sub_committee: "Подкомитет по экономическому направлению"
 USB_america_idpb_economic_direction_sub_committee_desc: "Поскольку основной функцией IDPB является сама экономика, был создан подкомитет для обсуждения и информирования о наилучшем возможном решении о том, в каком экономическом направлении нам следует развивать нашу страну. Некоторые выступают за более развитую производственную базу, другие — за более развитую экономику, ориентированную на технологии и/или офисные услуги. Хотя есть и те, кто даже предлагает организовать экономику по более военному принципу, используя оружие в качестве рычага для привлечения иностранных инвестиций за счёт его продажи. Тем не менее, именно этому подкомитету предстоит решить, какой вариант является лучшим."
 USB_america_the_mom_and_pop_plan: "План \"Мама и папа\""
 USB_america_the_mom_and_pop_plan_desc: "Основой экономики, очевидно, являются малые предприятия, на которых держится наша великая нация. Поэтому мы будем продолжать экономическое развитие в направлениях, которые обеспечат их главенствующее положение и, возможно, построят более эффективную экономику, чем большинство других стран."
 USB_america_pittswark_development_scheme: "Схема застройки Питтсварка"
 USB_america_pittswark_development_scheme_desc: "PDS — это запланированная инициатива по экономическому развитию в штатах Нью-Джерси и Пенсильвания. Цель состоит в том, чтобы создать больше малых предприятий и развивать больше отраслей, ориентированных на потребителя, для повышения качества жизни граждан этих штатов."
 USB_america_huntingmond_development_scheme: "Схема застройки Хантингмонда"
 USB_america_huntingmond_development_scheme_desc: "Программа HDS - это планируемая инициатива в области экономического развития в штатах Западная Вирджиния и Виргиния-Младший. Целью программы является создание большего числа малых предприятий и отраслей, ориентированных на потребителя, для повышения уровня жизни граждан в этих штатах."
 USB_america_wilmingland_development_scheme: "Схема развития Уилмингленда"
 USB_america_wilmingland_development_scheme_desc: "WDS - это инициатива по экономическому развитию штатов Делавэр и Мэриленд. Целью программы является создание большего числа малых предприятий, а также отраслей, ориентированных на потребителя, для повышения уровня жизни граждан в этих штатах."
 USB_america_norfolk_naval_contract: "Военно-морской контракт с Норфолком"
 USB_america_norfolk_naval_contract_desc: "Несмотря на наши чисто внутренние намерения, мы должны создать какую-то оборонную промышленность, если хотим сохранить наш образ жизни и национальную идентичность. Поэтому военно-морская верфь в Норфолке будет расширена и получит ограниченный контракт на нужды нашей обороны."
 USB_america_altoona_automatics_contract: "Армейский контракт с компанией Altoona Automatics"
 USB_america_altoona_automatics_contract_desc: "Контракт на поставку военного вооружения предназначен только для оборонительных целей, чтобы мы могли защищаться. Таким образом, создание оружейного завода в Алтуне наряду с другими отраслями, ориентированными на потребителя, должно успокоить всех, кто беспокоится о несправедливой милитаризации."
 USB_america_the_consumer_complex_initiative: "Модель потребительского комплекса"
 USB_america_the_consumer_complex_initiative_desc: "Укрепив наше экономическое планирование, мы пришли к осознанию того, что доверие потребителей и удовлетворение экономических потребностей наших граждан являются истинными приоритетами. Поэтому мы разработали новую экономическую модель, которая обеспечит полную согласованность такого приоритетного подхода к потребностям нашей страны и её народа."
 USB_america_mixed_measures_plan: "План смешанных мер"
 USB_america_mixed_measures_plan_desc: "Экономическое планирование само по себе является прекрасным искусством, а кто-то может даже назвать его наукой. Что бы это ни было в ваших глазах, в наших глазах это серия действий по поиску баланса. Нация или общество любого размера должны удовлетворять потребности многих людей, и хотя мы не всегда поступаем правильно, мы, безусловно, можем сделать всё возможное, чтобы не поступать так же неправильно, как в прошлом. Поэтому мы введём в действие План смешанных мер, или ПСМ, — общий план экономического развития, который обеспечит баланс и справедливость в отношении сложных потребностей нашей страны в целом."
 USB_america_rust_belt_renewal_initiative: "Инициатива по обновлению ржавого пояса"
 USB_america_rust_belt_renewal_initiative_desc: "RBRI — это схема диверсификации, направленная на возрождение и, конечно же, диверсификацию экономики бывших «ржавых поясов» — штатов Джерси и Пенсильвания. Идея состоит в том, что диверсификация вдохнёт новую жизнь в то, что, по сути, было однобокой экономикой."
 USB_america_twin_sisters_initiative: "Инициатива сестер-близнецов"
 USB_america_twin_sisters_initiative_desc: "Два штата Вирджиния нуждаются в экономической диверсификации, причём Западная Вирджиния в большей степени, но я отвлекся. Поэтому с помощью этой новой инициативы по экономическому развитию мы сделаем именно это."
 USB_america_the_baltimore_blossom: "Балтиморский цветок"
 USB_america_the_baltimore_blossom_desc: "Применяя тот же подход к планированию в наших последних недиверсифицированных штатах Мэриленд и Делавэр, мы можем сосредоточиться на государственных потребностях в области национальной обороны. Это не самый приоритетный шаг, но необходимый для обеспечения нашего благополучия."
 USB_america_the_office_initiative: "Инициатива \"Офис\""
 USB_america_the_office_initiative_desc: "Сектор услуг и офисный сектор — это прямые потребности современного потребителя. Мы стремимся развивать офисный сектор и его производные, такие как интернет, кабельное телевидение и так далее, чтобы наши инвестиции в развитие приносили пользу."
 USB_america_defense_industry_needs: "Потребности оборонной промышленности"
 USB_america_defense_industry_needs_desc: "Потребности нашей национальной обороны невелики, но мы должны придерживаться сбалансированного подхода. Мы никогда не можем знать, подвергнемся ли мы ответному удару иностранного врага или даже одного из наших соседей. Мало того, что наша позиция позволяет нам мыслить нестандартно, так еще и формировать новую идентичность. На данный момент ограниченная милитаризация под видом самообороны - это все, что нам нужно в настоящее время."
 USB_america_a_true_balance: "Истинный баланс"
 USB_america_a_true_balance_desc: "Наша экономика находится на подъеме, она разнообразна, и потребности людей и правительства удовлетворяются. Теперь мы переходим к настройке этой модели, понимая, как развить и сделать ее более эффективной с точки зрения использования материалов, человеческих и природных ресурсов. Прежде всего, мы введем в действие наш новый план EEM, который представляет собой новую экономическую модель, называемую моделью экономической эффективности, чтобы привести нашу экономику к планированию \"высотой со здание\"."
 USB_america_militarized_economy_plan: "План милитаризованной экономики"
 USB_america_militarized_economy_plan_desc: "Наша ситуация в лучшем случае неустойчива, а в худшем - быстротечна. Мы должны объединить экономику и обеспечить нашу национальную оборону, а также обеспечить все необходимое для жизни, в чем нуждается наше население."
 USB_america_rustic_arms_act: "Закон о деревенском оружии"
 USB_america_rustic_arms_act_desc: "RAA - это пакет мер по развитию и обеспечению безопасности базовых показателей оборонной промышленности в штатах \"ржавого пояса\"."
 USB_america_dover_dockyards: "Дуврские верфи"
 USB_america_dover_dockyards_desc: "Военно-морская промышленность, как для внутренних нужд, так и для военных целей, необходима, если мы хотим обеспечить безопасность нашей торговли на мировой арене. Возможно, у нас и нет 350 кораблей, но их достаточно для прикрытия и защиты - это все, что имеет значение на данный момент."
 USB_america_sister_armaments: "Родственные вооружения"
 USB_america_sister_armaments_desc: "Несмотря на скромное название, местная монахиня не собирается создавать ополчение, как бы это ни было забавно. Нет, это совместная инвестиция в компанию по производству оружия, известную как \"Оружейная компания сестры\". Основанная двумя сестрами и реально работающая только в братских штатах обеих Виргиний, мы можем положиться на это семейное единство в создании качества, которое будет защищать эти семьи штата и нацию в целом."
 USB_america_federal_firearms: "Федеральное огнестрельное оружие"
 USB_america_federal_firearms_desc: "\"Федеральный округ\", то есть те штаты, которые оспаривают столичный регион, нуждаются в вооружении и технике, которые должны поставляться из местных источников и как можно более тщательно, чтобы обеспечить снабжение сил обороны в случае наихудшего развития событий. Таким образом, развитие оборонной промышленности Вирджинии и Мэриленда необходимо для обеспечения безопасности столицы нашей страны."
 USB_america_complacency_act: "Закон о самоуспокоении"
 USB_america_complacency_act_desc: "Несмотря на эвфемистическое название, Закон о самоуспокоении на самом деле является специальным пакетом мер по развитию и распространению гражданских отраслей промышленности и тому подобного, чтобы обеспечить удовлетворение основных потребностей нашего населения. Поэтому, если разразится война, у них есть возможность в какой-то мере обеспечить себя продовольствием, чтобы предотвратить необходимость введения нормирования потребления и тому подобного."
 USB_america_military_ready_economy: "Экономика, готовая к войне"
 USB_america_military_ready_economy_desc: "Сейчас, когда реализуется целый ряд программ развития и ситуация в гражданских и военных вопросах выглядит более стабильной, мы можем сосредоточиться на нашей способности к адаптации. Мы можем усовершенствовать наше текущее экономическое развитие, чтобы быть готовыми к действиям, если враг хотя бы подумает об объявлении нам войны. Это будет немного непопулярно среди гражданского населения, но мы готовы пойти на такую жертву."
 USB_america_establishing_the_department_of_energy: "Министерство Энергетики"
 USB_america_establishing_the_department_of_energy_desc: "Министерство энергетики является подразделением Министерства энергетики США, которое занимается вопросами энергетических потребностей страны. Как производить, где строить новые объекты, техническое обслуживание инфраструктуры и так далее."
 USB_america_tried_and_tested_development: "Проверенная разработка"
 USB_america_tried_and_tested_development_desc: "Старые технологии, основанные на использовании ископаемого топлива, по-прежнему актуальны, несмотря на возможную оппозицию со стороны любителей деревьев, мы все еще можем удовлетворить большинство за счет дешевой и эффективной электроэнергии. Мы можем даже добавить немного возобновляемых источников энергии, если ажиотаж станет слишком назойливым."
 USB_america_innovation_station_plan: "План инновационной станции"
 USB_america_innovation_station_plan_desc: "Разнообразие нашего энергопотребления, а также методов производства - лучший способ обезопасить себя от иностранного вмешательства. Поэтому со временем начнутся масштабные инвестиции в исследования и разработки, а также создание разнообразной платформы средств производства энергии."
 USB_america_west_virginian_revival: "Возрождение Западной Виргинии"
 USB_america_west_virginian_revival_desc: "Благодаря нашему плану развития производства электроэнергии, в большей степени ориентированной на ископаемое топливо, мы с тех пор косвенно возродили некоторые отрасли горнодобывающей промышленности Западной Виргинии и основу экономики этого штата. Это непреднамеренный акт, но, тем не менее, это настоящий бум, которым будет наслаждаться не только Западная Вирджиния, но и нация в целом."
 USB_america_the_solar_harness: "Солнечный жгут"
 USB_america_the_solar_harness_desc: "Использование Солнца для выработки энергии может быть таким же переменным, как, скажем, ветер. Однако, если мы сможем стратегически разместить солнечные панели и солнечные поля в районах, которые в среднем подвергаются большему воздействию солнца, это принесет больше пользы в долгосрочной перспективе. Поэтому мы можем ввести налоговые льготы и программы, позволяющие людям вырабатывать электроэнергию для своих собственных домов и, вероятно, для энергосистемы в целом."
 USB_america_oil_and_gas_power: "Нефтегазовая энергетика"
 USB_america_oil_and_gas_power_desc: "Уголь может принести лишь ограниченную пользу, и поэтому, чтобы достичь трех целей, мы должны развивать наши нефтяные и газовые мощности, чтобы обеспечить всестороннюю методологию производства энергии."
 USB_america_the_winds_of_change: "Ветры Перемен"
 USB_america_the_winds_of_change_desc: "Отношение к ветровой энергии как к солнечной и понимание ее недостатков позволят нам стратегически размещать ветряные турбины в районах, где ветры могут быть как можно более постоянными. Дополнительным преимуществом является создание океанских ветряных турбин, которые используют не только ветры, но и приливные течения для выработки электроэнергии. Это не самое приятное зрелище для любителей пляжного отдыха, но на такие жертвы мы должны пойти, если хотим быть энергетически самодостаточными."
 USB_america_power_hubs: "Силовые концентраторы"
 USB_america_power_hubs_desc: "Будут созданы богатые ресурсами и стратегически расположенные \"энергетические центры\" для создания более централизованных и эффективных комплексов по производству электроэнергии. Западная Вирджиния и Мэриленд подходят под оба описания, не отвлекая от развития других отраслей промышленности, которые могут потребоваться на тех же землях."
 USB_america_green_coal_act: "Закон о \"зеленом угле\""
 USB_america_green_coal_act_desc: "GCA - это эвфемистическое название для определения того, что некоторые могут считать \"углем новой эры\". Речь, конечно же, идет об уране и ядерной энергетике в целом. Мы должны должным образом инвестировать и развивать эту технологию, поскольку это более или менее будущее обильного производства энергии. В конце концов, почему еще большинство научно-фантастических средств массовой информации используют либо ядерную энергию, либо выдуманный материал в качестве предполагаемого \"универсального источника энергии\", ведь потенциал есть, и мы пока не нашли ничего лучше ядерной энергии?"
 USB_america_department_for_synthetic_development: "Отдел Синтетических Разработок"
 USB_america_department_for_synthetic_development_desc: "DSD - это специализированный научно-исследовательский отдел Министерства энергетики, который занимается инновациями и разработкой синтетических материалов. Это может быть уголь, нефть, газ или некоторые продукты нефтехимии, такие как пластмассы или нейлон."
 USB_america_department_for_energy_innovations: "Департамент Энергетических Инноваций"
 USB_america_department_for_energy_innovations_desc: "DEI - это специализированный отдел исследований и разработок Министерства энергетики, который занимается инновациями в области производства и использования энергии. Мы должны смотреть в будущее, если хотим использовать то, что мы называем будущим."
 USB_america_department_of_logistical_affairs: "Департамент По Вопросам Материально-технического обеспечения"
 USB_america_department_of_logistical_affairs_desc: "Как и в случае с Департаментом транспорта, основная функция DoLA заключается в обеспечении поддержания, а также гибкости и/или адаптируемости нашей инфраструктуры, а также в определении направлений расширения и/или развития в соответствии с потребностями страны."
 USB_america_northern_highways_act: "Закон о северных автомобильных дорогах"
 USB_america_northern_highways_act_desc: "NHA - это пакет мер по развитию и расширению или техническому обслуживанию существующих крупных автомобильных дорог, связанных с межгосударственной системой."
 USB_america_re_establishing_the_pennsy: "NHA - это пакет мер по развитию и расширению или техническому обслуживанию существующих крупных автомобильных дорог, связанных с межгосударственной системой."
 USB_america_re_establishing_the_pennsy_desc: "PRR или Pennsy, как те, кто помнит бывшую железную дорогу fallen flag railroad, была железной дорогой на пике своего развития, которая охватывала территорию вплоть до Миссури. Увы, из-за вынужденного слияния с New York Central и другими обанкротившимися железными дорогами в хаос, которым была Penn Central, последующее банкротство было неизбежным. Теперь, начав все с чистого листа и получив новую жизнь, мы восстановим Пенсильванскую железную дорогу и будем поощрять гибкое регулирование для предотвращения крупных слияний или вынужденных банкротств, которые предшествовали началу века."
 USB_america_southern_highways_act: "Закон о южных автомобильных дорогах"
 USB_america_southern_highways_act_desc: "Как и раньше, мальчики и девочки, только на этот раз мы уделяем особое внимание инфраструктуре нашей страны."
 USB_america_re_establishing_the_norfolk_and_western: "Восстановление \"Норфолк энд Вестерн\""
 USB_america_re_establishing_the_norfolk_and_western_desc: "Северо-Западная железная дорога была прибыльной угольной железной дорогой, которая обслуживала Виргинию и немного превосходила ее по территории. Несмотря на изменения, железная дорога в целом выдержала испытание временем. Однако в связи с массовыми слияниями компаний во второй половине 1900-х годов, а также растущей конкуренцией со стороны автомобильных, воздушных и других отраслей, N&W была более или менее вынуждена найти партнера по слиянию. Они нашли один из них на Старой, надежной железной дороге Юга, известной как Южная железная дорога, вскоре после того, как оба прежних флага были сброшены, и установили новый, общий, под названием Norfolk Southern. Теперь, когда классовые флаги почти уничтожены, пришло время вернуть немного реальной американской истории и поднять несколько упавших флагов."
 USB_america_the_infrastructure_readiness_act: "Закон о готовности инфраструктуры"
 USB_america_the_infrastructure_readiness_act_desc: "IRA - это не ирландский закон об иммиграции, скорее, это государственное постановление и указание на то, что содержание инфраструктуры само по себе является частью национальной безопасности. Таким образом, одним из главных приоритетов, следующих за национальной обороной, является поддержание нашей инфраструктуры в максимально хорошем состоянии, не создавая чрезмерных постоянных трудностей для местного населения, где необходимо выполнять указанные работы."
 USB_america_military_debate: "Великие военные дебаты"
 USB_america_military_debate_desc: "Иметь армию - это прекрасно, но лучше знать, что ты собираешься с ней делать."
 USB_america_the_bulwark_doctrine: "Доктрина оплота"
 USB_america_the_bulwark_doctrine_desc: "Наши враги ожидают от нас агрессии, безрассудства, но мы не должны поддаваться таким соблазнам. Мы должны создавать и использовать наши вооруженные силы в оборонительной манере, понимая, что по-настоящему быстрой войны не бывает. Обладая этими знаниями, мы можем создать военный оплот и позволить врагу растрачивать ресурсы впустую, в то время как мы выиграем войну на истощение благодаря тщательной гражданской и военной интеграции в интересах национальной обороны."
 USB_america_infantry_supremacy_guide: "Руководство по превосходству пехоты"
 USB_america_infantry_supremacy_guide_desc: "Каждому мужчине - винтовку, каждой женщине - дробовик. Такова декларация нашего Руководства по превосходству пехоты или плана военной подготовки ISG для армии. Мы, конечно, будем инвестировать в бронетехнику и так далее, без сомнения, учитывая современные методы ведения войны. Но если мы хотим иметь такое снаряжение, мы должны обучать каждого солдата так, как если бы от него всегда ожидали, что он будет пехотинцем."
 USB_america_refining_ocs_institutions: "Совершенствование институтов OCS"
 USB_america_refining_ocs_institutions_desc: "Лидерство - это основа того, что заставляет армию функционировать. Это общеизвестный факт, что мы расширим обучение нашего офицерского корпуса в наших военных академиях, чтобы отразить и адаптировать к новому направлению деятельности наших вооруженных сил. Оборонительная доктрина и инициатива в отношении сохранения сил, находящихся под их командованием. Вместе мы выстоим, руководство будет защищать, как и войска, которыми они будут командовать."
 USB_america_streamlining_logistics: "Оптимизация логистики"
 USB_america_streamlining_logistics_desc: "Чтобы быть в состоянии удерживать позиции, мы должны быть в состоянии обеспечивать снабжение наших солдат. Поэтому мы должны оптимизировать логистическую расстановку приоритетов, чтобы обеспечить снабжение наших войск, а также поддерживать моральный дух наших войск."
 USB_america_establishing_the_doctrine: "Установление Доктрины"
 USB_america_establishing_the_doctrine_desc: "Вершиной нашего плана развития армии является разработка официальной доктрины наших вооруженных сил, и это доктрина \"Оплот\". Мы обеспечим защиту нашей страны и ее народа."
 USB_america_sky_defenders_program: "Программа \"Защитники неба\""
 USB_america_sky_defenders_program_desc: "The modern queen of the battlefield is that of the air force. Be it fighters, bombers or multi-roled aircraft, the principle is, if you want to win the war then you must win it in the air. As ushc we will develop and orient ourselves in refining the ability to defend and hold our airspace from enemy bombers and the like from destroying our defensive capabilities."
 USB_america_fighter_defense_doctrine: "Доктрина защиты истребителей"
 USB_america_fighter_defense_doctrine_desc: "The FDD is the dedicated organization of our air force around the principle of localizaed security. We are defending our homeland, therefore our aircraft as well as our training must be geared around such distinctions."
 USB_america_agility_training_measures: "Мероприятия по тренировке ловкости"
 USB_america_agility_training_measures_desc: "Наша подготовка - это установленный стандарт, который воплощает ожидания от того, что значит вступить в наши военно-воздушные силы. Это означает, что мы должны усовершенствовать наши методы обучения, чтобы наши пилоты могли выдерживать перегрузки, превышающие обычные, и повысить возможности пилотов siad. Дело не только в том, что маневренность наших самолетов превышает возможности наших пилотов, поэтому нашим самым большим ограничением является сам персонал. Поэтому мы будем работать над улучшением этого, мы должны это улучшить."
 USB_america_aircraft_refinement_programs: "Программы усовершенствования воздушных судов"
 USB_america_aircraft_refinement_programs_desc: "ARP - это специальная программа утилизации производственных мощностей, направленная на внедрение инноваций и эффективное развитие наших самолетов для выполнения той роли, которую мы ставим перед собой."
 USB_america_naval_repair_schools: "Военно-морские ремонтные училища"
 USB_america_naval_repair_schools_desc: "Привлечение не только военно-морского ремонтного персонала, но и гражданских подрядчиков по сварке значительно упростит процесс ремонта и переоснащения. Это, в свою очередь, позволит нам производить более качественное оборудование по доверенности, поскольку интеграция этих новых NRS упростит ремонт даже самого сложного судна."
 USB_america_naval_alloy_innovations: "Инновации в области военно-морских сплавов"
 USB_america_naval_alloy_innovations_desc: "NAI - это научно-исследовательский отдел, занимающийся достижениями в области создания военно-морских судов. Такие вопросы, как водоизмещение и усовершенствование сплавов, позволяют создавать более совершенные, плавучие и долговечные корабли, способные плавать в любых условиях на море."
 USB_america_mining_warfare_refinements: "Усовершенствования в горнодобывающей войне"
 USB_america_mining_warfare_refinements_desc: "Программа MWR ориентирует наши военно-морские силы на адаптацию и совершенствование возможностей морского минирования и противоминной борьбы."
 USB_america_navy_readiness_training: "Тренировка готовности военно-морского флота"
 USB_america_navy_readiness_training_desc: "Совершенствуем учебные программы и подразделения нашего военно-морского персонала, чтобы сгладить и повысить оперативность реагирования на угрозы, а также на возможные ложные тревоги, поскольку даже ложная тревога является потенциальной угрозой."
 USB_america_the_spearhead_doctrine: "Доктрина острия копья"
 USB_america_the_spearhead_doctrine_desc: "Наши военные должны быть подобны наконечнику копья, способному колоть, рубить и разрубать противника там, где это возможно, прежде чем он сможет организовать эффективную оборону."
 USB_america_perpetual_assault_training: "Постоянные штурмовые тренировки"
 USB_america_perpetual_assault_training_desc: "PAT - это учебная программа, направленная на понимание и развитие выносливости солдат для выполнения того, что мы называем \"Вечной атакой\". Думайте об этом как об усовершенствовании доктрины массового нападения старых времен, но с учетом принципа концентрированных атак, обеспечивающих быстрое наступление и возможное окружение. Это похоже на гибрид массового нападения с поражением в деталях."
 USB_america_armored_assault_assist: "Бронированная штурмовая группа содействия"
 USB_america_armored_assault_assist_desc: "Военная \"тройка А\" - это усовершенствование нашего бронетанкового крыла армии, которое позволит нам наносить удары и уничтожать небольшие скопления вражеских войск без особого риска попасть в окружение."
 USB_america_officer_corp_aggression_training: "Подготовка офицерского корпуса к проявлению агрессии"
 USB_america_officer_corp_aggression_training_desc: "Наша способность продвигаться вперед зависит исключительно от ответственных офицеров. Прививать солдатам бодрость и решительность, а также понимать планирование и тактику, необходимые для продвижения вперед и понимания доктрины, которую мы разработали для наших вооруженных сил и армии в целом."
 USB_america_material_not_human_loss: "Материальные потери, а не человеческие"
 USB_america_material_not_human_loss_desc: "Мы не можем позволить себе терять наших людей, несмотря на методологию нашей доктрины, мы по-прежнему считаем, что наши солдаты - это наш главный актив. Поэтому мы должны перестроить нашу логистику, чтобы компенсировать потери в оборудовании, сопоставимые с тем, что мы попытаемся сэкономить на расходах на рабочую силу."
 USB_america_proactive_air_assaults: "Упреждающие воздушные атаки"
 USB_america_proactive_air_assaults_desc: "Агрессивность наших военно-воздушных сил позволит нам сбивать вражеские самолеты до того, как они это осознают. Благодаря упреждающим тренировкам, позволяющим отрабатывать быстроту реакции и приспособляемость наших экипажей и пилотов. Короче говоря, они должны уметь справляться с ситуациями и ложными тревогами с максимально возможной скоростью и гибкостью подхода, основанного на быстром и критическом осмыслении ситуации и имеющейся у них информации."
 USB_america_modern_maneuverability_courses: "Современные курсы маневренности"
 USB_america_modern_maneuverability_courses_desc: "С учетом развития технологий скрытности и возрастающих требований к пилотам, мы должны заранее обучать и адаптировать их к сценариям гиперманевренности, которые в среднем создают опасные перегрузки. Это потребует затрат, но в долгосрочной перспективе принесет нам значительные преимущества."
 USB_america_redesigns_and_field_testing: "Переработка и полевые испытания"
 USB_america_redesigns_and_field_testing_desc: "Анализ любых данных, которые мы можем получить о наших существующих самолетах, позволит нам создавать более совершенные конструкции, а также улучшать программы подготовки. В свою очередь, это усилит возможности наших военно-воздушных сил как в оборонительных, так и в наступательных операциях."
 USB_america_air_corps_survivability_program: "Программа выживаемости авиационного корпуса"
 USB_america_air_corps_survivability_program_desc: "Программа СП направлена на разработку новых способов обеспечения выживаемости как пилота, так и техники, где это возможно. Разумеется, приоритет всегда остается за пилотом, так как его подготовка к экстремальным условиям занимает значительно больше времени, чем производство куска металла с проводами."
 USB_america_rapid_response_protocols: "Протоколы быстрого реагирования"
 USB_america_rapid_response_protocols_desc: "РРП — это тренировки и стандартизация оборудования, направленные на улучшение способности проводить \"полевые ремонты\" на открытом море. Несмотря на то, что подтверждение возвращения в порт всегда необходимо, реальность такова, что ремонт остается ремонтом, если он выполнен правильно."
 USB_america_streamlining_port_facilities: "Оптимизация портовых объектов"
 USB_america_streamlining_port_facilities_desc: "Для обеспечения боевой готовности наших военно-морских сил нам необходимо оптимизировать, обновить и подготовить объекты для приема судов, а также для строительства новых."
 USB_america_the_new_admiralty: "Новое Адмиралтейство"
 USB_america_the_new_admiralty_desc: "Наши корабли ничего не значат, если люди, которые их командуют, ничего не знают. Поэтому полное обновление системы подготовки и формирования будущих военно-морских командиров является нашим главным приоритетом."
 USB_america_hit_and_hit_again: "Удар и снова удар"
 USB_america_hit_and_hit_again_desc: "Через стратегическое маневрирование мы можем попытаться направить большие объемы огня на противника, чтобы дезорганизовать его. Если нам удастся морально истощить врага, мы сможем добиться победы не только на поле боя."
 USB_america_foreign_policy_debate: "Великое национальное направление"
 USB_america_foreign_policy_debate_desc: "С нашей страной, находящейся в стабильности, с ясными головами и с учетом того, что экономика и гражданские потребности обеспечены, мы будем обсуждать следующий великий путь, который мы хотим выбрать для нашей нации."
 USB_america_reclaim_the_mantle_of_destiny: "Восстановление права на судьбу"
 USB_america_reclaim_the_mantle_of_destiny_desc: "Вакуум власти огромен, и только мы способны его заполнить. Мы контролируем старую столицу, а также ядро нашей территории составляют федералистские элементы старой республики. С упорством, решимостью и мастерством мы обеспечим выполнение нашей истинной судьбы и вернем земли прошлого ради величия провозглашения Второй Американской Республики."
 USB_america_war_plan_arcadia: "Военный план \"Аркадия\""
 USB_america_war_plan_arcadia_desc: "Самый короткий и, на наш взгляд, самый слабый фронт — это Северо-Восток. Учитывая это, мы должны подготовиться, спланировать и настроиться на предстоящее вторжение с севера."
 USB_america_battle_plan_albany: "Боевой план \"Олбани\""
 USB_america_battle_plan_albany_desc: "Нью-Йорк, земля свободы для тех, кто иммигрировал из старого света. Теперь это противник, которого мы должны завоевать, чтобы обеспечить наше право на власть. От залива Гудзона до канадской границы мы обеспечим символ свободы, вперед к победе!"
 USB_america_battle_plan_providence: "Боевой план \"Провиденс\""
 USB_america_battle_plan_providence_desc: "Великий север, который представляет собой Новую Англию, её леса — наша главная проблема при разработке любых планов. Тем не менее, мы захватим более развитую часть Новой Англии, и, без сомнения, их мораль рухнет, а ещё одна победа будет одержана нами."
 USB_america_war_plan_mississippi: "Военный план \"Миссисипи\""
 USB_america_war_plan_mississippi_desc: "Мы даже не контролируем половину флота, поэтому наша главная цель — обеспечить контроль над всем, что находится к востоку от реки Миссисипи. Это лучший естественный рубеж, который также обеспечит наш статус на континенте."
 USB_america_battle_plan_gary: "Боевой план \"Гэри\""
 USB_america_battle_plan_gary_desc: "Великие озера станут ещё более великими, когда мы вновь интегрируем эти бывшие территории. С положительной стороны, мы сможем запутать врага, не понимая, является ли нашей основной целью захват Гэри, Индиана, или же сам Гэри создал этот план."
 USB_america_battle_plan_dixie: "Боевой план \"Дикси\""
 USB_america_battle_plan_dixie_desc: "Мы направляемся в Диксиленд, ребята и девчонки. Мы убедимся, что каждый парень из Дикси поймет, что он всегда будет жить под крылом дяди Сэма."
 USB_america_securing_the_new_frontiers: "Обеспечение новых рубежей"
 USB_america_securing_the_new_frontiers_desc: "Прежде чем продолжить наше продвижение к Тихому океану, мы должны обеспечить и контролировать те территории, которые мы уже захватили. Единство перед экспансией стало причиной прошлого, теперь мы создадим лучшее будущее."
 USB_america_the_borderlands: "Пограничные земли"
 USB_america_the_borderlands_desc: "Прогресс нашей ассимиляции должен быть скоординирован, и поэтому первоочередной задачей должны стать пограничные земли."
 USB_america_uniting_the_arcadians: "Объединение Аркадийцев"
 USB_america_uniting_the_arcadians_desc: "Северо-Восток, или, когда-то, много веков назад, был частью французской колониальной области Аркадия. Эти люди имеют очень характерную культуру, основанную на сильном британском и тонком французском влиянии. Поэтому мы будем работать над искоренением этих различий и принесением единства в эти земли."
 USB_america_southern_culture_is_american: "Южная культура — это американская культура"
 USB_america_southern_culture_is_american_desc: "Хотя это не было результатом кровавого восстания, мы снова стремимся вернуть Юг под наше крыло. Вместо неудавшихся и противоречивых политик двух разных администраций, мы введем унифицированную и законную политику интеграции. Юг и южная культура — это американская культура, и с ними следует обращаться именно так. Ведь Юг дарит нам такие вещи, как комфортную пищу и фанатизм в спорте. Эти вещи — американские, и они будут признаны и уважаемы как таковые."
 USB_america_midwestern_unity: "Единство Среднего Запада"
 USB_america_midwestern_unity_desc: "Так же, как и Юг, Средний Запад известен своими сезонами охоты, но также приносит свою уникальную версию комфортной пищи, и кто может забыть спортивные соперничества. Таким образом, Средний Запад — это еще одна часть американской мозаики, и следует четко дать понять, что, хотя да, они и являются культурным подтипом, в конечном итоге они всего лишь хорошие, старые американцы с красной, белой и синей кровью."
 USB_america_cajun_dixie_and_us: "Каджун, Дикси и мы"
 USB_america_cajun_dixie_and_us_desc: "Западная половина бывшей Южной Республики, а также их конфедеративные предки, обладают сильной волей к независимости. Культурные различия в их особенностях, а также более изолированные регионы, находящиеся на востоке или на самом берегу реки Миссисипи, дают им больше возможностей для самостоятельных действий. Тем не менее, мы должны работать над ассимиляцией этих культур, напоминая им о сходствах и общих ценностях с их братьями и сестрами на Юге и Среднем Западе."
 USB_america_war_plan_pacific: "Военный план \"Тихий океан\""
 USB_america_war_plan_pacific_desc: "Это начало, а также подготовка к концу. Второе Проявление Судьбы, или, как некоторые начали называть это, \"Американский крестовый поход\". В конце концов, единственное, что имеет значение, - это Единство, Долг и то, что американская идентичность еще раз укрепляется."
 USB_america_battle_plan_alamo: "Боевой план \"Аламо\""
 USB_america_battle_plan_alamo_desc: "Сэм Хьюстон в свое время хотел основать нацию, которую поселенцы региона могли бы назвать своим домом. Они сражались до последнего с \"Наполеоном Запада\", Санта-Анной. А затем, одержав победу, они подали петицию и назвали свою новую родину Америкой. Давайте вернем в наш состав тех американцев, которых большинство мира считало нас."
 USB_america_battle_plan_woundedknee: "Боевой план \"Раненое колено\""
 USB_america_battle_plan_woundedknee_desc: "Кастер совершил свой печально известный последний бой в массовом убийстве при Раненом Колене. Теперь мы не будем так безрассудны, как был Кастер, но мы обеспечим продовольственную корзину республики и напомним людям, что, старые ли это люди или новые, все они — американцы."
 USB_america_the_second_utah_war: "Вторая война за Юту"
 USB_america_the_second_utah_war_desc: "Мы почти достигли Тихого океана, теперь на нашем пути стоят Скалистые горы и \"мормоны\". Мы победим их, как сделали это в 1850-х годах, ибо мы будем объединены от моря до сверкающего моря."
 USB_america_battle_plan_cascadia: "Боевой план \"Каскадия\""
 USB_america_battle_plan_cascadia_desc: "Движение Каскадии — это очень новое и свежее явление. Если мы быстро ликвидируем их и заранее подготовимся, чтобы не застрять в горах, это обеспечит нам уверенность в том, что мы сможем напомнить этим \"лаймлайтерам\" и трезво напомнить им, что они всего лишь американцы с Тихоокеанского побережья."
 USB_america_battle_plan_angels: "Боевой план \"Анджелы\""
 USB_america_battle_plan_angels_desc: "Калифорния, дом американской мечты и таких важных вех в истории Америки, как эпоха золотой лихорадки. Город ангелов и более населенные южные побережья будут нашей главной целью и, вероятно, самым легким подходом. Давайте продвигаемся вперед и вернем самые отдаленные рубежи Американской мечты."
 USB_america_west_of_the_mississippi: "Запад от Миссисипи"
 USB_america_west_of_the_mississippi_desc: "Великий крестовый поход, месяцы и годы планирования, боев и так далее наконец завершены. Теперь мы стремимся установить порядок, обучить и напомнить людям этих земель к западу от реки Миссисипи, что они являются и всегда были американцами."
 USB_america_from_plains_to_rockies: "От равнин до Скалистых гор"
 USB_america_from_plains_to_rockies_desc: "Чем дальше на запад мы движемся, тем больше люди ощущают дистанцию от правительства. Давайте напомним им об их корнях, истории и схожести, чтобы мирно реинтегрировать эти земли пионеров перед нами. Также стоит рассмотреть идею переноса столицы, учитывая, что этот вопрос когда-то был кличем многих движений за отделение."
 USB_america_from_sea_to_shining_sea: "От моря до сверкающего моря"
 USB_america_from_sea_to_shining_sea_desc: "Великое второе Манифестное предназначение завершено, и с большими трудностями, испытаниями и усилиями мы достигли берегов Тихого океана. Теперь американская мечта может быть вновь осознана и сиять в глазах тех, кто составляет наше будущее."
 USB_america_the_great_administration: "Великое управление"
 USB_america_the_great_administration_desc: "С единством по всей стране, мы теперь можем начать реформу государственной службы и администрации, которая крайне необходима для такой обширной и географически разнообразной земли."
 USB_america_capital_crisis: "Кризис столицы"
 USB_america_capital_crisis_desc: "С укреплением единства нации, мы должны обратить внимание на самое очевидное слабое место — это положение и местоположение федеральной столицы и последующего федерального правительства страны. Мы должны рассмотреть наши варианты и понять, можем ли мы и где расположить нашу новую столицу, чтобы двигаться вперед должным образом."
 USB_america_the_proclamation: "Великое провозглашение"
 USB_america_the_proclamation_desc: "День настал, чтобы завершить эту главу американской истории. Первая республика просуществовала почти 300 лет, пережив практически все республики до неё, так как основным отличительным признаком новой республики является переписывание их учредительного документа. Именно поэтому Франция уже на своей седьмой республике, а греки — на какой-то там, однако с этой новой республикой мы вступаем в новую эру и будем искать будущее, которое мы хотим."
 USB_america_the_great_shutdown: "Великая приостановка"
 USB_america_the_great_shutdown_desc: "Перспективы и мечты прошлого канули в Лету, мир нас подвел, и мы подвели его. Давайте сосредоточимся внутри страны и станем самой крепкой ореховой скорлупой, которую невозможно расколоть. Ведь если у нас нет ничего, что могло бы нас отвлечь, действительно ли нам нужно расширяться наружу?"
 USB_america_self_embargo: "Величайшая блокада"
 USB_america_self_embargo_desc: "ЭП, или как некоторые шутя называют его Великий план блокады, — это закрытие торговли с внешним миром. Мы устанавливаем прецедент, не виданный уже несколько веков, и планируем опираться только на свои силы, улучшая жизнь наших граждан на самых независимых и незатронутых внешними влияниями путях. Это сильно повредит нашей экономике, но с большим фокусом и решимостью мы сможем найти новый путь. Наш путь."
 USB_america_every_citizen_a_job: "Каждый гражданин — с работой"
 USB_america_every_citizen_a_job_desc: "С нашим самоблокированием мы должны обеспечить экономическую стабильность. Учитывая это, наше образование и государственные службы должны быть адаптированы к этим новым вызовам, а также к тому факту, что теперь каждый гражданин, способный работать, должен и будет иметь работу. Этот фундаментальный сдвиг в экономике является революционным и, вероятно, в лучшем случае нестабильным. Но если мы подготовимся, сосредоточимся и правильно скоординируем наши усилия, мы сможем обеспечить выполнение основных потребностей для выживания, а также насладиться теми же роскошами, которые доступны другим нациям, если мы будем стремиться к этому."
 USB_america_mandatory_service_period: "Обязательный срок службы"
 USB_america_mandatory_service_period_desc: "Чтобы обеспечить максимальную готовность нашей нации, мы должны ввести обязательный срок службы для наших граждан. Более того, мы должны поощрять такие программы, как JROTC в школах, и лучше адаптировать наше общество к более военному укладу жизни."
 USB_america_ground_defense_is_air_defense: "Наземная оборона — это воздушная оборона"
 USB_america_ground_defense_is_air_defense_desc: "The GDAD program is a slew of investments in research and military training to equip as well as prepare our ground forces with the ability to properly defend and withstand prolonged enemy air based combat units. The modern war is defined by the queen of the battlefield, that queen is the air force and with our nation not being so chatty with the outside world, we must seek out the ability to remedy this queen with an appropriate King maker."
 USB_america_warfare_beyond_the_grave: "Война за пределами могилы"
 USB_america_warfare_beyond_the_grave_desc: "Гробницкая война, эта новая доктрина, основанная на войне четвертого поколения, позволит нам сделать фильмы вроде «Красного рассвета» детской игрой. Ваше сопротивление вечно, ибо наша нация вечна."
 USB_america_the_new_identity_plan: "Новый путь вперед"
 USB_america_the_new_identity_plan_desc: "Мы не можем притворяться, что если мы вернем старые земли, то все будет хорошо. Но мы не можем также просто взять и закрыть нацию, как это сделал японский сёгунат, поэтому мы должны проложить новый путь. Наша цель — это новый путь вперед, новая идентичность, которой наши люди смогут гордиться."
 USB_america_war_plan_gray_coat: "Военный план \"Серое Пальто\""
 USB_america_war_plan_gray_coat_desc: "От Атлантики до Миссисипи наша судьба предначертана. Наш первый прямой план для достижения наших целей — это план бывшей Конфедерации. Это имеет наибольшее непрерывное соединение и приведет к обеспечению нашей великой консолидации."
 USB_america_the_southeast: "Юго-восток"
 USB_america_the_southeast_desc: "Близость, а также постоянные разработки вдоль побережья, позволят проводить целевые инвестиции и усилия по интеграции более плавно, чем в менее развитых штатах. Это всего лишь ступенька к будущему."
 USB_america_the_gulf_states: "Государства Персидского залива"
 USB_america_the_gulf_states_desc: "Побережье залива и непосредственно расположенные внутрь штаты — это сочетание развития и заброшенности. Мы позаботимся о том, чтобы эти штаты не чувствовали себя оставленными, направив усилия на инвестиции в инфраструктуру и способы лучшей интеграции и включения этих штатов в наш новый путь вперед."
 USB_america_war_plan_superior: "Военный план \"Супериор\""
 USB_america_war_plan_superior_desc: "Великие озера и бывшие штаты «пояса ржавчины» являются промышленным сердцем бывшей нации, а также нашим новым путем вперед. Мы обеспечим, чтобы промышленная мощь стала частью нашей идентичности, так же как мы закрепили сельскохозяйственную мощь юга как часть нашей идентичности."
 USB_america_the_automotive_states_and_some: "Автомобильные штаты и некоторые другие"
 USB_america_the_automotive_states_and_some_desc: "Ядро того, что когда-то было американским автомобилестроением, состоит из Мичигана, Огайо и Индианы, при этом Иллинойс тоже имеет свою долю. Однако, так как мы стремимся к постепенному и методичному способу интеграции, мы остановились на этих трех штатах и приграничном штате Кентукки. Эти штаты сталкиваются с различными проблемами, и, как следствие, мы будем использовать все возможные ресурсы для увеличения занятости и устранения текущих проблем, чтобы лучше адаптировать их к новому дому в нашей великой нации."
 USB_america_the_northwest_region: "Северо-западный регион"
 USB_america_the_northwest_region_desc: "Коалиция штатов, которая теперь будет составлять нашу прямую границу с Канадой и что бы ни развивалось за рекой Миссисипи, — это отличный способ продемонстрировать спортивное братство и единство через такие вещи, как охота и спорт. Мы будем использовать эти проверенные временем традиции, чтобы сплотить народы этих штатов, помочь им принять новую реальность и понять, что не все перемены всегда плохи."
 USB_america_war_plan_north_atlantic: "Военный план \"Северная Атлантика\""
 USB_america_war_plan_north_atlantic_desc: "Последний рубеж для нашей новой идентичности — это регион Великой Новой Англии. Нам нужно подготовиться к таким вещам, как городские бои, горные и джунглевые условия, если мы хотим эффективно бороться за эти штаты и вернуть их."
 USB_america_liberty_prime: "Либерти Прайм"
 USB_america_liberty_prime_desc: "Оплот свободы и символ свободы, которым является Статуя Свободы, штат Нью-Йорк — это очень уникальная и трудная задача. Будучи штатом гетто и мультикультурализма, мы должны научиться, изучить и понять не только то, что значит быть ньюйоркцем с культурной точки зрения, но и как заставить их понять, что между ними и нами нет существенного различия, когда речь идет о общей цели и будущем. Мы должны апеллировать к их уникальности и, вероятно, предоставить им уступки в вопросах автономии, чтобы обеспечить сплоченность и сотрудничество."
 USB_america_new_england_old_habits: "Новая Англия, старые привычки"
 USB_america_new_england_old_habits_desc: "Несмотря на культурное значение штатов Новой Англии, эти люди на самом деле не отличаются от остальной нации. Некоторые привычки и общие увлечения показывают, что даже когда мы разные, у нас все же есть много общего. Пора напомнить этим людям, что мы все товарищи, семья, и можем понять ошибки прошлого, чтобы создать лучшее будущее."
 USB_america_the_arcadian_identity: "Аркадийская судьба"
 USB_america_the_arcadian_identity_desc: "Настал момент, когда мы завершим эту главу, а также эту великую страницу в истории. Взяв идеи и идеалы прошлого, уроки старого времени, прошедшие и даже последние недели, мы выходим навстречу новому началу. Мы — яркая бабочка, готовая расправить крылья и взлететь в великое будущее наших мечт. Мы — Аркадия."
 USB_arcadia_path_desc: "[USB.GetFlag]§YСвободные Штаты Америки§! изменили название на §YАркадия§!"
 USB_formalizing_the_fighting_brigades: "Оформление боевых бригад"
 USB_formalizing_the_fighting_brigades_desc: "Пока мы продолжаем собираться, мы никогда не знаем, что может сделать противник. Поэтому мы создадим Федеральные бойцы как своего рода быстрое реагирующее подразделение, аналогичное Национальной гвардии. В конце концов, что-то лучше, чем ничего."
 USB_creating_infantry_reserves: "Создание резервов пехоты"
 USB_creating_infantry_reserves_desc: "Наша нация все еще восстанавливается, и хотя одна нога уже на выходе, не менее вероятно, что мы споткнемся, двигаясь другой ногой. Поэтому мы должны создать готовые резервные силы, чтобы подготовиться к будущему, каким бы оно ни было."
 USB_mobilizing_the_reserves: "Мобилизация резервов"
 USB_mobilizing_the_reserves_desc: "Пришло время начать активную оборону нашей нации. Давайте начнем мобилизацию, чтобы быть готовыми к предстоящим сражениям."
 USB_coal_wars_two_event.1.t: "Объединенные шахтеры мигрируют"
 USB_coal_wars_two_event.1.d: "Пока мы боремся за восстановление нации, многие шахтеры, как ныне работающие, так и бывшие, по какой-то причине мигрируют в штат Западная Вирджиния. Ассоциация объединенных шахтеров, переименованная из старой UMWA, начала организовываться и собираться на политических профсоюзных митингах. Мы еще не получили отклика от нынешнего президента, Сесила Робертса, но, судя по тому, как идут дела, мы скоро что-то услышим."
 USB_coal_wars_two_event.1.o1: "Что они, мигрирующие птицы?"
 USB_coal_wars_two_event.2.t: "Предложение Черной Жемчужины"
 USB_coal_wars_two_event.2.d: "Сегодня мы наконец-то услышали новости от нового UMWA. Президент обратился с просьбой и собрал значительную петицию, чтобы позволить повторное открытие нескольких шахт в Западной Вирджинии. Ожидается, что штат имеет более 20 миллиардов тонн угольных запасов, что, безусловно, будет полезным для обеспечения дешевой и доступной энергии для домов и предприятий, которые просто пытаются выжить. Однако шахты были закрыты из-за экологических проблем, так как многие из местных угольных месторождений на Восточном побережье содержат более высокий уровень серы. Так что вопрос стоит в том, хотим ли мы сохранить современный стандарт или снизить его ради ускоренного восстановления."
 USB_coal_wars_two_event.2.o1: "Чёрная Жемчужина снова сияет"
 USB_coal_wars_two_event.2.o2: "У нас есть стандарты по какой-то причине"
 USB_coal_wars_two_event.3.t: "Потоки финансирования"
 USB_coal_wars_two_event.3.d: "С переговорами, идущими успешно, и финансированием, наконец, направляющимся в Западную Вирджинию, шахтеры, которые мигрировали, уже начали работу по повторному открытию старых шахт. Это новая эра для штата, и это станет большим активом для дальнейшего развития, пока мы пытаемся стабилизировать экономику нации."
 USB_coal_wars_two_event.3.o1: "Это немного, но честная работа"
 USB_coal_wars_two_event.300.t: "Шахтеры протестуют против решения"
 USB_coal_wars_two_event.300.d: "После недавнего решения отклонить предложение Черной Жемчужины, многие шахтеры, покинувшие свои дома и переехавшие туда, где они надеялись на стабильную работу и будущее, начали организовывать протесты. Местные правоохранительные органы также отметили рост краж оружия, а также мелкие беспорядки. Нам нужно подготовиться к тому, чтобы справиться с этой ситуацией, поскольку из-за растущей дестабилизации штата мы не в положении вмешиваться напрямую."
 USB_coal_wars_two_event.300.o1: "Что они ожидали?"
 USB_coal_wars_two_event.301.t: "Свободное государство?"
 USB_coal_wars_two_event.301.d: "Без всяких размышлений о последствиях они это сделали. Местные беспорядки были направлены на те немногочисленные оружие и боеприпасы, что были в штате Западная Вирджиния, и в стремительном акте того, что некоторые называют \"властью толпы\", UMWA захватил контроль и провозгласил независимость Западной Вирджинии. Нам нужно мобилизовать все доступные силы и начать возвращать то, что по праву наше. Последнее, что нам нужно, — это чтобы кто-то еще на континенте посягал на нашу независимость."
 USB_coal_wars_two_event.301.o1: "Где я уже это видел?"
 USB_coal_wars_two_event.302.t: "Вторая угольная война"
 USB_coal_wars_two_event.302.d: "К оружию, братья и сестры земли, к оружию, говорю я! Ведь именно в этот день слепые разбойники из Вашингтона больше не будут решать нашу судьбу. Мы встанем и будем бороться, чтобы защитить наше право добывать и использовать ресурсы, которые нам дарует наша дорогая мать-земля. Давайте сплотимся и защитим эти земли, чтобы снова заставить сиять эту черную жемчужину."
 USB_coal_wars_two_event.302.o1: "К ОРУЖИЮ!!!"
 USB_coal_wars_two_event.303.t: "Мы идем!"
 USB_coal_wars_two_event.303.d: "Время пришло, и мы готовы как никогда. Мы отправимся в Паркерсберг и снова обеспечим контроль над штатом Западная Вирджиния."
 USB_coal_wars_two_event.303.o1: "Вперед, мужчины!"
 USB_coal_wars_raise_mining_regiments_tt: "Западная Виргиния сформирует §Y15§! дивизий горнострелковых полков."
 USB_america_focus_establishing_a_govt: "Establishing A Government"
 USB_america_focus_establishing_a_govt_desc: "Chaos consumes the streets, we must secure a central command of civil government if we are to even think of doing anything."
 USB_america_focus_creating_a_police_force: "Creating A Police Force"
 USB_america_focus_creating_a_police_force_desc: "With a civil government in place we've got to re-establish a civil order department. The department of Civil Affairs will be establish and plan out as well as establish strategic police stations to help quickly set up a rump police force to quell general disorder."
 USB_america_focus_organizing_the_militias: "Organizing The Militias"
 USB_america_focus_organizing_the_militias_desc: "Roving gangs still cause massive amounts of continual damage. How are we to create any sense of a new society if we can't even cease the destructive nature of these anarchists. We've got state guards, national guards and some remnants of the army, so lets try and piece this puzzle together and see what, if any kind of picture we'll make with it."
 USB_america_focus_rebuilding_the_economy: "Rebuilding The Economy"
 USB_america_focus_rebuilding_the_economy_desc: "It ain't much, but its honest work...and frankly any work in better than no work."
 USB_america_focus_backyard_battleground: "Backyard Battleground"
 USB_america_focus_backyard_battleground_desc: "With the chaos mostly over and the direct capital region being as stable as possible, we must seek to control the state of Maryland if we are to get anywhere any time soon. Investments in manpower, security and economy will be made wholesale to ensure the control and stability of the state."
 USB_america_focus_from_backyard_to_frontyard: "From Backyard To Frontyard"
 USB_america_focus_from_backyard_to_frontyard_desc: "With the economic and civil investments comes now the naturalization of law and order. Establishing civil services and law will be able to solidify our control of our backyard that is the state of Maryland. Thus we will turn it around into the frontyard example for which to unite our nation under the new banner of the Free States of America."
 USB_america_focus_the_old_dominion_state: "The Old Dominion State"
 USB_america_focus_the_old_dominion_state_desc: "Somehow we've been able to keep in our grasps the old Dominion state that is Virginia. Though many thought they would've left for the southerners, we must've done something good enough if they consider themselves apart of us. Nevertheless their state is archaic and disorderly like the rest of our \"nation\" is. So we must invest and rebuild it if we plan on bringing back into the fold some sense of a nation."
 USB_america_focus_norfolk_novelty: "Norfolk Novelty"
 USB_america_focus_norfolk_novelty_desc: "With civil order and economic stability assured we can bring the old dominion into a new light. For the future we unite, for the future we will and must defend our rights. For the Free States."
 USB_america_focus_black_pearl_state: "The Black Pearl State"
 USB_america_focus_black_pearl_state_desc: "From the ashes of coal country comes West Virginia. Known for being almost a statewide ghost town since its failure to fully diversify and modernize. Its fall from grace due to the state's more sulpheric coal becoming unusable in the modern age. We need to show more love to the state, give it life so it may live on within our union. Who knows, maybe one day people will call West Virginia a new Mountain Momma."
 USB_america_focus_parkersburg_perfection: "Parkersburg Perfection"
 USB_america_focus_parkersburg_perfection_desc: "The coal is mined once more, the economy is stable once more. The state of West Virginia is looking up to the sky for new aspirations and now we must guide them and help them by cleaning up the streets and restoring civil services. The Blue Ridges shall shine once more."
 USB_america_focus_the_commonwealth_state: "The Commonwealth State"
 USB_america_focus_the_commonwealth_state_desc: "Pennsylvania, a state of diversity in land and peoples. With a rich history in industry, railroading and American history itself, we must seek to ensure the stability and economic future of the Commonwealth if we are to make sure our union is whole."
 USB_america_focus_from_rust_to_shine: "From Rust To Shine"
 USB_america_focus_from_rust_to_shine_desc: "From the rusting decay of a post industrial society, to the shining beacon of a diversified digital dynamic, the Commonwealth state shall be a piece within the puzzle of our new great nation."
 USB_america_focus_delaware_dilemma: "Delaware Dilemma"
 USB_america_focus_delaware_dilemma_desc: "Just like in the revolutionary war, we must cross the Delaware river, only not to destroy an enemy, but to rebuild and bring in a friend."
 USB_america_focus_delaware_delight: "Delaware Delight"
 USB_america_focus_delaware_delight_desc: "From the economic ruins to the proud forefront of revival, we embrace another dear state back into our loving arms. Forward we move to a brighter future, to delight in the company we now share."
 USB_america_focus_the_jersey_jumpstart: "The Jersey Jumpstart"
 USB_america_focus_the_jersey_jumpstart_desc: "One of the farthest states within our realm, yet also the other half of our portion of the rust belt. We must revive the state and give her a jump if we are to properly set the course and have a complete nation once more."
 USB_america_focus_the_trenton_turnaround: "The Trenton Turnaround"
 USB_america_focus_the_trenton_turnaround_desc: "In the streets they cheer, for the trenton triumph has come here. The people of New Jersey will enjoy peace and new prosperity from not only our economic investment but from the civil order and care we shall create by reintroducing civil services."
 USB_america_focus_the_great_reclamation: "The Great Reclamation"
 USB_america_focus_the_great_reclamation_desc: "Through countless investments, careful planning and a true show of national determination. We now can truly take off the shackles of the old world, old ideals and look to a future, a future of freedom. We can truly now say with pride that we are, The Free States."
 USB_america_focus_the_elections_question: "The Elections Question"
 USB_america_focus_the_elections_question_desc: "With the nation finally reorganized enough to create real political discussion, we now face the reality of what do we want in these early days of our new nation. Some want elections and some just want stability, in the end of it only time will tell where the nation's ambitions lay."
 USB_america_focus_ban_elections: "Ban Elections For Now"
 USB_america_focus_ban_elections_desc: "We need to focus on the now, stop relishing the past and stop dreaming of the supposed future we need. What we need is stability and action to run the nation now, so we can be able to worry about our future later."
 USB_america_focus_establish_elections: "Establishing Elections"
 USB_america_focus_establish_elections_desc: "We must come to an agreement as a nation of what direction we want to take, as such new elections will be held and the people will choose the future."
 USB_america_focus_federalist_rightist: "Federalist Right Takes Victory"
 USB_america_focus_federalist_rightist_desc: "With the election debate answered the national referrendum has seen the Federalist Party win and be the standing government in the foreseeable future. But with this also comes the reality that the Anti-election rightist faction has secured dominance. We'll see what choices they make to lead this new beacon of hope."
 USB_america_focus_federal_taxes_when_needed_not_wanted: "Christan Sandsworth Act"
 USB_america_focus_federal_taxes_when_needed_not_wanted_desc: "The Christan Sandsworth Act is a new way to look at how to create and reform a tax code for a society. Special sessions to change or reform portions of the tax code can be called by either the president or the main leader of the two chambers of congress. This session will focus on one central topic within the tax code and either vote to change and or reform it or vote to dismiss the measure. The main principle now, is that legislatures and people are looking to make a tax code based on need rather than want. What does the nation and our society need now, rather than want whenever."
 USB_america_focus_federal_many_hands_act: "Hardy Workers Act"
 USB_america_focus_federal_many_hands_act_desc: "The HWA is a series of reforms to help jumpstart economic growth and job employment. While we're still in the quote, stone age, we can nevertheless work in jumpstarting the road to refinement. Our inefficencies will be matched by our tried and trusted workers. Understanding the need to make new from what is old our legislative reforms seek to instill a new form of patriotism through the work place. Work hard now so we can play even harder later."
 USB_america_focus_federal_societal_progress_act: "Societal Progress Act"
 USB_america_focus_federal_societal_progress_act_desc: "The SPA will seek to make changes in society become more of a people issue rather than a political issue. States and locality can pass, reform and create their laws which can enforce the continuance of civil order and lawful conduct. However laws which may be considered discriminatory or impartial towards one group or another can be appealed to their state and if need be the federal courts. The court cases will be documented extensively to allow for public awareness and to get as much info out on the estranging subject so as to be able to have not only a favorable court ruling if need be, but to have the citizens in the localities or states better understand the issue and preceed in a manner which is better for as many as possible."
 USB_america_focus_federal_liberty_businesses_act: "Liberty Businesses Act"
 USB_america_focus_federal_liberty_businesses_act_desc: "The old order was entirely to strict in its business rules. If we are to rebuild at any noteworthy pace we must allow those who want to lead be able to have the tools and ability to do so. As such this bill will allow for a government assistance program as well as restricting the regulations to just the basics of human care and expectation of a modern society."
 USB_america_focus_federal_clear_minds_act: "Clear Minds Act"
 USB_america_focus_federal_clear_minds_act_desc: "The CMA will be an independent commission for anti-corruption affairs to make sure the government will run as smoothly as possible. Many see this as a way to tackle fears that the new government is just like the old, nevertheless a new age is hear and so lets start strong shall we."
 USB_america_focus_federal_the_liming_act: "The Liming Act"
 USB_america_focus_federal_the_liming_act_desc: "The Liming Act is a sort of spin on the German government's debt blocking legislations for how they make budgets. Only we're taking it a step further. Quantitative Easing policies will only be within a 5% threshold of the current GDP figures for that fiscal quarter. Any QE program created must be put towards a bill or legislation which in not covering no more than five distinctive things. Meaning you can't have a bill that has a supposed hundred different things to allocate for but only have say $50 to actually allocate towards."
 USB_america_focus_federal_industrial_standards_act: "Industrial Standards Act"
 USB_america_focus_federal_industrial_standards_act_desc: "The ISA will look to create a new and modern standard for which we should be starting at when it comes to economic development and the businesses and industries we attempt to create. It is one thing to compete with the globe, its another to actually care and compete with one's self."
 USB_america_focus_federal_remechanization_act: "Re-Mechanization Act"
 USB_america_focus_federal_remechanization_act_desc: "Our population despite the shrinking state of it is still vast. We can do so much more to help our population by getting back on top of modern forms of mechanization and automation. The future truly is now and we must seize this future for not only us but the very people we serve."
 USB_america_focus_federal_scraping_up_defense_industries: "Scraping Up Defense Industries"
 USB_america_focus_federal_scraping_up_defense_industries_desc: "While we may not be as strong as we once were, we gotta start somewhere. Piecing together any remnants of our defense industry will allow us to at least somewhat supply whatever army we have left."
 USB_america_focus_federal_reset_act: "The Reset Act"
 USB_america_focus_federal_reset_act_desc: "With the nation having shut down and reset itself to practically an infantile state, we must seek out a new start to our power grid. The old system was cumbersome, woefully out of date and not to mention painfully open to attacks. The Reset Act will create a new baseline for planning, building and securing our new power grid as well as securing the ability to expand it when the nation's needs arise."
 USB_america_focus_federal_appalachian_act: "Appalachian Act"
 USB_america_focus_federal_appalachian_act_desc: "The Appalachian Act is a government investment initiative to revitalize and get back on track with the resources of the land for which we still luckily hold on to. With this in mind we do hold a significant part of the Appalachian Mountain ranges and as such we must understand, survey and bring forth the minerals and ores so our nation may prosper and strive to better again what was once lost."
 USB_america_focus_military_distinctions_act: "Military Distinctions Act"
 USB_america_focus_military_distinctions_act_desc: "The MDA is a starter investment bill to directly fund, standardize and make distinctive the army of the Free States. These new standards in training, planning and organization as well as more or less beginning to standardize our military industrial power will allow for at the very least us to defend our homes if we were to be invaded in the near future."
 USB_america_focus_naval_distinctions_act: "Naval Distinctions Act"
 USB_america_focus_naval_distinctions_act_desc: "Following on the heels of the MDA the NDA seeks to revitalize whatever ships, servicemembers and installations we have left from the pre-divided days. Its not much in terms of a start, but with our growing industry and our nation coming back to stable means we'll surely get there."
 USB_america_focus_national_pride_initiative: "Free States Day"
 USB_america_focus_national_pride_initiative_desc: "The National Pride Initiative is a national holiday being dubbed as Free States Day, this day which is both a bank holiday as well as a general national holiday that everyone will have off except vital services which will only be allowed to work in shifts of four hours on this specific day. The point is to celebrate the progress we have made as a nation and to give back to our people. The mandate is to essentially give as many people in the nation a dedicated day off for all possible and plausible."
 USB_socialist_statist_victory: "Free Socialist Party Statist Faction Wins"
 USB_socialist_statist_victory_desc: "The conclusion to the national poll is a victory to the Free Socialist Party, not only that but their Statist oriented faction. This faction is focused on more central authority and national unity as apart to their \"Anarchist\" counterparts. Nevertheless we'll see what this supposed Red Dawn has to provide and hopefully a brighter future will be in store for the citizens of this new great nation."
 USB_socialist_statist_socialized_industry: "Socialized Industry"
 USB_socialist_statist_socialized_industry_desc: "The public has lost its way and as such we must sponsor and ensure employment and industrial growth. This way not only do we understand more directly the economic condition but the effects our programs have on people so we can adjust to better help them."
 USB_socialist_statist_reformed_welfare_state: "Reformed Welfare State"
 USB_socialist_statist_reformed_welfare_state_desc: "A welfare state is a like a parent. There to help you when you're down and guide you to better yourself. The old welfare states focus more at only just catching people, where as our reformed welfare will not only catch but stand them up and get them back on the journey of life. Through adapting funding as well as prioritization of programs for reintegration we'll make sure our programs pay for themselves."
 USB_socialist_statist_socialized_education: "Socialized Education"
 USB_socialist_statist_socialized_education_desc: "Uniformed public education. This is the standard and foundation we will make so we uplift our people as well as show we can not only create the standards, but break and raise them."
 USB_socialist_statist_the_peoples_army: "The People's Army"
 USB_socialist_statist_the_peoples_army_desc: "We are surrounded by nations which fear our ideas and our ideals. Haunted by the spectre of Authoritarian Socialism which has plagued history and given the economic model its stigma, we must look to defend our people, our homes and our very ideals which make us a proud and strong nation."
 USB_socialist_statist_tax_brackets_act: "The Tax Brackets Act"
 USB_socialist_statist_tax_brackets_act_desc: "The TBA is a comprehesive legislation to overhaul and set the modern standard of what it means to have a progressive tax code. The basics of tax brackets is that there are now 16 tax brackets which have uniformed differences in monetary scope as well as the percentage increases are smoother and more literally progressive. The final bracket and of course the highest is anything over $250,015 taxed at 40%. While yes this does sound steep we must look to the actual difference in real proportional value of the average person's income being taken via taxes. As such this is why we must have such a smooth tax code to ensure this true form of equality and shared societal contribution towards developing our economy and ensuring the schools, emergency services and so forth our looked after and funded properly."
 USB_socialist_statist_millennium_labor_reforms_act: "Millennium Labor Reforms Act"
 USB_socialist_statist_millennium_labor_reforms_act_desc: "The MLRA will fundamentally change how labor relations as well as laws are passed. Though the legislatures will officially pass and sign bills into laws, a joint union and business relations committee will be established having equal representation between unions and industrial leadership coorisponding to the established unions. This committee will work together to centralize complaints and ideas to better not only the workers lives, but to balance that workers needs with proper economic backing as well. After all, half compromising is no real compromise."
 USB_socialist_statist_modern_geology_act: "Modern Geology Act"
 USB_socialist_statist_modern_geology_act_desc: "The Modern Geology Act is a government investment initiative to build up the raw materials industries as well as boost the baseline of our economy. Through targeted research and geological surveys we'll set up new mines and controlled forestry industries to allow a surplus of raw materials wherein we can create a modern economy."
 USB_socialist_statist_modern_marxism: "Modern Marxism"
 USB_socialist_statist_modern_marxism_desc: "In the new millennia tech and technology is the prime luxury to those in the civilian, military and all sorts of economy sects and walks of life. As such we must ensure a dedicated part of our economy is geared towards the tech sector and innovations."
 USB_socialist_statist_national_security_act: "National Security Act"
 USB_socialist_statist_national_security_act_desc: "The NatSec Act is legislation dedicated to ensure the security and safety of our nation and its citizens. A federal agency known as the Internal Security Division will coordinate and help with training, regulating and distributing federal funding for local law enforcement agencies. Uniformity and standards are what is needed to ensure the integrity and safety of our nation and its ideals."
 USB_socialist_statist_manufacturing_investments: "Manufacturing Investments"
 USB_socialist_statist_manufacturing_investments_desc: "With little to no domestic manufacturing we must invest in developing this critical sector of our economy if we are ever to grow and look to our goals."
 USB_socialist_statist_department_of_anticorruption_affairs: "Department of Anti-Corruption Affairs"
 USB_socialist_statist_department_of_anticorruption_affairs_desc: "The DACA is a an independently created and federally sanctioned institution wherein anti-corruption investigations and general auditing of the government can be conducted. The department while federally sanctioned in law, is not actually apart of the federal government and has no real control over it. This disconnect will allow for the maximized effectiveness in conducting government audits and ensuring the best form of transparency for our citizens and future administrations. Lets try and not repeat our past huh."
 USB_socialist_statist_modern_agrarian_reforms: "Modern Agrarian reforms"
 USB_socialist_statist_modern_agrarian_reforms_desc: "The world needs food, whether its our own people or those in less fortunate areas and or nations of the world. Therefore we must fine tune and revolutionize our agriculture industry to better suit our domestic needs and even help those in the world. This growth and dependency will allow us also to experiement and increase fuel diversification through bio-fuel programs. Ethonol has always been a bit of a red headed step child in the fuel world and as such why not give it the care and love it needs to make it a better version of itself."
 USB_socialist_statist_coastal_security_act: "The Coastal Security Act"
 USB_socialist_statist_coastal_security_act_desc: "The CS act is limited investments into rebuilding and or at the very least bringing back online any naval personnel and naval vessels which we still have under our control. Though nothing of grand amount, its still enough to have a start considering we don't have a continents worth of coastline to worry about anymore."
 USB_socialist_statist_energy_conservations_act: "Energy Conservations Act"
 USB_socialist_statist_energy_conservations_act_desc: "The legislature has recently proposed a bill to invest in dedicated energy R&D projects as well as better streamlining and growing our electrical grid. We hope that in the end we'll be able to not only produce more energy for our nation's needs, but be able to utilize this growing demand in a efficient way. In other words, shrink our demand whilst it grows, a sort of balance if you will."
 USB_mid_atlantic_isolationist_victory: "Mid-Atlantic Isolationist Faction Victory"
 USB_mid_atlantic_isolationist_victory_desc: "The MAP or Mid-Atlantic Party has seized the victory in the national poll. This faction however is a strong isolationist faction wherein the idea of expansion is seen as pointless waste of human and natural resources. While many are wondering if they even care that the old republic fell, more are just tired of the struggling and reset to their daily lives. So for now peace is understood and prosperity is the goal. Glory to the Mid-Atlantic States of America."
 USB_mid_atlantic_self_determination_act: "Self Determination Act"
 USB_mid_atlantic_self_determination_act_desc: "The SDA is a bill which will help solidify our national ethos. We wish to live, thrive and cooperate with those in the world. While we do miss the old days, we must look to new mornings and prospects if we are to truly go anywhere in life's big game."
 USB_mid_atlantic_raw_materials_act: "Raw Materials Act"
 USB_mid_atlantic_raw_materials_act_desc: "The government has recent passed and investment scheme to grow and prop up our raw materials and primary resource industries. In order to build up we must have a foundation for which to build upon, this foundation will be marked by our primary resource sectors and ability to have the materials needed to grow our manufacturing capabilities."
 USB_mid_atlantic_dedicated_automation_investments: "Dedicated Automation Investments"
 USB_mid_atlantic_dedicated_automation_investments_desc: "In order to rebound our economy into the modern age, we must seek out dedicated investments in terms of automations to allow our manufacturing to be competitive with regional powers."
 USB_mid_atlantic_atlantic_education_initiative: "Atlantic Education Initiative"
 USB_mid_atlantic_atlantic_education_initiative_desc: "The AEI is an education funding bill to grow our education system's ability to teach and raise the standards of knowledge our citizens will be equipped with in life."
 USB_mid_atlantic_atlantic_care_act: "Atlantic Care Act"
 USB_mid_atlantic_atlantic_care_act_desc: "The Atlantic Care Act is a healthcare betterment budget to standardize as well as increase both the capacity and standards for which healthcare is administered to our general population. Both public and private option are to be available with the commonality of regulations into the overall tendancy of administration overbloating problems. Now people can know that their money is going to their care instead of only administrators and paper pushers."
 USB_mid_atlantic_department_for_transparency: "Department Of Transparent Affairs"
 USB_mid_atlantic_department_for_transparency_desc: "The DoTA will be an independent government agency that will be able to investigate the government for corruption and general misconduct in terms of carrying out their duties and responsibilities as governmental leaders."
 USB_mid_atlantic_tech_development_grants: "Tech Development Grants"
 USB_mid_atlantic_tech_development_grants_desc: "The new millennia brings new industries, as such a rising star is the tech sector. The tech sector is a vital growth spot for any modern economy and we must ensure we have our own. Therefore development grants will be relinquished to business ventures looking to create new tech sector businesses in order to not only boost our economy but our societal integration with these ever growing inovations in goods and services."
 USB_mid_atlantic_blue_ridge_act: "Blue Ridge Act"
 USB_mid_atlantic_blue_ridge_act_desc: "Resources, simply put we must secure more domestic supplies if we are to be a true new pillar in this hemisphere."
 USB_mid_atlantic_naval_securities_act: "Naval Securities Act"
 USB_mid_atlantic_naval_securities_act_desc: "We are a small nation now and as such we must ensure the defense of our coastal waters to ensure the security of our national sovereignty."
 USB_mid_atlantic_guardian_angels_act: "The Guardian Angels Act"
 USB_mid_atlantic_guardian_angels_act_desc: "The modern queen of the battlefield is the air force. This key understanding must be invested into if we are to ensure our ability to be a free and independent nation in this new age."
 USB_mid_atlantic_prospectors_initiative: "Prospectors Initiative"
 USB_mid_atlantic_prospectors_initiative_desc: "Autarky...autarky is the word for which the modern age shuns and scolds as backwards. Though its core principle of isolation is, the reality is that a healthy nation is one which can be self reliant. Therefore we are creating a new Homestead Act known as the Prospectors Initiative. Through regulations related to the extraction of resources, families and or individuals that are willing to settle lands of up to five acres will be able to own that land in return for a contribution in the natural resources which may occupy it to the national economy."
 USB_mid_atlantic_planned_policing_program: "Planned Policing Program"
 USB_mid_atlantic_planned_policing_program_desc: "The PPP is a joint federal and local initiative to galvanize public understanding and values of the police forces of the nation. Community outreach programs as well as conventions and so forth will be hosted and planned to allow for the public and the police to better understand as well as genuinely appreciate each other. In short this sometimes gravely misunderstood nature of what it means to not only enforce the law but what it means to be a law abiding citizen. Unity, Not Division."
 USB_mid_atlantic_energy_advancements_act: "Energy Advancement Act"
 USB_mid_atlantic_energy_advancements_act_desc: "The Energy Advancements Act is a complex spending package. Research grants into energy production and consumption, investments into grid modernization as well as regulations towards setting new standards in how we move forward in dealing with future energy demands."
 USB_mid_atlantic_the_true_green_way: "The True Green Way"
 USB_mid_atlantic_the_true_green_way_desc: "Nuclear energy, the future of mass production of energy itself next to of course harnessing the sun itself. But nuclear energy is always such a flimsy thing in the political world. Fearmongers hold onto the mistakes of the past, detracting any sort of nuances. Nuclear hawks tought its energy benefits but forget the nuances in things like planning and the potential side effects of militarization. Nevertheless, we move forward in making key investments into nuclear power production. We must show the world the best way forwards is to not be stuck in the past, or dwell on the present."
 USB_nsp_militarist_faction_victory: "National Service Party Militarizes Victory"
 USB_nsp_militarist_faction_victory_desc: "The poll has come back and the NSP or National Service Party has come out on top. However many are not happy about such an agreement and so the NSP's Militarist faction has used this as a way to win the party struggle. Now leading members of the NSP are in other words \"Militarizing Victory\", wherein the military, the people who serve and just the idea of security itself is the victory which the people have voted for. While some fear the messaging can be seen as fearmongering, others are just looking to move forward and rebuild what was once lost. Let's See what they can do has become the silent saying."
 USB_nsp_meritocracy_act: "The Meritocracy Act"
 USB_nsp_meritocracy_act_desc: "The Meritocracy Act or some also call the Merit Act, is a comprehensive legislation which reforms and overhauls the appointment and vetting process of individuals seeking to be in leadership positions in the government be it federal, state or local. The process focused on extensive background checks in things like personal creed, experience as well as proven accomplishments and deeds within their job fields will allow for us to pave the way for a true technocratic approach to government and administration. The reviewing departments will be independent comissions with people outside of any direct or indirect affiliation with said reviewed individuals to keep transparency and justness of the review in the highest possible of standards."
 USB_nsp_industrial_investments: "Industrial Investments"
 USB_nsp_industrial_investments_desc: "To ensure domestic security a strong civilian economy is just as good as a strong military economy."
 USB_nsp_military_investments: "Military Investments"
 USB_nsp_military_investments_desc: "We must be ready for anyone of our neighbors to get a funny idea and try to subdue us. As such a host of limited investments to jumpstart the military economy and the armed forces readiness are well overdue."
 USB_nsp_maritime_investments: "Maritime Investments"
 USB_nsp_maritime_investments_desc: "Our coast is vast and must be defended, on the other hand these initial investments will boost the civilian economy in terms of trading and spreading awareness to our cause."
 USB_nsp_the_national_arteries_act: "The National Arteries Act"
 USB_nsp_the_national_arteries_act_desc: "The NAA is a mass infrastructure investment plan to revitalize and update the practically crumbling state of our national infrastructure. We must set a standard of throughput if we are to connect our nations' people as well as its economy and military readiness to the forefront of crisis management standards for which we will set new records for said standards."
 USB_nsp_department_of_internal_investigation: "Department OF Internal Investigation"
 USB_nsp_department_of_internal_investigation_desc: "The DII is a focused anti-corruption affairs agency to ensure the stability and fortitude of our meritocracy. We must create the ethos of selfless service both in military and civilian jobs if we are to ensure the longevity and stability of our nation."
 USB_nsp_national_high_command: "National High Command"
 USB_nsp_national_high_command_desc: "With the civilian and military parts of our society being so different we must learn to better integrate and make whole these divisions of reality. Therefore as well as investments into the national security of the capital region of our nation a new reorganization of the leadership structure of the nation will be implemented. Our Commander in Chief will now have the combined title of Marshal of Society, this title shortened to simply Marshal, will unify the understanding that civilian and military affairs are but one unifying matrix to the cohesion and survival of our fair and small nation."
 USB_nsp_mini_steel_belt: "Mini Steel Belt"
 USB_nsp_mini_steel_belt_desc: "With domestic priority our number one priority we must secure the cornerstone of modern building and manufacturing support. The Mini Steel Belt investment program will see wide investments in West Virginia and Pennsylvania to polish off and renew what little of the \"Rust Belt\" we have left."
 USB_nsp_militarizing_society: "Militarizing Society"
 USB_nsp_militarizing_society_desc: "Voltaire once said that the nation of Prussia was not a state with an army, but rather an army with a state. To this we say this should be a statement of reality itself. No society needs a military and yet a military doesn't earnestly need the society. With this in mind we must unite in full cohesion the military and society itself. Work ethics, education and the further development of technology as well as governance can and will be organized like it was the military itself. Encouraging the full merits of a meritocracy, the strive of betterment to oneself as well as the body of the society at large."
 USB_nsp_energy_investments: "Energy Investments"
 USB_nsp_energy_investments_desc: "With our mobilization of the economy as well as the rebuilding of our military it is in our best interests to ensure the energy needs of not only our people but our military are met. While these may not be immediately solved, this investment and research grants will allow for better development of new efficient methods of not only energy production but of energy consumption."
 USB_nsp_top_priority_budgeting: "Priority Budgeting"
 USB_nsp_top_priority_budgeting_desc: "We hold control of several ports and significant naval dockyards leading to a naval influenced direction. As such with our coast size, our growing trade and the potential incursion of foreign adversaries, we must set up a priority system in our budgeting to ensure the defense of our nation and its people."
 USB_nsp_expanding_jersey_foundries: "Expanding The Jersey Foundries"
 USB_nsp_expanding_jersey_foundries_desc: "The foundries and metalurgic mills of New Jersey produce a diverse set of light metals. These light metals are critical for civilian as well as military expansion and as such we will invest into New Jersey all around to make it more on par with our growing demands as a nation."
 USB_nsp_defensive_expenditure_warfare: "Defensive Expenditure Warfare"
 USB_nsp_defensive_expenditure_warfare_desc: "With our backs to the sea already given our geographic location, we must ensure the survival of our nation. With this in mind R&D as well as budgeting for the army has been set to a strict defensive mindset. Understanding that our adversaries are many we must be vigilent in holding the line while also being able to hold onto the means of war production. As such the development of a new doctrine of warfare is our highest priority from here on out we will be developing what is known as Defensive Expenditure Warfare."
 USB_nsp_the_new_identity: "The New Nation"
 USB_nsp_the_new_identity_desc: "With the solidification of our nation, its people, military and ethos. We must come up with a new name to ensure this new found identity. For we are no longer simple the Free States of America, we are the Mid-Atlantic Union."
 USB_america_focus_federalist_liberals_win_election: "Federalist Liberals Win Election"
 USB_america_focus_federalist_liberals_win_election_desc: "The election results are in and it looks to be that the Federalist Party has secured a victory. This victory also seems to have shifted the party balance into a more liberal apparatus as the main supposed conservative members were anti-election. One of the previous members stating \"Elections are a distraction to the national survival\", nevertheless the people look forward to any change, especially a return to hopeful normalcy."
 USB_states_focus_fed_left_national_works_administration: "National Works Administration"
 USB_states_focus_fed_left_national_works_administration_desc: "The NWA is a new dedicated government administration to help economic building. Through planning of infrastructure and government based economic ventures, this should in turn reduce unemployment as well as be a slight stimulant to the economy even in down times."
 USB_states_focus_fed_left_industrial_development_committee: "Industrial Development Committee"
 USB_states_focus_fed_left_industrial_development_committee_desc: "With the establishment of the IDC, the nation's industrial development will be able to have a purely private sector format with the additional help of government programs to allow for the diversity of not only the industries present but of where they'll be established as a way to ensure a balanced manner to not leave one community, county or perhaps even a whole state lagging behind from its contemporaries."
 USB_states_focus_fed_left_department_of_innovation: "Department Of Innovation"
 USB_states_focus_fed_left_department_of_innovation_desc: "The DoI or Department of Innovation is a federally sponsored research and development institution to fund and work with private research firms in innovation and general scientific advancements in fields critical to the raising of the the national standard of living. As such with substantial funding we will make up for this national setback and set forth the pathway to the future."
 USB_states_focus_fed_left_education_standards_act: "Education Standards Act"
 USB_states_focus_fed_left_education_standards_act_desc: "The ESA is a bill which will set the baseline expection within the nation's education system. No more of the old system where almost every county had its own variation of how things were taught to achieve the supposed sme end results. From now on the curriculum will be standardized and expected to be upheld in for each respective education level, regardless of where the institution is located within the nation."
 USB_states_focus_fed_left_automation_advancements_act: "Automation Advancements Act"
 USB_states_focus_fed_left_automation_advancements_act_desc: "The AAA will see direct funding into the expansion and standardizing industry practices in terms of acquiring and implementing different technologies which automate the production process. In short, more investments to make more from less so we can have more to make more."
 USB_states_focus_fed_left_the_true_deal: "The True Deal"
 USB_states_focus_fed_left_the_true_deal_desc: "The True Deal is a massive economic package looking to invest, diversify through available and found natural resources, as well as create a central infrastructure network in the mostly central part of the nation. Industry, infrastructure and new mining initiatives will pave the way to the future for which we wish to have for our people. This really is a True Deal for the citizens."
 USB_states_focus_fed_left_department_of_internal_investigation: "Department Of Internal Investigation"
 USB_states_focus_fed_left_department_of_internal_investigation_desc: "The DoII or more commonly known as the Oligarch Obliteration Bureau, is an independently formed anti-corruption agency tasked with regularly investigating and keeping in check those who are apart of the federal government. The independent body is made up of elected individuals based on three main criteria. 1. Being some kind of administration and or investigation background. 2. Being politically apathetic or of a non-voting background to ensure the integrity of the institution. 3. Representatives must be balanced within all main social classes from each respective state to ensure diversity in perspective to understand the simplist and at the same time most complex ways one can cause corruption. This institution will be a cornerstone in ensuring the Free, in Free States of America."
 USB_states_focus_fed_left_old_power_is_still_power: "Old Power Is Still Power"
 USB_states_focus_fed_left_old_power_is_still_power_desc: "With our economy coming back online and our demands outpacing our production we must seek out cheap ways to produce power if we are to stay ahead of the growth."
 USB_states_focus_fed_left_new_power_is_balanced_power: "New Power Is Balanced Power"
 USB_states_focus_fed_left_new_power_is_balanced_power_desc: "With the turn of the millennia, the investments and development of renewable energy generation technologies has been astounding. We must diversify our generation and use these renewables to instill the power we demand, what we will need in the future and if things go well enough. We just might be able to use this excess energy to our advantage."
 USB_states_focus_fed_left_future_power_is_future_proofing: "Future Power Is Future Proofing"
 USB_states_focus_fed_left_future_power_is_future_proofing_desc: "The future is both now and beyond, if we are to innovate we must seek to at least expose and understand the energy production means associated with such. Nuclear fission will fit into our well rounded means of energy production and be a great boost to our economy overall. Not only that but with proper investments in R&D, who knows, maybe Fission will go our and Fusion will be the new future. Only time shall answer that question."
 USB_states_focus_fed_left_the_substations_act: "The Substation's Act"
 USB_states_focus_fed_left_the_substations_act_desc: "This bill is a comprehensive research and infrastructure investment scheme to ensure the efficiency as well as the proctections needed with such rapid growth and expansion of our electircal grid. All in all we must not only grow our power generation needs, but we must be more efficient in how we consume said power."
 USB_states_focus_fed_left_the_self_defense_act: "The Self Defense Act"
 USB_states_focus_fed_left_the_self_defense_act_desc: "Despite its name, the SDA is not a civil law change but rather a military, more specifically an army investment and development fund. Our current situation grows more weary with each passing day. Foreign powers wish to seek out and take what we have rightfully created, well we will ensure that does not happen."
 USB_states_focus_fed_left_freecare_program: "The Freecare Program"
 USB_states_focus_fed_left_freecare_program_desc: "Freecare is our way of rolling out a form of universal welfare system. Outlining the needs of our people, we will invest in both domestic and acquiring foreign medical professionals and allow for a four tiered system of levels of care needed for citizens. These levels of care will allow the administration side of things to organize how quickly and efficiently care can be distributed to a growing population by understanding the severities of illnesses and injuries along with those professionals on the ground can sign off on a potential increase in level at the current time if a patient suddenly changes in terms of condition. Afterall, nothing is certain in life, but death itself."
 USB_states_focus_fed_left_mid_atlantic_fleet: "Mid-Atlantic Fleet"
 USB_states_focus_fed_left_mid_atlantic_fleet_desc: "Despite the fact we do hold a significant amount of the former ships of the old order, our position is tenuous at best. Most naval yards and facilities are run down and in need of repairs and renovations to get back on par with even a nation like say Australia or Portugal. Therefore a significant naval fund will be used to dedicate this overhaul to allow for the unmothballing of our current naval state."
 USB_america_focus_anarchists_fsp_anarchist_victory: "FSP \"Anarchists\" Collectivize Victory"
 USB_america_focus_anarchists_fsp_anarchist_victory_desc: "In a shocking turn of events the Free Socialist Party has come out on top, being comprised of various flavors of red the recent shift in pro-elections has seen the party shift from a hardline Marxist/Authoritarian Socialism, to a now more balanced, be it confusing balance, but a balance of European styled Social Democrats and what some joke as \"Pseudo Anarchists\", for their ability to be more cooperating in a system that involves a state. Nevertheless the election was won by the FSP and now it is only the future and party leadership to determine the future of our nation."
 USB_america_focus_anarchists_communalcare_program: "CommunalCare Program"
 USB_america_focus_anarchists_communalcare_program_desc: "The CCP, ironic huh, is a dedicated welfare program system that relies on subsidized funding of locally created care facilities wherein the locals for that town and or municipality get care from people within that municipality. Of course there will always be a need for people to help those in need, but the essence of the facility is that it was founded by locals to care for local. Think eldercare and child care, after all didn't Jesus say Love Thy Neighbor."
 USB_america_focus_anarchists_red_rose_health: "Red Rose Health"
 USB_america_focus_anarchists_red_rose_health_desc: "The RRH program is a dedicated healthcare program to create the steps towards a universal healthcare system. Assessing what each state needs, these state by state branches are able to divide their control into regional subsets and allow for the counties to give proper feedback. In turn we hope to set up a proper command like structure to allow for the least paperwork and the ease of control. Since the failures of most UH type programs goes from more administrators than healthcare personnel."
 USB_america_focus_anarchists_syndicate_industries: "Syndicate Industries"
 USB_america_focus_anarchists_syndicate_industries_desc: "The trade unions are a significant part of our voting base and a great influence in the old rust belt states. As such we must develop and ensure the trade unions with real jobs and future development if we are to keep our position."
 USB_america_focus_anarchists_social_tech_incorporated: "Social Tech Incorporated"
 USB_america_focus_anarchists_social_tech_incorporated_desc: "The modern age requires modern industries, the tech and services industries are the future. As such we will invest and diversify our economy to grow our abilities to not only increase the quality of life of our citizens but also export these things and gain foreign attention and investment."
 USB_america_focus_anarchists_community_defense_act: "The Community Defense Act"
 USB_america_focus_anarchists_community_defense_act_desc: "With the world being a dangerous place and foreign powers looking to exploit our very timid position. We must seek out a way to defend ourselves and thus we must look to not only the army but to the communities of our nation to want to defend their homes and families."
 USB_america_focus_anarchists_civil_affairs_administration: "Civil Affairs Administration"
 USB_america_focus_anarchists_civil_affairs_administration_desc: "The CAA is a dedicated body to dealing with auditing and anti-corruption affairs. We must instill the highest standard of ethics to ensure the people as well as the world recognizes we are a real government, a real nation and a genuine society to be respected and helped."
 USB_america_focus_anarchists_red_ducation_act: "Red-ducation Act"
 USB_america_focus_anarchists_red_ducation_act_desc: "The Red-ducation Act is a large education investment to standardize and improve what we teach, why we teach and the overall goal of what our education system is in terms of the betterment of our society."
 USB_america_focus_anarchists_foreign_relations_act: "Foreign Relations Act"
 USB_america_focus_anarchists_foreign_relations_act_desc: "With our government beign aligned with a lot of those nations across the pond per say. We can prioritize policing and government budgeting to ensure trade deals and worker exchange programs are both secure and beneficial to both parties."
 USB_america_focus_anarchists_mineral_expansion_act: "Mineral Expansion Act"
 USB_america_focus_anarchists_mineral_expansion_act_desc: "The MEA will see our mineral and resource extraction industries better. Through introducing new tech and regulations as well as dedicated government grants to expand or start new mineral operation, we will ensure our national success into as best as well can to sustain our domestic needs."
 USB_america_focus_anarchists_the_interstate_renewal_act: "The Interstate Renewal Act"
 USB_america_focus_anarchists_the_interstate_renewal_act_desc: "The interstate system is the veins of our nation's economy and social cohesion. We must clean, clear and build stronger and more reliable veins if we are to have a strong and healthy nation."
 USB_america_focus_anarchists_consumer_industry_advancements: "Consumer Industry Advancements"
 USB_america_focus_anarchists_consumer_industry_advancements_desc: "To ensure our domestic quality improvement on top of our economic competitiveness, we must invest and ensure the implementation of new advancements in automation. On top of that we must find new techs to include in our industries to increase not only the quantity yet keep the product's quality as well."
 USB_america_focus_anarchists_parker_harrison_act: "Parker-Harrison Act"
 USB_america_focus_anarchists_parker_harrison_act_desc: "The Parker-Harrison Act is a national investment into our energy needs. Investments in new power plants, technologies as well as regulations and innovations into efficiencies related to consumption of said energy. We will secure the energy needs of our citizens and raise the standards of what a modern nation should have."
 USB_america_focus_anarchists_family_unity_program: "Family Unity Program"
 USB_america_focus_anarchists_family_unity_program_desc: "The FUP is a program and tax relief for families of dedicated size of three children or more. This ensures the domestic family unit be strong while giving them the resources to keep that unity so that our human capital will be for the betterment of our nation. For as our economy grows our people must be able to grow and live the lives they want to live."
 USB_america_focus_anarchists_army_readiness_act: "Army Readiness Act"
 USB_america_focus_anarchists_army_readiness_act_desc: "The national preservation is one of our top priorities to keep and hold what is dear to our way of life. As such investing in our military and specifically our army to bolster the defense of our nation and its people from foreign foes."
 USB_mid_atlantic_identitarian_victory: "Mid-Atlantic Identity Win Election"
 USB_mid_atlantic_identitarian_victory_desc: "The MAP or Mid-Atlantic Party has won the election to ironically not many people's surprise. What is surprising is that the party has shifted more into an identitarian party with the number one goal of creating an Atlantic States identity. But for now they are content with the Mid-Atlantic identity and holding as well as securing the homefront first and formost."
 USB_mid_atlantic_identitarian_rust_to_riches: "Rust To Riches"
 USB_mid_atlantic_identitarian_rust_to_riches_desc: "A third of our nation is apart of the old rust belt....these states use to be the defining prowess of the 20th century's industrialism. Now they lay there, dead, decaying and suffering. Well no more, we will rebuild, we will repair, polish and make these rusting states into shining beacons of our nation."
 USB_mid_atlantic_identitarian_the_old_black_gold: "The Old Black Gold"
 USB_mid_atlantic_identitarian_the_old_black_gold_desc: "The state of West Virginia is a state suffering by the passage of time itself. With the situation as it is we must develop and ensure that this \"old gold\", be used in the new age. Research and investments into an overhaul like development of the state will allow it to florish and prosper once more."
 USB_mid_atlantic_identitarian_naval_novelty: "Naval Novelty"
 USB_mid_atlantic_identitarian_naval_novelty_desc: "The decay of our naval readiness is something which opens literally the seas to have us attacked. We will refurbish and develop our navy and naval industries if we are to secure our coastline at all."
 USB_mid_atlantic_identitarian_national_defense_act: "National Defense Act"
 USB_mid_atlantic_identitarian_national_defense_act_desc: "The National Defense Act is an army development and readiness funding as well as legislation to improve our abilities to defend our nation on land. Things like the national guard as well as the idea of a mandatory service period have also been proposed but uncertain if we should go that far so quickly."
 USB_mid_atlantic_identitarian_aviation_development_fund: "Aviation Development Fund"
 USB_mid_atlantic_identitarian_aviation_development_fund_desc: "The ADF is legislation dedicating defense spending to the development and modernization of our air force... Something which has fallen down the worst in terms of near disorganization and lack of knowledge to even continue the service. Everyone knows how to play soldier and sailor, but flying a plane of any kind requires a proper physical standard and ability to learn and understand the equipment."
 USB_mid_atlantic_identitarian_military_influenced_education: "Military Influenced Education"
 USB_mid_atlantic_identitarian_military_influenced_education_desc: "The education system is a system to teach and prepare the youth and future generations for the supposed \"Adult World\". As such our world is not so bright and we must have a small but highly dedicated influence and exposure of the military and military life through programs and or classes like the JROTC or Junior Reserve Officer Training Corps as well as specialized PE classes. This way it will passively boost military recruitment and duty to the nation regardless if they decide to join up or not. The JROTC program can not only be used to prepare potential soldiers, but teach kids things like public speaking, leadership qualities and group work which all work just as well in the military as they can in the civilian world."
 USB_mid_atlantic_identitarian_service_member_tax_breaks: "Service Member Tax Breaks"
 USB_mid_atlantic_identitarian_service_member_tax_breaks_desc: "Our national defense and the preservation of our new found identity is that which we hold dear. Thus as our citizens who choose to defend such should be looked after through tax reliefs and certain stipend based supplements to service member families."
 USB_mid_atlantic_identitarian_pseudo_mobilized_economy: "The \"Mobilized\" Economic Model"
 USB_mid_atlantic_identitarian_pseudo_mobilized_economy_desc: "The Pseudo Mobilized Economy is a economic model that hybridizes manufacturing industries to go about the normal production methods and so forth. The deviation is that a small dedicated segment of each industry will have roughly five to ten percent of said industry dedicated to some kind of military production. With each main business dedicated to a specific equipment and or class of equipment to produce, the actual breakdown between each businesses factories is up to the business leadership as long as they meet or come close to the expected quotas and as well as ensuring the quality of produced equipment."
 USB_mid_atlantic_identitarian_the_new_nation: "The New Nation"
 USB_mid_atlantic_identitarian_the_new_nation_desc: "From now on we are no longer just the \"Federal remnants of a bygone era\". We will now be known as the Mid-Atlantic Federal Union. A purer union based on the new found identity and culture we have spent to grow and call our own. Of course we respect the past, hence the Federal Union, but nevertheless this is a new step forward and it can only be up from here."
 USB_mid_atlantic_identitarian_developing_the_arms_industry: "Developing The Arms Industry"
 USB_mid_atlantic_identitarian_developing_the_arms_industry_desc: "To solidify our ability to hold our own, we must ensure the logistics side of such an endeavor is sustained. To this we must develop our military industrial capacity to meet the demands and potential threats which may befall us."
 USB_mid_atlantic_identitarian_further_shipping_industrial_developments: "Furthering Shipping Industrial Development"
 USB_mid_atlantic_identitarian_further_shipping_industrial_developments_desc: "To increase our international recognition we seek the continued development of our naval and shipping industries. While this can have military applications the primary need is of course trade, fishing and so forth."
 USB_mid_atlantic_identitarian_advanced_industries_act: "Advanced Industries Act"
 USB_mid_atlantic_identitarian_advanced_industries_act_desc: "The AIA is a government funding package to develop and grow our tech and service based industries. We must innovate as well as increase our competitiveness on the global stage if we are to stand out amongst the rabble of the rest of the continent we are on."
 USB_mid_atlantic_identitarian_the_primary_industries_act: "The Primary Industries Act"
 USB_mid_atlantic_identitarian_the_primary_industries_act_desc: "If we want to make a name for ourselves then we must act as a leader and a pioneer within a specialty. The continent has resources and the world needs said resouces. Therefore an extensive funding and investment package into developing primary industries and researching new ways to get more from less is the future stake we must claim."
 USB_mid_atlantic_identitarian_the_labor_restructuring_act: "The Labor Restructuring Act"
 USB_mid_atlantic_identitarian_the_labor_restructuring_act_desc: "The Labor Restructuring Act is a comprehensive legislative reforms to the labor laws and overall ability to efficiently allocate the work forces we have available as well as future proofing the ability to gain more productive capabilities with less people. Of course we'll need to increase our welfare and other budgeting apparatuses, but its a true investment for a better standard of living for all our peoples."
 USB_nsp_monarchist_victory: "NSP \"Monarchists\" Victory?"
 USB_nsp_monarchist_victory_desc: "In a shocking turn of events the NSP or National Service Party has won the election. The shock comes with the fact that out of all known ideologies the party's pro-election wing are what they call themselves \"Modern Monarchist\". Their main goal apparently is to keep the democratic system, but give it an aesthetic change wherein the titles are tied to the elected offices. This sort of elected monarchy or as some absolutists sneer as \"pseudo monarchism\" is a bit odd to a lot of people. But the military is content understanding the historical influences that monarchies placed high value on their militaries. Conservatives are content as this would be almost the ultimate conservative move as well as Liberals are more or less content due to the upholding and liberalization of democratic representation that will come from it. After all, what truly is in a name?"
 USB_nsp_monarchist_the_great_debate: "The Great Debate"
 USB_nsp_monarchist_the_great_debate_desc: "Following on our victory in the election, many truly wonder what is the point of cosmetically changing office titles, or how many should we change, ect ect. So the best debaters and calmest heads of the party must come together in this \"Great Debate\" of sorts to ensure the public and skeptics alike just how much will honestly change in the grand scheme of things."
 USB_nsp_monarchist_the_upper_echelon_act: "The Upper Echelon Act"
 USB_nsp_monarchist_the_upper_echelon_act_desc: "So after a lengthy series of debates we have solidified the new cosmetic changes. The choice to renamed the nation the Unified Kingdoms of Arcadia UKA is a symbol of a new identity as well as a symbol to those who once gave our former selves independence. The French colonial region of Arcadia is know for the Canadian provinces of New Brunswick, Nova Scotia and Prince Edward Island. Now she will live on in name with us as the UKA. This new identity allows us to secure title changes for offices, things like Emperor for the President, Princes for the senate, lords or barons for the house, Kings and Queens for the State governors. This supposed upper echelon of the leadership of the nation as a whole will now embody the spirit of a new nation, a new people and a new way forward."
 USB_nsp_monarchist_the_true_progressives: "The True Progressives"
 USB_nsp_monarchist_the_true_progressives_desc: "With a progressive liking to real tax reform we must ensure the fairness in said tax code. Therefore the tax brackets will lead up to $250,000 in terms of what will be the max bracket tax rate. The progressiveness of this being a tested variable amount of brackets split evenly in terms of gaps between them to allow for the most progressive form of taxation. Rather than punishing those that go higher in income, the scaling is based around proportional income earnings. This way there is no actual he said she said riff raff about \"paying your fair share\", when said fair share is based on the proportion of your income and not just cause you paid more by proxy of youearn more than someone."
 USB_nsp_monarchist_the_royal_families_act: "The Royal Families Act"
 USB_nsp_monarchist_the_royal_families_act_desc: "The RFA is a welfare reforms and budgeting bill to support families of the nation and make sure that not only are our citizens are taken care of but the future of our nation are taken care of as well. Everyone knows that the leading cause of divorce is due to financial instability due to the act of having children. Therefore if we want to increase our citizens happiness, increase the development baseline of stable homes and ensure the future of our future citizens and potential leaders then we must literally think of the children."
 USB_nsp_monarchist_the_modern_merchants_act: "The Modern Merchants Act"
 USB_nsp_monarchist_the_modern_merchants_act_desc: "In the old days of the \"Traditional Era\" of monarchism, the merchant was the backbone of ensure the expanded influences and wealth of the monarchy and its nation. In the modern age these now \"Modern Merchants\" are those of the small business owner. The backbone of the economy and the steam for which powers the engine of a nation's economy. As such we must fund, build and endorse small businesses to ensure they're ability to create, save that limiting to corporate entities that wish to look outside of our nation to secure their own wealth instead of the wealth of not just the nation but its peoples."
 USB_nsp_monarchist_the_great_connections_act: "The Great Connection Act"
 USB_nsp_monarchist_the_great_connections_act_desc: "The modern age has done something which even something that was 40yrs ago not even thought of. That is to make the world a smaller place and yet today many see the internet and cellular service as a supposed right to have. Well while material things are never a right outside those needed to survive, we do believe that these services are the future and what better way to grow a nation, its people and its identity then to make everyone closer together. Ensuring the unity through what is being called the Great Connection Act, a large funding package to ensure infrastructure both road and internet/phone based is seen to be expanded, modernized and upkept to the best possibility that our citizens can provide."
 USB_nsp_monarchist_domestic_first_policy: "The Domestic First Policy"
 USB_nsp_monarchist_domestic_first_policy_desc: "The Domestic First Policy or also known as the Domestic Priority Policy is a set of legislations and reforms that enforce the main duty of the government is to act on the security and ensured wellbeing of the domestic front. This means things like trade and so forth must be done in the means of securing the betterment or just out right securing the security of our domestic situation from foreign entities. This kind of pseudo autarkic and nationalistic policy will likely displease a fair amount of other nations, but our citizens should come first or what is the policy of a nation's government."
 USB_nsp_monarchist_the_grand_tour: "The Grand Tour"
 USB_nsp_monarchist_the_grand_tour_desc: "Skeptics are a way of life, as long as someone disagrees there will be skeptical people of if someone is truly \"right or wrong\" about something. Therefore to bolster our international image we must expand our diplomatic corps and ensure that we reduce the possibility of enemies to our own existence."
 USB_nsp_monarchist_la_grand_army: "Our Grand Army"
 USB_nsp_monarchist_la_grand_army_desc: "If there was ever an army to respect, why we would be here all day cause the principle of anyone willing to lay down their own life for what they believe in is the ultimate sacrafice someone can do. Nevertheless the innovativeness of Napoleon do have a special place in the hearts and minds of any officer that is either forward thinking and or future proofing. Though I am safe in thinking that anyone with a ego would also love to be Napoleon as well. Regardless we must treat our army with the upmost respect and diligence if we are to think about surviving a war, especially a war with our new neighbors."
 USB_nsp_monarchist_our_great_navy: "Our Great Navy"
 USB_nsp_monarchist_our_great_navy_desc: "To defense on land to defense on sea, the grand admiralty is what shall procure the security of our trade and coastal communities from the dangers beyond. With the same investing vigor we will turn our armed services around."
 USB_nsp_monarchist_our_defiant_air_force: "Our Defiant Air Force"
 USB_nsp_monarchist_our_defiant_air_force_desc: "The skies above our nation are sacred, this shield must be enforced through a strong and defiant air force. We must have the capabilities to defend our skies from the aggressors abroad, for they may be many and some may even be our neighbors."
 USB_nsp_monarchist_our_vast_resources: "Our Vast Resources"
 USB_nsp_monarchist_our_vast_resources_desc: "We must secure our domestic production and manufacturing. To do this we must invest, grow and subsidize resource extraction industries. These primary industries are the blood which circulates the entirety of any economy and we will certainly make sure that said blood will flow."
 USB_nsp_monarchist_our_strategic_resources: "Our Strategic Resources"
 USB_nsp_monarchist_our_strategic_resources_desc: "While autarky is not the best strategy considering our position in territory, we can at least maximize our domestic situation to be more strategic on the world stage. Therefore we will invest great sums into creating strategic stockpiles and resource streams in terms of mining operations."
 USB_nsp_monarchist_the_great_power_plant: "The Great Power Plant"
 USB_nsp_monarchist_the_great_power_plant_desc: "With all this great and rapid expansion we must also ensure such demands are met, with this in mind we must invest in massive power plant complexes to ensure energy production as well as its utilization are vastly enhanced."