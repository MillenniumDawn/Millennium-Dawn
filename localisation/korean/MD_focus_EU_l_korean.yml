 EU_budget: "다음 회계 연도의 예산"
 EU_budget_mff_active: "다년도 지출예산 구조(MFF)"
 EU_budget_mff_active_desc: "현행 다년도 지출예산 구조(MFF)입니다."
 EU_budget_mff_draft: "다년도 지출예산 구조(MFF) 초안 작성"
 EU_budget_mff_draft_desc: "다년도 지출예산 구조(MFF)의 초안을 작성한 회원국은 협상이 끝날 때 이를 유럽 의회(EP) 안건으로 상정해야 합니다. 보상으로, 초안 작성국은 해당 구조가 승인되어 발효될 때 투자된 총 정치력을 환급받습니다."
 EU_mff_draft_mission: "다년도 지출예산 구조(MFF) 협상"
 EU_mff_draft_mission_desc: "협상 기간 동안 모든 회원국은 정치력을 투자하여 자국의 구상에 맞게 초안을 변경할 수 있습니다. 초안에 대한 변경 사항은 해당 초안에 대한 유럽 의회 내 정치 그룹들의 시각에 영향을 미칩니다."
 EU_budget_draft: "유럽연합(EU) 예산안 초안 작성을 시작했습니다."
