 BRA_idea_monarchism: "군주주의 이상"
 BRA_idea_monarchism_desc: "보수주의와 민족주의 이상을 따르는 군주주의 이상은 옛 가치를 유지하는 군주제 정부를 믿습니다."
 BRA_idea_electoral_media: "선거 미디어"
 BRA_idea_electoral_media_desc: "소셜 미디어는 새로운 시대의 진정한 도구입니다. 이 새로운 도구를 우리에게 유리하게 활용하고, 이 혁신적인 도구로 다가오는 선거에서의 승리를 확보하는 것이 필수적입니다."
 BRA_idea_car_wash: "세차 작전"
 BRA_idea_car_wash_desc: "세차 작전(Operation Car Wash)은 브라질리아의 한 세차장에서 벌어진 소규모 자금 세탁 수사로 시작된 획기적인 반부패 수사입니다. 수사는 빠르게 걷잡을 수 없이 번져 여러 국영 기업과 모든 계층의 정치인, 각계각층의 사업가들이 연루되었습니다. 부패가 얼마나 깊은지는 시간이 말해 줄 것입니다."
