 satellites.2.t: "군용 위성항법시스템 등급 하향"
 satellites.2.d: "군용 위성항법시스템 위성을 너무 많이 손실하여, 우리 군용 위성항법시스템의 등급을 낮춰야만 합니다. 낮은 등급에서는 효율성이 떨어지지만, 시스템은 다시 작동할 것입니다."
 satellites.2.a: "알겠다"
 satellites.3.t: "민간용 위성항법시스템 등급 하향"
 satellites.3.d: "민간용 위성항법시스템 위성을 너무 많이 손실하여, 우리 민간용 위성항법시스템의 등급을 낮춰야만 합니다. 낮은 등급에서는 효율성이 떨어지지만, 시스템은 다시 작동할 것입니다."
 satellites.3.a: "알겠다"
 satellites.4.t: "군용 위성 통신 체계 등급 하향"
 satellites.4.d: "군용 통신위성을 너무 많이 잃어 군용 위성 통신 체계의 등급을 낮춰야만 합니다. 낮은 등급에서는 효율성이 떨어지지만 시스템은 다시 작동할 것입니다."
 satellites.4.a: "알겠다"
 satellites.5.t: "민간 위성 통신 체계 등급 하향"
 satellites.5.d: "민간 통신위성을 너무 많이 잃어 민간 위성 통신 체계의 등급을 낮춰야만 합니다. 낮은 등급에서는 효율성이 떨어지지만 시스템은 다시 작동할 것입니다."
 satellites.5.a: "알겠다"
 satellites.6.t: "군용 정찰 위성 체계 등급 하향"
 satellites.6.d: "군사 첩보위성을 너무 많이 잃어 군용 정찰 위성 체계의 등급을 낮춰야만 합니다. 낮은 등급에서는 효율성이 떨어지지만 시스템은 다시 작동할 것입니다."
 satellites.6.a: "알겠다"
 satellites.7.t: "민간 정찰 위성 체계 등급 하향"
 satellites.7.d: "민간 첩보위성을 너무 많이 잃어 민간 정찰 위성 체계의 등급을 낮춰야만 합니다. 낮은 등급에서는 효율성이 떨어지지만 시스템은 다시 작동할 것입니다."
 satellites.7.a: "알겠다"
 satellites.8.t: "위성 한도 도달"
 satellites.8.d: "We have too many satellites in orbit and cannot launch more at the moment. The limit is 3,000 active satellites. Deliberately deorbiting one of our satellites frees a slot."
 satellites.8.a: "알겠다"
