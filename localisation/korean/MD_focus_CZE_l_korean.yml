 CZE_skoda_all_or_nothing_tooltip: "§G모 아니면 도. 슈코다가 폭스바겐 그룹 내 폭스바겐의 주도권에 의문을 제기하기 시작합니다. 폭스바겐 그룹의 주도권을 잡으려면 상당히 큰 슈코다 예산이 필요하므로, §Y슈코다 슈퍼브 자동차 생산 및 수출§!에서 충분한 업그레이드를 마친 후에 이 중점을 완료하십시오.\n\n왜 기업이 그런 일을 하려 할까요? 이는 폭스바겐이 2009~2015년형 자동차 모델의 배기가스 배출 시험 결과를 조작한 §R'폭스바겐 배출가스 스캔들'§!과 관련이 있습니다. 슈코다가 이를 알고 있었다는 확실한 증거는 없지만, 이 시나리오는 슈코다가 이를 알고 단호히 거부했다면 어떤 일이 일어났을지에 대한 대체 역사를 보여 줍니다.§!"
