l_korean:
 saudi_focus_tree: "사우디아라비아 국가 중점 트리"
 SAU_crackdown_on_the_opposition: "반대파 탄압"
 SAU_crackdown_on_the_opposition_desc: "마바히스는 시아파 조직가, 사하와 성직자, 자유주의 청원자들에 대한 방대한 기록을 보유하고 있습니다. 평의회는 이 기록을 활용해 군정에 대한 반대 세력을 색출하고 탄압할 것입니다."
 SAU_modernisation_balance_of_power_category: "§H왕국의 미래§!"
 SAU_shia_rights_reform: "시아파 권리 개혁"
 SAU_shia_rights_reform_desc: "시아파의 권리를 국법으로 성문화하십시오.\n\n§G-시아파 저항, +안정도, +시아파 인구§!."
 SAU_trials_of_the_old_order: "구질서 재판"
 SAU_trials_of_the_old_order_desc: "위원회는 옛 왕정 체제의 인사들을 공개 법정에서 기소할 것입니다. 2017년 리츠칼튼 숙청의 비공개 합의와 달리, 이번 절차는 혐의와 판결을 공개적으로 제시하는 동시에 위원회의 정치적 이익에도 이바지할 것입니다."
 SAU_unif_command_control_tt: "§HGCC 군대 전반에 걸쳐 통합 지휘 통제 구조가 확립됩니다.§!"
 SAU_unif_cross_border_tt: "§Y국경 지역에 발달한 국경 간 인프라가 필요합니다(인프라 레벨 3 이상).§!"
 SAU_unif_exploit_authority_tt: "§Y왕국이 다른 모든 GCC 회원국에서 가장 큰 외국 영향력이어야 합니다.§!"
 SAU_unif_increase_autonomy_tt: "§H더 큰 지역 자율성은 종파적 불만을 완화합니다. 국내 영향력이 커지고 급진화는 수그러듭니다.§!"
 HOU_houthi_resilience: "안사르 알라 회복력"
 HOU_houthi_resilience_desc: "안사르 알라는 수십 년간 예멘의 산악 북부에서 활동해 왔습니다. 지형에 대한 익숙함과 구축된 고지대 진지 덕분에 후티 부대는 몰아내기 어렵습니다."
 PER_houthi_defense_buff: "산악 요새"
 PER_houthi_defense_buff_desc: "이란이 건설한 방어 시설이 고지대를 요새로 바꿉니다. 정부군에 맞선 방어 +15%."
 SAU_arab_shield_member: "아랍 방패 회원국"
 SAU_arab_shield_member_desc: "이 국가는 아랍 방패의 집단 방위 체제에 참여하고 있으며, 이에 따라 군의 방어력과 사기가 향상됩니다."
 SAU_aramco_01: "사우디 아람코"
 SAU_aramco_01_desc: "사우디아라비아 석유 회사는 1980년부터 완전히 국유화된 세계 최대의 석유 기업입니다. 아람코는 왕국의 방대한 석유 매장량을 관리하며 정부 수입의 대부분을 창출하는 사우디 경제의 중추입니다. 막대한 수익을 올리고 있지만, 투명성이 제한적이며 아직 기업 구조를 현대화하지 못했습니다."
 SAU_aramco_02: "사우디 아람코 - 사업 확장"
 SAU_aramco_02_desc: "아람코는 원유 채굴을 넘어 정제 능력, 석유화학 사업, 국제 제휴에 투자하며 사업을 확장했습니다. 회사의 효율성 향상과 다각화된 포트폴리오는 사우디 경제의 초석으로서의 입지를 강화했습니다."
 SAU_aramco_03: "사우디 아람코 - 글로벌 에너지 선도 기업"
 SAU_aramco_03_desc: "사우디 아람코는 현대적인 글로벌 에너지 거대 기업으로 탈바꿈했습니다. 성공적인 기업 공개, 확대된 다운스트림 사업, 전략적 해외 투자를 바탕으로 이 회사는 이제 세계에서 가장 가치 있는 기업 중 하나로 자리 잡았습니다. 그 수익은 왕국의 예산뿐 아니라 전국의 야심 찬 개발 계획도 뒷받침합니다."
 SAU_aramco_downstream: "§H사우디 아람코§! - 다운스트림 통합"
 SAU_aramco_downstream_desc: "아람코는 정제 및 화학 제품 생산으로 사업을 확장하여 원유 채굴에서 소매 연료 판매에 이르는 모든 단계에서 수익을 올릴 수 있게 되었습니다."
 SAU_aramco_engineers: "§H사우디 아람코§! - 사우디 석유 기술자"
 SAU_aramco_engineers_desc: "KFUPM과 해외에서 교육받은 사우디 석유 기술자 세대가 한때 유전을 운영하던 외국인 인력을 대체했습니다."
 SAU_aramco_export: "§H사우디 아람코§! - 수출 강자"
 SAU_aramco_export_desc: "아람코는 수출 기계로 구축되었으며, 터미널과 유조선단은 어떤 경쟁자보다 더 많은 시장에 더 많은 원유를 공급하도록 조정되어 있습니다."
 SAU_aramco_gas: "§H사우디 아람코§! - 마스터 가스 시스템"
 SAU_aramco_gas_desc: "마스터 가스 시스템은 이전에는 태워 버리던 천연가스를 포집하여 사우디아라비아 전역의 발전소와 산업 시설로 수송합니다."
 SAU_aramco_ghawar: "§H사우디 아람코§! - 가와르 유전"
 SAU_aramco_ghawar_desc: "가와르는 세계 최대의 재래식 유전으로 하루 수백만 배럴을 생산합니다. 그 산출량은 아람코와 사우디 경제 모두에 핵심적입니다."
 SAU_aramco_giant: "§H사우디 아람코§! - 세계에서 가장 가치 있는 기업"
 SAU_aramco_giant_desc: "아람코는 지구상에서 가장 가치 있는 기업으로 군림하며, 생산량, 매장량, 이익에서 기업 역사상 견줄 상대가 없습니다."
 SAU_aramco_megafields: "§H사우디 아람코§! - 신규 초대형 유전"
 SAU_aramco_megafields_desc: "샤이바, 쿠라이스, 해상 마니파 유전의 대규모 개발은 사우디의 생산 능력을 확장했고 대형 석유 사업에 대한 왕국의 투자를 이어 갔습니다."
 SAU_aramco_national: "§H사우디 아람코§! - 완전 국유화"
 SAU_aramco_national_desc: "1980년에 완료된 미국인 주주 지분 인수로 아람코는 온전히 사우디의 소유가 되었습니다. 왕국의 석유는 이제 오직 리야드에만 응답합니다."
 SAU_aramco_opec: "§H사우디 아람코§! - OPEC 조절 생산자"
 SAU_aramco_opec_desc: "사우디아라비아는 OPEC 공급량을 늘리거나 줄일 수 있는 충분한 여유 생산 능력을 유지하여 다른 어떤 회원국보다 세계 유가에 큰 영향을 미칩니다."
 SAU_aramco_petrochem: "§H사우디 아람코§! - 통합 정제"
 SAU_aramco_petrochem_desc: "스미토모, 토탈과의 합작 사업인 페트로라비그와 SATORP는 홍해와 걸프에서 정제와 석유화학을 하나의 통합 단지로 결합합니다."
 SAU_aramco_production: "§H사우디 아람코§! - 생산 극대화"
 SAU_aramco_production_desc: "아람코는 여유 생산 능력을 유지하면서 지속 가능한 최대 생산을 우선시합니다. 이를 통해 사우디아라비아는 수요 변화나 정부의 생산 정책 변화에 신속히 대응할 수 있습니다."
 SAU_aramco_rastanura: "§H사우디 아람코§! - 라스타누라 및 아브카이크"
 SAU_aramco_rastanura_desc: "라스타누라 수출 터미널과 아브카이크 처리 단지는 사우디 원유가 세계 시장에 나가기 전 상당 부분을 처리합니다. 두 시설은 함께 이 종류에서 세계 최대급입니다."
 SAU_aramco_rnd: "§H사우디 아람코§! - EXPEC 연구"
 SAU_aramco_rnd_desc: "다란의 EXPEC 첨단 연구 센터는 저류층 공학 분야에서 세계를 선도하며, 모든 유전에서 더 낮은 비용으로 더 많은 석유를 뽑아냅니다."
 SAU_baathist_party_1: "아랍 민족주의의 보루"
 SAU_baathist_party_1_loc: "\n[SAU.GetFlag]아랍 민족주의의 보루\n§H외국 영향력§! 승수: §G+5.00%§!\n§H외국 영향력§! 쿠데타 성공 계수: §G+25.0%§!\n\n"
 SAU_baathist_party_3: "통일, 자유, 사회주의"
 SAU_baathist_party_3_loc: "[SAU.GetFlag]통일, 자유, 사회주의\n건설 속도: §G+10.00%§!\n민족주의 선전 캠페인 비용 승수: §G-10.00%§!\n월간 생산성 증가: §G+0.05§!\n\n"
 SAU_banking_649_hybrid: "§H이자법§! - §Y혼합(수쿠크 + 비공식)§!"
 SAU_banking_649_hybrid_desc: "수쿠크와 이슬람 은행 서비스가 비공식적인 기존 대출과 함께 운영됩니다. 이 제도는 공식적으로는 샤리아를 준수하면서도 제한적인 실무상의 유연성을 허용합니다."
 SAU_banking_649_hybrid_loc: "\n§H이자법:§! §Y수쿠크 + 비공식 이자§!\n  §G+2.0%§! 사무 단지 세금\n  §G+1.0%§! 정치력\n  §G+0.5%§! 안정도\n"
 SAU_banking_649_islamic: "§H이자법§! - §R엄격한 리바 금지§!"
 SAU_banking_649_islamic_desc: "리바는 예외 없이 금지됩니다. 금융은 이익 분배와 무라바하 구조를 통해 흐르며, 신도들은 양심에 거리낌 없이 은행을 이용합니다."
 SAU_banking_649_islamic_loc: "\n§H이자법:§! §B엄격한 리바 금지§!\n  §G+3.0%§! 정치력\n  §G+2.0%§! 안정도\n  §G+0.5%§! 살라피주의 편향\n"
 SAU_banking_649_secular: "§H이자법§! - §G기존 방식§!"
 SAU_banking_649_secular_desc: "이자는 합법이며 공개적으로 책정됩니다. 성직자들이 금요일에 무엇을 설교하든 기존 은행업은 번창하고 자본은 자유롭게 흐릅니다."
 SAU_banking_649_secular_loc: "\n§H이자법:§! §G기존 방식§!\n  §G+4.0%§! 사무 단지 세금\n  §G+3.0%§! 법인세\n  §G+0.5%§! 민주주의 편향\n  §R-1.0%§! 안정도\n"
 SAU_banking_650_hybrid: "§H지급준비 의무§! - §Y중간§!"
 SAU_banking_650_hybrid_desc: "중간 수준의 지급준비 요건은 은행이 신용을 확대하도록 하면서도, 규제가 느슨한 체제보다 더 큰 재무 완충을 유지하게 합니다."
 SAU_banking_650_hybrid_loc: "\n§H지급준비 의무:§! §Y중간 수준 준비금§!\n  §G+1.0%§! 건설 속도\n  §G+0.5%§! 안정도\n"
 SAU_banking_650_islamic: "§H지급준비 의무§! - §R전액 자산 담보§!"
 SAU_banking_650_islamic_desc: "모든 예금은 실물 자산으로 뒷받침됩니다. 신용은 느리게 성장하지만, 어떤 사우디 은행도 인출 사태로 무너지지 않습니다."
 SAU_banking_650_islamic_loc: "\n§H지급준비 의무:§! §B전액 자산 담보(샤리아)§!\n  §G+2.5%§! 안정도\n  §G+2.0%§! 전쟁 지지도\n  §R-2.0%§! 건설 속도\n"
 SAU_banking_650_secular: "§H지급준비 의무§! - §G부분지급준비§!"
 SAU_banking_650_secular_desc: "은행은 예금의 일부만을 담보로 대출하여 서구 방식으로 경제 전반에 신용을 증폭시킵니다."
 SAU_banking_650_secular_loc: "\n§H지급준비 의무:§! §G부분지급준비(서구식)§!\n  §G+3.0%§! 건설 속도\n  §G+5.0%§! 산업 수리\n  §R-2.0%§! 소비재 사용\n  §R-1.5%§! 안정도\n"
 SAU_banking_651_hybrid: "§H투기 규약§! - §Y규제된 파생상품§!"
 SAU_banking_651_hybrid_desc: "파생상품은 엄격한 한도 내에서 거래되며, 위험 회피는 허용되고 투기는 단속됩니다."
 SAU_banking_651_hybrid_loc: "\n§H투기 규약:§! §Y규제된 파생상품만 허용§!\n  §G+1.5%§! 세수 증가\n  §G+0.5%§! 안정도\n"
 SAU_banking_651_islamic: "§H투기 규약§! - §R가라르 금지§!"
 SAU_banking_651_islamic_desc: "가라르 금지는 파생상품, 공매도, 그 밖에 과도한 불확실성이나 투기에 기반한 금융 상품을 막습니다."
 SAU_banking_651_islamic_loc: "\n§H투기 규약:§! §B가라르 금지 - 도박 금지§!\n  §G+2.5%§! 안정도\n  §G+2.0%§! 정치력\n  §G+3§! 중립 수용도\n"
 SAU_banking_651_secular: "§H투기 규약§! - §G가벼운 규제§!"
 SAU_banking_651_secular_desc: "옵션, 선물 및 기타 파생상품은 제한적인 규제 감독 아래 허용됩니다."
 SAU_banking_651_secular_loc: "\n§H투기 규약:§! §G파생상품 및 선물 허용§!\n  §G+3.0%§! 세수 증가\n  §G+2.0%§! 연구 속도\n  §R-2.0%§! 안정도\n"
 SAU_banking_652_hybrid: "§H은행 간 규약§! - §Y이중 채널§!"
 SAU_banking_652_hybrid_desc: "기존 방식과 이슬람 방식의 두 은행 간 채널이 나란히 운영되며, 각 은행은 거래 상대를 직접 선택합니다."
 SAU_banking_652_hybrid_loc: "\n§H은행 간 규약:§! §Y이중 채널§!\n  §G+1.5%§! 사무 단지 세금\n  §G+1.0%§! 정치력\n"
 SAU_banking_652_islamic: "§H은행 간 규약§! - §R무라바하§!"
 SAU_banking_652_islamic_desc: "은행 간 유동성은 상품 무라바하를 통해 이동하며, 하룻밤 자금조차 샤리아의 범위 안에 둡니다."
 SAU_banking_652_islamic_loc: "\n§H은행 간 규약:§! §B무라바하 기반§!\n  §G+2.5%§! 정치력\n  §G+1.5%§! 안정도\n  §G+0.5%§! 살라피주의 편향\n"
 SAU_banking_652_secular: "§H은행 간 규약§! - §GLIBOR 방식§!"
 SAU_banking_652_secular_desc: "은행들은 기준 금리로 서로 대출하며, 사우디 금융을 세계 자금 시장에 엮어 넣습니다."
 SAU_banking_652_secular_loc: "\n§H은행 간 규약:§! §G기존 이자 범위 방식§!\n  §G+3.0%§! 사무 단지 세금\n  §G+2.0%§! 법인세\n  §G+0.5%§! 민주주의 편향\n  §R-1.0%§! 안정도\n"
 SAU_banking_653_hybrid: "§H은행 통제§! - §Y병렬 구조§!"
 SAU_banking_653_hybrid_desc: "기존 은행과 이슬람 은행은 하나의 중앙은행 아래에서 병렬 감독 체계에 따릅니다."
 SAU_banking_653_hybrid_loc: "\n§H은행 통제:§! §YSAMA + 샤리아 병렬 구조§!\n  §G+2.0%§! 세수 증가\n  §G+1.5%§! 정치력\n"
 SAU_banking_653_islamic: "§H은행 통제§! - §RSAMA + 샤리아 위원회§!"
 SAU_banking_653_islamic_desc: "SAMA는 샤리아 감독 위원회와 권한을 나누며, 학자들의 거부권을 넘어서는 은행 면허는 없습니다."
 SAU_banking_653_islamic_loc: "\n§H은행 통제:§! §BSAMA + 샤리아 감독§!\n  §G+4.0%§! 정치력\n  §G+2.5%§! 안정도\n  §G+1.0%§! 살라피주의 편향\n"
 SAU_banking_653_secular: "§H은행 통제§! - §G독립 SAMA§!"
 SAU_banking_653_secular_desc: "SAMA는 독립 중앙은행으로서 은행업을 규제하며, 시장의 신뢰 외에는 거의 누구에게도 책임지지 않습니다."
 SAU_banking_653_secular_loc: "\n§H은행 통제:§! §G독립 SAMA§!\n  §G+4.0%§! 세수 증가\n  §G+2.0%§! 연구 속도\n  §G+1.0%§! 민주주의 편향\n  §R-1.0%§! 안정도\n"
 SAU_banking_654_pragmatic: "§H이슬람 금융§! - §Y글로벌 이슬람 허브§!"
 SAU_banking_654_pragmatic_desc: "리야드는 이슬람 금융의 국제적 중심지로 발전하고 있습니다. 규제는 샤리아의 신뢰성을 유지하면서도 다른 주요 금융 시장의 기관을 수용합니다."
 SAU_banking_654_pragmatic_loc: "\n§H이슬람 금융의 보루:§! §Y글로벌 이슬람 금융 허브§!\n  §G+3.0%§! 정치력\n  §G+2.5%§! 안정도\n  §G+5.0%§! 사무 단지 세금\n  §G+4.0%§! 법인세\n  §G+5§! 중립 수용도\n"
 SAU_banking_654_strict: "§H이슬람 금융§! - §R엄격한 정통주의§!"
 SAU_banking_654_strict_desc: "왕국은 정통 이슬람 금융 규칙의 완전한 준수를 요구합니다. 이는 유연성을 제한하지만 엄격한 샤리아 준수를 우선시하는 고객을 끌어들입니다."
 SAU_banking_654_strict_loc: "\n§H이슬람 금융의 보루:§! §B엄격한 정통주의§!\n  §G+5.0%§! 정치력\n  §G+5.0%§! 안정도\n  §G+2.0%§! 살라피주의 편향\n  §G+10§! 중립 수용도\n  §G+10.0%§! 편향 방어\n"
 SAU_banking_655_full: "§H금융 세속화§! - §G완전한 앵글로색슨식§!"
 SAU_banking_655_full_desc: "사우디아라비아는 앵글로색슨식 은행 모델을 전면 도입했습니다. 이 변화는 기존 자본 시장을 확대하지만 종교 기득권층의 반대에 직면합니다."
 SAU_banking_655_full_loc: "\n§H금융 세속화:§! §G완전한 앵글로색슨식§!\n  §G+10.0%§! 사무 단지 세금\n  §G+7.0%§! 법인세\n  §G+5.0%§! 세수 증가\n  §G+4.0%§! 연구 속도\n  §G+2.0%§! 민주주의 편향\n  §R-3.0%§! 안정도\n  §R-2.0%§! 소비재 사용\n"
 SAU_banking_655_gradual: "§H금융 세속화§! - §Y점진적§!"
 SAU_banking_655_gradual_desc: "세속화에 대한 조직적인 종교계의 반대를 줄이기 위해 기존 금융 규칙이 점진적으로 도입되고 있습니다."
 SAU_banking_655_gradual_loc: "\n§H금융 세속화:§! §Y점진적 이행§!\n  §G+6.0%§! 사무 단지 세금\n  §G+4.0%§! 법인세\n  §G+3.0%§! 세수 증가\n  §G+1.0%§! 민주주의 편향\n  §R-1.0%§! 안정도\n"
 SAU_banking_system: "§H은행 체계§!"
 SAU_banking_system_desc: "왕국의 금융 부문입니다. 각 은행법 중점은 플레이어에게 §L세속§!, §L이슬람§!, §L혼합§! 중 하나를 선택하게 하며, 그 결과는 §H하위 체계§!로 이곳에 반영됩니다. 총 변동치는 선택된 모든 하위 체계의 합에서 나옵니다."
 SAU_banking_system_tt: "[SAU_banking_649_loc][SAU_banking_650_loc][SAU_banking_651_loc][SAU_banking_652_loc][SAU_banking_653_loc][SAU_banking_654_loc][SAU_banking_655_loc]"
 SAU_black_february_bailout_idea: "2월 개입"
 SAU_black_february_bailout_idea_desc: "국가는 타다울의 붕괴를 늦추고 소액 투자자들을 최악의 손실에서 보호하기 위해 공적 자금을 투입했습니다. 이 개입은 가용 국고 자금을 줄이고, 향후 시장 위기에 대한 값비싼 선례를 남깁니다."
 SAU_black_february_idea: "검은 2월"
 SAU_black_february_idea_desc: "타다울은 가치의 3분의 2를 잃었고, 사우디 가계가 투자한 저축의 상당 부분이 사라졌습니다. 정부가 개입하지 않은 것이 광범위한 국민적 분노를 불러일으켰습니다."
 SAU_communist_state_2: "프롤레타리아 국가"
 SAU_communist_state_2_loc: "[SAU.GetFlag]프롤레타리아 국가\n§H인구 세수§! 승수: §G+5.00%§!\n§H농업§! 세수 승수: §G+5.00%§!\n§H상업 농업 지구§! 생산성: §G+10.00%§!\n\n"
 SAU_communist_state_2_tt: "[SAU_communist_state_1_loc][SAU_communist_state_2_loc][SAU_communist_state_3_loc][SAU_communist_state_4_loc][SAU_communist_state_5_loc]"
 SAU_Cooperation_West_East: "[USA.GetFlag] 분열된 세계 속의 협력 [CHI.GetFlag]"
 SAU_Cooperation_West_East_desc: "분열된 세계는 두 개의 주요 블록으로 나뉘어 있습니다. 하나는 떠오르는 초강대국 [CHI.GetFlag] 중국과 한편인 동방 세계이며, 다른 하나는 이 세계와 새 천년을 [USA.GetFlag] 미국이 이끄는 서방 세계입니다."
 SAU_Cooperation_West_East_tt: "[SAU_IMEC_india_deal_new_loc][SAU_OPEC_Russia_deal_new_loc]"
 SAU_custodian_of_the_cause: "대의의 수호자"
 SAU_custodian_of_the_cause_desc: "리야드는 팔레스타인을 아랍 세계에 대한 자국 지도력의 척도로 삼았으며, 아랍 민중은 충성으로 화답합니다."
 SAU_cyber_defensive_posture: "사이버 방어 태세"
 SAU_cyber_defensive_posture_desc: "GIP의 강화 작전이 왕국의 네트워크를 보호하고 적대적인 정보 수집을 늦추고 있습니다."
 SAU_cyber_defensive_target: "사우디 사이버 대응 조치"
 SAU_cyber_defensive_target_desc: "GIP의 사이버 방어가 공격 조율과 지휘를 약화시켰습니다."
 SAU_cyber_offensive_target: "사우디 사이버 공격 대상"
 SAU_cyber_offensive_target_desc: "GIP의 사이버 작전이 지휘 및 방어 조율을 마비시키고 산업을 교란했습니다."
 SAU_decisive_storm_air_cover: "연합 항공 엄호"
 SAU_decisive_storm_air_cover_desc: "사우디와 연합군 항공기가 예멘 정부군에게 항공 엄호를 제공하여 후티에 대한 방어 +10%를 부여합니다. 이 지원은 휴전이 수락되거나 후티 운동이 소멸하면 끝납니다."
 SAU_decree_abdullah_kaec_construction: "KAEC 신속 처리"
 SAU_decree_abdullah_kaec_construction_desc: "왕국 전역의 토목 공사가 홍해 연안에서 정해진 속도로 추진되고 있습니다."
 SAU_decree_abdullah_kasp_scholarship: "KASP 해외 장학금"
 SAU_decree_abdullah_kasp_scholarship_desc: "해외에서 교육받은 한 세대가 부처, 대학, 기업으로 속속 돌아오고 있습니다."
 SAU_decree_abdullah_kaust_grants: "KAUST 첨단 기술 보조금"
 SAU_decree_abdullah_kaust_grants_desc: "확대된 KAUST 보조금이 대학 연구를 가속하고 첨단 기술 산업의 생산을 늘리고 있습니다."
 SAU_decree_abdullah_national_dialogue: "국민 대화 포럼"
 SAU_decree_abdullah_national_dialogue_desc: "불만은 거리가 아니라 회의장에서 논의되고 있습니다."
 SAU_decree_abdullah_sang_subsidies: "SANG 현대화 보조금"
 SAU_decree_abdullah_sang_subsidies_desc: "보조금이 붙은 계약이 장갑차 가격을 억제하고 부대 편제를 충족한 상태로 유지하고 있습니다."
 SAU_decree_mbn_border_surveillance: "국경 경비대 감시망"
 SAU_decree_mbn_border_surveillance_desc: "국경은 끝에서 끝까지 감시되고 있으며, 국경의 병력은 준비된 진지 뒤에 참호를 파고 있습니다."
 SAU_decree_mbn_mabahith_campaign: "마바히스 전복 방지 작전"
 SAU_decree_mbn_mabahith_campaign_desc: "마바히스는 통신을 감시하고 왕국 전역에서 반체제 의심 인물에 대한 감시를 강화하고 있습니다."
 SAU_decree_mbn_rehabilitation_center: "나예프 왕자 갱생 센터"
 SAU_decree_mbn_rehabilitation_center_desc: "나예프 왕자 센터는 투옥이나 사망이 극단주의자 모집을 강화하도록 놔두는 대신, 무장 세력을 갱생시켜 민간 생활로 복귀시키려 합니다."
 SAU_decree_mbn_special_security_forces: "내무부 특수 보안군"
 SAU_decree_mbn_special_security_forces_desc: "내무부의 병력이 거리에 나와 있으며, 왕국에 맞서 활동하는 자들은 훨씬 더 힘든 처지에 놓이고 있습니다."
 SAU_decree_mbn_western_intel_networks: "서방 합동 정보망"
 SAU_decree_mbn_western_intel_networks_desc: "동맹 기관들이 공유한 수집 정보가 사우디의 수집 능력이 닿지 못하는 부분을 메워 주고 있습니다."
 SAU_decree_mbs_anticorruption_drive: "리츠칼튼 합의"
 SAU_decree_mbs_anticorruption_drive_desc: "리츠칼튼 구금은 부유한 사우디인들이 자산을 국가에 넘기도록 강제했으며, 지도부가 사유 재산을 통제하고 있음을 보여 주었습니다."
 SAU_decree_mbs_aramco_liquidity: "아람코 전략 유동성"
 SAU_decree_mbs_aramco_liquidity_desc: "석유 자금이 곧바로 국가의 손으로 옮겨지고 있으며, 산업은 무역 장부의 속박에서 풀려났습니다."
 SAU_decree_mbs_gami_localization: "GAMI 국방 국산화"
 SAU_decree_mbs_gami_localization_desc: "무기가 외국 생산 라인이 아닌 사우디 생산 라인에서 나오고 있으며, 무기 공장이 늘어나고 있습니다."
 SAU_decree_mbs_pif_neom: "네옴 및 변경 프로젝트"
 SAU_decree_mbs_pif_neom_desc: "공공투자기금이 네옴과 관련된 변경 프로젝트, 그리고 이를 뒷받침하는 데 필요한 교통 인프라에 자금을 대고 있습니다."
 SAU_decree_mbs_vision2030_blitz: "비전 2030 집중 캠페인"
 SAU_decree_mbs_vision2030_blitz_desc: "정부 부처와 공공 투자가 왕세자의 비전 2030 계획을 신속히 이행하는 방향으로 집중되고 있습니다."
 SAU_decree_mutaib_capital_garrison: "수도 주둔군 망"
 SAU_decree_mutaib_capital_garrison_desc: "국가방위군이 리야드 전역에 보안 방어선과 광범위한 감시망을 구축했습니다."
 SAU_decree_mutaib_janadriyah_festival: "자나드리야 문화유산 축제"
 SAU_decree_mutaib_janadriyah_festival_desc: "자나드리야 축제는 부족 유산을 널리 알리고 정부와 부족 공동체 사이의 관계를 강화합니다."
 SAU_decree_mutaib_sang_logistics: "자율 SANG 군수"
 SAU_decree_mutaib_sang_logistics_desc: "방위군은 스스로 먹고 연료를 채우며, 그 과정에서 훨씬 덜 낭비합니다."
 SAU_decree_mutaib_sang_procurement: "SANG 항공 및 기갑 조달"
 SAU_decree_mutaib_sang_procurement_desc: "방위군의 계약이 가장 먼저 충족되며, 정규군이 받지 못하는 가격에 이루어집니다."
 SAU_decree_mutaib_tribal_reserves: "부족 SANG 예비대"
 SAU_decree_mutaib_tribal_reserves_desc: "부족 징집병이 모집관들만으로는 불가능한 속도로 방위군의 명부를 채우고 있습니다."
 SAU_decree_salman_cpsa_council: "정치안보위원회"
 SAU_decree_salman_cpsa_council_desc: "이제 하나의 위원회가 정치와 안보를 함께 승인하며, 참모 업무는 의장을 맡은 인물의 속도로 움직입니다."
 SAU_decree_salman_ksrelief: "KSrelief 작전"
 SAU_decree_salman_ksrelief_desc: "KSrelief는 눈에 띄는 사우디의 인도주의 활동을 통해 해외에 원조를 제공하고 왕국의 국제적 평판을 높입니다."
 SAU_decree_salman_riyadh_metro_plan: "리야드 광역 계획"
 SAU_decree_salman_riyadh_metro_plan_desc: "수도의 건설 계획이 전국 건설 사업의 속도를 좌우하고 있습니다."
 SAU_decree_salman_royal_decrees: "왕실 구조 칙령"
 SAU_decree_salman_royal_decrees_desc: "왕실 칙령이 부처를 재편하고 정부 정책의 이행을 중앙집권화하고 있습니다."
 SAU_decree_salman_spark_park: "살만 국왕 에너지 단지"
 SAU_decree_salman_spark_park_desc: "국내 에너지 제조업이 모든 유전과 모든 저유 탱크 단지에서 더 많은 것을 뽑아내고 있습니다."
 SAU_div_construction: "§H다각화§! - 건설 및 부동산"
 SAU_div_construction_desc: "건설과 부동산 개발이 사우디아라비아 비석유 경제의 주요 구성 요소가 되고 있습니다."
 SAU_div_defence: "§H다각화§! - 방위 산업"
 SAU_div_defence_desc: "국내 무기 산업은 국방비를 왕국 안에 머물게 하여, 단순히 구매하는 대신 공장과 전문성을 구축합니다."
 SAU_div_energy: "§H다각화§! - 재생 에너지"
 SAU_div_energy_desc: "대규모 태양광 사업은 석유 화력 에너지에 대한 국내 수요를 줄여 더 많은 원유를 수출에 돌리고 정부 수입을 늘립니다."
 SAU_div_governance: "§H다각화§! - 통치 및 법치"
 SAU_div_governance_desc: "더 일관된 법원과 책임 있는 부처는 사업 환경을 개선하고 정부 정책을 시행하기 쉽게 만듭니다."
 SAU_div_logistics: "§H다각화§! - 물류 및 운송"
 SAU_div_logistics_desc: "항만, 철도, 고속도로에 대한 투자는 아시아, 아프리카, 유럽 사이의 무역에서 사우디아라비아의 역할을 강화합니다."
 SAU_div_social: "§H다각화§! - 사회 발전"
 SAU_div_social_desc: "학교, 병원, 주택은 평범한 사우디인들에게 새로운 경제에 대한 지분과 그것을 믿을 이유를 제공합니다."
 SAU_div_tech: "§H다각화§! - 기술 및 혁신"
 SAU_div_tech_desc: "연구 단지와 스타트업 자본은 석유 산업이 결코 고용하지 못했을 졸업생들을 채용하는 사우디 기술 부문의 씨앗을 뿌립니다."
 SAU_div_tourism: "§H다각화§! - 관광 및 엔터테인먼트"
 SAU_div_tourism_desc: "리조트, 유적지, 엔터테인먼트 지구는 왕국이 한때 돌려보냈던 방문객들에게 문을 열어 주며, 그들의 돈은 왕국에 남습니다."
 SAU_diversification: "§H경제 다각화§!"
 SAU_diversification_desc: "왕국은 석유 가격 변동에 대한 노출을 줄이기 위해 §L비석유 경제§!를 발전시키고 있습니다. 통치, 산업, 관광, 기술, 에너지, 사회 발전을 포함하여 완료된 각 기둥이 이곳에 나타나며 §G석유 의존도를 낮춥니다§!."
 SAU_diversification_tt: "[SAU_div_governance_loc][SAU_div_construction_loc][SAU_div_tourism_loc][SAU_div_logistics_loc][SAU_div_tech_loc][SAU_div_defence_loc][SAU_div_energy_loc][SAU_div_social_loc]"
 SAU_doctrine_american: "교리: 미국과의 파트너십"
 SAU_doctrine_american_desc: "미군과 함께 훈련하고, 미국산을 구매하며, 미국식으로 싸웁니다. 가장 역량 있는 길이지만, 그 대가로 의존과 국내의 조용한 반감이 따릅니다.\n\n§G+10%§! 육군 경험치 획득\n§G+10%§! 공군 경험치 획득\n§G+5%§! 사단 조직도\n§R-10%§! 정치력 획득"
 SAU_doctrine_domestic: "교리: 국내 자립"
 SAU_doctrine_domestic_desc: "토착 방위 산업과 외국 공급자에게 빚지지 않는 군대를 구축합니다. 최첨단에는 한 걸음 뒤처지더라도 자긍심과 자급자족을 갖추게 됩니다.\n\n§G+10%§! 군수 공장 생산량\n§G+5%§! 사단 회복률\n§R-5%§! 육군 경험치 획득"
 SAU_doctrine_gcc: "교리: GCC 집단 방위"
 SAU_doctrine_gcc_desc: "왕국의 방위를 걸프 협력 회의와 반도 방패군에 정박시킵니다. 본토에서는 강력하지만 위원회에 얽매여 공격에는 신중합니다.\n\n§G+15%§! 중핵 영토 사단 방어\n§G+5%§! 징집 가능 인구\n§R-5%§! 사단 공격"
 SAU_doctrine_nato: "교리: 나토식 전문성"
 SAU_doctrine_nato_desc: "나토 표준을 채택합니다. 전문 장교단, 합동 병과 작전 계획, 엄밀한 참모 업무입니다. 지휘 통제는 탁월하나 유지 비용이 많이 드는 군대입니다.\n\n§G+10%§! 계획 속도\n§G+10%§! 최대 계획\n§G+5%§! 사단 조직도\n§R+5%§! 소비재 사용"
 SAU_eco_bureau_bad: "§R사우디 경제§! - 관료주의"
 SAU_eco_bureau_bad_desc: "사우디 기업들은 더딘 인허가, 중복된 승인, 만연한 연고주의에 직면해 있습니다. 이러한 관료적 장벽은 공공 투자의 가치를 떨어뜨립니다."
 SAU_eco_bureau_good: "§G사우디 경제§! - 간소화된 국가"
 SAU_eco_bureau_good_desc: "허가가 몇 년이 아니라 며칠이면 나옵니다. 간소화된 국가는 사우디 기업이 시장의 속도로 움직이게 합니다."
 SAU_eco_capital_bad: "§R사우디 경제§! - 자본 도피"
 SAU_eco_capital_bad_desc: "사우디의 민간 자산은 런던, 제네바, 뉴욕에 있습니다. 왕국의 최고 부호들은 고국만 빼고 모든 곳에 투자합니다."
 SAU_eco_capital_good: "§G사우디 경제§! - 국가 자본"
 SAU_eco_capital_good_desc: "사우디의 자본은 왕국에 머물며 일하여, 외국의 고급 주택 대신 공장과 사업에 자금을 댑니다."
 SAU_eco_diversify_bad: "§R사우디 경제§! - 지대 국가"
 SAU_eco_diversify_bad_desc: "정부는 석유 수입에 의존하고, 많은 시민은 국가 고용과 복지에 의존합니다. 따라서 단일 상품의 가격 변동이 경제 전체에 영향을 미칩니다."
 SAU_eco_diversify_good: "§G사우디 경제§! - 다각화"
 SAU_eco_diversify_good_desc: "관광, 산업, 물류, 금융이 이제 석유 배럴 곁에서 실질적인 비중을 차지합니다. 왕국의 소득은 더 이상 단일 가격에 매달려 있지 않습니다."
 SAU_eco_industry_bad: "§R사우디 경제§! - 수입 의존"
 SAU_eco_industry_bad_desc: "사우디의 진열대에 놓인 거의 모든 것이 배로 들어옵니다. 석유 부문을 제외하면 왕국은 소비하는 것 중 거의 아무것도 만들지 않습니다."
 SAU_eco_industry_good: "§G사우디 경제§! - 국내 산업"
 SAU_eco_industry_good_desc: "사우디 공장이 이제 왕국이 한때 수입하던 것을 공급하며, 무역 장부가 이를 보여 줍니다."
 SAU_eco_labour_bad: "§R사우디 경제§! - 외국인 노동"
 SAU_eco_labour_bad_desc: "수백만 명의 외국인이 왕국의 일을 하는 동안, 젊은 사우디인들은 더는 존재하지 않는 정부의 한직을 기다립니다."
 SAU_eco_labour_good: "§G사우디 경제§! - 사우디 인력"
 SAU_eco_labour_good_desc: "사우디인이 현장에서 임원실에 이르기까지 사우디의 일자리를 채웁니다. 급여는 왕국에 남습니다."
 SAU_econ_industry_first: "§H경제 모델§! - 산업 우선"
 SAU_econ_industry_first_desc: "왕국은 철강, 제련, 가공, 그 밖의 중공업을 우선시합니다. 이는 산업 생산량을 높이지만 더 많은 소비재와 인력을 필요로 합니다."
 SAU_econ_mixed: "§H경제 모델§! - 혼합 경로"
 SAU_econ_mixed_desc: "왕국은 산업과 서비스를 동시에 발전시킵니다. 성장은 단일 부문 전략보다 덜 집중되어 있어 경제의 회복력이 더 높습니다."
 SAU_econ_services: "§H경제 모델§! - 서비스 우선"
 SAU_econ_services_desc: "왕국은 숙련된 사우디인 일자리의 원천으로 은행, 물류, 금융, 관광을 우선시합니다. 이는 지식 경제를 개선하지만 산업 역량은 덜 제공합니다."
 SAU_economic_cities: "경제 도시 구상"
 SAU_economic_cities_desc: "압둘라 국왕 경제 도시를 비롯한 계획 도시 중심지들이 사무실, 산업, 서비스에 대한 투자를 끌어들이고 있습니다. 이 맞춤형 도시들은 비석유 경제 성장의 엔진 역할을 합니다."
 SAU_economy: "§H사우디 경제§!"
 SAU_economy_desc: "2000년의 사우디 경제는 §L석유는 풍부하나 다각화되지 못했으며§!, 자본 도피, 수입 의존, 관료적 형식주의, 외국인 노동력 의존, 단일 상품에 대한 중독에 짓눌려 있습니다. §H경제 트리§!의 각 중점은 약점 하나를 바로잡고 SABIC 산업 기반을 구축합니다. 트리를 완성하면 §R심각한 페널티§!가 §G균형 잡힌 다각화된 경제§!로 바뀝니다.\n\n§Y아래: 모든 경제 하위 체계가 표시됩니다. 아직 망가진 곳은 빨간색, 개혁된 곳은 초록색입니다.§!"
 SAU_economy_tt: "[SAU_eco_capital_loc][SAU_eco_industry_loc][SAU_eco_bureau_loc][SAU_eco_labour_loc][SAU_eco_diversify_loc][SAU_eco_model_loc][SAU_eco_cities_loc]"
 SAU_faisalite_balanced: "파이살주의 균형"
 SAU_faisalite_balanced_desc: "왕국은 국내 자립과 제한적인 해외 관여를 결합하며 어느 쪽도 고정된 교리로 삼지 않습니다. 해외 책무가 늘어날수록 이 균형을 유지하기는 더 어려워집니다."
 SAU_faisalite_closed_schools: "학교 폐쇄"
 SAU_faisalite_closed_schools_desc: "외국 교육과정은 사라졌지만 이를 대체할 것은 아직 아무것도 마련되지 않았습니다. 한 세대의 학생이 그 공백으로 수년을 잃게 될 것입니다."
 SAU_faisalite_conviction_decided: "파이살주의 서클: 결정됨"
 SAU_faisalite_conviction_dormant: "파이살주의 서클: 잠복"
 SAU_faisalite_conviction_gathering: "파이살주의 서클: 결집 중"
 SAU_faisalite_conviction_insistent: "파이살주의 서클: 집요함"
 SAU_faisalite_conviction_stirring: "파이살주의 서클: 동요 중"
 SAU_faisalite_creditor_of_the_ummah: "움마의 채권자"
 SAU_faisalite_creditor_of_the_ummah_desc: "무슬림 국가들에 대한 사우디의 장기 대출은 리야드에 채무국 정부에 대한 영향력을 부여합니다. 상환 유예는 그들의 단기적 의존과 호의를 강화합니다."
 SAU_faisalite_foreign_endowments: "해외 기부"
 SAU_faisalite_foreign_endowments_desc: "사우디의 돈이 십여 개 외국 대학의 석좌 교수직과 도서관에 기부되며, 사우디 학생들은 아무 저항 없이 그 안으로 들어갑니다."
 SAU_faisalite_import_rationing: "수입 배급제"
 SAU_faisalite_import_rationing_desc: "허가증은 아껴 발급되고 부처 앞에는 줄이 늘어섭니다. 왕국이 살 수 없는 것은 국내에서 찾아야 하며, 예상보다 꽤 많은 것을 찾아내고 있습니다."
 SAU_faisalite_interventionist_dominant: "§R개입주의 우세§!"
 SAU_faisalite_interventionist_dominant_desc: "정상회담, 보조금, 군사 고문단은 사우디아라비아를 무슬림 세계의 중심 강국으로 만들었습니다. 이 영향력은 또한 왕국이 국경 밖의 값비싼 분쟁에 책임을 지게 만듭니다."
 SAU_faisalite_interventionist_leaning: "§R개입주의 성향§!"
 SAU_faisalite_interventionist_leaning_desc: "왕국은 다시 해외에 돈을 쓰고 있으며 그 덕에 목소리를 얻고 있습니다. 파이살은 아직 규모는 아닐지라도 그 방향은 알아보았을 것입니다."
 SAU_faisalite_isolationist_dominant: "§O고립주의 우세§!"
 SAU_faisalite_isolationist_dominant_desc: "사우디아라비아는 대부분의 외국 영향력과 의무에서 스스로를 닫았습니다. 이는 독립성을 보존하지만 외부 지식에 대한 접근을 줄이고 외교적으로 고립시킵니다."
 SAU_faisalite_isolationist_leaning: "§O고립주의 성향§!"
 SAU_faisalite_isolationist_leaning_desc: "왕국은 안으로 움츠러들고 있습니다. 외국인의 손길은 줄고, 외국에 대한 의무도 줄며, 외교관들이 할 일은 점점 적어집니다."
 SAU_faisalite_labour_shortage: "노동력 부족"
 SAU_faisalite_labour_shortage_desc: "왕국의 비계 절반이 비어 있습니다. 그것을 지키던 이들은 고국으로 돌아갔고, 그들을 대체할 예정이던 이들은 아직 도착하지 않았습니다."
 SAU_faisalite_nationalised_management: "경영진 국민화"
 SAU_faisalite_nationalised_management_desc: "외국인 관리자들은 떠났고 후임자들은 일을 하며 일을 배우고 있습니다. 공장은 그럭저럭 여전히 돌아가고 있습니다."
 SAU_faisalite_officers_abroad: "해외의 장교단"
 SAU_faisalite_officers_abroad_desc: "참모 중 최고의 인재들이 타국의 군대에 조언을 하고 있습니다. 자국 부대는 그들의 부재를 느낍니다."
 SAU_faisalite_street_movement: "거리가 파이살을 기억하다"
 SAU_faisalite_street_movement_desc: "대중 운동이 석유 금수 조치와 서방의 압력에 대한 저항을 강조하며 파이살 국왕을 사우디 독립의 본보기로 내세우고 있습니다. 그의 통치에 대한 단순화된 설명은 모스크에서 대학 캠퍼스로 퍼졌으며 이제 조직적인 반대 운동을 지탱하고 있습니다."
 SAU_forces_modernized: "현대화된 군대"
 SAU_forces_modernized_desc: "완전히 현대적인 전문 군대입니다. 지역의 어느 군대에도 뒤지지 않으며 이란에 대한 진정한 균형추입니다."
 SAU_forces_modernizing: "현대화 중인 군대"
 SAU_forces_modernizing_desc: "훈련, 교리, 장비가 서방 표준을 따라잡고 있습니다. 군대는 이제 이웃 국가들에 맞설 만합니다."
 SAU_forces_reforming: "개혁 중인 군대"
 SAU_forces_reforming_desc: "첫 개혁이 자리를 잡고 있으며 낡은 약점 중 최악의 것들이 사라지고 있습니다. 현대화를 계속하십시오."
 SAU_forces_unmodernized: "현대화되지 않은 군대"
 SAU_forces_unmodernized_desc: "수십 년간의 외국 계약업체 의존과 낡은 교리가 군대를 준비되지 않은 상태로 남겼습니다. §Y군대 현대화§! 결정을 사용하여 단계적으로 개혁하십시오."
 SAU_fortified_kingdom: "요새 아라비아"
 SAU_fortified_kingdom_desc: "강화된 기지, 다층 대공 방어, 해안 수비대는 이란의 공격을 견뎌 내는 사우디아라비아의 능력을 높입니다."
 SAU_french_investment_pact_FRA: "사우디-프랑스 투자 협정"
 SAU_french_investment_pact_FRA_desc: "국가가 후원하는 협정이 사우디 시장을 프랑스 산업에 개방하고 걸프 자본을 프랑스로 들여옵니다."
 SAU_grievance_bitter: "장교단: 불만 쌓임"
 SAU_grievance_brink: "장교단: 한계 직전"
 SAU_grievance_contained: "장교단: 억제됨"
 SAU_grievance_mutinous: "장교단: 반란 기운"
 SAU_grievance_restive: "장교단: 동요함"
 SAU_guardian_of_palestine: "팔레스타인의 수호자"
 SAU_guardian_of_palestine_desc: "팔레스타인의 대의를 옹호함으로써 왕국은 무슬림 세계 전반에서 입지를 얻었고, 국내외에서 왕좌에 정당성을 부여했습니다."
 SAU_gulf_war_lessons: "걸프전의 교훈"
 SAU_gulf_war_lessons_desc: "1991년 걸프전은 사우디의 장비, 교리, 지휘에서 심각한 약점을 드러냈습니다. 총참모부는 군 개혁을 위한 경쟁 모델들을 연구하고 있으나 아직 하나를 선택하지는 않았습니다.\n\n§G+5%§! 육군 경험치 획득\n§G+5%§! 계획 속도\n\n§Y'병법 연습: 걸프전의 교훈' 결정을 실행하여 교리를 선택하십시오.§!"
 SAU_hajj_management_01: "두 성원의 수호자"
 SAU_hajj_management_01_desc: "메카와 메디나의 수호자로서 사우디 정부는 매년 열리는 하지 순례를 관장하며, 전 세계에서 매년 약 200만 명의 무슬림을 맞이합니다. 순례는 관광, 운송, 숙박업을 통해 상당한 수익을 창출하는 동시에 왕국에 무슬림 세계 전반에서 비할 데 없는 종교적 위신을 부여합니다."
 SAU_hormuz_shield: "호르무즈 방패"
 SAU_hormuz_shield_desc: "사우디 해군의 호위가 호르무즈 해협을 통과하는 유조선을 보호하고 석유 수송을 방해하려는 이란의 능력을 줄입니다."
 SAU_IMEC_india_deal_new: "IMEC 회랑"
 SAU_IMEC_india_deal_new_desc: "인도-중동-유럽 회랑은 인도의 교역을 사우디의 항구와 철도로 흘려보냅니다. 왕국은 새로운 실크로드의 통행료를 거둡니다."
 SAU_IMEC_india_deal_new_loc: "\n§H[RAJ.GetFlag] 인도-중동-유럽 경제 회랑§!(IMEC) [SAU.GetFlag]\n건설 속도: §G+5.00%§!\n화석 연료당 연료 획득: §G+3.00%§!\n§H자원 수출 수익§! 승수: §G+1.50%§!\n"
 SAU_India_one_IMEC_india_deal: "[RAJ.GetFlag] §H인도-중동-유럽 경제 회랑§![SAU.GetFlag](IMEC)"
 SAU_India_one_IMEC_india_deal_desc: "인도-중동-유럽 경제 회랑은 인도의 항구를 걸프를 거쳐 철도와 해상으로 유럽 시장과 연결합니다. 인도는 회랑의 동쪽 관문에 서 있으며 모든 화물에서 이익을 얻습니다."
 SAU_iraq_border_defense: "북부 국경 방어"
 SAU_iraq_border_defense_desc: "군은 이라크 국경을 따라 참호를 파고 1990년의 재현에 대비하고 있습니다. 이라크에 대한 방어 +10%. 사담이 사라지면 해제됩니다."
 SAU_iraq_pipeline_t1: "유럽 송유관(1단계)"
 SAU_iraq_pipeline_t1_desc: "사우디의 석유가 이라크를 거쳐 튀르키예와 모스크바가 그토록 시샘하며 지키는 유럽 시장으로 북상합니다. 송유관 수출로 §G추가 수입: $ 2.25B§!, 송유관이 지나는 국가들에 내는 통과 수수료로 §R추가 지출: $ 1.00B§!가 발생하여 주당 순 §G+$ 1.25B§!입니다. 파괴 공작은 송유관을 한 단계 떨어뜨려 양쪽을 모두 줄이며, 1단계 송유관이 끊기면 노선이 폐쇄됩니다."
 SAU_iraq_pipeline_t2: "유럽 송유관(2단계)"
 SAU_iraq_pipeline_t2_desc: "사우디의 석유가 이라크를 거쳐 튀르키예와 모스크바가 그토록 시샘하며 지키는 유럽 시장으로 북상합니다. 송유관 수출로 §G추가 수입: $ 2.75B§!, 송유관이 지나는 국가들에 내는 통과 수수료로 §R추가 지출: $ 1.15B§!가 발생하여 주당 순 §G+$ 1.60B§!입니다. 파괴 공작은 송유관을 한 단계 떨어뜨려 양쪽을 모두 줄이며, 1단계 송유관이 끊기면 노선이 폐쇄됩니다."
 SAU_iraq_pipeline_t3: "유럽 송유관(3단계)"
 SAU_iraq_pipeline_t3_desc: "사우디의 석유가 이라크를 거쳐 튀르키예와 모스크바가 그토록 시샘하며 지키는 유럽 시장으로 북상합니다. 송유관 수출로 §G추가 수입: $ 3.25B§!, 송유관이 지나는 국가들에 내는 통과 수수료로 §R추가 지출: $ 1.25B§!가 발생하여 주당 순 §G+$ 2.00B§!입니다. 파괴 공작은 송유관을 한 단계 떨어뜨려 양쪽을 모두 줄이며, 1단계 송유관이 끊기면 노선이 폐쇄됩니다."
 SAU_islamic_leadership: "이슬람 세계의 지도자"
 SAU_islamic_leadership_desc: "사우디아라비아의 메카와 메디나 관리권, 그리고 주요 이슬람 정상회담에서의 역할은 리야드에 무슬림 세계 전반의 상당한 영향력을 부여합니다."
 SAU_israel_tech_partnership: "실리콘과 모래"
 SAU_israel_tech_partnership_desc: "리야드 협정은 사우디의 투자와 이스라엘의 기술을 결합하고 양국의 공동 연구를 지원합니다."
 SAU_junta_accepted: "위원회: 수용됨"
 SAU_junta_contested: "위원회: 논란 중"
 SAU_junta_illegitimate: "위원회: 정통성 없음"
 SAU_junta_rejected: "위원회: 거부됨"
 SAU_junta_tolerated: "위원회: 묵인됨"
 SAU_laf_offensive: "삼나무 결의 작전"
 SAU_laf_offensive_desc: "사우디의 자금과 장비는 레바논군이 헤즈볼라에 맞서 공세 작전을 수행할 능력과 의지를 높였습니다."
 SAU_national_water_pride_minus1: "§H주권의 물§! - §Y의심§!"
 SAU_national_water_pride_minus1_desc: "안정도 35~44%에서는 §L사우디 소유§! 물 사업에 대한 대중의 신뢰가 약해지고 있습니다. 이는 왕조에 §Y소폭의 정통성 손실§!을 초래합니다."
 SAU_national_water_pride_minus2: "§H주권의 물§! - §R긴장§!"
 SAU_national_water_pride_minus2_desc: "낮은 안정도는 §L국가 물 사업§!에 대한 사적인 비판을 키웠습니다. 저조한 성과가 왕조의 평판을 해치고 있습니다."
 SAU_national_water_pride_minus3: "§H주권의 물§! - §R역효과§!"
 SAU_national_water_pride_minus3_desc: "물 사업은 정부 실책의 두드러진 사례가 되었습니다. 계속되는 물 부족은 왕조에 대한 §R심각한 지지 상실§!을 초래하고 있습니다."
 SAU_national_water_pride_minus4: "§H주권의 물§! - §R파국§!"
 SAU_national_water_pride_minus4_desc: "§R극심한 불안정§! 상황에서 물 부족은 §H알사우드 가문§!의 정통성을 심각하게 훼손했습니다. 안정도가 회복되거나 왕조가 무너져야만 이 페널티가 끝납니다."
 SAU_national_water_pride_neutral: "§H주권의 물§! - §Y안정적§!"
 SAU_national_water_pride_neutral_desc: "안정도 약 50%에서는 국가 물 사업이 정치적 이득도 페널티도 주지 않습니다. 안정도가 변하면 긍정 또는 부정 단계로 이동합니다."
 SAU_national_water_pride_plus1: "§H주권의 물§! - §G만족§!"
 SAU_national_water_pride_plus1_desc: "충분한 안정도와 믿을 수 있는 물 공급 서비스는 왕조의 평판을 지키고 §G완만한§! 정치적 이득을 제공합니다."
 SAU_national_water_pride_plus2: "§H주권의 물§! - §G번영§!"
 SAU_national_water_pride_plus2_desc: "강한 안정도와 §L사우디 소유§! 담수화 체계의 안정적인 운영은 정부의 능력을 보여 주고 §H알사우드 가문§!에 대한 존경심을 높입니다."
 SAU_national_water_pride_plus3: "§H주권의 물§! - §G자신감§!"
 SAU_national_water_pride_plus3_desc: "높은 안정도는 국가 물 사업을 §H국내 위신의 원천§!으로 만들었습니다. 해외에서 높아진 §LKAUST§! 전문 지식에 대한 수요와 사업의 재정적 수익이 추가적인 이득을 제공합니다."
 SAU_national_water_pride_plus4: "§H주권의 물§! - §G승리§!"
 SAU_national_water_pride_plus4_desc: "최고 수준의 안정도에서 §L사우디 소유§! 물 사업은 중대한 국가적 성취로 널리 평가받습니다. 그 성공은 §H알사우드 가문§!에 이 사업에서 얻을 수 있는 최대한의 정통성 이득을 부여합니다."
 SAU_nda_free_press: "자유 언론"
 SAU_nda_free_press_loc: "[SAU.GetFlag]자유 언론\n§H정치력 획득:§! §G+5.00%§! \n§H외국 영향력 방어:§! §G+20.00%§!\n\n"
 SAU_nda_free_world: "자유 세계의 일원"
 SAU_nda_free_world_loc: "[SAU.GetFlag]자유 세계의 일원\n§H무역 관계:§! §G+15.00%§!\n§H월간 관계 획득:§! §G+20.00%§!\n\n"
 SAU_nda_knowledge_economy: "지식 경제"
 SAU_nda_knowledge_economy_loc: "[SAU.GetFlag]지식 경제\n§H연구 속도:§! §G+5.00%§!\n§H안정도:§! §G+3.00%§!\n\n"
 SAU_nda_open_market: "개방 시장"
 SAU_nda_open_market_loc: "[SAU.GetFlag]개방 시장\n§H소비재:§! §G-10.00%§!\n§H외국인 투자 비용:§! §G-5.00%§!\n§H투자 수익률:§! §G+5.00%§!\n\n"
 SAU_neom_aqaba_zone: "네옴-아카바 경제 구역"
 SAU_neom_aqaba_zone_desc: "사우디의 거대 도시 네옴과 요르단의 항구 아카바는 하나의 국경 간 경제 구역으로 운영되어 건설을 가속하고 국고를 채웁니다."
 SAU_oil_defend_price_idea: "가격 방어"
 SAU_oil_defend_price_idea_desc: "사우디아라비아는 세계 유가를 떠받치기 위해 생산을 줄였습니다. 이는 배럴당 수입을 개선하지만 생산량을 유지하는 생산국에 시장 점유율을 내주게 됩니다."
 SAU_oil_dependence_t1: "§G석유 경제§! - 다각화"
 SAU_oil_dependence_t1_desc: "§H석유 의존도: §!§Y[?oil_dependence|0]§!§H / 100§!\n§R3개월마다 자동으로 변동합니다§!\n\n현대적이고 다각화된 경제입니다. 석유는 여러 수출품 중 하나일 뿐이며, 왕국은 원유 가격이 어떻게 변하든 §G회복력이 있습니다§!. 비전 2030이 달성되었습니다."
 SAU_oil_dependence_t2: "§Y석유 경제§! - 폭넓은 기반"
 SAU_oil_dependence_t2_desc: "§H석유 의존도: §!§Y[?oil_dependence|0]§!§H / 100§!\n§R3개월마다 자동으로 변동합니다§!\n\n산업, 서비스, 기술이 이제 실질적인 비중을 차지합니다. 석유 충격은 파국이 아니라 견딜 수 있는 일입니다."
 SAU_oil_dependence_t3: "§Y석유 경제§! - 다각화 진행 중"
 SAU_oil_dependence_t3_desc: "§H석유 의존도: §!§Y[?oil_dependence|0]§!§H / 100§!\n§R3개월마다 자동으로 변동합니다§!\n\n경제의 기반이 넓어지고 있습니다. 석유는 여전히 가장 큰 기둥이지만 더 이상 중요한 유일한 기둥은 아닙니다."
 SAU_oil_dependence_t4: "§R석유 경제§! - 석유 의존"
 SAU_oil_dependence_t4_desc: "§H석유 의존도: §!§Y[?oil_dependence|0]§!§H / 100§!\n§R3개월마다 자동으로 변동합니다§!\n\n비석유 부문이 성장하고 있지만 원유는 여전히 거의 모든 것의 비용을 댑니다. 가격 폭락은 여전히, 심각하게 타격을 줄 것입니다."
 SAU_oil_dependence_t5: "§R석유 경제§! - 완전한 석유 국가"
 SAU_oil_dependence_t5_desc: "§H석유 의존도: §!§Y[?oil_dependence|0]§!§H / 100§!\n§R3개월마다 자동으로 변동합니다§!\n\n왕국은 배럴에 의해 흥하고 망합니다. 석유는 예산의 §G거의 전부§!로, 막대한 수익을 내지만 세계 가격의 붕괴에 §R위험할 정도로 노출되어 있습니다§!.\n§Y석유 의존도는 중점과 결정을 통해서만 변합니다. 석유 관련 선택은 이를 높이고 다각화는 낮춥니다. 왕국은 깊은 의존 상태에서 시작하며, 지속적인 개혁만이 이를 낮추고 그대로 두면 그 자리에 머뭅니다.§!"
 SAU_oil_embargoed: "§R석유 금수 조치§!"
 SAU_oil_embargoed_desc: "사우디아라비아와 OPEC 파트너들이 석유를 끊었습니다. 금수 조치가 해제될 때까지 연료를 사려는 줄, 공장 가동 중단, 치솟는 가격이 경제를 짓누릅니다."
 SAU_oil_for_security_pact: "석유와 안보의 교환"
 SAU_oil_for_security_pact_desc: "왕국은 미국 시장에 석유를 계속 공급하고, 워싱턴은 사우디의 안보를 보장합니다. 이 합의는 리얄, 달러, 그리고 사우드 가문을 똑같이 떠받칩니다."
 SAU_oil_for_security_pact_loc: "[USA.GetFlag]석유와 안보의 교환\n§H화석 연료 수출 수익 승수:§! §G+5.00%§!\n"
 SAU_oil_for_security_pact_USA: "석유와 안보의 교환"
 SAU_oil_for_security_pact_USA_desc: "리야드는 미국 시장에 대한 석유 공급을 보장합니다. 미국의 안보 우산을 얻는 대가로 값싸고 안정적인 연료를 제공합니다."
 SAU_oil_market_share_idea: "시장 점유율 방어"
 SAU_oil_market_share_idea_desc: "사우디아라비아는 석유 시장에서의 점유율을 지키기 위해 높은 생산량을 유지하고 낮은 가격을 감수하고 있습니다. 낮은 채굴 비용 덕분에 더 비싼 생산국들보다 오래 버틸 수 있습니다."
 SAU_oil_price_collapse_idea: "유가 폭락"
 SAU_oil_price_collapse_idea_desc: "유가가 국가 예산이 전제한 수준을 크게 밑돌고 있습니다. 수출 소득은 줄었지만 복지 지출은 여전히 높아, 정부는 보유고를 헐어 써야 합니다."
 SAU_OPEC_Russia_deal_new: "OPEC+ 공조"
 SAU_OPEC_Russia_deal_new_desc: "리야드와 모스크바가 함께 생산 쿼터를 정합니다. 두 석유 초강대국이 하나의 시장을 조종합니다."
 SAU_OPEC_Russia_deal_new_loc: "\n§H[SAU.GetFlag]OPEC+ 합의[SOV.GetFlag]§!\n§H화석 연료 수출 수익 승수:§! §G+5.00%§!\n"
 SAU_pipeline_empire: "에너지의 교차로"
 SAU_pipeline_empire_desc: "사우디아라비아는 이제 세 바다로 이어지는 석유 수출 경로를 갖추었으며, 호르무즈 해협을 유일한 주요 출구로 삼아 의존하지 않게 되었습니다."
 SAU_pipeline_transit_IRQ_t1: "사우디 송유관 통과(1단계)"
 SAU_pipeline_transit_IRQ_t1_desc: "사우디의 석유가 이라크를 가로지르며, 통과 수수료가 국고를 불립니다. 송유관은 국가의 석유 생산량을 끌어올립니다. §G추가 수입: $1.00B§!"
