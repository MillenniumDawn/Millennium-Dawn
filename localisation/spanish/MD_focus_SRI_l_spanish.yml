 news.91.t: "Fin de la Guerra Civil de Sri Lanka"
 news.91.d: "The Sri Lankan government has declared total victory over the Liberation Tigers of Tamil Eelam. In a final series of offensives across the north-east, government forces overran the last Tiger strongholds. In the closing days of the war, the remaining Tamil fighters were encircled along the lagoons and jungles of Mullaitivu. Cut off from escape, any attempts to flee by sea were intercepted. The leadership of the Tigers, long thought untouchable, has reportedly been killed in the final hours of the conflict. Addressing parliament, President [SRI.GetLeader] proclaimed that the nation had been 'liberated from terrorism'. For now, the Lion flag flies unchallenged across the island."
 news.91.a: "Paz… a un precio."
 news.92.t: "Liberación de Eelam por los Tigres Tamiles"
 news.92.d: "Lo que una vez fue una guerra de desgaste ha concluido. Los Tigres de Liberación de Tamil Eelam han triunfado. En los últimos días del conflicto, los últimos bastiones del Estado de Sri Lanka en las tierras de Tamil Eelam se derrumbaron bajo un ataque implacable. Las líneas de suministro se desmoronaron, las pistas de aterrizaje ardieron y el otrora formidable ejército se encontró cercado y abandonado. Los Tigres de Tamil Eelam se impusieron desde la jungla no como insurgentes, sino como líderes. El sueño de Tamil Eelam, escrito con sangre y sacrificio, se ha hecho realidad por fin."
 news.92.a: "Interesante."