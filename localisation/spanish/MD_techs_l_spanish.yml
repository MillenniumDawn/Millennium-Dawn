 nsb_gun_technology_3_desc: "Potentes sistemas de artillería y cohetes diseñados para aumentar la potencia de fuego en el campo de batalla. Este avance introduce obuses pesados, armamento de cohetes a gran escala y munición de artillería especializada para una mayor capacidad destructiva. Además, permite el despliegue de módulos de cohetes, lo que proporciona a las plataformas aéreas un mayor potencial de ataque. Estos sistemas ofrecen un apoyo superior a larga distancia, lo que los hace esenciales para dominar el campo de batalla."
 nsb_gun_technology_4: "Sistemas de Armas Pesadas y Artillería de 4ª Generación"
 nsb_gun_technology_4_desc: "Potentes sistemas de artillería y cohetes diseñados para aumentar la potencia de fuego en el campo de batalla. Este avance introduce obuses pesados, armamento de cohetes a gran escala y munición de artillería especializada para una mayor capacidad destructiva. Además, permite el despliegue de módulos de cohetes, lo que proporciona a las plataformas aéreas un mayor potencial de ataque. Estos sistemas ofrecen un apoyo superior a larga distancia, lo que los hace esenciales para dominar el campo de batalla."
 nsb_gun_technology_5: "Sistemas de Armas Pesadas y Artillería de 5ª Generación"
 nsb_gun_technology_5_desc: "Potentes sistemas de artillería y cohetes diseñados para aumentar la potencia de fuego en el campo de batalla. Este avance introduce obuses pesados, armamento de cohetes a gran escala y munición de artillería especializada para una mayor capacidad destructiva. Además, permite el despliegue de módulos de cohetes, lo que proporciona a las plataformas aéreas un mayor potencial de ataque. Estos sistemas ofrecen un apoyo superior a larga distancia, lo que los hace esenciales para dominar el campo de batalla."
 nsb_artillery_ammo_1: "Munición de Artillería de 1ª Generación"
 nsb_artillery_ammo_1_desc: "Munición especializada diseñada para su uso en armas de gran calibre como obuses, cañones de campaña y artillería autopropulsada. Se presenta en diversos tipos, cada uno adaptado a funciones específicas en el campo de batalla, incluyendo proyectiles de alto explosivo para un impacto destructivo, proyectiles perforantes para penetrar objetivos fortificados y proyectiles de humo o iluminación para apoyo táctico."
 nsb_artillery_ammo_2: "Munición de Artillería de 2ª Generación"
 nsb_artillery_ammo_2_desc: "Munición especializada diseñada para su uso en armas de gran calibre como obuses, cañones de campaña y artillería autopropulsada. Se presenta en diversos tipos, cada uno adaptado a funciones específicas en el campo de batalla, incluyendo proyectiles de alto explosivo para un impacto destructivo, proyectiles perforantes para penetrar objetivos fortificados y proyectiles de humo o iluminación para apoyo táctico."
 nsb_artillery_ammo_3: "Munición de Artillería de 3ª Generación"
 nsb_artillery_ammo_3_desc: "Munición especializada diseñada para su uso en armas de gran calibre como obuses, cañones de campaña y artillería autopropulsada. Se presenta en diversos tipos, cada uno adaptado a funciones específicas en el campo de batalla, incluyendo proyectiles de alto explosivo para un impacto destructivo, proyectiles perforantes para penetrar objetivos fortificados y proyectiles de humo o iluminación para apoyo táctico."
 nsb_artillery_ammo_4: "Munición de Artillería de 4ª Generación"
 nsb_artillery_ammo_4_desc: "Munición especializada diseñada para su uso en armas de gran calibre como obuses, cañones de campaña y artillería autopropulsada. Se presenta en diversos tipos, cada uno adaptado a funciones específicas en el campo de batalla, incluyendo proyectiles de alto explosivo para un impacto destructivo, proyectiles perforantes para penetrar objetivos fortificados y proyectiles de humo o iluminación para apoyo táctico."
 nsb_artillery_ammo_5: "Munición de Artillería de 5ª Generación"
 nsb_artillery_ammo_5_desc: "Munición especializada diseñada para su uso en armas de gran calibre como obuses, cañones de campaña y artillería autopropulsada. Se presenta en diversos tipos, cada uno adaptado a funciones específicas en el campo de batalla, incluyendo proyectiles de alto explosivo para un impacto destructivo, proyectiles perforantes para penetrar objetivos fortificados y proyectiles de humo o iluminación para apoyo táctico."
 nsb_special_ammo_1: "Actualización básica de municiones"
 nsb_special_ammo_1_desc: "Introduce mejoras en las municiones convencionales, perfeccionando los diseños de los proyectiles e incrementando la eficiencia explosiva."
 nsb_special_ammo_2: "Desarrollo de municiones mejoradas"
 nsb_special_ammo_2_desc: "Rendimientos explosivos mejorados y diseños aerodinámicos optimizados. Los avances en los sistemas de propulsión y los mecanismos de detonación aumentan el alcance, la precisión y la efectividad general, garantizando un rendimiento superior en el campo de batalla contra una variedad de objetivos."
 nsb_special_ammo_3: "Sistemas avanzados de ojivas"
 nsb_special_ammo_3_desc: "Tecnologías de ojivas especializadas diseñadas para maximizar el impacto en diferentes escenarios de combate. Las innovaciones en la eficiencia de la explosión, las capacidades de penetración y las espoletas adaptativas mejoran tanto las aplicaciones de fuego directo como las de efecto de área, mejorando significativamente la letalidad y la flexibilidad operativa."
 nsb_barrel_conversions: "Conversión Temprana de Cañón"
 nsb_barrel_conversions_desc: "La Conversión Temprana del Cañón representa un primer paso en la mejora de la potencia de fuego de la artillería, modificando los diseños de cañones existentes para adaptarlos a un rendimiento balístico mejorado. Esta mejora aumenta la durabilidad del cañón, mejora la velocidad del proyectil y amplía el alcance de disparo efectivo, lo que permite un bombardeo más consistente y fiable. Al perfeccionar las técnicas de estriado y reforzar los materiales del cañón, esta conversión mejora la precisión y la eficiencia general, sentando las bases para desarrollos de artillería más avanzados. Si bien aún está limitada por las limitaciones iniciales de fabricación, esta mejora supone un avance significativo en la eficacia de la artillería en el campo de batalla."
 nsb_fire_modes_1: "Doctrina de Barrera Estándar"
 nsb_fire_modes_1_desc: "La Doctrina de Bombardeo Estándar establece un enfoque fundamental para la guerra de artillería, centrándose en misiones de fuego planificadas y coordinadas para debilitar las posiciones enemigas antes de un asalto. Esta doctrina se basa en patrones de fuego calculados para desbaratar las formaciones enemigas, destruir estructuras defensivas y crear oportunidades para el avance de las fuerzas. Al mantener un equilibrio entre potencia de fuego y precisión, garantiza una supresión eficaz en el campo de batalla sin un gasto excesivo de munición. Si bien es menos intensa que las tácticas de fuego de saturación, la Doctrina de Bombardeo Estándar sigue siendo un método versátil y fiable para proporcionar fuego de apoyo sostenido tanto en operaciones ofensivas como defensivas."
 nsb_fire_modes_2: "Doctrina de Fuego Sostenido"
 nsb_fire_modes_2_desc: "La Doctrina de Fuego Sostenido enfatiza el bombardeo de artillería continuo y metódico para mantener la presión sobre las fuerzas enemigas durante periodos prolongados. Al asegurar un flujo constante de potencia de fuego, esta doctrina interrumpe los movimientos enemigos, suprime los contraataques y debilita las posiciones defensivas mediante enfrentamientos prolongados. Diseñada para la guerra de desgaste, maximiza la eficiencia logística al equilibrar la cadencia de fuego con la conservación de munición, permitiendo a las unidades de artillería mantener su efectividad en combate durante operaciones prolongadas. Si bien no es tan abrumador de inmediato como las tácticas de fuego masivo, el fuego sostenido asegura el control del campo de batalla al degradar gradualmente las fuerzas y la moral enemigas."
 nsb_fire_modes_3: "Doctrina de Apoyo de Fuego Superior"
 nsb_fire_modes_3_desc: "The Superior Fire Support Doctrine focuses on overwhelming enemy positions with sustained and large-scale artillery barrages. By prioritizing sheer volume of fire over precision, this doctrine ensures battlefield dominance through relentless bombardment, suppressing enemy forces, destroying fortifications, and creating devastating area effects. Coordinated fire missions allow multiple artillery units to saturate designated zones, forcing enemies into defensive positions and limiting their mobility. While resource-intensive, this doctrine is highly effective in prolonged engagements and large-scale warfare, ensuring superior firepower supremacy."
 nsb_AA_autocannon_1: "Desarrollo de cañones automáticos de posguerra"
 nsb_AA_autocannon_1_desc: "Este desarrollo se centra en perfeccionar los cañones automáticos tanto para aplicaciones terrestres como antiaéreas. Las mejoras en la cadencia de tiro, la eficiencia de la munición y la durabilidad del tubo permiten una supresión más efectiva de la infantería, los vehículos y las amenazas aéreas. Con la integración de una ingeniería balística mejorada, estos cañones automáticos de nueva generación ofrecen una fiabilidad y letalidad superiores en el campo de batalla."
 nsb_AA_autocannon_2: "Desarrollo de cañones automáticos de la Guerra Fría"
 nsb_AA_autocannon_2_desc: "A medida que la tecnología militar avanzaba durante la Guerra Fría, el desarrollo de cañones automáticos modernos se convirtió en una prioridad tanto para el combate terrestre como para el aéreo. Este avance introduce diseños perfeccionados con una gestión del retroceso mejorada, mayores cadencias de tiro y una mejor disipación del calor, lo que permite combates sostenidos. Los sistemas de puntería optimizados y la munición mejorada aumentan aún más su efectividad contra vehículos blindados, infantería y aeronaves de bajo vuelo. Estas innovaciones marcan un salto significativo en la potencia de fuego, garantizando un rendimiento superior en el campo de batalla en escenarios de combate que evolucionan rápidamente."
 nsb_AA_autocannon_3: "Desarrollo moderno de cañones automáticos"
 nsb_AA_autocannon_3_desc: "Basándose en los avances de la era de la Guerra Fría, el desarrollo de cañones automáticos modernos se centra en armamento de alta precisión y tiro rápido capaz de enfrentarse a una amplia gama de amenazas. Estos cañones automáticos de próxima generación cuentan con compensación avanzada del retroceso, mayor durabilidad e integración con sistemas inteligentes de puntería. Las mejoras en la munición, incluidos los proyectiles programables de explosión aérea (airburst) y las municiones perforantes, mejoran aún más su versatilidad. Con una precisión superior, capacidad de fuego sostenido y adaptabilidad en múltiples plataformas, estas armas forman la columna vertebral de los vehículos de combate de infantería, aviones y sistemas navales modernos."
 nsb_AA_autocannon_4: "Desarrollo avanzado de cañones automáticos"
 nsb_AA_autocannon_4_desc: "Llevando los límites de la potencia de fuego un paso más allá, el Desarrollo Avanzado de Cañones Automáticos introduce sistemas de armas de última generación diseñados para una letalidad, precisión y adaptabilidad superiores. Estos cañones automáticos de próxima generación cuentan con sistemas automatizados de control de tiro, puntería integrada asistida por IA y capacidades polivalentes, lo que permite un combate eficaz contra la infantería, el blindaje, los aviones y los drones. Los avances en propulsión electromagnética, municiones de alta energía y tipos de proyectiles adaptativos garantizan un rendimiento sin precedentes. Con un retroceso reducido, mayores cadencias de fuego sostenido y una integración perfecta con las redes de guerra digital, estas armas redefinen la supremacía en el campo de batalla."
 nsb_SHORAD_missile_1: "Desarrollo de misiles de posguerra"
 nsb_SHORAD_missile_1_desc: "Los avances en la tecnología de misiles tras la Segunda Guerra Mundial llevaron al desarrollo de sistemas de misiles guiados de corto y largo alcance más sofisticados. Esta investigación introduce sistemas de propulsión mejorados, mecanismos de puntería optimizados y una mayor efectividad de las ojivas, lo que permite una mayor precisión y letalidad. Los misiles de corto alcance proporcionan una potencia de fuego táctica de respuesta rápida, mientras que los misiles de largo alcance extienden las capacidades de combate, permitiendo ataques contra objetivos distantes con alta precisión. Estas innovaciones marcan el comienzo de la guerra de misiles moderna, dando forma a los futuros enfrentamientos aéreos, terrestres y navales."
 nsb_SHORAD_missile_2: "Desarrollo de misiles de la Guerra Fría"
 nsb_SHORAD_missile_2_desc: "La era de la Guerra Fría fue testigo de rápidos avances en la tecnología de misiles, lo que llevó a la creación de sistemas de misiles más precisos, potentes y versátiles. Este desarrollo mejora las capacidades de los misiles tanto de corto como de largo alcance, perfeccionando los sistemas de guía, la eficiencia de la propulsión y la efectividad de las ojivas. Los misiles de corto alcance proporcionan opciones de ataque táctico para un impacto inmediato en el campo de batalla, mientras que los misiles de largo alcance permiten combates estratégicos, ataques profundos y operaciones de disuasión. Estos avances sientan las bases de la guerra de misiles moderna, aumentando las capacidades tanto ofensivas como defensivas en múltiples plataformas militares."
 nsb_SHORAD_missile_3: "Desarrollo moderno de misiles"
 nsb_SHORAD_missile_3_desc: "El desarrollo moderno de misiles se centra en mejorar la precisión, la velocidad y la adaptabilidad en varios alcances de combate. Este avance integra sistemas de guía avanzados, propulsión multietapa y ojivas modulares, lo que permite que los misiles se desempeñen de manera efectiva en escenarios de guerra aire-aire, tierra-tierra y naval. Los misiles de corto alcance ahora cuentan con capacidades de 'dispara y olvida', maniobrabilidad mejorada y adquisición de objetivos optimizada, mientras que los misiles de largo alcance incorporan tecnología de sigilo (stealth), capacidades de ataque de precisión y puntería en red para una efectividad superior. Estos avances proporcionan a las fuerzas modernas una potencia de fuego inigualable, capacidades de respuesta rápida y superioridad estratégica en el campo de batalla."
 nsb_SHORAD_missile_4: "Sistemas avanzados de misiles"
 nsb_SHORAD_missile_4_desc: "Llevando los límites de la guerra moderna al extremo, los Sistemas Avanzados de Misiles integran tecnología de punta para mejorar la velocidad, la precisión y la adaptabilidad en múltiples escenarios de combate. Estos misiles de próxima generación cuentan con propulsión hipersónica, puntería asistida por IA y ojivas modulares polivalentes, lo que les permite atacar objetivos terrestres, aéreos y navales con una precisión y eficiencia sin precedentes. Con la capacidad de realizar correcciones de curso a mitad del vuelo, resistencia a las contramedidas electrónicas e integración en red en el campo de batalla, estos misiles garantizan una letalidad superior y un dominio estratégico. Las variantes de largo alcance ahora incluyen revestimientos de sigilo y coordinación autónoma de enjambres, convirtiéndolos en un activo crítico en las operaciones militares de próxima generación."
 nsb_dual_role_missile_1: "Desarrollo de misiles de doble propósito de posguerra"
 nsb_dual_role_missile_1_desc: "Tras los avances en la tecnología de misiles después de la Segunda Guerra Mundial, se desarrollaron misiles de doble propósito para mejorar la versatilidad y la efectividad en múltiples roles de combate. Estos misiles están diseñados para atacar objetivos tanto terrestres como aéreos, ofreciendo a los ejércitos una solución rentable y adaptable para una variedad de escenarios en el campo de batalla. Con mejoras en los sistemas de guía, la eficiencia de la propulsión y la adaptabilidad de las ojivas, estas armas proporcionan una mayor precisión, alcance y flexibilidad táctica, haciéndolas esenciales para la guerra moderna de armas combinadas."
 nsb_dual_role_missile_2: "Desarrollo de misiles de doble propósito de la Guerra Fría"
 nsb_dual_role_missile_2_desc: "Durante la Guerra Fría, los avances en la tecnología de misiles llevaron al desarrollo de sistemas de misiles de doble propósito capaces de atacar objetivos tanto terrestres como aéreos con precisión y adaptabilidad. Estas armas fueron diseñadas para mejorar la flexibilidad militar, permitiendo que una sola plataforma de misiles desempeñara múltiples roles de combate, reduciendo las cargas logísticas y aumentando la eficiencia en el campo de batalla. Con sistemas de guía mejorados, ojivas modulares y propulsión perfeccionada, estos misiles se convirtieron en un componente crucial de la guerra moderna, permitiendo capacidades de respuesta rápida tanto en operaciones defensivas como ofensivas. Su desarrollo allanó el camino para las doctrinas de misiles polivalentes que contiúan dando forma a la estrategia militar en la actualidad."
 nsb_dual_role_missile_3: "Sistemas modernos de misiles de doble propósito"
 nsb_dual_role_missile_3_desc: "La guerra moderna exige sistemas de armas altamente adaptables y eficientes, lo que ha llevado al desarrollo de misiles de doble propósito capaces de atacar objetivos tanto terrestres como aéreos con precisión y versatilidad. Estos misiles avanzados cuentan con tecnología de 'dispara y olvida', sistemas de guía multimodo (infrarrojos, radar y GPS) y ojivas modulares que pueden ajustarse para diferentes escenarios de combate. Su capacidad para funcionar en roles aire-tierra, aire-aire y antibuque los convierte en un componente crítico de los arsenales militares modernos, optimizando las operaciones tanto estratégicas como tácticas. Con capacidades de sigilo (stealth), resistencia a la guerra electrónica e integración de puntería en tiempo real, estos misiles proporcionan una flexibilidad y efectividad inigualables en todos los campos de batalla."
 nsb_dual_role_missile_4: "Sistemas avanzados de misiles de doble propósito"
 nsb_dual_role_missile_4_desc: "A medida que la tecnología militar evoluciona, los Sistemas Avanzados de Misiles de Doble Propósito llevan un paso más allá los límites de la precisión, la adaptabilidad y la letalidad. Estos misiles de próxima generación cuentan con puntería asistida por IA, guía multiespectral (infrarrojos, radar, láser y seguimiento por satélite) y ojivas adaptativas capaces de ajustarse de forma autónoma a amenazas aéreas, terrestres y navales. Con propulsión hipersónica, maniobrabilidad mejorada y resistencia a la guerra electrónica, estos misiles pueden evadir contramedidas, atacar múltiples objetivos simultáneamente y operar en entornos altamente disputados. Su integración perfecta en la guerra de redes centradas garantiza la coordinación del campo de batalla en tiempo real, convirtiéndolos en la piedra angular de la superioridad militar del futuro."
 SOV_module_light_helipad_1: "Ka-25/Ka-27"
 SOV_module_light_helipad_2: "Ka-27M"
 LBA_guided_missile_equipment_3: "Hwasong-7"
 IRQ_guided_missile_equipment_3: "Al-Abbas"
 IRQ_nuclear_missile_equipment_1: "Al-Abid"
 nsb_defense_tech_4: "Sistema Láser de Protección Activa Hard-Kill para Helicópteros"
 nsb_defense_tech_4_desc: "Un sistema de defensa de energía dirigida capaz de inutilizar físicamente los proyectiles entrantes. Dispara un láser de alta energía para destruir o desviar los misiles antes del impacto. Representa la última generación de protección activa para aeronaves de ala rotatoria."
 armored_vehicle_tt: "Investigar esta tecnología te permite diseñar y construir todos los vehículos blindados como §YAPCs§!, §YIFVs§!, §YSPAAs§!, §YMBTs§! y más."
 CAT_fortifications: "Fortificaciones"
 CAT_naval_modules: "Módulos navales"
 CAT_naval_modules_research: "Investigación de $CAT_naval_modules$"
 Early_APC_desc: "Armored vehicle design covers a multitude of various design principles for our armored vehicles. Researching and investing in our design teams allows us to design and build Main Battle Tanks (MBTs), Armored Personnel Carriers (APCs), Infantry Fighting Vehicles (IFVs), Light Armored Vehicle (LAVs), and Utility Vehicles."
 NAVAL_TITLE_CORVETTES: "CORBETAS"
 NAVAL_TITLE_CORVETTES_DESC: "The smallest class of vessel considered a warship, corvette class ships are not typically part of blue water navies. These small and fast ships are usually armed with an assortment of weapons, allowing them to perform a range of duties. Many countries can float Corvettes due to their affordability for small and medium-sized navies. They are typically used for: coast defense and surveillance, minesweeping, anti-submarine, anti-aircraft, anti-ship and, in modern times, land attack duties."
 NAVAL_TITLE_STEALTH_CORVETTES: "CORBETAS SIGILOSAS"
 NAVAL_TITLE_STEALTH_CORVETTES_DESC: "Se trata de corbetas con características de sigilo que les permiten evitar ser detectadas por las fuerzas enemigas."
 NAVAL_TITLE_FRIGATES: "FRAGATAS"
 NAVAL_TITLE_FRIGATES_DESC: "Las fragatas, que constituyen el núcleo de muchas armadas modernas, pueden emplearse como parte de las fuerzas navales de alta mar. Tienen un alcance extendido y son más grandes que los buques de la clase corbeta. Aunque se utilizan principalmente como plataforma para la defensa de flotas, pueden desempeñar una amplia gama de funciones dentro de una flota y pueden personalizarse para satisfacer las demandas de diversos roles y situaciones (incluidas tareas de carácter más ofensivo). Se utilizan típicamente para: defensa de flotas, operaciones antisubmarinas, antiaéreas y convoyes marítimos."
 NAVAL_TITLE_STEALTH_FRIGATES: "FRAGATAS SIGILÁCITAS"
 NAVAL_TITLE_STEALTH_FRIGATES_DESC: "Con sistemas de detección cada vez más avanzados, se ha hecho necesario equipar nuestras fragatas con tecnología furtiva para que sean más difíciles de detectar."
 NAVAL_TITLE_DESTROYERS_DESC: "Diseñados para escoltar buques de mayor tamaño en una flota, convoy o grupo de batalla, estos buques de guerra rápidos, maniobrables y de gran autonomía son igualmente capaces de operar de forma independiente. Versiones posteriores, equipadas con una amplia y mortífera gama de misiles guiados, misiles de crucero y otras armas, son, de hecho, buques de guerra multimisión. De mayor tonelaje y con una potencia de fuego más ofensiva y mortífera que una fragata o corbeta. Se utilizan típicamente para: defensa de flotas, tareas ofensivas, antiaéreas, antibuque, antisubmarinas, así como para ataques terrestres, dependiendo de la carga."
 NAVAL_TITLE_STEALTH_DESTROYERS: "DESTRUCTORES SIGILÁCTICOS"
 NAVAL_TITLE_STEALTH_DESTROYERS_DESC: "Los cambios en la tecnología bélica moderna han llevado a las flotas más avanzadas a buscar nuevas soluciones para la supervivencia de sus flotas. Los destructores furtivos se han convertido en una prioridad. Mantenerse ocultos a los sensores y radares enemigos avanzados permite que estas poderosas armas ataquen más cerca, más rápido y con mayor letalidad, con la ventaja adicional de una mayor capacidad de supervivencia en los conflictos modernos."
 NAVAL_TITLE_CRUISERS: "CRUCEROS"
 NAVAL_TITLE_CRUISERS_DESC: "Habitualmente los buques de asalto más grandes de una flota moderna (además de los portaaviones y los buques de asalto anfibios), estos poderosos recursos pueden cubrir todos los océanos y mares del planeta. Históricamente orientados a la defensa aérea (mientras que los destructores se encargaban de la guerra de superficie), los cruceros modernos disponen de un increíble arsenal de armas, superior al de cualquier otro buque de combate. Los cruceros pueden servir de base para un grupo de batalla completo, con una gran capacidad para sensores y sistemas de gestión de combate. Se utilizan habitualmente para funciones de mando y control, antiaéreas, antibuque y ataque terrestre."
 NAVAL_TITLE_BATTLESHIPS: "ACORAZADOS/CRUCEROS DE BATALLA"
 NAVAL_TITLE_BATTLESHIPS_DESC: "Battleships and battlecruisers are relics of the past. While they used to rule the seas, the advances in aircraft and missiles have made them easy targets for smaller vessels. But perhaps with enough technological advancement, they can be made to rule the seas once more."
 NAVAL_TITLE_HELI_OPERATORS: "OPERADORES DE HELICÓPTEROS"
 NAVAL_TITLE_HELI_OPERATORS_DESC: "Similares a los portaaviones, estos buques de asalto anfibio multipropósito ofrecen una gran potencia a un coste mucho menor, tanto en producción como en personal. Capaces de operar helicópteros, aeronaves de ala fija STOVL (despegue corto y aterrizaje vertical), así como lanchas de asalto naval, muchos también cuentan con una cubierta de apoyo, lo que permite asaltos anfibios rápidos sobre posiciones enemigas. Estos buques proporcionan un gran apoyo adicional a cualquier desembarco anfibio. Se utilizan típicamente para: mando y control, antisubmarino, guerra de superficie, guerra aérea (si están equipados con aeronaves de ala fija), bombardeo costero y apoyo a desembarcos anfibios."
 NAVAL_TITLE_CARRIERS_DESC: "Estas bases aéreas flotantes son la cúspide del poder naval, capaces de adentrarse en los océanos del mundo para proyectar el poder de una nación a todo el planeta. Representando la sangre y el tesoro de una nación fuerte, estos recursos increíblemente valiosos deben protegerse a toda costa. Con un amplio alcance, requieren un verdadero grupo de combate en alta mar que les permita desplegar todas sus capacidades operativas en el mar. Cualquier país que cuente con un grupo de combate de portaaviones plenamente operativo puede estar verdaderamente orgulloso de lo que representa su armada y del impresionante poder que ostenta. Se utilizan típicamente para: proyección de poder a gran escala, guerra aérea, guerra de superficie y guerra anfibia."
 NAVAL_TITLE_ATTACK_SUBMARINES: "SUBMARINOS DE ATAQUE"
 NAVAL_TITLE_ATTACK_SUBMARINES_DESC: "Estas plataformas de guerra submarina, destructoras silenciosas de los océanos del mundo, incorporan diversas capacidades útiles, como sigilo, recopilación de inteligencia y sistemas de armas. Los submarinos de ataque están especializados en atacar submarinos y buques enemigos a menor distancia que sus homólogos de mayor tamaño."
 NAVAL_TITLE_MISSILE_SUBMARINES: "SUBMARINOS DE MISILES"
 NAVAL_TITLE_MISSILE_SUBMARINES_DESC: "The silent killers of the world's oceans, these undersea warfare platforms incorporate a range of useful abilities, including stealth, intelligence gathering, and weapon systems. The missile submarines are designed with far greater capabilities than attack submarines."
 NAVAL_TITLE_SUB_ENGINES: "MOTORES SUBMARINOS"
 NAVAL_TITLE_SUB_ENGINES_DESC: "Los submarinos generalmente funcionan con motores diésel para propulsión y carga de baterías. Cuando están sumergidos, el submarino funciona mediante un motor eléctrico."
 NAVAL_TITLE_SYSTEM_ENGINEERING: "INGENIERÍA DE SISTEMAS"
 NAVAL_TITLE_SYSTEM_ENGINEERING_DESC: "La ingeniería de sistemas constituye todas las partes auxiliares de los buques de guerra, como los motores, la electrónica y el radar."
 NAVAL_TITLE_NUCLEAR_ENGINES: "MOTORES NUCLEARES"
 NAVAL_TITLE_NUCLEAR_ENGINES_DESC: "Los motores nucleares tienen combustible esencialmente ilimitado, lo que permite que nuestros barcos funcionen en el océano siempre que haya suministros para los marineros a bordo."
 NAVAL_TITLE_INTERNAL_DEFENSES: "CONTROL DE FUEGO"
 NAVAL_TITLE_INTERNAL_DEFENSES_DESC: "Las computadoras de control de fuego son responsables de apuntar a las naves enemigas y calcular los vectores de impacto."
 NAVAL_TITLE_RADAR: "RADAR"
 NAVAL_TITLE_RADAR_DESC: "Un radar utiliza ondas de radio para detectar objetos en el aire o en el agua. El radar ayuda a nuestros barcos a detectar e identificar objetivos."
 NAVAL_TITLE_SONAR: "SONAR"
 NAVAL_TITLE_SONAR_DESC: "Un sonar utiliza ondas sonoras para detectar objetos bajo el agua. Se utiliza principalmente para detectar submarinos, pero también puede utilizarse para detectar minas marinas, torpedos o para medir la profundidad del agua."
 NAVAL_TITLE_ARMAMENT: "ARMAMENTO NAVAL"
 NAVAL_TITLE_ARMAMENT_DESC: "Todos los barcos requieren armas para operar en el mar. Si bien al principio usaban grandes baterías como armamento principal, este armamento evolucionó rápidamente hacia el uso de diferentes tipos de misiles, ya que estos permiten que incluso embarcaciones más pequeñas ataquen a buques más pesados."
 NAVAL_TITLE_ASM: "MISILES ANTIBUQUE"
 NAVAL_TITLE_ASM_DESC: "Los misiles antibuque son el arma principal de los buques contra otros buques. Los misiles antibuque incluyen sistemas de misiles tanto contra buques de superficie como submarinos."
 NAVAL_TITLE_AAMISSILES: "MISILES ANTIAÉREOS"
 NAVAL_TITLE_AAMISSILES_DESC: "Los misiles antiaéreos son la principal defensa de nuestros buques contra objetivos aéreos. Estos misiles pueden ser misiles tierra-aire (SAM) tradicionales o misiles de fuselaje rodante (RAM), diseñados principalmente para atacar misiles entrantes."
 NAVAL_TITLE_VLS_SURFACE: "SISTEMAS DE LANZAMIENTO VERTICAL DE SUPERFICIE"
 NAVAL_TITLE_VLS_SURFACE_DESC: "Vertical launch systems (VLS) launch missiles vertically from the hull of the ship. This allows ships to carry more missiles per surface area used and the weapon system has a smaller radar signature when compared to traditional arm-launched missiles."
 NAVAL_TITLE_VLS_AIR: "SISTEMAS DE LANZAMIENTO VERTICAL AÉREO"
 NAVAL_TITLE_VLS_AIR_DESC: "Vertical launch systems (VLS) launch missiles vertically from the hull of the ship. This allows ships to carry more missiles per surface area used and the weapon system has a smaller radar signature when compared to traditional arm-launched missiles."
 NAVAL_TITLE_TORPEDOES: "TORPEDOS"
 NAVAL_TITLE_TORPEDOES_DESC: "Los torpedos son misiles submarinos que se utilizan contra barcos. Generalmente se lanzan desde un submarino, pero también pueden lanzarse desde un barco o un avión."
 NAVAL_TITLE_LANDING_CRAFT: "LANCHA DE DESEMBARCO"
 NAVAL_TITLE_LANDING_CRAFT_DESC: "Se necesitan lanchas de desembarco para realizar cualquier tipo de asalto anfibio. Estas pueden ser lanchas rápidas, lanchas de desembarco especializadas, aerodeslizadores o incluso grandes buques capaces de desembarcar varios vehículos a la vez."
 battleship_hull_4: "Casco de Acorazado 2045"
 battleship_hull_4_desc: "Los buques de superficie son el componente principal de la flota y realizan todas las funciones marítimas de la flota tradicional."
 battle_cruiser_hull_4: "Casco de Crucero de Batalla 2045"
 battle_cruiser_hull_4_desc: "Los buques de superficie son el componente principal de la flota y realizan todas las funciones marítimas de la flota tradicional."
 support_ship: "Buque de Apoyo"
 support_ship_hull: "Buque de Apoyo"
 support_ship_1: "Buque de Apoyo"
 support_ship_2: "Buque de Apoyo Mejorado"
 repair_ship: "Buque de Reparación"
 repair_ship_hull: "Buque de Reparación"
 repair_ship_1: "Buque de Reparación"
 repair_ship_2: "Buque de Reparación Mejorado"
 support_ship_hull_desc: "Los buques de apoyo desempeñan un papel indispensable en la flota.\n\n§YNOTA:§! El buque de apoyo proporciona moral naval, alcance y organización máxima para la flota en la que se encuentra el barco."
 support_ship_1_desc: "Los buques de apoyo desempeñan un papel indispensable en la flota.\n\n§YNOTA:§! El buque de apoyo proporciona moral naval, alcance y organización máxima para la flota en la que se encuentra el barco."
 support_ship_2_desc: "Los buques de apoyo desempeñan un papel indispensable en la flota.\n\n§YNOTA:§! El buque de apoyo proporciona moral naval, alcance y organización máxima para la flota en la que se encuentra el barco."
 repair_ship_hull_desc: "El papel de la reparación de buques en la guerra naval no debe subestimarse.\n\n§YNOTA:§! El buque de reparación proporciona reducción de desgaste, disminuye el impacto de los impactos críticos y aumenta la probabilidad de recuperación de barcos para la flota en la que se encuentra el barco."
 repair_ship_1_desc: "El papel de la reparación de buques en la guerra naval no debe subestimarse.\n\n§YNOTA:§! El buque de reparación proporciona reducción de desgaste, disminuye el impacto de los impactos críticos y aumenta la probabilidad de recuperación de barcos."
 repair_ship_2_desc: "El papel de la reparación de buques en la guerra naval no debe subestimarse. El buque de reparación mejorado expande las habilidades de su versión anterior ampliando sus capacidades.\n\n§YNOTA:§! El buque de reparación proporciona reducción de desgaste, disminuye el impacto de los impactos críticos y aumenta la probabilidad de recuperación de barcos."
 EQ_MOD_CAT_module_screen_fire_control_system_category_TITLE: "Sistema de Control de Fuego (Pantalla)"
 EQ_MOD_CAT_module_capital_fire_control_system_category_TITLE: "Sistema de Control de Fuego (Capital)"
 module_screen_analog_fire_control: "Sistema de Control de Fuego Analógico"
 module_screen_analog_fire_control_desc: "Los sistemas analógicos de control de tiro se describen mejor como sistemas operados manualmente.\n\n§GConsejo de diseño: El control de tiro mejora el ataque de cañón, los misiles antibuque, la perforación de misiles antibuque, el ataque antiaéreo y el blindaje, haciendo que un buque armado sea más efectivo en múltiples roles. Los sistemas avanzados proporcionan mayores bonificaciones pero cuestan más capacidad industrial (IC) y microchips.§!\n\n§WUtilizar esto como arma principal creará un§! §BBuque de escolta (Screen)§!"
 module_screen_digital_integrated_fire_control: "Sistema de Control de Fuego Digital Integrado"
 module_screen_digital_integrated_fire_control_desc: "Interfaces digitales integradas en los sistemas para permitir un liderazgo y mantenimiento más efectivos desde el puente del barco.\n\n§GConsejo de diseño: El control de tiro mejora el ataque de cañón, los misiles antibuque, la perforación de misiles antibuque, el ataque antiaéreo y el blindaje, haciendo que un buque armado sea más efectivo en múltiples roles. Los sistemas avanzados proporcionan mayores bonificaciones pero cuestan más capacidad industrial (IC) y microchips.§!\n\n§WUtilizar esto como arma principal creará un§! §BBuque de escolta (Screen)§!"
 module_screen_advanced_integrated_missile_radar_control: "Control Avanzado de Radar de Misiles Integrado"
 module_screen_advanced_integrated_missile_radar_control_desc: "El control avanzado integrado de radar y misiles se describe mejor por la integración de misiles y radares para permitir reacciones más rápidas y precisas ante las amenazas entrantes.\n\n§GConsejo de diseño: El control de tiro mejora el ataque de cañón, los misiles antibuque, la perforación de misiles antibuque, el ataque antiaéreo y el blindaje, haciendo que un buque armado sea más efectivo en múltiples roles. Los sistemas avanzados proporcionan mayores bonificaciones pero cuestan más capacidad industrial (IC) y microchips.§!\n\n§WUtilizar esto como arma principal creará un§! §BBuque de escolta (Screen)§!"
 module_screen_futuristic_integrated_missile_radar_control: "Sistemas de Información de Combate Futuristas"
 module_screen_futuristic_integrated_missile_radar_control_desc: "Los sistemas de información de combate futuristas incorporan aprendizaje automático y tecnologías de IA para mejorar la capacidad del buque para rastrear el lanzamiento, el vuelo y la interceptación de armas enemigas a velocidades subsónicas, supersónicas e incluso hipersónicas.\n\n§GConsejo de diseño: El control de tiro mejora el ataque de cañón, los misiles antibuque, la perforación de misiles antibuque, el ataque antiaéreo y el blindaje, haciendo que un buque armado sea más efectivo en múltiples roles. Los sistemas avanzados proporcionan mayores bonificaciones pero cuestan más capacidad industrial (IC) y microchips.§!\n\n§WUtilizar esto como arma principal creará un§! §BBuque de escolta (Screen)§!"
 module_capital_analog_fire_control: "Sistema de Control de Fuego Analógico"
 module_capital_analog_fire_control_desc: "Los sistemas analógicos de control de tiro se describen mejor como sistemas operados manualmente.\n\n§GConsejo de diseño: El control de tiro mejora el ataque de cañón, los misiles antibuque, la perforación de misiles antibuque, el ataque antiaéreo y el blindaje, haciendo que un buque armado sea más efectivo en múltiples roles. Los sistemas avanzados proporcionan mayores bonificaciones pero cuestan más capacidad industrial (IC) y microchips.§!\n\n§WUtilizar esto como arma principal creará un§! §BBuque capital§!"
