 KOR_samsung_thunder: "Samsung Thunder"
 KOR_samsung_thunder_desc: "El Proyecto Thunder, basado en la plataforma de artillería K9 Thunder, evolucionará hacia un programa avanzado de exportación de armas."
 KOR_samsung_thunder_tests: "Pruebas de campo de Thunder"
 KOR_samsung_thunder_tests_desc: "Las nuevas versiones del K9 Thunder requieren pruebas de campo rigurosas para garantizar su rendimiento en el campo de batalla."
 KOR_samsung_thunder_upgrade: "Mejoras de Thunder"
 KOR_samsung_thunder_upgrade_desc: "Mejorar el K9 con automatización, blindaje y precisión aumentará tanto su atractivo para la exportación como su potencia de fuego."
 KOR_samsung_thunder_production: "Producción masiva de Thunder"
 KOR_samsung_thunder_production_desc: "La producción a gran escala de la nueva artillería Thunder elevará nuestra industria militar a un estatus de clase mundial."
 KOR_lg: "Grupo Industrial LG"
 KOR_lg_desc: "Desde productos químicos hasta electrónica, LG es uno de nuestros conglomerados más versátiles."
