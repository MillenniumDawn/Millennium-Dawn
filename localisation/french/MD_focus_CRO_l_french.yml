 CRO_political.1.t: "La Haye inculpe Gotovina"
 CRO_political.1.d: "Le TPIY a levé le secret d'un acte d'accusation contre le général Ante Gotovina pour des crimes commis pendant l'opération Tempête. Il a disparu avant qu'une arrestation puisse être effectuée. Les associations d'anciens combattants se rassemblent pour protester, et Bruxelles a fait savoir que la coopération avec le tribunal est une condition de l'intégration européenne."
 CRO_political.1.a: "Nous devons coopérer avec le tribunal"
 CRO_political.1.b: "La Croatie n'extrade pas ses héros"
 CRO_political.2.t: "Gotovina arrêté à Ténériffe"
 CRO_political.2.d: "La police espagnole a arrêté Ante Gotovina dans le restaurant d'un hôtel aux îles Canaries après quatre ans de cavale. Le renseignement partagé par Zagreb a aidé à le retrouver. Les anciens combattants allument des bougies sur la place principale, mais le dernier obstacle sur la voie européenne a été levé."
 CRO_political.2.a: "Une étape douloureuse mais nécessaire"
 CRO_political.3.t: "Candidature à l'adhésion à l'Union européenne"
 CRO_political.3.d: "Le Premier ministre Ivica Račan a formellement déposé à Athènes la candidature de la Croatie à l'adhésion à l'Union européenne. Le gouvernement espère rattraper la vague d'adhésion déjà en cours chez ses voisins du nord et laisser fermement derrière le pays les guerres de la décennie précédente."
 CRO_political.3.a: "Notre place est en Europe"
 CRO_political.4.t: "Les négociations d'adhésion sont ouvertes"
 CRO_political.4.d: "Après que le procureur en chef a confirmé la pleine coopération de la Croatie avec le tribunal, l'Union européenne a ouvert les négociations d'adhésion. Le criblage du droit croate au regard de l'acquis commence immédiatement, et les investisseurs étrangers s'en aperçoivent."
 CRO_political.4.a: "Le criblage commence"
 CRO_political.5.t: "Invitation au sommet de Bucarest"
 CRO_political.5.d: "Le sommet de l'OTAN à Bucarest a étendu une invitation formelle à la Croatie et à l'Albanie. Les protocoles d'adhésion doivent être signés dans l'année. L'invitation récompense une décennie de réforme de la défense et ancre la Croatie dans l'alliance occidentale."
 CRO_political.5.a: "Un siège à la table"
 CRO_political.6.t: "L'affaire Ina-MOL"
 CRO_political.6.d: "L'ancien Premier ministre Ivo Sanader a été arrêté en Autriche après avoir fui les poursuites. Les enquêteurs allèguent qu'il a reçu un pot-de-vin de la compagnie pétrolière hongroise MOL pour concéder les droits de gestion d'Ina, la compagnie pétrolière nationale. L'affaire atteint les plus hauts niveaux du parti au pouvoir."
 CRO_political.6.a: "Nul n'est au-dessus de la loi"
 CRO_political.6.b: "Limiter les dégâts"
 CRO_political.7.t: "Gotovina acquitté en appel"
 CRO_political.7.d: "La chambre d'appel du TPIY a annulé les condamnations des généraux Ante Gotovina et Mladen Markač et ordonné leur libération immédiate. La place principale de Zagreb s'est remplie de foules les accueillant. À Belgrade et Banja Luka, le jugement a été accueilli avec fureur."
 CRO_political.7.a: "Les généraux rentrent au pays"
 CRO_political.8.t: "Bienvenue dans l'Union européenne"
 CRO_political.8.d: "À minuit, la Croatie est devenue le 28e État membre de l'Union européenne, clôturant un processus d'adhésion de douze ans qui a survécu à six gouvernements. Les postes de douane aux frontières slovène et hongroise sont démantelés."
 CRO_political.8.a: "Un avenir européen"
 CRO_political.9.t: "Schengen et l'euro"
 CRO_political.9.d: "La Croatie a adopté l'euro et rejoint l'espace Schengen le même jour, premier État membre à accomplir les deux étapes à la fois. Les contrôles aux frontières avec le reste du bloc ont disparu, et la kuna passe à l'histoire. L'industrie touristique attend une saison record."
 CRO_political.9.a: "Enfin pleinement intégré"
 CRO_political.10.t: "L'Herceg-Bosna proclame son indépendance"
 CRO_political.10.d: "Les cantons croates d'Herzégovine ont proclamé une Herzégovine-Bosnie autonome et rompu leurs liens avec Sarajevo. Zagreb doit décider jusqu'où aller dans le soutien à la sécession."
 CRO_political.10.a: "Reconnaître l'Herceg-Bosna"
 CRO_political.10.b: "Envoyer un soutien discret"
