l_polish:
 muslim_brotherhood_sponsor: "Sieć Bractwa Muzułmańskiego"
 muslim_brotherhood_suppressor: "Przeciwdziałaj Bractwu"
 MB_build_network_hub: "Buduj organizację międzynarodową"
 MB_build_network_hub_desc: "The Muslim Brotherhood is a movement that crosses borders, its affiliates scattered across the region with no single center. Let [Root.GetNameDef] become that center, coordinating the network and giving us the means to support our brothers abroad."
 MB_fund_affiliates: "Finansowanie podmiotów stowarzyszonych Brotherhood"
 MB_fund_affiliates_desc: "The Brotherhood in [FROM.GetNameDef] is willing but poor. Money, organizers, and a steady flow of support will strengthen their hand against a government that would rather see them gone."
 MB_diplomatic_solidarity: "Wezwanie do braterskiej solidarności"
 MB_diplomatic_solidarity_desc: "Rządy sprzymierzone z Bractwem są silniejsze, gdy działają wspólnie, a nie w pojedynkę. Zbierzcie je przy jednym stole, potwierdźcie wspólną sprawę i sprawcie, by łącząca nas serdeczność była odczuwalna w całym bloku."
 MB_bankroll_crackdown: "Sfinansować zagraniczne działania represyjne"
 MB_bankroll_crackdown_desc: "[FROM.GetNameDef] obserwuje, jak Bractwo rośnie w siłę w granicach kraju, nie mając środków, by zareagować. Zaoferuj im fundusze i dane wywiadowcze, które pozwolą uderzyć jako pierwszym – zanim ruch ten nabierze siły wystarczającej, by zagrozić państwu."
 MB_designate_terrorist_organization: "Uznaj Bractwo za organizację terrorystyczną."
 MB_designate_terrorist_organization_desc: "Brand the Muslim Brotherhood for what we declare it to be: a terrorist organization. The designation costs little at home and places [Root.GetNameDef] shoulder to shoulder with every government that has drawn the same line."
 MB_counter_sponsor_influence: "Ujawnić finansowanie Bractwa"
 MB_counter_sponsor_influence_desc: "Someone is funding the Brotherhood in [FROM.GetNameDef], and the money leaves a trail. Expose it, disrupt it, and watch the movement lose momentum as its backers are dragged into the light."
 MB_rescind_terrorist_designation: "Cofnięcie statusu organizacji terrorystycznej"
 MB_rescind_terrorist_designation_desc: "Pozwólcie po cichu wygasnąć statusowi organizacji terrorystycznej. Przyjęta wobec Bractwa postawa spełniła swoje zadanie i niewiele można zyskać na podtrzymywaniu dawnych animozji."
 MB_sponsored_network: "Sponsorowanie naszego ruchu Braterstwa"
 MB_funding_subversion: "Finansowanie zagranicznej działalności wywrotowej Bractwa"
 MB_solidarity: "Solidarność z Bractwem Muzułmańskim"
 MB_crackdown_patron: "Sfinansowali naszą rozprawę"
 MB_funding_repression: "Finansowanie represji wobec Bractwa"
 MB_counter_bloc: "Wspólne stanowisko wobec Bractwa"
 MB_branded_terrorist: "Uznał Bractwo za organizację terrorystyczną"
 brotherhood.6.c: "Włączcie ich umiarkowanych przedstawicieli do rządu."
 brotherhood.11.t: "Oferta sfinansowania zdecydowanych działań"
 brotherhood.11.d: "[FROM.GetNameDef] po cichu zaoferowali nam pieniądze i informacje wywiadowcze, by stłumić Bractwo Muzułmańskie, zanim jeszcze bardziej urośnie w siłę. Ich wysłannicy czekają na odpowiedź."
 brotherhood.11.a: "Przyjmij fundusze i wystąp przeciwko nim."
 brotherhood.11.b: "Odrzuć ofertę."
 BROTHER_civil_war_has_started: "Wybuchła wojna domowa wywołana przez §YBractwo Muzułmańskie§!"