 ISR.Monarchist: "£ISR_nationalist_monarchist (Noam) - 愉悦党"
 ISR.Monarchist_desc: "(宗教保守主义) - 愉悦党\n\n愉悦党并非君主主义政党，而是一个极右翼正统派别，由拉比兹维·陶及其哈尔·哈莫尔犹太学院的追随者于2019年7月15日创立，由阿维·毛兹领导。该党纲领反对LGBT权利、改革派皈依犹太教以及其所谓的“家庭破坏”，并寻求更严格的安息日律法和更大的首席拉比权力。该党在2021年和2022年的宗教犹太复国主义名单中各赢得一个席位。毛兹于2023年1月成为总理办公室副部长，并于2025年3月离开政府。"
