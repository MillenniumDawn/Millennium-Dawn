 CZE_engine_tech: "개량형 R4 가솔린 엔진"
 CZE_engine_tech_2: "고급 V6 가솔린 엔진"
 CZE_engine_tech_2_desc: "V형 엔진은 일반적으로 R형 엔진보다 우수합니다. 다만 연료 소모가 더 크다는 점은 전시에 문제가 될 수 있으나, 우리 차량에는 가능한 최선의 장비를 갖추어야 합니다."
 CZE_engine_tech_3: "TSI 개량형 가솔린 엔진"
 CZE_engine_tech_3_desc: "우리의 최신 TSI 엔진은 TDI 엔진보다 높은 최고 속도를 제공하지만 연료 사용량이 늘어나는 대가가 따릅니다."
 CZE_engine_tech_4: "TDI 개량형 디젤 엔진"
 CZE_engine_tech_4_desc: "신형 TDI 엔진은 대안인 TSI보다 성능은 떨어지지만 연료 소모도 적으므로 연구할 가치가 있었습니다."
 CZE_engine_tech_5: "현대식 R4 가솔린 엔진"
 CZE_engine_tech_5_desc: "완전히 새로운 수준의 엔진 기술로 도약할 때입니다. 이것은 우리가 만든 최고의 R4 버전입니다. 경쟁사의 발명품보다 훨씬 저렴한 제작 비용으로 막대한 마력을 제공합니다."
 CZE_engine_tech_6: "과급 V6 가솔린 엔진"
 CZE_engine_tech_6_desc: "또 하나의 첨단 개량형으로, 두 번째 프로젝트보다 성능은 약간 떨어지지만 연료 사용량이 크게 줄어듭니다."
 CZE_engine_tech_7: "확장형 V12 디젤 엔진"
 CZE_engine_tech_7_desc: "타트라 엔진은 우리 전차에 안성맞춤입니다. 새로운 V12 버전은 우리 지상군에 큰 도움이 될 것입니다."
 CZE_engine_tech_8: "ISX15 디젤 엔진"
 CZE_engine_tech_8_desc: "이 엔진들의 문제는 높은 생산 비용과 연료 사용량입니다. 그러나 성능은 표준 R4 또는 V6 엔진보다 훨씬 뛰어납니다."
 CZE_engine_tech_9: "과충전 X12 디젤 엔진"
 CZE_engine_tech_9_desc: "최고의 생산성을 목표로 하는 것이 낫습니다. 이 프로젝트는 더 많은 연료와 자원의 생산을 요구하지만 전차의 성능을 크게 높일 것입니다."
 CZE_engine_tech_10: "경량 X12 디젤 엔진"
 CZE_engine_tech_10_desc: "그렇게 높은 생산 및 유지 비용은 감당할 수 없으므로 최신 엔진을 가능한 한 저렴하게 유지할 것입니다. 그래도 타트라 사로서는 훌륭한 성과입니다."
 CZE_el_engine_tech: "초기 차세대 전기 엔진"
 CZE_el_engine_tech_desc: "슈코다가 전기 엔진을 자체 생산할 수 없다고 누가 말했습니까? 이 기술의 첫 시험이지만 그 효과는 향후 연구에 매우 유용할 수 있습니다."
 CZE_el_engine_tech_2: "고전압 전기 엔진"
 CZE_el_engine_tech_2_desc: "이 기술의 잠재력을 최대한 끌어내려면 신뢰성을 어느 정도 희생해야 합니다. 최신 전기 엔진은 생산 비용이 매우 비싸지만, 엄청난 마력과 매우 낮은 연료 비용은 이 투자를 할 만한 가치가 있습니다."
