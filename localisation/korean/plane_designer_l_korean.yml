 solar_engines_3: "3발 태양광 엔진"
 solar_engines_3_desc: "쌍발 태양광 엔진과 동일한 설계 개념이지만, 3발 엔진 시스템을 사용하여 더 큰 추력과 더 높은 최고 속도를 얻으며, 기동성이나 생존성은 거의 개선되지 않습니다."
