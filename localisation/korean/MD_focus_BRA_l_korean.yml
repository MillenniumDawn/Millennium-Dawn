 BRA_support_from_the_eu: "EU의 지지"
 BRA_support_from_the_eu_desc: "EU 국가들은 수년간 사회민주주의를 통해 번영해 왔습니다. 동료 사회민주주의자들과 좋은 관계를 발전시키는 것은 당연한 일입니다."
 brazil.45.t: "거리로 나선 수백만 명"
 brazil.45.d: "세차 작전 수사가 최근 대중에 공개된 이후, 전국에 걸친 뇌물 수수 구조의 실상이 낱낱이 드러났고 대중의 반응은 폭발적이었습니다. 수백만 시민이 주요 도시의 거리로 쏟아져 나와 즉각적인 사퇴와 정의를 요구했습니다. 국민은 지금까지와 같은 방식은 끝났음을 분명히 했습니다."
 brazil.45.a: "기득권이 무너지고 있다!"
