 raj_exports.1.t: "Индия предлагает нам закупать свои вооружения"
 raj_exports.1.d: "Правительство Индии через свою индийскую оружейную компанию предлагает закупить определенные виды производимого ими оружия. Согласимся ли мы?"
 raj_exports.1.a: "Закупка средств ПВО"
 raj_exports.1.b: "Закупка оборудования командного пункта управления"
 raj_exports.1.c: "Купить стрелковое оружие"
 raj_exports.1.g: "Закупка противотанковых средств"
 raj_exports.1.e: "Мы не планируем приобретать индийское оружие"
