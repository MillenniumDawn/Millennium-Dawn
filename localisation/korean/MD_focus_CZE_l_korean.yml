 CZE_SLO_border_removal_1: "외교적으로 분단 종식"
 CZE_SLO_border_removal_2: "강압적으로 분단 종식"
 CZE_target_monarchy_intromission: "해외 군주제 지지 단체에 대한 영향력 행사"
