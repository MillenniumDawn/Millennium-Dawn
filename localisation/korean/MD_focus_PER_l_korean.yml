 PER_dissolves_majlis_TT: "[PER.GetFlag] §H마즐리스§!의 §H총선거§!를 소집합니다"
 PER_50_productivity_in_each_state: "각 §H중핵 주§!의 §H생산성§!이 §H50§! 증가합니다"
 PER_less_50_productivity_in_each_state: "각 §H중핵 주§!의 §H생산성§!이 §H-50§! 감소합니다"
 PER_less_250_productivity_in_each_state: "각 §H중핵 주§!의 §H생산성§!이 §H-250§! 감소합니다"
 PER_majlis.401.t: "새 총리"
 PER_majlis.401.d: "새 총리를 임명하여 직무를 맡길 시기가 되었습니다. 선택할 수 있는 후보가 많으며, 각 후보는 저마다 독특한 강점을 가져올 것입니다."
 PER_majlis.401.a: "진행하라"
 PER_majlis.401.b: "신경 쓰지 마라"
 PER_whispers_of_power: "권력의 속삭임"
 PER_whispers_of_power_desc: "우리의 과학 기관과 정부의 복도에서 조용한 대화가 시작되었습니다. 원자력의 잠재력은 힘뿐 아니라 영향력까지 약속합니다. 이 속삭임에 귀를 기울이고 그것이 우리의 미래를 어떻게 빚어낼지 고려할 때입니다."
 PER_mastering_the_atom: "원자의 정복"
 PER_mastering_the_atom_desc: "원자력을 활용하면 평화적 발전과 전략적 발전 모두에 필요한 자립과 힘을 얻게 될 것입니다. 원자의 정복은 더 이상 먼 야망이 아닙니다. 이는 우리나라의 회복력을 위해 반드시 추구해야 할 일입니다."
 PER_the_search_for_uranium: "우라늄 탐색"
 PER_the_search_for_uranium_desc: "원자력의 근간인 우라늄은 우리 국경 안에서 좀처럼 발견되지 않습니다. 앞으로 나아갈 길을 확보하려면 지질 조사와 탐사에 투자하여 이 핵심 자원을 찾아내고 채굴해야 합니다."
 PER_dig_in_semnan: "셈난 굴착"
 PER_dig_in_semnan_desc: "셈난주에는 유망한 우라늄 매장지가 있으나 대부분 개발되지 않은 채 남아 있습니다. 이 핵심 원소의 국내 공급을 확보하기 위해 이곳의 채굴에 노력을 집중해야 합니다."
 PER_irost_budget_increase: "IROST 예산 배정"
 PER_irost_budget_increase_desc: "이란 과학기술연구기구(IROST)의 예산을 늘리면 민간과 군사 양쪽 분야의 최첨단 과학 연구에 필요한 자원을 마련할 수 있습니다."
 PER_foreign_shortcuts: "해외의 지름길"
 PER_foreign_shortcuts_desc: "핵 개발을 추진하면서 우리는 진척을 앞당기기 위해 외부의 전문 지식과 기술을 구하는 방안을 고려합니다. 해외 동맹국들이 이 여정의 지름길을 제공해 줄 수도 있습니다."
 PER_mutual_benefits: "상호 이익"
 PER_mutual_benefits_desc: "외교는 우리의 핵 야망에서 결정적인 역할을 할 수 있습니다. 협력 관계를 구축하면 양측 모두에 이로운 지식과 자원을 얻어 더 신속히 나아갈 수 있습니다."
 PER_missile_leverage: "폭발적인 지렛대"
 PER_missile_leverage_desc: "핵 운반이 가능한 미사일 체계는 억지력으로 작용하여 우리나라를 가볍게 볼 수 없음을 세계에 알릴 것입니다. 이 중점은 미사일 개발과 잠재적 핵 능력과의 통합을 강조합니다."
 PER_continental_shield: "대륙의 방패"
 PER_continental_shield_desc: "지역적 위협으로부터 보호하기 위해 공중 위협을 요격하고 핵 시설과 자산을 지킬 수 있는 강력한 방어망을 구축할 것입니다."
 PER_golden_opportunity: "황금 같은 기회"
 PER_golden_opportunity_desc: "현재의 정세와 러시아와의 관계 덕분에 우리는 요원들을 그들의 나라에 보내 비축물 일부를... 가져올 수 있습니다. 어차피 그들은 너무 많아서 수를 다 세지도 못하니, 몇 개쯤 사라져도 눈치채지 못할 것입니다."
 PER_natanz_nuclear_facility: "나탄즈 농축 단지"
 PER_natanz_nuclear_facility_desc: "첨단 원심분리기를 갖춘 시설을 나탄즈에 세우면 우라늄을 효율적으로 농축할 수 있습니다. 이 단계는 우리의 핵 능력을 발전시키는 데 결정적입니다."
 PER_the_grand_bargain: "대타협"
 PER_the_grand_bargain_desc: "포괄적인 외교 구상인 대타협은 국제 제재 완화를 대가로 우리 핵 프로그램에 대한 제한을 협상하여 국가의 안정을 확보하는 것을 목표로 합니다."
 PER_joint_scientific_collaboration: "공동 과학 협력"
 PER_joint_scientific_collaboration_desc: "과학 분야의 국제 협력은 우리의 핵 개발을 위장하는 데 도움이 될 수 있습니다. 외국 과학자들과 교류하면 통찰을 얻는 동시에 해외에서 호의를 쌓을 수 있습니다."
 PER_iaea_autonomy: "IAEA 자율성"
 PER_iaea_autonomy_desc: "핵 프로그램을 온전히 유지하려면 외국의 사찰을 제한해야 합니다. IAEA와의 관계에서 우리의 자율성을 확보하면 국제적 간섭으로부터 진척 상황을 보호할 수 있습니다."
 PER_tehran_agreement: "테헤란 합의"
 PER_tehran_agreement_desc: "외교적 노력의 일환으로 테헤란 합의는 이란의 평화적 의도를 밝혀 이웃 나라들을 안심시키고 우리 핵 프로그램을 둘러싼 세계의 긴장을 완화하는 것을 목표로 합니다."
 PER_assistance_with_nuclear_energy: "국내 원자력 에너지 지원"
 PER_assistance_with_nuclear_energy_desc: "원자력 에너지의 성장을 촉진하기 위해 민간 프로젝트에 대한 국제 지원을 구하며, 평화적 핵 발전에 대한 우리의 의지를 보여줄 것입니다."
 PER_nspa: "NSCA"
 PER_nspa_desc: "국가안보협력기구(NSCA)를 창설하면 우리의 핵 관련 노력이 일원화되며, 외세와 함께 하늘에서의 이란 군사 전략 개발을 감독하고 가속하는 통합 기구가 만들어집니다."
 PER_jcpoa: "JCPOA"
 PER_jcpoa_desc: "포괄적공동행동계획(JCPOA)은 경제 제재 완화를 대가로 우리 핵 프로그램을 억제한 획기적인 합의였습니다. 이를 재검토하면 외교적 활로가 열리고 긴장이 완화될 수 있습니다."
 PER_scientific_standards: "과학 표준"
 PER_scientific_standards_desc: "핵 프로그램 내의 과학적 엄밀성과 표준을 개선하면 연구자들이 최고 수준에서 활동하며 안전하고 확실하게 전진할 수 있습니다."
 PER_ir_forty: "IR-40"
 PER_ir_forty_desc: "IR-40 원자로는 중수 사용을 전제로 설계되어 민간 및 잠재적 군사 용도의 동위원소를 생산할 수 있게 하며, 이는 커다란 진전을 상징합니다."
 PER_silent_steps: "조용한 걸음"
 PER_silent_steps_desc: "과감한 행보를 보이기보다 조용히 나아가며, 국제적 감시를 자극하지 않도록 눈에 띄지 않게 핵 야망을 추진할 것입니다."
 PER_prepare_the_army: "육군 준비"
 PER_prepare_the_army_desc: "잠재적 위협에 대비하여 우리의 이익을 지킬 군을 준비시켜야 하며, 어떤 핵 개발 시설도 외세의 침략으로부터 보호할 수 있도록 해야 합니다."
 PER_prepare_the_economy: "경제 준비"
 PER_prepare_the_economy_desc: "우리 경제는 제재를 견디고 장기적인 산업 성장을 유지할 수 있도록 단단히 다져져야 합니다. 이 중점은 경제적 회복력과 자립을 구축하는 것을 우선시합니다."
 PER_countering_sanctions: "저항 경제"
 PER_countering_sanctions_desc: "제재는 우리의 성장을 위협하지만, '저항 경제'를 발전시킴으로써 외국 의존도를 줄이고 자급자족을 달성할 수 있습니다."
 PER_oil_deals: "석유 거래"
 PER_oil_deals_desc: "에너지 수출은 여전히 우리의 재정적 생명줄입니다. 우호적인 국가들과 안정적인 석유 거래를 확립하면 우리의 야망을 뒷받침할 자금을 얻게 됩니다."
 PER_withdrawal_from_npt: "NPT 탈퇴"
 PER_withdrawal_from_npt_desc: "핵확산금지조약은 우리의 주권을 제약합니다. 이를 탈퇴하면 외부의 통제 없이 핵 기술을 추구할 우리의 권리를 천명하게 됩니다."
 PER_lion_roars: "이란의 사자가 포효한다"
 PER_lion_roars_desc: "과감한 선언과 함께 우리는 핵 능력을 세계에 공표하며, 이란이 세계 무대에서 무시할 수 없는 세력임을 보여줍니다."
 PER_silence_of_stride: "침묵의 행보"
 PER_silence_of_stride_desc: "신중한 길을 택하여 엄격한 비밀 속에서 핵 능력을 키우며, 세계의 눈길 없이 우리의 힘을 키울 것입니다."
 PER_irost: "IROST"
 PER_irost_desc: "이란 과학기술연구기구(IROST)는 여러 분야의 연구를 이끌며 민간과 군사 과학 양쪽에서 돌파구를 마련할 것입니다."
 PER_ifda: "IFDA"
 PER_ifda_desc: "이란 식품의약품청(IFDA)은 국민의 건강에 필수적인 식품과 의약품의 안전과 기준을 보장할 것입니다."
 PER_checking_food_standards: "식품 기준 점검"
 PER_checking_food_standards_desc: "식품의 품질과 안전은 국민 건강에 필수적입니다. 이 중점은 식품 산업의 검사와 표준화를 우선시합니다."
 PER_development_of_new_gmos: "GMO의 새 시대"
 PER_development_of_new_gmos_desc: "현대 농업 과학은 우리의 식량 안보를 향상시킬 수 있습니다. GMO 기술 연구는 가뭄과 질병에 강한 작물을 만들어 낼 것으로 기대됩니다."
 PER_ibrc: "IBRC"
 PER_ibrc_desc: "이란 생명공학연구센터(IBRC)는 유전학, 의학, 첨단 생명공학 연구 분야의 노력을 선도할 것입니다."
 PER_dna_modifications: "DNA 변형"
 PER_dna_modifications_desc: "DNA에 대한 이해를 높임으로써 의학적 돌파구와 유전 기술 혁신의 문을 열 수 있습니다."
 PER_idtds: "IDTDS"
 PER_idtds_desc: "IROST 기술개발연구부(IDTDS)는 데이터 기반시설의 보안을 확보하고 사이버 보안을 강화하는 데 주력합니다."
 PER_cybersecurity_infrastructure: "사이버 보안 기반시설"
 PER_cybersecurity_infrastructure_desc: "정보를 지키기 위해 견고한 사이버 보안 규약을 확립하여 우리의 기술 발전을 외부의 침입으로부터 방어해야 합니다."
 PER_electronic_warfare_systems: "전자전 체계"
 PER_electronic_warfare_systems_desc: "전자전을 숙달하면 적의 신호에 대응하고 통신을 교란하며 전략적 우위를 점할 새로운 능력을 갖추게 됩니다."
 PER_imed: "IMED"
 PER_imed_desc: "이란 기계공학부(IMED)는 우리나라의 산업과 과학 발전을 적들의 수준 너머로 끌어올릴 기구가 될 것입니다!"
 PER_collaborate_with_ari: "ARI와 협력"
 PER_collaborate_with_ari_desc: "항공우주연구소(ARI)는 우리의 야망에 결정적인 전문 지식을 제공합니다. 긴밀히 협력하면 민간 및 군사 항공 분야의 발전을 앞당길 수 있습니다."
 PER_qaher_three_one_three: "정복자 프로젝트"
 PER_qaher_three_one_three_desc: "카헤르-313, 즉 '정복자'는 제공권을 향한 우리의 열망을 상징합니다. 이 프로젝트를 개발하면 현대전에서 우리의 힘과 혁신을 보여줄 수 있습니다."
 PER_milad_tower_TT: "§H테헤란§!의 §H밀라드 타워§! 건설을 완료합니다\n\n§H밀라드 타워§!가 지도에 표시됩니다"
 PER_IMED_idea: "IMED"
 PER_idtds_idea: "IDTDS"
 PER_the_lion_roars_idea: "이란의 사자가 포효한다"
 PER_us_sanctions_harshened: "강화된 제재"
 PER_us_sanctions_harshened_desc: "미국은 우리가 외부 세계와 교류하는 능력을 제한하는 여러 제재를 부과해 왔습니다. 현재의 강도에서는 경제적 성공을 이루는 우리의 능력을 어느 정도 가로막고 있습니다.\n§W--------------§!\n이 국가 정신은 미국이 우리가 더 이상 핵무기를 추구하지 않는다고 판단하면 §R제거§!됩니다."
 PER_us_sanctions: "미국의 제재"
 PER_us_sanctions_desc: "미국은 우리가 외부 세계와 교류하는 능력을 제한하는 여러 제재를 부과해 왔습니다. 치명적이지는 않지만 경제적 성공을 이루는 우리의 능력을 어느 정도 가로막고 있습니다.\n§W--------------§!\n미국은 우리의 행동에 따라 우리 정부에 대한 제재를 강화하거나 완화할 수 있는 권한을 가지고 있습니다.\n§W--------------§!\n이 국가 정신은 미국이 우리가 더 이상 핵무기를 추구하지 않는다고 판단하면 §R제거§!됩니다."
 PER_joint_scientific_collaboration_idea: "공동 과학 협력"
 PER_jcpoa_idea: "JCPOA"
 PER_nspa_idea: "NSCA"
 PER_restrictions_on_nuclear_weapons: "IAEA 제한"
 PER_restrictions_on_nuclear_weapons_desc: "IAEA는 우리가 생산할 수 있는 것과 없는 것에 일정한 제한을 두었으며, 이에 따라 핵무기를 생산하고 사용하는 우리의 능력이 억제되었습니다.\n§W--------------§!\n이 국가 정신은 §H핵 교리§! 중점을 변경하면 §R제거§!됩니다."
 PER_technological_ties: "기술적 유대"
 PER_mastering_atom: "원자의 정복"
 nuclear_iran.1.t: "잠재적 공급자?"
 nuclear_iran.1.d: "핵 기술 확보 노력을 이어가려면, 우리가 적절한 무기나 시설을 생산하는 데 필요한 정교함의 수준에 단순히 도달하지 못했다는 사실을 받아들여야 합니다. 따라서 우리는 세계로 눈을 돌려 누가 도와줄 의향이 있는지 살펴봐야 하며, 정보원들에 따르면 우리가 도움을 요청할 수 있는 나라는 두 곳입니다."
 nuclear_iran.1.a: "러시아에 연락하자"
 nuclear_iran.1.b: "북한에 연락하자"
 nuclear_iran.2.t: "지원을 요청하는 이란"
 nuclear_iran.2.d: "이란의 과학자들과 외교관들이 최근 우리 측과 만나 자국의 핵 프로그램에 대한 지원을 요청했습니다. 그들은 핵 프로그램 개발에 도움이 되기만 한다면 우리가 제공하는 무엇이든 기꺼이 받아들일 것이라고 밝혔습니다."
 nuclear_iran.2.a: "알겠다"
 nuclear_iran.2.b: "우리의 비밀을 공유할 수는 없다"
 nuclear_iran.3.t: "미사일 기술을 공유하는 북한"
 nuclear_iran.3.d: "북한 과학자들이 최근 [PER.capital.GetCapitalVictoryPointName]에서 우리 측과 만나, 우리가 현재 보유하지 못한 첨단 ICBM 미사일의 설계도를 제공했습니다."
 nuclear_iran.3.a: "훌륭해!"
 nuclear_iran.4.t: "핵 기술을 제공하는 러시아"
 nuclear_iran.4.d: "러시아 과학자들이 최근 [PER.capital.GetCapitalVictoryPointName]에서 우리 측과 만나, 우리가 현재 보유하지 못한 첨단 원자로의 설계도를 제공했습니다."
 nuclear_iran.4.a: "훌륭해!"
 nuclear_iran.5.t: "지원 제공을 거부한 [FROM.GetName]!"
 nuclear_iran.5.d: "우리가 핵 프로그램 지원을 위해 [FROM.GetName]에 연락한 것은 중대한 오판이었습니다. 그들은 우리의 요청을 거부했으며, 우리의 비밀이 노출될 수 있는 국제 법정에 이 요청을 제기하겠다고 위협했습니다."
 nuclear_iran.5.a: "놓친 기회로군."
 nuclear_iran.6.t: "미사일 구매를 원하는 이란"
 nuclear_iran.6.d: "이란 정부가 우리에게 일련의 탄도 미사일 판매를 요청했습니다. 이란은 이 미사일을 자국 국경 방어에만 사용할 것이며 어떠한 형태의 공세 작전에도 사용하지 않겠다고 선언했습니다."
 nuclear_iran.6.a: "좋다, 판매를 확정하자"
 nuclear_iran.6.b: "아니요"
 nuclear_iran.7.t: "미사일을 판매하는 러시아"
 nuclear_iran.7.d: "러시아가 우리에게 탄도 미사일 약 400기를 판매했습니다. 일부는 구형일 수 있으나 작동하는 데는 문제가 없으며, 중요한 것은 그뿐입니다."
 nuclear_iran.7.a: "좋아"
 nuclear_iran.8.t: "미사일 판매를 거부하는 러시아"
 nuclear_iran.8.d: "러시아 정부는 자국 군사 작전에 미사일이 필요하다는 이유를 들어 미사일 구매 요청을 거부했습니다."
 nuclear_iran.8.a: "알겠다"
 nuclear_iran.9.t: "미사일 탈취 성공"
 nuclear_iran.9.d: "우리 요원들은 러시아 핵 수송 부대로 성공적으로 위장하는 데 성공했으며, ICBM 15기를 중앙아시아를 거쳐 마슈하드로 반입할 수 있었습니다."
 nuclear_iran.9.a: "그리고 기억하라, 뒤처리는 깔끔하게"
 nuclear_iran.10.t: "SHORAD 기지 건설 지원을 요청하는 이란"
 nuclear_iran.10.d: "이란 정부는 페르시아만 지역에서 비롯될 수 있는 모든 위협에 대응하기 위해 자국 남부에 더 많은 SHORAD 기지를 건설하는 데 도움을 달라고 요청하고 있습니다."
 nuclear_iran.10.a: "알겠다"
 nuclear_iran.10.b: "아니요"
 nuclear_iran.11.t: "SHORAD 기지 건설에 동의한 러시아"
 nuclear_iran.11.d: "러시아 정부는 자국 남부에 SHORAD 기지를 건설하기 위해 기술자와 건설 업체 여럿을 파견하기로 동의했습니다."
 nuclear_iran.11.a: "좋아"
 nuclear_iran.12.t: "SHORAD 지원을 거부한 러시아"
 nuclear_iran.12.d: "러시아 정부는 우리가 제때 대가를 지불할 능력이 없다는 이유를 들어, 자국 남부에 SHORAD 기지를 건설할 러시아 업체와 기술자를 파견해 달라는 우리의 간청을 거절했습니다."
 nuclear_iran.12.a: "왜?"
 nuclear_iran.13.t: "우리의 조건"
 nuclear_iran.13.d: "때가 왔습니다. 우리는 핵 프로그램을 충분히 진전시켜, 다른 국가들이 현재 갖지 못한 이점을 마침내 얻어내기 위해 서방과 협상을 시작할 수 있게 되었습니다. 그러나 이 협상과 별개로, 우리는 언제든 자유롭게 우리 자신의 야망을 추구할 수 있습니다."
 nuclear_iran.13.a: "금전적 이익을 위해 협상하자"
 nuclear_iran.13.b: "산업적 이익을 위해 협상하자"
 nuclear_iran.13.c: "에너지 이익을 위해 협상하자"
 nuclear_iran.14.t: "핵 프로그램을 공개한 이란"
 nuclear_iran.14.d: "이란 정부는 핵무기를 이미 보유하고 있지 않다면 적어도 현재 핵무기를 생산할 능력이 있음을 입증하는 문서, 사진 및 기타 증거를 공개했습니다. 세계는 한동안 이란이 핵무기를 생산하려 한다고 추측해 왔고 이란은 이를 부인해 왔기에, 우리 행정부는 이번 조치에 상당히 당혹스러워하고 있습니다. 그러나 이란이 우리와 세계를 협박하여 우리가 달리 허락하지 않을 이익을 얻어내려는 방편으로 이러한 일을 벌이고 있다는 의심이 있습니다. 어쨌든 우리는 이란에 대한 제재를 해제해야 할 것이며, 이를 우리의 조건으로 할지 그들의 조건으로 할지는 아직 결정해야 합니다."
 nuclear_iran.14.a: "좋다, 그들이 원하는 게 무엇인가?"
 nuclear_iran.14.b: "우리는 굳건히 맞설 것이다, 그들은 모든 핵 능력을 해체해야 한다!"
 nuclear_iran.15.t: "모든 핵 시설과 무기의 해체를 요구하는 미국"
 nuclear_iran.15.d: "미국은 합리적이고 논리적인 우리의 협상 제안에 위협으로 응답했습니다. 미국은 우리의 모든 핵무기 기술을 해체하고 IAEA의 조건을 준수할 것을 요구했습니다. 그러나 미국은 우리가 협력하기로 한다면 제재를 해제하겠다고 제안했으나, 이는 우리가 예상했던 반응이 결코 아닙니다."
 nuclear_iran.15.a: "좋다, 따르겠다"
 nuclear_iran.15.b: "그런 태도라면? 우리는 핵무기를 추구할 것이다!"
 nuclear_iran.16.t: "순응하는 이란"
 nuclear_iran.16.d: "이란 정부는 핵무기 문제에 대한 우리의 조건을 따르기로 동의했습니다. 이란에는 비핵화를 위해 정확히 6개월이 주어지며, 여기에는 교리를 변경하고 핵무기 비축분이 있다면 전부 폐기하는 것이 포함됩니다."
 nuclear_iran.16.a: "좋다"
 nuclear_iran.17.t: "우리의 조건을 일축한 이란"
 nuclear_iran.17.d: "이란 정부는 불장난을 하기로 결정했으며, 우리의 관대한 제안을 거부하기로 했습니다. 그 결과 우리는 제재에서 노골적인 개입에 이르기까지 여러 선택지를 추구할 수 있게 되었습니다."
 nuclear_iran.17.a: "그들의 산업과 주요 인물에 대한 제재"
 nuclear_iran.17.b: "제재와 함께 그들의 시설에 대한 군사 개입!"
 nuclear_iran.17.c: "그냥 내버려 두자"
 nuclear_iran.18.t: "이란에 대한 개입을 촉구하는 미국"
 nuclear_iran.18.d: "미국은 최근 이란이 넘어서는 안 될 레드라인을 넘었다고 선언했습니다. 이는 주로 이란 핵 프로그램이 발견되었고 이란이 미국의 조건을 따르길 거부했기 때문입니다. 우리는 이란 정권에 제재를 가하고 이란을 압박해 순응시키는 데 협조해 달라는 요청을 받았습니다."
 nuclear_iran.18.a: "알겠다"
 nuclear_iran.18.b: "이는 명백한 국제법 위반이다!"
 nuclear_iran.19.t: "국제 제재"
 nuclear_iran.19.d: "세계가 우리에게 등을 돌리기로 결정한 것으로 보이며, 우리 경제에 제재를 가해 경제는 불가피하게 멈춰 서게 될 것입니다. 우리는 우리의 정책을 재평가해야 합니다."
 nuclear_iran.19.a: "배신자들의 세계에서 무엇을 기대했겠는가?"
 nuclear_iran.20.t: "이란 핵 프로그램 폭로"
 nuclear_iran.20.d: "이란 핵 프로그램이 폭로된 이상 우리는 대응할 수밖에 없습니다. 우리가 곧 이란에 가하려는 제재를 해제하려면, 이란이 가능한 한 빨리 핵무기를 포기하도록 요구해야 합니다."
 nuclear_iran.20.a: "제재, 제재, 제재!"
 nuclear_iran.21.t: "핵 군축을 요구하는 미국"
 nuclear_iran.21.d: "우리 핵 프로그램이 폭로된 이후, 미국은 우리 정부에 현재 가해진 제재를 해제받으려면 국가에서 모든 핵무기를 제거하고 협상 테이블로 돌아와야 한다고 선언했습니다."
 nuclear_iran.21.a: "두고 보자"
 nuclear_iran.22.t: "저렴한 석유를 제안하는 이란"
 nuclear_iran.22.d: "이란이 우리에게 할인된 가격으로 석유를 제공하겠다고 제안했습니다. 이는 서방 열강과 그 동맹국들이 이란에 가한 가혹한 제재의 결과입니다. 이로 인해 이란 경제는 심각한 타격을 입었고, 그 결과 이란은 석유를 더 싼 가격에 팔아넘길 수밖에 없는 처지입니다."
 nuclear_iran.22.a: "알겠다"
 nuclear_iran.22.b: "아니요"
 nuclear_iran.23.t: "우리 석유를 구매한 중국!"
 nuclear_iran.23.d: "중국 정부는 할인된 가격으로 우리의 석유를 구매하기로 동의하여, 우리 경제가 버틸 수 있도록 도와주고 있습니다."
 nuclear_iran.23.a: "좋아"
 PER_expose_iran: "이란 핵 프로그램"
 PER_expose_iran_desc: "우리 첩보원들에 따르면 이란이 핵무기를 생산하고 있습니다. 이는 우리와 세계 나머지 국가에 위험할 수 있습니다."
 PER_nuclear_ambitions: "핵 야망"
 PER_nuclear_ambitions_desc: "핵무기 확보의 길을 걷는 동안 우리는 자국민과 국제 사회의 압력을 받게 됩니다. 핵 프로그램을 비밀로 유지할 수 있다면 이러한 부담에서 자유로울 것입니다. 어떤 국가든 §H강도 80% 이상의 첩보망§!을 구축하면 우리의 §H핵 프로그램§!을 폭로할 수 있습니다. 이 메뉴에서는 §H핵 프로그램§!과 관련된 결정과 기한부 임무가 활성화됩니다."
 PER_nuclear_disarming: "핵 군축"
 PER_nuclear_disarming_desc: "우리는 서방과 세계 대부분에 핵 정책을 폐기하고 핵무기 확보 능력을 스스로 제한하겠다고 약속했습니다. 이 약속을 이행하지 못하면 더욱 가혹하고 타격이 큰 제재에 직면할 수 있습니다."
 PER_can_negotiate_again_TT: "다시 협상을 시작할 수 있습니다"
 PER_no_more_nukes_TT: "§HICBM§! 비축분을 §H비웁니다§!\n\n§R이 시점 이후 따르기로 하면 우리는 다시는 핵무기를 사용할 수 없게 됩니다!§!"
 PER_nuclear_negotiations_TT: "우호적인 반응을 얻으려면 \n§H[USA.GetFlag] 미국§!과의 관계가 최소 §H+5§!는 되어야 합니다!\n - [USA.GetFlag] §H미국§!에 §H공화당 대통령§!이 있으면 덜 우호적인 반응을 얻을 수 있습니다"
 PER_steal_russ_TT: "§Y러시아 ICBM 탈취§! 임무를 활성화합니다.\n(§Y육군 침투§!가 필요합니다)"
 PER_missile_nko_TT: "이란이 §HICBM§! 기술을 업그레이드합니다"
 PER_missile_sov_TT: "이란이 §H원자로§! 기술을 업그레이드합니다"
 PER_whispers_of_power_TT: "£decision_icon_small 핵 야망 §Y결정§!을 §Y잠금 해제§!합니다"
 SOV_rejected_PER: " 러시아가 제안을 거절함"
 NKO_rejected_PER: " 북한이 제안을 거절함"
 steal_russian_icbm: "러시아 ICBM 탈취"
 steal_russian_icbm_desc: "과거 러시아인들은 우리 관리들이 자국의 방대한 ICBM에 접근하고 열람할 수 있도록 믿고 허락한 적이 있으며, 우리는 이 황금 같은 기회를 이용해 일부를 가져갈 것입니다. 그들에게는 이미 충분하고도 남을 만큼 있기 때문입니다."
 PER_nuclear_negotiations: "핵 협상이 진행 중임"
 PER_its_joever_nukes: "핵 야망을 포기함"
 PER_sanctions: "제재받음"
 PER_sanctioned: "제재받음"
 PER_nuclear_known: "핵 프로그램이 노출됨"
 nuclear_iran.24.t: "우리 석유를 거부한 중국!"
 nuclear_iran.24.d: "중국 정부는 우리가 제안한 큰 폭의 할인에도 불구하고 우리의 석유를 구매하는 데 관심이 없는 것으로 보입니다."
 nuclear_iran.24.a: "알겠다"
 PER_air_facilities: "하늘의 물체"
 PER_air_facilities_desc: "마즐리스는 특히 새로운 연구 시설을 통해 새로운 항공기를 생산하는 혁신적인 방법을 찾아야 한다고 명하였습니다."
 PER_fortress_pak_border_TT: "파키스탄과의 국경에 2레벨 육상 요새를 추가합니다"
 PER_fortress_afg_border_TT: "아프가니스탄과의 국경에 2레벨 육상 요새를 추가합니다"
 PER_fortress_trk_border_TT: "투르크메니스탄과의 국경에 2레벨 육상 요새를 추가합니다"
 PER_14623_name_restore: "반다르에팔레비"
 PER_1086_name: "알쿠드스"
 PER_4206_name: "아후자트 바이트"
 PER_11970_name: "비르 앗사브"
 PER_proclaim_the_islamic_golden_age: "제2의 이슬람 황금기"
 PER_proclaim_the_islamic_golden_age_desc: "[ISR.GetFlag] 이스라엘의 시온주의 정권이 붕괴하면서 제2의 이슬람 황금기가 도래했으며, 전 세계 무슬림들은 환호하며 더 나은 미래를 위해 노력하고 있습니다."
 PER_blow_nahariya_weapone_storage_desc: "나하리야 무기 저장 기지를 폭파하면 이스라엘의 침략을 억제하고, 항상 지켜보는 눈이 있다는 것을 보여줄 수 있습니다."
 PER_future_of_the_artesh: "아르테시의 미래"
 PER_future_of_the_artesh_desc: "아르테시의 미래는 이란의 방위와 주권의 중심에 있습니다. 현대화, 전략적 준비 태세, 강력한 지도력은 향후 수십 년간 군사력으로서의 실효성을 보장하는 열쇠입니다."
 PER_cooperation_with_our_partners: "파트너와의 협력"
 PER_cooperation_with_our_partners_desc: "아르테시의 자율성을 유지하면서도 국제 파트너들과의 전략적 협력은 이란의 방위 능력, 기술 교류, 전투 준비 태세를 강화하는 데 도움이 됩니다."
 PER_artesh_ground_forces: "지상군"
 PER_artesh_ground_forces_desc: "아르테시 지상군은 이란 방위 군사력의 근간이며, 이란 영토에 대한 통제를 보장하고 인접국의 침공 가능성에 대비합니다."
 PER_artesh_navy: "해군 전력"
 PER_artesh_navy_desc: "아르테시 해군은 이란의 해역을 수호하고 페르시아만의 핵심 해상 교통로를 통제하는 임무를 맡고 있습니다. 해군 능력을 강화하면 이란 해상 국경의 안전이 보장됩니다."
 PER_artesh_airforce: "공군"
 PER_artesh_airforce_desc: "아르테시 공군은 모든 공중 위협으로부터 이란의 하늘을 방어하는 임무를 맡고 있습니다. 기체와 방공 체계의 지속적인 개량은 지역 내 우위를 유지하는 데 필수적입니다."
 PER_self_sufficient_drive: "자급자족 추진"
 PER_self_sufficient_drive_desc: "방위 기술의 자급자족은 외국 공급자에 대한 의존도를 줄이는 데 필수적입니다. 이 추진은 국내 방위 산업 생산과 혁신을 촉진하여 국가 안보와 군사적 자율성을 강화합니다."
 PER_establish_supply_chains: "보급망 구축"
 PER_establish_supply_chains_desc: "아르테시를 위한 견고하고 안전한 보급망을 구축하면 군이 필요한 자원, 장비, 물자를 적시에 공급받아 작전 효율이 향상됩니다."
 PER_artesh_peacekeepers: "평화 유지 임무"
 PER_artesh_peacekeepers_desc: "아르테시는 분쟁 지역의 안정화를 위해 평화 유지 임무에 참여하도록 요청받을 수 있습니다. 이러한 역할은 외교 관계를 강화하는 동시에 세계 평화와 안보에 대한 이란의 의지를 보여줍니다."
 PER_artesh_marine_command: "아르테시 해군 사령부"
 PER_artesh_marine_command_desc: "아르테시 해군 사령부는 이란의 해군 자산을 총괄하며 페르시아만과 그 너머의 안전을 보장합니다. 지휘 통제 구조를 강화하면 이란의 해상 존재감과 준비 태세가 향상됩니다."
 PER_prioritize_jets: "제트기 우선"
 PER_prioritize_jets_desc: "첨단 제트 전투기의 생산과 배치를 늘리면 이란의 제공권이 공고해지고 잠재적 공중 위협에 대한 억지력이 더욱 커집니다."
 PER_prioritize_drones: "드론 대량 생산"
 PER_prioritize_drones_desc: "드론 대량 생산에 투자하면 다용도이면서 비용 효율적인 감시, 정찰, 타격 능력을 갖추게 되어 이란의 방위 능력이 크게 향상됩니다."
 PER_the_arms_dealer: "무기상"
 PER_the_arms_dealer_desc: "전 세계 무기상들과 접촉하면 첨단 군사 기술과 무기를 확보할 수 있습니다. 이는 아르테시의 능력을 크게 높이고 이란의 방위 태세를 강화할 것입니다."
 PER_doctrine_of_holy_defense: "성스러운 방위의 유산"
 PER_doctrine_of_holy_defense_desc: "이란-이라크 전쟁 중에 확립된 성스러운 방위 교리는 여전히 우리 군사 전략의 핵심 요소입니다. 이 교리를 강화하면 이란의 주권과 지역 내 영향력이 보존됩니다."
 PER_iaio: "IAIO"
 PER_iaio_desc: "이란 항공산업기구(IAIO)는 항공우주산업기구라고도 불리며, 이란의 항공 산업을 계획, 통제, 관리할 목적으로 1966년에 설립된 국영 기업입니다. 항공우주산업기구는 항공기와 항공우주 제품을 직접 제조하는 동시에 다른 국영 항공 기업들을 소유하고 있습니다."
 PER_research_and_development: "연구개발 센터 확장"
 PER_research_and_development_desc: "연구개발 센터를 확장하면 이란 방위 산업 분야의 혁신이 가속됩니다. 연구개발이 강화되면 우리 군은 변화하는 위협 속에서도 경쟁력을 유지할 수 있습니다."
 PER_our_old_friends: "뜻밖의 파트너"
 PER_our_old_friends_desc: "한때 적대 관계였으나 변화하는 세계 정세는 옛 파트너들과의 협력 가능성을 만들어 냈습니다. 상호 이익이 되는 관계를 어떻게 재건할 수 있을지 평가하는 것이 중요합니다."
 PER_russian_contracts: "러시아 계약"
 PER_russian_contracts_desc: "러시아와 방위 계약을 맺으면 첨단 군사 장비와 전문 지식을 얻을 수 있습니다. 이러한 협력은 특히 방공 및 해군 기술 분야에서 우리의 능력을 강화할 수 있습니다."
 PER_settle_the_dispute: "분쟁 해결"
 PER_settle_the_dispute_desc: "이웃 나라들과의 오랜 분쟁을 해결하면 지역 안정에 기여하고, 아르테시가 국방이라는 핵심 임무에 집중할 수 있는 환경이 조성됩니다."
 PER_oghab_forty_four: "오그압-44"
 PER_oghab_forty_four_desc: "오그압-44는 감시와 정찰을 위해 설계된 이란의 무인기입니다. 생산을 확대하면 정보 수집 면에서 상당한 이점을 얻게 됩니다."
 PER_our_request: "우리의 요청"
 PER_our_request_desc: "동맹국들에 손을 내밀어 추가적인 지원과 군사 자산을 요청해야 합니다. 국제 관계를 강화하면 군사 발전에 필요한 자원을 확보할 수 있습니다."
 PER_the_mountains_of_iran: "이란의 산악"
 PER_the_mountains_of_iran_desc: "이란의 산악 지형은 방어 작전에 전략적 이점을 제공합니다. 이러한 자연적 특성을 활용하면 외부의 위협을 격퇴하는 능력이 향상됩니다."
 PER_expand_the_southern_fleet: "남부 함대 확장"
 PER_expand_the_southern_fleet_desc: "남부 함대를 강화하면 이란의 해상 안보가 뒷받침되어 페르시아만과 그 핵심 해상 교통로에 대한 통제가 보장됩니다."
 PER_veins_of_the_revolution: "혁명의 혈관"
 PER_veins_of_the_revolution_desc: "혁명의 혈관은 우리의 외교 정책 깊숙이 흐르고 있습니다. 우리의 유산은 비겁함이 아니라 혁명에 대한 헌신으로 새겨져야 합니다."
 PER_alawites_in_syria: "알라위파 교두보"
 PER_alawites_in_syria_desc: "아사드 가문이 이끄는 알라위파 중심의 시리아 정권은 우리와 시아파 신앙과 반서방 노선을 공유합니다. 또한 대리 세력인 헤즈볼라와의 핵심 연결 고리를 포함하고 있습니다. 이란은 핵심적인 지역 동맹을 확보하고 레반트에 대한 영향력을 높이며 지역 내 시온주의 세력에 더욱 맞서기 위해 시리아와의 관계를 강화해야 합니다."
 PER_damascus_corridor: "다마스쿠스 회랑"
 PER_damascus_corridor_desc: "다마스쿠스 회랑은 우리가 놓칠 수 없는 통로이며, 이 핵심 회랑의 안전을 보장하기 위해 시리아와의 유대를 강화해야 합니다."
 PER_palestinian_frontism: "팔레스타인 전선주의"
 PER_palestinian_frontism_desc: "지금까지 팔레스타인의 저항은 수니파 혹은 좌파 운동이 주도해 왔습니다. 이제 더 우호적인 집단이 권력을 잡도록 그들의 정치를 조종할 때가 되었습니다."
 PER_advise_PIJ: "팔레스타인 이슬라믹 지하드 자문"
 PER_advise_PIJ_desc: "PIJ는 1981년 파티 샤카키가 무슬림 형제단의 분파로 설립했으며, 이란의 이슬람 혁명에 이념적 영향을 받았습니다. 파티 샤카키는 이슬람 국가에 대한 아야톨라 호메이니의 접근 방식을 칭송하는 책을 쓰기도 했습니다. 이후 PIJ는 이란의 최전방 입지에 자리를 잡았지만, 수니파 성향의 PIJ는 장차 이란과 충돌할 수도 있습니다.\n\n칼릴 알와지르의 이름을 딴 아부 지하드 해외 작전부대는 팔레스타인 무장 세력과 이란 정보 요원이 공동으로 이끄는 작전 부대로, 즉석 폭발물의 밀반입과 제조, 터널망 건설을 감독합니다. 이 부대는 주로 IRGC(쿠드스군)의 이란 지부가 통제합니다."
 PER_corridor_to_hezbollah: "헤즈볼라로 가는 회랑"
 PER_corridor_to_hezbollah_desc: "전쟁이 일어날 경우에 대비하려면 남레바논으로 가는 회랑을 확보해야 합니다."
 PER_descend_on_iraq: "이라크 급습"
 PER_descend_on_iraq_desc: "사담과 바트당 추종자들은 너무 오랫동안 이라크 국민의 부를 약탈해 왔습니다. 이제 그의 억압적인 손아귀에서 그들을 해방할 때입니다."
 PER_puppeteer_iraqi_politcs: "이라크 정치 조종"
 PER_puppeteer_iraqi_politcs_desc: "1999년 봉기 이후 이라크의 바트주의와 수니파 권위는 서서히 쇠퇴했습니다. 이라크는 서쪽에서 어떤 나라도 침공하지 못하게 막는 장애물을 제공하는 중대한 완충국입니다. 이라크 지도부에 대한 영향력을 확보하면 이 지역에서의 우리 이익을 지키고 레바논으로 향하는 우리 영향력의 지속적인 흐름을 보장할 수 있습니다."
 PER_liberation_of_the_qods: "쿠드스 해방"
 PER_liberation_of_the_qods_desc: "시온주의자들이 쿠드스에 대한 지배를 포기해야 할 때가 되었습니다. 다가올 승리로 이 지역은 뒤집어질 것입니다."
 PER_striking_the_great_satan: "대악마 타격"
 PER_striking_the_great_satan_desc: "§R때가 왔다..§!"
 PER_azeri_shias: "후사이니윤 무장"
 PER_azeri_shias_desc: "이제 아제르바이잔에 시선을 돌릴 때가 되었습니다. 우리 바로 위쪽에 사는 시아파는 소련부터 오늘날 이 나라를 다스리는 정권에 이르기까지 수십 년간 억압받아 왔습니다. 유일한 합법적 정치 운동인 후사이니윤을 무장시킬 때가 왔습니다."
 PER_a_new_dawn: "동방에서 솟아오르는 외침"
 PER_a_new_dawn_desc: "동방인들에게 새로운 날이 밝았습니다. 부패한 자들의 질서는 무너졌고, 새롭고 올바른 비전이 이 지역을 이끌 것입니다."
 PER_eastern_initiative: "자유 세계의 사람들"
 PER_eastern_initiative_desc: "고국의 억압적인 법에 묶인 이들을 해방하도록 촉구할 때가 되었으며, 이란이 그들의 목소리가 될 것입니다."
 PER_one_nation: "하나의 국가"
 PER_one_nation_desc: "이슬람 공화국 연합은 분열되지 않고 하나로 통합될 것입니다. 여러 나라 사이에서 자치 통치를 시행하는 것은 어리석은 일입니다."
 PER_decentralized_state: "여러 국가"
 PER_decentralized_state_desc: "권력에 욕심을 내는 자는 어리석은 사람입니다. 이슬람 공화국 연합 산하의 여러 나라를 직접 통제하는 것은 재앙을 부를 것입니다."
 PER_the_displaced: "실향민"
 PER_the_displaced_desc: "집이 없는 이들에게는 집을 제공해야 하며, 가난한 이들과 병든 이들, 굶주린 이들을 받아들여야 합니다."
 PER_hegemon_of_the_gulf: "걸프의 패권국"
 PER_hegemon_of_the_gulf_desc: "이란은 페르시아만의 유일한 패권국이며 앞으로도 그러할 것입니다. 우리가 원한다면, 우리가 완전한 통제권을 확립한 뒤 아랍인들은 새로운 지역 질서에서 설 자리가 없을 것입니다."
 PER_arabian_underbelly: "아라비아의 아랫배"
 PER_arabian_underbelly_desc: "우리의 동맹을 활용하여 아라비아의 아랫배를 칠 때가 되었습니다. 후티가 사우디를 공격하게 하면 기습의 요소를 통해 적에 대해 막대한 이점을 얻을 수 있습니다."
 PER_a_truly_red_sea: "진정한 홍해"
 PER_a_truly_red_sea_desc: "홍해는 붉게 보이지 않지만, 우리의 적들이 오만의 희생양이 되기 시작하면 바다는 붉게 물들 것입니다."
 PER_usurpers_of_mecca: "메카의 찬탈자들"
 PER_usurpers_of_mecca_desc: "메카의 찬탈자들을 무너뜨리고 성지의 사람들을 해방할 때가 되었습니다. 이슬람의 진정한 깃발은 이란에 있으며, 메카 위에 그것을 게양할 나라는 이란입니다."
 PER_topple_gulf_monarchies: "걸프 군주국 타도"
 PER_topple_gulf_monarchies_desc: "탐욕과 기만, 부패가 이 지역과 이슬람에 맞서 공모해 왔습니다. 걸프 군주국들은 이 모든 문제의 중심이며, 반드시 무너뜨려야 합니다."
 PER_blood_spilt_over_hormuz: "호르무즈에 흩뿌려진 피"
 PER_blood_spilt_over_hormuz_desc: "호르무즈 해협은 이란의 것이며 앞으로도 그러할 것입니다. 그러나 도발을 받는다면 우리는 주저 없이 해협을 방어할 것입니다. 도발을 기다리는 것은 치명적인 실수가 될 것이며, 따라서 우리가 먼저 적을 선제해야 합니다. 사우드 가문이 심판을 받을 때가 왔습니다."
 PER_gulf_supremacy_desc: "빛나는 해안에서 해안까지, 우리는 걸프를 우리의 동맹으로 채우고 에워쌌으며 한때 이곳의 권력을 쥐었던 강국들을 약화시켰습니다. 페르시아만은 이제 진정으로, 의심의 여지 없이 페르시아의 것입니다!"
 PER_gulf_summit: "걸프 정상회담"
 PER_gulf_summit_desc: "걸프 지역의 긴장은 오랫동안 지역의 안정과 번영을 해쳐 왔습니다. 다자 정상회담을 개최함으로써 대화의 문을 열고 신뢰를 쌓으며 새로운 협력 체제를 모색하고자 합니다."
 PER_the_lasting_truce: "지속적인 휴전"
 PER_the_lasting_truce_desc: "수년간의 대리 분쟁과 적대는 큰 대가를 치르게 했습니다. 신중한 협상과 상호 인정을 통해 사우디아라비아 및 다른 걸프 국가들과 영속적인 휴전을 이루기 위해 노력할 것입니다."
 PER_the_crescents_sword: "초승달의 검"
 PER_the_crescents_sword_desc: "지역의 평화에는 힘이 필요합니다. 능력을 현대화하고 억지 태세를 천명함으로써 우리는 초승달을 지키고 걸프의 세력 균형을 유지하는 검이 될 수 있습니다."
 PER_strenghten_economic_ties: "경제 유대 구축"
 PER_strenghten_economic_ties_desc: "외교만으로는 충분하지 않습니다. 공동의 번영이야말로 장기적 평화의 열쇠입니다. 우리는 걸프 파트너들과 무역 협정, 에너지 협력, 공동 기반시설 사업을 추진할 것입니다."
 PER_regional_defense: "지역 방위"
 PER_regional_defense_desc: "말과 무역을 넘어 진정한 협력에는 집단 안보가 포함되어야 합니다. 우리는 정보 공유, 합동 훈련, 지역 방위 양해 구축을 위한 방안을 모색할 것입니다."
 PER_musandam_gambit: "무산담 승부수"
 PER_musandam_gambit_desc: "호르무즈 해협은 완전히 우리의 통제 아래 있지 않으며, 따라서 이 지역에 대한 우리의 주장을 정당화할 방법을 고민하기 시작해야 합니다."
 PER_solidarity_through_strength: "힘을 통한 연대"
 PER_solidarity_through_strength_desc: "과거의 정책으로 여전히 휘청이는 지역에서, 이란은 단결과 힘을 보여주어야 합니다. 상호 존중과 실용적 협력에 뿌리를 둔 새로운 관계를 구축해야 합니다."
 PER_meeting_in_ankara: "앙카라 회담"
 PER_meeting_in_ankara_desc: "튀르키예에 새롭게 갱신된 CENTO 동맹에 참여하라는 공식 초청을 전달해야 합니다. 지역 균형에 대한 공통의 이해는 미래 지향적 동반자 관계의 초석이 될 수 있습니다."
 PER_talks_with_the_americans: "미국과의 회담"
 PER_talks_with_the_americans_desc: "미국과의 외교 관계를 재건하는 것은 필수적입니다. 신뢰는 얻기 어렵지만, 안정과 성장이라는 공동의 이익이 앞으로 나아갈 잠재적 길을 열어 줍니다."
 PER_handle_pkk_cells: "PKK 조직 대처"
 PER_handle_pkk_cells_desc: "PKK의 위협에는 국경이 없습니다. 튀르키예와 정보 공유 및 작전에서 협력하면 상호 안보를 보장하고 우리의 주권을 지킬 수 있습니다."
 PER_nato_proximity: "나토와의 근접"
 PER_nato_proximity_desc: "나토 정회원 가입은 아직 요원하지만, 우리의 교리와 구조를 그들과 일치시키면 막대한 전략적, 기술적 이점을 얻을 수 있습니다."
 PER_safe_distance: "안전 거리"
 PER_safe_distance_desc: "나토와의 교류가 복종을 뜻하지는 않습니다. 우리는 자율성을 해치지 않고도 협력의 결실을 거둘 수 있습니다."
 PER_in_caucasia: "캅카스로"
 PER_in_caucasia_desc: "이슬람 공화국이 쇠퇴하면서 캅카스에 공백이 생겼습니다. 이제 이란이 지원과 기반시설, 영향력을 제공하며 돌아올 때입니다."
 PER_in_central_asia: "중앙아시아로"
 PER_in_central_asia_desc: "중앙아시아와의 문화적, 역사적 유대를 이제 활용할 수 있습니다. 기반시설, 무역, 교육이 새로운 관계의 토대가 될 것입니다."
 PER_the_hezbollah_problem: "헤즈볼라 문제"
 PER_the_hezbollah_problem_desc: "IRGC 잔당과 헤즈볼라 요원들이 레바논에서 여전히 활동하고 있습니다. 이들을 제거하는 것은 과거와의 고리를 끊기 위해 필수적입니다."
 PER_a_party_no_more: "더 이상 정당이 아니다"
 PER_a_party_no_more_desc: "헤즈볼라의 존속은 지역 평화와 양립할 수 없습니다. 우리의 목표는 분명합니다. 그들의 군사 능력을 해체하는 것입니다."
 PER_challenge_russian_influence: "러시아 영향력에 도전"
 PER_challenge_russian_influence_desc: "이 지역에서 러시아의 지배력은 제지받지 않고 커져 왔습니다. 이란은 모스크바의 억압적인 손길에 맞설 의지가 있는 독립적인 세력으로 자신을 내세워야 합니다."
 PER_negotiate_f_thirty_five: "F-35 계약 협상"
 PER_negotiate_f_thirty_five_desc: "F-35 계획에 대한 접근권을 확보하는 것은 우리 방위 태세에 심오한 변화를 가져올 것입니다. 외교와 개혁이 그 길을 닦아야 합니다."
 PER_funds_for_democracies: "민주주의를 위한 자금"
 PER_funds_for_democracies_desc: "해외 민주주의 운동에 대한 지원은 우리의 새로운 정체성을 보여줍니다. 전략적 자금 지원은 더 안정적이고 우호적인 이웃 환경을 만드는 데 도움이 될 수 있습니다."
 PER_care_for_our_own: "우리 국민을 돌본다"
 PER_care_for_our_own_desc: "밖을 바라보더라도 우리 국민을 잊어서는 안 됩니다. 대외적 야망에는 복지 사업과 발전이 함께해야 합니다."
 PER_prospect_of_expansion: "확장의 전망"
 PER_prospect_of_expansion_desc: "CENTO는 배타적으로 남아서는 안 됩니다. 지역 민주주의 국가들과 온건한 강국들을 포함시키면 정당성과 지속성이 보장될 것입니다."
 PER_challenge_saudi_hegemony: "걸프 패권에 도전"
 PER_challenge_saudi_hegemony_desc: "걸프 왕국들은 오랫동안 이 지역의 방향을 좌우해 왔습니다. 대안적인 동맹을 제시함으로써 우리는 석유와 과두 체제를 넘어선 비전을 제시합니다."
 PER_standardize_alliance_training: "동맹 훈련 표준화"
 PER_standardize_alliance_training_desc: "강력한 동맹은 같은 군사 언어를 구사해야 합니다. 합동 훈련과 교리 조율은 CENTO의 작전 능력을 강화할 것입니다."
 PER_what_was_once_ours: "한때 우리의 것이었던 것"
 PER_what_was_once_ours_desc: "잃어버린 영토의 상흔은 여전히 우리 국가 의식을 괴롭힙니다. 이제 역사적 유산을 되찾는 미래를 그려 나가기 시작할 때입니다."
 PER_calm_the_nerves: "불안을 달랜다"
 PER_calm_the_nerves_desc: "우리가 부상하면 두려워 떠는 이들도 있을 것입니다. 우리의 위대함이 이웃의 몰락이 아님을 안심시키되, 그렇다고 우리의 불꽃을 낮추겠다는 뜻은 아닙니다."
 PER_investing_in_new_missiles: "신형 미사일 투자"
 PER_investing_in_new_missiles_desc: "우위는 물려받는 것이 아니라 만들어 내는 것입니다. 차세대 미사일 체계는 우리의 목소리가 지역 전체에 울려 퍼지도록 보장할 것입니다."
 PER_choking_hormuz: "호르무즈 봉쇄"
 PER_choking_hormuz_desc: "호르무즈 해협은 세계 석유 무역의 경동맥이며, 칼날은 우리가 쥐고 있습니다. 통행료는 정당한 대가에 불과합니다."
 PER_arm_the_rebels: "아랍 반군 무장"
 PER_arm_the_rebels_desc: "동부에서 불만이 들끓고 있습니다. 신중한 지원과 단호한 행동으로 사우드 가문의 균열을 파열로 바꿀 수 있습니다."
 PER_modernizing_silos: "사일로 현대화"
 PER_modernizing_silos_desc: "낡은 미사일 기반시설은 우리를 취약하게 만듭니다. 신속하고 안전한 발사를 보장하려면 전국의 사일로를 개량하는 것이 중요합니다."
 PER_the_northern_problem: "북부 문제"
 PER_the_northern_problem_desc: "아제르바이잔의 도발을 무시할 수 없습니다. 북부 문제를 단호하고 영구적으로 처리하기 위한 준비를 시작해야 합니다."
 PER_new_horizons: "새로운 지평"
 PER_new_horizons_desc: "우리의 에너지 외교는 전략적 야망에 부합해야 합니다. 우리의 절제를 이용하는 자들에게서 걸프 자원에 대한 정당한 몫을 요구할 것입니다."
 PER_break_the_iraqi_hand: "이라크의 손을 꺾는다"
 PER_break_the_iraqi_hand_desc: "이라크 국가는 오랫동안 남부에 사는 사람들을 억압해 왔습니다. 이 지역은 자원이 풍부함에도 바그다드 정부는 이 땅을 다스리기에 무능하다는 것을 스스로 입증했으며, 우리가 이를 바꿀 것입니다."
 PER_funds_for_aio: "AIO 자금 지원"
 PER_funds_for_aio_desc: "항공우주산업기구는 우리 군 현대화의 선봉입니다. 번영하는 데 필요한 지원을 제공할 것입니다."
 PER_move_on_oman: "오만 진격"
 PER_move_on_oman_desc: "오만은 핵심적인 전략적 요충지를 장악하고 있으면서도 고립되어 있습니다. 이를 바꿀 때가 되었습니다. 우리의 방식으로, 필요하다면 무력으로."
 PER_yes_men_of_qatar: "카타르의 예스맨"
 PER_yes_men_of_qatar_desc: "지역 강국들의 애완견 역할을 하는 카타르의 처지는 끝나야 합니다. 그들은 우리와 보조를 맞추거나, 우리의 부상 속에서 주석 한 줄이 될 것입니다."
 PER_preparing_our_anti_air: "대공 방어 준비"
 PER_preparing_our_anti_air_desc: "현대 국가는 하늘로부터 보호받아야 합니다. 우리의 대공 능력은 적의 능력에 필적하도록 발전해야 합니다."
 PER_fan_the_flames_in_baku: "바쿠에 불을 지핀다"
 PER_fan_the_flames_in_baku_desc: "아제르바이잔의 내부 불안은 조종하기에 무르익었습니다. 우리가 불을 붙이고 국경 너머에서 타오르는 것을 지켜볼 것입니다."
 PER_levy_historical_ties: "역사적 유대 동원"
 PER_levy_historical_ties_desc: "우리 이웃 나라들 중 다수는 한때 페르시아의 깃발이 휘날리던 땅이 분할된 결과로 존재합니다. 우리는 그들에게 공통의 과거와 기대되는 미래를 상기시킬 것입니다."
 PER_levy_religious_ties: "종교적 유대 동원"
 PER_levy_religious_ties_desc: "신앙의 유대는 이 지역에서 깊이 뿌리내리고 있습니다. 이를 통해 우리는 이 지역의 미래를 이끄는 우리의 역할을 정당화할 것입니다."
 PER_revoke_turkmenchay_treaty: "투르크멘차이 조약 폐기"
 PER_revoke_turkmenchay_treaty_desc: "투르크멘차이 조약은 굴욕이었습니다. 그 폐기는 부당하게 빼앗긴 것을 되찾는 새로운 장의 시작을 알릴 것입니다."
 PER_the_ardabil_conference: "아르다빌 회의"
 PER_the_ardabil_conference_desc: "아르다빌에서 계획이 세워지고 야망이 움직이기 시작합니다. 재통합의 길은 이곳에서 시작됩니다. 아제르바이잔 민족은 200년 가까이 전 모스크바의 위협으로 갈라졌을 뿐, 이란 민족과 하나입니다."
 PER_the_armenian_concern: "아르메니아 문제"
 PER_the_armenian_concern_desc: "아르메니아는 이란의 이익과 북쪽 사이에 박힌 역사적 쐐기입니다. 군사적 해결책이 필요할 수도 있는 문제입니다."
 PER_the_azarabadegan_guard: "아자라바데간 근위대"
 PER_the_azarabadegan_guard_desc: "북부 국경을 방어하기 위해 아자라바데간에 정예 부대가 창설될 것입니다. 이들은 방패이자 검의 역할을 할 것입니다."
 PER_unification_in_armenia: "아르메니아에서의 노력"
 PER_unification_in_armenia_desc: "승리를 확보하고 나면 아르메니아를 폐허로 방치해서는 안 됩니다. 경제적, 정치적, 군사적으로 그 운명을 우리의 운명과 묶기 위한 노력에 착수할 것입니다."
 PER_reunification: "재통합"
 PER_reunification_desc: "역사적 부당함을 바로잡을 날이 왔습니다. 아제르바이잔, 아르메니아, 투르크메니스탄의 땅은 이란의 품으로 돌아와야 합니다."
 PER_turmoil_in_the_ghanistan: "아프가니스탄의 혼란"
 PER_turmoil_in_the_ghanistan_desc: "아프가니스탄은 수십 년째 장기 내전의 한가운데에 있습니다. 이들에게 대처할 장기 계획을 준비하기 시작할 때입니다."
 PER_encroachment_to_the_east: "동쪽으로의 잠식"
 PER_encroachment_to_the_east_desc: "아프가니스탄 전쟁을 다른 누군가가 이기기를 기다리는 대신, 우리가 직접 이길 수 있습니다. 하자리스탄의 친이란 반군을 지원하여 아프가니스탄에 대한 장악력을 유지할 것입니다."
 PER_karim_khalili: "카림 칼릴리 지원"
 PER_karim_khalili_desc: "카림 칼릴리는 다른 인물들에 비해 온건파이며, 급진주의에서 벗어난 아프가니스탄을 원한다면 그가 찾아야 할 인물입니다."
 PER_asif_mohseni: "아시프 모흐세니 지원"
 PER_asif_mohseni_desc: "아시프 모흐세니는 칼릴리에 비해 강경파 후보이며, 아프가니스탄 시아파 사이에서의 인기가 하자라의 승리를 확보하는 데 필요한 바로 그 요소일 수 있습니다."
 PER_create_hazara_defense_force: "하자라 방위군 창설"
 PER_create_hazara_defense_force_desc: "하자라 민족은 단순한 민병대 집단으로는 이끌 수 없으며, 그들의 땅을 지킬 조직적이고 정규적인 군대가 세워져야 합니다."
 PER_fighting_the_taliban: "탈레반과의 전투"
 PER_fighting_the_taliban_desc: "아프간인들이 탈레반과 홀로 싸우게 둘 수 없으며, 아프간 국민의 투쟁을 도와 이 테러리스트들을 우리 국경에서 몰아내야 합니다."
 PER_ministry_of_war_and_armed_forces_logistics: "국방 및 군수부"
 PER_ministry_of_war_and_armed_forces_logistics_desc: "국방 및 군수부는 오랫동안 우리 교리와 계획, 전투 준비 태세의 작전적 완결성을 감독하는 임무를 맡아 왔습니다. 이 핵심 기관은 간과할 수 없으며, 번성하고 최적으로 기능하려면 관심과 주의가 필요합니다."
 PER_twenty_first_century_warfare: "21세기 전쟁"
 PER_twenty_first_century_warfare_desc: "전쟁은 끊임없이 진화하는 환경입니다. 낡은 전통을 고수한다면 우리 군은 비교적 손쉽게 휩쓸려 갈 것입니다."
 PER_brave_men_of_the_sky: "하늘의 용사들"
 PER_advanced_machines_of_the_sky: "하늘의 첨단 기계"
 PER_advanced_machines_of_the_sky_desc: "하늘 위에서 남녀노소가 머리 위를 날아가는 포효하는 야수들을 경외하며 올려다볼 것입니다. 순수한 지식과 노력, 이란의 장인 정신으로 신께서 우리 위에 새기신 푸른 지평선을 지배할 것입니다."
 PER_legacy_of_pessian: "페시안의 유산"
 PER_legacy_of_pessian_desc: "진정한 조종사였던 페시안은 현대성과 위대함, 자유를 향한 더 큰 이란 혁명의 첫 순교자 중 한 명이었습니다. 그의 유산은 잊히지 않을 것이며, 오히려 육군 항공대의 전통 속에서 영원히 기려질 것입니다."
 PER_jack_of_all_trades: "만능 재주꾼"
 PER_jack_of_all_trades_desc: "우리 조종사들은 유능해야 하며, 반드시 만능 재주꾼이어야 합니다. 그보다 못한 것은 타협이며, 이 힘겨운 시기에 우리는 그런 타협을 결코 할 수 없습니다."
 PER_steadfast_upgrades: "꾸준한 개량"
 PER_steadfast_upgrades_desc: "우리의 기체는 노후하고 있으며 비교적 빠르게 늙어 가고 있습니다. 하늘에서 적과 겨룰 수 있도록 항공기를 현대화하는 데 조율된 노력을 기울여야 합니다."
 PER_those_on_the_field: "전장의 사람들"
 PER_those_on_the_field_desc: "전장에 있는 사람들, 적과 싸우며 나라를 지키는 사람들, 이 땅을 위해 목숨을 바치는 사람들을 잊어서는 안 됩니다. 그들의 교리와 전쟁 방식을 강화하는 데 힘써야 합니다."
 PER_a_mans_best_friend: "군인의 가장 친한 친구"
 PER_a_mans_best_friend_desc: "군인의 가장 친한 친구는 곁에 놓인 포병입니다. 이 대포가 없다면 다른 이들의 길을 열기 위해 그러한 희생을 기꺼이 치를 이는 군인 자신 외에 누구이겠습니까?"
 PER_cannons_of_today: "오늘의 대포"
 PER_cannons_of_today_desc: "오늘날의 대포는 전장에서 무시무시한 무기입니다. 그러나 우리는 여전히 그저께의 대포를 쓰고 있습니다. 따라서 전장의 우리 병력을 위해 대등한 환경을 만들도록 낡은 장비를 개량하는 것이 우리의 의무입니다."
 PER_guidance_of_the_old_guard: "노병의 지도"
 PER_guidance_of_the_old_guard_desc: "때로는 케네스라 불리는 어떤 노인들은 횡설수설하지만, 우리의 노병들은 그렇지 않습니다. 우리에게는 노병과 오랜 기간 이곳을 지켜 온 지휘관들, 특히 이란-이라크 전쟁 시절의 인물들의 지도가 필요합니다."
 PER_armored_beasts: "장갑 야수"
 PER_armored_beasts_desc: "육지와 바다 모두에서 장갑 야수들이 자유롭게 돌아다니며 취약하고 장갑이 없는 약한 상대에게 참화를 일으킵니다. 우리 병사들이 그들의 먹잇감이 되지 않도록 우리만의 변형을 만들어야 합니다."
 PER_the_crews: "승무원"
 PER_the_crews_desc: "전차와 장갑차를 운용하는 승무원은 무엇보다 우선되어야 합니다. 그들은 덥고 습하며 종종 비좁은 환경에서 오랜 시간을 보냅니다."
 PER_the_turbulence_of_the_sea: "바다의 격랑"
 PER_the_turbulence_of_the_sea_desc: "바다는 어떤 선박에게도 반갑지 않고 적대적인 환경입니다. 따라서 우리 함선이 최고 수준이며 크기에 상관없이 어떤 파도도 감당할 수 있도록 각별히 신경 써야 합니다."
 PER_the_roar_of_an_engine: "엔진의 포효"
 PER_the_roar_of_an_engine_desc: "적절한 기술이 있다면 우리의 장갑차량은 접근하는 어떤 군대도 궤멸시킬 것입니다. 상대보다 우위를 점하도록 각별한 노력을 기울이는 것이 필수적입니다."
 PER_sailors_of_tomorrow: "내일의 선원들"
 PER_sailors_of_tomorrow_desc: "선원은 강인해야 하는 것이 사실이지만, 그들에게는 신뢰할 수 있는 선박과 장비가 필요합니다. 우리 영해와, 때때로 우리가 도발하고 싶은 누군가의 해역을 누비는 함선에 꼭 필요한 개량을 해야 할 때가 오래전에 지났습니다."
 PER_hope_and_pride_of_iran: "이란의 희망과 자부심"
 PER_hope_and_pride_of_iran_desc: "선원과 조종사는 이란의 희망이자 자부심입니다. 그들이 없다면 지상의 용감한 전사들을 지원하는 기계를 누가 운용하겠습니까?"
 PER_revolutionary_blueprint: "혁명 청사진"
 PER_revolutionary_blueprint_desc: "혁명 청사진은 이슬람적 가치에 따라 이란의 기반시설, 경제, 사회를 재편하겠다는 우리의 의지를 밝힙니다. 자립, 현대화, 국가적 단결을 통해 세계 무대에서의 입지를 강화하고 혁명의 성공을 보장할 것입니다."
 PER_way_of_the_imam: "이맘의 길"
 PER_way_of_the_imam_desc: "이맘의 길은 정의와 평등, 이슬람적 통치의 길입니다. 이는 우리의 정치적, 영적 쇄신의 토대입니다. 이맘의 가르침을 따름으로써 우리는 이슬람 공화국을 지키고 번영하는 독립적인 미래로 이끌고자 합니다."
 PER_bastion_of_islam: "이슬람의 보루"
 PER_bastion_of_islam_desc: "이란은 이슬람 혁명의 보루이자 이슬람적 통치와 가치의 요새로 서 있습니다. 이슬람 세계의 지도자로서 우리는 이슬람의 원칙을 수호하고 전파하여 어디서든 억압받는 이들이 목소리를 낼 수 있도록 할 것입니다."
 PER_state_of_the_revolution: "혁명의 현주소"
 PER_state_of_the_revolution_desc: "이슬람 공화국은 혁명의 구현체이며, 정의와 독립, 저항의 원칙 위에 세워진 국가입니다. 우리의 혁명은 경제 정책에서 국제 관계에 이르기까지 통치의 모든 측면을 계속 이끌며, 이맘의 이상이 우리 모든 행동의 중심에 남도록 보장합니다."
 PER_sepah_loyalty_discipline: "세파 충성 및 규율 구상"
 PER_sepah_loyalty_discipline_desc: "세파(이슬람 혁명수비대)는 우리 혁명의 방패입니다. 충성 및 규율 구상을 통해 세파와 이슬람 공화국 사이의 신뢰와 헌신의 유대를 강화하여, 우리 군이 혁명 수호에 흔들림 없도록 하고자 합니다."
 PER_the_media_fatwa: "언론 파트와"
 PER_the_media_fatwa_desc: "정보전의 시대에 언론 파트와는 언론이 이슬람 원칙의 지도 아래 놓이도록 보장합니다. 우리는 콘텐츠를 규제하고 이슬람적 가치를 장려하며 해로운 외국의 영향력을 제거하여 혁명과 국가의 온전함을 지킬 것입니다."
 PER_clamp_domestic_separatism: "국내 분리주의 단속"
 PER_clamp_domestic_separatism_desc: "국가적 단결은 이슬람 공화국의 힘에 무엇보다 중요합니다. 분리주의나 분열적 이념으로 우리의 단결을 훼손하려는 모든 세력은 단호히 처리해야 합니다. 모든 이란 민족 사이의 유대를 강화하여 외세가 후원하는 어떤 분리주의도 우리의 혁명을 위협하지 못하도록 하겠습니다."
 PER_establish_cyber_police: "사이버 경찰"
 PER_establish_cyber_police_desc: "디지털 전쟁의 부상과 인터넷을 통한 외국 선전의 확산은 국가 안보에 새로운 접근을 요구합니다. 사이버 경찰은 이슬람 공화국을 사이버 위협으로부터 보호하여 가상 영역이 해로운 영향에서 자유롭고 혁명에 봉사하도록 보장할 것입니다."
 PER_khomeinis_promise: "호메이니의 약속"
 PER_khomeinis_promise_desc: "이맘 호메이니가 한 약속은 정의와 신앙, 독립 위에 세워진 사회입니다. 우리는 가치를 굳건히 지키며 혁명의 성공을 보장하는 이슬람 공화국이라는 이맘의 비전을 실현하는 데 헌신합니다."
 PER_architechts_of_seventy_nine: "1979년의 설계자들"
 PER_architechts_of_seventy_nine_desc: "1979년 혁명의 영웅들은 이슬람 공화국의 토대를 놓았습니다. 그들의 비전과 희생, 지도력은 억압과 외세의 통제를 끝내고, 세계의 본보기로 계속 서 있는 주권 이슬람 국가를 세웠습니다."
 PER_ballistic_shift: "탄도 전환"
 PER_ballistic_shift_desc: "군사적 자급자족을 향한 우리의 추구는 첨단 탄도 능력 개발에 중점을 두고 계속됩니다. 이러한 전환을 통해 이란이 외부 위협에 맞서 스스로를 방어할 준비를 갖추게 하고, 독립을 천명하며 지역 내 입지를 강화할 것입니다."
 PER_self_sufficiency_jihad_org: "자급자족 지하드 기구"
 PER_self_sufficiency_jihad_org_desc: "자급자족 지하드 기구는 이란의 완전한 경제적, 기술적 독립을 보장하는 데 전념합니다. 우리 국민과 자원의 힘을 활용하여 외세에 대한 의존을 없애고 번영하며 자립하는 이란을 건설할 것입니다."
 PER_forbid_nuclear_arms: "핵무기 금지"
 PER_forbid_nuclear_arms_desc: "평화적 핵 기술에 대한 권리는 유지하되, 이슬람 공화국은 핵무기를 결코 개발하지 않겠다고 약속합니다. 이슬람 원칙에 따라 우리는 국가의 진정한 힘이 위험한 무기의 확산이 아니라 우리의 단결과 신앙에 있다고 믿습니다."
 PER_mouse_in_the_corner: "구석에 몰린 쥐"
 PER_mouse_in_the_corner_desc: "외세가 계속해서 우리를 고립시키고 도발하더라도 우리는 위축되지 않을 것입니다. 우리는 침략에 굴하지 않고 주권을 지킬 준비가 되어 있습니다. 쥐가 궁지에 몰리면 맞서 싸우듯이, 우리 역시 힘과 회복력을 보여줄 것입니다."
 PER_naja_focus: "NAJA"
 PER_naja_focus_desc: "국가경찰(NAJA)은 법을 수호하고 혁명을 보호하는 데 중요한 역할을 합니다. 이들은 질서를 유지하고 이슬람적 가치를 지키며, 이란 국민이 이슬람 공화국의 지도 아래 평화와 안전 속에 살도록 보장하는 데 주력합니다."
 PER_great_fire_wall: "거대 방화벽"
 PER_great_fire_wall_desc: "인터넷 시대에 거대 방화벽은 해로운 외국의 영향과 사이버 위협으로부터 국민을 지키는 데 필수적입니다. 우리는 가상 영역을 보호하여 이슬람적 가치에 부합하는 콘텐츠만 국민이 접근할 수 있도록 할 것입니다."
 PER_internet_freedom: "세계적 자유로의 접근"
 PER_internet_freedom_desc: "정보 접근의 중요성을 인정하면서도, 이슬람 공화국은 인터넷에 대한 통제되고 균형 잡힌 접근 방식을 지향합니다. 주권을 유지하면서 세계적 자원에 대한 접근을 제공함으로써 디지털 시대에도 이슬람적 가치를 지켜 낼 것입니다."
 PER_principles_of_vilayet_faqih: "벨라야테 파키흐 원칙"
 PER_principles_of_vilayet_faqih_desc: "벨라야테 파키흐 교리는 최고 권위를 이슬람 법학자의 손에 둡니다. 이 원칙은 이슬람 공화국의 모든 결정을 이끌며, 우리의 통치가 이슬람 법의 지혜와 이맘의 가르침에 뿌리를 두도록 보장합니다."
 PER_handle_student_groups: "학생 단체 대처"
 PER_handle_student_groups_desc: "학생 단체는 국가의 지적 생활에서 중요한 역할을 합니다. 그러나 이들의 활동은 항상 혁명의 원칙에 부합해야 합니다. 학생 운동이 이슬람 공화국의 더 큰 선에 봉사하며 단결과 진보를 지키도록 하겠습니다."
 PER_science_and_islam: "과학과 이슬람"
 PER_science_and_islam_desc: "이슬람 공화국은 과학의 발전과 이슬람적 가치 사이에 모순이 없다고 봅니다. 이란에서 과학 혁명을 일으켜 기술 진보가 우리의 종교적, 문화적 정체성과 조화를 이루며 달성되도록 하겠습니다."
 PER_warrants_on_problematic_people: "문제 인물에 대한 영장"
 PER_warrants_on_problematic_people_desc: "이슬람 공화국의 안정을 위협하거나 반혁명적 사상을 퍼뜨리는 개인은 단호히 처리해야 합니다. 국가의 단결과 안보를 해치는 자들에게 영장을 발부하여 혁명이 내부 위협으로부터 보호되도록 하겠습니다."
 PER_guided_by_faith: "신앙의 인도"
 PER_guided_by_faith_desc: "우리 나라의 방향은 신앙에 굳건히 뿌리를 두고 있으며 이슬람의 신성한 원칙의 인도를 받습니다. 국내 정책에서 국제 관계에 이르는 모든 결정은 우리 신앙이 규정한 정의, 공평, 올바름의 가치에 부합합니다."
 PER_guided_by_people: "국민의 인도"
 PER_guided_by_people_desc: "이슬람 공화국의 힘은 국민의 의지에 있습니다. 모든 정책과 결정이 이란 대중의 바람과 필요를 반영하도록 하여 이슬람적 틀 안에서 국민주권의 원칙을 지킬 것입니다."
 PER_with_no_choice: "...다른 선택이 없다"
 PER_with_no_choice_desc: "외부의 침략이나 내부의 불안에 직면하면 이슬람 공화국은 단호하게 행동할 수밖에 없습니다. 외교적이든 방어적이든 우리의 행동은 혁명을 지키고 주권을 보존해야 한다는 필요에 따른 것입니다."
 PER_anti_riot_equipment: "진압 장비 수입"
 PER_anti_riot_equipment_desc: "질서를 유지하고 이슬람 공화국의 온전함을 지키기 위해 법 집행 기관이 소요를 관리하는 데 필요한 도구를 갖추도록 하겠습니다. 첨단 진압 장비를 수입함으로써 국민의 평화와 안전을 지킬 능력을 강화합니다."
 PER_increased_guidance_patrol: "가슈테 에르샤드"
 PER_increased_guidance_patrol_desc: "계도 순찰대(가슈테 에르샤드)는 사회의 도덕적 나침반 역할을 합니다. 이들의 존재를 늘림으로써 공공장소가 정숙과 이슬람 율법의 가치에 부합하도록 보장하고, 우리의 신성한 원칙을 반영하는 사회를 장려하겠습니다."
 PER_abolish_guidance_patrol: "계도 순찰대 폐지"
 PER_abolish_guidance_patrol_desc: "새로운 시대에는 이슬람적 맥락 속에서 개인의 자유가 갖는 중요성을 인정하여 계도 순찰대의 폐지를 고려할 수 있습니다. 이는 개인의 자유와 사회적 결속의 필요성 사이에 균형을 맞추는 한 걸음이자, 공화국의 변화하는 성격을 반영하는 일이 될 것입니다."
 PER_electoral_clarity: "선거의 투명성"
 PER_electoral_clarity_desc: "선거 과정의 투명성과 공정성을 보장하는 것은 이슬람 공화국의 핵심 원칙입니다. 모든 표가 정확히 집계되고 선거가 이슬람적 틀의 지도 아래 국민의 진정한 의지를 반영하도록 보장하는 개혁을 도입하겠습니다."
 PER_utilize_workers_house: "노동자의 집 활용"
 PER_utilize_workers_house_desc: "노동자의 집은 이슬람 공화국에서 노동자의 목소리가 경청되고 존중받도록 보장하는 필수 기관입니다. 이 기구에 힘을 실어 노동자 계급의 필요에 더 잘 봉사하게 하고, 사회 정의를 촉진하며 우리 경제를 움직이는 국민의 복지를 높이겠습니다."
 PER_expand_nehsa: "NEHSA 확장"
 PER_expand_nehsa_desc: "이슬람 혁명수비대 항공우주군인 NEHSA는 기술 면에서 상당히 빠르게 뒤처지고 있습니다. 러시아에 손을 내밀어 새로운 기술을 조달할 때가 되었습니다."
 PER_vaja_intel: "VAJA 정보"
 PER_vaja_intel_desc: "VAJA 정보기관은 이슬람 공화국의 온전함을 유지하는 데 필수적입니다. 이 정보기관은 우리가 모든 음모자나 외국 적들보다 한 발 앞서도록 보장하여 혁명을 지키고 이란 국민의 주권을 보호합니다."
 PER_funding_for_faraja: "FARAJA 자금 지원"
 PER_funding_for_faraja_desc: "FARAJA는 이슬람적 가치와 공화국을 부패와 외세의 영향으로부터 방어하는 데 중요한 역할을 합니다. 자금 지원을 늘리면 법과 질서를 지키는 능력이 강화되어 혁명의 원칙이 사회 모든 수준에서 수호될 것입니다."
 PER_hijab_and_chastity: "히잡 및 정숙 법안"
 PER_hijab_and_chastity_desc: "히잡 및 정숙 법안은 모든 이란 여성이 이슬람 가르침이 규정한 정숙과 순결의 원칙을 따르도록 보장하고자 합니다. 이 법은 사회의 도덕적 기반을 지키고 신의 인도에 따른 삶을 장려함으로써 혁명의 가치를 강화할 것입니다."
 PER_strengthen_guardian_council: "수호자 위원회 강화"
 PER_strengthen_guardian_council_desc: "수호자 위원회는 법률과 후보자의 적법성을 감독하여 이슬람 공화국이 원칙에 충실하도록 보장합니다. 위원회를 강화하면 우리의 이슬람적 통치가 더욱 보호되고 공화국이 혁명이 정한 길을 계속 걷게 됩니다."
 PER_weaken_guardian_council: "수호자 위원회 약화"
 PER_weaken_guardian_council_desc: "이슬람 공화국 내에서 더 큰 유연성과 정치 개혁을 허용하기 위해 수호자 위원회의 영향력을 약화시키는 방안을 고려할 수 있습니다. 이는 더 다양한 정치적 견해가 꽃필 수 있게 하겠지만, 이슬람적 통치의 힘이 희석될 가능성이라는 대가가 따릅니다."
 PER_basij_autonomy: "바시즈에 자율권 부여"
 PER_basij_autonomy_desc: "바시즈는 우리 혁명 세력의 심장이며, 자율권을 부여하면 이슬람 공화국을 수호하는 데 더 단호하게 행동할 수 있습니다. 바시즈에 힘을 실어 혁명 정신이 굳건히 유지되고 국민의 목소리가 계속 나라를 이끌도록 보장합니다."
 PER_family_and_loyalty: "가족과 충성"
 PER_family_and_loyalty_desc: "이슬람 공화국의 힘은 가족을 초석으로 삼아 세워집니다. 가족 구조 안에서 국가와 혁명의 가치에 대한 충성을 장려하면 국가의 안정과 미래가 보장되고, 신앙과 책임, 단결에 기반한 사회가 만들어질 것입니다."
 PER_power_of_the_leader: "지도자의 권력"
 PER_power_of_the_leader_desc: "지도자는 이슬람 공화국을 이끄는 최고 권위를 지닙니다. 지도자의 권한을 확대하면 국민의 의지와 이슬람 원칙의 인도에 따라 결정이 신속하고 단호하게 내려집니다."
 PER_the_imams_line: "이맘의 노선"
 PER_the_imams_line_desc: "이맘의 노선은 우리 지도부와 이슬람의 신성한 인도 사이의 끊어지지 않는 연결을 나타냅니다. 이 노선을 지키면 이슬람 공화국이 혁명의 본래 비전에 뿌리를 두고, 가르침의 순수성과 국가적 단결의 힘을 유지하도록 보장됩니다."
 PER_cooperation_with_artesh: "아르테시와의 협력"
 PER_cooperation_with_artesh_desc: "완전히 단절된 두 개의 군 최고 사령부를 두는 것은 국가에서 제대로 기능할 수 없습니다. 승리를 보장하려면 IRGC와 AJA가 서로 보조를 맞춰 최선의 결과를 내야 합니다."
 PER_naja: "NAJA"
 PER_naja_desc: "이란 이슬람 공화국 법 집행 사령부는 이란의 제복 경찰력입니다."
 PER_irgc_self_sufficiency_jihad_org: "IRGC 자급자족 지하드 기구"
 PER_irgc_self_sufficiency_jihad_org_desc: "IRGC 자급자족 지하드 기구는 지표 투과 레이더, 통신 체계, 무기, 전투 차량, 전자 사이버전 장비를 개발하고 제조하는 연구개발 기관이며, 생산 시설은 테헤란과 이스파한에 있습니다."
 PER_irgc_navy: "IRGC 해군"
 PER_irgc_navy_desc: ""
 PER_paralyzed_prosperity: "마비된 번영"
 PER_paralyzed_prosperity_desc: "우리 경제는 비효율과 낡은 관행에 성장이 가로막힌 정체 상태에 빠져 있습니다. 이러한 마비에서 벗어나 국가 경제 기구를 되살리는 것이 중요합니다."
 PER_commanders_of_commerce: "상업의 지휘관들"
 PER_commanders_of_commerce_desc: "영향력 있는 소수의 기업 지도자들이 국가의 경제 방향을 이끌고자 등장했습니다. 상업과 산업을 현대화하려는 이들의 노력이 경제 정체에서 벗어나는 열쇠가 될 수 있습니다."
 PER_sins_of_charity: "자선의 죄악"
 PER_sins_of_charity_desc: "자선 단체들이 최근 몇 년간 번성했으나, 일부는 영향력을 그다지 고귀하지 않은 목적에 사용했습니다. 이러한 단체들을 조사하여 그 자원이 더 큰 선을 위해 쓰이고 있는지 확인해야 합니다."
 PER_control_tax_evasion: "탈세 단속"
 PER_control_tax_evasion_desc: "대부분의 국가에서 가장 부유한 개인과 기업은 계속해서 세금을 회피하여, 국가 발전에 절실한 공적 자금을 고갈시키고 있습니다. 그러나 이란에서는 상황이 더욱 나쁩니다. 농민과 서민이 세금 납부를 거부하는데, 이는 인구의 약 30%에 달합니다."
 PER_rials_behind_red_tape: "관료주의에 묶인 리알"
 PER_rials_behind_red_tape_desc: "관료적 비효율과 복잡한 규제로 자금이 잘못 배분되고 있습니다. 절차를 간소화하고 관료주의를 타파하면 경제 자원이 가장 필요한 곳으로 향하게 됩니다."
 PER_root_out_money_laundering: "자금세탁 척결"
 PER_root_out_money_laundering_desc: "자금세탁은 여전히 심각한 문제이며, 막대한 불법 자금이 공식 경제 밖에서 유통되고 있습니다. 국익을 지키기 위해 이러한 활동을 공격적으로 겨냥하여 해체해야 합니다."
 PER_the_lost_generations: "잃어버린 세대"
 PER_the_lost_generations_desc: "수십 년간의 방치로 인구의 상당수가 교육이나 출세의 기회를 얻지 못했습니다. 이들의 미래에 투자하여 어떤 세대도 뒤처지지 않도록 할 때입니다."
 PER_upholding_justice: "정의 수호"
 PER_upholding_justice_desc: "제도에 대한 신뢰를 회복하려면 사법 체계가 공정하고 불편부당하게 운영되도록 해야 합니다. 법적 절차를 개혁하면 모든 시민이 법 앞에서 평등한 대우를 받을 것입니다."
 PER_reclaim_control: "통제권 회복"
 PER_reclaim_control_desc: "소수의 강력한 이해 집단이 우리 경제의 핵심 부문에 지나치게 큰 영향력을 얻었습니다. 단호한 조치를 취해 통제권을 되찾고 국가의 권위가 존중받도록 해야 합니다."
 PER_additional_funds_for_khatam_al_anbia: "하탐 알안비야 추가 자금"
 PER_additional_funds_for_khatam_al_anbia_desc: "하탐 알안비야는 국가의 여러 핵심 기반시설 사업에서 중심적인 역할을 합니다. 이 기구에 추가 자금을 배정하면 중요한 사업이 기한 내에 예산 범위 안에서 완료될 것입니다."
 PER_dismantling_the_monopoly: "독점 해체"
 PER_dismantling_the_monopoly_desc: "소수의 강력한 주체가 시장을 지배하여 경쟁을 제한하고 혁신을 억누르고 있습니다. 이러한 독점을 해체하고 더 공정하고 경쟁적인 경제를 만들기 위한 조치를 취해야 합니다."
 PER_grip_of_the_state: "국가의 장악"
 PER_grip_of_the_state_desc: "국가 통치를 강화하려면 국가가 핵심 산업과 서비스에 대해 더 큰 통제력을 행사해야 합니다. 이는 나라의 부가 공공 복지와 국가 발전을 향해 제대로 쓰이도록 보장할 것입니다."
 PER_investigate_ineffeciency: "비효율 조사"
 PER_investigate_ineffeciency_desc: "정부 운영의 만연한 비효율이 잠재력 손실로 국가에 수십억의 손해를 끼치고 있습니다. 이러한 문제를 철저히 조사하고 제도의 효율을 극대화할 개혁을 시행할 때입니다."
 PER_weaken_konkour: "콘쿠르 약화"
 PER_weaken_konkour_desc: "콘쿠르 시험은 엘리트에게 유리하고 불평등을 영속시키며 많은 지원 학생들에게 장애물이 되었습니다. 고등교육 접근이 특권이 아닌 실력에 기반하도록 제도를 개혁할 때입니다."
 PER_reinforce_konkour: "콘쿠르 강화"
 PER_reinforce_konkour_desc: "콘쿠르 시험 제도는 국가의 학업적, 직업적 성공의 근간입니다. 이 제도를 강화하면 가장 뛰어나고 영리한 이들만이 고등교육이 제공하는 기회에 접근할 수 있게 됩니다."
 PER_alcohol_matter: "음주 문제"
 PER_alcohol_matter_desc: "음주는 우리 사회에서 여전히 민감한 문제입니다. 관련 규제를 검토함으로써 문화적 가치에 대한 존중과 공중 보건 문제 해결 사이에서 균형을 잡을 수 있습니다."
 PER_security_in_the_south_east: "남동부의 치안"
 PER_security_in_the_south_east_desc: "남부와 동부 국경은 여전히 범죄 활동과 지역 불안정에 취약합니다. 이 지역의 치안을 강화하는 것은 평화를 유지하고 국가 자원을 지키는 데 중요합니다."
 PER_auction_irgc_companies: "IRGC 기업 경매"
 PER_auction_irgc_companies_desc: "IRGC와 연계된 여러 기업이 상당한 경제적 영향력을 쥐고 있습니다. 이 자산을 경매에 부치면 권력이 재분배되고 공공 부문이 활력을 얻으며, 군의 경제 개입도 억제할 수 있습니다."
 PER_stakes_in_bahman_group: "바흐만 그룹 지분"
 PER_stakes_in_bahman_group_desc: "바흐만 그룹은 국내 자동차 시장의 상당 부분을 차지하고 있습니다. 이 영향력 있는 기업의 지분을 확보하면 더 큰 감독을 보장하고 이 분야의 경쟁을 촉진할 수 있습니다."
 PER_trial_zanjani: "바박 잔자니 재판"
 PER_trial_zanjani_desc: "각종 부패 활동에 연루된 사업가 바박 잔자니는 법의 심판을 받아야 합니다. 그의 재판은 최고위층에서의 부패 척결에 대한 우리의 의지를 강하게 알릴 것입니다."
 PER_expansion_of_state_bonyads: "국가 본야드 확대"
 PER_expansion_of_state_bonyads_desc: "국가와 연계된 재단인 본야드는 사회 복지와 발전에서 중요한 역할을 합니다. 이들의 활동 범위를 넓히면 더 많은 시민을 지원하고 경제 안정에 기여할 수 있습니다."
 PER_ministry_of_education: "문해 운동"
 PER_ministry_of_education_desc: "전국의 문해율을 높이는 것은 숙련된 노동력을 키우는 데 필수적입니다. 교육부는 모든 시민을 위한 교육 기회 확대를 이끌어야 합니다."
 PER_hijab_issue: "히잡 문제"
 PER_hijab_issue_desc: "히잡을 둘러싼 지속적인 논쟁은 국가 정체성을 계속 형성하고 있습니다. 국가의 가치를 존중하면서도 개인의 권리와 선택을 다루는 길을 찾는 것이 중요합니다."
 PER_target_the_smugglers: "밀수업자 표적"
 PER_target_the_smugglers_desc: "밀수는 여전히 심각한 문제로, 나라의 소중한 자원을 고갈시키고 범죄 활동을 부추깁니다. 더 강경한 입장을 취하여 이러한 불법 활동을 뿌리 뽑을 때입니다."
 PER_fate_of_oil_fields: "유전의 운명"
 PER_fate_of_oil_fields_desc: "국가의 유전은 막대한 부의 원천이지만 잠재적 불안정의 요인이기도 합니다. 장기적인 경제 안보를 위해 이 자원의 관리를 국유화할지 개혁할지 결정해야 합니다."
 PER_cripple_the_bonyads: "본야드 무력화"
 PER_cripple_the_bonyads_desc: "본야드는 경제와 사회 영역에서 지나치게 커지고 영향력이 막강해졌습니다. 이들의 권력을 줄이면 자원과 기회를 더 공평하게 분배할 수 있습니다."
 PER_uplift_the_bonyads: "본야드 육성"
 PER_uplift_the_bonyads_desc: "본야드에는 결점이 있지만 소외 계층에 상당한 지원을 제공합니다. 이들의 역할을 강화하면 자원이 사회의 가장 어려운 구성원을 돕는 데 효과적으로 쓰일 것입니다."
 PER_tighten_port_registration: "항만 등록 규정 강화"
 PER_tighten_port_registration_desc: "부적절한 항만 등록과 통제되지 않은 수입이 경제적 비효율과 불법 무역으로 이어졌습니다. 이러한 규정을 강화하면 투명성이 높아지고 무역이 제대로 감시될 것입니다."
 PER_expand_university_campuses: "대학 캠퍼스 확장"
 PER_expand_university_campuses_desc: "대학 캠퍼스를 확장하면 고등교육 접근성이 높아져, 앞으로의 경제 성장을 이끌 더 숙련되고 교육받은 노동력을 키울 수 있습니다."
 PER_end_oil_smuggling: "석유 밀수 근절"
 PER_end_oil_smuggling_desc: "석유 밀수는 국가의 경제적 안정을 해쳤습니다. 이러한 불법 행위를 없애고 모든 석유 수익이 제대로 회계 처리되도록 단호한 조치를 취해야 합니다."
 PER_dissolve_mobin_trust_consortium: "모빈 트러스트 컨소시엄 해산"
 PER_dissolve_mobin_trust_consortium_desc: "모빈 트러스트 컨소시엄은 견제받지 않는 권력과 부패의 상징이 되었습니다. 이를 해산하면 자원의 추가 독점을 막고 더 경쟁적인 사업 환경을 조성할 수 있습니다."
 PER_abolish_tax_cuts: "감세 폐지"
 PER_abolish_tax_cuts_desc: "부유층에 대한 감세는 불평등을 심화시키고 공공 수입을 줄였습니다. 이를 폐지하면 조세 제도의 공정성이 회복되고 공공 서비스에 필요한 자금이 마련됩니다."
 PER_direct_control_over_all: "절대적 통제"
 PER_direct_control_over_all_desc: "경제 전 부문에 대한 국가의 직접 통제를 강화하면 부패와 비효율에 대처할 수 있습니다. 권한을 중앙집중화함으로써 개혁을 더 효과적으로 시행할 수 있습니다."
 PER_strengthen_setad: "SETAD 강화"
 PER_strengthen_setad_desc: "SETAD는 국가 자산 관리의 핵심 주체입니다. 영향력을 강화하면 이 자산이 효율적으로, 국익을 위해 활용되도록 보장할 수 있습니다."
 PER_reform_konkour: "콘쿠르 개혁"
 PER_reform_konkour_desc: "콘쿠르 제도에는 결점이 있지만, 국가의 교육적 필요에 더 잘 부응하도록 개혁할 수 있습니다. 공정성과 투명성을 확보하면 모든 학생에게 기회의 문이 열릴 것입니다."
 PER_harshen_examination_process: "시험 절차 강화"
 PER_harshen_examination_process_desc: "입학시험의 난이도를 높이면 교육 수준이 높아지고, 가장 자격을 갖춘 지원자만이 고등교육에 접근할 수 있게 됩니다."
 PER_locate_traficing_rings: "밀매 조직 색출"
 PER_locate_traficing_rings_desc: "마약 밀매는 계속해서 국경을 괴롭히며 지역을 불안정하게 하고 조직범죄에 자금을 댑니다. 국가의 안전을 지키기 위해 이러한 조직망을 파악하고 해체해야 합니다."
 PER_nationalize_the_wealth: "그들의 부를 국유화"
 PER_nationalize_the_wealth_desc: "막대한 사유 재산은 여전히 소수의 손에 집중되어 있습니다. 이 자산을 국유화함으로써 부를 더 공평하게 분배하고 국민 전체의 이익을 위해 쓸 수 있습니다."
 PER_start_merges: "합병 개시"
 PER_start_merges_desc: "경제를 강화하려면 규모가 작고 비효율적인 기업들이 더 크고 강력한 주체로 합병되도록 장려해야 합니다. 이는 경쟁력과 경제적 안정을 높일 것입니다."
 PER_pillar_of_welfare: "복지의 기둥"
 PER_pillar_of_welfare_desc: "모든 시민이 생산적이고 보람찬 삶을 영위하는 데 필요한 자원에 접근할 수 있도록 복지와 사회 서비스를 우선시해야 합니다."
 PER_rebuild_the_curriculum: "교육과정 재건"
 PER_rebuild_the_curriculum_desc: "현대화된 교육과정은 다음 세대가 급변하는 세상에서 번성하는 데 필요한 지식과 기술을 갖추게 해 줄 것입니다. 미래의 도전에 맞서도록 교육을 개혁해야 합니다."
 PER_promising_and_gifted_students: "유망하고 재능 있는 학생"
 PER_promising_and_gifted_students_desc: "재능 있는 학생을 발굴하고 육성하면 내일의 지도자와 혁신가를 길러낼 수 있습니다. 이 구상은 나라에서 가장 뛰어난 인재들에게 장학금과 멘토링을 제공할 것입니다."
 PER_invest_into_gharb: "가르브 투자"
 PER_invest_into_gharb_desc: "나라 서부에 대한 투자는 쿠르드인이 거주하는, 종종 간과되어 온 이 지역에 꼭 필요한 기반시설 개선을 이루는 데 도움이 될 것입니다."
 PER_invest_into_shargh: "샤르크 투자"
 PER_invest_into_shargh_desc: "나라 동부 지역은 오랫동안 소외되어 왔습니다. 샤르크 지역에 투자하면 우리의 경제적 영향권이 강화되고 이 중요한 지역의 기반시설이 개선될 것입니다."
 PER_tabriz_service_sector: "타브리즈 서비스 부문"
 PER_tabriz_service_sector_desc: "타브리즈의 서비스 부문을 발전시키면 새로운 일자리가 생기고 경제가 활성화되며, 이 도시의 전략적 입지에 힘입어 지역 경제 중심지로 거듭날 수 있습니다."
 PER_see_to_atrak_border: "아트락 국경 정비"
 PER_see_to_atrak_border_desc: "아트락 국경의 기반시설과 치안을 강화하면 무역이 개선되고 밀수가 줄어들어, 경제가 향상되고 이 전략적 지역이 안정될 것입니다."
 PER_utilize_afghan_labor: "아프간 노동력 활용"
 PER_utilize_afghan_labor_desc: "아프간 노동력은 이란의 많은 산업에 비용 효율적인 해법이 될 수 있습니다. 적절한 규제와 보호를 마련하면 이 노동력을 활용하는 동시에 지역 안정에도 기여할 수 있습니다."
 PER_safeguard_eastern_border: "동부 국경 수호"
 PER_safeguard_eastern_border_desc: "동부 국경의 방어를 강화하면 밀수, 불법 무역, 잠재적 반군 활동으로부터 나라를 보호하며 가장 취약한 지역 중 하나를 지킬 수 있습니다."
 PER_investments_into_golestan: "골레스탄 농업 투자"
 PER_investments_into_golestan_desc: "골레스탄주는 상당한 농업 잠재력을 지니고 있습니다. 현대 영농 기술과 기반시설에 투자하면 생산성이 향상되고 국가의 식량 안보가 강화됩니다."
 PER_expanding_the_power_grid: "전력망 확장"
 PER_expanding_the_power_grid_desc: "국가 전력망을 확장하면 모든 지역에 안정적이고 신뢰할 수 있는 전력을 공급하여 산업 성장을 뒷받침하고 시민의 삶의 질을 높일 수 있습니다."
 PER_chabahar_port: "차바하르 항"
 PER_chabahar_port_desc: "차바하르 항은 상당한 전략적, 경제적 잠재력을 지니고 있습니다. 이 항구의 확장에 투자하면 특히 인도양 지역에서 국제 무역의 핵심 거점으로서 이란의 입지가 강화됩니다."
 PER_neighbourly_investments: "이웃 나라 투자"
 PER_neighbourly_investments_desc: "이웃 나라의 경제에 투자하면 지역 유대가 강화되고 상호 이익이 생겨납니다. 국경 너머의 성장을 장려함으로써 국내와 지역의 안정을 모두 높일 수 있습니다."
 PER_embracing_the_open_market: "개방 시장 수용"
 PER_embracing_the_open_market_desc: "시장을 외국인 투자에 개방하면 경쟁과 혁신, 성장이 촉진되어 이란의 세계 경제 편입이 보장됩니다."
 PER_ditching_the_five_year_model: "5개년 모델 폐기"
 PER_ditching_the_five_year_model_desc: "5개년 개발 계획의 경직된 구조가 우리의 발목을 잡고 있습니다. 경제 성장에 더 유연하고 시장 중심적인 접근 방식을 채택할 때입니다."
 PER_export_quotas: "수출 할당량"
 PER_export_quotas_desc: "수출 할당량을 설정하면 자원 수출이 조절되어 국내 수요와 국제 수요 사이의 균형을 유지할 수 있습니다."
 PER_free_zones_kish: "키시 자유 구역"
 PER_free_zones_kish_desc: "키시 섬에 자유 무역 구역을 설치하면 국제 기업과 투자자가 유치되어 관광과 무역이 활성화되고 세계 속 존재감도 높아질 것입니다."
 PER_subsidies_on_gas: "가스 대규모 보조금"
 PER_subsidies_on_gas_desc: "가스에 대규모 보조금을 지급하면 이란 시민이 에너지를 더 저렴하게 이용할 수 있어 경제 활동이 촉진되고 생활비 부담이 줄어듭니다."
 PER_offshore_drilling: "해상 시추"
 PER_offshore_drilling_desc: "해상 시추 사업을 확대하면 미개발 석유 매장량이 개방되어 에너지 수출이 늘고 국가 수입이 증가합니다."
 PER_oil_shale_in_jordan: "요르단 오일셰일 채굴 지원"
 PER_oil_shale_in_jordan_desc: "요르단의 오일셰일 채굴을 지원하면 지역 경제 유대가 강화되고 양국 모두에 이로운 새로운 에너지원이 만들어집니다."
 PER_rival_doha_and_dubai: "도하와 두바이의 경쟁자"
 PER_rival_doha_and_dubai_desc: "아부 무사 지역을 상업 및 금융 중심지로 개발하면 도하와 두바이에 맞설 경쟁력 있는 대안을 만들어 국제 투자를 유치할 수 있습니다."
 PER_black_gold_behind_zagros: "자그로스 너머의 검은 황금"
 PER_black_gold_behind_zagros_desc: "자그로스 산맥 너머의 미개발 석유 매장량을 탐사하고 개발하면 지역의 핵심 에너지 공급국으로서 이란의 입지가 강화될 것입니다."
 PER_investments_in_abumusa: "아부 무사 투자"
 PER_investments_in_abumusa_desc: "아부 무사에 대한 투자에 집중하면 이곳이 중요한 경제 및 상업 중심지로 탈바꿈하여 걸프에서의 이란의 전략적 존재감이 강화됩니다."
 PER_caucasian_focus: "캅카스 중시"
 PER_caucasian_focus_desc: "캅카스로 관심을 돌리면 무역, 에너지 개발, 지역 영향력의 새로운 길이 열려 더 넓은 중동에서 이란의 역할이 강화됩니다."
 PER_liberty_equality_workers_rule: "자유, 평등, 노동자 통치"
 PER_liberty_equality_workers_rule_desc: "우리는 자유, 평등, 그리고 생산수단에 대한 노동자의 통제라는 원칙을 받아들여야 합니다. 국민은 더 이상 자본가와 제국주의자들에게 예속되지 않을 것입니다. 우리는 함께 모든 개인이 존엄하게 살고 일할 자유를 누리는 사회를 건설할 것입니다."
 PER_hekmats_legacy: "헤크마트의 유산"
 PER_hekmats_legacy_desc: "이란 공산주의 운동에 대한 헤크마트의 기여는 여전히 우리 이념적 토대의 중요한 일부입니다. 정의와 평등을 위한 그의 투쟁은 노동자 계급이 미래를 재편할 힘을 갖는 사회를 만들고자 하는 우리에게 계속 영감을 줍니다."
 PER_a_better_world: "더 나은 세상"
 PER_a_better_world_desc: "우리는 착취가 폐지되고 모든 사람의 필요가 충족되는 세상을 만드는 데 헌신합니다. 우리의 투쟁은 이란에 국한되지 않고, 더 낫고 더 공평한 세상을 위한 세계적 운동에 영감을 주는 것을 목표로 합니다."
 PER_diplomatic_neutrality: "외교적 중립"
 PER_diplomatic_neutrality_desc: "우리의 외교 정책은 이란이 제국주의 세력의 조종에 희생되지 않도록 중립에 대한 우리의 의지를 반영해야 합니다. 우리는 다른 진보적 국가들과 관계를 발전시키되, 우리의 혁명을 불안정하게 하려는 외부 세력의 영향은 피할 것입니다."
 PER_taqvaees_vision: "타크바이의 비전"
 PER_taqvaees_vision_desc: "타크바이의 비전은 사회 정의와 노동자의 권리가 모든 정책의 핵심에 놓인 사회를 요구합니다. 그는 집단적 노력과 국민의 힘으로 빈곤과 불평등을 해결하는 진보적인 이란을 믿었습니다."
 PER_modarresis_guidance: "모다레시의 인도"
 PER_modarresis_guidance_desc: "모다레시의 철학은 노동 대중을 단결시키고 그들이 자신의 운명을 통제하도록 보장하는 데 뿌리를 두고 있었습니다. 그의 인도는 집단적 책임을 중시하고 사회적, 경제적 불의를 없애는 사회를 만드는 데 우리의 나침반이 될 것입니다."
 PER_complete_denuclearization: "완전한 비핵화"
 PER_complete_denuclearization_desc: "이란 혁명은 대량살상무기를 앞세운 권력 다툼이 아니라 평화를 보장하고자 합니다. 우리는 핵무장에 반대하고 파괴가 아닌 평화와 협력에 집중하며 세계적 군축을 옹호할 것입니다."
 PER_the_bear_and_eagle: "곰과 독수리 사이에서"
 PER_the_bear_and_eagle_desc: "동서 초강대국 사이에 위치한 나라로서 우리는 지정학적 지형을 신중하게 헤쳐 나가야 합니다. 우리의 목표는 어느 쪽의 제국주의에도 희생되지 않으면서 주권을 유지하고 혁명적 이상을 장려하는 것입니다."
 PER_catapult_the_cadres: "간부 양성"
 PER_catapult_the_cadres_desc: "목표를 달성하려면 혁명이 교육받고 헌신적인 간부들의 인도를 받도록 해야 합니다. 혁명의 미래 지도자들이 제대로 훈련받도록 하는 프로그램을 시행하여, 그들이 국민을 진정한 사회주의로 이끌 수 있도록 힘을 실어 줄 것입니다."
 PER_uproot_the_oligarchs: "과두 지배층 뿌리 뽑기"
 PER_uproot_the_oligarchs_desc: "노동자 계급의 억압으로 이득을 취한 자본가 과두 지배층은 제거되어야 합니다. 그들의 부를 몰수하여 국민에게 재분배하고, 국가의 자원이 공공의 선에 봉사하는 사회를 건설할 것입니다."
 PER_middle_east_and_north_africa_network: "중동 및 북아프리카 네트워크"
 PER_middle_east_and_north_africa_network_desc: "우리의 혁명은 이란의 국경에서 끝나지 않습니다. 중동과 북아프리카 전역에 진보적이고 혁명적인 운동의 네트워크를 구축하고, 지역의 다른 노동자 계급 운동과 강력한 동맹을 맺어 제국주의와 억압에 맞서 싸울 것입니다."
 PER_social_equality: "사회적 평등"
 PER_social_equality_desc: "진정한 사회주의는 성별, 민족, 사회 계급에 관계없이 모든 사람이 평등하게 대우받는 것을 뜻합니다. 모든 형태의 차별과 불평등을 없애고, 모든 개인이 성공할 평등한 기회를 갖는 사회를 건설하기 위해 노력할 것입니다."
 PER_bread_and_roses_campaign: "빵과 장미 캠페인"
 PER_bread_and_roses_campaign_desc: "우리의 혁명은 단순한 경제적 생존 이상이어야 하며, 국민의 문화적, 사회적 안녕에 관한 것이어야 합니다. 빵과 장미 캠페인은 노동자 계급이 삶의 기본적 필수품과 예술, 문화, 행복을 추구할 능력을 모두 누리도록 보장할 것입니다."
 PER_workers_party_of_iraq: "이라크 노동자당"
 PER_workers_party_of_iraq_desc: "노동자 계급과의 연대는 국경을 넘어섭니다. 이라크 노동자당은 우리의 가치와 사회주의 미래에 대한 비전을 공유합니다. 우리는 함께 제국주의와 이 지역을 지배하려는 자본주의 세력에 저항할 것입니다."
 PER_turning_from_religion: "종교에서 벗어나기"
 PER_turning_from_religion_desc: "세속적이고 사회주의적인 사회를 추구하며, 종교가 국가의 정치적, 사회적 방향을 좌우하지 않도록 해야 합니다. 신앙의 자유를 보장하는 동시에 종교와 국가 운영을 분리할 것입니다."
 PER_islamic_communism: "이슬람 공산주의"
 PER_islamic_communism_desc: "우리는 신앙과 혁명적 사회주의 이상을 결합한 이슬람 공산주의의 개념을 받아들입니다. 이 철학은 사회주의와 노동자 역량 강화의 원칙을 계속 증진하면서도 정의롭고 공평하며 이슬람의 가르침에 부합하는 사회를 건설하도록 해 줄 것입니다."
 PER_standing_against_the_right: "우파에 맞서다"
 PER_standing_against_the_right_desc: "반동적 우익 이념 세력에는 매 순간 맞서야 합니다. 우리는 혁명적 진전을 되돌리려는 시도에 굳건히 맞서고, 이란에서 파시즘과 권위주의가 부상하는 것을 막을 것입니다."
 PER_iran_tribunal: "이란 재판소"
 PER_iran_tribunal_desc: "과거에 국민을 학대한 이들에게 책임을 묻기 위해 이란 재판소를 설립할 것입니다. 이는 구 정권의 범죄를 저지른 자들을 법정에 세워 노동자 계급을 위한 정의가 실현되도록 할 것입니다."
 PER_rejecting_the_hypocrites: "위선자 배척"
 PER_rejecting_the_hypocrites_desc: "우리는 공산주의의 옹호자를 자처하면서도 노동자 계급을 배신한 자들을 거부합니다. 우리의 혁명은 사익을 위해 사회주의의 진정한 가치를 왜곡하는 위선자들의 희생양이 되지 않을 것입니다."
 PER_labour_that_molds_our_spine: "우리의 척추를 빚는 노동"
 PER_labour_that_molds_our_spine_desc: "노동자 계급은 우리나라의 근간입니다. 평등과 정의, 사회주의의 미래를 건설하는 것은 그들의 노동을 통해서입니다. 노동자들이 나라의 미래를 빚어낼 힘을 갖도록 보장하겠습니다."
 PER_hambastegi: "함바스테기"
 PER_hambastegi_desc: "연대를 뜻하는 함바스테기 정책은 이란 안팎의 실향민과 억압받는 이들을 돕는 우리의 노력을 이끌 것입니다. 우리는 국제 노동자 계급을 지원하고 도움이 필요한 이들에게 원조를 제공하는 투쟁에서 단결하여 서겠습니다."
 PER_the_human_being: "인간"
 PER_the_human_being_desc: "우리 혁명의 중심에는 인간의 존엄에 대한 믿음이 있습니다. 우리는 모든 개인의 권리와 안녕이 우선시되는 사회를 만드는 데 전념하며, 더 나은 세상을 향한 추구 속에서 누구도 뒤처지지 않도록 할 것입니다."
 PER_maryams_plan: "마리암의 계획"
 PER_maryams_plan_desc: "마리암 라자비는 이란이 종교 통치에서 벗어나는 미래에 대한 대담한 비전을 제시했습니다. 그녀의 계획은 억압적인 체제를 해체하고 국민의 권리가 최우선인 민주적이고 세속적인 이란을 세우는 것입니다."
 PER_simay_azadi: "시마이 아자디"
 PER_simay_azadi_desc: "우리의 위성 텔레비전 네트워크인 시마예 아자디는 저항과 혁명의 메시지를 전파하는 핵심 수단입니다. 이 플랫폼을 통해 국내외의 이란인들을 단결시키고, 정권 타도를 위한 우리의 노력을 조율할 것입니다."
 PER_end_of_vilayet_faqih: "벨라야테 파키흐의 종식"
 PER_end_of_vilayet_faqih_desc: "종교 엘리트가 이란 국민 위에 군림하도록 허용해 온 억압적인 벨라야테 파키흐 체제를 끝장내야 합니다. 신정 통치의 시대는 막을 내릴 것이며, 이란은 진정한 민주주의의 길로 돌아갈 것입니다."
 PER_artesh_azadi: "아르테시 아자디"
 PER_artesh_azadi_desc: "아르테시 아자디는 새로운 군사력에 대한 우리의 구상으로, 외부와 내부의 위협 모두로부터 이란 국민을 보호할 것입니다. 자유, 정의, 세속주의의 가치를 수호하는 군대가 될 것입니다."
 PER_new_judicial_system: "새로운 사법 체계"
 PER_new_judicial_system_desc: "물라들의 통제 아래 있는 현재의 사법 체계는 억압의 도구였습니다. 우리는 종교의 영향에서 벗어나 모든 이란인에게 정의와 평등을 보장하는 공정하고 투명한 새로운 사법 체계를 세울 것입니다."
 PER_nuclear_concern: "핵 문제"
 PER_nuclear_concern_desc: "이란의 핵 야망은 오랫동안 국제사회의 우려 대상이었습니다. MEK 강령의 일환으로, 우리는 이란의 핵 프로그램이 투명하고 평화적이며 국제 규범에 부합하도록 보장할 것입니다."
 PER_baath_lifeline: "바아스당이라는 생명줄"
 PER_baath_lifeline_desc: "바아스주의자들과의 관계는 우리 운동과 더 넓은 중동의 투쟁 모두에게 생명줄입니다. 우리는 함께 제국주의에 맞서고, 두 운동이 공유하는 사회주의 이상이 존속하도록 할 것입니다."
 PER_our_own_people: "우리 자신의 국민"
 PER_our_own_people_desc: "우리는 지역 동맹들과 연대하지만, 가장 우선하는 것은 이란 국민입니다. MEK는 무엇보다 이란 국민에 대한 책임을 다하며, 외세의 간섭 없이 국민의 자유와 안보와 번영을 보장할 것입니다."
 PER_reactionary_values: "반동적 가치"
 PER_reactionary_values_desc: "우리는 오랫동안 이란 국민을 억압하는 데 이용되어 온 반동적 가치를 배격합니다. MEK는 이러한 낡은 이상을 근절하고, 평등과 정의에 기반한 진보적이고 사회주의적인 가치로 대체하는 데 헌신합니다."
 PER_the_peoples_front: "인민 전선"
 PER_the_peoples_front_desc: "인민 전선은 민주주의 세력, 사회주의 세력, 세속 세력이 하나의 공동 목표 아래 결집한 광범위한 연합이 될 것입니다. 그 목표는 정권의 억압으로부터 이란을 해방하고 국민의 의지를 반영하는 정부를 수립하는 것입니다."
 PER_protect_the_free_market: "자유 시장 보호"
 PER_protect_the_free_market_desc: "MEK는 개인이 자유롭게 사업과 무역에 참여할 수 있는 시장 경제를 신뢰합니다. 우리는 자유 시장을 국가의 통제로부터 보호하고, 기업가 정신과 일자리 창출, 경제 성장을 장려하는 정책을 추진할 것입니다."
 PER_legacy_of_camp_ashraf: "아슈라프 수용소의 유산"
 PER_legacy_of_camp_ashraf_desc: "아슈라프 수용소는 MEK의 자유와 정의를 위한 투쟁의 심장이었습니다. 우리가 이란 내에 새로운 수용소를 세우는 지금, 자유라는 대의를 위해 싸우고 죽어 간 이들의 유산을 기리며 그들의 희생이 결코 잊히지 않도록 할 것입니다."
 PER_maintaining_our_stance: "입장 고수"
 PER_maintaining_our_stance_desc: "외부의 압력에도 불구하고 MEK는 마르크스-공산주의 원칙에 충실할 것입니다. 노동 계급에 대한 우리의 헌신과 제국주의에 대한 반대는 변함이 없으며, 우리는 정의와 평등에 뿌리를 둔 사회를 위해 계속 싸울 것입니다."
 PER_move_towards_westernization: "서구화를 향한 전진"
 PER_move_towards_westernization_desc: "현대적이고 진보적인 이란이라는 우리의 구상을 이루려면 문화, 기술, 통치 방식에서 서구화를 받아들여야 합니다. MEK는 이란을 서방의 민주적이고 세속적인 가치에 부합시키는 개혁을 추진할 것입니다."
 PER_uplifting_the_keshavarz: "케샤바르즈 계층의 지위 향상"
 PER_uplifting_the_keshavarz_desc: "이란의 농업 부문은 경제의 초석이며, 우리는 공정한 보상과 현대 농업 기술에 대한 접근, 더 나은 삶의 질을 보장하는 정책을 시행하여 케샤바르즈(농민)의 지위를 향상시키고자 노력할 것입니다."
 PER_the_liberation_front: "해방 전선"
 PER_the_liberation_front_desc: "해방 전선은 정권을 타도하고 이란을 해방하려는 우리 노력의 선봉이 될 것입니다. 이 전선은 이란 내 모든 민주주의 세력과 사회주의 세력을 규합하여 억압적인 정부에 맞서 봉기하고 새롭고 자유로운 국가를 건설할 것입니다."
 PER_kurdish_federalism: "쿠르드 연방주의"
 PER_kurdish_federalism_desc: "우리는 쿠르드 민족의 자결권을 인정하며, 쿠르디스탄이 이란의 불가분한 일부로 남으면서도 스스로 통치할 수 있는 연방제의 수립을 지지합니다. 쿠르드 자치는 자유롭고 민주적인 이란이라는 MEK의 구상에 필수적입니다."
 PER_workers_with_bread: "빵을 가진 노동자"
 PER_workers_with_bread_desc: "우리의 혁명은 노동 계급의 필요에 뿌리를 두고 있습니다. '빵을 가진 노동자' 운동은 모든 이란 노동자가 공정한 임금과 적절한 노동 조건을 누리고, 정직한 노동으로 가족을 부양할 수 있도록 보장할 것입니다."
 PER_clerics_in_red: "붉은 옷의 성직자들"
 PER_clerics_in_red_desc: "우리는 오랫동안 이란 국민을 억압해 온 전통적인 성직자 위계에서 벗어날 것입니다. 붉은 옷의 성직자들은 사회주의와 마르크스-공산주의 이념을 받아들이고, 우리와 함께 더 정의로운 사회를 건설할 이들이 될 것입니다."
 PER_the_international_front: "국제 전선"
 PER_the_international_front_desc: "우리의 투쟁은 이란에 국한되지 않습니다. 우리는 전 세계의 다른 진보적, 사회주의적, 반제국주의 운동과 동맹을 맺어 모든 억압받는 민족의 해방을 위한 국제 전선을 구축할 것입니다."
 PER_oath_of_barandaz: "바란다즈의 서약"
 PER_oath_of_barandaz_desc: "이란 국민에 대한 충성과 봉사의 원칙에 따라, 바란다즈의 서약은 군주제 아래에서 안정과 전통과 정의를 회복하겠다는 우리의 의지를 상징합니다."
 PER_framework_of_liberty: "자유의 틀"
 PER_framework_of_liberty_desc: "개인의 자유가 국가 통합과 균형을 이루는 통치 구조로서, 질서와 진보를 길러내는 맥락 속에서 자유가 존재하도록 보장합니다."
 PER_light_in_the_dark_room: "어두운 방의 빛"
 PER_light_in_the_dark_room_desc: "어둠에 직면한 국가에서 우리 당은 희망의 빛을 비추어, 불확실한 세상에서 명확함과 방향을 제시하며 현대성과 오랜 유산을 모두 품습니다."
 PER_loose_cloak_of_democracy: "느슨한 민주주의의 외투"
 PER_loose_cloak_of_democracy_desc: "민주주의가 혼란의 도구가 되어서는 안 됩니다. 우리의 체제는 국민의 목소리가 반영되도록 허용하되, 국가적 결속과 지도자의 이끄는 손길을 해치지 않는 범위에서만 그러합니다."
 PER_grassroots_campaigns: "풀뿌리 운동"
 PER_grassroots_campaigns_desc: "국민이 밑바닥에서부터 직접 행동에 나서 국가적 변화에 영향을 미치도록 힘을 실어 주고, 모든 이란인이 미래를 만들어 가는 데 목소리를 낼 수 있도록 보장합니다."
 PER_throne_of_the_people: "인민의 왕좌"
 PER_throne_of_the_people_desc: "군주제는 더 이상 세습되는 권리가 아니라 국민의 의지와 바람을 반영해야 하는 지위가 될 것이며, 왕실의 품격을 유지하면서도 국민의 권리를 수호할 것입니다."
 PER_regent_of_iran: "이란의 섭정"
 PER_regent_of_iran_desc: "과도기에는 안정된 손길이 필요합니다. 우리가 임명하는 섭정은 안정과 국가 통합에 중점을 두고 국가를 진정한 통치의 회복으로 이끌 것입니다."
 PER_reshuffle_the_deck: "판 새로 짜기"
 PER_reshuffle_the_deck_desc: "과거의 정치·경제 구조는 우리를 실패하게 했습니다. 이제 부패를 일소하고 국가를 마땅한 자리로 되돌리기 위해 체제를 전면적으로 개편할 때입니다."
 PER_a_free_nation: "자유로운 국가"
 PER_a_free_nation_desc: "진정한 자유는 혼돈이 아니라 국가의 법과 전통과 조화를 이루며 살아갈 수 있는 능력입니다. 정의와 존중으로 결속된 번영하는 자유국가가 우리의 지도 아래 일어설 것입니다."
 PER_gloves_off_approach: "봐주지 않는 접근법"
 PER_gloves_off_approach_desc: "이란의 재정적 미래를 확고히 하기 위해 중과세를 부과해야 하더라도, 과거의 실패를 바로잡는 필수적인 개혁을 포함하여 과감한 결정을 내릴 것입니다."
 PER_cultural_renaissance: "문화 르네상스"
 PER_cultural_renaissance_desc: "이란의 풍부한 문화유산은 우리의 힘입니다. 이제 선조들의 지혜와 현대 사회의 혁신을 융합하는 문화 르네상스에 불을 지필 때입니다."
 PER_new_class_of_reformers: "새로운 개혁가 계층"
 PER_new_class_of_reformers_desc: "미래는 개혁과 전통에 대한 존중을 조화시킬 수 있는 이들의 것입니다. 새로운 세대의 개혁가들이 이란을 이끌며 모두를 위한 번영과 정의와 평등을 보장할 것입니다."
 PER_open_book_policy: "공개 장부 정책"
 PER_open_book_policy_desc: "투명성은 우리 행정부의 초석이 될 것입니다. 모든 결정과 정책, 재정 활동이 공개되어 정부가 국민에게 책임을 지도록 보장할 것입니다."
 PER_break_the_piggybank: "저금통 깨기"
 PER_break_the_piggybank_desc: "과도한 지출과 부패가 우리의 자원을 고갈시켰습니다. 이란의 미래가 재정적으로 건전하도록 예산 편성과 재정 관리에 새로운 접근법을 도입할 것입니다."
 PER_state_withdrawal_from_corporate_activities: "기업 활동에서의 국가 철수"
 PER_state_withdrawal_from_corporate_activities_desc: "민간 부문에 힘을 싣기 위해 국가는 기업 업무에서의 역할을 축소하고, 기업가 정신과 경쟁을 장려하면서도 국민을 보호하기 위한 규제는 유지할 것입니다."
 PER_guided_hand_approach: "이끄는 손 접근법"
 PER_guided_hand_approach_desc: "경제에는 방향이 필요합니다. 세세하게 관리하는 대신, 국가는 산업이 성장하도록 전략적으로 이끌어 국가 자원이 효율적이고 지속 가능하게 사용되도록 보장할 것입니다."
 PER_autonomy_deal: "자치 협정"
 PER_autonomy_deal_desc: "지역 지도자들과의 협상을 통해 필요한 곳에 더 큰 자치를 허용하여, 이란의 모든 지역이 군주제 아래 단결하면서도 스스로 통치할 자유를 누리도록 보장할 것입니다."
 PER_foreign_investment_plan: "외국인 투자 계획"
 PER_foreign_investment_plan_desc: "외국인 투자의 문을 열어 이란의 주권을 훼손하지 않으면서 인프라와 산업을 현대화하고, 자립적인 경제를 육성할 것입니다."
 PER_state_fund_credit: "국가 기금 신용"
 PER_state_fund_credit_desc: "신용에 대한 접근은 성장에 필수적입니다. 국가 기금을 전략적으로 배분하여 핵심 산업에 신용을 제공함으로써, 민간 부문을 지원하는 동시에 국가 목표를 달성할 것입니다."
 PER_ensure_labor_rights_legislation: "노동권 입법 보장"
 PER_ensure_labor_rights_legislation_desc: "이란 노동자들의 권리는 공정한 임금과 안전, 번영하는 경제 속에서의 상향 이동 기회를 보장하는 강력한 노동법을 통해 보호받을 것입니다."
 PER_military_arms_pact: "제국 근위대"
 PER_military_arms_pact_desc: "우리의 군대는 강하고 안전해야 합니다. 제국 근위대를 과거의 영광으로 되돌림으로써 우리가 의지할 또 하나의 힘의 기둥을 갖게 될 것입니다."
 PER_sovereignty_for_trade_unions: "노동조합의 자주성"
 PER_sovereignty_for_trade_unions_desc: "우리는 노동자의 공정한 대우를 보장하는 노동조합의 역할을 존중합니다. 이러한 조직에 힘을 실어 줌으로써 노동권과 경제 성장 사이의 균형을 이룰 수 있습니다."
 PER_second_white_revolution: "제2차 백색 혁명"
 PER_second_white_revolution_desc: "백색 혁명은 번영하는 미래의 토대를 놓았습니다. 이제 우리는 교육, 보건, 국가 인프라를 현대화하여 모두를 위한 더 밝은 미래를 만드는 제2차 백색 혁명에 착수할 것입니다."
 PER_the_shining_example: "빛나는 모범"
 PER_the_shining_example_desc: "이란은 다시 한번 이 지역 희망의 등대가 될 것입니다. 우리의 지도 아래, 한 국가가 전통과 군주제와 진보를 융합하여 세계가 감탄할 만한 사회를 만들 수 있음을 보여 줄 것입니다."
 PER_party_of_iranians: "이란인의 당"
 PER_party_of_iranians_desc: "이란인의 당은 국경과 차이를 초월하는 통합되고 강력한 이란이라는 비전 위에 세워졌습니다. 우리는 하나의 깃발과 하나의 목적 아래 단결하여 이란을 이란 세계의 중심이라는 마땅한 자리로 되돌리고자 합니다."
 PER_hooshang_talaes_plea: "후샹 탈라이의 호소"
 PER_hooshang_talaes_plea_desc: "후샹 탈라이의 말은 우리 국민의 희망을 대변합니다. 단결과 존엄, 그리고 이란 정신의 회복을 위한 호소입니다. 우리가 유산을 되찾기 위해 일어서는 지금, 그의 행동 촉구는 우리의 지도 원칙이 되었습니다."
 PER_the_secretary_general: "총서기"
 PER_the_secretary_general_desc: "총서기의 역할은 단순한 직위가 아니라 당의 의지와 힘의 구현입니다. 지도자로서 총서기는 우리 운동을 이끄는 원동력이며, 통합된 이란이라는 우리의 비전이 실현되도록 보장합니다."
 PER_coalition_with_kdpi: "KDPI와의 연합"
 PER_coalition_with_kdpi_desc: "이란 쿠르디스탄 민주당과의 동맹은 상호 이익과 공동 목표 위에 세워진 것입니다. 우리는 함께 국가를 위협하는 분열 세력에 맞서, 민족과 관계없이 모든 이란인이 단결하도록 보장할 것입니다."
 PER_purge_clerical_ministers: "성직자 장관 숙청"
 PER_purge_clerical_ministers_desc: "성직자 집단은 너무 오랫동안 이란 통치의 우물을 오염시켜 왔습니다. 종교를 이용해 국민을 조종하는 자들을 제거하고, 세속적 지도력을 통해 정부의 청렴성을 회복할 때입니다."
 PER_hekamiyate_mellat: "헤카미야테 멜랏"
 PER_hekamiyate_mellat_desc: "우리의 통치 구상은 이란 국민의 힘과 단결에 뿌리를 두고 있습니다. 국민의 통치를 뜻하는 헤카미야테 멜랏은 무엇보다 시민을 위해 봉사하고, 국가 정체성에 뿌리를 두며, 단결된 이란의 염원에 이끌리는 정부를 요구합니다."
 PER_curb_separatist_sentiment: "분리주의 정서 억제"
 PER_curb_separatist_sentiment_desc: "분리주의의 위협은 우리 국가의 통합을 훼손합니다. 이란이 강력하고 통합된 실체로 남도록 특히 쿠르드 주민들 사이의 이러한 움직임에 맞서 억제해야 합니다."
 PER_utilizing_our_ally: "동맹 활용"
 PER_utilizing_our_ally_desc: "KDPI와의 협력은 이란 내 쿠르드 활동에 대한 귀중한 통찰을 제공합니다. 그들과 긴밀히 협력함으로써 국경에 대한 통제를 유지하고 국가 통합에 대한 위협에 관한 정보를 확보할 수 있습니다."
 PER_investigate_foreign_influence: "지역 내 외세 영향력 조사"
 PER_investigate_foreign_influence_desc: "이란의 주권을 훼손하려는 외세를 가려내는 데 경계를 늦추어서는 안 됩니다. 통합을 향한 우리의 길이 외부 세력에 방해받지 않도록 그들의 영향력을 억제해야 합니다."
 PER_caspian_fortification: "카스피해 요새화"
 PER_caspian_fortification_desc: "카스피해는 이란 전략 방어의 핵심 요소입니다. 우리는 이 지역을 요새화하여 해안을 외부 위협으로부터 보호하고, 어떠한 외세의 야욕으로부터도 우리의 자원을 지킬 것입니다."
 PER_pezeshkpours_agenda: "페제시키푸르의 구상"
 PER_pezeshkpours_agenda_desc: "페제시키푸르의 구상은 교육과 과학과 문화가 꽃피는 이란을 만드는 데 초점을 둡니다. 그는 역사적 뿌리에 충실하면서도 혁신의 최전선에 서는 통합된 이란을 그렸습니다."
 PER_all_that_was_taken: "빼앗긴 모든 것"
 PER_all_that_was_taken_desc: "한때 우리의 것이었으나 영국과 러시아에 빼앗긴 땅은 이란 국민에게 반환되어야 합니다. 우리는 제국주의의 이름으로 잃은 것을 되찾아 이란의 국경이 완전히 회복될 때까지 쉬지 않을 것입니다."
 PER_bolster_anjoman: "안주만 강화"
 PER_bolster_anjoman_desc: "우리의 무장 조직인 안주만은 우리의 대의에 필수적입니다. 이 조직을 강화함으로써 우리 운동이 이란 국민을 보호하고 수호할 수단을 갖추게 하고, 흔들림 없는 결의로 대의를 전진시킬 것입니다."
 PER_fighting_colonialism: "식민주의에 맞선 투쟁"
 PER_fighting_colonialism_desc: "식민 열강은 오랫동안 이란과 그 자원을 착취하려 해 왔습니다. 우리는 식민주의에 단호히 맞서며, 이란의 주권과 외세의 지배로부터 우리 국민을 해방하기 위해 계속 싸울 것입니다."
 PER_sway_dushanbe: "두샨베 설득"
 PER_sway_dushanbe_desc: "타지키스탄은 이란 세계의 불가분한 일부입니다. 외교적 접촉을 통해 두샨베와의 유대를 강화하여, 이란계 연합이라는 우리의 구상이 지역 전체로 뻗어 나가고 우리를 공동의 운명으로 묶도록 할 것입니다."
 PER_talks_in_kabul: "카불 회담"
 PER_talks_in_kabul_desc: "아프가니스탄은 더 넓은 이란 연합을 만드는 데 중요한 파트너입니다. 카불에서의 회담은 이란과 그 이웃들이 외세의 간섭과 내부 분열에 맞서 굳건히 서는 통합된 지역의 토대를 마련할 것입니다."
 PER_rekindle_the_fading_light: "스러져 가는 빛을 다시 지피다"
 PER_rekindle_the_fading_light_desc: "이란의 심장부에서 문화적·역사적 이웃에 이르기까지 뻗어 나가는 통합된 이란계 연합이라는 비전은 희미해지고 있습니다. 우리는 이 꿈의 불꽃을 되살리고 이란 세계가 다시 한번 하나의 깃발 아래 단결하도록 쉼 없이 노력해야 합니다."
 PER_the_masculine_cat: "남성적인 고양이"
 PER_the_masculine_cat_desc: "'남성적인 고양이'라는 칭호는 단호하면서도 깊이 사려하는 몬타제리의 복합적인 지도 방식을 보여 주는 반어적 상징입니다. 힘과 지혜 사이의 균형을 추구하는 몬타제리는 전환기의 이란에 필요한 지도력을 체현합니다."
 PER_montazeris_will: "몬타제리의 유언"
 PER_montazeris_will_desc: "몬타제리의 유언은 우리 투쟁을 이끄는 등불입니다. 공정함에 대한 그의 호소와 권위주의에서 벗어난 정의로운 사회라는 그의 비전은, 권력이 진정으로 국민에게 속하는 국가로 이란을 재편하도록 우리에게 계속 영감을 줍니다."
 PER_wisdom_not_provocation: "도발이 아닌 지혜"
 PER_wisdom_not_provocation_desc: "몬타제리는 지혜가 대립이 아닌 대화에 있음을 가르칩니다. 그는 성급한 도발보다 평화적 해결, 신중한 전략, 이해를 옹호합니다. 우리가 이란을 새로운 시대로 이끄는 것은 차분한 이성을 통해서입니다."
 PER_end_of_political_prisons: "정치범 수용소의 종식"
 PER_end_of_political_prisons_desc: "정의로운 이란에 정치범이 설 자리는 없습니다. 몬타제리의 입장은 분명합니다. 목소리를 내는 이들을 힘으로 침묵시켜서는 안 됩니다. 이제 감옥을 정치적 탄압의 도구로 사용하는 것을 끝내고 투명성과 인권의 새로운 장을 열 때입니다."
 PER_middle_ground_with_mek: "MEK와의 중도적 접점"
 PER_middle_ground_with_mek_desc: "우리 혁명에서 MEK의 역할은 간과할 수 없지만, 그들 또한 일부 측면에서 길을 잘못 들었습니다. 중도적 접점이란 분열보다 대화, 가능한 곳에서의 협력, 그리고 국민 화합으로 향하는 분명한 길입니다."
 PER_the_rights_of_all: "모두의 권리"
 PER_the_rights_of_all_desc: "이란은 모든 이란인을 위한 국가이며, 우리는 출신과 종교, 정치적 소속에 관계없이 모든 시민의 권리를 옹호해야 합니다. 그의 비전은 평등과 정의가 단순한 이상이 아니라 모두에게 실제로 누려지는 현실인 이란입니다."
 PER_religion_of_kindness_and_tolerance: "친절과 관용의 종교"
 PER_religion_of_kindness_and_tolerance_desc: "몬타제리가 가르쳤듯 참된 이슬람은 강요나 처벌이 아니라 친절과 관용에 관한 것입니다. 이란은 이슬람의 평화롭고 포용적인 가치를 받아들여, 연민과 이해와 모든 신앙에 대한 존중에 기반한 사회를 만들 것입니다."
 PER_political_liberalization: "정치적 자유화"
 PER_political_liberalization_desc: "우리는 정치가 더 이상 소수 엘리트의 영역이 아니라 개방적이고 공정하며 포용적인 이란을 만들 것입니다. 정치적 자유화는 시민이 자유롭게 의견을 표현하고 민주적 수단으로 지도자를 선택할 수 있는 새로운 이란으로 가는 길입니다."
 PER_dismantle_sharia_institutions: "샤리아 기관 해체"
 PER_dismantle_sharia_institutions_desc: "정의와 평등의 원칙을 부패시킨 억압적인 샤리아 기관을 해체할 때가 왔습니다. 몬타제리는 종교가 더 이상 국가를 통제하지 않고 이란이 진정한 공화국이 되도록 세속적인 통치 방식을 옹호합니다."
 PER_democracy_with_islamic_principles: "이슬람 원칙에 따른 민주주의"
 PER_democracy_with_islamic_principles_desc: "개혁된 이란에 대한 몬타제리의 비전은 민주주의와 이슬람 원칙이 조화롭게 공존하는 것입니다. 제2 이슬람 공화국은 자유와 정의와 이슬람 윤리가 통치를 이끌고, 민주주의와 신앙이 균형 속에서 함께 번영하는 국가가 될 것입니다."
 PER_prohibit_irgc_business_access: "IRGC의 사업 참여 금지"
 PER_prohibit_irgc_business_access_desc: "IRGC와 그 구성원들은 이란 경제를 틀어쥐고 있습니다. 이제 권력의 기둥을 해체할 때입니다. 우리는 새로운 처리법을 시행하고 가혹한 처벌을 집행하여 그들의 영향력을 분쇄할 것입니다. 이 새로운 법을 위반하는 자는 장기 징역을 포함한 엄중한 결과에 직면할 것입니다. IRGC 지배의 시대는 끝났습니다."
 PER_march_towards_freedom: "자유를 향한 행진"
 PER_march_towards_freedom_desc: "한때 호메이니 정권에 대한 자유주의적 대항 세력으로 구상되었던 FMI가 새로운 야망을 품고 이란 정치 무대에 돌아왔습니다. 개혁과 진보를 겨냥한 FMI는 오랫동안 이란을 괴롭혀 온 고착된 인물들과 지도자들에게 도전할 것입니다."
 PER_a_heavy_hand: "무거운 손"
 PER_a_heavy_hand_desc: "이란은 무질서한 상태에 놓였고, 수년간의 방치로 체제와 제도가 썩어 가고 있습니다. 우리는 직접 나서는 접근법을 취하여 망가진 것을 해체하고 성장과 안정을 촉진하는 방식으로 모든 것을 다시 세울 것입니다. 이 '재시작'은 낡은 것을 걷어내고 새로운 토대를 놓을 것입니다."
 PER_absorb_state_assets: "국가 자산 흡수"
 PER_absorb_state_assets_desc: "정부 개편의 일환으로 일부 자산을 흡수하는 것이 유익할 수 있습니다. 국민에게 내미는 열린 손이라 하십시오. 이번 일에는 아무도 불평할 수 없습니다."
 PER_exploit_the_banks: "은행 활용"
 PER_exploit_the_banks_desc: "은행은 엘리트가 아닌 국민을 위해 봉사해야 합니다. 우리는 금융 기관을 장악하고 국가 성장을 향하도록 재편하여, 이란의 부가 특권을 누리는 소수가 아닌 모든 이란인에게 이익이 되도록 사용되게 할 것입니다."
 PER_guiding_light_of_iran: "이란의 길잡이 등불"
 PER_guiding_light_of_iran_desc: "우리는 자유와 민주주의와 사회 정의의 가치에 뿌리를 둔 미래의 길잡이 등불로 서 있습니다. 우리 운동은 모든 시민이 목소리를 내고 번영할 기회를 가지는 더 밝은 미래로 이란을 이끌고자 합니다."
 PER_revitalize_democratic_principles: "민주주의 원칙의 재활성화"
 PER_revitalize_democratic_principles_desc: "이란의 민주주의는 새롭게 되살아나고 강화되어야 합니다. 우리는 정치 제도를 개혁하여 권력을 국민에게 되돌리고, 정부가 외세나 소수의 강력한 엘리트가 아닌 이란 국민의 필요와 바람에 봉사하도록 보장할 것입니다."
 PER_recraft_state_foundations: "국가 토대의 재정립"
 PER_recraft_state_foundations_desc: "이란 국가의 토대는 우리 사회의 현대적 요구를 더 잘 반영하도록 다시 세워져야 합니다. 우리는 내외부의 도전에 맞서 굳건히 서는 민주적 이란을 뒷받침하도록 제도를 재편할 것입니다."
 PER_inheritors_of_iran: "이란의 계승자들"
 PER_inheritors_of_iran_desc: "우리는 이란의 풍부한 문화적, 지적, 정치적 유산의 계승자입니다. 과거의 투쟁은 강력한 국가 정체성을 빚어냈으며, 이제 이 횃불을 이어받아 우리 국가를 진보와 통합과 평화로 이끄는 것이 우리의 의무입니다."
 PER_weathering_the_storm_to_come: "다가올 폭풍 견뎌 내기"
 PER_weathering_the_storm_to_come_desc: "앞길의 도전은 크지만 우리는 준비되어 있습니다. 단결과 회복력, 신중한 계획을 통해 이란을 불안정하게 만들려는 정치적 폭풍을 견뎌 내고, 그 어느 때보다 강하고 단결된 모습으로 거듭날 것입니다."
 PER_yazdis_clique: "야즈디 파벌"
 PER_yazdis_clique_desc: "야즈디의 보수 파벌은 이란을 위험한 길로 이끌어 왔습니다. 우리는 그들의 영향력에 맞서, 이란의 미래가 진보와 민주적 개혁의 앞길을 가로막는 자들에 의해 좌우되지 않도록 해야 합니다."
 PER_bazargans_clique: "바자르간 파벌"
 PER_bazargans_clique_desc: "야즈디의 지도력을 버리고 바자르간의 더 자유주의적인 접근을 택할 때입니다. 민주적이고 자유로운 이란이라는 그의 비전은 정치적 개방과 사회 정의라는 우리의 목표와 일치하며, 우리는 그 비전을 추구하는 그를 지지할 것입니다."
 PER_the_press_mizan: "미잔 신문의 귀환"
 PER_the_press_mizan_desc: "1980~1981년 당 기관지로 발행되다 검열을 받은 미잔이 이제 국정 사안을 다루는 매체로 다시 활기를 되찾을 것입니다."
 PER_the_iranian_work_bench: "이란 작업대"
 PER_the_iranian_work_bench_desc: "이란 미래의 근간은 우리 노동자들의 손에 달려 있습니다. 산업 발전과 교육, 인프라를 우선시하는 국가 작업대를 만들어 이란이 혁신과 산업의 세계적 선두 주자가 되도록 할 것입니다."
 PER_unorthodox_approach: "비정통적 접근법"
 PER_unorthodox_approach_desc: "우리는 이란의 발전으로 이어진다면 관습에서 벗어난 길을 가는 것을 두려워하지 않습니다. 통치와 개혁에 대한 우리의 접근은 대담하고 결단력 있게 낡은 이념과 결별하고 미래를 받아들이는 방향으로 나아갈 것입니다."
 PER_revolutionizing_democracy: "민주주의의 혁신"
 PER_revolutionizing_democracy_desc: "민주주의는 현대에 맞게 진화해야 합니다. 우리는 국민에게 힘을 실어 주는 전자 민주주의와 기술 혁신을 도입하여, 모든 이란인이 현대적 플랫폼을 통해 국가 통치에 직접 참여할 수 있도록 보장할 것입니다."
 PER_military_diarchy: "군에 대한 양보"
 PER_military_diarchy_desc: "안정을 유지하고 군사 개입을 막기 위해 군에 일정한 양보를 제공할 것입니다. 군부와 민간 지도부 사이의 권력 균형은 민주적 절차를 보존하면서도 이란의 안보를 보장할 것입니다."
 PER_stamp_out_factionalism: "파벌주의 근절"
 PER_stamp_out_factionalism_desc: "우리 국가를 분열시키는 파벌은 침묵시켜야 합니다. 내부 분열을 제거함으로써 개혁과 진보를 추진하는 단일 전선을 만들고, 우리를 너무 오래 붙잡아 온 내분을 떨쳐 낼 것입니다."
 PER_followers_of_mossadegh: "모사데그의 추종자들"
 PER_regain_popular_support: "대중적 지지 회복"
 PER_regain_popular_support_desc: "수십 년 동안 우리는 한때 누렸던 영광의 일부를 잃었으며, 이제 이란 국민의 대중적 지지를 되찾아야 할 때가 왔습니다."
 PER_followers_of_mossadegh_desc: "우리는 모사데그 유산의 진정한 계승자입니다. 이란의 독립과 민주주의를 위한 그의 투쟁은 우리의 대의이기도 합니다. 이란을 외세의 영향과 내부의 폭정에서 해방하려는 그의 투쟁을 이어 감으로써 그를 기릴 것입니다."
 PER_struggle_towards_a_great_nation: "위대한 국가를 향한 투쟁"
 PER_struggle_towards_a_great_nation_desc: "우리는 자유와 민주주의와 정의가 단순한 열망이 아니라 새로운 국가의 토대가 되는 위대한 이란을 건설하기 위한 투쟁에 헌신합니다. 우리는 함께 세계의 위대한 국가들 사이에서 당당히 서는 이란을 위해 싸울 것입니다."
 PER_shackle_the_unruly_clerics: "제멋대로인 성직자들 속박"
 PER_shackle_the_unruly_clerics_desc: "국가 위에 자신들의 통치를 강요하려는 성직자들은 제지되어야 합니다. 우리는 종교 지도자들이 더 이상 통치의 방향을 좌우하지 못하도록 하여, 이란 국민의 영적 요구를 존중하면서 공화국의 세속적 성격을 회복할 것입니다."
 PER_cooperation_under_the_shade: "그늘 아래의 협력"
 PER_cooperation_under_the_shade_desc: "우리는 이 지역, 특히 사우디아라비아의 민주주의 저항 운동과 동맹을 맺고자 합니다. 자유를 위한 그들의 투쟁을 지원함으로써 우리의 입지를 강화하고 중동 전역의 민주주의 대의를 증진합니다."
 PER_no_iran_without_islam: "이슬람 없는 이란은 없다"
 PER_no_iran_without_islam_desc: "이슬람은 이란 정체성의 불가분한 일부입니다. 우리는 민주주의를 추구하되, 이슬람이 우리 국가 가치의 중심에 남도록 하고 신앙과 자유에 대한 헌신 모두에 부합하는 방식으로 정책을 형성할 것입니다."
 PER_iran_triumphant: "승리하는 이란"
 PER_iran_triumphant_desc: "이란은 민주주의와 자유의 등대로서 승리할 것입니다. 우리는 앞길의 장애물을 극복하고, 독립적일 뿐 아니라 민주주의와 정의와 번영이 모두의 손이 닿는 곳에 있는 세계의 본보기가 되는 국가를 만들 것입니다."
 PER_path_of_hope: "희망의 길"
 PER_path_of_hope_desc: "우리는 모든 이란인을 위한 더 밝고 번영하는 미래를 믿습니다. 우리의 길은 개혁과 투명성과 정의의 길이며, 국민에게 힘이 실리고 법치가 회복되며 우리 국가가 미래에 대한 희망으로 다시 활력을 얻는 길입니다."
 PER_our_right_to_nuclear_power: "핵 에너지에 대한 우리의 권리"
 PER_our_right_to_nuclear_power_desc: "이란은 평화적 목적으로 핵 기술을 개발할 주권적 권리를 가지고 있습니다. 우리는 프로그램이 투명하고 안전하며 이란 국민에게 이익이 되도록 사용되게 하면서 핵 에너지에 대한 우리의 권리를 주장할 것입니다."
 PER_merit_centric_positions: "능력 중심 직위"
 PER_merit_centric_positions_desc: "우리는 이란의 정치·경제 체제를 개편하여 권력과 영향력을 가진 직위가 연고주의나 족벌주의가 아닌 능력에 따라 부여되도록 할 것입니다. 우리 국가는 국민을 위해 봉사할 진정한 자격을 갖춘 이들이 이끌게 될 것입니다."
 PER_restore_faith_in_the_law: "법에 대한 신뢰 회복"
 PER_restore_faith_in_the_law_desc: "법 체계에 대한 시민들의 신뢰는 부패와 불의로 인해 훼손되었습니다. 우리는 이란 사법 절차의 모든 측면에서 공정성과 투명성과 책임성을 보장함으로써 법에 대한 신뢰를 회복할 것입니다."
 PER_favor_the_enterprises: "기업 우대"
 PER_favor_the_enterprises_desc: "번영하는 경제에는 기업의 지원이 필요합니다. 우리는 혁신을 육성하고 일자리를 창출하며 민간 기업이 번창하도록 하는 정책을 시행하여 이란을 경제적 번영으로 이끌 것입니다."
 PER_favor_the_unions: "노조 우대"
 PER_favor_the_unions_desc: "이란의 노동 계급은 강력한 목소리를 가질 자격이 있습니다. 우리는 노동조합을 지원하고 노동자의 권리가 보호되며 공정한 임금과 노동 조건을 보장받도록 하는 정책을 시행할 것입니다. (기업 우대와 상호 배타적)"
 PER_office_of_accountability: "책임 감찰국"
 PER_office_of_accountability_desc: "부패와 비효율은 너무 오랫동안 우리 정부를 괴롭혀 왔습니다. 우리는 모든 수준의 부패를 조사하고 폭로하는 책임 감찰국을 설립하여 권력자들이 자신의 행위에 책임을 지도록 할 것입니다."
 PER_protecting_our_investments: "우리의 투자 보호"
 PER_protecting_our_investments_desc: "국내외 투자는 이란의 경제 안정에 매우 중요합니다. 우리는 투자를 보호하고 성장을 보장하며 이란 안팎의 투자자들에게 신뢰의 환경을 조성하는 정책을 시행할 것입니다."
 PER_overhaul_security_apperatus: "보안 기구 개혁"
 PER_overhaul_security_apperatus_desc: "이란의 보안군은 국민을 위협하는 것이 아니라 보호하도록 개혁되어야 합니다. 우리는 보안 기구를 개편하여 효율적이면서도 시민의 권리와 자유를 존중하도록 할 것입니다."
 PER_grant_judicial_independence: "사법 독립 부여"
 PER_grant_judicial_independence_desc: "공정하고 독립적인 사법부는 민주주의의 초석입니다. 우리는 사법부에 정치적 압력으로부터의 완전한 독립을 부여하여 판사들이 공정하게 행동하고 모든 이란인의 권리를 보호할 수 있도록 할 것입니다."
 PER_steel_for_soldiers_bread_for_people: "병사에게는 강철을, 국민에게는 빵을"
 PER_steel_for_soldiers_bread_for_people_desc: "우리 병사들은 충분히 무장하고 국가를 방어할 준비를 갖추겠지만, 국민의 필요 또한 우선되어야 합니다. 우리는 국방과 경제적 복지 사이에서 균형을 잡아 국민의 필요가 충족되도록 할 것입니다."
 PER_equality_at_work: "직장에서의 평등"
 PER_equality_at_work_desc: "우리는 성별, 민족, 배경에 관계없이 모든 노동자에게 직장에서 평등한 기회가 주어지도록 보장할 것입니다. 직장 내 차별에 맞서 싸우고 동일 노동 동일 임금을 증진할 것입니다."
 PER_grand_chabahar_project: "대 차바하르 프로젝트"
 PER_grand_chabahar_project_desc: "차바하르 항구는 이란 경제적 미래의 초석이 될 수 있습니다. 우리는 대 차바하르 프로젝트에 대규모로 투자하여 이를 무역과 상업, 지역 협력의 주요 거점으로 만들 것입니다."
 PER_rebuild_the_iranian_navy: "이란 해군 재건"
 PER_rebuild_the_iranian_navy_desc: "강력하고 현대적인 해군은 이란의 안보와 세계적 영향력에 필수적입니다. 우리는 이란 해군의 재건을 최우선으로 하여 우리의 이익을 방어하고 주권을 수호할 장비를 갖추도록 할 것입니다."
 PER_god_science_freedom: "신, 과학, 그리고 노동자"
 PER_god_science_freedom_desc: "우리의 토대는 신앙, 지식, 정의의 원칙 위에 놓여 있습니다. 우리는 종교적 헌신과 과학적 진보, 이란 노동 인민의 역량 강화가 조화를 이루는 것을 믿습니다. 이러한 이상이 국가를 위한 새로운 길을 개척하는 우리를 이끌 것입니다."
 PER_mossadeghs_legacy: "모사데그의 유산"
 PER_mossadeghs_legacy_desc: "민족전선은 이란의 주권과 독립, 그리고 우리 자원의 국유화에 대한 헌신으로 우리의 투쟁에 계속 영감을 주는 모하마드 모사데그 박사의 불굴의 유산을 기립니다. 우리는 자유와 민주주의와 민족 자결을 위한 그의 투쟁을 이어 갈 것입니다."
 PER_commit_to_nonalignment: "비동맹에 대한 약속"
 PER_commit_to_nonalignment_desc: "이란은 외세의 영향에서 벗어나 세계 무대에서 독립적이고 중립적인 세력으로 남아야 합니다. 우리는 비동맹 정책을 약속하고, 동방과 서방 모두의 패권을 거부하며 우리만의 길을 개척할 것입니다."
 PER_forging_a_path: "새로운 길의 개척"
 PER_forging_a_path_desc: "모사데그의 유산을 기리면서도, 우리는 급변하는 세계에 적응할 필요성을 인식합니다. 우리는 정의와 자유의 원칙을 현대 통치의 현실적 요건과 결합하는 이란의 새로운 길을 만들어야 합니다. (모사데그의 유산과 상호 배타적)"
 PER_way_of_bakhtiar: "바크티아르의 길"
 PER_way_of_bakhtiar_desc: "정치적 격변의 여파 속에서 우리는 청렴과 개혁의 인물 샤푸르 바크티아르의 비전에 주목합니다. 그의 이상을 받아들임으로써 이란에 안정과 공정과 진보를 가져오고 민주주의와 법치가 승리하도록 노력할 것입니다."
 PER_distance_church_and_state: "정교 사이의 거리"
 PER_distance_church_and_state_desc: "종교와 정치의 분리는 우리 국민의 자유와 번영을 보장하는 데 필수적입니다. 우리는 종교와 국가 사이에 분명한 거리를 두어, 신앙에 관계없이 모든 이란인에게 봉사하는 정부를 만들 것입니다."
 PER_demilitarization_of_politics: "정치의 비군사화"
 PER_demilitarization_of_politics_desc: "군대는 국민을 통제하는 것이 아니라 국민에게 봉사해야 합니다. 우리는 정치의 비군사화를 위해 노력하여 민간 지도자들이 군의 부당한 영향 없이 통치할 권한을 갖도록 할 것입니다."
 PER_strenght_through_intelligence: "지식을 통한 힘"
 PER_strenght_through_intelligence_desc: "진정한 힘은 군사력만이 아니라 지식과 교육의 힘에서 나옵니다. 우리는 과학, 기술, 교육에 대규모로 투자하여 이란이 혁신과 지적 리더십의 중심으로 남도록 할 것입니다."
 PER_appease_the_technocrats: "기술 관료 달래기"
 PER_appease_the_technocrats_desc: "이란의 미래는 숙련된 전문가와 기술 관료의 손에 달려 있습니다. 우리는 이념보다 전문성과 합리적인 정책 결정을 우선시하며, 기술 관료들이 국가 통치에서 중심 역할을 하도록 보장할 것입니다."
 PER_distance_from_the_east: "동방과의 거리 두기"
 PER_distance_from_the_east_desc: "주권을 중시하는 만큼 우리는 중국과 러시아 같은 동방 열강의 영향으로부터 거리를 두어야 합니다. 이란의 미래는 동방의 외부 압력에서 자유로운 독립적 외교 정책에 있습니다."
 PER_freedom_of_knowledge: "지식의 자유"
 PER_freedom_of_knowledge_desc: "우리는 모든 이란인이 지식과 교육에 접근할 수 있도록 보장할 것입니다. 공부하고 연구하고 가르칠 자유는 모든 시민이 사회에 기여할 수 있는 진보적 이란이라는 우리 구상의 근본입니다."
 PER_rebuild_oil_industry: "석유 산업 재건"
 PER_rebuild_oil_industry_desc: "우리 국가의 석유 산업은 경제의 생명선입니다. 우리는 석유 부문을 재건하고 현대화하여 이란 국민에게 이익이 되게 하고 천연자원에 대한 통제권을 되찾을 것입니다."
 PER_privatization_debate: "민영화 논쟁"
 PER_privatization_debate_desc: "국영 산업의 민영화 문제는 매우 중요합니다. 우리는 경제에 미칠 민영화의 이익과 위험을 저울질하며 최선의 방안을 정하기 위한 국가적 논쟁에 임할 것입니다."
 PER_aggressive_nationalization: "공격적 국유화"
 PER_aggressive_nationalization_desc: "경제의 일부 부문은 민간의 손에 맡기기에는 너무 중요합니다. 우리는 핵심 산업, 특히 석유와 가스 관련 산업이 이란 국민의 통제 아래 놓이도록 공격적인 국유화를 추진할 것입니다. (민영화 논쟁과 상호 배타적)"
 PER_privatize_military_chains: "군수 체인 민영화"
 PER_privatize_military_chains_desc: "군은 현대적이고 효율적이어야 하며, 여기에는 더 큰 유연성과 혁신을 위해 일부 군수 산업을 민영화하는 것이 포함됩니다. 우리는 효과적이면서도 비용 효율적인 방위 산업을 만드는 데 집중할 것입니다."
 PER_backbone_of_the_front: "전선의 근간"
 PER_backbone_of_the_front_desc: "우리의 군대는 강해야 하며 국민의 충분한 지원을 받아야 합니다. 우리는 병사들이 적절히 무장하고 지원받도록 하여 이란 군대를 국가 방위와 안보의 근간으로 만들 것입니다."
 PER_work_justice_freedom: "노동, 정의, 자유"
 PER_work_justice_freedom_desc: "우리는 노동이 존엄하고, 정의가 지켜지며, 자유가 모든 이란인에게 존중받는 사회를 만들 것입니다. 공정한 노동권과 평등한 기회, 모든 시민을 위해 작동하는 사법 체계를 보장할 것입니다."
 PER_embrace_french_socialism: "프랑스 사회주의 수용"
 PER_embrace_french_socialism_desc: "우리는 더 정의로운 사회를 건설하기 위한 모델로 프랑스 사회주의의 원칙을 살펴볼 것입니다. 국민의 복지에 중점을 둠으로써, 공정하고 번영하는 이란을 향한 여정에서 자유, 평등, 박애의 이상을 결합할 것입니다."
 PER_continue_with_scientific_socialism: "과학적 사회주의 지속"
 PER_continue_with_scientific_socialism_desc: "과학적 사회주의는 이성과 집단의 복지, 기술 진보에 기반하여 사회를 조직하는 틀을 제공합니다. 우리는 공정하고 현대적인 사회를 건설하면서 이러한 접근법을 이란의 독특한 필요에 맞게 조정하여 계속 받아들일 것입니다."
 PER_gates_to_the_world: "세계로 향하는 문"
 PER_gates_to_the_world_desc: "이란이 세계에 문을 열고 글로벌 협력과 교류를 받아들일 때입니다. 외교 관계를 증진함으로써 우리의 영향력과 무역을 확대하고, 국가가 세계 무대에서 번영하도록 할 것입니다."
 PER_summit_with_the_west: "서방과의 정상 회담"
 PER_summit_with_the_west_desc: "우리는 상호 존중과 무역 협정, 평화적 외교를 확립하기 위한 정상 회담에서 서방 열강과 교류하고자 합니다. 이 회담은 국제 사회에서 우리의 위치를 결정짓는 순간이 되어 서방과의 더 강한 유대를 다질 것입니다."
 PER_appease_the_republicans: "공화당 달래기"
 PER_appease_the_republicans_desc: "역사적으로 여러 공화당 정치인들이 우리를 칭찬하고 높이 평가해 왔습니다. 이제 그들의 모든 지원에 보답할 때이며, 단 몇 가지 조건이 붙습니다."
 PER_secure_american_support: "미국의 지원 확보"
 PER_secure_american_support_desc: "우리의 낡은 미국산 장비가 다음 10년까지 이어지게 하려면, 미국의 지원을 확보할 방법을 신속히 찾아야 합니다."
 PER_the_peoples_interest: "국민의 이익"
 PER_the_peoples_interest_desc: "모든 결정은 국민의 복지를 최우선에 두고 이루어져야 합니다. 정부가 취하는 모든 조치가 국민의 필요와 바람을 반영하도록 함으로써 강하고 정의로우며 번영하는 국가를 건설할 수 있습니다."
 PER_qalibafs_movement: "갈리바프의 운동"
 PER_qalibafs_movement_desc: "실용주의와 혁신, 그리고 이란의 미래를 새롭게 구상하려는 헌신 위에 세워진 운동입니다. 우리는 현대적 통치와 기술 진보, 국가적 통합을 강화한다는 흔들림 없는 목표에 중점을 두고 나라를 앞으로 이끌 것입니다."
 PER_technocrats_of_tehran: "테헤란의 기술 관료들"
 PER_technocrats_of_tehran_desc: "이란의 미래는 효율성과 전문성과 정밀성으로 통치하는 방법을 아는 이들의 손에 달려 있습니다. 우리의 비전은 국가 기구의 현대화를 이룰 것이며, 하찮은 정치를 넘어 국가 발전에 집중하도록 할 것입니다."
 PER_reduce_agricultural_subsidies: "농업 보조금 삭감"
 PER_reduce_agricultural_subsidies_desc: "우리는 농업 부문을 더 효율적으로 개혁해야 합니다. 보조금을 줄이면 혁신과 효율성, 지속 가능성이 촉진되어 이란의 농업이 세계 시장에서 경쟁할 수 있게 될 것입니다."
 PER_pragmatic_commander: "실용주의 지휘관"
 PER_pragmatic_commander_desc: "우리의 접근법은 분명합니다. 이념보다 실용주의입니다. 정치적 수사가 아닌 결과에 집중함으로써 안정적이고 번영하는 이란을 건설할 것입니다. 안정은 단호한 지도력과 효과적인 통치를 통해 이루어질 것입니다."
 PER_redifining_the_revolution: "혁명의 재정의"
 PER_redifining_the_revolution_desc: "혁명은 추상적인 개념이 아니며, 현대 이란의 요구에 부응하도록 진화해야 합니다. 우리의 과제는 국가적 진보와 경제적 회복력, 현대화에 중점을 두고 혁명을 재정의하여 혁명이 오늘날 국민에게 봉사하도록 하는 것입니다."
 PER_invite_russian_investors: "러시아 투자자 초청"
 PER_invite_russian_investors_desc: "러시아는 이란의 미래에 중요한 파트너입니다. 러시아 투자자들을 초청함으로써, 두 나라가 그 어느 때보다 서로를 필요로 하는 시기에 경제 성장과 기술 발전, 지정학적 연대를 위한 새로운 기회를 열 것입니다."
 PER_getting_things_done: "일을 해내기"
 PER_getting_things_done_desc: "행동이 핵심이며 갈리바프는 행동하는 사람입니다. 우리 정부는 가시적인 결과를 우선시하여 모든 계획과 사업이 실제로 측정 가능한 개선으로 이어지도록 할 것입니다. 더 이상의 지연도 변명도 없습니다. 오직 결과뿐입니다."
 PER_sideline_soleimani: "솔레이마니 배제"
 PER_sideline_soleimani_desc: "이란의 새로운 방향에는 개인적 권력 다툼에 흔들리지 않는 분명한 지도력이 필요합니다. 우리의 실용적 비전과 더 이상 맞지 않는 인물들을 배제함으로써 진정한 국가적 진보의 길을 열 것입니다."
 PER_irgc_leadership: "IRGC 지도부"
 PER_irgc_leadership_desc: "IRGC는 우리 국가 안보와 발전의 불가분한 일부로 남아야 하지만, 통일된 비전 아래에서 복무할 것입니다. 우리는 IRGC의 지도부가 국가의 경제적·전략적 목표와 조화를 이루어 더 강한 이란에 기여하도록 할 것입니다."
 PER_iran_on_the_move: "전진하는 이란"
 PER_iran_on_the_move_desc: "이란은 전진해야 하며, 우리의 지도 아래 그렇게 될 것입니다. 현대화에 대한 우리의 집중은 국가를 유례없는 속도로 앞으로 나아가게 하여 세계 열강 가운데 우리의 자리를 보장할 것입니다."
 PER_focus_on_cities: "도시에 집중"
 PER_focus_on_cities_desc: "미래가 형성되는 곳은 이란의 도시들입니다. 테헤란에서 이스파한에 이르기까지, 우리는 도시 개발에 자원을 집중하여 도시들이 진보와 혁신과 효율의 등대가 되도록 할 것입니다."
 PER_controlled_reform: "통제된 개혁"
 PER_controlled_reform_desc: "개혁은 필요하지만 혼란을 막기 위해 신중하게 관리되어야 합니다. 우리는 불안정의 위험 없이 국가 구조를 강화하고 이란 국민의 삶을 개선하는 통제되고 꾸준한 개혁을 시행할 것입니다."
 PER_neither_principalist_nor_reformist: "원칙주의자도 개혁주의자도 아니다"
 PER_neither_principalist_nor_reformist_desc: "우리는 이념적 범주에 깔끔하게 들어맞지 않습니다. 우리는 오직 이란에 효과가 있는 것, 즉 낡은 정치적 분열을 초월하는 실용적 정책에만 집중합니다."
 PER_economic_vanguard: "경제적 선봉"
 PER_economic_vanguard_desc: "우리의 경제 정책은 국가 발전의 최전선에 설 것입니다. 이란을 지역 경제의 선두로 자리매김하기 위해 혁신과 인프라, 산업 성장을 우선시할 것입니다."
 PER_stability_through_force: "힘을 통한 안정"
 PER_stability_through_force_desc: "강한 국가에는 질서의 유지가 필요합니다. 우리는 안정이 유지되도록 필요한 물리력을 사용하여 이란을 내외부의 위협으로부터 보호하고 꾸준한 진보를 보장할 것입니다."
 PER_influence_among_the_pasdars: "파스다란 내 영향력"
 PER_influence_among_the_pasdars_desc: "파스다란은 언제나 이란 방위의 기둥이었습니다. 우리는 그들과 긴밀히 협력하여 그들이 국가적 대의에 충성하고 국가의 안정과 성장에 기여하도록 할 것입니다."
 PER_state_corporatism: "국가 조합주의"
 PER_state_corporatism_desc: "핵심 산업에 대한 국가의 개입은 우리 국가의 번영에 필수적입니다. 국가 조합주의를 받아들임으로써, 민영화의 비효율과 통제되지 않는 외세 영향의 위험을 피하면서 경제 부문이 국익에 부합하도록 보장할 것입니다."
 PER_turning_a_blind_eye: "눈감아 주기"
 PER_turning_a_blind_eye_desc: "때로는 큰 그림을 위해 특정 세부 사항을 간과할 필요가 있습니다. 비록 사소하고 덜 중요한 문제들을 눈감아 주는 것을 의미하더라도, 우리는 국가의 장기적 안정에 집중해야 합니다."
 PER_militarize_economy: "경제의 군사화"
 PER_militarize_economy_desc: "강한 경제는 군사화된 경제입니다. 우리는 군 부문과 산업 부문의 통합에 집중하여 이란의 경제적 회복력과 안보를 보장하고, 국가 자원을 전략적 국가 발전에 활용할 것입니다."
 PER_ghalibaf_doctrine: "갈리바프 독트린"
 PER_ghalibaf_doctrine_desc: "갈리바프 독트린은 교육, 기술 혁신, 실용적 통치에 뿌리를 두고 있습니다. 우리는 미래 세대가 이끌 수 있도록 준비시키는 데 집중하는 한편, 모든 이란인을 위해 효과적이고 투명하게 작동하는 정부를 만들 것입니다."
 PER_modernize_police_force: "경찰력 '현대화'"
 PER_modernize_police_force_desc: "§Y'..하지만 레이싱카 소리가 나는걸요!'§!\n경찰력을 현대로 끌어들일 때입니다. 최첨단 기술로 현대화할 것이지만, 반짝이는 신형 BMW와 메르세데스 차량은 단지 병력의 사기를 높이기 위한 것이라고 말하는 이들도 있을 것입니다."
 PER_unified_vision: "통일된 비전"
 PER_unified_vision_desc: "이란의 미래에는 단일하고 일관된 비전이 필요합니다. 이 비전은 정부와 사회의 모든 부문을 경제 번영, 국가 통합, 지역 영향력이라는 공동의 목표로 정렬시킬 것입니다."
 PER_medias_under_control: "통제 아래의 언론"
 PER_medias_under_control_desc: "언론은 국익에 봉사해야 합니다. 우리는 언론을 통제하여 모든 언론 매체가 국가의 목표에 맞춰 활동하도록 하고, 통합과 일관된 서사를 조성할 것입니다."
 PER_the_hidden_budget: "숨겨진 예산"
 PER_the_hidden_budget_desc: "투명성은 핵심이지만 국가 안보와 경제 안정에는 신중함이 필요한 사안이 있습니다. 우리는 예산이 효율적으로 배분되도록 하되, 전략적 이유로 특정 측면은 공개하지 않을 것입니다."
 PER_curb_accademic_dissent: "학계 반대 의견 억제"
 PER_curb_accademic_dissent_desc: "통합된 국가에는 통합된 사고가 필요합니다. 우리는 국가 의제를 교란하는 학계의 반대 의견을 억제하여 이란의 지식인 엘리트가 미래에 대한 우리의 비전과 조화를 이루며 활동하도록 해야 합니다."
 PER_ahmadinejads_opportunity: "아마디네자드의 기회"
 PER_ahmadinejads_opportunity_desc: "국민의 필요와 국가적 자긍심의 부활에 초점을 맞춰 이란의 미래를 재편할 특별한 기회가 찾아왔습니다. 이 비전은 영적 진보와 물질적 진보를 모두 강조하며 국가를 위한 새로운 길을 개척합니다."
 PER_naft_ro_sofreh: "식탁 위의 석유"
 PER_naft_ro_sofreh_desc: "모든 이란인을 위한 가스 접근성이 우선시되어, 모든 시민이 신분에 관계없이 국가의 천연자원으로부터 혜택을 누릴 수 있도록 보장할 것입니다. 이 정책은 평등을 증진하고 에너지 부문의 격차를 줄일 것입니다."
 PER_guardians_of_the_future: "미래의 수호자들"
 PER_guardians_of_the_future_desc: "IRGC의 잔존 세력을 규합하여, 군부와 시위대의 영향에서 벗어난 안전한 국가의 수립을 위해 일할 새로운 병력을 편성해야 합니다."
 PER_family_protection_bill: "가족 보호 법안"
 PER_family_protection_bill_desc: "가족 보호 법안은 이란 가정을 지원하는 정책을 증진하여 사회 구조를 강화하는 것을 목표로 합니다. 이 계획은 전국의 가족 단위에 더 나은 보호와 자원을 제공하는 데 중점을 둘 것입니다."
 PER_price_control_on_essentials: "필수품 가격 통제"
 PER_price_control_on_essentials_desc: "필수품에 대한 가격 통제가 도입되어 모든 시민이 삶의 기본 필수품을 감당할 수 있도록 하고, 이란 국민을 인플레이션과 외부의 경제적 압력으로부터 보호할 것입니다."
 PER_spiritual_consolidation: "영적 결속"
 PER_spiritual_consolidation_desc: "영적 결속은 신앙에 기반한 단결과 활력 회복을 우선시하여, 국가를 동일한 도덕적·종교적 가치 아래 정렬시키고 사회적 응집력을 강화할 것입니다."
 PER_ditch_radical_ideal: "급진적 이상 폐기"
 PER_ditch_radical_ideal_desc: "더 실용적인 접근이 채택되어 급진적 이상으로부터 거리를 두고, 국가의 발전과 안정과 장기적 성장에 이익이 되는 정책에 집중할 것입니다."
 PER_embrace_the_current: "흐름 수용"
 PER_embrace_the_current_desc: "일탈의 흐름을 받아들이면 도전에 직면하여 더 큰 유연성을 확보할 수 있으며, 끊임없이 변화하는 세상에서 정책이 계속 호응하고 유효하도록 조정할 수 있습니다."
 PER_between_capitalism_and_socialism: "자본주의와 사회주의 사이"
 PER_between_capitalism_and_socialism_desc: "아마디네자드는 경제적 입장에 있어 언제나 변덕스러웠으나, 이제 편을 선택할 때가 왔습니다."
 PER_friends_in_high_places: "높은 곳의 친구들"
 PER_friends_in_high_places_desc: "영향력 있는 세계적 인물들과 전략적 관계가 구축되어, 이란의 정치적, 경제적, 안보적 이익에 도움이 되는 동맹을 육성할 것입니다."
 PER_more_the_merrier: "많을수록 좋다"
 PER_more_the_merrier_desc: "지원 정책을 통해 인구 증가가 장려되어 이란의 노동력이 강하게 유지되고 국가의 잠재력이 계속 확대되도록 할 것입니다."
 PER_subsidies_for_food_and_fuel: "식량 및 연료 보조금"
 PER_subsidies_for_food_and_fuel_desc: "식량과 연료 같은 필수품에 보조금이 지급되어 모든 시민의 복지를 보장하고 경제적 어려움의 시기에 곤궁을 방지할 것입니다."
 PER_redefining_the_national_enemy: "국가의 적 재정의"
 PER_redefining_the_national_enemy_desc: "국가의 적이라는 개념은 이란을 불안정하게 만들려는 외부 위협에 초점을 맞추어 재정의되며, 이란 국민 사이의 단결과 힘을 증진할 것입니다."
 PER_mahmoudenomics: "마흐무드노믹스"
 PER_mahmoudenomics_desc: "경제 모델은 자급자족에 초점을 맞추어, 외세에 대한 의존을 줄이고 이란의 부가 국민에게 이익이 되도록 하는 정책을 지향할 것입니다."
 PER_oath_under_pressure: "압박 속의 서약"
 PER_oath_under_pressure_desc: "국민의 이익을 수호하겠다는 엄숙한 서약이 이루어지며, 외부와 내부의 압박 속에서도 국가의 발전에 헌신할 것입니다."
 PER_shadow_arm: "그림자의 손길"
 PER_shadow_arm_desc: "이란은 은밀하고 전략적인 수단을 통해 지역 내 영향력을 확대하여 국가의 이익을 보호하고 세계 무대에서의 위상을 높일 것입니다."
 PER_money_well_spent: "잘 쓴 돈"
 PER_money_well_spent_desc: "재정 자원은 이란의 군사 및 보안 기구를 강화하는 데 전략적으로 투입되어, 국가가 지역적으로나 세계적으로나 이익을 방어할 준비를 갖추도록 할 것입니다."
 PER_one_nation_one_religion_one_order: "하나의 국가, 하나의 종교, 하나의 질서"
 PER_one_nation_one_religion_one_order_desc: "이란은 하나의 땅, 하나의 민족, 하나의 종교입니다. 국민의 지지를 받는 국가는 누구도 할 수 없는 일을 할 수 있으며, 단결은 무엇보다 우선해야 합니다."
 PER_mashaeis_approach: "마샤이의 접근법"
 PER_mashaeis_approach_desc: "마샤이는 종교의 영향에서 벗어나 통치와 사회에 대해 더 현대적이고 세속적인 접근에 초점을 맞춘 이란의 새로운 방향을 확립하고자 합니다."
 PER_redefining_iranian_nationalism: "이란 민족주의의 재정의"
 PER_redefining_iranian_nationalism_desc: "우리는 종교적 분열보다 국가의 힘과 단결을 우선시하도록 이란 민족주의를 재정의하여, 공통의 이란적 대의 아래 국민을 하나로 묶는 현대적 정체성을 육성할 것입니다."
 PER_shaking_the_foundations: "토대 뒤흔들기"
 PER_shaking_the_foundations_desc: "성직자들의 영향력은 너무 오랫동안 우리의 발전을 억눌러 왔습니다. 이제 그들의 권력의 토대를 뒤흔들어 국가에 대한 통제를 약화시키고, 더 세속적인 정부가 들어설 수 있도록 할 때입니다."
 PER_architect_of_a_new_iran: "새로운 이란의 설계자"
 PER_architect_of_a_new_iran_desc: "마샤이는 스스로를 낡은 구조에서 벗어나 현대화와 세속주의와 경제적 독립을 받아들이는 새로운 이란의 설계자로 자리매김합니다."
 PER_dissolve_clerical_influence: "성직자 영향력 해체"
 PER_dissolve_clerical_influence_desc: "우리는 성직자의 권력을 줄이고 정치 사안에서 그들의 영향력을 제거하여, 더 세속적이고 진보적인 국가가 출현하도록 대담한 조치를 취할 것입니다."
 PER_dynamic_approach: "역동적 접근법"
 PER_dynamic_approach_desc: "마샤이의 접근법은 정적인 것이 아니라 세계적 변화에 적응하고 이란을 지역과 세계의 선도적 강국으로 자리매김하는 데 초점을 맞춘 역동적이고 진화하는 전략입니다."
 PER_dissolve_the_remnants: "잔재 해체"
 PER_dissolve_the_remnants_desc: "IRGC와 이슬람 공화국의 잔재는 해체되어야 합니다. 그들의 낡은 통치 방식과 구 정권과의 연결고리는 새롭고 더 효율적인 보안 및 통치 체제를 위해 단계적으로 폐지될 것입니다."
 PER_old_habits: "오랜 습관"
 PER_old_habits_desc: "부패와 오랜 습관은 너무 오랫동안 이란을 괴롭혀 왔습니다. 마샤이는 이러한 뿌리 깊은 문제들에 맞서, 국가의 미래가 과거 실정의 짐에서 벗어나도록 할 것입니다."
 PER_direct_relations_with_god: "신과의 직접적 관계"
 PER_direct_relations_with_god_desc: "우리는 성직자와 그 중개자를 거치지 않고 신성한 존재와 개인적이고 직접적인 관계를 맺는 것을 믿습니다. 이는 우리의 신앙이 순수하게 유지되고 국가의 필요에 부합하도록 보장할 것입니다."
 PER_friend_of_all: "모두의 친구"
 PER_friend_of_all_desc: "마샤이의 외교 정책은 모든 국가와 우호 관계를 맺는 데 기반하며, 갈등과 분열보다 외교와 협력을 우선시합니다."
 PER_deal_with_critics: "비판자 대처"
 PER_deal_with_critics_desc: "우리는 우리 정책을 비판하는 이들에게 단호한 입장을 취해야 합니다. 그러나 반대 의견이 국가를 불안정하게 만들지 않도록 현명하고 전략적으로 처리해야 합니다."
 PER_except_israel: "..이스라엘은 제외"
 PER_except_israel_desc: "마샤이는 많은 국가와의 평화와 협력을 추구하지만, 이스라엘은 이념적 차이로 인해 예외로 남습니다. 이스라엘에 대한 우리의 입장은 여전히 반대와 불승인입니다."
 PER_even_israel: "..이스라엘까지도"
 PER_even_israel_desc: "실용주의 정신에 따라 마샤이는 이스라엘과도 대화할 용의가 있습니다. 평화와 외교라는 발상은 전통적인 적대감을 초월할 수 있으며, 향후 협상도 가능할 수 있습니다."
 PER_appoint_baghaei: "바가이 임명"
 PER_appoint_baghaei_desc: "충성심과 행정 능력으로 알려진 바가이가 국가 안보를 총괄하도록 임명될 것입니다. 그의 지도력은 이 변화의 시기에 국가의 안정을 보장하는 데 결정적일 것입니다."
 PER_no_islam_without_iran: "이란 없는 이슬람은 없다"
 PER_no_islam_without_iran_desc: "우리는 종교적 가치와 국가적 자긍심을 융합한 독특한 이란식 이슬람 학파를 세울 것입니다. 이는 이란의 미래가 신앙과 얽혀 있되 외세의 영향에서 자유롭도록 보장할 것입니다."
 PER_rebuild_vaja: "VAJA 재건"
 PER_rebuild_vaja_desc: "VAJA(문화이슬람지도부)는 세속적이고 이란 중심적인 문화 의제를 뒷받침하도록 재편될 것입니다. 더 이상 이슬람 공화국의 이념에 얽매이지 않고 진보적이며 포용적인 문화 정체성을 육성할 것입니다."
 PER_nation_before_islam: "이슬람에 앞선 국가"
 PER_nation_before_islam_desc: "이란의 국가 정체성은 어떤 종교적 이념보다 앞서야 합니다. 이슬람은 국가 문화의 중심적 부분으로 남겠지만, 통치와 정책의 모든 사안에서 국가성이 우선할 것입니다."
 PER_end_of_an_era: "한 시대의 종말"
 PER_end_of_an_era_desc: "이란에서 정치적 이슬람의 시대가 끝나가고 있습니다. 이는 세속주의, 민족주의, 세계적 교류에 초점을 맞춘 새로운 시대로의 전환을 의미합니다."
 PER_new_security_concerns: "새로운 안보 우려"
 PER_new_security_concerns_desc: "세계적 분쟁이 진화함에 따라 이란은 새롭고 부상하는 위협에 대응하도록 안보 전략을 전환해야 합니다. 우리는 이러한 새로운 도전에 더 민첩하고 선제적으로 대처하도록 군과 정보 기관을 현대화할 것입니다."
 PER_secularization_of_the_state: "국가의 세속화"
 PER_secularization_of_the_state_desc: "국가를 세속화하여 정치 권력이 종교 권위의 영향을 받지 않도록 할 때가 왔습니다. 이는 더 균형 잡히고 현대적인 이란으로 가는 길을 열어 줄 것입니다."
 PER_globalize_ideology_of_iran: "이란의 이념 세계화"
 PER_globalize_ideology_of_iran_desc: "독립, 자급자족, 민족주의에 기반한 이란의 이념이 전 세계에 공유될 것입니다. 우리는 외세의 영향을 거부하고 국가 발전을 우선시하는 이란의 선례를 다른 국가들이 따르도록 고무할 것입니다."
 PER_blessings_of_the_divine: "신의 축복"
 PER_blessings_of_the_divine_desc: "우리는 이 새로운 여정에 나서는 우리에게 신의 축복이 함께한다고 믿습니다. 우리 대의에 대한 믿음, 신의 인도, 이란 국민의 힘으로 우리는 위대함을 이룰 것입니다."
 PER_rally_the_basij: "바시즈 규합"
 PER_rally_the_basij_desc: "전국의 전 바시즈 대원들을 새로운 깃발, 아마디네자드의 깃발 아래 재결집시킬 때가 왔습니다."
 PER_mobilize_ansar_hezbollah: "안사르 헤즈볼라 동원"
 PER_mobilize_ansar_hezbollah_desc: "안사르 헤즈볼라는 시위와 정부에 대한 반대를 진압하는 데 유용한 자산이 될 수 있습니다. 그러나 그들의 활용은 국내 문제에 국한되지 않을 것이며, 필요하다면 전장에서도 반드시 활용할 것입니다."
 PER_awaiting_the_return: "재림을 기다리며"
 PER_awaiting_the_return_desc: "우리는 재림이 세상에 정의와 평화를 가져올 숨겨진 이맘의 귀환을 기다립니다. 그동안 우리는 이맘의 귀환과 국가 운명의 성취를 준비하며 강하고 통합된 이란을 건설하려는 노력을 계속합니다."
 PER_marzban: "마르즈반 물색"
 PER_marzban_desc: "지역 안정을 감독할 수 있는 군 지도자인 마르즈반은 우리의 노력에 결정적입니다. 우리는 전국의 군사 통치를 강화하기 위해 적합한 후보자를 찾아 임명할 것입니다."
 PER_counter_terror_initiative: "대테러 구상"
 PER_counter_terror_initiative_desc: "테러 위협은 계속해서 국가를 괴롭히고 있습니다. 우리는 이러한 집단을 제거하고 국민의 안전을 확보하기 위해 아르테시가 주도하는 포괄적인 대테러 구상을 시작할 것입니다."
 PER_drone_force: "아르테시 드론 부대"
 PER_drone_force_desc: "현대전은 최첨단 기술을 요구합니다. 우리는 군사 작전을 위한 감시, 타격, 정찰 능력을 제공할 드론 부대를 창설할 것입니다."
 PER_maintain_military_structure: "군사 구조 유지"
 PER_maintain_military_structure_desc: "우리는 현행 군사 구조를 보존하여 아르테시의 통제가 강력하고 통합된 상태로 유지되도록 할 것입니다. 민간 지도부는 배제되며 군이 절대적 권위로 통치할 것입니다."
 PER_outposts_as_government_institutions: "전초 기지의 정부 기관화"
 PER_outposts_as_government_institutions_desc: "우리는 전국에 군사 전초 기지를 설립하고 이를 핵심 통치 중심지로 전환할 것입니다. 이 전초 기지들은 아르테시 통제의 근간이 될 것입니다."
 PER_politicization_of_the_artesh: "아르테시의 정치화"
 PER_politicization_of_the_artesh_desc: "아르테시는 더 이상 비정치적으로 남지 않을 것입니다. 우리는 군의 가치가 모든 정부 업무에 반영되고 우리의 영향력이 전국으로 확대되도록 새로운 정당을 창당할 것입니다."
 PER_reassert_majles_authority: "마즐리스 권위 재확립"
 PER_reassert_majles_authority_desc: "마즐리스는 너무 오랫동안 불안정의 원인이었습니다. 군사 통치 아래에서 우리는 아르테시의 통치를 뒷받침하고 그 정책이 저항 없이 시행되도록 마즐리스의 권위를 다시 세울 것입니다."
 PER_supply_depots: "보급 창고"
 PER_supply_depots_desc: "보급이 충분한 군대는 통제를 유지하는 데 필수적입니다. 우리는 군을 지원하고 전투 준비 태세를 보장하기 위해 전국에 보급 창고를 설치하고 강화할 것입니다."
 PER_separate_religion: "아르테시와 종교의 분리"
 PER_separate_religion_desc: "아르테시의 힘을 유지하려면 군에 대한 모든 종교적 영향을 끊어야 합니다. 이념적 분열을 막기 위해 종교와 군사 문제가 별개로 유지되도록 할 것입니다."
 PER_faith_as_strength: "힘으로서의 신앙"
 PER_faith_as_strength_desc: "종교는 군과 분리되어야 하지만, 신앙은 여전히 우리 병력의 사기를 높이는 데 핵심적인 역할을 할 것입니다. 우리는 아르테시의 기치 아래 종교에서 영감을 얻은 국가적 단결을 증진할 것입니다."
 PER_patriotic_fervor: "애국적 열정"
 PER_patriotic_fervor_desc: "우리는 아르테시와 국민 사이에 흔들리지 않는 애국심을 길러 낼 것입니다. 국가와 군 지도부에 대한 충성은 정부의 안정에 무엇보다 중요할 것입니다."
 PER_an_economic_plan: "경제 계획"
 PER_an_economic_plan_desc: "강한 군대에는 강한 경제가 필요합니다. 우리는 군수 생산을 늘리고 병사들을 위한 일자리를 더 창출하며 국가 자원을 확보하기 위한 경제 계획을 시행할 것입니다."
 PER_the_sacred_doctrine: "신성한 교리"
 PER_the_sacred_doctrine_desc: "아르테시는 국가적 단결, 군사력, 국가에 대한 절대적 충성을 강조하는 교리를 견지할 것입니다. 이 교리는 우리의 통치를 이끌고 국민이 우리의 대의를 지지하도록 고무할 것입니다."
 PER_uplifting_bazaars: "바자르 진흥"
 PER_uplifting_bazaars_desc: "바자르는 우리 국가 경제의 심장입니다. 우리는 이러한 시장의 발전을 지원하여 군사 통치 아래에서 안정의 기둥으로 기능하도록 할 것입니다."
 PER_opening_iran: "이란 개방"
 PER_opening_iran_desc: "아르테시가 통제권을 쥔 지금, 우리는 이란의 문을 새로운 기회에 열 것입니다. 무역과 외교는 강화되겠지만 엄격한 군의 감독 아래 이루어져, 국가가 우리의 감시 아래 있도록 할 것입니다."
 PER_redirect_money_from_proxies: "전 대리 세력 자금 전용"
 PER_redirect_money_from_proxies_desc: "우리는 오랫동안 다른 나라의 대리전에 자금을 대 왔습니다. 이제 그 자금을 우리 군사 기반 시설로 돌려, 모든 리알이 이란 내 아르테시의 우위를 강화하는 데 쓰이도록 할 것입니다."
 PER_the_shield_of_iran: "[PER.GetFlag] 이란의 영웅들"
 PER_steadfast_artillery: "굳건한 포병"
 PER_the_MEK: "이란 인민 무자헤딘 기구"
 PER_the_MEK_desc: "흔히 MEK 또는 무자헤딘 에 칼크로 불리지만 공식적으로는 이란 인민 무자헤딘 기구(PMOI)로 알려진 이들은 오랫동안 우리 정부를 전복하려 시도해 왔습니다. 그들의 노력은 느슨해지기는커녕 시간이 갈수록 늘어났으며, 그들을 완전히 처리하기 전까지는 멈추지 않을 것입니다.\n§W--------------§!\n이 변동치는 §HMEK가 정부를 장악§!하거나 §H'라자비 암살'§! 결정을 완료하면 §R제거§!됩니다."
 PER_neutral_political_scene: "비동맹 정치 성향"
 PER_neutral_political_scene_desc: "우리 국가는 외세의 착취와 원조를 모두 경험했습니다. 그 결과 우리의 최근 정치적 성향은 동방도 서방도, 좌도 우도 아닙니다.\n§W--------------§!\n이 변동치는 §W중립§!이 더 이상 정부 성향이 아니게 되면 §R제거§!됩니다."
 PER_israel_etelaat_desc: "이스라엘 정보 기지는 시온주의자들의 활동을 한발 앞서 파악할 수 있게 해 줄 것입니다."
 PER_camp_ashraf: "아슈라프 수용소의 유산"
 PER_israeli_trade_agreement: "이스라엘 무역 협정"
 PER_help_with_taliban: "탈레반과의 전투"
 PER_gulf_supremacy_idea: "걸프 지역 패권"
 PER_islamic_golden_age: "이슬람 황금기"
 PER_artesh_drone_force: "아르테시 드론 부대"
 PER_mahmouds_breeding_grounds: "마흐무드의 온상"
 PER_iran_on_the_move_idea: "전진하는 이란"
 PER_iran_on_the_move_idea_desc: "'인생은 꽤 빠르게 흘러간다. 가끔 멈춰서 주위를 둘러보지 않으면 놓칠 수도 있다.'"
 PER_highly_entrenched_societal_norms: "고착화된 생활 방식"
 PER_highly_entrenched_societal_norms_desc: "수 세기 동안 이란의 생활 방식은 변하지 않았습니다. 1500년대 사파비 왕조에 의한 이란의 개혁 이래, 군대, 시아파 성직자, 바자르는 국가의 정치적 방향에 상당한 영향력을 행사해 왔습니다. 이란 사회의 이 세 거인을 무너뜨리려는 많은 시도에도 불구하고 그들은 그 어느 때보다 강력하게 서 있으며, 바자르와 시아파 성직자는 1979년에 2,500년에 걸친 이란 제국 통치를 끝냈습니다."
 PER_caspian_defenses_modifier: "카스피해 방어선"
 PER_caspian_defenses_modifier_desc: "타바리스탄 지역의 지형을 활용하면 카스피해 연안을 침략자가 될 모든 이들에게 생지옥으로 만들 수 있습니다."
 PER_diplomatic_neutrality_idea: "외교적 중립"
 PER_striking_satan: "악마 타격"
 PER_striking_satan_desc: "대악마는 어떤 방식으로든 무릎을 꿇게 될 것입니다."
 PER_integration_of_islamic_lands: "이슬람 영토의 통합"
 PER_integration_of_islamic_lands_desc: "다른 무슬림 국가들과의 통합 이후, 여러 땅의 모든 민족이 조화롭게 지내도록 하는 데 어려움을 겪고 있습니다."
 PER_islamic_republic_of: "[THIS.GetName] 이슬람 공화국"
 PER_islamic_republic_of_desc: "우리는 이슬람 공화국이며 영원히 그러할 것입니다. 우리 국가는 신 외에는 누구에게도 복종하지 않습니다."
 PER_azeri_separatism: "[SAZ.GetFlag] 남부 아제르바이잔 분리주의"
 PER_azeri_separatism_desc: "아제르바이잔 사람들은 압도적으로 스스로를 이란인으로 여기지만, 독립 국가를 세우거나 북쪽 동족과의 통합을 이루려는 분리주의 분자들이 곳곳에 있습니다. 그럼에도 우리 국가를 분열시키려는 이들에 의해 분리주의 정서가 조장되고 있으며, 우리는 이에 맞게 대응해야 합니다.\n§W--------------§!\n이 주 변동치는 이 주의 생산성이 §H1000§!이 되면 §R제거§!됩니다."
 PER_baloch_separatism: "[BLC.GetFlag] 발루치 분리주의"
 PER_baloch_separatism_desc: "발루치스탄은 수 세기 동안 이란의 일부였지만, 수십 년간의 방치로 인해 우리 국가에 대한 외세의 영향에 취약해졌습니다. 수십 년에 걸친 방치와 치안 활동은 이 지역을 무기와 금지된 밀수품으로 가득 차게 만들어, 누구에 대해서든 저항하기에 이상적인 조건을 조성했습니다.\n§W--------------§!\n이 주 변동치는 이 주의 생산성이 §H1000§!이 되면 §R제거§!됩니다."
 PER_kurd_separatism: "[KUR.GetFlag] 쿠르드 분리주의"
 PER_kurd_separatism_desc: "쿠르드인은 이란 민족이지만 오랫동안 이 지역에서 자신들의 국가를 추구해 왔습니다. 1940년대 후반에 어느 정도 성공을 거두었으나 단명한 쿠르드 국가는 곧 침공당해 이란의 일부로 재통합되었습니다. 그 이후로 쿠르드 지역을 이란에서 분리하려는 다양한 시도가 있었으며, 여러 분리주의 운동이 활동하고 있습니다.\n§W--------------§!\n이 주 변동치는 이 주의 생산성이 §H1000§!이 되면 §R제거§!됩니다."
 PER_ahvaz_separatism: "[ARA.GetFlag] 쿠제스탄 분리주의"
 PER_ahvaz_separatism_desc: "아랍인의 이란 침공 이후 쿠제스탄 지역은 상실되었고 많은 아랍계 주민이 국가 남서부 지역에 거주하기 시작했습니다. 대부분의 쿠제스탄 사람들은 페르시아어를 사용하는 민족적으로 이란인이지만, 외세의 영향에 자주 노출되고 자신들만의 국가를 세워야 한다고 여기는 아랍계 이란인도 상당수 있습니다.\n§W--------------§!\n이 주 변동치는 이 주의 생산성이 §H1000§!이 되면 §R제거§!됩니다."
 PER_red_sea_bleeds: "피 흘리는 홍해"
 PER_cento_sit: "CENTO"
 PER_basij_construction_effort: "바시즈 건설 노력"
 PER_basij_war_effort: "바시즈 전쟁 노력"
 PER_basij_education_effort: "바시즈 교육 노력"
 PER_IRGC_modifier: "이슬람 혁명수비대"
 PER_IRGC_modifier_desc: "이슬람 혁명수비대는 이슬람 공화국이 전복되는 것을 막기 위해 창설되었습니다. 그 목표는 수년에 걸쳐 변화하여 대외 목표에 더 큰 비중이 두어지게 되었습니다. IRGC는 사실상 이란의 정규군인 아르테시보다 더 유능해졌고, 그 결과 군 예산의 대부분을 받고 있습니다.\n§W--------------§!\n이 국가 정신은 이슬람 공화국이 붕괴하면 §R제거§!됩니다."
 PER_palestinian_frontism_idea: "아부 지하드 해외 작전 부대"
 PER_palestinian_frontism_idea_desc: "칼릴 알와지르의 이름을 딴 아부 지하드 해외 작전 부대는 팔레스타인 무장 세력과 이란 정보 요원들이 공동으로 이끄는 작전 부대로, 즉석 폭발물의 밀반입과 제조, 터널망 건설을 감독합니다. 주로 IRGC 쿠드스군의 이란 지부가 통제합니다."
 PER_economy_modifier: "이란 경제 상태"
 PER_economy_modifier_desc: "이란의 경제는 개발되기를 기다리는 커다란 잠재력을 지니고 있습니다. 천연자원이 풍부한 만큼, 국민의 삶을 개선할 경제의 역량을 극대화하도록 경제를 관리하는 것은 이란의 집권 정부에 달려 있습니다. 이 변동치는 이란 경제의 현재 상태를 나타냅니다.\n§W--------------§!\n이 국가 정신은 결코 §R제거§!되지 않습니다. 다만 더 많은 중점, 결정, 사건이 완료됨에 따라 국가 경제 상태를 반영하여 변동치가 점진적으로 §G개선§!될 수 있습니다."
 PER_artesh_modifier: "이란 군대 상태"
 PER_artesh_modifier_desc: "역사적으로 이란은 군사적 발전과 혁신의 선두에 있었습니다. 그러나 지난 두 세기 동안 이란은 세계의 경쟁국들을 따라잡지 못했습니다. 이란의 통치자들이 군의 역량을 다시 회복시킬 수 있다면, 이란은 오래전에 잃은 왕좌를 되찾을 수 있을 것입니다.\n§W--------------§!\n이 국가 정신은 결코 §R제거§!되지 않습니다. 다만 더 많은 중점, 결정, 사건이 완료됨에 따라 국가 군대의 상태를 반영하여 변동치가 점진적으로 §G개선§!될 수 있습니다."
 PER_political_modifier: "이란 국가 상태"
 PER_political_modifier_desc: "수천 년의 역사가 오늘날의 정통성을 뒷받침하는 고대 국가입니다. 이란은 많은 민족으로 이루어진 나라로, 제국과 통치자가 오고 가는 것을 지켜보았습니다. 이란에게 통치자의 무능이 초래한 국내 문제는 낯설지 않습니다. 끊임없는 혼란에서 벗어난 이란에는 좋은 미래만이 기다리고 있을 것입니다.\n§W--------------§!\n이 국가 정신은 결코 §R제거§!되지 않습니다. 다만 더 많은 중점, 결정, 사건이 완료됨에 따라 국가의 정치 상황을 반영하여 변동치가 점진적으로 §G개선§!될 수 있습니다."
 PER_prepare_for_abu_musa: "아부 무사의 수호자들"
 PER_IAIO_spirit: "이란 항공 산업 기구"
 PER_election_events.71: "제14대 대통령 선거"
 PER_election_events.71.t: "제14대 대통령 선거"
 PER_election_events.71.d: "정당들과 정부 내 영향력 있는 인사들 사이의 조율이 끝나, 후보자를 정하고 헌법수호위원회가 그 자격을 확인하는 데 필요한 조율이 완료되어 시행되었습니다. 사회 분위기 또한 선거에 대한 기대로 들떠 있는 듯합니다.\n또한 이전 선거와 비교하여 원칙주의 정당과 개혁주의 정당 사이의 차이가 줄어들었으며, 선거가 평화롭게 치러질 수 있을 정도입니다.\n\n척도는 국민의 표입니다."
 PER_election_events.71.a: "이번에는 어떻게 될지 지켜보자."
 PER_election_events.81: "야즈디 승리!"
 PER_election_events.81.t: "야즈디 승리!"
 PER_election_events.81.d: "오늘은 선거일이며, 후보 야즈디와 타바콜리 사이의 치열한 접전 끝에 야즈디가 승리를 거두어 새로 선출된 이란 대통령으로서 이란을 이끌게 된 것으로 보입니다.\n개혁주의자들이 승리했다는 분명한 신호입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.81.a: "알겠다"
 PER_election_events.101.t: "카바케비안 승리!"
 PER_election_events.101.d: "오늘은 선거일로, 승자가 발표되는 날입니다.\n이란 선거의 승자는 카바케비안입니다!\n패자는 아마디네자드입니다! 개혁주의자들의 분명한 승리입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.101.a: "알겠다"
 PER_election_events.121.t: "카루비 승리!"
 PER_election_events.121.d: "오늘은 선거일이며, 당선된 후보는 다름 아닌 카루비입니다!\n상대인 아마디네자드를 꺾은 그에게 축하를 보냅니다.\n개혁주의자들이 명백한 승자가 된 중대한 순간입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.121.a: "알겠다"
 PER_election_events.151.t: "마샤이 승리!"
 PER_election_events.151.d: "선거일이 왔고, 시련의 승자가 모습을 드러냈습니다. 바로 마샤이입니다!\n패배의 고통을 겪어야 했던 로하니와 레자이에게 위로를 보냅니다.\n원칙주의자들의 큰 승리입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.151.a: "알겠다"
 PER_election_events.181: "바야디 승리!"
 PER_election_events.181.t: "바야디 승리!"
 PER_election_events.181.d: "오늘은 선거일이며, 국민이 자신들의 국가를 이끌고 대표할 사람을 선택해야 하는 날로, 국민의 마음을 얻은 사람은 바야디입니다!\n로하니에게는 매우 예상치 못한 슬픈 패배이며, 그에게 다시는 기회가 없을 것입니다.\n원칙주의자들의 놀라운 승리입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.181.a: "알겠다"
 PER_election_events.191: "학셰나스 승리!"
 PER_election_events.191.t: "학셰나스 승리!"
 PER_election_events.191.d: "오늘은 선거일이며, 야심 찬 정치인들이 국가를 이끄는 책임을 맡도록 선택되는 날입니다. 오늘의 승자는 학셰나스입니다!\n놀라면서도 당연히 분노한 라이시가 의회에서 박차고 나갑니다.\n개혁주의자들의 결정적인 승리입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.191.a: "알겠다"
 PER_election_events.201: "라이시 승리!"
 PER_election_events.201.t: "라이시 승리!"
 PER_election_events.201.d: "오늘은 선거일이며, 국민이 자신들을 대표하고 이끌 사람에게 투표하는 날입니다. 운명의 승자는 라이시입니다!\n페제시키안은 놀라지 않은 모습으로 승자를 축하합니다.\n원칙주의자들의 대단한 승리입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.201.a: "알겠다"
 PER_election_events.202: "페제시키안 승리!"
 PER_election_events.202.t: "페제시키안 승리!"
 PER_election_events.202.d: "오늘은 선거일이며, 국민이 자신들을 대표하고 이끌 사람에게 투표하는 날입니다. 운명의 승자는 페제시키안입니다!\n라이시는 자신이 이겼어야 한다고 느꼈지만, 그럼에도 승자를 축하합니다.\n개혁주의자들의 대단한 승리입니다!\n\n척도는 국민의 표입니다."
 PER_election_events.202.a: "알겠다"
 iranian_events.13.t: "우리에게 전쟁 배상금 지불을 요구하는 이란"
 iranian_events.13.d: "이란과의 우리 전쟁은 1980년부터 1988년까지 이어졌습니다. 이라크의 이란 침공으로 시작되어 쌍방이 국제연합 안전보장이사회 결의 598호를 수락할 때까지 거의 8년간 지속되었습니다. 전문가 그룹이 재건 문제를 조사하고 피해를 산정하기 위해 이란에 파견되었고 안전보장이사회에 보고했습니다. 그들은 직접 피해가 990억 달러, 간접 피해가 1,500억 달러로 총 2,490억 달러에 달한다고 발표했습니다. 우리는 아직 이 돈을 지불하지 않았으나, 이제 그들이 우리에게 지불을 요구하고 있습니다."
 iranian_events.13.o1: "지불할 수 있다."
 iranian_events.13.o2: "그들에게 아무것도 지불하지 않는다."
 iranian_events.8.t: "튀르키예-이라크 기지 폭파"
 iranian_events.8.d: "이라크에 있는 우리 군사 기지가 조직적인 공격을 받아 많은 사상자가 발생했습니다. 아직 아무도 이 공격에 대한 책임을 주장하지 않았으나, 우리는 이란의 소행임을 압니다..."
 iranian_events.8.o1: "슬프다"
 iranian_events.9.o1: "흥미롭군"
 iranian_events.10.o1: "흥미롭군"
 iranian_events.11.t: "바쿠 가스관 폭파"
 iranian_events.11.d: "아제르바이잔의 바쿠 가스관에서 사보타주가 벌어져 다른 나라들과의 무역에 차질이 빚어졌고 우리 경제에도 피해가 발생했습니다. 아직 아무도 이 공격에 대한 책임을 공식적으로 주장하지 않았습니다."
 iranian_events.11.o1: "흥미롭군"
 iranian_events.14.t: "전쟁 배상금 지불을 거부한 이라크"
 iranian_events.14.d: "이라크 정부는 우리가 요구했음에도 전쟁 배상금을 지불하지 않기로 결정했습니다. 이는 우리가 그들을 공격할 명분이 됩니다."
 iranian_events.14.o1: "좋다, 그렇다면!"
 iranian_events.15.t: "전쟁 배상금을 지불하기로 한 이라크"
 iranian_events.15.d: "이라크 정부는 우리가 요구한 후 전쟁 배상금을 지불하기로 결정했습니다. 이는 그들의 경제에 타격을 주고 그들에 대한 우리의 영향력을 줄이겠지만, 우리에게는 여전히 그 돈이 필요했습니다."
 iranian_events.15.o1: "좋다"
 iranian_events.12.t: "제3차 개발 계획"
 iranian_events.12.d: "조직 차원에서 행정 체계를 바로잡고 개선하고 개혁하기 위해 이 계획을 사용할 것입니다. 그런데 어느 부분에 더 집중해야 합니까?"
 iranian_events.12.o1: "산업 조직에 집중"
 iranian_events.12.o2: "과학 조직에 집중"
 iranian_events.12.o3: "군사 조직에 집중"
 axis_of_resistance_events.8.t: "시리아에 영향력을 투사하는 이란"
 axis_of_resistance_events.8.d: "[PER.GetLeader]은(는) [PER.GetNameWithFlag]의 영향력을 우리 나라로 확대하는 데 분명한 관심을 표명했습니다. 이를 환영하든 저항하든, [PER.GetNameWithFlag]이(가) 우리 코앞에 존재한다는 사실은 부인할 수 없습니다. 이 영향력에 대응할 것인지, 아니면 그들의 진짜 의도가 무엇인지 지켜볼 것인지 결정해야 합니다."
 axis_of_resistance_events.8.o1: "어떻게 되는지 지켜보자"
 axis_of_resistance_events.8.o2: "용납할 수 없다"
 axis_of_resistance_events.9.t: "바트당의 쿠데타 모의"
 axis_of_resistance_events.9.d: "최근의 변화에 대응하여 바트당 쿠데타가 준비되고 있을 가능성이 있다는 보고가 들어왔으며, 우리는 이에 대비해야 합니다."
 axis_of_resistance_events.9.o1: "알겠다"
 axis_of_resistance_events.12.t: "바트당원 생성"
 axis_of_resistance_events.12.d: "숨겨진 사건"
 axis_of_resistance_events.12.o1: "버튼"
 axis_of_resistance_events.13.t: "팔레스타인 영토에서 정권을 장악한 하마스"
 axis_of_resistance_events.13.d: "무장 단체 하마스가 팔레스타인 점령지 내 영토의 통제권을 성공적으로 장악했습니다. 며칠간의 격렬한 충돌 끝에 팔레스타인 자치정부에 충성하는 세력을 몰아냈습니다. 하마스 전투원들은 주요 정부 청사, 경찰서, 군 시설을 급습하여 팔레스타인 자치정부의 영향력을 산산조각 냈습니다."
 axis_of_resistance_events.13.o1: "흥미롭군"
 axis_of_resistance_events.14.t: "점령지에서 정권을 장악한 팔레스타인 이슬람 지하드"
 axis_of_resistance_events.14.d: "무장 단체 팔레스타인 이슬람 지하드(PIJ)가 팔레스타인 점령지 내 영토의 통제권을 성공적으로 장악했습니다. 며칠간의 격렬한 충돌 끝에 팔레스타인 자치정부에 충성하는 세력을 몰아냈습니다. PIJ 전투원들은 주요 정부 청사, 경찰서, 군 시설을 급습하여 팔레스타인 자치정부의 영향력을 산산조각 냈습니다."
 axis_of_resistance_events.14.o1: "흥미롭군"
 axis_of_resistance_events.15.t: "팔레스타인 영토 내 해방을 선포한 인민전선"
 axis_of_resistance_events.15.d: "무장 단체 팔레스타인 해방 인민전선(PFLP)이 팔레스타인 점령지 내 영토의 통제권을 성공적으로 장악했습니다. 며칠간의 격렬한 충돌 끝에 팔레스타인 자치정부에 충성하는 세력을 몰아냈습니다. PFLP 전투원들은 주요 정부 청사, 경찰서, 군 시설을 급습하여 팔레스타인 자치정부의 영향력을 산산조각 냈습니다."
 axis_of_resistance_events.15.o1: "흥미롭군"
 axis_of_resistance_events.16.t: "인민저항위원회 연합의 정권 장악"
 axis_of_resistance_events.16.d: "무장 단체 인민저항위원회(PRC)가 팔레스타인 점령지 내 영토의 통제권을 성공적으로 장악했습니다. 며칠간의 격렬한 충돌 끝에 팔레스타인 자치정부에 충성하는 세력을 몰아냈습니다. PRC 전투원들은 주요 정부 청사, 경찰서, 군 시설을 급습하여 팔레스타인 자치정부의 영향력을 산산조각 냈습니다."
 axis_of_resistance_events.16.o1: "흥미롭군"
 axis_of_resistance_events.17.t: "[PER.capital.GetCapitalVictoryPointName]의 명령"
 axis_of_resistance_events.17.d: "테헤란의 명령이 우리 본부에 도착했으며, 레바논을 병합하여 전역을 장악하라는 지시를 받은 것으로 보입니다. 이란은 그렇게 하면 우리가 더욱 끓어오르는 기세와 더 많은 인력으로 시온주의자들과 싸울 수 있게 될 것이라고 밝혔습니다."
 axis_of_resistance_events.17.a: "명령 수령"
 axis_of_resistance_events.18.t: "공격받는 예멘"
 axis_of_resistance_events.18.d: "예멘 정부가 이란과 후티 반군의 손에 전면적인 공격을 받고 있습니다. 이 사태는 홍해와 만데브 해협의 안보를 위협하며, 전 세계 해운을 위험에 빠뜨릴 수 있습니다. 우리는 이란의 침탈에 맞서 싸우기 위해 병력을 집결시켜야 합니다."
 axis_of_resistance_events.18.a: "신이시여, 우리를 도우소서"
 axis_of_resistance_events.19.t: "혼란에 빠진 예멘"
 axis_of_resistance_events.19.d: "후티가 지원하는 최고혁명위원회가 [YEM.GetLeader] 정부를 전복하기 위한 총동원령을 선포하면서 수도 사나에서 총성이 울렸습니다. 이란 정부가 후티 반란의 주된 후원 세력이라는 것이 일반적인 견해입니다. 테헤란이 저항 축을 확장하기 위해 수개월, 어쩌면 수년 전부터 이를 계획해 왔다는 추측이 무성합니다. \n\n최고지도자는 어떠한 개입도 부인하며 오히려 '예멘 국민은 제국주의 사탄으로부터 스스로를 해방하고자 한다'고 밝혔습니다. [SAU.GetName] 정부와 다른 걸프 국가들은 이번 분쟁이 바로 자국의 뒷마당에서 벌어지고 있으며 지역 무역을 불안정하게 만들 수 있다며 격한 분노와 비난으로 대응했습니다. 일부는 이 분쟁이 통제를 벗어나 이란과 [SAU.GetName] 사이의 길고 장기적인 대리 분쟁으로 번질 수 있다고 우려하고 있습니다."
 axis_of_resistance_events.19.a: "취약한 국가가 다시 한번 무너지다"
 axis_of_resistance_events.22.t: "[HOU.GetAdjective]의 사나 공세"
 axis_of_resistance_events.22.d: "[HOU.GetAdjective] 지도자 [HOU.GetLeader]은(는) 궁지에 몰린 [YEM.GetLeader] 정부를 무너뜨리기 위한 작전으로 [YEM.GetAdjective] 수도 사나에 대한 대규모 공세를 개시한다고 발표했습니다. 후티 지도자는 [YEM.GetLeader]을(를) 수도에서 몰아내고 주요 항구 도시 아덴을 향한 공세를 계속하겠다는 의지를 선언했습니다. 이는 [YEM.GetNameWithFlag]이(가) 끝없는 분쟁 상태에 빠져 있는 가운데 벌어진 일입니다."
 axis_of_resistance_events.22.o1: "마지막 결정타"
 axis_of_resistance_events.23.t: "예멘의 알카에다 반란"
 axis_of_resistance_events.23.d: "[AQY.GetLeader]은(는) 오늘 [SAU.GetAdjective]의 지원을 받는 [YEM.GetLeader] 정부에 대한 전면 공세를 선포했습니다. 그는 AQAP(아라비아반도 알카에다)가 포괄 조직으로서 [AQY.GetNameWithFlag]을(를) 결성했으며, 이 조직이 [YEM.GetNameWithFlag]에 이슬람 칼리파국을 세우는 것을 목표로 [YEM.GetNameWithFlag] 정권과 싸우고 있다고 밝혔습니다.\n\n분석가들은 [YEM.GetNameWithFlag]이(가) 동부에서 통제력을 행사하지 못하는 틈을 타 알카에다와 그 아라비아반도 지부가 약한 저항만을 받으며 손쉽게 진격해 알 무칼라와 세이윤을 포함한 예멘 동부와 남부 해안의 주요 도시들을 점령했다고 확인했습니다."
 axis_of_resistance_events.23.o1: "예멘 분쟁이 새로운 국면에 접어들다"
 axis_of_resistance_events.24.t: "아덴 전투"
 axis_of_resistance_events.24.d: "남부과도위원회 지도자 [STC.GetLeader]이(가) 항구 도시 아덴 장악에 착수했으며, 아덴 거리에서 치열한 전투가 벌어지는 가운데 [STC.GetLeader]의 병력이 정부 충성파를 밀어내기 시작했습니다. 이들은 도시를 장악하고 독립적인 남부 주권 국가의 수립을 주장할 의도입니다. "
 axis_of_resistance_events.24.o1: "예멘 전쟁이 또다시 새로운 국면을 맞다"
 axis_of_resistance_events.28.t: "[IRQ.GetName]에서의 1920 혁명 여단 작전"
 axis_of_resistance_events.28.d: "[NTR.GetFlag][NTR.GetName](1920 혁명 여단)의 지도자 [NTR.GetLeader]은(는) 외국 적대 세력을 국가에서 몰아내기 위한 [IRQ.GetNameWithFlag] 내 공세를 공식적으로 개시했습니다. 시아파 민병대, 지하디 단체, 지역 민병대 사이에서 종파 간 폭력이 격화되면서 팔루자 거리에서 치열한 전투가 벌어졌습니다. 이 여단은 무슬림 형제단 계열로 추정되는 알다리 협회, JAMI, 이라크 이슬람당과 긴밀한 관계를 맺고 있습니다. [NTR.GetLeader]의 병력은 정부 충성파와 [ISI.GetNameWithFlag] 전투원 모두를 밀어내며 주요 거점을 확보하는 데 상당한 진전을 이루고 있습니다. 상황은 여전히 불안정하며, 계속되는 분쟁은 이라크의 다른 지역까지 집어삼켜 더 광범위한 권력 투쟁으로 번질 위협이 있습니다."
 axis_of_resistance_events.28.o1: "이라크 전쟁이 또다시 새로운 국면을 맞다"
 axis_of_resistance_events.30.t: "내부 투쟁에 빠진 1920 혁명 여단"
 axis_of_resistance_events.30.d: "[NTR.GetFlag][NTR.GetName](1920 혁명 여단)이 이슬람 정복과 이슬람 지하드라는 두 파벌로 분열되었습니다. 스스로를 [HII.GetFlag][HII.GetName](이)라 칭하는 이슬람 정복은 같은 이름을 지닌 팔레스타인 단체의 인기를 이용하려 하고 있습니다. 한편 이슬람 지하드는 원래의 [NTR.GetFlag]1920 혁명 여단의 유산을 계승했으며, 지하드 전통을 보존하고 이어 가겠다고 맹세했습니다."
 axis_of_resistance_events.30.o1: "이라크의 또 다른 전쟁"
 axis_of_resistance_events.31.t: "[ISI.GetName]에 선전포고한 [IAI.GetName]"
 axis_of_resistance_events.31.d: "마지막 바트당 거점이 함락된 이후, 이라크 이슬람군은 [ISI.GetNameWithFlag]과(와) 국내에서 활동하는 그 연계 세력에 대해 선전포고했습니다. [IRQ.GetNameWithFlag] 북부에서 일련의 폭력적 충돌이 벌어진 끝에 두 단체 사이의 긴장이 폭발했으며, [ISI.GetNameWithFlag] 병력은 사담 후세인 정권 붕괴가 남긴 혼란을 틈타 세력을 넓혔습니다. [IAI.GetFlag][IAI.GetName]은(는) [IRQ.GetNameWithFlag]의 수니파 중심지에 대한 통제권을 확립하기로 결의했으며, [ISI.GetNameWithFlag]의 존재를 불안정 요인으로 간주하여 이들을 몰아내기 위한 전면 공세를 개시하고 있습니다. 분석가들은 바트당 몰락으로 생긴 권력 공백 속에서 경쟁 파벌들이 통제권을 놓고 다투면서 [IRQ.GetNameWithFlag]의 분쟁이 확대될 수 있다고 전망합니다."
 axis_of_resistance_events.31.o1: "이라크의 미래를 건 전투가 시작되다"
 axis_of_resistance_events.32.t: "안바르 부족 위원회 봉기"
 axis_of_resistance_events.32.d: "[ATC.GetFlag]안바르 부족 위원회가 이 지역에서의 그들의 주둔을 규탄하며 [IRQ.GetNameWithFlag]에서 [ISI.GetNameWithFlag] 병력에 대한 봉기를 일으켰습니다. 부족 지도자들은 자신들의 땅을 되찾기 위해 전투원을 동원하여 [ISI.GetNameWithFlag] 거점을 공격하고 안바르의 주요 도시들을 점령했습니다. 이러한 확전은 부족 병력이 [ISI.GetNameWithFlag]에 맞서면서 더 광범위한 분쟁으로 번질 위협이 있으며, 이라크의 세력 균형을 바꿔 놓을 수도 있습니다."
 axis_of_resistance_events.32.o1: "안바르를 둘러싼 싸움이 시작되다"
 axis_of_resistance_events.33.t: "이라크 내전의 종결"
 axis_of_resistance_events.33.d: "[IRQ.GetName]의 전쟁이 끝났습니다. 대부분의 반대 파벌이 해산되거나 흡수되면서 전쟁이 공식적으로 종결되었습니다. 전장이 정리된 지금, [IRQ.GetName]은(는) 국가 재건이라는 막중한 과제를 마주하고 있습니다."
 axis_of_resistance_events.33.o1: "새로운 시대가 시작되다"
 axis_of_resistance_events.36.t: "이라크 혁명가 총군사위원회를 결성한 무장 세력"
 axis_of_resistance_events.36.d: "바트당 계열 단체들, 수니파 부족 민병대, 전직 군 장교들이 통합 전선인 이라크 혁명가 총군사위원회(GMCIR)의 결성을 발표했습니다.\n\n위원회 대변인은 비공개 장소에서 방송을 통해 이전 정부의 잔존 세력과 이란과 연계된 시아파 민병대 모두를 불법이라고 규탄했습니다. 이들은 '외세의 지배로부터 이라크를 해방'하기 위해 싸우고 있다고 주장합니다. GMCIR은 민족주의 이라크 국가의 재건을 촉구했습니다."
 axis_of_resistance_events.36.o1: "대세가 바뀐다"
 axis_of_resistance_events.38.t: "내부 쿠데타로 1920 혁명 여단을 전복한 이라크 하마스"
 axis_of_resistance_events.38.d: "이라크 하마스가 이란의 지원을 받는 민병대와 구체제 잔존 세력 모두에 맞서 싸우던 주요 세력이자 과거의 동맹이었던 1920 혁명 여단을 상대로 내부 쿠데타를 일으켰습니다.\n\n쿠데타는 이라크 서부에서 열린 지도부 정상회담 도중 일어났으며, 이라크 하마스 병력이 시설을 급습하여 1920 혁명 여단의 고위 지휘관 여러 명을 체포했습니다."
 axis_of_resistance_events.38.o1: "반란이 스스로를 집어삼키다."
 axis_of_resistance_events.40.t: "바트당 지도부를 장악한 알아와다"
 axis_of_resistance_events.40.d: "무함마드 유니스 알아흐마드가 이끄는 망명 알아와다 파벌이 내부 쿠데타를 일으켜 이라크 바트당의 전권 지도부를 자처했습니다. 시리아 국경 근처에서 열린 비밀 대회 도중 신속한 조치로 알아와다는 경쟁 지휘관들을 숙청하고 새로운 통합 혁명 사령부를 선포했습니다.\n\n알아흐마드는 바트당 대의의 분열을 규탄하며 운동에 질서와 이념을 되찾겠다고 다짐했습니다. 전직 정보 및 군 장교들의 지원을 받는 이 파벌은 이제 이라크 내전의 혼란 속에서 바트당의 우위를 다시 확립하려 하고 있습니다."
 axis_of_resistance_events.40.o1: "사담의 그림자"
 axis_of_resistance_events.41.t: "이라크 내전의 승리를 주장하는 바트당 연합"
 axis_of_resistance_events.41.d: "전직 바트당 장교, 수니파 부족 지도자, 민족주의 반군의 연합체인 이라크 혁명가 총군사위원회(GMCIR)가 승리를 선언했습니다. 바그다드를 장악하고 이란의 지원을 받는 시아파 민병대와 충성파 세력을 모두 격파한 뒤, GMCIR은 임시 군사 정부의 수립을 발표했습니다.\n\nEU와 서방 대부분이 이를 승인했음에도 이들은 이 단체의 바트당 이념과 민족 및 종파 소수자에 대한 보복 가능성에 대해 여전히 우려를 표하고 있으며, 일부는 이를 이란의 영향력에 대한 방벽으로 보고 있습니다."
 axis_of_resistance_events.41.o1: "사담의 그림자"
 axis_of_resistance_events.42.t: "내전의 승리를 선언한 이라크 이슬람군"
 axis_of_resistance_events.42.d: "수개월에 걸친 잔혹한 도시전과 이라크 내 교전 파벌 간의 변화무쌍한 동맹 끝에, 옛 국가의 잿더미 속에서 새로운 승자가 등장했습니다. 한때 군소 세력으로 여겨졌던 수니파 이슬람주의 반군 단체인 이라크 이슬람군(IAI)이 이라크 전역을 장악하고 내전의 종식을 선언했습니다."
 axis_of_resistance_events.42.o1: "이름만 빼면 칼리파국?"
 axis_of_resistance_events.43.t: "승리를 선언한 이라크 하마스"
 axis_of_resistance_events.43.d: "이라크 하마스로 알려진 단체가 내전의 종식을 선언했습니다.\n\n소외된 이라크 수니파 주민들의 대변자를 자처한 이라크 하마스는 혼란 속에서 규율 있고 이념에 충실한 세력으로 부상했습니다. 종교 조직망, 전직 반군, 전쟁에 지친 민간인들의 지지를 얻은 이 단체는 부패한 과거 정부와 외세의 지원을 받는 파벌 모두에 대한 대안을 제시함으로써 지지를 얻었습니다."
 axis_of_resistance_events.43.o1: "이름만 빼면 칼리파국?"
 axis_of_resistance_events.44.t: "이라크의 승리를 주장하는 1920 혁명 여단"
 axis_of_resistance_events.44.d: "이라크 내전이 1920 혁명 여단의 깃발 아래 막을 내렸습니다. 역사적인 반식민 봉기에서 이름을 딴 이 단체는 바그다드를 장악하고 이라크 중부와 서부의 통제권을 공고히 한 뒤 승리를 선언했습니다.\n\n본래 수니파 이슬람주의-민족주의 단체로 활동하던 이들은 이라크 주권의 수호자를 자처하며 이란의 지배와 극단주의 이념에 모두 반대함으로써 농촌 지역에서 인기를 얻었습니다.\n\n이제 집권한 여단은 국민 저항 공화국의 수립을 선포하고, 이슬람 가치와 국가 독립의 인도 아래 이라크 단결로의 복귀를 촉구하고 있습니다."
 axis_of_resistance_events.44.o1: "1920년의 정신은 살아 있다."
 axis_of_resistance_events.45.t: "이라크의 질서를 회복한 바트당 파벌 '알아와다'"
 axis_of_resistance_events.45.d: "'귀환'을 뜻하는 알아와다로 알려진 망명 바트당 파벌이 놀라운 군사적, 정치적 승리를 거두었습니다. 사담 시절 고위 관료였던 무함마드 유니스 알아흐마드가 이끄는 이 파벌은 전직 군 장교, 바트당 충성파, 불만을 품은 수니파로 구성된 규율 잡힌 병력으로 북부와 서부를 휩쓸었습니다."
 axis_of_resistance_events.45.o1: "1920년의 정신은 살아 있다."
 influence.56.t: "팔레스타인으로의 무기 수송"
 influence.56.d: "수단을 거쳐 이집트로 밀반입할지, 화물선으로 수송할지 등 무기 전달 방식을 계획해야 합니다. 이스라엘 정부는 우리의 행동을 경계할 것입니다. 무기를 보낼 때는 수송 방식과 인접국의 성향에 따라 분실되는 무기에 대해 10%에서 50%에 이르는 일정 비율의 손실을 감수해야 합니다."
 influence.56.a: "육로로 밀반입한다"
 influence.56.b: "해상 항로로 수송한다"
 influence.56.c: "오늘은 안 되겠다"
 iranian_focus.175.a: "알겠다..."
 iranian_focus.176.t: "방치된 이란"
 iranian_focus.176.d: "이란은 오랫동안 아무런 견제를 받지 않은 채 국가들을 무자비하게 정복해 왔습니다. 이제 우리와 몇몇 다른 국가가 이란 문제에 대해 조치를 취해야 할 때입니다. 군사 행동이 필요합니다."
 iranian_focus.176.a: "새벽에 타격한다"
 iranian_focus.176.b: "아니, 너무 위험하다"
 iranian_focus.177.t: "걸프 연합"
 iranian_focus.177.d: "이란의 지역 전쟁 행보에 이어, 지역 내 여러 국가가 이란을 '무력화'하기로 결정했습니다. 연합 대변인은 궁극적 목표가 평화이며, 이는 이란이 제압되고 무장해제되어야만 찾아온다고 주장합니다. 이란의 무장해제 이상의 거대한 계획이 있는지는 알려지지 않았지만, 현재 알려진 것은 앞으로 몇 달간 이란이 처리해야 할 일이 많아지리라는 점입니다."
 iranian_focus.177.a: "흥미롭군"
 iranian_focus.178.t: "자유주의 기관들과 사법부의 충돌"
 iranian_focus.178.d: "최근 보수 세력이 여러 활동가 단체, 개혁 성향 신문, 학생 단체와 충돌하기 시작했습니다. 이 충돌은 우연이 아니라 하타미 행정부와 그의 자유주의 개혁 아래 지난 몇 년간 쌓여 온 결과입니다. 어느 쪽이든 IRGC와 보수 진영은 이 기관들을 폐쇄시키려 하고 있습니다."
 iranian_focus.178.a: "보수 편에 선다"
 iranian_focus.178.b: "자유주의 편에 선다"
 iranian_focus.179.t: "사이드 하자리안 피격!"
 iranian_focus.179.d: "저명한 민주화 운동가이자 전직 정보 장교인 사이드 하자리안의 목숨을 노린 시도가 있었습니다. 그는 정체불명의 괴한에게 얼굴에 총을 맞았으며 현재 위독한 상태입니다. 이번 총격은 그가 이란 내 여러 반체제 인사 연쇄 살해 사건을 밝혀낸 활동과 이란 개혁 운동의 성장에 기여한 중요한 도움에 대한 보복으로 여겨집니다."
 iranian_focus.179.a: "조사에 착수한다"
 iranian_focus.179.b: "우리 문제가 아니다"
 iranian_focus.180.t: "하타미의 민영화 노력"
 iranian_focus.180.d: "하타미가 당선된 지 거의 4년이 지났으며, 이란 경제의 대규모 부문을 민영화하려는 그의 노력은 주목받지 않을 수 없었습니다. 그 효과에는 긍정적인 면과 이점도 있었지만, 장기적으로는 이러한 노력이 국민 전반에 해가 될 수 있다고 우려하는 이들도 있습니다. 그의 결정 일부를 되돌려야 한다는 목소리가 커지고 있습니다."
 iranian_focus.180.a: "몇 가지는 되돌린다"
 iranian_focus.180.b: "정치에 손댈 수는 없다"
 iranian_focus.181.t: "IRGC와 아르테시의 이해 충돌"
 iranian_focus.181.d: "최근의 기술 개선으로 인해 IRGC와 아르테시가 어느 쪽이 어떤 장비를 먼저 받아야 하는지를 두고 충돌했습니다. 신형 무기와 장비의 우선권은 오랫동안 IRGC에 있었지만, 아르테시의 압박이 커지고 있어 재고해야 할 수도 있습니다."
 iranian_focus.181.a: "IRGC 편에 선다"
 iranian_focus.181.b: "아르테시 편에 선다"
 iranian_focus.182.t: "농업 탈세를 단속하는 경제 경찰"
 iranian_focus.182.d: "경제 경찰이 농촌 지역에서 일하며 세금 납부를 회피하는 이들을 겨냥한 캠페인을 시작했습니다. 이러한 조치로 가장 큰 영향을 받는 이들은 농민이라고 하며, 그 결과 농민의 생산성을 위협하게 됩니다. 하지만 우리는 캠페인을 중단하여 농민들이 지금보다 더 필요한 존재라고 느끼게 할 수도 있습니다."
 iranian_focus.182.a: "캠페인을 중단한다"
 iranian_focus.182.b: "돈을 내는 편이 좋을 것이다"
 iranian_focus.183.t: "파르시안 은행 설립"
 iranian_focus.183.d: "파르시안 은행이 최근 설립되어 테헤란 증권거래소에 상장했습니다. 이 은행이 성장하면서 국내 최대의 비정부 소유 은행이 될 것으로 전망되어, 많은 이들이 그 운영 방향을 정부가 정해야 한다고 요구하고 있습니다."
 iranian_focus.183.a: "국가 부채에 집중한다"
 iranian_focus.183.b: "세금 징수에 집중한다"
 iranian_focus.184.t: "헬만드의 움직임"
 iranian_focus.184.d: "우리 농민들은 헬만드강에서 흘러오는 물이 절실히 필요한데, 저 빌어먹을 이란인들은 그 강의 모든 자원을 계속 독차지하고 있습니다. 이제 강과 그 배분에 대해 조치를 취해야 할 때입니다."
 iranian_focus.184.a: "자볼로 작전을 개시한다"
 iranian_focus.184.b: "내버려 두자, 더 이상의 전쟁은 감수할 수 없다"
 iranian_focus.185.t: "헬만드강을 건넌 탈레반군"
 iranian_focus.185.d: "자볼과 그 주변 지역에 배치된 여러 병사가 헬만드강을 건넌 탈레반군의 공격을 받았습니다. 탈레반은 헬만드 전역을 통제하려는 시도로 공격을 시작했으며, 이는 우리 발루치스탄 농민들에게 절실히 필요한 곳입니다. 우리는 보복해야 합니다!"
 iranian_focus.185.a: "교훈을 가르쳐 주겠다"
 iranian_focus.186.t: "헬만드에서의 탈레반 승리"
 iranian_focus.186.d: "탈레반군이 국경 지역에서 이란군 여러 부대를 제압했습니다. 그 결과 헬만드로 흐르는 물이 차단되었습니다."
 iranian_focus.186.a: "알겠다"
 iranian_focus.187.t: "헬만드에서의 이란 승리"
 iranian_focus.187.d: "이란군 여러 부대가 탈레반군을 국경 너머로 격퇴했으며, 헬만드 일대의 여러 요충지를 확보하여 발루치스탄으로 더 많은 물이 흘러들 수 있게 되었습니다."
 iranian_focus.187.a: "알겠다"
 iranian_focus.188.t: "이란과 탈레반 사이의 휴전 성립"
 iranian_focus.188.d: "이란과 탈레반군의 중재로 휴전 협정이 체결되었으며, 양측은 모든 공격을 중단하고 각자의 국경 쪽으로 복귀하기로 합의했습니다."
 iranian_focus.188.a: "알겠다"
 iranian_focus.191.t: "자유주의 언론을 공격하는 하메네이 아야톨라"
 iranian_focus.191.d: "하메네이 아야톨라의 지시에 따라 16곳이 넘는 언론사가 심한 검열을 받거나 아예 금지되었습니다. 이번 자유주의 언론에 대한 일련의 공격은 아야톨라가 이들 언론사가 출판물에서 이슬람 원칙을 훼손하고 모욕했다고 비난한 뒤에 벌어졌습니다. 마샬라 샴솔바에진은 자신의 언론사를 위한 항소 시도가 실패하여, 1999년 개혁파 학생 봉기를 지지하며 발표한 기사로 징역 30개월을 선고받았습니다."
 iranian_focus.191.a: "공격을 계속한다"
 iranian_focus.191.b: "일부 금지 조치를 철회한다"
 iranian_focus.192.t: "알보르즈산맥에 추락한 파라즈 케슘 항공 Yak-40"
 iranian_focus.192.d: "아르메니아가 임대하고 파라즈 케슘 항공이 운항하던 Yak-40이 알보르즈산맥의 산림 지대에 추락했습니다. 기내에는 교통부 장관, 기타 부처 직원, 의원 여섯 명이 탑승하고 있었습니다. 이 항공기는 고르간 공항 개항식을 위해 고르간으로 향하던 중이었습니다. 비행 중 항공기가 낙뢰를 맞아 항법 시스템에 영향을 받았으며, 이것이 추락의 원인이 되었을 가능성이 있다고 합니다. 이번 추락의 영향은 결국 미미하겠지만, 그래도 우리의 교통 로드맵에는 영향을 미칠 것입니다."
 iranian_focus.192.a: "애도할 시간이 없다. 사망자를 대신할 유능한 후임자를 찾아라"
 iranian_focus.192.b: "참으로 참담하다"
 iranian_focus.193.t: "알리레자 아스가리 망명!"
 iranian_focus.193.d: "최근 IRGC 고위 관료들의 회의에서 알리레자 아스가리의 두드러진 부재가 지적되었습니다. 철저한 조사 결과, 알리레자 아스가리가 지난 수개월간 어떠한 회의나 청문회에도 참석하지 않았으며 하급 지휘관이 그를 대신해 부대를 지휘해 왔음이 밝혀졌습니다. 현재 그가 서방으로 망명했으며 중요한 정보가 위험에 처했을 것으로 추측되고 있습니다."
 iranian_focus.193.a: "그 개자식"
 iranian_focus.194.t: "생사불문... 사실은 사망뿐"
 iranian_focus.194.d: "서리가 내리기 시작하는 사막의 아침은 죽은 듯이 고요하다. 이란 출신 지원병이자 이란-이라크 전쟁의 참전 용사인 오미드는 옛 바트당 초소의 녹슨 잔해 아래 금이 간 의자에 앉아 있다. 소총은 무릎 위에 놓여 있고, 헬멧은 왼쪽 땅바닥에 놓여 있다. 초소 위로 산들바람이 지나가고 아지랑이가 오미드의 시야를 흐린다. 저 멀리서 그림자가 재빨리 움직인다. \n\n오미드는 소총을 움켜쥐고 가슴에 바싹 끌어안는다. 두려움이 혈관을 타고 치솟는다. 그가 먼 곳을 향해 외친다. \\"모습을 드러내라!\\" 그는 일어서서 무기를 들어 올리고, 가늠자에 낀 먼지 너머로 눈을 부릅뜬다. 다시 외친다. \\"모습을 드러내라!\\" 그는 이를 악물고 숨을 쉬며 소총을 고정한다. \n\n안개 속에서 하나가 아닌 세 개의 형체가 나타난다. 그들은 빠르게 움직인다. 너무 빠르게.\n\n오미드는 다시 외친다. \\"이라크 침략자들이다!\\" 그러나 너무 늦었다. 총구의 섬광이 불길로 번졌다.\n\n 그의 곁에서 어린 지역 민병대 소년이 날아드는 총탄을 피해 몸을 숨긴다. 마지막 탄창이 약실에 들어가는 순간 모든 것이 암흑으로 변한다."
 iranian_focus.194.a: "이 땅이 우리 모두를 묻을 것이다."
 iranian_focus.195.t: "다마스쿠스 도착"
 iranian_focus.195.d: "검은색 호드로 세단 차량 행렬이 다마스쿠스 거리를 달린다. 안에는 테헤란에서 직접 파견된 이란 고위 외교관들이 타고 있다. 이들의 임무는 시리아 최고위 관료들과의 면담이다. 이란인들이 인민궁전 안뜰에서 차량 밖으로 내려서자 시리아 측 주인들과 짧게 고개를 끄덕여 인사를 주고받는다. 말은 오가지 않는다. 키 큰 보좌관이 커다란 나무 문을 연다. 외교관들이 안으로 사라지고 문이 닫힌다."
 iranian_focus.195.a: "대화할 때"
 iranian_focus.1000.t: "테헤란 국제 상설 박람회장 확장"
 iranian_focus.1000.d: "테헤란 국제 상설 박람회장은 1959년 완공된 이래 우리나라의 가장 저명한 기업들이 국가의 기술력을 과시하는 장이 되어 왔습니다. 수년간 여러 차례 확장되었으며, 최근 계획된 확장에서는 국가관(Nations Hall)이라고도 불리는 5호관의 건설이 포함되어 우리나라의 필요에 맞는 전시 공간을 마련할 특별한 기회가 생겼습니다. 여러 선택지가 제기되었으나, 결국 대규모 산업 전시, 군사 프로젝트, 과학적 성과를 위한 전시 공간에는 기둥이 없어야 한다는 점이 관건입니다. 이제 남은 문제는 이 전시관을 세 분야 중 어느 쪽을 위해 설계할 것인가입니다."
 iranian_focus.1000.o1: "우리의 산업 발전을 전시하라!"
 iranian_focus.1000.o2: "우리의 군사적 발전을 전시하라!"
 iranian_focus.1000.o3: "우리의 과학적 성과를 전시하라!"
 iranian_focus.1.t: "해외에 투자하는 IRGC 연계 정치인들"
 iranian_focus.1.d: "IRGC 계열 기업들에 대한 국가 경매에 이어, 금융 자산을 잃은 많은 이들이 더 안전한 다른 곳에 자산을 예치하려 하기 시작했습니다. 그러나 우리 정부는 이 계획을 눈치챘으며, 이에 대응할 적절한 조치를 취할 수도, 그러지 않을 수도 있습니다."
 iranian_focus.1.a: "투자하게 두자, 결국 우리가 이익을 거둘 것이다"
 iranian_focus.1.b: "그들의 시도를 중단시킨다"
 iranian_focus.2.t: "붉게 물든 검은 황금"
 iranian_focus.2.d: "조사 결과 부셰르에 위치한 유전의 상당 구역이 IRGC와 가깝거나 계열 관계에 있는 개인과 기업의 통제 아래 있음이 밝혀졌습니다. 이러한 조사 결과는 국가 내 정실주의를 단속하려는 우리의 현재 노력에 반하는 것이며, 따라서 이 유전들을 몰수할지 여부를 결정해야 합니다. 우리가 이 유전을 차지하지 않기로 선택한다면, 대신 이 유전에서 채굴한 모든 석유를 인접국의 에너지 기반시설에 사용하겠다고 약속할 수 있습니다."
 iranian_focus.2.a: "가치 있는 일에 사용한다"
 iranian_focus.2.b: "이 귀중한 자원의 주된 목적, 즉 돈을 잊어서는 안 된다"
 iranian_focus.3.t: "베이징 회의"
 iranian_focus.3.d: "바흐만 그룹이 보유 자산을 확장할 때가 되었습니다. 중국의 FAW 그룹과 제휴하면 이란에서 생산한 자동차를 세계 다른 지역으로 확대할 수 있을 것입니다. 그러나 회의에서 무엇을 할 것인지는 여전히 문제로 남아 있습니다. 우리가 회의를 주도할지, 아니면 뒤로 물러나 경청할지는 우리에게 달려 있습니다."
 iranian_focus.3.a: "이란의 설계안을 제시한다"
 iranian_focus.3.b: "중국의 설계안을 기다린다"
 iranian_focus.4.t: "대외 활동을 무기화하는 보냐드 조직"
 iranian_focus.4.d: "보냐드(자선 재단)가 국가 경제에 대해 가진 영향력을 최소화하려는 우리의 최근 시도에 대응하여, 소송을 즐기는 이 조직들은 보복하기로 결정했습니다. 마슈하드에서 아스탄 쿠즈 라자비 보냐드는 설교를 열어 중앙 정부를 비판하며 '명령을 내리는 자들이 가난한 이들과 우리의 성지를 등졌다... 그들은 자신들의 행동에 눈이 멀었다'고 주장했습니다. 그 결과 마슈하드와 곰 같은 도시에서 수백 명이 거리로 나와 반보냐드 개혁에 대한 불만을 표출했습니다."
 iranian_focus.4.a: "양보안을 제시한다"
 iranian_focus.4.b: "버틴다, 곧 시위에 지칠 것이다"
 iranian_focus.5.t: "법정에 출두한 바바크 잔자니"
 iranian_focus.5.d: "초췌하고 지친 모습으로 법정에 출두한 잔자니 씨는 질문을 던지는 기자와 앵커 무리 사이를 말없이 지나갔다. 그가 자리에 앉자 판사는 잔자니를 매우 엄중하게 응시했다. 바바크 잔자니는 '석유 대 금' 계획으로 27억 유로가 넘는 돈을 횡령한 혐의를 받고 있다. 이 계획은 국제 규제와 법을 우회하려던 것으로, 이란 국민의 희생 위에 그에게 막대한 이익을 안겨 주었다. 모두가 일어나 판결을 듣는 가운데 판사는 '잔자니 씨, 당신은 지상에서 부패를 퍼뜨린 죄로 기소되었습니다'라고 선언했다. 이 판결 소식이 정부에 전해졌고, 이제 우리는 그의 막대한 재산을 어떻게 처분할지 선택해야 합니다."
 iranian_focus.5.a: "전부 몰수한다"
 iranian_focus.5.b: "국민에게 재분배해야 한다"
 iranian_focus.6.t: "세금 개혁에 분노한 바자리들"
 iranian_focus.6.d: "테헤란, 타브리즈, 시라즈, 이스파한 등 대규모 바자르의 상인들이 점포 영업을 유지하려면 매년 세금 보고서를 제출해야 한다는 최근 정부 개혁에 대해 불만을 표명했습니다. 그 결과 이들은 정부의 압박에 대한 보복으로 잦은 파업을 벌이겠다고 다짐했습니다."
 iranian_focus.6.a: "양보안을 제시한다"
 iranian_focus.6.b: "그들과 파업 따위는 지옥에나 가라"
 iranian_focus.7.t: "대거 귀국하는 유학생들"
 iranian_focus.7.d: "해외 유학을 위해 이란을 떠났던 대학생 다수가 우리의 반콩쿠르 개혁 이후 귀국하기 시작했습니다. 간소화된 대학 입학 시험이 없다는 점이 충분히 많은 이들이 이란으로 돌아오도록 유인한 것으로 보입니다. 그러나 이들은 우리가 가장 필요로 할 때 우리를 떠났지만, 동시에 그들을 탓할 수 있겠습니까? 우리는 이들이 원래 치러야 했던 것과 같은 간소화된 입학 시험을 다시 치르지 않는 한 우리 대학 등록을 막을 수도 있고, 그냥 받아들여 원하는 어떤 대학이든 등록하게 할 수도 있습니다."
 iranian_focus.7.a: "돌아와도 좋지만 시험을 치러야 한다"
 iranian_focus.7.b: "두 팔 벌려 환영한다"
 iranian_focus.8.t: "음주에 대한 우리의 입장"
 iranian_focus.8.d: "알코올 음료의 소비와 제조에 관한 우리의 법은 여전히 1979년 이란의 강경한 혁명 원칙을 반영하고 있습니다. 그 이후 알코올의 소비와 제조는 급격히 늘어났으며, 대부분 사적으로 혹은 가족이나 친구들과의 모임에서 이루어집니다. 그 결과 우리 법 집행 기관은 이런 문제에서 법을 집행할 것인지 여부를 두고 혼란을 겪고 있습니다. 명확한 방침이 있다면 지난 수년간 막다른 길로 이어진 격렬한 논쟁을 끝내는 데 도움이 될 수 있습니다."
 iranian_focus.8.a: "이 부패한 소수를 사회에서 뿌리 뽑을 전담반을 승인한다"
 iranian_focus.8.b: "그들이 뭘 하든 누가 신경 쓰는가? 더 시급한 일이 있다"
 iranian_focus.9.t: "히잡 단속"
 iranian_focus.9.d: "수십 년간 우리는 사회 속 우리 자매들에게 단정한 복장을 지키도록 촉구해 왔습니다. 그러나 우리나라의 많은 여성이 단순히 이에 관심이 없으며, 그 결과 히잡을 정숙함의 상징이 아니라 패션 액세서리로 사용하고 있음이 분명해졌습니다. 대부분의 법 집행 기관은 이를 못 본 척하는데, 진정으로 단속한다면 교도소에 너무 큰 부담이 되기 때문입니다. 그래도 우리는 언제든 더 많은 공간을 마련할 수 있으며, 문제는 방법이 아니라 의지가 있는지 여부입니다."
 iranian_focus.9.a: "의지가 있으면 길이 있다"
 iranian_focus.9.b: "그들이 어떻게 가릴지 세부 사항을 논의할 시간이 없다"
 iranian_focus.10.t: "불법 석유 밀수 작전 적발"
 iranian_focus.10.d: "동부 시스탄 발루치스탄 주에서 석유를 실은 트럭 행렬이 우리 보안군에 의해 저지되었습니다. 석유 드럼통을 실은 트럭들은 파키스탄으로 향하던 중이었으며, 그곳 암시장에서 이란 국민의 희생 위에 이익을 챙기며 팔릴 것으로 예상됩니다. 이 작전을 운영하는 인물들을 아직 특정하려 하고 있으며, 일부는 우리 정부 내에 있는 것으로 의심되기도 합니다. 그러나 이 트럭들이 어디서 왔는지는 파악했으며, 호르무즈에서 온 것으로 밝혀졌습니다. 우리는 못 본 척할 수도 있고, 이러한 절도를 다시 막기 위해 호르무즈 유전 일대에 보안 경계선을 구축할 수도 있습니다."
 iranian_focus.10.a: "훔치는 자는 처벌받아야 한다!"
 iranian_focus.10.b: "더 시급한 일이 있다"
 iranian_focus.11.t: "오일 셰일 건류를 제안하는 이란"
 iranian_focus.11.d: "이란 정부는 우리나라의 방대한 오일 셰일 매장량에서 석유를 추출하겠다고 제안했습니다. 계약에 따르면 이란은 10년 동안 이 유전을 통제하게 되며, 계약이 만료되면 우리는 셰일 매장량에서 석유를 추출하는 데 사용된 자원과 장비로 인한 수익에 대한 통제권을 얻을 수 있습니다."
 iranian_focus.11.a: "훌륭한 생각이다"
 iranian_focus.11.b: "우리의 독립에 대한 이 위협을 거절한다"
 iranian_focus.12.t: "우리의 오일 셰일 제안을 수락한 [FROM.GetName]"
 iranian_focus.12.d: "[FROM.GetName]은(는) 우리의 최근 제안을 수락했으며, 암만에서의 석유 추출에 관한 새로운 계약에 서명했습니다."
 iranian_focus.12.a: "좋다"
 iranian_focus.13.t: "최근 제안을 거절한 [FROM.GetName]"
 iranian_focus.13.d: "[FROM.GetName]은(는) 암만에서의 석유 추출 계약에 관한 우리의 최근 제안을 거절했습니다."
 iranian_focus.13.a: "유감이다"
 iranian_focus.14.t: "우리의 선택지"
 iranian_focus.14.d: "이란과의 계약은 양국 모두에게 이익이 될 수 있는 많은 가능성을 버렸습니다. 마침내 목소리를 내고 더 유리한 조건을 요구할 때가 왔습니다."
 iranian_focus.14.a: "더 많은 석유가 필요하다"
 iranian_focus.14.b: "우리 석유를 더 일찍 받고 싶다"
 iranian_focus.15.t: "더 많은 석유를 요청하는 요르단"
 iranian_focus.15.d: "요르단 정부는 우리가 암만에서 더 많은 석유를 채굴해 줄 것을 요청했습니다. 나쁜 일은 아닐 수 있지만, 결국에는 우리에게 비용이 조금 더 들 것입니다."
 iranian_focus.15.a: "좋다, 하지만 1년이 더 필요하다"
 iranian_focus.15.b: "아니요"
 iranian_focus.16.t: "더 짧은 계약을 요청하는 요르단"
 iranian_focus.16.d: "요르단 정부는 우리가 추출한 석유를 이용할 수 있도록 계약을 더 일찍 종료해 줄 것을 요청하고 있습니다. 이는 분명 우리가 논의한 적이 없는 사안입니다."
 iranian_focus.16.a: "좋다, 하지만 보상이 필요하다"
 iranian_focus.16.b: "아니요"
 iranian_focus.17.t: "계약 종료"
 iranian_focus.17.d: "10년 전에 체결된 오일 셰일 계약이 종료됨에 따라, 이날 오후 이란인들은 암만에서 짐을 꾸려 테헤란으로 향하기 시작했습니다. 이제 요르단 당국이 수년간 이란 기업들이 채굴한 석유를 통제하고 있습니다."
 iranian_focus.17.a: "협력하던 좋은 시절이었다"
 iranian_focus.18.t: "계약을 일찍 파기한 요르단"
 iranian_focus.18.d: "요르단 정부는 우리에게 사전 경고도 없이 합의된 계약에서 빠지겠다는 어리석은 결정을 내렸습니다. 이는 명백한 계약 및 신뢰 위반이며, 우리는 결코 잊지 않을 것입니다!"
 iranian_focus.18.a: "용납할 수 없다"
 iranian_focus.18.b: "그냥 넘어가자"
 iranian_focus.19.t: "중앙아시아 대테러 지원을 제안하는 이란"
 iranian_focus.19.d: "이란 정부는 중앙아시아의 테러와 싸우기 위해 인력을 제공하겠다고 제안했습니다. 이 구상은 지역 전반의 안정을 높이는 한편, 이 지역에 주둔한 우리 병력도 마음을 놓을 수 있게 해 줄 것입니다."
 iranian_focus.19.a: "이 거래를 수락한다"
 iranian_focus.19.b: "끔찍한 제안이다"
 iranian_focus.20.t: "미국의 제안 수락"
 iranian_focus.20.d: "미국이 우리의 제안을 수락했으며, 내일부터 우리는 중앙아시아에 파견할 소규모 대응 병력을 동원할 것입니다. 미 육군은 우리 부대에 이 지역에 대한 정보를 제공하겠다고 제안했으며, 이는 이 지역 내 모든 문제를 신속히 파악하는 데 도움이 될 것입니다."
 iranian_focus.20.a: "좋다"
 iranian_focus.21.t: "우리 제안을 거절한 미국"
 iranian_focus.21.d: "미국은 중앙아시아의 테러 위협을 처리할 우리 군의 능력을 신뢰하지 않는다며 우리의 제안을 거절했습니다."
 iranian_focus.21.a: "유감이지만 우리가 뭘 기대했겠는가?"
 iranian_focus.22.t: "샤헤드-136 드론 3000기 판매를 제안하는 이란"
 iranian_focus.22.d: "이란 정부는 자국 무기고에서 자폭 드론 3000기를 우리에게 판매하겠다고 제안했으나, 이는 우리가 항공전에 관한 정보를 제공하고 소정의 수수료를 지불할 의무가 있는 계약에 서명하는 경우에 한합니다. 대량의 자폭 드론은 우리 군을 강화하는 데 필요한 바로 그것일 수 있으므로 신중히 고민해야 할 결정입니다."
 iranian_focus.22.a: "어디에 서명하면 되는가?"
 iranian_focus.22.b: "아니, 값싼 드론에는 별 관심이 없다"
 iranian_focus.23.t: "러시아의 수락"
 iranian_focus.23.d: "러시아 정부가 자폭 드론 3000기 판매를 허용하는 우리의 제안 계약에 서명하기로 합의했습니다. 계약에는 러시아가 우리에게 항공전에 관한 정보를 제공해야 한다고 명시되어 있으며, 이를 통해 우리 공군의 작전 완성도를 높일 수 있습니다."
 iranian_focus.23.a: "좋다"
 iranian_focus.24.t: "우리 제안을 거절한 러시아"
 iranian_focus.24.d: "러시아 정부가 우리의 계약 서명을 거부하여, 자폭 드론 3000기 판매 제안을 물리쳤습니다."
 iranian_focus.24.a: "유감이다"
 iranian_focus.25.t: "외국 공급처"
 iranian_focus.25.d: "우리는 일부 현대화 목표를 달성하는 길에 빠르게 접어들고 있습니다. 최근의 외국과의 군사 협력 노력에 이어, 아르테시 수뇌부는 더 확고한 공급처로부터 무기를 구하기 시작하는 것이 최선이라고 결정했습니다. 우리는 원자재를 찾는 것이 아니라, 우리 산업이 이러한 무기를 제조하고 조립하는 데 의존할 수 있도록 도와줄 기술을 찾을 것입니다."
 iranian_focus.25.a: "러시아 - 지상군 지원"
 iranian_focus.25.b: "미국 - 공군 지원"
 iranian_focus.25.c: "독일 - 기갑 부대 지원"
 iranian_focus.26.t: "군사 기술을 요청하는 이란"
 iranian_focus.26.d: "이란 정부는 자국의 기술 연구 프로그램을 지원해 달라고 요청하기 위해 우리 군에 대표단을 보냈습니다. 이들은 우리를 유능한 군대로 판단하여 다른 많은 국가 대신 우리를 택했습니다. 이란에 이처럼 정교한 기술에 대한 접근권을 줄지는 우리에게 달려 있지만, 특히 이란이 군대를 개편한다면 이란의 호의를 얻을 수 있을 것입니다."
 iranian_focus.26.a: "친구를 돕는 것은 해가 되지 않는다"
 iranian_focus.26.b: "절대 안 된다"
 iranian_focus.27.t: "군사 정보 공유에 동의한 [FROM.GetName]!"
 iranian_focus.27.d: "[FROM.GetAdjective] 정부는 우리 군에 군사 연구를 지원하기로 합의했습니다. 이는 우리 현대화 계획의 거대한 진전이며, 우리는 그들의 도움을 결코 잊지 않을 것입니다."
 iranian_focus.27.a: "좋다!"
 iranian_focus.28.t: "우리 요청을 거절한 [FROM.GetName]!"
 iranian_focus.28.d: "[FROM.GetAdjective] 정부는 우리가 군사 기밀을 지킬 수 있다고 신뢰할 수 없다며 우리의 요청을 거절했습니다."
 iranian_focus.28.a: "이 일을 잊지 않겠다"
 iranian_focus.29.t: "저명한 장교의 승진"
 iranian_focus.29.d: "과거 제국 이란군 장교였던 호샹 사마디는 아르테시의 명예로운 병사들을 이끌 능력이 있음을 입증했습니다. 사담 후세인이 침공했을 때 이라크로부터 국가를 방어한 사마디는 어떤 임무든 처리할 수 있음을 보여 주었습니다. 수뇌부 일각에서는 장군으로의 승진 가능성이 논의되고 있으나, 다른 일각에서는 1979년 혁명 당시 제국군의 입장을 옹호한 그의 최근 연설 때문에 주저하고 있습니다."
 iranian_focus.29.a: "승진은 충분히 마땅하다!"
 iranian_focus.29.b: "장교로 남는 편이 낫다"
 iranian_focus.30.t: "Su-30 구매를 희망하는 이란"
 iranian_focus.30.d: "이란 정부는 IRGC 항공우주군을 위한 Su-30 판매 가능성에 대해 문의했습니다. 이들은 이 판매가 서방의 추가 침략을 막는 데 도움이 되고 가까운 미래의 잠재적 침공을 억제할 가능성이 크다고 주장합니다. 우리의 최고 고문들 또한 초기 모델을 판매하는 편이 더 나은 선택이라고 제안하고 있습니다."
 iranian_focus.30.a: "판매를 승인한다"
 iranian_focus.30.b: "거래는 없다"
 iranian_focus.31.t: "판매를 승인한 러시아"
 iranian_focus.31.d: "러시아 정부는 우리 IRGC 항공우주군(NEHSA)을 위한 Su-30 40기의 판매를 승인했습니다. 이 항공기들은 확실히 우리의 늘어나는 무기고에 큰 보탬이 될 것이며, 우리의 적들이 다음 행보를 매우 신중하게 고려하도록 만들 것입니다."
 iranian_focus.31.a: "좋다"
 iranian_focus.32.t: "판매 승인을 거부한 러시아"
 iranian_focus.32.d: "러시아 정부는 Su-30 판매 승인을 거부했으며, 이는 우리 자신 외에는 누구도 의지할 수 없음을 입증합니다."
 iranian_focus.32.a: "실로 배신이다"
 iranian_focus.33.t: "과학과 이슬람"
 iranian_focus.33.d: "국가의 제2대 최고지도자인 세예드 알리 하메네이는 파트와를 통해 줄기세포 연구가 이슬람 하에서 허용된다고 선언했습니다. 이 파트와는 줄기세포 연구 이상의 훨씬 더 많은 기회의 문을 열어 우리가 대안적인 분야를 탐구할 수 있게 해 주었습니다. 그 결과 정부는 우리 과학자들이 연구 프로젝트에 사용할 예산을 승인했습니다."
 iranian_focus.33.a: "말씀하신 대로 하자"
 iranian_focus.33.b: "건설 연구에도 손을 대 볼 수 있을 것이다"
 iranian_focus.33.c: "그 돈을 국민에게 쓰면 어떨까?"
 iranian_focus.34.t: "다가오는 순찰"
 iranian_focus.34.d: "루다바는 작은 방의 탁한 불빛 아래 베틀 앞에 앉아 있었다. 실을 규칙적으로 당기는 일은 그녀의 삶에서 행복한 상수였다. 손가락은 수월하게 움직였지만 마음은 다른 곳에 가 있었다. 멀리 길란의 산맥 너머, 수도에서 경찰이 평소보다 훨씬 많이 배치되었다는 소문이 들려왔다. 루다바의 삼촌 헤이다르가 입구에 서 있었다. \n\n저들이 또 우리를 감시하고 있어, 알겠니?\n\n 헤이다르는 낡은 재킷 주머니에 손을 찔러 넣고 문틀에 기댄 채 낮은 목소리로 말했다. 담배 연기가 의식이 있는 얼룩처럼 그에게 달라붙어 있었다. \n\n 너도 느끼고 있지? 경찰이 요즘 순찰을 더 많이 도는 것 말이야. 마을을 돌아다니는 모습이 뭔가를, 혹은 누군가를 찾는 것 같아. 어떤 구실이든 기다리고 있는 거야. \n\n 루다바는 삼촌이 늘 그렇듯 의심이 많다며 대수롭지 않게 넘겼고, 자신의 말로 자신과 헤이다르를 납득시켰다. 그녀가 대답했다.\n\n 어쩌면 삼촌을 노리는 걸지도 몰라요. 직접 물어는 봤어요? \n\n헤이다르가 날카롭고 비꼬듯 대답했다. \n\n우리는 바시즈와는 거래하지 않는다는 거 알잖아,\n\n 그러고는 돌아서서 입구를 떠났다."
 iranian_focus.34.a: "말할 필요도 없다"
 iranian_focus.35.t: "바시즈의 선거 활동"
 iranian_focus.35.d: "우리는 법적으로 투표 자격이 있는 바시즈 병력에게 우리의 요구대로 행동하도록 요청했습니다. 우리는 표심을 특정 후보 쪽으로 움직여 우리가 선호하는 후보가 대통령직에 당선될 가능성을 높일 수 있습니다."
 iranian_focus.35.a: "표심을 개혁파 쪽으로 움직인다"
 iranian_focus.35.b: "표심을 원칙주의자 쪽으로 움직인다"
 iranian_focus.36.t: "아야톨라의 지지 표명"
 iranian_focus.36.d: "오늘 우리는 최고지도자실에서의 공개 방송을 준비할 것입니다. 그곳에서 그는 대선 후보 한 명을 공개적으로 지지하며 그를 옹호하는 발언을 할 것입니다. 누구를 지지할지는 아직 정해지지 않았지만 우리는 대략 짐작하고 있습니다."
 iranian_focus.36.a: "개혁파"
 iranian_focus.36.b: "원칙주의자"
 iranian_focus.37.t: "일부 충성 야당 단체의 마즐리스 참여"
 iranian_focus.37.d: "최근 몇 년간 국내 정치 분위기가 달아오르고 있습니다. 적어도 마즐리스에서의 선거 개혁을 요구하는 목소리는 하루가 갈수록 높아지고 있습니다. 우리는 누가 마즐리스에 참여할 수 있는지에 대한 수호자 위원회의 통제를 제한하는 법을 통과시킬 기회를 맞았으며, 이를 통해 평소 출마가 금지되던 충성 야당들이 참여할 수 있게 됩니다. 이러한 변화는 원칙주의자들 사이에서는 극도로 인기가 없지만 많은 개혁파가 지지하고 있습니다."
 iranian_focus.37.a: "출마를 허용한다, 위협이 되지는 않는다"
 iranian_focus.37.b: "절대 안 된다"
 iranian_focus.38.t: "학생 반대 단체"
 iranian_focus.38.d: "우리 학교, 특히 대학의 많은 곳에서 학생 반대 단체들이 반국가 활동으로 우리 정부를 곤란하게 만들고 있습니다. 대개 학교 시설에 어느 정도 피해를 입히고 언론의 가벼운 주목을 받는 정도에 그치지만, 이 학생들은 이슬람 공화국의 명성에 해를 끼치는 것 외에는 아무것도 하지 않습니다. 우리는 대학 캠퍼스 경찰에 상당한 자금을 투입하고 있지만, 어느 시점에는 보다 영구적인 해결책이 필요합니다."
 iranian_focus.38.a: "자신의 권리를 자유롭게 행사하게 둔다"
 iranian_focus.38.b: "이 단체들에 대한 압박을 강화한다"
 iranian_focus.39.t: "이란 정치의 새로운 시대"
 iranian_focus.39.d: "[PER_president_name_loc] 대통령이 그의 곁에 무릎을 꿇은 가운데, 하메네이는 수많은 지지자, 장군, 정부 관료들을 향해 연설했습니다.\n\n'오늘... 오늘부터 악의 세력은 더 이상 우리 국가를 농락할 수 없다. 분열은 끝나야 하며, 분열은 여기서 끝날 것이다' 하고 최고지도자는 선언했습니다.\n\n그런 다음 [PER_president_name_loc]은(는) 작은 연단으로 걸어가 무언가에 서명하라는 신호를 받았습니다. 잠시 후 그는 마지못해 그것을 들어 군중에게 보였습니다. 그것은 그의 공식 사임서였습니다. 무슨 일이 벌어지는지 깨달은 군중 모두가 주먹을 치켜들고 '알라후 아크바르, 하메네이 라흐바르', 즉 '신은 가장 위대하시며 하메네이는 지도자이시다'라고 외쳤습니다. 이어서 마즐리스는 해산되었고, 국회의장은 이 조치에 항의했으나 곧 체포되었습니다. 정부는 보안군을 배치했으며 개혁 운동 세력의 저항을 예상하고 있습니다."
 iranian_focus.39.a: "오래전에 이뤘어야 할 일이 이제 완수되었다"
 iranian_focus.391.t: "이슬람 공화국의 종말"
 iranian_focus.391.d: "오늘 일찍 최고지도자는 최고지도자실에서 공개 방송을 준비했습니다. 아르테시 장군들, IRGC, 시아파 성직자, 이란의 대리 세력 지도자들 등 많은 이들이 참석했습니다. 이 행사에서 최고지도자 [PER.GetLeader]은(는) 대통령에게 공식 사임서에 서명하도록 했으며, 이는 이슬람 공화국의 대통령직 폐지를 의미합니다. 나아가 최고지도자는 이란의 공식 의회인 마즐리스의 해산을 발표했습니다. 국회의장은 즉시 반대 의사를 표명했고 그 결과 체포되었습니다. 이 조치는 야당과 개혁 운동 세력의 분노를 샀으며, 그 결과 최고지도자는 보안군에 자신의 앞길을 막는 모든 이를 체포하거나 무력화하라고 명령했습니다. 인터넷은 차단되었고, 모든 정당은 해산 및 금지될 예정이며, IRGC는 국가 안보에 대한 전권을 부여받았습니다."
 iranian_focus.391.a: "이란이 다음 북한인가?"
 iranian_focus.40.t: "정부를 급습한 IRGC"
 iranian_focus.40.d: "이슬람 혁명수비대는 병력을 테헤란에 진입시켜 모든 정부 행정의 특정 계층에 대한 통제권을 요구하고 있습니다. 도시에 주둔한 대부분의 군이 그들의 대의로 갈라져 넘어가면서, 우리의 선택지는 극도로 제한적이라고 해도 과언이 아닙니다"
 iranian_focus.40.a: "그렇게 순환이 시작된다"
 iranian_focus.41.t: "관계 정상화를 모색하는 이란"
 iranian_focus.41.d: "이란 정부는 이슬람 혁명 이후 처음으로 우리나라와의 관계 정상화를 모색하고 있습니다. 이는 뜻밖의 전개이지만, 우리가 상상조차 못 했던 일은 아닙니다. 이란은 모든 적대감을 뒤로하고 상호 투자와 협정의 여정에 나서기를 원하며, 정상화 시도를 수락하기로 한다면 우리도 이에 동의하게 될 것입니다."
 iranian_focus.41.a: "여기서 좋은 점을 찾을 수 없다"
 iranian_focus.41.b: "관계를 정상화해야 한다"
 iranian_focus.42.t: "우리나라와의 관계 정상화를 거절한 [FROM.GetName]"
 iranian_focus.42.d: "[SAU.GetName] 정부는 신뢰할 수 없다는 점 외에 공식적인 이유를 대지 않은 채 우리나라와의 관계 정상화를 거절했습니다. 친구라면 서로를 이렇게 대하지 않을 것이며, 따라서 우리는 [SAU.GetAdjective]을(를) 적으로 간주할 수밖에 없습니다."
 iranian_focus.42.a: "이런 결과를 바라지 않았다"
 iranian_focus.43.t: "우리나라와의 관계 정상화에 동의한 [SAU.GetName]"
 iranian_focus.43.d: "[SAU.GetName] 정부는 우리나라와의 관계 정상화에 동의했으며 대사관 건설을 준비하기 시작했습니다. 우리는 더 이상 무의미한 경쟁으로 갈라지지 않을 것이므로, 우리의 새로운 동반자 관계는 전 세계를 떨게 할 것입니다."
 iranian_focus.43.a: "좋다!"
 iranian_focus.44.t: "안보 조약을 제안하는 이란"
 iranian_focus.44.d: "이란 정부는 양국 정부 간의 모든 형태의 적대 행위를 공식적으로 종결하는 불가침 조약 가능성에 대한 구상을 내놓았습니다. 그러나 이란을 신뢰할 수 있을까요? 우리 정부의 미래와 외교 정책이 여기에 달려 있으므로 매우 신중하게 생각해야 할 문제입니다."
 iranian_focus.44.a: "끔찍한 생각이다"
 iranian_focus.44.b: "훌륭한 생각이다"
 iranian_focus.45.t: "우리 제안을 거절한 [SAU.GetName]"
 iranian_focus.45.d: "[SAU.GetName] 정부는 우리의 제안을 즉각 거절했으며, 오히려 안보 조약에 관한 어떤 형태의 서면 합의도 [SAU.GetAdjective]의 이익을 위태롭게 할 것이라고 밝혔습니다."
 iranian_focus.45.a: "이 일을 잊지 않겠다"
 iranian_focus.46.t: "우리 제안에 동의한 [SAU.GetName]"
 iranian_focus.46.d: "[SAU.GetName] 정부는 우리의 제안에 동의했으며, 오히려 적대 행위를 철폐하고 포기하는 양국 정부 간의 서면 합의에 큰 열의를 보였습니다."
 iranian_focus.46.a: "좋다"
 iranian_focus.47.t: "상호 보장 조약을 제안하는 이란"
 iranian_focus.47.d: "이란 정부는 공식화된 안보 조약을 통해 서로의 주권적 독립을 보장하자고 제안했으며, 이에 따라 [PER.capital.GetCapitalVictoryPointName]과(와) [SAU.capital.GetCapitalVictoryPointName]이(가) 공식적으로 군사적 유대를 맺게 됩니다."
 iranian_focus.47.a: "이보다 나쁜 생각을 할 수 있을까?"
 iranian_focus.47.b: "훌륭한 생각이다"
 iranian_focus.48.t: "[SAU.GetName]의 거절"
 iranian_focus.48.d: "어떤 이유에서인지 [SAU.GetName] 정부는 양국 정부 모두에 이익이 될 수 있는 상호 방위 조약 제안을 거절하기로 결정했습니다. 이 조치는 자국을 포함한 많은 걸프 국가의 안보를 위태롭게 할 수 있습니다."
 iranian_focus.48.a: "그들의 손해다"
 iranian_focus.49.t: "[SAU.GetName]의 수락"
 iranian_focus.49.d: "[SAU.GetAdjective]은(는) 어느 한쪽에 무슨 일이 생기면 다른 쪽을 도우러 와야 하는 우리의 공식 방위 조약에 서명하기로 합의했습니다."
 iranian_focus.49.a: "좋다"
 iranian_focus.50.t: "레오파르트 전차 구매를 요청하는 이란"
 iranian_focus.50.d: "[PER.GetName]은(는) 레오파르트 전차 100대를 약 350억 달러에 판매해 달라고 요청했습니다. 우리는 이를 수락할 수도, 이 요청을 거절할 수도 있습니다."
 iranian_focus.50.a: "판매를 승인한다"
 iranian_focus.50.b: "그들에게 팔 수 없다"
 iranian_focus.51.t: "무기 구매를 수락한 [FROM.GetName]"
 iranian_focus.51.d: "[FROM.GetName]은(는) 무기를 구매하겠다는 우리의 요청을 수락했으며, 곧 새로운 무기 선적분이 도착할 것입니다."
 iranian_focus.51.a: "좋다"
 iranian_focus.52.t: "무기 구매를 거절한 [FROM.GetName]"
 iranian_focus.52.d: "[FROM.GetName]은(는) 우리가 파괴를 위해 사용할 것을 우려해서든, 단지 가진 무기가 없어서든 우리에게 무기를 판매하지 않기로 결정했습니다."
 iranian_focus.52.a: "알겠다"
 iranian_focus.53.t: "우리나라의 라팔 C 구매를 요청하는 이란"
 iranian_focus.53.d: "우리는 이번 주 초에 매우 이상한 요청을 받았습니다. 이란 외교관들이 전화를 걸어 어떤 이유에서인지 우리 전투기를 구매하는 데 관심을 보였으며, 상당한 금액을 지불할 용의가 있다고 합니다."
 iranian_focus.53.a: "구매를 승인한다"
 iranian_focus.53.b: "아니요"
 iranian_focus.54.t: "CENTO 가입을 초청하는 이란"
 iranian_focus.54.d: "이란은 오늘 우리의 CENTO 가입 조건을 협상하기 위해 [ROOT.capital.GetCapitalVictoryPointName]에 대표단을 보냈습니다. 이들은 이 방위 동맹이 외부 세력의 추가 침략을 억제하기 위한 것이라 밝히며, 지역 내 절대적인 안보 벨트를 구축한다는 궁극적 목표를 향해 나아가고 있다고 말합니다."
 iranian_focus.54.a: "이 제안을 수락해야 한다"
 iranian_focus.54.b: "우리의 독립에 대한 이 위협을 거절한다!"
 iranian_focus.55.t: "CENTO 초청을 수락한 [FROM.GetName]"
 iranian_focus.55.d: "[FROM.GetName]은(는) CENTO 가입을 수락했으며 이미 여러 방위 협정에 서명했습니다. CENTO 정회원으로서의 가입은 이미 훌륭한 우정이 더욱 강화됨을 의미합니다!"
 iranian_focus.55.a: "환영한다, [FROM.GetName]"
 iranian_focus.56.t: "CENTO 가입을 거절한 [FROM.GetName]"
 iranian_focus.56.d: "[FROM.GetName]은(는) 며칠 전 우리가 보낸 초청을 수락하기를 거절했습니다. 이들은 동맹 가입이 자국의 최선의 이익에 부합하지 않으며 그렇게 하면 자국의 주권과 독립을 침해할 수 있다고 밝혔습니다."
 iranian_focus.56.a: "알겠다"
 iranian_focus.57.t: "CENTO에 가입한 [FROM.GetName]"
 iranian_focus.57.d: "[FROM.GetName]은(는) 이번 주 초에 보낸 CENTO 동맹 초청을 공식적으로 수락했습니다. 이란이 동맹을 재편했을 때 인접국들의 주목이나 관심을 거의 끌지 못했다는 점에서, 이는 새로 재편된 동맹에 또 하나의 이정표가 됩니다. [FROM.GetName]이(가) 정식 회원이 됨에 따라 동맹은 계속 영향력을 확대할 수 있을 것입니다."
 iranian_focus.57.a: "세력 블록은 계속 성장한다"
 iranian_focus.58.t: "남아제르바이잔의 반란"
 iranian_focus.58.d: "남아제르바이잔 전역의 민병대가 이란 정부에 맞서 봉기하여 이 지역에 대한 통제권을 위협하고 있습니다. 이 운동의 주된 후원자는 알려져 있지 않으나, 이란 정부는 북쪽의 누군가, 특히 아제르바이잔, 튀르키예 또는 러시아일 것으로 의심하고 있습니다."
 iranian_focus.58.a: "우리는 남아제르바이잔과 함께한다!"
 iranian_focus.58.b: "우리는 이란과 함께한다!"
 iranian_focus.58.c: "이 배신자들은 지옥에나 가라!"
 iranian_focus.59.t: "남아제르바이잔의 반란"
 iranian_focus.59.d: "발루치스탄 전역의 민병대가 이란 정부에 맞서 봉기하여 이 지역에 대한 통제권을 위협하고 있습니다. 이 운동의 주된 후원자는 알려져 있지 않으나, 이란 정부는 남쪽의 누군가, 특히 [SAU.GetName] 또는 파키스탄일 것으로 의심하고 있습니다."
 iranian_focus.59.a: "우리는 발루치스탄과 함께한다!"
 iranian_focus.59.b: "우리는 이란과 함께한다!"
 iranian_focus.59.c: "이 배신자들은 지옥에나 가라!"
 iranian_focus.60.t: "쿠르디스탄의 반란"
 iranian_focus.60.d: "쿠르디스탄 전역의 민병대가 이란 정부에 맞서 봉기하여 이 지역에 대한 통제권을 위협하고 있습니다. 이 운동의 주된 후원자는 알려져 있지 않으나, 이란 정부는 서쪽의 누군가, 특히 [USA.GetName] 또는 이스라엘일 것으로 의심하고 있습니다."
 iranian_focus.60.a: "우리는 쿠르디스탄과 함께한다!"
 iranian_focus.60.b: "우리는 이란과 함께한다!"
 iranian_focus.60.c: "이 배신자들은 지옥에나 가라!"
 iranian_focus.61.t: "함선 판매를 요청하는 [PER.GetName]"
 iranian_focus.61.d: "이란은 상당히 많은 수의 함선 구매를 요청하고 있습니다. 요청에는 항공모함 1척, 구축함 2척, 순양함 1척이 포함됩니다. 민주주의 국가이긴 하나 이란의 미래는 아직 정해지지 않았으며, 우리는 그들에게 무엇을 주는지에 신중해야 합니다."
 iranian_focus.61.a: "진행한다"
 iranian_focus.61.b: "아니요"
 iranian_focus.62.t: "함선 판매를 승인한 [USA.GetName]"
 iranian_focus.62.d: "미국 대통령 [USA.GetLeader]은(는) 항공모함 1척, 구축함 2척, 순양함 1척의 판매를 승인했습니다. 우리 해군은 다른 어느 나라도 따라올 수 없을 만큼 걸프를 지배할 것입니다!"
 iranian_focus.62.a: "좋다!"
 iranian_focus.63.t: "함선 판매를 거절한 [USA.GetName]"
 iranian_focus.63.d: "미국 대통령 [USA.GetLeader]은(는) 우리가 보낸 제안을 거절했습니다."
 iranian_focus.63.a: "젠장"
 iranian_focus.64.t: "테헤란 주재 미국 대사관의 재개를 원하는 이란"
 iranian_focus.64.d: "이란 정부는 관계를 공식적으로 복원할 것을 요청했으며, 테헤란의 미국 대사관을 보수하여 복원하겠다고 제안했습니다. 그 대가로 우리도 같은 방식으로 워싱턴의 이란 대사관을 재개할 것입니다. 이란 지도부의 교체가 이러한 대화를 가능하게 했으며, 그 이전의 이슬람 공화국은 우리나라를 파괴하는 데 혈안이 되어 있었습니다."
 iranian_focus.64.a: "뜻밖이지만 환영할 만한 진전이다"
 iranian_focus.64.b: "이란, 우리는 당신들과 아무 관계도 맺고 싶지 않다"
 iranian_focus.65.t: "외교 관계 재수립에 동의한 미국"
 iranian_focus.65.d: "미국 정부는 우리 정부와의 관계를 재수립하는 데 동의했으며 워싱턴의 이란 대사관 재개 계획에 착수했습니다. 이 진전은 이슬람 혁명 이후 양국 관계에서 역사적인 최고점을 의미합니다."
 iranian_focus.65.a: "좋다"
 iranian_focus.66.t: "관계 정상화를 거부한 미국"
 iranian_focus.66.d: "미국은 우리나라와의 관계 정상화를 거부했으며, 오히려 우리나라에 존재하는 정치적 불안정을 '예측 불가능한 요인'으로 들었습니다."
 iranian_focus.66.a: "뭐라고?"
 iranian_focus.67.t: "시리아 반정부 세력에 청신호를 보낸 이란"
 iranian_focus.67.d: "이란 정부는 FSA 휘하에서 활동하는 여러 시리아 반정부 단체들이 전반적인 작전을 개시하는 것을 승인했습니다. 매우 느슨한 연합이긴 하나, 이란은 자국의 영향력과 폭넓은 외교를 활용해 여러 단체를 무장시키고 [SYR.GetLeader]을(를) 타도한다는 단 하나의 목표를 위해 함께 일하도록 하고 있습니다. 일부는 이것이 불필요한 유혈과 파괴를 초래할 수 있다고 우려하지만, [PER.GetLeader]은(는) 이러한 조치가 '강한 동기를 가진 자유 투사 집단이 할 수 있는 것보다 훨씬 더 파괴적인' 향후의 돌발 사태를 막기 위해 취해지고 있다고 공개적으로 발표했습니다."
 iranian_focus.67.a: "흥미롭군"
 iranian_focus.67.b: "[PER.capital.GetCapitalVictoryPointName]의 어릿광대들은 자기들이 무슨 짓을 하는지 전혀 모른다!"
 iranian_focus.68.t: "시리아 분쟁의 종결"
 iranian_focus.68.d: "시리아 내전이 우리에게 유리하게 종결되었습니다. FSA가 시리아 정부를 성공적으로 전복했으며 권력 공고화에 착수했습니다. 시리아에 있는 우리의 최고위 고문과 군 관계자들 역시 명령을 내리고 그들 정부를 지휘하기 시작했으며, 이로써 시리아는 사실상 우리의 종속국이 되었습니다."
 iranian_focus.68.a: "승리는 감행하는 자의 몫이다"
 iranian_focus.69.t: "시리아에서의 지원을 요청하는 이란"
 iranian_focus.69.d: "이란 정부는 [SYR.GetLeader] 정부를 전복하려는 FSA의 노력을 지원하기 위해 개입 병력을 파견해 달라고 요청했습니다. 이란을 지원할지는 우리에게 달려 있지만, CENTO 회원국으로서 우리는 동맹국 곁에 서야 합니다."
 iranian_focus.69.a: "[SYR.capital.GetCapitalVictoryPointName]을(를) 향해 함께 진군하자!"
 iranian_focus.69.b: "더 시급한 일이 있다"
 iranian_focus.70.t: "[FSA.GetName] 지원을 위한 개입 병력을 동원하는 CENTO"
 iranian_focus.70.d: "이번 주 [PER.capital.GetCapitalVictoryPointName]에서 CENTO 총회가 열렸으며, 동맹은 [FSA.GetName]을(를) 대신하여 개입 병력을 동원하기로 합의했습니다. 이 개입 병력은 반란이 성공하도록 돕고 [SYR.GetLeader] 정부를 전복하기 위한 것입니다. 이번 회의에서 논의된 내용은 시리아 문제 이상의 것이었기에 전 세계 지도자들은 복잡한 심경을 드러냈습니다. 그러나 CENTO가 실제로 약속을 이행할지 아무도 알 수 없으므로 행동은 지켜봐야 합니다."
 iranian_focus.70.a: "흥미롭군"
 iranian_focus.70.b: "어리석은 자들!"
 iranian_focus.71.t: "헤즈볼라 축출을 제안하는 이란"
 iranian_focus.71.d: "이란 정부는 최근 우리에게 헤즈볼라에 대한 공동 타격에 협력할 것을 제안했습니다. 이란에 따르면 헤즈볼라 지도부는 지역의 안정과 우리나라에 큰 위협이 됩니다. [PER.capital.GetCapitalVictoryPointName]을(를) 이 임무에서 도울지는 우리에게 달려 있지만, 이 작전으로 영토적 이익을 약속받았습니다."
 iranian_focus.71.a: "레바논에서 저 헤즈볼라 쓰레기들을 쓸어내자!"
 iranian_focus.71.b: "아니요"
 iranian_focus.72.t: "작전에 동의한 레바논"
 iranian_focus.72.d: "레바논 정부는 이 지역에서 헤즈볼라를 축출하는 데 우리를 돕기로 합의했습니다. 이 작전의 동기는 비국가 행위자를 축출하는 것 이상으로, 이슬람 공화국과 남부 레바논으로 달아난 이들의 관에 마지막 못을 박는 것입니다."
 iranian_focus.72.a: "전진하라!"
 iranian_focus.73.t: "협력을 거부한 레바논"
 iranian_focus.73.d: "레바논 정부는 이 지역에서 헤즈볼라와 잔존 IRGC 병력을 축출하는 데 우리를 돕기를 거부했습니다. 우리는 혼자서 해야 할 것 같습니다."
 iranian_focus.73.a: "좋다"
 iranian_focus.74.t: "망명 중인 IRGC 장군들을 암살한 이란"
 iranian_focus.74.d: "이란 정부는 우리의 안가에 머물던 IRGC 고위 관료 여러 명을 살해한 작전을 수행했습니다. 암살은 이란 공군의 소행으로 알려졌으며, 레바논의 시아파 공동체 사이에서 큰 분노를 불러일으켰습니다."
 iranian_focus.74.a: "빌어먹을!"
 iranian_focus.75.t: "전직 IRGC 장군들에 대한 작전 성공"
 iranian_focus.75.d: "이란 공군은 카셈 솔레이마니를 포함한 IRGC 최고위 관료들을 살해한 여러 차례의 공습을 성공적으로 수행했습니다. 이 승리는 높이 평가받을 뿐 아니라, 이란의 힘을 보여 주는 증거로 세계적으로 인정받을 것입니다."
 iranian_focus.75.a: "한 시대의 끝"
 iranian_focus.77.t: "페르시아만"
 iranian_focus.77.d: "우리가 페르시아만 진입에 대해 적정 수준의 통행료를 부과한 지 약 24시간이 지났으며, 이미 국제 무대에서 이에 대해 광범위한 비난을 받고 있습니다. 그러나 대대적인 비난에도 불구하고 미국의 정치인들은 여전히 우리와 협력할 의향이 있습니다. 이들은 무역과 해운 비용을 줄이는 데 도움을 줄 것이지만, 그 대가로 우리는 세금을 폐지하고 무역이 제한 없이 흐르도록 해야 합니다."
 iranian_focus.77.a: "아니요"
 iranian_focus.77.b: "합의점을 찾을 수 있다"
 iranian_focus.78.t: "아제르바이잔 국경 인근의 이란군 무력시위"
 iranian_focus.78.d: "이란군은 아제르바이잔 국경에 상당한 병력을 집결시켰으며, 최근 몇 달간 준비의 일환으로 특별 민족 사단까지 편성했습니다. 서방 정보기관은 이란이 아마도 아제르바이잔을 병합하기 위한 침공을 준비하고 있다는 사실을 수개월 전부터 알고 있었습니다. 이는 튀르키예 지도자가 이란이 아제르바이잔에 진입하기로 결정할 경우 개입하겠다고 경고한 가운데 벌어진 일입니다. 많은 이들이 더 큰 지역 분쟁을 우려하는 반면, 양측 모두 허세를 부리고 있다고 보는 이들도 있습니다."
 iranian_focus.78.a: "우려스럽다"
 iranian_focus.79.t: "이란의 석유 양보 요구"
 iranian_focus.79.d: "이란 정부는 우리 유전을 '개발'할 수 있도록 일시적인 통제권을 넘기라고 요구했습니다. 이러한 터무니없는 요구는 지역 전체에 충격을 주었으며, 많은 이들이 이란을 지역의 깡패라고 선언하기에 이르렀습니다. 이를 받아들일지는 매우 신중하게 생각해야 할 문제입니다."
 iranian_focus.79.a: "선택의 여지가 없다"
 iranian_focus.79.b: "굴복하느니 죽겠다"
 iranian_focus.80.t: "양보한 [FROM.GetName]"
 iranian_focus.80.d: "[FROM.GetName]은(는) 압박 앞에 굴복하여 이제 이란 시추 기업이 자국 유전에서 작업을 시작하도록 허용하기 시작했습니다."
 iranian_focus.80.a: "좋다"
 iranian_focus.81.t: "우리 제안을 거절한 [FROM.GetName]"
 iranian_focus.81.d: "[FROM.GetName] 정부는 우리의 관대한 제안을 단호히 거절했으니 분명 통치할 자격이 없습니다. 국가적 자존심과 자아를 위해 그들은 평화를 희생시켰습니다."
 iranian_focus.81.a: "그들은 벌을 받을 것이다"
 iranian_focus.82.t: "무산담과 마시라를 요구하는 이란"
 iranian_focus.82.d: "이란 대사관은 오늘 우리 외교관들을 불러 전략적 주 두 곳을 넘기라고 요구했습니다. 이란 정부는 1970년대 도파르 반란을 진압하는 데 도움을 준 보상으로 무산담과 마시라섬의 통제권을 이란 당국에 이양하라고 요구했습니다. 이들은 지역 안보와 이란의 안보를 유지하기 위해 해당 영토가 필요하다고 주장합니다."
 iranian_focus.82.a: "다른 선택지가 있겠는가?"
 iranian_focus.82.b: "마지막 오만인이 쓰러질 때까지 우리 땅을 지킬 것이다!"
 iranian_focus.83.t: "영토를 포기한 오만"
 iranian_focus.83.d: "오만 정부는 오늘 매우 현명한 선택을 했습니다. 우리의 뛰어난 협상력 덕분에 무산담과 마시라의 통제권이 오늘 중으로 아르테시에 이양되고 있습니다."
 iranian_focus.83.a: "좋다, 매우 좋다"
 iranian_focus.84.t: "복속을 요구하는 이란"
 iranian_focus.84.d: "이란 정부는 카타르가 자국의 보호국이 될 것을 요구했습니다. 우리 땅은 단순한 체스판 위의 말이 아니며, 이러한 조치는 카타르 사회와 지역 전체의 많은 이들을 분노하게 했습니다. 그러나 이란의 최근 행동은 이들이 주변 사람들의 목숨을 거의 개의치 않는다는 것을 보여 줍니다."
 iranian_focus.84.a: "다른 선택지가 없다"
 iranian_focus.84.b: "마지막 카타르인이 쓰러질 때까지 싸울 것이다!"
 iranian_focus.85.t: "복속한 카타르"
 iranian_focus.85.d: "카타르 정부는 우리의 보호국이 되기로 합의했습니다. 물론 그들에게는 다른 선택지가 없었습니다. 칼로 살든지, 칼로 죽든지 할 것입니다."
 iranian_focus.85.a: "좋은 선택이다"
 iranian_focus.86.t: "샤 마수드 지원"
 iranian_focus.86.d: "아프가니스탄에서의 영향력을 높이기 위해, 우리는 이 나라에 무기를 지원하고 탈레반과의 전쟁에서 승리하도록 돕기로 결정했습니다. 그렇다면 어느 정도의 지원을 보여야 할까요?"
 iranian_focus.86.a: "많은 지원"
 iranian_focus.86.b: "적당한 지원"
 iranian_focus.86.c: "적은 지원"
 iranian_focus.87.t: "아프가니스탄 중부의 하자라 봉기"
 iranian_focus.87.d: "하자라 민족이 탈레반과 북부 동맹에 맞서 봉기했습니다. 그들의 지도자들은 승리로 이끌어 줄 이란의 지원을 요청하고 있으며, 우리 군은 명령에 따를 준비가 되어 있습니다."
 iranian_focus.87.a: "가자, 가자, 가자!"
 iranian_focus.88.t: "하자리스탄에서의 승리"
 iranian_focus.88.d: "하자리스탄에서 싸우는 우리 병사들은 북부 동맹과 탈레반 양측의 광포한 공격자들을 막아낼 수 있었습니다. 하자리스탄은 또 하루를 살아남았습니다."
 iranian_focus.88.a: "그 이하는 기대하지 않았다"
 iranian_focus.89.t: "아프가니스탄 중부의 하자라 봉기"
 iranian_focus.89.d: "견제받지 않은 이란의 영향력의 결과로 하자라 민족이 아프가니스탄의 모든 형태의 권력에 맞서 봉기했으며, 이제 우리의 통제로부터의 완전한 독립을 추구하고 있습니다."
 iranian_focus.89.a: "오래가지 못할 것이다"
 iranian_focus.90.t: "하자라 방위군"
 iranian_focus.90.d: ""
 iranian_focus.90.a: ""
 iranian_focus.91.t: "이란 사회에서 동성애자의 위치"
 iranian_focus.91.d: "우리 당은 오랫동안 인종, 성별, 성적 지향에 관계없이 모든 이란인의 사회적 평등을 공약하고 이를 위해 활동해 왔습니다. 그러나 사회적으로 보수적인 국가를 통치하는 것은 훨씬 다른 일입니다. 대도시 지역은 사회적으로 자유주의적이지만 많은 이들이 거주하는 농촌 지역은 여전히 극도로 보수적입니다. 동성애자에게 그러한 자유를 부여하는 것은 분명 우리나라의 보수 세력을 분노하게 할 것입니다."
 iranian_focus.91.a: "우리의 약속을 지킬 것이다"
 iranian_focus.91.b: "이란에 동성애자의 자리는 없다"
 iranian_focus.92.t: "사회주의 연합을 제안하는 이란"
 iranian_focus.92.d: "이란 정부는 우리 정부를 찾아와 양국 간에 사회주의 연합을 수립할 것을 요청했습니다. 이들은 이 연합이 이란의 이라크에 대한 직접 통제를 수반하지 않으며 양국 체제의 통합을 의미한다고 주장하고 있습니다. 또한 우리가 원하는 때 언제든 이 연합을 탈퇴할 자유가 있으며, 처음부터 머물거나 가입해야 할 의무도 없다고 거듭 강조했습니다."
 iranian_focus.92.a: "우리가 받아들여야 할 거래다!"
 iranian_focus.92.b: "절대 안 된다"
 iranian_focus.93.t: "연합에 가입한 이라크"
 iranian_focus.93.d: "이라크 정부는 양국 간에 사회주의 연합을 수립하는 역사적인 합의에 서명하기로 동의했습니다. 우리가 이라크를 직접 통제하지는 않겠지만, 양국은 상호 연결된 상태를 향해 함께 나아갈 것입니다."
 iranian_focus.93.a: "좋다!"
 iranian_focus.94.t: "우리 거래를 거절한 이라크 사회주의자들"
 iranian_focus.94.d: "이라크는 우리의 거래를 거절했으며, 오히려 이러한 조치가 지역 전반의 사회주의를 위태롭게 할 것이라고 밝혔습니다. 우리는 그들의 입장을 이해하지만, 이는 여전히 우리 당의 유산과 우리가 이루고자 했던 것에 대한 커다란 타격입니다."
 iranian_focus.94.a: "통합은 당분간 미뤄야 한다"
 iranian_focus.95.t: "연합에서 탈퇴한 이라크"
 iranian_focus.95.d: "이라크 정부는 우리가 함께 수립한 사회주의 연합에서 공식적으로 탈퇴했습니다."
 iranian_focus.95.a: "유감이다"
 iranian_focus.96.t: "이란 재판소"
 iranian_focus.96.d: "오늘 이슬람 공화국의 전직 관료들을 대상으로 이란 재판소가 열립니다. 특히 부패, 스캔들, 국민에 대한 가해에 연루된 이들이 대상입니다. 재판관단이 그들의 운명을 결정하겠지만, 우리에게는 여전히 선택권이 있습니다. 재판소를 공개적으로 진행할 수도 있고, 그들을 활용해 더 효율적이고 투명한 정부를 만들 수도 있습니다."
 iranian_focus.96.a: "두 번째 기회는 누구에게도 해가 되지 않는다"
 iranian_focus.96.b: "그들 모두를 본보기로 삼는다"
 iranian_focus.97.t: "함바스테기 정책"
 iranian_focus.97.d: "함바스테기는 페르시아어로 연대를 의미합니다. 이를 계기로 우리 당의 많은 이들이 세계의 난민들과의 연대를 보여 주려는 '함바스테기'라는 정책을 공개적으로 요구하고 있습니다. 이들은 난민과 실향민이 무기한으로 이란에서 피난처를 구하도록 허용하자고 제안하고 있습니다. 이는 우리가 전체적으로 더 많은 인구를 확보하고 노동력을 확충하게 된다는 뜻입니다."
 iranian_focus.97.a: "모두 받아들여야 한다"
 iranian_focus.97.b: "이란에는 그럴 여력이 없다"
 iranian_focus.98.t: "마침내 찾아온 자유"
 iranian_focus.98.d: "한 세기가 넘도록 노동자들은 이란의 전체주의 체제와 싸워 왔습니다. 파업에서 노골적인 반란에 이르기까지, 이란의 명예로운 노동자들은 정부가 자신들의 권리를 짓밟도록 내버려 두지 않았습니다. 이제 전면적인 개혁으로 국가를 뒤바꿀 때가 왔습니다."
 iranian_focus.98.a: "자유, 평등, 그리고 노동자의 통치!"
 iranian_focus.99.t: "라자비 왕조"
 iranian_focus.99.d: "새로운 정치 왕조인 라자비 왕조가 세워졌습니다. 수십 년 동안 마수드 라자비와 그의 아내 마르얌은 MEK(인민 무자헤딘)를 이끌며 자신들의 정치적 역량으로 보호받는 정부의 수립을 주장해 왔습니다."
 iranian_focus.99.a: "샤든 물라든 독재자에게 죽음을"
 iranian_focus.100.t: "샤의 나라"
 iranian_focus.100.d: "수십 년의 망명 끝에 레자 팔라비가 돌아와 공작 왕좌를 되찾았습니다. 그의 아버지를 폐위시킨 이슬람 공화국은 약속했던 책무를 이행하지 못했으며, 그에 따라 군주제에 대한 정서와 향수가 세월이 흐르면서 꺼져 가던 불씨를 다시 지폈습니다."
 iranian_focus.100.a: "우리는 위대한 국가이며, 이란을 되찾을 것이다"
 iranian_focus.101.t: "불평등한 세계 속의 대등한 존재"
 iranian_focus.101.d: "이란인의 정당인 범이란주의자들은 오랫동안 이란 국민과 그 권리를 위해 싸울 의지가 있는 국가의 수립을 요구해 왔습니다. 수 세기 동안 열강들은 이란의 영토, 주권, 존엄을 갉아먹어 왔습니다. 이제 약자를 집어삼키는 이 세계에서 이란이 대등한 존재가 될 때가 왔습니다."
 iranian_focus.101.a: "신성한 빛이 우리를 인도하기를"
 iranian_focus.102.t: "이란의 관리자"
 iranian_focus.102.d: "호메이니의 첫 번째 공식 후계자였던 몬타제리는 온건하고 자유주의적인 견해 탓에 곧 눈 밖에 났습니다. 그 결과 몬타제리는 끝내 최고지도자가 될 수 없었고 그 자리는 하메네이가 차지했습니다. 이제 체제 전체가 무너진 지금, 1979년에 구상되었으나 끝내 실현되지 못한 이슬람 민주주의에 대한 희망이 여전히 남아 있습니다."
 iranian_focus.102.a: "신이 원하신다면"
 iranian_focus.103.t: "아직 오지 않은 최악"
 iranian_focus.103.d: "서쪽 이웃 이라크에는 최악이 아직 오지 않았습니다. 국제 사회는 이라크에 대한 압박을 서서히 높이고 있으며, 일각에서는 미군의 이라크 침공까지 추측하고 있습니다. 그때가 왔을 때 이라크가 버틸 수 있도록 일종의 원조 패키지를 제공하는 방안을 고려해야 합니다."
 iranian_focus.103.a: "금전적 원조가 큰 도움이 될 것이다"
 iranian_focus.103.b: "무기가 그들의 병력에 도움이 될 것이다"
 iranian_focus.104.t: "금전적 원조를 제공한 이란!"
 iranian_focus.104.d: "이란의 MEK 정부가 우리의 국가 발전을 돕기 위해 현금 원조 패키지를 보내왔습니다."
 iranian_focus.104.a: "감사하다"
 iranian_focus.105.t: "우리에게 무기를 보내는 이란"
 iranian_focus.105.d: "이란의 MEK 정부가 우리 병력의 보급을 돕기 위해 소형 화기가 담긴 꾸러미를 보내왔습니다."
 iranian_focus.105.a: "쓸모가 있을 것이다"
 iranian_focus.106.t: "아슈라프 기지 재건"
 iranian_focus.106.d: "우리 조직의 많은 이들이 아슈라프 기지의 유산과 그것이 의미했던 바를 회상하고 있습니다. 기지를 재건하여 이전보다 더 크고 위대하게 만들자는 요구가 많습니다. 문제는 어디에 짓느냐입니다."
 iranian_focus.106.a: "튀르키예 국경"
 iranian_focus.106.b: "후제스탄의 이라크 국경"
 iranian_focus.107.t: "쿠르디스탄 연방화"
 iranian_focus.107.d: "우리 당은 오랫동안 쿠르디스탄 지역의 연방화를 공약으로 내세워 왔으나, 그 이후로 상황이 변했습니다. 약속을 지키기로 한다면 이란령 쿠르디스탄에서 일어나는 거의 모든 일을 우리가 통제하되 그들은 자유 선거를 치르게 될 것입니다. 반대로 계속 그들을 틀어쥐기로 한다면 그들의 처지를 외면하는 경우 향후 쿠르드인들의 저항에 직면할 수 있습니다."
 iranian_focus.107.a: "약속을 지켜야 한다"
 iranian_focus.107.b: "이란을 조각내서는 안 된다"
 iranian_focus.108.t: "긴 통화"
 iranian_focus.108.d: "국방부 장관과 거의 두 시간에 걸친 통화 끝에, [PER.GetLeader]은(는) 이란의 샤한샤로서 즉위하기 위한 조건을 논의했습니다. 어느 쪽도 이란 사회에서 샤의 역할과 임무에 대해 합의하지 못했기에 논의는 특히 순탄하지 않았습니다. [PER.GetLeader]은(는) 샤의 권력을 순전히 의례적인 것으로 유지하고 경험 많은 관료들이 정부를 통제하게 하기를 원했습니다. 그러나 사무총장의 권력을 견제하고자 했던 장관은 다르게 보았습니다. 그는 권력이 자신, 사무총장, 왕세자, 마즐리스 사이에 분산되는 정부를 원했습니다."
 iranian_focus.108.a: "[PER.GetLeader] 편에 선다"
 iranian_focus.108.b: "장관 편에 선다"
 iranian_focus.109.t: "샤의 즉위식"
 iranian_focus.109.d: "최근 샤흐야드 광장으로 개명된 자유 광장에서, 레자 팔라비 2세가 군중에게 손을 흔들자 수천 명의 환호성이 터져 나왔습니다. 그의 뒤에는 그의 아버지의 통치와 이란 건축의 증거인 샤흐야드 기념탑이 서 있었습니다. 그의 곁에는 쿠란을 든 마르자가 서 있었습니다. 의식이 진행되자 존경받는 군 장교가 제국 왕관을 레자에게 가져왔습니다. 그가 왕관을 머리에 쓰자 군중은 '자비드 샤', 즉 샤 만세를 외치기 시작했습니다. 이어서 연설이 시작되었습니다. '국민의 권위가 없으면 나의 권력은 아무것도 아닙니다. 나는 여러분의 통치자가 아니며, 이란 국민이야말로 진정한 통치자입니다. 나의 권력은...에서 비롯됩니다'"
 iranian_focus.109.a: "...신성한 빛의 인도를 받는 이들로부터"
 iranian_focus.109.b: "...숨 쉬는 모든 순간을 이란을 위해 바치는 이들로부터"
 iranian_focus.110.t: "라슈트에 정치 지혜 센터 출현"
 iranian_focus.110.d: "라슈트에 세속주의 이상과 가치의 성장을 촉진하는 정치 지혜 센터가 생겨났습니다. 이란 전역의 학자들과 정치학자들이 이곳에서 진행되는 연구에 참여하기 위해 몰려들고 있습니다."
 iranian_focus.110.a: "흥미롭군"
 iranian_focus.111.t: "이스파한에 정치 지혜 센터 출현"
 iranian_focus.111.d: "이스파한에 세속주의 이상과 가치의 성장을 촉진하는 정치 지혜 센터가 생겨났습니다. 이란 전역의 학자들과 정치학자들이 이곳에서 진행되는 연구에 참여하기 위해 몰려들고 있습니다."
 iranian_focus.111.a: "흥미롭군"
 iranian_focus.112.t: "마슈하드에 정치 지혜 센터 출현"
 iranian_focus.112.d: "마슈하드에 세속주의 이상과 가치의 성장을 촉진하는 정치 지혜 센터가 생겨났습니다. 이란 전역의 학자들과 정치학자들이 이곳에서 진행되는 연구에 참여하기 위해 몰려들고 있습니다."
 iranian_focus.112.a: "흥미롭군"
 iranian_focus.113.t: "마르카지에 정치 지혜 센터 출현"
 iranian_focus.113.d: "마르카지에 세속주의 이상과 가치의 성장을 촉진하는 정치 지혜 센터가 생겨났습니다. 이란 전역의 학자들과 정치학자들이 이곳에서 진행되는 연구에 참여하기 위해 몰려들고 있습니다."
 iranian_focus.113.a: "흥미롭군"
 iranian_focus.114.t: "호르모즈간에 정치 지혜 센터 출현"
 iranian_focus.114.d: "호르모즈간에 세속주의 이상과 가치의 성장을 촉진하는 정치 지혜 센터가 생겨났습니다. 이란 전역의 학자들과 정치학자들이 이곳에서 진행되는 연구에 참여하기 위해 몰려들고 있습니다."
 iranian_focus.114.a: "흥미롭군"
 iranian_focus.115.t: "공화당에 대한 기부"
 iranian_focus.115.d: "공화당은 종종 우리와 같은 편에 섰으며, 우리에 대한 미국의 외교 정책을 형성하는 데 핵심적인 역할을 해 왔습니다. 우리가 그들에게 우리의 지지를 보여 줄 수 있다면, 우리가 부탁을 해야 할 때 미국이 더 관대하게 대해 줄 수도 있을 것입니다."
 iranian_focus.115.a: "소액 기부면 충분하다"
 iranian_focus.115.b: "적당한 규모의 기부를 진행한다"
 iranian_focus.115.c: "거액을 기부해야 한다"
 iranian_focus.116.t: "공화당으로 쏟아지는 이란의 기부금"
 iranian_focus.116.d: "지난 몇 주 동안 이란 내 익명의 출처로부터 기부금이 쏟아져 들어오고 있습니다. 이 자금은 공화당이 민주당을 이기는 것을 보고 싶어 하는 이란 정부가 직접 제공한 것으로 추측됩니다. 이는 이란 정부가 공화당에 호의를 베풀고 있는 만큼 그들에게서 호의를 바라고 있다는 은근한 암시일 수 있습니다."
 iranian_focus.116.a: "알겠다"
 iranian_focus.117.t: "노후화된 F-14 기단에 대한 지원을 요청하는 이란"
 iranian_focus.117.d: "이란 정부는 노후화된 F-14 기단의 개량을 지원해 달라고 우리를 찾아왔습니다. 참석한 이란 공군 장교들은 흥미로운 설명과 제안을 내놓았습니다. 이란이 낡고 노후화된 F-14 기단의 개량을 목표로 하는 최신 F-14 파생형 개발에 자금을 대겠다는 것입니다. 이 파생형은 우리와 우리 공군도 사용할 수 있습니다."
 iranian_focus.117.a: "합의에 이를 수도 있을 것이다"
 iranian_focus.117.b: "절대 안 된다"
 iranian_focus.118.t: "F-14I 톰캣 수송을 개시한 미국"
 iranian_focus.118.d: "미국이 납득한 듯, F-14I 톰캣 60기를 공군에 수송하기 시작했습니다. 약간의 개량을 거치면 우리는 마침내 다시 쓸 만한 항공기를 갖게 될 것입니다."
 iranian_focus.118.a: "좋다"
 iranian_focus.119.t: "F-14 거래를 거절한 미국"
 iranian_focus.119.d: "아마도 정치적 이유로 미국은 F-14I에 대한 우리의 제안을 받아들이기를 거부했습니다."
 iranian_focus.119.a: "유감이다"
 iranian_focus.120.t: "자유를 위한 운동"
 iranian_focus.120.d: "혁명 이전에 창설된 이란 자유운동은 비공화주의 기관들에 맞서 싸우는 데 앞장서 왔습니다. 이슬람 공화국과 혁명의 초기 지지자였던 자유운동은 수년에 걸쳐 이슬람 공화국 전체에 반대하고 공화정을 추진하는 쪽으로 변모했습니다. FMI의 부상과 함께 이란인들은 마침내 진정한 이슬람 민주주의를 수립할 수 있을지도 모릅니다."
 iranian_focus.120.a: "뭉치면 선다"
 iranian_focus.121.t: "희망의 녹색 깃발"
 iranian_focus.121.d: "미르호세인 무사비가 이끄는 희망의 녹색 길은 이란 자유운동보다 더 보수적인 대안으로 형성되었습니다. 공화정 수립이라는 공통 목표를 공유하지만, 무사비는 이슬람 공화국과 그 정책을 형성하는 데 큰 역할을 했습니다. 과거와 상관없이 무사비는 이제 사회적으로 더 자유주의적인 쪽으로 변했으며, 동시에 이슬람 혁명의 이상 일부를 보존할 필요성도 강조하고 있습니다."
 iranian_focus.121.a: "다음에 무엇이 올지는 오직 신만이 아신다"
 iranian_focus.122.t: "모사데크의 후계자들"
 iranian_focus.122.d: "민족전선은 여러 차례에 걸쳐 권력을 빼앗겼습니다. 처음에는 모사데크가 집권했을 때 권력을 잃었고, 두 번째는 1979년 샤푸르 바흐티아르가 제국 국가의 붕괴 이후 민주주의를 수립하려 했을 때였습니다. 현대에 민족전선은 보다 사회주의-기술관료적 이념을 대변합니다. 과거 권력을 유지하는 데 운이 따랐든 아니든, 민족전선은 다른 어떤 조직도 가지지 못한 비전을 가지고 있습니다."
 iranian_focus.122.a: "모사데크여, 당신의 길은 계속된다!"
 iranian_focus.123.t: "KDPI와의 연합"
 iranian_focus.123.d: "우리 당은 최고 지도부와 KDPI 지도부 사이의 공식 회담을 마련했습니다. 이 회담에서 일종의 연합이 논의되었는데, 범이란주의 당이 KDPI의 개발 사업에 자금을 대는 대신 KDPI가 범이란주의 정부를 쿠르드 지역의 합법적이고 정당한 정부로 선언하는 내용입니다. 이들의 요구를 들어주면 서부의 쿠르드인들로부터 상당한 이익을 얻어낼 수 있습니다."
 iranian_focus.123.a: "군사 협정을 공식화한다"
 iranian_focus.123.b: "경제 협정을 공식화한다"
 iranian_focus.124.t: "바하이 주민에 대한 제한"
 iranian_focus.124.d: "이전 이슬람 공화국의 규정 때문에 바하이교도들은 사회 참여를 막는 차별을 받아 왔습니다. 같은 인간으로서 그들은 가장 기본적인 권리를 누릴 자격이 있지만, 울라마는 이를 적절하다고 보지 않습니다. 이러한 권리를 부여하는 것은 울라마의 권위를 약화시키고 그들을 크게 분노하게 하겠지만, 적어도 국가의 존엄은 지킬 수 있을 것입니다."
 iranian_focus.124.a: "바하이 민족을 해방한다"
 iranian_focus.124.b: "너무 위험하다"
 iranian_focus.125.t: "이란 공화국"
 iranian_focus.125.d: "아야톨라 몬타제리는 오늘 선거로 국가의 운명이 결정되면 정부 관리자 직에서 물러날 것이라고 발표했습니다. 그의 개혁은 한때 이슬람 공화국의 일부였던 부패에서 자유로운 새 정부로 가는 길을 열었다고 평가받습니다. 그의 개혁 덕분에 여러 정당이 지난 몇 달간 선거운동을 벌이며 지지를 모을 수 있었습니다. 이제 몬타제리가 물러남에 따라, 그의 개혁이 진정한 공화정을 위한 필요한 토대를 마련했기를 바라는 희망이 있습니다."
 iranian_focus.125.a: "자유운동"
 iranian_focus.125.b: "희망의 녹색 길"
 iranian_focus.125.c: "민족전선"
 iranian_focus.126.t: "제2 이슬람 공화국"
 iranian_focus.126.d: "대중의 압력과 민중의 요구에 따라 아야톨라 몬타제리는 이란의 최고지도자직을 맡았으며 제2 이슬람 공화국을 선포했습니다. 이란이 낡은 정체성을 벗고 새롭고 더욱 민주적인 정부 형태로 나아가는 역사적 순간입니다. 아야톨라는 국가를 중재하고 보호하는 정부와 정치의 핵심 인물로 남을 것이며, 정당들은 자유롭게 출마하여 공직을 맡을 수 있게 됩니다. 그러나 몬타제리의 악화되는 건강과 그의 사후 후계 문제에 대한 우려가 있습니다. 당분간 이란인들은 자유롭게 정치적 견해를 표현할 수 있습니다."
 iranian_focus.126.a: "혁명의 진정한 비전"
 iranian_focus.127.t: "다가올 폭풍을 견뎌 내며"
 iranian_focus.127.d: "고난을 겪지 않은 나라는 지구상에 없습니다. 지금이야말로 우리가 가장 필요로 할 때 경제적 혹은 정치적 어려움에서 벗어나게 해 줄 계획을 수립하는 일을 우선시해야 할 때입니다. 이제 남은 문제는 우리에게 무엇이 가장 중요한가입니다."
 iranian_focus.127.a: "경제적 대비책"
 iranian_focus.127.b: "정치적 대비책"
 iranian_focus.128.t: "잠시 되돌아보라"
 iranian_focus.128.d: "잠시 시간을 갖고 방금 당신이 한 일을 되돌아보기 바랍니다. 무슨 짓을 했는지 알 것입니다. 적절했습니까? 아닙니다. 저주받았습니까? 그렇습니다. 계속 플레이해도 됩니까? 아닙니다. 당신은 내가 이 모드와 이 트리를 개발하는 데 쏟은 수백 시간을 모욕하고 짓밟았습니다."
 iranian_focus.128.a: "제발 변화하고 성장하십시오"
 iranian_focus.129.t: "부패 방지 전담반"
 iranian_focus.129.d: "현지인들과 협력하여 정부의 청렴성을 지키고 정부 투명성을 보장하기 위한 부패 방지 전담반이 설립되었습니다. 이제 남은 것은 이 기관이 대부분의 시간을 무엇을 보호하는 데 쓰게 할 것인지 결정하는 일입니다. 결정을 곧 내려야 합니다."
 iranian_focus.129.a: "법의 청렴성을 보장해야 한다"
 iranian_focus.129.b: "경제의 청렴성을 보장해야 한다"
 iranian_focus.130.t: "중개자"
 iranian_focus.130.d: "전직 군 장교, 정치인, 학자. 이 세 단어가 갈리바프의 핵심 특징을 이룹니다. 이란 대통령직에 도전한 여러 차례의 시도, 혹은 그가 가진 과두적 성향으로 가장 잘 알려진 갈리바프는 언제나 스스로를 중개자로 자리매김해 왔습니다. 기회가 찾아오면 갈리바프는 언제나 그 자리에서 그것을 잡을 것입니다. 그는 원칙주의자이자 개혁파이며, 돈이 얽혀 있지 않은 한 그의 다음 행보는 대개 알려지지 않습니다."
 iranian_focus.130.a: "일이 이루어질 것이다"
 iranian_focus.131.t: "아마디네자드의 야망"
 iranian_focus.131.d: "역사적으로 아마디네자드는 역대 가장 강경한 원칙주의자 중 한 명으로 선전되어 왔습니다. 그러나 그의 이러한 보수적 이미지는 많은 이들에게 허상으로 여겨지며, 오히려 정치적으로 혼란스러운 인물이라고 보는 이들도 있습니다. 이 불분명한 입장은 이점이 있었는데, 종교적 소속 덕분에 농촌 지역에서, 그리고 보다 민족주의적인 성향 덕분에 도시 지역에서 더 많은 지지를 얻었기 때문입니다. 그럼에도 아마디네자드는 시아파의 이익을 염두에 둔 이슬람주의 원칙주의자로 남아 있습니다."
 iranian_focus.131.a: "봄은 계속된다"
 iranian_focus.132.t: "러시아 투자자를 부르는 이란"
 iranian_focus.132.d: "이란 정부는 오늘 '러시아에서 자신의 부를 불리고자 하는 이들은 이란으로 오라'며 호소하는 성명을 발표했습니다. 이 성명은 이란이 이란 국가에 대한 러시아의 투자를 모색하고 있음을 시사합니다. 우리 정부 역시 이를 우리에게도 이익이 될 수 있는 신호로 보고 검토해 왔습니다. 이란에서의 영향력을 확보할 수 있다면 외교 채널을 통한 대화 이상의 훨씬 많은 일을 할 수 있을 것입니다."
 iranian_focus.132.a: "투자를 진행한다"
 iranian_focus.132.b: "그런 국가와는 사업을 할 수 없다"
 iranian_focus.133.t: "이란에 밀려드는 러시아 투자"
 iranian_focus.133.d: "러시아 투자가 연이어 이란 시장에 유입되어 시장 대부분을 놀라게 했습니다. 정부 투자와 더불어 일부 러시아의 부유한 올리가르히들이 이란 광물 산업의 성장을 촉진하기 위해 이 분야에 투자하고 있습니다."
 iranian_focus.133.a: "좋다"
 iranian_focus.134.t: "이란 투자를 규탄하는 러시아"
 iranian_focus.134.d: "오늘 러시아 정부는 자국민에게 이란에 투자하지 말라고 촉구하는 공공 성명을 발표했습니다. 왜 그런 일을 하는지 알 수 없지만, 이는 이란에 대한 러시아의 투자를 요청한 우리의 앞선 호소에 대한 대응임이 분명합니다."
 iranian_focus.134.a: "매우 유감이다"
 iranian_focus.135.t: "혁명의 보존"
 iranian_focus.135.d: "최고 지도부는 혁명과 그 이상을 어떻게 보존할 수 있을지 논의하고 있습니다. 이전 정부에 대한 초기의 증오가 곧 사라지고, 그에 따라 국민의 분노가 우리를 향하게 될 것이라는 우려가 있습니다. 우리는 국민이 정부 편에 서도록 하고 붕괴를 면할 방법을 신속히 찾아야 합니다."
 iranian_focus.135.a: "한 세대의 학비를 지원한다"
 iranian_focus.135.b: "왜 우리가 스스로를 증명해야 하는가? 우리는 계속 이곳에 있을 것이다"
 iranian_focus.136.t: "마샤이의 도박"
 iranian_focus.136.d: "에스판디야르 라힘 마샤이는 오랫동안 이란 기득권층의 지지를 얻기 위해 싸워 왔으나, 그의 독특한 정치 이념은 계속해서 그와 지지자들을 소외시키고 있습니다. 이란식 이슬람 학파가 필요하다고 믿는 마샤이는 이란 사회에서 몰아내려는 시아파 성직자들을 꾸준히 분노하게 합니다. 반면 아마디네자드 같은 인물과의 관련성은 그를 개혁 운동 세력과 대립하게 만듭니다. 그럼에도 그의 세속적 이념과 민족주의적 성향은 이란 정치의 회색 지대로부터 지지를 가져다주었습니다."
 iranian_focus.136.a: "이란인의 이슬람은 다르고 계몽적이며, 미래를 만들어 갈 것이다"
 iranian_focus.137.t: "인민의 군대"
 iranian_focus.137.d: "이란군, 즉 아르테시는 역사적으로 비정치적이었습니다. 그러나 정치 기득권층 내부의 불안정이 커지면서, 상황이 진정되어 다시 정상으로 돌아갈 준비가 될 때까지 직접 개입하여 보다 안정적인 질서를 만들 수밖에 없게 되었습니다. 현역 군인 대다수가 징집 출신이어서 아르테시는 이란 사회의 모든 부문으로 구성되어 있으므로, 아르테시의 정치적 방향은 아직 완전히 알려져 있지 않습니다."
 iranian_focus.137.a: "군대가 국가를 위해 희생되기를"
 iranian_focus.138.t: "적색과 청색 사이"
 iranian_focus.138.d: "경제에 대한 아마디네자드의 공식 입장은 늘 암울했으며, 신 말고는 아무도 알지 못합니다. 이는 내각에 많은 문제를 일으켰고, 정부의 방향이 사회주의로 기울 것인지 자본주의로 기울 것인지에 대해 아마디네자드와 그의 정부가 공식 입장을 밝혀야 한다는 요구가 커지고 있습니다."
 iranian_focus.138.a: "자본주의를 최대한 받아들여야 한다"
 iranian_focus.138.b: "사회주의와 그 이점을 추구해야 한다"
 iranian_focus.138.c: "둘 다 하면 안 되는가?"
 iranian_focus.139.t: "국가의 적 재정의"
 iranian_focus.139.d: "이슬람 혁명이 이란 외교 무대를 뿌리째 뒤흔든 이래, 우리는 서방, 특히 미국을 이란과 이슬람의 적으로 선전해 왔습니다. 그러나 시대가 변했으며, 국민을 다시 한번 단결시키기 위해 적어도 다른 누군가를 국가의 적으로 지정하는 방안을 고려해야 합니다."
 iranian_focus.139.a: "대악마는 서방에 있다"
 iranian_focus.139.b: "최대의 악마는 북쪽과 동쪽에 있다"
 iranian_focus.139.c: "가장 나쁜 악마는 바로 이웃에 있다"
 iranian_focus.140.t: "마무드의 딜레마"
 iranian_focus.140.d: "오늘 일찍 아마디네자드가 생각에 완전히 빠져 깊이 고민하는 모습이 목격되었습니다. 종일 무슨 생각을 하느냐는 질문을 받자 그는 '병사들에게 쓰는 돈'이라고 답했습니다. 그가 말하는 돈은 이란 전역의 여러 재향군인 자선단체에 대한 기부금입니다. 그 돈이 어디에 배정되고 있는지 걱정하던 아마디네자드는 그 돈을 그냥 가져가 다른 곳에 쓸지, 원래 가야 할 곳으로 보낼지를 고민하고 있습니다."
 iranian_focus.140.a: "이토록 솔깃한 기회를 놓치기엔 너무 솔깃하다"
 iranian_focus.140.b: "종교의 가르침을 따라온 대로 유혹을 이겨내야 한다"
 iranian_focus.141.t: "성직자에 대한 앙갚음"
 iranian_focus.141.d: "국내에서 대체로 지배적인 시아파 성직자들에게 앙갚음하기 위해, 우리는 일부 도시와 지방의 이름을 이슬람 이전의 이름으로 바꿀 수 있습니다. 이 조치는 분명 성직자들을 분노하게 하겠지만, 우리가 원하는 만큼 그들의 영향력을 무너뜨리지는 못할 것입니다. 오히려 이 조치는 성직자를 신, 오직 신 한 분으로 대체하려는 훨씬 더 거대한 운동의 서막으로 여겨질 수 있습니다."
 iranian_focus.141.a: "계획을 추진한다"
 iranian_focus.141.b: "종교 광신도들을 분노하게 할 위험을 감수할 수 없다"
 iranian_focus.142.t: "세 살 버릇 여든까지"
 iranian_focus.142.d: "정치 경력에서 많은 부패가 드러난 마샤이는 자신의 주머니를 빠르게 채울 수 있는 어떤 잠재적 기회도 마다하지 않았습니다. 그러나 이제 정부를 책임지고 사실상 국가의 지도자가 된 만큼 그의 방식은 바뀌어야 합니다. 정책을 제대로 시행하려면 낡은 습관을 버리고 더 윤리적인 방식을 택해야 합니다."
 iranian_focus.142.a: "그래도 마음은 선한 사람이다"
 iranian_focus.142.b: "부패는 나쁜 자들의 것이며, 근절되어야 한다"
 iranian_focus.143.t: "이란의 분열"
 iranian_focus.143.d: "이란 정부는 이슬람이 근본적으로 실천되는 방식을 개혁하기 시작했습니다. 우리나라를 비롯한 대부분의 이슬람 국가가 울라마와 성직자를 높은 지위에 두고 있는 반면, 이란은 이슬람 문제에서 성직자의 참여를 해체하려 하고 있습니다. 이들은 이를 이슬람의 '이란 학파'라고 부르며, 그 사상은 우리나라에도 퍼졌습니다."
 iranian_focus.143.a: "좋은 일일 리 없다"
 iranian_focus.144.t: "이란의 무역 협정 제안"
 iranian_focus.144.d: "이란 정부는 양국 간의 무역 협정 가능성을 제안했습니다. 현 이란 정부가 지도자를 포함한 이슬람 공화국의 전직 관료 여럿이 이끌고 있다는 점에서 이 소식은 우리 내각의 많은 이들에게 충격으로 다가왔습니다. 그럼에도 이러한 외교 노선의 변화는 적어도 우리에게는 좋은 일입니다."
 iranian_focus.144.a: "서명하겠다"
 iranian_focus.144.b: "절대 안 된다"
 iranian_focus.145.t: "협정에 서명한 이스라엘"
 iranian_focus.145.d: "이스라엘 정부는 오늘 무역 흐름을 개선하기 위해 우리 정부와 기꺼이 협력하겠다고 발표했습니다."
 iranian_focus.145.a: "좋다"
 iranian_focus.146.t: "협정 서명을 거부한 이스라엘"
 iranian_focus.146.d: "이스라엘 정부는 이번 주 초 우리가 제안한 무역 협정에 서명하기를 거부했습니다. 이러한 유감스러운 소식을 우리 국민은 가볍게 받아들이지 않을 것입니다."
 iranian_focus.146.a: "좋다"
 iranian_focus.147.t: "국가의 통합 지도자"
 iranian_focus.147.d: "국가를 이끌 보다 통합적이고 중앙집권적인 인물을 요구하는 목소리가 커지고 있습니다. 아르테시 참모본부가 직접적인 수장을 임명하지 않은 가운데, 국민이 지도자를 선출할 수 있는 국민투표가 소집되었습니다. 지도자는 '모든 수호자의 수호자'를 뜻하는 '마르즈바난-마르즈반'에 임명됩니다."
 iranian_focus.147.a: "아미르 하타미"
 iranian_focus.147.b: "할라코 아흐마디안"
 iranian_focus.147.c: "파르사드 에스마일리"
 iranian_focus.147.d1: "다부드 헤르미다스바반드"
 iranian_focus.148.t: "철도 사업을 제안하는 이란"
 iranian_focus.148.d: "이란 정부는 우리나라 남부에서 북부까지 이어지는 철도 사업을 제안하고 있습니다. 이는 우리 인프라에 큰 도움이 될 수 있어 장기적으로 지출을 줄일 수 있지만, 수락하면 이란 기업이 우리나라에서 영향력을 얻게 된다는 뜻이기도 합니다."
 iranian_focus.148.a: "안 될 이유가 없다"
 iranian_focus.148.b: "아니요"
 iranian_focus.149.t: "아르메니아의 수락!"
 iranian_focus.149.d: "아르메니아는 자국 남부에서 북부까지 이어지는 대규모 철도를 건설하자는 우리의 제안을 수락했습니다."
 iranian_focus.149.a: "매우 좋다"
 iranian_focus.150.t: "아르메니아의 거절!"
 iranian_focus.150.d: "아르메니아는 자국 내 대규모 철도를 건설하자는 우리의 제안을 거절했습니다."
 iranian_focus.150.a: "그들의 손해다"
 iranian_focus.151.t: "철도 사업을 제안하는 이란"
 iranian_focus.151.d: "이란 정부는 우리나라 남부에서 북부까지 이어지는 철도 사업을 제안하고 있습니다. 이는 우리 인프라에 큰 도움이 될 수 있어 장기적으로 지출을 줄일 수 있지만, 수락하면 이란 기업이 우리나라에서 영향력을 얻게 된다는 뜻이기도 합니다."
 iranian_focus.151.a: "좋다, 안 될 이유가 없다"
 iranian_focus.151.b: "아니요"
 iranian_focus.152.t: "아제르바이잔의 동의!"
 iranian_focus.152.d: "아제르바이잔은 자국을 가로지르는 철도 사업에 대한 우리의 제안에 동의했습니다."
 iranian_focus.152.a: "매우 좋다"
 iranian_focus.153.t: "아제르바이잔의 거절!"
 iranian_focus.153.d: "아제르바이잔은 철도 사업에 대한 우리의 제안을 거절했습니다."
 iranian_focus.153.a: "아쉽다"
 iranian_focus.154.t: "철도 사업을 제안하는 이란"
 iranian_focus.154.d: "이란 정부는 우리나라 동부에서 서부까지 이어지는 철도 사업을 제안하고 있습니다. 이는 우리 인프라에 큰 도움이 될 수 있어 장기적으로 지출을 줄일 수 있지만, 수락하면 이란 기업이 우리나라에서 영향력을 얻게 된다는 뜻이기도 합니다."
 iranian_focus.154.a: "물론이다"
 iranian_focus.154.b: "아니요"
 iranian_focus.155.t: "조지아의 동의!"
 iranian_focus.155.d: "조지아는 동부에서 서부까지 이어지는 철도를 건설하자는 우리의 제안을 수락했습니다."
 iranian_focus.155.a: "알았다"
 iranian_focus.156.t: "조지아의 거절!"
 iranian_focus.156.d: "조지아는 우리의 철도 사업을 건설하자는 제안을 거절했습니다."
 iranian_focus.156.a: "유감이다"
 iranian_focus.157.t: "군 퍼레이드 개최"
 iranian_focus.157.d: "최근 군 퍼레이드가 전국에 방송되어 우리의 기술적 진보와 군기를 보여 주었습니다."
 iranian_focus.157.a: "대단하다"
 iranian_focus.158.t: "이란 공화국"
 iranian_focus.158.d: "혁명 위원회는 오늘 이란 공화국의 첫 공식 투표용지가 전국의 투표소에서 이용 가능해졌다고 발표했습니다. 투표용지에는 3개 정당이 올라 자유주의, 온건, 보수 후보가 모두 출마할 수 있게 되었습니다. 새로 기초된 헌법은 언론의 자유, 종교의 자유 등 일정한 권리를 보장했지만, 파벌 사이에서는 이미 일종의 경쟁이 빚어지고 있습니다."
 iranian_focus.158.a: "자유운동"
 iranian_focus.158.b: "희망의 녹색 길"
 iranian_focus.158.c: "민족전선"
 iranian_focus.159.t: "카셈 솔레이마니 암살"
 iranian_focus.159.d: "바그다드에서 테헤란으로 쓰라린 소식이 전해졌습니다. 미국 드론이 바그다드 국제공항에서 카셈 솔레이마니 장군과 아부 마흐디 알무한디스를 공격했습니다. 안타깝게도 이 두 인물, 원로와 그의 동료들은 이번 공격으로 지난밤 순교했습니다. 우리의 결정은 중요하며, 우리의 정책과 대내외 정책에서의 실용주의를 보여 줄 것입니다."
 iranian_focus.159.a: "복수해야 한다!"
 iranian_focus.159.b: "이는 곧 전쟁이다!"
 iranian_focus.160.t: "솔레이마니에 대한 정보 도착"
 iranian_focus.160.d: "오늘 일찍 대통령은 IRGC 사령관 카셈 솔레이마니가 이라크에 있다는 보고를 받았습니다. 이란 정부에서 두 번째로 강력한 인물로 여겨지는 카셈 솔레이마니는 시아파 민병대에 의한 여러 차례의 미군 공격의 책임자로 지목되어 왔으며, 오랫동안 군의 감시 대상이었습니다. 오늘 우리는 그를 영구히 제거할 수 있는 선택권을 가지고 있습니다. 그러나 그렇게 하면 전쟁을 촉발할 수 있습니다."
 iranian_focus.160.a: "제거한다"
 iranian_focus.160.b: "아니, 너무 위험하다"
 iranian_focus.161.t: "카셈 솔레이마니를 암살한 미국"
 iranian_focus.161.d: "이란의 소장 카셈 솔레이마니가 바그다드 국제공항에서 미국의 드론 공습으로 암살되었습니다. 드론은 솔레이마니가 바그다드에서 이라크 총리를 만나러 가는 길에 그를 표적으로 삼아 살해했습니다. 솔레이마니는 이란 이슬람 혁명수비대의 다섯 개 부대 중 하나인 쿠드스군의 사령관이었으며 이란에서 두 번째로 강력한 인물로 여겨졌습니다. IRGC는 총 10명이 사망했다고 밝혔습니다."
 iranian_focus.161.a: "우려스럽다"
 iranian_focus.162.t: "모흐센 펜다르 페제시크푸르의 서거"
 iranian_focus.162.d: "오늘 국가는 애도합니다. 오늘 국가는 국민적 영웅을 잃었습니다. 무엇보다 오늘 국가는 모흐센 펜다르 페제시크푸르를 잃었습니다. 그는 범이란주의 당의 창립자이자 선구자였습니다. 오늘 큰 손실을 입었지만 국가는 멈출 수 없습니다. 새로운 사무총장이 국가의 지도자로 임명될 것입니다."
 iranian_focus.162.a: "호자트 칼라시"
 iranian_focus.162.b: "레자 케르마니"
 iranian_focus.162.c: "자흐라 골라미푸르"
 iranian_focus.163.t: "아프가니스탄 난민"
 iranian_focus.163.d: "아프가니스탄의 혼란스러운 상황으로 인해 많은 아프가니스탄인이 이란에서 피난처를 구하고 가족과 함께 정착하고 있습니다. 그러나 아프가니스탄인 노동력이 보통 고용 비용이 더 저렴하기 때문에 현지인들이 일자리를 구하기가 점점 더 어려워지면서 이는 그들에게 영향을 미치기 시작했습니다."
 iranian_focus.163.a: "모두를 환영한다"
 iranian_focus.163.b: "추방한다"
 iranian_focus.164.t: "잘릴 자디 사고!"
 iranian_focus.164.d: "전직 F-14 에이스이자 현 아르테시 공군 장군인 잘릴 자디가 불과 몇 시간 전 테헤란 인근에서 차량 사고를 당해 현재 위독한 상태라고 보고되었습니다. 우리는 그의 생명을 구하기 위해 정부 예산을 투입할 수 있지만, 사고의 심각성 때문에 비용이 엄청나게 높다고 합니다."
 iranian_focus.164.a: "그의 목숨은 이제 신께 달려 있다"
 iranian_focus.164.b: "필요한 것은 무엇이든 지불한다"
 iranian_focus.165.t: "위성 이용 증가"
 iranian_focus.165.d: "국내에서 외국 TV 채널을 시청하기 위해 위성 안테나를 구매하는 사람이 점점 늘어나고 있는 것으로 보입니다. 본질적으로는 무해하지만 그들이 우리 국가에 대한 선전을 접하게 되어 장기적으로 우리의 명성을 해칠 수 있습니다."
 iranian_focus.165.a: "내버려 둔다"
 iranian_focus.165.b: "이러한 행위를 단속한다"
 iranian_focus.166.t: "문을 닫는 바자르 점포 증가"
 iranian_focus.166.d: "바자르는 끔찍한 한 해를 보냈으며 많은 점포가 문을 닫고 있습니다. 여러 요인이 있지만, 주로 우리가 공격적으로 추진해 온 경제 개혁 때문입니다. 바자르에서는 파산에서 구해 달라며 정부 개입을 요구하는 목소리가 나오고 있습니다."
 iranian_focus.166.a: "도움을 줄 수 있다"
 iranian_focus.166.b: "아니요"
 iranian_focus.167.t: "분리주의 세력"
 iranian_focus.167.d: "최근 몇 년간 우리나라에는 분리 독립 운동이 많지 않았지만, 여러 지역이 외세의 영향에 취약하여 적들이 우리 지역을 이용해 반란을 선동할 수 있다는 점은 여전히 주목해야 합니다. 아제르바이잔, 쿠르디스탄, 발루치스탄, 후제스탄 지역이 가장 취약합니다."
 iranian_focus.167.a: "알겠다"
 iranian_focus.168.t: "아야톨라 몬타제리 서거"
 iranian_focus.168.d: "이른 아침 아야톨라 몬타제리가 조용히 세상을 떠났습니다. 이슬람 혁명의 비극을 되돌린 인물이 이 세상을 떠나 다른 세상으로 가면서 국가는 애도하고 있습니다. 그의 서거는 역사적 순간이지만, 그가 유언장에 무엇을 썼는지, 그리고 자신의 직위를 이을 후계자를 지명했는지는 아직 알려지지 않았습니다. 유언장은 그의 대변인 중 한 명에 의해 국영 TV에서 생중계로 낭독되고 있으며, 유언장에는 다음과 같이 적혀 있습니다..."
 iranian_focus.168.a: "...유세프 사아네이가 아야톨라가 될 것이다"
 iranian_focus.168.b: "...아사돌라 바야트자니가 아야톨라가 될 것이다"
 iranian_focus.168.c: "...성직자 통치의 시대는 끝났다, 이제 국민이 이끌어야 한다"
 iranian_focus.169.t: "국기 변경"
 iranian_focus.169.d: "국기는 국가의 상징이며, 국가를 하나로 묶는 것입니다. 이란은 시대에 따라 여러 국기를 가져왔으므로, 우리는 언제든 [PER.capital.GetCapitalVictoryPointName] 위에 새로운 깃발을 게양할 수 있습니다."
 iranian_focus.169.a: "삼색기"
 iranian_focus.169.b: "사자와 태양"
 iranian_focus.169.c: "이슬람 깃발"
 iranian_focus.169.d1: "꽃"
 iranian_focus.170.t: "야당의 활동 증가"
 iranian_focus.170.d: "우리의 정통성과 인기가 약해짐에 따라 많은 야당 단체가 재편되어 정부에 맞서 민중을 동원하기 위한 노력을 조율하기 시작한 것으로 보입니다. 이슬람 공화국의 정통성이 계속 떨어지면 정부가 전복될 수 있습니다."
 iranian_focus.170.a: "알겠다"
 iranian_focus.171.t: "부셰르 원자력 발전소"
 iranian_focus.171.d: "독일이 미완성으로 남긴 부셰르 원자력 발전소는 지어진 부분이 수십 년째 방치되어 있습니다. 러시아 과학자 여러 명이 도착하면서, 러시아 기업이 발전소의 남은 부분을 완공하겠다는 제안을 해 왔습니다."
 iranian_focus.171.a: "제안을 수락한다"
 iranian_focus.171.b: "사양한다"
 iranian_focus.173.t: "아트라크 국경 살피기"
 iranian_focus.173.d: "[PER.GetName]이(가) 아트라크강 국경에서 정치 회담을 열어 외교와 무역 문제에 대해 논의하자고 제안했습니다. 이들의 초청을 수락하시겠습니까?"
 iranian_focus.173.a: "물론이다!"
 iranian_focus.173.b: "관심 없다."
 iranian_focus.174.t: "[TRK.GetName]의 수락!"
 iranian_focus.174.d: "[TRK.GetName]은(는) 아트라크강 국경에서의 정치 회담을 열자는 우리의 제안을 수락했습니다."
 iranian_focus.174.a: "대단하다!"
 iranian_focus.175: "[TRK.GetName], 우리의 제안을 거절했다!"
 iranian_focus.175.t: "우리 제안을 거절한 [TRK.GetName]!"
 iranian_focus.175.d: "[TRK.GetName]은(는) 아트라크강 국경에서의 정치 회담을 열자는 우리의 제안을 거절했습니다."
 iranian_events.300.t: "1999년 학생 봉기 기념 시위"
 iranian_events.300.d: "오늘은 1999년 7월 학생 봉기가 일어난 지 1년이 되는 날입니다. 전국의 개혁 운동 세력은 전국의 학생들에게 시위에 나서도록 독려하고 있으며, 이는 국가 안보를 위협할 수 있습니다. 그러나 우리에게는 바시즈와 진압 경찰이 있으며, 이들을 테헤란 대학에 투입해 시위대와 맞설 수 있습니다. 이러한 조치는 사상자를 낳을 수 있으며, 조심하지 않으면 전국적 봉기를 촉발할 수도 있습니다."
 iranian_events.300.a: "상관없다"
 iranian_events.300.b: "보안군을 투입한다"
 iranian_events.301.t: "전국적 시위 발발!"
 iranian_events.301.d: "우리의 최근 조치를 학생들이 가볍게 받아들이지 않은 것으로 보이며 전국적 시위가 발발했습니다. 정부의 사임을 요구하는 이들이 점점 늘어나고 있는 것으로 보이지만, 우리는 물러날 생각이 없습니다."
 iranian_events.301.a: "NAJA를 동원한다"
 iranian_events.20.t: "호이에서 터진 시위"
 iranian_events.20.d: "최근의 전국적인 시위에 이어 호이에서도 시위가 터져 나와, 이 주와 주변 지역에 대한 우리의 장악력이 위협받고 있습니다."
 iranian_events.20.a: "가라앉기를 바랄 뿐이다"
