 # Print money button
 print_money_button_tooltip: "§YPrint Money§!\n§gThe government has fallen on hard times and needs to quickly raise funds. Rather than relying on taxation or bond purchases we can issue money to accommodate.§!\n\nIssuing this order prints two weeks worth of government revenue which is added to your treasury. However, issuing money is an inflationary measure: it raises inflation for the current quarter, and repeated printings before the quarterly inflation update make the inflationary effect stronger.\n\n§YTimes Printed Money:§! [?printing_money_var|0Y]\n\n§YPrerequisites:§!\n[!print_money_button_click_enabled]\n§YEffects:§!\n[!print_money_button_click]"
