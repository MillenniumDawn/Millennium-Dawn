 URA_policy_tajik_desc: "이 나라와 동반자 관계를 수립할 계획입니다."
 URA_policy_uzbke: "동반자 관계: [UZB.GetName]"
 URA_policy_uzbke_desc: "이 나라와 동반자 관계를 수립할 계획입니다."
 URA_start_economy: "우랄 경제"
 URA_start_economy_desc: "우랄의 기업들을 발전시키고 민영화로 파괴된 기업들의 복구에 투자할 계획입니다."
 URA_uralmashzavod: "우랄마시"
 URA_uralmashzavod_desc: "우랄마시는 러시아 엔지니어링 기업 OMZ의 중장비 생산 사업체입니다. 시설은 러시아 예카테린부르크에 있으며 약 16,500명을 고용하는 것으로 알려져 있습니다. 노동자들이 거주하는 주변 주거 지역 또한 우랄마시라고 불립니다."
 URA_uralvagonzavod: "우랄바곤자보드"
 URA_uralvagonzavod_desc: "우랄바곤자보트는 러시아 니즈니타길에 위치한 러시아의 기계 제작 기업입니다. 러시아 최대의 과학 산업 복합체 중 하나이자 세계 최대의 주력 전차 제조업체입니다."
 URA_uralhimmash: "우랄힘마시"
 URA_uralhimmash_desc: "우랄힘마시 JSC는 가스 가공, 석유, 화학, 석유화학 및 기타 산업용 장비를 제조하는 러시아 제조업체입니다. 공장은 예카테린부르크에 있습니다."
 URA_uralelectrotyazhmash: "우랄전기중기계"
 URA_uralelectrotyazhmash_desc: "우랄전기중기계는 예카테린부르크에 있는 소련 및 러시아의 공장입니다."
 URA_ural_shina: "우랄시나"
 URA_ural_shina_desc: "우랄시나는 러시아 장갑차 전 모델과 인양, 운송 및 보관 장비용 대형 타이어를 제조합니다. 우랄시나는 적재 중량 3톤까지의 모든 유형 지게차용 3층 일체 주조 초탄성 타이어를 러시아에서 유일하게 제조하는 업체입니다. 이러한 타이어의 생산 기술은 회사 자체 개발품이며 다수의 특허로 보호됩니다. 이 공장은 지상 장비뿐 아니라 러시아 해군 함정을 포함한 선박 및 항만 장비용 제품도 생산합니다."
 URA_ural_turbine_plant: "우랄 터빈 공장"
 URA_ural_turbine_plant_desc: "우랄 터빈 공장은 다양한 출력의 증기 터빈을 설계, 제조 및 정비하는 발전 기계 제작 공장입니다. 공장은 예카테린부르크에 있습니다."
 URA_ural_civil_aviation: "우랄 민간 항공 공장"
 URA_ural_civil_aviation_desc: "우랄 민간 항공 공장은 항공기 제조 및 정비 기업으로, 러시아 항공기 제조 산업의 주요 제조업체 중 하나입니다. 항공 장비, 부품 및 조립품의 개발, 생산, 시험, 수리 및 정비를 전문으로 합니다. 이 회사에는 엔진 정비 및 수리 생산 센터, 항공기 제조 시설, 엔지니어링 센터, 그리고 다수의 자회사, 계열사 및 별도 법인이 포함되어 있습니다."
 URA_ural_concern: "스베르들롭스크 방위 콘체른"
 URA_ural_concern_desc: "지역의 모든 기업을 하나의 방위 콘체른으로 통합할 것입니다."
 URA_kurgan: "쿠르간 산업"
 URA_kurgan_desc: "이 지역의 산업을 발전시키고 투자하기 시작할 것입니다."
 URA_kurgan_machine_plant: "쿠르간마시자보드"
 URA_kurgan_machine_plant_desc: "JSC 쿠르간마시자보드는 러시아 쿠르간에 기반을 둔 제조 기업입니다. BMP 시리즈 보병전투차량으로 유명합니다."
 URA_kurgan_stalmost: "쿠르간스탈모스트"
 URA_kurgan_stalmost_desc: "쿠르간스탈모스트는 교량 경간용 금속 구조물을 제작하는 전문 기업입니다. 현재 모든 유형의 교량용 금속 구조물을 생산하는 러시아 선도 기업입니다. 이 기업의 대표 시설로는 모스크바의 총대주교 다리, 블라고베셴스크 다리, 상트페테르부르크의 볼쇼이 오부호프 사장교, 수르구트의 사장교, 한티만시스크의 붉은 용, 살레하르드의 횃불이 있습니다. 쿠르간 공장은 유럽에 교량용 금속 구조물을 공급하는 러시아 유일의 기업입니다. 오늘날 쿠르간 지역 최대 기업 중 하나입니다."
 URA_kurgan_road_plant: "쿠르간 도로 기계 공장"
 URA_kurgan_road_plant_desc: "쿠르간 도로 기계 공장 JSC는 도로 건설 및 지자체용 장비를 생산하는 러시아의 기계 제작 기업입니다."
 URA_kurgan_airport: "쿠르간 공항 확장"
 URA_kurgan_airport_desc: "쿠르간 공항은 더 이상 국제 기준을 충족하지 못하고 대대적인 개편이 필요하므로 확장할 것입니다."
 URA_kurgan_agro: "쿠르간 농공업 복합체"
 URA_kurgan_agro_desc: "쿠르간 농공업 복합체를 발전시킬 것입니다."
 URA_kurgan_concern: "쿠르간 방위 콘체른"
 URA_kurgan_concern_desc: "지역의 모든 기업을 하나의 방위 콘체른으로 통합할 것입니다."
 URA_chelyaba: "첼랴빈스크 산업"
 URA_chelyaba_desc: "이 지역의 산업을 발전시키고 투자하기 시작할 것입니다."
 URA_chelyaba_magnitogorsk: "마그니토고르스크 제철소"
 URA_chelyaba_magnitogorsk_desc: "마그니토고르스크 제철소는 약칭 MMK로, 러시아 마그니토고르스크 시에 위치한 철강 기업입니다. 세계 30위 규모의 철강 기업입니다."
 URA_chelyaba_zlatoust: "즐라토우스트 금속 공장"
 URA_chelyaba_zlatoust_desc: "즐라토우스트 금속 공장은 첼랴빈스크 주 즐라토우스트 시에 있는 러시아의 금속 공장입니다. 남우랄에서 가장 오래된 공장 중 하나입니다."
 URA_chelyaba_metallurgical: "첼랴빈스크 금속 공장"
 URA_chelyaba_metallurgical_desc: "첼랴빈스크 금속 콤비나트는 러시아 선도 광업 및 금속 기업 메첼에 속한 소련 및 러시아의 산업 기업입니다. 주철, 압연강, 탄소강 및 특수강과 내식강으로 만든 반제품 등 다양한 제품을 생산합니다. 자사 제품에 고유의 지수를 부여할 권리를 가진 국내 몇 안 되는 기업 중 하나로, 그 지수는 ChS(첼랴빈스크 강)이며 그러한 강종을 130종 넘게 생산합니다. 첼랴빈스크 금속 지구 최대의 기업입니다. 고용 인원은 1만 8천 명입니다."
 URA_chelyaba_tracktor: "첼랴빈스크 트랙터 공장"
 URA_chelyaba_tracktor_desc: "첼랴빈스크 트랙터 공장은 CTZ-우랄트락으로도 알려져 있으며, 러시아 첼랴빈스크 시에 위치한 트랙터 제작 공장입니다."
 URA_chelyaba_locomotive: "첼랴빈스크 전기 기관차 수리 공장"
 URA_chelyaba_locomotive_desc: "첼랴빈스크 전기 기관차 수리 공장은 철도 운송 수요를 위해 전기 기관차를 수리하는 공장으로, 첼랴빈스크 시에 위치해 있으며 JSC 젤도르렘마시의 지사입니다."
 URA_chelyaba_concern: "첼랴빈스크 방위 콘체른"
 URA_chelyaba_concern_desc: "지역의 모든 기업을 하나의 방위 콘체른으로 통합할 것입니다."
 URA_orenburg: "오렌부르크 산업"
 URA_orenburg_desc: "지역의 모든 기업을 하나의 방위 콘체른으로 통합할 것입니다."
 URA_orenburg_ural_steel: "우랄 철강"
 URA_orenburg_ural_steel_desc: "우랄 철강은 오렌부르크 주 노보트로이츠크 시에 있는 금속 공장입니다. 철강 산업 분야에서 러시아를 선도하는 제조업체 중 하나입니다."
 URA_orenburg_neft: "오렌부르크네프트"
 URA_orenburg_neft_desc: "부줄룩 시에 본사를 둔 오렌부르크 주의 대규모 석유 생산 연합입니다. JSC 오렌부르크네프트는 약 100개의 면허 구역과 93개의 유전을 소유하고 있습니다."
 URA_orenburg_copper_plant: "메드노고르스크 구리-황 공장"
 URA_orenburg_copper_plant_desc: "메드노고르스크 구리-황 콤비나트는 메드노고르스크 시에 있는 비철 금속 기업입니다. 우랄 광업 금속 회사의 일부입니다."
 URA_ugmk: "우랄 광업 금속 회사"
 URA_ugmk_desc: "우랄 광업 금속 회사는 베르흐냐야피슈마에 기반을 둔 러시아의 금속 기업입니다. 러시아 제2위의 구리 생산업체입니다. 이 지주회사는 1999년 주식회사 우랄엘렉트로메드를 중심으로 형성되었습니다. 이 회사는 러시아 전역에 있는 약 50개 회사를 소유하고 있습니다."
 URA_ugmk_electromed: "우랄엘렉트로메드"
 URA_ugmk_electromed_desc: "JSC 우랄엘렉트로메드는 러시아 스베르들롭스크 주 베르흐냐야피슈마 시에 위치한 개방형 주식회사 우랄 광업 금속 회사 산하 비철 금속 부문의 본사 기업입니다."
 URA_ugmk_nadej: "나제진스키 금속 공장"
 URA_ugmk_nadej_desc: "PJSC 나제진스키 금속 공장은 1896년에 설립된 스베르들롭스크 주 세로프 시의 도시 형성 기업입니다. 이 회사는 UMMC 지주회사의 일부이며 철강 부문 UMK-스틸의 기반 기업입니다."
 URA_ugmk_sumz: "중부우랄 구리 제련소"
 URA_ugmk_sumz_desc: "중부우랄 구리 제련소는 레브다 시에 있는 비철 금속 기업으로, 1차 원료에서 구리를 제련하고 금속 폐가스에서 황산을 생산하는 우랄 최대의 기업입니다. 2000년부터 우랄 광업 금속 회사의 일부입니다."
 URA_ugmk_meknabor: "우랄메하노브르"
 URA_battalion_ural: "우랄 대대"
 URA_battalion_ural_desc: "우랄의 충직한 아들들이 조국을 위해 싸울 준비가 되어 있습니다."
 URA_battalion_uznouralec: "남우랄 대대"
 URA_battalion_uznouralec_desc: "우랄의 충직한 아들들이 조국을 위해 싸울 준비가 되어 있습니다."
 URA_battalion_yaik: "야이크 대대"
 URA_battalion_yaik_desc: "우랄의 충직한 아들들이 조국을 위해 싸울 준비가 되어 있습니다."
 URA_rmk: "러시아 구리 회사"
 URA_rmk_desc: "러시아 구리 회사는 러시아의 금속 기업입니다. 본사는 예카테린부르크에 있습니다. RMK는 러시아의 스베르들롭스크, 첼랴빈스크, 오렌부르크, 노브고로드 주와 하바롭스크 지방, 그리고 카자흐스탄 공화국 영토에서 사업을 운영합니다."
 URA_returm_ekb_promka: "예카테린부르크 산업 재배치"
 URA_returm_kurgan_promka: "쿠르간 산업 재배치"
 URA_returm_chelyaba_promka: "첼랴빈스크 산업 재배치"
 URA_returm_ugmk_promka: "UGMK 재배치"
 URA_uralian_spirit_idea: "자유의 우랄 정신"
 URA_uralian_spirit_idea_desc: "우랄은 하나의 지역으로서 러시아 내에서 언제나 특수한 위치를 차지해 왔습니다. 소련 붕괴 이전에도 대체로 외국인에게는 닫혀 있었고, 우랄에서는 차르 정부에 맞선 야이크 카자크의 유명한 봉기가 있었습니다. 소련이 붕괴하던 시기에 스베르들롭스크 주민 대다수는 소련 존속에 반대표를 던졌습니다. 이제 새로운 시대는 우랄에 새로운 도전을 던집니다. 강하고 자유로운 지역이 될 것인지, 아니면 러시아의 다른 지역들 사이에서 마침내 사라질 것인지입니다."
 URA_ekb_mayor_chernetskyi: "예카테린부르크 시장: 체르네츠키"
 URA_ekb_mayor_chernetskyi_desc: "아르카디 체르네츠키는 지역 당국에 완전히 맞서고, 지역 전체에 해가 되더라도 도시의 이익을 관철시킬 수 있는 인물입니다."
 URA_conflict_idea: "대립: 시청 대 지방"
 URA_conflict_idea_desc: "예카테린부르크 시장실은 언제나 독립적이었고 지역 당국의 영향에 굴복하지 않았으며, 이로 인해 내부의 지역 갈등이 생겨났고 아직 해결되지 않았습니다."
 URA_local_bandits: "범죄 조직의 영향력"
 URA_local_bandits_desc: "90년대에 예카테린부르크 영토에서는 여러 범죄 조직이 형성되어 많은 도시 산업에 큰 영향력을 행사하고 있습니다. 그들은 폭력적인 본성을 지녔음에도 고향 지역의 이익을 맹렬히 수호하며, 모스크바조차도 포함해 누구도 개입하지 못하게 할 것입니다."
 URA_ugmk_idea: "우랄 광업 금속 회사"
 URA_ugz_idea: "우랄바곤자보드"
 URA_avia_idea: "우랄 민간 항공 공장"
 URA_ekb_concern_idea: "스베르들롭스크 방위 콘체른"
 URA_kurgan_concern_idea: "쿠르간 방위 콘체른"
 URA_zlatoust_idea: "즐라토우스트 금속 공장"
 URA_chelyaba_trackor_idea: "첼랴빈스크 트랙터 공장"
 URA_chelyaba_concern_idea: "첼랴빈스크 방위 콘체른"
 URA_ural_expo_arms_idea: "러시아 무기 박람회"
 URA_our_import_idea: "수입 대체"
 URA_ter_orobona: "우랄 영토 방위"
 URA_arms_force: "우랄 공화국군"
 URA_grea_ural_idea: "위대한 우랄"
 URA_eltsyn_centr_idea: "보리스 옐친 대통령 센터"
 URA_transport_reform_idea: "교통 개혁"
