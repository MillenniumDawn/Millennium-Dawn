 CHI_16th_congress_succession_tt: "§Y대회에서 새로운 총서기를 선출합니다.§!\n대회 종료 시점의 §Y$CHI_factional_balance$§!이(가) 후계를 결정합니다. §Y$CHI_shanghai_clique_leaning$§!을(를) 초과하면(§Y-0.30§! 초과 값) 퇀파이가 승리하여 §Y후진타오§!가 자리를 이어받으며, 그 이하이면 상하이방이 §Y쩡칭훙§!을 앉힙니다."
