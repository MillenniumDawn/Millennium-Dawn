 investments_construction_CIC: "§YIndustrie civile§!\nCe bâtiment fournit à l'État de l'industrie pour la production de biens civils ou la construction de nouveaux bâtiments. Peut être converti en industrie militaire si besoin.\n\n§YCoût de base par structure :§! §R$[?global.build_cost_array^1|3]§! milliards"
 investments_construction_CIC_delayed: "§YPrérequis§! :\n[!select_civ_button_click_enabled]"
 investments_construction_MIC: "§YIndustrie militaire§!\nCe bâtiment fournit à l'État de l'industrie pour la production de nouvel équipement militaire. Peut être converti en industrie civile si besoin.\n\n§YCoût de base par structure :§! §R$[?global.build_cost_array^2|3]§! milliards"
 investments_construction_MIC_delayed: "§YPrérequis§! :\n[!select_mil_button_click_enabled]"
 investments_construction_NIC: "§YChantier naval§!\nCe bâtiment fournit à l'État de l'industrie pour construire de nouveaux navires.\n\n§YCoût de base par structure :§! §R$[?global.build_cost_array^3|3]§! milliards"
 investments_construction_NIC_delayed: "§YPrérequis§! :\n[!select_dockyard_button_click_enabled]"
 investments_construction_INF: "§YInfrastructures§!\nCe bâtiment améliore les infrastructures de l'État. Il augmente votre puissance de ravitaillement dans les régions stratégiques et la vitesse de vos divisions, ainsi que l'extraction des ressources brutes.\n\n§YCoût de base par structure :§! §R$[?global.build_cost_array^4|3]§! milliards"
 investments_construction_INF_delayed: "§YPrérequis§! :\n[!select_infrastructure_button_click_enabled]"
 investments_construction_offices: "§YSecteur tertiaire§!\nLes secteurs de bureaux représentent toutes les autres industries de l'économie au-delà de l'extraction et de l'industrie lourde. Cela inclut la finance, les services aux clients, les technologies de l'information, le commerce de détail et bien plus.\n\n§YCoût de base par structure :§! §R$[?global.build_cost_array^5|3]§! milliards"
 investments_construction_offices_delayed: "§YPrérequis§! :\n[!select_office_button_click_enabled]"
 investments_construction_AA: "§YSites SHORAD§!\n\n§YCoût de base par structure :§! §R$[?global.build_cost_array^6|3]§! milliards"
 investments_construction_AA_delayed: "§YPrérequis§! :\n[!select_antyair_button_click_enabled]"
 investments_construction_RAD: "§YStation radar§!\nLes stations radar vous permettent d'obtenir du renseignement sur les troupes ennemies dans les États proches. Elles comprennent divers radars et capteurs, ainsi que des moyens de renseignement et de capacité d'analyse de la situation.\nUn niveau plus élevé augmente sa portée effective.\nSes radars offrent aussi à l'État une meilleure détection des forces aériennes ennemies, donnant à vos appareils plus de chances de les engager.\nDe plus, les radars améliorent la détection des flottes ennemies en mer.\n\n§YCoût de base par structure :§! §R$[?global.build_cost_array^7|3]§! milliards"
 investments_construction_RAD_delayed: "§YPrérequis§! :\n[!select_radar_button_click_enabled]"
 investments_construction_AIR: "§YBase aérienne§!\nCe bâtiment fournit à l'État un déploiement pour vos forces aériennes.\n\n§YCoût de base par structure :§! §R$[?global.build_cost_array^8|3]§! milliards"
 investments_construction_AIR_delayed: "§YPrérequis§! :\n[!select_airbase_button_click_enabled]"
 investments_construction_fuel_silo: "§YRéserve stratégique de ressources§!\nCe bâtiment donne à votre nation davantage de capacité de stocker du §Hcarburant§!.\n\n§YCoût de base par structure :§! §R$[?global.build_cost_array^9|3]§! milliards"
 investments_construction_fuel_silo_delayed: "§YPrérequis§! :\n[!select_strategic_resource_reserve_button_click_enabled]"
 investments_construction_internet_station: "§YInfrastructures réseau§!\nLes infrastructures réseau sont de hautes structures utilisées en télécommunications et radiocommunications pour relayer les transmissions sur de grandes distances, ou des câbles à fibre optique souterrains et des systèmes de cloud computing.\n\n\n§YCoût de base par structure :§! §R$[?global.build_cost_array^10|3]§! milliards"
 investments_construction_internet_station_delayed: "§YPrérequis§! :\n[!select_internet_button_click_enabled]"
 investments_construction_REF: "§YInfrastructures d'énergie renouvelable§!\nLes infrastructures d'énergie renouvelable regroupent toutes les sources d'énergie renouvelable. Cela inclut notamment : parcs solaires, éoliennes, raffineries de biocarburants, usines de charbon de bois, centrales à biocarburants, et plus. Elles utilisent des sources renouvelables et produisent du carburant à partir de celles-ci.\n\n§YCoût de base par structure :§! §R$[?global.build_cost_array^11|3]§! milliards"
 investments_construction_REF_delayed: "§YPrérequis§! :\n[!select_renewable_power_plant_button_click_enabled]"
 investments_construction_POWER_PLANT: "§YCentrale à combustibles fossiles§!\nLa centrale à combustibles fossiles regroupe toutes les sources d'énergie thermoélectrique fossile. Cela inclut notamment : charbon, gaz naturel et pétrole.\n\n§YCoût de base par structure :§! §R$[?global.build_cost_array^12|3]§! milliards"
 investments_construction_POWER_PLANT_delayed: "§YPrérequis§! :\n[!select_fossil_fuel_power_plant_button_click_enabled]"
 investments_construction_NUCLEAR_REACTOR: "§YRéacteur nucléaire§!\nLe bâtiment réacteur nucléaire convertit l'énergie nucléaire en énergie électrique, en consommant de l'uranium moyennement enrichi.\n\n§YCoût de base par structure :§! §R$[?global.build_cost_array^13|3]§! milliards"
 investments_construction_NUCLEAR_REACTOR_delayed: "§YPrérequis§! :\n[!select_nuclear_power_plant_button_click_enabled]"
 investments_construction_agriculture_district: "§YDistrict agricole commercialisé§!\nLe district agricole commercialisé regroupe toute l'agriculture non de subsistance de notre nation. Il inclut l'agro-industrie, les terres arables, les silos à grains, les abattoirs et plus.\n\n§YCoût de base par structure :§! §R$[?global.build_cost_array^14|3]§! milliards"
 investments_construction_agriculture_district_delayed: "§YPrérequis§! :\n[!select_agriculture_button_click_enabled]"
