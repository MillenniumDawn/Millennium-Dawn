 EQ_MOD_CAT_module_surface_drone_control_category_TITLE: "Contrôle autonome des combattants de surface"
 module_naval_surface_drone_control: "Contrôle autonome des combattants de surface"
 module_naval_surface_drone_control_desc: "Les suites de contrôle autonomes permettent aux frégates et destroyers d'opérer avec des besoins d'équipage nettement réduits, automatisant navigation de routine, fusion de capteurs et aide au contrôle des avaries tout en conservant une pleine capacité de combat.\n\n§GIndice du concepteur : le contrôle autonome réduit fortement les besoins en main-d'œuvre tout en améliorant largement capteurs, armes, protection et vitesse. Convient aux combattants de surface avancés à faible équipage, mais a un coût élevé de CI et de puces.§!\n§GIndice concepteur : le contrôle autonome réduit fortement les besoins en effectifs tout en améliorant largement capteurs, armes, protection et vitesse. Il convient aux combattants de surface avancés à faible équipage, mais a des coûts élevés en CI et microprocesseurs.§!"
 support_ship_nuclear_upgrade: "Propulsion Nucléaire"
 support_ship_nuclear_upgrade_desc: "L'installation d'un réacteur naval affranchit ces bâtiments des limites d'autonomie carburant, leur permettant de suivre une force opérationnelle nucléaire sur des déploiements transocéaniques."
 nuclear_propulsion_upgrade_capacity_tt: "§Y$support_ship_nuclear_upgrade$§! Capacité de mise à niveau §G+4§!"
 UKR_world_economical_relations: "Relations économiques ukrainiennes"
 module_futuristic_integrated_missile_radar_control1_desc: "Les systèmes d'information de combat futuristes intègrent l'apprentissage automatique et l'IA pour améliorer la capacité du navire à suivre le lancement, le vol et l'interception des armes ennemies à des vitesses subsoniques, supersoniques, voire hypersoniques.\n\n§GIndice du concepteur : le contrôle de tir améliore l'attaque de canon, les missiles antinavires, la perforation AShM, la DCA et le blindage, rendant un navire armé plus efficace dans plusieurs rôles. Les systèmes avancés offrent de plus forts bonus mais coûtent plus de CI et de puces.§!"
