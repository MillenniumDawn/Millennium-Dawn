 OLV9_desc: "Un lanceur orbital est un véhicule à propulsion fusée utilisé pour emporter une charge utile de la surface terrestre vers l'espace, généralement en orbite terrestre ou au-delà.\n\nLanceur orbital (OLV 2045) :\n§YLancement spatial§! :\nMasse de charge utile : §Y28000§! kg | Fiabilité : §Y95%§!\n§YProduction§! :\nPrix unitaire : $§Y0.36§! milliard | Industrie civile par unité : §Y2§! | Jours de production par unité : §Y360§!"
