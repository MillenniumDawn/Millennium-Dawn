 module_naval_anti_ship_nuclear_torpedo_1: "Torpedo nuclear antibuque I"
 module_naval_anti_ship_nuclear_torpedo_1_desc: "Los torpedos nucleares antibuque combinan un perfil de despliegue de torpedo convencional con una ojiva excepcionalmente potente para maximizar el potencial destructivo contra combatientes de superficie.\n\n§GConsejo de diseño: Los torpedos nucleares antibuque proporcionan un alto ataque de torpedos con guerra antisubmarina adicional. Son ideales para buques de los que se espera que combatan tanto objetivos de superficie como submarinos, pero cuestan más capacidad industrial (IC) y mano de obra que los torpedos convencionales.§!"
