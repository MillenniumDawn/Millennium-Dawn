 alg.450.t: "L'Algérie bascule dans le conflit civil"
 alg.450.d: "Griefs croissants et stabilité s'effondrant ont poussé la nation au-delà du point de rupture. Des factions armées se lèvent tandis que l'État se fracture, plongeant l'Algérie dans une nouvelle ère de conflit intérieur."
 alg.450.a: "La situation échappe à tout contrôle."
