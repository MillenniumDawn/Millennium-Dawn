 UKR_storage_item_t55_tt: "§YT-54/T-55§!\n\n\n£SOV_LAND_T_55A\n\n\n\n보관 중: §Y[?ukraine_has_t55_stockpile|0]§!\n세대: 1947년부터 운용된 1세대 주력전차.\n장비 유형: §Y1세대 전차 차체§!\n\n파생형 계열:\n• T-54\n• T-55A\n• T-55AM\n• T-55AMV\n\n우리 예비 전력 가운데 가장 오래된 전차입니다. §YKMDB§!는 이 차체를 현대식 전차와 중형 보병전투차로 재생산해 우리 군용이나 수출용으로 쓸 수 있습니다."
