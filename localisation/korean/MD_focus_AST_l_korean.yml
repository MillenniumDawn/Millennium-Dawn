 five_eyes_technology_sharing_group_desc: "오스트레일리아, 캐나다, 뉴질랜드, 영국, 미국이 방위 및 안보 혁신을 위해 맺은 기술 공유 파트너십입니다."
 memories_of_howard: "하워드의 기억"
 memories_of_howard_desc: "그는 죽지 않았지만, 존 하워드 재임 시절의 기억은 여전히 많은 이들의 마음에 남아 있습니다. '서민의 왕'의 이미지를 활용하면 노동 계층의 호감과 의회에서 필요한 영향력을 얻을 수 있습니다."
