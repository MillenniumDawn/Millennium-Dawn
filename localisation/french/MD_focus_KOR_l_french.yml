 KOR_hanwha_events.1.t: "Hanwha Acquires Doosan DST"
 KOR_hanwha_events.1.d: "Hanwha Techwin has completed its purchase of Doosan DST, the maker of the K200 and K21 infantry fighting vehicles and the K30 Biho. The business now operates as Hanwha Defense Systems, bringing Korea's armored vehicles and the K9 program under one defense group."
 KOR_hanwha_events.1.a: "Welcome the new owner"
 KOR_hanwha_events.2.t: "Hanwha Defense Is Integrated"
 KOR_hanwha_events.2.d: "Hanwha Land Systems has absorbed Hanwha Defense Systems. Artillery, armored vehicles, and air defense now share one management and one funding pool, ending years of parallel bids for the same army programs."
 KOR_hanwha_events.2.a: "Pool the group's resources"
 KOR_hanwha_events.3.t: "Hanwha Aerospace Absorbs Hanwha Defense"
 KOR_hanwha_events.3.d: "Hanwha Aerospace has absorbed its land systems subsidiary. The K9, K21, Redback, and K30 lines now sit inside one company alongside the group's aero engine business, giving our nation a single prime contractor for land and air defense systems."
 KOR_hanwha_events.3.a: "Form Hanwha Aerospace"
 TT_KOR_hanwha_merge_carry_traits: "§YHanwha Techwin and Hanwha Defense Systems will be replaced by Hanwha Aerospace. Each completed branch capstone carries over as a completed heritage trait.§!"
