 RULE_OPTION_PEACE_IN_OUR_TIME_PATH_AI_DESC: "奥林匹亚政府将派遣特别调查组协助并领导反抵抗运动。随着时间的推移，他们的帮助将恢复法律和秩序，并迫使落基山抵抗军的领导人解散该组织，从而建立一个更加和平和团结的国家。§R必须设定美国规则为后联合时代或大崩溃§!"
 LKT_AI_BEHAVIOR: "@LKT 拉科塔共和国"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH: "垦殖阵线战争"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH_AI_DESC: "北方政府将抛弃和贬低在垦殖阵线组织领导下随机涌入的原住民。因此，拉科塔政府派出的一名过于热心的审计员独自与垦殖阵线领导层会面，导致双方迅速产生分歧，最终导致垦殖阵线控制的堪萨斯州与拉科塔共和国之间发生军事化和战争。§R必须设定美国规则为后联合时代或大崩溃§!"
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH: "垦殖阵线和平"
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH_AI_DESC: "了解了这些报道的混乱后，将进行更多调查，这将导致一些关于垦殖阵线组织的更激进的指控迅速被驳斥。有了这种新的团结，谈判将开始致力于重建国家，并共同努力形成一个更好的经济和社会联盟。§R必须设定美国规则为后联合时代或大崩溃§!"
