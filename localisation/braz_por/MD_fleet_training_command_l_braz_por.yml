 MD_ftc_ex_capital_tt: "§YAircraft Carrier and Surface Group Exercise§!\n\n£navy_experience Navy Experience: §R-450§!\n£command_power Command Power: §R-75§!\nGains National Spirit §YAircraft Carrier and Surface Group Exercise§! for §H90§! days:\n £fuel_consumption_texticon  Navy Fuel Consumption: §R+25%§!\n £attack_battleship_texticon  Capital Ship Attack: §G+3%§!\n£doctrine_mastery §HCapital Ships§! Mastery: [MD_ftc_exercise_mastery_tt_text] per day for §H90§! days\n\nRequires a navy of at least §H8§! ships, including at least one Aircraft Carrier, Helicopter Operator, Battleship, Battlecruiser, Cruiser, Destroyer, Stealth Destroyer or Heavy Frigate."
 MD_ftc_ex_escort_tt: "§YEscort Exercise§!\n\n£navy_experience Navy Experience: §R-450§!\n£command_power Command Power: §R-75§!\nGains National Spirit §YEscort Exercise§! for §H90§! days:\n £fuel_consumption_texticon  Navy Fuel Consumption: §R+25%§!\n £attack_screen_texticon  Screen Attack: §G+3%§!\n£doctrine_mastery §HEscort Vessels§! Mastery: [MD_ftc_exercise_mastery_tt_text] per day for §H90§! days\n\nRequires a navy of at least §H8§! ships, including at least one Screen Destroyer, Frigate, Stealth Frigate, Corvette, Stealth Corvette or Patrol Boat."
 MD_ftc_ex_submarine_tt: "§YSubmarine Exercise§!\n\n£navy_experience Navy Experience: §R-450§!\n£command_power Command Power: §R-75§!\nGains National Spirit §YSubmarine Exercise§! for §H90§! days:\n £fuel_consumption_texticon  Navy Fuel Consumption: §R+25%§!\n £attack_submarine_texticon  Submarine Attack: §G+3%§!\n£doctrine_mastery §HSubmarines§! Mastery: [MD_ftc_exercise_mastery_tt_text] per day for §H90§! days\n\nRequires a navy of at least §H8§! ships, including at least one Attack Submarine or Missile Submarine."
 MD_ftc_ex_operations_tt: "§YFleet Readiness Exercise§!\n\n£navy_experience Navy Experience: §R-450§!\n£command_power Command Power: §R-75§!\nGains National Spirit §YFleet Readiness Exercise§! for §H90§! days:\n £fuel_consumption_texticon  Navy Fuel Consumption: §R+25%§!\n £organization_texticon  Navy Organization: §G+3%§!\n£doctrine_mastery §HSupport Vessels§! Mastery: [MD_ftc_exercise_mastery_tt_text] per day for §H90§! days\n\nRequires a navy of at least §H8§! ships, including at least one Repair Ship and one Support Ship, and at least §H100§! convoys."
