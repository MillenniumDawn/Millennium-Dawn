 CPD_demilitarise_state_button_TT_DEMAND: "Exigir a desmilitarização dos Estados"
 CPD_demilitarise_state_button_TT_CONCESSION: "Propor a desmilitarização dos Estados"
 CPD_demilitarise_state_button_TT__DELAYED_DEMAND: "Exigir a §YDesmilitarização§! transforma os estados inimigos selecionados em zonas onde nenhum militar pode operar. Seu proprietário não pode estacionar tropas ali nem erguer fortificações."
 CPD_demilitarise_state_button_TT__DELAYED_CONCESSION: "Ceder a §YDesmilitarização§! coloca nossos próprios estados sob as mesmas restrições. Seremos incapazes de mover ou estacionar forças nos territórios cedidos."
