l_french:
 internal_factions_events.53.t: "La loyauté du parti sous surveillance"
 internal_factions_events.53.d: "Les cadres communistes ont présenté au gouvernement une liste de fonctionnaires qu'ils jugent idéologiquement peu fiables. Ils exigent une enquête formelle de loyauté et le limogeage de ceux qui ne répondent pas aux normes du parti."
 internal_factions_events.53.o1: "Mener la purge"
 internal_factions_events.53.o2: "Refuser leurs exigences"
 internal_factions_events.53.o3: "Lancer une revue limitée"
 internal_factions_events.54.t: "Les cadres réclament la collectivisation"
 internal_factions_events.54.d: "Les cadres communistes ont perdu patience face aux exploitations agricoles privées. Ils poussent le gouvernement à lancer une collectivisation, consolidant les terres sous contrôle étatique pour accroître l'efficacité et la conformité idéologique."
 internal_factions_events.54.o1: "Soutenir la collectivisation"
 internal_factions_events.54.o2: "Rejeter la proposition"
 internal_factions_events.54.o3: "Poursuivre une réforme agraire limitée"
 internal_factions_events.55.t: "L’industrie exige l’expansion du port"
 internal_factions_events.55.d: "L'industrie maritime a soumis une proposition d'élargissement des installations portuaires le long de la côte, arguant que la congestion leur coûte des millions chaque année. Propriétaires terriens locaux et urbanistes s'y sont opposés, citant les déplacements de population et les perturbations urbaines."
 internal_factions_events.55.o1: "Approuver l'élargissement"
 internal_factions_events.55.o2: "Refuser la proposition"
 internal_factions_events.55.o3: "Négocier un compromis"
 internal_factions_events.56.t: "La piraterie perturbe les routes maritimes"
 internal_factions_events.56.d: "Une recrudescence de la piraterie menace nos voies maritimes commerciales. Les représentants de l'industrie maritime exigent une intervention du gouvernement pour protéger leurs navires et leurs cargaisons, prévenant que l'inaction fera grimper les coûts d'assurance et découragera l'investissement."
 internal_factions_events.56.o1: "Financer un programme d’escorte navale"
 internal_factions_events.56.o2: "Ignorer le problème"
 internal_factions_events.56.o3: "Rechercher une coopération internationale"
 internal_factions_events.57.t: "Un réseau d’espionnage étranger découvert"
 internal_factions_events.57.d: "Les analystes du renseignement ont identifié un réseau d'espionnage étranger opérant à l'intérieur de nos frontières. La communauté du renseignement presse le gouvernement d'agir de façon décisive avant que le réseau n'extraie davantage d'informations classifiées."
 internal_factions_events.57.o1: "Exposer publiquement le réseau"
 internal_factions_events.57.o2: "Neutralisez-le tranquillement"
 internal_factions_events.57.o3: "Ne prendre aucune mesure"
 internal_factions_events.58.t: "La législature remet en question les dépenses en matière de renseignement"
 internal_factions_events.58.d: "À l'approche du prochain cycle électoral, des membres de la législature ont soulevé des questions pointues sur le budget opaque des services de renseignement. Des groupes de défense appellent à davantage de responsabilité, tandis que la communauté du renseignement met en garde : la transparence compromettra les opérations en cours."
 internal_factions_events.58.o1: "Défendre le budget dans son intégralité"
 internal_factions_events.58.o2: "Publier des informations partielles"
 internal_factions_events.58.o3: "S'engager à une transparence totale"
 internal_factions_events.59.t: "Des combattants étrangers franchissent la frontière"
 internal_factions_events.59.d: "Une vague de combattants étrangers a pénétré notre territoire, attirée par le conflit en cours. Ils offrent leurs services à notre cause, bien que leur fiabilité et leur discipline restent incertaines. Les réseaux djihadistes étrangers pressent le gouvernement de leur trouver un rôle."
 internal_factions_events.59.o1: "Les intégrer aux unités régulières"
 internal_factions_events.59.o2: "Les déployer immédiatement au front"
 internal_factions_events.59.o3: "Les refouler à la frontière"
 internal_factions_events.60.t: "Les brigades djihadistes réclament l’autonomie"
 internal_factions_events.60.d: "Enhardies par leurs effectifs croissants, les brigades djihadistes étrangères exigent une reconnaissance formelle comme force autonome opérant sous leur propre structure de commandement. Elles arguent que l'indépendance opérationnelle leur permettra d'agir plus efficacement sans ingérence bureaucratique."
 internal_factions_events.60.o1: "Leur accorder l'autonomie opérationnelle"
 internal_factions_events.60.o2: "Refuser la demande"
 internal_factions_events.60.o3: "Les intégrer au commandement national"
 internal_factions_events.61.t: "La Force Al-Qods demande plus de ressources"
 internal_factions_events.61.d: "La direction de la Force Al-Qods a soumis une demande formelle de financements et de matériels supplémentaires pour élargir ses opérations de proxies régionaux. Elle argüe que l'opportunité stratégique est maintenant et qu'un sous-financement risque de céder l'influence à des puissances rivales."
 internal_factions_events.61.o1: "Assurer un financement complet"
 internal_factions_events.61.o2: "Offrir un soutien partiel"
 internal_factions_events.61.o3: "Refuser la demande"
 internal_factions_events.62.t: "La vulnérabilité d'un voisin"
 internal_factions_events.62.d: "Le renseignement de la Force Al-Qods rapporte qu'un État voisin, actuellement plongé dans un conflit, est vulnérable à la pression par procuration. La fenêtre d'opportunité est étroite, mais les gains stratégiques potentiels sont considérables."
 internal_factions_events.62.o1: "Exploiter la situation"
 internal_factions_events.62.o2: "Partager le renseignement avec les États alignés"
 internal_factions_events.62.o3: "Laisser passer l'occasion"
 establish_political_commissars_decision: "Intégrer des commissaires politiques"
 establish_political_commissars_decision_desc: "Déployer des commissaires du parti au sein des unités militaires pour faire respecter la loyauté idéologique et stimuler le moral. Les commissaires rendront compte directement aux cadres communistes, renforçant leur influence sur les forces armées."
 worker_reeducation_programme_decision: "Programme de rééducation des travailleurs"
 worker_reeducation_programme_decision_desc: "Financer un programme étatique de rééducation pour renforcer l'idéologie du parti parmi la main-d'œuvre. La conformité augmente et la demande des consommateurs baisse tandis que les travailleurs réorientent leurs efforts vers les priorités de l'État."
 maritime_safety_inspections_decision: "Inspections obligatoires de la sécurité maritime"
 maritime_safety_inspections_decision_desc: "Commander un régime d'inspection de sécurité complet dans toutes les installations portuaires et les chantiers navals nationaux. Relever les normes rassure l'industrie et améliore la production des chantiers pendant la période d'inspection."
 naval_shipping_subsidy_decision: "Subvention au transport maritime"
 naval_shipping_subsidy_decision_desc: "Fournir des subventions gouvernementales directes aux opérateurs nationaux de transport longue distance. Le programme étend le rayon d'action de notre flotte marchande et améliore le débit des chantiers."
 counter_intelligence_sweep_decision: "Balayage de contre-espionnage"
 counter_intelligence_sweep_decision_desc: "Autoriser la communauté du renseignement à mener un balayage systématique des réseaux gouvernementaux et militaires à la recherche d'une pénétration étrangère. Les coûts de l'espionnage étranger baissent et la sécurité de nos communications s'améliore pendant l'opération."
 expand_intelligence_network_decision: "Développez les réseaux de renseignement"
 expand_intelligence_network_decision_desc: "Financer l'établissement de nouvelles stations de renseignement à l'étranger et d'actifs de renseignement humain. Le réseau élargi améliore notre capacité à déchiffrer les communications ennemies et à surveiller les mouvements militaires étrangers."
 jihadi_recruitment_drive_decision: "Campagne de recrutement djihadiste"
 jihadi_recruitment_drive_decision_desc: "Parrainer une campagne de recrutement active auprès de réseaux sympathisants pour attirer des combattants étrangers à notre cause. De la main-d'œuvre supplémentaire afflue et notre capacité en forces spéciales croît."
 martyr_glorification_campaign_decision: "Campagne de glorification des martyrs"
 martyr_glorification_campaign_decision_desc: "Lancer une campagne de propagande glorifiant les combattants tombés et élevant le martyre en idéal culturel. La ferveur guerrière monte fortement, bien que le message radicalisant risque d'enflammer le sentiment extrémiste."
 support_proxy_networks_decision: "Prise en charge des réseaux proxy"
 support_proxy_networks_decision_desc: "Canaliser fonds et équipements via la Force Al-Qods vers des groupes proxies régionaux opérant dans les États voisins. Renforcer ces réseaux étend notre portée stratégique et réduit le coût direct du maintien de la pression sur les rivaux."
 quds_force_training_programme_decision: "Programme de formation de la Force Qods"
 quds_force_training_programme_decision_desc: "Autoriser la Force Al-Qods à dispenser un entraînement avancé à la guerre irrégulière à des unités militaires sélectionnées. La maîtrise de la guerre non conventionnelle s'améliore et la capacité en forces spéciales s'élargit."
 internal_factions_events.63.t: "Les sous-traitants font pression pour des contrats d'export"
 internal_factions_events.63.d: "Les contractants de la défense pressent le gouvernement d'appuyer une série de contrats d'exportation d'armes à l'étranger. Ils arguent que les affaires apporteront des recettes importantes et soutiendront les lignes de production nationales, mais les critiques préviennent que des ventes larges pourraient enflammer les tensions régionales et attirer un examen international indésirable."
 internal_factions_events.63.o1: "Approuver les exportations complètes"
 internal_factions_events.63.o2: "Limiter les ventes aux acheteurs alliés"
 internal_factions_events.63.o3: "Rejeter le lobbying"
 defense_procurement_programme_decision: "Programme d'approvisionnement en matière de défense"
 defense_procurement_programme_decision_desc: "Lancer un cycle d'acquisition dédié qui garantit des commandes stables aux fabricants d'armes nationaux. Des contrats soutenus boostent les recettes fiscales de l'industrie militaire et réduisent le fardeau des biens de consommation, récompensant l'industrie de la défense pour sa coopération continue."
 classified_research_programme_decision: "Programme de recherche classifié"
 classified_research_programme_decision_desc: "Engager un financement classifié pour la recherche en technologies militaires menée via des partenaires de l'industrie de la défense. L'investissement accélère la production de recherche et durcit la sécurité des communications, avec un transfert financier au lancement du programme."
 issue_government_bonds_decision: "Émettre des obligations d'État adossées aux banquiers"
 issue_government_bonds_decision_desc: "Autoriser l'émission d'obligations d'État adossées aux banques, gérées via des réseaux bancaires internationaux. L'injection immédiate de capitaux relève la stabilité, bien que le service de la dette fasse légèrement monter les taux d'intérêt pendant la durée."
 attract_foreign_investment_decision: "Attirer les investissements étrangers"
 attract_foreign_investment_decision_desc: "Coordonner avec des contacts bancaires internationaux pour signaler la stabilité et réduire les barrières à l'entrée. La campagne raccourcit le délai pour recevoir des investissements étrangers et augmente les recettes fiscales du capital entrant."
 internal_factions_cadre_purge: "Purge des cadres"
 internal_factions_cadre_purge_desc: "Les commissaires du parti mènent des enquêtes de loyauté dans toute la bureaucratie, renforçant la discipline idéologique au prix d'une perturbation administrative."
 internal_factions_collectivisation_drive: "Campagne de collectivisation"
 internal_factions_collectivisation_drive_desc: "La collectivisation agricole est en cours, perturbant les chaînes d'approvisionnement et accentuant les pénuries de biens de consommation tandis que les fermes privées passent sous contrôle étatique."
 internal_factions_convoy_escort: "Programme d'escorte navale"
 internal_factions_convoy_escort_desc: "Des escortes navales financées par le gouvernement protègent les voies maritimes commerciales, renforçant la confiance et l'expérience de notre personnel naval."
 internal_factions_piracy_losses: "Perturbation du piratage"
 internal_factions_piracy_losses_desc: "Une piraterie incontrôlée perturbe nos voies maritimes, sapant la confiance commerciale et déstabilisant l'économie plus large."
 internal_factions_neutralised_spies: "Réseau d'espionnage démantelé"
 internal_factions_neutralised_spies_desc: "Un réseau de renseignement étranger a été discrètement neutralisé, améliorant nos capacités de contre-espionnage pour un temps."
 internal_factions_transparency_costs: "Coûts de la transparence du renseignement"
 internal_factions_transparency_costs_desc: "La divulgation publique d'opérations de renseignement a affaibli notre sécurité de chiffrement tandis que les adversaires s'adaptent aux méthodes nouvellement révélées."
 internal_factions_jihadi_frontline: "Déploiement djihadiste en première ligne"
 internal_factions_jihadi_frontline_desc: "Des combattants étrangers déployés directement au front pressent agressivement les lignes ennemies, bien que leur manque d'intégration aux forces régulières laisse les flancs exposés."
 internal_factions_jihadi_autonomy: "Force autonome djihadiste"
 internal_factions_jihadi_autonomy_desc: "Les brigades djihadistes autonomes reconnues opèrent sous leur propre commandement, élargissant considérablement notre plafond de forces spéciales."
 internal_factions_jihadi_integrated: "Forces djihadistes intégrées"
 internal_factions_jihadi_integrated_desc: "Des combattants étrangers formellement intégrés à la structure de commandement nationale ont amélioré la cohésion des unités et les taux de récupération organisationnelle."
 internal_factions_quds_expanded: "Opérations élargies de la Force Qods"
 internal_factions_quds_expanded_desc: "Des ressources supplémentaires ont permis à la Force Al-Qods d'élargir ses opérations de proxies, réduisant le coût d'entretien des activités subversives à l'étranger."
 internal_factions_quds_operation: "Opération stratégique de la Force Qods"
 internal_factions_quds_operation_desc: "La Force Al-Qods exploite activement l'instabilité d'un État voisin, offrant un avantage tactique dans les opérations en cours."
 fund_religious_schools_decision: "Financer les écoles religieuses"
 fund_religious_schools_decision_desc: "Canaliser des fonds gouvernementaux vers un réseau d'écoles religieuses sous la tutelle des oulémas wahhabites. Les taux d'alphabétisation s'améliorent et la stabilité sociale monte tandis que les institutions élargissent leur portée."
 enforce_moral_codes_decision: "Appliquer les codes moraux"
 enforce_moral_codes_decision_desc: "Habiliter les autorités religieuses à faire respecter les normes morales publiques dans tout le pays. La mesure renforce l'influence des oulémas et relève la cohésion sociale, bien que des restrictions plus strictes fassent légèrement monter les dépenses de consommation."
 agricultural_subsidies_decision: "Subventions agricoles"
 agricultural_subsidies_decision_desc: "Fournir des subventions directes au secteur agricole pour booster la production et récompenser la faction des agriculteurs pour leur coopération. La dépense initiale réduit les réserves du Trésor, mais les gains de productivité soutiennent l'économie pendant le programme."
 rural_infrastructure_fund_decision: "Fonds pour l'infrastructure rurale"
 rural_infrastructure_fund_decision_desc: "Engager des fonds gouvernementaux dans l'amélioration des routes, de l'irrigation et du stockage en zones rurales. L'investissement allège la charge de travail des districts agricoles et gagne la bienveillance des communautés agricoles."
 infrastructure_investment_programme_decision: "Programme d'investissement dans les infrastructures"
 infrastructure_investment_programme_decision_desc: "S'associer aux grands conglomérats industriels pour financer une modernisation large des infrastructures de la base productive du pays. La production des usines et des bureaux augmente pendant la durée du programme, cimentant le rôle des conglomérats comme pilier de l'économie."