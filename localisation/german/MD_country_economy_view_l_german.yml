 BALANCE_TOOLTIP: "Unsere wöchentliche Bilanz ist $[?treasury_rate|+3] §H billion§!."
 BALANCE_TOOLTIP_DELAYED: "Der Saldo ist die wöchentliche Nettoveränderung unserer Schatzkammer und entspricht den Gesamteinnahmen abzüglich der Gesamtausgaben. Ein negativer Saldo verringert den Bestand der Schatzkammer und führt dazu, dass wöchentlich neue Schulden aufgenommen werden müssen, sobald sie vollständig aufgebraucht ist."
 TREASURY_TITLE: "Staatskasse"
 TREASURY_VALUE: "§Y[?treasury|3]§!"
 TREASURY_TOOLTIP: "Wir haben $[?treasury] §H billion§! in der Staatskasse.\nUnsere wöchentliche Bilanz ist $[?treasury_rate|+3] §H billion§!"
 TREASURY_TOOLTIP_DELAYED: "Unsere Schatzkammer zeigt den Geldbetrag an, der uns für Ausgaben zur Verfügung steht, und kann für Käufe und Investitionen verwendet werden. Wenn die Schatzkammer ins Minus gerät, werden automatisch wöchentlich Schulden aufgenommen, um den Kontostand wieder positiv zu halten.\n\n§t Der Wirtschaftsbildschirm wurde in den Handelsreiter verschoben.§!"
 DEBT_TITLE: "Schulden"
