 ENG_type_23_lifex: "Prolongation de la durée de vie du type 23"
 ENG_type_23_lifex_desc: "La frégate Type 23 fut conçue pour une durée de vie de coque de dix-huit ans, pourtant au milieu des années 2000 les seize navires survivants constituaient toute la force d'escorte. Le programme de prolongation de vie, universellement connu sous le nom de LIFEX, a fait passer chaque coque à tour de rôle par une refonte complète à Devonport : nouveaux groupes électrogènes diesel et boîtes de vitesses, rénovation structurelle, radar Artisan Type 997 en lieu et place du Type 996, et Sea Ceptor remplaçant le Sea Wolf. Les travaux ont poussé certains navires au-delà de trente ans de commission et ont acheté à la Royal Navy la décennie nécessaire pour concevoir un successeur."
 ENG_future_surface_combatant: "Futur combattant de surface"
 ENG_future_surface_combatant_desc: "Ouvert en 1998 et restructuré plus d'une fois, le programme Future Surface Combatant visait à définir ce qui succéderait aux Type 22 et Type 23. Il a traversé les études Sustained Surface Combatant Capability et les concepts C1, C2 et C3 — un navire anti-sous-marin, un navire polyvalent et un patrouilleur océanique — avant de converger vers une seule coque flexible commercialisée comme Global Combat Ship. Chaque frégate britannique conçue ensuite hérite des hypothèses arrêtées ici."
 ENG_ark_royal_class_carrier: "Porte-avions de classe Ark Royal"
 ENG_ark_royal_class_carrier_desc: "Avec Queen Elizabeth et Prince of Wales en service, la question devient celle de leur successeur. Une troisième coque construite selon un dessin révisé mettrait fin à l'arithmétique qui laisse la flotte sans porte-avions de frappe dès qu'un navire entre en grand carénage, et porterait un nom déjà porté par cinq bâtiments de guerre britanniques, le plus récemment le navire de classe Invincible désarmé en 2011."
 ENG_type_45_daring_class: "Destroyer de classe Daring Type 45"
 ENG_type_45_daring_class_desc: "Commandé après le retrait britannique du programme trilatéral de frégates Horizon en 1999, le Type 45 a été construit autour du système Sea Viper, du radar multifonction Sampson monté en tête de mât et du radar longue portée S1850M. Six navires ont été assemblés à Govan, Scotstoun et Portsmouth entre 2003 et 2013 pour remplacer les Type 42. Daring et Dauntless mènent la classe, et ensemble ils donnent à la Royal Navy la plate-forme de défense aérienne de zone la plus capable qu'elle ait jamais mise en œuvre."
 ENG_aukus_programme: "Programme AUKUS"
 ENG_aukus_programme_desc: "Annoncé en septembre 2021, le partenariat AUKUS engage le Royaume-Uni, les États-Unis et l'Australie autour d'un sous-marin d'attaque à propulsion nucléaire commun. Le dessin SSN-AUKUS est dirigé par les Britanniques et naît des études de successeur de l'Astute, associant une chaufferie Rolls-Royce aux systèmes de combat américains et au lancement vertical. La construction est partagée entre Barrow-in-Furness et Osborne, liant trois bases industrielles en une seule chaîne de production pour le reste du siècle."
 ENG_albion_class_lpd: "Quai de plate-forme d'atterrissage de classe Albion"
 ENG_albion_class_lpd_desc: "Le programme de remplacement des transports de chalands de débarquement a livré le HMS Albion et le HMS Bulwark, admis au service en 2003 et 2004 à la place des Fearless et Intrepid usés. Chaque navire embarque un radier inondable pour quatre chalands de débarquement utilitaires, un pont véhicules, un pont d'envol capable d'accueillir deux hélicoptères moyens, et les espaces de commandement d'un état-major de groupe amphibie. Ce sont les plates-formes depuis lesquelles les Royal Marines mettent une brigade à terre."
 ENG_royal_marines_future_commando_force: "Force de commando du futur"
 ENG_royal_marines_future_commando_force_desc: "Le programme Future Commando Force détourne la 3 Commando Brigade de l'assaut amphibie de masse vers le raid avancé persistant. Les commandos opèrent en petites équipes autonomes, travaillent depuis des auxiliaires convertis et des navires de frappe littorale plutôt que depuis une tête de pont, et sont équipés pour la reconnaissance, le sabotage et la saisie de terrains maritimes clés. C'est le plus grand changement de doctrine des Royal Marines depuis la Seconde Guerre mondiale."
 ENG_royal_marines_littoral_response_group: "Groupe de Réponse Littoral"
 ENG_royal_marines_littoral_response_group_desc: "Deux groupes de réponse littorale, l'un tenu dans l'espace euro-atlantique et l'autre à l'est de Suez, maintiennent en permanence en mer un groupe de compagnie commando et ses navires. Articulés autour d'un transport de chalands de classe Albion et d'auxiliaires de classe Bay, ils offrent une capacité permanente d'évacuation, de secours, d'entraînement avec des forces partenaires et de raids, disponible en jours plutôt qu'en semaines qu'il faudrait pour assembler une force opérationnelle."
 ENG_royal_marines_arctic_warfare_centre: "Centre de guerre arctique"
 ENG_royal_marines_arctic_warfare_centre_desc: "La Grande-Bretagne assume l'engagement par temps froid du flanc nord de l'OTAN depuis les années 1970, envoyant chaque hiver la 3 Commando Brigade à Bardufoss et Porsangmoen. Formaliser ce déploiement saisonnier en établissement d'entraînement permanent préserve le cadre des chefs de ski et de montagne, les équipages de véhicules tout-neige et les instructeurs de survie, et maintient les Royal Marines comme formation de référence de l'alliance pour les opérations au-delà du cercle arctique."
 ENG_military.048.t: "La proposition AUKUS"
 ENG_military.048.d: "Londres propose un partenariat trilatéral avec Washington et Canberra, autour d'un sous-marin d'attaque à propulsion nucléaire commun. La conception britannique naît des études de successeur de l'Astute et associe une centrale Rolls-Royce aux systèmes de combat américains et à des cellules de lancement vertical. La demande va plus loin que tout arrangement précédent : depuis l'accord de défense mutuelle de 1958, la propulsion nucléaire navale n'a été partagée qu'avec le Royaume-Uni, et les Britanniques demandent désormais qu'l'Australie y soit admise. L'approbation ouvrirait Barrow-in-Furness et Osborne comme une seule ligne de production et placerait des chasseurs-tueurs alliés dans l'est de l'océan Indien pour le reste du siècle."
 ENG_military.048.a: "Étendre l'accord de propulsion à Canberra"
 ENG_military.048.b: "Le réacteur reste dans l'accord de 1958"
 ENG_military.049.t: "Bateaux nucléaires ou l'ordre conventionnel"
 ENG_military.049.d: "Le Royaume-Uni et les États-Unis ont proposé à l'Australie un sous-marin d'attaque à propulsion nucléaire, le premier jamais fourni à un pays sans armes nucléaires propres. Le prix en est le programme de remplacement conventionnel existant, dont le contrat devrait être purement et simplement annulé et son partenaire européen indemnisé. À la place viennent des rotations via HMAS Stirling, un chantier reconstruit à Osborne, et un versement aux bases industrielles britannique et américaine pour acheter le débit dont nos propres sous-marins auront besoin. La décision engage le Commonwealth à une force sous-marine qu'il ne peut entretenir sans soutien allié, et au partenariat qui la fournit."
 ENG_military.049.a: "Annuler la commande et construire le nucléaire à Osborne"
 ENG_military.049.b: "Nous honorerons le contrat que nous avons signé"
 ENG_military.050.t: "AUKUS est signé"
 ENG_military.050.d: "Les trois gouvernements ont annoncé le partenariat. L'Australie opérera un sous-marin d'attaque à propulsion nucléaire de conception britannique, et la centrale, le système de combat et les chantiers qui les assemblent sont désormais une entreprise partagée. Barrow-in-Furness gagne une commande à l'export qui sous-tend le successeur de l'Astute pour des décennies, et les ingénieurs navals britanniques, américains et australiens travailleront pour la première fois à partir d'un jeu de plans commun."
 ENG_military.050.a: "Trois marines, un sous-marin"
 ENG_military.051.t: "Le contrat est déchiré"
 ENG_military.051.d: "Canberra a annulé le programme de sous-marins sans préavis et sans consultation, et l'a fait pour saisir une offre anglo-américaine négociée dans notre dos. La commande était le plus grand contrat de défense que nos constructeurs navals aient jamais remporté, et sa perte pèse directement sur les chantiers et les équipes de conception qui avaient déjà commencé le travail. Nos ambassadeurs sont rappelés. Quel que soit l'argument stratégique du nouvel arrangement, les alliés n'apprennent pas de telles décisions par la presse."
 ENG_military.051.a: "Un coup de poignard dans le dos"
 ENG_military.052.t: "Washington retient le réacteur"
 ENG_military.052.d: "Les États-Unis ont refusé d'étendre la propulsion nucléaire navale au-delà de l'accord de 1958. Les objections de non-prolifération allaient forcément être soulevées, et Washington a décidé qu'elles l'emportaient sur le gain stratégique. Le sous-marin sera construit, mais il sera construit seul."
 ENG_military.052.a: "Alors nous le construirons nous-mêmes"
 ENG_military.053.t: "Canberra décline"
 ENG_military.053.d: "L'Australie a choisi de conserver son programme de sous-marins existant. L'offre d'un bateau à propulsion nucléaire comportait des obligations que Canberra n'était pas prêt à accepter, des frais d'annulation à une dépendance de maintenance sur plus d'un demi-siècle. Le partenariat n'ira pas de l'avant."
 ENG_military.053.a: "L'offre tient s'ils changent d'avis"
 ENG_military.054.t: "AUKUS annoncé"
 ENG_military.054.d: "Le Royaume-Uni, les États-Unis et l'Australie ont annoncé un partenariat de sécurité trilatéral dont la première entreprise est un sous-marin d'attaque à propulsion nucléaire commun. L'Australie devient le premier pays sans armes nucléaires à en opérer un. La réaction est immédiate : les experts en prolifération interrogent les garanties sur le combustible naval hautement enrichi, Pékin condamne l'arrangement comme un bloc dirigé contre lui, et le partenaire européen dont le contrat a été annulé a rappelé ses ambassadeurs."
 ENG_military.054.a: "L'équilibre indo-pacifique bascule"
 AST_aukus_submarine_programme: "Programme sous-marin AUKUS"
 AST_aukus_submarine_programme_desc: "Le chantier d'Osborne est reconstruit pour assembler des sous-marins d'attaque à propulsion nucléaire de conception britannique, avec une main-d'œuvre formée par des rotations vers Barrow-in-Furness et les chantiers américains. Les centrales arrivent en unités scellées, mais la coque, l'intégration du système de combat et une vie entière de soutien restent en Australie-Méridionale, donnant au Commonwealth une industrie sous-marine qu'il n'a jamais eue à cette échelle."
 britain_md.300.t: "Les briques sous le dessin"
 britain_md.300.d: "Arm rachète Artisan Components, passant des dessins de processeurs aux bibliothèques physiques qui transforment tout dessin en silicium réel. C'est un pas vers le haut de la chaîne de valeur et hors du pur métier de licence. Le Trésor doit décider si le crédit d'impôt recherche britannique suit l'entreprise jusque-là."
 britain_md.300.a: "Étendre le crédit recherche au travail de conception physique"
 britain_md.300.b: "Laisser l'acquisition reposer sur ses seuls mérites commerciaux"
 britain_md.301.t: "Le processeur dans chaque poche"
 britain_md.301.d: "Un cœur Arm siège au centre du nouveau téléphone d'Apple, et de presque tous les rivaux qui suivront. La redevance par puce se compte en pennies et le volume en milliards. Cambridge a bâti quelque chose dont toute l'industrie dépend désormais, sans en posséder rien."
 britain_md.301.a: "Financer le pôle de conception de Cambridge autour"
 britain_md.301.b: "Laisser le modèle de licences se porter seul"
 britain_md.302.t: "Soixante-quatre bits"
 britain_md.302.d: "ARMv8 porte l'architecture Arm à 64 bits, et avec elle dans les serveurs et centres de données qu'Intel possédait sans vrai concurrent. Whitehall peut placer le calcul public derrière l'architecture britannique ou laisser la question au marché. Les marchés publics sont le seul levier qui agit aussi vite."
 britain_md.302.a: "Engager le calcul public sur l'architecture"
 britain_md.302.b: "Garder la plateforme commercialement neutre"
 britain_md.303.t: "L'offre SoftBank"
 britain_md.303.d: "SoftBank a proposé 24,3 milliards de livres pour Arm, à une prime qu'aucun acheteur britannique n'égalera, avec des engagements sur le siège et les effectifs britanniques. L'entreprise resterait à Cambridge. La propriété, elle, ne resterait pas britannique."
 britain_md.303.a: "Prendre une participation publique avant la clôture de la vente"
 britain_md.303.b: "Accepter les engagements et laisser la vente se faire"
 britain_md.304.t: "Quarante milliards de dollars pour Arm"
 britain_md.304.d: "Nvidia a accepté d'acheter Arm à SoftBank. Les propres licenciés d'Arm, qui concurrencent Nvidia sur tous les marchés qui comptent, ont demandé publiquement quelle neutralité survivrait à la vente. La décision appartient à l'autorité de la concurrence, et aux ministres qui l'instruisent."
 britain_md.304.a: "Autoriser la vente sous conditions comportementales contraignantes"
 britain_md.304.b: "Le renvoyer pour motif de sécurité nationale"
 britain_md.305.t: "Où armer les listes"
 britain_md.305.d: "SoftBank relance Arm en Bourse et a choisi New York. On a dit clairement à Londres que ses règles de cotation, ses pondérations d'indices et sa base d'investisseurs ne pouvaient retenir la plus grande entreprise technologique que la Grande-Bretagne ait produite. Garder l'introduction au pays impliquerait de réécrire les trois."
 britain_md.305.a: "Réformer les règles de cotation et ancrer l'introduction à Londres"
 britain_md.305.b: "Accepter la cotation new-yorkaise et garder le siège"
 britain_md.306.t: "Quel bras est devenu"
 britain_md.306.d: "Un quart de siècle de licences, de rachats et de cotations a fixé ce qu'est Arm : qui possède l'entreprise de Cambridge dont l'architecture siège dans presque chaque téléphone de la planète, et quelle place lui met un prix."
 britain_md.306.a: "Une participation souveraine dans l'architecture"
 britain_md.306.b: "L'architecture de la plateforme de quelqu'un d'autre"
 britain_md.306.c: "Cotée sur le marché intérieur"
 britain_md.306.e: "Une île qui licencie le monde"
 ENG_arm_sovereign_architecture_stake: "Enjeu d’architecture souveraine"
 ENG_arm_sovereign_architecture_stake_desc: "L'État détient des parts dans l'entreprise dont le jeu d'instructions sert de base au monde, et un droit de veto sur sa suite. La participation rapporte moins que le marché et achète ce que le marché ne vend pas."
 ENG_arm_foreign_platform_architecture: "Architecture d'une plateforme étrangère"
 ENG_arm_foreign_platform_architecture_desc: "Arm appartient désormais à une plus grande entreprise, et la feuille de route sert d'abord le silicium de celle-ci. L'ingénierie se fait encore à Cambridge, à une échelle qu'aucun concédant indépendant n'aurait pu financer, et aux conditions d'un autre."
 ENG_arm_listed_at_home: "Cotée sur le marché intérieur"
 ENG_arm_listed_at_home_desc: "L'introduction est restée à Londres, et les règles ont été réécrites pour la retenir. La place a enfin un ancrage technologique, et les réformes qui l'ont gagné s'appliquent à quiconque se cote ensuite."
 ENG_arm_licensing_island: "Une île qui licencie le monde"
 ENG_arm_licensing_island_desc: "Les dessins sont britanniques, les propriétaires non, et les actions se négocient à New York. La Grande-Bretagne garde les ingénieurs, les redevances et la réputation, et aucun du contrôle qui fut deux fois à portée et deux fois décliné."
 ENG_scottish_agitation_rising_tt: "L'agitation écossaise est supérieure à 10."
 ENG_north_irish_agitation_rising_tt: "L'agitation nord-irlandaise est supérieure à 10."
 ENG_wales_agitation_rising_tt: "L'agitation galloise est supérieure à 10."
 devolution.20.t: "Le déclassement échoue"
 devolution.20.d: "La Commission internationale indépendante de démantèlement a suspendu ses travaux. La tension sur le terrain a grimpé plus vite que les inspecteurs ne pouvaient certifier les caches, et les directions paramilitaires ont retiré leurs interlocuteurs plutôt que d'être vues désarmer pendant que les rues brûlent. Les organisations loyalistes comme républicaines insistent que les armes n'ont jamais été l'obstacle, et chacune blâme l'autre pour l'effondrement. Rien de ce qui a été mis hors d'usage ne reviendra, mais rien de plus ne sera remis non plus, et le mouvement sera bien plus dur à ramener à la table maintenant que ses durs peuvent dire qu'ils avaient raison."
 devolution.20.a: "Faire retomber la tension et réessayer"
 devolution.21.t: "Au-delà de l'utilisation"
 devolution.21.d: "La Commission a rapporté qu'elle a assisté au démantèlement de la totalité des arsenaux restants. Des caches scellées de fusils, de Semtex, de mortiers et de mitrailleuses lourdes ont été rendues définitivement inaccessibles sous supervision indépendante, des clergymen des deux communautés se tenant comme témoins. Les factions dissidents qui ont passé des années à dénoncer le processus de paix comme une trahison se retrouvent sans la seule chose qui valait d'être dénoncée. Le recrutement s'est effondré, les réseaux de collecte aux États-Unis se sont taris, et Special Branch estime que ce qui reste est un reliquat criminel plutôt qu'une insurrection. L'Irlande du Nord n'est pas encore réconciliée, mais pour la première fois depuis 1969 elle n'est pas armée."
 devolution.21.a: "La guerre est finie"
 devolution.23.t: "Westminster propose l’unification"
 devolution.23.d: "Le sondage frontalier a rendu une majorité pour une Irlande unie, et aux termes de l'Accord le gouvernement britannique est tenu de donner effet à ce vœu. Londres a formellement invité Dublin à accepter la souveraineté sur les six comtés. L'offre est réelle, et la facture aussi : deux millions de personnes, une subvention que Westminster a portée pendant des décennies, un service de police auquel la moitié de la population ne fait toujours pas confiance, et une communauté unioniste qui a voté contre et qui n'ira nulle part. Accepter signifie que la République hérite de tout cela, avec la plus vieille ambition de la politique irlandaise. Refuser signifie dire à une majorité au Nord que la République ne les veut pas."
 devolution.23.a: "L'Irlande non libre ne sera jamais en paix"
 devolution.23.b: "Nous ne sommes pas prêts à porter le Nord"
 devolution.24.t: "Le sondage frontalier échoue"
 devolution.24.d: "Le dépouillement est là et l'Union tient. La participation a été élevée des deux côtés et la campagne a fait ce que les campagnes en Irlande du Nord font toujours, c'est-à-dire rappeler à chacun ce qui les divise, mais lorsque la question a vraiment été posée la réponse a été non. Les politiciens nationalistes ont déjà commencé à débattre si le sondage a été trop tôt, et les partis unionistes traitent le résultat comme un règlement plutôt qu'un sursis. Le secrétaire d'État a confirmé qu'un autre sondage ne sera pas envisagé dans un avenir prévisible."
 devolution.24.a: "La question est tranchée, pour l'instant"
 devolution.25.t: "Dublin accepte"
 devolution.25.d: "Le Taoiseach a confirmé à la Chambre que la République acceptera la souveraineté sur l'Irlande du Nord. Le transfert procèdera aux termes de l'Accord, avec des garanties pour la communauté unioniste inscrites dans le règlement et la citoyenneté britannique conservée par tous ceux qui la veulent. Il n'y a ici aucune défaite à venger ni traité imposé sous la menace. Un siècle de question irlandaise se clôt par un vote, une passation, et bien des gens en Ulster qui ne l'appelleront jamais chez eux."
 devolution.25.a: "Le peuple a parlé"
 devolution.26.t: "Dublin refuse"
 devolution.26.d: "La République a refusé. Les ministres à Dublin ont été polis en public et brutaux en privé : la subvention à elle seule avalerait leur budget, le fardeau de sécurité est un qu'ils n'ont pas la capacité de porter, et il n'y a aucun appétit dans les vingt-six comtés pour hériter d'une minorité unioniste qui les considère comme une puissance étrangère. Le Nord a voté pour partir et s'est entendu dire qu'il n'y a nulle part où aller. L'opinion nationaliste a pris le refus comme une humiliation, et c'est Westminster qui vivra avec les conséquences."
 devolution.26.a: "Nous restons avec la Province sur les bras"
 devolution.27.t: "Le soulèvement d'Ulster"
 devolution.27.d: "Stormont a disparu, l'Accord est lettre morte, et la garantie constitutionnelle qui maintenait le mouvement républicain dans la politique est partie avec. Ce qui a commencé comme des émeutes après l'abrogation est devenu quelque chose que le chef de la police ne décrira plus comme un désordre public. Des commissariats ont été submergés, des patrouilles de l'armée sont engagées à l'arme lourde en plein jour, et une administration provisoire revendiquant l'autorité sur les six comtés a déclaré la Province indépendante de la Couronne. La dernière fois que la Grande-Bretagne a mené cette guerre, il a fallu trente ans et un règlement négocié pour y mettre fin. Il n'y a plus de règlement sur lequel se rabattre."
 devolution.27.a: "Alors nous le reprenons par la force"
 devolution.28.t: "Le soulèvement de l'autre côté de la frontière"
 devolution.28.d: "Les Britanniques ont déchiré l'Accord et le Nord est en révolte ouverte. Un gouvernement provisoire à Belfast a appelé Dublin à la reconnaissance, aux armes et aux hommes, et l'appel a été assez public pour que le silence soit lu comme une réponse. Les articles deux et trois ont été amendés, non oubliés, et il y a ici un électorat qui a attendu toute une vie exactement ce moment. Il y a aussi une armée britannique, une dissuasion nucléaire britannique, et chaque argument que la République a fait depuis 1998 que la frontière ne changerait que par consentement et par rien d'autre."
 devolution.28.a: "Reconnaître le gouvernement provisoire et marcher"
 devolution.28.b: "Les armer, et ne rien admettre"
 devolution.28.c: "Ce n'est pas notre guerre"
 ENG_decommission_paramilitaries: "Désarmer les paramilitaires"
 ENG_decommission_paramilitaries_desc: "The Independent International Commission on Decommissioning has sat since 1997 without ever being handed a complete arsenal. The dissident republican factions that rejected the Agreement have no interest in disarming while they can still recruit, and they recruit wherever the estates are poor and the tension is high. Put the money and the political capital behind the Commission, keep Sectarian Tension low enough that the intermediaries will keep talking, and give it two years, and the last arsenals can be put permanently beyond use. Let tension climb back and the whole process collapses."
 ENG_call_border_poll: "Appelez un bureau de vote à la frontière"
 ENG_call_border_poll_desc: "The Agreement obliges the Secretary of State to call a poll whenever it appears likely that a majority in Northern Ireland would vote for a united Ireland, and obliges the British government to give effect to the result. Nationalist parties now hold the balance at Stormont and the demand can no longer be deferred without breaking the Agreement outright. A poll takes a year to campaign and the result will be whatever Northern Irish opinion has become by the time it is counted, so the year of campaigning matters as much as the decision to call it.!"
 ENG_border_poll_mission: "La campagne du scrutin frontalier"
 ENG_border_poll_mission_desc: "Le scrutin a été convoqué et la campagne a un an pour se dérouler. Le résultat sera décidé par le niveau du nationalisme nord-irlandais le jour du vote, non par celui du jour où la date a été fixée. Une nette majorité nationaliste emporte la Province hors de l'Union et dans la République, pourvu que Dublin l'accepte. Tout en deçà laisse la question constitutionnelle close pour des années et un mouvement nationaliste battu aux urnes et qui le sait.\n\nNationalisme nord-irlandais : §Y[?ENG_north_irish_nationalists|0]§!\nUn Oui clair exige plus de §G65§!."
 ENG_all_ireland_dominion: "Un dominion de toute l'Irlande"
 ENG_all_ireland_dominion_desc: "La République répondant déjà à Londres, la frontière est devenue une ligne administrative plutôt que constitutionnelle. Remettre les six comtés à Dublin ne nous coûte rien que nous n'ayons déjà sécurisé : l'île entière est gouvernée depuis une capitale que nous gouvernons. Cela règle à notre avantage et à notre convenance le plus ancien grief de ces îles, retire la subvention et la garnison, et laisse le mouvement républicain avec une Irlande unie qu'il ne peut célébrer.\n\nCela exige que la dévolution nord-irlandaise soit véritablement réglée d'abord. Une province remise au milieu d'une crise est une crise exportée, non résolue.\n\nTension communautaire : §Y[?ENG_north_irish_agitation|0]§!/§G10§!\nDépendance nord-irlandaise : §Y[?ENG_north_irish_dependency|0]§!/§G70§!\nPression indépendantiste : §Y[?ENG_north_irish_pressure|0]§!/§G40§!"
 ENG_repeal_good_friday_agreement: "Abroger l'accord du Vendredi saint"
 ENG_repeal_good_friday_agreement_desc: "L'accord nous coûte une subvention permanente, un appareil de police gonflé et un exécutif de partage du pouvoir où des hommes qui ont jadis mené des campagnes d'attentats occupent des ministères. Abrogez-le, suspendez Stormont, et gouvernez la Province directement depuis Londres comme avant 1998. Les économies sont immédiates, et tout le reste aussi : la garantie constitutionnelle qui maintenait le mouvement républicain dans la politique disparaît, les paramilitaires reviennent, et la tension communautaire se fera sentir de tout son poids, sans rien pour l'adoucir.\n\nL'Ulster se soulèvera. Nous aurons quelques mois pour tenir la Province avant qu'il ne le fasse."
 ENG_repeal_gfa_remove_TT: "Retirer §Y$ENG_good_friday_agreement$§!"
 ENG_ulster_on_the_brink_activated_TT: "We have §Y180§! days to force §YNorthern Irish Sectarian Tension§! below §G20§!, or the Provisional Republican Leadership declares §RIndependance§! and we fight for §YUlster§!"
 ENG_ulster_on_the_brink: "Ulster au bord du gouffre"
 ENG_ulster_on_the_brink_desc: "L'accord a disparu et la Province se délite. Les émeutes sont devenues persistantes, l'armée est de retour dans les rues en nombres jamais vus depuis les années soixante-dix, et les deux communautés s'arment en supposant que personne ne viendra les protéger. Si la tension communautaire peut être ramenée en six mois, la Province pourra être tenue sans accord et sans soulèvement. Sinon, la direction républicaine provisoire se déclarera et nous combattrons pour l'Ulster.\n\nTension communautaire : §Y[?ENG_north_irish_agitation|0]§!\nDoit tomber sous §G20§!."
 OPEN_devolution_BUTTON: "Questions décentralisées"
 OPEN_devolution_BUTTON_TT: "Ouvrir le panneau de dévolution et gérer l'Écosse, le pays de Galles et l'Irlande du Nord."
