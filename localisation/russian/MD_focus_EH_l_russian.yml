 EH_research_sites_prep_time_shortened_TT: "§YМеста проведения исследований§! Время строительства сокращается за счет §G[?EH_temp_research_sites_prep_time_var] дни§!."
 EH_andrzej_trautman_special_effect_tt: "§YАнджей Траутман§! имеет §G5%§! Каждую неделю появляется шанс добавить §G3%§! к активному §Yспециальный проект§! Прогресс в этом списке:\n- §Y$sp_monitor_portal_energy_emissions_project$§!\n- §Y$sp_spies_in_hive_project$§!\n- §Y$sp_the_tesla_weapon_project$§!"
 EH_fabiola_gianotti_special_effect_tt: "Фабиола Джанотти (§YFabiola Gianotti§!) будет исследовать дополнительные свойства рандаллита (§YRandallite§!), что позволит увеличить еженедельную добычу этого ресурса на 50% на каждой шахте."
 EH_lene_hau_special_effect_tt: "§YЛене Хау§! основное внимание будет уделено пониманию §RПорталы§! выбросы энергии, которые будут сокращаться §Y$EH_but_how_does_this_key_work$§! & §Y$EH_project_tesla$§! фокусируется на времени выполнения §G30 дней§!."
 EH_randallite_discovery_TT: "Доктор Лиза Рэндалл (§YDr. Lisa Randall§!) открыла §YRandallite§! как новый ресурс."
 EH_add_randallite_effect_tt: "[THIS.GetFlag][THIS.GetAdjective] §YRandallite stockpile§!: [?add_randallite|=+.0]\n"
 EH_randallite_tab_enabled_idea_TT: "Включает §YРэндаллит§! и §YМеханик§! окно управления в §GВкладка «Производство»§!где вы можете отслеживать запасы, добычу и использование рандаллита, а также производить новые боевые машины HACS для армии.\n\nЭффект от использования рандаллита умножается на количество этого ресурса в запасе."
 EH_randallite_available_tt: "§YRandallite§! в наличии > §Y[?check_randallite]§! (В наличии: §Y[?EH_randallite_stockpile]§!)."
 EH_find_new_veins_TT: "Открывает новые возможности для поиска вен §YRandallite§! в контролируемых штатах."
 EH_randallite_veins_limit_TT: "В настоящее время построено следующих шахт: §Y[?EH_total_mines]§!/§Y[?EH_controlled_states]§! (все контролируемые территории, разделенные на §Y7§!)."
 EH_non_state_mines_modifier_TT: "Включает модификатор §YNon-State Randallite Mines§!, который предоставляет §G+5%§! §YCorporate Tax Income§! за каждый негосударственный рудник."
 EH_non_state_mines_TT: "Каждая шахта по добыче рандаллита, не относящаяся к государственным проектам (§YNon-State Randallite Mine§!), будет учитываться в лимите новых шахт."
