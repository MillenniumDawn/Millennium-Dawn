 SIA_asean_hegemony_government_tt: "Ni §Y[conservatism_L]§! ni §Y[socialism_L]§! n'est le parti au pouvoir."
 SIA_path_populist: "§Y[neutral_Social_L]§! is the committed political path."
 SIA_path_royalist: "§Y[Nat_Autocracy_L]§! or §Y[Monarchist_L]§! is the committed political path."
 SIA_path_reform: "§Y[socialism_L]§! is the committed political path."
 SIA_path_communist: "§Y[communist_state_L]§! is the committed political path."
 SIA_path_democrat: "§Y[conservatism_L]§! is the committed political path."
 SIA_committed_to_ballot: "Engagé aux urnes"
 SIA_bhumjaithai_coalition: "£SIA_Neutral_conservatism_1 §Y(BJT) - Bhumjaithai Party§! holds the balance of power."
 SIA_tt_shan_militia_support: "Requiert un soutien des milices shan d'au moins 60."
 SIA_tt_reform_pressure: "Nécessite une pression réformatrice supérieure à 20"
 SIA_tt_populist_tide_20: "Requiert la marée populiste au-dessus de 20."
 SIA_tt_palace_bargain_support: "Requiert que le bloc royaliste de la maison Mahidol tienne plus de 15 pour cent des voix."
 SIA_tt_china_contracts_renegotiated: "Les contrats chinois n'ont pas déjà été renégociés."
 SIA_tt_us_security_reviewed: "La revue de sécurité États-Unis–Thaïlande n'a pas déjà été close."
 SIA_tt_tax_modernized: "La collecte des recettes n'a pas déjà été modernisée."
 SIA_tt_gripen_ef_contracted: "Le contrat Gripen E/F n'a pas déjà été signé."
 SIA_the_quiet_word: "Le mot discret"
 SIA_the_quiet_word_desc: "A phone call from the right office does what tanks used to. The network makes clear whose government this really is, and the message is received without a shot fired. The elections stay and the ballots are counted, and the country drifts toward the palace anyway."
 SIA_judicial_review_route: "Gouvernement par injonction"
 SIA_judicial_review_route_desc: "La Cour constitutionnelle trouve un vice de forme, et le parti au pouvoir se dissout du jour au lendemain. Pas de caserne, pas de couvre-feu, seulement un verdict et un transfert de pouvoir très silencieux."
 SIA_the_appointed_senate: "Une Chambre haute, triée sur le volet"
 SIA_the_appointed_senate_desc: "Deux cent cinquante sièges qu'aucun bulletin ne touche jamais, remplis par le réseau et redevables à lui seul. Chaque gouvernement gouverne désormais au bon plaisir du Sénat."
 SIA_coalition_kingmakers: "Faiseurs de rois de la coalition"
 SIA_coalition_kingmakers_desc: "Sièges au cabinet, allocations budgétaires, et un mot discret aux bons courtiers du pouvoir assemblent un gouvernement qui répond au réseau du palais avant de répondre aux électeurs."
 SIA_constitutional_engineering: "Ingénierie de la charte"
 SIA_constitutional_engineering_desc: "Une nouvelle constitution, rédigée en salles de commission plutôt qu'à la pointe du fusil, verrouille les avantages du réseau dans la loi fondamentale du pays. Rien de tout cela n'a nécessité un seul soldat."
 SIA_the_establishment_consensus: "Le consensus de l'establishment"
 SIA_the_establishment_consensus_desc: "Cours, Sénat, armée et affaires bougent désormais comme un seul, et les élections sont devenues une formalité que le réseau gagne toujours. Personne n'a eu à appeler les chars."
 SIA_judicial_review_route_choice_tt: "Choisissez jusqu'où va l'arrêt de la Cour constitutionnelle.\n - §YUne dissolution complète§! : brise la popularité du parti mais nourrit la pression réformatrice\n - §YUn arrêt technique étroit§! : coûte moins"
 SIA_coalition_kingmakers_choice_tt: "Choisissez un partenaire de coalition.\n - §YLes courtiers de pouvoir provinciaux§! : rachetés par le Trésor\n - §YL'élite des affaires§! : courtisée à un petit coût de stabilité"
 SIA_royalist_no_coup_path: "Engagé sur la voie royaliste sans coup (monarchie de réseau)"
 SIA_establishment_category: "Gestion d'établissement"
 SIA_establishment_category_desc: "Les outils d'une monarchie de réseau qui n'a jamais eu besoin d'un coup : le Sénat nommé, un banc coopératif, et les propres canaux de persuasion du palais."
 SIA_senate_procedural_vote: "Appeler un vote procédural"
 SIA_senate_procedural_vote_desc: "Aligner la chambre nommée derrière une mesure que la chambre élue ne passerait jamais. Cela coûte du capital politique, mais le vote n'est jamais vraiment en doute. §GLa stabilité monte.§!"
 SIA_court_referral: "Renvoyer à la Cour"
 SIA_court_referral_desc: "Remettre la dernière manœuvre des populistes à un banc sympathique et laisser un arrêt faire le travail qu'une élection refuse. §RLa popularité du parti au pouvoir chute, mais la tactique nourrit d'autant plus la pression réformatrice qu'on l'emploie.§!"
 SIA_palace_audience: "Demander une audience au palais"
 SIA_palace_audience_desc: "Une audience formelle tient l'armée et les vieilles familles foncières satisfaites que le réseau parle encore pour elles. §GL'opinion militaire et foncière s'améliore.§!"
 thailand.434.t: "La Cour statue"
 thailand.434.d: "La Cour constitutionnelle rend son verdict sur la conduite du parti au pouvoir. Tout le monde dans la salle d'audience sait déjà de quel côté cela va aller."
 thailand.434.a: "Dissoudre le parti sans détour"
 thailand.434.b: "Restreindre l'arrêt à un vice de forme"
 thailand.435.t: "Le marché des faiseurs de rois"
 thailand.435.d: "Assembler un gouvernement avec lequel le réseau peut vivre signifie payer quelqu'un. La seule question est qui, et en quelle monnaie."
 thailand.435.a: "Racheter les chefs provinciaux"
 thailand.435.b: "Courtiser l'élite des affaires"
 SIA_no_lar_dlc_tt: "Requiert l'extension La Résistance pour la mécanique complète d'agence de renseignement. Du pouvoir politique est accordé à la place."
 SIA_the_national_intelligence: "L'Agence nationale de renseignement"
 SIA_the_national_intelligence_desc: "Une seule Agence nationale de renseignement siège désormais au-dessus de la police, de l'armée et des services civils qui se disputaient les mêmes informations. La fonder est coûteux, et les agences qu'elle absorbe ne cèdent pas leur chasse gardée sans combat."
 SIA_special_branch_police: "Branche spéciale"
 SIA_special_branch_police_desc: "Une aile de police politique et antiterroriste dédiée donne à l'État un œil plus aiguisé sur la subversion et les troubles. Les officiers s'attendent à ce que le financement corresponde au mandat, et cette attente ne disparaît pas une fois l'unité debout."
 SIA_counter_insurgency_south: "Le feu du Sud"
 SIA_counter_insurgency_south_desc: "Les atouts de renseignement se déplacent vers le sud, vers l'insurrection à Pattani, Yala et Narathiwat, chassant des réseaux que l'armée seule n'aurait jamais pu cartographier. La répression achète du terrain contre les militants, mais elle l'achète avec la patience de la province."
 SIA_signals_intelligence: "L'État à l'écoute"
 SIA_signals_intelligence_desc: "Une aile de signaux et de cryptographie donne à la Thaïlande ses propres oreilles sur les ondes et les réseaux de la région. Cryptanalystes et fermes de serveurs sont une dépense permanente qui ne s'éteint jamais."
 SIA_humint_networks: "Des hommes sur le terrain"
 SIA_humint_networks_desc: "Officiers traitants et informateurs payés bâtissent un réseau humain à travers les frontières qu'aucun satellite ne peut remplacer. Recruter et faire tourner des agents ainsi est un travail coûteux, sans éclat, et il se paie en capital politique, pas en fanfare."
 SIA_cia_partnership: "La connexion Langley"
 SIA_cia_partnership_desc: "Un canal de liaison formel avec la Central Intelligence Agency troque accès et formation contre un penchant vers Washington. Chaque fil qui court vers Langley est un fil que Langley peut lire dans les deux sens."
 SIA_mss_cooperation: "La poignée de main du Guoanbu"
 SIA_mss_cooperation_desc: "Un canal discret vers le ministère chinois de la Sécurité d'État troque la coopération contre un penchant vers Pékin. La relation approfondit les liens sino-thaïlandais, mais elle porte la même exposition à double sens que toute liaison étrangère."
 SIA_the_watchful_state: "L'État vigilant"
 SIA_the_watchful_state_desc: "La police intérieure et le renseignement étranger sont fusionnés en un seul appareil de sécurité permanent, sa portée étendue par de nouvelles améliorations d'agence et de nouveaux officiers sur le terrain. Faire tourner tout cela est désormais une ligne permanente du budget."
 SIA_surveillance_state: "Panoptique"
 SIA_surveillance_state_desc: "Le mandat de l'agence est étiré à sa limite, la capacité de détection et de défense élevée aussi haut que la loi le permet et un peu plus loin. Les entreprises râlent sous le regard, le Trésor saigne du capital politique, et la stabilité paie la différence."
 SIA_accountable_oversight: "État de droit"
 SIA_accountable_oversight_desc: "Le contrôle judiciaire, le contrôle parlementaire et les exigences de reporting public sont boulonnés sur l'agence, troquant la puissance brute de détection contre la légitimité et une moindre corruption. Le service est plus lent et moins omniscient, mais il répond à quelqu'un d'autre que lui-même."
 SIA_national_intelligence_idea: "Doctrine du renseignement national"
 SIA_national_intelligence_idea_desc: "L'éthique fondatrice de la nouvelle agence se répand dans la bureaucratie : l'information est le pouvoir, et chaque ministère la fait désormais remonter. L'habitude de veiller survit à n'importe quel gouvernement en fonction."
 SIA_territorial_defense: "Doctrine de défense du territoire"
 SIA_territorial_defense_desc: "Les soldats du Royaume sont entraînés à tenir le terrain plutôt qu'à le chasser. Les formations s'enterrent, les ingénieurs lèvent la frontière pour des ouvrages permanents, et une doctrine défensive s'empare des forces armées, durcissant l'infanterie et accélérant le rythme de fortification avant le premier coup de feu."
 SIA_shorad_defense: "Défense aérienne à courte portée"
 SIA_shorad_defense_desc: "Missiles à courte portée, canons guidés par radar et sites AA durcis sont tissés en un seul bouclier qui se recouvre. Les aéronefs ennemis qui s'égarent dans les cieux thaïlandais trouvent chaque approche déjà télémétrée et chaque batterie prête à répondre."
 SIA_border_fortification_program: "Programme de fortification des frontières"
 SIA_border_fortification_program_desc: "Le Corps du génie reçoit un mandat permanent et un budget permanent : lever, couler et s'enterrer le long de toute la frontière, y compris la longue et mince frontière lao, pour que de nouveaux ouvrages s'élèvent plus vite et que les troupes retranchées tiennent plus dur partout où il le faut."
 SIA_anti_amphibious_command: "Commandement anti-amphibie"
 SIA_anti_amphibious_command_desc: "Un commandement dédié étudie chaque plage et chaque embouchure qu'un envahisseur pourrait utiliser. Batteries côtières, capteurs étagés et forces de réaction entraînées font d'un débarquement sur les rives du Royaume un pari sanglant et incertain."
 SIA_defend_myanmar_border: "Fortifier la frontière du Myanmar"
 SIA_defend_myanmar_border_desc: "La marche occidentale accidentée avec le Myanmar court sur toute la longueur du Royaume. Lignes de bunkers et positions préparées sont creusées dans les cols et les vallées fluviales, transformant le terrain difficile en un mur."
 SIA_defend_cambodia_border: "Fortifier la frontière cambodgienne"
 SIA_defend_cambodia_border_desc: "Les souvenirs des affrontements à Preah Vihear sont encore frais. La frontière orientale est durcie de nouveaux ouvrages pour qu'aucun litige futur ne trouve les soldats du Royaume à découvert."
 SIA_defend_malaysia_border: "Fortifier la frontière malaisienne"
 SIA_defend_malaysia_border_desc: "Le Deep South agité est tramé de bunkers et de points d'appui, ancrant la frontière avec la Malaisie et donnant aux garnisons de Pattani un sol dur où se replier."
 SIA_fortress_thailand: "Forteresse Thaïlande"
 SIA_fortress_thailand_desc: "Chaque frontière est murée, chaque approche télémétrée. Combattant sur le sol natal, les formations thaïlandaises frappent et tiennent avec la confiance d'un défenseur qui connaît le terrain. Un envahisseur se vide dans la chaleur, les collines et les lignes préparées sans fin."
 SIA_defend_myanmar_border_tt: "Builds §YLevel 2§! land forts in §Y9§! border provinces, immediately.\n - §YNorthern Thailand§!: 4 provinces\n - §YCentral Thailand§!: 2 provinces"
 SIA_defend_cambodia_border_tt: "Construit immédiatement des forts terrestres de §Yniveau 2§! dans §Y6§! provinces frontalières.\n - §YThaïlande centrale§! : 3 provinces\n - §YIsan§! : 3 provinces"
 SIA_defend_malaysia_border_tt: "Construit immédiatement des forts terrestres de §Yniveau 2§! dans §Y5§! provinces frontalières.\n - §YPattani§! : 4 provinces\n - §YThaïlande du Sud§! : 1 province"
 SIA_sovereign_wealth_fund_allocation: "Allouer le fonds souverain"
 SIA_sovereign_wealth_fund_allocation_desc: "Diriger une autre tranche de redevances de ressources vers le portefeuille étranger du fonds souverain. L'allocation verrouille le capital pendant un an avant que ses rendements ne commencent à alimenter le budget."
 SIA_state_resource_stake: "Prendre une participation dans les ressources de l’État"
 SIA_state_resource_stake_desc: "Le Trésor achète directement dans les concessions minières et énergétiques plutôt que de seulement les taxer. Le cash arrive vite ; tout comme la paperasse que personne ne veut regarder de trop près."
 thailand.436.t: "Échapper au piège du revenu intermédiaire"
 thailand.436.d: "Les statisticiens le confirment : la Thaïlande a franchi le seuil de revenu qui a piégé tant de ses voisins pendant une génération. Les usines qui assemblaient autrefois des pièces pour d'autres les conçoivent désormais. La question au cabinet est de savoir quoi faire de ce moment."
 thailand.436.a: "Diffuser la réussite"
 thailand.436.b: "Empocher le dividende"
 SIA_the_army_question: "La question de l'armée"
 SIA_the_army_question_desc: "Un général pour quelques centaines de soldats, des promotions qui courent sur la promotion et la faction avant le mérite, et une masse salariale gonflée par des affaires qui n'ont rien à voir avec la défense. L'armée du Royaume fonctionne, mais pas au métier de soldat. Quelqu'un doit décider quelle armée cela va être."
 SIA_the_professional_turn: "Le tournant professionnel"
 SIA_the_professional_turn_desc: "Moins de soldats, mieux entraînés, répondant au mérite plutôt qu'à la liste de remaniement. C'est la voie plus dure, et elle met en garde chaque général qui a une affaire à protéger."
 SIA_the_reshuffle_list: "La liste de remaniement n'est pas un plan de guerre"
 SIA_the_reshuffle_list_desc: "Le remaniement annuel est le vrai rythme opérationnel des RTARF et il passe sous la signature d'un ministre civil plutôt que sous l'arithmétique propre de la caserne. Le commandement commence à répondre au gouvernement du jour."
 SIA_retire_the_experts: "Retirer les experts"
 SIA_retire_the_experts_desc: "Chaque diplômé senior se voit dû un poste surnuméraire d'« expert » ou de « spécialiste » à étoile, que le poste fasse quelque chose ou non. Rachetez les généraux honoraires et fermez les postes derrière eux."
 SIA_close_the_ledger: "Clore le grand livre"
 SIA_close_the_ledger_desc: "La chaîne de télévision de l'armée, les golfs, les holdings fonciers et les schémas sociaux qui tournaient sur le travail non payé des soldats passent à l'administration civile. La vie de caserne se rétrécit. Le budget devient honnête."
 SIA_break_the_class_ladder: "Briser l'échelle des promotions"
 SIA_break_the_class_ladder_desc: "La promotion par promotion pré-cadet et faction d'unité, Wongthewan contre Burapha Phayak, cède la place à la promotion sur dossier. Cela coûte aux anciens réseaux leur emprise sur qui commandera ensuite."
 SIA_all_volunteer_force: "La force entièrement volontaire"
 SIA_all_volunteer_force_desc: "L'armée bâtie entièrement sur ceux qui la choisissent : mieux entraînée, mieux organisée, et payée ce que cela coûte. Une force largement compétente, à un salaire permanent que le Trésor portera pour de bon."
 SIA_the_elite_spearhead: "La pointe d'élite"
 SIA_the_elite_spearhead_desc: "Plutôt que de professionnaliser toute l'armée, concentrez l'investissement. Une petite pointe de forces spéciales, équipée cher et tenue cher, bâtie pour frapper bien au-dessus du poids de la force derrière elle."
 SIA_high_readiness_army: "L'armée de haute préparation"
 SIA_high_readiness_army_desc: "Des formations permanentes tenues sur un pied de guerre : entraînées, planifiées, et éclaireuses avant le contact. Une préparation de ce type n'est jamais gratuite à maintenir, mais cela signifie que l'armée qui se présente est l'armée qui a été promise."
 SIA_the_minister_decides: "Le conseil conseille, le ministre décide"
 SIA_the_minister_decides_desc: "Le Conseil du commandement suprême garde son siège à la table, mais les décisions sont au ministre civil à prendre et aux généraux à exécuter. C'est la réforme que la vieille garde combat le plus durement, et celle qui fait tenir toutes les autres."
 SIA_the_conscript_host: "L'ost de conscrits"
 SIA_the_conscript_host_desc: "Le nombre plutôt que le poli. Un recrutement plus large remplit les rangs à bon marché, le Trésor cesse de saigner pour une masse salariale professionnelle gonflée, et le corps des officiers garde chaque privilège qu'il a déjà."
 SIA_fill_the_quota: "Remplir le quota"
 SIA_fill_the_quota_desc: "La loterie annuelle de conscription puise plus profondément dans le vivier éligible. Plus de noms tirés signifie plus de bottes remplies, et une barre plus basse à franchir pour porter l'uniforme."
 SIA_the_boys_in_black: "Les garçons en noir reviennent"
 SIA_the_boys_in_black_desc: "Les Thahan Phran, rangers frontaliers volontaires, voient leur effectif doublé. Légèrement payés et levés localement, ils tiennent les villages de frontière et saignent un envahisseur sur un terrain qu'ils connaissent mieux qu'aucune formation régulière."
 SIA_or_sor_grid: "Un Or Sor dans chaque tambon"
 SIA_or_sor_grid_desc: "The village defense volunteers are called the Or Sor and made up by each tambon (sub-district) across the countryside. It is a militia grid that needs no supply line because they are protecting their homes."
 SIA_cheap_steel_many_hulls: "Acier bon marché, nombreuses coques"
 SIA_cheap_steel_many_hulls_desc: "Armer la masse depuis des usines thaïlandaises plutôt que des catalogues étrangers. L'équipement est plus simple et le tranchant plus émoussé, mais les usines d'armes le sortent vite et le sortent à bon marché."
 SIA_the_barracks_economy: "L'économie de caserne"
 SIA_the_barracks_economy_desc: "Laissez les affaires des généraux payer la mobilisation plutôt que de les combattre. La chaîne, les golfs et le reste du portefeuille ouvrent leurs livres au trésor de guerre : de l'argent maintenant et de la corruption pour de bon."
 SIA_reserve_of_the_realm: "Réserve du royaume"
 SIA_reserve_of_the_realm_desc: "Chaque homme qui a jamais porté l'uniforme est enregistré, suivi, et prêt au rappel. Les rôles de réserve enflent et l'appel tourne plus vite, au coût d'un pipeline de formation étiré plus mince pour le couvrir."
 SIA_the_old_guard_endures: "Le commandement qui ne dort jamais"
 SIA_the_old_guard_endures_desc: "The mass army is made permanent, the wage bill finally brought back to what the treasury can bear, and with it the backbone of the officer corps is secured. Civilian control is off the table for good. The Old Guard has simply learned to live within its means."
 SIA_swf_windfall: "Gain exceptionnel du Fonds souverain"
 SIA_swf_windfall_desc: "L'allocation de cette année verse. Les rendements coussinent le budget jusqu'à ce que la position soit tirée."
