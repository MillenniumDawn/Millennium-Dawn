 BRA_idea_fossil_fuel_industry_desc: "[BRA.GetAdjective] 화석 연료 산업은 세계 화석 연료 시장의 주요 주체이며, 이 극히 중요한 산업을 계속 지원하는 것이 필수적입니다."
