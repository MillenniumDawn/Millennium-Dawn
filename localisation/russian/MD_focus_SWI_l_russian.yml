l_russian:
 switzerland_focus: "Дерево фокусов Швейцарии"
 SWI_the_mountain_fortress: "Горная крепость"
 SWI_the_mountain_fortress_desc: "Наиболее эффективной нашей обороной являются наши горы. Мы должны развивать их, если хотим сохранить оборонительное преимущество."
 SWI_guns_for_the_population: "Оружие для населения"
 SWI_guns_for_the_population_desc: "Нация, которая со всех сторон граничит с более сильными народами, должно иметь население, которое в любой момент готово защитить свои дома."
 SWI_zurich_industrial_project: "Промышленный проект Цюриха"
 SWI_zurich_industrial_project_desc: "Если мы хотим конкурировать с нашими соседями, у нас должен быть прочный промышленный комплекс."
 SWI_strengthen_the_secret_services: "Усиление секретных служб"
 SWI_strengthen_the_secret_services_desc: "Секретная служба может проделать долгий путь, чтобы обнаружить угрозы как снаружи, так и внутри нашей нации."
 SWI_military_investments_1: "Программа вооружений I"
 SWI_military_investments_1_desc: "Выделить средства на первый транш ежегодной программы вооружений, представляемой парламенту, с целью преобразования стабильного оборонного бюджета в новые промышленные мощности."
 SWI_geneva_industrial_project: "Промышленный проект Женевы"
 SWI_geneva_industrial_project_desc: "В Женеве всегда не помешало бы больше рабочих мест на заводах. Нам следует полностью реформировать этот регион."
 SWI_secure_the_swiss_borders: "Защита швейцарских границ"
 SWI_secure_the_swiss_borders_desc: "Мы начнем создавать обширные сети пограничных патрулей и контрольно-пропускных пунктов, чтобы никто не мог проникнуть или покинуть границы нашего государства, чтобы мы не знали."
 SWI_italian_forts: "Итальянские форты"
 SWI_italian_forts_desc: "Мы всегда должны быть готовы к нападению со стороны наших южных соседей."
 SWI_german_forts: "Немецкие форты"
 SWI_german_forts_desc: "Во время Второй мировой войны мы были слишком близки к войне с Германией. Нельзя допустить, чтобы нас застали врасплох, если немецкая агрессия возобновится."
 SWI_french_forts: "Французские форты"
 SWI_french_forts_desc: "Франция конечно раньше не вторгалась в нас. Но мы не можем позволить себе быть пойманными в расплох, как это было столетия назад. Мы будем готовы, на всякий случай."
 SWI_military_investments_2: "Программа вооружений II"
 SWI_military_investments_2_desc: "Продолжить реализацию Программы вооружений со второй волной закупок, доказав, что стабильные инвестиции обеспечивают самодостаточную оборонную промышленность."
 SWI_the_cern_project: "Проект CERN"
 SWI_the_cern_project_desc: "Ядерные исследования - это будущее. Мы должны начать обширные исследования в этой области."
 SWI_the_large_hadron_collider: "Институт Пауля Шеррера"
 SWI_the_large_hadron_collider_desc: "Институт Пауля Шеррера в Виллигене — крупнейший научно-исследовательский центр Швейцарии, сочетающий ускорители частиц и источники нейтронов с глубокими знаниями в области реакторных материалов и ядерной безопасности. Его работа лежит в основе гражданской ядерной программы Конфедерации."
 SWI_construct_power_plants: "Резервные электростанции"
 SWI_construct_power_plants_desc: "Альпийская гидроэнергетика обеспечивает нас энергией большую часть года, но холодная и сухая зима может привести к дефициту электроэнергии в энергосистеме. Резервные газовые электростанции, такие как в Бирре, предоставляют Конфедерации резерв, на который можно опереться, когда импорт сокращается."
 switzerland.2.t: "Конец швейцарской политической системы"
 switzerland.2.d: "Швейцарская система прямой демократии, долгое время отличавшаяся необычайно высоким уровнем участия населения в управлении страной посредством частых референдумов, постепенно сворачивается.\n\nШвейцарский лидер [SWI.GetLeader] объявили, что эти \"Отвлекающие факторы от общественной жизни\" и \"Ненужные референдумы\" Это прекратится."
 switzerland.2.o1: "Скатертью дорога."
 switzerland.2.o2: "Какой позор."
 switzerland.2.o3: "Без разницы."
 switzerland_news.1.t: "Швейцария вступает в ООН"
 switzerland_news.1.d: "Первоначально швейцарское правительство отказалось вступать в Организацию Объединенных Наций после окончания Второй мировой войны, ссылаясь на неизменную приверженность страны нейтралитету, несмотря на то, что в Женеве располагалось отделение ООН, главный европейский офис организации. Теперь, после публичного референдума по этому вопросу, швейцарское правительство объявило, что страна откажется от статуса наблюдателя и вступит в организацию в качестве полноправного члена."
 switzerland_news.1.o1: "Самое время, Швейцария!"
 switzerland_news.1.o3: "Неужели это действительно так важно?"
 SWI_join_un: "Новый член ООН"
 swiss_political_system: "Политическая система Швейцарии"
 swiss_political_system_desc: "Швейцария обладает уникальной политической системой и является единственной страной в мире, которая по праву может называть себя \"полупрямой демократией\". Граждане могут менять конституцию на референдуме, могут накладывать вето на законы на референдуме, могут даже принимать законы на референдуме.\nЭто, однако, имеет последствия для политиков: Поскольку политику в любом случае определяет народ, швейцарская коалиционная система должна включать в себя как можно больше сил. Четыре крупные партии Швейцарии, SVP, FDP, CVP и SP, постоянно находятся в правительстве вместе - это делает национальные выборы в Швейцарии более или менее бесполезными, поскольку народ правит не через своих представителей, а через референдумы."
 SWI_swiss_neutrality_desc: "§YОсобые правила:§!\n\n§YМы§! §RНЕ МОЖЕМ§! §Yобъявить войну другим странам!§!\n--------------\nШвейцарцы известны во всем мире как нейтральная страна. С момента своего основания как республика страна не участвовала ни в каких наступательных конфликтах и ​​оставалась нейтральной во время обеих мировых войн.\n--------------\nЭтот национальный дух может быть §RУдален§! путем выполнения §HРадикальных изменений§! или §HОткрытия§! Фокус."
 SWI_Expanding_nuclear_research: "Расширение ядерных исследований"
 SWI_expand_swiss_nuclear_plants: "Расширение атомного флота"
 SWI_expand_swiss_nuclear_plants_desc: "Реакторы Безнау, Гёсген и Лейбштадт по-прежнему удовлетворяют внутренний спрос, но запас прочности сокращается. Расширение мощностей реакторов сейчас обеспечило бы Швейцарии энергетическую независимость на целое поколение."
 SWI_research_and_development: "Armasuisse: наука и технологии"
 SWI_research_and_development_desc: "Armasuisse S+T — это технологический центр Министерства обороны, объединяющий исследования в области датчиков, связи, кибербезопасности и материаловедения. Поддерживая собственную технологическую базу, имеющую важное значение для безопасности, Швейцария минимизирует свою зависимость от иностранных поставщиков в условиях кризиса."
 SWI_asd_gruppe: "Программа исследований в области инженерных дисциплин ETH"
 SWI_asd_gruppe_desc: "В рамках совместной программы обеспечения безопасности исследований компания Armasuisse будет связана с ETH Domain, ETH Zurich и EPFL. Федеральные франки и академические таланты будут объединены для преобразования передовых исследований в боеспособные оборонные системы."
 SWI_small_arms_development: "Разработка пехотного вооружения"
 SWI_small_arms_development_desc: "Модернизировать преемника служебной винтовки Stgw 90 (SG 550) и её оптику, используя опыт SIG и B&T. Успех или провал армии ополчения зависит от надёжности оружия в руках каждого солдата-гражданина."
 SWI_sig_ag_research_teams: "Швейцарские исследовательские группы по вооружениям"
 SWI_sig_ag_research_teams_desc: "В Нойхаузене в рамках линейки стрелкового оружия SIG создаются специализированные конструкторские группы. Десятилетия швейцарского высокоточного производства направлены на создание нового поколения индивидуального и группового оружия."
 SWI_precision_launch_platforms: "Управляемые противотанковые системы"
 SWI_precision_launch_platforms_desc: "Разработать переносные управляемые противотанковые системы, которые позволят спешенным гренадерам наносить решающий удар по бронетехнике на пересеченной местности альпийского предгорья."
 SWI_support_platforms_research: "Интегрированные системы управления"
 SWI_support_platforms_research_desc: "Развивайте сеть управления боевыми действиями FIS Heer, чтобы командиры могли в режиме реального времени получать единую тактическую картину. Швейцарские системы командования, управления и связи объединяют разрозненные ополчения в единую силу."
 SWI_mass_produced_firearms: "Производство боеприпасов и стрелкового оружия"
 SWI_mass_produced_firearms_desc: "Наращивание объемов производства боеприпасов и стрелкового оружия внутри страны через компанию SwissP Defence (ранее RUAG Ammotec). Гарантированные национальные запасы обеспечивают вооружение ополчения без зависимости от импорта."
 SWI_armored_vehicles_study: "Программа создания бронированной техники"
 SWI_armored_vehicles_study_desc: "Координировать швейцарскую бронетанковую промышленность вокруг семейств GDELS-Mowag Piranha и Eagle, составляющих колесную основу механизированных бригад."
 SWI_airframes_study: "Программа аэронавтики"
 SWI_airframes_study_desc: "Объединение швейцарского опыта в области авиационной техники в подразделениях Pilatus в Штансе и RUAG Aviation в Эммене, от учебно-тренировочных самолетов до технического обслуживания и конструкций боевых самолетов."
 SWI_mbt_concept: "Модернизация Leopard 2"
 SWI_mbt_concept_desc: "Модернизируйте парк танков Pz 87 Leopard 2 с помощью разработанных компанией RUAG пакетов систем управления огнём, защиты и повышения мобильности, чтобы сохранить актуальность этого основного боевого танка в ближайшие десятилетия."
 SWI_spart_systems: "Самоходная артиллерия"
 SWI_spart_systems_desc: "Программа модернизации KAWEST позволяет расширить дальность стрельбы и повысить точность самоходной гаубицы M109 (Pz Hb), обеспечивая оперативное ведение огня в горной местности."
 SWI_spaa_systems: "Мобильная противовоздушная оборона"
 SWI_spaa_systems_desc: "Разверните мобильную зенитную установку ближнего действия, созданную на базе 35-мм системы ПВО Rheinmetall Air Defence Skyranger, для защиты маневренных сил от самолетов и беспилотников."
 SWI_production_line_innovations: "Автоматизированные производственные линии"
 SWI_production_line_innovations_desc: "Модернизация сборочных цехов RUAG и Mowag с использованием современных средств автоматизации позволит увеличить производительность и высвободить дефицитную квалифицированную рабочую силу для выполнения более высокооплачиваемой работы."
 SWI_import_missile_tech: "Интеграция управляемых ракет"
 SWI_import_missile_tech_desc: "Приобретать и интегрировать современные ракеты класса «воздух-воздух» и «земля-воздух», развивая отечественные ноу-хау для их обслуживания и адаптации к швейцарским платформам."
 SWI_helicopter_research: "Программа «Вертолёт»"
 SWI_helicopter_research_desc: "Компания RUAG Aviation обеспечивает техническое обслуживание и модернизацию флота самолетов Super Puma/Cougar и EC635, являющихся основными рабочими лошадками швейцарской транспортной, связной и горноспасательной авиации."
 SWI_air_cavalry_armament: "Вооружение воздушной кавалерии"
 SWI_air_cavalry_armament_desc: "Вооружить флот Super Puma и разработать соответствующую аэромобильную доктрину, превратив транспортные эскадрильи в маневренное подразделение, которое может использовать ополчение."
 SWI_gunship_development: "Разработка боевого вертолета"
 SWI_gunship_development_desc: "Вооруженные вертолетные модификации используются для непосредственной поддержки и вооруженной разведки, они дешевле в приобретении и обслуживании, чем специализированный парк ударных вертолетов."
 SWI_revise_isolation_strategy: "За пределами Редуита"
 SWI_revise_isolation_strategy_desc: "Переход от статичной системы Alpine Réduit к современной динамичной системе территориальной обороны, согласовывающей реформы «Дальнейшего развития армии» (WEA) с изменившейся картиной угроз."
 SWI_log_tunnel_network: "Склады в Альпийском тоннеле"
 SWI_log_tunnel_network_desc: "Используйте скрытую сеть швейцарских подземных складов и туннелей, прорубленных в горах, для хранения боеприпасов и топлива в местах, недоступных для авиаударов."
 SWI_domestic_res_output: "Национальное экономическое предложение"
 SWI_domestic_res_output_desc: "Укрепить wirtschaftliche Landesversorgung — правовую основу, обеспечивающую бесперебойную поставку энергоносителей, продовольствия и товаров первой необходимости в страну в чрезвычайных ситуациях."
 SWI_strat_supply_reserves: "Обязательные стратегические резервы"
 SWI_strat_supply_reserves_desc: "Внедрить систему обязательных запасов продовольствия (Pflichtlager), предусматривающую хранение запасов топлива, продовольствия и медикаментов на несколько месяцев в случае блокады или кризиса."
 SWI_environmental_adaptation: "Учение о ведении войны в Альпах"
 SWI_environmental_adaptation_desc: "Обучать и оснащать специализированные горные формирования для ведения боевых действий и выживания в зимних условиях на большой высоте, превращая саму местность в оружие."
 SWI_repair_decaying_forts: "Возобновить эксплуатацию альпийских фортов"
 SWI_repair_decaying_forts_desc: "Восстановить в строю отдельные артиллерийские форты и укрепленные позиции, выведенные из эксплуатации в рамках реформ «Армия 95» и «Армия XXI», восстановив глубину горной обороны."
 SWI_graubunden_gold_silver: "Добыча альпийских минералов"
 SWI_graubunden_gold_silver_desc: "Возобновить работу заброшенных горнодобывающих предприятий в Граубюнденских Альпах, чтобы обеспечить поступление стратегических материалов для оборонной промышленности из внутренних источников."
 SWI_graubunden_iron_mines: "Добыча альпийской руды"
 SWI_graubunden_iron_mines_desc: "Использование альпийской железной руды для обеспечения небольшого внутреннего производства стали позволит снизить зависимость от импортного сырья для военного производства."
 SWI_mil_industry_expansion: "Расширить оборонно-промышленную базу"
 SWI_mil_industry_expansion_desc: "Необходимо развивать промышленную базу, имеющую важное значение для безопасности, которую Швейцария обязана поддерживать в соответствии с Законом о военных материалах. Нейтральное государство должно быть способно вооружаться и обеспечивать себя в случае закрытия иностранных каналов поставок."
 SWI_sig_neuhausen_factory: "SIG работает в Нойхаузене"
 SWI_sig_neuhausen_factory_desc: "Расширить исторический завод SIG в Нойхаузене-ам-Райнфалье, сердце швейцарского производства стрелкового оружия с XIX века."
 SWI_sig_graubunden_factory: "Распределенное производство вооружений"
 SWI_sig_graubunden_factory_desc: "Рассредоточить производство стрелкового оружия и боеприпасов по долинам Граубюндена, укрепив промышленную базу против сокрушительного удара в соответствии со швейцарской доктриной рассредоточения."
 SWI_infrastructural_advancement: "Промышленная инфраструктура"
 SWI_infrastructural_advancement_desc: "Необходимо модернизировать железнодорожные и автомобильные магистрали, обеспечивающие снабжение заводов по производству вооружений, чтобы сырье и готовая продукция доставлялись надежно даже в условиях военного времени."
 SWI_expand_gdels_mowag: "Развернуть GDELS-Mowag Кройцлинген"
 SWI_expand_gdels_mowag_desc: "Увеличьте изображение завода GDELS-Mowag в Кройцлингене, где производятся бронированные машины Piranha и Eagle, поставляемые как швейцарской армии, так и экспортным заказчикам."
 SWI_new_factory_ruag: "Новый производственный комплекс RUAG"
 SWI_new_factory_ruag_desc: "Открытие новых мощностей RUAG MRO Switzerland для капитального ремонта самолетов и наземных систем. Национальная политика предусматривает резервирование большей части работ по техническому обслуживанию швейцарской военной техники для RUAG."
 SWI_cooperation_with_rheinmetall: "Сотрудничество с компанией Rheinmetall"
 SWI_cooperation_with_rheinmetall_desc: "Укрепить связи с компанией Rheinmetall Air Defence AG в Цюрихе, наследницей Oerlikon Contraves и ее наследия в области 35-мм пушек, систем противовоздушной обороны Skyguard и Skyshield."
 SWI_cooperation_with_thales: "Сотрудничество с компанией Thales"
 SWI_cooperation_with_thales_desc: "Сотрудничество с Thales Suisse в области радиолокации, оптоэлектроники и систем управления и контроля позволяет швейцарским вооруженным силам использовать проверенные сенсорные и сетевые технологии."
 SWI_general_staff: "Штаб вооруженных сил"
 SWI_general_staff_desc: "Объединить планирование и доктрину под эгидой штаба Вооруженных сил (Führungsstab der Armee) при начальнике Генерального штаба Вооруженных сил, обеспечив ополчение современным объединенным командованием."
 SWI_gemeinsames_ok: "Kommando Spezialkräfte"
 SWI_gemeinsames_ok_desc: "Превратить Командование Сил специального назначения, его 10-й разведывательный отряд и гренадерские формирования в небольшой, но элитный передовой отряд для армии ополчения."
 SWI_ausbildungskommando: "Kommando Ausbildung"
 SWI_ausbildungskommando_desc: "Необходимо реформировать Командование по подготовке кадров, которое управляет школами для новобранцев и курсами повышения квалификации. Сила швейцарской системы заключается в том, что все население проходит дисциплинированную, стандартизированную подготовку."
 SWI_airforce_modernization: "Программа «Воздушная 2030»"
 SWI_airforce_modernization_desc: "Запуск программы Air2030, крупнейшей закупки вооружений в современной истории Швейцарии, направленной на замену устаревающих истребителей F-5 Tiger и F/A-18 Hornet и восстановление наземной противовоздушной обороны на целое поколение."
 SWI_general_air_defense: "Оценка нового истребителя"
 SWI_general_air_defense_desc: "Начните оценку нового истребителя (NKF), проведя полеты отобранных кандидатов в Пайерне и сравнив их с требованиями, предъявляемыми к охране густонаселенного горного воздушного пространства Швейцарии."
 SWI_import_eurofighters: "Предложение по Eurofighter Typhoon"
 SWI_import_eurofighters_desc: "Оцените истребитель Airbus и BAE Eurofighter Typhoon, проверенный европейский истребитель завоевания превосходства в воздухе, предлагаемый в рамках существенного пакета промышленного участия."
 SWI_import_rafale_fighters: "Предложение Dassault Rafale"
 SWI_import_rafale_fighters_desc: "Оцените Dassault Rafale, универсальный французский истребитель многоцелевого назначения, взвесив его преимущества с точки зрения суверенитета и предложения по компенсационным выплатам в сравнении с другими самолетами на рынке."
 SWI_german_manufacturing: "Немецкие промышленные офсеты"
 SWI_german_manufacturing_desc: "Вести переговоры о передаче технологий и компенсационных соглашениях с возглавляемым Германией консорциумом Eurofighter, направляя средства, полученные от закупок, обратно в швейцарскую промышленность."
 SWI_french_manufacturing: "Французские промышленные компенсационные сделки"
 SWI_french_manufacturing_desc: "Переговоры по соглашениям о компенсационных выплатах и ​​промышленном участии с компаниями Dassault и Thales, обеспечивающие швейцарское распределение долей в проекте в обмен на покупку самолетов."
 SWI_interception_practices: "Выберите F-35A Lightning II"
 SWI_interception_practices_desc: "Выберите Lockheed Martin F-35A, чьи системы интеграции данных с датчиков и малозаметность заняли первое место в оценке. Система ситуационной осведомленности пятого поколения преобразует швейцарские системы перехвата и быстрого реагирования."
 SWI_multi_role_specialization: "Многоролевая интеграция"
 SWI_multi_role_specialization_desc: "Интегрировать F-35A в задачи противовоздушной обороны и нанесения ударов, оснастив его ракетами AIM-120 и AIM-9X, а также высокоточными боеприпасами, для создания единого гибкого флота."
 SWI_air_sup_adaptation: "Круглосуточное патрулирование воздушного пространства"
 SWI_air_sup_adaptation_desc: "Обеспечение круглосуточной готовности к быстрому реагированию в воздушном пространстве Швейцарии — возможность, которую ВВС достигли в 2020 году и поддерживают теперь благодаря новому флоту истребителей."
 SWI_acquire_transport_planes: "Тактическая воздушная перевозка"
 SWI_acquire_transport_planes_desc: "Расширить возможности воздушных перевозок с использованием парка самолетов Super Puma и Cougar, а также легких самолетов с неподвижным крылом, для переброски войск и гуманитарной помощи по всей стране и за рубежом."
 SWI_airbase_expansion: "Модернизация авиабазы"
 SWI_airbase_expansion_desc: "Модернизировать основные оперативные базы в Пайерне, Мейрингене и Эммене, включая горные пещерные убежища, позволяющие реактивным самолетам переждать атаку под землей."
 SWI_nasams_batteries: "ПВО наземного базирования «Патриот»"
 SWI_nasams_batteries_desc: "В рамках программы Air2030 следует закупить зенитные ракетные комплексы дальнего действия Patriot, что обеспечит Швейцарии первую настоящую защиту от высотных и дистанционных угроз."
 SWI_florako: "FLORAKO Воздушное наблюдение"
 SWI_florako_desc: "Запустите систему FLORAKO — интегрированную радиолокационную и командную сеть, которая круглосуточно следит за воздушным пространством Швейцарии и направляет действия как истребителей, так и наземных средств противовоздушной обороны."
 SWI_Grune_idea: "Grüne Schweiz"
 SWI_Grune_idea_desc: "За более чистую, справедливую и свободную Швейцарию, где люди и планета важнее прибыли!"
 SWI_universal_education_bonus_desc: "Инвестиции Швейцарии в современное образование стимулировали исследования в области возобновляемой энергии и устойчивых технологий, прокладывая путь к более чистому будущему."
 SWI_environmental_reforms: "Экологические реформы"
 SWI_environmental_reforms_desc: "Комплексные природоохранные законы направлены на сокращение выбросов, защиту природных ресурсов и переход экономики к устойчивому развитию."
 SWI_limit_industry: "Ограниченное промышленное развитие"
 SWI_limit_industry_desc: "Промышленное развитие ограничено в целях защиты окружающей среды Швейцарии, что означает обмен быстрого роста на долгосрочную экологическую стабильность."
 SWI_eco_tourism: "Экотуризм"
 SWI_eco_tourism_desc: "Продвижение экологичного туризма вдохнет новую жизнь в сельские районы, сохраняя при этом первозданную красоту швейцарских ландшафтов."
 SWI_national_parks: "Национальные парки"
 SWI_national_parks_desc: "Расширение охраняемых территорий способствует сохранению дикой природы и укрепляет международный имидж Швейцарии как лидера в области охраны окружающей среды."
 SWI_completely_green: "Полностью экологично!"
 SWI_completely_green_desc: "Благодаря неустанным реформам и инновациям Швейцария достигла полной экологической устойчивости, став страной, полностью работающей на чистой энергии."
 SWI_christian_values: "Христианские ценности"
 SWI_christian_values_desc: "Традиционные христианские принципы лежат в основе социальной политики и укрепляют моральные основы швейцарского общества."
 SWI_banned_abortion: "Запрет абортов"
 SWI_banned_abortion_desc: "Строгие законы запрещают аборты, что отражает возросшую в стране приверженность консервативным социальным принципам."
 SWI_ndb: "Швейцарский NDB"
 SWI_ndb_desc: "Швейцарский банк национального развития (НБР) способствует усилению разведывательных операций, защите национальной безопасности и сохранению нейтралитета в нестабильном мире."
 SWI_traditionalist: "Традиционализм"
 SWI_traditionalist_desc: "Традиционалистские взгляды формируют политику, отдавая приоритет вере, семье и национальному наследию, а не современным социальным тенденциям."
 SWI_army_fund: "Финансирование армии"
 SWI_army_fund_desc: "Увеличение расходов на оборону повышает боеготовность швейцарских вооруженных сил и модернизирует их инфраструктуру."
 SWI_ngo_funding: "Финансирование НПО"
 SWI_ngo_funding_desc: "Государственные гранты оказывают поддержку неправительственным организациям, работающим в сфере гуманитарной помощи, охраны окружающей среды и защиты гражданских прав."
 SWI_efficiency: "Швейцарская эффективность"
 SWI_efficiency_desc: "Эффективность в Швейцарии становится отличительной чертой государственного управления — упрощенная бюрократия, сокращение отходов и точное управление."
 SWI_fortress_switzerland: "Крепость Швейцария"
 SWI_fortress_switzerland_desc: "Крупные укрепления и современные оборонительные сети гарантируют, что Швейцария остается неприступной в любом конфликте."
 SWI_tax_code: "Упрощенный налоговый кодекс"
 SWI_tax_code_desc: "Упрощенная система налогообложения снижает уклонение от уплаты налогов, привлекает инвестиции и способствует сбалансированной экономике."
 SWI_foreign: "Иностранные компании"
 SWI_foreign_desc: "Иностранным корпорациям рекомендуется инвестировать в Швейцарию, что способствует внедрению инноваций и созданию рабочих мест, сохраняя при этом национальный контроль."
 SWI_agriculture: "Финансирование сельского хозяйства"
 SWI_agriculture_desc: "Швейцария инвестирует в современное, устойчивое сельское хозяйство, поддерживая местных фермеров, защищая сельские общины и обеспечивая продовольственную безопасность для будущих поколений."
 SWI_fdp: "ФДП"
 SWI_fdp_desc: "СвДП — либеральная партия, выступающая за свободный рынок, индивидуальное предпринимательство, экономическую свободу и минимальное вмешательство государства."
 SWI_police_reforms: "Реформы полиции"
 SWI_police_reforms_desc: "Модернизировать правоохранительные органы, повысить эффективность и укрепить общественную безопасность по всей стране."
 SWI_financial_deregulation: "Финансовая дерегуляция"
 SWI_financial_deregulation_desc: "Снижение банковских и финансовых ограничений для стимулирования инвестиций, роста и экономической динамики."
 SWI_precision: "Швейцарская точность"
 SWI_precision_desc: "Содействовать совершенствованию швейцарского производства, продвигать высококачественную промышленность и поддерживать репутацию страны как страны, отличающейся точностью."
 SWI_fund_startups: "Технологические стартапы"
 SWI_fund_startups_desc: "Оказывать финансирование и поддержку технологическим стартапам для стимулирования инноваций и обеспечения экономического будущего Швейцарии."
 SWI_direct_democracy: "Реформы прямой демократии"
 SWI_direct_democracy_desc: "Расширить участие граждан посредством референдумов и инициатив, укрепляя демократический процесс."
 SWI_progressive_tax: "Прогрессивные налоговые реформы"
 SWI_progressive_tax_desc: "Внедрить справедливую прогрессивную систему налогообложения для финансирования государственных услуг и обеспечения экономического баланса."
 SWI_pda: "Partei der Arbeit"
 SWI_pda_desc: "Коммунистическая партия Швейцарии, набирая значительное влияние, выступает за радикальные изменения в экономической структуре страны, стремясь превратить швейцарский нейтралитет в двигатель социалистической солидарности."
 SWI_nationalize_industries: "Ключевые отрасли промышленности национализированы"
 SWI_nationalize_industries_desc: "Федеральный совет инициирует передачу ключевых промышленных секторов под государственный контроль, обеспечивая справедливое распределение ресурсов и производство для соблюдения планов развития."
 SWI_socialist_countries_ties: "Связи с социалистическими странами"
 SWI_socialist_countries_ties_desc: "Швейцария активно стремится к более тесным дипломатическим, культурным и политическим связям со странами, поддерживающими социалистические идеи, и готовится изменить свой многолетний нейтралитет в пользу глобального движения."
 SWI_socialist_agreements: "Торговые соглашения"
 SWI_socialist_agreements_desc: "Заключаются новые долгосрочные торговые соглашения с социалистическими государствами, обеспечивающие доступ к важнейшим сырьевым материалам и расширяющие рынок швейцарской высокоточной продукции."
 SWI_higher_wages_idea: "Повышение заработной платы"
 SWI_higher_wages_idea_desc: "Обязательное повышение минимальной заработной платы и федеральный контроль за структурой оплаты труда гарантируют, что швейцарские работники получают справедливую и достойную заработную плату, что способствует росту внутреннего потребления."
 SWI_cheaper_house: "Дешевое жилье"
 SWI_cheaper_house_desc: "Федеральная инициатива по ограничению арендных цен и субсидированию строительства резко снижает стоимость частного жилья, делая владение собственным домом доступным для более широкого круга населения."
 SWI_public_housing: "Государственное жилье"
 SWI_public_housing_desc: "Масштабные государственные инвестиции в качественные проекты государственного жилья обеспечивают современное и доступное жилье, решая проблему высокой плотности застройки и обеспечивая жилищную безопасность для рабочего класса."
 SWI_challenged_elite: "Бросая вызов банковской элите"
 SWI_challenged_elite_desc: "Выдвигается прямой вызов скрытной и влиятельной банковской элите. Вводятся новые правила, облагающие налогом частные капиталовложения и проводящие расследования по уклонению от уплаты налогов для пополнения федеральной казны."
 SWI_mind_federation: "Разум Федерации"
 SWI_mind_federation_desc: "Формируется единое видение новой Федерации, в основе которого лежит стремление к эффективности, сотрудничеству и быстрой интеграции новых территорий и населения в политическую систему."
 SWI_growing_federation: "Укрепление Федерации"
 SWI_growing_federation_desc: "Промышленные и административные реформы Федерации объединены в единую скоординированную программу. Развитие инфраструктуры, промышленного производства и научных исследований теперь осуществляется под единым федеральным знаменем, стандартизируя и политически согласовывая каждый вновь приобретенный кантон."
 SWI_modernize_direct: "Модернизированная прямая демократия"
 SWI_modernize_direct_desc: "Система прямой демократии пересматривается и модернизируется, внедряя новые технологии и оптимизированные процессы для обеспечения быстрого вовлечения граждан и оперативного принятия решений на национальном уровне."
 SWI_council_states: "Совет Государств"
 SWI_council_states_desc: "Совет штатов реорганизован с целью обеспечения более широкого и справедливого представительства всех новых и существующих кантонов, уравновешивая законодательную власть между численностью населения и региональной автономией."
 SWI_fiscal_equalization: "Фонд фискального выравнивания"
 SWI_fiscal_equalization_desc: "Создан новый федеральный фонд для перераспределения богатств от самых богатых кантонов к самым бедным, обеспечивающий равномерное развитие и высокий уровень жизни на всей территории Федерации."
 SWI_develop_federation: "Развитие Федерации"
 SWI_develop_federation_desc: "Основное внимание уделяется долгосрочным инфраструктурным и девелоперским проектам на всей территории Альпийской федерации, особенно на вновь приобретенных территориях, с целью максимизации экономического потенциала и политической стабильности."
 switzerland.8.t: "Швейцарское расследование по Альпам"
 switzerland.8.desc: "Швейцария требует немедленной передачи Савойи, Прованса и Ниццы под свой контроль, ссылаясь на исторические связи и общую альпийскую культуру."
 switzerland.8.a: "Уступите штаты"
 switzerland.8.b: "Мусор"
 switzerland.9.t: "Заявка на компенсацию от компании Alps принята."
 switzerland.9.desc: "Франция неожиданно согласилась на наше расследование, уступив весь альпийский регион. Великая дипломатическая победа!"
 switzerland.9.a: "Новая, более сильная Швейцария!"
 switzerland.10.t: "В удовлетворении претензии Альп было отказано."
 switzerland.10.desc: "Наш запрос был встречен резким отказом. Франция не желает вести переговоры о территориальной целостности."
 switzerland.10.a: "Дипломатические усилия потерпели неудачу."
 switzerland.11.t: "Запросите информацию об итальянских Альпах."
 switzerland.11.desc: "Правительство Швейцарии начало официальное расследование по вопросу передачи Аосты, Пьемонта, Ломбардии и Южного Тироля в Швейцарскую конфедерацию."
 switzerland.11.a: "Уступите провинции"
 switzerland.11.b: "Отказать в расследовании"
 switzerland.12.t: "Итальянское принятие"
 switzerland.12.desc: "Рим неожиданно согласился с нашими территориальными запросами, сославшись на стремление к региональному миру. Альпы объединены!"
 switzerland.12.a: "Единая Альпийская Республика!"
 switzerland.13.t: "Отказ Италии"
 switzerland.13.desc: "Италия категорически отвергла наши запросы, расценив их как оскорбление национального суверенитета."
 switzerland.13.a: "Наша дипломатия потерпела неудачу."
 switzerland.14.t: "Запрос по Австрийскому Тиролю"
 switzerland.14.desc: "Швейцария, стремясь объединить альпийское сердце страны, направила официальное требование о передаче Тироля. Хотя это имеет историческое значение, принятие этого предложения может предотвратить будущие конфликты."
 switzerland.14.a: "Уступить Тироль Швейцарии"
 switzerland.14.b: "Отклонить претензии Швейцарии"
 switzerland.15.t: "Тироль приобретен"
 switzerland.15.desc: "Вена (или нынешний оккупант Австрии) согласилась с нашей просьбой, присоединив к Конфедерации важный регион Тироль. Наши усилия по объединению успешно продолжаются."
 switzerland.15.a: "Крупная дипломатическая победа."
 switzerland.16.t: "Тирольский отказ"
 switzerland.16.desc: "Наш дипломатический запрос по Тиролю был отклонен безоговорочно. Нынешний владелец этой территории рассматривает наши претензии как неприемлемый вызов своим границам."
 switzerland.16.a: "Нам нужно дождаться более подходящего момента."
 switzerland_news.7.t: "Альпийская федерация"
 switzerland_news.7.d: "В результате масштабных дипломатических маневров и народного движения в регионе Швейцария официально укрепила контроль над историческим альпийским центром. Страна официально изменила свое название на «Федерация Альп» или сокращенно «Альпийская федерация».\n\nЭтот знаменательный сдвиг создает мощное, единое федеративное государство, простирающееся по центральноевропейскому горному хребту, коренным образом меняя баланс сил в регионе. Новое правительство обязалось сохранить культурную и политическую автономию каждого региона, который оно теперь включает."
 switzerland_news.7.a: "Переосмысление нейтралитета с 1516 года."
 switzerland_news.8.t: "Новая республика: Швейцария голосует за централизацию власти."
 switzerland_news.8.d: "Швейцарский народ с небольшим перевесом голосов одобрил конституционный референдум об отказе от федеративной структуры в пользу централизованной республики. Эти изменения, инициированные движением «Новая эра», обещают упрощение управления и сплоченную национальную идентичность, но происходят за счет традиционной кантональной автономии. Сегодня новая Швейцарская Республика официально заменяет Конфедерацию, что вызывает как ликование, так и протесты во всех бывших кантонах. Международное сообщество внимательно следит за последствиями этого радикального сдвига в одной из самых стабильных стран Европы."
 switzerland_news.8.a: "Конфедерация мертва!"
 SWI_suisse_politique: "Швейцарская политика"
 SWI_suisse_politique_desc: "Разработать структуру для дерева национальных приоритетов Швейцарии и определить первоначальное политическое направление развития Конфедерации."
 SWI_strengthening_the_federation: "Укрепление Федерации"
 SWI_strengthening_the_federation_desc: "Укрепить связи между кантонами и усилить авторитет центрального правительства для обеспечения национального единства."
 SWI_dissolving_the_federation: "Расформирование Федерации"
 SWI_dissolving_the_federation_desc: "Федеральная система неустойчива. Необходимо инициировать спорный процесс реструктуризации страны, отдавая приоритет созданию единой, объединенной Швейцарской Республики."
 SWI_deepening_swiss_democracy: "Углубление швейцарской демократии"
 SWI_deepening_swiss_democracy_desc: "Расширить сферу применения инструментов прямой демократии, предоставив народу больше полномочий посредством референдумов и инициатив для формирования национальной политики."
 SWI_panalpine_initiative: "Панальпийская инициатива"
 SWI_panalpine_initiative_desc: "Необходимо занять более активную позицию во внешней политике и региональном развитии. Следует стремиться к сближению или интеграции с альпийскими регионами соседних государств."
 SWI_partei_der_arbeit: "Partei der Arbeit"
 SWI_partei_der_arbeit_desc: "Предоставить левой рабочей партии полномочия для реализации социалистической программы, направленной на экономическое равенство и коллективную собственность."
 SWI_sp: "Социал-демократическая партия (СП)"
 SWI_sp_desc: "Поддержите социал-демократов в их усилиях по реформированию политической системы в целях повышения социального благополучия и развития международного сотрудничества."
 SWI_grune: "Зелёная партия (Grüne)"
 SWI_grune_desc: "Оказывать политическую поддержку Партии зеленых в продвижении всеобъемлющей политики защиты окружающей среды и устойчивого развития."
 SWI_fdu: "Федеральный демократический союз (ФДУ)"
 SWI_fdu_desc: "Предоставить Федеральному демократическому союзу больше влияния для защиты консервативных, евангелических христианских ценностей и местной автономии."
 SWI_svp: "Швейцарская народная партия (SVP)"
 SWI_svp_desc: "Поддержите Швейцарскую народную партию в ее стремлении к жесткому иммиграционному контролю, фискальному консерватизму и национальному суверенитету."
 SWI_the_mind_of_the_federation: "Разум Федерации"
 SWI_the_mind_of_the_federation_desc: "Формировать единую национальную идентичность и укреплять коллективное сознание Конфедерации."
 SWI_proclaim_the_alp_federation: "Провозгласить Альпийскую Федерацию"
 SWI_proclaim_the_alp_federation_desc: "Провозгласить создание единой Альпийской федерации, объединяющей все общие альпийские территории под эгидой новой, мощной швейцарской структуры."
 SWI_alp_federation_coring_tt: "Государства Альпийской Федерации, находящиеся в их владении и имеющие не менее 80% соответствия требованиям, становятся основной территорией. Государства, не достигшие этого порога, вместо этого получают права на территорию."
 SWI_strengthen_the_federation: "Укрепить Федерацию"
 SWI_strengthen_the_federation_desc: "Инвестируйте в ключевые национальные проекты и институты, чтобы сделать федеральное правительство более сильным и устойчивым к внутреннему и внешнему давлению."
 SWI_modernize_direct_democracy: "Модернизация прямой демократии"
 SWI_modernize_direct_democracy_desc: "Оптимизировать процессы подачи петиций и голосования в рамках прямой демократии, обеспечив эффективность и актуальность системы в современную эпоху."
 SWI_empower_the_council_of_states: "Уполномочить Совет государств"
 SWI_empower_the_council_of_states_desc: "Укрепить законодательные полномочия Государственного совета для более эффективного представления интересов и суверенитета отдельных кантонов."
 SWI_fiscal_equalization_fund: "Фонд фискального выравнивания"
 SWI_fiscal_equalization_fund_desc: "Создать постоянный фонд для перераспределения федеральных богатств, обеспечивающий финансовое равенство и стабильность во всех кантонах, как богатых, так и бедных."
 SWI_social_equality: "Социальное равенство"
 SWI_social_equality_desc: "Внедрить политику, направленную на сокращение экономического неравенства и содействие социальной справедливости, особенно для маргинализированных сообществ и граждан с низким уровнем дохода."
 SWI_workers_rights: "Права трудящихся"
 SWI_workers_rights_desc: "Принять всеобъемлющее законодательство, гарантирующее справедливую заработную плату, безопасные условия труда и право на организацию для всех швейцарских рабочих."
 SWI_workers_rights_idea: "Права трудящихся"
 SWI_workers_rights_idea_desc: "Принять всеобъемлющее законодательство, гарантирующее справедливую заработную плату, безопасные условия труда и право на организацию для всех швейцарских рабочих."
 SWI_cheaper_housing: "Более дешевое жилье"
 SWI_cheaper_housing_desc: "Субсидировать и регулировать рынок жилья, чтобы обеспечить доступное жилье для всех граждан страны."
 SWI_expand_public_housing: "Расширение программы государственного жилищного строительства"
 SWI_expand_public_housing_desc: "Запуск масштабного федерального проекта по строительству новых высококачественных жилых единиц государственного жилья в крупных городских центрах."
 SWI_challenge_the_banking_elite: "Бросьте вызов банковской элите"
 SWI_challenge_the_banking_elite_desc: "Ввести строгие правила и новые налоги, направленные против влиятельного и закрытого международного банковского сектора."
 SWI_nationalize_key_industries: "Национализация ключевых отраслей промышленности"
 SWI_nationalize_key_industries_desc: "Передать право собственности на жизненно важные сектора, такие как энергетика, транспорт и связь, из частных рук государству."
 SWI_end_banking_secrecy: "Покончить с банковской тайной"
 SWI_end_banking_secrecy_desc: "Отменить давнюю традицию швейцарской банковской тайны, приведя финансовую систему в соответствие с международными стандартами прозрачности."
 SWI_neutrality_pda: "Нейтралитет (партизанский путь)"
 SWI_neutrality_pda_desc: "Подтвердить традиционную политику швейцарского нейтралитета, но отдать приоритет внутренним социалистическим реформам, а не внешним конфликтам."
 SWI_strengthen_ties_with_socialist_countries: "Укрепить связи с социалистическими странами"
 SWI_strengthen_ties_with_socialist_countries_desc: "Налаживать более тесные дипломатические и экономические отношения с растущим блоком социалистических и коммунистических стран."
 SWI_strengthen_domestic_independence: "Укрепление независимости внутри страны"
 SWI_strengthen_domestic_independence_desc: "Принимать меры, способствующие самообеспечению ресурсами и промышленностью, защищая швейцарскую экономику от нестабильности мирового рынка."
 SWI_trade_agreements_with_socialist_states: "Торговые соглашения с социалистическими государствами"
 SWI_trade_agreements_with_socialist_states_desc: "Подписание эксклюзивных торговых соглашений с социалистическими и неприсоединившимися странами с целью диверсификации швейцарских экспортных рынков."
 SWI_direct_democracy_reforms: "Реформы прямой демократии"
 SWI_direct_democracy_reforms_desc: "Внести технические и процедурные изменения, чтобы сделать демократический процесс более гибким и отвечающим требованиям граждан."
 SWI_domestic_independence: "Внутренняя независимость"
 SWI_domestic_independence_desc: "Основное внимание уделяется максимальному укреплению автономии и суверенитета Швейцарии, а также отказу от вмешательства со стороны более крупных региональных блоков, таких как ЕС."
 SWI_move_closer_to_the_eu: "Сблизиться с ЕС"
 SWI_move_closer_to_the_eu_desc: "Работа по углублению интеграции Швейцарии с единым рынком Европейского союза и его политическими структурами."
 SWI_humanitarian_leadership: "Гуманитарное лидерство"
 SWI_humanitarian_leadership_desc: "Укрепить роль Швейцарии как глобального центра помощи, предоставления убежища и соблюдения международного права посредством дипломатии и увеличения гуманитарных расходов."
 SWI_national_health_service: "Национальная служба здравоохранения"
 SWI_national_health_service_desc: "Необходимо переосмыслить систему здравоохранения, внедрив полностью финансируемую государством Национальную службу здравоохранения, чтобы гарантировать всеобщий доступ к медицинской помощи."
 SWI_expand_labour_union_power: "Расширение полномочий профсоюзов"
 SWI_expand_labour_union_power_desc: "Принять законодательство, предоставляющее значительно больше полномочий и влияния организованным профсоюзам в коллективных переговорах и промышленной политике."
 SWI_progressive_tax_reform: "Прогрессивная налоговая реформа"
 SWI_progressive_tax_reform_desc: "Необходимо пересмотреть налоговый кодекс, чтобы резко повысить ставки для самых высокооплачиваемых работников и корпораций с целью финансирования социальных программ."
 SWI_strengthen_parliamentary_socialism: "Укрепить парламентский социализм"
 SWI_strengthen_parliamentary_socialism_desc: "Работать в рамках демократического строя, чтобы постепенно наращивать власть социал-демократического политического истеблишмента."
 SWI_welfare_state_of_the_future: "Будущее благосостояния"
 SWI_welfare_state_of_the_future_desc: "Разработайте систему социального обеспечения нового поколения, гарантирующую всем гражданам достойный базовый доход и всестороннюю социальную защиту."
 SWI_invest_in_green_infrastructure: "Инвестируйте в зеленую инфраструктуру."
 SWI_invest_in_green_infrastructure_desc: "Выделить значительные государственные средства на строительство устойчивых объектов общественной инфраструктуры, включая сети возобновляемой энергии и экологически чистый транспорт."
 SWI_fund_ngos: "Финансирование НПО"
 SWI_fund_ngos_desc: "Предоставлять значительные федеральные гранты и поддержку экологическим и социальным неправительственным организациям для укрепления гражданского общества."
 SWI_geneva_climate_diplomatic_hub: "Укрепить Женеву как климатический центр"
 SWI_geneva_climate_diplomatic_hub_desc: "Использовать международный статус Женевы для проведения крупных климатических саммитов и дипломатических переговоров, тем самым укрепляя «мягкую силу» Швейцарии."
 SWI_limit_industrial_expansion: "Ограничение промышленного развития"
 SWI_limit_industrial_expansion_desc: "Ввести моратории и строгие правила зонирования, чтобы замедлить расширение тяжелой промышленности и защитить природную красоту швейцарского ландшафта."
 SWI_protect_the_alps: "Защитите Альпы"
 SWI_protect_the_alps_desc: "Объявить Альпы зоной максимальной экологической защиты, запрещающей крупномасштабное строительство или добычу ресурсов."
 SWI_renewable_energy_research: "Исследования в области возобновляемой энергии"
 SWI_renewable_energy_research_desc: "Финансируйте научные и технологические достижения в области солнечной, гидро- и геотермальной энергетики для достижения полной национальной энергетической независимости."
 SWI_centralization: "Централизация власти"
 SWI_centralization_desc: "Передача полномочий от кантонов федеральному правительству, консолидация власти для быстрых и решительных действий на национальном уровне."
 SWI_strengthen_the_cantons: "Укрепить кантоны"
 SWI_strengthen_the_cantons_desc: "Укрепить автономию и традиционные полномочия кантональных правительств, сохранив дух федерализма."
 SWI_close_the_borders: "Закрыть границы"
 SWI_close_the_borders_desc: "Внедрить политику полного закрытия границ для контроля иммиграции и защиты швейцарской национальной идентичности и рынка труда."
 SWI_ban_abortion: "Запретить аборты"
 SWI_ban_abortion_desc: "Принять закон, полностью запрещающий аборты, приведя законы страны в соответствие с консервативными моральными принципами."
 SWI_faith_welfare: "Социальное обеспечение на основе религиозных принципов"
 SWI_faith_welfare_desc: "Реструктурировать систему социальной защиты таким образом, чтобы она опиралась на частные религиозные и благотворительные организации, сократив вмешательство государства."
 SWI_stricter_immigration: "Более строгие иммиграционные законы"
 SWI_stricter_immigration_desc: "Ввести балльную систему и квоты для жесткого ограничения всех форм легальной и нелегальной миграции в страну."
 SWI_maintain_armed_neutrality: "Поддерживать вооруженный нейтралитет"
 SWI_maintain_armed_neutrality_desc: "Поддерживать давнюю традицию военного неприсоединения, обеспечивая при этом мощные и боеготовые вооруженные силы."
 SWI_distance_from_eu: "Дистанцируемся от ЕС"
 SWI_distance_from_eu_desc: "Начать процесс отделения швейцарской экономической и политической политики от влияния и регулирования Европейского союза."
 SWI_fund_ndb: "Профинансируйте НБР"
 SWI_fund_ndb_desc: "Увеличить финансирование Национальной разведывательной службы (НБР) для повышения уровня внутренней безопасности, контрразведки и возможностей наблюдения."
 SWI_stop_un_training: "Прекратить подготовку миротворцев ООН"
 SWI_stop_un_training_desc: "Прекратить спорную практику подготовки иностранных миротворцев ООН, делая упор исключительно на оборонительную военную стратегию."
 SWI_traditionalist_propaganda: "Традиционалистская пропаганда"
 SWI_traditionalist_propaganda_desc: "Запустить общенациональную кампанию по продвижению консервативных и традиционных швейцарских ценностей посредством финансируемых государством СМИ и образования."
 SWI_expand_army_fund: "Расширить финансирование армии."
 SWI_expand_army_fund_desc: "Обеспечьте новый, постоянный источник федеральных доходов, предназначенный исключительно для увеличения бюджета швейцарских вооруженных сил."
 SWI_promote_swiss_identity: "Содействовать развитию швейцарской идентичности"
 SWI_promote_swiss_identity_desc: "Субсидировать культурные и языковые учреждения для укрепления более сильного и единого чувства швейцарского патриотизма и национальной принадлежности."
 SWI_skepticism_ngos: "Скептицизм в отношении НПО"
 SWI_skepticism_ngos_desc: "Проводить расследования и ограничивать деятельность иностранных и отечественных неправительственных организаций, ссылаясь на опасения по поводу их влияния на национальный суверенитет."
 SWI_expand_agriculture: "Расширение сельского хозяйства"
 SWI_expand_agriculture_desc: "Инвестиции в современные сельскохозяйственные технологии и субсидии позволят значительно увеличить внутреннее производство продуктов питания и национальную самообеспеченность."
 SWI_national_efficiency: "Национальная эффективность"
 SWI_national_efficiency_desc: "Внедрить бюрократические и административные реформы во всех федеральных ведомствах для сокращения расточительства и повышения скорости и эффективности работы правительства."
 SWI_isolationism: "Изоляционизм"
 SWI_isolationism_desc: "Принять политику полной глобальной отстраненности, закрыв границы и рынки, чтобы исключить любое иностранное вмешательство во швейцарские дела."
 SWI_armed_neutrality: "Вооруженный нейтралитет"
 SWI_armed_neutrality_desc: "Официально закрепить внешнеполитическую позицию, ориентированную исключительно на оборону, обеспечив тем самым надлежащее оснащение вооруженных сил для защиты независимости страны любой ценой."
 SWI_defend_secrecy: "Защита банковской тайны"
 SWI_defend_secrecy_desc: "Решительно противостоять любому международному давлению с целью отмены законов страны о банковской тайне частного сектора."
 SWI_attract_foreign_investors: "Привлечение иностранных инвесторов"
 SWI_attract_foreign_investors_desc: "Предложить новые стимулы, налоговые льготы и регуляторные гарантии, чтобы побудить международные компании переехать в Швейцарию."
 SWI_market_liberalization: "Либерализация рынка"
 SWI_market_liberalization_desc: "Дерегулирование внутренних рынков и отраслей промышленности в целях содействия свободной конкуренции, инновациям и экономическому росту."
 SWI_keep_swiss_neutrality: "Сохраним швейцарский нейтралитет"
 SWI_keep_swiss_neutrality_desc: "Сохраняйте традиционное, строгое толкование принципа невмешательства, отдавая приоритет финансовой стабильности перед политическими интригами."
 SWI_modernize_neutrality: "Модернизация нейтралитета"
 SWI_modernize_neutrality_desc: "Адаптировать концепцию нейтралитета к современному контексту, что позволит расширить дипломатическое взаимодействие и гуманитарную интервенцию за рубежом."
 SWI_reduce_welfare: "Сокращение расходов на социальное обеспечение"
 SWI_reduce_welfare_desc: "Сократить федеральные расходы на социальные программы и пособия, чтобы уменьшить государственный долг и стимулировать частные сбережения."
 SWI_moderate_police_reforms: "Умеренные реформы полиции"
 SWI_moderate_police_reforms_desc: "Внедрить поэтапные изменения для увеличения финансирования полиции, модернизации оборудования и улучшения отношений с населением."
 SWI_industrial_development: "Промышленное развитие"
 SWI_industrial_development_desc: "Вкладывайте значительные средства в расширение национального производственного сектора и строительство новых промышленных комплексов в стратегически важных районах."
 SWI_swiss_precision: "Швейцарское точное машиностроение"
 SWI_swiss_precision_desc: "Направить национальные исследования и инвестиции на высокотехнологичное производство, часовое производство и специализированное машиностроение."
 SWI_tech_startups: "Поддерживайте технологические стартапы"
 SWI_tech_startups_desc: "Создать благоприятную экосистему финансирования, налоговых льгот и инкубационных программ для содействия бурному развитию отечественного технологического сектора."
 SWI_free_trade: "Свободная торговля"
 SWI_free_trade_desc: "Отмена тарифов и снижение торговых барьеров для полной интеграции швейцарской экономики в глобализированную торговую систему."
 SWI_radical_changes: "Радикальные изменения"
 SWI_radical_changes_desc: "Переоценка политической системы на национальном уровне, прокладывающая путь к революционным, фундаментальным изменениям в Конфедерации."
 SWI_promote_left: "Продвигать левую политику"
 SWI_promote_left_desc: "Начать кампанию по значительному увеличению популярности и влияния коммунистических и социалистических идеологий на всей территории Конфедерации."
 SWI_workers_council: "Рабочие советы берут власть в свои руки."
 SWI_workers_council_desc: "Официально учредить рабочие советы как высшие экономические и политические органы государства, предоставив прямую власть пролетариату."
 SWI_nationalize_banks: "Национализировать банки"
 SWI_nationalize_banks_desc: "Захватить контроль над влиятельным и закрытым банковским сектором страны, передав его в федеральную государственную собственность на благо народа."
 SWI_agricultural_collectivization: "Коллективизация сельского хозяйства"
 SWI_agricultural_collectivization_desc: "Отменить частную собственность на землю и объединить все фермерские хозяйства в крупные государственные коллективные сельскохозяйственные предприятия."
 SWI_workers_cooperatives: "Рабочие кооперативы"
 SWI_workers_cooperatives_desc: "Поддерживать создание рабочих кооперативов, находящихся в собственности и управлении работников, в качестве доминирующей модели производства, сохраняя при этом децентрализованный экономический контроль."
 SWI_militias_of_the_people: "Народные ополчения"
 SWI_militias_of_the_people_desc: "Распустить постоянную армию и заменить её децентрализованной сетью вооружённых, политически надёжных народных ополчений, сформированных из представителей рабочего класса."
 SWI_secret_police: "Тайная полиция"
 SWI_secret_police_desc: "Создать мощную и вездесущую тайную полицию для слежки за контрреволюционной деятельностью и подавления внутреннего инакомыслия."
 SWI_denounce_eu: "Осудить ЕС"
 SWI_denounce_eu_desc: "Официально осудить Европейский союз как буржуазную организацию и разорвать любое швейцарское сотрудничество или политические связи."
 SWI_suppress_party_enemies: "Подавить врагов партии"
 SWI_suppress_party_enemies_desc: "Используйте всю мощь государства для устранения и подавления всех конкурирующих политических партий и организаций."
 SWI_multilingual_worker_solidarity: "Многоязычная рабочая солидарность"
 SWI_multilingual_worker_solidarity_desc: "Подчеркните общую классовую идентичность, преодолевающую языковые различия в стране, чтобы сформировать единый многоязычный пролетариат."
 SWI_peoples_tribune: "Народная Трибьюн"
 SWI_peoples_tribune_desc: "Учредить должность Народного трибуна, выборного представителя, призванного осуществлять народный контроль над властью центрального правительства."
 SWI_central_committee: "Правило Центрального комитета"
 SWI_central_committee_desc: "Наделить высшим политическим авторитетом небольшой, но влиятельный Центральный комитет партии, обеспечив тем самым идеологическую чистоту и централизованное управление."
 SWI_peoples_constitution: "Народная конституция"
 SWI_peoples_constitution_desc: "Разработать и принять новую конституцию, которая закрепит права рабочего класса и формализует социалистическую структуру государства."
 SWI_national_charter: "Национальная хартия"
 SWI_national_charter_desc: "Разработать национальную хартию взамен старой конституции, официально провозглашающую приверженность нового государства националистическим и авторитарным принципам."
 SWI_propaganda_machine: "Пропагандистская машина"
 SWI_propaganda_machine_desc: "Создать сложный государственный медиа-аппарат для контроля за потоком информации и обеспечения идеологической лояльности граждан."
 SWI_economic_self_sufficiency: "Экономическая самодостаточность"
 SWI_economic_self_sufficiency_desc: "Перевести всю швейцарскую экономику на автаркию, отдавая приоритет внутреннему производству и устраняя зависимость от внешней торговли."
 SWI_expel_foreign_companies: "Выслать иностранные компании"
 SWI_expel_foreign_companies_desc: "Необходимо немедленно закрыть и национализировать все предприятия, принадлежащие иностранцам и работающие на территории Швейцарии."
 SWI_revive_the_nf: "Возродить Национальный фронт"
 SWI_revive_the_nf_desc: "Восстановить исторический Национальный фронт и наделить его лидеров полномочиями для продвижения радикальной, националистической и авторитарной политической программы."
 SWI_fascism_idea: "Национальный фронт"
 SWI_fascism_idea_desc: "Национальный фронт — крайне правая партия в Швейцарии, процветавшая в 1930-х годах. По данным Исторического словаря Швейцарии, на пике своего развития группа насчитывала до 9000 членов, а по данным Центра Симона Визенталя — около 25 000. Партия финансировалась Министерством пропаганды Рейха. Она прекратила своё существование в 1940 году и была запрещена Федеральным советом Швейцарии в 1943 году."
 SWI_national_unity: "Национальное единство"
 SWI_national_unity_desc: "Подавить все внутренние разногласия и идеологические конфликты, чтобы сформировать единую, сплоченную национальную волю под властью нового режима."
 SWI_leader_of_a_nation: "Лидер нации"
 SWI_leader_of_a_nation_desc: "Предоставить широкие новые полномочия харизматичной национальной фигуре, обеспечив переход страны к сильному, персонализированному руководству."
 SWI_militarize_society: "Милитаризация общества"
 SWI_militarize_society_desc: "Интегрировать военные принципы в гражданскую жизнь, обеспечивая соблюдение обязательной военной службы и способствуя дисциплине и послушанию по всей стране."
 SWI_fascist_propaganda: "Фашистская пропаганда"
 SWI_fascist_propaganda_desc: "Развернуть агрессивную общенациональную медиакампанию для продвижения идеологии режима и демонизации всех предполагаемых врагов государства."
 SWI_censorship: "Цензура"
 SWI_censorship_desc: "Установить тотальный контроль над всеми формами средств массовой информации, искусства и интеллектуальной деятельности для обеспечения абсолютного идеологического единообразия."
 SWI_pan_alpine_identity: "Панальпийская идентичность"
 SWI_pan_alpine_identity_desc: "Объявить о существовании единого «альпийского народа» на территории Швейцарии и соседних стран, заложив тем самым идеологическую основу для экспансии."
 SWI_ban_radical_neutrals: "Запретить радикальных нейтралов"
 SWI_ban_radical_neutrals_desc: "Запретить все политические группы, выступающие за абсолютный пассивный нейтралитет, назвав их непатриотичными и представляющими опасность для государства."
 SWI_german_superiority: "Немецкое превосходство"
 SWI_german_superiority_desc: "Приоритетное внимание следует уделять немецкоязычному населению и проводить политику культурного и языкового сближения с Германией."
 SWI_swiss_identity: "Швейцарская идентичность"
 SWI_swiss_identity_desc: "Отстаивать уникальную, многоэтническую и бескомпромиссно независимую швейцарскую идентичность, отличающуюся от всех соседних великих держав."
 SWI_alpine_destiny: "Альпийская Судьба"
 SWI_alpine_destiny_desc: "Требуйте объединения всех альпийских территорий под швейцарским флагом и подготовьте вооруженные силы к грядущей войне за объединение."
 SWI_one_party_state: "Однопартийное государство"
 SWI_one_party_state_desc: "Упразднить все оставшиеся демократические институты и формализовать полную, постоянную политическую монополию правящей партии."
 SWI_further_strengthen_the_federation: "Дальнейшее укрепление Федерации"
 SWI_further_strengthen_the_federation_desc: "Швейцария — это страна, построенная на компромиссе между кантонами, культурами и языками. Дальнейшее укрепление федеративной структуры позволит нам обеспечить большую стабильность, улучшить координацию между кантонами и укрепить единство Конфедерации перед лицом как внутренних противоречий, так и внешних угроз."
 SWI_higher_wages: "Повышение заработной платы"
 SWI_higher_wages_desc: "Рост стоимости жизни и растущие экономические потребности требуют принятия мер. Поощряя повышение заработной платы в ключевых секторах, мы можем улучшить уровень жизни, укрепить внутреннее потребление и обеспечить долгосрочную социальную стабильность."
 SWI_universal_education: "Всеобщее образование"
 SWI_universal_education_desc: "Образование — это основа сильной и процветающей нации. Обеспечивая всеобщий доступ к образованию, мы можем гарантировать, что все граждане будут обладать навыками и знаниями, необходимыми для того, чтобы внести свой вклад в будущее Швейцарии."
 SWI_fund_ngo: "Финансируйте НПО"
 SWI_fund_ngo_desc: "Неправительственные организации играют жизненно важную роль в поддержке местных сообществ и решении социальных проблем. Предоставляя государственное финансирование, мы можем расширить их возможности по оказанию услуг населению и дополнить усилия правительства."
 SWI_ban_neutrals: "Запрещенные нейтральные игроки"
 SWI_ban_neutrals_desc: "Швейцария не может позволить себе оставаться нейтральной перед лицом растущих угроз и глобальной нестабильности. Отказываясь от нейтралитета, мы подтверждаем активную роль нашей страны в международных делах и готовимся защищать свои интересы за рубежом."
 SWI_militarized_society: "Милитаризированное общество"
 SWI_militarized_society_desc: "Сильное государство требует сильного гражданского общества. Принимая во внимание милитаризированное общество, мы прививаем дисциплину, боеготовность и общую ответственность за оборону Швейцарии."
 SWI_secret_agency: "Секретное агентство"
 SWI_secret_agency_desc: "Разведка — это основа национальной безопасности. Создав секретное агентство, Швейцария сможет отслеживать угрозы, собирать важную информацию и действовать решительно, прежде чем опасность достигнет наших границ."
 SWI_swiss_companies_only: "Только швейцарские компании"
 SWI_swiss_companies_only_desc: "Для укрепления нашей экономики и защиты внутренних интересов в определенных секторах будут разрешены только швейцарские компании. Это обеспечит рабочие места для наших граждан и сохранит наши отрасли промышленности под национальным контролем."
 SWI_self_sufficiency: "Самодостаточность"
 SWI_self_sufficiency_desc: "Швейцария должна сократить свою зависимость от импорта и обеспечить производство основных ресурсов внутри страны. Содействуя самообеспечению, мы защитим нашу экономику и укрепим национальную устойчивость."
 SWI_workers: "Рабочие"
 SWI_workers_desc: "Сила нации определяется силой её рабочей силы. Проводя политику в интересах трудящихся, мы обеспечиваем справедливую заработную плату, улучшение условий труда и более удовлетворенное и продуктивное население."
 SWI_communism_idea: "Коммунизм"
 SWI_communism_idea_desc: "Вдохновленный социалистическими принципами, швейцарский коммунизм стремится передать средства производства под контроль народа. Путем реструктуризации экономики мы стремимся сократить неравенство и обеспечить, чтобы все граждане имели доступ к национальному богатству."
 SWI_new_age: "Нью Эйдж"
 SWI_new_age_desc: "Прежняя конфедерация исчерпала себя. Распустив федерацию и создав единую республику, Швейцария вступает в новую эру управления, централизуя власть и переопределяя будущее страны."
 SWI_agricultural_collectivization_idea: "Коллективизация сельского хозяйства"
 SWI_agricultural_collectivization_idea_desc: "Для обеспечения продовольствием нации и модернизации сельской местности необходимо организовать фермерские хозяйства в коллективные единицы. Коллективизация сельского хозяйства повысит эффективность, улучшит распределение ресурсов и усилит государственный контроль над производством продуктов питания."
 SWI_censor: "Цензура"
 SWI_censor_desc: "Для сохранения общественного порядка и защиты национальной стабильности необходимо тщательно контролировать информацию. Введение цензуры гарантирует, что вредные идеологии и дестабилизирующая пропаганда не смогут подорвать Швейцарию."
 SWI_central_committee_idea: "Центральный комитет"
 SWI_central_committee_idea_desc: "Сильное государство требует решительного руководства. Создание Центрального комитета укрепляет власть, координирует политику по всей стране и обеспечивает эффективную реализацию видения партии."
 SWI_politica_estera_svizzera: "Politica Estera Svizzera"
 SWI_politica_estera_svizzera_desc: "Внешняя политика Швейцарии всегда была нейтральной. Отклонение от этого курса может дать нам преимущество в различных областях."
 SWI_choosing_our_path: "Выбор нашего пути"
 SWI_choosing_our_path_desc: "Теперь перед нами стоит вопрос о том, что делать с нашей внешней политикой. Некоторые предпочитают нейтралитет, но существует движение за открытие для НАТО и ЕС."
 SWI_opening_up: "Открытие"
 SWI_opening_up_desc: "Мы решили отступить от нашей политики нейтралитета."
 SWI_neutral_foreign_policy: "Нейтральная внешняя политика"
 SWI_neutral_foreign_policy_desc: "Мы решили придерживаться нейтральной позиции. Зачем менять то, что работает?"
 switzerland.17.t: "Выбор нашего пути"
 switzerland.17.desc: "Сейчас самое время решить: изменимся ли мы или останемся неизменными. Независимо от того, изменимся мы или останемся прежними, в любом случае будут преимущества."
 switzerland.17.a: "Мы должны открыться миру!"
 switzerland.17.b: "Зачем менять то, что работает?"
 SWI_digitalisation: "Цифровая Швейцария"
 SWI_digitalisation_desc: "Стратегия Федерального совета «Цифровая Швейцария» обязывает Конфедерацию обеспечить общенациональное покрытие оптоволоконной сетью и перейти на безбумажное администрирование. Модернизация наших сетей позволяет швейцарским компаниям сохранять конкурентоспособность, а гражданам – решать свои дела с государством в режиме онлайн."
 SWI_sustainability: "Энергетическая стратегия до 2050 года"
 SWI_sustainability_desc: "Энергетическая стратегия до 2050 года, одобренная на референдуме, предусматривает поэтапный отказ от атомной энергетики в пользу гидроэнергетики, солнечной энергетики и крупномасштабных систем хранения энергии. Аккумуляторные электростанции обеспечат стабильную выработку возобновляемой энергии в Альпах и не позволят экономическому росту опередить темпы роста окружающей среды."
 SWI_microchip_research: "Исследования в области полупроводников"
 SWI_microchip_research_desc: "Швейцарская точность уже лежит в основе модулей позиционирования u-blox, лабораторий микроэлектроники CSEM и проектных работ ST в Женеве. Направление EPFL и ETH Zurich в сторону проектирования полупроводников позволяет занять свою нишу в отрасли, без которой мир не может функционировать."
 SWI_microchip_plant: "Отечественный литейный завод"
 SWI_microchip_plant_desc: "После того, как проекты доказали свою эффективность, настало время начать строительство. Отечественный литейный завод превращает швейцарские чертежи в швейцарский кремний и защищает нашу отрасль от перебоев с поставками из-за рубежа."
 SWI_defending_swiss_independence: "Защита независимости Швейцарии"
 SWI_defending_swiss_independence_desc: "Для сохранения нейтралитета мы должны сохранить свою независимость. А для этого мы должны прежде всего противостоять иностранному влиянию, которое всё ещё присутствует вокруг и пытается привязать нас к другим сторонам."
 SWI_effort_to_better_relations: "Усилия по улучшению отношений"
 SWI_effort_to_better_relations_desc: "Слишком долго мы разыгрывали карту нейтралитета. Теперь нам необходимо улучшить отношения с соседями, которыми мы так долго пренебрегали."
 SWI_swiss_mercenaries: "Швейцарские наемники"
 SWI_swiss_mercenaries_desc: "Мы должны создать собственные наемные войска. Если кто и умеет воевать в горах, так это наши люди. Именно их мы должны эксплуатировать ради прибыли."
 SWI_swiss_peacekeeping: "Швейцарские миротворцы"
 SWI_swiss_peacekeeping_desc: "В этом нестабильном мире ООН нуждается в миротворцах. Швейцария должна ответить на этот запрос."
 SWI_enforcing_the_uns_will: "Выполнение воли ООН"
 SWI_enforcing_the_uns_will_desc: "Швейцарские контингенты переходят от наблюдения к обеспечению выполнения мандатов, поддерживая мандаты Совета Безопасности войсками, подчиняющимися Берну."
 SWI_befriend_the_eu: "Подружитесь с ЕС"
 SWI_befriend_the_eu_desc: "Теперь нам предстоит сделать выбор: хотим ли мы и дальше придерживаться нейтралитета или хотим подружиться с ЕС?"
 SWI_nato: "НАТО?"
 SWI_nato_desc: "Членство положит конец многовековому формальному нейтралитету. Федеральному совету предстоит решить, стоит ли гарантия безопасности таких затрат."
 SWI_expand_the_mercenaries: "Расширить отряд наемников"
 SWI_expand_the_mercenaries_desc: "Похоже, наши наемники приносят нам некоторую известность во всем мире. Давайте продолжим в том же духе и расширим их отряд!"
 SWI_foreign_investments: "Иностранные инвестиции"
 SWI_foreign_investments_desc: "Мы должны использовать наше вновь обретенное сближение с другими западными странами. Мы можем обращаться к ним с просьбой об инвестициях и предлагать часть из них взамен."
 SWI_local_arms_production: "Местное производство оружия"
 SWI_local_arms_production_desc: "Мы должны продолжать придерживаться нейтралитета, а сделки по продаже оружия можно рассматривать как своего рода сближение. Именно поэтому мы должны производить собственное вооружение."
 SWI_internal_investments: "Внутренние инвестиции"
 SWI_internal_investments_desc: "Мы должны совершенствоваться, тратя собственные деньги на себя, делая внутренние инвестиции."
 SWI_integration_to_nato: "Интеграция в НАТО"
 SWI_integration_to_nato_desc: "Теперь, когда мы вступили в НАТО, нам необходимо начать интегрировать наши старые и новые системы вооружения в соответствии со стандартами НАТО."
 SWI_integration_to_nato_tt: "Каждый второй член НАТО §Y§! получает §G+25§! мнение о Швейцарии"
 SWI_alignment_to_NATO: "Присоединение к НАТО"
 SWI_alone_is_safer: "В одиночестве безопаснее."
 SWI_alone_is_safer_desc: "Хотя мы и открылись Западу, вступление в НАТО — это довольно большой шаг. В этом вопросе мы должны сохранить свою независимость."
 SWI_expanded_trade: "Расширение торговли"
 SWI_expanded_trade_desc: "Нам необходимо расширять торговлю, чтобы заслужить благосклонность ЕС и, возможно, набраться смелости, чтобы в будущем вступить в ЕС."
 SWI_partner_like_everyone: "Партнер, как и все остальные."
 SWI_partner_like_everyone_desc: "Мы не видим никакой пользы в том, чтобы еще больше согласовать нашу торговлю с ЕС. Именно поэтому наши отношения с ЕС должны оставаться такими же согласовывающими, как и с любыми другими странами."
 SWI_bank_of_the_west: "Банк Запада"
 SWI_bank_of_the_west_desc: "У нас есть огромная банковская индустрия, которую мы можем использовать в своих интересах. Однако предлагать её в основном Западу мы должны."
 SWI_idea_environmental_reforms: "Экологические реформы"
 SWI_idea_environmental_reforms_desc: "Комплексные природоохранные законы направлены на сокращение выбросов, защиту природных ресурсов и переход экономики к устойчивому развитию."
 SWI_idea_eco_tourism: "Экотуризм"
 SWI_idea_eco_tourism_desc: "Продвижение экологичного туризма вдохнет новую жизнь в сельские районы, сохраняя при этом первозданную красоту швейцарских ландшафтов."
 SWI_idea_national_parks: "Национальные парки"
 SWI_idea_national_parks_desc: "Расширение охраняемых территорий способствует сохранению дикой природы и укрепляет международный имидж Швейцарии как лидера в области охраны окружающей среды."
 SWI_idea_completely_green: "Полностью экологично!"
 SWI_idea_completely_green_desc: "Благодаря неустанным реформам и инновациям Швейцария достигла полной экологической устойчивости, став страной, полностью работающей на чистой энергии."
 SWI_idea_christian_values: "Христианские ценности"
 SWI_idea_christian_values_desc: "Традиционные христианские принципы лежат в основе социальной политики и укрепляют моральные основы швейцарского общества."
 SWI_idea_fortress_switzerland: "Крепость Швейцария"
 SWI_idea_fortress_switzerland_desc: "Крупные укрепления и современные оборонительные сети гарантируют, что Швейцария остается неприступной в любом конфликте."
 SWI_idea_tax_code: "Упрощенный налоговый кодекс"
 SWI_idea_tax_code_desc: "Упрощенная система налогообложения снижает уклонение от уплаты налогов, привлекает инвестиции и способствует сбалансированной экономике."
 SWI_idea_fdp: "Свободная демократическая партия (СДП)"
 SWI_idea_fdp_desc: "СвДП — либеральная партия, выступающая за свободный рынок, индивидуальное предпринимательство, экономическую свободу и минимальное вмешательство государства."
 SWI_idea_financial_deregulation: "Финансовая дерегуляция"
 SWI_idea_financial_deregulation_desc: "Снижение банковских и финансовых ограничений стимулирует инвестиции, рост и экономическую динамику."
 SWI_idea_sp: "Социал-демократическая партия (СП)"
 SWI_idea_sp_desc: "Социал-демократы направляют политическую систему в сторону повышения социального благополучия и развития международного сотрудничества."
 SWI_idea_fdu: "Федеральный демократический союз (ФДУ)"
 SWI_idea_fdu_desc: "Федеральный демократический союз отстаивает консервативные, евангелические христианские ценности и местную автономию."
 SWI_idea_svp: "Швейцарская народная партия (SVP)"
 SWI_idea_svp_desc: "Швейцарская народная партия выступает за строгий иммиграционный контроль, фискальный консерватизм и национальный суверенитет."
 SWI_idea_defend_secrecy: "Банковская тайна"
 SWI_idea_defend_secrecy_desc: "Все международные попытки подорвать частную банковскую тайну отвергаются. Конфиденциальность клиентов остается законом страны."
