l_braz_por:
 armenia_focus: "Árvore de Foco Armênia"
 ARM_Kocharjan: "A Era de Kocharyan"
 ARM_Kocharjan_desc: "After his predecessor Levon Ter-Petrosyan was ousted as President, Kocharyan was elected as Armenia's second President, defeating his main rival, Karen Demirchyan (who was a former leader of Soviet Armenia), in an early presidential election marred by irregularities and violations by both sides as reported by international electoral observers."
 ARM_manifestation_power: "Manifestação de Poder Político"
 ARM_manifestation_power_desc: "Para provar que nosso papel na governança do país não será abalado, devemos demonstrar nossa vontade e colocar o aparato estatal sob controle."
 ARM_place_agreement: "Acordos de Lugar"
 ARM_place_agreement_desc: "Para consolidar o domínio de Kocharyan no país, devemos negociar discretamente com políticos regionais, autoridades e deputados selecionados."
 ARM_confrontation_mafia: "Confronto com a Máfia"
 ARM_confrontation_mafia_desc: "A máfia armênia, que tem um grande número de conexões com os criminosos russos, tem muita influência no que está acontecendo na Armênia. Precisamos mudar isso."
 ARM_liquidation_bosses: "Eliminação de Chefes"
 ARM_liquidation_bosses_desc: "A máfia está fraca. Chegou a hora de decapitar o dragão com um golpe decisivo de justiça."
 ARM_installing_loyal: "Instale o seu próprio"
 ARM_installing_loyal_desc: "Embora custoso a curto prazo, fortalecer o poder de Kocharyan exige expurgar o aparato estatal de dissidentes. Não há nada a negociar com eles."
 ARM_suppress_opposition: "Suprimir a Oposição"
 ARM_suppress_opposition_desc: "A oposição está muito ativa devido à influência externa sobre a Armênia. É hora de aplicar medidas duras e realizar algumas prisões bem planejadas para conter seu ímpeto."
 ARM_deals_with_bandits: "Acordos com a Máfia"
 ARM_deals_with_bandits_desc: "Os círculos criminosos da Armênia, embora tendam a se exaltar e violar sistematicamente a lei, têm ampla influência sobre o que acontece na Armênia. Talvez não devêssemos combatê-los, mas vassalizar a bandidagem e torná-la lucrativa para nós."
 ARM_domination_over_bandits: "Domínio sobre bandidos"
 ARM_domination_over_bandits_desc: "Embora tenhamos decidido negociar com os bandidos, não devemos dar a eles muito poder. Kocharyan deve estabelecer seu controle sobre eles."
 ARM_autocrats_power: "Poder Autocrático"
 ARM_autocrats_power_desc: "Por fim, Kocharyan não tem obstáculos em seu campo político."
 ARM_Zhirayr_Sefilyan: "Polo Nacional-Democrata"
 ARM_Zhirayr_Sefilyan_desc: "Jirair Sefilian é um comandante militar armênio e ativista político. Durante a Primeira Guerra de Nagorno-Karabakh, ele comandou o batalhão militar especial Shushi. Ele tem lutado há muito tempo contra quaisquer concessões territoriais ao Azerbaijão em Nagorno-Karabakh e contra a influência russa na Armênia. Sefilian é uma das figuras-chave do Partido Pan-Armênio Sasna Tsrer."
 ARM_protectorate: "Baluarte do Cáucaso"
 ARM_protectorate_desc: "A OTAN está ansiosa para se aproximar cada vez mais da Rússia, e enquanto eles já têm a Turquia, podemos aproximá-los ainda mais. Claro, nossas condições serão para que os membros da OTAN garantam nossa independência nacional."
 ARM_mobilization_of_economy: "Mobilização da Economia"
 ARM_mobilization_of_economy_desc: "In order to rebuild the country anew, it is necessary to mobilize the economy and use all our small resources to triple economic indicators."
 ARM_army: "O Exército em uma Nova Era"
 ARM_army_desc: "After the end of the Artsakh War, the Armenian army, which had proven itself, experienced a significant decline, which began even after the collapse of the Soviet Union. Thanks to the Soviet legacy, as well as a large-scale militia, the Armenians managed to defeat Azerbaijan and establish a precarious balance in the region. Old doctrines, as well as outdated weapons, ossified generals and economic problems put an end to the development of the armed forces. The main way of development is the continuation of cooperation with Russia, as well as with other neighbors and partners in the CSTO. However, some military experts insist on a complete overhaul of the military doctrine and structure of the army along the Western lines. Armenia, being in a diplomatically advantageous position, can try to take the best from each side, or take a clear course of cooperation with certain forces. Even without significant resources, Armenia has great potential if it can correctly distribute its priorities."
 ARM_dashnak: "Dashnaktsutyun"
 ARM_dashnak_desc: "A única força política com o direito de governar a Armênia é, sem dúvida, o Dashnaktsutyun, o partido mais antigo da Armênia, que liderou a Primeira República da Armênia desde o berço. Somente sua agenda nacionalista de esquerda pode levar a Armênia à grandeza."
 ARM_monarch: "Restauração da Monarquia"
 ARM_monarch_desc: "Nenhum militar, partido ou qualquer outra figura tem o direito de governar o país. O governante mais legítimo só pode ser um monarca, cuja abordagem paternalista pode levar a Armênia à grandeza."
 ARM_Tsarukyan: "Tsarukyan"
 ARM_Tsarukyan_desc: "Gagik Tsarukyan é um empresário armênio, político e ex-atleta. Tsarukyan é o fundador e líder do partido político Próspera Armênia. Ele também é dono de diversos negócios de grande porte e é considerado um dos homens mais ricos da Armênia."
 ARM_patriotism: "Patriotismo"
 ARM_patriotism_desc: "O patriotismo armênio é abstrato. Muitos procuram sua pátria nas nuvens, na névoa mística, mas ela está tão perto de nós e tão necessitada de nossa atenção, devoção, admiração. Para muitos, a Armênia é apenas uma ideia, amnésia, Sião, um altar. A Armênia precisa de um patriotismo concreto e vivo. A pátria é para o homem, não o homem é para a pátria."
 ARM_berkut: "Onde está o nosso Berkut?"
 ARM_berkut_desc: "A empresa de segurança privada armênia Berkut, surpreendentemente, sempre foi uma unidade altamente equipada composta por ex-criminosos e ex-militares. Talvez valha a pena trazê-la para o nível estatal."
 ARM_remove_competitors: "Removendo os concorrentes"
 ARM_remove_competitors_desc: "Only Tsarukyan can do business in Armenia. It is his realm and other oligarchs either must obey, or else."
 ARM_hard_way: "O Jeito Difícil"
 ARM_hard_way_desc: "Se alguém não quiser obedecer ao novo governo, nós o forçaremos. Você terá que trilhar o caminho árduo de roubar os negócios dos dissidentes rebeldes."
 ARM_Group: "Governo Multi"
 ARM_Group_desc: "Multi Group concern was founded in 1998 on the initiative of Gagik Tsarukyan. The development process and intensive activity of the concern began in 2001, when the concern was created and many large companies were involved in it. The concern regularly ranks in the top ten of the list of Armenia's largest taxpayers."
 ARM_buy_small_business: "Comprando-os"
 ARM_buy_small_business_desc: "Precisamos comprar todos os pequenos negócios das mãos de especuladores da classe média. Devemos dar esse passo para alcançar a Corporatocracia."
 ARM_sports_promotion: "Desenvolvendo o Esporte"
 ARM_sports_promotion_desc: "Devemos desenvolver nossos esportes e promovê-los em todos os lugares possíveis!"
 ARM_pooling_capital: "Reunindo o Capital"
 ARM_pooling_capital_desc: "É hora de combinar todo o capital e obter um bom benefício com isso."
 ARM_savoya: "Casa de Sabóia"
 ARM_savoya_desc: "The last royal family of Armenia was the Lusignan family. When in 1375 the Kingdom of Cilicia was destroyed, the last king Levon VI (Leo VI) passed the title of King of Armenia to James I (Hakob I), King of Cyprus, who was from the same Lusignan family. In 1485, Queen Charlotte passed the title to her cousin Charles the Warrior, Duke of Savoy (in Italy)."
 ARM_monopoly: "Corporatocracia Plena"
 ARM_monopoly_desc: "Agora, o Multi Group deve controlar todas as estruturas governamentais. Que ótima ideia!"
 ARM_bagratuni: "Bagratuni Pretendente?"
 ARM_bagratuni_desc: "The Bagratuni or Bagratid dynasty is an Armenian royal dynasty which ruled the medieval Kingdom of Armenia. Originating as vassals of the Kingdom of Armenia of antiquity, they rose to become the most prominent Armenian noble family during the period of Arab rule in Armenia, eventually establishing their own independent kingdom. They are also the progenitors of the Georgian royal Bagrationi dynasty. However, Roland von Bagratuni did not fully prove his descendancy from the Bagratuni dynasty, which brings many concerns to the members of the Meliq Union."
 ARM_triump_revolution_barhat: "Triunfo da Revolução de Veludo"
 ARM_triump_revolution_barhat_desc: "Nikol Pashinyan tomou o poder na Armênia na onda da Revolução de Veludo."
 arme.51.d: "[GEO.GetNameWithFlag] aceitou nossa proposta diplomática para assinar um acordo de amizade e comércio."
 arme.51.t: "[GEO.GetNameWithFlag] Aceita!"
 arme.51.a: "Maravilhoso！"
 arme.52.t: "[GEO.GetNameWithFlag] Rejeita!"
 arme.52.d: "[GEO.GetNameWithFlag] rejeitou nossa proposta de amizade e troca."
 arme.52.a: "Devemos abandonar nossas tentativas de fazer amizade com a Geórgia."
 arme.53.t: "[ARM.GetNameWithFlag] Solicita acesso ao Mar Negro!"
 arme.53.d: "Recently, the Armenian government showed a will to pay us for access to the Black Sea. Should we agree to their offer?"
 arme.53.a: "Sim, claro!"
 arme.53.b: "Não, vá embora."
 arme.2.t: "Atentado contra a vida do presidente de Nagorno-Karabakh"
 arme.2.d: "A tentativa de assassinato de Arkady Ghukasyan mostrou que nem todos aceitam sua política. Por volta da uma da manhã, o carro do presidente foi alvejado a partir de uma emboscada, que estava a apenas 200 metros da residência. Os terroristas abriram fogo cruzado dos dois lados simultaneamente. Ghukasyan foi ferido nas pernas e dois de seus guardas ficaram gravemente feridos."
 arme.2.a: "Terrível!"
 arme.2.b: "Confronto entre caucasianos."
 arme.2.c: "Precisamos acabar com o banditismo."
 arme.2.o1: "É uma pena que eles não o tenham matado!"
 arme.3.t: "Comunistas do Transcaucaso se uniram na \"Ponte Vermelha\""
 arme.3.d: "No sábado, os comunistas do Azerbaijão, Armênia e Geórgia se uniram novamente. Durante a reunião da liderança máxima dos Partidos Comunistas do Transcaucaso, que ocorreu na Ponte Vermelha (o local onde as fronteiras das três repúblicas se encontram), um protocolo foi assinado para o estabelecimento da organização comunista pública armênio-azerbaijano-georgiana \"Ponte Vermelha - Fraternidade e Amizade\". países, não há contradições, e portanto, os comunistas são a única força capaz de resolver todos os conflitos na região\", disse o camarada Georgadze."
 arme.3.a: "Os comunistas estão tramando alguma coisa."
 arme.3.b: "Inércia do século passado."
 arme.3.c: "Eles estão perdendo tempo."
 arme.3.o1: "O que eles esperam?"
 arme.5.t: "Resultados da investigação"
 arme.5.d: "Os investigadores não conseguem encontrar o verdadeiro mandante do ataque, e todas as evidências, de uma forma ou de outra, levam a nós ou a ex-membros do partido Dashnaktsutyun. De qualquer forma, precisamos encerrar este caso demonstrativo antes que ele vá longe demais. Mas o que diremos no relatório?"
 arme.5.a: "Basta fechar o caso."
 arme.5.b: "Ah, a culpa é dos Dashnaks!"
 arme.9.t: "Projeto Avenida Norte"
 arme.9.d: "A Northern Avenue é um projeto de avenida para pedestres que precisamos construir para atrair investimentos e, possivelmente, gerar bastante renda. No entanto, a questão é: o que devemos fazer com os prédios antigos e seus moradores?"
 arme.9.a: "Compensar parcialmente as perdas"
 arme.9.b: "Compensar integralmente as perdas"
 arme.50.t: "[ARM.GetNameWithFlag] Propõe um acordo comercial!"
 arme.50.d: "[ARM.GetNameWithFlag] propôs recentemente um acordo de amizade e comércio entre nossos países. Devemos concordar com a proposta?"
 arme.10.t: "Acordo de Propriedade por Dívida"
 arme.10.d: "A Armênia concordou em fornecer propriedades em troca do perdão de nossas dívidas estatais. A Armênia foi o único país cujas dívidas estatais não perdoamos por pressão futura, e isso desempenhou seu papel."
 arme.10.a: "Maravilhoso！"
 arme.101.t: "[PER.GetNameWithFlag] Concorda!"
 arme.101.d: "Acordo de defesa secreta foi assinado."
 arme.101.a: "Ótimo！"
 arme.102.t: "[PER.GetNameWithFlag] Nega!"
 arme.102.d: "Acordo de defesa secreta não foi assinado."
 arme.102.a: "Ah."
 arme.103.t: "Rebelião no Curdistão"
 arme.103.d: "Os curdos se rebelaram nas regiões onde residem, localizadas em nosso país, e foram claramente auxiliados por alguém do exterior. Nossos serviços de inteligência relatam que essa foi uma atividade dos serviços especiais armênios."
 arme.103.a: "A Armênia pagará por isso"
 arme.12.t: "Contatando os Oligarcas"
 arme.12.d: "Durante o próximo congresso, onde ocorrerão as discussões entre o governo e os oligarcas, Gagik Tsarukyan se ofereceu para nos ajudar a estabelecer o controle sobre a oposição criando uma coalizão informal entre os partidos."
 arme.12.a: "Claro！"
 arme.13.t: "Oposição enfraquecida!"
 arme.13.d: "Organizações de oposição e burocratas desleais foram expurgados do nosso país e a oposição foi severamente enfraquecida, o que é muito útil em nossa situação. O reinado de Kocharyan se prolonga, por enquanto."
 arme.13.a: "Muito bom"
 arme.131.t: "[USA.GetNameWithFlag] Concorda!"
 arme.131.d: "Conseguimos obter os pagamentos porque o governo de [USA.GetNameWithFlag] está confiante de que estamos totalmente preparados para isso"
 arme.131.a: "Ótimo"
 arme.132.t: "[USA.GetNameWithFlag] Rejeitou Nossa Proposta"
 arme.132.d: "Nosso governo não fez todas as reformas necessárias para que [USA.GetNameWithFlag] concordasse"
 arme.132.a: "Meh"
 arme.14.t: "[ARM.GetNameWithFlag] Entra no §GEstado da União!§!"
 arme.14.d: "Recentemente, o presidente armênio Robert Kocharyan decidiu se juntar ao projeto do Estado da União e se unir a nós e a outros estados-membros!"
 arme.14.a: "Maravilhoso！"
 arme.4.t: "Investigação de Ataque de 1999"
 arme.4.a: "Sim, claro..."
 ARM_develop_infrusture: "Construção de Impacto de Rodovias"
 ARM_build_house: "Construção de Impacto de Novos Edifícios"
 ARM_build_factory: "Impactar a indústria da construção"
 AZE_karabakh_defeat: "Derrota na Guerra do Karabakh"
 AZE_karabakh_defeat_desc: "The defeat in the war of the 90s was a sore wound for our nation. Azerbaijanis crave revenge in order to return their historical lands, as well as return thousands of refugees to their homes."
 AZE_karabakh_revanchism: "Revanchismo de Karabakh"
 AZE_karabakh_revanchism_desc: "O povo azerbaijano, que perdeu a guerra de Artsakh com grande apoio internacional, permaneceu humilhado na arena internacional, e o povo, cegado pelo fracasso, está cada vez mais inclinado ao nacionalismo e à adesão às forças armadas."
 ARM_high_emigration_5: "Grande nível de emigração"
 ARM_high_emigration_5_desc: "Com o colapso da URSS e a deterioração da situação econômica, muitos países da CEI tornaram-se reféns do aumento da migração externa. Nas realidades de hoje, a Armênia está ameaçada de extinção, o que não se pode dizer de seu vizinho oriental e principal inimigo político. A solução da questão demográfica deve se tornar a principal agenda da política armênia.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se o nosso §HPIB§! exceder §H$20B§! e a estabilidade for de pelo menos §H15%§!."
 ARM_high_emigration_4: "Nível substancial de emigração"
 ARM_high_emigration_4_desc: "Com o colapso da URSS e a deterioração da situação econômica, muitos países da CEI tornaram-se reféns do aumento da migração externa. Nas realidades de hoje, a Armênia está ameaçada de extinção, o que não se pode dizer de seu vizinho oriental e principal inimigo político. A solução da questão demográfica deve se tornar a principal agenda da política armênia.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se o nosso §HPIB§! exceder §H$30B§! e a estabilidade for de pelo menos §H24%§!."
 ARM_high_emigration_3: "Alto nível de emigração"
 ARM_high_emigration_3_desc: "Com o colapso da URSS e a deterioração da situação econômica, muitos países da CEI tornaram-se reféns do aumento da migração externa. Nas realidades de hoje, a Armênia está ameaçada de extinção, o que não se pode dizer de seu vizinho oriental e principal inimigo político. A solução da questão demográfica deve se tornar a principal agenda da política armênia.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se o nosso §HPIB§! exceder §H$40B§! e a estabilidade for de pelo menos §H24%§!."
 ARM_high_emigration_2: "Baixo nível de emigração"
 ARM_high_emigration_2_desc: "Com o colapso da URSS e a deterioração da situação econômica, muitos países da CEI tornaram-se reféns do aumento da migração externa. Nas realidades de hoje, a Armênia está ameaçada de extinção, o que não se pode dizer de seu vizinho oriental e principal inimigo político. A solução da questão demográfica deve se tornar a principal agenda da política armênia.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se o nosso §HPIB§! exceder §H$50B§! e a estabilidade for de pelo menos §H34%§!."
 ARM_high_emigration_1: "Pequena Emigração"
 ARM_high_emigration_1_desc: "Com o colapso da URSS e a deterioração da situação econômica, muitos países da CEI tornaram-se reféns do aumento da migração externa. Nas realidades de hoje, a Armênia está ameaçada de extinção, o que não se pode dizer de seu vizinho oriental e principal inimigo político. A solução da questão demográfica deve se tornar a principal agenda da política armênia.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se o nosso §HPIB§! exceder §H$60B§! e a estabilidade for de pelo menos §H44%§!."
 ARM_immigration: "Imigração Positiva"
 ARM_victory_karabakh: "Vitória na Guerra do Karabakh"
 ARM_victory_karabakh_desc: "A vitória na guerra de Karabakh elevou o sentimento nacional dos armênios e também permitiu que muitas pessoas de Artsakh ocupassem altos cargos no governo armênio. Ao mesmo tempo, tirou a motivação para um maior desenvolvimento militar e político.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se concluirmos o foco §HAgenda da Era da Paz§!."
 ARM_armenian_mafia_6: "Máfia Armênia"
 ARM_armenian_mafia_4: "A Máfia Sofreu Perdas"
 ARM_armenian_mafia_3: "Acordos com a Máfia"
 ARM_armenian_mafia_2: "Dominação sobre a máfia"
 ARM_mafia_strikes_back: "A Máfia Contra-Ataca"
 ARM_loyal_in_power: "\"Nosso\" Povo em Lugares"
 ARM_loyal_in_power_desc: "Agora as autoridades regionais estão sob o controle de Kocharyan. No entanto, em prol do poder político, o combate à corrupção está se tornando cada vez mais impossível.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se Robert Kocharyan deixar de ser nosso líder."
 ARM_deals_with_bandits_3: "Acordos com bandidos"
 ARM_deals_with_bandits_3_desc: "Em vez de combater a máfia, construiremos relacionamentos, reduziremos a pressão sobre pequenos negócios e começaremos a controlar grandes fluxos de dinheiro."
 ARM_deals_with_bandits_2: "Dominação sobre bandidos"
 ARM_deals_with_bandits_2_desc: "Agora, a máfia não será capaz de se opor a nós. Controlamos a circulação de dinheiro no país, o que nos dá a oportunidade de usar todas as alavancas de influência sobre a oligarquia."
 ARM_deals_with_bandits_1: "Separação de Esferas de Influência"
 ARM_deals_with_bandits_1_desc: "Dividimos as esferas de influência com as autoridades da máfia armênia. Deixamos os bandidos continuarem a existir, mas nos livramos do inimigo interno."
 ARM_scince_poten_idea: "Potencial Científico"
 ARM_gaz_energy_problems: "Problemas de fornecimento de gás e eletricidade"
 ARM_unistrim_idea_debuf: "Falta de um Sistema de Transação"
 ARM_unistrim_idea_debuf_desc: "Após o colapso da URSS e de seus laços econômicos e de transporte, na era do desenvolvimento digital, a Armênia permanece na periferia do comércio mundial, sem sistemas de transferência eletrônica de dinheiro.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se concluirmos o foco §HArmenian Card§!."
 eastern_church_arm: "Igreja Apostólica Armênia"
 eastern_church_eth: "Igreja Ortodoxa Etíope"
 eastern_church_eth_desc: "The Ethiopian Orthodox Church is one of the Ancient Eastern (pre-Chalcedonian) churches. Until 1959, it was an autonomous church, in canonical dependence on the Coptic Church, after which it received autocephaly. Like other Ancient Eastern churches, it recognizes three Ecumenical Councils and professes Miaphysite Christology. It has its own Ethiopian rite, as well as a special hierarchical structure of the clergy that has no analogues in other church traditions."
 arme.4.d: "Nosso governo iniciou uma investigação oficial sobre o ataque terrorista ao parlamento em 1999. Para não causar muita comoção, o caso está sendo conduzido por investigadores semi-independentes. Vamos ver o que eles descobrem."
