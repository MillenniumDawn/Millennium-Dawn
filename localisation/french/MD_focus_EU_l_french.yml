 EU_budget_subsidies_tooltip: "£click_left §GOn Left Click:§! Raise Growth Subsidies, lowering natural subsidies\n§YPrerequisites:§!\n[!EU_growth_natural_subsidies_click_enabled]\n§YEffects:§!\n[!EU_growth_natural_subsidies_click]\n\n£GFX_click_right §GOn Right Click:§!  Lower Growth Subsidies, raising natural subsidies\n§YPrerequisites:§!\n[!EU_growth_natural_subsidies_right_click_enabled]\n§YEffects:§!\n[!EU_growth_natural_subsidies_right_click]\n"
