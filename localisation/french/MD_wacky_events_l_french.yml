l_french:
 MD_wacky.1.t: "Un contact non identifié la veille de Noël"
 MD_wacky.1.d: "La défense aérienne a suivi un contact bas et lent franchissant la frontière peu après minuit et l'a engagé sans avertissement. L'équipe de récupération signale un traîneau, neuf rennes et un très grand sac de colis emballés."
 MD_wacky.1.a: "Classer l'épave."
 MD_wacky.1.b: "S'excuser auprès des enfants."
 MD_wacky.2.t: "Objet non identifié au-dessus de la capitale"
 MD_wacky.2.d: "Des milliers de personnes ont photographié une lumière triangulaire silencieuse tenant position au-dessus du quartier gouvernemental pendant onze minutes. L'armée de l'air insiste que ses radars n'ont rien suivi du tout."
 MD_wacky.2.a: "Faire décoller les intercepteurs."
 MD_wacky.2.b: "Annoncer que c'était un ballon-sonde."
 MD_wacky.3.t: "Débris spatiaux atterrissent sur le parking du ministère"
 MD_wacky.3.d: "Un réservoir de carburant en titane d'un satellite de communications hors service est tombé pendant la nuit, aplatissant trois véhicules officiels et une haie. Personne n'a été blessé, et aucune agence spatiale n'admet à qui appartenait le satellite."
 MD_wacky.3.a: "Facturer l'État lanceur."
 MD_wacky.3.b: "Le placer dans un musée."
 MD_wacky.4.t: "Les distributeurs automatiques mettent bas le réseau du ministère"
 MD_wacky.4.d: "Le ministère de l'Intérieur a passé une semaine à chasser une cyberattaque étrangère avant que les techniciens ne retracent le trafic jusqu'aux distributeurs intelligents du bâtiment, qui réordonnaient tranquillement des sodas en boucle infinie."
 MD_wacky.4.a: "Débrancher chaque machine du bâtiment."
 MD_wacky.4.b: "Laisser la presse croire que c'était une puissance étrangère."
 MD_wacky_events: "Incident farfelu"
 MD_wacky_classified_intercept: "Interception classifiée"
 MD_wacky_classified_intercept_desc: "L'engagement n'apparaît dans aucun journal publié, et les équipages concernés ont reçu l'ordre de ne jamais discuter de la forme de la cible. Les images des caméras de tir sont toutefois un excellent matériel d'entraînement."
 MD_wacky_ufo_conspiracy: "L'explication du ballon-sonde"
 MD_wacky_ufo_conspiracy_desc: "Personne ne croit le communiqué officiel. Deux comités citoyens rivaux publient désormais des analyses photographiques concurrentes, et un diffuseur a commandé un documentaire sur le silence du gouvernement."
 MD_wacky_debris_exhibit: "Exposition de débris de rentrée"
 MD_wacky_debris_exhibit_desc: "Le réservoir de carburant trône dans un musée national à côté d'une photographie des trois véhicules sur lesquels il a atterri. La fréquentation est en hausse, et un nombre inhabituel d'écoliers visiteurs disent désormais vouloir étudier l'ingénierie."
 MD_wacky_phantom_cyber_threat: "La menace cybernétique fantôme"
 MD_wacky_phantom_cyber_threat_desc: "Le ministère n'a jamais corrigé l'histoire d'une intrusion étrangère, et le budget d'urgence de sécurité réseau a été approuvé sans une seule question. Les distributeurs ont été retirés du bâtiment."