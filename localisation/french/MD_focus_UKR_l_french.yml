 UKR_modernize_mi24pu1_flag: "Completed decision §YDevelop a Mi-24PU1 Modernization§!"
 UKR_modernize_mi24pu2: "Develop a §YMi-24PU2§! Modernization"
 UKR_modernize_mi24pu2_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mi24pu2_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YMi-24PU2§! is a deeper modernization of the §YMi-24PU1§! by the §LKonotop Aircraft Repair Plant Aviakon§!. It adds §YFrench§! sighting and night-vision equipment, a better self-protection suite, and the §Y'Barrier-V'§! anti-tank guided missiles of the §LLuch Design Bureau§!.\n------------------\nThe French equipment is only available while §Y[FRA.GetNameWithFlag]§! holds a good opinion of us.§!"
 UKR_develop_domestic_atgm_category: "Develop Domestic ATGMs"
 UKR_develop_domestic_atgm_category_desc: "\n\n\n\n\n\n£UKR_desctext_atgm_main\n\n\n\n\n\n\n\n\nWe can invest time and resources into developing and modernizing domestic anti-tank guided missile systems together with the §LLuch Design Bureau§! in Kyiv."
 UKR_develop_domestic_atgm_barrier: "Develop §Y'Barrier'§! ATGM"
 UKR_develop_domestic_atgm_barrier_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_barrier_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §Y'Barrier'§! is a §Y[ROOT.GetFlag]Ukrainian§! anti-tank guided missile developed by the §LLuch Design Bureau§! for armored vehicles and helicopters.\nIts 130 mm laser beam-riding missile with a tandem warhead is designed to defeat armored targets protected by explosive reactive armor (ERA) at ranges of up to 5 kilometres.\n------------------\nThis Decision is a §Rprerequisite§! for unlocking all other decisions in the same equipment category and for the §YMi-24PU2§! modernization. If you §Rskip§! this decision, you will §Rlose§! the opportunity to complete them.§!"
 UKR_develop_domestic_atgm_barrier_flag: "Completed decision §YDevelop 'Barrier' ATGM§!"
 ukraine_equipment_develop_domestic_atgm.6.name: "'Barrier' ATGM: Development Finished"
 ukraine_equipment_develop_domestic_atgm.6.desc: "The Luch Design Bureau has finished the development of the 'Barrier' ATGM. Its experience with laser beam-riding guidance opens the way to a new generation of [ROOT.GetAdjective] anti-tank missiles."
 ukraine_equipment_develop_domestic_atgm.6.a: "Continue the work"
 UKR_develop_domestic_atgm_barrier_s: "Develop §Y'Barrier-S'§! ATGM"
 UKR_develop_domestic_atgm_barrier_s_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_barrier_s_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §Y'Barrier-S'§! is a [ROOT.GetFlag]Ukrainian anti-tank guided missile (ATGM) system developed by the §LLuch Design Bureau§! based on the §Y'Shturm-S'§! ATGM.\nThe §Y'Barrier-S'§! is designed to destroy modern armored targets with combined, spaced or monolithic armor, including explosive reactive armor (ERA).§!"
 ukraine_equipment_develop_domestic_atgm.7.name: "'Barrier-S' ATGM: Development Finished"
 ukraine_equipment_develop_domestic_atgm.7.desc: "The Luch Design Bureau has finished refitting the 'Shturm-S' tank destroyer with 'Barrier' missiles, and we can select the next step for acquiring the 'Barrier-S' into our [ROOT.GetFlag] [ROOT.GetAdjective] Armed Forces."
 ukraine_equipment_develop_domestic_atgm.7.a: "Get the design itself"
 ukraine_equipment_develop_domestic_atgm.7.b: "Launch the full-scale production"
 UKR_equipment_develop_domestic_stuhna_p_atgm: "Develop §YRK-2 'Stuhna-P'§! ATGM"
 UKR_equipment_develop_domestic_stuhna_p_atgm_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_stuhna_p_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YRK-2 'Stuhna-P'§!, also known by its export version name §Y'Skif'§!, is a §Y[ROOT.GetFlag]Ukrainian§! anti-tank guided missile (ATGM) system developed in the early 2010s by the §LLuch Design Bureau§!.\nThe §YStuhna-P§! is designed to destroy modern armored targets with combined, spaced or monolithic armor, including explosive reactive armor (ERA).\n§YStuhna-P§! can attack both stationary and moving targets from both long range up to 5 kilometres in the daytime and close range of more than 100 metres.\n------------------\nThis Decision is a §Rprerequisite§! for unlocking the next §Y7§! decisions in the same equipment category and for the §YT-84-140 'Bahira'§! and §YObject 477A1 'Nota'§! tank decisions. If you §Rskip§! this decision, you will §Rlose§! the opportunity to complete the subsequent ones.§!"
 UKR_equipment_develop_domestic_stuhna_p_atgm_flag: "Completed decision §YDevelop RK-2 'Stuhna-P' ATGM§!"
 ukraine_equipment_develop_domestic_atgm.1.name: "RK-2 'Stuhna-P' ATGM: Development Finished"
 ukraine_equipment_develop_domestic_atgm.1.desc: "The wonderful people at Luch Design Bureau have finished the development of the RK-2 'Stuhna-P' ATGM, and we can select the next step for acquiring this new system into our [ROOT.GetFlag] [ROOT.GetAdjective] Armed Forces."
 ukraine_equipment_develop_domestic_atgm.1.a: "Get the design itself"
 ukraine_equipment_develop_domestic_atgm.1.b: "Launch the full-scale production"
 ukraine_equipment_develop_domestic_atgm.1.c: "Prepare for the full-scale production"
 UKR_Develop_Domestic_ATGM_Stuhna_P_kyiv_expansion_tt: "In §Y240 to 300 days§!, §YKyiv§! gains §G1 Military Factory§!, and we receive the §YRK-2 Stuhna-P§! design with its own production line."
 ukraine_equipment_develop_domestic_atgm.2.name: "RK-2 'Stuhna-P' ATGM: Ready for Production"
 ukraine_equipment_develop_domestic_atgm.2.desc: "We have finished expanding the Luch Design Bureau's factory and refitting its equipment, so full-scale production of the RK-2 'Stuhna-P' ATGM can begin."
 ukraine_equipment_develop_domestic_atgm.2.a: "Great! Now launch the production"
 UKR_equipment_develop_domestic_corsar_atgm: "Develop §YRK-3 'Corsar'§! ATGM"
 UKR_equipment_develop_domestic_corsar_atgm_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_rk3_corsar_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YRK-3 'Corsar'§! is a §Y[ROOT.GetFlag]Ukrainian§! light portable anti-tank guided missile developed by §LLuch Design Bureau§!.\nThe §Y'Corsar'§! is likely to replace Soviet era anti-tank systems such as the §Y9K113 'Konkurs'§! and §Y9K111 'Fagot'§!.\nIt is intended to destroy stationary and moving armored targets. It can also be used against emplacements, light-armored objects and helicopters.\nFiring can be carried out from the mount as well as from a trench parapet. A method of guidance is laser beam riding.\n------------------\nThis Decision is a §Rprerequisite§! for unlocking the next §Y1§! decision in the same equipment category. If you §Rskip§! this decision, you will §Rlose§! the opportunity to complete the subsequent one.§!"
 UKR_equipment_develop_domestic_corsar_atgm_flag: "Completed decision §YDevelop RK-3 'Corsar' ATGM§!"
 ukraine_equipment_develop_domestic_atgm.3.name: "RK-3 'Corsar' ATGM: Development Finished"
 ukraine_equipment_develop_domestic_atgm.3.desc: "The wonderful people at Luch Design Bureau have finished the development of the RK-3 'Corsar' ATGM, and we can select the next step for acquiring this new system into our [ROOT.GetFlag] [ROOT.GetAdjective] Armed Forces."
 ukraine_equipment_develop_domestic_atgm.3.a: "Get the design itself"
 ukraine_equipment_develop_domestic_atgm.3.b: "Launch the full-scale production"
 ukraine_equipment_develop_domestic_atgm.3.c: "Prepare for the full-scale production"
 UKR_Develop_Domestic_ATGM_RK3_Corsar_kyiv_expansion_tt: "In §Y240 to 300 days§!, §YKyiv§! gains §G1 Military Factory§!, and we receive the §YRK-3 Corsar§! design with its own production line."
