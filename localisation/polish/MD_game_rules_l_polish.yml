 RULE_INFLUENCE_COOLDOWN: "Czas odnowienia wzmocnienia wpływu inwestycji"
 RULE_14_DAY_INFLUENCE: "14 dni odnowienia"
 RULE_14_DAY_INFLUENCE_DESC: "Opcja domyślna. Czas odnowienia wpływów uzyskanych dzięki inwestowaniu wynosi 14 dni lub 2 tygodnie. Dotyczy to narodu w zakresie wszystkich możliwych możliwości inwestycyjnych. Chociaż nadal możesz inwestować, w tym okresie nie zyskasz żadnego wpływu."
 RULE_0_DAY_INFLUENCE: "Brak odnowienia"
 RULE_0_DAY_INFLUENCE_DESC: "Wpływ starej szkoły MD uzyskany z limitu czasu inwestycji. Możesz inwestować tak często, jak chcesz, jednocześnie zyskując wpływy. Nie jest to zalecane dla tych, którzy lubią równowagę!"
 RULE_30_DAY_INFLUENCE: "30-dniowy okres odnowienia"
 RULE_30_DAY_INFLUENCE_DESC: "Sugerowana opcja gry wieloosobowej. Czas odnowienia wpływów uzyskanych dzięki inwestowaniu wynosi 30 dni lub około 1 miesiąca. Dotyczy to narodu w zakresie wszystkich możliwych możliwości inwestycyjnych. Chociaż nadal możesz inwestować, w tym okresie nie zyskasz żadnego wpływu."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_TICK: "Włącz comiesięczny wzrost §Yniezależności krajowej§!"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_TICK_NO_DESC: "Wyłącz comiesięczny wzrost §Yniezależności krajowej§!"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_TICK_YES_DESC: "Włącza comiesięczny wzrost §Yniezależności krajowej§!. Co miesiąc §Yniezależność wewnętrzna§! będzie rosła o wartość określoną w regule gry „Miesięczny wzrost §Yniezależności krajowej§!”, która domyślnie wynosi 0,10% miesięcznie."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT: "Miesięczny wzrost §Yniezależności krajowej§!"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_05: "0,05%"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_05_DESC: "Co miesiąc §Yniezależność krajowa§! wzrasta o 0,05%, jeśli włączony jest znacznik wzrostu §Yniezależności krajowej§!."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_10: "0,10%"
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_10_DESC: "Co miesiąc §Yniezależność krajowa§! wzrasta o 0,10%, jeśli włączony jest znacznik wzrostu §Yniezależności krajowej§!."
 RULE_MONTHLY_DOMESTIC_INFLUENCE_GAIN_AMOUNT_15: "0,15%"
