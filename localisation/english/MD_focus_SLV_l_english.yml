 slovenia.9.t: "Slovenia Joins NATO"
 slovenia.9.d: "The Slovenian flag has been raised at NATO headquarters in Brussels alongside six other new members in the largest enlargement in the alliance's history. Thirteen years after independence, the country stands under the Article 5 umbrella."
 slovenia.9.a: "A safer place in the world"
 slovenia.10.t: "Slovenia Joins the European Union"
 slovenia.10.d: "At midnight the barriers on the Austrian, Italian and Hungarian borders were lifted to fireworks and brass bands. Slovenia enters the Union as the wealthiest of the ten new members, and the first structural funds are already earmarked for roads and rail."
 slovenia.10.a: "Back among the European core"
 slovenia.11.t: "The Tolar Gives Way to the Euro"
 slovenia.11.d: "Slovenia is the first of the new member states to adopt the euro, retiring the tolar after fifteen years of service. The changeover has gone smoothly, and cheaper borrowing is expected to keep the economy growing above the eurozone average."
 slovenia.11.a: "Farewell to the tolar"
 slovenia.12.t: "Schengen Opens the Borders"
 slovenia.12.d: "Slovenia has entered the Schengen area and the last passport booths on the Austrian, Italian and Hungarian crossings are being dismantled. The Croatian border now forms the Union's external frontier, policed to Brussels standards."
 slovenia.12.a: "Europe without checkpoints"
