 ukraine_praktyka_otaman_plan_8x8_tt: "Прототип §YОтаман 8x8§! будет готов через §Y$DAYS$§! дн. Затем мы выберем, расширять ли линейку 8x8 или улучшать бронетранспортёр."
 ukraine_praktyka_otaman_plan_both_tt: "Оба прототипа будут готовы через §Y$DAYS$§! дн., и обе линии продолжатся дальше."
