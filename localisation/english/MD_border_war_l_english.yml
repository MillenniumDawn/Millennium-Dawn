 border_war_mobilization_idea: "General Mobilization"
 border_war_mobilization_idea_desc: "The armed forces have moved to a crisis footing along the disputed frontier."

 pak_raj_border_train_army: "Conduct Army Exercises"
 pak_raj_border_train_army_desc: "Commit infantry and command units to a fifteen-day exercise. Costs 20 Command Power, 30 infantry equipment, and 7 command equipment. Increases Readiness by 12."
 pak_raj_border_train_mechanized: "Conduct Mechanized Exercises"
 pak_raj_border_train_mechanized_desc: "Commit mechanized formations to a fifteen-day exercise. Costs 20 Command Power and armored equipment. Increases Readiness by 20, with a risk of an accident."
 pak_raj_border_train_artillery: "Conduct Artillery Exercises"
 pak_raj_border_train_artillery_desc: "Drill artillery formations near the frontier. Costs 20 Command Power and 10 artillery equipment. Increases Readiness by 8."
 pak_raj_border_stage_incursion: "Stage a Border Incursion"
 pak_raj_border_stage_incursion_desc: "Send infantry patrols across the frontier. Costs 20 Command Power and 100 infantry equipment. Increases Bilateral Tension by 15 and carries a risk of casualties."
 pak_raj_border_shell_positions: "Shell Border Positions"
 pak_raj_border_shell_positions_desc: "Use artillery to strike rival positions. Costs 20 Command Power and 15 artillery equipment. Increases Bilateral Tension by 22, creates more world tension, and carries a risk of retaliation."
 pak_raj_border_negotiate: "Open Indo-Pakistani Talks"
 pak_raj_border_negotiate_desc: "Use mutual goodwill to reduce Bilateral Tension by 25. A peaceful crisis settlement backed by strong mutual trust can permanently regulate the frontier."
 pak_raj_border_negotiate_tt: "§GIndo-Pakistani Bilateral Tension decreases by 25§!"
 pak_raj_border_settlement_tt: "§GIndia and Pakistan establish a lasting border settlement§!"
 pak_raj_border_issue_ultimatum: "Issue a Territorial Ultimatum"
 pak_raj_border_issue_ultimatum_desc: "Demand the exact state supported by our local momentum. Rejection allows a limited war goal against that state."
 pak_raj_border_ultimatum_tt: "The rival may return the disputed state or reject the demand and risk a limited war."
 pak_raj_border_stand_down: "Stand Down From the Crisis"
 pak_raj_border_stand_down_desc: "End the crisis, reduce Bilateral Tension by 30, and accept a loss of War Support."
 pak_raj_border_stand_down_tt: "§GEnds the crisis and reduces Indo-Pakistani Bilateral Tension by 30§!"
 pak_raj_border_reject_ultimatum_tt: "§RThe issuer may create a limited war goal for the disputed state§!"
 pak_raj_border_mediation_offer_tt: "The crisis escalator will decide whether to accept American mediation."

 raj_chi_border_train_army: "Conduct Army Exercises"
 raj_chi_border_train_army_desc: "Commit infantry and command units to a fifteen-day high-altitude exercise. Costs 20 Command Power, 30 infantry equipment, and 7 command equipment. Increases Readiness by 12."
 raj_chi_border_train_mechanized: "Conduct Mechanized Exercises"
 raj_chi_border_train_mechanized_desc: "Commit mechanized formations to a fifteen-day high-altitude exercise. Costs 20 Command Power and armored equipment. Increases Readiness by 20, with a risk of an accident."
 raj_chi_border_train_artillery: "Conduct Artillery Exercises"
 raj_chi_border_train_artillery_desc: "Drill artillery formations along the Line of Actual Control. Costs 20 Command Power and 10 artillery equipment. Increases Readiness by 8."
 raj_chi_border_stage_incursion: "Stage a Border Incursion"
 raj_chi_border_stage_incursion_desc: "Send infantry patrols across the Line of Actual Control. Costs 20 Command Power and 100 infantry equipment. Increases Bilateral Tension by 15 and carries a risk of casualties."
 raj_chi_border_shell_positions: "Shell Border Positions"
 raj_chi_border_shell_positions_desc: "Use artillery to strike rival positions. Costs 20 Command Power and 15 artillery equipment. Increases Bilateral Tension by 22, creates more world tension, and carries a risk of retaliation."
 raj_chi_border_negotiate: "Open Sino-Indian Talks"
 raj_chi_border_negotiate_desc: "Use mutual goodwill to reduce Bilateral Tension by 25 and end an active confrontation."
