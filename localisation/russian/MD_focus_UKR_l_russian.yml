 ukraine_sov_equipment_factories.1.desc: "Новая производственная линия в §YКиеве§! готова. Наша армия принимает на вооружение ожидавшие её проекты, и начинается производство."
 ukraine_sov_equipment_factories.1.a: "Начать производство"
 ukraine_sov_equipment_factories.2.name: "Николаевская производственная линия готова"
 ukraine_sov_equipment_factories.2.desc: "Новая производственная линия в §YНиколаеве§! готова. Наша армия принимает на вооружение ожидавшие её проекты, и начинается производство."
