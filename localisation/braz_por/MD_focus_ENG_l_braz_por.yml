 ENG_michael_wigston_trait: "Defensor do Pessoal"
 ENG_john_reith_hc_trait: "Comandante Aerotransportado da OTAN"
 ENG_royal_armed_forces_review: "Revisão das Forças Reais"
 ENG_royal_armed_forces_review_desc: "As Forças Armadas da Coroa merecem mais do que prestígio cerimonial. Uma revisão sistemática da doutrina, dos padrões de treinamento e da prontidão das três forças reconstruirá as Forças Armadas Reais como uma força de combate crível, digna da monarquia."
 ENG_household_division_revival: "Renascimento da Divisão Doméstica"
 ENG_household_division_revival_desc: "A Divisão Doméstica sempre foi a ponta de lança do Exército Britânico. Reviver suas tradições e ampliar seu papel restaura um núcleo de elite cuja qualidade, disciplina e espírito de corpo o distinguem do restante da força."
 ENG_jewel_of_the_admiralty: "Joia do Almirantado"
 ENG_jewel_of_the_admiralty_desc: "A Marinha Real é o mais antigo símbolo da projeção de poder britânica. Reinvestir em seus navios capitais, ampliar seu alcance operacional e reconstruir sua cultura institucional mostra ao mundo que a Britânia ainda domina os mares."
 ENG_wings_of_the_crown: "Asas da Coroa"
 ENG_wings_of_the_crown_desc: "A Real Força Aérea nasceu do cadinho da Primeira Guerra Mundial e foi decisiva na Segunda. Novos investimentos em treinamento de pilotos, doutrina de combate aéreo e formação de ases garantem que a superioridade aérea continue sendo um pilar da defesa britânica."
 ENG_imperial_general_staff_restored: "O Estado-Maior Imperial Restaurado"
 ENG_imperial_general_staff_restored_desc: "O Estado-Maior Imperial já coordenou o poder terrestre, naval e aéreo de um império global. Restaurar uma estrutura de comando conjunto unificada coloca as forças armadas sob uma única visão estratégica, maximizando sua eficácia combinada."
 ENG_reservist_corps_act: "Lei do Corpo de Reservistas"
 ENG_reservist_corps_act_desc: "As forças de reserva da Grã-Bretanha há muito são um recurso subaproveitado. Uma nova Lei do Corpo de Reservistas formaliza metas de recrutamento, acelera os procedimentos de mobilização e vincula mais de perto as unidades de reserva às suas contrapartes do exército regular."
 ENG_global_anglosphere_initiative: "A Iniciativa Anglosfera Global"
 ENG_global_anglosphere_initiative_desc: "As nações de língua inglesa compartilham mais do que um idioma: compartilham tradições jurídicas, instituições democráticas e laços históricos forjados ao longo de séculos. Uma iniciativa coordenada da Anglosfera dá à Coroa uma plataforma diplomática para aprofundar esses laços e fortalecer a influência britânica de Ottawa a Canberra."
 ENG_crown_realm_status: "Reino da Coroa"
 ENG_crown_realm_status_desc: "Esta nação reconhece o monarca britânico como chefe de Estado. O arranjo constitucional proporciona estabilidade política e laços estreitos com a Commonwealth."
 ENG_crown_realm_monthly_influence_tt: "Influência britânica mensal: §R+4%§!"
 ENG_crown_diplomatic_corps: "Corpo Diplomático da Coroa"
 ENG_crown_diplomatic_corps_desc: "Um corpo dedicado de enviados reais, escolhidos entre os melhores talentos diplomáticos que a Grã-Bretanha pode oferecer, representará diretamente os interesses da Coroa em cortes e capitais estrangeiras. Seu mandato é melhorar as relações, facilitar negociações e garantir que a voz da Coroa tenha peso em todos os cantos do mundo."
 ENG_royal_visits_abroad: "Visitas Reais ao Exterior"
 ENG_royal_visits_abroad_desc: "Uma turnê real bem planejada pode realizar o que meses de diplomacia discreta não conseguem. A presença pessoal do monarca no exterior sinaliza comprometimento, gera boa vontade e deixa uma impressão duradoura em governos e populações."
 ENG_pax_britannica_reborn: "Pax Britannica Renascida"
 ENG_pax_britannica_reborn_desc: "A Pax Britannica do século XIX foi construída sobre supremacia naval, prestígio cultural e um alcance diplomático inigualável. Pelo renascimento da monarquia, pela reorientação da Anglosfera e por um renovado compromisso com o engajamento global, a Grã-Bretanha pode restaurar um equivalente moderno: uma era de estabilidade sustentada pelo poder e pelo propósito britânicos."
 ENG_royal_visits.1.t: "Uma Turnê Real"
 ENG_royal_visits.1.d: "Os conselheiros do monarca apresentam uma lista de regiões onde uma turnê real traria os maiores retornos diplomáticos. A escolha determinará onde o poder brando britânico será concentrado e quais governos se beneficiarão da atenção pessoal da Coroa."
 ENG_royal_visits.1.a: "Turnê pela África"
 ENG_royal_visits.1.b: "Turnê pelo Sul e Sudeste Asiático"
 ENG_royal_visits.1.c: "Turnê pelo Oriente Médio"
 ENG_royal_visits.1.e: "Turnê pela América Latina"
 ENG_crown_diplomatic_corps_idea: "Corpo Diplomático da Coroa"
 ENG_crown_diplomatic_corps_idea_desc: "Um corpo ativo de enviados reais atua no exterior, mantendo contatos pessoais com governos estrangeiros e facilitando a agenda diplomática da Coroa. Sua presença reduz o custo de manter relações e gera um fluxo constante de capital político."
 ENG_army_field_exercise: "Exercício Anual de Campo"
 ENG_army_field_exercise_desc: "As brigadas do Exército Britânico realizam exercícios de campo em larga escala para aprimorar as habilidades de armas combinadas e elevar a prontidão."
 ENG_army_engineering_corps: "Programa de Engenharia de Combate"
 ENG_army_engineering_corps_desc: "Investimentos em treinamento e equipamentos de engenharia de combate melhoram a capacidade do Exército de operar em terrenos complexos."
 ENG_armoured_tactics_programme: "Programa de Táticas Blindadas"
 ENG_armoured_tactics_programme_desc: "Exercícios que integram novos veículos blindados com infantaria e artilharia aprimoram a doutrina da guerra blindada moderna."
 ENG_energy_transition_programme: "Programa de Transição Energética"
 ENG_energy_transition_programme_desc: "Uma estratégia interministerial para acelerar a transição para energia de baixo carbono fortalece a confiança pública e o investimento industrial."
 ENG_critical_materials_reserve: "Reserva de Materiais Críticos"
 ENG_critical_materials_reserve_desc: "Um estoque de materiais industriais críticos, financiado pelo governo, protege a manufatura britânica de interrupções na cadeia de suprimentos."
 ENG_research_excellence_awards: "Prêmios de Excelência em Pesquisa"
 ENG_research_excellence_awards_desc: "Prêmios competitivos para universidades e institutos de pesquisa impulsionam avanços em eletrônica e tecnologia digital."
 ENG_case_by_case_intervention_desc: "Não podemos simplesmente abrir mão da nossa capacidade de opinar em assuntos de importância pública só porque desprezamos um governo maior. Em vez disso, devemos analisar cada caso individualmente e buscar uma solução melhor."
 ENG_the_wonga_coup: "A Lista Wonga"
 ENG_the_wonga_coup_desc: "A Guiné Equatorial está situada sobre vastas reservas de petróleo, e financistas britânicos, incluindo figuras de destaque como Mark Thatcher, filho da ex-primeira-ministra Margaret Thatcher, desejam garantir direitos preferenciais sobre o petróleo de $STATE_319$. Teodoro Obiang Nguema Mbasogo está em posição isolada, e o líder da oposição Severo Moto Nsá parece uma alternativa preferível. Para isso, os conspiradores pretendem usar mercenários para derrubar Obiang e instalar Moto como presidente.  "
 britain_md.40.t: "Mercenários Detidos no Aeroporto de Harare"
 britain_md.40.d: "As autoridades detiveram um grupo de homens fortemente armados no Aeroporto Internacional de Harare. Oficialmente alegam ser contratados de segurança que compram equipamentos para operações de mineração na República Democrática do Congo, mas relatórios de inteligência sugerem que podem estar se preparando para uma operação contra o governo da Guiné Equatorial."
 britain_md.40.a: "Permanecerão sob custódia."
 britain_md.40.b: "Soltá-los discretamente"
 britain_md.41.t: "O Golpe Wonga Fracassa"
 britain_md.41.d: "As autoridades zimbabuanas prenderam mais de sessenta supostos mercenários, liderados por Simon Mann, depois que seu avião pousou no Aeroporto Internacional de Harare. Autoridades alegam que o grupo tentava comprar equipamento militar antes de seguir para a Guiné Equatorial. Alegações que ligam financiadores britânicos à trama terminaram em constrangimento para nós."
 britain_md.41.a: "Um desfecho infeliz."
 britain_md.42.t: "Sucesso do Golpe Wonga"
 britain_md.42.d: "A operação foi bem-sucedida. O presidente Teodoro Obiang Nguema Mbasogo foi deposto e o líder da oposição Severo Moto Nsá declarou-se chefe de um novo governo. Embora enfrentemos condenação internacional, os interesses comerciais britânicos agora desfrutam de uma influência sem precedentes em uma das nações mais ricas em petróleo da África."
 britain_md.42.a: "Um investimento lucrativo."
 britain_md.43.t: "Conspiração Estrangeira Esmagada"
 britain_md.43.d: "As autoridades confirmaram relatos de que mercenários estrangeiros pretendiam derrubar o governo e instalar a figura da oposição Severo Moto Nsá como presidente. Graças às prisões no Zimbábue, a conspiração foi desmantelada antes de chegar às nossas costas."
 britain_md.43.a: "A República se mantém"
 britain_md.44.t: "A Queda de Obiang"
 britain_md.44.d: "O presidente Teodoro Obiang Nguema Mbasogo foi afastado do poder depois que forças mercenárias e apoiadores da oposição tomaram o controle de Malabo e de outras posições-chave do governo. Severo Moto Nsá assumiu a liderança de um novo governo de transição."
 britain_md.44.a: "Meu Deus"
 britain_md.45.t: "Mercenários Financiados pelos Britânicos Derrubam o Governo da Guiné Equatorial"
 britain_md.45.d: "O presidente Teodoro Obiang Nguema Mbasogo foi afastado do poder depois que forças mercenárias e apoiadores da oposição tomaram o controle de Malabo e de outras posições-chave do governo. Severo Moto Nsá assumiu a liderança de um novo governo de transição."
 britain_md.45.a: "Um destino de férias incomum."
 britain_md.46.t: "Mercenários Presos no Zimbábue"
 britain_md.46.d: "As autoridades zimbabuanas prenderam mais de sessenta supostos mercenários depois que seu avião pousou no Aeroporto Internacional de Harare. Autoridades alegam que o grupo tentava comprar equipamento militar antes de seguir para a Guiné Equatorial. Os homens, supostamente liderados pelo ex-oficial do Exército Britânico Simon Mann, insistem que prestavam serviços de segurança para operações de mineração na África Central. No entanto, os investigadores alegam que faziam parte de uma conspiração maior para derrubar o presidente Teodoro Obiang Nguema Mbasogo, da Guiné Equatorial."
 britain_md.46.a: "Um destino de férias incomum."
