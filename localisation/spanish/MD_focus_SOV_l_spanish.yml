 SOV_500_days_category: "Programa de 500 Días"
 SOV_500_days_category_desc: "El Programa de los 500 días fue una iniciativa propuesta en 1990 por el economista soviético Stanislav Shatalin y el presidente de la Comisión de Reformas Económicas Grigori Yavlinski. El objetivo principal de este programa era la transición de una economía planificada al capitalismo de mercado mediante la reducción del papel del Estado en la economía. Desafortunadamente, el programa nunca se implementó porque el estamento soviético lo consideró demasiado radical.\n¡Tras los errores de la terapia de choque de Gaidar y la mala gestión económica de los gobiernos anteriores, la situación económica actual nos exige volver a intentarlo e implementar plenamente el Programa de los 500 días para completar la conversión hacia una economía de mercado moderna!"
