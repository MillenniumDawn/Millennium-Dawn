 ukr_light_transport_tender: "Hold a Tender for a New \n§YLight Transport Vehicle§!"
 ukr_light_transport_tender_desc: "\n\n\n\n\n\n\n£UKR_desctext_develop_domestic_dozor_a_for_tooltip\n\n\n\n\n\n\n\n\n§WThe Ukrainian Armed Forces require a new generation of light transport vehicles to replace aging Soviet-era utility vehicles. Several domestic manufacturers have presented proposals for a new vehicle intended to serve as a general-purpose transport platform for the armed forces and other state institutions.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_offers: "Collect §YBRDM-2§! modernization offers"
 ukraine_modernize_sov_equipment_brdm_2_modernization_offers_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2_for_tooltip\n\n\n\n\n\n\n\n\n§WOur army still relies on hundreds of Soviet §YBRDM-2§! scout cars. The Ministry of Defence can ask our defense industry how to bring them up to date.\n\nWhen the offers are in, we choose one contractor for the program or close it for good.\n------------------\nThis Decision is a §Rprerequisite§! for all other §YBRDM-2§! modernization decisions. If you §Rskip§! this decision, you will §Rlose§! the opportunity to complete them.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_offers_mission: "Deadline: §YBRDM-2§! modernization offers"
 ukraine_modernize_sov_equipment_brdm_2_modernization_offers_mission_desc: "$ukraine_modernize_sov_equipment_brdm_2_modernization_offers_desc$\n\n§RWhen the timer runs out, the offers reach us anyway and we have to choose.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_other_manufacturers: "Invite other manufacturers to the §YBRDM-2§! program"
 ukraine_modernize_sov_equipment_brdm_2_modernization_other_manufacturers_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2_other_for_tooltip\n\n\n\n\n\n\n\n\n§WThe BRDM-2 work in Mykolayiv has caught the attention of other companies. §YNVK Techimpex§!, the §YMayak§! plant in Kyiv, the §YVEPR§! company in Kremenchuk and the §Y45th Experimental Mechanical Plant§! in Vinnytsia want to join the program, but they need spare BRDM-2 hulls from our stockpile to start.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_late: "Decide how to upgrade our remaining §YBRDM-2§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_late_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2l1_for_tooltip\n\n\n\n\n\n\n\n\n§WMore than a hundred old §YBRDM-2§! still wait in our stockpile. The §YMykolayiv Tank Repair Plant§! offers two answers: the §YBRDM-2L1§!, a cheap upgrade it can roll out quickly, or the §YBRM Manhust§!, a reconnaissance vehicle rebuilt almost from scratch.\n\nThe offer stays open until the end of §Y2018§!.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_late_mission: "Last chance: our remaining §YBRDM-2§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_late_mission_desc: "$ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_late_desc$\n\n§RThe plant withdraws the offer when the timer runs out.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_brdm_2t: "Order the §YBRDM-2T§! prototype from Techimpex"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_brdm_2t_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2t_2012_for_tooltip\n\n\n\n\n\n\n\n\n§W§YNVK Techimpex§! from Kyiv is ready to rebuild the BRDM-2. A D-245 diesel replaces the fire-prone GAZ-41 gasoline engine, and the whole vehicle goes through a major overhaul. The prototype takes about two years.\n\nThe offer stays open until the end of §Y2011§!.\n------------------\nThis Decision is a §Rprerequisite§! for the §YYanhol§! protection kit decision. If you §Rskip§! this decision, you will §Rlose§! the opportunity to complete it.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_brdm_2t_mission: "Last chance: §YBRDM-2T§! prototype"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_brdm_2t_mission_desc: "$ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_brdm_2t_desc$\n\n§RTechimpex withdraws the offer when the timer runs out.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_yanhol: "Develop the §YYanhol§! protection kit"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_yanhol_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2t_yanhol_for_tooltip\n\n\n\n\n\n\n\n\n§WOur crews want better protection for the §YBRDM-2T§!. §YNVK Techimpex§! can add spaced steel armor plates to the variant we already build and turn it into the §YBRDM-2T Yanhol§!.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mayak_brdm_2dp: "Order the §YBRDM-2DP§! from Mayak"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mayak_brdm_2dp_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2dp_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YMayak§! plant in Kyiv offers the §YBRDM-2DP§!, a lightened BRDM-2 with a diesel engine. It carries a 12.7 mm DShKM and two SGMB machine guns, side doors for the troops and removable anti-cumulative screens.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_vepr_brdm_2_vepr: "Order the §YBRDM-2 'Vepr'§! from VEPR"
 ukraine_modernize_sov_equipment_brdm_2_modernization_vepr_brdm_2_vepr_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2_vepr_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YVEPR§! company in Kremenchuk offers the §YBRDM-2 'Vepr'§!. The cockpit gets armored glass for better visibility and the bottom is armored. The belly wheels give way to full-size side doors for the troops, a stern machine gun replaces the water-jet, and the bow can take an automatic grenade launcher.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_vinnytsia_brdm_2i: "Order the §YBRDM-2I§! from Vinnytsia"
 ukraine_modernize_sov_equipment_brdm_2_modernization_vinnytsia_brdm_2i_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2i_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §Y45th Experimental Mechanical Plant§! in Vinnytsia offers the §YBRDM-2I§!. A quiet 156 hp ISUZU diesel replaces the gasoline engine, a central tire inflation system is added, and the armament grows to a 14.5 mm KPVT, an AGS-17 grenade launcher and the §YBaryer§! anti-tank missile.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.d: "Bring in the VEPR company"
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.e: "Mykolayiv is enough"
 ukraine_modernize_sov_equipment_brdm_2_modernization.10.c: "The zr. 2012 is enough"
 ukraine_modernize_sov_equipment_brdm_2_modernization.14.name: "Arey Rebuilds the BRDM-2"
 ukraine_modernize_sov_equipment_brdm_2_modernization.14.desc: "The §YArey§! engineering group of army and National Guard volunteers has started rebuilding the BRDM-2 on its own initiative. Their §YBKM Hekkon§! gets a powerful diesel, side doors and room for nine people."
 ukraine_modernize_sov_equipment_brdm_2_modernization.14.a: "Let them work"
 ukraine_modernize_sov_equipment_brdm_2_modernization.14.b: "Support them with funding"
 ukraine_modernize_sov_equipment_brdm_2_modernization.15.name: "BKM Hekkon Presented"
 ukraine_modernize_sov_equipment_brdm_2_modernization.15.desc: "Arey has presented the §YBKM Hekkon§!. A General Motors diesel with a hydrostatic drive, firing ports, side doors and thicker armor turned the old BRDM-2 into the vehicle the front asked for."
 ukraine_modernize_sov_equipment_brdm_2_modernization.15.a: "Adopt the §YBKM Hekkon§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.16.name: "BRDM-2T Yanhol Ready"
 ukraine_modernize_sov_equipment_brdm_2_modernization.16.desc: "§YNVK Techimpex§! has fitted our §YBRDM-2T§! with spaced steel armor plates. The §YBRDM-2T Yanhol§! keeps its crew far safer from small arms fire and shell fragments."
 ukraine_modernize_sov_equipment_brdm_2_modernization.16.a: "Adopt the §YBRDM-2T Yanhol§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.17.name: "BRDM-2DP Ready"
 ukraine_modernize_sov_equipment_brdm_2_modernization.17.desc: "The §YMayak§! plant has finished the §YBRDM-2DP§! for our army: a lightened BRDM-2 with a diesel engine, side doors and removable anti-cumulative screens."
 ukraine_modernize_sov_equipment_brdm_2_modernization.17.a: "Adopt the §YBRDM-2DP§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.18.name: "BRDM-2I Ready"
 ukraine_modernize_sov_equipment_brdm_2_modernization.18.desc: "The §Y45th Experimental Mechanical Plant§! in Vinnytsia has delivered the §YBRDM-2I§! with a quiet ISUZU diesel, central tire inflation and a heavier armament."
 ukraine_modernize_sov_equipment_brdm_2_modernization.18.a: "Adopt the §YBRDM-2I§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.19.name: "BRDM-2 Vepr Ready"
 ukraine_modernize_sov_equipment_brdm_2_modernization.19.desc: "The §YVEPR§! company in Kremenchuk has finished the §YBRDM-2 'Vepr'§! for our army: armored glass in the cockpit, an armored bottom, side doors for the troops and a stern machine gun position."
 ukraine_modernize_sov_equipment_brdm_2_modernization.19.a: "Adopt the §YBRDM-2 'Vepr'§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_plan_tt: "The §YMykolayiv Tank Repair Plant§! offers upgrades in rounds: the early variants in §Y2000-2001§!, the §YBRDM-2DI Khazar§! in §Y2004-2005§!, an invitation to other manufacturers in §Y2010-2012§! and a final upgrade of our remaining BRDM-2 in §Y2015-2018§!."
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_plan_tt: "§YNVK Techimpex§! starts the §YBRDM-2T§! in §Y2010§!. The upgrade grows in steps: a prototype, then a lightened or an improved version, then the §YYanhol§! protection kit."
 ukraine_modernize_sov_equipment_brdm_2_modernization_other_plan_tt: "§YMayak§! offers the §YBRDM-2DP§! in §Y2007-2009§!. The §Y45th Experimental Mechanical Plant§! offers the §YBRDM-2I§! from §Ymid-2014§!. The §YVEPR§! company offers the §YBRDM-2 'Vepr'§! in §Y2015-2016§!."
 ukraine_modernize_sov_equipment_brdm_2_modernization_vepr_plan_tt: "The §YVEPR§! company in Kremenchuk offers the §YBRDM-2 'Vepr'§! in §Y2014-2016§!."
 ukraine_modernize_sov_equipment_brdm_2_modernization_vinnytsia_plan_tt: "The §Y45th Experimental Mechanical Plant§! offers the §YBRDM-2I§! from §Ymid-2014§!."
 ukraine_modernize_sov_equipment_brdm_2_modernization_cancel_tt: "§RThe BRDM-2 modernization program is closed for good.§! Our BRDM-2 stay in service as they are."
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_wait_tt: "The §YMykolayiv Tank Repair Plant§! presents its work in about §Y$DAYS$§! days."
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_experience_tt: "§GOur work on the early variants halves the time.§!"
