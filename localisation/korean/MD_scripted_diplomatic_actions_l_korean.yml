 OFFER_CIV_GNSS_ACCESS_ACTION_DESC: "그들의 항법 및 물류 인프라를 지원하기 위해 우리의 민간 위성 위치 파악 네트워크에 대한 접근을 제공합니다. 이 승인에는 기술적 통합 지원, 데이터 공유 프로토콜, 호환 수신기 시스템을 위한 조율이 포함됩니다. 이러한 접근은 운송, 응급 대응, 민간 인프라 개발에서 향상된 운영 효율성을 촉진합니다. 수락되면 그들은 우리의 §Y민간용 위성항법시스템 위성 네트워크§!에 접근할 수 있게 됩니다."
