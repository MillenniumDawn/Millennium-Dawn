l_french:
 equipment_doctrine_folder: "Doctrine de l'équipement"
 GRAND_DOCTRINE_LOCAL_AIRSPACE_DEFENCE: "Défense de l'espace aérien local"
 GRAND_DOCTRINE_AIR_SUPREMACY: "Suprématie aérienne"
 GRAND_DOCTRINE_MIXED_ROLE: "Rôle mixte"
 GRAND_DOCTRINE_COMBINED_ARMS: "Armes combinées"
 GRAND_DOCTRINE_SHOCK_AND_AWE: "Choc et effroi"
 GRAND_DOCTRINE_SHOCK_AND_AWE_DESC: "Cette doctrine fondamentale organise les opérations terrestres autour d'une application rapide et concentrée de la puissance de combat afin d'obtenir des effets opérationnels décisifs. Les concepts de choc et de stupeur mettent l'accent sur le rythme, la domination et l'emploi coordonné des forces."
 GRAND_DOCTRINE_DEFENCE_IN_DEPTH: "Défense en profondeur"
 GRAND_DOCTRINE_DEFENCE_IN_DEPTH_DESC: "Cette doctrine majeure structure la défense terrestre par le biais de positions stratifiées et d'un déploiement des forces en profondeur sur l'ensemble du champ de bataille. Les concepts de défense en profondeur mettent l'accent sur la cohérence défensive continue et le contrôle de l'espace opérationnel."
 GRAND_DOCTRINE_MISSION_COMMAND: "Commandement par mission"
 GRAND_DOCTRINE_MISSION_COMMAND_DESC: "Cette grande doctrine structure les forces terrestres autour d'une autorité déléguée, guidée par une intention claire et des objectifs définis. Les concepts de commandement par mission mettent l'accent sur l'initiative et l'exécution coordonnée à plusieurs échelons."
 GRAND_DOCTRINE_GUERRILLA_WARFARE: "Guerre de guérilla"
 GRAND_DOCTRINE_GUERRILLA_WARFARE_DESC: "Cette grande doctrine structure les opérations terrestres autour de forces irrégulières menant des combats dispersés et persistants. Les concepts de la guérilla mettent l'accent sur l'organisation locale et la pression continue au sein d'environnements contestés."
 GRAND_DOCTRINE_EQUIPMENT_MIXED: "Équipement mixte"
 GRAND_DOCTRINE_EQUIPMENT_MIXED_DESC: "Cette doctrine fondamentale structure l'équipement des forces autour d'une combinaison équilibrée de systèmes afin de répondre à des exigences opérationnelles diverses. Les concepts d'équipement mixte mettent l'accent sur la flexibilité dans l'équipement des formations pour différents rôles de combat."
 GRAND_DOCTRINE_EQUIPMENT_LIGHT: "Équipement léger"
 GRAND_DOCTRINE_EQUIPMENT_HEAVY: "Équipement lourd"
 GRAND_DOCTRINE_EQUIPMENT_MOBILE: "Équipement mobile"
 GRAND_DOCTRINE_EQUIPMENT_FIRES: "Équipement de soutien de feu"
 GRAND_DOCTRINE_EQUIPMENT_FULL: "Équipement complet"
 GRAND_DOCTRINE_BLUE_WATER: "Marine d'eaux lointaines"
 GRAND_DOCTRINE_GREEN_WATER: "Marine d'eaux littorales"
 GRAND_DOCTRINE_JEUNE_ECOLE: "Jeune école"
 GRAND_DOCTRINE_GUERRE_DE_COURSE: "Guerre de course"
 GRAND_DOCTRINE_COMBINED_ARMS_DESC: "Cette grande doctrine structure les forces terrestres autour de l'emploi intégré des éléments de manœuvre, d'appui-feu et de soutien logistique. Les concepts interarmes mettent l'accent sur l'action synchronisée entre les formations afin de générer des effets cohérents sur le champ de bataille."
 DOCTRINE_TRACK_SPECIAL_FORCES_MARINES: "Forces marines spéciales"
 DOCTRINE_TRACK_MARINES_MASSIVE_FORCES: "Forces marines"
 DOCTRINE_TRACK_AIRBORN_FORCES: "Bataillons aéroportés"
 DOCTRINE_TRACK_AIRBORN_OPERATIONS: "Opérations aéroportées"
 DOCTRINE_TRACK_RANGER_FORCES: "Régiment de Rangers spéciaux"
 DOCTRINE_TRACK_TRAINING_AND_OPS: "Entraînement et opérations"
 DOCTRINE_TRACK_AIRCRAFT_DESIGN: "Conception d'aéronefs"
 DOCTRINE_TRACK_MULTIROLE_AIRCRAFT: "Aéronefs multirôles"
 DOCTRINE_TRACK_INFANTRY_EQP: "Équipement d'infanterie"
 DOCTRINE_TRACK_MOTORIZED_EQP: "Équipement motorisé"
 DOCTRINE_TRACK_MECHANIZED_EQP: "Équipement mécanisé"
 DOCTRINE_TRACK_ARMORED_EQP: "Équipement blindé"
 DOCTRINE_TRACK_FIRES_EQP: "Artillerie et appui-feu"
 DOCTRINE_TRACK_AIRMOB_EQP: "Équipement aéromobile"
 DOCTRINE_TRACK_OPERAITONAL_THEORY: "Théorie opérationnelle"
 DOCTRINE_TRACK_DEDICATED_DOCTRINE: "Doctrine dédiée"
 DOCTRINE_TRACK_TRAINING: "Entraînement"
 DOCTRINE_TRACK_LEADERSHIP: "Commandement"
 DOCTRINE_TRACK_TECHNOLOGY: "Technologie"
 DOCTRINE_TRACK_STRUCTURE: "La structure"
 DOCTRINE_TRACK_CAPITAL: "Navires capitaux"
 DOCTRINE_TRACK_ESCORT: "Navires d'escorte"
 DOCTRINE_TRACK_SUPPORT: "Navires de soutien"
 MARINE_SPECIAL_FORCES: "Marine Commandos"
 MARINE_SPECIAL_FORCES_DESC: "Cette doctrine forme des marines légers, basés sur l'infanterie, à des débarquements et franchissements de cours d'eau menés sans délai. Les concepts d'assaut rapide mettent l'accent sur la vitesse, la mobilité et la saisie du rivage avant que l'ennemi ne puisse réagir."
 MARINE_MASSIVE_FORCES: "Amphibious Battalions"
 MARINE_SPECIAL_FORCES_MASSIVE_DESC: "Cette doctrine organise des marines légers et motorisés en grandes formations conçues pour des opérations amphibies soutenues à grande échelle. Les concepts de débarquement massif mettent l'accent sur la capacité d'invasion, le débit de formation et le poids du nombre à terre."
 RANGER_FORCES_DOCTRINES: "Ranger Operators"
 RANGER_FORCES_DOCTRINES_DESC: "Cette doctrine forme les rangers à combattre en forêt dense, en utilisant le couvert des arbres pour tendre des embuscades, disparaître et saigner un ennemi qui ne peut les voir. Les concepts forestiers mettent l'accent sur la dissimulation, la liberté de mouvement hors des routes et une défense obstinée depuis des positions préparées."
 SUBDOCTRINE_OPERATIONS_CENTRAL_COMMAND: "Commandement centralisé"
 SUBDOCTRINE_OPERATIONS_CENTRAL_COMMAND_DESC: "Cette doctrine place les opérations aériennes sous un commandement central unifié, où la planification, la priorisation et l'exécution sont dirigées par une autorité unique. Ce commandement centralisé garantit la cohérence des intentions opérationnelles et l'emploi coordonné de la puissance aérienne sur l'ensemble du théâtre d'opérations."
 SUBDOCTRINE_OPERATIONS_DETACHED_COMMAND: "Commandement détaché"
 SUBDOCTRINE_OPERATIONS_DETACHED_COMMAND_DESC: "Cette doctrine confie les opérations aériennes à des commandements semi-indépendants, leur conférant une autorité déléguée en matière de planification et d'exécution dans des limites opérationnelles définies. Le commandement détaché permet une prise de décision locale tout en maintenant l'alignement sur les objectifs stratégiques globaux."
 SUBDOCTRINE_OPERATIONS_NAVAL_AIR: "Commandement naval"
 SUBDOCTRINE_OPERATIONS_NAVAL_AIR_DESC: "Cette doctrine intègre les opérations aériennes aux structures de commandement naval, alignant la planification et l'exécution de la puissance aérienne sur les objectifs maritimes. Le commandement naval garantit l'emploi coordonné des moyens aériens en appui aux opérations de la flotte et au contrôle du domaine maritime."
 SUBDOCTRINE_DESIGN_MULTIROLE: "Conceptions multirôles"
 SUBDOCTRINE_DESIGN_MULTIROLE_DESC: "Cette doctrine met l'accent sur le développement d'aéronefs capables d'assurer de multiples missions à partir d'une seule plateforme. Les conceptions multirôles privilégient l'adaptabilité et les systèmes intégrés afin de répondre à un large éventail d'exigences opérationnelles dans le domaine aérien."
 SUBDOCTRINE_DESIGN_DEDICATED: "Conceptions dédiées"
 SUBDOCTRINE_DESIGN_DEDICATED_DESC: "Cette doctrine privilégie le développement d'aéronefs optimisés pour un rôle opérationnel spécifique. Les conceptions dédiées mettent l'accent sur la spécialisation et des performances adaptées afin de répondre à des exigences de mission clairement définies dans le domaine aérien."
 SUBDOCTRINE_DESIGN_HEAVY: "Conceptions lourdes"
 SUBDOCTRINE_DESIGN_HEAVY_DESC: "Cette doctrine met l'accent sur le développement d'aéronefs robustes et de grande taille, conçus pour l'autonomie, la capacité d'emport et une présence opérationnelle soutenue. Les aéronefs lourds privilégient la résistance structurelle et l'intégration des systèmes afin de soutenir des opérations aériennes exigeantes."
 SUBDOCTRINE_DESIGN_DRONE: "Conceptions de drones"
 SUBDOCTRINE_HEAVY_STRATEGIC_BOMBER: "Bombardiers stratégiques"
 SUBDOCTRINE_HEAVY_STRATEGIC_BOMBER_DESC: "Cette doctrine est axée sur le développement d'aéronefs conçus pour des opérations de frappe stratégique à longue portée. Les bombardiers stratégiques sont conçus pour assurer une puissance aérienne soutenue sur de vastes distances, en appui aux objectifs militaires globaux."
 SUBDOCTRINE_HEAVY_NAVAL_BOMBERS: "Bombardiers navals"
 SUBDOCTRINE_HEAVY_NAVAL_BOMBERS_DESC: "Cette doctrine met l'accent sur le développement d'aéronefs conçus pour opérer en étroite coordination avec les forces navales. La conception des bombardiers navals vise à étendre la puissance aérienne au-dessus des environnements maritimes afin d'appuyer les opérations navales et les objectifs de contrôle des mers."
 SUBDOCTRINE_HEAVY_GUNSHIPS: "Canonnières lourdes"
 SUBDOCTRINE_HEAVY_GUNSHIPS_DESC: "Cette doctrine privilégie le développement d'aéronefs lourdement armés, conçus pour assurer une puissance de feu aérienne soutenue. Les avions de combat lourds mettent l'accent sur les systèmes d'armes intégrés et une présence prolongée afin d'appuyer les opérations aériennes en environnements contestés."
 SUBDOCTRINE_MULTIROLE_MIXED: "Multirôle mixte"
 SUBDOCTRINE_MULTIROLE_MIXED_DESC: "Cette doctrine encourage une approche équilibrée du développement des aéronefs multirôles en combinant diverses philosophies de conception au sein d'une même force aérienne. Les concepts multirôles mixtes mettent l'accent sur la flexibilité de la composition des forces afin de répondre à un large éventail de besoins opérationnels."
 SUBDOCTRINE_MULTIROLE_STRIKE: "Aéronefs d'attaque"
 SUBDOCTRINE_MULTIROLE_STRIKE_DESC: "Cette doctrine met l'accent sur le développement d'aéronefs multirôles orientés vers les opérations aériennes offensives. Les conceptions axées sur les frappes privilégient la projection efficace de la puissance aérienne contre des cibles désignées, en appui à des objectifs opérationnels plus larges."
 SUBDOCTRINE_MULTIROLE_OPERATIONS: "Opérations multirôles"
 SUBDOCTRINE_MULTIROLE_OPERATIONS_DESC: "Cette doctrine structure les opérations aériennes autour d'aéronefs multirôles capables de remplir des missions aux exigences variées. Les opérations multirôles mettent l'accent sur l'emploi coordonné de plateformes aériennes adaptables pour soutenir un large éventail d'objectifs opérationnels."
 SUBDOCTRINE_STRIKE_CAS: "Aéronefs d'appui aérien rapproché"
 SUBDOCTRINE_STRIKE_CAS_DESC: "Cette doctrine est axée sur le développement d'aéronefs conçus pour appuyer les opérations terrestres par des engagements aériens directs. Les aéronefs d'appui aérien rapproché sont structurés pour fournir une puissance aérienne réactive et soutenue en étroite coordination avec les forces terrestres."
 SUBDOCTRINE_STRIKE_NAVAL: "Attaquant naval"
 SUBDOCTRINE_STRIKE_NAVAL_DESC: "Cette doctrine est axée sur le développement d'avions de combat destinés à appuyer des objectifs maritimes. Les concepts de frappe navale mettent l'accent sur l'intégration de la puissance aérienne aux opérations navales afin de projeter la force sur l'ensemble des théâtres d'opérations maritimes."
 SUBDOCTRINE_STRIKE_MUNITIONS: "Munitions d'attaque"
 SUBDOCTRINE_STRIKE_MUNITIONS_DESC: "Cette doctrine met l'accent sur le développement et l'intégration de munitions conçues pour les frappes de précision. Les concepts de munitions de frappe visent à optimiser l'utilisation de la puissance de feu aéroportée à l'appui des objectifs opérationnels."
 SUBDOCTRINE_FIGHTER_LIGHT: "Chasseurs légers"
 SUBDOCTRINE_FIGHTER_LIGHT_DESC: "Cette doctrine est axée sur le développement d'avions de chasse légers optimisés pour l'agilité et la réactivité des opérations aériennes. La conception des chasseurs légers privilégie l'efficacité et la flexibilité d'emploi au sein du dispositif plus large des combats aériens."
 SUBDOCTRINE_FIGHTER_AIR_SUP: "Suprématie aérienne"
 SUBDOCTRINE_FIGHTER_AIR_SUP_DESC: "Cette doctrine repose sur le développement et l'emploi d'avions de chasse pour établir et maintenir la maîtrise de l'espace aérien. Les concepts de supériorité aérienne mettent l'accent sur des opérations de combat aérien coordonnées afin de garantir la liberté d'action sur l'ensemble du théâtre d'opérations."
 SUBDOCTRINE_STRUCTURE_CENTRAL_COMMAND: "Commandement central"
 SUBDOCTRINE_STRUCTURE_CENTRAL_COMMAND_DESC: "Cette doctrine organise les forces terrestres sous un commandement central unifié, où la planification, la coordination et l'exécution sont dirigées par une autorité unique. Les structures de commandement centralisées garantissent la cohérence de l'intention opérationnelle et l'emploi synchronisé des forces terrestres sur l'ensemble du champ de bataille."
 SUBDOCTRINE_STRUCTURE_DECENTRAL_COMMAND: "Commandement décentralisé"
 SUBDOCTRINE_STRUCTURE_DECENTRAL_COMMAND_DESC: "Cette doctrine répartit l'autorité de commandement sur plusieurs échelons au sein des forces terrestres, permettant aux formations subordonnées de planifier et de mener des opérations en fonction des objectifs assignés. Les structures de commandement décentralisées privilégient l'initiative et la prise de décision réactive sur l'ensemble du champ de bataille."
 SUBDOCTRINE_STRUCTURE_BCT: "Équipes de combat de bataillon"
 SUBDOCTRINE_STRUCTURE_BCT_DESC: "Cette doctrine structure les forces terrestres autour de formations autonomes de niveau bataillon, conçues pour mener des opérations interarmes. Les équipes de combat de bataillon intègrent des éléments de manœuvre, d'appui feu et de soutien logistique afin d'opérer efficacement dans les zones d'opérations assignées."
 SUBDOCTRINE_OPERATION_DECENTRALIZED_SUPPLY: "Ravitaillement décentralisé"
 SUBDOCTRINE_OPERATION_DECENTRALIZED_SUPPLY_DESC: "Cette doctrine organise le soutien des forces terrestres grâce à des structures logistiques distribuées qui appuient les unités déployées dans de multiples zones d'opérations. Les concepts d'approvisionnement décentralisés privilégient le contrôle local des ressources afin de maintenir le rythme et la continuité des opérations."
 SUBDOCTRINE_OPERATION_CENTRALIZED_SUPPLY: "Ravitaillement centralisé"
 SUBDOCTRINE_OPERATION_CENTRALIZED_SUPPLY_DESC: "Cette doctrine organise le soutien des forces terrestres selon des structures logistiques centralisées qui coordonnent la distribution des approvisionnements sur l'ensemble de la zone d'opérations. Les concepts d'approvisionnement centralisé mettent l'accent sur une planification et un contrôle unifiés afin d'assurer un soutien constant aux opérations terrestres."
 SUBDOCTRINE_OPERATION_SCAVENGING_SUPPLY: "Ravitaillement par récupération"
 SUBDOCTRINE_OPERATION_SCAVENGING_SUPPLY_DESC: "Cette doctrine assure le maintien des forces terrestres grâce à l'utilisation des ressources disponibles localement dans l'environnement opérationnel. Les stratégies de récupération d'approvisionnement privilégient l'acquisition adaptative et l'intégration de matériel capturé ou improvisé pour appuyer les opérations terrestres en cours."
 SUBDOCTRINE_OPERATION_ADVERSE: "Opérations en conditions adverses"
 SUBDOCTRINE_OPERATION_ADVERSE_DESC: "Cette doctrine prépare les forces terrestres à mener des opérations en conditions hostiles et dégradées. Les opérations en situation difficile mettent l'accent sur l'adaptabilité, la résilience et l'efficacité soutenue dans des environnements opérationnels complexes."
 SUBDOCTRINE_OPERATION_VOLUNTEER: "Forces de volontaires"
 SUBDOCTRINE_OPERATION_VOLUNTEER_DESC: "Cette doctrine structure les opérations terrestres autour du déploiement de formations sélectionnées au-delà des frontières nationales, en appui à des objectifs extérieurs. Les opérations de volontaires privilégient l'intervention à petite échelle, l'autonomie opérationnelle et l'alignement sur une stratégie globale."
 SUBDOCTRINE_OPERATION_DEEP_BATTLE: "Batailles profondes"
 SUBDOCTRINE_OPERATION_DEEP_BATTLE_DESC: "Cette doctrine structure les opérations terrestres afin d'engager simultanément les forces adverses sur plusieurs niveaux du champ de bataille. Les concepts de combat en profondeur mettent l'accent sur des actions coordonnées visant à perturber les éléments de commandement, de soutien et de manœuvre au-delà de la ligne de front immédiate."
 SUBDOCTRINE_OPERATION_THUNDER_RUN: "Course foudroyante"
 SUBDOCTRINE_OPERATION_THUNDER_RUN_DESC: "Cette doctrine structure les opérations terrestres autour de poussées rapides et concentrées visant à obtenir des effets décisifs par la vitesse et l'effet de choc. Les opérations de type « tonnerre » privilégient l'élan et les manœuvres ciblées pour perturber l'environnement opérationnel."
 SUBDOCTRINE_OPERATION_LIGHT_INFANTRY: "Infanterie légère"
 SUBDOCTRINE_OPERATION_LIGHT_INFANTRY_DESC: "Cette doctrine organise les opérations terrestres autour de formations d'infanterie très mobiles, adaptées à la diversité des terrains et des conditions opérationnelles. Les opérations d'infanterie légère privilégient la flexibilité, le déploiement rapide et une présence soutenue sur le champ de bataille."
 SUBDOCTRINE_OPERATION_GUERRILLA: "Opérations de guérilla"
 SUBDOCTRINE_OPERATION_GUERRILLA_DESC: "Cette doctrine structure les opérations terrestres autour de formations de combat irrégulières et dispersées opérant en environnements contestés. Les opérations de guérilla privilégient la mobilité, l'initiative locale et une pression soutenue pour façonner le champ de bataille terrestre."
 SUBDOCTRINE_OPERATION_STATIC_DEFENSE: "Défense statique"
 SUBDOCTRINE_OPERATION_STATIC_DEFENSE_DESC: "Cette doctrine structure les opérations terrestres défensives autour de positions fixes et de réseaux défensifs préparés. Les opérations de défense statique privilégient le contrôle du territoire et l'emploi organisé des forces pour occuper les positions stratégiques."
 SUBDOCTRINE_OPERATION_ELASTIC_DEFENSE: "Défense élastique"
 SUBDOCTRINE_OPERATION_ELASTIC_DEFENSE_DESC: "Cette doctrine organise les opérations défensives par le biais de déplacements contrôlés et d'un déploiement des forces en profondeur. Les concepts de défense flexible mettent l'accent sur la structuration du champ de bataille tout en préservant l'efficacité au combat à travers les différentes couches défensives."
 SUBDOCTRINE_OPERATION_MOBILE_DEFENSE: "Défense mobile"
 SUBDOCTRINE_OPERATION_MOBILE_DEFENSE_DESC: "Cette doctrine structure les opérations terrestres défensives autour de forces mobiles capables de réagir dynamiquement aux actions ennemies. Les concepts de défense mobile mettent l'accent sur la flexibilité et la contre-manœuvre coordonnée au sein de l'espace de combat défensif."
 SUBDOCTRINE_OPERATION_INSURGENT: "Opérations d'insurrection"
 SUBDOCTRINE_OPERATION_INSURGENT_DESC: "Cette doctrine organise les forces terrestres autour d'une guerre irrégulière menée par des éléments de combat décentralisés et intégrés. Les opérations insurrectionnelles privilégient un engagement persistant et un contrôle axé sur la population afin d'influencer l'environnement opérationnel."
 SUBDOCTRINE_TECHNOLOGY_HIGH: "Armée de haute technologie"
 SUBDOCTRINE_TECHNOLOGY_HIGH_DESC: "Cette doctrine structure les forces terrestres autour de l'intégration poussée des technologies de pointe dans les fonctions de combat, de commandement et de soutien. Les concepts d'armée de haute technologie mettent l'accent sur la supériorité technologique comme élément central de l'efficacité opérationnelle."
 SUBDOCTRINE_TECHNOLOGY_COMMON: "Armée de technologie standard"
 SUBDOCTRINE_TECHNOLOGY_COMMON_DESC: "Cette doctrine organise les forces terrestres autour de technologies militaires largement disponibles et standardisées. Les concepts d'armée à technologie commune mettent l'accent sur la fiabilité, l'adaptabilité et une large interopérabilité entre les différentes formations."
 SUBDOCTRINE_TECHNOLOGY_LOW: "Armée de basse technologie"
 SUBDOCTRINE_TECHNOLOGY_LOW_DESC: "Cette doctrine structure les forces terrestres en minimisant leur dépendance aux systèmes technologiques avancés. Les concepts d'armée à faible technologie privilégient l'équipement de base, la simplicité et la fonctionnalité opérationnelle dans des conditions technologiques limitées."
 SUBDOCTRINE_TRAINING_REDUCED: "Entraînement réduit"
 SUBDOCTRINE_TRAINING_REDUCED_DESC: "Cette doctrine minimise les exigences en matière de formation formelle afin d'accélérer la constitution et le déploiement des forces. Les concepts de formation allégés mettent l'accent sur la préparation opérationnelle de base et la disponibilité rapide des forces."
 SUBDOCTRINE_TRAINING_ADVANCED: "Entraînement avancé"
 SUBDOCTRINE_TRAINING_ADVANCED_DESC: "Cette doctrine met l'accent sur des programmes d'entraînement approfondis et structurés afin de renforcer la cohésion des unités et leur efficacité opérationnelle. Les concepts d'entraînement avancés visent à préparer les forces à des environnements opérationnels complexes et exigeants."
 SUBDOCTRINE_TRAINING_SKILLS: "École de compétences"
 SUBDOCTRINE_TRAINING_SKILLS_DESC: "Cette doctrine structure la formation autour du développement systématique de compétences militaires spécialisées. La formation axée sur les compétences met l'accent sur la compétence technique et la maîtrise des rôles spécifiques au sein des forces terrestres."
 SUBDOCTRINE_TRAINING_SURVIVAL: "Entraînement à la survie"
 SUBDOCTRINE_TRAINING_SURVIVA_DESC: "Cette doctrine met l'accent sur un entraînement axé sur l'endurance et l'adaptabilité en environnements austères et hostiles. Les concepts d'entraînement à la survie préparent les forces à mener des opérations dans des conditions difficiles."
 SUBDOCTRINE_LEADERSHIP_OFFICER: "Formation des officiers"
 SUBDOCTRINE_LEADERSHIP_OFFICER_DESC: "Cette doctrine axe le développement du leadership sur les officiers commissionnés par le biais d'une formation formelle et d'une préparation au commandement. Les concepts de formation des officiers mettent l'accent sur la planification, la coordination et le contrôle organisationnel au sein des forces terrestres."
 SUBDOCTRINE_LEADERSHIP_NCO: "Formation des sous-officiers"
 SUBDOCTRINE_LEADERSHIP_NCO_DESC: "Cette doctrine structure le développement du leadership autour des sous-officiers, considérés comme la pierre angulaire du commandement des forces terrestres. Les concepts de formation des sous-officiers mettent l'accent sur le leadership tactique et l'efficacité opérationnelle quotidienne des unités."
 SUBDOCTRINE_LEADERSHIP_REDUCED: "Normes réduites"
 SUBDOCTRINE_LEADERSHIP_REDUCED_DESC: "Cette doctrine abaisse les exigences formelles en matière de qualification des cadres afin d'accroître les capacités de commandement. Les concepts de normes allégées privilégient la formation rapide de cadres pour soutenir l'expansion des forces."
 SUBDOCTRINE_EQUIPMENT_BASE_INFANTRY: "Charge de base d'infanterie"
 SUBDOCTRINE_EQUIPMENT_BASE_INFANTRY_DESC: "Cette doctrine définit un équipement standardisé pour l'infanterie, axé sur les armes essentielles et le matériel de soutien. Les concepts d'équipement de base de l'infanterie privilégient l'équilibre et la capacité polyvalente pour des opérations terrestres prolongées."
 SUBDOCTRINE_EQUIPMENT_LIGHT_INFANTRY: "Charge d'infanterie légère"
 SUBDOCTRINE_EQUIPMENT_LIGHT_INFANTRY_DESC: "Cette doctrine structure l'équipement d'infanterie autour d'un poids réduit et d'un chargement simplifié. Les concepts de charge légère pour l'infanterie mettent l'accent sur la mobilité et la facilité de déploiement dans divers environnements opérationnels."
 SUBDOCTRINE_EQUIPMENT_HEAVY_INFANTRY: "Charge d'infanterie lourde"
 SUBDOCTRINE_EQUIPMENT_HEAVY_INFANTRY_DESC: "Cette doctrine équipe les formations d'infanterie d'armes et de systèmes de protection élargis. Les concepts de charge d'infanterie lourde mettent l'accent sur une puissance de feu accrue et la résilience lors des engagements terrestres."
 SUBDOCTRINE_EQUIPMENT_BASE_MOTORIZED: "Configuration motorisée de base"
 SUBDOCTRINE_EQUIPMENT_BASE_MOTORIZED_DESC: "Cette doctrine définit une configuration d'équipement standardisée pour les unités d'infanterie motorisée. Les configurations motorisées de base mettent l'accent sur une mobilité et une capacité de combat équilibrées, soutenues par le transport à roues."
 SUBDOCTRINE_EQUIPMENT_LIGHT_MOTORIZED: "Configuration motorisée légère"
 SUBDOCTRINE_EQUIPMENT_LIGHT_MOTORIZED_DESC: "Cette doctrine structure l'équipement des unités motorisées autour de véhicules plus légers et de systèmes embarqués réduits. Les configurations motorisées légères mettent l'accent sur la vitesse et la flexibilité opérationnelle."
 SUBDOCTRINE_EQUIPMENT_HEAVY_MOTORIZED: "Configuration motorisée lourde"
 SUBDOCTRINE_EQUIPMENT_HEAVY_MOTORIZED_DESC: "Cette doctrine équipe les unités motorisées de véhicules plus lourds et d'équipement embarqué renforcé. Les configurations motorisées lourdes mettent l'accent sur la protection et une capacité de combat soutenue."
 SUBDOCTRINE_EQUIPMENT_MIXED_MECHANIZED: "Configuration mécanisée mixte"
 SUBDOCTRINE_EQUIPMENT_MIXED_MECHANIZED_DESC: "Cette doctrine structure les formations mécanisées autour d'une combinaison de véhicules de transport et de combat. Les configurations mécanisées mixtes mettent l'accent sur l'adaptabilité par une intégration d'équipement diversifiée."
 SUBDOCTRINE_EQUIPMENT_APC_MECHANIZED: "Configuration mécanisée VTB"
 SUBDOCTRINE_EQUIPMENT_APC_MECHANIZED_DESC: "Cette doctrine organise les unités mécanisées autour de véhicules de transport de troupes blindés comme plateforme de transport principale. Les configurations mécanisées VTT mettent l'accent sur une mobilité protégée et le soutien d'infanterie."
 SUBDOCTRINE_EQUIPMENT_IFV_MECHANIZED: "Configuration mécanisée VCI"
 SUBDOCTRINE_EQUIPMENT_IFV_MECHANIZED_DESC: "Cette doctrine structure les forces mécanisées autour de véhicules de combat d'infanterie aux systèmes de combat intégrés. Les configurations mécanisées VCI mettent l'accent sur la mobilité combinée et l'appui-feu direct."
 SUBDOCTRINE_EQUIPMENT_MBT_TANK: "Équipement de char"
 SUBDOCTRINE_EQUIPMENT_MBT_TANK_DESC: "Cette doctrine se concentre sur le déploiement et le soutien de formations de chars de bataille. Les concepts d'équipement de chars mettent l'accent sur la puissance de feu blindée comme élément central des forces terrestres."
 SUBDOCTRINE_EQUIPMENT_LIGHT_TANK: "Configuration de char léger"
 SUBDOCTRINE_EQUIPMENT_LIGHT_TANK_DESC: "Cette doctrine structure les unités blindées autour de plateformes de chars plus légères adaptées à des opérations terrestres flexibles. Les configurations de chars légers mettent l'accent sur la mobilité et la portée opérationnelle au sein des formations blindées."
 SUBDOCTRINE_EQUIPMENT_SUPERHEAVY_TANK: "Équipement super-lourd"
 SUBDOCTRINE_EQUIPMENT_SUPERHEAVY_TANK_DESC: "Cette doctrine organise les forces blindées autour de plateformes exceptionnellement lourdes et protégées. Les concepts d'équipement super-lourd mettent l'accent sur une présence blindée maximale au sein des formations terrestres."
 SUBDOCTRINE_EQUIPMENT_TOWED_ARTILLERY: "Artillerie tractée"
 SUBDOCTRINE_EQUIPMENT_TOWED_ARTILLERY_DESC: "Cette doctrine structure les forces d'artillerie autour de systèmes de canons déployables soutenus par des moyens de transport. Les concepts d'artillerie tractée mettent l'accent sur un appui-feu flexible dans les opérations terrestres."
 SUBDOCTRINE_EQUIPMENT_SP_ARTILLERY: "Équipement d'artillerie automotrice"
 SUBDOCTRINE_EQUIPMENT_SP_ARTILLERY_DESC: "Cette doctrine équipe les unités d'artillerie de plateformes automotrices capables d'opérer aux côtés des forces de manœuvre. Les concepts d'équipement SPART mettent l'accent sur un appui-feu mobile et réactif."
 SUBDOCTRINE_EQUIPMENT_ROCKET_ARTILLERY: "Équipement de lance-roquettes multiple"
 SUBDOCTRINE_EQUIPMENT_ROCKET_ARTILLERY_DESC: "Cette doctrine structure les forces d'artillerie autour de lance-roquettes multiples pour les missions de feux de zone. Les concepts d'équipement MLRS mettent l'accent sur une délivrance de puissance de feu coordonnée sur le champ de bataille."
 SUBDOCTRINE_EQUIPMENT_ATK_HELICOPTER: "Hélicoptères d'attaque"
 SUBDOCTRINE_EQUIPMENT_ATK_HELICOPTER_DESC: "Cette doctrine intègre les plateformes d'hélicoptères d'attaque aux structures d'équipement des forces terrestres. Les concepts d'hélicoptères d'attaque mettent l'accent sur l'appui-feu aérien et l'intégration au champ de bataille terrestre."
 SUBDOCTRINE_EQUIPMENT_TRANS_HELICOPTER: "Hélicoptères de transport"
 SUBDOCTRINE_EQUIPMENT_TRANS_HELICOPTER_DESC: "Cette doctrine structure la mobilité des forces terrestres autour de plateformes de transport à voilure tournante. Les concepts d'hélicoptères de transport mettent l'accent sur la mobilité aérienne et le repositionnement rapide."
 SUBDOCTRINE_CAPITAL_CARRIER: "Opérations de porte-avions"
 SUBDOCTRINE_CAPITAL_CARRIER_DESC: "Cette doctrine structure la projection de puissance navale autour des porte-avions comme atouts centraux de flotte. Les opérations de porte-avions mettent l'accent sur l'emploi coordonné des groupes aériens embarqués pour étendre l'influence navale."
 SUBDOCTRINE_CAPITAL_HLS: "Navires d'hélitransport"
 SUBDOCTRINE_CAPITAL_HLS_DESC: "Cette doctrine intègre les navires de débarquement capables d'hélicoptères aux structures de force navale. Les concepts de navires héliportés mettent l'accent sur la mobilité verticale et le soutien amphibie."
 SUBDOCTRINE_CAPITAL_ESCORT_CARRIER: "Porte-avions d'escorte"
 SUBDOCTRINE_CAPITAL_ESCORT_CARRIER_DESC: "Cette doctrine organise l'aviation navale autour de plus petits porte-avions opérant aux côtés des éléments de flotte. Les concepts de porte-avions d'escorte mettent l'accent sur un soutien aérien distribué au sein des formations navales."
 SUBDOCTRINE_CAPITAL_LOTS: "Maîtres des mers"
 SUBDOCTRINE_CAPITAL_LOTS_DESC: "Cette doctrine structure les forces navales pour affirmer un contrôle soutenu sur les régions maritimes clés. Les concepts de seigneurs des mers mettent l'accent sur une présence de flotte dominante et une influence maritime continue."
 SUBDOCTRINE_CAPITAL_CARRIER_ESCORTS: "Escorte de porte-avions"
 SUBDOCTRINE_CAPITAL_CARRIER_ESCORTS_DESC: "Cette doctrine organise les éléments de flotte pour fournir une protection en couches aux groupes de porte-avions. Les concepts d'escorte de porte-avions mettent l'accent sur une défense coordonnée et la continuité opérationnelle des capital ships."
 SUBDOCTRINE_CAPITAL_FLEET_CRUISERS: "Croiseurs de flotte"
 SUBDOCTRINE_CAPITAL_FLEET_CRUISERS_DESC: "Cette doctrine centre l'organisation de flotte autour de croiseurs capables d'opérations indépendantes et de groupe. Les concepts de croiseurs de flotte mettent l'accent sur une présence de commandement et une capacité maritime multi-missions."
 SUBDOCTRINE_CAPITAL_DESTROYER_FLEET: "Flotte de destroyers"
 SUBDOCTRINE_CAPITAL_DESTROYER_FLEET_DESC: "Cette doctrine structure les forces navales autour des destroyers comme élément de combat de surface principal. Les concepts de flotte de destroyers mettent l'accent sur un engagement flexible et un soutien opérationnel au niveau de la flotte."
 SUBDOCTRINE_CAPITAL_SUPPORT_DESTROYERS: "Destroyers de soutien"
 SUBDOCTRINE_CAPITAL_SUPPORT_DESTROYERS_DESC: "Cette doctrine assigne les forces de destroyers au soutien et à l'écran des unités de flotte de plus haute valeur. Les concepts de destroyers de soutien mettent l'accent sur la protection, la coordination et des opérations de flotte soutenues."
 SUBDOCTRINE_CAPITAL_FRIGATE_CAPITAL: "Capitaines de frégate"
 SUBDOCTRINE_CAPITAL_FRIGATE_CAPITAL_DESC: "Cette doctrine élève les frégates à des rôles centraux au sein des formations navales. Les concepts de frégates capitales mettent l'accent sur des capacités équilibrées et une présence maritime distribuée."
 SUBDOCTRINE_ESCORT_MULTIROLE_FRIGATE: "Frégates multirôles"
 SUBDOCTRINE_ESCORT_MULTIROLE_FRIGATE_DESC: "Cette doctrine structure les forces d'escorte autour de frégates capables de tâches maritimes diverses. Les concepts de frégates polyvalentes mettent l'accent sur l'adaptabilité dans l'escorte et la patrouille."
 SUBDOCTRINE_ESCORT_ANTI_SUB_CORVETTE: "Corvette anti-sous-marine"
 SUBDOCTRINE_ESCORT_ANTI_SUB_CORVETTE_DESC: "Cette doctrine organise les forces d'escorte autour de corvettes spécialisées dans la détection et l'engagement de sous-marins. Les concepts de corvettes ASM mettent l'accent sur un contrôle sous-marin localisé."
 SUBDOCTRINE_ESCORT_ANTI_AIR_CORVETTE: "Corvette anti-aérienne"
 SUBDOCTRINE_ESCORT_ANTI_AIR_CORVETTE_DESC: "Cette doctrine structure les formations d'escorte autour de corvettes axées sur la défense aérienne. Les concepts de corvettes antiaériennes mettent l'accent sur la protection des unités de flotte contre les menaces aériennes."
 SUBDOCTRINE_ESCORT_STEALTH_ESCORTS: "Escortes furtives"
 SUBDOCTRINE_ESCORT_STEALTH_ESCORTS_DESC: "Cette doctrine intègre des bâtiments d'escorte à faible observabilité aux formations navales. Les concepts d'escorte furtive mettent l'accent sur une détectabilité réduite et la discrétion opérationnelle."
 SUBDOCTRINE_SUBMARINE_ESCORT_ATTACK: "Sous-marins d'attaque d'escorte"
 SUBDOCTRINE_SUBMARINE_ESCORT_ATTACK_DESC: "Cette doctrine assigne les forces sous-marines à opérer en étroite coordination avec les flottes de surface. Les concepts de sous-marins d'attaque d'escorte mettent l'accent sur le soutien immergé des opérations navales."
 SUBDOCTRINE_SUBMARINE_HUNTER_KILLER: "Sous-marins chasseurs-tueurs"
 SUBDOCTRINE_SUBMARINE_HUNTER_KILLER_DESC: "Cette doctrine structure les forces sous-marines autour de patrouilles offensives indépendantes. Les concepts de sous-marins chasseur-tueur mettent l'accent sur une présence sous-marine soutenue et un engagement ciblé."
 SUBDOCTRINE_SUBMARINE_MISSILE_BOATS: "Vedettes lance-missiles"
 SUBDOCTRINE_SUBMARINE_MISSILE_BOATS_DESC: "Cette doctrine organise les forces sous-marines autour de plateformes équipées pour le déploiement de missiles. Les concepts de bâtiments lance-missiles mettent l'accent sur une capacité de frappe stratégique et opérationnelle depuis le domaine maritime."
 SUBDOCTRINE_OPERATIONS_RAIDING_FLEETS: "Flottes de raid"
 SUBDOCTRINE_OPERATIONS_RAIDING_FLEETS_DESC: "Cette doctrine structure les opérations navales autour de groupes opérationnels mobiles menant des actions maritimes disruptives. Les concepts de flottes de raid mettent l'accent sur la portée opérationnelle et un emploi flexible de la force."
 SUBDOCTRINE_OPERATIONS_NAVAL_SUPREMACY: "Suprématie navale"
 SUBDOCTRINE_OPERATIONS_NAVAL_SUPREMACY_DESC: "Cette doctrine organise les opérations navales pour établir et maintenir le contrôle des espaces maritimes. Les concepts de suprématie navale mettent l'accent sur une action de flotte coordonnée le long des lignes de communication maritimes."
 SUBDOCTRINE_OPERATIONS_COSTAL_DEFENSE: "Défense côtière"
 SUBDOCTRINE_OPERATIONS_COSTAL_DEFENSE_DESC: "Cette doctrine structure les forces navales pour protéger les eaux territoriales et les approches côtières. Les concepts de défense côtière mettent l'accent sur une sécurité maritime en couches et le contrôle régional de la mer."
