 TurkicConfederation.3.b: "함께하지 않는 것이 좋겠다…"
 TurkicConfederation.4.t: "투르크 연방으로 우리를 초대하는 터키"
 TurkicConfederation.4.d: "튀르키예 정부가 우리에게 접근하여 새로 설립된 튀르크 연합에 가입할 것을 요청했습니다. 가입하면 분명 통합되겠지만, 우리는 주권 국가로서의 지위를 잃게 될 것입니다.."
 TurkicConfederation.4.a: "투르크인들은 하나다!"
 TurkicConfederation.4.b: "함께하지 않는 것이 좋겠다…"
 TurkicConfederation.11.t: "아제르바이잔의 가입!"
 TurkicConfederation.11.d: "아제르바이잔 정부가 튀르크 연합에 가입하라는 우리의 제안을 수락했습니다. 우리는 마침내 아제르바이잔의 형제들과 하나가 될 것입니다!"
 TurkicConfederation.11.a: "투르크 연방의 좋은 소식이군"
 TurkicConfederation.21.t: "카자흐스탄의 가입!"
 TurkicConfederation.21.d: "카자흐스탄 정부가 튀르크 연합에 가입하라는 우리의 제안을 수락했습니다. 우리는 마침내 카자흐스탄의 형제들과 하나가 될 것입니다!"
 TurkicConfederation.21.a: "투르크 연방의 좋은 소식이군"
 TurkicConfederation.31.t: "우즈베키스탄의 가입!"
 TurkicConfederation.31.d: "우즈베키스탄 정부가 튀르크 연합에 가입하라는 우리의 제안을 수락했습니다. 우리는 마침내 우즈베키스탄의 형제들과 하나가 될 것입니다!"
 TurkicConfederation.31.a: "투르크 연방의 좋은 소식이군"
 TurkicConfederation.41.t: "투르크메니스탄의 가입!"
 TurkicConfederation.41.d: "투르크메니스탄 정부가 튀르크 연합에 가입하라는 우리의 제안을 수락했습니다. 우리는 마침내 투르크메니스탄의 형제들과 하나가 될 것입니다!"
 TurkicConfederation.41.a: "투르크 연방의 좋은 소식이군"
 TurkicConfederation.12.t: "제안을 거절한 아제르바이잔"
 TurkicConfederation.12.d: "아제르바이잔 정부가 튀르크 연합에 가입하라는 우리의 제안을 거절했습니다. 통합 가능성을 위해 다른 나라들을 살펴봐야 할 것으로 보입니다."
 TurkicConfederation.12.a: "Unfortunate"
 TurkicConfederation.22.t: "제안을 거절한 카자흐스탄"
 TurkicConfederation.22.d: "카자흐스탄 정부가 튀르크 연합에 가입하라는 우리의 제안을 거절했습니다. 통합 가능성을 위해 다른 나라들을 살펴봐야 할 것으로 보입니다."
 TurkicConfederation.22.a: "Unfortunate"
 TurkicConfederation.32.t: "제안을 거절한 우즈베키스탄"
 TurkicConfederation.32.d: "우즈베키스탄 정부가 튀르크 연합에 가입하라는 우리의 제안을 거절했습니다. 통합 가능성을 위해 다른 나라들을 살펴봐야 할 것으로 보입니다."
 TurkicConfederation.32.a: "Unfortunate"
 TurkicConfederation.42.t: "제안을 거절한 투르크메니스탄"
 TurkicConfederation.42.d: "투르크메니스탄 정부가 튀르크 연합에 가입하라는 우리의 제안을 거절했습니다. 통합 가능성을 위해 다른 나라들을 살펴봐야 할 것으로 보입니다."
 TurkicConfederation.42.a: "Unfortunate"
 TUR_flavor_event.1.t: "붕괴하는 터키의 경제!"
 TUR_flavor_event.1.d: "우리 경제가 붕괴한 것으로 보이며, 지금 당장은 이를 구할 방법이 없습니다. 경제를 서서히 회복시키고 튀르키예의 경제 호황을 일으킬 경제 계획을 마련해야 합니다. 우리 앞에는 긴 길이 놓여 있으므로 가능한 한 빨리 일에 착수해야 합니다."
 TUR_flavor_event.1.a: "이번이 마지막이길 빌자"
 TUR_flavor_event.2.t: "빙골 지역의 심각한 지진"
 TUR_flavor_event.2.d: "규모 6.4의 강진이 동부 도시 빙괼 뒤흔들었습니다. 177명이 사망했으며 그중 84명은 기숙학교의 기숙사 건물이 무너져 숨졌습니다. 약 8,000채의 가옥이 피해를 입었고 학교 약 4곳이 붕괴되었습니다. 이 지진은 우리가 재난 구호 프로그램을 강화해야 한다는 점을 일깨워 주는 계기가 되어야 합니다.."
 TUR_flavor_event.2.a: "나라의 슬픈 날이군"
 TUR_flavor_event.3.t: "이스탄불 폭격!"
 TUR_flavor_event.3.d: "약 닷새 전 아침 9시 30분경, 폭탄을 실은 트럭 두 대가 이스탄불에서 폭발했습니다. 한 대는 네베 샬롬 유대교 회당 근처였고 다른 한 대는 베트 이스라엘 유대교 회당에서였습니다. 약 28명이 목숨을 잃었고 300명이 부상당했습니다. 오늘 영국 영사관에 대한 공격으로 또 다른 31명이 사망하고 450명이 부상당했다는 소식이 전해졌습니다. 이 공격으로 총 59명이 목숨을 잃고 750명이 더 부상당했습니다.."
 TUR_flavor_event.3.a: "끔찍하다"
 TUR_flavor_event.3.b: "일정 수준의 지원책을 마련하자"
 TUR_flavor_event.3.c: "힘쓸 수 있는 모든 것이라면 전부 지원하자"
 TUR_flavor_event.4.t: "새로운 리라의 도입"
 TUR_flavor_event.4.d: "Recently, a major change to the Lira has been brought about. The Grand National Assembly had voted on the removal of six zeros from the Lira. This means that 1 lira of the new currency is the equivalent of 1,000,000 lira of the old version. However some are doubtful of this new change, and they are arguing that it could do more harm than good to the nation."
 TUR_flavor_event.4.a: "말도 안된다, 이는 매우 긍정적인 변화이다"
 TUR_flavor_event.4.b: "옛 것이 최고이다"
 TUR_flavor_event.5.t: "Assassination of Hrant Dink"
 TUR_flavor_event.5.d: "Hrant Dink, a Turkish-Armenian journalist, had been assassinated in Istanbul a few days back. He was an activist of minority rights, and a newspaper editor who actively sought out the reconciliation between Armenians, and Turks. The murderer has been identified as a 17 year old male, and he is now under police custody. Hrant's death has sparked outrage amongst the Armenian community within our nation, and today was the funeral where thousands gathered in solidarity."
 TUR_flavor_event.5.a: "비극적이군"
 TUR_flavor_event.6.t: "이민자의 유입"
 TUR_flavor_event.6.d: "최근 분쟁이 심화되면서 인접 국가와 해외에서 점점 더 많은 이민자가 유입되고 있습니다. 이는 우리 정치를 서서히 불안정하게 만들기 시작했으며, 일부는 더 공격적인 정책을 요구하기까지 합니다. 이러한 일련의 사태에 대한 대응을 준비해야 할 것입니다.."
 TUR_flavor_event.6.a: "다다익선 아니겠는가?"
 TUR_flavor_event.7.t: "약물 사용 급증"
 TUR_flavor_event.7.d: "마약 사용이 나라의 일부 지역, 특히 저소득층 지역에서 서서히 증가하고 있습니다. 이 문제에 관한 우리의 정책과 법률이 제각각이어서 이는 파괴적인 영향을 미칠 것입니다."
 TUR_flavor_event.7.a: "법을 개정하자"
 TUR_flavor_event.8.t: "가자 구호선단 (Gaza Flotilla) 공습"
 TUR_flavor_event.8.d: "오늘 아침, 이스라엘 해군 특수부대가 다수의 민간 선박에 대한 공습 작전을 감행하여, 마비 마르마라 (Mavi Marmara) 선박에 타고있던 9명의 터키 출신 승무원들이 사망하였습니다. 이 선박은 국제구호선단의 일부로 가자 지구에 대한 이스라엘의 봉쇄에 따른 인도주의적 지원 및 구호품을 적재하고 있었습니다. 그러나, 이는 선박 공습으로 인해 다수의 사상자를 만들 명분이 되지 않으며, 이스라엘은 이에 대해 일절의 사과 및 보상조차 하지 않으려는 것으로 보입니다."
 TUR_flavor_event.8.a: "무슨 수를 써서라도 배상금과 사과를 받아내라!"
 TUR_flavor_event.8.b: "우리는 더 시급한 문제들에 신경써야 한다.."
 TUR_flavor_event.81.t: "가자 구호선단에 대한 배상금을 요구하는 터키"
 TUR_flavor_event.81.d: "튀르키예 정부는 우리 특공대가 가자 지구 봉쇄를 뚫으려는 선박에 승선하여 이를 저지한 것에 분노하고 있습니다. 물론 우리는 여러 차례 경고를 보냈으므로 잘못은 그들에게 있지만, 그들은 개의치 않습니다."
 TUR_flavor_event.81.a: "배상금을 주고, 잘 마무리 지어라"
 TUR_flavor_event.81.b: "우린 그 어느것도 내놓지 않을 것이다"
 TUR_flavor_event.811.t: "배상금을 지불하는 이스라엘"
 TUR_flavor_event.811.d: "이스라엘은 자유 가자 운동에 대한 부당한 습격의 결과로 피해자 유족과 우리 국가에 배상금을 지급하기로 합의했습니다."
 TUR_flavor_event.811.a: "이 정도로 숨진 이들에 대한 보상이 될거라 생각치 마라.."
 TUR_flavor_event.812.t: "우리의 요구를 무시한 이스라엘"
 TUR_flavor_event.812.d: "이스라엘 정부는 잘못은 우리에게 있었으므로 우리에게는 배상을 요구할 권리가 없다고 말하며 우리의 요구를 일축했습니다. 이는 터무니없는 발언이지만, 우리는 이를 잊지 않을 것입니다."
 TUR_flavor_event.812.a: "믿을 수 없군"
 TUR_flavor_event.9.t: "반 지역을 뒤흔든 지진"
 TUR_flavor_event.9.d: "오늘 일찍 규모 7.1의 지진이 반을 뒤흔들었습니다. 약 11,000채의 건물이 피해를 입거나 파괴되어 6만 명 이상이 집을 잃었고 약 600명이 사망했습니다. 안타깝게도 우리 동부 지역은 지진과 같은 자연재해가 낯설지 않아 이러한 일이 드문 것은 아닙니다."
 TUR_flavor_event.9.a: "비극이군"
 TUR_flavor_event.9.b: "재난구조팀을 동원해라"
 TUR_flavor_event.10.t: "기념일 ’노루즈 (Nowruz)’ 시위"
 TUR_flavor_event.10.d: "Kurds across the nation are starting to protest against our government's policies, and they are demanding that we change them to better suit their needs. Obviously they want nothing more but to destroy the Turkish nation, as a lot of these protesters are in favor of the PKK."
 TUR_flavor_event.10.a: "기동대를 출격 대기 시켜라"
 TUR_flavor_event.10.b: "시위하더록 내버려두자"
 TUR_flavor_event.11.t: "공격받은 미국 대사관!"
 TUR_flavor_event.11.d: "The U.S. Embassy in Ankara has been attacked by a man wearing a vest strapped with explosives. The attack left the suspect, and one Turkish security guard dead, whilst also damaging the building itself by leaving a giant hole on the side of it. The White House has said that it will have to conduct its own investigations as to why it happened, but this should not have happened in the first place."
 TUR_flavor_event.11.a: "No need for an investigation if they're doing one"
 TUR_flavor_event.11.b: "우리도 개별적인 조사를 진행하자"
 TUR_flavor_event.12.t: "소마 지역 광산의 참사"
 TUR_flavor_event.12.d: "약 이틀 전 소마의 탄광에서 폭파 작업으로 인해 화재가 발생했습니다. 화재는 약 이틀간 이어졌고 구조 작업이 최대한 빨리 동원되었으나, 화재의 짙은 연기로 인해 결국 별다른 성과를 거두지 못했습니다. 약 301명이 사망한 것으로 확인되었으며 다행히 486명이 생존했습니다. 부실한 점검과 점검을 담당한 관리들에게 비난의 화살이 쏠리고 있습니다."
 TUR_flavor_event.12.a: "비극적이군"
 TUR_flavor_event.12.b: "전면적인 조사를 진행하라"
 TUR_flavor_event.13.t: "앙카라의 폭발"
 TUR_flavor_event.13.d: "얼마 전 앙카라 중앙역 근처에서 폭탄 2개가 터져 민간인 109명이 사망하고 500명이 부상당했습니다. 이 폭탄은 여러 단체가 주최한 앙카라의 \\"노동, 평화, 민주주의\\" 집회를 방해하려는 목적이었던 것으로 보입니다. 여러 야당이 우리 정부와 공격을 막지 못한 무능함을 비난하고 있지만, 현재 우리가 할 수 있는 일은 할 수 있는 부분에서 변화를 만드는 것뿐입니다.."
 TUR_flavor_event.13.a: "유감이군"
 TUR_flavor_event.13.b: "보안을 더욱 강화하라"
 TUR_flavor_event.14.t: "학교 교육 체계에 대한 논쟁"
 TUR_flavor_event.14.d: "Conservatives and conservative groups across the nation are demanding that we remove the concept of evolution from our schools' curriculums. This has worried the secularists in our country, with some even saying that this undermines the very foundation of the nation."
 TUR_flavor_event.14.a: "제거해라, 반대하는 이들은 근거라도 있나?"
 TUR_flavor_event.14.b: "터무니 없군"
 TUR_flavor_event.15.t: "이스파르타 주 CASA CN-235 추락 사고"
 TUR_flavor_event.15.d: "얼마 전 공군 CN-235 수송기가 조종사 두 명과 기술자 한 명을 태우고 훈련 임무를 수행하고 있었습니다. 해당 지역의 짙은 안개로 인해 승무원들이 경로를 제대로 파악하지 못했고, 비극적으로 추락하여 탑승자 전원이 사망했습니다."
 TUR_flavor_event.15.a: "진심으로 유감이군"
 TUR_flavor_event.15.b: "앞으로 이런 일이 일어나지 않도록 조치를 취해라"
 TUR_flavor_event.16.t: "남극에 기지 건설을 완료한 과학자들"
 TUR_flavor_event.16.d: "우리나라 과학자들이 남극에 기지를 세웠으며, 이는 우리 국가의 중대한 과학적 진전을 의미합니다!"
 TUR_flavor_event.16.a: "좋아"
 TUR_flavor_event.17.t: "쿠르드의 권리"
 TUR_flavor_event.17.d: "국내 자유주의 진영이 현존하는 쿠르드 관련 법률의 개혁을 요구하고 있습니다. 그들은 쿠르드 정당들이 지지도를 더욱 쉽게 확보할 수 있도록 해주며 그들의 분노를 진정시키자는 의견을 제시하고 있습니다. 그러나 보수적인 진영에서는 안정도를 위해 현상 유지를 해야된다는 입장을 고수하고 있습니다."
 TUR_flavor_event.17.a: "개혁은 위험하다"
 TUR_flavor_event.17.b: "개혁은 필요하다"
 TUR_flavor_event.18.t: "가족관의 변화"
 TUR_flavor_event.18.d: "최근, 여성이 집안의 가장이 될 수 있도록 하는 법안이 가결되었습니다. 이는 대다수 자유 진영의 환영을 받았지만, 보수 진영은 이를 달갑게 보고 있지 않습니다. 우리는 이 법안을 수정할 수 있는 단 한 번의 기회가 있으며, 그 선택의 득과 실은 아직 알 수 없습니다."
 TUR_flavor_event.18.a: "우리는 전통을 고수해야만 한다"
 TUR_flavor_event.18.b: "변화는 필요하다"
 TUR_flavor_event.19.t: "아르메니아와의 관계 정상화"
 TUR_flavor_event.19.d: "영원할 것만 같던 시간이 지난 끝에 아르메니아인들이 양국 관계 정상화를 위해 마음을 열고 있습니다. 흐란트 딩크 암살 이후 아르메니아와의 관계는 급락하여 양국 사이에 불필요한 적대감이 쌓였습니다. 그러나 최근 그들은 과거에서 벗어나기 시작했고 다시 한번 관계 정상화에 열려 있습니다.."
 TUR_flavor_event.19.a: "그들은 어떨지 몰라도 우리는 이를 원치 않는다"
 TUR_flavor_event.19.b: "좋은 소식이다"
 TUR_flavor_event.20.t: "투르크메니스탄 - 카스피해 가스 파이프라인"
 TUR_flavor_event.20.d: "미국의 설득 끝에 투르크메니스탄은 투르크메니스탄 바시에서 튀르키예 아다나까지 이어지는 해저 가스관의 건설을 허용하기로 합의했습니다. 그러나 정부 내 다수는 재정 부담이 결국 우리에게 떨어질 것이며 이는 우리 경제를 위험에 빠뜨릴 수 있다고 주장하며 회의적입니다."
 TUR_flavor_event.20.a: "좋은 기회이다"
 TUR_flavor_event.20.b: "음… 별로다"
 Turkish_Economy.1.t: "투자를 제공하는 터키"
 Turkish_Economy.1.desc: "튀르키예는 튀르키예 기업이 운영하고 유지 관리하도록 허용한다면 우리 지역 한 곳에 민간 공장을 건설하겠다고 제안했습니다. 튀르키예는 이를 통해 일정한 해외 영향력을 얻겠지만 우리도 장기적으로 이익을 얻을 것입니다."
 Turkish_Economy.1.a: "찬성"
 Turkish_Economy.1.b: "안된다"
 Turkish_Economy.2.t: "투자를 제공하는 터키"
 Turkish_Economy.2.desc: "튀르키예는 튀르키예인이 운영하고 유지 관리하도록 허용한다면 우리 지역 한 곳에 민간 공장을 건설하겠다고 제안했습니다. 튀르키예는 이를 통해 일정한 해외 영향력을 얻겠지만 우리도 장기적으로 이익을 얻을 것입니다."
 Turkish_Economy.2.a: "찬성"
 Turkish_Economy.2.b: "안된다, 우리는 친구가 아니다."
 Turkish_Economy.3.t: "투자를 제공하는 터키"
 Turkish_Economy.3.desc: "튀르키예는 튀르키예인이 운영하고 유지 관리하도록 허용한다면 우리 지역 한 곳에 민간 공장을 건설하겠다고 제안했습니다. 튀르키예는 이를 통해 일정한 해외 영향력을 얻겠지만 우리도 장기적으로 이익을 얻을 것입니다."
 Turkish_Economy.3.a: "찬성"
 Turkish_Economy.3.b: "안된다"
 Turkish_Economy.4.t: "투자를 제공하는 터키"
 Turkish_Economy.4.desc: "튀르키예는 튀르키예인이 운영하고 유지 관리하도록 허용한다면 우리 지역 한 곳에 민간 공장을 건설하겠다고 제안했습니다. 튀르키예는 이를 통해 일정한 해외 영향력을 얻겠지만 우리도 장기적으로 이익을 얻을 것입니다."
 Turkish_Economy.4.a: "찬성"
 Turkish_Economy.4.b: "안된다"
 Turkish_Economy.5.t: "투자를 제공하는 터키"
 Turkish_Economy.5.desc: "튀르키예는 튀르키예인이 운영하고 유지 관리하도록 허용한다면 우리 지역 한 곳에 민간 공장을 건설하겠다고 제안했습니다. 튀르키예는 이를 통해 일정한 해외 영향력을 얻겠지만 우리도 장기적으로 이익을 얻을 것입니다."
 Turkish_Economy.5.a: "찬성"
 Turkish_Economy.5.b: "안된다"
 Turkish_Economy.11.t: "이란의 수락!"
 Turkish_Economy.11.desc: "이란은 우리의 투자 제안을 수락했으며, 이제 튀르키예 기업이 테헤란에서 민간 공장을 운영하게 됩니다."
 Turkish_Economy.11.a: "이는 무엇보다도 이란의 경제에 큰 도움이 될 것이다.."
 Turkish_Economy.22.t: "아르메니아의 수락!"
 Turkish_Economy.22.desc: "놀랍게도 아르메니아인들이 우리의 제안을 수락했으며, 그들의 지역 한 곳에 민간 공장을 건설하려는 계획이 이제 진행 중입니다!"
 Turkish_Economy.22.a: "옛 적이지만, 이젠 새로운 친구다."
 Turkish_Economy.33.t: "조지아의 수락!"
 Turkish_Economy.33.desc: "조지아는 민간 공장 건설 제안을 수락했으며, 튀르키예 기업이 이를 운영해야 한다는 조건에도 동의했습니다."
 Turkish_Economy.33.a: "좋아"
 Turkish_Economy.44.t: "불가리아의 수락!"
 Turkish_Economy.44.desc: "불가리아인들은 우리의 조건에 동의했으며 이제 우리에게 민간 공장을 건설할 부지를 제공하고 있습니다!"
 Turkish_Economy.44.a: "우리는 서방을 향해 나아간다!"
 Turkish_Economy.55.t: "그리스의 수락!"
 Turkish_Economy.55.desc: "그리스인들이 우리의 제안을 수락했으며 이제 그들의 땅에 민간 공장을 건설하도록 허용하고 있습니다! 놀라운 일입니다!"
 Turkish_Economy.55.a: "기대하진 않았지만, 훌륭하다!"
 Turkish_Economy.111.t: "이란의 제안 거부!"
 Turkish_Economy.111.desc: "테헤란은 투자 조건에 동의하지 않은 것으로 보이며, 우리는 다른 곳을 찾아봐야 할 것입니다."
 Turkish_Economy.111.a: "유감이군"
 Turkish_Economy.222.t: "제안을 거절한 아르메니아!"
 Turkish_Economy.222.desc: "예상대로 아르메니아인들은 자국 영토 내 민간 산업 건설 제안을 거절했습니다."
 Turkish_Economy.222.a: "Old grudges stunt progress."
 Turkish_Economy.333.t: "제안을 거절한 조지아!"
 Turkish_Economy.333.desc: "안타깝게도 조지아가 투자 제안을 거절했으며, 튀르키예와 조지아의 관계를 재평가해야 할 것으로 보입니다."
 Turkish_Economy.333.a: "유감이군"
 Turkish_Economy.444.t: "불가리아의 제안 거부!"
 Turkish_Economy.444.desc: "불가리아는 투자 요청에 대해 아예 답변조차 하지 않았으며, 우리는 이를 거절로 받아들여야 할 것입니다."
 Turkish_Economy.444.a: "놀랍군"
 Turkish_Economy.555.t: "제안을 거절한 그리스!"
 Turkish_Economy.555.desc: "그리스는 튀르키예 기업이 자국 땅에서 운영되는 것을 원하지 않는 것으로 보이며, 우리는 당분간 물러서야 합니다."
 Turkish_Economy.555.a: "늘 그랬듯 여전하군"
 TUR_pkk.1.t: "Diyarbakir Summit"
 TUR_pkk.1.d: "The Diyarbakir Summit will commence as early as this week, however, we still have not made up our mind on how we will approach the £TUR_Neutral_Communism  PKK. We have the ability to continue waging a war on their attempts at autonomy and independence, but some have also floated the idea of coming to a compromise. Thus far, that idea has been mostly unpopular. The armed forces have continued to demonstrate their readiness in combating the PKK and preventing the splintering of the great Turkish nation."
 TUR_pkk.1.a: "Cooperation with our neighbors will defeat the terrorists!"
 TUR_pkk.1.b: "We don't need help, we will take out the PKK on our own!"
 TUR_pkk.1.c: "Perhaps we have been too harsh on the Kurds..."
 TUR_pkk.2.t: "Turkey Proposes Security Cooperation Against the PKK"
 TUR_pkk.2.d: "튀르키예 정부는 오늘 일찍 디야르바크르 정상회담에서 우리를 포함한 지역 국가들과 협력을 추진하고자 한다고 발표했습니다. 회담에 참석한 우리 대표단은 이 정보를 [ROOT.capital.GetCapitalVictoryPointName]에 전달했으며, 이 지역의 PKK와 그 분파 집단에 맞서기 위해 우리 정부가 취할 입장을 알고 싶어 합니다."
 TUR_pkk.2.a: "Cooperation is the way forward"
 TUR_pkk.3.t: "[FROM.GetName] Agrees to Cooperate Against the PKK!"
 TUR_pkk.3.d: "[FROM.GetName]의 대표단은 디야르바크르 회의에서 우리 대표단과 굳게 악수를 나누었으며, [FROM.capital.GetCapitalVictoryPointName]이(가) PKK와 그 분파 집단에 대한 첫 조치가 취해지기를 간절히 기다리고 있다고 밝혔습니다."
 TUR_pkk.3.a: "Great!"
 TUR_pkk.4.t: "Delegates from [FROM.GetName] Leave the Summit"
 TUR_pkk.4.d: "Delegates from our neighbor, [FROM.GetName], silently left the summit a little while ago. The strange decision is questionable at best, as it raises some concerns within our cabinet about what their intentions really are."
 TUR_pkk.4.a: "Really?"
 Turkey.1.t: "새 정당을 창설하는 외즈칸"
 Turkey.1.desc: "[ROOT.GetLeader] 총리가 공개적으로 부총리 휘사메틴 외즈칸을 비난하면서, 그는 국회와 그의 정당에서 사임하겠다 발표하였습니다. 그는 또한 새로운 정당인, '신터키당 (New Turkey Party)'의 창설을 선언하였습니다. 현재 많은 §W[socialism_L]§! 국회의원들이 그와 함께하겠다는 의사를 보이고 있고, 또한 수많은 이들이 §W[conservatism_L]§!에 합류하려 하고 있습니다."
 Turkey.1.a: "우린 그가 필요하지 않다"
 Turkey.1.b: "극비에 국회의원들괴 거래를 하자"
 Turkey.2.t: "정계에서 사퇴한 외즈칸"
 Turkey.2.desc: "[ROOT.GetLeader] 총리가 공개적으로 부총리 휘사메틴 외즈칸을 비난하면서, 그는 국회와 그의 정당에서 사임하겠다 발표하였습니다. 이후 진행된 기자회견에서, 그는 정계에서 완전히 은퇴하여 가족들과 함께 시간을 더 보내며 개인적인 일에 집중하고  싶다며 언급하였습니다."
 Turkey.2.a: "우리의 도박이 성공했군"
 Turkey.3.t: "외즈칸의 쿠데타"
 Turkey.3.desc: "The rumours were true! Özkan and other §W[socialism_L]§! members were planning a coup. After a motion of no-confidence at a party meeting towards [ROOT.GetLeader], he was forced to resign. Özkan has taken his place as Prime Minister of Turkey"
 Turkey.3.a: "저 망할 녀석!"
 Turkey.4.t: "새로운 선거를 요구하는 [Nat_Populism_L]"
 Turkey.4.desc: "§W[socialism_L]§!의 정치적 상황으로 인해 §W[Nat_Populism_L]§!이 우리 집권 연립 정부에 대한 지지를 철회하고 새로운 선거를 요구하고 있습니다."
 Turkey.4.a: "새로운 선거를 진행해라"
 Turkey.4.b: "우린 선거가 필요없다, 혼자서 살아남을 수 있다"
 Turkey.5.t: "2000년 터키 총선"
 Turkey.5.desc: "2000년 터키 총선이 다가왔습니다. 터키는 의회에서 대통령을 선출합니다. 후보자가 승리하기 위해선, 2차로 치뤄지는 선거에서 최소 한번 이상 3분의 2의 득표를 획득해야 합니다. 당선자가 없을 경우, 3차 투표에선 단순히 최다 득표자가 승리할 수도 있습니다. 그래도 확실한 승자가 나오지 않는다면, 4차 선거는 가장 지지도가 높은 두 후보 간에 경쟁이 치뤄집니다. 이 모든 것을 시행했는데도 결론이 나지 않는다면, 교착 상태를 끝내기 위해 신속 투표 (snap election)가 계속될 것입니다.\n\n한편, 각 정당에서는 현재 그들만의 후보자들을 배출해내고 있습니다만, 그들이 경쟁력 있는 후보가 될 가능성은 매우 적을 것으로 보입니다."
 Turkey.5.a: "부총리 외즈칸이 협상할 것이다"
 Turkey.5.b: "우린 그저 최선의 결과를 바랄 뿐이다"
 Turkey.6.t: "아흐메트 네지데트 세제르의 대통령 당선"
 Turkey.6.desc: "아흐메트 네지데트 세제르가 튀르키예 공화국의 제10대 대통령으로 선출되었습니다. 전 헌법재판소장인 그의 당선은 오즈칸 부총리의 설득을 받은 의회 정당 다수의 지지를 받았습니다. 세제르는 세속주의의 확고한 수호자이며 히잡 금지의 지지자입니다."
 Turkey.6.a: "잘했다 외즈칸"
 Turkey.7.t: "총선에서 승리한 [socialism_L] 후보"
 Turkey.7.desc: "모두의 예상을 뒤엎고 §W[socialism_L]§!의 대통령 후보인 메흐메트 마일 뷔위케르만이 표결에서 승리했습니다. 일부 정치 분석가들은 이를 기적이라고 평했습니다. 뷔위케르만이 승리한 가장 유력한 이유는 야당들이 새로운 선거를 치르는 위험을 감수하여 나라를 더 불안정하게 만들기를 원하지 않았기 때문입니다."
 Turkey.7.a: "훌륭하군"
 Turkey.8.t: "Presidential Vote Proceeds To Its Fourth Round"
 Turkey.8.desc: "어느 후보도 처음 두 차례 투표에서 필요한 3분의 2 득표나 세 번째 투표에서 필요한 과반 득표를 달성하지 못했습니다. 경선은 이제 §W[socialism_L]§!과 §W[Conservative_L]§!의 후보로 좁혀졌습니다. 어느 후보도 승리할 가능성은 여전히 매우 낮으며, 조기 선거가 열릴 가능성이 매우 높습니다. 물론 우리는 §W[Conservative_L]§! 후보에 대한 지지를 발표할 수 있습니다. 이는 사실상 정치적 자살이지만, 최소한 우리에게 시간을 벌어 주고 즉각적인 선거를 면하게 해 줄 것입니다."
 Turkey.8.a: "다시, 최선의 결과만을 바라자."
 Turkey.8.b: "Throw our weight behind the §W[Conservative_L]§! candidate"
 Turkey.9.t: "총선에서 승리한 [Conservative_L] 후보"
 Turkey.9.desc: "집권 §W[socialism_L]§!의 지지를 받아 §W[Conservative_L]§! 후보 네브자트 얄츤타시가 대통령 선거에서 승리했습니다. 이는 분명 §W[Conservative_L]§!의 인기를 끌어올릴 것입니다."
 Turkey.9.a: "훌륭하군"
 Turkey.10.t: "신속 선거 (Snap Election)를 개시하는 의회"
 Turkey.10.desc: "어떤 후보도 대통령직에 오를 만큼 충분한 지지를 얻지 못한 것으로 보입니다. 튀르키예 헌법은 이러한 상태에서는 교착 상태를 타개하기 위해 조기 선거를 실시해야 한다고 규정하고 있습니다.\n\n새로운 의회는 새 대통령을 성공적으로 선출할 것입니다."
 Turkey.10.a: "젠장"
 Turkey.11.t: "군사 쿠데타!"
 Turkey.11.desc: "오늘 일찍 튀르키예 군 부대가 이스탄불 거리로 진입하여 여러 정부 건물을 점거했습니다. 튀르키예 전투기가 이 지역을 순찰하는 가운데 군은 이스탄불 영공 폐쇄를 발표했습니다. 튀르키예 병사들이 다른 주요 도시에도 배치되고 있다는 보고가 들어오고 있습니다. 현 정권에 충성하는 병사들과 쿠데타에 가담한 병사들 사이에 일부 충돌이 보고되었습니다. 지금까지 대부분의 정부 인사는 군에 체포되는 것을 피한 것으로 보입니다. 정부에 충성하는 병력이 이 반란군을 무장 해제시킬 것이라는 희망은 여전히 남아 있습니다. 어쩌면 그렇지 않을 수도 있습니다."
 Turkey.11.a: "군부는 반역자들로 가득하군! 이 범죄자들을 체포하라!"
 Turkey.11.b: "군부의 행위는 정의로운 것이다! 타락한 지도자는 자리에서 끌어내려야만 한다!"
 Turkey.12.t: "터키 군사 쿠데타"
 Turkey.12.d: "오늘 밤 병사들이 여러 정부 건물에 주둔한 가운데 전차와 기계화 부대가 이스탄불 거리를 순찰하고 있습니다. 군은 전투기가 하늘을 누비는 가운데 이스탄불 영공 폐쇄를 발표했습니다. 사람들이 집 안에서 조용히 앉아 있는 가운데 거리에서는 기계화 부대의 엔진 소리 외에는 아무런 소리도 들리지 않습니다. 튀르키예에서의 성공적인 군사 쿠데타로 무모한 정책을 펴던 집권당이 축출되었으며, 군은 이제 나라 전체에 대한 완전한 통제권을 공고히 하고 있습니다. 군은 사람들에게 거리로 나오지 말라고 경고했으며 비상사태를 선포했습니다."
 Turkey.12.a: "흥미롭군"
 Turkey.14.t: "터키 군사 쿠데타 미수"
 Turkey.14.d: "[TUR.GetLeader]은(는) 오늘 아침 군사 쿠데타가 격퇴되었다고 발표하면서 많은 지지자 군중을 만났으며, 이는 오직 튀르키예 국민의 힘으로만 가능했습니다. [TUR.GetLeader]은(는) 이후 여러 핵심 장교가 이번 쿠데타 시도의 주요 용의자로 확인되었으며 가담한 다른 모든 이들도 조사를 받고 있다고 발표했습니다. 연설에서 [TUR.GetLeader]은(는) \\"모든 계급에 대한 점검\\"이 이루어질 것이며 \\"배신자가 한 명도 남아서는 안 된다\\"고도 언급했습니다. 연루된 관리들에게 어떤 일이 벌어질지는 알 수 없으나, 한 가지 확실한 것은 튀르키예 정치에서 군의 역할은 더 이상 없다는 점입니다."
 Turkey.14.a: "흥미롭군"
 Turkey.15.t: "터키의 내전 돌입"
 Turkey.15.d: "튀르키예에서 발생한 최근 쿠데타 시도 이후 군중이 이스탄불 거리를 달리는 전차를 맞닥뜨리고 정부 건물로 향하는 그들의 진격을 저지하려 했습니다. 그러나 전차는 멈추지 않았고 여러 명이 사망했습니다. 튀르키예의 다른 도시에서는 시민들이 무기를 들고 쿠데타를 저지하기 위해 자기 도시에 주둔한 병사들에게 발포하기 시작했습니다. 군은 쿠데타가 정당하며 튀르키예 민족을 구하려면 지도자가 전복되어야 한다고 발표했고, 나라의 일부는 이에 대해 그들을 지지하고 있습니다. 그러나 현재 튀르키예의 상황은 또 하나의 군사 쿠데타라기보다 내전에 가깝습니다."
 Turkey.15.a: "놀랍군"
 Turkey.77.t: "키프로스의 통일!"
 Turkey.77.d: "북키프로스 정부는 최근 북부와 남부를 아우르는 키프로스 전체에 대한 완전한 통제권을 공고히 했습니다. 이는 그들의 영향력과 힘이 커지기 시작하여 결국 국민이 통합할 수 있도록 하는 국민투표를 요구할 수 있게 된 데 따른 결과입니다. 아테네는 이 조치에 큰 분노를 표했으며 북키프로스를 합법적인 국가로 결코 인정하지 않겠다고 맹세하고 있습니다."
 Turkey.77.a: "뭐, 신기한 소식이군"
 Turkey.88.t: "키프로스의 통일"
 Turkey.88.d: "그리스 정부는 최근 북부와 남부를 아우르는 키프로스 전체에 대한 완전한 통제권을 공고히 했습니다. 이는 그들의 영향력과 힘이 커지기 시작하여 결국 국민이 통합할 수 있도록 하는 국민투표를 요구할 수 있게 된 데 따른 결과입니다. 튀르키예는 이 조치에 큰 분노를 표했으며 그리스를 키프로스의 합법적인 소유자로 결코 인정하지 않겠다고 맹세하고 있습니다."
 Turkey.88.a: "흥미롭군"
 Turkey.100.t: "총선"
 Turkey.100.d: "이제 우리 국민들이 다음 정권을 결정할 때가 왔습니다. 과연 누가 될까요?"
 Turkey.100.a: "정의개발당 (AKP)"
 Turkey.100.b: "공화인민당 (CHP)"
 Turkey.100.c: "현 여당이 계속 잘 할 수 있을 것이다"
 TurkeyRandomEvents.1.t: "스캔들로 요동치는 §W[conservatism_L]§!"
 TurkeyRandomEvents.1.desc: "§W[conservatism_L]§! 당 대표 데니즈 베이칼이 전직 비서와 한 침대에 누워있는 영상이 유출되었습니다. 이로 인해 베이칼의 사임에 대한 목소리가 커지고 있습니다."
 TurkeyRandomEvents.1.a: "우리에겐 득이지"
 TurkeyRandomEvents.1.b: "이는 조작된 것이다! 베이칼은 절대 내려오지 않을 것이다!"
 TurkeyRandomEvents.1.c: "다른 선택지가 없다"
 TurkeyFocusEvents.1.t: "동맹을 제안하는 [FROM.GetName]"
 TurkeyFocusEvents.1.desc: "[FROM.GetName]이(가) 서방 제국주의에 맞선 동맹을 제안했습니다. [FROM.GetName]과(와) 동맹을 맺으면 나고르노카라바흐를 되찾을 기회를 얻을 수도 있습니다."
 TurkeyFocusEvents.1.a: "함께 우리는 더 강해진다"
 TurkeyFocusEvents.1.b: "우리는 균형을 무너트릴 필요까지는 없다"
 TurkeyFocusEvents.2.t: "[FROM.GetName]의 나고르노카라바흐 철수 요구!"
 TurkeyFocusEvents.2.desc: "[FROM.GetName]이(가) 나고르노카라바흐에서 모든 병력을 철수하고 이 지역의 통제권을 아제르바이잔에 돌려줄 것을 요구하고 있습니다. 이는 대담한 요구이지만 [FROM.GetName]의 최근 공격성은 우리를 몰아내기 위해 무력을 사용할 의향이 있음을 보여 줍니다. 우리는 다전선 전쟁에서 오래 버티지 못할 것입니다."
 TurkeyFocusEvents.2.a: "우리는 양보해야 한다"
 TurkeyFocusEvents.2.b: "우리는 마지막까지 싸울 것이다!"
 TurkeyFocusEvents.3.t: "굴복하는 아르메니아!"
 TurkeyFocusEvents.3.desc: "아르메니아는 나고르노카라바흐에서 철수하라는 요구를 받아들였습니다. 이 지역은 이제 다시 아제르바이잔의 통제 아래에 있습니다."
 TurkeyFocusEvents.3.a: "훌륭해"
 TurkeyFocusEvents.4.t: "나고르노카라바흐에 주둔하는 아르메니아"
 TurkeyFocusEvents.4.desc: "아르메니아는 나고르노카라바흐를 아제르바이잔에 돌려주는 것을 단호히 거부했습니다."
 TurkeyFocusEvents.4.a: "젠장"
 TurkeyFocusEvents.4.b: "그럼 전쟁으로 가져오는 수밖에"
 TurkeyFocusEvents.5.t: "이란 혁명?"
 TurkeyFocusEvents.5.desc: "We can now successfully spread our revolution in Iran, but how we approach it will change how it will occur drastically."
 TurkeyFocusEvents.5.a: "적정 수준의 무기"
 TurkeyFocusEvents.5.b: "대량의 무기"
 TurkeyFocusEvents.6.t: "이라크 혁명?"
 TurkeyFocusEvents.6.desc: "We can now successfully spread our revolution in Iraq, but how we approach it will change how it will occur drastically."
 TurkeyFocusEvents.6.a: "적정 수준의 무기"
 TurkeyFocusEvents.6.b: "대량의 무기"
 TurkeyFocusEvents.7.t: "시리아에서의 혁명?"
 TurkeyFocusEvents.7.desc: "We can now successfully spread our revolution in Syria, but how we approach it will change how it will occur drastically."
 TurkeyFocusEvents.7.a: "적정 수준의 무기"
 TurkeyFocusEvents.7.b: "대량의 무기"
 TurkeyFocusEvents.8.t: "하타이를 요구하는 [FROM.GetName]"
 TurkeyFocusEvents.8.desc: "[FROM.GetName]이(가) 하타이를 돌려줄 것을 요구하고 있습니다. 해당 주에 대한 통제권이 없다면 우리 동맹에 가입하는 것을 거부하고 있습니다."
 TurkeyFocusEvents.8.a: "선택의 여지가 없군"
 TurkeyFocusEvents.8.b: "터키는 분할될 수 없다!"
 TurkeyFocusEvents.9.t: "하타이를 반환한 [FROM.GetName]"
 TurkeyFocusEvents.9.desc: "[FROM.GetName]이(가) 하타이를 우리에게 돌려주었습니다."
 TurkeyFocusEvents.9.a: "행복한 날이다!"
 TurkeyFocusEvents.10.t: "키프로스 문제"
 TurkeyFocusEvents.10.d: "터키 정부는 키프로스 문제에 대해 이전보다 더 강경하게 대응하기로 결정하였으며, 이제 더 이상 우리 정부는 미룰 수 없습니다. 우리는 이 위협에 대한 단계적인 대응책을 고안하였으며, 순서대로 이를 시행할 것입니다!"
 TurkeyFocusEvents.10.a: "전진하라!"
 TurkeyFocusEvents.19.t: "완충 지대 확립을 원하는 터키"
 TurkeyFocusEvents.19.d: "튀르키예 정부는 양국 국경 사이에 완충 지대를 설정하기를 원합니다. 이는 우리가 북부 지역 몇 곳을 완전히 비무장화하고 모든 군 병력을 철수시켜 튀르크인이 쿠르드인을 격퇴하도록 맡겨야 한다는 뜻입니다."
 TurkeyFocusEvents.19.a: "이게 최선이겠지.."
 TurkeyFocusEvents.19.b: "당연히 안된다!"
 TurkeyFocusEvents.191.t: "완충 지대에 수립에 동의하는 시리아"
 TurkeyFocusEvents.191.d: "시리아 정부는 압력에 굴복하여 양국 국경 사이에 완충 지대를 설정하도록 허용했습니다."
 TurkeyFocusEvents.191.a: "좋아"
 TurkeyFocusEvents.192.t: "완충 지대에 필요한 영토 제공을 거부하는 시리아"
 TurkeyFocusEvents.192.d: "시리아 정부는 양국 사이에 완충 지대를 설정하자는 우리의 요청을 거절했습니다."
 TurkeyFocusEvents.192.a: "그럼 어쩔 수 없지.."
 TurkeyFocusEvents.20.t: "난민 문제에 대하여"
 TurkeyFocusEvents.20.d: "우리는 현재 역사상 최대의 난민을 수용하고 있으며, 우리가 원하기만 한다면, 그들을 대외 정치적인 도구로 활용할 수도 있습니다. 우리 서쪽의 인접국인 그리스는 역시나… 비협조적으로 우리와 마찰을 빚고 있습니다. 그렇기에 우리는 이 난민들을 빌미로 그들이 우리의 요구에 더욱 순종적이도록 만들 수 있습니다."
 TurkeyFocusEvents.20.a: "안된다, 이는 우리 평판을 악화시킬 것이다"
 TurkeyFocusEvents.20.b: "일부만 보내라"
 TurkeyFocusEvents.20.c: "대규모로 보내라"
 TurkeyFocusEvents.21.t: "카라바흐 분쟁의 잠재적인 해결책?"
 TurkeyFocusEvents.21.d: "터키 정부 측은 우리에게 접근하여 아르메니아인들과의 잠재적인 합의안을 제안하였습니다. 우리는 카르바흐 지역의 통제권을 받는 대신 아르메니아인들에게 나흐츠반 자치 공화국을 할양할 것입니다."
 TurkeyFocusEvents.21.a: "좋다, 아르메니아인들이 어떻게 생각하는지 보자"
 TurkeyFocusEvents.21.b: "당연히 안된다"
 TurkeyFocusEvents.212.t: "카르바흐 분쟁의 중재를 제안하는 아제르바이잔"
 TurkeyFocusEvents.212.d: "며칠 전 [TUR.GetName] 측은 [AZE.GetName] 측과 접촉하여 현재 우리와 아제르바이잔 간의 카르바흐 분쟁에 대한 진정책을 제안하였습니다. 이번 안의 경우, 우리는 카르바흐 지역에 대한 영유권을 철회하고 이를 아제르바이잔에게 할양하면서, 그 대신 나흐츠반 지역이 다시 한 번 아르메니아의 품으로 돌아올 수 있도록 해줄 것입니다."
 TurkeyFocusEvents.212.a: "거절하지 않을 이유가 없군"
 TurkeyFocusEvents.212.b: "당연히 안된다!"
 TurkeyFocusEvents.213.t: "카르바흐 분쟁의 협상 타결!"
 TurkeyFocusEvents.213.d: "외교관들이 카라바흐 지역에 관한 우리의 합의안 조건에 동의했다고 알려 오면서 아르메니아 대사관으로부터 희소식이 도착했습니다!"
 TurkeyFocusEvents.213.a: "환상적이군"
 TurkeyFocusEvents.214.t: "계속되는 카르바흐 분쟁.."
 TurkeyFocusEvents.214.d: "Unfortunately it seems the Karabakh dispute will continue to harm Azeri and Armenian relations, as both sides have failed to come to an agreement."
 TurkeyFocusEvents.214.a: "안됐군.."
 TurkeyFocusEvents.69420.t: "위기를 견뎌라"
 TurkeyFocusEvents.69420.d: "Our nation has seen it all, wars, conquest, humiliation, glory, and everything in between. The Dawn of the new Millennium is upon us, and the Turkish nation cannot afford to falter, we must adapt and adjust to the new times, otherwise our state may be swept by the winds of history. Our next presidential election is coming up shortly, and the victor will decide if we hold on to Ataturk's dream for a great Turkish Republic."
 TurkeyFocusEvents.69420.a: "이제 절대로 흔들려선 안된다!"
 TurkeyFocusEvents.22.t: "이스탄불의 정의개발당 (AKP) 시위!"
 TurkeyFocusEvents.22.d: "오늘 이스탄불에서 AKP에 대한 지지를 보여 주는 친AKP 집회가 열렸습니다. 이 시위의 참가자들은 AKP가 히즈메트와의 연립에서 갈라설 것도 요구하고 있었습니다."
 TurkeyFocusEvents.22.a: "귤렌주의자들은 기뻐하지 않을 것이다.."
 TurkeyFocusEvents.23.t: "Gülenist supporters gather at a mosque!"
 TurkeyFocusEvents.23.d: "귈렌주의 지지자들은 한 모스크에서 집회를 열고 AKP 정당과의 연립에서 거리를 둘 것을 당에 요구하고 있었습니다."
 TurkeyFocusEvents.23.a: "정의개발당 (AKP)에선 이를 좋게 보지 않을것이다.."
 TurkeyFocusEvents.24.t: "미덕당 (FP)과의 동맹?"
 TurkeyFocusEvents.24.d: "FP당은 우리가 정계에 진출하기 전에 금지되었으며, 그 당원들은 어디로 가지 않은 것으로 보입니다. 이들 대부분은 다른 강경 이슬람주의 단체인 \\"SP\\"로 옮겨 가입하기 시작했습니다. 일부 당원을 초청하여 우리와 함께 튀르키예 국가를 통치하자고 제안할 수도 있을 것입니다."
 TurkeyFocusEvents.24.a: "나쁘지 않은 생각이군.."
 TurkeyFocusEvents.24.b: "아닌 것 같다"
 TurkeyFocusEvents.25.t: "누구와 거래를 해야할까?"
 TurkeyFocusEvents.25.d: "튀르키예에 대한 잠재적 투자를 받아들이는 것이 우리에게 가장 이롭습니다. 이란 또는 사우디 기업에 우리 동부 지역에 와서 채굴 및 시추 목적으로 사업체를 설립하도록 요청할 수 있습니다."
 TurkeyFocusEvents.25.a: "사우디 원유 시추 기업을 초청하자"
 TurkeyFocusEvents.25.b: "이란 광업 기업을 초청하자"
 TurkeyFocusEvents.26.t: "코소보에 대한 우리의 지지"
 TurkeyFocusEvents.26.d: "현재 코소보를 점령하고 있는 정부에 대한 추가 조치를 취해야 할 것입니다. 자유를 추구하는 국가로서 우리의 신념을 다른 이들에게 전파하는 것이 우리의 의무이며, 그 때문에 점령자들을 제재하거나 코소보에 군사 사절단을 파견해야 합니다."
 TurkeyFocusEvents.26.a: "코소보에 군사적 임무를 진행하라"
 TurkeyFocusEvents.26.b: "제재하고, 더 제재하고, 끝까지 제재해라!"
 TurkeyFocusEvents.27.t: "사우디에 대한 반응"
 TurkeyFocusEvents.27.d: "사우디 정부는 우리가 집권하기 전에 AKP 정당의 압력으로 우리를 테러 조직으로 지정했습니다. 이러한 행동을 그냥 넘어가서는 안 됩니다. 누가 주도권을 쥐고 있는지 제대로 보여 줄 수 있도록 적절한 대응을 준비할 것입니다."
 TurkeyFocusEvents.27.a: "석유 노동자들을 후원하자. 그러면 파업을 일으킬지도 모른다"
 TurkeyFocusEvents.27.b: "친 민주적인 집단을 후원하여 불안을 야기하자"
 TurkeyFocusEvents.28.t: "쿠르디스탄 노동자당 (PKK) 일원의 송환을 요구하는 터키"
 TurkeyFocusEvents.28.d: "튀르키예 정부는 현재 스웨덴에서 피난처를 구하고 있는 쿠르드 PKK 당원들을 송환해 달라고 요청했습니다.. 튀르키예와의 관계를 개선하고 싶다면 이들을 보낼 수 있지만.. EU가 우리를 비난하면 상황이 우리에게 불리해지기 시작할 것입니다."
 TurkeyFocusEvents.28.a: "돌려보내라"
 TurkeyFocusEvents.28.b: "그러지 않는게 최선일 것이다"
 TurkeyFocusEvents.29.t: "쿠르디스탄 노동자당 (PKK) 인사들의 송환 요구를 받아들인 스웨덴 정부!"
 TurkeyFocusEvents.29.d: "스웨덴 정부는 현재 자국에서 피난처를 구하고 있는 PKK 당원들을 추방하는 데 동의했으며, 우리가 직접 이들을 처리할 수 있게 되었습니다."
 TurkeyFocusEvents.29.a: "좋아"
 TurkeyFocusEvents.30.t: "쿠르디스탄 노동자당 (PKK) 인사들의 송환 요구를 거절한 스웨덴 정부!"
 TurkeyFocusEvents.30.d: "스웨덴 정부는 현재 비호하고 있는 PKK 당원들의 송환을 거부했습니다. 우리는 이를 그냥 넘기지 않을 것입니다.."
 TurkeyFocusEvents.30.a: "그들은 후회하게 될 것이다!"
 TurkeyFocusEvents.31.t: "이란에 반란의 불씨를"
 TurkeyFocusEvents.31.d: "오늘 우리 수중에는.. 많은 총기가 있습니다. 그중 일부를 쿠제스탄의 반군에게 보내 이란의 석유 산업을 마비시킬 수 있습니다. 그러나 문제는 이들에게 실제로 얼마나 많은 지원을 제공하고 싶은지, 그리고 이들이 얼마나 큰 피해를 입히게 할 수 있느냐는 것입니다. "
 TurkeyFocusEvents.31.a: "과도하지는 않게끔 하자"
 TurkeyFocusEvents.31.b: "할 수 있는 전부를 지원하자"
 TurkeyFocusEvents.32.t: "터키의 관계 수립 희망"
 TurkeyFocusEvents.32.d: "튀르키예 정부는 관계를 수립할 의향이 있으며 우리에게 PKK 집단에 적대적인 태도를 취하지 말 것을 요청하고 있는데, 이는 꽤 무리한 요구입니다.."
 TurkeyFocusEvents.32.a: "좋다.."
 TurkeyFocusEvents.32.b: "안된다, 득보다 실이 너무 크다!"
 TurkeyFocusEvents.321.t: "적대적 입장을 유지하는 쿠르드군 (Peshmerga)"
 TurkeyFocusEvents.321.d: "페슈메르가는 관계를 바로잡기보다 우리에 대한 적대감을 유지하는 쪽을 택했습니다! 우리는 이를 잊지 않을 것이며 그들은 곧 후회하게 될 것입니다."
 TurkeyFocusEvents.321.a: "멍청이들!"
 TurkeyFocusEvents.322.t: "협력하는 쿠르드군 (Peshmerga)!"
 TurkeyFocusEvents.322.d: "놀랍게도 페슈메르가는 우리와 협력하기로 결정했으며 자치 지역임에도 불구하고 어느 정도 공식적인 관계를 수립했습니다."
 TurkeyFocusEvents.322.a: "아주 좋아"
 TurkeyFocusEvents.33.t: "쿠르드군 (Peshmerga)에 대한 입장"
 TurkeyFocusEvents.33.d: "페슈메르가는 우리 아나톨리아 쿠르디스탄 바로 아래에 위치한 또 다른 쿠르드 집단입니다. 이들은 PKK만큼 위협적이지만, 우리가 해결책을 찾기 위해 PKK와 협력하고 있는 지금은 그것이 가장 사소한 걱정입니다. 페슈메르가는 우리에게 엄청난 위협이 될 것이며, 너무 늦기 전에 이들을 처리해야 합니다."
 TurkeyFocusEvents.33.a: "작전을 시행할 것이다"
 TurkeyFocusEvents.33.b: "We'll do an operation, with the Iraqis"
 TurkeyFocusEvents.331.t: "Turkey offers joint operation against Peshmerga"
 TurkeyFocusEvents.331.d: "튀르키예 정부는 우리나라 북부의 페슈메르가를 처리하는 작전에 함께해 줄 것을 요청하고 있습니다."
 TurkeyFocusEvents.331.a: "물론이다!"
 TurkeyFocusEvents.331.b: "Absolutely not!"
 TurkeyFocusEvents.332.t: "이라크의 작전 합류 거부"
 TurkeyFocusEvents.332.d: "이라크는 페슈메르가와 싸우는 우리를 돕고 싶어 하지 않으며, 이는 우리가 모든 것을 혼자 해야 한다는 뜻일 뿐입니다."
 TurkeyFocusEvents.332.a: "오. 이런…"
 TurkeyFocusEvents.34.t: "디지털 시대의 터키"
 TurkeyFocusEvents.34.d: "월드 와이드 웹은 날마다 더욱 확장되고 있습니다. 이는 세계가 점점 더 연결됨에 따라 이러한 확장에 발맞춰야 한다는 뜻입니다. 우리 시민들은 다른 유럽 국가의 시민들과 다르지 않으며, 인터넷 기반시설을 확장함으로써 이를 우리 국민에게 증명해야 합니다. 문제는 어느 정도로 확장하느냐입니다."
 TurkeyFocusEvents.34.a: "제한적인 영역에서만 확장해라"
 TurkeyFocusEvents.34.b: "가능한 많이 넓게 확장해라"
 TurkeyFocusEvents.35.t: "터키-시리아 연방에 우리를 초대하는 터키"
 TurkeyFocusEvents.35.d: "시아파가 다수인 새로운 튀르키예 정부가 찾아와 양국 국민이 많은 유사점을 공유하고 있으므로 튀르키예-시리아 연합에 함께하자고 요청했습니다. 최근 그들은 하타이를 우리에게 돌려주기로 결정했으며 이는 훌륭한 조치였지만, 이제 그들은 우리를 자신들의 일부로 만들고 싶어 합니까?"
 TurkeyFocusEvents.35.a: "알겠다, 함께하겠다"
 TurkeyFocusEvents.35.b: "안된다"
 TurkeyFocusEvents.351.t: "합류하는 시리아"
 TurkeyFocusEvents.351.d: "시리아 정부는 양국 국민 사이의 유사점을 인식했으며 튀르키예-시리아 연합에 함께하기로 합의했습니다!"
 TurkeyFocusEvents.351.a: "마침내.."
 TurkeyFocusEvents.352.t: "합류를 거부한 시리아!"
 TurkeyFocusEvents.352.d: "시리아 정부는 어리석게도 함께 연합을 결성하자는 우리의 제안을 거절했습니다. 그들은 이 지역 시아파에게 무엇이 이로운지 분명히 모릅니다!"
 TurkeyFocusEvents.352.a: "젠장! 전쟁이다!"
 TurkeyFocusEvents.36.t: "자치주를 만든 웨일스외 스코틀랜드 마피아들!"
 TurkeyFocusEvents.36.d: "아나톨리아 신디케이트가 우리 코앞에서 스코틀랜드와 웨일스의 마피아를 지원하고 훈련시킨 것으로 보입니다. 우리는 이를 제때 알아채고 막지 못했으며, 이제 결정을 내려야 합니다.."
 TurkeyFocusEvents.36.a: "우리 왕국은 ‘하나’이다!"
 TurkeyFocusEvents.36.b: "그만한 가치가 없다"
 TurkeyFocusEvents.37.t: "호주 출신 집단에 대해 경계할 것을 당부하는 아나톨리아 연맹"
 TurkeyFocusEvents.37.d: "아나톨리아 신디케이트가 오스트레일리아의 공격이 임박했다고 우리에게 경고하고 있습니다. 그들이 마피아 국가임을 고려하면 이 모든 것이 거짓일 수도 있습니다. 하지만 거짓말이 아닐 가능성도 있습니다.."
 TurkeyFocusEvents.37.a: "거짓말은 아니겠지!"
 TurkeyFocusEvents.37.b: "아니다.. 당연히 거짓일거다"
 TurkeyFocusEvents.38.t: "이스라엘에 대항하여 함께 싸우기를 원하는 터키"
 TurkeyFocusEvents.38.d: "튀르키예는 우리 군이 동맹국들과 함께 이스라엘을 타도하는 데 힘을 보태 줄 것을 요청하고 있습니다. 이는 매우 놀라운 조치이지만, 최근 선거에서 이슬람주의자들이 튀르키예를 장악한 이후라면 예상 밖은 아닙니다."
 TurkeyFocusEvents.38.a: "기다려왔던 그날이군.."
 TurkeyFocusEvents.38.b: "아직은 때가 아니다."
 TurkeyFocusEvents.39.t: "이란의 수락"
 TurkeyFocusEvents.39.d: "이란은 우리 군이 이스라엘과 싸우는 것을 돕기로 합의했습니다. 이란은 자국의 동맹국들도 불러들일 것이며, 이는 우리 군에 큰 도움이 될 것입니다."
 TurkeyFocusEvents.39.a: "좋아"
 TurkeyFocusEvents.40.t: "이란의 거부"
 TurkeyFocusEvents.40.d: "충격적인 반전으로 이란은 우리가 이스라엘과 싸우는 것을 돕지 않기로 결정했습니다. 이란은 수십 년간 이스라엘의 몰락을 촉구해 왔기에 우리 외교관들은 매우 혼란스러워하고 있습니다..."
 TurkeyFocusEvents.40.a: "알겠다"
 TurkeyFocusEvents.381.t: "이스라엘 공격을 위해 군사 통행권을 요청하는 이란"
 TurkeyFocusEvents.381.d: "이란이 이스라엘과 싸우고 있으며 우리 땅을 이용해 공격하기를 원합니다. 이란은 우리의 동맹국이므로 이스라엘의 위협을 제거하기 위해 협력하는 것이 최선입니다."
 TurkeyFocusEvents.381.a: "이 순간만을 기다려왔지.."
 TurkeyFocusEvents.381.b: "안된다"
 TurkeyFocusEvents.81.t: "지중해 연합 (MTO)에 우리를 초대하는 터키"
 TurkeyFocusEvents.81.desc: "MTO, 즉 지중해 조약 기구는 최근 튀르키예가 창설했습니다. 튀르키예는 우리를 그들의 동맹에 초청하여 정회원이 되도록 하고 있습니다. 가입하면 이는 방어 조약이므로 우리의 안보는 다른 모든 회원국에 의해 보장될 것입니다."
 TurkeyFocusEvents.81.a: "그들이 하타이를 반환해준다면 수락하겠다"
 TurkeyFocusEvents.81.b: "안된다"
 TurkeyFocusEvents.41.t: "지중해 연합 (MTO)에 우리를 초대하는 터키"
 TurkeyFocusEvents.41.d: "MTO, 즉 지중해 조약 기구는 최근 튀르키예가 창설했습니다. 튀르키예는 우리를 그들의 동맹에 초청하여 정회원이 되도록 하고 있습니다. 가입하면 이는 방어 조약이므로 우리의 안보는 다른 모든 회원국에 의해 보장될 것입니다."
 TurkeyFocusEvents.41.a: "가입하는게 좋겠다"
 TurkeyFocusEvents.41.b: "안된다"
 TurkeyFocusEvents.411.t: "거부한 이라크"
 TurkeyFocusEvents.411.d: "이라크는 우리 동맹인 MTO에 가입하는 데 관심이 없는 것으로 보입니다."
 TurkeyFocusEvents.411.a: "알겠다"
 TurkeyFocusEvents.42.t: "지중해 연합 (MTO)에 우리를 초대하는 터키"
 TurkeyFocusEvents.42.d: "MTO, 즉 지중해 조약 기구는 최근 튀르키예가 창설했습니다. 튀르키예는 우리를 그들의 동맹에 초청하여 정회원이 되도록 하고 있습니다. 가입하면 이는 방어 조약이므로 우리의 안보는 다른 모든 회원국에 의해 보장될 것입니다."
 TurkeyFocusEvents.42.a: "가입하는게 좋겠다"
 TurkeyFocusEvents.42.b: "안된다"
 TurkeyFocusEvents.421.t: "거부한 이집트"
 TurkeyFocusEvents.421.d: "이집트는 MTO 가입에 대한 우리의 초청을 거절했습니다."
 TurkeyFocusEvents.421.a: "알겠다"
 TurkeyFocusEvents.43.t: "이슬람의 안녕을 위한 연방 (CIW)으로 우리를 초대하는 터키"
 TurkeyFocusEvents.43.d: "튀르키예 정부는 최근 이슬람 복지 연합(CIW)을 창설했습니다. 주된 목표는 이슬람 국가들 사이의 협력을 늘리고 이 지역 무슬림의 복지를 향상시키는 것입니다."
 TurkeyFocusEvents.43.a: "가입하자"
 TurkeyFocusEvents.43.b: "안된다"
 TurkeyFocusEvents.44.t: "우리 기반시설에 투자하는 CIW!"
 TurkeyFocusEvents.44.d: "CIW는 우리 국민을 위한 적절한 기반시설과 시설을 건설할 수 있는 우리나라의 역량에 투자하고 있습니다."
 TurkeyFocusEvents.44.a: "좋아"
 TurkeyFocusEvents.45.t: "긴급 구호품을 제공하는 CIW"
 TurkeyFocusEvents.45.d: "CIW는 기구 내에서 발생하거나 진행 중인 모든 재난에 대비하여 긴급 구호 물자를 지급했습니다."
 TurkeyFocusEvents.45.a: "좋아"
 TurkeyFocusEvents.46.t: "우리 교육에 투자하는 CIW!"
 TurkeyFocusEvents.46.d: "CIW는 우리나라의 교육 부문에 투자하여 사람들이 학교에 다니기 더 쉽게 만들었습니다."
 TurkeyFocusEvents.46.a: "좋아"
 TurkeyFocusEvents.47.t: "우리 의료 체계에 투자하는 CIW!"
 TurkeyFocusEvents.47.d: "CIW는 이제 우리나라의 의료 제도에 투자하여 더 많은 사람에게 의료 물자와 시설을 제공하고 있습니다."
 TurkeyFocusEvents.47.a: "좋아"
 TurkeyFocusEvents.48.t: "우리 산업에 투자하는 CIW!"
 TurkeyFocusEvents.48.d: "CIW는 이제 우리나라의 산업 부문에 투자하고 있으며, 이로써 우리 공장들이 더 많은 물자를 공급할 수 있습니다."
 TurkeyFocusEvents.48.a: "좋아"
 TurkeyFocusEvents.49.t: "CIW를 떠나는 [FROM.GetName]"
 TurkeyFocusEvents.49.d: "[FROM.GetName]은(는) CIW에서 탈퇴하는 것이 자국에 최선이라고 결정했습니다."
 TurkeyFocusEvents.49.a: "결국엔 후회할거다"
 TurkeyFocusEvents.50.t: "터키의 군사기지 건설 희망"
 TurkeyFocusEvents.50.d: "튀르키예 정부는 우리나라에 그들의 병력을 주둔시키도록 허용해 달라고 요청하고 있습니다."
 TurkeyFocusEvents.50.a: "안될거 있나"
 TurkeyFocusEvents.50.b: "안된다"
 TurkeyFocusEvents.501.t: "우리 요청을 거부한 카타르"
 TurkeyFocusEvents.501.d: "카타르는 우리 병력이 자국 영토에 주둔하는 것을 허용하지 않고 있습니다."
 TurkeyFocusEvents.501.a: "유감이군"
 TurkeyFocusEvents.53.t: "오스만 5세의 서거"
 TurkeyFocusEvents.53.d: "오늘 콘스탄티니예 전역에 끔찍한 소식이 퍼졌습니다. 사람들이 오스만 5세의 서거를 알게 되었기 때문입니다. 그의 죽음은 국민에게 큰 슬픔을 가져다주었지만, 바예지드 3세가 그의 유산을 반드시 이어 갈 것입니다."
 TurkeyFocusEvents.53.a: "왕관이 저무는구나"
 TurkeyFocusEvents.54.t: "바예지드 3세의 서거"
 TurkeyFocusEvents.54.d: "안타깝게도 오늘 우리는 바예지드 3세의 서거 소식을 접했습니다. 사람들은 거리에서 그의 죽음을 애도하고 있으며 슬픔이 나라를 휩쓸었습니다. 그러나 모든 희망이 사라진 것은 아닙니다. 국가 애도 기간이 끝난 직후 뒨다르 1세가 즉위하여 그의 통치가 시작될 것이기 때문입니다."
 TurkeyFocusEvents.54.a: "또 한번 왕관이 저무는구나.."
 TurkeyFocusEvents.55.t: "헤자즈를 요구하는 아나톨리아 칼리파국"
 TurkeyFocusEvents.55.d: "아나톨리아 칼리파국이 찾아와 우리에게 헤자즈를 넘기라고 요구했습니다. 헤자즈는 틀림없이 우리의 가장 중요한 주입니다. 이 주를 내주는 것은 엄청나게 어리석은 일이며, 솔직히 말해 우리가 거절하면 그들이 무엇을 할지도 알 수 없습니다."
 TurkeyFocusEvents.55.a: "이딴 요구를 하다니?"
 TurkeyFocusEvents.55.b: "그래도.. 갈등을 피하는게 좋겠지?"
 TurkeyFocusEvents.56.t: "순응하는 [SAU.GetName]"
 TurkeyFocusEvents.56.d: "[SAU.GetName]은(는) 우리의 요구에 굴복했습니다. 우리는 헤자즈를 넘겨받을 것이며, 그 대가로 그들을 공격하지 않을 것입니다."
 TurkeyFocusEvents.56.a: "좋아"
 TurkeyFocusEvents.57.t: "[SAU.GetName]의 요구 거부!"
 TurkeyFocusEvents.57.d: "[SAU.GetName]은(는) 어리석게도 우리의 요구를 거절했으며, 그 때문에 우리에게는 다른 선택지가 없습니다!"
 TurkeyFocusEvents.57.a: "저들은 당해도 싸다"
 TurkeyFocusEvents.58.t: "압둘 라만 무스타파에 대항"
 TurkeyFocusEvents.58.d: "이라크는 미국이 이라크와 적극적으로 분쟁을 벌여 안보가 마비되면서 현재 가장 취약한 상태입니다. 이는 우리가 진입하여 이라크령 쿠르디스탄의 주요 도시인 키르쿠크의 총독을 제거할 절호의 기회를 줍니다. 성공한다면 쿠르드인의 사기를, 나아가 PKK의 사기를 심각하게 떨어뜨릴 수 있을 것입니다."
 TurkeyFocusEvents.58.a: "시민으로 변장한 소수의 요원들을 투입하라"
 TurkeyFocusEvents.58.b: "숙련된 요원들을 보내고, 그 귀한 작전 또한 준비해라"
 TurkeyFocusEvents.58.c: "Let's just forget about this plan entirely."
 TurkeyFocusEvents.59.t: "압둘 무스타파의 죽음"
 TurkeyFocusEvents.59.d: "우리 요원들은 키르쿠크 총독 압둘 라흐만 무스타파를 성공적으로 암살했습니다."
 TurkeyFocusEvents.59.a: "좋아"
 TurkeyFocusEvents.60.t: "우리 요원들을 붙잡은 미국!"
 TurkeyFocusEvents.60.d: "오늘 일찍 미국 제173공수여단 병사들이 쿠르드 도시 술라이마니야에 있던 우리 요원들의 은신처 문을 박차고 들어와 그들을 구금했습니다. 언론은 이를 \\"후드 사건\\"이라고 명명했으며, 미국과의 관계는 부정적인 영향을 받았습니다.."
 TurkeyFocusEvents.60.a: "Damn"
 Turkish_mafia.1.t: "소란을 일으킨 마피아!"
 Turkish_mafia.1.d: "마피아가 우리의 큰 도시 한 곳에서 소동을 일으켜 몇 명이 사망했습니다. 이 범죄를 누가 저질렀는지는 현재 알려지지 않았지만, 우리 경찰은 위험을 무릅쓰고라도 그들을 추적하고 싶어 합니다."
 Turkish_mafia.1.a: "더 문제를 악화시켜선 안될것이다.."
 Turkish_mafia.1.b: "전면적인 조사를 진행해라, 당장!"
 Turkish_mafia.1.c: "가용할 수 있는 모든 자원을 동원하라"
 Turkish_mafia.11.t: "성공적이지 못한 경찰 조사"
 Turkish_mafia.11.d: "우리 경찰은 며칠 전 저질러진 범죄의 책임이 있는 폭력배들을 찾는 데 실패했습니다. 이로 인해 일부 폭력배들은 자신들이 건드릴 수 없는 존재라고 믿게 되었고, 따라서 이 나라에서 마피아의 영향력이 커졌습니다."
 Turkish_mafia.11.a: "Such incompetence..."
 Turkish_mafia.12.t: "용의자를 체포한 경찰"
 Turkish_mafia.12.d: "경찰청장이 며칠 전 저질러진 일련의 살인 사건과 관련하여 여러 범죄자와 용의자를 체포했다고 최근 발표하면서 오늘 지역 주민들은 안도의 한숨을 내쉬었습니다. 마피아와 연계된 여러 인물이 이제 우리 경찰의 효율성을 알게 되었으며, 이는 다른 사람들이 마피아에 가담하기 전에 두 번 생각하게 만들 것입니다."
 Turkish_mafia.12.a: "아주 좋아"
 Turkish_mafia.2.t: "마피아 근거지를 색출한 사설 탐정"
 Turkish_mafia.2.d: "한 지방 도시의 형사가 잠재적인 마피아 은신처를 발견했다고 보고했습니다. 경찰은 그 은신처에 무엇이 있을지, 아니면 정말 마피아의 은신처가 맞는지조차 알지 못해 대응을 서둘러 마련하려 하고 있습니다. 마피아가 그 장소와 연관되어 있을 가능성이 매우 높지만, 그럼에도 위험은 항상 따르기 마련입니다."
 Turkish_mafia.2.a: "명백히 근거지라는 것이 확인되기 전까진 일단 물러서자.."
 Turkish_mafia.2.b: "What do you mean they're scrambling a response? Prepare one, and do it quickly!"
 Turkish_mafia.2.c: "가용할 수 있는 모든 자원을 동원하라"
 Turkish_mafia.21.t: "경찰 측의 사상자 발생!"
 Turkish_mafia.21.d: "은신처는 매복이었던 것으로 보이며, 우리 경찰관들을 향해 총격을 가할 준비를 한 무장 괴한이 여럿 있었습니다. 안타깝게도 무기와 충분한 지원이 부족하여 여러 경찰관이 사망하고 더 많은 이들이 부상을 입었습니다.."
 Turkish_mafia.21.a: "젠장"
 Turkish_mafia.22.t: "안전하게 소탕된 근거지"
 Turkish_mafia.22.d: "최근 작전에서 모든 것이 완벽하게 진행되었습니다. 은신처는 우리 부대에 의해 신속하게 소탕되었고, 기습당한 여러 용의자는 우리 경찰관들에게 신속히 체포되었습니다."
 Turkish_mafia.22.a: "훌륭해"
 Turkish_mafia.3.t: "대규모 무기 보관함의 발견"
 Turkish_mafia.3.d: "진행 중인 수색 도중 경찰이 창고에 보관된 대규모 무기 은닉처를 발견했습니다. 지역 사회의 여러 사람이 경찰에게 이 무기 은닉처의 출처를 추적하고 관련자들을 체포할 것을 촉구하고 있습니다."
 Turkish_mafia.3.a: "그냥 우리가 이를 압수하고 마무리하는 건 어떨까?"
 Turkish_mafia.3.b: "Good idea, start a search immediately!"
 Turkish_mafia.3.c: "가용할 수 있는 모든 자원을 동원하라"
 Turkish_mafia.31.t: "조사를 망친 경찰!"
 Turkish_mafia.31.d: "조율 부족과 높은 수준의 무능함으로 인해 우리 경찰은 무기 은닉처를 남긴 범죄자들을 찾지 못했습니다. 심지어 수사 도중 우리 경찰은 자신들의 무기를 상당량 잃어버렸습니다! 어떻게 이런 일이 일어날 수 있느냐고 물으실 수도 있습니다. 우리 경찰관들이 무기를 가득 실은 보급 밴을 끌고 들어갔는데 누군가 그 밴을 탈취해 달아났기 때문입니다!"
 Turkish_mafia.31.a: "진심이야?"
 Turkish_mafia.32.t: "용의자를 특정한 경찰"
 Turkish_mafia.32.d: "더 도시화된 도시 중 한 곳에서 지하 무기 거래가 벌어지고 있었던 것으로 보입니다. 다행히 큰 피해가 생기기 전에 이 범죄자들을 붙잡을 수 있었습니다."
 Turkish_mafia.32.a: "이래야 경찰이지"
 Turkish_mafia.4.t: "마약 화물을 장악한 경찰"
 Turkish_mafia.4.d: "한 무리의 경찰관들이 수상한 화물 컨테이너를 우연히 발견했으며, 컨테이너를 열자 그들은 경악했습니다. 다량의 불법 마약이 알려지지 않은 조직망을 통해 국내로 밀반입되었으며, 지역 주민들은 용의자를 잡고 싶어 합니다."
 Turkish_mafia.4.a: "음.. 그저 의료 목적으로 들어온 걸꺼야, 그치?"
 Turkish_mafia.4.b: "I want an investigation immediately!"
 Turkish_mafia.4.c: "가용할 수 있는 모든 자원을 동원하라"
 Turkish_mafia.41.t: "용의자 구금"
 Turkish_mafia.41.d: "우리는 대규모 마약 컨테이너와 연결된 여러 인물을 찾아냈으며, 그들은 현재 경찰의 조사를 받고 있습니다. 지역 사회의 많은 이들은 불법 마약이 자신들의 공동체를 괴롭히지 않을 것임을 알고 기뻐하고 있습니다."
 Turkish_mafia.41.a: "아직 할일이 많이 남았다! 자리로 돌아가라!"
 Turkish_mafia.42.t: "Investigation results in nothing"
 Turkish_mafia.42.d: "오랜 수사 끝에 우리 경찰관들은 마약 컨테이너와 연관된 사람을 한 명도 찾아내지 못했습니다. 이는 우리 측에 큰 손실이며, 불법 마약이 여전히 국내로 밀반입되고 있는데 우리에게는 단서가 없습니다!"
 Turkish_mafia.42.a: "믿을 수 없군"
 Turkish_mafia.5.t: "Mafia assassinates high ranking official"
 Turkish_mafia.5.d: "튀르키예 마피아가 고위 관리를 암살하면서 비극이 닥쳤습니다. 이는 우리 정당의 일을 필요 이상으로 훨씬 어렵게 만들 것이며, 야당은 흥분에 휩싸여 있을 가능성이 높습니다.."
 Turkish_mafia.5.a: "젠장"
 Turkish_mafia.6.t: "강도를 저지른 마피아"
 Turkish_mafia.6.d: "마피아가 우리나라의 은행 한 곳에서 강도 사건을 벌였습니다. 그들은 막대한 돈을 훔쳐 갔으며 결국 우리 경제와 국민에게 피해를 입혔습니다."
 Turkish_mafia.6.a: "믿을 수 없군"
 Turkish_mafia.7.t: "상업 지구에서 폭발 발생"
 Turkish_mafia.7.d: "경찰이 대형 상업 중심지에서 일어난 폭탄 테러의 배후에 마피아가 있다고 의심하면서 오늘 마피아에게 손가락질이 쏠리고 있습니다. 그들의 목적은 알려지지 않았지만, 한 가지 확실한 것은 그들이 정부에 많은 문제를 일으키고 있다는 점입니다.."
 Turkish_mafia.7.a: "도대체 왜?"
 Turkish_mafia.8.t: "마피아와의 교전에 휘말린 경찰"
 Turkish_mafia.8.d: "오늘 아침 우리 경찰과 마피아 사이에 매우 긴 대치가 있었습니다. 여러 경찰관이 부상당했으며 일부는 사망하기까지 했습니다."
 Turkish_mafia.8.a: "끔찍하군!"
 Turkish_mafia.9.t: "마피아의 성장"
 Turkish_mafia.9.d: "마피아는 최근 공격을 강화해 왔으며, 솔직히 말해 우리 보안군을 지치게 만들었습니다. 사람들이 마피아에 가담하고 있으며 범죄의 삶이 그 어느 때보다 만연한 지금, 우리 국가의 타당성에 의문이 듭니다. 많은 사람이 우리 정부가 물러나라고 요구하고 있지만, 우리는 국민을 섬기고 보호할 의무가 있습니다.."
 Turkish_mafia.9.a: "싸움은 절대 끝나지 않을 것이다!"
 Turkish_mafia.9.b: "그들이 옳을지도 몰라.."
 Turkish_parties.1.t: "주목을 받는 자유주의 정당"
 Turkish_parties.1.d: "자유주의 정당들이 이전보다 더 많은 지지를 얻기 시작하면서 우리 국민의 이념이 점점 더 자유주의적으로 변하고 있는 것으로 보입니다. 그 결과 사람들은 우리나라에서 더 자유주의적인 정책을 요구하고 있습니다."
 Turkish_parties.1.a: "알겠다"
 Turkish_parties.2.t: "주목을 받는 보수주의 정당"
 Turkish_parties.2.d: "보수 정당들이 이전보다 더 많은 지지를 얻기 시작하면서 우리 국민의 이념이 점점 더 보수적으로 변하고 있는 것으로 보입니다. 그 결과 사람들은 우리나라에서 더 보수적인 정책을 요구하고 있습니다."
 Turkish_parties.2.a: "알겠다"
 Turkish_parties.3.t: "주목을 받는 좌익 정당"
 Turkish_parties.3.d: "좌익 정당들이 이전보다 더 많은 지지를 얻기 시작하면서 우리 국민의 이념이 점점 더 좌경화되고 있는 것으로 보입니다. 그 결과 사람들은 우리나라에서 더 사회주의적인 정책을 요구하고 있습니다."
 Turkish_parties.3.a: "알겠다"
 Turkish_parties.4.t: "주목을 받는 우익 정당"
 Turkish_parties.4.d: "우익 정당들이 이전보다 더 많은 지지를 얻기 시작하면서 우리 국민의 이념이 점점 더 민족주의적으로 변하고 있는 것으로 보입니다. 그 결과 사람들은 우리나라에서 더 민족주의적인 정책을 요구하고 있습니다."
 Turkish_parties.4.a: "알겠다"
 Turkish_parties.9.t: "극단적으로 변화하는 정치계"
 Turkish_parties.9.d: "우리 국가의 정부에 급격하고 근본적인 변화가 일어나 정치 구조가 완전히 재편되었습니다."
 Turkish_parties.9.a: "알겠다"
 Turkish_parties.10.t: "(이 텍스트는 오직 AI에게만 보여집니다)"
 Turkish_parties.10.d: "AI를 위하여"
 Turkish_parties.10.a: "이것을 보고 있다면, 기대하거라 :)"
 TUR_bulent_ecevit_desc: "뷜렌트 예지비트는 1950년대부터 튀르키예 정계에서 활동해 온 원로 정치인입니다. CHP에서 지도자의 자리에 올라 결국 1972년 이스메트 이뇌뉘의 뒤를 이어 CHP 당수가 되었고 1974년에 총리가 되었습니다. 그의 정부는 1974년 키프로스 침공을 명령했으며, 이로 인해 '키프로스의 정복자'('크브르스 파티히')라는 별명을 얻었습니다. 1980년 군사 쿠데타 이후 예지비트는 투옥되고 정치 활동이 금지되었으나, 1987년 아내 라흐산으로부터 DSP 당수 자리를 넘겨받아 다시 정계에 복귀했습니다. 마침내 1999년, PKK 지도자 압둘라 오잘란이 체포되면서 그의 당의 인기가 치솟은 후 그는 튀르키예 총리직을 되찾았습니다.\n\n예지비트는 또한 열성적인 시인이자 작가로, 두 분야에서 많은 책을 저술했고 많은 시를 튀르키예어로 번역했습니다.\n\n예지비트는 대학 학위를 마치지 못했으며, 이로 인해 대통령 선거에 출마하는 것은 불가능합니다."
 TUR_zeki_sezer_desc: "제키 세제르는 예지비트 정부의 전직 국무장관입니다."
 TUR_husamettin_ozkan_desc: "휘사메틴 외즈칸은 뷜렌트 에제비트 정부의 부총리이며, 또한 이전에 국무성장관으로도 역임하였습니다. 외즈칸은 체르케스 민족의 후손이며, 그리고 그의 형인 네지데트 또한 이스탄불 지구의 시장을 역임하였습니다."
 TUR_fethullah_gulen_desc: "페툴라흐 귈렌은 히즈메트, 즉 귈렌 운동의 지도자입니다. 한때 튀르키예의 지역 이맘이었던 귈렌은 영향력 있는 학자가 되었습니다. 그의 조직은 전 세계에 걸쳐 있으며 매우 분권화된 방식으로 운영됩니다. 귈렌 자신은 스스로를 그다지 지도자로 여기지 않으며, 그의 말에 따르면 그는 단지 '내가 믿는 바를 말했을 뿐이다. 그것이 이치에 맞았기에 사람들이 스스로 이해한 것이다'라고 합니다."
 TUR_deniz_baykal_desc: "데니즈 바이칼은 1973년 CHP 소속 최연소 국회의원으로 튀르키예 의회에 선출되면서 정치 경력을 시작했습니다. CHP는 바이칼이 CHP가 1965년 선거에서 패배한 이유를 주제로 부교수 논문을 썼을 때 처음 그를 주목했습니다. 1980년 군사 쿠데타 이후 바이칼은 잠시 투옥되고 정치 활동이 금지되었으나 1987년 정계 복귀를 허가받아 사회민주 인민당에 합류했습니다.\n\n1992년 이전에 해체된 정당의 재창당을 금지하던 법률이 폐지되었고, 바이칼은 (다른 많은 전직 CHP 정치인들과 함께) CHP를 재창당했습니다.\n\n흔히 CHP의 '구세대'로 묘사되는 바이칼은 그의 많은 정책이 현대 튀르키예와 맞지 않아 CHP의 부진에 책임이 있다는 비난을 많이 받았습니다."
 TUR_Kemal_Kilicdaroglu_desc: "케말 크르츠다로을루는 스캔들로 데니즈 바이칼이 직위에서 사임하게 된 후 CHP의 당수로 선출되었습니다. 크르츠다로을루는 AKP에 적극적으로 도전해 왔으며 그 당 정치인들의 부패를 폭로하겠다고 적극적으로 다짐했습니다. 크르츠다로을루는 또한 CHP를 좌파 지향의 뿌리로 되돌리는 것을 목표로 해 왔습니다. 그러나 크르츠다로을루의 행동은 항상 그의 말과 일치하지는 않아서, 그가 회색 늑대 깃발을 흔드는 모습이 목격되었으며 모든 시리아 난민의 추방을 지지합니다."
 TUR_Ufuk_Uras_desc: "우푸크 우라스는 경제학자이자 이스탄불 대학교 졸업생입니다. 우라스는 1996년부터 ÖDP의 당수를 맡아 왔습니다."
 TUR_abdullah_levent_tuzel_desc: "압둘라 튀젤은 1996년 EMEP의 창립 당원 중 한 명이었으며 그 이후 줄곧 당을 이끌어 왔습니다. 정치에 입문하기 전에 튀젤은 프리랜서 변호사로 일했습니다. 그는 또한 이스탄불 인권 재단 이사회 구성원이자 이스탄불 현대 법률가 협회 회장을 지냈습니다."
 TUR_dogu_perincek_desc: "도우 페린체크는 노동자당 IP의 창당자이며 직업은 변호사입니다. 페린체크는 반서방적 태도와 마오주의가 결합된 강경한 케말주의 사상으로 알려져 있습니다. 그는 또한 아르메니아 집단 학살의 존재를 열렬히 부인하며, 집단 학살의 주범으로 의심되는 인물의 이름을 딴 단체인 탈라트 파샤 위원회의 일원입니다.\n\n페린체크는 중동에서 미국 제국주의에 맞서는 대항 세력을 만들고자 합니다."
 TUR_Necmeddin_Erbakan_desc: "네즈메틴 에르바칸은 그의 정당의 토대를 이루는 밀리 괴뤼쉬(국가 비전) 종교-정치 운동의 창시자입니다. 에르바칸은 튀르키예의 여러 이슬람주의 정당의 오랜 지도자였으며, 그중 대부분은 창당 직후 금지되었습니다. 에르바칸은 군에 의해 강제로 물러나기 전까지 잠시 총리를 지내기도 했습니다.\n\n에르바칸의 주된 정책은 보수적 이슬람이며, 유럽 국가에 초점을 두던 것에서 다른 무슬림 국가들과의 협력을 늘리는 쪽으로 중점을 옮기고자 하고, 심지어 중동에서 NATO에 맞서는 기구와 디나르라는 공통 통화를 만들려는 데까지 나아갑니다.\n\n2000년대 초 에르바칸은 횡령 혐의로 유죄 선고를 받아 2년 남짓 투옥되었습니다. 이른바 '사라진 1조 사건'은 그의 이전 정당인 복지당이 1997년 정당이 금지된 후 자금을 반환하지 않기 위해, 국가 지원 정당 자금 튀르키예 리라 1조가 정당 활동에 사용되었다고 주장하는 문서를 위조하면서 불거졌습니다."
 anti_imperialist_vanguard_faction: "반제국주의 선봉대"
 TUR_northern_cyprus_annexed: "북키프로스의 합병"
 TUR_afrin: "시리아에서 반 쿠르디스탄 작전 선언"
 TUR_afrin_desc: "쿠르드 테러리스트들은 여러 이름으로 불리지만, 그렇다고 이들이 같은 이념을 공유하지 않는 것은 아닙니다. PKK는 언제나 튀르키예에 대한 위협이었으며, YPG, PYD, SDF 등 동맹 세력과 함께 파괴될 때까지 위협으로 남을 것입니다. 시작은 아프린입니다. 병력을 집결시키십시오."
 TUR_afrin2: "‘올리브 가지 (Olive Branch)’ 작전 개시"
 TUR_afrin2_desc: "If the Kurds cannot learn to accept their failure and defeat, they will continue to attack Turkey and its people, and this is where we must draw the line. Olive Branch will put an end to Kurdish terror attacks originating from the YPG held territory of Afrin. The operation is determined to root out and destroy Kurdish terrorists without collateral damage, we must proceed carefully."
 TUR_afrin_d: "터키군의 아프린 위협"
 TUR_afrin_d_desc: "튀르키예의 쿠르드 민족 공세가 계속되고 있습니다. 아프린 침공의 위협은 현실입니다. 튀르키예 대통령 [their_country.GetLeader]은(는) 예상대로 우리를 PKK와 결탁한 테러리스트로 규정하였으며, 우리가 터무니없는 테러 공격으로 튀르키예 영토를 공격하기 전에 목을 조르겠다고 위협하였습니다. 이것은 우리의 방식이 아니지만, 즉시 공격에 대비해야 합니다!"
 TUR_afrin_d2: "멈추지 않는 터키군"
 TUR_afrin_d2_desc: "그들은 이것을 \\"올리브 가지 작전\\"이라 부르지만, 올리브 가지가 평화의 제안이라는 속담을 생각하면 우스운 일입니다. 튀르키예인들은 평화의 의미를 모르며, 쿠르드인에 대한 억압 작전은 엉뚱한 상대를 향해 계속되고 있습니다. 그러나 그들이 이 싸움을 계속하겠다면 우리도 계속해서 스스로를 방어할 것입니다."
 TUR_counter_terrorism_mil: "대테러 작전 - 군사 부문"
 strenghten_outposts_1: "전초 기지 강화"
 strenghten_outposts_1_desc: "우리나라 남동부의 초소들은 1960년대 무렵 북부 이라크와의 밀수를 막기 위해 세워진 것입니다. 이제 테러 공격에 직면한 상황에서 이들은 너무 낡았거나 잘못된 위치에 있어 비대칭 공격에 매우 취약합니다. 해결책을 마련해야 합니다. 많은 비용이 들 수 있으나 구할 수 있는 생명으로 보답받을 것입니다. 야당은 늘 그랬듯이 이 개혁이 이익 없이 돈만 낭비한다며 신뢰를 깎으려 할 것이므로 실패할 여지는 거의 없습니다."
 strenghten_outposts_2: "굳건한 전초 기지의 시작"
 strenghten_outposts_2_desc: "정치적인 이유로 새 초소 가운데 첫 번째는 단기간에 효과를 입증해야 합니다. 높고 전망이 좋은 지점, 가급적 테러리스트들이 침투에 이용해 온 좁은 길목 주변에 건설하는 것이 좋을 것입니다."
 strenghten_outposts_3: "중대한 문제 부터"
 strenghten_outposts_3_desc: "악튀튄 초소와 같은 일부 초소는 전략적 이유로 정기적으로 습격을 받는 것으로 악명이 높습니다. 이러한 취약 거점부터 개선하면 테러리스트들은 새로운 계획을 세워야 할 것입니다."
 strenghten_outposts_4: "추가적인 개선"
 strenghten_outposts_4_desc: "새 초소들은 테러 공격을 격퇴하거나 애초에 공격받지 않도록 하는 데 충분하다는 것이 입증되었으며, 이제 테러리스트들은 튼튼한 초소를 피하고 오래되고 약한 초소에 집중하고 있습니다. 불필요한 초소는 해체하고 필요한 위치에 완전히 새로운 초소를 건설해야 할 것입니다."
 strenghten_outposts_5: "전략적 우수함"
 strenghten_outposts_5_desc: "초소에 대한 공격이 상당히 줄어들었으니, 호수로 테러리스트의 이동로를 가로막고 이 댐들을 요새화된 교량으로 활용할 새 댐을 건설하는 방안을 생각해 볼 수 있습니다."
 strenghten_outposts_6: "성공에는 늘 준비가 따른다"
 strenghten_outposts_6_desc: "거의 모든 초소가 재건되었거나 폐기되어 철거되었습니다. 이제 몇 가지 거친 부분을 다듬는 마무리 단계만 남았습니다."
 doing_counter_terror_op_mil: "또 다른 군사 작전의 개시"
 doing_ext_sec: "이미 해협 간 작전을 진행 중임"
 doing_int_sec: "이미 치안 개혁을 진행 중임"
 airstrike_prepare: "공습 준비"
 airstrike_thingy: "공습 개시"
 add_power_to_pkk: "PKK에 권력 추가 (디버깅 목적)"
 add_power_to_pkk_desc: "PKK에 권력 추가"
 internal_preparation_1: "국내 작전을 위한 적정 수준의 대비"
 internal_preparation_1_desc: "가장 빠르고 저렴한 방법입니다. 이것을 선택하면 실제 공세의 성공률은 %40가 됩니다. 비용 효율 면에서는 이쪽이 더 낫습니다.\n\n§R하나의 작전 유형에 대해 여러 준비를 할 수는 없습니다!§!"
 internal_preparation_2: "국내 작전을 위한 준수한 대비"
 internal_preparation_2_desc: "보통의 방법입니다. 이것을 선택하면 실제 공세의 성공률은 %50가 됩니다.\n\n§R하나의 작전 유형에 대해 여러 준비를 할 수는 없습니다!§!"
 internal_preparation_3: "치안 작전을 위한 체계적인 대비"
 internal_preparation_3_desc: "가장 느리고 비용이 많이 드는 방법입니다. 이것을 선택하면 실제 공세의 성공률은 %60가 됩니다. 비용 효율은 떨어지지만 더 확실한 결과를 보장합니다.\n\n§R하나의 작전 유형에 대해 여러 준비를 할 수는 없습니다!§!"
 internal_security: "국내 작전"
 internal_security_desc: "우리나라 동부는 지형이 험준하며, 버려진 마을과 동굴로 가득한 성채 같은 자연 계곡, 아무도 살지 않는 산악 지대의 좁은 통로가 많습니다. 이러한 특징은 반란 세력에게 매우 유용하며 PKK도 이를 이용하고 있습니다. 이들의 세력을 약화하고 병력 모집 활동을 방해하려면 임시 기지를 끊임없이 공격하고 파괴해야 합니다.\n\n국경 간 작전과 국내 작전을 동시에 수행할 수는 없습니다."
 external_preparation_1: "대외 작전을 위한 적정 수준의 대비"
 external_preparation_1_desc: "가장 빠르고 저렴한 방법입니다. 이것을 선택하면 실제 공세의 성공률은 %40가 됩니다. 비용 효율 면에서는 이쪽이 더 낫습니다.\n\n§R하나의 작전 유형에 대해 여러 준비를 할 수는 없습니다!§!"
 external_preparation_2: "대외 작전을 위한 준수한 대비"
 external_preparation_2_desc: "보통의 방법입니다. 이것을 선택하면 실제 공세의 성공률은 %50가 됩니다.\n\n§R하나의 작전 유형에 대해 여러 준비를 할 수는 없습니다!§!"
 external_preparation_3: "대외 작전을 위한 체계적인 대비"
 external_preparation_3_desc: "가장 느리고 비용이 많이 드는 방법입니다. 이것을 선택하면 실제 공세의 성공률은 %60가 됩니다. 비용 효율은 떨어지지만 더 확실한 결과를 보장합니다.\n\n§R하나의 작전 유형에 대해 여러 준비를 할 수는 없습니다!§!"
 external_security: "해협 간 작전"
 external_security_desc: "PKK는 우리 국경 안에만 존재하는 것이 아닙니다. 상당수의 조직원이 북부 이라크에도 기지를 두고 있는데, 이는 같은 험준한 지형을 이용하고, 우리 군사력으로부터 어느 정도 안전을 확보하며, 밀수를 통제하고 병력을 모집하기 위함입니다. 외국 세력의 비난을 받을 수 있겠지만 이러한 거점들도 공격해야 합니다.\n\n국경 간 작전과 국내 작전을 동시에 수행할 수는 없습니다."
 prepping_ext: "이미 해협 간 작전을 계획 중임"
 prepping_int: "이미 내부 개혁을 준비 중임"
 collapse_mil_branch: "군사 작전 결정 숨기기"
 expand_mil_branch: "군사 작전 결정 보기"
 collapse_civ_branch: "민간 개혁 결정 숨기기"
 expand_civ_branch: "민간 개혁 결정 보기"
 TUR_counter_terrorism_civ: "대테러 작전 - 민간 부문"
 college_professors: "대학 교수들과의 협상"
 college_professors_desc: "우리는 싸움을 치르고 있는데, 계몽되었다고 여겨지는 이자들은 테러 공격이 일어날 때마다 상황에 불평하며 정부의 퇴진을 요구하고, 우리가 PKK에 대응하려 할 때마다 이를 학살이니 외국인 혐오니 하며 몰아세웁니다. 이는 중단되어야 합니다. 이들을 숙청하거나, 최소한 더는 근거 없는 주장으로 우리의 행동을 폄훼하지 못하도록 조치할 것입니다."
 kurdish_language_1: "쿠르드 언어 문제"
 kurdish_language_1_desc: "수년 동안 쿠르드어를 금하는 불문율이 존재했습니다. 쿠르드어로 된 텔레비전 채널과 대학을 여는 것이 금지되었을 뿐만 아니라, 공공장소나 거리에서 쿠르드어로 말하기만 해도 말로 공격당할 수 있습니다. 그런데 우리 인구의 거의 20퍼센트가 쿠르드어를 모국어로 사용합니다. 이 문제를 해결해야 합니다.\n\n추가 개혁을 위한 두 번째 결정을 해금합니다."
 kurdish_language_2: "차별의 끝"
 kurdish_language_2_desc: "우선 쿠르드어 사용자를 공격하는 자들을 처벌할 것입니다. 누구도 자신의 언어로 말하는 것을 두려워해서는 안 됩니다.\n\n추가 개혁을 위한 세 번째 결정을 해금합니다."
 kurdish_language_4: "쿠르드 방송 매체"
 kurdish_language_4_desc: "쿠르드어 채널을 개설하도록 허용할 것입니다. 이는 쿠르드인이 억압받는다는 PKK의 선전을 무력화할 뿐 아니라, 쿠르드인으로 태어나 튀르키예어를 배울 기회가 없었던 성인들의 마음을 얻을 것입니다. 다만 이러한 채널을 감시하고 PKK 선전에 이용되지 않도록 할 인력을 고용해야 합니다.\n\n추가 개혁을 위한 다섯 번째 결정을 해금합니다."
 doing_counter_terror_op_civ: "또 다른 민간 개혁 시행"
 investment_propaganda_1: "기반 프로젝트"
 investment_propaganda_1_desc: "동부 지역은 험준한 지형을 극복하는 데 꼭 필요한 기반시설이 몹시 부족합니다. 평등을 실현하고 국민을 만족시키려면 이를 바로잡아야 합니다."
 investment_propaganda_2: "실업률에 대응"
 investment_propaganda_2_desc: "굶주린 사람들은 범죄자가 되기 쉽습니다. 이전 정부들은 동부 지역을 방치하였고 쿠르드인이 억압받는다고 느끼게 만든 문제들에 신경 쓰지 않았습니다. 우리는 이전 정부들보다 나아져야 합니다."
 TUR_military_category: "터키군"
 TUR_military_category_desc: "\n£TUR_desctext_TSK \n\n\n\n\nThe Turkish military has intervened in Turkish politics more than once. Whenever they have felt their own or Turkey's existence threatened, they have organised (or tried to organise) a coup. Quite often this has stemmed from the Turkish government drifting away from secularism, and sometimes from economic troubles seemingly caused by the government.\n\nIf your §YStanding§! with the [TUR.Nat_Autocracy_L] falls below §Y0§!, the Armed Forces will take action to depose the government.\n\nOur current §YStanding§!: [?TUR_military_standing_value|0+]\n\n[?TUR_military_standing_party|=0+] from our current §YRuling Party§!\n[?TUR_military_standing_conservatism|=0+] from our §HSocial Conservatism - Government§!\n[?TUR_military_standing_opinion|=0+] from our §YMilitary's§! Current Opinion\n[?TUR_military_standing_corruption|=0+] from our §YCorruption Level§!\n[?TUR_military_standing_economy|=0+] from our §YEconomic Cycle§!\n[?TUR_military_standing_interest_rate|=0+] from our §YInterest Rate§!"
 TUR_hizmet_gulen_struggle: "민주당 (Hizmet)과 정의개발당 (AKP)의 갈등"
 TUR_hizmet_gulen_struggle_desc: "§W[Western_Autocracy_L]§!와(과) §W[Neutral_Muslim_Brotherhood_L]§! 사이에 치열한 권력 투쟁이 벌어지고 있습니다. 지난 선거에서 양측이 권력을 잡기 위해 연립을 구성하였기에 튀르키예 국민은 어느 쪽을 지지할지 갈라져 있습니다. 양측 모두 튀르키예의 권력을 차지하려 다투고 있으며, 법안을 성공적으로 통과시키거나 상대의 법안을 저지할 때마다 더 많은 권력을 얻습니다. 결국 상황은 어느 한쪽으로 기울 것이며 연립은 해체될 것입니다.\n\n현재 §W[Western_Autocracy_L]§!의 장악력은 §Y[?hizmet_power|%]§!입니다.\n\n현재 §W[Neutral_Muslim_Brotherhood_L]§!의 장악력은 §Y[?akp_power|%]§!입니다."
 TUR_expose_akp_scandal: "정의개발당 (AKP) 비리 폭로"
 TUR_expose_akp_scandal_desc: "§H[Neutral_Muslim_Brotherhood_L]§!이(가) 연루된 스캔들을 폭로할 것입니다."
 TUR_expose_gulenist_institution: "Shut down Gülenist institutions"
 TUR_expose_gulenist_institution_desc: "§H[Western_Autocracy_L]§!이(가) 운영하는 기관을 폐쇄할 것입니다."
 TUR_random_rally_akp_gulen: "다가오는 정치 시위!"
 TUR_disaster_income: "경제적 참사"
 TUR_disaster_income_desc: "경제 재앙이 다가오고 있다고 하며, 그 속도는 매우 빠릅니다. 야당이 결성되는 것을 막고 위기가 더 깊어지는 것을 피하려면 신속히 정신을 차려야 합니다."
 TUR_incoming_collapse: "다가오는 재난"
 TUR_incoming_collapse_desc: "시장이 붕괴하여 참담한 결과를 낳을 것입니다..."
 TUR_ciw_decisions: "이슬람의 안녕을 위한 연방 (CIW)"
 TUR_ciw_decisions_desc: "The §HCIW§!, or otherwise known as the §HConfederation of Islamic Wellbeing§! is an organization that intends to improve the wellbeing of islamic peoples around the globe. The CIW leader, §HTurkey§!, will have the ability to §Hinvest in other CIW members§!, and it could be through §Hinfrastructure, networks, industries, or railways§!, etc. §HCIW Members§! can §Ropt out§! of the organization at anytime, but doing so will §Rrevoke§! their ability to re-apply at a later date.\nThe §HCIW leader§! will be able to invest in other countries' education, healthcare, industry, infrastructure and emergency supply infrastructure. Once the leader invests in one of these things, a modifier with the bonuses are added to all the §HCIW members§! at no cost to them. §HCIW Member§! states will be able to §Gask for investments§! which can give them buildings instead of the bonuses given from the §HCIW Leader§!. If a §HCIW Member§! chooses to do one of these decisions, then the §HCIW Leader§! will get a certain amount of money into their §GInternational Investments§!."
 TUR_invest_in_infrastructure: "CIW 기반시설에 투자"
 TUR_invest_in_infrastructure_desc: "제대로 된 기반시설을 건설할 수 있게 되면 CIW 국가들은 국민에게 적절한 주거지와 시설을 제공할 수 있을 것입니다."
 TUR_invest_in_disasters: "CIW 재난구조위원회"
 TUR_invest_in_disasters_desc: "이슬람 세계는 수많은 재난을 겪고 있으나 피해를 복구할 능력이 없는 경우가 많습니다. 긴급 구호 물자를 제공하여 이들을 도울 수 있습니다."
 TUR_invest_in_education: "CIW 교육에 투자"
 TUR_invest_in_education_desc: "모든 사람에게는 적절한 교육을 받을 기회가 필요하며, 그러므로 CIW 국가들의 교육 시설에 투자해야 합니다."
 TUR_invest_in_health: "CIW 의료에 투자"
 TUR_invest_in_health_desc: "CIW 국가들은 인구가 많은데 적절한 의약품은 구하기 어렵거나 너무 비싸기 때문에 의료 서비스가 필요합니다."
 TUR_invest_in_industry: "CIW 산업에 투자"
 TUR_invest_in_industry_desc: "CIW 국가들의 산업에 투자함으로써 이슬람 세계가 훨씬 빠르게 산업화하여 유럽을 따라잡도록 도울 수 있습니다."
 TUR_leave_ciw: "이슬람의 안녕을 위한 연방 (CIW) 떠나기"
 TUR_ask_for_infrastructure: "기반 투자 요청"
 TUR_ask_for_network: "네트워크 기반시설 투자 요청"
 TUR_ask_for_supply: "교통 투자 요청"
 TUR_ask_for_radars: "레이다 투자 요청"
 TUR_ask_for_airbase: "공군기지 투자 요청"
 TUR_empower_sultan: "§W[Monarchist_L]§! 권력 강화"
 TUR_empower_sultan_desc: "술탄은 오스만 국가의 정당한 주인이며, 심술궂은 노인네 따위가 아닙니다. 술탄은 정당한 자신의 몫을 되찾을 것이며, 지지자들을 행진시켜 현 지도자를 몰아낼 것입니다. 무력을 써서라도 말입니다!"
 TUR_new_capital_mhp: "코스탄티니예 재건"
 TUR_new_capital_mhp_desc: "아타튀르크는 수도를 콘스탄티니예에서 앙카라로 옮겼습니다. 그의 의도는 주로 튀르키예의 수도를 적들로부터 멀리 두려는 것이었으나, 결국 큰 의미는 없었습니다. 우리는 수도를 콘스탄티니예로 되돌리고 그 어느 때보다 위대하게 건설할 것입니다!"
 TUR_open_mid_east: "§H중동 열기§!"
 TUR_close_mid_east: "§H중동 닫기§!"
 TUR_support_in_iraq: "§H이라크§! 지원 확대"
 TUR_support_in_syria: "§H시리아§! 지원 확대"
 TUR_support_in_kuwait: "§H쿠웨이트§! 지원 확대"
 TUR_open_levant: "§H레반트 열기§!"
 TUR_close_levant: "§H레반트 닫기§!"
 TUR_support_in_israel: "§H이스라엘/팔레스타인§! 지원 확대"
