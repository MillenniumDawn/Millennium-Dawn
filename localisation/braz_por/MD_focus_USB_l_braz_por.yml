 free_states_of_america_focus: "Árvore de Foco dos Estados Livres da América"
 the_dust_settles: "O Pó Assentou... O Que Fazemos Agora?"
 FS_established_elections: "Eleições Foram Re-Estabelecidas"
 FS_continued_election_ban: "Eleições Foram Interrompidas"
 USB_UFSR_desc: "[USB.GetFlag]§YEstados Livres da América§! Muda o Nome Para a §YUnião das Repúblicas Socialistas Livres§!"
 USB_MidAtlantic_Union_desc: "[USB.GetFlag]§YEstados Livres da América§! Muda o Nome Para a §YUnião Militar do Atlântico Médio§!"
 USB_MidAtlantic_States_desc: "[USB.GetFlag]§YEstados Livres da América§! Muda o Nome Para a §YUnião Federal do Atlântico Médio§!"
 USB_second_american_republic_desc: "[USB.GetFlag]§YEstados Livres da América§! Muda o Nome Para a §YSegunda República Americana§!"
 free_states_idea_isolationist_focused_foreign_office: "Escritório de Relações Exteriores Isolacionista"
 free_states_idea_isolationist_focused_foreign_office_desc: "Com o estado absoluto de nossa nação, a maioria das nomeações para o escritório de relações exteriores é vista como dinheiro fácil. Isso se deve à forte apatia que vem do fato de estarmos reconstruindo a própria sociedade. No entanto, à medida que nos desenvolvemos e começamos a prosperar, podemos vislumbrar horizontes mais brilhantes no futuro."
 free_states_idea_neighborhood_foreign_policy: "Política Externa de Vizinhança"
 free_states_idea_neighborhood_foreign_policy_desc: "Com a nação atingindo o auge em termos de economia, desenvolvimentos militares e políticos, tivemos um aumento recente no interesse estrangeiro. Como ainda precisamos descobrir o que realmente queremos fazer, nos prepararemos para lidar com a vizinhança como julgarmos adequado. Este é apenas um passo para alcançarmos a grandeza e nos tornarmos parte do cenário global novamente."
 free_states_idea_naval_budget_priorities: "Prioridades Orçamentárias Navais"
 free_states_idea_naval_budget_priorities_desc: "Com a maioria do restante militar da ordem antiga mais ou menos envolvida com a marinha, nossas prioridades orçamentárias começaram a refletir tais influências. Mas quão boa é essa influência quando estamos de costas para o continente e não necessariamente para o mar."
 free_states_idea_army_defensive_budgeting: "Orçamento Defensivo do Exército"
 free_states_idea_army_defensive_budgeting_desc: "As guerras modernas podem ser vencidas muito rapidamente ou muito lentamente. O civil moderno tem mais poder à sua disposição do que a maioria parece perceber, mas nós percebemos isso. Nossa doutrina moderna combinará aspectos da Guerra de 4ª Geração com a doutrina atricional padrão. Garantindo que possamos ter uma defesa móvel com o menor gasto possível em termos de material e pessoal. Essa nova doutrina está sendo chamada de DEW ou Guerra de Despesas Defensivas."
 free_states_idea_naval_renovations_budget: "Orçamento de Renovações Navais"
 free_states_idea_naval_renovations_budget_desc: "Com o estado de nossa situação e nossa costa sendo considerável na melhor das hipóteses e monstruosa na pior. Devemos investir na revitalização e renovação de toda a nossa marinha se quisermos sequer pensar em nos defender dos vastos oceanos e daqueles que procuram desembarcar em nossas costas."
 free_states_idea_foreign_relations_act: "Lei de Relações Exteriores"
 free_states_idea_foreign_relations_act_desc: "A Lei de Relações Exteriores é um investimento diplomático para apelar a potências estrangeiras e obter melhores acordos comerciais e programas de intercâmbio de trabalhadores. No geral, nossa economia crescerá, mas nossas capacidades políticas serão tensionadas devido ao acompanhamento dessas obrigações."
 free_states_idea_domestic_priority_policy: "Política de Prioridade Doméstica"
 free_states_idea_domestic_priority_policy_desc: "A DPP é o ideal da imposição de uma política doméstica e o bem-estar da nação e de seus cidadãos é a principal prioridade. Devemos garantir que nossa defesa nacional esteja segura, e essa abordagem mais interna significa que a política externa deve priorizar a segurança de nossa nação. Portanto, coisas como comércio e defesa nacional são a ideia neste plano."
 free_states_idea_diplomatic_corps: "Corpo Diplomático"
 free_states_idea_diplomatic_corps_desc: "Inimigos, bem como amigos, vêm em todas as formas e tamanhos, então para garantir e entender quem é quem, devemos ter um corpo diplomático de primeira linha para que as informações sobre relações sejam as mais rápidas de se saber quando mudanças drásticas acontecem."
 free_states_idea_national_labor_corps: "Corpo Nacional de Trabalho"
 free_states_idea_national_labor_corps_desc: "A combinação de um corpo de trabalho dedicado penal e civil para ajudar aqueles que precisam de emprego ou renda e a capacidade de usar aqueles que tentaram tirar da sociedade para contribuir mais. No geral, o NLC será usado para crescer e manter o aparato em expansão de nossa justa nação."
 FSA_america_military_surplus_jobs: "Empregos Excedentes Militares"
 FSA_america_military_surplus_jobs_desc: "Produzir equipamentos para o militar, seja armas ou algo tão simples quanto as cantis das quais a infantaria bebe, é tudo importante à sua maneira. Portanto, que melhor forma de lidar com o problema de desemprego como substituto do que usar passivamente as indústrias militares como uma forma de não apenas obter mais equipamentos e suprimentos para nossos defensores nacionais, mas também renda nas mãos daqueles que ainda buscam um emprego civil adequado de certa forma."
 free_states_idea_extreme_mining_projects: "Projetos de Mineração Extrema"
 free_states_idea_extreme_mining_projects_desc: "Embora alguns possam chamar isso de mineração imprudente, nós, no entanto, disparamos para quase reconhecimento internacional por meio de operações de mineração extensivas e muitas vezes extremas. Embora uma boa quantidade de pessoas não goste desse tipo de \"mineração implacável\", não podemos ignorar a alavancagem potencial que podemos ter sobre outras nações em termos de acordos comerciais e beneficiando nossos cidadãos com bens comerciais."
 free_states_idea_strategic_autarky: "Autarquia Estratégica"
 free_states_idea_strategic_autarky_desc: "O SAP ou Strategic Autarky Program é uma iniciativa estratégica nacional para garantir que nossos acordos comerciais sejam limitados na melhor das hipóteses e ainda melhores do que os acordos que fazemos sejam garantidos para o bem de nossos cidadãos. Pode não ser a estratégia mais aceitável em termos de relações internacionais, mas devemos nos preservar."
 free_states_idea_consumer_complex_initiative: "Iniciativa de Complexo do Consumidor"
 free_states_idea_consumer_complex_initiative_desc: "A CCI é um modelo econômico que coloca as indústrias baseadas no consumidor como a base primária e a organização da economia. Com isso em mente, as indústrias de defesa ou indústrias especializadas no que é visto como o \"Setor Oficial\" da economia são vistas como secundárias e partes mais suplementares do Complexo do Consumidor com base nas necessidades nacionais. Isso significa, no entanto, que a construção de tais coisas sofre, mas com nosso povo bem cuidado, quem se importa."
 free_states_idea_economic_efficiency_model: "Modelo de Eficiência Econômica"
 free_states_idea_economic_efficiency_model_desc: "Quando eles disseram construir alto, a maioria só assumiu prédios em geral para ter mais pessoas em uma área. No entanto, com nosso novo plano econômico EEM, podemos garantir que construir alto também possa ser um modelo econômico. Ao focar nas indústrias de maneira a obter mais produção com meios menores, podemos garantir o gasto limitado de recursos enquanto mantemos um crescimento equilibrado e eficiente."
 free_states_idea_military_readiness_model: "Modelo de Prontidão Militar"
 free_states_idea_military_readiness_model_desc: "O MRM é um modelo econômico que se concentra na militarização preventiva da economia. Significa que fábricas e indústrias são construídas com a preconcepção de que poderiam ser transformadas em uma instalação de fabricação de guerra. Isso permite que nossa economia funcione de maneira sustentável, mas pode ser altamente adaptável se a necessidade surgir."
 free_states_idea_department_for_synthetic_development: "Departamento de Desenvolvimento Sintético"
 free_states_idea_department_for_synthetic_development_desc: "Todo mundo sabe que os combustíveis fósseis são limitados, mas e se pudéssemos esticar esse limite o máximo possível cientificamente. Bem, entra o DSD, um departamento dedicado de P&D para descobrir exatamente onde está esse limite e que sintéticos do futuro podemos fazer, sejam plásticos, nylons ou certos produtos químicos ou lubrificantes parte das indústrias petroquímicas. Usamos o passado para criar um futuro."
 free_states_idea_department_for_energy_innovation: "Departamento de Inovações em Energia"
 free_states_idea_department_for_energy_innovation_desc: "Para afirmarmos que usamos o futuro, devemos garantir que cientificamente seja realmente o futuro. Portanto, o DEI é dedicado à tarefa de descobrir e desvendar inovações na produção de energia, bem como formas mais eficientes de consumir energia sem desperdício sempre que possível."
 free_states_idea_infrastructure_readiness_act: "Lei de Prontidão da Infraestrutura"
 free_states_idea_infrastructure_readiness_act_desc: "A Lei de Prontidão da Infraestrutura é uma declaração de guerra por si só contra o descontentamento e a preguiça quando se trata da preservação da infraestrutura de nossa nação. Estabelecer intervalos de inspeção e datas de construção pré-planejadas, bem como aquisições de materiais, permitirá a reparação rápida e a manutenção de nossa infraestrutura, limitando o efeito global que pode ter sobre a vida cotidiana da população local."
 free_states_idea_defensive_officers_school: "Escola de Oficiais Defensivos"
 free_states_idea_defensive_officers_school_desc: "Devemos entender como nos manter, o treinamento especializado em obter mais com menos e ser capaz de realmente lidar com nossas próprias iniciativas de defesa contra um inimigo imprudente."
 free_states_idea_the_bulwark_doctrine: "A Doutrina do Baluarte"
 free_states_idea_the_bulwark_doctrine_desc: "A Doutrina do Baluarte é nossa mudança fundamental na preservação da defesa e do espírito de nossa nação. Entender como utilizar o terreno, a logística e a capacidade de defender até a morte sem que todos morram. Esta coleção é o que determinará se sobrevivemos ou estamos perdidos para os desafios do tempo em si."
 free_states_idea_the_fighter_defense_doctrine: "A Doutrina de Defesa dos Caças"
 free_states_idea_the_fighter_defense_doctrine_desc: "Defender nossos céus nos permite garantir nossas forças terrestres. Portanto, devemos especializar nosso treinamento e produção aérea para garantir a supremacia de nossas capacidades aéreas."
 free_states_idea_the_increasing_defensive_capabilites: "Aumentando as Capacidades Defensivas"
 free_states_idea_the_increasing_defensive_capabilites_desc: "O programa IDC é a utilização de nossos métodos de produção de aeronaves para beneficiar e ajudar nossos pilotos humanos a fazer coisas no ar que pilotos normais não poderiam fazer. Inovações em radar, avanços em impulso e controle de voo e assim por diante. Seremos os defensores das vias aéreas de nossa nação e todos os dias serão um dia claro."
 free_states_idea_naval_mining_warfare_refinement_program: "Programa de Refinamento de Guerra de Mineração Naval"
 free_states_idea_naval_mining_warfare_refinement_program_desc: "O Programa de Refinamento de Guerra de Mineração Naval é uma instituição dedicada ao treinamento e aprimoramento para treinar e refinar nossa marinha em torno da habilidade de minas marítimas e guerra de mineração."
 free_states_idea_armored_assault_assist_groups: "Grupos de Assistência ao Ataque Blindado"
 free_states_idea_armored_assault_assist_groups_desc: "O AAAG ou Triple AG é uma doutrina de batalha para localizar e especializar elementos blindados para auxiliar nosso exército principal a avançar e dividir forças inimigas."
 free_states_idea_aggressive_officer_corps: "Corpo de Oficiais Agressivos"
 free_states_idea_aggressive_officer_corps_desc: "A reconfiguração de nossos programas de treinamento de oficiais e academias militares permitirá que nossa liderança seja agressiva de maneiras que nunca vimos antes. Isso obviamente terá um custo, mas mesmo assim garantiremos que, se formos atacados, o inimigo se arrependerá de ter feito tal escolha."
 free_states_idea_material_not_human_loss: "Material Não Perda Humana"
 free_states_idea_material_not_human_loss_desc: "Equipamentos podem ser substituídos, mas soldados experientes e treinados não podem, garantiremos que os estilos de treinamento que encorajam essa potencial perda de equipamentos sejam uma certeza, mas a perda de companheiros de equipe é insubstituível."
 free_states_idea_survivability_program: "Programa de Sobrevivência"
 free_states_idea_survivability_program_desc: "Devemos garantir as inovações em sobrevivência; nesse sentido, investigaremos a refinamento e desenvolvimento de formas de maximizar não apenas a sobrevivência pessoal, mas se possível, também a sobrevivência de equipamentos."
 free_states_idea_admirable_admiralty: "A Admirável Almirantado"
 free_states_idea_admirable_admiralty_desc: "A proficiência e os talentos brutos de nossos líderes navais são o ápice de como garantimos nossa supremacia naval."
 FSA_america_hit_and_hit_again: "Ataque e Depois Ataque Novamente"
 FSA_america_hit_and_hit_again_desc: "Você já tentou fazer guerra psicológica com barcos, agora podemos. Especializando e entendendo as fraquezas de nossa própria espécie, podemos direcionar nossas jogadas de batalha em torno de infligir golpes críticos após a desorientação das tripulações inimigas. Isso é um jogo de azar, mas se bem-sucedido, resultará em golpes críticos nas capacidades da frota inimiga."
 free_states_idea_the_assimilation_program: "O Programa de Assimilação"
 free_states_idea_the_assimilation_program_desc: "Criar uma nova identidade a partir de ideias antigas tende a não ser popular com indivíduos e povos idealistas. Como tal, devemos reverter essas preconcepções e trabalhar para sufocar o progresso de tais tendências distrativas."
 free_states_idea_the_second_american_republic: "A 2ª República Americana"
 free_states_idea_the_second_american_republic_desc: "Através de sangue, suor, lágrimas e muitas outras provações, buscamos o manto e garantimos nosso destino. Renovando o Sonho Americano e criando a 2ª República Americana, um capítulo finalmente se virou neste livro de liberdade para o qual os fundadores escreveram pela primeira vez em 1776. Para uma nova era, uma nova luz e um novo futuro para nossa nova república."
 free_states_idea_the_self_made_embargo: "O Embargo Autossuficiente"
 free_states_idea_the_self_made_embargo_desc: "A tecnologia moderna que temos e os métodos de sintéticos permitem que crenças autárquicas e isolacionistas sejam melhor realizadas do que nunca. Com isso, estabeleceremos um precedente moderno não visto desde os dias do Xogunato do Japão."
 free_states_idea_ground_to_air_dominance: "Domínio do Solo ao Ar"
 free_states_idea_ground_to_air_dominance_desc: "Não temos para onde correr, então pare de correr e comece a lutar. Investimentos significativos em capacidades práticas de combate solo-ar nos permitirão manter nossa posição em qualquer guerra aérea moderna sobre nossas terras legítimas. Além disso, o equipamento adicional também pode ajudar em qualquer guerra subterrânea se partes de nosso território forem sitiadas."
 free_states_idea_graveyard_warfare_doctrine: "Doutrina de Guerra do Cemitério"
 free_states_idea_graveyard_warfare_doctrine_desc: "A DGM ou Doutrina de Guerra do Cemitério é uma doutrina abrangente relacionada à guerra assimétrica ou guerra de 4ª geração. Essa doutrina de guerra cidadã tornará o inferno para qualquer potência estrangeira que deseje nos subjugar a um inferno próprio."
 free_states_divided_we_fell: "Divididos Nós Cair"
 free_states_divided_we_fell_desc: "A república não existe mais, agora somos uma sombra do que éramos. As terras estão queimando, as pessoas estão morrendo, fugindo ou sobrevivendo de alguma forma. No entanto, isso significa que, enquanto estamos essencialmente por conta própria, nossos vizinhos ao norte e ao sul estão recebendo algum auxílio em relação à maior crise humanitária a atingir os continentes do Novo Mundo. O caminho está quebrado, cheio de muitos obstáculos, mas devemos continuar e esperançosamente buscar algum tipo de horizonte."
 free_states_federal_budgets: "Políticas Orçamentárias Federais"
 free_states_federal_budgets_desc: "Para garantir a prosperidade, devemos equilibrar os livros. Devemos aprender com o mundo ao nosso redor e entender que a dívida é um número para entender e não ignorar."
 free_states_domestic_policies: "Políticas Domésticas"
 free_states_domestic_policies_desc: "Devemos nos esforçar para melhorar nosso povo, para construir não apenas nossa nação, mas os cidadãos e a cultura que compõem o que chamamos de lar."
 free_states_industrial_policies: "Departamento de Assuntos Industriais"
 free_states_industrial_policies_desc: "O DoIA ou às vezes chamado de IAA, Industrial Affairs Administration, é um ramo do governo criado para ajudar a regular, agilizar e moldar nossa economia. Ele trabalha lado a lado com o DoM na criação de regulamentações e planos equilibrados para crescer, diversificar e manter sob controle a economia de nossa nação. Mas enquanto o DoM lida estritamente com a alocação de recursos e organização dos ditos recursos, o IAA lida com o planejamento e a inovação dentro dos negócios que utilizam esses recursos."
 free_states_resource_management_policies: "Departamento de Gerenciamento de Recursos"
 free_states_resource_management_policies_desc: "O Departamento de Gerenciamento de Recursos, ou simplesmente conhecido como Departamento de Gestão, DoM, é uma agência governamental destinada a reconstruir e reequipar a sociedade em si. Ao ter o departamento totalmente focado nos recursos disponíveis para nós, ou neste caso, no que não está disponível para nós, permite definir prioridades e encontrar maneiras de criar muito mais com muito menos. Este departamento será fundamental para definir o curso de nosso desenvolvimento e nossa marca que deixaremos na história."
 free_states_tax_policies: "Políticas de Tributação"
 free_states_tax_policies_desc: "Para avaliar nosso progresso, devemos ter um código tributário estável e adaptável. Este código deve se adaptar às necessidades de nosso povo e ao interesse nacional que garantirá nosso futuro e o caminho que pavimentamos para alcançá-lo."
 free_states_army_service_branch: "Ramificação de Serviço do Exército"
 free_states_army_service_branch_desc: "O alicerce da defesa nacional e o núcleo de nosso exército, o exército. Para preservar nossa nação e seu povo, devemos reformar e estabelecer uma força de combate que possa não apenas defender nossa pátria, mas lidar com os inimigos que ameaçam nosso modo de vida."
 free_states_air_force_service_branch: "Ramificação de Serviço da Força Aérea"
 free_states_air_force_service_branch_desc: "Embora o alicerce seja o exército, a rainha do campo de batalha não está no chão, mas no ar com a força aérea. Devemos acompanhar nossos inimigos se quisermos proteger verdadeiramente nossa terra. Pois o que eles podem não conseguir atacar no solo, certamente podem atacar e bombardear do ar."
 free_states_navy_service_branch: "Ramificação de Serviço da Marinha"
 free_states_navy_service_branch_desc: "A marinha é a tela que atrasa e nos alerta sobre as intenções do inimigo. Devemos ter uma marinha forte para criar um impedimento e ser capaz de proteger nossa pátria de ameaças além das terras que compartilhamos."
 free_states_idea_hit_them_again_doctrine: "Doutrina Bata-os Novamente"
 free_states_idea_hit_them_again_doctrine_desc: "Quando você joga tudo em alguém, eles entram em pânico, recuam ou perdem a coesão. Como tal, vamos explorar essa ideia instituindo um novo tipo de estratégia de batalha contra o inimigo. Ao preparar a frota ou embarcação naval para lançar literalmente tudo de uma vez possível contra o inimigo, essa desorientação permitirá uma rápida prontidão para um ataque de precisão para infligir golpes críticos e/ou nocautes nas embarcações inimigas."
 USA_colorado_capital: "Monte Columbia"
 USA_kansas_capital: "Nova Arlington"
 USA_missouri_capital: "Winfield"
 post_united_event.1.t: "Fracassos na Fragmentação dos Estados Livres"
 post_united_event.1.d: "No rescaldo precipitado da semelhança de sociedade conhecida como os Estados Livres da América, o governo federal reinante desta nação remanescente desenvolveu uma série de forte fragmentação. Esta fragmentação está dividida em o que muitos veem como quatro grupos. Estes grupos consistem nos Socialistas no Norte, Militaristas no Leste, Monarquistas no Sul e os Central/Oeste são os Federalistas. Estas facções consolidaram-se em duas facções principais, mais por vir à medida que descobrimos novos detalhes."
 post_united_event.1.o1: "Não Nos Dividimos O Suficiente?"
 post_united_event.2.t: "O Grupo Pró-Eleições"
 post_united_event.2.d: "Na crescente fragmentação política recente, vimos o surgimento de grupos pró-eleições como o Partido Federalista, Partido Socialista Livre e o Partido da Monarquia Moderna. Estes partidos, embora diferentes em objetivos finais e essencialmente qualquer coisa coesa, de alguma forma concordaram com o princípio das eleições. Compreendendo que o sistema de votação seja o mais representativo possível dado o estado atual das coisas. Muitos ainda se agarram à esperança de que votar para o futuro nos unirá mais a longo prazo do que nos dividirá, mas só o tempo pode dizer isso."
 post_united_event.2.o1: "Vamos Votar Pelo Futuro que Queremos"
 post_united_event.3.t: "O Grupo Anti-Eleições"
 post_united_event.3.d: "Por outro lado, temos os partidos anti-eleições, estes consistindo do Partido Federalista, Partido Socialista Livre e o Partido dos Serviços Unidos. Como se pode ver, a fragmentação que divide as duas principais facções, o Federalista e o Socialista Livre, parece dividir fundamentalmente os futuros potenciais candidatos se as eleições fossem realizadas. Embora saibamos pouco sobre o estado dessas divisões, veremos o que pode surgir das coisas nos próximos dias conforme o debate continua."
 post_united_event.3.o1: "Precisamos Nos Concentrar, Não Debater."
 post_united_event.4.t: "A Pesquisa Divisória"
 post_united_event.4.d: "Nas últimas semanas, pesquisadores e jornalistas têm varrido a nação como em uma espécie de esquema de votação pseudo que é a \"Pesquisa Nacional\" tem visto muitos divididos sobre qual direção realmente deveríamos estar tomando. No final, muitos concordaram que as eleições mais adiante neste momento são apenas para servir como uma distração no estado enfraquecido e aleijado em que nos encontramos. Agora cabe aos quatro principais partidos influenciar a opinião pública a seu favor. O Partido Federalista e sua facção mais conservadora, a facção estatista do Partido Socialista Livre, a facção isolacionista do Partido do Atlântico Médio ou a facção militarista do Partido do Serviço Nacional. Todos querem coisas diferentes, mas todos querem a mesma coisa também. Nenhuma eleição e uma identidade mais autossuficiente para o futuro previsível."
 post_united_event.4.o1: "Os Federalistas Emergem Vitoriosos"
 post_united_event.4.o2: "A Vitória Comunal do FSP"
 post_united_event.4.o3: "O \"MAPA\" Isolacionista Assegura o Poder"
 post_united_event.4.o4: "O NSP Ganha Outra Batalha"
 post_united_event.5.t: "As Primeiras Eleições"
 post_united_event.5.d: "Com as eleições restabelecidas, agora é hora de os votos serem lançados e as pessoas escolherem a direção que desejam seguir. Como tal, os Partidos Federalista, Socialista Livre, Meio-Atlântico e de Serviços Nacionais todos estão buscando o apoio público para obterem uma maioria segura na eleição. Mas à medida que o tempo passa e os votos são contados, o vencedor das primeiras eleições oficiais é..."
 post_united_event.5.o1: "Os Federalistas Venceram"
 post_united_event.5.o2: "A Vitória dos Socialistas Livres"
 post_united_event.5.o3: "O Partido do Meio-Atlântico Obviamente Venceu"
 post_united_event.5.o4: "O Partido de Serviços Nacionais Conquista a Vitória"
 post_united_event.1000.t: "A Grande Questão"
 post_united_event.1000.d: "Com os ventos mudando a nosso favor esperançoso, fizemos um grande gesto nacional e proclamamos uma potencial mudança de nome para a nação. Como tal, uma votação nacional foi organizada e, como tal, os resultados serão em breve contabilizados. A grande aposta está próxima e veremos o que o povo realmente quer... vamos apenas esperar que sejamos nós que eles querem."
 post_united_event.1000.o1: "Nós Somos Arcádia!!!"
 post_united_event.1000.o2: "Pelo Menos Estamos Unidos... Certo?"
 post_united_event.2000.t: "A Crise Capital"
 post_united_event.2000.d: "Após a 2ª Manifestação do Destino, os olhos e ouvidos do povo da nação voltam-se para a capital, que ainda está no antigo casebre da costa leste. Muitos acreditam que a capital não deveria mudar por causa de seu simbolismo, enquanto muitos mais acreditam que deveria mudar para simbolizar a mudança da nação como um todo. Uma nova capital permitiria um melhor planejamento em termos de crescimento da Câmara dos Representantes, algo que muitos acreditam ser uma das principais falhas do quagmire político da ordem antiga. Além disso, uma nova capital provavelmente seria mais central, dando luz, atenção e exposição a pessoas que nunca sonhariam em considerar o que quer que o governo federal faça. No entanto, vários candidatos estão disponíveis para escolha e cabe às pessoas e seus líderes fazerem a escolha."
 post_united_event.2000.o1: "Por Que Mudar, As Coisas Estão Bem."
 post_united_event.2001.t: "As Montanhas Rochosas"
 post_united_event.2001.d: "Muitos argumentam a criação de uma região capital perto ou praticamente nas Montanhas Rochosas. Isso criaria um aparato natural de fortaleza se e quando nossa nação estivesse sob assalto. Outros argumentam que isso poderia ser visto como um pouco mais isolante do que foi pretendido. Independentemente disso, os planejadores já começaram a lançar as bases para algum tipo de assentamento no norte do Colorado"
 post_united_event.2001.o1: "Nós Ganhamos Montanha Rochosa Barata?"
 post_united_event.2002.t: "O Governo \"Central\""
 post_united_event.2002.d: "Os planejadores do Kansas argumentam que onde eles estão propondo uma nova localização da capital é uma das sugestões mais centralmente localizadas. Isso seria visto como justo e não como um tipo de mentalidade pró-costa leste vs costa oeste. No entanto, teremos que avaliar o resto de nossas opções para garantir a validade de nossa escolha."
 post_united_event.2002.o1: "Eles Têm Um Ponto, No Entanto."
 post_united_event.2003.t: "A Opção de Barreira do Rio"
 post_united_event.2003.d: "Muitos nos últimos dias veem como mais viável ter a capital perto do rio Mississippi, uma grande e dedicada barreira contra assaltos terrestres inimigos. Um símbolo da suposta divisão continental de nossa nação e uma posição mais segura quando se considera o rio um tanto vertical que cobriria seu flanco sul enquanto seu leste e quase norte também estavam cobertos. A opção é mais oriental do que as outras duas opções, mas está situada no lado ocidental do Mississippi. Independentemente disso, ainda há o planejamento de como será o novo prédio e o que planejamos fazer com a Câmara dos Representantes."
 post_united_event.2003.o1: "Muita Água, Pelo Menos."
 post_united_event.2004.t: "A Decisão Final"
 post_united_event.2004.d: "Após semanas de deliberação e planejamento, as pesquisas do público e muitos outros aspectos da situação. Finalmente chegou a hora de decidir onde será a nova capital e qual será seu nome. No Colorado, há a proposta do Monte Columbia, em Missouri temos a cidade de Winfield sendo usada como base com seus arredores dos rios Missouri e Mississippi como fronteiras naturais. Finalmente, temos a proposta de New Arlington no norte do Kansas, espaçoso, aberto e mais ou menos vazio, seria uma tela em branco provável para o desenvolvimento."
 post_united_event.2004.o1: "A Antiga Capital Está Bem."
 post_united_event.2004.o2: "As Montanhas Rochosas Defenderão a Liberdade."
 post_united_event.2004.o3: "Obviamente, Uma Colocação do Governo Central."
 post_united_event.2004.o4: "O Mississippi Defenderá a Liberdade."
 post_united_event.2005.t: "A Nova América"
 post_united_event.2005.d: "Com a proclamação da 2ª República Americana, agora buscamos reformar e adaptar nossa administração à escala que crescemos também. Obviamente, haverá ineficiências porque há apenas tanto para ter um comando e controle, no entanto, prevaleceremos. A Águia caiu, mas ela se ergueu mais uma vez para voar ainda mais alto antes."
 post_united_event.2005.o1: "Novus Americanus, A Nova Era Americana"
 free_states_idea_military_high_command: "Alto Comando Militar Unificado"
 free_states_idea_military_high_command_desc: "Com essa \"liderança máxima\" agora centralizada, podemos agora expandir, treinar, desenvolver e aprimorar nossas forças militares e suas capacidades."
 USB_decisions_war_time_mobilization_category: "Mobilização em tempo de guerra"
 USB_decisions_war_time_mobilization_category_desc: "Chegará a hora de defender nossas terras e criar nosso destino. Peguem em armas e defendam nossas terras e os monumentos que resistirão ao teste do próprio tempo."
 USB_war_time_mobilization: "Mobilização da 1ª Onda"
 USB_war_time_mobilization_desc: "O tempo chegou, defendamos Washington e nossas liberdades federais pelas quais somos fiéis. Nós Defenderemos!"
 USB_war_second_wave_defenders: "Defensores da 2ª Onda"
 USB_war_second_wave_defenders_desc: "O inimigo pressiona para frente, portanto, precisamos recrutar outra onda de defensores. O moral da nação sofrerá, mas precisamos das tropas."
 USB_war_desperate_defenders: "Defensores Desesperados"
 USB_war_desperate_defenders_desc: "As coisas estão ficando sombrias, precisamos de todos os corpos disponíveis, capazes ou não, para segurar a linha. Talvez, só talvez, ainda consigamos vencer isso."
 USB_america_economy_what_economy: "Economy... What Economy?"
 USB_america_economy_what_economy_desc: "With the absolute state of...well everything, we must create an understanding of a baseline. Such baseline is establishing legislative reforms in terms of economic regulations as well as budgeting increases between care programs, education and training assistance programs and administration programs in terms of investment targeting grants. All in all we will set an administrative and budgetary standard to ensure we can approach our economic build up in the best possible manner."
 USB_america_department_of_labor_affairs: "Department Of Labor Affairs"
 USB_america_department_of_labor_affairs_desc: "The DoLA is a dedicated department to looking at and improving labor laws and regulations to get more efficiency our of less people. As well the DoLA has control over unemployment assistance programs and so funding is broken into two main parts. The Unemployment Assistance programs as well as reintegration programs which allows for those unemployed to seek out organized job fairs and or programs to have a stand in income until they get a new steady job and income."
 USB_america_ensuring_the_modern_four_day_week: "The Modern Four Day Week"
 USB_america_ensuring_the_modern_four_day_week_desc: "In this modern age we see that automation and technology allow our work force to be more efficient then even some ten, twenty years ago. As such the modern four day work week is the gold standard to ensure a true balance in work, social lives as well as understanding this metric allows us to get even more production and employment value out of the existing workforce."
 USB_america_ensuring_enforced_job_fairs: "Ensuring Enforced Job Fairs"
 USB_america_ensuring_enforced_job_fairs_desc: "Enforcing the creation and continuancy of job fairs is essential to let employers know what kind of labor force is in their area as well as it exposes said labor force to jobs they may not have even known were there. This will cost us a little bit, but to ensure the fluidity of the job search, it is more than worth it."
 USB_america_automation_and_advancements_act: "Automation And Advancements Act"
 USB_america_automation_and_advancements_act_desc: "The triple A or as its actually called, the Automation and Advancements Act is an education and R&D budget package to get industries up to standard on the more common practices of things like robotics, automation and AI based programs which help increase production and efficiency values for industries around the globe. Now while this will hit at the heart of the superstitious in terms of losing their jobs temporarily. We can mitigate the scale by investing in modernizing our education system to get people more aware of such jobs at a younger age."
 USB_america_national_labour_corps: "National Labor Corps"
 USB_america_national_labour_corps_desc: "The NLC is the federally sponsored civilian labor corps of which unemployed individuals an, of course in a separate site, the penal labor corps will both be working on infrastructure and development projects. This will also give us ample opportunity to upkeep maintainence on things like infrastructure."
 USB_america_military_surplus_jobs: "Military Surplus Jobs"
 USB_america_military_surplus_jobs_desc: "Working together with the military and civilian sectors will ensure that the employment issues our new nation is suffering shall be better resolved in a timely manner."
 USB_america_slashing_regulations_for_new_regulations: "Slashing Regulations For New Regulations"
 USB_america_slashing_regulations_for_new_regulations_desc: "If we want to even think about growing our economy, we must understand the regulations we need and or do not need. Being business friendly is one thing, being passive to the personal greeds of the opportunistic and individualistic power grabbers is a whole nother ball game. Therefore we must slash the current regulations and in turn replace them with better, clearer and more flexible ones if we want to encourage growth without compromising what that growth could mean."
 USB_america_department_for_strategic_resource_collection: "Department Of Resource Collection"
 USB_america_department_for_strategic_resource_collection_desc: "The Department of Strategic Resource Collection or simply the DoRC is the dedicated administrative wing of the DoRM in regards to collecting a strategic reserve and or supply of crucial resources to the preservation of our national cohesion. Things like steel for construction, fossil fuels for energy, ect ect. With this department we will ensure the future."
 USB_america_aggressive_extraction_methods: "Aggressive Extraction Methods"
 USB_america_aggressive_extraction_methods_desc: "The AEM affair in the department has resulted in some significant political backlash, however the economic boom that will come from it will result in way more rebound if we play our cards right."
 USB_america_targeted_resource_extraction: "Targeted Resource Extraction"
 USB_america_targeted_resource_extraction_desc: "Counter to the AEM thought process, the department will target strategic resources that are the most important to our economy's functionality. This targeting will work in tandem with the Department of Energy to ensure the cohesion of how we approach economic and resource expansion projects."
 USB_america_rusting_sheets_to_polished_metals: "Rusting Sheets To Polished Metals"
 USB_america_rusting_sheets_to_polished_metals_desc: "Its about time we turn around the \"Rust Belt\" portion of our country into a new shining sheet of metallurgic manufacturing. From the aluminium mills of the Jersey shores to the steel foundries of the Pennsylvanian Erie Complex, we will make new from what was once abandoned."
 USB_america_strategic_metallurgic_expansions: "Strategic Metallurgic Expansions"
 USB_america_strategic_metallurgic_expansions_desc: "The SME programs in the former \"Rust Belt\" states are a good starting initiative to grow the strategic importance and job markets in these once forgotten bastions of manufacturing."
 USB_america_the_capital_gemstones: "The Capital Gemstones Act"
 USB_america_the_capital_gemstones_desc: "The states of Maryland and Delaware are not really known for anything outside of clay, sand and stone for construction materials. However, Maryland coal mining as well as Delaware Petrochemicals can work in tandem on top of doing our best to enforce some real growth in the limited Gemstone mining operations in either state. Who know the smallest state as well as our capital state would be...undervalued for lack of better words, hehe."
 USB_america_from_coal_to_petrochemicals: "From Coal To Petrochemicals"
 USB_america_from_coal_to_petrochemicals_desc: "Resource wise the states of Maryland and Delaware are kinda dry or at least underwhelming at best. So, to capitalize on the limited nature we will expand the coal industry in Maryland to further grow the science as industrial petrochemical base in Delaware. It helps both states and gives us more reasons to invest in R&D."
 USB_america_the_dynamic_ming_duo: "The Dynamic Mining Duo"
 USB_america_the_dynamic_ming_duo_desc: "The Virginia's, once a singular state now two parts of our now whole nation. With Virginia's limited resource diversity we must expand each resource and ephasize the major player of steel, copper and other common core minerals. With West Virginia however its a lot more different, the state only has coal for it. Hence why its known as the Black Peal State, so lets start mining some pearls then, speaking of pearls did you know they also mine gemstones, nice little side hustle in our grand scheme projects."
 USB_america_black_pearls_fuel_valley_industries: "Black Pearls Fueling Valley Industries"
 USB_america_black_pearls_fuel_valley_industries_desc: "Through direct growth of the West Virginia coal and fossil fuel mining operations we can fuel and supply the energy needs of the Virginia industries and metallurgic mills like the steel and titanium mills, especially considering the government has deemed certain minerals mined in Virginia as \"essential resources\", so gotta keep the essentials supplied aye."
 USB_america_the_trade_guru: "The Trading Guru"
 USB_america_the_trade_guru_desc: "The peak of our resource development and expansion projects has culminated in not only our domestic skyline like view of economic development. But we must also look to beyond our borders, for there are plenty of nations that may want our resources and as such we must seek out these potential partners to ensure our lucrative future."
 USB_america_strategic_autarky_program: "Strategic Autarky Program"
 USB_america_strategic_autarky_program_desc: "Ensuring the truest form of national security we must be proactive in our resource security and the trade we conduct with nations around the world. As such we will institute the SAP or Strategic Autarky Program which will direct our trade policy in accordance to resource security of our nation. Many will likely be indifferent or dissapointed with our actions but that is a small price to pay to ensure our national well being."
 USB_america_industrial_development_planning_board: "Establish The IDPB"
 USB_america_industrial_development_planning_board_desc: "The Industrial Development Planning Board, a dedicated body within the Department of Industrial Affairs that handles the planning and development of the economy outside of whatever the private sector does. It's main function is finding a balance based on the national needs, things like we need to get unemployment down, so what's needed to get that down while also not just creating zombie businesses that don't actually contribute to the needs of the people."
 USB_america_civilian_development_administration: "Civilian Development Administration"
 USB_america_civilian_development_administration_desc: "The CDA of the IDPB is tasked with developing out civilian economic initiatives that the IDPB has laid out for the continued stable growth of the nation in supplementing the private sector growth."
 USB_america_erie_hudson_initiative: "The Erie-Hudson Initiative"
 USB_america_erie_hudson_initiative_desc: "The IDPB has greenlit the Erie-Hudson Initiative, which is a revival plan to put back on the map our section of the ol Rust Belt States. It ain't much, but its honest work."
 USB_america_cumberland_wilmington_initiative: "The Cumberland & Wilmington Initiative"
 USB_america_cumberland_wilmington_initiative_desc: "We've gotten the green light to develop the states of Maryland and Delaware from the Board. As such we'll begin breaking ground and have things set up as soon as possible and as safety allows."
 USB_america_the_sisters_initiative: "The Sister's Initiative"
 USB_america_the_sisters_initiative_desc: "The Board has just finalized the plans for developing the Virginia's. With this we shall bring industrialization and jobs to those of the Appalachian region and some."
 USB_america_rustic_services_plan: "The Rustic Services Plan"
 USB_america_rustic_services_plan_desc: "IDPB plans to improve and expand the services and office networking within the states of Pennsylvania and New Jersey has been green lit. We'll begin work right away and begin diversification of the local economies in these statees."
 USB_america_mid_atlantic_tech_plan: "Mid-Atlantic Tech Plan"
 USB_america_mid_atlantic_tech_plan_desc: "Through layouts and redrafts the Board has approved the MAT Plan. This is an outline and development scheme for the states of Maryland and Deleware to bring tech and other office networking jobs to the region. The hope is that this will boost our R&D capabilities."
 USB_america_virginia_tech_expansions: "Virginia Tech Expansions"
 USB_america_virginia_tech_expansions_desc: "In cooperation with Virginia Tech, the Board wishes to set up development and expansion plans to flush out the tech and services sector of the Virginia Sister states. We hope this will bring new innovations as well as plenty of jobs for the locals."
 USB_america_military_development_administration: "Military Development Administration"
 USB_america_military_development_administration_desc: "The MDA is the military counterpart to the CDA. This department is responsible for enacting any military industrial plans that the IDPB has approved of to develop and mantain the defensive capabilities of our nation from foreign incursions or outright invasion."
 USB_america_altoona_tanks_and_jersey_jumpers: "Altoona Tanks & Jersey Jumpers"
 USB_america_altoona_tanks_and_jersey_jumpers_desc: "Local arms and support equipment like uniforms and so forth will be expanded in their production abilities. The main plants have been designated in Altoona, Pennsylvania as well as Newark, New Jersey. The Board hopes that these plants will bring jobs, wages and a local increase in security abilities if a foreign nation attacks."
 USB_america_maryland_munitions: "Maryland Munitions"
 USB_america_maryland_munitions_desc: "The state of Maryland as well as Deleware will be a great place to develop military support equipment especially with its proximity to the capital. As such the Board has gone ahead with the Maryland Munitions Plan to develop the local supply chains in military affairs."
 USB_america_appalachian_arms: "Appalachian Arms"
 USB_america_appalachian_arms_desc: "The IDPB has gone ahead and approved plans for some armaments facilities around the Appalachian region of West Virginia and Virginia. The hope is that these natural mountains can also be used to store stockpiles as well as potentially hide and or partially shield the factories in the area."
 USB_america_philly_shipyards: "Philly Shipyards"
 USB_america_philly_shipyards_desc: "The bay area south of Philadelphia is a great place to build a shipyard complex. The Board has approved for these \"Greater Philly Shipyards\", to be built south of Philadelphia and along the New Jersey west coastline."
 USB_america_delaware_destroyers: "Delaware Destroyer"
 USB_america_delaware_destroyers_desc: "Despite the name, the supposed Delaware centric development plan is actually a wider pennisula naval program. Shipyards will be built along the pennisula which both Maryland and Deleware occupy as a way to better utilize this expansive coast to improve said coastal defenses."
 USB_america_norfolk_navies: "Norfolk Navies"
 USB_america_norfolk_navies_desc: "The port of Norfolk, Virginia has a long history of churning out and creating navies of old. It is with this that the Board has gone ahead to expand as well as building supporting shipyards in relative close proximity to the Norfolk complex. They hope that the overall naval complex will be able to help defend our coastal waters like it has for centuries."
 USB_america_idpb_economic_direction_sub_committee: "The Economic Direction Sub-Committee"
 USB_america_idpb_economic_direction_sub_committee_desc: "With the main function of the IDPB being the actual economy itself, a sub-committee has be established to debate and inform of the best possible decision on what economic direction we should take our nation. Some argue a more manufacturing base, others say a more tech and or office oriented services economy. Though there are those who even take to organizing the economy along more military lines, using the arms as leverage in foreign investments through their sale. Nevertheless its up to this sub-committee to decide what is the best option."
 USB_america_the_mom_and_pop_plan: "The Mom & Pop Plan"
 USB_america_the_mom_and_pop_plan_desc: "The backbone of the economy is obviously the small businesses that encompass our great nation. Therefore we will continue economic development along lines which ensure their primacy and possibly build a better economy then most."
 USB_america_pittswark_development_scheme: "The Pittswark Development Scheme"
 USB_america_pittswark_development_scheme_desc: "The PDS is a planned economic development initiative in the states of New Jersey and Pennsylvania. The goal being the establishment of more small businesses and developing more consumer based industries to boost the quality of life for the citizens in these states."
 USB_america_huntingmond_development_scheme: "The Huntingmond Development Scheme"
 USB_america_huntingmond_development_scheme_desc: "The HDS is a planned economic development initiative in the states of West Virginia and Virginia. The objective being the establishment of more small businesses and creating more consumer based industries to boost the standard of living for the citizens in these states."
 USB_america_wilmingland_development_scheme: "The Wilmingland Development Scheme"
 USB_america_wilmingland_development_scheme_desc: "The WDS is the economic development initiative for the states of Delaware and Maryland. The hope being the creation of more small businesses as well as establishing more consumer based industries to boost the standard of living for the citizens in these states."
 USB_america_norfolk_naval_contract: "Norfolk Naval Contract"
 USB_america_norfolk_naval_contract_desc: "Despite our purely domestic intentions we must establish some kind of defense industry if we are to think about preserving our way of life and national identity. Therefore the Norfolk Naval Yard will be expanded and issued a limited contract on the needs of our defense."
 USB_america_altoona_automatics_contract: "Altoona Automatics Army Contract"
 USB_america_altoona_automatics_contract_desc: "The contract for military armaments is only for the defensive capabilities to hold our own. So the establishment of an arms factory in Altoona along side some more consumer based industry should calm any worries about unjust militarization."
 USB_america_the_consumer_complex_initiative: "Consumer Complex Model"
 USB_america_the_consumer_complex_initiative_desc: "With the solidification of our economic planning, we have come to the realization that consumer confidence and the preservation of our citizen's economic needs are the true priority. As such we have developed a new economic model to ensure the full cohesiveness of such prioritization of the needs of our nation and its people."
 USB_america_mixed_measures_plan: "Mixed Measures Plan"
 USB_america_mixed_measures_plan_desc: "Economic Planning is a fine art in its own right, some may even call it a science as well. Whatever it may be in your eyes, in our eyes it is a series of balancing acts. A nation or societal body of any size has to contend to the needs of many and while we may not always get it right, we can surely do our best to not get it as wrong as those in the past have. Therefore we will institute the Mixed Measures Plan or MMP, a general economic development plan to ensure balance and fairness to the complex needs of our nation at large."
 USB_america_rust_belt_renewal_initiative: "Rust Belt Renewal Initiative"
 USB_america_rust_belt_renewal_initiative_desc: "The RBRI is a diversification scheme to revive and of course diversify the economies of the former Rustbelt states of Jersey and Pennsylvania. The idea being that the diversification will give new life to what was technically a one trick economic pony per say."
 USB_america_twin_sisters_initiative: "The Twin Sisters Initiative"
 USB_america_twin_sisters_initiative_desc: "The twin Virginias are in need of economic diversification, West Virginia more so but I digress. Therefore with this new economic development initiative we will do just that."
 USB_america_the_baltimore_blossom: "The Baltimore Blossom"
 USB_america_the_baltimore_blossom_desc: "Applying the same style of planning to our last un-diversified states of Maryland and Delaware, we can then shift towards the governmental needs of national defense. Not the biggest priority shift, but something needed to secure our wellbeing."
 USB_america_the_office_initiative: "The Office Initiative"
 USB_america_the_office_initiative_desc: "The service and office sectors are the modern consumer's direct needs. From things like internet, cable tv and so forth, we look to develop our office sector and its run offs that will benefit in growth from our investments in growth."
 USB_america_defense_industry_needs: "Defense Industry Needs"
 USB_america_defense_industry_needs_desc: "The needs of our national defense are not much, but we must think in a balanced approach. We may never know if we will become under attack back a foreign foe or even one of our neighbors. Not only that our position also allows us to think outside of the box per say and solidify a new identity. For now limited militarization under the guise of self defense is all we need at this time."
 USB_america_a_true_balance: "A True Balance"
 USB_america_a_true_balance_desc: "Our economy is booming, its diverse and the people and government's needs are being met. Now we turn to tuning this model, understanding how to develop and make it more efficient in use of materials, human and natural resources. Above all we will institute our new EEM plan which is a new economic model called the Economic Efficiency Model to gear our economy towards a \"building tall\", sort of planning."
 USB_america_militarized_economy_plan: "Militarized Economy Plan"
 USB_america_militarized_economy_plan_desc: "Our situation is tenuous at best and fleeting at worst. We must hybridize the economy and ensure our national defense as well as catering the essentials of living that our population needs."
 USB_america_rustic_arms_act: "Rustic Arms Act"
 USB_america_rustic_arms_act_desc: "The RAA is a spending package to develop and secure the defense industries baseline in the rustbelt states."
 USB_america_dover_dockyards: "The Dover Dockyards"
 USB_america_dover_dockyards_desc: "Naval industries both for domestic as well as military means are essential if we want to secure our trade on the world stage. We may not have the glory of 350 ships, but enough to screen and defend is all that matters for the time."
 USB_america_sister_armaments: "Sister Armaments"
 USB_america_sister_armaments_desc: "Despite the coy sounding name, no the local nunnary is not starting a militia...despite how fun that might be. No instead this is a joint investment into the arms manufacturing company known as the Sister's Armaments Company. Founded by two sisters and only really operating in the sister states of both Virginias, we can rely on this family unity to produce quality which will defend said families of state and nation at large."
 USB_america_federal_firearms: "Federal Firearms"
 USB_america_federal_firearms_desc: "The \"Federal District\", i.e. those states which contest the capital area are in need of arms and equipment to be sourced locally and as closely as possible to ensure the supply of defense forces if the worst case should prevail. So the development of Virginia and Maryland's defense industries are a must to ensure the security of our nation's capital."
 USB_america_complacency_act: "The Complacency Act"
 USB_america_complacency_act_desc: "Despite the euphamistic naming, the Complacency Act is actually a dedicated bulk package to develop and spread out civilian industries and such to ensure the essential needs of our population are met. Therefore if a war should break out, they have the ability to supply themselves in some regard to stave off how soon rationing and the like would have to be implemented."
 USB_america_military_ready_economy: "Military Ready Economy"
 USB_america_military_ready_economy_desc: "With the string of development schemes under way and things looking more stable in terms of civilian and military affairs, we can now focus on our adaptability. Fine tuning our currrent economic development to be ready and raring to go if a foe should even think about declaring war on us. This will be a bit unpopular with the civilian population but it is a sacrifice we are willing to make."
 USB_america_establishing_the_department_of_energy: "The Department Of Energy"
 USB_america_establishing_the_department_of_energy_desc: "The DoE is a branch of the DoIA which focuses on the energy needs of the nation. How to produce, where to construct new facilities, infrastructure maintenance and so forth."
 USB_america_tried_and_tested_development: "Tried And Tested Development"
 USB_america_tried_and_tested_development_desc: "The old reliables of the fossil fuel industries are still relavent, despite the opposition this may have with the tree huggers we can still satisfy the majority through cheap and effective power. We may even spice it up with some renewables if the agitation gets too annoying."
 USB_america_innovation_station_plan: "Innovation Station Plan"
 USB_america_innovation_station_plan_desc: "The diversity of our energy consuption as well as the production methods is the best way to secure ourselves from foreign meddling. Therefore extensive investments in R&D as well as a diverse platform of energy producing means will go into effect over the course of time."
 USB_america_west_virginian_revival: "The West Virginian Revival"
 USB_america_west_virginian_revival_desc: "With our plan of developing of more fossil fuel oriented power generation we have since indirectly revived some parts of the West Virginian mining industries and the heart of said state's economy. An unintentional act, it nevertheless is a boom for which not only West Virginia shall have, but that the nation as a whole shall enjoy."
 USB_america_the_solar_harness: "The Solar Harness"
 USB_america_the_solar_harness_desc: "Using the Sun to generate energy may be as variable as say wind. However if we can strategically place solar panels and solar fields in areas that tend to get more sun exposure on average then it'll do more good in the long run. Therefore we can institute tax breaks and programs to have the people generate power for their own homes and likely the grid at large."
 USB_america_oil_and_gas_power: "Oil & Gas Power"
 USB_america_oil_and_gas_power_desc: "Coal can only do so much and so to hit the trifecta we must develop our oil and natural gas facilities to ensure a well rounded energy production methodology."
 USB_america_the_winds_of_change: "The Winds Of Change"
 USB_america_the_winds_of_change_desc: "Treating wind energy like solar and understanding its draw backs will allow us to strategically place wind turbines around in areas where winds can be near consistent as possible. The additional thing as well is the creation of ocean based wind turbines that use not only winds but the tidal currents as power generation as well. Its not the prettiest thing for beach goers to see, but these are sacrifices we must make if we are to be energy self sufficient."
 USB_america_power_hubs: "Power Hubs"
 USB_america_power_hubs_desc: "Resource rich and or strategically located \"Power Hubs\" will be established to create more centralized and efficient power generation complexes. West Virginia and Maryland fit either description without also distracting from development of other industries that may be needed with the same lands."
 USB_america_green_coal_act: "The Green Coal Act"
 USB_america_green_coal_act_desc: "The GCA is a euphamistic name to define what some may consider the \"New Age Coal\". This of course being uranium and nuclear power in general. We must properly invest and develop this technology as it is more or less the future of plentiful energy production. After all, why else do most sci-fi forms of media use either nuclear energy or a made up material as the supposed \"Do All Energy Source\", its cause the potential is there and we haven't found anything better than nuclear yet."
 USB_america_department_for_synthetic_development: "Department For Synthetic Development"
 USB_america_department_for_synthetic_development_desc: "The DSD is a dedicated R&D department of the DoE to ensure the innovations and development of synthetics. This can be coal, oil, gas or things like certain petrochemical products like plastics or nylon to name a couple."
 USB_america_department_for_energy_innovations: "Department For Energy Innovations"
 USB_america_department_for_energy_innovations_desc: "The DEI is the dedicated R&D department within the DoE to handle innovations with regards to energy production and use. We must seek out the future if we are to use what we claim is said future."
 USB_america_department_of_logistical_affairs: "Department Of Logistical Affairs"
 USB_america_department_of_logistical_affairs_desc: "Similar to a Department of Transportation, the main functionality of the DoLA is to ensure the maintaining as well as flexibility and or adaptability of our infrastructure and where to expand and or develop is as needed by the nation."
 USB_america_northern_highways_act: "Northern Highways Act"
 USB_america_northern_highways_act_desc: "The NHA is a spending package to develop and either expand or maintain existing major roadways related to the Interstate system."
 USB_america_re_establishing_the_pennsy: "Re-Establishing The Pennsylvania Railroad"
 USB_america_re_establishing_the_pennsy_desc: "The PRR or Pennsy as those who remember the former fallen flag railroad was a railroad at its peak which encompassed territory as far as Missouri. Alas with the forced merger with the New York Central and other failing railroads into the mess that was the Penn Central, th following bankruptcy was enevitable. Now with a fresh start and a new lease on life we shall re-establish the Pennsylvania Railroad and encourage adaptable regulation to prevent the Super Mergers or the forced failures which predate the turn of the century."
 USB_america_southern_highways_act: "Southern Highways Act"
 USB_america_southern_highways_act_desc: "Just like before boys and girls, only this time we're giving love to our lower half of the nation's infrastructure."
 USB_america_re_establishing_the_norfolk_and_western: "Re-Establishing The Norfolk & Western"
 USB_america_re_establishing_the_norfolk_and_western_desc: "The N&W was a lucrative coal railroad that handleed the Virginias and a little extra in terms of territory controlled. Despite the changing tied all and all the railroad was standing the test of time. However in response to the Super Mergers of the later half of the 1900s as well as the increasing competition from the road, air and so forth the N&W was more or less forced to find a merging partner. They found one in the South's Old Reliable known as the Southern Railway, soon after both former flags would fall and take up a new shared one under the name Norfolk Southern. Now that the Class ones are all but destroyed, its time we brought back some real American history and raise some fallen flags."
 USB_america_the_infrastructure_readiness_act: "The Infrastructure Readiness Act"
 USB_america_the_infrastructure_readiness_act_desc: "The IRA is not an Irish immigration bill, rather it is a government regulation and mandation that infrastructure upkeep is of national security itself. As such one of the main priorities next to say national defense is that of maintiaining our infrastructure in as peek condition as possible without causing undue constant hardships on the local populations where said work needs to be done."
 USB_america_military_debate: "The Great Military Debate"
 USB_america_military_debate_desc: "Having a military is fine, but knowing what you're going to do with said military is better."
 USB_america_the_bulwark_doctrine: "The Bulwark Doctrine"
 USB_america_the_bulwark_doctrine_desc: "Our enemies expect us to be aggressive, to be reckless, well we shall not give into such temptations. We must construct and use our military in a defensive manner, understanding that there is no such thing as a truly quick war. With this knowledge we can create a bulwark of a military and let the enemy waste resouces while we win the war of attrition through careful civil and military integrations for the national defense."
 USB_america_infantry_supremacy_guide: "Infantry Supremacy Guide"
 USB_america_infantry_supremacy_guide_desc: "Every man a rifle, every woman a shotgun. This is the declaration of our Infantry Supremacy Guide or ISG military training outline for the army. We of course will invest in armored vehicles and so forth, there is no doubt considering the modern way of war. But if we are to have such equipment we must training every solider as if they were always expected to be an infantry personnel."
 USB_america_refining_ocs_institutions: "Refining OCS Institutions"
 USB_america_refining_ocs_institutions_desc: "Leadership, this is the core of what makes an army function. It is this known fact that we will over haul our Officer Corps Studies in our military academies to reflect and adapt to the new direction of our military. Defensive doctrine and initiative in the regards of preservation of the force under their command. Together we will hold, leadership will defend as will the troops they shall command."
 USB_america_streamlining_logistics: "Streamlining Logistics"
 USB_america_streamlining_logistics_desc: "In order to be able to hold, we have to be able to keep our soldiers supplied. Therefore we must streamline the logisitical prioritization in order to ensure how our troops are supplied as well as ensuring the morale of our troops are maintained."
 USB_america_establishing_the_doctrine: "Establishing The Doctrine"
 USB_america_establishing_the_doctrine_desc: "The peak of our army development plan is establishing the official doctrine of our military and that is the Bulwark Doctrine. We will ensure the defense of our nation and its people."
 USB_america_sky_defenders_program: "Sky Defenders Program"
 USB_america_sky_defenders_program_desc: "The modern queen of the battlefield is that of the air force. Be it fighters, bombers or multi-roled aircraft, the principle is, if you want to win the war then you must win it in the air. As ushc we will develop and orient ourselves in refining the ability to defend and hold our airspace from enemy bombers and the like from destroying our defensive capabilities."
 USB_america_fighter_defense_doctrine: "Fighter Defense Doctrine"
 USB_america_fighter_defense_doctrine_desc: "The FDD is the dedicated organization of our air force around the principle of localizaed security. We are defending our homeland, therefore our aircraft as well as our training must be geared around such distinctions."
 USB_america_agility_training_measures: "Agility Training Measures"
 USB_america_agility_training_measures_desc: "Our training are a set standard which embodies the expectations of what it means to join our air force. This means we must refine our training methods to ensure that our pilots are building a tolerance to above than normal G-forces to increase the capabilites of siad pilots. Not only that the agility of our aircraft are above what our pilots are capable of handling so our biggest limitation is the personnel itself. So we will work to better this, we must better this."
 USB_america_aircraft_refinement_programs: "Aircraft Refinement Programs"
 USB_america_aircraft_refinement_programs_desc: "The ARP is a dedicated production utilization program set to innovate and develop our aircraft efficiently for the role which we set out to achieve."
 USB_america_naval_repair_schools: "Naval Repair Schools"
 USB_america_naval_repair_schools_desc: "Instituting the employment of not only naval repair personnel but civilian welding contractors will allow the repairing and refitting process to be a lot smoother. This in turn will allow us to produce by proxy better equipment as the integration of these new NRS's will make even the most complex vessel a breeze to repair."
 USB_america_naval_alloy_innovations: "Naval Alloy Innovations"
 USB_america_naval_alloy_innovations_desc: "The NAI is a R&D department dedicated to the advancements in naval vessel creation. Things like displacement and alloy refinements to allow for better, smoother and more durable ships to be created and able to actually sail in vaiable conditions on the sea."
 USB_america_mining_warfare_refinements: "Mining Warfare Refinements"
 USB_america_mining_warfare_refinements_desc: "The MWR program is specializing our naval prowess to adapt and refine the abilities of sea mining and anti-mine warfare operations."
 USB_america_navy_readiness_training: "Navy Readiness Training"
 USB_america_navy_readiness_training_desc: "Enhancing the training programs and regiments of our naval personnel to smooth and increase responsiveness to threats as well as potential false alarms as even a false alarm is a potential threat."
 USB_america_the_spearhead_doctrine: "The Spearhead Doctrine"
 USB_america_the_spearhead_doctrine_desc: "Our military must be like the head of a spear, having the ability to stab, slash and cut down the enemy where possible before they can organize an effective defense."
 USB_america_perpetual_assault_training: "Perpetual Assault Training"
 USB_america_perpetual_assault_training_desc: "The PAT is a training program dedicated to understanding and building up solider endurance to do what we call the \"Perpetual Assault\". Think of it as a refinement of the Mass Assualt doctrine of the old days, but refined in the principle of concentrated attacks to ensure quick exploits and potential encirclements. So like a hybrid of Mass Assault with Defeat in Detail almost."
 USB_america_armored_assault_assist: "Armored Assault Assist Group"
 USB_america_armored_assault_assist_desc: "The military triple A, this refinement of our armored wing of the army will allow us to punch and defeat small pockets of enemy forces without too much risk to counter encirclements."
 USB_america_officer_corp_aggression_training: "Officer Corps Aggression Training"
 USB_america_officer_corp_aggression_training_desc: "Our ability to push forward is solely on the responsibility of the officers in charge. Instilling vigor and determination in the troops and understanding the planning and tactics to push forward and understand the doctrine which we have set for our military and army at large."
 USB_america_material_not_human_loss: "Material Loss, Not Human Loss"
 USB_america_material_not_human_loss_desc: "We can ill afford the loss of our people, despite the methodology of our doctrine we still believe that our soldiers are our best assets. Therefore we must retool our logistics to compansate to address losses in equipment comparable to what we'll try to save in manpower expenditure."
 USB_america_proactive_air_assaults: "Proactive Air Assaults"
 USB_america_proactive_air_assaults_desc: "Aggression in our air force will allow us to shoot down enemy aircraft before they realize it. By having proactive training to simulate the responsiveness and adaptability of our air crews and pilots. In short they should be able to handle situations and false alarms with the quickest possible speed and flexibility in approach based on quick and critical thinking on the situation and information available to them."
 USB_america_modern_maneuverability_courses: "Modern Maneuverability Courses"
 USB_america_modern_maneuverability_courses_desc: "With the rise of stealth tech and the increasing demands on pilots, we must pre-emptively train and adapt our pilots to be able to deal with hyper maneuverability scenarios which would exert an on average dangerous amount of G-forces against them. This will cost us but its worth the long term possibilities this could render under our use."
 USB_america_redesigns_and_field_testing: "Redesigning And Field Testing"
 USB_america_redesigns_and_field_testing_desc: "Understanding any kind of data we can acquire on our existing aircraft will allow us to build better designs as well as refine training programs. This in turn should enhance our air force's capabilities in both defense and offensive operations."
 USB_america_air_corps_survivability_program: "Air Corps Survivability Program"
 USB_america_air_corps_survivability_program_desc: "The SP is a program to innovate ways to ensure survivability of both pilot and equipment where possible. Of course the priority is always the pilot as it takes arguably longer to train an individual to endure such extremes then it takes to build a hunk of metal and wires."
 USB_america_rapid_response_protocols: "Rapid Response Protocols"
 USB_america_rapid_response_protocols_desc: "The RRP is training and standard equipment revisions to better ensure the ability to do \"field repairs\" on the open seas. While the confirmation of returning to port is still and always needed, its still the reality of a repair is still a repair as long as it is done right."
 USB_america_streamlining_port_facilities: "Streamlining Port Facilities"
 USB_america_streamlining_port_facilities_desc: "To ensure the readiness of our naval forces we need to streamline, update and ready facilities to take in ships and build new ones."
 USB_america_the_new_admiralty: "The New Admiralty"
 USB_america_the_new_admiralty_desc: "Our boats mean nothing if the people who command them know nothing. As such an over haul into the training and molding of future naval commanders is our highest priority."
 USB_america_hit_and_hit_again: "Hit & hit Again"
 USB_america_hit_and_hit_again_desc: "Through strategic maneuvering we can look to send volumes of rounds at the enemy in an attempt to disorganize them. If we can mentally exhaust our foes, then we can secure victory in more than one way."
 USB_america_foreign_policy_debate: "The Great National Direction"
 USB_america_foreign_policy_debate_desc: "With our nation stable, our heads clear and both our economy and civilian needs taken care of, we shall debate over the next great direction which we want to take our nation."
 USB_america_reclaim_the_mantle_of_destiny: "Reclaiming The Mantle Of Destiny"
 USB_america_reclaim_the_mantle_of_destiny_desc: "The power vacuum is vast and as such only we are fit to fill it. We control the old capital as well as the core of our territory is the federalist elements of the old republic. With grit, determination and skill we shall ensure that we manifest our true destiny and reclaim the lands of old for the gold of proclaiming the 2nd American Republic."
 USB_america_war_plan_arcadia: "War Plan Arcadia"
 USB_america_war_plan_arcadia_desc: "The shortest front and in our opinion the weakest front is that of the Northeast. With this in mind we must prepare, plan and ready ourselves for the coming northward incursion."
 USB_america_battle_plan_albany: "Battle Plan Albany"
 USB_america_battle_plan_albany_desc: "New York, the land of liberty to those who immigrated from the old world. Now that it is the adversary for which we must acquire to secure our mantle. From the Hudson bay to the Canadian border we will secure the symbol of liberty, forward to victory!"
 USB_america_battle_plan_providence: "Battle Plan Providence"
 USB_america_battle_plan_providence_desc: "The great north that is New England, the forests of the north is our biggest issue when considering any plans. Nevertheless we will seize the more developed region of New England and surely their morale will collapse and another victory will be secured for us."
 USB_america_war_plan_mississippi: "War Plan Mississippi"
 USB_america_war_plan_mississippi_desc: "We aren't even flying half a ship, as such our main goal is to secure everything east of the Mississippi river. The best natural border this will also secure our emerging status of the continent."
 USB_america_battle_plan_gary: "Battle Plan Gary"
 USB_america_battle_plan_gary_desc: "The Great Lakes will become greater still when we re-integrate these former territories of ours. On the plus side we can confuse the enemy of whether our main goal is to capture Gary, Indiana or if Gary created the plan."
 USB_america_battle_plan_dixie: "Battle Plan Dixie"
 USB_america_battle_plan_dixie_desc: "To Dixieland we travel boys and girls. We'll make sure each Dixie boy understands that they'll always live with Uncle Sam."
 USB_america_securing_the_new_frontiers: "Securing The New Frontiers"
 USB_america_securing_the_new_frontiers_desc: "Before we continue our move to the Pacific, we must secure and control the domain for which we have acquired. Unity before expansion is what caused the past, now we will make a better future."
 USB_america_the_borderlands: "The Borderlands"
 USB_america_the_borderlands_desc: "The progress of our assimilation must be coordinated and so the initial borderlands should be our main concern first."
 USB_america_uniting_the_arcadians: "Uniting The Arcadians"
 USB_america_uniting_the_arcadians_desc: "The Northeast or at one point centuries ago was known to be part of the French Arcadia colonial region. These folks have a very distinctive culture around heavy British and subtle French influences. As such we will work to stamp out this and bring unity to these lands."
 USB_america_southern_culture_is_american: "Southern Culture Is American"
 USB_america_southern_culture_is_american_desc: "Though it was not through bloody rebellion, we find ourselves looking to bring the south once again back under our fold. Rather than the failed back and forthing policies of two different administrations, we will institute a uniformed and legal policy of integration. The South and Southern Culture, this is American culture and will be treated as such. For the South brings us things like comfort foods and sports fanaticism. These things are American and will be seen and respected as such."
 USB_america_midwestern_unity: "Midwestern Unity"
 USB_america_midwestern_unity_desc: "Just like the South, the Midwest is known for its huntin seasons, yet again the Midwest also brings another spin on comfort food and who could forget the sports rivalries. As such the Midwest is just another piece of the American puzzle and should be made clear that while yes they are a cultural sub-type, they are in the end of it all just good ole red, white, and blue blooded Americans."
 USB_america_cajun_dixie_and_us: "Cajun, Dixie And Us"
 USB_america_cajun_dixie_and_us_desc: "The western half of the former Southern Republic as well as their Confederate forefathers has a strong will to be independent. The cultural differences in their infusions as well as the more isolated parts that are either at or east of the Mississippi river give them more ability to do as they want. Nevertheless we must work to assimilate these cultures, remind them of the similarities and shared values of that of their Southern and Midwestern brothers and sisters."
 USB_america_war_plan_pacific: "War Plan Pacific"
 USB_america_war_plan_pacific_desc: "This is the beginning and preparation for the end as well. The second Manifest Destiny or as some have begun to call it, \"The American Crusade\". In the end the only thing that matters is Unity, Duty and the American Identity is solidified once more."
 USB_america_battle_plan_alamo: "Battle Plan Alamo"
 USB_america_battle_plan_alamo_desc: "Sam Houston in his day wanted to found a nation for which the settlers of the region could call home. They fought tooth and nail with the \"Napoleon of the West\", Santa Anna. Then with their victory they petitioned and called their new home America as well. Let us bring back into the fold the American's that most of the world believed us to be."
 USB_america_battle_plan_woundedknee: "Battle Plan Wounded Knee"
 USB_america_battle_plan_woundedknee_desc: "Custer had his imfamous final stand at the massacure of Wounded Knee. Now we will not be as wreckless as Custer was, but we will secure the bread basket of the republic and remind the people that old or new, everyone is an American."
 USB_america_the_second_utah_war: "The 2nd Utah War"
 USB_america_the_second_utah_war_desc: "We've almost reached the Pacific ocean, now the Rockies as well as the \"Mormons\" stand in our way. We shall whip them like we did back in the 1850s, for we shall be united from sea to shining sea."
 USB_america_battle_plan_cascadia: "Battle Plan Cascadia"
 USB_america_battle_plan_cascadia_desc: "The Cascadian movement is a very fresh and new one, if we take them out quickly and work our way pre-emptively to not get bogged down in the mountains. It is an assurance of certainty that we may give these, \"lime lighters\", a reminder and a sobering of the reality that they are just Pacific Coast Americans."
 USB_america_battle_plan_angels: "Battle Plan Angels"
 USB_america_battle_plan_angels_desc: "California, home to the American dream and such important milestones in American history like the Gold Rush Era. The city of angels and the core more populated southern coasts will be our main objective and will likely be the easiest approach. Let us sally forward and reclaim the farthest reaches of the American Dream."
 USB_america_west_of_the_mississippi: "West Of The Mississippi"
 USB_america_west_of_the_mississippi_desc: "The Great Crusade, the months and years of planning, fighting and so forth are finally over. Now we look to install, educate and remind the peoples of these lands west of the Mississippi river that they are and always have been Americans."
 USB_america_from_plains_to_rockies: "From Plains To Rockies"
 USB_america_from_plains_to_rockies_desc: "The further West we go, the further from the government people feel. Let us remind them of their origins, history and understanding of similarity to allow us to peacefully reintegrate these pioneering lands before us. Let us also consider the idea of relocating the capital considering this same issue was once the rallying cry of many secession movements before."
 USB_america_from_sea_to_shining_sea: "From Sea To Shining Sea"
 USB_america_from_sea_to_shining_sea_desc: "The Great 2nd Manifest Destiny is completed and with great trounles, tribulations and effort we have reached the Pacific shores. Now the American Dream can be re-realized and bright in the eyes of those who make up our future."
 USB_america_the_great_administration: "The Great Administration"
 USB_america_the_great_administration_desc: "With unity throughout the land we may now begin the civil service and administration overhaul that is desperately needed for such a vast and geographically diverse land."
 USB_america_capital_crisis: "The Capital Crisis"
 USB_america_capital_crisis_desc: "With the unity of the nation solidified we must look to the biggest sore thumb in the room, that being the position and or location of the federal capital and subsequent federal government of the nation. We must look at our options and understand if and where we could locate our new capital to if we are to properly forward."
 USB_america_the_proclamation: "The Great Proclamation"
 USB_america_the_proclamation_desc: "The day is upon us to end this chapter of American history. The first republic lasted nearly 300 years, outlasting practically every republic before it as the main defining trait of a new republic is the rewritting of their founding document. This is why France is on its 7th and the Greeks on who knows which, nevertheless with this new republic we will usher in a new age and seek out the future we want."
 USB_america_the_great_shutdown: "The Great Shutdown"
 USB_america_the_great_shutdown_desc: "The prospects and dreams of old are done for, the world has failed us and we have failed it. Let us focus internally and become the toughest nut to crack. For if we have nothing for which to distract ourselves, do we really need to expand outward then."
 USB_america_self_embargo: "The Ultimate Embargo"
 USB_america_self_embargo_desc: "The EP or as some jokingly call it the Ultimate Embargo Plan, is the shut down to trade to the outside world. We set a precedent not seen in centuries and we plan to hold our own and better the lives of our citizens in the most un-influenced ways possible. This will greatly hurt our abilities economically but with great focus and determination we can secure a new way. Our way."
 USB_america_every_citizen_a_job: "Every Citizen A Job"
 USB_america_every_citizen_a_job_desc: "With our self embargoing we will need to ensure our economic stability. With this in mind our education and civil services must be adaptable to these new challenges as well as the fact that now every citizen who is able to should and will have a job. This fundamentel shift in economics is revolutionary and likely unstable at best. But if we prepare, focus and properly coordinate we can ensure that the basics of survival are met and that luxuries of those other nations could be enjoyed if sought after."
 USB_america_mandatory_service_period: "Mandatory Service Period"
 USB_america_mandatory_service_period_desc: "To ensure the maximum readiness of our nation we must begin to institute a mandatory service period for our citizens. Not only that but we should encourage things like JROTC programs in schooling and better adapt our society to be more military aligned."
 USB_america_ground_defense_is_air_defense: "Ground Defense Is Air Defense"
 USB_america_ground_defense_is_air_defense_desc: "The GDAD program is a slew of investments in research and military training to equip as well as prepare our ground forces with the ability to properly defend and withstand prolonged enemy air based combat units. The modern war is defined by the queen of the battlefield, that queen is the air force and with our nation not being so chatty with the outside world, we must seek out the ability to remedy this queen with an appropriate King maker."
 USB_america_warfare_beyond_the_grave: "Warfare Beyond The Grave"
 USB_america_warfare_beyond_the_grave_desc: "Graveyard Warfare, this new 4th Gen based doctrine will allow us to make movies like Red Dawn look like child's play. Your resistance is eternal for our nation is eternal."
 USB_america_the_new_identity_plan: "The New Way Forward"
 USB_america_the_new_identity_plan_desc: "We can't pretend that if we reclaim the old lands that we will just be fine with them. But we can't just pull a Japanese Shogunate either and close off the nation, so we must forge a new path. Our goal will be a new way forward, a new identity which our people can be proud of."
 USB_america_war_plan_gray_coat: "War Plan Gray Coat"
 USB_america_war_plan_gray_coat_desc: "From the Atlantic to the Mississippi our destiny is set. Our first direct plan to achieve our goals is that of the former Confederacy. For this has the most continuous connection and will result us in assuring our great consolidation."
 USB_america_the_southeast: "The Southeast"
 USB_america_the_southeast_desc: "Proximity and as well as the constant developments along the coast will allow for targeted investments and integration efforts to be underway in a smoother metric then the more under developed states. A stepping stone to the future is all."
 USB_america_the_gulf_states: "The Gulf States"
 USB_america_the_gulf_states_desc: "The gulf coast and the direct inland states from said coast are a mix of development and abandonment. We will esure that these states do not feel left out as well look to invest in infrastructure and ways to better integrate and include these states into our new way forward."
 USB_america_war_plan_superior: "War Plan Superior"
 USB_america_war_plan_superior_desc: "The Great Lakes and the former Rust Belt states are the industrial heartland of the former nation as well as our new way forward. We will ensure the industrial might is apart of our identity just as we have secured the agricultural might of the south as our identity."
 USB_america_the_automotive_states_and_some: "The Automotive States And Some"
 USB_america_the_automotive_states_and_some_desc: "The core of what was once American automotive manufacturing is that of Michigan, Ohio and Indiana, with Illinois having their share as well. But being we want to keep to a parcel and methodical way of integration we stuck with those three and the border state of Kentucky. These states have vaious problems and as such we'll be using what we can to increase employment and remedy the issues they have in the moment to get them better adjusted to their new home in our great nation."
 USB_america_the_northwest_region: "The Northwest Region"
 USB_america_the_northwest_region_desc: "The cabal of states which will now make our direct border with Canada and whatever develops beyond the Mississippi river is a great way to show sportsmanship and unity through things like hunting and sports. We'll use these time honored traditions to rally the peoples of these states into accepting the new reality of things and understand not everything is always a bad thing."
 USB_america_war_plan_north_atlantic: "War Plan North Atlantic"
 USB_america_war_plan_north_atlantic_desc: "The final frontier for our new identity, the Greater New England region. We'll need to prepare for things lik urban, mountain and jungle like combat if we are to effectively combat and bring back these states."
 USB_america_liberty_prime: "Liberty Prime"
 USB_america_liberty_prime_desc: "The bastion of liberty and the symbol of freedom which is the Statue of Liberty, New York state is a very unique and tough nut to crack. Being the state of ghettos and multi-culturalism we must learn, study and understand not only what is a New Yorker culturally. But how we can make them see that they are no honest difference between themselves and us in terms of a common goal and future, we must appeal to their uniqueness and likely give them concessions autonomy wise to ensure cohesion and cooperation."
 USB_america_new_england_old_habits: "New England, Old Habits"
 USB_america_new_england_old_habits_desc: "Despite the cultural significance of the New Englander states, these folks are honestly no different then the rest of the nation. Certain habits and commonalities in national past times make things clear that even when we are different, we still share a fair amount in common. So its time to remind these folks that we're all comrades, family and can understand the mistakes of the past so we can make a better tomorrow."
 USB_america_the_arcadian_identity: "The Arcadian Destiny"
 USB_america_the_arcadian_identity_desc: "The time has finally come, we shall end this chapter as well as this great page in history. Taking the ideas and ideals of old, the lessons of old, past and even last week, and sally forth to a new beginning. We are a bright butterfly ready to spread her wings and fly to the great beyond of our dreams. We are Arcadia."
 USB_arcadia_path_desc: "[USB.GetFlag]§YFree States of America§! Changes Name To §YArcadia§!"
 USB_formalizing_the_fighting_brigades: "Formalizing The Fighting Brigades"
 USB_formalizing_the_fighting_brigades_desc: "While we still look to collect ourselves, we never know what the enemy may do. As such we'll create the Federal Fighters as a sort of quick action National Guards type unit. After all something is better than nothing."
 USB_creating_infantry_reserves: "Creating The Infantry Reserves"
 USB_creating_infantry_reserves_desc: "Our nation is still rebuilding and while we may have one foot out the door, it's just as likely that we may trip moving the other foot. As such we must create a ready reserve force so we can prepare for the future, whatever it may bring."
 USB_mobilizing_the_reserves: "Mobilizing The Reserves"
 USB_mobilizing_the_reserves_desc: "The time has come to begin the active defense of our nation. Let us begin the mobilization so we are prepared for the battles to come."
 USB_coal_wars_two_event.1.t: "United Miners Migrate"
 USB_coal_wars_two_event.1.d: "As we've struggled to get the nation online, many miners both current and formerly employed are for some reason migrating towards the state of West Virginia. The United Mine Workers Association, a rebrand of the old UMWA have begun to organize and gather at political union rallies. We've yet to be reached out by the current president, Cecil Roberts, but with how things are going we should hear something soon."
 USB_coal_wars_two_event.1.o1: "What Are They, Migrating Birds?"
 USB_coal_wars_two_event.2.t: "The Black Pearl Proposal"
 USB_coal_wars_two_event.2.d: "Earlier today we finally heard word from the new UMWA. The president has asked and garnered a significant petition base to allow for the reopening of several mines in West Virginia. The state is estimated to have over some 20 billion tons of coal reserves and would certainly be a useful benefit to get cheap and easy energy into the homes and businesses that are just trying to survive. However the mines were closed due to the environmental concerns as a lot of the east coast deposits we occupy are of a higher sulfuric content. So the question is do we want to keep a modern standard or lower said standards for a quickened recovery."
 USB_coal_wars_two_event.2.o1: "The Black Pearl Shines Once More"
 USB_coal_wars_two_event.2.o2: "We Have Standards For A Reason"
 USB_coal_wars_two_event.3.t: "Funding Flows"
 USB_coal_wars_two_event.3.d: "With the negotiations going ahead swimmingly and funding finally on its way to West Virginia, the miners that have migrated have already begun work in re-opening old mines. This is a new age for the state and will be a great asset moving forward as we try to get the nation stabilized economically."
 USB_coal_wars_two_event.3.o1: "It Ain't Much, But Its Honest Work"
 USB_coal_wars_two_event.300.t: "Miners Protest Decision"
 USB_coal_wars_two_event.300.d: "With the recent verdict to strike down the Black Pearl Proposal, many of the miners which left their homes and migrated to what they believed to be a stable form of work and future stability have begun to organize protests. The local law enforcement also have noted an uptick in thefts related to fire arms as well as small scale riots. We'll need to prepare ourselves to handle this emergency as with the growing destabilization of the state we are in no real position to try and directly intervene."
 USB_coal_wars_two_event.300.o1: "What Did They Expect?"
 USB_coal_wars_two_event.301.t: "A Free State?"
 USB_coal_wars_two_event.301.d: "Without a shed of thought to the consequences they've done it. Local riots targeted what little arms and munitions there were in the state of West Virginia and in a swift act of what some have been calling, \"mob rule\", the UMWA has seize control and declared West Virginian independence. We need to rally what little forces we have and begin to reclaim what was rightfully ours. Last thing we need is someone else on the continent chipping away at our independence."
 USB_coal_wars_two_event.301.o1: "Where Have I Seen This Before?"
 USB_coal_wars_two_event.302.t: "The Second Coal Wars"
 USB_coal_wars_two_event.302.d: "To arms brothers and sisters of the earth, to arms I say! For it is on this day that the blinded bandits of Washington will determine our fate not more. We shall stand and fight to defend our right to mine and utilize the resources our dear mother earth provides to us. Let us rally and defend these lands so we can make this black pearl shine once more."
 USB_coal_wars_two_event.302.o1: "To Arms!!!"
 USB_coal_wars_two_event.303.t: "We March!"
 USB_coal_wars_two_event.303.d: "The time has come and we are as ready as ever. We shall march onto Parkersburg and secure the state of West Virginia once more."
 USB_coal_wars_two_event.303.o1: "Forwards Men!"
 USB_coal_wars_raise_mining_regiments_tt: "West Virginia will raise §Y15§! Mining Regiment divisions."
 USB_america_focus_establishing_a_govt: "Establishing A Government"
 USB_america_focus_establishing_a_govt_desc: "Chaos consumes the streets, we must secure a central command of civil government if we are to even think of doing anything."
 USB_america_focus_creating_a_police_force: "Creating A Police Force"
 USB_america_focus_creating_a_police_force_desc: "With a civil government in place we've got to re-establish a civil order department. The department of Civil Affairs will be establish and plan out as well as establish strategic police stations to help quickly set up a rump police force to quell general disorder."
 USB_america_focus_organizing_the_militias: "Organizing The Militias"
 USB_america_focus_organizing_the_militias_desc: "Roving gangs still cause massive amounts of continual damage. How are we to create any sense of a new society if we can't even cease the destructive nature of these anarchists. We've got state guards, national guards and some remnants of the army, so lets try and piece this puzzle together and see what, if any kind of picture we'll make with it."
 USB_america_focus_rebuilding_the_economy: "Rebuilding The Economy"
 USB_america_focus_rebuilding_the_economy_desc: "It ain't much, but its honest work...and frankly any work in better than no work."
 USB_america_focus_backyard_battleground: "Backyard Battleground"
 USB_america_focus_backyard_battleground_desc: "With the chaos mostly over and the direct capital region being as stable as possible, we must seek to control the state of Maryland if we are to get anywhere any time soon. Investments in manpower, security and economy will be made wholesale to ensure the control and stability of the state."
 USB_america_focus_from_backyard_to_frontyard: "From Backyard To Frontyard"
 USB_america_focus_from_backyard_to_frontyard_desc: "With the economic and civil investments comes now the naturalization of law and order. Establishing civil services and law will be able to solidify our control of our backyard that is the state of Maryland. Thus we will turn it around into the frontyard example for which to unite our nation under the new banner of the Free States of America."
 USB_america_focus_the_old_dominion_state: "The Old Dominion State"
 USB_america_focus_the_old_dominion_state_desc: "Somehow we've been able to keep in our grasps the old Dominion state that is Virginia. Though many thought they would've left for the southerners, we must've done something good enough if they consider themselves apart of us. Nevertheless their state is archaic and disorderly like the rest of our \"nation\" is. So we must invest and rebuild it if we plan on bringing back into the fold some sense of a nation."
 USB_america_focus_norfolk_novelty: "Norfolk Novelty"
 USB_america_focus_norfolk_novelty_desc: "With civil order and economic stability assured we can bring the old dominion into a new light. For the future we unite, for the future we will and must defend our rights. For the Free States."
 USB_america_focus_black_pearl_state: "The Black Pearl State"
 USB_america_focus_black_pearl_state_desc: "From the ashes of coal country comes West Virginia. Known for being almost a statewide ghost town since its failure to fully diversify and modernize. Its fall from grace due to the state's more sulpheric coal becoming unusable in the modern age. We need to show more love to the state, give it life so it may live on within our union. Who knows, maybe one day people will call West Virginia a new Mountain Momma."
 USB_america_focus_parkersburg_perfection: "Parkersburg Perfection"
 USB_america_focus_parkersburg_perfection_desc: "The coal is mined once more, the economy is stable once more. The state of West Virginia is looking up to the sky for new aspirations and now we must guide them and help them by cleaning up the streets and restoring civil services. The Blue Ridges shall shine once more."
 USB_america_focus_the_commonwealth_state: "The Commonwealth State"
 USB_america_focus_the_commonwealth_state_desc: "Pennsylvania, a state of diversity in land and peoples. With a rich history in industry, railroading and American history itself, we must seek to ensure the stability and economic future of the Commonwealth if we are to make sure our union is whole."
 USB_america_focus_from_rust_to_shine: "From Rust To Shine"
 USB_america_focus_from_rust_to_shine_desc: "From the rusting decay of a post industrial society, to the shining beacon of a diversified digital dynamic, the Commonwealth state shall be a piece within the puzzle of our new great nation."
 USB_america_focus_delaware_dilemma: "Delaware Dilemma"
 USB_america_focus_delaware_dilemma_desc: "Just like in the revolutionary war, we must cross the Delaware river, only not to destroy an enemy, but to rebuild and bring in a friend."
 USB_america_focus_delaware_delight: "Delaware Delight"
 USB_america_focus_delaware_delight_desc: "From the economic ruins to the proud forefront of revival, we embrace another dear state back into our loving arms. Forward we move to a brighter future, to delight in the company we now share."
 USB_america_focus_the_jersey_jumpstart: "The Jersey Jumpstart"
 USB_america_focus_the_jersey_jumpstart_desc: "One of the farthest states within our realm, yet also the other half of our portion of the rust belt. We must revive the state and give her a jump if we are to properly set the course and have a complete nation once more."
 USB_america_focus_the_trenton_turnaround: "The Trenton Turnaround"
 USB_america_focus_the_trenton_turnaround_desc: "In the streets they cheer, for the trenton triumph has come here. The people of New Jersey will enjoy peace and new prosperity from not only our economic investment but from the civil order and care we shall create by reintroducing civil services."
 USB_america_focus_the_great_reclamation: "The Great Reclamation"
 USB_america_focus_the_great_reclamation_desc: "Through countless investments, careful planning and a true show of national determination. We now can truly take off the shackles of the old world, old ideals and look to a future, a future of freedom. We can truly now say with pride that we are, The Free States."
 USB_america_focus_the_elections_question: "The Elections Question"
 USB_america_focus_the_elections_question_desc: "With the nation finally reorganized enough to create real political discussion, we now face the reality of what do we want in these early days of our new nation. Some want elections and some just want stability, in the end of it only time will tell where the nation's ambitions lay."
 USB_america_focus_ban_elections: "Ban Elections For Now"
 USB_america_focus_ban_elections_desc: "We need to focus on the now, stop relishing the past and stop dreaming of the supposed future we need. What we need is stability and action to run the nation now, so we can be able to worry about our future later."
 USB_america_focus_establish_elections: "Establishing Elections"
 USB_america_focus_establish_elections_desc: "We must come to an agreement as a nation of what direction we want to take, as such new elections will be held and the people will choose the future."
 USB_america_focus_federalist_rightist: "Federalist Right Takes Victory"
 USB_america_focus_federalist_rightist_desc: "With the election debate answered the national referrendum has seen the Federalist Party win and be the standing government in the foreseeable future. But with this also comes the reality that the Anti-election rightist faction has secured dominance. We'll see what choices they make to lead this new beacon of hope."
 USB_america_focus_federal_taxes_when_needed_not_wanted: "Christan Sandsworth Act"
 USB_america_focus_federal_taxes_when_needed_not_wanted_desc: "The Christan Sandsworth Act is a new way to look at how to create and reform a tax code for a society. Special sessions to change or reform portions of the tax code can be called by either the president or the main leader of the two chambers of congress. This session will focus on one central topic within the tax code and either vote to change and or reform it or vote to dismiss the measure. The main principle now, is that legislatures and people are looking to make a tax code based on need rather than want. What does the nation and our society need now, rather than want whenever."
 USB_america_focus_federal_many_hands_act: "Hardy Workers Act"
 USB_america_focus_federal_many_hands_act_desc: "The HWA is a series of reforms to help jumpstart economic growth and job employment. While we're still in the quote, stone age, we can nevertheless work in jumpstarting the road to refinement. Our inefficencies will be matched by our tried and trusted workers. Understanding the need to make new from what is old our legislative reforms seek to instill a new form of patriotism through the work place. Work hard now so we can play even harder later."
 USB_america_focus_federal_societal_progress_act: "Societal Progress Act"
 USB_america_focus_federal_societal_progress_act_desc: "The SPA will seek to make changes in society become more of a people issue rather than a political issue. States and locality can pass, reform and create their laws which can enforce the continuance of civil order and lawful conduct. However laws which may be considered discriminatory or impartial towards one group or another can be appealed to their state and if need be the federal courts. The court cases will be documented extensively to allow for public awareness and to get as much info out on the estranging subject so as to be able to have not only a favorable court ruling if need be, but to have the citizens in the localities or states better understand the issue and preceed in a manner which is better for as many as possible."
 USB_america_focus_federal_liberty_businesses_act: "Liberty Businesses Act"
 USB_america_focus_federal_liberty_businesses_act_desc: "The old order was entirely to strict in its business rules. If we are to rebuild at any noteworthy pace we must allow those who want to lead be able to have the tools and ability to do so. As such this bill will allow for a government assistance program as well as restricting the regulations to just the basics of human care and expectation of a modern society."
 USB_america_focus_federal_clear_minds_act: "Clear Minds Act"
 USB_america_focus_federal_clear_minds_act_desc: "The CMA will be an independent commission for anti-corruption affairs to make sure the government will run as smoothly as possible. Many see this as a way to tackle fears that the new government is just like the old, nevertheless a new age is hear and so lets start strong shall we."
 USB_america_focus_federal_the_liming_act: "The Liming Act"
 USB_america_focus_federal_the_liming_act_desc: "The Liming Act is a sort of spin on the German government's debt blocking legislations for how they make budgets. Only we're taking it a step further. Quantitative Easing policies will only be within a 5% threshold of the current GDP figures for that fiscal quarter. Any QE program created must be put towards a bill or legislation which in not covering no more than five distinctive things. Meaning you can't have a bill that has a supposed hundred different things to allocate for but only have say $50 to actually allocate towards."
 USB_america_focus_federal_industrial_standards_act: "Industrial Standards Act"
 USB_america_focus_federal_industrial_standards_act_desc: "The ISA will look to create a new and modern standard for which we should be starting at when it comes to economic development and the businesses and industries we attempt to create. It is one thing to compete with the globe, its another to actually care and compete with one's self."
 USB_america_focus_federal_remechanization_act: "Re-Mechanization Act"
 USB_america_focus_federal_remechanization_act_desc: "Our population despite the shrinking state of it is still vast. We can do so much more to help our population by getting back on top of modern forms of mechanization and automation. The future truly is now and we must seize this future for not only us but the very people we serve."
 USB_america_focus_federal_scraping_up_defense_industries: "Scraping Up Defense Industries"
 USB_america_focus_federal_scraping_up_defense_industries_desc: "While we may not be as strong as we once were, we gotta start somewhere. Piecing together any remnants of our defense industry will allow us to at least somewhat supply whatever army we have left."
 USB_america_focus_federal_reset_act: "The Reset Act"
 USB_america_focus_federal_reset_act_desc: "With the nation having shut down and reset itself to practically an infantile state, we must seek out a new start to our power grid. The old system was cumbersome, woefully out of date and not to mention painfully open to attacks. The Reset Act will create a new baseline for planning, building and securing our new power grid as well as securing the ability to expand it when the nation's needs arise."
 USB_america_focus_federal_appalachian_act: "Appalachian Act"
 USB_america_focus_federal_appalachian_act_desc: "The Appalachian Act is a government investment initiative to revitalize and get back on track with the resources of the land for which we still luckily hold on to. With this in mind we do hold a significant part of the Appalachian Mountain ranges and as such we must understand, survey and bring forth the minerals and ores so our nation may prosper and strive to better again what was once lost."
 USB_america_focus_military_distinctions_act: "Military Distinctions Act"
 USB_america_focus_military_distinctions_act_desc: "The MDA is a starter investment bill to directly fund, standardize and make distinctive the army of the Free States. These new standards in training, planning and organization as well as more or less beginning to standardize our military industrial power will allow for at the very least us to defend our homes if we were to be invaded in the near future."
 USB_america_focus_naval_distinctions_act: "Naval Distinctions Act"
 USB_america_focus_naval_distinctions_act_desc: "Following on the heels of the MDA the NDA seeks to revitalize whatever ships, servicemembers and installations we have left from the pre-divided days. Its not much in terms of a start, but with our growing industry and our nation coming back to stable means we'll surely get there."
 USB_america_focus_national_pride_initiative: "Free States Day"
 USB_america_focus_national_pride_initiative_desc: "The National Pride Initiative is a national holiday being dubbed as Free States Day, this day which is both a bank holiday as well as a general national holiday that everyone will have off except vital services which will only be allowed to work in shifts of four hours on this specific day. The point is to celebrate the progress we have made as a nation and to give back to our people. The mandate is to essentially give as many people in the nation a dedicated day off for all possible and plausible."
 USB_socialist_statist_victory: "Free Socialist Party Statist Faction Wins"
 USB_socialist_statist_victory_desc: "The conclusion to the national poll is a victory to the Free Socialist Party, not only that but their Statist oriented faction. This faction is focused on more central authority and national unity as apart to their \"Anarchist\" counterparts. Nevertheless we'll see what this supposed Red Dawn has to provide and hopefully a brighter future will be in store for the citizens of this new great nation."
 USB_socialist_statist_socialized_industry: "Socialized Industry"
 USB_socialist_statist_socialized_industry_desc: "The public has lost its way and as such we must sponsor and ensure employment and industrial growth. This way not only do we understand more directly the economic condition but the effects our programs have on people so we can adjust to better help them."
 USB_socialist_statist_reformed_welfare_state: "Reformed Welfare State"
 USB_socialist_statist_reformed_welfare_state_desc: "A welfare state is a like a parent. There to help you when you're down and guide you to better yourself. The old welfare states focus more at only just catching people, where as our reformed welfare will not only catch but stand them up and get them back on the journey of life. Through adapting funding as well as prioritization of programs for reintegration we'll make sure our programs pay for themselves."
 USB_socialist_statist_socialized_education: "Socialized Education"
 USB_socialist_statist_socialized_education_desc: "Uniformed public education. This is the standard and foundation we will make so we uplift our people as well as show we can not only create the standards, but break and raise them."
 USB_socialist_statist_the_peoples_army: "The People's Army"
 USB_socialist_statist_the_peoples_army_desc: "We are surrounded by nations which fear our ideas and our ideals. Haunted by the spectre of Authoritarian Socialism which has plagued history and given the economic model its stigma, we must look to defend our people, our homes and our very ideals which make us a proud and strong nation."
 USB_socialist_statist_tax_brackets_act: "The Tax Brackets Act"
 USB_socialist_statist_tax_brackets_act_desc: "The TBA is a comprehesive legislation to overhaul and set the modern standard of what it means to have a progressive tax code. The basics of tax brackets is that there are now 16 tax brackets which have uniformed differences in monetary scope as well as the percentage increases are smoother and more literally progressive. The final bracket and of course the highest is anything over $250,015 taxed at 40%. While yes this does sound steep we must look to the actual difference in real proportional value of the average person's income being taken via taxes. As such this is why we must have such a smooth tax code to ensure this true form of equality and shared societal contribution towards developing our economy and ensuring the schools, emergency services and so forth our looked after and funded properly."
 USB_socialist_statist_millennium_labor_reforms_act: "Millennium Labor Reforms Act"
 USB_socialist_statist_millennium_labor_reforms_act_desc: "The MLRA will fundamentally change how labor relations as well as laws are passed. Though the legislatures will officially pass and sign bills into laws, a joint union and business relations committee will be established having equal representation between unions and industrial leadership coorisponding to the established unions. This committee will work together to centralize complaints and ideas to better not only the workers lives, but to balance that workers needs with proper economic backing as well. After all, half compromising is no real compromise."
 USB_socialist_statist_modern_geology_act: "Modern Geology Act"
 USB_socialist_statist_modern_geology_act_desc: "The Modern Geology Act is a government investment initiative to build up the raw materials industries as well as boost the baseline of our economy. Through targeted research and geological surveys we'll set up new mines and controlled forestry industries to allow a surplus of raw materials wherein we can create a modern economy."
 USB_socialist_statist_modern_marxism: "Modern Marxism"
 USB_socialist_statist_modern_marxism_desc: "In the new millennia tech and technology is the prime luxury to those in the civilian, military and all sorts of economy sects and walks of life. As such we must ensure a dedicated part of our economy is geared towards the tech sector and innovations."
 USB_socialist_statist_national_security_act: "National Security Act"
 USB_socialist_statist_national_security_act_desc: "The NatSec Act is legislation dedicated to ensure the security and safety of our nation and its citizens. A federal agency known as the Internal Security Division will coordinate and help with training, regulating and distributing federal funding for local law enforcement agencies. Uniformity and standards are what is needed to ensure the integrity and safety of our nation and its ideals."
 USB_socialist_statist_manufacturing_investments: "Manufacturing Investments"
 USB_socialist_statist_manufacturing_investments_desc: "With little to no domestic manufacturing we must invest in developing this critical sector of our economy if we are ever to grow and look to our goals."
 USB_socialist_statist_department_of_anticorruption_affairs: "Department of Anti-Corruption Affairs"
 USB_socialist_statist_department_of_anticorruption_affairs_desc: "The DACA is a an independently created and federally sanctioned institution wherein anti-corruption investigations and general auditing of the government can be conducted. The department while federally sanctioned in law, is not actually apart of the federal government and has no real control over it. This disconnect will allow for the maximized effectiveness in conducting government audits and ensuring the best form of transparency for our citizens and future administrations. Lets try and not repeat our past huh."
 USB_socialist_statist_modern_agrarian_reforms: "Modern Agrarian reforms"
 USB_socialist_statist_modern_agrarian_reforms_desc: "The world needs food, whether its our own people or those in less fortunate areas and or nations of the world. Therefore we must fine tune and revolutionize our agriculture industry to better suit our domestic needs and even help those in the world. This growth and dependency will allow us also to experiement and increase fuel diversification through bio-fuel programs. Ethonol has always been a bit of a red headed step child in the fuel world and as such why not give it the care and love it needs to make it a better version of itself."
 USB_socialist_statist_coastal_security_act: "The Coastal Security Act"
 USB_socialist_statist_coastal_security_act_desc: "The CS act is limited investments into rebuilding and or at the very least bringing back online any naval personnel and naval vessels which we still have under our control. Though nothing of grand amount, its still enough to have a start considering we don't have a continents worth of coastline to worry about anymore."
 USB_socialist_statist_energy_conservations_act: "Energy Conservations Act"
 USB_socialist_statist_energy_conservations_act_desc: "The legislature has recently proposed a bill to invest in dedicated energy R&D projects as well as better streamlining and growing our electrical grid. We hope that in the end we'll be able to not only produce more energy for our nation's needs, but be able to utilize this growing demand in a efficient way. In other words, shrink our demand whilst it grows, a sort of balance if you will."
 USB_mid_atlantic_isolationist_victory: "Mid-Atlantic Isolationist Faction Victory"
 USB_mid_atlantic_isolationist_victory_desc: "The MAP or Mid-Atlantic Party has seized the victory in the national poll. This faction however is a strong isolationist faction wherein the idea of expansion is seen as pointless waste of human and natural resources. While many are wondering if they even care that the old republic fell, more are just tired of the struggling and reset to their daily lives. So for now peace is understood and prosperity is the goal. Glory to the Mid-Atlantic States of America."
 USB_mid_atlantic_self_determination_act: "Self Determination Act"
 USB_mid_atlantic_self_determination_act_desc: "The SDA is a bill which will help solidify our national ethos. We wish to live, thrive and cooperate with those in the world. While we do miss the old days, we must look to new mornings and prospects if we are to truly go anywhere in life's big game."
 USB_mid_atlantic_raw_materials_act: "Raw Materials Act"
 USB_mid_atlantic_raw_materials_act_desc: "The government has recent passed and investment scheme to grow and prop up our raw materials and primary resource industries. In order to build up we must have a foundation for which to build upon, this foundation will be marked by our primary resource sectors and ability to have the materials needed to grow our manufacturing capabilities."
 USB_mid_atlantic_dedicated_automation_investments: "Dedicated Automation Investments"
 USB_mid_atlantic_dedicated_automation_investments_desc: "In order to rebound our economy into the modern age, we must seek out dedicated investments in terms of automations to allow our manufacturing to be competitive with regional powers."
 USB_mid_atlantic_atlantic_education_initiative: "Atlantic Education Initiative"
 USB_mid_atlantic_atlantic_education_initiative_desc: "The AEI is an education funding bill to grow our education system's ability to teach and raise the standards of knowledge our citizens will be equipped with in life."
 USB_mid_atlantic_atlantic_care_act: "Atlantic Care Act"
 USB_mid_atlantic_atlantic_care_act_desc: "The Atlantic Care Act is a healthcare betterment budget to standardize as well as increase both the capacity and standards for which healthcare is administered to our general population. Both public and private option are to be available with the commonality of regulations into the overall tendancy of administration overbloating problems. Now people can know that their money is going to their care instead of only administrators and paper pushers."
 USB_mid_atlantic_department_for_transparency: "Department Of Transparent Affairs"
 USB_mid_atlantic_department_for_transparency_desc: "The DoTA will be an independent government agency that will be able to investigate the government for corruption and general misconduct in terms of carrying out their duties and responsibilities as governmental leaders."
 USB_mid_atlantic_tech_development_grants: "Tech Development Grants"
 USB_mid_atlantic_tech_development_grants_desc: "The new millennia brings new industries, as such a rising star is the tech sector. The tech sector is a vital growth spot for any modern economy and we must ensure we have our own. Therefore development grants will be relinquished to business ventures looking to create new tech sector businesses in order to not only boost our economy but our societal integration with these ever growing inovations in goods and services."
 USB_mid_atlantic_blue_ridge_act: "Blue Ridge Act"
 USB_mid_atlantic_blue_ridge_act_desc: "Resources, simply put we must secure more domestic supplies if we are to be a true new pillar in this hemisphere."
 USB_mid_atlantic_naval_securities_act: "Naval Securities Act"
 USB_mid_atlantic_naval_securities_act_desc: "We are a small nation now and as such we must ensure the defense of our coastal waters to ensure the security of our national sovereignty."
 USB_mid_atlantic_guardian_angels_act: "The Guardian Angels Act"
 USB_mid_atlantic_guardian_angels_act_desc: "The modern queen of the battlefield is the air force. This key understanding must be invested into if we are to ensure our ability to be a free and independent nation in this new age."
 USB_mid_atlantic_prospectors_initiative: "Prospectors Initiative"
 USB_mid_atlantic_prospectors_initiative_desc: "Autarky...autarky is the word for which the modern age shuns and scolds as backwards. Though its core principle of isolation is, the reality is that a healthy nation is one which can be self reliant. Therefore we are creating a new Homestead Act known as the Prospectors Initiative. Through regulations related to the extraction of resources, families and or individuals that are willing to settle lands of up to five acres will be able to own that land in return for a contribution in the natural resources which may occupy it to the national economy."
 USB_mid_atlantic_planned_policing_program: "Planned Policing Program"
 USB_mid_atlantic_planned_policing_program_desc: "The PPP is a joint federal and local initiative to galvanize public understanding and values of the police forces of the nation. Community outreach programs as well as conventions and so forth will be hosted and planned to allow for the public and the police to better understand as well as genuinely appreciate each other. In short this sometimes gravely misunderstood nature of what it means to not only enforce the law but what it means to be a law abiding citizen. Unity, Not Division."
 USB_mid_atlantic_energy_advancements_act: "Energy Advancement Act"
 USB_mid_atlantic_energy_advancements_act_desc: "The Energy Advancements Act is a complex spending package. Research grants into energy production and consumption, investments into grid modernization as well as regulations towards setting new standards in how we move forward in dealing with future energy demands."
 USB_mid_atlantic_the_true_green_way: "The True Green Way"
 USB_mid_atlantic_the_true_green_way_desc: "Nuclear energy, the future of mass production of energy itself next to of course harnessing the sun itself. But nuclear energy is always such a flimsy thing in the political world. Fearmongers hold onto the mistakes of the past, detracting any sort of nuances. Nuclear hawks tought its energy benefits but forget the nuances in things like planning and the potential side effects of militarization. Nevertheless, we move forward in making key investments into nuclear power production. We must show the world the best way forwards is to not be stuck in the past, or dwell on the present."
 USB_nsp_militarist_faction_victory: "National Service Party Militarizes Victory"
 USB_nsp_militarist_faction_victory_desc: "The poll has come back and the NSP or National Service Party has come out on top. However many are not happy about such an agreement and so the NSP's Militarist faction has used this as a way to win the party struggle. Now leading members of the NSP are in other words \"Militarizing Victory\", wherein the military, the people who serve and just the idea of security itself is the victory which the people have voted for. While some fear the messaging can be seen as fearmongering, others are just looking to move forward and rebuild what was once lost. Let's See what they can do has become the silent saying."
 USB_nsp_meritocracy_act: "The Meritocracy Act"
 USB_nsp_meritocracy_act_desc: "The Meritocracy Act or some also call the Merit Act, is a comprehensive legislation which reforms and overhauls the appointment and vetting process of individuals seeking to be in leadership positions in the government be it federal, state or local. The process focused on extensive background checks in things like personal creed, experience as well as proven accomplishments and deeds within their job fields will allow for us to pave the way for a true technocratic approach to government and administration. The reviewing departments will be independent comissions with people outside of any direct or indirect affiliation with said reviewed individuals to keep transparency and justness of the review in the highest possible of standards."
 USB_nsp_industrial_investments: "Industrial Investments"
 USB_nsp_industrial_investments_desc: "To ensure domestic security a strong civilian economy is just as good as a strong military economy."
 USB_nsp_military_investments: "Military Investments"
 USB_nsp_military_investments_desc: "We must be ready for anyone of our neighbors to get a funny idea and try to subdue us. As such a host of limited investments to jumpstart the military economy and the armed forces readiness are well overdue."
 USB_nsp_maritime_investments: "Maritime Investments"
 USB_nsp_maritime_investments_desc: "Our coast is vast and must be defended, on the other hand these initial investments will boost the civilian economy in terms of trading and spreading awareness to our cause."
 USB_nsp_the_national_arteries_act: "The National Arteries Act"
 USB_nsp_the_national_arteries_act_desc: "The NAA is a mass infrastructure investment plan to revitalize and update the practically crumbling state of our national infrastructure. We must set a standard of throughput if we are to connect our nations' people as well as its economy and military readiness to the forefront of crisis management standards for which we will set new records for said standards."
 USB_nsp_department_of_internal_investigation: "Department OF Internal Investigation"
 USB_nsp_department_of_internal_investigation_desc: "The DII is a focused anti-corruption affairs agency to ensure the stability and fortitude of our meritocracy. We must create the ethos of selfless service both in military and civilian jobs if we are to ensure the longevity and stability of our nation."
 USB_nsp_national_high_command: "National High Command"
 USB_nsp_national_high_command_desc: "With the civilian and military parts of our society being so different we must learn to better integrate and make whole these divisions of reality. Therefore as well as investments into the national security of the capital region of our nation a new reorganization of the leadership structure of the nation will be implemented. Our Commander in Chief will now have the combined title of Marshal of Society, this title shortened to simply Marshal, will unify the understanding that civilian and military affairs are but one unifying matrix to the cohesion and survival of our fair and small nation."
 USB_nsp_mini_steel_belt: "Mini Steel Belt"
 USB_nsp_mini_steel_belt_desc: "With domestic priority our number one priority we must secure the cornerstone of modern building and manufacturing support. The Mini Steel Belt investment program will see wide investments in West Virginia and Pennsylvania to polish off and renew what little of the \"Rust Belt\" we have left."
 USB_nsp_militarizing_society: "Militarizing Society"
 USB_nsp_militarizing_society_desc: "Voltaire once said that the nation of Prussia was not a state with an army, but rather an army with a state. To this we say this should be a statement of reality itself. No society needs a military and yet a military doesn't earnestly need the society. With this in mind we must unite in full cohesion the military and society itself. Work ethics, education and the further development of technology as well as governance can and will be organized like it was the military itself. Encouraging the full merits of a meritocracy, the strive of betterment to oneself as well as the body of the society at large."
 USB_nsp_energy_investments: "Energy Investments"
 USB_nsp_energy_investments_desc: "With our mobilization of the economy as well as the rebuilding of our military it is in our best interests to ensure the energy needs of not only our people but our military are met. While these may not be immediately solved, this investment and research grants will allow for better development of new efficient methods of not only energy production but of energy consumption."
 USB_nsp_top_priority_budgeting: "Priority Budgeting"
 USB_nsp_top_priority_budgeting_desc: "We hold control of several ports and significant naval dockyards leading to a naval influenced direction. As such with our coast size, our growing trade and the potential incursion of foreign adversaries, we must set up a priority system in our budgeting to ensure the defense of our nation and its people."
 USB_nsp_expanding_jersey_foundries: "Expanding The Jersey Foundries"
 USB_nsp_expanding_jersey_foundries_desc: "The foundries and metalurgic mills of New Jersey produce a diverse set of light metals. These light metals are critical for civilian as well as military expansion and as such we will invest into New Jersey all around to make it more on par with our growing demands as a nation."
 USB_nsp_defensive_expenditure_warfare: "Defensive Expenditure Warfare"
 USB_nsp_defensive_expenditure_warfare_desc: "With our backs to the sea already given our geographic location, we must ensure the survival of our nation. With this in mind R&D as well as budgeting for the army has been set to a strict defensive mindset. Understanding that our adversaries are many we must be vigilent in holding the line while also being able to hold onto the means of war production. As such the development of a new doctrine of warfare is our highest priority from here on out we will be developing what is known as Defensive Expenditure Warfare."
 USB_nsp_the_new_identity: "The New Nation"
 USB_nsp_the_new_identity_desc: "With the solidification of our nation, its people, military and ethos. We must come up with a new name to ensure this new found identity. For we are no longer simple the Free States of America, we are the Mid-Atlantic Union."
 USB_america_focus_federalist_liberals_win_election: "Federalist Liberals Win Election"
 USB_america_focus_federalist_liberals_win_election_desc: "The election results are in and it looks to be that the Federalist Party has secured a victory. This victory also seems to have shifted the party balance into a more liberal apparatus as the main supposed conservative members were anti-election. One of the previous members stating \"Elections are a distraction to the national survival\", nevertheless the people look forward to any change, especially a return to hopeful normalcy."
 USB_states_focus_fed_left_national_works_administration: "National Works Administration"
 USB_states_focus_fed_left_national_works_administration_desc: "The NWA is a new dedicated government administration to help economic building. Through planning of infrastructure and government based economic ventures, this should in turn reduce unemployment as well as be a slight stimulant to the economy even in down times."
 USB_states_focus_fed_left_industrial_development_committee: "Industrial Development Committee"
 USB_states_focus_fed_left_industrial_development_committee_desc: "With the establishment of the IDC, the nation's industrial development will be able to have a purely private sector format with the additional help of government programs to allow for the diversity of not only the industries present but of where they'll be established as a way to ensure a balanced manner to not leave one community, county or perhaps even a whole state lagging behind from its contemporaries."
 USB_states_focus_fed_left_department_of_innovation: "Department Of Innovation"
 USB_states_focus_fed_left_department_of_innovation_desc: "The DoI or Department of Innovation is a federally sponsored research and development institution to fund and work with private research firms in innovation and general scientific advancements in fields critical to the raising of the the national standard of living. As such with substantial funding we will make up for this national setback and set forth the pathway to the future."
 USB_states_focus_fed_left_education_standards_act: "Education Standards Act"
 USB_states_focus_fed_left_education_standards_act_desc: "The ESA is a bill which will set the baseline expection within the nation's education system. No more of the old system where almost every county had its own variation of how things were taught to achieve the supposed sme end results. From now on the curriculum will be standardized and expected to be upheld in for each respective education level, regardless of where the institution is located within the nation."
 USB_states_focus_fed_left_automation_advancements_act: "Automation Advancements Act"
 USB_states_focus_fed_left_automation_advancements_act_desc: "The AAA will see direct funding into the expansion and standardizing industry practices in terms of acquiring and implementing different technologies which automate the production process. In short, more investments to make more from less so we can have more to make more."
 USB_states_focus_fed_left_the_true_deal: "The True Deal"
 USB_states_focus_fed_left_the_true_deal_desc: "The True Deal is a massive economic package looking to invest, diversify through available and found natural resources, as well as create a central infrastructure network in the mostly central part of the nation. Industry, infrastructure and new mining initiatives will pave the way to the future for which we wish to have for our people. This really is a True Deal for the citizens."
 USB_states_focus_fed_left_department_of_internal_investigation: "Department Of Internal Investigation"
 USB_states_focus_fed_left_department_of_internal_investigation_desc: "The DoII or more commonly known as the Oligarch Obliteration Bureau, is an independently formed anti-corruption agency tasked with regularly investigating and keeping in check those who are apart of the federal government. The independent body is made up of elected individuals based on three main criteria. 1. Being some kind of administration and or investigation background. 2. Being politically apathetic or of a non-voting background to ensure the integrity of the institution. 3. Representatives must be balanced within all main social classes from each respective state to ensure diversity in perspective to understand the simplist and at the same time most complex ways one can cause corruption. This institution will be a cornerstone in ensuring the Free, in Free States of America."
 USB_states_focus_fed_left_old_power_is_still_power: "Old Power Is Still Power"
 USB_states_focus_fed_left_old_power_is_still_power_desc: "With our economy coming back online and our demands outpacing our production we must seek out cheap ways to produce power if we are to stay ahead of the growth."
 USB_states_focus_fed_left_new_power_is_balanced_power: "New Power Is Balanced Power"
 USB_states_focus_fed_left_new_power_is_balanced_power_desc: "With the turn of the millennia, the investments and development of renewable energy generation technologies has been astounding. We must diversify our generation and use these renewables to instill the power we demand, what we will need in the future and if things go well enough. We just might be able to use this excess energy to our advantage."
 USB_states_focus_fed_left_future_power_is_future_proofing: "Future Power Is Future Proofing"
 USB_states_focus_fed_left_future_power_is_future_proofing_desc: "The future is both now and beyond, if we are to innovate we must seek to at least expose and understand the energy production means associated with such. Nuclear fission will fit into our well rounded means of energy production and be a great boost to our economy overall. Not only that but with proper investments in R&D, who knows, maybe Fission will go our and Fusion will be the new future. Only time shall answer that question."
 USB_states_focus_fed_left_the_substations_act: "The Substation's Act"
 USB_states_focus_fed_left_the_substations_act_desc: "This bill is a comprehensive research and infrastructure investment scheme to ensure the efficiency as well as the proctections needed with such rapid growth and expansion of our electircal grid. All in all we must not only grow our power generation needs, but we must be more efficient in how we consume said power."
 USB_states_focus_fed_left_the_self_defense_act: "The Self Defense Act"
 USB_states_focus_fed_left_the_self_defense_act_desc: "Despite its name, the SDA is not a civil law change but rather a military, more specifically an army investment and development fund. Our current situation grows more weary with each passing day. Foreign powers wish to seek out and take what we have rightfully created, well we will ensure that does not happen."
 USB_states_focus_fed_left_freecare_program: "The Freecare Program"
 USB_states_focus_fed_left_freecare_program_desc: "Freecare is our way of rolling out a form of universal welfare system. Outlining the needs of our people, we will invest in both domestic and acquiring foreign medical professionals and allow for a four tiered system of levels of care needed for citizens. These levels of care will allow the administration side of things to organize how quickly and efficiently care can be distributed to a growing population by understanding the severities of illnesses and injuries along with those professionals on the ground can sign off on a potential increase in level at the current time if a patient suddenly changes in terms of condition. Afterall, nothing is certain in life, but death itself."
 USB_states_focus_fed_left_mid_atlantic_fleet: "Mid-Atlantic Fleet"
 USB_states_focus_fed_left_mid_atlantic_fleet_desc: "Despite the fact we do hold a significant amount of the former ships of the old order, our position is tenuous at best. Most naval yards and facilities are run down and in need of repairs and renovations to get back on par with even a nation like say Australia or Portugal. Therefore a significant naval fund will be used to dedicate this overhaul to allow for the unmothballing of our current naval state."
 USB_america_focus_anarchists_fsp_anarchist_victory: "FSP \"Anarchists\" Collectivize Victory"
 USB_america_focus_anarchists_fsp_anarchist_victory_desc: "In a shocking turn of events the Free Socialist Party has come out on top, being comprised of various flavors of red the recent shift in pro-elections has seen the party shift from a hardline Marxist/Authoritarian Socialism, to a now more balanced, be it confusing balance, but a balance of European styled Social Democrats and what some joke as \"Pseudo Anarchists\", for their ability to be more cooperating in a system that involves a state. Nevertheless the election was won by the FSP and now it is only the future and party leadership to determine the future of our nation."
 USB_america_focus_anarchists_communalcare_program: "CommunalCare Program"
 USB_america_focus_anarchists_communalcare_program_desc: "The CCP, ironic huh, is a dedicated welfare program system that relies on subsidized funding of locally created care facilities wherein the locals for that town and or municipality get care from people within that municipality. Of course there will always be a need for people to help those in need, but the essence of the facility is that it was founded by locals to care for local. Think eldercare and child care, after all didn't Jesus say Love Thy Neighbor."
 USB_america_focus_anarchists_red_rose_health: "Red Rose Health"
 USB_america_focus_anarchists_red_rose_health_desc: "The RRH program is a dedicated healthcare program to create the steps towards a universal healthcare system. Assessing what each state needs, these state by state branches are able to divide their control into regional subsets and allow for the counties to give proper feedback. In turn we hope to set up a proper command like structure to allow for the least paperwork and the ease of control. Since the failures of most UH type programs goes from more administrators than healthcare personnel."
 USB_america_focus_anarchists_syndicate_industries: "Syndicate Industries"
 USB_america_focus_anarchists_syndicate_industries_desc: "The trade unions are a significant part of our voting base and a great influence in the old rust belt states. As such we must develop and ensure the trade unions with real jobs and future development if we are to keep our position."
 USB_america_focus_anarchists_social_tech_incorporated: "Social Tech Incorporated"
 USB_america_focus_anarchists_social_tech_incorporated_desc: "The modern age requires modern industries, the tech and services industries are the future. As such we will invest and diversify our economy to grow our abilities to not only increase the quality of life of our citizens but also export these things and gain foreign attention and investment."
 USB_america_focus_anarchists_community_defense_act: "The Community Defense Act"
 USB_america_focus_anarchists_community_defense_act_desc: "With the world being a dangerous place and foreign powers looking to exploit our very timid position. We must seek out a way to defend ourselves and thus we must look to not only the army but to the communities of our nation to want to defend their homes and families."
 USB_america_focus_anarchists_civil_affairs_administration: "Civil Affairs Administration"
 USB_america_focus_anarchists_civil_affairs_administration_desc: "The CAA is a dedicated body to dealing with auditing and anti-corruption affairs. We must instill the highest standard of ethics to ensure the people as well as the world recognizes we are a real government, a real nation and a genuine society to be respected and helped."
 USB_america_focus_anarchists_red_ducation_act: "Red-ducation Act"
 USB_america_focus_anarchists_red_ducation_act_desc: "The Red-ducation Act is a large education investment to standardize and improve what we teach, why we teach and the overall goal of what our education system is in terms of the betterment of our society."
 USB_america_focus_anarchists_foreign_relations_act: "Foreign Relations Act"
 USB_america_focus_anarchists_foreign_relations_act_desc: "With our government beign aligned with a lot of those nations across the pond per say. We can prioritize policing and government budgeting to ensure trade deals and worker exchange programs are both secure and beneficial to both parties."
 USB_america_focus_anarchists_mineral_expansion_act: "Mineral Expansion Act"
 USB_america_focus_anarchists_mineral_expansion_act_desc: "The MEA will see our mineral and resource extraction industries better. Through introducing new tech and regulations as well as dedicated government grants to expand or start new mineral operation, we will ensure our national success into as best as well can to sustain our domestic needs."
 USB_america_focus_anarchists_the_interstate_renewal_act: "The Interstate Renewal Act"
 USB_america_focus_anarchists_the_interstate_renewal_act_desc: "The interstate system is the veins of our nation's economy and social cohesion. We must clean, clear and build stronger and more reliable veins if we are to have a strong and healthy nation."
 USB_america_focus_anarchists_consumer_industry_advancements: "Consumer Industry Advancements"
 USB_america_focus_anarchists_consumer_industry_advancements_desc: "To ensure our domestic quality improvement on top of our economic competitiveness, we must invest and ensure the implementation of new advancements in automation. On top of that we must find new techs to include in our industries to increase not only the quantity yet keep the product's quality as well."
 USB_america_focus_anarchists_parker_harrison_act: "Parker-Harrison Act"
 USB_america_focus_anarchists_parker_harrison_act_desc: "The Parker-Harrison Act is a national investment into our energy needs. Investments in new power plants, technologies as well as regulations and innovations into efficiencies related to consumption of said energy. We will secure the energy needs of our citizens and raise the standards of what a modern nation should have."
 USB_america_focus_anarchists_family_unity_program: "Family Unity Program"
 USB_america_focus_anarchists_family_unity_program_desc: "The FUP is a program and tax relief for families of dedicated size of three children or more. This ensures the domestic family unit be strong while giving them the resources to keep that unity so that our human capital will be for the betterment of our nation. For as our economy grows our people must be able to grow and live the lives they want to live."
 USB_america_focus_anarchists_army_readiness_act: "Army Readiness Act"
 USB_america_focus_anarchists_army_readiness_act_desc: "The national preservation is one of our top priorities to keep and hold what is dear to our way of life. As such investing in our military and specifically our army to bolster the defense of our nation and its people from foreign foes."
 USB_mid_atlantic_identitarian_victory: "Mid-Atlantic Identity Win Election"
 USB_mid_atlantic_identitarian_victory_desc: "The MAP or Mid-Atlantic Party has won the election to ironically not many people's surprise. What is surprising is that the party has shifted more into an identitarian party with the number one goal of creating an Atlantic States identity. But for now they are content with the Mid-Atlantic identity and holding as well as securing the homefront first and formost."
 USB_mid_atlantic_identitarian_rust_to_riches: "Rust To Riches"
 USB_mid_atlantic_identitarian_rust_to_riches_desc: "A third of our nation is apart of the old rust belt....these states use to be the defining prowess of the 20th century's industrialism. Now they lay there, dead, decaying and suffering. Well no more, we will rebuild, we will repair, polish and make these rusting states into shining beacons of our nation."
 USB_mid_atlantic_identitarian_the_old_black_gold: "The Old Black Gold"
 USB_mid_atlantic_identitarian_the_old_black_gold_desc: "The state of West Virginia is a state suffering by the passage of time itself. With the situation as it is we must develop and ensure that this \"old gold\", be used in the new age. Research and investments into an overhaul like development of the state will allow it to florish and prosper once more."
 USB_mid_atlantic_identitarian_naval_novelty: "Naval Novelty"
 USB_mid_atlantic_identitarian_naval_novelty_desc: "The decay of our naval readiness is something which opens literally the seas to have us attacked. We will refurbish and develop our navy and naval industries if we are to secure our coastline at all."
 USB_mid_atlantic_identitarian_national_defense_act: "National Defense Act"
 USB_mid_atlantic_identitarian_national_defense_act_desc: "The National Defense Act is an army development and readiness funding as well as legislation to improve our abilities to defend our nation on land. Things like the national guard as well as the idea of a mandatory service period have also been proposed but uncertain if we should go that far so quickly."
 USB_mid_atlantic_identitarian_aviation_development_fund: "Aviation Development Fund"
 USB_mid_atlantic_identitarian_aviation_development_fund_desc: "The ADF is legislation dedicating defense spending to the development and modernization of our air force... Something which has fallen down the worst in terms of near disorganization and lack of knowledge to even continue the service. Everyone knows how to play soldier and sailor, but flying a plane of any kind requires a proper physical standard and ability to learn and understand the equipment."
 USB_mid_atlantic_identitarian_military_influenced_education: "Military Influenced Education"
 USB_mid_atlantic_identitarian_military_influenced_education_desc: "The education system is a system to teach and prepare the youth and future generations for the supposed \"Adult World\". As such our world is not so bright and we must have a small but highly dedicated influence and exposure of the military and military life through programs and or classes like the JROTC or Junior Reserve Officer Training Corps as well as specialized PE classes. This way it will passively boost military recruitment and duty to the nation regardless if they decide to join up or not. The JROTC program can not only be used to prepare potential soldiers, but teach kids things like public speaking, leadership qualities and group work which all work just as well in the military as they can in the civilian world."
 USB_mid_atlantic_identitarian_service_member_tax_breaks: "Service Member Tax Breaks"
 USB_mid_atlantic_identitarian_service_member_tax_breaks_desc: "Our national defense and the preservation of our new found identity is that which we hold dear. Thus as our citizens who choose to defend such should be looked after through tax reliefs and certain stipend based supplements to service member families."
 USB_mid_atlantic_identitarian_pseudo_mobilized_economy: "The \"Mobilized\" Economic Model"
 USB_mid_atlantic_identitarian_pseudo_mobilized_economy_desc: "The Pseudo Mobilized Economy is a economic model that hybridizes manufacturing industries to go about the normal production methods and so forth. The deviation is that a small dedicated segment of each industry will have roughly five to ten percent of said industry dedicated to some kind of military production. With each main business dedicated to a specific equipment and or class of equipment to produce, the actual breakdown between each businesses factories is up to the business leadership as long as they meet or come close to the expected quotas and as well as ensuring the quality of produced equipment."
 USB_mid_atlantic_identitarian_the_new_nation: "The New Nation"
 USB_mid_atlantic_identitarian_the_new_nation_desc: "From now on we are no longer just the \"Federal remnants of a bygone era\". We will now be known as the Mid-Atlantic Federal Union. A purer union based on the new found identity and culture we have spent to grow and call our own. Of course we respect the past, hence the Federal Union, but nevertheless this is a new step forward and it can only be up from here."
 USB_mid_atlantic_identitarian_developing_the_arms_industry: "Developing The Arms Industry"
 USB_mid_atlantic_identitarian_developing_the_arms_industry_desc: "To solidify our ability to hold our own, we must ensure the logistics side of such an endeavor is sustained. To this we must develop our military industrial capacity to meet the demands and potential threats which may befall us."
 USB_mid_atlantic_identitarian_further_shipping_industrial_developments: "Furthering Shipping Industrial Development"
 USB_mid_atlantic_identitarian_further_shipping_industrial_developments_desc: "To increase our international recognition we seek the continued development of our naval and shipping industries. While this can have military applications the primary need is of course trade, fishing and so forth."
 USB_mid_atlantic_identitarian_advanced_industries_act: "Advanced Industries Act"
 USB_mid_atlantic_identitarian_advanced_industries_act_desc: "The AIA is a government funding package to develop and grow our tech and service based industries. We must innovate as well as increase our competitiveness on the global stage if we are to stand out amongst the rabble of the rest of the continent we are on."
 USB_mid_atlantic_identitarian_the_primary_industries_act: "The Primary Industries Act"
 USB_mid_atlantic_identitarian_the_primary_industries_act_desc: "If we want to make a name for ourselves then we must act as a leader and a pioneer within a specialty. The continent has resources and the world needs said resouces. Therefore an extensive funding and investment package into developing primary industries and researching new ways to get more from less is the future stake we must claim."
 USB_mid_atlantic_identitarian_the_labor_restructuring_act: "The Labor Restructuring Act"
 USB_mid_atlantic_identitarian_the_labor_restructuring_act_desc: "The Labor Restructuring Act is a comprehensive legislative reforms to the labor laws and overall ability to efficiently allocate the work forces we have available as well as future proofing the ability to gain more productive capabilities with less people. Of course we'll need to increase our welfare and other budgeting apparatuses, but its a true investment for a better standard of living for all our peoples."
 USB_nsp_monarchist_victory: "NSP \"Monarchists\" Victory?"
 USB_nsp_monarchist_victory_desc: "In a shocking turn of events the NSP or National Service Party has won the election. The shock comes with the fact that out of all known ideologies the party's pro-election wing are what they call themselves \"Modern Monarchist\". Their main goal apparently is to keep the democratic system, but give it an aesthetic change wherein the titles are tied to the elected offices. This sort of elected monarchy or as some absolutists sneer as \"pseudo monarchism\" is a bit odd to a lot of people. But the military is content understanding the historical influences that monarchies placed high value on their militaries. Conservatives are content as this would be almost the ultimate conservative move as well as Liberals are more or less content due to the upholding and liberalization of democratic representation that will come from it. After all, what truly is in a name?"
 USB_nsp_monarchist_the_great_debate: "The Great Debate"
 USB_nsp_monarchist_the_great_debate_desc: "Following on our victory in the election, many truly wonder what is the point of cosmetically changing office titles, or how many should we change, ect ect. So the best debaters and calmest heads of the party must come together in this \"Great Debate\" of sorts to ensure the public and skeptics alike just how much will honestly change in the grand scheme of things."
 USB_nsp_monarchist_the_upper_echelon_act: "The Upper Echelon Act"
 USB_nsp_monarchist_the_upper_echelon_act_desc: "So after a lengthy series of debates we have solidified the new cosmetic changes. The choice to renamed the nation the Unified Kingdoms of Arcadia UKA is a symbol of a new identity as well as a symbol to those who once gave our former selves independence. The French colonial region of Arcadia is know for the Canadian provinces of New Brunswick, Nova Scotia and Prince Edward Island. Now she will live on in name with us as the UKA. This new identity allows us to secure title changes for offices, things like Emperor for the President, Princes for the senate, lords or barons for the house, Kings and Queens for the State governors. This supposed upper echelon of the leadership of the nation as a whole will now embody the spirit of a new nation, a new people and a new way forward."
 USB_nsp_monarchist_the_true_progressives: "The True Progressives"
 USB_nsp_monarchist_the_true_progressives_desc: "With a progressive liking to real tax reform we must ensure the fairness in said tax code. Therefore the tax brackets will lead up to $250,000 in terms of what will be the max bracket tax rate. The progressiveness of this being a tested variable amount of brackets split evenly in terms of gaps between them to allow for the most progressive form of taxation. Rather than punishing those that go higher in income, the scaling is based around proportional income earnings. This way there is no actual he said she said riff raff about \"paying your fair share\", when said fair share is based on the proportion of your income and not just cause you paid more by proxy of youearn more than someone."
 USB_nsp_monarchist_the_royal_families_act: "The Royal Families Act"
 USB_nsp_monarchist_the_royal_families_act_desc: "The RFA is a welfare reforms and budgeting bill to support families of the nation and make sure that not only are our citizens are taken care of but the future of our nation are taken care of as well. Everyone knows that the leading cause of divorce is due to financial instability due to the act of having children. Therefore if we want to increase our citizens happiness, increase the development baseline of stable homes and ensure the future of our future citizens and potential leaders then we must literally think of the children."
 USB_nsp_monarchist_the_modern_merchants_act: "The Modern Merchants Act"
 USB_nsp_monarchist_the_modern_merchants_act_desc: "In the old days of the \"Traditional Era\" of monarchism, the merchant was the backbone of ensure the expanded influences and wealth of the monarchy and its nation. In the modern age these now \"Modern Merchants\" are those of the small business owner. The backbone of the economy and the steam for which powers the engine of a nation's economy. As such we must fund, build and endorse small businesses to ensure they're ability to create, save that limiting to corporate entities that wish to look outside of our nation to secure their own wealth instead of the wealth of not just the nation but its peoples."
 USB_nsp_monarchist_the_great_connections_act: "The Great Connection Act"
 USB_nsp_monarchist_the_great_connections_act_desc: "The modern age has done something which even something that was 40yrs ago not even thought of. That is to make the world a smaller place and yet today many see the internet and cellular service as a supposed right to have. Well while material things are never a right outside those needed to survive, we do believe that these services are the future and what better way to grow a nation, its people and its identity then to make everyone closer together. Ensuring the unity through what is being called the Great Connection Act, a large funding package to ensure infrastructure both road and internet/phone based is seen to be expanded, modernized and upkept to the best possibility that our citizens can provide."
 USB_nsp_monarchist_domestic_first_policy: "The Domestic First Policy"
 USB_nsp_monarchist_domestic_first_policy_desc: "The Domestic First Policy or also known as the Domestic Priority Policy is a set of legislations and reforms that enforce the main duty of the government is to act on the security and ensured wellbeing of the domestic front. This means things like trade and so forth must be done in the means of securing the betterment or just out right securing the security of our domestic situation from foreign entities. This kind of pseudo autarkic and nationalistic policy will likely displease a fair amount of other nations, but our citizens should come first or what is the policy of a nation's government."
 USB_nsp_monarchist_the_grand_tour: "The Grand Tour"
 USB_nsp_monarchist_the_grand_tour_desc: "Skeptics are a way of life, as long as someone disagrees there will be skeptical people of if someone is truly \"right or wrong\" about something. Therefore to bolster our international image we must expand our diplomatic corps and ensure that we reduce the possibility of enemies to our own existence."
 USB_nsp_monarchist_la_grand_army: "Our Grand Army"
 USB_nsp_monarchist_la_grand_army_desc: "If there was ever an army to respect, why we would be here all day cause the principle of anyone willing to lay down their own life for what they believe in is the ultimate sacrafice someone can do. Nevertheless the innovativeness of Napoleon do have a special place in the hearts and minds of any officer that is either forward thinking and or future proofing. Though I am safe in thinking that anyone with a ego would also love to be Napoleon as well. Regardless we must treat our army with the upmost respect and diligence if we are to think about surviving a war, especially a war with our new neighbors."
 USB_nsp_monarchist_our_great_navy: "Our Great Navy"
 USB_nsp_monarchist_our_great_navy_desc: "To defense on land to defense on sea, the grand admiralty is what shall procure the security of our trade and coastal communities from the dangers beyond. With the same investing vigor we will turn our armed services around."
 USB_nsp_monarchist_our_defiant_air_force: "Our Defiant Air Force"
 USB_nsp_monarchist_our_defiant_air_force_desc: "The skies above our nation are sacred, this shield must be enforced through a strong and defiant air force. We must have the capabilities to defend our skies from the aggressors abroad, for they may be many and some may even be our neighbors."
 USB_nsp_monarchist_our_vast_resources: "Our Vast Resources"
 USB_nsp_monarchist_our_vast_resources_desc: "We must secure our domestic production and manufacturing. To do this we must invest, grow and subsidize resource extraction industries. These primary industries are the blood which circulates the entirety of any economy and we will certainly make sure that said blood will flow."
 USB_nsp_monarchist_our_strategic_resources: "Our Strategic Resources"
 USB_nsp_monarchist_our_strategic_resources_desc: "While autarky is not the best strategy considering our position in territory, we can at least maximize our domestic situation to be more strategic on the world stage. Therefore we will invest great sums into creating strategic stockpiles and resource streams in terms of mining operations."
 USB_nsp_monarchist_the_great_power_plant: "The Great Power Plant"
 USB_nsp_monarchist_the_great_power_plant_desc: "With all this great and rapid expansion we must also ensure such demands are met, with this in mind we must invest in massive power plant complexes to ensure energy production as well as its utilization are vastly enhanced."