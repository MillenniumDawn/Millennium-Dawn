l_russian:
 industrial_complex: "Гражданская промышленность"
 industrial_complex_plural: "Гражданская промышленность"
 industrial_complex_desc: "Это сооружение обеспечивает регион промышленностью для производства гражданских товаров или строительства новых зданий. При необходимости может быть преобразовано в военную промышленность.\n\nОбеспечивает штат:\nБазовое количество необходимых работников: §Y206 тыс.§!\nБазовый ВВП-выход на одну §YГражданскую промышленность§!: $§Y17.5 миллиардов§!\nБазовое потребление энергии: §R-0.5§! ГВт\n"
 arms_factory: "Военная промышленность"
 arms_factory_plural: "Военная промышленность"
 arms_factory_desc: "Это сооружение обеспечивает регион промышленностью для производства нового военного оборудования. При необходимости может быть преобразовано в гражданскую промышленность.\n\nОбеспечивает штат:\nБазовое количество необходимых работников: §Y18.8 тыс.§!\nБазовый ВВП-выход на одну §YВоенную промышленность§!: $§Y1.5 миллиард§!\nБазовое потребление энергии: §R-0.5§! ГВт"
 internet_station: "Сетевая инфраструктура"
 internet_station_plural: "Сетевая инфраструктура"
 internet_station_desc: "§YТелекоммуникационная система§! — это совокупность оборудования, сооружений и технологий, используемых для передачи сигналов на большие расстояния, включая подземные оптоволоконные кабели и облачные вычислительные сети.\n\nОбеспечивает регион:\nБазовое количество требуемых работников: §Y12 тыс.§!\nБазовый ВВП на единицу §Yсетевой инфраструктуры§!: $§Y3,5 млрд§!\n\nКаждый уровень §Yсетевой инфраструктуры§! улучшает скорость локального роста производительности на §G+5,00%§!\nКаждый уровень §Yсетевой инфраструктуры§! сокращает продолжительность §Yмеждународных инвестиций§! на §G-5,00%§!"
 dockyard: "Верфь"
 dockyard_plural: "Верфи"
 dockyard_desc: "§YВоенно-морские верфи§! являются показателем способности государства производить военные суда всех типов - §Yпатрульные катера§!, §Yконвои§!, §Yэсминцы§!, §Yавианосцы§! и многое другое.\n\nПредоставляет государству:\nБазовая численность требуемых работников: §Y18.8K§!\nБазовый прирост ВВП от §Yморской верфи§!: $§Y1.5 миллиард§!\nБазовое потребление энергии: §R-0.5§! ГВт"
 air_base_desc: "§YВоенный аэродром§! — это объект для размещения и подготовки воздушных сил. Его можно улучшать до десятого уровня, добавляя дополнительную вместимость в §Y50§! самолетов на каждый уровень."
 radar_station_desc: "§YРадар§! позволяют собирать разведывательную информацию о вражеских войсках в ближайших государствах. Они состоят из различных радаров и сенсоров, а также разведывательных активов и возможностей для анализа развивающейся ситуации.\nБолее высокий уровень увеличивает его эффективный радиус действия.\nРадары также предоставляют государству лучшие возможности для обнаружения вражеских воздушных сил, давая вашим самолетам больший шанс на их перехват.\nКроме того, радары увеличивают обнаружение вражеских флотов на море."
 anti_air_building: "Комплексы ближнего ПВО"
 anti_air_building_plural: "Комплексы ближнего ПВО"
 anti_air_building_desc: "§YСистемы ПВО ближнего действия§! — это системы и группы зенитных средств и тактик, предназначенные для защиты от воздушных угроз на малой высоте. Эти комплексы совместно контролируют воздушное пространство, разделяя его на обороняемые зоны и обеспечивая прикрытие военных объектов и инфраструктуры от всего — от вертолётов и низколетящих самолётов до реактивной авиации."
 nuclear_reactor_desc: "Это сооружение преобразует ядерную энергию в электрическую, потребляя при этом умеренно обогащённый уран.\n\nОбеспечивает регион:\nБазовое количество требуемых работников: §Y115 тыс.§!\nБазовый ВВП на единицу §Yядерного реактора§!: $§Y4 млрд§!\nБазовая выработка энергии: §G+5§! ГВт\n"
 synthetic_refinery_desc: "Этот объект обеспечивает регион промышленностью для производства синтетического каучука и дополнительными возможностями по производству топлива.\n\nОбеспечивает регион:\nБазовое количество требуемых работников: §Y184 тыс.§!\nБазовый ВВП на единицу §Yсинтетического нефтеперерабатывающего комплекса§!: $§Y10 млрд§!\nБазовое потребление энергии: §R-0,2§! ГВт\n\nПроизводит §Yкаучук§! по стандартным рыночным ценам, а излишки приносят денежный доход сверх корпоративного налога.\n"
 fuel_silo: "Хранилище стратегических ресурсов"
 fuel_silo_plural: "Хранилище стратегических ресурсов"
 fuel_silo_desc: "§YСтратегический резерв ресурсов§! представляет собой совокупность складов, хранилищ и других §Yхранилищ топлива§!. Это здание предоставляет вашей стране больше места для хранения §Hтоплива§! и §Hресурсов§!.\n\nПРИМЕЧАНИЕ: §Yхранилище ресурсов§! имеет ограничение по мощности двигателя, поэтому, если вы используете §Y$export_economy$§! или §Y$globalized_trade_economy$§!, вы можете отправлять на экспорт больше ресурсов, чем требуется вашим производственным линиям. Если вам нужно начать забирать ресурсы из хранилища, рекомендуется переключиться на §Y$mixed_economy$§! или более низкую мощность.\n"
 offices: "Офис"
 offices_plural: "Офисы"
 offices_desc: "§YОфисный сектор§! представляет собой все остальные отрасли экономики помимо добывающей и тяжелой промышленности. К ним относятся финансовые, потребительские, информационные технологии, розничные услуги и многое другое.\n\nПредоставляет государству:\nБазовая численность требуемых работников: §Y473K§!\nБазовый прирост ВВП от §Yофисного сектора§!: $§Y50 миллиардов§!\nБазовое потребление энергии: §R-0.2§! ГВт"
 rail_way_plural: "Железные дороги"
 fossil_powerplant: "Тепловая электростанция на ископаемом топливе"
 fossil_powerplant_plural: "Электростанции на ископаемом топливе"
 fossil_powerplant_desc: "§YТЭС§! — это общее название для всех термоэлектрических источников энергии на основе ископаемых видов топлива. К ним относятся, но не ограничиваются: уголь, природный газ и нефть. §YТеплоэлектрические станции на ископаемом топливе§! будут простаивать, если производство энергии превышает потребление.\n\nОбеспечивает регион:\nБазовое количество требуемых работников: §Y7,5 тыс.§!\nБазовый ВВП на единицу §Yэлектростанции на ископаемом топливе§!: $§Y1,7 млрд§!\nБазовая выработка энергии: §G+2§! ГВт\n"
 fossil_powerplant_amount: "$VALUE|Y0=$"
 fossil_powerplant_resource: "£resources_strip|$FRAME$"
 agriculture_district: "Коммерческое сельское хозяйство"
 agriculture_district_plural: "Коммерческое сельское хозяйство"
 agriculture_district_desc: "§YКоммерческий сельскохозяйственный район§! представляет собой единое целое для всего не натурального сельского хозяйства в нашей стране. Он включает в себя агропромышленность, пахотные земли, зерновые хранилища, мясные склады и многое другое.\n\nПредоставляет государству:\nБазовое количество необходимых работников: §Y188K§!\nБазовый объем ВВП на §Yкоммерциализированный сельскохозяйственный район§!: $§Y25 миллиардов§!\nБазовое потребление энергии: §R-0.10§! ГВТ\n§YПрибыль топлива§! от государств: 8\n§YМестные запасы§! 1.5%\n"
 agriculture_district_amount: "$VALUE|Y0=$"
 rocket_site: "Пусковая площадка"
 rocket_site_plural: "Места запуска ракет"
 rocket_site_desc: "§YПусковые площадки для ракет§! — это общее название для всех ракетных комплексов театра боевых действий, начиная от §YРакет класса \"земля-воздух\"§! и заканчивая §YМежконтинентальными баллистическими ракетами§!. Это даёт государству возможность развертывать эти стратегические ресурсы в наших стратегических воздушных зонах для поддержки нашей противовоздушной обороны или обеспечения наступательных возможностей."
 nuclear_facility: "Гражданский инженерный комплекс"
 nuclear_facility_plural: "Гражданские R&D центры"
 nuclear_facility_desc: "§YГражданский научно-исследовательский центр§! включает в себя все виды специальных проектов, связанных с гражданским промышленным потенциалом, ядерными объектами и т. д."
 air_facility: "Комплекс аэродинамики и авионики"
 air_facility_desc: "Экспериментальные объекты для аэродинамики и авионики позволяют запускать исследовательские проекты по самолётам, передовым ракетам, сопутствующей электронике и космическим программам."
 naval_facility_desc: "Экспериментальные объекты по военно-морскому делу позволяют запускать исследовательские проекты, связанные с надводными кораблями и подводными лодками.\nОбъект по военно-морскому делу можно создать только в прибрежной провинции."
 stronghold_network: "Оборонительный рубеж"
 stronghold_network_plural: "Общегосударственные защитные сети"
 stronghold_network_desc: "Обширная оборонительная сеть, состоящая из туннелей, опорных пунктов, траншей, бомбоубежищ, складов оружия и заранее спланированных мест подрыва, даёт защитникам решающее преимущество перед любым нападающим."
 renewable_energy_infra: "Инфраструктура возобновляемых источников энергии"
 renewable_energy_infra_plural: "Инфраструктура возобновляемых источников энергии"
 renewable_energy_infra_desc: "§YИнфраструктура возобновляемой энергии§! объединяет все источники возобновляемой энергии. Сюда входят, но не ограничиваются: солнечные электростанции, ветряные турбины, заводы по переработке биотоплива, угольные заводы, электростанции на биотопливе и др. Она использует возобновляемые ресурсы и вырабатывает из них топливо.\n\nОбеспечивает регион:\nБазовое количество требуемых работников: §Y22,5 тыс.§!\nБазовый ВВП на единицу §Yинфраструктуры возобновляемой энергетики§!: $§Y2 млрд§!\nБазовая выработка энергии: §G+0,5§! ГВт\n"
 renewable_energy_infra_amount: "$VALUE|Y0=$"
 renewable_energy_infra_resource: "£resources_strip|$FRAME$"
 microchip_plant: "Завод микрочипов"
 microchip_plant_plural: "Заводы микрочипов"
 microchip_plant_desc: "Производственное предприятие, перерабатывающее технологические и драгоценные металлы в микрочипы для промышленного и военного применения.\n\nПредоставляет штату:\nБазовое количество требуемых рабочих: §Y37.5K§!\nБазовый вклад в ВВП от каждого §YЗавода микрочипов§!: $§Y32 миллиарда§!\nБазовое потребление энергии: §R-0.75§! ГВт\nПроизводство §Y20 микрочипов§!\n\n§YМикрочипы§! имеют самую высокую рыночную цену за единицу продукции, принося значительный денежный доход от экспорта излишков.\n\nЗатраты:\n3 §YТехнологических металла§!\n2 §YДрагоценных металла§!"
 composite_plant: "Завод композитных материалов"
 composite_plant_desc: "Производственный комплекс, объединяющий нефть, каучук и драгоценные металлы для создания композитных материалов, используемых в научных, военных и промышленных целях.\n\nОбеспечивает государство:\nБазовое количество необходимых работников: §Y37.5K§!\nБазовый ВВП на §Yкомпозитный завод§!: $§Y28 млрд§!\nБазовое энергопотребление: §R-0.8§! ГВт\n20 §Yпередовых композитов§! производство\n\n§YКомпозиты§! продаются по одной из самых высоких цен за единицу на рынке, принося значительный денежный доход от экспортных излишков.\n\nПотребление:\n1 §Yнефть§!\n1 §Yкаучук§!\n1 §Yдрагоценные металлы§!"
 composite_plant_plural: "Завод композитных материалов"
 rail_terminal: "Железнодорожный терминал"
 rail_terminal_plural: "Железнодорожные терминалы"
 rail_terminal_desc: "В регионе, где развита густая сеть транспортных узлов, люди и грузы перемещаются быстрее, благодаря чему предприятия получают более стабильные поставки сырья, работники надежнее добираются до места работы, а местная экономика получает возможности для роста."
 show_construction_speed: "При включении отображается текущий £construction_speed_texticon §YБонус скорости строительства§! для каждого §Yтипа здания§!.\n\nЭтот модификатор показывает только бонус, относящийся к конкретному типу здания. Он не учитывает §Yглобальную £construction_speed_texticon скорость строительства§!."
 landmark_kaaba: "Кааба"
 landmark_kaaba_plural: "$landmark_kaaba$"
 landmark_kaaba_desc: "Кааба — священное сооружение кубической формы в центре мечети аль-Харам в Мекке, являющееся самым святым местом в исламе. Покрытая чёрным шёлком с золотой каллиграфией, она служит кыблой — направлением, в сторону которого мусульмане всего мира обращаются во время молитвы. Это древнее святилище, известное как Дом Бога, олицетворяет многовековую веру, паломничество и исламскую историю, символизируя единство мусульманской уммы.\n\n§YДостопримечательность Кааба§! приносит доход от туризма, зависящий от общей численности населения арабских государств. Точный размер дохода можно посмотреть в §YЭкономическом обзоре§!."
 landmark_milad: "Башня Милад"
 landmark_milad_plural: "$landmark_milad$"
 landmark_milad_desc: "Башня Милад, или Бордж-е Милад, имеет свои корни в период до Иранской революции, когда первые планы её строительства появились ещё в 1970-х годах. После Исламской революции 1979 года эти ранние проекты были отложены из-за изменения политических приоритетов. Идея была возрождена в конце 1990-х годов, а строительство началось в 2000 году, что соответствовало новому курсу Ирана на развитие и модернизацию.Её дизайн сочетает элементы иранского наследия с современными инженерными решениями, делая башню ярким символом исторической преемственности и меняющейся идентичности страны. Сегодня башня является многофункциональным комплексом и важной культурной достопримечательностью, откуда жители Тегерана и туристы могут наслаждаться панорамным видом на город и далёкие горы Эльбурс."
 landmark_domeofrock: "Купол Скалы"
 landmark_domeofrock_plural: "$landmark_domeofrock$"
 landmark_domeofrock_desc: "Купол Скалы — это знаменитая исламская святыня, известная своим золотым куполом, возвышающимся над Старым городом Иерусалима. Построенная в VII веке, она возвышается на Харам аль-Шариф, также известном как Храмовая гора — месте, священном как для мусульман, так и для евреев. В святыне хранится Камень Основания, который, по верованиям мусульман, обозначает место, откуда пророк Мухаммед вознесся на небеса, а по верованиям иудеев — место Святая Святых древнего иудейского Храма."
 landmark_goldengate: "Мост «Золотые Ворота»"
 landmark_goldengate_plural: "$landmark_goldengate$"
 landmark_goldengate_desc: "Мост «Золотые Ворота», построенный в 1937 году, перекинут через пролив между заливом Сан-Франциско и Тихим океаном, соединяя город с мысом Марин-Хедлендс. Благодаря своим характерным башням, окрашенным в цвет «International Orange», и длинному подвесному пролету на момент открытия он стал самым длинным мостом такого типа в мире и по-прежнему остается одним из самых узнаваемых сооружений в Соединенных Штатах."
 landmark_UScongress: "Капитолий США"
 landmark_UScongress_plural: "$landmark_UScongress$"
 landmark_UScongress_desc: "Капитолий США возвышается на восточном конце Национальной аллеи в Вашингтоне, округ Колумбия, и в его здании расположены залы заседаний Сената и Палаты представителей. Благодаря своему неоклассическому архитектурному стилю и центральному куполу он стал самым узнаваемым символом американской законодательной власти и является центральным элементом коридора, в котором расположены Библиотека Конгресса, Верховный суд и музейный комплекс Смитсоновского института."
 landmark_fuji: "Гора Фудзи"
 landmark_fuji_plural: "$landmark_fuji$"
 landmark_fuji_desc: "Гора Фудзи, высота которой составляет 3 776 метров и которая является самой высокой вершиной Японии, представляет собой действующий стратовулкан на острове Хонсю, который в ясные дни виден из Токио. Издавна считающаяся священной в синтоистских верованиях и являющаяся одним из основных мотивов в японском искусстве, она также входит в список Всемирного наследия ЮНЕСКО. Её почти идеальный конический силуэт и окружающая озёрная местность ежегодно привлекают сотни тысяч альпинистов и туристов."
 landmark_giza: "Пирамиды Гизы"
 landmark_giza_plural: "$landmark_giza$"
 landmark_giza_desc: "Пирамиды Гизы, построенные в эпоху Древнего Царства Египта как монументальные гробницы для фараонов, возвышаются на окраине Каира. Великая пирамида, построенная для фараона Хеопса, является последним сохранившимся сооружением из семи чудес древнего мира. Этот комплекс, наряду со Сфинксом, по-прежнему остаётся одной из самых посещаемых достопримечательностей Египта и является центральным элементом туристической экономики страны."
 landmark_shuttle: "Космический центр им. Кеннеди"
 landmark_shuttle_plural: "$landmark_shuttle$"
 landmark_shuttle_desc: "Космический центр имени Кеннеди, расположенный на атлантическом побережье Флориды, является основным стартовым полигоном для пилотируемых космических миссий НАСА. Здесь находятся такие объекты, как знаменитый Корпус сборки ракет, где ракеты готовятся к запуску, и Стартовый комплекс № 39 — историческое место старта ракет в рамках программ «Аполлон» и «Космический челнок». Центр по-прежнему остается центром инноваций и космических исследований, обеспечивая как государственные, так и коммерческие запуски."
 landmark_shuttle_launch: "Космический центр им. Кеннеди"
 landmark_shuttle_launch_plural: "$landmark_shuttle_launch$"
 landmark_shuttle_launch_desc: "Космический центр имени Кеннеди, расположенный на атлантическом побережье Флориды, является основным стартовым полигоном для пилотируемых космических миссий НАСА. Здесь находятся такие объекты, как знаменитый Корпус сборки ракет, где ракеты готовятся к запуску, и Стартовый комплекс № 39 — историческое место старта ракет в рамках программ «Аполлон» и «Космический челнок». Центр по-прежнему остается центром инноваций и космических исследований, обеспечивая как государственные, так и коммерческие запуски."
 landmark_buran: "Космодром «Байконур»"
 landmark_buran_plural: "$landmark_buran$"
 landmark_buran_desc: "Космодром «Байконур», расположенный в степях южного Казахстана, является старейшим и крупнейшим действующим космодромом в мире. Основанный в 1955 году, он стал стартовой площадкой для знаковых советских и российских миссий, в том числе для первого пилотируемого космического полёта Юрия Гагарина на борту «Востока-1». Россия по-прежнему арендует этот объект у Казахстана и использует его для запусков пилотируемых кораблей «Союз» к Международной космической станции."
 landmark_ICBMsilominot: "Авиабаза Майнот"
 landmark_ICBMsilominot_plural: "$landmark_ICBMsilominot$"
 landmark_ICBMsilominot_desc: "Ракетный комплекс авиабазы «Майнот» состоит из обширной сети подземных шахт, в которых размещены межконтинентальные баллистические ракеты, разбросанных по равнинам Северной Дакоты. Шахты укреплены для защиты от ядерного удара, находятся под усиленной охраной и поддерживаются в состоянии постоянной боевой готовности, образуя наземную составляющую ядерной триады Соединенных Штатов."
 landmark_ICBMsiloyasny: "Ракетная база «Ясный»"
 landmark_ICBMsiloyasny_plural: "$landmark_ICBMsiloyasny$"
 landmark_ICBMsiloyasny_desc: "Ракетная база «Ясный», расположенная недалеко от Домбаровского в Оренбургской области России, является одним из основных ракетных полигонов Стратегических ракетных войск. Построенная в период холодной войны, она размещает тяжелые межконтинентальные баллистические ракеты в укрепленных подземных шахтах и представляет собой важнейший компонент системы ядерного сдерживания России."
 landmark_zenobia_wall: "Линия обороны Зенобии"
 landmark_zenobia_wall_plural: "$landmark_zenobia_wall$"
 landmark_zenobia_wall_desc: "Сильно укреплённая линия, простирающаяся через юг Египта и Западную пустыню. Бетонные стены, комплексы бункеров и заранее установленная артиллерия составляют основу «Линии Зенобии», сооружённой с целью остановить наступление «Химеры» из зон прорыва к югу от Сахары."
 landmark_hagia_sophia_plural: "$landmark_hagia_sophia$"
 landmark_hagia_sophia_desc: "Первоначально построенная в 537 году как византийский собор, мечеть Святой Софии стала главной османской мечетью Стамбула после завоевания города в 1453 году. На протяжении большей части истории Турецкой Республики она служила светским музеем. Её массивный центральный купол и византийские мозаики по-прежнему остаются одними из самых значимых произведений религиозной архитектуры, когда-либо созданных, и ежегодно привлекают в Стамбул миллионы посетителей."
 landmark_forbidden_city_desc: "Окруженный стеной дворцовый комплекс в самом центре Пекина на протяжении почти пяти веков служил императорской резиденцией династий Мин и Цин. Сегодня здесь располагается Дворцовый музей, в котором хранится одна из самых значительных в мире коллекций китайского искусства и артефактов. Запретный город — самый посещаемый культурный объект страны и объект Всемирного наследия ЮНЕСКО, являющийся главным символом китайской цивилизации."
 landmark_tokyo_imperial_palace_desc: "Главная резиденция императора Японии со времени Реставрации Мэйдзи, расположенная на месте бывшего замка Эдо в самом центре Токио. Дворец и прилегающая к нему территория олицетворяют преемственность старейшей в мире наследственной монархии. Доступ для широкой публики ограничен, однако Восточные сады и крупные императорские церемонии ежегодно привлекают сюда значительное количество туристов."
 landmark_taj_mahal_plural: "$landmark_taj_mahal$"
 landmark_taj_mahal_desc: "Тадж-Махал, построенный в 1632 году по приказу императора династии Великих Моголов Шах-Джахана в качестве мавзолея для его супруги Мумтаз-Махал, является лучшим из сохранившихся образцов архитектуры эпохи Великих Моголов. Благодаря фасаду из белого мрамора, изысканной инкрустации и симметричным садам он внесен в Список всемирного наследия ЮНЕСКО и является одним из самых посещаемых памятников на Земле, ежегодно привлекая в Агру миллионы туристов."
 landmark_prague_castle: "Пражский град"
 landmark_prague_castle_desc: "Пражский Град — крупнейший в мире по площади древний замковый комплекс — служил резиденцией чешских королей, императоров Священной Римской империи, а в настоящее время — президента Чешской Республики. Внутри его стен расположен собор Святого Вита, а также собраны произведения искусства, созданные на протяжении веков в разных странах Центральной Европы, что делает замок самым посещаемым культурным объектом страны."
 landmark_bojnice_castle: "Бойницкий замок"
 landmark_bojnice_castle_desc: "Бойницкий замок — это романтическое сооружение в стиле неоготики, восстановленное на месте средневековой словацкой крепости; он был перестроен в конце XIX века при графе Яноше Палфи в стиле французских замков Луары. Сегодня это один из самых посещаемых культурных объектов Словакии, а его силуэт с башенками и окружающий парк являются центральным элементом словацкого культурного туризма."
 landmark_sadabad_complex: "Дворец Саадабад"
 landmark_sadabad_complex_plural: "$landmark_sadabad_complex$"
 landmark_sadabad_complex_desc: "Обширный дворцовый комплекс, расположенный в предгорьях к северу от Тегерана, первоначально построенный при династии Каджаров и значительно расширенный шахами из династии Пахлави. После революции 1979 года комплекс был национализирован, и сегодня он функционирует как сеть государственных музеев, в которых хранятся королевские коллекции, произведения иранского искусства и экспонаты естествознания."
 landmark_hofburg_palace_desc: "Хофбург, расположенный в самом сердце Вены, на протяжении веков служил главным императорским дворцом династии Габсбургов. Сегодня в его залах размещаются канцелярия президента Австрии, Испанская школа верховой езды, Императорская сокровищница и несколько крупных музеев. Он по-прежнему остается одной из главных достопримечательностей Вены и центральным объектом культурного туризма Австрии."
 landmark_berlin_reichstag_desc: "Здание Рейхстага на площади Республики уже более века является политическим центром Берлина. Понесло серьезные повреждения в 1933 году, а затем и во время Второй мировой войны; после воссоединения страны оно было отреставрировано по проекту Нормана Фостера и в 1999 году вновь открыто в качестве резиденции Бундестага — федерального парламента Германии. Его стеклянный купол стал одним из главных символов современной немецкой демократии и одной из главных достопримечательностей центрального Берлина."
 enrichment_facility: "Комплекс по обогащению урана"
 enrichment_facility_plural: "Комплексы по обогащению урана"
 enrichment_facility_desc: "Предприятия по обогащению урана принимают уран и обогащают его для использования в ядерных реакторах и, в некоторой степени, в ядерном оружии."