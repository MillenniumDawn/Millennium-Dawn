 destroyer_hull_1: "Casco de Destructor 1965"
 destroyer_hull_1_desc: "Destinados a escoltar a buques más grandes en una flota, convoy o grupo de batalla, estos buques de guerra rápidos, maniobrables y de larga resistencia también son capaces de operar de forma independiente. Versiones posteriores, que llevan una amplia y mortífera gama de misiles guiados, misiles de crucero y otras armas, son verdaderamente buques de guerra multi-misión. Son más pesados en tonelaje y más ofensivos y mortíferos en potencia de fuego que tu fragata o corbeta. Se utilizan típicamente para: defensa de flotas, tareas ofensivas, antiaéreas, antisubmarinas, antinavío, así como tareas de ataque a tierra, dependiendo de la carga."
 destroyer_hull_2: "Casco de Destructor 1990"
 destroyer_hull_2_desc: "Destinados a escoltar a buques más grandes en una flota, convoy o grupo de batalla, estos buques de guerra rápidos, maniobrables y de larga resistencia también son capaces de operar de forma independiente. Versiones posteriores, que llevan una amplia y mortífera gama de misiles guiados, misiles de crucero y otras armas, son verdaderamente buques de guerra multi-misión. Son más pesados en tonelaje y más ofensivos y mortíferos en potencia de fuego que tu fragata o corbeta. Se utilizan típicamente para: defensa de flotas, tareas ofensivas, antiaéreas, antisubmarinas, antinavío, así como tareas de ataque a tierra, dependiendo de la carga."
