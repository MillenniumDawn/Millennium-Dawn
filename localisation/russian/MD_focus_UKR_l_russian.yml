 UKR_repair_bombers_category_desc: "\n\n\n\n\n\n£UKR_desctext_tu_160_main\n\n\n\n\n\n\n\n\nПосле решения сохранить парк дальней авиации §Y[UKR.GetNameWithFlag]§! нужно вернуть эти самолёты в рабочее состояние. Это потребует значительных ресурсов, специального оборудования и опыта украинских авиационных предприятий.\n\nОсталось на хранении §YТу-160§!: §C[?tu160_storage|0]§! \nОсталось на хранении §YТу-95МС§!: §C[?tu95_storage|0]§! \nОсталось на хранении §YТу-22М2§!: §C[?tu22m2_storage|0]§! \nОсталось на хранении §YТу-142§!: §C[?tu142_storage|0]§! \n\nДоступно сборочных линий: §G[?UKR_repair_slots_free|0]§! из §C[?UKR_repair_slots_max|0]§!"
