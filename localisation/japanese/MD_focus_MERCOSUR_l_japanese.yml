 MER_invite_PAN_full_member_desc: "パナマを準加盟の地位からMERCOSUR正式加盟へ引き上げる交渉を開始する。$MER_full_membership_acceptance_hint_desc$$MER_full_membership_invite_process_desc$"
MER_request_mercosur_associate_membership: "MERCOSUR準加盟を申請"
MER_request_mercosur_associate_membership_desc: "MERCOSURに対し、準加盟国として迎え入れるよう正式な請願を行う。審査期間を無事に終えれば、我々はブロックの外縁部へ迎え入れられ、南米協調への足場を得ることになる。"
MER_request_mercosur_full_membership: "MERCOSUR正式加盟を申請"
MER_request_mercosur_full_membership_desc: "MERCOSURに対し、正式加盟を求める請願を提出する。手続きが最後まで進めば、審査期間の終了とともに我々の加盟は正式化され、ブロックの内側へと踏み込むことになる。"
MER_request_unasul_membership: "UNASUL加盟を申請"
MER_request_unasul_membership_desc: "UNASULへの正式な加盟申請を提出する。請願が最後まで進めば、我々は特定国の追加承認を待つことなく、審査期間の終了とともに南米枠組みの内側へ加わる。"
leave_UNASUL: "UNASUL共同防衛機構から離脱"
leave_UNASUL_desc: "UNASUL共同防衛機構を軸とする軍事同盟から身を引き、共通防衛体制への参加を終える。"
UNASUL_leave_tt: "UNASUL共同防衛機構の軍事同盟から離脱する。"
MER_full_membership_acceptance_hint_desc: "\n\n§Y受託率はその国との意見補正、影響力、メルコスールのツリーの進行具合で決定される！§!"
MER_full_membership_invite_process_desc: "\n\n§Y相手国が受諾すると、即時に正式加盟するか、3段階の加盟任務を伴う投資支援ルートを求めるかを選べる。投資支援ルートでは、3つすべての加盟ディシジョンを完了すると正式加盟が成立する。§!"
MER_full_membership_step_one_desc: "\n\n§Yこれは加盟手続きの1/3段階目だ。3つすべての加盟ディシジョンを完了すると、正式加盟が成立する。§!"
MER_full_membership_step_two_desc: "\n\n§Yこれは加盟手続きの2/3段階目だ。3つすべての加盟ディシジョンを完了すると、正式加盟が成立する。§!"
MER_full_membership_step_three_desc: "\n\n§Yこれは加盟手続きの最終段階だ。3つすべての加盟ディシジョンが完了すると、正式加盟が成立する。§!"

MER_CHL_tariff_alignment: "対チリ関税調整"
MER_CHL_tariff_alignment_desc: "チリをブロックの関税制度へより緊密に適合させるために必要な関税見直しと行政調整に資金を投じる。$MER_full_membership_step_one_desc$"
MER_CHL_customs_system_modernization: "対チリ税関制度近代化"
MER_CHL_customs_system_modernization_desc: "チリの税関行政を近代化し、MERCOSUR正式加盟に備えるために必要な資金と技術支援を提供する。$MER_full_membership_step_two_desc$"
MER_CHL_common_standards: "チリ共通基準採用支援"
MER_CHL_common_standards_desc: "チリがMERCOSUR共通基準を採用するために必要な最終的な規制・技術作業を支援する。$MER_full_membership_step_three_desc$"

MER_COL_tariff_alignment: "対コロンビア関税調整"
MER_COL_tariff_alignment_desc: "コロンビアをブロックの関税制度へより緊密に適合させるために必要な関税見直しと行政調整に資金を投じる。$MER_full_membership_step_one_desc$"
MER_COL_customs_system_modernization: "対コロンビア税関制度近代化"
MER_COL_customs_system_modernization_desc: "コロンビアの税関行政を近代化し、MERCOSUR正式加盟に備えるために必要な資金と技術支援を提供する。$MER_full_membership_step_two_desc$"
MER_COL_common_standards: "コロンビア共通基準採用支援"
MER_COL_common_standards_desc: "コロンビアがMERCOSUR共通基準を採用するために必要な最終的な規制・技術作業を支援する。$MER_full_membership_step_three_desc$"

MER_VEN_tariff_alignment: "対ベネズエラ関税調整"
MER_VEN_tariff_alignment_desc: "ベネズエラをブロックの関税制度へより緊密に適合させるために必要な関税見直しと行政調整に資金を投じる。$MER_full_membership_step_one_desc$"
MER_VEN_customs_system_modernization: "対ベネズエラ税関制度近代化"
MER_VEN_customs_system_modernization_desc: "ベネズエラの税関行政を近代化し、MERCOSUR正式加盟に備えるために必要な資金と技術支援を提供する。$MER_full_membership_step_two_desc$"
MER_VEN_common_standards: "ベネズエラ共通基準採用支援"
MER_VEN_common_standards_desc: "ベネズエラがMERCOSUR共通基準を採用するために必要な最終的な規制・技術作業を支援する。$MER_full_membership_step_three_desc$"

MER_PRU_logistics_corridor: "対ペルー物流回廊整備"
MER_PRU_logistics_corridor_desc: "ペルーの首都における物流回廊整備の第一段階に資金を投じ、同国のMERCOSURとのより深い統合に備える。$MER_full_membership_step_one_desc$"
MER_PRU_cross_border_transport: "対ペルー越境輸送改善"
MER_PRU_cross_border_transport_desc: "ペルーとの陸上輸送連結を拡充し、加盟に必要なインフラを強化する。$MER_full_membership_step_two_desc$"
MER_PRU_port_connectivity: "対ペルー港湾接続強化"
MER_PRU_port_connectivity_desc: "ペルーの首都におけるデジタル・物流接続に投資し、より統合された地域市場を支える。$MER_full_membership_step_three_desc$"

MER_BOL_logistics_corridor: "対ボリビア物流回廊整備"
MER_BOL_logistics_corridor_desc: "ボリビアの首都における物流回廊整備の第一段階に資金を投じ、同国のMERCOSURとのより深い統合に備える。$MER_full_membership_step_one_desc$"
MER_BOL_overland_transport: "対ボリビア陸上輸送網拡張"
MER_BOL_overland_transport_desc: "ボリビアの首都における新たな陸上輸送改良を支援し、加盟の実利を目に見えるものにする。$MER_full_membership_step_two_desc$"
MER_BOL_border_connectivity: "対ボリビア国境接続改善"
MER_BOL_border_connectivity_desc: "加盟パッケージの一環として、ボリビアのデジタルおよび物流面の国境接続に投資する。$MER_full_membership_step_three_desc$"

MER_PAN_logistics_corridor: "対パナマ物流回廊整備"
MER_PAN_logistics_corridor_desc: "パナマの首都における物流回廊整備の基盤に資金を投じ、加盟が即時の輸送改善を生むようにする。$MER_full_membership_step_one_desc$"
MER_PAN_port_transport: "対パナマ港湾輸送強化"
MER_PAN_port_transport_desc: "パナマにおける港湾向け輸送改良を支援し、MERCOSUR市場間の商品移動を改善する。$MER_full_membership_step_two_desc$"
MER_PAN_trade_connectivity: "対パナマ通商接続改善"
