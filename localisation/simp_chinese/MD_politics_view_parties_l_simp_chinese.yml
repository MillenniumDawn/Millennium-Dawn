 ROJ.conservatism: "£ROJ_conservatism_small 库尔德全国委员会"
 ROJ.conservatism_desc: "保守主义 - 库尔德全国委员会是一个总部位于叙利亚北部的库尔德政党，与巴尔扎尼领导的伊拉克库尔德斯坦库尔德民主党关系密切。作为库尔德工人党和库尔德民主党竞争的延伸，库尔德工人党强烈反对控制叙利亚北部和东部自治政府（也称为罗贾瓦）的民主联盟党。它主要作为一个库尔德民族主义政党，从库尔德地区政府和巴尔扎尼人那里汲取灵感。与民主联盟党相比，库尔德全国委员会在叙利亚反对派中也享有代表权，并且与土耳其关系良好。"
 ROJ.socialism: "£ROJ_western_social_democrat 荣誉与权利公约"
 ROJ.socialism_desc: ""
 ROJ.anarchist_communism: "£ROJ_anarchist_communism 叙利亚革命左翼潮流"
 ROJ.anarchist_communism_desc: ""
 ROJ.neutral_Social: "£ROJ_neutral_Social_small 民主联盟党"
 ROJ.neutral_Social_desc: "民主邦联主义 - 民主联盟党是叙利亚北部和东部自治政府中最具主导地位的政党，也称为西库尔德斯坦。它遵循民主邦联主义的意识形态，是库尔德保护伞组织库尔德斯坦社群联盟的成员，并从阿卜杜拉·奥贾兰和库尔德工人党的斗争中汲取灵感。正因为如此，该党及其控制的地区被土耳其贴上了恐怖分子的标签。然而，由于其军事派别“人民保卫军”对伊斯兰国进行了成功的斗争，它赢得了国际社会的广泛同情。"
