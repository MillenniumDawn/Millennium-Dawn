 preah_vihear.40.t: "Training Accident at the Border"
 preah_vihear.40.d: "A live-fire exercise near the border has gone wrong. Equipment has been damaged and several soldiers are unfit for duty, and the setback has dented confidence in the readiness program."
 preah_vihear.40.a: "Learn from the mistake"
 preah_vihear.41.t: "Provocation Backfires"
 preah_vihear.41.d: "The latest round of rhetoric and troop movements has drawn unwanted scrutiny at home. Opposition figures and the press are asking whether the government is manufacturing a crisis it cannot control, and it has been forced to walk the temperature back."
 preah_vihear.41.a: "Note the lesson"
 preah_vihear.110.t: "The Noppadon Communiqué"
 preah_vihear.110.d: "Foreign Minister Noppadon Pattama co-signed a joint communiqué backing Cambodia's UNESCO listing bid for Preah Vihear, a document that has since triggered a firestorm at home. The Constitutional Court is weighing whether the agreement was made without proper parliamentary approval, and nationalist critics are demanding the minister's head."
 preah_vihear.110.a: "Stand by the communiqué"
 preah_vihear.110.b: "Repudiate it and let the minister go"
 preah_vihear.111.t: "Thaksin in Phnom Penh"
 preah_vihear.111.d: "Prime Minister Hun Sen has appointed the fugitive Thaksin Shinawatra as his personal economic adviser, a calculated insult to the government in Bangkok. Cambodia has refused to consider extradition, and the appointment has become a rallying point on both sides of the border."
 preah_vihear.111.a: "Recall our ambassador"
 preah_vihear.111.b: "Lodge a formal protest only"
 preah_vihear.112.t: "Yellow Shirts at the Border"
 preah_vihear.112.d: "The People's Alliance for Democracy has seized on the border dispute as fresh evidence of a government too close to Phnom Penh and too soft on national sovereignty. Rallies outside Government House show no sign of thinning."
 preah_vihear.112.a: "Weather the protests"
 preah_vihear.120.t: "The Dispute Reaches the UN Security Council"
 preah_vihear.120.d: "The border crisis has escalated to the point that it is now on the Security Council's agenda. Member states have called for restraint from both sides, though no binding action is expected."
 preah_vihear.120.a: "Note the proceedings"
 preah_vihear.121.t: "Indonesia Offers Observers"
 preah_vihear.121.d: "As ASEAN chair, Indonesia has offered to deploy unarmed observers to monitor the border and report on ceasefire violations. Jakarta frames it as a confidence-building step rather than a mediated settlement."
 preah_vihear.121.a: "Accept the observers"
 preah_vihear.121.b: "Decline the offer"
 preah_vihear.130.t: "A Decisive Defeat"
 preah_vihear.130.d: "The other side has scored a decisive victory in the standoff at Preah Vihear, and is now working every diplomatic and propaganda channel to make the humiliation stick. No ground has changed hands, but our position at the border looks weaker than it has in years."
 preah_vihear.130.a: "Accept the setback for now"
 preah_vihear.130.b: "Prepare for full-scale war"
 preah_vihear.131.t: "The Escarpment Is Lost"
 preah_vihear.131.d: "Thai forces have overrun the disputed ground and Bangkok has formally annexed the Northern Khmer province, temple and all. The 1962 ruling that was supposed to be ours means nothing against troops on the heights. The nation is in shock, and demands an answer we may not be able to give."
 preah_vihear.131.a: "A dark day for the nation"
 preah_vihear.131.b: "We will take it back"
