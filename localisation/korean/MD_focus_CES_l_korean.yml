 centralkaz.3518.a: "으억"
 CES_modern_warfare: "현대전"
 CES_modern_warfare_desc: "어떤 외부 위협도 효과적으로 격퇴할 수 있도록 우리 육군을 현대의 현실에 맞게 개편해야 합니다."
 CES_new_air_doctrine: "신 항공 교리"
 CES_new_air_doctrine_desc: "공중전 전술에 대한 우리의 접근법을 바꿔야 합니다."
 they_lowered_our_debt_tt: "§G그들이 우리의 부채를 줄여 주었습니다§!"
 they_refused_lowering_our_debt_tt: "§R그들은 우리의 부채 감축 제안을 거절했습니다§!"
 joining_turkic_council_tt1: "\n나머지 튀르크 국가들과의 관계를 개선하기 위해 §C튀르크 평의회§!에 가입합니다."
 UZB_karakalpakstan_category: "카라칼파크스탄 질문"
 UZB_karakalpakstan_category_desc: "우즈베키스탄의 카라칼파크스탄 분리주의는 우즈베키스탄 영토 내 카라칼파크스탄 자치공화국의 더 큰 자치, 나아가 독립을 바라는 역사적이며 현재진행형인 지역 운동을 가리킵니다. 우즈베키스탄 북서부에 위치한 카라칼파크스탄에는 이 지역과 뚜렷한 문화적, 언어적, 역사적 유대를 지닌 카라칼파크인이 주로 거주합니다.\n\n카라칼파크스탄의 관계: §Y[?UZB_karakalpakstans_opinion]§!\n\n우즈베크인의 관계: §Y[?UZB_uzbeks_opinion]§!\n"
 UZB_Promote_Karakalpakstan_identity: "카라칼파크스탄 정체성 증진"
 UZB_karakalpakstan.1.t: "카라칼파크인과 우즈베크인의 종교 분쟁"
 UZB_karakalpakstan.1.d: "오늘 아침 지역 모스크에서 우즈베크인과 카라칼파크인 사이에 충돌이 있었습니다. 처음에는 말다툼에 불과했으나 곧 갑자기 유혈 사태로 번졌습니다. 양측 모두 자신들에게 낯선 종교가 자기 땅에 들어와 있다고 믿고 있습니다. 우리는 누구의 편에 설 것입니까?"
 UZB_karakalpakstan.1.a: "카라칼파크인을 지지한다"
 UZB_karakalpakstan.1.b: "우즈베크인을 지지한다"
 UZB_karakalpakstan.2.t: "카라칼파크인과 우즈베크인의 술집 난투극"
 UZB_karakalpakstan.2.d: "몇 시간 전 우즈베크인과 카라칼파크인 사이에 취중 다툼이 있었습니다. 갈등은 정치적 견해 차이에서 비롯되었습니다. 서로 모욕을 주고받은 끝에 양측은 임시변통 무기까지 동원한 치열한 난투극을 벌였습니다."
 UZB_karakalpakstan.2.a: "카라칼파크인을 지지한다"
 UZB_karakalpakstan.2.b: "우즈베크인을 지지한다"
 UZB_karakalpakstan.3.t: "지역 팀 간 축구장 난투"
 UZB_karakalpakstan.3.d: "몇 시간 전 우즈베크 축구팀 구성원들 사이에 충돌이 있었습니다. 주된 원인은 민족 간 불화였습니다. 한 참가자가 다른 참가자에게 극도로 모욕적인 발언을 던졌고, 이것이 축구장에서의 소요로 이어졌습니다."
 UZB_karakalpakstan.3.a: "카라칼파크인을 지지한다"
 UZB_karakalpakstan.3.b: "우즈베크인을 지지한다"
 UZB_karakalpakstan.4.t: "카라칼파크스탄 축제 중 충돌"
 UZB_karakalpakstan.4.d: "현지 카라칼파크인들이 민족 명절을 기념하던 중 급진화된 우즈베크인들이 축하객들을 습격했습니다. 여러 명이 부상을 입었고 공격자들은 경찰에 구금되었습니다. 우리는 이 사안을 어떻게 처리해야 합니까?"
 UZB_karakalpakstan.4.a: "카라칼파크인을 지지한다"
 UZB_karakalpakstan.4.b: "우즈베크인을 지지한다"
 Karakalpaks_rebelled_yes: "카라칼파크스탄 이 반란을 일으켰습니다."
 CES_economic_affairs: "경제 현안"
 CES_economic_affairs_desc: "2000년대 초반은 중앙아시아 국가들이 경제 발전과 전환이라는 복잡한 국면을 헤쳐 나가는 변혁의 시기였습니다."
 CES_enlarge_the_mines: "광산 확장"
 CES_enlarge_the_mines_desc: "광업을 성장시키려면 광산을 확장해야 합니다."
 CES_western_resource: "대체 에너지원"
 CES_western_resource_desc: "대체 에너지원을 개발할 것입니다."
 TRK_ruhnama: "루흐나마"
 TRK_ruhnama_desc: "위대한 지도자 투르크멘바시의 인도 아래, 루흐나마는 우리 민족의 영혼의 책이며 사막의 오아시스이자 어두운 밤의 등대입니다! 그것은 3천 년에 걸친 투르크멘 민족의 지혜와 영광을 구현합니다. 오구즈 칸의 광대한 제국에서 오늘날의 중립국에 이르기까지, 우리는 언제나 자유와 존엄의 수호자였습니다!"
