 ITA_euro_partners_debt_assurances: "유럽 파트너들의 부채 보증"
 ITA_euro_partners_debt_assurances_desc: "수십 년간의 무분별한 지출로 이탈리아는 막대한 공공 부채에 허덕이고 있으며, 유로에 가입하기 전에는 심각한 인플레이션에 시달렸습니다. 여러 희생을 감수해야 했지만, 이탈리아는 유로존에 가입하는 데 성공했습니다. 이는 국가의 재정 신뢰도에 절실히 필요했던 활력을 불어넣어 금리를 낮추었습니다.\n\n이 중점은 처음에 금리를 6% 감소시키지만, 매월 0.1%씩 줄어듭니다."
 ITA_modify_additional_expenses_effect_TT: "이로 인해 주간 지출이 다음만큼 변동됩니다: [?additional_expenses_change|-] 십억\n"
 ITA_modify_nimby_modifier_effect_TT: "이로 인해 님비 현상의 효과가 다음만큼 변동됩니다: [?nimby_culture_change|%+]\n"
