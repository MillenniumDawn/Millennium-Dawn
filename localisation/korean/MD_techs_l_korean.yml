 module_naval_vls_cells_4: "VLS 발사대 (4셀)"
 module_naval_vls_cells_4_desc: "선체에 내장된 수직 발사 셀입니다. 셀 수가 함선의 발사 용량을 결정합니다. 발사대가 클수록 장착되는 미사일 탄약 적재량이 늘어나지만, 비용과 승조원 수, 피탐성도 함께 커집니다.\n\n§G설계 조언: VLS 셀은 함선의 미사일 임무 전투 능력치를 배가시킵니다. 발사대가 클수록 미사일 화력이 증가하지만 IC, 인력, 연료 사용량, 수상 피탐성이 더 늘어납니다.§!"
