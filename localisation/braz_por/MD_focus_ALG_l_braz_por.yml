 ALG_renewable_focused_energy: "Nação iniciante em energia renovável"
 ALG_renewable_focused_energy_desc: "A Argélia decidiu aproveitar seu grande potencial de produção de energia renovável. Embora cara e de baixa densidade energética, a energia renovável ajudará o meio ambiente."
