 BOS_air_doctrine: "Réviser la doctrine aérienne"
 BOS_air_doctrine_desc: "La petite arme aérienne de la Bosnie a besoin d'une doctrine adaptée à la défense territoriale, au transport et à l'appui des forces terrestres."
 BOS_air_defence_initiative: "Initiative de défense aérienne"
 BOS_air_defence_initiative_desc: "Un réseau de défense aérienne en couches offre à la Bosnie une réponse pratique aux aéronefs hostiles, sans nécessiter une vaste flotte de chasseurs."
 BOS_apc_armament: "Véhicules blindés de transport de troupes"
 BOS_apc_armament_desc: "Équiper les unités de transporteurs de troupes blindés protégera l'infanterie tout en donnant aux formations mécanisées une plus grande puissance de feu."
 BOS_re_enlist_ratko_mladic: "Réengager Ratko Mladić"
 BOS_re_enlist_ratko_mladic_desc: "Rappeler Ratko Mladić au commandement fournirait de l'expérience au prix de la réconciliation et de la légitimité internationale."
 BOS_detain_ratko_mladic: "Arrêter Ratko Mladić"
 BOS_detain_ratko_mladic_desc: "La coopération avec la justice internationale écartera Ratko Mladić des affaires militaires, mais irritera de nombreux Serbes de Bosnie."
 BOS_sam_systems: "Déployer des systèmes SAM"
 BOS_sam_systems_desc: "Des sites de missiles surface-air fixes protégeront Sarajevo et les grandes infrastructures militaires contre les attaques aériennes."
 BOS_aa_personnel_equipment: "Équiper les unités de défense aérienne"
 BOS_aa_personnel_equipment_desc: "Les équipes mobiles de défense aérienne ont besoin de lanceurs modernes, de capteurs et d'entraînement pour accompagner les formations terrestres."
 BOS_helicopter_transportation: "Développer le transport par hélicoptère"
 BOS_helicopter_transportation_desc: "Une flotte d'hélicoptères de transport plus importante appuiera le déploiement rapide, l'évacuation et le secours en cas de catastrophe."
 BOS_radar_detection_advancement: "Détection radar avancée"
 BOS_radar_detection_advancement_desc: "Une station radar moderne reliera les unités de défense aérienne bosniaques et fournira un avertissement plus précoce des aéronefs approchants."
 BOS_domestic_production: "Production d'avions nationaux"
 BOS_domestic_production_desc: "Une usine militaire nationale soutiendra l'équipement de l'armée de l'air et réduira la dépendance à des fournisseurs étrangers incertains."
 BOS_national_air_force_scheme: "Programme de force aérienne nationale"
 BOS_national_air_force_scheme_desc: "Un programme national d'armée de l'air combinera les investissements chasseurs, d'appui et de basage sous un seul plan d'acquisition."
 BOS_house_of_representatives: "Renforcer la Chambre des représentants"
 BOS_house_of_representatives_desc: "Une Chambre des représentants plus forte donnera à la législation nationale un mandat démocratique clair tout en préservant la représentation constitutionnelle de chaque peuple constitutif."
 BOS_bosnian_elections_crisis_gate_tt: "Disponible uniquement tant que le pays est en conditions de crise financière."
 BOS_the_federation: "Renouveler le pacte fédéral"
 BOS_the_federation_desc: "Renouveler le pacte fédéral clarifiera les pouvoirs des entités et réduira l'influence étrangère, bien que chaque direction constitutive doive céder une part de sa liberté d'action."
 BOS_elections_political: "Réformer le système électoral"
 BOS_elections_political_desc: "La réforme électorale établira un mandat durable pour la présidence tournante et déterminera quelle coalition nationale contrôle le programme de modernisation."
 BOS_balkan_backyard: "Cour des Balkans"
 BOS_balkan_backyard_desc: "La mémoire partagée de la prospérité yougoslave peut soutenir un projet régional volontaire, mais les gouvernements voisins doivent être persuadés plutôt que pressés ou contraints."
 BOS_fight_or_perish: "Combattre ou périr"
 BOS_fight_or_perish_desc: "L'État puisera dans sa main-d'œuvre restante et acceptera la tension nécessaire pour survivre à la guerre civile."
 BOS_unified_armed_forces: "Forces armées unifiées"
 BOS_unified_armed_forces_desc: "Une force unifiée acceptable pour tous les peuples constitutifs achèvera le programme de relance coopératif et mettra fin aux mesures financières d'urgence."
 BOS_anti_federation_propaganda: "Contester la Fédération"
 BOS_anti_federation_propaganda_desc: "Contester l'autorité fédérale, orienter la nouvelle industrie vers la Republika Srpska et approfondir les liens avec la Serbie au prix de la stabilité nationale."
 BOS_alija_izetbegovic_legacy: "Héritage d'Alija Izetbegović"
 BOS_alija_izetbegovic_legacy_desc: "L'héritage d'Alija Izetbegović lie l'État bosniaque à la fois aux institutions démocratiques et à la mobilisation de guerre. Ses successeurs doivent décider quelle part de cet héritage guidera la Bosnie."
 BOS_european_relations: "Raviver l'héritage yougoslave"
 BOS_european_relations_desc: "Une ouverture culturelle et politique à travers l'ex-Yougoslavie transformera la nostalgie en soutien à la coopération régionale."
 BOS_revive_relation_with_serbia_yugoslavia: "Rétablir les relations avec [SER.GetName]"
 BOS_revive_relation_with_serbia_yugoslavia_desc: "Rétablir des liens officiels avec la Serbie renforcera le gouvernement dirigé par la Srpska tout en alarmant les dirigeants bosniaques et croates."
 BOS_eu_loans: "Prêts de développement de l'UE"
 BOS_eu_loans_desc: "Le crédit européen au développement fournira une liquidité immédiate pour la reconstruction tout en ajoutant une obligation de dette mesurée."
 BOS_bosnian_revanchism: "Le revanchisme bosniaque"
 BOS_bosnian_revanchism_desc: "Les dirigeants revanchards placeront les revendications de guerre bosniaques au-dessus du compromis de Dayton, renforçant les intérêts militaires tout en risquant un conflit communautaire renouvelé."
 BOS_western_objectives: "Alignement occidental"
 BOS_western_objectives_desc: "Un alignement occidental ferme ouvrira les institutions euro-atlantiques et l'assistance de sécurité tout en fermant l'alternative orientale."
 BOS_eastern_frontier: "Alignement Est"
 BOS_eastern_frontier_desc: "La Bosnie poursuivra des partenariats russes et serbes comme contrepoids oriental à la tutelle occidentale."
 BOS_a_new_struggle: "Une nouvelle lutte"
 BOS_a_new_struggle_desc: "Les organisateurs revanchards mobiliseront les réseaux nationalistes et affaibliront le règlement politique de l'après-guerre."
 BOS_us_assistance: "Aide américaine"
 BOS_us_assistance_desc: "Des liens commerciaux plus étroits avec les États-Unis remplaceront de larges liens commerciaux OTAN par un partenariat bilatéral ciblé."
 BOS_bosnian_euro_defence_clause: "Garanties de défense européennes"
 BOS_bosnian_euro_defence_clause_desc: "Les principaux États européens décideront individuellement s'ils garantissent la Bosnie alors qu'EUFOR transfère la responsabilité aux institutions nationales."
 BOS_russo_bosnian_alignment: "Partenariat russe"
 BOS_russo_bosnian_alignment_desc: "Un partenariat formel avec la Russie approfondira le commerce oriental et le soutien politique sans effacer la souveraineté bosniaque."
 BOS_serbian_bosnian_arms_treaty: "Traité d'armement bosniaque avec [SER.GetName]"
 BOS_serbian_bosnian_arms_treaty_desc: "Des licences de production serbes accéléreront le réarmement tout en accroissant l'influence de Belgrade sur la politique de défense bosniaque."
 BOS_srpska_supremacy: "Suprématie serbe"
 BOS_srpska_supremacy_desc: "Un programme suprémaciste démantèlera le partage du pouvoir et placera l'État sous les institutions de la Srpska, provoquant les autres peuples constitutifs."
 BOS_national_awakening: "Réveil national"
 BOS_national_awakening_desc: "Le mouvement revanchard rompra avec la tutelle internationale et préparera une prise de pouvoir islamiste de l'État."
 BOS_relax_conscription_laws: "Assouplir les lois sur la conscription"
 BOS_relax_conscription_laws_desc: "Réduire le service obligatoire allégera le fardeau des ménages alors que les forces des entités reviennent sous contrôle civil national."
 BOS_cooperation_alignment: "Alignement coopératif"
 BOS_cooperation_alignment_desc: "L'administration conjointe et les mesures anti-corruption aligneront les entités sur Sarajevo sans abolir leur autonomie."
 BOS_bosnian_trade_alliance: "Partenariat sur les armes occidentales"
 BOS_bosnian_trade_alliance_desc: "Des licences américaines d'aéronefs et d'armes d'infanterie ancreront un partenariat d'armement occidental."
 BOS_beograd_conference: "Conférence de Belgrade"
 BOS_beograd_conference_desc: "Une conférence à Belgrade réglera les différends de sécurité et économiques avant que la Bosnie ne cherche une alliance orientale plus large."
 BOS_muslim_strong_arm: "Avant-garde islamiste"
 BOS_muslim_strong_arm_desc: "Une avant-garde islamiste consolidera le nouveau régime et cherchera le soutien de gouvernements sympathisants à l'étranger."
 BOS_muslim_nationalism: "Nationalisme musulman"
 BOS_muslim_nationalism_desc: "Le nationalisme musulman combinera autorité religieuse, mobilisation et une politique étrangère interventionniste."
 BOS_demote_serbian_irrational_nationalism_new: "Contenir les extrémistes serbes"
 BOS_demote_serbian_irrational_nationalism_new_desc: "Les partis fédéraux isoleront les factions serbes dures, échangeant une tension à court terme contre un État civique plus fort."
 BOS_accommodate_serbian_pride_new: "Accueillir l’autonomie serbe"
 BOS_accommodate_serbian_pride_new_desc: "Des concessions constitutionnelles reconnaîtront l'autonomie serbe et attireront les partis modérés de la Srpska au gouvernement."
 BOS_nato_status: "Rechercher l’adhésion à l’OTAN"
 BOS_nato_status_desc: "La Bosnie ne cherchera l'adhésion à l'OTAN qu'après la réconciliation intérieure et la fin de la tutelle étrangère d'urgence."
 BOS_union_with_serbia: "Union avec la Serbie"
 BOS_union_with_serbia_desc: "La Serbie recevra une proposition négociée d'union politique et pourra accepter ou rejeter l'incorporation de la Bosnie."
 BOS_mosque_construction: "Programme de construction de mosquées"
 BOS_mosque_construction_desc: "Le soutien de l'État aux mosquées et institutions religieuses approfondira l'identité islamique du régime."
 BOS_milorad_dodik_new: "Milorad Dodik sur la touche"
 BOS_milorad_dodik_new_desc: "Démanteler le réseau de patronage de Milorad Dodik réduira la corruption mais aliénera une partie de l'électorat de la Srpska."
 BOS_european_affairs: "Affaires européennes"
 BOS_european_affairs_desc: "Le commerce européen et les institutions démocratiques deviendront le fondement de la politique étrangère pacifique de la Bosnie."
 BOS_pathway_towards_eu_membership: "Parcours d’adhésion à l’UE"
 BOS_pathway_towards_eu_membership_desc: "La Bosnie satisfera aux exigences européennes d'infrastructure et de gouvernance tandis que les membres de l'UE décideront d'investir."
 BOS_formation_of_bonds_with_the_eu: "Tisser des liens économiques avec l'UE"
 BOS_formation_of_bonds_with_the_eu_desc: "Des liens commerciaux élargis avec l'Union européenne approfondiront l'accès au marché et réduiront les coûts de financement."
 BOS_yugoslav_cultural_revival: "Renouveau culturel yougoslave"
 BOS_yugoslav_cultural_revival_desc: "Le cinéma, la musique et les mémoriaux de guerre partagés financés par l'État présenteront les décennies yougoslaves comme un héritage commun plutôt qu'une expérience ratée."
 BOS_common_market_proposal: "Proposition de marché commun"
 BOS_common_market_proposal_desc: "Une offre de commerce sans droits de douane entre les États successeurs reconstruira les liens commerciaux rompus dans les années 1990."
 BOS_federal_charter: "Rédiger une Charte fédérale"
 BOS_federal_charter_desc: "Un projet de constitution publié pour une fédération volontaire donnera au mouvement de réunification un programme politique concret."
 BOS_reconciliation_commission: "Commission de réconciliation"
 BOS_reconciliation_commission_desc: "Une commission conjointe sur les griefs de guerre entendra les témoignages des trois peuples constitutifs et abaissera le coût intérieur du projet yougoslave."
 BOS_convene_the_federation: "Convoquer la Fédération"
 BOS_convene_the_federation_desc: "Sarajevo convoquera les gouvernements successeurs pour négocier une fédération restaurée une fois que le soutien populaire le permettra."
 BOS_greater_srpska_state: "Un État de la Grande Srpska"
 BOS_greater_srpska_state_desc: "L'État centralisé sera reconstruit autour des institutions de la Srpska, remplaçant le projet d'union par la suprématie de l'entité à l'intérieur."
 BOS_purge_the_federation: "Purger la Fédération"
 BOS_purge_the_federation_desc: "Les responsables bosniaques et croates seront écartés des ministères, des tribunaux et des commandements de police, mettant fin à la résistance organisée au règne de la Srpska."
 BOS_srpska_command_primacy: "Primauté du commandement Srpska"
 BOS_srpska_command_primacy_desc: "Les officiers de la Srpska occuperont tous les postes supérieurs des forces armées, liant l'armée à la direction de l'entité."
 BOS_dominant_entity: "L'entité dominante"
 BOS_dominant_entity_desc: "La Srpska gouverne désormais la Bosnie de fait et de droit. Les institutions fédérales restantes existent pour servir l'entité."
 BOS_council_democracy: "Démocratie des conseils"
 BOS_council_democracy_desc: "Les conseils d'entreprise éliront des délégués aux organes nationaux, donnant au travail organisé un rôle constitutionnel permanent."
 BOS_nationalize_heavy_industry: "Nationaliser l’industrie lourde"
 BOS_nationalize_heavy_industry_desc: "L'État prendra des participations de contrôle dans les aciéries, les mines et les usines de machines et les placera sous gestion des conseils."
 BOS_workers_republic: "Proclamer la République des travailleurs"
 BOS_workers_republic_desc: "Le mouvement ouvrier remplacera l'ordre post-Dayton par une république socialiste gouvernée par ses conseils."
 BOS_business_sector_management: "Développer le secteur des affaires"
 BOS_business_sector_management_desc: "Un projet de bureaux budgété à Sarajevo formalisera l'économie de services, pourvu qu'assez de travailleurs soient disponibles pour le doter."
 BOS_lumber_harvesting: "Développer le secteur forestier"
 BOS_lumber_harvesting_desc: "Une sylviculture durable et des normes de transformation élargiront les exportations rurales sans dépendre d'un autre programme de subventions permanentes."
 BOS_land_mines_desc: "Les champs de mines de la guerre continuent de tuer des civils, de restreindre l'habitat et de retirer des terres productives de l'usage."
 BOS_prep_for_civil_war_map: "Préparatifs de guerre civile"
 BOS_prep_for_civil_war: "Opérations de préparation à la guerre civile"
 BOS_prep_for_civil_war_desc: "La Republika Srpska se réarme alors que la Bosnie s'approche d'un conflit civil renouvelé. Des opérations préparatoires peuvent sécuriser des armes et améliorer la préparation du gouvernement avant le début des combats."
 BOS_bosnian_faction_management: "Gestion des groupes constituants"
 BOS_internal_factions: "Les peuples de Bosnie"
 BOS_internal_factions_desc: "Le règlement de Dayton divise l'autorité entre les institutions nationales, la Fédération de Bosnie-Herzégovine et la Republika Srpska. La politique du gouvernement modifie l'Attitude, la Stabilité et la volonté de fournir de la Main-d'œuvre de chaque groupe constitutif."
 BOS_return_of_entitled_lands: "Intégrer les terres contrôlées"
 BOS_return_of_entitled_lands_desc: "Intégrer un État voisin contrôlé après qu'il ait atteint au moins 80 % de Conformité et soit tombé sous 10 % de Résistance."
 BOS_islamic_uprising: "Sort de la guerre civile bosniaque"
 BOS_islamic_uprising_desc: "Les combattants d'El Mudžahid peuvent se retourner contre Sarajevo et la Republika Srpska si la guerre civile dépasse leur patience."
 BOS_declare_islamic_takeover: "Révolte d'El Mudzahid"
 BOS_declare_islamic_takeover_desc: "Des combattants islamistes étrangers se préparent à rompre avec le gouvernement et à établir leur propre État pendant que la guerre civile continue."
 BOS_core_states_2: "Intégrer [FROM.GetName]"
 BOS_core_states_2_desc: "Engager des ressources politiques et industrielles pour intégrer cet État voisin conforme."
 BOS_raid_weapon_stockpiles: "Stocks d’armes de raid"
 BOS_raid_weapon_stockpiles_desc: "Saisir les armes d'infanterie dans les dépôts de guerre non sécurisés avant qu'un nouveau conflit civil ne commence."
 BOS_civil_war: "L'orage qui s'annonce"
 BOS_civil_war_desc: "La Republika Srpska se prépare à faire sécession. Si la crise n'est pas résolue, la guerre civile commencera à l'expiration de cette mission."
 BOS_croats_declare_independence: "Les Croates proclament l'indépendance"
 BOS_croats_declare_independence_desc: "Des communautés croates hostiles pourraient soutenir une sécession herzégovinienne si la stabilité nationale reste faible."
 BOS_srpska_declares_independence: "La Republika Srpska proclame son indépendance"
 BOS_srpska_declares_independence_desc: "Des communautés serbes hostiles pourraient soutenir une sécession si la stabilité nationale reste faible."
 BOS_quell_serbians: "Réprimer l’opposition serbe"
 BOS_quell_serbians_desc: "Utiliser des mesures coercitives contre les organisations serbes hostiles, réduisant leur Attitude et leur Stabilité tout en déplaçant le soutien des partis."
 BOS_gain_srpska_popular_support: "Gagner le soutien populaire serbe"
 BOS_gain_srpska_popular_support_desc: "Financer le travail de terrain et des programmes locaux pour améliorer l'Attitude et la Stabilité serbes."
 BOS_fund_bosniak_community_programs: "Financer des programmes communautaires bosniaques"
 BOS_fund_bosniak_community_programs_desc: "Payer écoles, cliniques et services locaux dans les zones bosniaques sur le Trésor. Cela reconstruit la Confiance bosniaque comme le ferait une campagne politique, mais avec de l'argent au lieu de Puissance politique."
 BOS_fund_croat_community_programs: "Financer des programmes communautaires croates"
 BOS_fund_croat_community_programs_desc: "Payer écoles, cliniques et services locaux dans les zones croates sur le Trésor. Cela reconstruit la Confiance croate comme le ferait une campagne politique, mais avec de l'argent au lieu de Puissance politique."
 BOS_fund_srpska_community_programs: "Financer des programmes communautaires serbes"
 BOS_fund_srpska_community_programs_desc: "Payer écoles, cliniques et services locaux dans les zones serbes sur le Trésor. Cela reconstruit la Confiance serbe comme le ferait une campagne politique, mais avec de l'argent au lieu de Puissance politique."
 BOS_collaboration_with_serbians: "Coopérer avec les dirigeants serbes"
 BOS_collaboration_with_serbians_desc: "Transformer les dirigeants serbes amicaux en partenaires loyaux par une coopération politique soutenue."
 BOS_quell_bosniaks: "Réprimer l’opposition bosniaque"
 BOS_quell_bosniaks_desc: "Recourir à des mesures coercitives contre les organisations bosniaques hostiles, au prix d'une instabilité immédiate, afin de recomposer le soutien des partis."
 BOS_collaboration_with_bosniaks: "Coopérer avec les dirigeants bosniaques"
 BOS_collaboration_with_bosniaks_desc: "Transformer les dirigeants bosniaques amicaux en partenaires loyaux par une coopération politique soutenue."
 BOS_quell_croats: "Réprimer l’opposition croate"
 BOS_quell_croats_desc: "Recourir à des mesures coercitives contre les organisations croates hostiles, au prix d'une instabilité immédiate, afin de recomposer le soutien des partis."
 BOS_gain_bosniak_popular_support: "Gagner le soutien populaire bosniaque"
 BOS_gain_bosniak_popular_support_desc: "Financer le travail de terrain et des programmes locaux pour améliorer l'Attitude et la Stabilité bosniaques."
 BOS_collaboration_with_croats: "Coopérer avec les dirigeants croates"
 BOS_collaboration_with_croats_desc: "Transformer les dirigeants croates amicaux en partenaires loyaux par une coopération politique soutenue."
 BOS_gain_croat_popular_support_desc: "Financer le travail de terrain et des programmes locaux pour améliorer l'Attitude et la Stabilité croates."
 BOS_destabilize_the_government_desc: "Faire s'effondrer délibérément la confiance publique et la préparation à la guerre. Avec la stabilité et le soutien à la guerre ainsi abaissés, des entités serbes ou croates hostiles peuvent se déclarer indépendantes."
 BOS_srpska_faction: "Serbs"
 BOS_bosniak_faction: "Bosniaques"
 BOS_croat_faction: "Croates"
 srpska_attitude_friendly: "§GAmical§!"
 BOS_all_factions_at_least_friendly_trigger: "Les trois groupes constitutifs sont au moins §Gamicaux§!"
 bosniak_attitude_friendly: "§GAmical§!"
 croat_attitude_friendly: "§GAmical§!"
 BOS_anti_government_demonstrations_desc: "Beaucoup sont descendus dans la rue à cause de nos actions. Les troubles s'apaiseront une fois que l'Attitude et la Stabilité du peuple concerné se seront rétablies."
 BOS_internal_faction_balance: "Les peuples de Bosnie"
 BOS_internal_faction_balance_desc: "L'équilibre des intérêts bosniaques, croates et serbes dans l'appareil d'État façonne la stabilité et le recrutement."
 BOS_landmine_contamination: "Contamination par les mines terrestres"
 BOS_landmine_contamination_desc: "Les champs de mines de guerre non dépollués dans cette région tuent des civils, restreignent l'habitat et tiennent les terres productives hors d'usage."
 BOS_cooperator: "Coopérateur bosniaque"
 BOS_political_reformer: "Réformateur politique"
 BOS_presidency_rotation_cooldown: "La rotation est due"
 BOS_rotation_of_leaders: "Effectuer une rotation présidentielle"
 BOS_rotation_of_leaders_desc: "Transférer la présidence collective au prochain représentant constitutif une fois la période de rotation actuelle achevée."
 BOS_rotation_branch_available_tt: "Un des représentants des peuples constitutifs préside actuellement la Présidence"
 BOS_s_bridge_builder: "Le bâtisseur de ponts de la Bosnie"
 bos_croat_war_info_tool_tip: "§RNOTE§!\nLa Herceg-Bosna fera sécession et nous déclarera la guerre ainsi qu'à la Republika Srpska.\nCertains focuses seront verrouillés jusqu'à la fin de la guerre civile.\nUne fois la guerre terminée, un événement les déverrouillera à nouveau."
 bos_dodik_gains_power_2010_tt: "Milorad Dodik arrive au pouvoir vers 2010-2011"
 bos_this_will_lock_certain_paths_within_the_focus_tree: "§RCela verrouillera des chemins dans certaines parties de l'arbre de focuses§!"
 BOS_united_nations_aid: "Aide des partenaires internationaux"
 BOS_croats_declare_independence_hidden: "Restaurer les zones démilitarisées d’après-guerre"
 BOS_croats_declare_independence_hidden_desc: "Rétablir les zones démilitarisées des entités lorsque la crise de sécession n'a pas débouché sur la guerre civile."
 bos_srpska_builds_up: "§YLa Republika Srpska§! a vu nos actes et a commencé le §Rréarmement§! de tous les anciens personnels d'active !"
 bos_remove_idea_tooltips: "Le joueur peut désormais justifier des buts de guerre \nL'effondrement de guerre civile sera retiré"
 BOS_financial_crisis_desc: "La chute des exportations, le crédit rare et le chômage en hausse affaiblissent les finances publiques bosniaques. Un programme de relance cohérent peut raccourcir la crise."
 BOS_treasury_higher_than_3_5_tt: "Exige plus de §Y3,5 milliards de $§! au Trésor."
 BOS_treasury_higher_than_4_5_tt: "Exige plus de §Y4,5 milliards de $§! au Trésor."
 BOS_treasury_higher_than_8_5_tt: "Exige plus de §Y8,5 milliards de $§! au Trésor."
 BOS_treasury_higher_than_4_3_tt: "Exige plus de §Y4,3 milliards de $§! au Trésor."
 BOS_treasury_higher_than_12_6_tt: "Exige plus de §Y12,6 milliards de $§! au Trésor."
 BOS_convene_the_federation_tt: "£decision_icon_small La décision §YConvoquer la Fédération§! achève la réunification une fois que chaque État successeur atteint §Y75 %§! de yougonostalgie et que nous menons le renouveau"
