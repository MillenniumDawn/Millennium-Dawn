 EQ_MOD_SLOT_special_slot_type_6_TITLE: "$EQ_MOD_SLOT_special_slot_type_1_TITLE$"
 air_air_range_increase: "§Y모든 항공기:§!\n$MODIFIER_AIR_RANGE_FACTOR$ §G+35%§!\n£fuel_consumption_texticon 연료 소비 §R+45%§!"
 EQ_MOD_CAT_plane_strategic_bombs_category_TITLE: "전략 폭탄"
 tech_air_hypersonic_engine_upgrade_1: "극초음속 엔진 개량"
 tech_air_hypersonic_engine_upgrade_1_desc: "정제된 고온 소재, 개선된 흡입구 형상, 더 똑똑한 연료 관리는 극초음속 추진을 실험적인 단발성 수준에서 반복 가능한 실전 성능으로 끌어올립니다. 이 개량은 지속 속도와 고고도 효율을 높여 요격을 더 어렵게 하고 타격 시점을 훨씬 예측하기 어렵게 만듭니다."
 tech_air_anti_ship_drone_1: "대함 타격 드론 II"
 tech_air_anti_ship_drone_1_desc: "초기 공중 발사식 대함 드론은 정밀 유도와 원거리 운용으로 수상함을 위협하는 더 저렴한 방법을 제공합니다. 이는 해군 항공의 도달 범위를 확장하고, 적 함대가 값비싼 요격 미사일을 소모하도록 강제하는 집중 공격을 가능하게 합니다."
 tech_air_anti_ship_drone_2: "대함 타격 드론 III"
 tech_air_anti_ship_drone_2_desc: "개선된 탐색기와 데이터링크는 회피하는 함선에 대한 더 나은 목표 식별, 중간 유도 갱신, 재공격 논리를 가능하게 합니다. 사거리와 생존성이 늘어난 이 드론은 방공망의 틈을 이용하고 해안선 너머의 기동 함대를 압박할 수 있습니다."
 tech_air_anti_ship_drone_3: "대함 타격 드론 IV"
 tech_air_anti_ship_drone_3_desc: "네트워크로 연결된 타격 드론은 접근 각도를 조율하고, 표적 정보를 공유하며, 다층 방어를 압도하도록 설계된 포화 공격을 수행할 수 있습니다. 강화된 유도 장치와 전자 대대응 수단은 재밍 상황에서도 효과를 유지시켜, 물량을 신뢰할 수 있는 해상 타격 능력으로 바꿔 놓습니다."
 air_tech_gunship_railgun_1: "레일건 건십 II"
 air_tech_gunship_railgun_1_desc: "초기 레일건 건십 통합은 막대한 직사 화력을 안정적인 공중 플랫폼에 집중시켜, 시선이 확보되면 드론, 항공기, 지상 목표를 신속히 파괴할 수 있게 합니다. 이 개념은 매우 효과적이지만, 대규모 발전 설비와 강력한 냉각, 값비싼 소재를 요구합니다."
 air_tech_gunship_railgun_2: "레일건 건십 III"
 air_tech_gunship_railgun_2_desc: "개선된 축전기, 반동 관리, 사격 통제 덕분에 레일건 건십은 치명적인 마모 없이 더 높은 발사 속도를 유지할 수 있습니다. 향상된 센서 융합은 목표 인계 시간을 단축하고 명중률을 높여, 이 항공기를 틈새 전시용이 아닌 믿을 수 있는 전장의 분쇄기로 만듭니다."
 air_tech_gunship_railgun_3: "레일건 건십 IV"
 air_tech_gunship_railgun_3_desc: "차세대 설계는 전력 효율과 열 안정성을 최적화하고 첨단 표적 지정 및 전자전 저항 능력을 통합합니다. 이로써 레일건 건십은 분쟁 지역 공역에서도 생존하며 다층 방어를 해체할 수 있는 지속적이고 치명적인 플랫폼이 되지만, 주요 강대국만이 감당할 수 있는 가격이 따릅니다."
 air_tech_railgun_cannons_1: "공중 레일건 기관포 II"
 air_tech_railgun_cannons_1_desc: "소형화된 동력 체계와 보강된 거치대 덕분에 레일건 기관포를 고성능 항공기에 사용할 수 있게 되었으며, 재래식 기관포보다 극도로 높은 포구 속도와 더 평탄한 교전 궤도를 제공합니다. 그 결과 짧은 시간에 더 높은 살상력을 얻지만, 열, 전력 소모, 복잡한 정비라는 대가를 치릅니다."
 air_tech_railgun_cannons_2: "공중 레일건 기관포 III"
 air_tech_railgun_cannons_2_desc: "3세대 공중 레일건은 포신 수명, 축전기 순환, 사격 통제 통합이 개선되어 치명적인 마모 없이 지속적인 연사가 가능합니다. 향상된 열 관리와 더 똑똑한 표적 지정으로 이 기관포는 항공기, 드론, 심지어 근거리의 일부 미사일 위협까지 분쇄하는 실용적인 해법이 됩니다."
 air_tech_pdl_1: "공중 점방어 레이저 II"
 air_tech_pdl_1_desc: "소형 레이저 방사기와 향상된 추적 능력 덕분에 항공기는 날아오는 미사일과 근거리에서 교전하여 충돌 전에 탐색기와 조종면을 손상시킬 수 있습니다. 이 체계는 기동과 대응 수단을 대체하지는 않지만, 단 몇 초가 생존을 좌우하는 상황에서 새로운 방어층을 더해 줍니다."
 air_tech_pdl_2: "공중 점방어 레이저 III"
 air_tech_pdl_2_desc: "더 높은 출력의 빔과 향상된 열 관리로 더 긴 사격 가능 시간과 현대식 미사일 탐색기에 대한 더 확실한 격추가 가능해집니다. 탑재 센서의 통합 지시는 반응 시간을 단축하고 복잡한 고속 교전에서의 효율을 높입니다."
 air_tech_pdl_3: "공중 점방어 레이저 IV"
 air_tech_pdl_3_desc: "차세대 공중 레이저 방어는 기민한 빔 제어, 강화된 광학 장치, 자동 위협 우선순위 지정을 결합하여 일제 공격과 드론 떼에 대응합니다. 더 강력한 전력 완충과 전자전 통합으로 항공기는 포화 미사일 공격 속에서도 생존할 수 있습니다."
 air_module_railgun_gunship_1: "레일건 건십 패키지 I"
 air_module_railgun_gunship_1_desc: "고출력 레일건 거치대를 중심으로 구성된 전용 건십 형상으로, 항공기, 드론, 지상 목표를 맹렬한 직사 화력으로 찢어발기도록 설계되었습니다. 표적 상공에 머물 수 있다면 파괴적이지만, 전력 수요, 열 관리, 첨단 소재 때문에 생산과 유지에 극도로 많은 비용이 듭니다."
 air_module_railgun_gunship_2: "레일건 건십 패키지 II"
 air_module_railgun_gunship_2_desc: "$air_module_railgun_gunship_1_desc$"
 air_module_railgun_gunship_3: "레일건 건십 패키지 III"
 air_module_railgun_gunship_3_desc: "$air_module_railgun_gunship_1_desc$"
 air_module_railgun_gunship_4: "레일건 건십 패키지 IV"
 air_module_railgun_gunship_4_desc: "$air_module_railgun_gunship_1_desc$"
 air_module_anti_ship_drone_missile_1: "대함 드론 미사일 I"
 air_module_anti_ship_drone_missile_1_desc: "대함 드론 미사일은 무인 투하 방식과 수상함 탐색 및 교전에 최적화된 탐색기를 결합하여 특화된 해상 타격 능력을 제공합니다. 표적 지정 장치는 해상 타격 정확도를 높이고 함선에 대한 전반적인 타격 효율을 증가시키지만, 전용 설계 때문에 다른 임무 유형에 대한 유연성은 제한됩니다.\n\n§G설계 힌트: 대함 드론 미사일은 해상 타격 표적 지정과 해상 타격 공격력을 높이지만, 특화되어 있어 대함 임무 외에서는 효용이 낮고 자원이 더 소모됩니다.§!"
 air_module_anti_ship_drone_missile_2: "대함 드론 미사일 II"
 air_module_anti_ship_drone_missile_2_desc: "$air_module_anti_ship_drone_missile_1_desc$"
 air_module_anti_ship_drone_missile_3: "대함 드론 미사일 III"
