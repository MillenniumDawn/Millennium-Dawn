 EH_fabiola_gianotti_special_effect_tt: "§YФабиола Джанотти§! изучит дополнительные свойства §Yрэндаллита§!, что увеличит еженедельную добычу этого ресурса на 50% на каждой шахте."
 EH_lene_hau_special_effect_tt: "§YЛене Хау§! займётся изучением энергетических выбросов §Rпорталов§!, что сократит время выполнения фокусов §Y$EH_but_how_does_this_key_work$§! и §Y$EH_project_tesla$§! на §G30 дней§!."
 EH_randallite_discovery_TT: "§YДоктор Лиза Рэндалл§! открыла новый ресурс — §Yрэндаллит§!."
 EH_add_randallite_effect_tt: "[THIS.GetFlag][THIS.GetAdjective] §Yзапас рэндаллита§!: [?add_randallite|=+.0]\n"
 EH_randallite_tab_enabled_idea_TT: "Открывает окно управления §Yрэндаллитом§! и §Yмехами§! на §Gвкладке производства§!, где можно следить за запасом, добычей и расходом рэндаллита, а также производить новые мехи HACS для армии.\n\nЭффекты рэндаллита умножаются на количество этого ресурса в запасе."
