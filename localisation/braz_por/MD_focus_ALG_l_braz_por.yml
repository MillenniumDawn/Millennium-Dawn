 ALG_transparent_budget: "Orçamento Transparente"
 ALG_appoint_sellal: "Nomear Abdelmalek Sellal"
 ALG_appoint_sellal_desc: "Tecnocrata e leal a Bouteflika, Sellal representa a continuidade e a governança pragmática, com foco na estabilidade e na gestão das instituições estatais."
 ALG_sellal_gets_appointed: "Abdelmalek Sellal foi nomeado Primeiro-Ministro."
 ALG_sellal_modifiers: "§YEfeitos da Nomeação de Sellal:§!\nDeriva Democrática: §G+0.10§!\nCustos de Burocracia: §G-10%§!\nReceita de Impostos: §G+3%§!\nGastos Esperados com Polícia: §R-1§!\nGastos Esperados com Saúde: §R-1§!"
 ALG_appoint_ouyahia: "Nomear Ahmed Ouyahia"
 ALG_appoint_ouyahia_desc: "Ouyahia é um político veterano com reputação de austeridade severa e lealdade ao establishment governante. Seu estilo de liderança favorece o controle centralizado e a disciplina financeira."
 ALG_ouyahia_gets_appointed: "Ahmed Ouyahia foi nomeado Primeiro-Ministro."
 ALG_ouyahia_modifiers: "§YEfeitos da Nomeação de Ouyahia:§!\nDeriva Democrática: §G+0.10§!\nCustos de Burocracia: §G-10%§!\nReceita de Impostos: §G+3%§!\nGastos Esperados com Polícia: §R-1§!\nGastos Esperados com Saúde: §R-1§!"
 ALG_appoint_bedoui: "Nomear Noureddine Bedoui"
 ALG_appoint_bedoui_desc: "Bedoui, burocrata de carreira e ministro, personifica a lealdade tecnocrática à presidência. Seu estilo de governo enfatiza a eficiência administrativa e reformas limitadas."
 ALG_bedoui_gets_appointed: "Noureddine Bedoui foi nomeado Primeiro-Ministro."
 ALG_bedoui_modifiers: "§YEfeitos da Nomeação de Bedoui:§!\nDeriva Democrática: §G+0.10§!\nCustos de Burocracia: §G-10%§!\nReceita de Impostos: §G+3%§!\nGastos Esperados com Polícia: §R-1§!\nGastos Esperados com Saúde: §R-1§!"
 ALG_no_pm_set: "§RNenhum Primeiro-Ministro Nomeado§!"
 ALG_ahmed_gaid_salah_desc: "Chefe do Estado-Maior do Exército Nacional Popular, Ahmed Gaïd Salah foi um oficial de carreira que ascendeu nas fileiras durante a Guerra de Independência e depois se tornou uma das figuras mais influentes nos assuntos militares e políticos da Argélia."
 ALG_smain_lamari_desc: "Chefe dos serviços de inteligência e contraespionagem da Argélia, Smain Lamari desempenhou um papel central na 'Guerra Suja' contra os insurgentes islamistas durante a Década Negra."
 ALG_kaidi_mohamed_desc: "Um oficial respeitado com experiência em formações mecanizadas, Kaidi Mohamed se especializou em guerra blindada e na modernização das forças terrestres da Argélia."
 ALG_ahcene_tafer_desc: "Ahcène Tafer era conhecido por sua liderança nas unidades mecanizadas da Argélia e por seu papel na reestruturação do exército nos anos pós-guerra civil."
 ALG_mohammed_larbi_haouli_desc: "Mohammed Larbi Haouli comandou a Marinha Argelina durante um período de modernização, equilibrando a defesa costeira com a cooperação regional."
 ALG_ammar_atamnia_desc: "Oficial sênior que atuou como estrategista nas forças terrestres da Argélia, Ammar Atamnia era conhecido por sua ênfase na guerra defensiva e no treinamento militar."
 ALG_mohammed_al_arabi_hawalli_desc: "Mohammed Al-Arabi Hawalli ocupou cargos de comando naval e contribuiu para a reforma das forças marítimas da Argélia."
 ALG_mahmoud_laraba_desc: "Comandante da força aérea, Mahmoud Laraba esteve envolvido no treinamento de pilotos e na reorganização da rede de defesa aérea da Argélia."
 ALG_mohamed_lamari_desc: "Como Chefe do Estado-Maior durante a Década Negra, Mohamed Lamari foi uma das figuras-chave na direção das operações de contrainsurgência da Argélia."
 ALG_said_chengriha_desc: "Said Chengriha se especializou em guerra blindada e logística, ascendendo depois ao comando das forças terrestres da Argélia e, por fim, servindo como Chefe do Estado-Maior."
 ALG_ben_ali_ben_ali_desc: "Comandante das unidades de elite da Argélia, Ben Ali Ben Ali construiu uma reputação de profissionalismo e disciplina na infantaria."
 ALG_fatima_zohra_ardjoune_desc: "Uma das primeiras mulheres da Argélia a alcançar o posto de General, Fatima Zohra Ardjoune foi médica militar e símbolo de modernização nas forças armadas."
 ALG_mohamed_mediene_desc: "Conhecido como 'Toufik', Mohamed Mediène foi chefe do poderoso serviço de inteligência da Argélia (DRS) de 1990 a 2015, o que o tornou uma das figuras mais influentes da história argelina moderna."
 ALG_abdelmalek_guenaizia_desc: "Abdelmalek Guenaizia atuou como Vice-Ministro da Defesa e, mais tarde, como Chefe do Estado-Maior, desempenhando um papel fundamental na modernização das forças armadas argelinas."
 ALG_ahmed_bousteila_desc: "Comandante da Gendarmaria Argelina, Ahmed Bousteila supervisionou a segurança das áreas rurais da Argélia e o combate ao contrabando e ao terrorismo."
 ALG_fatima_boudouani_desc: "A primeira mulher promovida a General no Exército Argelino (2009), Fatima Boudouani representou um avanço na integração de gênero nas forças armadas."
 alg_medal_1: "Ordem de 1º de Novembro"
 alg_medal_1_desc: "Concedida por bravura excepcional na defesa da nação."
 alg_medal_2: "Medalha da Libertação Nacional"
 alg_medal_2_desc: "Comemora contribuições notáveis à luta pela independência da Argélia."
 alg_medal_3: "Medalha de Mérito Militar"
 alg_medal_3_desc: "Concedida por excelência no comando e no serviço."
 alg_medal_4: "Medalha de Valor"
 alg_medal_4_desc: "Reconhece atos de coragem no campo de batalha."
 alg_medal_5: "Medalha de Serviço ao Povo"
 alg_medal_5_desc: "Concedida por serviço abnegado na proteção de civis."
 alg_medal_6: "Medalha do Legado dos Mártires"
 alg_medal_6_desc: "Símbolo do sacrifício supremo pela nação."
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_0: "Segundo-tenente"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_1: "Tenente"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_2: "Capitão"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_3: "Major"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_4: "Coronel"
 algeria_intro.1.t: "A República Democrática Popular da Argélia"
 algeria_intro.1.d: "A Argélia entra no século XXI marcada pela sangrenta Década Negra, mas ainda de pé. O Estado sobreviveu à insurgência islamista, mas as feridas da guerra civil permanecem profundas. O Presidente Abdelaziz Bouteflika promete reconciliação e reconstrução, mas os desafios pela frente são enormes: reviver a economia, reformar os militares, reconstruir a confiança entre o povo e o Estado e navegar entre poderosos parceiros estrangeiros. A Argélia consolidará a estabilidade e se erguerá como potência regional, ou cairá mais uma vez em conflitos internos?"
 algeria_intro.1.a: "Uma nação marcada, mas não vencida."
 ALG_resistance_window_title: "Movimento de Resistência Argelino"
 ALG_resistance_window_desc: "A nação é abalada por protestos generalizados, agitação e resistência. Le Pouvoir busca suprimir a dissidência, mas quanto mais pressão é aplicada, mais forte a resistência se torna."
 ALG_protester_exhaustion_TT: "§YOs manifestantes§! estão exaustos das medidas repressivas do governo."
 ALG_deploys_security_TT: "§YO Estado mobiliza forças de segurança pesadas para reprimir a agitação.§!"
 ALG_presidential_decisions_only_one_is_available_TT: "Apenas uma medida de repressão pode estar ativa por vez."
 ALG_resistance_movement: "Movimento Hirak"
 ALG_resistance_movement_desc: "Protestos populares em todo o país, conhecidos como Hirak, continuam a exigir reforma política, transparência e justiça social em toda a Argélia."
 ALG_throttle_internet_speeds: "Portaria nº 24-17: Regulamentação das Telecomunicações"
 ALG_throttle_internet_speeds_desc: "Sob a Portaria 24-17, as autoridades restringem o acesso a plataformas on-line e redes sociais para atrapalhar os organizadores do Hirak. Isso limita a coordenação dos protestos, mas frustra os cidadãos e desacelera a atividade econômica."
 ALG_nationwide_security_presence: "Operação Falcão do Deserto: Presença de Segurança Nacional"
 ALG_fund_pro_government_protests: "Programa de Solidariedade Nacional: Iniciativa 'Baraka'"
 ALG_fund_pro_government_protests_desc: "O governo financia e organiza manifestações pró-regime sob o Projeto Baraka para contrapor o movimento Hirak. Isso pode amortecer o ímpeto da oposição, mas é custoso e corre o risco de inflamar o ressentimento público."
 ALG_deploy_security_kabylia_1: "Enviar Tropas de Segurança à Cabília"
 ALG_deploy_security_kabylia_1_desc: "A Cabília se tornou um foco de agitação. Enviar forças de segurança pode pacificar a região, mas corre o risco de inflamar ainda mais o ressentimento local."
 ALG_deploy_security_mzab_1: "Enviar Tropas de Segurança ao Vale do M'zab"
 ALG_deploy_security_mzab_1_desc: "As tensões no Vale do M'zab aumentaram. Enviar destacamentos de segurança pode conter a agitação localmente, mas operações truculentas correm o risco de alienar as comunidades e minar a confiança de longo prazo."
 ALG_deploy_security_aures_1: "Enviar Tropas de Segurança às Terras Altas do Aurès"
 ALG_deploy_security_aures_1_desc: "As terras altas do Aurès se tornaram um ponto focal das manifestações. Uma mobilização de segurança pode dispersar grandes aglomerações, mas sobrecarregará a logística em terreno acidentado e pode inflamar queixas regionais."
 ALG_deploy_security_tamanrasset_1: "Enviar Tropas de Segurança à Província de Tamanrasset"
 ALG_deploy_security_tamanrasset_1_desc: "As províncias do sul de Tamanrasset vivem um aumento da agitação. Enviar forças pode estabilizar rotas de transporte e instalações-chave, mas corre o risco de prejudicar as relações com as comunidades locais e interromper o comércio transaariano."
 ALG_deploy_security_granderg_1: "Enviar Tropas de Segurança ao Grande Erg Ocidental"
 ALG_deploy_security_granderg_1_desc: "A agitação em torno do Grande Erg Ocidental ameaçou povoados remotos e infraestruturas críticas. Patrulhas de segurança podem trazer ordem a curto prazo, mas o ambiente hostil torna as operações prolongadas custosas e politicamente delicadas."
 ALG_deploy_security_atlas_1: "Enviar Tropas de Segurança ao Sopé do Atlas"
 ALG_deploy_security_atlas_1_desc: "O sopé do Atlas tem sediado protestos e ações trabalhistas recorrentes. Um destacamento direcionado pode impedir mobilizações em massa ao longo dos corredores de transporte, mas pode alimentar o ressentimento das populações rurais."
 ALG_deploy_security_constantinois_1: "Enviar Tropas de Segurança à Região de Constantinois"
 ALG_deploy_security_constantinois_1_desc: "Constantina e seus arredores vivem manifestações frequentes. Concentrar forças de segurança aqui pode proteger instalações governamentais e portos, mas aumenta a probabilidade de confrontos em distritos urbanos densos."
 ALG_deploy_security_algerois_1: "Enviar Tropas de Segurança à Área Metropolitana de Argel"
 ALG_deploy_security_algerois_1_desc: "Argel continua sendo o centro da atividade do Hirak. Uma grande presença de segurança pode dissuadir mobilizações de rua e proteger as instituições, mas corre o risco de uma repressão visível na capital e de graves consequências políticas."
 ALG_deploy_security_oranais_1: "Enviar Tropas de Segurança a Orã e à Costa Ocidental"
 ALG_deploy_security_oranais_1_desc: "A região de Orã tem visto manifestações crescentes ligadas a redes trabalhistas e de jovens. O envio de forças pode proteger portos e polos econômicos, mas pode prejudicar o comércio e agravar as tensões com líderes locais."
 ALG_doing_decision: "Aplicando Atualmente uma Medida de Repressão"
 ALG_doing_decision_y: "Aplicando Atualmente uma Medida de Repressão"
 ALG_protests_ongoing: "Protestos em Todo o País em Andamento"
 ALG_locals_swayed: "Os Moradores Simpatizam com os Manifestantes"
 ALG_kabylia_fell_recently: "A Cabília Foi Pacificada Recentemente"
 ALG_oranais_fell_recently: "A Região de Orã Foi Pacificada Recentemente"
 ALG_algerois_fell_recently: "A Área Metropolitana de Argel Foi Pacificada Recentemente"
 ALG_constantinois_fell_recently: "A Região de Constantinois Foi Pacificada Recentemente"
 ALG_atlas_fell_recently: "O Sopé do Atlas Foi Pacificado Recentemente"
 ALG_granderg_fell_recently: "O Grande Erg Ocidental Foi Pacificado Recentemente"
 ALG_tamanrasset_fell_recently: "A Província de Tamanrasset Foi Pacificada Recentemente"
 ALG_aures_fell_recently: "As Terras Altas de Aurès Foram Pacificadas Recentemente"
 ALG_mzab_fell_recently: "O Vale do M'zab Foi Pacificado Recentemente"
 ALG_state_falls_TT: "§YEste estado§! caiu sob a influência dos manifestantes."
 algerian_events.201.t: "O Mzab Caiu nas Mãos dos Manifestantes"
 algerian_events.201.a: "Mais uma região escapa"
 algerian_events.202.t: "Aurès Caiu nas Mãos dos Manifestantes"
 algerian_events.202.a: "Os protestos se espalham"
 algerian_events.203.t: "Tamanrasset Caiu nas Mãos dos Manifestantes"
 algerian_events.203.a: "O sul está instável"
 algerian_events.204.t: "O Grande Erg Ocidental Caiu nas Mãos dos Manifestantes"
 algerian_events.204.a: "Até o deserto se levanta"
 algerian_events.205.t: "O Atlas Argelino Caiu nas Mãos dos Manifestantes"
 algerian_events.205.a: "A agitação se amplia"
 algerian_events.206.t: "Constantinois Caiu nas Mãos dos Manifestantes"
 algerian_events.206.a: "O leste entra em erupção"
 algerian_events.207.t: "A Cabília Caiu nas Mãos dos Manifestantes"
 algerian_events.207.a: "A Cabília se levanta de novo"
 algerian_events.208.t: "Algérois Caiu nas Mãos dos Manifestantes"
 algerian_events.208.a: "O coração da Argélia estremece"
 algerian_events.209.t: "Oranais Caiu nas Mãos dos Manifestantes"
 algerian_events.209.a: "O oeste está perdido"
 algerian_events.201.d: "O povo da região do Mzab desafiou o controle do governo e tomou as ruas.\nHumor dos mozabitas: [ALG_mozabite_satisfaction_text]"
 algerian_events.202.d: "Nas montanhas de Aurès, a agitação transbordou em desafio aberto.\nHumor dos chaouis: [ALG_chaoui_satisfaction_text]"
 algerian_events.203.d: "Apesar do isolamento, Tamanrasset entrou em erupção, e o governo perde o controle da área.\nHumor dos tuaregues: [ALG_tuareg_satisfaction_text]"
 algerian_events.204.d: "As comunidades do deserto do Grande Erg Ocidental aderiram à onda de protestos.\nDescontentamento público: [ALG_grievance_text]"
 algerian_events.205.d: "A região do Atlas, antes tranquila, tornou-se um foco de agitação antigovernamental.\nHumor dos árabes: [ALG_arab_satisfaction_text]"
 algerian_events.206.d: "Os protestos no leste sobrecarregam as forças de segurança locais, e Constantinois caiu.\nHumor dos árabes: [ALG_arab_satisfaction_text]"
 algerian_events.207.d: "A Cabília, com sua longa tradição de dissidência, está mais uma vez em desafio aberto ao Estado.\nHumor dos cabilas: [ALG_kabyle_satisfaction_text]"
 algerian_events.208.d: "Até a região da capital foi abalada por protestos incontroláveis.\nControle militar: [ALG_army_grip_text]"
 algerian_events.209.d: "No oeste, Oranais se junta à onda de agitação que varre a Argélia.\nHumor dos árabes: [ALG_arab_satisfaction_text]"
 algerian_events.200.t: "Protestos Reprimidos"
 algerian_events.200.d: "As forças de segurança conseguiram reprimir a mais recente onda de manifestações, embora a raiva do público continue fervendo por baixo da superfície."
 algerian_events.200.a: "A ordem foi restaurada, por ora."
 algerian_events.2015.t: "A Repressão Sai pela Culatra"
 algerian_events.2015.d: "As tentativas de reprimir os protestos só alimentaram mais raiva, encorajando os manifestantes e enfraquecendo a autoridade do governo."
 algerian_events.2015.a: "A situação piora."
 algerian_events.2025.t: "Fim dos Protestos"
 algerian_events.2025.d: "Depois de meses de luta, a mais recente onda de protestos se esgotou. As tensões permanecem, mas, por enquanto, as ruas estão silenciosas de novo."
 algerian_events.2025.a: "Finalmente, a calma retorna."
 algerian_events.301.t: "Protestos Eclodem em Todo o País!"
 algerian_events.301.d: "Parece que nossas ações recentes não foram bem recebidas pelo povo, e protestos eclodiram em todo o país. Aos poucos, cada vez mais pessoas exigem a renúncia do governo, embora não pretendamos ir a lugar algum."
 algerian_events.301.a: "Devíamos ter previsto isso!"
