 recognition.16.t: "¿Reconoces [FROM.GetName]?"
 recognition.16.d: "[FROM.GetNameDef] solicita formalmente nuestro reconocimiento diplomático. Cualquier respuesta que demos se interpretará como una declaración de nuestra postura sobre su soberanía."
 recognition.16.a: "No estamos preparados para reconocerlos."
 recognition.16.b: "Reconocemos a [FROM.GetName] como un Estado soberano."
 recognition.18.t: "¿Reconocer a [FROM.GetName]?"
 recognition.18.d: "El estatus de [FROM.GetNameDef] está en entredicho en el escenario mundial. Cada capital está tomando una postura. ¿Cuál es la nuestra?"
 recognition.18.a: "Declinamos reconocerlos."
 recognition.18.b: "Reconocemos la soberanía de [FROM.GetName]."
 recognition.31.t: "[FROM.GetName] busca nuestro reconocimiento"
 recognition.31.d: "[FROM.GetNameDef] ha declarado la independencia de nuestro territorio y nos pide que aceptemos la nueva realidad. Nuestra respuesta definirá nuestra relación con ellos y señalará nuestra postura a los demás."
 recognition.31.a: "Nunca reconoceremos a este régimen."
 recognition.31.b: "Reconocemos la independencia de [FROM.GetName]."
 UNSC.10.t: "Resolución del Consejo de Seguridad adoptada"
 UNSC.10.d: "El Consejo de Seguridad de las Naciones Unidas ha votado a favor de adoptar una resolución relativa a [?global.current_sc_vote_nation.GetNameWithFlag]. [?global.current_sc_vote_nation.UNSCGetResolutionTypePassDesc]"
 UNSC.10.a: "Anotado"
 UNSC.11.t: "Resolución del Consejo de Seguridad relativa a [This.GetNameWithFlag]"
 UNSC.11.d: "El Consejo de Seguridad de las Naciones Unidas ha votado a favor de adoptar una resolución relativa a [This.GetNameWithFlag]. [UNSCGetResolutionTypePassDesc]"
 UNSC.11.a: "Reconocemos la aprobación de esta resolución."
 UNSC_pass_type_1_desc: "Se ha adoptado una resolución de presión que exige el cese de todas las operaciones militares ofensivas en un plazo de §Y210 días§!. El incumplimiento conllevará nuevas sanciones."
 UNSC_pass_type_2_desc: "Se ha adoptado una resolución de sanciones económicas que impone penalizaciones comerciales y de investigación hasta que termine la amenaza ofensiva a la paz mundial."
 UNSC_pass_type_3_desc: "Se ha adoptado una resolución que restringe el acceso de voluntarios extranjeros. Cualquier nación que envíe voluntarios militares en violación de esta resolución enfrentará sanciones adicionales."
 UNSC_pass_type_4_desc: "Se ha adoptado una resolución de embargo de armas, cortando el acceso al mercado internacional de armas hasta que hayan terminado todos los conflictos ofensivos."
 COVID_events.0.t: "Un nuevo virus"
 COVID_events.0.d: "Un nuevo virus ha surgido en Wuhan. Múltiples médicos informan de una enfermedad respiratoria que se propaga rápidamente entre la población local. Los casos han pasado de un solo dígito a decenas en menos de una semana."
 COVID_events.0.a: "Mantener una estrecha vigilancia sobre esto."
 COVID_events.1.t: "Médicos denunciantes"
 COVID_events.1.d: "Varios médicos han comenzado a compartir informes sobre el nuevo virus en las redes sociales, comparándolo con el SARS. Las autoridades locales solicitan directrices. Podemos silenciar los informes para evitar el pánico, o permitir que circulen a riesgo de generar alarma pública."
 COVID_events.1.a: "Silenciarlos."
 COVID_events.1.b: "Dejar que la verdad salga a la luz."
 COVID_events.2.t: "Pandemia confirmada"
 COVID_events.2.d: "La Organización Mundial de la Salud ha confirmado el nuevo coronavirus como una emergencia sanitaria mundial. Los hospitales están colapsados y el virus se está propagando más allá de nuestras fronteras. Esto reconfigurará nuestra economía durante los próximos años."
 COVID_events.2.a: "Prepararse para el impacto."
 COVID_events.3.t: "Emerge la COVID-19"
 COVID_events.3.d1: "Un nuevo y letal coronavirus se ha propagado desde China, donde las autoridades silenciaron inicialmente los informes sobre el brote. El retraso en la respuesta ha permitido que el virus se propague sin control a través de las fronteras internacionales."
 COVID_events.3.d2: "Un nuevo y letal coronavirus originado en China ha sido declarado pandemia mundial. A pesar de las advertencias tempranas de los médicos chinos, el virus se ha propagado rápidamente a través de las fronteras internacionales."
 COVID_events.3.a: "Preparar nuestra respuesta."
 COVID_events.4.t: "La pandemia llega a [This.GetName]"
 COVID_events.4.d: "Se han confirmado casos de COVID-19 dentro de nuestras fronteras. Los hospitales se preparan para una afluencia masiva de pacientes y el temor público va en aumento. La actividad económica se está paralizando a medida que los ciudadanos se aíslan por iniciativa propia."
 COVID_events.4.a: "Confinarlo todo."
 COVID_events.5.t: "Colapso de las cadenas de suministro globales"
 COVID_events.5.d: "La pandemia ha devastado el comercio internacional. El cierre de fábricas, la paralización de puertos y los cuellos de botella en el transporte han generado una grave escasez de componentes y materias primas en todo el mundo."
 COVID_events.5.a: "Almacenar lo que sea que quede."
 pandemic_events.1.t: "Pandemia de gripe porcina"
 pandemic_events.1.d: "Se ha identificado una nueva cepa de influenza H1N1 en México, que se propaga rápidamente entre la población. La Organización Mundial de la Salud sigue de cerca la situación a medida que los casos se multiplican y el virus amenaza con cruzar las fronteras internacionales."
 pandemic_events.1.a: "Dar la señal de alarma."
 pandemic_events.2.t: "El H1N1 llega a [This.GetName]"
 pandemic_events.2.d: "Se han confirmado casos de gripe porcina H1N1 dentro de nuestras fronteras. Aunque es menos letal de lo que se temía inicialmente, el virus se está propagando con rapidez y tensionando los recursos sanitarios."
 pandemic_events.2.a: "Distribuir mascarillas y esperar lo mejor."
 pandemic_events.3.t: "Brote de MERS"
 pandemic_events.3.d: "Se ha identificado en nuestro país un nuevo coronavirus causante del Síndrome Respiratorio de Oriente Medio. El virus parece propagarse de los camellos a los humanos, con una tasa de letalidad alarmantemente alta entre los infectados. Los hospitales están preparando salas de aislamiento."
 pandemic_events.3.a: "Contener el brote."
 pandemic_events.4.t: "Brote de ébola en África Occidental"
 pandemic_events.4.d: "Se ha confirmado un brote del virus del Ébola en zonas rurales de Guinea. La fiebre hemorrágica se está propagando por las comunidades con una velocidad aterradora, colapsando las clínicas locales. Sin una intervención inmediata, la epidemia podría devorar a toda la región."
 pandemic_events.4.a: "Que Dios nos ayude a todos."
 pandemic_events.5.t: "El ébola se extiende a [This.GetName]"
 pandemic_events.5.d: "Se han confirmado casos de ébola dentro de nuestras fronteras a medida que la epidemia de África Occidental supera los esfuerzos de contención. El personal sanitario corre un riesgo extremo y las organizaciones de ayuda internacional se apresuran a responder."
 pandemic_events.5.a: "Necesitamos ayuda. Ahora."
 pandemic_events.6.t: "El ébola regresa en el Congo"
 pandemic_events.6.d: "Un nuevo brote de ébola ha estallado en las provincias orientales de la República Democrática del Congo. El conflicto armado en la región está complicando los esfuerzos de contención, ya que el personal sanitario se enfrenta a ataques de grupos de milicias que recelan de los extranjeros."
 pandemic_events.6.a: "Desplegar equipos sanitarios bajo escolta armada."
 pandemic_events.7.t: "Casos de MERS en [This.GetName]"
 pandemic_events.7.d: "Se han detectado casos del Síndrome Respiratorio de Oriente Medio en nuestro país, probablemente transportados por viajeros procedentes de Arabia Saudí. Las autoridades sanitarias están estableciendo protocolos de control en aeropuertos y hospitales."
 pandemic_events.7.a: "Examinar a cada viajero."
 pandemic_events.8.t: "Casos de ébola en [This.GetName]"
 pandemic_events.8.d: "Varios casos de ébola han cruzado la frontera desde la República Democrática del Congo. El movimiento transfronterizo en la región dificulta enormemente la contención, y el personal sanitario compite contra el reloj para rastrear los contactos."
 pandemic_events.8.a: "Cerrar las fronteras de inmediato."
 pandemic_events.9.t: "Brote de MERS en Corea del Sur"
 pandemic_events.9.d: "Un único paciente que regresaba de Oriente Medio ha desencadenado un devastador evento de superpropagación hospitalaria. El virus está arrasando las instalaciones sanitarias a medida que los pacientes y el personal lo contagian entre las distintas salas. Se han confirmado más de cien casos y registrado decenas de muertes, dejando al descubierto fallos críticos en nuestros protocolos de control de infecciones."
 pandemic_events.9.a: "Clausurar cada hospital afectado."
 influence.60.t: "Un golpe de Estado en [event_target:coup_contest_victim.GetName]"
 influence.60.d: "Nuestros servicios de inteligencia confirman lo que muchos sospechaban: [event_target:coup_contest_sender.GetNameWithFlag] ha orquestado un §Rgolpe de Estado§! exitoso en [event_target:coup_contest_victim.GetNameWithFlag], instaurando un nuevo régimen favorable a sus intereses. Nosotros poseemos una §Hinfluencia§! significativa en [event_target:coup_contest_victim.GetName], la suficiente como para no quedarnos de brazos cruzados si decidimos actuar. Nuestras opciones van desde la denuncia diplomática hasta el apoyo clandestino al antiguo orden. Cada una conlleva costes. No hacer nada podría costarnos aún más."
 influence.60.a: "Denunciar públicamente y sancionar a [event_target:coup_contest_sender.GetName]"
 influence.60.f: "Imponer §Hsanciones económicas§! selectivas a [event_target:coup_contest_sender.GetName]"
 influence.60.b: "Respaldar clandestinamente a la antigua oposición y potenciar nuestra propia influencia"
 influence.60.e: "§RIntervención militar§!: armar a la resistencia y tomar una postura firme contra [event_target:coup_contest_sender.GetName]"
 influence.60.c: "Aceptar la nueva realidad y seguir adelante"
 influence.61.t: "Guerra civil en [event_target:coup_contest_victim.GetName]"
 influence.61.d: "El intento de golpe de Estado de [event_target:coup_contest_sender.GetNameWithFlag] les ha estallado en la cara: [event_target:coup_contest_victim.GetNameWithFlag] se encuentra en una §Rguerra civil§! y el antiguo régimen sigue luchando. Nuestra §Hinfluencia§! nos otorga un interés real en saber qué bando prevalecerá. Si armamos al antiguo gobierno, podríamos evitar que [event_target:coup_contest_sender.GetName] consolide sus logros. Si enviamos solo dinero, cubriremos nuestras apuestas. Si nos comprometemos plenamente, manejaremos los hilos. Si nos mantenemos al margen, dejaremos que otros decidan el resultado."
 influence.61.a: "Armar al antiguo régimen: armas, equipamiento y respaldo político"
 influence.61.b: "Enviar discretamente ayuda económica para mantener a flote al antiguo régimen"
 influence.61.e: "§RIntervención militar total§!: comprometerse con la victoria del antiguo régimen"
 influence.61.c: "Mantenerse al margen de la guerra civil"
 News_influence.7.t: "[FROM.GetNameWithFlag] condena a [event_target:coup_contest_sender.GetNameWithFlag]"
 News_influence.7.d: "[FROM.GetNameWithFlag] ha emitido hoy una mordaz condena sobre el supuesto papel de [event_target:coup_contest_sender.GetNameWithFlag] en el reciente golpe de Estado en [event_target:coup_contest_victim.GetNameWithFlag]. Las protestas diplomáticas, las §Hsanciones§! selectivas y el endurecimiento de las relaciones están sobre la mesa. El ministerio de asuntos exteriores de [event_target:coup_contest_sender.GetName] desestimó las acusaciones calificándolas de 'teatro político sin fundamento', pero la opinión internacional se está endureciendo rápidamente."
 News_influence.7.a: "Un disparo de apertura en la guerra de influencia"
 News_influence.8.t: "[FROM.GetNameWithFlag] respalda a la antigua oposición en [event_target:coup_contest_victim.GetName]"
 News_influence.8.d: "Fuentes de inteligencia confirman lo que los observadores sospechaban desde hace semanas: [FROM.GetNameWithFlag] está canalizando discretamente §Hfinanciación§! y §Hapoyo político§! a la oposición previa al golpe dentro de [event_target:coup_contest_victim.GetNameWithFlag]. Las facciones democráticas del país están de repente mejor organizadas, mejor financiadas y son notablemente más ruidosas. El §Rrégimen golpista§! en [event_target:coup_contest_victim.GetName] ha calificado esta actividad como 'una intervención extranjera inaceptable'. La misma actividad en la que ellos participaron para hacerse con el poder."
 News_influence.8.a: "La disputa por [event_target:coup_contest_victim.GetName] no ha terminado"
 News_influence.9.t: "[FROM.GetNameWithFlag] arma al antiguo régimen de [event_target:coup_contest_victim.GetName]"
 News_influence.9.d: "Con [event_target:coup_contest_victim.GetNameWithFlag] sumida en una §Rguerra civil§! tras el fallido golpe de Estado de [event_target:coup_contest_sender.GetNameWithFlag], [FROM.GetNameWithFlag] ha abandonado todo pretexto de neutralidad. Los vuelos de carga procedentes de [FROM.GetName] están aterrizando en territorio controlado por el gobierno cargados con §Harmas ligeras§!, §Hvehículos§! y, según múltiples fuentes, 'asesores' uniformados. La guerra subsidiaria está ahora a la vista de todos."
 News_influence.9.a: "Una larga lucha por delante"
 News_influence.10.t: "[FROM.GetNameWithFlag] abre una intervención militar por [event_target:coup_contest_victim.GetName]"
 News_influence.10.d: "En la respuesta más drástica hasta la fecha ante el golpe de Estado de [event_target:coup_contest_sender.GetNameWithFlag] en [event_target:coup_contest_victim.GetNameWithFlag], [FROM.GetNameWithFlag] ha anunciado una §Rintervención militar§! formal. El lenguaje es moderado, pero la sustancia no lo es: unidades desplegadas en posiciones avanzadas, órdenes permanentes de asistir al gobierno previo al golpe y un abierto desprecio por el hecho consumado de [event_target:coup_contest_sender.GetName]. Los mercados globales están en el caos. El Consejo de Seguridad de la ONU ha sido convocado a una sesión de emergencia."
 News_influence.10.a: "Se ha cruzado la línea"
 influence.52.e: "Paquete de §HEquipamiento moderno§! (antitanque pesado, SAM, drones)"
 influence.52.a_preview_tt: "Enviar armas ligeras, armas antitanque ligeras y equipamiento antiaéreo"
 influence.52.b_preview_tt: "Enviar tanques principales de batalla, tanques anfibios o especializados y vehículos utilitarios"
 influence.52.e_preview_tt: "Enviar misiles antitanque pesados, misiles superficie-aire y drones militares"
 influence.57.t: "¿Qué tamaño tendrá el paquete?"
 influence.57.d: "Hemos decidido qué enviar. Ahora debemos decidir §Hcuánto§!. Los paquetes más grandes cuestan más §Hcapital político§!, generan más §Rtensión mundial§! y desencadenan la cobertura de los informativos internacionales."
 influence.57.a: "Enviar un paquete §Hpequeño§!"
 influence.57.b: "Enviar un paquete §Hmediano§!"
 influence.57.c: "Enviar un paquete §Hgrande§!"
 influence.57.e: "Pensándolo bien, cancelar"
 News_influence.11.t: "[FROM.FROM.GetName] envía un paquete de armas de gran envergadura a [FROM.GetName]"
 News_influence.11.d: "[FROM.FROM.GetName] ha anunciado un §Hgrande paquete de ayuda militar§! para [FROM.GetName]: miles de armas ligeras, vehículos y equipamiento de apoyo. Los analistas señalan que la transferencia manifiesta un endurecimiento del compromiso de [FROM.FROM.GetName] con la defensa de [FROM.GetName]. Sus rivales están furiosos; sus aliados vigilan de cerca para ver quién será el próximo."
 News_influence.11.a: "Las armas siguen fluyendo"
 News_influence.12.t: "[FROM.FROM.GetName] transfiere armamento avanzado a [FROM.GetName]"
 News_influence.12.d: "En una transferencia que cruza todas las líneas rojas del mercado global de armas, [FROM.FROM.GetName] ha enviado §Hmisiles antitanque pesados§!, §Hsistemas superficie-aire§! y §Hdrones de combate§! a [FROM.GetName]. Cada una de estas armas es del tipo que transforma las escaramuzas regionales en guerras totales. Los rivales de [FROM.GetName] lo califican de amenaza directa. Las líneas telefónicas diplomáticas se están encendiendo en todas las capitales."
 News_influence.12.a: "La guerra moderna acaba de recibir armas modernas"
 influence.2.t: "¿Ofrecer ayuda económica a [FROM.GetName]?"
 influence.2.d: "Hemos elegido comenzar a redactar un paquete de ayuda económica para [FROM.GetName]. Podemos transferir una suma fija directamente desde nuestra tesorería. Esta generosidad mejorará las relaciones y nos otorgará influencia en [FROM.GetName]. Cuanto más aportemos, más influencia ganaremos.\n\n"
 influence.2.a: "Enviar §G25.000 millones§! en ayuda económica."
 influence.2.b: "Enviar §G50.000 millones§! en ayuda económica."
 influence.2.c: "Enviar §G75.000 millones§! en ayuda económica."
 influence.2.e: "Enviar §G100.000 millones§! en ayuda económica."
 generic.5.f: "Estamos mejor sin ellos."
 ecuadornews.1.t: "Golpe de Estado militar en Ecuador"
 ecuadornews.1.d: "El ejército ecuatoriano ha intervenido en medio de una profunda crisis política y económica, destituyendo al presidente Jamil Mahuad del poder. Altos oficiales, liderados por el general Carlos Mendoza, han tomado el control de la situación, dejando de lado tanto al gobierno civil como al liderazgo de las protestas de la CONAIE. Las fuerzas armadas describen la medida como una disposición temporal para restaurar la estabilidad, aunque no está claro con qué rapidez regresará el mandato civil ni qué forma adoptará."
 ecuadornews.1.a: "Interesante."
 ecuadornews.2.t: "Golpe de Estado militar en Ecuador"
 ecuadornews.2.d: "La crisis económica y las controvertidas reformas del gobierno han llevado a Ecuador a un punto de ruptura. Tras las manifestaciones masivas lideradas por la Confederación de Nacionalidades Indígenas del Ecuador (CONAIE) y la deserción de varios oficiales militares subalternos, los líderes de la oposición han anunciado la formación de una Junta de Salvación Nacional. La proclamada Junta de Salvación Nacional se presenta como un liderazgo tripartito destinado a simbolizar la unidad nacional. Está integrada por el líder indígena Antonio Vargas, el juez civil Carlos Solórzano y el representante militar, el general Lucio Gutiérrez."
 ecuadornews.2.a: "Interesante."
 ecuadornews.3.t: "Colapsa la Junta de Salvación Nacional ecuatoriana"
 ecuadornews.3.d: "El intento de formar una junta cívico-militar en Quito ha fracasado. A pesar de las protestas masivas y de la ocupación del Congreso por parte de la CONAIE y grupos aliados, el alto mando militar se ha negado a respaldar al nuevo gobierno. El general Carlos Mendoza ha tomado el control de la situación, marginando al liderazgo de las protestas y poniendo fin al proyecto de la junta. Sin respaldo militar, la coalición se ha desintegrado rápidamente y muchos de los conspiradores han sido arrestados."
 ecuadornews.3.a: "Interesante."
 ecuador.1.t: "Adoptar el dólar"
 ecuador.1.d: "La inestabilidad económica continúa atenazando al país tras la crisis financiera de 1998-1999. El presidente Jamil Mahuad propone dolarizar la economía para frenar la inflación y restaurar la confianza en el sistema financiero. Al mismo tiempo, el gobierno recorta más del 60 % del presupuesto de las fuerzas armadas, dañando gravemente las relaciones con el estamento militar."
 ecuador.1.a: "Impulsar la dolarización"
 ecuador.1.b: "Dar marcha atrás en algunas reformas radicales"
 ecuador.2.t: "Levantamiento en Quito"
 ecuador.2.d: "En respuesta a los planes económicos del gobierno, multitudes indígenas acuden en masa a Quito para exigir la destitución del presidente Jamil Mahuad. Los manifestantes ocupan el Congreso y la Corte Suprema, paralizando el Estado y dejando al descubierto la incapacidad del gobierno para mantener el orden. A medida que aumenta la presión en la capital, la lealtad de las fuerzas de seguridad y la supervivencia de la administración se ponen cada vez más en entredicho."
 ecuador.2.a: "Mantener el orden"
 ecuador.3.t: "Gobierno de Salvación Nacional"
 ecuador.3.d: "En un acto puramente simbólico, los líderes de las protestas anuncian en la televisión nacional la creación de una denominada Junta de Salvación Nacional, afirmando representar la voluntad del pueblo. La declaración recibe un amplio apoyo público y menoscaba aún más la autoridad del gobierno civil. Se presenta a la Junta como liderada por el general Carlos Mendoza."
 ecuador.3.a: "El general Lucio Gutiérrez asume el liderazgo"
 ecuador.3.b: "Seguir adelante"
 ecuador.4.t: "La Junta de tres personas"
 ecuador.4.d: "La proclamada Junta de Salvación Nacional se presenta ahora como un liderazgo tripartito destinado a simbolizar la unidad nacional. Está integrada por el líder indígena Antonio Vargas, el juez civil Carlos Solórzano y el representante militar, el general Lucio Gutiérrez."
 ecuador.4.a: "Algo diferente"
 ecuador.5.t: "Los altos mandos militares no respaldan al gobierno"
 ecuador.5.d: "Aunque la opinión pública apoya en gran medida la ocupación del Congreso por parte de la CONAIE y la petición de dimisión del presidente Mahuad, hay poco apetito por un mandato militar directo. Consciente de ello, el general Carlos Mendoza margina a la coalición y toma el control de las negociaciones. El alto mando, estrechamente vinculado a las élites políticas y económicas de Ecuador —incluidas figuras como León Febres Cordero, que rechaza de plano los planes de la junta y se ve además influenciado por la amenaza de sanciones económicas de los EE. UU.— fuerza una ruptura decisiva con el liderazgo de las protestas."
 ecuador.5.a: "El general Mendoza cede el poder a Gustavo Noboa"
 ecuador.5.b: "No dar marcha atrás"
 recognition.45.t: "Suficiente reconocimiento para solicitar el ingreso en la ONU"
 recognition.45.d: "Suficientes Estados miembros de la ONU reconocen ahora nuestra soberanía como para solicitar de forma creíble un asiento en las Naciones Unidas. Podemos pedir una recomendación al Consejo de Seguridad."
 recognition.45.a: "Comenzar la solicitud."
 anti_bully.2.t: "Hastío público de la guerra"
 anti_bully.2.d: "Hemos decidido que la guerra es nuestro mejor curso de acción. Sin embargo, para mantener el apoyo de la población, debemos ganar esto rápidamente o adentrarnos con celeridad en suelo extranjero. El pueblo marchará mientras vea cuán necesaria es esta guerra. ¡Las botas marchan, los tambores suenan y el momento de que [FROM.GetName] vaya a la guerra ha llegado!\n\n§YEsto activa el sistema de hastío público de la guerra§!\n"
 anti_bully.2.a: "¡Debemos ganar!"
 UNSC.12.t: "Fracasa la resolución del Consejo de Seguridad relativa a [This.GetNameWithFlag]"
 UNSC.12.d: "El Consejo de Seguridad de las Naciones Unidas ha votado en contra de la resolución propuesta relativa a [This.GetNameWithFlag]. Recibió [?global.security_council_vote_yes^num] de los [?global.un_sc_required_yes] votos §GAfirmativos§! requeridos, y no se ejerció ningún veto. Una mayoría simple no es suficiente en el §YConsejo de Seguridad§!. No se adoptarán medidas en este momento."
 UNSC.12.a: "Tomamos nota del resultado."
 UNSC.6.t: "Desarme de [?global.current_sc_vote_nation.GetName]"
 UNSC.6.d: "Una resolución que declara a [?global.current_sc_vote_nation.GetName] en flagrante violación de sus obligaciones de desarme se encuentra ante el Consejo de Seguridad. Le ofrece una última oportunidad para cumplir y advierte de graves consecuencias si no lo hace.\n\nNo autoriza el uso de la fuerza, y los patrocinadores lo saben. Esa omisión es el precio de los votos que necesitan. Lo que la resolución les otorga no es permiso, sino legitimidad, y si fracasa no tendrán ninguna de las dos cosas.\n\n$unsc_vote_pass_tt$"
 UNSC.7.t: "Exigencia de entrega de un terrorista buscado por parte de [?global.current_sc_vote_nation.GetName]"
 UNSC.7.d: "Una resolución que exige que [?global.current_sc_vote_nation.GetName] entregue a un terrorista buscado que se refugia en su territorio se encuentra ante el Consejo de Seguridad. Las pruebas han sido expuestas ante esta cámara, y la respuesta del régimen hasta ahora ha sido el silencio.\n\nSi la resolución se aprueba, [?global.current_sc_vote_nation.GetName] se enfrentará a sanciones de las Naciones Unidas hasta que se cumpla la exigencia.\n\n$unsc_vote_pass_tt$"
 UNSC_pass_type_6_desc: "Se ha adoptado una resolución de desarme, declarando a la nación en violación flagrante y advirtiendo de graves consecuencias. No llega a autorizar el uso de la fuerza."
 UNSC_pass_type_7_desc: "Se ha adoptado una resolución que exige la entrega de un terrorista buscado. Las sanciones de las Naciones Unidas seguirán vigentes hasta que se cumpla la exigencia."
 influence.62.t: "Los grupos de presión extranjeros capturan nuestro gobierno"
 influence.62.d: "Los presidentes de los comités que pasaron la última sesión exigiendo restricciones al capital extranjero se han quedado callados. El personal del ministerio devuelve las llamadas de la embajada de [?var:ROOT.influence_lobbied_by.GetNameWithFlag] antes de devolver las nuestras, y los miembros que ordinariamente liderarían una ofensiva contra la influencia extranjera reciben ahora asignaciones que no podemos rastrear. Nunca se demostrará nada ilegal, pero durante los próximos meses nuestro gobierno no tendrá ganas de pelear ni votos que perder en ello."
 influence.62.a: "Nuestras manos están atadas"
 hongkong_news.10.t: "Hong Kong es anexionado por China"
 hongkong_news.10.d: "China ha absorbido formalmente la Región Administrativa Especial de Hong Kong, poniendo fin a su estatus separado. Las instituciones y la administración del territorio pasan ahora bajo el control central directo de Pekín, ya que [CHI.GetLeader] ha descrito la medida como la culminación del regreso de Hong Kong a la patria."
 hongkong_news.10.a: "La Perla ha regresado al redil."
 hongkong_news.10.b: "Un acontecimiento significativo."
 generic.6.a: "Juntos defenderemos la democracia."
 generic.6.b: "¡Nadie puede hacernos frente!"
 generic.6.c: "¡La difícil situación de los trabajadores no podría pedir mejores campeones!"
 generic.6.e: "Dejaremos a un lado nuestras diferencias, por ahora."
 generic.7.b: "¡Entonces los aplastaremos a ellos también!"
 generic.7.c: "¡Su revolución está corrompida!"
 generic.7.e: "Nuestras diferencias eran demasiado grandes."
 GLOBAL_angolan_civil_war_over: "La guerra civil angoleña ha terminado"
 AFG_news.1.t: "Se calma la guerra civil en Afganistán"
 AFG_news.1.TAL.d: "A pesar de los esfuerzos de las Fuerzas Armadas afganas y sus aliados occidentales, los talibanes han logrado hacerse con el control total de las principales ciudades, incluida la capital, Kabul. La mayoría de los funcionarios del gobierno se han escondido o han marchado al exilio, incluido el presidente afgano [AFG.GetLeader], que reside actualmente en los Estados Unidos.\n\nEl triunfo de los talibanes aumentará con seguridad la frecuencia de los atentados terroristas en la región y en todo el mundo."
 AFG_news.1.AFG.d: "El gobierno afgano ha declarado la victoria contra los talibanes. La mayoría de las posiciones y ciudades más fuertes han sido limpiadas de su presencia, y la mayor parte de los combatientes que quedan han escapado al otro lado de la frontera, hacia Pakistán. Aunque los talibanes se han visto reducidos a unos pocos focos y células, se prevé que la insurgencia dure muchos años más, aunque a menor escala.\n\nEsta victoria ha demostrado la eficacia del reconstruido ejército afgano y la determinación del gobierno afgano."
 AFG_news.1.a: "Interesante"
 AFG_news.2.t: "Afganistán reclama Pastunistán"
 AFG_news.2.d: "Debido a una oleada de violencia en Pakistán, el gobierno afgano ha reforzado sus reclamaciones sobre las zonas de Pakistán donde viven los pastunes. La Línea Durand (la frontera contemporánea entre Afganistán y Pakistán) ha sido durante mucho tiempo una fuente de conflicto entre ambos países, ya que transfirió tierras del Emirato de Afganistán a Pakistán bajo el control británico.\n\nLos propios pastunes que viven en la zona no parecen demasiado entusiasmados con este acontecimiento, ya que muchos se sienten cómodos viviendo dentro de Pakistán. Es probable que Afganistán no pueda hacer valer sus reclamaciones a menos que sea por la fuerza."
 AFG_news.2.a: "Interesante"
 AFG_news.3.t: "Afganistán reclama Beluchistán"
 AFG_news.3.d: "A medida que se profundiza la crisis en Pakistán, Afganistán amplía sus reclamaciones. El gobierno afgano ha anunciado hoy que Beluchistán, además de Pastunistán, es una parte integrante de Afganistán."
 AFG_news.3.a: "Un acontecimiento preocupante"
 AFG_news.4.t: "Afganistán invade Pakistán"
 AFG_news.4.d: "En un movimiento para asegurar su reclamación, Afganistán ha optado por una vía más directa para ganar tierras. Actuando en nombre de la seguridad pastún, han comenzado a trasladar tropas al otro lado de la frontera, hacia Pakistán."
 AFG_news.4.a: "Un acontecimiento preocupante"
 AFG_news.5.t: "Los talibanes unen sus fuerzas"
 AFG_news.5.d: "Los talibanes afganos y pakistaníes han decidido unir sus fuerzas para combatir juntos las amenazas comunes. Esto supone un gran cambio en el equilibrio de poder en Asia Central."
 AFG_news.5.a: "Preocupante."
 AFG_news.6.t: "Asesinato de Ahmad Shah Massoud"
 AFG_news.6.d: "Ahmad Shah Massoud, el principal líder de la resistencia afgana contra los talibanes, ha sido asesinado por Al-Qaeda. Dos miembros de Al-Qaeda, haciéndose pasar por periodistas, hicieron detonar explosivos ocultos en sus equipos. Massoud resultó gravemente herido y fue evacuado en un helicóptero militar, pero murió a causa de sus heridas antes de llegar al hospital.\n\nConocido como el León de Panjshir, Massoud fue un símbolo de la resistencia primero contra la ocupación soviética y luego contra los talibanes."
 AFG_news.6.a: "Una gran pérdida."
 AFG_events.3.t: "Asesinato de Ahmad Shah Massoud"
 AFG_events.3.d: "Ahmad Shah Massoud, el León de Panjshir, ha sido hoy el objetivo de un terrorista suicida. Dos miembros de Al-Qaeda, haciéndose pasar por periodistas, hicieron detonar explosivos ocultos en una cámara y en un paquete de baterías. Massoud resultó gravemente herido y fue evacuado inmediatamente del lugar en un helicóptero militar."
 AFG_events.3.a: "Recemos a Alá para que sobreviva."
 AFG_events.4.t: "Los EE. UU. ejercen su influencia"
 AFG_events.4.d: "Como los talibanes han sido derrotados, los EE. UU. han utilizado su influencia para afectar las decisiones de la Loya Jirga. Se ha formado una nueva administración provisional."
 AFG_events.4.a: "¿Son mejores que los talibanes?"
 AFG_hostage_crisis.1.t: "Misioneros surcoreanos tomados como rehenes por los talibanes"
 AFG_hostage_crisis.1.d: "Hoy, un grupo de misioneros surcoreanos que viajaba por la provincia de Ghazni fue capturado por militantes talibanes y se encuentra retenido como rehén. Exigen la liberación de prisioneros y la retirada de todos los soldados surcoreanos en Afganistán.\n\nNuestro asesor militar sugirió enviar un grupo de extracción para rescatar a los rehenes y la delegación surcoreana envió a un representante para negociar."
 AFG_hostage_crisis.1.a: "No podemos confiar en los talibanes, envíen al equipo de extracción."
 AFG_hostage_crisis.1.b: "La seguridad de los rehenes es nuestra prioridad, envíen al representante."
 AFG_hostage_crisis.2.t: "Rehenes rescatados"
 AFG_hostage_crisis.2.d: "Nuestras fuerzas especiales lograron infiltrarse en el escondite talibán y escoltaron a los rehenes hasta el puesto militar más cercano.\n\nLos misioneros regresarán a Corea del Sur y nuestros soldados están siendo elogiados por los medios de comunicación."
 AFG_hostage_crisis.2.a: "Misión cumplida."
 AFG_hostage_crisis.3.t: "Rehenes muertos durante el intento de rescate"
 AFG_hostage_crisis.3.d: "Los militantes talibanes se percataron de que nuestras fuerzas especiales entraban en su escondite y ejecutaron a los rehenes de inmediato.\n\nTras el combate, nuestros soldados lograron escapar del edificio, sin los rehenes."
 AFG_hostage_crisis.3.a: "Misión fallida."
 AFG_hostage_crisis.4.t: "Los talibanes exigen la liberación de prisioneros"
 AFG_hostage_crisis.4.d: "El representante ha regresado con las exigencias de los talibanes; la liberación de todos los reclusos talibanes de las prisiones norteamericanas es la demanda principal."
 AFG_hostage_crisis.4.a: "Solicitar la liberación de los prisioneros."
 AFG_hostage_crisis.4.b: "¡No liberaremos a criminales de guerra!"
 AFG_hostage_crisis.5.t: "Los talibanes exigen la retirada surcoreana"
 AFG_hostage_crisis.5.d: "Los talibanes han exigido la retirada de todas nuestras fuerzas y el pago de un rescate para la liberación de nuestros ciudadanos."
 AFG_hostage_crisis.5.a: "Debemos aceptar."
 AFG_hostage_crisis.5.b: "¡No negociaremos con terroristas!"
 AFG_hostage_crisis.6.t: "Los EE. UU. deniegan nuestra solicitud"
 AFG_hostage_crisis.6.d: "Representantes del ejército de los EE. UU. han rechazado nuestra solicitud de liberar a los reclusos talibanes de las prisiones militares.\n\nLos yihadistas reaccionaron matando a dos rehenes antes de proponer nuevas exigencias; el gobierno norcoreano también ha pedido la liberación de los rehenes."
 AFG_hostage_crisis.6.a: "¿Cómo reaccionarán los talibanes a esto?"
 AFG_hostage_crisis.7.t: "El gobierno afgano rechaza la exigencia talibán"
 AFG_hostage_crisis.7.d: "Los representantes del gobierno afgano han desestimado las exigencias talibanes por considerarlas irrealizables; los yihadistas reaccionaron matando a dos rehenes antes de proponer nuevas exigencias; el gobierno norcoreano también ha pedido la liberación de los rehenes."
 AFG_hostage_crisis.7.a: "¡Bárbaros!"
 AFG_hostage_crisis.8.t: "Corea del Sur se retira de Afganistán"
 AFG_hostage_crisis.8.d: "Tras una crisis de rehenes en Afganistán, el gobierno surcoreano ha aceptado las exigencias de los talibanes y ha comenzado a replegar sus fuerzas.\n\nLos talibanes anunciaron que se pagó un rescate de veinte millones de dólares, aunque el gobierno surcoreano no hizo ninguna declaración al respecto."
 AFG_hostage_crisis.8.a: "Afganistán continúa desestabilizándose."
 AFG_hostage_crisis.9.t: "Rehenes surcoreanos ejecutados"
 AFG_hostage_crisis.9.d: "Tras una crisis de rehenes en Afganistán, el gobierno surcoreano ha rechazado todas las exigencias de los talibanes; al día siguiente, estos anunciaron que todos los rehenes habían sido asesinados."
 AFG_hostage_crisis.9.a: "Más víctimas del conflicto afgano."
 AFG_contact_iran.0.t: "Afganistán convoca a su pueblo de vuelta"
 AFG_contact_iran.0.d: "Nuestras brigadas Fatemiyoun están creciendo en Irán y se componen de hombres afganos chiíes de la etnia Hazara; Afganistán solicita su regreso a la patria para que puedan ayudar al país en el que han vivido durante varios milenios."
 AFG_contact_iran.0.a: "Permitir que se unan a sus tierras."
 AFG_contact_iran.0.b: "No, necesitamos esa mano de obra."
 AFG_contact_iran.1.t: "Irán se niega a enviar a nuestros Fatemiyoun hazaras"
 AFG_contact_iran.1.d: "Tras solicitar a [PER.GetName] que envíe de vuelta a los Fatemiyoun para ayudar en [AFG.GetName], y bajo una intensa comunicación entre nuestras dos naciones, los iraníes han decidido denegar la solicitud para el regreso de nuestros hombres hazaras."
 AFG_contact_iran.1.a: "¡Alá sabe más!"
 AFG_contact_iran.2.t: "Irán acepta nuestro llamamiento sobre los Fatemiyoun hazaras"
 AFG_contact_iran.2.d: "[PER.GetName] ha aceptado nuestra solicitud para el regreso de nuestros soldados hazaras para ayudar y volver a sus tierras natales. Cinco divisiones están en camino con las banderas en alto coreando: «¡Zindabad Hazaristan!»."
 AFG_contact_iran.2.a: "¡Harakat!"
 AFG_contact_iran.3.t: "Afganistán solicita la adhesión al Eje de la Resistencia"
 AFG_contact_iran.3.d: "Los hazaras chiíes de Afganistán solicitan unirse al Eje de la Resistencia; tras la toma de control de Afganistán por parte de los hazaras, estos piden ahora la adhesión a nuestra alianza."
 AFG_contact_iran.3.a: "¡Que Khorasán se una!"
 AFG_contact_iran.3.b: "No aceptamos la solicitud."
 AFG_contact_iran.4.t: "Irán acepta nuestra solicitud para unirse a su facción"
 AFG_contact_iran.4.d: "[PER.GetName] ha aceptado nuestra solicitud para formar parte del Eje de la Resistencia. ¡Somos más fuertes juntos!"
 AFG_contact_iran.4.a: "¡Allahu Akbar!"
 AFG_contact_iran.5.t: "Irán rechaza"
 AFG_contact_iran.5.d: "[PER.GetName] ha rechazado nuestra solicitud para formar parte del Eje de la Resistencia. Ya no deberíamos confiar en ellos."
 AFG_contact_iran.5.a: "Triste"
 AFG_contact_iran.6.t: "Los hazaras de Afganistán declaran el Hazaristán"
 AFG_contact_iran.6.d: "Esta mañana, Karim Khalili, el político hazara de Afganistán, ha declarado su propio Estado tras sus éxitos en el país con reformas rápidas y la adhesión al islam chií. Cientos de miles de hazaras han tomado las calles de Kabul, Bamiyán, Mazar-e Sharif y Herat para celebrar la declaración del Hazaristán."
 AFG_contact_iran.6.a: "Interesante"
 world_war.12.t: "La cuestión de Taiwán"
 world_war.12.d: "Con las grandes potencias mundiales sumidas en una guerra global de desgaste, quedan pocos que puedan intervenir en nombre de Taipéi. Es posible que la oportunidad de reclamar la provincia rebelde y completar nuestra reunificación no vuelva a presentarse."
 world_war.12.a: "Reunificación, al fin"
 world_war.12.b: "No podemos arriesgarnos a una guerra"
 UNSC.8.t: "Recomendar la condición de miembro permanente para [?global.current_sc_vote_nation.GetName]"
 UNSC.8.d: "[?global.current_sc_vote_nation.GetNameWithFlag] ha solicitado la condición de miembro permanente del Consejo de Seguridad de las Naciones Unidas. El Consejo debe recomendar la solicitud sin que se ejerza ningún veto antes de que pueda pasar a la Asamblea General.\n\n$unsc_vote_pass_tt$"
 UNSC_pass_type_8_desc: "El Consejo ha recomendado la solicitud de condición de miembro permanente. Ahora pasará a la Asamblea General para su aprobación final."
 UNSC.13.t: "Un nuevo miembro permanente del Consejo de Seguridad"
 UNSC.13.d: "El Consejo de Seguridad y la Asamblea General han aprobado la admisión de [?global.unsc_last_permanent_admission.GetNameWithFlag] como miembro permanente del Consejo de Seguridad de las Naciones Unidas. El país posee ahora un asiento permanente en el Consejo y el derecho de veto."
 UNSC.13.a: "El Consejo se ha ampliado."
 UN.22.t: "Condición de miembro permanente del Consejo de Seguridad para [?global.current_ga_vote_nation.GetName]"
 UN.22.d: "El Consejo de Seguridad ha recomendado la condición de miembro permanente para [?global.current_ga_vote_nation.GetNameWithFlag]. La Asamblea General debe aprobar la solicitud por una mayoría de dos tercios antes de que el país obtenga un asiento permanente y el derecho de veto.\n\n$un_ga_vote_requires_2_3_tt$"
 econvent.16.t: "Se extienden los métodos de producción modernos"
 econvent.16.d: "Las empresas de [ROOT.GetName] están adoptando métodos de producción mejorados y reorganizando sus lugares de trabajo. Los cambios están aumentando el rendimiento en toda la economía."
 econvent.16.a: "Fomentar la transición"
 econvent.17.t: "Las inversiones en educación dan sus frutos"
 econvent.17.d: "Años de inversión en escuelas y formación profesional han ampliado la reserva de trabajadores cualificados. Los empleadores están dando un uso productivo a esa experiencia."
 econvent.17.a: "Poner a trabajar estas habilidades"
 econvent.18.t: "La tecnología extranjera se extiende a nivel nacional"
 econvent.18.d: "Los lazos comerciales han expuesto a las empresas locales a mejores maquinarias y prácticas industriales. Los productores nacionales están adaptando ahora esos métodos a sus propias operaciones."
 econvent.18.a: "Apoyar la adopción nacional"
 econvent.19.t: "Anunciada una inversión en fundición de semiconductores"
 econvent.19.d: "Un consorcio privado se ha comprometido a construir una nueva fundición de semiconductores en [ROOT.GetName]. El acceso fiable a los insumos industriales y a la energía ha hecho que el proyecto sea comercialmente viable."
 econvent.19.a: "Dar la bienvenida a la inversión"
 econvent.20.t: "Anunciada la expansión de la industria de materiales compuestos"
 econvent.20.d: "Los fabricantes están ampliando la producción nacional de materiales compuestos para abastecer a las industrias civiles y militares avanzadas. Los inversores esperan que las materias primas seguras mantengan la competitividad de la nueva planta."
 econvent.20.a: "Apoyar la expansión"
 econvent.21.t: "Los contratos de defensa expanden la producción"
 econvent.21.d: "Los nuevos contratos de defensa han dado a los fabricantes la confianza necesaria para expandir la producción. El proyecto creará puestos de trabajo cualificados al tiempo que fortalecerá la base industrial nacional."
 econvent.21.a: "Adjudicar los contratos"
 econvent.22.t: "Aumentan los pedidos de construcción naval comercial"
 econvent.22.d: "La demanda de exportación y las sólidas condiciones del negocio marítimo han llenado las carteras de pedidos nacionales. Los constructores navales están ampliando su capacidad para cumplir con los nuevos contratos."
 econvent.22.a: "Respaldar los astilleros"
 corruption.19.t: "Un año para cumplir"
 corruption.19.d: "La presión pública ha creado una estrecha oportunidad para una reforma significativa. El gobierno debe transformar ese impulso en resultados antes de que los intereses arraigados se reagrupen."
 corruption.19.a: "Lanzar la campaña contra la corrupción"
 corruption.19.b: "Rechazar el desafío"
 UNSC.12.d_veto: "El Consejo de Seguridad de las Naciones Unidas ha votado en contra de la resolución propuesta relativa a [This.GetNameWithFlag]. Un §YMiembro permanente§! votó §RNo§!, lo que §Rbeta§! la resolución sin importar cuántos votos §GAfirmativos§! haya recibido ([?global.security_council_vote_yes^num] de los [?global.un_sc_required_yes] requeridos). No se adoptarán medidas en este momento."
 recognition.19.t: "[FROM.GetName] Reports Recognition Campaign Results"
 recognition.19.d_none: "[FROM.GetNameDef] has completed an international recognition campaign, but no UN member states accepted its claim to sovereignty."
 recognition.19.d: "[FROM.GetNameDef]'s campaign won formal recognition from [?FROM.recognition_campaign_acceptances|Y0] UN member states. None of them are allied with us."
 recognition.19.d_ally: "[FROM.GetNameDef]'s campaign won formal recognition from [?FROM.recognition_campaign_acceptances|Y0] UN member states. At least one of them is allied with us."
 recognition.19.a: "We will answer this challenge."
 recognition.21.t: "Recognition Campaign Results"
 recognition.21.d_none: "Our international recognition campaign has concluded without securing recognition from any new UN member states."
 recognition.21.d: "Our campaign secured formal recognition from [?ROOT.recognition_campaign_acceptances|Y0] new UN member states."
 recognition.21.a: "Our diplomats will continue their work."