 SOV.socialism_alt_desc: "（民主社会主义）社会主义革命党\n\n社会主义革命党是俄罗斯帝国时期的一个激进左翼政党。该党主张通过国家将土地社会化来解决土地问题，从而使土地为所有人共有，推翻沙皇专制，建立民主共和国，进行广泛的民众改革，但布尔什维克上台后，许多右翼派系成员遭到镇压或移居国外。然而，这些思想并没有被遗忘。由于正义俄罗斯党的分裂，民主派系决定退出该党并重新组建社会主义革命党。"
