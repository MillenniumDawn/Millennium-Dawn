 UKR_delta: "Дельта"
 UKR_delta_desc: "Украинская система информационной поддержки принятия решений и осведомленности об обстановке на поле боя имеет доступ к программе для действующих военнослужащих, прошедших проверку. Вход осуществляется через Интернет посредством авторизации и двухфакторной аутентификации на специальном сайте.\n\n Авторизованные пользователи могут просматривать и вводить данные об известных позициях противника, обнаруженных самолетах противника, наземной технике и т. д."
 UKR_oplit: "Государственный научно-исследовательский и конструкторский центр судостроения"
 UKR_oplit_desc: "Т-84 — украинский основной боевой танк, созданный на основе советского ОБТ Т-80, представленного в 1976 году, а именно версии с дизельным двигателем: Т-80УД. Т-84 был впервые построен в 1994 году и поступил на вооружение ВСУ в 1999 году.\n\n Высокопроизводительный оппозитный двигатель делает его быстрым танком, сравнимым с другими современными ОБТ с удельной мощностью около 26 лошадиных сил на тонну."
 UKR_sapsan: "Гром-2"
 UKR_sapsan_desc: "Украинский баллистический ракетный комплекс малой дальности, разрабатываемый КБ «Южное» и ПО «Южмаш», призван сочетать в себе характеристики тактического ракетного комплекса и системы залпового огня.\n\nПервоначальная версия ракеты «Сапсан» для нужд Украины должна была иметь дальность действия 500 километров. Более поздняя версия «Гром-2», разработанная на экспорт, имеет дальность, ограниченную 280 километрами, чтобы уложиться в предел в 300 километров, установленный Режимом контроля за ракетными технологиями, который направлен на ограничение распространения ракет и ракетных технологий."
 UKR_our_ukraine_helsi: "Хелси"
 UKR_our_ukraine_helsi_desc: "Хелси - медицинская информационная система для учреждений здравоохранения и медицинский портал для пациентов Украины."
 UKR_our_ukraine_dia: "Dia"
 UKR_our_ukraine_dia_desc: "Украинский электронный сервис госуслуг, разработанный Министерством цифровой трансформации Украины. Это сайт и мобильное приложение с цифровыми документами, возможностью ЭЦП и проверки, а также портал с госуслугами."
 UKR_tsnap: "ЦНАП"
 UKR_tsnap_desc: "Это учреждения, где разные группы людей могут получить широкий спектр административных услуг в комфортных условиях. Они создаются местными советами и местными государственными администрациями и обслуживают физических и юридических лиц."
 UKR_monobank: "Монобанк"
 UKR_monobank_desc: "Монобанк — украинский прямой банк. Как и все существующие необанки в Украине, он работает с использованием банковской лицензии материнского банка — Универсал Банка, который входит в группу ТАС и принадлежит украинскому бизнесмену Сергею Тигипко."
 UKR_tsnap_idea: "ЦНАП"
 UKR_bronetank: "Харьковский бронетанковый завод"
 UKR_bronetank_desc: "Государственное предприятие бронетанковой промышленности, которое занимается производством, ремонтом, техническим обслуживанием, переоснащением и модернизацией бронетехники."
 UKR_avia_zavod: "Харьковский авиационный завод"
 UKR_avia_zavod_desc: "Предприятие авиационного машиностроения в городе Харькове. Производит пассажирские, транспортные и военные самолеты."
 UKR_priborostroy: "Харьковский приборостроительный завод"
 UKR_priborostroy_desc: "Один из крупнейших в СССР заводов по производству военной электроники и бытовой электротехники."
 UKR_tractor: "Харьковский тракторный завод"
 UKR_tractor_desc: "Предприятие по производству гусеничных и колесных тракторов."
 UKR_agregat: "Харьковское агрегатное конструкторское бюро"
 UKR_agregat_desc: "Научно-производственное предприятие военно-промышленного комплекса, разрабатывающее и изготавливающее агрегаты для гидравлических, топливных и электрических систем авиационной и ракетной техники."
 UKR_morozova: "Харьковское конструкторское бюро машиностроения"
 UKR_morozova_desc: "Предприятие, разрабатывающее бронетанковую технику. Ранее КП ККБМ играло ключевую роль в создании бронированных гусеничных машин Советского Союза."
 UKR_specmachine: "Харьковский завод специальных машин"
 UKR_specmachine_desc: "Государственное предприятие военно-промышленного комплекса."
 UKR_malichev: "Завод имени Малышева"
 UKR_malichev_desc: "Завод транспортного машиностроения в Харькове, выпускающий двигатели, локомотивы и танки."
 UKR_reborn_ser_and_molot: "Возродить завод «Серп и молот»"
 UKR_reborn_ser_and_molot_desc: "Крупное предприятие сельскохозяйственного машиностроения в Харькове, являлось одним из важнейших предприятий харьковской промышленности и одним из крупнейших предприятий сельскохозяйственного машиностроения в Российской империи и СССР."
 UKR_concers: "Харьковский оборонный концерн"
 UKR_concers_desc: "Мы объединим все наши предприятия военной промышленности в один концерн. Таким образом, мы усилим координацию производства и повысим производительность труда."
 UKR_concern: "Харьков Военно-промышленный комплекс"
 UKR_zaporozhia_gold: "Мужиевский золотой рудник"
 UKR_zaporozhia_gold_desc: "Мы наконец-то привлечем инвесторов и начнем разрабатывать эти рудники с месторождениями золота."
 UKR_opfl_small_med_business: "Преимущества для малого и среднего бизнеса"
 UKR_opfl_small_med_business_desc: "Малый и средний бизнес является важной частью нашей экономики. Для большего роста нам нужно давать бонусы, чтобы люди были заинтересованы в ведении бизнеса."
 UKR_neutrality_neutral_social_are_in_coalition_TT: "СПУ не входит в коалицию"
 UKR_idea_orthodox_christian_church: "Украинская православная церковь"
 UKR_separatist_menace: "Угроза сепаратизма"
 UKR_separatist_menace_desc: "Угроза сепаратистских республик никуда не денется, мы должны её устранить."
 UKR_polish_liberation_battalions: "Польская освободительная армия"
 UKR_polish_liberation_battalions_desc: "Многие жители Польши готовы сражаться на нашей стороне против правительства, которое, по их мнению, оккупировало страну."
 UKR_economy_shortcut: "Экономика"
 UKR_security_and_expansion_shortcut: "Безопасность и расширение"
 UKR_military_shortcut: "Военные"
 UKR_politics_shortcut: "Политика"
 UKR_fedrada_category: "Верховная Рада"
 UKR_fedrada_category_desc: "Федеральная рада — государственный орган в федерализированной Украине, созданный для взаимодействия субъектов федерации с федеральным центром.\n\n§YСубъекты Украинской федерации§! могут быть §Gаннексированы§! [UKR.GetFlag]Украиной, но с сохранением §Yвлияния§! на субъекты в размере §Y50%§!."
 ukraine_maidan_east.4.b: "Вывести депутатов в сопровождении"
 UKR_maidan_temporary_attack_idea_desc: "Беспорядки на улицах придают энергию вооруженным силам, временно повышая их боеготовность."
 ukraine_maidan_overthrow.1.t: "Правительство свергнуто"
 ukraine_maidan_overthrow.1.d: "Наше правительство было свергнуто. К власти пришёл кандидат, выдвинутый протестующими.\nЕго позиция заключается в следующем:"
 ukraine_maidan_overthrow.1.a: "£democratic_group_small   $democratic$"
 ukraine_maidan_overthrow.1.b: "£communism_group_small   $communism$"
 ukraine_maidan_overthrow.1.c: "£neutrality_group_small   $neutrality$"
 ukraine_maidan_overthrow.1.e: "£nationalist_group_small   $nationalist$"
 ukraine_maidan_overthrow.2.t: "Правительство свергнуто — новый президент"
 ukraine_maidan_overthrow.2.d: "К власти пришёл кандидат, которого поддерживали протестующие. Его партия:"
 ukraine_maidan_overthrow.2.e: "Вернуться в меню обзора"
 ukraine_maidan_crm_annex.1.t: "Аннексия Крыма"
 ukraine_maidan_crm_annex.1.d: "Крымский полуостров был аннексирован Россией. Что нам делать дальше?"
 ukraine_maidan_crm_annex.1.a: "Пока что мы отступим"
 ukraine_maidan_crm_annex.1.b: "Мы будем бороться за Крым"
 UKR_idea_government_in_need_desc: "Правительство Украины страдает от безудержной коррупции и неэффективности. Административные расходы удваиваются из-за взяточничества, а неэффективное управление снижает производительность промышленности и ослабляет политический потенциал."
 UKR_modernization: "Модернизация Украины"
 UKR_modernization_desc: "Как только экономика и ситуация в стране стабилизируются, нам необходимо провести модернизацию нашей экономики. Пока еще не поздно."
 UKR_agriculture: "Модернизация сельского хозяйства"
 UKR_agriculture_desc: "Украина является одним из крупнейших в мире производителей и экспортеров сельскохозяйственной продукции и известна как «житница Европы». Поскольку на территории Украины сосредоточено 30 % самых плодородных черноземов мира, её сельскохозяйственная отрасль обладает огромным потенциалом. При наличии определённых инвестиций этот потенциал можно было бы реализовать. "
 UKR_nibulon: "Нибулон"
 UKR_nibulon_desc: "«Нибулон» — украинская агропромышленная компания, специализирующаяся на производстве и экспорте зерновых культур, таких как пшеница, ячмень и кукуруза. Штаб-квартира компании находится в Николаеве. Это единственная агропромышленная компания в Украине, располагающая собственным флотом и судостроительным заводом."
 UKR_pr_jsc_mhp: "ПрАО «МХП»"
 UKR_pr_jsc_mhp_desc: "ПрАО «МХП» («Мироновский Хлебопродукт») — крупнейший производитель птицы в Украине и один из крупнейших агропромышленных холдингов страны. Государственная поддержка его развития будет способствовать росту нашей пищевой промышленности и созданию рабочих мест в сельской местности."
 UKR_fozzy: "Fozzy Group"
 UKR_fozzy_desc: "«Fozzy Group, LLC» — одна из крупнейших торгово-промышленных групп Украины с головным офисом в Киеве, а также один из ведущих украинских ритейлеров, имеющий более 700 торговых точек по всей стране. Помимо розничной торговли, компания ведет деятельность в таких сферах, как производство продуктов питания, банковское дело, ИТ, логистика и ресторанный бизнес. "
 UKR_fin_it: "Модернизация экономики"
 UKR_fin_it_desc: "Поручить соответствующим министерствам содействовать модернизации нашего частного сектора, в частности в сфере финансов и информационных технологий. "
 UKR_privatbank: "ПриватБанк"
 UKR_privatbank_desc: "«ПриватБанк» — крупнейший украинский банк по объему активов и лидер украинского рынка розничных банковских услуг. Он был зарегистрирован 19 марта 1992 года. Государство должно вмешаться ради будущей прибыли. "
 UKR_it: "Развитие украинской ИТ-отрасли"
 UKR_it_desc: "Несмотря на то что ИТ-сектор в нашей стране растёт, для поддержания этой динамики, возможно, потребуются определённые инвестиции. "
 UKR_it_2: "Развитие украинской ИТ-отрасли"
 UKR_it_2_desc: "Похоже, что наша ИТ-отрасль может стать ключевым фактором в нашей экономике. Разумеется, при условии грамотного вложения средств."
 UKR_ukrtelekom: "Укртелеком"
 UKR_ukrtelekom_desc: "Государственная компания «Укртелеком» поможет нам быстрее нарастить пропускную способность нашей сети."
 UKR_kyivstar: "Киевстар"
 UKR_kyivstar_desc: "«Киевстар» — одна из крупнейших украинских телекоммуникационных компаний, предоставляющая на территории Украины услуги связи и передачи данных на основе широкого спектра технологий фиксированной и мобильной связи, включая услуги 4G (LTE). "
 UKR_digital_education: "Цифровое образование"
 UKR_digital_education_desc: "Цифровые навыки имеют жизненно важное значение для людей в XXI веке. Инвестиции как в цифровое образование, так и в цифровизацию образования со временем окупятся. Нельзя забывать и о старших поколениях: их образование — это инвестиция в настоящее."
 UKR_dig_sta: "Дія"
 UKR_dig_sta_desc: "Дія (укр. Дія, буквально «Действие»; также аббревиатура от укр. «Держава і Я», буквально «Государство и я») — это мобильное приложение, веб-портал и бренд электронного правительства Украины. Запущенное в 2020 году приложение «Дія» позволяет гражданам Украины использовать на своих смартфонах цифровые документы вместо бумажных для идентификации и обмена информацией.\n\nПортал «Дія» предоставляет доступ к более чем 50 государственным услугам. В перспективе правительство планирует сделать доступными через «Дія» все виды взаимодействия между государством и гражданами."
 UKR_tax_avoidance: "Решить проблему уклонения от уплаты налогов"
 UKR_tax_avoidance_desc: "Теперь у нас есть инструменты для решения огромной глобальной проблемы на местном уровне: уклонение от уплаты налогов как со стороны компаний, так и со стороны физических лиц. \n«Хотя налоги могут оставаться незамеченными и даже вызывать неприязнь, на самом деле они являются нашей социальной суперсилой. Налоги позволяют нам самостоятельно организовывать жизнь наших сообществ — как на местном, так и на национальном уровне — с тем, чтобы мы все вместе могли жить лучше. Однако основным препятствием является то, с какой легкостью влиятельные элиты уклоняются от своих социальных обязательств — от ответственности перед обществами, частью которых они являются и от которых извлекают выгоду». — Отчет о налоговой справедливости 2023"
 UKR_energy: "Энергетическая стратегия Украины"
 UKR_energy_desc: "Пришло время проанализировать возможности по совершенствованию систем электроснабжения страны и запустить программу модернизации энергетики жилого сектора."
 UKR_ukrenergo: "Укрэнерго"
 UKR_ukrenergo_desc: "«Укрэнерго» — оператор системы передачи электроэнергии в Украине и единственный оператор высоковольтных линий электропередачи в стране. Компания способна сделать всю сеть электропередачи ещё более эффективной."
 UKR_nuc_ener: "Энергоатом"
 UKR_nuc_ener_desc: "«Энергоатом» — государственное предприятие, эксплуатирующее все четыре атомные электростанции Украины (Запорожскую АЭС, Ровенскую АЭС, Южно-Украинскую АЭС и Хмельницкую АЭС). Это крупнейший производитель электроэнергии в Украине. "
 UKR_nuc_ener_2: "Развитие ядерной энергетики"
 UKR_nuc_ener_2_desc: "В соответствии с контрактом с компанией «Westinghouse» американская компания построит два новых энергоблока на Хмельницкой АЭС и ещё два — на восстановленной и окончательно достроенной Чигиринской АЭС в Черкассах."
 UKR_green_ener: "Стратегия в области зеленой энергетики"
 UKR_green_ener_desc: "После того как мы будем содействовать использованию возобновляемых источников энергии, нам необходимо проанализировать наш потенциал в неатомной сфере."
 UKR_ukrhydroenergo: "Укргидроэнерго"
 UKR_ukrhydroenergo_desc: "«Укргидроэнерго» — украинское государственное предприятие, которое управляет многими крупными гидроэлектростанциями на реках Днепр и Днестр. Это главная гидроэнергетическая компания Украины."
 UKR_solar: "Строительство солнечных электростанций"
 UKR_solar_desc: "Наши южные регионы входят в число самых солнечных в Восточной Европе, поэтому они идеально подходят для строительства солнечных электростанций."
 UKR_wind: "Развитие ветровых электростанций"
 UKR_wind_desc: "В нашей стране есть места, подходящие для высокоэффективного производства электроэнергии с помощью ветровых турбин."
 UKR_biomass: "Инвестиции в биомассовые электростанции"
 UKR_biomass_desc: "Учитывая успех частных инвестиций в строительство заводов по переработке биомассы, государство должно выделить средства на строительство таких объектов."
 UKR_min_env_prot: "Министерство охраны окружающей среды Украины"
 UKR_min_env_prot_desc: "Министерство является главным органом в системе центрального правительства Украины, ответственным за экологический мониторинг и развитие страны. Одной из его основных задач является развитие системы утилизации бытовых отходов."
 UKR_waste_manangement_2: "Создание системы переработки отходов"
 UKR_waste_manangement_2_desc: "Теперь, когда вопрос с коммунальным вывозом мусора наконец-то был решен, пришло время заложить основу и наладить систему сбора вторсырья. На это ушло много времени и сил, но результаты уже заметны."
 UKR_waste_manangement_3: "Модернизация системы управления отходами"
 UKR_waste_manangement_3_desc: "Существующая система должна стать более эффективной и охватить даже самые отдалённые уголки страны. Современная система обращения с отходами принесёт пользу всем — как населению, так и окружающей среде."
 UKR_forestry: "Управление лесным хозяйством Украины"
 UKR_forestry_desc: "Почти 20 % территории страны покрыто лесами. Чтобы сохранить эту ситуацию и предотвратить вырубку лесов, мы должны вкладывать средства в лесное хозяйство — это инвестиции в будущее."
 UKR_tourism: "Инвестиции в туризм"
 UKR_tourism_desc: "Туризм может стать отличной возможностью для любой страны. Прежде всего необходимо создать надлежащую инфраструктуру. "
 UKR_nat_wonders: "Природные чудеса Украины"
 UKR_nat_wonders_desc: "В 2008 году в ходе голосования были выбраны семь из множества живописных уголков Украины. Эти места станут визитной карточкой разнообразных ландшафтов нашей страны."
 UKR_wonders: "Чудеса Украины"
 UKR_wonders_desc: "В ходе голосования, прошедшего в 2007 году, были выбраны семь из многочисленных историко-культурных памятников Украины. Эти объекты станут визитной карточкой архитектурного наследия нашей страны."
 UKR_world_heritage: "Объекты Всемирного наследия Украины"
 UKR_world_heritage_desc: "К 2005 году в Украине насчитывалось три объекта Всемирного наследия, однако со временем этот список будет пополняться — в предварительном списке уже значится несколько объектов.\n\nКультурное наследие включает в себя памятники (такие как архитектурные сооружения, монументальные скульптуры или надписи), группы зданий и объекты (в том числе археологические памятники). Природное наследие определяется как природные объекты (состоящие из физических и биологических образований), геологические и физиографические образования (включая места обитания исчезающих видов животных и растений), а также природные территории, имеющие важное значение с точки зрения науки, охраны природы или природной красоты."
 UKR_health_tourism: "Развитие украинского медицинского туризма"
 UKR_health_tourism_desc: "Поскольку система здравоохранения в стране соответствует западным стандартам, но при этом, как правило, стоит дешевле, инвестиции в сектор медицинского туризма могут оказаться выгодными."
 UKR_corruption_reforms: "Антикоррупционные реформы"
 UKR_corruption_reforms_desc: "Проблема коррупции в украинском обществе уходит корнями в период распада Советского Союза в 1991 году. После провозглашения независимости от Советского Союза Украина столкнулась с целым рядом политиков из разных лагерей политического спектра, а также с криминальными авторитетами и олигархами, которые использовали коррупцию в полиции, политических партиях и промышленности для захвата власти.\n\nПора это изменить!"
 UKR_corruption_edu: "Борьба с коррупцией в образовании"
 UKR_corruption_edu_desc: "Согласно исследованию организации «Transparency International», проведённому в 2008 году, 47.3 % студентов вузов заявили, что от них требовали взятку; из них 29 % добровольно заплатили эту взятку. Студенты могли «купить» поступление в вуз, результаты экзаменов, оценки за докторские и/или магистерские диссертации."
 UKR_corruption_health: "Борьба с коррупцией в здравоохранении"
 UKR_corruption_health_desc: "Хотя медицинская помощь в государственных больницах теоретически бесплатна для украинцев, в начале XXI века было широко распространено явление, когда пациенты платили деньги, чтобы гарантированно получить необходимое лечение.\n\nВ 2012 году правозащитные организации обвинили чиновников Министерства здравоохранения в хищении средств, которые должны были быть направлены на лечение больных СПИДом: они закупали препараты для лечения СПИДа по значительно завышенным ценам, а затем получали откаты."
 UKR_corruption_police: "Борьба с коррупцией в полиции"
 UKR_corruption_police_desc: "Борьба с коррупцией в правоохранительных органах Украины с целью восстановления доверия общества и обеспечения эффективной работы полиции."
 UKR_corruption_armed_forces: "Борьба с коррупцией в Вооружённых силах Украины"
 UKR_corruption_armed_forces_desc: "Искоренить коррупцию в Вооруженных силах с целью повышения военной дисциплины и боевой эффективности."
 UKR_corruption_justice: "Борьба с коррупцией в судебной системе"
 UKR_corruption_justice_desc: "В начале 2010-х годов украинские политики и аналитики называли систему правосудия в Украине «прогнившей до мозга костей» и жаловались на политическое давление на судей и коррупцию. Независимые юристы и правозащитники жаловались, что на украинских судей регулярно оказывается давление с целью вынесения определённого приговора.\n\nСудебная система Украины широко считалась коррумпированной. Опрос, проведённый Министерством юстиции Украины в 2009 году, показал, что судебной системе страны доверяли лишь 10 % респондентов."
 UKR_corruption_spec_public_prosecutor: "Специализированная антикоррупционная прокуратура"
 UKR_corruption_spec_public_prosecutor_desc: "Специализированная антикоррупционная прокуратура является самостоятельным структурным подразделением Генеральной прокуратуры Украины и в первую очередь отвечает за содействие и контроль за ходом уголовных расследований, возбужденных Национальным антикоррупционным бюро Украины (НАБУ)."
 UKR_corruption_court: "Высший антикоррупционный суд Украины"
 UKR_corruption_court_desc: "Создать независимый антикоррупционный суд для рассмотрения дел о коррупции на высоком уровне и возвращения похищенных государственных активов."
 UKR_corruption_asset_rec: "Возврат активов"
 UKR_corruption_asset_rec_desc: "Возврат активов — процесс, описанный в главе V Конвенции ООН против коррупции (UNCAC), в рамках которого доходы от коррупции, вывезенные за рубеж, возвращаются и репатриируются в страну происхождения или их законным владельцам."
 UKR_corruption_gov: "Очищение государственного аппарата"
 UKR_corruption_gov_desc: "Провести радикальные реформы с целью искоренения коррупции в государственной администрации и восстановления институциональной целостности."
 UKR_end_kleptokracy: "Завершение антикоррупционных реформ"
 UKR_end_kleptokracy_desc: "Благодаря проведению всех этих реформ масштабы коррупции можно будет легко сократить, и общество сможет жить, не испытывая её удушающего воздействия."
 UKR_health_reform: "Начало реформ здравоохранения"
 UKR_health_reform_desc: "Согласно закону, медицинское обслуживание в Украине должно быть бесплатным для граждан, однако на практике пациенты участвуют в оплате большинства видов медицинских услуг."
 UKR_health_smoke_alc: "Борьба с курением и алкоголем"
 UKR_health_smoke_alc_desc: "Проводить кампании в области общественного здравоохранения, направленные на сокращение курения и потребления алкоголя, устраняя основные причины предотвратимых заболеваний."
 UKR_hiv_aids: "Борьба с ВИЧ/СПИД в Украине"
 UKR_hiv_aids_desc: "В 2001 году был утвержден национальный план по борьбе с ВИЧ/СПИДом; в число его целей входили предотвращение дальнейшего распространения ВИЧ, создание возможностей для лечения инфицированных лиц, а также оказание социальной поддержки и психологической помощи людям, живущим с ВИЧ/СПИДом."
 UKR_vaccination: "Программа вакцинации"
 UKR_vaccination_desc: "Расширить программы вакцинации по всей стране с целью предотвращения вспышек инфекционных заболеваний и повышения иммунитета населения."
 UKR_mental_health: "Программа психологической помощи"
 UKR_mental_health_desc: "Развивать службы психического здоровья и системы поддержки для решения проблемы роста числа случаев психологических расстройств среди населения."
 UKR_health_infra: "Модернизация системы здравоохранения"
 UKR_health_infra_desc: "Модернизировать и расширить инфраструктуру здравоохранения, обновив медицинские учреждения по всей стране."
 UKR_health_equipment: "Программа закупок медицинского оборудования"
 UKR_health_equipment_desc: "Закупить современное медицинское оборудование и диагностические средства для повышения качества оказания медицинской помощи и расширения возможностей лечения."
 UKR_health_prevention: "Программа медицинского обследования"
 UKR_health_prevention_desc: "Ввести комплексные программы медицинского обследования для раннего выявления заболеваний и улучшения профилактической помощи."
 UKR_health_rehabilitaion: "Национальная программа реабилитации"
 UKR_health_rehabilitaion_desc: "Создавать реабилитационные центры для пострадавших и инвалидов, в том числе военнослужащих, с целью восстановления качества их жизни."
 UKR_health_recreational_infra: "Совершенствование инфраструктуры для отдыха"
 UKR_health_recreational_infra_desc: "Инвестировать в объекты досуга и общественные пространства с целью поощрения физической активности и улучшения здоровья населения."
 UKR_health_final: "Завершение реформ в сфере здравоохранения"
 UKR_health_final_desc: "Завершить реформу системы здравоохранения с целью достижения западных стандартов медицинского обслуживания и показателей здоровья населения."
 UKR_edu_plan: "Планирование образовательных реформ"
 UKR_edu_plan_desc: "Хотя качество образования в нашей стране находится на относительно высоком уровне, есть области, которые необходимо совершенствовать, чтобы сохранить или повысить это качество. Нам необходимо подготовиться к продолжающейся цифровой трансформации в мире."
 UKR_edu_infra: "Совершенствование образовательной инфраструктуры"
 UKR_edu_infra_desc: "Модернизировать образовательные учреждения и школьные здания с целью создания современных условий для обучения."
 UKR_edu_ped_uni: "Поддержка педагогических университетов"
 UKR_edu_ped_uni_desc: "Укрепить педагогические вузы с целью повышения качества подготовки учителей и качества обучения по всей стране."
 UKR_edu_universities: "Поддержка университетов"
 UKR_edu_universities_desc: "Предоставить высшим учебным заведениям дополнительные ресурсы и поддержку в целях укрепления научных исследований и инноваций."
 UKR_edu_infra_2: "Совершенствование образовательной инфраструктуры: новый этап"
 UKR_edu_infra_2_desc: "Продолжать модернизацию образовательных учреждений с помощью современных технологий и передовой образовательной инфраструктуры."
 UKR_edu_final: "Завершить реформу системы образования"
 UKR_edu_final_desc: "Завершить реформу образования с целью достижения мировых стандартов в области обучения и научного прогресса."
 UKR_bmz: "БМЗ «Прогресс»"
 UKR_bmz_desc: "Бердичевский машиностроительный завод («Прогресс») — машиностроительное предприятие в городе Бердичев, Житомирская область, Украина."
 UKR_nkmz: "НКМЗ"
 UKR_nkmz_desc: "Новокраматорский машиностроительный завод (НКМЗ) — крупный украинский производитель тяжёлого машиностроения. Выпускает оборудование для горнодобывающей и металлургической промышленности: прокатные станы, кузнечно-прессовое оборудование, доменные печи, дробилки руды и другое промышленное оборудование.\n\nКомпания также производит гребные валы для ледоколов и компоненты для подводных лодок. По данным предприятия, было спроектировано и построено более 18 горнодобывающих комплексов."
 UKR_oil_mining: "Нефтедобыча"
 UKR_oil_mining_desc: "Строить новые нефтедобывающие объекты с целью увеличения объемов производства энергии внутри страны и снижения зависимости от импортных поставок."
 UKR_mining2: "Повышение эффективности добычи ресурсов"
 UKR_mining2_desc: "Расширить горнодобывающую деятельность с целью увеличения объемов добычи хрома, вольфрама и других стратегически важных полезных ископаемых."
 UKR_construction_kovalska: "«ИКГ Ковальская»"
 UKR_construction_kovalska_desc: "ICG «Ковальская» (ООО) — украинский производитель строительных материалов и девелоперская компания.\n\n Производит бетон и бетонные смеси, строительные растворы, железобетонные изделия, стеновые материалы из керамзитобетона и газобетона, тротуарную плитку, сухие строительные смеси, а также водно-дисперсионные материалы (краски, декоративные штукатурки, клеи и пены)."
 UKR_train_prod: "Производство поездов"
 UKR_train_prod_desc: "Крюковский вагоностроительный завод — крупное промышленное предприятие в городе Кременчуг, Украина, занимающееся производством локомотивов и моторвагонных поездов."
 UKR_kharkiv_tractor: "ХТЗ"
 UKR_kharkiv_tractor_desc: "Харьковский тракторный завод (ХТЗ) — украинский производитель сельскохозяйственной техники в городе Харьков. Основан в 1930–1931 годах как один из ключевых объектов Первого пятилетнего плана индустриализации СССР. ХТЗ был крупнейшим тракторным заводом Украины, выпускавшим как колёсные, так и гусеничные тракторы.\n\nВ 1994 году, спустя два года после распада Советского Союза и обретения Украиной независимости, предприятие было преобразовано в открытое акционерное общество. Производит тракторы, включая универсальные колёсные модели."
 UKR_agriculture2: "Развитие сельского хозяйства: следующий этап"
 UKR_agriculture2_desc: "Внедрять передовые методы ведения сельского хозяйства и наращивать производство зерна, чтобы укрепить позиции Украины как мирового поставщика продовольствия."
 UKR_chumak: "Чумак"
 UKR_chumak_desc: "«Чумак» — шведско-украинская компания по производству продуктов питания, расположенная в г. Каховке Херсонской области. В ассортименте компании — кетчуп, майонез, макаронные изделия, заправки для салатов, кулинарные соусы, овощи в консервах, маринованные овощи, томатный сок и подсолнечное масло."
 UKR_gsc_game_world: "GSC"
 UKR_gsc_game_world_desc: "GSC Game World — украинская компания-разработчик видеоигр, основанная в Киеве в 1995 году Сергеем Григоровичем. Наиболее известна по сериям игр Cossacks и S.T.A.L.K.E.R.."
 UKR_national_bank: "Национальный банк Украины"
 UKR_national_bank_desc: "Согласно Конституции Украины, основной функцией Национального банка Украины (НБУ) является обеспечение стабильности денежной единицы Украины (гривны). Для выполнения этой задачи Национальный банк способствует стабильности банковской системы и, в пределах своей компетенции, ценовой стабильности."
 UKR_darnytsia: "Дарница"
 UKR_darnytsia_desc: "«Дарница» — украинская фармацевтическая компания."
 UKR_farmak: "Фармак"
 UKR_farmak_desc: "АО «Фармак» — украинская фармацевтическая компания, основанная в 1925 году. Штаб-квартира расположена в Киеве."
 UKR_carpathian_tourism: "Развитие туризма в Карпатах"
 UKR_carpathian_tourism_desc: "Развивать туристическую инфраструктуру в Карпатах с целью привлечения иностранных туристов и получения доходов для экономики."
 UKR_black_sea_tourism: "Развитие туризма на побережье Чёрного моря"
 UKR_black_sea_tourism_desc: "Расширить курортную инфраструктуру на побережье Чёрного моря, чтобы сделать Украину одним из ведущих морских туристических направлений."
 UKR_infra_rail: "Модернизация железных дорог"
 UKR_infra_rail_desc: "Модернизировать национальную железнодорожную сеть с целью улучшения грузовых перевозок и пассажирского сообщения."
 UKR_infra_rail_2: "Модернизация железных дорог: новый этап"
 UKR_infra_rail_2_desc: "Провести полное и комплексное расширение и модернизацию железнодорожной сети с целью создания транспортной инфраструктуры мирового уровня."
 UKR_infra_southern_bug: "Развитие судоходства на Южном Буге"
 UKR_infra_southern_bug_desc: "Восстановить коммерческое грузовое судоходство на Южном Буге выше Николаева для облегчения растущего экспорта украинского зерна."
 UKR_pivdenne_db: "Конструкторское бюро «Южное»"
 UKR_pivdenne_db_desc: "Конструкторское бюро «Южное», расположенное в Днепре (Украина), занимается проектированием спутников и ракет, а ранее — межконтинентальных баллистических ракет (МБР) советского производства."
 UKR_luch: "Конструкторское бюро «Луч»"
 UKR_luch_desc: "Расширить возможности конструкторского бюро «Луч» в области разработки крылатых ракет и передовых технологий вооружений."
 UKR_mayak: "Модернизация завода «Маяк»"
 UKR_mayak_desc: "Модернизация производственных мощностей завода «Маяк» для снабжения вооружённых сил современным пехотным вооружением."
 UKR_ukrainian_armor: "Украинская броня"
 UKR_ukrainian_armor_desc: "Разработка современных бронежилетов и защитного снаряжения для военнослужащих."
 UKR_large_construction1: "Крупная строительная программа"
 UKR_large_construction1_desc: "Начать реализацию масштабной строительной программы, направленной на расширение городской инфраструктуры и укрепление экономического потенциала по всей стране."
 UKR_large_construction2: "Крупное строительство, вторая фаза"
 UKR_large_construction2_desc: "Продолжить строительный бум за счет расширения программ, направленных на поддержание темпов развития и занятости."
 UKR_tax_reform: "Налоговая реформа"
 UKR_tax_reform_desc: "Провести реформу налоговой системы с целью увеличения поступлений в бюджет и модернизации системы налогового администрирования."
 UKR_pension_reform: "Пенсионная реформа"
 UKR_pension_reform_desc: "Провести комплексную реформу пенсионной системы с целью обеспечения её долгосрочной устойчивости и надлежащего уровня пенсионного обеспечения."
 UKR_min_economy: "Министерство экономики"
 UKR_min_economy_desc: "Укрепить Министерство экономики с целью содействия либерализации рынка и ослабления государственного контроля над экономикой."
 UKR_cut_energy_subs: "Сократить субсидии на энергоносители"
 UKR_cut_energy_subs_desc: "Отменить неэффективные субсидии на энергоносители с целью сбалансирования бюджета и стимулирования энергоэффективности."
 UKR_state_fund: "Государственный фонд"
 UKR_state_fund_desc: "Создать суверенный фонд благосостояния для инвестирования бюджетных излишков в проекты развития и международные активы."
 UKR_air_improvements: "Усовершенствование авиации"
 UKR_air_improvements_desc: "Модернизировать ВВС за счет улучшения подготовки личного состава, оснащения и оперативной доктрины."
 UKR_aa_mis_def_force: "Силы противовоздушной обороны"
 UKR_aa_mis_def_force_desc: "Создать специализированные подразделения противовоздушной ракетной обороны для защиты воздушного пространства от угроз с воздуха."
 UKR_radio_eng: "Радиотехнические войска"
 UKR_radio_eng_desc: "Развивать потенциал в области радиотехники и радиоэлектронной борьбы для обеспечения современной военной связи."
 UKR_support_fac: "Вспомогательные объекты"
 UKR_support_fac_desc: "Расширить инфраструктуру обеспечения авиабазы с целью повышения эффективности воздушных операций и укрепления потенциала по техническому обслуживанию воздушных судов."
 UKR_army_imp: "Усовершенствования в армии"
 UKR_army_imp_desc: "Укрепить армию за счет совершенствования подготовки, доктрины и профессионального развития военнослужащих."
 UKR_army_aviation: "Авиация сухопутных войск"
 UKR_army_aviation_desc: "Развитие армейской авиации с использованием вертолётов для транспортировки, разведки и непосредственной поддержки."
 UKR_army_logistics: "Армейская логистика"
 UKR_army_logistics_desc: "Совершенствовать системы материально-технического обеспечения и цепочки поставок Сухопутных войск для обеспечения оперативной деятельности и повышения боевой эффективности."
 UKR_army_maintenance: "Ремонтные базы армии"
 UKR_army_maintenance_desc: "Создать комплексные базы по техническому обслуживанию и ремонту оборудования для обеспечения максимальной боеготовности военной техники."
 UKR_medical_forces: "Медицинские подразделения"
 UKR_medical_forces_desc: "Создать военно-медицинские командования, располагающие современными полевыми госпиталями и возможностями оказания неотложной травматологической помощи."
 UKR_antonov: "Антонов"
 UKR_antonov_desc: "Расширить производственные мощности авиастроительного завода имени Антонова для выпуска современных транспортных и грузовых самолетов."
 UKR_idea_pro_ukraine_reform_1_desc: "Правительственные реформы по борьбе с коррупцией позволяют сократить расточительство и неэффективность, восстанавливая доверие общественности, несмотря на первоначальные издержки переходного периода."
 UKR_idea_shortened_general_staff_desc: "Оптимизация структуры военного командования повышает эффективность планирования и ускоряет профессиональный рост офицеров."
 UKR_uda_encouraged: "Поддержка УДА"
 UKR_uda_encouraged_desc: "Интеграция ополченцев УДА в состав вооружённых сил повышает боеспособность, но снижает воинскую дисциплину."
 UKR_uda_integrated: "Интеграция УДА"
 UKR_uda_integrated_desc: "Украинская добровольческая армия была полностью интегрирована в регулярные вооруженные силы, что способствовало укреплению дисциплины и росту националистических настроений."
 UKR_ukrtelekom_idea: "Укртелеком"
 UKR_ukrtelekom_idea_desc: "«Укртелеком», государственный телекоммуникационный монополист, был модернизирован для расширения цифровой инфраструктуры и повышения продуктивности."
 UKR_finance_and_it: "Поддержка финансового и ИТ-сектора"
 UKR_finance_and_it_desc: "Развитие секторов финансов и информационных технологий способствует формированию высокодоходной экономической деятельности и укреплению научно-исследовательского потенциала."
 UKR_digital_state: "Украинское цифровое государство"
 UKR_digital_state_desc: "«Дія» (укр. «Дія» — «Действие», также акроним от «Держава і Я» — «Государство и я») — это мобильное приложение, веб-портал и бренд электронного управления в Украине. Запущенное в 2020 году, приложение «Дія» позволяет гражданам Украины использовать цифровые документы на смартфоне вместо физических для идентификации и передачи данных.\n\nПортал «Дія» предоставляет доступ к более чем 50 государственным услугам. В перспективе правительство планирует перевести через «Дію» все виды взаимодействия государства с гражданами."
 UKR_tax_avoidance_idea: "Незначительное уклонение от налогов"
 UKR_tax_avoidance_idea_desc: "Хотя налоги могут оставаться незамеченными и даже вызывать неприязнь, на самом деле они являются нашей «суперсилой» в социальной сфере. Налоги позволяют нам самостоятельно организовывать жизнь наших сообществ — как на местном, так и на национальном уровне — с тем, чтобы мы все вместе могли жить лучше.\n\nОднако основным препятствием является то, с какой лёгкостью влиятельные элиты уклоняются от своих социальных обязательств — от ответственности перед обществами, частью которых они являются и от которых извлекают выгоду. — Отчёт о налоговой справедливости 2023"
 UKR_nuclear_energy: "Энергоатом"
 UKR_nuclear_energy_desc: "Инвестиции в атомные электростанции способствуют росту объемов производства электроэнергии внутри страны и увеличению объемов строительства реакторов."
 UKR_construction: "Развитие строительства"
 UKR_construction_desc: "Выделение строительных мощностей на срочные государственно финансируемые проекты."
 UKR_demographic_boom: "Демографический бум"
 UKR_demographic_boom_desc: "Благоприятные демографические тенденции и политика стимулирования роста населения способствуют увеличению имеющихся кадровых ресурсов и рабочей силы."
 UKR_demographic_crisis: "Демографический кризис"
 UKR_demographic_crisis_desc: "Население страны сокращается с 1990-х годов из-за высокого уровня эмиграции в сочетании с высоким уровнем смертности и низким уровнем рождаемости. С 1993 года численность населения сокращается в среднем более чем на 300 000 человек в год."
 UKR_tackle_corruption: "Сокрушить коррупцию!"
 UKR_tackle_corruption_desc: "Кампания по борьбе с коррупцией и институциональные реформы значительно повышают эффективность работы правительства и национальную производительность труда."
 UKR_corruption: "Глубоко укоренившаяся коррупция"
 UKR_large_construction: "Крупная строительная программа"
 UKR_large_construction_desc: "Амбициозная программа развития инфраструктуры ускоряет завершение строительства и повышает производительность, хотя при этом значительно возрастает потребление энергии."
 UKR_medical_reform: "Реформа здравоохранения"
 UKR_medical_reform_desc: ""
 UKR_aamdf: "Зенитно-ракетные войска"
 UKR_aamdf_desc: "Организованные силы противовоздушной ракетной обороны значительно усиливают наши возможности ПВО и снижают эффективность авиационной поддержки противника."
 UKR_radio_troops: "Радиотехнические войска"
 UKR_radio_troops_desc: "Подразделения радиотехники и связи ВВС повышают эффективность разведки и перехвата, одновременно сокращая потери авиации."
 UKR_air_support_fac: "Объекты обеспечения ВВС"
 UKR_air_support_fac_desc: "Инвестиции в объекты обеспечения воздушной поддержки позволяют повысить топливную экономичность и надежность воздушных судов, сокращая эксплуатационные расходы и одновременно повышая их эксплуатационные характеристики."
 UKR_cut_subsidies: "Сократить субсидии на энергоносители"
 UKR_cut_subsidies_desc: "Отмена энергетических субсидий заставляет потребителей нести реальные производственные затраты, что способствует повышению производительности и одновременно снижает нагрузку на бюджет."
 UKR_health_cost: "Здоровая нация!"
 UKR_health_cost_desc: ""
 UKR_military_rehab: "Реабилитация военнослужащих"
 UKR_military_rehab_desc: "Программы реабилитации ветеранов способствуют поддержанию боевого духа личного состава и укреплению сплочённости подразделений, хотя и сопряжены с увеличением расходов на здравоохранение."
 UKR_resource_extraction: "Увеличение объемов добычи ресурсов"
 UKR_resource_extraction_desc: "Расширение добычи полезных ископаемых способствует увеличению внутренних запасов минерального сырья и топлива."
 UKR_research_boost: "Программа поддержки исследований"
 UKR_research_boost_desc: "Централизованная программа поддержки научных исследований способствует ускорению технологического развития как в военной, так и в гражданской сферах."
 UKR_economy_boost: "Экономическое стимулирование"
 UKR_economy_boost_desc: "Временная программа экономического стимулирования ускоряет рост продуктивности и эффективности фабрик, однако требует повышенного потребления энергии."
 UKR_kolomoisky_help: "Помощь от Коломойского"
 UKR_kolomoisky_help_desc: "Известный олигарх Коломойский обратился к нам с предложением профинансировать создание нескольких батальонов для поддержания боеспособности наших вооружённых сил."
 UKR_kolomoisky_finish: "Полицейский полк «Днепр-1»"
 UKR_kolomoisky_finish_desc: "Последним проектом, который Коломойский предложил профинансировать, было преобразование Днепропетровского оборонительного полка в полицейский полк."
 UKR_uda: "Украинская добровольческая армия"
 UKR_uda_desc: "Необходимо объединить добровольцев в единую воинскую часть."
 UKR_aidar: "Создать батальон «Айдар»"
 UKR_aidar_desc: "Давайте рискнем и примем их в ряды наших вооруженных сил."
 UKR_russia_help_battalions_desc: "Развертывание подразделений российской Росгвардии и «Вагнера» способствует укреплению безопасности и проведению операций по борьбе с повстанцами в условиях оккупации."
 UKR_economy: "Экономическая политика"
 UKR_economy_desc: "\n\n\n\n\n\n£GFX_ukr_economy\n\n\n\n\n\n\n\n\n§5Министерство развития экономики и торговли§! является главным органом власти в системе центрального правительства §8Украины§!, отвечающим за формирование и реализацию государственной политики экономического и социального развития (экономика бизнеса); регулирование потребительских цен; промышленно-инвестиционную и торговую экономическую политику; развитие предпринимательства; техническое регулирование и защиту прав потребителей; межведомственную координацию экономического и социального сотрудничества §8Украины§! с §8Евросоюзом§!."
 UKR_boost_economy: "Стимулировать экономику"
 UKR_boost_research: "Поддержка научно-исследовательской деятельности"
 UKR_boost_resource: "Субсидировать добычу природных ресурсов"
 UKR_add_resource: "Углублённая разработка ресурсов"
 UKR_renewable_energy: "Оценка потенциала возобновляемых источников энергии Украины"
 UKR_renewable_energy_desc: "\n\n\n\n\n\n£GFX_UKR_energy_ukraine\n\n\n\n\n\n\n\n\nКарта регионов с наибольшим потенциалом производства энергии из возобновляемых источников."
 UKR_energy_wind: "Ветровая энергетика"
 UKR_energy_solar: "Солнечная энергия"
 UKR_energy_geothermal: "Геотермальная энергия"
 UKR_privatize_resource: "Приватизация в добывающей отрасли"
 UKR_privatize_resource_desc: "Приватизация отраслей добычи природных ресурсов приводит к ослаблению государственного контроля и сокращению доступности ресурсов."
 UKR_restructure_debt: "Запросить реструктуризацию долга"
 UKR_ask_western_loans: "Попросить займы у §7Западных стран§!"
 UKR_ask_eastern_loans: "Попросить займы у §tВосточных стран§!"
 UKR_natpolice_decision_category: "Патрульная служба полиции специального назначения"
 UKR_natpolice_decision_category_desc: "Патрульная служба полиции специального назначения Украины — это подразделение в составе Департамента патрульной полиции Украины Национальной полиции Украины, созданное в рамках Министерства внутренних дел Украины как структура сил специального назначения для охраны общественного порядка.\n\nСтруктура вошла в состав Национальной полиции Украины. Служба объединяет бывшие батальоны и полки Министерства внутренних дел."
 UKR_uda_decision_category: "Украинская добровольческая армия"
 UKR_uda_decision_category_desc: "Украинская добровольческая армия — это добровольческое военизированное формирование, созданное на базе подразделений Украинского добровольческого корпуса после ухода Дмитрия Яроша и его соратников из движения «Правый сектор»."
 UKR_integrate_uda: "Интегрировать §YУДА§! в состав §YВооружённых сил Украины§!"
 UKR_small_arms: "Продвинуть §Oоружейную §!§Wкомпанию§!"
 UKR_equipment_funds: "Продвинуть §OХКБМ§! §Wпроизводство пехотного снаряжения§!"
 UKR_heavy_equipment: "Выделить средства для §Gзавода §!§Wим. Малышева§!"
 UKR_heavy_equipment_research: "Поддержать §Gисследования §!§Wбронетехники§!"
 UKR_fund_antonov: "Субсидировать §8«Антонов»§!"
 UKR_air_equipment: "Поддержать §8исследования §!§Wавиации§!"
 UKR_nikolayev_funds: "Модернизация §8Николаевской верфи§!"
 UKR_naval_equipment: "Поддержка §Wисследований§! §8техники ВМС§!"
 UKR_parti_regions_economic_committee_desc: "Экономический комитет «Партии регионов» сглаживает колебания деловой активности и обеспечивает стабильность."
 UKR_parti_regions_invest_open_window_desc: "Благоприятная для бизнеса инвестиционная политика способствует росту численности населения и увеличению поступлений от корпоративного налога."
 UKR_parti_regions_taxx_desc: "Реформа Налогового кодекса предусматривает снижение налогов как для физических, так и для юридических лиц, что приводит к увеличению административных издержек, но при этом смягчает социальную напряженность."
 UKR_parti_regions_laizes_desc: "Меры по секуляризации ослабляют влияние духовенства, но приводят к дестабилизации религиозных общин и усиливают экономическую нестабильность."
 UKR_parti_regions_stability_reform_desc: "Меры по обеспечению региональной стабильности укрепляют идеологическую оборону, но приводят к увеличению бюрократических издержек."
 UKR_parti_regions_lustration_desc: "Увольнение чиновников советской эпохи позволяет сократить расходы на административный и силовой аппарат."
 UKR_parti_regions_opposition_agree_desc: "Политическое сотрудничество с оппозиционными партиями способствовало снижению изоляции правительства и сдерживало идеологический дрейф в эпоху Януковича."
 UKR_parti_regions_titushki_desc: "Поддерживаемые правительством уличные провокаторы пресекают идеологическое отклонение с помощью запугивания и насилия."
 UKR_parti_regions_optimise_ministers_desc: "Оптимизация министерской бюрократии позволяет сократить административные расходы и повысить эффективность работы правительства."
 UKR_parti_regions_inform_act_desc: "Законодательство о контроле над СМИ способствует стабилизации политической риторики за счет административных затрат."
 UKR_parti_regions_pension_reform_desc: "Реформирование пенсионной системы позволяет сократить социальные расходы, но при этом снижает темпы роста населения из-за уменьшения размера выплат."
 UKR_parti_regions_youth_regions_desc: "Программы вовлечения молодежи способствуют укреплению межпоколенческой поддержки и незначительно повышают политическое влияние и способность противостоять политическому дрейфу."
 UKR_our_ukraine_secretariat_of_president_desc: "Секретариат президента укрепляет потенциал в области административных исследований, но при этом увеличивает бюрократическую нагрузку."
 UKR_our_ukraine_fight_with_corruption_idea_desc: "Борьба с коррупцией позволяет сократить бюрократические издержки и незаконное извлечение экономических выгод."
 UKR_our_ukraine_education_reform_idea_desc: "Реформы образовательных программ способствуют укреплению научно-исследовательского потенциала, но при этом влекут за собой временные издержки в политической сфере и в плане стабильности."
 UKR_our_ukraine_health_reform_idea_desc: "Модернизация системы здравоохранения позволяет сократить расходы и повысить уровень пригодности к военной службе."
 UKR_our_ukraine_social_reform_idea_desc: "Оптимизация социальных расходов снижает нагрузку на бюджет и одновременно укрепляет поддержку со стороны демократических сил."
 UKR_our_ukraine_air_industry_idea_desc: "Модернизация авиационной отрасли позволяет снизить затраты на производство военных самолетов."
 UKR_reform_sbu: "Реформа СБУ"
 UKR_reform_sbu_desc: "СБУ нуждается в реформах: на протяжении всех этих лет эта структура была глубоко погрязла в коррупции и нуждается в обновлении."
 UKR_Yanu_Minister: "Кабинет министров"
 UKR_Yanu_President: "Президентство"
 UKR_prepare_protest_tt: "Мы получим или потеряем поддержку §8представителей Майдана§!"
 UKR_donbass_concessions_tt: "В зависимости от нашей позиции мы сможем заручиться поддержкой восточных или западных регионов, но при этом неизбежно разочаруем §8Представителей Майдана§!."
 UKR_azovsteel_desc: "Контроль над металлургическим комплексом «Азовсталь» обеспечивает стабильные поставки высококачественной стали для промышленного и военного производства."
 UKR_yushenko_premier_idea_desc: "Виктор Ющенко занимает пост премьер-министра при Кучме, укрепляя свой политический авторитет и направляя правительство по пути нейтралитета."
 UKR_yanuk_premier_idea_desc: "Виктор Янукович занимает пост премьер-министра при Кучме, укрепляя свои политические позиции и смещая правительство влево."
 UKR_unstable_government_idea_desc: "Политическая нестабильность привела к ослаблению государственного контроля, что позволило различным идеологическим группировкам использовать беспорядки в своих интересах."
 UKR_land_reform_idea3_desc: "Земельная реформа, начатая в прошлом веке, должна привести к полному перераспределению земельных владений по всей стране. На данный момент этот процесс продолжается."
 UKR_zaims_desc: "Краткосрочные международные займы позволили стабилизировать экономику и увеличить налоговые поступления, хотя и привели к возникновению значительных долговых обязательств в будущем."
 UKR_social_discontent: "Серьёзное недовольство народа"
 UKR_social_discontent_desc: "Масштабные сокращения расходов на здравоохранение, образование и социальное обеспечение снижают нагрузку на государственный бюджет, но при этом подрывают доверие населения."
 UKR_banks_lobbyst_liquidate_desc: "Устранение интересов банковского сектора из правительства позволяет перенаправить поступления от корпоративного налога, тем самым ослабляя влияние финансовых элит на политику."
 UKR_mining_company_help_desc: "Налоговые льготы для горнодобывающих компаний позволяют им пережить период экономических трудностей."
 UKR_privatization_idea_desc: "Приватизация государственных предприятий повышает эффективность работы заводов и улучшает торговые отношения за счет утраты политической власти."
 UKR_without_kuchma_idea_desc: "Движение «Украина без Кучмы» мобилизовало националистические настроения против предполагаемой олигархической коррупции и авторитарного управления."
 UKR_left_opposition_idea_desc: "Левое политическое движение мобилизует рабочих и интеллигенцию против правящего правительства, подрывая существующий порядок."
 UKR_luaz_idea_desc: "Поддержка отечественного автопроизводителя «ЛУАЗ» позволяет снизить себестоимость производства легковых и грузовых автомобилей."
 UKR_anti_socialist_media_desc: "СМИ, подконтрольные государству, подавляют коммунистические и нейтральные настроения, укрепляя контроль реакционного правительства над общественным мнением."
 ukraine_union.1.t: "Украина предлагает создать полноценное союзное государство"
 ukraine_union.1.d: "Киев предлагает влиться в нашу государственность и объединить оба народа в единое союзное государство под руководством Украины. Все ключевые объекты, все ресурсы и все солдаты перейдут к ним. Готовы ли мы пожертвовать своей независимостью ради этого союза?"
 ukraine_union.1.a: "Мы принимаем Союз"
 ukraine_union.1.b: "Мы не сдадим наше государство."
 ukraine_union.2.t: "Россия отвергает Союз"
 ukraine_union.2.d: "Москва отказывается войти в состав нашего союза. Мечта о единой нации от Карпат до Тихого океана придется отложить на потом."
 ukraine_union.2.a: "Упущенная возможность"
 ukraine_union.3.t: "Украина предлагает совместное вступление в НАТО"
 ukraine_union.3.d: "Киев призывает нас выйти из наших нынешних альянсов и вместе с ним вступить в НАТО, тем самым изменив структуру системы безопасности в Восточной Европе. Пойдём ли мы по этому пути вместе?"
 ukraine_union.3.a: "Мы вместе вступаем в НАТО"
 ukraine_union.3.b: "Наше место не в НАТО"
 ukraine_union.4.t: "Россия отказывается от членства в НАТО"
 ukraine_union.4.d: "Москва отказывается вступать в НАТО вместе с нами. Нам придется прокладывать свой западный курс в одиночку."
 ukraine_union.4.a: "Так и быть"
 ukraine_kommi.16.t: "Коммунистическое восстание на Востоке"
 ukraine_kommi.16.d: "Коммунистическое восстание, поддержанное Киевом, привело к захвату нескольких наших восточных провинций и провозглашению независимости при поддержке Украины. Мы этого не забудем."
 ukraine_kommi.16.a: "Мы это запомним"
 UKR_brotherhood_people_desc: "Коммунистическое общественное движение, ставящее во главу угла коллективное благосостояние и солидарность, снижает нагрузку, связанную с потребительскими товарами, и одновременно укрепляет идеологическую оборону."
 UKR_social_reform_desc: "Расширение системы социального обеспечения позволяет сократить расходы на здравоохранение и социальные нужды, одновременно повышая уровень жизни при коммунистическом правлении."
 UKR_equal_rights_idea_desc: "Реализация политики равных прав в отношении всех демографических групп снижает бюрократическую нагрузку и укрепляет политическое единство."
 UKR_west_investors_idea_desc: "Участие западных рынков обеспечило приток капитала и экономический опыт, что способствовало развитию бизнеса и укреплению доверия населения к экономике."
 UKR_our_investors_idea_desc: "Капитал отечественных инвесторов способствует развитию научно-исследовательского потенциала, стабилизирует экономические циклы и укрепляет независимость во внешней политике."
 UKR_socialist_effort_desc: "Экономическая мобилизация в интересах социалистического производства способствует укреплению стабильности, росту населения и обеспечению населения потребительскими товарами."
 UKR_alpha: "Альфа"
 UKR_alpha_desc: "Подразделение специальных операций «Альфа» Службы безопасности Украины (СБУ) усиливает наши контрразведывательные и охранные операции по противодействию диверсионным угрозам."
 UKR_svr_desc: "Операции Службы внешней разведки способствуют развитию разведывательной сети и укреплению защитных механизмов ведомства от иностранных подрывных действий."
 UKR_sviaz_desc: "Государственная служба специальной связи обеспечивает усовершенствованные средства шифрования, дешифрования и инфраструктуру безопасной связи."
 UKR_ukraine_always_right: "Украина всегда права"
 UKR_ukraine_always_right_desc: "В Украине к власти пришли настоящие патриоты. Украина всегда права, Украина превыше всего."
 UKR_take_control_of_the_media: "Взять под свой контроль СМИ"
 UKR_take_control_of_the_media_desc: "В последние годы средства массовой информации получили слишком много свободы. Они только и занимаются тем, что рассказывают, какая у нас плохая и ужасная страна, но мы это исправим."
 UKR_prohibition_of_non_nationalist_organizations: "Запрет на деятельность ненационалистических организаций"
 UKR_prohibition_of_non_nationalist_organizations_desc: "Любая организация, отвергающая националистическое дело, представляет угрозу для нового порядка. Запретим их все и оставим наше движение единственной легальной политической силой в стране."
 UKR_anti_russian_policy: "Антироссийская политика"
 UKR_anti_russian_policy_desc: "Москва по-прежнему остается главным врагом украинского народа. Необходимо закрепить враждебность по отношению к России в качестве официальной государственной политики и избавиться от российского влияния в наших институтах."
 UKR_loyal_teachers_in_schools: "Лояльные преподаватели в школах"
 UKR_loyal_teachers_in_schools_desc: "Школа — это основа будущих патриотичных граждан Украины. В школах останутся только настоящие украинцы."
 UKR_ban_all_languages_except_ukrainian: "Запретить все языки, кроме украинского"
 UKR_ban_all_languages_except_ukrainian_desc: "Мы начнём реализацию программы украинизации; все остальные языки будут исключены из школьной программы, делового общения и других сфер жизни гражданина Украины."
 UKR_introduce_death_penalty_for_disloyal_persons: "Ввести смертную казнь для нелояльных"
 UKR_introduce_death_penalty_for_disloyal_persons_desc: "Верность — это то, чем каждый гражданин обязан своей родине. Всех, кто её ненавидит, всех, кто хочет ей навредить, мы устраним любыми необходимыми средствами."
 UKR_united_council_of_ukrainian_nationalists: "Объединенный совет украинских националистов"
 UKR_united_council_of_ukrainian_nationalists_desc: "Наконец-то страной управляют истинный патриотизм и национализм, во главе с настоящими сторонниками Украины. Цель нашего съезда — построить великую страну."
 UKR_right_sector: "Правый сектор"
 UKR_right_sector_desc: "Правый сектор будет отвечать за внутриполитическую составляющую нового украинского государства."
 UKR_full_order_in_the_country: "Полный порядок в стране"
 UKR_full_order_in_the_country_desc: "Порядок — залог стабильности. Мы будем бороться с проявлениями хаоса, беспорядка и мятежа."
 UKR_ukrainian_assault_battalions: "Украинские штурмовые батальоны"
 UKR_ukrainian_assault_battalions_desc: "Мы сформируем ударные батальоны из особо патриотичных граждан, которые будут выполнять конкретные задачи."
 UKR_make_government_jobs_only_for_ukrainians: "Сделать государственные должности доступными только для украинцев"
 UKR_make_government_jobs_only_for_ukrainians_desc: "Работать на благо Родины должны только украинцы, у всех остальных не должно быть права на труд."
 UKR_complete_the_cleansing_of_the_ukrainian_state: "Завершить очищение украинского государства"
 UKR_complete_the_cleansing_of_the_ukrainian_state_desc: "Наша родина очищена от врагов, недоброжелателей и прочих негативных элементов."
 UKR_limit_the_powers_of_the_mvd: "Ограничить полномочия МВД"
 UKR_limit_the_powers_of_the_mvd_desc: "Полиция и другие органы власти обладают слишком большими полномочиями в нашем государстве, и мы их ограничим."
 UKR_night_of_the_long_knives: "Ночь длинных ножей"
 UKR_night_of_the_long_knives_desc: "С теми, кто особенно упорно сопротивляется реформам, мы будем поступать более решительно."
 UKR_una_unso: "УНА УНСО"
 UKR_una_unso_desc: "Внешнеполитическая деятельность будет возложена на организацию УНА-УНСО."
 UKR_external_intervention: "Внешнее вмешательство"
 UKR_external_intervention_desc: "Пора перестать проводить мирную политику — мы будем активно влиять на мировые процессы."
 UKR_resolve_the_moldovan_issue: "Решить Молдавский вопрос"
 UKR_resolve_the_moldovan_issue_desc: "Молдова и Приднестровье уже давно стоят у нас на пути, их независимость — это просто ошибка, мы это исправим."
 UKR_dig_up_potatoes: "Выкопать картошку"
 UKR_dig_up_potatoes_desc: "Беларусь может быть использована нашими врагами как с запада, так и с востока для нанесения удара по нам. Лучший способ защитить себя — нанести удар первым!"
 UKR_to_recall_the_volhynia_massacre: "Волынский опыт"
 UKR_to_recall_the_volhynia_massacre_desc: "Мы вновь столкнулись с поляками и вынуждены снова дать им отпор. Пришло время нашей стране наконец покончить с польской угрозой."
 UKR_secretly_sending_militants_to_kuban: "Поднять восстание в Крыму"
 UKR_secretly_sending_militants_to_kuban_desc: "Тот факт, что Россия отняла у нас Крым, является главной исторической несправедливостью столетия. Слабость наших властей оказалась ужасающей и постыдной. Мы исправим это."
 UKR_agitation_of_radical_ukrainians_in_kuban: "Поднять восстание на Кубани"
 UKR_agitation_of_radical_ukrainians_in_kuban_desc: "Кубань — это наша земля и всегда ею останется. Мы постараемся отнять её у России."
 UKR_liberate_green_klin: "«Освободить» Зелёный Клин"
 UKR_liberate_green_klin_desc: "Пришло время «освободить» наших братьев с Дальнего Востока от гнета русского медведя."
 UKR_shoot_a_russian_bear: "Застрелить русского медведя"
 UKR_shoot_a_russian_bear_desc: "Русский медведь станет нашим ковриком!"
 UKR_declare_a_great_ukraine: "Провозгласить Великую Украину"
 UKR_declare_a_great_ukraine_desc: "Украина стала великой страной и дала об этом знать всему миру."
 UKR_upa: "УПА"
 UKR_upa_desc: "За обеспечение гражданской и внутренней обороны страны будет отвечать восстановленная Украинская повстанческая армия."
 UKR_new_orders_of_formation_of_upa_groups: "Новые приказы о формировании отрядов УПА"
 UKR_new_orders_of_formation_of_upa_groups_desc: "Мы учтём опыт УПА, накопленный во время Второй мировой войны, и создадим новые бригады, учитывая допущенные ошибки."
 UKR_partisan_units: "Партизанские отряды"
 UKR_partisan_units_desc: "По всей стране будут созданы партизанские отряды УПА, чтобы в будущем оказывать активное сопротивление врагам."
 UKR_partisanship_as_an_ideology: "Партизанство как идеология"
 UKR_partisanship_as_an_ideology_desc: "Наши партизаны должны пройти идеологическую подготовку, чтобы активно сопротивляться врагу."
 UKR_make_military_exercises_in_the_country_compulsory_for_all: "Сделать военные учения в стране обязательными для всех"
 UKR_make_military_exercises_in_the_country_compulsory_for_all_desc: "Каждый украинец должен уметь защищать свою страну. Обучение обычных граждан специалистами УПА укрепит боевой потенциал нашей страны."
 UKR_to_arm_every_person_in_the_country: "Выдать оружие населению"
 UKR_to_arm_every_person_in_the_country_desc: "Женщины, дети, мужчины, пожилые люди — каждый должен иметь возможность носить оружие и стрелять из него по врагу."
 UKR_form_an_alliance_of_right_wing_youth: "Создать альянс правой молодежи"
 UKR_form_an_alliance_of_right_wing_youth_desc: "Прежде чем вооружать украинскую молодежь, необходимо ее организовать. Объедините разрозненные правые молодежные движения в единый альянс, преданный националистическому делу."
 UKR_ukraine_is_a_land_of_partisans: "Украина — страна партизан"
 UKR_ukraine_is_a_land_of_partisans_desc: "Если враг вторгнется к нам, в каждой деревне и в каждом городе найдутся партизаны. Мы встретим его всей мощью украинского народа."
 UKR_nationalists_right_sector_desc: "Включение ополченцев «Правого сектора» в государственные структуры способствует укреплению националистических настроений и политического авторитета."
 UKR_nationalists_una_unso_desc: "Националистическое движение УНА-УНСО способствует мобилизации добровольцев и повышает боеспособность нерегулярных вооружённых формирований."
 UKR_nationalists_upa_desc: "Использование исторических тактик сопротивления УПА позволяет повысить эффективность снабжения и укрепить оборону ключевых территорий."
 UKR_nationalists_cleane_ukraine_desc: "Масштабная кампания по укреплению национального единства усиливает сопротивление иностранному влиянию и укрепляет решимость продолжать борьбу."
 UKR_nationalists_trizub_desc: "Организация «Тризуб» мобилизует националистические настроения и стремление к защите родины."
 UKR_nabu: "Национальное антикоррупционное бюро Украины"
 UKR_nabu_desc: "Новое антикоррупционное бюро призвано усилить борьбу с коррумпированными чиновниками на всех уровнях."
 UKR_poroh_deccomuniz: "Президентство Порошенко"
 UKR_poroh_deccomuniz_desc: "Порошенко — личность неоднозначная, но его стремление сделать Украину сильной перед лицом врага заслуживает уважения народа."
 UKR_west_investors_desc: "Этот рынок привлек западных иностранных инвесторов, что способствовало укреплению демократических институтов и стало движущей силой экономического роста и стабильности."
 UKR_operation_wall_desc: "В этот период мобилизации темпы строительства оборонительных укреплений резко ускоряются."
 UKR_ato_supports_desc: "Поддержка ветеранов антитеррористической операции укрепляет националистические настроения и подчеркивает нашу приверженность тем, кто служил."
 UKR_health_supports_desc: "Увеличение финансирования здравоохранения способствует повышению благосостояния населения и укрепляет поддержку демократического управления."
 UKR_pivdenmash_idea_desc: "Государственное предприятие «Южмаш» специализируется на производстве баллистических и ядерных ракет с повышенной эффективностью."
 UKR_kyvarmor_idea_desc: "Киевский бронезавод специализируется на производстве современных шасси средних танков и их амфибийных модификаций."
 UKR_tsnap_idea_desc: "ЦНАП — государственное административное агентство штата, которое упрощает бюрократию центрального правительства и снижает административные издержки."
 UKR_concern_desc: "Консолидация разрозненных предприятий военной промышленности в рамках Харьковского военно-промышленного комплекса способствует повышению эффективности производства танков и бронетехники."
 UKR_zaz_idea_desc: "Автомобильное производство компании «ЗАЗ» было модернизировано, что позволило повысить надежность транспортных средств и снизить производственные затраты на выпуск гражданских и военных транспортных средств."
 UKR_kraz_idea_desc: "Производство автомобилей «КрАЗ» обеспечивает выпуск грузовиков и бронированных машин на отечественных заводах, что позволяет снизить зависимость от импорта."
 UKR_motorsich_idea_desc: "Государственная поддержка производства авиационных двигателей «Мотор Сич» позволяет снизить затраты на изготовление тяжелых самолетов и вертолетов."
 UKR_interlegion_decision_category: "Международный легион территориальной обороны"
 UKR_interlegion_decision_category_desc: "Международный легион территориальной обороны Украины — это проект Правительства Украины, направленный на привлечение иностранцев для формирования добровольческих подразделений в рамках системы территориальной обороны Вооруженных сил Украины."
 UKR_vetrenko_surrort_nationalism_desc: "Националистическое движение мобилизовало население, подчеркивая украинскую идентичность и культурный суверенитет в противовес мнимым внешним угрозам."
 UKR_vetrenko_pioneria_desc: "Была создана националистическая молодежная организация с целью содействия патриотическому воспитанию и повышения политической осведомленности молодого поколения."
 UKR_vetrenko_health_free_idea_desc: "По всей стране было введено бесплатное медицинское обслуживание, что способствовало росту численности населения, но привело к напряженной ситуации в государственных финансах из-за увеличения расходов на здравоохранение."
 UKR_economic_reforms_modifier: "Экономическое развитие Украины"
 UKR_economic_reforms_modifier_desc: "Десятилетия олигархического застоя превратили экономику Украины в мозаику из советских пережитков и теневых рынков. Постоянная программа реформ постепенно распутывает бюрократические узлы, привлекает иностранные инвестиции и модернизирует нашу устаревшую промышленность. Каждый шаг вперед измеряется количеством возобновивших работу заводов и выполненных контрактов."
 UKR_military_reforms_modifier: "Развитие вооруженных сил Украины"
 UKR_military_reforms_modifier_desc: "Вооружённые силы Украины вступили в новое столетие, испытывая острую нехватку финансирования, находясь в состоянии деморализации и вооружённые ржавеющими советскими запасами. Реформа — это не только новые винтовки, но и профессиональные офицеры, реалистичная подготовка и доктрина, разработанная с учётом тех войн, с которыми нам действительно приходится сталкиваться. В результате появится более компактная и боеспособная армия, верная государству, а не какому-либо покровителю."
 UKR_kuchma_shortcut: "Кучма"
 UKR_kuchma_second_terms: "Второй срок Кучмы"
 UKR_kuchma_second_terms_desc: "Президент Кучма уже второй срок стоит у руля нашей страны; возможно, на этот раз его не переизберут, а может, он ввергнет нашу страну в хаос. Поживем — увидим."
 UKR_dissolve_rada: "Распустить Раду"
 UKR_restore_rada: "Восстановить Раду"
 ukr_industry_points_cost_35_blocked: "Требуется 35 отраслевых баллов."
 ukr_industry_points_cost_50_blocked: "Требуется 50 отраслевых баллов."
 ukr_industry_points_cost_75_blocked: "Требуется 75 отраслевых баллов."
 UKR_wind_energy: "Программа развития ветроэнергетики завершена."
 UKR_solar_energy: "Программа развития солнечной энергетики завершена."
 UKR_finance_vv_tt: "Требуется, чтобы внутренние войска оставались в своем восстановленном составе, не были расформированы или включены в состав других родов войск."
 UKR_unite_with_russian_genshtab_tt: "Требуется, чтобы программа военных реформ не находилась на второй стадии."
 UKR_nato_aid_donor_one: "[FROM.GetName] оказал поддержку нашим военным усилиям."
 UKR_nato_aid_donor_many: "§Y[?UKR.UKR_aid_report_donors^num]§! союзные правительства, возглавляемые [FROM.GetName], оказали поддержку нашим военным усилиям."
 UKR_aid_report_money_tt: "[THIS.GetFlag][THIS.GetAdjective] §YTreasury§!: $$[?UKR_aid_report_money|+] млрд"
 ukraine_revolution.30.t: "Верховный Совет Крыма"
 ukraine_revolution.30.d: "Верховный Совет Крыма испытывает пределы власти Киева. Следует ли разрешить референдум о статусе полуострова или распустить совет?"
 ukraine_revolution.30.a: "Разрешить проведение референдума"
 ukraine_revolution.30.b: "Распустить совет"
 ukraine_revolution.31.t: "Москва высказывает своё мнение"
 ukraine_revolution.31.d: "Киев поднял вопрос о статусе Крыма. Москва может либо принять соглашение об автономии Украины, либо поддержать собственный референдум."
 ukraine_revolution.31.a: "Принять автономию Украины"
 ukraine_revolution.31.b: "Поддержать референдум"
 ukraine_revolution.32.t: "Крымский референдум"
 ukraine_revolution.32.d: "Референдум передал будущее Крыма в руки Москвы. Мы должны решить, признавать ли российский протекторат или напрямую ассимилировать полуостров."
 ukraine_revolution.32.a: "Создать российский протекторат"
 ukraine_revolution.32.b: "Аннексировать Крым напрямую"
 ukraine_revolution.33.t: "Москва отвечает"
 ukraine_revolution.33.d: "Киев распустил Крымский совет. Москве предстоит решить, ответить ли давлением или отступить."
 ukraine_revolution.33.a: "Примените дипломатическое давление"
 ukraine_revolution.33.b: "Отступите"
 ukraine_revolution.40.t: "Политическое будущее Донецка"
 ukraine_revolution.40.d: "Донецкая область требует прямого участия в управлении своим правительством. Киеву предстоит выбрать между урегулированием путем переговоров, репрессиями или созданием новой автономной республики."
 ukraine_revolution.40.a: "Переговоры о местной автономии"
 ukraine_revolution.40.b: "Распустить Совет"
 ukraine_revolution.40.c: "Допустить создание Донецкой Республики"
 ukraine_revolution.40.e: "Пусть Донбасс поднимет оружие!"
 ukraine_revolution.41.t: "Политическое будущее Луганска"
 ukraine_revolution.41.d: "Луганские советы следуют примеру Донецка. Их требования могут быть урегулированы путем компромисса, силы или признания республики."
 ukraine_revolution.41.a: "Переговоры о местной автономии"
 ukraine_revolution.41.b: "Подавить движение"
 ukraine_revolution.41.c: "Допустить создание Луганской Республики"
 ukraine_revolution.42.t: "Политическое будущее Крыма"
 ukraine_revolution.42.d: "Статус Крыма вновь оспаривается, в то время как страна и без того находится в напряженном состоянии. Киев может признать местную автономию, распустить совет или уступить место осторожному процессу по Крыму."
 ukraine_revolution.42.a: "Переговоры о местной автономии"
 ukraine_revolution.42.b: "Распустить Совет"
 ukraine_revolution.42.c: "Воспользуйтесь Крымским процессом"
 ukraine_revolution.43.t: "Харьковский совет"
 ukraine_revolution.43.d: "Харьковские региональные политики проверяют пределы власти Киева. Правительству предстоит решить, вести ли переговоры, подавить совет или смириться с местной администрацией."
 ukraine_revolution.43.a: "Переговоры о местной автономии"
 ukraine_revolution.43.b: "Подавить Совет"
 ukraine_revolution.43.c: "Терпимость к местной администрации"
 ukraine_revolution.44.t: "Запорожский совет"
 ukraine_revolution.44.d: "Запорожье требует гарантий для своих местных институтов. Компромисс может успокоить регион, в то время как репрессии могут усугубить кризис."
 ukraine_revolution.44.a: "Переговоры о местной автономии"
 ukraine_revolution.44.b: "Подавить Совет"
 ukraine_revolution.44.c: "Терпимость к местной администрации"
 ukraine_revolution.45.t: "Южные советы"
 ukraine_revolution.45.d: "Херсон и Николаев организуются вокруг требований о местном самоуправлении. Их советы могут быть вовлечены в процесс урегулирования споров или же подвергнуты открытой оппозиции."
 ukraine_revolution.45.a: "Переговоры о местной автономии"
 ukraine_revolution.45.b: "Подавить деятельность советов"
 ukraine_revolution.45.c: "Терпеливо относиться к местным администрациям"
 ukraine_revolution.46.t: "Политическое будущее Одессы"
 ukraine_revolution.46.d: "Одесский совет рассматривает вопрос об автономии в противовес прямому разрыву с Киевом. Существующая Одесская республика может быть создана, если правительство потеряет контроль над ней."
 ukraine_revolution.46.a: "Переговоры о местной автономии"
 ukraine_revolution.46.b: "Подавить Совет"
 ukraine_revolution.46.c: "Допустить создание Одесской Республики"
 ukraine_revolution.47.t: "Политическое будущее Днепра"
 ukraine_revolution.47.d: "Промышленный регион Днепра требует права голоса в новом политическом порядке. Киев может вести переговоры, подавить совет или позволить возникнуть существующей Днепровской республике."
 ukraine_revolution.47.a: "Переговоры о местной автономии"
 ukraine_revolution.47.b: "Подавить Совет"
 ukraine_revolution.47.c: "Допустить создание Днепровской республики"
 ukraine_revolution.48.t: "Совет Сумы"
 ukraine_revolution.48.d: "Сумские власти требуют гарантий против решений, принятых в Киеве. Переговорный совет — наименее деструктивный путь, но подавление и признание остаются возможными."
 ukraine_revolution.48.a: "Переговоры о местной автономии"
 ukraine_revolution.48.b: "Подавить Совет"
 ukraine_revolution.48.c: "Терпимость к местной администрации"
 ukraine_revolution.49.t: "Будущее Новороссии"
 ukraine_revolution.49.d: "Участвующие республики объединились в Новороссию. Киеву предстоит решить, признать ли её автономным субъектом Украины, принять независимую конфедерацию или бороться за её территорию."
 ukraine_revolution.49.a: "Признание субъекта автономного государства Украины"
 ukraine_revolution.49.b: "Принять независимую конфедерацию"
 ukraine_revolution.49.c: "Борьба за территорию"
 ukraine_revolution.50.t: "Конгресс, который запомнился"
 ukraine_revolution.50.d: "Северодонецкий конгресс стал частью политической памяти региона. Его требование иметь право голоса при принятии решений в Киеве до сих пор формирует институты республики."
 ukraine_revolution.50.a: "Запечатлейте наследие"
 ukraine_revolution.51.t: "Советы становятся институтами"
 ukraine_revolution.51.d: "Волна региональных советов подошла к концу. Некоторые советы были изолированы, другие превратились в республики, но каждый из них оставил неизгладимый след в постмайданном урегулировании."
 ukraine_revolution.51.a: "Новая политическая карта"
 ukraine_revolution.52.t: "Республика обретает форму"
 ukraine_revolution.52.d: "Первая региональная республика сформировала собственное правительство. Ее будущее будет зависеть от того, сможет ли местная администрация пережить кризис, который ее породил."
 ukraine_revolution.52.a: "Не вешайте трубку"
 ukraine_revolution.53.t: "Длинная тень Крыма"
 ukraine_revolution.53.d: "Урегулирование Крымского конфликта 2004 года наконец-то зафиксировано в политической иерархии. Это решение не положило конец всем спорам, но оно придало статусу полуострова историю, которую нельзя игнорировать."
 ukraine_revolution.53.a: "Помните о соглашении"
 ukraine_revolution.54.t: "Новороссийское поселение"
 ukraine_revolution.54.d: "Новороссийское урегулирование изменило баланс сил между Киевом, региональными республиками и Москвой. Новое устройство будет оцениваться не только по тому, что оно заявляет, но и по тому, что оно сохраняет."
 ukraine_revolution.54.a: "Сохраните запись"
 ukraine_revolution.55.t: "Свободная территория"
 ukraine_revolution.55.d: "Анархистские боевики в руководстве нового государства утверждают, что Новороссия — это заимствованное название, ничего не значащее для жителей Улиаполе. Они хотят возродить старый флаг Нестора Махно и назвать эту землю тем, чем она является на самом деле: свободной территорией."
 ukraine_revolution.55.a: "Примите Свободную территорию под свой контроль"
 ukraine_revolution.55.b: "Сохраните название Новороссия."
 ukraine_regions.13.t: "Харьковский пакт"
 ukraine_regions.13.d: "Россия предлагает продлить аренду Севастополя Черноморским флотом в обмен на скидку на природный газ."
 ukraine_regions.13.a: "Подписать пакт"
 ukraine_regions.13.b: "Отказаться от пакта"
 ukraine_regions.14.t: "Дело Тимошенко"
 ukraine_regions.14.d: "Бывший премьер-министр Юлия Тимошенко находится под следствием в связи с газовой сделкой с Россией 2009 года. Прокуратура требует ее ареста."
 ukraine_regions.14.a: "Арестуйте её"
 ukraine_regions.14.b: "Оставьте её в покое."
 ukraine_regions.15.t: "Закон о региональных языках"
 ukraine_regions.15.d: "В Раде одобрен законопроект о предоставлении региональному статусу русскому и другим языкам национальных меньшинств. Его принятие порадует юго-восток страны и вызовет гнев националистов на западе."
 ukraine_regions.15.a: "Принять закон"
 ukraine_regions.15.b: "Отвергните закон"
 ukraine_our_ukraine.10.t: "Бухарестский саммит"
 ukraine_our_ukraine.10.d: "На саммите НАТО в Бухаресте Германия и Франция заблокировали План действий по членству Украины. Двери альянса остаются открытыми лишь формально, но путь к вступлению в него пока не определен."
 ukraine_our_ukraine.10.a: "Продолжайте налаживать отношения с НАТО."
 ukraine_our_ukraine.10.b: "Осудить отказ"
 UKR_hur_can_attack: "Правительство поддерживает деятельность HUR, реформа HUR завершена, и создано как минимум одно подразделение HUR."
 UKR_YUSHENKO_PATH: "Путь Ющенко, выбранный в соответствии с правилами игры."
 UKR_YANUK_PATH: "Путь Януковича, выбранный в соответствии с правилами игры."
 UKR_political_tension_tt: "Политическая напряженность изменится к §Y[?tension_change|0]§! (Текущая политическая напряженность: §Y[?UKR.UKR_political_tension|0]§!)."
 UKR_seuar_balance: "Борьба за автономию SEUAR"
 UKR_seuar_balance_desc: "Борьба между киевскими институтами и движением за автономию Юго-Восточной Украины определит, останется ли кризис 2004 года политическим или приведет к созданию новой республики."
 UKR_seuar_kyiv_control: "Киевский контроль"
 UKR_seuar_autonomy_side: "Движение за автономию"
 UKR_seuar_negotiated_center: "Тупиковая ситуация, достигнутая путем переговоров"
 UKR_seuar_negotiated_center_desc: "Ни Киев, ни движение за автономию не добились решающего преимущества."
 UKR_seuar_kyiv_advantage: "Киев набирает обороты"
 UKR_seuar_kyiv_advantage_desc: "Контрпротесты и давление со стороны государства начинают сдерживать движение за автономию."
 UKR_seuar_kyiv_dominance: "Киевское господство"
 UKR_seuar_kyiv_dominance_desc: "Движение за автономию находится на грани краха под скоординированным давлением государства."
 UKR_seuar_autonomy_advantage: "Автономия набирает обороты"
 UKR_seuar_autonomy_advantage_desc: "Движение за автономию организуется быстрее, чем Киев может его сдержать."
 UKR_seuar_autonomy_dominance: "Автономное господство"
 UKR_seuar_autonomy_dominance_desc: "Движение за автономию пользуется достаточной поддержкой, чтобы потребовать создания формальной автономной республики."
 UKR_separatist_crisis_category: "Сепаратистский кризис"
 UKR_separatist_crisis_category_desc: "[UKR.GetFlag]§YУкраина§! Необходимо сдерживать региональные советы и сепаратистские движения, не превращая каждый местный спор в войну."
 UKR_separatist_fund_negotiations: "Финансирование региональных переговоров"
 UKR_separatist_fund_negotiations_desc: "Прежде чем советы превратятся в республики, следует потратить средства из казны на местных посредников и уступки."
 UKR_separatist_internal_security: "Внедрить внутреннюю безопасность"
 UKR_separatist_internal_security_desc: "Использовать силы внутренней безопасности для удержания правительственных зданий и сдерживания организаторов сепаратистских движений."
 UKR_separatist_recognize_councils: "Признать автономные советы"
 UKR_separatist_recognize_councils_desc: "Признание авторитета совета в обмен на соблюдение требований и прекращение непосредственного конфликта."
 UKR_novorossiya_form: "Консолидировать Новороссию"
 UKR_novorossiya_form_desc: "Объединить участвующие республики и поддерживаемые ими советы под существующим названием «Новороссия»."
 UKR_novorossiya_recognize: "Признать автономию Новороссии"
 UKR_novorossiya_recognize_desc: "Примите Новороссию в качестве автономного субъекта Украины, пока она сохраняет мир и контролирует территорию."
 UKR_separatist_crisis_active_tt: "Волна региональных республик 2014 года активна."
 UKR_separatist_treasury_tt: "Для осуществления этой меры в казначействе должно быть достаточно средств."
 SOV_backed_seuar: "Россия поддержала движение SEUAR."
 UKR_crimea_2004_resolution: "Начался процесс определения статуса Крыма, начатый в 2004 году."
 UKR_crimea_2004_pending: "Результаты Крымского референдума 2004 года пока не определены."
 UKR_crimea_2004_departed: "Крым вышел из состава Украины в 2004 году."
 UKR_orange_2004_started: "Начался политический кризис 2004 года."
 UKR_orange_2004_resolved: "Политический кризис 2004 года урегулирован."
 CRM_2004_content_unlocked: "Крымская администрация 2004 года продолжает свою деятельность."
 UKR_provisional_republic_focus_setup: "Временная республиканская администрация ведет активную деятельность."
 UKR_crimea_2004_status: "Урегулировать статус Крыма"
 UKR_crimea_2004_status_desc: "Верховный Совет Крыма бросает вызов Киеву, в то время как Москва поддерживает движение за автономию юго-востока страны. Необходимо решить, как поступить с Крымом, прежде чем кризис усугубится."
 SOV_seuar_intervention_category: "Поддержите Юго-Восток"
 SOV_seuar_intervention_category_desc: "Москва может повлиять на борьбу за автономию на юго-востоке Украины, рискуя превратить политический кризис в войну."
 UKR_seuar_counter_protests: "Поддержите местные контрпротесты"
 UKR_seuar_counter_protests_desc: "Поддержите местные демонстрации, которые отвергают движение за автономию и стремятся восстановить влияние Киева."
 UKR_seuar_internal_troops: "Развернуть внутренние войска"
 UKR_seuar_internal_troops_desc: "Использовать войска Министерства внутренних дел для обеспечения безопасности общественных зданий и оказания давления на движение за автономию."
 UKR_seuar_special_operations: "Проведение операций СБУ-ХУР"
 UKR_seuar_special_operations_desc: "Использовать разведку и специальные операции для подрыва движения за автономию. Это повышает риск российского вмешательства."
 UKR_seuar_reintegrate: "Предложить конституционный компромисс"
 UKR_seuar_reintegrate_desc: "Предложите SEUAR конституционный компромисс и реинтегрируйте его в состав Украины."
 UKR_seuar_force: "Навязывание вопроса об автономии"
 UKR_seuar_force_desc: "Прекратить действие соглашения об автономии силой. Это может спровоцировать пограничную войну и вмешательство России."
 SOV_seuar_fund_movement: "Финансируйте движение за автономию"
 SOV_seuar_fund_movement_desc: "Оказывать политическую и финансовую поддержку организаторам SEUAR."
 SOV_seuar_suborn_units: "Подстрекательство местных отрядов"
 SOV_seuar_suborn_units_desc: "Побуждайте местные украинские подразделения блокировать приказы или вставать на сторону движения за автономию."
 SOV_seuar_send_volunteers: "Отправьте волонтеров"
 SOV_seuar_send_volunteers_desc: "Направьте добровольцев из приграничных регионов для защиты движения за автономию."
 UKR_seuar_active_tt: "Борьба за автономию SEUAR продолжается."
 UKR_seuar_treasury_tt: "Для осуществления этой меры в казначействе должно быть достаточно средств."
 SOV_seuar_treasury_tt: "Для осуществления этой меры в казначействе должно быть достаточно средств."
 UKR_pro_russian_support_30_tt: "Россия удерживает как минимум §Y30%§! влияние на Украину"
 UKR_seuar_counter_protests_tt: "Перемещает борьбу за автономию в сторону Киева (§R0.10§!) и снижает стабильность."
 UKR_seuar_internal_troops_tt: "Это стоит §R3§! казны, сдвигает борьбу в сторону Киева на §R0.15§! и стоит стабильности."
 UKR_seuar_special_operations_tt: "Это стоит §R5§! казны, сдвигает борьбу в сторону Киева на §R0.08§! и стоит стабильности."
 UKR_seuar_reintegration_tt: "SEUAR будет реинтегрирован. Украина получит российское влияние, а напряжённость снизится на §G15§!."
 UKR_seuar_force_tt: "SEUAR получит независимость, и начнётся ограниченная пограничная война."
 UKR_seuar_intervention_risk_tt: "Вмешательство России станет возможным, если война продолжится."
 UKR_seuar_no_intervention_tt: "Москва может остаться вне конфликта."
 SOV_seuar_fund_movement_tt: "Это обходится казначейству в §R5§! и смещает борьбу за автономию на §G0.10§!."
 SOV_seuar_suborn_units_tt: "Это обходится казне в §R4§!, смещает борьбу за автономию на §G0.12§! и усиливает эскалацию."
 SOV_seuar_send_volunteers_tt: "Это обходится казне в §R8§!, смещает борьбу за автономию на §G0.18§! и усиливает эскалацию."
 UKR_prp_provisional_administration: "Создать временную администрацию"
 UKR_prp_provisional_administration_desc: "Новой республике необходима дееспособная администрация, прежде чем кризис перерастет в необратимый раскол."
 UKR_prp_local_security: "Организация местной безопасности"
 UKR_prp_local_security_desc: "Местные комитеты безопасности могут снизить уровень беспорядков, не превращая каждый политический спор в войну."
 UKR_prp_volunteer_forces: "Создание добровольческих сил"
 UKR_prp_volunteer_forces_desc: "Добровольцы будут защищать республику, в то время как ее институты и регулярные войска останутся непроверенными."
 UKR_prp_utilities_repair: "Ремонт инженерных сетей и дорог"
 UKR_prp_utilities_repair_desc: "Восстановление транспортной и коммунальной сети позволит восстановить связь между населенными пунктами, зависящими от временного правительства."
 UKR_prp_emergency_economy: "Стабилизация экономики в условиях чрезвычайной ситуации"
 UKR_prp_emergency_economy_desc: "Небольшая промышленная база и аварийное производство могут обеспечить республику необходимыми ресурсами в течение переходного периода."
 UKR_prp_constitutional_choice: "Выберите конституционное соглашение"
 UKR_prp_constitutional_choice_desc: "Временные институты должны решить, являются ли они мостом к Киеву, партнером Москвы или основой отдельного государства."
 UKR_prp_negotiate_kyiv: "Вести переговоры с Киевом"
 UKR_prp_negotiate_kyiv_desc: "Прямое урегулирование спора с Киевом может защитить местные институты, избежав при этом новой вооруженной конфронтации."
 UKR_prp_seek_moscow_support: "Обратитесь за поддержкой к Москве."
 UKR_prp_seek_moscow_support_desc: "Москва может оказать дипломатическую поддержку, но принятие этой поддержки определит будущую политическую ориентацию республики."
 UKR_prp_independent_republic: "Провозгласить независимую республику"
 UKR_prp_independent_republic_desc: "Временное правительство может прекратить свой подчиненный статус и принять на себя риски самостоятельной деятельности."
 UKR_prp_regional_union: "Создать региональный союз"
 UKR_prp_regional_union_desc: "Лучше использовать существующий тег «Новороссия», а не создавать новый, конкурирующий тег."
 DRP_pivdenmash_rearmament: "Перезапустить Pivdenmash"
 DRP_pivdenmash_rearmament_desc: "Старый ракетно-механический завод «Южмаш» всё ещё способен выпускать оружие, если кто-то захочет возобновить его работу."
 DRP_industrial_mobilization: "Мобилизация промышленности Днепра"
 DRP_industrial_mobilization_desc: "Промышленную базу Днепра, сформировавшуюся в советскую эпоху, можно перенаправить на нужды республики, ценой сокращения оставшегося гражданского производства."
 DRP_dnieper_logistics: "Надежная логистика по реке Днепр"
 DRP_dnieper_logistics_desc: "Река всегда была основным каналом для перевозки товаров в этом регионе. Восстановление причалов и подъездных дорог позволяет держать этот поток под контролем республики."
 DRP_kolomoisky_purge: "Очистить сеть Коломойского"
 DRP_kolomoisky_purge_desc: "Патронажная сеть олигархов по-прежнему пронизывает местную администрацию и бизнес. Искоренение этой сети откроет путь для собственных деятелей республики."
 DRP_state_security_consolidation: "Укрепить государственную безопасность"
 DRP_state_security_consolidation_desc: "Давно назрела необходимость в создании надлежащей службы безопасности, подотчетной республике, а не какой-либо фракции, контролирующей тот или иной район."
 DRP_moscow_alignment: "Присоединиться к Москве"
 DRP_moscow_alignment_desc: "Официальное установление военных и экономических связей с Москвой означает отказ от независимости действий в пользу покровителя, который не допустит падения республики."
 UKR_seuar_autonomy_movement: "Движение за автономию SEUAR"
 UKR_seuar_autonomy_movement_desc: "Движение за автономию юго-востока оспаривает власть Киева. Его будущее зависит от баланса между местными организаторами и давлением со стороны государства."
 UKR_western_crisis_idea: "Правительство Западной Украины"
 UKR_western_crisis_idea_desc: "Западные области отказываются признавать сфальсифицированные выборы и провозгласили собственное правительство. Противостояние парализует национальную политику до тех пор, пока Киев не урегулирует западный вопрос."
 UKR_constitutional_compromise_idea: "Конституционный компромисс"
 UKR_constitutional_compromise_idea_desc: "Конституционное соглашение, положившее конец кризису автономии, передает реальную власть регионам. Оно успокаивает юго-восток страны за счет ослабления центрального правительства."
 ukraine_kuchma.14.t: "Протесты на юго-востоке"
 ukraine_kuchma.14.d: "После выборов активисты юго-востока страны отвергают киевское урегулирование и организуют «Голубой Майдан». Движение грозит перерасти из избирательного кризиса в региональный."
 ukraine_kuchma.14.a: "Ситуация ухудшается"
 ukraine_kuchma.15.t: "Голубой Майдан в Украине"
 ukraine_kuchma.15.d: "«Синий Майдан» призывает Москву признать его требование региональной автономии. Кремль должен решить, следует ли оказывать движению политическую поддержку."
 ukraine_kuchma.15.a: "Поддержите движение за автономию!"
 ukraine_kuchma.15.b: "Не вмешивайтесь"
 ukraine_kuchma.16.t: "Правительство Юго-Востока"
 ukraine_kuchma.16.d: "«Синий Майдан» сформировал координационное правительство и заявляет, что Киев больше не представляет интересы юго-востока страны. Местные чиновники требуют формального политического урегулирования."
 ukraine_kuchma.16.a: "Подготовьте ответ"
 ukraine_kuchma.17.t: "Голубая революция"
 ukraine_kuchma.17.d: "Делегаты «Синего Майдана» провозгласили проект автономии Юго-Восточной Украины. Теперь движение добивается проведения съезда, а не немедленного провозглашения независимости."
 ukraine_kuchma.17.a: "Конгресс должен принять решение."
 ukraine_kuchma.18.t: "Протесты в Галиции"
 ukraine_kuchma.18.d: "Спорные выборы вывели западных активистов на улицы. Столкновения с полицией грозят перерасти президентский кризис в более широкое конституционное противостояние."
 ukraine_kuchma.18.a: "Ситуация ухудшается"
 ukraine_kuchma.19.t: "Красный Майдан в Украине"
 ukraine_kuchma.19.d: "Галицийские активисты требуют честных выборов и спрашивают Польшу, поддержит ли она их политическую кампанию. Иностранная поддержка может усугубить кризис."
 ukraine_kuchma.19.a: "Поддержите демократические силы!"
 ukraine_kuchma.19.b: "Не вмешивайтесь"
 ukraine_kuchma.20.t: "Правительство Западной Украины"
 ukraine_kuchma.20.d: "Западные активисты сформировали политический координационный комитет и отказываются принять киевское избирательное соглашение. Конфронтация носит политический характер, но управлять страной становится все сложнее."
 ukraine_kuchma.20.a: "Вызовите полицию"
 ukraine_kuchma.21.t: "Красная революция"
 ukraine_kuchma.21.d: "Красный Майдан объявляет о начале кампании сопротивления против пророссийского правительства в Киеве. Кризис остается политической борьбой, а не новым государством."
 ukraine_kuchma.21.a: "Сдержать кризис"
 ukraine_revolution.1.t: "Оранжевая революция начинается"
 ukraine_revolution.1.d: "Избирательный кризис достиг критической точки. Если правительство не предпримет никаких действий, протесты распространятся еще до конца года."
 ukraine_revolution.1.a: "Откройте Оранжевый Майдан"
 ukraine_revolution.10.t: "Северодонецкий конгресс"
 ukraine_revolution.10.d: "В Северодонецке собрались делегаты из юго-восточной Украины. Они могут ограничиться проведением исторического конгресса или потребовать формального процесса автономии."
 ukraine_revolution.10.a: "Провести заседание Конгресса"
 ukraine_revolution.10.b: "Запрос на автономию"
 ukraine_revolution.11.t: "Борьба за автономию"
 ukraine_revolution.11.d: "Движение за автономию и Киев на протяжении нескольких месяцев борются за контроль над юго-востоком страны. Теперь от этого зависит, будет ли движение подавлено, урегулировано путем переговоров или ему будет предоставлена формальная республика."
 ukraine_revolution.11.a: "Разрешить борьбу"
 ukraine_revolution.12.t: "SEUAR провозглашает автономию"
 ukraine_revolution.12.d: "Юго-восточный конгресс потребовал создания формальной автономной республики. Киеву предстоит решить, признавать ли новую Юго-Восточную Украинскую Автономную Республику."
 ukraine_revolution.12.a: "Признать Республику"
 ukraine_revolution.13.t: "Конституционный компромисс"
 ukraine_revolution.13.d: "Движение за автономию осталось внутри Украины, но его отдельные институты становится трудно поддерживать. Конституционный компромисс мог бы восстановить единое украинское государство."
 ukraine_revolution.13.a: "Реинтегрировать SEUAR"
 ukraine_revolution.14.t: "Перемирие с SEUAR"
 ukraine_revolution.14.d: "Боевые действия между Украиной и SEUAR истощили обе стороны. Прекращение огня оставило бы новую республику независимой, но конфликт может продолжиться."
 ukraine_revolution.14.a: "Согласиться на прекращение огня"
 ukraine_revolution.14.b: "Продолжить войну"
 ukraine_revolution.15.t: "Москва рассматривает возможность вмешательства"
 ukraine_revolution.15.d: "Применение силы Украиной привлекло внимание Москвы к конфликту вокруг SEUAR. Кремлю предстоит решить, вступать ли в войну."
 ukraine_revolution.15.a: "Присоединяйтесь к SEUAR"
 ukraine_revolution.15.b: "Держитесь подальше от войны"
 ukraine_revolution.16.t: "Пограничная война с SEUAR"
 ukraine_revolution.16.d: "Киев отверг соглашение об автономии и приказал своим силам положить конец отдельному статусу SEUAR. Это решение рискует перерасти в войну."
 ukraine_revolution.16.a: "Покончить с автономией"
 ukraine_revolution.17.t: "Западный вопрос"
 ukraine_revolution.17.d: "Самопровозглашенное правительство Западной Украины до сих пор отказывается признать сфальсифицированные выборы. Многомесячное противостояние поставило Киев перед выбором: уступить или применить силу."
 ukraine_revolution.17.a: "Вести переговоры с Западом"
 ukraine_revolution.17.b: "Жесткие меры"
 ukraine_revolution.20.t: "Решение ассоциации"
 ukraine_revolution.20.d: "Соглашение об ассоциации с Европейским союзом готово к политическому решению. Приостановка его действия может привести к массовым протестам, а подписание — отсрочить кризис."
 ukraine_revolution.20.a: "Приостановить действие соглашения"
 ukraine_revolution.20.b: "Подпишите соглашение"
 ukraine_revolution.21.t: "Соглашение пересмотрено"
 ukraine_revolution.21.d: "Спустя несколько месяцев после подписания соглашения об ассоциации политическая напряженность продолжает нарастать. Теперь правительству предстоит столкнуться с последствиями своего выбора."
 ukraine_revolution.21.a: "Примите последствия"
 UKR_seuar_sov_support_tt: "Российское влияние на Украину будет расти, и движение за автономию продолжится."
 UKR_seuar_sov_decline_tt: "Москва не будет поддерживать движение за автономию."
 UKR_western_poland_support_tt: "Влияние Польши на Украину возрастет, и западное политическое движение продолжит свое существование."
 UKR_western_poland_decline_tt: "Польша не намерена присоединяться к западному политическому движению."
 UKR_crimea_2004_permit_tt: "Верховный Совет Крыма организует референдум о статусе. Москва примет решение о своей реакции."
 UKR_crimea_2004_restrain_tt: "Крым останется в составе Украины в качестве автономной республики."
 UKR_crimea_2004_underwrite_tt: "Москва поддержит отделение Крыма от Украины."
 UKR_amber_wars_category: "Янтарные войны"
 UKR_amber_wars_category_desc: "[UKR.GetFlag]§YUkraine§! закрывает глаза на то, как золотоискатели расчищают сосновые леса Волыни в поисках янтаря, в то время как местные чиновники взвешивают вопрос о доле прибыли против затрат на ужесточение мер по борьбе с добычей."
 UKR_amber_crackdown: "Принять жесткие меры против экскаваторщиков"
 UKR_amber_crackdown_desc: "Направить полицию и подразделения Национальной гвардии на янтарные месторождения для очистки незаконных ям, изъятия оборудования и ареста добытчиков. Это не положит конец торговле навсегда, но обеспечит штату некоторое спокойствие и налоговые поступления."
 UKR_amber_tolerate: "Терпите копание"
 UKR_amber_tolerate_desc: "Пусть местные чиновники продолжают получать свою неофициальную долю, а экскаваторщиков оставьте в покое. Деньги перемещаются, но перемещается и недовольство государством, которое появляется только для того, чтобы забрать свою долю."
 ukraine_amber.1.t: "Копачская Республика провозглашает себя"
 ukraine_amber.1.d: "В условиях, когда авторитет государства в Волыни уже подорван войной, группа янтарников и местных диктаторов объявляет янтарные карьеры вокруг Клесива своим собственным делом. Они называют её Копачской Республикой (по украинскому слову, означающему «копатель») и устанавливают блокпост на дороге в Сарны."
 ukraine_amber.1.a: "Запомните это и двигайтесь дальше."
 UKR_amber_resentment: "Беззаконие Эмбер Раш"
 UKR_amber_kopach_truce: "Перемирие копателей"
 ukraine_amber.2.t: "Копачская республика распалась"
 ukraine_amber.2.d: "Самопровозглашённая республика золотоискателей никогда не имела правительства как такового, только контрольно-пропускной пункт и прейскурант. Когда добыча легкодоступного янтаря истощилась, а новизна прошла, сильные мира сего тихо вернулись к добыче без флага."
 ukraine_amber.2.a: "Признано"
 UKR_strategic_industry_chinese_capital_corridor: "Коридор китайского капитала"
 UKR_strategic_industry_chinese_capital_corridor_desc: "Китайский капитал и доступ к рынку являются основой для инвестиций в двигатели и передовые производственные технологии. Коридор обеспечивает масштабность за счет усиления проблем с передачей технологий и управлением."
 UKR_strategic_industry_independent_distributed_industry: "Независимая распределенная отрасль"
 UKR_strategic_industry_independent_distributed_industry_desc: "Сеть отечественных предприятий, ремонтных центров и рассредоточенных мастерских обеспечивает Украине устойчивое производство и быструю адаптацию. Она преуспевает в обеспечении непрерывности производства в военное время, хотя и не может воспроизвести все функции тяжелой промышленности."
 UKR_strategic_industry_renewed_post_soviet_integration: "Возобновление постсоветской интеграции"
 UKR_strategic_industry_renewed_post_soviet_integration_desc: "Возобновление работы восточных цепочек поставок воссоединяет украинские заводы с привычными рынками, комплектующими и стандартами. Возвращается эффективность, а вместе с ней и стратегическое присутствие на рынке."
 UKR_strategic_industry_western_integrated_defense_industry: "Западная интегрированная оборонная промышленность"
 UKR_strategic_industry_western_integrated_defense_industry_desc: "Отечественные фирмы и стратегические государственные предприятия связаны с западными стандартами, инвестициями, сетями ремонта и производственными партнерствами. Интеграция расширяет рынки и доступ к поставкам, одновременно связывая модернизацию с сотрудничеством союзников."
 ukraine_tech.300.a: "Сохраните стратегические объединения."
 ukraine_tech.300.b: "Приватизируйте объединения и пусть рынок сам решит."
 ukraine_tech.300.d: "Независимость оставила Украине Антонов, «Мотор-Сич», «Южмаш» и окружающие их конструкторские бюро, но не полный рынок и сеть поставщиков, которые их поддерживали. Сохранение специалистов и производственных мощностей потребует от государства принятия решений, которые оно едва может себе позволить."
 ukraine_tech.300.t: "Наследство без рынка"
 ukraine_tech.301.a: "Сохраните постсоветскую сеть двигателей."
 ukraine_tech.301.b: "Финансирование независимой экосистемы двигателей"
 ukraine_tech.301.d: "Компания «Ивченко-Прогресс» разрабатывает двигатели, а «Мотор Сич» их производит. Связанный с ним Запорожский комплекс по-прежнему работает за счет унаследованных рынков и поставщиков, что вынуждает выбирать между сохранением этой сети и финансированием создания независимой."
 ukraine_tech.301.t: "Двигатели для исчезнувшей империи"
 ukraine_tech.302.a: "Удвойте усилия в развитии унаследованных сетей."
 ukraine_tech.302.b: "Диверсифицируйте контракты с осторожностью."
 ukraine_tech.302.d: "Российские заказы на двигатели «Мотор-Сич» и самолеты Ан-24 обеспечивают работу заводов, однако та же самая сеть контролирует компоненты, сертификацию и клиентов. Диверсификация сейчас обходится дорого, но зависимость усугубит любой будущий разрыв."
 ukraine_tech.302.t: "Связи, которые объединяют"
 ukraine_tech.303.a: "Полностью разорвать российскую цепочку поставок"
 ukraine_tech.303.b: "Сохраняйте то, что еще работает, через посредников."
 ukraine_tech.303.d: "Политический разрыв разорвал российские промышленные связи, на которых строились компании «Антонов», «Мотор-Сич» и «Южмаш». Непосредственный шок отражает осознание ранее сложившейся ситуации, и оставшимся предприятиям предстоит в условиях давления восстанавливать поставщиков, стандарты и рынки."
 ukraine_tech.303.t: "Разделение"
 ukraine_tech.304.a: "Заблокируйте продажу и сохраните «Мотор Сич» в Украине."
 ukraine_tech.304.b: "Разрешение китайского контроля"
 ukraine_tech.304.d: "Связанные с Китаем инвесторы стремятся получить контроль над «Мотор-Сичем», объединяя в одном споре частную собственность, иностранный капитал, авиационные технологии и национальную безопасность. Заводы «Мотор-Сича» имеют стратегическое значение, но они не являются тем же самым учреждением, что и конструкторское бюро Ивченко-Прогресс."
 ukraine_tech.304.t: "Кому принадлежит компания «Мотор Сич»?"
 ukraine_tech.305.a: "Собственный арсенал, собранный под огнём."
 ukraine_tech.305.b: "Коридор для китайского капитала"
 ukraine_tech.305.c: "Оборонная промышленность, интегрированная с Западом."
 ukraine_tech.305.e: "Возобновление постсоветской интеграции"
 ukraine_tech.305.d: "Четверть века приватизации, раскола, иностранного капитала и полномасштабной войны определили судьбу Антонова, Мотор-Сича и Южмаша, а также то, что пришло им на смену. То, что сохранилось, то, что было построено под огнем, и то, перед кем Украина теперь подотчетна, определяют, чего она может достичь сама."
 ukraine_tech.305.t: "Во что превратилась украинская промышленность"
 UKR_party_regions_inauguration: "Инаугурация Януковича"
 UKR_party_regions_inauguration_desc: "Настало время инаугурации нашего нового президента."
 ukraine_tech.305.f: "Независимая, рассредоточенная отрасль"
 ukraine_tech.306.t: "Горящая Мрия"
 ukraine_tech.306.d: "Несмотря на большие потери, российские войска в первые же часы захватили аэродром Антонова в Гостомеле. Они рассчитывали использовать его как плацдарм и узел снабжения для дальнейшего наступления, но этой цели не достигли: украинские силы нанесли по аэродрому мощные удары.\nВ ходе ожесточённых боёв за Гостомель в своём ангаре сгорел Ан-225 «Мрия» — самый большой из когда-либо построенных самолётов и гордость украинского авиапрома.\nДля Украины это крайне неприятная ситуация. Чтобы не допустить подобных провалов в будущем, нужно задуматься о перемещении промышленности. Производство можно раздробить и перенести на запад, в небольшие цеха и под землю, пожертвовав всей экономией на масштабе, ради которой строились комбинаты. Или же заводы могут продолжать работать там, где стоят."
 ukraine_tech.306.a: "Рассредоточить производство на запад и под землю."
 ukraine_tech.306.b: "Оставьте заводы работать там, где они находятся."
 ukraine_tech.307.t: "Четыре миллиона дронов"
 ukraine_tech.307.d: "Кластер Brave1 превратил гаражные мастерские в конвейер закупок, и теперь Украина производит за месяц больше ударных беспилотников, чем большинство армий. Rheinmetall и Baykar хотят создать совместные предприятия на украинской территории, что принесет капитал, стандарты и заказы НАТО. Государство может вложить все средства в уже имеющуюся у него базу беспилотников и ракет, или обменять часть ее на интеграцию в производство союзников."
 ukraine_tech.307.a: "Профинансируйте создание суверенной базы беспилотников и ракет."
 ukraine_tech.307.b: "Рассмотрим портфели заказов совместных предприятий и партнеров."
 UKR_strategic_industry_wartime_drone_arsenal: "Арсенал беспилотников военного времени"
 UKR_strategic_industry_wartime_drone_arsenal_desc: "Украина производит собственные беспилотники и ракеты в сотнях разрозненных цехов, которые невозможно вывести из строя одним ударом. Производственные мощности находятся внутри страны, разработка занимает недели, и никто не имеет права вето на то, что будет произведено."
 UKR_lahuna_recon_ship_idea_1: "Симферопольский разведывательный корабль"
 UKR_lahuna_recon_ship_idea_1_desc: "Корпус, напоминающий рыбацкую лодку, прислушивается ко всему, что находится за горизонтом."
 UKR_lahuna_recon_ship_idea_2: "Симферопольский разведывательный корабль"
 UKR_lahuna_recon_ship_idea_2_desc: "Корпус, напоминающий рыбацкую лодку, способен подслушивать всё, даже то, что находится за горизонтом."
 UKR_lahuna_recon_ship_idea_3: "Симферопольский разведывательный корабль"
 UKR_lahuna_recon_ship_idea_3_desc: "Специально сконструированный корпус, напоминающий гражданское судно, способный улавливать всё, что находится в пределах горизонта."
 UKR_lahuna_recon_ship_idea_4: "Симферопольский разведывательный корабль"
 UKR_lahuna_recon_ship_idea_4_desc: "Специально сконструированный корпус, внешне напоминающий гражданское судно, способный улавливать всё, даже то, что находится за горизонтом."
 UKR_lahuna_recon_ship: "Сенсорный комплекс класса «Лагуна»"
 UKR_reorganize_navy_category: "Реорганизовать ВМС Украины"
 UKR_reorganize_navy_category_desc: "\n\n\n\n\n\n£UKR_desctext_reorganize_navy\n\n\n\n\n\n\n\n\nРешения в этой категории помогут нам реорганизовать и улучшить наш флот.\nУ нас будет два варианта: модернизация/завершение строительства старых кораблей советской конструкции и доработка концепций новых отечественных проектов.\nОднако некоторые из выбранных нами вариантов могут иметь нежелательные негативные последствия."
 UKR_reorganize_navy_finish_ternopil_construction: "Достроить §Gкорвет «Тернополь» §Yпроекта 1124МУ§!§!"
 UKR_reorganize_navy_finish_ternopil_construction_desc: "\n\n\n\n\n\n£UKR_desctext_ternopil_corvette_for_tooltip\n\n\n\n\n\n\n\n\n§WМы можем выделить часть бюджета, чтобы наконец завершить затянувшееся производство корвета §YU209 «Тернополь»§! проекта 1124МУ.§!"
 UKR_reorganize_navy_choose_future_corvette: "Выбрать основной тип будущего корвета"
 UKR_reorganize_navy_choose_future_corvette_desc: "\n\n\n\n\n\n£UKR_desctext_future_corvette_for_tooltip\n\n\n\n\n\n\n\n\n§WМы можем выбрать предпочтительный размер и тип будущих корветов — рабочих лошадок нашего флота.§!"
 UKR_reorganize_navy_build_project_58250_corvette: "Начать производство корветов §Yпроекта 58250§! §Gтипа «Владимир Великий»§!"
 UKR_reorganize_navy_build_project_58250_corvette_desc: "\n\n\n\n\n\n£UKR_desctext_project_58250_for_tooltip\n\n\n\n\n\n\n\n\n§WКласс §Y«Владимир Великий»§! (или §YПроект 58250§!) — это класс многоцелевых корветов, заказанных ВМФ Украины.\nПредполагалось, что новый корабль будет немного больше корвета, но меньше фрегата.\nНовый проект был разработан в 2008 году Государственным научно-исследовательским и конструкторским судостроительным центром.\nС самого начала программы обсуждалось около 10 таких кораблей.\n\nБлагодаря этому решению мы можем выбрать точное количество корветов для постройки.§!"
 UKR_reorganize_navy_restore_1124: "Проверить §G2 корвета §Yпроекта 1124§!§! на возможность возвращения в строй"
 UKR_reorganize_navy_restore_1124_desc: "\n\n\n\n\n\n£UKR_desctext_project_1124_for_tooltip\n\n\n\n\n\n\n\n\n§WМы можем проверить возможность вернуть в строй два наших корвета проекта 1124.\nВо время раздела Черноморского флота СССР в 1997 году §RМПК-43§! (переименованный в §YU209 «Сумы»§!) и §RМПК-52§! (переименованный в §YU210 «Херсон»§!) были переданы Украине, но из-за саботажа с российской стороны оба корабля находились в небоевой готовности.\nИз-за нехватки средств на необходимое масштабное техническое обслуживание и ремонт оба корабля вскоре после вступления в состав ВМС Украины были списаны.\nПоскольку на металл их ещё не разрезали, мы можем отменить наше первоначальное решение, найти средства и отремонтировать их.\nИмейте в виду, что это решение обойдётся нам дорого и даст нам 2 посредственных корвета вместо возможности вложиться в закупку современных кораблей.§!"
 UKR_reorganize_navy_buy_lithuanian_1124: "Выразить желание купить у Литвы\n§G2 корвета §Yпроекта 1124§!§!"
 UKR_reorganize_navy_buy_lithuanian_1124_desc: "\n\n\n\n\n\n£UKR_desctext_lithuanian_corvettes_for_tooltip\n\n\n\n\n\n\n\n\n§WМы можем направить дипломатический запрос в Литву с просьбой рассмотреть возможность продажи нам двух корветов проекта 1124, обозначенных как §YF11 «Жемайтис»§! и §YF12 «Аукштайтис»§!.\nЭти два корабля были переданы Вооруженным силам Литвы после распада СССР и являются относительно старыми боевыми единицами.\nТем не менее, это корабли того же типа, что уже есть в нашем флоте, поэтому их обучение, техническое обслуживание и боевое применение не будут для нас проблемой.\nОднако покупка этих кораблей уменьшит объем доступных средств для возможного приобретения более новых кораблей.§!"
 UKR_reorganize_navy_maintain_1135: "Содержать §G3 фрегата §Yпроекта 1135§!§!"
 UKR_reorganize_navy_maintain_1135_desc: "\n\n\n\n\n\n£UKR_desctext_project_1135_for_tooltip\n\n\n\n\n\n\n\n\n§WМы можем профинансировать наш ВМФ для надлежащего обслуживания и возвращения в строй 3 наших фрегатов проекта 1135.\nВ июле 1997 года, в соответствии с украинско-российским соглашением о параметрах распределения Черноморского флота, Украине были переданы три патрульных корабля Черноморского флота СССР: §R«Разительный»§! (переименованный в §YU132 «Севастополь»§!), §R«Безукоризненный»§! (переименованный в §YU133 «Николаев»§!) и §R«Беззаветный»§! (переименован в §YU134 «Днепропетровск»§!).\nОднако все три не использовались в качестве боевых частей из-за нехватки средств на ремонт и восстановление технической готовности и вскоре были выведены из эксплуатации.§!"
 UKR_reorganize_navy_maintain_1241: "Содержать §G3 малых корвета §Yпроекта 1241§!§!"
 UKR_reorganize_navy_maintain_1241_desc: "\n\n\n\n\n\n£UKR_desctext_project_1241_for_tooltip\n\n\n\n\n\n\n\n\n§WМы можем профинансировать наш ВМФ для надлежащего технического обслуживания и возвращения в строй 3 наших малых корветов проекта 1241.\nВ 1997 году, во время раздела Черноморского флота, Украина получила 4 корвета проекта 1241 в двух разных ролях: 2 ракетных катера, §YU155 «Никополь»§! и §YU156 «Кременчуг»§!, и 2 малых противолодочных корвета: §YU207 «Ужгород»§! и §YU208 «Хмельницкий»§!. Только ракетный катер §YU155 «Никополь»§! был передан в исправном состоянии, остальные 3 судна были переданы в состоянии небоевой готовности и из-за нехватки средств на ремонт и восстановление технической готовности до сих пор не находятся на активной службе.§!"
 UKR_reorganize_navy_maintain_641_submarine: "Содержать §Gподводную лодку «Запорожье» §Yпроекта 641§!§!"
 UKR_reorganize_navy_maintain_641_submarine_desc: "\n\n\n\n\n\n£UKR_desctext_zaporizhzhia_submarine_for_tooltip\n\n\n\n\n\n\n\n\n§WМы можем профинансировать наш ВМФ для надлежащего технического обслуживания и возвращения в строй нашей единственной подводной лодки — §YU01 «Запорожье»§! проекта 641.\nВ 1997 году, не сумев отремонтировать неиспользуемую подводную лодку, администрация ВМФ России передала её ВМФ Украины во время раздела Черноморского флота.\nК сожалению, батареи подводной лодки окончательно вышли из строя, и для её дальнейшего функционирования потребовалось полное техническое обслуживание и замена батарей.\nМы можем выделить средства на ремонт подводной лодки.§!"
 UKR_reorganize_navy_finish_11451: "Достроить §G2 корвета §Yпроекта 11451§!§!"
 UKR_reorganize_navy_finish_11451_desc: "\n\n\n\n\n\n£UKR_desctext_project_11451_for_tooltip\n\n\n\n\n\n\n\n\n§WПроект 11451 — это серия малых противолодочных кораблей (корветов), построенных на Феодосийском судостроительном заводе «Море» с 1987 года; до распада СССР было построено всего 2 таких корабля.\nКорветы §YU201 «Львов», §! (готовность к строительству около 95%) и §YU203 «Луганск», §! (готовность к строительству около 60%) продолжают находиться на стапеле военно-морской верфи «Море» в Феодосии.\nВ связи с прекращением государственного финансирования завершение строительства кораблей было приостановлено, но теперь, наконец, можно выбрать их дальнейшую судьбу.§!"
 UKR_reorganize_navy_finish_ukrayina: "Достроить крейсер §G«Украина»§!\n§Yпроекта 1164§!"
 UKR_reorganize_navy_finish_ukrayina_desc: "\n\n\n\n\n\n£UKR_desctext_ukrayina_cruiser_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y«Украина»§! — это недостроенный советский крейсер проекта 1164.\nИз-за бюджетных ограничений работы над крейсером были приостановлены в начале 1990-х годов, и корабль остался недостроенным. В 1993 году крейсер был выведен из состава ВМФ России и передан Украине.\nМы можем вложить немного денег в завершение строительства, и тогда мы покажем истинную военно-морскую мощь Украины в Чёрном море!\n\n§GОсобо важный военный проект:§! после его завершения §YВерховная Рада§! будет охотнее одобрять увеличение военного бюджета.§!"
 UKR_reorganize_navy_finish_ternopil_construction_flag: "Завершено принятие решения Достроить §Gкорвет§! §GТернополь§! §Yпроекта 1124МУ§!"
 UKR_reorganize_navy_funded_project_58250_corvette_development_flag: " Завершено событие §YСделать ставку на многоцелевые корветы§! с выбранным вариантом §GВыделим средства§!"
 UKR_reorganize_navy_not_funded_project_58250_corvette_development_flag: " Завершено событие §YСделать ставку на многоцелевые корветы§! с выбранным вариантом §RУрежем расходы§!"
 UKR_reorganize_navy_developed_project_58250_corvette_development_flag: "Завершено событие §YПостройте корветы проекта 58200 класса «Гайдук-21»§!"
 UKR_reorganize_navy_repair_rivne: "Отремонтировать большой десантный корабль §G«Ровно»§! §Yпроекта 1171§!"
 UKR_reorganize_navy_repair_rivne_desc: "\n\n\n\n\n\n£UKR_desctext_rivne_lst_for_tooltip\n\n\n\n\n\n\n\n\n§WМы можем профинансировать наши ВМС для надлежащего обслуживания и возвращения в строй большого десантного корабля §YU762 «Ровно»§! проекта 1171.\n10 апреля 1994 года военный лагерь в Практической гавани Одесского морского порта был силой захвачен украинской воздушно-десантной ротой из Болграда, где находились десантные корабли проекта 1171 «Илья Азаров» и СДК-137 проекта 773, а 18 апреля 1994 года в одностороннем порядке корабль был принят в состав ВМС Вооружённых сил Украины.\nК сожалению, из-за нехватки средств на ремонт и восстановление технической готовности, более крупный корабль стал непригодным для использования в качестве десантного корабля и был переклассифицирован как сухогрузный военно-транспортный корабль, в настоящее время находится в небоевой готовности.\nМы можем выделить средства на ремонт корабля и возвращение его в строй в качестве десантного корабля или, по крайней мере, в качестве судна обеспечения.§!"
 UKR_reorganize_navy_repair_support_ships: "Отремонтировать §G3§! §Yвспомогательных§! и §Yремонтных§! судна, находящихся в небоевом состоянии"
 UKR_reorganize_navy_repair_support_ships_desc: "\n\n\n\n\n\n£UKR_desctext_support_ships_for_tooltip\n\n\n\n\n\n\n\n\n§WМы можем выделить ВМФ средства, чтобы привести в порядок и вернуть в строй несколько вспомогательных судов: большой морской танкер §YU757 «Макеевка»§!, средний танкер §YU758 «Керчь»§! и плавмастерскую §Y«Ольвия»§!.\nВ 2000 году все три судна не эксплуатировались из-за нехватки средств на ремонт и восстановление технической готовности и вскоре были списаны.\nЕсли немного увеличить выделяемые ресурсы, их можно вернуть в действующий флот.§!"
 UKR_reorganize_navy_build_lahuna_recon_ship: "Проект §Y«Лагуна»§!: §Yразведывательный§! корабль"
 UKR_reorganize_navy_build_lahuna_recon_ship_desc: "\n\n\n\n\n\n£UKR_desctext_simferopol_recon_for_tooltip\n\n\n\n\n\n\n\n\n§WВоенно-морской флот нуждается в корабле радиотехнической разведки, но у него нет денег на специально спроектированный. «Кузня на Рыбальском» имеет траулерный корпус, стапель и сорокалетний опыт строительства одного и того же 1220-тонного судна снова и снова.\n\nПятьдесят пять метров, экипаж из 29 человек, дальность хода 7200 миль, 28 дней в море. Ее вооружение — авиационная ферма.§!"
 UKR_lahuna_needs_kuznya_tt: "Нам нужен контроль над киевским судостроительным заводом"
 UKR_lahuna_needs_black_sea_port_tt: "Чтобы принять корабль, нам нужен собственный черноморский порт"
 ukraine_reorganize_navy_restore_1124.1.name: "Возобновление эксплуатации двух корветов проекта 1124"
 ukraine_reorganize_navy_restore_1124.1.desc: "Мы осмотрели два корпуса корветов проекта 1124: U204 «Сумы» (номер изменен в связи с тем, что новый корвет «Тернополь» получил бортовой номер U209) и U210 «Херсон», и теперь можем выбрать наиболее подходящее направление для принятия решения об их судьбе.\nМы можем либо вложить больше средств и восстановить оба корабля, либо списать корабль в худшем состоянии, U210 «Херсон», и использовать его части для более быстрого восстановления U204 «Сумы»."
 ukraine_reorganize_navy_restore_1124.1.a: "Вернуть в строй оба корабля."
 ukraine_reorganize_navy_restore_1124.1.b: "Разобрать «Херсон» на запчасти, чтобы вернуть в строй «Сумы»"
 ukraine_reorganize_navy_choose_future_corvette.1.name: "Программа перспективного украинского корвета"
 ukraine_reorganize_navy_choose_future_corvette.1.desc: "Сейчас мы находимся на том этапе, когда решение о выборе будущего основного рабочего корабля нашего флота больше нельзя откладывать.\nМы можем выбирать между несколькими отечественными проектами, но главное решение должно быть принято относительно того, на каком типе корвета мы сосредоточим наши ресурсы: на более дешевых и простых в производстве легких корветах водоизмещением около 700 тонн, стандартных корветах водоизмещением более 1200 тонн или тяжелых многоцелевых корветах водоизмещением более 2000 тонн."
 ukraine_reorganize_navy_choose_future_corvette.1.a: "Легкие корветы"
 ukraine_reorganize_navy_choose_future_corvette.1.b: "Стандартные корветы"
 ukraine_reorganize_navy_choose_future_corvette.1.c: "Многоцелевые корветы"
 ukraine_reorganize_navy_choose_future_corvette.2.name: "Ставка на малые корветы"
 ukraine_reorganize_navy_choose_future_corvette.2.desc: "Мы решили и дальше строить корабли поменьше, так что новым пополнением флота станут малые корветы (кто-то, возможно, назовёт их большими ракетными катерами, но мы-то так точно делать не станем).\nВыберем конкретный тип кораблей, которые будем строить."
 ukraine_reorganize_navy_choose_future_corvette.2.a: "Тип «Муссон»"
 ukraine_reorganize_navy_choose_future_corvette.2.b: "Тип «Мираж»"
 ukraine_reorganize_navy_choose_future_corvette.3.name: "Построить корветы типа «Муссон»"
 ukraine_reorganize_navy_choose_future_corvette.3.desc: "Мы выбрали самый дешёвый из доступных вариантов, так что новым пополнением флота станут корветы типа «Муссон».\nВыберем количество кораблей, которое согласимся построить."
 ukraine_reorganize_navy_choose_future_corvette.3.a: "16 кораблей (4x4)"
 ukraine_reorganize_navy_choose_future_corvette.3.b: "12 кораблей (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.3.c: "8 кораблей (2x4)"
 ukraine_reorganize_navy_choose_future_corvette.4.name: "Построить корветы типа «Мираж»"
 ukraine_reorganize_navy_choose_future_corvette.4.desc: "По итогам самостоятельно проведённого конкурса новым пополнением флота выбраны корветы типа «Мираж».\nВыберем количество кораблей, которое согласимся построить."
 ukraine_reorganize_navy_choose_future_corvette.4.a: "16 кораблей (4x4)"
 ukraine_reorganize_navy_choose_future_corvette.4.b: "12 кораблей (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.5.name: "Сделать ставку на обычные корветы"
 ukraine_reorganize_navy_choose_future_corvette.5.desc: "Мы выбрали самый очевидный из доступных вариантов, так что новым пополнением флота станут корветы обычного размера.\nВыберем конкретный тип кораблей, которые будем строить."
 ukraine_reorganize_navy_choose_future_corvette.5.a: "Тип «Гайдук-21», проект 58200"
 ukraine_reorganize_navy_choose_future_corvette.5.b: "Тип Mistral-1500T"
 ukraine_reorganize_navy_choose_future_corvette.6.name: "Построить корветы типа «Гайдук-21», проект 58200"
 ukraine_reorganize_navy_choose_future_corvette.6.desc: "По итогам самостоятельно проведённого конкурса новым пополнением флота выбраны корветы типа «Гайдук-21» проекта 58200.\nВыберем количество кораблей, которое согласимся построить."
 ukraine_reorganize_navy_choose_future_corvette.6.a: "12 кораблей (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.6.b: "8 кораблей (4x2)"
 ukraine_reorganize_navy_choose_future_corvette.6.c: "6 кораблей (2x3)"
 ukraine_reorganize_navy_choose_future_corvette.7.name: "Построить корветы типа Mistral-1500T"
 ukraine_reorganize_navy_choose_future_corvette.7.desc: "По итогам самостоятельно проведённого конкурса новым пополнением флота выбраны корветы типа Mistral-1500T.\nВыберем количество кораблей, которое согласимся построить."
 ukraine_reorganize_navy_choose_future_corvette.7.a: "12 кораблей (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.7.b: "8 кораблей (4x2)"
 ukraine_reorganize_navy_choose_future_corvette.7.c: "6 кораблей (2x3)"
 ukraine_reorganize_navy_choose_future_corvette.8.name: "Сделать ставку на многоцелевые корветы"
 ukraine_reorganize_navy_choose_future_corvette.8.desc: "Мы выбрали самый мощный из доступных вариантов, так что новым пополнением флота станут более крупные многоцелевые корветы.\nЭто будут корветы типа «Владимир Великий» проекта 58250.\nК сожалению, готового проекта у нас сейчас нет, так что придётся потратить деньги и время на его разработку."
 ukraine_reorganize_navy_choose_future_corvette.8.a: "Выделим средства"
 ukraine_reorganize_navy_choose_future_corvette.8.b: "Урежем расходы"
 ukraine_reorganize_navy_buy_lithuanian_1124.1.name: "Результаты встречи с Литвой\nпо вопросу возможности приобретения двух корветов проекта 1124"
 ukraine_reorganize_navy_buy_lithuanian_1124.1.desc: "После нашей встречи с литовскими коллегами по поводу потенциальной покупки двух корветов проекта 1124 мы получили в целом положительные результаты, поскольку Литва поддерживает это решение.\nОднако им необходимо проконсультироваться с Россией, чтобы договориться об одобрении этой сделки и возможных последствиях для их страны.\nТеперь перед нами стоит выбор: мы можем предложить больше денег и дополнительные торговые возможности, чтобы убедить их проигнорировать мнение Москвы, или мы можем дождаться естественного результата их консультаций."
 ukraine_reorganize_navy_buy_lithuanian_1124.1.a: "Мы постараемся их убедить."
 ukraine_reorganize_navy_buy_lithuanian_1124.1.b: "Мы подождем"
 ukraine_reorganize_navy_buy_lithuanian_1124.2.name: "Второй раунд переговоров с Литвой\nпо поводу закупки корветов"
 ukraine_reorganize_navy_buy_lithuanian_1124.2.desc: "Поскольку предыдущие переговоры между нашими странами не позволили нам добиться ожидаемого положительного результата, мы решили активизировать наши усилия.\nВ результате второго раунда мы договорились о покупке 2 корветов на следующих условиях: расширение торговли между нашими странами и заключение соглашения о поставке определенного количества стали и угля, дополнительная компенсация с нашей стороны за приобретение нового корабля для литовского флота, передача некоторых ранее недоступных им военных технологий.\nПринимаем ли мы эти условия?"
 ukraine_reorganize_navy_buy_lithuanian_1124.2.a: "Да, безусловно."
 ukraine_reorganize_navy_buy_lithuanian_1124.2.b: "Нет, это не по карману."
 ukraine_reorganize_navy_buy_lithuanian_1124.3.name: "Результаты консультаций между Литвой и Россией\nо возможности продажи корветов"
 ukraine_reorganize_navy_buy_lithuanian_1124.3.desc: "Наши литовские партнеры провели желаемые переговоры с российской стороной относительно возможной продажи нам двух корветов советского производства.\nК сожалению, Россия не разрешила продажу на условиях, ранее согласованных между нами и Литвой, но выразила желание провести с нами дополнительные консультации.\nТеперь у нас есть два варианта дальнейшего развития событий: либо отказаться от первоначальной идеи, либо продолжить переговоры с Россией на ее условиях."
 ukraine_reorganize_navy_buy_lithuanian_1124.3.a: "Отказаться от покупки корветов."
 ukraine_reorganize_navy_buy_lithuanian_1124.3.b: "Провести переговоры с Россией"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.name: "Результаты переговоров между Украиной и Россией\nо возможности приобретения корветов"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.desc: "Мы провели неудобные, но необходимые переговоры с Россией. К сожалению, на этих переговорах они выступали с позиции силы, и нам нечего было им ответить.\nРоссия предъявила нам следующий ультиматум в обмен на разрешение Литве на продажу двух корветов: выделение дополнительного места для нужд базы Черноморского флота России в Севастополе, сокращение нашего продвижения в сторону ЕС, укрепление торговых отношений между нами и дополнительная денежная компенсация России за корабли.\nПринимаем ли мы эти условия?"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.a: "Отказаться от этой идеи."
 ukraine_reorganize_navy_buy_lithuanian_1124.4.b: "Согласиться с условиями России"
 ukraine_reorganize_navy_buy_lithuanian_1124.5.name: "Завершается согласование сделки по закупке корветов у Литвы"
 ukraine_reorganize_navy_buy_lithuanian_1124.5.desc: "Мы наконец согласовали все условия и можем завершить покупку и передачу судов.\nВ знак уважения к их предыдущим владельцам мы договорились назвать суда «Братслав» и «Владимир» в честь важных городов на территории современной Украины, которые когда-то входили в состав общего государства, Великого княжества Литовского, Рутении и Земайи."
 ukraine_reorganize_navy_buy_lithuanian_1124.5.a: "Отлично!"
 ukraine_reorganize_navy_maintain_1135.1.name: "Содержание 3 фрегатов проекта 1135"
 ukraine_reorganize_navy_maintain_1135.1.desc: "Мы осмотрели три корпуса фрегатов проекта 1135 — «Севастополь», «Николаев» и «Днепропетровск» — теперь нужно решить их судьбу.\nМы можем либо вложить больше средств и отремонтировать все три корабля, либо сосредоточиться только на самых современных и мощных."
 ukraine_reorganize_navy_maintain_1135.1.a: "Содержать все 3 корабля."
 ukraine_reorganize_navy_maintain_1135.1.b: "Содержать только «Севастополь» и «Николаев»."
 ukraine_reorganize_navy_maintain_1135.1.c: "Сохранить только самый современный, «Севастополь»."
 ukraine_reorganize_navy_finish_11451.1.name: "Достройка двух корветов проекта 11451"
 ukraine_reorganize_navy_finish_11451.1.desc: "Мы осмотрели два корпуса корветов проекта 11451, «Львов» и «Луганск», и теперь можем выбрать наиболее подходящее направление для принятия решения об их судьбе.\n\nМы можем либо вложить больше средств и завершить строительство обоих кораблей, либо списать корабль в худшем состоянии, «Луганск», и использовать его части для более быстрой постройки «Львова»."
 ukraine_reorganize_navy_finish_11451.1.a: "Достроить оба корабля."
 ukraine_reorganize_navy_finish_11451.1.b: "Чтобы добить Львов, нужно уничтожить Луганск."
 ukraine_reorganize_navy_maintain_1241.1.name: "Содержание 3 малых корветов проекта 1241"
 ukraine_reorganize_navy_maintain_1241.1.desc: "Мы осмотрели 3 корпуса наших малых корветов проекта 1241, ракетного катера U156 «Кременчуг» и малых противолодочных кораблей U207 «Ужгород» и U208 «Хмельницкий».\nТеперь нужно решить их судьбу.\nМы можем либо вложить больше средств и отремонтировать все 3 корабля, либо сосредоточиться только на том, который проще всего восстановить."
 ukraine_reorganize_navy_maintain_1241.1.a: "Содержать все 3 корабля."
 ukraine_reorganize_navy_maintain_1241.1.b: "Содержать только U208 «Хмельницкий»"
 ukraine_reorganize_navy_maintain_1241.2.name: "Завершение ремонта ракетного катера U156 «Кременчуг»"
 ukraine_reorganize_navy_maintain_1241.2.desc: "Мы завершили ремонт ракетного катера U156 «Кременчуг», и он готов к активной службе.\nТеперь мы продолжим ремонт малых противолодочных корветов U207 «Ужгород» и U208 «Хмельницкий»."
 ukraine_reorganize_navy_maintain_1241.2.a: "Отлично, давайте продолжим."
 ukraine_reorganize_navy_maintain_1241.3.name: "Завершение ремонта малогабаритного противолодочного корвета U207 «Ужгород»"
 ukraine_reorganize_navy_maintain_1241.3.desc: "Мы завершили ремонт малогабаритного противолодочного корвета U207 «Ужгород», и он готов к активной службе.\nТеперь мы сосредоточимся на завершении ремонта малогабаритного противолодочного корвета U208 «Хмельницкий»."
 ukraine_reorganize_navy_maintain_1241.3.a: "Отлично, давайте продолжим."
 ukraine_reorganize_navy_maintain_1241.4.name: "Завершение ремонта малогабаритного противолодочного корвета U208 «Хмельницкий»"
 ukraine_reorganize_navy_maintain_1241.4.desc: "Мы завершили ремонт малого противолодочного корвета U208 «Хмельницкий», и он готов к активной службе.\nВсе 4 малых корвета проекта 1241 сейчас находятся на активной службе."
 ukraine_reorganize_navy_maintain_1241.4.a: "Отлично, все корабли готовы."
 ukraine_reorganize_navy_maintain_1241.5.name: "Завершение ремонта малогабаритного противолодочного корвета U208 «Хмельницкий»"
 ukraine_reorganize_navy_maintain_1241.5.desc: "Благодаря использованию запчастей от трех других малых корветов проект 1241 мы завершили ремонт малого противолодочного корвета U208 «Хмельницкий» раньше, чем ожидалось. Теперь он готов к активной службе."
 ukraine_reorganize_navy_maintain_1241.5.a: "Хорошо!"
 ukraine_reorganize_navy_maintain_641_submarine.1.name: "Подводная лодка «Запорожье» — поиски батарей"
 ukraine_reorganize_navy_maintain_641_submarine.1.desc: "Мы осмотрели корпус «Запорожья» и обнаружили, что работы ещё много.\n К сожалению, главная проблема сейчас — отсутствие батарей: без них подводная лодка не может двигаться.\nМы можем либо попросить Россию продать нам одну из имеющихся у них батарей, либо поискать её по всей Европе (особенно в Греции), либо поручить нашим местным предприятиям разработать для неё батарею отечественного производства."
 ukraine_reorganize_navy_maintain_641_submarine.1.a: "Купить из России"
 ukraine_reorganize_navy_maintain_641_submarine.1.b: "Поиск в Европе"
 ukraine_reorganize_navy_maintain_641_submarine.1.c: "Развиваться внутри страны"
 ukraine_reorganize_navy_maintain_641_submarine_batteries_from_RUS_flag: " Завершено событие §YПодводная лодка «Запорожье» — поиск батарей§! с выбранной опцией §RКупить у России§!"
 ukraine_reorganize_navy_maintain_641_submarine_batteries_from_GRE_flag: " Завершено событие §YПодводная лодка «Запорожье» — поиск батарей§! с выбранной опцией §BПоиск в Европе§!"
 ukraine_reorganize_navy_maintain_641_submarine.2.name: "Подводная лодка «Запорожье» — закупка батарей"
 ukraine_reorganize_navy_maintain_641_submarine.2.desc: "Наконец, мы согласовали условия покупки со страной-партнером, и после внесения предоплаты началось ожидание доставки.\nЭто может показаться невероятным, но мы получили столь необходимое оборудование на ранее согласованных условиях.\nТеперь нам остается только поблагодарить нашего партнера и продолжить ремонт."
 ukraine_reorganize_navy_maintain_641_submarine.2.a: "Спасибо, Россия, продолжаем ремонт."
 ukraine_reorganize_navy_maintain_641_submarine.2.b: "Спасибо, Греция, продолжаем ремонт."
 ukraine_reorganize_navy_maintain_641_submarine.3.name: "Подводная лодка «Запорожье» — отечественная разработка аккумуляторов"
 ukraine_reorganize_navy_maintain_641_submarine.3.desc: "Задача по разработке и производству батарей для подводной лодки «Запорожье» оказалась непростой.\nВ конце концов, мы получили то, что хотели, но фактические затраты оказались выше, чем мы ожидали.\nТем не менее, мы можем продолжить ремонт подводной лодки."
 ukraine_reorganize_navy_maintain_641_submarine.3.a: "Мы достигли этого рубежа, продолжаем ремонт."
 ukraine_reorganize_navy_maintain_641_submarine.4.name: "Подводная лодка «Запорожье» — завершение ремонта"
 ukraine_reorganize_navy_maintain_641_submarine.4.desc: "Нам удалось установить новые батареи, отремонтировать и обслужить все неисправное оборудование, и наконец мы можем начать настоящие морские испытания.\n\nМы можем разработать базовую программу, сэкономив деньги и время, или же создать более сложную, которая потребует больше ресурсов, но зато мы можем выявить некоторые дополнительные проблемы и быстро их решить."
 ukraine_reorganize_navy_maintain_641_submarine.4.a: "Начать базовые ходовые испытания"
 ukraine_reorganize_navy_maintain_641_submarine.4.b: "Начать расширенные морские испытания"
 ukraine_reorganize_navy_maintain_641_submarine_extended_sea_trials_bonus: "Повышенная надежность подводной лодки «Запорожье» стала результатом длительных морских испытаний."
 ukraine_reorganize_navy_maintain_641_submarine.5.name: "Подводная лодка «Запорожье» – ввод в эксплуатацию"
 ukraine_reorganize_navy_maintain_641_submarine.5.desc: "Наконец сделаны все необходимые закупки, замены, установки, обслуживание, ремонт и ходовые испытания, чтобы «Запорожье» полноценно вошло в состав Военно-морских сил Украины!"
 ukraine_reorganize_navy_maintain_641_submarine.5.a: "Окончательно!"
 ukraine_reorganize_navy_finish_ukrayina.1.name: "Достройка крейсера «Украина»: проблема недостающего оборудования"
 ukraine_reorganize_navy_finish_ukrayina.1.desc: "Под непосредственным руководством нашего Президента мы наконец приняли решение завершить строительство крейсера «Украина» советского проекта 1164.\nМы осмотрели корпус и составили исчерпывающий список недостающего оборудования.\nТеперь нам нужно сделать следующий шаг и решить, что нам следует делать: обратиться к России за разрешением на закупку у них оригинального оборудования (в основном противокорабельных ракет и зенитно-ракетных комплексов) или связаться с западными странами и поискать возможность замены его на их аналоги.\nОбратите внимание, что для запроса западного оборудования необходимо иметь не менее 40 отзывов от США или 25 отзывов от Франции.\n\n\n§GЭто шаг 1 из §R3§!, §R4§! или §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.1.a: "Оставить исходное российское оборудование"
 ukraine_reorganize_navy_finish_ukrayina.1.b: "Изучить возможность замены на западное"
 ukraine_reorganize_navy_finish_ukrayina.2.name: "Достройка крейсера «Украина»: закупка российского оборудования"
 ukraine_reorganize_navy_finish_ukrayina.2.desc: "Поскольку мы решили придерживаться первоначального советского проекта при завершении строительства крейсера «Украина», мы начали переговоры с Россией о закупке недостающего оборудования.\nПолучение необходимых компонентов потребует от нас значительных финансовых и временных затрат.\n\n\n§GЭто шаг 2 из 3§!"
 ukraine_reorganize_navy_finish_ukrayina.2.a: "Мы заплатим и подождем"
 ukraine_reorganize_navy_finish_ukrayina.3.name: "Достройка крейсера «Украина»: российское оборудование получено"
 ukraine_reorganize_navy_finish_ukrayina.3.desc: "Наконец-то Россия предоставила необходимые компоненты, и мы можем начать процесс установки и завершить строительство. Надеюсь, это не займет много времени.\n\n\n§GЭто заключительный шаг§!"
 ukraine_reorganize_navy_finish_ukrayina.3.a: "Начать производство"
 ukraine_reorganize_navy_finish_ukrayina.4.name: "Достройка крейсера «Украина»: замена ракет"
 ukraine_reorganize_navy_finish_ukrayina.4.desc: "Мы можем поискать все возможные варианты западной техники, представленной на рынке, чтобы заменить отсутствующие советские противокорабельные ракеты П-500 «Гранит» и зенитные ракетные комплексы С-300Ф «Форт».\nНам нужно выбрать один из нескольких вариантов.\n\n\n§GЭто шаг 2 из §R4§! или §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.4.a: "Выбрать американские ракеты"
 ukraine_reorganize_navy_finish_ukrayina.4.b: "Выбрать французские ракеты"
 ukraine_reorganize_navy_finish_ukrayina.4.c: "Выбрать шведские ракеты"
 ukraine_reorganize_navy_finish_ukrayina.5.name: "Достройка крейсера «Украина»: американские ракеты"
 ukraine_reorganize_navy_finish_ukrayina.5.desc: "Поскольку мы выбрали США в качестве поставщика новых ракет для крейсера «Украина», мы начали с ними переговоры о закупке как противокорабельных ракет RGM-84D Harpoon Block 1C, так и зенитных ракет RIM-66M-2 Block IIIA.\nПолучение необходимых компонентов потребует от нас значительных финансовых и временных затрат.\n\n\n§GЭто шаг 3 из §R4§!§!"
 ukraine_reorganize_navy_finish_ukrayina.5.a: "Мы заплатим и подождем"
 ukraine_reorganize_navy_finish_ukrayina.6.name: "Достройка крейсера «Украина»: французские ракеты"
 ukraine_reorganize_navy_finish_ukrayina.6.desc: "Поскольку мы выбрали Францию в качестве поставщика новых ракет для крейсера «Украина», мы начали с ней переговоры о закупке как противокорабельных ракет Exocet MM40 Block 2, так и зенитных ракет Aster 30 Block 2.\nПолучение необходимых компонентов потребует от нас значительных финансовых и временных затрат.\n\n\n§GЭто шаг 3 из §R4§!§!"
 ukraine_reorganize_navy_finish_ukrayina.6.a: "Мы заплатим и подождем"
 ukraine_reorganize_navy_finish_ukrayina.7.name: "Достройка крейсера «Украина»: шведские ПКР"
 ukraine_reorganize_navy_finish_ukrayina.7.desc: "Поскольку мы выбрали Швецию в качестве поставщика новых противокорабельных ракет RBS 15 Mk. III для крейсера «Украина», мы начали с ними переговоры о закупке этого оборудования.\nПолучение необходимых компонентов потребует от нас значительных финансовых и временных затрат.\n\n\n§GЭто шаг 3 из §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.7.a: "Мы заплатим и подождем"
 ukraine_reorganize_navy_finish_ukrayina.8.name: "Достройка крейсера «Украина»: замена зенитных ракет"
 ukraine_reorganize_navy_finish_ukrayina.8.desc: "После выбора наиболее современных шведских противокорабельных ракет нам еще предстоит решить, какое оборудование заменит советские зенитные ракетные комплексы С-300Ф «Форт».\nУ нас есть только 2 возможных варианта на выбор.\n\n\n§GЭто 4-й шаг §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.8.a: "Выбрать американские RIM-66M-2 Block IIIA"
 ukraine_reorganize_navy_finish_ukrayina.8.b: "Выбрать французские Aster 30 Block 2"
 ukraine_reorganize_navy_finish_ukrayina.9.name: "Достройка крейсера «Украина»: американские ЗУР RIM-66"
 ukraine_reorganize_navy_finish_ukrayina.9.desc: "Поскольку мы выбрали США в качестве поставщика новых зенитных ракет для крейсера «Украина», мы начали с ними переговоры о закупке этого оборудования.\nПолучение необходимых компонентов потребует от нас значительных финансовых и временных затрат.\n\n\n§GЭто пятый шаг §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.9.a: "Мы заплатим и подождем"
 ukraine_reorganize_navy_finish_ukrayina.10.name: "Достройка крейсера «Украина»: французские ЗУР Aster 30"
 ukraine_reorganize_navy_finish_ukrayina.10.desc: "Поскольку мы выбрали Францию в качестве поставщика новых зенитных ракет для крейсера «Украина», мы начали с ней переговоры о закупке этого оборудования.\nПолучение необходимых компонентов потребует от нас значительных финансовых и временных затрат.\n\n\n§GЭто пятый шаг §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.10.a: "Мы заплатим и подождем"
 ukraine_reorganize_navy_finish_ukrayina.11.name: "Достройка крейсера «Украина»: всё оборудование получено"
 ukraine_reorganize_navy_finish_ukrayina.11.desc: "Все необходимые компоненты были предоставлены производителями в соответствии с ранее согласованными условиями, и мы можем начать процесс установки и завершить строительство. Надеюсь, это не займет много времени.\n\n\n§GЭто заключительный шаг§!"
 ukraine_reorganize_navy_finish_ukrayina.11.a: "Начать производство"
 ukraine_reorganize_navy_repair_rivne.1.name: "Ремонт десантного корабля «Ровно»: выбор варианта"
 ukraine_reorganize_navy_repair_rivne.1.desc: "Учитывая нынешнее состояние большого десантного корабля «Ровно», нам нужно решить, как вести его ремонт и обслуживание.\nМы можем вложить больше денег и восстановить его полностью в исходном виде большого десантного корабля либо заняться только самыми важными системами, чтобы он служил транспортом обеспечения."
 ukraine_reorganize_navy_repair_rivne.1.a: "Отремонтировать как десантный корабль"
 ukraine_reorganize_navy_repair_rivne.1.b: "Отремонтировать как судно обеспечения"
 ukraine_reorganize_navy_repair_rivne.2.name: "Ремонт «Ровно» как десантного корабля завершён"
 ukraine_reorganize_navy_repair_rivne.2.desc: "Мы выбрали ремонт «Ровно» как полноценного десантного корабля: все необходимые ремонтные и профилактические работы завершены, и теперь он готов вернуться в строй."
 ukraine_reorganize_navy_repair_rivne.2.a: "Отлично!"
 ukraine_reorganize_navy_repair_rivne.3.name: "Ремонт «Ровно» как судна обеспечения завершён"
 ukraine_reorganize_navy_repair_rivne.3.desc: "Мы выбрали ремонт «Ровно» как судна обеспечения: все необходимые ремонтные и профилактические работы завершены, и теперь оно готово вернуться в строй."
 ukraine_reorganize_navy_repair_rivne.3.a: "Отлично!"
 ukraine_reorganize_navy_repair_support_ships.1.name: "Ремонт вспомогательных судов — выберите дальнейший способ выполнения работ"
 ukraine_reorganize_navy_repair_support_ships.1.desc: "Учитывая нынешнее состояние наших судов обеспечения, нам нужно решить, как вести их ремонт и обслуживание.\nМы можем вложить больше денег и отремонтировать все три либо расставить приоритеты по их важности и имеющимся средствам."
 ukraine_reorganize_navy_repair_support_ships.1.a: "Они все нам нужны"
 ukraine_reorganize_navy_repair_support_ships.1.b: "1 поддержка и 1 ремонт"
 ukraine_reorganize_navy_repair_support_ships.1.c: "Мы можем позволить себе только 1"
 ukraine_reorganize_navy_repair_support_ships.2.name: "Ремонт судов обеспечения — будут отремонтированы все 3"
 ukraine_reorganize_navy_repair_support_ships.2.desc: "Раз уж решено ремонтировать все три судна обеспечения, пора выбрать, как именно это делать.\nМы можем отдать каждому судну отдельный государственный док из имеющихся в распоряжении и отремонтировать их без больших затрат либо вложить больше денег и управиться быстрее, задействовав ещё и частные доки."
 ukraine_reorganize_navy_repair_support_ships.2.a: "Использовать только государственные верфи."
 ukraine_reorganize_navy_repair_support_ships.2.b: "Плата за частные верфи"
 ukraine_reorganize_navy_repair_support_ships.3.name: "Ремонт вспомогательных судов - будет отремонтирован 1 вспомогательный и 1 ремонтный корабль"
 ukraine_reorganize_navy_repair_support_ships.3.desc: "Поскольку мы приняли решение отремонтировать 1 вспомогательное судно и 1 ремонтное судно, пришло время выбрать предпочтительный способ дальнейших действий.\nМы можем либо предоставить обоим судам специализированные верфи, которые в настоящее время находятся в распоряжении правительства, и отремонтировать их без больших затрат, либо мы можем вложить больше средств и отремонтировать их быстрее, используя дополнительные частные верфи."
 ukraine_reorganize_navy_repair_support_ships.3.a: "Использовать только государственные верфи."
 ukraine_reorganize_navy_repair_support_ships.3.b: "Плата за частные верфи"
 ukraine_reorganize_navy_repair_support_ships.4.name: "Ремонт вспомогательных судов — будет отремонтирован только 1 корабль"
 ukraine_reorganize_navy_repair_support_ships.4.desc: "Поскольку мы приняли решение отремонтировать только одно вспомогательное судно, пришло время выбрать предпочтительный способ действий.\nМы можем либо предоставить судну специализированную верфь, которая в настоящее время находится в распоряжении правительства, и отремонтировать его без больших затрат, либо мы можем вложить больше средств и отремонтировать его быстрее, используя дополнительную частную верфь."
 ukraine_reorganize_navy_repair_support_ships.4.a: "Использовать только государственную верфь."
 ukraine_reorganize_navy_repair_support_ships.4.b: "Оплатить услуги частной верфи."
 ukraine_reorganize_navy_repair_support_ships.5.name: "Ремонт судов обеспечения — все 3 отремонтированы"
 ukraine_reorganize_navy_repair_support_ships.5.desc: "Ремонт всех трёх судов обеспечения завершён: теперь они готовы к службе и могут обеспечивать наш флот всем необходимым."
 ukraine_reorganize_navy_repair_support_ships.5.a: "Отлично!"
 ukraine_reorganize_navy_repair_support_ships.6.name: "Ремонт вспомогательных судов - отремонтированы 1 вспомогательное и 1 ремонтное судно"
 ukraine_reorganize_navy_repair_support_ships.6.desc: "Поскольку ремонт одного вспомогательного и одного ремонтного судна завершен, они теперь готовы к активной службе и могут оказывать необходимую поддержку нашему флоту."
 ukraine_reorganize_navy_repair_support_ships.6.a: "Отлично!"
 ukraine_reorganize_navy_repair_support_ships.7.name: "Ремонт вспомогательных судов — отремонтирован только 1 корабль"
 ukraine_reorganize_navy_repair_support_ships.7.desc: "Поскольку мы завершили ремонт только одного вспомогательного судна, оно теперь готово к активной службе и может оказывать необходимую поддержку нашему флоту."
 ukraine_reorganize_navy_repair_support_ships.7.a: "Отлично!"
 UKR_modernize_sov_category: "Модернизация устаревшего советского оборудования."
 UKR_modernize_sov_category_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_main\n\n\n\n\n\n\n\n\nМы можем вложить время и ресурсы в разработку, испытания и внедрение современных модернизаций для техники советского образца. Совершенствуя существующие образцы с помощью современных технологий, мы продлим срок их службы и повысим боевые возможности. Эти программы позволят нам максимально использовать огромный арсенал, доставшийся от Советского Союза, постепенно приспосабливая его к требованиям современной войны."
 UKR_develop_domestic_category: "Разработка отечественных систем вооружения"
 UKR_develop_domestic_category_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_main\n\n\n\n\n\n\n\n\nМы можем вложить время и ресурсы в исследования и разработку собственных современных систем вооружения. Опираясь на инженерный опыт и промышленные традиции Украины, мы создадим технику, отвечающую потребностям наших вооружённых сил. Собственная оборонная промышленность усилит нашу армию и уменьшит зависимость от иностранных поставщиков."
 UKR_modernize_bmp1u: "Разработка §YБМП-1У «Шквал»§!"
 UKR_modernize_bmp1u_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bmp1u_shkval_for_tooltip\n\n\n\n\n\n\n\n\n§WОграниченную украинскую модернизацию БМП-1 разработал Государственный научно-технический центр артиллерийско-стрелкового вооружения в Киеве.\nШтатную башню заменили новым дистанционно управляемым боевым модулем КБА-105 «Шквал», созданным для повышения боевой эффективности лёгкой бронетехники.§!"
 UKR_modernize_bmp1m: "Разработка §YБМП-1М§!"
 UKR_modernize_bmp1m_desc: "§WРазработан на основе БМП-1У, представленной в 2011 году.\nГлавное отличие заключается в применении усовершенствованной дистанционно управляемой боевой системы КБА-105ТБ «Шквал-А», в которой пусковые установки ПТУР «Конкурс» были заменены на украинские ПТУР дальнего действия «Барьер», а также используется новая система прицеливания «Тандем-2» и улучшенная система стабилизации оружия СВУ-500-3Ц.§!"
 UKR_modernize_bmp1um: "Разработка §YБМП-1УМ§!"
 UKR_modernize_bmp1um_desc: "§WБолее масштабная модернизация стандартной БМП-1, проведенная на Житомирском бронетанковом заводе и представленная публике в 2015 году.\nДвигатель УДД-20 мощностью 300 л.с. был заменен на трехцилиндровый двухтактный дизельный двигатель 3ТД-2 мощностью 400 л.с., компоновка десантного отделения была улучшена за счет поднятия крыши корпуса на 15 см, а небольшие, неэргономичные аварийные выходы в задней части БМП-1 были заменены большой аппарелью, хотя и с ручным управлением.§!"
 UKR_modernize_bmp1umd: "Разработка §YБМП-1УМД§!"
 UKR_modernize_bmp1umd_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bmp1umd_for_tooltip\n\n\n\n\n\n\n\n\n§WДальнейшее развитие БМП-1УМ от Житомирского бронетанкового завода, представленное в 2016 году на выставке «Оружие и безопасность».\nУ этого варианта новый боевой модуль и новый двигатель: шестицилиндровый турбодизель Deutz TCD2013 L64V с электронным управлением мощностью 330 л. с. — надёжнее, тише и экономичнее, чем УТД-20 и 3ТД-2.§!"
 UKR_modernize_bmp1ts: "Разработка §YБМП-1ТС§!"
 UKR_modernize_bmp1ts_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bmp1ts_for_tooltip\n\n\n\n\n\n\n\n\n§WБМП-1ТС — украинский вариант модернизации, разработанный НВК «Техимпекс», который с 2018 года работает над боевым модулем «Спис» для БМП-1.\nМодуль «Спис» получил систему управления огнём «Синтез» с прицельным комплексом «Кажан-3К15», включающим тепловизионную и оптическую телевизионную камеры, а также лазерный дальномер.§!"
 UKR_modernize_bmp_m1s: "Разработка §YБМП-М1С§!"
 UKR_modernize_bmp_m1s_desc: "§WБМП-М1С — бронированная боевая гусеничная машина, разработанная на собственные средства Житомирского бронетанкового завода, входящего в группу компаний «Укроборонпром».\nНовинка была представлена на выставке «Оружие и безопасность 2018» в Киеве.\nБМП-М1С представляет собой модификацию со значительным увеличением огневой мощи, уровня защиты и заменой устаревшего советского двигателя на немецкий Deutz.\nБлагодаря этому БМП-М1С может перевозить до 8 военнослужащих и эффективно поддерживать действия пехотных частей благодаря высокой огневой мощи боевого модуля «Стилет».§!"
 UKR_modernize_bmp1m_praktyka: "Разработка §YБМП-1М «Практика»§!"
 UKR_modernize_bmp1m_praktyka_desc: "§WУкраинский производитель НВО «Практыка» продемонстрировал бронемашину БМП-1М в 2021 году.\nОбновленная БМП-1 оснащена современным оборудованием вместо обычных двух дверей-танков посадочного отделения.\nТакже заметно, что высота корпуса боевой машины немного увеличена.\nМодернизированная БМП также отличается от советской модели наличием улучшенного боевого модуля «Шпионы-Синтез», разработанного и произведенного компанией НВК «Техимпекс».§!"
 UKR_modernize_bmp1u_flag: "Выполнено решение §YРазработка БМП-1У§!"
 UKR_modernize_bmp1m_flag: "Выполнено решение §YРазработка БМП-1М§!"
 UKR_modernize_bmp1um_flag: "Выполнено решение §YРазработка БМП-1УМ§!"
 UKR_modernize_bmp1umd_flag: "Выполнено решение §YРазработка БМП-1УМД§!"
 UKR_modernize_mt_lbr6: "Разработка §YМТ-ЛБР6§!"
 UKR_modernize_mt_lbr6_desc: "§WМТ-ЛБР6 — лёгкая БМП на шасси МТ-ЛБ с боевым модулем ЗТМ-1.\nВооружение: 30-мм автоматическая пушка ЗТМ-1, 7.62-мм пулемёт КТ, дымовые гранатомёты системы 902Б «Туча».\nЗащита экипажа повышена за счёт разнесённой брони и кевларовой обшивки, шасси защищено противокумулятивными экранами.\nПроизводитель: Харьковский тракторный завод.§!"
 UKR_modernize_mt_lbmsh: "Разработка §YМТ-ЛБМШ§!"
 UKR_modernize_mt_lbmsh_desc: "§WМТ-ЛБМШ — лёгкая боевая машина пехоты на шасси МТ-ЛБ с боевым модулем «Шквал».\nВооружение: 30-мм автоматическая пушка ЗТМ-1, 7.62-мм пулемёт КТ-7.62 в паре с ней, две противотанковые управляемые ракеты «Барьер», 30-мм автоматический гранатомёт, дымовые гранатомёты.\nС 2006 года производится на КМДБ.§!"
 UKR_modernize_mt_lbr7: "Разработка §YМТ-ЛБР7§!"
 UKR_modernize_mt_lbr7_desc: "§WМТ-ЛБР7 — лёгкая БМП на шасси МТ-ЛБ с боевым модулем «Штурм».\nВооружение: 30-мм автоматическая пушка ЗТМ-1, 7.62-мм пулемёт КТ-7.62 в паре с ней, две пусковые установки ПТУР 9М113М «Конкурс-М», 30-мм автоматический гранатомёт, дымовые гранатомёты.\nЗащита экипажа повышена за счёт разнесённой брони и кевларовой обшивки, шасси защищено антикумулятивными экранами.\nПроизводитель: Харьковский тракторный завод.§!"
 UKR_modernize_mt_lb_at: "Разработка §YМТ-ЛБ-АТ§!"
 UKR_modernize_mt_lb_at_desc: "§WМТ-ЛБ-АТ — это модификация для МТ-ЛБ, оснащенная вращающейся платформой с бронезащитой и вооруженная 12.7-мм пулеметом ДШКМ.§!"
 UKR_modernize_mt_lb_t_23_2: "Разработка §YМТ-ЛБ-Т-23-2§!"
 UKR_modernize_mt_lb_t_23_2_desc: "§WМТ-ЛБ-Т-23-2 — это вариант модернизации МТ-ЛБ, разработанный компанией НВК Техимпекс.\nОн оснащен бронированным щитом и новым прицелом, а в качестве основного вооружения использует ЗУ-23-2.\nДемонстрационный образец был представлен 21 сентября 2015 года на выставке «Оружие и безопасность».§!"
 UKR_modernize_mt_lbr6_flag: "Выполнено решение §YРазработка МТ-ЛБР6§!"
 UKR_modernize_mt_lbr7_flag: "Выполнено решение §YРазработка МТ-ЛБР7§!"
 UKR_modernize_mt_lbrmsh_flag: "Выполнено решение §YРазработка МТ-ЛБМШ§!"
 UKR_modernize_btr_70m: "Разработка §YБТР-70М§!"
 UKR_modernize_btr_70m_desc: "§WБТР-70М — украинская модификация БТР-70.\nМодернизация была проведена Харьковским конструкторским бюро имени О. О. Морозова в рамках государственного оборонного заказа на оснащение миротворческих частей вооруженных сил Украины.\nВместо двух бензиновых двигателей установлен многотопливный дизельный двигатель УДД-20 от БМП-1.\nВооружение: 14.5-мм крупнокалиберный пулемет КПВТ и спаренный 7.62-мм пулемет ПКТ. Боковые люки — типа БТР-80.§!"
 UKR_modernize_btr_70m_kba2: "Разработка §YБТР-70М-КБА-2§!"
 UKR_modernize_btr_70m_kba2_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr70_kba2_for_tooltip\n\n\n\n\n\n\n\n\n§WБТР-70М-КБА-2 — украинская модификация БТР-70.\nМодернизация была проведена Харьковским конструкторским бюро имени О. О. Морозова.\nБашня БТР-70 была демонтирована, вместо неё был установлен боевой модуль с 30-мм автоматической пушкой КБА-2 и устройством для стрельбы дымовыми гранатами (в результате высота машины увеличилась до 2765 мм).\nБоковые люки — типа БТР-80.§!"
 UKR_modernize_btr_70m_hrim: "Разработка §YБТР-70М «Гром»§!"
 UKR_modernize_btr_70m_hrim_desc: "§WБТР-70М «Гром» — украинская модификация БТР-70.\nМодернизация была проведена Харьковским конструкторским бюро имени О. О. Морозова.\nВместо стандартной башни установлен боевой модуль БМ-1Б «Гром» (30-мм автоматическая пушка, 7.62-мм пулемет, 30-мм автоматический гранатомет АГ-17 и противотанковый ракетный комплекс «Барьер» с боекомплектом из 4 ПТУР).\nБоковые люки — типа БТР-80.§!"
 UKR_modernize_btr_7: "Разработка §YБТР-7 «Захисник»§!"
 UKR_modernize_btr_7_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr7_for_tooltip\n\n\n\n\n\n\n\n\n§WБТР-7 «Захисник» — украинская модификация БТР-70.\nМодернизация выполнена Николаевским бронетанковым заводом.\nОн оснащен двумя двигателями ФПТ Iveco Tector (от грузовика Iveco EuroCargo) P4 (Euro III) мощностью 150 л.с. каждый.\nБронетранспортер оборудован боевой группой БУГ, стабилизированной в двух плоскостях, основное вооружение которой состоит из: 14.5-мм пулемета КПВТ (500 патронов); 7.62-мм пулемета ПКТ (1500 патронов); 30-мм автоматического гранатомета АГС-17 (87 выстрелов); двух 130-мм ПТУР «Барьер» (4 ПТУР).§!"
 UKR_modernize_btr_70t: "Разработка §YБТР-70Т§!"
 UKR_modernize_btr_70t_desc: "§WБТР-70Т — это украинская модернизация БТР-70 НВК «Техимпекс».\nУстановлены новые боковые люки, как у БТР-80, радиостанция Р-173, два новых дизельных двигателя Д245.30Е2 суммарной мощностью 312 л.с., передние и задние габаритные огни БТР-80, новые колеса с бескамерными шинами.\nТакже возможна установка других боевых модулей.§!"
 UKR_modernize_varan: "Разработка §Y«Варан»§!"
 UKR_modernize_varan_desc: "§W«Варан» — украинский бронетранспортер, радикальная модернизация БТР-70.\nРазработан компанией НВК «Техимпекс».\n«Варан» получил новый бронированный корпус, а также значительные изменения в компоновке: двигатель расположен в передней части, а шасси — в кормовой.\nВ результате изменения компоновки полезное внутреннее пространство посадочного отделения увеличилось на 35%, а также появилась возможность посадки и высадки солдат через складной механизм в кормовой части.\nВооружен боевым модулем «Шпионы», который оснащен 30-мм пушкой типа 2А72 (ЗТМ-1 или КБА-1) с 300 снарядами, 30-мм автоматическим гранатометом КБА-117 (АГС-17) со 125 гранатами, 7.62-мм пулеметом КТ-7.62 и комплексом управляемых ракет «Барьер» с двумя ракетами.§!"
 UKR_modernize_btr_70m_flag: "Выполнено решение §YРазработка БТР-70М§!"
 UKR_modernize_btr_70m_kba2_flag: "Выполнено решение §YРазработка БТР-70М-КБА-2§!"
 UKR_modernize_btr_70m_hrim_flag: "Выполнено решение §YРазработка БТР-70М «Гром»§!"
 UKR_modernize_btr_70t_flag: "Выполнено решение §YРазработка БТР-70Т§!"
 UKR_modernize_btr_80_kba2: "Разработка §YБТР-80-КБА-2§!"
 UKR_modernize_btr_80_kba2_desc: "§WБТР-80-КБА-2 — украинская модификация БТР-80.\nМодернизация была проведена Харьковским конструкторским бюро имени О. О. Морозова.\nУстановлен украинский дизельный двигатель УДД-20.\nВместо 14.5-мм пулемета КПВТ установлен 30-мм пулемет КБА-2.\nУвеличен пробег на 25% при том же количестве топлива за счет значительного снижения расхода топлива.\nПовышена проходимость машины в сложных дорожных условиях благодаря увеличению крутящего момента двигателя.\nУстановка 30-мм пушки КБА-2 позволяет увеличить дальность и эффективность стрельбы.§!"
 UKR_modernize_btr_80m_hrim: "Разработка §YБТР-80М «Гром»§!"
 UKR_modernize_btr_80m_hrim_desc: "§WБТР-80М «Гром» — украинская модификация БТР-80.\nМодернизация была проведена Харьковским конструкторским бюро имени О. О. Морозова.\nВместо стандартной башни установлен боевой модуль БМ-1Б «Гром» (30-мм автоматическая пушка, 7.62-мм пулемет, 30-мм автоматический гранатомет АГ-17 и противотанковый ракетный комплекс «Барьер» с боекомплектом из 4 ПТУР).§!"
 UKR_modernize_btr_80up: "Разработка §YБТР-80УП§!"
 UKR_modernize_btr_80up_desc: "§WБТР-80УП — это совместная польско-украинская программа модернизации БТР-80, разработанная для участия в тендере в Ираке.\nУлучшена защита, установлены новые дизельные двигатели мощностью 300 л.с., новые шины и новые электро- и пневматические системы, демонтирована водометная установка.\nПомимо линейного бронетранспортера, разработано 7 специализированных модификаций.§!"
 UKR_modernize_btr_80t: "Разработка §YБТР-80Т§!"
 UKR_modernize_btr_80t_desc: "§WБТР-80Т — украинская модернизация БТР-80 НВК «Техимпекс».\nСтандартный двигатель заменен на более мощный турбированный мощностью 303 л.с.\nКоробка передач — 8-ступенчатая. Запас хода увеличен до 750 км.\nВооружение заменено на новый боевой модуль БМ-23-2.§!"
 UKR_modernize_btr_80_kba2_flag: "Выполнено решение §YРазработка БТР-80-КБА-2§!"
 UKR_modernize_btr_80m_hrim_flag: "Выполнено решение §YРазработка БТР-80М «Гром»§!"
 UKR_modernize_t55_5tdf: "Разработка §YТ-55-5ТДФ§!"
 UKR_modernize_t55_5tdf_desc: "§WТ-55-5ТДФ — украинская модернизация танка Т-55.\nМодернизация была проведена Харьковским конструкторским бюро имени О. О. Морозова.\nТанк оснащен дизельным двигателем 5ТДФ мощностью 700 л.с., что позволяет ему развивать скорость 60 км/ч на шоссе и 40 км/ч на бездорожье.\nТанк также оснащен новой системой управления огнем, включающей лазерный дальномер, баллистический вычислитель и тепловизионный прицел.\nБроневая защита улучшена за счет установки дополнительных бронеплит и динамической защиты.§!"
 UKR_modernize_t55_5tdf_flag: "Выполнено решение §YРазработка Т-55-5ТДФ§!"
 UKR_modernize_t55agm: "Разработка §YТ-55АГМ§!"
 UKR_modernize_t55agm_desc: "§WТ-55АГМ — украинская модернизация танка Т-55.\nТанк оснащен 5-тактным дизельным двигателем мощностью 700 л.с., что позволяет ему развивать скорость 60 км/ч на шоссе и 40 км/ч на бездорожье.\nТакже танк оборудован новой системой управления огнём, включающей лазерный дальномер, баллистический компьютер и тепловизионный прицел.\nБроневая защита улучшена за счёт установки динамической защиты.§!"
 UKR_modernize_t55agm_flag: "Выполнено решение §YРазработка Т-55АГМ§!"
 UKR_modernize_t55m8_a2_tifon_ii: "Разработка §YТ-55М8-А2 «Тифон 2»§!"
 UKR_modernize_t55m8_a2_tifon_ii_desc: "§WТ-55М8-А2 «Тифон-2» — украинская модернизация танка Т-55 для Перу.\nТанк оснащен 5-тактным дизельным двигателем мощностью 700 л.с., что позволяет ему развивать скорость 60 км/ч на шоссе и 40 км/ч на бездорожье.\nТакже танк оборудован новой системой управления огнём, включающей лазерный дальномер, баллистический компьютер и тепловизионный прицел.\nБроневая защита улучшена за счёт установки динамической защиты.§!"
 UKR_develop_t64bm_bulat: "Разработка §YТ-64БМ «Булат»§!"
 UKR_develop_t64bm_bulat_desc: "§WТ-64БМ «Булат» — это украинская модернизация, доведшая Т-64Б до уровня Т-84.\nОснащён динамической броней «Ниж», ракетой 9К120 «Рефлекс» (код НАТО AT-11 Sniper), системой управления огнём 1А45 «Иртыш», командирским прицелом ТКН-4С, прицелом зенитного пулемёта ПЗУ-7, прибором ночного видения ТПН-4Е «Буран-Е», двигателем 6ТДФ мощностью 1000 л.с. (735 кВт).\nТ-64БМ «Булат» — это последняя модернизация 2004 года.§!"
 UKR_develop_t64e: "Разработка §YТ-64Е§!"
 UKR_develop_t64e_desc: "§WТ-64Е — украинский экспериментальный основной боевой танк, представлявший собой глубокую модернизацию Т-64.\nРазработан на ХБТРЗ (Харьковском бронетанковом ремонтном заводе).\nПо сравнению с предыдущими модификациями Т-64 у модернизированного танка заметно выросли огневая мощь, подвижность и защита.\nСтоимость Т-64Е по состоянию на 2011 год составляла около $1.12 млн за единицу.§!"
 UKR_develop_t64bv_1: "Разработка §YТ-64БВ-1§!"
 UKR_develop_t64bv_1_desc: "§WТ-64БВ-1 (также известный в СМИ как Т-64Б1М/Т-64БМ1М) — упрощенная версия модернизации танков Т-64Б1, созданная в 2014 году и разработанная на Харьковском бронетанковом заводе.\nТанк имеет встроенную динамическую защиту «Ниж», которая усиливает защиту башни, лобовой части корпуса и бортов.\nВ задней части башни установлена ниша для боеприпасов и оборудования.\nНа танке установлен двигатель 5ТДФ.\nЭто упрощенный и более дешевый вариант модернизации «Булата».§!"
 UKR_develop_t64bv_2017: "Модернизация §YТ-64БВ§! до §Yобр. 2017§!"
 UKR_develop_t64bv_2017_desc: "§WТ-64БВ зр. 2017 (или модель 2017) — это продолжающаяся модернизация серии танков Т-64, целью которой является внедрение нового тепловизора для всего экипажа, демонтаж инфракрасного прожектора «Луна», установка украинского ночного видения ТПН-1-ТПВ вместо ТПН1-49-23, модулей динамической защиты «Ниж», предназначенных для установки на башни Т-64БВ, сетевого спутникового навигационного блока СН-4215 и цифровой радиостанции «Лыбид К-2РБ» (по лицензии Motorola), обеспечивающей защищенную связь на расстоянии до 70 км.§!"
 UKR_develop_t64bv_2022: "Дальнейшая модернизация §YТ-64БВ§! до §Yобр. 2022§!"
 UKR_develop_t64bv_2022_desc: "§WТ-64БВ зр. 2022 (или модель 2022) — это последняя модернизация серии танков Т-64. Танк оснащен новыми системами наблюдения и прицеливания третьего поколения, а также новым 12.7-мм крупнокалиберным пулеметом «Ласка К-2» (Snipex Laska).\nОн имеет новые современные радиостанции и дополнительные навигационные, внутренние и внешние системы связи, полностью соответствующие стандартам НАТО.\nВнешние топливные баки теперь также защищены 12-мм стальными пластинами.§!"
 UKR_develop_t64_krab: "Разработка §YТ-64 «Краб»§!"
 UKR_develop_t64_krab_desc: "§WТ-64 «Краб» — это научно-исследовательская работа по модернизации танка Т-64Б (Т-64БВ).\nКонструкторские работы выполняет Харьковское конструкторское бюро машиностроения имени Морозова.\nРаботы начались в 2016 году.\nНа Т-64 была предусмотрена установка двигателя 6ТД мощностью 1200 л.с.\nДля установки двигателя больших габаритов, чем стандартный, корпус серийного Т-64 был сшит.§!"
 UKR_develop_t_rex: "Разработка §Y«T-Rex»§!"
 UKR_develop_t_rex_desc: "§W«Т-Рекс» — украинский основной боевой танк, анонсированный в 2016 году и разработанный инженерной группой «Арей», входящей в состав батальона «Азов».\nТанк должен был быть создан на базе Т-64 и оснащаться беспилотной башней.\nТри члена экипажа должны были располагаться в бронированной капсуле в передней части корпуса, где они могли бы дистанционно управлять пушкой, автоматическим заряжающим устройством и пулеметами.\n«Т-Рекс» должен был весить 39 тонн и быть оснащен 125-мм основным орудием с «мощными снарядами».\nВ броне использовались динамическая защита «Ниж» и «Дуплет».\nУкраинская пресса утверждала, что его боевые возможности превосходят возможности украинских танков «Оплот» и «Булат», при этом он был более экономически выгоден, чем «Булат».§!"
 UKR_develop_t64bm2_bulat: "Дальнейшая модернизация §YТ-64БМ «Булат»§! до §YТ-64БМ2 «Булат-М»§!"
 UKR_develop_t64bm2_bulat_desc: "§WТ-64БМ2 (в СМИ его также называют «Булат» или «Кедр») — это модернизация танка Т-64 в рамках программы «Кедр».\nЭто технологический демонстратор, то есть научно-исследовательская работа по переоснащению танков типа Т-64 двигателем 6ТД-1, а именно по полной переработке моторного и трансмиссионного отсеков.§!"
 UKR_develop_t64bm_bulat_flag: "Выполнено решение §YРазработка Т-64БМ «Булат»§!"
 UKR_develop_t64e_flag: "Выполнено решение §YРазработка Т-64Е§!"
 UKR_develop_t64bv_1_flag: "Выполнено решение §YРазработка Т-64БВ-1§!"
 UKR_develop_t64bv_2017_flag: "Выполнено решение §YМодернизация Т-64БВ до обр. 2017§!"
 UKR_develop_t64_krab_flag: "Выполнено решение §YРазработка Т-64 «Краб»§!"
 UKR_develop_t_rex_flag: "Выполнено решение §YРазработка «T-Rex»§!"
 UKR_develop_t64bm2_bulat_flag: "Выполнено решение §YРазработка Т-64БМ2 «Булат»§!"
 UKR_develop_t64_strazh: "Разработка §YТ-64 «Страж»§!"
 UKR_develop_t72amt: "Разработка §YТ-72АМТ§!"
 UKR_develop_btr3u: "Разработать §YБТР-3У «Охоронец»§! для\nтендера §Y[UAE.GetNameWithFlag]§!"
 UKR_develop_btr3u_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_btr3u_for_tooltip\n\n\n\n\n\n\n\n\n§W§YБТР-3У «Охоронец»§! — глубокая модификация §YБТР-94К§!, созданная для текущего тендера §YОбъединённых Арабских Эмиратов§! на новый БТР для их морской пехоты. Машина оснащается двигателем Deutz BF6M1015 мощностью 326 л. с. и автоматической коробкой передач Allison MD3066 либо двигателем УТД-20 мощностью 300 л. с.\nРазработку машины вело Харьковское конструкторское бюро по машиностроению имени А. А. Морозова: конструкторская документация, разработка шасси и интеграция всех систем и вооружения.\nВооружение включает боевой модуль КБА-105 «Шквал» с 30-мм автоматической пушкой ЗТМ-1, спаренным с ней 7.62-мм пулемётом КТ-7.62, двумя пусковыми установками ПТУР 9М113М «Конкурс-М» и 30-мм автоматическим гранатомётом.\n§W--------------§!\nЧтобы §Gповысить§! шансы на победу в тендере в ОАЭ, их §Yмнение о нас§! должно быть не ниже §G40§!, иначе вероятность проигрыша, откровенно говоря, довольно высока.\n§W--------------§!\nЭто решение §Rнеобходимо§! для последующих решений о разработке преемников этой машины.\nЕсли §Rпропустить§! это решение, возможности разработать более новые версии этой машины §Rне будет§!.§!"
 UKR_develop_btr3e: "Разработка §YБТР-3Э§!"
 UKR_develop_btr3e_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_btr3e_for_tooltip\n\n\n\n\n\n\n\n\n§WБТР-3Э — модификация с двигателем УТД-20 или Deutz BF6M1015.\nОснащён боевым модулем БМ-3М «Штурм-М», в вооружение которого входят 30-мм автоматическая пушка ЗТМ-1, спаренный с ней 7.62-мм пулемёт КТ-7.62, две пусковые установки (6 ракет) «Барьер» и 30-мм автоматический гранатомёт КБА-117.§!"
 UKR_develop_btr3e1: "Разработка §YБТР-3Э1§!"
 UKR_develop_btr3e1_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_btr3e1_for_tooltip\n\n\n\n\n\n\n\n\n§WБТР-3Э1 — модификация БТР-3Э, созданная специально под требования тайского контракта 2005–2006 годов.\nГлавные отличия от БТР-3Э: установка модернизированного боевого модуля БМ-3М «Штурм», снижение высоты с 2928 до 2774 мм, увеличение боевого расчёта с 9 до 13 человек, установка радиостанции VRC-950 и размещение дополнительного боекомплекта для боевого модуля.§!"
 UKR_develop_btr3da: "Разработка §YБТР-3ДА§!"
 UKR_develop_btr3da_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_btr3da_for_tooltip\n\n\n\n\n\n\n\n\n§WБТР-3ДА — дальнейшее развитие бронетранспортёра с учётом опыта войны на востоке Украины.\nБТР-3ДА быстрее и манёвреннее предшественников, у него усилено бронирование экипажа и установлен оптико-электронный модуль с телевизионным и тепловизионным каналами.\nБлагодаря этому стала возможна стрельба ночью.\nДополнительная силовая установка позволяет управлять боевым модулем, не запуская основной двигатель.§!"
 UKR_develop_btr3u_flag: "Выполнено решение §YРазработка БТР-3У «Гардиан»§!"
 UKR_develop_btr3e_flag: "Выполнено решение §YРазработка БТР-3Э§!"
 UKR_develop_btr3e1_flag: "Выполнено решение §YРазработка БТР-3Э1§!"
 UKR_develop_btr3da_flag: "Выполнено решение §YРазработка БТР-3ДА§!"
 UKR_develop_btr3e1_cse90lp: "Разработка §YБТР-3Э1 CSE90LP§!"
 UKR_develop_btr3e1_cse90lp_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_btr3_cse90lp_for_tooltip\n\n\n\n\n\n\n\n\n§WБТР-3Э1 CSE90LP — это модификация БТР-3Э1, оснащенная башней Cockerill CSE 90LP с 90-мм малокалиберной пушкой.\nБашня оборудована спаренным 7.62-мм пулеметом и 40-мм автоматическим гранатометом.\nБашня оснащена автоматической системой управления огнем, включающей лазерный дальномер, тепловизор и баллистический вычислитель.§!"
 UKR_develop_btr3e1_cpws30: "Разработка §YБТР-3Э CPWS-30§!"
 UKR_develop_btr3e1_cpws30_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_btr3_cpws30_for_tooltip\n\n\n\n\n\n\n\n\n§WБТР-3Э КПВС-30 — это модификация БТР-3Э, оснащенная башней КПВС-30 с 30-мм автоматической пушкой.\nБашня оборудована спаренным 7.62-мм пулеметом и 40-мм автоматическим гранатометом.\nБашня оснащена автоматической системой управления огнем, включающей лазерный дальномер, тепловизор и баллистический вычислитель.§!"
 UKR_develop_btr4_choose_role: "Выбрать роль для §YБТР-4§!"
 UKR_develop_btr4_choose_role_desc: "\n\n\n\n\n\n£UKR_desctext_btr4_roles_for_tooltip\n\n\n\n\n\n\n\n\n§W§YBTR-4§! задумывался как шаг вперед по сравнению с предыдущими советскими образцами и изначально был разработан с учетом более тяжелого вооружения.\nМы можем выбрать желаемую роль для этой техники — более легкий и дешевый БТР или более дорогая и тяжело вооруженная БМП.\nНаше решение повлияет на то, какими батальонами будут оснащены БТР-4: механизированными или бронетанковыми.\nУ нас будет возможность производить практически один и тот же тип техники, но в противоположной роли, если мы этого захотим.§!"
 UKR_develop_btr4_apc_role_choose_module: "Выбрать основное вооружение для §YБТР-4§! в роли БТР"
 UKR_develop_btr4_apc_role_choose_module_desc: "\n\n\n\n\n\n£UKR_desctext_btr4_apc_modules_for_tooltip\n\n\n\n\n\n\n\n\n§WМы можем принять решение о том, какое именно основное вооружение будет использоваться в нашем недавно разработанном §YБТР-4§!.§!"
 UKR_develop_btr4_ifv_role_choose_module: "Выбрать основное вооружение для §YБТР-4§! в роли БМП"
 UKR_develop_btr4_ifv_role_choose_module_desc: "\n\n\n\n\n\n£UKR_desctext_btr4_ifv_modules_for_tooltip\n\n\n\n\n\n\n\n\n§WМы можем принять решение о том, какое именно основное вооружение будет использоваться в нашей новой БМП §YБТР-4§!.§!"
 UKR_develop_btr4_apc_role_choose_engine: "Выбрать двигатель для §YБТР-4§! в роли БТР"
