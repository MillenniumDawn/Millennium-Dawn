 boat_arrivals_ast: "Прибытие лодок"
 boat_arrivals_ast_desc: "Эта проблема десятилетиями мучает правительства нашей страны. Для иммигрантов, желающих обойти очередь и добраться до места назначения контрабандой на лодках или подобными способами, въезд, хотя и является незаконным, технически не считается уголовным преступлением. Из-за этого оформление документов для этих нелегальных граждан стало трудоемким и дорогостоящим процессом, который нелегально решить."
