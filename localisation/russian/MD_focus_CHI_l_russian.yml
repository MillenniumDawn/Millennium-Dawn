 CHI_20_national_congress_mission_desc: "XX Всекитайский съезд состоится в 2022 году на фоне дискуссий о преемственности руководства и ограничениях срока полномочий."
 CHI_21_national_congress_mission: "XXI съезд Коммунистической партии Китая"
 CHI_21_national_congress_mission_desc: "В 2027 году состоится XXI Всекитайский съезд, на котором будет определён курс партии на следующий этап."
 CHI_abolish_birth_limits: "Отмена ограничений рождаемости"
 CHI_abolish_birth_limits_desc: "Все оставшиеся ограничения на размер семьи официально отменены. Государство переходит от ограничения рождаемости к её активному поощрению, положив конец эпохе контроля над рождаемостью, начавшейся при Мао и закреплённой на институциональном уровне при Дэн Сяопине. Это изменение свидетельствует о признании того факта, что затраты на обеспечение соблюдения ограничений в настоящее время превышают любую демографическую выгоду от таких ограничений, а уровень добровольной рождаемости уже значительно ниже уровня воспроизводства населения."
 CHI_activate_princeling_network: "Задействовать сеть «принцев»"
 CHI_activate_princeling_network_desc: "Контакты с выпускниками, деловые связи и ресурсы генерального штаба объединяются в единый скоординированный инструмент реализации политики. «Сеть принцев» начинает действовать в качестве нашего решающего рычага давления на Пхеньян."
 CHI_activate_rare_earth_embargo: "Ввести эмбарго на редкоземельные металлы"
 CHI_activate_rare_earth_embargo_desc: "Прекратить экспорт вольфрама и хрома в Японию. Эмбарго будет действовать до тех пор, пока оно не будет снято, Япония не капитулирует или Токио не диверсифицирует свои источники поставок."
 CHI_adopt_three_child_policy: "Одна семья — три ребёнка"
 CHI_adopt_three_child_policy_desc: "По итогам переписи населения 2020 года Пекин разрешил супружеским парам иметь до трёх детей и сопроводил это объявление пакетом субсидий, продлённым родительским отпуском и ограничением расходов на частные занятия с репетиторами. Аналитики отмечают, что Южная Корея, Япония и Сингапур пробовали применять аналогичные меры, но их эффективность оказалась ограниченной; быстро растущая стоимость жизни в городах Китая и культурный сдвиг в сторону меньших по размеру семей создают те же структурные препятствия."
 CHI_adopt_two_child_policy: "Одна семья — два ребёнка"
 CHI_adopt_two_child_policy_desc: "Государственный совет объявляет о введении всеобщей политики «два ребенка», которая вступает в силу 1 января 2016 года. Ограничение на рождение одного ребенка, действовавшее с 1980 года, отменяется для всех супружеских пар. Эксперты по демографическому моделированию прогнозируют лишь незначительный рост рождаемости: после десятилетий, когда нормой были малодетные семьи, стоимость жизни, цены на жилье и участие женщин в трудовой деятельности сдерживают рождаемость на уровне, значительно ниже уровня воспроизводства населения, даже без каких-либо правовых ограничений."
 CHI_anti_desertification_belt: "Расширение защитных лесополос «Трёх Северов»"
 CHI_anti_desertification_belt_desc: "Программа защитных лесополос «Трёх Северов», реализуемая с 1978 года на территории Северного Китая, Внутренней Монголии и Северо-Востока, является крупнейшей в мире кампанией по лесопосадкам, в рамках которой к 2050 году планируется высадить в общей сложности 88 миллиардов деревьев. Новые этапы посадки сосредоточены на создании смешанных насаждений, которые укрепляют почву, удерживают талую воду и восстанавливают деградированные водосборные бассейны на Лёссовом плато и в песчаных землях Хуньшандаке. Восстановленный растительный покров снижает нанос осадочных отложений в реке Хуанхэ и замедляет продвижение пустыни Гоби на юг."
 CHI_Asset_Seizure: "Изъять стратегический актив"
 CHI_Asset_Seizure_desc: "Перевести один проблемный инфраструктурный актив под контроль Китая и уменьшить основной долг на стоимость одного проекта. Доступно только на пути «Хищническое кредитование»."
 CHI_asteroid_mining_investment: "Инвестировать в добычу на астероидах"
 CHI_asteroid_mining_investment_desc: "Вложить капитал в коммерческий проект по освоению космических ресурсов. Успешная реализация проекта обеспечит постоянный промышленный доход за счет добычи металлов платиновой группы, редкоземельных элементов, летучих веществ, а также производства в условиях микрогравитации. Мы можем одновременно поддерживать не более пяти таких проектов."
 CHI_asteroid_survey_mission: "Исследовать околоземные астероиды"
 CHI_asteroid_survey_mission_desc: "Опираясь на опыт навигации в далёком космосе, проверенный в ходе миссии «Тяньвэнь», разведочный зонд составит карты орбит и определит минеральный состав доступных околоземных астероидов. Успешное проведение таких исследований откроет путь к коммерческой добыче космических ресурсов."
 CHI_automation_robotics_push: "Курс на автоматизацию и робототехнику"
 CHI_automation_robotics_push_desc: "Китай стал крупнейшим в мире установщиком промышленных роботов, ежегодно вводя в эксплуатацию больше единиц, чем Европейский союз и США вместе взятые. Ускорение этого процесса, осуществляемое под руководством государства, нацелено на трудоемкие производственные секторы, испытывающие наиболее острую нехватку рабочей силы. Инвестиции направляются в коллаборативных роботов, производственные линии с использованием искусственного интеллекта и интеллектуальные логистические системы, что позволяет заменить трудовые ресурсы, сокращающиеся в связи с демографическим спадом, капиталом."
 CHI_avic_innovation: "AVIC: оригинальные инновации"
 CHI_avic_innovation_desc: "Aviation Industry Corporation of China (AVIC) — это обширная головная компания, объединяющая всю авиастроительную отрасль страны. Если заставить её институты внедрять инновации, а не копировать, ускорится разработка самолётов, от которых зависит военно-воздушная мощь Китая."
 CHI_back_nepalese_communists: "Поддержать непальских коммунистов"
 CHI_back_nepalese_communists_desc: "Направлять финансовые средства и оказывать идеологическую поддержку коммунистическим группировкам в Катманду, постепенно смещая политический баланс Непала в сторону Пекина."
 CHI_beijing_hosted_talks: "Провести экстренный саммит в Пекине"
 CHI_beijing_hosted_talks_desc: "Пригласить корейских лидеров в Пекин для проведения экстренного посредничества. Когда двусторонние переговоры зашли в тупик, только Китай в качестве принимающей стороны может вернуть обе стороны за стол переговоров."
 CHI_beijing_washington_consultation: "Начать консультации Пекина и Вашингтона"
 CHI_beijing_washington_consultation_desc: "Неофициальный канал связи с Госдепартаментом США позволяет Пекину и Вашингтону решать корейский вопрос в обход Сеула. Такая ситуация вызывает беспокойство в Токио, который опасается оказаться в стороне."
 CHI_big_fund_iii_allocate_tranche_decision: "Выделить транш «Большого фонда III»"
 CHI_big_fund_iii_allocate_tranche_decision_desc: "Третий этап реализации Национального инвестиционного фонда по развитию индустрии интегральных схем, объем которого составляет 344 миллиарда юаней, предусматривает выделение средств целевому подсектору. Каждый транш способствует выходу очередного завода по производству интегральных схем на полную загрузку."
 CHI_boycott_lotte: "Бойкот Lotte"
 CHI_boycott_lotte_desc: "Организовать массовый бойкот объектов Lotte Group в Китае в ответ на аренду компанией Lotte земельного участка для размещения системы THAAD."
 CHI_BRI_Forum_Triennial: "Провести форум «Один пояс и один путь»"
 CHI_BRI_Forum_Triennial_desc: "Провести в Пекине проводимый раз в три года Форум «Один пояс и один путь». Главы государств из стран, входящих в эту сеть, соберутся, чтобы подтвердить свои обязательства и объявить о новых флагманских проектах. Требуется наличие средств в казне инициативы «Один пояс и один путь» в размере не менее 150. Крупные расходы из казны с трехлетним периодом ожидания."
 CHI_BRI_management: "Инициатива «Один пояс и один путь»"
 CHI_BRI_management_desc: "Инициатива «Один пояс и один путь» — главный инструмент экономической политики Китая: кредиты направляются в порты, железные дороги, энергетические коридоры и цифровую инфраструктуру стран-партнёров по всему миру. Каждый проект одновременно укрепляет физическую связность и политическое влияние.\n\n§YКазна:§! ¥[?CHI_bri_treasury|0] млрд | Ежемесячный взнос: +[?CHI_bri_monthly_income_total|0]\n§YПроекты:§! [?CHI_bri_committed_projects|0]/[?CHI_bri_project_slots|0] в работе | §G[?CHI_bri_completed_projects|0]§! завершено | §R[?CHI_bri_defaulted_projects|0]§! дефолтов всего\n§YДоход от кредитов:§! [?CHI_bri_loan_income|2] в неделю | §YГлобальное присутствие:§! [?CHI_bri_global_presence|0]\n§GВзаимное развитие [?CHI_bri_winwin_score|0]§! · §RХищничество [?CHI_bri_predatory_score|0]§!"
 CHI_BRI_promote_digital_silk_road: "Повысить уровень «Цифрового Шёлкового пути»"
 CHI_BRI_promote_digital_silk_road_desc: "Когда показатели телекоммуникационной инфраструктуры превысят установленный порог, данное решение повышает уровень национального духа «Цифровой Шёлковый путь», что отражает развёртывание построенных Китаем оптоволоконных сетей, наземных спутниковых станций и мобильной инфраструктуры, поставляемой компанией Huawei, на территории государств-партнеров."
 CHI_BRI_promote_economic_zones: "Повысить уровень особых экономических зон"
 CHI_BRI_promote_economic_zones_desc: "Когда показатель развития промышленных зон превысит установленный порог, данное решение повышает уровень национального духа «Особые экономические зоны», отражая создание управляемых Китаем центров экспортной переработки и логистики, которые служат опорой для цепочек поставок и обеспечивают льготные условия для китайских предприятий в странах-партнерах."
 CHI_BRI_promote_energy_arteries: "Повысить уровень энергетических артерий"
 CHI_BRI_promote_energy_arteries_desc: "Когда показатель строительства трубопроводов превысит требуемый порог, данное решение повышает уровень национального духа «Энергетические артерии», что отражает расширение инфраструктуры транспортировки нефти и газа, связывающей производителей из Центральной Азии с китайскими нефтеперерабатывающими заводами и снижающей зависимость от морских узких мест."
 CHI_BRI_promote_maritime_network: "Повысить уровень морской сети"
 CHI_BRI_promote_maritime_network_desc: "Когда количество построенных в рамках инициативы «Один пояс и один путь» портов превысит установленный порог, это решение повышает уровень национального духа «Морская сеть», расширив влияние Китая на морские торговые пути и обеспечив льготный доступ к портам от Индийского океана до Средиземного моря."
 CHI_BRI_promote_overland_corridors: "Повысить уровень наземных коридоров"
 CHI_BRI_promote_overland_corridors_desc: "Когда показатель строительства железных дорог превысит требуемый порог, данное решение повышает уровень национального духа «Наземные коридоры», что будет отражать завершение строительства дополнительных трансконтинентальных железнодорожных линий, способствующих снижению транспортных издержек и углублению экономической взаимозависимости в Центральной Азии и на Кавказе."
 CHI_BRI_promote_power_generation: "Повысить уровень сети электрогенерации"
 CHI_BRI_promote_power_generation_desc: "Когда объем строительства электростанций, финансируемого в рамках инициативы «Один пояс и один путь», превышает установленный порог, данное решение повышает уровень национального духа «Сеть электрогенерации», отражая строительство угольных, гидро- и солнечных электростанций китайскими компаниями, которые поставляют электроэнергию странам-партнерам, одновременно создавая долгосрочную зависимость в сфере технического обслуживания."
 CHI_BRI_promote_prestige_diplomacy: "Повысить уровень престижной дипломатии"
 CHI_BRI_promote_prestige_diplomacy_desc: "Когда количество завершенных престижных проектов превышает установленный порог, это решение повышает уровень национального духа «Престижная дипломатия», отражая строительство знаковых стадионов, правительственных зданий и культурных центров, которые способствуют укреплению доброй воли и демонстрируют масштабы китайского государственного управления."
 CHI_BRI_promote_resource_concessions: "Повысить уровень ресурсных концессий"
 CHI_BRI_promote_resource_concessions_desc: "Когда количество обеспеченных концессий на добычу полезных ископаемых превышает установленный порог, данное решение повышает уровень национального духа «Ресурсные концессии», представляющего собой долгосрочные соглашения о добыче меди, кобальта, лития и других стратегически важных минералов, которые обеспечивают сырьем производственные цепочки Китая."
 CHI_BRI_recipient_actions: "Инициатива «Один пояс и один путь»"
 CHI_BRI_recipient_actions_desc: "Подайте заявку на получение финансирования от Китайской Народной Республики для реализации проектов в рамках инициативы «Один пояс и один путь»."
 CHI_build_mega_rail_hub: "Построить крупный железнодорожный узел"
 CHI_build_mega_rail_hub_desc: "Построить обширный интегрированный железнодорожный терминал в одном из крупных городов Китая, сопоставимый по масштабам с терминалами «Пекин-Южный», «Шанхай-Хунцяо» или «Гуанчжоу-Южный». Эти транспортные узлы объединяют высокоскоростные железнодорожные линии, метро и междугородние маршруты в единый узел и способствуют ускорению строительства и развития логистики во всем регионе."
 CHI_build_public_housing: "Строить государственное жильё"
 CHI_build_public_housing_desc: "Мобилизовать строительные бригады для возведения государственного жилья, предназначенного для сдачи в аренду, в стране [FROM.GetName]. Эти проекты на два года задействуют производственные мощности гражданских предприятий и по завершении строительства снизят нагрузку на национальный рынок потребительских товаров."
 CHI_caic_innovation: "CAIC: оригинальные инновации"
 CHI_caic_innovation_desc: "Компания Changhe Aircraft Industries производит специализированные ударные вертолеты для Народно-освободительной армии Китая — от модели Z-10 до Z-19. Предоставление инженерам свободы для принятия рискованных решений ускоряет создание ударного вертолетного парка, который долгое время отставал от западных разработок."
 CHI_cancel_east_china_sea_exercise: "Отменить учения в Восточно-Китайском море"
 CHI_cancel_east_china_sea_exercise_desc: "Морские и воздушные учения вблизи спорных островов Сенкаку (или Дяоюй) регулярно обостряют отношения с Токио. Отказ от проведения запланированных учений свидетельствует о сдержанности, успокаивает Японию и подкрепляет идею мирного подъема."
 CHI_casc_innovation: "CASC: оригинальные инновации"
 CHI_casc_innovation_desc: "China Aerospace Science and Technology Corporation отвечает за космические запуски, баллистические ракеты и спутники страны. Её реформирование способствует ускоренному развитию орбитальных и стратегических систем, лежащих в основе китайского потенциала сдерживания."
 CHI_casic_innovation: "CASIC: оригинальные инновации"
 CHI_casic_innovation_desc: "China Aerospace Science and Industry Corporation занимается производством крылатых и тактических ракет страны — от ракет семейства YJ до систем нанесения ударов по наземным целям. Предоставление её конструкторским бюро возможности идти на риск способствует совершенствованию арсенала средств точного удара."
 CHI_central_theatre_command: "Командование Центрального ТВД"
 CHI_central_theatre_command_desc: "Командование Центрального театра военных действий в Пекине является стратегическим резервом и щитом столицы. Оно обладает полномочиями по командованию и поддерживает боевой дух войск, обеспечивающих поддержку на всех остальных направлениях."
 CHI_cetc_innovation: "CETC: оригинальные инновации"
 CHI_cetc_innovation_desc: "China Electronics Technology Group поставляет радиолокационные станции, датчики и системы управления боевыми действиями, лежащие в основе каждой современной платформы. Реформирование культуры научных исследований способствует продвижению китайских технологий в области вычислений и искусственного интеллекта к передовым рубежам."
 CHI_chang_e_mission: "Запустить зонд «Чанъэ»"
 CHI_chang_e_mission_desc: "Роботизированная миссия «Чанъэ» отправляется на Луну для посадки, проведения исследований и передачи данных через спутник-«мост» «Цюэцяо». Полученные данные позволят составить карту местности для космонавтов, которые отправятся туда вслед. Шансы на успех растут по мере накопления опыта в области запусков."
 CHI_cheju_summit_arrangement: "Организовать саммит на Чеджу"
 CHI_cheju_summit_arrangement_desc: "Курортный остров Чеджу, или Джеджу, представляет собой нейтральную площадку для переговоров на высоком уровне с Южной Кореей. Саммит может привести к дипломатическому прорыву, однако плохо подготовленная встреча чревата публичным провалом, который приведет к ужесточению позиций обеих сторон."
 CHI_convene_bilateral_channel: "Открыть двусторонний канал"
 CHI_convene_bilateral_channel_desc: "«Четырёхсторонний диалог по вопросам безопасности» объединяет США, Японию, Индию и Австралию в противовес Пекину. Открытие неформального двустороннего канала связи с Токио вызывает сомнения в сплочённости этого объединения и замедляет процесс его укрепления."
 CHI_crack_down_tibet_separatism: "Подавить тибетский сепаратизм"
 CHI_crack_down_tibet_separatism_desc: "Пресекать деятельность сепаратистских организаций на всей территории Тибета с помощью скоординированных мер в сфере безопасности и государственного управления. Укреплять центральную власть и ускорять процесс интеграции."
 CHI_crack_down_xinjiang_separatism: "Подавить синьцзянский сепаратизм"
 CHI_crack_down_xinjiang_separatism_desc: "Развернуть силы внутренней безопасности по всему Синьцзяну с целью ликвидации сепаратистских ячеек. Это усиливает государственный контроль над регионом и способствует соблюдению законов, но вызывает пристальное внимание со стороны международного сообщества."
 CHI_crewed_lunar_landing_mission: "Высадить космонавтов на Луну"
 CHI_crewed_lunar_landing_mission_desc: "Ракета-носитель «Чанчжэн-10» выводит с космодрома Вэньчан пилотируемый модуль «Мэнчжоу» и посадочный модуль «Ланьюэ» для отдельных запусков, после чего они состыкуются на лунной орбите. Экипаж должен спуститься в район южного полюса Луны, установить флаг и благополучно вернуться на Землю, благодаря чему Китай станет второй страной, высадившей людей на Луну."
 CHI_critical_minerals_export_license_decision: "Ограничение экспорта критически важных минералов"
 CHI_critical_minerals_export_license_decision_desc: "Ограничить экспорт галлия, германия и редкоземельных элементов в соответствии с системой лицензирования, введенной в августе 2023 года. По мере сокращения предложения выручка на тонну растет."
 CHI_crrc_innovation: "CRRC: оригинальные инновации"
 CHI_crrc_innovation_desc: "China Railway Rolling Stock Corporation является крупнейшим в мире производителем железнодорожного оборудования — это огромный комплекс тяжелой промышленности двойного назначения. Направление ее инженерных разработок в оборонную сферу способствует укреплению промышленной базы, лежащей в ее основе."
 CHI_csgc_innovation: "CSGC: оригинальные инновации"
 CHI_csgc_innovation_desc: "China South Industries Group наряду с производством гражданских автомобилей занимается созданием боевых бронированных машин и легкого вооружения для армии. Если преодолеть её осторожность, откроется целое семейство современных боевых машин."
 CHI_csic_innovation: "CSIC: оригинальные инновации"
 CHI_csic_innovation_desc: "China Shipbuilding Industry Corporation — историческая колыбель китайского подводного кораблестроения — стоит у руля «бесшумного флота», действующего под волнами. Реформирование входящих в нее институтов ускоряет разработку нового поколения ударных подводных лодок и подводных лодок с баллистическими ракетами."
 CHI_cssc_innovation: "CSSC: оригинальные инновации"
 CHI_cssc_innovation_desc: "China State Shipbuilding Corporation — это гигант, стоящий за созданием надводного флота Военно-морских сил Народно-освободительной армии Китая, включая авианосцы. Создание условий для инноваций на её верфях способствует ускоренному строительству военных кораблей для флота, способного действовать в открытом море."
 CHI_cultivate_pyongyang_contacts: "Налаживать контакты в Пхеньяне"
 CHI_cultivate_pyongyang_contacts_desc: "Китай по-прежнему остается незаменимым покровителем Северной Кореи, поставляя ей основную часть топлива и продовольствия. Налаживание незаметных связей в рядах руководства Пхеньяна позволяет Пекину влиять на внутреннюю стабильность режима без явного вмешательства."
 CHI_current_congress_mission: "Идёт Всекитайский съезд"
 CHI_current_congress_mission_desc: "Проходит Всекитайский съезд. Завершается процесс назначения членов комитетов."
 CHI_cxmt_hbm_qualification_decision: "Сертифицировать HBM от CXMT для отечественного ИИ"
 CHI_cxmt_hbm_qualification_decision_desc: "Включить память CXMT с высокой пропускной способностью в конфигурации ускорителей Cambricon, Biren и Moore Threads, что позволит избавиться от зависимости от Nvidia и Samsung при выполнении внутренних задач в области искусственного интеллекта."
 CHI_dandong_military_district: "Усилить Дандунский военный округ"
 CHI_dandong_military_district_desc: "Город Дандун расположен на реке Ялу напротив Северной Кореи и является основным пунктом пересечения китайско-северокорейской границы. Укрепление гарнизона на Северо-Востоке соответствует доктрине «Как губы и зубы» о взаимной обороне с Пхеньяном и укрепляет маньчжурскую границу."
 CHI_de_escalate_at_LAC: "Деэскалация на линии фактического контроля"
 CHI_de_escalate_at_LAC_desc: "После столкновений в долине Галван в 2020 году Китай и Индия находились в состоянии напряжённого противостояния вдоль спорной линии фактического контроля в Ладаке. Приказ пограничным подразделениям отступить с передовых позиций способствует смягчению конфронтации с Дели и снижению напряжённости в регионе."
 CHI_Debt_Restructuring: "Реструктурировать долг партнёра"
 CHI_Debt_Restructuring_desc: "Снизить ставку партнёра, допустившего дефолт, до 2% и предоставить год без платежей. Основной долг сохраняется. Доступно только на пути «Взаимовыгодное сотрудничество»."
 CHI_deploy_paf_maritime_militia: "Развернуть морскую милицию Народных вооружённых сил"
 CHI_deploy_paf_maritime_militia_desc: "Постоянное присутствие морской милиции в районе островов Дяоюйдао. Каждый месяц это усиливает давление на Сенкаку и повышает риск возникновения инцидента."
 CHI_drip_irrigation_rollout: "Внедрение капельного орошения"
 CHI_drip_irrigation_rollout_desc: "Китайское сельское хозяйство ежегодно потребляет более 360 миллиардов кубических метров воды, причем большая часть этого объема приходится на орошение методом полива по бороздам, эффективность которого редко превышает 50 процентов. Внедрение по всей стране систем капельного и микроорошения, разработанных по образцу израильского опыта в области точного земледелия и опробованных в хлопковом поясе Синьцзяна, позволяет сократить потребление воды на полях на 30–50 процентов на гектар. Программы субсидирования оборудования и обязательные стандарты эффективности для новых ирригационных районов способствуют распространению этой технологии с демонстрационных ферм на более широкий сельскохозяйственный сектор."
 CHI_duv_breakthrough_decision: "Форсировать программу DUV от SMEE"
 CHI_duv_breakthrough_decision_desc: "Провести демонстрацию технологии иммерсионной литографии по 28-нм технологическому процессу компании Shanghai Micro Electronics. Успех перекроет правила игры на мировом рынке оборудования; провал приведет к потере капитала и сдвинет сроки реализации проекта еще на год."
 CHI_eastern_theatre_command: "Командование Восточного ТВД"
 CHI_eastern_theatre_command_desc: "Командование Восточного театра военных действий, штаб-квартира которого расположена в Нанкине, контролирует Тайваньский пролив и Восточно-Китайское море. Его силы построены с учетом проведения десантных операций и обладают огневой мощью, необходимой для прорыва укреплённой береговой линии."
 CHI_eleventh_five_year_plan_mission: "11-й пятилетний план"
 CHI_eleventh_five_year_plan_mission_desc: "В 11-м пятилетнем плане Китая (2006–2010 гг.) определены шесть обязательных целей развития в таких областях, как экономический рост, расширение сферы услуг, промышленный потенциал, национальная инфраструктура, энергоэффективность и социальное обеспечение. Национальная комиссия по развитию и реформам будет отслеживать ход реализации этих целей в течение пятилетнего периода."
 CHI_establish_dandong_safe_houses: "Создать конспиративные квартиры в Дандуне"
 CHI_establish_dandong_safe_houses_desc: "Создать конспиративные квартиры вдоль реки Ялу для размещения и организации перебежчиков, сторонников Чан Сон Тхэка. Это станет незаметной отправной точкой для будущих операций."
 CHI_fabless_provincial_subsidy_decision: "Провинциальный раунд субсидий fabless-компаниям"
 CHI_fabless_provincial_subsidy_decision_desc: "Шанхай, Шэньчжэнь и Пекин дополняют транш центрального «Большого фонда» собственными средствами венчурного финансирования, предназначенными для кластера fabless-разработчиков."
 CHI_facilitate_family_reunions: "Содействовать встречам разделённых семей"
 CHI_facilitate_family_reunions_desc: "Использовать китайские логистические сети для организации трансграничных встреч семей. Гуманитарная польза от этой меры сопоставима с дипломатической доброй волей, которую она вызывает."
 CHI_factional_balance_category: "Баланс фракций"
 CHI_factional_balance_category_desc: "Коммунистическая партия Китая не является монолитной. Конкурирующие между собой фракции, основанные на сетях патронажа, идеологических течениях и карьерных траекториях, борются за влияние на кадровые назначения, экономическую политику и темпы политических реформ. Поддержание баланса сил между этими внутренними блоками является необходимым условием стабильного управления."
 CHI_FOCAC_Summit: "Созвать саммит ФОКАК"
 CHI_FOCAC_Summit_desc: "Провести проводимый раз в три года саммит Форума китайско-африканского сотрудничества. Стоит по 50 из фонда инициативы «Один пояс и один путь» и из государственной казны, а также политического капитала; перезарядка — три года."
 CHI_fund_princeling_ventures: "Финансировать бизнес «принцев»"
 CHI_fund_princeling_ventures_desc: "Финансировать трансграничные предприятия, которыми управляют северокорейские «принцы». Богатство, связанное с китайским капиталом, формирует лояльность, которую не способна обеспечить идеология."
 CHI_fusion_program: "Национальная программа термоядерного синтеза"
 CHI_fusion_program_desc: "Сконцентрировать национальные исследования в области управляемого ядерного синтеза в Хэфэе, где расположены экспериментальный усовершенствованный сверхпроводящий токамак (EAST), установка BEST и планируемый к строительству Китайский инженерный испытательный реактор термоядерного синтеза. Освоение технологии «искусственного солнца» обещает стать источником чистой электроэнергии безграничного объема."
 CHI_gobi_desert_solar_expansion: "Этап расширения солнечной и ветроэнергетики в Гоби"
 CHI_gobi_desert_solar_expansion_desc: "Запустить реализацию очередного этапа строительства солнечных батарей и ветряных турбин в пустыне Гоби, тем самым расширив мощности по производству энергии из возобновляемых источников. Каждый этап требует значительных ресурсов гражданского строительства и временно снижает общий объем строительных работ по всей стране."
 CHI_grey_society_crisis: "Кризис стареющего общества"
 CHI_grey_society_crisis_desc: "Численность населения Китая трудоспособного возраста достигла пика примерно в 2011 году и с тех пор неуклонно сокращается. Четыре десятилетия политики «один ребёнок» привели к переворачиванию возрастной пирамиды: один ребёнок теперь, как правило, содержит двух родителей и четырёх дедушек и бабушек, в то время как расходы на пенсии и здравоохранение растут быстрее, чем ВВП. Следующее десятилетие станет испытанием для Китая: сможет ли страна поддерживать экономический рост в условиях сокращения трудовых ресурсов и роста численности пожилого населения? Этот кризис будет продолжаться годами; принятие мер по его смягчению позволит сократить его продолжительность."
 CHI_haig_innovation: "HAIG: оригинальные инновации"
 CHI_haig_innovation_desc: "Harbin Aircraft Industry Group производит транспортные и многоцелевые вертолеты для Народно-освободительной армии Китая, в том числе модели Z-9 и новый Z-20. Освобождение конструкторов от лишних обязательств ускоряет создание универсального парка вертолетов."
 CHI_hsr_beijing_shanghai: "Высокоскоростная магистраль Пекин — Шанхай"
 CHI_hsr_beijing_shanghai_desc: "Построить высокоскоростную железнодорожную линию Пекин-Шанхай протяженностью 1 318 километров, соединяющую политическую и финансовую столицы Китая. На момент открытия это будет самый загруженный в мире коридор высокоскоростного железнодорожного сообщения, который позволит сократить время в пути с четырнадцати часов до четырёх часов сорока минут при скорости 300 км/ч."
 CHI_hsr_beijing_tianjin: "Междугородняя железная дорога Пекин — Тяньцзинь"
 CHI_hsr_beijing_tianjin_desc: "Строительство 117-километровой междугородней железнодорожной линии Пекин-Тяньцзинь - нашей первой высокоскоростной линии, рассчитанной на коммерческую скорость 350 км/ч. Время в пути между этими двумя городами сократится с 70 до 30 минут, что станет основой для формирования единого экономического коридора «Пекин-Тяньцзинь-Хэбэй»."
 CHI_hsr_chengdu_chongqing: "Высокоскоростная магистраль Чэнду — Чунцин"
 CHI_hsr_chengdu_chongqing_desc: "Построить высокоскоростную железнодорожную линию между Чэнду и Чунцином — двумя основными опорами стратегии развития западных регионов. Завершение строительства позволит объединить эти два мегаполиса в единый экономический круг, охватывающий территорию, до которой можно добраться за один час, и станет основой расширяющейся сети высокоскоростных железных дорог на западе страны."
 CHI_hsr_wuhan_guangzhou: "Высокоскоростная магистраль Ухань — Гуанчжоу"
 CHI_hsr_wuhan_guangzhou_desc: "Построить высокоскоростную железнодорожную линию Ухань-Гуанчжоу протяженностью 1 069 километров, соединяющую центральный Китай с промышленным центром дельты Жемчужной реки. На момент открытия это самая длинная в мире высокоскоростная железнодорожная линия, которая сокращает время в пути с более чем десяти часов до менее чем трёх."
 CHI_identify_beida_alumni: "Выявить выпускников Пекинского университета"
 CHI_identify_beida_alumni_desc: "Составить досье на детей северокорейской элиты, получивших образование в Пекинском университете. Их связи с Китаем и реформистские взгляды делают их потенциальными кандидатами на должности в будущем правительстве."
 CHI_industrial_investment_category: "Программа инвестиций в нефтехимию и энергетику"
 CHI_industrial_investment_category_desc: "Стратегические решения в области промышленных инвестиций, определённые на основе деревьев фокусов Китая в сфере нефтехимической промышленности и возобновляемых источников энергии."
 CHI_initiate_joint_exercises_with_RAJ: "Начать совместные учения с Индией"
 CHI_initiate_joint_exercises_with_RAJ_desc: "Провести совместные учения с Вооружёнными силами Индии с целью укрепления доверия и закрепления достижений в области деэскалации напряжённости на границе."
 CHI_initiate_joint_military_training: "Начать совместную подготовку «Железных братьев»"
 CHI_initiate_joint_military_training_desc: "Провести совместные учения с Вооружёнными силами Пакистана с целью повышения оперативной совместимости и согласования доктрин."
 CHI_inner_mongolia_innovation: "First Machinery Group: оригинальные инновации"
 CHI_inner_mongolia_innovation_desc: "Inner Mongolia First Machinery Group — колыбель китайской бронетехники, на заводах которой в Баотоу производится основной боевой танк типа 99. Преодоление бюрократической осторожности открывает путь для создания нового поколения тяжелых боевых машин."
 CHI_insert_jang_assets: "Внедрить агентов Чан Сон Тхэка"
 CHI_insert_jang_assets_desc: "Под прикрытием вернуть агентов, связанных с Чан Сон Тхэком, в КНДР. Там они будут ждать получения приказа."
 CHI_invest_domestic_arms_lines: "Инвестировать в отечественные оружейные линии"
 CHI_invest_domestic_arms_lines_desc: "Направить государственные средства на производственные линии компаний NORINCO и AVIC, чтобы заказы НОАК выполнялись внутри страны, а не в рамках контрактов с «Рособоронэкспортом». Каждый раунд инвестиций сокращает отставание от российских поставщиков."
 CHI_invite_basf_caojing: "Интеграция BASF Verbund"
 CHI_invite_basf_caojing_desc: "Утвердить предложение компании BASF о строительстве интегрированного химического комплекса Verbund в химическом промышленном парке Цаоцзин и прибрежной зоне Чжаньцзяна. Инвестиции в размере 8,7 млрд евро позволят объединить передовое производство полимеров и акриловых материалов с моделью технологической интеграции, которая связывает инженерные сети, сырьевые и побочные потоки на восемнадцати химических заводах — это первый объект Verbund за пределами Европы."
 CHI_invite_bayer_nanjing: "Центр материаловедения Covestro"
 CHI_invite_bayer_nanjing_desc: "Предложить компании Covestro (ранее Bayer MaterialScience) открыть региональный научно-производственный центр в Шанхае. Этот комплекс стоимостью 3 млрд евро будет заниматься производством поликарбонатов, прекурсоров полиуретана и высокотехнологичных покрытий, а также станет местом переноса глобального научно-исследовательского центра подразделения из Германии, что позволит передать экспертные знания в области химии полимеров, применимые к промышленным и высокоэффективным материалам."
 CHI_invite_exxonmobil_jv: "Совместное предприятие ExxonMobil в Цюаньчжоу"
 CHI_invite_exxonmobil_jv_desc: "Утвердить приобретение компанией «Эксонмобил» 25-процентной доли в акционерном капитале компании Fujian Refining and Petrochemical Company в Цюаньчжоу, что позволит создать первый полностью интегрированный китайско-иностранный нефтеперерабатывающий и нефтехимический комплекс. Компания ExxonMobil привносит передовые технологии парового крекинга и производства полиолефинов, а также опыт эксплуатации крупномасштабных интегрированных нефтеперерабатывающих комплексов."
 CHI_invite_JAP_hitachi: "Пригласить Hitachi"
 CHI_invite_JAP_hitachi_desc: "Подразделения компании Hitachi, занимающиеся промышленной и оборонной электроникой, производят системы управления железнодорожным транспортом, энергетическое оборудование, а также встроенное вычислительное оборудование, которое находит широкое применение в различных сферах — как в промышленной, так и в военной инфраструктуре Китая."
 CHI_invite_JAP_honda: "Пригласить Honda Motor Company"
 CHI_invite_JAP_honda_desc: "Подразделения Honda, занимающиеся разработкой силовых агрегатов и робототехникой, предоставляют технологии производства компактных двигателей и системы автоматизации производственных процессов, применимые как в гражданском производстве, так и на производственных линиях, связанных с оборонной отраслью."
 CHI_invite_JAP_howa: "Пригласить Howa Machinery"
 CHI_invite_JAP_howa_desc: "Компания Howa Machinery является основным производителем штурмовых винтовок типа 89 и Тип 20 для Сухопутных сил самообороны Японии. Ее технологии прецизионной механической обработки и опыт управления производственными линиями по выпуску стрелкового оружия представляют собой непосредственную практическую ценность."
 CHI_invite_JAP_ihi: "Пригласить IHI Corporation"
 CHI_invite_JAP_ihi_desc: "Корпорация IHI является ведущим японским производителем авиационных двигателей и судовых силовых установок, выпускающим турбовентиляторные двигатели для военных самолетов и компоненты турбин для военно-морских кораблей по лицензии западных партнеров."
 CHI_invite_JAP_jmu: "Пригласить Japan Marine United"
 CHI_invite_JAP_jmu_desc: "Компания Japan Marine United является основным производителем надводных боевых кораблей для Сил самообороны Японии (JMSDF) и отвечает за строительство вертолётных эсминцев класса «Идзумо» и ракетных эсминцев класса «Атаго». Её методы модульного проектирования кораблей могут быть напрямую применены в китайских программах судостроения."
 CHI_invite_JAP_jr_east: "Пригласить JR East"
 CHI_invite_JAP_jr_east_desc: "Компания JR East управляет самой передовой в мире сетью высокоскоростных железных дорог. Ее опыт в области проектирования подвижного состава, систем сигнализации и технического обслуживания инфраструктуры обеспечивает как экономическую выгоду для гражданского сектора, так и стратегическую модернизацию транспортной системы."
 CHI_invite_JAP_jsw: "Пригласить Japan Steel Works"
 CHI_invite_JAP_jsw_desc: "Компания Japan Steel Works является ведущим мировым производителем стальных поковок большого диаметра, используемых в сосудах под давлением, стволах корабельных орудий и компонентах ядерных реакторов. Ее опыт в области металлургии позволил бы напрямую повысить уровень производства в китайской тяжелой промышленности."
 CHI_invite_JAP_kawasaki_aerospace: "Пригласить Kawasaki Heavy Industries (авиакосмос)"
 CHI_invite_JAP_kawasaki_aerospace_desc: "Аэрокосмическое подразделение компании Kawasaki производит транспортный самолет C-2 и морской патрульный самолет P-1, что позволяет ему обладать обширным опытом в области строительства крупногабаритных летательных аппаратов и интеграции систем выполнения задач, актуальных как для коммерческого, так и для оборонного применения."
 CHI_invite_JAP_kawasaki_shipbuilding: "Пригласить Kawasaki Heavy Industries (верфь)"
 CHI_invite_JAP_kawasaki_shipbuilding_desc: "Подразделение судостроения компании Kawasaki Heavy Industries отвечает за строительство подводных лодок класса «Сорю». Его ноу-хау в области изготовления герметичных корпусов подводных лодок и снижения акустической заметности представляет собой значительную передачу военно-морских технологий."
 CHI_invite_JAP_komatsu: "Пригласить Komatsu Defense"
 CHI_invite_JAP_komatsu_desc: "Компания Komatsu Defense производит легкие бронированные машины и самоходную артиллерию для Сухопутных сил самообороны Японии. Используемый ею подход к модульной конструкции и решения в области облегченной брони дополняют существующие китайские программы по созданию боевых машин."
 CHI_invite_JAP_mhi_tank: "Пригласить Mitsubishi Heavy Industries (наземные системы)"
 CHI_invite_JAP_mhi_tank_desc: "Подразделение наземных систем компании Mitsubishi Heavy Industries производит основные боевые танки типа 10 и Тип 90, а также целый ряд бронетехники. В рамках сотрудничества осуществляется передача методологии проектирования брони и передовых технологий изготовления композитной брони."
 CHI_invite_JAP_mitsubishi_aerospace: "Пригласить Mitsubishi Aerospace"
 CHI_invite_JAP_mitsubishi_aerospace_desc: "Аэрокосмическое подразделение компании Mitsubishi Heavy Industries является ведущим японским разработчиком современных военных самолетов, в том числе платформы F-2 и находящейся на начальной стадии реализации программы F-X. Его присутствие в Китае позволило бы привнести опыт в области проектирования авиационных конструкций и производственные мощности по выпуску продукции двойного назначения."
 CHI_invite_JAP_mitsubishi_shipbuilding: "Пригласить Mitsubishi Shipbuilding"
 CHI_invite_JAP_mitsubishi_shipbuilding_desc: "Судостроительное подразделение компании Mitsubishi занимается изготовлением корпусов эсминцев и герметичных корпусов подводных лодок для Сил морской самообороны Японии, предлагая технологии военно-морского судостроения и процессы прецизионной сварки, предназначенные для программ по созданию военных кораблей высокого класса."
 CHI_invite_JAP_nec: "Пригласить NEC Corporation"
 CHI_invite_JAP_nec_desc: "Корпорация NEC является ведущим японским разработчиком систем C4ISR, оборудования для спутниковой связи и платформ радиоразведки. Ее опыт в области интеграции охватывает как оборонную электронику, так и гражданскую сетевую инфраструктуру."
 CHI_invite_JAP_nippon_steel: "Пригласить Nippon Steel"
 CHI_invite_JAP_nippon_steel_desc: "Nippon Steel — один из крупнейших в мире производителей высокопрочной конструкционной стали. Производимая компанией броневая сталь высокой твердости и специальные сплавы поставляются как для японской оборонной промышленности, так и для более широкого сектора инфраструктуры."
 CHI_invite_JAP_panasonic: "Пригласить Panasonic"
 CHI_invite_JAP_panasonic_desc: "Компания Panasonic поставляет для японской оборонной отрасли передовые аккумуляторные технологии, защищенную электронику и компоненты для тепловизионного оборудования, причем стандарты производства компании напрямую применимы к интеграции в военные платформы."
 CHI_invite_JAP_subaru: "Пригласить Subaru Aerospace"
 CHI_invite_JAP_subaru_desc: "Аэрокосмическое подразделение корпорации Subaru производит по лицензии фюзеляжи вертолетов и компоненты планера самолетов, при этом его особыми преимуществами являются высокоточная металлообработка и проектирование конструкций для вертолетов."
 CHI_invite_JAP_toshiba: "Пригласить Toshiba Defense Systems"
 CHI_invite_JAP_toshiba_desc: "Компания Toshiba Defense Systems производит радиолокационные антенные решетки, комплексы радиоэлектронной борьбы и оборудование для наведения ракет для Сил самообороны Японии, внося в партнерство важнейшие технологии в области сенсорных систем и разработки встроенных систем."
 CHI_invite_JAP_toyota: "Пригласить Toyota Motor Corporation"
 CHI_invite_JAP_toyota_desc: "Передовые производственные системы Toyota и принципы логистики «точно в срок» лежат в основе не только производства коммерческого транспорта, но и программ по выпуску легких универсальных и логистических автомобилей, поставляемых вооруженным силам Японии."
 CHI_invite_saudi_aramco: "Доля Saudi Aramco в стратегических НПЗ"
 CHI_invite_saudi_aramco_desc: "Предложить компании Saudi Aramco доли участия в Fujian Refining and Petrochemical Company и нефтехимическом комплексе Hengli в Даляне. 25-процентная доля Aramco в Fujian Refining и 10-процентная доля в Hengli обеспечивают совокупную нефтеперерабатывающую мощность в 400 000 баррелей в сутки с гарантированным трубопроводным поставками сырой нефти с Аравийского полуострова, что обеспечивает китайскому нефтеперерабатывающему сектору долгосрочный источник саудовской нефти."
 CHI_invite_shell_chem: "Химическое партнёрство Shell в Дая-Бэй"
 CHI_invite_shell_chem_desc: "Расширение совместного предприятия Shell и CNOOC в нефтехимической зоне Дая-Бэй в провинции Гуандун. Совместное предприятие Shell и CNOOC, в котором обе компании владеют по 50% акций, эксплуатирует установку крекинга этилена мощностью 1,6 млн тонн в год и производит полиэтилен, полипропилен, этиленгликоль, полиэфирные полиолы и стирол, способствуя диверсификации производства химической продукции перерабатывающего сектора Китая на южном побережье."
 CHI_jap_capitulate_to_demands: "Уступить требованиям Китая"
 CHI_jap_capitulate_to_demands_desc: "Принять условия Пекина. Эмбарго будет снято, но политические издержки внутри страны будут весьма ощутимыми."
 CHI_jap_diversify_rare_earth: "Диверсифицировать поставки редкоземельных металлов"
 CHI_jap_diversify_rare_earth_desc: "Годовая экстренная программа по избавлению от зависимости от китайских редкоземельных элементов. Это болезненный процесс, но он сделает будущие эмбарго неэффективными."
 CHI_jap_open_back_channel: "Начать переговоры по тайным каналам"
 CHI_jap_open_back_channel_desc: "Используйте неформальные каналы, чтобы снизить накал страстей вокруг Сенкаку."
 CHI_jap_reinforce_coast_guard: "Усилить береговую охрану"
 CHI_jap_reinforce_coast_guard_desc: "Усиление патрулирования Береговой охраны Японии в Восточно-Китайском море. Это сдерживает вторжения со стороны Китая, но подпитывает цикл эскалации."
 CHI_japan_strategy: "Стратегия в отношении Японии"
 CHI_japan_strategy_desc: "Весь спектр китайско-японского соперничества: давление в сфере редкоземельных элементов, присоединение к ВРЭП, давление в морском споре вокруг островов Сенкаку, закулисная дипломатия и предложения о промышленном сотрудничестве. И Пекин, и Токио принимают решения в этой сфере, в то время как отношения колеблются между давлением и уступками."
 CHI_kaesong_expansion: "Расширить комплекс Кэсон"
 CHI_kaesong_expansion_desc: "Промышленная зона Кэсон, где южнокорейские компании когда-то нанимали северокорейских рабочих, была закрыта в 2016 году в связи с разрывом межкорейских отношений. Содействие её возобновлению в качестве соучастника проекта способствует снижению напряжённости на полуострове и привязывает обе Кореи к китайским инвестициям."
 CHI_KPA_Officer_Exchange: "Программа обмена офицерами с КНА"
 CHI_KPA_Officer_Exchange_desc: "Направить офицеров НОАК в Пхеньян для участия в совместных учениях и заседаниях по планированию с коллегами из Корейской народной армии. Каждый такой цикл способствует углублению военной оперативной совместимости и укреплению влияния Китая на северокорейское командование."
 CHI_kpop_media_ban: "Запрет на K-pop в СМИ"
 CHI_kpop_media_ban_desc: "Ограничить трансляцию и распространение корейского развлекательного контента в Китае. Этот запрет направлен против культурных продуктов «корейской волны» и служит средством давления на Сеул в связи с его выбором в области безопасности."
 CHI_LATAM_emergency_aid: "Экстренная помощь партнёру в Латинской Америке"
 CHI_LATAM_emergency_aid_desc: "Предоставить пакет дискреционной помощи партнеру по системе безопасности в Латинской Америке. Это укрепит его стабильность и расширит наше влияние."
 CHI_LATAM_intel_sharing_pact: "Пакт об обмене разведданными"
 CHI_LATAM_intel_sharing_pact_desc: "Открыть двусторонний канал обмена разведывательной информацией с правительством-партнером. Обеспечивает взаимный доступ к военным объектам и укрепляет партнерские отношения."
 CHI_LATAM_military_advisors: "Направить военных советников"
 CHI_LATAM_military_advisors_desc: "Направить кадровых инструкторов НОАК в вооруженные силы страны-партнера. Это позволит передать армейский опыт и укрепить связи в области обороны."
 CHI_LATAM_security_options: "Варианты безопасности в Латинской Америке"
 CHI_launch_payload: "Запустить полезную нагрузку"
 CHI_launch_payload_desc: "Необходимо поддерживать стабильный темп запусков из Цзюцюаня, Сичана, Вэньчана и Тайюаня. Каждый успешный запуск позволяет накопить оперативный опыт, который повышает шансы на успех наших флагманских миссий и является необходимым условием для реализации программы полетов на Луну."
 CHI_lift_rare_earth_embargo: "Снять эмбарго на редкоземельные металлы"
 CHI_lift_rare_earth_embargo_desc: "Отменить запрет на экспорт редкоземельных элементов. Токио получает отсрочку."
 CHI_lift_thaad_sanctions: "Снять санкции из-за THAAD"
 CHI_lift_thaad_sanctions_desc: "Официально отменить неформальные экономические санкции, введенные в ответ на развертывание системы THAAD. Это решение свидетельствует о готовности к нормализации отношений с Сеулом."
 CHI_localise_licensed_system: "Локализовать лицензионную систему"
 CHI_localise_licensed_system_desc: "Провести обратную разработку и наладить собственное производство системы, создаваемой в настоящее время по российской лицензии — будь то двигатель, радиолокатор или головка самонаведения ракеты, — сократив таким образом выплачиваемые Москве роялти и доказав, что китайская промышленность способна самостоятельно обеспечивать свои потребности."
 CHI_locate_jang_loyalists: "Найти сторонников Чан Сон Тхэка"
 CHI_locate_jang_loyalists_desc: "Выявить оставшихся в живых членов фракции Чан Сон Тхэка, разбросанных по приграничным регионам. В этой подвергшейся чистке сети по-прежнему царит недовольство в отношении ближайшего окружения Кима."
 CHI_mature_node_export_drive_decision: "Экспортный рывок на зрелых техпроцессах"
 CHI_mature_node_export_drive_decision_desc: "Предоставить субсидии клиентам SMIC и Hua Hong, чтобы наводнить мировые рынки автомобильной промышленности, Интернета вещей и бытовой техники микросхемами с технологическим процессом менее 28 нм. Каждый транш добавляет бонус к торговому отношению."
 CHI_megaprojects: "Национальные мегапроекты"
 CHI_megaprojects_desc: "Китайская традиция реализации крупномасштабных проектов под руководством государства — от плотины «Три ущелья» до крупнейшей в мире сети высокоскоростных железных дорог. Направление национальных ресурсов на реализацию флагманских проектов, которые кардинально преобразуют системы водоснабжения, энергетики и транспорта страны."
 CHI_military_decisions_category: "Военная реструктуризация"
 CHI_MSS_Pyongyang_Station: "Резидентура МГБ в Пхеньяне"
 CHI_MSS_Pyongyang_Station_desc: "Расширить резидентуру Министерства государственной безопасности в Пхеньяне с целью усиления разведывательного охвата северокорейского руководства и повышения потенциала раннего предупреждения о нестабильности режима."
 CHI_MSS_Quiet_Removal_Operation: "Операция по тихому устранению"
 CHI_MSS_Quiet_Removal_Operation_desc: "Министерство государственной безопасности выявило в Пхеньяне фракцию сторонников жесткой линии, препятствующую реализации программы реформ. Проведение незаметной операции позволит устранить это препятствие и расчистить путь для дальнейшей либерализации."
 CHI_national_commitee_decisions_category: "Центральный комитет"
 CHI_national_commitee_decisions_category_desc: "\n£GFX_CHI_commission_1 \n\n\n\nЦентральный комитет КПК руководит делами партии в период между съездами. Каждые пять лет созывается новый съезд, который избирает членов комитета, назначает секретарей и определяет политический курс партии."
 CHI_NKO_Rason_SEZ_Investment: "Инвестиции в ОЭЗ Расон"
 CHI_NKO_Rason_SEZ_Investment_desc: "Выделить прямое финансирование для особой экономической зоны Расон. Эти инвестиции обеспечат доступ к порту и продемонстрируют жизнеспособность экономических реформ в Северной Корее."
 CHI_norinco_innovation: "NORINCO: оригинальные инновации"
 CHI_norinco_innovation_desc: "China North Industries Group является крупнейшим в стране конгломератом, специализирующимся на наземных системах, и поставляет стрелковое оружие и артиллерию для всех сухопутных войск. Освобождение ее конструкторских бюро от осторожных подражаний позволяет им заниматься разработкой по-настоящему новых систем пехотного вооружения и артиллерии."
 CHI_northern_theatre_command: "Командование Северного ТВД"
 CHI_northern_theatre_command_desc: "Командование Северного театра военных действий, штаб которого расположен в Шэньяне, охватывает территорию Корейского полуострова и российскую границу. Оно уделяет особое внимание оперативному планированию и слаженности действий своих тяжелых общевойсковых формирований."
 CHI_olympic_athlete_village: "Олимпийская деревня и медиацентр"
 CHI_olympic_athlete_village_desc: "Построить олимпийскую деревню и международный центр телерадиовещания в северной части Олимпийского парка. По завершении строительства эти здания будут перепрофилированы для жилого и коммерческого использования, что пополнит жилой и офисный фонд Пекина."
 CHI_olympic_environmental_program: "Экологическая программа"
 CHI_olympic_environmental_program_desc: "Ускорить переход с угля на газ в системе теплоснабжения Пекина, перенести наиболее загрязняющие окружающую среду предприятия группы Capital Steel в другие места и развернуть широкомасштабную кампанию по лесопосадкам в прилегающих горах. Эта программа позволит улучшить качество воздуха до олимпийских стандартов и продемонстрировать приверженность Китая принципам устойчивого развития."
 CHI_olympic_mission: "Подготовка к Олимпиаде в Пекине"
 CHI_olympic_mission_desc: "Мы взяли на себя обязательство провести Олимпийские игры 2008 года в Пекине. Международное сообщество будет следить за этим. Необходимо в установленные сроки обеспечить финансирование всех четырёх программ подготовки — строительство объектов, обеспечение жильём спортсменов, транспорт и охрана окружающей среды. Невыполнение этих обязательств в срок поставит правительство в неловкое положение и подорвёт доверие общественности."
 CHI_olympic_preparations: "Подготовка к Олимпиаде"
 CHI_olympic_preparations_tt: "Если мы завершим все фокусы подготовки к Олимпиаде, то получим:"
 CHI_olympic_transport_links: "Олимпийская транспортная сеть"
 CHI_olympic_transport_links_desc: "Проложить линии метро до Олимпийского парка, запустить экспресс-линию до Пекинского столичного аэропорта и модернизировать железнодорожный коридор Циньхуандао-Шэньян, чтобы справиться с резким увеличением пассажиропотока и грузовых перевозок, ожидаемым во время и после Олимпийских игр."
 CHI_olympic_venue_construction: "Строительство олимпийских объектов"
 CHI_olympic_venue_construction_desc: "Финансировать строительство Национального стадиона, Национального центра водных видов спорта и Национального велодрома в районе «Олимпийский парк». Эти ключевые объекты станут постоянным наследием Олимпийских игр 2008 года в Пекине и будут выполнять функцию как коммерческих, так и спортивных центров столицы."
 CHI_pacific_pla_training: "Подготовка НОАК в Тихом океане"
 CHI_patrol_diaoyu_fishing_grounds: "Патрулировать рыболовные угодья у Дяоюй"
 CHI_patrol_diaoyu_fishing_grounds_desc: "Направить катера морской милиции Народных вооружённых сил в спорные воды. Напряженность усилится, и Токио будет вынуждено отреагировать."
 CHI_pla_joint_maritime_exercise: "Совместные морские учения в Тихом океане"
 CHI_pla_joint_maritime_exercise_desc: "Проводить совместные морские учения с нашими партнерами по инициативе «Один пояс и один путь» в Тихоокеанском регионе. Это способствует укреплению их опыта в области военно-морского дела и расширению нашего влияния в регионе."
 CHI_pla_train_SOL: "Подготовить силы безопасности Соломоновых Островов"
 CHI_pla_train_SOL_desc: "Направить кадровых специалистов НОАК для оказания помощи силам безопасности Соломоновых Островов. Это позволит передать опыт армии и укрепить связи в области обороны."
 CHI_poly_innovation: "Poly Technologies: оригинальные инновации"
 CHI_poly_innovation_desc: "Компания «Poly Technologies», являющаяся подразделением НОАК, занимающимся экспортом вооружений, охватывает весь спектр китайской военной техники. Переориентация её коммерческой деятельности на реальные разработки способствует прогрессу во всём оборонном секторе."
 CHI_Press_NKO_on_Nuclear: "Добиваться от Пхеньяна ядерной сдержанности"
 CHI_Press_NKO_on_Nuclear_desc: "Оказать прямое дипломатическое давление на Северную Корею с целью приостановки ядерных испытаний и ограничения развертывания ядерного оружия. Прогресс достигается постепенно, но демонстрирует Вашингтону, что Пекин является серьезным партнером в сфере нераспространения."
 CHI_pressure_iaea_access: "Добиваться доступа МАГАТЭ"
 CHI_pressure_iaea_access_desc: "Оказать давление на Пхеньян, чтобы он допустил инспекторов МАГАТЭ на комплекс в Йонбёне. Давление со стороны Китая имеет вес там, где требования Запада лишь усиливают сопротивление Северной Кореи."
 CHI_princeling_intelligence_report: "Разведдонесение сети «принцев»"
 CHI_princeling_intelligence_report_desc: "Обобщить последние данные, поступающие от источников в северокорейском руководстве. Каждый анализ позволяет нам более четко представить себе фракции, противостояния и уязвимые места режима."
 CHI_pro_natalist_subsidies: "Субсидии для повышения рождаемости"
 CHI_pro_natalist_subsidies_desc: "Местные органы власти по всему Китаю начинают выплачивать прямые денежные пособия, субсидии на приобретение жилья и предоставлять удлинённые отпуска по уходу за ребёнком для матерей и отцов в целях стимулирования рождаемости. В таких провинциях, как Цзилинь и Сычуань, реализуются пилотные программы, предусматривающие выплаты в размере десятков тысяч юаней на каждого ребёнка. Международные сравнения показывают, что значительные бюджетные расходы приводят лишь к незначительному росту рождаемости, однако эти субсидии снижают расходы домохозяйств и способствуют росту внутреннего потребления в краткосрочной перспективе."
 CHI_propose_unity_government: "Предложить правительство единства Кореи"
 CHI_propose_unity_government_desc: "Представить официальное предложение Китая о создании переходного правительства национального единства на основе взаимного признания. Самый смелый дипломатический ход той эпохи — и самый рискованный."
 CHI_push_rcep_signing: "Добиться подписания ВРЭП"
 CHI_push_rcep_signing_desc: "Региональное всеобъемлющее экономическое партнерство, подписанное в ноябре 2020 года и вступившее в силу с января 2022 года, объединяет Китай, Японию, Южную Корею, страны АСЕАН, Австралию и Новую Зеландию в крупнейшую в мире зону свободной торговли. Подписание этого соглашения позволяет нам занять центральное место в азиатской торговле."
 CHI_railway_central_upgrade: "Модернизация центрального железнодорожного коридора"
 CHI_railway_central_upgrade_desc: "Модернизация железнодорожных терминалов и инфраструктуры в Центральном Китае и в Пекинском транспортном узле, охватывающих провинции Хубэй, Хэнань и город Пекин. Укрепление этого коридора позволит снизить загруженность наиболее интенсивных грузовых магистралей Китая и улучшить поставки промышленных материалов во внутренние производственные зоны."
 CHI_railway_east_upgrade: "Модернизация восточного железнодорожного коридора"
 CHI_railway_east_upgrade_desc: "Модернизировать железнодорожные терминалы и инфраструктуру в Восточном и Центральном Китае, объединив провинции Цзянси, Аньхой и Сычуань в единую сеть грузовых и пассажирских перевозок. Эти меры позволят повысить региональный строительный потенциал и сократить время, необходимое для доставки промышленных материалов из прибрежных портов вглубь страны."
 CHI_railway_improvement: "Национальная модернизация железных дорог"
 CHI_railway_north_upgrade: "Модернизация северного железнодорожного коридора"
 CHI_railway_north_upgrade_desc: "Модернизировать железнодорожные терминалы и наземную инфраструктуру вдоль Северо-Китайского коридора, связывающего провинции Хэбэй, Шаньси и соседние провинции. Повышение пропускной способности железных дорог позволит увеличить объемы поставок, снизить логистические затраты и ускорить темпы строительства во всем регионе."
 CHI_railway_south_upgrade: "Модернизация южного железнодорожного коридора"
 CHI_railway_south_upgrade_desc: "Модернизировать железнодорожные терминалы и инфраструктуру на территории Южного Китая и провинции Юньнань, включив провинции Гуандун, Хунань и юго-западные приграничные провинции в национальную сеть. Эта программа обеспечивает более быструю перевозку промышленных товаров и сельскохозяйственной продукции, а также способствует развитию промышленности вдоль этого коридора."
 CHI_railway_west_upgrade: "Модернизация западного железнодорожного коридора"
 CHI_railway_west_upgrade_desc: "Модернизировать железнодорожные терминалы и инфраструктуру на северо-западе и юго-западе страны, обеспечив подключение провинций Шэньси, Ганьсу, Чунцин и Синьцзян к национальной грузовой сети. Эти инвестиции позволят снизить транспортные расходы для промышленных парков западных регионов и обеспечат доступ ранее изолированных провинций к крупномасштабным производственным цепочкам."
 CHI_raise_retirement_age: "Повысить пенсионный возраст"
 CHI_raise_retirement_age_desc: "Установленный законом в 1978 году пенсионный возраст в Китае является одним из самых низких в мире: 60 лет для мужчин, 55 лет для женщин, занятых умственным трудом, и 50 лет для женщин, занятых физическим трудом. Поэтапное повышение этого возраста продлевает трудовую жизнь на два–пять лет, что позволяет дольше удерживать опытных работников на рынке труда и снижает нагрузку на пенсионную систему. Сопротивление со стороны работников, рассчитывающих на досрочный выход на пенсию, и молодежи, опасающейся сокращения числа рабочих мест, весьма значительно."
 CHI_rare_earth_chip_leverage_decision: "Использовать контроль над редкоземельными металлами"
 CHI_rare_earth_chip_leverage_decision_desc: "Связать снятие западного эмбарго на поставки микросхем с продолжением экспорта из Китая редкоземельных элементов и галлия. Начать открытые переговоры с Вашингтоном: в случае успеха ограничения будут ослаблены, а самообеспеченность укрепится; в случае отказа эмбарго ужесточится, а затраченный политический капитал будет утрачен."
 CHI_rare_earth_embargo_decision: "Потянуть за редкоземельный рычаг"
 CHI_rare_earth_embargo_decision_desc: "Китай перерабатывает почти девяносто процентов мировых редкоземельных элементов, из которых изготавливаются магниты, входящие в состав каждой управляемой ракеты и самолета-невидимки. Перекрытие доступа сопернику к этим ресурсам на несколько месяцев парализует его оборонное производство, однако это обходится потерей политического капитала и репутацией ненадёжного поставщика."
 CHI_rare_earth_supply_assurance: "Гарантировать поставки редкоземельных металлов"
 CHI_rare_earth_supply_assurance_desc: "Китай перерабатывает подавляющую часть мировых редкоземельных элементов, которые являются сырьем для производства южнокорейских полупроводников, аккумуляторов и дисплеев. Гарантированные поставки в Сеул позволяют нам стать надежным партнером и ослабляют влияние Вашингтона на своего союзника."
 CHI_rcep_deepening: "Углубление ВРЭП"
 CHI_rcep_deepening_desc: "Предложить региональным партнерам ускорить выполнение обязательств в рамках ВРЭП. Углубление экономической интеграции с Азиатско-Тихоокеанским регионом укрепляет позиции Китая как незаменимого экономического партнера в регионе."
 CHI_recall_paf_maritime_militia: "Отозвать морскую милицию Народных вооружённых сил"
 CHI_recall_paf_maritime_militia_desc: "Снять постоянное присутствие морской милиции и дать напряженности пойти на убыль."
 CHI_rein_in_cliques: "Обуздать клики"
 CHI_rein_in_cliques_desc: "Периодически проверять контрабандных группировок и сетей кумовства, пока они не вышли из-под контроля. Возврат растраченных средств пополняет казну и укрепляет доверие к партии, хотя офицерский корпус с неодобрением относится к таким проверкам."
 CHI_replace_synopsys_cadence_decision: "Заменить Synopsys и Cadence"
 CHI_replace_synopsys_cadence_decision_desc: "После введения запрета на экспорт в мае 2025 года перевести все отечественные компании, не имеющие собственных производственных мощностей, на инструменты EDA от Empyrean, Primarius и Xpeedic для обеспечения полного охвата проектирования."
 CHI_retry_chang_e_mission: "Повторно запустить зонд «Чанъэ»"
 CHI_retry_chang_e_mission_desc: "Зонд не смог достичь Луны и провести её исследование. Построить замену и отправить её в путь."
 CHI_retry_shenzhou_mission: "Повторить миссию «Шэньчжоу»"
 CHI_retry_shenzhou_mission_desc: "Последняя попытка не увенчалась успехом. Проанализировать данные о полёте, устранить неисправность и подготовить к запуску очередной корабль «Шэньчжоу»."
 CHI_retry_tiangong_mission: "Повторить сборку «Тяньгуна»"
 CHI_retry_tiangong_mission_desc: "Стыковка или установка модуля не прошла по плану. Провести доработку и повторить сборку станции."
 CHI_sac_innovation: "Shenyang Aircraft: оригинальные инновации"
 CHI_sac_innovation_desc: "Shenyang Aircraft Corporation производит тяжелые истребители для Военно-воздушных сил и Военно-морского флота НОАК — от самолетов серии J-11 до палубных истребителей J-15 и J-35. Реорганизация этой корпорации укрепляет передовые позиции китайских ВВС в воздушном бою."
 CHI_sco_anti_terror_crackdown: "Начать антитеррористическую операцию"
 CHI_sco_anti_terror_crackdown_desc: "Поручить спецслужбам провести масштабную операцию по ликвидации террористических сетей в рамках концепции ШОС «Три зла». Временно повысить уровень противотеррористической готовности за счёт стабильности внутри страны."
 CHI_sco_apply_as_dialogue_partner: "Подать заявку на статус партнёра по диалогу"
 CHI_sco_apply_as_dialogue_partner_desc: "Мы можем официально обратиться с просьбой о присвоении нам статуса партнёра по диалогу в рамках Шанхайской организации сотрудничества. Это первый шаг на пути к углублению взаимодействия с Китаем и его партнёрами."
 CHI_sco_category: "Шанхайская организация сотрудничества"
 CHI_sco_category_desc: "\n£MAIN_desctext_sco \n\n\n\n§YШанхайская организация сотрудничества§! или §YШОС§! — это евразийская межправительственная организация, сосредоточенная на сотрудничестве в сфере экономики, политики и безопасности. Возникнув на основе §Y«Шанхайской пятёрки»§!, она превратилась в широкую структуру, через которую §Y[CHI.GetFlag]Китай§! и §Y[SOV.GetFlag]Россия§! расширяют своё влияние, одновременно поддерживая региональную стабильность и сотрудничество.\n\nВ отличие от традиционного военного союза, §YШОС§! развивается через постепенную интеграцию. Страны могут сначала стать §YПартнёрами по диалогу§!, затем §YНаблюдателями§!, а после этого подать заявку на получение полного §YЧленства§!.\n\nГотовность стран сотрудничать с §YШОС§! зависит от нескольких факторов:\n\n§YКитайская агрессия§! отражает степень напористости §Y[CHI.GetFlag]Китая§!. Низкие уровни делают организацию более привлекательной, тогда как высокие уровни снижают желание сотрудничать и могут подтолкнуть участников к выходу.\n\n§YСплочённость ШОС§! отражает внутреннюю стабильность и уровень доверия между государствами-участниками. Высокая сплочённость улучшает сотрудничество и эффективность проектов, тогда как низкая замедляет интеграцию и повышает риск выхода участников.\n\n§YБаланс Китая и России§! определяет внутреннюю политическую стабильность организации. Сбалансированные отношения обеспечивают плавное расширение, тогда как доминирование одной из сторон может привести к конфликтам, задержкам или снижению уровня сотрудничества.\n\nБлагодаря совместным §YЭкономическим§!, §YОборонным§! и §YСтратегическим проектам§! §YШОС§! позволяет своим участникам расширять влияние, укреплять региональные связи и создавать альтернативный центр силы в Евразии.\n\nЕсли китайская агрессия превысит уровни §R5§! и §R10§!, §Y[JAP.GetNameWithFlag]§! получит новые возможности для расширения статьи 9 способами, направленными против военных позиций [CHI.GetFlag]§Y[CHI.GetName]§!.\n\n$CHI_chinese_aggression_display$\n$CHI_sco_cohesion_display$\n$CHI_sco_balance_display$"
 CHI_sco_cohesion_decay: "Корректировка сплочённости ШОС"
 CHI_sco_cohesion_decay_desc: "Скрытая ежегодная перекалибровка, которая подталкивает показатель сплочённости ШОС к его естественному равновесному значению, равному пяти, с корректировкой в сторону увеличения на полбалла за каждый активный мегапроект. Если показатель сплочённости превышает равновесное значение, он уменьшается на единицу; если ниже — увеличивается на единицу."
 CHI_sco_consider_leaving: "Пересмотреть членство в ШОС"
 CHI_sco_consider_leaving_desc: "Скрытое решение, принимаемое ИИ, в ходе которого государства-члены и государства-наблюдатели оценивают, оправдывают ли ухудшение отношений с Пекином или растущие проблемы со сплочённостью ШОС снижение уровня своего участия. Государства, сильнее всего ощущающие китайскую агрессию или имеющие негативное мнение о Китае, будут серьёзнее рассматривать возможность выхода из организации."
 CHI_sco_upgrade_to_member: "Подать заявку на полноправное членство в ШОС"
 CHI_sco_upgrade_to_member_desc: "Как страна со статусом наблюдателя мы теперь можем подать заявку на получение полноправного членства в Шанхайской организации сотрудничества."
 CHI_sco_upgrade_to_observer: "Подать заявку на получение статуса наблюдателя"
 CHI_sco_upgrade_to_observer_desc: "Закрепив за собой статус партнёра по диалогу, мы теперь можем претендовать на полноправный статус наблюдателя в ШОС, что откроет нам доступ к более широкому экономическому и политическому сотрудничеству."
 CHI_scs_assertive_patrol_MAY: "Силовое патрулирование: малайзийская часть Спратли"
 CHI_scs_assertive_patrol_MAY_desc: "Отправить флотилию ВМС НОАК в воды, являющиеся предметом спора с Малайзией, в южной части архипелага Спратли, вблизи отмели Лукония. Экономические связи Куала-Лумпура с нашей страной ограничивают его возможности реагирования, однако для продвижения счётчика столкновений по-прежнему необходима решительная победа. Учитывая осторожную позицию Малайзии, часто случаются сражения без явного победителя; неудачи могут привести к срыву отношений в сфере кредитования инфраструктуры."
 CHI_scs_assertive_patrol_PHI: "Силовое патрулирование: филиппинская часть Спратли"
 CHI_scs_assertive_patrol_PHI_desc: "Отправить флотилию ВМС НОАК в воды, оспариваемые Филиппинами, чтобы пресечь филиппинские операции по снабжению на отмели Аюнгин и восточных островах архипелага Спратли. Решительная победа продвигает счётчик столкновений с Филиппинами; ничейный исход оставляет его без изменений; неудача снижает $CHI_scs_framework$ и может побудить Манилу инициировать консультации в рамках Договора о взаимной обороне с США."
 CHI_scs_assertive_patrol_VIE: "Силовое патрулирование: вьетнамская часть Спратли"
 CHI_scs_assertive_patrol_VIE_desc: "Отправить флотилию ВМС НОАК в воды, оспариваемые Вьетнамом, и бросить вызов вьетнамской береговой охране и судам снабжения в западной части архипелага Спратли. У операции три возможных исхода: решительная тактическая победа продвигает счётчик столкновений к порогу ультиматума; ничейное столкновение оставляет счётчик без изменений; неудача снижает $CHI_scs_framework$ и может вызвать ответные дипломатические меры Ханоя."
 CHI_scs_block_asean_consensus: "Заблокировать консенсус АСЕАН"
 CHI_scs_block_asean_consensus_desc: "Использовать влияние Китая на Камбоджу и Лаос, чтобы готовящееся осуждение на уровне АСЕАН не попало в итоговое коммюнике саммита. Оба государства способны заблокировать решение в рамках механизма консенсуса, и благодаря их содействию совместное заявление обойдёт молчанием поведение в Южно-Китайском море. Этот манёвр немного повышает $CHI_chinese_aggression$, так как региональные наблюдатели отмечают его цинизм, но даёт скромный прирост $CHI_scs_framework$, не допуская институционального осуждения."
 CHI_scs_boundary_codification_MAY: "Договор о морской границе: Малайзия"
 CHI_scs_boundary_codification_MAY_desc: "Заключить двусторонний договор о морских границах с Малайзией, закрепив тем самым существующее де-факто положение в спорных южных водах. Подписание договора Куала-Лумпуром завершит цикл двусторонних соглашений и лишит оснований любые оставшиеся многосторонние претензии."
 CHI_scs_boundary_codification_PHI: "Договор о морской границе: Филиппины"
 CHI_scs_boundary_codification_PHI_desc: "Заключить с Филиппинами двусторонний договор о морских границах, заменяющий арбитражное решение по Конвенции ООН по морскому праву (UNCLOS) от 2016 года. Манила соглашается отложить решение трибунала в обмен на гарантии китайских инвестиций и расширение доступа к зоне совместной разработки."
 CHI_scs_boundary_codification_VIE: "Договор о морской границе: Вьетнам"
 CHI_scs_boundary_codification_VIE_desc: "Заключить с Вьетнамом двусторонний договор о морских границах на выгодных для Китая условиях, закрепив в нём согласованные линии в Тонкинском заливе и отложив споры по Парасельским и Спратлиским островам в рамках соглашения о совместном освоении. Ханой признаёт эту договорённость наилучшим из возможных исходов; Пекин создаёт прецедент."
 CHI_scs_carrier_strike_group_deployment: "Развёртывание авианосной ударной группы"
 CHI_scs_carrier_strike_group_deployment_desc: "Развернуть в Южно-Китайском море полноценную авианосную ударную группу для длительного оперативного пребывания. Это развёртывание свидетельствует о том, что Китай обладает и будет использовать способность контролировать море с помощью военной силы, а не просто оспаривать его."
 CHI_scs_demand_tribute_MAY: "Потребовать уступить Наньша"
 CHI_scs_demand_tribute_MAY_desc: "Выдвинуть Куала-Лумпуру ультиматум с требованием официально уступить северную часть архипелага Спратли, включая оккупированные Малайзией участки вокруг рифа Своллоу и Ардасье. Эта нота погружена в историческую память о патрулях Чжэн Хэ эпохи династии Мин, отправлявшихся из Малакки, что позволяет представить это требование не как новую аннексию, а как восстановление прежнего порядка. Из трёх стран, претендующих на эти территории, Малайзия — та, которая с наибольшей вероятностью молча смирится с этой потерей."
 CHI_scs_demand_tribute_PHI: "Потребовать уступить Чжунша"
 CHI_scs_demand_tribute_PHI_desc: "Выдвинуть Маниле ультиматум с требованием официально уступить Макклесфилдский банк — подводный массив, который уже находится под управлением Китая в качестве района Чжунша города Саньша. Эта нота отказывается от фикции двусторонних переговоров и проверяет на прочность Договор о взаимной обороне 1951 года в отношении рифа, не имеющего ни гарнизона, ни взлётно-посадочной полосы, что является максимально чётким способом выяснить, по-прежнему ли Вашингтон рассматривает рифы как «красные линии»."
 CHI_scs_demand_tribute_VIE: "Потребовать уступить Сиша"
 CHI_scs_demand_tribute_VIE_desc: "Выдвинуть Ханою ультиматум с требованием официально уступить Парасельские острова — территорию, которую мы удерживаем силой с момента сражения 1974 года, в ходе которого военно-морские силы Республики Вьетнам были изгнаны с островной группы «Полумесяц». В ноте это требование сформулировано в терминах исторических прав, предшествующих эпохе Французского Индокитая, и представлено как завершение незавершённого дела, а не как новое притязание. Ханой может официально подтвердить утрату этих территорий в письменной форме или же получить второй урок по образцу 1979 года."
 CHI_scs_deploy_maritime_militia: "Развернуть морскую милицию"
 CHI_scs_deploy_maritime_militia_desc: "Выдвинуть в спорный морской район суда рыболовного флота, действующие под координацией ВМС НОАК. Морская милиция обеспечивает постоянное присутствие под правдоподобным гражданским прикрытием, создавая факты на воде быстрее, чем успевают отреагировать дипломатические протесты."
 CHI_scs_first_island_chain_exercise: "Учения в первой цепочке островов"
 CHI_scs_first_island_chain_exercise_desc: "Провести крупные флотские учения, охватывающие всю длину первой цепочки островов от Жёлтого моря до Южно-Китайского моря. Эти учения демонстрируют способность противодействовать попыткам проникновения и блокировать доступ в этот регион со стороны любой державы, пытающейся вмешаться в ситуацию внутри цепи."
 CHI_scs_infrastructure_loan_MAY: "Инфраструктурный кредит: Малайзия"
 CHI_scs_infrastructure_loan_MAY_desc: "Предоставить Малайзии финансирование инфраструктурных проектов в рамках инициативы «Один пояс и один путь», охватив проект железнодорожной линии «Ист-Кост Рейл Линк» и расширение портов вдоль коридора Малаккского пролива. Данная сделка укрепляет позицию Малайзии как наиболее тесно интегрированного с Китаем партнёра в АСЕАН."
 CHI_scs_infrastructure_loan_PHI: "Инфраструктурный кредит: Филиппины"
 CHI_scs_infrastructure_loan_PHI_desc: "Предоставить Филиппинам финансирование инфраструктурных проектов в рамках инициативы «Один пояс и один путь», включая строительство мостов, развитие железнодорожной инфраструктуры и создание нового глубоководного порта. Это предложение поступило в тот момент, когда Манила взвешивает затраты и выгоды своего союза с Вашингтоном."
 CHI_scs_infrastructure_loan_VIE: "Инфраструктурный кредит: Вьетнам"
 CHI_scs_infrastructure_loan_VIE_desc: "Предоставить Вьетнаму финансирование инфраструктурных проектов в рамках инициативы «Один пояс и один путь», включая модернизацию портов, строительство железнодорожных линий и развитие промышленных зон. Этот кредит усиливает экономическую зависимость Вьетнама от китайского капитала и повышает для Ханоя издержки дипломатического противостояния."
 CHI_scs_invoke_doc_2002: "Подтвердить Декларацию 2002 года"
 CHI_scs_invoke_doc_2002_desc: "Публично подтвердить Декларацию 2002 года о поведении сторон в Южно-Китайском море в качестве руководящей основы для урегулирования споров. Этот шаг носит в основном символический характер, но демонстрирует сдержанность в отношении партнёров по АСЕАН и создаёт дипломатическую основу для двусторонних переговоров."
 CHI_scs_island_construction_civilian: "Построить гражданскую инфраструктуру"
 CHI_scs_island_construction_civilian_desc: "Построить на островном комплексе портовые сооружения, метеорологические станции и постоянное жильё для гражданского населения. Видимые признаки обычной жизни — школы, поликлиники и административные здания — подкрепляют политический аргумент о том, что эти объекты представляют собой заселённую китайскую территорию."
 CHI_scs_island_construction_radar: "Возвести РЛС и комплексы радиоразведки"
 CHI_scs_island_construction_radar_desc: "Построить на искусственном острове объекты радиотехнической разведки и загоризонтные РЛС. Эти объекты обеспечивают постоянный контроль над морской обстановкой во всём Южно-Китайском море и позволяют отслеживать передвижения иностранных военно-морских и военно-воздушных сил в режиме реального времени."
 CHI_scs_island_construction_runway: "Построить взлётно-посадочную полосу"
 CHI_scs_island_construction_runway_desc: "На комплексе искусственных островов построить взлётно-посадочную полосу длиной 3 000 метров, способную принимать боевые самолёты и морские патрульные самолёты дальнего радиуса действия. Этот аэродром превращает объект из передового поста присутствия в центр проецирования силы."
 CHI_scs_island_construction_sam_battery: "Установить батарею ЗРК"
 CHI_scs_island_construction_sam_battery_desc: "Развернуть на островном комплексе батареи зенитных ракет большой дальности. Эти объекты расширяют зону действия китайской системы противовоздушной обороны вглубь Южно-Китайского моря, что затрудняет проведение любых иностранных операций по обеспечению свободы судоходства или воздушного патрулирования."
 CHI_scs_joint_development_MAY: "Соглашение о разработке отмелей Лукония"
 CHI_scs_joint_development_MAY_desc: "Обратиться к Petronas с предложением о заключении соглашения о совместной эксплуатации блоков ND6 и SK308 в районе отмелей Лукония, где катера китайской береговой охраны уже следят за малайзийскими буровыми установками в южной части Луконии. Привычка Куала-Лумпура обсуждать этот спор за закрытыми дверями делает это соглашение самым лёгким для заключения; заключённая сделка станет шаблоном, которым Пекин будет махать перед Ханоем и Манилой."
 CHI_scs_joint_development_PHI: "Возродить энергетический меморандум с Манилой"
 CHI_scs_joint_development_PHI_desc: "Возобновить приостановленное действие Меморандума о взаимопонимании по разработке нефтегазовых месторождений, предусматривающего сотрудничество компаний CNOOC и PXP Energy в рамках сервисного контракта № 72 на участке Рид-Бэнк. Манила получает фиксированную долю доходов и приток инвестиций в разведку и добычу в обмен на то, что арбитражное решение 2016 года будет считаться политически замороженным. Двусторонний подход хоронит филиппинский иск под нормами договорного права."
 CHI_scs_joint_development_VIE: "Пакт о совместной разработке банки Вангард"
 CHI_scs_joint_development_VIE_desc: "Начать конфиденциальные переговоры с Ханоем о создании зоны совместного освоения в районе пересечения границ на банке «Вангард» и в нерегулируемых водах к востоку от линии разграничения в Тонкинском заливе, установленной в 2000 году. Компании CNOOC и PetroVietnam разделили бы права на геологоразведку и доходы в соответствии с формулой «без ущерба для суверенитета», отложив решение правового вопроса на время, пока идёт поставка газа. Использование двустороннего канала позволяет держать АСЕАН на расстоянии и лишает Ханой стимула прибегать к Конвенции ООН по морскому праву (UNCLOS)."
 CHI_scs_natuna_press_claim: "Распространить линию из девяти пунктиров на Натуну"
 CHI_scs_natuna_press_claim_desc: "Опубликовать официальную ноту, в которой будет утверждаться, что наши исторические права в рамках линии из девяти пунктиров распространяются на воды, пересекающиеся с исключительной экономической зоной (ИЭЗ) индонезийского архипелага Натуна. Это утверждение оспаривается с юридической точки зрения, поскольку Индонезия не считает себя стороной, предъявляющей претензии в Южно-Китайском море, однако данное заявление расширяет дипломатическую границу в южном направлении и создаёт новый рычаг давления на крупнейшее государство АСЕАН."
 CHI_scs_natuna_provocation: "Провокация у Натуны"
 CHI_scs_natuna_provocation_desc: "Развернуть суда китайской морской милиции в исключительной экономической зоне Натуна, принадлежащей Индонезии, под прикрытием плановых рыболовных операций. Это вторжение можно будет отрицать, но оно будет заметно; Джакарта отреагирует на него дипломатическими мерами. Данная акция позволяет прощупать южную границу оперативного охвата Китая и проверить решимость Индонезии, не задействуя при этом регулярные силы ВМС НОАК."
 CHI_scs_reclaim_taiping: "Вернуть Тайпин"
 CHI_scs_reclaim_taiping_desc: "Остров Тайпин (регион № 491) является крупнейшим природным объектом в архипелаге Спратли и по-прежнему находится под управлением Китайской Республики на Тайване. После закрепления контроля над всеми тремя регионами архипелага Спратли прямая операция по захвату Тайпина станет завершающим этапом консолидации позиций в Южно-Китайском море, не связанным с каким-либо более широким сценарием воссоединения с Тайванем и предшествующим ему. Эта операция сопряжена с очень высокими затратами политической власти и требует полной мобилизации сил ВМС НОАК в Южно-Китайском море."
 CHI_scs_standoff_malaysia: "Спровоцировать противостояние: Малайзия"
 CHI_scs_standoff_malaysia_desc: "Применить «модель Скарборо» к спорному объекту, на который претендует Малайзия. Куала-Лумпур исторически всегда осторожно выстраивал отношения с Пекином; данное противостояние станет проверкой на то, сдерживает ли экономическая зависимость подачу официального дипломатического протеста."
 CHI_scs_standoff_philippines: "Спровоцировать противостояние: Филиппины"
 CHI_scs_standoff_philippines_desc: "Применить «модель Скарборо» в отношении спорного объекта, на который претендуют Филиппины. Столкновение с филиппинским рыболовецким судном перерастает в конфронтацию с береговой охраной, пока Манила не отступает, в результате чего на этом объекте остаётся постоянное китайское присутствие."
 CHI_scs_standoff_vietnam: "Спровоцировать противостояние: Вьетнам"
 CHI_scs_standoff_vietnam_desc: "Применить «модель Скарборо» к спорному объекту, на который претендует Вьетнам. Береговая охрана Ханоя уступает по вооружению и численности; вопрос заключается в том, примет ли Ханой поражение без шума или же пойдёт на эскалацию конфликта, чтобы привлечь внимание международного сообщества."
 CHI_scs_summon_dragon_king_blessing: "Благословение флота Царём драконов"
 CHI_scs_summon_dragon_king_blessing_desc: "Провести в храме Тяньхоу в городе Санья (провинция Хайнань) торжественное освящение Флота Южного моря, в ходе которого просят защиты у Мацзу, богини моря, почитаемой многими поколениями моряков Южного моря. Церемония транслируется по всей стране; сразу после этого Флот Южного моря отправляется на учения."
 CHI_secure_kpa_general_staff: "Наладить связи в Генштабе КНА"
 CHI_secure_kpa_general_staff_desc: "Взрастить в Генеральном штабе КНА лояльных Китаю офицеров. Один действующий генерал в этой сети стоит больше, чем дюжина политиков в изгнании."
 CHI_seek_basing_BAN: "Запросить базирование флота в Бангладеш"
 CHI_seek_basing_BAN_desc: "Обратиться к властям Дакки с официальным запросом о предоставлении логистического доступа к портовым объектам Читтагонга, представив это в качестве стратегического партнёрства."
 CHI_seek_basing_BRM: "Запросить базирование флота в Мьянме"
 CHI_seek_basing_BRM_desc: "Обратиться к Нейпьидо с официальным запросом о предоставлении логистического доступа к Кьяукпью и Ситтве, представив его в рамках концепции стратегического партнёрства."
 CHI_seek_basing_CBD: "Запросить базирование флота в Камбодже"
 CHI_seek_basing_CBD_desc: "Обратиться к властям Пномпеня с официальным запросом о предоставлении логистического доступа к военно-морской базе Реам, представив его в рамках концепции стратегического партнёрства."
 CHI_seek_basing_PAK: "Расширить права базирования в Пакистане"
 CHI_seek_basing_PAK_desc: "Развивать партнёрство «Железных братьев» с целью расширения китайской военно-морской логистики в пакистанских портах за пределами Гвадара."
 CHI_seek_basing_SRI: "Запросить базирование флота на Шри-Ланке"
 CHI_seek_basing_SRI_desc: "Обратиться к Коломбо с официальным запросом о предоставлении логистического доступа к Хамбантоте, представив его в рамках концепции стратегического партнёрства."
 CHI_semiconductor_coop_with_kor: "Полупроводниковое сотрудничество с Кореей"
 CHI_semiconductor_coop_with_kor_desc: "Создать совместную инициативу в области исследований и производства полупроводников с Южной Кореей. Доступ к корейскому опыту в сфере производства микросхем ускоряет технологическое развитие Китая."
 CHI_seoul_hanbok_exchange: "Организовать обмен ханбоками в Сеуле"
 CHI_seoul_hanbok_exchange_desc: "Культурная дипломатия может смягчить напряжённость даже в условиях споров об общем культурном наследии. Организация обмена ханбоками в Сеуле способствует улучшению общественного настроения и открывает более мягкий канал влияния на Южную Корею."
 CHI_shenzhou_mission: "Запустить миссию «Шэньчжоу»"
 CHI_shenzhou_mission_desc: "Космический корабль «Шэньчжоу» установлен на ракету-носитель «Длинный марш-2F» в Центре запуска спутников Цзюцюань. Экипаж должен выйти на орбиту и благополучно вернуться на Землю, чтобы подтвердить наши возможности в области самостоятельных пилотируемых космических полётов. Шансы на успех растут по мере накопления опыта в области запусков."
 CHI_sichuan_tibet_railway: "Сычуань-Тибетская железная дорога"
 CHI_sichuan_tibet_railway_desc: "Проложить железную дорогу через ущелья и высокогорные перевалы между Чэнду и Лхасой, более 80% протяжённости которой проходит по туннелям и мостам. Это соединение положит конец изоляции Тибета, усилит центральный контроль над плато и станет стратегической артерией, ведущей к индийской границе."
 CHI_skilled_immigration_drive: "Привлечение квалифицированных иммигрантов"
 CHI_skilled_immigration_drive_desc: "Система предоставления постоянного вида на жительство в Китае исторически считалась одной из самых ограничительных среди всех крупных экономик. Новая визовая программа для высококвалифицированных специалистов, разработанная по образцу программ получения «грин-карты» в США и Канаде, ориентирована на исследователей, инженеров и предпринимателей. По мировым меркам эта программа является скромной, однако она знаменует собой значительный поворот в политике, отражающий признание того факта, что одних только внутренних кадровых ресурсов недостаточно для восполнения возникающих пробелов в секторах технологий и здравоохранения."
 CHI_snwt_central_route: "Переброска воды с юга на север: Центральный маршрут"
 CHI_snwt_central_route_desc: "Направить воду из водохранилища Данцзянкоу на реке Хань в провинции Хубэй на север через провинции Хэнань и Хэбэй в Пекин. Центральный маршрут, введённый в эксплуатацию в декабре 2014 года, обеспечивает столицу питьевой водой и способствует решению проблемы хронического истощения водоносных горизонтов Северо-Китайской равнины."
 CHI_snwt_eastern_route: "Переброска воды с юга на север: Восточный маршрут"
 CHI_snwt_eastern_route_desc: "Перекачивать воду на север из нижнего течения Янцзы вблизи провинции Цзянсу по маршруту древнего Великого канала в засушливые города провинции Шаньдун и Тяньцзинь. Восточный маршрут — первая из трёх отводных линий, которые в совокупности ежегодно доставляют примерно 44,8 миллиарда кубических метров воды в засушливый север."
 CHI_snwt_western_route: "Переброска воды с юга на север: Западный маршрут"
 CHI_snwt_western_route_desc: "Перенаправить верховья реки Янцзы через горный хребет Баян-Хар на Цинхай-Тибетском плато в верховья реки Хуанхэ, обеспечив водой провинции Цинхай, Ганьсу и Шэньси. Этот маршрут, самый сложный с технической точки зрения из всех трёх, обеспечит водой весь засушливый северо-запад."
 CHI_south_china_sea_category: "Южно-Китайское море"
 CHI_south_china_sea_category_desc: "Принимаемые в настоящее время решения определяют нашу позицию в Южно-Китайском море. Действия в этой сфере влияют на показатель «Позиции в Южно-Китайском море», наши отношения с Вьетнамом, Филиппинами и Малайзией, а также на риск конфронтации с США."
 CHI_southern_theatre_command: "Южное театральное командование"
 CHI_southern_theatre_command_desc: "Южное театральное командование, штаб которого расположена в Гуанчжоу, курирует Южно-Китайское море и границу с Вьетнамом. Оно специализируется на координации действий разбросанных по островам гарнизонов и на проведении разведывательных операций, обеспечивающих их взаимодействие."
 CHI_space_program: "Космическая программа Китая"
 CHI_subcontinent_strategy: "Стратегия на субконтиненте"
 CHI_subcontinent_strategy_desc: "Наш дипломатический и военный инструментарий для Индийского субконтинента: давление вдоль линии фактического контроля, партнёрство с Пакистаном и странами южноазиатской периферии, спорная гималайская граница. Принимаемые здесь решения определяют эскалацию на границе и наши рычаги влияния во всём регионе.\n\n$raj_chi_border_readiness$: [?THIS.raj_chi_border_readiness|Y0]\n$raj_chi_border_tension$: [?global.raj_chi_border_tension|Y0]\n\n§YПрогресс претензий§! (для предъявления претензии нужно 80):\nАруначал-Прадеш: [?THIS.raj_chi_border_progress_475|Y0]\nСикким: [?THIS.raj_chi_border_progress_982|Y0]\nАксайчин: [?THIS.raj_chi_border_progress_591|Y0]\nЛадакх: [?THIS.raj_chi_border_progress_993|Y0]"
 CHI_Surveillance_Export: "Экспорт систем наблюдения"
 CHI_Surveillance_Export_desc: "Развернуть китайские системы наблюдения и цифрового мониторинга у недемократического партнёра. Стоит по 80 из фонда ОПОП и из государственной казны."
 CHI_thaad_retaliation_escalate: "Усилить ответ на THAAD"
 CHI_thaad_retaliation_escalate_desc: "Когда в 2016 году Сеул согласился разместить на своей территории американскую систему противоракетной обороны THAAD, Пекин ответил неофициальным бойкотом, который нанёс серьёзный ущерб Lotte, корейскому туризму и экспорту культурной продукции. Усиление давления усугубляет экономические санкции в отношении Южной Кореи."
 CHI_three_gorges_dam_decision: "Достроить плотину «Три ущелья»"
 CHI_three_gorges_dam_decision_desc: "Плотина «Три ущелья», перекрывающая реку Янцзы в районе Ичана, после полного ввода в эксплуатацию в 2012 году стала крупнейшей в мире электростанцией с установленной мощностью 22,5 гигаватт. Её завершение обеспечило поступление огромного объёма гидроэлектроэнергии в национальную энергосистему."
 CHI_three_north_shelterbelt: "Программа лесозащитного пояса «Три севера»"
 CHI_three_north_shelterbelt_desc: "Посадить «Великую зелёную стену» — пояс лесов и лугов, простирающийся через засушливый север от Синьцзяна до северо-востока. Эта программа, запущенная в 1978 году и реализуемая на протяжении десятилетий, сдерживает расширение пустыни Гоби, предотвращает разнос почвы пыльными бурями и позволяет возвращать сельскохозяйственные угодья из пустыни."
 CHI_tiangong_mission: "Собрать станцию «Тяньгун»"
 CHI_tiangong_mission_desc: "Перед тем как на орбиту будут выведены лабораторные модули «Вэньтянь» и «Мэнтянь», основной модуль «Тяньхэ» должен выйти на орбиту и успешно состыковаться с первым пилотируемым кораблём. Постоянный орбитальный аванпост является основой для всех дальнейших проектов за пределами низкой околоземной орбиты. Шансы на успех растут по мере накопления опыта в области запусков."
 CHI_tour_group_freeze: "Заморозка туристических групп"
 CHI_tour_group_freeze_desc: "Приостановить приезд организованных туристических групп в Южную Корею. Такая мера лишает Южную Корею одного из основных источников доходов от туризма и демонстрирует нашу готовность применять экономические рычаги в качестве средства давления, когда этого требуют наши интересы в сфере безопасности."
 CHI_track_ii_academic_forum: "Академический форум второго трека"
 CHI_track_ii_academic_forum_desc: "Организовать диалог второго трека между нашими учёными и их южнокорейскими коллегами по вопросам стабильности на Корейском полуострове. Неофициальные каналы укрепляют доверие там, где официальная дипломатия заходит в тупик."
 CHI_Track_II_Diplomacy: "Дипломатия второго трека"
 CHI_Track_II_Diplomacy_desc: "Финансировать неформальные академические контакты и обмен мнениями между нашими специалистами, их американскими коллегами и корейскими учёными. Каждый раунд таких контактов способствует укреплению взаимопонимания и создаёт основу для официальных переговоров."
 CHI_trilateral_trade_forum: "Трёхсторонний торговый форум"
 CHI_trilateral_trade_forum_desc: "Провести торговый форум «Пекин-Сеул-Пхеньян», посвящённый модели Кэсона. Торговая взаимозависимость формирует собственную группу сторонников мира."
 CHI_uhv_east_transmission: "Энергосеть сверхвысокого напряжения: передача на восток"
 CHI_uhv_east_transmission_desc: "Завершить строительство магистральных линий сверхвысокого напряжения, по которым электроэнергия передаётся на расстояние в тысячи километров от западных электростанций к центрам потребления в Шанхае, Пекине и провинции Гуандун. Передача электроэнергии на большие расстояния позволяет сократить потери в линиях электропередачи и обеспечить прибрежные промышленные центры чистой энергией с запада."
 CHI_uhv_west_generation: "Энергосеть сверхвысокого напряжения: западная генерирующая база"
 CHI_uhv_west_generation_desc: "Развивать крупные энергетические базы на западе: ветровые и солнечные электростанции в Синьцзяне, объекты возобновляемой энергетики во Внутренней Монголии и гидроэлектростанции в верховьях реки Янцзы. Эти удалённые энергетические узлы являются опорой крупнейшей в мире сети электропередачи сверхвысокого напряжения."
 CHI_urban_water_recycling: "Переработка городских сточных вод"
 CHI_urban_water_recycling_desc: "Пекин, Тяньцзинь и крупные города провинции Хэбэй ежегодно сбрасывают в совокупности миллиарды кубических метров городских сточных вод, большая часть которых перед сбросом проходит лишь вторичную очистку. Программа, предусматривающая создание современных станций третичной очистки и специализированных сетей распределения регенерированной воды, позволяет направлять очищенные сточные воды на нужды промышленного охлаждения, благоустройства городской территории и пополнения русел рек. В Тяньцзине уровень повторного использования регенерированной воды превысил 30 процентов; программа устанавливает национальный целевой показатель повторного использования в городских условиях на уровне 25 процентов к 2030 году."
 CHI_us_korea_cost_signaling: "Сигнал США и Корее о цене альянса"
 CHI_us_korea_cost_signaling_desc: "Дать понять Вашингтону и Сеулу, что их альянс в сфере безопасности сопряжён с растущими экономическими и дипломатическими издержками. Целенаправленные меры давления напоминают обеим сторонам, что сохранение статус-кво не обходится без издержек."
 CHI_VEN_currency_swap_line: "Своп-линия юань — боливар"
 CHI_VEN_currency_swap_line_desc: "Установить долгосрочную линию валютного свопа, чтобы защитить Венесуэлу от давления со стороны долга, номинированного в долларах, и обеспечить стабильные поставки сырья."
 CHI_VEN_emergency_food_aid: "Экстренная продовольственная помощь Венесуэле"
 CHI_VEN_emergency_food_aid_desc: "Отправить продовольственные грузы и гуманитарную помощь для стабилизации положения правительства Мадуро. Это укрепит стабильность в Венесуэле и усилит наше влияние."
 CHI_VEN_oil_processing_aid: "Помощь Венесуэле в нефтепереработке"
 CHI_VEN_oil_processing_aid_desc: "Направить наших инженеров и инвестиции в нефтеперерабатывающие предприятия для модернизации нефтепереработки в Венесуэле. Эти меры позволят повысить эффективность добычи и укрепить наши позиции в цепочке поставок нефти из бассейна Ориноко."
 CHI_VEN_petrocaribe_program: "Программа поддержки Венесуэлы"
 CHI_water_conservation_project: "Провинциальный проект водосбережения"
 CHI_water_conservation_project_desc: "В одной из засушливых северных провинций запущен целевой проект по рациональному использованию водных ресурсов, в рамках которого проводится модернизация облицовки каналов, восстановление сетей мониторинга подземных вод и строительство местных водохранилищ с целью сокращения потерь и чрезмерного забора воды. Каждый завершённый проект снижает нагрузку на уровень грунтовых вод в провинции. Эту инициативу можно повторить в провинциях с дефицитом воды — Хэбэй, Шаньси, Хэнань и Шэньси, а реализация достаточного числа таких проектов позволит смягчить проблему общенационального дефицита воды в Китае."
 CHI_water_shortage_category: "Проекты водосбережения"
 CHI_western_theatre_command: "Западное театральное командование"
 CHI_western_theatre_command_desc: "Западное театральное командование в Чэнду, самое обширное по площади, обеспечивает охрану гималайской границы с Индией и неспокойных внутренних районов. Его войска проходят подготовку к ведению обороны на больших высотах и позиционной войне в окопах."
 CHI_yangtze_delta_integration_mission: "Интеграция дельты Янцзы"
 CHI_yangtze_delta_integration_mission_desc: "Благодаря стремлению Шанхая, Цзянсу и Чжэцзяна к скоординированному развитию дельта реки Янцзы имеет все шансы стать наиболее продуктивным промышленным и экспортным коридором Китая. Провинции, которые в течение года смогут повысить объём промышленного производства выше установленного целевого порога, обеспечат устойчивый рост производительности труда в регионе."
 give_up_membership_status_desc: "Выход из Шанхайской организации сотрудничества влечет за собой прекращение участия в ее совместных учениях по безопасности, экономических коридорах и механизмах политических консультаций. На членов организации, демонстрирующих явные признаки агрессии в отношении Китая или ведущих активные военные действия против других членов, оказывается все большее давление с целью их выхода из блока."
 give_up_observer_status_desc: "Отказ от статуса наблюдателя влечет за собой разрыв связей с экономическими и оборонными программами Шанхайской организации сотрудничества. Как правило, такое решение обусловлено сдвигом курса в сторону НАТО или Запада либо ухудшением отношений с Пекином."
 host_joint_exercises_desc: "Китай или Россия могут организовать полномасштабные совместные военные учения ШОС, затратив сорок единиц «Командной мощи», чтобы на 21 день предоставить всем государствам-членам временную идею боеготовности. По завершении учений один из армейских командиров, выбранный случайным образом, повышает уровень навыка на одну ступень. Учения не могут быть начаты, пока какое-либо из государств-членов находится в состоянии войны."
 offer_joint_exercises_specific_desc: "Предложение о проведении двусторонних учений, направленное конкретному члену ШОС. В случае принятия предложения обе стороны тратят по 20 единиц «Командной мощи» на проведение четырнадцатидневных совместных учений, которые дают ШОС конкретную идею для совместных учений и завершаются модификатором мнения о взаимном военном сотрудничестве."
 provide_development_assistance_desc: "Направить ресурсы в [FROM.GetName] с целью содействия его развитию и укрепления связей с ШОС."
 sco_bilateral_border_patrol: "Совместное патрулирование границы со страной [FROM.GetName]"
 sco_bilateral_border_patrol_desc: "Координировать операции по обеспечению безопасности границ совместно со страной [FROM.GetName] в целях борьбы с трансграничной преступностью и укрепления взаимного доверия."
 sco_bilateral_cultural_exchange: "Культурный обмен со страной [FROM.GetName]"
 sco_bilateral_cultural_exchange_desc: "Запустить программу культурного и академического обмена со страной [FROM.GetName], способствующую укреплению межличностных связей и взаимному пониманию."
 sco_bilateral_energy_deal: "Энергетическое партнёрство со страной [FROM.GetName]"
 sco_bilateral_energy_deal_desc: "Заключить долгосрочное соглашение о поставках энергоресурсов со страной [FROM.GetName], обеспечив стабилизацию цен и гарантировав поставки стратегически важных ресурсов."
 sco_bilateral_intel_sharing: "Обмен разведданными со страной [FROM.GetName]"
 sco_bilateral_intel_sharing_desc: "Установить безопасный канал обмена разведывательной информацией со страной [FROM.GetName] для координации антитеррористических и охранных операций."
 sco_bilateral_trade_agreement: "Двустороннее торговое соглашение со страной [FROM.GetName]"
 sco_bilateral_trade_agreement_desc: "Создать официальную торговую структуру со страной [FROM.GetName] в рамках ШОС, предусматривающую снижение тарифов и стимулирование совместных инвестиций."
 sco_megaproject_air_defense_optin: "Присоединиться к объединённой системе ПВО ШОС"
 sco_megaproject_air_defense_optin_desc: "Присоединиться к объединённой системе ПВО ШОС, внося свой вклад в создание общей инфраструктуры радиолокационной и противоракетной обороны."
 sco_megaproject_air_defense_propose: "Предложить объединённую систему ПВО ШОС"
 sco_megaproject_air_defense_propose_desc: "Предложить создание единой системы противовоздушной обороны, охватывающей все государства-члены ШОС, с совместным использованием радиолокационного покрытия и координацией операций по противовоздушной обороне."
 sco_megaproject_dev_bank_optin: "Вступить в Банк развития ШОС"
 sco_megaproject_dev_bank_optin_desc: "Стать участником Банка развития ШОС в качестве вносящего взносы члена и получить доступ к низкопроцентному финансированию развития."
 sco_megaproject_dev_bank_propose: "Предложить Банк развития ШОС"
 sco_megaproject_dev_bank_propose_desc: "Предложить создать многосторонний банк развития для финансирования инфраструктурных проектов и развития в государствах-членах ШОС."
 sco_megaproject_energy_grid_optin: "Присоединиться к Единой энергосистеме ШОС"
 sco_megaproject_energy_grid_optin_desc: "Присоединиться к проекту Единой энергосистемы ШОС, предоставляя ресурсы в обмен на доступ к общей энергетической инфраструктуре."
 sco_megaproject_energy_grid_propose: "Предложить Единую энергосистему ШОС"
 sco_megaproject_energy_grid_propose_desc: "Предложить создание интегрированной энергетической сети, охватывающей государства-члены ШОС, что позволит снизить затраты и повысить энергетическую безопасность всех участников."
 sco_megaproject_railway_optin: "Присоединиться к Трансъевразийской железной дороге"
 sco_megaproject_railway_optin_desc: "Присоединиться к проекту Трансъевразийской железной дороги и инвестировать в торговый коридор, чтобы получить долгосрочные экономические выгоды."
 sco_megaproject_railway_propose: "Предложить Трансъевразийскую железную дорогу"
 sco_megaproject_railway_propose_desc: "Предложить создание охватывающей весь континент железнодорожной сети, которая соединит страны-участницы ШОС, что позволит значительно увеличить объёмы торговли и строительные мощности."
 start_joint_exercises_specific_desc: "Завершает двусторонние учения ШОС с одной из стран-участниц, принявшей соответствующее предложение. Обе страны в течение четырнадцати дней реализуют программу совместных учений ШОС, и в итоге учения завершаются обменом мнениями по вопросам военного сотрудничества."
 chi_bri.1.a: "Приступить к работе"
 chi_bri.1.d: "В сентябре 2013 года председатель Си Цзиньпин выступил перед аудиторией в Астане (Казахстан) и обрисовал смелое видение: Экономический пояс Шёлкового пути, связывающий Китай с Европой, Центральной Азией и Африкой. Эта инициатива станет известна как «Один пояс и один путь» — крупнейшая инфраструктурная программа в истории."
 chi_bri.1.t: "Один пояс и один путь"
 chi_bri.10.a: "Предложить льготные условия"
 chi_bri.10.d: "[FROM.GetName] направляет официальную заявку. Делегация добивается китайского финансирования и опыта для проекта §Y[FROM.GetBRIProjectName]§!. Пекину предстоит соотнести стратегическую ценность партнёрства с финансовыми и политическими условиями, которые он готов предложить."
 chi_bri.10.d_opt: "Отклонить заявку"
 chi_bri.10.t: "[FROM.GetName] запрашивает проект инициативы «Один пояс и один путь»"
 chi_bri.103.a: "Принять приглашение"
 chi_bri.103.b: "Отклонить предложение"
 chi_bri.103.d: "Пекин официально пригласил нас стать членом-основателем Азиатского банка инфраструктурных инвестиций. Членство приносит ежегодные дивиденды от инфраструктурных проектов по всей сети инициативы «Один пояс и один путь», но привязывает наше финансовое благополучие к проектам под руководством Китая. Министерство экономики ждёт нашего решения."
 chi_bri.103.t: "Китай приглашает нас вступить в АБИИ"
 chi_bri.104.a: "Приветствовать нового члена"
 chi_bri.104.d: "[From.GetName] принимает наше приглашение и вступает в Азиатский банк инфраструктурных инвестиций в качестве члена-основателя. Их участие укрепляет легитимность банка и расширяет его охват."
 chi_bri.104.t: "[From.GetName] вступает в АБИИ"
 chi_bri.105.a: "Принять к сведению их позицию"
 chi_bri.105.d: "[From.GetName] отклоняет наше приглашение вступить в Азиатский банк инфраструктурных инвестиций. Этот отказ явно говорит о предпочтении финансовых институтов под руководством Запада и осложняет наши региональные амбиции."
 chi_bri.105.t: "[From.GetName] отказывается от членства в АБИИ"
 chi_bri.13.a: "Предоставить отсрочку на один год"
 chi_bri.13.b: "Отказать в отсрочке"
 chi_bri.13.d: "[FROM.GetName] обращается к Пекину с просьбой приостановить на один год платежи по непогашенным обязательствам в рамках инициативы «Один пояс и один путь», ссылаясь на бюджетные ограничения и непредвиденные обстоятельства. Основной долг после отсрочки по-прежнему подлежит погашению."
 chi_bri.13.t: "Просьба об отсрочке по кредиту"
 chi_bri.131.a: "Предоставить право захода в порты в обмен на экономическую поддержку"
 chi_bri.131.b: "Отклонить запрос"
 chi_bri.131.d: "Пекин обратился к нам с предложением: предоставить ВМС НОАК право захода и дозаправки в наших портах в обмен на значительную экономическую помощь. Этот пакет увеличит наш экспорт и промышленное производство на следующее десятилетие, но его принятие привлечёт пристальное внимание Австралии и США."
 chi_bri.131.t: "Китай просит право захода в порты"
 chi_bri.132.a: "Пересмотреть нашу позицию в Тихом океане"
 chi_bri.132.d: "[From.GetName] в одностороннем порядке отзывает право захода, ранее предоставленное ВМС НОАК. Охлаждение отношений и конкурирующие западные предложения подорвали соглашение, которого мы с таким трудом добились."
 chi_bri.132.t: "Право базирования отозвано"
 chi_bri.133.a: "Принять пакт при посредничестве Китая"
 chi_bri.133.b: "Отклонить соглашение"
 chi_bri.133.d: "Пекин предлагает себя в качестве гаранта договорённости о ненападении между нами и нашим региональным соперником. Если одна из сторон нарушит мир, Китай обязуется встать на сторону пострадавшей. Предложение весомо с учётом растущего дипломатического влияния Пекина."
 chi_bri.133.t: "Китай предлагает посредничество в пакте о ненападении"
 chi_bri.134.a: "Соблюсти пакт и объявить войну"
 chi_bri.134.b: "Сохранить нейтралитет и смириться с репутационными потерями"
 chi_bri.134.d: "Между двумя сторонами, пакт о ненападении которых мы лично гарантировали, разразилась война. Честь и авторитет требуют выступить на стороне жертвы, но война с агрессором обойдётся дорого. Бездействие не забудут."
 chi_bri.134.t: "Наш пакт нарушен"
 chi_bri.135.a: "Координировать действия с китайскими партнёрами"
 chi_bri.135.d: "Пекин уведомил нас, что в соответствии с договорённостью о ненападении, заключённой при его посредничестве, Китайская Народная Республика вступит в войну на нашей стороне. Дипломатический вес китайского вмешательства меняет стратегическую картину."
 chi_bri.135.t: "Китай соблюдёт пакт"
 chi_bri.15.a: "Порт Гвадар (Белуджистан)"
 chi_bri.15.b: "Особая экономическая зона Белуджистана"
 chi_bri.15.c: "Железнодорожный коридор Лахора (Пенджаб)"
 chi_bri.15.d: "Пекин одобрил флагманский мегапроект для страны [FROM.GetName]. В отличие от обычных работ в рамках инициативы «Один пояс и один путь», этим проектом будет управлять Китай, и он будет напрямую служить китайским стратегическим интересам. Выбор места определит назначение проекта на десятилетия вперёд."
 chi_bri.15.d_opt: "Порт Хамбантота (Южная провинция)"
 chi_bri.15.e: "Порт-Сити Коломбо (Западная провинция)"
 chi_bri.15.f: "Терминал железной дороги Момбаса — Найроби"
 chi_bri.15.g: "Прибрежный стратегический объект"
 chi_bri.15.t: "Мегапроект: где строить?"
 chi_bri.20.a: "Принять условия аренды"
 chi_bri.20.b: "Отказаться отдавать порт"
 chi_bri.20.d: "Не в силах обслуживать долги, накопленные в ходе строительства, правительство Шри-Ланки стоит перед суровым выбором. China Merchants Port Holdings предлагает взять порт Хамбантота в аренду на 99 лет в обмен на облегчение долгового бремени. Критики называют это дипломатией долговой ловушки, сторонники — прагматичной государственной политикой."
 chi_bri.20.t: "Хамбантота: аренда на 99 лет"
 chi_bri.21.a: "Предоставить Китаю доступ для флота"
 chi_bri.21.b: "Вежливо отказать"
 chi_bri.21.d: "Когда Китайско-пакистанский экономический коридор заработал в полную силу, ВМС НОАК обратились к Исламабаду с негромкой, но важной просьбой: права использовать Гвадар как пункт логистики и снабжения. Такое решение превратит КПЭК из экономического коридора в стратегический плацдарм."
 chi_bri.21.t: "Гвадар: запрос на военно-морские объекты"
 chi_bri.22.a: "Предоставить Китаю право на базу"
 chi_bri.22.b: "Отклонить предложение"
 chi_bri.22.d: "Джибути десятилетиями принимает иностранные военные объекты, но предложение Пекина иного рода. Планируемый объект в Доралехе станет первой постоянной зарубежной базой Народно-освободительной армии — рубежом, которого давно опасались западные стратеги и к которому давно стремились китайские планировщики."
 chi_bri.22.t: "Доралех: первая зарубежная база Китая"
 chi_bri.30.a: "Жёстко ответить санкциями"
 chi_bri.30.b: "Пока следить за ситуацией"
 chi_bri.30.d: "Объявление Китая о нефтяных фьючерсах в юанях вызвало потрясение в Вашингтоне. Если ценообразование в нефтеюанях приживётся среди членов ОПЕК и партнёров инициативы «Один пояс и один путь», статус доллара как резервной валюты столкнётся с самым серьёзным вызовом за несколько поколений. Конгресс требует ответа."
 chi_bri.30.t: "Нефтеюань Пекина угрожает гегемонии доллара"
 chi_bri.40.a: "Объявить смелую новую инициативу"
 chi_bri.40.b: "Подписать волну новых обязательств"
 chi_bri.40.c: "Сделать ставку на реформы и прозрачность"
 chi_bri.40.d: "Главы правительств и министры финансов из Азии, Африки и Европы съехались в Пекин на проводимый раз в три года форум «Один пояс и один путь». Это отчасти саммит, отчасти торговая ярмарка и отчасти геополитический спектакль. Решения Китая на этой неделе зададут тон следующему этапу инициативы."
 chi_bri.40.t: "В Пекине открывается форум «Один пояс и один путь»"
 chi_bri.42.a: "Взять напористый, суверенный тон"
 chi_bri.42.b: "Сделать акцент на сотрудничестве и взаимной выгоде"
 chi_bri.42.d: "На итоговую пресс-конференцию форума собрались журналисты со всего мира. Подача, которую сейчас выберет Китай, определит международное освещение и ожидания от следующих трёх лет дипломатии инициативы «Один пояс и один путь»."
 chi_bri.42.t: "Пресс-конференция форума"
 chi_bri.43.a: "Опубликовать итоги"
 chi_bri.43.d: "Делегации разъехались, баннеры сняты. Дипломаты и экономисты подводят итоги: подписанные соглашения, взятые обязательства, накопленное влияние. Форум «Один пояс и один путь» вновь изменил представления о глобальной роли Китая."
 chi_bri.43.t: "Форум «Один пояс и один путь»: итоговая оценка"
 chi_bri.50.a: "Провозгласить новую эпоху китайского лидерства"
 chi_bri.50.d: "Сеть инициативы «Один пояс и один путь» охватывает теперь все обитаемые континенты. Паутина инфраструктуры, долгов и дипломатических обязательств, которую Пекин плёл десятилетиями, кристаллизовалась в нечто беспрецедентное: международный порядок, выстроенный по образу китайских интересов. Историки будут спорить, называть ли это гегемонией или партнёрством. Мир назовёт это просто фактом."
 chi_bri.50.t: "Pax Sinica установлен"
 chi_bri.70.a: "Объявить эпоху африканско-китайского партнёрства"
 chi_bri.70.d: "Совокупный эффект более чем десятилетия саммитов Форума китайско-африканского сотрудничества, проектов инициативы «Один пояс и один путь» и дипломатии списания долгов привёл к решительному сдвигу. По всему континенту правительства, которые когда-то лавировали между Пекином и Вашингтоном, сплачиваются вокруг Китая как главного партнёра. Выросло целое поколение африканских лидеров, для которых китайская инфраструктура, китайские кредиты и китайские советники — норма."
 chi_bri.70.t: "Африка принимает китайский век"
 chi_bri.71.a: "Направить проектные группы"
 chi_bri.71.d: "Чтобы закрепить новую эпоху, Пекин выделил средства на серию флагманских мегапроектов в своей сети африканских партнёров. Это будут не обычные инфраструктурные гранты, а проекты с китайским участием, закрепляющие долгосрочные стратегические права и условия преимущественного доступа."
 chi_bri.71.t: "Флагманские проекты для Африки"
 chi_bri.80.a: "Объявить о списании долга"
 chi_bri.80.b: "Закрепить условия о залоге"
 chi_bri.80.d: "В Пекине открылось очередное пленарное заседание Форума китайско-африканского сотрудничества. Министры финансов, главы государств и представители банков развития собрались, чтобы оценить состояние китайско-африканских связей и наметить дальнейший путь. Первое заявление саммита определит, запомнится ли эта встреча щедростью или давлением."
 chi_bri.80.t: "Открывается саммит ФОКАК"
 chi_bri.81.a: "Ужесточить санкции против Каракаса"
 chi_bri.81.b: "Выразить дипломатический протест"
 chi_bri.81.c: "Принять к сведению и двигаться дальше"
 chi_bri.81.d: "Китай официально оформил преемника соглашения «Петрокарибе», распространив условия «кредиты в обмен на нефть» на Венесуэлу и её соседей. Вашингтону предстоит выбрать: выразить недовольство, рискуя ещё больше отдалить Латинскую Америку, или молча смириться с происходящим."
 chi_bri.81.t: "Китай приходит в Каракас"
 chi_bri.82.a: "Простить долг"
 chi_bri.82.b: "Превратить задолженность в концессии"
 chi_bri.82.c: "Оставить дефолт в силе"
 chi_bri.82.d: "Нефтяные доходы Венесуэлы рухнули, а платежи по долгу перед китайскими государственными банками сильно просрочены. Пекину предстоит решить: списать убыток ради доброй воли, взыскать залог или оставить дефолт в силе как предупреждение другим заёмщикам."
 chi_bri.82.t: "Каракас не может платить"
 chi_bri.83.a: "Выразить протест и добиваться демонтажа"
 chi_bri.83.b: "Запустить ответную программу"
 chi_bri.83.c: "Смириться с новой реальностью"
 chi_bri.83.d: "Китай завершил строительство сети наземных станций навигации и слежения «Бэйдоу» в Аргентине и Боливии, резко расширив покрытие группировки над Южным полушарием. Космическое командование и Южное командование США отнесли эти объекты к объектам двойного назначения. Вашингтону предстоит решить, как ответить."
 chi_bri.83.t: "Станции слежения «Бэйдоу» в Патагонии"
 chi_bri.84.a: "Добиться всех четырёх переходов"
 chi_bri.84.b: "Закрепить трёх надёжных партнёров"
 chi_bri.84.d: "Завершение стратегии «Доктрина Монро наоборот» создало условия для каскада смен дипломатического признания. Несколько латиноамериканских государств, всё ещё официально признающих Тайбэй, теперь готовы к тихому переходу при содействии Китая."
 chi_bri.84.t: "Тайвань теряет последних союзников"
 chi_bri.85.a: "Закрепить региональную перестройку"
 chi_bri.85.b: "Приберечь политический капитал"
 chi_bri.85.d: "Влияние Китая теперь встроено в латиноамериканские институты, и Организация американских государств планомерно утратила роль площадки регионального управления под руководством США. Предпочтительным многосторонним форумом стало СЕЛАК. Последствия ощущаются от Вашингтона до Буэнос-Айреса."
 chi_bri.85.t: "ОАГ теряет мандат"
 chi_bri.86.a: "Согласовать более жёсткий режим санкций"
 chi_bri.86.b: "Выразить обеспокоенность по дипломатическим каналам"
 chi_bri.86.d: "Ратификация Китаем 25-летнего всеобъемлющего партнёрства с Тегераном потрясла архитектуру безопасности Ближнего Востока. Американские чиновники, израильские военные планировщики и страны Персидского залива оценивают последствия и обдумывают ответ."
 chi_bri.86.t: "Тревога в Вашингтоне, Тель-Авиве и Эр-Рияде"
 chi_bri.87.a: "Разрекламировать достижение на весь мир"
 chi_bri.87.b: "Закрепить успех внутри страны"
 chi_bri.87.d: "Пекинское коммюнике, оформившее примирение Саудовской Аравии и Ирана, получило отклик во всём международном сообществе. Роль Китая как посредника между двумя давними противниками наглядно демонстрирует дипломатический охват, который мало кто предсказывал ещё десять лет назад."
 chi_bri.87.t: "Пекин ставит успех себе в заслугу"
 chi_bri.88.a: "Объявить новую систему расчётов"
 chi_bri.88.d: "Страны Персидского залива начали проводить часть нефтяных сделок в юанях, завершив финансовую архитектуру, которую Китай выстраивал предыдущее десятилетие. Размывание гегемонии доллара на энергетических рынках идёт постепенно, но теперь заложено в саму структуру."
 chi_bri.88.t: "Нефтедоллар даёт трещину"
 chi_bri.89.a: "Добиться ключевых переходов"
 chi_bri.89.b: "Добиваться полного охвата"
 chi_bri.89.d: "Стратегия Китая в отношении Форума тихоокеанских островов созрела настолько, что смена дипломатического признания стала достижимой. Соломоновы Острова и Кирибати — самые доступные цели; Тувалу и Палау тоже достижимы, если Пекин готов вложиться ещё."
 chi_bri.89.t: "Тихоокеанские острова меняют признание"
 chi_bri.90.a: "Осудить пакт и согласовать ответ"
 chi_bri.90.b: "Выразить обеспокоенность и наблюдать"
 chi_bri.90.d: "Хониарский пакт о безопасности вызвал экстренную сессию австралийско-американских министерских консультаций. Канберра, Вашингтон и Веллингтон согласовывают ответ на то, что они называют прямой угрозой суверенитету тихоокеанских государств и региональной стабильности."
 chi_bri.90.t: "Канберра требует ответов"
 chi_bri.91.a: "Заявить о лидерстве в безопасности Тихого океана"
 chi_bri.91.b: "Признать дипломатическую неудачу"
 chi_bri.91.d: "Подведены итоги Тихоокеанской инициативы восьми стран. История взаимодействия Китая с островными государствами Тихого океана определит, сможет ли Пекин претендовать на лидерство в сфере безопасности или ему придётся смириться с репутационным ударом."
 chi_bri.91.t: "Доклад по инициативе восьми стран"
 chi_bri.92.a: "Ускорить ответ союзников"
 chi_bri.92.b: "Рассмотреть варианты эскалации"
 chi_bri.92.c: "Скорректировать курс и наблюдать"
 chi_bri.92.d: "Получив доступ к базированию на Соломоновых Островах, Китай расширил досягаемость ВМС НОАК до границы второй цепочки островов. Индо-Тихоокеанское командование США и Силы обороны Австралии оценивают стратегические последствия и определяют ответ."
 chi_bri.92.t: "Пекин достигает второй цепочки островов"
 chi_bri.93.a: "Выразить твёрдое неодобрение"
 chi_bri.93.b: "Принять к сведению"
 chi_bri.93.d: "Италия первой из стран «Большой семёрки» подписала меморандум о взаимопонимании по инициативе «Один пояс и один путь», создав прецедент, на который остальные партнёры по G7 смотрят с разной долей тревоги и интереса. Каждая столица теперь должна определить свою позицию в отношении китайских инфраструктурных инвестиций."
 chi_bri.93.t: "Рим подписывает соглашение с Пекином"
 chi_bri.94.a: "Сплотить ключевых партнёров"
 chi_bri.94.b: "Удержать систему инвестициями"
 chi_bri.94.d: "Выход Литвы из механизма «17+1» обнажил линию раскола между прибалтийскими и северными участниками с одной стороны и балканско-вышеградским ядром — с другой. Китаю предстоит решить: сплотить меньшую, но более надёжную коалицию или потратиться, чтобы удержать более широкую систему."
 chi_bri.94.t: "«17+1» на распутье"
 chi_bri.96.a: "Начинается век Китая."
 chi_bri.96.b: "Признать новую реальность."
 chi_bri.96.c: "Принять к сведению складывающийся порядок."
 chi_bri.96.d: "Консенсусный мировой порядок, который Китай выстроил через Глобальную инициативу развития, Азиатский банк инфраструктурных инвестиций и высококачественное сотрудничество в рамках инициативы «Один пояс и один путь», — уже не мечта, а действующая архитектура международной системы. Члены БРИКС+ составляют большинство населения мира. Давосская речь 2017 года теперь читается как пророчество."
 chi_bri.96.t: "Сообщество единой судьбы"
 CHI_foreign.012.a: "Будем внимательно следить."
 CHI_foreign.012.d: "Китайские чиновники негласно предложили Вашингтону пересмотреть подход к корейскому вопросу, намекнув на возможную дипломатическую инициативу. Этот сигнал может оказаться как открывающейся возможностью, так и отвлекающим манёвром."
 CHI_foreign.012.t: "Сигнал из Пекина"
 CHI_foreign.014.a: "Изучить проект."
 CHI_foreign.014.d: "Основа для совместного заявления о будущем Корейского полуострова заложена. Пекин представил на рассмотрение проект рамочного документа."
 CHI_foreign.014.t: "Основа совместного заявления"
 CHI_foreign.024.a: "Тщательно взвесим варианты."
 CHI_foreign.024.d: "Китай дал понять, что согласен на урегулирование корейского вопроса с Сеулом в центре, — исторический сдвиг в позиции Пекина, с которым Пхеньяну теперь придётся считаться."
 CHI_foreign.024.t: "Пекин поддерживает Сеул"
 CHI_foreign.030.a: "Это недопустимая политизация торговых отношений."
 CHI_foreign.030.b: "Давление прискорбно, но терпимо. Мы стоим на своём."
 CHI_foreign.030.d: "Ответ Пекина на размещение THAAD в Южной Корее перерос из дипломатического протеста в экономическое принуждение. Китайские власти вводят ограничения для корейского бизнеса, развлекательной продукции и туризма — выверенную кампанию, призванную нанести ущерб, не вводя формального режима санкций."
 CHI_foreign.030.t: "Ответ на THAAD"
 CHI_foreign.031.a: "Принять сигнал к сведению. Сохранить нынешнюю позицию."
 CHI_foreign.031.b: "Заверениям Китая нельзя верить. Усилить наши обязательства перед Кореей."
 CHI_foreign.031.d: "По военным каналам Китай дал понять, что учения на реке Ялу носят оборонительный характер. Послание Пекина ясно: Китай сам справится с поведением Северной Кореи и не нуждается в американской эскалации для поддержания стабильности в регионе."
 CHI_foreign.031.t: "Пекин сигнализирует о сдержанности"
 CHI_foreign.032.a: "Поднять по тревоге наш корейский гарнизон. Запросить срочные консультации с Сеулом."
 CHI_foreign.032.b: "Следить за ситуацией. Избегать провокационных ответов."
 CHI_foreign.032.d: "Спутниковые снимки подтверждают масштабную перегруппировку северокорейских сухопутных войск в наступательные порядки вдоль 38-й параллели. Перегруппировку поддерживают китайские тыловые эшелоны. Похоже, Корейская народная армия готовится к чему-то большему, чем обычные учения."
 CHI_foreign.032.t: "Наращивание сил на Ялу"
 CHI_foreign.033.a: "Начать планирование на случай кризиса. Проконсультироваться с Вашингтоном."
 CHI_foreign.033.b: "Конституционные ограничения абсолютны. Действовать только по дипломатическим каналам."
 CHI_foreign.033.d: "Наращивание северокорейских сил вдоль 38-й параллели вновь разожгло в японском парламенте споры о статье 9 и конституционных пределах самообороны Японии. «Ястребы» требуют срочно пересмотреть толкование обязательств по коллективной самообороне."
 CHI_foreign.033.t: "Споры о статье 9"
 CHI_foreign.034.a: "Задействовать наши обязательства по взаимной обороне с Южной Кореей."
 CHI_foreign.034.b: "Созвать экстренное заседание Совета Безопасности."
 CHI_foreign.034.d: "Северокорейские войска при тыловой и материальной поддержке Китая пересекли демилитаризованную зону. Китай официально не вступил в конфликт, но его следы видны во всей северокорейской военной машине."
 CHI_foreign.034.t: "Война на полуострове"
 CHI_foreign.035.a: "Объявить наивысшую готовность. Подготовить резервные силы."
 CHI_foreign.035.b: "Ничего не предпринимать, пока ситуация не прояснится."
 CHI_foreign.035.d: "Неподтверждённые сообщения о стрельбе и передвижениях войск внутри охраняемого периметра Пхеньяна говорят о том, что в столице Северной Кореи происходит нечто чрезвычайное. Китайские государственные СМИ молчат. Ситуация опасно неясна."
 CHI_foreign.035.t: "Хаос в Пхеньяне"
 CHI_foreign.036.a: "Выступить с официальным заявлением, осуждающим вмешательство в суверенитет Северной Кореи."
 CHI_foreign.036.b: "Установить тайный канал связи с переходным советом."
 CHI_foreign.036.d: "Офицеры, поддерживаемые Китаем, совершили переворот против Ким Чен Ына. Семья Кимов отстранена от власти. В Пхеньяне формируется переходный совет во главе с людьми, известными как собеседники Пекина. Похоже, Китай помогает осуществить управляемую передачу власти."
 CHI_foreign.036.t: "Переворот в Пхеньяне"
 CHI_foreign.037.a: "Выразить Пекину обеспокоенность по дипломатическим каналам."
 CHI_foreign.037.b: "Выжидать и наблюдать. Ситуация слишком неустойчива для жёстких заявлений."
 CHI_foreign.037.d: "Переворот в Северной Корее несёт Японии и возможности, и опасности. Прокитайское переходное правительство в Пхеньяне может оказаться предсказуемее Ким Чен Ына, но китайское государство-клиент на Корейском полуострове — серьёзный стратегический вызов для Токио."
 CHI_foreign.037.t: "Новый Пхеньян"
 CHI_foreign.038.a: "Официально опротестовать одностороннюю перестройку власти в Северной Корее."
 CHI_foreign.038.b: "Принять новую реальность. Искать компромисс с корейской политикой Пекина."
 CHI_foreign.038.d: "Китай объявил условия послепереворотного политического урегулирования в Пхеньяне. Новое правительство Северной Кореи конституционно реорганизовано, экономически встроено в китайские цепочки поставок и стратегически подчинено корейской политике Пекина."
 CHI_foreign.038.t: "Пекинское урегулирование"
 CHI_foreign.040.a: "Такая переориентация недопустима. Дать Сеулу понять, что будут последствия."
 CHI_foreign.040.b: "Смириться с дрейфом. Союз нельзя удержать принуждением."
 CHI_foreign.040.d: "Принятие Южной Кореей доктрины стратегической автономии и её решение сделать Китай главным партнёром в сфере безопасности означают глубокую перестройку баланса сил в Индо-Тихоокеанском регионе. Американо-корейский союз, существующий с 1953 года, переживает самое серьёзное испытание за десятилетия."
 CHI_foreign.040.t: "Сеул уходит в дрейф"
 CHI_foreign.041.a: "Выразить осторожный интерес к меняющейся конфигурации."
 CHI_foreign.041.b: "Отвергнуть такую трактовку. Китай не бросает Северную Корею."
 CHI_foreign.041.d: "Поворот Южной Кореи к Пекину вынудил Пхеньян к неприятному расчёту. Партнёрство Китая и Сеула без участия Северной Кореи стратегически опаснее, чем американское присутствие на юге."
 CHI_foreign.041.t: "Какой Китай?"
 CHI_foreign.042.a: "Начать срочные консультации с Вашингтоном о компенсирующих мерах."
 CHI_foreign.042.b: "Оценить, возможны ли двусторонние японско-корейские договорённости в сфере безопасности."
 CHI_foreign.042.d: "Выход Южной Кореи из трёхстороннего механизма безопасности США, Японии и Кореи оставляет Японию в изоляции в том, что осталось от индо-тихоокеанской архитектуры. Без участия Сеула отношениям Японии с Вашингтоном в сфере безопасности не хватает важнейшей опоры."
 CHI_foreign.042.t: "Токио в одиночестве"
 CHI_foreign.043.a: "Заверить наших филиппинских партнёров в нашей приверженности."
 CHI_foreign.043.b: "Начать стратегический пересмотр обязательств в Индо-Тихоокеанском регионе."
 CHI_foreign.043.d: "Выход Южной Кореи из трёхстороннего механизма безопасности вызвал в Маниле тревогу о прочности американских обязательств в Индо-Тихоокеанском регионе. Филиппинские чиновники начали негласно пересматривать собственную союзническую позицию."
 CHI_foreign.043.t: "Механизм расползается"
 CHI_foreign.044.a: "Смириться со стратегической неудачей. Перестроиться вокруг оставшихся партнёров."
 CHI_foreign.044.d: "Выход Южной Кореи из трёхстороннего механизма фактически разрушает индо-тихоокеанскую архитектуру, которую Вашингтон строил десятилетие. Терпеливой дипломатией Китай добился того, чего никогда не добился бы конфронтацией."
 CHI_foreign.044.t: "Крах Индо-Тихоокеанской стратегии"
 CHI_foreign.045.a: "Принять просьбу. Начать организованный вывод войск."
 CHI_foreign.045.b: "Отказать. Американские войска остаются на полуострове по усмотрению Вашингтона."
 CHI_foreign.045.d: "Официальное одобрение Южной Кореей китайских гарантий безопасности сделало дальнейшее присутствие сухопутных войск США на полуострове политически невозможным. Сеул запросил график вывода американских войск с корейской территории."
 CHI_foreign.045.t: "Войска возвращаются домой"
 CHI_foreign.046.a: "Начать экстренные консультации с Вашингтоном о позиции Японии в сфере безопасности."
 CHI_foreign.046.b: "Ускорить развитие собственного оборонного потенциала."
 CHI_foreign.046.d: "Вывод американских войск из Кореи делает японо-американский союз стратегически неполным. Южный фланг Японии оголён, и допущения, на которых семь десятилетий строилось оборонное планирование Японии, требуют коренного пересмотра."
 CHI_foreign.046.t: "Опустевший союз"
 CHI_foreign.047.a: "Принять гарантию. Будущее Кореи не может зависеть от далёких покровителей."
 CHI_foreign.047.b: "Отклонить предложение. Суверенитет Кореи нельзя обменять на китайское покровительство."
 CHI_foreign.047.d: "Китай предложил Южной Корее официальную гарантию безопасности для любого будущего урегулирования по объединению. Пекинская гарантия обязывает Китай защищать суверенитет объединённой Кореи в обмен на стратегические договорённости, которые фактически превращают Корею в государство, ориентированное на Китай."
 CHI_foreign.047.t: "Пекинская гарантия"
 CHI_foreign.048.a: "Работать в рамках пекинской схемы. Выживание требует реализма."
 CHI_foreign.048.b: "Отвергнуть схему. Нас не поглотят."
 CHI_foreign.048.d: "Предложение Китая гарантировать безопасность объединённой Кореи заставило Пхеньян взглянуть правде в глаза. Руководству Северной Кореи предстоит выбрать между сопротивлением и приспособлением, зная, что сопротивление без поддержки Китая невозможно."
 CHI_foreign.048.t: "Гарантия и Север"
 CHI_foreign.049.a: "Выступить с официальным заявлением о процессе и его последствиях."
 CHI_foreign.049.b: "Признать итог. Соответственно скорректировать нашу индо-тихоокеанскую стратегию."
 CHI_foreign.049.d: "Объединение Кореи идёт под эгидой Китая и на китайских условиях. Семьдесят лет американского военного присутствия и дипломатических вложений в безопасность Кореи привели к объединённой Корее, ориентированной на Пекин."
 CHI_foreign.049.t: "Объединение, которого мы не добивались"
 CHI_foreign.050.a: "Отмечено."
 CHI_foreign.050.d: "Авианосные ударные группы США выдвинулись к Корейскому проливу в ответ на рост напряжённости. Пекин следит за их перемещением."
 CHI_foreign.050.t: "Авианосцы идут к Корейскому проливу"
 CHI_foreign.051.a: "Непростая ситуация."
 CHI_foreign.051.d: "Напряжённость на Корейском полуострове достигла критического порога. Вашингтон, Токио и Сеул перешли в режим повышенной готовности."
 CHI_foreign.051.t: "Региональная кризисная тревога"
 CHI_foreign.052.a: "Отступить. Цена слишком высока."
 CHI_foreign.052.b: "Сохранять давление."
 CHI_foreign.052.d: "Напряжённость на Корейском полуострове достигла пика. Пекину предстоит решить: отступить, сохранить курс или добиваться решающего исхода."
 CHI_foreign.052.t: "Полуостров на грани"
 CHI_foreign.053.a: "Отрадное событие."
 CHI_foreign.053.d: "Кризисная атмосфера на Корейском полуострове рассеялась. Региональные державы приветствуют возвращение стабильности."
 CHI_foreign.053.t: "Разрядка на Корейском полуострове"
 CHI_foreign.054.a: "Эта сделка отвечает нашим экономическим интересам."
 CHI_foreign.054.b: "Нефть Казахстана должна оставаться под национальным контролем."
 CHI_foreign.054.d: "China National Petroleum Corporation подала официальное предложение о покупке PetroKazakhstan за $4,18 млрд. Сделка передаст оперативный контроль над крупнейшим независимым нефтедобытчиком Казахстана в китайские руки в обмен на крупную выплату в государственную казну."
 CHI_foreign.054.t: "Предложение CNPC о покупке"
 CHI_foreign.056.a: "Мы уважаем их решение."
 CHI_foreign.056.d: "Астана отклонила предложение CNPC о покупке PetroKazakhstan, сославшись на опасения за национальный суверенитет над ресурсами."
 CHI_foreign.056.t: "Казахстан отклоняет предложение CNPC"
 CHI_foreign.057.a: "Сделка отвечает экономическим интересам Анголы."
 CHI_foreign.057.b: "Наши энергоресурсы не продаются."
 CHI_foreign.057.d: "Sinopec предложила $7,2 млрд за Addax Petroleum, получив доступ к лицензиям на добычу нефти в Анголе, Нигерии и Иракском Курдистане. Это стало бы крупнейшим зарубежным приобретением Sinopec на сегодняшний день."
 CHI_foreign.057.t: "Предложение Sinopec о покупке"
 CHI_foreign.058.a: "Sinopec закрепляется в ещё одном секторе африканской нефтедобычи."
 CHI_foreign.058.d: "Луанда приняла предложение Sinopec о покупке Addax Petroleum. Китайские инженеры возьмут на себя оперативное управление шельфовыми нефтяными блоками, а часть доходов будет направлена на ангольскую инфраструктуру."
 CHI_foreign.058.t: "Ангола одобряет сделку Sinopec"
 CHI_foreign.059.a: "Мы уважаем их решение."
 CHI_foreign.059.d: "Луанда отклонила предложение Sinopec о покупке Addax Petroleum."
 CHI_foreign.059.t: "Ангола отклоняет предложение Sinopec"
 CHI_foreign.060.a: "Китайский опыт и капитал приветствуются."
 CHI_foreign.060.b: "Нефтяное богатство Венесуэлы не для иностранных концессий."
 CHI_foreign.060.d: "CNOOC предложила создать долгосрочное совместное предприятие с Petróleos de Venezuela для освоения пояса тяжёлой нефти Ориноко. Китай предоставит капитал и технический опыт добычи тяжёлой нефти в обмен на долю в правах на добычу."
 CHI_foreign.060.t: "Предложение CNOOC о совместном предприятии"
 CHI_foreign.061.a: "CNOOC закрепляется у крупнейших запасов нефти Западного полушария."
 CHI_foreign.061.d: "Каракас согласился на предложение CNOOC о совместном предприятии в поясе Ориноко. Права на добычу в блоках Хунин теперь разделены, и китайские технологии добычи приходят к крупнейшим в мире доказанным запасам нефти."
 CHI_foreign.061.t: "Венесуэла одобряет совместное предприятие с CNOOC"
 CHI_foreign.062.a: "Мы уважаем их решение."
 CHI_foreign.062.d: "Каракас отклонил предложение CNOOC о совместном предприятии в поясе Ориноко."
 CHI_foreign.062.t: "Венесуэла отклоняет совместное предприятие с CNOOC"
 CHI_foreign.063.a: "Стратегическое приобретение ради нашей энергетической безопасности."
 CHI_foreign.063.d: "Астана приняла предложение CNPC о покупке PetroKazakhstan. Месторождения под управлением Китая нарастят добычу на Кумколе и Северных Бузачах, обеспечив стабильные поставки казахстанской нефти на китайские НПЗ."
 CHI_foreign.063.t: "Казахстан одобряет сделку CNPC"
 CHI_foreign.100.a: "Готовиться к длительному давлению. Проконсультироваться с союзниками."
 CHI_foreign.100.d: "Китай начал скоординированную кампанию давления на Южную Корею, используя дипломатические, экономические и военные сигналы, чтобы сместить расчёты Сеула в сфере безопасности в сторону от Вашингтона."
 CHI_foreign.100.t: "Пекинская кампания давления"
 CHI_foreign.101.a: "Задокументировать меры и подготовить соразмерный ответ."
 CHI_foreign.101.d: "Пекин расширил ответные меры за THAAD до целого режима неформальных экономических ограничений. Корейские компании, работающие в Китае, сообщают о систематических препятствиях при лицензировании, на таможне и в регулирующих органах."
 CHI_foreign.101.t: "Введены неформальные санкции"
 CHI_foreign.102.a: "Действовать осторожно. Сохранить канал открытым."
 CHI_foreign.102.d: "Китайские и американские дипломаты наладили негласный рабочий канал по вопросам Корейского полуострова. Это позволяет обеим сторонам управлять рисками эскалации, не связывая себя публично официальным форматом переговоров."
 CHI_foreign.102.t: "Открывается тайный канал"
 CHI_foreign.103.a: "Работать в новом формате. Следить за последствиями."
 CHI_foreign.103.d: "Пекин и Сеул договорились о структурированной дипломатической перезагрузке: возобновляются контакты на высоком уровне и открывается трёхсторонний формат обсуждения проблем полуострова. Это заметный отход от прежней ориентации Южной Кореи на Вашингтон."
 CHI_foreign.103.t: "Перезагрузка 2022 года"
 CHI_foreign.104.a: "Принять эту схему. Определить в ней нашу роль."
 CHI_foreign.104.d: "Китай и США согласовали контуры архитектуры безопасности на Корейском полуострове после перемирия. Схема G2 возлагает на обе державы совместную ответственность за стабильность полуострова, оттесняя остальных участников."
 CHI_foreign.104.t: "Архитектура безопасности после перемирия"
 CHI_foreign.105.a: "Изучить предложение. Проконсультироваться с промышленностью и советниками по безопасности."
 CHI_foreign.105.d: "Китай предложил платформу экономической интеграции, связывающую южнокорейскую промышленность с управляемым процессом объединения. Эта схема создаёт глубокие структурные стимулы для Сеула согласовать свою политику объединения с предпочтительным для Пекина исходом."
 CHI_foreign.105.t: "Экономическая основа единства"
 CHI_foreign.106.a: "Принять новую доктрину к сведению. Подготовить стратегический ответ."
 CHI_foreign.106.d: "Официальное принятие Южной Кореей доктрины стратегической автономии означает решительный отход от американо-корейского союза. Сеул позиционирует себя между Вашингтоном и Пекином, а не внутри американской орбиты безопасности."
 CHI_foreign.106.t: "Поворот вспять"
 CHI_foreign.107.a: "Передать ультиматум Пхеньяну."
 CHI_foreign.107.b: "Отказаться. Объединение должно пройти только на наших условиях."
 CHI_foreign.107.d: "[CHI.GetLeader] и [USA.GetLeader] достигли редкого взаимопонимания. Они совместно потребуют, чтобы [NKO.GetName] согласилась на мирное объединение под властью Сеула. Альтернатива — война. [KOR.GetName] предстоит решить, передавать ли ультиматум Пхеньяну."
 CHI_foreign.107.t: "Совместный ультиматум Северу"
 CHI_foreign.108.a: "Принять. Игра окончена."
 CHI_foreign.108.b: "Отказаться. Мы не откажемся от суверенитета."
 CHI_foreign.108.d: "В Пхеньян поступило совместное китайско-американское коммюнике. Оно требует немедленного и мирного роспуска государства [NKO.GetName] и объединения полуострова под властью правительства в Сеуле. Отказ означает войну одновременно с Китаем, США и Южной Кореей."
 CHI_foreign.108.t: "Пекин и Вашингтон требуют объединения"
 CHI_foreign.109.a: "В Восточной Азии наступает новая эпоха."
 CHI_foreign.109.d: "Северная Корея приняла ультиматум. Режим Кимов согласился распустить государство и передать власть Сеулу. Корейский полуостров объединён без единого выстрела — дипломатический триумф исторического масштаба."
 CHI_foreign.109.t: "Пхеньян соглашается"
 CHI_foreign.110.a: "Значит, мы идём на войну."
 CHI_foreign.110.d: "Северная Корея отвергла ультиматум. Ответ Пхеньяна прозвучал артиллерийским огнём через ДМЗ. Дипломатического пути больше нет — только война и освобождение полуострова силой."
 CHI_foreign.110.t: "Пхеньян отказывается"
 CHI_foreign.200.a: "Идти до конца."
 CHI_foreign.200.b: "Прощупать и отойти."
 CHI_foreign.200.c: "Потребовать посредничества ООН."
 CHI_foreign.200.d: "Наши суда береговой охраны и корабли Морских сил самообороны Японии разделяют меньше двух морских миль в Восточно-Китайском море. Следующий ход за нами. У каждого варианта есть последствия."
 CHI_foreign.200.t: "Флоты на линии соприкосновения"
 CHI_foreign.201.a: "Стоять твёрдо. Приказать Морским силам самообороны удерживать линию."
 CHI_foreign.201.b: "Немедленно запросить вмешательство США."
 CHI_foreign.201.c: "Отойти и искать дипломатическое решение."
 CHI_foreign.201.d: "Китайские суда удерживают позиции на спорной границе. Токио предстоит решить, насколько жёстко отвечать."
 CHI_foreign.201.t: "Китай давит на линию Сенкаку"
 CHI_foreign.202.a: "Выполнить гарантию. Дать Японии сигнал о военной поддержке."
 CHI_foreign.202.b: "Подстраховаться. Выразить обеспокоенность, не задействуя войска."
 CHI_foreign.202.d: "Япония сослалась на союзнические обязательства. Китайские суда давят на границу Сенкаку, и Токио просит Вашингтон подтвердить свои обязательства. Решение будет стоить дорого в любом случае."
 CHI_foreign.202.t: "Выполните ли вы гарантию?"
 CHI_foreign.203.a: "Принять к сведению."
 CHI_foreign.203.b: "Столкновение у нашего порога. Внимательно следить."
 CHI_foreign.203.c: "Далёкая ссора. Отметить и двигаться дальше."
 CHI_foreign.203.d: "Китайские и японские суда столкнулись у островов Сенкаку. Инцидент привлёк международное внимание и вызвал опасения более широкой эскалации в регионе."
 CHI_foreign.203.t: "Противостояние в Восточно-Китайском море"
 CHI_foreign.204.a: "Отвергнуть декларацию. Сохранить наш административный контроль."
 CHI_foreign.204.b: "Заявить официальный протест и проконсультироваться с Вашингтоном."
 CHI_foreign.204.d: "Китай официально объявил о суверенитете над островами Дяоюй и ввёл режим постоянного патрулирования береговой охраной. Ожидается ответ Токио."
 CHI_foreign.204.t: "Пекин объявляет острова Дяоюй своими"
 CHI_foreign.206.a: "Отправить коммюнике в Токио."
 CHI_foreign.206.d: "Саммит завершился: Япония подписала совместное коммюнике в полном объёме. Документ, обязывающий обе стороны поддерживать стабильные китайско-японские отношения и негласно урегулировать исторические претензии, теперь официально зафиксирован."
 CHI_foreign.206.t: "Коммюнике подписано"
 CHI_foreign.208.a: "Принять к сведению."
 CHI_foreign.208.b: "Сдвиг в региональном балансе. Оценить обстановку."
 CHI_foreign.208.c: "Признать произошедшее."
 CHI_foreign.208.d: "Китай и Япония выпустили совместное коммюнике, закрепляющее стратегическое взаимопонимание. Текст обязывает обе стороны поддерживать стабильные отношения и содержит негласную договорённость по историческим претензиям. Аналитики расходятся во мнениях, кто выиграл больше — Пекин или Токио."
 CHI_foreign.208.t: "Подписано китайско-японское коммюнике"
 CHI_foreign.211.a: "Тихо отменить визиты"
 CHI_foreign.211.b: "Государственный визит состоится"
 CHI_foreign.211.d: "Отзыв Пекином посла и дипломатическая заморозка превратили следующий раунд посещений храма Ясукуни в решающую проверку. Разрядит ли японский кабинет конфликт или разожжёт национальную гордость?"
 CHI_foreign.211.t: "Выбор Токио по визитам в Ясукуни"
 CHI_foreign.212.a: "Ужесточить ответ береговой охраны"
 CHI_foreign.212.b: "Открыть тайный канал для деэскалации"
 CHI_foreign.212.d: "Противостояние китайской морской милиции и катеров Береговой охраны Японии у островов Дяоюй обострилось. Кабинету нужно отреагировать до того, как кадры попадут в вечерние новости."
 CHI_foreign.212.t: "Инцидент у Сенкаку"
 CHI_foreign.216.a: "Поднять истребители и удерживать границу ADIZ"
 CHI_foreign.216.b: "Перевести инцидент в тайный канал"
 CHI_foreign.216.d: "Китайские самолёты теперь ежедневно входят в зону ПВО над Восточно-Китайским морем, а опасное сближение истребителя НОАК с самолётом Воздушных сил самообороны Японии заставило Токио нервничать. Одна береговая охрана больше не справляется с давлением вокруг Сенкаку."
 CHI_foreign.216.t: "Противостояние в ADIZ у Сенкаку"
 CHI_foreign.217.a: "Развернуть корабельную группу ВМС НОАК и стоять твёрдо"
 CHI_foreign.217.b: "Отступить, пока не началась стрельба"
 CHI_foreign.217.d: "Китайская корабельная группа следует за японскими судами в пределах видимости спорных островов, и оба флота объявили боевую тревогу. Один неверный манёвр может привести к первым выстрелам китайско-японской войны. Токио ждёт, удержит ли Пекин линию или отступит."
 CHI_foreign.217.t: "Противостояние у Сенкаку на грани"
 CHI_foreign.213.a: "Откупиться от лобби и прекратить бойкот"
 CHI_foreign.213.b: "Переждать бурю"
 CHI_foreign.213.d: "Японские экспортёры и Кэйданрэн теряют терпение. Бойкот в Китае закрывает японским брендам один из крупнейших рынков. Токио должен решить: откупиться от Пекина или переждать бурю."
 CHI_foreign.213.t: "Бойкот бьёт больно"
 CHI_foreign.215.a: "Задействовать договор о безопасности"
 CHI_foreign.215.b: "Добиться перемирия через тайные каналы"
 CHI_foreign.215.d: "Пекин обострил вопрос Сенкаку. Договор о взаимной безопасности обязывает Вашингтон рассмотреть вмешательство. Президент может открыто выполнить договор или добиваться перемирия через тайный канал."
 CHI_foreign.215.t: "Решение Вашингтона по Сенкаку"
 CHI_foreign.220.a: "Приветствовать шаг навстречу"
 CHI_foreign.220.b: "Вежливый скептицизм"
 CHI_foreign.220.d: "Пекин дал понять, что открыт к отношениям по образцу первоначальной доктрины Фукуды 1978 года. Токио может приветствовать этот шаг или ответить вежливым скептицизмом."
 CHI_foreign.220.t: "Доктрина Фукуды для нового века"
 CHI_foreign.221.a: "Устроить полноценный государственный визит"
 CHI_foreign.221.b: "Скромный приём"
 CHI_foreign.221.d: "Китай предложил в подарок зоопарку Уэно больших панд в рамках государственного визита. Кабинету предстоит решить, устроить ли полноценный государственный визит или обойтись скромным приёмом."
 CHI_foreign.221.t: "Панда для Токио"
 CHI_foreign.222.a: "Подписать пакт"
 CHI_foreign.222.b: "Ждать дальнейших доказательств"
 CHI_foreign.222.d: "Пекин представил двустороннюю декларацию, официально отказывающуюся от риторики исторических врагов. Токио может подписать её и ответить взаимностью или дождаться дальнейших подтверждений намерений Китая."
 CHI_foreign.222.t: "Пакт о взаимном снижении угроз"
 CHI_foreign.223.a: "Надавить на Японию, чтобы она подтвердила обязательства"
 CHI_foreign.223.b: "Понизить «Четвёрку» до уровня диалога"
 CHI_foreign.223.d: "Дипломатический клин Пекина начинает отрывать Токио от Четырёхстороннего диалога по безопасности. Вашингтон может надавить на Японию, чтобы та подтвердила обязательства, или молча смириться с понижением формата."
 CHI_foreign.223.t: "Ответ «Четвёрки»"
 CHI_foreign.224.a: "Подписать коммюнике полностью"
 CHI_foreign.224.b: "Подписать с оговорками"
 CHI_foreign.224.c: "Покинуть переговоры"
 CHI_foreign.224.d: "Годы терпеливой дипломатии привели к проекту коммюнике. Подписание полного текста перестроит стратегическую позицию Японии; подписание с оговорками сохранит двусторонние отношения без разрыва с Вашингтоном; уход с переговоров разрушит весь процесс."
 CHI_foreign.224.t: "Токийское коммюнике"
 CHI_foreign.226.a: "Принять оговорки к сведению и двигаться дальше."
 CHI_foreign.226.d: "Токио подписал урезанную версию коммюнике. ЛДП выговорила конкретные оговорки вместо принятия полного текста, сохранив определённую ориентацию на Вашингтон. Двусторонние отношения продвигаются, хотя стратегическая неопределённость сохраняется."
 CHI_foreign.226.t: "Частичное соглашение с Японией"
 CHI_foreign.227.a: "Оценить ущерб."
 CHI_foreign.227.d: "Годы дипломатической подготовки пошли прахом. ЛДП отвергла окончательный текст коммюнике, обвинив Пекин в превышении полномочий и подчинении суверенитета Японии. Вся переговорная схема рухнула."
 CHI_foreign.227.t: "Япония покидает переговоры"
 CHI_foreign.231.a: "Отметить коммерческую возможность."
 CHI_foreign.231.d: "Пекин пригласил Mitsubishi Aerospace открыть лицензионное производство и исследовательские центры на материке. Японская промышленность получает экспортную выручку и доступ к рынку, а китайские авиаинженеры — близость к передовому проектированию планеров."
 CHI_foreign.231.t: "Mitsubishi Aerospace открывается в Китае"
 CHI_foreign.232.a: "Отметить коммерческую возможность."
 CHI_foreign.232.d: "Авиакосмическое подразделение Kawasaki заключило с Пекином рамочное соглашение о производстве компонентов крупных планеров. Сделка открывает значительную долю китайского рынка и даёт Токио влияние на циклы закупок китайской авиапромышленности."
 CHI_foreign.232.t: "Kawasaki Aerospace выходит в Китай"
 CHI_foreign.233.a: "Отметить коммерческую возможность."
 CHI_foreign.233.d: "Japan Steel Works получила разрешение на работу совместного кузнечного производства в Китае. Экспортная прибыль от крупных стальных поковок даёт Токио постоянный рычаг влияния на китайскую тяжёлую промышленность."
 CHI_foreign.233.t: "Japan Steel Works приходит в Китай"
 CHI_foreign.234.a: "Отметить коммерческую возможность."
 CHI_foreign.234.d: "Подразделение наземных систем Mitsubishi Heavy Industries заключило соглашение о лицензировании технологий с китайским государственным партнёром. Япония получает коммерческую выгоду, а Пекин — доступ к методикам проектирования бронетехники."
 CHI_foreign.234.t: "MHI Land Systems приглашена в Китай"
 CHI_foreign.235.a: "Отметить коммерческую возможность."
 CHI_foreign.235.d: "Komatsu Defense наладила в Китае производственное сотрудничество по лёгкой бронетехнике. Сделка приносит Токио стабильный экспортный доход и углубляет двусторонние связи оборонной промышленности."
 CHI_foreign.235.t: "Komatsu Defense выходит в Китай"
 CHI_foreign.236.a: "Отметить коммерческую возможность."
 CHI_foreign.236.d: "Авиакосмическое подразделение Subaru Corporation заключило соглашение о совместном производстве с китайским партнёром. Опыт в конструкции вертолётов перетекает в китайскую программу, а Subaru получает долгосрочные заказы на компоненты."
 CHI_foreign.236.t: "Подписано партнёрство с Subaru Aerospace"
 CHI_foreign.237.a: "Отметить коммерческую возможность."
 CHI_foreign.237.d: "Howa Machinery передала по лицензии свои процессы точной механообработки китайскому партнёру. Это приносит экспортный доход и распространяет японские стандарты производства стрелкового оружия на китайские оборонные цепочки поставок."
 CHI_foreign.237.t: "Howa Machinery работает в Китае"
 CHI_foreign.238.a: "Отметить коммерческую возможность."
 CHI_foreign.238.d: "NEC Corporation открыла в Китае совместный центр интеграции электроники. Коммерческая отдача значительна, но главный приз для Токио — устойчивое влияние на китайские стандарты закупок систем C4ISR."
 CHI_foreign.238.t: "NEC открывает операции в Китае"
 CHI_foreign.239.a: "Отметить коммерческую возможность."
 CHI_foreign.239.d: "Toshiba Defense Systems согласилась поставлять китайским интеграторам компоненты РЛС и датчиков по управляемой схеме лицензирования. Япония сохраняет права на проектирование и получает стабильные роялти за передачу технологий."
 CHI_foreign.239.t: "Toshiba Defense Systems в Китае"
 CHI_foreign.240.a: "Отметить коммерческую возможность."
 CHI_foreign.240.d: "Судостроительное подразделение Mitsubishi заключило соглашение о сотрудничестве в военном кораблестроении с китайской государственной верфью. Главные выгоды для Токио — экспортная выручка и долгосрочное влияние на стандарты проектирования китайских надводных кораблей."
 CHI_foreign.240.t: "Mitsubishi Shipbuilding подписывает соглашение с Пекином"
 CHI_foreign.241.a: "Отметить коммерческую возможность."
 CHI_foreign.241.d: "Судостроительное подразделение Kawasaki Heavy Industries согласилось поделиться с китайским партнёром технологиями изготовления корпусов подводных лодок. Япония получает доступ к рынку, а Пекин — знакомство с методами снижения акустической заметности."
 CHI_foreign.241.t: "Верфь Kawasaki приглашена в Китай"
 CHI_foreign.242.a: "Отметить коммерческую возможность."
 CHI_foreign.242.d: "IHI получила разрешение на производство компонентов авиадвигателей в Китае по лицензионной схеме. Токио получает устойчивый источник дохода и плацдарм в китайских закупках военной авиации."
 CHI_foreign.242.t: "IHI Corporation выходит на китайский рынок"
 CHI_foreign.243.a: "Отметить коммерческую возможность."
 CHI_foreign.243.d: "Japan Marine United заключила с китайским судостроителем соглашение о сотрудничестве в военно-морском проектировании. Сделка приносит экспортный доход и закрепляет долгосрочную роль Японии в разработке китайских надводных кораблей."
 CHI_foreign.243.t: "Подписано партнёрство с Japan Marine United"
 CHI_foreign.244.a: "Отметить коммерческую возможность."
 CHI_foreign.244.d: "Toyota Motor Corporation согласилась расширить производственное и логистическое присутствие в Китае в рамках нового партнёрства. Экспорт производственной системы укрепляет мягкое влияние Японии на промышленную модернизацию Китая."
 CHI_foreign.244.t: "Toyota открывает производство в Китае"
 CHI_foreign.245.a: "Отметить коммерческую возможность."
 CHI_foreign.245.d: "Honda Motor Company заключила в Китае расширенное соглашение о производстве и лицензировании силовых агрегатов. В Токио идёт стабильный поток роялти, а производственные стандарты Honda укореняются на китайских заводах."
 CHI_foreign.245.t: "Honda присоединяется к партнёрству"
 CHI_foreign.246.a: "Отметить коммерческую возможность."
 CHI_foreign.246.d: "Nippon Steel согласилась поставлять китайским партнёрам высокотвёрдую листовую сталь и специальные сплавы через совместное предприятие. Сделка приносит премиальную экспортную выручку и привязывает китайское производство броневой стали к японским цепочкам поставок."
 CHI_foreign.246.t: "Nippon Steel присоединяется к работе в Китае"
 CHI_foreign.247.a: "Отметить коммерческую возможность."
 CHI_foreign.247.d: "Hitachi развернула в Китае производство промышленной электроники и встраиваемых вычислительных систем в рамках партнёрства. Экспортная выручка приходит сразу, а в долгосрочной перспективе Токио получает постоянное влияние на модернизацию китайской инфраструктуры."
 CHI_foreign.247.t: "Hitachi расширяется в Китай"
 CHI_foreign.248.a: "Отметить коммерческую возможность."
 CHI_foreign.248.d: "Panasonic заключила соглашения о поставках аккумуляторных технологий и защищённой электроники китайским партнёрам. Это приносит надёжный экспортный доход и встраивает японские стандарты компонентов в китайские производственные линии, связанные с оборонкой."
 CHI_foreign.248.t: "Panasonic вступает в китайское партнёрство"
 CHI_foreign.249.a: "Отметить коммерческую возможность."
 CHI_foreign.249.d: "JR East согласилась поделиться с китайскими партнёрами технологиями сигнализации для высокоскоростных дорог и проектирования подвижного состава. Коммерческая выгода очевидна, а стратегическая ценность для Токио — в долгосрочном влиянии на китайскую транспортную инфраструктуру."
 CHI_foreign.249.t: "JR East приносит в Китай железнодорожный опыт"
 CHI_foreign.250.a: "Выдержать давление."
 CHI_foreign.250.d: "Китайские государственные СМИ развернули скоординированную кампанию по поводу поведения Японии в годы войны, выдвинув на первый план официальные посещения храма Ясукуни, пересмотр школьных учебников и Нанкинскую резню. По китайским городам распространяются антияпонские демонстрации, и на Токио нарастает давление с требованием ответить."
 CHI_foreign.250.t: "Пекин вновь поднимает исторический вопрос"
 CHI_foreign.55.a: "Продвигать схему под руководством Пекина."
 CHI_foreign.55.b: "Выступить беспристрастным посредником."
 CHI_foreign.55.c: "Уступить инициативу Сеулу."
 CHI_foreign.55.d: "Китай организовал в Пекине экстренный дипломатический саммит, вернув переговоры по Корейскому полуострову от края пропасти. Обе стороны прибывают под давлением, и позиция, которую займёт Китай, определит, как событие будет воспринято во всех столицах."
 CHI_foreign.55.t: "Открывается Пекинский саммит"
 CHI_foreign.66.a: "Готовиться к последствиям."
 CHI_foreign.66.d: "Операция обернулась катастрофой. Китайский спецназ захвачен или уничтожен, и Пхеньян объявил о доказательствах причастности Пекина. Регион затаил дыхание."
 CHI_foreign.66.t: "Операция «Новый рассвет» раскрыта"
 CHI_foreign.67.a: "Тихо отступить."
 CHI_foreign.67.d: "Операция не достигла своих целей, но северокорейские спецслужбы приписали инцидент внутренним диссидентам. Роль Пекина пока не подтверждена."
 CHI_foreign.67.t: "Налёт провалился и выдан за внутренний мятеж"
 CHI_foreign.68.a: "Следить за развитием событий."
 CHI_foreign.68.d: "Операция вызвала открытые бои в столице. Верные части КНА и диссидентские группировки сражаются за контроль над Пхеньяном на глазах у всего мира."
 CHI_foreign.68.t: "Пхеньян в огне"
 CHI_foreign.69.a: "Закрепить успех."
 CHI_foreign.69.d: "Операция удалась. Пропекинское руководство взяло под контроль Северную Корею. Баланс сил на полуострове изменился."
 CHI_foreign.69.t: "Новый рассвет в Пхеньяне"
 CHI_military_event.1.a: "Продать по полной рыночной стоимости"
 CHI_military_event.1.b: "Вознаградить офицеров, которые подчинятся"
 CHI_military_event.1.d: "К декабрю 1998 года приказ Цзян Цзэминя о выводе активов передал тысячи принадлежавших НОАК компаний на гражданскую оценку и передачу. Девелоперские подразделения, торговые конгломераты и фармацевтические заводы были оценены и переданы, лишив армию империи, строившейся десятилетиями. Условия передачи всё ещё обсуждаются."
 CHI_military_event.1.t: "Передача «пятидесяти Vanke»"
 CHI_military_event.10.a: "Передать дело дисциплинарным инспекторам"
 CHI_military_event.10.b: "Похоронить расследование"
 CHI_military_event.10.d: "Следователи Центральной комиссии по проверке дисциплины провели обыск в доме генерал-лейтенанта, разбогатевшего на армейских предприятиях. Как и в случае с Гу Цзюньшанем в 2012 году, они вывозят ящики с наличными, коробки маотая и золотой бюст Мао. Сети, стоящие над ним, следят, осмелится ли Пекин потянуть за нить или дело исчезнет, как многие до него."
 CHI_military_event.10.t: "Раскрыто состояние генерала"
 CHI_military_event.2.a: "Собрать урожай с коммерческого сектора"
 CHI_military_event.2.b: "Управлять сверху"
 CHI_military_event.2.d: "Возведённая в 2017 году в ранг национальной стратегии военно-гражданская интеграция сносит стену между гражданской и оборонной промышленностью Китая. Университетам, госпредприятиям и частным технологическим компаниям предписано делиться с НОАК исследованиями, производственными мощностями и цепочками поставок, переориентируя всю экономику на продукцию двойного назначения под надзором Центральной военной комиссии."
 CHI_military_event.2.t: "Объявлена военно-гражданская интеграция"
 CHI_military_event.4.a: "Гнаться за оружейным рынком"
 CHI_military_event.4.b: "Покупать политический доступ за рубежом"
 CHI_military_event.4.d: "Poly Technologies, оружейная экспортная «дочка» Генштаба НОАК, поставляет китайские винтовки, противокорабельные ракеты и баллистические системы малой дальности в Африку, на Ближний Восток и в Латинскую Америку. Poly Culture, её гражданское прикрытие, отмывает выручку через гонконгские аукционные дома и зарубежную недвижимость. Доходы возвращаются к военным через подставные компании, которые никогда не фигурируют ни в одном официальном бюджете."
 CHI_military_event.4.t: "Poly Technologies выходит на мировой рынок"
 CHI_military_event.5.a: "Выдать нескольких козлов отпущения"
 CHI_military_event.5.b: "Сплотиться и бросить вызов аудиторам"
 CHI_military_event.5.d: "Антикоррупционная кампания, начатая Си Цзиньпином в 2012 году, дошла до Главного управления тыла. Сюй Цайхоу и Го Босюну, двум бывшим заместителям председателя ЦВК, управлявшим системой продажи повышений во всём офицерском корпусе, грозит обвинение. Клике предстоит решить: выдать козлов отпущения и выиграть время или сплотиться и бросить Пекину вызов."
 CHI_military_event.5.t: "Расплата"
 CHI_military_event.6.a: "Присягнуть на верность «Китайской мечте»"
 CHI_military_event.6.b: "Сохранить тихие привилегии"
 CHI_military_event.6.d: "Сюй Цайхоу умер от рака до суда, Го Босюн лишён звания, и уцелевшая сеть принимает новые условия: громкие клятвы верности «Китайской мечте» Си, несколько офицеров среднего звена, выданных напоказ, и негласный уговор. Открытое разграбление прекращается, но сети, контролирующие контракты на снабжение, строительные тендеры и закупки вооружений, выживают в более скрытой форме."
 CHI_military_event.6.t: "Склониться перед «Китайской мечтой»"
 CHI_political_events.1.a: "Организовать общенациональный ответ."
 CHI_political_events.1.d: "Новый коронавирус распространился из провинции Гуандун в Гонконг, Вьетнам, Канаду и Сингапур. ВОЗ объявила глобальную тревогу. Больницы Гуанчжоу и Пекина переполнены, а страх в обществе распространяется быстрее самой болезни."
 CHI_political_events.1.t: "Эпидемия атипичной пневмонии"
 CHI_political_events.2.a: "Бросить все доступные ресурсы."
 CHI_political_events.2.d: "В провинции Сычуань произошло землетрясение магнитудой 7,9 с эпицентром у уезда Вэньчуань. Погибнут более 69 000 человек, 18 000 числятся пропавшими без вести. Первый толчок и последовавшие оползни полностью разрушили целые города."
 CHI_political_events.2.t: "Вэньчуаньское землетрясение"
 CHI_political_events.3.a: "Да начнутся Игры."
 CHI_political_events.3.d: "Сегодня открываются Олимпийские игры 2008 года в Пекине. После многих лет подготовки и беспрецедентного строительства Китай встречает спортсменов со всего мира на Национальном стадионе. Церемония открытия собирает глобальную аудиторию в сотни миллионов зрителей, демонстрируя подъём Китая на мировой арене."
 CHI_political_events.3.t: "Игры XXIX Олимпиады"
 CHI_political_events.4.a: "Ускорить технологическое развитие"
 CHI_political_events.4.b: "Укрепить социальное единство"
 CHI_political_events.4.c: "Наращивать военную мощь"
 CHI_political_events.4.d: "С завершением XIX съезда партия определяет приоритеты для двух столетних рубежей: общество средней зажиточности к 2021 году и полностью развитое социалистическое государство к 2049 году. Ресурсы государства нужно направить. На чём партия сосредоточит свои силы?"
 CHI_political_events.4.t: "Цели двух столетий"
 CHI_political_events.5.a: "Выдвинуть кандидата «Туаньпай»"
 CHI_political_events.5.b: "Выдвинуть кандидата «принцев»"
 CHI_political_events.5.c: "Оставить решение за Си"
 CHI_political_events.5.d: "Вопрос преемственности больше не теоретический. Си Цзиньпин сосредоточил власть, но партии нужна институциональная преемственность. Постоянный комитет Политбюро ждёт указаний. Выбор, сделанный сейчас, определит следующее поколение китайского руководства."
 CHI_political_events.5.t: "Назначение преемника"
 CHI_political_events.50.a: "Начать планирование для стареющего Китая."
 CHI_political_events.50.d: "Население Китая трудоспособного возраста, на пике достигавшее примерно 940 миллионов человек, начало долгое сокращение. Избыточная рабочая сила, обеспечивавшая три десятилетия двузначного роста, больше не растёт. Экономисты отмечают, что сдвиг структурный, а не циклический: без вмешательства государства заводы и стройки до конца века будут конкурировать за сокращающийся круг работников."
 CHI_political_events.50.t: "Демографический дивиденд исчерпывается"
 CHI_political_events.51.a: "Посмотреть правде в глаза."
 CHI_political_events.51.d: "Шестая всекитайская перепись населения 2010 года подтверждает то, о чём давно предупреждали демографы: доля населения в возрасте 60 лет и старше выросла до 13,3 процента, а медианный возраст продолжает расти. Структура семьи «4-2-1», когда один ребёнок отвечает за двух родителей и четырёх бабушек и дедушек, стала статистической нормой в городском Китае. Сокращение населения — больше не отдалённый прогноз."
 CHI_political_events.51.t: "Перепись выявляет ускоренное старение"
 CHI_political_events.52.a: "Более тяжёлая, но более честная отправная точка."
 CHI_political_events.52.d: "После лет экономического напряжения и корректировки политики Китай достиг нового демографического равновесия. Рабочая сила меньше и старше, пенсии дороже, а рождаемость остаётся ниже уровня воспроизводства, но острый шок перехода позади. Страна, вышедшая из этого десятилетия, дисциплинирована необходимостью: более скромные госфинансы, больше автоматизации и система социального обеспечения, рассчитанная на общество, которое постарело раньше, чем разбогатело."
 CHI_political_events.52.t: "Кризис стареющего общества отступает"
 CHI_political_events.6.a: "Почтить нашего национального героя"
 CHI_political_events.6.b: "Добиваться дипломатического урегулирования"
 CHI_political_events.6.d: "1 апреля 2001 года самолёт радиоэлектронной разведки ВМС США EP-3 столкнулся с перехватчиком J-8 ВВС НОАК у острова Хайнань. Американский экипаж совершил вынужденную посадку на китайской территории. Пекину предстоит решить, как урегулировать противостояние."
 CHI_political_events.6.t: "Инцидент у Хайнаня"
 CHI_political_events.7.a: "Сектор был недостаточно развит — удар оказался сильным."
 CHI_political_events.7.b: "Сектор переживает удар с потрясениями, но без краха."
 CHI_political_events.7.c: "Масштаб сектора смягчает удар."
 CHI_political_events.7.d: "Речь Джека Ма на саммите Bund Summit, где он сравнил государственные банки с ломбардами, дала регуляторам долгожданный повод. CSRC и SAMR приостанавливают IPO Ant Group за несколько дней до размещения. Антимонопольные следователи начинают разбирательство против Alibaba. Управление по делам киберпространства запускает проверку Didi на предмет национальной безопасности после её листинга в Нью-Йорке. Платформенному сектору предстоит коренная перестройка отношений с государством."
 CHI_political_events.7.e: "Сектор достаточно зрел, чтобы превратить регулирование в структурную стабильность."
 CHI_political_events.7.t: "Удар по крупным технологическим компаниям"
 CHI_political_events.8.a: "Продолжать финансировать вычислительный сектор"
 CHI_political_events.8.d: "Следуя стратегической директиве о подъёме страны за счёт науки и техники, государственные институты ускоряют инвестиции в вычислительную технику и интернет-инфраструктуру нового поколения. От университетских лабораторий до особых экономических зон — закладывается цифровой фундамент Китая на десятилетия вперёд."
 CHI_political_events.8.t: "Инновации через науку и технику"
 CHI_sco.1.a: "Мы приветствуем их интерес."
 CHI_sco.1.b: "Мы не можем предоставить этот статус."
 CHI_sco.1.d: "[FROM.GetNameWithFlag] подаёт официальную заявку на получение статуса наблюдателя в Шанхайской организации сотрудничества. Нам предстоит решить, удовлетворить ли эту просьбу."
 CHI_sco.1.t: "Заявка на статус наблюдателя ШОС"
 CHI_sco.10.a: "Мы на стороне Китая."
 CHI_sco.10.b: "Мы не станем заложниками амбиций Китая."
 CHI_sco.10.c: "Сохранить нейтралитет."
 CHI_sco.10.d: "Китай требует, чтобы мы заявили о безоговорочной верности его фракции внутри ШОС, вынуждая нас выбирать между Пекином и Москвой."
 CHI_sco.10.t: "Китай требует верности"
 CHI_sco.11.a: "Мы благодарны за поддержку."
 CHI_sco.11.d: "[FROM.GetNameWithFlag] оказывает нам помощь в целях развития, поддерживая модернизацию нашей экономики в рамках механизмов сотрудничества ШОС."
 CHI_sco.11.t: "Помощь ШОС в целях развития"
 CHI_sco.2.a: "Они доказали, что достойны полноправного членства."
 CHI_sco.2.b: "Мы не можем поддержать эту заявку."
 CHI_sco.2.d: "[FROM.GetNameWithFlag] подаёт официальную заявку на полноправное членство в Шанхайской организации сотрудничества."
 CHI_sco.2.t: "Заявка на членство в ШОС"
 CHI_sco.20.a: "Вложить политический капитал в восстановление доверия."
 CHI_sco.20.b: "У нас есть более насущные заботы."
 CHI_sco.20.d: "Внутренняя сплочённость Шанхайской организации сотрудничества упала до тревожного уровня. Ряд государств-членов выразил сомнения в курсе организации, и без вмешательства сотрудничество может ухудшиться ещё сильнее."
 CHI_sco.20.t: "Члены ШОС сомневаются в её курсе"
 CHI_sco.21.a: "Это наш час."
 CHI_sco.21.d: "Шанхайская организация сотрудничества процветает. Государства-члены отмечают беспрецедентный уровень сотрудничества, совместные проекты приносят плоды, а международный авторитет организации как никогда высок."
 CHI_sco.21.t: "Золотой век сотрудничества"
 CHI_sco.22.a: "Развить наше преимущество."
 CHI_sco.22.b: "Нам стоит снизить напряжённость."
 CHI_sco.22.d: "Наше растущее доминирование в Шанхайской организации сотрудничества не осталось незамеченным. Ослабление роли России вызывает всё больше трений, и Москва начала выражать недовольство по дипломатическим каналам."
 CHI_sco.22.t: "Россия оттеснена на второй план в ШОС"
 CHI_sco.23.a: "Мы должны вернуть себе лидерство."
 CHI_sco.23.b: "Возможно, так даже лучше."
 CHI_sco.23.d: "Влияние России в ШОС выросло настолько, что наше лидерство ставится под сомнение. Москва всё чаще определяет повестку, и если ничего не предпринять, мы рискуем оказаться на вторых ролях в собственной организации."
 CHI_sco.23.t: "Китай теряет инициативу"
 CHI_sco.3.a: "Наши войска будут рады возможности тренироваться вместе с их силами."
 CHI_sco.3.b: "Сотрудничество со страной [FROM.GetName] сейчас невозможно."
 CHI_sco.3.d: "[FROM.GetNameWithFlag] предлагает провести совместные военные учения в рамках ШОС. Это укрепит сотрудничество наших вооружённых сил в сфере безопасности."
 CHI_sco.3.t: "Приглашение на совместные военные учения"
 CHI_sco.30.a: "Одобрить проект."
 CHI_sco.30.b: "Сейчас неподходящее время."
 CHI_sco.30.d: "[FROM.GetNameWithFlag] предлагает создать единую энергосистему, охватывающую страны ШОС. Как ведущему участнику, нам предстоит решить, одобрить ли этот амбициозный инфраструктурный проект."
 CHI_sco.30.t: "Предложение о единой энергосистеме ШОС"
 CHI_sco.31.a: "Одобрить проект."
 CHI_sco.31.b: "Мы не можем взять на себя такие обязательства."
 CHI_sco.31.d: "[FROM.GetNameWithFlag] предлагает построить трансконтинентальную железнодорожную сеть, которая свяжет экономики стран ШОС. Это потребует значительных вложений, но может преобразить торговлю внутри организации."
 CHI_sco.31.t: "Предложение о Трансъевразийской железной дороге"
 CHI_sco.32.a: "Одобрить создание банка."
 CHI_sco.32.b: "Условия неблагоприятны."
 CHI_sco.32.d: "[FROM.GetNameWithFlag] предлагает учредить многосторонний банк развития в рамках ШОС. Он будет финансировать инфраструктуру и развитие в государствах-членах."
 CHI_sco.32.t: "Предложение о Банке развития ШОС"
 CHI_sco.33.a: "Одобрить создание системы."
 CHI_sco.33.b: "У нас есть сомнения на этот счёт."
 CHI_sco.33.d: "[FROM.GetNameWithFlag] предлагает создать объединённую систему ПВО, охватывающую государства — члены ШОС. Общее радиолокационное покрытие и скоординированная противоракетная оборона укрепят коллективную безопасность."
 CHI_sco.33.t: "Предложение об объединённой системе ПВО ШОС"
 CHI_sco.34.a: "Мы гордимся тем, что стали одним из основателей."
 CHI_sco.34.d: "Пекин официально оформил давно обсуждавшееся преобразование «Шанхайской пятёрки» в полноценную межправительственную организацию. Предлагаемая Шанхайская организация сотрудничества углубит наши политические, оборонные и экономические связи с Китаем и соседями по региону, а мы с первого дня станем одним из её основателей."
 CHI_sco.34.t: "Китай предлагает создать Шанхайскую организацию сотрудничества"
 CHI_sco.4.a: "Да начнутся учения."
 CHI_sco.4.d: "[FROM.GetNameWithFlag] принимает наше приглашение на совместные военные учения."
 CHI_sco.4.t: "Приглашение на учения принято"
 CHI_sco.5.a: "Их потеря."
 CHI_sco.5.d: "[FROM.GetNameWithFlag] отклоняет наше приглашение на совместные военные учения."
 CHI_sco.5.t: "Приглашение на учения отклонено"
 CHI_sco.6.a: "Эти учения подозрительно похожи на подготовку к войне."
 CHI_sco.6.b: "Этих учений стоит бояться только террористам и экстремистам."
 CHI_sco.6.c: "Любопытное событие, за ним стоит последить."
 CHI_sco.6.d: "Шанхайская организация сотрудничества начала масштабные военные учения с участием вооружённых сил государств-членов."
 CHI_sco.6.t: "ШОС начала масштабные военные учения"
 CHI_sco.7.a: "Китайская сфера влияния продолжает расширяться."
 CHI_sco.7.b: "Хороший день для многосторонней дипломатии."
 CHI_sco.7.d: "[FROM.GetNameWithFlag] официально принимается в Шанхайскую организацию сотрудничества в качестве полноправного члена."
 CHI_sco.7.t: "[FROM.GetNameWithFlag] вступает в ШОС"
 CHI_sco.8.a: "Китайская агрессия оттолкнула ещё одного партнёра."
 CHI_sco.8.b: "Досадная неудача для международного сотрудничества."
 CHI_sco.8.d: "[FROM.GetNameWithFlag] объявляет о выходе из Шанхайской организации сотрудничества, ссылаясь на непримиримые разногласия."
 CHI_sco.8.t: "[FROM.GetNameWithFlag] выходит из ШОС"
 CHI_sco.9.a: "Китай не желает делить с кем-то первенство."
 CHI_sco.9.d: "Китай решительно утвердил своё господство в Шанхайской организации сотрудничества, оттеснив Россию и став бесспорной ведущей державой блока."
 CHI_sco.9.t: "Китай укрепляет контроль над ШОС"
 CHI_semiconductor_events.1.d: "США расширили экспортный контроль на передовое оборудование для производства полупроводников, ПО для EDA и компоненты памяти с высокой пропускной способностью. Союзные правительства в Европе, Японии и Южной Корее согласовали экспортное лицензирование, чтобы усилить эти ограничения. Технологическое эмбарго отражает решимость Вашингтона не дать Китаю сократить отставание в производстве передовых логических микросхем и памяти."
 CHI_semiconductor_events.1.o1: "Мы всё равно пойдём вперёд."
 CHI_semiconductor_events.1.t: "Западный полупроводниковый бойкот"
 CHI_semiconductor_events.2.a: "Продемонстрировать достижение"
 CHI_semiconductor_events.2.b: "Не афишировать и наращивать мощности"
 CHI_semiconductor_events.2.d: "Huawei выпустила Mate 60 Pro на отечественной однокристальной системе Kirin 9000S. Анализ после разборки подтверждает, что SMIC изготовила этот чип по своему техпроцессу N+2, эквивалентному 7 нм. Этот прорыв переворачивает общепринятые представления о том, насколько сильно экспортный контроль отбросил нас назад."
 CHI_semiconductor_events.2.t: "Сюрприз Mate 60"
 CHI_semiconductor_events.3.a: "Опереться на Empyrean"
 CHI_semiconductor_events.3.b: "Выстоять и перейти на серые каналы"
 CHI_semiconductor_events.3.d: "Поправки Бюро промышленности и безопасности США от мая 2025 года включают нас в число стран с ограничениями на поставку инструментов EDA. Synopsys и Cadence подают обязательные заявки на лицензии. Отказы последуют в течение нескольких недель. Теперь отечественная цепочка инструментов должна обеспечивать каждый передовой проект вплоть до передачи в производство."
 CHI_semiconductor_events.3.t: "Synopsys и Cadence отрезают нас"
 CHI_semiconductor_events.4.a: "Продвигать квалификацию у отечественных ИИ-компаний"
 CHI_semiconductor_events.4.b: "Экспортировать HBM в Россию и Иран"
 CHI_semiconductor_events.4.d: "Завод ChangXin Memory Technologies в Хэфэе начал массовый выпуск стеков HBM2 на целый год раньше публично заявленного срока — 2026 года. Первые квалификационные образцы уже переданы Cambricon и Biren. Отечественным ИИ-ускорителям больше не нужно преодолевать узкое место зарубежной памяти."
 CHI_semiconductor_events.4.t: "CXMT выпускает HBM2 досрочно"
 CHI_semiconductor_events.5.a: "Ослабить контроль над чипами"
 CHI_semiconductor_events.5.b: "Не уступать в вопросе экспортного контроля"
 CHI_semiconductor_events.5.d: "Китай увязал дальнейший доступ к своему экспорту редкоземельных металлов и галлия со смягчением экспортного контроля на полупроводники. Поскольку западные цепочки поставок магнитов и подложек для чипов зависят от китайской переработки, Пекин делает ставку на то, что рычаг работает в обе стороны. Предложение ложится нам на стол как прямой обмен: смягчить чиповое эмбарго — и критически важные минералы продолжат поступать."
 CHI_semiconductor_events.5.t: "Редкоземельное предложение Пекина"
 CHI_semiconductor_events.6.a: "Ускорить наращивание отечественного производства"
 CHI_semiconductor_events.6.d: "Вашингтон негласно расширил одобрение лицензий на оборудование для зрелых техпроцессов и ПО для проектирования в обмен на гарантированные поставки редкоземельных металлов. Послабление частичное и обратимое, но оно даёт нашим фабрикам время закрыть оставшиеся пробелы без полного давления эмбарго."
 CHI_semiconductor_events.6.t: "Ограничения ослаблены"
 CHI_semiconductor_events.7.a: "Смириться с неудачей"
 CHI_semiconductor_events.7.d: "Вашингтон наотрез отверг увязку, рассудив, что уступка по чипам лишит его сильнейшего рычага давления. Экспортный контроль остаётся в силе, а политический капитал, потраченный на эту инициативу, растрачен впустую. Самодостаточность остаётся для нас единственным открытым путём."
 CHI_semiconductor_events.7.t: "Переговоры сорваны"
 CHI_space_events.1.a: "Взоры всей страны прикованы к нам."
 CHI_space_events.1.d: "С космодрома Вэньчан в столбе дыма и пламени поднимается «Чанчжэн-10», унося пилотируемый корабль «Мэнчжоу» с тремя тайконавтами к переходу на траекторию полёта к Луне. Старт показывают все телевизоры страны. Весь мир следит за ним."
 CHI_space_events.1.t: "«Чанчжэн» стартует к Луне"
 CHI_space_events.10.a: "Профинансировать спутниковую и следящую сеть в полном объёме"
 CHI_space_events.10.b: "Двигаться размеренными темпами"
 CHI_space_events.10.d: "Раз программа «Чанъэ» нацелена на высадку на лунную поверхность, Госсовет решает, как финансировать вспомогательную инфраструктуру. Первый вопрос — спутниковая и следящая сеть: ретрансляторы «Цюэцяо» и антенны дальней космической связи, которые поддерживают связь с экипажем на расстоянии 380 000 километров. Мы можем полностью профинансировать её сейчас или растянуть расходы и двигаться размеренными темпами."
 CHI_space_events.10.t: "Финансирование дороги к Луне"
 CHI_space_events.11.a: "Ускорить разработку «Чанчжэн-10»"
 CHI_space_events.11.b: "Придерживаться запланированного графика"
 CHI_space_events.11.d: "Без сверхтяжёлой ракеты пилотируемая лунная миссия невозможна. «Чанчжэн-10» создаётся для того, чтобы отдельными запусками отправить к Луне пилотируемый корабль «Мэнчжоу» и посадочный модуль «Ланьюэ». Ускорение разработки обойдётся дорого, но каждый сэкономленный месяц приближает высадку."
 CHI_space_events.11.t: "Вопрос тяжёлой ракеты"
 CHI_space_events.12.a: "Довериться инженерам"
 CHI_space_events.12.d: "Размеренный путь сохраняет программу доступной по средствам и политически надёжной. Инженеры Китайской академии технологий ракет-носителей проходят квалификационную кампанию в устойчивом темпе, уверенные, что терпение будет вознаграждено на стартовой площадке."
 CHI_space_events.12.t: "Ровный темп"
 CHI_space_events.13.a: "Пожинать плоды"
 CHI_space_events.13.d: "Решения о финансировании прошлых лет приносят плоды. Вводятся в строй антенны слежения, двигатели проходят квалификационные огневые испытания, а лунная архитектура обретает форму. Дивиденды дальновидности готовы к получению."
 CHI_space_events.13.t: "Инвестиции окупаются"
 CHI_space_events.2.a: "Великий скачок для китайского народа."
 CHI_space_events.2.d: "Посадочный модуль «Ланьюэ» садится в районе южного полюса Луны. Командир экспедиции открывает люк и спускается по трапу. Его первые слова звучат в прямом эфире для миллиарда слушателей: мы прибыли — и мы останемся. Китай достиг Луны."
 CHI_space_events.2.t: "Тайконавты ступают на Луну"
 CHI_space_events.20.a: "Триумф нации"
 CHI_space_events.20.b: "Триумф нашей промышленности"
 CHI_space_events.20.c: "Триумф нашей науки"
 CHI_space_events.20.d: "Тайконавты прошли по Луне и вернулись домой. Страна, когда-то импортировавшая ракеты, водрузила свой флаг на другом небесном теле. Теперь руководство должно решить, какой непреходящий смысл будет нести это достижение: национальный престиж, промышленную мощь, научные амбиции или военную уверенность. Дивиденды Луны определят грядущие десятилетия."
 CHI_space_events.20.e: "Триумф нашей решимости"
 CHI_space_events.20.t: "Наследие высадки на Луну"
 chi_uighur.1.a: "Разогнать силами ОМОНа"
 chi_uighur.1.b: "Отправить партийных чиновников на переговоры"
 chi_uighur.1.c: "Массовые аресты, обвинить иностранных подстрекателей"
 chi_uighur.1.d: "После инцидента между ханьскими жителями и уйгурскими рабочими на улицы Урумчи вышли демонстранты. ОМОН оцепил центральные районы, но толпа растёт. Партийный комитет Синьцзяна ждёт указаний из Пекина."
 chi_uighur.1.t: "Уличные протесты в Урумчи"
 chi_uighur.2.a: "Расширить государство слежки"
 chi_uighur.2.b: "Работа с общинами и экономическая помощь"
 chi_uighur.2.c: "Публичные казни исполнителей"
 chi_uighur.2.d: "Скоординированный взрыв в оживлённом рыночном квартале унёс жизни людей и разрушил всякое ощущение нормальной жизни в городе. Ответственность взяло на себя Исламское движение Восточного Туркестана. Силы безопасности приведены в повышенную готовность, а Пекин требует быстрого ответа."
 chi_uighur.2.t: "Взрыв на рынке в Урумчи"
 chi_uighur.3.a: "Ввести военное положение в Урумчи"
 chi_uighur.3.b: "Массовые задержания, лагеря «перевоспитания»"
 chi_uighur.3.c: "Вести переговоры с лидерами уйгурской общины"
 chi_uighur.3.d: "Напряжённость, копившаяся месяцами, выплеснулась в открытое насилие в Урумчи и ряде окрестных районов. Столкновения уйгурских протестующих с ханьскими жителями оказались не по силам местной полиции. Масштаб беспорядков, напоминающих события 2009 года, требует немедленного решения партийного центра."
 chi_uighur.3.t: "В Синьцзяне вспыхнули массовые беспорядки"
 chi_uighur.4.a: "Отвергнуть любое вмешательство в наши внутренние дела"
 chi_uighur.4.b: "Разрешить ограниченный визит миссии ООН по установлению фактов"
 chi_uighur.4.d: "Сообщения о массовых задержаниях и создании центров перевоспитания в Синьцзяне вызвали резкое осуждение со стороны западных правительств, Турции и международных правозащитных органов. Призывы к независимому расследованию звучат всё громче, а ряд столиц угрожает карательными мерами."
 chi_uighur.4.t: "Международное сообщество осуждает Пекин"
 chi_uighur.5.a: "Тихая операция, полная ликвидация сети"
 chi_uighur.5.d: "Спецслужбы установили и обнаружили ячейку боевиков, готовившую теракты по всему Синьцзяну. Опираясь на точные разведданные, тихая операция уничтожила сеть до того, как она успела нанести удар."
 chi_uighur.5.t: "Прорыв контртеррористической разведки"
 chi_uighur.6.a: "Жёсткий ответ восстановит порядок"
 chi_uighur.6.b: "Железный кулак Пекина"
 chi_uighur.6.d: "В китайском Синьцзяне вспыхнули ожесточённые беспорядки. По всему миру расходятся кадры горящих автомобилей и силовиков в полном защитном снаряжении. Пекин заявил, что порядок будет восстановлен, но масштаб волнений привлекает пристальное внимание правительств и наблюдателей по всему миру."
 chi_uighur.6.t: "Беспорядки сотрясают Синьцзян"
 china_national_committee.02.a: "Избрать комитеты"
 china_national_committee.02.d: "Открылся Всекитайский съезд Коммунистической партии Китая. Делегаты со всей страны собрались, чтобы определить политический курс на следующие пять лет. Сейчас будут избраны важнейшие комитеты и их руководство."
 china_national_committee.02.t: "Открылся съезд партии"
 china_news.44.a: "Конец семидесятилетнему разделению."
 china_news.44.d: "После совместного китайско-американского ультиматума правительство Северной Кореи мирно самораспустилось и передало суверенитет Республике Корея. Полуостров вновь един — под флагом Сеула. Династия Кимов пала без войны."
 china_news.44.t: "Корейский полуостров объединён под властью Сеула"
 china_news.45.a: "Начинается последняя корейская война."
 china_news.45.d: "После того как Пхеньян отверг совместный китайско-американский ультиматум, Китай, США и Южная Корея объявили войну Северной Корее. Впервые в истории Пекин и Вашингтон выступают вместе против режима Кимов."
 china_news.45.t: "Северной Корее объявлена война"
 china_news.boycott_streets.a: "Принять к сведению."
 china_news.boycott_streets.d: "Антияпонские протесты перекинулись из соцсетей на улицы. Автосалоны закрыты, магазины Uniqlo заколачивают витрины, а автомобили Toyota не находят покупателей. Правительство не вмешивается."
 china_news.boycott_streets.t: "Бойкот охватывает китайские города"
 china_news.panda_arrives_tokyo.a: "Принять к сведению."
 china_news.panda_arrives_tokyo.d: "Две большие панды — подарок Китайской Народной Республики — прибыли в аэропорт Нарита, где их встретили с большим воодушевлением. Этот жест — дипломатический сигнал о потеплении в китайско-японских отношениях."
 china_news.panda_arrives_tokyo.t: "Панды приземлились в Нарите"
 china_news.yasukuni_recall.a: "Принять к сведению."
 china_news.yasukuni_recall.d: "Китай отозвал своего посла из Токио после посещения премьер-министром Японии храма Ясукуни. Этот дипломатический протест показывает решимость Пекина призвать Японию к ответу за то, как она чтит своих павших в войне."
 china_news.yasukuni_recall.t: "Пекин отзывает посла"
 china_sar.034.a: "Немедленно провести силовую операцию."
 china_sar.034.b: "Сначала расследовать и привлечь местных лидеров."
 china_sar.034.d: "Скоординированное нападение на пост безопасности в Таримской котловине унесло жизни полицейских и мирных жителей. Пекин должен выбрать между немедленными жёсткими мерами и более медленным расследованием в неспокойном регионе."
 china_sar.034.t: "Нападение в Синьцзяне"
 china_scs.10.a: "Отметить эскалацию."
 china_scs.10.d: "Разведка сообщает о скоординированном развёртывании Китаем рыболовных флотилий, морской милиции, катеров береговой охраны и фрегатов концентрическими кольцами вокруг спорных объектов в Южно-Китайском море. Эта доктрина, приписываемая контр-адмиралу Чжан Чжаочжуну, к моменту завершения окружения не оставляет места для правового оспаривания. Наши претензии и интересы в регионе теперь под прямым давлением."
 china_scs.10.t: "Пекин берёт на вооружение «стратегию капусты»"
 china_scs.12.a: "Принять результат."
 china_scs.12.d: "Операция противостояния завершена. Её исход определяет фактический контроль над объектом и дипломатические издержки, которые придётся понести Китаю."
 china_scs.12.t: "Противостояние завершено"
 china_scs.13.a: "Немедленно начать операции FONOP."
 china_scs.13.b: "Пока проявить сдержанность."
 china_scs.13.d: "Госдепартамент направил официальный демарш, а Пентагон рассматривает варианты. Наиболее вероятный немедленный ответ — операции по обеспечению свободы судоходства (FONOP) в двенадцатимильных зонах искусственных островов. Седьмой флот приведён в готовность."
 china_scs.13.t: "Вашингтон отвечает на китайскую экспансию"
 china_scs.14.a: "Отступить. Не перехватывать."
 china_scs.14.b: "Сопровождать корабль и заявить протест."
 china_scs.14.c: "Перехватить и сделать последнее предупреждение."
 china_scs.14.d: "Корабль ВМС США вошёл в двенадцатимильную зону вокруг одного из китайских искусственных островов. Флот Южного моря ждёт приказов. Отступление будет воспринято как согласие; сопровождение сохраняет присутствие без эскалации; активный перехват грозит серьёзным инцидентом."
 china_scs.14.t: "Ответ ВМС НОАК на FONOP"
 china_scs.15.a: "Заявить официальный протест и потребовать компенсации."
 china_scs.15.b: "Созвать экстренное заседание Совета Безопасности."
 china_scs.15.d: "Операция по обеспечению свободы судоходства закончилась столкновением или противостоянием в море. Обе стороны выдвигают противоречащие друг другу версии произошедшего. Международные СМИ требуют полного расследования, а общественность обеих стран призывает к жёсткому ответу."
 china_scs.15.t: "Инцидент в Южном море"
 china_scs.20.a: "Небо над Южным морем — китайское."
 china_scs.20.d: "Пекин объявил о создании зоны идентификации ПВО над Южно-Китайским морем. Все воздушные суда, входящие в зону, обязаны передавать опознавательные данные, поддерживать радиосвязь и выполнять указания китайских диспетчеров. США, Япония, Австралия и Филиппины немедленно объявили эту зону незаконной с точки зрения международного права."
 china_scs.20.t: "Объявлена зона ПВО над Южно-Китайским морем"
 china_scs.21.a: "Сделать строгое предупреждение по дипломатическим каналам."
 china_scs.21.b: "Выпроводить их и выступить с заявлением."
 china_scs.21.d: "Перехватчики ВВС НОАК вступили в контакт с иностранным военным самолётом, пролетавшим через зону патрулирования Южно-Китайского моря без соблюдения китайских процедур опознавания. Самолёт сопроводили или потребовали от него объяснений; реакция Пекина на инцидент определит и авторитет зоны патрулирования, и температуру отношений со страной, которой принадлежит самолёт."
 china_scs.21.t: "Перехвачен иностранный самолёт"
 china_scs.30.a: "Включиться в новый формат."
 china_scs.30.d: "Пекин объявил, что будет вести политику в Южно-Китайском море в духе флотов сокровищ династии Мин — через торговлю, партнёрство и двусторонний диалог, а не конфронтацию. Рамки Морского Шёлкового пути официально распространены на все прибрежные государства. Возможность для деэскалации реальна, даже если сами претензии не изменились."
 china_scs.30.t: "Пекин делает ставку на морскую дипломатию"
 china_scs.31.a: "Конструктивный шаг вперёд."
 china_scs.31.d: "В совместном заявлении по итогам двусторонних переговоров в Пекине Китай и его соседи по Южно-Китайскому морю подтвердили приверженность Декларации о поведении сторон 2002 года. Заявление призывает мирно урегулировать споры через двусторонние консультации и обновляет обязательство воздерживаться от односторонних провокаций — формулировку, которую Пекин толкует как не распространяющуюся на его уже существующее присутствие."
 china_scs.31.t: "Декларация 2002 года подтверждена"
 china_scs.32.a: "Принять Манилу в новое партнёрство."
 china_scs.32.b: "Сохранить нынешнюю ориентацию на США."
 china_scs.32.d: "Президент Дутерте выступил в Пекине с речью, объявив о «разрыве» Филиппин с США и дав понять, что открыт для новых отношений с Китаем. Заявление ошеломило Вашингтон и обрадовало Пекин. Позиция Манилы по арбитражному решению о Южно-Китайском море теперь намеренно двусмысленна."
 china_scs.32.t: "Манила на распутье"
 china_scs.33.a: "Шаг к региональной стабильности."
 china_scs.33.d: "«Жэньминь жибао» сообщает, что Китай и его партнёр заключили соглашение о совместном освоении моря, создающее общую административную рамку для разведки углеводородов и прав на рыболовство. Соглашение названо «образцом взаимовыгодного сотрудничества и Морского Шёлкового пути в действии». Правительства других претендующих стран, не участвующих в соглашении, от комментариев воздерживаются."
 china_scs.33.t: "Подписано соглашение о совместном освоении моря"
 china_scs.34.a: "Предоставить отсрочку и пересмотреть условия."
 china_scs.34.b: "Настаивать на исходных условиях."
 china_scs.34.c: "Списать долг в обмен на уступки."
 china_scs.34.d: "Правительство страны-партнёра объявило, что не может внести плановый платёж по кредиту на инфраструктуру в рамках инициативы «Один пояс и один путь». Оппозиция требует пересмотра условий; Пекин стоит перед выбором между гибкостью, сохраняющей отношения, и твёрдостью, сохраняющей финансовый прецедент."
 china_scs.34.t: "Требование пересмотреть долг"
 china_scs.35.a: "Дипломатический триумф."
 china_scs.35.d: "Впервые в коммюнике саммита АСЕАН появились формулировки, прямо одобряющие двустороннее урегулирование споров в Южно-Китайском море и отвергающие участие «внешних сторон». Формулировка была включена по настоянию Китая и заблокировала текст, которого добивались Вьетнам и Филиппины. Вашингтон осудил этот результат."
 china_scs.35.t: "Саммит АСЕАН поддерживает позицию Китая"
 china_scs.36.a: "Пересмотреть условия."
 china_scs.36.b: "Настаивать на исходных условиях."
 china_scs.36.c: "Отозвать кредит."
 china_scs.36.d: "Оппозиционные политики и гражданские организации страны-партнёра начали публичную кампанию против китайского кредита по линии «Один пояс и один путь», ссылаясь на невыгодные проценты, экологические риски и опасения стратегической зависимости. На правительство давят, требуя пересмотреть условия; Пекин должен выбрать между защитой финансового прецедента и сохранением политических отношений."
 china_scs.36.t: "Долговое недовольство"
 china_scs.40.a: "Добиваться полного принятия китайского проекта."
 china_scs.40.b: "Пойти на компромисс, чтобы соглашение подписали."
 china_scs.40.d: "Переговоры о Кодексе поведения в Южно-Китайском море вступили в финальный раунд. Китайский проект исключает обязательное урегулирование споров, ограничивает географический охват, исключая районы активного китайского строительства, и не допускает государства вне АСЕАН к какому-либо надзору. Претендующие страны разделились: принять несовершенное соглашение или бесконечно обходиться без него."
 china_scs.40.t: "Переговоры о Кодексе поведения: финальный раунд"
 china_scs.41.a: "Регион сказал своё слово."
 china_scs.41.d: "Госдепартамент выступил с заявлением, признающим вступление в силу Кодекса поведения АСЕАН и Китая в Южно-Китайском море. В заявлении отмечаются возражения США против ряда положений, но соглашение признаётся определяющей рамкой для региона. Аналитики называют это значительным отступлением от давней позиции Америки, настаивавшей на UNCLOS как единственной основе."
 china_scs.41.t: "Вашингтон признаёт Кодекс поведения"
 china_scs.50.a: "Подготовить ответ."
 china_scs.50.d: "Редакционная статья «Жэньминь жибао», распространённая по дипломатическим каналам с явного одобрения государства, ссылается на классическую доктрину «Четырёх морей» (四海, Сыхай) и представляет морские претензии Китая как восстановление прерванного естественного порядка. Сопровождающее её объявление о расширении флота не оставляет сомнений в намерениях Пекина. Морской порядок, сложившийся в западной части Тихого океана после 1945 года, теперь открыто оспаривается."
 china_scs.50.t: "Пекин провозглашает «мандат морей»"
 china_scs.51.a: "Их протесты приняты к сведению."
 china_scs.51.b: "Выступить с разъяснением, чтобы снизить тревогу."
 china_scs.51.d: "Официальное обращение Китая к данническому порядку вызвало резко расходящиеся реакции. Министры иностранных дел АСЕАН выступили с экстренным совместным заявлением, отвергающим любые претензии на историческое верховенство. США, Япония и Австралия объявили о скоординированном дипломатическом ответе. В самом Китае госСМИ подали эту реакцию как подтверждение того, что восстановление национального достоинства тревожит тех, кто наживался в «век унижений»."
 china_scs.51.t: "Мир реагирует на даннические заявления"
 china_scs.52.a: "Признать власть Китая."
 china_scs.52.b: "Отвергнуть ультиматум."
 china_scs.52.d: "Посол Китая вручил официальный ультиматум с требованием в течение семидесяти двух часов признать административную власть Китая над спорными водами Южно-Китайского моря. Правительство должно решить: принять условия и сохранить отношения или отказаться и принять последствия."
 china_scs.52.t: "Ультиматум вручён"
 china_scs.53.a: "Выдвинуть совместный ультиматум."
 china_scs.53.b: "Ограничиться дипломатическим протестом."
 china_scs.53.c: "Не вмешиваться."
 china_scs.53.d: "Пекин предъявил ультиматум одной из претендующих стран Южно-Китайского моря, и та отказалась подчиниться. Перед Вашингтоном стоит выбор: выполнить свои обязательства по безопасности, присоединившись к совместному ультиматуму Китаю, ограничиться официальным протестом, сохраняющим отношения, или полностью остаться в стороне. Решение зависит от готовности флота, доверия союзников и того, сколько политического капитала администрация готова потратить на спор в водах за четыре тысячи миль."
 china_scs.53.t: "Кризис в Южно-Китайском море"
 china_scs.54.a: "Подчиниться и отвести силы."
 china_scs.54.b: "Отказаться. Они не будут диктовать Китаю."
 china_scs.54.d: "США вместе с претендующей страной официально потребовали от Пекина вывести силы со спорного объекта и отозвать ультиматум. Седьмой флот находится в повышенной готовности. Подчиниться — значит отступить; отказаться — значит противостоять совокупной военно-морской мощи США и их региональных партнёров. Созван Постоянный комитет Политбюро."
 china_scs.54.t: "Ультиматум Вашингтона"
 china_scs.55.a: "Пусть так будет и впредь."
 china_scs.55.d: "Донесения с объектов ВМС НОАК в Южно-Китайском море говорят о разном настроении во флоте. На рифе Файери-Кросс моряки фотографируют рассвет над водами, которые их карты теперь обозначают как родные. На авианосце экипаж готовится к учениям. На посту береговой охраны у Скарборо вахтенный офицер отмечает, что уже девяносто дней ни одно иностранное судно не приближалось к запретной линии. В Южном море спокойно."
 china_scs.55.t: "Голоса Флота Южного моря"
 china_scs.56.a: "Южное море должно быть под контролем."
 china_scs.56.d: "После того как претендующая страна отвергла ультиматум Пекина, надводные группы ВМС НОАК выдвинулись, чтобы обеспечить его выполнение. Началось короткое и жёсткое морское столкновение за спорный объект архипелага Спратли. Обе стороны задействуют лишь ограниченные силы; исход определит контроль над регионом и то, обратится ли претендующая страна к Вашингтону за вмешательством."
 china_scs.56.t: "Стычка у Спратли"
 china_scs.57.a: "Признать поражение и искать условия мира."
 china_scs.57.b: "Обратиться к США."
 china_scs.57.d: "Пограничное столкновение закончилось поражением. Спорный объект теперь под контролем Китая, а наши силы отведены. Правительство должно решить: смириться с потерей и сохранить остатки суверенитета или обратиться за поддержкой к США — выбор, рискующий втянуть Вашингтон в конфронтацию, которой он может не желать."
 china_scs.57.t: "Обращение к американским союзникам"
 china_scs.58.a: "Отступить и пересмотреть подход."
 china_scs.58.d: "Подразделения ВМС НОАК вступили в бой с силами претендующей страны за спорный объект и отошли, не закрепив позицию. Стычка была ограниченной и локализованной, но в дипломатическом нарративе она выглядит как китайский перегиб и военная несостоятельность. Пекину придётся понести политические издержки, пока общая стратегическая линия продолжается."
 china_scs.58.t: "Неудача в стычке у Спратли"
 china_scs.60.a: "Отметить новый расклад."
 china_scs.60.d: "Поскольку китайская агрессия в Южно-Китайском море превысила порог, который регион больше не может сгладить дипломатией, США, Япония, Индия и Австралия оформили своё сотрудничество в сфере безопасности в действующий союз «Четвёрки» (Quad). Объявлено о совместном морском патрулировании, обмене разведданными и согласовании дипломатических позиций. Этот союз — прямой ответ на курс Пекина и сигнал того, что борьба за Южно-Китайское море приобрела измерение великих держав."
 china_scs.60.t: "Четырёхсторонняя инициатива"
 china_scs.70.a: "Тихо извиниться и уйти."
 china_scs.70.b: "Стоять на своём. Эти воды входят в исторические права Китая."
 china_scs.70.d: "Суда китайской морской милиции в сопровождении береговой охраны обнаружены в исключительной экономической зоне Индонезии у островов Натуна. Джакарта заявила официальный протест, отозвала посла и направила военные корабли для сопровождения китайских судов. Индонезия публично не оспаривает линию из девяти пунктиров, но это вторжение испытывает пределы её стратегического терпения и грозит втянуть крупнейшее государство АСЕАН в открытое противостояние с Пекином."
 china_scs.70.t: "Инцидент у Натуны"
 sino_indian.1.d_opt: "Сейчас мы не можем вмешаться."
 sino_indian.20.a: "Оборонительная коалиционная операция. Мы защищаем регион."
 sino_indian.20.b: "Карательная экспедиция. Быстрая, решительная, беспощадная."
 sino_indian.20.c: "Тотальная мобилизация коалиции. Мы покончим с этим навсегда."
 sino_indian.20.d: "Коалиционная структура против талибов и группировок ТТП в афгано-пакистанском приграничье создана. Командиры ждут политических указаний о характере операции. От этого выбора зависит, как регион и весь мир будут воспринимать роль Китая в Центральной Азии."
 sino_indian.20.t: "Операция «Горный тигр»: определить задачу"
 sino_indian.21.a: "Принять. Начать официальный диалог."
 sino_indian.21.b: "Ответить осторожно. Доверяй, но проверяй."
 sino_indian.21.c: "Отвергнуть. Это уловка."
 sino_indian.21.d: "Китай предпринял ряд шагов, чтобы дистанцироваться от Исламабада и обозначить новую ориентацию на Нью-Дели. Жест сделан без предварительных условий, но его стратегический смысл очевиден. Индия должна решить, вступать ли в диалог и на каких условиях."
 sino_indian.21.t: "Пекин неожиданно протягивает руку"
 sino_indian.22.a: "Оборонительная позиция. Нас спровоцировали."
 sino_indian.22.b: "Карательная экспедиция. Как в 1962 году."
 sino_indian.22.c: "Тотальная мобилизация. Решить вопрос линии Мак-Магона навсегда."
 sino_indian.22.d: "Силы НОАК вступили в бой с индийскими подразделениями на линии фактического контроля. Столкновение достаточно серьёзно, чтобы требовать политического решения. Пекин должен определить политический характер этой военной операции, пока она не определила его сама."
 sino_indian.22.t: "Час расплаты у Галвана"
 sino_indian.30.a: "Превосходно."
 sino_indian.30.b: "Интересное развитие событий."
 sino_indian.30.d: "Посредничество Китая между враждующими фракциями талибов привело к неожиданному расколу. Радикальный блок порвал с основным руководством из-за предложенных условий и публично осудил процесс. Раскол ослабляет сплочённость талибов и открывает возможности для коалиции."
 sino_indian.30.t: "Фракции талибов раскололись из-за переговоров"
 sino_indian.31.a: "Этого мы и ожидали."
 sino_indian.31.d: "Объявление Пекином полной коалиционной мобилизации в Центральной Азии вызвало обеспокоенность в Анкаре и Тегеране. Обе столицы рассматривают мобилизацию как распространение китайской военной мощи на регион, который они считают своей стратегической периферией."
 sino_indian.31.t: "Коалиционная мобилизация тревожит региональные державы"
 sino_indian.32.a: "Принять пакт. Нам нужна защита."
 sino_indian.32.b: "Отказаться. Мы сохраняем стратегическую автономию."
 sino_indian.32.d: "После китайского наступления на Гималайском фронте Вашингтон обратился к Нью-Дели с официальным предложением двустороннего оборонного пакта. Американские стратеги видят в Индии важнейший противовес китайской мощи. Для Индии согласие означало бы гарантии безопасности, но и более тесную привязку к США."
 sino_indian.32.t: "Вашингтон предлагает оборонный пакт"
 sino_indian.33.a: "Готовиться к давлению Китая"
 sino_indian.33.d: "Возобновившаяся активность Китая в Южной Азии — прямой вызов традиционной сфере влияния Индии. Нью-Дели должен подготовить ответ."
 sino_indian.33.t: "Пекин поворачивается к Южной Азии"
 sino_indian.34.a: "Взять винтовки и приказы"
 sino_indian.34.b: "Отказаться быть марионеткой Пекина"
 sino_indian.34.d: "Китай предлагает Объединённой коммунистической партии Непала оружие, подготовку и политическую поддержку для продолжения повстанческой борьбы против Катманду. Согласие привяжет движение к покровительству Пекина — долг, который будет взыскан, если красное знамя когда-нибудь взовьётся над Сингха-Дурбаром."
 sino_indian.34.t: "Пекин протягивает руку маоистам"
 sino_indian.35.a: "Принять рамочное соглашение"
 sino_indian.35.b: "Пока отказаться"
 sino_indian.35.d: "Пекин обратился к Катманду с предложением экономического и инфраструктурного сотрудничества на основе взаимного уважения нейтрального статуса Непала."
 sino_indian.35.t: "Китай предлагает рамки сотрудничества"
 sino_indian.36.a: "Принять партнёрство"
 sino_indian.36.b: "Вежливо отказаться"
 sino_indian.36.d: "Китай предложил Бангладеш официальное стратегическое партнёрство, подкреплённое гарантией безопасности и расширением торговых связей. Дакка должна соотнести выгоды с вероятной реакцией Нью-Дели."
 sino_indian.36.t: "Пекин предлагает Дакке стратегическое партнёрство"
 sino_indian.37.a: "Мы принимаем этот жест"
 sino_indian.37.d: "Неожиданным дипломатическим жестом Китай официально отказался от оставшихся территориальных претензий на северной границе Бутана. Тхимпху приветствует это заявление."
 sino_indian.37.t: "Пекин отказывается от претензий к Бутану"
 sino_indian.38.a: "Принять партнёрство"
 sino_indian.38.b: "Нам нужно собственное пространство"
 sino_indian.38.d: "Китай предложил Пакистану декларацию о постоянном партнёрстве — союз «Железных братьев», закрепляющий их всепогодный союз на высшем политическом уровне."
 sino_indian.38.t: "Пекин предлагает пакт «Железных братьев»"
 sino_indian.39.a: "Сосредоточиться на сухопутной войне"
 sino_indian.39.b: "Сосредоточиться на авиации"
 sino_indian.39.c: "Сосредоточиться на флоте"
 sino_indian.39.d: "Оборонная промышленность Китая готова передать знания Пакистану. Исламабад должен решить, какой области это сотрудничество принесёт наибольшую пользу."
 sino_indian.39.d_opt: "Сосредоточиться на ядерных технологиях"
 sino_indian.39.t: "Совместные военные проекты: выбрать направление"
 sino_indian.40.a: "Официально признать ИДВТ террористической организацией"
 sino_indian.40.b: "Отклонить запрос"
 sino_indian.40.d: "Китай официально попросил Пакистан признать Исламское движение Восточного Туркестана террористической организацией. Исламабад должен взвесить выгоды для борьбы с терроризмом и внутриполитическую чувствительность вопроса."
 sino_indian.40.t: "Пекин просит признать ИДВТ террористами"
 sino_indian.41.a: "Приветствуем инвестиции!"
 sino_indian.41.d: "Пекин подтвердил запуск полномасштабной программы Китайско-пакистанского экономического коридора. Масштабные инфраструктурные инвестиции преобразят транспортные и энергетические сети Пакистана."
 sino_indian.41.t: "Начинается Китайско-пакистанский экономический коридор"
 sino_indian.42.a: "Мы приветствуем партнёрство"
 sino_indian.42.d: "Пекин предложил расширить причальные сооружения порта Гвадар для приёма китайских военных кораблей. В обмен Исламабад получит новые судостроительные мощности."
 sino_indian.42.t: "Китай видит в Гвадаре военно-морской узел"
 sino_indian.43.a: "Присоединиться к механизму"
 sino_indian.43.d: "Китай пригласил Пакистан присоединиться к Четырёхстороннему механизму сотрудничества и координации (QCCM) — совместной контртеррористической структуре, объединяющей Пекин, Кабул, Исламабад и Душанбе."
 sino_indian.43.t: "QCCM: Исламабад приглашён к участию"
 sino_indian.44.a: "Присоединиться к механизму"
 sino_indian.44.d: "Китай пригласил Афганистан присоединиться к Четырёхстороннему механизму сотрудничества и координации (QCCM) — совместной контртеррористической структуре, объединяющей Пекин, Кабул, Исламабад и Душанбе."
 sino_indian.44.t: "QCCM: Кабул приглашён к участию"
 sino_indian.45.a: "Присоединиться к механизму"
 sino_indian.45.d: "Китай пригласил Таджикистан присоединиться к Четырёхстороннему механизму сотрудничества и координации (QCCM) — совместной контртеррористической структуре, объединяющей Пекин, Кабул, Исламабад и Душанбе."
 sino_indian.45.t: "QCCM: Душанбе приглашён к участию"
 sino_indian.46.a: "Сражаться вместе с Китаем"
 sino_indian.46.b: "Это война Китая, пусть он её и ведёт"
 sino_indian.46.d: "Пекин предложил Пакистану присоединиться к совместной военной кампании против талибов и ТТП. Совместные усилия дадут куда более решительный результат, но и обязательства будут гораздо серьёзнее."
 sino_indian.46.t: "Китай предлагает совместные операции в Афганистане"
 sino_indian.47.a: "Координировать охрану границы"
 sino_indian.47.d: "Пекин создал в Ваханском коридоре совместную зону пограничного контроля и координации борьбы с терроризмом. Все страны-партнёры выиграют от улучшенного обмена разведданными."
 sino_indian.47.t: "Китай запускает Ваханскую буферную инициативу"
 sino_indian.48.a: "Отметить этот жест"
 sino_indian.48.b: "Мы по-прежнему настроены скептически"
 sino_indian.48.d: "Решение Китая дистанцироваться от Исламабада не осталось незамеченным в Нью-Дели. Означает ли это подлинную переориентацию или временный манёвр — вопрос остаётся открытым."
 sino_indian.48.t: "Индия оценивает поворот Пекина в отношении Пакистана"
 sino_indian.49.a: "Заявить официальный протест"
 sino_indian.49.b: "Принять новую региональную реальность"
 sino_indian.49.d: "Китайско-индийский договор о дружбе потряс Вашингтон. На самом высоком уровне обсуждают, является ли он основой стабильного нового порядка или угрозой американским интересам в регионе."
 sino_indian.49.t: "Вашингтон реагирует на китайско-индийский договор"
 sino_indian.50.a: "Подчиниться власти Китая"
 sino_indian.50.b: "Бутан никогда не подчинится"
 sino_indian.50.d: "Китай поставил Бутан перед жёстким выбором: официально подчиниться власти Пекина или столкнуться с последствиями применения военной силы. У Тхимпху почти нет пространства для манёвра."
 sino_indian.50.t: "Пекин предъявляет ультиматум Тхимпху"
 sino_indian.51.a: "Принять условия"
 sino_indian.51.b: "Непал будет сопротивляться"
 sino_indian.51.d: "Китай потребовал, чтобы Непал принял официальный статус ассоциированного государства под властью Пекина. Катманду должен решить, подчиниться или сопротивляться."
 sino_indian.51.t: "Пекин предъявляет ультиматум Катманду"
 sino_indian.52.a: "Принять партнёрство"
 sino_indian.52.b: "Отклонить запрос"
 sino_indian.52.d: "Китай официально запросил логистический доступ и право базирования в наших портах в рамках так называемой стратегии «Жемчужной нити». В обмен Пекин предлагает солидный пакет экономического партнёрства."
 sino_indian.52.t: "Пекин запрашивает право базирования флота"
 sino_indian.53.a: "Принять объятия Пекина"
 sino_indian.53.b: "Революция не служит иностранным хозяевам"
 sino_indian.53.d: "Народная Республика Непал торжествует в Катманду, но винтовки, принёсшие победу революции, были с клеймом Norinco. Теперь Пекин ждёт, что новое государство займёт своё место в сфере Китая как ассоциированное государство. Отказ не будет встречен любезно."
 sino_indian.53.t: "Пекин предъявляет счёт"
 sino_indian.54.a: "Отличное партнёрство"
 sino_indian.54.d: "Пакистан принял наше предложение о совместных военных исследованиях и выбрал направление. Наши оборонные отрасли будут координировать разработки по согласованной специализации, а наши исследователи получат выгоду от партнёрства."
 sino_indian.54.t: "Исламабад присоединяется к совместным военным программам"
 sino_indian.55.a: "Плацдарм на Аравийском море"
 sino_indian.55.d: "Исламабад официально принял наши военно-морские силы в порту Гвадар. Расширенные причальные сооружения и соглашение о базировании дают нам стратегический плацдарм на Аравийском море и закрепляют наше присутствие в западной части Индийского океана."
 sino_indian.55.t: "Гвадар открыт для ВМС НОАК"
 CHI_advanced_node_chips_trait: "Микросхемы на передовых техпроцессах"
 CHI_advanced_node_chips_trait_desc: "Технологический процесс SMIC, эквивалентный 7 нм, обеспечивает системы управления и контроля компании CETC отечественными процессорами. Это устраняет «узкое место» в виде зависимости от импортных поставок электронных компонентов для обработки сигналов."
 CHI_hbm_compute_trait: "Вычисления наведения на базе HBM"
 CHI_hbm_compute_trait_desc: "Модули CXMT HBM2 обеспечивают поддержку расширенных функций объединения данных с датчиков и классификации целей в системах перехвата и противовоздушной обороны CASIC. Использование отечественных компонентов позволяет избавиться от зависимости от импортной памяти."
 CHI_imfm_jsw_partnership: "Партнёрство с Japan Steel Works"
 CHI_imfm_jsw_partnership_desc: "В рамках этого партнерства осуществляется передача технологий компании Japan Steel Works по производству крупнодиаметровой ковки и высокотвердой стали, что напрямую способствует повышению качества выпускаемой заводом конструкционной стали."
 CHI_imfm_komatsu_partnership: "Партнёрство с Komatsu"
 CHI_imfm_komatsu_partnership_desc: "Сотрудничество с компанией Komatsu Defense позволяет внедрить методы модульного строительства легких бронированных конструкций и практику интеграции систем транспортных средств, разработанные в рамках японских программ по созданию техники самообороны."
 CHI_imfm_mhi_partnership: "Партнёрство с Mitsubishi Heavy Industries"
 CHI_imfm_mhi_partnership_desc: "Соглашение о лицензионном производстве, заключенное с компанией Mitsubishi Heavy Industries, позволяет внедрить в программу производства транспортных средств завода передовые методы проектирования брони и технологии использования композитных материалов для защиты."
 CHI_indigenous_euv_trait: "Отечественная EUV-интеграция"
 CHI_indigenous_euv_trait_cetc: "Отечественная EUV-интеграция"
 CHI_indigenous_euv_trait_cetc_desc: "Литография по технологии SiCarrier позволяет производить процессоры CETC с ЧПУ нового поколения, сенсорные ASIC и электронные блоки радиолокационных систем. Стоимость одной пластины снижается по мере совершенствования отечественного технологического комплекса."
 CHI_indigenous_euv_trait_desc: "В рамках программы CASC с помощью литографии по технологии SiCarrier производятся микросхемы космического и ракетного назначения. Обеспечивается полный цикл отечественного снабжения для стратегических систем."
 CHI_kirin_avionics_trait: "Интеграция авионики Kirin"
 CHI_kirin_avionics_trait_desc: "Микросхемы на базе HiSilicon Kirin используются в бортовых компьютерах AVIC, системах выполнения задач и комплексах радиоэлектронной борьбы. Замена импортной продукции на отечественную после включения компании в Entity List в 2019 году."
 CHI_norinco_howa_partnership: "Партнёрство с Howa Machinery"
 CHI_norinco_howa_partnership_desc: "В рамках данного партнерства компания Howa Machinery предоставляет лицензию на свои технологии прецизионной механической обработки деталей стрелкового оружия, что позволяет повысить производственные допуски и обеспечить стабильное качество всей линейки пехотного оружия компании NORINCO."
 CHI_norinco_nec_partnership: "Партнёрство с NEC"
 CHI_norinco_nec_partnership_desc: "Сотрудничество с корпорацией NEC позволяет интегрировать японские стандарты в области электроники C4ISR и технологии разработки встроенных систем в линейки продукции NORINCO, предназначенной для связи и сенсорных систем на поле боя."
 CHI_norinco_subaru_partnership: "Партнёрство с Subaru"
 CHI_norinco_subaru_partnership_desc: "Соглашение о передаче технологий, заключенное с компанией Subaru Aerospace, позволяет внедрить на производственные линии NORINCO технологии точной металлообработки и знания в области проектирования конструкций вертолетов."
 CHI_norinco_toshiba_partnership: "Партнёрство с Toshiba"
 CHI_norinco_toshiba_partnership_desc: "В рамках лицензионного соглашения с компанией Toshiba Defense Systems в подразделение электроники компании NORINCO внедряются передовые технологии проектирования радиолокационных решеток и производства компонентов для радиоэлектронной борьбы."
 CHI_norinco_trait_red_arrow_L_AT_Equipment_suite: "Комплекс ПТУР «Красная стрела» серии HJ"
 CHI_bop_drift_bo: "Влияние фракции Бо Силая"
 CHI_bop_drift_hu: "Влияние фракции Ху Цзиньтао"
 CHI_bop_drift_jiang: "Влияние фракции Цзян Цзэминя"
 CHI_bop_drift_xi: "Влияние фракции Си Цзиньпина"
 CHI_bop_drift_zeng: "Влияние фракции Цзэн Цинхуна"
 CHI_infantry_general: "Генерал пехоты"
 CHI_infantry_general_desc: "Генерал Шин Фай поднялся по служебной лестнице в Сухопутных войсках Народно-освободительной армии как специалист по проведению крупномасштабных пехотных операций. Он командует массовыми формированиями Красной гвардии и штурмовой пехоты, делая упор на быстрое развёртывание и численное превосходство."
 CHI_jiang_legacy_secured: "Наследие обеспечено"
 CHI_jiang_military_modernizer: "Модернизатор вооружённых сил"
 CHI_jiang_reformer: "Архитектор эпохи реформ"
 CHI_jiang_security_tsar: "Царь безопасности"
 CHI_nuke_general: "Генерал-ядерщик"
 CHI_nuke_general_desc: "Генерал Цин Ши Тао является ведущим экспертом Народно-освободительной армии Китая (НОАК) в области ядерной и радиологической войны. Он выступает за интеграцию тактического ядерного потенциала непосредственно в операции с применением обычных вооружений — эта доктрина вызывает как уважение, так и споры в Генеральном штабе."
 CHI_special_weapons_general: "Командир спецвооружений"
 CHI_special_weapons_general_desc: "Генерал Леанг — один из самых универсальных высокопоставленных командиров НОАК, сочетающий в себе знания в области современных систем вооружения с доктриной применения обычной артиллерии. Считающаяся вундеркиндом в Генеральном штабе, она известна своим умением интегрировать передовые технологии в операции с применением всех родов войск."
 CHI_tank_general: "Танковый генерал"
 CHI_tank_general_desc: "Генерал Квай входит в число ведущих командиров бронетанковых войск НОАК; он известен своим активным использованием формирований тяжёлых танков и убеждением, что подавляющая огневая мощь решает исход сражений ещё до того, как противник успевает отреагировать."
 CHI_two_centenary_supreme_commander: "Верховный главнокомандующий новой эпохи"
 CHI_wolf_warrior_spirit: "Дух «воинов-волков»"
 CHI_wolf_warrior_spirit_desc: "Наши дипломаты решительно отстаивают национальные интересы и оспаривают западные нарративы на мировой арене."
 CHI_xi_abolishes_limits: "Верховный лидер"
 CHI_xi_peoples_champion: "Защитник народа"
 CHI_zeng_succession_architect: "Архитектор преемственности"
 chinese_aligned: "Прокитайский"
 chinese_aligned_desc: "Этот офицер поддерживает неформальные контакты с китайскими спецслужбами. Координация при совместном планировании происходит естественным образом, хотя лояльность государству не гарантирована."
 CHI_bri_completed_projects: "Завершённые проекты ОПОП"
 CHI_bri_completed_projects_desc: "Общее количество проектов в рамках инициативы «Один пояс и один путь», которые вышли на этап полноценного функционирования."
 CHI_bri_completed_projects_tt: "$CHI_bri_completed_projects$: $RIGHT|+=1$"
 CHI_bri_global_presence: "Глобальное присутствие ОПОП"
 CHI_bri_global_presence_desc: "Совокупный показатель масштабов присутствия китайской инициативы «Один пояс и один путь» во всем мире, формирующийся по мере завершения партнёрскими странами проектов и их продвижения по рейтингу партнёров. Он постоянно усиливает национальный дух «Глобальное присутствие „Пояса и пути“» и открывает доступ к последующим фокусам инициативы «Один пояс и один путь»."
 CHI_bri_global_presence_tt: "$CHI_bri_global_presence$: $RIGHT|+=1$"
 CHI_bri_industrial_zones: "Построенные промышленные зоны ОПОП"
 CHI_bri_industrial_zones_desc: "Общее количество особых экономических зон и промышленных парков, построенных в рамках инициативы «Один пояс и один путь»."
