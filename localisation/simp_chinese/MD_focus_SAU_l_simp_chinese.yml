 SAU_events.310.d: "国内自力更生"
 SAU_events.310.desc: "沙漠风暴行动让所有观战军队都相形见绌。沙特皇家陆军与联军伙伴并肩作战表现尚可——但总参谋部深知真相：若无美国空中力量、后勤与指挥，王国军队尚未做好准备。\n\n军演结束，结论已然明了。如今王国必须选择重建武装力量的模式。每条路径道路都会让我们在某方面更强，在另一方面更弱——没有毫无代价的选择。\n\n§Y悬停于每个选项上查看其具体收益与代价。§!"
