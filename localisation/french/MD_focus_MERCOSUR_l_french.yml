 mercosur.28.t: "Adhésion terminée"
 mercosur.28.d: "Le long processus d'adhésion de [FROM.GetName] est allé à son terme. Après négociations, ajustements institutionnels et une démonstration constante d'engagement, plus d'ambiguïté : ils se tiennent désormais dans le MERCOSUR comme membre à part entière."
 mercosur.28.a: "Un nouveau membre rejoint."
 mercosur.29.t: "Adhésion formalisée"
 mercosur.29.d: "Le chemin tracé avec [FROM.GetName] a enfin atteint sa conclusion. Ce qui commença comme une cour prudente s'achève par une admission pleine, et notre place dans le MERCOSUR est désormais formelle plutôt que provisoire."
 mercosur.29.a: "Nous rejoignons le bloc."
 mercosur.30.t: "Annonce du sommet sud-américain"
 mercosur.30.d: "Un nouveau Sommet sud-américain a été annoncé comme premier pas vers une coopération régionale renouvelée. Les organisateurs ont déclaré que le MERCOSUR doit être revitalisé, la coordination économique renforcée, et le continent doté d'une voix collective plus forte. Les partisans saluent un retour longtemps attendu à l'ambition régionale ; les critiques se demandent si l'Amérique du Sud peut dépasser le symbolisme vers une intégration durable."
 mercosur.30.a: "Un nouveau chapitre régional commence."
 mercosur.31.t: "[FROM.GetName] rejoint le MERCOSUR en tant que membre associé"
 mercosur.31.d: "[FROM.GetName] a convenu de rejoindre le MERCOSUR comme membre associé, marquant une nouvelle étape dans le renouveau de la coopération régionale sud-américaine. Le statut d'associé n'est pas l'adhésion pleine, mais ouvre la porte à des liens commerciaux plus étroits, à la coordination politique et à de futurs pourparlers d'adhésion. Les partisans y voient le signe que le MERCOSUR redevient une force régionale sérieuse."
 mercosur.31.a: "Le bloc grandit."
 mercosur.32.t: "[FROM.GetName] devient membre à part entière du MERCOSUR"
 mercosur.32.d: "[FROM.GetName] est entré au MERCOSUR comme membre à part entière. Ce qui commença comme diplomatie régionale est devenu une expansion tangible du bloc lui-même, approfondissant son poids économique et sa pertinence politique en Amérique latine. Pour les partisans de l'intégration, c'est plus qu'un succès diplomatique. C'est la preuve que le MERCOSUR peut encore façonner l'avenir du continent."
 mercosur.32.a: "Un nouveau membre, un bloc plus fort."
 BRA_unasul: "UNASUR"
 BRA_unasul_desc: "Nous avons besoin d'alliés ! Ne devrions-nous pas demander à d'autres pays d'Amérique du Sud de nous rejoindre pour former une alliance plus forte ?"
 MER_expansion_unasul: "Développer UNASUL"
 MER_expansion_unasul_desc: "Si l'UNASUL doit devenir un vrai cadre continental, elle doit élargir la participation tout en préservant l'élan politique. En attirant davantage d'États dans le projet, nous pouvons renforcer sa légitimité comme institution commune de l'Amérique du Sud."
 MER_sa_corridor_development: "Développement des corridors sud-américains"
 MER_sa_corridor_development_desc: "L'intégration continentale ne peut vivre de déclarations seules. Routes, ports, chemins de fer, télécommunications et corridors intérieurs doivent être reliés pour que le mouvement et le commerce transfrontaliers deviennent réels plutôt que rhétoriques."
 MER_counter_cartel: "Coopération anti-cartel"
 MER_counter_cartel_desc: "Trafic de drogue, contrebande d'armes et organisations criminelles transnationales menacent la stabilité sud-américaine comme l'intégration régionale. Nous devons renforcer le partage de renseignement et l'action conjointe face à des menaces qui ne respectent pas les frontières."
 MER_sa_energy_council: "Conseil sud-américain de l'énergie"
 MER_sa_energy_council_desc: "Avec le pétrole, le gaz, l'hydroélectricité et de vastes réseaux de transport, l'Amérique du Sud a un grand potentiel de coopération énergétique. Plutôt que d'en faire des points de rivalité, nous devrions rechercher stabilité régionale et complémentarité."
 MER_sa_health_council: "Conseil sud-américain de la santé"
 MER_sa_health_council_desc: "La coopération sanitaire est moins spectaculaire que la géopolitique, mais c'est l'un des champs les plus pratiques et efficaces de l'intégration sud-américaine. En coordonnant surveillance, médicaments et personnel de santé, nous pouvons démontrer l'intégration dans la vie quotidienne."
 MER_productive_integration_and_sme_networks: "Intégration productive et réseaux de PME"
 MER_productive_integration_and_sme_networks_desc: "L'intégration régionale ne doit pas rester confinée aux grandes entreprises et aux exportations de matières premières. En encourageant les PME, les chaînes d'approvisionnement régionales et les complémentarités productives, nous pouvons donner au projet une base économique plus concrète."
 MER_sa_defense_council: "Conseil sud-américain de la défense"
 MER_sa_defense_council_desc: "La sécurité sud-américaine ne doit pas dépendre seulement de cadres extérieurs. Avant toute grande ambition militaire, la région doit bâtir des habitudes de dialogue, de transparence et de gestion coordonnée des crises en matière de défense."
 MER_sa_network_for_science_and_innovation: "Réseau d'innovation sud-américain"
 MER_sa_network_for_science_and_innovation_desc: "Si l'intégration doit servir l'avenir, l'Amérique du Sud doit relier non seulement marchés et ressources, mais aussi savoir et innovation. La coopération scientifique peut renforcer le développement autonome du continent."
 MER_unasul_factions: "Organisation de défense conjointe de l'UNASUL"
 MER_unasul_factions_desc: "Le temps est venu de faire passer l'unité sud-américaine au-delà de la seule coopération politique. Pour sauvegarder la sécurité régionale et répondre collectivement aux pressions et déstabilisations extérieures, nous institutionnaliserons la coopération de défense sous l'UNASUL et bâtirons une nouvelle organisation de défense conjointe liant les nations d'Amérique du Sud."
 unasul_member_state_modifier: "État membre de l'UNASUL"
 unasul_member_state_modifier_desc: "L'UNASUL est reconstruite comme cadre continental de coordination politique, de développement et d'action commune en Amérique du Sud. Ses bénéfices croissent à mesure que davantage de membres adhèrent et que de nouveaux conseils et programmes approfondissent la portée de l'organisation.\n\n§YCet esprit national se renforce à mesure que le nombre d'États membres de l'UNASUL augmente.§!"
 MER_unasul_integrated_corridor_plan_modifier: "Plan de corridors intégrés de l'UNASUL"
 MER_unasul_integrated_corridor_plan_modifier_desc: "L'UNASUL a lancé une ronde coordonnée d'investissement dans les routes, la logistique et les liaisons numériques à travers l'Amérique du Sud. Pour l'heure, les États membres construisent infrastructure de transport et de réseau plus vite que d'habitude."
 MER_unasul_energy_security_modifier: "Initiative de sécurité énergétique de l'UNASUL"
 MER_unasul_energy_security_modifier_desc: "L'UNASUL a engagé des ressources à l'échelle du bloc pour la résilience énergétique. Les États membres accélèrent actuellement la construction d'énergie fossile, nucléaire et renouvelable sous un programme régional commun."
 MER_unasul_joint_exercises_modifier: "Exercices conjoints UNASUL"
 MER_unasul_joint_exercises_modifier_desc: "Les forces armées de l'UNASUL sont actuellement engagées dans une ronde coordonnée d'exercices conjoints, d'échanges d'état-major et de planification d'interopérabilité."
 MER_invite_to_unasul: "Inviter [FROM.GetName] à l'UNASUL"
 MER_invite_to_unasul_desc: "Ouvrir des pourparlers formels avec [FROM.GetName] pour rejoindre l'UNASUL. Le taux d'acceptation dépend de l'opinion de ce pays à notre égard, de notre influence sur lui et des progrès de l'arbre UNASUL."
 MER_unasul_integrated_corridor_plan: "Lancer le plan de corridors intégrés"
 MER_unasul_integrated_corridor_plan_desc: "Dépenser des ressources du Trésor pour accélérer la construction de transport et de réseaux chez tous les membres actuels de l'UNASUL pendant 180 jours."
 MER_unasul_counter_cartel_operation: "Lancer l'opération de l'Alliance anti-cartels"
 MER_unasul_counter_cartel_operation_desc: "Appeler chaque membre de l'UNASUL souffrant de l'influence des cartels à contribuer du capital politique à une opération anti-cartels coordonnée. L'impact final dépend du nombre d'États qui s'engagent pleinement."
 MER_unasul_counter_cartel_operation_tt: "Chaque membre de l'UNASUL affecté par l'influence des cartels sera prié d'engager du capital politique dans l'opération. Le résultat final dépend de la force avec laquelle les gouvernements participants soutiennent la répression."
 MER_unasul_energy_security_reinforcement: "Renforcer la sécurité énergétique sud-américaine"
 MER_unasul_energy_security_reinforcement_desc: "Dépenser des ressources du Trésor pour accélérer la construction d'énergie fossile, nucléaire et renouvelable chez tous les membres actuels de l'UNASUL pendant 180 jours."
 MER_unasul_joint_health_improvement_project: "Lancer le projet conjoint d'amélioration sanitaire de l'UNASUL"
 MER_unasul_joint_health_improvement_project_desc: "Lancer un projet de coordination sanitaire de 180 jours. À son terme, l'UNASUL gagne une hausse permanente de la croissance mensuelle de la population. Cela peut être achevé jusqu'à quatre fois.\n\n§YPar cette ligne de projets, la croissance mensuelle de la population de l'UNASUL peut atteindre jusqu'à +10 % au total.§!"
 MER_unasul_supply_chain_strengthening: "Renforcer les chaînes d’approvisionnement sud-américaines"
 MER_unasul_supply_chain_strengthening_desc: "Lancer un projet de coordination des chaînes d'approvisionnement de 180 jours. À son terme, l'UNASUL gagne une hausse permanente de la productivité de l'industrie civile. Cela peut être achevé jusqu'à quatre fois.\n\n§YPar cette ligne de projets, la productivité de l'industrie civile de l'UNASUL peut atteindre jusqu'à +15 % au total.§!"
 MER_unasul_joint_exercises: "Lancement des exercices conjoints de l'UNASUL"
 MER_unasul_joint_exercises_desc: "Financer une ronde de 180 jours d'exercices conjoints de l'UNASUL, améliorant le gain quotidien d'expérience terrestre, navale et aérienne dans le bloc."
 MER_unasul_joint_research_exchange_project: "Lancer le projet conjoint de recherche et d'échanges technologiques de l'UNASUL"
 MER_unasul_joint_research_exchange_project_desc: "Lancer un programme de coordination de la recherche de 180 jours. À son terme, l'UNASUL gagne une hausse permanente de la vitesse de recherche. Cela peut être achevé jusqu'à quatre fois.\n\n§YPar cette ligne de projets, la vitesse de recherche de l'UNASUL peut atteindre jusqu'à +10 % au total.§!"
 mercosur.35.t: "Invitation à rejoindre l'UNASUL"
 mercosur.35.d: "[FROM.GetName] nous a invités à rejoindre l'UNASUL, la présentant comme le toit politique sous lequel l'Amérique du Sud pourrait à nouveau apprendre à agir ensemble. Accepter nous placerait dans un projet qui promet dialogue, coordination et ambition continentale, mais demande aussi si nous sommes prêts à nous lier à une vision régionale plus large."
 mercosur.35.a: "Rejoignez l'UNASUL."
 mercosur.35.b: "Refuser pour l'instant."
 mercosur.36.t: "Invitation UNASUL envoyée"
 mercosur.36.d: "Des pourparlers diplomatiques ont été ouverts avec [FROM.GetName] sur l'entrée à l'UNASUL. L'invitation a été envoyée, le dossier plaidé, et nous attendons de voir si une autre capitale est prête à parier sur le retour du concert sud-américain."
 mercosur.36.a: "Continuez."
 mercosur.37.t: "Invitation UNASUL acceptée"
 mercosur.37.d: "[FROM.GetName] a accepté notre invitation et est entré à l'UNASUL. Ce qui n'était récemment qu'une idée de discours et de communiqués commence à prendre la forme d'une institution continentale réelle."
 mercosur.37.a: "Excellent."
 mercosur.38.t: "Invitation UNASUL rejetée"
 mercosur.38.d: "[FROM.GetName] a décliné pour l'instant notre invitation à rejoindre l'UNASUL. Le rêve d'un cadre sud-américain plus large n'a pas été rejeté net, mais n'a pas encore gagné leur confiance."
 mercosur.38.a: "Nous réessaierons plus tard."
 mercosur.39.t: "Adhésion à l'UNASUL acceptée"
 mercosur.39.d: "Nous avons accepté l'invitation de [FROM.GetName] et rejoint l'UNASUL. Quel que soit l'avenir incertain de l'intégration sud-américaine, nous avons choisi de ne pas le regarder depuis la touche."
 mercosur.39.a: "Une Amérique du Sud plus large."
 mercosur.40.t: "[FROM.GetName] rejoint l'UNASUL"
 mercosur.40.d: "[FROM.GetName] a rejoint l'UNASUL, ajoutant une autre voix, une autre bureaucratie et une autre ambition nationale au cadre sud-américain naissant. À chaque adhésion, le projet devient plus dur à écarter comme nostalgie et plus facile à imaginer comme fait politique durable."
 mercosur.40.a: "Le continent continue de s'aligner."
 mercosur.50.t: "Plan de corridors intégrés activé"
 mercosur.50.d: "Le plan de corridors intégrés de l'UNASUL est passé des tables de conférence aux cartes d'arpentage et aux plans de terrain. À travers le continent, ministères, ingénieurs et planificateurs tentent désormais de transformer le langage de l'intégration en routes, liaisons et corridors que les États peuvent réellement sentir."
 mercosur.50.a: "Continuez à construire."
 mercosur.51.t: "Projet sanitaire conjoint lancé"
 mercosur.51.d: "Une nouvelle initiative sanitaire conjointe a commencé sous le cadre de l'UNASUL. Les responsables parlent d'achats partagés, de réponses communes et d'une meilleure coordination, mais sous le langage administratif se cache une ambition plus large : faire sentir l'intégration régionale dans les cliniques, les pharmacies et la vie quotidienne."
 mercosur.51.a: "Pour un continent plus sain."
 mercosur.52.t: "Projet sanitaire conjoint achevé"
 mercosur.52.d: "La dernière initiative sanitaire conjointe s'est achevée, et ses pratiques les plus réussies sont désormais intégrées à la machinerie permanente de l'UNASUL. Ce qui commença comme un effort temporaire s'installe en habitude, donnant à l'organisation un visage plus humain et plus tangible."
 mercosur.52.a: "Un gain durable."
 mercosur.53.t: "Initiative de sécurité énergétique activée"
 mercosur.53.d: "L'UNASUL a lancé une poussée continentale sur la sécurité énergétique. Planificateurs, responsables de services publics et ministres travaillent soudain à partir de la même carte régionale, pour que l'abondance de l'Amérique du Sud devienne source de stabilité plutôt que de rivalité."
 mercosur.53.a: "Alimenter le continent."
 mercosur.54.t: "Initiative des chaînes d'approvisionnement lancée"
 mercosur.54.d: "Une nouvelle initiative de l'UNASUL sur les chaînes d'approvisionnement a commencé. Gouvernements, chambres de commerce et agences techniques tentent désormais le travail difficile de faire s'emboîter la production sud-américaine plutôt que de simplement coexister."
 mercosur.54.a: "Intégrer le marché."
 mercosur.55.t: "Initiative des chaînes d'approvisionnement achevée"
 mercosur.55.d: "La dernière initiative de chaînes d'approvisionnement de l'UNASUL a été achevée. Ses leçons pratiques, relations commerciales et habitudes administratives ne sont plus des expériences temporaires ; elles deviennent partie de l'architecture économique permanente de la région."
 mercosur.55.a: "Une base productive plus solide."
 mercosur.56.t: "Exercices conjoints en cours"
 mercosur.56.d: "Les exercices conjoints de l'UNASUL sont en cours. Des officiers qui ne se connaissaient que par le protocole se rencontrent sur le terrain, échangent des méthodes, testent des hypothèses et apprennent ce à quoi ressemble la coordination régionale quand on lui demande de fonctionner en pratique."
 mercosur.56.a: "Améliorer la préparation."
 mercosur.57.t: "Projet d'échange de recherche lancé"
 mercosur.57.d: "Un nouvel effort d'échanges de recherche et de technologie de l'UNASUL a commencé. Universités, instituts et agences techniques d'Amérique du Sud sont tirés dans la même conversation, avec l'espoir que la région échange des idées aussi sérieusement que des biens."
 mercosur.57.a: "Partager le savoir."
 mercosur.58.t: "Projet d'échange de recherche achevé"
 mercosur.58.d: "Le dernier effort d'échanges de recherche et de technologie s'est achevé. Les partenariats qu'il a créés ont survécu au projet lui-même, laissant un réseau de contacts plus dense et un sentiment plus fort que le savoir sud-américain peut être organisé plutôt que seulement dispersé."
 mercosur.58.a: "La connaissance perdure."
 mercosur.60.t: "Financer l'opération anti-cartels"
 mercosur.60.d: "L'UNASUL a lancé une opération coordonnée contre l'influence des cartels. La question n'est pas de savoir si la menace est réelle, mais quelle part de notre propre poids politique nous sommes prêts à placer derrière une réponse régionale."
 mercosur.60.a: "Autoriser une contribution interinstitutionnelle limitée."
 mercosur.60.b: "Jeter tout le poids de l'État derrière l'opération."
 mercosur.61.t: "Intensification des opérations de lutte contre les cartels"
 mercosur.61.d: "Une majorité des gouvernements de l'UNASUL participants a choisi de s'engager pleinement. Le résultat n'a pas été un simple geste, mais un coup régional net contre les réseaux de cartels, leurs parrains et le climat de peur qui les laisse durer."
 mercosur.61.a: "Presser l'avantage."
 mercosur.62.t: "Opération anti-cartel terminée"
 mercosur.62.d: "L'opération a avancé avec un soutien plus mesuré. Même ainsi, la pression coordonnée a déstabilisé les réseaux de cartels et réduit leur marge de manœuvre, sans toutefois la force qu'une réponse plus unie aurait portée."
 mercosur.62.a: "Une étape utile."
 mercosur.75.t: "Invitation à rejoindre le pacte de défense de l'UNASUL"
 mercosur.75.d: "[FROM.GetName] nous a invités dans le cadre de défense de l'UNASUL. Accepter, ce n'est pas seulement signer un autre document : c'est nous placer dans une entente militaire destinée à dire aux voisins comme aux outsiders que l'Amérique du Sud entend tenir ensemble quand la pression monte."
 mercosur.75.a: "Rejoindre le pacte de défense."
 mercosur.75.b: "Refus."
 mercosur.76.t: "Invitation au pacte de défense acceptée"
 mercosur.76.d: "[FROM.GetName] a accepté notre invitation et est entré dans le pacte de défense de l'UNASUL. L'alliance est encore jeune, mais chaque nouvelle signature lui donne plus de crédibilité, plus de poids et plus de sens au-delà de la rhétorique."
 mercosur.76.a: "L'alliance grandit."
 mercosur.77.t: "Invitation au pacte de défense rejetée"
 mercosur.77.d: "[FROM.GetName] a décliné pour l'instant d'entrer dans le pacte de défense de l'UNASUL. Malgré le langage de solidarité régionale, tous les gouvernements ne sont pas prêts à laisser la politique de défense devenir partie d'une histoire sud-américaine partagée."
 mercosur.77.a: "Dommage."
 mercosur.78.t: "Nous rejoignons le pacte de défense de l'UNASUL"
 mercosur.78.d: "Nous avons accepté l'invitation de [FROM.GetName] et sommes entrés dans le pacte de défense de l'UNASUL. Ce faisant, nous avons lié plus étroitement notre sécurité à un cadre continental qui vise à transformer l'affinité politique en engagement stratégique."
 mercosur.78.a: "L’Amérique du Sud est solidaire."
 mercosur.79.t: "Alignement tarifaire terminé"
 mercosur.79.d: "Des semaines de négociations, de revue juridique et de travail tarifaire avec un membre prospectif se sont achevées. Le processus était technique en surface, mais politiquement il importait pour une raison simple : une barrière de plus entre leur marché et le nôtre est devenue plus facile à imaginer comme temporaire."
 mercosur.80.t: "Modernisation douanière achevée"
 mercosur.80.d: "L'effort de réforme douanière pour un membre prospectif a été achevé. Les procédures ont été clarifiées, les routines frontalières resserrées, et la posture administrative de l'État rapprochée de ce qu'exige une entrée pleine au MERCOSUR."
 mercosur.81.t: "Normes communes adoptées"
 mercosur.81.d: "Le paquet de normes communes pour un membre prospectif a été mené à son terme. Des règles qui reflétaient jadis la distance se réécrivent dans le langage de la compatibilité, et leur chemin vers le bloc paraît de plus en plus réel."
 mercosur.82.t: "Projet de corridor logistique terminé"
 mercosur.82.d: "Le projet de corridor logistique pour un membre prospectif a atteint son achèvement. Ce qui se discutait en termes abstraits prend forme en routes, dépôts et liaisons pratiques qui rendent l'adhésion concrète plutôt que cérémonielle."
 mercosur.83.t: "Améliorations des transports terminées"
 mercosur.83.d: "Les derniers travaux de transport liés au paquet d'adhésion d'un membre prospectif ont été achevés. La distance n'a pas disparu, mais la carte paraît un peu plus petite et la perspective d'intégration un peu moins théorique."
 mercosur.84.t: "Programme de connectivité achevé"
 mercosur.84.d: "Le plus récent programme de connectivité pour un membre prospectif a été achevé. Trafic commercial, contact administratif et coordination transfrontalière ont désormais des canaux plus fermes pour circuler."
 mercosur.85.t: "Fonds de développement décaissés"
 mercosur.85.d: "Le paquet de développement pour un membre prospectif a été pleinement livré. Plus que tout communiqué, un engagement visible de cette échelle dit à leur gouvernement que le MERCOSUR est prêt à investir dans l'appartenance plutôt que de simplement demander la confiance."
 mercosur.86.t: "Investissement civil achevé"
 mercosur.86.d: "La phase d'investissement civil du paquet d'adhésion d'un membre prospectif a été achevée. Ateliers, entreprises et quartiers commerciaux ont désormais une raison plus claire de voir l'intégration régionale comme quelque chose de concret, pas seulement diplomatique."
 mercosur.87.t: "Modernisation des infrastructures achevée"
 mercosur.87.d: "Le programme d'amélioration d'infrastructure pour un membre prospectif s'est conclu. Chaque projet achevé laisse le même message politique : l'adhésion n'est pas seulement une signature, mais une réorientation de la façon dont le pays est relié à la région."
 mercosur.88.t: "Infrastructures commerciales étendues"
 mercosur.88.d: "Le projet d'infrastructure commerciale pour un membre prospectif a été achevé. La promesse du MERCOSUR apparaît désormais non seulement dans les discours, mais dans des corridors plus animés, de meilleures installations et un sens plus clair d'interdépendance."
 mercosur.89.t: "Accord d'investissement industriel adopté"
 mercosur.89.d: "L'accord d'investissement industriel avec un membre prospectif est entré en vigueur. Ce qui était une entente diplomatique devient une relation économique avec de la profondeur, des attentes et des intérêts assez puissants pour survivre à la cérémonie."
 mercosur.90.t: "Cadre d'investissement commercial établi"
 mercosur.90.d: "Le cadre d'investissement commercial avec un membre prospectif a été établi. Banques, entreprises et ministères ont désormais un pont plus solide, et avec lui une plus forte incitation à traiter l'adhésion comme un pari partagé plutôt qu'un geste symbolique."
 mercosur.91.t: "Paquet de coopération financière livré"
 mercosur.91.d: "Le paquet de coopération financière pour un membre prospectif a été livré. Avec cette dernière pièce en place, l'effort d'adhésion n'a plus l'air provisoire ; on sent un pays tiré progressivement vers le cercle intérieur du bloc."
 mercosur.108.t: "Vague du Fonds de développement du MERCOSUR lancée"
 mercosur.108.d: "Une nouvelle ronde du Fonds de développement du MERCOSUR a été mise en mouvement. Ministères, entreprises et autorités locales du bloc y liront plus qu'une écriture comptable : la preuve que l'intégration porte encore de l'argent, de la planification et une volonté institutionnelle. Une fois de plus, la promesse de développement passe du papier au terrain."
 mercosur.108.a: "Que les fonds commencent à circuler."
 mercosur.accession_project_complete.a: "Continuez."
 mercosur.93.t: "Adhésion complète acceptée"
 mercosur.93.d: "[FROM.GetName] a accepté notre offre et est entré au MERCOSUR d'emblée comme membre à part entière. Pas de longue transition, pas de cour soigneusement étagée : seulement le fait politique soudain d'un bloc plus large dès aujourd'hui."
 mercosur.93.a: "Excellent."
 mercosur.94.t: "Nous rejoignons le MERCOSUR"
 mercosur.94.d: "Notre cap est fixé, et le MERCOSUR n'est plus un forum hors de notre portée mais une structure que nous habitons de l'intérieur. L'ancienne ambiguïté sur notre place dans l'ordre régional cède à un fait plus dur : nous sommes dans le bloc, et le continent devra s'ajuster à cette réalité."
 mercosur.94.a: "Nous rejoignons le bloc."
 mercosur.105.t: "Statut d'associé accordé"
 mercosur.105.d: "Notre pétition nous a portés dans le MERCOSUR comme État associé. Ce n'est pas encore la chambre la plus intérieure du bloc, mais c'est assez pour montrer que notre horizon politique et économique penche désormais vers l'intégration sud-américaine plutôt qu'à l'écart."
 mercosur.105.a: "Nous nous rapprochons."
 mercosur.107.t: "Pétition UNASUL approuvée"
 mercosur.107.d: "Notre pétition nous a portés dans l'UNASUL. Quel que soit l'avenir incertain de l'intégration sud-américaine, nous avons choisi de ne pas regarder l'expérience de loin, mais d'y entrer et de prendre place dans le cadre en construction."
 mercosur.107.a: "Nous rejoignons le projet."
 mercosur_news.1.t: "L'établissement de l'UNASUL"
 mercosur_news.1.d: "Les nations d'Amérique du Sud ont annoncé l'établissement de l'UNASUL comme organisation régionale permanente destinée à unir dialogue politique, développement d'infrastructure et coopération sociale sous un seul cadre. Par cette étape, l'unité sud-américaine entre dans une nouvelle phase, et la coordination régionale peut devenir plus institutionnelle et durable. Mais le succès du projet dépendra de la capacité de ses membres à surmonter leurs intérêts nationaux divergents."
 mercosur_news.1.a: "Une nouvelle étape pour l'Amérique du Sud"
 mercosur_news.2.t: "L'UNASUL forme un pacte de défense conjoint"
 mercosur_news.2.d: "L'UNASUL a dépassé la coordination économique et politique et annoncé la formation d'un nouveau pacte de défense sud-américain. Les partisans le présentent comme un prolongement naturel de l'unité régionale ; les sceptiques avertissent que le continent entre dans une phase plus assertive et potentiellement divisante de politique de blocs."
 mercosur_news.2.a: "L’Amérique du Sud resserre les rangs."
 mercosur_news.3.t: "Un membre se retire de l'UNASUL"
 mercosur_news.3.d: "[ROOT.GetNameWithFlag] a annoncé son départ du Mécanisme de défense conjoint de l'UNASUL, rouvrant des doutes que beaucoup croyaient scellés quand l'Amérique du Sud a d'abord tracé ensemble ses lignes défensives. Les partisans du retrait y voient un retour à la liberté d'action souveraine ; les critiques, la première fissure visible d'un pacte qui dépendait autant de la confiance politique que des signatures. Isolé ou début d'un plus large délitement : le continent regardera."
 mercosur_news.3.a: "Le pacte n'a plus l'air incassable."
 UNASUL_faction: "UNASUR"
 UNASUL_faction_DEF: "le Pacte de défense de l'UNASUL"
 MER_invite_to_unasul_TT: "§YLe taux d'acceptation dépend de l'opinion de ce pays à votre égard, de votre influence sur lui et des progrès de l'arbre UNASUL !§!"
 MER_request_mercosur_associate_membership_tt: "§YSoumettre une pétition formelle. À la fin de la période d'examen, nous rejoindrons le MERCOSUR comme État associé.§!"
 MER_request_mercosur_full_membership_tt: "§YSoumettre une pétition formelle. À la fin de la période d'examen, nous entrerons au MERCOSUR comme membre à part entière.§!"
 MER_request_unasul_membership_tt: "§YSoumettre une pétition formelle. À la fin de la période d'examen, nous rejoindrons l'UNASUL.§!"
 MER_unasul_member_tt: "Appliquer les modificateurs suivants à §YÉtat membre de l'UNASUL§! pour tous les pays membres."
 BRA_unasul_events_TT: "§YEnvoyer des invitations à tous les États membres du MERCOSUR pour rejoindre l'UNASUL !§!"
 MER_expansion_unasul_TT: "§GDébloque§! des décisions pour inviter les pays d'Amérique du Sud à l'§YUNASUL§! !"
 mercosur.110.t: "Révision de la clause démocratique du MERCOSUR"
 mercosur.110.d: "Ce qui s'est déroulé à [FROM.GetName] ne peut plus être écarté comme affaire intérieure sans autre signification. Un grave tournant politique y a jeté le doute sur le poids encore porté par la compétition ouverte et la retenue constitutionnelle. Dans le bloc, ministres et diplomates se demandent ouvertement si la clause démocratique du MERCOSUR est un engagement sérieux ou un langage cérémoniel. Nous devons décider si [FROM.GetName] doit être suspendu, ou si le bloc tolérera ce tournant pour garder intact le marché sud-américain."
 mercosur.110.a: "La clause doit être appliquée."
 mercosur.110.b: "Accordez-vous un dernier sursis."
 mercosur.112.t: "Le MERCOSUR suspend notre statut"
 mercosur.112.d: "Le verdict du bloc est arrivé, et il est sans équivoque. Le MERCOSUR a jugé que notre dernier cap a franchi la ligne de sa clause démocratique, et le prix se paie désormais dans notre place au sein de l'institution. L'Amérique du Sud ne nous a pas tourné le dos pour toujours, mais elle a choisi de marquer ce moment comme ne pouvant rester sans réponse."
 mercosur.112.a: "Les conséquences sont réelles."
 mercosur.113.t: "Le MERCOSUR accorde un sursis conditionnel"
 mercosur.113.d: "Le MERCOSUR a choisi de ne pas nous suspendre d'emblée, mais n'a pas non plus offert l'absolution. Nous restons dans le bloc sous un nuage visible de méfiance, et chaque capitale de la région comprendra que notre place continue dans le marché sud-américain repose désormais sur la probation plutôt que sur la confiance."
 mercosur.113.a: "Nous restons sous surveillance."
 mercosur.114.t: "Le MERCOSUR suspend un membre"
 mercosur.114.d: "Après un grave tournant politique à [FROM.GetName], le débat au sein du MERCOSUR s'est achevé par une décision dure. Le bloc a invoqué sa clause démocratique et suspendu le statut de [FROM.GetName], signalant que le marché sud-américain est encore prêt à défendre les termes politiques sur lesquels il prétend reposer."
 mercosur.114.a: "Le bloc trace une ligne."
 mercosur.115.t: "Le MERCOSUR laisse la porte entrouverte"
 mercosur.115.d: "Après un sérieux glissement politique à [FROM.GetName], le MERCOSUR s'est arrêté avant la suspension, mais la décision n'était pas un aval. Le bloc a choisi de préserver l'unité pour l'instant tout en plaçant [FROM.GetName] sous un avertissement visible, assurant que la question de la légitimité démocratique continuera d'assombrir sa place dans l'institution."
 mercosur.115.a: "Un sursis serré."
 mercosur.117.t: "Révision de la clause démocratique de l'UNASUL"
 mercosur.117.d: "Les derniers développements à [FROM.GetName] se sont répandus bien au-delà d'une querelle intérieure. Un grave tournant politique y a soulevé des doutes sur tout le continent : la vie démocratique de ce pays est-elle rétrécie par la force ou par dessein. À l'UNASUL, la question est désormais de savoir si l'organisation a été bâtie pour défendre les engagements démocratiques ou seulement pour en parler quand c'est commode. Nous devons choisir si [FROM.GetName] doit être suspendu du cadre sud-américain, ou si le projet est mieux servi en le gardant dedans sous avertissement."
 mercosur.117.a: "Les suspendre du cadre."
 mercosur.117.b: "Les garder à l'intérieur, mais sous censure."
 mercosur.119.t: "L'UNASUL suspend notre statut"
 mercosur.119.d: "L'UNASUL a rendu son jugement, et le message est de distance plutôt que de solidarité. L'organisation a conclu que notre cap récent ne peut se concilier avec sa clause démocratique, et notre place dans le cadre sud-américain a été suspendue en conséquence. Ce qui devait symboliser la convergence continentale est devenu un rappel que la légitimité régionale a encore des limites."
 mercosur.119.a: "Le coup porte."
 mercosur.120.t: "L'UNASUL nous laisse à l'essai"
 mercosur.120.d: "L'UNASUL a choisi de ne pas nous suspendre d'emblée, mais la décision n'offre guère de réconfort. Nous ne restons dans le cadre que sous une censure visible, et les capitales d'Amérique du Sud liront ce choix comme un avertissement : notre place dans le projet est désormais conditionnelle plutôt que de confiance."
 mercosur.120.a: "Un sursis, pas un acquittement."
 mercosur.121.t: "L'UNASUL suspend un membre"
 mercosur.121.d: "Après examen du grave tournant politique à [FROM.GetName], l'UNASUL a choisi d'invoquer sa clause démocratique et de suspendre le statut de ce pays dans l'organisation. La décision souligne que l'unité sud-américaine revendique encore un fondement politique, et que certaines brèches sont assez graves pour forcer la question au grand jour."
 mercosur.121.a: "Le cadre se durcit."
 mercosur.122.t: "L'UNASUL accorde un sursis"
 mercosur.122.d: "Après un grave tournant politique à [FROM.GetName], l'UNASUL a décidé de ne pas suspendre le pays pour l'instant. Même ainsi, le résultat est loin d'un aval net : l'organisation a choisi l'unité plutôt que la rupture, tout en faisant clair que la place de [FROM.GetName] dans le projet sud-américain restera sous soupçon."
 mercosur.122.a: "L'avertissement tient."
 MER_democratic_clause_warning_tt: "§YSi nous appartenons au MERCOSUR ou à l'UNASUL, ce geste peut déclencher un examen au titre de leurs clauses démocratiques et mettre notre appartenance en danger.§!"
 MER_mercosur_democratic_clause_vote_suspend_tt: "§YVoter pour la suspension.§! Si le camp de la suspension l'emporte, les mesures suivantes seront appliquées :"
 MER_mercosur_democratic_clause_vote_probation_tt: "§YVoter pour les garder dans le MERCOSUR sous avertissement.§! Si le camp du sursis l'emporte, les mesures suivantes seront appliquées :"
 MER_mercosur_democratic_clause_suspension_tt: "§YSuspendre ce pays du MERCOSUR.§! Retirer §YÉtat membre du MERCOSUR§! et réduire la croissance liée aux membres de tous les membres à part entière restants de §G1 % de croissance de la productivité§!, §G1 % de multiplicateur de recettes fiscales§! et §G1 % de multiplicateur d'influence étrangère§!."
 MER_mercosur_democratic_clause_probation_tt: "§YGarder ce pays dans le MERCOSUR sous probation.§! Réduire la stabilité accordée par §YÉtat membre du MERCOSUR§! de §R5 %§! pour tous les membres actuels et futurs du MERCOSUR."
 MER_unasul_democratic_clause_vote_suspend_tt: "§YVoter pour la suspension.§! Si le camp de la suspension l'emporte, les mesures suivantes seront appliquées :"
 MER_unasul_democratic_clause_vote_probation_tt: "§YVoter pour les garder dans l'UNASUL sous avertissement.§! Si le camp du sursis l'emporte, les mesures suivantes seront appliquées :"
 MER_unasul_democratic_clause_suspension_tt: "§YSuspendre ce pays de l'UNASUL.§! Retirer §YÉtat membre de l'UNASUL§!, réduire la croissance liée aux membres de l'UNASUL de §R1 % de gain de pouvoir politique§! et §R1 % de stabilité§!, et retirer le pays du Pacte de défense de l'UNASUL s'il y appartient."
 MER_unasul_democratic_clause_probation_tt: "§YGarder ce pays dans l'UNASUL sous probation.§! Réduire la stabilité accordée par §YÉtat membre de l'UNASUL§! de §R5 %§! pour tous les membres actuels et futurs de l'UNASUL."
 MER_unasul_joint_health_improvement_project_rounds_tt: "Exige moins de §Y4§! rondes achevées du projet conjoint d'amélioration sanitaire"
 MER_unasul_supply_chain_strengthening_rounds_tt: "Requiert moins de §Y4§! cycles achevés de renforcement des chaînes d'approvisionnement"
 MER_unasul_joint_research_exchange_project_rounds_tt: "Exige moins de §Y4§! rondes achevées du projet conjoint de recherche et d'échanges technologiques"