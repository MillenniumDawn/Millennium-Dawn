l_korean:
 BUL_generic_political_effort: "불가리아의 정치"
 BUL_generic_political_effort_desc: "2000년, 불가리아의 정치 지형은 보수당인 민주세력동맹(UDF)이 야당인 불가리아 사회당(BSP)에 패배하면서 극적인 변화를 겪었습니다. 이는 UDF의 8년 집권이 끝나고 BSP의 집권이 시작되었음을 의미했습니다. 새로운 정부는 경제 개혁을 최우선으로 삼고, 국가의 재정 안정을 개선하고 외국인 투자를 유치하는 데 초점을 맞췄습니다. 초기에는 대중의 승인을 받았지만, 개혁은 느리고 논란이 많았습니다."
 BUL_steady: "침로 유지"
 BUL_steady_desc: "불가리아는 1989년 공산주의 붕괴 이후 많은 성과를 이루었으며, 그 중 하나는 민주 정부 수립입니다. 그럼에도 불구하고 최근에는 더 권위주의적인 정부로 돌아가야 한다는 논의가 있었습니다. 그러나 불가리아가 진정으로 경제 성장과 국민의 자유를 받아들이기 위해서는 민주주의를 계속 유지해야 하는 여러 가지 이유가 있습니다."
 BUL_generic_extra_tech_slot: "민영화 증가"
 BUL_generic_extra_tech_slot_desc: "불가리아의 경제는 공산주의 붕괴 이후 성장에 어려움을 겪었으며, 정부는 경제 성장을 증대시키기 위한 방법을 모색해왔습니다. 한 가지 가능한 해결책은 국가 내 재산의 민영화를 증가시키는 것입니다. 민영화는 잠재적으로 효율성을 증가시킬 수 있습니다. 민간 기업은 더 많은 이익을 추구하고 비용 절감을 유도하는 경향이 있기 때문입니다. 이는 외국인 투자를 유치하고 일자리를 창출할 수 있습니다. 또한, 민영화를 늘리면 정부는 더 이상 재산을 유지하고 관리할 필요가 없으므로 재정 부담을 줄일 수 있습니다."
 BUL_generic_extra_tech_slot_3: "의료 개혁"
 BUL_generic_extra_tech_slot_3_desc: "As Bulgaria entered the new millennium, there was a pressing need for healthcare reform. The country's healthcare system was outdated and insufficient, with many hospitals lacking the necessary equipment and staff. Patients often faced lengthy wait times and inadequate care, leading to frustration and dissatisfaction with the system. We need to reform the system and improve the well-being of our people."
 BUL_nato_joining: "NATO 가입"
 BUL_nato_joining_desc: "불가리아의 잠재적인 NATO 가입은 상당한 논쟁의 주제입니다. 한편, NATO에 가입하면 불가리아는 잠재적인 외부 위협에 대한 안보 보장과 보호를 받을 수 있습니다. 또한 군사 훈련 및 지원, 정보 공유, 고급 기술 등 NATO의 광범위한 자원에 접근할 수 있습니다. 또한 NATO 회원국은 불가리아의 국제사회에서의 지위와 위상을 강화할 것입니다."
 BUL_fighting_immigration: "반대파 탄압"
 BUL_fighting_immigration_desc: "Ultimately, the Bulgarian government's actions should effectively silence the opposition and consolidate power in the hands of the ruling party for years to come. While the country has since made progress towards greater democracy and freedom of expression, the events of political chaos should remain a stark reminder of how easily those gains can be reversed."
 BUL_elitism_question: "엘리트주의 질문"
 BUL_elitism_question_desc: "시급한 필요에 따라, 우리는 모든 계층의 사람들이 의료 서비스를 받을 수 있는 조건을 만들기 위해 우리의 의료 시스템의 복지를 개선하려고 노력해야 합니다."
 BUL_sheghen_question: "국경 합의"
 BUL_sheghen_question_desc: "Bulgaria should make significant agreements with the European Union (EU) concerning border regulation and police cooperation. These agreements were crucial in facilitating the country's accession into the EU. Bulgaria recognized the importance of effective border control and management in ensuring peace, security, and stability in the region. As a result, a comprehensive plan was developed and implemented to enhance the country's border management capabilities. This included improving surveillance mechanisms, upgrading infrastructure, and providing advanced training programs for border control personnel."
 BUL_police_chaos_idea: "해산된 경찰"
 BUL_political_opposition: "정치적 반대"
 BUL_political_opposition2: "정치적 반대"
 BUL_political_opposition3: "정치적 반대"
 BUL_armor_effort: "기갑 주력"
 BUL_armor_effort_desc: "우리는 더 강력한 장갑 부대를 추진해야 합니다. 대전차 및 장갑 장비는 충분히 견고하지 않은 모든 것을 제거할 수 있기 때문입니다."
 BUL_special_forces: "특수부대"
 BUL_special_forces_desc: "특수 부대에 투자하면 위급한 시기에 의지할 수 있는 강력한 전투 병력을 얻게 됩니다. 어쨌든 지구상의 모든 주요 군대가 하나씩 가지고 있는데, 불가리아가 다른 나라들보다 못할 이유가 무엇이겠습니까?"
 BUL_aviation_effort: "불가리아 공군"
 BUL_aviation_effort_desc: "우리 군의 세 가지 주요 군종 중 하나인 공군은 하늘을 지키고 적의 방해를 막아 낼 것입니다."
 BUL_fighter_focus: "신형 전투기"
 BUL_fighter_focus_2: "스위스와의 거래"
 BUL_fighter_focus_2_desc: "스위스에 있는 우리 친구들은 좋은 전투기를 가지고 있습니다. 우리 공군을 위해 몇 대를 확보하도록 그들과 거래를 성사시킬 수 있을지도 모릅니다. "
 BUL_fighter_focus_3: "벨라루스의 거절"
 BUL_fighter_focus_3_desc: "Belarus seems to be an emerging power, and they seem to have some Russian Aircraft for sale, maybe we can strike a deal with them?"
 BUL_fighter_focus_4: "헬리콥터 구매"
 BUL_fighter_focus_4_desc: "우리 자체 보유 헬리콥터가 다른 나라에 비해 노후하고 약해지기 시작했으므로 외국에서 헬리콥터를 구입하는 방안을 고려해야 합니다."
 BUL_bomber_focus: "C-27J 스파르탄"
 BUL_bomber_focus_desc: "미국은 지금 우리에게 꼭 필요한 상당히 괜찮은 폭격기를 판매하고 있습니다. 이를 확보하면 우리 공군이 먼 거리에서 적의 진지를 공격할 수 있습니다."
 BUL_aviation_effort_2: "알레니아 항공"
 BUL_aviation_effort_2_desc: "미국의 수송 항공기가 시장에 나와 있으며, 우리는 그것들을 정말 필요로 합니다. 우리의 병력들을 안전하게 수송하려면 고급 수송 기술이 필요합니다."
 BUL_CAS_effort: "대공 방어"
 BUL_CAS_effort_desc: "대공 방어에 투자하면 날아오는 로켓이나 미사일이 격추되므로 우리의 기지와 민간인이 안전해집니다. 이는 불가리아 영공을 침범하려는 모든 항공기에도 마찬가지로 적용됩니다. "
 BUL_rocket_effort: "레이더 방어"
 BUL_rocket_effort_desc: "Radars will show us where an enemy is when they violate our borders. If we want to stay on top of things and be aware of what is happening, we should consider upgrading our radar systems."
 BUL_NAV_effort: "현대 드론"
 BUL_NAV_effort_desc: "드론은 요즘 큰 인기를 끌고 있으며, 우리 병력을 위험에 빠뜨리지 않고 적을 공격할 수 있는 저렴한 방법입니다. 만약 현대적인 드론을 확보할 수 있다면, 적에게 진정으로 걱정거리를 안겨줄 수 있을 것입니다."
 BUL_naval_effort: "불가리아 해군"
 BUL_naval_effort_desc: "불가리아 해군은 최근 몇 년간 붕괴되어 가고 있으며, 적들을 물리치기 위해 해군을 다시 정비해야 합니다."
 BUL_flexible_navy: "벨기에 배들"
 BUL_flexible_navy_desc: "벨기에의 함선 설계도를 구입하여 우리의 조선 지식을 넓힐 수 있을지도 모릅니다. 또한 이를 그들과 가까워지는 수단으로 활용할 수도 있습니다."
 BUL_large_navy: "미국과의 거래"
 BUL_large_navy_desc: "미국은 지구상에서 가장 강력한 해군을 보유하고 있으며, 우리 해군을 발전시키려면 그들의 도움을 받고 거래를 성사시켜야 합니다."
 BUL_submarine_effort: "레바논 접근권"
 BUL_submarine_effort_desc: "레바논 접근권을 얻으면 우리 함선 일부를 남쪽에 주둔시키는 데 유용할 수 있습니다."
 BUL_cruiser_effort: "해군 생산 노력"
 BUL_cruiser_effort_desc: "해군 생산을 늘리면 더 많은 함선을 더 빠르게 내놓을 수 있으니, 어쩌면 기술에 투자하는 것도 나쁘지 않을지 모릅니다..."
 BUL_destroyer_effort: "구축함 노력"
 BUL_destroyer_effort_desc: "구축함은 바다에서 가장 필수적인 함선 중 하나입니다. 불가리아도 바다를 지배하기 위해 구축함을 배치하려는 노력에서 다르지 않을 것입니다."
 BUL_capital_ships_effort: "불가리아 조선소"
 BUL_capital_ships_effort_desc: "함선을 만들려면 조선소가 필요하므로, 더 많은 함선을 바다에 내보내기 위해 해안선에 조선소를 건설하는 방안을 고려해야 합니다."
 BUL_tewfv_fascism_influence: "파시즘 영향력"
 BUL_generic_factory_1: "세제 개혁"
 BUL_generic_factory_1_desc: "세제 개혁을 단행해야 합니다."
 BUL_generic_factory_2: "농민 호소"
 BUL_generic_factory_2_desc: "농민들의 지지를 얻고 우리 부문을 성장시키기 위해 이들에게 호소해야 합니다."
 BUL_generic_factory_3: "러시아 투자"
 BUL_generic_factory_3_desc: "러시아의 투자를 유치해야 합니다."
 BUL_generic_factory_3_6: "협력을 위한 정치적 기반 마련"
 BUL_generic_factory_3_6_desc: "독일과의 정치적 협력을 위한 기반을 마련해야 합니다."
 BUL_generic_factory_3_5: "우리 측의 투자 단행"
 BUL_generic_factory_3_5_desc: "이제 우리가 러시아에 직접 투자해야 합니다."
 BUL_generic_factory_4: "가스 문제 해결"
 BUL_generic_factory_4_desc: "가스 문제를 해결해야 합니다. 러시아가 이를 도울 것입니다."
 BUL_generic_factory_6: "불가리아 인터넷"
 BUL_generic_factory_6_desc: "국민이 만족할 수 있도록 우리나라의 인터넷을 개선해야 합니다."
 BUL_generic_factory_7: "정부 경제 부문"
 BUL_generic_factory_7_desc: "우리나라를 발전시키기 위해 경제의 공공 부문에 투자해야 합니다."
 BUL_generic_resources_1: "최종 이민 대책"
 BUL_generic_resources_1_desc: "이민 문제를 해결해야 합니다. 내각이 이에 대한 좋은 아이디어를 제시할 것이며, 우리는 이를 현실로 만들 것입니다."
 BUL_generic_resources_2: "금속 채굴"
 BUL_generic_resources_2_desc: "철강 산업을 발전시켜야 합니다."
 BUL_generic_resources_4: "마리차 이스토크 2"
 BUL_generic_resources_4_desc: "마리차 이스토크 2는 발칸 반도 최대의 화력 발전소입니다. 스타라자고라에서 60킬로미터 떨어진 라데츠키 마을과 오브차리차 댐 호수 인근에 위치합니다."
 BUL_infrastructure_effort_5: "바르나 화력 발전소"
 BUL_infrastructure_effort_5_desc: "바르나 발전소(ТЕЦ Варна)는 불가리아 바르나에 있는 최소 210메가와트 규모의 가동 중인 발전소로, 여러 기를 갖추고 있으며 그중 일부는 현재 가동되지 않고 있습니다."
 BUL_infrastructure_effort_6: "마리차 이스토크 3"
 BUL_infrastructure_effort_6_desc: "마리차 이스토크 3는 불가리아에서 세 번째로 큰 발전소입니다. 스타라자고라에서 40킬로미터 떨어져 있습니다. 이 발전소의 설비 용량은 900MW이며, 각각 225MW인 4기의 발전 설비에서 생산됩니다. 높이 325미터의 굴뚝을 갖추고 있습니다."
 BUL_generic_resources_5: "유로 투자"
 BUL_generic_resources_6: "루마니아-불가리아 송유관"
 BUL_generic_resources_7: "자원 노력 VII"
 BUL_generic_resources_7_desc: "자원 노력"
 BUL_generic_state_focus: "중앙집권 국가"
 BUL_generic_state_focus_desc: "정부가 깊이 관여하고 사회의 여러 측면을 통제하는 중앙집권 국가는 흔히 질서와 안정을 유지하는 최선의 선택으로 여겨집니다. 이러한 형태의 정부는 효율적인 의사 결정과 정책 및 법률의 신속한 시행을 가능하게 합니다. 또한 자원이 국가 전역에 고르게 분배되도록 보장하여 시민들 사이에 평등 의식을 만들어 냅니다. 게다가 중앙집권 국가는 시민들을 외부 위협으로부터 더 잘 보호하고 강력한 국가 정체성을 유지할 수 있습니다."
 BUL_generic_military_school: "의용군단"
 BUL_generic_military_school_desc: "자유 군사 의용군단은 독립적으로 운영되며 불가리아군과 함께 활동할 것입니다. 불가리아가 역사상 처음으로 의용 군사 집단을 보유하게 되는 것이므로 이는 독특한 사업이 될 것입니다. 정부는 군에 입대하여 조국에 봉사하고자 하는 불가리아 청년들의 관심이 커지고 있음을 이해하고 있습니다."
 BUL_generic_faction_create: "발칸 조약"
 BUL_generic_faction_create_desc: "불가리아의 새 정부는 통합 발칸 조약이라는 새로운 군사 동맹의 결성을 발표했습니다. 이 조약은 발칸 지역의 군사적 역량을 강화하고 회원국 간 협력을 증진하는 것을 목표로 합니다."
 BUL_generic_war_justify: "기반시설 개혁"
 BUL_generic_war_justify_desc: "불가리아의 새 정부는 국가 기반시설 체계의 개혁을 우선시해야 합니다. 수년간 도로는 열악한 상태였고 대중교통은 신뢰할 수 없고 낡았으며 에너지 부문은 현대화가 절실하게 필요한 상황입니다."
 BUL_generic_militar_school: "군사 학교"
 BUL_generic_justify_war_general: "전쟁을 위한 모든 것"
 BUL_generic_ethics_for_war: "정교회 수용"
 BUL_generic_ethics_for_war_desc: "정부는 정교회를 국교로 확립하려 하며, 정교회가 불가리아 문화와 민족 정체성의 불가분의 일부라고 주장하며 자신들의 제안을 옹호하고 있습니다. 정부는 이슬람교와 유대교 같은 다른 종교는 나라에 설 자리가 없다고 주장했습니다. 정교회는 이 결정을 환영했으며 사회에서 교회의 영향력을 강화하기 위해 정부와 긴밀히 협력하겠다고 약속했습니다. 그러나 인권 단체들은 이 조치가 종교와 신념의 자유 같은 기본적 인권을 침해한다며 비판했습니다."
 ethics_for_war_BUL_generic: "전시"
 BUL_generic_civil_factory_idea: "산업의 힘"
 BUL_generic_civil_factory: "산업의 힘"
 BUL_generic_civil_factory_desc: "국민이 잘 살 수 있도록 우리 산업의 모든 힘을 동원해야 합니다."
 BUL_generic_union_country: "하나 된 국가"
 BUL_generic_union_country_desc: "우리는 국가를 하나로 단결시켜야 합니다. 완전히. 이것이 큰 성공을 거두는 유일한 방법입니다."
 BUL_generic_national_unity: "세금 인하"
 BUL_generic_national_unity_desc: "국민이 만족하도록 세금을 줄여야 합니다."
 BUL_generic_political_option: "민주주의 진영"
 BUL_generic_influence_france: "균형 접근"
 BUL_generic_influence_france_desc: "우리는 대외 관계에서 새로운 방법론을 만들고 동서 사이에서 균형 접근을 활용해야 합니다."
 BUL_generic_influence_uk: "투자 장려"
 BUL_generic_influence_uk_desc: "우리나라가 번영하려면 투자에 좋은 환경을 조성해야 합니다."
 BUL_generic_military_exp: "국경 보안"
 BUL_generic_military_exp_desc: "튀르키예와의 국경은 내무부 산하 국경 경찰이 경비합니다. 장벽을 완성하고 검문소에 인력을 배치하면 불법 입국을 막고 외국 기관이 우리 군에 대해 알아낼 수 있는 정보를 제한할 수 있습니다."
 BUL_generic_military_exp_2: "사이버전"
 BUL_generic_military_exp_2_desc: "사이버 부대를 발전시켜야 합니다. 동맹국들로부터 돈과 정보를 훔치기 위해서입니다."
 BUL_generic_military_exp_3: "신형 군복"
 BUL_generic_military_exp_3_desc: "우리 병사들에게는 새 군복이 필요합니다. 현대적이고 편안한 군복이어야 합니다."
 BUL_generic_military_exp_4: "외국 면허"
 BUL_generic_military_exp_4_desc: "미국과 군사 계약을 체결해야 합니다."
 opnion_democratic_influence: "민주주의 영향력"
 BUL_industrial_effort: "불가리아 경제"
 BUL_industrial_effort_desc: "불가리아 경제는 우리의 계획과 국민의 번영에 필수적일 것입니다. 우리 국가의 산업 심장 박동이 다시 뛰게 할 전략을 마련해야 합니다."
 BUL_production_effort: "무장 노력"
 BUL_production_effort_desc: ""
 BUL_generic_factory_5: "석유 비축"
 BUL_construction_effort_5: "교육 개혁"
 BUL_construction_effort_6: "유럽 투자"
 BUL_construction_effort_6_desc: "유럽은 우리 정치·경제 생활의 불가분의 일부입니다. 우리 경제에 대한 투자를 포함하여 유럽과 관계를 맺는 것은 매우 중요합니다."
 BUL_infrastructure_effort_2: "중국 투자"
 BUL_infrastructure_effort_2_desc: "우리는 [CHI.GetNameWithFlag]에 좋은 인맥을 가지고 있으며, 이를 우리의 목적, 주로 우리 경제에 대한 투자를 위해 활용할 수 있습니다."
 BUL_infrastructure_effort_3: "관광 재편"
 BUL_infrastructure_effort_3_desc: "관광 목적으로 우리나라를 방문하는 데 대한 새로운 규정을 도입하여 경제 상황을 개선할 것입니다."
 BUL_technology_sharing: "야당 소탕"
 BUL_technology_sharing_desc: "야당은 우리가 올바른 길을 나아가는 것을 방해합니다. 이제 저명한 야당 인사들을 체포할 때입니다. 또한 모든 반대자에게 입을 열지 않는 편이 낫다는 것을 분명히 알릴 것입니다."
 BUL_generic_extra_tech_slot_2: "정부 개혁"
 BUL_militarism: "군국주의"
 BUL_militarism_desc: "이제 불가리아 국민이 고개를 들고 오랜 숙적을 향해 총검을 겨눌 때입니다. 불가리아는 하나이며 나눌 수 없습니다!"
 BUL_political_correctness: "정치적 올바름"
 BUL_political_correctness_desc: "취약 집단을 불쾌하게 하거나 곤란하게 하지 않고 갈등을 유발하지 않도록 정치적 올바름을 도입해야 합니다."
 BUL_neutrality_focus: "민주세력동맹 (UDF)"
 BUL_neutrality_focus_desc: "불가리아의 정당 SDS, 소위 민주세력동맹 (Union of Democratic Forces)은 불가리아의 중도 우파 정당입니다. 1989년 설립된 이후, 민주세력동맹은 불가리아가 공산주의에서 민주주의의 통치로 전환되는 시절 주요 야당 중 하나 입니다. 정당은 민주주의의 가치를 강조하고, 시장 지향적인 정책과, 유럽과의 통합을 표방합니다. 민주세력동맹은 1999년 부터 다양한 집권 연립 정당에 속해 있었으며 대통령과 총리를 배출하기도 했습니다."
 BUL_interventionism_focus: "불가리아 사회당"
 BUL_interventionism_focus_desc: "불가리아 사회당(BSP)은 불가리아에 기반을 둔 정당입니다. 1990년에 창당되었으며 불가리아 공산당의 후신입니다. BSP는 좌익 정책과 사회민주주의 의제로 알려져 있습니다. 강령은 불평등 해소와 부패 척결, 노동자 권리 옹호와 환경 보호에 초점을 맞추고 있습니다. 이 정당은 수년간 여러 연립 정부에 참여하며 불가리아에서 상당한 정치적 권력을 행사해 왔습니다. 그러나 특히 공산주의 과거와 러시아와의 긴밀한 관계를 둘러싸고 비판과 논란에도 직면해 왔습니다."
 BUL_military_youth: "군사 청년단"
 BUL_military_youth_desc: "나로드노 오폴체니에로도 알려진 불가리아 군사 청년 조직은 군 복무와 애국심에 관심 있는 불가리아 청년들을 위한 자원 조직입니다."
 BUL_deterrence: "경제적 자유주의"
 BUL_deterrence_desc: "우리 경제가 도약하려면 새로운 자유주의 경제 모델을 채택해야 합니다."
 BUL_volunteer_corps: "대중적 사회 의제"
 BUL_volunteer_corps_desc: "대중적 사회 의제를 활용하여 국민의 호감을 얻을 수 있습니다."
 BUL_paramilitarism: "준군사주의"
 BUL_paramilitarism_desc: "불가리아의 준군사주의는 불가리아 군이나 경찰의 공식 조직 밖에서 활동하는 군대식 조직 집단을 가리킵니다. 이러한 집단은 공산주의 이후 시기에 범죄율 상승과 정부가 법과 질서를 유지하지 못한다는 인식에 대한 대응으로 불가리아에서 인기를 얻었습니다."
 BUL_indoctrination_focus: "전시 공산주의"
 BUL_indoctrination_focus_desc: "신경제정책(NEP)과 전시 공산주의의 주된 차이는 다양한 경제 구조의 장기적 존속과 함께, 자본주의에서 사회주의로 이행하는 시기에 시장 관계를 이용하려는 시도에 있습니다."
 BUL_foreign_expeditions: "노동조합"
 BUL_foreign_expeditions_desc: "불가리아의 노동조합은 노동자의 권리와 더 나은 환경을 옹호하며, 모든 산업의 근로자가 공정한 대우와 대표성을 받도록 보장하고 보다 공평한 사회에 기여합니다."
 BUL_why_we_fight: "우리의 입장"
 BUL_why_we_fight_desc: "외교 정책을 올바르게 수립하려면 우리의 지정학적 위치를 이해하고 그에 따라 행동해야 합니다."
 BUL_political_commissars: "정치위원"
 BUL_political_commissars_desc: "정치위원은 붉은 불가리아라는 우리의 영광스러운 꿈에 필수적인 존재가 될 것입니다."
 BUL_ignite_nostalgia: "불꽃을 지펴라!"
 BUL_ignite_nostalgia_desc: "확장해야 할까요? 확장해야 한다고 생각합니다. 모두가 확장을 원하지 않습니까, 물론 영토 면에서 말입니다."
 BUL_civil_expansion: "민간 경제 확대"
 BUL_civil_expansion_desc: "더 많은 사람에게 일자리를 제공할 수 있으므로 우리 경제의 민간 부문 확대가 필요합니다."
 BUL_ally_to_china: "중국에 접근"
 BUL_ally_to_russia: "소련은 아니지만 형제"
 BUL_macedonia_in_flames: "불타는 마케도니아!"
 BUL_our_irredenta: "우리의 미수복 영토"
 BUL_our_irredenta_desc: "불가리아의 새 정부가 불가리아 미수복지 회복주의, 즉 한때 불가리아의 통제 아래 있던 영토를 포함하도록 국경을 확장해야 한다는 신념을 장려하고 있다고 보도되었습니다. 이는 이웃 국가들 사이에 논란과 우려를 불러일으켰습니다."
 BUL_internationalist_nationalism: "우리의 힘을 과시하라"
 BUL_internationalist_nationalism_desc: "과거에 폐쇄되었던 공장들이 정부 자금 지원 덕분에 다시 가동될 것입니다. 군사 전문가들은 현재의 지정학적 환경을 고려할 때 이러한 조치가 불가리아에 중요하다고 봅니다."
 BUL_autocracy_political_power: "진정한 전제주의"
 BUL_anschluss_macedonia: "마케도니아 합병"
 BUL_anschluss_macedonia_desc: "새 정부는 마케도니아를 불가리아의 통제 아래 두는 것이 불가리아를 강화할 뿐만 아니라, 최근 몇 년간 정치적 불안정으로 고통받은 마케도니아 국민에게도 도움이 될 것이라고 믿었습니다. 그들은 마케도니아가 언어, 문화, 역사를 공유하는 불가리아의 당연한 일부이며, 이를 포함시키면 통합과 진보가 촉진될 것이라고 주장했습니다."
 BUL_internationalism_focus: "구체제 복원"
 BUL_internationalism_focus_desc: "사회주의 체제의 붕괴는 불가리아에 완전한 혼란과 무관한 정치 의제, 그리고 공산주의 달성이라는 깨어진 꿈만을 가져왔습니다. 우리는 그 의제를 되살려야 합니다!"
 BUL_nationalism_focus: "시메온 2세 지지"
 BUL_nationalism_focus_desc: "Simeon II is surprisingly a very popular politician and a prime-minister in Bulgaria. Military should support him on overthrowing the government and empowering him as our monarch!"
 BUL_smuggling_weaponry: "무기 밀반입"
 BUL_smuggling_weaponry_desc: "불가리아군 내부 소식통에 따르면, 총기와 탄약 화물이 정부 고위 관리들에 의해 조달되어 마케도니아에서 활동하는 반군 단체에 배포되었다고 합니다. 수십 년간 자치를 위한 투쟁을 벌여 온 이 단체들은 최근 몇 달간 공격을 강화했고, 그 결과 국경을 따라 폭력이 급증했습니다."
 BUL_nationalist_diplomacy: "민족주의 외교"
 BUL_nationalist_diplomacy_desc: "불가리아의 새 민족주의 정부는 유럽의 유럽회의주의와 민족주의를 지지하겠다고 공언했습니다. 우리 지도자는 취임 연설에서 불가리아가 유럽 전역의 다른 민족주의 지도자들과 긴밀히 협력하여 국가 주권과 EU 기구로부터의 독립이라는 이념을 증진할 것이라고 밝혔습니다."
 BUL_question_of_our_identity: "우리의 미래"
 BUL_question_of_our_identity_desc: "우리의 정치 의제로부터 어떤 결론을 도출해야 할지 결정해야 합니다."
 BUL_generic_generic_generic_genericism: "불가리아 관광"
 BUL_bulgarian_generic_generic_generic_computer: "불가리아 컴퓨터 산업"
 BUL_generic_generic_bulgarian_vlaues: "불가리아의 가치"
 BUL_generic_conservative_ecologism_generic: "에코글라스노스트"
 BUL_simeon_prime_minister: "시메온 2세"
 BUL_red_balkan_dream: "붉은 발칸의 꿈"
 BUL_ally_to_yugo: "유고슬라비아와의 친선"
 BUL_ideological_fanaticism: "이념적 광신"
 BUL_ideological_fanaticism_desc: "정치적으로 확립된 우리의 가치와 목표는 어떤 오래된 신앙 못지않게 목숨을 바칠 가치가 있습니다. 모든 추종자는 죽음을 맞이할 각오가 되어 있어야 하며, 이탈하는 자들도 죽음을 맞이할 각오를 하는 편이 좋을 것입니다."
 BUL_autocracy_political_power_desc: "불가리아에는 옛 불가리아 즈베노 조직을 받아들이는 데 관심을 표명한 새 정부가 들어섰습니다. 1927년에 처음 설립된 즈베노 조직은 권위주의적 견해와 기존 불가리아 정부를 전복한 1934년 쿠데타에 연루된 것으로 알려져 있었습니다. 그러나 이 조직은 근대 불가리아 국가의 형성에서도 중요한 역할을 했습니다. 그 결과 많은 불가리아인은 즈베노를 자국 역사의 필수적인 일부로 여깁니다."
 BUL_generic_control_soldiers: "엄격한 차렷 자세"
 BUL_generic_control_soldiers_desc: "우리 병사들은 좋게 말해도 다소 통제가 되지 않습니다. 전장에서 스스로 목숨을 잃지 않도록 규율을 잡아야 합니다."
 BUL_control_soldiers: "VMRO 방식"
 BUL_control_soldiers_desc: "VMRO의 방식은 개인의 자유를 거의 고려하지 않는 고도로 중앙집권적인 통치 체제를 옹호하기 때문에 일부에게는 문제가 있는 통치 방식으로 여겨집니다. 그러나 새 정부의 지지자들은 이러한 방식이 부패를 척결하고 급속한 변화를 이루는 데 필요하다고 믿습니다."
 BUL_controlism: "군주제 수용"
 BUL_controlism_desc: "군주제를 수용하려는 새 정부의 결정은 이러한 정서에 호소하고 국민 통합 의식을 증진하는 방법으로 비칠 수 있습니다. 그러나 이 조치는 분열을 초래할 수 있고 더 시급한 정치 현안에서 관심을 돌린다는 비판도 받아 왔습니다."
 BUL_work_at_all: "모두가 일하라"
 BUL_work_at_all_desc: "사회가 돌아가려면 모든 사람이 일해야 합니다. 그러니 일을 시작하십시오!"
 BUL_generic_war_industries: "산업 전쟁 노력"
 BUL_generic_war_industries_desc: "우리는 산업과의 전쟁을 벌이고 있으며, 이 전쟁에서 승리하려면 공장을 숙련된 노동자로 채울 수 있도록 더 많은 인력이 필요합니다."
 BUL_the_rule: "시장 사회주의"
 BUL_the_rule_desc: "시장 사회주의는 일부에게는 매우 인기가 높고 다른 이들에게는 그렇지 않지만, 분명한 것은 불가리아에 그것이 필요하다는 점이며, 그것도 지금 당장 필요하다는 점입니다."
 BUL_indoctrination_focus_2_the_rule: "무엇보다 규칙이 우선"
 BUL_indoctrination_focus_2_the_rule_desc: "누구도 법 위에 있지 않으며, 우리 사회가 부패하지 않도록 규칙은 집행되어야 합니다."
 BUL_generic_army_effort: "불가리아 육군"
 BUL_Expansionism: "불가리아의 팽창"
 BUL_bulgarian_legacy: "불가리아의 유산"
 BUL_govern_bonus_2: "내각 개편"
 BUL_govern_bonus_2_desc: "야당을 처리한 지금, 우리는 내각을 마음대로 재편할 수 있습니다."
 BUL_governmental_change: "행정 개혁"
 BUL_governmental_change_desc: "현재의 경찰력은 비효율과 낡은 관행에 시달리고 있습니다. 현대적 장비가 부족하고 훈련이 미흡하며 인력도 모자랍니다. 경찰은 또한 부패하고 책임을 지지 않는다는 인식이 흔하며, 이는 국민의 신뢰와 믿음을 갉아먹고 있습니다."
 BUL_russian_question_nat: "이봐, 러시아?"
 BUL_russian_question_nat_desc: "이봐, 러시아? 너희를 어떻게 해야 할까?"
 BUL_yugoslavian_question: "유고슬라비아 문제"
