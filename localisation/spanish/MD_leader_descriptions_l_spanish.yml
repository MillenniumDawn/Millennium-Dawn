l_spanish:
 DONALD_TRUMP_LEADER_DESC: "Donald John Trump (nacido el 14 de junio de 1946) es el multimillonario hijo del promotor inmobiliario Frederick Christ Trump. Con un pequeño préstamo de un millón de dólares, Trump fundó y expandió numerosos negocios bajo la Organización Trump desde 1971. Conocido por sus discursos virulentos y un estilo de liderazgo impulsivo heredado de sus días como personalidad de televisión, Trump ha ganado tantos enemigos como amigos. Al asumir la presidencia, Trump promete frenar la inmigración ilegal, aumentar el gasto militar, imponer aranceles proteccionistas y poner firmemente a Estados Unidos en primer lugar. "
 MITT_ROMNEY_LEADER_DESC: "Willard Mitt Romney (born March 12, 1947) is one of four children born to automobile executive George W. Romney. A devout Mormon and firm believer in laissez-faire economics and conservative family values; Romney vows to use his years of business experience to cut government waste, increase military spending, and remove restrictions put on Wall Street and large corporations."
 GEORGE_BUSH_LEADER_DESC: "George Walker Bush (nacido el 6 de julio de 1946) es el primer hijo de George Herbert Walker Bush, quien se desempeñó como el 41º presidente de Estados Unidos de 1989 a 1993. Después de un breve período en la industria petrolera, Bush ingresó a la política y eventualmente se convirtió en gobernador de Texas. Presentándose a sí mismo como un conservador compasivo, Bush promete recortar impuestos, aumentar el gasto militar y desregular el sector corporativo de restricciones innecesarias sobre las emisiones de gases de efecto invernadero. "
 MARCO_RUBIO_LEADER_DESC: ""
 BERNIE_SANDERS_LEADER_DESC: "Bernard Sanders (born September 8, 1941) is the son of working class Polish immigrants to the United States. Joining the Young People's Socialist League during his college years, Sanders advocated for the equal treatment of whites and blacks during the Civil Rights Movement. Sanders later became mayor of Burlington, Vermont, and was eventually elected to the U.S. House of Representatives and U.S. Senate. A self-described democratic socialist and progressive, Bernie Sanders vows to reduce military spending, increase the power of labor unions and create a universal healthcare system."
 HILLARY_CLINTON_LEADER_DESC: ""
 BARACK_OBAMA_LEADER_DESC: ""
 BILL_CLINTON_LEADER_DESC: ""
 GARY_JOHNSON_LEADER_DESC: ""
 RAND_PAUL_LEADER_DESC: ""
 DAVID_DUKE_LEADER_DESC: ""
 ANN_COULTER_LEADER_DESC: ""
 COUNCIL_FOR_NATIONAL_PRESERVATION_DESC: "The Council is a rump remnant of what was the federal government of the former United States. As such whatever is left is attempting to rally what people and territory it has left around a new flag. Members of the council look to create a sense of law and order as well as a sense of peace, this way they can then conduct a smooth transition of power to a new administration."
 MATHEW_CROUDER_DESC: "The \"Marshal\", or simply Mat/Mathew, is a bit of a paradox. Both talkative yet overtly quiet this young man has a sort of scatter brain approach to handling things or doing things that interest him. Despite his initial unlikeliness to become any kind of leader, his own soft power in terms of making acquaintances as well as his more gentle personality makes him a fairly relatable person. Though he has been known to be a bit of a hot head at times in more confrontational matters, he strives to do what he can for as many as he can. As he was once quoted by an interviewer, \"Life is a strange and confusing mess, you never truly know where you will end up even if you wanted to do something you may certainly find yourself doing the complete opposite. I mean from JROTC in high school, to the odd hobby of writing a constitution and exploring the idea of a micro-nation, I never once would have even dreamed of being a political leader... Let alone one on a federal level.\" This somewhat naivety yet sort of boundless optimism has seen Mathew now put in charge of the Southern Republic of America, though what he'll do not many know, for now we just wait and see."
 JIANG_ZEMIN_LEADER_DESC: "Jiang Zemin (born August 17, 1926) is a former engineer who has led the Communist Party since 1989, replacing the reformist Zhao Ziyang in the wake of the Tiananmen Square protests. Previously he served as mayor of Shanghai and his continued favoring of individuals who served with him in Shanghai has led to his faction of the party being dubbed the \"Shanghai Clique\". An advocate of economic reform, his rule in the 1990s has seen a continuation of Deng Xiaoping's policy of reform and opening up and a normalizing of the private sector. He has also presided over the return of both Hong Kong and Macau to Chinese sovereignty and has faced criticism over his heavy-handed approach to human rights."
 HU_JINTAO_LEADER_DESC: "Hu Jintao (nacido el 21 de diciembre de 1942) es un antiguo ingeniero que experimentó la denuncia de su padre durante la Revolución Cultural. Como líder, ha expresado el deseo de abordar los impactos que el rápido crecimiento económico ha tenido en la sociedad y el medio ambiente de China, y lidera la facción Tuanpai o Liga de la Juventud Comunista del Partido Comunista. Junto con el primer ministro Wen Jiabao, Hu busca distribuir de manera más equitativa los beneficios del desarrollo económico de China y adoptar un modo de gobierno menos elitista, manteniendo firmemente la primacía del Partido Comunista."
 XI_JINPING_LEADER_DESC: "Xi Jinping (nacido el 15 de junio de 1953) es parte de una nueva generación de funcionarios chinos conocidos como 'príncipes herederos'. Hijo de un veterano del Partido Comunista, Xi ha enfatizado la centralización y la consolidación del poder bajo su liderazgo, debilitando a los rivales políticos y a las facciones existentes del Partido Comunista a través de sus campañas anticorrupción. También es partidario de una política exterior asertiva, marcando una ruptura con la política de Deng Xiaoping de mantener un perfil bajo en los asuntos internacionales."
 BO_XILAI_LEADER_DESC: "Bo Xilai (born July 3, 1949) is a well-known princeling and son of former Vice Premier Bo Yibo. Known for his tenure as Party Secretary of Chongqing, Bo is associated with his campaign against organized crime and his revival of \"red culture\" which has won him support among leftists dissatisfied with the inegalitarian trajectory of China's economic growth. Bo has earned many enemies during his political career, and has a controversial reputation."
 KIM_DAE_JUNG_LEADER_DESC: "Kim Dae-jung (nacido el 6 de enero de 1924) es una figura muy respetada en la política de Corea del Sur debido a su larga historia de activismo a favor de la democracia, y algunos lo llaman 'el Nelson Mandela de Asia'. Tras sobrevivir a un presunto intento de asesinato, un secuestro por parte de agentes de inteligencia y una sentencia de muerte, Kim finalmente emergió después de casi 50 años de oposición para liderar su país. Sus prioridades desde que asumió el cargo en 1998 han incluido la recuperación económica, responsabilizar a los poderosos chaebols de Corea y buscar el compromiso con Corea del Norte bajo su famosa Política de la Luz del Sol."
 ROH_MOO_HYUN_LEADER_DESC: "Roh Moo-hyun (nacido el 6 de agosto de 1946) es un antiguo abogado de derechos humanos de origen humilde que defendió a los manifestantes estudiantiles contra el régimen autoritario. Al igual que Kim Dae-jung, quien ha apoyado su presidencia, Roh favorece las negociaciones con el Norte en lugar de una política de aislamiento internacional. También ha sido abiertamente crítico con Estados Unidos y Japón, y tiene una relación antagónica con el establishment conservador de Corea. Roh cuenta con el apoyo de la generación '386', de tendencia izquierdista, que está en sus 30 años, estudió en la década de 1980 y nació en la década de 1960."
 LEE_MYUNG_BAK_LEADER_DESC: "Lee Myung-bak (nacido el 19 de diciembre de 1941) es un político conservador y antiguo CEO de Hyundai. Durante su tiempo en Hyundai, se ganó el apodo de 'Bulldozer Furioso' en parte debido a su enfoque de gestión estricto. Como una figura ambiciosa, Lee espera transformar a Corea en una de las economías más grandes del mundo y promover una política exterior internacionalista que eleve el estatus global de Corea. En contraste con sus contrapartes de izquierda, Lee favorece un enfoque duro hacia Corea del Norte y una estrecha asociación con Estados Unidos."
 PARK_GEUN_HYE_LEADER_DESC: "Park Geun-hye (nacida el 2 de febrero de 1952) es mejor conocida por ser la hija de Park Chung-hee, el antiguo líder autoritario de Corea que sigue teniendo un legado controvertido. Mientras algunos ven a Park Chung-hee como un dictador brutal que utilizó la tortura y el encarcelamiento para mantener su gobierno, otros lo elogian por sus logros económicos. En su juventud, Park sobrevivió al asesinato de su madre y de su padre, este último a manos del jefe de la Agencia Central de Inteligencia de Corea del Sur. Conocida por su postura conservadora orientada al mercado, Park favorece la desregulación, la reducción de impuestos y el orden público."
 MOON_JAE_IN_LEADER_DESC: "Moon Jae-in (born January 24, 1953) is the son of North Korean refugees and a former human rights lawyer and activist. During his military service, Moon served as a special forces commando and took part in Operation Paul Bunyan, the ROK-USA joint response to the 1976 Panmunjom axe murder incident. A close friend of his predecessor Roh Moo-hyun, whom he had previously started a legal practice with, Moon was active in Roh's left-wing administration and was an important player in the Sunshine Policy, which he remains committed to. While committed to the US alliance, Moon has stated that Korea should learn how to say no to the Americans and hopes to take back wartime control of the Korean military from the US."
 KIM_JONG_UN_LEADER_DESC: "Kim Jong-un (born January 8, 1984) was the son most valued by Kim Jong-il during his lifetime. During his days studying in Switzerland, his slightly obese frame made it possible to underestimate him. But when he did ascend to the throne, he shocked the world with his calmness, shrewdness and ruthlessness in the secret executions of his political enemies (including, according to unconfirmed reports, the execution of his paternal uncle with anti-aircraft guns), his determination to continue developing nuclear weapons despite international sanctions, and his precise timing of the friendly dialogue with the US and South Korea. Under his leadership as a \"great man from heaven\", perhaps there is a real possibility of North Korea becoming the \"Strong and Prosperous Nation\"?"
 KIM_JONG_NAM_LEADER_DESC: "Kim Jong-nam (nacido el 10 de mayo de 1971) es hijo de Kim Jong-il y su segunda esposa. Como hijo mayor de su familia, Kim Jong-nam fue testigo de la miseria del pueblo durante la \"Marcha Ardua\". Durante su estancia en el extranjero, vio el rápido desarrollo de la reforma y la apertura de China, y quedó impresionado por el poder del cambio. Creía que sólo la reforma podía traer prosperidad material y felicidad espiritual al pueblo norcoreano, pero también comprendió que el cambio podía costarle el poder. Pero nunca se arrepintió."
 KIM_YO_JONG_LEADER_DESC: "Kim Yo-jong (nacida el 26 de septiembre de 1987), como la única niña en su familia, ha demostrado tanto talento desde que comenzó su carrera política que Kim Jong-il exclamó al elegir a su sucesor: 'Si tan solo Kim Yo-jong fuera un niño'. Quizás debido a su imagen femenina, ella disfruta de un alto nivel de apoyo tanto en el país como en el extranjero (peculiarmente). Hoy en día, su reinado está demostrando que las mujeres pueden tener tanto éxito como los hombres, sin importar el tipo de política de un país."
 POLITICS_PAUL_KAGAME_DESC: "Cuando Paul Kagame tenía 28 años, ayudó a derrocar al gobierno de Uganda. A los 36, derrocó al gobierno genocida hutu de Ruanda. A los 39, derrocó a Mobutu de la República Democrática del Congo, el dictador más corrupto y represivo de África. Kagame es probablemente el líder militar vivo más exitoso, habiendo ganado más guerras que nadie, todo con un presupuesto limitado. Mientras reprime a toda la oposición en su país, el general tutsi tiene constantemente la vista puesta en nuevas ambiciones extranjeras, persiguiendo a los rebeldes hutus y explotando las riquezas minerales."
 costas_simitis_desc: "Costas Simitis (born June 23, 1936) es hijo de George Simitis, abogado y profesor de la Universidad Económica de Atenas. Después de participar en organizaciones antigubernamentales durante la dictadura griega, Costas Simitis se convirtió en miembro fundador del Movimiento Socialista Panhelénico (PASOK) en 1974, poco después de la caída de la junta griega. Durante la victoria electoral del PASOK en 1981, ocupó numerosos cargos gubernamentales durante el gobierno de Andreas Papandreou, como jefe de departamento de economía, agricultura, educación y religión, así como simultáneamente jefe de departamentos de industria, investigación, energía, tecnología y comercio. Después de la muerte de Andreas Papandreou en 1996, fue elegido como líder del PASOK y poco después ganó las elecciones generales de 1996. Ahora Costas Simitis busca aumentar de manera constante las privatizaciones en el sector público, lograr estabilidad económica, reducir la deuda nacional, resolver las disputas greco-turcas y, lo más importante, aumentar los lazos y la cooperación con la Unión Europea."
 nikolaos_michaloliakos_desc: "Nikolaos Michaloliakos (born December 11th, 1957) is the founder of Golden Dawn, the largest nationalist party of Greece. Michaloliakos was a supporter of the Greek Military regime and known for participating in many extremist right wing groups which had committed attacks on many anti dictatorship figures as well as a relation with the head of the Greek Junta Georgios Papadopoulos. In 1980, he formed the Golden Dawn far right party which aims to have an anti-leftist agenda, anti immigration, glorifying Greek authoritarian regimes such as the 1967 Junta and the 4th of August 1936 regime and aligning to Russia and China and moving away from the west. Michaloliakos and his Golden Dawn party have been condemned as a criminal organization which targets minorities and has pro-neo-nazi and fascist views as well as an anti-democratic stance. In spite of the backlash against him Nikolaos Michaloliakos and his party have been rising in popularity as economic instability and social divides have been plunging Greece it has drawn more supporters to the Golden Dawn cause. If the situation becomes worse Nikolaos Michaloliakos may achieve his goals, taking power and building a new Greek state"
 CONGRESSIONAL_CHAMBERS_DESC: "With the electoral college failing and the election having...unexpected issues in the state of Florida, congress scrambles to try and figure out who to vote for or at the very least get into the president's seat before things boil over any more than they already have."
 YOON_SUK_YEOL_LEADER_DESC: "Yoon Suk Yeol (nacido el 18 de diciembre de 1960) fue el ex fiscal general de la República de Corea y fiscal jefe de la Fiscalía del Distrito Central de Seúl. Durante su presidencia, Yoon Suk Yeol declaró la ley marcial de emergencia, acusando a la oposición de controlar la Asamblea Nacional, simpatizar con Corea del Norte y paralizar al gobierno mediante actividades antiestatales. Sin embargo, la Asamblea Nacional votó a favor de levantar la ley marcial. Desde entonces, Yoon Suk Yeol ha sido acusado de sedición y se le ha prohibido salir del país, convirtiéndose en el primer presidente en ejercicio en la historia de Corea del Sur en recibir esta prohibición. Posteriormente, Yoon Suk Yeol fue arrestado, convirtiéndose en el primer presidente en ejercicio en ser arrestado en la historia de Corea del Sur."