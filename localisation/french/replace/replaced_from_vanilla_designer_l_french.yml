 DESIGNER_REGIMENTAL_SUPPORT_COLUMN_TITLE: "Battalion Support Platoons and Sections. These are support and combat troops attached directly at the battalion level.\n\nBattalion Support Platoons and Sections §Rdo§! affect the §YMax Speed§! of the Brigade but they §Gdo not increase§! §YCombat Width§! (§Rexcept§! Naval Landing Detachment)."
 DESIGNER_SUPPORT_COLUMN_TITLE: "Brigade Support Companies and smaller size units. These are support troops that are kept behind the frontline troops and help out.\n\nYou can only select §Rone§! of each type.\n\nCompanies and smaller size units §Rdo§! affect the §YMax Speed§! of the Brigade and §Rincrease§! its §YCombat Width§! (§Rexcept§! Pathfinder Platoon)."
