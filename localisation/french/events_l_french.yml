 UNSC.200.t: "Tenter de convaincre [?sway_target.GetName]"
 UNSC.200.d: "Pour obtenir le résultat voulu sur cette résolution du §YConseil de sécurité§! des §BNations unies§!, nous devons amener davantage de pays à voter avec nous, ou à s'abstenir. Pour qu'ils changent de vote, il faut leur offrir quelque chose qui vaille leur allégeance pour ce scrutin. Nous avons plusieurs offres possibles, mais nous devons en choisir une maintenant et espérer qu'ils l'acceptent."
 UNSC.200.a: "Proposer des offres commerciales et d'investissement"
 UNSC.200.b: "Offrir des incitations financières"
 UNSC.200.c: "Offrir des incitations militaires"
 UNSC.200.e: "Offrir des incitations au développement"
 UNSC.201.t: "[FROM.GetName] souhaite influencer notre vote"
 UNSC.201.d: "[FROM.GetLeader] a discrètement approché [THIS.GetLeader] pour que nous changions notre vote en [vote_change_too] sur la résolution en cours du Conseil de sécurité des Nations unies. Ils ont proposé de nous accorder des accords commerciaux et des traités d'investissement mutuel, ainsi que de lever tout embargo ou blocus si nous acceptons de changer de vote, à accorder après le changement. Nous devons décider si accepter leur demande vaut de modifier notre position au Conseil de sécurité."
 UNSC.201.a: "Accepter leur offre"
 UNSC.201.b: "Rejeter cette exigence scandaleuse !"
 UNSC.202.t: "[FROM.GetName] souhaite influencer notre vote"
 UNSC.202.d: "[FROM.GetLeader] a discrètement approché [THIS.GetLeader] pour que nous changions notre vote en [vote_change_too] sur la résolution en cours du Conseil de sécurité des Nations unies. Ils ont proposé de nous verser 0,25 % de notre PIB en paiement forfaitaire si nous acceptons de changer de vote, à accorder après le changement. Nous devons décider si accepter leur demande vaut de modifier notre position au Conseil de sécurité."
 UNSC.202.a: "Accepter leur offre"
 UNSC.202.b: "Rejeter cette exigence scandaleuse !"
 UNSC.203.t: "[FROM.GetName] souhaite influencer notre vote"
 UNSC.203.d: "[FROM.GetLeader] a discrètement approché [THIS.GetLeader] pour que nous changions notre vote en [vote_change_too] sur la résolution en cours du Conseil de sécurité des Nations unies. Ils ont proposé de nous accorder l'accès militaire, aux bases aériennes et aux systèmes satellitaires si nous acceptons de changer de vote, à accorder après le changement. Nous devons décider si accepter leur demande vaut de modifier notre position au Conseil de sécurité."
 UNSC.203.a: "Accepter leur offre"
 UNSC.203.b: "Rejeter cette exigence scandaleuse !"
 UNSC.204.t: "[FROM.GetName] souhaite influencer notre vote"
 UNSC.204.d: "[FROM.GetLeader] a discrètement approché [THIS.GetLeader] pour que nous changions notre vote en [vote_change_too] sur la résolution en cours du Conseil de sécurité des Nations unies. Ils ont proposé de nous accorder des subventions et une assistance en recherche, construction et production si nous acceptons de changer de vote, à accorder après le changement. Nous devons décider si accepter leur demande vaut de modifier notre position au Conseil de sécurité."
 UNSC.204.a: "Accepter leur offre"
 UNSC.204.b: "Rejeter cette exigence scandaleuse !"
 UN.200.t: "Tenter de convaincre [?sway_target.GetName]"
 UN.200.d: "Pour obtenir le résultat voulu sur cette résolution de l'§YAssemblée générale§! des §BNations unies§!, nous devons amener davantage de pays à voter avec nous, ou à s'abstenir. Pour qu'ils changent de vote, il faut leur offrir quelque chose qui vaille leur allégeance pour ce scrutin. Nous avons plusieurs offres possibles, mais nous devons en choisir une maintenant et espérer qu'ils l'acceptent."
 UN.200.a: "Proposer des offres commerciales et d'investissement"
 UN.200.b: "Offrir des incitations financières"
 UN.200.c: "Offrir des incitations militaires"
 UN.200.e: "Offrir des incitations au développement"
 UN.201.t: "[FROM.GetName] souhaite influencer notre vote"
 UN.201.d: "[FROM.GetLeader] a discrètement approché [THIS.GetLeader] pour que nous changions notre vote en [vote_change_too] sur la résolution en cours de l'Assemblée générale des Nations unies. Ils ont proposé de nous accorder des accords commerciaux et des traités d'investissement mutuel, ainsi que de lever tout embargo ou blocus si nous acceptons de changer de vote, à accorder après le changement. Nous devons décider si accepter leur demande vaut de modifier notre position au vote de l'Assemblée générale."
 UN.201.a: "Accepter leur offre"
 UN.201.b: "Rejeter cette exigence scandaleuse !"
 UN.202.t: "[FROM.GetName] souhaite influencer notre vote"
 UN.202.d: "[FROM.GetLeader] a discrètement approché [THIS.GetLeader] pour que nous changions notre vote en [vote_change_too] sur la résolution en cours de l'Assemblée générale des Nations unies. Ils ont proposé de nous verser 0,25 % de notre PIB en paiement forfaitaire si nous acceptons de changer de vote, à accorder après le changement. Nous devons décider si accepter leur demande vaut de modifier notre position au vote de l'Assemblée générale."
 UN.202.a: "Accepter leur offre"
