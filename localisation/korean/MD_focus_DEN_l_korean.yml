l_korean:
 DEN_army: "육군"
 DEN_army_desc: "왕립 덴마크 육군은 지상에서 작전을 수행하는 군대로 자국의 아주 중요한 부분을 담당하고 있습니다. 그 자질을 확충할 수 있는 방도를 찾아야 합니다."
 DEN_expand_barracks: "병영 확충"
 DEN_expand_barracks_desc: "현재 사용하고 있는 병영은 너무나도 부적합하고 계속해서 증가하고 있는 병사들을 위해 시설을 확충해야 합니다!"
 DEN_develop_artillery_models: "야포 개발"
 DEN_develop_artillery_models_desc: "야포는 역사적으로 덴마크 육군에게 아주 중요한 무기이자, 현 추세에는 점점 기계화가 늘어감에도 야포는 지원포격을 하기 위한 중요한 수단일 것입니다. 이렇기에 야포를 최신 종류로 바꾸어야 합니다."
 DEN_infantry_equipment_models_1: "새로운 보병장비"
 DEN_infantry_equipment_models_1_desc: "자국 육군은 수십년간 자금 부족과 골동품 장비들로 인해 많은 사고가 발생했습니다. 이 눈물없이 볼 수 없는 현실을 당장 고쳐야 합니다!"
 DEN_land_doctrine_1_desc: "소국이기에, 자국의 전술은 압도적일정도로 강하지는 않지만 적들보다 더욱 더 한 수 앞 미래를 보며 똑똑하게 진화해갔습니다. 육군 교리는 군사 작전의 효용성에서 아주 중요한 부분입니다."
 DEN_close_Frederiksberg_Have: "프레더릭스보르그 정원 폐쇄"
 DEN_close_Frederiksberg_Have_desc: "왕립 덴마크 사관학교는 프레더릭스보르그 성 엎에 드넓은 정원에 위치하고 있습니다. 이 정원을 민간인들에게 접근금지를 시킨다면, 훈련공간을 확보하여 학교의 능력을 더 끌어올릴 수 있을 것입니다. 물론, 민간인들에게서 반발도 있겠지만, 산책하는 이들보다 군대가 더 중요한게 아니겠습니까?"
 DEN_joint_material_command: "공동 물자 사령부 설립"
 DEN_joint_material_command_desc: "군을 현대화하기 위한 일환으로, 몇몇 장성들은 군사장비 구매를 관리하는 부서를 신설할 것을 추천했습니다. 이 공동 물자 사령부는 육군의 소비를 더욱 더 효율적으로 관리할 것입니다."
 DEN_hacker_recruitment_drive: "해커 모병 장려"
 DEN_hacker_recruitment_drive_desc: "증가하는 사이버 위협 환경에 대응하여 덴마크 정부는 사이버 보안 및 해킹 분야의 최고 인재를 유치하기 위해 포괄적인 해커 모집 드라이브를 시작합니다. 정부는 표적 지원 프로그램, 교육 이니셔티브 및 인센티브를 통해 덴마크의 사이버 방어 역량을 강화하기 위해 숙련된 해커와 사이버 보안 전문가를 모집하려고 합니다. 이들 신병들은 PET, FE 및 기타 기관과 협력하여 덴마크 이익, 중요 인프라 및 국가 안보 기관을 표적으로 하는 사이버 위협을 탐지, 완화 및 대응할 것입니다."
 DEN_refurbish_FAK: "방위 아카데미"
 DEN_refurbish_FAK_desc: "덴마크어로는 'Forsvarsakademiet' 또는 FAK 인 방위 아카데미는 군을 위한 교육, 자문, 연구를 실시하는 군에 속해있는 독립기관입니다. 불운하게도 시간이 지나면서 뿔뿔히 흩어지게 되었습니다. 이 기관의 설립을 주도하고 그 중요성을 어필함으로써 엄청난 이익을 얻을 수 있을 것입니다."
 DEN_streamline_infantry_production: "Streamline the Infantry Equipment Production"
 DEN_streamline_infantry_production_desc: "조달 프로세스를 가속화하고 물류 부담을 줄이기 위해 덴마크 정부는 제조 시설을 중앙 집중화하고 공급망 관리를 최적화하여 보병 장비 생산을 간소화합니다. 생산 라인을 통합하고 린 제조 원칙을 구현함으로써 정부는 덴마크 보병 부대 장비의 효율성과 비용 효율성을 향상시키는 것을 목표로 합니다."
 DEN_FAUK: "법부방위군단(FAUK)"
 DEN_FAUK_desc: "덴마크어로는 'Forsvarets Auditørkorps' 또는 FAUK인 법부방위군단은 덴마크 군의 법무관련 부서로 군과 관련된 모든 법적 사항조사를 하는 곳입니다. 이들의 관할을 확대한다면, 군이 가는 곳 어디에서든 법적사항과 명령체계를 유지할 수 있을 것입니다."
 DEN_royal_navy: "해군(Søværnet)"
 DEN_royal_navy_desc: "우리는 전략적으로 발트해와 북해 사이에 위치해 있으며, 왕립 덴마크 해군은 언제나 영해를 수호해왔습니다. 1510년에 창설된 전통있는 역사를 가지고 있는 해군은 오늘날에도 중요한 역활을 담당하고 있습니다."
 DEN_expand_Holmen: "홀멘 확장"
 DEN_expand_Holmen_desc: "홀멘 해군기지라 더 많이 불리는 코펜하겐 해군기지는 17세기부터 사용된 첫번째, 가장 규모가 큰 해군기지입니다. 처음에는 수선이 코펜하겐의 옆에 위치한 홀멘까지 드러나는 수심을 가지고 있었지만, 이는 곧 니홈섬까지 위치하게 되었습니다. 관광객들의 행복을 앗아가더라도 해군 기지를 확장할 필요가 있습니다."
 DEN_refurbish_royal_naval_academy: "왕립 해군 사관학교 개장"
 DEN_refurbish_royal_naval_academy_desc: "At an age of more than 300 years, the Royal Danish Naval Academy has the honor of being the oldest still-existing officers' academy in the world. Unfortunately, even for institutions, with age comes a sneaking decrepitude and the Naval Academy could really use some restructuring."
 DEN_establish_OPLOG_KOR: "코르쇠르 병참지원대(OPLOG KOR) 설립"
 DEN_establish_OPLOG_KOR_desc: "코르쇠르 병참지원대(Operative Logistical Support Korsør(OPLOG KOR))는 코르쇠르에 위치한 지방 소속의 해군기지 물자 보급을 담당하고 있습니다. 해군 기지는 해군에게 있어서 집이며, 해군확충을 위해서는 더욱 더 많은 활당이 필요한 곳이기도 합니다. 그렇기에 최우선적으로 이곳을 확충해야 합니다!"
 DEN_establish_OPLOG_FRH: "프레데릭스하운 병참지원대(OPLOG FRH) 설립"
 DEN_establish_OPLOG_FRH_desc: "코르쇠르 병참지원대(OPLOG KOR)가 이미 황충된 지금, 이제는 프레데릭스하운에 위치한 대형 해군기지를 확충할 시간입니다."
 DEN_streamline_naval_production: "해군 함정 건조 간소화"
 DEN_streamline_naval_production_desc: "자국은 유서깊은 해양 국가이자 선박건조업 국가로써 그 혼이 국기 그 자체에 씌여있습니다. 여기에 더해서 어떻게 개량하고 혁신시키는 재주를 통해서 선박의 품질을 저하시키지 않는다는 역설을 실현시킨채 건조량을 늘릴 수 있게 되었습니다."
 DEN_ark_project: "아크(ARK) 계획"
 DEN_ark_project_desc: "아크(ARK) 계획은 덴마크 군의 계획으로 NATO 회원국으로써 충족시켜야할 수송선 건조에 관련된 계획입니다. 자국은 기쁜마음으로 이 계획을 우선시하여 더 새롭고 좋은 수송선과 관련교리를 발전시켜나갈 것입니다."
 DEN_new_ship_models: "새로운 함급"
 DEN_new_ship_models_desc: "외국의 함정기술에 의존만 할 수 없습니다. 연구 & 개발 부서에 더 많은 자금을 조성하고 경쟁을 통해서 성과를 얻어낼 수 있을지도 모릅니다."
 DEN_Lyngby_Radio: "륑뷔 라디오"
 DEN_Lyngby_Radio_desc: "륑비 라디오는 우리 해군 통신체계의 중심적 역활을 하고 있는 곳입니다. 함께 임무를 수행하는 협동 구조협조분부(JRCC)와 이곳에서 몇 년간 일한 무전병은 함께 향후 사용될 레이더 개발에 아주 중요한 역활을 할 것입니다."
 DEN_naval_doctrine_1: "해군 교리 I"
 DEN_naval_doctrine_1_desc: "자국 해군은 강력한 함정을 가지고 있지만, 군사 이론가들 또한 해군 교리를 개선하고 발전시키는데 집중시켜야 합니다."
 DEN_naval_doctrine_2: "해군 교리 II"
 DEN_naval_doctrine_2_desc: "이미 현대 해전의 침로를 열었지만, 아직도 개선의 여지는 남아 있습니다."
 DEN_establish_VFK: "공동 방위 사령부(VFK) 설립"
 DEN_establish_VFK_desc: "공동 방위 사령부(Værnsfælles Forsvarskommando)는 덴마크 방위에 있어서 최고위 권한을 가지고 있는 곳으로, 덴마크 군 세곳 모두에게 명령을 내릴 수 있습니다. 국방장관 직속으로 소속된 곳으로 이를 설립함으로써 의심할 여지 없이 더욱 더 명확한 명령체계를 다른 소속의 군에 내릴 수 있을 것입니다."
 DEN_air_force: "공군(Flyvevåbnet)"
 DEN_air_force_desc: "The Royal Danish Air Force is the youngest of our three professional military branches and was only established after the Second World War. Regardless, the aerial frontier is now more central to modern warfare than ever, and we must not lag behind in this area!"
 DEN_support_Terma: "테르마 지원"
 DEN_support_Terma_desc: "Terma A/S is a Danish technology corporation situated in Lystrup in Jutland. Apart from manufacturing space and satellite technology, they specialize in RADAR equipment, fighter planes, helicopters and a host of other military electronics. Clearly we stand to benefit by supporting their work."
 DEN_Skrydstrup_air_base: "스크라이드스트럼 공군기지 확장"
 DEN_Skrydstrup_air_base_desc: "역설적이게도 남부 유틀란드 반도의 스크라이드스트럼 공군기지는 2차대전 시기에 나치독일이 세운 홀베르스테헨 공군기지였습니다. 만약 독일이 재침공을 한다면, 이곳은 공군의 최전선이 될 것입니다. 그러한 경우를 대비해서 이곳을 확장합니다."
 DEN_early_fighter_models: "초기 전투기"
 DEN_early_fighter_models_desc: "덴마크의 역사에는 훌륭한 전투기라는 것이 존재한 적이 없으며, 연구 & 개발 또한 정체되어 있습니다. 이 산업을 재빠르게 시작하기를 원한다면, 날기라도 하는 비행기 연구부터 시작해야할 것입니다."
 DEN_refurbish_air_force_officers_school: "왕립공군 사관학교 개선"
 DEN_refurbish_air_force_officers_school_desc: "왕립 덴마크 공군 사관학교는 전 사관학교 중 가장 늦게 설립된 데다가, 여전히 다른나라와 비교해서 뒤쳐진 상황입니다. 경제문제는 일단 나중으로 미루고 이 학교가 타국의 사관학교를 따라잡을 수 있게 전력을 집중합시다."
 DEN_Skalstrup_air_base: "스칼트럽 공군기지 확장"
 DEN_Skalstrup_air_base_desc: "로스킬데 근처의 공군기지는 이전에 NIKE, HAWK 미사일을 운용하며 질란드에서 방공임무를 수행하고 코펜하겐에서 이를 알아차릴 수 있었습니다. 이 무기들은 멍청하게도 정치적 압박을 받아 창고로 보내어졌습니다. 이것은 실수였습니다. 수도를 지키는 것이 무엇보다도 중요합니다!"
 DEN_advanced_bomber_models: "진보된 폭격기"
 DEN_advanced_bomber_models_desc: "Our earlier attempts at homegrown military airplane R&D were successful and several advisors are recommending that we expand the program to include bombers."
 DEN_air_doctrine_1: "항공 교리 I"
 DEN_air_doctrine_1_desc: "세계 최고의 성능을 가진 비행기일지라도 조종사가 무능하면 이는 고철덩어리일 뿐입니다. 실전에서 쓰이는 군사 교리가 포함된 책을 집필하여 조종사들의 훈련을 더욱 더 효율적으로 시킬 수 있도록 할 전략적 행동이 필요합니다."
 DEN_air_doctrine_2: "항공 교리 II"
 DEN_air_doctrine_2_desc: "자국의 항공 교리 이론가들은 자리에 바로 잡았으며, 제공권을 잡기 위한 새로운 방법을 지원하기 위해서 군사적 관점을 전환할 수 있을 것입니다."
 DEN_Karup_air_base: "카룹 공군기지 확장"
 DEN_Karup_air_base_desc: "유틀란트 반도의 카럽은 덴마크에서 가장 큰 공군 기지를 보유한 것뿐만이 아니라 북유럽에서 가장 큰 규모를 자랑하고 있습니다. 이 공군기지의 존재로 지리학적으로 소국인 자국이 더 높은 체급의 대국에게 한방 먹여줄 수 있다는 사실을 상기시킬 수 있습니다. 이러한 점에서 카럽은 방어할 필요가 있습니다. 공군기지가 확장된다고 할지라도요."
 DEN_streamline_aircraft_production: "항공기 생산 간소화"
 DEN_streamline_aircraft_production_desc: "몇몇 자문가들은 공군을 위해 비행기의 생산을 더 늘려야 한다고 조언했습니다. 더 중요한 것은, 이는 일자리를 창출할 뿐만 아니라 중개인의 개입을 최소화하고 부품이송과정을 간소화하여, 곧 하늘을 적색과 흰색으로 물들일 수 있게 된다는 것입니다!"
 DEN_mobilize_SSR: "특수 지원 및 수색중대(SSR) 동원"
 DEN_mobilize_SSR_desc: "특수 지원 및 수색중대(SSR) 또는 정찰 중대 육군작전 사령부는 지상 및 항공정찰에 특화된 부대입니다. 이들을 동원하여 정찰 임무를 더욱 더 정확히 실시할 수 있을 것입니다."
 DEN_mobilize_hunter_corps: "예거 군단(Jægerkorpset) 모병"
 DEN_mobilize_hunter_corps_desc: "덴마크어로 Jægerkorpset라 불리는 예거군단은 자국의 주력 특수부대입니다. 이들의 좌우명은 자신을 드러내지 말라(Plus esse, quam simultatur)로 이들의 겉으로 보이는 모습을 의미하고 있습니다. 덴마크 국민들에게 이들 군단에 대해 알려진 것은 거의 없고, 이는 구성원에 대해서도 마찬가지 입니다."
 DEN_natural_gas_deposits: "천연가스 매장지"
 DEN_natural_gas_deposits_desc: "북해는 천연 자원의 매장지입니다. 이 중에서 가장 중요한 것은 대규모 천연가스 매장지입니다. 더해서 만약 우리가 자국이 매장지를 잇는 고압력 송유관을 개발한다면, 자국의 에너지난을 극복할 수 있을 것입니다."
 DEN_north_sea_oil: "북해 석유"
 DEN_north_sea_oil_desc: "다국적 컨소시엄은 자국의 북해 매장지에서 석유 생산에 열을 올리고 있지만, 덴마크는 미적지근합니다. 물론, 저들은 우리 영토에 있고 우리의 법을 따록 있습니다! 저들과의 협상을 통해서 뇌물로 원유를 제공하도록 합시다."
 DEN_urban_improvement_fund: "도시 개발 기금"
 DEN_urban_improvement_fund_desc: "자국 국민들의 대부분은 대도시에 살고 있으며, 20%나 되는 이들이 코펜하겐에서 살고 있습니다. 보통, 도시를 성장시키는 것이 최우선입니다! 이러한 결과에 의거하여 대도시를 계속해서 확장시키고 현대화하는 기금을 조성할 것입니다."
 DEN_windmill_parks: "풍차 공원"
 DEN_windmill_parks_desc: "베스타스 윈드 시스템은 세계를 주도하는 풍차 생산회사로써 이들의 큰 풍차 공원은 에너지 기관의 자랑이자 기쁨입니다. 국민들의 무공해 에너지 바램을 실현시키고 기후변화에 걱정하는 이들에게 크나큰 어필을 할 수 있습니다."
 DEN_jutlandic_traffic_mafia: "유틀란드 반도 교통 파벌"
 DEN_jutlandic_traffic_mafia_desc: "'유틀란드 반도 교통 파벌'은 80년대부터 유틀란트 반도를 통하는 고속도로 건설을 다른 하원의원에게 강력하게 주장하는 하원의원들에게 붙여진 역설적인 이름입니다."
 DEN_energy_exports: "에너지 수출"
 DEN_energy_exports_desc: "우리나라는 에너지 자원이 풍부하여 연간 예산을 늘릴 수 있습니다."
 DEN_intensify_flexicurity_model: "유연 안전성 유형 심화"
 DEN_intensify_flexicurity_model_desc: "우리는 노동자들과의 유대를 강화하고 우리나라의 복지를 증진해야 합니다. 유연성 보장을 강화함으로써 두 가지 모두를 확보할 수 있습니다."
 DEN_more_refineries: "더 많은 정제소"
 DEN_industrialize_greenland: "그린란드 산업화"
 DEN_industrialize_greenland_desc: "그린란드에는 현재 산업이 많지 않습니다. 이제 그것을 바꿀 시간입니다!"
 DEN_develop_aalborg: "올보르"
 DEN_develop_aalborg_desc: "올보르는 윌란에서 네 번째로 큰 도시이자 두 번째로 큰 도시입니다. 우리 산업을 수용하기 위해 더 발전해야합니다."
 DEN_refugees_welcome: "난민 환영!"
 DEN_refugees_welcome_desc: "With the rising tensions around the world, and the wars happening in the middle east we need to help out those fleeing from war and terror. In short term they will cause political trouble, but in the long run they might be able to help our economy significantly."
 DEN_the_retirement_reform: "은퇴정책 개혁"
 DEN_the_retirement_reform_desc: "노인들은 재정에 대해 걱정할 필요 없이 큰 존경심을 갖고 대우받을 자격이 있습니다."
 DEN_Danish_culture: "덴마크 문화"
 DEN_Danish_culture_desc: "오늘날 우리가 직면하고 있는 가장 힘겨운 문제는 천천히 덴마크 문화에 침범하는 자국에 대한 계속적으로, 일정한 공격입니다. 이러한 문화 다원화를 비방하고 고유 문화와 같은 덴마크의 옜 삶의 좋은 점을 설파해야합니다."
 DEN_restrict_immigration: "이민 제한"
 DEN_restrict_immigration_desc: "덴마크 문화의 보전을 위해 첫번째로 할 일은 외국 영향력을 제한하는 것으로, 가장 효과적인 방법은 이민을 제한하는 것입니다. 인구분포에 심각한 잠재적 문제를 야기할 수도 있겠지만, 우리가 알고 사랑하는 것들을 지키기 위해 충분히 실행할 가치가 있지 않을까요?"
 DEN_outlaw_hijab: "히잡 불법화"
 DEN_outlaw_hijab_desc: "가끔씩, 애국주의자들은 종교적 억압의 상징인 히잡을 쓴 이민자 여성들이 공공에 넓게 처져 있는 것에 대해서 깊은 우려를 표하고 있습니다. 여성들은 '사진의 선택'이라고 말하지만, 누군가가 쓰도록 강요한 것은 아닌가요? 이를 신경쓰지 않더라도 덴마크 문화와는 별개의 것입니다. 널리 퍼지기 전에 히잡을 쓰는 것을 금해야합니다."
 DEN_antagonize_scandinavians: "스칸디나비아 적대"
 DEN_antagonize_scandinavians_desc: "언제나 덴마크는 스칸디나비아의 강대국이었습니다. 산에서 흩어져 사는 원숭이 노르웨이나 확실하게 정치적으로 거세당한 스웨덴을 신경쓰지 않았습니다. 사실상, 저들을 비웃고 낭비에 대해서 농담을 하고 있습니다."
 DEN_conservative_legislation: "보수적인 제정"
 DEN_conservative_legislation_desc: "Our culture and customs must be conserved and kept, we must protect ourselves from outside influence."
 DEN_fund_national_church: "국교회 자금조성"
 DEN_fund_national_church_desc: "덴마크의 복음주의 루터교회는 덴마크에게 있어서 모든 것이지만, 매년 우리의 관심이 점점 더 멀어져가면서 쇠퇴하고 있는 실정입니다. 이러한 사태를 지금당장 뿌리뽑아야 합니다. 조심스러운 계획을 통해서 신도들을 다시금 되돌아오게 할 것입니다!"
 DEN_revive_folk_high_school_movement: "Revive the Folk High School Movement"
 DEN_revive_folk_high_school_movement_desc: "시민 학교는 남녀노소에 관계없이 모든 덴마크 국민들에게 덴마크 문화의 가치를 가져오기 위한 시도로써 시작되었습니다. 이러한 고귀한 목표는 단지 현상유지될 뿐만 아니라 확장시켜야 합니다! 이를 통해서 진정한 덴마크 문화를 퍼뜨릴 수 있을 것입니다."
 DEN_venerate_country: "덴마크 인민당"
 DEN_venerate_country_desc: "덴마크 문화의 진정한 의미를 부흥시킬 때입니다. 지난 수십 년간은 국제주의자와 세계주의자들이 국가 그 스스로 강성해져야 한다는 생각에 의문을 제기했지만, 그 누구도 이러한 이념들이 퍼지기 전이 덴마크, 국민들에게 더 나은 때였다는 것을 알지 못했습니다. 덴마크, 우리 조국을 다시 되살립시다!"
 DEN_venerate_values: "보수인민당"
 DEN_venerate_values_desc: "덴마크 문화의 진정한 의미를 부흥시킬 때입니다. 세계 어느 곳에 있던간에 덴마크인들은 덴마크인입니다. 외국의 땅에서도 가치를 가진 채, 다른 이들을 도울 수는 없을지언정 가치를 표방할 수 있습니다. 덴마크인들에게 이 가치가 진정으로 어떤 의미인지를 지키며 수호해냅시다!"
 DEN_venerate_queen: "여왕"
 DEN_venerate_queen_desc: "It's time to rally to the true foundation of our Danish culture - the Queen. Not only can our royal House trace its roots back to the first kings of Europe, but the Queen herself exudes grace and nobility. Criticized by few, beloved by all, she is the living embodiment of Danish culture and should be treated as such."
 DEN_border_control: "국경 정책을 소개합니다"
 DEN_border_control_desc: "우리 정당 구성원은 때때로 불법 이민자를 덴마크 사회의 심각한 범죄자로 규정해야한다고 주장합니다. 최근에 우리나라를 위한다는 생각이 떠오르면서, 정치 조직들은 우리를 지지할지도 모릅니다. 국경 경비대를 확충하고 난 뒤에라도 이들은 우리를 지지할 것입니다."
 DEN_expand_police_force: "Expand Politi"
 DEN_expand_police_force_desc: "세계가 불길에 휩싸이면서, 민주주의의 적인 범죄자들과 동시에 싸우는 것은 우리에게는 벅찬 일입니다. 집단이건, 국경에서 활동하는 도둑들이던간에 말입니다. 경찰들로 하여금 우리가 어떤 행동이든 승인을 했다고 알려야 합니다. 자국민들은 한밤중에 침대에서 안전하게 잠들어야만 합니다!"
 DEN_abolish_section_19: "19절 제거"
 DEN_abolish_section_19_desc: "덴마크 헌법의 19절은 왕(여왕)은 덴마크 국회(Folketing)의 승인을 받지 아니하고는 어떠한 '대부분'의 정치활동이나 향후 정치에 영향을 끼칠 행동을 하지 못한다라고 규정되어 있습니다. 이 멍청한 규제는 더 이상 전 세계의 지도자들과 하는 회의에서 여왕폐하께 문제가 되지 않을 것입니다. 어린애들처럼 막지 말고 여왕폐하를 믿읍시다."
 DEN_restrict_greenlandic_autonomy: "그린란드 자치권 규제"
 DEN_restrict_greenlandic_autonomy_desc: "그린란드인들은 시간이 지날수록 다시금 자신들의 무능을 보여주면서 너무 과도한 자치권을 가지고 있다는 것을 드러내었습니다. 대신에 저들의 자치권을 제한하고 정신나간 많은 이들을 군대에 징집할 필요가 있습니다. 그 후, 저들을 위해 진정으로 베풀 것입니다."
 DEN_encourage_family_values: "가족 가치관 장려"
 DEN_encourage_family_values_desc: "가족. 유머. 열린 가치관. 믿음. 그리고 유명한 '휘게(Hygge)'. 계속해서 변화하는 세계를 맞이함에도 지켜야할 가치관들입니다. '가족 우선'하는 문화, 그리고 청년들로 하여금 현대사회의 쾌락보다는 아이들을 우선시하라고 장려할 것입니다."
 DEN_draft_new_constitution: "새로운 헌법 재정"
 DEN_draft_new_constitution_desc: "우아한 고귀함에 더해서, 여왕폐하께서는 눈썰미 있고 정치적 감각을 가지고 계십니다. 생득권이셨던 나라를 다스리는데 있어서는 이미 현 집권당보다 더욱 더 능력이 있음을 입증하시었고 많은 이들이 이를 공식화하라고 요구하고 있습니다. 하지만 이는 헌법에 엄청난 변화를 가져오는 일입니다. 새롭게 만드는 것이 더 나을지도 모르겠습니다.."
 DEN_broken_system: "부서진 체제"
 DEN_broken_system_desc: "우리가 맞이하고 있는 가장 힘겨운 문제는 바로 우리 자신입니다. 아주 오래 전에 입증되었듯이, 권력은 어떠한 것도 지키지 못하고 단지 자신들의 이권만을 중요시했습니다. 더 나은 덴마크를 만들기 위한다면, 이들의 겉모습을 벗기고 본성을 드러나게 해야 합니다."
 DEN_fight_nationalists: "국수주의자들과의 대항!"
 DEN_fight_nationalists_desc: "현 체제는 실패했고 이제, 혁명이 모든 것이자 반드시 이루어내야할 숙원입니다! 극국수주의자들만이 혁명에 대항해 우리를 가로막고 있습니다!"
 DEN_state_atheism: "국가 무신론"
 DEN_state_atheism_desc: "국수주의자들은 은밀하게 쫓겨 다니고 있고, 여왕은 추방되고 덴마크 교회는 해산되었습니다. 자국은 반드시 이 '신, 여왕, 국가'라는 세가지 사안, 국가 무신론적이지 않은 것들을 우리나라에서 영원히 없애야 합니다.  우리가 향후 만들 미래는 평등주의, 국제주의와 같은 무신론 국가입니다!"
 DEN_abolish_monarchy: "군주제 폐지"
 DEN_abolish_monarchy_desc: "여왕과 그 관련기관들인 한 때에만 존재했던 흔적일 뿐입니다. 우리는 모두가 평등한 군주가 존재하지 않는 미래를 꿈꾸고 있습니다. 어떠한 방법을 쓰든 여왕은 폐위되고 추방되어야 합니다!"
 DEN_peaceful_revolution: "평화적 혁명"
 DEN_peaceful_revolution_desc: "Our revolution needs not be a bloody one - by emphasizing the democratic aspects of socialism we may encourage our supporters to vote rather than shoot their way to the revolution. Let us make our revolution a peaceful one."
 DEN_raise_unemployment_benefits: "실업자에 대한 지원"
 DEN_raise_unemployment_benefits_desc: "The downtrodden and unemployed are usually a target whenever somebody needs to be blamed for a downturn in the economy. We, however, recognize that being unemployed does not make you less of a citizen than your neighbour."
 DEN_seize_state_power: "국가 장악!"
 DEN_seize_state_power_desc: "기다림의 시간이 결실을 맺었습니다! 노동자의 낙원에 대한 지지자들에게 무장하라고 연락합시다! 정권보다 더욱 더 강력한 힘을 가지고 행군을 하고 항복을 받아낼 때까지는 멈추지 않을 것입니다!"
 DEN_new_foreign_policy: "새로운 외교정책"
 DEN_new_foreign_policy_desc: "덴마크는 국제 사회에서 약소국으로 많은 압력을 받고 있습니다. 하지만, 이래서는 안됩니다. '덴마크'는 데인족들이 두려워하지 않고 개척지와 덴마크 영토를 확장시키는 자랑스러운 이들에게 사용하던 말입니다. 다시 그러한 탐험을 행하고, 다시 위대해질 것입니다!"
 DEN_world_revolution: "세계혁명"
 DEN_world_revolution_desc: "세계의 노동자들이여, 단합하라! 마르크스와 엥겔스가 혁명은 전세계의 혁명을 통해서 이루어낼 수 있다고 분명한 성명서를 내어놓았다. 국수주의자들의 쇠사슬에서 노동자들을 해방할 것이니, 만약 그 수가 작다고 할지라도... 설득을 통해서 말이다."
 DEN_Danelaw: "데인법"
 DEN_Danelaw_desc: "데인법은 역사적으로 앵글로-색슨족에게서 승리를 거둔 잉글랜드 지역에서 실시된 법입니다. 당연하게도, 법은 어리석은 영국인들 모두에게 적용이 되었으며, 이 법을 기꺼이 받아들여 데인법을 재선포할 수 있지 않을까요?"
 DEN_international_diplomacy: "국제 외교"
 DEN_international_diplomacy_desc: "우리는 전 세계에서의 외교적 노력에 투자하기 시작해야 합니다."
 DEN_import_leopards: "표범 수입"
 DEN_import_leopards_desc: "보통, 표범을 수입하는 것은 동물법에 위반되는 행위입니다. 하지만 표범에 한해서 만큼은 예외를 둘 수 있을지도 모릅니다."
 DEN_befriend_germany: "독일과의 친선"
 DEN_befriend_germany_desc: "남쪽 이웃인 독일은 대체로 우리가 중요하지 않다고 생각합니다. 우리가 중요한 존재임을 보여 줍시다."
 DEN_reaffirm_nato: "NATO와의 재확인"
 DEN_reaffirm_nato_desc: "Without the protection of the NATO, we would probably have already disappeared from the globe by the Soviets."
 DEN_leave_nato: "NATO 탈퇴"
 DEN_leave_nato_desc: "We must leave NATO to secure danish position in world politics."
 DEN_befriend_sweden: "스웨덴과 친선"
 DEN_befriend_sweden_desc: "스웨덴은 미트볼을 무척 좋아하는 북쪽의 친구입니다. 그들과 친구가 됩시다."
 DEN_befriend_norway: "노르웨이와 친선"
 DEN_befriend_norway_desc: "북쪽의 거친 바이킹은 더 이상 존재하지 않으며 이제는 친근한 노르웨이 사람들일 뿐입니다. 서로 우호를 다질 기회가 많습니다."
 DEN_befriend_the_baltic_states: "발트 국가들과 친선"
 DEN_befriend_the_baltic_states_desc: "에스토니아, 라트비아, 리투아니아는 우리 무역에 매우 중요합니다. 친구를 만들어 봅시다!"
 DEN_scandinavian_focus: "스칸디나비아 중점"
 DEN_scandinavian_focus_desc: "스칸디나비아 중점"
 DEN_embrace_nordic_cooperation: "북유럽 협력 수용"
 DEN_embrace_nordic_cooperation_desc: "북유럽 협력 수용"
 DEN_terminate_nordic_cooperation: "북유럽 협의회 탈퇴"
 DEN_terminate_nordic_cooperation_desc: "현재 상황에서는 스칸디나비아 국가들과의 더 긴밀한 협력은 불가능해 보입니다."
 DEN_leave_schengen: "센겐조약 탈퇴"
 DEN_leave_schengen_desc: "모든 국가는 자국의 권리를 되찾아야 하며, 엄격한 통제 없이는 누구도 들여보내서는 안 됩니다."
 denmark_focus: "덴마크 중점 계통도"
 DEN_foreign_advisors: "해외 고문단"
 DEN_foreign_advisors_desc: "전술은 변화하고 있고 우리 또한 변해야 합니다."
 DEN_revise_the_doctrine: "덴마크 교리 수정"
 DEN_revise_the_doctrine_desc: "덴마크는 꼭 필요한 경우가 아니라면 다른 나라와 전쟁을 치를 필요가 없었습니다. "
 DEN_liquidate_old_stockpiles: "구형 비축물 처분"
 DEN_liquidate_old_stockpiles_desc: "이제 매일 새 소총이 기지에 도착하고 있어, 병참 장교들이 기존 재고를 처분할 수 있도록 도움을 요청하고 있습니다. 근동과 아프리카의 끝없는 소형 화기 수요는 이를 팔기에 안성맞춤인 곳으로 보입니다."
 DEN_maersk: "머스크"
 DEN_maersk_desc: "머스크는 1904년으로 거슬러 올라가는 덴마크의 거대 해운 회사이며, 우리는 해군을 위해 이 회사의 생산 시설과 조선소를 징발할 것입니다"
 DEN_coastal_forts: "요새 덴마크"
 DEN_coastal_forts_desc: "세계의 긴장이 고조됨에 따라, 해상 침공에 대비해 항구를 지키기 위한 벙커와 방어 진지를 건설할 필요가 있다고 판단했습니다"
 DEN_renew_foreign_contracts: "해외 계약 갱신"
 DEN_renew_foreign_contracts_desc: "우리 산업은 필요한 모든 것을 생산하기에는 분명 너무 작으므로, 우리는 해외 공급업체에 의존하고 있습니다."
 DEN_karup_air_base: "카루프 공군 기지 확장"
 DEN_karup_air_base_desc: "카루프 공군 기지는 이미 덴마크가 보유한 최대의 군용 공군 기지이지만, 우리는 이를 확장해야 하며 외국 항공기에만 계속 의존할 수는 없으므로 자체 생산해야 합니다"
 DEN_SOF: "덴마크 특수부대"
 DEN_SOF_desc: "덴마크 특수부대는 사냥꾼 군단 \\"예게르코르프셋\\", 잠수부 군단 \\"프뢰만스코르프셋\\", 그리고 시리우스 개썰매 순찰대로 구성됩니다. 규모는 작지만 이들은 전 세계에서 활동해 왔으며, 이제 우리는 이 소규모 정예들이 임무를 수행하는 데 필요한 장비를 갖추도록 해야 합니다"
 DEN_develop_fyn: "퓐 개발"
 DEN_improve_danish_roads: "덴마크 농촌 개선"
 DEN_improve_danish_roads_desc: "우리는 덴마크를 택했으며, 따라서 덴마크 국민에게 한 약속을 지키고 그들에게 투자해야 합니다. 도로망을 확장함으로써 많은 사람이 일상생활에서 더 쉽게 이동할 수 있게 될 것입니다"
 DEN_danish_military: "덴마크 국방군"
 DEN_danish_military_desc: "\\"덴마크 국방군\\", 즉 Det Danske Forsvar는 언제나 덴마크 국민당과 보수국민당의 큰 지지를 받아 왔습니다. 이제 현역 군인들에게 한 약속을 지키고 그들에게 필요한 모든 것을 갖추도록 할 때입니다"
 DEN_danish_civilian_industry: "덴마크 민간 산업"
 DEN_danish_civilian_industry_desc: "우리는 덴마크 국민에게 일자리가 있도록 해야 하며, 덴마크 내 외국 제품에 대한 세금을 올려 이를 이루겠습니다. 그렇게 하면 덴마크 기업이 더 지속 가능해지고 더 값싼 동방의 외국 대안과 더 잘 경쟁할 수 있게 될 것입니다"
 DEN_communist_propaganda: "공산주의 선전"
 DEN_communist_propaganda_desc: "공산주의가 실제로 얼마나 훌륭한지 국민에게 알려야 합니다!"
 DEN_path_of_true_equality: "진정한 평등의 길"
 DEN_remember_history: "영광의 귀환"
 DEN_remember_history_desc: "우리는 한때 칼마르 연합을 이끌었으며, 강제로라도 다시 그렇게 할 것입니다."
 DEN_slesvig_holstein: "슬레스비그-홀스타인"
 DEN_slesvig_holstein_desc: "슬레스비그-홀스타인 주민들은 독일 공화국에 남기로 투표했을지 모르지만, 우리는 그 선거가 조작되었다고 확신합니다. 이제 그들을 덴마크의 뿌리로 되돌릴 때입니다."
 DEN_ancient_history: "1219"
 DEN_ancient_history_desc: "우리는 한때 에스토니아에 발트해 교두보를 가지고 있었으며, 1219년에는 에스토니아에서 단네브로가 우리에게 내려오기까지 했습니다. 옛 에스토니아의 국경은 달라졌지만, 그것은 말장난에 불과합니다."
 DEN_finlands_history: "스웨덴? 핀란드? 덴마크?"
 DEN_finlands_history_desc: "스웨덴이 칼마르 연합의 일원이었을 때 그들은 핀란드 영토도 지배하고 있었으며, 당시 핀란드 지역은 오늘날 러시아가 자국 영토라고 믿는 곳의 일부까지 뻗어 있었습니다."
 DEN_viking_age: "바이킹 시대"
 DEN_viking_age_desc: "(임시 효과) 바이킹 시대에 우리는 셰틀랜드 제도, 오크니 제도, 채널 제도의 형태로 잉글랜드 북부에 교두보를 가지고 있었으며, 이곳은 우리 약탈의 집결지로 사용되었습니다. 그곳은 다시 그런 곳이 될 수 있습니다."
 DEN_danelaw: "데인로"
 DEN_danelaw_desc: "데인로는 노르드인이 지배하던 잉글랜드의 지역이었습니다. 우리는 이 땅을 이전에도 차지했으며, 다시 차지할 것입니다."
 DEN_private_industry: "덴마크 민간 산업"
 DEN_private_industry_desc: "덴마크가 지역 내 강국의 위치로 올라선 만큼, 덴마크에서 사업을 시작하는 것이 매력적이도록 만들 때입니다."
 DEN_nordic_films: "노르디스크 필름"
 DEN_nordic_films_desc: "노르디스크 필름은 1906년 11월 6일 코펜하겐의 발뷔 지구에서 설립되었습니다. 오늘날 이 회사는 영화를 제작할 뿐 아니라 덴마크 내 많은 극장도 운영하고 있습니다."
 DEN_restarting_Schultz_larsen: "슐츠 & 라르센"
 DEN_restarting_Schultz_larsen_desc: "슐츠 & 라르센은 1919년에 설립된 덴마크의 무기 제조업체였으나, 제2차 세계 대전 이후에는 주로 사냥 장비를 생산하게 되었습니다. 이제 이들을 본래의 궤도로 되돌려 덴마크군이 사용할 무기를 만들게 할 때입니다."
 DEN_DISA: "DISA"
 DEN_DISA_desc: "덴스크 레킬 리플 신디카트 A/S로 설립되어 이후 덴스크 인더스트리 신디카트 A/S(DISA)로 개명한 이 회사는 제2차 세계 대전 이후 전 세계에서 쓰이는 무기를 생산해 왔으나, 슐츠 & 라르센과 마찬가지로 전후에 쇠퇴했습니다. 이제 이들이 사업을 확장하고 무기 생산을 재개하도록 독려하여 덴마크군이 덴마크산 무기를 보급받을 수 있게 할 때입니다."
 DEN_novo_nordisk: "노보 노르디스크"
 DEN_novo_nordisk_desc: "노보 노르디스크는 인슐린, 혈우병 치료제, 성장 호르몬, 성호르몬을 생산하는 덴마크의 제약 회사이며, 이와 별개로 시가 총액 기준으로 덴마크 최대의 기업으로서 머스크의 거의 두 배 규모입니다."
 DEN_vestas: "베스타스 윈드 시스템즈"
 DEN_vestas_desc: "베스타스는 덴마크 4위의 기업으로, 원래 대장간 사업으로 의도되어 1898년에 설립되었으나 1970년대 석유 위기에 이르러서야 오늘날과 같은 세계적인 풍력 발전기 제조업체로 발전했습니다."
 DEN_skandinavisk_aero_industri: "스칸디나비스크 아에로 인더스트리"
 DEN_skandinavisk_aero_industri_desc: "스칸디나비스크 아에로 인더스트리는 항공기 생산에 주력했던 단명한 덴마크 기업(1937-1954)이었습니다. 지역 강국의 지위를 얻은 이상, 이제 우리 자체의 항공기를 생산할 방법을 마련하고 이 산업을 재가동할 때입니다."
 denmark.1.a: "날아라, 베이비, 날아라!"
 denmark.2.t: "[DEN.GetAdjective] 보수당의 대승 예측"
 denmark.2.d: "[DEN.GetAdjective] 보수당은 90년대 초반부터 쇠퇴해 왔으나 개선장군처럼 화려하게 복귀한 것으로 보입니다. 이러한 상황 변화의 이유를 묻자 한 정치 평론가는, 새천년의 국제적 문화 교류가 많은 덴마크인을 어디에도 소속감을 느끼지 못하고 표류하게 했으며 덴마크의 가치를 정치 담론의 중심에 올려놓은 듯하다고 논평했습니다. 보수당 지도부는 '우리를 [DEN.GetAdjective]답게 만드는 모든 것'에 대한 흔들림 없는 수호를 강조하는 연설로 이 새로운 지지를 활용할 채비를 이미 갖추고 있습니다."
 denmark.2.a: "백 투 더 80년대"
 denmark.3.t: "[DEN.GetName]의 놀라운 군주제 지지 동향"
 denmark.3.d: "[DEN.GetName](은)는 1849년부터 입헌 군주국이었으며 그 이후로 군주의 역할은 대체로 의례적인 성격에 머물러 왔습니다. 그러나 [DEN.GetAdjective] 군주에게 더 큰 정치적 자율성을 부여할 것을 요구하는 새로운 군주제 운동이 대중 사이에서 빠르게 힘을 얻고 있습니다. 지금까지 여왕 본인은 이 문제에 대해 공개적으로 언급하지 않았지만, 정치 평론가들은 소르본과 런던 정치경제대학교에서 정치학과 여러 학문 분야를 공부한 그녀의 학력을 볼 때 이론상 정치 무대에서 유능한 행위자가 될 수 있을 것이라고 지적했습니다."
 denmark.3.a: "오, 데이지!"
 denmark.18.t: "이끄는 왕세자"
 denmark.18.d: "프레데리크는 머지않아 군의 고삐를 쥘 것으로 예상되며, 이전의 폭넓은 군사 훈련 경력으로 볼 때 덴마크가 오랜만에 맞이하는 최고의 장군 중 한 명이 될 것으로 기대됩니다. 프레데리크의 남동생 요아킴 역시 육군 장교로 복무한 경력이 있어 다시 군에 합류할 것으로 예상됩니다."
 denmark.18.a: "우리를 위대함으로 이끄소서"
 denmark.19.t: "매입 제안"
 denmark.19.d: "덴마크가 한때 덴마크 왕국에 속했다는 이유로 영국에 셰틀랜드 제도와 오크니 제도, 그리고 채널 제도를 매입하겠다는 제안을 해 왔습니다."
 denmark.19.a: "좋소, 어차피 우리는 그 섬들이 마음에 들지 않았소"
 denmark.19.b: "그런 일은 절대 없을 것이오"
 denmark.20.t: "프레데리크 10세 국왕"
 denmark.20.d: "오늘 마르그레테 2세 여왕이 덴마크 여왕직에서 물러난다고 발표했으며, 국가의 통치권을 장남인 프레데리크 10세 국왕에게 넘깁니다."
 denmark.20.a: "만수무강하소서"
 denmark.21.t: "개편된 칼마르 연합"
 denmark.21.d: "오늘 덴마크는 옛 칼마르 연합을 개편하여 북유럽과 발트 국가 간의 협력을 강화하려 시도했으며, 이번에는 이미 덴마크와 긴밀히 협력하고 있는 발트 국가들에게도 초청장을 보냈습니다."
 denmark.21.a: "수락합니다"
 denmark.21.b: "그런 일은 일어나지 않을 것입니다"
 denmark.39.t: "아이슬란드를 연합에 초청"
 denmark.39.d: "덴마크가 스칸디나비아 연합 가입 초청장을 보내왔습니다. 수락하면 우리는 스칸디나비아의 공산 진영의 일부가 됩니다."
 denmark.39.a: "좋습니다!"
 denmark.39.b: "절대 안 됩니다!"
 denmark.40.t: "스웨덴을 연합에 초청"
 denmark.40.d: "덴마크가 스칸디나비아 연합 가입 초청장을 보내왔습니다. 수락하면 우리는 스칸디나비아의 공산 진영의 일부가 됩니다."
 denmark.40.a: "좋습니다!"
 denmark.40.b: "절대 안 됩니다!"
 denmark.41.t: "노르웨이를 연합에 초청"
 denmark.41.d: "덴마크가 스칸디나비아 연합 가입 초청장을 보내왔습니다. 수락하면 우리는 스칸디나비아의 공산 진영의 일부가 됩니다."
 denmark.41.a: "좋습니다!"
 denmark.41.b: "절대 안 됩니다!"
 denmark.42.t: "핀란드를 연합에 초청"
 denmark.42.d: "덴마크가 스칸디나비아 연합 가입 초청장을 보내왔습니다. 수락하면 우리는 스칸디나비아의 공산 진영의 일부가 됩니다."
 denmark.42.a: "좋습니다!"
 denmark.42.b: "절대 안 됩니다!"
 denmark.22.t: "외레순 대교"
 denmark.22.d: "셸란섬과 스코네를 연결하기 위한 공사가 1995년에 시작되었으며, 그 의도는 유럽 나머지 지역에서 북쪽으로 오가는 무역을 더 쉽게 하는 것이었습니다. 덴마크와 스웨덴은 모두 양국 간의 국경 및 여권 검사를 없앤 솅겐 협정에 서명했습니다."
 denmark.22.a: "스코네는 덴마크 땅이다!"
 denmark.23.t: "툴레 공군 기지"
 denmark.23.d: "덴마크와 미국이 그린란드에 위치한 툴레 공군 기지를 현대화하는 협정을 체결했습니다. 제2차 세계 대전 중 독일이 덴마크를 점령하던 당시, 미국 주재 덴마크 대사는 미국이 독일의 모든 공격으로부터 덴마크 식민지 그린란드를 방어하는 것을 허용하는 협정을 미국과 맺었고, 이것이 툴레 공군 기지 건설의 계기가 되었습니다. 그 이후 이 기지는 미국의 통제 아래 계속 운영되어 왔습니다."
 denmark.23.a: "부디 그들이 그린란드를 사려 들지 않기를"
 denmark.24.t: "한스섬"
 denmark.24.d: "한스섬은 북극에 있는 무인 불모의 바위섬으로, 덴마크와 캐나다가 누가 정당한 소유자인지를 두고 분쟁을 벌여 왔습니다. 분쟁은 1933년부터 이어지고 있습니다. 1984년 한 덴마크 장관이 섬에 덴마크 국기를 꽂고 슈납스 한 병을 남겼으며, 그 이후 \\"정복자\\"가 섬에 자국 국기와 술 한 병을 남기는 것이 전통이 되었습니다."
 denmark.24.a: "유럽의 캐나다"
 denmark.25.t: "무함마드 만평"
 denmark.25.d: "덴마크 신문 \\"윌란스포스텐\\"이 최근 쿠르트 베스터고르가 그린, 터번에 폭탄을 두른 예언자 무함마드를 묘사한 만평을 게재했습니다. 이 일은 이슬람 세계 전체에 분노를 불러일으켰으며, 여러 나라가 덴마크 제품을 금지했습니다."
 denmark.25.a: "하지만... 표현의 자유는?"
 denmark.26.t: "이라크 철수"
 denmark.26.d: "덴마크 정부가 이라크에서 자국 병력을 철수한다고 발표했습니다. 덴마크는 2003년 침공에 참여한 최초의 연합 국가 중 하나였습니다."
 denmark.26.a: "우리는 왜 싸우기로 했을까?"
 denmark.27.t: "쿠르트 베스터고르 암살 음모"
 denmark.27.d: "덴마크 경찰이 예언자 무함마드 만평의 원작자인 쿠르트 베스터고르를 암살하려는 음모를 적발했으며, 이로 인해 다른 신문이 무함마드 만평을 다시 게재하여 또다시 시위가 일어나고 있습니다."
 denmark.27.a: "또 시작이군.."
 denmark.28.t: "북극 군사 사령부"
 denmark.28.d: "빙하가 녹으면서 그린란드와 그 주변 해역이 새롭게 열린 \\"전장\\"이 되었으며, 이에 따라 덴마크는 다가올 시대에 대처할 기동부대를 편성했습니다."
 denmark.28.a: "부디 얼음이 너무 많이 녹지 않기를"
 denmark.29.t: "코펜하겐 정상회의"
 denmark.29.d: "2009년 코펜하겐에서 기후 회의가 열렸습니다. 확정적인 결론에는 이르지 못했지만, 정상회의 전체가 덴마크 경제에 도움이 되었고 우리가 국제 사회의 레이더에 다시 포착되게 해 주었습니다."
 denmark.29.a: "누군가 우리를 알아봤다!"
 denmark.30.t: "쿠르트 베스터고르 습격"
 denmark.30.d: "금요일 늦은 밤, 28세의 소말리아 남성이 도끼로 쿠르트 베스터고르를 살해하려고 그의 집에 침입을 시도했습니다. 현재 74세인 쿠르트 베스터고르는 손녀를 감싼 채 집 안 욕실에 숨었습니다. 더 큰 일이 벌어지기 전에 경찰이 도착했으며, 체포에 저항하는 습격범을 제압하기 위해 무릎과 손에 총격을 가했습니다."
 denmark.30.a: "세상이 어찌 되려는 건가?"
 denmark.31.t: "윌란스포스텐 본사 공격 저지"
 denmark.31.d: "경찰이 무함마드 만평 게재 때문으로 추정되는, 윌란스포스텐 본사에서 벌어질 예정이던 공격을 적발하여 저지했습니다."
 denmark.31.a: "예산 지출 없는 효율적인 경찰"
 denmark.32.t: "국경 통제 재도입"
 denmark.32.d: "불법 이민에 더 잘 대응하기 위해 덴마크가 국경 통제를 재도입했습니다. 서유럽 대부분의 지역에서 역내 국경을 폐지한 1995년 솅겐 협정에 비추어 많은 국가가 이 조치의 적법성에 의문을 제기했습니다."
 denmark.32.a: "빌어먹을 덴마크인들, 덴마크를 망쳐 놓았군"
 denmark.33.t: "동성 결혼"
 denmark.33.d: "2012년 6월 덴마크는 동성 결혼을 합법화하기로 결정했으며, 이는 국민의 큰 지지를 받았습니다. 그러나 일부 보수적인 사제들은 이것이 \\"교회 가치의 근본\\"에 어긋난다고 주장하며 반대 목소리를 냈습니다."
 denmark.33.a: "형제는 무엇보다...."
 denmark.34.t: "교원 노조"
 denmark.34.d: "덴마크 교원 노조가 학년 일정을 짜는 방식을 둘러싼 분쟁으로 학교를 폐쇄하기로 결정했습니다. 교사들이 근무 시간의 40%만 실제로 학생을 가르치고 나머지는 준비에 쓴다는 사실이 앞서 입증된 바 있습니다."
 denmark.34.a: "하지만 우리 애들이 집에 있는 건 싫은데?"
 denmark.35.t: "덴마크의 테러"
 denmark.35.d: "2015년 2월 초, 코펜하겐에서 세 건의 별개 총격 사건이 발생했습니다.\n\n첫 번째 총격은 당시 표현의 자유 행사가 열리고 있던 크루트퇴넨 카페에서 일어나 영화감독 핀 뇌르고르가 사망했습니다.\n\n두 번째 총격은 대회당에서 일어나 자원봉사 경비원 단 우잔이 사망했습니다.\n\n세 번째 총격은 한 아파트 건물에서 일어났으며, 덴마크 경찰이 범인을 확인하고 총격전을 벌여 그를 사살했습니다.\n\n이번 공격으로 3명이 목숨을 잃고 경찰관 5명이 부상을 입었습니다. 범인은 팔레스타인계 남성 오마르 압델 하미드 엘후세인으로, 평생 법적 문제를 일으켜 왔으며 공격 전 극단주의 단체 ISIS에 충성을 맹세했다고 알려졌습니다."
 denmark.35.a: "어떻게 덴마크에서 이런 일이 일어날 수 있단 말인가?"
 denmark.36.t: "난민 신청자의 귀중품 압수"
 denmark.36.d: "난민 신청자가 늘어나면서 긴장이 고조되고 있습니다. 이 사태는 우리 정부를 딜레마에 빠뜨렸습니다. 일부 난민 신청자의 체류 비용을 충당하는 방편으로 그들의 귀중품을 압수해야 할까요, 아니면 하지 말아야 할까요?"
 denmark.36.a: "손 들고 가진 돈을 다 내놓으시오!"
 denmark.36.b: "말도 안 되는 소리다!"
 denmark.37.t: "혐오 발언 금지"
 denmark.37.d: "덴마크는 정부가 \\"혐오 발언을 설파한다\\"고 판단한 기독교 외국인 설교자 1명과 이슬람교 외국인 설교자 여러 명의 입국을 금지하기로 결정했습니다."
 denmark.37.a: "그건 휘게하지 않아!"
 denmark.38.t: "고대의 신성모독법"
 denmark.38.d: "덴마크 의회는 종교적 신념이나 예배에 대한 공개적 모욕을 금지하는 고대의 신성모독법을 폐지하기로 결정했습니다."
 denmark.38.a: "표현의 자유가 승리했다!"
 denmark.4.t: "전투기 보유량"
 denmark.4.d: "우리의 전투기 보유량이 상당히 부족합니다. 우리에게는 첨단/현대 전투기를 제대로 꾸준히 공급할 군수 산업이 없습니다. 세력 지도국에 연락하여 전투기 추가 대량 구매를 협상해 보는 것이 최선일지도 모릅니다.\n"
 denmark.4.o1: "미국에 전투기를 요청한다"
 denmark.4.o2: "러시아에 전투기를 요청한다"
 denmark.4.o3: "지금은 사실 그럴 여유가 없다"
 denmark.5.t: "복지 상태를 비판하는 [DEN.GetAdjective] 자유주의자"
 denmark.5.d: "이번 주 초 [DEN.GetAdjective] 사회는 자유당이 '최소 국가'를 위해 [DEN.GetAdjective] 복지국가의 해체를 공개적으로 요구하는 것을 듣고 충격에 빠졌습니다. 자유당은 선두에 나서 전체는 아니더라도 우파 최대 정당이 될 태세로 보이며, 실제로는 복지국가를 아예 해체하기보다 재정 지원을 삭감하는 정도에 그칠 가능성이 높지만, 이는 노르딕 모델에 대한 최소국가주의자의 선전포고로 받아들여지고 있습니다."
 denmark.5.o1: "서 있지 못하는 것은 무너지게 두자"
 denmark.6.t: "[DEN.GetAdjective] 국민당 지지율 상승"
 denmark.6.d: "최근의 정치 동향은 외래의 영향으로부터 [DEN.GetAdjective] 문화를 지키는 데 더 큰 초점이 맞춰지고 있음을 보여 줍니다. 이것이 무엇을 의미하느냐에 대해 많은 덴마크인은 [DEN.GetAdjective] 문화가 무엇보다 [DEN.GetName]의 역사에 대한 자부심을 포함한다고 여기는 듯하며, 끊임없는 진보주의와 문화 상대주의, 세계주의를 멈추고 '덴마크 우선' 교리로 더 반동적으로 회귀할 것을 요구합니다. 이러한 흐름은 [DEN.GetName]의 전통주의와 국가적 자부심의 수호자로 많은 이가 여기는 [DEN.GetAdjective] 국민당에게 좋은 소식이었습니다."
 denmark.6.o1: "덴마크를 우리에게 돌려달라"
 denmark.7.t: "[DEN.GetAdjective] 보수당의 대승 예측"
 denmark.7.d: "[DEN.GetAdjective] 보수당은 90년대 초반부터 쇠퇴해 왔으나 개선장군처럼 화려하게 복귀한 것으로 보입니다. 이러한 상황 변화의 이유를 묻자 한 정치 평론가는, 새천년의 국제적 문화 교류가 많은 덴마크인을 어디에도 소속감을 느끼지 못하고 표류하게 했으며 덴마크의 가치를 정치 담론의 중심에 올려놓은 듯하다고 논평했습니다. 보수당 지도부는 '우리를 [DEN.GetAdjective]답게 만드는 모든 것'에 대한 흔들림 없는 수호를 강조하는 연설로 이 새로운 지지를 활용할 채비를 이미 갖추고 있습니다."
 denmark.7.o1: "백 투 더 80년대"
 denmark.8.t: "[DEN.GetName] 왕위 계승자 프레데리크 왕세자의 결혼식"
 denmark.8.d: "프레데리크 왕세자는 결혼하기에 좋은 나이입니다. 그의 진정한 사랑은 오스트레일리아 평민에게 있지만, 우리는 이 결혼을 다른 북유럽 군주 가문에 대한 영향력을 높이는 데 이용할 수도 있습니다."
 denmark.9.t: "[DEN.GetName], 계엄령 선포!"
 denmark.9.d: "최근 [DEN.GetAdjective] 정치의 급진적 변화를 요구하는 대규모 시위가 잇따른 끝에, 상황은 이제 전국적인 전면 폭동으로 번졌으며 [DEN.GetLeader](은)는 질서 유지를 위한 경찰과 군의 역량을 확대하기 위해 계엄령을 선포할 수밖에 없었습니다.\n\n유럽 대부분은 북쪽의 작은 이웃 나라가 전국적인 폭동에 휩싸인 것을 믿기 어렵다는 듯 지켜보며 누가 승기를 잡을지 궁금해하고 있습니다. 누가 이기든 지금 시점에서 대규모 변화는 확실합니다."
 denmark.9.o1: "병력을 투입하라!"
 denmark.11.t: "극단적 [DEN.GetAdjective] 민족주의자들, 영향력 모색"
 denmark.11.d: "극우의 애국 단체들이 이념적 차이를 제쳐 두고 [DEN.GetAdjective] 민족주의자들의 통일 전선을 결성한 것으로 보입니다. 평소 제각각이던 이 단체들은 [DEN.GetName] 민족이 세계의 다른 모든 민족보다 우월하다는 공통된 믿음, 그리고 새로운 [DEN.GetName](이)가 [DEN.GetAdjective] 역사 내내 세계가 이 민족에게 저지른 수많은 잘못을 바로잡아야 한다는 강한 믿음으로 뭉쳤습니다.\n\n이 단체들의 언사는 이미 [DEN.GetName]의 여러 이웃 나라에 우려를 불러일으키고 있으며, 역사적으로 [DEN.GetAdjective]에게는 그들에게 원한을 품을 이유가 충분합니다."
 denmark.11.o1: "온 세상 가운데 그 한구석이 내게는 가장 아름답게 미소 짓는다"
 denmark.13.t: "극단적 국제주의자들의 [DEN.GetAdjective] 정부 관리 공격!"
 denmark.13.d: "최근 선포된 계엄령은 [DEN.GetName]의 부패한 정부를 전복하려는 국제주의 세력에게 오히려 활력을 불어넣은 듯하며, 분쟁 내내 혁명적 국제주의 세력과 스스로를 애국자로 칭하는 반혁명 세력 사이에서 여러 차례 충돌이 보고되었습니다. 오늘 국제주의자들은 이론의 여지가 없는 승자로 섰으며, [DEN.GetLeader]의 현 정부는 승자들의 요구가 정해질 때까지만 임시 과도 정부로 존속하겠다고 이미 발표했습니다."
 denmark.13.o1: "국가가 없다고 상상해 보라 - 노력하면 쉬운 일이다"
 denmark.17.t: "[DEN.GetName]의 혁명!"
 denmark.17.d: "최근 [DEN.GetName]에서 이루어진 수많은 혁명적 행동은 이미 나라에 큰 변화를 가져왔으나, 혁명위원회 위원들이 혁명을 열어젖힐 수단을 두고 의견이 갈리면서 활동이 최근 멈춰 섰습니다. 오늘 무장봉기를 주장하던 강경파가 승리했음이 분명해졌으며, 코펜하겐에서 은행가와 정치인에 대한 폭력적 습격이 벌어지고 있다는 보도가 이미 들어오고 있습니다. 한편 혁명위원회의 온건파 목소리는 실종된 것으로 보고되었으며, 죽었거나 숨어 있다는 소문이 돕니다. 한 정치 평론가는 혁명이 피를 부르는 운명인 듯하며 그만한 가치가 있었는지는 시간이 지나야 알 수 있을 것이라고 씁쓸하게 논평했습니다."
 denmark.17.o1: "만국의 노동자여, 단결하라!"
 denmark_news.1.t: "마르그레테 2세의 퇴위"
 denmark_news.1.d: "덴마크 내 좌익 극단주의의 증가로 인한 압력 때문에 [DEN.GetAdjective] 여왕이 왕위에서 물러나기로 했다는 소식이 덴마크에서 전해졌습니다. 덴마크 공산당(DKP) 지지자들은 낡은 질서의 마지막 보루 중 하나가 마침내 제거되었다며 기쁨 속에 거리로 나섰습니다. 전 여왕은 영국의 윈저 왕가에 피신했습니다.\n"
 denmark_news.1.o1: "우리 왕관이 걱정된다"
 denmark_news.1.o2: "속이 시원하다!"
 denmark_news.1.o3: "흥미로운 전개로군."
 DEN_idea_joint_material_command: "합동 물자 사령부"
 DEN_idea_joint_material_command_desc: "새로 창설된 합동 물자 사령부가 국내 절차를 간소화하여 더 효과적인 무기 조달을 가능하게 합니다."
 DEN_idea_streamline_infantry_production: "보병 장비 생산 간소화"
 DEN_idea_streamline_infantry_production_desc: "보병 장비를 간소화하면 우리가 참전할 수 있는 장래의 분쟁에 군을 더 잘 대비시킬 수 있습니다."
 DEN_idea_streamline_naval_production: "해군 생산 간소화"
 DEN_idea_streamline_naval_production_desc: "덴마크는 해군 생산을 간소화하는 개혁을 시행하여 함선 건조의 효율을 높이고 비용을 줄이며 해양 방어 능력을 강화합니다."
 DEN_immigrants_must_work_idea: "이민자 노동 개혁"
 DEN_immigrants_must_work_idea_desc: "덴마크는 훈련과 지원을 제공하여 고용 기회를 높이는 개혁을 통해 이민자의 노동 인력 통합을 촉진합니다."
 DEN_the_retirement_reform_idea: "은퇴 개혁"
 DEN_the_retirement_reform_idea_desc: "덴마크는 인구 구조의 도전에 대응하기 위해 연금 수급 자격과 은퇴 연령 기준을 조정하여 은퇴 급여의 장기적 지속 가능성을 보장합니다."
 DEN_idea_greenlandic_conscripts: "그린란드 징집병"
 DEN_idea_greenlandic_conscripts_desc: "그린란드는 기후 때문에 혹독한 지역으로 알려져 있습니다."
 DEN_idea_margrethe: "마르그레테 2세 여왕"
 DEN_idea_margrethe_desc: "마르그레테 2세 여왕은 국가 원수로서 계속해서 덴마크의 입헌 군주제와 문화유산을 상징합니다."
 DEN_idea_state_atheism: "국가 무신론"
 DEN_idea_state_atheism_desc: "덴마크는 국가 무신론을 채택하여 종교를 정부 업무에서 분리하고 공공 기관에서 세속주의를 촉진했습니다."
 DEN_idea_neutrality_drift: "덴마크의 중립"
 DEN_idea_neutrality_drift_desc: "덴마크는 중립을 유지하며 국제 분쟁과 동맹에 개입하지 않고 외교와 평화적 해결을 우선시합니다."
 DEN_for_faedre_landet: "조국을 위하여!"
 DEN_for_faedre_landet_desc: "시민들이 \\"조국을 위하여!\\"라는 깃발 아래 결집하면서 애국적 열기가 덴마크를 휩쓸고 있으며, 국내외의 도전 앞에서 국가적 단결과 연대를 촉진합니다."
 DEN_public_service_investment: "은행 구제"
 DEN_public_service_investment_desc: "덴마크는 금융 부문을 안정시키기 위해 결단력 있는 조치를 취하여, 어려움에 처한 은행을 구제하고 경제의 안정을 지키는 대책을 시행합니다."
 DEN_idea_monarchy_drift: "군주제의 권한"
 DEN_idea_monarchy_drift_desc: "덴마크 군주제는 헌법상의 권한을 행사하여 국정에서 중추적 역할을 하며 덴마크의 정체성과 전통을 통합하는 상징으로 기능합니다."
 DEN_idea_militarization: "군부가 군주제를 지지한다"
 DEN_idea_militarization_desc: "덴마크 육군은 군주제에 충성을 서약하여 국가 주권과 안정의 수호자로서의 역할을 강화합니다."
 DEN_military_build_up: "덴마크 전쟁 기계"
 DEN_military_build_up_desc: "덴마크는 군사 능력을 강화하고 현대화와 확장에 투자하여 강력한 방위 체계를 구축함으로써 국가의 안보와 방어 태세를 보장합니다."
 DEN_communist_gains: "공산주의의 약진"
 DEN_communist_gains_desc: "공산주의 이념이 덴마크에서 힘을 얻어 논쟁을 일으키고 정치 담론을 재편하고 있으며, 좌파 운동이 추진력과 영향력을 얻고 있습니다."
 DEN_idea_refugees_welcome: "난민 유입"
 DEN_idea_refugees_welcome_desc: "덴마크는 상당한 규모의 난민 유입을 겪고 있으며, 이는 통합과 사회 결속에 도전과 기회를 모두 안겨 줍니다."
 DEN_idea_nordisk_film: "노르디스크 필름"
 DEN_idea_nordisk_film_desc: "덴마크 영화와 극장에 대한 추가 지원으로 우리는 덴마크 국민의 추가적인 지지를 얻을 수 있습니다."
 DEN_idea_equality: "진정한 평등"
 DEN_idea_equality_desc: "덴마크는 진정한 평등을 추구하며, 성별, 민족, 배경과 관계없이 모든 시민에게 평등한 기회와 권리를 증진하는 정책과 이니셔티브를 시행합니다."
 DEN_idea_schultz_larsen: "슐츠 라르센"
 DEN_idea_schultz_larsen_desc: "화기와 소총으로 알려진 슐츠 라르센사는 계속해서 덴마크 제조업의 초석으로서 국내외에 양질의 제품을 공급합니다."
 DEN_idea_DISA: "DISA"
 DEN_idea_DISA_desc: "덴마크 최고의 IT 서비스 제공업체인 DISA는 국가 디지털 인프라를 현대화하고 사이버 보안 조치가 견고하고 효과적이도록 보장하는 데 중요한 역할을 합니다."
 DEN_idea_conservative: "보수 사회"
 DEN_idea_conservative_desc: "덴마크는 전통, 가족, 안정을 중시하며 사회적, 문화적 변화를 신중하게 헤쳐 나가는 보수 사회로서의 위상을 유지합니다."
 develop_infrastructure_greenland: "그뢴란 인프라 개발"
 develop_infrastructure_greenland_desc: "그린란드에는 인프라가 거의 없습니다. 이 광활한 땅을 제대로 활용하려면 먼저 거친 자연을 길들이고 교통을 편리하게 만들어야 합니다."
 develop_infrastructure_faeroerne: "페뢰에르네 인프라 개발"
 develop_infrastructure_faeroerne_desc: "인구가 적은 탓에 제도의 인프라는 예상할 수 있는 수준에 머물러 있습니다. 대규모 광업을 시작하려면 우리의 필요에 맞게 도로를 개발해야 합니다."
 develop_oil_greenland: "그뢴란 및 그 주변의 석유"
 develop_oil_greenland_desc: "지구 온난화로 그린란드와 그 주변에서 석유가 모습을 드러냈습니다. 이제 이를 우리에게 이롭게 활용해 볼 때입니다."
 develop_resources_faeroerne: "페뢰에르네 채굴"
 develop_resources_faeroerne_desc: "페로 제도는 우리 덴마크인들에게 별로 관심의 대상이 된 적이 없지만, 이제 그 땅을 파서 그 아래 숨은 보물이 있는지 확인해 볼 때입니다."
 develop_resources_greenland: "그뢴란 채굴"
 develop_resources_greenland_desc: "지구 온난화 덕분에 그린란드와 그 주변에서 이전에는 알려지지 않았던 자원이 드러났습니다. 이제 땅 아래에 무엇이 있는지 파 보기 시작할 때입니다."
 spread_communism_sweden: "스웨덴의 공산주의"
 spread_communism_sweden_desc: "스웨덴은 덴마크 역사 내내 우리의 가장 큰 경쟁자였습니다. 2000년대 들어 협력 관계는 좋았지만, 우리는 스웨덴에서도 인민이 권력을 잡도록 해야 합니다."
 spread_communism_norway: "노르웨이의 공산주의"
 spread_communism_norway_desc: "노르웨이는 오랫동안 우리 왕국의 일부였습니다. 덴마크에서 인민이 이끌 수 있다면 노르웨이에서도 분명 권력을 잡고 국가를 이끌 수 있습니다."
 spread_communism_finland: "핀란드의 공산주의"
 spread_communism_finland_desc: "핀란드는 소련이라는 거대한 공산주의 적국을 마주해 온 역사가 있습니다. 이곳에서의 확산은 더 어렵겠지만, 그렇다고 인민이 권력을 잡도록 하는 일을 멈출 수는 없습니다."
 spread_communism_iceland: "아이슬란드의 공산주의"
 spread_communism_iceland_desc: "아이슬란드는 제2차 세계 대전 중에야 덴마크 국가에서 갈라져 나왔습니다. 우리의 견해는 상당 부분 일치하므로 그들을 우리의 사고방식으로 이끄는 일은 쉬울 것입니다."
 denmark.4001.t: "전투기를 요청하는 덴마크!"
 denmark.4001.d1: "나토 회원국으로서 덴마크가 영공 방어를 돕기 위해 우리 전투기 일부를 공유해 달라고 요청하고 있습니다. 이를 수락하면 기구의 단결을 유지하고 [DEN.GetLeader]의 호감을 사게 될 것입니다."
 denmark.4001.d2: "우리 세력의 일원으로서 덴마크가 영공 방어를 돕기 위해 우리 전투기 일부를 공유해 달라고 요청하고 있습니다. 이를 수락하면 기구의 단결을 유지하고 [DEN.GetLeader]의 호감을 사게 될 것입니다."
 denmark.4001.o1: "물론이지"
 denmark.4001.o2: "어림도 없다!"
 denmark.4002.t: "우리를 도우러 온 동맹국!"
 denmark.4002.d1: "[USA.GetLeader](이)가 우리의 용감한 공군을 위한 번쩍이는 신형 전투기의 승인을 마쳤습니다! [DEN.GetLeader](은)는 원조를 제공한 [USA.GetAdjective] 정부의 태도에 매우 기뻐하고 있으며 전투기의 도착을 직접 지켜볼 것이라고 합니다."
 denmark.4002.d2: "[SOV.GetLeader](이)가 우리의 용감한 공군을 위한 번쩍이는 신형 전투기의 승인을 마쳤습니다! [DEN.GetLeader](은)는 원조를 제공한 [SOV.GetAdjective] 정부의 태도에 매우 기뻐하고 있으며 전투기의 도착을 직접 지켜볼 것이라고 합니다."
 denmark.4002.o1: "훌륭하다!"
 denmark.4003.t: "우리를 돕기를 거부한 동맹국!"
 denmark.4003.d1: "[USA.GetLeader](이)가 우리의 용감한 공군을 위한 번쩍이는 신형 전투기 제공의 승인을 거부했습니다! [DEN.GetLeader](은)는 [USA.GetAdjective] 정부의 태도에 격분하여 워싱턴의 답변을 받아 내려 했으나 허사였다고 합니다."
 denmark.4003.d2: "[SOV.GetLeader](이)가 우리의 용감한 공군을 위한 번쩍이는 신형 전투기 제공의 승인을 거부했습니다! [DEN.GetLeader](은)는 [SOV.GetAdjective] 정부의 태도에 격분하여 모스크바의 답변을 받아 내려 했으나 허사였다고 합니다."
 denmark.4003.o1: "나쁜 놈들!"
 DEN_western_values: "민주주의 전파"
 DEN_western_values_desc: "나토는 방어 동맹이지만, 나토 회원국들은 세계 곳곳에 민주주의를 전파하려 해 온 것으로 알려져 있습니다."
 DEN_idea_strict_immigration_law: "엄격한 이민법"
 DEN_idea_strict_immigration_law_desc: "엄격한 이민법을 시행하면 우리나라가 확고하게 덴마크인의 나라로 남을 것입니다."
 DEN_idea_strict_immigration_law2: "반이슬람법"
 DEN_idea_strict_immigration_law2_desc: "엄격한 이민법에 더하여 무슬림의 입국을 막는 표준 법률을 제정하면 우리가 앞으로 나아가는 데 도움이 될 것입니다."
 DEN_communist_gains2: "공산주의 확장"
 DEN_communist_gains2_desc: "공산주의 이념이 덴마크에서 힘을 얻어 논쟁을 일으키고 정치 담론을 재편하고 있으며, 좌파 운동이 사회적, 경제적 개혁을 주장하고 있습니다."
 DEN_idea_unemployment_benefits: "실업급여"
 DEN_idea_unemployment_benefits_desc: "덴마크는 후한 실업 급여를 유지하여 도움이 필요한 이들에게 재정적 지원을 제공하는 한편 재취업과 기술 개발 프로그램을 촉진합니다."
 DEN_idea_intervention_forces: "덴마크 개입군"
 DEN_idea_intervention_forces_desc: "덴마크는 개입 부대를 강화하여 세계 안보 과제와 위기에 효과적으로 대응할 군사 능력과 태세를 높입니다."
 denmark.21.c: "이건 우리가 결정할 것이 아니다..."
 DEN_the_governance_of_denmark: "덴마크의 통치"
 DEN_the_governance_of_denmark_desc: "덴마크는 작은 나라이지만 온갖 종류의 적지 않은 문제를 안고 있습니다. 이 나라에는 식민지와 소규모 부패, 에너지 문제, 그리고 지속 가능한 경제 성장 모델을 어떻게 만들 것인가 하는 과제가 있습니다. 이제 신흥 번영기를 맞은 우리나라를 다스릴 준비를 하고 가능한 모든 것을 개선할 때입니다."
 DEN_the_status_of_the_amts: "암트의 지위"
 DEN_the_status_of_the_amts_desc: "암트는 우리 정부가 먼 옛날부터 고수해 온 오래된 행정 체계입니다. 앞으로 어떻게 할 것인지, 그리고 지역에 힘을 실을 것인지 아니면 기초 자치체에 힘을 실을 것인지 결정하는 것이 중요합니다."
 DEN_empower_the_regions: "지역에 권한 부여"
 DEN_empower_the_regions_desc: "지역은 수많은 소규모 지방 정부를 아우르며, 우리는 정부를 중앙집권화하여 문제를 처리하는 데 더 효과적으로 만들 수 있기를 바랍니다."
 DEN_empower_the_municipalities: "기초 자치체에 권한 부여"
 DEN_empower_the_municipalities_desc: "지방 지역에 힘을 실어 주면 그 지역 안에서 발생하는 상황을 더 효과적으로 처리할 수 있으며, 사안별로 대응하는 통치 방식이 가능해집니다."
 DEN_the_status_of_ertholmene: "에르트홀메네의 지위"
 DEN_the_status_of_ertholmene_desc: "에르트홀메네는 보른홀름 앞바다에 있는 작은 군도입니다. 현재 어떤 지역이나 기초 자치체의 관할에도 속해 있지 않아서, 주민들은 지방세를 내지 않으며 덴마크 정부 체계와 관련된 어떤 형태의 세금도 내지 않습니다. 이 작은 지역을 어떻게 할 것인지 결정해야 할 때입니다."
 DEN_regional_taxation: "지역 과세"
 DEN_regional_taxation_desc: "지역이 자기 지역을 위해 세금을 부과할 수 있도록 권한을 부여해야 합니다."
 DEN_shift_the_education_responsibility: "교육 책임 이전"
 DEN_shift_the_education_responsibility_desc: "교육은 기초 자치체가 아니라 지역 정부가 규제하고 운영해야 합니다."
 DEN_decentralized_education: "분권화된 교육"
 DEN_decentralized_education_desc: "교육은 지역 주민들의 손에 달려 있습니다. 모든 것을 어떻게 운영할지 그들이 결정하고 처리해야 합니다."
 DEN_regional_investments: "지역 투자"
 DEN_regional_investments_desc: "지역 수준에서 투자하면 그 혜택이 시민들에게 흘러가게 될 것입니다."
 DEN_restructure_the_healthcare_system: "의료 체계 재편"
 DEN_restructure_the_healthcare_system_desc: "현재 우리의 의료 체계는 지방 중심입니다. 이를 지방보다 지역 중심으로 재편할 때입니다."
 DEN_bornholm_regional_redistricting: "보른홀름 지역 재편"
 DEN_bornholm_regional_redistricting_desc: "보른홀름을 어떻게 할지 결정해야 할 때가 되었습니다. 다른 지역에 통합할까요, 아니면 독자적인 지역으로 삼을까요?"
 DEN_the_health_contribution_tax: "건강 기여세"
 DEN_the_health_contribution_tax_desc: "건강 기여세는 지방 의료 체계에 투자하는 데 쓰이도록 지방 차원에서 부과하는 세금입니다."
 DEN_public_transportation_reforms: "대중교통 개혁"
 DEN_public_transportation_reforms_desc: "우리는 지방 차원의 교통 수단이 절실히 필요합니다. 도로를 확장하고 기초 자치체의 부담을 덜어 줄 때입니다."
 DEN_regional_welfare_systems: "지역 복지 체계"
 DEN_regional_welfare_systems_desc: "복지 체계를 지역으로 이전하면 정부 하위 단계의 일부 관료적 절차를 없앨 수 있습니다."
 DEN_municipal_growth: "기초 자치체 성장"
 DEN_municipal_growth_desc: "기초 자치체 지역의 성장을 촉진할 때입니다!"
 DEN_local_autonomy: "지방 자치"
 DEN_local_autonomy_desc: "각 지역은 자기 지역에 관한 결정을 내릴 수 있어야 합니다. 그들이야말로 이를 처리하기에 가장 적합한 사람들입니다!"
 DEN_status_of_the_colonies: "식민지의 지위"
 DEN_status_of_the_colonies_desc: "식민지는 어떤 식으로든 처리해야 합니다."
 DEN_release_the_holdings: "보유지 해방"
 DEN_release_the_holdings_desc: "우리가 보유해 온 영지를 놓아줄 때입니다. 이러한 전환을 허용하고 결국 그들이 자치로 나아가는 전환을 시작하도록 하는 것이 중요합니다."
 DEN_reign_in_the_colonies: "식민지 단속"
 DEN_reign_in_the_colonies_desc: "우리나라 안의 건방진 식민지들을 단속해야 합니다. 그린란드인과 페로인은 자신들이 덴마크인임을 이해해야 합니다."
 DEN_greenlandic_referendum: "그린란드 국민투표"
 DEN_greenlandic_referendum_desc: "그린란드는 수 세기 동안 우리 손안에 있었습니다. 그들은 서서히 우리에게서 멀어져 자치를 향해 나아가기를 원합니다."
 DEN_the_faroes_referendum: "페로 제도 국민투표"
 DEN_the_faroes_referendum_desc: "페로 제도는 자유를 얻고자 하고 있습니다."
 DEN_autonomous_administration: "자치 행정"
 DEN_autonomous_administration_desc: "그들이 스스로 다스리게 내버려 두면 통치의 부담이 줄어들 것입니다."
 DEN_stamp_out_separatism: "분리주의 근절"
 DEN_stamp_out_separatism_desc: "그들은 덴마크인이고, 그걸 받아들이게 될 것입니다!"
 DEN_special_municipal_districts: "특별 자치 구역"
 DEN_special_municipal_districts_desc: "식민지를 관리할 특별 구역을 설치하면 매우 유익할 수 있습니다. "
 DEN_direct_governance: "직접 통치"
 DEN_direct_governance_desc: "이제 식민지에 대한 통제권을 확립하고 직접 이끌 때입니다. 그들의 정부는 해산되어야 하며, 앞으로는 덴마크 정부가 그들을 관리합니다."
 DEN_colonial_investments: "식민지 투자"
 DEN_colonial_investments_desc: "덴마크의 식민지에는 경제 부흥이 필요합니다. 그 주민들을 제대로 부양하려면 이들 지역에 경제 발전을 가져와야 합니다."
 DEN_exploit_greenlandic_oil_reserves: "그린란드 석유 매장량 개발"
 DEN_exploit_greenlandic_oil_reserves_desc: "그린란드에는 석유가 많이 있지만 우리는 현재 이를 채굴하지 않고 있습니다."
 DEN_faroese_naval_infrastructure: "페로 제도 기반시설 개선"
 DEN_faroese_naval_infrastructure_desc: "스코틀랜드 북쪽의 페로 제도는 북유럽 무역의 핵심 지역이며, 이곳의 기반시설에 투자하는 것은 우리의 무역 능력을 늘리는 일입니다."
 DEN_faroese_oil_expansion: "페로 제도 북해 석유 탐사"
 DEN_faroese_oil_expansion_desc: "북해는 석유 탐사에 무르익었습니다. 파도 바로 아래에 어떤 석유가 놓여 있는지 확인하기 위해 페로 제도를 거점으로 삼는 것이 우리의 의무입니다."
 DEN_centralized_government_empowerment: "중앙 정부 권한 강화"
 DEN_centralized_government_empowerment_desc: "정부는 권한 강화가 절실히 필요합니다. 중앙 정부의 권한을 강화하는 방향으로 나아가면, 기초 자치체와 지역의 문제를 완화할 수 있는 맞춤형 조치를 취할 수 있을 것입니다."
 DEN_the_industrial_base_of_denmark: "덴마크의 산업 기반"
 DEN_the_industrial_base_of_denmark_desc: "산업 기반에 투자할 때입니다. 반드시 그래야 합니다. 그렇지 않으면 우리는 정체될 것입니다."
 DEN_banking_reforms: "은행 개혁"
 DEN_banking_reforms_desc: "우리의 은행 체계는 상당히 견고하지만 일부 시민 보호가 부족한 것과 같은 허점이 있습니다. 이러한 법률을 개혁하여 항상 국민을 최우선에 두도록 할 때입니다."
 DEN_energy_initiatives: "에너지 구상"
 DEN_energy_initiatives_desc: "재생 에너지로 나아가는 우리에게 에너지 문제는 가장 큰 과제 중 하나입니다."
 DEN_solar_initiatives: "태양광 구상"
 DEN_solar_initiatives_desc: "우리에게는 태양 에너지를 위한 훌륭한 입지가 있습니다. 태양광에 투자해 우리나라를 제 궤도에 올려놓읍시다!"
 DEN_biomass_production: "바이오매스 생산"
 DEN_anticorruption_offices: "반부패 기관"
 DEN_anticorruption_offices_desc: "반부패 기구와 사무소를 설립하면 덴마크 내의 부패를 더 효과적으로 겨냥하고 해결할 수 있습니다. 우리 위대한 나라에는 그리 많은 것이 있지는 않지만, 가능한 곳에서 군살을 덜어내는 것이 중요합니다."
 DEN_fiere_at_work: "플레레 이 아르바이데"
 DEN_fiere_at_work_desc: "'플레레 이 아르바이데'는 국가 고용 정책을 실업 급여에서 벗어나 적극적인 구직에 더 중점을 두도록 조정하기 위해 2023년에 여러 정당이 맺은 정치적 합의였습니다."
 DEN_the_ironworking_industries: "제철 산업"
 DEN_the_ironworking_industries_desc: "강철은 한 나라의 발전에서 중요한 부분입니다. 고층 건물, 자동차, 산업 제품 등 온갖 곳에 쓰입니다. 제철 산업에 투자하여 덴마크에 강철을 되살릴 때입니다."
 DEN_danish_pharmaceuticals: "덴마크 제약"
 DEN_danish_pharmaceuticals_desc: "제약 회사에 투자하면 우리의 성장이 계속 확대되고 폭발적으로 늘어나는 것을 보게 될 것입니다."
 DEN_intermeditary_manufacturing: "중간재 제조업"
 DEN_intermeditary_manufacturing_desc: "우리나라의 중간재 산업은 어느 정도 확장이 필요합니다."
 DEN_agroindustrial_investments: "농산업 투자"
 DEN_agroindustrial_investments_desc: "국내 농업 및 산업 단지에 투자하면 우리 경제가 계속 호황을 누리게 될 것입니다."
 DEN_develop_kobenhavn: "쾨벤하운 개발"
 DEN_develop_kobenhavn_desc: "쾨벤하운, 즉 코펜하겐은 덴마크의 수도이자 인구가 100만을 넘는 덴마크 유일의 도시입니다. 수도를 개발하는 것이 우리 개발 사업의 좋은 출발점이 될 것입니다."
 DEN_develop_aarhus: "오르후스 개발"
 DEN_develop_aarhus_desc: "오르후스는 덴마크에서 두 번째로 큰 도시입니다. 이곳의 항구를 확장하고 개선할 수 있으므로 먼저 도시를 개발해야 합니다."
 DEN_develop_roskilde: "로스킬레 개발"
 DEN_develop_roskilde_desc: "로스킬레는 수도 인근의 도시입니다. 이곳을 개발하면 수도의 번영을 더욱 높일 수 있습니다."
 denmark.43.t: "사이클론 구드룬"
 denmark.43.d: "사이클론 구드룬이 우리나라와 영국, 스웨덴을 휩쓸어 22명이 사망했으며 그중 4명은 덴마크인입니다. 이 폭풍은 스웨덴에도 상당한 재산 피해를 입혔고, 피해를 입은 나무로 인해 임업이 큰 타격을 받았습니다."
 denmark.43.a: "조의를 전하자.."
 denmark.44.t: "그린란드 국민투표"
 denmark.44.d: "1979년부터 덴마크의 자치 영토였던 그린란드가 자치 정부 국민투표를 실시하기로 결정했으며, 투표 결과 과반수가 자치 정부에 찬성했습니다."
 denmark.44.a: "좋아"
 denmark.45.t: "페로 제도 국민투표"
 denmark.45.d: "페로 제도 주민들이 국민투표를 실시하여 우리나라로부터의 독립을 모색하고 있습니다. 우리 안에서 자치 주체가 되는 것은 그들의 권리이며, 우리는 그들을 막지 않을 것입니다. 그들의 자치를 허용하십시오."
 denmark.45.a: "흥미롭군"
 denmark.100.t: "에르트홀메네의 지위"
 denmark.100.d: "에르트홀메네는 보른홀름 앞바다의 작은 군도입니다. 현재 어떤 지역이나 지방 자치체의 관할에도 속하지 않아, 주민들은 지방세를 내지 않으며 덴마크 정부 체계와 관련된 어떤 형태의 세금도 내지 않습니다. 이들을 어떻게 해야 할까요? 보른홀름 지역에 편입시켜야 할까요?"
 denmark.100.a: "자치를 계속 유지한다"
 denmark.100.b: "에르트홀메네를 통제한다"
 DEN_intensify_the_flexicurity_idea: "유연안정성 강화"
 DEN_intensify_the_flexicurity_idea_desc: "덴마크는 노동 시장의 유연성과 사회 보장 조치를 결합한 유연안정성 모델을 강화하여 고용 안정과 경제 회복력을 증진합니다."
 DEN_a_green_leap_forward: "녹색 대약진"
 DEN_a_green_leap_forward_desc: "덴마크는 야심 찬 환경 정책과 투자를 통해 지속 가능한 경제로의 전환을 가속하며 기후 변화에 맞서고 재생 에너지를 촉진합니다."
 DEN_idea_clean_energy_initiatives: "청정 에너지 이니셔티브"
 DEN_idea_clean_energy_initiatives_desc: "덴마크는 야심 찬 청정 에너지 이니셔티브를 시작하여 풍력과 태양광 같은 재생 자원에 투자함으로써 탄소 배출을 줄이고 기후 변화에 맞섭니다."
 DEN_local_construction_renewable_initiatives_modifier: "재생 에너지 건설 이니셔티브"
 DEN_local_construction_renewable_initiatives_modifier_desc: "§Y도시개발기금§!이(가) §g이 주의 지역 재생 에너지 투자에 일부 자금을 배정했습니다.§!"
 DEN_local_construction_initiatives_modifier: "지역 건설 이니셔티브"
 DEN_local_construction_initiatives_modifier_desc: "§Y도시개발기금§!이(가) §g이 주의 지역 투자에 일부 자금을 배정했습니다.§!"
 DEN_last_bastions_of_corruption: "부패의 마지막 보루"
 DEN_last_bastions_of_corruption_desc: "덴마크 내에는 여전히 부패가 발생하는 곳이 몇 군데 있습니다. 우리 국민이 앞으로 나아가려면 부패의 마지막 보루를 근절해야 합니다."
 DEN_greenlandic_separatism_modifier: "그린란드 분리주의"
 DEN_greenlandic_separatism_modifier_desc: "그린란드의 자치와 주권에 대한 논의가 부각되면서 그린란드 분리주의를 둘러싼 논쟁이 격화되고 있습니다."
 DEN_faroese_separatism_modifier: "페로 제도 분리주의"
 DEN_faroese_separatism_modifier_desc: "페로 제도에서도 자치와 분리주의에 대한 유사한 논의가 대두되어 자결권과 독립을 둘러싼 지속적인 논쟁을 반영합니다."
 DEN_energy_exports_idea: "에너지 수출"
 DEN_energy_exports_idea_desc: "덴마크는 석유, 가스, 재생 에너지를 포함한 에너지 자원을 활용하여 에너지 순수출국이 되고, 경제적 번영과 에너지 안보에 기여합니다."
 DEN_in_need_of_banking_reforms_idea: "은행 개혁 필요"
 DEN_in_need_of_banking_reforms_idea_desc: "덴마크는 금융 부문의 투명성, 책임성, 안정성 문제를 해결하기 위한 은행 개혁 요구에 직면해 있습니다."
 DEN_danish_pharmaceuticals_idea: "덴마크 제약 산업"
 DEN_danish_pharmaceuticals_idea_desc: "덴마크의 제약 산업은 세계 보건과 복지에 기여하는 고품질 의약품과 보건 의료 제품을 생산하며 번창하고 있습니다."
 DEN_colonial_holding_modifier: "왕실 투자"
 DEN_special_municipal_districts_idea: "특별 자치 구역"
 DEN_special_municipal_districts_idea_desc: "고유한 지역적 필요와 우선순위에 대응하기 위해 특별 자치 구역이 설립되어, 지역 사회 차원에서 맞춤형 통치와 서비스가 가능해집니다."
 DEN_direct_governance_idea: "직접 통치"
 DEN_direct_governance_idea_desc: "덴마크는 시민이 의사 결정 과정과 지방 통치에 더 적극적으로 참여할 수 있도록 하는 직접 통치 모델을 모색합니다."
 DEN_autonomous_administration_idea: "자치 행정"
 DEN_autonomous_administration_idea_desc: "일부 지역에 자치 행정 모델이 시행되어 지방 당국에 더 큰 자치권과 의사 결정 권한이 부여됩니다."
 DEN_regional_investments_idea_loc: "지역 투자"
 DEN_regional_investments_idea_loc_desc: "덴마크는 지역 개발 사업과 인프라에 투자하여 전국 각 지역의 경제 성장과 번영을 촉진합니다."
 DEN_social_spending_reforms_centralization_idea: "지역 사회 지출 개혁"
 DEN_social_spending_reforms_centralization_idea_desc: "지역 사회 지출 개혁은 격차를 해소하고 소외 지역의 사회 복지 성과를 개선하는 것을 목표로 합니다."
 DEN_social_spending_reforms_decentralization_idea: "지방 자치체 사회 지출 개혁"
 DEN_social_spending_reforms_decentralization_idea_desc: "지방 자치체들이 취약 계층을 위한 사회 서비스와 지원 체계를 강화하기 위해 사회 지출 개혁을 시행합니다."
 DEN_local_municipalities_idea: "지방 자치체 투자"
 DEN_local_municipalities_idea_desc: "지방 자치체들은 삶의 질을 높이고 지역 사회 발전을 촉진하기 위해 인프라, 교육, 보건 의료 투자를 우선시합니다."
 DEN_colonial_separatism_category: "덴마크 식민지 영토"
 DEN_colonial_separatism_category_desc: "덴마크의 식민지 영토"
 DEN_urban_development_fund_category: "도시 개발 기금"
 DEN_urban_development_fund_category_desc: "도시 개발 기금은 덴마크 정부가 덴마크의 도시를 개선하고, 수도 쾨벤하운에 집중된 인구와 경제적 기회를 고르게 분산하기 위해 마련한 목표 지향적 구상입니다. 이 기금에 투입된 자금으로 특정 지역을 개발하여 해당 지역에 목표 지향적인 개발, 사회 및 기타 사업을 제공하고, 해외와 수도의 더 많은 인구를 경제적으로 정체된 지역으로 이끌 수 있습니다.\n\n§Y도시 개발 기금 규모:§! $$[?DEN_urban_development_fund_value|+] 십억"
 DEN_expand_resources_of_the_fund: "기금 재원 확대"
 DEN_expand_resources_of_the_fund_desc: "납세자들로부터 추가 재원을 기금에 투입하여 추가적인 개발 기회를 촉진할 수 있습니다."
 DEN_population_initiatives_decision: "인구 증가 구상"
 DEN_population_initiatives_decision_desc: "세계 각국과 수도로부터의 이주를 장려하면 우리의 인구와 지방 지역을 활성화하는 데 도움이 될 것입니다."
 DEN_local_construction_initiatives_decision: "§Y[FROM.GetName]§!의 지역 건설 구상"
 DEN_local_construction_initiatives_decision_desc: "[FROM.GetName]에는 건설을 비롯한 지역 투자가 절실히 필요합니다. 돈을 내놓을 때입니다!"
 DEN_local_renewable_investment_decision: "§Y[FROM.GetName]§!의 재생 에너지 건설 구상"
 DEN_local_renewable_investment_decision_desc: "[FROM.GetName]은(는) 지역 재생 에너지 시설을 유치하는 데 관심을 보였습니다. 그러나 해당 지역 주민들은 그곳에 시설을 두겠다는 정부의 결정에 반대합니다. 기금에서 해당 지역의 건설에 자금을 할당할 수는 있지만, 중앙 정부에는 인기 없는 일이 될 것입니다."
 DEN_urban_development_funds_greater_than_TT: "현재 개발 기금 > $$5 십억 (현재: [?DEN_urban_development_fund_value|+]b)"
 DEN_generic_danish_political_decisions_category: "덴마크의 통치"
 DEN_generic_danish_political_decisions_category_desc: "덴마크에는 다양한 정책이 있으며, 그중 일부는 자유롭게 바꿀 수 있습니다."
 DEN_rollback_flexicurity_model_improvements_decision: "유연안정성 모델 확대 철회"
 DEN_rollback_flexicurity_model_improvements_decision_desc: "유연안정성 모델은 우리의 미래에 필요하지 않습니다. 이제 이를 철회하고 폐지할 때입니다."
 DEN_colonial_investment_modifier: "식민지 투자"
 DEN_colonial_investment_modifier_desc: "식민지에 대한 투자는 우리에게 이로울 뿐 아니라 현지 경제에도 이롭습니다. 우리의 식민지 영토에 대한 지속 가능한 투자를 유지하는 것이 필수적입니다."
 DEN_Professional_Soldier_Education_Removal: "직업 군인 교육 축소"
 DEN_Increase_Soldiers_Pay_Removal3: "병사 급여 인하"
 DEN_Increase_Soldiers_Pay_Removal2: "병사 급여 삭감"
 DEN_Increase_Soldiers_Pay_Removal: "병사 급여 대폭 삭감"
 DEN_Reform_The_NCO_Education_Removal: "부사관 교육 개혁"
 DEN_Theoretical_Officer_Education_Removal: "이론 장교 교육 축소"
 DEN_Regimental_Doctors_Removal: "국방부 연대 군의관 예산 조정"
 DEN_Civilian_Education_Removal: "국방부 민간 교육 해체"
 DEN_Dental_Plan_Removal: "국방부 치과 진료 계획 철회"
 DEN_Professional_Soldier_Education: "직업 군인 교육"
 DEN_Increase_Soldiers_Pay3: "병사 급여 인상"
 DEN_Increase_Soldiers_Pay2: "병사 급여 인상"
 DEN_Increase_Soldiers_Pay: "병사 급여 인상"
 DEN_Reform_The_NCO_Education: "부사관 교육 변경"
 DEN_Reform_The_NCO_Education_desc: "부사관(NCO). 덴마크 육군의 부사관은 병사를 지휘하고 관리할 책임이 있으며, 리더십, 전술, 행정 등의 분야에서 폭넓은 기술과 지식을 갖출 것이 요구됩니다."
 DEN_Theoretical_Officer_Education: "이론 장교 교육"
 DEN_Regimental_Doctors: "국방부 연대 군의관"
 DEN_Civilian_Education: "국방부 민간 교육"
 DEN_Dental_Plan: "국방부 치과 진료 계획"
 DEN_army_dynamic_modifier: "포르스바렛"
 DEN_Danish_Defence_Force: "덴마크 국방군"
 DEN_Danish_Defence_Force_desc: "덴마크 육군은 덴마크 국방군의 지상군 구성 요소로서, 국내외에서 덴마크와 그 이익을 방어할 책임이 있습니다. 1614년에 창설되었으며 오랜 군 복무의 역사를 지니고 있습니다."
 DEN_urban_improvement_funds_pool_tt: "§Y도시 개발 기금§!을 $$[?temp_change|+] 십억만큼 변경합니다 (현재: [?DEN_urban_development_fund_value|+3])"
 DEN_intensify_the_flexicurity_idea_trigger_tt: "§Y$DEN_intensify_the_flexicurity_idea$§!이(가) 적용 중인 동안 §Y[DEN.GetNameWithFlag]§!은(는) §Y$social_budget$§!을(를) §Y$social_01$§!보다 낮출 수 없습니다.\n"
 DEN_invested_in_our_resources: "우리 자원에 투자함"
 DEN_invested_in_our_infrastructure: "우리 인프라에 투자함"
 DEN_colonial_holding_tt: "§Y종주국 금융 투자§!: §Y추가 수입§!에 $$[?DEN_colonial_holdings_income] 추가\n"
 DEN_biomass_production_desc: "바이오매스 생산을 확대하여 덴마크의 재생 에너지 역량을 끌어올립니다. 이는 화석 연료 의존도를 줄이고 탄소 배출을 낮추며 지속 가능한 에너지 해법을 촉진할 것입니다."
 DEN_develop_fyn_desc: "퓐, 즉 푸넨은 덴마크 영토에서 세 번째로 큰 섬으로, 덴마크 제3의 도시 \\"오덴세\\"가 있으며 정부와 같은 수많은 훌륭한 투자자에게 열려 있습니다!"
 DEN_danish_militarism: "덴마크 군국주의"
 DEN_danish_militarism_desc: "지정학적 변화와 되살아난 민족 정체성 속에서 덴마크는 군사적 야망에서 점점 더 단호한 모습을 보이고 있습니다. 덴마크 군국주의의 기치 아래 이 나라는 현대화 및 확장 프로그램에 투자하며 군대를 강화할 태세입니다."
 DEN_Hamburg_is_Danish: "함부르크는 덴마크의 것"
 DEN_Hamburg_is_Danish_desc: "함부르크를 덴마크의 영토로 확보함으로써, 이 나라는 해상 무역로를 강화하고 경제적 영향권을 넓히며 북유럽의 분쟁 지역에서 더 확고한 발판을 마련하고자 합니다."
 DEN_from_Baltic_to_black_sea: "발트해에서 흑해까지"
 DEN_from_Baltic_to_black_sea_desc: "과거의 영광에서 영감을 얻고 새로워진 야망에 이끌려, 덴마크는 영향력을 발트해에서 흑해까지 넓히겠다는 대담한 구상에 착수합니다. 덴마크는 더 넓은 발트해 및 동유럽 전역에서 존재감을 드러내고자 합니다."
 DEN_the_socialist_agenda_desc: "사회주의 의제는 사회 복지, 평등, 연대에 대한 덴마크의 의지를 강조합니다. 사회민주주의 원칙에 기반한 이 의제는 불평등 완화, 의료와 교육에 대한 보편적 접근 보장, 모든 시민을 위한 공정하고 포용적인 사회 육성을 목표로 하는 정책을 우선시합니다."
 DEN_reassure_worker_rights: "노동자 권리 보장"
 DEN_reassure_worker_rights_desc: "노동자에게 힘을 실어 주고 노동조합 간의 연대를 촉진함으로써, 덴마크는 부와 권력의 더 공평한 분배를 도모하고 결국 모든 개인이 존중받고 존엄을 인정받으며 번영할 기회를 누리는 사회를 건설하고자 합니다."
 DEN_mandatory_worker_councils: "의무 노동자 평의회"
 DEN_mandatory_worker_councils_desc: "덴마크는 의무 노동자 평의회를 도입하여 직원들이 직장의 의사 결정 과정에서 직접 발언권을 갖도록 보장합니다."
 DEN_party_first: "사회주의국민당 우선"
 DEN_party_first_desc: "정부는 노동조합이 아니라 정당들의 단체 교섭력을 강화하여, 노동 정책을 형성하고 노동자의 권리를 옹호하는 데 있어 정당들이 단일한 목소리를 내도록 하고자 합니다"
 DEN_integrate_the_unions: "노동조합 통합"
 DEN_integrate_the_unions_desc: "정당과 노동조합 사이에 더 긴밀한 유대를 구축함으로써, 정부는 정치 무대에서 노동자들의 집단적 목소리를 증폭시키고 노동권과 사회 정의를 최우선으로 하는 정책을 추진하고자 합니다."
 DEN_union_first: "노동조합 우선"
 DEN_union_first_desc: "정부는 사회주의 정당들이 아니라 노동조합의 단체 교섭력을 강화하여, 노동 정책을 형성하고 노동자의 권리를 옹호하는 데 있어 노동조합이 단일한 목소리를 내도록 하고자 합니다"
 DEN_national_congress: "전국 대회"
 DEN_national_congress_desc: "덴마크는 노동조합과 단체 전반의 대표들을 한자리에 모아 전국 노동 대회를 소집합니다. "
 DEN_organizing: "조직화"
 DEN_organizing_desc: "자원, 훈련, 법적 보호를 제공함으로써 정부는 풀뿌리 운동의 부활을 촉진하고 노동자의 목소리를 증폭시키며 긍정적인 변화를 이끌고자 합니다."
 DEN_provide_political_capital: "정치 자본 제공"
 DEN_provide_political_capital_desc: "덴마크는 노동조합에 정치 자본을 제공하여 정치 영역에서 더 큰 영향력과 접근성을 부여하겠다고 약속합니다."
 DEN_council_run_corporations: "평의회 운영 기업"
 DEN_council_run_corporations_desc: "덴마크는 노동자가 기업 경영과 의사 결정 과정에서 직접적인 역할을 맡는 평의회 운영 기업 모델을 채택합니다."
 DEN_world_forum: "세계 포럼"
 DEN_world_forum_desc: "덴마크는 전 세계 노동조합과 노동자 단체의 대표들이 한자리에 모여 공통의 과제를 다루고, 모범 사례를 공유하며, 국제 연대 활동을 조율할 수 있는 세계 노동 포럼의 설립을 주창합니다."
 DEN_join_the_ITUC: "ITUC 가입"
 DEN_join_the_ITUC_desc: "덴마크는 국제노동조합총연맹(ITUC)에 가입하여 국제 무대에서의 참여를 강화하고자 합니다. 이 세계 노동조합 연맹의 회원이 됨으로써 덴마크는 노동자의 권리를 옹호하고 사회 정의를 증진하며 국경을 넘어 노동자들 사이의 국제 연대를 촉진하는 데 목소리를 높이고자 합니다."
 DEN_international_stage: "국제 무대"
 DEN_international_stage_desc: "덴마크가 노동자의 천국인 만큼, 우리는 세계 노동자의 천국이라는 국제적 역할을 주장해야 합니다"
 DEN_Liberal_Social: "자유지상 사회주의자"
 DEN_Liberal_Social_desc: "자유지상 사회주의자는 노동자가 생산 수단을 집단으로 소유하고 관리하는, 분권적이고 위계 없는 사회를 옹호합니다. 풀뿌리 조직화와 직접 행동을 통해 자유지상 사회주의자는 억압적인 구조를 해체하고 더 평등하고 참여적인 사회를 만들고자 합니다."
 DEN_Free_harbor_for_RAF: "RAF를 위한 자유 항구"
 DEN_Free_harbor_for_RAF_desc: "덴마크는 권리와 자유(RAF) 운동의 자유 항구를 자처하며, 인권과 시민적 자유를 옹호하는 활동가, 반체제 인사, 개인들에게 피난처와 지원을 제공합니다."
 DEN_Freetown_Christiana: "자유도시 크리스티아니아"
 DEN_Freetown_Christiana_desc: "자유도시 크리스티아니아는 코펜하겐 안의 대안적 삶과 공동체적 이상의 상징입니다. 1970년대에 무단 점거자 집단이 세운 크리스티아니아는 자치 공동체로 운영되며 공동 소유, 예술적 표현, 비순응의 원칙을 구현합니다. 비관습적인 지위에도 불구하고 크리스티아니아는 활기찬 문화 중심지로 남아 있으며, 행동주의와 창의성, 대항문화 정신이 어우러진 독특한 분위기에 매료된 전 세계의 방문객을 끌어들입니다."
 DEN_Anarchism_first: "아나키즘 우선"
 DEN_Anarchism_first_desc: "권력을 지역 공동체에 이양하고 참여적 의사 결정을 촉진하며 위계적 권위 체계에 도전함으로써, 정부는 더 평등하고 자치적인 사회를 만들고자 합니다."
 DEN_organized_unorganized: "미조직 노동자의 조직화"
 DEN_organized_unorganized_desc: "비공식 경제의 노동자들에게 자원, 지원, 법적 보호를 제공함으로써, 정부는 그들의 노동 조건을 개선하고 교섭력을 강화하며 사회적 포용을 촉진하고자 합니다."
 DEN_strike_policy: "파업 정책"
 DEN_strike_policy_desc: "덴마크는 노동자가 자신의 권리와 이익을 옹호하기 위해 집단행동에 나설 권리를 인정하며 진보적인 파업 정책을 시행합니다."
 DEN_the_art_of_a_riot: "폭동의 기술"
 DEN_the_art_of_a_riot_desc: "시위대의 권리를 보호하고 경찰의 책임성을 보장하며 비폭력 저항을 장려하는 정책을 통해, 정부는 이견과 시민 불복종이 정당한 정치적 표현 형태로 존재할 수 있는 공간을 만들고자 합니다."
 DEN_Unconditional_basic_income: "무조건적 기본소득"
 DEN_Unconditional_basic_income_desc: "덴마크는 고용 상태나 소득 수준과 무관하게 모든 시민에게 정기적인 수당을 보장하는 무조건적 기본소득 프로그램을 도입합니다. 금융 안전망을 제공하고 경제적 안정을 촉진함으로써, 정부는 빈곤을 줄이고 개인이 자신의 열정을 추구하도록 힘을 실어 주며 더 큰 사회적, 경제적 자유를 키우고자 합니다."
 DEN_normalise_the_strike: "파업의 정상화"
 DEN_normalise_the_strike_desc: "덴마크는 파업을 노동자가 자신의 권리를 주장하고 공정한 노동 조건을 협상하기 위한 정당하고 효과적인 수단으로 정상화하고자 합니다."
 DEN_structurised_support: "체계화된 지원"
 DEN_structurised_support_desc: "덴마크는 저소득 가정, 장애인, 소외된 공동체를 포함한 취약 계층에게 포괄적인 지원과 자원을 제공하기 위해 체계화된 지원 프로그램을 시행합니다."
 DEN_the_true_wellfare_state: "진정한 복지 국가"
 DEN_the_true_wellfare_state_desc: "교육, 의료, 주거, 사회 서비스에 투자함으로써, 정부는 모든 사람이 충만하고 존엄한 삶을 살 기회를 가지는 사회를 만들고자 합니다."
 DEN_export_the_protest: "저항의 수출"
 DEN_export_the_protest_desc: "지식, 자원, 연대를 나눔으로써 덴마크는 소외된 공동체의 목소리를 증폭시키고 국제 무대에서 진보적 대의를 진전시키고자 합니다."
 DEN_export_our_Sytem: "우리 체제의 수출"
 DEN_export_our_Sytem_desc: "덴마크는 더 포용적이고 공평한 사회를 건설하려는 다른 나라들에게 자국의 자유주의적 사회 모델을 홍보합니다."
 DEN_true_equality: "진정한 평등"
 DEN_true_equality_desc: "덴마크는 구조적 장벽을 허물고 인종, 성별, 성적 지향 및 기타 정체성에 기반한 복합적인 차별에 대응함으로써 진정한 평등을 달성하겠다고 다짐합니다. "
 DEN_solidifying_our_rule: "덴마크 공산당의 공고화"
 DEN_solidifying_our_rule_desc: "통제의 중앙집권화, 반대 의견의 억압, 당 규율 강화를 통해, 정부는 안정을 유지하고 정치, 경제, 사회 영역에 대한 지배력을 공고히 하고자 합니다."
 DEN_end_the_protest: "시위 종식"
 DEN_end_the_protest_desc: "선전, 검열, 탄압을 활용하여, 정부는 시위와 파업 및 기타 형태의 반대 의견을 억누르고 여론과 정치적 야당에 대한 통제를 공고히 하고자 합니다."
 DEN_Danish_stasi: "덴마크판 슈타지"
 DEN_Danish_stasi_desc: "덴마크는 동독의 슈타지와 유사한, 국내에서 반대 의견을 감시하고 사찰하며 억압하는 임무를 맡은 국내 정보 기관을 설립합니다."
 DEN_friends_in_the_east: "동방의 친구들"
 DEN_friends_in_the_east_desc: "덴마크는 동구권 사회주의 정권들과의 유대를 강화하고자 합니다. 동맹을 육성하고, 자원을 공유하며, 이념적 연대를 촉진함으로써, 정부는 자국의 지정학적 입지를 높이고 서방 자본주의 열강으로부터 인식되는 위협에 맞서고자 합니다."
 DEN_southamerican_friends: "남아메리카의 친구들"
 DEN_southamerican_friends_desc: "덴마크는 남아메리카의 사회주의 성향 정부들로 외교적 접근을 넓혀, 이 지역에서 동맹과 파트너십을 키우고자 합니다."
 DEN_Industries: "산업"
 DEN_Industries_desc: "기업과 혁신에 우호적인 환경을 조성함으로써, 정부는 국가 경제를 강화하고 국민을 위한 지속 가능한 일자리 기회를 창출하고자 합니다."
 DEN_sustainable_Production: "지속 가능한 생산"
 DEN_sustainable_Production_desc: "덴마크는 산업 전반에 걸쳐 지속 가능한 생산 관행을 촉진하겠다고 다짐합니다. 친환경 기술을 도입하고, 폐기물을 줄이며, 환경 영향을 최소화함으로써, 정부는 경제 성장이 환경 관리 및 장기적 지속 가능성과 균형을 이루도록 하고자 합니다."
 DEN_Green_economiy_initiative: "녹색 경제 구상"
 DEN_Green_economiy_initiative_desc: "덴마크는 더 지속 가능하고 환경 친화적인 경제 모델로 전환하기 위한 포괄적 전략인 녹색 경제 구상을 출범시킵니다."
 DEN_innovation_and_technology: "혁신과 기술"
 DEN_innovation_and_technology_desc: "연구 개발에 투자하고, 기술 스타트업을 지원하며, 혁신을 장려함으로써, 정부는 빠르게 진화하는 세계 시장에서 생산성, 경쟁력, 경제 성장을 높이고자 합니다."
 DEN_zero_co2_economy: "이산화탄소 제로 경제"
 DEN_zero_co2_economy_desc: "청정 에너지, 탄소 포집 기술, 에너지 효율화 조치에 투자함으로써, 정부는 기후 변화에 맞서고 지속 가능한 미래를 구축하는 데 앞장서고자 합니다."
 DEN_no_industrial_nonsense: "불필요한 산업 규제 철폐"
 DEN_no_industrial_nonsense_desc: "규제를 간소화하고, 관료주의를 줄이며, 정부 개입을 최소화함으로써, 정부는 혁신을 자극하고 경제 성장을 촉진하며 세계 무대에서 덴마크 산업의 경쟁력을 높이고자 합니다."
 DEN_heavy_industry_focus: "중공업 집중"
 DEN_heavy_industry_focus_desc: "덴마크는 경제 성장을 이끌고 일자리를 창출하기 위해 중공업 부문 발전에 중점을 둡니다."
 DEN_hightech_from_DEN: "덴마크발 첨단 기술"
 DEN_hightech_from_DEN_desc: "생명공학, 정보 기술, 첨단 제조업 같은 첨단 산업을 지원함으로써, 정부는 덴마크가 최첨단 혁신과 기업가 정신의 중심지라는 명성을 높이고자 합니다."
 DEN_conventional_Industry: "전통 산업"
 DEN_conventional_Industry_desc: "덴마크는 필수 재화와 서비스를 공급하는 데 있어 전통 산업 부문의 중요성을 인정하여 이에 대한 지원을 유지합니다"
 DEN_found_Alternatived: "대안당 창당"
 DEN_found_Alternatived_desc: "덴마크는 정당 \\"대안당\\"의 기풍에서 영감을 받아, 시급한 사회적, 환경적 과제를 해결할 혁신적인 해법과 정책을 모색합니다. 지속 가능성, 사회 정의, 참여 민주주의의 원칙을 받아들여, 덴마크는 사람과 지구 모두의 안녕을 우선시하는 대안적 접근을 개척하고자 합니다."
 DEN_new_political_culture: "새로운 정치 문화"
 DEN_new_political_culture_desc: "\\"대안당\\"의 가치와 비전을 바탕으로, 덴마크는 투명성, 풀뿌리 참여, 총체적 의사 결정을 특징으로 하는 새로운 정치 문화를 가꾸고자 노력합니다. 전통적 권력 구조에 도전하고 상향식 구상을 촉진함으로써, 덴마크는 시민에게 힘을 실어 주고 긍정적 변화를 위한 집단행동을 촉진하는 더 포용적이고 협력적이며 미래 지향적인 정치 환경을 조성하고자 합니다."
 DEN_serious_fight_climate_change: "기후 변화와의 본격적인 투쟁"
 DEN_serious_fight_climate_change_desc: "과감한 정책을 시행하고, 재생 에너지에 투자하며, 탄소 중립적 관행을 촉진함으로써, 정부는 온실가스 배출 감축과 지구 온난화 영향 완화에서 모범을 보이며 앞장서고자 합니다."
 DEN_entrepreneurship: "기업가 정신"
 DEN_entrepreneurship_desc: "덴마크는 맞춤형 구상과 인센티브를 통해 기업가 정신과 소기업 발전을 지원합니다. 자금 접근성, 멘토링, 지원 서비스를 제공함으로써, 정부는 활기찬 창업 생태계를 조성하고 혁신과 경제 성장을 이끌고자 합니다."
 DEN_cooperate_with_the_People: "국민과의 협력"
 DEN_cooperate_with_the_People_desc: "덴마크는 산업 정책과 구상을 형성하는 데 시민 및 지역 사회와의 협업과 협력을 강조합니다. 이해관계자를 의사 결정 과정에 참여시키고, 참여형 거버넌스를 촉진하며, 대화를 장려함으로써, 정부는 산업 부문 내에서 신뢰, 책임성, 회복력을 구축하고자 합니다."
 DEN_found_Visitdenmark: "비짓덴마크 설립"
 DEN_found_Visitdenmark_desc: "비짓덴마크의 설립은 관광을 촉진하고 덴마크의 풍부한 문화유산, 자연의 아름다움, 활기찬 도시 생활을 세계에 알리려는 덴마크 정부의 결집된 노력을 나타냅니다."
 DEN_expand_the_workforce: "노동력 확대"
 DEN_expand_the_workforce_desc: "교육, 직업 훈련, 일자리 창출 구상에 투자함으로써, 정부는 노동력 부족에 대처하고 경제 성장을 이끌며 국가의 장기적 번영을 보장하고자 합니다."
 DEN_Integrate_to_workforce: "노동력으로의 통합"
 DEN_Integrate_to_workforce_desc: "덴마크는 이민자의 노동력 통합을 우선시합니다. 언어 과정, 기술 훈련, 고용 지원 서비스를 제공함으로써, 정부는 이민자들이 경제에 의미 있게 기여하고, 사회 통합을 촉진하며, 다양하고 포용적인 노동 시장을 조성하도록 힘을 실어 주고자 합니다."
 DEN_refugee_welfare: "난민 복지"
 DEN_refugee_welfare_desc: "덴마크는 망명 신청자와 난민에게 필수 서비스, 지원망, 통합 프로그램을 제공하여 난민 복지를 보장함으로써 인도주의적 가치에 대한 의지를 보여 줍니다."
 DEN_Famliy_visa: "가족 비자"
 DEN_Famliy_visa_desc: "덴마크는 가족 비자로 가족 재결합과 결속을 지원하여, 이민자가 직계 가족을 덴마크로 초청해 함께 살 수 있도록 합니다."
 DEN_Strict_point_system: "엄격한 점수제"
 DEN_Strict_point_system_desc: "덴마크는 이민에 엄격한 점수제를 시행하여 학력, 업무 경력, 언어 능력 및 기타 관련 요소와 같은 기준에 따라 신청자의 우선순위를 정합니다."
 DEN_skilled_occupation_Visa: "숙련 직종"
 DEN_skilled_occupation_Visa_desc: "덴마크는 숙련 직종 중점으로 특정 직업과 산업을 겨냥하여, 수요가 높은 분야에서 전문성과 경험을 지닌 사람들의 이민 경로를 간소화합니다."
 DEN_Student_and_holiday_working_visa: "학생 및 워킹 홀리데이 비자"
 DEN_Student_and_holiday_working_visa_desc: "학생, 인턴, 휴가 체류자의 단기 체류를 원활히 함으로써, 정부는 문화 간 이해를 증진하고 국제 협력을 촉진하며 덴마크를 교육과 여가를 위한 선호 목적지로 알리고자 합니다."
 DEN_found_Nye_Borgerlige: "뉘에 보르게를리에 창당"
 DEN_found_Nye_Borgerlige_desc: "덴마크는 뉘에 보르게를리에를 통해 새로 온 이들이 정치 환경에 통합되도록 지원하며, 이민자 공동체와 다양한 관점을 대변하는 새로운 정당의 결성을 장려합니다."
 DEN_strengthen_Danish_community_of_value: "덴마크 가치 공동체 강화"
 DEN_strengthen_Danish_community_of_value_desc: "시민 참여, 사회 통합, 상호 존중을 촉진함으로써, 정부는 국적이나 배경에 관계없이 덴마크 사회의 모든 구성원 사이에 소속감과 연대감을 키우고자 합니다."
 DEN_a_new_liberal_Economie: "새로운 자유주의 경제"
 DEN_a_new_liberal_Economie_desc: "덴마크는 혁신, 기업가 정신, 경제적 역동성에 초점을 맞춘 새로운 자유주의 경제를 받아들입니다. 기업 설립의 장벽을 없애고, 경쟁적인 기업 환경을 조성하며, 신흥 산업에 대한 투자를 촉진함으로써, 정부는 경제 성장을 이끌고 일자리를 창출하며 덴마크를 혁신과 기업의 중심지로 자리매김하고자 합니다."
 DEN_direct_democracy: "직접 민주주의"
 DEN_direct_democracy_desc: "덴마크는 직접 민주주의 중점으로 시민이 의사 결정 과정에 직접 참여할 수 있도록 힘을 실어 주며, 시민 의회, 국민투표, 온라인 협의와 같은 구상을 촉진합니다."
 DEN_future_of_welfare: "복지의 미래"
 DEN_future_of_welfare_desc: "덴마크는 변화하는 경제적, 인구학적 과제 속에서도 사회 안전망이 견고하고 지속 가능하도록 보장하기 위한 혁신적 접근법을 모색하며 복지의 미래에 대한 비전을 제시합니다."
 DEN_minimal_welfare: "최소 복지"
 DEN_minimal_welfare_desc: "덴마크는 사회 지원 프로그램을 간소화하고 국가 지원에 대한 의존도를 줄이는 것을 목표로 최소 복지 정책을 채택합니다."
 DEN_Economic_first: "경제 우선"
 DEN_Economic_first_desc: "덴마크는 튼튼한 복지 국가의 토대로서 강력하고 역동적인 경제를 육성하는 일의 중요성을 인정하여 경제 우선 정책을 우선시합니다."
 DEN_reduce_taxation: "세금 인하"
 DEN_reduce_taxation_desc: "덴마크는 경제 성장을 자극하고, 투자를 장려하며, 생산성에 대한 유인을 제공하는 수단으로서 세금 인하를 약속합니다."
 DEN_Form_minimal_state: "최소 국가 수립"
 DEN_Form_minimal_state_desc: "덴마크는 최소 국가를 수립하여 복지 서비스와 사회적 지원을 제공하는 데 있어 정부의 역할을 재정립하고자 합니다. 관료제를 간소화하고, 책임을 지방 당국에 이양하며, 지역 사회가 스스로의 필요를 해결하도록 권한을 부여함으로써, 정부는 더 군더더기 없고 효율적인 국가 기구를 육성하고자 합니다."
 DEN_basic_welfare: "기초 복지"
 DEN_basic_welfare_desc: "덴마크는 모든 시민이 기초 복지를 누릴 수 있도록 보장하며, 의료, 교육, 주거와 같은 필수 서비스를 기본권으로 보장합니다."
 DEN_reform_taxation: "조세 개혁"
 DEN_reform_taxation_desc: "덴마크는 21세기에 맞게 세제를 현대화하고 최적화하기 위한 포괄적인 조세 개혁에 착수합니다. 세법을 단순화하고, 허점을 막으며, 공정성과 누진성을 보장함으로써, 정부는 경제의 왜곡과 비효율을 최소화하면서 세수 창출을 높이고자 합니다."
 DEN_Schroder_Blair_paper: "슈뢰더-블레어 문서"
 DEN_Schroder_Blair_paper_desc: "덴마크는 복지 국가를 현대화하고 활성화하기 위한 일련의 개혁을 제안하는 슈뢰더-블레어 문서에 제시된 권고안을 검토합니다. 혁신적인 아이디어와 증거에 기반한 정책 해법을 받아들임으로써, 정부는 복지 체계가 덴마크 사회의 변화하는 필요와 열망에 부응하도록 조정하고자 합니다."
 DEN_keep_welfare: "복지 유지"
 DEN_keep_welfare_desc: "덴마크는 모든 시민이 평생에 걸쳐 필수 서비스와 지원을 받을 수 있도록 보장하며, 복지 유지가 사회 계약의 초석임을 재확인합니다."
 DEN_increase_taxes: "세금 인상"
 DEN_increase_taxes_desc: "덴마크는 복지 프로그램을 유지하고 확대하는 데 추가 재원이 필요하다고 보고 세금 인상 조치를 시행합니다. 정부는 부와 소득에 누진세를 부과하여 복지국가 재원 조달의 부담을 공평하게 분담하고 모든 국민의 필요를 충족할 충분한 자원을 확보하고자 합니다."
 DEN_Tax_the_rich: "부자 과세"
 DEN_Tax_the_rich_desc: "덴마크는 소득 불평등을 해소하고 사회 복지 프로그램의 재원을 마련하기 위해 부자 과세 정책을 채택합니다. 정부는 고소득자와 부유층에 더 높은 세율을 적용함으로써 사회 정의를 높이고 도움이 필요한 이들을 지원하도록 자원을 재분배하고자 합니다."
 DEN_stabilisation_of_Welfare: "복지 안정화"
 DEN_stabilisation_of_Welfare_desc: "덴마크는 사회 안전망의 장기적 지속 가능성과 회복력을 보장하기 위해 복지 안정화에 주력합니다. 정부는 비용을 통제하고 위험을 완화하며 변화하는 인구 구조와 경제 여건에 적응하는 조치를 시행하여 다음 세대를 위해 복지 프로그램을 지키고자 합니다."
 DEN_found_New_Aliance: "새로운 동맹 결성"
 DEN_found_New_Aliance_desc: "덴마크는 복지 문제에 공동으로 대응하기 위해 사회 전반의 이해관계자들 사이에 새로운 동맹을 결성하고자 합니다. 정부는 대화를 촉진하고 합의를 이끌어 내며 자원을 동원하여 사회 진보와 혁신을 위한 연합을 만들고, 긍정적인 변화를 추진하여 복지국가의 토대를 강화하고자 합니다."
 DEN_fight_radicals: "급진주의자와의 투쟁"
 DEN_fight_radicals_desc: "덴마크는 극단주의 이념과 폭력으로 복지국가와 민주주의 제도를 훼손하려는 급진주의자들에 맞서 행동에 나섭니다. 정부는 관용과 다원주의, 사회 결속을 증진하여 급진화에 대응하고 민주주의와 인권, 평등의 가치를 수호하고자 합니다."
 DEN_economic_liberalism: "경제적 자유주의"
 DEN_economic_liberalism_desc: "덴마크는 자유 시장과 경쟁, 개인의 자유를 번영과 복지의 원동력으로 강조하는 경제적 자유주의를 받아들입니다. 정부는 정부 개입을 줄이고 기업가 정신을 장려하며 기업 친화적인 환경을 조성하여 경제의 잠재력을 최대한 발휘하게 하고 모든 국민이 번영할 기회를 만들고자 합니다."
 DEN_no_welfare_without_grow: "성장 없이는 복지도 없다"
 DEN_no_welfare_without_grow_desc: "덴마크는 성장 없이는 복지도 없다고 주장하며 경제적 번영이 사회적 안녕의 토대임을 강조합니다. 정부는 투자와 혁신, 생산성을 촉진하는 정책을 추진하여 지속 가능한 성장을 이루고 복지 프로그램의 재정적 타당성을 보장하고자 합니다."
 DEN_sharpen_profil: "국가 이미지 강화"
 DEN_sharpen_profil_desc: "덴마크는 복지 혁신과 사회 정책 분야의 세계적 선도국으로서 위상을 더욱 뚜렷이 하고자 합니다. 정부는 모범 사례를 알리고 지식을 공유하며 국제 협력을 촉진하여, 효과적이고 공평한 복지 제공의 모범으로서 덴마크의 명성을 강화하고 전 세계에 긍정적인 변화를 불러일으키고자 합니다."
 DEN_Reform_Independent_public_Company: "독립 공기업 개혁"
 DEN_Reform_Independent_public_Company_desc: "덴마크는 독립 공기업의 효율성과 효과성을 높이기 위한 개혁에 착수합니다. 정부는 운영을 간소화하고 지배구조를 개선하며 책임성과 투명성을 높여 필수 서비스의 제공을 최적화하고 공공 자원이 책임 있게 관리되도록 하고자 합니다."
 DEN_Energinet_dk: "에네르기넷"
 DEN_Energinet_dk_desc: "덴마크는 에네르기넷에 대한 투자를 통해 에너지 안보와 지속 가능성에 대한 의지를 강화합니다. 정부는 인프라를 현대화하고 재생 에너지 설비 용량을 늘리며 에너지 효율을 높여, 기후 변화의 영향을 완화하면서 안정적이고 회복력 있는 에너지 공급을 보장하고자 합니다."
 DEN_Naviair: "나비에어"
 DEN_Naviair_desc: "덴마크는 나비에어에 투자하여 항공 교통 관리와 안전 기준을 강화합니다. 정부는 항공 교통 관제 시스템을 현대화하고 공역 수용 능력을 개선하며 국제 파트너들과 협력하여 여객과 화물의 안전하고 효율적인 항공 운송을 촉진하고자 합니다."
 DEN_Danske_Statsbaner: "덴마크 국유철도"
 DEN_Danske_Statsbaner_desc: "덴마크는 덴마크 국유철도에 대한 투자를 통해 철도 운송 체계를 현대화합니다. 정부는 철도 인프라를 개선하고 서비스망을 확대하며 지속 가능한 이동 수단을 장려하여 연결성을 높이고 혼잡을 줄이며 친환경 교통 대안을 촉진하고자 합니다."
 DEN_form_Postnord: "포스트노르드 설립"
 DEN_form_Postnord_desc: "덴마크는 포스트노르드를 설립하여 우편 및 물류 서비스를 재편합니다. 정부는 유통망을 현대화하고 최종 구간 배송 역량을 개선하며 디지털 혁신을 받아들여, 소비자와 기업의 변화하는 수요에 부응하는 동시에 우편 서비스의 보편적 접근성을 보장하고자 합니다."
 DEN_Finansiel_Stabilitet: "금융안정공사"
 DEN_Finansiel_Stabilitet_desc: "덴마크는 금융안정공사를 중심으로 한 이니셔티브를 통해 금융 안정과 회복력을 강화합니다. 정부는 금융 기관을 규제하고 감독하며 시스템 리스크를 관리하고 위기 관리를 지원하여 금융 시스템의 건전성을 지키고 예금자와 투자자의 이익을 보호하고자 합니다."
 DEN_explore_digital_possibilitys: "디지털 가능성 탐구"
 DEN_explore_digital_possibilitys_desc: "덴마크는 시민과 기업의 이익을 위해 기술을 활용할 혁신적인 방법을 모색하며 디지털 가능성 탐구의 여정에 나섭니다. 정부는 협력과 실험, 지식 공유를 촉진하여 사회적 과제를 해결하고 공공 서비스를 개선할 디지털 솔루션의 잠재력을 최대한 끌어내고자 합니다."
 DEN_life_long_learning: "평생 학습"
 DEN_life_long_learning_desc: "덴마크는 시민이 급변하는 디지털 경제에서 번영하는 데 필요한 디지털 기술과 역량을 갖추도록 평생 학습 이니셔티브에 투자합니다. 정부는 디지털 소양 교육과 직업 훈련, 평생 교육 기회에 대한 접근성을 넓혀 개인이 기술 변화에 적응하고 개인적, 직업적 성장의 새로운 기회를 잡도록 돕고자 합니다."
 DEN_digital_gouverment_act: "디지털 정부법"
 DEN_digital_gouverment_act_desc: "덴마크는 디지털 전환을 통해 정부 서비스를 현대화하고 간소화하기 위해 디지털 정부법을 제정합니다. 정부는 표준을 정하고 체계를 마련하며 상호 운용성을 촉진하여 공공 서비스 제공을 개선하고 시민 참여를 높이며 디지털 데이터의 보안과 사생활을 보장하고자 합니다."
 DEN_mobile_broadband: "모바일 광대역"
 DEN_mobile_broadband_desc: "덴마크는 전국에서 고속 인터넷에 접속할 수 있도록 모바일 광대역 인프라에 투자합니다. 정부는 5G 네트워크를 구축하고 농촌 지역의 통신 범위를 개선하며 통신 사업자 간 경쟁을 촉진하여 디지털 격차를 해소하고 모든 국민이 온라인 서비스와 정보에 끊김 없이 접근하도록 하고자 합니다."
 DEN_NemID: "NemID"
 DEN_NemID_desc: "덴마크는 시민이 정부 서비스에 접근하고 온라인 거래를 쉽고 편리하게 할 수 있는 보안 디지털 신원 확인 시스템인 NemID를 도입합니다. 정부는 단일하고 신뢰할 수 있는 신원 증명 수단을 제공하여 인증 절차를 간소화하고 사이버 보안을 강화하며 디지털 포용을 촉진하고자 합니다."
 DEN_Digital_post: "디지털 우편"
 DEN_Digital_post_desc: "덴마크는 정부 기관의 공식 통지를 시민에게 전자적으로 전달하는 디지털 우편 서비스인 디지털 우편으로 전환합니다. 정부는 종이 기반 서신을 디지털화하고 행정 비용을 줄이며 효율성을 개선하여 소통 경로를 간소화하고 시민이 필수 정보와 서비스에 제때 접근하도록 하고자 합니다."
 DEN_NemKonto: "NemKonto"
 DEN_NemKonto_desc: "덴마크는 시민이 정부 지급금과 급여를 은행 계좌로 직접 받을 수 있는 디지털 결제 시스템인 NemKonto를 도입합니다. 정부는 지급 처리를 간소화하고 행정 부담을 줄이며 재정 투명성을 높여 공공 지출의 효율성과 건전성을 개선하고자 합니다."
 DEN_BorDEN_dk: "BorDEN"
 DEN_BorDEN_dk_desc: "덴마크는 정부 기관과 기업, 시민 간의 협력과 정보 공유를 지원하는 디지털 플랫폼인 BorDEN을 개발합니다. 정부는 데이터 관리를 중앙화하고 데이터 상호 운용성을 촉진하며 안전한 소통 경로를 마련하여 공공 부문 전반의 조정과 혁신, 서비스 제공을 강화하고자 합니다."
 DEN_Pluralist_state: "다원주의 국가"
 DEN_Pluralist_state_desc: "덴마크는 사회 내 다양한 관점과 신념, 정체성을 인정하고 존중하는 다원주의 원칙을 받아들입니다. 정부는 관용과 포용, 소수자 권리 존중을 증진하여 모든 개인이 자유롭게 자신을 표현하고 의사 결정 과정에 참여하며 덴마크 문화와 민주주의의 풍요로움에 기여할 수 있는 다원주의 국가를 가꾸고자 합니다."
 DEN_Copenhagen_Metro: "코펜하겐 지하철"
 DEN_Copenhagen_Metro_desc: "덴마크는 수도권을 잇는 현대적이고 효율적인 대중교통 체계인 코펜하겐 지하철의 확장과 개선에 투자합니다. 정부는 기존 노선을 연장하고 새 역을 건설하며 다른 교통수단과 연계하여 연결성을 높이고 혼잡을 줄이며 주민과 방문객 모두를 위한 지속 가능한 도시 이동성을 촉진하고자 합니다."
 DEN_Copenhagen_Malmo_Port: "코펜하겐-말뫼 항만"
 DEN_Copenhagen_Malmo_Port_desc: "덴마크와 스웨덴은 두 도시를 잇고 발트해 지역의 무역과 상업을 활성화하는 전략적 해상 거점인 코펜하겐-말뫼 항만의 개발에 협력합니다. 양국 정부는 항만 인프라와 물류 시설, 복합 운송 연결망에 투자하여 지역 경쟁력을 높이고 경제 성장을 촉진하며 국경 간 협력을 강화하고자 합니다."
 DEN_expand_the_Port: "항만 확장"
 DEN_expand_the_Port_desc: "코펜하겐-말뫼 항만의 성공으로 우리는 큰 확신을 얻었으며, 항만을 추가로 확장하는 것은 유익한 조치가 될 것입니다."
 DEN_more_Imports: "수입 능력 확대"
 DEN_more_Imports_desc: "코펜하겐-말뫼 항만의 성공으로 우리는 큰 확신을 얻었으며, 수입 능력을 추가로 확대하는 것은 유익한 조치가 될 것입니다."
 DEN_more_exports: "수출 능력 확대"
 DEN_more_exports_desc: "코펜하겐-말뫼 항만의 성공으로 우리는 큰 확신을 얻었으며, 수출 능력을 추가로 확대하는 것은 유익한 조치가 될 것입니다."
 DEN_copenhagen_opera_house: "코펜하겐 오페라 하우스"
 DEN_copenhagen_opera_house_desc: "덴마크는 오페라와 발레, 클래식 음악 공연을 위한 세계적 수준의 공연장인 코펜하겐 오페라 하우스를 건설하여 문화유산과 예술적 우수성을 기립니다. 정부는 최첨단 시설을 제공하고 예술 혁신을 촉진하며 문화 교류를 장려하여 코펜하겐의 문화 풍경을 풍요롭게 하고 전 세계의 관객을 끌어들이고자 합니다."
 DEN_fehmarn_belt_fixed_link: "페마른벨트 고정 연결로"
 DEN_fehmarn_belt_fixed_link_desc: "덴마크는 덴마크와 독일을 잇는 철도와 도로 고정 연결로를 만드는 대규모 인프라 사업인 페마른벨트 고정 연결로 건설에 착수합니다. 정부는 페마른벨트 해협 아래에 터널을 건설하여 교통 연결을 개선하고 무역과 관광을 촉진하며 발트해 지역의 경제 통합을 강화하여 이웃 국가 간의 번영과 협력을 도모하고자 합니다."
 DEN_the_politics_of_denmark_desc: "덴마크의 정치는 이 나라의 민주주의 원칙을 담고 있으며, 열린 대화, 정치적 다원주의, 시민 참여를 장려합니다. 합의 형성과 사회적 책임의 전통에 뿌리를 둔 덴마크 정치는 대의 통치와 개인의 자유 및 권리 보호에 대한 헌신을 반영합니다."
 DEN_western_Democracy: "서구 민주주의"
 DEN_western_Democracy_desc: "덴마크는 자유와 평등, 인권이라는 핵심 원칙을 지키며 서구 민주주의에 대한 헌신을 재확인합니다. 정부는 민주적 가치를 옹호하고 다른 서방 국가들과의 협력을 증진하여 법치를 수호하고 국내외에서 민주적 이상을 촉진하고자 합니다."
 DEN_the_queens_truth: "여왕의 진실"
 DEN_the_queens_truth_desc: "마르그레테 2세 여왕이 정직과 투명성을 내세운 캠페인을 시작하여 덴마크 국민과 신뢰를 쌓고 군주제의 포부에 대한 지지를 모으고자 합니다."
 DEN_increase_royal_influence: "왕실 영향력 확대"
 DEN_increase_royal_influence_desc: "왕실은 역사적 위신과 문화적 의의를 활용하여 여론을 자신에게 유리하게 돌리기 위해 덴마크 사회 내 영향력의 범위를 넓히려는 조직적인 노력을 시작합니다."
 DEN_office_of_international_relations: "국제 관계실"
 DEN_office_of_international_relations_desc: "왕실은 국제적 동맹의 중요성을 인식하고, 외교 관계를 구축하며 군주제의 대의에 우호적인 외국 세력의 지지를 얻기 위해 국제 관계실을 설립합니다."
 DEN_Mainland_hemisphere: "본토 권역"
 DEN_Mainland_hemisphere_desc: "권력 공고화를 염두에 둔 왕실은 덴마크 본토에 대한 영향력을 강화하는 데 집중하며 자원을 동원하고 지지자들을 자신의 깃발 아래 결집시킵니다."
 DEN_Island_hemisphere: "도서 권역"
 DEN_Island_hemisphere_desc: "왕실은 해외의 덴마크 영토로 시선을 돌려 페로 제도와 그린란드에 대한 권위를 확장하고, 덴마크 왕국을 통합하는 구심점으로서 자신의 입지를 굳히고자 합니다."
 DEN_establish_the_royal_nordic_institute: "왕립 북유럽 연구소 설립"
 DEN_establish_the_royal_nordic_institute_desc: "왕실은 북유럽의 단결과 협력을 촉진하기 위해, 북유럽 국가들 간의 문화 교류와 협력을 증진하는 데 헌신하는 권위 있는 기관인 왕립 북유럽 연구소를 설립합니다."
 DEN_royal_branding: "왕실 브랜딩"
 DEN_royal_branding_desc: "왕실은 대중적 이미지를 높이기 위해 포괄적인 브랜딩 캠페인을 개시하여, 덴마크 국민의 열망에 부합하는 현대적이고 진보적인 기관으로 자신을 내세웁니다."
 DEN_spread_the_word: "메시지 확산"
 DEN_spread_the_word_desc: "왕실은 전략적인 메시지 전달과 언론 홍보를 통해 군주제 부활에 대한 구상을 널리 알리고, 지지자들을 결집시키며 의회 민주주의의 실효성에 대한 의구심을 퍼뜨립니다."
 DEN_the_wedding_of_crone_prince_frederik: "프레데리크 왕세자의 왕실 결혼식"
 DEN_the_wedding_of_crone_prince_frederik_desc: "왕실은 화려한 왕가의 위용을 과시하며 프레데리크 왕세자의 결혼식을 치러 덴마크 국민의 마음을 사로잡고 현대 사회에서 군주제가 지닌 존재 의의를 다시 확인시킵니다."
 DEN_question_democratic_values: "민주적 가치에 대한 의문 제기"
 DEN_question_democratic_values_desc: "왕실은 민주적 통치의 실효성에 의문을 제기하며 그 결점으로 인식되는 부분을 부각하고, 군주제의 비호 아래 더 안정적이고 권위 있는 통치 체제를 옹호합니다."
 DEN_democracys_weakness: "민주주의의 약점"
 DEN_democracys_weakness_desc: "왕실은 학술 연구와 공론을 통해 민주주의 체제의 취약점을 폭로하고, 이를 교착과 비효율, 불안정에 빠지기 쉬운 체제로 묘사합니다."
 DEN_start_the_transission: "전환 개시"
 DEN_start_the_transission_desc: "준비가 진행되면서 왕실은 의회 정부에서 군주제로 점진적으로 권력을 이양하는 기반을 닦으며, 민주적 질서의 당연한 후계자로 자리매김합니다."
 DEN_prepare_for_violence: "폭력 사태 대비"
 DEN_prepare_for_violence_desc: "기득권 정치 세력의 저항을 예상한 왕실은 잠재적 소요와 격변에 은밀히 대비하며 군주제와 그 지지자들의 안전과 보안을 확보합니다."
 DEN_contact_the_army: "군부 접촉"
 DEN_contact_the_army_desc: "왕실은 비공개로 군 핵심 지도부에 접촉하여, 의회 정부와의 대결이 벌어질 경우 그들의 충성과 지지를 보장받고자 합니다."
 DEN_a_peaceful_change: "평화적 변화"
 DEN_a_peaceful_change_desc: "충돌의 위협에도 불구하고 왕실은 평화적인 권력 이양에 계속 전념하며, 목표를 달성하는 가장 바람직한 수단으로 대화와 협상을 강조합니다."
 DEN_force_parliament_into_submission: "의회 굴복 강요"
 DEN_force_parliament_into_submission_desc: "압박이 커지고 여론이 자신에게 유리하게 기울면서 왕실은 더욱 단호한 입장을 취하여, 의회 정부에 양보를 요구하고 군주제의 권위를 인정하도록 강제합니다."
 DEN_overthrow_with_force: "무력 전복"
 DEN_overthrow_with_force_desc: "긴장이 극에 달하자 왕실은 의회 정부를 무너뜨리고 자신의 우위를 확립하기 위해 무력 사용을 승인하며, 덴마크를 위기와 불확실성의 상태로 몰아넣습니다."
 DEN_the_king_of_denmark: "덴마크 국왕"
 DEN_the_king_of_denmark_desc: "격변이 지나간 뒤, 프레데리크 10세 왕세자가 선대 국왕들의 뒤를 이어 덴마크의 새 국왕으로 즉위합니다. 군주제가 통치 권력으로 굳건히 자리 잡은 가운데, 프레데리크 10세 국왕은 지혜와 연민, 그리고 덴마크 국민의 복지에 대한 변함없는 헌신으로 나라를 이끌겠다고 서약합니다."
 DEN_secure_the_dynasty: "왕조 보전"
 DEN_secure_the_dynasty_desc: "군주제가 복원되자 프레데리크 10세 국왕은 안정과 승계, 왕가 혈통의 연속성을 보장하여 왕조의 미래를 지키는 것을 최우선 과제로 삼습니다."
 DEN_house_Windsor: "윈저 왕가"
 DEN_house_Windsor_desc: "영국 군주제에서 영감을 얻은 프레데리크 10세 국왕은 윈저 왕가와의 유대를 강화하여 유럽에서 가장 오래 이어진 왕실 가문 중 하나의 지지와 조언을 구합니다."
 DEN_house_hohenzollern: "호엔촐레른 왕가"
 DEN_house_hohenzollern_desc: "프레데리크 10세 국왕은 독일의 풍부한 왕실 유산을 받아들여 호엔촐레른 왕가와 외교적 동맹을 맺고, 유럽 군주국들 사이의 상호 협력과 연대를 도모합니다."
 DEN_belgium_houses: "작센코부르크벨기에 왕가"
 DEN_belgium_houses_desc: "프레데리크 10세 국왕은 벨기에와의 연대의 표시로 덴마크와 작센코부르크벨기에 왕가 사이의 역사적 유대를 재확인하고, 두 왕실 간의 우정과 협력을 증진합니다."
 DEN_houses_of_the_netherlands: "오라녀나사우 왕가"
 DEN_houses_of_the_netherlands_desc: "프레데리크 10세 국왕은 이웃 네덜란드와의 유대를 강화하여 오라녀나사우 왕가와 긴밀한 동반자 관계를 맺고, 덴마크와 네덜란드 군주국 간의 문화 교류와 협력을 높입니다."
 DEN_proclaim_an_empire: "제국 선포"
 DEN_proclaim_an_empire_desc: "덴마크가 왕정 통치의 새 시대에 들어서면서 프레데리크 10세 국왕은 덴마크 제국의 수립을 선포하여, 세계적 강국으로 되살아난 국가의 위상을 상징하고 역사적 유산을 재확인합니다."
 DEN_the_fate_of_the_monarchy: "군주제의 운명"
 DEN_the_fate_of_the_monarchy_desc: "추측과 불확실성이 난무하는 가운데 프레데리크 10세 국왕이 국민에게 연설하여 군주제에 대한 헌신을 재확인하고, 왕실의 지도 아래 번영하고 통합된 덴마크에 대한 구상을 밝힙니다."
 DEN_traditional_monarchy: "전통 군주제"
 DEN_traditional_monarchy_desc: "프레데리크 10세 국왕은 덴마크 군주제의 전통과 관습을 받아들여, 국가를 통합하는 힘으로서 군주제의 의례적 책무와 문화유산, 상징적 의의를 지켜 나갑니다."
 DEN_adopt_new_traditions: "새로운 전통 도입"
 DEN_adopt_new_traditions_desc: "프레데리크 10세 국왕은 전통을 존중하는 한편, 현대 덴마크 사회의 변화하는 요구와 기대에 부응하도록 군주제를 적응시키고 발전시키려 하며, 오늘날의 가치와 열망에 공감을 얻는 새로운 관습과 의례를 도입합니다."
 DEN_a_new_way: "새로운 길"
 DEN_a_new_way_desc: "프레데리크 10세 국왕은 미래지향적인 접근으로 군주제의 새로운 진로를 개척하며, 21세기 덴마크 국민의 요구에 대한 혁신과 포용, 대응성을 강조합니다."
 DEN_international_recognition: "국제적 인정"
 DEN_international_recognition_desc: "프레데리크 10세 국왕은 세계 무대에서 덴마크의 위상을 높이고자 외교적 매력 공세에 나서, 덴마크의 단결과 정체성의 상징으로서 군주제의 역할에 대한 국제적 인정과 존중을 얻어 냅니다."
 DEN_strengthen_the_regency: "섭정 체제 강화"
 DEN_strengthen_the_regency_desc: "프레데리크 10세 국왕은 유능하고 충성스러운 섭정 체제의 중요성을 인식하여, 신뢰하는 고문과 측근을 궁정의 핵심 직책에 임명함으로써 군주제 업무의 효과적인 통치와 관리를 보장합니다."
 DEN_build_up_advisors: "고문단 구성"
 DEN_build_up_advisors_desc: "프레데리크 10세 국왕은 다양한 분야의 노련한 고문과 전문가로 팀을 꾸려 국정 운영과 통치, 정책 수립에 관한 자문과 지도를 받음으로써, 정보에 기반한 의사 결정과 전략 기획에 대한 군주제의 역량을 높입니다."
 DEN_create_a_protocol: "의전 제정"
 DEN_create_a_protocol_desc: "프레데리크 10세 국왕은 군주제에 걸맞은 품위와 예법을 유지하기 위해 왕실 의식과 행사, 일정에 대한 공식 의전을 마련하여, 수 세기 동안 덴마크 왕실을 규정해 온 전통과 의전을 보존합니다."
 DEN_establish_the_court: "궁정 설치"
 DEN_establish_the_court_desc: "왕실 행정의 중심에서 프레데리크 10세 국왕은 왕실 활동과 통치, 의례 업무의 중추가 될 궁정을 설치하여 왕실 구성원들 사이에 공동체 의식과 동료애를 길러 냅니다."
 DEN_implement_the_new_dkr: "새 덴마크 크로네 도입"
 DEN_implement_the_new_dkr_desc: "군주제가 통치 권력으로 굳건히 뿌리내린 가운데, 프레데리크 10세 국왕은 왕실 지도와 경제적 번영에 대한 국가의 새로운 헌신을 상징하는 쇄신된 통화인 새 덴마크 크로네(DKR)를 도입합니다."
 DEN_Expand_task_force_north: "북방 기동부대 확대"
 DEN_Expand_task_force_north_desc: "이제 EU 체제 내에서 핵심적인 수단으로 자리 잡은 북방 기동부대는 연합의 집단 안보 목표에 대한 덴마크의 적극적인 참여와 변함없는 지지를 나타냅니다. 작전 범위를 넓히고 EU 방위 구조 내 통합을 심화함으로써 북방 기동부대는 EU 회원국 간의 협력과 연대를 증진하려는 덴마크의 의지를 구현합니다."
 DEN_middle_Europe_focus: "중부 유럽 중시"
 DEN_middle_Europe_focus_desc: "지역 협력과 연대의 중요성을 강조하며 덴마크는 중부 유럽 국가들과 더 긴밀한 관계를 쌓는 데 외교적 노력을 집중합니다. 덴마크는 대화와 협력, 공동 이니셔티브를 통해 중부 유럽의 이웃 국가들과 외교, 경제, 문화 관계를 강화하여 지역 전반의 안정과 번영을 증진하고자 합니다."
 DEN_ties_to_France: "프랑스와의 유대"
 DEN_ties_to_France_desc: "덴마크 정부는 프랑스를 유럽의 핵심 동맹이자 파트너로 인식하여 프랑스와의 양자 관계를 심화하는 것을 최우선으로 삼습니다. 덴마크는 외교 교류와 공동 프로젝트, 전략적 협력을 통해 덴마크-프랑스 동반자 관계를 강화하고, 국방과 안보에서 기후 행동과 문화 교류에 이르는 폭넓은 사안에서 상호 이해와 협력을 증진하고자 합니다."
 DEN_ties_to_GB: "영국과의 유대"
 DEN_ties_to_GB_desc: "덴마크는 역사적 유대와 공유하는 가치를 바탕으로 영국과의 외교 관계를 강화하고자 노력합니다. 덴마크는 대화와 무역 협정, 공동 이니셔티브를 통해 영국과의 양자 동반자 관계를 심화하고, 무역, 국방, 연구, 혁신 등의 분야에서 협력을 증진하며, 브렉시트의 복잡한 문제를 헤쳐 나가면서 EU 탈퇴 이후에도 지속적인 협력을 보장하고자 합니다."
 DEN_German_partner: "독일 파트너"
 DEN_German_partner_desc: "덴마크는 독일을 핵심 전략적 파트너이자 이웃으로 인식하여 독일과의 외교 및 경제 관계를 심화하고자 합니다. 덴마크와 독일은 고위급 회담과 공동 프로젝트, 국경 간 이니셔티브를 통해 협력하여 지역 안정과 경제 성장, 문화 교류를 증진하고, 양국 간의 굳건하고 지속적인 동반자 관계를 키워 나갑니다."
 DEN_Benelux_fokus: "베네룩스 중시"
 DEN_Benelux_fokus_desc: "덴마크는 베네룩스 지역 내 협력의 중요성을 인정하여 벨기에, 네덜란드, 룩셈부르크와의 관계 강화를 최우선으로 삼습니다. 덴마크는 공동의 노력과 외교적 교류, 공동 이니셔티브를 통해 베네룩스 국가들과의 동반자 관계를 심화하고 지역 통합과 경제 협력, 문화 교류를 증진하고자 합니다."
 DEN_Transatlantic_focus: "대서양 횡단 중시"
 DEN_Transatlantic_focus_desc: "덴마크는 대서양 횡단 관계에 대한 의지를 확인하며 미국 및 캐나다와의 관계를 심화하고자 노력합니다. 덴마크는 외교 대화와 전략적 동반자 관계, 공유하는 가치를 바탕으로 대서양 횡단 유대를 강화하고, 안보와 무역, 기술, 세계적 과제에서 협력을 증진하는 한편 나토 동맹의 중요성을 다시 강조합니다."
 DEN_ties_USA: "미국과의 유대"
 DEN_ties_USA_desc: "덴마크는 미국을 핵심 전략적 동맹이자 파트너로 인식하여 미국과의 양자 관계를 강화하고자 합니다. 덴마크는 외교적 교류와 무역 협정, 공동 이니셔티브를 통해 국방, 에너지, 혁신, 문화 교류 등 폭넓은 분야에서 미국과의 협력을 심화하는 한편, 양국 간의 굳건한 우정과 공유하는 가치의 유대를 재확인합니다."
 DEN_ties_to_Canada: "캐나다와의 유대"
 DEN_ties_to_Canada_desc: "덴마크는 공유하는 가치와 공통의 이익을 바탕으로 캐나다와의 외교 관계를 강화하고자 노력합니다. 덴마크는 대화와 협력, 공동 프로젝트를 통해 캐나다와의 동반자 관계를 심화하고, 북극 거버넌스, 환경 보호, 무역, 혁신 등의 사안에서 협력을 증진하는 한편 양국 간의 민간 교류와 문화 교류를 촉진하고자 합니다."
 DEN_ties_South_america: "남아메리카와의 유대"
 DEN_ties_South_america_desc: "덴마크는 세계 무대에서 남아메리카의 중요성이 커지고 있음을 인식하여 이 지역 국가들과의 외교 관계를 강화하고자 합니다. 덴마크는 외교적 접촉과 무역 협정, 문화 교류를 통해 남아메리카 국가들과의 관계를 심화하고, 지속 가능한 개발, 무역, 환경 보호 등의 사안에서 협력을 증진하는 한편 경제적 동반자 관계와 투자의 기회를 모색하고자 합니다."
 DEN_Eurasic_focus: "유라시아 중시"
 DEN_Eurasic_focus_desc: "덴마크는 유라시아의 전략적 중요성을 인정하여 이 지역 국가들과의 외교 관계를 강화하고자 합니다. 덴마크는 외교적 교류와 무역 협정, 문화 교류를 통해 유라시아 국가들과의 협력을 심화하고, 지역 안정과 경제 발전, 문화 교류를 증진하는 한편 인프라, 에너지, 혁신 프로젝트에서 협력할 기회를 모색하고자 합니다."
 DEN_ties_to_Russia: "러시아와의 유대"
 DEN_ties_to_Russia_desc: "덴마크는 러시아를 지역 및 세계 문제의 핵심 행위자로 인식하여 러시아와 건설적이고 실용적인 관계를 유지하고자 노력합니다. 덴마크는 외교 대화와 교류, 공동 이익에 대한 협력을 통해 상호 존중과 투명성, 대화에 기반한 관계를 키우는 한편, 이견이 있는 분야는 외교 경로와 건설적인 교류를 통해 다루고자 합니다."
 DEN_ties_to_India: "인도와의 유대"
 DEN_ties_to_India_desc: "덴마크는 세계 무대에서 인도의 영향력과 중요성이 커지고 있음을 인식하여 인도와의 외교 및 경제 관계를 심화하고자 합니다. 덴마크는 외교적 접촉과 무역 협정, 문화 교류를 통해 인도와의 동반자 관계를 강화하고, 무역, 투자, 기술, 지속 가능한 개발 등의 사안에서 협력을 증진하는 한편 양국 간의 민간 교류와 문화 교류를 촉진하고자 합니다."
 DEN_ties_to_China: "중국과의 유대"
 DEN_ties_to_China_desc: "덴마크는 중국의 부상하는 위상과 경제적 영향력을 인정하여 중국과의 외교 관계를 강화하고자 노력합니다. 덴마크는 외교적 교류와 무역 협정, 문화 교류를 통해 중국과의 동반자 관계를 심화하고, 무역, 투자, 혁신, 환경 보호 등의 사안에서 협력을 증진하는 한편 상호 관심 분야와 우려 사항에 대해 건설적인 대화를 이어 가고자 합니다."
 DEN_ties_to_Indonesia: "인도네시아와의 유대"
 DEN_ties_to_Indonesia_desc: "덴마크는 동남아시아에서 인도네시아가 지니는 전략적 중요성을 인식하여 인도네시아와의 외교 및 경제 관계를 강화하고자 합니다. 덴마크는 외교적 교류와 무역 협정, 문화 교류를 통해 인도네시아와의 동반자 관계를 강화하고, 해양 안보, 지속 가능한 개발, 재생 에너지, 문화 교류 등의 사안에서 협력을 증진하는 한편 동남아시아의 지역 안정과 번영을 촉진하고자 합니다."
 DEN_Expand_Maersk: "A.P. 묄러-머스크 그룹 확장"
 DEN_Expand_Maersk_desc: "덴마크는 선도적인 다국적 복합 기업인 A.P. 묄러-머스크 그룹의 세계적 입지와 영향력을 확대하기 위한 야심 찬 전략에 착수합니다. 덴마크는 해운, 물류, 에너지 분야의 전문성을 활용하여 이 기업이 국제 시장의 핵심 주체로서의 위치를 강화하는 동시에 지속 가능한 성장과 혁신을 촉진하고자 합니다."
 DEN_Maersk_nortsea_port: "머스크 북해 항만"
 DEN_Maersk_nortsea_port_desc: "덴마크는 북해 지역의 해상 무역과 물류 운영을 촉진하는 전략적 위치에 자리한 머스크 북해 항만의 개발과 확장에 주력합니다. 덴마크는 인프라와 기술, 연결성에 투자하여 항만의 수용 능력과 효율성, 경쟁력을 높이고 주변 지역의 경제 발전과 번영을 이끌고자 합니다."
 DEN_Maersk_American_port: "머스크 아메리카"
 DEN_Maersk_American_port_desc: "덴마크는 미국 시장의 방대한 잠재력을 활용하고 덴마크와 미국 사이의 무역 관계를 강화하기 위해 머스크 아메리카의 입지를 넓힐 기회를 추구합니다. 덴마크는 전략적 투자와 제휴, 시장 확장 이니셔티브를 통해 머스크 아메리카를 북아메리카 전역의 해운, 물류, 운송 부문의 선도 기업으로 자리매김하게 하고자 합니다."
 DEN_Maersk_Asian_port: "머스크 아시아 항만"
 DEN_Maersk_Asian_port_desc: "덴마크는 아시아 태평양 지역의 역동적인 경제 환경과 해상 서비스 수요 증가를 활용하여 머스크 아시아 항만의 전략적 개발과 성장에 주력합니다. 덴마크는 항만 인프라와 디지털화, 고객 중심 솔루션에 투자하여 머스크 아시아 항만을 아시아 무역과 상업의 으뜸가는 관문으로 만들고 지역 연결성과 번영을 이끌고자 합니다."
 DEN_Maersk_Indian_port: "머스크 인도 항만"
 DEN_Maersk_Indian_port_desc: "덴마크는 인도의 전략적 위치와 신흥 시장 잠재력을 활용하여 머스크 인도 항만의 확장과 현대화를 최우선으로 추진합니다. 덴마크는 목표를 정한 투자와 제휴, 역량 강화 이니셔티브를 통해 항만의 효율성과 연결성, 경쟁력을 높여 인도 아대륙의 무역 흐름과 경제 성장을 촉진하고자 합니다."
 DEN_Expand_Maersk_investments: "머스크 투자"
 DEN_Expand_Maersk_investments_desc: "덴마크는 머스크 투자 포트폴리오를 강화하고 수익원을 다변화하며 장기적 가치 창출을 이끌기 위해 투자 기회와 전략적 제휴를 적극적으로 모색합니다. 덴마크는 유망한 부문과 시장, 사업을 발굴하여 수익을 최적화하고 위험을 완화하며 머스크 그룹 투자 포트폴리오의 지속 가능한 성장과 발전을 뒷받침하고자 합니다."
 DEN_Expand_Maersk_Logistics: "머스크 로지스틱스"
 DEN_Expand_Maersk_Logistics_desc: "덴마크는 세계 고객의 변화하는 수요에 부응하는 종합 공급망 솔루션을 제공하는 머스크 로지스틱스 네트워크의 최적화와 확장에 주력합니다. 덴마크는 디지털화와 혁신, 운영 우수성을 통해 머스크 로지스틱스 서비스의 효율성과 신뢰성, 기민성을 높이고, 경쟁력과 성장을 이끄는 부가가치 솔루션을 제공하고자 합니다."
 DEN_Expand_Maersk_Supply_service: "머스크 서플라이 서비스"
 DEN_Expand_Maersk_Supply_service_desc: "덴마크는 해양 지원 및 선박 서비스 분야의 선도 공급업체인 머스크 서플라이 서비스의 역량과 입지를 강화합니다. 덴마크는 전문성과 선단 자산, 운영 우수성을 활용하여 머스크 서플라이 서비스의 시장 점유율을 확대하고 서비스 제공 범위를 다변화하며 해양 에너지 및 해운 부문에서 부상하는 기회를 활용하고자 합니다."
 DEN_Maersk_Global_player: "머스크 글로벌"
 DEN_Maersk_Global_player_desc: "덴마크는 다양한 시장과 산업 전반에서 머스크의 세계적 입지와 영향력을 공고히 하는 노력을 앞장서 이끕니다. 덴마크는 사업 확장과 제휴 촉진, 머스크의 전문성 활용에 초점을 맞춰 머스크 글로벌을 국제 무대에서 덴마크의 혁신과 우수성, 리더십의 상징으로 확립하고자 합니다."
 DEN_marxist_education: "마르크스주의 교육"
 DEN_marxist_education_desc: "덴마크는 더 공평하고 사회적으로 정의로운 사회를 만들기 위해 마르크스주의 원칙에서 영감을 얻어 교육 체계를 혁신하는 변혁의 여정에 나섭니다. 카를 마르크스의 이념을 받아들인 정부는 시민의 비판적 사고와 계급 의식, 집단 행동의 육성을 최우선으로 삼습니다."
 DEN_joining_brics: "BRICS 가입"
 DEN_joining_brics_desc: "덴마크는 BRICS 동맹 가입 가능성을 모색하여 세계적 동반자 관계를 강화하고 세계 무대에서의 영향력을 증폭하려는 전략적 노력에 착수합니다. 이 신흥 연합의 경제적, 정치적 잠재력에서 영감을 얻은 덴마크는 브라질, 러시아, 인도, 중국, 남아프리카 공화국과 더 긴밀한 관계를 맺어 상호 협력과 공동 성장을 도모하고자 합니다."
 DEN_a_modern_military: "현대적 군대"
 DEN_a_modern_military_desc: "덴마크 정부는 변화하는 안보 환경과 국방의 절실함을 인식하여, 덴마크의 주권을 수호하고 세계 무대에서 힘을 투사할 수 있는 현대적 군대를 육성하는 포괄적인 구상에 착수합니다."
 DEN_Green_water_Navy: "연안 해군"
 DEN_Green_water_Navy_desc: "덴마크 정부는 발트해와 북대서양 내의 연안 방어와 해상 작전에 초점을 맞춰 연안 해군의 강화에 전념합니다. 이를 위해 오덴세 철강 조선소에 크누드 라스무센급 초계함 건조 계약을 발주하여 덴마크 영해와 핵심 해양 이익의 보호를 보장합니다."
 DEN_Blue_water_Navy: "원양 해군"
 DEN_Blue_water_Navy_desc: "원정 능력으로의 전략적 전환에 따라 덴마크 정부는 먼 해역에서 힘을 투사하고 작전을 수행할 수 있는 원양 해군의 육성에 투자합니다. 이 구상의 일환으로 정부는 머스크 라인과 제휴하여 압살론급 지원함을 확보하며, 전 세계에 전개되는 덴마크 해군에 필수적인 군수 지원을 제공합니다."
 DEN_Dansk_Naval_industry: "덴마크 해군 산업"
 DEN_Dansk_Naval_industry_desc: "덴마크 정부는 강력한 자국 해군 산업의 중요성을 인식하여 현지 조선소 및 방위 계약업체와 전략적 제휴를 맺고 혁신을 촉진하며 해군 조달의 자급자족을 장려합니다. 헬싱괴르 조선소와의 협력으로 이베르 후이트펠트급 프리깃이 건조되어 덴마크의 해군 공학 및 기술 전문성을 과시합니다."
 DEN_modular_focus: "모듈식 중시"
 DEN_modular_focus_desc: "덴마크 정부는 해전에 모듈식 접근을 받아들여 해군 플랫폼과 체계의 유연성과 적응성을 우선시합니다. 티센크루프 마린 시스템즈와의 협력을 통해 덴마크는 함대용 유연한 스탠플렉스 모듈의 설계와 건조를 의뢰하여, 변화하는 작전 요구에 맞춰 신속한 재구성과 임무 특화를 가능하게 합니다."
 DEN_Fregatte: "호위함"
 DEN_Fregatte_desc: "수상 전투 능력 강화에 초점을 맞춘 덴마크 정부는 해군의 화력과 존재감을 강화하기 위해 신형 호위함 확보에 투자합니다. 오덴세 철강 조선소에 닐스 율급 호위함 건조 계약이 발주되며, 이 함정은 분쟁 환경에서 해상 우위를 보장하는 첨단 센서와 무기 체계를 갖춥니다."
 DEN_corvettes: "초계함"
 DEN_corvettes_desc: "덴마크 정부는 호위함 함대를 보완하기 위해 연안 방어와 대잠수함전에 최적화된 다목적 초계함을 도입하고자 합니다. 코쿰스 AB와의 협력으로 크누드 바이킹급 초계함이 도입되며, 이 함정은 향상된 상황 인식과 억지 능력을 위한 스텔스 기술과 첨단 소나 체계를 갖춥니다."
 DEN_Submarine_focus: "잠수함 중시"
 DEN_Submarine_focus_desc: "수중전의 전략적 중요성을 인정한 덴마크 정부는 잠수함 함대를 현대화하고 확장하기 위한 잠수함 중시 구상을 개시합니다. 사브 코쿰스와의 협력으로 214형 잠수함이 도입되며, 이 잠수함은 장기 작전 지속력과 작전 유연성을 위한 최첨단 스텔스 기술과 첨단 추진 체계를 갖춥니다."
 DEN_attack_submarines: "공격 잠수함"
 DEN_attack_submarines_desc: "덴마크 정부는 전력 투사와 해상 거부 능력에 초점을 맞춰 적 수상함과 잠수함에 대한 공세 작전을 수행할 수 있는 공격 잠수함 확보에 투자합니다. 티센크루프 마린 시스템즈에 하브만덴급 공격 잠수함 건조 계약이 발주되며, 이 잠수함은 고가치 표적에 대한 정밀 타격을 위한 첨단 어뢰와 순항 미사일을 갖춥니다."
 DEN_Rocket_subs: "미사일 잠수함"
 DEN_Rocket_subs_desc: "덴마크 정부는 신뢰할 수 있는 억지 능력의 필요성을 인식하여 전략 핵 억지력을 탑재하고 발사할 수 있는 미사일 잠수함을 확보합니다. 나발 그룹과의 협력으로 카프타인급 미사일 잠수함이 도입되며, 이 잠수함은 덴마크 해양 이익의 안보와 주권을 보장하기 위한 잠수함 발사 탄도 미사일을 갖춥니다."
 DEN_Modern_fleet: "현대화된 함대"
 DEN_Modern_fleet_desc: "덴마크 해군 현대화 노력의 초석으로서, 덴마크 정부는 21세기 해양 환경의 도전에 대응할 수 있는 현대적이고 유능한 함대의 개발을 감독합니다. 덴마크는 최첨단 기술과 플랫폼에 대한 전략적 투자를 통해 해상 국경을 수호하고 영향력 있는 해양 국가로서의 위상을 유지하겠다는 의지를 재확인합니다."
 DEN_Artillerie_question: "포병 문제"
 DEN_Artillerie_question_desc: "덴마크 정부는 현재의 능력과 미래의 필요에 대한 신중한 평가의 일환으로 전문가 위원회를 소집하여 \\"포병 문제\\"를 다루고, 기존 체계의 효용을 검토하며 개선이 필요한 분야를 파악합니다."
 DEN_US_Artillerie: "미국제 야포"
 DEN_US_Artillerie_desc: "미국과의 오랜 동반자 관계를 바탕으로 덴마크 정부는 포병 체계 분야의 협력 기회를 모색합니다. 미국 방위 계약업체와 최첨단 야포 플랫폼 조달을 위한 계약을 협상하여 대서양 건너의 첨단 기술과 전문성을 활용합니다."
 DEN_domestic_Artillerie: "국산 야포"
 DEN_domestic_Artillerie_desc: "덴마크 정부는 국가 주권과 자립을 보여 주기 위해 국산 포병 체계의 개발과 생산에 투자합니다. 현지 방위 산업 파트너에 덴마크 육군의 고유한 요구에 맞춘 토종 야포 플랫폼 제작 계약이 발주됩니다."
 DEN_French_Artillerie: "프랑스제 야포"
 DEN_French_Artillerie_desc: "덴마크 정부는 국제 동반자 관계를 확대하여 신뢰성과 성능으로 명성이 높은 프랑스제 포병 체계를 확보하기 위해 프랑스 방위 제조업체와 협정을 맺습니다. 공동 사업은 프랑스제 야포 플랫폼을 덴마크 육군 무기고에 통합하는 길을 열어 상호 운용성과 능력을 높입니다."
 DEN_ATGM: "대전차 유도 미사일"
 DEN_ATGM_desc: "덴마크 정부는 현대 위협의 변화하는 성격을 인식하여 장갑 적대 세력에 효과적으로 대응하기 위한 대전차 유도 미사일 체계 확보를 최우선으로 삼습니다. 최첨단 대전차 유도 미사일 체계 조달 계약이 체결되어 덴마크 육군에 적 장갑 위협을 무력화할 정밀 유도 화력을 제공합니다."
 DEN_SAM: "지대공 미사일"
 DEN_SAM_desc: "덴마크 정부는 덴마크 영공을 지키고 공중 위협에 대비하기 위해 방공 능력을 강화할 지대공 미사일 체계에 투자합니다. 동맹국과의 제휴로 첨단 지대공 미사일 체계 확보가 촉진되어 공중 위협에 대한 포괄적 보호를 보장합니다."
 DEN_Update_M109: "M109 개량"
 DEN_Update_M109_desc: "덴마크 정부는 현대화를 염두에 두고 M109 자주 곡사포의 개량 사업을 개시하여 전장에서의 화력과 기동성, 생존성을 높입니다. 개량에는 향상된 사격 통제 체계와 강화된 방호 조치, 첨단 탄약 통합이 포함됩니다."
 DEN_CAESAR: "CAESAR"
 DEN_CAESAR_desc: "덴마크 정부는 동맹군에서 얻은 교훈을 바탕으로 CAESAR(포병 체계를 탑재한 트럭) 자주포 체계의 조달을 모색합니다. 넥스터 시스템즈와 CAESAR 곡사포 확보 계약이 협상되어 덴마크 육군에 기동성이 높고 다용도인 포병 플랫폼을 제공합니다."
 DEN_SPA: "자주포"
 DEN_SPA_desc: "덴마크 정부는 직할 화력 지원 능력을 강화하기 위해 덴마크 자주포 체계의 확보 방안을 모색합니다. 현지 방위 계약업체와의 협력으로 기동성과 화력, 전장 효율에 최적화된 자주포 플랫폼이 개발됩니다."
 DEN_Panzerhaubitze_2000: "PzH 2000 자주 곡사포"
 DEN_Panzerhaubitze_2000_desc: "독일 방위 산업 파트너의 전문성을 활용하여 덴마크 정부는 PzH 2000 자주 곡사포의 확보를 검토합니다. 크라우스마파이 방그만과 PzH 2000 체계 조달 계약이 협상되어 덴마크 육군에 검증되고 신뢰할 수 있는 포병 플랫폼을 제공합니다."
 DEN_Arillerie_kommando: "포병 코만도"
 DEN_Arillerie_kommando_desc: "덴마크 정부는 현대전에서 포병이 지니는 결정적 역할을 인식하여 포병 작전을 감독하고 조율할 포병 코만도를 창설합니다. 고도로 훈련된 전문가들로 구성된 이 코만도는 덴마크 육군의 임무와 목표를 지원하는 포병 자산의 효과적인 운용을 보장합니다."
 DEN_Specialforces_equipment: "특수부대 장비"
 DEN_Specialforces_equipment_desc: "덴마크 정부는 덴마크 정예 특수부대의 고유한 요구를 인식하여 고도로 훈련된 이 요원들의 필요에 맞춘 특수 장비 조달에 전념합니다. 야간 투시 광학 장비, 전술 통신 체계, 첨단 개인 보호 장비를 비롯한 최첨단 장비 확보 계약이 발주됩니다."
 DEN_small_arms: "소화기"
 DEN_small_arms_desc: "덴마크 정부는 덴마크 보병이 가장 신뢰할 수 있고 효과적인 화기를 갖추도록 최첨단 소형 화기 조달에 투자합니다. 현대적인 돌격 소총, 카빈, 권총 확보 계약이 체결되어 덴마크 병사에게 전장에서 우수한 화력과 정확성을 제공합니다."
 DEN_G36: "G36"
 DEN_G36_desc: "나토 표준과 상호 운용성 요건에 맞춰 덴마크 정부는 헤클러 & 코흐 G36 소총을 덴마크 보병 부대의 제식 무기로 선정합니다. 헤클러 & 코흐와 G36 소총의 생산 및 인도 계약이 협상되어 덴마크 병사들이 다양한 작전 환경에서 자신 있고 정확하게 작전할 수 있게 합니다."
 DEN_C7: "C7"
 DEN_C7_desc: "캐나다와의 오랜 동반자 관계의 성공을 바탕으로 덴마크 정부는 보병 부대용 콜트 캐나다 C7 소총의 조달을 계속합니다. C7 소총의 생산 및 인도 계약이 갱신되어 높은 신뢰성과 성능 기준을 유지하면서 캐나다 및 기타 동맹군과의 상호 운용성을 보장합니다."
 DEN_NEW_small_arms: "신형 소화기"
 DEN_NEW_small_arms_desc: "덴마크 정부는 덴마크 보병 부대의 소형 화기 선택지를 다양화하기 위해 여러 국제 공급업체의 신형 화기 확보를 모색합니다. 덴마크 병사에게 가장 적합한 무기를 가려내기 위해 FN SCAR, 슈타이어 AUG, SIG 자우어 MCX를 비롯한 다양한 플랫폼에 대한 평가가 진행됩니다."
 DEN_Infanterie_kommando: "보병 코만도"
 DEN_Infanterie_kommando_desc: "덴마크 정부는 현대전에서 특수 보병 부대가 지니는 중요성을 인식하여 덴마크 육군 작전의 선봉 역할을 할 보병 코만도를 창설합니다. 고도로 훈련되고 다재다능한 병사들로 구성된 이 코만도는 정찰, 직접 행동, 특수 작전 임무를 전문으로 하여 덴마크가 힘을 투사하고 부상하는 위협에 신속히 대응할 수 있도록 보장합니다."
 DEN_Vehicle_question: "차량 문제"
 DEN_Vehicle_question_desc: "덴마크 정부는 현재의 장갑차량 능력과 미래 요구에 대한 종합적인 평가를 수행하기 위해 전문가를 소집하여 \\"차량 문제\\"를 다룹니다. 정부는 엄밀한 분석을 통해 장갑 차량 전반의 개선과 현대화 기회를 파악합니다."
 DEN_US_Made: "미국제 브래들리"
 DEN_US_Made_desc: "미국과의 오랜 동반자 관계를 활용하여 덴마크 정부는 기갑 보병 능력을 강화할 M2 브래들리 보병 전투차의 조달을 모색합니다. 미국 방위 계약업체와 브래들리 확보 계약이 협상되어 덴마크 육군의 전장 화력과 기동성을 높입니다."
 DEN_Marder: "독일제 마르더"
 DEN_Marder_desc: "독일과의 협력 관계를 바탕으로 덴마크 정부는 장갑 차량 함대를 보완하기 위한 마르더 보병 전투차의 확보를 검토합니다. 독일의 장갑차량 설계 및 생산 전문성을 활용하여 라인메탈과 마르더 플랫폼 조달 계약이 추진됩니다."
 DEN_CV: "스웨덴제 CV90"
 DEN_CV_desc: "덴마크 정부는 방위 제휴 네트워크를 확대하여 스웨덴제 CV90 보병 전투차의 도입 가능성을 평가합니다. BAE 시스템즈 헤글룬즈와의 협력으로 CV90 플랫폼 조달 협상이 진행되며, 덴마크 기갑 부대에 향상된 기동성과 화력 능력을 제공합니다."
 DEN_NEW_APC: "신형 APC"
 DEN_NEW_APC_desc: "덴마크 정부는 병력 수송 능력을 현대화하기 위해 신형 장갑 병력 수송차 확보 방안을 모색합니다. 덴마크 육군의 요구에 가장 적합한 APC를 가려내기 위해 파트리아 AMV, 복서, 푸마를 비롯한 다양한 플랫폼에 대한 평가가 진행됩니다."
 DEN_NEW_IFV: "신형 IFV"
 DEN_NEW_IFV_desc: "덴마크 정부는 보병 지원과 화력의 중요성을 인식하여 신세대 보병 전투차의 조달을 추진합니다. 선도적인 방위 제조업체와 첨단 무기 체계 및 방호 기능을 갖춘 IFV 플랫폼 확보 계약이 추진됩니다."
 DEN_Update_Leopard_Tank: "레오파르트 전차 개량"
 DEN_Update_Leopard_Tank_desc: "덴마크 정부는 유능한 주력 전차 함대를 유지하는 데 초점을 맞춰 레오파르트 2A5DK 주력 전차의 개량 사업을 개시합니다. 개량에는 화력, 장갑 방호, 디지털 체계의 향상이 포함되어 덴마크 기갑 부대의 지속적인 효율성을 보장합니다."
 DEN_US_Tanks: "M1A2 에이브럼스"
 DEN_US_Tanks_desc: "덴마크 정부는 나토 동맹국과의 상호 운용성 및 공통성 확보 기회를 모색하며 미국의 M1A2 에이브럼스 주력 전차 조달을 검토합니다. 제너럴 다이내믹스와 에이브럼스 전차 확보 협상이 추진되어 검증된 전투 성능으로 덴마크의 기갑 능력을 높입니다."
 DEN_German_tanks: "레오파르트 2A7"
 DEN_German_tanks_desc: "덴마크 정부는 현대적이고 유능한 기갑 함대를 유지하겠다는 의지의 일환으로 레오파르트 2 주력 전차의 최신형 확보 방안을 모색합니다. 첨단 기술과 전장 성능 개선을 반영한 레오파르트 2A7+ 전차 조달을 위해 크라우스마파이 방그만과 계약이 추진됩니다."
 DEN_Challenger: "챌린저 3"
 DEN_Challenger_desc: "덴마크 정부는 기갑 능력을 다양화하고 새로운 기술적 해법을 모색하기 위해 영국의 챌린저 3 주력 전차의 도입 가능성을 평가합니다. BAE 시스템즈와의 협력으로 챌린저 3 전차 조달 협상이 진행되며, 덴마크 기갑 부대에 강력하고 다용도인 플랫폼을 제공합니다."
 DEN_Tank_kommando: "전차 코만도"
 DEN_Tank_kommando_desc: "덴마크 정부는 현대전에서 특수 기갑 부대가 지니는 중요성을 인식하여 덴마크 육군 기갑 작전의 선봉 역할을 할 전차 코만도를 창설합니다. 고도로 훈련된 전차 승무원으로 구성되고 보병 및 정찰 요소의 지원을 받는 이 코만도는 공세 기동, 기갑전 전술, 제병 협동 작전을 전문으로 하여 덴마크가 전장에서 우위를 확립할 수 있도록 보장합니다."
 DEN_JFST: "JFST"
 DEN_JFST_desc: "덴마크 정부는 현대전에서 통합 화력 지원이 지니는 결정적 역할을 인식하여, 합동 작전 전반에서 포병, 항공 지원 및 기타 화력 능력을 조율하고 동기화할 합동 화력 지원팀(JFST)을 창설합니다. 여러 병과의 전문가들로 구성된 JFST는 지상군을 지원하는 정밀하고 결정적인 화력을 투사하는 덴마크 육군의 능력을 높입니다."
 DEN_Light_forces_focus: "경량 부대 중시"
 DEN_Light_forces_focus_desc: "덴마크 정부는 기민성과 신속한 전개를 강조하여 원정 작전과 특수 임무를 수행할 수 있는 경량 부대에 대한 투자를 우선시합니다. 경보병, 정찰, 특수 작전 부대의 훈련과 장비, 기동성을 높이는 데 자원이 배분되어 폭넓은 작전 환경에서의 효율성을 보장합니다."
 DEN_Medium_forces_focus: "중형 부대 중시"
 DEN_Medium_forces_focus_desc: "덴마크 정부는 기동성과 화력의 균형을 맞추어 지속적인 전투 작전을 수행하고 다목적 능력을 제공할 수 있는 중형 부대에 주목합니다. 차륜형 및 궤도형 차량을 갖춘 기갑 및 기계화 부대에 투자가 이루어져 이들이 다양한 상황에서 신속하게 전개하고 효과적으로 기동할 수 있게 합니다."
 DEN_Heavy_forces_focus: "중량 부대 중시"
 DEN_Heavy_forces_focus_desc: "덴마크 정부는 현대 전장에서 기갑 화력과 내구성이 지니는 중요성을 인식하여 향상된 능력과 현대화된 장비로 중량 부대를 보강합니다. 주력 전차, 장갑 전투 차량, 포병 체계의 개량에 중점을 두어 기갑전과 전력 투사 능력에서의 우위를 보장합니다."
 DEN_reformed_army: "개혁된 육군"
 DEN_reformed_army_desc: "덴마크 정부는 변화하는 위협과 작전 요구에 적응하기 위해 육군의 조직 구조와 교리를 전면 개혁합니다. 육군은 재편과 현대화, 훈련 이니셔티브를 통해 개혁되어 기민성과 상호 운용성, 미래의 도전에 대한 대비 태세를 높입니다."
 DEN_secret_service: "경찰정보국"
 DEN_secret_service_desc: "정부는 PET의 자원과 역량을 확충하여 국내 정보 기관이 덴마크 국경 내에서 감시와 정보 수집, 대테러 활동을 강화하도록 힘을 실어 줍니다. PET는 극단주의, 테러, 조직 범죄를 비롯한 국내 위협을 저지하는 데 집중하여 국가와 국민을 보호합니다."
 DEN_expand_forsvarets_efterretningstjeneste: "국방정보국 확대"
 DEN_expand_forsvarets_efterretningstjeneste_desc: "정부는 세계 무대에서 선제적 정보 수집의 절실함을 인식하여 국방정보국(FE)에 추가 자금과 인력을 배정합니다. 해외 정보 수집과 사이버 작전을 임무로 하는 FE는 활동 범위를 넓혀 부상하는 위협과 지정학적 동향, 사이버 적대 세력을 감시하며, 국제 무대에서 덴마크의 전략적 태세와 상황 인식을 강화합니다."
 DEN_Reform_Heeresflieger: "공군 개혁"
 DEN_Reform_Heeresflieger_desc: "덴마크 정부는 변화하는 위협 앞에서 기민성과 다용도성이 필요함을 인식하여 덴마크 공군인 플뤼베보네트를 전면 개혁합니다. 이 개혁은 조직 구조를 최적화하고 운영을 간소화하며 모든 공군 부대의 대비 태세를 높이는 것을 목표로 합니다."
 DEN_Apache: "미국제 아파치"
 DEN_Apache_desc: "덴마크 정부는 미국과의 동맹을 바탕으로 공군의 회전익 능력을 증강하기 위해 AH-64 아파치 공격 헬리콥터 확보를 모색합니다. 보잉과 아파치 헬리콥터 조달 계약이 추진되어 플뤼베보네트에 향상된 화력과 임무 다용도성을 제공합니다."
 DEN_the_Eurocopter: "유로콥터"
 DEN_the_Eurocopter_desc: "덴마크 정부는 헬리콥터 함대를 다변화하기 위해 수색 구조, 병력 수송, 해상 초계를 비롯한 다양한 임무를 위한 유로콥터 헬리콥터 확보를 검토합니다. 에어버스 헬리콥터스와 유로콥터 플랫폼 조달을 위한 협력 협정이 추진되어 플뤼베보네트의 공중 능력과 작전 유연성을 높입니다."
 DEN_Helicopter_training: "헬리콥터 훈련"
 DEN_Helicopter_training_desc: "덴마크 정부는 조종사 훈련과 숙련도의 중요성을 인식하여 플뤼베보네트 회전익 조종사의 대비 태세를 보장하기 위한 헬리콥터 훈련 프로그램에 투자합니다. 비행 작전, 전투 전술, 비상 절차에 대한 종합적인 훈련을 제공할 최첨단 훈련 시설과 시뮬레이터가 마련됩니다."
 DEN_Reform_equipment: "장비 개혁"
 DEN_Reform_equipment_desc: "플뤼베보네트의 현대화 목표에 발맞추어 덴마크 정부는 항공기, 항전 장비, 지원 체계를 포함한 공군 장비를 체계적으로 검토하고 개량합니다. 성능과 신뢰성, 임무 효율을 높이기 위해 함대 전반에 걸쳐 개량과 보강이 이루어집니다."
 DEN_Eurofighter: "유로파이터"
 DEN_Eurofighter_desc: "덴마크 정부는 첨단 전투기 확보 방안을 모색하며 플뤼베보네트의 제공권 능력을 강화하기 위해 유로파이터 타이푼의 도입 가능성을 평가합니다. 최첨단 기술과 전투 능력을 반영한 유로파이터 항공기 조달을 위해 유로파이터 GmbH와 협력 논의가 진행됩니다."
 DEN_Update_F16: "F-16 개량"
 DEN_Update_F16_desc: "덴마크 왕립 공군 전투기 전력의 주축인 F-16 파이팅 팰컨의 지속적인 운용과 효율성을 보장하기 위해, 덴마크 정부는 기존 F-16 기체에 대한 현대화 프로그램을 시작합니다. 이 개량 사업에는 항공전자장비 개선, 무기 체계 향상, 그리고 기체 수명 연장 및 전투 능력 확대를 위한 구조 보강이 포함됩니다."
 DEN_form_Kommando_Luftwaffe: "플뤼베보네트 코만도 창설"
 DEN_form_Kommando_Luftwaffe_desc: "덴마크 정부는 특수 항공 작전 능력의 필요성을 인식하여 전담 플뤼베보네트 코만도 부대를 창설합니다. 공수 작전, 근접 항공 지원, 특수 임무에 전문성을 갖춘 고도로 훈련된 인원으로 구성된 이 코만도는 분쟁 환경에서 복잡하고 위험도 높은 작전을 수행하는 플뤼베보네트의 능력을 높입니다."
 DEN_F35_Programme: "F-35 계획"
 DEN_F35_Programme_desc: "차세대 공군력 확보에 대한 의지를 확고히 하며, 덴마크 정부는 F-35 라이트닝 II 프로그램 참여를 지속합니다. 록히드 마틴과의 F-35A 라이트닝 II 도입 계약이 체결됨에 따라, 덴마크 왕립 공군은 미래 항공 작전을 수행하기 위한 독보적인 스텔스 성능과 기동성, 그리고 상호운용성을 갖추게 될 것입니다."
 DEN_Future_Combat_Air_System: "미래 전투 항공 체계"
 DEN_Future_Combat_Air_System_desc: "덴마크 정부는 미래의 도전과 기술 발전에 대비하여 미래 전투 항공 체계(FCAS)의 연구 개발 이니셔티브에 투자합니다. 유럽 동맹국과의 협력적 제휴는 차세대 공중전 능력 개발의 길을 열어 플뤼베보네트가 항공전 혁신의 최전선에 계속 서도록 보장합니다."
 DEN_Reformed_Airforce: "개혁된 플뤼베보네트"
 DEN_Reformed_Airforce_desc: "위에서 설명한 포괄적인 개혁 노력을 통해 플뤼베보네트는 첨단 항공기와 최첨단 기술, 고도로 숙련된 인원을 갖춘 개혁되고 현대화된 공군으로 거듭납니다. 개혁된 플뤼베보네트는 덴마크 영공을 방어하고 해외에 힘을 투사하며 국제 안보와 안정에 기여할 준비를 마쳤습니다."
 DEN_Reform_Fuhrungsstaab_der_Luftwaffe: "공군 사령부 개혁"
 DEN_Reform_Fuhrungsstaab_der_Luftwaffe_desc: "플뤼베보네트의 변혁과 함께 덴마크 정부는 공군 작전을 지휘하는 작전 본부인 공군 사령부를 개혁합니다. 지휘 구조를 최적화하고 조율을 강화하며 기술을 활용함으로써 공군 사령부는 플뤼베보네트의 항공 임무와 능력에 대한 효율적이고 효과적인 감독을 보장하도록 개혁됩니다."
 DEN_Biotech_Rising: "바이오 기술의 부상"
 DEN_Biotech_Rising_desc: "덴마크는 보건과 지속 가능성 분야의 혁신을 이끌며 생명공학 분야에서 선도하고자 합니다. 생명공학에 대한 투자는 우리의 과학적 역량을 높이고 첨단 일자리를 창출하여 이 혁명적 분야에서 덴마크의 입지를 굳힐 것입니다."
 DEN_construction_industrie: "건설 산업"
 DEN_construction_industrie_desc: "베스타스 윈드 시스템즈의 성공을 바탕으로 우리의 초점은 건설 부문 강화로 향합니다. 이 전략적 투자는 경제 성장을 이끌고 일자리를 창출하며 국가 기반시설을 튼튼히 하여 덴마크가 번영하는 미래를 맞이하도록 할 것입니다."
 DEN_ISS: "ISS"
 DEN_ISS_desc: "시설 관리 서비스 분야의 세계적 선도 기업인 ISS(인터내셔널 서비스 시스템)에 대한 투자는 우리의 사무 부문을 강화하고 경제 성장을 촉진할 것입니다."
 DEN_Expand_Carlsberg: "칼스버그 확장"
 DEN_Expand_Carlsberg_desc: "우리의 상징적인 양조장 칼스버그의 세계적 입지를 확대하기 위한 대담한 구상에 착수합니다. 투자와 제휴를 통해 우리는 국제 시장에서 칼스버그의 입지를 강화하고 수출을 늘리며 양조 기술에서 덴마크의 우수성을 널리 알리고자 합니다. 이 확장 구상은 양조장의 성장을 촉진할 뿐 아니라 일자리 창출과 경제적 번영에도 기여할 것입니다."
 DEN_Carlsberg_invest: "칼스버그 투자"
 DEN_Carlsberg_invest_desc: "칼스버그 양조장에 투자함으로써 우리는 재정적 이익을 확보하는 동시에 양조 산업을 강화하고 발전시킵니다."
 DEN_Expand_logistic_Companies: "물류 기업 확장"
 DEN_Expand_logistic_Companies_desc: "아시아에서 커지는 기회에 고무된 덴마크는 중국, 홍콩, 일본, 싱가포르 등 주요 시장에서 물류 기업을 확장하는 구상에 착수합니다. 우리는 목표를 정한 투자를 통해 물류 네트워크를 강화하고 이 전략적 거점에서의 입지를 다지고자 합니다."
 DEN_Expand_DSV: "DSV 확장"
 DEN_Expand_DSV_desc: "덴마크는 물류 산업의 핵심 기업인 DSV를 확장하기 위한 야심 찬 구상에 착수합니다. 우리는 전략적 투자를 통해 DSV의 세계적 입지와 역량을 높이고자 합니다. 이 확장 노력은 덴마크의 물류 부문을 강화할 뿐 아니라 국제 무역도 촉진합니다."
 DEN_Expand_DSV_logistics: "DSV 로지스틱스"
 DEN_Expand_DSV_logistics_desc: "덴마크는 목표를 정한 구상을 통해 전 세계 DSV 물류 운영의 최적화에 주력합니다. 이러한 접근은 물류 선도국으로서 덴마크의 위상을 강화하고 국제 무역과 연결성을 촉진합니다."
 DEN_Expand_DSV_Invests: "DSV 투자"
 DEN_Expand_DSV_Invests_desc: "덴마크는 물류 산업의 초석인 DSV에 전략적 투자를 집중하여 국가적 재정 이익을 확보할 뿐 아니라 물류 역량도 높입니다."
 DEN_Expand_DSV_logistics_II: "DSV 글로벌"
 DEN_Expand_DSV_logistics_II_desc: "덴마크는 전략적 구상과 제휴를 통해 DSV의 세계적 발자취를 강화하는 데 주력합니다. 우리는 DSV의 방대한 네트워크와 전문성을 활용하여 국제 무역로를 개선하고 공급망을 최적화하며 끊김 없는 세계 물류를 촉진하고자 합니다. 이 세계적 확장 노력은 세계 무대에서 덴마크의 경쟁력을 높이고 경제 성장과 번영을 촉진합니다."
 DEN_Logistic_Global_Investments: "글로벌 물류 확장"
 DEN_Logistic_Global_Investments_desc: "덴마크는 세계 물류 네트워크를 확장하는 전략 프로그램에 착수하여 무역과 연결성의 새로운 기회를 엽니다. 이를 통해 세계 항만과 운송 물류에 대한 투자가 가능해집니다. 세계 물류에 투자함으로써 우리는 장기적인 재정적 이익을 끌어내고 세계 경제에서 덴마크의 역할을 강화합니다."
 denmark_agrar_event.10.t: "환경 운동가 시위"
 denmark_agrar_event.10.d: "환경 운동가 시위는 다양한 환경 문제에 대한 인식을 높이고 행동을 촉구하기 위한 자발적인 시위입니다."
 denmark_agrar_event.10.a: "그들은 늘 그렇듯 불평만 하는군"
 denmark_agrar_event.11.t: "환경 운동가 시위"
 denmark_agrar_event.11.d: "시급한 기후 행동의 필요성에 대한 인식을 높이기 위한 평화롭고 영향력 있는 시위, 녹색 지구 집회에 함께해 주십시오. 가족 단위로 참여할 수 있는 이 행사는 모든 연령과 배경의 사람들이 한자리에 모여 지속 가능한 미래를 옹호하도록 초대합니다."
 denmark_agrar_event.11.a: "멍청이들인가?"
 denmark_agrar_event.12.t: "환경 운동가 시위"
 denmark_agrar_event.12.d: "기후 정의를 위한 긴급한 행동을 요구하는 역동적이고 영향력 있는 시위, 기후 정의 행진에 함께해 주십시오. 이 행사는 존중과 비폭력을 지키면서도 강력한 메시지를 전하도록 기획되었으며, 열정적인 이들이 우려를 표명하고 의미 있는 변화를 촉구할 장을 제공합니다."
 denmark_agrar_event.12.a: "문제가 생길 수도 있겠군"
 denmark_agrar_event.13.t: "환경 운동가 시위"
 denmark_agrar_event.13.d: "환경 파괴에 책임이 있는 이들에게 맞서 즉각적이고 근본적인 변화를 요구하도록 기획된 고강도 시위, 에코 봉기에 함께해 주십시오. 이 행사는 마음 약한 이들을 위한 것이 아닙니다. 지구를 위협하는 기업과 정책에 맞서 입장을 밝힐 준비가 된 이들을 향한 대담한 행동 촉구입니다."
 denmark_agrar_event.13.a: "그들의 말에 귀를 기울여야 할지도 모르겠군"
 denmark_agrar_event.14.t: "환경 운동가 시위"
 denmark_agrar_event.14.d: "환경 파괴에 책임이 있는 이들에게 맞서 즉각적이고 근본적인 행동을 요구하도록 기획된 격렬하고 긴박한 시위, 에코 봉기에 함께해 주십시오. 이 행사는 기후 변화와 환경 악화에 맞선 투쟁에서 대담한 조치를 취할 준비가 된 헌신적인 활동가들을 위한 것입니다."
 denmark_agrar_event.14.a: "엿이나 먹어라, 그레타"
 denmark_agrar_event.15.t: "농민 시위"
 denmark_agrar_event.15.d: "소규모 농민들이 지속 가능한 농업과 공정한 영농 관행을 옹호하기 위해 조직한 평화롭고 힘찬 시위, 농민의 목소리에 함께해 주십시오. 이 시위는 소규모 농민이 직면한 어려움을 부각하고 정책 입안자와 지역 사회의 지원을 요구하는 것을 목표로 합니다."
 denmark_agrar_event.15.a: "걱정할 일이 아니군"
 denmark_agrar_event.16.t: "농민 시위"
 denmark_agrar_event.16.d: "중소 규모 농민들이 공정한 정책과 지속 가능한 농업, 경제적 지원을 옹호하기 위해 조직한 평화롭고 단호한 시위, 농민 권리 집회에 함께해 주십시오. 이 행사는 농민이 직면한 시급한 문제에 대한 관심을 환기하고 농업 공동체를 뒷받침할 의미 있는 개혁을 촉구하는 것을 목표로 합니다."
 denmark_agrar_event.16.a: "우리의 정치를 돌아봐야 할지도 모르겠군"
 denmark_agrar_event.17.t: "농민 시위"
 denmark_agrar_event.17.d: "불공정한 정책과 지속 불가능한 관행, 정부의 지원 부족에 넌더리가 난 농민들이 조직한 격렬하고 대립적인 시위, 농민 봉기에 함께해 주십시오. 이 시위는 농업 공동체의 시급한 요구를 강력하게 부각하고 정책 입안자들에게 즉각적인 행동을 요구하는 것을 목표로 합니다."
 denmark_agrar_event.17.a: "심각한 문제로 이어질 수 있겠군"
 denmark_agrar_event.18.t: "농민 시위"
 denmark_agrar_event.18.d: "농민들이 거리를 행진하며 트랙터와 기타 농기계로 주요 도로와 교차로를 막고 교통을 마비시켜 자신들의 곤경에 대한 관심을 끌 것입니다. 연대와 좌절감을 드러내는 이 시위는 농업의 위기 상황을 보여 주는 것을 목표로 합니다."
 denmark_agrar_event.18.a: "빌어먹을 놈들"
 denmark_agrar_event.19.t: "농민 시위"
 denmark_agrar_event.19.d: "불공정한 정책과 지속 불가능한 관행, 정부의 지원 부족에 분노한 농민들이 조직한 극도로 격앙되고 대립적인 시위, 농민 봉기에 함께해 주십시오. 이 시위는 농업 공동체가 직면한 위기에 대처할 즉각적이고 의미 있는 조치를 강력하게 요구하는 마지막 항전입니다."
 denmark_agrar_event.19.a: "저런 얼간이들 같으니"
 denmark.46.t: "유로 국민투표"
 denmark.46.d: "유로를 도입하려면 국민투표를 실시하여 국민에게 투표할 기회를 주어야 합니다."
 denmark.46.a: "투표를 시작하자"
 denmark.47.t: "유로를 원하는 우리 국민"
 denmark.47.d: "결과는 국민 과반수가 유로존에 가입하고 유로 통화를 채택하기를 원한다는 것을 보여 줍니다."
 denmark.47.a: "좋은 소식이군, 브뤼셀에 연락하자"
 denmark.47.b: "안타깝게도 결과는 분쇄기 속으로 사라졌습니다"
 denmark.48.t: "유로를 원하지 않는 우리 국민"
 denmark.48.d: "결과는 국민 과반수가 자국 통화를 유지하기를 원한다는 것을 보여 줍니다."
 denmark.48.a: "ECB에 엿이나 먹이자"
 denmark.48.b: "유권자에게는 안타까운 일이지만, 우리는 유로를 도입할 것입니다."
 denmark.8.a: "진정한 사랑이 승리한다!"
 denmark.8.b: "스웨덴의 빅토리아 왕세녀"
 denmark.8.c: "노르웨이의 마르타 루이세 공주"
 denmark.300.t: "불의 연대기의 시작"
 denmark.300.d: "게임하는 모습을 촬영하여 MD 커뮤니티에서 유명해진 덴마크의 한 평범한 남자가 덴마크 오지에 농장을 사기로 결심합니다."
 denmark.300.a: "빨간 머리가 지주가 된다고? 이 나라는 끝났다!"
 denmark.300.b: "그 사람 온리팬스 해?"
 denmark.300.c: "덴마크 전체가 말 그대로 오지다."
 DEN_idea_feal_well: "진정한 복지국가"
 DEN_idea_feal_well_desc: "덴마크는 사회 복지 프로그램, 보건 의료 접근성, 교육을 우선시하여 모든 시민의 안녕을 보장하는 진정한 복지국가가 되겠다는 의지를 재확인합니다."
 DEN_idea_Unconditional_basic_income: "무조건적 기본소득"
 DEN_idea_Unconditional_basic_income_des: "덴마크는 모든 시민에게 무조건적 기본소득을 제공하여 수명과 복지를 향상시킵니다."
 DEN_euro_question_idea: "유로 문제"
 DEN_euro_question_idea_desc: "덴마크는 유로를 공식 통화로 채택하는 데 따른 잠재적 이점과 단점에 대한 논쟁과 토론을 벌이며 유로 문제와 씨름하고 있습니다."
 DEN_Idea_office_of_international_relations: "국제 관계실"
 DEN_Idea_office_of_international_relations_desc: "군주제의 관할 아래 있는 국제 관계실은 덴마크와 다른 국가 사이의 외교 연락 창구 역할을 하며 국제 협력과 우호를 증진합니다."
 DEN_Royal_nordic_institute: "왕립 북유럽 연구소"
 DEN_Royal_nordic_institute_desc: "왕립 북유럽 연구소의 설립은 북유럽 국가 간의 협력과 문화 교류를 촉진하고 상호 이해와 연대를 증진하겠다는 덴마크의 의지를 상징합니다."
 DEN_idea_new_Tradition: "신전통 군주제"
 DEN_idea_new_Tradition_desc: "덴마크는 군주제에 새로운 전통을 받아들여 현대적 가치와 역사적 관습을 융합함으로써 변화하는 사회 규범과 기대에 적응합니다."
 DEN_idea_new_way: "신방식 군주제"
 DEN_idea_new_way_desc: "군주제는 덴마크 국민과 소통하고 현대의 도전에 적응하는 새로운 방법을 모색하며, 사회에서의 역할과 의의를 재정립합니다."
 DEN_courtly: "궁정 예법"
 DEN_courtly_desc: "덴마크는 궁정 전통을 보존하여 국가의 풍부한 문화유산과 왕실 역사를 반영하는 예절, 의전, 의례 관행을 지켜 나갑니다."
 DEN_idea_new_dkr: "새 덴마크 크로네"
 DEN_idea_new_dkr_desc: "덴마크는 경제 안정과 경쟁력을 높이기 위한 통화 개혁의 일환으로 새 통화인 새 덴마크 크로네를 도입합니다."
 DEN_Idea_light_Force: "경량 부대 중시"
 DEN_Idea_light_Force_desc: "덴마크는 군사적 초점을 경량 부대로 전환하여 현대의 안보 도전에 대응하기 위한 기민성, 기동성, 신속 대응 능력을 강조합니다."
 DEN_Idea_medium_Force: "중형 부대 중시"
 DEN_Idea_medium_Force_desc: "덴마크는 균형 잡힌 군사력 구조를 유지하며, 유연하고 효과적으로 폭넓은 임무를 수행할 수 있는 중형 부대에 중점을 둡니다."
 DEN_Idea_heavy_Force: "중량 부대 중시"
 DEN_Idea_heavy_Force_desc: "덴마크는 장갑차량, 포병, 기계화 보병에 투자하여 화력과 전장 지배력을 높이는 등 중량 부대 능력을 강화합니다."
 DEN_Idea_VFK: "VFK"
 DEN_Idea_VFK_desc: "덴마크군(VFK)은 포괄적인 현대화 계획을 추진하여 첨단 기술, 강화된 훈련, 전략적 재편을 통해 역량을 강화하고 국가 안보를 수호하기 위한 대비 태세와 효율성을 보장했습니다."
 DEN_idea_Privatisation_Post: "포스트노르드"
 DEN_idea_Privatisation_Post_desc: "덴마크의 우편 서비스 제공업체인 포스트노르드는 디지털 시대의 변화하는 고객 요구에 부응하기 위해 운영을 현대화하고 서비스를 확대합니다."
 DEN_idea_den_education_reform1: "교육 개혁"
 DEN_idea_den_education_reform1_desc: "덴마크는 교육 체계의 질, 형평성, 혁신을 높이는 포괄적인 교육 개혁을 시행하여 학생들이 급변하는 세상에서 성공할 수 있도록 준비시킵니다."
 DEN_idea_den_education_reform4: "개혁된 교육"
 DEN_idea_den_education_reform4_desc: "덴마크는 야심 찬 교육 개혁 의제를 성공적으로 완수한 것을 기념하며, 이는 국민에게 고품질의 적응력 있는 교육을 제공하겠다는 국가의 의지가 이룬 이정표입니다. 개혁된 체계는 현대화된 교수·학습 방식을 반영하여 학생들이 급변하는 세계 환경에서 번영하는 데 필요한 기술과 지식을 갖추게 합니다."
 DEN_idea_World_forum: "세계 포럼"
 DEN_idea_World_forum_desc: "덴마크는 전 세계 노동조합과 노동자 단체 대표들이 모여 공통의 과제를 다루고, 모범 사례를 공유하며, 국제 연대 노력을 조율할 수 있는 세계 노동 포럼의 설립을 지지합니다."
 DEN_Labour_Union1: "재확인된 노동자 권리"
 DEN_Labour_Union1_desc: "우리는 노동자의 권리를 보호하고 공정한 대우를 보장하며 안전한 근로 조건을 증진하겠다는 의지를 재확인해야 합니다."
 DEN_Labour_Union2: "의무적 노동자 평의회"
 DEN_Labour_Union2_desc: "의무적 노동자 평의회법은 직장 내 민주주의를 강화하고 직원과 경영진 간의 소통을 개선하기 위해 모든 주요 기업에 노동자 평의회를 설치하도록 의무화합니다."
 DEN_Labour_Union3a: "정당 노동자 평의회"
 DEN_Labour_Union3a_desc: "정당 노동자 평의회는 정치 영역에서 노동자의 이익을 대변하여 노동 정책이 노동 인구의 필요와 열망에 부합하도록 보장하는 것을 목표로 합니다."
 DEN_Labour_Union3b: "노조 노동자 평의회"
 DEN_Labour_Union3b_desc: "노조 노동자 평의회는 노동조합이 직장 통치에 적극 참여하고, 더 나은 근로 조건을 옹호하며, 조합원을 대신해 협상할 수 있게 하여 더 공평한 노동 환경을 조성할 것입니다."
 DEN_marxist_reeducation_idea: "마르크스주의 재교육"
 DEN_marxist_reeducation_idea_desc: "마르크스주의 재교육은 사회적 가치와 경제 원칙을 재편하는 것을 목표로 하는 재교육 프로그램입니다. 이 구상은 집단 소유, 사회적 평등, 자본주의 구조의 해체를 포함한 마르크스 이론의 교의를 알리는 데 중점을 둡니다. 우리는 교육 개혁과 대중 캠페인을 통해 마르크스주의 이상에 대한 깊은 이해를 키우고 연대와 형평에 뿌리를 둔 사회를 가꾸고자 합니다."
 DEN_inspire_revolutions: "시위 수출"
 DEN_inspire_revolutions_desc: "시위 수출은 세계적인 변화 운동을 촉진하는 것을 목표로 하는 선견지명 있는 전략입니다. 덴마크는 외교 경로, 문화 교류, 직접적 지원을 통해 전 세계에 시위와 혁명의 정신을 불붙이고자 합니다."
 DEN_World_Workers_Paradise: "세계 노동자의 낙원"
 DEN_World_Workers_Paradise_desc: "세계 노동자의 낙원은 노동권이 보편적으로 존중받고 노동자가 공평한 대우와 번영을 누리는 세계를 그립니다. 이 야심 찬 노력은 전 세계 노동자 간의 연대를 촉진하고 공정한 임금, 안전한 근로 조건, 사회 정의를 옹호하고자 합니다."
 DEN_council_run_corporations_idea: "평의회 운영 기업"
 DEN_council_run_corporations_idea_desc: "평의회 운영 기업은 기업 지배구조를 혁신하는 것을 목표로 합니다. 이 구상에 따라 기업은 노동자, 주주, 지역 사회 대표로 구성된 민주적 평의회가 운영하게 됩니다."
 DEN_Political_Capital_Injection: "정치적 자본 투입"
 DEN_Political_Capital_Injection_desc: "정치적 자본 투입은 노동조합에 정치적 자본을 제공하여 정치 영역에서 더 큰 영향력과 접근성을 부여하겠다는 덴마크의 의지를 나타냅니다."
 DEN_Anarchism1: "덴마크 아나키즘"
 DEN_Anarchism1_desc: "덴마크 아나키즘은 자율, 자발적 결사, 분권적 의사결정의 원칙에 뿌리를 둔 대담한 사회 조직의 비전을 담고 있습니다. 이 이념은 국가를 포함한 위계적 구조의 폐지를 옹호하며, 그 대신 풀뿌리 민주주의와 직접 행동을 주장합니다. 덴마크 아나키즘은 개인과 공동체가 스스로를 자유롭게 다스리도록 힘을 실어 주고, 상호 부조와 연대, 집단적 책임에 기초한 사회를 육성하고자 합니다."
 DEN_idea_Visitdenmark: "비짓덴마크"
 DEN_idea_Visitdenmark_desc: "전략적인 마케팅 캠페인, 여행 업계 이해관계자와의 제휴, 혁신적인 홍보 활동을 통해 비짓덴마크는 전 세계의 방문객을 유치하고 경제 성장을 촉진하며 덴마크를 일류 관광지로서 알리는 것을 목표로 합니다."
 DEN_Maersk1: "묄러-머스크 그룹"
 DEN_Maersk1_desc: "1904년 A.P. 묄러와 선장 페터 머스크 묄러가 설립한 머스크는 세계 최대 규모의 해운 및 물류 기업 중 하나로 성장했습니다. 130개국 이상에 진출해 있고 700척이 넘는 선단을 보유한 머스크는 컨테이너 해운, 터미널 운영, 석유 및 가스 탐사, 물류 서비스 등 여러 부문에 걸쳐 사업을 펼치고 있습니다."
 DEN_decision_Investments_Global: "글로벌 항만에 투자"
 DEN_decision_Investments_Global_desc: "덴마크의 글로벌 물류망 확장 전략 계획의 일환으로 우리는 세계 각지의 항만에 투자하고 있습니다. 이 투자는 항만 기반시설을 강화하고 화물 처리 효율을 높이며 핵심적인 국제 협력 관계를 구축할 것입니다. 항만 역량을 강화함으로써 무역의 새로운 기회를 열고, 장기적인 재정 수익을 창출하며, 세계 경제에서 덴마크의 입지를 굳히고자 합니다."
 DEN_Maersk_Invest: "[FROM.GetName] 해군 기반시설에 투자"
 DEN_DSV_Invest: "[FROM.GetName]의 운송 물류에 투자"
 DEN_DSV_TT: "[FROM.GetName]이(가) 물류 투자를 받습니다"
 DEN_euro_question_decisions_category: "유로 문제"
 DEN_euro_referendum_decision: "유로 국민투표"
 DEN_euro_referendum_decision_desc: "유로 국민투표는 덴마크 경제 정책의 중대한 전환점으로, 국민이 유로 통화 도입에 대한 입장을 밝힐 기회를 제공합니다. 덴마크가 유로존 통합의 이점과 과제를 저울질하는 가운데, 이 국민투표는 민주적 의사결정에 대한 국가의 의지와 유럽 연합 내 덴마크의 위상을 보여 줍니다."
 DEN_Increase_Eurosceptism_decision: "독자 통화"
 DEN_Increase_Eurosceptism_decision_desc: "덴마크는 독자 통화에 대한 의지를 재확인하며 유로존과의 추가 통합을 거부합니다. 국가 주권과 경제적 독립을 강조하는 이 결정은 더 깊은 유럽 통합과 유로의 공식 통화 채택에 대한 덴마크의 회의적 태도를 드러냅니다."
 DEN_downcrease_Eurosceptism_decision: "유로 통합 구상"
 DEN_downcrease_Eurosceptism_decision_desc: "덴마크는 유로존과의 긴밀한 통합을 향해 적극적인 조치를 취하며 유로를 공식 통화로 채택할 의사를 내비칩니다. 공통 통화를 받아들임으로써 덴마크는 유럽 파트너와의 경제적 유대를 강화하고 시장 안정성을 높이며 유로존 내 무역과 투자를 촉진하고자 합니다."
 DEN_Bad_Bank_decision: "실용적 부채 감축 전략"
 DEN_Bad_Bank_decision_desc: "덴마크는 부채 감축에 실용적으로 접근하여, 국제 투자를 확대하는 동시에 국가 부채를 줄이기 위해 소규모 투자를 배정합니다. 재정 책임과 전략적 투자의 균형을 맞춤으로써 덴마크는 재정 안정성을 개선하고 경제 경쟁력을 높이며 지속 가능한 성장을 위한 외국 자본을 유치하고자 합니다."
 DEN_Bad_Bank_EZB_decision: "대담한 경기 부양 계획"
 DEN_Bad_Bank_EZB_decision_desc: "덴마크는 국가 부채를 줄이고 국제 투자를 늘리기 위해 상당한 자원을 투입하는 대담한 경기 부양 계획을 시행합니다. 전략 부문과 기반시설 사업에 자본을 투입함으로써 덴마크는 경제를 되살리고 일자리를 창출하며 외국인 투자자를 유치하여, 세계 시장에서 혁신과 성장의 역동적인 중심지로 자리매김하고자 합니다."
 DEN_visitdenmark_category: "비짓덴마크"
 DEN_visitdenmark_category_desc: "비짓덴마크의 설립은 덴마크 정부가 관광을 진흥하고 이 나라의 풍부한 문화유산, 자연의 아름다움, 활기찬 도시 생활을 세계에 알리기 위해 기울인 공동의 노력을 나타냅니다."
 DEN_euro_decision: "§H유로 문제§! 결정을 잠금 해제합니다"
 DEN_Euro_referendum_TT: "이제 유권자에게 달려 있습니다."
 DEN_Freetown_Christiana_tt: "§H셸란§!이 §H생산성 40§!을 받습니다"
 DEN_found_Alternatived_tt: "§Y알테르나티베트§!를 창당합니다"
 DEN_found_Nye_Borgerlige_tt: "§Y뉘에 보르게를리에§!를 창당합니다"
 DEN_found_New_Aliance_tt: "§Y신동맹§!을 창당합니다"
 DEN_Danish_Communist_Friends: "덴마크 공산주의 벗들"
 DEN_the_politics_of_denmark: "덴마크의 정치"
 DEN_the_socialist_agenda: "사회주의 의제"
 DEN_the_euro_question: "유로 문제"
 DEN_the_euro_question_desc: "덴마크는 유로를 도입할 것인가, 덴마크 크로네를 유지할 것인가라는 중대한 결정에 직면해 있습니다. 유로존에 가입하면 유럽과의 경제 통합을 강화할 수 있으나 덴마크의 통화 주권이 훼손될 수도 있습니다."
 DEN_accept: "국민투표로 유로존 가입 확정"
 DEN_question_nato: "나토에 대한 의문 제기"
 DEN_question_nato_desc: "덴마크는 기구의 전략 목표, 원칙, 제휴 관계를 고려하며 나토 동맹 내에서의 자국 역할을 비판적으로 평가합니다. 건설적 대화와 외교적 교섭을 통해 덴마크는 현대의 안보 위협과 도전에 대응하는 데 있어 나토의 실효성과 타당성을 확보하고자 합니다."
 DEN_reduce_commitment: "공약 축소"
 DEN_reduce_commitment_desc: "변화하는 안보 역학 속에서 덴마크는 군사적 공약의 범위와 규모를 평가하며 국익과 국제적 의무의 균형을 맞춥니다. 방위 태세와 군사 작전 참여를 재조정함으로써 덴마크는 국방 필요를 우선시하면서도 집단 안보 노력에 대한 기여를 최적화하고자 합니다."
 DEN_inform_partners: "파트너에게 통보"
 DEN_inform_partners_desc: "덴마크는 국제 파트너와 열린 투명한 소통을 유지하며 자국의 정책, 우선순위, 전략 목표를 계속 알립니다. 덴마크는 외교 경로와 다자간 포럼을 통해 공동의 과제와 기회에 대해 뜻을 같이하는 국가들과 협업하고 협력합니다."
 DEN_formalize_nordefco: "NORDEFCO 공식화"
 DEN_formalize_nordefco_desc: "덴마크는 북유럽 국가 간 지역 방위 협력 체계인 NORDEFCO의 공식화와 강화를 지지합니다. 군사적 상호 운용성, 합동 훈련, 능력 개발을 강화함으로써 NORDEFCO는 북유럽-발트 지역의 안정과 안보에 기여합니다."
 DEN_Idea_nordefco: "NORDEFCO"
 DEN_Idea_nordefco_desc: "노르딕 방위 협력 (NORDEFCO)은 방위 분야에서 노르딕 국가들 간의 협력체입니다. 이 협력체의 다섯 회원국은 덴마크, 핀란드, 아이슬란드, 노르웨이, 스웨덴입니다. 조직의 목표는 협력 분야를 식별하고 효과적인 해결책을 촉진함으로써 회원국들의 방위 능력을 강화하는 것입니다."
 DEN_defense_treatys: "방위 조약"
 DEN_defense_treatys_desc: "덴마크는 전략적 파트너와 방위 조약 및 협정을 체결하여 집단 안보와 상호 방위 의무에 대한 의지를 확인합니다. 양자 및 다자 협정을 통해 덴마크는 방위 능력과 협력을 강화하고 지역 및 세계의 안정에 기여합니다."
 DEN_defensive_preparations: "방어 준비"
 DEN_defensive_preparations_desc: "군대를 철저히 준비시킴으로써 덴마크는 언제든 자국 영토를 방어할 태세를 갖추고 우연에 맡기는 일이 없도록 할 것입니다."
 DEN_strengthen_nordefco: "NORDEFCO 강화"
 DEN_strengthen_nordefco_desc: "덴마크는 북유럽 국가 간 방위 협업과 조정의 핵심 플랫폼으로서 NORDEFCO를 강화하기 위해 노력합니다. 군사 통합과 공동 능력을 심화함으로써 NORDEFCO는 변화하는 안보 위협 앞에서 억지력, 위기 대응, 회복 탄력성을 높입니다."
 DEN_expand_nordefco: "NORDEFCO 확대"
 DEN_expand_nordefco_desc: "덴마크는 NORDEFCO 회원국을 북유럽 및 발트 국가로 추가 확대하여, 공통의 안보 과제에 대응하는 이 체계의 범위와 영향력을 넓힐 것을 지지합니다. 포용적이고 협력적인 방위 협력을 통해 NORDEFCO는 지역 방위 능력과 연대를 강화합니다."
 DEN_intensify_baltops_commitment: "BALTOPS 공약 강화"
 DEN_intensify_baltops_commitment_desc: "덴마크는 다국적 발트해 작전(BALTOPS)에 대한 참여를 확대하여 발트 안보에 대한 의지를 강화합니다. 해양 안보, 상호 운용성, 억지 조치를 강화함으로써 덴마크는 발트 동맹국들과의 연대를 재확인하고 발트해 지역의 안정에 기여합니다."
 DEN_adopt_the_nato_doctrine: "나토 교리 채택"
 DEN_adopt_the_nato_doctrine_desc: "덴마크는 집단 방위, 억지, 위기 관리를 강조하는 나토 교리에 맞추어 자국의 방위 정책과 전략을 조정합니다. 나토의 원칙과 지침을 준수함으로써 덴마크는 동맹 내 상호 운용성과 협력을 높이고 공동의 안보 과제에 효과적으로 대응할 수 있도록 보장합니다."
 DEN_distance_from_the_eu: "EU와의 거리 두기"
 DEN_distance_from_the_eu_desc: "덴마크는 유럽 연합과의 관계를 고려하여, 더 긴밀한 통합과 일정한 거리를 유지하는 것의 이점과 단점을 평가합니다. 덴마크는 민주적 토론과 공론을 통해 EU 내 자국의 입장을 모색하며, 국가 주권과 이익을 지키는 동시에 공통의 과제에 대한 협력을 증진합니다."
 DEN_leave_the_eu: "탈퇴 의사 전달"
 DEN_leave_the_eu_desc: "덴마크는 투명하고 민주적인 경로를 통해 EU 회원 자격에 관한 의사를 전달하여, 시민들이 의사결정 과정에 대해 알고 참여하도록 보장합니다. 탈퇴 시나리오를 논의하든 회원 자격 조건을 재협상하든, 덴마크는 EU와의 관계를 형성하는 데 민주적 가치와 원칙을 지킵니다."
 DEN_tollerate_the_eu: "EU 용인"
 DEN_tollerate_the_eu_desc: "덴마크는 유럽 통합의 이점과 국익 및 주권 문제의 균형을 맞추며 EU 회원 자격에 실용적으로 접근합니다. EU 기구 및 정책에 건설적으로 참여함으로써 덴마크는 유럽이라는 맥락 안에서 고유한 정체성과 가치를 지키면서 시민에게 돌아가는 혜택을 극대화하고자 합니다."
 DEN_tollerate_the_EZB: "ECB 용인"
 DEN_tollerate_the_EZB_desc: "덴마크는 통화 주권 유지와 협력의 균형을 맞추며 유럽 중앙은행에 실용적인 입장을 취합니다. ECB 정책에 선별적으로 관여함으로써 덴마크는 국가 경제 이익을 보호하면서 유럽의 금융 안정에서 혜택을 얻고자 합니다."
 DEN_create_task_force_north: "북부특무부대 창설"
 DEN_create_task_force_north_desc: "덴마크는 북극 지역의 안보 과제와 기회에 대응하기 위해 북부 기동부대를 창설합니다. 군사, 외교, 과학 분야의 노력을 조율함으로써 북부 기동부대는 북극에서의 상황 인식, 협력, 대비 태세를 높이고 덴마크의 이익을 보호하며 지역 안정을 증진합니다."
 DEN_commit_to_the_eu: "EU에 헌신"
 DEN_commit_to_the_eu_desc: "오직 단결해야만 우리는 유럽에서 다른 초강대국들에 맞설 수 있습니다."
 DEN_spreading_democracy: "민주주의 확산"
 DEN_spreading_democracy_desc: "덴마크는 외교적 교섭, 대외 원조, 시민 사회 구상 지원을 통해 민주적 가치와 제도를 적극적으로 증진합니다. 전 세계에서 인권, 선정, 민주적 개혁을 옹호함으로써 덴마크는 민주적 통치를 열망하는 지역의 평화, 안정, 번영을 증진합니다."
 DEN_reform_the_public_sector: "공공 부문 개혁"
 DEN_reform_the_public_sector_desc: "우리의 공공 부문은 복지 국가의 초석이지만 비효율과 비용 상승 같은 문제에 직면해 있습니다. 지속 가능하고 효과적인 공공 서비스를 보장하도록 재원을 조정할 때입니다."
 DEN_education_sector: "교육 부문"
 DEN_education_sector_desc: "덴마크는 모든 시민을 위한 양질의 교육에 투자하며 교육 부문을 국가 발전의 초석으로서 우선시합니다. 혁신, 포용, 평생 학습에 중점을 둔 덴마크의 교육 제도는 세계화된 세상에서 성공하는 데 필요한 비판적 사고, 창의성, 기술을 길러 줍니다."
 DEN_atheistic_schools: "무신론 학교"
 DEN_atheistic_schools_desc: "덴마크의 무신론 학교는 다양한 신념과 가치를 존중하는 세속 교육을 제공하며, 종교의 영향을 받지 않는 중립적인 학습 환경을 조성합니다. 과학, 이성, 인문주의적 가치를 강조하는 이 학교들은 학생들의 열린 마음, 관용, 지적 탐구를 증진합니다."
 DEN_finding_a_compromise: "복수 학교 제도"
 DEN_finding_a_compromise_desc: "덴마크의 복수 학교 제도는 다양한 교수법을 지닌 공립 및 사립 학교를 모두 포함하여 폭넓은 교육 철학을 수용합니다. 이 제도는 교육 선택, 부모의 자율, 학문의 자유에 대한 덴마크의 의지를 반영하며, 가정이 자신의 가치와 선호에 맞는 학교를 선택할 수 있게 합니다."
 DEN_religious_schools: "종교 학교"
 DEN_religious_schools_desc: "덴마크의 종교 학교는 특정 신앙 전통에 바탕을 둔 교육을 제공하며, 학문적 교육과 함께 영적·도덕적 지도를 제공합니다. 종교적 다양성과 양심의 자유를 존중하면서, 이 학교들은 문화유산과 가치, 전통을 미래 세대에 전하는 역할을 합니다."
 DEN_health_sector: "보건 부문"
 DEN_health_sector_desc: "덴마크의 보건 부문은 시민의 복리를 우선시하며 모두가 이용할 수 있는 포괄적인 의료 서비스를 제공합니다. 예방 진료, 환자 중심 서비스, 근거 기반 의학에 중점을 둔 덴마크의 보건 제도는 개인과 지역 사회를 위한 형평성, 효율성, 높은 수준의 의료 성과를 증진합니다."
 DEN_electronic_health_records: "순뎃스카르테트"
 DEN_electronic_health_records_desc: "덴마크의 순뎃스카르테트 제도는 국민 건강보험 카드를 통해 의료 서비스에 대한 보편적 접근을 보장합니다. 이 전자 카드를 통해 시민들은 진료, 처방, 치료를 원활하게 받을 수 있으며, 전국에 걸쳐 효율적이고 공평한 의료 서비스 제공을 가능하게 합니다."
 DEN_privatize_healthcare: "의료 민영화"
 DEN_privatize_healthcare_desc: "덴마크는 효율성과 혁신을 높이기 위해 시장 기반 메커니즘과 경쟁을 도입하여, 의료 제도의 일부 측면을 민영화하는 방안을 검토합니다. 민간 부문의 전문성과 자원을 활용함으로써 덴마크는 보편적 접근과 품질 기준을 유지하면서 의료 서비스 제공을 개선하고자 합니다."
 DEN_american_style_healthcare: "미국식 의료"
 DEN_american_style_healthcare_desc: "덴마크는 민간 보험 선택지, 소비자 선택, 시장 역학을 의료 제도에 접목하여 미국식 의료 모델의 요소를 모색합니다. 보편적 보장과 공공 재정이라는 핵심 원칙을 유지하면서, 덴마크는 의료 접근성, 감당 가능성, 성과를 최적화하는 개혁을 도입하고자 합니다."
 DEN_public_healthcare_funding: "공공 의료 재정"
 DEN_public_healthcare_funding_desc: "덴마크는 필수 의료 서비스를 세금과 정부 보조금으로 충당하도록 보장하며, 의료의 공공 재정에 대한 의지를 재확인합니다. 자원을 모으고 재정적 위험을 전 국민에게 분산함으로써 덴마크의 공공 재정 모델은 의료 제공에서의 연대, 형평성, 지속 가능성을 증진합니다."
 DEN_healthcare_for_all: "모두를 위한 의료"
 DEN_healthcare_for_all_desc: "덴마크는 사회경제적 지위나 건강 상태와 관계없이 필수 의료 서비스에 대한 보편적 접근을 보장하며 모두를 위한 의료 원칙을 견지합니다. 포괄적 보장, 예방 프로그램, 지역 사회 기반 진료를 통해 덴마크는 모든 시민을 위한 건강 형평성과 사회 정의를 증진하고자 노력합니다."
 DEN_Culture_modifier: "덴마크 문화"
 DEN_Industrial_modifier: "덴마크 산업"
 DEN_the_State: "덴마크 왕국"
 DEN_DISA_materiel_manufacturer: "DISA"
 DEN_Composhield_utility_vehicle_manufacturer: "콤포실드"
 DEN_Odense_Staalskibsvaerft: "오덴세 스탈스키브스베르프트"
 DEN_Svendborg_skibsvaerft: "스벤보르 스키브스베르프트"
 DEN_Terma_AS_aircraft_manufacturer: "테르마 AS"
 DEN_idea_Welfare_State: "복지 국가"
 DEN_idea_Welfare_State_desc: "복지 국가는 덴마크 사회의 중요한 부분으로, 사회 대다수를 중산층으로 유지하도록 설계되었습니다."
 DEN_idea_Welfare_State1: "덴마크 최소 국가"
 DEN_idea_Welfare_State1_desc: "덴마크의 최소 국가 모델은 대중의 지지를 유지하면서 비용을 최대한 줄이고자 하는 독특한 모델입니다."
 DEN_idea_Welfare_State2: "개혁된 복지 국가"
 DEN_idea_Welfare_State2_desc: "복지 국가는 덴마크 사회의 중요한 부분으로, 사회 대다수를 중산층으로 유지하도록 설계되었습니다. 그러나 지속적인 실효성과 지속 가능성을 보장하려면 개혁이 필요했습니다."
 DEN_Agriculture_subvention_TT: "농업 부문을 지원함으로써 우리는 국가의 안정도와 독립성을 높입니다."
 DEN_agricultural_income: "§Y농업§!으로부터의 실제 수입 $[?agriculture_tax_gain|+3]"
 DEN_wine_grow_tt: "덴마크의 포도 재배는 유럽의 전통적인 와인 생산지에 비해 비교적 최근의 현상입니다. 역사적으로 덴마크의 서늘한 기후는 포도 재배에 큰 어려움을 주었습니다. 그러나 기후 변화, 기술 발전, 내한성 포도 품종의 도입으로 덴마크의 와인 생산은 점점 실현 가능해지고 인기를 얻고 있습니다. 그렇다면 이 사업을 지원하지 않을 이유가 있겠습니까?"
 DEN_wine_grow_tt_II: "농업 보조금은 농민을 지원하고 식량 공급을 안정시키며 지속 가능한 관행을 촉진하는 중요한 수단입니다. 그리고 어쩌면 결국 약간의 이익도 얻을 수 있을 것입니다."
 DEN_decision_Agriculture: "농업 보조금"
 DEN_decision_Agriculture_desc: "농업 보조금은 농민과 농업 기업을 지원하기 위해 정부가 제공하는 재정 지원입니다. 이 보조금은 식품 가격을 안정시키고 안정적인 식량 공급을 보장하며 농업 생산성을 높이고 농민의 소득을 보호하는 것을 목표로 합니다.\n\n§Y농민의 분노§!: [?ROOT.DEN_farmer_anger]%\n§Y환경 운동가의 분노§!: [?ROOT.DEN_environmentalist_anger]%"
 DEN_Subventions_for_Grain_decision: "곡물 보조금"
 DEN_Subventions_for_Pigs_decision: "가축 보조금"
 DEN_Subventions_for_Beef_decision: "수산 양식 보조금"
 DEN_Subventions_for_Fishing_decision: "어업 보조금"
 DEN_Request_Whine_grow_by_EU_decision: "우리 와인 직접 재배"
 DEN_Subventions_modernization_decision: "더 친환경적인 장비를 위한 현대화 노력에 보조금 지급"
 DEN_idea_Agriculture: "현대 농업"
 DEN_idea_Agriculture_desc: "현대 농업은 생산성, 효율성, 환경 관리를 높이기 위해 첨단 기술, 지속 가능한 관행, 혁신적 방법을 통합한 것이 특징입니다. 이 접근 방식은 생태 발자국을 최소화하면서 증가하는 세계 인구의 식량 수요를 충족하는 것을 목표로 합니다."
 DEN_idea_Agriculture_II: "농업 보조금"
 DEN_idea_Agriculture_II_desc: "농업 보조금은 식품 가격을 안정시키고 안정적인 식량 공급을 보장하며 농민의 소득을 지원하기 위해 정부가 농업 부문에 제공하는 재정 지원 수단입니다. 이러한 보조금은 다양한 형태를 취할 수 있으며 경제적 목표와 사회적 목표를 모두 다루는 여러 목적에 쓰입니다."
 DEN_wineland: "덴마크산 와인"
 DEN_wineland_desc: "덴마크의 와인 생산은 혁신과 변화하는 기후 조건에 대한 적응을 특징으로 하는 역동적이고 성장하는 산업입니다. 품질과 지속 가능성에 중점을 두어, 덴마크 와인은 세계 와인 시장에서 틈새를 개척하고 있습니다."
 DEN_Agriculture: "현대 농업"
 DEN_Agriculture_desc: "현대 농업은 생산성, 효율성, 환경 관리를 높이기 위해 첨단 기술, 지속 가능한 관행, 혁신적 방법을 통합한 것이 특징입니다. 이 접근 방식은 생태 발자국을 최소화하면서 증가하는 세계 인구의 식량 수요를 충족하는 것을 목표로 합니다."
 DEN_modify_Farmer_anger_tt: "§Y농민의 분노§!가 [?modify_farmer_anger|+0]만큼 변화합니다 (현재: [?DEN.DEN_farmer_anger|Y0])\n"
 DEN_modify_Envirementalist_anger_tt: "§Y환경 운동가의 분노§!가 [?modify_environmentalist_anger|-0]만큼 변화합니다 (현재: [?DEN.DEN_environmentalist_anger|Y0])\n"
 DEN_a_green_initiative: "환경 친화적 대체"
 DEN_a_green_initiative_desc: "환경 친화적 대체는 지속 가능성을 달성하고 환경 악화를 완화하기 위한 보다 폭넓은 전략의 일부입니다. 더 친환경적인 대안을 찾아 채택하려면 개인, 기업, 정부의 혁신, 인식, 헌신이 필요합니다."
 DEN_Envirement_subvention_TT: "환경 친화적 대체는 지속 가능성을 달성하고 환경 악화를 완화하기 위한 보다 폭넓은 전략의 일부입니다. 더 친환경적인 대안을 찾아 채택하려면 개인, 기업, 정부의 혁신, 인식, 헌신이 필요합니다."
 DEN_Reforestation_decision: "조림 보조금"
 DEN_wildlife_conservation_decision: "야생동물 보호 보조금"
 DEN_water_conservation_decision: "수자원 보전 보조금"
 DEN_marine_conservation_decision: "해양 보전 보조금"
 DEN_Protest: "민중의 시위"
 DEN_Government_app: "Borger.dk"
 DEN_Government_app_desc: "덴마크는 시민이 모바일 기기에서 정부 서비스와 정보, 자료에 편리하게 접근할 수 있도록 정부 앱을 출시합니다. 사용자 친화적인 인터페이스와 맞춤형 알림, 통합 기능을 제공함으로써 이 앱은 시민 참여를 높이고 거래를 간소화하며 정부와 소통하는 전반적인 사용자 경험을 개선하는 것을 목표로 합니다."
 DEN_TV_campaign: "TV 캠페인 개시"
 DEN_Print_campaign: "인쇄 매체 캠페인 개시"
 DEN_socialmedia_campaign: "소셜 미디어 캠페인 개시"
 DEN_controversal_campaign: "논란성 캠페인 개시"
 DEN_controversal_campaign_tt: "논란성 캠페인은 큰 성공을 거둘 수도 있지만 완전히 실패할 수도 있습니다. 하지만 위험을 감수하지 않으면 재미도 없는 법입니다"
 DEN_socialmedia_campaign_tt: "소셜 미디어 캠페인은 많은 사람에게 닿으므로 위험이 낮고 성공 가능성이 매우 높습니다"
 DEN_Print_campaign_tt: "인쇄 매체 캠페인이 시작됩니다. 위험은 낮지만 보상 또한 작습니다"
 DEN_TV_campaign_tt: "TV 캠페인은 많은 사람에게 닿을 수 있지만 이제는 특별할 것이 없습니다"
 DEN_leave_eu_tt: "민족주의 인기도가 25 %를 넘으면 '탈퇴'의 가능성이 높아집니다."
 DEN_access_fra_satelite_tt: "덴마크가 프랑스 통신 위성 체계를 이용할 수 있게 됩니다"
 DEN_access_uk_satelite_tt: "덴마크가 영국 통신 위성 체계를 이용할 수 있게 됩니다"
 DEN_access_us_satelite_tt: "덴마크가 미국 통신 위성 체계를 이용할 수 있게 됩니다"
 DEN_access_sov_satelite_tt: "덴마크가 러시아 통신 위성 체계를 이용할 수 있게 됩니다"
 DEN_investment_decision_tt: "투자 결정을 개방합니다"
 DEN_Baltic_Garrison: "발트해 수비대"
 DEN_Baltic_Garrison_desc: "발트해 지역에서의 입지를 강화함으로써, 덴마크는 핵심 무역로를 보호하고 잠재적 적대 세력에 대비하며 발트 국가들과의 역사적, 문화적 유대를 내세우고자 합니다."
 DEN_decision_danish_revolutionary_thought: "공산주의의 확산"
 DEN_decision_danish_revolutionary_thought_desc: "마침내 인민이 덴마크 국가의 권력을 쥐었습니다. 이제 우리의 사상을 스칸디나비아 나머지 지역으로 퍼뜨릴 때입니다. 그들도 인민의 통치를 받아들여야 합니다."
 DEN_path_of_true_equality_desc: "부자이든 가난하든, 흑인이든 백인이든, 남자이든 여자이든 우리나라의 모든 사람은 다른 모든 이와 동일한 권리를 가집니다."
 denmark.1.t: "2000년 유로비전 송 콘테스트"
 denmark.1.d: "제45회 유로비전이 최근 스웨덴의 글로브 아레나에서 열렸습니다. [DEN.GetAdjective] 록/팝 듀오 올센 브라더스가 노래 '사랑의 날개를 타고 날아라'로 우승하여, 2위를 차지한 러시아를 40점 차로 앞섰습니다. [DEN.GetName](이)가 이 대회에서 우승한 것은 1963년 이후 처음으로, 온 나라가 전국적인 축제 분위기에 휩싸였습니다."
 develop_infrastructure_kitaa: "키타 인프라 개발"
 develop_infrastructure_tunu: "투누 인프라 개발"
 denmark_agrar_event.10.other_t: "환경 운동가 시위"
 denmark_agrar_event.10.other_d: "환경 단체들이 전국에서 계속 시위를 조직하고 있으나, 이번에는 늘 보던 사람들 외에는 거의 관심을 끌지 못하고 있습니다."
 denmark_agrar_event.15.other_t: "농민 시위"
 denmark_agrar_event.15.other_d: "농민들이 전국에서 계속 시위를 조직하고 있으나, 이번에는 늘 보던 사람들 외에는 거의 관심을 끌지 못하고 있습니다."
 DEN_Maersk_TT: "[FROM.GetName]이(가) 항만 시설 투자를 받습니다"
 DEN_INVEST_TRADE_LINK_TT: "[FROM.GetName]이(가) 덴마크와 무역 협정 또는 상호 투자 조약을 맺고 있습니다"
 DEN_right_wing_in_power: "§Y[conservatism_L]§! 또는 §Y[Nat_Populism_L]§!이(가) 집권 중입니다."
 DEN_DSV: "DSV A/S"
 DEN_DSV_desc: "DSV(De Sammensluttede Vognmænd af 13-7 1976) A/S는 항공, 해운, 육상 화물 운송, 계약 물류 전반에서 사업을 하는 덴마크의 글로벌 운송 및 물류 대기업입니다. 자산 경량화 모델을 활용하여 파날피나, 어질리티 GIL, DB 솅커 등의 대형 인수를 통해 세계 최대 규모의 공급망 서비스 제공업체 중 하나로 성장했습니다."
 DEN_Carlsberg: "칼스버그 그룹"
 DEN_Carlsberg_desc: "칼스버그 그룹은 1847년에 설립되어 코펜하겐에 본사를 둔 덴마크의 대형 다국적 양조 기업입니다. 세계 최대 규모의 양조 그룹 중 하나로서 유럽과 아시아 전역에서 폭넓게 사업을 펼치고 있습니다. 글로벌 포트폴리오에는 칼스버그, 투보르그, 크로넨부르 1664, 그림베르헨, 소머스비 사이다 등의 대표 브랜드를 필두로 140개가 넘는 음료 브랜드가 포함됩니다."
 denmark.310.t: "효소 이후"
 denmark.310.d: "노보 노르디스크는 노보자임스를 분사시켰으며, 이제 제약 회사가 되든가 아니면 아무것도 아니든가 하는 처지입니다. 테이블 위의 승부수는 인슐린 유사체입니다. 회사가 이미 수익성 있게 판매하고 있는 인간 인슐린보다 더 빠르게 작용하거나 더 오래 지속되도록 설계된 분자로, 개발에는 훨씬 더 많은 비용이 듭니다. 모든 경쟁사가 같은 도박을 하고 있으며, 환자들도 같은 환자들입니다."
 denmark.310.a: "유사체 포트폴리오에 전념한다"
 denmark.310.b: "이미 가지고 있는 인간 인슐린 사업을 지킨다"
 denmark.311.t: "다른 용도의 약"
 denmark.311.d: "리라글루티드가 빅토자라는 이름으로 유럽 승인을 통과했습니다. 이 약은 환자의 체중도 감소시키는 당뇨병 치료제입니다. 노보 노르디스크는 이를 관리해야 할 부작용으로 취급할 수도 있고, 어떤 제약 회사도 치료로 돈을 번 적 없는 질환에서의 두 번째 사업의 시작으로 볼 수도 있습니다. 비만 시장은 도전한 모든 이를 파묻어 왔습니다."
 denmark.311.a: "GLP-1을 독자적인 프로그램으로 지원한다"
 denmark.311.b: "포트폴리오를 당뇨병에 집중한다"
 denmark.312.t: "인슐린의 가격"
 denmark.312.d: "미국의 인슐린 정가는 10년 사이 대략 세 배로 뛰었으며, 청문회에서 노보 노르디스크는 일라이 릴리, 사노피와 함께 거론됩니다. 그 가격을 만들어 낸 리베이트 사다리가 미국 사업을 먹여 살립니다. 인상을 제한하면 이 정도의 이윤을 보장하는 유일한 시장에서 실제 매출을 잃게 되고, 사다리를 옹호하려면 상원 위원회 앞에서 이를 변호해야 합니다."
 denmark.312.a: "인상을 제한하고 매출 타격을 감수한다"
 denmark.312.b: "미국 사업의 자금줄인 리베이트 제도를 옹호한다"
 denmark.313.t: "세마글루티드 승인"
 denmark.313.d: "오젬픽이 FDA 승인을 받았으며, 임상시험의 체중 감량 데이터는 노보 노르디스크가 이제껏 본 어떤 것보다 강력합니다. 비만 적응증을 쫓으려면 보험사가 현재 인정하는 방식으로는 아프지 않은 수백만 명을 대상으로 한 임상시험이 필요합니다. 당뇨병에 머무른다면 이 약의 가치를 다른 누군가가 알아내도록 내버려 두는 셈입니다."
 denmark.313.a: "비만 적응증을 쫓는다"
 denmark.313.b: "세마글루티드를 당뇨병 치료제로 유지한다"
 denmark.314.t: "아무도 채울 수 없는 펜"
 denmark.314.d: "위고비와 오젬픽의 수요는 노보 노르디스크가 포장할 수 있는 수준을 훌쩍 넘어섰으며, 병목은 분자가 아니라 이를 주사 펜에 담는 무균 충전·마감 라인입니다. 노보 홀딩스는 카탈렌트를 인수하여 그 공장 세 곳을 노보 노르디스크에 넘길 수 있습니다. 이는 덴마크 기업 역사상 최대 규모의 거래이며, 회사가 달리 짓는다면 10년이 걸릴 생산 능력을 확보하는 일입니다."
 denmark.314.a: "생산 능력을 통째로 매입한다"
 denmark.314.b: "충전을 외주로 돌리고 자산 경량 구조를 유지한다"
 denmark.315.t: "노보 노르디스크가 된 모습"
 denmark.315.d: "사반세기에 걸친 유사체, 알고 보니 다른 질환을 치료하게 된 당뇨병 약, 워싱턴에서의 가격 공방, 덴마크가 이제껏 조달한 최대 규모의 인수가 노보 노르디스크가 무엇인지, 그리고 한 기업이 한 나라의 경제에서 합리적으로 얼마만큼을 차지할 수 있는지를 정리했습니다."
 denmark.315.a: "자체 공장을 소유한 제약 강자"
 denmark.315.b: "타사가 대신 제조해 주는 프리미엄 원개발사"
 denmark.315.c: "가격으로 경쟁하는 대량 제조사"
 denmark.315.e: "발견한 것을 외부에 라이선스하는 혁신가"
 DEN_novo_pharmaceutical_powerhouse: "제약 강자"
 DEN_novo_pharmaceutical_powerhouse_desc: "노보 노르디스크는 분자를 발견하고, 가격을 쥐고, 이를 충전하는 무균 라인을 소유합니다. 덴마크의 조건에 따른 생산 능력이란 공급의 제약이 하청업체가 아닌 덴마크의 결정에 달려 있다는 뜻입니다."
 DEN_novo_premium_originator: "프리미엄 원개발사"
 DEN_novo_premium_originator_desc: "노보 노르디스크는 가격과 특허를 쥐고 충전 라인은 다른 이들에게 맡깁니다. 이윤은 훌륭하지만 공급은 남의 손에 달려 있습니다."
 DEN_novo_volume_manufacturer: "대량 제조사"
 DEN_novo_volume_manufacturer_desc: "노보 노르디스크는 가격에서 양보하고 대신 생산 능력을 사들여 물량으로 경쟁했습니다. 더 많은 환자가 치료받지만 환자 한 명의 가치는 줄었습니다."
 DEN_novo_licensed_innovator: "라이선스 혁신가"
 DEN_novo_licensed_innovator_desc: "노보 노르디스크는 여전히 화합물을 발견하지만 점차 다른 이들이 가격을 정하고 생산하도록 내줍니다. 과학은 여전히 덴마크의 것이지만, 그 위에 세워진 사업은 그렇지 않습니다."
 denmark.49.t: "사회민주주의자당이 된 사회민주당"
 denmark.49.desc: "올보르에서 열린 사회민주당 전당대회가 사회민주주의자당(Socialdemokraterne)을 당의 공식 명칭으로 채택했습니다. 당은 강령과 덴마크 중도좌파의 주도 세력으로서의 입지를 유지합니다."
 denmark.49.a: "오랜 운동의 새 이름"
 denmark.50.t: "중도민주당 해산"
 denmark.50.desc: "중도민주당이 전당대회에서 당을 해산하기로 의결했습니다. 남은 당원들은 덴마크 중도 성향의 다른 정당으로 흩어집니다."
 denmark.50.a: "중도가 목소리를 잃는다"
 denmark.51.t: "사회민주주의자당, 사회민주당으로 복귀"
 denmark.51.desc: "올보르에서 전당대회를 연 사회민주당 지도부가 사회민주주의자당(Socialdemokraterne)이라는 이름을 버리고 사회민주당(Socialdemokratiet)으로 돌아갔습니다. 지도부는 옛 이름이 당의 역사에 다시 초점을 맞추게 한다고 밝혔습니다."
 denmark.51.a: "우리의 뿌리로 돌아가자"
 denmark.52.t: "엄격한 노선당 출범"
 denmark.52.desc: "변호사 라스무스 팔루단이 이슬람 금지를 주장하는 극우 정당 엄격한 노선당(Stram Kurs)을 출범시켰습니다. 신당은 과거 진보당이 차지했던 덴마크 정치의 극단 영역을 넘겨받습니다."
 denmark.52.a: "극우가 새로운 목소리를 얻다"
