 ALLOW_ALL_PARTIES_TT: "§H Odrzucić system jednopartyjny §!"
 ALLOW_ALL_PARTIES_TT_DELAYED: "Czas znieść całkowity zakaz działalności innych partii.\n\n§YWarunek wstępny:§!\n[!allow_all_parties_button_click_enabled]\n§YEfekty:§!\n[!allow_all_parties_button_click]"
 BAN_ALL_PARTIES_TT: "§H Ogłosić państwo jednopartyjne §!"
 BAN_ALL_PARTIES_TT_DELAYED: "Jako jedyna partia rządząca sprawująca władzę możemy ustanowić prawo uznające wszystkie pozostałe partie polityczne za nielegalne.\n\nNiech żyje partia!\n\n§YWarunek wstępny:§!\n[!ban_all_parties_button_click_enabled]\n§YEfekty:§!\n[!ban_all_parties_button_click]"
 set_partyall_banned_tt: "Zakazuje działalności wszystkich partii z wyjątkiem §Y[show_ruling_party]§!\n"
 set_partyall_allowed_tt: "Znosi zakaz działalności wszystkich Partii w naszym kraju\n"
 boost_party_TT: "§HZwiększyć [party_name_by_index] (§Y[?party_pop_array^v|%1]§!)§!\nAby osłabić siłę naszych rzeczywistych przeciwników politycznych, możemy wykorzystać naszą machinę polityczną do zwiększenia popularności innych partii\n\n§YWarunek wstępny: §!\n[!boost_button_click_enabled]\n§YEfekty: §!\n[!boost_button_click]"
 attack_party_TT: "§HAtakuj [party_name_by_index] (§Y[?party_pop_array^v|%1]§!)§!\nMożemy wykorzystać kampanie dezinformacyjne i haki, które zebraliśmy na temat głównych partii poza rządem, aby mocno uderzyć w ich popularność – upewniając się, że nie będą w stanie podważyć naszej pozycji u władzy. Ponieważ jakakolwiek uwaga przyniesie popularność mniejszym partiom, zadziała to tylko w przypadku głównych partii, które przekroczyły próg wyborczy [?election_threshold|%0]\n\n§YWyarunek wstępny: §!\n[!attack_button_click_enabled]\n§YEfekty: §!\n[!attack_button_click]"
 ban_party_TT: "§HZdelegalizować[party_name_by_index] (§Y[?party_pop_array^v|%1]§!) §!\nDelegalizacja partii politycznej lub ruchu gwarantuje, że nigdy nie zdobędą one władzy w drodze wyborów, a także ułatwia prześladowanie ich członków.\n\n§YWymagania wstępne: §!\n[!ban_button_click_enabled]\n§YEfekty: §!\n[!ban_button_click]"
 allow_party_TT: "§HZalegalizować[party_name_by_index](§Y[?party_pop_array^v|%1]§!)§!\nNadszedł czas, abyśmy znieśli zakaz i pozwolili ich członkom ubiegać się o urzędy publiczne oraz legalnie się organizować.\n\n§YWymagania wstępne: §!\n[!allow_button_click_enabled]\n§YEfekty: §!\n[!allow_button_click]"
