 UN.413.t: "Resolución: Educación"
 UN.413.d: "La §YAsamblea General§! de las §BNaciones Unidas§! ha aprobado una resolución no vinculante sobre el §YEducación§!. Aunque no votamos a favor de esta resolución, aún podemos aceptarla e implementarla.\n\n¿Deberíamos aceptar esta resolución?"
