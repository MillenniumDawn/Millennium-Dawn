 KOS_infantry_weapons_6_desc: "Heckler & Koch HK416 — штурмовая винтовка с газоотводной автоматикой под патрон 5,56x45 мм НАТО. Она разработана и производится немецкой компанией Heckler & Koch. Хотя конструкция основана на оружии класса AR-15, в ней используется фирменная газопоршневая система с коротким ходом поршня от более раннего семейства винтовок G36 компании Heckler & Koch. HK416 также оснащается фирменным цевьём с направляющими со всех четырёх сторон для установки различных аксессуаров."
 DRC_infantry_weapons_1_desc: "АКМ, разработанный в 1959 году, является наиболее распространенным модернизированным вариантом автомата АК-47, разработанного Михаилом Калашниковым. Он значительно легче и точнее в автоматическом режиме, чем его предшественник."
 DRC_infantry_weapons_2_desc: "Heckler & Koch G3 (Gewehr 3) — это автоматическая боевая винтовка калибра 7,62x51 мм НАТО, разработанная в Западной Германии в 1950-х годах немецким производителем вооружений Heckler & Koch (H&K) в сотрудничестве с испанским государственным конструкторским агентством CETME. G3 заменила FN FAL/G1 в качестве стандартной винтовки с 1959 года и использовалась до модернизации до улучшенной модели G3A1 в 1963 году."
 DRC_infantry_weapons_3_desc: "Разработка винтовки M16A2 была первоначально запрошена Корпусом морской пехоты США по итогам боевого опыта во Вьетнаме с XM16E1 и M16A1. Она была официально принята на вооружение Министерством обороны под обозначением «Винтовка США калибра 5,56 мм, M16A2» в 1982 году. Морская пехота стала первым видом Вооружённых сил США, принявшим её на вооружение, в начале/середине 1980-х годов, а Армия США последовала её примеру в конце 1980-х."
 DRC_infantry_weapons_4_desc: "M16A4 — четвёртое поколение серии M16. Она оснащена съёмной ручкой для переноски и четырьмя планками Пикатинни по всей длине для установки оптики и другого дополнительного оборудования. FN M16A4 с режимами огня «предохранитель/одиночный/отсечка очереди» стала штатным оружием Корпуса морской пехоты США. Армейские винтовки также оснащаются цевьём M5 RAS производства Knight's Armament Company, позволяющим крепить вертикальные рукоятки, лазерные целеуказатели, тактические фонари и другие аксессуары, благодаря чему в полевых уставах Армии США появилось обозначение M16A4 MWS (Modular Weapon System — модульная система оружия)."
 DRC_infantry_weapons_5_desc: "Карабин M4 — более короткий и лёгкий вариант штурмовой винтовки M16. M4 — магазинный карабин под патрон 5,56x45 мм НАТО с воздушным охлаждением и газоотводной автоматикой с прямым воздействием пороховых газов на затворную раму. Он имеет ствол длиной 14,5 дюйма (370 мм) и телескопический приклад."
 NAM_infantry_weapons_1_desc: "АКМ, разработанный в 1959 году, является наиболее распространенным модернизированным вариантом автомата АК-47, разработанного Михаилом Калашниковым. Он значительно легче и точнее в автоматическом режиме, чем его предшественник."
