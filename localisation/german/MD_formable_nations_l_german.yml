 ANTCONF_form_category: "Antillen-Konföderation"
 ANTCONF_form_category_desc: "The Antillean Confederation is a proposed state in the Caribbean with the unification of [CUB.GetNameWithFlag], [DOM.GetNameWithFlag], and [HAI.GetNameWithFlag]. It was initially formed as an idea from Ramón Emeterio Betances, a Puerto Rican independence activist, to unify all Spanish-speaking Caribbean nations into a single united entity. The original idea did not include [HAI.GetNameWithFlag]; however, it was quickly included by proponents of the idea. The idea mostly disappeared due to the American-Spanish war as the colonies of [CUB.GetNameWithFlag] and [PTR.GetNameWithFlag] were transferred to the United States. The idea would bring about a nation that would likely take the capital in Santo Domingo and its official language as Spanish."
 ANTCONF_integrate_start: "Begin forming [GetANTCONFNameDef]"
 ANTCONF_integrate_start_desc: "It is time to form the Antillean Confederation. Our people must be united now to ensure a brighter future for the people of the Caribbean.\n\n"
 ANTCONF_integrate_cuba: "Integrate [GetANTCONFNameAdj] [CUB.GetAdjective] Territories"
 ANTCONF_integrate_cuba_desc: "Kuba ist die größte der drei großen Nationen der Konföderation. Durch die Integration dieses Landes wird sich die Größe der Wirtschaft erhöhen und die Bevölkerung und die Landfläche nahezu verdoppeln."
 ANTCONF_integrate_dominican_republic: "Integrate [GetANTCONFNameAdj] [DOM.GetAdjective] Territories"
 ANTCONF_integrate_dominican_republic_desc: "Die Dominikanische Republik ist eine der drei großen Nationen der Konföderation. Sie teilt sich die Insel Hispaniola mit Haiti und verfügt über zahlreiche Touristen und Industrien. Im Norden der Insel wird außerdem leichter Bergbau betrieben und Stahl für den lokalen Gebrauch in der Republik hergestellt. Ihre Integration wird für die neue Konföderation von unschätzbarem Wert sein."
 ANTCONF_integrate_haiti: "Integrate [GetANTCONFNameAdj] [HAI.GetAdjective] Territories"
 ANTCONF_integrate_haiti_desc: "Haiti ist die kleinste der drei großen Nationen der Konföderation. Es unterscheidet sich weitgehend von Kuba und der Dominikanischen Republik, da es eine ehemalige französische Kolonie ist. Die Integration wird aufgrund der Sprachunterschiede zwischen der Gruppe von Nationen mehr Zeit in Anspruch nehmen, aber die industrielle Basis und der natürliche Hafen von Port-au-Prince werden für die wirtschaftlichen und militärischen Operationen in der Karibik von unschätzbarem Wert sein."
 ANTCONF_integrate_puerto_rico: "Integrate [GetANTCONFNameAdj] [PTR.GetAdjective] Territories"
 ANTCONF_integrate_puerto_rico_desc: "Puerto Rico has long been a territory of the United States. It boasts the protection of the United States, but it is not one of its integral holdings. It has a population of almost four million and is one of the largest islands in the Caribbean. It is the smallest of the potentially integrated states for the Antillean Confederation. Still, the vibrant culture and tourism in the area will bring a great amount of benefit to the larger confederation."
 ANTCONF_update_flag: "Finish Forming [GetANTCONFNameDef]"
 ANTCONF_update_flag_desc: "With every constituent territory integrated, we can complete our transformation and proclaim [GetANTCONFNameDef], adopting its unified flag and name."
 is_ANTCONF: "Has formed [GetANTCONFNameDef]"
 CANZUK_form_category: "CANZUK"
 CANZUK_form_category_desc: "CANZUK is a union of nations between Canada, Australia, New Zealand, and the United Kingdom. It differs from the British Empire as this union of states would be directly administered and be a properly united country. The nation would span several continents and become a major contender on the world stage. Perhaps we should entertain the idea and unify the nations?"
