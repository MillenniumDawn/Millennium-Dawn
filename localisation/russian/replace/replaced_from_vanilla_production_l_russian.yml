 PRODUCTION_AVAILABLE_ARMS_FACTORIES_LABEL: "Доступная военная промышленность"
 PRODUCTION_AVAILABLE_FACTORIES_LABEL: "Доступная гражданская промышленность"
 PRODUCTION_PRODUCING_NO_FACTORIES: "§RНет назначенной промышленности§!"
 PRODUCTION_EFFICIENCY_DESC: "§TСредняя эффективность производства в промышленности.\nЭффективность производства увеличивается на $VALUE|H=2$% за каждую произведённую единицу, распределяясь поровну между активными отраслями промышленности.§!"
 PRODUCTION_MATERIALS_OIL: "Ископаемое топливо"
 oil_desc: "Ископаемое топливо необходимо для успешного развития любой крупной современной экономики. Обеспечение безопасности этого ресурса имеет первостепенное значение для государств XXI века."
 PRODUCTION_MATERIALS_ALUMINIUM: "Лёгкие металлы"
 aluminium_desc: "Лёгкие металлы важны для постройки специальной техники и летательных аппаратов. Алюминий — основной металл, благодаря которому вертолёты и самолёты преодолевают гравитацию."
 PRODUCTION_MATERIALS_RUBBER: "Резина"
 rubber_desc: "Резина важна для конструкции большинства транспортных средств. Благодаря эластичности она превосходно подходит для изготовления шин и других промышленных применений."
 PRODUCTION_MATERIALS_TUNGSTEN: "Технологические металлы"
 tungsten_desc: "Технологические металлы являются основным сырьем для производства передовых технологий. Самые современные системы вооружения и оборудование часто определяют исход сражения."
 PRODUCTION_MATERIALS_STEEL: "Сталь"
 steel_desc: "Сталь является основным металлом для большинства видов военной техники, будь то наземные транспортные средства или корабли. Длительные конфликты без доступа к этому ресурсу сделают ваши военные заводы практически бесполезными."
 PRODUCTION_MATERIALS_CHROMIUM: "Драгоценные металлы"
 chromium_desc: "Драгоценные металлы, минералы и другие редкие элементы занимают важнейшее место в современных технологиях. Золото, серебро и алмазы особенно важны в качестве источника дохода для дестабилизированных развивающихся регионов."
 PRODUCTION_VEHICLES_BUTTON_NO_FACTORIES_DISABLED: "У нас §Rнет военной промышленности!§!"
 PRODUCTION_INFANTRY_BUTTON_NO_FACTORIES_DISABLED: "У нас §Rнет военной промышленности!§!"
 PRODUCTION_CONSUMER_GOODS: "Налоговые издержки"
 PRODUCTION_CONSUMER_GOODS_LABEL: "§HНалоговые издержки§!"
 PRODUCTION_CONSUMER_GOODS_DESC: "Из-за налогов и различных политик $PERCENTAGE|H0%$ нашей экономики (гражданской промышленности) недоступно. Остаётся $OPERATIONAL|H$ предприятий, из которых $TRADE_USABLE|H$ можно использовать для торговли."
 PRODUCTION_CIV_AND_MIL_FACTORIES: "Гражданская и военная промышленность: $KEY|H$"
 PRODUCTION_REQ_CONSUMER_GOODS_FACTORIES: "Требуется гражданской промышленности: $KEY|H$"
 PRODUCTION_WORKING_FACTORIES: "Столько промышленности сейчас работает на ваших производственных линиях."
 PRODICTION_MIC_TRANSFERED: "$AMOUNT|Y$ нашей промышленности использует $OVERLORD|Y$."
 PRODICTION_MIC_RECEIVED_FROM_SUBJECT: "$AMOUNT|Y$ военной промышленности получено от наших субъектов."
 PRODICTION_MIC_SENT_TO_OVERLORD: "$AMOUNT|R$ нашей военной промышленности передано нашей метрополии, и у нас осталось только $LEFT|H$."
 PRODUCTION_OUTPUT_EXPLAIN: "Наши $FACTORIES|Y$ £factory_item военных предприятий дают $OUTPUT|Y$ £production_cost . \n$ITEM|Y$ стоит $ITEM_COST|2Y$ £production_cost , а значит, мы можем производить $PERTIMEPERIOD$.\n"
 PRODUCTION_FILTER_ARMS_FACTORIES: "Задействованная военная промышленность"
 PRODUCTION_VEHICLES_BUTTON: "Производство танков, машин и вертолётов"
 PRODUCTION_INFANTRY_BUTTON: "Производство лёгкого боевого снаряжения"
 PRODUCTION_AIRCRAFT_BUTTON: "Производство самолётов и ракет"
 PRODUCTION_SHIPS_BUTTON: "Производство кораблей и подлодок"
 PRODUCTION_MATERIALS_MICROCHIPS: "Микрочипы"
 microchips_desc: "Микрочип (также называемый чипом, компьютерной микросхемой, интегральной схемой или ИС) представляет собой набор электронных схем на небольшом плоском кусочке кремния. Используется в передовых вычислительных системах и военной технике."
 PRODUCTION_MATERIALS_COMPOSITES: "Композитные материалы"
 composites_desc: "Композиты — это материалы, полученные соединением двух или более исходных материалов с разными физическими или химическими свойствами."