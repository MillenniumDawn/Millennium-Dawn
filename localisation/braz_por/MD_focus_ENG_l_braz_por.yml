 ENG_finalize_scottish_union_settlement: "Finalizar o Acordo Escocês"
 ENG_finalize_scottish_union_settlement_desc: "Três acordos já foram aprovados na Escócia, e o mandato que os partidos separatistas um dia chamaram de impossível de reunir está completo. Resta o ato formal: inscrever o resultado em lei, desmontar de vez a máquina dos referendos e riscar do registro os núcleos escoceses remanescentes, para que não sobre ambiguidade a ser explorada por um futuro governo. Holyrood mantém suas instituições, mas a questão constitucional que o acordo de devolução deixou em aberto em 1998 está encerrada."
 ENG_finalize_north_irish_union_settlement: "Finalizar o Acordo Norte-Irlandês"
 ENG_finalize_north_irish_union_settlement_desc: "Três acordos já foram aprovados na Irlanda do Norte, e o mandato que a política republicana um dia chamou de impossível de reunir está completo. Resta o ato formal: inscrever o resultado em lei, desmontar de vez a máquina do plebiscito de fronteira e riscar do registro os núcleos norte-irlandeses remanescentes, para que não sobre ambiguidade a ser explorada por um futuro governo. Stormont mantém suas instituições, mas a questão constitucional que o Acordo da Sexta-Feira Santa deixou em aberto está encerrada."
 ENG_finalize_welsh_union_settlement: "Finalizar o Acordo Galês"
 ENG_finalize_welsh_union_settlement_desc: "Três acordos já foram aprovados no País de Gales, e o mandato que a ala independentista do Senedd um dia chamou de impossível de reunir está completo. Resta o ato formal: inscrever o resultado em lei, desmontar de vez a máquina dos referendos e riscar do registro os núcleos galeses remanescentes, para que não sobre ambiguidade a ser explorada por um futuro governo. O Senedd mantém suas instituições, mas a questão constitucional que o acordo de devolução deixou em aberto está encerrada."
