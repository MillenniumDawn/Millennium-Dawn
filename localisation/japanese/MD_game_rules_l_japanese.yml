 RULE_GOD_OF_WAR_NO: "無効"
 RULE_GOD_OF_WAR_YES: "有効"
 RULE_GOD_OF_WAR_NO_DESC: "AIはデフォルトの設定を使用する"
 RULE_GOD_OF_WAR_YES_DESC: "AIは高度な部隊編制とチートを使用する"
 RULE_ALLOW_CONDITIONAL_PEACE_DEAL: "条件付き和平協定を許可"
 RULE_OPTION_CONDITIONAL_PEACE_DEAL_YES_DESC: "交戦中の国家が、どちらの側も完全に降伏する必要のない和平協定を結ぶことを可能にする、§Y条件付き和平協定§!のスクリプト化された外交行動を使用できるようになる。"
 RULE_OPTION_CONDITIONAL_PEACE_DEAL_NO_DESC: "国家が§Y条件付き和平協定§!のスクリプト化された外交行動を使用することを禁じ、和平状態に達するために総力戦を耐え忍ぶことを強制する。"
 RULE_PEACE_PROPOSAL_BLOCKED_TT: "§Y条件付き和平協定§!が有効な間、これはブロックされる。代わりに§Y$CPD_OFFER_CONDITIONAL_PEACE_TITLE$§!を使用すること！"
 RULE_OPTION_ALL_AHEAD_SLOW: "微速前進"
 RULE_OPTION_ALL_AHEAD_SLOW_AI_DESC: "このゲームルールを有効にすると、AIがアメリカを崩壊させないようなる。実質、非史実AIモードからランダム要素を取り除く。"
 RULE_OPTION_SECOND_COAL_WARS: "第二次石炭戦争"
 RULE_OPTION_SECOND_COAL_WARS_AI_DESC: "自由国は、ウェストバージニアの炭鉱がそもそも閉鎖された理由の原則に基づき、再開されないことを新生UMWAに宣言し、「現代的な解決策と問題が、そもそも閉鎖された理由であった」と述べる。その結果、炭鉱労働者たちは暴動を起こし、州の独立を宣言し、第二次石炭戦争へと発展する。§Rアメリカのゲームルール「合衆国時代の後に」または「大崩壊」のいずれかが必要§!"
 NEN_AI_BEHAVIOR: "@NEN ニューイングランド"
 RULE_OPTION_GREEN_MOUNTAIN_REBELLION: "グリーンマウンテンの反乱"
 RULE_OPTION_GREEN_MOUNTAIN_REBELLION_AI_DESC: "少数の声高な者たちによる些細な政治的圧力に屈することなく、ニューイングランド国民政府は、政府所在地をモントピリアに移転せよというバーモント人の要求を拒否する。その結果、州内の新興の反乱を鎮圧せざるを得なくなるまで、敵意は高まり続けるだろう。§Rアメリカのゲームルール「合衆国時代の後に」または「大崩壊」のいずれかが必要§!"
 RULE_OPTION_THE_OTHER_NEW_CAPITAL: "もう一つの新首都"
 RULE_OPTION_THE_OTHER_NEW_CAPITAL_AI_DESC: "新しい首都がどこになるかについて、心から気にしている人がほとんどいないことを見て、ニューイングランド政府はバーモント人の「要求」を受け入れ、首都をモントピリアに移転する。§Rアメリカのゲームルール「合衆国時代の後に」または「大崩壊」のいずれかが必要§!"
 POL_PHALANGA: "ファランガ"
 POL_PHALANGA_DESC: "ポーランドはナショナリズム運動ファランガの道を選択する。"
 ROM_HISTORICAL: "史実"
 ROM_HISTORICAL_DESC: "ルーマニアは、平和共存と欧州連合への加盟を目指すという史実の道をたどる。"
 RULE_OPTION_ROM_FASCIST: "急進的なルーマニア"
 RULE_OPTION_ROM_FASCIST_DESC: "ルーマニアで急進的な勢力が権力を握り、地域の不安定化につながる可能性がある。"
 RULE_OPTION_ROM_DEMOCRATIC: "民主主義の道"
 RULE_OPTION_ROM_DEMOCRATIC_DESC: "ルーマニアは民主主義的価値観を堅持し、国内で民主主義政党の一つが権力を得る。"
 RULE_OPTION_ROM_CENTER: "ルーマニアにおける中道主義"
 RULE_OPTION_ROM_CENTER_DESC: "ルーマニアは、その政治的方向性において中道主義の道をたどる。"
 RULE_ALLOW_WORLD_WAR: "規定路線の世界大戦"
 RULE_ALLOW_ENABLE_WORLD_WAR: "規定路線の世界大戦を有効化"
 RULE_ALLOW_ENABLE_WORLD_WAR_YES_DESC: "このオプションは、「Millennium Dawn」のサンドボックス要素を制限し、他のMODと同様に、特定の年までに世界を世界大戦へと向かわせる。\n\n史実モードでプレイし、「AI債務戦争」オプションを無効にすることが強く推奨される。"
 RULE_ALLOW_ENABLE_WORLD_WAR_NO: "規定路線の世界大戦を無効化"
