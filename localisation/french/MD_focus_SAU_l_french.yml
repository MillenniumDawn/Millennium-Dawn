l_french:
 saudi_focus_tree: "Arbre de focuses de l'Arabie saoudite"
 SAU_crackdown_on_the_opposition: "Réprimer l'opposition"
 SAU_crackdown_on_the_opposition_desc: "Les Mabahith tiennent des dossiers étendus sur les organisateurs chiites, les clercs de la Sahwa et les pétitionnaires libéraux. Le Conseil usera de ces archives pour identifier et réprimer l'opposition au régime militaire."
 SAU_modernisation_balance_of_power_category: "§L'avenir du Royaume§!"
 SAU_shia_rights_reform: "Réforme des droits chiites"
 SAU_shia_rights_reform_desc: "Codifiez les droits des chiites dans la loi du pays.\n\n§G-Résistance chiite, +Stabilité, +Population chiite§!."
 SAU_trials_of_the_old_order: "Procès de l'ancien ordre"
 SAU_trials_of_the_old_order_desc: "Le Conseil poursuivra les membres de l'ancien ordre royal devant des tribunaux publics. Contrairement aux règlements privés de la purge du Ritz-Carlton de 2017, ces procédures présenteront charges et jugements au grand jour, tout en servant les intérêts politiques du Conseil."
 SAU_unif_command_control_tt: "§HUne structure unifiée de commandement et de contrôle est établie dans les forces armées du CCG.§!"
 SAU_unif_cross_border_tt: "§YExige une infrastructure transfrontalière développée dans la région frontalière (niveau d'infrastructure 3 ou plus).§!"
 SAU_unif_exploit_authority_tt: "§YExige que le Royaume soit la première influence étrangère dans chaque autre État membre du CCG.§!"
 SAU_unif_increase_autonomy_tt: "§HUne plus grande autonomie régionale apaise les griefs confessionnels. L'influence intérieure croît et la radicalisation recule.§!"
 HOU_houthi_resilience: "La résilience d’Ansar Allah"
 HOU_houthi_resilience_desc: "Ansar Allah opère dans le nord montagneux du Yémen depuis des décennies. Sa connaissance du terrain et ses positions établies dans les hauts plateaux rendent les forces houthies difficiles à déloger."
 PER_houthi_defense_buff: "Fortifications de montagne"
 PER_houthi_defense_buff_desc: "Des défenses construites par l'Iran transforment les hauts plateaux en forteresse. +15 % de défense contre les forces du gouvernement."
 SAU_arab_shield_member: "Membre du Bouclier arabe"
 SAU_arab_shield_member_desc: "Cette nation participe aux arrangements de défense collective du Bouclier arabe, améliorant la défense et le moral de ses forces armées."
 SAU_aramco_01: "Aramco saoudienne"
 SAU_aramco_01_desc: "La Saudi Arabian Oil Company est la plus grande entreprise pétrolière du monde, entièrement nationalisée depuis 1980. Aramco contrôle les vastes réserves de pétrole du Royaume et sert d'épine dorsale à l'économie saoudienne, générant la majorité des recettes de l'État. Immenseément profitable, la société opère avec une transparence limitée et n'a pas encore modernisé sa structure d'entreprise."
 SAU_aramco_02: "Saudi Aramco - Opérations étendues"
 SAU_aramco_02_desc: "Aramco a étendu ses opérations au-delà de l'extraction de brut, investissant dans le raffinage, les projets pétrochimiques et les partenariats internationaux. L'efficacité croissante de la société et son portefeuille diversifié ont consolidé sa position de pierre angulaire de l'économie saoudienne."
 SAU_aramco_03: "Saudi Aramco - leader énergétique mondial"
 SAU_aramco_03_desc: "Saudi Aramco s'est transformée en un géant énergétique mondial moderne. Avec une introduction en bourse réussie, des opérations aval élargies et des investissements internationaux stratégiques, la société se tient désormais parmi les plus valorisées du monde. Ses recettes alimentent non seulement le budget du Royaume, mais aussi des programmes de développement ambitieux à travers la nation."
 SAU_aramco_downstream: "§HSaudi Aramco§! - Intégration en aval"
 SAU_aramco_downstream_desc: "Aramco s'est étendue au raffinage et à la production chimique, lui permettant de tirer des recettes de chaque étape entre l'extraction du brut et la vente au détail de carburant."
 SAU_aramco_engineers: "§HSaudi Aramco§! - Ingénieurs pétroliers saoudiens"
 SAU_aramco_engineers_desc: "Une génération d'ingénieurs pétroliers saoudiens, formés à la KFUPM et à l'étranger, a remplacé les mains étrangères qui faisaient autrefois tourner les champs."
 SAU_aramco_export: "§HSaudi Aramco§! - puissance exportatrice"
 SAU_aramco_export_desc: "Aramco est bâtie comme une machine d'exportation, ses terminaux et ses flottes de pétroliers réglés pour livrer plus de brut à plus de marchés qu'aucun rival."
 SAU_aramco_gas: "§HSaudi Aramco§! - Le Master Gas System"
 SAU_aramco_gas_desc: "Le Master Gas System capte le gaz naturel autrefois torché et le transporte vers les centrales et les installations industrielles à travers l'Arabie saoudite."
 SAU_aramco_ghawar: "§HSaudi Aramco§! - Le champ de Ghawar"
 SAU_aramco_ghawar_desc: "Ghawar est le plus grand champ pétrolier conventionnel du monde et produit des millions de barils par jour. Sa production est centrale pour Aramco comme pour l'économie saoudienne."
 SAU_aramco_giant: "§HSaudi Aramco§! - entreprise la plus valorisée au monde"
 SAU_aramco_giant_desc: "Aramco se tient comme la société la plus valorisée de la Terre, sa production, ses réserves et ses profits sans égal dans l'histoire des entreprises."
 SAU_aramco_megafields: "§HSaudi Aramco§! - Nouveaux mégagisements"
 SAU_aramco_megafields_desc: "D'importants développements à Shaybah, Khurais et au champ offshore de Manifa ont élargi la capacité de production saoudienne et poursuivi l'investissement du Royaume dans de grands projets pétroliers."
 SAU_aramco_national: "§HSaudi Aramco§! - nationalisation complète"
 SAU_aramco_national_desc: "Achevé en 1980, le rachat des actionnaires américains a rendu Aramco entièrement saoudienne. Le pétrole du Royaume ne répond plus qu'à Riyad."
 SAU_aramco_opec: "§HSaudi Aramco§! - Producteur pivot de l'OPEP"
 SAU_aramco_opec_desc: "L'Arabie saoudite maintient assez de capacité de production de réserve pour augmenter ou réduire l'offre de l'OPEP et influencer les prix mondiaux du pétrole plus qu'aucun autre membre."
 SAU_aramco_petrochem: "§HSaudi Aramco§! - Raffinage intégré"
 SAU_aramco_petrochem_desc: "PetroRabigh et SATORP, coentreprises avec Sumitomo et Total, soudent raffinage et pétrochimie en complexes intégrés unique sur la mer Rouge et le Golfe."
 SAU_aramco_production: "§HSaudi Aramco§! - Maximiser la production"
 SAU_aramco_production_desc: "Aramco privilégie une production maximale soutenable tout en conservant une capacité de réserve. Cela permet à l'Arabie saoudite de réagir vite aux changements de demande ou de politique de production du gouvernement."
 SAU_aramco_rastanura: "§HSaudi Aramco§! - Ras Tanura et Abqaiq"
 SAU_aramco_rastanura_desc: "Le terminal d'exportation de Ras Tanura et le complexe de traitement d'Abqaiq traitent une grande part du brut saoudien avant qu'il n'entre sur les marchés mondiaux. Ensemble, ils comptent parmi les plus grandes installations pétrolières de leur genre."
 SAU_aramco_rnd: "§HSaudi Aramco§! - recherche EXPEC"
 SAU_aramco_rnd_desc: "Le centre de recherche avancée EXPEC à Dhahran mène le monde en ingénierie de réservoir, extrayant davantage de pétrole de chaque champ à moindre coût."
 SAU_baathist_party_1: "Le bastion du nationalisme arabe"
 SAU_baathist_party_1_loc: "\n[SAU.GetFlag]Le bastion du nationalisme arabe\n§HInfluence étrangère§! Multiplicateur : §G+5.00 %§!\n§HInfluence étrangère§! Facteur de succès de coup : §G+25.0 %§!\n\n"
 SAU_baathist_party_3: "Unité, Liberté, Socialisme"
 SAU_baathist_party_3_loc: "[SAU.GetFlag]Unité, liberté, socialisme\nVitesse de construction : §G+10.00%§!\nMultiplicateur du coût des campagnes de propagande nationaliste : §G-10.00%§!\nCroissance mensuelle de la productivité : §G+0.05§!\n\n"
 SAU_banking_649_hybrid: "§HLoi sur les intérêts§! - §YHybride (sukuk + informel)§!"
 SAU_banking_649_hybrid_desc: "Les sukuk et les services bancaires islamiques opèrent aux côtés d'un crédit conventionnel informel. Le système reste officiellement conforme à la charia tout en autorisant une flexibilité pratique limitée."
 SAU_banking_649_hybrid_loc: "\n§HLoi sur l'intérêt :§! §YSukuk + intérêt informel§!\n §G+2.0%§! Impôt des parcs de bureaux\n §G+1.0%§! Pouvoir politique\n §G+0.5%§! Stabilité\n"
 SAU_banking_649_islamic: "§HLoi sur les intérêts§! - §RInterdiction stricte du riba§!"
 SAU_banking_649_islamic_desc: "Le riba est interdit sans exception. La finance circule par le partage des profits et les structures de murabaha, et les fidèles bancarisent en conscience claire."
 SAU_banking_649_islamic_loc: "\n§HLoi sur l'intérêt :§! §BInterdiction stricte du Riba§!\n §G+3.0%§! Pouvoir politique\n §G+2.0%§! Stabilité\n §G+0.5%§! Dérive salafiste\n"
 SAU_banking_649_secular: "§HLoi sur les intérêts§! - §GConventionnelle§!"
 SAU_banking_649_secular_desc: "L'intérêt est légal et ouvertement tarifé. La banque conventionnelle prospère et les capitaux circulent librement, quoi que prêchent les clercs le vendredi."
 SAU_banking_649_secular_loc: "\n§HLoi sur l'intérêt :§! §GConventionnel§!\n §G+4.0%§! Impôt des parcs de bureaux\n §G+3.0%§! Impôt sur les sociétés\n §G+0.5%§! Dérive démocratique\n §R-1.0%§! Stabilité\n"
 SAU_banking_650_hybrid: "§HMandat de réserve§! - §YModéré§!"
 SAU_banking_650_hybrid_desc: "Des exigences de réserve modérées permettent aux banques d'étendre le crédit tout en conservant des coussins financiers plus larges qu'un système faiblement réglementé."
 SAU_banking_650_hybrid_loc: "\n§HMandat de réserve :§! §YRéserves modérées§!\n §G+1.0%§! Vitesse de construction\n §G+0.5%§! Stabilité\n"
 SAU_banking_650_islamic: "§HMandat de réserve§! - §RCouverture intégrale en actifs§!"
 SAU_banking_650_islamic_desc: "Chaque dépôt est adossé à des actifs réels. Le crédit croît lentement, mais aucune banque saoudienne ne peut s'effondrer dans une ruée."
 SAU_banking_650_islamic_loc: "\n§HMandat de réserve :§! §BCouverture intégrale des actifs (charia)§!\n §G+2.5%§! Stabilité\n §G+2.0%§! Soutien de guerre\n §R-2.0%§! Vitesse de construction\n"
 SAU_banking_650_secular: "§HMandat de réserve§! - §GRéserve fractionnaire§!"
 SAU_banking_650_secular_desc: "Les banques prêtent contre une fraction de leurs dépôts, multipliant le crédit dans l'économie à la façon occidentale."
 SAU_banking_650_secular_loc: "\n§HMandat de réserve :§! §GRéserves fractionnaires (occidentales)§!\n §G+3.0%§! Vitesse de construction\n §G+5.0%§! Réparation de l'industrie\n §R-2.0%§! Usage de biens de consommation\n §R-1.5%§! Stabilité\n"
 SAU_banking_651_hybrid: "§HCode de spéculation§! - §YDérivés réglementés§!"
 SAU_banking_651_hybrid_desc: "Les produits dérivés se négocient dans des limites strictes, les couvertures sont autorisées et la spéculation est contrôlée."
 SAU_banking_651_hybrid_loc: "\n§HCode de spéculation :§! §YDérivés réglementés uniquement§!\n §G+1.5%§! Gain fiscal\n §G+0.5%§! Stabilité\n"
 SAU_banking_651_islamic: "§HSCode de spéculation§! - §RNon Gharar§!"
 SAU_banking_651_islamic_desc: "L'interdiction du gharar barre les dérivés, la vente à découvert et les autres produits financiers fondés sur une incertitude ou une spéculation excessive."
 SAU_banking_651_islamic_loc: "\n§HCode de spéculation :§! §BPas de Gharar - pas de jeu§!\n §G+2.5%§! Stabilité\n §G+2.0%§! Pouvoir politique\n §G+3§! Acceptation de la neutralité\n"
 SAU_banking_651_secular: "§HCode de spéculation§! - §GRéglementation légère§!"
 SAU_banking_651_secular_desc: "Options, contrats à terme et autres dérivés sont autorisés sous une surveillance réglementaire limitée."
 SAU_banking_651_secular_loc: "\n§HCode de spéculation :§! §GDérivés et contrats à terme autorisés§!\n §G+3.0%§! Gain fiscal\n §G+2.0%§! Vitesse de recherche\n §R-2.0%§! Stabilité\n"
 SAU_banking_652_hybrid: "§HCode interbancaire§! - §YCanaux doubles§!"
 SAU_banking_652_hybrid_desc: "Deux canaux interbancaires fonctionnent côte à côte, conventionnel et islamique, et chaque banque choisit sa contrepartie."
 SAU_banking_652_hybrid_loc: "\n§HCode interbancaire :§! §YDouble canal§!\n §G+1.5%§! Impôt des parcs de bureaux\n §G+1.0%§! Pouvoir politique\n"
 SAU_banking_652_islamic: "§HCode interbancaire§! - §RMourahaba§!"
 SAU_banking_652_islamic_desc: "La liquidité interbancaire circule par la murabaha de matières premières, maintenant même l'argent au jour le jour dans les limites de la charia."
 SAU_banking_652_islamic_loc: "\n§HCode interbancaire :§! §BBasé sur la Murabaha§!\n §G+2.5%§! Pouvoir politique\n §G+1.5%§! Stabilité\n §G+0.5%§! Dérive salafiste\n"
 SAU_banking_652_secular: "§HCode interbancaire§! - §YFaçon GLIBOR§!"
 SAU_banking_652_secular_desc: "Les banques se prêtent entre elles aux taux d'intérêt de référence, tissant la finance saoudienne dans les marchés monétaires mondiaux."
 SAU_banking_652_secular_loc: "\n§HCode interbancaire :§! §GCorridor d'intérêt conventionnel§!\n §G+3.0%§! Impôt des parcs de bureaux\n §G+2.0%§! Impôt sur les sociétés\n §G+0.5%§! Dérive démocratique\n §R-1.0%§! Stabilité\n"
 SAU_banking_653_hybrid: "§HContrôle bancaire§! - §YStructures parallèles§!"
 SAU_banking_653_hybrid_desc: "Banques conventionnelles et islamiques répondent à des filières de supervision parallèles sous un même toit de banque centrale."
 SAU_banking_653_hybrid_loc: "\n§HContrôle bancaire :§! §YStructures parallèles SAMA + charia§!\n §G+2.0%§! Gain fiscal\n §G+1.5%§! Pouvoir politique\n"
 SAU_banking_653_islamic: "§HContrôle bancaire§! - §RSAMA + Conseil de la charia§!"
 SAU_banking_653_islamic_desc: "La SAMA partage l'autorité avec un conseil de supervision de la charia, et aucune licence bancaire ne survit au veto des oulémas."
 SAU_banking_653_islamic_loc: "\n§HContrôle bancaire :§! §BSAMA + supervision de la charia§!\n §G+4.0%§! Pouvoir politique\n §G+2.5%§! Stabilité\n §G+1.0%§! Dérive salafiste\n"
 SAU_banking_653_secular: "§HContrôle bancaire§! - §GSAMA indépendante§!"
 SAU_banking_653_secular_desc: "La SAMA régule la banque comme une banque centrale indépendante, redevable à la confiance du marché et à peu d'autre chose."
 SAU_banking_653_secular_loc: "\n§HContrôle bancaire :§! §GSAMA indépendante§!\n §G+4.0%§! Gain fiscal\n §G+2.0%§! Vitesse de recherche\n §G+1.0%§! Dérive démocratique\n §R-1.0%§! Stabilité\n"
 SAU_banking_654_pragmatic: "§HFinance islamique§! - §YPôle islamique mondial§!"
 SAU_banking_654_pragmatic_desc: "Riyad devient un centre international de la finance islamique. Ses réglementations conservent la crédibilité de la charia tout en accueillant des institutions d'autres grands marchés financiers."
 SAU_banking_654_pragmatic_loc: "\n§HBastion de la finance islamique :§! §YHub mondial de la finance islamique§!\n §G+3.0%§! Pouvoir politique\n §G+2.5%§! Stabilité\n §G+5.0%§! Impôt des parcs de bureaux\n §G+4.0%§! Impôt sur les sociétés\n §G+5§! Acceptation de la neutralité\n"
 SAU_banking_654_strict: "§HFinance islamique§! - §ROrthodoxie stricte§!"
 SAU_banking_654_strict_desc: "Le Royaume exige le plein respect des règles financières islamiques orthodoxes. Cela limite la flexibilité mais attire les clients qui privilégient une stricte conformité à la charia."
 SAU_banking_654_strict_loc: "\n§HBastion de la finance islamique :§! §BOrthodoxie stricte§!\n §G+5.0%§! Pouvoir politique\n §G+5.0%§! Stabilité\n §G+2.0%§! Dérive salafiste\n §G+10§! Acceptation de la neutralité\n §G+10.0%§! Défense contre la dérive\n"
 SAU_banking_655_full: "§HFinance sécularisée§! - §GPleine anglo-saxonne§!"
 SAU_banking_655_full_desc: "L'Arabie saoudite a adopté le modèle bancaire anglo-saxon dans son entier. Le changement élargit les marchés de capitaux conventionnels mais se heurte à l'opposition de l'establishment religieux."
 SAU_banking_655_full_loc: "\n§HFinance sécularisée :§! §GPlein anglo-saxon§!\n §G+10.0%§! Impôt des parcs de bureaux\n §G+7.0%§! Impôt sur les sociétés\n §G+5.0%§! Gain fiscal\n §G+4.0%§! Vitesse de recherche\n §G+2.0%§! Dérive démocratique\n §R-3.0%§! Stabilité\n §R-2.0%§! Usage de biens de consommation\n"
 SAU_banking_655_gradual: "§HFinance sécularisée§! - §YProgressive§!"
 SAU_banking_655_gradual_desc: "Des règles financières conventionnelles sont introduites progressivement pour réduire l'opposition religieuse organisée à la sécularisation."
 SAU_banking_655_gradual_loc: "\n§HFinance sécularisée :§! §YTransition graduelle§!\n §G+6.0%§! Impôt des parcs de bureaux\n §G+4.0%§! Impôt sur les sociétés\n §G+3.0%§! Gain fiscal\n §G+1.0%§! Dérive démocratique\n §R-1.0%§! Stabilité\n"
 SAU_banking_system: "§HSystème bancaire§!"
 SAU_banking_system_desc: "Le secteur financier du Royaume. Chaque focalisation de droit bancaire donne au joueur un choix §Llaïc§!, §Lislamique§! ou §Lhybride§! ; le résultat vit ici comme un §Hsous-système§!. Le modificateur total vient de la somme de tous les sous-systèmes choisis."
 SAU_banking_system_tt: "[SAU_banking_649_loc][SAU_banking_650_loc][SAU_banking_651_loc][SAU_banking_652_loc][SAU_banking_653_loc][SAU_banking_654_loc][SAU_banking_655_loc]"
 SAU_black_february_bailout_idea: "L'intervention de février"
 SAU_black_february_bailout_idea_desc: "L'État a dépensé des fonds publics pour ralentir l'effondrement du Tadawul et protéger les petits investisseurs des pires pertes. L'intervention réduit les fonds disponibles du Trésor et établit un précédent coûteux pour les futures crises de marché."
 SAU_black_february_idea: "Février noir"
 SAU_black_february_idea_desc: "Le Tadawul a perdu les deux tiers de sa valeur, détruisant une grande part de l'épargne investie par les ménages saoudiens. L'échec du gouvernement à intervenir a provoqué une colère publique généralisée."
 SAU_communist_state_2: "La nation prolétarienne"
 SAU_communist_state_2_loc: "[SAU.GetFlag]La nation prolétarienne\nMultiplicateur de recettes fiscales de §Hpopulation§! : §G+5.00%§!\nProductivité du §Hdistrict agricole commercialisé§! : §G+10.00%§!\n\n\n§HRecettes fiscales de population§! Multiplicateur : §G+5.00 %§!\n§HAgriculture§! Multiplicateur de recettes fiscales : §G+5.00 %§!\n§HDistrict d'agriculture commercialisée§! Productivité : §G+10.00 %§!"
 SAU_communist_state_2_tt: "[SAU_communist_state_1_loc][SAU_communist_state_2_loc][SAU_communist_state_3_loc][SAU_communist_state_4_loc][SAU_communist_state_5_loc]"
 SAU_Cooperation_West_East: "[USA.GetFlag] Coopération dans un monde divisé [CHI.GetFlag]"
 SAU_Cooperation_West_East_desc: "Dans un monde divisé en deux grands blocs, le monde oriental aligné sur la superpuissance montante [CHI.GetFlag] Chine, et le camp occidental mené par [USA.GetFlag] l'Amérique, en ce millénaire nouveau"
 SAU_Cooperation_West_East_tt: "[SAU_IMEC_india_deal_new_loc][SAU_OPEC_Russia_deal_new_loc]"
 SAU_custodian_of_the_cause: "Gardien de la Cause"
 SAU_custodian_of_the_cause_desc: "Riyad a fait de la Palestine la mesure de son leadership du monde arabe, et la rue arabe répond par la loyauté."
 SAU_cyber_defensive_posture: "Posture cyberdéfensive"
 SAU_cyber_defensive_posture_desc: "Les opérations de durcissement de la GIP protègent les réseaux du Royaume et ralentissent la collecte de renseignement hostile."
 SAU_cyber_defensive_target: "Cyber-contre-mesures saoudiennes"
 SAU_cyber_defensive_target_desc: "Les cyberdéfenses de la GIP ont dégradé la coordination offensive et le commandement."
 SAU_cyber_offensive_target: "Sous assaut cybernétique saoudien"
 SAU_cyber_offensive_target_desc: "Les opérations cyber de la GIP ont paralysé le commandement et la coordination défensive, et perturbé l'industrie."
 SAU_decisive_storm_air_cover: "Couverture aérienne de la coalition"
 SAU_decisive_storm_air_cover_desc: "Les aéronefs saoudiens et de la coalition fournissent une couverture aérienne aux forces du gouvernement yéménite, accordant +10 % de défense contre les Houthis. Ce soutien prend fin si un cessez-le-feu est accepté ou si le mouvement houthi cesse d'exister."
 SAU_decree_abdullah_kaec_construction: "Procédure accélérée KAEC"
 SAU_decree_abdullah_kaec_construction_desc: "Les travaux civils à travers le Royaume sont poussés au rythme fixé sur la côte de la mer Rouge."
 SAU_decree_abdullah_kasp_scholarship: "Bourse d'études à l'étranger KASP"
 SAU_decree_abdullah_kasp_scholarship_desc: "Une génération formée à l'étranger filtre de nouveau dans les ministères, les universités et les firmes."
 SAU_decree_abdullah_kaust_grants: "Bourses de haute technologie KAUST"
 SAU_decree_abdullah_kaust_grants_desc: "Des bourses KAUST élargies accélèrent la recherche universitaire et augmentent la production de l'industrie de haute technologie."
 SAU_decree_abdullah_national_dialogue: "Forums de dialogue national"
 SAU_decree_abdullah_national_dialogue_desc: "Les griefs se débattent dans les salles de conférence plutôt que dans la rue."
 SAU_decree_abdullah_sang_subsidies: "Subventions de modernisation de la Garde nationale"
 SAU_decree_abdullah_sang_subsidies_desc: "Des contrats subventionnés maintiennent bas le prix des véhicules blindés et gardent les formations à l'effectif."
 SAU_decree_mbn_border_surveillance: "Grilles de surveillance des gardes-frontières"
 SAU_decree_mbn_border_surveillance_desc: "La frontière est surveillée d'un bout à l'autre, et les troupes y sont retranchées derrière des positions préparées."
 SAU_decree_mbn_mabahith_campaign: "Campagne de contre-subversion Mabahith"
 SAU_decree_mbn_mabahith_campaign_desc: "Les Mabahith surveillent les communications et intensifient la surveillance des dissidents soupçonnés dans tout le Royaume."
 SAU_decree_mbn_rehabilitation_center: "Centre de réadaptation Prince Nayef"
 SAU_decree_mbn_rehabilitation_center_desc: "Le centre du prince Nayef tente de réhabiliter les militants et de les ramener à la vie civile plutôt que de laisser l'emprisonnement ou la mort renforcer le recrutement extrémiste."
 SAU_decree_mbn_special_security_forces: "Forces de sécurité spéciales du ministère de l'Intérieur"
 SAU_decree_mbn_special_security_forces_desc: "Les forces du ministère de l'Intérieur sont dans les rues, et quiconque œuvre contre le Royaume le trouve bien plus difficile."
 SAU_decree_mbn_western_intel_networks: "Réseaux de renseignement conjoints occidentaux"
 SAU_decree_mbn_western_intel_networks_desc: "Le renseignement partagé des services alliés comble ce que la collecte saoudienne ne peut atteindre."
 SAU_decree_mbs_anticorruption_drive: "Les règlements du Ritz-Carlton"
 SAU_decree_mbs_anticorruption_drive_desc: "Les détentions du Ritz-Carlton ont forcé de riches Saoudiens à céder des actifs à l'État et ont démontré le contrôle de la direction sur les fortunes privées."
 SAU_decree_mbs_aramco_liquidity: "Liquidités stratégiques d'Aramco"
 SAU_decree_mbs_aramco_liquidity_desc: "L'argent du pétrole est versé directement dans les mains de l'État, et l'industrie a été libérée du grand livre du commerce."
 SAU_decree_mbs_gami_localization: "Localisation de la défense GAMI"
 SAU_decree_mbs_gami_localization_desc: "Les armes sortent des chaînes saoudiennes plutôt que étrangères, et les usines d'armement se multiplient."
 SAU_decree_mbs_pif_neom: "Projets NEOM et Frontière"
 SAU_decree_mbs_pif_neom_desc: "Le Fonds d'investissement public finance NEOM et les projets de frontière associés, y compris l'infrastructure de transport nécessaire pour les soutenir."
 SAU_decree_mbs_vision2030_blitz: "Campagne éclair Vision 2030"
 SAU_decree_mbs_vision2030_blitz_desc: "Les ministères et l'investissement public sont dirigés vers la mise en œuvre rapide du programme Vision 2030 du prince héritier."
 SAU_decree_mutaib_capital_garrison: "Grille de garnison de la capitale"
 SAU_decree_mutaib_capital_garrison_desc: "La Garde nationale a établi un cordon de sécurité et un vaste réseau de surveillance à travers Riyad."
 SAU_decree_mutaib_janadriyah_festival: "Festival du patrimoine de Janadriyah"
 SAU_decree_mutaib_janadriyah_festival_desc: "Le festival de Janadriyah promeut le patrimoine tribal et renforce les relations entre le gouvernement et les communautés tribales."
 SAU_decree_mutaib_sang_logistics: "Logistique SANG autonome"
 SAU_decree_mutaib_sang_logistics_desc: "La Garde se nourrit et se ravitaille elle-même, et gaspille bien moins pour le faire."
 SAU_decree_mutaib_sang_procurement: "SANG Aviation et approvisionnement en blindés"
 SAU_decree_mutaib_sang_procurement_desc: "Les contrats de la Garde sont honorés en premier, et à un prix que l'armée régulière n'obtient pas."
 SAU_decree_mutaib_tribal_reserves: "Réserves tribales SANG"
 SAU_decree_mutaib_tribal_reserves_desc: "Les levées tribales remplissent les effectifs de la Garde plus vite que les recruteurs n'auraient pu seuls."
 SAU_decree_salman_cpsa_council: "Conseil des affaires politiques et de sécurité"
 SAU_decree_salman_cpsa_council_desc: "Un seul conseil vise désormais politique et sécurité, et le travail d'état-major avance à la vitesse de celui qui le préside."
 SAU_decree_salman_ksrelief: "Opérations de secours du KS"
 SAU_decree_salman_ksrelief_desc: "KSrelief use d'opérations humanitaires saoudiennes visibles pour fournir de l'aide à l'étranger et améliorer la réputation internationale du Royaume."
 SAU_decree_salman_riyadh_metro_plan: "Plan métropolitain de Riyad"
 SAU_decree_salman_riyadh_metro_plan_desc: "Le programme de construction de la capitale a fixé le tempo des chantiers partout."
 SAU_decree_salman_royal_decrees: "Arrêtés royaux structurels"
 SAU_decree_salman_royal_decrees_desc: "Des décrets royaux réorganisent les ministères et centralisent la mise en œuvre de la politique gouvernementale."
 SAU_decree_salman_spark_park: "Parc énergétique du roi Salman"
 SAU_decree_salman_spark_park_desc: "La fabrication énergétique nationale tire davantage de chaque champ et de chaque parc de stockage."
 SAU_div_construction: "§HDiversification§! - Construction et immobilier"
 SAU_div_construction_desc: "La construction et l'immobilier deviennent des composantes majeures de l'économie non pétrolière de l'Arabie saoudite."
 SAU_div_defence: "§HDiversification§! - industrie de défense"
 SAU_div_defence_desc: "Une industrie d'armement intérieure garde les dépenses de défense dans le Royaume, bâtissant usines et savoir-faire au lieu de seulement les acheter."
 SAU_div_energy: "§HDiversification§! - énergies renouvelables"
 SAU_div_energy_desc: "De grands projets solaires réduisent la demande intérieure d'énergie au pétrole, laissant davantage de brut disponible à l'export et augmentant les recettes de l'État."
 SAU_div_governance: "§HDiversification§! - Gouvernance et État de droit"
 SAU_div_governance_desc: "Des tribunaux plus cohérents et des ministères responsables améliorent le climat des affaires et rendent la politique gouvernementale plus facile à faire appliquer."
 SAU_div_logistics: "§HDiversification§! - Logistique et transport"
 SAU_div_logistics_desc: "L'investissement dans les ports, les chemins de fer et les autoroutes renforce le rôle de l'Arabie saoudite dans le commerce entre l'Asie, l'Afrique et l'Europe."
 SAU_div_social: "§HDiversification§! - développement social"
 SAU_div_social_desc: "Écoles, hôpitaux et logements donnent aux Saoudiens ordinaires une part dans la nouvelle économie, et une raison d'y croire."
 SAU_div_tech: "§HDiversification§! - Technologie et innovation"
 SAU_div_tech_desc: "Parcs de recherche et capital de start-up ensemencent un secteur technologique saoudien qui embauche des diplômés que l'industrie pétrolière n'aurait jamais pu."
 SAU_div_tourism: "§HDiversification§! - Tourisme et divertissement"
 SAU_div_tourism_desc: "Stations, sites patrimoniaux et quartiers de divertissement ouvrent le Royaume à des visiteurs qu'il écartait jadis, et leur argent reste."
 SAU_diversification: "§HDiversification économique§!"
 SAU_diversification_desc: "Le Royaume développe une §Léconomie non pétrolière§! pour réduire son exposition aux variations des prix du pétrole. Chaque pilier achevé, y compris gouvernance, industrie, tourisme, technologie, énergie et développement social, apparaît ici et §Gabaisse la dépendance au pétrole§!."
 SAU_diversification_tt: "[SAU_div_governance_loc][SAU_div_construction_loc][SAU_div_tourism_loc][SAU_div_logistics_loc][SAU_div_tech_loc][SAU_div_defence_loc][SAU_div_energy_loc][SAU_div_social_loc]"
 SAU_doctrine_american: "Doctrine : partenariat américain"
 SAU_doctrine_american_desc: "S'entraîner avec les forces américaines, acheter américain, et combattre à l'américaine. La voie la plus capable - au prix de la dépendance et d'un ressentiment intérieur discret.\n\n§G+10%§! Gain d'expérience de l'armée\n§G+10%§! Gain d'expérience aérienne\n§G+5%§! Organisation de division\n§R-10%§! Gain de pouvoir politique"
 SAU_doctrine_domestic: "Doctrine : autosuffisance nationale"
 SAU_doctrine_domestic_desc: "Bâtir une industrie de défense indigène et une force qui ne doit rien aux fournisseurs étrangers. Fière et autosuffisante, même si elle reste un cran derrière la pointe.\n\n§G+10%§! Production des usines d'armement\n§G+5%§! Taux de récupération de division\n§R-5%§! Gain d'expérience de l'armée"
 SAU_doctrine_gcc: "Doctrine : défense collective du CCG"
 SAU_doctrine_gcc_desc: "Ancrer la défense du Royaume dans le Conseil de coopération du Golfe et le Bouclier de la péninsule. Formidable sur le sol natal, mais lié par les comités et prudent à l'attaque.\n\n§G+15%§! Défense de division sur territoire national\n§G+5%§! Population recrutable\n§R-5%§! Attaque de division"
 SAU_doctrine_nato: "Doctrine : professionnalisme OTAN"
 SAU_doctrine_nato_desc: "Adopter les normes de l'OTAN : un corps d'officiers professionnels, une planification interarmes et un travail d'état-major rigoureux. Un commandement et un contrôle superbes - mais une force coûteuse à entretenir.\n\n§G+10%§! Vitesse de planification\n§G+10%§! Planification max\n§G+5%§! Organisation de division\n§R+5%§! Usage de biens de consommation"
 SAU_eco_bureau_bad: "§RL'économie saoudienne§! - lourdeurs administratives"
 SAU_eco_bureau_bad_desc: "Les entreprises saoudiennes font face à des licences lentes, des approbations qui se recoupent et un clientélisme répandu. Ces barrières bureaucratiques réduisent la valeur de l'investissement public."
 SAU_eco_bureau_good: "§GL'économie saoudienne§! - État allégé"
 SAU_eco_bureau_good_desc: "Des permis délivrés en quelques jours au lieu d'années. Un État allégé permet aux entreprises saoudiennes d'avancer au rythme du marché."
 SAU_eco_capital_bad: "§RL'économie saoudienne§! - fuite des capitaux"
 SAU_eco_capital_bad_desc: "La fortune privée saoudienne siège à Londres, Genève et New York. Les plus riches hommes du Royaume investissent partout sauf chez eux."
 SAU_eco_capital_good: "§GL'économie saoudienne§! - capital national"
 SAU_eco_capital_good_desc: "Le capital saoudien reste et travaille dans le Royaume, finançant usines et projets au lieu de penthouses étrangers."
 SAU_eco_diversify_bad: "§RL'économie saoudienne§! - État rentier"
 SAU_eco_diversify_bad_desc: "Le gouvernement dépend des recettes pétrolières, tandis que beaucoup de citoyens dépendent de l'emploi public et des prestations. Les variations du prix d'une seule denrée affectent donc toute l'économie."
 SAU_eco_diversify_good: "§GL'économie saoudienne§! - diversifiée"
 SAU_eco_diversify_good_desc: "Tourisme, industrie, logistique et finance pèsent désormais vraiment à côté du baril. Le revenu du Royaume ne tient plus à un seul prix."
 SAU_eco_industry_bad: "§RL'économie saoudienne§! - dépendance aux importations"
 SAU_eco_industry_bad_desc: "Presque tout sur une étagère saoudienne arrive par bateau. Hors du secteur pétrolier, le Royaume fabrique peu de ce qu'il consomme."
 SAU_eco_industry_good: "§GL'économie saoudienne§! - industrie nationale"
 SAU_eco_industry_good_desc: "Les usines saoudiennes fournissent désormais ce que le Royaume importait, et le grand livre du commerce le montre."
 SAU_eco_labour_bad: "§RL'économie saoudienne§! - main-d'œuvre expatriée"
 SAU_eco_labour_bad_desc: "Des millions d'expatriés font le travail du Royaume tandis que les jeunes Saoudiens attendent des sinécures gouvernementales qui n'existent plus."
 SAU_eco_labour_good: "§GL'économie saoudienne§! - main-d'œuvre saoudienne"
 SAU_eco_labour_good_desc: "Les Saoudiens occupent les emplois saoudiens, de l'atelier à la direction. La masse salariale reste dans le Royaume."
 SAU_econ_industry_first: "§HModèle économique§! - l'industrie d'abord"
 SAU_econ_industry_first_desc: "Le Royaume donne la priorité à l'acier, à la métallurgie, à la fabrication et aux autres industries lourdes. Cela élève la production industrielle mais exige davantage de biens de consommation et de main-d'œuvre."
 SAU_econ_mixed: "§HModèle économique§! - une voie mixte"
 SAU_econ_mixed_desc: "Le Royaume développe industrie et services en même temps. La croissance est moins concentrée que sous une stratégie à un seul secteur, rendant l'économie plus résiliente."
 SAU_econ_services: "§HModèle économique§! - les services d'abord"
 SAU_econ_services_desc: "Le Royaume privilégie la banque, la logistique, la finance et le tourisme comme sources d'emploi saoudien qualifié. Cela améliore l'économie de la connaissance mais fournit moins de capacité industrielle."
 SAU_economic_cities: "Initiative des villes économiques"
 SAU_economic_cities_desc: "King Abdallah Economic City et d'autres centres urbains planifiés attirent l'investissement dans les bureaux, l'industrie et les services. Ces villes conçues à dessein servent de moteurs de croissance économique non pétrolière."
 SAU_economy: "§HL'économie saoudienne§!"
 SAU_economy_desc: "L'économie saoudienne de l'an 2000 : §Lriche en pétrole mais non diversifiée§!, alourdie par la fuite des capitaux, la dépendance aux importations, la bureaucratie, le recours à la main-d'œuvre expatriée et l'addiction à une seule matière première. Chaque focus de l'§Harbre économique§! répare une faiblesse et bâtit la base industrielle SABIC. Achevez l'arbre et un §Hlourd malus§! devient une §Géconomie équilibrée et diversifiée§!.\n\n§YCi-dessous : chaque sous-système économique, rouge tant qu'il est brisé, vert une fois réformé.§!"
 SAU_economy_tt: "[SAU_eco_capital_loc][SAU_eco_industry_loc][SAU_eco_bureau_loc][SAU_eco_labour_loc][SAU_eco_diversify_loc][SAU_eco_model_loc][SAU_eco_cities_loc]"
 SAU_faisalite_balanced: "L'équilibre faisalite"
 SAU_faisalite_balanced_desc: "Le Royaume combine l'autosuffisance intérieure et un engagement limité à l'étranger sans faire de l'un ou l'autre sa doctrine fixe. Maintenir cet équilibre devient plus difficile à mesure que les engagements étrangers s'accroissent."
 SAU_faisalite_closed_schools: "Les écoles sont fermées"
 SAU_faisalite_closed_schools_desc: "Les programmes étrangers sont partis et rien n'a encore été écrit pour les remplacer. Une cohorte perdra plusieurs années dans le vide."
 SAU_faisalite_conviction_decided: "Cercle Faisalite : Décidé"
 SAU_faisalite_conviction_dormant: "Cercle Faisalite : Dormant"
 SAU_faisalite_conviction_gathering: "Cercle Faisalite : Rassemblement"
 SAU_faisalite_conviction_insistent: "Cercle Faisalite : Insistant"
 SAU_faisalite_conviction_stirring: "Cercle Faisalite : Remuer"
 SAU_faisalite_creditor_of_the_ummah: "Créancier de l'Oumma"
 SAU_faisalite_creditor_of_the_ummah_desc: "Des prêts saoudiens à long terme aux pays musulmans donnent à Riyad de l'influence sur les gouvernements débiteurs. Le report du remboursement renforce leur dépendance à court terme et leur bonne volonté."
 SAU_faisalite_foreign_endowments: "Dotations à l'étranger"
 SAU_faisalite_foreign_endowments_desc: "L'argent saoudien dote chaires et bibliothèques dans une douzaine d'universités étrangères, et les étudiants saoudiens y entrent sans opposition."
 SAU_faisalite_import_rationing: "Rationnement des importations"
 SAU_faisalite_import_rationing_desc: "Les licences sont délivrées au compte-gouttes et les files se forment devant le ministère. Ce que le Royaume ne peut acheter, il doit le trouver chez lui, et il en trouve plutôt plus que prévu."
 SAU_faisalite_interventionist_dominant: "§RInterventionnisme ascendant§!"
 SAU_faisalite_interventionist_dominant_desc: "Sommets, subventions et conseillers militaires ont fait de l'Arabie saoudite une puissance centrale du monde musulman. Cette influence rend aussi le Royaume responsable de litiges coûteux au-delà de ses frontières."
 SAU_faisalite_interventionist_leaning: "§RTendant vers l'interventionnisme§!"
 SAU_faisalite_interventionist_leaning_desc: "Le Royaume dépense de nouveau à l'étranger et s'y fait entendre. Fayçal reconnaîtrait la direction, sinon encore l'échelle."
 SAU_faisalite_isolationist_dominant: "§OIsolationnisme ascendant§!"
 SAU_faisalite_isolationist_dominant_desc: "L'Arabie saoudite s'est fermée à la plupart des influences et obligations étrangères. Cela préserve son indépendance mais réduit l'accès au savoir extérieur et la laisse diplomatiquement isolée."
 SAU_faisalite_isolationist_leaning: "§OTendant vers l'isolationnisme§!"
 SAU_faisalite_isolationist_leaning_desc: "Le Royaume se replie. Moins de mains étrangères, moins d'obligations étrangères, et un corps diplomatique qui a de moins en moins à faire."
 SAU_faisalite_labour_shortage: "Pénurie de main-d'œuvre"
 SAU_faisalite_labour_shortage_desc: "La moitié des échafaudages du Royaume restent vides. Les hommes qui les tenaient sont rentrés, et ceux qui devaient les remplacer ne sont pas arrivés."
 SAU_faisalite_nationalised_management: "Gestion nationalisée"
 SAU_faisalite_nationalised_management_desc: "Les managers étrangers sont partis et leurs remplaçants apprennent le métier sur le tas. Les usines tournent encore, d'une certaine façon."
 SAU_faisalite_officers_abroad: "Le corps des officiers à l'étranger"
 SAU_faisalite_officers_abroad_desc: "Le meilleur de l'état-major conseille l'armée de quelqu'un d'autre. Leurs propres formations sentent l'absence."
 SAU_faisalite_street_movement: "La rue se souvient de Fayçal"
 SAU_faisalite_street_movement_desc: "Un mouvement populaire présente le roi Fayçal comme un modèle d'indépendance saoudienne, mettant l'accent sur l'embargo pétrolier et sa résistance à la pression occidentale. Son récit simplifié de son règne s'est répandu des mosquées aux campus universitaires et soutient désormais un mouvement d'opposition organisé."
 SAU_forces_modernized: "Forces armées modernisées"
 SAU_forces_modernized_desc: "Une armée pleinement moderne et professionnelle — l'égale de n'importe laquelle dans la région et un véritable contrepoids à l'Iran."
 SAU_forces_modernizing: "Modernisation des forces"
 SAU_forces_modernizing_desc: "Formation, doctrine et équipement rattrapent les normes occidentales. Les forces égalent désormais leurs voisins."
 SAU_forces_reforming: "Forces en réforme"
 SAU_forces_reforming_desc: "Les premières réformes prennent et le pire des anciennes faiblesses s'estompe. Continuez à moderniser."
 SAU_forces_unmodernized: "Forces armées non modernisées"
 SAU_forces_unmodernized_desc: "Des décennies de recours aux sous-traitants étrangers et à une doctrine dépassée ont laissé les forces armées impropres. Utilisez la décision §YModerniser les forces armées§! pour les réformer, étape par étape."
 SAU_fortified_kingdom: "Forteresse d'Arabie"
 SAU_fortified_kingdom_desc: "Bases durcies, défenses aériennes en couches et garnisons côtières améliorent la capacité de l'Arabie saoudite à encaisser une attaque iranienne."
 SAU_french_investment_pact_FRA: "Pacte d'investissement saoudo-français"
 SAU_french_investment_pact_FRA_desc: "Un pacte adossé à l'État ouvre les marchés saoudiens à l'industrie française et amène le capital du Golfe en France."
 SAU_grievance_bitter: "Corps des officiers : Amer"
 SAU_grievance_brink: "Corps des officiers : au bord du gouffre"
 SAU_grievance_contained: "Corps des officiers : confiné"
 SAU_grievance_mutinous: "Corps des officiers : mutin"
 SAU_grievance_restive: "Corps des officiers : rétif"
 SAU_guardian_of_palestine: "Gardien de la Palestine"
 SAU_guardian_of_palestine_desc: "En défendant la cause palestinienne, le Royaume a gagné du prestige dans le monde musulman, prêtant au trône une légitimité au dedans comme au dehors."
 SAU_gulf_war_lessons: "Leçons de la guerre du Golfe"
 SAU_gulf_war_lessons_desc: "La guerre du Golfe de 1991 a exposé de graves faiblesses dans l'équipement, la doctrine et le commandement saoudiens. L'état-major étudie des modèles concurrents de réforme militaire mais n'en a pas encore choisi un.\n\n§G+5%§! Gain d'expérience de l'armée\n§G+5%§! Vitesse de planification\n\n§YLancez la décision « Manœuvres : leçons du Golfe » pour choisir une doctrine.§!"
 SAU_hajj_management_01: "Gardien des Deux Saintes Mosquées"
 SAU_hajj_management_01_desc: "En tant que gardiens de La Mecque et de Médine, le gouvernement saoudien supervise le pèlerinage annuel du hajj, accueillant environ deux millions de musulmans du monde entier chaque année. Le pèlerinage génère d'importantes recettes par le tourisme, le transport et l'hôtellerie, tout en octroyant au Royaume un prestige religieux sans égal dans le monde musulman."
 SAU_hormuz_shield: "Le bouclier d'Ormuz"
 SAU_hormuz_shield_desc: "Les escortes navales saoudiennes protègent les pétroliers qui passent le détroit d'Ormuz et réduisent la capacité de l'Iran à perturber les livraisons de pétrole."
 SAU_IMEC_india_deal_new: "Le corridor IMEC"
 SAU_IMEC_india_deal_new_desc: "Le corridor Inde–Moyen-Orient–Europe canalise le commerce indien par les ports et le rail saoudiens. Le Royaume encaisse les péages d'une nouvelle route de la soie."
 SAU_IMEC_india_deal_new_loc: "\n§H[RAJ.GetFlag] Corridor économique Inde–Moyen-Orient–Europe§! (IMEC) [SAU.GetFlag]\nVitesse de construction : §G+5.00%§!\nGain de carburant par combustibles fossiles : §G+3.00%§!\nMultiplicateur des §Hrevenus d'exportation de ressources§! : §G+1.50%§!\n"
 SAU_India_one_IMEC_india_deal: "[RAJ.GetFlag] §HCorridor économique Inde–Moyen-Orient–Europe§![SAU.GetFlag] (IMEC)"
 SAU_India_one_IMEC_india_deal_desc: "Le corridor économique Inde–Moyen-Orient–Europe relie les ports indiens via le Golfe aux marchés européens par le rail et la mer. L'Inde se tient à la porte orientale du corridor et profite de chaque cargaison."
 SAU_iraq_border_defense: "Défenses de la frontière nord"
 SAU_iraq_border_defense_desc: "L'armée est retranchée le long de la frontière irakienne, prête à toute répétition de 1990. +10 % de défense contre l'Irak. Se lève une fois Saddam parti."
 SAU_iraq_pipeline_t1: "Pipeline Europe (niveau I)"
 SAU_iraq_pipeline_t1_desc: "Le pétrole saoudien s'écoule vers le nord à travers l'Irak vers la Turquie et le marché européen que Moscou garde si jalousement. §GRevenu supplémentaire : 2,25 Md $§! d'exports par oléoduc, contre §RDépense supplémentaire : 1,00 Md $§! de droits de transit aux pays que la ligne traverse — un net de §G+1,25 Md $§! par semaine. Le sabotage fait descendre la ligne d'un palier, coupant les deux ; une ligne de palier 1 rompue ferme la route."
 SAU_iraq_pipeline_t2: "Pipeline Europe (niveau II)"
 SAU_iraq_pipeline_t2_desc: "Le pétrole saoudien s'écoule vers le nord à travers l'Irak vers la Turquie et le marché européen que Moscou garde si jalousement. §GRevenu supplémentaire : 2,75 Md $§! d'exports par oléoduc, contre §RDépense supplémentaire : 1,15 Md $§! de droits de transit aux pays que la ligne traverse — un net de §G+1,60 Md $§! par semaine. Le sabotage fait descendre la ligne d'un palier, coupant les deux ; une ligne de palier 1 rompue ferme la route."
 SAU_iraq_pipeline_t3: "Pipeline Europe (niveau III)"
 SAU_iraq_pipeline_t3_desc: "Le pétrole saoudien s'écoule vers le nord à travers l'Irak vers la Turquie et le marché européen que Moscou garde si jalousement. §GRevenu supplémentaire : 3,25 Md $§! d'exports par oléoduc, contre §RDépense supplémentaire : 1,25 Md $§! de droits de transit aux pays que la ligne traverse — un net de §G+2,00 Md $§! par semaine. Le sabotage fait descendre la ligne d'un palier, coupant les deux ; une ligne de palier 1 rompue ferme la route."
 SAU_islamic_leadership: "Chef du monde islamique"
 SAU_islamic_leadership_desc: "La garde saoudienne de La Mecque et de Médine et son rôle dans les grands sommets islamiques donnent à Riyad une influence substantielle dans le monde musulman."
 SAU_israel_tech_partnership: "Silicium et sable"
 SAU_israel_tech_partnership_desc: "Les accords de Riyad combinent l'investissement saoudien et la technologie israélienne et soutiennent la recherche conjointe dans les deux pays."
 SAU_junta_accepted: "Le Conseil : accepté"
 SAU_junta_contested: "Le Conseil : contesté"
 SAU_junta_illegitimate: "Le Conseil : illégitime"
 SAU_junta_rejected: "Le Conseil : rejeté"
 SAU_junta_tolerated: "Le Conseil : toléré"
 SAU_laf_offensive: "Opération Cedar Resolve"
 SAU_laf_offensive_desc: "Le financement et l'équipement saoudiens ont accru la capacité et la volonté de l'armée libanaise de mener des opérations offensives contre le Hezbollah."
 SAU_national_water_pride_minus1: "§HSEaux souveraines§! - §YDouteux§!"
 SAU_national_water_pride_minus1_desc: "À 35-44 % de stabilité, la confiance publique dans le programme hydrique §Ldétenu par les Saoudiens§! s'affaiblit. Cela provoque une §Ypetite perte de légitimité§! pour la dynastie."
 SAU_national_water_pride_minus2: "§HEaux souveraines§! - §RTendu§!"
 SAU_national_water_pride_minus2_desc: "Une faible stabilité a accru les critiques privées du §Lprogramme hydrique national§!. Ses piètres performances entament la réputation de la dynastie."
 SAU_national_water_pride_minus3: "§HEaux souveraines§! - §RContre-productif§!"
 SAU_national_water_pride_minus3_desc: "Le programme hydrique est devenu un exemple marquant de mauvaise gestion gouvernementale. Les pénuries persistantes provoquent une §Rgrave perte de soutien§! pour la dynastie."
 SAU_national_water_pride_minus4: "§HSEaux souveraines§! - §RCatastrophique§!"
 SAU_national_water_pride_minus4_desc: "Dans des conditions d'§Rinstabilité extrême§!, les pénuries d'eau ont gravement endommagé la légitimité de la §Hmaison des Saoud§!. Seule une stabilité restaurée ou la chute de la dynastie mettra fin à cette pénalité."
 SAU_national_water_pride_neutral: "§HEaux souveraines§! - §YStable§!"
 SAU_national_water_pride_neutral_desc: "À environ 50 % de stabilité, le programme hydrique national n'apporte ni bénéfice politique ni pénalité. Un changement de stabilité le fera passer à un palier positif ou négatif."
 SAU_national_water_pride_plus1: "§HEaux souveraines§! - §GSatisfait§!"
 SAU_national_water_pride_plus1_desc: "Une stabilité adéquate et un service d'eau fiable préservent la réputation de la dynastie et procurent un bénéfice politique §Gmodeste§!."
 SAU_national_water_pride_plus2: "§HEaux souveraines§! - §GFlorissant§!"
 SAU_national_water_pride_plus2_desc: "Une forte stabilité et le fonctionnement fiable du système de dessalement §Ldétenu par les Saoudiens§! démontrent la compétence du gouvernement et améliorent le respect de la §Hmaison des Saoud§!."
 SAU_national_water_pride_plus3: "§HEaux souveraines§! - §GConfiant§!"
 SAU_national_water_pride_plus3_desc: "Une haute stabilité a fait du programme hydrique national une §Hsource de prestige intérieur§!. La demande d'expertise §LKAUST§! à l'étranger et les retours financiers du programme procurent des bénéfices supplémentaires."
 SAU_national_water_pride_plus4: "§HEaux souveraines§! - §GTriomphant§!"
 SAU_national_water_pride_plus4_desc: "Au plus haut niveau de stabilité, le programme hydrique §Ldétenu par les Saoudiens§! est largement considéré comme une grande réalisation nationale. Son succès donne à la §Hmaison des Saoud§! le bénéfice de légitimité maximal du programme."
 SAU_nda_free_press: "Une presse libre"
 SAU_nda_free_press_loc: "[SAU.GetFlag]Une presse libre\n§HGain de pouvoir politique :§! §G+5.00%§! \n§HDéfense contre l'influence étrangère :§! §G+20.00%§!\n\n"
 SAU_nda_free_world: "Un membre du monde libre"
 SAU_nda_free_world_loc: "[SAU.GetFlag]Un membre du monde libre\n§HOpinion commerciale :§! §G+15.00%§!\n§HGain d'opinion mensuel :§! §G+20.00%§!\n\n"
 SAU_nda_knowledge_economy: "Une économie du savoir"
 SAU_nda_knowledge_economy_loc: "[SAU.GetFlag]Une économie de la connaissance\n§HVitesse de recherche :§! §G+5.00%§!\n§HStabilité :§! §G+3.00%§!\n\n"
 SAU_nda_open_market: "Marchés ouverts"
 SAU_nda_open_market_loc: "[SAU.GetFlag]Marchés ouverts\n§HBiens de consommation :§! §G-10.00%§!\n§HCoût des investissements étrangers :§! §G-5.00%§!\n§HRetour sur investissement :§! §G+5.00%§!\n\n"
 SAU_neom_aqaba_zone: "Zone économique NEOM-Aqaba"
 SAU_neom_aqaba_zone_desc: "La mégacité saoudienne de NEOM et le port jordanien d'Aqaba fonctionnent comme une zone économique transfrontalière unique, accélérant la construction et alimentant le Trésor."
 SAU_oil_defend_price_idea: "Défendre le prix"
 SAU_oil_defend_price_idea_desc: "L'Arabie saoudite a réduit la production pour soutenir le prix mondial du pétrole. Cela améliore le revenu par baril mais sacrifie des parts de marché aux producteurs qui maintiennent leur production."
 SAU_oil_dependence_t1: "§GL'économie pétrolière§! - diversifiée"
 SAU_oil_dependence_t1_desc: "§HDépendance au pétrole : §!§Y[?oil_dependence|0]§!§H / 100§!\n§RChange automatiquement tous les 3 mois§!\n\nUne économie moderne et diversifiée. Le pétrole n'est qu'un export parmi d'autres - le Royaume est §Grésilient§! face à ce que le prix du brut peut faire. Vision 2030, atteinte."
 SAU_oil_dependence_t2: "§YL'économie pétrolière§! - large assise"
 SAU_oil_dependence_t2_desc: "§HDépendance au pétrole : §!§Y[?oil_dependence|0]§!§H / 100§!\n§RChange automatiquement tous les 3 mois§!\n\nL'industrie, les services et la technologie pèsent désormais vraiment. Un choc pétrolier est survivable, pas catastrophique."
 SAU_oil_dependence_t3: "§YL'économie pétrolière§! - en diversification"
 SAU_oil_dependence_t3_desc: "§HDépendance au pétrole : §!§Y[?oil_dependence|0]§!§H / 100§!\n§RChange automatiquement tous les 3 mois§!\n\nL'économie s'élargit. Le pétrole reste le plus grand pilier, mais plus le seul qui compte."
 SAU_oil_dependence_t4: "§RL'économie pétrolière§! - dépendante du pétrole"
 SAU_oil_dependence_t4_desc: "§HDépendance au pétrole : §!§Y[?oil_dependence|0]§!§H / 100§!\n§RChange automatiquement tous les 3 mois§!\n\nLes secteurs hors pétrole croissent, mais le brut paie encore presque tout. Un krach des prix ferait encore mal - très mal."
 SAU_oil_dependence_t5: "§RL'économie pétrolière§! - pétro-État total"
 SAU_oil_dependence_t5_desc: "§HDépendance au pétrole : §!§Y[?oil_dependence|0]§!§H / 100§!\n§RChange automatiquement tous les 3 mois§!\n\nLe Royaume vit et meurt par le baril. Le pétrole est §Gpresque tout§! le budget - immensément profitable, mais §Rdangereusement exposé§! à tout effondrement du prix mondial.\n§YLa dépendance au pétrole ne change que par vos focuses et décisions - les choix pétroliers la haussent, la diversification la baisse. Le Royaume commence profondément dépendant ; seule une réforme soutenue la fait descendre, et elle reste où vous la laissez.§!\n§YLa dépendance au pétrole ne change que par vos focalisations et décisions — les choix pétroliers l'élèvent, la diversification l'abaisse. Le Royaume commence profondément dépendant ; seule une réforme soutenue la fait baisser, et elle reste où vous la laissez.§!"
 SAU_oil_embargoed: "§ROEmbargo sur le pétrole§!"
 SAU_oil_embargoed_desc: "L'Arabie saoudite et ses partenaires de l'OPEP ont coupé le pétrole. Files d'essence, arrêts d'usines et prix en flèche saisissent l'économie jusqu'à la levée de l'embargo."
 SAU_oil_for_security_pact: "Pétrole contre sécurité"
 SAU_oil_for_security_pact_desc: "Le Royaume alimente les marchés américains en pétrole, et Washington souscrit la sécurité saoudienne. L'arrangement ancre le riyal, le dollar et la maison des Saoud."
 SAU_oil_for_security_pact_loc: "[USA.GetFlag]Pétrole contre sécurité\n§HMultiplicateur de recettes d'exportation d'énergies fossiles :§! §G+5.00%§!\n"
 SAU_oil_for_security_pact_USA: "Pétrole contre sécurité"
 SAU_oil_for_security_pact_USA_desc: "Riyad garantit le flux de pétrole vers les marchés américains : un carburant bon marché et fiable en échange du parapluie de sécurité américain."
 SAU_oil_market_share_idea: "Défendre la part de marché"
 SAU_oil_market_share_idea_desc: "L'Arabie saoudite maintient une haute production et accepte des prix plus bas pour préserver sa part du marché pétrolier. Ses bas coûts d'extraction lui permettent de durer plus longtemps que les producteurs plus chers."
 SAU_oil_price_collapse_idea: "Effondrement du prix du pétrole"
 SAU_oil_price_collapse_idea_desc: "Les prix du pétrole sont bien en deçà du niveau assumé par le budget de l'État. Les recettes d'export ont chuté tandis que les dépenses sociales restent élevées, forçant le gouvernement à puiser dans ses réserves."
 SAU_OPEC_Russia_deal_new: "Coordination OPEP+"
 SAU_OPEC_Russia_deal_new_desc: "Riyad et Moscou fixent ensemble les quotas de production. Deux superpuissances pétrolières à la barre d'un seul marché."
 SAU_OPEC_Russia_deal_new_loc: "\n§H[SAU.GetFlag]Accord OPEP+[SOV.GetFlag]§!\n§HMultiplicateur des recettes d'exportation d'énergies fossiles :§! §G+5.00%§!\n"
 SAU_pipeline_empire: "Carrefour de l'énergie"
 SAU_pipeline_empire_desc: "L'Arabie saoudite a désormais des routes d'export pétrolier vers trois mers et ne dépend plus du détroit d'Ormuz comme unique débouché majeur."
 SAU_pipeline_transit_IRQ_t1: "Transit par pipeline saoudien (niveau I)"
 SAU_pipeline_transit_IRQ_t1_desc: "Le pétrole saoudien traverse l'Irak, et les droits de transit gonflent le Trésor. L'oléoduc élève la production pétrolière de la nation. §GRevenu supplémentaire : 1,00 Md $§!"
