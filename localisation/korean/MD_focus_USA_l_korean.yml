 usa_economic_events.406.t: "11월의 나흘"
 usa_economic_events.406.d: "오픈AI 이사회는 금요일에 샘 올트먼을 해임하고 발표 몇 분 전에야 마이크로소프트에 통보했습니다. 협상 테이블 반대편에는 130억 달러와 모델 로드맵 전체가 걸려 있었습니다. 월요일이 되자 거의 모든 오픈AI 직원이 그와 함께 떠나겠다는 서한에 서명했고, 그를 해임한 이사들은 자신들의 후임 조건을 협상하고 있었습니다. 레드먼드의 상업적 판단은 이런 일을 예고 없이 벌일 수 있는 지배구조를 가진 파트너는 파트너가 아니라는 것입니다. 반대 해석은 그 서한이 자산은 정관이 아니라 사람임을 증명했고, 사람은 채용할 수 있다는 것입니다."
 usa_economic_events.406.a: "그의 복귀를 지지하고 이사회 의석을 확보한다"
 usa_economic_events.406.b: "그와 서명자들을 레드먼드로 영입한다"
 usa_economic_events.500.t: "국경 감시탑 제안"
 usa_economic_events.500.d: "올해 오렌지 카운티에서 팔머 러키와 팔란티어 출신 몇 명이 창립한 안두릴 인더스트리즈는 10년짜리 통합 계약 대신 자율 감시탑과 소프트웨어 하나로 국경 구간을 감시할 수 있다고 말합니다. 정확히 같은 시도였던 SBInet은 10억 달러를 쓰고 2011년에 취소되었습니다. 안두릴은 감시탑을 먼저 만들고 나중에 판매하겠다고 제안하는데, 이는 국토안보부가 무엇이든 구매하는 방식이 아닙니다."
 usa_economic_events.500.a: "감시탑에 자금을 대고 먼저 만들게 한다"
 usa_economic_events.500.b: "국경 감시를 기존 정규 사업 안에 둔다"
 usa_economic_events.501.t: "표적보다 저렴하게"
 usa_economic_events.501.d: "기지 상공에 소형 드론이 나타나고 있으며, 기존의 대응책은 격추하는 모든 것을 합친 것보다 비싼 지대공 미사일입니다. 안두릴의 앤빌은 다른 드론에 충돌하는 드론이고 래티스는 그것들을 찾아내는 소프트웨어입니다. 이를 구매한다는 것은 각 군이 어떻게 분류할지 합의하지 못한 위협에 대해 누구도 인증하지 않은 요격체를 받아들인다는 뜻입니다."
 usa_economic_events.501.a: "저렴한 요격체를 구매한다"
 usa_economic_events.501.b: "이미 자금을 대고 있는 다층 방공으로 드론에 대응한다"
 usa_economic_events.502.t: "공장을 살 것인가, 부품을 살 것인가"
 usa_economic_events.502.d: "안두릴은 에어리어-I와 그 알티우스 발사 효과체를 인수했으며, 남의 것을 통합하는 대신 기체, 자율 스택, 생산 라인을 직접 소유하기를 원합니다. 수직 통합은 주계약자들과 가격으로 경쟁할 수 있는 유일한 방법입니다. 이는 또한 대량으로 무언가를 제조해 본 적도 없는 방위 스타트업이 제조업체로서 자금을 지원받기를 요청한다는 뜻이기도 합니다."
 usa_economic_events.502.a: "안두릴을 제조업체로 지지한다"
 usa_economic_events.502.b: "기존 공급 기반에서 구매하는 통합업체로 남긴다"
 usa_economic_events.503.t: "인도받는 우크라이나"
 usa_economic_events.503.d: "알티우스-600 배회 탄약과 안두릴의 대드론 장비가 재고 지원 패키지에 포함되어 우크라이나로 향하고 있으며, 이를 사용하는 부대들은 어떤 미국 시험장보다 빠르게 결과를 보고하고 있습니다. 동쪽으로 물량을 밀어 넣으면 다른 누구도 갖지 못한 전투 데이터를 얻습니다. 그러나 각 군이 교리 작성을 끝내지 못한 재고를 소모하게 됩니다."
 usa_economic_events.503.a: "우크라이나에 물량을 보내고 데이터를 얻는다"
 usa_economic_events.503.b: "재고를 미국 부대용으로 보유한다"
 usa_economic_events.504.t: "주계약자 없는 전투기"
 usa_economic_events.504.d: "공군은 협동 전투기(CCA) 1차 사업에 안두릴의 퓨리와 제너럴 아토믹스를 선정하고 록히드 마틴, 보잉, 노스롭 그루먼은 제외했습니다. 10년 전에는 존재하지도 않았던 기업이 이제 전투기를 만들고 있습니다. 주계약자들은 다른 모든 것을 만드는 산업 기반을 조달에 관한 주장을 입증하기 위해 고사시켜서는 안 된다고 주장합니다."
 usa_economic_events.504.a: "신생 기업이 사업을 맡게 한다"
 usa_economic_events.504.b: "기존 주계약자들이 사업을 계속 이끌게 한다"
 usa_economic_events.505.t: "안두릴이 된 것"
 usa_economic_events.505.d: "감시탑, 요격체, 공장, 그리고 전투기 한 기로 이어진 10년은 안두릴이 무엇인지, 그리고 미국이 무기를 구매하는 방식을 무엇이 바꿨는지를 매듭지었습니다. 무기고를 소유하는지 빌리는지, 그리고 주계약자들이 여전히 국방부와 제조자들 사이에 서 있는지의 문제입니다."
 usa_economic_events.505.a: "우리가 온전히 소유한 무기고"
 usa_economic_events.505.b: "자격이 되는 누구에게나 판매하는 상업 무기고"
 usa_economic_events.505.c: "남의 공장을 쓰는 소프트웨어 주계약자"
 usa_economic_events.505.e: "벤처 자금을 받은 또 하나의 공급업체"
 USA_anduril_autonomous_arsenal: "자율 무기고"
 USA_anduril_autonomous_arsenal_desc: "안두릴은 미국 땅에서 자체 기체, 자율 체계, 생산 라인을 구축하며, 국방부는 통합 사업이 아니라 완성된 체계를 구매합니다. 국가에 속한 생산 능력은 공급업체가 가격을 다시 정할 수 없습니다."
 USA_anduril_merchant_arsenal: "상업 무기고"
 USA_anduril_merchant_arsenal_desc: "안두릴은 공장을 소유하지만 동맹국과 국내를 가리지 않고 자격을 갖춘 모든 구매자에게 판매합니다. 물량이 생산 라인을 가동 상태로 유지하고 수출 관계를 열어 두는 대신, 우선권에 대한 어떤 주장도 포기합니다."
 USA_anduril_software_prime: "소프트웨어 주계약자"
 USA_anduril_software_prime_desc: "안두릴은 공장을 소유하지 않고 사업을 따냈으므로 래티스와 자율 스택은 남이 만든 하드웨어 위에서 구동됩니다. 빠르고 저렴하지만, 자기 주주에게 책임을 지는 공급업체들에 의존합니다."
 USA_anduril_venture_supplier: "벤처 자금 공급업체"
 USA_anduril_venture_supplier_desc: "안두릴은 여전히 많은 업체 중 하나이며, 기존 주계약자들이 여전히 이끄는 사업에 부품을 판매합니다. 엔지니어링은 실재하지만 영향력은 그렇지 못합니다."
