 CRO_political.1.t: "헤이그, 고토비나 기소"
 CRO_political.1.d: "ICTY가 폭풍 작전 중 저질러진 범죄 혐의로 안테 고토비나 장군에 대한 기소장을 공개했습니다. 그는 체포가 이뤄지기 전에 종적을 감췄습니다. 참전 용사 단체들이 항의를 위해 모이고 있으며, 브뤼셀은 재판소와의 협력이 유럽 통합의 조건임을 분명히 했습니다."
 CRO_political.1.a: "재판소와 협력해야 한다"
 CRO_political.1.b: "크로아티아는 자국의 영웅을 인도하지 않는다"
 CRO_political.2.t: "고토비나, 테네리페에서 체포"
 CRO_political.2.d: "스페인 경찰이 4년간의 도피 끝에 카나리아 제도의 한 호텔 식당에서 안테 고토비나를 체포했습니다. 자그레브가 제공한 정보가 그의 추적에 도움이 되었습니다. 참전 용사들은 중앙 광장에서 촛불을 밝히고 있지만, 유럽으로 가는 길의 마지막 장애물은 제거되었습니다."
 CRO_political.2.a: "고통스럽지만 필요한 조치"
 CRO_political.3.t: "유럽 연합 가입 신청"
 CRO_political.3.d: "이비차 라찬 총리가 아테네에서 유럽 연합 가입을 위한 크로아티아의 신청서를 공식 제출했습니다. 정부는 북쪽 이웃 국가들 사이에서 이미 진행 중인 가입 물결을 따라잡고, 지난 10년의 전쟁을 확실히 과거로 돌리기를 희망하고 있습니다."
 CRO_political.3.a: "우리의 자리는 유럽에 있다"
 CRO_political.4.t: "가입 협상 개시"
 CRO_political.4.d: "수석 검사가 크로아티아의 재판소에 대한 전면적인 협력을 확인한 후, 유럽 연합이 가입 협상을 개시했습니다. 아키(acquis)에 비춘 크로아티아 법률의 심사가 즉시 시작되며, 외국 투자자들도 주목하고 있습니다."
 CRO_political.4.a: "심사가 시작된다"
 CRO_political.5.t: "부쿠레슈티 정상회의에서의 초청"
 CRO_political.5.d: "부쿠레슈티에서 열린 나토 정상회의가 크로아티아와 알바니아에 공식 초청장을 보냈습니다. 가입 의정서는 올해 안에 서명될 예정입니다. 이 초청은 10년에 걸친 국방 개혁에 대한 보상이며 크로아티아를 서방 동맹에 확고히 정박시킵니다."
 CRO_political.5.a: "협상 테이블의 한자리"
 CRO_political.6.t: "이나-MOL 스캔들"
 CRO_political.6.d: "이보 사나데르 전 총리가 기소를 피해 도피하던 중 오스트리아에서 체포되었습니다. 수사관들은 그가 국영 석유 회사 이나의 경영권을 양도하는 대가로 헝가리 석유 회사 MOL로부터 뇌물을 받았다고 주장합니다. 이 사건은 집권당의 최고위층에까지 이르고 있습니다."
 CRO_political.6.a: "누구도 법 위에 있지 않다"
 CRO_political.6.b: "피해를 최소화하라"
 CRO_political.7.t: "고토비나, 항소심에서 무죄"
 CRO_political.7.d: "ICTY 항소심 재판부가 안테 고토비나와 믈라덴 마르카치 장군의 유죄 판결을 뒤집고 즉시 석방을 명령했습니다. 자그레브 중앙 광장은 그들의 귀향을 환영하는 군중으로 가득 찼습니다. 베오그라드와 바냐루카에서는 이 판결이 격렬한 분노를 불러일으켰습니다."
 CRO_political.7.a: "장군들이 돌아온다"
 CRO_political.8.t: "유럽 연합 가입 환영"
 CRO_political.8.d: "자정을 기해 크로아티아는 유럽 연합의 28번째 회원국이 되어, 여섯 정권을 거치며 이어진 12년간의 가입 절차를 마무리했습니다. 슬로베니아와 헝가리 국경의 세관 초소는 철거되고 있습니다."
 CRO_political.8.a: "유럽의 미래"
 CRO_political.9.t: "솅겐과 유로"
 CRO_political.9.d: "크로아티아는 같은 날 유로를 도입하고 솅겐 지역에 가입하여, 두 단계를 한꺼번에 완료한 최초의 회원국이 되었습니다. 나머지 블록과의 국경 통제는 사라졌고 쿠나는 역사 속으로 사라집니다. 관광 산업은 기록적인 성수기를 기대하고 있습니다."
 CRO_political.9.a: "마침내 완전히 통합되었다"
 CRO_political.10.t: "헤르체그-보스니아, 독립 선언"
 CRO_political.10.d: "헤르체고비나의 크로아티아계 주들이 자치 헤르체그-보스니아를 선포하고 사라예보와의 관계를 끊었습니다. 자그레브는 이 분리 세력을 어디까지 지지할지 결정해야 합니다."
 CRO_political.10.a: "헤르체그-보스니아를 승인한다"
 CRO_political.10.b: "은밀히 지원을 보낸다"
