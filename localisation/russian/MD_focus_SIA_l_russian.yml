 SIA_reform_pressure_decrease_tt: "§GДавление реформирования [?reform_delta|0+]§! (теперь §Y[?ROOT.SIA_reform_pressure|0]§!/100)"
 SIA_engage_reform_movement: "Присоединяйтесь к движению за реформы!"
 SIA_engage_reform_movement_desc: "Пригласите за стол переговоров студенческие союзы и реформаторскую фракцию, профинансируйте программу трудоустройства молодежи, пусть камеры запечатлеют рукопожатие. Улицы затихают. Участие движения в переговорах также делает его респектабельным, и движение «Двигайся вперед» от этого выигрывает."
 SIA_rural_development_package: "Пакет мер по развитию сельских районов"
 SIA_rural_development_package_desc: "Сельские фонды, минимальная цена на рис, списание сельскохозяйственных долгов и новая дорога к районному центру. Один платеж из казны гарантирует год, в течение которого сельская местность перестанет прислушиваться к популистской машине."
 SIA_rural_package_active: "Пакет мер по развитию сельских районов"
 SIA_rural_package_active_desc: "Сельские фонды распределяются, минимальный уровень цен сохраняется, и районные дорожные службы работают. Потребительские товары немного подорожают в течение этого периода, и в этот год сельская местность находится в ведении государства."
 SIA_palace_bargain: "Заключить выгодную сделку во дворце"
 SIA_palace_bargain_desc: "Переворот урегулирован путем переговоров. Вместо того чтобы ждать танков, отдать дворцу и его генералам то, что они и так бы взяли. Роялистская элита входит в правительство в качестве старшего партнера, наша партия сохраняет свои места и теряет первенство, а Королевство поворачивается вспять без единого выстрела."
 SIA_face_the_court: "Предстаньте перед Конституционным судом"
 SIA_face_the_court_desc: "Предоставьте судьбу правящей партии судьям, как это делалось в Таиланде на протяжении двух десятилетий. В отличие от дворцовых сделок, это азартная игра, а не мирное урегулирование: решение принимает суд. Подчиниться роспуску и передать власть нашим соперникам или проигнорировать вердикт и заплатить стабильностью и терпением армии."
 SIA_pack_the_senate: "Расширить Сенат"
 SIA_pack_the_senate_desc: "Наполните верхнюю палату и независимые агентства лояльными сторонниками, пока ничто не сможет сдержать правительство. Законопроекты принимаются без возражений полгода. Для генералов это очевидный захват власти."
 SIA_populist_trunk_entry_tt: "§Y[neutral_Social_L]§! — правящая партия."
 SIA_democrat_trunk_entry_tt: "§Y[conservatism_L]§! — правящая партия."
 SIA_telecom_excise_favor: "Акцизный коммутатор телекоммуникаций"
 SIA_telecom_excise_favor_desc: "Превратите плату за концессии в сфере телекоммуникаций в акцизный налог, структурированный таким образом, чтобы семейная компания AIS сохранила свои лидирующие позиции, а новые участники рынка унаследовали бремя. Вас вознаградят и казначейство, и благодарная корпоративная база. Высшее руководство отмечает, что государством управляют ради баланса одной семьи. §RРиск государственного переворота возрастает.§!"
 SIA_exim_myanmar_loan: "Экспортно-импортный кредит Рангуну"
 SIA_exim_myanmar_loan_desc: "Предоставление льготного государственного займа хунте Мьянмы, предназначенного, что весьма кстати, для закупки спутниковых и телекоммуникационных услуг у семейной компании Shin Satellite. Этот внешнеполитический жест одновременно является выгодным контрактом для семейной фирмы. Классический пример конфликта интересов, который генералы не упускают из виду. §RРиск государственного переворота возрастает.§!"
 SIA_state_lottery_scheme: "Государственная лотерея"
 SIA_state_lottery_scheme_desc: "Вписать подпольную игру в деньги в государственную схему. Внебюджетные средства для патронажа и личных проектов, популярные среди спонсоров, и своего рода неподотчетный фонд, который первым упоминается в каждом манифесте о государственном перевороте."
 SIA_democrat_machine_category: "Партийная машина"
 SIA_democrat_machine_category_desc: "Сила демократов — в организации, но машине Таксина достаточно одной победы в деревне, чтобы вернуться к власти. Работайте с округами, чтобы удержать рубеж.\n\n§YПопулистская волна§!: [?ROOT.SIA_pheu_thai_pressure|0]/100. Она растёт на 1 в неделю, быстрее при спаде или падении стабильности, и даже при бурном росте экономики в спокойной стране всё равно понемногу ползёт вверх. Сбить её можно решениями ниже, плацдармом в Исане или пакетом развития села. Выше 35 она стоит стабильности и роста. Выше 70 — гораздо большего."
 SIA_constituency_machine: "Работа с избирателями"
 SIA_constituency_machine_desc: "Отправьте членов обратно в свои округа, чтобы они проводили консультации, чинили канализацию, улаживали споры и запоминали имена. Скучная работа, и единственный вид работы, который позволяет сохранить место в совете. §YПопулярность Демократической партии растёт.§! и популистская волна спадает."
 SIA_pt_pressure_increase_tt: "§RPopulist Tide [?pt_delta|0+]§! (теперь §Y[?ROOT.SIA_pheu_thai_pressure|0]§!/100)"
 SIA_pt_pressure_decrease_tt: "§GPopulist Tide [?pt_delta|0+]§! (теперь §Y[?ROOT.SIA_pheu_thai_pressure|0]§!/100)"
 SIA_match_the_populists: "Сопоставьте популистов"
 SIA_match_the_populists_desc: "Если не можешь победить деревенский фонд, создай лучший. Дешевое здравоохранение, списание долгов и сельское кредитование под знаменем демократов. Это истощает казну и отвлекает внимание от проблемы Пхеу Тай."
 SIA_expose_corruption: "Раскрыть сеть"
 SIA_expose_corruption_desc: "Натравите антикоррупционные органы и суды на популистскую машину. Дела о незаконном присвоении активов, расследования подкупа избирателей и затяжные судебные тяжбы, которые уже свергли не одно правительство Таксина."
 SIA_broaden_the_coalition: "Расширить коалицию"
 SIA_broaden_the_coalition_desc: "Передавайте министерские посты мелким партиям и провинциальным боссам в обмен на их места в парламенте. Цена – сварливый, склонный к политическим интригам кабинет министров (§Rтребования коалиции§!), но это создает парламентский барьер, который не сможет преодолеть ни одна популистская победа. §GПопулистская волна резко отступает.§!"
 SIA_counter_messaging: "Противодействие популистским идеям"
 SIA_counter_messaging_desc: "Отвечайте на популистские лозунги там, где люди их действительно слышат: в утренних ток-шоу, на деревенских радиостанциях, в профсоюзных залах. Небольшой, повторяемый толчок, и он подорвет позиции партии «Пхеу Тай»."
 SIA_reconstruction_category: "Освоить восстановленные земли"
 SIA_reconstruction_category_desc: "Территории, захваченные на Западной границе или в ходе кампаний по установлению гегемонии АСЕАН, удерживаются, но еще не интегрированы. Необходимо усмирить провинции, вложить в них средства на восстановление, и как только ситуация успокоится, полностью объявить их собственностью государства."
 SIA_reconstruction_pacify: "Умиротворить провинции"
 SIA_reconstruction_pacify_desc: "Наводните оккупированные провинции администраторами, информаторами и программами амнистии. Уровень подчинения растет во всех провинциях, которые мы контролируем, но еще не интегрировали. Это медленная, терпеливая работа, но именно на ней строится все остальное."
 SIA_reconstruction_develop: "Финансирование восстановительных работ"
 SIA_reconstruction_develop_desc: "Выделить средства на восстановление дорог, электроснабжения и общественных работ на отвоеванных землях. В каждой оккупированной провинции увеличивается количество объектов инфраструктуры и строительных площадок, что связывает их с национальной экономикой и дает населению заинтересованность в управлении Таиландом."
 SIA_reconstruction_integrate: "Провозгласить объединенные провинции"
 SIA_reconstruction_integrate_desc: "Там, где уровень подчиненности достаточно высок, оккупация прекращается, и провинции становятся тайской территорией. Каждая умиротворенная провинция, которую мы удерживаем, становится частью Королевства — это непреходящее достижение, которое никакая мирная конференция не сможет отменить."
 SIA_ghosts_5pct_tt: "§Y[communist_state_L]§! имеет как минимум 5% популярности."
 SIA_reform_5pct_tt: "§Y[socialism_L]§! имеет как минимум 5% популярности."
 SIA_reform_trunk_entry_tt: "§Y[socialism_L]§! — правящая партия."
 SIA_communist_trunk_entry_tt: "§Y[communist_state_L]§! — правящая партия."
 SIA_seize_power_gate_tt: "§YВсеобщая забастовка§! вынудила правительство капитулировать либо §Yгражданская война§! выиграна."
 SIA_strike_momentum_tt: "§RStrike Momentum [?strike_delta|0+]§! (теперь §Y[?ROOT.SIA_strike_momentum|0]§!/100). При достижении 100 правительство капитулирует."
 SIA_strike_mass_pickets: "Массовые пикеты"
 SIA_strike_mass_pickets_desc: "Десятки тысяч бастующих стоят в пикетах у своих предприятий и сутками удерживают городские перекрёстки. Массовые пикеты — то средство, которое стачечный комитет может повторять чаще всего, и они держат предприятия закрытыми, пока стоят цепи.\n\nДлится §Y7 дней§!, затем повторяется через §Y20 дней§! после окончания. На 30 дней закрывает цеха и лишает торговлю выручки."
 SIA_strike_paralyze_transport: "Парализовать порты и железные дороги"
 SIA_strike_paralyze_transport_desc: "Стачечный фонд платит портовым грузчикам и железнодорожникам за остановку работы, из-за чего грузы перестают идти через порты и по цепочкам поставок. Это самое разрушительное действие, доступное движению, и самое дорогое: фонд покрывает заработок бастующих всё время простоя.\n\nДлится §Y7 дней§!, затем повторяется через §Y30 дней§! после окончания. Уничтожает уровень инфраструктуры и на 30 дней останавливает добычу ресурсов."
 SIA_strike_win_the_conscripts: "Завоевать расположение призывников"
 SIA_strike_win_the_conscripts_desc: "Организаторы идут в казармы к призывникам, отговаривая их применять армию против демонстрантов. Королевская тайская армия набирает состав ежегодной жеребьёвкой, черпая главным образом из сельского Северо-востока, где партия работает годами, поэтому призывники восприимчивее своих офицеров. Каждая часть, чья надёжность становится сомнительной, сужает выбор правительства.\n\nДлится §Y7 дней§!, затем повторяется через §Y30 дней§! после окончания. Отвлечение организаторов в казармы стоит §Rприроста политической мощи§! на 90 дней."
