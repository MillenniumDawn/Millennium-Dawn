 CPD_liberate_in_state_button_TT_DELAYED: "[CPD_LIBERATE_TT_DELAYED_LOC]"
 CPD_liberate_in_state_button_TT_DEMAND: "Staaten befreien"
 CPD_liberate_in_state_button_TT_CONCESSION: "Unabhängigkeit gewähren"
 CPD_liberate_in_state_button_TT_DELAYED_DEMAND: "Die Forderung nach §YBefreiung§! gibt die ausgewählten Staaten an die Nation zurück, die rechtmäßig Anspruch auf sie erhebt. Ein noch existierender Kerngebietsinhaber erhält das Territorium direkt; ein längst untergegangener wird wiederbelebt, um es zu erhalten. Existiert kein Kerngebietsinhaber mehr, wird aus dem verbleibenden Rest des derzeitigen Besitzers ein neuer Splitterstaat gebildet."
 CPD_liberate_in_state_button_TT_DELAYED_CONCESSION: "Das Zugestehen der §YUnabhängigkeit§! entlässt die ausgewählten Staaten, die wir besitzen, an ihren rechtmäßigen Anspruchsberechtigten, unabhängig davon, ob diese Nation noch besteht oder aus der Geschichte wiederbelebt werden muss."
