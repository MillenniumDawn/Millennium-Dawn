 engine_solar_single_1: "태양 엔진"
 engine_solar_single_1_desc: "태양광 엔진을 사용하면 항공기가 전기 엔진으로 운용되어 공군의 연료 수요가 사라집니다.\n\n§G설계 힌트: 태양광 엔진은 항공기의 연료 소비를 0으로 만들고 항속 거리를 크게 늘리지만, 방공과 레이더 우위가 크게 감소합니다. 적 항공기나 대공 자원이 거의 없는 저강도 분쟁의 항공기에만 사용하기를 권장합니다.§!"
 engine_solar_double_1: "이중 태양 엔진"
 engine_solar_double_1_desc: "태양광 엔진을 사용하면 항공기가 전기 엔진으로 운용되어 공군의 연료 수요가 사라집니다.\n\n§G설계 힌트: 태양광 엔진은 항공기의 연료 소비를 0으로 만들고 항속 거리를 크게 늘리지만, 방공과 레이더 우위가 크게 감소합니다. 적 항공기나 대공 자원이 거의 없는 저강도 분쟁의 항공기에만 사용하기를 권장합니다.§!"
 engine_nuclear_eight_1: "원자력 엔진"
 engine_nuclear_eight_1_desc: "핵 엔진은 속도와 생산성을 희생하는 대신 항공기에 극단적인 항속 거리를 제공합니다.\n\n§G설계 힌트: 이 엔진은 항공기의 제작 비용을 극도로 비싸게 만들지만, 항속 거리 연장 장비와 결합하면 본국 기지에서 전 세계를 타격할 수 있습니다. 사용에 따른 책임은 본인에게 있습니다§!"
 weap_buff_transport: "투하 전용 공간 확보"
 weap_buff_transport_desc: "공수부대와 공중 투하 화물을 위한 공간입니다.\n\n§G설계 힌트: 수송기를 만들 때 이 모듈을 사용하십시오. 이 모듈을 장착하면 팔레트식 ALCM을 제외한 거의 모든 무기 체계를 사용할 수 없습니다.§!\n\n§W이를 주무장으로 사용하면 다음이 만들어집니다:§! §B드론/수송기§!"
 weap_buff_awacs_1: "냉전기 공중조기경보통제 시스템"
 weap_buff_awacs_1_desc: "초기 AWACS 레이더 및 C3 체계\n\n§G설계 힌트: AWACS 체계는 공중 정찰 임무를 수행하는 동안 아군에 상당한 제공권 보너스를 제공하며, 임무를 수행하는 비행대 내 항공기마다 이 보너스를 제공합니다§!\n\n§W이를 주무장으로 사용하면 다음이 만들어집니다:§! §B공중조기경보통제기§!"
 weap_buff_awacs_2: "현대 공중조기경보통제 시스템"
 weap_buff_awacs_2_desc: "현대식 AWACS 레이더 및 데이터링크 체계\n\n§G설계 힌트: AWACS 체계는 공중 정찰 임무를 수행하는 동안 아군에 상당한 제공권 보너스를 제공하며, 임무를 수행하는 비행대 내 항공기마다 이 보너스를 제공합니다§!\n\n§W이를 주무장으로 사용하면 다음이 만들어집니다:§! §B공중조기경보통제기§!"
 weap_buff_awacs_3: "Cutting-Edge AWACS System"
 weap_buff_awacs_3_desc: "최첨단 AWACS 레이더, 데이터링크, 드론 연동 체계입니다.\n\n§G설계 힌트: AWACS 체계는 공중 정찰 임무를 수행하는 동안 아군에 상당한 제공권 보너스를 제공하며, 임무를 수행하는 비행대 내 항공기마다 이 보너스를 제공합니다§!\n\n§W이를 주무장으로 사용하면 다음이 만들어집니다:§! §B공중조기경보통제기§!"
 weap_multi_at_1: "초기 대전차 화기"
 weap_multi_at_1_desc: "2차 세계 대전 시기의 장갑을 관통하도록 설계된 초기 항공기 탑재 대전차포입니다.\n\n§G설계 힌트: 지상 공격 항공기를 설계할 때 이 포 슬롯을 사용하면 근접 항공 지원 및 타격 피해가 증가합니다.§!"
 weap_multi_at_2: "냉전기 대전차 화기"
 weap_multi_at_2_desc: "냉전 초기의 장갑차와 APC/IFV를 관통하도록 설계된 냉전 시대 대전차포입니다.\n\n§G설계 힌트: 지상 공격 항공기를 설계할 때 이 포 슬롯을 사용하면 근접 항공 지원 및 타격 피해가 증가합니다.§!"
 weap_multi_gun_1_desc: "한국 전쟁 시기의 리볼버 기관포입니다.\n\n§G설계 힌트: 항공기의 공중 공격 능력치와 지상 공격 능력치를 절충하려면 이 포를 선택하십시오.§!"
 weap_multi_gun_2: "20mm 기관포"
 weap_multi_gun_2_desc: "항공기용 20mm 회전식 기관포입니다.\n\n§G설계 힌트: 항공기의 공중 공격 능력치와 지상 공격 능력치를 절충하려면 이 포를 선택하십시오.§!"
 weap_multi_gun_3: "30mm 기관포"
 weap_multi_gun_3_desc: "30mm 구경으로 개량된 회전식 기관포입니다.\n\n§G설계 힌트: 항공기의 공중 공격 능력치와 지상 공격 능력치를 절충하려면 이 포를 선택하십시오.§!"
 weap_mp_heavy_hardpoint_1: "1세대 대형 무장장착소"
 weap_mp_heavy_hardpoint_1_desc: "대형 대함 미사일, 2000파운드 폭탄, 순항 미사일, 일부 대형 공대공 무장을 포함한 중량 무기를 탑재할 수 있도록 설계된 하드포인트입니다.\n\n§G설계 힌트: 대부분의 임무를 수행할 수 있으면서도 주로 대함 또는 전략 폭격 임무에 투입할 수 있는 항공기를 만들려면 이 하드포인트를 사용하십시오.§!\n\n§W이를 주무장으로 사용하면 다음이 만들어집니다:§! §B다목적 전투기§!\n\n§R경고: 함재 다목적 전투기는 해전 중 적 함선만 공격합니다§!"
 weap_mp_heavy_hardpoint_2: "2세대 대형 무장장착소"
 weap_mp_heavy_hardpoint_2_desc: "$weap_mp_heavy_hardpoint_1_desc$"
 weap_mp_heavy_hardpoint_3: "3세대 대형 무장장착소"
 weap_mp_heavy_hardpoint_3_desc: "$weap_mp_heavy_hardpoint_1_desc$"
 weap_mp_heavy_hardpoint_4: "4세대 대형 무장장착소"
 weap_mp_heavy_hardpoint_4_desc: "$weap_mp_heavy_hardpoint_1_desc$"
 weap_as_hardpoint_1: "1세대 해상 무장장착소"
 weap_as_hardpoint_1_desc: "대형 대함 무장, 어뢰, 기뢰 부설 또는 소해 장비를 탑재할 수 있도록 설계된 하드포인트입니다.\n\n§G설계 힌트: 대함 임무를 수행하도록 설계된 항공기를 만들려면 이 하드포인트를 사용하십시오.§!\n\n§W이를 주무장으로 사용하면 다음이 만들어집니다:§! §B해군 폭격기§!\n\n§R경고: 함재 해군 폭격기는 해전 중 적 함선만 공격합니다§!"
 weap_as_hardpoint_2: "2세대 해상 무장장착소"
 weap_as_hardpoint_2_desc: "$weap_as_hardpoint_1_desc$"
 weap_as_hardpoint_3: "3세대 해상 무장장착소"
 weap_as_hardpoint_3_desc: "$weap_as_hardpoint_1_desc$"
 weap_as_hardpoint_4: "4세대 해상 무장장착소"
 weap_as_hardpoint_4_desc: "$weap_as_hardpoint_1_desc$"
 weap_ag_gunship_1: "25mm - 40mm 포 장착"
 weap_ag_gunship_1_desc: "대형 항공기에 장착된 25mm 개틀링 기관포와 40mm 보포스 기관포는 지상 부대에 정밀 화력 지원을 제공하는 공중 건십을 가능하게 합니다.\n\n§G설계 힌트: 대형 근접 항공 지원기를 만들려면 이 모듈을 사용하십시오. 이 항공기는 상당한 규모의 근접 항공 지원을 제공할 수 있지만, 분쟁 공역에서는 매우 취약합니다.§!\n\n§W이를 주무장으로 사용하면 다음이 만들어집니다:§! §B근접 항공 지원기§!"
 weap_ag_gunship_2: "105mm 곡사포 장착"
 weap_ag_gunship_2_desc: "105mm 곡사포는 건십이 지상 부대에 포병 및 전차 수준의 정밀 직사 화력 지원을 제공할 수 있게 합니다.\n\n§G설계 힌트: 대형 근접 항공 지원기를 만들려면 이 모듈을 사용하십시오. 이 항공기는 상당한 규모의 근접 항공 지원을 제공할 수 있지만, 분쟁 공역에서는 매우 취약합니다.§!\n\n§W이를 주무장으로 사용하면 다음이 만들어집니다:§! §B근접 항공 지원기§!"
 weap_ag_rapid_dragon: "팔레트화 운송 공중발사순항미사일 (Palletized ALCM)"
 weap_ag_rapid_dragon_desc: "각국이 무기 운용 방식을 실험함에 따라, 수송기에서 곧바로 공중발사 순항미사일(ALCM)을 발사하도록 설계된 팔레트는 대형 수송기가 수행할 수 있는 역할을 급격히 바꾸고 있습니다.\n\n§G설계 힌트: 이 모듈을 사용하면 수송기가 전략 폭격 임무를 수행할 수 있습니다. 수송기는 이 임무를 수행하는 동안에도 피해에 매우 취약하다는 점에 유의하십시오.§!"
 weap_ag_strat_1: "1세대 폭탄 투하실"
 weap_ag_strat_1_desc: "전용 폭탄창 덕분에 항공기는 대량의 공대지 무장을 탑재할 수 있으며, 주로 전략 목표를 대규모로 타격하는 데 사용됩니다.\n\n§G설계 힌트: 이 모듈은 상당한 수준의 전략 폭격 및 해군 공격 능력치를 제공하지만 레이더 우위와 방공이 감소합니다. 한 항공기에 이 모듈을 많이 사용하면 레이더 우위가 크게 감소하여 분쟁 공역에서 취약해집니다.§!\n\n§W이를 주무장으로 사용하면 다음이 만들어집니다:§! §B전략 폭격기§!"
 weap_ag_strat_2: "2세대 폭탄 투하실"
 weap_ag_strat_2_desc: "$weap_ag_strat_1_desc$"
 weap_ag_strat_3: "3세대 폭탄 투하실"
 weap_ag_strat_3_desc: "$weap_ag_strat_1_desc$"
 weap_ag_strat_4: "4세대 폭탄 투하실"
 weap_ag_strat_4_desc: "$weap_ag_strat_1_desc$"
 weap_mp_med_hardpoint_1: "1세대 중형 무장장착소"
 weap_ag_cas_hardpoint_1: "1세대 근접항공지원 무장장착소"
 weap_mp_med_hardpoint_1_desc: "중형 무기를 탑재하도록 설계된 하드포인트입니다. 경량 대함 미사일, 정밀 유도 무장, 대전차 미사일, 중형 순항 미사일, 장거리 공대공 미사일, 건포드 등이 해당됩니다. 이 하드포인트는 항공기에 폭넓은 무기 선택지를 제공합니다.\n\n§G설계 힌트: 중형 하드포인트는 다목적의 전형으로, 거의 모든 항공 임무와 항공기를 쓸모 있게 만드는 해당 임무의 능력치를 제공하지만 IC 비용이 증가합니다. 이 모듈은 균형 잡힌 범용 항공기를 만듭니다.§!\n\n§W이를 주무장으로 사용하면 다음이 만들어집니다:§! §B다목적 전투기§!\n\n§R경고: 함재 다목적 전투기는 해전 중 적 함선만 공격합니다§!"
 weap_ag_cas_hardpoint_1_desc: "대량의 공대지 무장을 탑재하도록 설계된 하드포인트입니다. 이 하드포인트는 다양한 무장을 섞어 탑재하는 능력을 포기하는 대신 공대지 미사일, 더 무거운 폭탄, 더 많은 ALCM 같은 무기 체계를 여러 레일에 탑재하는 능력을 얻습니다.\n\n§G설계 힌트: 근접 항공 지원 하드포인트는 항공기의 지상 공격 및 전략 폭격 능력치를 크게 높이지만, 항공기에 공중 공격력을 전혀 제공하지 않으며 레이더 우위가 감소합니다.§!\n\n§W이를 주무장으로 사용하면 다음이 만들어집니다:§! §B근접 항공 지원기§!"
 weap_mp_med_hardpoint_2: "2세대 중형 무장장착소"
 weap_ag_cas_hardpoint_2: "2세대 근접항공지원 무장장착소"
 weap_mp_med_hardpoint_2_desc: "$weap_mp_med_hardpoint_1_desc$"
 weap_ag_cas_hardpoint_2_desc: "$weap_ag_cas_hardpoint_1_desc$"
