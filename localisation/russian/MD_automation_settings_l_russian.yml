l_russian:
 AUTOMATION_SETTINGS_OPEN_TT: "Открыть настройки автоматизации"
 AUTOMATION_SETTINGS_TITLE: "Настройки автоматизации"
 AUTOMATION_SETTINGS_DESC: "Управление повторяющимися действиями и настройками уведомлений из одной панели. Существующие элементы управления в других разделах остаются доступными."
 AUTOMATION_SETTINGS_GENERAL_PAGE: "Общие"
 AUTOMATION_SETTINGS_SPACE_PAGE: "Спутники"
 AUTOMATION_SETTINGS_INFLUENCE_PAGE: "Влияние"
 AUTOMATION_SETTINGS_SPACE_DESC: "Настройка автоматического производства спутников, запусков и модернизации группировок."
 AUTOMATION_SETTINGS_INFLUENCE_DESC: "Настройка повторяющихся действий для защиты нашего правительства от иностранного влияния."
 AUTOMATION_SETTINGS_SPACE_SAVE_BUTTON_TT: "[!automation_space_save_button_click_enabled]Сохранить подготовленный в космической программе манифест полезной нагрузки как план §YПользовательский§! и переключиться на него."
 AUTOMATION_SETTINGS_SPACE_UPGRADE_BUTTON_TT: "[!automation_space_upgrade_button_click_enabled]Перевести каждую группировку на новейшее исследованное поколение там, где текущее орбитальное покрытие это позволяет."
 AUTOMATION_SETTINGS_NOTIFICATIONS_HEADER: "Уведомления и настройки"
 AUTOMATION_SETTINGS_ECONOMY_HEADER: "Экономика"
 AUTOMATION_SETTINGS_UN_HEADER: "Организация Объединённых Наций"
 AUTOMATION_SETTINGS_DIPLOMACY_HEADER: "Дипломатия"
 AUTOMATION_SETTINGS_NATO_HEADER: "НАТО"
 AUTOMATION_SETTINGS_ENERGY_HEADER: "Энергия"
 AUTOMATION_SETTINGS_PP_RESERVE: "Резерв политической власти"
 AUTOMATION_SETTINGS_PP_RESERVE_VALUE: "£pol_power [?automation_pp_reserve|0]"
 AUTOMATION_SETTINGS_PP_RESERVE_TT: "Автоматизированные действия, требующие политической власти, будут ожидать, пока их стоимость можно будет оплатить, не снижая запас политической власти ниже этого резерва. На ручные действия это не влияет.\n\n£click_left §YЛКМ§!: Изменить на §Y1§!\n£key_ctrl + £click_left §YCtrl + ЛКМ§!: Изменить на §Y10§!\n£key_shift + £click_left §YShift + ЛКМ§!: Изменить на §Y100§!"
 AUTOMATION_SETTINGS_PP_RESERVE_PLUS_TT: "£click_left §YЛКМ§!: Увеличить на §Y1§!\n£key_ctrl + £click_left §YCtrl + ЛКМ§!: Увеличить на §Y10§!\n£key_shift + £click_left §YShift + ЛКМ§!: Увеличить на §Y100§!"
 AUTOMATION_SETTINGS_PP_RESERVE_MINUS_TT: "£click_left §YЛКМ§!: Уменьшить на §Y1§!\n£key_ctrl + £click_left §YCtrl + ЛКМ§!: Уменьшить на §Y10§!\n£key_shift + £click_left §YShift + ЛКМ§!: Уменьшить на §Y100§!"
 AUTOMATION_SETTINGS_CORRUPTION: "Автоматически отклонять предложения о коррупции"
 AUTOMATION_SETTINGS_CORRUPTION_TT: "Автоматически пропускать предложения о коррупции. Пока эта настройка включена, события и возможные награды за них отображаться не будут."
 AUTOMATION_SETTINGS_FOREIGN_ELECTION: "Уведомления о выборах в других странах"
 AUTOMATION_SETTINGS_FOREIGN_ELECTION_TT: "Показывать новостные уведомления о выборах в других странах."
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS: "Уведомления о рейдах влияния"
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS_TT: "Показывать события о рейдах влияния между другими странами. Рейды против нас будут по-прежнему отображаться, даже если эта настройка отключена."
 AUTOMATION_SETTINGS_INFLUENCE_REPORT: "Ежемесячный отчёт об автоматическом влиянии"
 AUTOMATION_SETTINGS_INFLUENCE_REPORT_TT: "Показывать ежемесячный отчёт со списком стран, на которые распространяется автоматическое влияние."
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE: "Автоматически принимать предложения об инвестициях"
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE_TT: "Автоматически принимать каждое поступающее предложение о международных инвестициях. Включение этой настройки отключает автоматический отказ."
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION: "Автоматически отклонять предложения об инвестициях"
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION_TT: "Автоматически отклонять каждое поступающее предложение о международных инвестициях. Включение этой настройки отключает автоматическое принятие."
 AUTOMATION_SETTINGS_REINVESTMENT: "Реинвестирование международных инвестиций"
 AUTOMATION_SETTINGS_REINVESTMENT_TT: "Выберите, как распределять еженедельную прибыль от международных инвестиций между казной и реинвестированием."
 AUTOMATION_SETTINGS_REINVEST_OFF: "Выкл."
 AUTOMATION_SETTINGS_REINVEST_OFF_TT: "Направлять всю прибыль от международных инвестиций в казну."
 AUTOMATION_SETTINGS_REINVEST_FULL: "Полностью"
 AUTOMATION_SETTINGS_REINVEST_FULL_TT: "Реинвестировать всю прибыль от международных инвестиций."
 AUTOMATION_SETTINGS_REINVEST_SPLIT: "Поровну"
 AUTOMATION_SETTINGS_REINVEST_SPLIT_TT: "Направлять половину прибыли от международных инвестиций в казну, а вторую половину реинвестировать."
 AUTOMATION_SETTINGS_FUEL_PURCHASE: "Автоматическая закупка топлива"
 AUTOMATION_SETTINGS_FUEL_PURCHASE_TT: "Немедленно купить топливо, затем проверять запасы каждые 28 дней и повторно закупать его, когда запасы топлива опускаются ниже 20 процентов. Отключите эту настройку, чтобы отменить будущие закупки."
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS: "Повторять выбранные внутренние инвестиции"
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS_TT: "Ежедневно расходовать £pol_power §R0.15§! политической власти, пока настройка включена. Нажмите ПКМ по кнопкам внутренних инвестиций в окне региона, чтобы выбрать регион и типы инвестиций для повторения. Выбранные инвестиции проверяются еженедельно и выполняются, если есть свободный слот, казна может оплатить текущую стоимость, а резерв политической власти можно сохранить."
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY: "Автоматически пополнять запасы антарктической станции"
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY_TT: "Автоматически заказывать топливо для нашей антарктической станции, когда с ноября по март остаётся не более 15 дней, а с апреля по октябрь — не более 30 дней. Доставка стоит §R$0.25 млрд за 1000 единиц топлива§! и вдвое дороже во время антарктической зимы. Заказы ожидают, пока казна не сможет оплатить полную стоимость."
 AUTOMATION_SETTINGS_ENERGY_CONSUMPTION_POLICY: "Автоматическая политика потребления"
 AUTOMATION_SETTINGS_SC_VOTE: "Голосование в Совете Безопасности по умолчанию"
 AUTOMATION_SETTINGS_SC_VOTE_TT: "Выберите, как мы будем автоматически голосовать по резолюциям Совета Безопасности. Повторно нажмите выбранный вариант, чтобы вернуться к ручному голосованию."
 AUTOMATION_SETTINGS_GA_VOTE: "Голосование в Генеральной Ассамблее по умолчанию"
 AUTOMATION_SETTINGS_GA_VOTE_TT: "Выберите, как мы будем автоматически голосовать по резолюциям Генеральной Ассамблеи. Повторно нажмите выбранный вариант, чтобы вернуться к ручному голосованию."
 AUTOMATION_SETTINGS_VOTE_YES: "За"
 AUTOMATION_SETTINGS_VOTE_NO: "Против"
 AUTOMATION_SETTINGS_VOTE_ABSTAIN: "Воздержаться"
 AUTOMATION_SETTINGS_SC_ACCEPT_TT: "Автоматически голосовать «За» по каждой резолюции Совета Безопасности."
 AUTOMATION_SETTINGS_SC_REJECT_TT: "Автоматически голосовать «Против» по каждой резолюции Совета Безопасности. Постоянные члены в соответствующих случаях будут накладывать вето."
 AUTOMATION_SETTINGS_SC_ABSTAIN_TT: "Автоматически воздерживаться при голосовании по каждой резолюции Совета Безопасности."
 AUTOMATION_SETTINGS_GA_ACCEPT_TT: "Автоматически голосовать «За» по каждой резолюции Генеральной Ассамблеи."
 AUTOMATION_SETTINGS_GA_REJECT_TT: "Автоматически голосовать «Против» по каждой резолюции Генеральной Ассамблеи."
 AUTOMATION_SETTINGS_GA_ABSTAIN_TT: "Автоматически воздерживаться при голосовании по каждой резолюции Генеральной Ассамблеи."
 AUTOMATION_SETTINGS_SATELLITE_REJECTION: "Блокировать предложения ИИ о доступе к спутникам"
 AUTOMATION_SETTINGS_SATELLITE_REJECTION_TT: "Не позволять странам под управлением ИИ предлагать совместный доступ к своим военным и гражданским спутниковым системам. Игроки по-прежнему могут отправлять такие предложения."
 AUTOMATION_SETTINGS_NATO_RATIFICATION: "Автоматически ратифицировать вступление в НАТО"
 AUTOMATION_SETTINGS_NATO_RATIFICATION_TT: "Автоматически расходовать £pol_power §Y20§! политической власти на ратификацию каждого кандидата на вступление в НАТО. Ратификация ожидает, пока можно будет сохранить резерв политической власти."
 AUTOMATION_SETTINGS_INFLUENCE_HEADER: "Защита от влияния"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE: "Автоматически противодействовать иностранному влиянию"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE_TT: "Ежедневно расходовать £pol_power §R0.05§! политической власти, пока настройка включена. При наличии возможности автоматически расходовать £pol_power §Y100§!, чтобы увеличить внутреннюю независимость на §G2.5%§!. Повторять через 100 дней. Автоматизация приостанавливается, пока правительство подвергается лоббированию, или если какая-либо из затрат снизит политическую власть ниже резерва."
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS: "Автоматически атаковать иностранных влиятельных лиц"
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS_TT: "Ежедневно расходовать £pol_power §R0.05§! политической власти, пока настройка включена. Автоматически расходовать £pol_power §Y125§! для начала 60-дневной кампании против сильнейшего подходящего иностранного влиятельного лица. Одновременно может проводиться только одна кампания. Неподходящие цели, цели, находящиеся под лоббированием, и цели на перезарядке пропускаются. Автоматизация приостанавливается, если какая-либо из затрат снизит политическую власть ниже резерва."
 AUTOMATION_SETTINGS_INFLUENCE_COST_NOTE: "Каждая включённая настройка стоит £pol_power §R0.05§! политической власти в день. Обе настройки вместе стоят £pol_power §R0.10§! в день."
 AUTOMATION_SETTINGS_ECONOMY_PAGE: "Экономика"
 AUTOMATION_SETTINGS_ECONOMY_DESC: "Выберите, какие налоги и государственные расходы управлять автоматически. Изменения проверяются еженедельно и учитывают резерв политической власти."
 AUTOMATION_SETTINGS_TAX_HEADER: "Налоговые ставки"
 AUTOMATION_SETTINGS_BUDGET_HEADER: "Бюджетные законы"
 AUTOMATION_SETTINGS_TAX_SUMMARY: "Включённые налоги изменяются не более чем на один процентный пункт в неделю в зависимости от бюджетного баланса, долга и стабильности.\n\nРучные изменения не отключают автоматизацию."
 AUTOMATION_SETTINGS_BUDGET_SUMMARY: "Включённые статьи бюджета перемещаются на один уровень в сторону ожидаемого уровня расходов. За неделю изменяется не более одного бюджета, при этом приоритеты чередуются. Повышение требует профицита бюджета. Ручная смена закона не отключает автоматизацию."
 AUTOMATION_SETTINGS_POPULATION_TAX: "Налог с населения: [?population_tax_rate|0]%"
 AUTOMATION_SETTINGS_CORPORATE_TAX: "Корпоративный налог: [?corporate_tax_rate|0]%"
 AUTOMATION_SETTINGS_POPULATION_TAX_TT: "Автоматически изменять налог с населения на один процентный пункт в неделю с учётом бюджетного баланса, долга и стабильности. Соблюдаются ограничения на изменение налогов и обычная стоимость в политической власти сверх резерва. Ручные изменения налога не отключают эту настройку."
 AUTOMATION_SETTINGS_CORPORATE_TAX_TT: "Автоматически изменять корпоративный налог на один процентный пункт в неделю с учётом бюджетного баланса, долга и доступных гражданских фабрик. Соблюдаются ограничения на изменение налогов и обычная стоимость в политической власти сверх резерва. Ручные изменения налога не отключают эту настройку."
 AUTOMATION_SETTINGS_BUDGET_BUREAUCRACY: "Администрация: [?bureau_law|0] / [?expected_adm_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_BUREAUCRACY_TT: "Автоматически приближать уровень администрации к ожидаемому уровню расходов, по одному уровню за раз. Числа показывают текущий и ожидаемый уровни. Действуют обычные ограничения законов и затраты политической власти. Повышение требует профицита бюджета и приостанавливается при угрозе банкротства. Резерв политической власти сохраняется. Ручная смена закона не отключает эту настройку."
 AUTOMATION_SETTINGS_BUDGET_CRIME_FIGHTING: "Правопорядок: [?police_law|0] / [?expected_police_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_CRIME_FIGHTING_TT: "Автоматически приближать уровень расходов на поддержание правопорядка к ожидаемому уровню, по одному уровню за раз. Числа показывают текущий и ожидаемый уровни. Действуют обычные ограничения законов и затраты политической власти. Повышение требует профицита бюджета и приостанавливается при угрозе банкротства. Резерв политической власти сохраняется. Ручная смена закона не отключает эту настройку."
 AUTOMATION_SETTINGS_BUDGET_EDUCATION_BUDGET: "Образование: [?education_law|0] / [?expected_edu_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_EDUCATION_BUDGET_TT: "Автоматически приближать расходы на образование к ожидаемому уровню, по одному уровню за раз. Числа показывают текущий и ожидаемый уровни. Действуют обычные ограничения законов и затраты политической власти. Повышение требует профицита бюджета и приостанавливается при угрозе банкротства. Резерв политической власти сохраняется. Ручная смена закона не отключает эту настройку."
 AUTOMATION_SETTINGS_BUDGET_HEALTH_BUDGET: "Здравоохранение: [?health_law|0] / [?expected_health_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_HEALTH_BUDGET_TT: "Автоматически приближать расходы на здравоохранение к ожидаемому уровню, по одному уровню за раз. Числа показывают текущий и ожидаемый уровни. Действуют обычные ограничения законов и затраты политической власти. Повышение требует профицита бюджета и приостанавливается при угрозе банкротства. Резерв политической власти сохраняется. Ручная смена закона не отключает эту настройку."
 AUTOMATION_SETTINGS_BUDGET_SOCIAL_BUDGET: "Социальное обеспечение: [?social_law|0] / [?expected_welfare_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_SOCIAL_BUDGET_TT: "Автоматически приближать расходы на социальное обеспечение к ожидаемому уровню, по одному уровню за раз. Числа показывают текущий и ожидаемый уровни. Действуют обычные ограничения законов и затраты политической власти. Повышение требует профицита бюджета и приостанавливается при угрозе банкротства. Резерв политической власти сохраняется. Ручная смена закона не отключает эту настройку."
 AUTOMATION_SETTINGS_BUDGET_MILITARY_SPENDING: "Военные расходы: [?military_law|0] / [?expected_military_sp|0]"
 AUTOMATION_SETTINGS_BUDGET_MILITARY_SPENDING_TT: "Автоматически приближать военные расходы к ожидаемому уровню, по одному уровню за раз. Числа показывают текущий и ожидаемый уровни. Действуют обычные ограничения законов и затраты политической власти. Повышение требует профицита бюджета и приостанавливается при угрозе банкротства. Резерв политической власти сохраняется. Ручная смена закона не отключает эту настройку."