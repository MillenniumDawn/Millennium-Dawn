 RULE_YES_ALLOW_TOGGLING_CHEAT_DECISIONS_DESC: "§Y(Opcional)§!\n\nPermite Cambiar las Decisiones de Trucos Globalmente\n§YNOTA:§! Cualquier nación en el mundo puede cambiar las Decisiones de Trucos y los efectos son §Yglobales§!. Aparecerá un evento que indicará qué nación lo cambió.\n§YDebes asegurarte de que se te permita usar la decisión en un juego multijugador!§!\n\n§YNOTA:§! También debes habilitar la regla de juego \"Permitir Decisiones de Trucos\" si deseas usar trucos."
 RULE_NO_ALLOW_TOGGLING_CHEAT_DECISIONS_DESC: "§Y(Opcional)§!\n\nCambiar Decisiones de Trucos Globalmente Deshabilitado\n§YNOTA:§! Cualquier nación en el mundo puede cambiar las Decisiones de Trucos y los efectos son §Yglobales§!. Aparecerá un evento que indicará qué nación lo cambió.\n§YDebes asegurarte de que se te permita usar la decisión en un juego multijugador!§!\n\n§YNOTA:§! También debes habilitar la regla de juego \"Permitir Decisiones de Trucos\" si deseas usar trucos."
