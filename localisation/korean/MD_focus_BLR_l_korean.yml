l_korean:
 BLR_china_friendship: "중국과의 협력"
 BLR_china_friendship_desc: "우리는 양국 간의 우호 관계를 강화하고자 합니다."
 BLR_Bel_G2: "BELGEE 합동 자동차 제조사"
 BLR_Bel_G2_desc: "JSC \\"BELGEE\\"는 중국 지리 승용차를 조립하는 벨라루스-중국 합작 기업입니다. 벨라루스의 두 승용차 조립 업체 중 하나입니다. 보리소프 인근 JSC \\"보리소프 자동 유압 증폭기 공장\\"의 임대 부지에 위치해 있습니다."
 BLR_Chinese_Modernization_Railway: "철도 현대화"
 BLR_Chinese_Modernization_Railway_desc: "중국 측 동료들이 우리나라 철도망 현대화 자금을 지원하기로 합의했습니다."
 BLR_Brigade_Territorial_Defence: "영토 방위 여단 창설"
 BLR_Brigade_Territorial_Defence_desc: "전쟁이 발발하여 영토 방위군을 편성할 수밖에 없게 되었습니다."
 BLR_Communism_start: "공산주의의 귀환"
 BLR_Communism_start_desc: "공산주의가 벨라루스에 다시 돌아왔다. 공산당은 이 나라에 다시 한번 마르크스-레닌주의를 위한 길을 닦을까?"
 BLR_trade_with_nko: "북한과의 무역"
 BLR_trade_with_nko_desc: "북한은 비록 작은 나라이지만 사회주의 진영의 동맹국이며, 우리는 북한과 무역 관계를 수립할 준비가 되어 있습니다."
 BLR_nko_workers: "북한 노동자들"
 BLR_nko_workers_desc: "우리는 북한 노동자들을 우리나라로 초청할 준비가 되어 있습니다. 그들은 효율성과 근면성으로 유명합니다."
 BLR_nko_miiltary_coop: "북한과의 군사 기술 협력"
 BLR_nko_miiltary_coop_desc: "우리는 북한 인민군과 군사기술 협력을 시작할 준비가 되어 있습니다."
 BLR_rotation_KGB: "KGB에서의 교대"
 BLR_rotation_KGB_desc: "우리는 지금 강력하고 효율적인 조직이 필요하기 때문에 인력 순환을 실시하고 있습니다."
 BLR_North_Korea_workers: "북한 노동자"
 BLR_SMERSH_2: "스메르시 2.0"
 BLR_SMERSH_2_desc: "스메르시를 부활시킬 것입니다. 소련의 경험을 국가의 이익을 위해 활용할 때입니다."
 BLR_arest_silovic: "보안군 숙청"
 BLR_arest_silovic_desc: "많은 보안군이 새 정부에 반대하는 모습을 보였으니, 이제 그들을 숙청할 때다."
 BLR_antigay_propaganda_laws: "반 동성애 선전 정책"
 BLR_antigay_propaganda_laws_desc: "우리나라에서 성소수자 선전을 법으로 금지할 때입니다."
 BLR_clean_soc_net: "깨끗한 소셜 미디어"
 BLR_clean_soc_net_desc: "모든 소셜 네트워크를 정화하고 적의 선전이 퍼지는 것을 허용하지 않을 것입니다."
 BLR_pioneria: "피오네르 운동"
 BLR_pioneria_desc: "젊은이들이 놀고 있어서는 안 되므로 소년단을 부활시킬 것입니다."
 BLR_Marks_school: "마르크스주의 교육"
 BLR_Marks_school_desc: "학교 교육과정에는 반드시 마르크스주의 교육이 포함될 것입니다."
 BLR_free_education: "무상 교육"
 BLR_free_education_desc: "교육은 영광스러운 우리 조국의 모든 시민에게 무상으로 제공되어야 합니다."
 BLR_state_atheism: "국가 무신론"
 BLR_state_atheism_desc: "종교는 인민의 아편이며, 그 영향력에 맞서 싸울 때입니다."
 BLR_collectivism: "집산주의"
 BLR_collectivism_desc: "집단화는 전에도 효과가 있었으므로 그 경험을 되풀이할 것입니다."
 BLR_fight_international_capitalists: "국제 자본주의자들과의 갈등"
 BLR_fight_international_capitalists_desc: "올리가르히는 소련 시대의 쿨라크보다 나을 것이 없는 위험하고 부패한 계급입니다. 소련 해체 이후 러시아와 벨라루스의 올리가르히들은 점점 더 많은 경제적 영향력을 집어삼켰고, 외국 기업이 주도하는 세계주의적 경제 모델을 위해 벨라루스 노동자들을 일자리에서 몰아냈습니다. 진정한 사회주의를 되살리려면 먼저 국제 자본가 계급을 몰아내는 것이 필수입니다."
 BLR_weaken_the_banks: "은행 약화"
 BLR_weaken_the_banks_desc: "은행은 자본주의의 근위대로서 자본주의의 깃발을 전장으로 들고 나가며 자신들의 존재로 그 이윤을 지킵니다. 은행은 세계의 빈곤 지역에 개입하고, 임금 덤핑과 이자 투기로 노동 계급을 착취하며, 합법적이거나 불법적인 기부로 정치에 영향력을 행사합니다. 은행은 단순히 비정치적인 단기 대부업자의 상태로 되돌려져야 합니다."
 BLR_ultimate_tax_reform: "대규모 세금 개혁"
 BLR_ultimate_tax_reform_desc: "우리는 일반 국민의 세금 부담은 덜어주고 기업에는 그 반대가 되는 대대적인 세제 개혁을 추진할 것입니다."
 BLR_single_party: "일당제"
 BLR_single_party_desc: "사회주의로 가는 길은 하나뿐이므로 정당도 하나여야 합니다."
 BLR_nationalize_foreign_business: "외국 기업 국유화"
 BLR_nationalize_foreign_business_desc: "외국인이 소유한 산업 시설은 항상 경제 안보에 위험 요소입니다. 외국이 경제 제재로 우리를 위협하는 상황에서, 산업 소유주들이 하룻밤 사이에 떠나면서 공장의 핵심 부품을 가져가 버릴 우려가 늘 존재합니다. 이를 막으려면 다른 나라의 심기를 건드리더라도 이들 산업을 국가의 소유로 만들어야 합니다."
 BLR_five_year_plan: "제1차 5개년 계획"
 BLR_five_year_plan_desc: "서방 국가들의 자유 경제 모델은 사회주의 국가에 미래를 제공하지 못합니다. 되도록 고전적인 소련식 5개년 계획의 형태로 계획 경제로 돌아가면, 그동안 통제되지 않던 경제에 대해 정부가 큰 영향력을 갖게 될 것입니다."
 BLR_reestablish_the_military_industrial_complex: "군산복합체 재설립"
 BLR_reestablish_the_military_industrial_complex_desc: "군대와 인민은 하나다!"
 BLR_mobilize_the_masses: "대중을 동원하라"
 BLR_mobilize_the_masses_desc: "우리 군대에는 당이 요구하는 곳이면 어디서든 조국의 이익을 지킬 사람이 필요합니다."
 BLR_better_roads: "일반 도로 개선"
 BLR_better_roads_desc: "우리나라의 도로 문제를 면밀히 다룰 필요가 있습니다."
 BLR_progress_cult: "진보주의 추종단"
 BLR_progress_cult_desc: "사회주의자들은 사회와 과학의 진보를 원합니다. 특히 후자는 21세기에 국가 안보 목적뿐만 아니라 혁명을 확산하고 사회주의 의제를 실현하기 위해서도 중요하며, 이는 과학과 기술이 일정 수준까지 발전해야만 완전히 달성될 수 있습니다."
 BLR_soviet_academy_of_sciences: "소련 과학 학교"
 BLR_soviet_academy_of_sciences_desc: "소련 과학 아카데미는 소련 최고의 과학 기관이었습니다. 우리의 가장 뛰어나고 총명한 인재들이 이곳에서 다시 한번 쉬지 않고 일하여 기술적, 과학적 돌파구를 마련할 것이며, 언젠가 우리는 자본주의 세계의 부러움을 사게 될 것입니다!"
 BLR_the_culture_of_proletarianism: "프롤레타리아주의의 문화"
 BLR_the_culture_of_proletarianism_desc: "노동 계급을 위한 프롤레타리아 문화를 육성할 때입니다. 이를 통해 우리는 공동의 아름다운 공산주의 미래를 향해 함께 나아갈 것입니다."
 BLR_empower_the_kgb: "KGB 영향력 확장"
 BLR_empower_the_kgb_desc: "적이 우리의 내부 체제를 훼손하지 못하도록 우리나라에서 KGB의 영향력을 확대할 것입니다. 이에 따라 활동을 수행할 더 많은 권한을 부여할 것입니다."
 BLR_erase_nationalist: "모든 국가주의자들을 투옥하라"
 BLR_erase_nationalist_desc: "우리나라의 민족주의 세포를 제거할 때입니다."
 BLR_the_litbel_start: "리투벨의 부활"
 BLR_the_litbel_start_desc: "Litbel is a Soviet republic that appeared for a short time during the Russian Civil War. The prospect of joining forces with our Lithuanian brothers sounds very tempting to us."
 BLR_peaceful_litbel: "Red Flag Over Lithuania"
 BLR_peaceful_litbel_desc: "필요한 모든 준비를 마쳤습니다. 모든 요원, 모든 포섭된 시민과 정치인이 각자의 자리에 있습니다. 괴뢰 정부의 점령으로부터 리투아니아를 해방할 때입니다."
 BLR_the_litbel: "두 민족의 국가"
 BLR_the_litbel_desc: "The time has come for us to become a single country of two peoples - Belarusian and Lithuanian."
 BLR_dissolve_monasteries: "수도원의 해산"
 BLR_dissolve_monasteries_desc: "우리나라에서 종교를 완전히 정화할 것입니다!"
 BLR_support_of_the_worker: "노동자 지원"
 BLR_support_of_the_worker_desc: "노동 계급은 우리의 버팀목이자 힘입니다. 자본주의라는 전염병에 맞선 싸움에서 언제나 그들을 지지할 것입니다!"
 BLR_presidential_election_of_2001: "정치 문제"
 BLR_presidential_election_of_2001_desc: "새로운 천년에 누가 우리나라를 이끌지 결정할 때입니다."
 BLR_Andrey_sannikov: "Path of Western Democracy"
 BLR_Andrey_sannikov_desc: "우리나라는 새로운 지도자를 선출했습니다. 이제 그가 우리를 밝은 민주주의의 미래로 이끌 것입니다."
 BLR_Join_GUAM: "GUAM 가입"
 BLR_Join_GUAM_desc: "GUAM에 가입하여 구소련권에서의 유대를 강화할 것입니다."
 BLR_American_Protection: "미국 문제"
 BLR_American_Protection_desc: "러시아가 우리의 행동을 묵과할 가능성은 낮으므로 미국의 도움이 필요합니다."
 BLR_Linking_foreign_currency: "유로와 우리 통화를 연결"
 BLR_Linking_foreign_currency_desc: "우리 통화의 불안정성을 해소해야 합니다. 우리 통화를 유로에 연동할 것입니다."
 BLR_closed_border_with_Russia: "러시아와의 국경 봉쇄"
 BLR_closed_border_with_Russia_desc: "러시아와의 국경에 다시 초소를 세우고 있습니다. 러시아 영토에서 오는 누구도 우리나라로 자유롭게 이동할 수 없게 될 것입니다."
 BLR_NATO_Membership_Campaign: "NATO 회원국 캠페인"
 BLR_NATO_Membership_Campaign_desc: "NATO 가입을 준비하는 캠페인을 시작할 때입니다."
 BLR_USA_military_Cooperation: "미국 군사 연구 협력"
 BLR_USA_military_Cooperation_desc: "미국과의 군사기술 분야 협력은 우리에게 상당한 이점을 약속합니다."
 BLR_Invite_NATO_advisors: "NATO 군사 고문 초청"
 BLR_Invite_NATO_advisors_desc: "군 지휘부를 완전히 개혁했으므로 이제 NATO 군사 고문들을 초청할 것입니다."
 BLR_USAD_request: "USAID 요청"
 BLR_USAD_request_desc: "지원을 위해 USAID에 연락하기로 결정했습니다."
 BLR_Military_Exercises_NATO: "NATO와 군사 훈련"
 BLR_Military_Exercises_NATO_desc: "우리 군은 NATO와 첫 합동 훈련을 실시할 것입니다."
 BLR_NATO_integration_command: "NATO 통합 사령부"
 BLR_NATO_integration_command_desc: "NATO 통합 사령부는 동맹 가입을 향한 다음 단계입니다."
 BLR_Request_NATO_membership: "NATO 회원국 요청"
 BLR_Request_NATO_membership_desc: "NATO 가입을 신청할 때입니다."
 BLR_western_diplomats: "서방 외교관"
 BLR_western_diplomats_desc: "서방 국가의 외교관들이 우리를 방문하여 우리가 거둔 승리를 축하했습니다. 이제 벨라루스는 서방을 향한 길을 선택할 수 있습니다."
 BLR_denied_sanctions: "제재에서 벗어나자"
 BLR_denied_sanctions_desc: "정당한 선거를 치렀으므로 우리에 대한 모든 제재가 해제될 것입니다."
 BLR_people_rights: "인권"
 BLR_people_rights_desc: "우리 국민의 권리와 자유를 존중해야 합니다."
 BLR_Freedom_Meetings: "모임과 집회의 자유"
 BLR_Freedom_Meetings_desc: "집회와 결사의 권리가 보장되어야 합니다."
 BLR_dont_torture: "의료 개혁"
 BLR_dont_torture_desc: "양질의 의료는 우리 시민의 가장 기본적인 필요 중 하나입니다. 이를 제공함으로써 더 나은 나라를 만들 수 있을 것입니다."
 BLR_EU_integration: "유럽 연합과의 통합"
 BLR_EU_integration_desc: "We intend to integrate into the European Union."
 BLR_Attract_European_investments: "유럽 투자 유치"
 BLR_Attract_European_investments_desc: "경제를 개선하기 위해 유럽 투자자들을 유치할 준비가 되어 있습니다."
 BLR_Opening_garment: "유명 브랜드 대상 의류 공장 개업"
 BLR_Opening_garment_desc: "우리나라 영토에서 유명 브랜드를 위한 의류 생산을 시작할 준비가 되어 있습니다."
 BLR_simplification_labor_code: "노동법 간결화"
 BLR_simplification_labor_code_desc: "노동자들이 일하는 대신 끊임없이 노동조합에 의존하지 못하도록 노동법의 규범을 바꿔야 합니다."
 BLR_Encourage_Exchange_Students_desc: "우리 학생들은 유럽 학생들과의 교환 프로그램에 참여할 준비가 되어 있습니다."
 BLR_Adopt_EU_Intellectual: "EU의 지적 재산법 도입"
 BLR_Adopt_EU_Intellectual_desc: "이 분야에서 유럽 기준을 따르려면 EU 지식재산권법을 채택해야 합니다."
 BLR_Digitalization: "디지털화"
 BLR_Digitalization_desc: "생산 공정의 품질을 높이기 위해 디지털화해야 합니다."
 BLR_political_platforms: "해외 기업을 위한 정치 강령 제정"
 BLR_political_platforms_desc: "어쩌면 외국 기업에 우리 정치 플랫폼에 대한 접근을 허용해야 할지도 모릅니다."
 BLR_Custom_Institutional_reforms: "생물 연료"
 BLR_Custom_Institutional_reforms_desc: "대체 연료원은 우호 관계를 맺고 싶지 않은 나라들에 대한 의존도를 줄이는 데 도움이 될 수 있습니다."
 BLR_Market_Economy: "기능성 시장 경제"
 BLR_Market_Economy_desc: "완전한 시장 경제는 우리가 추구해 온 것이며, 유럽적이고 민주적인 나라에서 작동해야 하는 체제입니다."
 BLR_Delete_KGB2: "KGB 해체"
 BLR_Delete_KGB2_desc: "KGB를 새로운 조직인 국가안보국으로 대체할 것입니다. 이 조직은 우리의 서구적 이상에 충성하는 직원들로 충원될 것입니다."
 BLR_US_money: "미국의 투자"
 BLR_US_money_desc: "우리나라에서 민주주의를 더욱 구축하려면 자금이 필요합니다."
 BLR_join_wto: "WTO 가입"
 BLR_join_wto_desc: "WTO 가입은 우리에게 많은 이점과 국제 시장 접근성을 제공할 것입니다."
 BLR_release_political_prisoners: "정치범 석방"
 BLR_release_political_prisoners_desc: "이전 정부 아래에서 많은 사람이 정치적 이유로 투옥되었습니다. 이를 바로잡을 것입니다."
 BLR_baltic_economic_cooperation: "발트 국가들과의 무역 파트너쉽"
 BLR_baltic_economic_cooperation_desc: "가장 가까운 이웃은 훌륭한 무역 상대입니다. 이들의 해안 입지와 공동 국경은 우리의 무역 실적을 개선해야 할 강력한 이유를 제공합니다."
 BLR_root_out_nationalists: "국가주의자 제거"
 BLR_root_out_nationalists_desc: "민족주의자들은 우리나라에서 늘 문제였습니다. 이들은 불안정만 초래할 것이므로 이들을 처리할 때입니다."
 BLR_decommunize_belarus_society: "벨라루스 사회의 비공산화"
 BLR_decommunize_belarus_society_desc: "소련의 유산은 뒤로 하고 떠나야 합니다. 진보적인 서방을 받아들일 때가 왔습니다."
 BLR_fight_the_oligarchs: "올리가르히와 싸워라"
 BLR_European_university_connections: "유럽의 교육"
 BLR_European_university_connections_desc: "우리 학생들의 교육 수준을 높이기 위해 유럽 대학들을 우리나라에 맞이할 준비가 되어 있습니다."
 BLR_LGBT_Belarus_quest: "벨라루스의 성소수자 문제"
 BLR_LGBT_Belarus_quest_desc: "성소수자 문제는 이 추세를 무시할 수 없기에 정부의 의제로 올랐습니다. 우리는 어떻게 할 것입니까?"
 BLR_Offshore_heaven: "해외 투자자를 위한 세금 감면"
 BLR_Offshore_heaven_desc: "우리나라에 투자하기 좋은 조건을 조성하여 많은 투자자를 끌어들일 것입니다."
 BLR_wind_farms: "풍력 발전"
 BLR_wind_farms_desc: "민스크 지구에 풍력 발전 단지를 여러 곳 건설했습니다."
 BLR_Hajdukiewicz: "Gaidukevich"
 BLR_Hajdukiewicz_desc: "Sergey Vasilyevich Gaidukevich (born September 8, 1954) is a Belarusian politician and public figure, leader of the Liberal Democratic Party of Belarus. He is a reserve colonel known for his pro-Russian orientation. He stands for confederation with Russia and the introduction of a single currency with an issue center in Moscow, as well as for conducting a joint military policy."
 BLR_Spiritual_revival: "벨라루스의 정신적인 부활"
 BLR_Spiritual_revival_desc: "벨라루스의 정신적 부흥 과정은 계속되어야 합니다. 사회에서 정교회와 로마 가톨릭 교회의 역할이 커져야 합니다."
 BLR_Ban_Enemies: "내부의 적과 싸워라"
 BLR_Ban_Enemies_desc: "우리나라의 정치 무대를 완전히 정리해야 합니다. 해외에서 자금을 받는 파괴적인 정당들이 우리나라의 발전에 간섭해서는 안 됩니다."
 BLR_Russian_Oligarch: "러시아 올리가르히들과의 친선"
 BLR_Russian_Oligarch_desc: "러시아 올리가르히들은 막대한 부를 쥐고 있습니다. 이들을 포섭할 가치가 있다고 생각합니다."
 BLR_Son_will_rule: "그의 아들이 이끌게 하라"
 BLR_Son_will_rule_desc: "지도자를 교체할 때입니다. 이제 세르게이 가이두케비치의 아들이 당과 나라를 이끌 것입니다."
 BLR_Hardline_EuroScepticism: "강경한 유럽회의주의"
 BLR_Hardline_EuroScepticism_desc: "유럽은 약한 벨라루스를 원하기 때문에 강경한 유럽 회의주의가 필요합니다."
 BLR_Belarusian_nation_law: "벨라루스인들의 국가 정책"
 BLR_Belarusian_nation_law_desc: "우리 민족은 오래전부터 자결권을 가질 자격을 얻었습니다. 우리는 위대한 역사를 가진 민족이며, 주권 국가로서 밝은 미래를 향해 나아가야 합니다."
 BLR_russian_education: "러시아 교육"
 BLR_russian_education_desc: "우리 대학들은 러시아 대학들과 관계를 맺어야 합니다. 그렇게 하면 모든 사람에게 러시아식 교육을 제공할 수 있습니다."
 BLR_Union_state_again: "러시아와 함께"
 BLR_Union_state_again_desc: "우리는 다시 한번 러시아의 일부가 될 준비가 되어 있습니다."
 BLR_union_become_one: "연방은 하나다"
 BLR_Lykashenko: "Lukashenko"
 BLR_Lykashenko_desc: "Alexander Grigoryevich Lukashenko (born August 30, 1954) is a Belarusian politician, statesman, and military figure. He has held the post of President of Belarus and Commander-in-Chief of the Armed Forces since July 20, 1994. He is known for his pro-Russian views. In Belarusian and Russian-speaking societies, he is known by the nickname \"Batka\"."
 BLR_Impact_kgb: "KGB의 영향"
 BLR_Impact_kgb_desc: "KGB는 새 대통령의 당선에 불만을 가진 이들을 제거하기 위해 다양한 방법을 사용합니다."
 BLR_Liquidation_pub_assoc: "공공조합 청산"
 BLR_Liquidation_pub_assoc_desc: "KGB는 우리 대통령에게 눈엣가시인 공공 단체들을 적극적으로 해체하거나 해체하려 시도하고 있습니다."
 BLR_crackdown_opp_rall: "야당 집회 단속"
 BLR_crackdown_opp_rall_desc: "선거에 불만을 가진 정치적 반대 세력의 집회를 적극적으로 해산하고 있습니다."
 BLR_Increased_censorship: "언론 검열 강화"
 BLR_Increased_censorship_desc: "반대 세력이 우리에게 맞서 선동하지 못하도록 언론에 강력한 검열을 시행해야 합니다."
 BLR_concept_national_security_Belarus: "국가 보안 정책"
 BLR_concept_national_security_Belarus_desc: "이 개념은 개인, 사회, 국가의 이익 균형을 보장하고 이를 내외부의 위협으로부터 보호하기 위한 벨라루스 공화국 활동의 본질과 내용에 관한 공식 견해를 정립합니다."
 BLR_Economic_development_2001_2005: "사회 경제 발전 프로그램"
 BLR_Economic_development_2001_2005_desc: "2001~2005년 벨라루스 공화국 사회경제 발전 프로그램은 벨라루스 공화국 경제부가 다른 부처, 공화국 국가 행정 기관, 지역 집행위원회 및 민스크시 집행위원회와 공동으로, 국립과학원, 국립은행, 전문 연구소 및 공공 단체의 참여 아래, 벨라루스 공화국 법률 \\"벨라루스 공화국의 국가 예측 및 사회경제 발전 프로그램에 관하여\\"와 2001~2005년 벨라루스 공화국 사회경제 발전 프로그램 개발에 관한 2000년 2월 2일자 제141호 및 2000년 8월 10일자 제1248호 벨라루스 공화국 각료회의 결의에 따라 수립한 것입니다."
 BLR_reforms_Belarusian_Railway: "벨라루스 철도  개혁"
 BLR_reforms_Belarusian_Railway_desc: "우리 철도는 상태가 매우 나쁘므로 상황을 개선하기 위한 일련의 개혁을 시행할 것입니다."
 BLR_new_railway_station: "새로운 민스크 기차역"
 BLR_new_railway_station_desc: "민스크에 새 기차역을 건설했습니다. 이제 우리 도시는 더 많은 열차를 수용할 수 있게 되었습니다."
 BLR_Electrification_Myslishche_Kryzhovka: "Electrification of the Myslyshche-Kryzhovka"
 BLR_Electrification_Myslishche_Kryzhovka_desc: "믜슬리셰-크리조프카 노선은 우리나라에서 개발 우선순위가 가장 높은 곳 중 하나이므로 가장 먼저 다룰 것입니다."
 BLR_Baranovichi_Plant: "바라나비치 발전소"
 BLR_Baranovichi_Plant_desc: "열차에 대한 부품 공급을 개선하기 위해 바라노비치 건설 부품 및 구조물 공장의 구조 부서를 신설하고 있습니다."
 BLR_Energy_conflict_over: "Sale of Beltransgaz"
 BLR_Energy_conflict_over_desc: "분쟁이 끝나가고 있습니다. 우리는 러시아의 조건에 동의했으며 벨트란스가스를 매각할 준비가 되었습니다. 그 대가로 우리의 에너지 가격은 안정될 것입니다."
 BLR_new_rolling_stock: "새로운 철도 차량 구매"
 BLR_new_rolling_stock_desc: "새 철도 차량을 구매함으로써 우리 철도를 괴롭히는 가장 큰 문제를 해소할 것입니다."
 BLR_promise_first_nuclear: "원자력 발전소 건설 약속"
 BLR_promise_first_nuclear_desc: "우리는 모든 시민에게 우리나라 영토에 원자력 발전소가 건설될 것이며, 그럼으로써 에너지 안보가 보장될 것임을 약속합니다."
 BLR_New_Land_code: "새로운 토지법"
 BLR_New_Land_code_desc: "새 토지법은 개인 소유자와 기업의 토지 구매를 크게 간소화하여 특정 계층의 호응을 얻을 것이 분명합니다."
 BLR_Zubr_Energy_LLC: "주브르 에너지 유한회사 개업"
 BLR_Zubr_Energy_LLC_desc: "세계 및 국내 자동차 제조사의 컨베이어 라인에 납품할 시동용 배터리를 생산하는 공장입니다."
 BLR_Hi_Tech_Park: "첨단 기술 단지"
 BLR_Hi_Tech_Park_desc: "하이테크 파크는 벨라루스의 IT 사업 발전을 위한 특별 세제 및 법제 체제입니다. 이는 자유(특별) 경제 구역은 아니지만 치외법권의 원칙에 따라 운영되는 관할 구역입니다. 파크에 등록된 기업과 개인 사업자는 벨라루스 사무소의 위치와 관계없이 제공되는 특혜를 이용할 수 있습니다."
 BLR_Referendum_Belarus_2004: "2004년 벨라루스 총선거"
 BLR_Referendum_Belarus_2004_desc: "2004년 10월 17일, 벨라루스에서는 독립 벨라루스 역사상 루카셴코 대통령이 주도한 세 번째 공화국 국민투표가 실시되었습니다. 이 국민투표는 2004년 9월 7일자 대통령령 제431호에 의해 지정되었으며 총선과 함께 치러졌습니다."
 BLR_Energy_conflict: "러시아 벨라루스 에너지 갈등"
 BLR_Energy_conflict_desc: "이 분쟁은 2006년 12월 가스프롬이 벨라루스 공화국에 대한 천연가스 가격의 최종안을 1000 m3당 $ 105로 발표하면서 시작되었습니다. 이 중 $75는 현금으로 지불하고, 나머지 30은 $ 50억으로 평가된 벨트란스가스 지분으로 지불할 권리를 벨라루스가 갖게 됩니다."
 BLR_Decree_n3: "기생충에 대한 명령"
 BLR_Decree_n3_desc: "이제 누구도 국가 보조금에 기대어 앉아 있지 못할 것입니다. 놀고 있는 모든 이를 일하게 할 때입니다."
 BLR_launch_own_satellite: "벨라루스의 자국 위성 발사"
 BLR_launch_own_satellite_desc: "벨라루스 지구 원격탐사 위성은 2012년 7월 22일 카자흐스탄의 바이코누르 우주기지에서 발사되었으며, 러시아의 카노푸스-V 및 MKA-FKI(조프-PP), 독일의 TET-1, 캐나다의 ADS-1B와 함께 5기 우주선 묶음으로 발사되었습니다."
 BLR_gasification_country: "국가의 가스화 완료"
 BLR_gasification_country_desc: "우리나라의 가스화를 완료할 것이며, 우리 시민들은 틀림없이 이를 높이 평가할 것입니다."
 BLR_CJSC_Turkcell: "투르크셀과의 거래"
 BLR_CJSC_Turkcell_desc: "우리와 튀르키예 협력자들 사이에 중요한 거래가 이루어질 것입니다. 바로 CJSC \\"BeST\\"의 지배 지분을 튀르크셀에 매각하는 것입니다. 이는 우리나라에 대한 또 다른 투자 통로를 열어줄 것입니다."
 BLR_Anti_Corruption: "반부패 운동"
 BLR_Anti_Corruption_desc: "우리나라의 부패를 물리쳐야 합니다. 중요한 것은 자신이 연루되지 않는 것입니다."
 BLR_Punish_Shushkevich: "Punish Shushkevich's Cronies"
 BLR_Punish_Shushkevich_desc: "슈슈케비치는 정부 내 충성파라는 형태로 유산을 남겼습니다. 이들을 제거할 때입니다."
 BLR_Promote_new_officers: "벨라루스 군제 개혁 완료"
 BLR_Promote_new_officers_desc: "1994년에 시작된 우리 군의 개편을 위한 일련의 조치를 완료할 것입니다."
 BLR_Internet_cencorship: "인터넷 검열"
 BLR_Internet_cencorship_desc: "인터넷은 정부 전복을 노리는 정서가 공공연히 논의되는 장이 되었습니다. 이를 통제할 필요가 있습니다."
 BLR_Raiffeisen2: "벨라루스의 라이페이센 은행"
 BLR_Raiffeisen2_desc: "1989년에 설립된 프리오르방크는 2003년부터 RBI의 자회사입니다. 이 은행은 국내 최대 민간 은행 중 하나이며 효율성과 수익성 면에서 국가의 선도적 금융 기관 중 하나입니다. 종합 은행으로서 기업 고객, 중소기업, 개인 고객에게 서비스를 제공합니다."
 BLR_Henkel2: "헨켈 건설 화학"
 BLR_Henkel2_desc: "헨켈 그룹의 벨라루스 내 건설 화학 사업부인 헨켈 바우테흐니크 LLC는 수입 대체 제품 생산을 조직하기 위해 2004년에 설립되었습니다. 2005년 자슬라블에서 체레지트 건축용 혼합재 생산 공장 건설이 시작되어 2006년 9월에 생산이 개시되었습니다. 이 회사의 제품군에는 기성품 외장재, 단열 및 외벽 마감 체계, 바닥재 및 방수 체계, 마감을 위한 표면 처리 재료, 실란트, 시공용 폼, \\"액체 못\\", 미장재 등 100가지가 넘는 품목이 포함됩니다."
 BLR_Jeans_Revolution: "청바지 혁명"
 BLR_Jeans_Revolution_desc: "앞서 치러진 대통령 선거에서 당국이 저지른 조작에 항의하여 2006년 3월 19일 시작된 민스크 중심부와 벨라루스 다른 도시들의 대규모 항의 집회입니다."
 BLR_reform_kolhoz: "집단 농장 개혁"
 BLR_reform_kolhoz_desc: "우리 농공업의 안정을 보장하려면 집단 농장을 개혁해야 합니다."
 BLR_Eastern_Partnership: "동쪽과의 협력"
 BLR_Eastern_Partnership_desc: "동방 파트너십은 유럽 연합의 사업으로, 유럽 연합이 아제르바이잔, 아르메니아, 벨라루스, 조지아, 몰도바, 우크라이나 등 옛 소련의 6개국과 통합적 유대를 발전시키는 것을 주된 공식 목표로 합니다."
 BLR_Azarenok_case: "장군 이고르 아자레노크 사건"
 BLR_Azarenok_case_desc: "아자레노크 장군은 뇌물과 그 밖의 사기를 통해 벨라루스 공화국에서 러시아의 이익을 위해 로비를 벌인 혐의를 받았습니다. 이 문제에 주목해야 합니까?"
 BLR_National_Library: "국립 도서관의 새로운 건물"
 BLR_National_Library_desc: "전국이 건설에 참여한 벨라루스 국립도서관의 새 건물이 2006년 6월 16일 이용자들에게 개방되었습니다."
 BLR_delta_city: "\"델타 도시\" 상업 중심지"
 BLR_delta_city_desc: "민스크에서 열린 세르비아 국가 박람회 중에 델타 시티 비즈니스 센터 건설과 국립도서관 인근 지역 개발에 관한 대규모 계약이 총 수십억 유로의 투자 규모로 체결되었습니다(개발사는 세르비아 사업가들이 소유한 다나 홀딩스입니다)."
 BLR_BRSM_desc: "벨라루스 공화국 청년 동맹은 벨라루스 공화국의 청년 사회 단체입니다. 국내 최대의 청년 단체이며 알렉산드르 루카셴코의 지지를 받고 있습니다. 활동 자금은 국가가 지원합니다."
 BLR_Potato_Empire: "감자의 제국"
 BLR_Potato_Empire_desc: "We are one of the top potato exporters in the world. Our country should be proud of this."
 BLR_Factory_Kommunarka: "콤무나르카 사탕 공장 국유화"
 BLR_Factory_Kommunarka_desc: "우리 대통령은 제과 공장 \\"콤무나르카\\"의 민영화가 불법이었다고 보고 있으며, 이에 따라 이 기업의 국유화가 발표되었습니다."
 BLR_Another_year: "또 다른 해방의 해"
 BLR_Another_year_desc: "벨라루스는 계속해서 독자 노선을 따를 것입니다."
 BLR_Migrant_crisis: "이민 위기"
 BLR_Migrant_crisis_desc: "벨라루스 국경의 이민 위기는 주로 이라크와 시리아에서, 그보다 적게는 아프가니스탄과 아프리카 국가들에서 온 불법 이민자들이 (폴란드 국경수비대 통계에 따르면) EU 국가(리투아니아, 라트비아, 폴란드)로 들어가려 하면서 유입됨에 따라 발생했습니다."
 BLR_Another_Elections: "다시 선거로"
 BLR_Another_Elections_desc: "우리나라의 다음 선거가 코앞으로 다가왔습니다. 누가 이길까요?"
 BLR_Bye_opposition: "반대파에게 자비란 없다"
 BLR_Bye_opposition_desc: "우리는 늘 하던 대로 합니다. 야당을 강경하고 신속하게 처리합니다."
 BLR_Milk_war: "유제품 전쟁"
 BLR_Milk_war_desc: "러시아로의 유제품 수출을 둘러싼 분쟁에서 비롯된 벨라루스와 러시아 간의 일련의 관계 악화입니다."
 BLR_Changes_Customs_policy: "관세 정책 변경"
 BLR_Changes_Customs_policy_desc: "위조품이 우리나라로 수입되는 것을 어렵게 하기 위해 새로운 변경 사항과 규제가 도입되었습니다."
 BLR_whitelegion_case: "백 군단 사건"
 BLR_whitelegion_case_desc: "우리 정보기관이 백색 군단 대표들의 활발한 활동을 보고했습니다. 이들을 체포하여 감옥에 가두어야 합니다."
 BLR_PolBel_Dplomatic_war: "폴란드-벨라루스 외교전"
 BLR_PolBel_Dplomatic_war_desc: "관계가 개선되고 있음에도 폴란드와의 갈등이 예전의 기세로 다시 불붙고 있습니다."
 BLR_project_bombel: "벨라루스 국경 (BOMBEL) 프로젝트"
 BLR_project_bombel_desc: "유럽 연합은 불법 이민자의 유입에 맞서 벨라루스와 EU 사이의 국경을 강화하기 위해 자금을 배정했습니다. 우리 측 사업은 이 자금을 어떻게 사용할지 결정하고 있습니다."
 BLR_Investing_Agro_industry: "농업 투자"
 BLR_Investing_Agro_industry_desc: "농공업은 우리 경제의 중요한 구성 요소이며, 이 부문에 대한 투자를 계속 늘릴 것입니다."
 BLR_fate_belarusian_church: "벨라루스 교회의 운명"
 BLR_fate_belarusian_church_desc: "우리 교회가 나아갈 길을 결정해야 합니다."
 BLR_Pension_reform: "연금 개혁"
 BLR_Pension_reform_desc: "연금 개혁을 시행하고 은퇴 연령을 높일 때입니다."
 BLR_People_Militia: "Creation of People's Militia"
 BLR_People_Militia_desc: "영토 방위군의 예비 전력 격인 인민 민병대 창설에 관한 법을 채택할 준비가 되어 있습니다. 모든 마을에는 적에 맞설 훈련된 집단이 있어야 하며, 이후 빨치산 운동으로 전환됩니다."
 BLR_Wagner_arrest: "Situation With PMCs Wagner"
 BLR_Wagner_arrest_desc: "우리 정보기관이 유명한 러시아 민간 군사 기업 바그너의 대원들을 체포했습니다. 이들을 어떻게 할지 결정해야 합니다."
 BLR_Country_for_life: "삶의 나라"
 BLR_Country_for_life_desc: "우리 정부는 야당 인사들을 우리 편으로 끌어들이는 방식으로 더욱 교활하게 야당에 대처하기로 했습니다. 그중 한 명이 \\"삶을 위한 나라\\" 사업의 조직자 세르게이 티하놉스키입니다. 이후의 사태를 겪은 뒤 우리는 그를 체포하는 대신 공개적으로 정부에 초청했으며, 그는 이곳에서 우리나라를 개선하는 데 기여할 수 있습니다. 이러한 조치로 야당 자체가 분열될 것입니다."
 BLR_Amendment_to_Constitution: "중대한 헌법 개정"
 BLR_Amendment_to_Constitution_desc: "우리의 종신 지도자 알렉산드르 루카셴코는 나라에 근본적인 변화가 필요하며 대통령 단독 권력에서 벗어날 때가 되었음을 인정했습니다. 권력이 주로 의회에 귀속되는 헌법 개정 국민투표가 발표되었습니다."
 BLR_army_on_streets_of_cities: "대규모 시위"
 BLR_army_on_streets_of_cities_desc: "국민이 우리에게 반기를 들었습니다. 그들은 우리 정부가 선거 결과를 조작하고 나라를 망치고 있다고 믿습니다. 이런 사태에 잘 대비했기를 바랍니다."
 BLR_Pazniak: "Belarusian Nationalists"
 BLR_Pazniak_desc: "Nationalist forces have seized power in the country. Where will they lead Belarus: toward a brighter future, or toward the country's collapse?"
 BLR_patriotism_desc: "우리나라의 애국 교육 수준을 높일 때입니다."
 BLR_Belarusisation: "벨라루스화"
 BLR_Belarusisation_desc: "모든 문헌과 모든 공식 직함은 벨라루스어로 되어야 합니다."
 BLR_Democratic_clean: "민주주의자 제거"
 BLR_Democratic_clean_desc: "우리는 서방의 하수인이 되지 않을 것입니다. 우리나라에서 민주주의자들을 숙청할 때입니다."
 BLR_Communistst_clean: "공산주의 제거"
 BLR_Communistst_clean_desc: "소련의 유산은 파괴되어야 합니다. 붉은 전염병의 신봉자들을 몰아낼 때입니다."
 BLR_denied_rus_language: "러시아의 언어 거부"
 BLR_denied_rus_language_desc: "러시아어는 더 이상 제2 국가 언어가 아닙니다. 러시아의 점령은 이제 충분합니다."
 BLR_anti_immigration_policies: "반이민 정책"
 BLR_anti_immigration_policies_desc: "더 엄격한 반이민 정책을 시행하면 벨라루스의 정체성을 온전하게 지킬 수 있을 것입니다."
 BLR_russofobia: "Anti-Russian Policy"
 BLR_russofobia_desc: "공통의 적 러시아를 상대할 때입니다. 우리를 향한 러시아의 제국주의적 야심을 길들일 때입니다."
 BLR_decolectivisation: "비집단화"
 BLR_decolectivisation_desc: "소련의 유산을 없애고 주민이 도시로 이주하도록 도울 때입니다."
 BLR_litvins_past: "리투아니아인의 과거"
 BLR_litvins_past_desc: "역사는 바꿀 수 없으며 우리는 그것을 압니다. 우리 리트빈인은 리투아니아 대공국의 자랑스러운 후계자입니다."
 BLR_constitution_from_1994: "1994년 헌법"
 BLR_constitution_from_1994_desc: "우리나라에 올바른 헌법을 복원할 때입니다."
 BLR_We_not_energy_slave: "우리는 러시아 자원의 노예가 아니다"
 BLR_We_not_energy_slave_desc: "러시아는 자신의 괴뢰 정권을 지원하기 위해서만 할인을 해주었습니다. 이제 충분합니다. 우리는 그런 할인 없이도 강한 경제를 건설할 준비가 되어 있습니다."
 BLR_Influence_nationalists: "국가주의자의 영향"
 BLR_Influence_nationalists_desc: "이웃 나라들의 민족주의 운동을 적극적으로 지원해야 합니다."
 BLR_Territorial_claims: "영유권 주장"
 BLR_Territorial_claims_desc: "우리나라는 진정한 국경으로 돌아가야 합니다."
 BLR_white_legion_desc: "백색 군단은 1995년에 징집 전 훈련과 청소년 애국 교육을 위해 설립된 벨라루스의 체육 및 애국 단체입니다."
 BLR_white_legion_battalion: "백 군단의 대대"
 BLR_white_legion_battalion_desc: "백색 군단의 첫 대대가 마침내 편성되었습니다. 조국의 진정한 애국자들이 자유와 힘을 위해 싸울 준비가 되어 있습니다."
 BLR_GDL: "리투아니아 대공국"
 BLR_GDL_desc: "리트빈 민족의 위대한 국가를 복원할 때입니다. 마침내 우리 민족은 초강대국의 멍에 아래 있지 않게 될 것이며, 스스로 초강대국이 될 기회를 얻게 될 것입니다."
 BLR_help_silesians: "실레시아 분리주의자들을 도와라"
 BLR_help_silesians_desc: "분할 통치는 우리가 폴란드에 대한 정책에서 적용할 핵심 원칙입니다. 폴란드인을 우리 통제 아래 두는 적극적 단계가 시작되면, 실레시아인들이 그 나라 정복을 수월하게 하는 데 도움이 될 수 있습니다."
 BLR_lith_again: "다시 제마이티야"
 BLR_lith_again_desc: "강대한 우리 국가의 재건을 완성할 때가 왔습니다. 작고 약한 리투아니아가 우리 앞을 가로막고 있으며, 우리는 이를 꺾을 것입니다. 하지만 명분 없이 그 나라를 공격할 수는 없습니다. 우리의 침공이 근거 없어 보이지 않도록 필요한 조건과 구실을 만들어야 합니다."
 BLR_true_political_and_national_freedom: "정치적 자유"
 BLR_true_political_and_national_freedom_desc: "진정한 정치적 자유는 내부 숙청이 초래한 참화에서 회복하는 것에서 시작됩니다. 앞으로 나아가 우리 국민이 진정으로 바라는 것을 이룰 때입니다."
 BLR_Taler_ruble: "벨라루스 탈레르 통화 "
 BLR_Taler_ruble_desc: "루블을 완전히 버리고 새로운 통화로 대체해야 합니다."
 BLR_National_science: "Scientific And Economic Growth"
 BLR_National_science_desc: "독립 국가로서 우리 자체의 과학과 경제를 발전시키기 시작할 것입니다."
 BLR_Delete_KGB: "KGB 해체"
 BLR_Delete_KGB_desc: "KGB는 해체되고 새로운 기구로 대체되어야 합니다."
 BLR_Reform_Police: "경찰 개혁"
 BLR_Reform_Police_desc: "소련식 민병대는 우리가 없애고 싶은 과거의 유물이었습니다. 우리는 이를 폴란드를 본뜬 국가 경찰로 재편하고 있습니다."
 BLR_attack_russian_bear: "Finish off the Russian Bear"
 BLR_attack_russian_bear_desc: "마침내 우리의 주적이 무너질 것입니다."
 BLR_Young_Front_desc: "청년 전선은 벨라루스 청년들의 국제 청년 운동이자 벨라루스의 청년 야당 조직입니다."
 BLR_south_river_battalion: "사우스 리버 대대"
 BLR_south_river_battalion_desc: "사우스리버 카운티의 미국 주민들로 편성된 대대입니다."
 BLR_territorial_reform: "영토 개혁"
 BLR_territorial_reform_desc: "제논 포즈냐크와 강령 집필진은 현재의 6개 주와 110개 구 대신 나라를 16개 보이보드십과 별도의 민스크로 나눌 것을 제안합니다. 보이보드십은 다시 60개 도와 270개 구시가지로 나뉘게 됩니다."
 BLR_anti_lgbt: "혈연 관계에 대한 선전 금지"
 BLR_anti_lgbt_desc: "가족, 혼인(남녀의 결합), 모성의 우선성과 보호에 관한 법, 그리고 이념과 조직이 가족 문제를 침해하고 간섭하는 것으로부터 가족을 보호하는 법을 채택합니다. 이와 더불어 \\"인간 본성 보호에 관한\\" 법을 채택하여 인간의 자연스러운 본성에 반하는 도착적 관계의 선전을 금지할 것을 제안합니다."
 BLR_latgale_or_war: "라트갈레 또는 전쟁"
 BLR_latgale_or_war_desc: "라트갈레는 한때 리투아니아 대공국의 일부였습니다. 이 땅을 우리 국가로 되돌릴 때가 왔습니다. 라트비아가 우리에게 저항할 수 있을 가능성은 낮습니다."
 BLR_legacy_kurland: "쿠를란트 공국의 유산"
 BLR_legacy_kurland_desc: "쿠를란트 공국은 한때 식민지 경쟁에 손을 뻗었습니다. 공국의 깃발은 한때 트리니다드 토바고와 감비아 해안을 따라 휘날렸습니다. 공국의 정당한 계승자로서, 이 영토들을 우리 제국에 되돌려 받고 과거의 식민지 보유지들을 다시 품 안으로 데려올 때가 왔습니다."
 BLR_pro_poland_propoganda: "Pro-Belarusian Propaganda in Poland"
 BLR_pro_poland_propoganda_desc: "선전과 그 밖의 교류 수단을 통해 폴란드에 대한 우리의 영향력을 늘려야 합니다."
 BLR_Dismiss_soviet_officers: "Dismiss Pro-Soviet Officers"
 BLR_Dismiss_soviet_officers_desc: "소련 유산에 맞선 투쟁은 군대에까지 미쳐야 합니다. 그 피로 얼룩진 정권에 동조하는 장군은 필요하지 않습니다."
 BLR_Anti_corruption_law: "반부패법"
 BLR_Anti_corruption_law_desc: "모든 형태의 부패에 맞서 싸울 것입니다."
 BLR_open_border_with_pol: "국경 개방"
 BLR_open_border_with_pol_desc: "국경 개방은 우리 민족들이 경제적으로뿐만 아니라 물리적으로도 연결되어 있음을 느끼도록 도울 것입니다."
 BLR_training_for_pol: "합동군사훈련"
 BLR_training_for_pol_desc: "우리 군대에는 전투 협조가 필요합니다. 합동 군사 훈련이 이에 큰 도움이 될 것입니다."
 BLR_Asseco_Poland: "아세코 폴란드 소프트웨어사"
 BLR_Asseco_Poland_desc: "이 기업을 인수하여 벨라루스인과 폴란드인의 미래 국가의 자산으로 만들 것입니다."
 BLR_ynia_Poland: "두번째 루블린 연방"
 BLR_ynia_Poland_desc: "루블린 합동이 리투아니아 대공국에 얼마나 굴욕적이었는지 상기할 때입니다. 이번에는 다를 것입니다."
 BLR_Ukraine_way: "우크라이나와의 친선"
 BLR_Ukraine_way_desc: "영토 주장에도 불구하고 우리는 공동의 적에 맞서 우크라이나와 대화할 준비가 되어 있습니다. 적들에게 둘러싸인 상황에서 우리 국가들이 살아남도록 도울 동맹을 만들 수도 있습니다."
 BLR_Join_GUAM_to_Ukraine: "GUAM 가입"
 BLR_Join_GUAM_to_Ukraine_desc: "우크라이나를 향한 우리의 첫 우호적 조치 중 하나는 우크라이나가 주도적 역할을 하는 기구인 GUAM에 가입하는 것입니다."
 BLR_training_with_ukr: "합동군사훈련"
 BLR_training_with_ukr_desc: "우리는 우크라이나군에 기동 연습과 부대 협조를 위한 합동 훈련을 제안할 준비가 되어 있습니다."
 BLR_military_coop_with_ukraine: "Military-Technical Cooperation"
 BLR_military_coop_with_ukraine_desc: "우크라이나 군수 산업 복합체와 군사기술 협력을 구축할 준비가 되어 있습니다."
 BLR_Intermarium: "인테르마리움"
 BLR_Intermarium_desc: "우크라이나와 강력한 동맹으로 뭉쳐 함께 적에 맞설 때입니다."
 BLR_Intermarium_poland: "인테르마리움"
 BLR_Intermarium_poland_desc: "폴란드와 강력한 동맹으로 뭉쳐 함께 적에 맞설 때입니다."
 BLR_Ukraine_enemy: "우크라이나 영토 장악"
 BLR_Ukraine_enemy_desc: "역사적으로 이 땅은 리투아니아 대공국에 속해 있었습니다. 그릇된 우정의 유대가 이 땅을 우리의 위대한 국가로 되찾는 일을 가로막아서는 안 됩니다."
 BLR_Sovereign_Internet: "자주적인 인터넷"
 BLR_Sovereign_Internet_desc: "다른 나라가 우리 시민에게 영향을 미치지 못하도록 우리의 인터넷 공간을 다른 나라로부터 완전히 독립시켜야 합니다."
 BLR_Expand_Mozyr_Refinery: "모지르 정유소 확장"
 BLR_Expand_Mozyr_Refinery_desc: "이 정유소를 확장할 것입니다."
 BLR_Expand_Naftan_Refinery: "나프탄 정유소 확장"
 BLR_Expand_Naftan_Refinery_desc: "이 정유소를 확장할 것입니다."
 BLR_Expansion_Okolovsky_Novoselkovsky: "광산 생산량 확장"
 BLR_Expansion_Okolovsky_Novoselkovsky_desc: "오콜롭스키와 노보셀콥스키 광상의 광석 생산을 확대하면 많은 강철을 얻을 수 있을 것입니다."
 BLR_Problem_duying_vilages: "죽어가는 마을에 대한 문제"
 BLR_Problem_duying_vilages_desc: "사라져 가는 마을을 어떻게 할지 우리 국가가 결정해야 할 때입니다."
 BLR_Economic: "벨라루스 경제"
 BLR_Economic_desc: "우리는 경제를 발전시켜야 하며, 이를 성공적으로 달성하기 위해 여러 조치를 취하고 있습니다."
 BLR_GrodnoAzot: "그로노 아조트 석유화학기업"
 BLR_GrodnoAzot_desc: "그로드노 아조트 OJSC의 힘볼로크노 공장 지사는 폴리아미드 및 폴리에스터 실과 섬유, 그리고 이를 기반으로 한 폴리아미드-6(PA-6)과 고분자 복합 재료의 대형 제조업체입니다. 주요 제품군은 각각 용도에 따라 다양한 물리적, 기계적 특성과 품질 지표를 갖춘 폭넓은 구성으로 생산됩니다."
 BLR_AirPort_minsk: "국제 공항 확장"
 BLR_AirPort_minsk_desc: "민스크 공항 확장에 상당한 재원을 투입할 준비가 되어 있습니다."
 BLR_it_industries_help: "Help Domestic IT Developers"
 BLR_it_industries_help_desc: "우리가 할 수 있는 모든 것으로 IT 부문을 지원해야 합니다. 이것이 우리나라의 미래입니다."
 BLR_viber: "바이버 (Viber) 메신저"
 BLR_viber_desc: "바이버는 인터넷을 통해 메시지를 보내고 영상 및 음성 VoIP 통화를 할 수 있는 메신저 애플리케이션입니다. 바이버가 설치된 사용자 간의 음성 통화는 무료입니다. 바이버는 텍스트, 음성 및 영상 메시지, 문서, 이미지, 동영상, 파일을 보낼 수 있으며 오프라인에서도 작동합니다."
 BLR_wot: "월드 오브 탱크"
 BLR_wot_desc: "월드 오브 탱크는 20세기 중반의 장갑차량을 소재로 한 클라이언트 기반 팀 대규모 다중 접속 온라인 게임입니다. 플레이어는 실제 제2차 세계 대전 장소를 바탕으로 만들어진 40개가 넘는 전투 지도와 11개국의 고증된 장비 총 600여 종을 사용할 수 있습니다."
 BLR_russian_gazprom: "가스프롬"
 BLR_russian_gazprom_desc: "가스프롬은 가스 및 석유 시장의 중요한 주체입니다. 이들과 가능한 한 가장 긴밀한 협력을 구축해야 합니다."
 BLR_BPS_Sberbank: "BPS 스베르은행"
 BLR_BPS_Sberbank_desc: "BPS 스베르뱅크는 러시아 스베르뱅크의 우리 영토 내 지점입니다."
 BLR_Belgazprombank: "벨가스프롬 은행"
 BLR_Belgazprombank_desc: "벨가즈프롬방크는 가즈프롬방크의 벨라루스 지점입니다."
 BLR_Development_domestic_tourism: "국내 관광업의 개발"
 BLR_Development_domestic_tourism_desc: "우리는 국내 관광에서 큰 잠재력을 보고 있습니다. 이에 따라 각 의원은 자신의 지역구 관광 발전에 기여할 것입니다. 과학적, 방법론적 자료는 충분하므로 핵심 과제는 적절한 인프라를 구축하는 것입니다."
 BLR_private_railways: "민자 철도 회사"
 BLR_private_railways_desc: "철도를 민간 기업에 이전할 것입니다."
 BLR_Lith_pol_railways: "폴란드 및 리투아니아와의 철도 연결"
 BLR_Lith_pol_railways_desc: "우리는 이들 국가와 양질의 철도 연결을 건설하고자 하며, 이는 우리에게 유럽 상품에 대한 접근권을 제공할 것입니다."
 BLR_JSC_russian_railways: "러시아 철도"
 BLR_JSC_russian_railways_desc: "이제 우리는 러시아 철도와 완전히 통합되었습니다."
 BLR_belavia: "벨라비아 항공"
 BLR_belavia_desc: "민스크에 본사를 둔 벨라루스 국영 항공사입니다. 1996년에 설립되었습니다. 주요 정기 및 전세 국제선은 민스크 국제공항에서 운항됩니다."
 BLR_Danone: "다논 식품 회사"
 BLR_Danone_desc: "유제품과 그 밖의 식품 제조업체로 잘 알려진 프랑스의 식품 기업입니다."
 BLR_Godel_tech: "고델 기술"
 BLR_Godel_tech_desc: "맨체스터에 본사를 두고 영국 주요 기업에 소프트웨어 개발 솔루션을 제공하는 영국 기업입니다."
 BLR_Basf_tech: "바스프 (BASF) 화학 회사"
 BLR_Basf_tech_desc: "BASF Societas Europaea(BASF)는 독일, 유럽, 그리고 세계 최대의 화학 기업입니다. 본사는 독일 남서부 라인란트팔츠주의 루트비히스하펜시에 있습니다."
 BLR_royal_dutch_shell: "로열 더치 쉘"
 BLR_royal_dutch_shell_desc: "셸은 영국-네덜란드계 석유 및 가스 기업입니다."
 BLR_mts: "MTS 통신 회사"
 BLR_mts_desc: "MTS is a Russian company providing telecommunications services, digital and media services in Russia, Armenia and Belarus under the trademark \"MTS\". The company provides cellular communication services (in UMTS (3G), 4G, LTE and 5G standards), wired telephone services, broadband Internet access, mobile television, cable television, satellite television, digital television, media and entertainment content services, financial services, as well as convergent IT solutions in the field of the Internet of Things, monitoring, process automation, data processing and cloud computing."
 BLR_pol_revol_category: "폴란드를 전복시키기 위한 국가주의자 초대"
 BLR_pol_revol_category_desc: "We must take revenge on Poland for all the years it attempted to destroy our independence, for the humiliating Union of Lublin, and for the division of our country in the 20th century. We will put the Polish people in a position where they will have no choice but to obey us."
 BLR_Establish_cooperation_pol: "폴란드 국가주의자들과의 연대"
 BLR_podlasie_return: "비아위스토크 수복"
 BLR_podlasie_return_desc: "Bialystok has always been a land inhabited by Belarusians. It is time to reclaim this land from the Poles and return it to the Belarusian state."
 BLR_Duchy_claims_category: "영유권 주장"
 BLR_Duchy_claims_category_desc: "We well remember the history of the Grand Duchy of Lithuania and all the lands that were under its command. We will declare our territorial claims over all our former territories."
 BLR_ukraine_claims: "Territorial Claims to §Y[UKR.GetNameWithFlag]§!"
 BLR_poland_claims: "Territorial Claims to §Y[POL.GetNameWithFlag]§!"
 BLR_russia_claims: "Territorial Claims to §Y[SOV.GetNameWithFlag]§!"
 BLR_latgale_claims: "Territorial Claims to §Y[LAT.GetNameWithFlag]§!"
 BLR_samogitia_return: "사모기티아 통합"
 BLR_sudovia_return: "수도비아 통합"
 BLR_klaipeda_return: "클라이페다 통합"
 BLR_latgale_return: "라트갈레 통합"
 BLR_Lukashenko_category: "루카셴코의 법칙"
 BLR_Lukashenko_category_desc: "Lukashenko's rule is clearly authoritarian in nature and seeks only one goal - to stay in power at any cost.\n§W--------------§!\nAt the moment, the percentage of support for Alexander Grigoryevich Lukashenko is equal to §Y[?BLR.batka]§!"
 BLR_send_russian_omon: "시위 진압을 위해 러시아 기동대 요청"
 BLR_go_to_jail_scum: "반대파를 투옥하라"
 BLR_trade_with_iraq: "이라크에 무기 제공"
 BLR_fly_protasevich: "프로타세브치가 탑승 라이언에어 항공기 착륙"
 BLR_Deal_with_Poland: "폴란드인 연합 (Union of Poles)과의 거래"
 BLR_New_concept_security: "국가 보안의 새로운 정책"
 BLR_people_militia: "People's Militia"
 BLR_people_militia_desc: "\\"그러나 상황은 쉽지 않습니다. 저는 한두 번 말한 것이 아닙니다. 모든 남자는(그리고 남자뿐만 아니라) 적어도 무기를 다룰 줄 알아야 합니다. 적어도 필요할 때 가족과 집, 고향 땅, 그리고 필요하다면 나라를 지키기 위해서입니다. 나라가 없다면 고향도, 집도, 그 어떤 것도 없을 것입니다. 많은 사람들이 이를 이해하고 있습니다.\\"라고 알렉산드르 루카셴코는 강조했다."
 BLR_Kommunarka_category: "콤무나르카 제과점"
 BLR_Kommunarka_category_desc: "이제 공장을 완전히 국유화했으므로 공장에서 나오는 수입 전체를 받을 수 있게 되었습니다."
