 GER_attack_helicopter_1: "MBB Bo 105P"
 GER_attack_helicopter_1_desc: "Messerschmitt-Bölkow-Blohm Bo 105 — это лёгкий двухдвигательный многоцелевой вертолёт, разработанный компанией Bölkow из Оттобрунна, Западная Германия. Это был первый в мире лёгкий двухдвигательный вертолёт и первый винтокрылый аппарат, способный выполнять фигуры высшего пилотажа, такие как перевёрнутые петли. Вариант 105P — противотанковый вариант, вооружённый управляемыми по проводам противотанковыми ракетами HOT."
