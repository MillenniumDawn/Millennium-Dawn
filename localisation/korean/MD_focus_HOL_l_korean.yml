 landmark_binnenhof_desc: "네덜란드 통치의 역사적 중심지인 비넨호프는 수 세기 동안 민주주의와 지도력의 상징으로 서 있었습니다. 네덜란드 정치 생활의 심장부로서 풍부한 역사를 보존하며 국가의 미래를 계속 형성하고 있습니다."
