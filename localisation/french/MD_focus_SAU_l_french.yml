 SAU_events.330.d: "Étendre la Garde nationale"
 SAU_events.330.desc: "La guerre du Golfe a mis à nu à quel point notre armée était peu prête à défendre le Royaume seule. Les Forces terrestres royales saoudiennes doivent être reconstruites — mais avec les armes de qui, et selon quelles lignes ?"
