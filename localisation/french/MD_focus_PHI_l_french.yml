 PHI_corp_major_tt: "§Y35 %§! : scandale d'entreprise de grande ampleur.\n§G-10§! de progression de la corruption. §R-2 %§! de stabilité."
 PHI_corp_huge_tt: "§G10 %§! : corruption de grande ampleur découverte.\n§G-20§! de progression de la corruption. §R-5 %§! d'industrie pendant 180 jours."
 PHI_contracts_nothing_tt: "§R70%§! : aucune preuve trouvée.\nAucun changement."
 PHI_contracts_minor_tt: "§Y55%§! : Mauvaise gestion mineure dévoilée.\n§G-5§! progression de la corruption."
 PHI_contracts_major_tt: "§Y30 %§! : corruption majeure des marchés publics.\n§G-10§! de progression de la corruption. §R-3 %§! de vitesse de construction."
 PHI_contracts_huge_tt: "§G15 %§! : détournement national révélé.\n§G-20§! de progression de la corruption. §R-2 %§! de stabilité."
 PHI_tax_nothing_tt: "§R80%§! : aucune conclusion probante.\nAucun changement."
 PHI_tax_minor_tt: "§Y50%§! : Pot-de-vin mineur découvert.\n§G-5§! progression de la corruption."
 PHI_tax_major_tt: "§Y25 %§! : réseau de fraude douanière démantelé.\n§G-10§! de progression de la corruption. §R-10 %§! de recettes fiscales pendant 2 mois."
 PHI_tax_huge_tt: "§G10 %§! : hauts responsables impliqués.\n§G-25§! de progression de la corruption. §R-15 %§! d'investissement étranger pendant 6 mois."
 PHI_military_nothing_tt: "§R80%§! : aucune preuve ou affaire étouffée.\nAucun changement."
 PHI_military_minor_tt: "§Y60%§! : Officiers subalternes appréhendés.\n§G-5§! progression de la corruption."
 PHI_military_major_tt: "§Y25 %§! : état-major impliqué.\n§G-10§! de progression de la corruption. §R-3 %§! d'organisation de l'armée pendant 90 jours."
 PHI_military_huge_tt: "§G10 %§! : figure militaire supérieure exposée.\n§G-20§! de progrès de corruption. §R-5 %§! de stabilité. §R-5§! d'expérience de l'armée."
 PHI_purge_nothing_tt: "§R70%§! : aucun résultat significatif.\nAucun changement."
 PHI_purge_minor_tt: "§Y60%§! : Réseau de détournement à petite échelle découvert.\n§G-5§! progression de la corruption."
 PHI_purge_major_tt: "§Y35 %§! : grand syndicat local démantelé.\n§G-10§! de progression de la corruption. §R+1 %§! de cible de résistance."
 PHI_purge_huge_tt: "§G10 %§! : dynastie politique renversée.\n§G-20§! de progression de la corruption. §R+2 %§! de cible de résistance. §G+3 %§! de stabilité après 90 jours."
 PHI_offshore_nothing_tt: "§R85%§! : aucune trace trouvée.\nAucun changement."
 PHI_offshore_minor_tt: "§Y50%§! : Comptes mineurs tracés.\n§G-5§! progression de la corruption."
 PHI_offshore_major_tt: "§Y20 %§! : grand réseau de blanchiment découvert.\n§G-25§! de progression de la corruption."
 PHI_offshore_huge_tt: "§G5 %§! : fortune offshore découverte.\n§G-40§! de progression de la corruption. §G-10 %§! de coût d'investissement étranger pendant 6 mois."
 PHI_investigate_corporations: "Enquêter sur les entreprises"
 PHI_investigate_corporations_desc: "Les grands conglomérats philippins jouissent depuis longtemps de relations confortables avec régulateurs et législateurs. Une enquête ciblée sur la comptabilité des entreprises, les déclarations fiscales et les marchés publics pourrait exposer des schémas de pots-de-vin et de détournements, bien que l'issue dépende de la profondeur actuelle de la corruption enracinée.\n\nNiveau de corruption actuel : [ROOT.GetPHI_corruption_tier_number]"
 PHI_audit_government_contracts: "Auditer les marchés publics"
 PHI_audit_government_contracts_desc: "Les marchés d'infrastructure et d'achat publics sont des sources notoires de corruption, pots-de-vin et factures gonflées siphonnant les fonds hors des projets publics. Un audit approfondi des marchés récents peut découvrir des transactions frauduleuses, bien que les officiels qui ont quelque chose à cacher résistent à l'examen.\n\nNiveau de corruption actuel : [ROOT.GetPHI_corruption_tier_number]"
 PHI_inspect_tax_bureau: "Inspecter le bureau des impôts"
 PHI_inspect_tax_bureau_desc: "Le Bureau of Internal Revenue a été miné par des allégations de pots-de-vin, d'arrangements sous la table et de registres falsifiés. Une inspection interne pourrait recouvrer des recettes perdues et extirper les agents corrompus, bien que la propre corruption du bureau puisse protéger les pires contrevenants.\n\nNiveau de corruption actuel : [ROOT.GetPHI_corruption_tier_number]"
 PHI_investigate_the_military: "Enquêter sur l'armée"
 PHI_investigate_the_military_desc: "Les scandales d'achat et les soldats fantômes drainent depuis longtemps le budget des forces armées des Philippines. Enquêter sur les finances militaires risque des frictions avec le corps des officiers, mais des enquêtes réussies peuvent recouvrer des fonds volés et restaurer la discipline dans les rangs.\n\nNiveau de corruption actuel : [ROOT.GetPHI_corruption_tier_number]"
 PHI_purge_local_officials: "Purger les fonctionnaires locaux"
 PHI_purge_local_officials_desc: "Les collectivités locales, des capitoles provinciaux aux salles de barangay, sont souvent dominées par des dynasties politiques qui traitent la charge publique comme une affaire de famille. Une purge ciblée des officiels locaux corrompus peut briser leur emprise, bien que les dynasties enracinées résistent de toutes leurs forces.\n\nNiveau de corruption actuel : [ROOT.GetPHI_corruption_tier_number]"
 PHI_trace_offshore_accounts: "Tracer les comptes offshore"
 PHI_trace_offshore_accounts_desc: "Les richesses mal acquises de décennies de corruption ont souvent été canalisées vers des comptes offshore et des sociétés-écrans à l'étranger. Tracer ces comptes est lent, coûteux et diplomatiquement délicat, mais une trace réussie peut recouvrer des sommes vastes et porter un coup sévère aux réseaux qui les ont bâtis.\n\nNiveau de corruption actuel : [ROOT.GetPHI_corruption_tier_number]"
 PHI_police_investiture: "Investissements policiers"
 PHI_police_investiture_desc: "Réorienter des fonds gouvernementaux pour renforcer la police nationale philippine, améliorant l'efficacité des enquêteurs au prix d'une dépense policière accrue."
 PHI_police_investiture_active_tt: "Le financement policier accru est actif. Toutes les enquêtes anticorruption ont de meilleures chances de succès.\n§R+20 %§! de coût policier. §R-15§! de puissance de commandement max."
 PHI_corporate_scandal_industry: "Scandale d'entreprise"
 PHI_corporate_scandal_industry_desc: "L'exposition d'une corruption d'entreprise de haute valeur a ébranlé la confiance des investisseurs dans notre secteur industriel."
 PHI_procurement_scandal_construction: "Scandale des achats"
 PHI_procurement_scandal_construction_desc: "Une corruption majeure découverte dans les marchés publics a ralenti la construction tandis que les contrats sont réexaminés."
 PHI_customs_fraud_tax: "La fraude douanière révélée"
 PHI_customs_fraud_tax_desc: "Un réseau de fraude douanière a perturbé le recouvrement fiscal pendant que le bureau est restructuré."
 PHI_tax_scandal_investment: "Scandale du bureau des impôts"
 PHI_tax_scandal_investment_desc: "Une corruption de haut niveau au bureau des impôts a fait fuir les investisseurs étrangers."
 PHI_military_scandal_org: "Scandale de corruption militaire"
 PHI_military_scandal_org_desc: "La corruption à l'état-major a perturbé les structures de commandement et la cohésion des unités."
 PHI_offshore_fortune_investment: "Fonds offshore récupérés"
 PHI_offshore_fortune_investment_desc: "Des avoirs offshore saisis ont été réinvestis, ouvrant de nouveaux canaux d'investissement étranger."
 PHI_locked_corruption: "Corruption enracinée"
 PHI_locked_corruption_desc: "§RImpossible de changer manuellement les lois sur la corruption§!\nDes années de politique de clientèle, d'inefficacité bureaucratique et d'intérêts particuliers enracinés ont tissé la corruption dans le tissu de l'État philippin. Les ressources publiques sont régulièrement détournées, la reddition de comptes reste faible, et des figures puissantes continuent de profiter du statu quo. Une réforme véritable ne peut s'obtenir par décret seul. La lutte contre la corruption exigera des enquêtes déterminées, des institutions plus fortes, et un gouvernement prêt à affronter ceux qui profitent du système. "
 PHI_corruption_eradicated: "Une gouvernance propre"
 PHI_corruption_eradicated_desc: "Par des années de réforme soutenue, les Philippines ont accompli quelque chose de rare dans leur histoire : un gouvernement qui fonctionne avec une intégrité véritable. Les institutions sont plus fortes, la confiance du public a été restaurée, et le cycle de la concussion a été brisé, pour l'instant. Maintenir cette norme exigera une vigilance continue."
 PHI_corruption_event.1.t: "Niveau de corruption réduit"
 PHI_corruption_event.1.d: "Nos efforts implacables ont payé. Les réseaux corrompus ont été démantelés et un nouveau niveau de reddition de comptes a été établi."
 PHI_corruption_event.1.a: "Des progrès, enfin."
 PHI_corruption_event.2.t: "La corruption s'aggrave"
 PHI_corruption_event.2.d: "Malgré nos efforts, les forces corrompues ont consolidé leur emprise. Pots-de-vin et concussion se sont étendus plus loin dans les institutions de l'État."
 PHI_corruption_event.2.a: "Nous devons faire mieux."
 PHI_corruption_event.10.t: "Enquête : dissimulation suspectée"
 PHI_corruption_event.10.d: "Nos enquêteurs se sont heurtés à un mur d'avocats, de documents scellés et de pertes de mémoire soudaines. Quelqu'un de puissant recouvre ses traces, mais nous ne pouvons le prouver."
 PHI_corruption_event.10.a: "Continuer de les surveiller."
 PHI_corruption_event.11.t: "Enquête : réseau de corruption découvert"
 PHI_corruption_event.11.d: "Un réseau de corruption de niveau intermédiaire opérant dans le secteur privé a été exposé. Plusieurs dirigeants font face à des accusations et une part des fonds détournés a été recouvrée."
 PHI_corruption_event.11.a: "Poursuivez-les."
 PHI_corruption_event.12.t: "Enquête : un scandale d'entreprise découvert"
 PHI_corruption_event.12.d: "Un scandale d'entreprise massif a ébranlé le monde des affaires. Des dirigeants ont colludé avec des officiels de l'État pour siphonner des fonds publics. Les retombées ont ébranlé la confiance des investisseurs."
 PHI_corruption_event.12.a: "Saisir leurs avoirs."
 PHI_corruption_event.13.t: "Enquête : corruption de haut niveau exposée"
 PHI_corruption_event.13.d: "Une découverte extraordinaire : une toile de corruption d'entreprise de haute valeur atteignant le sommet du secteur privé a été pleinement exposée. Des milliards d'avoirs sont saisis."
 PHI_corruption_event.13.a: "Cela ne sera pas oublié."
 PHI_corruption_event.20.t: "Audit : aucune preuve trouvée"
 PHI_corruption_event.20.d: "L'audit n'a rien produit d'actionnable. Chaque contrat était en règle sur le papier. Soit les livres sont propres, soit quelqu'un les a nettoyés avant notre arrivée."
 PHI_corruption_event.20.a: "Nous avons essayé."
 PHI_corruption_event.21.t: "Audit : une mauvaise gestion révélée"
 PHI_corruption_event.21.d: "Les auditeurs ont découvert une comptabilité négligente et des factures gonflées dans plusieurs départements. Des fonds mal gérés ont été recouvrés."
 PHI_corruption_event.21.a: "Tenez-les responsables."
 PHI_corruption_event.22.t: "Audit : corruption dans les achats découverte"
 PHI_corruption_event.22.d: "Un réseau d'achats profondément enraciné a été éventré. Des officiels attribuaient systématiquement des marchés à des sociétés-écrans en échange de pots-de-vin."
 PHI_corruption_event.22.a: "Démanteler le réseau."
 PHI_corruption_event.23.t: "Audit : détournement national révélé"
 PHI_corruption_event.23.d: "Un schéma de détournement stupéfiant s'étendant sur plusieurs ministères a été découvert. L'ampleur du vol dans les caisses publiques est un scandale national."
 PHI_corruption_event.23.a: "Cela s'arrête maintenant."
 PHI_corruption_event.30.t: "Contrôle fiscal : aucun résultat"
 PHI_corruption_event.30.d: "Les inspecteurs n'ont trouvé aucune preuve solide de méfait. Les agents étaient coopératifs et les registres paraissaient en ordre. L'enquête se clôt sans résultat."
 PHI_corruption_event.30.a: "Retour au travail."
 PHI_corruption_event.31.t: "Inspection fiscale : découverte de pots-de-vin"
 PHI_corruption_event.31.d: "Un certain nombre d'agents fiscaux de bas niveau ont été pris à accepter des pots-de-vin pour réduire les cotisations. Ils ont été renvoyés et les arriérés recouvrés."
 PHI_corruption_event.31.a: "Maison propre."
 PHI_corruption_event.32.t: "Inspection fiscale : la fraude douanière révélée"
 PHI_corruption_event.32.d: "Un réseau sophistiqué de fraude douanière a été démantelé. Des contrebandiers avaient soudoyé des agents supérieurs pour laisser passer des cargaisons non taxées pendant des années."
 PHI_corruption_event.32.a: "Réformer le bureau."
 PHI_corruption_event.33.t: "Contrôle des impôts : de hauts responsables impliqués"
 PHI_corruption_event.33.d: "Des officiels de haut rang du Bureau of Internal Revenue ont été impliqués dans un schéma de corruption systémique. Le scandale a alarmé les investisseurs étrangers et ébranlé la confiance du public."
 PHI_corruption_event.33.a: "Poursuivre chacun d'entre eux."
 PHI_corruption_event.40.t: "Enquête militaire : preuves étouffées"
 PHI_corruption_event.40.d: "L'armée a serré les rangs. Nos enquêteurs se sont heurtés à un mur à tous les échelons. Si la corruption existe, elle a été enfouie très profond."
 PHI_corruption_event.40.a: "Nous reviendrons."
 PHI_corruption_event.41.t: "Enquête militaire : officiers pris"
 PHI_corruption_event.41.d: "Plusieurs officiers subalternes ont été pris à détourner des allocations de carburant et du matériel à leur profit. Ils ont passé en conseil de guerre."
 PHI_corruption_event.41.a: "Justice est faite."
 PHI_corruption_event.42.t: "Enquête militaire : état-major impliqué"
 PHI_corruption_event.42.d: "Des membres de l'état-major ont été impliqués dans un réseau de corruption lié aux marchés d'armement. Le scandale a perturbé la chaîne de commandement."
 PHI_corruption_event.42.a: "Purger les rangs."
 PHI_corruption_event.43.t: "Enquête militaire : haut responsable exposé"
 PHI_corruption_event.43.d: "Un haut responsable militaire a été publiquement exposé pour avoir détourné des fonds de la défense pendant de nombreuses années. La révélation a choqué les forces armées autant que le public."
 PHI_corruption_event.43.a: "Nul n'est au-dessus de la loi."
 PHI_corruption_event.50.t: "Purge : aucun résultat significatif"
 PHI_corruption_event.50.d: "Les élus locaux ont baissé la tête et la purge n'a presque rien trouvé à sanctionner. Soit les réseaux se sont tus, soit ils avaient été prévenus."
 PHI_corruption_event.50.a: "Nous réessaierons."
 PHI_corruption_event.51.t: "Purge : réseau de greffes trouvé"
 PHI_corruption_event.51.d: "Un petit réseau de pots-de-vin niché dans la bureaucratie locale a été démantelé. Une poignée de fonctionnaires ont été relevés de leurs postes."
 PHI_corruption_event.51.a: "Bon débarras."
 PHI_corruption_event.52.t: "Purge : le syndicat local exposé"
 PHI_corruption_event.52.d: "Un grand syndicat local enchâssé dans le gouvernement régional a été exposé. Son éviction a bouleversé les structures de pouvoir locales et suscité des troubles."
 PHI_corruption_event.52.a: "La stabilité suivra."
 PHI_corruption_event.53.t: "Purge : dynastie politique renversée"
 PHI_corruption_event.53.d: "Une dynastie politique enracinée qui contrôlait le gouvernement local depuis des décennies a été renversée. Ses biens ont été saisis, mais les loyalistes restent agités."
 PHI_corruption_event.53.a: "Une nouvelle ère commence."
 PHI_corruption_event.60.t: "Trace offshore : aucune trace trouvée"
 PHI_corruption_event.60.d: "Nos enquêteurs financiers ont buté sur une impasse. Chaque piste se dissolvait en sociétés écrans anonymes dans plusieurs juridictions. L'argent a disparu."
 PHI_corruption_event.60.a: "Nous les avons perdus."
 PHI_corruption_event.61.t: "Trace offshore : comptes mineurs trouvés"
 PHI_corruption_event.61.d: "Plusieurs comptes offshore mineurs liés à des officiels ont été identifiés et gelés. Les montants sont modestes, mais le précédent est important."
 PHI_corruption_event.61.a: "Congelez le tout."
 PHI_corruption_event.62.t: "Trace offshore : le réseau de blanchiment exposé"
 PHI_corruption_event.62.d: "Un vaste réseau de blanchiment faisant transiter des fonds par des comptes offshore a été démantelé. Une somme significative a été rapatriée au Trésor philippin."
 PHI_corruption_event.62.a: "Ramenez-le à la maison."
 PHI_corruption_event.63.t: "Trace offshore : une fortune offshore découverte"
 PHI_corruption_event.63.d: "Découverte extraordinaire : une immense fortune offshore appartenant à des hauts responsables a été mise au jour et saisie. L'aubaine est historique et envoie un message puissant."
 PHI_corruption_event.63.a: "Le peuple le saura."
 PHI_corruption_event.99.t: "Confiance publique rétablie"
 PHI_corruption_event.99.d: "La vieille dynastie politique écartée du pouvoir, les communautés locales reconstruisent lentement leur confiance dans les institutions. Un optimisme prudent s'installe."
 PHI_corruption_event.99.a: "Le peuple est avec nous."
 PHI_corruption_event.100.t: "Nous l'avons fait"
 PHI_corruption_event.100.d: "Après des années d'enquêtes minutieuses, de poursuites et de réformes institutionnelles, notre campagne anticorruption a atteint un jalon que peu croyaient possible. Les réseaux enracinés de pots-de-vin et de clientélisme qui paralysaient jadis le gouvernement ont été démantelés. Les Philippines se tiennent au seuil d'une ère nouvelle, définie non par ce que les officiels volent, mais par ce qu'ils construisent."
 PHI_corruption_event.100.a: "Une nouvelle Philippines commence aujourd’hui."
 PHI_corruption_event.200.t: "Scandale du lobbying des entreprises"
 PHI_corruption_event.200.d: "Des rumeurs circulent qu'un grand conglomérat a utilisé des dons secrets pour influencer une législation récente. Le public y prête attention, et l'opposition sent le sang."
 PHI_corruption_event.200.a: "Ignorer. On ne peut pas combattre tout le monde."
 PHI_corruption_event.200.b: "Lancez un audit limité."
 PHI_corruption_event.200.c: "Condamnez-les publiquement."
 PHI_corruption_event.201.t: "Projets fantômes"
 PHI_corruption_event.201.d: "Un rapport parlementaire a trouvé plusieurs projets d'infrastructure financés par l'État sans aucune trace d'achèvement : ni routes, ni bâtiments, ni ouvriers jamais embauchés. L'argent a simplement disparu."
 PHI_corruption_event.201.a: "Passer l'éponge."
 PHI_corruption_event.201.b: "Blâmez les autorités locales."
 PHI_corruption_event.201.c: "Lancez une enquête officielle."
 PHI_corruption_event.202.t: "Fuite fiscale"
 PHI_corruption_event.202.d: "Un lanceur d'alerte a produit des preuves que des hauts responsables du gouvernement éludaient l'impôt via un réseau de fausses sociétés écrans. Les documents circulent déjà dans la presse."
 PHI_corruption_event.202.a: "Régler cela en silence."
 PHI_corruption_event.202.b: "En faire un exemple."
 PHI_corruption_event.202.c: "Offrir de l'indulgence en échange de la coopération."
 PHI_corruption_event.203.t: "Fraude aux marchés militaires"
 PHI_corruption_event.203.d: "Les enquêtes ont révélé des livraisons d'armes manquantes destinées aux forces armées des Philippines. Les factures étaient signées, les livraisons enregistrées, mais le matériel est introuvable."
 PHI_corruption_event.203.a: "Rejeter les accusations."
 PHI_corruption_event.203.b: "Punissez quelques boucs émissaires."
 PHI_corruption_event.203.c: "Lancez une enquête complète."
 PHI_corruption_event.204.t: "Réseaux mafieux provinciaux"
 PHI_corruption_event.204.d: "Les rapports du renseignement policier ont confirmé ce que beaucoup de locaux savaient déjà : plusieurs officiels provinciaux et de barangay coopèrent activement avec des syndicats du crime organisé. L'argent de protection change de mains à tous les niveaux."
 PHI_corruption_event.204.a: "Ignorez-le."
 PHI_corruption_event.204.b: "Arrêtez-les publiquement."
 PHI_corruption_event.204.c: "Les remplacer par des loyalistes."
 PHI_corruption_event.205.t: "Système de pots-de-vin étrangers"
 PHI_corruption_event.205.d: "Des preuves ont émergé que des entreprises étrangères de construction et d'énergie ont soudoyé des hauts responsables pour obtenir des marchés publics lucratifs. La piste mène jusqu'à la capitale."
 PHI_corruption_event.205.a: "Niez tout."
 PHI_corruption_event.205.b: "Sanctionnez-les tranquillement."
 PHI_corruption_event.205.c: "En faire un exemple public"
 PHI_corruption_event.206.t: "Pourriture bureaucratique"
 PHI_corruption_event.206.d: "La petite corruption s'est de plus en plus normalisée dans les bureaux. Les employés attendent des enveloppes. Les inspecteurs ont besoin d'être convaincus. Les permis ont un prix au-delà du tarif officiel. Cette culture de petites corruptions érode la confiance institutionnelle."
 PHI_corruption_event.206.a: "Qu'ils gardent leurs petits avantages."
 PHI_corruption_event.206.b: "Proposer des réformes symboliques."
 PHI_corruption_event.206.c: "Réaffecter plusieurs fonctionnaires."
 PHI_corruption_number_01: "(1) Corruption négligeable"
 PHI_corruption_number_02: "(2) Corruption légère"
 PHI_corruption_number_03: "(3) Corruption modeste"
 PHI_corruption_number_04: "(4) Corruption moyenne"
 PHI_corruption_number_05: "(5) Corruption étendue"
 PHI_corruption_number_06: "(6) Corruption systématique"
 PHI_corruption_number_07: "(7) Corruption débridée"
 PHI_corruption_number_08: "(8) Corruption galopante"
 PHI_corruption_number_09: "(9) Corruption invalidante"
 PHI_corruption_number_10: "(10) Corruption paralysante"
 PHI_corruption_strength_exact_tt: "§YForce de la corruption§! réduite de §R[?PHI_corruption_roll|0]§! (Actuelle : §Y[?PHI_corruption_strength|0]§!)"
 PHI_edsa_dos_category: "La crise d'EDSA Dos"
 PHI_edsa_dos_category_desc: "Les allégations de corruption ont déstabilisé l'administration. Le procès en destitution a paralysé la gouvernance. Le peuple observe et s'impatiente. Prenez la décision §YOuvrir la seconde enveloppe§! avant l'expiration du délai."
 PHI_the_people_grow_disillusioned: "Le peuple se désillusionne..."
 PHI_the_people_grow_disillusioned_desc: "Le vote du Sénat pour supprimer une pièce maîtresse de la destitution a indigné le public. Des centaines de milliers de personnes convergent vers le sanctuaire d'EDSA. Le temps presse."
 PHI_open_the_second_envelope: "Ouvrir la seconde enveloppe"
 PHI_open_the_second_envelope_desc: "Malgré le vote 11-10 du Sénat pour la supprimer, nous avons encore le pouvoir de laisser ouvrir la preuve controversée. Cela nous nuira politiquement, mais ce sera peut-être le seul moyen de préserver la confiance institutionnelle et d'empêcher la chute du gouvernement."
 PHI_edsa_corruption_below_55_tt: "La §Yforce de corruption§! doit être inférieure à §Y55§! (Actuel : [?PHI.PHI_corruption_strength|Y0])"
 PHI_edsa_stability_above_60_tt: "La §Ystabilité§! doit être supérieure à §Y60 %§!"
 PHI_edsa_dos_impeachment_atmosphere: "Paralysie de la destitution"
 PHI_edsa_dos_impeachment_atmosphere_desc: "Le procès en destitution domine chaque journal télévisé. Le capital politique s'écoule chaque jour tandis que la nation regarde l'administration lutter pour sa survie."
 PHI_edsa_dos_recovery_spirit: "Stabilisation post-EDSA"
 PHI_edsa_dos_recovery_spirit_desc: "La nouvelle administration a pris le pouvoir dans des circonstances extraordinaires. Les promesses de réforme suscitent un optimisme public prudent, mais de profondes blessures politiques demeurent."
 PHI.1.t: "Le scandale Juetengate explose"
 PHI.1.d: "Un lanceur d'alerte accuse le président Joseph Estrada et des membres de son cercle de recevoir des millions en bakchichs du jueteng. L'indignation publique monte rapidement tandis que la presse révèle des couches plus profondes de corruption dans l'administration. Opposition, Église et société civile organisent des manifestations exigeant des comptes. Les tensions montent dans tout le pays : l'administration doit décider comment répondre. Ou affronter la fin de son mandat tout entier."
 PHI.1.a: "Cela pourrait dégénérer..."
 PHI.2.t: "Fin de parcours"
 PHI.2.d: "Tout a commencé par une sortie. Quand le Sénat a voté 11-10 pour supprimer une pièce maîtresse de la destitution, toute l'équipe de l'accusation a quitté la salle. En quelques heures, des centaines de milliers de Philippins ont afflué au sanctuaire d'EDSA, rappelant la révolution du Pouvoir du peuple de 1986. En quelques jours, les forces armées et la police nationale ont retiré leur soutien à l'administration. Les secrétaires du cabinet ont démissionné en masse. Le président de la Cour suprême Hilario Davide Jr. a fait prêter serment à la vice-présidente Gloria Macapagal-Arroyo. Joseph Estrada a quitté le palais de Malacañang sans démissionner formellement. Un nouveau chapitre commence."
 PHI.2.a: "Le peuple a parlé."
 PHI.3.t: "Investiture de Gloria Macapagal Arroyo"
 PHI.3.d: "Tout comme après le départ de Joseph Estrada de la présidence, Gloria Arroyo, vice-présidente d'Estrada du parti £PHI_conservatism Lakas-CMD, a prêté serment comme 14e présidente des Philippines. Certains diront que son accession fut illégitime ; le peuple se réjouit qu'un autre dirigeant corrompu ait été renversé par la révolution et la protestation. L'administration Arroyo mettra du temps à se rétablir, mais le changement pourrait enfin être dans l'air : elle promet de panser les plaies du président destitué."
 PHI.3.a: "Le changement pourrait être dans l'air."
 PHI.4.t: "La seconde enveloppe est ouverte"
 PHI.4.d: "Après des jours de tumulte politique, le Sénat a voté l'ouverture de la controversée « seconde enveloppe ». Ce qui devait être le moment décisif du procès en destitution n'apporte qu'un bref soupir de soulagement. Les preuves entrant dans le processus judiciaire, les procureurs abandonnent le projet de sortie massive, et les appels à une nouvelle révolution du Pouvoir du peuple perdent vite de l'élan.\nLe président Joseph Estrada survit à la tempête du jour, mais son administration reste profondément blessée. Les allégations de corruption dominent encore les unes, les marchés restent nerveux, et alliés comme adversaires savent que la bataille de la destitution est loin d'être close. Le gouvernement a évité l'effondrement, mais son avenir repose désormais entièrement sur l'issue du procès."
 PHI.4.a: "La République tient... pour l'instant"
 PHI.5.t: "La campagne de Mindanao s'achève"
 PHI.5.d: "Les derniers états-majors de bases organisés du Front de libération islamique moro ont été submergés. Il ne reste du Front qu'une poignée de commandants en fuite, sans territoire, sans recettes ni chaîne de commandement capable de les coordonner. Le Commandement du Sud a rendu les municipalités reprises aux autorités civiles, et les forces armées redescendent à un niveau de garnison.\n\nL'insurrection s'achève sans signature sur aucun document. Que les griefs qui l'ont produite se soient éteints avec elle est une tout autre question."
 PHI.5.a: "Mindanao est sous notre autorité."
 PHI.6.t: "L'accord global sur le Bangsamoro"
 PHI.6.d: "Après des années de négociation sous médiation malaisienne, le gouvernement et le Front de libération islamique moro ont signé un règlement global. Le Front décommissionnera ses armes et ses combattants sous vérification indépendante. En échange, la Région autonome du Mindanao musulman cède la place à une entité bangsamoro dotée de son propre parlement, d'une part définie des recettes nationales et de l'autorité sur ses affaires internes.\n\nLa transition coûtera à Manille beaucoup d'argent et une part de souveraineté sur le sud. Elle met aussi fin à quatre décennies de guerre."
 PHI.6.a: "La paix vaut le prix."
 PHI.7.t: "La plus longue rébellion est brisée"
 PHI.7.d: "Les fronts de guérilla de la Nouvelle armée du peuple ont été démantelés région par région. Ses comités régionaux ont été capturés ou dispersés, ses réseaux d'impôt rural brisés, et ce qui reste du Comité central ne dirige plus rien depuis l'exil aux Pays-Bas.\n\nLe Parti communiste des Philippines a lancé sa guerre populaire prolongée en 1969. Il a survécu à la dictature Marcos, à quatre présidents et à tous les processus de paix tentés depuis. Il ne survivra pas à celui-ci."
 PHI.7.a: "Cinquante années de guerre sont terminées."
 PHI.8.t: "Accord d'Oslo"
 PHI.8.d: "Le gouvernement norvégien a accueilli le dernier round de pourparlers entre Manille et le Front démocratique national. L'accord accorde l'amnistie aux prisonniers politiques et engage le gouvernement dans un programme de réforme agraire et d'investissement rural. En retour, la Nouvelle armée du peuple se démobilisera définitivement et le Front disputera le pouvoir par des partis légaux.\n\nLes durs des deux camps dénoncent l'accord. Ni l'un ni l'autre ne commande assez de forces pour continuer sans l'autre."
 PHI.8.a: "La guerre s'achève à la table."
 PHI.9.t: "La loi anti-dynasties est votée"
 PHI.9.d: "Contre toute attente, le Congrès a voté la législation d'application de l'article II, section 26 de la Constitution. Les parents d'élus en exercice jusqu'au second degré de consanguinité ne peuvent plus leur succéder ni exercer simultanément dans la même juridiction.\n\nLes clans provinciaux qui fournissaient gouverneurs, députés et présidents depuis des générations se heurtent à une carte électorale qu'ils ne peuvent plus hériter. La direction des partis s'ouvre à des candidats sans famille derrière eux, et bien des carrières se sont arrêtées le jour où le président a signé."
 PHI.9.a: "Les familles ne possèdent pas la République."
 PHI_news.1.t: "Estrada destitué dans la seconde révolution du pouvoir populaire"
 PHI_news.1.d: "Le président Joseph Estrada a été chassé du pouvoir après des jours de manifestations de masse et l'effondrement de sa procédure de destitution, déclenchant une crise politique à Manille. Les forces armées et la police nationale ayant retiré leur soutien au président en difficulté, la vice-présidente Gloria Macapagal Arroyo a prêté serment, mettant fin à l'administration Estrada. Les gouvernements d'Asie ont salué le transfert pacifique du pouvoir tout en surveillant de près l'avenir politique des Philippines."
 PHI_news.1.a: "Une fin dramatique pour la présidence d'Estrada."
 PHI_news.2.t: "Estrada survit à la crise"
 PHI_news.2.d: "Le président philippin Joseph Estrada a de justesse survécu à ce qui paraissait la plus grave crise politique de sa présidence. Après le vote du Sénat admettant la controversée seconde enveloppe comme preuve, le procès en destitution a repris au lieu de s'effondrer dans le chaos.\nLa décision a temporairement apaisé les craintes de manifestations de masse et d'un nouveau Pouvoir du peuple, permettant à Estrada de rester en fonction pendant que le processus judiciaire continue. Malgré ce sursis, les allégations de corruption jettent encore une longue ombre sur l'administration, laissant gouvernements étrangers et marchés financiers incertains de l'avenir politique du pays."
 PHI_news.2.a: "Estrada reste au pouvoir."
 PHI_edsa_dos_tt: "§YLe président Joseph Estrada a été pris à manier de l'argent illégal, le peuple se rassemble dans les rues. Si nous n'y répondons pas§!, §Rce pourrait être la fin de toute notre administration telle que nous la connaissons§!."