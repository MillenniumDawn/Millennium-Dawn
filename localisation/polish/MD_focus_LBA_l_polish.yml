 gaddafi_family_gain_scholarly_challenged_tt: "zyskuje cechę §YScholarnie Wyzwanie§!"
 gaddafi_family_gain_un_goodwill_ambassador_tt: "zyskuje cechę §YUN Ambasador Dobrej Woli§!"
 gaddafi_family_gain_amazon_of_libya_tt: "zyskuje cechę §YAmazonka Libii§!"
 gaddafi_family_gain_inexperienced_general_tt: "zyskuje cechę §YNiedoświadczony Generał§!"
 gaddafi_family_gain_convicted_criminal_tt: "zyskuje cechę §YSkazany Przestępca§!"
