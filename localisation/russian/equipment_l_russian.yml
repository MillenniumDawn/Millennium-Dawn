 BLR_Heavy_Anti_tank_3_desc: "Самоходный противотанковый ракетный комплекс «Хризантема-С» (по классификации НАТО — AT-15 Springer). Предназначен для поражения танков и других бронированных целей, в том числе оснащённых современной динамической защитой. Боевая машина 9П157 создана на базе БМП-3."
 BLR_artillery_4_desc: "Буксируемая гаубица-пушка на основе 152-мм орудия, установленного на самоходной артиллерийской установке «Коалиция-СВ»."
