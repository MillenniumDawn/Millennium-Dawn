 ukr_modernize_sov_equipment_storage_sale.7.desc: "Наши дипломаты могут обратиться с предложением по §Y2К11 «Круг»§! к одной из центральноазиатских республик. §Y[SOV.GetNameWithFlag]§! будет следить за этим."
 ukr_modernize_sov_equipment_storage_sale.7.a: "Обратиться: §Y[KAZ.GetNameWithFlag]§!"
