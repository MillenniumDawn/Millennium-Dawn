 UKR_develop_btr4_apc_role_choose_testing_desc: "\n\n\n\n\n\n£UKR_desctext_btr4_tests_for_tooltip\n\n\n\n\n\n\n\n\nWe can make a decision on duration and complexity of pre-production tests for §YBTR-4§! APC."
