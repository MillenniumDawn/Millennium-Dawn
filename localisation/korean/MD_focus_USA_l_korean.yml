 USA_791_name: "사우스캐롤라이나"
 USA_797_name: "루이지애나"
 USA_773_name: "버지니아"
 USA_774_name: "웨스트버지니아"
 USA_792_name: "조지아"
 USA_803_name: "뉴멕시코"
 USA_765_name: "뉴햄프셔"
 USA_770_name: "뉴저지"
 USA_772_name: "메릴랜드"
 USA_771_name: "펜실베이니아"
 USA_769_name: "뉴욕"
 USA_3957_name: "워싱턴 D.C."
 USA_focus_the_pentagon_wars: "펜타곤 전쟁"
 USA_focus_the_pentagon_wars_desc: "냉전이 끝나갈 무렵부터 새 천년에 이르기까지, 펜타곤과 미군 기구 전반의 상층부에서 내부 투쟁이 끓어오르기 시작했습니다. 고참들은 신형 기계와 전쟁 무기의 비용이 한낱 신기한 장난감에 불과하며 적이 이를 이용해 우리를 파산시킬 수 있다고 믿었습니다. 반대편에는 현대적인 레이더와 군 무기의 여러 혁신이 현대 전장을 규정하고 형성할 것이라고 믿는 젊은 혁신가들이 있었습니다. 이 내부 투쟁은 언론 매체와 할리우드에 의해 선정적으로 다뤄졌지만, 진짜 결말은 기밀 취급 인가를 가진 사람들만이 압니다."
 USA_focus_united_states_army: "미국 육군"
 USA_focus_united_states_army_desc: "미국 독립 전쟁 당시 대륙군으로 창설된 미국 육군은 이 합중국 군대의 세 주축 중 하나입니다. 역사를 통틀어 육군은 수많은 혁신의 순간과 적지 않은 부패를 겪었습니다. 그러나 현대에 이르러 이 군종은 새로운 과제에 직면해 있습니다. 기술 혁신이 정점을 향해 가면서 기술과 전술의 간극이 파괴적인 방향으로 점점 벌어지고 있습니다. 사라진 자금, 수십 년 만에 보는 규모로 예산을 초과한 연구개발 사업, 동료 장교와 장군들의 내부 방해 공작까지, 할 일이 많습니다. 문제는 어디서부터 시작하느냐입니다."
 USA_focus_five_star_folly: "오성 장군의 어리석음"
 USA_focus_five_star_folly_desc: "현대 전장은 신기한 장치가 아니라 의지와 결단의 전장입니다. 따라서 이미 보유한 장비를 가지고 훈련 노력, 구조, 병력의 적응력을 미세 조정하고 재정비해야 합니다. 연구개발은 삭감되어 삶의 질 개선, 소형 화기 강화, 군수 능력에 한정될 것입니다."
 USA_focus_infantry_doctrine_debate: "보병 교리 논쟁"
 USA_focus_infantry_doctrine_debate_desc: "효율을 높이고 비용을 줄이려면 우리 육군을 움직이게 하는 핵심이 무엇인지 살펴보아야 합니다. 그 핵심 기둥은 평범한 병사, 즉 보병입니다. 현재 냉전의 종결 이후에도 이어진 주요 교리는 세 가지입니다. 경보병 교리, 기동 보병 교리, 기갑 보병 교리입니다. 세 가지 모두 장단점이 있지만, 문제는 경제성과 유연성 측면에서 어느 것이 우리 국가에 가장 알맞느냐입니다."
 USA_focus_light_infantry_dominance: "경보병 우위"
 USA_focus_light_infantry_dominance_desc: "도보 병사는 어떤 상황에도 가장 쉽게 빚어내고 적응시킬 수 있습니다. 이 열쇠로 자물쇠를 돌려 효율의 문을 열고, 우리 병사들이 지상과 공중 양면의 위협에 대처할 수 있게 할 것입니다."
 USA_focus_mobile_infantry_machine: "기동 보병 체계"
 USA_focus_mobile_infantry_machine_desc: "도보 병사의 유연성에 차량화 수송 수단과 정찰형 차량의 기동성을 결합하여, 우리 육군의 핵심이 되는 궁극의 타격 부대를 만들고자 합니다."
 USA_focus_armored_infantry_ascendance: "기갑 보병의 부상"
 USA_focus_armored_infantry_ascendance_desc: "현대 전차는 비싸고, 그것이 주는 잠재적 \\"보상\\"에 비해 비용이 매우 큽니다. 따라서 이러한 돈 먹는 하마를 대체하고 대신할 수 있도록 보병을 적응시켜 새로운 길을 열어야 합니다. 기갑 보병 교리는 도보 병사를 더 효율적이고 유연하게 배치함으로써 적 기갑 및 경부대 요소의 주의를 분산시키고 혼란에 빠뜨려, 기갑전의 다재다능함을 확보할 것입니다."
 USA_focus_tank_force_dilemma: "전차 부대의 딜레마"
 USA_focus_tank_force_dilemma_desc: "현대 전장은 전차의 본래 용도를 거의 무용지물로 만들었습니다. 균형 잡힌 육군을 진정으로 갖추려면 이 거대한 금속 기계들을 무엇에 쓸 것인지 진지하게 고민해야 합니다."
 USA_focus_repurposing_armored_programs: "기갑 사업 용도 전환"
 USA_focus_repurposing_armored_programs_desc: "RAP 지침은 육군의 즉각적인 재편입니다. 전차 부대는 거의 중단되어 필요할 경우 매우 특수한 임무에만 유보되지만, 핵심 지침은 연구와 물자를 IFV, APC 및 기타 사업으로 돌려 전투의 다른 모든 측면을 강화하고 개선하는 것입니다."
 USA_focus_modern_tanks_modern_solutions: "현대 전차, 현대적 해법"
 USA_focus_modern_tanks_modern_solutions_desc: "전차는 현대의 경이이며 지나간 시대의 눈속임으로 간단히 버려서는 안 됩니다. 생산 방식을 정제하고 부대 편성을 재정비함으로써 우리 전차 부대를 주력 보병 부대의 큰형이자 동반자로 만들 수 있습니다."
 USA_focus_logistical_dominance: "군수 우위"
 USA_focus_logistical_dominance_desc: "육군은 전투 효율을 갖춘 병력을 유지하는 데 필수적인 장비를 실제로 갖추었을 때에만 기능합니다. 따라서 보급 및 군수 네트워크의 시의적절하고 효율적인 운영을 보장하도록 군수 기구를 장려하고 확장함으로써 본보기를 보여야 합니다."
 USA_focus_fire_support_supremacy: "화력 지원 우위"
 USA_focus_fire_support_supremacy_desc: "포병은 전장의 왕입니다. 기동성은 설계 요구에 따라 다양하게 조절할 수 있고, 지역 제압은 여러 면에서 효과적이며, 덤으로 항공기를 불러오는 것보다 비용도 비교적 저렴할 수 있습니다. 따라서 우리는 수십 년, 심지어 수 세기 전처럼 포병이 새 시대 전쟁의 생계 수단이 되도록 투자하고 보장할 것입니다."
 USA_focus_gold_star_program: "금성 사업"
 USA_focus_gold_star_program_desc: "현대 전장은 적들의 기술적 우위로 규정됩니다. 냉전이라는 군비 경쟁은 끝났지만, \\"평화의 시대\\"가 불만, 혁명, 사회 불안이 부글부글 끓는 뜨거운 스튜로 계속 변해 가면서 적들은 하루가 다르게 성장하고 있습니다. 우리는 연구개발 사업에 대규모로 투자하고, 기술 통합을 정제하며, 우리가 단지 강한 군대일 뿐 아니라 일당백의 군대가 되도록 해야 합니다."
 USA_focus_armored_combat_debate: "기갑전 논쟁"
 USA_focus_armored_combat_debate_desc: "현대 전장의 여왕은 장갑 전투 차량입니다. 전차든 IFV든 APC든 이러한 전쟁 기계는 단일 전투, 나아가 전체 작전을 규정할 수 있습니다. 그러나 기갑전에서 혁신이 이루어지면서 우리는 갈림길에 이르렀습니다. 전차 중심의 개발에 더 집중할 것인가, 아니면 IFV나 APC 같은 더 가벼운 보병 지원 차량에 더 많이 할애할 것인가."
 USA_focus_light_vehicle_innovations: "경차량 혁신"
 USA_focus_light_vehicle_innovations_desc: "전차는 기동하는 벙커로서 훌륭하지만, 현대 대전차 능력에 대한 투자와 혁신으로 인해 전차 간 직접 전투는 물자와 인원 모두에서 더 위험한 투자가 되었습니다. 따라서 유연한 보병 및 기갑 접근을 보장하도록 자금을 APC와 IFV 쪽으로 더 돌릴 수 있습니다. 게다가 APC와 IFV는 전차보다 모듈화하기가 훨씬 쉽습니다."
 USA_focus_modern_battle_tank_innovations: "현대 주력 전차 혁신"
 USA_focus_modern_battle_tank_innovations_desc: "MBT, 즉 주력 전차는 현대 전차 교리의 표준을 만든 냉전 시대의 혁신입니다. 우리는 이를 활용하여 어떤 적의 공격에도 맞서고 스스로를 단련할 강력한 기갑 전력을 만들어야 합니다. 이러한 혁신의 부산물로 더 균등한 위치의 하위 부대들을 포괄하도록 부대 편성을 재정비하면서 SPAA와 자주포 같은 부대도 수동적인 혁신을 맞이할 것으로 보입니다."
 USA_focus_mass_motorization_efforts: "대규모 차량화 노력"
 USA_focus_mass_motorization_efforts_desc: "우리가 선택한 어떤 기준에서든 기동성을 확보하려면, 우리 보병이 기계화 및 기갑 요소와 보조를 맞출 수 있도록 제조 파트너들이 차량화 생산을 표준화하고 늘리게 해야 합니다."
 USA_focus_the_artillery_conundrum: "포병의 난제"
 USA_focus_the_artillery_conundrum_desc: "드론, 스텔스 항공기, 그리고 훨씬 더 많은 원거리 장비가 존재하는 현대에, 육군에서 가장 취약하다고 할 수 있는 야전 부대, 즉 포병과 그 승무원에 어떤 역할을 부여할 것인가는 원칙의 문제입니다. 우리는 어떤 방향으로 나아가야 하는지, 그리고 적이 이 눈에 띄는 표적들을 가볍게 타격하지 못하도록 방어에 더 집중할지 잠재적 공격에 더 집중할지 판단해야 합니다. "
 USA_focus_defensive_artillery_program: "방어 포병 사업"
 USA_focus_defensive_artillery_program_desc: "DAP 구상은 장비의 설계는 물론 야전에서 장비 전반을 방어할 수 있는 능력까지 포함하여 더 나은 방어 수단을 연구하고 혁신하기 위해 마련된 계획입니다. 국지적 기동성과 더 먼 거리에서 전선에 도달할 수 있는 능력은 우리 장비와 승무원의 전반적인 생존성 또한 보장할 것입니다."
 USA_focus_offensive_artillery_program: "공세 포병 계획"
 USA_focus_offensive_artillery_program_desc: "OAP는 전 군을 위한 기동전의 새로운 기준을 세우기 위한 계획입니다. 기갑 및 자주포 체계와 관련된 혁신과 연구를 통해, 포병이 병과 내에서 가장 느린 부대로 여겨지는 만큼 우리는 육군 전체의 속도를 주도할 것입니다."
 USA_focus_supplies_supples_supplies: "보급, 보급, 보급"
 USA_focus_supplies_supples_supplies_desc: "병참 병과는 육군 기능의 근간이 될 준비를 갖추고 있습니다. 더 많은 발전과 더 복잡한 무기 체계는 야전에서 운반하고 교체를 걱정해야 할 물자가 그만큼 늘어난다는 뜻입니다. 따라서 적이 \\"핵심\\" 보급 거점을 파괴하는 데 따르는 한계를 확보할 수 있도록 유연하고 기동성 있는 보급망을 구축해야 합니다."
 USA_focus_army_special_forces_question: "육군 특수 부대 문제"
 USA_focus_army_special_forces_question_desc: "육군 병과의 특수 부대는 명칭과 중첩되는 능력 모두에서 점점 더 늘어나고 있습니다. 육군 특수 부대가 다른 병과와 구별될 뿐만 아니라 육군 내부에서도 충분히 독자적인 존재가 되려면 어떤 역할을 맡겨야 하는지 진지하게 고민해야 합니다."
 USA_focus_specialized_frontline_defense_support: "전문 전선 방어 지원"
 USA_focus_specialized_frontline_defense_support_desc: "SFDP는 육군 특수 부대를 방어 진지에서 가능한 모든 방식으로 지원하고 보조하는 일반 전력 또는 육군 하위 병과로 새로 재편하는 계획입니다. 포위될 가능성이 있는 상황에서 SFDP는 제한된 보급품을 수송하여 고립된 병력을 돕고, 진지나 적 정찰 부대에 대한 적의 공격에 대응 사격과 기동으로 맞서는 등의 임무를 수행할 것입니다. 이를 통해 육군은 하나로 뭉쳐 자유와 민주주의 자체의 적에 맞서는 보루가 될 수 있을 것입니다."
 USA_focus_the_dagger_within_the_cloak: "망토 속의 단검"
 USA_focus_the_dagger_within_the_cloak_desc: "우리의 특수전 집단, 즉 SFG는 최정예 중의 최정예여야 합니다. 이 높은 목표를 달성하려면 이 부대를 훈련하고 단련하여 최고의 효율을 갖춘 타격 부대로 키워내기 위한 상당한 재정 및 장비 투자가 필요합니다."
 USA_focus_the_information_game: "정보 게임"
 USA_focus_the_information_game_desc: "자신과 적이 무엇을 하고 있는지 아는 것은 승리의 영감을 만들어내는 핵심 수단입니다. 불필요한 손실을 피하려면 적 부대를 정찰하고 정보를 얻는 더 나은 방법에 투자해야 합니다."
 USA_focus_this_is_the_army_mr_jones: "존스 씨, 이것이 육군입니다"
 USA_focus_this_is_the_army_mr_jones_desc: "우리는 새로운 육군입니다. 새로운 정신, 새로운 병사, 그리고 옳은 것을 지키기 위한 새로운 시작입니다. 모두를 위한 자유와 행복 추구를 위하여."
 USA_focus_united_states_navy: "미국 해군"
 USA_focus_united_states_navy_desc: "1775년에 창설되었다가 독립 혁명 이후 해체되었고, 1800년대 당시 바버리 해적에 대한 긴급 대응으로 다시 창설된 미국 해군은 금욕적이면서도 끊임없이 변화하는 역사를 지녀 왔습니다. 세계대전 무렵 영국 제국을 앞지른 이래 해군 혁신의 선두에 서 온 미국 해군은 새로운 천년기에 무엇이 필요한지 알아내고자 합니다. 대부분의 전투가 육상이나 공중 중심으로 벌어지는 만큼, 많은 대중은 해군에 얼마나 많은 자금이 필요한지 의문을 품고 있습니다. 따라서 해군 지도부는 새로운 결정을 정당화하기 위해 사고방식과 홍보팀을 전환해야 합니다. 해군이 단순한 상선 방어 함대 이상이 되려면 이 새로운 시대에서 자신의 새로운 목소리를 찾아야 하기 때문입니다."
 USA_focus_project_steel_waves: "강철 파도 계획"
 USA_focus_project_steel_waves_desc: "우리는 지구의 초강대국이며, 이는 명예의 훈장도 수치의 낙인도 아닌 단지 질서와 지위의 상태일 뿐입니다. 이를 위해 우리는 해군의 투사 능력을 이 지위에 걸맞게 조정해야 합니다. 대부분의 열강을 합쳐도 40년도 더 전의 우리 기술을 온전히 따라잡을 수 없으므로, 우리는 연구개발을 기존 함선의 생산, 수리, 개조를 간소화하는 데 집중할 것입니다. 날것의 기술과 힘으로 서서히 줄어드는 함대가 아니라, 모듈식이며 적응력 있는 다수의 함대를 구축합니다."
 USA_focus_naval_group_flexibility_program: "해군 집단 유연성 계획"
 USA_focus_naval_group_flexibility_program_desc: "NGFP는 해군 생산 및 수리 활동을 간소화하고 더 잘 적응시켜 최대 효율을 내도록 하는 지정 생산 계획입니다."
 USA_focus_small_ship_debate: "소형 함정 논쟁"
 USA_focus_small_ship_debate_desc: "현대에 들어 호위함과 초계함이라는 소형 함정 구도가 최고의 선택지로 다시 떠올랐습니다. 최상의 간소화된 전력을 만들려면, 이 둘 중 어느 쪽이 우리의 잠수함과 구축함을 뒷받침하는 핵심이 될지 결정해야 합니다."
 USA_focus_frigate_fighters: "호위함 전투원"
 USA_focus_frigate_fighters_desc: "호위함은 해군 역사 전반에 걸쳐 가장 다재다능하고 끊임없이 변화해 온 함종입니다. 구축함보다 작지만 제대로 개조하면 순양함에 맞먹는 화력을 가질 수 있습니다. 따라서 우리는 호위함을 진정한 전투함으로 만들고 해군의 주된 근간으로 삼을 것입니다."
 USA_focus_corvette_combat_flexibility: "초계함 전투 유연성"
 USA_focus_corvette_combat_flexibility_desc: "초계함은 현대 함대 편성에서 전투 효율을 합리적으로 낼 수 있는 가장 작은 함정입니다. 따라서 우리는 자유와 자유로운 해상 항행의 적을 압도하고 격파할 초계함 함대에 투자하고, 적응시키고, 개량하고, 건조할 것입니다."
 USA_focus_naval_maneuver_warfare: "해군 기동전"
 USA_focus_naval_maneuver_warfare_desc: "추진 기관 연구개발에 대한 투자는 우리의 소형 함정이 공해에서 더욱 민첩해지도록 해줄 것입니다. 이처럼 계속 향상되는 기동성은 대부분의 해군 함장들이 갖추지도 훈련받지도 못한 것이므로, 이 새로운 전투 방식에 익숙해지려면 훈련과 시간이 필요할 것입니다."
 USA_focus_increasing_contractor_incentives: "계약업체 인센티브 확대"
 USA_focus_increasing_contractor_incentives_desc: "더 나은 지침과 인센티브 패키지, 자금을 마련함으로써 해군의 민간 및 군 계약업체들이 더 큰 동기를 얻어 이전보다 더 나은 성과를 내게 될 것입니다."
 USA_focus_project_new_waves: "새 파도 계획"
 USA_focus_project_new_waves_desc: "새 파도 계획은 가능한 모든 곳, 모든 때에 쇄신하고 힘을 북돋우며 현대화하고 나아가 미래에도 대비하기 위한 전담 연구개발 구상입니다. 우리 해군은 톤수 기준으로 세계 최대이니, 모든 톤을 가치 있게 만듭시다."
 USA_focus_the_submarine_debate: "잠수함 논쟁"
 USA_focus_the_submarine_debate_desc: "잠수함은 해군 은밀성과 방어 수단의 미래입니다. 다만 우리 잠수함 함대의 공격형에 투자할지, 미사일형에 투자할지 진지하게 결정해야 합니다."
 USA_focus_the_attack_fleet: "공격 함대"
 USA_focus_the_attack_fleet_desc: "기존의 공격 잠수함과 향후 개발될 공격 잠수함에 대한 투자를 통해, 적 함선을 표적으로 삼아 신속히 격침하는 우리 해군의 역량을 최고조에 이르게 할 수 있습니다."
 USA_focus_the_missile_fleet: "미사일 함대"
 USA_focus_the_missile_fleet_desc: "잠수함에 모듈식 미사일을 대규모로 투자하면 바다의 어떤 장애물도 표적으로 삼아 파괴할 수 있습니다. 필요하다면 인공물이든 자연물이든 마찬가지입니다."
 USA_focus_carrier_direction_dilemma: "항공모함 방향성 딜레마"
 USA_focus_carrier_direction_dilemma_desc: "현대 항공모함의 역할은 갈라지고 있습니다. 한편에는 전통적인 \\"이동식 공항\\" 방식이 있습니다. 다른 한편에는 고정익 항공기보다 헬리콥터에 더 의존하는 이동식 함포 및 미사일 플랫폼이라는 발상이 있습니다. 어느 쪽이든 어제 시작했어야 했던 것처럼 서둘러 결정하고 추진해야 합니다."
 USA_focus_mobile_airports_program: "이동식 공항 계획"
 USA_focus_mobile_airports_program_desc: "더 민첩한 항공기와 발진 및 착함 보조 장치를 연구개발함으로써 우리 항공모함을 이동식 공항으로 만들 수 있습니다. 이는 결국 구축함, 순양함 등 핵심 함정에 막대한 투자를 하지 않고도 해상 전투 지역에 최대한의 화력을 투입하게 해줄 것입니다."
 USA_focus_project_gunships: "공격 헬리콥터 계획"
 USA_focus_project_gunships_desc: "더 나은 헬리콥터를 개발하는 데 대한 상당한 투자와 연구는 헬리콥터를 새로운 범용 전투 수단으로 만들어줄 것입니다. 헬리콥터의 개선이 간접적으로 지상전에도 도움이 되겠지만, 주된 목적은 우리 항모 함대에서 민첩하고 빠른 타격 전력으로 운용하는 것입니다. 현대 해군 타격 전력의 시대가 도래했으며, 우리는 그것을 실현하기 위해 여기 있습니다."
 USA_focus_strengthing_naval_training_efforts: "해군 훈련 강화"
 USA_focus_role_of_the_usmc: "해병대의 역할"
 USA_focus_role_of_the_usmc_desc: "미국 해병대는 피로 얼룩진 역사를 지녀 왔습니다. 그러나 해병대의 역할은 다시 한번 도전받고 있습니다. 고립된 작전이 일반적이고 쉽게 식별되는 적과의 \\"대전\\"이 없는 현대에서 현대 해병의 정체성은 다소 달라졌습니다. 우리는 전문화된 해병대를 계속 유지해야 할지, 아니면 해군 산하의 하위 부서로 엄격히 두기보다 지원 및 범용 성격을 강화하여 육군 쪽으로 옮겨야 할지 결정해야 합니다."
 USA_focus_marines_are_as_marines_were: "해병은 예나 지금이나 해병"
 USA_focus_marines_are_as_marines_were_desc: "상륙 작전을 개시하고 적의 해안 방어를 꿰뚫는 창이 되는 것. 그것이 해병대이며 앞으로도 그러할 것입니다. 해병이 앞장선다!"
 USA_focus_marine_lessons_in_army_clothes: "육군 군복을 입은 해병의 교훈"
 USA_focus_marine_lessons_in_army_clothes_desc: "현대 전장에서는 강력하고 전담화된 상륙 부대에 대한 필요가 점점 줄어들고 있습니다. 따라서 우리는 지상군을 통합하고 더 잘 개편하여, 물이든 아니든 지형 특성에 더 잘 적응하도록 만들 수 있습니다."
 USA_focus_repair_teams: "수리 팀"
 USA_focus_repair_teams_desc: "해병대 전문 인원으로 수리 및 피해 통제를 돕는 팀을 편성하면 우리 함선은 그 어느 때보다 빠르게 다시 바다로 나갈 수 있습니다. 꼭 필요한 경우에만 중대한 문제를 건선거에 맡기게 됩니다."
 USA_focus_a_modern_navy: "현대적 해군"
 USA_focus_a_modern_navy_desc: "좋을 때나 나쁠 때나 우리는 해냈습니다. 가장 강력한 적에게조차 맞설 해군을 만들어냈습니다. 이제 우리는 우리 자신과 동맹국을 빈틈없이 지킬 수 있을 것입니다."
 USA_focus_united_states_air_force: "미국 공군"
 USA_focus_united_states_air_force_desc: "가장 젊은 군 병과 중 하나임에도 불구하고 미 공군은 흥미로운 역사를 지니고 있습니다. 원래 USAAF, 즉 미 육군 항공대라는 이름의 육군 부서였으나, 제2차 세계대전의 요구로 공군은 독립 군 병과가 되어야 했습니다. 그 전쟁 이후 공군은 전장 우위의 현대적 상징이 되었습니다. 그러나 전쟁 양상이 변함에 따라 공군의 필요도 달라지고 있으며, 새로운 시대가 병과에 열리는 지금 지도부는 \\"현대 전장\\"이라는 끊임없이 변하는 상황에 어떻게 적응할지 알아내야 합니다."
 USA_focus_economy_class_warfare: "이코노미 클래스 전쟁"
 USA_focus_economy_class_warfare_desc: "굶주린 배로는 전쟁을 치를 수 없으며, 제대로 돌아가는 경제 없이는 더더욱 불가능합니다. 따라서 공군 예산을 생산 방식과 기종 면에서 효율적으로 재편하여, 그 성과를 다시 경제에 환원할 방법을 찾아야 합니다."
 USA_focus_the_modular_design_program: "모듈식 설계 계획"
 USA_focus_the_modular_design_program_desc: "MDP는 모든 항공기 생산을 간소화하는 계획입니다. 지나치게 특화된 여러 항공기 생산 라인을 만드는 대신, 국가의 필요에 따라 모듈식으로 조정할 수 있는 진정한 표준 항공기 모델을 만들어 가장 효율적인 생산을 보장할 수 있습니다."
 USA_focus_production_development_investments: "생산 개발 투자"
 USA_focus_production_development_investments_desc: "연구개발 구상과 전반적인 제조업 투자를 통해 생산 능력을 키우는 한편 일부 민수 성과도 창출할 수 있습니다. 이는 일자리 창출은 물론 우리 항공기의 성능을 세밀하게 다듬는 데에도 분명 도움이 될 것입니다."
 USA_focus_aeronautical_development_board: "항공 개발 위원회"
 USA_focus_aeronautical_development_board_desc: "ADB는 안전, 무기 체계 등 항공 기반 발전을 개발하는 전담 기관입니다. 다만 자금을 너무 빠듯하게 쓰지 않고 국민에게 과도한 부담을 주지 않으려면, 이러한 발전이 어느 방향으로 나아갈지 정해야 합니다. 제공권 확보를 지향할 수도 있고, 지상 지원 및 폭격 능력 전반으로 눈을 돌릴 수도 있습니다. 어느 쪽을 택하든 전쟁이 발발할 경우 앞으로 무엇을 염려해야 하는지가 결정될 것입니다."
 USA_focus_fighter_focused_budgeting: "전투기 중심 예산 편성"
 USA_focus_fighter_focused_budgeting_desc: "더 가벼운 소재, 향상된 기동 훈련, 더 나은 무기 체계. 이것들은 우리 공군을 확실히 무시할 수 없는 전력으로 만들기 위해 투자하려는 항목의 일부일 뿐입니다."
 USA_focus_bomber_focused_budgeting: "폭격기 중심 예산 편성"
 USA_focus_bomber_focused_budgeting_desc: "탑재량 파괴 능력 증대, 항공기 체계 설계 개선 등에 투자하여 우리 공군이 지상군이 맞닥뜨리는 모든 장애물을 쓸어버리도록 보장할 것입니다."
 USA_focus_civil_military_innovations_program: "민군 혁신 계획"
 USA_focus_civil_military_innovations_program_desc: "공동 개발 및 연구 시설인 C&MIP는 군사 혁신과 민간 혁신을 결합하고 한쪽이 다른 쪽에 어떻게 영감을 줄 수 있는지, 그리고 그 반대도 이해하기 위해 설계되었습니다. 이를 통해 우리 경제는 국민을 위해, 또한 국민의 방위를 위해 구축될 것입니다."
 USA_focus_a_limitless_sky: "끝없는 하늘"
 USA_focus_a_limitless_sky_desc: "하늘이 한계라고들 하지만, 미 공군은 그러한 한계가 없음을 증명하고 넘어서는 것을 병과의 목표로 삼을 것입니다."
 USA_focus_perpetual_air_dominance: "영구적 제공권"
 USA_focus_perpetual_air_dominance_desc: "무기 체계와 승무원 훈련 과정에 대한 거의 지속적인 투자를 통해, 순수한 공세로 영구적인 우위 상태를 만들어낼 수 있습니다."
 USA_focus_american_institute_for_avionics: "미국 항공전자 연구소"
 USA_focus_american_institute_for_avionics_desc: "AIA는 공군의 능력을 개발하고 향상시키는 데 주력하는 연구 센터입니다. 앞으로 훌륭한 성과가 나오기를 기대합니다."
 USA_focus_phase_one_innovations: "1단계 혁신"
 USA_focus_phase_one_innovations_desc: "1단계 혁신은 승무원 훈련의 전반적인 발전과 항공기를 다루거나 제작하는 보다 효율적인 방법을 의미합니다."
 USA_focus_phase_two_innovations: "2단계 혁신"
 USA_focus_phase_two_innovations_desc: "지속적인 투자와 연구 구상은 지상 지원과 직접적인 전장 지원 분야에서 성과를 내기 시작했습니다. 이러한 혁신이 적 진지에 대한 우리의 합동 공격을 더욱 개선하기를 기대합니다."
 USA_focus_phase_three_innovations: "3단계 혁신"
 USA_focus_phase_three_innovations_desc: "공격적인 투자는 계속해서 우리의 혁신을 높이 끌어올리고 있으며, 대형 폭격기와 탑재 화력의 파괴력에서 돌파구를 마련했습니다."
 USA_focus_paratrooper_corps: "공수 부대"
 USA_focus_paratrooper_corps_desc: "공수 부대는 육군과 공군의 독특한 병과였습니다. 제2차 세계대전의 요구로 실험적 필요에서 탄생한 공수 부대는 현대 훈련의 핵심으로 여겨집니다. C-130에서의 전통적인 강하부터 공격 헬리콥터에서의 레펠에 이르기까지, 공수 정신은 오늘날의 전장에서도 여전히 강건합니다. 이제 최고의 응집력과 효율을 보장하기 위해 우리 군 병력의 실제 필요를 파악해야 합니다."
 USA_focus_jump_wings_forever: "영원한 강하 휘장"
 USA_focus_jump_wings_forever_desc: "우리 공수 부대원은 최정예 중의 최정예이며, 가까운 미래에도 그러하도록 이 전력을 개선하고 보살필 것입니다."
 USA_focus_every_soldier_a_trooper: "모든 병사를 공수 대원으로"
 USA_focus_every_soldier_a_trooper_desc: "헬리콥터의 기동성과 급속하게 변화하는 전장의 속도는 공수 대원의 역할이 일부에 국한되지 않고 확대되어야 함을 의미합니다. 따라서 공수 부대가 수년간 얻은 교훈으로 육군을 다듬고 강화하기 위해 할 수 있는 모든 일을 하겠습니다."
 USA_focus_joint_branch_coordination_training: "합동 병과 협조 훈련"
 USA_focus_joint_branch_coordination_training_desc: "JBCT 계획은 현대 전장의 본질적 특성상 공군과 육군 병과 간의 훈련 및 협력 노력을 늘리기 위한 응집력 및 협조 훈련 계획입니다. 또한 가능한 한 병과 간 아군 오인 사고를 줄이는 데에도 도움이 될 것입니다."
 USA_focus_to_infinite_and_beyond: "무한한 공간 저 너머로!"
 USA_focus_to_infinite_and_beyond_desc: "우리 공군이 누구에게도 뒤지지 않도록 하는 우리의 혁신과 헌신은 대단했습니다. 공군을 발전시키려는 우리의 노력이 앞으로 수년간 세계의 화제가 될 것임은 의심할 여지가 없습니다."
 USA_focus_united_states_general_staff: "미국 합동참모본부"
 USA_focus_united_states_general_staff_desc: "미국의 JCS와 장성단은 시대에 따라 기껏해야 변덕스러운 집단이며 최악의 경우 연성 권력 다툼의 장입니다. 그러나 최근 몇 년간 장성단은 몇 가지 흥미로운 문제를 겪었습니다. 냉전이 끝났음에도 이어지는 부패와 과도한 지출을 둘러싼 내부 갈등, 그리고 \\"혁신가 대 구세대\\"라는 해묵은 질문이 그것입니다. 그러나 새로운 천년기에는 장교단 전체를 재교육하고 다듬는 문제가 논의 대상이 되었고, 그에 따라 여러 구상이 오가고 있습니다. 따라서 우리에게 무엇이 필요한지 정해야 합니다."
 USA_focus_army_centric_training: "육군 중심 훈련"
 USA_focus_army_centric_training_desc: "육군을 중심으로 한 재교육 및 진급 프로그램을 확대함으로써, 지휘 통제 발전에 대한 우리의 우선순위는 다가올 시기에 지상군이 두각을 나타내게 할 것입니다."
 USA_focus_army_knowledge_priority: "육군 지식 우선"
 USA_focus_army_knowledge_priority_desc: "장교단 내 진급에는 이제 공군이나 해군보다 육군 기반의 지식과 필요 조건이 더 요구될 것입니다. 이는 전투의 대부분이 벌어지는 지상군을 개선하는 데 더 많은 지휘 통제 요소가 투입되도록 보장할 것입니다."
 USA_focus_naval_centric_training: "해군 중심 훈련"
 USA_focus_naval_centric_training_desc: "해군을 중심으로 한 재교육 및 진급 프로그램을 확대함으로써, 지휘 통제 분야의 우선순위는 해군의 기동과 생존성 향상에 돌아갈 것입니다. 이는 더 많은 함선이 유연하고 적응력 있는 지휘관을 갖게 됨을 의미합니다."
 USA_focus_naval_knowledge_priority: "해군 지식 우선"
 USA_focus_naval_knowledge_priority_desc: "장교단 내 진급에는 이제 해군 병과의 지휘 통제 요소를 성장시키고 발전시키기 위해 해군 기반의 지식이 더 요구될 것입니다. 우리의 전략적 전투 대부분은 어떤 식으로든 해군과 관련되므로, 이 근간이 강하고 견고하도록 지휘관들 또한 그에 걸맞은 자질을 갖추어야 합니다."
 USA_focus_air_force_centric_training: "공군 중심 훈련"
 USA_focus_air_force_centric_training_desc: "공군을 중심으로 한 재교육 및 진급 프로그램을 확대함으로써, 지휘 통제 발전에 대한 우리의 우선순위는 다가올 시기에 공군이 두각을 나타내게 할 것입니다."
 USA_focus_air_force_priority_knowledge: "공군 지식 우선"
 USA_focus_air_force_priority_knowledge_desc: "장교단 내 진급에는 이제 공군 병과의 지휘 통제 요소를 성장시키고 발전시키기 위해 항공 기반의 지식이 더 요구될 것입니다. 현대 전장은 공중전이 거의 좌우하므로, 우리 공군이 알려진 어떤 적도 넘볼 수 없도록 보장해야 합니다."
 USA_focus_a_true_pax_americana: "진정한 팍스 아메리카나"
 USA_focus_a_true_pax_americana_desc: "개혁과 변화, 그리고 우리 권한 아래 있는 모든 군 병과의 필요를 돌보는 일. 우리 국가는 안전해질 것이며 세계는 진정한 미국식 평화가 무엇인지 알게 될 것입니다. 아드 파켐 에트 펠리치타템. \\"평화와 번영을 위하여\\"."
 USA_focus_reintroducing_mandatory_service: "의무 복무 재도입"
 USA_focus_reintroducing_mandatory_service_desc: "의회 로비를 통해 의무 복무 기간의 재도입을 관철시킬 수 있기를 기대합니다. 이는 병력 수를 유지하고 순수 지원병 중심인 현재 전력의 부담을 줄여줄 수 있습니다. 정치적 반발이 클 것이므로 입법자들에게 권고하는 기간은 6개월에 불과합니다."
 USA_focus_expanding_mandatory_service: "의무 복무 확대"
 USA_focus_expanding_mandatory_service_desc: "군과 국가 방위의 필요가 우려할 수준에 이르렀습니다. 상황을 장악하려면 반드시, 정말로 반드시 의회가 이러한 조치를 승인하도록 로비해야 합니다. 대중의 반발은 상당하겠지만, 결국 불확실성이 계속되는 이 시련의 시기에 국가 방위는 충분한 명분이 됩니다."
 USA_focus_concerning_developments: "우려스러운 전개"
 USA_focus_concerning_developments_desc: "상황이 좋지 않으며 되돌릴 수 없는 지점에 이르고 있습니다. 따라서 필요한 병력을 확보하기 위해 징집 요건을 강화해야 합니다. 고통스럽겠지만 어떠한 논쟁의 위험도 감수할 수 없습니다."
 USA_focus_desperate_measures: "필사의 조치"
 USA_focus_desperate_measures_desc: "상황은 계속 악화되고 있으며, 어디로든 나아가려면 극단적인 조치가 필요합니다. 장비를 사용할 남녀가 없다면 장비는 아무 의미도 없습니다."
 USA_focus_congressional_chaos: "의회의 혼란"
 USA_focus_congressional_chaos_desc: "우리 역사상 처음으로 선거인단에서 교착 상태에 빠졌습니다. 누구의 후보가 실제로 선거에서 이겼는지를 두고 적대감이 계속 쌓이면서 전국에서 소규모 폭동이 시작되었습니다. 이에 의회는 이 문제를 어떻게 해결할지 정신없이 고심하고 있습니다."
 USA_focus_secretary_to_president: "장관에서 대통령으로"
 USA_focus_secretary_to_president_desc: "어느 모로 보나 최악의 연극입니다. 이런 \\"종말 시나리오\\"에서 헌법 문구가 정한 선택지는 이미 한정되어 있습니다. 양측 모두 홍보 악몽을 겪고 있으며 사회 질서와 우리 체제에 대한 신뢰가 더욱 무너질 가능성이 높아졌습니다. 따라서 우리는 대통령 승계법을 발동하고 전례 없는 조치를 취해야 합니다. 하원과 상원을 건너뛰고 현직 국무장관을 취임시키는 것입니다. 우리에게는 안전한 선택이며, 이 나라의 역사에서 국가의 심장과 토대를 이토록 날카롭게 꿰뚫은 일은 겪어 본 적이 없었던 만큼 국가적으로 처음 있는 일입니다..... 이런 일이 다시는 일어나지 않기를 신께 간구합니다."
 USA_focus_reassuring_wall_street: "월스트리트 안심시키기"
 USA_focus_reassuring_wall_street_desc: "위기가 지나갔으니 우선 월스트리트 및 투기꾼들과 협력하여 이들이 주식 시장을 다시 불황으로 몰아넣지 못하도록 막아야 합니다. 월스트리트와 메인스트리트 모두와 관련된 표적 회담과 일부 선별적 구제 계획이 모두를 진정시킬 것입니다."
 USA_focus_restarting_aid_programs: "원조 계획 재개"
 USA_focus_restarting_aid_programs_desc: "오래전 연방 정부는 농가의 우유를 보조하고 사들여 낙농업 농민을 구하려 했습니다. 그러나 농민들은 이것이 실제로 무엇을 의미하는지 간파하고 생산 능력을 확대했습니다. 결국 정부는 이를 알아차리고 대부분 바로잡았지만, 국민이 유제품을 더 많이 소비하도록 하는 비공개 구상을 진행했습니다. 그러나 잉여분이 워낙 막대하여 \\"정부 치즈\\"라는 또 다른 구상이 시작되었습니다. 이 단순한 계획은 구세대에게 인상을 남겼고, 대부분의 새로운 세대는 저렴하거나 무료로 치즈를 얻을 수 있던 시절을 결코 알지 못할 것입니다. 그러나 이제는 아닙니다. 비축량을 보관하는 비용이 되돌려주는 비용보다 훨씬 더 많이 들기 때문에 이 계획이 재개됩니다. 사람들의 식탁에 더 많은 음식이 오르면 특정 지역의 건강 문제에 대한 우려와 특정 복지 사업의 필요가 줄어들며, 이에 더해 비축량이 줄어 정부의 보관 비용도 낮아집니다. 모두가 승자입니다."
 USA_focus_specification_act: "명세법"
 USA_focus_specification_act_desc: "의회의 상황은 점점 더 정체되어 이번 최근 위기가 국가를 뿌리까지 뒤흔들 정도에 이르렀습니다. 이에 따라 명세법이 발표되었는데, 이는 의회 법안이 하나의 주제나 사안에 부합해야 한다고 규정하여 의회 질서의 끊임없는 붕괴를 막는 입법입니다. 단일 사안 방식은 로비 활동의 주고받기 전술로 법안이 부풀려지는 것을 막으므로, 이는 거의 모든 분야에서 국가 관료제를 크게 줄이는 결과로 이어질 가능성이 높습니다. 또한 이 방식에서 장려되는 규제 철폐는 부담해야 할 간접비를 줄여 더 많은 민간 부문 사업을 열어 줌으로써 경제에 이익이 될 수 있습니다."
 USA_focus_national_armed_services_audit: "국가 군 감사"
 USA_focus_national_armed_services_audit_desc: "군사 지출 규모와 그 실제 성과를 둘러싼 논란은 모병 수치 하락과 군 전체에 대한 대중 인식의 부정적 추세로 이어졌습니다. 이에 군에 대한 국가 감사가 실시될 것이며, 이를 통해 상황이 개선되고 군사 지출의 전반적인 필요가 줄어들기를 기대합니다. 지출 증가 추세가 사라지지는 않겠지만, 이미 가진 것에서 더 많은 것을 얻어낼 수 있다면 적어도 기하급수적인 증가 속도는 늦출 수 있습니다."
 USA_focus_reduce_and_expand_act: "축소 및 확대법"
 USA_focus_reduce_and_expand_act_desc: "R&E 법은 연방의 SAT 및 시험 기반 요건을 평가하고 줄이며, 확대된 수업을 도입하는 학교와 학군에 대한 자금 지원을 장려하는 입법입니다. 가정 및 금융 수업 같은 과목은 미래 세대가 돈을 관리하고 스스로를 돌보며 요리하는 법을 배우게 하여 안정에 크게 기여할 것입니다."
 USA_focus_domestic_over_foreign: "외교보다 내정"
 USA_focus_domestic_over_foreign_desc: "이 새로운 평화의 시대에 다른 이들을 돌보는 일을 계속 생각하려면 우리 자신에게 더 눈을 돌려야 합니다. 따라서 외교 정책 중심의 예산 편성을 재정비하여 일부 국내 구상으로 전용할 것입니다."
 USA_militarist_economic_militarism: "경제적 군국주의"
 USA_militarist_economic_militarism_desc: "우리나라는 강하며, 세계 평화와 안정을 확보할 원자재와 인적 자원의 역량을 갖추고 있습니다. 그러나 너무 오랫동안 정치인들은 귀중한 자원을 전방위적으로 낭비했습니다. 따라서 우리는 공화국의 적들이 일으키려는 어떤 군사적 충돌에도 대비하도록 경제를 재편하기 시작할 것입니다."
 USA_militarist_economic_r_and_d: "경제 R&D"
 USA_militarist_economic_r_and_d_desc: "경제 최적화 노력을 지속하려면 경제 R&D 활동을 수립해야 합니다. 이를 통해 우리나라의 경제 안보를 확보할 것입니다."
 USA_militarist_national_wellness_programs: "국가 복지 프로그램"
 USA_militarist_national_wellness_programs_desc: "NWP는 국가를 위해 헌신하는 이들에게 보답하는 일련의 방법입니다. 시민이 국가를 돌보면 국가도 마찬가지로 그리할 것입니다. 우리가 전쟁을 앞두고 있을 수 있는 만큼 이러한 정서는 모두에게 무겁게 다가옵니다."
 USA_militarist_strategic_quotas: "전략 할당량"
 USA_militarist_strategic_quotas_desc: "우리의 경제력은 한계를 모를 것입니다. 그러나 위기와 전쟁의 시기에는 희생이 요구되므로, 우리는 앞으로 국민에게 무엇이 요구될 수 있는지에 대한 인식과 이해를 심어주기 위해 순환식 전략 할당량 일정을 시행할 것입니다."
 USA_militarist_integrated_corps_of_engineers: "통합 공병단"
 USA_militarist_integrated_corps_of_engineers_desc: "공병단과 군의 다른 부문을 공공사업 등에 활용함으로써, 우리는 시민들이 아직 경험해 보지 못한 새로운 개발 기준을 만들 수 있습니다. 그뿐만 아니라 먼 타국에서 죽을 필요가 없음을 알면 누가 입대하고 싶지 않겠습니까. 이야말로 공짜 홍보라 할 만합니다."
 USA_militarist_investing_in_naval_companies: "해군 기업 투자"
 USA_militarist_investing_in_naval_companies_desc: "여러 해군 관련 기업 내 연구 구상에 자금을 지원하면 민간과 군수 산업 모두 새로운 함선을 만들고 수리 노력을 가속할 방법을 찾을 수 있을 것입니다. 군사 혁신이 새로운 민간 혁신을 낳고 그 반대도 마찬가지임을 기억하십시오."
 USA_militarist_automations_act: "자동화 법"
 USA_militarist_automations_act_desc: "잠재적 경제 생산량을 높이고 잠재적 징집 풀을 키우려면 가능한 곳에서 가능한 때에 자동화에 투자해야 합니다. 국민이 좋아할 일은 아니지만 우리가 살아남으려면 필요한 악입니다."
 USA_militarist_mea: "의무 고용 관리국"
 USA_militarist_mea_desc: "MEA는 일자리가 없는 이들을 고용하도록 돕는 정부 행정 기구입니다. 뉴딜 시대의 세 글자 기관 몇 곳에서 영감을 받아, MEA는 일자리가 필요한 모든 이들을 돕기 위해 존재합니다."
 USA_militarist_fwip: "미래전 혁신 프로그램"
 USA_militarist_fwip_desc: "FWIP는 내일의 전투 부대를 만드는 혁신에 전념하는 연구 개발 복합체입니다. 끊임없는 노력으로 우리는 우리 군이 전 세계에서 비견될 데 없도록 보장할 것입니다."
 USA_militarist_army_armaments_improvements: "육군 무장 개선"
 USA_militarist_army_armaments_improvements_desc: "개발 계약을 통해 우리는 병사들이 장비하는 무장을 개선할 수 있습니다. 이로써 전장을 지키고 점령하는 우리 육군의 전반적인 역량을 높이기를 기대합니다."
 USA_militarist_mobile_observation_force: "기동 관측대"
 USA_militarist_mobile_observation_force_desc: "MOF는 정찰 구상과 관련된 특수 부대입니다. 이 새 부대는 적의 움직임을 계속 파악하고, 가능한 때와 장소에서 우리 병력이 다가오는 공격과 전반적인 움직임에 대해 최대한 경고를 받도록 하는 임무를 맡은 고기동 부대가 될 것입니다."
 USA_militarist_localized_logistics: "현지화 군수"
 USA_militarist_localized_logistics_desc: "더 작은 단위와 유연성 지표 측면에서 개선된 군수는 우리 육군이 더 잘 조율되고 적이 무엇을 던지든 더 잘 대비하도록 해줄 것입니다."
 USA_militarist_naval_gunnery_advancements: "해군 포술 발전"
 USA_militarist_naval_gunnery_advancements_desc: "새로운 포술 훈련 체계를 연구하고 함대의 현행 탄약과 무기 체계를 개선하는 것은 연안 해역을 방어하고 필요하다면 적에게 전투를 걸기 위해 가장 중요합니다."
 USA_militarist_propulsion_advancements: "추진 기술 발전"
 USA_militarist_propulsion_advancements_desc: "해군 함정의 엔진과 추진 체계를 개선하면 우리 함선이 그 어느 때보다 빠르게 서로에게 도달할 수 있습니다. 다가올 전쟁에서 이것이 가져올 전장의 주도권은 말할 것도 없습니다."
 USA_militarist_increased_pay_incentives: "급여 인센티브 인상"
 USA_militarist_increased_pay_incentives_desc: "우리 해군 인력은 대부분 적 부대로부터 제대로 탈출할 기회가 거의 없는 무방비한 표적입니다. 이러한 어려움은 우리가 그들에게 제대로 보상해야 함을 뜻합니다. 이 보상과 함께 모든 함선과 승조원의 생존과 효율을 보장하기 위해 적 부대와의 전투 및 이탈에 관한 해군 훈련도 늘릴 것입니다."
 USA_militarist_aircraft_improvements: "항공기 개선"
 USA_militarist_aircraft_improvements_desc: "더 낫고 더 민첩한 항공기를 만드는 데 투자하는 것은 이러한 전쟁 기계를 제대로 다룰 수 있도록 인력에도 투자해야 함을 의미합니다. 따라서 우리는 시민들을 위해 맑은 하늘을 만들고자 그렇게 할 것입니다."
 USA_militarist_increasing_drill_intensity: "훈련 강도 상향"
 USA_militarist_increasing_drill_intensity_desc: "항공기 훈련을 다듬고 강화하며 개선하여 전반적 효율을 높이면 임무 효율과 전투 능력에서 성과를 거둘 것입니다."
 USA_militarist_weapon_system_innovations: "무기 체계 혁신"
 USA_militarist_weapon_system_innovations_desc: "항공기의 무기 체계 개선에 대한 연구 개발 투자는 더 효과적인 전투 상황으로 이어질 것이며, 가능한 한 장래의 분쟁에서 순이익을 거두는 결과가 되기를 기대합니다."
 USA_militarist_pre_emptive_mobilization: "선제 동원"
 USA_militarist_pre_emptive_mobilization_desc: "때가 왔습니다. 우리의 미래가 확실히 보장되도록 국가를 동원하기 시작해야 합니다."
 USA_militarist_securing_southern_interests: "남부 이익 확보"
 USA_militarist_securing_southern_interests_desc: "만연한 조직 폭력과 현대에 걸맞지 않게 다소 무능한 연방 정부 속에서, 멕시코는 대륙 지배력과 반구의 안보를 확보하는 열쇠입니다."
 USA_militarist_operation_clean_streets: "깨끗한 거리 작전"
 USA_militarist_operation_clean_streets_desc: "남부 영토를 확보했으니, 이제 대규모 폭력 조직 패거리들을 이 지역에서 몰아내고 영토를 통합하기 시작하는 엄격한 소탕 작전에 나서야 합니다."
 USA_militarist_securing_atlantic_interests: "대서양 이익 확보"
 USA_militarist_securing_atlantic_interests_desc: "쿠바, 자메이카, 히스파니올라라는 주요 섬나라를 확보함으로써 우리는 유례없는 반구 안보의 선례를 세웁니다."
 USA_militarist_operation_paradise: "낙원 작전"
 USA_militarist_operation_paradise_desc: "낙원 작전은 새 영토를 연결하여 군사 기반시설을 통합하고 즉시 활용하기 위한 것입니다."
 USA_militarist_policing_and_cultural_programs: "치안 및 문화 프로그램"
 USA_militarist_policing_and_cultural_programs_desc: "우리의 새로운 성과는 언제나 우리나라와 시민들을 훼손하려는 자들에 직면할 것입니다. 따라서 우리는 단순히 미국인이나 쿠바인 등이기 이전에 인간이라는 점에서 단결과 통일성을 촉진하는 문화 프로그램을 도입해야 합니다. 덤으로 경찰과 헌병대를 늘리고 통합하는 것도 지나친 선동을 가라앉히는 데 도움이 될 수 있습니다."
 USA_militarist_a_true_leader_of_the_western_world: "서방 세계의 진정한 지도자"
 USA_militarist_a_true_leader_of_the_western_world_desc: "우리 반구를 확보하려면 서방 세계의 진정한 지도력도 확보해야 합니다. 나토 회원국에 대한 어떤 공격도 동맹 전체에 대한 선전포고가 된다는 점을 기억하십시오. 따라서 이번 타격이 우리의 미래를 결정할 것입니다. 신이시여, 우리 모두를 도우소서."
 USA_militarist_operation_great_north: "북방 대작전"
 USA_militarist_operation_great_north_desc: "먼지가 가라앉고 승리를 확보했으니, 이제 대륙 지배력과 반구 패권을 통합하고 확보하기 시작할 수 있습니다."
 USA_militarist_operation_atlantic_viking: "대서양 바이킹 작전"
 USA_militarist_operation_atlantic_viking_desc: "그린란드와 아이슬란드의 아북극 땅, 그리고 대서양의 방벽 섬인 페로 제도를 확보하면 우리의 대서양 연결이 안전해지고 신구 대륙 간에 더 직접적인 군수 망을 갖출 수 있습니다."
 USA_militarist_operation_atlantic_wall: "대서양 방벽 작전"
 USA_militarist_operation_atlantic_wall_desc: "서방 세계 지도자라는 우리의 지위가 확고해졌으니, 그 지위가 안정적이고 유지 가능하도록 보장해야 합니다. 따라서 우리는 모든 대서양 영토를 확보하고 이를 이용해 군수, 시장, 그리고 대륙 안쪽의 나라들을 통제하는 데 도움을 얻을 것입니다. 미래는 지금이며 미래는 밝습니다."
 USA_militarist_humanity_marches_onwards: "인류는 계속 전진한다"
 USA_militarist_humanity_marches_onwards_desc: "세계에서 우리의 입지는 확보되었고, 우리 국민은 적어도 만족하고 있습니다. 길은 아직 끝나지 않았지만, 우리는 과도한 군사화를 되돌리고 경제 발전 단계에 더 비중을 둘 수 있는 중대한 시점에 있습니다. 이것이 길이며, 우리가 머지않은 장래에 별에 닿게 될 것은 바로 이 길을 통해서입니다. 뭉치면 서고 갈라지면 모두 쓰러졌습니다."
 USA_fascist_closed_border: "폐쇄된 국경"
 USA_fascist_closed_border_desc: "나라와 그 문화적 온전성을 지키려면 국경을 폐쇄해야 합니다. 그 후에야 우리 사회에 기여할 수 있는 합당한 사람들을 받아들이기 시작할 수 있도록 이민 정책을 어떻게 개혁할지 선택할 수 있습니다."
 USA_fascist_family_planning_incentives: "가족계획 인센티브"
 USA_fascist_family_planning_incentives_desc: "우리가 진정으로 나라를 바로잡고 새롭고 순수한 길을 제시하려면, 먼저 우리 자신을 무엇보다 우선해서 돌봐야 합니다. 출산율 하락은 국가가 발전할수록 일어나는 세계적인 문제입니다. 그러나 일부가 필요하다고 느끼는 것처럼 단순히 \\"원숭이로 돌아가는\\" 대신, 우리는 가족과 임신 중인 부모를 돕고 지원하는 프로그램을 만듭니다. 이는 새 가정의 부담을 덜고, 새로운 세대가 재정적 영향으로 인한 수렁 같은 고난을 겪지 않도록 미래를 보장합니다."
 USA_fascist_encouraging_productivity_quotas: "생산성 할당량 장려"
 USA_fascist_encouraging_productivity_quotas_desc: "우리 시민은 최고의 제품을 누릴 자격이 있으며 우리는 그것을 제공할 것입니다. 알려진 재화와 서비스의 소비 통계를 정밀하게 조정하면 이러한 사치품이나 일상 용품의 가격을 내리는 할당량을 설정할 수 있습니다. 이는 모든 시민의 삶의 질을 향상시킬 것입니다."
 USA_fascist_federal_sponsored_emmigration_programs: "연방 후원 이주 프로그램"
 USA_fascist_federal_sponsored_emmigration_programs_desc: "우리나라에는 납세자들의 후한 젖줄과 사회의 활동적인 구성원을 돌보는 자애로운 연방 프로그램을 빨아먹는 거머리와 기생충이 있습니다. 그러므로 그들이 거절할 수 없는 제안을 해야 합니다. 비슷한 삶의 질을 가진 나라나 달러의 가치가 더 높은 좋은 환율의 나라 등 여러 나라를 대상으로, 우리는 일부가 되어 버린 자원의 지속적인 유출을 평화롭게 없앨 수 있는 방안을 마련합니다."
 USA_fascist_strategic_automation_programs: "전략 자동화 프로그램"
 USA_fascist_strategic_automation_programs_desc: "SAP 법은 필요한 물자의 생산을 늘려 나라와 시민의 삶의 질 발전에 더 나은 추세를 만들기 위한 목표형 자동화 구상입니다."
 USA_fascist_forging_new_innovations: "새로운 혁신의 단조"
 USA_fascist_forging_new_innovations_desc: "혁신 연구소는 내일의 연구 개발 복합체입니다. 경쟁에서 앞서 나갈 수 있게 해줄 새로운 연구 기준을 제시합니다."
 USA_fascist_the_development_corps: "개발단"
 USA_fascist_the_development_corps_desc: "개발단 창설은 수형자와 지원자, 실업자를 징집하여 사회를 개선하는 데 제 몫을 하게 하는 연방 구상입니다. 수형자는 개발단 복무 중의 선행으로 서서히 형기를 채울 수 있으며, 지원자와 실업자는 어려운 때에 추가 혹은 최초의 소득을 얻을 수 있습니다."
 USA_fascist_developing_prison_workforces: "수감자 노동력 개발"
 USA_fascist_developing_prison_workforces_desc: "노동부는 수감자 노동 관리국, 곧 PLA를 창설하려 합니다. PLA는 전용 작업장을 통해 갱생 프로그램을 만드는 임무를 맡습니다. 1차 산업과 일부 2차 산업에서는 노동력 대체가 이루어질 수 있으며, 이는 전반적으로 더 넓은 사회에 이익이 될 것입니다."
 USA_fascist_gearing_the_nation_for_survival: "생존을 위한 국가 정비"
 USA_fascist_gearing_the_nation_for_survival_desc: "우리나라는 순수하고 우리 시민은 강한 의지와 정신을 지녔습니다. 우리는 그들에게 적이 누구인지 보여주고, 우리의 삶의 방식을 지키기 위해 마주한 생존 문제를 알려야 합니다. 이른바 \\"서방 세계\\"는 우리나라와 수 세기 전에 우리가 차지했어야 할 마땅한 위치를 제한하려고만 합니다. 새로운 운명이 구현될 것이며 아무도 우리를 막지 못할 것입니다."
 USA_fascist_retooling_officer_corps_requirements: "장교단 요건 개편"
 USA_fascist_retooling_officer_corps_requirements_desc: "입대 요건과 진급 기회를 이념적 동기에 더 영향을 받도록 바꿈으로써 우리는 지휘 체계 내의 통일성과 단결의 기준을 세웁니다. 이는 야전과 사령부 지휘 요소 모두에서 목표 달성을 위한 한층 풍부한 활력을 가져오기를 기대합니다."
 USA_fascist_ideological_motivation_drills: "이념 동기 부여 훈련"
 USA_fascist_ideological_motivation_drills_desc: "각 병사가 무엇을 위해 싸우는지, 그리고 적이 누구인지에 대한 가치관을 불어넣음으로써, 다른 대부분의 나라가 도저히 재현할 수 없는 의지력을 우리 병사들에게 만들어낼 수 있습니다. 우리는 강해지기로 선택했기에 더 강합니다. 단결이 곧 힘입니다."
 USA_fascist_improved_logistical_organizations: "군수 조직 개선"
 USA_fascist_improved_logistical_organizations_desc: "우리나라는 거대하며 북쪽으로 가든 남쪽으로 가든 영토가 광대하여 대량 수송에 적합하지 않습니다. 따라서 우리 병사들이 언제 어디서든 전쟁을 치르는 데 필요한 모든 물자를 받도록, 군수의 운영 방식을 재편하고 개선해야 합니다."
 USA_fascist_general_weapons_testing_complex: "종합 무기 시험 단지"
 USA_fascist_general_weapons_testing_complex_desc: "GWTC는 전반적인 군용 무기 체계를 개선하기 위한 전담 시험 시설입니다... 그게 전부이며 그 이상은 없습니다."
 USA_fascist_phase_two_weapons_testing: "2단계 무기 시험"
 USA_fascist_phase_two_weapons_testing_desc: "이야말로 돈값을 더 톡톡히 한다고 할 만합니다."
 USA_fascist_engineering_better_engines: "더 나은 엔진 설계"
 USA_fascist_engineering_better_engines_desc: "모든 크기의 엔진을 개선하면 적 전선의 틈을 파고들 더 나은 기동성을 가질 수 있습니다. 우리의 하늘을 순찰하고 지킬 더 민첩하고 유능한 항공기를 만들 수 있습니다. 게다가 함선의 기동성과 순찰 빈도를 개선하여 적이 늘 긴장하도록 할 수 있습니다."
 USA_fascist_paying_the_dues_our_soldiers_deserve: "병사들의 마땅한 대가 지불"
 USA_fascist_paying_the_dues_our_soldiers_deserve_desc: "지원병과 징집병을 막론하고 우리 병사들은 이 나라를 위해 목숨을 바치며, 따라서 영웅으로 대우받아야 합니다. 병사들이 하는 일이 진정으로 인정받고 있다는 인상을 주도록 그들의 급여는 하는 일을 반영해야 합니다."
 USA_fascist_militarized_economy: "군사화된 경제"
 USA_fascist_militarized_economy_desc: "국민은 준비되었으며 우리는 마지막 준비 단계를 밟고 있습니다. 곧 새로운 시대가 우리에게 올 것이며 서반구에 대한 우리의 세계적 안보는 보장될 것입니다."
 USA_fascist_operation_pig_bay_two: "피그스 만 2 작전"
 USA_fascist_operation_pig_bay_two_desc: "쿠바는 CIA의 실패한 피그스 만 작전 이래로 우리를 피해 왔습니다. 더는 아닙니다. 이제 우리가 공식적으로 지휘하고 있으며 두 번째 판에 나설 준비가 되었습니다. 이번에는 우리가 승리할 것입니다."
 USA_fascist_operation_hispaniola: "히스파니올라 작전"
 USA_fascist_operation_hispaniola_desc: "걸프 및 주변 국가들에 대한 발판을 확보하려면, 다음으로 큰 섬인 히스파니올라를 점령해야 합니다. 이곳에는 안정적인 나라와 불안정한 나라인 도미니카 공화국과 아이티가 있습니다. 점심시간 전에 끝날 것입니다."
 USA_fascist_operation_makin_me_happy: "메이킨 미 해피 작전"
 USA_fascist_operation_makin_me_happy_desc: "우리의 영향력을 더 넓히려면 바하마 제도와 섬나라 자메이카를 확보해야 합니다. 이는 우리의 초기 성과 주변에 방벽을 두르는 동시에 추가 진출의 발판을 마련해 줍니다."
 USA_fascist_operation_clean_sweep: "싹쓸이 작전"
 USA_fascist_operation_clean_sweep_desc: "도미노 줄처럼 이 섬나라들을 하나하나 무너뜨릴 것입니다."
 USA_fascist_extra_territorial_corps: "역외 영토단"
 USA_fascist_extra_territorial_corps_desc: "ETC의 창설은 새 영토를 명확하고 철저하게 관리할 수 있도록 전담 예비대를 만들기 위한 것입니다."
 USA_fascist_operation_cartel: "카르텔 작전"
 USA_fascist_operation_cartel_desc: "걸프와 카리브 지역을 확보했으니 이제 반구 진출에 온전히 집중할 수 있습니다. 국경에서부터 취약한 멕시코 국가를 쳐서 다시 한 번 법과 질서의 땅으로 만들 것입니다."
 USA_fascist_operation_fruit_master: "프루트 마스터 작전"
 USA_fascist_operation_fruit_master_desc: "미국의 이익은 중앙아메리카 국가들을 떠난 적이 없습니다. 기업적 이유든 국가적 이유든 미국은 늘 이 나라들의 일에 간섭해 왔습니다. 이제 허우적대는 이 나라들이 어떤 면에서도 스스로를 지키지 못하는 듯하니 직접 통치와 통제의 때가 왔습니다."
 USA_fascist_operation_gran_colombia: "그란 콜롬비아 작전"
 USA_fascist_operation_gran_colombia_desc: "이제 우리의 반구 남쪽 절반으로 전쟁을 가져가는 마지막 단계가 다가왔습니다. 트리니다드 토바고를 발판으로 삼아 가이아나와 수리남이라는 더 작은 나라들을 침공할 수 있습니다. 이 발판은 서쪽으로 밀고 나아가 남아메리카 북쪽 절반을 휩쓸게 해줄 것입니다."
 USA_fascist_operation_amazon: "아마존 작전"
 USA_fascist_operation_amazon_desc: "남아메리카 대륙의 \\"최종 보스\\"인 브라질은 가장 큰 난관이 될 것입니다. 자연적으로 적대적인 땅을 가로지르는 군수는 병력의 질과 군수 요구에 즉각적인 영향을 줄 수밖에 없기 때문입니다. 그럼에도 우리는 전진하여 반구를 통일할 것입니다."
 USA_fascist_operation_la_plata: "라플라타 작전"
 USA_fascist_operation_la_plata_desc: "끝에서 두 번째 단계입니다. 라플라타 지역과 그 주변이 곧 우리의 품에 들어올 것입니다."
 USA_fascist_proclaiming_the_union: "연방 선포"
 USA_fascist_proclaiming_the_union_desc: "아메리카의 땅은 거의 한 뼘도 빠짐없이 이제 우리의 것입니다. 마침내 단결이 이루어졌으나 임무는 끝나지 않았습니다. 내부를 재편하고 강화하여 마지막 단계를 준비해야 합니다. 대북방 원정입니다."
 USA_fascist_the_final_chapter: "마지막 장"
 USA_fascist_the_final_chapter_desc: "연방이 선포되었고 지구 우리 쪽에는 적이 거의 없습니다. 이제 임무를 마무리하고 필요하다면 구세계에 전쟁을 가져가야 합니다."
 USA_monarchist_nobility_act: "귀족 법"
 USA_monarchist_nobility_act_desc: "현대 귀족의 창설에는 신중한 고민이 필요합니다. 현대 귀족은 사회의 어떤 계층에서도 나올 수 있습니다. 그러나 각 계층에 공정하도록 계층마다 고유한 요건이 있을 것입니다. 예를 들어 사업계 거물은 국가 경제 성장에 대한 일정 금액(추후 결정)의 투자를 입증해야 하며, 또한 적십자 같은 공인 자선 단체에 일정 금액을 기부해야 합니다. 기타 등등입니다. 이는 새 귀족 법의 일례일 뿐이며, 사회적 상승과 삶에 도움이 되는 개인적 목표로 이어질 문을 열어줄 것입니다."
 USA_monarchist_tied_to_office_act: "직위 연동 법"
 USA_monarchist_tied_to_office_act_desc: "\\"직위 연동 법\\"은 \\"칭호\\"의 수적 순서를 공식화하는 법입니다. 칭호를 혈통에 묶는 어리석은 기준 대신, 해당 직위에 묶거나 귀족 법의 경우 귀족 칭호 허가를 받기 위해 충족한 요건에 묶을 것입니다."
 USA_monarchist_workforce_welfare_act: "노동력 복지 법"
 USA_monarchist_workforce_welfare_act_desc: "WWA는 장애와 출산 휴가 및 기타 관련된 노동 불능 질환에 대한 노동자 보상과 관련된 복지 국가 부문을 개혁하고 다듬는 데 쓰이는 법입니다."
 USA_monarchist_education_investments_act: "교육 투자 법"
 USA_monarchist_education_investments_act_desc: "교육 제도에 대한 포괄적 투자는 경제와 시민들이 참여하고 스스로 만들어낼 수 있는 일자리 전반에 걸친 전국적 개선을 가능하게 할 것입니다."
 USA_monarchist_declaring_the_empire: "제국 선포"
 USA_monarchist_declaring_the_empire_desc: "오늘 우리는 궁극의 개혁을 이룹니다. 입헌 공화국에서 선출 군주제를 가진 입헌 공화국으로의 전환입니다. 오늘부터 우리는 \\"신성 아메리카 제국\\"으로 불립니다."
 USA_monarchist_readjusting_foreign_trade_policies: "대외 무역 정책 재조정"
 USA_monarchist_readjusting_foreign_trade_policies_desc: "우리 고유의 천연 자원을 활용하여, 우리가 우리의 비축분을 쓰도록 강요하려는 국가 간 무역 계획을 재협상할 수 있습니다. 합리적으로 가능한 한 오래 그 비축분을 아낄 수 있다면 향후 무역 협정과 세계 경제적 영향력에 대한 장기 투자가 될 것입니다."
 USA_monarchist_penal_labour_corps: "형무 노동단 창설"
 USA_monarchist_penal_labour_corps_desc: "노동 사업을 중심으로 한 갱생 프로그램을 만들어 공공 기반시설을 개선하거나 1차 산업의 생산성을 높일 수 있습니다. 이로써 더 많은 물자를 국내 생산으로 되돌려 시민들의 전반적인 삶의 질에 이바지할 수 있습니다."
 USA_monarchist_creating_more_domestic_supply_chains: "국내 공급망 확충"
 USA_monarchist_creating_more_domestic_supply_chains_desc: "새로운 국내 공급망을 만들어 지역 경제 구성의 다양화에 집중하면, 우리나라는 더 자립하고 한때 소수 국가들이 장악했다고 여겼던 시장에도 진출할 수 있습니다."
 USA_monarchist_expanding_military_education_programs: "군사 교육 프로그램 확대"
 USA_monarchist_expanding_military_education_programs_desc: "주니어 예비역 장교 훈련단, 곧 JROTC라는 지도자 프로그램을 확대하고 잠재적으로 의무화함으로써, 군에 대한 수동적 노출을 통해 지원율을 높일 수 있습니다. 덤으로 군에서와 마찬가지로 민간 노동력에서도 똑같이 유용한 리더십 기술을 미래 세대에게 가르칠 수도 있습니다."
 USA_monarchist_army_investments: "육군 투자"
 USA_monarchist_army_investments_desc: "자금을 늘려 일반 보병 개개인과 관련된 개선에 투입하면, 각 병사가 지닐 전투 능력을 더 높일 수 있습니다."
 USA_monarchist_baby_stepping_mandatory_service: "의무 복무 단계적 도입"
 USA_monarchist_baby_stepping_mandatory_service_desc: "이 나라는 존재한 거의 내내 전적으로 지원병 제도를 유지해 왔습니다. 그러나 현대의 전쟁과 적이 이토록 모호하고 알 수 없는 만큼 사후 대응보다 선제 대응이 낫습니다. 따라서 국민이 병역의 기초라도 익히도록 4개월의 의무 복무 기간을 도입하는 법이 시행될 것입니다."
 USA_monarchist_naval_investments: "해군 투자"
 USA_monarchist_naval_investments_desc: "우리 해군의 역량과 능력을 향상시키면 지구 이쪽 편이든 아니든 어떤 적 침공군도 선제 타격할 수 있을 것입니다."
 USA_monarchist_improving_shipping_industries: "해운 산업 개선"
 USA_monarchist_improving_shipping_industries_desc: "투자하고 더 나은 계약을 체결함으로써 우리는 국가의 해운 및 전반적인 해군 산업을 개선하기를 바랍니다. 이는 지정학적 얽힘의 현대를 헤쳐 나가려는 우리에게 민간과 군사 양쪽 분야에서 도움이 될 것입니다."
 USA_monarchist_dedicated_aeronautical_research_institute: "전담 항공 연구소"
 USA_monarchist_dedicated_aeronautical_research_institute_desc: "ARI는 공군을 전에 없이 효과적으로 개선하고 발전시키는 데 전념하는 연구 개발 복합체입니다."
 USA_monarchist_hemispheric_influence: "반구 영향력"
 USA_monarchist_hemispheric_influence_desc: "소프트 파워와 은근한 영향력을 통해, 이미 다수의 영향력을 가진 반구를 좀 더 직접적인 방식으로 통제할 수 있습니다."
 USA_monarchist_the_northern_kingdom_agreement: "북부 왕국 협정"
 USA_monarchist_the_northern_kingdom_agreement_desc: "\\"북방의 제국\\"이라고도 하는 광대한 캐나다 땅은 서반구의 필요에 더 부합해야 합니다. 그러므로 우리는 영국인들이 한때 지녔던 의미 있는 존재감에서 오래전에 멀어졌음을 그들이 이해하도록 압박하고 도와야 합니다. 그러나 그들이 단결, 무역, 혁신의 새 시대의 일원이 되게 할 수 있습니다. 우리는 그들을 설득해야 하며, 반드시 설득해야 합니다."
 USA_monarchist_the_southern_kingdom_agreement: "남부 왕국 협정"
 USA_monarchist_the_southern_kingdom_agreement_desc: "멕시코의 성향은 본질적으로 긍정적이었던 적이 없습니다. 우리는 이를 이용해 그 나라에 공공 질서와 안정을 보장하는 동시에, 모두의 복리를 위해 그들을 진지하게 도우려 한다는 점을 보여주는 무역 구상을 내놓을 수 있습니다. 그들이 이해해 주기만을 바랄 뿐입니다."
 USA_monarchist_the_federation_proposal: "연합 제안"
 USA_monarchist_the_federation_proposal_desc: "역사적 적대감에도 불구하고, 우리는 쿠바에 우리의 선의를 이해시키고 더 친서방 반구 의제를 원한다는 점을 설득하기 위해 최선을 다할 수 있습니다. 그들에게 이로운 것은 반구 전체에 이롭습니다. 또한 카리브 해 통합에 청신호를 주어 거래를 더 달콤하게 만들 수 있습니다. 그들에게 충분히 달콤하기만을 바랍니다."
 USA_monarchist_the_united_principalities_offer: "연합 공국 제안"
 USA_monarchist_the_united_principalities_offer_desc: "대체로 비교적 긍정적인 역사를 가진 나라인 파나마와의 회담을 주도함으로써, 우리는 파나마가 이끌고 우리가 질서 유지를 돕는 중앙아메리카 국가 연합 또는 연방을 만들 수 있습니다."
 USA_monarchist_gran_colombian_kingdom: "그란 콜롬비아 왕국"
 USA_monarchist_gran_colombian_kingdom_desc: "남부 대륙 통합 노력을 시작하기 위해 콜롬비아에 접근하여 그란 콜롬비아 왕국의 재건을 함께 추진할 것입니다. 옛 영광은 언제나 상호 이익을 위한 좋은 제안입니다."
 USA_monarchist_brazi_comes_to_you: "브라질이 당신에게 온다"
 USA_monarchist_brazi_comes_to_you_desc: "모두가 브라질이 나쁜 곳이라고 말하며, \\"너 브라질로 가게 될 거야\\"라는 농담까지 있습니다. 그렇다면 브라질이 그들에게 가게 하고자 합니다. 우리는 브라질에 대륙 남쪽 절반을 통합할 능력을 제공하고 그들의 이익을 보호하며 공동의 반구 연합을 선도할 것입니다."
 USA_monarchist_operation_screaming_eagle: "울부짖는 독수리 작전"
 USA_monarchist_operation_screaming_eagle_desc: "너무 오랫동안 세계가 우리 반구 안에서 간섭하고 선동하며, 더 평화로운 상태를 만들려는 우리의 노력을 희석시켜 왔습니다. 물론 우리가 과거에 실수를 저질렀지만 이제 그만입니다. 우리가 만들어갈 길과 운명을 보장하기 위해 보다 과감하고 직접적인 조치를 취할 것입니다. 신세계는 다시 한 번 새로워질 것입니다."
 USA_monarchist_operation_initial_gains: "초기 성과 작전"
 USA_monarchist_operation_initial_gains_desc: "우리는 병력을 키우고 동맹을 준비할 시간을 가졌으며, 이제 날개를 펴고 대륙들을 통합할 때입니다."
 USA_monarchist_economic_investments: "경제 투자"
 USA_monarchist_economic_investments_desc: "오늘 우리는 새로운 서반구 경제 프로그램을 주도합니다. 우리가 함께 번영할 수 있도록 우리의 새롭고 가장 가까운 동맹과 종속국의 발전을 촉진하고 장려할 것입니다."
 USA_monarchist_public_unity_programs: "공공 단결 프로그램"
 USA_monarchist_public_unity_programs_desc: "PUP는 새로운 국가들 내의 공공 단결을 장려하고 새로운 반구 \\"신세계\\" 정체성을 증진하기 위한 전담 상호 원조 프로그램입니다. 새 연합의 일원이라는 이 공유된 가치는 우리의 발전과 서로에 대한 이해를 이끌고 행성 너머로 나아가는 새 시대를 열 것입니다. 우리 모두가 함께 일한다면 저 위대한 너머 외에 진정으로 집중할 것이 무엇이 있겠습니까."
 USA_monarchist_operation_midtown_madness: "미드타운 매드니스 작전"
 USA_monarchist_operation_midtown_madness_desc: "통합의 다음 단계가 다가왔습니다. 쿠바와 파나마는 상대할 나라가 여럿이지만, 콜롬비아와 브라질에는 지형이 훨씬 험난합니다. 따라서 우리는 적들을 각개 격파하는 방식으로 이들의 사상자를 줄일 것입니다."
 USA_monarchist_operation_new_world: "신세계 작전"
 USA_monarchist_operation_new_world_desc: "통합의 마지막 단계가 다가왔습니다. 이제 신뢰하는 동맹과 종속국이 신세계의 나머지를 통합할 차례이며, 이를 통해 새롭고 단결된 미래의 길을 닦을 수 있습니다."
 USA_monarchist_continued_economic_ties: "지속적인 경제적 유대"
 USA_monarchist_continued_economic_ties_desc: "경제 협력과 유대를 더욱 증진하기 위해 신세계 경제 교류, 곧 NWEE를 시작합니다. 이 프로그램은 발전 노력을 개선하고 신세계인 정체성이라는 기반 그 자체를 만드는 데 계속 힘쓸 것입니다."
 USA_monarchist_a_new_world_mineral_order: "신세계 광물 질서"
 USA_monarchist_a_new_world_mineral_order_desc: "동맹과 종속국에 대한 우리의 헌신을 보여주기 위해 반구 전역에 걸쳐 대규모 광물 투자 계획을 감내할 것입니다. 상당히 비용이 들겠지만 분명히 그만한 가치가 있습니다."
 USA_red_junta_the_commissariat_declaration: "정치위원단 선언"
 USA_red_junta_the_commissariat_declaration_desc: "우리 인민의 군대는 통제권을 장악하였으며 노동자의 삶을 더 낫고 안전하게 만들고자 합니다. 따라서 이 약속을 온전히 이해하기 위해 우리는 아메리카 연합 정치위원단이 될 것입니다. 시민의 복지와 안전을 돌보는 단결된 인민의 군사력입니다."
 USA_red_junta_service_welfare_programs: "복무 복지 프로그램"
 USA_red_junta_service_welfare_programs_desc: "인원 수가 적정 수준을 유지하도록, 군이 제공하는 특정 인센티브를 확대하기 시작할 것입니다. 전반적으로 큰 변화를 기대하지는 않지만 모병을 장려하는 동시에 민간 노동력으로 복귀하는 이들에게 더 많은 것을 돌려줄 것입니다."
 USA_red_junta_public_service_corps: "공공 봉사단"
 USA_red_junta_public_service_corps_desc: "PSC는 일종의 노동단 및/또는 민군 합동 공병단입니다. 발전 사업이나 기반시설 유지 보수를 돕는 것이 목적입니다."
 USA_red_junta_improved_service_health_programs: "복무 의료 프로그램 개선"
 USA_red_junta_improved_service_health_programs_desc: "현역 및 전역 군인을 위한 의료 프로그램에 투자하면 군 복무 중과 전역 후의 돌봄을 장려하여 모병 인원이 늘어나기를 기대합니다."
 USA_red_junta_industrious_innovators_act: "근면한 혁신가 법"
 USA_red_junta_industrious_innovators_act_desc: "IIA는 경제 혁신과 경제 생산량 향상 방안을 촉진하기 위한 입법 및 자금 법안입니다."
 USA_red_junta_industrial_expansion_fund: "산업 확장 기금"
 USA_red_junta_industrial_expansion_fund_desc: "IEF는 새로운 경제 개발 사업을 만들고, 이용 가능한 일자리를 늘릴 뿐만 아니라 경제 구성도 개선하기 위한 전담 기금입니다."
 USA_red_junta_infrastructure_improvement_fund: "기반시설 개선 기금"
 USA_red_junta_infrastructure_improvement_fund_desc: "기반시설 개발에 자금을 더 잘 배정하면 공급망이 서로 더 낫고 원활하게 연결되어 전반적인 경제 생산량을 개선할 수 있습니다."
 USA_red_junta_strategic_resource_development_act: "전략 자원 개발 법"
 USA_red_junta_strategic_resource_development_act_desc: "SRDA는 미국 동쪽 절반의 광물 채굴 개선을 장려하고 거의 의무화하는 전담 자금 지원 및 규제 철폐 노력입니다. 특히 \\"북부\\"와 \\"남부\\" 주로 간주되는 지역 사이에 놓인 중간 주들을 따라 진행됩니다."
 USA_red_junta_strategic_resource_western_development_act: "서부 개발 법"
 USA_red_junta_strategic_resource_western_development_act_desc: "WDA는 SRDA의 연장으로, 콜로라도와 유타 등 중간 주들을 따라 이어지는 서부의 전략적 개발 추세를 계속합니다."
 USA_red_junta_rotating_training_programs: "순환 훈련 프로그램"
 USA_red_junta_rotating_training_programs_desc: "순환 훈련 체계를 구축하면 우리 병력의 전반적인 효율을 개선할 수 있습니다. RTP는 우리 병력이 접하게 될 지형 훈련의 다양화에 중점을 둡니다. 요컨대 하루 또는 며칠은 습지에서 훈련하고 그다음에는 사막에서 훈련할 수 있습니다."
 USA_red_junta_officer_refinement_program: "장교 정련 프로그램"
 USA_red_junta_officer_refinement_program_desc: "지도부를 다듬고 향상시키는 데 끊임없이 노력함으로써 우리는 군의 지휘 및 통제 요소가 최대한 효율적이도록 보장할 수 있습니다. 이는 가능한 한 모든 군종에 순간적인 의사결정은 물론 전장에서의 위험 평가와 관리 면에서 이익이 될 것입니다."
 USA_red_junta_army_advancements_program: "육군 발전 프로그램"
 USA_red_junta_army_advancements_program_desc: "AAP는 육군 군종의 전반적 개선을 위한 포괄적 투자입니다. 무기 체계와 장비, 병사들은 우리가 완성하려는 더 큰 퍼즐의 조각에 불과합니다."
 USA_red_junta_increased_training_programs: "훈련 프로그램 확대"
 USA_red_junta_increased_training_programs_desc: "전투와 비전투 상황 모두에서 해군 훈련 프로그램을 늘리고 선두를 유지하면 병사들이 배속된 함정에 더 익숙해집니다. 그 결과 각 함정 승조원의 관리와 전투 평가를 통해 우리 해군 인력이 스스로를 최대한 발전시킬 수 있도록 우리가 도구를 제공할 수 있습니다."
 USA_red_junta_naval_propulsion_program: "해군 추진 프로그램"
 USA_red_junta_naval_propulsion_program_desc: "NPP는 해군 함정의 엔진과 추진 체계를 개선하여 기동성에서 전투상 우위를 제공하기 위한 전담 연구 프로그램입니다."
 USA_red_junta_naval_gun_research_initiative: "해군 함포 연구 구상"
 USA_red_junta_naval_gun_research_initiative_desc: "우리 해군 인력은 전력이라는 퍼즐의 한 조각일 뿐입니다. 적 부대를 물리치는 것은 고사하고 진정으로 자신을 방어하려면 해군 무기 체계를 개선해야 합니다."
 USA_red_junta_improved_armaments: "무장 개선"
 USA_red_junta_improved_armaments_desc: "항공기 무기 체계를 개량하고 발전시킴으로써 전투 상황에서의 전반적인 효율을 높일 수 있습니다."
 USA_red_junta_bettering_aircraft_models: "항공기 모델 개선"
 USA_red_junta_bettering_aircraft_models_desc: "기존 항공기 모델을 개량하면 더 민첩한 공중 기동을 보장하여 적 부대로부터 공역을 효과적으로 확보할 수 있습니다."
 USA_red_junta_further_airforce_investments: "공군 추가 투자"
 USA_red_junta_further_airforce_investments_desc: "공군 군종에 대한 전반적 투자를 늘림으로써, 시간이 길어지고 투자가 계속될수록 군이 도달할 수 있는 새로운 개선과 발전의 기준을 세웁니다."
 USA_red_junta_establishing_the_warplanning_department: "전쟁 기획부"
 USA_red_junta_establishing_the_warplanning_department_desc: "경제력과 군사력을 충분히 확장했으니, 이제 혁명을 가장 필요로 하는 이들에게 전파하는 구상에 착수할 수 있습니다."
 USA_red_junta_war_plan_maple_leaf: "메이플 리프 전쟁 계획"
 USA_red_junta_war_plan_maple_leaf_desc: "전쟁 기획부 산하 신세계부의 일환입니다. 초기 목표는 극북을 확보하여 우리의 전략적 상황을 최대한 안전하게 만드는 것입니다."
 USA_red_junta_war_plan_cartel_cleanup: "카르텔 소탕 전쟁 계획"
 USA_red_junta_war_plan_cartel_cleanup_desc: "전략적 위치를 계속 확보하는 가운데, 남쪽 이웃의 명백히 불안정한 상태는 우리 국가 안보에 큰 우려입니다. 외국 적대 세력이 멕시코를 발판으로 삼을 가능성은 차치하더라도, 멕시코 영토 상당 지역의 카르텔과 거의 부족 사회와 같은 성격은 이번에 완전히 정리하기에 충분한 이유입니다."
 USA_red_junta_war_plan_havana: "아바나 전쟁 계획"
 USA_red_junta_war_plan_havana_desc: "쿠바 섬은 카리브 지역에서 가장 큰 섬으로 상당히 전략적인 위치를 차지합니다. 멕시코 만으로 들어가는 관문일 뿐 아니라 더 넓은 대서양에 대한 방벽이기도 합니다. 따라서 우리는 무역과 우리가 아는 서반구의 평화를 보장할 궁극의 항구 및 해군 망을 위해 이곳을 확보해야 합니다."
 USA_red_junta_war_plan_homeward_bound: "귀향 전쟁 계획"
 USA_red_junta_war_plan_homeward_bound_desc: "우리는 위대한 진격의 다음 장을 시작합니다. 구세계로 돌아가 선대가 이루지 못한 일을 마무리하고, 경제적 사회주의의 가치를 유럽의 대중에게 전파하는 것입니다."
 USA_red_junta_war_plan_round_three: "제3라운드 전쟁 계획"
 USA_red_junta_war_plan_round_three_desc: "두 번의 세계 대전을 겪고도 그들은 여전히 교훈을 얻지 못했습니다. 그래도 이번에는 그들의 잘못이 아니며 그저 좋은 사업일 뿐이라는 점이 위안입니다."
 USA_red_junta_war_plan_black_back_hand: "검은 손 전쟁 계획"
 USA_red_junta_war_plan_black_back_hand_desc: "검은 손은 세르비아 민족주의와 반오스트리아-헝가리 열기에 기반한 비밀 결사였습니다. 그들이 세계 대전을 일으킨 곳에서 우리는 가장 공격적인 구성원을 정리하여 발칸의 평화를 마무리할 것입니다. 결국 \\"세르비아인이 있는 곳이 세르비아\\"라는 말은 제국주의에 지나지 않습니다."
 USA_red_junta_war_plan_outback: "아웃백 전쟁 계획"
 USA_red_junta_war_plan_outback_desc: "오스트레일리아 \\"대륙\\"은 태평양과 극동의 안정을 확보하기 위한 디딤돌일 뿐입니다. 그러므로 그 첫걸음을 나중이 아닌 지금 내디뎌야 합니다."
 USA_red_junta_war_plan_java: "자바 전쟁 계획"
 USA_red_junta_war_plan_java_desc: "인도네시아는 오스트레일리아에서 중국으로 이어지는 길을 사실상 열어 주는 가장 큰 섬나라입니다. 최후의 전투를 위한 제대로 된 도약 지점을 갖추려면 이 나라를 확보해야 합니다."
 USA_red_junta_war_plan_great_leap_forward: "대약진 전쟁 계획"
 USA_red_junta_war_plan_great_leap_forward_desc: "최종 보스, \\"위대한 중국\\". 중국적 특색을 가진 유사 광신적 전체주의가 아닌 진정한 경제적 사회주의를 퍼뜨린다면 더는 위대하지 않을 것입니다. 마오는 중국이라는 나라를 발전시키기 위해 대약진을 했고, 이제 우리가 세계 평화와 사회주의 가치의 진정한 미래를 확보하기 위해 대약진을 할 차례입니다."
 USA_red_junta_war_peace_in_our_time: "우리 시대의 평화"
 USA_red_junta_war_peace_in_our_time_desc: "신세계와 구세계, 극동이 이제 안정되었고 전략 지역과 주요 위협이 봉쇄되었으니, 우리는 이 땅들을 더 평화롭고 절제된 삶의 터전으로 되돌리기 위해 세계 정치위원단을 창설할 수 있습니다. 우리는 세계 평화 협정을 공고히 하고 우리 종을 위한 새로운 길을 열 것입니다."
 USA_american_trotskist_reindustrialization_priority: "재산업화 우선"
 USA_american_trotskist_reindustrialization_priority_desc: "나라는 산업의 힘을 잃었으며, 우리는 목표를 이루기 위해 이를 바로잡을 것이고 바로잡아야 합니다."
 USA_american_trotskist_national_economic_revival_act: "국가 경제 부흥 법"
 USA_american_trotskist_national_economic_revival_act_desc: "NERA는 전국의 산업화를 촉진하기 위한 공격적인 지출 패키지 입법입니다."
 USA_american_trotskist_securing_our_resources: "자원 확보"
 USA_american_trotskist_securing_our_resources_desc: "무역을 최소한으로 제한함으로써 더욱 완전히 발달한 국내 공급망을 만들기 시작할 수 있습니다. 결과적으로 이는 채굴 사업에 더 잘 투자하여 전체 산출량을 늘리는 데도 도움이 됩니다."
 USA_american_trotskist_national_armaments_expansion_act: "국가 군비 확장 법"
 USA_american_trotskist_national_armaments_expansion_act_desc: "NAEA는 군수 산업 기반을 확장하기 위한 재정 법안입니다. 우리 경제력의 이 핵심 요소는 우리가 마땅히 가야 할 미래를 보장할 것입니다."
 USA_american_trotskist_national_naval_industrialization_act: "국가 해군 산업화 법"
 USA_american_trotskist_national_naval_industrialization_act_desc: "NNIA는 해군 및 해운 산업 기반을 확장하고 개선하기 위한 목표형 재정 법안입니다. 우리는 무역과 우리 안팎의 해역을 확보해야 합니다."
 USA_american_trotskist_the_red_army: "주홍 육군"
 USA_american_trotskist_the_red_army_desc: "우리 병력이 가능한 곳과 가능한 때에 전술 기동에서 최고의 공격성을 갖도록 훈련받는 가운데 우리의 주홍색 깃발이 높이 휘날릴 것입니다."
 USA_american_trotskist_the_red_navy: "주홍 해군"
 USA_american_trotskist_the_red_navy_desc: "훈련 수단을 개선하고 병사들이 자신이 무엇을 위해 싸우는지 그 핵심을 이해하도록 적응시킴으로써, 우리는 대부분의 나라가 실패하는 부분에서 싸울 의무감과 열정을 불어넣을 것입니다. 결과적으로 해군 예산 일부를 연구 개발 지표 쪽으로 돌려 함정의 무기 체계를 개선할 수 있습니다."
 USA_american_trotskist_the_red_airforce: "주홍 공군"
 USA_american_trotskist_the_red_airforce_desc: "항공기와 그 무기 체계에 관한 연구 개발에 투자함으로써, 공격적인 전술적 이점에 집중하여 공군의 전투 능력을 향상시킬 수 있습니다."
 USA_american_trotskist_national_mobilization: "국가 동원"
 USA_american_trotskist_national_mobilization_desc: "나라는 정비되었으며, 이제 대투쟁에 대비하도록 해야 합니다."
 USA_american_trotskist_the_commissar_corps: "정치위원단"
 USA_american_trotskist_the_commissar_corps_desc: "CAC, 곧 정치위원 육군단의 창설은 지도자와 병사들이 자신들의 삶이 지키도록 만들어진 것을 지키고 방어하도록 동기를 부여하는 훌륭한 방법입니다. 그것은 그들의 가족, 가정, 그리고 우리가 모두의 마음에 소중히 간직하려 애쓰는 가치입니다."
 USA_american_trotskist_the_permanent_revolution: "영구 혁명"
 USA_american_trotskist_the_permanent_revolution_desc: "주사위는 던져졌으며 이제 평화의 새 시대를 열어야 합니다. 혁명을 통해 우리는 사회주의 국가와 그 인민의 세계적 지위를 확보할 것입니다."
 USA_american_trotskist_marching_south: "남진"
 USA_american_trotskist_marching_south_desc: "그리하여 우리가 신세계와 그 \\"사회주의\\"를 향한 필사적 시도, 제국주의적 독재자들, 그리고 서방의 잡종 정부들을 해방하기 시작하면서 도미노가 무너질 것입니다. 우리는 신속히 파나마 운하까지 내려가 남아메리카 대륙의 문턱에 이를 것입니다."
 USA_american_trotskist_workers_paradise: "노동자의 낙원"
 USA_american_trotskist_workers_paradise_desc: "실패한 사회주의 국가인 쿠바는 사회주의의 오점입니다. 나머지는 영국과 프랑스의 애완견과 착취자들이 뒤섞여 있을 뿐입니다. 우리는 이들을 발판 삼아 육지와 바다 양쪽에서 남쪽 대륙을 서서히 포위해 나아갈 것입니다."
 USA_american_trotskist_new_world_order: "신세계 질서"
 USA_american_trotskist_new_world_order_desc: "남아메리카의 문 앞에 자리 잡은 우리는 우리가 만든 이 문을 돌파하여 신세계에 새로운 질서를 세우기 위해 나설 것입니다. 혁명 만세!"
 USA_american_trotskist_the_eagle_descends_onto_the_continent: "독수리, 대륙에 내려앉다"
 USA_american_trotskist_the_eagle_descends_onto_the_continent_desc: "영구 혁명을 확보하기 위한 가장 약하면서도 가장 부유한 고리입니다. 아프리카는 광대하고 다양한 땅이며, 사회주의 세계 혁명을 계속하고 확보하려면 따라서 우리는 훌륭한 통제 구역을 확립해야 합니다."
 USA_american_trotskist_the_northern_cleanup: "북부 소탕"
 USA_american_trotskist_the_northern_cleanup_desc: "대륙 북부를 확보하면 결국 구세계로 돌아가기 위한 중동과 지중해 접근로가 열립니다."
 USA_american_trotskist_operation_congo_cabal: "콩고 비밀결사 작전"
 USA_american_trotskist_operation_congo_cabal_desc: "콩고 비밀결사 작전은 중앙아프리카 지역을 제국주의적, 자본주의적이며 철저히 반노동자적인 정부 통제로부터 해방하는 것입니다."
 USA_american_trotskist_operation_geographic_horn: "지리적 뿔 작전"
 USA_american_trotskist_operation_geographic_horn_desc: "아프리카의 뿔, 또는 단순히 동아프리카는 이제 지구 양쪽에서 아시아와 태평양으로 우리의 영향력을 열어 줄 것입니다."
 USA_american_trotskist_operation_capetown: "케이프타운 작전"
 USA_american_trotskist_operation_capetown_desc: "신세계를 확보했으니 이제 남극 접근로의 3분의 2를 확보할 기회가 있습니다. 이를 확보하면 외국 탐사 임무를 막고, 우리 자체 임무를 수행하며 천연 자원 탐사를 할 수 있는 활동 범위가 넓어질 것입니다."
 USA_american_trotskist_operation_old_world: "구세계 작전"
 USA_american_trotskist_operation_old_world_desc: "신세계의 마지막 조각을 확보함으로써 우리는 구세계도 끌어들일 가능성이 있으므로, 우리 유산인 앵글로 문화권이 유래한 곳에 기반을 선제적으로 구축해야 합니다."
 USA_american_trotskist_operation_norse: "노르스 작전"
 USA_american_trotskist_operation_norse_desc: "켈트 제도에 얻은 발판에서 우리는 위대한 북방 원정을 계속하여 스칸디나비아 국가들을 해방할 수 있습니다."
 USA_american_trotskist_operation_west_has_fallen: "서방 함락 작전"
 USA_american_trotskist_operation_west_has_fallen_desc: "섬들에 얻은 발판에서 이제 대륙 최서단 국가들에 분명한 거점을 확보할 수 있습니다. 구세계의 해방은 신속하고 정당할 것입니다."
 USA_american_trotskist_operation_black_sea: "흑해 작전"
 USA_american_trotskist_operation_black_sea_desc: "극북에서 내려와 러시아 국가의 영속적인 독재와 우리가 해방할 유럽의 나머지를 가르는 해방의 장벽을 세울 것입니다."
 USA_american_trotskist_operation_vistula: "비스와 작전"
 USA_american_trotskist_operation_vistula_desc: "오늘 우리는 구세계의 핵심을 해방하기 시작하며 동쪽으로의 진군을 시작합니다. 과두제적 \\"민주주의\\"에서 자본주의 착취자들에 이르기까지, 구세계의 인민들을 하나하나 해방할 것입니다."
 USA_american_trotskist_operation_cradle: "요람 작전"
 USA_american_trotskist_operation_cradle_desc: "문명의 요람이면서도 가장 파괴적인 인민과 정부 중 일부로 가득 차 있습니다. 더는 아닙니다. 우리는 해방하여 이 땅의 노동자들에게 진정한 문명을 가져다주고 새로운 미래를 만들 것입니다. 모두에게 밝고 주홍빛인 미래를 말입니다."
 USA_american_trotskist_operation_sarajevo: "사라예보 작전"
 USA_american_trotskist_operation_sarajevo_desc: "세계 대전은 발칸에서 시작되었으며, 이제 우리는 해방하고 추가 사망과 불필요한 파괴를 막고자 합니다."
 USA_american_trotskist_operation_caging_the_bear: "곰 가두기 작전"
 USA_american_trotskist_operation_caging_the_bear_desc: "러시아 국가는 한때 소비에트 사회주의 공화국 연방이었으나 실패했으며 사회주의라는 이름의 오점입니다. 우리는 그 인민을 해방하고 독재자와 자본주의 착취자를 가두어 지구상에서 이 오점을 지울 것입니다."
 USA_american_trotskist_operation_himalayas: "히말라야 작전"
 USA_american_trotskist_operation_himalayas_desc: "북쪽 관문을 확보했으니 이제 남쪽 관문을 만들 수 있습니다. 여기서부터 우리는 세계 해방을 가로막는 마지막 장애물에 대비할 것입니다."
 USA_american_trotskist_operation_great_leap_forward: "대약진 작전"
 USA_american_trotskist_operation_great_leap_forward_desc: "최종 보스와 그 부하들 및/또는 사이드 퀘스트입니다. 중화인민공화국은 소련의 실패 이후 사회주의라는 단어에 붙은 가장 큰 오점입니다. 세계 혁명을 제대로 완수하려면 우리는 그 땅과 인민을 해방할 것이고 해방해야 합니다. 이 \\"최종 보스\\" 이후에는 진정한 공산주의와 세계 평화 및 번영으로 가는 길을 가로막는 것이 없습니다. 이제부터는 오직 별만이 한계입니다."
 USA_not_have_republicans_in_charge_TT: "§Y[conservatism_L]§!이(가) 집권당이 아님"
 USA_not_have_democrats_in_charge_TT: "§Y[liberalism_L]§!이(가) 집권당이 아님"
 USA_idea_light_infantry_dominance: "경보병 우위"
 USA_idea_light_infantry_dominance_desc: "유지와 장비 보급에 비용이 적게 들고 훈련과 무장에서 유연한 경보병은 약자처럼 보이는 현대전의 초석입니다. 우리는 약자를 무리의 지도자로 만들 것이며, 부대 편성과 병참의 혁신, 그리고 필요한 모든 상황을 위한 신무기가 이를 뒷받침할 것입니다. 우리는 이 모든 면에서 승리할 것입니다."
 USA_idea_mobile_infantry_doctrine: "기동 보병 교리"
 USA_idea_mobile_infantry_doctrine_desc: "다목적 차량과 경수송 차량의 기동성, 그리고 평범한 도보 병사에게 현대 전장의 요구에 맞는 무장을 갖추는 다용도성을 활용함으로써 미래의 포괄적이고 유연한 육군을 보장합니다."
 USA_idea_armored_infantry_supremacy: "기갑 보병 우위"
 USA_idea_armored_infantry_supremacy_desc: "전차는 개발과 배치에도 비용이 들고 전장에서 잃을 위험도 큽니다. 그렇다면 평범한 도보 병사가 곧 전차라면 어떨까요. 적어도 평범한 보병 분대가 일종의 \\"전차\\"라면 말입니다."
 USA_idea_repurposing_armored_programs: "기갑 계획 용도 전환 지침"
 USA_idea_repurposing_armored_programs_desc: "RAP 지침은 모든 전차 생산을 중단하고, 더 가벼운 장갑 차량과 표준 보병 부대를 중심으로 제조와 군 조직의 재편을 시작하는 것입니다."
 USA_idea_tank_rehabilitation_programs: "전차 재활 계획"
 USA_idea_tank_rehabilitation_programs_desc: "TRP는 전차 및 중장갑 부대 전반의 생산과 전력 운용을 정비하고 효율화하기 위해 설계되었습니다. 경차량을 줄이는 대가로, 우리의 전차 전력은 보병의 변함없는 동반자가 될 것입니다."
 USA_idea_revitalized_artillery_innovations: "되살아난 포병 혁신"
 USA_idea_revitalized_artillery_innovations_desc: "투자와 전담 연구개발 계획을 통해 우리 포병은 낡은 시대의 병과를 새롭게 되살려 현대 전장을 지배하게 될 것입니다."
 USA_idea_light_vehicle_innovations: "경차량 혁신"
 USA_idea_light_vehicle_innovations_desc: "LVI 구상은 보병전투차와 장갑차 같은 경장갑 차량을 더 유연하고 적응력 있게 개발하고 다듬는 데 연구개발을 더 집중하기 위한 것입니다. 이는 전차 전력을 육군의 중요한 하위 병과가 아니라 일종의 특수 전력으로 삼는다는 뜻입니다."
 USA_idea_tank_innovations: "전차 혁신"
 USA_idea_tank_innovations_desc: "전차와 그에 준하는 장비에 자금을 집중하면 강력한 화력과 타격력을 갖춘 다목적 전력을 만들 수 있습니다."
 USA_idea_mass_motorization_efforts: "대규모 차량화 노력"
 USA_idea_mass_motorization_efforts_desc: "표준화와 집중 노력의 강화를 통해 우리는 이제 육군을 진정한 기동 전력으로 바꿀 수 있습니다."
 USA_idea_defensive_artillery_program: "방어 포병 계획"
 USA_idea_defensive_artillery_program_desc: "전장에서의 영향력과 효율을 염두에 두고 야포와 그 승무원의 생존성을 높이기 위해 설계된 연구개발 계획입니다. 여기에는 장비 제조, 최전선 교전으로부터의 유효 사거리, 기동 용이성 등이 포함됩니다."
 USA_idea_offensive_artillery_program: "공세 포병 계획"
 USA_idea_offensive_artillery_program_desc: "OAP는 공세적 수단을 통한 생존성을 위해 설계된 연구개발 계획입니다. 현대전은 끊임없이 움직이며, 포병 자체도 그래야 합니다. 현대식 자주포 부대는 새로운 장갑과 엔진 혁신을 연구함으로써 기동성과 생존성의 근간이 될 것이며, 우리 육군의 \\"유리 대포\\"뿐 아니라 이를 통해 나머지 차량화 전력까지 돕게 될 것입니다."
 USA_idea_maneuver_logistics: "기동 병참"
 USA_idea_maneuver_logistics_desc: "더 기동성 있는 보급 및 병참망을 구축함으로써, 급변하는 전장에서 육군의 필요를 더 잘 분산하여 충족할 수 있습니다."
 USA_idea_defense_support_force: "특수 전선 방어 지원"
 USA_idea_defense_support_force_desc: "SFDP는 미 육군 군종 내의 새로운 특수부대 하위 병과 명칭이자 전투 임무입니다. 가능한 곳 어디에서나, 가능한 때 언제든, 부대가 동원할 수 있는 모든 수단으로 방어 진지와 포위될 우려가 있는 동맹군을 돕고 지원하도록 설계되었습니다."
 USA_idea_precision_strike_force: "정밀 타격 부대"
 USA_idea_precision_strike_force_desc: "SFG 부대를 최첨단 장비로 무장시키고 최상의 훈련 체계를 부여함으로써, 우리는 타격과 무력 집행의 기준을 세웁니다."
 USA_idea_steamlining_naval_production: "해군 생산 간소화"
 USA_idea_steamlining_naval_production_desc: "설비 재편과 헌신을 통해 우리 함선의 생산, 개장, 수리를 더 잘 적응시키고 간소화하여 필요한 곳에 보낼 수 있습니다."
 USA_idea_frigate_fighter_groups: "호위함 전투단"
 USA_idea_frigate_fighter_groups_desc: "호위함은 우리의 근간이 될 것이므로, 이를 최대한 강력하게 만들기 위해 필요한 적절한 관리와 자원으로 우리의 근간을 뒷받침해야 합니다."
 USA_idea_corvette_combat_prowess: "초계함 전투력"
 USA_idea_corvette_combat_prowess_desc: "초계함은 날렵하고 빠르며 모듈식입니다. 이러한 특성이 바다만큼 많은 강철에 현대 항모 전단의 전투 능력을 부여합니다. 따라서 우리는 현재와 미래의 초계함 활용을 적응시키고, 투자하며, 확대하여 두 배로 세계 최고의 해군을 만들 것입니다."
 USA_idea_attack_fleet_investments: "공격 함대 투자"
 USA_idea_attack_fleet_investments_desc: "무슨 일인지 알아차리기도 전에 바다에서 날려 버리겠습니다, 함장님!"
 USA_idea_missile_fleet_investments: "미사일 함대 투자"
 USA_idea_missile_fleet_investments_desc: "수평선에 빙산이 보입니다, 함장님! \\"그럼 날려 버리게.\\""
 USA_idea_mobile_airports_program: "이동 공항 계획"
 USA_idea_mobile_airports_program_desc: "MAP는 우리 항모를 사실상 광대 차처럼 만들기 위한 전담 연구개발 계획으로, 더 많이 실을수록 더 많은 피해를 줄 수 있습니다."
 USA_idea_project_gunship: "공격 헬리콥터 계획"
 USA_idea_project_gunship_desc: "날렵하고 치명적이라, 바로 내가 원하던 것이다."
 USA_idea_modern_marine_corps: "현대 해병대"
 USA_idea_modern_marine_corps_desc: "같은 일, 다른 날, 적의 사기를... 그리고 얼굴도 박살 낼 멋진 새 장난감들."
 USA_idea_brothers_in_arms: "전우"
 USA_idea_brothers_in_arms_desc: "해병이든 육군이든 모두 엄연히 엉클 샘의 군인입니다. 그러나 해병대가 육군의 훈련과 향상을 도울 수 있으며, 이는 어떤 전장에 나서든 뒤흔들 수 있는 통합된 연합 전력을 만들어 냅니다."
 USA_idea_project_modular: "모듈러 계획"
 USA_idea_project_modular_desc: "항공기 조립소에 오신 것을 환영합니다. 마음껏 원하는 대로 항공기를 맞춤 설계하실 수 있습니다."
 USA_idea_aeronautical_development_board_fighter: "항공 개발 위원회 - \\"전투기 중점\\""
 USA_idea_aeronautical_development_board_fighter_desc: "ADB의 예산은 이루어질 모든 전투기 및 제공권 혁신에 우선 배정되었습니다."
 USA_idea_aeronautical_development_board_bomber: "항공 개발 위원회 - \\"폭격기 중점\\""
 USA_idea_aeronautical_development_board_bomber_desc: "ADB의 예산은 이루어질 모든 폭격기 및 지상 지원 혁신에 우선 배정되었습니다."
 USA_idea_aia_phase_one: "AIA 1단계"
 USA_idea_aia_phase_one_desc: "미국 항공전자연구소의 개발이 성과를 내기 시작했습니다. 이런 연구개발은 비용이 많이 들지만 분명 입증된 성과가 있습니다."
 USA_idea_aia_phase_two: "AIA 2단계"
 USA_idea_aia_phase_two_desc: "미국 항공전자연구소의 새로운 발전이 지상 지원 분야로까지 뻗어 나가면서 노력이 커지고 있습니다."
 USA_idea_aia_phase_three: "AIA 3단계 \\"앨버트로스\\""
 USA_idea_aia_phase_three_desc: "승무원과 장비의 허용 한계에 대한 적극적인 연구와 조사, 그리고 개선된 대형 항공기는 꿈도 꾸지 못했던 성과를 안겨 주었습니다. 이제 우리 공군은 누구도 따라올 수 없는 하늘을 날고 있습니다."
 USA_idea_paratrooper_corps: "공수 부대"
 USA_idea_paratrooper_corps_desc: "육군 전반의 훈련 개선과 전문화 강화로 우리 공수부대의 역량이 다듬어지고 명확해지며 높아질 것입니다."
 USA_idea_army_air_enhancements: "육군, 항공 강화"
 USA_idea_army_air_enhancements_desc: "장비와 훈련의 통합을 통해 육군의 역량을 강화하고 전반적인 개선을 이루어, 우리 병사들이 대적할 자 없도록 유지할 수 있습니다."
 USA_idea_army_centric_officer_corps_training: "육군 중심 장교단 훈련"
 USA_idea_army_centric_officer_corps_training_desc: "훈련 계획과 진급 요건을 육군의 필요와 지식에 맞춰 편성하면, 우리의 지휘통제 능력이 앞으로 지상군의 능력에 크게 영향을 미칠 것입니다."
 USA_idea_navy_centric_officer_corps_training: "해군 중심 장교단"
 USA_idea_navy_centric_officer_corps_training_desc: "훈련 계획과 진급 요건을 해군의 필요와 지식에 맞춰 편성합니다. 이는 우리의 지휘통제 능력이 앞으로 해군 전력의 능력에 크게 영향을 미친다는 뜻입니다."
 USA_idea_air_centric_officer_corps_training: "공군 중심 장교단 훈련"
 USA_idea_air_centric_officer_corps_training_desc: "훈련 계획과 진급 요건을 공군의 필요와 지식에 맞춰 편성합니다. 이는 우리의 지휘통제 능력이 앞으로 공군의 능력에 크게 영향을 미친다는 뜻입니다."
 american_militarism_reformed: "개혁된 미국 군국주의"
 american_militarism_reformed_desc: "끊임없는 노력으로 우리는 모든 군대를 개혁하고 개선하고 그 필요를 돌보았습니다. 새로운 천년의 무대를 마련한 지금, 우리는 푸르게 빛나는 바다와 햇살 가득한 하늘을 내다보며 한 점 의심 없이 말할 수 있습니다. 이것이 팍스 아메리카나입니다."
 USA_idea_military_junta_cultural_programs: "문화 계획"
 USA_idea_military_junta_cultural_programs_desc: "인종을 중심으로 단결과 획일성을 장려함으로써, 우리는 단결한다는 것의 의미에 대한 새로운 선례를 세웁니다."
 USA_idea_fascist_extra_territorial_corps: "역외 군단"
 USA_idea_fascist_extra_territorial_corps_desc: "미국 국가의 예비 병력으로서, 우리의 새 영토에서 반국가 세력과 기타 반체제 인사를 철저히 단속할 수 있게 해 줍니다."
 USA_idea_fascist_hemispheric_garrison_command: "반구 주둔군 사령부"
 USA_idea_fascist_hemispheric_garrison_command_desc: "HGC는 서반구의 주둔과 치안 임무를 맡는 예비 지휘통제 병과입니다. 육군의 하위 병과로 간주되지만, 그 규모 때문에 공식적으로는 독립된 군종으로 인정받습니다."
 USA_idea_hemispheric_economic_program: "반구 경제 계획"
 USA_idea_hemispheric_economic_program_desc: "HEP는 서반구의 새로 얻은 국가들과의 기반시설 및 연결성 개발을 돕기 위해 설계된 반구 차원의 경제 상호 원조 계획입니다."
 USA_idea_public_unity_programs: "대중 단결 계획"
 USA_idea_public_unity_programs_desc: "대중의 협력을 이끌어 내고 새로운 신세계 정체성으로 가는 길을 열기 위해 설계된 상호 지원 및 단결 계획입니다."
 USA_idea_the_new_world_economic_exchange: "신세계 경제 교류"
 USA_idea_the_new_world_economic_exchange_desc: "NWEE는 개발 노력을 돕고 신세계인 정체성의 기반을 다지기 위해 설계된, 지속적이며 개선된 협력 계획입니다."
 USA_idea_monarchist_puppet_partner: "괴뢰국 파트너"
 USA_idea_monarchist_puppet_partner_desc: "우리는 미국의 조건에 동의했으므로 어느 정도의 자유가 주어졌습니다."
 USA_idea_red_junta_global_commissariat_corps: "세계 정치위원단"
 USA_idea_red_junta_global_commissariat_corps_desc: "동지들, 앞으로의 안정과 평화는 여러분의 손에 달려 있습니다. 이 사람들이 한때 누렸던 평화롭고 선한 삶을 지키고 보존해야 합니다. 그들에게 미래가 밝음을 보여 주고, 이 땅에 법과 질서를 되찾도록 도우십시오."
 USA_idea_trotskyist_permanent_revolution: "영구 혁명"
 USA_idea_trotskyist_permanent_revolution_desc: "우리 사회, 우리의 생활 방식, 우리의 영혼 자체의 적들이 사방에 있습니다. 동지들, 우리는 가족, 조국, 고향 등 우리가 소중히 여기는 것들을 지키기 위해 결집해 나서야 합니다. 혁명을 위하여!!!"
 USA_iranian_sanctions: "이란 제재"
 USA_iranian_sanctions_desc: "1979년 [PER.GetFlag] 이란 인질 위기로 카터 행정부는 [PER.GetFlag] 이란 정부의 행동을 처벌하기 위해 일련의 제재를 시행했습니다. 그 이후 역대 행정부는 [PER.GetFlag] 이란에 대한 [USA.GetFlag] 미국의 제재 수위에 대해 서로 다른 입장을 취해 왔습니다.\n\n제재 강도: [?USA_iran_sanction_level]/5"
 USA_increase_sanctions_on_iran: "이란 제재 강화"
 USA_increase_sanctions_on_iran_desc: "우리 행정부는 이란의 최근 행동을 처벌할 필요가 있다고 봅니다."
 USA_decrease_sanctions_on_iran: "이란 제재 완화"
 USA_decrease_sanctions_on_iran_desc: "이란 정부가 최근 처신을 잘하고 있으니, 당분간 제재를 완화해 줄 수도 있을 것입니다."
 USA_lift_sanctions_on_iran: "이란 제재 해제"
 USA_lift_sanctions_on_iran_desc: "제재는 이란 국민에게 해를 끼치는 도구일 뿐입니다. 게다가 우리에게는 이란에 대한 제재를 계속할 정치적 명분도 없습니다."
 USA_sanctioned_PER_recently: "최근 제재를 조정함"
 USA_crisis_event.8.t: "붕괴하고 싶습니까?"
 USA_crisis_event.8.d: "2067년 \\"강제\\" 붕괴 옵션은 2017년 12월, 목소리 큰 모든 이들이 \\"제2차 미국 남북전쟁\\"에 대한 공포를 조장하던 한창때 친구들과 함께 내놓은 반쯤 진지한 예측이었습니다. 그래서 저는 이렇게 말하는 반쯤 진지한 예측을 했습니다. \\"우리가 정말로 이야기해야 할 것이 아니라 싸워야 할 것처럼 느껴지는 모든 것을 두고 싸우는 자멸적 경향을 계속한다면, 향후 50년 안에 '연합된' 국가를 보지 못할 수도 있다고 진심으로 우려한다.\\" 지금까지 거의 아무도 플레이하지 않았기에 2067년 옵션은 원래 이스터 에그 예고편으로 추가되었으나, 이제 일반 플레이어층이 게임 속 연도에 가까워지고 있으므로 선택지가 되어야 합니다. 그러니 운명을 선택하십시오."
 USA_crisis_event.8.o1: "아직 우리의 때가 아니다"
 USA_crisis_event.8.o2: "다 불태워 버리고 새로 시작하자"
 USA_collapse_event.3000.t: "그다지 연합되지 않은 합중국?"
 USA_collapse_event.3000.d: "연방 정부가 대처하지 못한 현대 들어 최초의 전국 철도 파업이 벌어졌습니다. 미국 관리들은 6대 주요 철도 회사와 주요 노조 사이의 평화적 합의에 도달하기 위해 분주합니다. 공급 부족과 물가 상승이 이미 미국 경제의 거의 모든 면에 타격을 주기 시작한 가운데, 미국의 많은 이들은 상황이 정상으로 돌아오기를 바라고 있습니다."
 USA_collapse_event.3000.o1: "모두 진정합시다, 알겠죠? 제발"
 USA_collapse_event.3000.o2: "맙소사, 무슨 일이 벌어지고 있는 거지?"
 USA_collapse_event.3001.t: "추락하는 독수리"
 USA_collapse_event.3001.d: "충격적인 사태 전환으로, 정보는 부족하지만 미국에서 시민 질서가 붕괴한 것으로 보입니다. 장기화된 전국 철도 파업은 대규모 물가 상승과 공급 부족을 초래하여 전국에서 폭동을 일으켰습니다. 지방 정부 관리들은 치안을 확보하기 위해 경찰과 주방위군 요소를 조율하려 최선을 다했습니다. 그러나 인구가 더 많은 주들이 대응에 더 많은 자원을 요구하기 시작하면서, 점점 더 많은 긴급 대응 인력이 갈수록 커지는 혼란에 압도되었습니다. 거의 모든 국가가 본 중 가장 높은 곳에서 독수리가 추락하는 암울한 날입니다. 이 사태의 여파로 거대한 권력 공백이 생기면서 세계의 세력 균형은 영원히 바뀔 것입니다."
 USA_collapse_event.3001.o1: "맙소사, 우리가 어디서 잘못된 거지!"
 USA_collapse_event.3001.o2: "세상에.... 이제 어떻게 해야 하지?"
 USA_collapse_event.3001.o3: "젠장, 그래서 이제 어쩌지?"
 USA_foreign_event.13.o2: "지금은 아니다"
 USA_monarchist_event.1.t: "북방 연합"
 USA_monarchist_event.1.d: "캐나다에 경제와 내정에 있어 독립을 유지하는 조건으로 우리의 직접적인 보호를 제안할 것입니다. 단, 그 조건은 캐나다가 우리의 자치령이 되고 영국의 권위를 포기하는 대신 미국과 캐나다의 권위를 결합한 체제를 받아들이는 것입니다. 캐나다는 캐나다 왕국이 될 것입니다."
 USA_monarchist_event.1.o1: "받아들여야만 한다"
 USA_monarchist_event.2.t: "미국의 \\"요구\\""
 USA_monarchist_event.2.d: "미국이 흥미로운 제안을 해왔습니다. 우리가 그들의 종속국이 되어 독자적인 왕국이 될 수 있으며, 이는 영국 치하의 자치령이었을 때와 비슷한 처지가 될 것이라는 내용입니다. 핵심 논리는 우리가 사실상 독립국으로 남되, 순수한 캐나다의 이익보다는 서반구의 이익에 더 부합하는 방향으로 움직이게 된다는 것입니다."
 USA_monarchist_event.2.o1: "어차피 어느 정도는 이미 그렇게 하고 있다"
 USA_monarchist_event.2.o2: "한 번 겪었으면 족하다. 두 번은 없다"
 USA_monarchist_event.2000.t: "캐나다의 수락"
 USA_monarchist_event.2000.d: "우리가 좋은 성과를 거두었으며, 이에 캐나다인들은 반구 통합의 길에 동참하기로 결정했습니다."
 USA_monarchist_event.2000.o1: "신께서 신세계를 보호하시길!"
 USA_monarchist_event.20000.t: "왕국"
 USA_monarchist_event.20000.d: "국호 변경에 대한 승인이 떨어졌습니다."
 USA_monarchist_event.20000.o1: "신께서 캐나다를 축복하시길"
 USA_monarchist_event.2001.t: "캐나다의 거절"
 USA_monarchist_event.2001.d: "안타깝게도 우리는 진정한 의도를 그들에게 납득시킬 만큼 신속하지 못했습니다. 우리의 원칙을 고려하면 이번 사안은 강제로 밀어붙일 수 없습니다. 다른 방법을 찾아야 합니다."
 USA_monarchist_event.2001.o1: "하지만 우리는 형제인 줄 알았는데..."
 USA_monarchist_event.3.t: "남방 연합"
 USA_monarchist_event.3.d: "멕시코에 경제와 내정에 있어 독립을 유지하는 조건으로 우리의 직접적인 보호를 제안할 것입니다. 단, 그 조건은 멕시코가 우리의 자치령이 되는 것이며, 대신 국호를 멕시코 왕국으로 바꾸는 것이 허용될 것입니다."
 USA_monarchist_event.3.o1: "그들이 분별 있게 판단하길 바란다"
 USA_monarchist_event.4.t: "미국의 제안"
 USA_monarchist_event.4.d: "미국이 제안을 보내왔습니다. 그들의 사실상 독립적인 종속국이 되면 지방 병력과 협력하여 농촌 지역을 지원하고 안정시켜 줄 것이라고 합니다. 이에 따라 우리는 멕시코 왕국이라는 국호를 사용할 수 있게 되며, 세계 시장보다는 본토와 서반구에 더 집중할 수 있게 됩니다. 이로울 수도 있으나, 과연 이것이 우리가 진정 원하는 것일까요?"
 USA_monarchist_event.4.o1: "이제 국경 걱정은 하지 않아도 되겠군"
 USA_monarchist_event.4.o2: "그들은 이미 우리에게 충분한 골칫거리를 안겨줬다. 절대 안 된다."
 USA_monarchist_event.4000.t: "멕시코의 수락"
 USA_monarchist_event.4000.d: "또 한 번의 협상이 성공적으로 마무리되었으며, 이제 이 위대한 민족 연합을 시작하기 위한 병참 작업에 착수할 것입니다."
 USA_monarchist_event.4000.o1: "뭉치면 선다"
 USA_monarchist_event.40000.t: "왕국"
 USA_monarchist_event.40000.d: "승인이 떨어졌으며, 이제 우리는 옛 영광으로 돌아가 반구를 통합하는 새로운 길을 열 것입니다."
 USA_monarchist_event.40000.o1: "신께서 신세계를 축복하시길!"
 USA_monarchist_event.4001.t: "멕시코의 거절"
 USA_monarchist_event.4001.d: "협상이 지체되다가 결렬되었습니다. 가까운 장래에 의미 있는 성과를 내려면 상황에 다시 접근해야 합니다."
 USA_monarchist_event.4001.o1: "어디서 잘못된 것일까?"
 USA_monarchist_event.5.t: "연방 협정"
 USA_monarchist_event.5.d: "쿠바라는 섬나라의 운명을 바꾸고자 합니다. 쿠바에 보호를 제공하는 동시에, 카리브 지역을 \\"서인도 연방 공국\\", 줄여서 서인도 공국으로 통합하는 것을 허용할 수 있습니다. 우리의 역사는 한마디로 길고 흥미로웠으나, 그들을 도울 수 있는 일이 있다고 생각합니다."
 USA_monarchist_event.5.o1: "과거는 과거일 뿐, 이제 미래를 만들자"
 USA_monarchist_event.6.t: "미국의 거래"
 USA_monarchist_event.6.d: "미국이 거래를 제안해 왔습니다. 그들의 종속국이 되는 대신 자치도는 거의 비슷하게 유지되지만, 무역은 세계 각국보다는 서반구 국가들에 이익이 되는 방향으로 이루어질 것입니다. 덤으로 미국은 우리가 카리브 지역을 통합하는 것을 허용하겠다고 합니다."
 USA_monarchist_event.6.o1: "우리 힘으로는 이보다 나은 조건을 얻을 수 없다"
 USA_monarchist_event.6.o2: "그들은 전에도 우리를 망쳐 놓았다. 절대 안 된다!"
 USA_monarchist_event.6000.t: "쿠바의 수락"
 USA_monarchist_event.6000.d: "반구 통합을 향한 또 한 걸음입니다."
 USA_monarchist_event.6000.o1: "신께서 신세계를 축복하시길!"
 USA_monarchist_event.60000.t: "연방"
 USA_monarchist_event.60000.d: "국호에 대한 승인이 떨어졌으며, 서반구의 형제자매들과 함께 새로운 통합된 미래를 만들어 나가면서 우리의 이름도 곧 알려질 것입니다."
 USA_monarchist_event.60000.o1: "신께서 인디 공국 연방을 축복하시길!"
 USA_monarchist_event.6001.t: "쿠바의 거절"
 USA_monarchist_event.6001.d: "무엇이 잘못되었는지 알아내야 합니다. 물론 역사적 적대감이 더 나쁜 일들을 불러온 적도 있으므로 그 점부터 살펴보아야 합니다."
 USA_monarchist_event.6001.o1: "처음부터 다시 시작이다"
 USA_monarchist_event.7.t: "중앙아메리카의 제안"
 USA_monarchist_event.7.d: "파나마를 중심으로 하여 새로운 국가 연합을 만들고, 한때 존재했던 옛 중앙아메리카의 정치체를 부활시키고자 합니다. 쉽지 않겠지만, 파나마가 앞장서도록 하고 사회기반시설과 연성 개발 사업을 지원한다면 반구 통합의 또 다른 한 조각을 맞출 수 있을 것입니다."
 USA_monarchist_event.7.o1: "희망찬 내일을 위하여"
 USA_monarchist_event.8.t: "미국의 제안"
 USA_monarchist_event.8.d: "그들의 종속국이 되는 대가로 가까운 장래에 중앙아메리카 국가들을 통합하는 것이 보장됩니다. 덤으로 미국은 우리가 다른 선택지보다 서반구를 돕는 데 더 집중하는 한, 개발 문제를 돕고 새로운 연합을 유지하는 데에도 기꺼이 협조할 것입니다."
 USA_monarchist_event.8.o1: "나쁘지 않다. 받아들이겠다"
 USA_monarchist_event.8.o2: "우리는 방해받지 않는 운하를 누리고 있다. 사양하겠다"
 USA_monarchist_event.8000.t: "파나마의 수락"
 USA_monarchist_event.8000.d: "통합을 향한 또 한 걸음입니다. 이제 파나마가 중앙아메리카 지역을 통합할 수 있도록 준비를 시작할 수 있습니다."
 USA_monarchist_event.8000.o1: "신께서 신세계를 축복하시길!"
 USA_monarchist_event.80000.t: "연합 공국"
 USA_monarchist_event.80000.d: "승인이 떨어졌고 필요한 배경 절차도 공식화했습니다. 이제 국호를 바꾸고 본격적인 작업을 시작할 수 있습니다."
 USA_monarchist_event.80000.o1: "하나 된 중앙아메리카를 위하여!"
 USA_monarchist_event.8001.t: "파나마의 거절"
 USA_monarchist_event.8001.d: "다소 쓰라리지만 지금으로서는 달리 할 수 있는 일이 없습니다. 다른 방법으로 다시 접근하여 재시도해야 합니다."
 USA_monarchist_event.8001.o1: "언젠가는 그들을 설득할 것이다."
 USA_monarchist_event.9.t: "하나 된 남방 대륙"
 USA_monarchist_event.9.d: "콜롬비아와 협상을 시작하여 옛 그란 콜롬비아 왕국을 부활시킬 것입니다. 이 옛 정치체의 부활은 남아메리카 대륙의 북쪽 절반 가량을 포괄할 것이며, 우리와 협력을 시작하기에 충분히 매력적인 조건이 되기를 바랍니다."
 USA_monarchist_event.9.o1: "밑져야 본전이다"
 USA_monarchist_event.10.t: "미국의 제안"
 USA_monarchist_event.10.d: "미국의 종속국이 되는 대가로 대륙 북부를 통합하는 것을 허용받게 됩니다. 또한 그란 콜롬비아 왕국을 공고히 하는 데에도 도움을 주겠다고 하니 이 역시 좋은 보탬이 될 것입니다. 문제는 미국을 과연 믿을 수 있느냐는 것입니다."
 USA_monarchist_event.10.o1: "옛 영광을 위하여"
 USA_monarchist_event.10.o2: "그럴 것 같지 않다"
 USA_monarchist_event.10000.t: "콜롬비아의 수락"
 USA_monarchist_event.10000.d: "협상이 성공을 거두었으며, 이제 반구 통합을 향한 또 한 걸음을 내딛기 시작합니다."
 USA_monarchist_event.10000.o1: "신께서 신세계를 축복하시길"
 USA_monarchist_event.100000.t: "왕국"
 USA_monarchist_event.100000.d: "국호를 바꾸는 것이 승인되었으므로, 이제 서반구가 곧 하나로 통합될 미래를 위해 한 걸음씩 준비해 나갈 것입니다."
 USA_monarchist_event.100000.o1: "승리를 향해 전진"
 USA_monarchist_event.10001.t: "콜롬비아의 거절"
 USA_monarchist_event.10001.d: "이는 진정으로 더 나은 미래로 가는 길을 가로막는 또 하나의 장애물입니다. 상황을 파악하여 앞으로 다른 방식을 시도해야 합니다."
 USA_monarchist_event.10001.o1: "왜 이해하지 못하는가"
 USA_monarchist_event.11.t: "아마존 거래"
 USA_monarchist_event.11.d: "반구 통합 구상을 더욱 진전시키고 마무리하기 위해 브라질을 초청할 것이며, 그 대가로 브라질은 대륙 남부 전체에 걸쳐 자국의 입지를 공고히 할 수 있습니다."
 USA_monarchist_event.11.o1: "덩치는 커지겠지만 적어도 그곳엔 아무것도 없다"
 USA_monarchist_event.12.t: "미국의 거래"
 USA_monarchist_event.12.d: "미국의 종속국이 되고 무역 정책을 서반구 국가들에 더 이로운 방향으로 조정하는 대가로, 대륙 남부 절반을 확보하여 국가를 통합하고 성장시킬 수 있습니다. 나쁘지 않은 거래이지만 미국의 손아귀에 들어가게 됩니다."
 USA_monarchist_event.12.o1: "지금 얻는 것이 훗날 도움이 될 것이다"
 USA_monarchist_event.12.o2: "감수할 만한 위험이 아니다"
 USA_monarchist_event.12000.t: "브라질의 수락"
 USA_monarchist_event.12000.d: "위대한 남방 왕국이 수락함으로써 공동의 미래를 향한 가장 큰 걸음 중 하나가 완료되었습니다. 앞으로 나아가 새로운 미래, 더 나은 미래, 통합된 미래를 만들어 갑시다."
 USA_monarchist_event.12000.o1: "신세계에 영광을!"
 USA_monarchist_event.120000.t: "새로운 왕국"
 USA_monarchist_event.120000.d: "모든 배경 절차를 마쳤으며, 이제 우리는 다시 한 번 위대한 왕국이 되었습니다. 새로운 동맹국들과 협력하여 새롭고 통합된 반구를 공고히 만들어 갑시다. 통합의 시대가 시작됩니다."
 USA_monarchist_event.120000.o1: "승리를 위해 함께, 우리는 행진한다!"
 USA_monarchist_event.12001.t: "브라질의 거절"
 USA_monarchist_event.12001.d: "이는 중대한 차질입니다. 브라질을 우리 편으로 끌어들이기 위해 다시 접근하려면 상당한 시간이 걸릴 것입니다."
 USA_monarchist_event.12001.o1: "맹세컨대 아무도 듣지 않는다"
 USA_monarchist_event.13.t: "초기 성과 작전"
 USA_monarchist_event.13.d: "미래는 지금입니다. 통합 작업을 시작해도 좋다는 승인이 떨어졌습니다. 초기 성과는 바하마와 자메이카라는 인접 섬나라를 중심으로 이루어질 것입니다."
 USA_monarchist_event.13.o1: "우리는 행진한다!"
 USA_monarchist_event.14.t: "초기 성과 작전"
 USA_monarchist_event.14.d: "미래는 지금입니다. 통합 작업을 시작해도 좋다는 승인이 떨어졌습니다. 초기 성과는 코스타리카와 니카라과라는 인접 국가를 중심으로 이루어질 것입니다."
 USA_monarchist_event.14.o1: "우리는 행진한다!"
 USA_monarchist_event.15.t: "초기 성과 작전"
 USA_monarchist_event.15.d: "미래는 지금입니다. 통합 작업을 시작해도 좋다는 승인이 떨어졌습니다. 초기 성과는 동부의 베네수엘라, 가이아나, 수리남을 중심으로 이루어질 것입니다."
 USA_monarchist_event.15.o1: "우리는 행진한다!"
 USA_monarchist_event.16.t: "초기 성과 작전"
 USA_monarchist_event.16.d: "미래는 지금입니다. 통합 작업을 시작해도 좋다는 승인이 떨어졌습니다. 초기 성과는 남부의 우루과이, 파라과이, 볼리비아를 중심으로 이루어질 것입니다."
 USA_monarchist_event.16.o1: "우리는 행진한다!"
 USA_monarchist_event.17.t: "상호 경제 계획"
 USA_monarchist_event.17.d: "오늘부터 새로운 길이 시작됩니다. 우리 스스로와 서로를 발전시켜 나가면서 함께 더 밝고 더 나은 미래를 건설할 것입니다."
 USA_monarchist_event.17.o1: "진보를 위하여!"
 USA_monarchist_event.18.t: "상호 경제 계획"
 USA_monarchist_event.18.d: "오늘부터 새로운 길이 시작됩니다. 우리 스스로와 서로를 발전시켜 나가면서 함께 더 밝고 더 나은 미래를 건설할 것입니다."
 USA_monarchist_event.18.o1: "진보를 위하여!"
 USA_monarchist_event.19.t: "상호 경제 계획"
 USA_monarchist_event.19.d: "오늘부터 새로운 길이 시작됩니다. 우리 스스로와 서로를 발전시켜 나가면서 함께 더 밝고 더 나은 미래를 건설할 것입니다."
 USA_monarchist_event.19.o1: "진보를 위하여!"
 USA_monarchist_event.20.t: "상호 경제 계획"
 USA_monarchist_event.20.d: "오늘부터 새로운 길이 시작됩니다. 우리 스스로와 서로를 발전시켜 나가면서 함께 더 밝고 더 나은 미래를 건설할 것입니다."
 USA_monarchist_event.20.o1: "진보를 위하여!"
 USA_monarchist_event.21.t: "공공 통합 계획"
 USA_monarchist_event.21.d: "오늘부터 새로운 공공 통합 계획을 시행합니다. 이 계획은 새로운 신세계 정체성을 길러내기 위해 고안되었습니다. 우리는 통합된 노력으로 별을 향해 나아갈 것입니다. 뭉치면 서고, 흩어졌다면 쓰러졌을 것입니다."
 USA_monarchist_event.21.o1: "우리는 신세계인이다!"
 USA_monarchist_event.22.t: "공공 통합 계획"
 USA_monarchist_event.22.d: "오늘부터 새로운 공공 통합 계획을 시행합니다. 이 계획은 새로운 신세계 정체성을 길러내기 위해 고안되었습니다. 우리는 통합된 노력으로 별을 향해 나아갈 것입니다. 뭉치면 서고, 흩어졌다면 쓰러졌을 것입니다."
 USA_monarchist_event.22.o1: "우리는 신세계인이다!"
 USA_monarchist_event.23.t: "공공 통합 계획"
 USA_monarchist_event.23.d: "오늘부터 새로운 공공 통합 계획을 시행합니다. 이 계획은 새로운 신세계 정체성을 길러내기 위해 고안되었습니다. 우리는 통합된 노력으로 별을 향해 나아갈 것입니다. 뭉치면 서고, 흩어졌다면 쓰러졌을 것입니다."
 USA_monarchist_event.23.o1: "우리는 신세계인이다!"
 USA_monarchist_event.24.t: "공공 통합 계획"
 USA_monarchist_event.24.d: "오늘부터 새로운 공공 통합 계획을 시행합니다. 이 계획은 새로운 신세계 정체성을 길러내기 위해 고안되었습니다. 우리는 통합된 노력으로 별을 향해 나아갈 것입니다. 뭉치면 서고, 흩어졌다면 쓰러졌을 것입니다."
 USA_monarchist_event.24.o1: "우리는 신세계인이다!"
 USA_monarchist_event.25.t: "미드타운 광란 작전"
 USA_monarchist_event.25.d: "초기 성과를 재정비한 지금, 이스파니올라섬을 침공하고 트리니다드 토바고를 침공하여 소규모 섬나라들의 측면을 압박해도 좋다는 승인이 떨어졌습니다."
 USA_monarchist_event.25.o1: "계속 행진한다"
 USA_monarchist_event.26.t: "미드타운 광란 작전"
 USA_monarchist_event.26.d: "초기 성과를 재정비한 지금, 다음 인접국인 온두라스와 엘살바도르를 침공해도 좋다는 승인이 떨어졌습니다."
 USA_monarchist_event.26.o1: "계속 행진한다"
 USA_monarchist_event.27.t: "미드타운 광란 작전"
 USA_monarchist_event.27.d: "초기 성과를 재정비한 지금, 다음 인접국인 에콰도르를 침공해도 좋다는 승인이 떨어졌습니다. 상대하는 나라는 하나뿐이지만 지형이 점점 험해지고 있으므로, 우리의 침공 계획은 브라질의 침공과도 보조를 맞추고 있습니다."
 USA_monarchist_event.27.o1: "계속 행진한다"
 USA_monarchist_event.28.t: "미드타운 광란 작전"
 USA_monarchist_event.28.d: "초기 성과를 재정비한 지금, 다음 인접국인 아르헨티나를 침공해도 좋다는 승인이 떨어졌습니다. 상대하는 나라는 하나뿐이지만 지형이 점점 험해지고 있으므로, 우리의 침공 계획은 콜롬비아의 침공과도 보조를 맞추고 있습니다."
 USA_monarchist_event.28.o1: "계속 행진한다"
 USA_monarchist_event.29.t: "신세계 작전"
 USA_monarchist_event.29.d: "새로운 통합된 미래를 만들어 가는 동안 마지막 퍼즐 조각들이 이제 제자리를 찾아가기 시작할 것입니다. 남은 장애물은 섬나라들뿐입니다."
 USA_monarchist_event.29.o1: "승리를 향해 전진"
 USA_monarchist_event.30.t: "신세계 작전"
 USA_monarchist_event.30.d: "새로운 통합된 미래를 만들어 가는 동안 마지막 퍼즐 조각들이 이제 제자리를 찾아가기 시작할 것입니다. 벨리즈와 과테말라만이 앞을 가로막고 있습니다."
 USA_monarchist_event.30.o1: "승리를 향해 전진"
 USA_monarchist_event.31.t: "신세계 작전"
 USA_monarchist_event.31.d: "새로운 통합된 미래를 만들어 가는 동안 마지막 퍼즐 조각들이 이제 제자리를 찾아가기 시작할 것입니다. 페루는 우리와 동맹국들에 맞서는 마지막 저항국입니다."
