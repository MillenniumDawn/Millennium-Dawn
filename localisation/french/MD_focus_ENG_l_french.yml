 ENG_john_reith_hc_trait: "Commandant aéroporté de l'OTAN"
 ENG_royal_armed_forces_review: "Une revue des forces royales"
 ENG_royal_armed_forces_review_desc: "Les forces armées de la Couronne méritent plus que le prestige cérémoniel. Une revue systématique de la doctrine, des normes d'entraînement et de la préparation des trois armes reconstruira les Forces armées royales en une force de combat crédible, digne de la monarchie."
 ENG_household_division_revival: "Renaissance de la Household Division"
 ENG_household_division_revival_desc: "La Household Division a longtemps été le fer de lance de l'armée britannique. Revivre ses traditions et élargir son rôle restaure un noyau d'élite dont la qualité, la discipline et l'esprit de corps les distinguent de la force générale."
 ENG_jewel_of_the_admiralty: "Joyau de l'Amirauté"
 ENG_jewel_of_the_admiralty_desc: "La Royal Navy est le plus ancien symbole de la projection de puissance britannique. Réinvestir dans ses navires de ligne, étendre leur rayon d'action et reconstruire sa culture institutionnelle signale au monde que Britannia règne encore sur les flots."
 ENG_wings_of_the_crown: "Ailes de la Couronne"
 ENG_wings_of_the_crown_desc: "La Royal Air Force naquit du creuset de la Première Guerre mondiale et fut décisive dans la Seconde. Un nouvel investissement dans la formation des pilotes, la doctrine de combat aérien et le développement d'as assure que la supériorité aérienne reste une pierre angulaire de la défense britannique."
 ENG_imperial_general_staff_restored: "L'état-major impérial restauré"
 ENG_imperial_general_staff_restored_desc: "L'état-major impérial coordonnait autrefois terre, mer et air à l'échelle d'un empire mondial. Restaurer un commandement interarmées unifié place les forces armées sous une vision stratégique unique, maximisant leur efficacité combinée."
 ENG_reservist_corps_act: "Loi sur le corps des réservistes"
 ENG_reservist_corps_act_desc: "Les réserves britanniques ont longtemps été un atout sous-exploité. Une nouvelle loi sur le Corps des réservistes formalise les objectifs de conscription, accélère les procédures de mobilisation et relie plus étroitement les unités de réserve à leurs homologues de l'armée d'active."
 ENG_global_anglosphere_initiative: "L'initiative mondiale de l'Anglosphère"
 ENG_global_anglosphere_initiative_desc: "Les nations anglophones partagent plus qu'une langue : des traditions juridiques, des institutions démocratiques et des liens historiques forgés sur des siècles. Une initiative coordonnée de l'Anglosphère offre à la Couronne une tribune diplomatique pour approfondir ces liens et renforcer l'influence britannique d'Ottawa à Canberra."
 ENG_crown_realm_status: "Royaume de la Couronne"
 ENG_crown_realm_status_desc: "Cette nation reconnaît le monarque britannique comme chef d'État. L'arrangement constitutionnel apporte stabilité politique et liens étroits avec le Commonwealth."
 ENG_crown_realm_monthly_influence_tt: "Influence britannique mensuelle : §R+4%§!"
 ENG_crown_diplomatic_corps: "Corps diplomatique de la Couronne"
 ENG_crown_diplomatic_corps_desc: "Un corps dédié d'envoyés royaux, tiré du plus fin talent diplomatique que la Grande-Bretagne puisse offrir, représentera directement les intérêts de la Couronne auprès des cours et capitales étrangères. Leur mandat est d'améliorer les relations, d'assouplir les négociations et de faire porter la voix de la Couronne dans tous les recoins du monde."
 ENG_royal_visits_abroad: "Visites royales à l'étranger"
 ENG_royal_visits_abroad_desc: "Une tournée royale bien calée peut accomplir ce que des mois de diplomatie discrète ne peuvent. La présence personnelle du monarque à l'étranger signale l'engagement, génère la bienveillance et laisse une impression durable sur gouvernements et populations."
 ENG_pax_britannica_reborn: "La Pax Britannica renaît"
 ENG_pax_britannica_reborn_desc: "La Pax Britannica du XIXe siècle s'appuyait sur la suprématie navale, le prestige culturel et une portée diplomatique sans égale. Par le renouveau de la monarchie, la réorientation de l'Anglosphère et un engagement mondial renouvelé, la Grande-Bretagne peut restaurer un équivalent moderne : une ère de stabilité garantie par la puissance et le dessein britanniques."
 ENG_royal_visits.1.t: "Une tournée royale"
 ENG_royal_visits.1.d: "Les conseillers du monarque présentent une liste courte de régions où une tournée royale rapporterait le plus diplomatiquement. Le choix déterminera où se concentre le soft power britannique et quels gouvernements bénéficient de l'attention personnelle de la Couronne."
 ENG_royal_visits.1.a: "Tournée Afrique"
 ENG_royal_visits.1.b: "Tournée en Asie du Sud et du Sud-Est"
 ENG_royal_visits.1.c: "Tournée au Moyen-Orient"
 ENG_royal_visits.1.e: "Tournée en Amérique Latine"
 ENG_crown_diplomatic_corps_idea: "Corps diplomatique de la Couronne"
 ENG_crown_diplomatic_corps_idea_desc: "Un corps actif d'envoyés royaux opère à l'étranger, entretenant des contacts personnels avec les gouvernements étrangers et facilitant l'agenda diplomatique de la Couronne. Leur présence réduit le coût du maintien des relations et génère un flux régulier de capital politique."
 ENG_army_field_exercise: "Exercice annuel sur le terrain"
 ENG_army_field_exercise_desc: "Les brigades de l'armée britannique mènent de grands exercices de campagne pour aiguiser le combat interarmes et bâtir la préparation."
 ENG_army_engineering_corps: "Programme du génie de combat"
 ENG_army_engineering_corps_desc: "L'investissement dans l'entraînement et l'équipement du génie de combat améliore la capacité de l'armée à opérer en terrain complexe."
 ENG_armoured_tactics_programme: "Programme de tactique blindée"
 ENG_armoured_tactics_programme_desc: "Des exercices intégrant les nouveaux véhicules blindés à l'infanterie et à l'artillerie aiguisent la doctrine de la guerre blindée moderne."
 ENG_energy_transition_programme: "Programme de transition énergétique"
 ENG_energy_transition_programme_desc: "Une stratégie interministérielle pour accélérer le passage à l'énergie bas carbone renforce la confiance publique et l'investissement industriel."
 ENG_critical_materials_reserve: "Réserve de matières critiques"
 ENG_critical_materials_reserve_desc: "Un stock stratégique d'État de matériaux industriels critiques isole l'industrie britannique des ruptures d'approvisionnement."
 ENG_research_excellence_awards: "Prix d'excellence de la recherche"
 ENG_research_excellence_awards_desc: "Des distinctions concurrentielles pour universités et instituts de recherche stimulent les avancées en électronique et technologies numériques."
 ENG_case_by_case_intervention_desc: "Nous ne pouvons simplement renoncer à notre capacité de peser sur les affaires d'intérêt public simplement parce que nous dédaignons un plus grand gouvernement. Nous devons plutôt examiner chaque cas individuellement et travailler à une meilleure solution."
 ENG_the_wonga_coup: "La liste Wonga"
 ENG_the_wonga_coup_desc: "La Guinée équatoriale est assise sur de vastes réserves pétrolières auxquelles des financiers britanniques, y compris des figures de haut profil comme Mark Thatcher, fils de l'ancienne Première ministre Margaret Thatcher, souhaitent obtenir des droits pétroliers préférentiels sur $STATE_319$. Teodoro Obiang Nguema Mbasogo est dans une position isolée, et le chef de l'opposition Severo Moto Nsá apparaît comme une alternative préférable. Pour y parvenir, les conjurés entendent user de mercenaires pour renverser Obiang et installer Moto comme président."
 britain_md.40.t: "Mercenaires retenus à l'aéroport de Harare"
 britain_md.40.d: "Les autorités ont détenu un groupe d'hommes lourdement armés à l'aéroport international de Harare. Officiellement, ils se disent prestataires de sécurité achetant du matériel pour des opérations minières en République démocratique du Congo, mais des rapports de renseignement suggèrent qu'ils préparent une opération contre le gouvernement de Guinée équatoriale."
 britain_md.40.a: "Ils resteront en détention."
 britain_md.40.b: "Libérez-les tranquillement"
 britain_md.41.t: "L'échec du coup de Wonga"
 britain_md.41.d: "Les autorités zimbabwéennes ont arrêté plus de soixante mercenaires présumés, menés par Simon Mann, après l'atterrissage de leur avion à l'aéroport international de Harare. Les responsables affirment que le groupe tentait d'acheter du matériel militaire avant de poursuivre vers la Guinée équatoriale. Les allégations liant des financiers britanniques au complot se sont soldées par un embarras pour nous."
 britain_md.41.a: "Une issue malheureuse."
 britain_md.42.t: "Succès du coup de Wonga"
 britain_md.42.d: "L'opération a réussi. Le président Teodoro Obiang Nguema Mbasogo a été renversé et le chef de l'opposition Severo Moto Nsá s'est déclaré à la tête d'un nouveau gouvernement. Si nous subissons une condamnation internationale, les intérêts commerciaux britanniques jouissent désormais d'une influence sans précédent dans l'une des nations les plus riches en pétrole d'Afrique."
 britain_md.42.a: "Un investissement rentable"
 britain_md.43.t: "Complot étranger déjoué"
 britain_md.43.d: "Les autorités ont confirmé que des mercenaires étrangers entendaient renverser le gouvernement et installer le figure d'opposition Severo Moto Nsá comme président. Grâce aux arrestations au Zimbabwe, le complot a été démantelé avant d'atteindre nos côtes."
 britain_md.43.a: "La République tient"
 britain_md.44.t: "La chute d'Obiang"
 britain_md.44.d: "Le président Teodoro Obiang Nguema Mbasogo a été écarté du pouvoir après que des forces mercenaires et des partisans de l'opposition se sont emparés de Malabo et d'autres positions gouvernementales clés. Severo Moto Nsá a pris la tête d'un nouveau gouvernement de transition."
 britain_md.44.a: "Oh my"
 britain_md.45.t: "Des mercenaires financés par la Grande-Bretagne renversent le gouvernement en Guinée équatoriale"
 britain_md.45.d: "Le président Teodoro Obiang Nguema Mbasogo a été écarté du pouvoir après que des forces mercenaires et des partisans de l'opposition se sont emparés de Malabo et d'autres positions gouvernementales clés. Severo Moto Nsá a pris la tête d'un nouveau gouvernement de transition."
 britain_md.45.a: "Une destination de vacances insolite."
 britain_md.46.t: "Mercenaires arrêtés au Zimbabwe"
 britain_md.46.d: "Les autorités zimbabwéennes ont arrêté plus de soixante mercenaires présumés après l'atterrissage de leur avion à l'aéroport international de Harare. Les responsables affirment que le groupe tentait d'acheter du matériel militaire avant de poursuivre vers la Guinée équatoriale. Les hommes, soi-disant menés par l'ancien officier de l'armée britannique Simon Mann, insistent sur le fait qu'ils fournissaient des services de sécurité pour des opérations minières en Afrique centrale. Les enquêteurs allèguent toutefois qu'ils faisaient partie d'un complot plus large pour renverser le président Teodoro Obiang Nguema Mbasogo de Guinée équatoriale."
 britain_md.46.a: "Une destination de vacances insolite."
 ENG_british_attempted_coup_on_us: "Le coup Wonga"
 ENG_british_loyalist: "L'administration Moto"
 ENG_british_loyalist_trade: "Concessions pétrolières britanniques (commerce)"
 raid_type_ENG_Wonga_Coup: "Opération Epic Fuck-Up"
 raid_type_ENG_Wonga_Coup_desc: "L'opération Échec cuisant monumental se veut tout sauf cela. Une petite force de mercenaires, de financiers et d'alliés locaux tentera de retirer le gouvernement de Guinée équatoriale et d'installer une administration plus favorable."
 ENG_seize_oil_wonga_coup_TT: "§HUnlocks New Raid§!: Operation Epic Fuck-Up\n - [ENG.GetFlag] British special forces units will be able to move in and oust [EGU.GetLeader] from [EGU.GetFlag] Equatorial Guinea, replacing him with a [ENG.GetFlag] British-backed strongman Severo Moto Nsá.\n\nIf Operation Epic Fuck-Up is successful\n - We will seize their resources in §H$STATE_319$§!"
 ENG_defence_industry_modifier: "Industrie de défense britannique"
 ENG_good_friday_agreement: "Accord du Vendredi saint"
 ENG_good_friday_agreement_desc: "Signed on April 10th, 1998, the Good Friday Agreement is a series of smaller agreements that brought an end to most violence associated with the conflict over the status of Northern Ireland. Unionists, also known as loyalists, who are mostly Ulster Protestants want to remain within the United Kingdom. On the contrary, Irish republicans and nationalists who are mostly Irish Catholics, sought for Northern Ireland to leave the United Kingdom and join a united Ireland. While it may seem implied the conflict was theological in nature but it was rather a political and national one, with religion largely serving the role of identity. Under the Multi-Party Agreement, self-government was restored to Northern Ireland in the form of a power-sharing agreement between Irish nationalists and unionist cliques respectivly. The reforms enacted under the agreement ranged from police restructuring to the disarmament of paramilitary organisations. These measures hope to lay the bedrock for a more stable and peaceful Ireland."
 ENG_State_17_Paramilitary_Activity: "Activité paramilitaire :"
 ENG_State_17_Paramilitary_Activity_desc: "Malgré les progrès de l'accord du Vendredi saint, de nombreuses organisations paramilitaires républicaines et loyalistes restent actives en Irlande du Nord. Si beaucoup ont formellement déclaré des cessez-le-feu, ces groupes conservent des structures, des stocks d'armes et une influence dans les communautés locales. Beaucoup sont impliqués dans le crime organisé : contrebande, stupéfiants, extorsion et attaques punitives. \n\n§YSera retiré si nous ne contrôlons plus $STATE_17$.§!"
 ENG_additional_expenditure_goodfriday_TT: "Additional Expenditure: §R+0.2%§! of GDP\nExpected Police Spending: §R+0.15%§!\nStability: §G+10.00%§!\n\nReduces all penalties from §YSectarian Tensions§! by §G0.2%§! per level.\n\nFrom Sectarian Tensions level:\n$ENG_additional_expenditure_goodfriday_info_TT$\n--------------\n§gThis National Spirit will be removed if we no longer Control $STATE_17$.§!"
 ENG_additional_expenditure_goodfriday_state_TT: "Selon le niveau de tensions communautaires : (§Y[?ENG_north_irish_agitation]§!/§R100§!)\n- Garnisons requises : §R+[?ENG_Paramilitary_required_garrison]%§!\n- Facteur de croissance de productivité d'État : §R[?ENG_Paramilitary_state_productivity_growth]%§!\n- Chance de sabotage d'usines locales : §R[?ENG_Paramilitary_local_factory_sabotage]%§!"
 ENG_the_macabre_alliance: "L'alliance macabre"
 ENG_the_macabre_alliance_desc: "Depuis la fin des années 1980, BP a lancé une stratégie de frontière, une exploration à haut risque et haut rendement destinée à inverser le déclin constant de ses réserves. En 1991, BP a frappé le jackpot lorsque Casanare a livré la plus grande découverte de pétrole de la compagnie depuis plus de vingt ans. Mais au prix d'un risque élevé d'attaques de guérilla. Rien que ces dernières années, l'Armée de libération nationale (ELN), l'une des organisations de guérilla colombiennes, a fait sauter plus de 460 fois l'oléoduc d'Occidental Petroleum, saignant l'entreprise américaine à blanc. La seizième brigade, unité de l'armée tristement célèbre pour ses opérations peu éthiques, a été créée expressément pour protéger les intérêts pétroliers et est devenue l'escadron de la mort personnel de BP à Casanare. La seizième brigade était financée et collaborait avec Defence Systems Limited, un prestataire de sécurité privé britannique fondé par d'anciens membres du SAS aux liens étroits avec le gouvernement britannique. Le Foreign Office a été clair : BP doit opérer sans accroc, quel qu'en soit le prix. Le général Álvaro Velandia Hurtado parle de « résolution des conflits ». Les familles des morts y voient tout autre chose."
 ENG_additional_expenditure_Colombia_TT: "£corruption_cost_factor_texticon Coût en pouvoir politique pour changer la corruption : §R+15 %§!\n--------------\n§YAide militaire§! visant [COL.GetFlag] §Yla Colombie§! :\n- Plus susceptible d'être acceptée.\n- N'exige pas qu'ils soient menacés.\n\n§YManipuler la politique§! visant [COL.GetFlag] §Yla Colombie§! :\n- Exigence d'influence : §G20 %§! (30 % de base)\n- Coût en pouvoir politique : §G-25 %§!\n\nRecevoir §G20 %§! des recettes d'exportation pétrolière de [COL.GetFlag] §Yla Colombie§!\n- Revenu supplémentaire : £income_texticon $$[?additional_income_ENG_columbia_oil|+3]\n--------------\n§gCet esprit national sera retiré si la Colombie élimine les cartels ou si la corruption dépasse Corruption légère (niveau 2).§!"
 ENG_the_dissident_campaign: "Campagne des dissidents de l'IRA"
 ENG_the_dissident_campaign_desc: "Rejecting the Good Friday Agreement, dissident republican groups, such as the Real IRA and Continuity IRA, refuse to acknowledge British authority in Northern Ireland as legitimate. The Real IRA split from the Provisional IRA in 1997, claiming to be the true republicans and denouncing the peace process as a sell-out, viewing the Provos as collaborators who traded the republic for British authority. The Continuity IRA emerged earlier, in 1986, following a split over Sinn Féin's decision to end abstentionism from Dáil Éireann, rejecting the leadership's direction and maintaining that the existing republican movement had abandoned the true constitutional claim to Irish sovereignty. Both factions reject the legitimacy of the peace process. These groups sustain a low-level insurgency against the British government via bombings, shootings, and targeted attacks, while also acting as de facto law enforcement in republican strongholds where the Royal Ulster Constabulary has limited control."
 ENG_additional_expenditure_goodfriday_info_TT: "§H$STATE_17$§! - Activité paramilitaire :\n$ENG_additional_expenditure_goodfriday_state_TT$"
