 super_heavy_tank_chassis_3_desc: "중형 워커 차체는 일반적인 무한궤도나 바퀴식 주행 장치 대신 2족 또는 다족 이동 체계를 통합한 장갑 전투 차량의 차체를 말합니다. 일반적으로 강화된 장갑 캡슐, 출력 밀도가 높은 엔진 또는 발전기 장치, 관절형 구동 장치를 결합하여 잔해, 급경사, 연약 지반 등 기존 기갑 전력의 움직임을 제약하는 지형에서도 이동할 수 있게 합니다."
 super_heavy_tank_chassis_4: "5세대 중형 워커 차체"
 super_heavy_tank_chassis_4_desc: "중형 워커 차체는 일반적인 무한궤도나 바퀴식 주행 장치 대신 2족 또는 다족 이동 체계를 통합한 장갑 전투 차량의 차체를 말합니다. 일반적으로 강화된 장갑 캡슐, 출력 밀도가 높은 엔진 또는 발전기 장치, 관절형 구동 장치를 결합하여 잔해, 급경사, 연약 지반 등 기존 기갑 전력의 움직임을 제약하는 지형에서도 이동할 수 있게 합니다."
 super_heavy_tank_artillery_chassis_0: "1세대 중량 워커 차체"
 super_heavy_tank_artillery_chassis_0_desc: "중량 워커 차체는 일반적인 무한궤도나 바퀴식 주행 장치 대신 4족 이동 체계를 통합한 장갑 전투 차량의 차체를 말합니다. 일반적으로 크게 강화된 장갑 캡슐, 고출력 동력 장치 또는 발전기 장치, 그리고 네 개의 관절형 구동 장치를 결합하여 잔해, 급경사, 연약 지반 등 기존 기갑 전력의 움직임을 제약하는 지형에서도 안정적으로 이동할 수 있게 합니다. "
 super_heavy_tank_artillery_chassis_1: "2세대 중량 워커 차체"
 super_heavy_tank_artillery_chassis_1_desc: "중량 워커 차체는 일반적인 무한궤도나 바퀴식 주행 장치 대신 4족 이동 체계를 통합한 장갑 전투 차량의 차체를 말합니다. 일반적으로 크게 강화된 장갑 캡슐, 고출력 동력 장치 또는 발전기 장치, 그리고 네 개의 관절형 구동 장치를 결합하여 잔해, 급경사, 연약 지반 등 기존 기갑 전력의 움직임을 제약하는 지형에서도 안정적으로 이동할 수 있게 합니다. "
 super_heavy_tank_artillery_chassis_2: "3세대 중량 워커 차체"
 super_heavy_tank_artillery_chassis_2_desc: "중량 워커 차체는 일반적인 무한궤도나 바퀴식 주행 장치 대신 4족 이동 체계를 통합한 장갑 전투 차량의 차체를 말합니다. 일반적으로 크게 강화된 장갑 캡슐, 고출력 동력 장치 또는 발전기 장치, 그리고 네 개의 관절형 구동 장치를 결합하여 잔해, 급경사, 연약 지반 등 기존 기갑 전력의 움직임을 제약하는 지형에서도 안정적으로 이동할 수 있게 합니다. "
 super_heavy_tank_destroyer_chassis_0: "1세대 경량 워커 차체"
 super_heavy_tank_destroyer_chassis_0_desc: "경량 워커 차체는 험준한 지형에서의 높은 기동성과 신속한 재배치를 위해 설계된 소형 2족 장갑 차체를 말합니다. 중형 워커 차체보다 빠르지만, 적재 중량이 줄어들어 더 가벼운 무기와 임무 장비만 탑재할 수 있습니다."
 super_heavy_tank_destroyer_chassis_1: "2세대 경량 워커 차체"
 super_heavy_tank_destroyer_chassis_1_desc: "경량 워커 차체는 험준한 지형에서의 높은 기동성과 신속한 재배치를 위해 설계된 소형 2족 장갑 차체를 말합니다. 중형 워커 차체보다 빠르지만, 적재 중량이 줄어들어 더 가벼운 무기와 임무 장비만 탑재할 수 있습니다."
 super_heavy_tank_destroyer_chassis_2: "3세대 경량 워커 차체"
 super_heavy_tank_destroyer_chassis_2_desc: "경량 워커 차체는 험준한 지형에서의 높은 기동성과 신속한 재배치를 위해 설계된 소형 2족 장갑 차체를 말합니다. 중형 워커 차체보다 빠르지만, 적재 중량이 줄어들어 더 가벼운 무기와 임무 장비만 탑재할 수 있습니다."
 tech_tank_walker_chassis_1: "워커 전차 차체 II"
 tech_tank_walker_chassis_1_desc: "초기 워커 차체는 무한궤도를 동력 다리 장치로 대체하여, 단순성을 희생하는 대신 잔해, 숲, 험지에서의 지형 접근성과 충격 기동력을 얻었습니다. 일반 기갑 전력이 멈춰 서는 장애물도 넘을 수 있지만, 구동 장치, 센서, 복잡한 균형 체계로 인해 정비 부담과 비용이 급격히 늘어납니다."
 tech_tank_walker_chassis_2: "워커 전차 차체 III"
 tech_tank_walker_chassis_2_desc: "2세대 워커 차체는 더 나은 제어 소프트웨어와 보강된 관절 설계를 통해 안정성, 하중 지지력, 피해 내성을 개선하였습니다. 더 강력한 동력 전달 장치와 영리한 현가 제어 덕분에 워커는 시가전 돌격과 극한 지형에서 쓸 수 있는 중량급 플랫폼이 되었으나, 대규모로 배치하기에는 여전히 값비싸고 자원 소모가 큽니다."
 walker_tank_module_railgun: "워커 레일건"
 walker_tank_module_railgun_desc: "레일건은 전자기 가속을 이용해 고속 발사체를 쏘아 보내며, 중장갑 표적에 대해 뛰어난 장갑 관통력을 제공합니다.\n\n§G설계 힌트: 레일건은 장갑 관통력을 크게 높여 주지만 제작 비용이 더 많이 듭니다.§!"
 walker_tank_module_tank_barrel: "표준 전차포"
 walker_tank_module_tank_barrel_desc: "전차포는 검증된 화력과 감당할 만한 생산 및 정비 요건을 결합하여, 기갑 전투를 위한 균형 잡히고 신뢰할 만한 주무장을 제공합니다.\n\n§G설계 힌트: 표준 전차포는 비용 대비 효율이 좋은 기본 무장 선택지로, 특별한 단점 없이 안정적인 성능을 제공합니다.§!"
 walker_tank_module_flamethrower: "워커 화염방사기"
 walker_tank_module_flamethrower_desc: "차량 탑재 화염방사기는 불타는 연료를 분사하여 보병 진지와 경방어 시설을 소탕하므로, 근거리의 연약 표적에 매우 효과적입니다.\n\n§G설계 힌트: 화염방사기는 연약 표적과 참호 속 보병을 격파하는 데 뛰어나지만, 중장갑 또는 강화된 표적에는 효과가 매우 제한적입니다.§!"
 walker_tank_module_heavy_machinegun: "중기관총"
 walker_tank_module_heavy_machinegun_desc: "중기관총은 높은 발사 속도의 신뢰할 만한 무기로 보병을 제압하고 경차량과 교전하며, 근거리에서 중거리까지 안정적인 방어를 제공합니다.\n\n§G설계 힌트: 중기관총은 단순하고 비용 대비 효율이 좋은 보조 무장 선택지로, 연약 표적에 대한 범용 방호에 이상적입니다.§!"
 walker_tank_module_rocket_launcher: "워커 로켓 발사기"
 walker_tank_module_rocket_launcher_desc: "로켓 발사기는 고폭탄과 성형작약탄을 발사하여 일반 기관총 무장보다 강력한 장갑 표적 대응 성능을 제공합니다.\n\n§G설계 힌트: 로켓 발사기는 중기관총보다 비싸지만, 장갑 표적에 대해 더 높은 대물 공격력과 향상된 장갑 관통력을 제공합니다.§!"
 walker_tank_module_vls: "워커 수직 발사대"
 walker_tank_module_vls_desc: "수직 발사 체계를 통해 워커는 보호된 발사관에서 유도 미사일을 탑재하고 발사할 수 있으며, 강력한 타격과 신속한 일제 사격 능력을 제공합니다.\n\n§G설계 힌트: 수직 발사대 모듈은 제작 비용이 훨씬 더 많이 들지만, 돌파력과 공격 잠재력이 크게 높아집니다.§!"
 walker_tank_module_nuclear_engine_gen1: "원자력 엔진 I"
 walker_tank_module_nuclear_engine_gen1_desc: "원자력 엔진은 탑재형 발전을 제공하여 재래식 연료 소모를 없애고, 연료 보급에 의존하지 않는 지속적인 작전을 가능하게 합니다.\n\n§G설계 힌트: 원자력 엔진은 연료 소모를 없애 주지만 생산 비용이 더 많이 듭니다.§!"
 walker_tank_module_nuclear_engine_gen2: "원자력 엔진 II"
 walker_tank_module_nuclear_engine_gen2_desc: "$walker_tank_module_nuclear_engine_gen1_desc$"
 walker_tank_module_nuclear_engine_gen3: "원자력 엔진 III"
 walker_tank_module_nuclear_engine_gen3_desc: "$walker_tank_module_nuclear_engine_gen1_desc$"
 walker_tank_module_nuclear_engine_gen4: "원자력 엔진 IV"
 walker_tank_module_nuclear_engine_gen4_desc: "$walker_tank_module_nuclear_engine_gen1_desc$"
 walker_tank_module_diesel_engine_gen1: "디젤 엔진 I"
 walker_tank_module_diesel_engine_gen1_desc: "디젤 엔진은 보행 병기(워커)를 위한 검증된 전통적인 동력원을 제공하며, 널리 사용되는 부품을 통해 간편한 생산과 유지보수가 가능합니다.\n\n§G설계 힌트: 디젤 엔진은 표준적이고 비용 효율적인 선택이지만, 연료 소모량이 많습니다.§!"
 walker_tank_module_fusion_engine_gen1: "핵융합 엔진 I"
 walker_tank_module_fusion_engine_gen1_desc: "핵융합 엔진은 고밀도 탑재형 발전을 제공하여 재래식 연료 소모를 없애고, 연료 보급에 의존하지 않는 지속적인 작전을 가능하게 합니다.\n\n§G설계 힌트: 핵융합 엔진은 원자력 엔진과 동일한 연료 독립성의 이점을 제공하지만, 신뢰성이 더 높고 비용은 훨씬 더 많이 듭니다.§!"
 walker_tank_module_solar_engine_gen1: "태양광 엔진 I"
 walker_tank_module_solar_engine_gen1_desc: "태양광 엔진은 탑재형 전력 생산을 제공하여 재래식 연료 보급에 대한 의존도를 줄이고, 유리한 조건에서 장기 작전을 가능하게 합니다.\n\n§G설계 힌트: 태양광 엔진은 원자력 엔진과 비슷한 연료 독립성의 이점을 더 낮은 비용으로 제공하지만, 신뢰성은 더 떨어집니다.§!"
 walker_tank_module_two_legs: "2족 워커 프레임"
 walker_tank_module_two_legs_desc: "2족 워커 프레임은 표준적인 두 다리 이동 구조를 제공하며, 범용 전투 임무에 적합한 균형 잡힌 기동성과 방호력을 갖추고 있습니다.\n\n§G설계 힌트: 2족 프레임은 기본 워커 구성으로, 더 무거운 다리 장치의 높은 비용과 복잡성 없이 신뢰할 만한 기동성과 생존성을 제공합니다.§!"
 walker_tank_module_four_legs: "4족 중량 프레임"
 walker_tank_module_four_legs_desc: "4족 중량 프레임은 보강된 네 개의 다리 장치를 사용하여 포화 속에서의 안정성을 높이고 더 무거운 하중을 지탱하며, 돌격 중 전투 지속력을 높입니다.\n\n§G설계 힌트: 4족 중량 프레임은 더 높은 돌파력과 향상된 신뢰성을 제공하지만, 제작 비용이 더 많이 들고 이동 속도가 감소합니다.§!"
 walker_tank_light_chassis: "경량 워커 본체"
 walker_tank_light_chassis_desc: "경량 워커 차체는 워커 전차의 핵심 본체 구조를 이루며, 신속한 기동과 재배치를 위해 낮은 중량과 민첩성을 우선시합니다.\n\n§G설계 힌트: 경량 차체는 높은 기동성과 무장 슬롯 1개를 제공하므로, 속도가 가장 중요한 임무에 이상적입니다.§!"
 walker_tank_medium_chassis: "중형 워커 본체"
 walker_tank_medium_chassis_desc: "중형 워커 차체는 워커 전차의 핵심 본체 구조를 이루며, 방호력, 기동성, 적재량의 균형을 맞추어 다목적 전선 성능을 발휘합니다.\n\n§G설계 힌트: 중형 차체는 만능형 선택지로, 무장 슬롯 2개를 제공하여 유연한 무장 구성이 가능합니다.§!"
 walker_tank_heavy_chassis: "중량 워커 차체"
 walker_tank_heavy_chassis_desc: "중량 워커 차체는 중량 워커 전차의 핵심 본체 구조를 이루며, 속도와 민첩성보다 최대 적재량과 무기 통합을 우선시합니다.\n\n§G설계 힌트: 중량 차체는 매우 비싸고 가장 느린 워커 본체이지만, 가장 많은 무장 선택지를 제공하며 가장 단단한 표적을 압도하고 파괴하도록 만들어졌습니다.§!"
 walker_tank_module_battlestation_1: "전투 지휘 장비 일체 I"
 walker_tank_module_battlestation_1_desc: "전투 지휘 장비 일체는 사격 통제, 센서, 탑재 협조 도구를 통합하여 플랫폼 전반의 전투 효율과 반응성을 향상시킵니다.\n\n§G설계 힌트: 전투 지휘 장비 일체는 워커 성능을 전방위로 폭넓게 개선하므로, 어떤 임무와 무장 구성에도 훌륭한 범용 개량이 됩니다.§!"
 walker_tank_module_countermeasures_1: "능동 방어 체계 I"
 walker_tank_module_countermeasures_1_desc: "능동 방어 체계는 센서와 신속 대응 대응 수단을 사용하여 날아오는 위협을 탐지하고 무력화하며, 포화 속에서의 전반적인 방어 생존성을 향상시킵니다.\n\n§G설계 힌트: 능동 방어 체계는 폭넓은 방어 개량으로, 최전선에서 작전하는 워커가 미사일, 로켓 등 정밀 위협에서 살아남도록 돕습니다.§!"
 walker_tank_module_anti_rocket_laser_1: "근접 방어 레이저 I"
 walker_tank_module_anti_rocket_laser_1_desc: "근접 방어 레이저는 신속한 추적과 지향성 에너지 방출을 이용하여 날아오는 로켓을 충돌 전에 탐지하고 파괴하여, 관통에 성공할 가능성을 줄입니다.\n\n§G설계 힌트: 근접 방어 레이저는 관통 확률을 낮춤으로써 로켓과 미사일 위협에 대한 방호를 개선하며, 지속적인 포화를 받을 것으로 예상되는 돌파 부대에 특히 유용합니다.§!"
 walker_tank_module_recon_drone_1: "정찰 드론 패키지 I"
 walker_tank_module_recon_drone_1_desc: "정찰 드론 패키지를 통해 워커는 전장 드론을 전개하여 전방 관측과 표적 확인을 수행할 수 있으며, 가시선 너머의 상황 인식을 향상시킵니다.\n\n§G설계 힌트: 정찰 드론은 정찰 능력을 강화합니다.§!"
 walker_tank_module_suicide_drone_1: "체공형 탄약 발사대 I"
 walker_tank_module_suicide_drone_1_desc: "체공형 탄약 발사대는 일회용 공격 드론을 발사하며, 이 드론은 일반 미사일 일제 사격보다 개선된 유도 및 표적 식별 능력으로 표적을 탐색, 추적, 타격할 수 있습니다.\n\n§G설계 힌트: 체공형 탄약은 기존 수직 발사대 타격보다 더 나은 표적 지정과 명중 신뢰성을 제공하지만, 탄두가 작고 적재량이 제한적이어서 순수 피해량은 낮습니다.§!"
