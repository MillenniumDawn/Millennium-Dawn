 GRN_AI_BEHAVIOR: "@GRN 格陵兰"
 RULE_OPTION_GRN_SCANDINAVIAN_SERENITY: "斯堪的纳维亚的宁静"
 RULE_OPTION_GRN_SCANDINAVIAN_SERENITY_AI_DESC: "允许格陵兰岛通过其外交政策树进行一些不正当的举动，并加入斯堪的纳维亚半岛。但不要让它的野心止步于此，这样一来，北约就有可能获得一个实力不俗的盟友。"
 RULE_OPTION_GRN_CONTINENTAL_HEGEMONY: "大陆霸权"
 RULE_OPTION_GRN_CONTINENTAL_HEGEMONY_AI_DESC: "允许格陵兰岛的人工智能继续推进其野心，超越建立斯堪的纳维亚半岛的范畴，并允许他们将几乎整个欧洲大陆巩固在新的统一旗帜 - 冰冻联邦 - 之下。"
 RULE_DISABLE_COUP_CONTEST: "禁用政变斗争活动"
 RULE_YES_DISABLE_COUP_CONTEST_DESC: "§R禁用§!§H政变斗争§!事件链。主要外国影响力人物在其投资的国家发生政变时，将§R不会§!收到通知或做出回应。如果您希望人工智能避免代理人冲突升级，请使用此选项。"
 RULE_NO_DISABLE_COUP_CONTEST_DESC: "§G启用§!§H政变斗争§!事件链。当一个国家发生政变时，最大的外国影响力国家（如果影响力超过§H20%§!，则包括第二大影响力国家！）会收到通知，并可以选择如何回应：谴责、制裁、支持反对派或进行军事干预。政变后发生的内战也会触发相应的支持旧政权的事件。"
 RULE_REMOVE_MICRO_STATES_TINY: "微小国家（微型国家）"
 RULE_REMOVE_MICRO_STATES_TINY_DESC: "仅移除最小的国家（摩纳哥、圣马力诺等）和加勒比海岛国。"
 RULE_REMOVE_MICRO_STATES_SMALLER: "小型国家"
 RULE_REMOVE_MICRO_STATES_SMALLER_DESC: "移除像不丹、冈比亚和吉布提这样稍大一些的国家。"
 RULE_REMOVE_MICRO_STATES_INSIGNIFICANT: "扩展移除"
 RULE_REMOVE_MICRO_STATES_INSIGNIFICANT_DESC: "移除所有较小的国家，诸如老挝、苏里南和圭亚那等其他国家，以最大限度地提高性能。"
 RULE_ENABLE_RESOURCE_STORAGE_SYSTEM: "启用§Y资源存储系统§!"
 RULE_OPTION_ENABLE_RESOURCE_STORAGE_SYSTEM: "启用§Y资源存储系统§!允许您存储原材料。如果您每天遇到大量卡顿，请禁用此功能。禁用后不会造成任何实质性损失。"
 RULE_OPTION_DISABLE_RESOURCE_STORAGE_SYSTEM: "禁用允许您存储原材料的§Y资源存储系统§!"
 RULE_CARRIER_ONLY_RAIDS: "启用仅限航母突袭"
 RULE_CARRIER_ONLY_RAIDS_NO: "禁用仅限航母突袭。这不会影响使用航空母舰空袭的能力，但如果您经常遇到航母空袭中飞机从航空母舰转移到空军基地的问题。"
 RULE_CARRIER_ONLY_RAIDS_YES: "启用仅限航母参与的突袭。这是其他突袭任务的重复版本，只允许从航空母舰起飞。"
 RULE_RAID_DOCTRINE_REACH: "在突袭行动中贯彻干预原则"
 RULE_RAID_DOCTRINE_REACH_NO: "禁用突袭中的干预原则检查。玩家（以及AI）可以针对任何可见目标发动袭击，不受外交政策的限制。是否处于战争、关系值和阵营检查仍然有效。"
 RULE_RAID_DOCTRINE_REACH_YES: "默认行为。干预原则限制了突袭目标的选择：§Y孤立主义§!无法在和平时期发起突袭，§Y域内安全§!无法在和平时期发起突袭，§Y有限干涉主义§!只能干涉邻国，同时§Y地区干涉主义§!需要目标位于同一大陆。战时则无视以上原则。"
 RULE_ALLOW_CPD_AI_OFFERS: "允许AI提出有条件的和平协议"
 RULE_OPTION_CPD_AI_OFFERS_YES_DESC: "将允许交战中的人工智能国家定期评估正在进行的冲突，并在判定战争无法取胜或陷入僵局时提出§Y有条件的和平协议§!。宗主国也会代表其受限的附属国进行谈判。"
 RULE_OPTION_CPD_AI_OFFERS_NO_DESC: "禁止AI国家主动发起§Y有条件的和平协议§!。玩家仍然可以通过外交行动手动提出协议。"
 RULE_EU_EXPANSION_FOCUS: "欧盟行为"
