 tooltip_EU_budget_global_combined: "Lowering Global Europe Expenses:\nEU budget §OGrowth§! rate: Add §O+2%§! (pts)\nEU budget §GNatural resources§! rate: Add §G+2%§! (pts)\nEU budget §LGlobal Europe§! rate: Add §L-4%§! (pts)\nTotal invested PP: Add §Y[?global.EU_10_per_member_cost]§!\n[EU_parl_PG_party_1_icon], [EU_parl_PG_party_14_icon] and [EU_parl_PG_party_6_icon] will §Gsupport§! this change.\n[EU_parl_PG_party_2_icon] and [EU_parl_PG_party_16_icon] will §Rresist§! this change.\n[EU_parl_PG_party_3_icon] and [EU_parl_PG_party_18_icon] will §Gsupport§! this change.\n[EU_parl_PG_party_17_icon] will §Gsupport§! this change.\n[EU_parl_PG_party_4_icon],  [EU_parl_PG_party_5_icon] and [EU_parl_PG_party_19_icon] will §Gsupport§! this change.\n[EU_parl_PG_party_20_icon], [EU_parl_PG_party_21_icon], [EU_parl_PG_party_22_icon] and [EU_parl_PG_party_23_icon] will §Gsupport§! this change.\n\nRaising Global Europe Expenses:\nEU budget §OGrowth§! rate: Add §O-2%§! (pts)\nEU budget §GNatural resources§! rate: Add §G-2%§! (pts)\nEU budget §LGlobal Europe§! rate: Add §L+4%§! (pts)\nTotal invested PP: Add §Y[?global.EU_10_per_member_cost]§!\n[EU_parl_PG_party_1_icon], [EU_parl_PG_party_14_icon] and [EU_parl_PG_party_6_icon] will §Rresist§! this change.\n[EU_parl_PG_party_2_icon] and [EU_parl_PG_party_16_icon] will §Gsupport§! this change.\n[EU_parl_PG_party_3_icon] and [EU_parl_PG_party_18_icon] will §Rresist§! this change.\n[EU_parl_PG_party_17_icon] will §Rresist§! this change.\n[EU_parl_PG_party_4_icon],  [EU_parl_PG_party_5_icon] and [EU_parl_PG_party_19_icon] will §Rresist§! this change.\n[EU_parl_PG_party_20_icon], [EU_parl_PG_party_21_icon], [EU_parl_PG_party_22_icon] and [EU_parl_PG_party_23_icon] will §Rresist§! this change."
