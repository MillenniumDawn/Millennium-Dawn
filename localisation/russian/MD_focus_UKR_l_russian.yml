 UKR_storage_item_s125_tt: "§YС-125 «Нева»§!\n\n\n£SOV_MISSILE_1965_SAM\n\n\n\nДивизионов на хранении: §Y[?ukraine_has_s125_stockpile|0]§!\nПоколение: маловысотный зенитный ракетный комплекс первого поколения, на вооружении с 1961 года.\nТип техники: §YЗенитный ракетный дивизион (4 пусковые установки)§!\n\nСемейство вариантов:\n• С-125М «Нева-М»\n• С-125М1 «Нева-М1»\n\nМаловысотный зенитный комплекс §Rсоветских§! войск ПВО. Дивизион можно снова поставить на боевое дежурство или использовать как мобильные пусковые установки."
