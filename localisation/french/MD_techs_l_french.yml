 tech_early_naval_weapon_systems: "Systèmes d'armes de la Seconde Guerre mondiale"
 tech_early_naval_weapon_systems_desc: "Les systèmes d'armes navals de la Seconde Guerre mondiale s'appuyaient sur canons de bord éprouvés, torpilles, grenades anti-sous-marines et équipements de conduite de tir simples. Ces armes plus anciennes formaient la base du combat de surface avant la guerre navale guidée moderne."
 tech_naval_weapon_systems: "Systèmes d'armes de la guerre froide"
 tech_naval_weapon_systems_desc: "Les systèmes d'armes navals de la guerre froide ont étendu la lutte anti-sous-marine et la guerre des mines à courte portée, utilisant mortiers anti-sous-marins améliorés, dragueurs et matériel de mouillage pour protéger les flottes et contester les eaux côtières."
 tech_rail_guns_1: "Railguns 2025"
 tech_rail_guns_1_desc: "Les railguns utilisent la force électromagnétique pour lancer des projectiles à grande vitesse. Le projectile ne contient normalement pas d'explosifs, mais se fie à sa vitesse élevée, à sa masse et à son énergie cinétique pour infliger des dommages."
 tech_rail_guns_2: "Railguns 2035"
 tech_rail_guns_2_desc: "Les railguns utilisent la force électromagnétique pour lancer des projectiles à grande vitesse. Le projectile ne contient normalement pas d'explosifs, mais se fie à sa vitesse élevée, à sa masse et à son énergie cinétique pour infliger des dommages."
 tech_rail_guns_3: "Railguns 2045"
