 nsb_heavy_atgm_tech_1: "1세대 대형 대전차 유도 미사일 (ATGM)"
 nsb_heavy_atgm_tech_1_desc: "대형 대전차 유도 미사일(ATGM)은 장갑 차량을 교전하고 파괴하기 위해 설계된 미사일 기술의 초기 발전물이었습니다. 이 체계들은 대개 수동 지령 시선 유도(MCLOS) 방식을 채택하여, 조작병이 비행 내내 미사일을 표적으로 직접 조종해야 했습니다. 이 방식은 광범위한 훈련을 요구했고, 미사일을 유도하는 동안 조작병이 적의 사격에 노출되었습니다."
