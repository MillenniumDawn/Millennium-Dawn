 union_representation_in_government_ast_desc: "오스트레일리아 노동조합평의회가 이제 우리 정치 체제를 더 깊이 장악하고 있습니다. 입법 과정에 영향을 미쳐 오직 노조에만 이익이 돌아가게 합니다."
