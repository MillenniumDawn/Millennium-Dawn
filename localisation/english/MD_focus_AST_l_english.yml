reconciliation_discontent: "Reconciliation Discontent"
reconciliation_discontent_desc: "A persistent disadvantage permeates the lives of Indigenous Australians. While the Mabo Case reinvigorated the spirit of many, consistently indifferent leadership over the last decade has grinded down much of the hope few still had, and even fewer are seeing the benefits from it today. A small vocal minority still appeals to the government for desperate change."
reform_despair_ast: "Reconciliation Despair"
reform_despair_ast_desc: "Without hope for change the spirit of reconciliation has been snuffed out. Indigenous Australians continue to live on the fringe without a guaranteed future, and many others feel disenchanted with the direction of our policy. Equality for all in our nation now feels far out of reach. We can expect disaffected voters to support more radical movements in the future."
rekindled_hope_ast: "Rekindled Hope"
rekindled_hope_ast_desc: "A weight has been lifted off many Australians. In a small but measurable way the nation has moved towards healing. While the road is still long, the journey to get there has been made easier. More opportunities are being made available for those in need. Workplaces and schools have become more unified and supporting for all Australians. The community now looks forward with hope."
economic_radical: "Economic Radical"
john_howard: "John Howard"
the_rba_ast: "The RBA"
the_rba_ast_desc: "The Reserve Bank of Australia is our central bank and authority on issuing bank notes. This essentially means they control the interest rate. If we play nice with our policies, bring spending and unemployment down, they'll play nice."
work_for_the_dole: "Work for the Dole"
work_for_the_dole_desc: "The program aims to train participants and put them to work helping local communities if they are able. They'll continue to receive income support during the work while we continue to train them."
work_for_the_dole_2: "Work for the Dole"
work_for_the_dole_2_desc: "The program aims to train participants and put them to work helping local communities if they are able. They'll continue to receive income support during the work while we continue to train them. As it's grown we've incorporated a number of state construction roles to the list of opportunities, to assist with our constructions works."
baby_bonus_idea_ast: "Baby Bonus"
baby_bonus_idea_ast_desc: "The scheme is aimed at offsetting the expenses burdened upon new parents raising their child. A lump sum of $3,000 is distributed to the parents per eligible child. This should encourage a growing population to mitigate our aging Australians."
negative_gearing_tooltip_tt: "Massively damages our relationship with the §Ylandowners§! and our re-election chances, but it may prevent a housing crisis in the future."
tafe_investment: "Investments in TAFE"
signed_the_kyoto_protocol_ast: "Signed the Kyoto Protocol"
kyoto_protocol_ast: "The Kyoto Protocol"
kyoto_protocol_ast_desc: "Originally adopted by other nations in 1997, the Protocol has been a guiding stone to reducing greenhouse gas emissions for industries, based on the latest scientific consensus regarding global warming. While not all of its restrictions are in force, we are introducing them over time in the hopes of eventually reaching a net-zero output of greenhouse gases."
ast_avoid_the_speech_tt: "The party will be ordered to remain impartial in the interests of coalition unity. We can only hope that the public loses interest."
national_water_initiative_ast: "§GNational Water Initiative§!"
national_water_initiative_ast_2: "§GNational Water Initiative§!"
ast_a_nation_worth_preserving_tt: "The effects of our §Gsuccess§! will be felt in the generations that follow."
police_and_security_increase_tt: "Our §YPolice and Security Funding§! will be increased to combat the protests."
police_and_security_increase_2_tt: "Our §YPolice and Intelligence Funding§! will be increased to expand our judicial powers."
asio: "ASIO"
asio_desc: "The Australian Security and Intelligence Organisation is responsible for protecting our citizens from any and all internal threats. Originally created over five decades prior, the organisation has been adapted to counter the growing threats Australia faces in the new millennia."
streamlined_asylum_policy_ast: "Streamlined Asylum Policy"
