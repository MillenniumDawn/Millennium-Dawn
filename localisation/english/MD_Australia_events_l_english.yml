boat_arrivals_ast_desc: "The issue has plagued our nation's governments for decades. For immigrants who wish to skip the queue and journey through boat smuggling or the likes, their entry, while legally unauthorised, is technically not a criminal offence. Due to this the processing of these unlawful citizens has become an arduous and costly endeavor, and one that will not be solved easily."
