 preah_vihear_not_settled_TT: "Вопрос о границе не был урегулирован за последние пять лет."
 preah_vihear_no_recent_escalation_TT: "В последнее время мы не предпринимали провокационных действий на границе."
 preah_vihear_no_recent_protest_TT: "В последнее время нам не удавалось разжигать националистические настроения."
