 util_vehicle_type: "Вспомогательная машина"
 util_vehicle_type_desc: "Вспомогательная машина — как правило, моторизованное транспортное средство, предназначенное для выполнения конкретной задачи с большей эффективностью, чем универсальный автомобиль."
 util_vehicle_8: "Вспомогательная машина 2035"
 util_vehicle_8_desc: "Вспомогательные машины — это транспортные средства, используемые мотопехотными частями для доставки войск на поле боя. Ранние модели, джипы и грузовики, практически не имели брони и отличались от гражданских версий главным образом повышенной прочностью и лучшей проходимостью в сложной местности. Поздние модели представляют собой машины типа Humvee с улучшенной бронёй и противоминные транспортные средства с повышенной защитой экипажа. Если техника вооружена, то обычно лёгким оружием, например пулемётами."
 attack_helicopter_1: "Ударный вертолёт 1965 года"
 attack_helicopter_1_desc: "Ударный вертолёт — это военный вертолёт, оснащённый наступательным вооружением. Его основное оружие — скорострельные автоматические орудия (пушки и пулемёты), ракетные установки и высокоточное управляемое оружие (ракеты). Многие ударные вертолёты также могут быть оснащены зенитными ракетами, но они в основном используются для самообороны. Современные ударные вертолёты по функциям схожи со штурмовыми самолётами и специально предназначены для поражения наземных целей, таких как пехота, бронетехника и здания."
 attack_helicopter_2: "Ударный вертолёт 1985 года"
