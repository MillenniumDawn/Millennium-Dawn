 ## Ideas
 BRA_idea_amazonian_development_project: "Amazonian Development Project"
 BRA_idea_amazonian_development_project_desc: "The great undertaking of developing the Amazon has begun. We are cutting the red tape that has held the region back, which opens up new economic opportunities for private firms and the government alike."
 BRA_idea_growth_through_freedom: "Growth Through Freedom"
 BRA_idea_growth_through_freedom_desc: "Looser rules and lighter controls have set private enterprise free. Construction is moving faster, and the new confidence makes our government more effective and our country steadier. The boost will not last forever."
 BRA_idea_oncoming_debt_crisis: "Oncoming Debt Crisis"
 BRA_idea_oncoming_debt_crisis_desc: "Debt looms over our country like a dark cloud. Recent fiscal measures have eased many of the problems, but we are still on the verge of being unable to pay our debts. We can seek a foreign aid package or reinstate the IMF debt rules on our nation.\n§W--------------§!\nThis national spirit will be §RRemoved§! and replaced by §Y$BRA_idea_imf_debts$§! if we complete the §Y$BRA_reinstating_imf_debts$§! focus. If we complete the §Y$BRA_foreign_assist$§! focus instead, it will be §RRemoved§! and replaced by §Y$BRA_idea_foreign_debt_assistance$§! if the United States accepts, or by §Y$BRA_idea_worsening_debt_crisis$§! if it refuses. It will also be §RRemoved§! if our §YDebt-to-GDP§! ratio falls below §Y20%§! (current ratio: [?THIS.debt_ratio|%])."
 BRA_idea_worsening_debt_crisis: "Worsening Debt Crisis"
 BRA_idea_worsening_debt_crisis_desc: "Our failure to reach a deal with the United States has further collapsed the real. Our economy is slipping out of our grasp, and unless we change course soon, our only hope is to pay off as much of our debt as quickly as we can.\n§W--------------§!\nThis national spirit will be §RRemoved§! if we complete the §Y$BRA_pay_back_the_imf$§! focus, or if our §YDebt-to-GDP§! ratio falls below §Y20%§! (current ratio: [?THIS.debt_ratio|%])."
 BRA_idea_crippled_currency: "Crippled Currency"
 BRA_idea_crippled_currency_desc: "Years of devaluation have gutted the real. Industry recovers slowly, new factories take longer to reach full output, and every reform costs more political capital.\n§W--------------§!\nIf we have not yet completed the §Y$BRA_crippled_currency$§! focus, completing it will §GImprove§! this national spirit once. It will be §RRemoved§! if we complete the §Y$BRA_pay_back_the_imf$§!, §Y$BRA_encourage_consumption$§!, or §Y$BRA_improve_the_real$§! focus."
 BRA_idea_imf_debts: "IMF Debts"
 BRA_idea_imf_debts_desc: "The debts we owe the IMF continue to loom over us. They deter foreign investors, keep international capital out of our country, and stall economic growth. Until we clear them, we will keep paying for past economic despair.\n§W--------------§!\nThis national spirit will be §RRemoved§! if we complete the §Y$BRA_pay_back_the_imf$§! focus, or if our §YDebt-to-GDP§! ratio falls below §Y20%§!."
 BRA_idea_foreign_debt_assistance: "Foreign Debt Assistance"
 BRA_idea_foreign_debt_assistance_desc: "The United States has given us a debt package that eases some of our problems. Through a series of targeted moves, it bought our debt back from American private investors and relieved us of the obligation.\n§W--------------§!\nThis national spirit will be §RRemoved§! if we complete the §Y$BRA_pay_back_the_imf$§! focus, or if our §YDebt-to-GDP§! ratio falls below §Y20%§!."
 BRA_idea_pro_farmers: "Pro-Farmers"
 BRA_idea_pro_farmers_desc: "As we slowly move from an agrarian society to a manufacturing economy, we must stay pro-farmer and never forget our country's main producers."
 BRA_economy_modifier: "State of the Brazilian Economy"
 BRA_economy_modifier_desc: "Every reform to our industry, farms, trade, and research leaves a lasting mark on the national economy. This spirit gathers what our policies have built so far."
 BRA_econ_efficiency_cap_tt: "$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$: $RIGHT|+=%1$"
 BRA_econ_building_slots_tt: "$MODIFIER_GLOBAL_BUILDING_SLOTS_FACTOR$: $RIGHT|+=%1$"
 BRA_econ_conversion_cost_tt: "$MODIFIER_CONVERSION_COST_CIV_TO_MIL_FACTOR$: $RIGHT|-=%1$"
