 SIA_tt_palace_bargain_support: "마히돈 왕가 왕당파 블록이 득표율의 15퍼센트 이상을 차지해야 합니다."
 SIA_tt_china_contracts_renegotiated: "중국과의 계약이 이미 재협상되지 않았어야 합니다."
 SIA_tt_us_security_reviewed: "미국-태국 안보 검토가 이미 종결되지 않았어야 합니다."
 SIA_tt_tax_modernized: "세수 징수가 이미 현대화되지 않았어야 합니다."
 SIA_tt_gripen_ef_contracted: "그리펜 E/F 계약이 이미 체결되지 않았어야 합니다."
 SIA_the_quiet_word: "조용한 한마디"
 SIA_the_quiet_word_desc: "적절한 곳에서 걸려 온 전화 한 통이 예전에는 전차가 하던 일을 해냅니다. 네트워크는 이 정부가 진정 누구의 것인지 분명히 하고, 메시지는 총성 한 발 없이 전달됩니다. 선거는 유지되고 투표용지는 개표되지만, 나라는 어쨌든 왕궁 쪽으로 기울어 갑니다."
 SIA_judicial_review_route: "가처분에 의한 통치"
 SIA_judicial_review_route_desc: "헌법재판소가 법 기술상의 흠결을 찾아내고, 집권당은 하룻밤 사이에 해산됩니다. 병영도, 통행금지도 없이 판결 한 장과 아주 조용한 권력 이양만 있을 뿐입니다."
 SIA_the_appointed_senate: "임명으로 채운 상원"
 SIA_the_appointed_senate_desc: "투표가 결코 닿지 않는 250개 의석이 네트워크에 의해 채워지고 오직 네트워크에만 책임을 집니다. 이제 모든 정부는 상원의 뜻에 따라 통치합니다."
 SIA_coalition_kingmakers: "연립의 킹메이커"
 SIA_coalition_kingmakers_desc: "각료직과 예산 배분, 그리고 유력 인사들에게 건네는 은밀한 한마디가 유권자보다 왕궁 네트워크에 먼저 응답하는 정부를 만들어 냅니다."
 SIA_constitutional_engineering: "헌장 설계"
 SIA_constitutional_engineering_desc: "총구가 아니라 위원회 회의실에서 기초된 새 헌법이 네트워크의 이점을 나라의 기본법에 못 박습니다. 병사 한 명 동원할 필요가 없었습니다."
 SIA_the_establishment_consensus: "기득권층의 합의"
 SIA_the_establishment_consensus_desc: "법원, 상원, 군, 재계가 이제 한 몸처럼 움직이며, 선거는 네트워크가 언제나 이기는 형식적 절차가 되었습니다. 전차를 부를 필요는 없었습니다."
 SIA_judicial_review_route_choice_tt: "헌법재판소 판결의 파급 범위를 선택하십시오.\n - §Y전면 해산§!: 당의 인기도를 무너뜨리지만 개혁 압력을 키웁니다\n - §Y제한적 기술 판결§!: 비용이 덜 듭니다"
 SIA_coalition_kingmakers_choice_tt: "연립 파트너를 선택하십시오.\n - §Y지방 유력 인사§!: 국고로 매수합니다\n - §Y재계 엘리트§!: 안정도를 소폭 희생하며 구애합니다"
 SIA_royalist_no_coup_path: "쿠데타 없는 왕당파 노선(네트워크 군주제)에 전념"
 SIA_establishment_category: "기득권 체제 관리"
 SIA_establishment_category_desc: "쿠데타가 필요 없었던 네트워크 군주제의 수단들입니다. 임명 상원, 협조적인 재판부, 그리고 왕궁 고유의 설득 경로가 이에 해당합니다."
 SIA_senate_procedural_vote: "절차 표결 소집"
 SIA_senate_procedural_vote_desc: "선출된 하원이라면 결코 통과시키지 않을 안건에 맞춰 임명 상원을 단속합니다. 정치적 자본이 들지만 표결 결과는 사실상 의심의 여지가 없습니다. §G안정도가 상승합니다.§!"
 SIA_court_referral: "법원에 회부"
 SIA_court_referral_desc: "포퓰리스트들의 최근 책동을 우호적인 재판부에 넘겨, 선거가 거부하는 일을 판결로 해치웁니다. §R집권당의 인기도가 하락하지만, 이 수법을 쓸수록 개혁 압력이 커집니다.§!"
 SIA_palace_audience: "왕궁 알현 요청"
 SIA_palace_audience_desc: "공식 알현을 통해 군과 구 지주 가문들이 네트워크가 여전히 자신들을 대변한다는 점에 만족하도록 합니다. §G군부와 지주층의 관계가 개선됩니다.§!"
 thailand.434.t: "법원의 판결"
 thailand.434.d: "헌법재판소가 집권당의 행태에 대한 판결을 내립니다. 법정에 있는 모두가 이미 결론이 어느 쪽으로 날지 알고 있습니다."
 thailand.434.a: "당을 즉각 해산한다"
 thailand.434.b: "판결을 기술적 사안으로 한정한다"
 thailand.435.t: "킹메이커들의 거래"
 thailand.435.d: "네트워크가 감내할 수 있는 정부를 꾸리려면 누군가에게 대가를 치러야 합니다. 문제는 누구에게, 어떤 방식으로 치르느냐입니다."
 thailand.435.a: "지방 유력자들을 매수한다"
 thailand.435.b: "재계 엘리트에게 구애한다"
 SIA_no_lar_dlc_tt: "정보기관 전체 메커니즘을 사용하려면 La Resistance 확장팩이 필요합니다. 대신 정치력이 지급됩니다."
 SIA_the_national_intelligence: "국가정보원"
 SIA_the_national_intelligence_desc: "이제 하나의 국가정보원이 같은 정보를 두고 경쟁하던 경찰, 군, 민간 기관들 위에 자리합니다. 창설에는 많은 비용이 들며, 흡수되는 기관들은 싸움 없이는 자기 영역을 내놓지 않습니다."
 SIA_special_branch_police: "특별수사국"
 SIA_special_branch_police_desc: "정치 및 대테러 전담 경찰 부서가 생겨 국가는 전복 활동과 소요를 더 예리하게 감시하게 됩니다. 장교들은 임무에 걸맞은 재정 지원을 기대하며, 일단 부대가 창설되면 그 기대는 사라지지 않습니다."
 SIA_counter_insurgency_south: "남부의 불길"
 SIA_counter_insurgency_south_desc: "정보 자산이 빠따니, 얄라, 나라티왓의 반란 세력을 상대하기 위해 남부로 이동하며, 군 단독으로는 결코 파악할 수 없었던 조직망을 추적합니다. 이 단속은 무장 세력을 상대로 한 우위를 가져다주지만, 그 대가는 주민들의 인내심입니다."
 SIA_signals_intelligence: "귀 기울이는 국가"
 SIA_signals_intelligence_desc: "신호 및 암호 부서는 태국에 역내 전파와 통신망을 청취할 자체 귀를 마련해 줍니다. 암호 해독 요원과 서버 시설은 결코 멈추지 않는 고정 지출입니다."
 SIA_humint_networks: "현장의 사람들"
 SIA_humint_networks_desc: "담당관과 유급 정보원들이 어떤 위성으로도 대체할 수 없는 국경 너머의 인적 네트워크를 구축합니다. 이런 식으로 요원을 모집하고 운용하는 일은 비싸고 화려하지 않은 작업이며, 그 대가는 요란한 선전이 아니라 정치적 자본으로 치릅니다."
 SIA_cia_partnership: "랭글리 커넥션"
 SIA_cia_partnership_desc: "중앙정보국과의 공식 연락 채널은 접근권과 훈련을 대가로 워싱턴 쪽으로의 기울기를 요구합니다. 랭글리로 이어지는 모든 회선은 랭글리가 양방향으로 읽을 수 있는 회선입니다."
 SIA_mss_cooperation: "궈안부와의 악수"
 SIA_mss_cooperation_desc: "중국 국가안전부와의 은밀한 채널은 협력을 대가로 베이징 쪽으로의 기울기를 요구합니다. 이 관계는 중국과 태국의 유대를 심화시키지만, 외국과의 모든 연락 관계가 지니는 양방향 노출 위험도 함께 따릅니다."
 SIA_the_watchful_state: "감시하는 국가"
 SIA_the_watchful_state_desc: "국내 치안과 해외 정보가 하나의 상설 안보 기구로 통합되며, 새로운 기관 업그레이드와 현장의 신규 요원들로 그 영향력이 확장됩니다. 이 모든 것을 유지하는 일은 이제 예산상의 영구 항목입니다."
 SIA_surveillance_state: "판옵티콘"
 SIA_surveillance_state_desc: "기관의 권한이 한계까지 확장되어 탐지 및 방어 능력이 법이 허용하는 최대치, 아니 그보다 조금 더 높이 끌어올려집니다. 기업들은 감시에 불만을 품고, 국고는 정치적 자본을 쏟아내며, 그 차액은 안정도가 치릅니다."
 SIA_accountable_oversight: "법치"
 SIA_accountable_oversight_desc: "사법 심사, 의회 감독, 공개 보고 의무가 기관에 덧붙여져, 순수한 탐지 능력을 내주는 대신 정당성과 낮은 부패를 얻습니다. 기관은 더 느리고 덜 전지전능해지지만, 자기 자신 외의 누군가에게 책임을 지게 됩니다."
 SIA_national_intelligence_idea: "국가 정보 교리"
 SIA_national_intelligence_idea_desc: "신설 기관의 창설 정신이 관료 조직 전반으로 퍼집니다. 정보는 힘이며, 이제 모든 부처가 정보를 위로 올려 보냅니다. 감시하는 습관은 어느 정부가 집권하든 그보다 오래 살아남습니다."
 SIA_territorial_defense: "국토 방위 교리"
 SIA_territorial_defense_desc: "왕국의 병사들은 땅을 쫓기보다 지키도록 훈련받습니다. 부대는 참호를 파고, 공병은 영구 구조물을 위해 국경을 측량하며, 방어 교리가 군 전체에 뿌리내려 첫 발이 발사되기도 전에 보병을 단련하고 요새화 속도를 높입니다."
 SIA_shorad_defense: "단거리 대공 방어"
 SIA_shorad_defense_desc: "단거리 미사일, 레이더 연동 대공포, 강화된 대공 진지가 하나의 중첩된 방패로 엮입니다. 태국 하늘로 들어오는 적 항공기는 모든 접근로가 이미 사거리 안에 있고 모든 포대가 응사할 준비가 되어 있음을 알게 됩니다."
 SIA_border_fortification_program: "국경 요새화 계획"
 SIA_border_fortification_program_desc: "공병대에 상설 권한과 상설 예산이 주어집니다. 길고 병력이 얇게 배치된 라오스 국경을 포함한 전 국경선을 따라 측량하고, 타설하고, 진지를 구축하여 필요한 곳 어디서든 새 구조물이 더 빨리 올라서고 참호를 판 부대가 더 굳건히 버티게 합니다."
 SIA_anti_amphibious_command: "대상륙 사령부"
 SIA_anti_amphibious_command_desc: "전담 사령부가 침략자가 이용할 수 있는 모든 해변과 하구를 연구합니다. 해안 포대, 중층 센서, 훈련된 대응 병력은 왕국의 해안에 대한 상륙을 피투성이의 불확실한 도박으로 만듭니다."
 SIA_defend_myanmar_border: "미얀마 국경 요새화"
 SIA_defend_myanmar_border_desc: "미얀마와 맞닿은 험준한 서부 접경은 왕국의 종단을 따라 이어집니다. 고갯길과 강 계곡마다 벙커선과 준비된 진지를 구축하여 험한 지형을 장벽으로 바꿉니다."
 SIA_defend_cambodia_border: "캄보디아 국경 요새화"
 SIA_defend_cambodia_border_desc: "쁘레아 위히어 사원 충돌의 기억은 여전히 생생합니다. 동부 국경에 새 구조물을 보강하여 앞으로 어떤 분쟁이 닥치더라도 왕국의 병사들이 노출된 채 서 있지 않도록 합니다."
 SIA_defend_malaysia_border: "말레이시아 국경 요새화"
 SIA_defend_malaysia_border_desc: "불안한 최남단 지역에 벙커와 거점이 촘촘히 깔려 말레이시아와의 국경을 지탱하고, 빠따니의 수비대에 후퇴할 수 있는 단단한 지반을 제공합니다."
 SIA_fortress_thailand: "요새 태국"
 SIA_fortress_thailand_desc: "모든 국경에 방벽이 쳐지고 모든 접근로가 사거리 안에 들어옵니다. 본토에서 싸우는 태국군 부대는 지형을 아는 방어자의 자신감으로 공격하고 버팁니다. 침략자는 더위와 구릉, 끝없이 이어진 준비된 방어선 속에서 서서히 피를 흘립니다."
 SIA_defend_myanmar_border_tt: "국경 지역 §Y9§!곳에 §Y2레벨§! 육상 요새를 즉시 건설합니다.\n - §Y북부 태국§!: 4개 지역\n - §Y중부 태국§!: 2개 지역\n - §Y남부 태국§!: 3개 지역"
 SIA_defend_cambodia_border_tt: "국경 지역 §Y6§!곳에 §Y2레벨§! 육상 요새를 즉시 건설합니다.\n - §Y중부 태국§!: 3개 지역\n - §Y이산§!: 3개 지역"
 SIA_defend_malaysia_border_tt: "국경 지역 §Y5§!곳에 §Y2레벨§! 육상 요새를 즉시 건설합니다.\n - §Y빠따니§!: 4개 지역\n - §Y남부 태국§!: 1개 지역"
 SIA_sovereign_wealth_fund_allocation: "국부펀드 자금 배분"
 SIA_sovereign_wealth_fund_allocation_desc: "자원 사용료 수입 중 또 한 번의 몫을 국부펀드의 해외 포트폴리오로 돌립니다. 이 배분은 1년간 자본을 묶어 두며, 그 이후에야 수익이 예산으로 환류하기 시작합니다."
 SIA_state_resource_stake: "국가 자원 지분 확보"
 SIA_state_resource_stake_desc: "재무부가 광업 및 에너지 채굴권에 세금을 매기는 데 그치지 않고 직접 지분을 사들입니다. 현금은 빠르게 들어오지만, 아무도 너무 자세히 들여다보고 싶어 하지 않는 서류 작업도 함께 들어옵니다."
 thailand.436.t: "중진국 함정 탈출"
 thailand.436.d: "통계 담당자들이 확인했습니다. 태국은 한 세대에 걸쳐 수많은 이웃 나라를 붙잡아 온 소득 문턱을 넘어섰습니다. 한때 남을 위해 부품을 조립하던 공장들이 이제는 그것을 직접 설계합니다. 내각의 문제는 이 순간을 어떻게 활용할 것인가입니다."
 thailand.436.a: "성과를 대대적으로 알린다"
 thailand.436.b: "배당금을 비축한다"
 SIA_the_army_question: "군의 문제"
 SIA_the_army_question_desc: "병사 몇백 명마다 장군 한 명, 실적보다 기수와 파벌로 돌아가는 승진, 그리고 국방과 무관한 사업체들 때문에 부풀어 오른 임금 부담. 왕국의 군대는 돌아가기는 하지만, 군인 노릇을 하는 쪽은 아닙니다. 이 군대를 어떤 군대로 만들 것인지 누군가는 결정해야 합니다."
 SIA_the_professional_turn: "전문화로의 전환"
 SIA_the_professional_turn_desc: "더 적은 병력, 더 나은 훈련, 인사 명단이 아닌 실적에 대한 책임. 더 험난한 길이며, 지켜야 할 사업체를 가진 모든 장군에게 경고를 보내는 일입니다."
 SIA_the_reshuffle_list: "인사 명단은 전쟁 계획이 아니다"
 SIA_the_reshuffle_list_desc: "연례 인사 이동은 태국군의 진정한 운영 리듬이며, 이제 병영 내부의 셈법이 아닌 민간 장관의 서명 아래로 들어옵니다. 지휘부는 그때그때의 정부에 응답하기 시작합니다."
 SIA_retire_the_experts: "전문가 예우직 정리"
 SIA_retire_the_experts_desc: "고위 과정 수료자 모두에게 직무가 실제로 하는 일이 있든 없든 정원 외 '전문가' 또는 '전문 인력' 장성 보직이 돌아가야 합니다. 명예 장성들을 퇴직금으로 내보내고 그 뒤의 보직을 폐지하십시오."
 SIA_close_the_ledger: "장부 정리"
 SIA_close_the_ledger_desc: "군 소유 텔레비전 채널, 골프장, 토지, 그리고 병사들의 무급 노동으로 운영되던 복지 사업이 민간 행정으로 이관됩니다. 병영 생활은 작아지고, 예산은 투명해집니다."
 SIA_break_the_class_ladder: "기수 사다리 타파"
 SIA_break_the_class_ladder_desc: "사관 후보생 기수와 부대 파벌, 곧 웡테완 대 부라파 파약에 따른 승진이 실적 기반 승진으로 대체됩니다. 다음 지휘관을 정하는 구 인맥의 영향력이 줄어듭니다."
 SIA_all_volunteer_force: "지원병 전군"
 SIA_all_volunteer_force_desc: "오직 스스로 군을 택한 이들로 구성된 군대입니다. 더 나은 훈련과 더 나은 편성을 갖추었고, 그에 드는 비용만큼 보수를 받습니다. 전반적으로 유능한 군대이지만, 국고는 영구히 이 고정 임금을 감당해야 합니다."
 SIA_the_elite_spearhead: "정예 선봉"
 SIA_the_elite_spearhead_desc: "군 전체를 전문화하는 대신 투자를 집중합니다. 값비싸게 장비하고 값비싸게 유지하는 소규모 특수부대의 첨단이, 그 뒤의 병력 규모를 훨씬 뛰어넘는 타격력을 내도록 만들어집니다."
 SIA_high_readiness_army: "고도 대비 태세 군대"
 SIA_high_readiness_army_desc: "상비 부대를 전시 태세로 유지합니다. 훈련하고, 계획하고, 접촉 전에 미리 정찰합니다. 이런 대비 태세는 유지에 비용이 들지 않는 법이 없지만, 전장에 나타나는 군대가 약속된 그대로의 군대임을 뜻합니다."
 SIA_the_minister_decides: "위원회는 자문하고, 장관이 결정한다"
 SIA_the_minister_decides_desc: "최고 사령부 위원회는 회의 테이블의 자리를 유지하지만, 결정은 민간 장관의 몫이고 집행은 장군들의 몫입니다. 구세력이 가장 격렬하게 저항하는 개혁이자, 다른 모든 개혁을 정착시키는 개혁입니다."
 SIA_the_conscript_host: "징집병 대군"
 SIA_the_conscript_host_desc: "정교함보다 숫자입니다. 더 넓은 징병으로 값싸게 병력을 채우고, 국고는 부풀어 오른 전문직 임금 부담에 더는 출혈하지 않으며, 장교단은 이미 누리던 모든 특권을 지킵니다."
 SIA_fill_the_quota: "할당량 채우기"
 SIA_fill_the_quota_desc: "연례 징병 추첨이 적격자 풀을 더 깊이 파고듭니다. 더 많은 이름이 뽑힐수록 더 많은 군화가 채워지고, 군복을 입기 위해 넘어야 할 문턱은 낮아집니다."
 SIA_the_boys_in_black: "검은 옷의 사내들, 돌아오다"
 SIA_the_boys_in_black_desc: "자원 국경 순찰대인 타한 프란의 병력이 두 배로 늘어납니다. 낮은 보수로 현지에서 모집된 이들은 국경 마을을 지키고, 어떤 정규 부대보다도 잘 아는 땅에서 침략자에게 출혈을 강요합니다."
 SIA_or_sor_grid: "모든 탐본에 오 서"
 SIA_or_sor_grid_desc: "마을 방위 지원대는 오 서라 불리며 시골 전역의 각 탐본(면)마다 편성됩니다. 자기 집을 지키는 이들이므로 보급선이 필요 없는 민병대 망입니다."
 SIA_cheap_steel_many_hulls: "값싼 강철, 많은 선체"
 SIA_cheap_steel_many_hulls_desc: "해외 카탈로그가 아닌 태국 공장에서 대중을 무장시킵니다. 장비는 더 단순하고 성능은 무디지만, 병기 공장들이 빠르고 싸게 찍어 냅니다."
 SIA_the_barracks_economy: "병영 경제"
 SIA_the_barracks_economy_desc: "장군들의 사업체와 싸우는 대신 그들이 동원 비용을 대도록 합니다. 채널, 골프장, 나머지 사업 포트폴리오가 전쟁 자금에 장부를 공개하며, 당장은 돈이 되지만 부패는 영구히 남습니다."
 SIA_reserve_of_the_realm: "왕국의 예비대"
 SIA_reserve_of_the_realm_desc: "군복을 입었던 모든 사내가 등록되고, 추적되며, 소집될 준비를 갖춥니다. 예비군 명부가 늘어나고 소집이 더 빨라지지만, 이를 감당하기 위해 훈련 체계가 더 얇게 늘어나는 대가를 치릅니다."
 SIA_the_old_guard_endures: "잠들지 않는 사령부"
 SIA_the_old_guard_endures_desc: "대규모 군대가 영구화되고, 임금 부담은 마침내 국고가 감당할 수 있는 수준으로 돌아오며, 그와 함께 장교단의 중추가 확보됩니다. 문민 통제는 영영 논외가 됩니다. 구세력은 그저 분수에 맞게 사는 법을 배웠을 뿐입니다."
 SIA_swf_windfall: "국부펀드 횡재"
 SIA_swf_windfall_desc: "올해의 배분금이 지급되고 있습니다. 수익은 포지션이 청산될 때까지 예산을 완충해 줍니다."
