 legacy_of_yitzhak_rabin: "O Legado de Yitzhak Rabin"
 legacy_of_yitzhak_rabin_desc: "Em 4 de novembro de 1995, o extremista de extrema-direita Yigal Amir assassinou o Primeiro-Ministro israelense Yitzhak Rabin durante um comício em Tel Aviv para impedir o avanço de suas negociações de paz com os palestinos. Desde então, a violência política e as ações contra as decisões de um governo eleito tornaram-se um tabu na sociedade israelense, à medida que a geração que viu sua morte na televisão ainda adolescente e depositou flores e velas na Praça Rabin agora ganha voz na política eleitoral.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se concluirmos o foco §Y$ISR_rz_path$§!, §Y$ISR_bibism$§! ou §Y$ISR_ben_gvir_path$§!."
 eddaic_ghost_1: "Fantasma Edda - §tO Terceiro Desejo...§!"
 eddaic_ghost_1_desc: "O Fantasma realizou seu terceiro desejo. §R'Faça um irmão erguer a mão contra seu irmão, e que travem guerra'§!, disse ele. \n\nEmbora Israel tenha sido fundado por judeus asquenazes, os de origem europeia, a guerra contra as nações árabes levou quase um milhão de judeus do Norte da África e do Oriente Médio, chamados de sefarditas, para Israel. Os governos trabalhistas tentaram assimilar os sefarditas à cultura asquenaze como um 'caldeirão de fusão', jogando-os em cidades suburbanas subdesenvolvidas com poucos subsídios governamentais e desprezando sua origem cultural. Mesmo que os sefarditas sejam hoje a maioria dos judeus em Israel, eles ainda são muito sub-representados no aparato estatal, o que gera ressentimento e tensões sectárias.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se concluirmos focos que abordem as queixas sefarditas, como §Y$ISR_regret_our_past_sephardics$§!, §Y$ISR_yemenite_affair$§! ou §Y$ISR_sephardic_cultural_heritage$§!, e §RPiorará§! se concluirmos focos como §Y$ISR_forgot_to_be_jews$§! ou §Y$ISR_empower_city_rabbis$§!. Será §RRemovido§! assim que tiver melhorado além de seu estágio final."
 eddaic_ghost_2: "Fantasma Edda - §OO Segundo Desejo...§!"
 eddaic_ghost_2_desc: "The Ghost has taken its second wish wish. §R'Make a man hate his brother, and let them suffer discourse'§! he said. \n\nWhile Israel has been founded by Ashkenazi Jews - Those of European Origin - the war against the Arab nations led to almost a million Jews from North Africa and the Middle East, who are referred to as Sephardics, to Israel. The Labor Governments attempted to assimilate the Sephardics to Ashkenazi culture as a 'melting pod', throwing them in undeveloped suburban towns with little government subsidies, and looking down on their cultural background. Even as Sephardics are the majority of Jews in Israel today, they are still heavily unrepresented in the state apparatus, leading to resentment and secterian tensions.\n§W--------------§!\nThis national spirit will §GImprove§! if we complete focuses that address Sephardic grievances, such as §Y$ISR_regret_our_past_sephardics$§!, §Y$ISR_yemenite_affair$§! or §Y$ISR_sephardic_cultural_heritage$§!, and will §RWorsen§! if we complete focuses such as §Y$ISR_forgot_to_be_jews$§! or §Y$ISR_empower_city_rabbis$§!. It will be §RRemoved§! once it has improved past its final stage."
 eddaic_ghost_3: "Fantasma Edda - §9O Primeiro Desejo...§!"
 eddaic_ghost_3_desc: "O Fantasma realizou seu primeiro desejo. §R'Faça um homem não confiar em ninguém além de si mesmo, e que se aproximem uns dos outros'§!, disse ele. \n\nEmbora Israel tenha sido fundado por judeus asquenazes, os de origem europeia, a guerra contra as nações árabes levou quase um milhão de judeus do Norte da África e do Oriente Médio, chamados de sefarditas, para Israel. Os governos trabalhistas tentaram assimilar os sefarditas à cultura asquenaze como um 'caldeirão de fusão', jogando-os em cidades suburbanas subdesenvolvidas com poucos subsídios governamentais e desprezando sua origem cultural. Mesmo que os sefarditas sejam hoje a maioria dos judeus em Israel, eles ainda são muito sub-representados no aparato estatal, o que gera ressentimento e tensões sectárias.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se concluirmos focos que abordem as queixas sefarditas, como §Y$ISR_regret_our_past_sephardics$§!, §Y$ISR_yemenite_affair$§! ou §Y$ISR_sephardic_cultural_heritage$§!, e §RPiorará§! se concluirmos focos como §Y$ISR_forgot_to_be_jews$§! ou §Y$ISR_empower_city_rabbis$§!. Será §RRemovido§! assim que tiver melhorado além de seu estágio final."
 eddaic_ghost_4: "Fantasma Edda - §HEscondido no Armário...§!"
 eddaic_ghost_4_desc: "O Fantasma se escondeu no armário, debaixo da cama, §Rmas ainda aterroriza os medos de muitos...§! \n\nEmbora Israel tenha sido fundado por judeus asquenazes, os de origem europeia, a guerra contra as nações árabes levou quase um milhão de judeus do Norte da África e do Oriente Médio, chamados de sefarditas, para Israel. Os governos trabalhistas tentaram assimilar os sefarditas à cultura asquenaze como um 'caldeirão de fusão', jogando-os em cidades suburbanas subdesenvolvidas com poucos subsídios governamentais e desprezando sua origem cultural. Mesmo que os sefarditas sejam hoje a maioria dos judeus em Israel, eles ainda são muito sub-representados no aparato estatal, o que gera ressentimento e tensões sectárias.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se concluirmos focos que abordem as queixas sefarditas, como §Y$ISR_regret_our_past_sephardics$§!, §Y$ISR_yemenite_affair$§! ou §Y$ISR_sephardic_cultural_heritage$§!, e §RPiorará§! se concluirmos focos como §Y$ISR_forgot_to_be_jews$§! ou §Y$ISR_empower_city_rabbis$§!. Será §RRemovido§! assim que tiver melhorado além de seu estágio final."
 eddaic_ghost_5: "Fantasma Edda - §6De Volta à Garrafa...§!"
 eddaic_ghost_5_desc: "O Fantasma finalmente foi colocado de volta na garrafa, mas a garrafa ainda está no cômodo. §RLá ele aguarda, até o momento de ser libertado novamente.§! \n\nEmbora Israel tenha sido fundado por judeus asquenazes, os de origem europeia, a guerra contra as nações árabes levou quase um milhão de judeus do Norte da África e do Oriente Médio, chamados de sefarditas, para Israel. Os governos trabalhistas tentaram assimilar os sefarditas à cultura asquenaze como um 'caldeirão de fusão', jogando-os em cidades suburbanas subdesenvolvidas com poucos subsídios governamentais e desprezando sua origem cultural. Mesmo que os sefarditas sejam hoje a maioria dos judeus em Israel, eles ainda são muito sub-representados no aparato estatal, o que gera ressentimento e tensões sectárias.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se concluirmos focos que abordem as queixas sefarditas, como §Y$ISR_regret_our_past_sephardics$§!, §Y$ISR_yemenite_affair$§! ou §Y$ISR_sephardic_cultural_heritage$§!, e §RPiorará§! se concluirmos focos como §Y$ISR_forgot_to_be_jews$§! ou §Y$ISR_empower_city_rabbis$§!. Será §RRemovido§! assim que tiver melhorado além de seu estágio final."
 eddaic_ghost_6: "Fantasma Edda - §7Lançado ao Mar...§!"
 eddaic_ghost_6_desc: "A Garrafa do Fantasma agora foi lançada na água, vagando pelo Rio Jordão, §Raguardando que alguém a pegue e o liberte novamente...§! \n\nEmbora Israel tenha sido fundado por judeus asquenazes, os de origem europeia, a guerra contra as nações árabes levou quase um milhão de judeus do Norte da África e do Oriente Médio, chamados de sefarditas, para Israel. Os governos trabalhistas tentaram assimilar os sefarditas à cultura asquenaze como um 'caldeirão de fusão', jogando-os em cidades suburbanas subdesenvolvidas com poucos subsídios governamentais e desprezando sua origem cultural. Mesmo que os sefarditas sejam hoje a maioria dos judeus em Israel, eles ainda são muito sub-representados no aparato estatal, o que gera ressentimento e tensões sectárias.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se concluirmos focos que abordem as queixas sefarditas, como §Y$ISR_regret_our_past_sephardics$§!, §Y$ISR_yemenite_affair$§! ou §Y$ISR_sephardic_cultural_heritage$§!, e §RPiorará§! se concluirmos focos como §Y$ISR_forgot_to_be_jews$§! ou §Y$ISR_empower_city_rabbis$§!. Será §RRemovido§! pelo próximo foco que o melhorar."
 peoples_army_1: "O Exército do Povo - §tAbandonado§!"
 peoples_army_1_desc: "O Modelo do Exército do Povo é um conceito iniciado por David Ben-Gurion, Pai Fundador e Primeiro Primeiro-Ministro de Israel, que via as Forças de Defesa de Israel como uma ferramenta para seu projeto de 'Caldeirão de Fusão', de assimilar todos os subgrupos judaicos a uma única identidade israelense. Os adeptos dessa corrente veem as IDF como tendo um papel maior na sociedade israelense do que simplesmente defender o país e, por isso, veem o conceito de serviço militar obrigatório como pilar não apenas da existência israelense, mas também da democracia e da sociedade israelenses. Assim, qualquer debate sobre migrar para um exército profissional foi um grande tabu em Israel por décadas, mas o debate sobre as isenções de serviço militar dos ultraortodoxos levantou questões para muitos israelenses comuns sobre o seu próprio recrutamento. O muro que impedia esse debate está caindo, e o governo e o estado-maior terão de lidar com a questão. \n\nQuanto mais §tnos afastarmos do Exército do Povo§!, mais ganharemos experiência do exército e poder de comando, e pesquisa mais barata de doutrina terrestre e organização de divisões. Quanto mais §6nos aproximarmos do Exército do Povo§!, mais ganharemos poder político, apoio à guerra, moral do exército e população recrutável."
