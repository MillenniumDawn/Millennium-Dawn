 GRN_national_decisions: "Национальные решения Гренландии"
 GRN_national_decisions_desc: "На острове Гренландия царит одновременно спокойная и напряженная обстановка. Помимо попыток политических лидеров сделать все возможное для развития острова и его населения, острову приходится сталкиваться с постоянно насущной проблемой обретения независимости. Некоторые хотят ее сейчас, другие предпочитают подождать, пока ситуация стабилизируется. В любом случае, от Гренландии и Дании будет зависеть, действительно ли остров станет свободным в конечном итоге."
 GRN_decision_independence_war: "Война за независимость"
 GRN_decision_independence_war_desc: "Время пришло, и политики вынудили народ пойти на уступки. Объявлена ​​война, и теперь начинается гонка: сможет ли Дания удержать свою корону или же она перейдет под контроль государства под давлением общественности, которое вынудит все стороны к миру."
 GRN_decision_capital_city_expansion: "Расширение столицы"
 GRN_decision_capital_city_expansion_desc: "В связи с тем, что население нашей страны выросло в масштабах, которые мы никогда по-настоящему не предвидели, нам потребуется модернизировать столицу Нуук, чтобы она лучше отражала и интегрировала общий региональный и национальный рост."
 GRN_decision_development_visa_grants: "Гранты на визы для развития"
 GRN_decision_development_visa_grants_desc: "Главная проблема развития нашей страны — это, прежде всего, нехватка человеческих ресурсов. Для достижения каких-либо результатов нам необходимо вкладывать значительные средства в привлечение иностранных рабочих, готовых мириться скорее с условиями труда, чем с потенциально щедрыми денежными выплатами и возможностями трудоустройства, которые мы могли бы им предоставить."
 GRN_decision_global_recruitment_efforts: "Глобальные усилия по подбору персонала"
 GRN_decision_global_recruitment_efforts_desc: "Теперь, когда национальная оборона находится под нашим непосредственным контролем, мы сталкиваемся с той же проблемой, что и в целом в стране: нехваткой людских ресурсов. Нам, по сути, нужно будет сделать нечто подобное программе грантов на развитие, но для армии. Надеюсь, по мере укрепления нашей экономики и повышения гибкости бюджета, позволяющей покрывать подобные расходы, мы сможем значительно стимулировать наемников или скитальцев без постоянного места жительства выбирать наш дом в качестве своего последнего пристанища."
 GRN_decision_naval_priority_act: "Закон о приоритетах военно-морского флота"
 GRN_decision_naval_priority_act_desc: "Для того чтобы иметь хоть какое-то присутствие в регионе, расположенном к нам в непосредственной близости, нам необходим военно-морской флот. Проблема в том, что у нас нет экономических возможностей для его постоянного строительства, так сказать. Поэтому нам нужно, по сути, шанхайски построить как можно больше корабельных комплексов и предприятий в непосредственной близости друг от друга, чтобы быстро создать базовый флот. Это будет чрезвычайно дорого, но и сидеть сложа руки, просто ожидая, пока что-то произойдет в нашу пользу, тоже будет дорого."
 GRN_decision_project_vortex: "Проект Вихрь"
 GRN_decision_project_vortex_desc: "Обеспечение морского прохода на крайнем севере вызывает опасения из-за возможности достижения нами военно-морского превосходства в стратегически важных регионах. Поэтому для решения этой проблемы мы организуем максимально эффективную демонстрацию военно-морской силы, используя имеющиеся у нас средства."
 GRN_decision_national_commission: "Национальная комиссия"
 GRN_decision_national_commission_desc: "После завершения процесса проектирования и признания прототипов удовлетворительными мы организуем национальную комиссию для оказания помощи в строительстве нашего первого линкора."
 GRN_decision_project_northern_projection: "Проект «Северная проекция»"
 GRN_decision_project_northern_projection_desc: "При стабильной ситуации и готовности к реализации истинных амбиций нашей страны нам потребуется контролировать множество морских зон. В этом нам поможет сотрудничество с кораблестроителями по всей стране для создания 2-й арктической боевой группы."
 GRN_southern_interior_development_decisions: "Проекты развития южной части внутренней территории США"
 GRN_southern_interior_development_decisions_desc: "Благодаря экономическим и социальным стабилизациям в нашей стране, достигнутым за счет демографических инициатив, мы теперь можем обратить внимание на внутренние районы страны. Южное плато станет первым важным шагом на пути к освоению Большого ледникового шельфа."
 GRN_decision_fort_vortex: "Форт Вихрь"
 GRN_decision_fort_vortex_desc: "Наше путешествие во внутренние районы юга начнется с основания города-крепости под названием Форт Вортекс."
 GRN_decision_glacial_shine: "Ледниковый блеск"
 GRN_decision_glacial_shine_desc: "Наш следующий по центру населенный пункт получит название «Ледниковое сияние» (Glacial Shine)."
 GRN_decision_frostbury: "Фростбери"
 GRN_decision_frostbury_desc: "Мы основаем поселение Фростбери к востоку от столицы нашей страны."
 GRN_decision_fort_seal: "Форт Сил"
 GRN_decision_fort_seal_desc: "Мы создадим стратегически важное центрально-восточное укрепление вдоль границы южной части внутренних районов и центрального плато."
 GRN_decision_southern_interior_basic_roads: "Основные дорожные работы в южной части внутренней территории США"
 GRN_decision_southern_interior_basic_roads_desc: "После полного обустройства наших поселений мы можем с уверенностью создать базовую систему наземного транспорта для связи и удовлетворения потребностей этих новых оплотов цивилизации."
 GRN_decision_southern_interior_improved_roads: "Улучшенные дороги в южной части внутренней территории США"
 GRN_decision_southern_interior_improved_roads_desc: "Постоянные инвестиции в дорожную сеть позволят увеличить объем транспортного потока, а также внедрить надлежащие и более надежные меры безопасности при движении по таким протяженным и опасным участкам дороги."
 GRN_decision_great_polar_railway: "Великая Полярная железная дорога"
 GRN_decision_great_polar_railway_desc: "Создание отлаженной и эффективной железнодорожной сети позволит нам доставлять людей и материалы в больших объемах. Это даст нам возможность, наконец, в полной мере приступить к построению экономики региона с нуля."
 GRN_decision_basic_industrial_jobs: "Основные промышленные рабочие места"
 GRN_decision_basic_industrial_jobs_desc: "Обеспечение базовой формы экономической деятельности позволяет нам более напрямую финансировать развитие внутренних районов и, по возможности, расширяться в другие сектора экономики."
 GRN_decision_local_food_supply: "Местное снабжение продуктами питания"
 GRN_decision_local_food_supply_desc: "Стратегическое развитие суровых сельскохозяйственных предприятий позволяет нам создавать местные запасы продовольствия для поселений, и таким образом мы не только используем больше замерзшей воды, но и можем способствовать развитию местного населения в этих детских населенных пунктах. Суровые сельскохозяйственные предприятия станут тем самым копьем, которое пробьет ледяной покров, которым является шельф."
 GRN_decision_extensive_geological_surveying: "Обширные геологические изыскания"
 GRN_decision_extensive_geological_surveying_desc: "Учитывая обширность внутренних районов, нам потребуется вложить значительные средства в эти стратегические операции, а также создать специализированные суровые сельскохозяйственные угодья, предназначенные для выращивания каучуконосных растений. Результаты должны оказаться чрезвычайно плодотворными, учитывая время и капитал, которые мы вкладываем во все это."
 GRN_decision_creating_dedicated_mining_operations: "Создание специализированных горнодобывающих предприятий"
 GRN_decision_creating_dedicated_mining_operations_desc: "В связи с обнаружением редких и малоизученных месторождений различных минеральных ресурсов мы также начали расширять фундаментные работы по созданию новых месторождений высокоэнергетических флюидов для производства каучука. Продолжение этих инициатив, безусловно, пойдет на пользу нашему делу."
 GRN_decision_regional_economic_sector_synergy: "Синергия регионального экономического сектора"
 GRN_decision_regional_economic_sector_synergy_desc: "Благодаря масштабным и значительным инвестициям в рабочую силу, ресурсы и финансовое финансирование мы сможем расширить горнодобывающую деятельность до такой степени, что сможем создать местную экономическую диверсификацию. Довольно скоро мы сможем создать региональную синергию, подобную той, что существует в остальной части национальной экономики."
 GRN_central_plateau_development_decisions: "Проекты развития Центрального плато"
 GRN_central_plateau_development_decisions_desc: "Благодаря экономической и социальной синергии в южной части страны мы можем начать закладывать основы для того же самого здесь, на Центральном плато. Все это потребует значительных затрат, но в долгосрочной перспективе это, безусловно, окупится."
 GRN_decision_fort_frostfields: "Форт Фростфилдс"
 GRN_decision_fort_frostfields_desc: "Мы создадим поселение-крепость под названием Форт Фростфилдс в западной части, недалеко от города Сисимуит."
 GRN_decision_frigidville: "Фригидвиль"
 GRN_decision_frigidville_desc: "Двигаясь на восток, мы создадим поселение Фригидвиль. У кого-нибудь ещё заканчиваются названия, соответствующие тематике?"
 GRN_decision_aurora: "Аврора"
 GRN_decision_aurora_desc: "В самой центральной части плато, я думаю, мы создадим подходящее поселение Аврора."
 GRN_decision_snowdenson: "Сноуденсон"
 GRN_decision_snowdenson_desc: "Двигаясь на юг, мы создадим поселение Сноуденсон, чтобы заполнить пробел между Глейшиал-Шайн и Авророй и обеспечить межрегиональную экономическую активность."
 GRN_decision_blizzards_peak: "Пик Метели"
 GRN_decision_blizzards_peak_desc: "Двигаясь обратно на север и продолжая движение на восток, мы создадим поселение Близзардс-Пик, поскольку некоторые из самых высоких точек находятся в этом районе."
 GRN_decision_crystal_flake: "Кристаллическая хлопья"
 GRN_decision_crystal_flake_desc: "Двигаясь дальше на восток и достигнув второго ближайшего к восточному побережью места, мы создадим поселение Кристал Флейк."
 GRN_decision_snowberry: "Снежная ягода"
 GRN_decision_snowberry_desc: "Расположившись на северо-восточной границе между плато и восточными прибрежными районами, мы создадим живописный городок Сноуберри."
 GRN_decision_plateau_interior_basic_roads: "Базовая дорожная сеть Центрального плато"
 GRN_decision_plateau_interior_basic_roads_desc: "После создания поселений мы можем приступить к закладке основных фундаментов дорожной сети по всему плато. Эта фундаментная работа поможет сделать передвижение более плавным и прямым, чем простое преодоление опасного рельефа."
 GRN_decision_plateau_interior_improved_roads: "Улучшение дорожной инфраструктуры на Центральном плато."
 GRN_decision_plateau_interior_improved_roads_desc: "После завершения основных работ мы можем перейти к инвестированию в стандартизацию мер безопасности, а также в другие необходимые объекты для передвижения по обширной территории."
 GRN_decision_central_arctic_railroad: "Центральная Арктическая железная дорога"
 GRN_decision_central_arctic_railroad_desc: "Разветвляясь от георадара в южной части внутренних районов, а также от прибрежной железнодорожной сети, мы теперь можем укрепить основные магистральные перевозки по всей стране. Таким образом, на плато будет расположена Центрально-арктическая железная дорога (CARR)."
 GRN_decision_basic_industrial_jobs_two: "Базовый рынок труда в промышленности"
 GRN_decision_basic_industrial_jobs_two_desc: "Благодаря созданной инфраструктуре и набранному персоналу мы можем приступить к разработке той или иной формы экономической деятельности на Центральном плато."
 GRN_decision_local_food_supply_two: "Создание системы местного снабжения продуктами питания"
 GRN_decision_local_food_supply_two_desc: "Используя модели HFF, которые мы применяем по всей стране, мы можем создавать специализированные предприятия, чтобы снизить нагрузку на формирование местных цепочек поставок продуктов питания."
 GRN_decision_extensive_geological_surveying_two: "Центральное плато: масштабные геологические исследования"
 GRN_decision_extensive_geological_surveying_two_desc: "Люди, места, инфраструктура, рабочие места и еда. Все в безопасности и готово к тому, чтобы проложить себе путь глубоко под лед и земли, погребенные под самим временем."
 GRN_decision_creating_dedicated_mining_operations_two: "Центральное плато: Специализированные горнодобывающие работы"
 GRN_decision_creating_dedicated_mining_operations_two_desc: "Имея на руках данные топографической съемки, а также проведя первоначальную разведку месторождений, мы можем начать расширение и создание новых специализированных шахт и соответствующего оперативного оборудования."
 GRN_decision_regional_economic_sector_synergy_two: "Центральное плато: межэкономическая синергия"
 GRN_decision_regional_economic_sector_synergy_two_desc: "Впереди нас ждет самый длинный и дорогостоящий отрезок пути. Но, любуясь сверкающими ледяными пейзажами обширного центрального плато, мы можем в полной мере насладиться всем этим и испытать истинное блаженство от того, что наконец-то добрались до места. Ведь Гренландия – это поистине страна чудовищ."
 GRN_faction_polar_defense_league: "Лига защиты Полярного региона"
 greenland_event.1.t: "Референдум о самоуправлении"
 greenland_event.1.d: "Вскоре парламент проголосует за расширение положений, установленных Законом о самоуправлении 1979 года. В случае положительного решения, такие сферы, как образование, здравоохранение, судебная система, а также полный контроль над береговой охраной, перейдут под полный контроль правительства Гренландии."
 greenland_event.1.o1: "Парламент одобрил закон о самоуправлении."
 greenland_event.1.o2: "Парламент сохраняет статус-кво"
 greenland_event.2.t: "Закон о самоуправлении Гренландии"
 greenland_event.2.d: "Гренландия проголосовала за расширение своих прав в соответствии с Законом о самоуправлении 1979 года и замену его Законом о самоуправлении 2008 года. Этот закон предоставляет ей контроль над несколькими государственными органами, а также над береговой охраной. Мы можем одобрить это решение, поскольку было большинство голосов, или же заблокировать его, сославшись на то, что финансы страны не позволят ей самостоятельно функционировать во всех этих системах без увеличения предоставляемых нами колониальных субсидий."
 greenland_event.2.o1: "Одобрить голосование"
 greenland_event.2.o2: "Отказать в праве голоса"
 greenland_event.300.t: "Дания одобрила результаты голосования."
 greenland_event.300.d: "Сегодня утром мы получили известие о том, что датский парламент, как и ожидалось, одобрил наш голос по новому закону о самоуправлении. Это станет большим шагом вперед к нашей независимости и, следовательно, к будущему, которое мы сможем определить сами."
 greenland_event.300.o1: "Подождите, они могут это отрицать?"
 greenland_event.3.t: "Дания блокирует голосование"
 greenland_event.3.d: "Датский парламент счел нужным отказать нам в голосовании по расширению действия Закона о самоуправлении с помощью нового Закона о самоуправлении. Они ссылаются на якобы финансовые опасения, утверждая, что наше принятие контроля потребует увеличения датских субсидий. Мы могли бы объявить независимость, что вызвало бы местный конфликт, или же мы могли бы смириться с ситуацией и подготовиться к потенциально худшим последствиям в будущем."
 greenland_event.3.o1: "Бой. С какой армией?"
 greenland_event.3.o2: "За свободное правление Гренландии!!!"
 greenland_event.4.t: "Война объявлена!"
 greenland_event.4.d: "После блокирования голосования по Закону о самоуправлении Гренландии правительство Гренландии взяло на себя задачу добиться независимости. В связи с этим мы должны обеспечить сохранность всех коронных владений и вновь установить контроль над всеми морскими территориями."
 greenland_event.4.o1: "От Фарерских островов до Гренландии"
 greenland_event.5.t: "Инвестиции в автоматизацию переоснащения"
 greenland_event.5.d: "Наша экономика постоянно испытывает трудности, и это происходит просто потому, что нам не хватает людей. Уровень доходов на душу населения настолько нестабилен, что бухгалтеры порой даже не хотят вести нашу бухгалтерию из-за резких колебаний внутренних расходов, вызванных постоянными изменениями в нашей экономике. Поэтому нам необходим критически важный фактор стабилизации, которым в данном случае станут прямые и всеобъемлющие инвестиции в автоматизацию конкретного сектора экономики. Общее снижение потребности в рабочей силе в этом секторе, как мы надеемся, значительно уменьшит общую нестабильность экономики."
 greenland_event.5.o1: "Сельскохозяйственный сектор"
 greenland_event.5.o2: "Военно-промышленный сектор"
 greenland_event.5.o3: "Гражданский производственный сектор"
 greenland_event.5.o4: "Сектор офисных и технологических услуг"
 greenland_event.6.t: "Вопрос о добыче полезных ископаемых"
 greenland_event.6.d: "В связи с попытками расширения и запуска коммерческих горнодобывающих предприятий возникает главный вопрос: добывать полезные ископаемые, исходя из потребностей или из жадности? Добыча, исходя из потребностей, предполагает минимальные объемы добычи ресурсов, ориентированные на внутренние нужды страны. В то время как добыча, основанная на жадности, предполагает значительное расширение операций как для внутреннего, так и для внешнего спроса, за счет увеличения потребности в рабочей силе для обеспечения надлежащих производственных показателей."
 greenland_event.6.o1: "Потребности нашей нации"
 greenland_event.6.o2: "Средства оправдывают цель."
 greenland_event.7.t: "Политические амбиции"
 greenland_event.7.d: "В сложившейся ситуации наш народ одновременно воодушевлен и обеспокоен. Никогда прежде в датской коронной колонии не считалось возможным такое проявление свободы мысли. Но теперь, обретя новые свободы, мы можем обрести душевный покой и создать желаемое политическое будущее."
 greenland_event.7.o1: "Абсолютная свобода мысли"
 greenland_event.7.o2: "Новые идеи оказываются верными."
 greenland_event.7.o3: "Нейтральные умы побеждают"
 greenland_event.7.o4: "Национальная гордость способствует прогрессу"
 greenland_influence_event.1.t: "Гренландские инвестиции"
 greenland_influence_event.1.d: "Гренландия обратилась к нам с предложением помочь инвестировать в развитие нашей страны. Хотя существуют некоторые опасения относительно характера этих инвестиций, остров Гренландия, даже с учетом его развития, не представляет реальной угрозы для нашей внутренней ситуации по сравнению с остальными заинтересованными сторонами."
 greenland_influence_event.1.o1: "Бесплатные вещи — это здорово."
 greenland_influence_event.1.o2: "Спасибо, но нет, спасибо."
 greenland_influence_event.2.t: "Исландия принимает инфраструктуру"
 greenland_influence_event.2.d: "Наш первый инвестиционный проект одобрен, что позволит нам укрепить наше влияние и связи со страной."
 greenland_influence_event.2.o1: "Следующая инвестиция, пожалуйста."
 greenland_influence_event.3.t: "Гренландская энергетика"
 greenland_influence_event.3.d: "Гренландия обратилась к нам с очередным предложением об инвестициях, на этот раз в энергетический сектор. Они хотят создать ряд полезных объектов по производству электроэнергии, не отдавая предпочтение какому-либо конкретному типу генерации. Мы могли бы использовать эти бесплатные объекты для развития торговых отношений, но некоторые опасаются, что Гренландия может использовать их для подрыва нашего правительства."
 greenland_influence_event.3.o1: "Дешевая энергия — это хорошо."
 greenland_influence_event.3.o2: "Наши энергетические потребности — не ваша забота."
 greenland_influence_event.4.t: "Исландия принимает энергетические объекты"
 greenland_influence_event.4.d: "Наш второй раунд инвестиций, направленных на развитие их мощностей по производству электроэнергии, был одобрен. Остается только надеяться, что если им понадобится топливо для электростанций, работающих на ископаемом топливе, они продолжат сотрудничать с нами для укрепления отношений."
 greenland_influence_event.4.o1: "Отправьте следующую инвестицию"
 greenland_influence_event.5.t: "Инвестиции в полярную промышленность"
 greenland_influence_event.5.d: "Гренландия снова взялась за дело, на этот раз с масштабными инвестициями в наше экономическое развитие. От инвестиций в промышленный и офисный секторы мы видим, что Гренландия, возможно, начинает вкладывать в нашу страну слишком много средств. Хотя у них и так не так много денег, нам, возможно, стоит немного сбавить обороты."
 greenland_influence_event.5.o1: "Лучшая экономика? Почему бы и нет?"
 greenland_influence_event.5.o2: "Нет. Кажется, я знаю твою игру."
 greenland_influence_event.6.t: "Исландия принимает экономические инвестиции"
 greenland_influence_event.6.d: "Наш растущий инвестиционный портфель оказался очень успешным, поскольку мы нашли стратегические способы убедить правительство Исландии принять наши щедрые предложения. Теперь нам просто нужно развить этот успех."
 greenland_influence_event.6.o1: "Ещё один \"Ура!\" должен помочь."
 greenland_influence_event.7.t: "Стратегические инвестиции в ресурсы"
 greenland_influence_event.7.d: "Гренландия оказала помощь в проведении масштабных геологических исследований и обнаружила ограниченные коммерчески значимые месторождения железа, меди, никеля и других ресурсов, которые могли бы принести пользу нашей национальной экономике. Они также выразили готовность расширить нашу алюминиевую промышленность, чтобы компенсировать потенциальные потери. Нам действительно пригодились бы эти ресурсы для снижения зависимости от некоторых иностранных источников, но можем ли мы позволить себе влезть в такие долги перед нашим соседом?"
 greenland_influence_event.7.o1: "Нам крайне необходимы эти ресурсы."
 greenland_influence_event.7.o2: "Слишком рискованно, отказано."
 greenland_influence_event.8.t: "Искусство сделки"
 greenland_influence_event.8.d: "Исландия одобрила наши стратегические инвестиции в ресурсы, и таким образом мы смогли завершить весь инвестиционный раунд. С учетом этого, мы создали предпосылки для потенциального объединения в ближайшем будущем."
 greenland_influence_event.8.o1: "Стоило того"
 greenland_influence_event.10000.t: "Инвестиции отклонены"
 greenland_influence_event.10000.d: "После того, как Исландия отклонила наше предложение, у нас официально закончились дипломатические варианты. Мы постараемся подождать как можно дольше, но настало время для решающего этапа."
 greenland_influence_event.10000.o1: "Подготовка к операции «Настоящая зелень»"
 greenland_subterfuge_event.1.t: "Гранд Гренланд Инвестиционный"
 greenland_subterfuge_event.1.d: "Гренландия обратилась к нам с чрезвычайно выгодным предложением. Они готовы осуществить масштабный раунд инвестиций для развития нашей страны. Такая возможность кажется почти невероятной, но у острова, в общем-то, и так мало преимуществ. Кроме того, что Гренландия может сделать, чтобы повлиять на нас в более широком контексте?"
 greenland_subterfuge_event.1.o1: "Спасибо за вашу щедрость!"
 greenland_subterfuge_event.1.o2: "Это слишком хорошо, чтобы быть правдой. Отказано."
 greenland_subterfuge_event.2.t: "Исландия, прими нашу щедрость"
 greenland_subterfuge_event.2.d: "Поскольку правительство Исландии одобрило наши значительные инвестиции, мы теперь можем использовать эти инвестиции, чтобы нарушить мир и изменить статус-кво настолько, чтобы изолировать остров от вмешательства НАТО."
 greenland_subterfuge_event.2.o1: "Теперь мы ждём"
 greenland_subterfuge_event.3.t: "Открытие Источника"
 greenland_subterfuge_event.3.d: "Последние вспышки беспорядков и социальных дискуссий, похоже, связаны с определенными инвестициями Гренландии. Эти новые фронты вызвали некоторое беспокойство в нашем обществе, однако, если мы оставим это без внимания, в будущем нас могут ожидать серьезные проблемы. Это рискованно, но у нас есть выбор: либо бороться с продолжающимися махинациями, либо решить проблему раз и навсегда, устранив ее первопричину."
 greenland_subterfuge_event.3.o1: "У них вообще есть армия?"
 greenland_subterfuge_event.3.o2: "У нас есть НАТО, и всё будет хорошо."
 greenland_subterfuge_event.10000.t: "Инвестиции отклонены"
 greenland_subterfuge_event.10000.d: "Исландия отклонила наше лучшее предложение, и если они не примут его, нам ничего не останется, кроме как готовиться к худшему."
 greenland_subterfuge_event.10000.o1: "Подготовка к операции «Настоящая зелень»"
 greenland_subterfuge_event.4.t: "Крупные инвестиции в Гренландию"
 greenland_subterfuge_event.4.d: "Гренландия обратилась к нам с предложением. Это всеобъемлющее инвестиционное и эксклюзивное торговое соглашение. Гренландия готова развивать нашу инфраструктуру, расширять возможности зонирования, развивать гражданскую промышленную базу и, по-видимому, предоставлять эксклюзивную аренду необходимых материалов для поддержки этих инвестиций. Финальным элементом всего этого грандиозного инвестиционного пакета являются прямые крупномасштабные инвестиции в разработку и добычу известных месторождений нефти в наших водах. Это чрезвычайно выгодное предложение, и, честно говоря, мы практически не видим в нем недостатков. Но что бы мы делали с Данией, если бы были должны конкретной стране?"
 greenland_subterfuge_event.4.o1: "Давайте заключим сделку!"
 greenland_subterfuge_event.4.o2: "Нет, это неправильно."
 greenland_subterfuge_event.5.t: "Фарерские острова принимают"
 greenland_subterfuge_event.5.d: "Правительство Фарерских островов приняло наши щедрые инвестиции, и теперь мы можем начать работать над нашим будущим."
 greenland_subterfuge_event.5.o1: "Ввести подстрекателей"
 greenland_subterfuge_event.6.t: "Граждане просят правительство"
 greenland_subterfuge_event.6.d: "В последнее время события начали обостряться, поскольку все больше жителей островов умоляют правительство провести референдум о создании Западно-Нордического союза с Гренландией. Многие ссылаются на, казалось бы, благожелательный жест в виде инвестиций для благополучия островитян, в противовес датскому подходу, предполагающему минимальные меры. Под таким давлением мы вынуждены принять их требования и будем подавать петицию правительству Гренландии."
 greenland_subterfuge_event.6.o1: "Фарерские острова Вечные"
 greenland_subterfuge_event.7.t: "Гамбит приносит свои плоды"
 greenland_subterfuge_event.7.d: "Давление со стороны граждан Фарерских островов вынудило их правительство подать петицию о создании союза с нашей страной. Это сулит нам хорошие перспективы, поскольку наверняка вызовет определенное недовольство в датском правительстве."
 greenland_subterfuge_event.7.o1: "На один шаг ближе"
 greenland_subterfuge_event.8.t: "Простите, что?!"
 greenland_subterfuge_event.8.d: "Поступают сообщения о том, что вооруженные силы Гренландии каким-то образом обосновались на Фарерских островах и сотрудничают с гражданами и правительственными чиновниками для мирной передачи власти. Вопрос в том, кто дал им на это право. С нами не консультировались, и, похоже, наше общее безразличие к островам только сыграло против нас. Если мы не предпримем действий, то потеряем лицо, но если мы будем действовать быстро, то останемся одни, поскольку провоцируем прямые военные действия."
 greenland_subterfuge_event.8.o1: "Мы можем их забрать!"
 greenland_subterfuge_event.8.o2: "Кто такой Fairy?"
 greenland_subterfuge_event.40000.t: "Инвестиции отклонены"
 greenland_subterfuge_event.40000.d: "Фарерские острова отклонили наше лучшее предложение, и если они не примут его, у нас не останется другого выбора, кроме как готовиться к худшему."
 greenland_subterfuge_event.40000.o1: "Начало мобилизации"
 greenland_subterfuge_event.9.t: "Гренландские инвестиции"
 greenland_subterfuge_event.9.d: "Гренландия предложила нам ряд инвестиций, которые будут для нас совершенно бесплатными. Они хотят сосредоточиться на развитии менее развитых районов Ютландии и укреплении скандинавской солидарности. Однако некоторые в правительстве считают, что они преследуют скрытые цели, поскольку инвестиции кажутся слишком хорошими, чтобы быть правдой. С другой стороны, что Гренландия может реально нам сделать?"
 greenland_subterfuge_event.9.o1: "Бесплатные вещи — это совсем неплохо."
 greenland_subterfuge_event.9.o2: "Мне не нравятся твои смешные слова."
 greenland_subterfuge_event.10.t: "Дания принимает"
 greenland_subterfuge_event.10.d: "Датское правительство одобрило инвестиции, и теперь мы начнем подготовку к тому, что запланировали."
 greenland_subterfuge_event.10.o1: "Теперь мяч на их стороне."
 greenland_subterfuge_event.11.t: "Открытие Источника"
 greenland_subterfuge_event.11.d: "Последние вспышки беспорядков и социальных дискуссий, похоже, связаны с определенными инвестициями Гренландии. Эти новые фронты вызвали некоторое беспокойство в нашем обществе, однако, если мы оставим это без внимания, в будущем нас могут ожидать серьезные проблемы. Это рискованно, но у нас есть выбор: либо бороться с продолжающимися махинациями, либо решить проблему раз и навсегда, устранив ее первопричину."
 greenland_subterfuge_event.11.o1: "У них вообще есть армия?"
 greenland_subterfuge_event.11.o2: "У нас есть НАТО, и всё будет хорошо."
 greenland_subterfuge_event.90000.t: "Инвестиции отклонены"
 greenland_subterfuge_event.90000.d: "Дания отклонила наше лучшее предложение, и если они не примут его, нам ничего не остаётся, кроме как готовиться к худшему."
 greenland_subterfuge_event.90000.o1: "Подготовка к операции «Посредник»"
 greenland_subterfuge_event.12.t: "Гренландские инвестиции"
 greenland_subterfuge_event.12.d: "Гренландия предложила нам ряд инвестиций, которые будут для нас совершенно бесплатными. Они хотят сосредоточиться на развитии менее развитых районов Северной Норвегии и способствовать единству и процветанию скандинавских стран. Однако некоторые в правительстве считают, что они преследуют скрытые цели, поскольку инвестиции кажутся слишком хорошими, чтобы быть правдой. С другой стороны, что Гренландия может реально нам сделать?"
 greenland_subterfuge_event.12.o1: "Я могу согласиться на бесплатное"
 greenland_subterfuge_event.12.o2: "У нас всё хорошо, спасибо."
 greenland_subterfuge_event.13.t: "Норвегия принимает"
 greenland_subterfuge_event.13.d: "Норвежское правительство одобрило инвестиции, и теперь мы начнем подготовку к тому, что планируем сделать с гражданским населением, чтобы дистанцировать страну от НАТО."
 greenland_subterfuge_event.13.o1: "Давайте посмотрим, что они сделают."
 greenland_subterfuge_event.14.t: "Открытие Источника"
 greenland_subterfuge_event.14.d: "Последние вспышки беспорядков и социальных дискуссий, похоже, связаны с определенными инвестициями Гренландии. Эти новые фронты вызвали некоторое беспокойство в нашем обществе, однако, если мы оставим это без внимания, в будущем нас могут ожидать серьезные проблемы. Это рискованно, но у нас есть выбор: либо бороться с продолжающимися махинациями, либо решить проблему раз и навсегда, устранив ее первопричину."
 greenland_subterfuge_event.14.o1: "У них вообще есть армия?"
 greenland_subterfuge_event.14.o2: "У нас есть НАТО, и всё будет хорошо."
 greenland_subterfuge_event.120000.t: "Инвестиции отклонены"
 greenland_subterfuge_event.120000.d: "Норвегия отклонила наше лучшее предложение, и если они его не примут, нам ничего не останется, кроме как готовиться к худшему."
 greenland_subterfuge_event.120000.o1: "Подготовка к операции «Фьордленд»"
 greenland_subterfuge_event.15.t: "Гренландские инвестиции"
 greenland_subterfuge_event.15.d: "Гренландия предложила нам ряд инвестиций, которые не будут для нас ничего стоить. Они хотят сосредоточиться на развитии менее развитых районов вокруг города Карлстад и способствовать единству и процветанию скандинавских стран. Однако некоторые в правительстве считают, что они преследуют скрытые цели, поскольку инвестиции кажутся слишком хорошими, чтобы быть правдой. С другой стороны, что Гренландия может реально нам сделать?"
 greenland_subterfuge_event.15.o1: "Бесплатные вещи остаются бесплатными."
 greenland_subterfuge_event.15.o2: "Мы смиренно отказываемся"
 greenland_subterfuge_event.16.t: "Швеция принимает"
 greenland_subterfuge_event.16.d: "Шведское правительство одобрило инвестиции, и теперь мы начнем подготовку к тому, что планируем сделать с гражданским населением, чтобы обеспечить более слабую центральную власть, которая не будет так тесно связана с НАТО."
 greenland_subterfuge_event.16.o1: "Теперь мы ждём и планируем."
 greenland_subterfuge_event.17.t: "Открытие Источника"
 greenland_subterfuge_event.17.d: "Последние вспышки беспорядков и социальных дискуссий, похоже, связаны с определенными инвестициями Гренландии. Эти новые фронты вызвали некоторое беспокойство в нашем обществе, однако, если мы оставим это без внимания, в будущем нас могут ожидать серьезные проблемы. Это рискованно, но у нас есть выбор: либо бороться с продолжающимися махинациями, либо решить проблему раз и навсегда, устранив ее первопричину."
 greenland_subterfuge_event.17.o1: "У них вообще есть армия?"
 greenland_subterfuge_event.17.o2: "Нам не стоит беспокоиться об этих насекомых."
 greenland_subterfuge_event.150000.t: "Инвестиции отклонены"
 greenland_subterfuge_event.150000.d: "Швеция отклонила наше лучшее предложение, и если они его не примут, нам ничего не останется, кроме как готовиться к худшему."
 greenland_subterfuge_event.150000.o1: "Подготовка к операции «Великая Северная война»"
 greenland_subterfuge_event.18.t: "Гренландские инвестиции"
 greenland_subterfuge_event.18.d: "Гренландия предложила нам ряд инвестиций, которые не будут для нас ничего стоить. Они хотят сосредоточиться на развитии менее развитого северного региона Лаппи и способствовать единству и процветанию скандинавских стран. Однако некоторые в правительстве считают, что они преследуют скрытые цели, поскольку инвестиции кажутся слишком хорошими, чтобы быть правдой. С другой стороны, что Гренландия может реально нам сделать?"
 greenland_subterfuge_event.18.o1: "Договорились, уважаемый сэр."
 greenland_subterfuge_event.18.o2: "Думаю, сейчас нет."
 greenland_subterfuge_event.19.t: "Финляндия принимает"
 greenland_subterfuge_event.19.d: "Финское правительство одобрило инвестиции, и теперь мы начнем подготовку к достижению наших целей путем изоляции правительства и повышения восприимчивости населения к более широкому скандинавскому союзу."
 greenland_subterfuge_event.19.o1: "Стремитесь к обоснованному заключению."
 greenland_subterfuge_event.20.t: "Открытие Источника"
 greenland_subterfuge_event.20.d: "Последние вспышки беспорядков и социальных дискуссий, похоже, связаны с определенными инвестициями Гренландии. Эти новые фронты вызвали некоторое беспокойство в нашем обществе, однако, если мы оставим это без внимания, в будущем нас могут ожидать серьезные проблемы. Это рискованно, но у нас есть выбор: либо бороться с продолжающимися махинациями, либо решить проблему раз и навсегда, устранив ее первопричину."
 greenland_subterfuge_event.20.o1: "У них вообще есть армия?"
 greenland_subterfuge_event.20.o2: "Нам не стоит о них беспокоиться."
 greenland_subterfuge_event.180000.t: "Инвестиции отклонены"
 greenland_subterfuge_event.180000.d: "Финляндия отклонила наше лучшее предложение, и если они его не примут, нам ничего не останется, кроме как готовиться к худшему."
 greenland_subterfuge_event.180000.o1: "Подготовка к операции «Маннергейм»"
 GRN_colonial_subsidy_TT: "§G Дополнительный доход: §! §Y 0,300$ §!"