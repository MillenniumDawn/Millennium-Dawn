 gaddafi_family_killed_in_firefight_tt: "§Ris zginął w wyniku strzelaniny!§!"
 libya_gaddafi_family_exile_muhammad_muammar: "Wygnaj §Y[ROOT.LBA_muhammad_muammar_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_exile_saif_al_islam: "Wygnaj §Y[ROOT.LBA_saif_al_islam_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_exile_al_saadi: "Wygnaj §Y[ROOT.LBA_al_saadi_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_exile_mutassim: "Wygnaj §Y[ROOT.LBA_mutassim_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_exile_hannibal: "Wygnaj §Y[ROOT.LBA_hannibal_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_exile_ayesha: "Wygnaj §Y[ROOT.LBA_ayesha_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_exile_saif_al_arab: "Wygnaj §Y[ROOT.LBA_saif_al_arab_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_exile_khamis: "Wygnaj §Y[ROOT.LBA_khamis_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_exile_desc: "Czasami wtrącanie się dziecka w sprawy Libii może być zbyt duże. Należy ich wygnać i odesłać. Być może nauczą się doskonalić, spędzając czas z dala od domu.\n\n§WGdy na §YWygnaniu§!, cechy przywódców postaci nie mają już wpływu na nasz kraj. Możliwe jednak, że staną się zgorzkniali i zaczną aktywnie działać przeciwko ojcu i rodzeństwu. Postać zawsze może zostać przywołana, co wiąże się z §YNiestabilnością§!§!"
 libya_gaddafi_family_recall_muhammad_muammar: "Przypomnij sobie §Y[ROOT.LBA_muhammad_muammar_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_recall_saif_al_islam: "Przypomnij sobie §Y[ROOT.LBA_saif_al_islam_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_recall_al_saadi: "Przywołaj §Y[ROOT.LBA_al_saadi_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_recall_mutassim: "Przywołaj §Y[ROOT.LBA_mutassim_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_recall_hannibal: "Przywołaj §Y[ROOT.LBA_hannibal_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_recall_ayesha: "Przypomnij sobie §Y[ROOT.LBA_ayesha_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_recall_saif_al_arab: "Przypomnij sobie §Y[ROOT.LBA_saif_al_arab_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_recall_khamis: "Przywołaj §Y[ROOT.LBA_khamis_gaddafi_dummy.GetName]§!"
 libya_gaddafi_family_recall_desc: "Być może to dziecko odrobiło lekcję i jest gotowe kontynuować swoje obowiązki dla Libii.\n\n§WKiedy postać wróci z §YWygnania§!, wszystkie jej cechy przywódcy staną się ponownie aktywne!§!"
 libya_gaddafi_family_father_to_son_talk_muhammad_muammar: "Rozmowa ojca z synem z §YMuhammadem§!"
 libya_gaddafi_family_father_to_son_talk_muhammad_muammar_desc: "Mahomet nigdy nie interesował się zbytnio polityką, mimo że pewnego dnia został wyraźnym następcą swojego ojca. Być może szczera rozmowa z ojcem skieruje Mahometa na właściwą drogę?"
 libya_gaddafi_family_sensor_internet_muhammad_muammar: "Cenzor Internetu"
 libya_gaddafi_family_sensor_internet_muhammad_muammar_desc: "Pełniąc funkcję prezesa General Post and Telecommunications Company (GPTC), Muhammad ma władzę kontrolowania Internetu w Libii. Możemy blokować szkodliwe witryny i cenzurować treści wiadomości na korzyść naszego reżimu."
 libya_gaddafi_family_showcase_art_saif_al_islam: "Zaprezentuj §YSaifa§! Grafika"
 libya_gaddafi_family_showcase_art_saif_al_islam_desc: "Saif al-Islam jest utalentowanym artystą (lub przynajmniej artystą). Powinniśmy poszukać zagranicznych sponsorów korporacyjnych i zorganizować pokaz sztuki gdzieś na Zachodzie. Nazwiemy go §Y'Pustynia nie milczy'§! i będzie zawierał tradycyjne obrazy kultury libijskiej, islamskiej i arabskiej."
 saif_al_islam_artshow_great_success_tt: "§GONasi sponsorzy dostarczają nam innowacji technologicznych§!"
 saif_al_islam_artshow_success_tt: "§YWizytówka naszej kultury cementuje naszą pozycję w polityce światowej§!"
 saif_al_islam_artshow_failure_tt: "§Jesteśmy upokarzani§!"
 libya_gaddafi_family_discuss_succession_saif_al_islam: "Omów sukcesję z §YSaif§!"
 libya_gaddafi_family_discuss_succession_saif_al_islam_desc: "Konieczne może być omówienie kolejności sukcesji z Saifem. Ponieważ Mahomet nie interesuje się zbytnio polityką, byłoby lepiej, gdyby po śmierci Kaddafiego krajem rządził Saif. Przecież on znacznie bardziej interesuje się polityką i jest w tym naprawdę dobry."
 saif_al_islam_succession_talk_great_success_tt: "§GSaif zyskuje §YMyśliciela geopolitycznego§!§!"
 saif_al_islam_succession_talk_failure_tt: "§RSaif traci §YMmistrza manewru§!§!"
 libya_gaddafi_family_sue_sunday_telegraph_saif_al_islam: "Pozwij Sunday Telegraph"
 libya_gaddafi_family_sue_sunday_telegraph_saif_al_islam_desc: "In 1995, a British newspaper The Sunday Telegraph published two articles claiming that Saif al-Islam was involved in a money-laundering scheme in Cairo, with the intention of flooding Iran with fake Iranian dinars. The 2nd article claimed that after the publication of the 1st article, the author was invited to Tripoli to 'meet a sinister fate'. Both of these allegations are untrue, and we must sue the paper for libel."
 libya_gaddafi_family_improve_football_career_al_saadi: "Podnieś §YAl-Saadiego§! Kariera piłkarska"
 libya_gaddafi_family_improve_football_career_al_saadi_desc: "Al-Saadi is the president of Libya's football federation and the captain of the national football team. However, these positions haven't exactly been achieved with skill but favours from his father. He also gets special treatment in every game he plays. Perhaps if we move him to a more prestigious football league, such as one in Italy, he might become an actual footballer?"
 al_saadi_football_career_great_success_tt: "§GAl-Saadi traci §YVain Football Star§!§!"
 al_saadi_football_career_talk_failure_tt: "§RAL-Saadi zyskuje §YPlayboy Lifestyle§!§!"
 libya_gaddafi_family_create_new_city_al_saadi: "Stwórz miasto biznesowe"
 libya_gaddafi_family_create_new_city_al_saadi_desc: "Al-Saadi zasugerował utworzenie w zachodniej Libii miasta zorientowanego na biznes. To nowe miasto funkcjonowałoby podobnie do Hongkongu w Chinach i byłoby zlokalizowane pomiędzy Trypolisem a granicą tunezyjską. Miasto będzie otwarte dla wszystkich inwestorów zagranicznych, ze szczególnym uwzględnieniem sektora technologicznego. Miasto będzie miało własne lotnisko i port morski, aby ułatwić dostęp do świata. Mając niezależną administrację, miasto przyjmowałoby ludzi z całego świata, zezwalając nawet na budowę synagog i kościołów. Należy starać się pozyskać inwestorów i firmy deweloperskie do udziału w tym projekcie. Choć przez lata nic namacalnego się nie wydarzy, może to być łatwy impuls dla naszego kraju."
 libya_gaddafi_family_send_to_rehab_al_saadi: "Wyślij §YAl-Saadi§! Na rehabilitację"
 libya_gaddafi_family_send_to_rehab_al_saadi_desc: "Uzależnienie Al-Saadiego od narkotyków posunęło się za daleko. Dla jego dobra trzeba go wysłać na rehabilitację."
 al_saadi_rehab_great_success_tt: "§GAl-Saadi przegrywa §YNałogowiec§!§!"
 al_saadi_rehab_failure_tt: "§RAl-Saadi ucieka z Libii§!"
 libya_gaddafi_family_national_security_advisor_mutassim: "Zrób §YMutassim§! doradca ds. bezpieczeństwa narodowego"
 libya_gaddafi_family_national_security_advisor_mutassim_desc: "Mutassim udowodnił teraz swoją lojalność wobec państwa. W ramach rekompensaty za jego poprzednie wygnanie powinniśmy przyznać mu stanowisko Doradcy ds. Bezpieczeństwa Narodowego."
 mutassim_gaddafi_not_revolutionary_tt: "§Y[ROOT.LBA_mutassim_gaddafi_dummy.GetName]§! nie ma cechy §YPodejrzewany o rewolucjonistę§!"
 libya_gaddafi_family_additional_equipment_mutassim: "Autoryzuj §YMutassim§! Aby kupić nową broń"
 libya_gaddafi_family_additional_equipment_mutassim_desc: "Na swoim stanowisku doradcy ds. bezpieczeństwa narodowego Mutassim ma obowiązek zadbać o dobre wyposażenie wojska. Powinniśmy go nakłonić do zakupu dodatkowego wyposażenia dla armii."
 mutassim_gaddafi_national_security_advisor_tt: "§Y[ROOT.LBA_mutassim_gaddafi_dummy.GetName]§! ma cechę §YDoradca ds. Bezpieczeństwa Narodowego§!"
 libya_gaddafi_family_civilian_education_hannibal: "Powiedz §YHannibalowi§! Aby ukończyć studia"
 libya_gaddafi_family_civilian_education_hannibal_desc: "Hannibal graduated as a Bachelor of Marine Navigation from the Academy of Maritime Studies in Libya. We should send him to finish his education and get a Master's degree. The Copenhagen Business School is offering courses in Shipping Economics and Logistics, which sounds like a good place to refine Hannibal's skills."
 hannibal_gaddafi_is_bachelor: "§Y[ROOT.LBA_hannibal_gaddafi_dummy.GetName]§! posiada cechę §YLicencjat nawigacji morskiej§!"
 libya_gaddafi_family_military_education_hannibal: "Wyślij §YHannibal§! Do Akademii Marynarki Wojennej Kuzniecowa"
 libya_gaddafi_family_military_education_hannibal_desc: "Hannibal ukończył Akademię Studiów Morskich w Libii, uzyskując tytuł licencjata w dziedzinie nawigacji morskiej. Zamiast kontynuować edukację cywilną, Hannibal powinien ukończyć edukację morską w Akademii Marynarki Wojennej Kuzniecowa w [SOV.GetNameDef]. To powinno mu zapewnić większą wiedzę w sprawach morskich."
 libya_gaddafi_family_send_legal_aid_ayesha: "Wyślij §YAyesha§! Aby zapewnić pomoc prawną"
 libya_gaddafi_family_send_legal_aid_ayesha_desc: "Ayesha studiowała prawo na Uniwersytecie Paris 1 Panthéon-Sorbonne i jest doskonałym prawnikiem. Na świecie jest wielu wielkich mężów stanu, na których społeczność międzynarodowa wywiera niesłuszną presję i jest prześladowana za rzekome „zbrodnie przeciw ludzkości” i „zbrodnie wojenne”. Powinniśmy wysłać Ayeshę z jej zespołem, aby zapewniła pomoc prawną tym biednym sługom ich narodów."
 libya_gaddafi_family_military_training_aid_ayesha: "Skończ §YAyeshy§! Trening wojskowy"
 libya_gaddafi_family_military_training_aid_ayesha_desc: "Ayesha służyła w armii libijskiej i osiągnęła stopień podpułkownika. Powinniśmy wysłać ją na dalsze szkolenie oficerskie i mianować na pełnego generała. Może w ten sposób uda nam się odblokować jej ukryty potencjał."
 ayesha_gaddafi_military_education_great_success_tt: "§GAyesha Kaddafi zdobywa §YAmazonkę Libii§!§!"
 ayesha_gaddafi_military_education_failure_tt: "§RAyesha Kaddafi zyskuje §YNiedoświadczonego Generała§!§!"
 libya_gaddafi_family_business_trip_saif_al_arab: "Wyślij §YSaif al-Arab§! W Podróży Biznesowej"
 libya_gaddafi_family_business_trip_saif_al_arab_desc: "Saif często odwiedza Niemcy. To czyni go idealnym do prowadzenia transakcji biznesowych z europejskimi przedsiębiorstwami. Możemy nauczyć się sposobów poprawy naszej ekonomii i wydajności."
 libya_gaddafi_family_tech_seminar_saif_al_arab: "Wyślij §YSaif al-Arab§! Na seminarium techniczne"
 libya_gaddafi_family_tech_seminar_saif_al_arab_desc: "Saif często odwiedza Niemcy. Niemcy są domem dla wielu przedsiębiorstw przemysłowych, które przodują w technologii, a w kraju odbywają się co roku seminaria i wystawy. Powinniśmy wysłać Saifa na jedno z takich seminariów, aby zebrał najnowsze innowacje technologiczne."
 libya_gaddafi_family_military_expo_saif_al_arab: "Wyślij §YSaif al-Arab§! Na wystawę wojskową"
 libya_gaddafi_family_military_expo_saif_al_arab_desc: "Saif często odwiedza Niemcy. Niemcy mają wielu znanych producentów broni, takich jak Rheinmetall i Heckler & Koch. Powinniśmy wysłać Saifa na wystawę wojskową, żeby zobaczył, co mają do zaoferowania ci militarni giganci."
 libya_gaddafi_family_give_military_command_khamis: "Daj §YKhamis§! Dowództwo Wojskowe"
 libya_gaddafi_family_give_military_command_khamis_desc: "Khamis przeszedł szkolenie wojskowe zarówno w Libii, jak i w Akademii Wojskowej Frunze w Rosji. Teraz, gdy jest już pełnoletni, powinniśmy przyznać mu miejsce jako jednego z naszych dowódców wojskowych."
 khamis_military_command_great_success_tt: "§GKhamis zostaje wielkim §YGenerałem§!§!"
 khamis_military_command_success_tt: "§YKhamis staje się przeciętnym §YGenerałem§!§!"
 khamis_military_command_failure_tt: "§RKhamis staje się kiepskim §YGenerałem§!§!"
 libya_gaddafi_family_khamis_brigade_khamis: "Utwórz Brygadę Khamisa"
 libya_gaddafi_family_khamis_brigade_khamis_desc: "Powinniśmy stworzyć specjalną jednostkę, którą będzie mógł dowodzić Khamis. Jest najbardziej lojalnym z synów Kaddafiego i jego jednostka specjalna będzie ważna dla obrony państwa."
 khamis_mutassim_rivalry_tt: "§RBponieważ §YMutassim Kaddafi§! ma cechę §Y77 Batalion Pancerny§!, wzmożona rywalizacja pomiędzy braćmi spowoduje dodatkowe §R+15§! Niestabilność§!\n"
 libya_gaddafi_family_khamis_brigade_khamis_tt: "§YWzmocniona Brygada Ludu Zbrojnego§! jednostka jest tworzona"
 libya_gaddafi_family_aecom_khamis: "Wyślij §YKhamis§! Do Szkoły Biznesu"
 libya_gaddafi_family_aecom_khamis_desc: "While Khamis is mainly interested in military matters, it is important that he also gets a civilian education. We should send him to the IE Business School in Madrid. There is also an opening for an internship in AECOM Technology Corporation where Khamis can then continue. AECOM specialises in infrastructure, including military infrastructure of military sites."
 libya_gaddafi_family_hold_un_speech_gaddafi: "Wygłosić przemówienie w ONZ"
 libya_gaddafi_family_hold_un_speech_gaddafi_desc: "Teraz, gdy ponownie jesteśmy częścią społeczności międzynarodowej, musimy zabrać głos na Zgromadzeniu Ogólnym ONZ. Musimy wygłosić przemówienie, w którym krytykujemy Amerykanów i to, co zrobili na Bliskim Wschodzie. Musimy ogłosić nasz sprzeciw wobec izraelskiego syjonizmu. Musimy wyśmiewać Zachód za to, jak on ośmieszył nas. Dziś jest dzień, w którym Libia znajduje się w centrum uwagi!"
 libya_gaddafi_family_throw_money_gaddafi: "Rzucaj pieniądze na ulice"
 libya_gaddafi_family_throw_money_gaddafi_desc: "W Libii działa wiele organizacji pomocowych i charytatywnych. Są jednak niczym więcej niż szpiegami próbującymi kontrolować Libię. Poza tym wszystkie pieniądze, które rozdają, są po prostu bezwartościowe. Dobroczynność nie motywuje ludzi do pracy. Powinniśmy udowodnić swoją rację, podróżując przez Trypolis w konwoju, wyrzucając pieniądze na ulice. Tam jest tak samo przydatny, jak rozdawany przez organizacje charytatywne."
 libya_gaddafi_family_design_car_gaddafi: "Zaprojektuj samochód"
 libya_gaddafi_family_design_car_gaddafi_desc: "Muammar Kaddafi jest pełen wspaniałych pomysłów. Libia boryka się obecnie z wysokim wskaźnikiem śmiertelności w wypadkach drogowych. Musimy wymyślić nowy projekt samochodu. Ten samochód będzie najbezpieczniejszym samochodem na świecie."
 libya_gaddafi_family_design_car_gaddafi_tt: "We will gain a §YNational Spirit§! of our choice to modify our §YUtility Vehicles§! for §Y360§! day(s)"
 libya_gaddafi_family_state_visit_gaddafi: "Zorganizuj wizytę państwową"
 libya_gaddafi_family_state_visit_gaddafi_desc: "To improve Libya's standing in the world, we need to make an official state visit to a major country. We will turn it into a proper show and we will show the locals that Libya is a great power."
 libya_gaddafi_family_do_black_magic_gaddafi: "Zaangażuj się w czarną magię"
 libya_gaddafi_family_do_black_magic_gaddafi_desc: "Libya is under attack and our regime is in danger. In ancient times, great kings and chiefs of Africa used black magic to curse their enemies and give their troops the vigor to fight on. We must do the same for our survival's sake."
 libya_gaddafi_family_meet_women_gaddafi: "Poznaj Kobiety"
 libya_gaddafi_family_meet_women_gaddafi_desc: "Kobiety w Europie są uciskane przez chrześcijaństwo. Na Zachodzie kobiety to tylko meble dla mężczyzn, które można zmieniać, kiedy im się podoba. Musimy zorganizować wykład dla kobiet, aby edukować je na temat islamu i sprawić, by postrzegały Kaddafiego jako wielkiego wyzwoliciela kobiet."
 libya_gaddafi_family_hold_tv_speech_gaddafi: "Wygłosić przemówienie telewizyjne"
 libya_gaddafi_family_hold_tv_speech_gaddafi_desc: "Kaddafi regularnie wygłasza w telewizji przemówienia, podczas których odpowiada bezpośrednio na pytania obywateli Libii, informuje ich o najnowszych kwestiach politycznych i zachwyca się wtrącaniem się superpotęg. Wygłoszenie przemówienia to świetny sposób na przeciągnięcie ludzi na stronę Kaddafiego."
 libya_gaddafi_family_abolish_switzerland_gaddafi: "Wezwanie do demontażu Szwajcarii"
 libya_gaddafi_family_abolish_switzerland_gaddafi_desc: "Dlaczego Szwajcaria istnieje? To nic innego jak sztuczne państwo stworzone przez Napoleona lub innego europejskiego kolonizatora. Szwajcarzy to nie prawdziwi ludzie, to Włosi, Niemcy czy Francuzi. Należy zdemontować cały kraj."
 libya_gaddafi_family_abolish_switzerland_gaddafi_tt: "Jeśli się zgodzą, otrzymają §YRoszczenie§! na państwo szwajcarskie i zyskamy na nie wpływ. Jeśli są §YNacjonalistami§!, jest bardziej prawdopodobne, że zaakceptują\n\n"
 libya_gaddafi_family_anti_government_protests: "Protesty przeciwko Kaddafiemu"
 libya_gaddafi_family_anti_government_protests_desc: "The people have had enough of the ruling Gaddafi family. Poor living conditions, bad economy and limited political liberties have driven people out onto the street. If the situation doesn't improve quickly, or the Gaddafis relinquish power, there will be an open revolt against the regime."
 libya_gaddafi_family_anti_government_protests_join_rebels_tt: "§RNajwiększa partia opozycyjna przejmie władzę. Zwolennicy Kaddafiego rozpoczną przeciwko nam wojnę domową!§!"
 libya_gaddafi_family_deploy_military: "Rozmieść Korpus Strażników Rewolucji"
 libya_gaddafi_family_deploy_military_desc: "Musimy rozmieścić Korpus Strażników Rewolucji, aby rozprawił się z protestującymi. Musimy wcześnie ugasić płomienie rewolucji."
 libya_gaddafi_family_deploy_military_tt: "§RIJeśli protesty doprowadzą do wojny domowej, rebelianci będą silniejsi! Użycie siły wobec protestujących może doprowadzić do zagranicznej interwencji!§!"
 muhammad_muammar_gaddafi_not_exiled: "§Y[ROOT.LBA_muhammad_muammar_gaddafi_dummy.GetName]§! nie jest §YWygnany§!"
 saif_al_islam_gaddafi_not_exiled: "§Y[ROOT.LBA_saif_al_islam_gaddafi_dummy.GetName]§! nie jest §YWygnany§!"
 al_saadi_gaddafi_not_exiled: "§Y[ROOT.LBA_al_saadi_gaddafi_dummy.GetName]§! nie jest §YWygnany§!"
 mutassim_gaddafi_not_exiled: "§Y[ROOT.LBA_mutassim_gaddafi_dummy.GetName]§! nie jest §YWygnany§!"
 hannibal_gaddafi_not_exiled: "§Y[ROOT.LBA_hannibal_gaddafi_dummy.GetName]§! nie jest §YWygnany§!"
 ayesha_gaddafi_not_exiled: "§Y[ROOT.LBA_ayesha_gaddafi_dummy.GetName]§! nie jest §YWygnany§!"
 saif_al_arab_gaddafi_not_exiled: "§Y[ROOT.LBA_saif_al_arab_gaddafi_dummy.GetName]§! nie jest §YWygnany§!"
 khamis_gaddafi_not_exiled: "§Y[ROOT.LBA_khamis_gaddafi_dummy.GetName]§! nie jest §YWygnany§!"
 khamis_gaddafi_not_underage: "§Y[ROOT.LBA_khamis_gaddafi_dummy.GetName]§! nie ma cechy §YNieletni§!"
 libya_libyan_tribalism: "Libijski trybalizm"
 libya_libyan_tribalism_desc: "Libia jest tradycyjnie podzielona na trzy regiony: Trypolitanię na północnym zachodzie wokół stolicy, Cyrenajkę na wschodzie i Fezzan na południu. Historycznie, obszary te rządziły się same, a zjednoczyła je dopiero kolonizacja włoska. Podczas gdy zarówno Królestwo Libijskie, jak i reżim Muammara Kadafiego w większości wyeliminowały przynależność plemienną, w Libii nadal jest wiele osób, które identyfikują się ze swoim plemieniem przed narodem.\n\nPoziom lojalności regionu definiuje, jakie modyfikatory państwa otrzymują. Jeśli wartość lojalności spadnie zbyt nisko, region zbuntuje się. Jeśli jeden z regionów zbuntuje się i zostanie przyłączony z powrotem do Libii, nie będzie w stanie zorganizować kolejnego, dopóki region nie zostanie w pełni spacyfikowany. Jednak państwa nadal będą podlegać modyfikatorom państwa."
 LBA_tribalism_disabled_tt: "§Y$libya_libyan_tribalism$§! mechanik został wyłączony"
 libya_tribalism_decentralise_state: "Decentralizacja władzy"
 libya_tribalism_decentralise_state_desc: "The most effective way of pleasing all Libyan tribes is to simply reduce the power of the central government. Increased autonomy, even if it is only for a limited time, will make the tribal leaders feel they have some power."
 libya_tribalism_placate_tripolitanians: "Uspokajaj [TRP.GetNameWithFlag]"
 libya_tribalism_placate_tripolitanians_desc: "Land grants, monetary benefits, military postings and government positions are key ways to keep local separatists aligned with the central state. As long as they understand that staying part of Libya has more benefits than downsides, everything is good."
 libya_tribalism_placate_cyrenaicans: "Uspokajaj [CYR.GetNameWithFlag]"
 libya_tribalism_placate_cyrenaicans_desc: "Przyznawanie ziemi, świadczenia pieniężne, stanowiska wojskowe i stanowiska rządowe to kluczowe sposoby na utrzymanie spójności lokalnych separatystów z państwem centralnym. Dopóki zrozumieją, że pozostanie w Libii ma więcej zalet niż wad, wszystko jest w porządku."
 libya_tribalism_placate_fezzans: "Uspokajaj [FEZ.GetNameWithFlag]"
 libya_tribalism_placate_fezzans_desc: "Przyznawanie ziemi, świadczenia pieniężne, stanowiska wojskowe i stanowiska rządowe to kluczowe sposoby na utrzymanie spójności lokalnych separatystów z państwem centralnym. Dopóki zrozumieją, że pozostanie w Libii ma więcej zalet niż wad, wszystko jest w porządku."
 libya_tribalism_tripolitanian_revolt: "[TRP.GetFlag] [TRP.GetAdjective] Bunt"
 libya_tribalism_tripolitanian_revolt_desc: "W plemionach Trypolitanii panuje ruch. Jeśli nadal będą źle traktowani przez państwo centralne, przysięgli oddzielenie się od Libii."
 TT_tripolitania_loyalty_more_than_10: "Lojalność [TRP.GetNameWithFlag] > 10%"
 TT_tripolitania_loyalty_more_than_30: "Lojalność [TRP.GetNameWithFlag] > 30%"
 libya_tribalism_cyrenaica_revolt: "[CYR.GetFlag] [CYR.GetAdjective] Bunt"
 libya_tribalism_cyrenaica_revolt_desc: "W plemionach Cyrenajki panuje ruch. Jeśli nadal będą źle traktowani przez państwo centralne, przysięgli oddzielenie się od Libii."
 TT_cyrenaica_loyalty_more_than_10: "Lojalność [CYR.GetNameWithFlag] > 10%"
 TT_cyrenaica_loyalty_more_than_30: "Lojalność [CYR.GetNameWithFlag] > 30%"
 libya_tribalism_fezzan_revolt: "[FEZ.GetFlag] [FEZ.GetAdjective] Bunt"
 libya_tribalism_fezzan_revolt_desc: "W plemionach Fezzanu panuje ruch. Jeśli nadal będą źle traktowani przez państwo centralne, przysięgli oddzielenie się od Libii."
 TT_fezzan_loyalty_more_than_10: "Lojalność [FEZ.GetNameWithFlag] > 10%"
 TT_fezzan_loyalty_more_than_30: "Lojalność [FEZ.GetNameWithFlag] > 30%"
 libya_tribalism_dismantle_libya: "Zdemontować Libię"
 libya_tribalism_dismantle_libya_desc: "Libia się rozpadła. Straciliśmy dwa z trzech głównych regionów. Czy jest jakiś powód, aby nadal nazywać siebie Libią, skoro jesteśmy jedynie cieniem samego siebie?"
 libya_libyan_foreign_policy: "Libijska polityka zagraniczna"
 libya_core_northern_chad: "Zintegruj Czad Północny"
 libya_core_northern_chad_desc: "Północny Czad jest bardzo słabo zaludniony i brakuje mu zasobów. Ponadto znaczna część jego populacji to członkowie Toubou, którzy również żyją w południowej Libii. Dzięki temu stosunkowo łatwo jest spacyfikować region."
 libya_core_northern_niger: "Zintegruj Północny Niger"
 libya_core_northern_niger_desc: "Północny Niger, choć jest to bardzo biedny region, ma więcej ludności niż cała Libia. Chociaż wspólna religia pomaga, przejęcie pełnej kontroli nad tym obszarem nadal będzie wymagało znacznego wysiłku."
 libya_core_algerian_sahara: "Integracja Sahary Algierskiej"
 libya_core_algerian_sahara_desc: "Algierska część Sahary jest słabo zaludniona i zamieszkuje ją głównie ludność pasterska. Wielu z nich już sympatyzuje z islamskimi powstańcami z wojny domowej. Pacyfikacja regionu nie powinna zająć dużo czasu."
 libya_core_northern_mali: "Zintegruj Azawada"
 libya_core_northern_mali_desc: "While Azawad had an existing Islamist insurgency in our favour, the region has a long history of separatism and a strong Tuareg identity. The region will be very difficult to integrate."
 libya_core_mauritanian_sahara: "Integracja mauretańskiego Sahelu"
 libya_core_mauritanian_sahara_desc: "Społeczeństwo Mauretanii jest bardzo odporne na nasze wysiłki integracyjne. Nie mają sympatii dla naszej ideologii ani nie mają zbyt wielu powiązań religijnych czy kulturowych. Ale poddadzą się tak samo jak wszyscy inni."
 libya_core_palestine: "Zintegrować Palestynę"
 libya_core_palestine_desc: "Palestyna jest bardzo zaludniona w porównaniu do Libii i zamieszkuje mieszaną populację palestyńskich muzułmanów i izraelskich Żydów. Integracja obszaru będzie bardzo trudna i kosztowna."
 libya_pacify_cyrenaica: "Uspokojenie [CYR.GetNameWithFlag]"
 libya_pacify_cyrenaica_desc: "Wschodnia część Libii zbuntowała się, a my stłumiliśmy ich mały bunt. Oczekuje się dalszego oporu, ale nie powinno minąć dużo czasu, zanim ponownie uzyskamy pełną kontrolę nad regionem."
 libya_pacify_tripolitania: "Uspokojenie [TRP.GetNameWithFlag]"
 libya_pacify_tripolitania_desc: "Zachodnia część Libii zbuntowała się, a my stłumiliśmy ich mały bunt. Oczekuje się dalszego oporu, ale nie powinno minąć dużo czasu, zanim ponownie uzyskamy pełną kontrolę nad regionem."
 libya_pacify_fezzan: "Uspokojenie [FEZ.GetNameWithFlag]"
 libya_pacify_fezzan_desc: "Zbuntowała się południowa część Libii, a my stłumiliśmy ich mały bunt. Oczekuje się dalszego oporu, ale nie powinno minąć dużo czasu, zanim ponownie uzyskamy pełną kontrolę nad regionem."
 libya_pacify_tuaregs: "Uspokój [918.GetName]"
 libya_pacify_tuaregs_desc: "Tuaregowie z [918.GetName] muszą zostać nauczeni, jak ponownie szanować nasze rządy."
 libya_pacify_toubou: "Uspokój Toubou"
 libya_pacify_toubou_desc: "Lud Toubou powinien zostać ponownie oddany pod kontrolę Libii."
 libya_liberate_minorities: "Wyzwolić mniejszości w [FROM.GetNameDef]"
 libya_liberate_minorities_desc: "Obecna sytuacja mniejszości etnicznych w [FROM.GetNameDef] jest nie do zniesienia. Musimy domagać się dalszej autonomii dla tych uciskanych ludzi."
 libya_liberate_minorities_tt: "Jeśli [FROM.GetName] zaakceptuje nasze żądania,\n"
 libya_launch_oef: "Uruchom operację [FROM.GetAdjective] Tarcza"
 libya_launch_oef_desc: "Ekstremizm zapuszcza korzenie w [FROM.GetNameDef], a rząd [FROM.GetAdjective] jest całkowicie bezsilny lub nie chce go powstrzymać. Musimy działać szybko, zanim choroba rozprzestrzeni się również na Libię."
 libya_build_rail_to_tunisia: "Połącz linię kolejową z [TUN.GetNameWithFlag]"
 libya_build_rail_to_tunisia_desc: "Tunezja na naszym Zachodzie jest bardzo stabilnym krajem i ważnym punktem europejskiej turystyki. Jeśli połączymy się tam koleją, może część turystów też chętniej nas odwiedzi."
 libya_build_rail_to_tunisia_tt: "Koszt tego projektu wyniesie $§Y4,00§!.\n"
 libya_build_rail_to_tunisia_tt_2: "§RThe cost will be doubled because we have the national spirit §Y$LBA_libyan_gauge_railroads$§!§!\n"
 libya_build_rail_to_egypt: "Połącz linię kolejową z [EGY.GetNameWithFlag]"
 libya_build_rail_to_egypt_desc: "Podczas II wojny światowej alianci zbudowali tymczasową linię kolejową z Sollum w Egipcie do Tobruku. Jednak libijska strona kolei została rozebrana po uzyskaniu przez Libię niepodległości. Powinniśmy ponownie połączyć Tobruk z Sollum, aby ułatwić dostęp do żeglugi Kanałem Sueskim."
 libya_build_rail_to_egypt_tt: "Koszt tego projektu wyniesie $§Y2,00§!.\n"
 libya_build_rail_to_niger: "Połącz linię kolejową z [NGR.GetNameWithFlag]"
 libya_build_rail_to_niger_desc: "Niger has no existing railroads. This makes them very isolated from the world. If we build a railway there, we can bring them closer to our sphere of influence."
 libya_build_rail_to_niger_tt: "Koszt tego projektu wyniesie $§Y7,00§!.\n"
 libya_build_rail_to_chad: "Połącz linię kolejową z [CHA.GetNameWithFlag]"
 libya_build_rail_to_chad_desc: "Czad nie ma kolei. Powinniśmy zbudować linię kolejową do ich stolicy, aby uczynić ich bardziej zależnymi od nas. Biorąc jednak pod uwagę historię współpracy Chada z nami, jest mało prawdopodobne, że zgodzi się on na umowę."
 libya_build_rail_to_chad_tt: "Koszt tego projektu wyniesie $§Y6,00§!.\n"
 libya_negotiations_with_un: "Trwające negocjacje z ONZ"
 libya_negotiations_with_un_desc: "W związku z naszymi wrogimi działaniami społeczność międzynarodowa nałożyła na nas sankcje. Musimy negocjować z ONZ, aby dojść do wniosku, co musimy zrobić, aby pozbyć się tych sankcji. Im lepiej będziemy się zachowywać na arenie międzynarodowej, tym szybciej będzie przebiegał ten proces."
 libya_negotiations_with_un_tt: "We will be able to start the focus §Y$LBA_remove_sanctions$§!"
 libya_casablanca_accords: "Porozumienia z Casablanki"
 libya_casablanca_accords_desc: "We are in the process of negotiating a lasting peace in Western Sahara. We need to convince all the partaking countries that our solution will work. Even if we fail to convince all countries, the majority of countries can try to enforce the solution to the opposing side. This however, can lead to an escalation of the conflict."
 libya_casablanca_accords_success_tt: "Wszystkie delegacje podpisały plan pokojowy (obecny [?libya_casablanca_accords_no_of_signatories] z [?libya_casablanca_accords_no_of_participants])"
 libya_casablanca_accords_fail_tt: "Liczba delegacji jest mniejsza niż 2 (bieżąca [?libya_casablanca_accords_no_of_participants])"
 libya_casablanca_accords_SHA_resistance_tt: "§R[SHA.GetNameWithFlag] sprzeciwi się tej decyzji!§!"
 libya_casablanca_accords_MOR_resistance_tt: "§R[MOR.GetNameWithFlag] sprzeciwi się tej decyzji!§!"
 libya_casablanca_accords_draft_solution: "Projekt pokojowego rozwiązania dla Sahary Zachodniej"
 casablanca_accords_convince_x_tt: "Zrobiliśmy §Y$libya_casablanca_accords_draft_solution$§!"
 libya_casablanca_accords_hold_negotiations: "Wstrzymaj negocjacje"
 libya_casablanca_accords_hold_negotiations_tt: "Spowoduje to aktualizację prawdopodobieństwa, że ​​inni uczestnicy zaakceptują nasze rozwiązanie."
 libya_casablanca_accords_at_least_one_neg_tt: "Dokonaliśmy §Y$libya_casablanca_accords_hold_negotiations$§! przynajmniej raz"
 libya_casablanca_accords_convince_accept_tt: "nich §GAkceptuję§! rozwiązanie"
 libya_casablanca_accords_convince_reject_tt: "je §RRodrzucając§! rozwiązanie"
 libya_casablanca_accords_convince_target_tt: "Ich §Prawdopodobieństwo§! akceptacji opiera się na ich początkowym stanowisku. To jest następnie dodawane do naszego §YWpływu§! na nich. Jest to dodatkowo mnożone przez ich §YOpinię i Perspektywy§!.\n\nJeśli odrzucą rozwiązanie, decyzja ta stanie się ponownie dostępna po §Y30 dniach§!. Za każdym razem, gdy odrzucą rozwiązanie, istnieje szansa, że ​​opuszczą konferencję\n"
 libya_casablanca_accords_convince_morocco: "Przekonaj [MOR.GetNameWithFlag]"
 libya_casablanca_accords_convince_morocco_desc: "Przeprowadź dyskusję z delegatami [MOR.GetAdjective], czy zaakceptują naszą obecną umowę."
 libya_casablanca_accords_convince_sahrawi: "Przekonaj [SHA.GetNameWithFlag]"
 libya_casablanca_accords_convince_sahrawi_desc: "Przeprowadź dyskusję z delegatami [SHA.GetAdjective], czy zaakceptują naszą obecną umowę."
 libya_casablanca_accords_convince_algeria: "Przekonaj [ALG.GetNameWithFlag]"
 libya_casablanca_accords_convince_algeria_desc: "Przeprowadź dyskusję z delegatami [ALG.GetAdjective], czy zaakceptują naszą obecną umowę."
 libya_casablanca_accords_convince_mauritania: "Przekonaj [MAU.GetNameWithFlag]"
 libya_casablanca_accords_convince_mauritania_desc: "Przeprowadź dyskusję z delegatami [MAU.GetAdjective], czy zaakceptują naszą obecną umowę."
 libya_anti_colonial_start_revolution: "Przygotuj rewolucję w [FROM.GetNameWithFlag]"
 libya_anti_colonial_start_revolution_desc: "Dekadencki rząd [FROM.GetNameDef] uciska swój lud. Są niczym innym jak psem pokojowym dla Zachodu i należy ich obalić w imię wolności i wolności."
 libya_anti_colonial_start_revolution_tt_1: "§R[FROM.GetNameWithFlag] może wypowiedzieć nam wojnę z wyprzedzeniem!§!\n"
 libya_anti_colonial_start_revolution_tt_2: "§GStrona buntownicza dołączy do naszej frakcji!§!"
 libya_oil_nationalisation_dynamic_modifier: "Nacjonalizacja ropy"
 TT_libya_oil_nationalisation_dynamic_modifier: "Poziom nacjonalizacji: §Y[?lba_oil_nationalisation|%0]§!\nDodatkowy dochód: $$[?oil_nationalisation_income|+3] miliardy na §YWydobyty olej§!\n"
 libya_oil_nationalisation_dynamic_modifier_desc: "Much of the oil production in Libya is controlled by the National Oil Corporation. While beneficial for the state, international investments from foreign companies are limited. A higher level of nationalisation will hurt our productivity growth and make it more expensive to develop new oil fields."
 libya_gaddafi_instability_dynamic_modifier: "Niestabilność rodziny"
 libya_gaddafi_instability_dynamic_modifier_desc: "Gaddafi's eccentricity and his insistence on favouring his children in politics causes more and more resistance from the Libyan population"
 LBA_head_of_gptc_idea_version: "Prezes Generalnej Spółki Pocztowej i Telekomunikacyjnej"
 LBA_uninterested_in_politics_idea_version: "Niezainteresowany polityką"
