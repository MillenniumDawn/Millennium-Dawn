 UKR_develop_an_lbl: "Develop a Proposed Antonov Light Aircraft"
 UKR_develop_an_lbl_desc: "The Antonov Light Aircraft is a proposed light aircraft designed by the Antonov Design Bureau that is expected to be close to Yak-130. It is intended for use in various roles, including training and reconnaissance.The aircraft is expected to feature advanced avionics, a lightweight airframe, and efficient engines to provide excellent performance and fuel efficiency."
