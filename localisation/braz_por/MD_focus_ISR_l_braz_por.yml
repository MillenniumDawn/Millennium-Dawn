 israel.120.t: "Líderes do Movimento Cova do Leão capturados!"
 israel.120.d: "Recentemente, forças israelenses sitiaram Nablus e capturaram os líderes do Movimento Cova do Leão."
 israel.120.a: "Muito lamentável."
 israel.121.t: "Operação israelense fracassada!"
 israel.121.d: "Recentemente, forças israelenses sitiaram Nablus e tentaram capturar os líderes do Movimento Cova do Leão. No entanto, não tiveram sucesso."
 israel.121.a: "Muito bom."
 anti_palestine_propaganda: "Propaganda Anti-Palestina"
 anti_abbas_propaganda: "Propaganda Contra Abbas"
 daniel_lions_cage_1: "Operação Daniel na Cova do Leão"
 israel.122.t: "Israel pede nosso envolvimento nas Operações Antiterrorismo!"
 israel.122.d: "Após a recente crise na Cisjordânia, Israel exige nossa participação nas operações antiterrorismo que planeja realizar em nosso território. Devemos concordar?"
 israel.122.a: "Isso ajudaria a legitimar nosso governo."
 israel.122.b: "Jamais colaboraremos com os sionistas!"
 israel.123.t: "Serviços de Segurança Palestinos concordam em dividir responsabilidades!"
 israel.123.d: "Foi alcançado um acordo para iniciar uma ação antiterrorismo na Cisjordânia. Agora devemos coordenar e agir rapidamente."
 israel.123.a: "Ótimo!"
 israel.124.t: "Abbas rejeita envolvimento nas Operações Antiterrorismo!"
 israel.124.d: "O governo da Cisjordânia rejeitou qualquer cooperação conosco mesmo diante da ameaça terrorista em seu solo. Eles não querem cooperar com o nosso país."
 israel.124.a: "Pff!"
 theymayrej_pal_tt: "Se §Y[PAL.GetNameWithFlag]§! §Rrejeitar§! §Gnossa proposta§!, este §Yfoco§! ficará §Ynão concluído§! e §Gvoltaremos às outras opções!§!"
 pal_rejected_conter: "A Palestina rejeitou a proposta de cooperação antiterrorismo."
 israel.125.t: "O Maptash entrega equipamento para a Operação Antiterrorismo!"
 israel.125.d: "Israel nos envia equipamento para que estejamos preparados para a futura operação."
 israel.125.a: "Ficamos felizes em receber seu apoio."
 coract_gaz_tt: "§YPrecisaremos decidir o curso de ação sobre o que fazer com Gaza...§!"
 israel.126.t: "Israel propõe Hudna!"
 israel.126.d: "Recentemente, após nossa tomada de Gaza, o governo israelense nos procurou com uma proposta de suspender o bloqueio em troca de uma trégua de longo prazo. Eles também prometem investimentos em nossa economia caso aceitemos. O que devemos fazer?"
 israel.126.a: "Mais um plano sionista idiota!"
 israel.126.b: "Dinheiro primeiro, cavalheiros..."
 hudna_accept: "Gaza aceitou a Hudna!"
 hudna_notaccept: "Gaza rejeitou a Hudna!"
 hudna_whatdo_tt: "Enviaremos uma §Ycarta§! para §R[HAM.GetNameWithFlag]§! com uma §Yproposta econômica e política§!.\n\n§6Isso decidirá o destino da Faixa de Gaza...§!"
 israel.127.t: "[HAM.GetNameWithFlag] rejeita!"
 israel.127.d: "[HAM.GetNameWithFlag] rejeitou nossa proposta político-econômica e não cooperará conosco em nenhuma circunstância.\n\nPelo visto, não há negociação possível com eles..."
 israel.127.a: "Pior para eles."
 israel.128.t: "[HAM.GetNameWithFlag] aceita!"
 israel.128.d: "Surpreendentemente, [HAM.GetNameWithFlag] aceitou nossa proposta e cooperará conosco, apesar de suas declarações anteriores de animosidade.\n\nA vida é surpreendente, não é?"
 israel.128.a: "Funcionou mesmo?"
 PAL_closing_gates_all_open: "§9Fechando os Portões§! §GTudo Aberto§!"
