 ECU.conservatism: "£ECU_western_conservative (DP) 大众民主"
 ECU.conservatism_desc: "（基督教民主主义）- 该党成立于1979年，由社会基督教联盟和保守党的温和派成员组成，最初是一个立场偏中间的政党。自20世纪90年代以来，该党逐渐向右翼靠拢，采取了更为保守和传统的基督教民主立场。"
 ECU.socialism: "£ECU_western_social_democrat (ID) 民主左派"
 ECU.socialism_desc: "（民主社会主义）- 成立于1970年的民主左翼党在国家恢复民主后取得了巨大的选举胜利。该党赢得总统职位后，得以指导新恢复的民主秩序。此后，该党在选举中取得的进展较为缓慢，但名义上仍坚持其进步主义、社会正义和经济平等的纲领。"
 ECU.anarchist_communism: "£ECU_anarchist_communism (PAIS) 主权祖国联盟/骄傲与主权的祖国（左翼）"
 ECU.anarchist_communism_desc: "（21世纪社会主义）- 作为席卷拉丁美洲的“粉红浪潮”的一部分，骄傲与主权的祖国最初奉行温和的左翼纲领，将玻利瓦尔主义、进步主义和社会主义思想融合在一起，形成一个广泛的左翼民粹主义联盟。尽管初期取得了成功，但该党逐渐向中间靠拢，党内右倾势力日益壮大，这主要受到“第三道路”以及自由主义理念的影响。"
 ECU.Neutral_conservatism: "£ECU_non_aligned_conservative (PSC) 基督教社会党"
 ECU.Neutral_conservatism_desc: "（基督教民主主义）- 成立于1951年，原名“基督教社会运动”，该党政治立场偏右，立场坚定保守，与基督教民主运动高度一致。该党拥有虽小但稳固的支持基础，并在选举中取得过一些持续的成功。"
 ECU.neutral_Social: "£ECU_neutral_Social (MUPP) 帕查库蒂克多民族团结运动 - 新国家"
 ECU.neutral_Social_desc: "（原住民主义）- 也简称“帕查库蒂克党”，该党成立于1995年，由一些大型原住民权利组织发起成立。虽然该党的主要关注点是厄瓜多尔境内的原住民权利问题，但它也采取了更广泛的左翼纲领，融合了生态社会主义和社会正义。其名称“帕查库蒂克”源自克丘亚语“Pacha”和“Kuti”，大致意思是“通过动荡改变世界”。"
 ECU.Nat_Autocracy: "£ECU_nationalist_military_junta 厄瓜多尔武装力量"
 ECU.Nat_Autocracy_desc: "（务实军政府）- 厄瓜多尔武装部队成立于1830年，其前身是与西班牙作战的民兵，后来发展成为大哥伦比亚的一部分。自那时起，其大部分行动都是国内冲突、海外任务或与邻国秘鲁的小规模冲突 - 最近一次冲突发生在1995年。厄瓜多尔武装部队通过联合国积极参与国际事务，为多项任务派遣士兵和观察员。"
 ECU.Nat_Populism: "£ECU_nationalist_right_wing_populist (PRE)厄瓜多尔罗尔多斯党"
 ECU.Nat_Populism_desc: "（左翼民粹主义）- 该党成立于1982年，以创始人阿卜杜拉·布卡拉姆为核心，其名称源自前总统海梅·罗尔多斯，后者曾是民粹主义政党“人民力量联盟”的成员，该联盟名义上是进步派。该党在意识形态上主要支持布卡拉姆的政治纲领。布卡拉姆于1996年当选总统，但次年便因精神状态问题被弹劾，此前他曾多次与媒体发生冲突，且民众支持率下降。"
 ECU.oligarchism: "£ECU_non_aligned_oligarchism 洛斯乔内罗斯"
 ECU.oligarchism_desc: "（卡特尔统治）- 作为锡那罗亚卡特尔的一部分，洛斯乔内罗斯是其在厄瓜多尔的武装力量。他们的主要活动是贩毒，但为了维持权力并与敌对帮派竞争，该组织也诉诸谋杀、抢劫甚至暗杀等手段。"
 EGU.Neutral_Autocracy: "£generic_Neutral_Autocracy_small 赤道几内亚民主党"
 EGU.Neutral_Autocracy_desc: ""
 EGY.conservatism: "£EGY_conservatism 保守党"
 EGY.conservatism_desc: "（务实保守主义）- 该党由作家兼记者穆斯塔法·阿卜杜勒·阿齐兹创立。该党成立之初便吸纳了众多埃及知名记者和公众人物。现任领导人阿克马尔·克尔塔姆曾是民族民主党的重要成员。\n\n该党来自§H军方的看法§!为§G+50§!"
 EGY.liberalism: "£EGY_liberalism_alt 埃及爱国运动"
 EGY.liberalism_desc: "（改革主义）- 埃及爱国运动，或称埃及民族运动，是由前总统候选人艾哈迈德·沙菲克和自由埃及人党前副主席、埃及人生活党创始人穆罕默德·阿布·哈米德发起成立的政党。\n\n该党来自§H军方的看法§!为§G+50§!"
 EGY.socialism: "£EGY_socialism 现代埃及党"
 EGY.socialism_desc: "（中间主义）- 现代埃及党是一个由前民族民主党成员组成的埃及政党。\n\n该党来自§H军方的看法§!为§G+50§!"
 EGY.Western_Autocracy: "£EGY_Autocracy_small 国家民主党"
 EGY.Western_Autocracy_icon: "£EGY_Autocracy_small"
 EGY.Western_Autocracy_desc: "（大帐篷）- 民族民主党是一个威权中间派政党。从成立之初起，它就是阿拉伯社会主义联盟（自1962年以来一直是唯一执政党）中诞生的迄今为止最强大的政党，因此被视为其有机继承者。与阿拉伯社会主义联盟大力强调阿拉伯民族主义和阿拉伯社会主义（纳赛尔主义）相反，民族民主党发展成为一个温和的中间派政党。\n\n该党来自§H军方的看法§!为§G+50§!"
 EGY.Conservative: "£EGY_Conservative 祖国保卫者党"
 EGY.Conservative_desc: "（中间主义）- 国土保卫者党是埃及的一个中间派政党。它是由一群退休军官和温和右翼政策的倡导者创立的。该党最终扩大规模，在全国各地开设了新的党总部和支部。它达到了1000个单位和一个新的党总部。\n\n该党来自§H军方的看法§!为§H中立§!"
 EGY.anarchist_communism: "£EGY_anarchist_communism 工人民主党"
 EGY.anarchist_communism_desc: "（革命社会主义）- 该党最重要的原则是尊重所有埃及人的宗教信仰并结束基于宗教、肤色或性别的歧视。工业重新国有化是工人民主党的主要诉求之一，但与贾迈勒·阿卜杜勒·纳赛尔领导下国有工厂负责人由总统任命的情况不同，工人民主党呼吁这些工厂的工人任命自己的经理。世界民主党主张废除私有化和垄断政策，并重新调整发展计划，以造福于服务不足的社会阶层。该党还与其他力量协调，为埃及工人制定更高的最低工资，建立独立于国家的工会，并改善所有工作场所的工作条件。他们还呼吁打击行政腐败并重新评估埃及与以色列的经济关系。他们的口号是工人必须团结起来。\n\n该党来自§H军方的看法§!为§H中立§!"
 EGY.Caliphate: "£generic_Caliphate_small 圣战者组织"
 EGY.Caliphate_desc: "（圣战派）- 埃及伊斯兰圣战和圣地解放军最初被称为“圣战”，后来被称为“圣战组织”或“圣战组织”，是自20世纪70年代末以来活跃的埃及伊斯兰组织。作为基地组织的附属机构，它受到联合国的全球禁运。\n\n该党来自§H军方的看法§!为§R-50§!"
 EGY.Kingdom: "£EGY_kingdom 光明党"
 EGY.Kingdom_desc: "（萨拉菲主义）- 光明党，或称“光明之党”，秉持极端保守的伊斯兰主义意识形态，主张实施严格的伊斯兰教法。该党被视为萨拉菲宣教协会的政治分支，并且凭借其长期的组织管理经验与富有魅力的领导人，已成为埃及多个新兴萨拉菲政党中最具影响力的一个。其政治目标在于建立一个类似沙特阿拉伯瓦哈比主义的政教合一国家。根据德国公共电视新闻机构ARD的报道，沙特阿拉伯被确认为该党的主要资助方。\n\n该党派的§H军事立场§!为§R-50§!。"
 EGY.Neutral_conservatism: "£EGY_Neutral_conservatism 伊斯兰党"
 EGY.Neutral_conservatism_desc: "（伊斯兰主义）- 伊斯兰党是埃及的一个伊斯兰政党。 该组织的主要领导人是穆罕默德·阿布·萨姆拉和卡迈勒·哈比卜。该党得到埃及伊斯兰圣战组织的支持。该党的大多数创始人都是该组织的前成员。该党的许多成员都被法院裁决禁止竞选公职。\n\n该党来自§H军方的看法§!为§H中立§!"
 EGY.oligarchism: "£EGY_oligarchism 共和人民党"
 EGY.oligarchism_desc: "（中间主义）- 该党在参议院的议会机构由众议员伊哈卜·瓦赫巴领导。从意识形态上看，该党是一个公民、自由主义政党，有代表中左翼的固定路线，其政治经济纲领和思想也代表了这一趋势。\n\n该党来自§H军方的看法§!为§H中立§!"
 EGY.neutral_Social: "£EGY_neutral_Social 埃及社会民主党"
 EGY.neutral_Social_desc: "（右翼社会民主主义）- 埃及社会民主党是埃及的一个社会自由党和社会民主党。它强调自由市场经济和社会正义，作为自由民主制度的一部分。其计划的基石是一部保证公民国家以公民身份为基础的宪法。这与塔加穆党和自由埃及人党等其他政党类似。埃及社会民主党倡导保护和促进埃及的人权。这包括加强公民自由、言论自由和保护少数群体权利的努力。\n\n该党来自§H军方的看法§!为§H中立§!"
 EGY.Neutral_Autocracy: "£EGY_Neutral_Autocracy 科普特正教会"
 EGY.Neutral_Autocracy_desc: "（神权民主主义）- 科普特人是生活在埃及南部的民族宗教土著民族。科普特人拥有自己独立的基督教教派身份，集中并集中在科普特东正教教会内，因此常常与政治生活分离。\n\n该党来自§H军方的看法§!为§R-50§!"
 EGY.Neutral_Communism: "£EGY_Neutral_Communism 革命社会主义党"
 EGY.Neutral_Communism_desc: "（托洛茨基主义）- 革命社会主义者是埃及的一个托洛茨基主义组织，起源于自下而上的社会主义传统。革命社会主义者的主要成员包括社会学家萨米·纳吉布。\n\n该党来自§H军方的看法§!为§H中立§!"
 EGY.Neutral_Muslim_Brotherhood: "£EGY_Neutral_Muslim_Brotherhood 自由与公正党"
 EGY.Neutral_Muslim_Brotherhood_desc: "（自由伊斯兰主义）- 自由与正义党是埃及的一个伊斯兰政党。它名义上是独立的，但与埃及最大的政治团体埃及穆斯林兄弟会有着密切的联系。该党被取缔并解散；然而，它仍然在地下运作。\n\n该党来自§H军方的看法§!为§R-100§!"
 EGY.Neutral_green: "£EGY_Neutral_Green 改革与发展党"
 EGY.Neutral_green_desc: "该党的创始人是前总统安瓦尔·萨达特的侄子穆罕默德·安瓦尔·埃斯马特·萨达特和埃及亿万富翁雷蒙德·拉卡。\n\n该党来自§H军方的看法§!为§H中立§!"
 EGY.Nat_Autocracy: "£EGY_Nat_Autocracy 埃及武装力量"
 EGY.Nat_Autocracy_desc: "（务实军政府）- 埃及武装部队是阿拉伯埃及共和国的军事组织，旨在保护国家的自由、独立和领土完整。 由陆军、海军、空军和防空部队组成。\n\n该党来自§H军方的看法§!为§G+100§!"
 EGY.Nat_Populism: "£EGY_Nat_Populism_alt 埃及华夫脱党"
 EGY.Nat_Populism_desc: "（民族自由主义）- 新华夫脱党，正式名称为埃及华夫脱党，是埃及的一个民族主义自由党。它是埃及最古老、历史上最活跃的政党之一瓦夫脱党的延伸，该党在1952年革命后被解散。新华夫脱党成立于1978年，但仅几个月后就被取缔。1981年安瓦尔·萨达特总统遇刺后，该活动又重新兴起。\n\n该党来自§H军方的看法§!为§H中立§!"
 EGY.Monarchist: "£EGY_Monarchist 阿拉维王朝"
 EGY.Monarchist_desc: "（世俗君主主义）- 穆罕默德·阿里王朝是19世纪至20世纪中叶埃及和苏丹的统治王朝。它以其祖先、被视为现代埃及创始人的埃及穆罕默德·阿里的名字命名。\n\n该王朝来自§H军方的看法§!为§H中立§!"
