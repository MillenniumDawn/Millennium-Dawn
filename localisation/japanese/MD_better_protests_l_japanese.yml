 MD_DRIFT_DEBT_INTEREST_TEXT: "高金利:"
 MD_DRIFT_DEBT_INTEREST_VALUE: "[?drift_debt_interest_last|=-1]"
 MD_drift_debt_interest_tt: "The §YInterest Rate§! on sovereign debt is above §Y8.9%§!. Debt service crowds out spending and the public blames the government.\n\nPay down debt from the §YMoney§! tab. National spirits, world tension, and the §YPolicy Rate§! also feed this rate. Anything below §G8.9%§! removes this driver. The further above the threshold the rate sits, the larger the monthly hit. With no debt the rate is §G0%§! and this driver drops out."
 MD_protests_concessions_title: "§YPolitical Concessions§!"
 MD_protests_give_promises: "Give Promises"
 MD_protests_give_promises_tt: "§YGive Promises§!\n§gPublic promises to hear the street out. Cheap words calm the crowds, but they cost the government some credibility.§!\n\n§YPrerequisites:§!\n[!MD_protests_give_promises_button_click_enabled]\n§YEffects:§!\n[!MD_protests_give_promises_button_click]"
 MD_protests_give_promises_strength_tt: "Protest Strength: §G-5§! or §G-10§! (50% chance each)"
 MD_protests_delve_demands: "Delve into Demands"
 MD_protests_delve_demands_tt: "§YDelve into Demands§!\n§gThe government sits down with protest leaders and takes their grievances seriously. We give in on one of their spending demands. The street calms down, but the budget pays for it every month.§!\n\n§YPrerequisites:§!\n[!MD_protests_delve_demands_button_click_enabled]\n§YEffects:§!\n[!MD_protests_delve_demands_button_click]"
 MD_protests_delve_demands_effect_tt: "Raises one random underfunded spending law (a §Rred§! square on the grid below) by §Y1§! level. The higher law costs money every month."
 MD_protests_has_unmet_demand_tt: "At least one spending law is funded below what citizens expect (a §Rred§! square)"
 MD_protests_bribe: "Bribe the Protestors"
 MD_protests_bribe_tt: "§YBribe the Protestors§!\n§gQuiet payments to protest organisers keep a small movement from growing. It works only before the crowds get too large.§!\n\n§YPrerequisites:§!\n[!MD_protests_bribe_button_click_enabled]\n§YEffects:§!\n[!MD_protests_bribe_button_click]"
